  title: 'Base-size axis of pair-sum coincidences: the nontrivial pair-sum coincidence count of window
    (d = 1) and rank-d label-GAP (d = 2, 3) symmetric bases on prime-order E/F_p is within 5% of a matched
    uniformly random symmetric base of the same size at every powered cell bits in {16,18,20,22}, theta in
    [0.30, 0.65], 16 <= b <= 8192 (heuristic H1 of IDEA-20261017-077f12, scoped toy form)'
  statement: >-
    On prime-order ordinary curves E/F_p generated by curve.generate_prime_order_curve(bits, seed) (vendored
    copy of src/crypto_autoresearcher/index_calculus/curve.py) with bits in {16, 18, 20, 22}, let F be a
    symmetric base (F = -F) of exactly b points, b = 2*round(2^(bits*theta)/2), theta in {0.30, 0.35, ...,
    0.65}, 16 <= b <= 8192, built either as a window (d = 1: consecutive x from a uniform x0) or as a rank-d
    label GAP x0 + a + c*w1 (+ e*w2) (d = 2, 3; w uniform in [1, p); box side ceil(b^(1/d)), lexicographic
    fill, outermost index unbounded so the last layer is partial). Let C(F) = sum over s != O of
    binom(m_s, 2), m_s = #unordered {P, Q} in F with P != Q, Q != -P, P + Q = s. Then in every powered cell
    (bits, theta, d) the pooled ratio kappa = sum_curves C(F_struct) / sum_curves mean C(F_null), against 20
    uniformly random symmetric bases of the same b on the same curve, satisfies |kappa - 1| < 0.05 with its
    curve-cluster bootstrap 95% interval inside [0.90, 1.10]. Tested scope: the 90 cells above, the curve
    seed blocks of EXP-PFDR-ca5e01, the exact counting convention above, toy scale only. Nothing about h >= 3,
    other p, any cost, or any cryptographic size. Source: IDEA-20261017-077f12 claim and heuristic H1; the
    counting convention and cell grid are those of experiments/EXP-PFDR-ca5e01/implementation/run.py.
  mechanism: >-
    (From IDEA-20261017-077f12.) Pair (representation, Sigma) = (R1 x-labels in a rank-d GAP, translation by
    factor-base elements); trichotomy partial-action, Class I of IDEA-20260806-c5d183. Tracked object: the
    multiset of group pair sums P + Q, read as one integer C(F); the projection discards which pairs collide
    and is Sigma-compatible (translation by T in F maps a coinciding pair to a coinciding pair). Exact in
    O(b^2) group additions, no logarithms. Parseval: Energy(F) = b^4/N + N^-1 sum_{chi != 1} |F^(chi)|^4 <=
    b^4/N + K^2 b, so the excess is negligible iff b^3 >> K^2 N; with a Weil-type K <~ p^(1/2) log p
    (recalled) this is b >= p^(2/3). Below p^(2/3) the random model is a heuristic; window and GAP bases are
    label-additively structured by construction, and Choi's characteristic-0 rigidity (arXiv:2510.03828,
    abstract only) suggests group-additive randomness, i.e. kappa = 1. Lattice-describable class of
    KN-OPEN-020, outside the bounded-degree no-go.
  assumptions:
  - 'The vendored curve.py generates prime-order curves deterministically from (bits, seed); distinct seeds
    in disjoint blocks give fresh curves for the replication (EXP-PFDR-ca5e01 seed blocks pilot 7,000,000,
    main 7,100,000, replication 7,200,000).'
  - 'Group-element keys (x, y) packed as x*p + y fit in 64 bits for p < 2^31 (paircount.c); satisfied at
    bits <= 22.'
  - 'The matched null (uniform random x, kept when f(x) is a square, both lifts added) is the uniform random
    symmetric subset of the same size; it shares the symmetric structure of the structured bases, so
    negation-induced structure cancels in kappa (IDEA confounder 2).'
  - 'The experiment compares against the measured matched null, not against b^4/N; the counting convention
    (P != Q, Q != -P, s != O, unordered pairs) differs from the ordered Energy of the Parseval derivation by
    terms that the matched null carries identically.'
  - 'crypto-kb retrieval was not used by the proposer; novelty_status stays unverified (IDEA-20261017-077f12).'
  proof_search_map:
    bottleneck: >-
      Whether label-additive structure of a factor base below p^(2/3) produces group-additive excess at pair
      level; kappa > 1 would be the representation dependence KR-RHO-13bf67 demands, kappa = 1 keeps the
      table-table family generic.
    baseline_embedding:
      parameter_slice: 'IDEA-20260811-7734c5 window-base exact pair energy (d = 1, one size); here the theta
        axis and d in {2, 3} are added'
      reproduction_check: 'selftest trial: paircount.c equals a brute-force Python count on 45 bases (bits 10,
        12, 14; three curves each; null, window, gap2, gap3, plant) and plant_internal(L) equals a group brute
        force for L in {1, 2, 3, 5, 9, 14}'
    observation_collision:
      observable: kappa per cell (one integer ratio)
      distinct_preimage_search: 'symmetric-base structure versus label structure: separated by the symmetric
        matched null; pipeline excess versus genuine excess: separated by the null-vs-null calibration and the
        planted known-log AP'
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: per-cell kappa with its slope in theta per (bits, d)
      predicted_gain: locates the theta at which a departure appears, if any
    quantifier_order: 'FOR ALL powered cells (bits, theta, d) of the grid: |kappa - 1| < 0.05; kappa pooled
      over the cell''s curves; no claim FOR ALL p'
    method_ceiling:
      strongest_certifiable_claim: 'exact coincidence counts per tested base; kappa per cell with a bootstrap
        interval over curves; nothing asymptotic in p'
      nearby_object_control: 'planted known-log AP {+-kG : 1 <= k <= L} (must read kappa >= 1.15, z > 4) and
        null replicate 0 against the other 19 (calibration)'
    proof_obligations:
    - claim: 'Theorem range: Parseval plus a Weil-type sup-norm bound gives kappa -> 1 for windows at b >=
        p^(2/3) (recalled; the exact bound for prime-order E is unchecked)'
      responsibility: scope
    not_applicable_reason: null
