  heuristic_assumptions:
  - id: H1
    statement: >-
      (IDEA-20261017-077f12 H1.) For b <= p^(2/3), the nontrivial pair energy of window and rank-d GAP bases
      is (1 + o(1)) times that of a uniform random symmetric base of the same size. Operationalised here as:
      in every powered cell of the EXP-PFDR-ca5e01 grid, |kappa - 1| < 0.05 with the bootstrap 95% interval
      inside [0.90, 1.10].
    rigorous_support: >-
      Recalled, not read: Parseval plus a Weil-type sup-norm bound K <~ p^(1/2) log p for characters summed
      over an x-interval (Kohel-Shparlinski type, LNCS 1838) gives the random model only for b >= p^(2/3)
      (IDEA notes section 1). For d >= 2 no sup-norm bound over a multi-dimensional label box is recalled, so
      even the theorem range is stated for windows only. Every tested cell (theta <= 0.65) lies below the
      proven range; below it H1 imitates equidistribution of sumsets.
    validation_plan: >-
      EXP-PFDR-ca5e01: four prime sizes, theta grid step 0.05, d in {1, 2, 3}; curves per cell sized so the
      expected null total is >= 2500; compare to the measured matched null; flag |kappa - 1| >= 0.10 at |z| >
      4 and replicate every flagged cell on fresh curves.
    validation_experiment_ids:
    - EXP-PFDR-ca5e01
    falsification_condition: >-
      A cell flagged at |kappa - 1| >= 0.10 and |z| > 4 whose replication on the disjoint replication seed
      block has the same sign, |z| > 3 and |kappa - 1| >= 0.05 (EXP-PFDR-ca5e01 outcome O-STRUCT), on
      checker-valid runs with the calibration gate passing.
