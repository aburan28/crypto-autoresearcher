  reduction_chain:
    core_problem: whether label-structured factor bases below the proven range carry pair-level group-additive
      excess over a matched random base
    corollaries: []
  predictions:
  - id: P1
    metric: kappa per powered cell
    direction: same
    minimum_effect: '|kappa - 1| < 0.05 with bootstrap 95% CI inside [0.90, 1.10] in every powered cell'
    source: IDEA-20261017-077f12 claim ("within 5% of a matched random symmetric base") and H1; the recalled
      Parseval argument
  - id: P-detect
    metric: kappa per cell
    direction: different
    minimum_effect: '|kappa - 1| >= 0.10 at |z| > 4 in some cell (the detection threshold of the alternative)'
    source: IDEA-20261017-077f12 predictions block; used unadjusted as the flag rule of EXP-PFDR-ca5e01, so the
      IDEA's claim (null) and its prediction block (detection threshold) are both carried
  - id: P2
    metric: planted recovery
    direction: higher
    minimum_effect: 'plant kappa >= 1.15 and plant z > 4 at every powered cell'
    source: IDEA-20261017-077f12 control 2
  test_boundary:
    instances:
    - 'curves: generate_prime_order_curve(bits, seed = block_offset + c), bits in {16, 18, 20, 22}; pilot block
      7,000,000 (c = 0..7), main block 7,100,000 (c = 0..n_curves-1), replication block 7,200,000 (flagged
      cells only)'
    - 'cells: bits x theta in {0.30, ..., 0.65} step 0.05 x d in {1, 2, 3}; b = 2*round(2^(bits*theta)/2),
      kept iff 16 <= b <= 8192; 90 cells (bits 22 drops theta 0.60 and 0.65)'
    - 'bases per (cell, curve): one structured base, 20 null bases, one planted base, all of exactly b points'
    - 'curves per cell: n_curves = clamp(ceil(1.1 * 2500 / mean_null), 10, 4000), mean_null from 8 pilot
      curves x 20 nulls, recorded in design.json before the main census'
    parameters:
      counting_convention: C(F) = sum over s != O of binom(m_s, 2), unordered pairs, P != Q, Q != -P
      null_reps: 20
      target_coincidences: 2500
      plant_fraction: 0.30
      bootstrap_resamples: 2000
      flag_rule: '|kappa - 1| >= 0.10 and |z| > 4'
      null_rule: '|kappa - 1| < 0.05 and CI inside [0.90, 1.10]'
      replication_rule: 'same sign, |z| > 3, |kappa - 1| >= 0.05'
      calibration_gate: 'over powered cells sd(z_cal) in [0.85, 1.15] and |mean(z_cal)| <= 0.25'
    implementation: experiments/EXP-PFDR-ca5e01/implementation/run.py (checker check.py; C kernel paircount.c;
      vendored vendor/curve.py), sha256-bound by the trial plan
    budget:
      maximum_runs: 6
      maximum_workers: 4
      maximum_memory_gb: 4
      census_cpu_hours_estimate: 1.4
    scope_note: >-
      Toy scale only: bits 16-22, pair level h = 2. Nothing about h >= 3, other N, any cost, or any
      cryptographic size; no transfer assumption is made. Not a test of Choi's characteristic-0 theorem, only
      of its toy F_p transfer.
  distinguishable_outcomes:
  - 'O-NULL (support_scoped): calibration passes, >= 80% of the 90 cells valid, every valid cell null; H1 not
    contradicted at the tested scope.'
  - 'O-STRUCT (falsify, scoped to the surviving cells): >= 1 flagged cell survives replication on fresh curves.'
  - 'O-MIXED (inconclusive): neither of the above with calibration passing and >= 50% of cells valid; the
    contract names the non-null cells.'
  - 'O-INVALID (not evidence): calibration fails or < 50% of cells valid.'
  - 'not evidence: a timeout, memory kill, kernel failure or crash is failed_infrastructure; its cells are
    invalid, never null (AGENTS.md rule 5).'
  falsification_conditions:
  - 'Every powered cell within 5% and the planted arm recovered closes interval/GAP excess at pair level in the
    tested range (scoped; not reject_scoped). (IDEA-20261017-077f12, unadjusted)'
  - 'Any cell with |kappa - 1| >= 0.10 at |z| > 4 that replicates on fresh curves survives as structure (IDEA
    condition 2 states kappa >= 1.10 at z > 4 on fresh curves; the contract tests both signs and replicates at
    |z| > 3, |kappa - 1| >= 0.05, Coordinator resolution R2 in EXP-PFDR-ca5e01).'
  - 'Planted arm not recovered at a cell makes that cell inconclusive, never null. (IDEA, unadjusted)'
  confounders:
  - Hasse fluctuation of N at fixed b; handled by the per-curve size-matched null.
  - Negation symmetry doubles trivial counts; subtracted by the convention, and the null is symmetrized alike.
  - Cells at the same bits share their curve sets (same seed block), so cell statistics are not independent.
  interpretation_limits:
  - Pair level (h = 2) only. Says nothing about h >= 3 or N above 2^22.
  - A null does not exclude excess that grows with N (Part C's question, EXP-PFDR-0b3699 lineage).
  - kappa = 1 within 5% at toy scale never confirms the asymptotic (1 + o(1)) statement of H1.
  - 'No cost claim: this is a coincidence count for the table-table family, not a decomposition yield or a
    degree; under RQ-PFDR-ae2fba it is a half-cell and does not enter the per-representation decision table on
    its own.'
  - Producer-written check.py is not independent review; independent review precedes any status move.
