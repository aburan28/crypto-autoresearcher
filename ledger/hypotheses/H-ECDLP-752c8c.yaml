    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        The distinct columns occupied by the Macaulay layer at degree D number at
        least the row count and at most rows times tau, where tau is the maximum
        per-row support and is bounded by the term count of the descended
        generators, a quantity fixed by the construction and INDEPENDENT of the
        size of the degree-bounded monomial space.
      random_model_justification: >-
        The rigorous ingredient is structural and elementary. A Macaulay row is a
        single generator multiplied by a single squarefree monomial and then
        Boolean-reduced, and Boolean reduction can merge terms but never create
        them, so a row's support is at most the generator's term count; and
        distinct generator-multiplier pairs have distinct leading monomials, so
        the occupied count is at least the row count. Both bounds are exact and
        need no assumption. The classical statement imitated is the sparsity
        assumption underlying sparse polynomial-system linear algebra, that
        Macaulay matrices inherit the sparsity of their generators. THE GAP,
        which is the whole risk, is that the descended generators may themselves
        be dense in the descent variables, in which case tau is comparable to
        the monomial space and occupancy is bounded away from zero.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-6c9b23]
      falsification_condition: >-
        The measured per-row support exceeds the independently computed generator
        term count, which is an implementation defect rather than a finding; or
        the measured occupied column count is below the row count, which is
        arithmetically impossible and indicates the counter is wrong.
    - id: HEUR-002
      formal_statement: >-
        Peak resident memory of a cell is c1 times rank times columns, plus c2
        times the resident row window times columns, plus c3 times columns bits,
        for constants that depend only on the implementation and the allocator
        and not on the cell parameters.
      random_model_justification: >-
        Each named allocation block has a size that is an exact product of
        measured integers, so the formula is a sum of exact block sizes with
        multiplicative constants absorbing per-block overhead. The classical
        statement imitated is the standard dense linear algebra memory account.
        THE GAP is everything the allocator does that is not a named block,
        which is why the formula is FITTED, is required never to underpredict,
        and is reported alongside peak virtual size and temporary disk.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-6c9b23]
      falsification_condition: >-
        The fitted formula misses a measured peak by more than 25 percent
        anywhere in the calibration range, or underpredicts anywhere at all, in
        which case the upper-rung feasibility predictions are withdrawn.
  structural_ingredients:
    - description: >-
        The frozen Phase-A grid, its resource guards at 200000 rows and 200000
        columns, its rule that a budget skip is not evidence, its factor-base
        dimension convention, and its Macaulay degree lists.
      citation: EXP-SBRG-60c55e
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read the resource_guards and the
        surrounding grid fields of experiments/EXP-SBRG-60c55e/specification.yaml
        directly and confirmed max_columns 200000, max_rows 200000,
        budget_skip_is_evidence false, the factor-base dimension convention
        ceil(n/t)+1, and the Macaulay degree lists for the chained, balanced and
        direct representations. The rest of that file was not read by this
        session and nothing else in it is asserted here.
    - description: >-
        The sibling diagnosis for the rank-bound lane, whose pre-test pattern
        this hypothesis adopts while applying it to a different quantity.
      citation: IDEA-20260829-cb2a65
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read
        ledger/proposals/IDEA-20260829-cb2a65.yaml in full, including its own
        record that the figures anchoring its diagnosis were not read by its
        authoring session
    - description: >-
        The resource-exhaustion stop whose shape this hypothesis exists to
        avoid, reported as six of six runs exhausting an eight gibibyte contract
        at a 768212-column cell with the rank kernel never invoked.
      citation: RUN-DREG-001-MEASURE-N15-NULL-2026
      provenance: recalled
      verified_by: null
      role: >-
        SECOND-HAND AND LABELLED `recalled` FOR THAT REASON. This is an internal
        run identifier, but `provenance: internal` would assert that an agent in
        this program read the record, and none has: the sibling proposal states
        its authoring session did not read the artifacts, and THIS COORDINATOR
        SESSION DID NOT READ THEM EITHER. They are reported to live on a branch
        this worktree does not carry, so their absence here is a
        branch-visibility fact and NOT a claim that the run record does not
        exist. NO ARITHMETIC IN THIS HYPOTHESIS DEPENDS ON THEM; they are cited
        only as a shape to avoid, and the stop remains an infrastructure outcome
        under AGENTS.md rule 5 whatever the figures turn out to be.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: driver_reported_column_count_versus_closed_form
      direction: different
      minimum_effect: >-
        FORCED EXACT, ZERO TOLERANCE, on at least six cells spanning a
        hundredfold range. A single mismatch means the variable count is not what
        the contract implies, the entire feasibility table is void, and the
        correct variable count is the finding. This is the cheapest and hardest
        gate here.
    - metric: number_of_phase_a_cells_exceeding_the_column_guard
      direction: different
      minimum_effect: >-
        PREDICTED CELL BY CELL AND STATED IN ADVANCE SO IT CAN BE WRONG. The
        chained arity-3 representation is blocked at n = 14 and n = 16 with D = 5;
        the chained and balanced arity-4 representations are blocked at n equal
        to 10, 12, 14 and 16 with D = 5 and at n equal to 14 and 16 with D = 4;
        and the direct arity-3 representation is blocked at n = 16 with D = 8 and
        D = 9. Any cell on that list that in fact runs to completion falsifies
        the variable count, and any cell not on it that hits a guard falsifies it
        in the other direction.
    - metric: column_occupancy_ratio
      direction: different
      minimum_effect: >-
        Reported per cell against its OWN forced lower bound, which is the row
        count divided by the column count, and against the achievable
        compression factor, which is the reciprocal of that bound. The decision
        is taken on whether the fitted memory formula predicts under contract in
        bytes, not on an absolute occupancy threshold, because an absolute
        threshold can be unreachable at a given cell for reasons of row count
        alone.
    - metric: peak_memory_of_the_streaming_occupancy_count
      direction: lower
      minimum_effect: >-
        Predicted under 256 megabytes at every cell, since its only large
        allocation is a bitmap of the column count in bits, at most 64 kilobytes
        anywhere on this grid, plus one row at a time. If the count itself
        exhausts memory, the generator cannot be streamed and that pipeline
        defect is a first-order finding.
    - metric: measured_peak_memory_versus_the_fitted_formula
      direction: different
      minimum_effect: >-
        Within 25 percent across a calibration set spanning at least a
        hundredfold range of rows times columns, and NEVER underpredicting.
        Upper-rung predictions are recorded BEFORE those cells are attempted.
    - metric: charge_ledger_output_against_a_matched_baseline
      direction: different
      minimum_effect: >-
        The matched baseline arm must reproduce its own predicted constant within
        the seed spread, or the comparison is not measuring a ratio and no
        charged figure may be quoted. Both sides of the ratio are counted in the
        same declared operation unit.
  test_boundary:
    instances:
      - the frozen Phase-A grid cells, with the blocked list computed first
      - a dense random Boolean system at matched variable count, degree,
        generator count and degree profile
      - the direct representation, as the representation-ordering control
    parameters:
      arities: [3, 4]
      n_values: [8, 10, 12, 14, 16]
      degrees_chained_or_balanced: [2, 3, 4, 5]
      degrees_direct: [4, 5, 6, 7, 8, 9]
      column_guard: 200000
      row_guard: 200000
    implementation: >-
      Streaming occupancy count with no matrix allocation, plus instrumented
      runs on admitted cells only. Peak resident size, peak virtual size and
      temporary disk all reported.
    budget:
      wall_clock_seconds: 3600
      memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - >-
      Driver-reported column counts differ from the closed form on any
      calibration cell. The variable count is wrong, the feasibility table is
      void, and the correct variable count is the finding.
    - >-
      A cell on the predicted blocked list runs to completion within the guards,
      or a cell not on the list hits them. The table is wrong in a named
      direction and must be rebuilt against the driver's real variable set.
    - >-
      The source read finds the layer stored sparsely or the carrier absent. The
      gigabyte arithmetic does not apply and this record must be rewritten around
      the real allocation structure before any guard is proposed.
    - >-
      The measured occupancy is high enough that the fitted memory formula still
      predicts over contract at every currently blocked cell. The
      column-compression route is dead, the blocked rungs stay blocked, and the
      deliverable is the measured occupancy filed as an obstruction with value,
      units, runs and scope, plus forward guidance naming what remains.
    - >-
      The streaming occupancy count cannot be run without materialising the
      layer. The generator is not streamable and that pipeline defect is the
      finding.
    - >-
      The fitted formula misses a measured peak by more than 25 percent anywhere
      in the calibration range, or underpredicts anywhere at all. The upper-rung
      feasibility predictions are withdrawn.
    - >-
      The matched baseline arm does not reproduce its predicted constant. The
      charge ledger's output is not a ratio of comparable quantities and no
      charged figure may be emitted.
  interpretation_limits:
    - >-
      TOOLING AND BOOKKEEPING. No mathematical result, no evidence about
      reusable dependencies, no evidence about solving degree, and no discrete
      logarithm claim of any kind. COLUMN COUNTS AND OCCUPANCY ARE CURVE-FREE BY
      CONSTRUCTION, being pure combinatorics of a Boolean monomial space, so the
      curve-free-null requirement is discharged as a proof rather than as an
      arm: nothing here can be misread as a statement about elliptic curves.
    - >-
      IT AUTHORISES NOTHING. Running any Phase-A cell requires that question's
      own Coordinator approval, which this record neither has nor requests.
    - >-
      THE SOURCE PROPOSAL'S TITLE IS CORRECTED HERE. It states the advance gate
      is reachable only at degree at most 4, while its own claim (B) records
      three admissible n at degree 5 for the chained arity-3 representation. The
      body is right and the title overstates; the gate is reachable at degree 5
      for that representation and first at degree 4 for the arity-4 ones.
    - >-
      THE ANCHORING RESOURCE-EXHAUSTION FIGURES ARE SECOND-HAND. Neither the
      sibling proposal's authoring session nor this coordinator session read
      them. No arithmetic here depends on them, they are cited only as a shape
      to avoid, and the stop remains an infrastructure outcome under AGENTS.md
      rule 5.
    - >-
      The column counts are stated for the variable set the contract implies. If
      the driver differs they are LOWER bounds, which strengthens the blocking
      conclusions and weakens none, but the exact table would still have to be
      rebuilt.
    - >-
      A FEASIBILITY TABLE CAN DISCOURAGE A CELL THAT WOULD HAVE WORKED. If the
      inferred variable count is too large the table over-blocks and a real
      measurement is never taken. The revisit condition is stated: any cell
      blocked ONLY by the inferred variable count is re-examined the moment the
      source read or the calibration regression establishes the real count.
    - >-
      Binomial sums and resource formulas are textbook and no novelty is claimed
      for any of it. What is proposed is the instantiation for this grid, the
      occupancy question and the charge ledger. The external literature fixing
      the generator degree profile was not opened by any agent in this program.
  status: proposed
  proposed_by: idea-generator
