hypothesis:
  id: H-ECDLP-752c8c
  question_id: RQ-SBRG-f31cb2
  title: >-
    The Phase-A monomial counts of the frozen contract are exact binomial sums
    computable with zero compute, so the blocked cells can be named before any
    budget is spent; two independent scalar resource guards jointly admit a five
    gigabyte matrix plus a five gigabyte pivot carrier, which is the shape of a
    known resource-exhaustion stop; and the occupancy question that decides
    whether column compression buys anything has a forced lower bound nobody has
    computed
  statement: >-
    Source proposal IDEA-20260829-cb4fd5 (RQ-SBRG-f31cb2, class tooling).
    (A) THE FEASIBILITY TABLE IS ARITHMETIC AND IS AVAILABLE NOW. The Macaulay
    column count at degree D over v Boolean variables is the sum of the binomial
    coefficients C(v, i) for i from 0 to D. The Boolean variable count is
    v = t b + (t - 2) n with b = ceil(n/t) + 1, giving 3b + n at t = 3 and
    4b + 2n at t = 4, and 3b with no auxiliary for the direct representation.
    EVERY NUMBER BELOW WAS INDEPENDENTLY RECOMPUTED BY THIS COORDINATOR SESSION
    AND AGREES WITH THE SOURCE PROPOSAL. The chained arity-3 representation at
    D = 5 gives 21700, 68406, 101584, 242825 and 510416 columns at n equal to 8,
    10, 12, 14 and 16, so n = 14 and n = 16 exceed the contract's own 200000
    column guard; at D = 4 the same cells give 6196, 15276, 20854, 41449 and
    74519 and all five fit. The chained arity-4 representation at D = 5 gives
    122438, 443704 and 760099 at n equal to 8, 10 and 12, blocked from n = 10
    upward; at D = 4 it gives 24158, 66712 and 102091 at n equal to 8, 10 and 12
    but 213053 at n = 14 and 294204 at n = 16, blocked from n = 14. The direct
    arity-3 representation at n = 16 has v = 21, and D = 9 gives 695860 columns,
    blocked, while D = 7 gives 198440, just inside.
    (B) THE SCHEDULING CONSEQUENCE, WITH A CORRECTION TO THE SOURCE PROPOSAL'S
    OWN TITLE. The contract's advance gate requires at least three increasing n
    showing the same degree-relative signal. Under the guards as written the
    chained arity-3 representation has EXACTLY THREE admissible n at D = 5,
    namely 8, 10 and 12, with no headroom, so THE GATE IS REACHABLE AT D = 5 FOR
    THAT REPRESENTATION. The source proposal's title states the gate is
    "reachable only at D <= 4", which contradicts its own claim (B); the body is
    right and the title overstates. What is true is that the arity-4
    representations have only ONE admissible n at D = 5 and first reach three at
    D = 4, and that D = 3 is the only degree at which every representation has
    five admissible n. The correction is recorded rather than quietly applied.
    (C) THE MEMORY DIAGNOSIS. Two INDEPENDENT guards, one on rows and one on
    columns, each at 200000, jointly admit a cell whose dense binary matrix is
    200000 times 200000 bits, i.e. 4 times 10^10 bits or 5.0 gigabytes, and
    whose echelon pivot carrier is a further rank times columns bits, up to
    another 5.0 gigabytes. A guard on each dimension separately and none on the
    product is the structure that produces a resource-exhaustion stop. THE
    PROPOSED REPLACEMENT IS A FORMULA RATHER THAN A PAIR OF SCALARS: peak bits
    bounded by c1 times rank times columns, plus c2 times the resident row
    window times columns, plus c3 times columns, with the constants fitted on
    measured cells and a cell admitted only if the formula predicts under
    contract.
    (D) THE OCCUPANCY QUESTION AND ITS FORCED LOWER BOUND. The column count
    counts every monomial of degree at most D; the number actually occupied by
    some row is at most rows times the maximum per-row support, and a Macaulay
    row is one descended generator times one squarefree multiplier,
    Boolean-reduced, so its support is bounded by the generator's term count.
    The occupancy ratio is therefore an unmeasured number that decides whether a
    column-compressed representation buys any ladder rungs. IT ALSO HAS A FORCED
    LOWER BOUND THE SOURCE PROPOSAL DOES NOT STATE: distinct generator-times-
    multiplier pairs have distinct leading monomials, so the occupied column
    count is at least the ROW count, and occupancy is at least rows divided by
    columns. That bound is what decides whether the proposal's pre-registered
    build branch is reachable at all, and it is why the decision rule here is
    stated on the achievable compression factor and ultimately on the memory
    formula in bytes, rather than on an absolute occupancy threshold.
    (E) THE CHARGE LEDGER. The question asks about fully charged cost, while the
    contract's Phase-A observable is an operation count that its own text calls
    not a machine-independent time bound. The missing mapping is a frozen
    conversion from that count to a per-trial charge, from the charge to an
    end-to-end figure, and from there to a matched baseline operation count
    under one declared convention, with every constant pinned before any cell
    runs.
  mechanism: >-
    The tracked object is the RESOURCE SHAPE of a Macaulay layer, namely the
    triple of rows, occupied columns and rank together with the per-row support
    histogram, with coefficients, monomial labels, the curve, the field basis
    and the target all discarded. Elimination consumes rows, produces pivots and
    touches columns, so peak resident memory and the operation count are
    functions of the shape alone under a stated allocator model, and the
    retained triple propagates deterministically through exactly the operations
    the instrument performs. In this lane the rows are far FEWER than the
    columns, so the system is massively underdetermined and the rank is
    row-limited; memory is therefore driven by the COLUMN space rather than by
    the rank, which is the opposite of the sibling diagnosis in the
    rank-bound lane and is why the same fix does not apply. The lever available
    here is to stop carrying columns nothing touches, and whether that lever has
    any length is exactly the occupancy ratio.
  assumptions:
    - >-
      The Boolean variable count is v = t b + (t - 2) n with b = ceil(n/t) + 1,
      read off the frozen contract's construction. If the driver introduces
      additional auxiliary variables the count is larger and every column count
      is a LOWER bound, which strengthens the blocking conclusions and weakens
      none of them. A blocking source read settles it.
    - >-
      The instrument stores the layer densely over the full monomial space. If
      it uses a sparse column representation the guards should be restated in
      nonzeros and the gigabyte arithmetic does not apply. This is a
      source-reading obligation, not an assumption to be carried.
    - >-
      Peak resident memory is the binding contract quantity, but it is not the
      only memory. Page cache, temporary files and interpreter behaviour can
      dominate, so peak resident size, peak virtual size and temporary disk are
      all reported.
    - >-
      No result of this hypothesis is mathematical evidence about reusable
      dependencies, about solving degree, or about any discrete logarithm
      problem. It produces a feasibility table, a memory formula, an occupancy
      measurement and a charge ledger.
  proof_search_map:
    bottleneck: >-
      The column space of the Macaulay layer. Rows are far fewer than columns
      here, so both the matrix term and the carrier term scale with the column
      count, and the exact step whose removal would change the ladder's reach is
      carrying the full degree-bounded monomial space.
    baseline_embedding:
      parameter_slice: >-
        The chained arity-3 cell at n = 8, D = 2, where v = 20 and the column
        count is 1 plus 20 plus 190, i.e. 211, small enough to enumerate by hand
        and to check against the driver exactly. Second slice, D = 0, where the
        layer is the generators themselves and the column count is 1.
      reproduction_check: >-
        Exact integer equality between the closed form and the driver's reported
        column count, on at least six cells spanning a hundredfold range, with
        ZERO tolerance. A mismatch means the variable set is not what the
        contract implies and the whole feasibility table must be rebuilt against
        the driver's real variable set before any cell is scheduled.
    observation_collision:
      observable: Peak resident memory for a cell.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, WHICH IS WHY THE FORMULA RATHER THAN
        THE NUMBER IS THE DELIVERABLE. A six-gigabyte peak is produced equally by
        a matrix-dominated cell, with rows times columns large and rank small,
        and by a carrier-dominated cell, with rank times columns large and rows
        small. The two demand opposite fixes, streaming in the first case and a
        different rank method in the second, and they are separated only by
        reporting rows, rank and occupied columns ALONGSIDE the peak. A bare
        peak-memory number is therefore prohibited by this hypothesis.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure replacing two scalar guards, with
          memory charged only over allocation blocks proved disjoint, and with
          separate encoding, completeness, soundness and transfer obligations.
        predicted_gain: >-
          Turns the question of whether a cell fits from an experiment that
          consumes a twelve-hour budget into arithmetic answered in minutes, and
          turns a resource-guard skip, which the contract itself rules is not
          evidence, into a cell that was never scheduled.
      - transform: representation_reduction
        proposed_object: >-
          Restrict the column space to the columns actually occupied by some
          row, measured by streaming with no matrix allocation, and re-express
          both memory terms in the occupied count.
        predicted_gain: >-
          Bounded above by the achievable compression factor, which is the total
          column count divided by the row count, because occupied columns are at
          least rows. Whether the reduction is worth building is decided by the
          memory formula in bytes against the contract, not by an absolute
          occupancy threshold.
    quantifier_order: >-
      CLAIMED. FOR ALL Phase-A cells, the Macaulay column count equals the stated
      binomial sum with v determined by the construction, and THEREFORE the
      enumerated cells exceed the declared column guard. This is an arithmetic
      identity plus a comparison, with no experiment in it. SEPARATELY AND
      CONDITIONALLY, FOR ALL cells, IF the measured occupancy is low enough that
      the fitted memory formula predicts under contract, THEN a column-compressed
      layout admits the cell. NOT CLAIMED, and stated so it cannot be read in
      later: that any of this bears on the mathematics.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the enumerated cells the column count is the stated integer and
        exceeds the declared guard, and peak resident memory is predicted by the
        fitted formula within the stated tolerance across the calibrated range.
        It can NEVER certify anything about solving degree, about reusable
        dependencies, about any discrete logarithm problem, or about cells
        outside the calibrated range.
      nearby_object_control: >-
        A DENSE RANDOM SYSTEM at identical variable count, degree, generator
        count and degree profile, where occupancy must be visibly HIGHER and the
        compression route visibly WORSE. A layout that looks good there is not
        exploiting anything. Second nearby object: the direct representation,
        which has no auxiliary variables and hence a much smaller variable count
        at the same n, so the table must show it reaching HIGHER degrees within
        the same guard, namely 198440 columns at n = 16 and D = 7 against 510416
        for the chained arity-3 representation at n = 16 and D = 5. A table that
        does not reproduce that ordering has the variable count wrong.
    proof_obligations:
      - claim: The variable count formula matches the specified constructions.
        responsibility: baseline
      - claim: The column count equals the binomial sum exactly, matching the driver.
        responsibility: correctness
      - claim: The enumerated cells exceed the declared column guard.
        responsibility: size
      - claim: Two independent guards admit a five gigabyte matrix plus a further
          five gigabyte carrier.
        responsibility: memory
      - claim: Occupied columns are at least the row count.
        responsibility: strictness
      - claim: The fitted memory formula predicts measured peaks within 25 percent
          across a hundredfold range and never underpredicts.
        responsibility: memory
      - claim: The charge ledger's conversion constants are frozen before any cell
          runs and reported with every derived figure.
        responsibility: interface
      - claim: The matched baseline arm reproduces its own predicted constant.
        responsibility: baseline
      - claim: No mathematical claim of any kind follows from this work.
        responsibility: scope
    not_applicable_reason: null
