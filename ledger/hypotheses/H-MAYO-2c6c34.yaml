hypothesis:
  id: H-MAYO-2c6c34
  question_id: RQ-MAYO-001

  statement: >-
    SCOPE: the MAYO whipped map read as an algebraic object, at TOY parameters
    for every measured number and as a derivation for every general statement.
    CLAIM TIER toy for measurements, derivation for identities. NO ATTACK, NO
    EXPONENT, NO CRYPTO-SCALE CLAIM, AND NOTHING ABOUT ANY IMPLEMENTATION,
    FAULT, OR RANDOMNESS ROUTE (those are H-MAYO-c0ddab's, filed as a separate
    class per GOAL-MAYO-001's next_action).
    THE HYPOTHESIS HAS TWO PARTS AND EITHER CAN FAIL ALONE.
    PART A (DILATION). Whipping acts on the parameter triple (variables,
    equations, oil dimension) as the diagonal map (n, m, o) -> (k n, m, k o).
    Consequently, for every MAYO parameter set: the oil ratio is EXACTLY
    invariant, n*/o* = n/o; the generic intersection dimension satisfies
    d*_{k'} = k * d_{k'} and therefore never changes sign; the Kipnis-Shamir
    gap satisfies n* - 2 o* = k (n - 2 o); and the underdetermination ratio
    satisfies alpha* = k alpha. Whipping is therefore NEUTRAL for every attack
    whose applicability is a degree-1-homogeneous function of (n, o) alone, and
    the ENTIRE attack-surface effect of whipping is concentrated in the single
    scalar alpha* / alpha = k.
    PART B (NO EMULSIFIER DEFECT). Writing the k whipped blocks as
    x_i = sum_a c_{ia} y_a for C in F_q^{k x r}, the whipped map factors as
    P*(C y) = sum_a D_a(C) P(y_a) + sum_{a<b} F_ab(C) P'(y_a, y_b) with
    D_a(C) = sum_i c_{ia}^2 E_ii and F_ab(C) = sum_i c_{ia} c_{ib} E_ii +
    sum_{i<j} (c_{ia} c_{jb} + c_{ib} c_{ja}) E_ij. Define the emulsifier
    defect delta(C) as the dimension of the common LEFT kernel of the family
    {D_a(C)} union {F_ab(C)}. THE CLAIM IS delta(C) = 0 FOR EVERY NONZERO C,
    for the specification's emulsifier, at r = 1 and r = 2, at the tested toy
    parameters -- so no scalar linear slice of the whipped map loses any of its
    m equations, and there is no slice-restricted oil-recovery or forgery
    advantage of this kind at all.
    IF BOTH PARTS HOLD, the deliverable is a NAMED OBSTRUCTION with an argument
    and a scope -- 'whipping preserves no exploitable invariant of the
    parameter-triple or emulsifier-rank kind; what it does move is alpha, by
    exactly k' -- which is the second horn of GOAL-MAYO-001's first completion
    criterion, and it is stated together with the randomness assumptions the
    scheme then depends on (H-MAYO-c0ddab). IF PART B FAILS, a nonzero delta is
    a whipping-induced equation loss and must be costed by the
    slice_advantage_ratio before any security statement is made.

  mechanism: >-
    DERIVED IN-REPO. NO MAYO DOCUMENT HAS BEEN READ BY THE SESSION THAT WROTE
    THIS RECORD. Every structural premise about MAYO below is labelled
    RECALLED, UNVERIFIED and is a candidate to check; every algebraic step is
    derived here and is unconditional given those premises.

    PREMISES (RECALLED, UNVERIFIED; Stage 0 of EXP-MAYO-ccc272 replaces this
    paragraph with quotations or records the failure to obtain them).
    P : F_q^n -> F_q^m is a UOV-shaped homogeneous quadratic map with oil space
    O of dimension o < m, so P(O) = 0 and P'(O, O) = 0 for the polar form
    P'(u,v) = P(u+v) - P(u) - P(v). The whipped map is
      P*(x_1..x_k) = sum_i E_ii P(x_i) + sum_{i<j} E_ij P'(x_i, x_j)
    with public E_ij in F_q^{m x m}; q = 16 (char 2); the E_ij are drawn from a
    commutative algebra F_q[A] isomorphic to F_{q^m}, so every nonzero
    F_q-combination of them is invertible.

    PART A, DERIVED. P* vanishes on O^k term by term, so O^k of dimension k o
    is an oil space of P*; the whipped instance therefore reads as a UOV
    instance with n* = k n, m* = m, o* = k o. THE ASYMMETRY IS THE WHOLE
    CONTENT: two of the three coordinates dilate and the equation count does
    not. Substituting: n*/o* = n/o exactly; d*_{k'} = k'(k o) - (k'-1)(k n) =
    k d_{k'}, hence the same sign at every k; n* - 2o* = k(n - 2o); and
    alpha* = k n / m = k alpha. RECALLED, UNVERIFIED and load-bearing for the
    interpretation only: that the intersection attack's usable object has
    generic dimension d_{k'} = k' o - (k'-1) n and that Kipnis-Shamir-style
    recovery costs about q^{n - 2o}. The DILATION statements survive any
    replacement of those rules by other degree-1-homogeneous functions of
    (n, o), which is exactly why they are stated as identities on the
    parameters rather than as cost claims.

    PART B, DERIVED. Substituting x_i = sum_a c_{ia} y_a into P* and using
    (i) P(sum_a c_a y_a) = sum_a c_a^2 P(y_a) + sum_{a<b} c_a c_b P'(y_a,y_b),
    (ii) bilinearity and symmetry of P', and (iii) P'(y,y) = 2P(y) = 0 IN
    CHARACTERISTIC 2, and collecting the coefficients of the r(r+1)/2
    independent polar values, gives exactly the factorization in the statement.
    Hence the whipped map on an r-block scalar slice sees the r n coordinates
    ONLY through r(r+1)/2 vectors in F_q^m, compressed by r(r+1)/2 emulsifier
    combinations. If u in F_q^m satisfies u^T D_a(C) = 0 for all a and
    u^T F_ab(C) = 0 for all a<b, then u^T P*(C y) = 0 identically on the slice
    and the attacker faces m - delta(C) equations in r n variables instead of m
    in k n.
    THE FORCED VALUE. For a field-based emulsifier every nonzero F_q-combination
    of the E_ij is a unit, so each of D_a(C), F_ab(C) is either 0 or invertible
    and delta(C) is 0 or m. delta(C) = m requires ALL r(r+1)/2 combinations to
    vanish. At r = 1 the single condition is sum_i c_{i1}^2 eps_ii = 0 in
    F_{q^m}; if eps_11..eps_kk are F_q-linearly independent (which needs k <= m,
    satisfied by the recalled parameters) then every c_{i1}^2 = 0, and since
    squaring is the Frobenius bijection of F_q in characteristic 2, C = 0.
    FORCED VALUE delta_max = 0 at r = 1. At r = 2 the F_ab conditions are
    quadratic in C and the counting argument is NOT automatic; that gap is the
    reason r = 2 is measured rather than asserted, and it is the most likely
    place for Part B to fail.

    WHAT MAKES THE PREDICTED NEGATIVE WORTH RUNNING. Four named ways the forced
    0 can break, each a reading task or a toy computation: the specification may
    constrain only the combinations arising in SIGNING rather than all slices;
    the eps_ii may fail F_q-linear independence if powers are reused; the r >= 2
    conditions may admit a nontrivial common kernel; and a Round-3 tweak (due
    2026-08-14) may change the emulsifier. A closure that names four falsifiers
    and tests them is a closure under inventor-protocol section 4; a count of
    rejected mechanisms would be a fatigue report and is not what this record
    claims.

    THE COST BOOKKEEPING, STATED BEFORE ANY DEFECT IS FOUND SO THAT A FOUND
    DEFECT CANNOT BE OVERSOLD. A defect delta on an r-slice buys the attacker
    delta fewer equations and costs (k - r) n variables; for FORGERY it
    additionally costs a factor q^delta of salt grinding because only a
    q^{-delta} fraction of targets is reachable, while for OIL-SPACE RECOVERY
    it does not. The slice is profitable exactly when
    q^{delta} * Cost_MQ(m - delta, r n) < Cost_MQ(m, k n) for forgery, and when
    Cost_MQ(m - delta, r n) < Cost_MQ(m, k n) for recovery. Both inequalities
    are to be reported with the substituted MQ cost model NAMED, and under at
    least two named conventions so that a convention-dependent verdict is
    visible as such.

  assumptions:
    - >-
      The whipped map has the stated bilinear form and characteristic is 2.
      Both are RECALLED, UNVERIFIED. If the form differs, Part A's Identity 0
      may survive while the rest needs re-derivation; if the characteristic is
      odd, the factorization gains diagonal terms and Part B must be redone.
    - >-
      The whipped oil dimension is exactly k o. If a larger oil space exists,
      Part A's ratio statements are wrong and the discovery is far more
      important than this record.
    - >-
      Scalar slices C in F_q^{k x r} are the slice family. Blocks of the form
      x_i = phi_i(y) for general F_q-linear phi_i are OUTSIDE this hypothesis and
      are named as forward guidance rather than silently included.
    - >-
      Every measured number is at toy (q, m, k). The field argument is
      m-independent and carries the general statement; the enumeration does not
      and may not be cited as if it did.

  proof_search_map:
    bottleneck: >-
      The step at which whipping could inject information an attacker can use:
      concretely, whether any linear slice of the whipped map has fewer than m
      independent equations. Every other structural difference between the
      whipped and the underlying map is a dimension count, and Part A shows the
      dimension counts move by a fixed dilation that no parameter choice can
      alter. If delta = 0 everywhere, the whipped map's only attack-relevant
      difference from k independent copies of the underlying map is the value of
      alpha, and the goal's structural question is answered.
    baseline_embedding:
      parameter_slice: >-
        r = 1 with C = e_i (a single nonzero entry). Then D_1(C) = E_ii, no
        F_ab terms exist, and P*(C y) = E_ii P(y) -- i.e. the slice IS the
        underlying UOV map post-composed with an invertible matrix. The
        baseline (plain UOV direct/recovery problem at (q, n, m, o)) is
        therefore literally a member of the slice family, not merely similar to
        one. Second slice: k = 1, where whipping is the identity dilation and
        every Part A ratio must equal 1.
      reproduction_check: >-
        SYMBOLIC plus a frozen numeric fixture. Symbolically, substituting
        C = e_i into the factorization must return E_ii P(y) with no residual
        term; numerically, evaluate P*(e_i (x) y) directly from the whipped
        map's definition and compare bitwise with E_ii P(y) over many random y
        at toy parameters. A curve that merely resembles the baseline is not an
        embedding; this is an exact identity and is checked as one.
    observation_collision:
      observable: >-
        The integer delta(C), and Part A's five parameter ratios.
      distinct_preimage_search: >-
        THE COLLISION EXISTS AND IS ADMITTED RATHER THAN HIDDEN, and it bounds
        what Part A can ever conclude: the parameter-ratio observable is
        constant on the entire class of whipped maps with the same (q,n,m,o,k),
        so two instances -- one with a field-based emulsifier and one with a
        deliberately defective emulsifier having delta = 1 -- have IDENTICAL
        Part A observables while lying on opposite sides of the conclusion.
        Part A is therefore NOT identifying, and Part B is exactly the
        additional condition that separates the pair. Stating this is the
        reason the hypothesis has two parts instead of one. For Part B's own
        observable the collision search is the measurement: two emulsifiers with
        the same delta_max but different security-relevant structure would be a
        genuine identifiability failure, and the graded j-sweep is designed to
        expose it by reporting WHERE the defect turns on rather than only
        WHETHER it does.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question from 'is the whipped map weaker' (a vague
          comparative) to 'is the common left kernel of an explicit finite
          family of m x m matrices nonzero' (an exact rank condition over F_q).
        predicted_gain: >-
          Converts an open-ended structural search into an integer computation
          on PUBLIC data with a forced value, executable in seconds at toy
          parameters and decidable by field algebra in general. Encoding
          obligation: the factorization identity. Soundness obligation: a
          nonzero delta really does remove an equation on the slice (immediate
          from u^T P* = 0). Transfer obligation to real parameters: DECLARED
          UNMET by enumeration and carried only by the field argument.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable delta_max = 0 fixed and vary the forgotten
          structure: field-based emulsifier versus random-matrix emulsifier
          versus planted-defect emulsifier, at identical (q, m, k, r). The
          intrinsic invariant proposed to distinguish them is the minimum rank
          distance of the F_q-span of the emulsifier family as a rank-metric
          code.
        predicted_gain: >-
          If that invariant does not separate the three, the object has not
          identified the load-bearing structure and the hypothesis fails at zero
          compute rather than after a measurement.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. Part A: FORALL MAYO parameter sets, FORALL k, the
      five identities hold -- no witness is involved and no instance-dependence
      is possible, because they are identities on integers. Part B: FORALL
      nonzero C in F_q^{k x r} (r in {1,2}), FORALL u in F_q^m \ {0}, THERE
      EXISTS a member of {D_a(C)} union {F_ab(C)} with u^T M nonzero.
      THE QUANTIFIER TRAP BEING HUNTED, AND IT IS THE LIKELY FAILURE: the
      specification's design condition is plausibly of the form 'FORALL
      combinations ARISING IN SIGNING, the matrix is invertible', whose
      universe is a strictly smaller set of C than 'FORALL nonzero C'. A
      guarantee quantified over the signing configurations does NOT imply the
      guarantee quantified over all slices, and if the spec's condition is the
      narrower one then Part B is a genuinely open question rather than a
      restatement of the design. The weaker order -- FORALL C THERE EXISTS a
      separating argument chosen per C -- would be useless and is explicitly NOT
      claimed; the field argument supplies one uniform reason.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: (a) the five dilation identities, which are unconditional given
        the whipped map's form, and (b) delta_max = 0 over the ENUMERATED slice
        space at the TESTED toy (q, m, k, r <= 2) for the tested emulsifier
        shape, plus a field-algebra argument that extends (b) to r = 1 at any
        size. It CANNOT certify that the whipped map is as hard as the
        underlying map, cannot certify anything about non-scalar slices, cannot
        move any exponent, cannot bound any solver's cost, and cannot license
        the sentence 'MAYO's whipping is security-neutral' without the
        qualifiers 'for parameter-triple-driven attacks and scalar-slice
        equation loss'.
      nearby_object_control: >-
        TWO, both required arms. (1) THE RANDOM-MATRIX EMULSIFIER, where the
        hoped-for conclusion MUST FAIL: uniform m x m matrices over F_q are
        singular with probability about 1 - prod_{i=1..m}(1 - q^{-i}) (about
        1/16 at q = 16), so delta_max >= 1 must appear across the slice space
        with overwhelming probability; if the instrument reports 0 there it
        cannot detect a defect and NO negative may be reported. (2) THE
        PLANTED-DEFECT EMULSIFIER, built with a common left kernel vector on
        every E_ij, where delta >= 1 must be recovered at every nonzero C. A
        method that cannot separate the field-based emulsifier from these two
        has not found the load-bearing structure.
    proof_obligations:
      - claim: >-
          The factorization identity P*(C y) = sum_a D_a(C) P(y_a) +
          sum_{a<b} F_ab(C) P'(y_a,y_b) holds exactly in characteristic 2.
        responsibility: correctness
      - claim: >-
          C = e_i reproduces the underlying map E_ii P(y) with no residual.
        responsibility: baseline
      - claim: >-
          delta(C) > 0 implies m - delta effective equations on the slice, and
          the slice costs (k - r) n variables plus q^delta grinding for forgery.
        responsibility: strictness
      - claim: >-
          The five Part A identities follow from n* = kn, m* = m, o* = ko.
        responsibility: correctness
      - claim: >-
          The enumeration of C is exhaustive up to scalars at the reported toy
          sizes, and the reported coverage fraction is exact at larger sizes.
        responsibility: feasibility
      - claim: >-
          Nothing here transfers to non-scalar slices, to implementation or
          fault routes, or to deployed parameters; the boundary is stated on
          every citation.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO complexity claim of any kind is made. Part A fixes
    which ratio a later cost analysis must be evaluated at (alpha* = k n / m,
    the object of IDEA-20260805-977e16); Part B, if it holds, removes a class of
    slice-restricted attacks; neither makes any system easier to solve and
    neither moves an exponent. sota_delta is zero on every attack axis and
    dominated_by is not applicable because no Pareto point is claimed.

  heuristic_assumptions:
    - id: HEUR-MAYO-H1-1
      formal_statement: >-
        NOT LOAD-BEARING. The factorization identity and the five dilation
        identities are exact consequences of the whipped map's stated form; no
        distributional or asymptotic assumption enters either.
      random_model_justification: >-
        None required. Both are algebra.
      supporting_results: []
      validation_experiment_ids: [EXP-MAYO-ccc272]
      falsification_condition: >-
        The identity control fails: P*(C y) evaluated from the definition and
        from the factorization disagree on any random draw at toy parameters.
    - id: HEUR-MAYO-H1-2
      formal_statement: >-
        LOAD-BEARING. FORALL nonzero C, not all of {D_a(C)} union {F_ab(C)}
        vanish; equivalently the F_q-span of the emulsifier family is a
        rank-metric code of minimum rank distance m and the induced conditions
        on C are independent.
      random_model_justification: >-
        NOT a random-model claim -- it is an algebraic property of a specific
        PUBLIC object, which is why it is testable at zero compute. The
        supporting argument is that a nonzero element of a field acts
        invertibly in its regular representation, plus F_q-linear independence
        of the k diagonal elements in F_{q^m}. BOTH THE FIELD CONSTRUCTION AND
        THE INDEPENDENCE ARE RECALLED, UNVERIFIED, and the independence is not
        automatic if the specification reuses powers of one element.
      supporting_results: []
      validation_experiment_ids: [EXP-MAYO-ccc272]
      falsification_condition: >-
        delta_max >= 1 for the specification-shaped emulsifier at any tested
        (q, m, k, r). The hypothesis's Part B is then refuted at that cell and
        the finding must be costed rather than announced.
    - id: HEUR-MAYO-H1-3
      formal_statement: >-
        LOAD-BEARING FOR THE INTERPRETATION OF PART A ONLY. The intersection
        attack's applicability is governed by the sign of
        d_{k'} = k' o - (k'-1) n, and Kipnis-Shamir-style recovery costs about
        q^{n - 2o}; more generally, the applicability rules of the classical UOV
        attack families are degree-1-homogeneous in (n, o).
      random_model_justification: >-
        Recalled from the UOV cryptanalysis literature, NOT READ in this
        session. It is a candidate to check. The dilation conclusions are stated
        conditionally on it and survive any replacement rule that is also
        degree-1-homogeneous in (n, o) -- a robustness property that is itself
        part of the claim and is checkable.
      supporting_results: []
      validation_experiment_ids: [EXP-MAYO-ccc272]
      falsification_condition: >-
        Stage 0 reading finds an applicability rule that is not homogeneous of
        degree 1 in (n, o). The invariance half of Part A then does not follow
        and must be restated for that rule.

  structural_ingredients:
    - description: >-
        Polar (differential) form of a homogeneous quadratic map, its
        bilinearity and symmetry, and the vanishing P'(y, y) = 2 P(y) = 0 in
        characteristic 2.
      citation: >-
        Elementary; DERIVED IN THIS RECORD. No citation is asserted and none is
        needed.
      role: supplies the factorization of the whipped map on a slice
    - description: >-
        Regular representation of a finite field: every nonzero element of
        F_{q^m} embedded in F_q^{m x m} is invertible.
      citation: >-
        Elementary; DERIVED IN THIS RECORD. No citation is asserted.
      role: forces delta(C) in {0, m} for a field-based emulsifier
    - description: >-
        Singularity probability of a uniform matrix over F_q,
        1 - prod_{i=1..m} (1 - q^{-i}).
      citation: >-
        Elementary counting; to be RECOMPUTED in the experiment rather than
        quoted from this record.
      role: forced expectation for the matched random-emulsifier null
    - description: >-
        MAYO's whipped-map definition, emulsifier construction, and parameter
        table.
      citation: >-
        NOT RETRIEVED AND NOT READ IN THIS SESSION. Recorded as
        literature_unverified. The forms used above are RECALLED and are
        candidates to test, never authorities. The only in-corpus MAYO records
        are KN-LIT-1205 and KN-LIT-1818, both bulk-seeded on 2026-07-24 with
        their own bodies disclaiming verification.
      role: the unread premise on which both parts rest

  reduction_chain:
    core_problem: >-
      Decide whether MAYO's whipping construction introduces, relative to its
      underlying UOV map, either (A) a parameter-level change that alters which
      classical attack families apply, or (B) a scalar-slice equation loss.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this object to any
      statement about MAYO's deployed security, about the underlying MQ
      problem's hardness, or about any other scheme. A confirmed Part A + Part B
      narrows where a whipping-specific weakness could live; it does not bound
      the cost of any attack, and any citation toward a MAYO cost must carry
      that gap explicitly. GOAL-UOV-001 owns the plain-UOV cost calibration and
      nothing here substitutes for it.

  predictions:
    - metric: "G1 (zero compute): (n*/o*) / (n/o) at every MAYO parameter set"
      direction: different
      minimum_effect: "EXACTLY 1, no tolerance. It is an identity."
    - metric: "G2 (zero compute): d*_2 / d_2 and (n* - 2o*) / (n - 2o) and alpha*/alpha"
      direction: different
      minimum_effect: >-
        EXACTLY k for all three, at every parameter set. Under the RECALLED
        values k = 9, 4, 11, 12 for MAYO 1/2/3/5.
    - metric: "G3 (zero compute): sign(2o - n) for the underlying map at every parameter set"
      direction: lower
      minimum_effect: >-
        NEGATIVE at every set, i.e. the intersection attack out of range for the
        underlying map. Under RECALLED (n, o) the values of 2o - n are -50, -42,
        -79, -109. A non-negative value at ANY set is the most important finding
        available in this goal and would redirect the whole campaign.
    - metric: "G4 (identity control, seconds): bitwise agreement of P*(C y) computed from the whipped definition and from the factorization, over >= 1000 random (C, y) draws at toy parameters"
      direction: different
      minimum_effect: >-
        1000/1000 agreements. A single disagreement voids every downstream
        number in the contract.
    - metric: "G5 (baseline embedding, seconds): bitwise agreement of P*(e_i (x) y) with E_ii P(y) over >= 1000 random y"
      direction: different
      minimum_effect: "1000/1000. The slice family must contain the underlying map exactly."
    - metric: "G6 (the payload): delta_max for the specification-shaped emulsifier at toy (q,m,k), r = 1 exhaustive and r = 2 exhaustive or stated-coverage"
      direction: lower
      minimum_effect: >-
        EXACTLY 0. An integer with no tolerance band. delta_max >= 1 refutes
        Part B at that cell.
    - metric: "G7 (matched null): delta_max for a uniform random-matrix emulsifier of identical shape, same search code, same enumeration order"
      direction: higher
      minimum_effect: >-
        >= 1. If 0, the instrument cannot detect a defect and NO negative from
        G6 may be reported at all.
    - metric: "G8 (planted positive control): delta recovered on an emulsifier built with a planted common left kernel, 20 independent plants"
      direction: higher
      minimum_effect: "20/20 recoveries at the planted dimension. Below that, the instrument is not trusted."
    - metric: "G9 (graded, >= 3 interior points): delta_max as a function of the number j of emulsifier matrices carrying the planted kernel, j = 0..k(k+1)/2"
      direction: higher
      minimum_effect: >-
        MONOTONE NON-DECREASING, 0 at j = 0, and -- a sharp derived
        sub-prediction -- STILL 0 at r = 1 when the plant touches only
        off-diagonal matrices, because r = 1 excites only the k diagonal
        emulsifiers. The effect must turn on at r = 2 in that configuration and
        not before.
    - metric: "G10: slice_advantage_ratio for every defect found, under >= 2 named MQ cost conventions"
      direction: lower
      minimum_effect: >-
        Reported, with the memory column filled or explicitly marked absent in
        the source. A defect with ratio >= 1 is real and unprofitable and must
        be reported as exactly that.

  test_boundary:
    instances:
      - >-
        Synthetic UOV-shaped maps over F_q with q = 16, built in-repo, with a
        planted oil space of dimension o, whipped by k emulsifier matrices of
        each of four shapes: field-based (specification-shaped), uniform random
        (matched null), planted-defect (positive control), graded plant
        (j-sweep).
      - >-
        Toy sizes only: m in {4, 6, 8}, k in {3, 4}, n in {6, 8, 10}, o in
        {2, 3}, chosen so that k o >= m (MAYO's own design inequality) and so
        that the r = 1 slice space, of size (q^k - 1)/(q - 1), is exhaustively
        enumerable (273 points at q = 16, k = 3; 4369 at k = 4).
      - >-
        Slice dimensions r in {1, 2} only. r >= 3 is OUT OF SCOPE for this
        hypothesis. Non-scalar slices x_i = phi_i(y) are OUT OF SCOPE and are
        recorded as forward guidance.
      - >-
        Part A's identities are evaluated at the real MAYO parameter sets as
        integer arithmetic; that is a derivation, not a measurement, and no
        measured claim is made at real parameters.
    parameters:
      q: 16
      characteristic: 2
      m_values: [4, 6, 8]
      k_values: [3, 4]
      n_values: [6, 8, 10]
      o_values: [2, 3]
      r_values: [1, 2]
      arms: [spec_shaped_field, random_matrix_null, planted_defect_positive, graded_plant_sweep]
      slice_space_size_r1: "(q^k - 1)/(q - 1) = 273 at k=3, 4369 at k=4"
    implementation: >-
      Pure Python with hand-rolled GF(16) log/exp tables plus numpy 2.4.6 for
