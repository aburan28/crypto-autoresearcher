hypothesis:
  id: H-PFDR-cbb5c4
  question_id: RQ-QALG-122b59
  added: '2026-09-04'
  derived_from_idea: IDEA-20260818-f8dc30
  batch_id: BATCH-2c45e2
  statement: >-
    QUASI-CYCLIC SYNDROME DECODING HAS A SHARP SPARSITY THRESHOLD IN THE TRANSFORM
    DOMAIN, THE DEPLOYED PARAMETERS SIT A MULTIPLICATIVE FACTOR OF ABOUT THE SECRET
    WEIGHT BEYOND IT, AND WHETHER THE THRESHOLD IS CAUSED BY LINEAR COMPLEXITY OR BY
    THE NUMBER OF INDEPENDENT TRANSFORM EQUATIONS IS SEPARABLE BY EXPERIMENT.
    (S1 THE THRESHOLD) For a rate-one-half quasi-cyclic instance over the cyclic ring of
    prime length n with secret weights w, the transform of the syndrome is a linear
    recurrent sequence whose linear complexity is at most w plus the public weight times
    w. Berlekamp-Massey recovers the minimal polynomial from a full period whenever twice
    that complexity is at most n, so recovery is polynomial-time exactly when the public
    weight is at most n over twice w, minus one.
    (S2 THE DEFICIT) The deployed parameters sit far beyond that threshold. With the
    public element uniform its expected weight is n over two, so the multiplicative
    deficit is the expected weight divided by the threshold. TASK-20260904-5423ad computed
    the thresholds from the corpus parameters as 132, 178 and 218 and the resulting
    deficits as about 66.9, 100.7 and 132.2 - CLOSE TO BUT NOT EXACTLY the secret weights
    66, 100 and 131, the discrepancy coming from the minus one in the threshold.
    (S3 THE FROBENIUS COLLAPSE, AND WHAT IT DOES AND DOES NOT CAUSE) Because the public
    element and the syndrome have binary coefficients, the transform equation at twice an
    index is the square of the equation at that index, so the independent equations are
    indexed by two-cyclotomic cosets and number one plus n minus one over the order of two
    modulo n. If two is primitive the count is exactly two, and an apparently
    overdetermined system is nothing of the kind. THIS IS A SEPARATE MECHANISM FROM S1 AND
    THE TWO ARE CONFLATED IF NOT SEPARATED - the recovery threshold depends on the linear
    complexity and NOT on the coset count, so instances at primes where two is not
    primitive must show the SAME threshold, and if they do not, the threshold is being
    caused by something other than S1 claims.
  mechanism: >-
    The transform turns ring multiplication into pointwise multiplication, so the key
    equation becomes a pointwise identity at every index. With the secret of weight w the
    transform of the secret at index i is a sum of w powers, and the product term
    contributes the public weight times w further powers, so the transform of the syndrome
    is a sum of at most w plus the public weight times w exponentials - a linear recurrent
    sequence of that linear complexity. Berlekamp-Massey needs twice the complexity
    consecutive terms and a full period supplies n of them, so the nodes are the roots of
    the minimal polynomial; the public support is known, so the shifted family is
    identified and the remainder is the secret. The mechanism's research content is its
    BOUNDARY, not its interior - the deployed public element is dense, the threshold is
    missed by a factor of about the secret weight, and rewriting the instance by a
    multiplier does not help because the expected number of multipliers meeting the
    required joint weight is astronomically below one, so the search space is EMPTY rather
    than merely large and a square-root search over it is irrelevant.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      TWO PROBLEMS, ONE FATAL TO A CONTROL AND ONE TO AN ATTRIBUTION.
      FIRST, THE SOURCE IDEA'S THIRD NULL HAS WIDTH ZERO. It proposes a non-quasi-cyclic
      random code on which "the transform step must be inapplicable". A step that is
      inapplicable produces no number, so the control has no measurable outcome and can
      only detect a harness that fabricates one. That is worth having as a smoke test and
      is not a discriminator.
      SECOND AND MORE SERIOUSLY, THE THRESHOLD MEASUREMENT AS DESIGNED CANNOT ATTRIBUTE
      RECOVERY TO THE TRANSFORM MECHANISM. At small public weight the instance is easy for
      reasons that have nothing to do with linear complexity - a sparse public element
      makes the underlying decoding problem easy for generic information-set decoding as
      well - so observing polynomial-time recovery below the threshold is consistent with
      the transform mechanism and equally consistent with the instance simply being easy.
      This is the same failure as attributing a measured zero to a missing structural law
      when a second generator in the same characteristic reproduces it.
    change_made: >-
      Two controls replace the width-zero one. C-ISD-ATTRIBUTION runs a generic
      information-set decoding baseline on the SAME instances at every cell; if it also
      succeeds in comparable charged operations below the threshold, the polynomial-time
      result is NOT attributable to the transform mechanism and the record must say so.
      C-NONPRIMITIVE runs the identical measurement at primes where two is NOT primitive,
      so the coset count is at least three while the linear complexity bound is unchanged;
      the threshold is predicted IDENTICAL there, which separates the S1 mechanism from
      the S3 mechanism. Both controls have real dynamic range - a recovery rate on the
      closed unit interval and an integer threshold - and both can fail.
    alternative_hypothesis_range: >-
      Under S1 the practical recovery threshold sits at or just below the analytic
      threshold and is UNCHANGED when the coset count rises from two to three or more,
      while the generic decoding baseline requires materially more charged operations
      below the threshold than the transform route does. Under H_easy-instance the generic
      baseline succeeds comparably and the transform route is not doing the work. Under
      H_coset-driven the threshold moves with the coset count. The three predict different
      values of two measurable quantities over a declared and reachable range of toy
      primes.
  assumptions:
  - >-
    The parameters are READ AT RUN TIME from the filed corpus record and not transcribed.
    TASK-20260904-5423ad read knowledge/literature/KN-LIT-b9e1a8.md and reports the three
    lengths as 17669, 35851 and 57637 with secret weights 66, 100 and 131, and reports
    that record's statement that the length is chosen as the smallest primitive prime
    above the product of the two inner lengths - which is the corpus's corroboration for
    the primitivity design criterion, at title-and-summary level.
  - >-
    The public element is derived from a public seed by an extendable output function and
    is modelled as uniform in the ring; the attacker knows the public element and the
    syndrome, which is the key-recovery setting.
  - >-
    The length is prime and the ring is the binary polynomial ring modulo the length-n
    cyclotomic factorisation. Composite lengths are outside every statement here.
  proof_search_map:
    bottleneck: >-
      The linear complexity of the transform-domain syndrome sequence. Every claim turns
      on whether twice that complexity fits in one period.
    baseline_embedding:
      parameter_slice: >-
        Public weight one, a monomial. Then the complexity is twice the secret weight and
        the threshold holds with enormous slack, so the method MUST recover in polynomial
        time. A second slice with public weight two is a stricter test because it exercises
        the shifted-family grouping step.
      reproduction_check: >-
        A frozen symbolic fixture at small primes with two primitive and small secret
        weights - construct the secret, form the syndrome, run transform then
        Berlekamp-Massey then node partition, and assert EXACT recovery at public weight
        one, two and three. Stored as a regression fixture with seeds, not as a plot.
    observation_collision:
      observable: >-
        The minimal polynomial of the transform sequence, equivalently the node multiset.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS REAL, AND IT IS THE METHOD'S CORRECTNESS CAVEAT RATHER
        THAN A FALSIFIER. Over the binary field a node appearing an even number of times
        CANCELS, so distinct secret pairs can share a minimal polynomial. This happens when
        the secret support has a repeated difference matching a difference in the public
        support, and the expected number of such coincidences grows linearly in the public
        weight, reaching about half the secret weight at the threshold - so cancellations
        are NOT rare at the boundary. CONSEQUENCE RECORDED HONESTLY - the analytic
        threshold is an UPPER bound on where the method works and the practical threshold
        may be strictly below it, which the experiment measures rather than assumes.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The syndrome as a linear recurrent sequence over the extension field, so that the
        hypothesis that the secret is sparse becomes the exact algebraic condition that the
        sequence has small linear complexity.
      predicted_gain: >-
        An exponent collapse to polynomial time ON AND ONLY ON the sub-threshold region.
        NO GAIN AT THE DEPLOYED PARAMETERS, which is the predicted outcome.
    - transform: observable_fiber
      proposed_object: >-
        Hold the independent-equation count fixed at two and vary the length over primes;
        the distinguishing invariant is the order of two modulo the length.
      predicted_gain: >-
        Identifies the primitivity of two as a quantified algebraic-attack-surface
        parameter rather than an implementation convenience, and hands a concrete falsifier
        - any standardized length at which two is not primitive.
    quantifier_order: >-
      CLAIMED - FOR ALL odd primes with two primitive, FOR ALL secret weights, FOR ALL
      public elements of weight at most the threshold, and FOR ALL secrets whose node
      multiset is cancellation-free, THERE EXISTS a deterministic algorithm recovering the
      secret in a stated polynomial number of extension-field operations. THE WITNESS DOES
      NOT DEPEND ON THE INSTANCE, which is what makes this a threshold rather than an
      instance-specific trick. THE NEGATIVE DIRECTION HAS THE OPPOSITE AND WEAKER
      QUANTIFIER AND MUST NOT BE OVERSTATED - above the threshold there exists no algorithm
      OF THIS FORM, which is a statement about this lane and about nothing else.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the problem is polynomial-time below the stated public-weight threshold, and
        that the transform domain supplies exactly one plus the length minus one over the
        order of two independent equations. THE METHOD CAN NEVER CERTIFY ANYTHING ABOUT THE
        DEPLOYED INSTANCES - at a dense public element the observable is constant across the
        entire instance space and has zero discriminating power there.
      nearby_object_control: >-
        THE DEPLOYED SCHEME ITSELF, at the same ring, the same secret weight and the same
        rate but a dense public element. The method cannot distinguish a deployed instance
        from a random ring element pair, which is PRECISELY the statement that it does not
        attack the scheme. A second nearby object with an even larger secret weight puts
        the threshold further away still, and any implementation claiming otherwise there is
        buggy.
    proof_obligations:
    - claim: 'The linear complexity is at most the secret weight plus the public weight times the secret weight.'
      responsibility: size
    - claim: 'Transform, Berlekamp-Massey and node partition cost a stated polynomial number of extension-field operations.'
      responsibility: runtime
    - claim: 'Recovery is exact when the node multiset is cancellation-free.'
      responsibility: correctness
    - claim: 'Cancellation-freeness holds with the stated probability.'
      responsibility: success_probability
    - claim: 'The independent equation count is one plus the length minus one over the order of two.'
      responsibility: baseline
    - claim: 'The expected number of threshold-reaching multipliers is the stated exact product.'
      responsibility: size
    - claim: 'The recovery below the threshold is attributable to the transform mechanism rather than to instance easiness.'
      responsibility: interface
    - claim: 'The claim is scoped to the public weight and not to the deployed scheme.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Rate-one-half quasi-cyclic syndrome decoding over the binary cyclic ring of prime
      length, in the Hamming metric, in the key-recovery setting.
    prior_best: >-
      Classical information-set decoding at an exponent linear in the secret weight, and a
      quantum square-root of that. THE SPECIFIC CONSTANTS ARE RECALLED AND UNVERIFIED BY
      THIS PROGRAM.
    time_exponent: >-
      POLYNOMIAL IN THE LENGTH, on and only on the sub-threshold region. UNCHANGED at the
      deployed parameters, where the method does not apply at all.
    memory_exponent: >-
      Quadratic in the length in bits to hold the transform, plus the minimal polynomial.
      Classical memory only. NO QUANTUM RANDOM ACCESS MEMORY ANYWHERE in this record.
    hidden_cofactor: >-
      THE POLYNOMIAL IS LARGE AND SAYING SO IS PART OF THE CLAIM. A quadratic number of
      operations in an extension field of degree the length minus one is on the order of
      two to the forty-third to two to the fifty-sixth bit operations at the smallest
      deployed length depending on the field arithmetic used. Quoting polynomial-time
      without that figure would be misleading.
    claim_kind: exponent_improvement
    claim_kind_note: >-
      An exponent improvement CONDITIONAL ON A REGION THAT NO DEPLOYED PARAMETER SET IS
      PREDICTED TO LIE IN. The record's whole practical value is the size of the gap, not
      the improvement.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      For a public element expanded from a public seed by an extendable output function,
      the weight is distributed as a binomial with the length trials and probability one
      half; in particular the expected weight is half the length and the probability of
      falling below the threshold is bounded by the corresponding tail, which is
      astronomically small at every deployed parameter set.
    random_model_justification: >-
      The classical bound imitated is the Chernoff-Hoeffding tail for a binomial under the
      standard modelling of an extendable output as a uniform bit string. THE RIGOROUS HALF
      is that IF the element is uniform its weight IS exactly binomial; the heuristic half
      is only that the function's output is indistinguishable from uniform for this
      statistic.
    supporting_results: []
    supporting_results_note: >-
      EMPTY. The Chernoff-Hoeffding bound is classical but unopened by this program, and a
      recalled result may not discharge this field under AGENTS.md rule 9. The distribution
      is measured directly instead.
    validation_experiment_ids:
    - EXP-PFDR-f4cc45
    falsification_condition: >-
      A two-sided distributional test of the empirical weight distribution against the
      binomial rejects at the declared level, or the minimum observed weight over the
      sampled elements lies below the corresponding binomial quantile.
  - id: HEUR-002
    formal_statement: >-
      For a uniform public element, the number of multipliers meeting a joint weight bound
      concentrates about its EXACT expectation, in the sense that the probability of at
      least one such multiplier existing is at most the expectation up to a factor
      approaching one, whenever the expectation is small.
    random_model_justification: >-
      THE EXPECTATION IS EXACT AND NOT HEURISTIC - for a fixed nonzero multiplier and a
      uniform public element the product is uniform, so the joint probability factorises
      and linearity of expectation gives the product form with no assumption. The heuristic
      is only the first-moment-to-probability step, which Markov's inequality licenses
      rigorously in one direction.
    supporting_results: []
    supporting_results_note: >-
      EMPTY. The second-moment argument that would license the other direction for
      genuinely independent families is recalled and unopened.
    validation_experiment_ids:
    - EXP-PFDR-f4cc45
    falsification_condition: >-
      The observed minimum joint weight falls below the first-moment prediction by more
      than two standard deviations at two or more toy lengths, or a single multiplier
      meeting the threshold bound is found at any length above 1000.
  - id: HEUR-003
    formal_statement: >-
      For a uniform public support of a given size and uniform secret supports, the node
      multiset has all entries distinct except with probability at most the public weight
      times the square of the secret weight over the length, plus the square of the secret
      weight over the length.
    random_model_justification: >-
      A union bound over the colliding pairs, each colliding with probability the inverse
      length under the uniform-support model, imitating the classical birthday regime for
      balls in bins.
    supporting_results: []
    supporting_results_note: 'EMPTY. The union bound is elementary and is verified by direct enumeration rather than cited.'
    validation_experiment_ids:
    - EXP-PFDR-f4cc45
    falsification_condition: >-
      The empirical mean collision count exceeds twice the predicted value at two or more
      cells - which would mean the practical threshold is materially below the analytic one
      and the closure margin is LARGER than claimed, a self-strengthening falsification
      that is recorded as such.
  structural_ingredients:
  - description: >-
      The three deployed parameter sets and the design statement that the length is chosen
      as the smallest primitive prime above the product of the two inner lengths.
    citation: KN-LIT-b9e1a8
    provenance: kb
    verified_by: >-
      TASK-20260904-5423ad read knowledge/literature/KN-LIT-b9e1a8.md and confirms the
      three lengths 17669, 35851 and 57637, the secret weights 66, 100 and 131, and the
      primitive-prime design statement, at the level of that corpus record. The
      specification PDF itself was NOT opened by this task or, per the source idea, by the
      filing session.
    role: 'supplies the parameters and the corroboration for the primitivity design criterion'
  - description: >-
      That all classical information-set decoding variants share the same leading
      complexity exponent in the sublinear-weight regime, with advanced variants affecting
      only lower-order terms.
    citation: 'The sublinear-error-weight information-set decoding analysis. RECALLED, NOT READ.'
    provenance: recalled
    verified_by: null
    role: >-
      used only to justify quoting a baseline exponent; the baseline is MEASURED directly
      by the attribution control rather than taken from this citation
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: 'order of two modulo the length, for the three deployed lengths, an integer'
    direction: different
    minimum_effect: >-
      PREDICTED to equal the length minus one at all three. ANY length at which it is
      smaller is a positive finding, raises the independent-equation count to at least
      three, and escalates immediately rather than being filed.
  - metric: 'number of two-cyclotomic cosets, a count'
    direction: lower
    minimum_effect: 'predicted exactly 2, against a naive count equal to the length'
  - metric: 'analytic threshold, an integer public weight'
    direction: different
    minimum_effect: >-
      PREDICTED 132, 178 and 218 at the three deployed lengths. TASK-20260904-5423ad
      computed these from the corpus parameters as the floor of the length over twice the
      secret weight, minus one; the executor recomputes from the filed record and any
      disagreement halts the run.
  - metric: 'multiplicative deficit, the expected public weight divided by the analytic threshold, dimensionless'
    direction: higher
    minimum_effect: >-
      PREDICTED about 66.9, 100.7 and 132.2, which are close to but NOT EXACTLY the secret
      weights 66, 100 and 131. TASK-20260904-5423ad computed the discrepancy - it arises
      from the minus one in the threshold and is 1.4, 0.7 and 0.9 percent respectively.
      THE SOURCE IDEA'S CLAIM THAT THE DEFICIT IS EXACTLY THE SECRET WEIGHT IS AN
      APPROXIMATION AND IS RECORDED AS ONE. A measured deficit below 10 at any deployed
      parameter set falsifies the parameters or the analysis.
  - metric: 'base-two logarithm of the expected number of threshold-reaching multipliers, in bits'
    direction: lower
    minimum_effect: >-
      Predicted at most minus ten thousand at all three parameter sets. Any value above
      minus one hundred reopens the multiplier lane and makes a square-root search over
      multipliers worth costing.
  - metric: >-
      practical recovery threshold at toy lengths, the largest public weight at which
      recovery succeeds in at least 95 percent of trials, an integer
    direction: lower
    minimum_effect: >-
      At or below the analytic threshold, and below it by an amount consistent with the
      predicted cancellation rate. A practical threshold materially ABOVE the analytic one
      means the linear-complexity bound is wrong and must be re-derived.
  - metric: >-
      practical recovery threshold at primes where two is NOT primitive, minus the
      threshold at matched primes where it is, an integer
    direction: different
    minimum_effect: >-
      PREDICTED EXACTLY ZERO, because the linear complexity does not depend on the coset
      count. A nonzero difference means the threshold is driven by the equation count
      rather than by the linear complexity, and the mechanism is misattributed.
  - metric: >-
      charged operations of a generic information-set decoding baseline on the same
      instances below the threshold, against the transform route, as a ratio
    direction: higher
    minimum_effect: >-
      At least 10 in favour of the transform route. A ratio near 1 means the instance is
      simply easy below the threshold and the polynomial-time result is NOT attributable to
      the transform mechanism.
  test_boundary:
    instances:
    - >-
      Toy odd primes with two primitive, from about 31 to about 251, with secret weights
      from 3 to 8, sweeping the public weight from 1 past the analytic threshold, at least
      200 seeded trials per cell.
    - >-
      MATCHED toy primes at which two is NOT primitive, so the coset count is at least
      three, at the same secret weights and public-weight sweep.
    - >-
      Larger toy primes up to about 1021 for the multiplier-counting arm.
    - >-
      The three deployed parameter sets, for the arithmetic arm only - order of two, coset
      count, threshold, deficit and multiplier count. NO RECOVERY IS ATTEMPTED THERE.
    parameters:
      secret_weights: 'from 3 to 8 at toy lengths'
      trials_per_cell: 200
      multiplier_samples: '10 to the 7 per length and public element, at weights from 2 to 8'
      weight_distribution_samples: '10 to the 6 at the first deployed length, 10 to the 5 at the others'
    implementation: >-
      Transform, Berlekamp-Massey and node partition over the extension field of degree the
      order of two, with the order of a primitive element and the order of two both
      ASSERTED in the harness rather than assumed. Correctness and cost are measured and
      reported separately, since large-field arithmetic is expensive at toy scale for
      reasons unrelated to the method failing.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 24
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
  - >-
    The order of two is less than the length minus one at any deployed length - the
    Frobenius-collapse claim fails there, the independent-equation count rises, the
    transform-domain algebraic lane REOPENS, and it must be escalated rather than filed.
  - >-
    The measured practical threshold is materially ABOVE the analytic threshold at two or
    more toy lengths - the linear-complexity bound is wrong.
  - >-
    Recovery succeeds at a uniform public element at any toy length at a rate above the
    unsatisfiable control at high confidence - the dissolution claim fails and this would be
    a genuine attack signal on random quasi-cyclic syndrome decoding.
  - >-
    An explicit multiplier meeting the joint weight bound is found at any length above 1000
    with a uniform public element - HEUR-002's concentration fails and the multiplier lane
    reopens.
  - >-
    The measured deficit differs from the computed value by more than 10 percent at any
    deployed parameter set - either the parameters or the analysis is wrong, and both
    matter.
  - >-
    THE GENERIC DECODING BASELINE SUCCEEDS COMPARABLY BELOW THE THRESHOLD - the
    polynomial-time result is NOT attributable to the transform mechanism, and the record
    must attribute it to instance easiness instead.
  - >-
    THE THRESHOLD MOVES WITH THE COSET COUNT - the mechanism is misattributed; the threshold
    is driven by the number of independent equations rather than by the linear complexity.
  interpretation_limits:
  - >-
    NOTHING HERE IS AN ATTACK ON ANY DEPLOYED SCHEME. The predicted outcome is that all
    three parameter sets sit a factor of about the secret weight beyond the threshold and
    that the transform-domain lane is closed. The deliverable is two reusable numbers and a
    design criterion.
  - >-
    THE POLYNOMIAL-TIME CLAIM IS SCOPED to the public weight, to the binary cyclic ring of
    prime length, and to the Hamming metric. It says nothing about the moderate-density
    parity-check family, whose secret weight regime is different, nothing about the rank
    metric, and nothing about any correctness or failure-rate model.
  - >-
    THE POLYNOMIAL IS LARGE. A quadratic number of extension-field operations at the
    smallest deployed length is on the order of two to the forty-third to two to the
    fifty-sixth bit operations. Quoting polynomial-time without that figure would be
    misleading.
  - >-
    THE FIRST-MOMENT MULTIPLIER BOUND IS AN EXPECTATION. It rules out the lane on average
    over the public element; it is NOT a per-instance impossibility proof and is not claimed
    as one.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Recovery at a deployed length
    in the sub-threshold regime is NOT executed and is not reachable within this budget - it
    is a quadratic number of operations in a field of degree the length minus one. More
    importantly, whether the sub-threshold mechanism scales as the analysis says AT DEPLOYED
    LENGTHS is not measured at all, and the measured practical thresholds at lengths of at
    most 251 are hypothesis-generating for the scaling law only.
  - >-
    Toy lengths are small enough that the squared secret weight over the length is not
    small, so cancellation rates at toy scale OVERSTATE the practical threshold's shortfall
    relative to deployed scale. The extrapolation is stated with its scaling law and no
    claim is made beyond it.
  - >-
    NO CURVE-FREE NULL IS REQUIRED AND THE REASON IS RECORDED - this record contains no
    elliptic curve and makes no elliptic-curve claim. The analogous separation that DOES
    apply is between the transform mechanism and instance easiness, and between linear
    complexity and equation count, and both are enforced by named controls.
