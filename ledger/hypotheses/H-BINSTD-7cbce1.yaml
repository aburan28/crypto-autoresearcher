# =============================================================================
# H-BINSTD-7cbce1 -- Catalog-expansion successor: meet distinct-value floors
# before Spearman(dim(V·V), N_var) band reading. Specified from
# IDEA-20261003-f20e41 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Cites
# EV-BINSTD-a99d47. Approved DEC-20261003-928974. ZERO RUNS in design packet.
# No AUXIN. No Bedrock. No curve attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-7cbce1
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261003-f20e41
  experiment_id: EXP-BINSTD-16ee30
  goal_id: GOAL-ECDLP2M-001
  predecessor_hypothesis_id: H-BINSTD-880e8b
  predecessor_experiment_id: EXP-BINSTD-5b2fd0
  predecessor_evidence_id: EV-BINSTD-a99d47
  predecessor_decision_id: DEC-20261003-f82374
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-928974
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-928974
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-928974
  proposed_by: coordinator

  title: >-
    After EV-BINSTD-a99d47 floor failure, a diversity-seeking ≥24-shape V
    catalog meets ≥3 distinct dim(V·V) and ≥2 distinct N_var on n=17 Stage-1
    cells before any Spearman≥0.70 band reading of HEUR-BINSTD-febbe1-H1

  statement: >-
    CLAIM (heuristic_validation / encoding-size instrument; NO ATTACK; NO
    EXPONENT). Successor to H-BINSTD-880e8b after EV-BINSTD-a99d47
    (O-INCONCLUSIVE: distinct_dimVV=2; ℓ=4 distinct_Nvar=1). Let V ⊂ F_{2^n}
    be an F_2-subspace of dimension ℓ. Using a NEW diversity-seeking frozen
    catalog (seed 2026100320; ≥24 and ≤48 shapes; not the EXP-BINSTD-5b2fd0
    v1 catalog), FORALL Stage-1 cells (n,ℓ)∈{(17,3),(17,4)}: (i) ADMISSION
    — twin meters agree and the catalog yields ≥3 distinct dim(V·V) and ≥2
    distinct N_var; (ii) only after (i), Spearman's ρ(dim(V·V), N_var) ≥ 0.70
    (O-SUPPORT) OR fails the band (O-FAIL-BAND). If (i) fails →
    O-INCONCLUSIVE. NO break. NO n≥131 transfer. Do NOT re-run frozen v1.

  mechanism: >-
    OBJECT FRAME as IDEA-20261001-febbe1 / H-BINSTD-880e8b. Operation set
    CHANGE: diversity-seeking catalog construction (shifted poly, expanded
    geo seeds, affine twists, random expanders) with Stage-0 pre-screen of
    dimVV/N_var diversity on Stage-1 cells. Admission floors gate any
    Spearman band verdict. Twin dimVV + twin N_var meters unchanged.
    WHAT IS NEW: floors as explicit Stage-1 admission gates after
    EV-BINSTD-a99d47; new seed/recipe; ≥24-shape freeze.

  predictions:
    - metric: distinct_dimVV_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct dim(V·V) values per Stage-1 cell (admission)'
    - metric: distinct_Nvar_values
      direction: lower_bounded
      minimum_effect: '≥ 2 distinct N_var values per Stage-1 cell (admission)'
    - metric: spearman_dimVV_vs_Nvar
      direction: lower_bounded
      minimum_effect: '≥ 0.70 at each Stage-1 cell after admission'
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 24 distinct V shapes per Stage-1 cell'
    - metric: twin_agreement
      direction: same
      minimum_effect: >-
        dimVV path A = path B and N_var path A = path B on every measured V

  test_boundary:
    instances:
      - 'Stage 0: diversity-seeking freeze for (n,ℓ)∈{17,19,23}×{3,4}; twin probe'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3),(17,4)} admission floors then Spearman'
    parameters:
      spearman_band: 0.70
      catalog_seed: 2026100320
      bootstrap_seed: 2026100321
      bootstrap_reps: 200
      min_catalog: 24
      max_catalog: 48
      floor_dimVV: 3
      floor_Nvar: 2
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-16ee30/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin meters in product_space.py and encode_s3.py (same definitions as
      EXP-BINSTD-5b2fd0). No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - Reading O-SUPPORT/O-FAIL-BAND without admission floors.
    - Re-using EXP-BINSTD-5b2fd0 v1 catalog seed/recipe under this card.
    - Editing the 0.70 band after seeing encodings.
    - Claiming practical binary IC or an exponent move from a toy Spearman.
    - Transferring the 0.70 band to n≥131 without a new contract.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; admission floors met; Spearman ρ ≥ 0.70 on every Stage-1
        cell. Encoding-size predictor holds at toys under expanded catalog.
        No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; floors met; ρ < 0.70 on at least one Stage-1 cell.
        Product-dim-not-predictive of N_var at this scale (power-adequate).
    - id: O-INCONCLUSIVE
      meaning: >-
        Catalog still collapses below ≥3 distinct dim(V·V) or ≥2 distinct
        N_var on a Stage-1 cell after diversity-seeking freeze; band not
        read as support/fail.
    - id: O-ARTIFACT
      meaning: Twin disagreement or freeze/regression failure. No ρ claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never
        negative evidence against H-BINSTD-7cbce1.

  interpretation_limits:
    - Encoding-size correlation only; does not predict yield or beat rho.
    - Does not rewrite EV-BINSTD-a99d47 or re-score v1 under a new catalog.
    - Stage-2 (n=19,23 + random-Boolean null) not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.

  heuristic_assumptions:
    - id: HEUR-BINSTD-febbe1-H1
      formal_statement: >-
        FORALL Stage-1 cells (17,3)/(17,4): after admission floors on the
        frozen diversity-seeking catalog, Spearman ρ(dim(V·V), N_var) ≥ 0.70.
      random_model_justification: >-
        Same as IDEA-20261001-febbe1. Catalog expansion repairs instrument
        power after EV-BINSTD-a99d47; it does not change the heuristic.
      supporting_results:
        - EV-BINSTD-a99d47
        - IDEA-20261001-febbe1
        - KR-IC-73db3f
      validation_experiment_ids:
        - EXP-BINSTD-16ee30
      falsification_condition: >-
        Floors met and Spearman ρ < 0.70 (O-FAIL-BAND), OR twin failure
        (O-ARTIFACT), OR floors unmet after diversity-seeking freeze
        (O-INCONCLUSIVE).

  asymptotic_claim:
    problem: >-
      Encoding-size predictability of Weil-descended S_3 XOR-SAT from
      dim(V·V) at toy binary IC cells under a diversity-seeking catalog
    prior_best: >-
      EV-BINSTD-a99d47 (v1 floor failure); IDEA-20261001-febbe1 (parent band)
    time_exponent: >-
      NO EXPONENT MOVED. Encoding-size instrument only.
    memory_exponent: Negligible — store per-V dim(V·V) and N_var
    hidden_cofactor: Diversity-seeking catalog construction; encoder constants
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether a diversity-seeking catalog can meet distinct-value floors so
      that HEUR-BINSTD-febbe1-H1 becomes decidable at (17,3)/(17,4).
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, first frozen catalog entry; twin dimVV and twin N_var
        must agree on this probe before any Spearman band reading.
      reproduction_check: >-
        Independent check.py recomputes twin meters on the Stage-0 probe
        and on Stage-1 row0; refuses v1 catalog_seed; refuses band outcomes
        without admission floors.
    observation_collision:
      observable: 'the pair (dim(V·V), N_var) per V under expanded catalog'
      distinct_preimage_search: >-
        Floors (≥3 dimVV, ≥2 N_var) remain the collision control; Stage-0
        pre-screen seeks expanders but Stage-1 twin recount is authoritative.
    constructive_transforms:
      - transform: catalog_diversity_seeking
        proposed_object: >-
          ≥24-shape freeze with shifted poly / geo / twists / random
          expanders; floors as admission gates before 0.70 band.
        predicted_gain: >-
          A decidable O-SUPPORT/O-FAIL-BAND (or honest O-INCONCLUSIVE if
          floors still fail) without re-running v1.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3) and (17,4): floors THEN ρ ≥ 0.70 predicted.
      NOT CLAIMED: n∈{19,23} under this card; n≥131; any attack; v1 re-score.
    method_ceiling:
      strongest_certifiable_claim: >-
        On named Stage-1 toys under the expanded catalog, either floors fail
        (O-INCONCLUSIVE) or Spearman vs 0.70 decides support/fail with twins.
      nearby_object_control: >-
        Twin disagreement (artifact); floor failure (inconclusive); v1
        catalog reuse forbidden by check.py.
    proof_obligations:
      - claim: Twin dimVV paths agree on every measured V.
        responsibility: baseline
      - claim: Twin N_var paths agree on every measured V.
        responsibility: baseline
      - claim: Admission floors gate any band verdict.
        responsibility: success_probability
      - claim: Catalog seed/recipe is not the v1 freeze.
        responsibility: baseline
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
