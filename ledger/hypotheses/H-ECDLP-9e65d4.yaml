  statement: >
    Fix the exact F_9 parent-from-children
    identity S = s0 + F(s1) before any
    P1553 recurrence, Semaev polynomial,
    factor-base table, or sparse rank
    audit is built. Stage 0 asserts only
    that on the frozen REAL ring
    F_3[α]/(α^2+1) one has F(a+bα) =
    a+2bα, children s0=1+α, s1=1+2α,
    parent 2+2α, and that the nearby KF
    identity-Frobenius map (a,b)->(a,b)
    yields parent 2 and is rejected as a
    generic End=Z / F_p target. NULL
    empty child pair rejected. p=0
    rejected. This is not a Semaev
    relation, not a rho beat. Stages 1+
    stay unauthorized.
  mechanism: >
    IDEA-20260825-49129b Stage 0 hard
    gate is the semilinear parent update
    and its nearby-object counterpart,
    derived from the frozen F_9 ring
    alone. Stage 0 freezes that identity
    as exact tables. No Semaev S_m. No
    P1553 recurrence. No factor-base.
    No Velu. This is a new GOAL-ECDLP-001
    object after Stage 0 of
    EXP-ECDLP-71c37d held as P-S0-EMBORD
    (DEC-20260908-e7f0f1). It is not
    Stage 1 of EXP-ECDLP-71c37d and not
    Stage 1 of this experiment.
  predictions:
    - id: P-S0-FROBSEM
      metric: well-defined F_9 semilinear parent table on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL parent
        equals 2+2α, F(s1) equals 1+α,
        and KF identity-Frobenius is
        rejected. NULL empty pair is
        rejected. p=0 is rejected. One
        certified miss after fixture_pass
        is a scoped falsification of this
        instrument at the frozen toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF identity-
        Frobenius is accepted as a
        generic sparse-automaton target.
        An encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL fails
        to match parent 2+2α or F(s1)=1+α.
        That falsifies only P-S0-FROBSEM
        at the frozen toy.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      real_ring:
        p: 3
        modulus: [1, 0, 1]
        alpha_squared: 2
        s0: [1, 1]
        s1: [1, 2]
        must_F_s1: [1, 1]
        must_parent: [2, 2]
      known_false:
        kind: identity_frobenius
        must_parent: [2, 0]
        must_reject: true
      matched_null: {kind: empty_pair, must_reject: true}
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-6b3d67 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is exact F_9
      ring arithmetic of one frozen
      parent update and one identity-
      Frobenius nearby map. It is not
      Semaev, not a P1553 recurrence,
      not Stage 1 of EXP-ECDLP-6b3d67,
      and not Stage 1 of EXP-ECDLP-71c37d.
      No cryptographic transfer. No
      rho beat.
  assumptions:
    - id: A1
      statement: >
        REAL is F_3[α]/(α^2+1) with
        children (1+α, 1+2α). KF is
        identity Frobenius. Stage 0
        does not build a P1553
        recurrence or Semaev S_m.
      status: explicit
    - id: A2
      statement: >
        IDEA-20260825-49129b is the
        sparse Frobenius-semilinear
        automaton claim. Stage 0 tests
        only the F_9 parent calibrator,
        not the proposal's rank bound
        or p^{1/3} aspiration.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether a declared F_9 parent
      equals s0 + F(s1) with
      F(a+bα)=a+2bα, and whether an
      identity-Frobenius nearby map
      is rejected as generic.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: F_9
        parent-from-children calibrator
        only, not the proposal's
        P1553 recurrence.
      reproduction_check: >
        REAL parent equals 2+2α.
        F(s1) equals 1+α. KF identity
        Frobenius rejected. NULL empty
        pair rejected. p=0 rejected.
    observation_collision:
      observable: field Frobenius versus identity Frobenius
      distinct_preimage_search: >
        Hold the children and replace
        F by the identity (KF). Hold
        the pair and replace it by
        empty (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact F_9 semilinear parent table.
        predicted_gain: >
          Exact known-false identity-
          Frobenius reject on KF. Zero
          claimed attack improvement.
    quantifier_order: >
      Freeze the ring and children
      before reading the table.
      Existential equality at one toy
      does not imply a rank bound and
      does not imply a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen toys. Never a
        Semaev bound. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is the empty child pair.
        An argument that still assigns
        it a true parent table is
        proves-too-much.
