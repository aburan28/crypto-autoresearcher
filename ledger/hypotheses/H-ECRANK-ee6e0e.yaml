      construction output.
    baseline_embedding:
      parameter_slice: >-
        d = (1,...,1), delta == 1: the vanishing system of M2 contains
        Mestre's trunc-sqrt g as a solution for every n <= 10 (deg(g^2 -
        p) <= n/2 - 1 <= 4), so the engine restricts EXACTLY to the
        committed single-class machine where the baseline is elliptic.
      reproduction_check: >-
        Audit 1 of the idea, carried at the desk and confirmed by one
        deterministic evaluation (idea run 1, pure Fractions): at A =
        (+-1, +-3, +-5, +-7), deg p = 8, deg g = 4, s(a_i) = g(a_i)^2
        holds for all 8 points exactly -- and this symmetric A yields the
        CONSTANT s = 4096: the identity holds perfectly and the instance
        is degenerate (not elliptic). The nondegeneracy filter is
        therefore a real condition, and the committed machine enforces
        exactly this ("s is not a cubic" AssertionError). Committed scale:
        the same assertion runs inside mestre_polys on every build
        (2,985 + 39,876 constructions; re-derived on all 1206 pool curves
        by EV-ECRANK-6695dc). Honest delta: at n >= 12 the closed form
        gives deg s = n/2 - 1 >= 5, so the engine's ellipticity constraint
        is STRICTLY STRONGER than Mestre even at d = 1.
    observation_collision:
      observable: >-
        (populated class set, certified total with certificate-kind split)
        of the constructed k = 3 coset.
      distinct_preimage_search: >-
        Audit 2 of the idea, carried. Equal totals with different class
        distributions are abundant by design (the equal-maximum/different-
        total phenomenon of EV-ECRANK-6695dc: at fixed max 3, totals
        10..18); the separator missing in that batch's fits exists here BY
        CONSTRUCTION -- the d_i are INPUTS, so which classes carry the
        points is known, not inferred. The 2-design blindness (O-01) does
        not apply: no relation is fitted to any enumeration. Residual
        collision (distinct (b, r) solutions giving isomorphic curves) is
        deduped by minimal model, a committed routine -- and the contract
        counts distinct minimal models only (O-08 pseudo-replication
        lesson: 1206 records were 1169 distinct models).
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        the delta-multiplier engine / square-pattern points in the
        5-dimensional subspace W'(b).
      predicted_gain: >-
        m >= 4 populated classes of one k = 3 coset by construction,
        certified descent-free -- a new value on an axis where the
        committed record holds 0.
    - transform: stronger_invariant
      proposed_object: >-
        certificate-kind-split totals (exact eigenspace units + F_l
        units), replacing the min(r_low, #points)-with-floating-regulator
        totals of the committed batch.
      predicted_gain: >-
        a degree-8 total with ZERO descent and ZERO floating point in its
        exact part, per the O-06 guardrail.
    quantifier_order: >-
      Audit 3 of the idea, carried. The claim is a pure existence
      statement, finite and exhibitable: EXISTS a quartic s, EXISTS
      distinct rationals b_1..b_n, EXISTS r_1..r_n (all explicit), SUCH
      THAT FOR ALL i: s(b_i) = d_i*r_i^2, the model is nonsingular, the
      points are non-torsion, and independence is certified (eigenspace
      exact across classes; F_l within). NO universal claim over cosets,
      NO averaged relation transferred to an extreme instance (the PA-02
      quantifier-swap failure is excluded by form). HEUR-1 is a density
      heuristic about the SEARCH, not a premise of any certificate: a
      produced instance certifies regardless of HEUR-1's truth.
    method_ceiling:
      strongest_certifiable_claim: >-
        At k = 3: <= 8 exact eigenspace units (PA-03: the ceiling is
        saturated everywhere in the committed scan) plus multiplicity
        units certified by F_l reduction (exact) or regulator (numerical,
        weaker kind). A total >= 32 at degree 8 would be <= 8 exact +
        >= 24 multiplicity units -- WEAKER IN KIND than the held
        degree-32 certificate (32 exact, no numerics), and every report
        must carry that split; "degree 8 beats degree 32" without the
        split is forbidden (O-06).
      nearby_object_control: >-
        Audit 4 of the idea, carried. Nearby object: the k = 4 coset
        (degree 16, committed-support k4 optimum 32 at level A, O-14/C-06)
        -- the same engine at n = 16 across 8 classes would test whether
        the quadratic-system heuristic degrades with coset dimension
        exactly as H^(5 - n/2) says. OUT OF CONTRACT SCOPE (n <= 10 wall
        discipline); named as the successor test if P0-P3 pass. Known-
        false control (proves-too-much): d = (1..1), where "total = n" is
        KNOWN FALSE (Mestre ceilings 7/9 -- the g - y relation eats 1); a
        pipeline passing total = n there is broken. This control IS bound
        into the contract's invalidation rules.
    proof_obligations:
    - claim: the forcing identity s(b_i) = delta(b_i)*g(b_i)^2 and its point reading (M0/M2)
      responsibility: correctness
    - claim: the parameter count -- n - 5 quadratic conditions, family dimension n + 4, W'(b) 5-dimensional (M3)
      responsibility: size
    - claim: ellipticity and nondegeneracy are open conditions filterable exactly (deg s in {3,4}, nonsingular, g(b_i) != 0)
      responsibility: feasibility
    - claim: cross-class independence exact by eigenspace; within-class by F_l; [K:Q] = 8 by 7 square tests (M5)
      responsibility: correctness
    - claim: HEUR-1 density and the search budget bound (test_boundary)
      responsibility: success_probability
    - claim: certificate-kind split carried in every reported total (M4)
      responsibility: scope
    not_applicable_reason: null

  predictions:
  - metric: certified descent-free k = 3 total (exact eigenspace units + F_l units, split carried)
    direction: higher
    minimum_effect: >-
      >= 6 at n = 6 (P0); >= 8 at n = 8 with 4 distinct populated classes
      (P1/P2); >= 10 at n = 10 plus >= 1 scan-found point in a non-forced
      class (P3). Against axis B's committed value of 0, any of these is a
      new frontier value; against axis A's 20 they are below and recorded
      as such (sota honesty note below).
  - metric: count of nonsingular forced instances found vs box height H at n = 8
    direction: different
    minimum_effect: >-
      growth consistent with H^1 (HEUR-1: ~10x per decade of H over the
      nested boxes H = 10^2, 10^3, 10^4); a flat count as H increases is
      the canonical artifact tell (inventor protocol, controls before
      belief) and fires F1's scope.
  - metric: measured per-class relation count c_e on nontrivial classes
    direction: lower
    minimum_effect: c_e = 0 for all nontrivial classes with n_e = 2 (HEUR-2); c_e >= 2 fires F3.

  test_boundary:
    instances: >-
      Quartic models v^2 = s(u) over Q produced by the M2/M3 engine; twist
      classes drawn from ONE k = 3 coset of the committed support {-1, 2,
      3, 5, 7, 11, 13} (the committed enumeration counts 11,811
      3-dimensional subspaces x 16 = 188,976 affine k = 3 subspaces); the
      experiment picks cosets whose direction space contains -1, so mixed
      signs -- and hence real solvability -- are guaranteed.
    parameters:
      arm_A_anchor: n = 6, 3 classes x 2 points; local-solvability checks (real place + primes p <= 100) + instance search over 10^3 seeded b-tuples.
      arm_B_main: n = 8, 4 classes x 2 points; 10^4 seeded b-tuples (b_1 = 0, b_2 = 1, b_3..b_8 distinct integers in [-20, 20]); nested height boxes H = 10^2, 10^3, 10^4; r-height <= H.
      arm_C_scale: n = 10, 5 classes x 2 points (density exponent 0); same sample derivation as arm B.
      augmentation_scan: >-
        per-class exact square test s(u) = d * square over u = num/den,
        |num| <= 10^3, 1 <= den <= 20 (widened vs the committed |n| <=
        400, d <= 12), on the best constructed instance (n = 10 if found,
        else n = 8) plus 8 null random quartics of matched height and
        coefficient size.
      solver: >-
        exact linear algebra over Q (Fractions) for W'(b) and delta;
        fibration/Bézout or seeded square-pattern sampling for the
        quadratic system; NO Groebner machinery required at n <= 10;
        stdlib only, no PARI, no network.
    implementation: >-
      New module beside the committed machinery (NEVER an edit to
      construct_highrank.py or coset_structure.py, per EV-ECRANK-6695dc
      defect D4's remedy rule); reuse committed verify_certificate.py-
      style exact checks, quartic_reduction/cubic_to_weierstrass, the F_l
      certifier of IDEA-20260829-d53906's design, Mazur non-torsion.
    budget:
      note: the frozen numbers live in experiments/EXP-ECRANK-76a70d/specification.yaml; summarized here for readability
      wall_clock_seconds_per_run: 7200
      maximum_memory_gb: 8
      counted_exact_rational_operations_per_arm: 1.0e8
      descent_calls: 0
      pari_ellrank_calls: 0
      network: none
    scope_wall: >-
      n <= 10 EVERYWHERE (wall discipline, prior point 5). Nothing in the
      hypothesis or contract promises the unpriced wall-crossing route
      (n >= 12, or the M6 scale route to total >= 32); both are named,
      unpriced, and excluded.

  falsification_conditions:
  - id: F1
    condition: >-
      The pre-registered declared sample at n = 8 (10^4 seeded b-tuples,
      resolution floor q = 10^-3) is exhausted within the counted-ops/wall
      cap and contains NO nonsingular instance => HEUR-1's small-height
      density is falsified ON THAT SAMPLE SCOPE (rule 6: only the tested
      scope closes; this is not evidence the mechanism is impossible, and
      per rule 3 a budget exhaustion is reported as exhaustion, never as a
      result).
  - id: F2
    condition: >-
      A local obstruction is MEASURED: a prime p or the real place where
      the diagonal system has no nontrivial zero for EVERY b in the
      declared sample => a named obstruction with quantity, value, and
      scope -- the closure-standard object, and a kill of rational
      solvability on that scope.
  - id: F3
    condition: >-
      c_e >= 2 measured for most nontrivial classes with n_e = 2 =>
      HEUR-2 falsified; every target total in P3/P4 is revised upward by
      the measured c_e, and the mechanism's yield claim dies as stated.
  - id: F4
    condition: >-
      Every found n = 8 instance has height(s) > 10^8 => the small-height
      half of HEUR-1 is weakened and P4 is declared infeasible on the
      height axis absent new structure.
  - id: F5
    condition: >-
      The committed exact verifiers reject any exhibited witness
      (off-curve, torsion, transport mismatch) => the algebra of M0-M3 is
      wrong and the mechanism is falsified as stated (the forcing identity
      is a theorem; failure there is a defect in the record or its
      implementation, not in the mathematics).
  - id: F6
    condition: >-
      The per-class augmentation-scan yield on constructed instances is
      statistically indistinguishable from the null-object random-quartic
      yield (one-sided Fisher exact, alpha = 0.05, at the declared box) =>
      the seeds-and-fills route (M6) buys nothing measurable and P4's only
      open path closes. Power is limited at the declared box; disclosed.

  walls:
  - id: H1
    name: the ellipticity wall
    statement: >-
      deg s <= 4 caps what ONE elliptic quartic can force: Mestre's own
      closed form gives deg s = n/2 - 1 (elliptic only for n <= 10);
      fixed-b solution density decays as H^(5 - n/2) (H^-1 at n = 12,
      H^-11 at n = 32); and for n >= 12 the vanishing system is strictly
      stronger than Mestre even at d = 1 (no closed form). The parameter
      count SURVIVES multi-class forcing -- abundantly at n = 8,
      borderline at n = 10 -- and the route past the wall is M6
      (construction seeds 4-5 classes; the exact per-class scan fills),
      whose yield is unmeasured and whose failure mode is F6. This wall is
      the honest bottom line of the degrees-of-freedom arithmetic, and it
      is why P4 is flagged optimistic rather than predicted.
    contract_effect: >-
      The contract's scope is n <= 10 with no budget line, stopping rule,
      or success criterion referencing n > 10 or total >= 32; the
      wall-crossing route is named in M6 and P4 and is NOT promised.

  assumptions:
  - Every reported rank is a LOWER BOUND from exhibited points; no analytic rank, no r_high, no point-free bound ever counted (committed certification rule).
  - The committed support {-1,2,3,5,7,11,13} and its k = 3 coset enumeration (188,976 affine subspaces) are exact (re-verified by EV-ECRANK-6695dc enumeration-completeness observation).
  - The F_l certifier of IDEA-20260829-d53906's design certifies within-class independence exactly; until it is run against THIS engine's points this is a design assumption, tested by P2.
  - The O-12 affine-parity reading (even totals on the five certified cosets) is a property of those cosets, NOT universal (78 odd-total curves in the committed scan); P4 targets 32 for safety, and 31 is not excluded.
  - Infrastructure failures (timeouts, solver crashes, box exhaustion) are recorded as inert in both directions, never as evidence (AGENTS.md rules 3 and 5).

  confounders:
  - >-
    Selection-on-the-outcome: instances are found by searching for forced
    points, so any later DISTRIBUTIONAL statistic on found instances
    (heights, class patterns, scan yields) is conditioned on that search --
    the O-09 lesson carried forward; existence claims ("an instance
    exists") are not damaged by it. The contract's distribution metric
    (counts vs H) is computed over the PRE-DECLARED seeded sample, not
    over an adaptively widened box, which limits but does not eliminate
    this conditioning; disclosed.
  - >-
    The b-box, r-box, and scan box are declared before the run; widening
    them post hoc to rescue F1 converts a falsification into a moving
    target -- a widening is a NEW experiment with its own contract (the
    contract's stopping rules forbid adaptive widening).
  - >-
    Pseudo-replication: several found instances may share minimal models
    or be affine images of one another (x |-> alpha*x + beta); counts must
    be over distinct minimal models (the O-08 lesson: 1206 records were
    1169 distinct models). The contract counts distinct minimal models
    only.

  interpretation_limits:
  - >-
    NOTHING IN THIS RECORD IS A RANK CLAIM, A CLOSURE, OR EVIDENCE. It is
    a specified hypothesis; every number is either read from a committed
    record named beside it, computed by desk arithmetic (idea run 1;
    design run 1 of TASK-20260905-ccbf5c), or a prediction to be tested.
  - >-
    Toy scale by inheritance: the test boundary lives at the committed
    small-coefficient scale; nothing here transfers to cryptographic
    parameters, supports no ECDLP claim, and no asymptotic claim is made
    (asymptotic_claim is null above).
  - >-
    HEUR-1's recalled literature pointers (Schinzel-type square-pattern
    heuristics, Nagao-style systems, Birch-type solvability,
    Hasse-Minkowski via Serre) are POINTERS, never support; the heuristics
    stand or fall on the P0-P3 measurements, not on remembered citations.
  - >-
    If P0-P3 falsify the mechanism on the tested scope, the honest output
    is a measured obstruction (F1/F2/F3/F4 with quantity, value, scope)
    plus the resource_check the closure standard requires -- not a verdict
    that multi-class forcing is dead.
  - >-
    SOTA HONESTY (carried from the idea's sota_delta): the first-
    experiment target (total 8-12) is BELOW the committed axis-A frontier
    (20 = 8 exact + 12 regulator units): delta -12 to -8, stated not
