  statement: >-
    THERE EXIST explicit nonsingular quartic models E : v^2 = s(u) over Q,
    produced by the delta-multiplier engine (delta = the Lagrange
    interpolant with delta(b_i) = d_i; s := delta*g^2 mod p, p = prod(x -
    b_i)), on which 8 rational points across 4 DISTINCT quadratic-twist
    classes of ONE k = 3 coset of the committed support {-1, 2, 3, 5, 7,
    11, 13} are forced BY CONSTRUCTION -- s(b_i) = d_i * g(b_i)^2 holds
    identically, each (b_i, g(b_i)) is a rational point of the twist
    E^(d_i) by substitution, never by descent or point search -- within
    the frozen box (b_1 = 0, b_2 = 1, b_3..b_8 distinct integers in
    [-20, 20]; r-height <= 10^4; <= 10^8 counted exact rational
    operations), certified descent-free with a k = 3 total contribution
    from the forced classes of >= 8 = >= 4 exact eigenspace units + >= 4
    exact F_l within-class units, certificate-kind split carried. AND the
    fixed-b solution density of the engine follows HEUR-1's law ~ C(b,d) *
    H^(5 - n/2): abundant at n = 8 (exponent +1, counts growing ~10x per
    decade of H), finite-expected-nonzero at n = 10 (exponent 0), and
    near-rigorous at n = 6 (exponent +2; ONE diagonal quadratic form in 6
    variables, where Hasse-Minkowski -- recalled pointer, pending
    verification -- makes existence equivalent to checkable local
    solvability). The claim is conditional on HEUR-1 and HEUR-2 exactly
    where they are named: a produced instance certifies regardless of
    HEUR-1's truth (quantifier-order audit 3 of the idea, carried), while
    the SEARCH budget and the yield predictions rest on the heuristics.

  mechanism: >-
    CARRIED FROM IDEA-20260905-d5608c M0-M6, condensed without loss.
    [M0 FORCING IDENTITY.] For E : v^2 = s(u) and squarefree d, the twist
    E^(d) is d*v^2 = s(u); ANY rational pair (b, r) with s(b) = d*r^2 IS
    a rational point (b, r) on E^(d) by substitution (internal precedent
    IDEA-20260829-01cbc5, short-Weierstrass form; the quartic form is the
    same identity). Nothing downstream finds points by descent.
    [M1 COMMITTED ENGINE.] construct_highrank.py (TASK-20260822-a7a9e8,
    re-verified by EV-ECRANK-6695dc on all 1206 pool curves): p =
    prod(x - a_i) monic degree 2k; g = the unique monic degree-k
    polynomial with deg(p - g^2) <= k - 1 (polysqrt_trunc, exact
    coefficient matching); s := g^2 - p; then s(a_i) = g(a_i)^2
    IDENTICALLY. Elliptic exactly when deg s <= 4, i.e. 2k <= 10.
    Certified rank 13 over Q on E alone -- ONE class (d = 1).
    [M2 DELTA MULTIPLIER.] Fix n distinct rationals b and squarefree
    classes d from ONE k = 3 coset; delta := Lagrange interpolant with
    delta(b_i) = d_i (degree <= n - 1, unique, ZERO dof consumed); s :=
    delta*g^2 mod p, p = prod(x - b_i). Then s(b_i) = d_i * g(b_i)^2
    holds IDENTICALLY FOR EVERY g. The only constraints: (a) ellipticity
    deg s <= 4 -- the top n - 5 coefficients of delta*g^2 mod p vanish:
    n - 5 QUADRATIC equations in the k_g + 1 coefficients of g, solution-
    family dimension k_g + 6 - n (>= 0 iff k_g >= n - 6); (b)
    nondegeneracy: g(b_i) != 0, deg s in {3, 4}, s nonsingular, points
    independent. NO DEGREE MULTIPLICATION: s stays quartic at every n,
    conditions stay degree 2, only their NUMBER grows linearly. At d =
    (1..1) the system contains Mestre's trunc-sqrt whenever n <= 10; for
    n >= 12 Mestre's closed form gives deg s = n/2 - 1 >= 5, so the
    ellipticity constraint is strictly stronger than Mestre even at d = 1.
    [M3 SUBSPACE FORM, EXACT PARAMETER COUNT.] The conditions say exactly
    that v = (d_i*r_i^2) lies in W(b), the 5-dimensional evaluation image
    of quartics at b (left kernel: n - 5 independent linear relations
    from the 5 x n Vandermonde), equivalently u = (r_i^2) lies in the
    computable 5-dimensional subspace W'(b) = D^-1 W(b). Multi-class
    forcing = FINDING A POINT OF W'(b) WHOSE EVERY COORDINATE IS A NONZERO
    RATIONAL SQUARE. Count: b (n) + r projectively (n - 1) - conditions
    (n - 5) = an (n + 4)-DIMENSIONAL FAMILY FOR EVERY n >= 6; at n <= 5
    there are no conditions at all. Mestre's trunc-sqrt solves d = 1
    identically; for mixed d NO closed form is committed and the quadratic
    system is the single search step. HEUR-1 density: expected
    square-pattern points of height <= H in W'(b) ~ C(b,d) * H^(5 - n/2):
    n = 6 -> H^2, n = 8 -> H^1 (abundant), n = 10 -> H^0 (finite,
    expected nonzero), n = 12 -> H^-1, n = 32 -> H^-11.
    [M4 RELATIONS AND CEILINGS.] Mestre's one relation (sum of forced
    points = O via g - y) lives in class d = 1 and eats exactly 1 point
    (committed ceilings 7 and 9, attained exactly per EV-ECRANK-6695dc).
    For nontrivial class e, (g^2 - s)(b_j) = (1 - d_j)*g(b_j)^2 != 0, so
    no automatic relation descends; HEUR-2 predicts c_e = 0 for n_e <= 2
    and the experiment MEASURES c_e (P2) rather than assuming it.
    Cross-class independence is EXACT by the committed eigenspace argument
    (distinct square classes -> distinct chi_d-isotypic components ->
    Z-independence by algebra; twist_family.py, analysis.md); within-class
    by the exact F_l-reduction certifier of IDEA-20260829-d53906's design
    (instrument priced: 31 jointly independent points in 1.831 s over 45
    good primes, RUN-ECQ-f5af06-v2-A-certify), numerical regulator as
    cross-check only, never as the certificate. CERTIFICATE-KIND SPLIT IN
    EVERY TOTAL (O-06 guardrail): at k = 3 the exact eigenspace ceiling is
    8 (saturated everywhere in the committed scan, PA-03); any total above
    8 is necessarily weaker in kind than the held degree-32 certificate
    (32 exact, no floating point), and no record from this line may say
    "degree 8 beats degree 32" without the split.
    [M5 CERTIFICATION PATH, ZERO DESCENT.] Forced points -> committed
    quartic_reduction / cubic_to_weierstrass (built-in exact on-curve
    rechecks) -> transport into E(K) through the committed certificate
    machinery's explicit transport factor (the GOAL-ECRANK-001
    XOR-cancellation failure mode was found and fixed by the independent
    verifier) -> exact eigenspace independence across classes + F_l within
    -> Mazur non-torsion on every point (m*P != O, m = 1..12) -> Kummer
    [K:Q] = 8 by 2^3 - 1 = 7 exact integer square tests, no
    factorization. r_low is NEVER computed; the min(r_low, #points)
    convention that made every committed k = 3 number descent-dependent is
    bypassed; every claim is a lower bound from exhibited points.
    [M6 SCALE ROUTE PAST THE WALL -- OUT OF CONTRACT SCOPE, NAMED NOT
    PROMISED.] Past the ellipticity wall the route is: force a core
    (n = 8-10, 4-5 classes) by construction, then fill classes and
    multiplicities with a per-class augmentation scan (exact integer
    arithmetic test s(u) = d * square; the generalization of the committed
    extra_quartic_points, "the untouched knob"). The contract runs the
    scan ONLY as the bounded P3/F6 test (constructed core + null-object
    control at a declared box); the scale route itself (total >= 32) is
    P4, unpriced, and no budget line of the contract promises it.

