  heuristic_assumptions:
  - id: HEUR-1
    formal_statement: >-
      For a fixed generic n-tuple b of distinct rationals and squarefree d
      with mixed signs, the set {u in W'(b) : every u_i a nonzero rational
      square} has counting function ~ C(b,d) * H^(5 - n/2) as the height
      bound H grows, with C(b,d) > 0 iff the system is solvable at every
      local place. QUANTIFIERS: for fixed b (generic, i.e. outside a
      proper Zariski-closed degenerate locus), for the distribution of
      square-pattern points of W'(b) as H -> infinity; the asymptotic
      constant C(b,d) is per-(b,d) and its positivity is exactly the
      local-solvability condition.
    random_model_justification: >-
      Points of a fixed 5-dimensional rational subspace of height <= H
      number ~ H^5 (lattice-point count in a rational subspace); a
      coordinate of size ~ X is a rational square with probability ~
      X^(-1/2) (square-counting), and square-class equidistribution of
      subspace-point coordinates is the standard random-model assumption
      in this genre. Interpolation between rigorous anchors, as the
      heuristic-validation pattern requires: AT ONE END the d = (1..1)
      slice is NOT heuristic -- Mestre's closed form gives the exact
      solution (deg s = n/2 - 1) for every n <= 10, committed and
      re-verified internally (construct_highrank.py per-build assertion;
      EV-ECRANK-6695dc on all 1206 pool curves); AT THE OTHER END the
      n = 6 case is one diagonal quadratic form in 6 variables, where the
      Hasse-Minkowski local-global principle (RECALLED pointer -- Serre,
      A Course in Arithmetic, Ch. IV; verification pending per rule 9)
      converts existence into finitely many checkable local conditions.
      HEUR-1 is the equidistribution assumption interpolating between
      these two exact anchors at mixed d, 6 < n <= 10.
    supporting_results: []
    supporting_results_note: >-
      EMPTY BY RULE 9, deliberately: the nearest literature pointers
      (Schinzel-type square-pattern heuristics, Nagao-style Diophantine
      constructions, Birch-type solvability of quadratic systems) are all
      RECALLED and may not discharge this field. The rigorous anchors
      actually relied on are the internal ones named in
      random_model_justification (the committed d = 1 closed form and its
      re-verification) plus the exact parameter count of M3 (desk
      arithmetic, run 1 of TASK-20260905-b5a40f, recorded in its notes).
    validation_experiment_ids:
    - EXP-ECRANK-76a70d
    falsification_condition: >-
      F1 (the pre-registered declared sample at n = 8 is exhausted with no
      instance -- falsifies the small-height density ON THAT SAMPLE SCOPE
      only) or F4 (height blow-up beyond 10^8 on every found instance).
    validation_plan: >-
      Arms A/B/C of EXP-ECRANK-76a70d: distribution of distinct-minimal-
      model instance counts vs H at n = 8 (predicted exponent +1: ~10x per
      decade), against n = 6 (+2) and n = 10 (0) as the different-scale
      parameter sets; pre-registered, never adjusted after any run
      (amendment path only).
  - id: HEUR-2
    formal_statement: >-
      For a nontrivial twist class e != 1 carrying n_e forced points from
      the delta-multiplier engine, the number of independent function-
      theoretic relations among the forced points over Q is c_e = 0 when
      n_e <= 2 (no automatic relation descends). Quantifiers: for every
      nontrivial class e, for generic b (special positions of the b_i
      excluded by the genericity condition of HEUR-1's locus).
    random_model_justification: >-
      Not a random model -- a divisor argument: the only committed
      relation producer (g - y and its norm g^2 - s) provably does not
      vanish at forced points of nontrivial classes, since
      (g^2 - s)(b_j) = (1 - d_j)*g(b_j)^2 != 0 when d_j != 1. Residual
      relations would be accidental (special position of the b_i), which
      genericity excludes. LOAD-BEARING: yes -- the success criterion's
      "total >= 8 = 4 eigenspace + 4 F_l units" requires within-class
      independence of the 2 forced points per class, which this heuristic
      underwrites until measured.
    supporting_results: []
    supporting_results_note: >-
      Empty by rule 9 as for HEUR-1: the supporting argument is the
      internal divisor computation above (M4), which is exact algebra
      recorded in the idea and re-derivable from the committed machinery,
      not a literature citation.
    validation_experiment_ids:
    - EXP-ECRANK-76a70d
    falsification_condition: F3 (c_e >= 2 measured for most nontrivial classes).
    validation_plan: >-
      P2 -- F_l certifier and regulator cross-check on the arm-B
      instances; c_e is a primary secondary-metric of the contract.

