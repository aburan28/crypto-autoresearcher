    total: committed 0 -> target >= 8, a new value on an axis the ledger
    has never populated) and axis C (classes populated by construction on
    one curve: committed 1 -> target 4). Axis D (single-class rank over Q,
    committed 13) is not contested, delta 0. dominated_by: null was
    argued row-by-row over an 8-row frontier table in the idea and its
