hypothesis:
  archive_retry_note: >-
    This design package was re-snapshotted after the first unadmitted archive
    attempt omitted required task identifiers from its commit message.
  id: H-XOR-2c2c85
  question_id: RQ-ECDLP-002
  statement: >-
    On the declared toy Semaev m=3 cells, the x-oracle MITM arm B's relation
    yield and exact relation set differ from a right-table random-from-F_p null
    arm D because B preserves the true association x(P1)=x(P2+P3), whereas D
    breaks that association while retaining the same actual right-half pairs and
    table workload.
  mechanism: >-
    The oracle's potentially useful information is the correlation between the
    left query key x(P1) and the true right-half sum key x(P2+P3), not merely the
    existence of a hash table or a curve-shaped key distribution. Arm D assigns
    independent uniform F_p keys to the right pairs, with replacement, and
    therefore removes that correlation while preserving right-pair objects,
    table cardinality, and the verification path.
  assumptions:
    - >-
      D's key stream is deterministic conditional on the cell seed and is
      independent of the curve, factor-base tuple, and true sum key.
    - >-
      A/B/D use identical curve, factor-base, tuple order, and stopping rules.
    - >-
      The charged cost model reports field operations, hash operations, key
      generation, candidates verified, and memory separately.
  proof_search_map:
    not_applicable_reason: >-
      This is a bounded empirical control hypothesis, not a theorem, asymptotic
      bound, certificate family, reduction, or closure argument.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients: []
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: B_minus_D_group_mean_yield
      direction: higher
      minimum_effect: >-
        Positive group-level difference under the preregistered n=8 grouping,
        with all controls passing; no universal threshold is claimed before
        design review fixes the null tolerance.
    - metric: relation_set_B_equals_A
      direction: different
      minimum_effect: Exact equality on every valid cell.
  test_boundary:
    instances:
      - m=3, p in [101,103,107,211], b in [0.4,0.5], seeds [1,2,3,4,5]
    parameters:
      claim_tier: toy
      null: independent uniform F_p right-table keys sampled with replacement
    implementation: experiments/EXP-XOR-4ded1d/implementation/arm_d_grid.py
    budget:
      maximum_runs: 120
      wall_clock_seconds_per_run: 300
  falsification_conditions:
    - >-
      B and D have indistinguishable group-level relation yield after all
      controls pass, weakening the claimed correlation interpretation.
    - >-
      Arm B fails exact relation-set equality with Arm A, invalidating the cell
      rather than falsifying the hypothesis.
    - >-
      D key occupancy or independence controls fail, invalidating the null.
  interpretation_limits:
    - Toy-scale prime fields only; no crypto-scale or deployed-system claim.
    - No sub-rho, asymptotic, or practical-security conclusion.
    - A positive B-D contrast is evidence about this strategy and null only.
    - Any speed or cost language requires the separately charged cost model.
  status: proposed
  proposed_by: coordinator
