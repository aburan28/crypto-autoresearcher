hypothesis:
  id: H-ENDO-d492e4
  question_id: RQ-ENDO-73c60f
  idea_ids:
  - IDEA-20261014-5a3847
  statement: For complete rank-two Hom bases between supplied CM orders in the same
    imaginary quadratic field, discriminant and content recover conductor products;
    connected non-bipartite product graphs recover positive conductors uniquely, while
    incomplete bases can give false consistency.
  mechanism: Construct the full Hom lattice by exact multiplier containment, compute
    degree norm form and compare Delta/content against planted conductors; transport
    sublattice matrices before inferring products.
  assumptions:
  - Input order/lattice is supplied and certified inside exact arithmetic, not inferred
    from a curve.
  - Frozen executable boundary is principal supplied order lattices C/O_f, not every
    ideal class.
  proof_search_map:
    bottleneck: Independently certify full Hom bases from actual ordinary finite-field
      maps before conductor reconstruction.
    baseline_embedding:
      parameter_slice: Certified complete Hom basis from independent exact containment
        computation
      reproduction_check: Frozen independent exact oracle and regression fixture in
        the bound driver/test source.
    observation_collision:
      observable: Exact discriminant/content identity agreement; Correct graph identifiability/ambiguity
        classification; Detected incomplete-basis false-consistency witnesses
      distinct_preimage_search: Uniformly scaling every full Hom basis by k may reconstruct
        k*fi consistently although actual conductors fi differ; a bipartite product
        graph allows reciprocal vertex scaling.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: Uniformly scaling every full Hom basis by k may reconstruct
        k*fi consistently although actual conductors fi differ; a bipartite product
        graph allows reciprocal vertex scaling.
      predicted_gain: Discriminate necessary assumptions; no performance gain asserted.
    quantifier_order: For every explicitly enumerated supplied order and permitted
      basis in frozen parameters, compute a witness depending on that instance; no
      uniform finite-field map or unknown-order discovery algorithm is asserted.
    method_ceiling:
      strongest_certifiable_claim: Infers planted algebraic order conductors only
        under certified complete bases and same K.
      nearby_object_control: Bipartite graph admits scale ambiguity; odd cycle/triangle
        fixes positive conductor solution
    proof_obligations:
    - claim: Correct exact algebra and independent oracle agree within supplied-order
        scope.
      responsibility: correctness
    - claim: Output distinguishes hypotheses failing assumptions from a mathematical
        counterexample within valid assumptions.
      responsibility: scope
    - claim: Independently certify full Hom bases from actual ordinary finite-field
        maps before conductor reconstruction.
      responsibility: interface
