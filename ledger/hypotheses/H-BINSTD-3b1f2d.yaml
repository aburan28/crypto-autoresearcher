# =============================================================================
# H-BINSTD-3b1f2d -- S_4 one-shot vs chained S_3×S_3 charged-cost band at toys
# (IDEA-20261001-161102). Heuristic validation. Approved DEC-20261003-bc5802.
# Stages 0-1 only. Zero runs in the design packet. No AUXIN. No Bedrock.
# No break / exponent / n>=131 / rho-competitiveness claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-3b1f2d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-161102
  derived_from_idea: IDEA-20261001-161102
  experiment_id: EXP-BINSTD-6f3434
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-bc5802
  status: approved
  proposed_by: coordinator
  title: >-
    On binary toys (n,ℓ)∈{17}×{3,4} with frozen V and shared XOR-SAT pin,
    charged cost C = median_wall / max(success_rate, ε) of one Semaev S_4 PDP
    attempt is ≤ 0.85 × C of two chained S_3 attempts — or S_4-not-cheaper
    is recorded at this scale

  statement: >-
    SETTING. Semaev S_m via resultant recursion (KR-IC-5a43e5) on x-coordinates
    with factor base {P : x(P)∈V}, Weil-restricted to the admitted Boolean /
    XOR-SAT path (KR-IC-5765d2). Two schedules only: (A) one S_4 system per
    target; (B) two sequential S_3 systems with frozen intermediate reinjection
    composing a 4-point relation.

    CLAIM (heuristic_validation / observational). At each Stage-1 cell
    (n,ℓ)∈{17}×{3,4}, on ≥40 matched random targets under the frozen XOR-SAT
    pin, C(S_4) ≤ 0.85 × C(chained-S_3×S_3) with C = median_wall /
    max(success_rate, ε) and ε=1/40 — OR the inequality fails and the cell is
    labeled E-S4-NOT-CHEAPER. Missing encoders / solver pin is O-IMPEDIMENT,
    never negative mathematical evidence.

    TEST BOUNDARY. Stages 0-1 only (n=17). Stage 2 (n∈{19,23} + random-Boolean
    null expand) is NOT authorized here. NO break, exponent, n≥131 transfer,
    or claim that either schedule beats rho (KR-IC-1fcdbc).

    FALSIFICATION OF HEUR-BINSTD-161102-H1 (within boundary). A completed cell
    with both arms nonzero success and C(S_4) > 0.85 × C(chained) while the
    report still claims E-S4-CHEAPER. Editing the 0.85 band after timings voids
    the reading. Budget / missing Stage-0 freeze is O-IMPEDIMENT.

  mechanism: >-
    OBJECT FRAME. Representation: Semaev summation polynomials on x-coordinates
    with frozen F_2-subspace V. Operation set: two relation-source schedules
    (direct S_4 vs chained S_3×S_3) under one XOR-SAT pin. Trichotomy: Class I
    partial-action (relation under FB translation). Lossy-projection: charged
    cost discards which algebraic path produced the relation; null is a
    matched-size random Boolean family whose C(A)/C(B) ratio should not inherit
    Semaev resultant structure (Stage 2, not authorized here). OFF-LIMITS:
    asserting KR-IC-889857; treating 'use S_4' as novelty; engine races that
    fix S_3 only (IDEA-20261001-3f2d06 / 5c936b / c35b2a).

  predictions:
    - metric: charged_cost_ratio_S4_over_chained
      direction: upper_bounded
      minimum_effect: '≤ 0.85 at each Stage-1 (n,ℓ) cell'
    - metric: target_count
      direction: lower_bounded
      minimum_effect: '≥ 40 matched targets per cell'
    - metric: both_arms_nonzero_success
      direction: lower_bounded
      minimum_effect: '≥ 1 success on each arm, else mark E-INCONCLUSIVE'

  test_boundary: >-
    Stages 0-1; n=17; ℓ∈{3,4}; frozen V + XOR-SAT pin; toy Koblitz / admitted
    binary cells only; no deployed curves; no Magma/Sage/AUXIN/Bedrock as the
    success path.

  falsification_criteria: >-
    Claiming practical binary IC from a toy S_4 win (KR-IC-1fcdbc);
    treating 'use S_4' as novelty (KR-IC-5a43e5 forbids);
    transferring the 0.85 band to n≥131 without a new contract;
    editing the 0.85 band after seeing timings;
    treating encoder absence as mathematical falsification.

  distinguishable_outcomes:
    - id: E-S4-CHEAPER
      meaning: >-
        Both arms nonzero success; C(S_4) ≤ 0.85 × C(chained) at every
        completed Stage-1 cell; controls pass.
    - id: E-S4-NOT-CHEAPER
      meaning: >-
        Both arms nonzero success; ratio > 0.85 at a completed cell; controls
        pass; HEUR reading fails at this scale.
    - id: E-INCONCLUSIVE
      meaning: >-
        Controls pass but success_rate=0 on an arm or sample incomplete;
        report, do not invent a ratio.
    - id: O-CONTROL-FAIL
      meaning: >-
        Matched-target / shared-pin / no-posthoc-band controls fail; bake-off
        void as instrument defect.
    - id: O-IMPEDIMENT
      meaning: >-
        Stage-0 freeze missing, S_3/S_4 encoder absent, XOR-SAT pin absent,
        or infrastructure abort; never negative evidence.

  heuristic_assumptions:
    - id: HEUR-BINSTD-161102-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17}×{3,4}: on ≥40 matched random targets under the
        frozen XOR-SAT pin, C(S_4) ≤ 0.85 × C(chained-S_3×S_3) where
        C = median_wall / max(success_rate, ε) with ε=1/40.
      random_model_justification: >-
        Rigorous: KR-IC-5a43e5 gives deg(S_4)=4 vs deg(S_3)=2 per variable,
        so one S_4 system is algebraically larger while two S_3 attempts pay
        a second success-probability factor. Classical: if the extra degree
        dominates, C(S_4) should exceed C(chained); if the second success
        factor dominates, C(S_4) wins. The ≤0.85 band is the pre-registered
        transfer hypothesis under test at toys — not a claim that either
        schedule changes the ECDLP exponent vs rho.
      supporting_results:
        - KR-IC-5a43e5
        - KR-IC-5765d2
      validation_experiment_ids:
        - EXP-BINSTD-6f3434
      falsification_condition: >-
        C(S_4) > 0.85 × C(chained) at a completed cell (E-S4-NOT-CHEAPER),
        OR either schedule's encoder/solver is absent (O-IMPEDIMENT),
        OR success_rate=0 on both arms (E-INCONCLUSIVE; report, do not invent
        a ratio).

  interpretation_limits:
    - Toy schedule cost only; does not beat rho or invent new S_m.
    - Shared XOR-SAT pin; a different solver needs a new idea/contract.
    - Stage 2 (n∈{19,23} + random-Boolean null) not authorized here.
    - No break; no exponent; no n≥131 transfer.

