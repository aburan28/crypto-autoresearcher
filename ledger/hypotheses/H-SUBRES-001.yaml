hypothesis:
  id: H-SUBRES-001
  identifier_renumber_note: >-
    Applies the identifier repair prescribed by CORR-20260728-001 under the
    authority of DEC-20260728-003. The files were renamed when that correction
    was recorded, but the `id` and the structured pointer fields it lists were
    left holding the retired RT1476 ids, so the record did not register and
    every decision targeting it dangled. Only the fields CORR-20260728-001
    names change here. Prose, run_ids, certificate paths and every other
    occurrence of the retired ids are byte-unchanged and are governed by that
    correction's alias_declaration: EXP-RT1476-001, H-RT1476-001 and
    EV-RT1476-001 denote EXP-SUBRES-001, H-SUBRES-001 and EV-SUBRES-001. No
    status, strength, claim tier, proof status or claim boundary is touched.
  question_id: RQ-ECDLP-002
  id_allocation_note: >-
    H-RT1476-001 was verified free across the UNION of both ledger namespaces per the
    binding allocation rule in DEC-20260727-005 rationale item 10: no H-RT* record exists in
    ledger/*.yaml (root) or in ledger/hypotheses/ (typed), and a repository-wide search for
    the strings EXP-RT, H-RT, EV-RT and RQ-RT returns no match anywhere. The gate name
    RT-1476-SUBRES-A1 appears in research prose and in coordination records but has never
    had a ledger hypothesis record; this is the first.

  statement: >-
    In the serial-S3 split of the m = 5 Semaev summation relation with a 2 | 3 arity split
    over a balanced x-line factor base of size L = round(q^(1/5)) on a prime-order curve
    E/F_p with prime group order q, the BACKWARD 3-SUM STATE at the shared Kummer coordinate
    u - equivalently the support of the backward eliminant B_R(u) - has size Theta(q^beta_deg)
    with beta_deg < 3/10, and the membership-query cost restricted to the successful-relation
    subset grows as q^beta_ops with beta_ops < 3/2. Together these would give a
    membership-query exponent alpha < 3/2 for the m = 5 index-calculus step, which is the
    RT-1476-SUBRES-A1 sub-rho gate.

  mechanism: >-
    Semaev's S3 relation lets an m-sum decomposition be evaluated as a chain of 3-variable
    conditions rather than one m+1-variable summation polynomial. Splitting m = 5 as 2 | 3
    at a shared Kummer coordinate u gives a forward leg - the at most L(L+1)/2 values of
    u = x(P1 + P2) reachable from factor-base pairs - and a backward leg - the values of u
    for which R - (P3 + P4 + P5) has that x-coordinate for some factor-base triple. A
    relation exists exactly when the two legs meet at some u AND an explicit sign assignment
    closes the identity in the group. The proposed mechanism is that the backward leg does
    NOT behave like three free choices: that the elimination of w1, w2, x3, x4 and x5 through
    the S3 chain collapses the reachable set far below the naive L^3 = q^{3/5} count, so that
    the meet can be tested by evaluating a low-degree univariate object at each forward value
    rather than by searching a q^{3/5}-sized set. Subresultant PRS is the proposed device for
    obtaining that object without materialising the full eliminant. If the collapse is real,
    a membership query costs about the degree of the backward eliminant, and the total m = 5
    relation-collection exponent drops below the rho exponent; if it is not, the backward
    state is generic and there is no window.

  assumptions:
    - 'ASSUM-1: q is prime and the group is cyclic of order q, so the Kummer/x-line factor base is well defined and every point is a scalar multiple of the base point.'
    - 'ASSUM-2: the curve is ordinary, non-anomalous, and j(E) is not in {0, 1728}, so no CM or automorphism structure supplies a collapse that would not exist on a generic curve.'
    - 'ASSUM-3: balanced sizing L = round(q^(1/5)), which is the sizing at which m = 5 index calculus is conventionally compared against rho.'
    - 'ASSUM-4: the relevant cost is membership queries on the SUCCESSFUL-relation subset, not the aggregate. This assumption is the red team''s and is adopted because abort speedups on the non-relation fraction do not help the relation-producing fraction.'
    - 'ASSUM-5: an x-only Kummer coincidence is not a relation. Signs must be resolved by an explicit group-law check, so every claimed relation carries a certificate.'
  rerandomization: null

  asymptotic_claim:
    problem: 'prime-field ECDLP relation collection at decomposition arity m = 5'
    prior_best: 'Pollard rho at q^{1/2}; m = 5 index calculus with a generic backward state gives membership-query exponent alpha >= 3/2 and no advantage'
    time_exponent: 'alpha < 3/2 for the membership-query stage, CONDITIONAL on beta_deg < 3/10 and beta_ops < 3/2'
    memory_exponent: 'not claimed; this hypothesis makes no memory claim and no time-memory tradeoff claim'
    hidden_cofactor: 'unquantified. No cofactor accounting, no linear-algebra stage cost, no descent cost and no multi-target accounting exists for this mechanism. The exponent above concerns ONE stage in isolation and is not an end-to-end attack complexity.'
    claim_kind: exponent_improvement
    claim_status_note: >-
      NOT CLAIMED AS TRUE. This block records what WOULD follow if the hypothesis held, so
      the ambition is legible and falsifiable. No part of it is asserted, and the promotion
      gates in agents/coordinator.md (proof decomposition, validated heuristics,
      concrete-cost table, independent review) are all UNMET. This hypothesis may not
      transition toward supported on any evidence available in this campaign.

  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For a uniformly random target R on a random ordinary prime-order E/F_p and a
        deterministic x-line factor base V with |V| = L = round(q^(1/5)), the probability
        that R decomposes as a signed sum of five factor-base points tends to 1/5! = 1/120 as
        q grows.
      random_model_justification: >-
        Standard balanced-sizing heuristic: the number of ordered 5-tuples from V is L^5 ~ q,
        each hits a given target with probability about 1/q, and unordered tuples overcount by
        5!. It assumes the sums behave like uniform independent samples of the group.
      supporting_results:
        - 'the balanced index-calculus sizing convention for Semaev decomposition (m-th summation polynomial, factor base of size q^{1/m})'
        - 'stated as the 1/m! constant in inputs/idea_generation_20260727_claude_candidates.yaml, candidate BAR-PATHDYN-CONDTAIL-D2 premise P1'
      validation_experiment_ids: [EXP-RT1476-001]
      falsification_condition: >-
        Measured success_rate in EXP-RT1476-001 differing from L^5/(120 q) by more than an
        order of magnitude, consistently across seeds and sizes.
      status_note: >-
        Premise P1 of BAR-PATHDYN-CONDTAIL-D2, which RT-20260727-001 found DOES_NOT_SURVIVE
        as a barrier. That verdict is about the barrier ARGUMENT, not about this counting
        heuristic; the heuristic is carried here on its own merits and is measured by
        EXP-RT1476-001 as success_rate.
    - id: HEUR-002
      formal_statement: >-
        The backward 3-sum state size at balanced sizing is Theta(q^{beta_deg}) for a
        well-defined constant beta_deg, i.e. it follows a power law in q rather than a law
        with a slowly varying correction.
      random_model_justification: >-
        Assumed, not justified. A generic count gives Theta(min(L^3, q)) = Theta(q^{3/5}); the
        hypothesis asserts a different constant. That a single exponent exists at all is the
        weakest link in the whole construction.
      supporting_results: []
      validation_experiment_ids: [EXP-RT1476-001]
      falsification_condition: >-
        Pairwise slopes of log(support size) versus log(q) that disagree materially with each
        other or trend with q, indicating no single exponent describes the data.
      honesty_note: >-
        EXP-RT1476-001 CANNOT VALIDATE THIS HEURISTIC. Three points spanning a factor of 2.4
        in log q cannot establish that a power law holds; they can only show gross
        inconsistency with one. The heuristic is therefore recorded as UNVALIDATED and caps
        this hypothesis below supported on its own, independent of any measured value.

  structural_ingredients:
    - description: 'Semaev summation polynomials S_m; S_3 as the composition primitive for serial decomposition chains'
      citation: 'Semaev, "Summation polynomials and the discrete logarithm problem on elliptic curves" (2004); in-corpus abstract KN-TECH-002'
      role: 'defines the algebraic relation whose eliminant degree is measured'
    - description: 'Subresultant polynomial remainder sequences as a means of computing resultants and gcd-degree information without materialising intermediate coefficient growth'
      citation: 'Collins (1967), Brown-Traub (1971) subresultant PRS and its coefficient-growth bounds'
      role: >-
        the proposed measurement device for the eliminant degree. Its coefficient-growth
        content is inert over GF(p) and is recorded as such in EXP-RT1476-001 DEV-1.
    - description: 'Index-calculus decomposition over an x-line factor base with balanced sizing q^{1/m}'
      citation: 'Gaudry, "Index calculus for abelian varieties of small dimension and the elliptic curve discrete logarithm problem" (2009); Diem (2011)'
      role: 'supplies the sizing convention and the comparison point against which alpha < 3/2 is defined'

  reduction_chain:
    core_problem: 'membership testing for the m = 5 serial-S3 decomposition of a target point over a balanced x-line factor base'
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Even a favourable measurement yields no corollary: relation
      collection is one stage, and no linear-algebra, descent, multi-target or verification
      accounting exists for this mechanism. Listing a downstream consequence here would
      assert a reduction that has not been written.

  predictions:
    - metric: backward_state_support_size
      direction: lower
      minimum_effect: 'fitted beta_deg < 0.3, against a generic expectation of 0.6 - a factor-q^{0.3} collapse'
    - metric: deg_u_backward_eliminant
      direction: lower
      minimum_effect: 'grows no faster than the support size, with fitted exponent below 0.3'
    - metric: ops_success
      direction: lower
      minimum_effect: 'fitted beta_ops < 1.5 on the certified-success subset only, with flat or decreasing pairwise slopes'
    - metric: 'pairwise slope trend of beta_deg with q'
      direction: different
      minimum_effect: 'flat or decreasing; an increasing trend falsifies'

  test_boundary:
    instances: 'randomly sampled ordinary prime-order short-Weierstrass curves over F_p with j(E) not in {0,1728} and n != p'
    parameters:
      p: [1009, 65521, 16769023]
      max_field_bits: 24
      seeds: [20260728, 20260729, 20260730]
      m: 5
      split: '2 | 3 serial-S3 at a shared Kummer coordinate'
      factor_base: 'x-line, L = round(q^(1/5)), approximately 4, 9 and 28 elements'
      targets_screened_per_cell: 1200
    implementation: 'Python 3 with sympy and numpy over GF(p) on the in-repo harness/; Sage is NOT available in this environment'
    budget:
      wall_clock_seconds: 7200
      maximum_memory_gb: 4
      maximum_runs: 27
    boundary_statement: >-
      Every claim licensed by this hypothesis is bounded by exactly these instances,
      parameters, solver and budget. The largest field is 24 bits. Nothing here can be
      evidence about cryptographic-size curves.

  falsification_conditions:
    - 'F1: fitted beta_deg >= 0.3 at any of the three tested sizes, with the positive control having passed its meter gate.'
    - 'F2: the pairwise slopes of beta_deg increase with q.'
    - 'F3: fitted beta_ops >= 1.5 on the certified-success subset at any tested size.'
    - 'F4: the measured backward-state size agrees with the generic Theta(L^3) = Theta(q^{3/5}) count across all three sizes, i.e. no collapse is present at all.'
    - >-
      F5 IS A NON-FALSIFIER, RECORDED SO IT IS NOT MISTAKEN FOR ONE: timeouts, crashes,
      memory exhaustion, an unimplementable protocol step, or an eliminant computation that
      does not terminate are INFRASTRUCTURE SIGNALS under AGENTS.md rule 5 and are never
      evidence against this hypothesis.
    - >-
      F6 IS ALSO A NON-FALSIFIER: a result on the AGGREGATE query set rather than on the
      certified-success subset does not falsify, because the aggregate is where abort
      speedups live and the hypothesis is explicitly about the success subset (ASSUM-4).

  falsification_scope: >-
    Any of F1 through F4 falsifies this hypothesis ON THE TESTED SCOPE ONLY - these
    sampled curves, these three moduli, this factor-base geometry and sizing, this split
    at m = 5, this implementation and this budget. It closes nothing about other arities,
    other splits, other geometries, larger fields, or prime-field ECDLP generally, and it
    supports no universal impossibility claim.
  falsification_scope_placement_note: >-
    This key is a SIBLING of falsification_conditions:, not a seventh condition. It scopes
    all of F1 through F6 at once, so it cannot be one of them. It was written at the
    sequence-item indent level in the first draft, which terminated the
    falsification_conditions block sequence illegally and made this record unparseable; the
    dispatching session caught it with a real parser before any commit. The repair is
    indentation only. No falsification condition was added, removed or reworded.

  interpretation_limits:
    - 'This hypothesis concerns ONE stage of one index-calculus variant. It is not an attack and no end-to-end attack cost follows from it at any outcome.'
    - 'Maximum claim tier reachable by EXP-RT1476-001 is toy (24-bit maximum field). No medium- or crypto-scale statement is available at any outcome.'
    - 'Maximum evidence strength from a single execution of EXP-RT1476-001 is preliminary. This hypothesis may not reach supported on that evidence, and reject_scoped on a single unreplicated empirical-only run set is forbidden - an adverse result takes weakened plus replication.'
    - 'HEUR-002 is unvalidated and unvalidatable by EXP-RT1476-001, which independently caps this hypothesis below supported.'
    - 'The prior is ADVERSE. The red-team note at inputs/idea_generation_20260718_batch2.md lines 1388-1397 predicts beta_ops -> 3/2 from above, and the generic count predicts beta_deg = 0.6, twice the gate. This hypothesis is expected to fail, and it is being measured because the expectation has never been tested, not because it is likely to hold.'
    - 'That BAR-PATHDYN-CONDTAIL-D2 did not survive adversarial review (RT-20260727-001) is NOT support for this hypothesis. A broken barrier leaves the gate open; it does not open it.'
    - 'The asymptotic_claim block is a statement of what would follow, not a claim. All four coordinator promotion gates are unmet.'

  status: weakened
  status_basis: >-
    specified, and not proposed, because a complete frozen test exists on paper -
    experiments/EXP-RT1476-001/specification.yaml version 1, approved by DEC-20260728-002 -
    with controls, metrics, budgets, stopping rules, invalidation rules and both criteria
