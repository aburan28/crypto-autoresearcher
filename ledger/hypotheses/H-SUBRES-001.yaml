    about the mechanism. It moves to approved/running only when execution is dispatched
    under TASK-20260728-001, and any status right of running requires the run set to pass
    validity review first.
  proposed_by: idea-generator
  proposed_by_note: >-
    The mechanism and the experiment contract originate with the idea-generation corpus, not
