hypothesis:
  id: H-ALMIG-001
  question_id: RQ-ALMIG-001
  statement: >-
    The Autolab tasks, research, experiments, output, and root research ledger
    can be mirrored into inputs/refs with no missing or hash-mismatched selected
    files, while excluding only declared filesystem/cache artifacts.
  mechanism: >-
    Deterministic path enumeration, atomic copy, source/destination SHA-256
    comparison, and tree-level hashing produce a checkable migration receipt.
  assumptions:
    - /Volumes/SSD990/autolab is the source folder requested by the user.
    - AppleDouble metadata, Python bytecode caches, Git internals, and runtime checkpoints are not task or result records.
    - File bytes and relative paths are the migration identity boundary.
  predictions:
    - metric: mismatch_count
      direction: lower
      minimum_effect: exactly zero after copy
    - metric: task_packages_cataloged
      direction: different
      minimum_effect: every top-level Autolab tasks directory is represented
  test_boundary:
    instances: [tasks, research, experiments, output, research_ledger.md]
    parameters:
      destination: inputs/refs
      exclusions: [AppleDouble, DS_Store, Python bytecode caches, Git internals, agent checkpoints]
    implementation: tools/migrate_autolab_archive.py
    budget:
      maximum_runs: 2
      maximum_memory_gb: 4
  falsification_conditions:
    - Any selected source file is absent from the destination.
    - Any selected source/destination SHA-256 pair differs.
    - The recorded task count differs from the source top-level task count.
  interpretation_limits:
    - Passing supports archive integrity only, not correctness of historical experiments.
    - Historical time, model, control, and certificate gaps remain unchanged.
    - Raw mirrored inputs are not official claim evidence until archived and reviewed under the current harness.
  status: approved
  proposed_by: coordinator
