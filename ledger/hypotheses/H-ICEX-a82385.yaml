        The multi-target preprocessing floor supplying the reference line
        sqrt(T*N), against which a measured gamma near 1/2 is a saturation
        confirmation and never a novelty.
      citation: KN-LIT-013
      provenance: internal
      verified_by: null
      role: rigorous lower reference for the exponent in T
    - description: >-
