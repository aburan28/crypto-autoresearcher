hypothesis:
  id: H-ICEX-a82385
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260731-013
  title: >-
    THE MULTI-TARGET SHARING GAIN IS A BIRTHDAY EFFECT IN A RANDOM FUNCTION ON N
    STATES, NOT ECDLP STRUCTURE- a shared distinguished-point table solving T
    targets in c * sqrt(T*N) group operations has an exponent gamma in T that a
    curve-free random-function walk on the same state space with the same DP rule
    reproduces to within fit error, and the ledger baseline entry that currently
    reads UNVERIFIED is replaced by a measured gamma with a stated replication
    count chosen so that the pre-registered band can actually be crossed
  statement: >-
    (A) THE OBJECT. Let G be a prime-order subgroup of order N of E/F_p and let
    Q_1..Q_T be uniform independent targets. Construction (A) is T independent
    Pollard-rho walks with negation canonicalisation. Construction (B) is ONE
    pseudorandom walk against a single shared distinguished-point table, whose
    every step is tested against all T target tags. The measured quantity is the
    TOTAL charged cost in GROUP-OPERATION EQUIVALENTS to resolve all T targets,
    fitted as total = c * N^{1/2} * T^{gamma}.
    (B) THE PRE-REGISTERED CLAIM. Construction (B) fits gamma in [0.45, 0.60]
    with c = total / sqrt(T*N) in [0.5, 2.0], while construction (A) fits
    gamma near 1.0 on the identical instances and seeds.
    (C) THE STRUCTURAL HALF, WHICH IS THE POINT OF THE RECORD. A CURVE-FREE NULL
    - a random function on an N-element state set with the identical DP rule and
    identical tag semantics, containing no group law, no curve equation and no
    point arithmetic - reproduces gamma to within |gamma_EC - gamma_null| <= 0.05.
    IF IT DOES, AS PREDICTED, THE sqrt(T*N) SHARING GAIN IS A STATEMENT ABOUT
    BIRTHDAY COLLISIONS IN A RANDOM FUNCTION ON N STATES AND MAY NOT BE QUOTED AS
    A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP. A gap above 0.15, reproduced
    across seeds, is a non-generic multi-target signal and requires independent
    review before any interpretation.
    (D) THE MEMORY AXIS, DERIVED RATHER THAN GUESSED. The source proposal
    predicts a memory reduction factor of at least 2 at T = 64. THE DERIVED VALUE
    IS sqrt(T), NOT 2- T independent DP-table rho runs each store about
    theta*sqrt(N) distinguished points, total T*theta*sqrt(N); the shared table
    stores about theta*sqrt(T*N); the ratio is exactly sqrt(T), which is 8 at
    T = 64. This hypothesis pre-registers sqrt(T) with a factor-2 tolerance in
    both directions, which is falsifiable, rather than a floor of 2, which the
    derived value overshoots by 4x and which therefore cannot discriminate.
    (E) WHAT THIS DOES NOT DO. It moves no exponent, proposes no attack, and does
    not decide RQ-ECDLP-002. It converts one ledger baseline entry from
    UNVERIFIED into a measured value with an interval, at toy scale, and supplies
    the matched reference line that every multi-target amortisation comparison in
    this ledger currently lacks.
  mechanism: >-
    THE TRACKED OBJECT AND ITS PROJECTION. The object is the walk's point stream
    projected onto the pair (number of charged group operations consumed, set of
    targets resolved). Everything about the arithmetic - the field
    representation, the curve equation, the negation map - is discarded, and two
    integers per cell are retained. The projection is lossy compatibly with the
    only operation the pipeline performs, namely appending a step and testing it,
    because both retained quantities compose additively under that operation.
    WHY THE GAIN IS EXPECTED TO BE GENERIC. A single walk emits a point stream;
    each emitted point is a birthday trial against T tagged orbits simultaneously,
    so the first resolution arrives after about sqrt(N/T) steps and the T-th after
    about sqrt(T*N) in total by the coupon-collector tail. Nothing in that
    argument reads the group law- it needs only that the step function behave like
    a random function on the state set. That is exactly why the curve-free arm is
    mandatory and why a matching null is the PREDICTED outcome rather than a
    disappointment.
    WHERE THE GAIN COULD DEGRADE, WHICH IS THE MEASURABLE UNCERTAINTY. The
    per-step tag test costs T group additions and is charged; at large T that term
    can dominate the walk itself and bias gamma upward toward 1. DP-table
    contention and resolution order (the first target is cheap, the last
    expensive) shape the total. Whether a shared-table implementation attains the
    floor or degrades toward gamma = 1 through those two terms is the open
    quantity and is what the contract measures.
    THE RIGOROUS FLOOR THAT MAKES A CONFIRMATION A SATURATION AND NEVER A
    NOVELTY. KN-LIT-013 gives S*T^2 = Omega~(eps*N) for preprocessing attacks, so
    in the small-advice regime the total work to solve T targets is
    Omega~(sqrt(T*N)). A measured gamma near 1/2 therefore confirms saturation of
    a known floor. This record claims no novelty for the construction, which is
    classical folklore.
  assumptions:
    - >-
      All T targets are uniform independent elements of the same prime-order
      subgroup G, drawn with a fresh scalar pair per target and never reused.
    - >-
      The DP rule (probability theta of being distinguished), the step function
      and the tag test are FROZEN BEFORE EXECUTION and applied identically to the
      elliptic-curve walk, the independent-runs control and the curve-free null.
    - >-
      COST UNIT. One charged operation is one GROUP OPERATION. A tag test costs
      one group addition per target per step and is charged. Memory is counted in
      STORED TABLE ENTRIES and separately in BITS with the entry width declared.
      TIME IS NEVER DIVIDED BY MEMORY AND MEMORY IS NEVER ADDED TO TIME- the
      memory ratio compares stored bits against stored bits.
    - >-
      The tested envelope is N in {2^16, 2^20, 2^24} and T in
      {1,2,4,8,16,32,64,128,256,512}. Any statement outside it is a model
      statement and is labelled as one.
    - >-
      The curve-free null walk has no negation map, so its constant differs from
      the elliptic arm BY CONSTRUCTION. The comparable quantity is therefore the
      EXPONENT gamma and never the constant c, and the gap metric is defined on
      gamma alone.
  proof_search_map:
    not_applicable_reason: >-
      This is a purely empirical baseline calibration. No theorem, bound,
      certificate family, reduction or closure argument is proposed- the rigorous
      floor it checks saturation against (KN-LIT-013) is already published and is
      cited rather than re-proved. The four audits of docs/inventor-protocol.md
      section 8 would be ceremonial here and the reason is recorded rather than
      the map omitted.
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-MTRHO-1
      formal_statement: >-
        FOR ALL prime-order N in the tested envelope and FOR ALL T in the tested
        envelope, the batch shared-distinguished-point-table construction resolves
        all T targets in c * sqrt(T*N) * (1 + o(1)) charged group operations with
        0.5 <= c <= 2.0, so the per-target cost decays as sqrt(N/T) and the
        constants (negation canonicalisation, the DP probability theta) shift c
        but not the exponent gamma in T.
      random_model_justification: >-
        The LOWER side is rigorous- KN-LIT-013 gives S*T^2 = Omega~(eps*N), which
        at advice S = N^{o(1)} forces total work Omega~(sqrt(T*N)). The UPPER side
        is the classical birthday-and-occupancy model for one point stream against
        T tagged orbits, the same random-model imitation that underlies the
        standard analysis of parallel rho with distinguished points. What is
        heuristic is ONLY that a shared-table implementation attains the floor
        without the per-step tag-test term and DP-table contention degrading gamma.
      supporting_results:
        - ref: KN-LIT-013
          provenance: internal
          claim: >-
            The preprocessing tradeoff S*T^2 = Omega~(eps*N), used here solely as
            the rigorous floor against which a measured gamma near 1/2 is read as
            saturation rather than as a gain. THIS AGENT DID NOT OPEN
            knowledge/literature/KN-LIT-013.md- the statement is taken from
            IDEA-20260731-013 and its matched_baseline block, which this agent
            read in full. RELAYED, NOT VERIFIED AT SOURCE.
          verified_by: null
        - ref: KN-TECH-001
          provenance: internal
          claim: >-
            Pollard rho at about 0.886*sqrt(N) group operations with O(1) memory,
            used as the single-target calibration anchor. RELAYED from
            IDEA-20260731-013 matched_baseline; the technique note itself was NOT
            opened by this agent.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-367f10
      falsification_condition: >-
        A fitted gamma at or above 0.85 for construction (B) at every tested N,
        with all T targets successfully resolved and the tag-test cost share
        reported below 50 percent of the total. That refutes the sqrt(T*N) claim
        at tested scope and forces every multi-target baseline in this ledger back
        onto T * 0.886 * sqrt(N).
    - id: HEUR-MTRHO-2
      formal_statement: >-
        The fitted gamma is invariant under a 4x change in the distinguished-point
        probability theta at fixed N and T, so theta is a parameter of the
        construction and not a confounder of the exponent.
      random_model_justification: >-
        Under the random-function model the DP rule thins the emitted stream
        uniformly and changes the expected walk length between stored points, i.e.
        the constant, without changing the birthday exponent. This is the standard
        justification and it is exactly what the sweep tests.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ICEX-367f10
      falsification_condition: >-
        A gamma that moves by more than the pre-registered band 0.05 under the 4x
        theta sweep at N = 2^20. Then theta is a confounder, the exponent is not a
        property of the construction, and every gamma reported here is withdrawn.
  structural_ingredients:
