      role: the record whose baseline entry is converted from UNVERIFIED to measured
  reduction_chain:
    core_problem: >-
      The exponent in T of total charged work for the generic multi-target
      shared-table construction, at toy scale, with a curve-free null.
    corollaries:
      - problem: >-
          The matched multi-target rho reference line used by every multi-target
          amortisation comparison in this ledger.
        reduction_ref: >-
          Internal- the reference line is this ledger's own accounting convention.
          No published reduction is cited.
        asymptotics_preserved: >-
          Not applicable. No attack and no asymptotic improvement is claimed in
          either direction.
  predictions:
    - metric: >-
        P1- fitted gamma for construction (B) in total = c * N^{1/2} * T^{gamma},
        per N, from cell-mean totals over the declared replication count
      direction: different
      minimum_effect: >-
        IN [0.45, 0.60] with R-squared at least 0.95 at at least 2 of the 3 tested
        N, against a fitted gamma near 1.0 for construction (A) on the identical
        instances and seeds. A fitted gamma at or above 0.85 for (B), with all
        targets resolved, FALSIFIES the sqrt(T*N) claim at tested scope.
    - metric: >-
        P2- the constant c(T,N) = total / sqrt(T*N), dimensionless, per cell
      direction: different
      minimum_effect: >-
        IN [0.5, 2.0] at every tested cell with no monotone trend in T or in N
        beyond the reported fit interval. A value outside the interval WITH a
        monotone trend means the model is wrong in a stated direction and must be
        re-derived before any baseline use.
    - metric: >-
        P3- the curve-free gap |gamma_EC - gamma_null|, dimensionless, per N
      direction: lower
      minimum_effect: >-
        AT OR BELOW 0.05. THE BAND IS SIZED, NOT GUESSED- see the contract stage 0
        power computation. A gap above 0.15 reproduced across seeds is a
        non-generic multi-target signal, is reportable and review-required, and is
        never discardable.
    - metric: >-
        P4- memory ratio (total stored bits, T independent DP-table rho runs) /
        (total stored bits, one shared table), at matched theta and matched N
      direction: higher
      minimum_effect: >-
        DERIVED VALUE sqrt(T), with a factor-2 tolerance in each direction- the
        measured ratio must lie in [0.5*sqrt(T), 2*sqrt(T)], which at T = 64 is
        [4, 16] around the derived 8. A ratio outside that band in EITHER
        direction is a finding about the storage model. Both sides of this ratio
        are counted in the SAME unit (stored bits); no time quantity appears in it.
    - metric: >-
        P5- share of total charged cost attributable to the per-step tag test,
        dimensionless fraction, per cell
      direction: different
      minimum_effect: >-
        REPORTED AT EVERY CELL, on both the elliptic arm and the curve-free arm.
        If the share exceeds 0.5 at the largest T, the fitted gamma is dominated
        by the tag test rather than by the walk and that cell is excluded from the
        fit BY A RULE DECLARED HERE, before any cell runs.
    - metric: >-
        P6- planted-defect control- number of unresolved targets when exactly one
        target tag is corrupted to a wrong multiple
      direction: different
      minimum_effect: >-
        EXACTLY 1 UNRESOLVED, T-1 RESOLVED, at every cell where the control is
        run. A harness that resolves the corrupted target, or that fails to
        resolve any of the other T-1, cannot be trusted with resolution
        accounting and NO exponent it reports is admissible.
    - metric: >-
        P7- negation-calibration control- ratio of mean single-target rho cost
        without negation to mean cost with negation
      direction: higher
      minimum_effect: >-
        1.128, the ratio 1.0/0.886, resolved to within 0.05. Resolving a 12.8
        percent difference at 3 sigma with a per-instance relative spread of about
        1.0 needs at least 550 instances, and the contract declares that count
        rather than discovering it. A harness that cannot resolve a known constant
        cannot certify an unknown exponent.
  test_boundary:
    instances:
      - >-
        Toy prime-order subgroups at N in {2^16, 2^20, 2^24} on generated
        prime-field short-Weierstrass curves.
      - >-
        CURVE-FREE ARM- a random function on an N-element state set, realised by
        a keyed hash of the state, with the identical DP rule and identical tag
        semantics and NO group law anywhere in the code path.
      - >-
        Independent-runs control (construction A) on identical instances and seeds.
    parameters:
      N: '2^16, 2^20, 2^24'
      T: '1, 2, 4, 8, 16, 32, 64, 128, 256, 512'
      theta: 'frozen before execution; swept by 4x at N = 2^20 only'
      replication: 'set by the stage 0 power computation; not below 20 per cell'
      cost_unit: 'group-operation equivalents; memory in stored entries and in bits'
    implementation: >-
      A single walk engine parameterised by (step function, DP rule, tag test)
      with ONE shared operation counter and ONE shared storage counter, so the
      elliptic arm, the independent-runs arm and the curve-free arm differ only in
      the step function and the presence of the group law. An arm with its own
      counter is not comparable and is not built.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 12.0
      maximum_memory_gb: 8
      maximum_runs: 40
  falsification_conditions:
    - >-
      F1. Construction (B) fits gamma at or above 0.85 at every tested N with all
      T targets resolved and the tag-test share below 0.5. TOY-TIER FALSIFIER of
      the sqrt(T*N) sharing claim; the ledger multi-target baselines must revert
      to T * 0.886 * sqrt(N) and every comparison resting on the sharing gain must
      be re-read.
    - >-
      F2. c(T,N) falls outside [0.5, 2.0] WITH a monotone trend in T or N. The
      model is wrong in a stated direction; report and re-derive before use.
    - >-
      F3. |gamma_EC - gamma_null| exceeds 0.15, reproduced across seeds. This
      falsifies the GENERIC-MODEL NULL, not the measurement. It is a non-generic
      multi-target signal, is reportable, requires independent review per
      AGENTS.md rule 12 before any promotion, and may not be discarded.
    - >-
      F4. The planted-defect control resolves the corrupted target, or the
      negation calibration misses 1.128 outside 0.05 at the declared instance
      count. INSTRUMENT FAILURE- the run is INVALID rather than negative and no
      exponent is admissible.
    - >-
      F5. Gamma moves by more than 0.05 under the 4x theta sweep. Theta is a
      confounder rather than a parameter; every gamma is withdrawn.
    - >-
      F6. Failure to resolve all T targets within the declared budget on either
      construction. INFRASTRUCTURE-INCONCLUSIVE under AGENTS.md rule 5, never
      evidence against the sqrt(T*N) claim.
    - >-
      F7. Everything holds and the curve-free gap is within 0.05. Then the
      baseline entry is measured, the sharing gain is a birthday phenomenon in a
      random function on N states, and NOTHING IN THIS RECORD MAY BE QUOTED AS A
      STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP.
  interpretation_limits:
    - >-
      A confirmed gamma near 1/2 is a BASELINE CALIBRATION at toy scale. It is not
      an attack improvement, it moves no single-target exponent, and under
      KN-LIT-013 it is a saturation of a known floor rather than a discovery.
    - >-
      TOY ENVELOPE ONLY- N at most 2^24 and T at most 512. Crypto-scale constants,
      cache and memory-subsystem effects, and the behaviour of a real
      distinguished-point store at 2^60 entries are OUT OF SCOPE, are NOT
      REACHABLE at any budget this program can spend, and are not extrapolated.
      This limit is stated rather than the claim being silently shrunk- the
      hypothesis is about the exponent in T at toy N, and that is all it is about.
    - >-
      IF THE CURVE-FREE ARM MATCHES, AS PREDICTED, NOTHING HERE IS A STATEMENT
      ABOUT ELLIPTIC CURVES. The consequence is pre-stated so it cannot be
      renegotiated after the data.
    - >-
      Parallelisation is a PROCESSOR axis (van Oorschot-Wiener wall time
      sqrt(N)/M at unchanged total work) and is deliberately out of scope. Nothing
      here bears on it in either direction.
    - >-
      The memory ratio is a comparison against T independent DP-TABLE rho runs.
      Construction (A) as defined needs no table at all, so the memory comparator
      is a THIRD object declared here explicitly, and a memory row quoted without
      naming which comparator it used is inadmissible.
