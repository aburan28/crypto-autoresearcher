hypothesis:
  id: H-MONO-59f6a6
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  goal_status_note: >-
    GOAL-MONO-001 is `paused` (campaign budget exhausted: maximum_batches: 3,
    BATCH-003 was the third) as of its 2026-08-10 checkpoint. Its recorded
    `next_action` names a different live route (the T-line/direction-swap
    census of DEC-20260810-2f86db D-4/D-5) and rejects, at every m, the
    generic-fibre cycle-type census AS A RELATION-RATE PROBE. THIS RECORD
    MAKES NO RELATION-RATE CLAIM: it is a pure instrument/protocol hypothesis
    about what a fixed-F_p Frobenius census can and cannot certify about
    GEOMETRIC monodromy, tested on a frozen six-object battery at toy scale.
    It is the third and structurally different record in this session's
    RQ-MONO-001 work, sibling to H-MONO-0b3def (status: supported, decided
    the m=3 symmetric-base cover's GROUP) and H-MONO-0f9170 (status:
    supported, decided the exact (p,t,Z)-arithmetic of that cover's stratum
    counts). Neither sibling record's status is touched by this one; this
    record instead asks whether the CENSUS METHOD those two records used and
    corroborated by is even capable, in general, of distinguishing arithmetic
    from geometric monodromy -- and if H-MONO-0b3def's own D_4 result were to
    fail this record's N1 check (a genuine drop across the ladder), that
    would be the single most consequential possible outcome of this record,
    stated as such below and not softened. Creating this hypothesis/
    experiment pair does not reopen, resume, or reprioritize GOAL-MONO-001;
    execution of the paired experiment requires a Coordinator batch
    assignment and a fresh budget grant from GOAL-PATH-001, OR approval
    through the standalone experiment lifecycle exactly as GOAL-MONO-001
    `paused` did not block EXP-MONO-4c7479 or EXP-MONO-2a13d7 (see those
    contracts' own `coordinator_approval_rationale`; the same reasoning
    applies here and is not repeated in full).
  source_proposal: IDEA-20260830-8a767e
  status: proposed
  proposed_by: idea-generator

  conversion_note: >-
    This record is a schema conversion of an already-complete, already-worked
    proposal. All mathematical content (the exact-sequence obligation O1-O5,
    the five-step protocol, the six-object battery with its FORCED expected
    outputs, the three numbered heuristics HEUR-AG-1/2/3, the predictions and
    falsification conditions) is the idea-generator's, carried over from
    IDEA-20260830-8a767e with no new claim introduced and no step re-derived.
    The Coordinator's own judgment is confined to: the explicit test-boundary
    scoping below (a single fixed prime p=211, chosen for consistency with
    the two sibling contracts and because it independently satisfies every
    constraint the battery needs -- odd, does not divide any tested cover
    degree, and p = 1 mod 3 for N4); concrete pinned parameters for every
    battery member (curve reuse for N1, explicit a(e)/c/b for N2/N2-twin, a
    verified non-cube c for N4, and a considered, disclosed SCOPING-DOWN of
    N5 from a literal degree-100 permutation representation to a degree-5
    generic-quintic construction of comparable order, justified in
    `test_boundary` and carried through unchanged into the paired experiment
    contract EXP-MONO-a20e48); the mapping of the idea's `minimal_test`
    staging into this repo's hypothesis/experiment schema; and the decision,
    recorded in the paired experiment contract, that -- unlike the two
    sibling contracts -- the idea's OWN cost estimate already scopes the FULL
    four-stage protocol on all six battery members at all four k-values as
    affordable, so no stage or k-value is trimmed for cost reasons alone (only
    N5's literal construction is trimmed, for a feasibility reason stated
    explicitly, not a cost reason). No hypothesis or experiment status beyond
    `proposed` / `review_required` is authorized by this record (AGENTS.md
    rule 1).

  statement: >-
    TEST BOUNDARY, STATED FIRST. This is a TOOLING/PROTOCOL hypothesis, not a
    hypothesis about any specific curve family's monodromy: it claims that a
    five-step base-change-ladder protocol can distinguish arithmetic from
    geometric monodromy where a fixed-F_p census cannot, and it is tested
    against a FROZEN, six-object battery at a single prime p=211, degrees at
    most 5 (after the N5 scoping-down described below), never at any other
    prime or on any object outside the battery. It makes no claim about any
    curve family, m-value, or relation rate beyond what the battery's six
    forced outputs already assert; in particular it neither strengthens nor
    weakens H-MONO-0b3def or H-MONO-0f9170 except through the single, sharply
    scoped route named in falsification_conditions (a genuine drop on N1).

    THE OBLIGATION (O1-O5 of IDEA-20260830-8a767e, restated). For a cover
    X -> B over F_p there is an exact sequence
      1 -> G_geom -> G_arith -> Gal(F_{p^d}/F_p) -> 1.
    A Frobenius census over a fixed F_p sees only G_arith (a LOWER bound on
    it, nothing more, and nothing about G_geom, since the two can differ by
    any cyclic quotient -- a constant-field extension). No committed record in
    this lane has previously supplied an arithmetic-equals-geometric
    certificate as an EXECUTABLE, GENERAL-PURPOSE instrument (H-MONO-0b3def's
    STEP 4 does this BY ARGUMENT for its own cover only, and is exempted from
    this record's criticism by name). The obligation is executable: over
    F_{p^k}, the arithmetic monodromy is generated by G_geom and Frob^k; as k
    runs over 1,2,3,4 the realized group R_k is non-increasing on multiples
    of the constant-field degree d and equals G_geom exactly once d | k. A
    census certifies fullness only when BOTH a realized-classes lower bound
    and an independent structural containment meet (O5) -- realizing many
    classes is not, by itself, a certificate, and the battery's N5 member
    exists specifically to test that the protocol refuses to overclaim when
    that independent containment is unavailable.

    THE PROTOCOL UNDER TEST (mechanism, below, restates this in five steps).
    Report DECIDED only when the inertia-derived lower bound L, the
    ladder-stabilised realized value R_stab, and the structural upper bound U
    coincide -- OR when R_stab already equals U outright (realizing the full
    structural ceiling is self-certifying even without an independently
    derived L, per O5's own logic: nothing can be realized beyond U, so
    reaching U leaves no room to be smaller). Otherwise report UNDECIDED with
    both bounds. Never report a group name from a k=1 census alone.

    THE SIX-OBJECT BATTERY, WITH FROZEN FORCED OUTPUTS (emitted here, before
    any code runs -- the ordering itself is an invalidation rule, mirrored in
    the paired experiment contract). All at p=211 unless noted:
      N1 -- the m=3 Semaev symmetric-base cover of EXP-MONO-4c7479, curve
           (A,B)=(1,1): FORCED R_k = 8 (D_4) at EVERY k=1..4, no drop. Already
           argued to have d=1 by H-MONO-0b3def's own STEP 4; a drop here
           would be the single most consequential possible outcome of this
           record (see `falsification_conditions`).
      N2 = h_sep(Y) = (Y^2-e)(Y^2-2e), e the base variable, c=2 the fixed
           constant (verified non-square mod 211: (2/211) = -1 since
           211 = 3 mod 8): FORCED R_1=4, R_2=2, R_3=4, R_4=2 (period-2 in k,
           since the constant-field degree here is d=2: sqrt(2) in F_{p^2}
           but not in F_p or F_{p^3}, back in F_{p^4}). R_1=4 -> R_2=2 is the
           CENTRAL FORCED CONTRAST this whole record exists to produce: the
           geometric group is provably Z/2 (order 2) while the arithmetic
           group over F_p is (Z/2)^2 (order 4).
      N2-twin = (Y^2-e)(Y^2-(e+1)), the TRUE-(Z/2)^2 CONTROL (independent
           non-associate squarefree a(e)=e, b(e)=e+1, no shared constant
           factor): FORCED R_k=4 at EVERY k=1..4, no drop. Same k=1
           observation as N2 (both report 4), opposite ladder behaviour --
           this pair IS the discrimination the record exists to test.
      N3 -- a uniformly random monic quartic over F_p, resampled at each
           k=1..4 with coefficients drawn from F_{p^k}: FORCED cycle-type
           densities matching S_4 Chebotarev law (1/24, 1/4, 1/8, 1/3, 1/4)
           at every tested k (the idea's own predictions force this at
           k=1,2; extending unchanged to k=3,4 is a disclosed, low-risk
           Coordinator addition for ladder uniformity, not a new claim). N3 is
           an INSTRUMENT-CORRECTNESS control: Step 5's verdict machinery is
           deliberately NOT applied to it (there is no fixed labelled fibre
           across independent draws for a generated-subgroup computation to
           act on), matching the idea's own predictions list, which never
           asks for a verdict on N3.
      N4 = Y^3-2 over F_p, p=211=1 mod 3 (verified), c=2 verified a non-cube
           mod 211 (2^70 mod 211 = 196, not 1): FORCED R_1=3, R_2=3, R_3=1,
           R_4=3 (period-3 in k: G_arith=Z/3 is already exactly known by
           p=1mod3 plus c non-cube, with NO census needed at all; G_geom=1
           because this is a single-point base with no moving parameter --
           the entire R_1=3 arithmetic group is a pure constant-field
           artifact of d=3). The extreme case: geometric group trivial,
           arithmetic group nontrivial.
      N5 -- SCOPED DOWN from the idea's literal "degree-100, ~100 realized
           classes each of density ~1/100" object (see `test_boundary` for
           the full feasibility argument) to a uniformly random monic
           QUINTIC over F_p, resampled at k=1..4: structural upper bound
           U = S_5 (order 120, trivially the degree bound of any quintic's
           splitting field), inertia lower bound L NOT derived (Hilbert-
           irreducibility-type machinery for "a generic quintic has full S_5
           monodromy" is explicitly out of scope for this toy record) and
           therefore recorded as trivial (L=1) BY DESIGN. FORCED PROTOCOL
           VERDICT: UNDECIDED at EVERY k=1..4, with both bounds (U=120, L=1)
           reported, REGARDLESS of how closely the observed cycle-type
           histogram matches S_5's classical Chebotarev densities
           (1/120, 10/120, 15/120, 20/120, 20/120, 30/120, 24/120 for cycle
           types 1^5, 2.1^3, 2^2.1, 3.1^2, 3.2, 4.1, 5). This is the object
           that tests whether the protocol correctly REFUSES to overclaim
           fullness rather than always answering.

    DISTINGUISHABLE OUTCOMES (what a run can move, in either direction; see
    `falsification_conditions`, taken directly from the source proposal):
    CONFIRMS the protocol: N1 shows no drop at any k; N2 shows the exact
    4->2 drop at k=2 (and period-2 behaviour at k=3,4); N2-twin shows no drop
    at any k; N4 reaches exactly 3 then 1 at k=3; N5's verdict is UNDECIDED
    at every k with both bounds reported; the h_sep R_1 value is unchanged
    across a tenfold sample-size increase; the labelling control agrees; the
    N1 k=1 census exactly reproduces EXP-MONO-4c7479's class histogram on
    the same curve.
    FALSIFIES the protocol (void, superseded by a new record, never edited):
    h_sep failing to drop 4->2 at k=2; the twin control dropping at any k;
    N4 failing to reach 1 at k=3; R_1 on h_sep changing with sample size; N5
    returning DECIDED at any k (overclaiming, rejected outright regardless of
    the protocol's performance elsewhere).
    THE SINGLE MOST CONSEQUENTIAL POSSIBLE OUTCOME, NAMED EXPLICITLY AND
    CARRIED FORWARD VERBATIM FROM THE SOURCE PROPOSAL'S OWN FRAMING: N1
    dropping at any k. H-MONO-0b3def's mechanism STEP 4 already argues, by
    derivation, that this m=3 symmetric-base cover has d=1 (arithmetic
    equals geometric monodromy, no constant-field extension anywhere). If
    this record's independently-built, more general F_{p^k} ladder machinery
    ever measures a drop on N1, that is not a footnote to be absorbed
    quietly -- it is either (a) a genuine refutation of H-MONO-0b3def STEP 4
    and, by the same argument, of KN-FIND-a8990a Theorem A's
    arithmetic-equals-geometric clause, or (b) an implementation defect in
    THIS record's ladder machinery (most likely a labelling-drift confounder,
    see `confounders`). Either reading requires the same disposition: escalate
    to independent review-adversarial per AGENTS.md rule 12, report the
    drop as the headline finding of this record rather than as a routine
    negative, and do NOT let this record's own conclusion (about the
    protocol) be used to paper over a live contradiction between two
    committed, `supported` records. Distinguishing (a) from (b) is
    explicitly future work this record does not resolve by itself.

    WHAT THIS DOES NOT CLAIM. No ECDLP claim, no exponent, no cost estimate,
    in either direction. No claim about m>=4, about relation rates, or about
    any curve or field outside the six frozen battery objects at p=211. No
    status change to H-MONO-0b3def, H-MONO-0f9170, KN-FIND-a8990a,
    RQ-MONO-001, or GOAL-MONO-001 is proposed or implied (Coordinator
    authority alone, AGENTS.md rule 1). This record neither confirms nor
    denies IDEA-20260815-416f41's or IDEA-20260805-90df50's content; it is
    orthogonal to both.

  mechanism: >-
    DERIVED in IDEA-20260830-8a767e; carried over verbatim in substance. Five
    steps, each with a forced output on the planted battery.

    STEP 1 (structural upper bound U, algebraic, no statistics). Read off the
    containment from the cover's construction shape: a biquadratic
    (Y^2-A)(Y^2-B) with no swap symmetry between the two factors is contained
    in the pure sign-flip group (Z/2)^2 (order 4) acting on the four roots
    (this is U for N2 and N2-twin); the symmetrised m=3 Semaev tower's
    preserved block system gives containment in Z/2 wr S_2 = D_4 (order 8,
    already established by H-MONO-0b3def for N1); a degree-n random
    polynomial gives only the trivial bound S_n (U=S_4=24 for N3, U=S_5=120
    for N5); a degree-3 binomial Y^3-c with p=1 mod 3 gives containment in
    Z/3 trivially, since the cube roots of unity are already present in the
    base field (U=Z/3=3 for N4, established by field theory alone, no
    inertia argument needed).

    STEP 2 (inertia lower bound L, algebraic, no statistics). Factor the
    branch locus and read off inertia. For N2 (h_sep): a(e)=e and c*a(e)=2e
    SHARE the identical zero/pole divisor (e=0 and e=infinity, since c is a
    nonzero CONSTANT) -- local analysis at e=0 (write e=s^2) shows BOTH
    sqrt(e) and sqrt(2e) flip sign together as s -> -s, giving ONLY the
    DIAGONAL generator sigma_1 sigma_2; the same holds at e=infinity. Hence
    L(N2) = <sigma_1 sigma_2> = Z/2, order 2 -- this IS the algebraic reason
    G_geom = Z/2 for h_sep, and it is a genuinely independent computation
    from the census (Step 3/4 checks it, does not produce it). For N2-twin:
    a(e)=e and b(e)=e+1 have DISTINCT zero divisors (e=0 and e=-1) -- at e=0,
    b(0)=1 != 0 so only sqrt(e) ramifies, giving the INDIVIDUAL generator
    sigma_1; at e=-1, a(-1)=-1 != 0 so only sqrt(e+1) ramifies, giving the
    INDIVIDUAL generator sigma_2. Together sigma_1 and sigma_2 generate the
    FULL (Z/2)^2, so L(N2-twin) = U(N2-twin) = 4 already at the arithmetic
    level -- this member is decidable WITHOUT the ladder at all, a useful
    contrast to N2. For N1, L = D_4 = 8 is already established by
    H-MONO-0b3def STEP 5 (inertia at D_swap and D_sign), imported here, not
    re-derived. For N4, L = U = Z/3 = 3 is immediate from p = 1 mod 3 plus c
    a verified non-cube (no inertia computation is needed or meaningful for
    a single-point base). For N3 and N5, L is DELIBERATELY NOT DERIVED (the
    "generic polynomial has full symmetric Galois group" statement is
    Hilbert-irreducibility-type content, out of scope for this toy record)
    and is recorded as trivial (L=1) by design.

    STEP 3 (realized lower bound over F_p, k=1). Census: enumerate or sample
    base points, compute the Frobenius permutation of the fixed-labelled
    fibre, and take the generated subgroup R_1. For N1/N2/N2-twin this is
    exhaustive over all p^2 = 44521 base points (cheap, matching the sibling
    contracts' Stage-1 pattern). For N4 the "base" is a single F_p-point,
    so R_1 is read off a single Frobenius computation, exactly. For N3/N5,
    R_1 is reported as the group order CONSISTENT WITH the observed
    cycle-type density histogram over many independent draws, not as a
    literal generated-subgroup order (there is no fixed labelled fibre
    across unrelated draws for a closure computation to act on).

    STEP 4 (base-change ladder, the new instrument). Repeat Step 3 over
    F_{p^k} for k=2,3,4, using a GENERIC polynomial-basis representation
    F_{p^k} = F_p[x]/(m_k(x)) for a fixed monic irreducible degree-k m_k(x)
    found by trial search (never the ad hoc quadratic-tower approach of
    EXP-MONO-4c7479's fp_common.py, which is specific to k in {1,2,4} via
    repeated squaring of a fixed quadratic extension and does not generalise
    cleanly to k=3), with Frobenius realized as the p-power map x -> x^p on
    this representation, computed by repeated squaring in the polynomial
    ring. Because the arithmetic monodromy over F_{p^k} is generated by
    G_geom and Frob^k, the realized sequence R_k is non-increasing on
    multiples of the constant-field degree d and equals G_geom exactly for
    k divisible by d. For N2, d=2 (period-2: R_1=4,R_2=2,R_3=4,R_4=2); for
    N4, d=3 (period-3: R_1=3,R_2=3,R_3=1,R_4=3); for N1 and N2-twin, d=1
    (constant R_k at every k).

    STEP 5 (verdict discipline). Report DECIDED with the group when
    L = R_stab = U, OR when R_stab = U outright (realizing the full
    structural ceiling is self-certifying even without an independently
    derived L -- O5's own logic: nothing can be realized beyond U). Report
    UNDECIDED, with both bounds, otherwise. Never report a group name from a
    k=1 census alone; never report a geometric verdict without running Step
    4 at every k in the tested range 1..4.

  assumptions:
    - >-
      p odd, p not dividing any tested cover's degree (all degrees here are
      at most 5), and p = 1 mod 3 (required specifically for N4's
      construction to give a genuine irreducible binomial with cube roots
      of unity already present).
    - >-
      A fixed labelling of each non-trivial fibre (N1, N2, N2-twin, N4) is
      maintained across base points and across k, via the total order on
      F_{p^k} elements induced by lexicographic order on their coefficient
      representation in the fixed polynomial basis F_p[x]/(m_k(x)); an
      implementation that relabels per point or per k invalidates the
      generated-subgroup computation (named as the leading confounder,
      below, and as the most likely explanation if N1 is ever observed to
      drop).
    - >-
      Fields F_{p^k} for k <= 4 are constructible via a fixed monic
      irreducible m_k(x) found by trial search over a small, deterministic
      candidate sequence (binomials x^k - a for increasing a, tested by
      Rabin's irreducibility criterion), with Frobenius computed as x -> x^p
      via repeated squaring in F_p[x]/(m_k(x)). At p=211 the largest field
      contemplated is F_{211^4}, about 2*10^9 elements, used only for
      sampling or, for N4, a single exact computation -- never enumerated.
    - >-
      For N3 and N5, "realized subgroup order" is a comparator against a
      known Chebotarev density profile (S_4, S_5 respectively), not a
      literal generated-subgroup computation on a fixed fibre; Step 5's
      verdict machinery is applied to N5 (forcing UNDECIDED by the
      deliberate absence of a derived L) but not to N3 (an instrument
      control with no verdict claim in the source proposal).

  proof_search_map:
    bottleneck: >-
      Certifying a GEOMETRIC group from data collected at F_p-points, when no
      prior argument (unlike H-MONO-0b3def's STEP 4 for its own cover) has
      established arithmetic equals geometric. Every census route in this
      lane runs through this step; this record supplies the executable
      instrument (the ladder) and the disqualification criterion (Step 5,
      including its refusal case) rather than a new number about any curve.
    baseline_embedding:
      parameter_slice: >-
        At k=1 this record's Step 3 IS the lane's existing fixed-p census
        (the same instrument H-MONO-0b3def's paired experiment
        EXP-MONO-4c7479 already ran on N1), so the incumbent is an exact
        parameter slice of this record's protocol and must be reproduced by
        it.
      reproduction_check: >-
        On N1 (the same curve, (A,B)=(1,1) at p=211), Step 3 at k=1 must
        reproduce EXP-MONO-4c7479's five-class Frobenius histogram exactly
        on the same base-point enumeration; a mismatch means this record's
        classifier differs from the lane's own and the comparison is void
        before any k>1 result is interpreted.
    observation_collision:
      observable: >-
        The subgroup generated by realized Frobenius elements (or, for
        N3/N5, the realized cycle-type density profile), as a function of k.
      distinct_preimage_search: >-
        FOUND, AND IT IS THE POINT OF THE RECORD: at k=1 the observable
        takes the value (Z/2)^2 (order 4) both for the planted separator
        h_sep (geometric group Z/2) and for the true-(Z/2)^2 control
        N2-twin (geometric group genuinely (Z/2)^2). Two objects, identical
        k=1 observation, opposite ladder behaviour -- the battery contains
        both preimages so the separation is tested, not merely asserted.
      applies_to: N2 vs N2-twin, the record's decisive pair.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The sequence (R_1,R_2,R_3,R_4) along the base-change ladder,
          replacing a single realized group R_1.
        predicted_gain: >-
          Separates h_sep from its twin, which R_1 alone cannot; on h_sep the
          invariant moves 4 -> 2 -> 4 -> 2 while R_1's own value is stable
          under a tenfold increase in sample size.
      - transform: boundary_lift
        proposed_object: >-
          Inertia at the branch divisors, computed independently of the
          census, as a lower bound on G_geom for every battery member where
          it is derivable (N1, N2, N2-twin, N4).
        predicted_gain: >-
          Supplies the only lower bound on G_geom that does not depend on
          sampling at all, and is what lets Step 5 ever say DECIDED without
          having realized literally every class of a potentially large
          group.
    quantifier_order: >-
      FOR ALL six objects in the battery, THERE EXISTS k <= 4 such that
      either (a) the realized group R_k equals the geometric monodromy and
      an independently derived lower bound witnesses it (N1, N2, N2-twin,
      N4), or (b) no such k exists because no independent lower bound was
      ever derivable at this toy budget, and the protocol correctly reports
      UNDECIDED at every k (N5). N3 is exempted from this quantifier as an
      instrument-correctness control, not a verdict target. This is an
      existential over a BOUNDED range for the DECIDED cases, which is what
      makes the bounded form falsifiable: a member expected to stabilise by
      k=4 that has not is a falsifier of the bounded protocol even if the
      unbounded statement is true.
    method_ceiling:
      strongest_certifiable_claim: >-
        For a cover whose branch locus and block structure admit a hand
        derivation of both a structural upper bound and an inertia lower
        bound (N1, N2, N2-twin, N4 here), the protocol certifies G_geom
        exactly within the tested k-range. NOT certifiable: fullness for a
        cover where no such independent lower bound is derivable (N5) --
        this program has no effective Chebotarev bound over a fixed small
        F_p, and realizing many classes is never by itself a certificate of
        fullness (O5). Not certifiable either: anything about a cover whose
        true constant-field degree d exceeds 4.
      nearby_object_control: >-
        N5 IS the nearby-object control: a construction realizing a rich,
        classically well-understood density profile (S_5 Chebotarev law)
        that nonetheless MUST return UNDECIDED at every k, because
        completeness was never independently proven. Its inclusion tests
        that the protocol refuses to convert a good statistical match into
        an overclaimed verdict.
    proof_obligations:
      - claim: >-
          R_k stabilises to G_geom for k divisible by the constant-field
          degree d, on every battery member for which d is known by
          construction (N1: d=1; N2: d=2; N2-twin: d=1; N4: d=3).
        responsibility: correctness
      - claim: >-
          h_sep has G_arith of order 4 and G_geom of order 2; its twin has
          both equal to 4.
        responsibility: baseline
      - claim: >-
          Inertia at the stated branch divisors generates the claimed L for
          N1, N2, N2-twin, and (trivially, by field theory) N4.
        responsibility: strictness
      - claim: >-
          The battery is constructible and classifiable at p=211 for k<=4,
          including the generic F_p[x]/(m_k(x)) representation and its
          Frobenius map, using pure Python stdlib arithmetic only.
        responsibility: feasibility
      - claim: >-
          A protocol verdict of DECIDED requires L = R_stab = U, or
          R_stab = U outright; a verdict of UNDECIDED is forced whenever
          neither holds, regardless of how well the realized data matches a
          plausible density law (N5).
        responsibility: interface

  heuristic_assumptions:
    - id: HEUR-AG-1
      formal_statement: >-
        For a tame finite cover of a simply connected base over an
        algebraically closed field, the geometric monodromy is generated by
        the inertia subgroups at the branch divisors, so Step 2's L is a
        genuine lower bound for G_geom.
      rigorous_support: >-
        Grothendieck's tame specialisation theory (SGA1); over C, the
        elementary statement that pi_1 of a divisor complement is generated
        by loops. RECALLED, NOT FETCHED (same status as H-MONO-0b3def's
        identical heuristic HEUR-WREATH-1, which this record inherits rather
        than re-derives for N1). THE GAP: a tame statement, so it applies
        only while p does not divide a ramification index -- enforced here by
        p=211 with all tested degrees at most 5.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-a20e48]
      validation_scope_note: >-
        Tested by comparing hand-derived L against ladder-measured R_stab on
        every battery member where L is derived (N1, N2, N2-twin, N4).
        PREDICTED: L = R_stab on all four. N4 is the tail check (L=1 at the
        geometric level, the extreme case where inertia-style reasoning is
        vacuous because the base is a point).
      falsification_condition: >-
        Any of N1, N2, N2-twin, N4 showing L != R_stab at the stabilised k.
    - id: HEUR-AG-2
      formal_statement: >-
        For k in {1,2,3,4} and the battery's class densities, the sampled
        base realizes every class of the arithmetic monodromy over F_{p^k}
        that has density at least 1/8 (the smallest group order among N1,
        N2, N2-twin), with probability at least 0.999 at the pre-registered
        sample size S=10,000 for k>=2 (k=1 is exhaustive for these three
        members, so this heuristic is vacuous there).
      rigorous_support: >-
        A coupon-collector bound on the sample size given a class-density
        floor; the density floor itself is taken from the STRUCTURAL upper
        bound U (order at most 8 for N1/N2/N2-twin), not from the observed
        histogram, avoiding the circularity the source proposal itself
        names.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-a20e48]
      validation_scope_note: >-
        SAMPLE: tenfold sample increase (S=100,000) on h_sep at k=1 (run as a
        sampled sub-census alongside the exhaustive one) and on any cell
        whose R_k differs from an adjacent k, per the sample-size control.
        TAIL CHECK: the k=4 field F_{211^4}, the largest tested, is where a
        sampling artifact is most likely to appear as a spurious partial
        realization.
      falsification_condition: >-
        A tenfold sample increase changing any reported R_k on N1, N2,
        N2-twin, or N4.
    - id: HEUR-AG-3
      formal_statement: >-
        The constant-field degree d of every non-instrument battery member
        divides some k <= 4, so the ladder reaches G_geom within the tested
        range: d=1 for N1 and N2-twin, d=2 for N2, d=3 for N4.
      rigorous_support: >-
        True by construction for all four: N1 by H-MONO-0b3def STEP 4; N2 by
        the shared-divisor argument in `mechanism` STEP 2; N2-twin by the
        same argument applied to its distinct-divisor case; N4 by p=1 mod 3
        plus c a verified non-cube. NOT guaranteed for an arbitrary cover,
        which is why the protocol's bounded form is a falsifiable
        existential (see `quantifier_order`).
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-a20e48]
      validation_scope_note: >-
        SAMPLE: report R_k for all k<=4 on every non-instrument member,
        including N1 and N2-twin where stabilisation (no change) is expected
        at k=1 already, so a non-stabilising sequence is visible rather than
        inferred. TAIL CHECK: any member whose R_k is still changing at k=4
        is reported as NOT-STABILISED and carries no geometric verdict.
      falsification_condition: >-
        Any of N1, N2, N2-twin, N4 having an R_k sequence that has not
        settled into its predicted period by k=4 (N1, N2-twin: constant from
        k=1; N2: period-2; N4: period-3, i.e. R_3=1 achieved).

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ECDLP CLAIM OF ANY KIND, in either direction: no
    speedup, no barrier theorem, no change to any cost estimate. Pollard rho
    at p^{1/2} time, O(1) memory remains the prime-field ECDLP baseline
    (KN-OPEN-001). sota_delta is zero on every attack axis. On the INSTRUMENT
    axis: from a fixed-p census that reports a single group order at k=1 with
    no arithmetic-versus-geometric statement anywhere in the lane's records,
    to a five-step protocol with a frozen six-object battery in which one
    member's reported order changes by a factor of 2 (4->2, N2), another's
    by a factor of 3 (3->1, N4), and a fifth member (N5) is shown to force
    the protocol's own refusal rather than an answer. This record is not
    dominated by, and does not dominate, H-MONO-0b3def or H-MONO-0f9170
    (different question -- an instrument's validity, not a specific cover's
    group or arithmetic); recorded as "orthogonal", never "beats" or
    "extends".

  structural_ingredients:
    - description: >-
        The exact sequence 1 -> G_geom -> G_arith -> Gal(F_{p^d}/F_p) -> 1
        for a cover over a finite field, and the fact that the arithmetic
        monodromy over F_{p^k} is generated by G_geom and Frob^k.
      citation: >-
        Standard in the function-field and etale-cohomology literature
        (Katz, Weil II era material).
      provenance: recalled
      verified_by: null
      role: >-
        Supplies the entire protocol's justification (Steps 4-5); RECALLED,
        NOT FETCHED, exactly as in the source proposal.
    - description: >-
        Grothendieck, SGA1: tame covers of a simply connected base have
        monodromy generated by inertia at the branch divisors.
      citation: "Grothendieck, SGA1"
      provenance: recalled
      verified_by: null
      role: supplies HEUR-AG-1, Step 2's lower bound
    - description: >-
        Classical S_n Chebotarev/cycle-index densities for a generic
        degree-n polynomial's Galois group, used as the comparator for N3
        (S_4) and N5 (S_5).
      citation: >-
        Standard Chebotarev density theorem specialised to S_n acting on n
        points (folklore-level; the S_4/S_5 cycle-index tables are
        elementary combinatorics).
      provenance: recalled
      verified_by: null
      role: supplies the forced density predictions for N3 and N5

  reduction_chain:
    core_problem: >-
      Determine whether a base-change ladder over F_{p^k}, k=1..4, can
      certify geometric monodromy from Frobenius data at a fixed small F_p,
      and whether it correctly refuses to certify fullness when no
      independent structural lower bound is available.
    corollaries:
      - problem: >-
          Whether any census-based route in RQ-MONO-001's lane that has NOT
          separately argued arithmetic=geometric (unlike H-MONO-0b3def)
          needs this ladder, or an equivalent argument, before its verdict
          can be read geometrically.
        reduction_ref: >-
          Not derived here as a general theorem; tested here on six concrete
          objects. A positive battery result supports, but does not prove,
          that the ladder generalises beyond the tested objects.
        asymptotics_preserved: not_applicable
    corollaries_note: >-
      Deliberately excludes: any claim about m>=4 Semaev covers; any
      relation-rate content; any claim about any curve, prime, or cover
      outside the frozen battery; any status change to any other record
      (Coordinator authority alone, AGENTS.md rule 1).

  predictions:
    - metric: realized-group order on h_sep at k=1 versus k=2
      direction: lower
      minimum_effect: >-
        EXACTLY 4 then EXACTLY 2. The record's central forced contrast. If
        the order does not drop, the base-change ladder is not a valid
        geometric probe and the protocol is void -- a clean self-
        falsification.
    - metric: realized-group order on N1 (the D_4 cover) at k=1,2,3,4
      direction: same
      minimum_effect: >-
        EXACTLY 8 at every k. A drop would falsify H-MONO-0b3def STEP 4 and,
        by the same argument, cast doubt on KN-FIND-a8990a Theorem A's
        arithmetic-equals-geometric clause -- the most consequential possible
        outcome of this record, named as such in `statement` and
        `falsification_conditions`, not as a hoped-for result.
    - metric: realized-group order on N2-twin at k=1,2,3,4
      direction: same
      minimum_effect: >-
        EXACTLY 4 at every k. A drop here means the ladder drops for reasons
        other than a genuine constant-field extension and cannot be
        interpreted at all; this falsifies the record outright.
    - metric: realized-group order on N4 at k=1 versus k=3
      direction: lower
      minimum_effect: >-
        EXACTLY 3 then EXACTLY 1. The extreme case: a protocol that cannot
        return 1 here cannot return a geometric verdict anywhere.
    - metric: sensitivity of R_1 on h_sep to sample size (exhaustive, 10^3, 10^5)
      direction: same
      minimum_effect: >-
        UNCHANGED at 4 across all three. A change with sample size falsifies
        the fixed-p-blindness claim (O1) and means the "obligation" this
        record discharges is a sampling artifact, not a structural fact.
    - metric: protocol verdict on N5 at k=1,2,3,4
      direction: different
      minimum_effect: >-
        UNDECIDED at every k, with both bounds (U=120, L=1) reported. A
        DECIDED verdict here is overclaiming and must be rejected outright,
        regardless of the protocol's performance on the other five members.

  test_boundary:
    instances:
      - "p=211 only; six frozen battery objects only; degrees at most 5."
      - >-
        N5 SCOPING-DOWN, STATED EXPLICITLY. The idea's literal N5
        ("a degree-100 sparse-class control... any construction with ~100
        realized classes each of density ~1/100") is NOT tested as specified.
        Reason, stated precisely: a group of order ~100 cannot act faithfully
        on a fibre of size <=8 (Lagrange: 100 does not divide 8! = 40320,
        since 5^2 does not divide 2^7*3^2*5*7), which conflicts with this
        battery's uniform small-fibre subgroup-generation design (fibre sizes
        at most 5 elsewhere) and with the assumption that the closure
        computation is a routine over a small symmetric group. Building a
        literal degree-100 permutation representation would require either a
        fibre of size >=10 (the smallest n with 100 | n!) or an abstract,
        non-permutation notion of "class" -- either a materially different
        instrument design than the rest of the battery uses, not a
        parameter tweak. This record substitutes a uniformly random monic
        QUINTIC (S_5, order 120, fibre size 5, well within the stated
        bound), which is honestly labelled as an approximation of the idea's
        ~100 figure (120, not 100) and, more importantly, preserves the
        FUNCTIONAL test the idea's own method_ceiling text names as the
        actual point of N5: certifying fullness for a group this large
        requires an effective Chebotarev bound this program does not have,
        so the protocol must refuse (UNDECIDED) regardless of how well the
        census matches the predicted density law. This is a Coordinator
        scoping decision, disclosed here and not silently substituted; the
        idea's literal N5 remains untested and is named as future work.
      - "Stage 0: zero-compute frozen battery table with forced outputs, emitted before any code runs."
      - "Stage 1: k=1 census -- exhaustive for N1/N2/N2-twin, single-point exact for N4, sampled draws for N3/N5."
      - "Stage 2: k=2,3,4 base-change ladder -- sampled for N1/N2/N2-twin, single-point exact for N4, resampled draws for N3/N5."
      - "Stage 3: hand-derived structural upper bound U and inertia lower bound L per member, recorded before Stage 4's verdict."
      - "Stage 4: Step-5 verdict per member."
    parameters:
      p: 211
      k_range: "1..4"
      max_fibre_size: 5
      c: 2
    implementation: >-
      Pure Python 3 stdlib integer/modular arithmetic; a generic F_{p^k}
      representation F_p[x]/(m_k(x)) for k=1..4, m_k found by trial search
      (Rabin's irreducibility test over candidate binomials x^k-a), replacing
      the ad hoc quadratic-tower approach of EXP-MONO-4c7479's fp_common.py
      (which the paired experiment's Executor may still consult for the
      Legendre-symbol and general modular-arithmetic primitives it shares,
      per its own description as low-level plumbing with no
      claim-specific intermediate value).
    budget: >-
      See the frozen experiment contract for exact numbers. The source
      proposal's own cost model already scopes the full four-stage protocol
      on all six members at all four k-values as affordable (its own
      estimate: "under a minute per cell... at p=101, k<=4, S=10^5"); the
      paired contract confirms or revises this at the concrete p=211 battery
      chosen here.

  falsification_conditions:
    - >-
      h_sep failing to drop from 4 to 2 at k=2. The ladder is not a valid
      geometric probe; the protocol is void and the record is withdrawn by a
      superseding record, never edited.
    - >-
      The true-(Z/2)^2 control (N2-twin) dropping at any k. Then the ladder
      drops for reasons other than constant-field extension and cannot be
      interpreted.
    - >-
      N4 failing to reach 1 at k=3.
    - >-
      R_1 on h_sep changing with sample size (exhaustive vs 10^3 vs 10^5).
    - >-
      THE SEMAEV COVER N1 DROPPING AT ANY k -- CARRIED FORWARD VERBATIM AS
      THE MOST CONSEQUENTIAL POSSIBLE OUTCOME. Then arithmetic is strictly
      larger than geometric for a cover H-MONO-0b3def's STEP 4 already
      argued has d=1, contradicting that record and the corresponding clause
      of KN-FIND-a8990a Theorem A. This MUST be reported as the headline of
      the run, not as a footnote, and escalated to independent
      review-adversarial per AGENTS.md rule 12 before any status change is
      considered anywhere; the two candidate readings (a genuine refutation
      of H-MONO-0b3def STEP 4, versus a labelling-drift or other
      implementation defect in this record's own more general F_{p^k}
      machinery) must both be investigated and the distinction reported, not
      assumed.
    - >-
      N5 returning DECIDED at any k. Overclaiming protocol; rejected
      outright regardless of the protocol's performance elsewhere.
    - >-
      Any battery member failing to be constructible or classifiable.
      Instrument outcome, never mathematical evidence (AGENTS.md rule 3);
      nothing may be reported for that member in either direction.

  confounders:
    - >-
      LABELLING DRIFT ACROSS k. Fibres over F_{p^k}-points must be labelled
      compatibly (via the fixed lexicographic-on-coefficients convention) or
      the generated subgroups are incomparable. This is the most likely
      implementation defect and it produces exactly the kind of spurious
      drop the record is designed to detect -- and is the leading candidate
      explanation if N1 is ever observed to drop.
    - >-
      SAMPLING IN LARGER FIELDS. The base over F_{p^k} has p^{2k} points
      (for N1/N2/N2-twin) and must be sampled, not enumerated, for k>=2; a
      class of small density can go unrealized purely for sample-size
      reasons and masquerade as a drop. The sample size is fixed in advance
      from the structural upper bound U, and every reported drop must
      survive a tenfold sample increase.
    - >-
      A DROP IS NOT AN EXCEPTIONAL LOCUS. If N1 or any generic-looking
      member drops, the correct reading is a constant-field extension of
      that presentation, not a curve-specific relation-rate anomaly.
      Conflating the two is exactly the error the record exists to prevent.
    - >-
      SCOPE OF THE CRITICISM (O2). This record's obligation criticism
      concerns any census route that has NOT separately discharged
      arithmetic=geometric; it does not reach H-MONO-0b3def (which
      discharges it by argument for N1) or KN-FIND-a8990a Theorem A (which
      discharges it for the general Semaev cover). Whether any OTHER
      committed or proposed census route in this lane has discharged the
      obligation is a Coordinator judgement outside this record's scope.
    - >-
      TOY SCALE. p=211 only, degrees at most 5, groups of order at most 120
      (N5's structural bound). Nothing here extrapolates to cryptographic
      scale or to any other prime.

  interpretation_limits:
    - >-
      CLAIM TIER toy for every measurement; the exact sequence and the
      inertia lemma are RECALLED external mathematics and must be cited as
      recalled, never as verified.
    - >-
      NO ECDLP CLAIM AND NO EXPONENT IN EITHER DIRECTION. This record
      produces an instrument and a disqualification criterion.
    - >-
      IT DOES NOT INVALIDATE ANY COMMITTED RESULT UNLESS N1 DROPS. If N1
      does not drop (the expected outcome per H-MONO-0b3def's own
      derivation), this record leaves H-MONO-0b3def, H-MONO-0f9170, and
      KN-FIND-a8990a completely untouched; it neither strengthens nor weakens
      them, since a non-drop on N1 corroborates STEP 4 rather than proving
      it (the proof is the derivation, not this census).
    - >-
      A PASSING BATTERY DOES NOT CERTIFY ANY OTHER CENSUS. It certifies that
      the protocol separates arithmetic from geometric on six known objects
      at toy scale, p=211 only.
    - >-
      N5 IS A SCOPED-DOWN SUBSTITUTE for the idea's literal degree-100
      construction, not the object itself; see `test_boundary`. The idea's
      literal N5 is named as future work, untested here.
    - >-
      NO STATUS CHANGE to any record, and no assignment of work, is proposed
      or implied by this record. Coordinator authority alone (AGENTS.md
      rule 1).

