# H-PAIR-6236da
# Toy failure locus of the class-polynomial constructor.
hypothesis:
  id: H-PAIR-6236da
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-PAIR-001
  source_idea: IDEA-20261005-3a18d1
  experiment_id: EXP-PAIR-ef9af7
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-5914b6
  title: >-
    On the named toy cells the class polynomial meets the split
    traces and misses the inert norm equation
  statement: >-
    The constructor under test maps a discriminant D to its
    monic class polynomial H_D in Z[X], then to an F_p-root j,
    then to the short-Weierstrass curve with that j, then to
    the point-counted trace. No pairing is evaluated. On the
    nine discriminants -3, -4, -7, -8, -11, -12, -23, -31, and
    -47, the degree of H_D equals the class number, and the
    largest-coefficient bit lengths are 1, 11, 12, 13, 16, 16,
    44, 51, and 84 in that order. On 24 named split cells,
    4p = t^2 - v^2 D and both the curve and its quadratic twist
    have traces {t, -t}. On 12 named inert cells, with
    Kronecker symbol (D/p) = -1 and p > |D|, each polynomial
    has one F_p-root and that root's trace fails the same norm
    equation. For D = -23 at p = 59, clearing the low half of
    the bits of each coefficient, and separately reducing
    coefficients modulo 2^22, each produces an integer
    polynomial different from H_D and neither has an F_p-root,
    while H_D has three roots of trace plus or minus 12. For
    the maximal order of discriminant -3 and the conductor-2
    order of discriminant -12, at p = 7 the root sets are {0}
    and {2} and both absolute traces are 4. These counts are
    a design-session prediction, not a run.
  mechanism: >-
    A split prime is one where the norm equation has a solution,
    so every exact root is a j-invariant of trace plus or minus
    t. An inert prime is outside that hypothesis: a root may
    still exist, and the failure mode is that its trace does
    not solve the norm equation. Dropping low bits changes the
    integer polynomial, so its roots need not be the roots of
    H_D. The Hilbert polynomial and the conductor-2 polynomial
    can cut out different j-invariants inside one absolute
    trace.
  assumptions:
    - p > 3. The curve of j = 0 is y^2 = x^3 + 1. The curve of j = 1728 is y^2 = x^3 + x. Otherwise k = j / (1728 - j) and the curve is y^2 = x^3 + 3 k x + 2 k.
    - Ground truth for a trace is a point count of the curve and of its quadratic twist. The label t is not ground truth.
    - Degree is compared with an independent class-number computation. A mismatch voids the trace cells of that discriminant.
    - Trace 0 is not an ordinary success row. The conductor cell at j = 0 is reported on its own.
  proof_search_map:
    bottleneck: >-
      Whether an F_p-root of the exact class polynomial has
      twist traces {t, -t} exactly on the split cells, and
      fails the norm equation on the inert cells.
    baseline_embedding:
      parameter_slice: >-
        Nine discriminants of class number at most 5, and
        primes at most 1811. The idea's 16-bit through 28-bit
        bins are outside this slice.
      reproduction_check: >-
        Two constructions of H_D must agree as integer
        polynomials before any trace is scored. On five named
        split cells a Legendre point count must agree with
        the group-order routine.
    observation_collision:
      observable: an inert root whose trace solves 4p = t^2 - v^2 D
      distinct_preimage_search: >-
        A split cell whose twist pair is not {t, -t}.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The same j, read from a half-bit truncation and from
          the conductor-2 polynomial.
        predicted_gain: >-
          The truncation loses the three roots at p = 59. The
          conductor-2 polynomial moves j from 0 to 2 and keeps
          absolute trace 4. No discrete-log exponent moves.
    quantifier_order: >-
      For each named discriminant, for each named prime, for
      each F_p-root.
    method_ceiling:
      strongest_certifiable_claim: >-
        The trace verdicts on these 24 split cells, 12 inert
        cells, one truncation, and one conductor pair. Not a
        height law for every fundamental discriminant.
      nearby_object_control: >-
        The five class-number-1 discriminants -3, -4, -7, -8,
        and -11. A trace mismatch there is a pipeline failure.
    proof_obligations:
      - claim: Every split twist pair equals {t, -t}
        responsibility: correctness
      - claim: Every inert root fails the norm equation
        responsibility: correctness
      - claim: Degree equals class number on the nine discriminants
        responsibility: baseline
  predictions:
    - metric: split twist-pair match rate
      direction: higher
      minimum_effect: >-
        Match rate 1 on the 24 named cells. One certified
        mismatch falsifies the constructor on that cell.
    - metric: inert norm-equation hit count
      direction: lower
      minimum_effect: >-
        Hit count 0 on all 12 named inert cells, each of which
        still has one F_p-root.
  falsification_conditions:
    - >-
      One split cell whose point counts are certified and whose
      twist traces are not {t, -t} falsifies the split prediction
      on this window.
    - >-
      One inert root whose trace solves the norm equation
      falsifies the inert failure mode on this window.
    - >-
      If both truncated polynomials at D = -23 and p = 59 have
      the same three roots as H_D, the precision failure mode
      is not established on that cell.
  interpretation_limits:
    - These primes are at most 1811. No transfer to a 28-bit prime or to a cryptographic discriminant.
    - A match on 24 cells does not certify the constructor outside the list.
    - The absolute-trace agreement at p = 7 does not by itself output a conductor.
    - Pollard rho, grumpy giants, and the automorphism discount are unchanged.
  test_boundary: >-
    Nine discriminants, 24 split cells, 12 inert cells, one
    truncation cell, and one conductor cell. The height
    regression is not part of this record.
