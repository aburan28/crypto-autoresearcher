    - id: HEUR-HARVEST-FV-2
      restatement_version: 2
      restatement_note: >-
        Applies VAL-20261003-17b1e4 JR3-B4, -B5, -B6 and the "(ii) is an
        assumption" finding, and RT-20261003-24c995 O8 (the arity restriction
        made explicit, with the per-test price marked as the clause-1 m = 1
        price).
      formal_statement: >-
        CLASS. A_FV is G plus (i) a unit-cost ARITY-1 membership oracle
        deciding Q in F_V, i.e. x(Q) in V, and NOTHING of higher arity: no
        oracle deciding Q in F^(m) (the m-fold sum set) for any m >= 2, no
        summation-polynomial or Weil-descent solving, no norm, smoothness or
        Mumford-polynomial factoring; plus (ii) on Koblitz curves, Frobenius at
        a declared unit cost and an orbit canonicaliser at a declared cost
        c_can. Every Frobenius application, canonicalisation and membership
        test is charged at its declared unit. Fill is charged at write.
        COUNTS. K is the number of Gamma-classes of F plus 2 (Koblitz with
        sigma-stable V: <+-pi>-orbits plus 2, with l replaced by l/(2n)).
        Only non-trivial relations in the corrected COR-GEN sense count, so
        formal identities do not. Full rank means rank K - 1.
        (a) TIME LINE. For every H in A_FV, every tested (n, D) and peak memory
        M: T(H) >= (1/8) min{ K sqrt(l/min(M, K)), K l/|F| }. In the sparse
        regime |F|^2 <= 2^-8 l min(M, K) this is (1/8) K sqrt(l/min(M, K)),
        five bits below PCS batching on class counts.
        (b) ADAPTIVE MEMBERSHIP. For every H in A_FV, a membership query on an
        element that is not a known list element (not determined to lie in F by
        the linear forms in H's view) answers "yes" with probability at most
        of order |F|/l, whatever H's previous view. This is the per-query
        premise from which (a)'s second term derives, and its constant is
        absorbed in (a)'s 1/8. It is an assumption about F_V. Clause 1 at
        m = 1 with uniform targets does not imply it.
      random_model_justification: >-
        Two parts, stated separately. RIGOROUS, random list only: for a
        uniformly random closure-matched list, every equality between distinct
        linear forms is informative with probability at most 1/l, so the
        expected number of informative events is O((T |F| + T^2)/l). This is
        reported by VAL-20261003-17b1e4 from Hhan 2024 Lemma 3.2, which is a
        POINTER in this record. ASSUMED, for F_V: clause (b). The constant
        1/8 is DECLARED before any measurement, five bits below the best known
        harvester on class counts (PCS batching about 4 K' sqrt(l/w)). At
        M >= K the time line is reportedly implied for the generic sub-class
        by Hhan Thm 3.4 (RT-20261003-24c995 heuristic_challenges; pointer).
        The memory-limited branch M < K has no generic-group theorem behind it.
        Dinur 2020 (KR-RHO-7d93f6) is a random-function result, abstract-read.
      arity_restriction_is_load_bearing: >-
        Admitting each proves-too-much object's native m-fold membership test
        (norm factoring on F_q^*, Mumford u-polynomial factoring on genus-5,
        -6 and -8 Jacobians) at the arity-1 price makes the counting bound sit
        19 to 75 bits above the known index calculus on those objects. That is
        the signature of an argument proving too much. With the arity-1
        restriction it does not fire, and priced at each oracle's true success
        probability it is consistent (RT-20261003-24c995 proves_too_much, O8).
      supporting_results:
        - ref: KR-RHO-46c2c6
          provenance: internal
          claim: L discrete logs cost about sqrt(2 L n), tight by Yun 2015
          verified_by: TASK-20261001-9b3e70 (row read)
        - ref: "Yun, ePrint 2014/637 (EUROCRYPT 2015)"
          provenance: retrieved
          claim: tight generic lower bound for n DL instances (abstract only)
          verified_by: TASK-20261001-9b3e70 (abstract page read)
        - ref: "Hhan, arXiv 2402.11269v1 (2024), Lemma 3.2, Thm 3.3, Thm 3.4, App. C Thm C.1"
          provenance: retrieved
          claim: >-
            POINTER ONLY in this record (DEC-20261003-4e91b7 R7). Read at
            source by RT-20261003-24c995 and VAL-20261003-17b1e4. Not frozen
            under inputs/. Backs nothing here until SRC freeze
            (TASK-20261003-a19c53) and a decision reads the frozen bytes.
          verified_by: null
        - ref: KR-RHO-7d93f6
          provenance: internal
          claim: T^2 S = Theta~(C^2 N) for C collisions (Dinur 2020), PCS optimal
          verified_by: TASK-20261001-9b3e70 (row read; sources abstract-read)
        - ref: IDEA-20260807-070d03
          provenance: internal
          claim: a free arity-1 membership oracle yields rho, N/(2 sqrt L) draws
          verified_by: TASK-20261001-9b3e70 (relevant lines read)
      validation_experiment_ids: []
      validation_plan: >-
        heuristic-restatement.md section 5 V4 (toy harness, five arms on one op
        counter, closure-matched null arm, at least 30 instances per cell). NOT
        carded. When carded, the PCS-arm constant is calibrated per w on the
        F* arm rather than fixed at 4 (vOW's "1.1 w distinct collisions per
        version" holds only for 2^10 <= w <= n/2^10), and c_can is declared.
      falsification_condition: >-
        An exhibited H in A_FV whose fill-charged unit count to K full-rank
        non-trivial relations is below the stated line at some tested
        (n, D, M), over at least 30 independent (curve, V, Q) instances, with
        the 99% upper confidence bound of the mean below the line and the same
        harness's PCS arm calibrated on the F* arm. A harvester using a
        higher-arity oracle is OUTSIDE A_FV and does not falsify this clause;
        it routes under DEC-20261002-7a3f19 R8's reworded trigger.
      status: unvalidated
    - id: HEUR-VOW-CURVE
      formal_statement: >-
        Inherited unchanged from H-SEMBIN-97ea23, as H-SEMBIN-8e7ae3 carried
        it. Used only for the VOW column's constant 0.886, which includes a
