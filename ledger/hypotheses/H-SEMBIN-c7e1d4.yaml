  statement: >-
    CONDITIONAL, TWO LAYERS, PLUS NUMBERED HEURISTICS FOR WHAT NEITHER LAYER
    COVERS.

    (MODEL LAYER) Within the cost model of EXP-SEMBIN-04ec3c protocol version 2
    (specification.yaml plus AMD-20261001-e61f2b), with the oracle table's
    construction charged at one operation per ordered entry (FILL = s d, an
    UPPER-bound construction charge, CORR-20261002-e58c3a K13), consider an
    m-summand index calculus on a binary curve of prime extension degree n in
    {97, 109, 131, 163, 191, 233, 239, 283, 409, 571}. For every oracle law of
    that model in the generic class (ENUM by list lookup, MITM, MITM_CAPPED),
    every m >= 2, every d, every s <= floor(m/2) and every store budget, the
    cell's total operation count is at least 1 + (N + log2 m! + d)/2 bits,
    which exceeds the van Oorschot-Wiener column log2(0.886) + N/2. So no
    in-domain cell is below that column. This is the algebraic identity
    PROBE + FILL = N + log2 m! + d. With distinct-entry FILL the in-domain
    zero count is unchanged (CORR-20261002-e58c3a K13).

    (GENERIC LAYER) Let G be the class of relation harvesters of corrected
    COR-GEN (VAL-20261003-17b1e4 JR1-B1 to JR1-B3): algorithms in Shoup's
    generic model with encodings visible (tables, hashing and
    distinguished-point walks allowed), which receive the factor base as a list
    of handles, decide membership only by equality with a handle, apply
    Frobenius only as [lambda], and build targets from P and Q. A relation
    (c, a, b) with sum_j c_j F_j = aP + bQ is TRIVIAL iff its coefficient
    vector, reduced mod l and merged onto <+-lambda>-orbit representatives, is
    zero and b = 0 (on negation-only lists: merged over +-pairs). For every H in
    G run on a uniformly random closure-matched list independent of x, the
    number of generic group operations before H's first non-trivial relation
    is Omega(sqrt l) at any memory, up to the O(log l) list-building factor of
    the reduction (VAL-20261003-17b1e4 JR1-B5). This is a corollary of Shoup
    1997 via Wagner 2002 Cor. 1 (Dai's reduction, with the Q-mixed list
    +-(r_j P + s_j Q) as the necessary adaptation), at EXPONENT LEVEL ONLY.
    APPLICATION TO F_V: the bound binds index calculus on the factor base
    F_V = {Q in <P> : x(Q) in V} WITHOUT any heuristic, at first-moment level,
    only for ENUM by lookup, MITM, MITM_CAPPED and per-target golden-collision
    search over uniformly random targets, by decomposition conservation (each
    multiset has exactly one sum; KN-FIND-007). For every other harvester in G,
    including PCS batched harvesting and pair-sum hashing, it binds F_V only
    under HEUR-HARVEST-FV-1(a). No constant-level comparison with the VOW
    column is asserted outside the model.

    (HEURISTIC LAYER) HEUR-HARVEST-FV-1 and HEUR-HARVEST-FV-2, below, carry
    the non-generic object F_V and the arity-1 membership test, and nothing
    else.

    SILENT on every oracle that reads coordinates beyond the arity-1 test
    x(Q) in V: membership in m-fold sum sets, Weil-descended summation
    polynomials, norm or smoothness factoring, approximate F_2-linear
    x-coordinate filters (KN-OPEN-91d4f6), trace and halving tests, Frobenius
    applied by squaring beyond orbit bookkeeping (KN-OPEN-c2e86a), the
    Riemann-Roch oracle, solving-degree questions (KN-OPEN-8f3d27), the
    preprocessing reading in which the table is amortised over many instances,
    and the multi-instance reading. Nothing here is a statement about any
    curve's security in either direction.

