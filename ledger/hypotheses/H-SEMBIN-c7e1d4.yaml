  mechanism: >-
    In the model, every table-based oracle trades probe time against table
    fill along a fixed product, 2^PROBE * 2^FILL = m! N |F|, and AM-GM puts the
    total at or above 2 sqrt(m! N |F|). Every v1 sub-rho cell needed BOTH fewer
    than one oracle call AND an uncharged table larger than rho's whole work,
    and removing either reading removes all of them (CORR-20261002-e58c3a K4).
    Outside the model, a harvester that treats the factor base as an
    unstructured list can be handed a random closure-matched list with known
    representations, and Dai's reduction turns its first non-trivial relation
    (non-trivial over Z/l on orbit representatives) into the discrete
    logarithm, which Shoup's bound prices at Omega(sqrt l). Per-relation costs
    below sqrt(l) are NOT excluded: amortisation over K relations achieves them
    (PCS batching). Only totals are bounded. Whether F_V is "unstructured
    enough" for a harvester whose yield is not fixed by decomposition
    conservation is exactly HEUR-HARVEST-FV-1(a).

