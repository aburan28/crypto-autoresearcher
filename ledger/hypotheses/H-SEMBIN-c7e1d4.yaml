  falsification_conditions:
    - >-
      MODEL LAYER: any v2 primary cell violating P1 or P2 with C-IMPL-GATE and
      the R3-ordered gates passing. This is an arithmetic defect in the model
      or the driver, reported as one, never a result.
    - >-
      GENERIC LAYER: an algorithm in G (as corrected) whose first non-trivial
      relation on a uniformly random closure-matched list costs o(sqrt(l)/log l)
      generic group operations would contradict Shoup's theorem and is
      therefore expected only as a defect in the class definition. The live
      falsifier is a defect in the corrected class itself: an algorithm meeting
      its letter but not Dai's requirement.
    - >-
      TRANSFER TO F_V: a FALSIFIED reading of HEUR-HARVEST-FV-1(a) removes the
      generic layer's application to F_V for every harvester outside the
      conservation-law laws, at the falsifying cell's scope. It does not touch
      the random-list statement or the model layer.
    - >-
      HEURISTIC CLAUSES: as stated per HEUR-HARVEST-FV-1 and -2. A
      falsification of FV-2 removes the conditional pricing of the arity-1
      membership class only.
    - >-
      SCOPE: an exhibited coordinate-reading harvester using a higher-arity
      oracle does NOT falsify this hypothesis, which is silent there. It routes
      to rule 12 under DEC-20261002-7a3f19 R8's reworded trigger if it is
      proposed below the VOW column, or below T vs c sqrt(K l), or below the
      T^2 M ~ K^2 l frontier, at a listed degree.

  interpretation_limits:
    - >-
      No statement about the security of any curve, in either direction.
      Degrees are parameter labels.
    - >-
      The model layer is a derivation about a model whose unit is optimistic
      for index calculus (claim tier heuristic_estimate). It is not a
      measurement.
    - >-
      The generic layer is exponent level only. "Below the VOW column" is
      asserted only inside the model. The constructed-configuration minimum
      (+0.585 bits) is a reviewer computation over what was constructed, not a
      bound over what exists.
    - >-
      Discharges no completion criterion of GOAL-SEMBIN-5078bc. Criterion 4
      names the chained-S_3 index calculus with its Groebner cofactor, which
      this model excludes.
    - >-
      Preprocessing and multi-instance readings are out of scope (KN-LIT-013;
      KR-RHO-ea34b8; KR-RHO-46c2c6).

