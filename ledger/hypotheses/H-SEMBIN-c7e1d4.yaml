  heuristic_assumptions:
    - id: HEUR-HARVEST-FV-1
      restatement_version: 2
      restatement_note: >-
        First ledger appearance. Version 1 is the draft in
        heuristic-restatement.md section 4, which was reviewed and never
        adopted. Version 2 applies VAL-20261003-17b1e4 JR3-B1, -B2, -B3 and
        -B7 and its corrected wording, and the A1 identity of
        TASK-20261002-a84e65 DESIGN.md section 2.
      formal_statement: >-
        Fix (n, E, <P>, V): E/F_{2^n} a binary curve with n prime, <P> of prime
        order l with cofactor h in {2, 4}, V an F_2-subspace of F_{2^n} of
        dimension D, and F = F_V = {Q in <P> : x(Q) in V}, which is
        negation-closed. Let Gamma = <-1>, or Gamma = <-1, pi> on a Koblitz
        curve with sigma-stable V (then F is also pi-closed and pi acts on <P>
        as [lambda]). Let F* be a uniform union of the same number of distinct
        Gamma-orbits of <P> \ {O} as F (size matched to the REALISED |F_V| per
        V, never to 2^D/h). Targets R are uniform in <P>.
        (a) TWO-SUM CONFIGURATIONS. Let Z4(L) be the number of Gamma-classes of
        4-element subsets {u1, u2, u3, u4} of L with u1 + u2 + u3 + u4 = O and
        no inverse pair, and Z3(L) the number of Gamma-classes of zero-sum
        multisets {t, t, u, v} (t, u, v distinct, no inverse pair). On Koblitz
        lists with sigma-stable V, exclude from Z3 the two structural families
        inside each orbit, from X^2 - tX + 2 and from
        (X + t)(X^2 - tX + 2) = X^3 + X + 2t, and report their count
        separately. CLAUSE: (Z4(F), Z3(F)) and (Z4(F*), Z3(F*)) have the same
        distribution. The raw count N_2 = sum_{g != O} C(r(g), 2) over
        2-element subsets satisfies N_2 = 6 Z4 + 2 Z3 on negation-closed lists
        (Gamma = <-1>), with clumps of 6n on pi-closed lists, so N_2 is
        compound Poisson and is reported, not tested against a Poisson law.
        Poisson(mu) with mu ~ |F|^4/(48 l) (Z4, ordinary) is a REFERENCE only;
        every constant comes from the null sample.
        (b) DECOMPOSITION COUNTS. For m in {3, 4}, the number of m-multisets of
        F summing to R that contain no sub-multiset summing to O (no inverse
        pair, and on Koblitz lists none of the structural orbit zero-sums) has
        the same distribution under F and F*.
        SCOPE. "Fix V" is read as V uniform among D-dimensional subspaces
        (a-rand). Structured V (polynomial-basis windows; sigma-stable V; V
        inside ker Tr) are separate cells, each its own claim. The
        sigma-stable Koblitz sub-clause applies only where a testable cell
        exists. On the n-grid {31, 37, 41, 43, 47} none is expected
        (VAL-20261003-17b1e4 JR3-B7, toy scratch), so that sub-clause is
        UNTESTED until a design supplies one.
      random_model_justification: >-
        For a uniformly random closure-matched list, Z4 and Z3 are sums of
        weakly dependent indicators of probability about 1/l. Their
        Poisson-type limits are the classical sparse-sum regime (recalled,
        backs nothing). The assumption is that the F_2-linear condition
        x in V imposes no additive structure on <P> beyond the detectable
        closure Gamma. Two structural facts are already accounted for: on <P>,
        Tr(x(Q)) = Tr(a) is constant (toy scratch S3, VAL-20261003-17b1e4), so
        |F_V| depends on V's position relative to ker Tr and must be measured
        (RT-20261003-24c995 O9); and the Koblitz orbit families of (a) are
        deterministic.
      role_in_this_record: >-
        Clause (a) is what the generic layer's transfer to F_V needs for every
        harvester whose yield is not fixed by decomposition conservation
        (CH-2). Clause (b) prices the decomposition rate of A_FV harvesters.
      supporting_results:
        - ref: "Poisson approximation of sparse random sums (classical)"
          provenance: recalled
          claim: pointer only; backs nothing
          verified_by: null
        - ref: "Diem; Petit-Quisquater decomposition-probability heuristic |F|^m/(m! #G)"
          provenance: recalled
          claim: pointer only; backs nothing
          verified_by: null
        - ref: VAL-20261003-17b1e4 scratch C1 (abstract Z/l lists)
          provenance: internal
