        The model cell (TOTAL, store) and the verdict "below the VOW column";
        and per-relation cost.
      distinct_preimage_search: >-
        FOUND, three times. (1) The same accounting gives "no sub-rho cell" on
        the generic group and sub-rho cells on F_q^* and genus-g Jacobians;
