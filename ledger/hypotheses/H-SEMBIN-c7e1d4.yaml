    quantifier_order: >-
      MODEL LAYER: FOR ALL n in the ten degrees, m >= 2, d >= 0,
      s <= floor(m/2), B: TOTAL >= 1 + (N + log2 m! + d)/2. Deterministic.
      GENERIC LAYER: EXISTS c > 0 such that FOR ALL l prime, FOR ALL H in G,
