hypothesis:
  id: H-PFDR-26bcee
  question_id: RQ-FBG-001
  source_idea_id: IDEA-20260830-772cff
  batch_id: BATCH-c64bee
  title: >-
    A CHANNEL-SCOPED closure of the factor-base geometry family on the yield,
    coverage and rank channels -- and the rank channel discriminator must be
    rebuilt, because the source idea threshold "a geometry with kappa at least
    0.05 below kappa_random" cannot fire under its own prediction
    kappa_random at most 1.05 combined with the trivial bound kappa at least 1,
    which leaves the entire available headroom equal to the threshold; the
    statistic is renormalised by the MEASURED headroom and calibrated by a
    planted base whose kappa is exactly 1.
  statement: >-
    (A) WHAT THIS RECORD IS. A derivation-level closure argument for
    RQ-FBG-001 decision target, written to a named-obstruction, argument and
    forward-guidance standard rather than as a count of rejected mechanisms. Two
    of its three bounds are already in the corpus and are QUOTED, not claimed;
    the third bound, the cost ledger that assembles them, the rank-channel
    instrument repair, and the forward guidance are the new content.
    (B) CHANNEL 1, YIELD -- QUOTED, NOT NEW. Under a harvest-all solve, relations
    per processed target equal the conservation mean
    mu = binomial(B+m-1, m)/N exactly for every base of size B, so the advantage
    of any geometry over a matched random base is exactly 1 at every N and its
    growth slope is identically 0. Verified verbatim by this coordinator in
    KN-FIND-007, whose measured maximum absolute deviation from the closed form
    was exactly 0 over 144 cells.
    (C) CHANNEL 2, COVERAGE -- QUOTED, NOT NEW, AND CONDITIONAL. Coverage is
    bounded by min(1, mu) exactly, so the advantage over a matched random base is
    at most min(1, mu)/coverage_random. Conditional on HEUR-001, the random base
    occupancy law, that expression is maximised at mu = 1 with value 1.582 and
    tends to 1 as mu tends to 0 or to infinity. It is a function of mu ALONE, and
    mu is fixed by the (B, N) convention rather than by geometry. KN-FIND-007
    states the same bound in its own words as at most 1.582 maximised at mu = 1.
    (D) CHANNEL 3, RANK -- NEW, AND THE PLACE THE INSTRUMENT MUST BE REPAIRED.
    KN-FIND-007 states explicitly that relation rank and independence are not
    captured and that the mean scores a rank-deficient base as tied with a random
    base of the same size, so the rank channel is where an unbounded geometry
    advantage could still hide. Define the RANK-SATURATION OVERHEAD kappa(D, N)
    as the number of harvested rows needed to reach rank B+1, divided by B+1.
    Then kappa >= 1 for EVERY base, trivially. Conditional on HEUR-002,
    kappa_random = 1 + o(1). Therefore the rank channel ADVANTAGE of any geometry
    is at most kappa_random, a quantity that tends to 1, while its DISADVANTAGE
    is unbounded. A channel whose best case is 1 + o(1) cannot carry a growth
    clause.
    (E) THE DISCRIMINATOR DEFECT AND ITS REPAIR, WHICH IS BLOCKING.
    IDEA-20260830-772cff pre-registers kappa_random at most 1.05 and falsifies
    channel 3 on "any geometry with kappa below kappa_random by more than 0.05".
    THOSE TWO NUMBERS ARE THE SAME NUMBER. Since kappa >= 1 holds for every base
    with no assumption, the MAXIMUM POSSIBLE advantage of any geometry is exactly
    kappa_random - 1, which under the record own prediction is at most 0.05. The
    falsification threshold therefore requires kappa_random to sit at its
    predicted ceiling AND the geometry to sit exactly at the floor, and at any
    measured kappa_random below 1.05 -- the expected case -- the discriminator
    is width-zero and cannot fire in either direction. REPAIR: the reported
    statistic is the NORMALISED RANK ADVANTAGE
    A(D) = (kappa_random - kappa_D) / (kappa_random - 1), which is 0 under the
    null and exactly 1 at the maximum attainable advantage kappa_D = 1; the
    MEASURED HEADROOM kappa_random - 1 is reported beside it with its interval;
    and whenever the headroom is below the measurement resolution the rank arm
    is declared UNDERPOWERED and channel 3 is reported as NOT CLOSED rather than
    as closed. A planted base whose kappa is exactly 1 by construction is
    required to return A = 1, and a planted rank-deficient base is required to
    return kappa = infinity, so the statistic is demonstrated to move across its
    whole range before any panel value is read.
    (F) THE LEDGER. Total cost is T * s(B) + L(B) with T the number of processed
    targets, s(B) the per-target decomposition-search cost and L(B) the linear
    algebra. Under harvest-all, T = (B+1) kappa / mu, in which the factor
    m! N / B^{m-1} is EXACTLY geometry-invariant by (B) and the only
    geometry-dependent factor is kappa, bounded below by 1 by (D). So the total
    multiplicative leverage of geometry on the target count is at most
    1.582 (1 + o(1)) and its leverage on the exponent is zero. At m = 3 with
    s = Theta(1) and L(B) = Theta(B^2) the ledger 6N/B^2 + B^2 is minimised at
    B^4 = 6N with total exactly 2 sqrt(6N); with the honest meet-in-the-middle
    s(B) = Theta(B) the ledger 6N/B + B^2 is minimised at B^3 = 3N with total
    3 (3N)^{2/3}. Both for every geometry.
    (G) SCOPE, STATED AS A LIMIT AND NOT AS A HEADLINE. The conclusion is
    CHANNEL-SCOPED, not family-scoped. Four classes remain open, each with a live
    record: the SOLVE channel s(B), where a multiplicative-coset base -- one of
    this question own named geometries -- has a filed claim of a solving-degree
    collapse; the LINEAR-ALGEBRA channel L(B); the representation-side target
    restriction, which escapes (B) legitimately because conservation is a
    WHOLE-GROUP statement and is the subject of H-PFDR-1b2386 in this same
    batch; and the ARITY m, which the ledger identifies as the actual exponent
    lever and which is not a geometry question at all.
    (H) NOT CLAIMED. Not a universal impossibility claim. Not a claim that index
    calculus fails -- the extension-field decomposition probability IS this
    conservation mean, so the identity is fully consistent with index calculus
    working, and the extension-field advantage lives in the solve. Not a claim
    about any geometry solve cost, and it does not close the four surviving
    classes.
  mechanism: >-
    THE OBSTRUCTION, NAMED. CONSERVATION OF DECOMPOSITION MASS: the map from
    size-m multisets of the base to the group is a function, so its fibres
    partition a set of fixed size binomial(B+m-1, m) and the fibre-size total is
    a property of (B, m, N) alone. Every quantity this question proposed to
    optimise is a functional of that fibre-size vector, and the only freedom a
    geometry has is to redistribute mass among fibres. Redistribution is bounded
    upward on both functionals that matter -- by min(1, mu) on coverage and by
    kappa_random on rank saturation -- because both are Schur-type quantities of
    a vector whose sum is pinned. The obstruction is therefore a MEASURED
    QUANTITY with a scope rather than an opinion.
    THE SECOND READING, WHICH THE CLOSURE STANDARD REQUIRES. Which theory WANTS
    a pinned total with free distribution? Two do. Extremal sumsets: coverage
    times N is exactly the size of the m-fold sumset, so the coverage ceiling is
    the statement that a Sidon-of-order-m set maximises the sumset, which is why
    the ceiling is attainable and why the construction that attains it is defined
    in the exponent coordinate and therefore has known logarithms and is not a
    factor base. And cost ledgers with a conserved resource: a pinned total means
    the only levers are the price per unit, s(B), and the exchange rate into the
    answer, L(B) -- which is precisely the forward guidance.
    THE LOSSY-PROJECTION TEST ON THIS RECORD OWN OBJECT. The tracked object is
    the fibre-size vector projected to the triple (mean, coverage, kappa), three
    numbers standing in for N integers. It is lossy: it forgets which target,
    which base element, the curve and the field. It is lossy COMPATIBLY with the
    operations the target performs, since processing one more target and
    harvesting all its decompositions moves the mean by exactly 0, moves coverage
    by the indicator of a fresh hit and moves kappa by a rank-1 update. And it is
    NOT a change of coordinates: the observation collision exhibits two bases with
    the same triple and different solve cost, which is exactly what confines the
    conclusion to three channels.
  assumptions:
    - >-
      The group is cyclic of prime order N and the base has B distinct elements;
      the frozen counting convention -- arity, symmetric or not, effective size
      after negation collapse -- is identical across every arm compared.
    - >-
      Relations are harvested from targets R = aP + bQ with a and b uniform, so
      the target set is the whole group and conservation binds. If the target set
      is restricted the identity does NOT bind; that route is explicitly excluded
      here and is H-PFDR-1b2386 subject.
    - >-
      The linear-algebra stage is sparse Wiedemann on rows of weight m, giving
      L(B) = Theta(m B^2). A structured solve giving B^{1+o(1)} changes the
      ledger optimum, which is forward guidance rather than a hidden assumption.
    - >-
      Toy scale binds for every MEASURED input. The two size-free ingredients --
      the conservation identity and coverage at most min(1, mu) -- are theorems
      in any finite abelian group for any target-independent counted family, so
      their transfer is mathematical rather than extrapolated; kappa_random is
      NOT size-free and is measured at N at most 2^18.
    - >-
      [relayed] The red-team objection numbers quoted by the source idea -- the
      1.581977 envelope derivation, the measured coverage_random agreements of
      0.2 to 1 percent, and the restricted-target-set escape at ratio 8.01 --
      are RELAYED from IDEA-20260830-772cff, whose author records a PARTIAL read
      of the objections file. This coordinator did not open that file. Stage 0
      recomputes the 1.581977 maximisation independently rather than quoting it.
    - >-
      [relayed] The 4.5x typing penalty, the H017 coverage collapse to 0.0021 at
      concentration 1224x, and the Sidon coverage ratio 1.1071 are read verbatim
      by this coordinator in KN-FIND-007.
  proof_search_map:
    bottleneck: >-
      The exponent of relation collection in m-term factor-base index calculus.
      The exact step is the count of PROCESSED TARGETS needed for B+1 independent
      relations -- the only quantity through which a factor-base geometry can
      touch the exponent without touching the solve or the linear algebra.
    baseline_embedding:
      parameter_slice: >-
        Set the geometry to a matched random base. The ledger must return the
        corpus own recorded ordering: at m = 3 with meet-in-the-middle
        s = Theta(B) and L = Theta(B^2), the optimum B = Theta(N^{1/3}) and total
        Theta(N^{2/3}), worse than Pollard rho.
      reproduction_check: >-
        Symbolic. Minimise 6N/B + B^2 and verify B^3 = 3N with value
        3 (3N)^{2/3}; minimise 6N/B^2 + B^2 and verify B^4 = 6N with value
        exactly 2 sqrt(6N). A frozen regression fixture stores both optima, their
        optimising B and their constants.
    observation_collision:
      observable: 'the triple (mean, coverage, kappa) of a factor base'
      distinct_preimage_search: >-
        FOUND, AND IT IS THE REASON THE KILL IS CHANNEL-SCOPED. A multiplicative
        coset and a random base of the same size have exactly equal means by the
        conservation identity, coverages equal within the per-cell resolution,
        and no reason for their kappa to differ -- yet a live filed claim asserts
        their SOLVING DEGREES differ by about a factor m/2. Two objects, one
        observable, opposite sides of the conclusion. The additional condition
        that separates them is the algebraic description of the membership ideal,
        which the triple discards entirely. Consequently this record conclusion
        is stated over three channels and may never be quoted as covering the
        solve.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The cost ledger T s(B) + L(B) with T factored as (B+1) kappa / mu, so
          each factor is charged to exactly one proved or measured bound: mu to
          the conservation identity, kappa to the rank-saturation measurement,
          and s and L left unbounded and NAMED as the surviving channels.
        predicted_gain: >-
          No gain is claimed. The purpose is to make the geometry leverage a
          single explicit factor bounded by 1.582 (1 + o(1)), so that "geometry
          cannot move the exponent" becomes an arithmetic statement about one
          factor rather than a survey of six cells.
      - transform: stronger_invariant
        proposed_object: >-
          kappa kept alongside coverage instead of collapsing to coverage,
          because rank is what survives into the solve stage while coverage does
          not -- and, added here, the NORMALISED advantage A and the measured
          headroom, so the statistic has a stated range rather than an absolute
          threshold that its own prediction closes.
        predicted_gain: >-
          Closes the one channel the conservation finding names as uncaptured, by
          exhibiting its one-sided bound, with a discriminator that can fire.
    quantifier_order: >-
      FOR ALL m >= 2, FOR ALL prime N, FOR ALL B, FOR ALL bases D and D-prime of
      the same effective size in the same group, harvest-all relations per
      processed target are EQUAL -- the strongest order, with no witness allowed
      to depend on anything. FOR ALL such bases the coverage advantage is at most
      min(1, mu)/coverage_random, where the denominator is the same for all of
      them. The RANK clause is weaker and its order is stated honestly: FOR ALL
      bases kappa >= 1, uniform and trivial, while kappa_random = 1 + o(1) is
      EXISTS-a-bound-per-N, conditional on HEUR-002 and MEASURED rather than
      proved. The ledger clause is FOR ALL geometries, FOR ALL N, the m = 3
      optimum exponent is 1/2 GIVEN the stated s and L -- and the "given" is a
      genuine restriction, because s and L are exactly the surviving channels.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the yield, coverage and rank channels, and under the stated cost
        model, the m = 3 relation-collection exponent is 1/2 for every geometry
        and the geometry leverage is a constant of at most 1.582 (1 + o(1))." It
        can NEVER certify anything about s(B) or L(B), and therefore can never
        certify that no factor-base geometry is exponent-relevant.
      nearby_object_control: >-
        The multiplicative coset, which is one of this question own named
        geometries, satisfies every bound in this record, and has a live filed
        claim of a solving-degree collapse. Running the method on it returns "no
        advantage" on all three channels, which is CORRECT and is exactly why
        the method has not identified the load-bearing structure of the solve.
        Stated here rather than discovered later.
    proof_obligations:
      - claim: 'Harvest-all relations per processed target equal mu exactly for every base of size B.'
        responsibility: baseline
      - claim: 'coverage <= min(1, mu), with equality iff no target has two decompositions.'
        responsibility: strictness
      - claim: 'coverage_random = (1 - exp(-mu))(1 + o(1)) -- HEUR-001, not proved.'
        responsibility: success_probability
      - claim: 'kappa >= 1 for every base.'
        responsibility: size
      - claim: 'kappa_random = 1 + o(1) -- HEUR-002, measured and not proved.'
        responsibility: success_probability
      - claim: >-
          The normalised rank advantage A is 0 on the null and exactly 1 on a
          planted base with kappa = 1, and the measured headroom kappa_random - 1
          is reported with its interval beside every A.
        responsibility: strictness
      - claim: >-
          6N/B^2 + B^2 is minimised at B^4 = 6N with value exactly 2 sqrt(6N),
          and 6N/B + B^2 at B^3 = 3N with value 3 (3N)^{2/3}.
        responsibility: runtime
      - claim: >-
          The CURVE-FREE null -- the identical accounting and the identical
          kappa measurement in an abstract cyclic group of the same order with
          an abstract base -- is run, and any bound it reproduces is a statement
          about factor-base geometry in finite abelian groups and not about
          elliptic curves.
        responsibility: scope
      - claim: >-
          Every citation carries the channel scope and the cost-model
          conditionality.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: 'the relation-collection exponent of m-term factor-base index calculus'
    prior_best: 'Pollard rho at 0.886 sqrt(N) time with O(1) memory'
    time_exponent: >-
      1/2 at m = 3 under s = Theta(1) and L = Theta(B^2), for EVERY geometry;
      2/3 under the honest meet-in-the-middle s = Theta(B). In general m the
      ledger optimises to Theta(N^{2/(m+1)}), identifying ARITY and not geometry
      as the exponent lever. NO EXPONENT IS MOVED; a bound on one is claimed.
    memory_exponent: >-
      Theta(B) = Theta(N^{1/4}) at the m = 3 s = Theta(1) optimum, or
      Theta(N^{2/3}) if a meet-in-the-middle table is used at that variant own
      optimum, which is a genuine memory cost the s = Theta(B) variant hides.
    hidden_cofactor: >-
      The Theta(N^{1/2}) floor assumes a FREE decomposition search, which does
      not exist; Theta(B^2) for sparse Wiedemann hides a log cofactor and a large
      constant; the o(1) in kappa_random is measured at small B and is not
      established asymptotically; and the 1.582 constant is attained only at
      mu = 1, so at cryptographic parameters where mu is far below 1 the envelope
      collapses toward 1 and the coverage channel is MORE closed at scale, which
      strengthens the conclusion and must be quoted with it.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        RANDOM-BASE OCCUPANCY LAW. For a uniformly random B-subset of a cyclic
        group of prime order N and fixed arity m, the coverage satisfies
        cov = (1 - exp(-mu))(1 + o(1)) as N grows with mu in a fixed compact
        subinterval of the positive reals. Consequently the supremum over ALL
        bases of the coverage advantage equals min(1, mu)/((1 - exp(-mu))(1 +
        o(1))), which is at most 1.582 uniformly.
      random_model_justification: >-
        The rigorous half is exact and twofold: the conservation identity fixes
        the total fibre mass with no error term, and coverage at most min(1, mu)
        is a theorem proved by splitting that identity over the support. Only the
        DENOMINATOR is heuristic. The classical distribution imitated is the
        Poisson occupancy limit for balls in bins. The gap, plainly: the m-fold
        sums of a random set are pairwise nearly independent but not
        independent, and the total is conditioned to be exact, so the Poisson
        limit is imitated rather than applied.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            The conservation identity with measured deviation exactly 0 over 144
            cells; coverage bounded by min(1, mean); the one-relation-per-target
            gain at most 1.582 maximised at mu = 1; the Sidon base attaining the
            ceiling at ratio 1.1071 and the H017 collapse to 0.0021; and the
            explicit statement that relation rank and independence are NOT
            captured.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-2c58eb
      falsification_condition: >-
        Any measured coverage advantage exceeds min(1, mu)/coverage_random at its
        own mu, or exceeds 1.582 anywhere. Channel 2 falls and is REOPENED.
    - id: HEUR-002
      formal_statement: >-
        RANDOM-BASE RANK SATURATION. For a uniformly random B-subset and relation
        rows harvested from uniform targets, the number of rows needed for the
        (B+1)-column coefficient matrix to attain rank B+1 over F_N is
        (B+1)(1 + o(1)).
      random_model_justification: >-
        The rigorous half is the trivial bound kappa >= 1, which holds for EVERY
        base with no assumption and which carries the one-sided conclusion
        whatever kappa_random turns out to be. The classical statement imitated
        is the rank distribution of random matrices over a finite field, where
        the probability that B+c uniform rows fail to span is O(q^{-c}). The gap,
        plainly: the rows here are neither uniform nor independent -- they are
        nonnegative exponent vectors of weight at most m with row sum exactly m,
        so they lie in an affine hyperplane, and rows harvested from the SAME
        target share their last column. Whether that structure costs more than
        o(1) extra rows is precisely what the measurement decides.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-2c58eb
      falsification_condition: >-
        kappa_random exceeds 1.2 at any rung. HEUR-002 is withdrawn, the rank
        channel is REOPENED and reported as NOT closed -- which is a real and
        reportable outcome and the single most valuable way this record can be
        wrong.
  structural_ingredients:
    - description: >-
        The conservation identity, the coverage bound min(1, mu), the 1.582
        one-relation-per-target envelope, and the explicit statement that rank
        and independence are not captured.
      citation: KN-FIND-007
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: channels 1 and 2, and the identification of channel 3 as uncaptured
    - description: >-
        The frozen conservation battery numbers -- the stars-and-bars proof, the
        336 cells with 0 violations, the exact accounting identity, and the
        measured redistribution extremes.
      citation: 'experiments/EXP-FB3-001/conservation.md'
      provenance: internal
      verified_by: >-
        RELAYED from IDEA-20260830-772cff, which records a full read on
        2026-08-29. NOT opened by this coordinator.
      role: the measured support for the two quoted channels
    - description: >-
        Perfect Sidon-of-order-m constructions, which is why the coverage ceiling
        is exactly attainable and therefore TIGHT rather than merely an upper
        bound.
      citation: 'Bose and Chowla, theorems in the additive theory of numbers'
      provenance: recalled
      verified_by: null
      role: tightness of the coverage bound; not fetched or read by any agent here
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The statement is a bound on how much a
      factor-base geometry can move a relation-collection exponent through three
      named channels.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- coverage advantage of any geometry over a matched random base at
        any tested (N, B, m). UNITS: dimensionless ratio
      direction: different
      minimum_effect: >-
        BOUNDED ABOVE by 1.582 and by min(1, mu)/coverage_random at the cell own
        mu. A single measured cell above that bound falsifies channel 2 and with
        it HEUR-001.
    - metric: >-
        P2 -- kappa_random, the rank-saturation overhead of a matched random
        base, per rung, with its interval. UNITS: dimensionless ratio
      direction: different
      minimum_effect: >-
        PREDICTED at most 1.05. A value above 1.2 falsifies HEUR-002 and REOPENS
        the rank channel.
    - metric: >-
        P3 -- MEASURED HEADROOM kappa_random - 1, per rung, with its interval.
        UNITS: dimensionless
      direction: different
      minimum_effect: >-
        REPORTED FIRST AND BLOCKING, with no predicted value. It is the entire
        range within which any geometry rank advantage can possibly lie, because
        kappa >= 1 holds for every base. If the headroom is below the
        measurement resolution, the rank arm is UNDERPOWERED and channel 3 is
        reported as NOT CLOSED. This prediction exists because the source idea
        absolute threshold of 0.05 equals its own predicted ceiling for this
        quantity, which makes the original discriminator width-zero.
    - metric: >-
        P4 -- NORMALISED RANK ADVANTAGE, defined as (kappa_random minus kappa_D)
        divided by (kappa_random minus 1), minimised over the geometry panel.
        UNITS: dimensionless, 0 at the null and 1 at the maximum attainable
        advantage
      direction: different
      minimum_effect: >-
        PREDICTED 0 within the null spread measured across the random draws. A
        panel value above the upper quantile of that null spread exhibits a rank
        ADVANTAGE and falsifies channel 3 directly. The statistic is scaled by
        the MEASURED headroom rather than by a fixed absolute threshold, so it
        can fire whatever the headroom turns out to be.
    - metric: >-
        P5 -- PLANTED kappa = 1 POSITIVE CONTROL: a base and harvest order
        constructed so that the first B+1 harvested rows are independent by
        construction. UNITS: dimensionless
      direction: different
      minimum_effect: >-
        FORCED kappa exactly 1 and A exactly 1. THIS IS THE DYNAMIC-RANGE
        DEMONSTRATION and it is blocking: without it, "no geometry beats random
        on rank" is an unfalsifiable constant.
    - metric: >-
        P6 -- PLANTED RANK-DEFICIENT NEGATIVE CONTROL: a base with two duplicated
        elements. UNITS: dimensionless
      direction: different
      minimum_effect: >-
        FORCED kappa = infinity within the declared row budget. A pipeline that
        cannot detect a rank deficiency it was handed cannot report kappa_random.
    - metric: >-
        P7 -- fitted log-log slope of measured total relation-collection cost
        against log N, per geometry, at a matched B-rule. UNITS: dimensionless
        exponent
      direction: different
      minimum_effect: >-
        PREDICTED IDENTICAL ACROSS GEOMETRIES within one Holm-corrected interval,
        with intercept ratios confined to the interval whose lower end is set by
        the recorded coverage collapse and whose upper end is 1.582. A slope
        difference whose interval excludes 0 falsifies the ledger central claim
        that geometry enters only as a bounded constant, and the F3 family is
        ALIVE. THE REQUIRED RUNG COUNT FOR A STATED SEPARATION IS COMPUTED AND
        REPORTED BEFORE THE FIT, so "identical slopes" is not confused with
        "underpowered".
    - metric: >-
        P8 -- symbolic reproduction of the two ledger optima with their
        optimising B and their constants. UNITS: exact expressions
      direction: different
      minimum_effect: >-
        FORCED EXACT, including 3 (3N)^{2/3} and 2 sqrt(6N). Failure means the
        ledger is mis-derived and nothing downstream stands.
    - metric: >-
        P9 -- CURVE-FREE NULL: the identical kappa and coverage measurement in an
        abstract cyclic group of prime order N with an abstract base of the same
        size, containing no curve and no group law beyond addition. UNITS: as
        above
      direction: different
      minimum_effect: >-
        MEASURED AND REPORTED BESIDE EVERY CURVE ARM, with no predicted value.
        BLOCKING FOR ATTRIBUTION: conservation, the coverage bound and the
        kappa >= 1 bound are all group-theoretic, so the curve-free null is
        expected to reproduce them. When it does, the closure is a statement
        about factor-base geometry in finite abelian groups and NOT about
        elliptic curves or the ECDLP, and every artifact must say so in its own
        words.
    - metric: >-
        P10 -- closed-form total check per cell: the sum of the fibre-size vector
        against binomial(B_eff + m - 1, m). UNITS: integer
      direction: different
      minimum_effect: >-
        FORCED deviation exactly 0 with integer counters, on every cell.
        Effective size after negation collapse is used in every denominator,
        because a silent x-collision changes mu and therefore the envelope.
  test_boundary:
    instances:
      - 'generated prime-order curves at N about 2^12, 2^14, 2^16, 2^18, 4 curves and 4 seeds per rung'
      - 'a matched random base at identical negation-collapsed effective size, drawn in the same invocation'
