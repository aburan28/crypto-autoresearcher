  statement: >
    Fix the exact two low bits of the
    {0,...,p-1} lift of affine x of
    one frozen toy before any Gamma
    orbit, Semaev S_m, nested LHW
    generator, pairing, Miller, Tate,
    or unary-closure census is built.
    Stage 0 asserts only that on REAL
    p=19, A=1, B=-1, P=(2,3) one has
    [2]P=(16,11), r=2 mod 4 = 2 and
    r'=16 mod 4 = 0, and that the
    nearby KF invariance claim r'=2
    is false. NULL empty residue
    rejected. Infinity has no affine
    x and is rejected. This is not
    two bits of y (fa01b7), not
    chi_2(x) (d76b38), not 84755b P5
    translation bits, not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260913-6011b8 Stage 0 hard
    gate is the exact residue map
    r = x_Z mod 4 of the complete
    residue lift of affine x at P and
    at [2]P. Form [2]P by affine
    doubling, then reduce each lifted
    x modulo 4. Stage 0 freezes that
    identity as exact tables. No
    Gamma orbit. No Semaev S_m. No
    nested LHW. No Miller. No Tate.
    No unary-closure census. This is
    a new GOAL-ECDLP-001 object after
    P-S0-CHI2X. It is not Stage 1 of
    EXP-ECDLP-827d70 and not Stage 1
    of EXP-ECDLP-fc8954.
  predictions:
    - id: P-S0-XLOW2
      metric: well-defined 2-bit x-lift residue identity on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL r
        equals 2 and r' equals 0, and
        KF invariance claim r'=2 is
        rejected. NULL empty residue
        is rejected. Infinity is
        rejected as having no affine
        x. One certified miss after
        fixture_pass is a scoped
        falsification of this
        instrument at the frozen
        toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        r'=2 is accepted as a generic
        doubling-residue target. An
        encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        fails to match r=2 or r'=0.
        That falsifies only
        P-S0-XLOW2 at the frozen toy.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      real_curve:
        p: 19
        A: 1
        B: -1
        P: [2, 3]
        P2: [16, 11]
        must_r: 2
        must_r_prime: 0
