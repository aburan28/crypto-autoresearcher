  statement: >
    Fix one synthetic 3-block positive CNF on six
    variables a0,a1,b0,b1,c0,c1, frozen before any
    Aut is read. Stage 0 asserts only the instrument
    prediction of IDEA-20260905-a94b5f on this
    family: (i) REAL3 has |Aut|=6 and the six
    permutations are exactly the block interchange
    S_3; (ii) KF3, REAL3 plus (a1 ∨ b1 ∨ c1), has
    |Aut|=12 = 2·3! because the simultaneous bit-swap
    is an extra automorphism; (iii) NULL3 has
    |Aut|=1; (iv) an empty CNF or a two-block map
    is rejected before |Aut| is read as an m=3
    census. This is not BreakID, not saucy, not
    cadical, not a torsion-invariant factor base,
    and not Stage 1. Neither reading is a decoder
    or an ECDLP advantage.
  mechanism: >
    The syntactic automorphism group of a CNF is
    the set of variable permutations that map the
    clause set to itself. Stage 0 evaluates that
    distinction by brute force on one frozen
    6-variable family: the real block-symmetric
    system has Aut = S_3, the known-false system
    that plants a bit-swap must have order 2·m!,
    and the matched null that breaks every swap
    has order 1. This is a new RQ-ECDLP-002 object
    after Stage 0 of EXP-ECDLP-628891 held as
    P-S0-DELIM (DEC-20260908-ef29b5). It is not
    Stage 1 of EXP-ECDLP-628891, not Stage 1 of
    EXP-ECDLP-9e9536, not Stage 1 of
    EXP-ECDLP-90f602, and not Stage 2 of
    EXP-ECDLP-4be480.
  predictions:
    - id: P-S0-AUT
      metric: well-defined brute-force Aut order on the frozen family
      direction: different
      minimum_effect: >
        After fixture_pass, REAL3 has |Aut|=6 and
        the six images are the committed S_3 block
        interchanges. KF3 has |Aut|=12. NULL3 has
        |Aut|=1. Empty and two-block objects are
        rejected. One certified miss after
        fixture_pass is a scoped falsification of
        this instrument on the frozen family.
      claim_tier: observational
    - id: P-S1-BREAKID
      metric: BreakID/saucy group on a pdp CNF
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0 does
        not run BreakID or saucy and does not
        claim a pdp encoder or a torsion-invariant
        factor base.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFEXTRA
      statement: >
        After fixture_pass, KF3 fails to have
        |Aut|=12. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALORDER
      statement: >
        After fixture_pass, REAL3 has |Aut| other
        than 6 or the generators are not the
        committed S_3 images. That falsifies only
        P-S0-AUT on this family.
    - id: F-S1-BREAKID
      statement: >
        After an authorized later stage, a claimed
        BreakID generator is not a clause-set
        automorphism. Unauthorized here.
  test_boundary:
    instances:
      - frozen Stage 0 REAL3 / KF3 / NULL3 panel
    parameters:
      m: 3
      l: 2
      n_vars: 6
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-79f8c4 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is a brute-force Aut
      instrument on one 6-variable 3-block CNF.
      It is not BreakID, not saucy, not cadical,
      not a torsion-invariant V, not the Trimoska
      pdp encoder, not Stage 1 of EXP-ECDLP-628891,
      not Stage 1 of EXP-ECDLP-9e9536, not Stage 1
      of EXP-ECDLP-90f602, and not Stage 2 of
      EXP-ECDLP-4be480. No cryptographic transfer.
      Do not hunt a new CNF after this freeze.
  assumptions:
    - id: A1
      statement: >
        Adding (a1 ∨ b1 ∨ c1) to the frozen REAL3
        makes the simultaneous bit-swap an
        automorphism, so |Aut|=12. An argument
        that assigns KF3 |Aut|=6 proves too much.
      status: explicit
    - id: A2
