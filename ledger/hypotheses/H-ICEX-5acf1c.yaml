hypothesis:
  id: H-ICEX-5acf1c
  question_id: RQ-ICEX-001
  source_idea_id: IDEA-20260807-32f96d
  title: >-
    THE ARITY AXIS IS EMPTY AND THE SOURCE DISCRIMINATOR CANNOT FIRE- comparing an
    m = 4 exponent CI against the committed m = 3 value 2.074 is impossible
    because that value carries a 90 percent CI of [1.565, 2.621], half-width 0.53,
    wider than the entire 0.52 shift the cost model predicts; so the test is
    restated as a PAIRED MATCHED-INSTANCE COST RATIO between m = 4 and m = 3 on the
    SAME curves at the SAME field size, whose two competing explanations sit two
    orders of magnitude apart, with the censoring frontier as the primary
    deliverable because every m = 4 cell in the corpus is censored
  statement: >-
    (A) WHAT THE COMMITTED RECORDS SAY, QUOTED. FINDING-PF-IC-001 gives the cost
    model total IC cost approximately ell^{(1+gamma)/m}, DECREASING in m, and
    dismisses large m informally with the parenthetical that the Semaev polynomial
    degree grows doubly-exponentially in m. EV-R6-001 records in its own
    boundaries, VERBATIM- the m = 4 arm was censored entirely and no m = 4
    measurement exists in that evidence; and in its observations, VERBATIM- the
    m = 4 six-variable arm was fully censored, with even F = 6 at ell about 2^10.5
    exceeding 300 seconds. Under AGENTS.md rule 5 those are infrastructure
    signals, NOT evidence about m = 4. So the competing informal obstruction has
    never been converted into a measurement.
    (B) THE BAND DEFECT IN THE SOURCE, COMPUTED HERE BEFORE ANYTHING IS DESIGNED.
    The source pre-registers as its discriminator -any value at m = 4 with a CI
    that excludes the m = 3 value-. The committed m = 3 value is alpha = 2.074
    with bootstrap 90 percent CI (1.565, 2.621), i.e. HALF-WIDTH 0.53. The effect
    the cost model predicts, if gamma were m-independent, is
    (1+gamma)/3 - (1+gamma)/4 = (1+gamma)/12, which at gamma = 5.2 is 0.52. AN
    INDEPENDENT m = 4 EXPONENT FIT WOULD NEED ITS OWN INTERVAL, AND EXCLUSION
    WOULD REQUIRE A SHIFT EXCEEDING ROUGHLY 1.0 IN EXPONENT - about twice the
    entire predicted effect. THE DISCRIMINATOR CANNOT FIRE. It is not a
    conservative test; it is a test whose alternative cannot cross it.
    (C) THE REPLACEMENT, WITH ITS DYNAMIC RANGE COMPUTED. The discriminator
    becomes the PAIRED RATIO
        R(ell) = charged cost per target at m = 4 / charged cost per target at
                 m = 3,
    measured on the SAME curves, the SAME ell, the SAME solver, the SAME seeds and
    the SAME cost convention, so that per-instance variance cancels rather than
    being estimated twice. Under the source cost model with gamma m-independent,
    R(ell) = ell^{(1+gamma)(1/4 - 1/3)} = ell^{-(1+gamma)/12}, which at
    ell = 2^10.5 and gamma = 5.2 is about 2^{-5.4}, i.e. about 0.024. Under the
    competing degree-growth explanation R is much greater than 1. PRE-REGISTERED
    BANDS- R below 1/3 reads as the 1/m gain dominating; R above 3 reads as degree
    growth dominating; R between 1/3 and 3 is INCONCLUSIVE at that ell and is
    reported as such. The two explanations sit about two orders of magnitude apart
    inside a band of width one order, so the alternative genuinely moves the
    statistic outside it.
    (D) THE PRIMARY DELIVERABLE, WHICH IS NOT THE RATIO. Because every m = 4 cell
    in the corpus is censored, the primary deliverable is THE CENSORING FRONTIER-
    the largest (m, F) that completes within a declared per-cell budget, with each
    censored cell recorded as a ONE-SIDED BOUND R > budget / cost_m3, which is
    itself an admissible datum. TOTAL CENSORING AT m = 4 IS AN INFRASTRUCTURE
    RECEIPT AND IS NOT EVIDENCE ABOUT THE ARITY AXIS IN EITHER DIRECTION.
    (E) WHAT THIS DOES NOT DO. It does not adjudicate the EXP-ICEX-146ff5 routing
    dispute. It does not decide RQ-ICEX-001. Even a favourable arity trend leaves
    index calculus far above rho at these sizes, and nothing here claims otherwise.
  mechanism: >-
    THE TRACKED OBJECT. The charged per-target exponent as a function of arity,
    projected from the whole decomposition pipeline onto one scalar per arity.
    The source record is candid that this is a WEAK object and this hypothesis
    agrees- a scalar per arity cannot support a mathematical claim, only a cost
    one, which is why the class is measurement and why the arm is paired.
    WHY THE PAIRED FORM IS THE FIX RATHER THAN A COSMETIC CHANGE. Two independent
    exponent fits estimate the instance-to-instance and curve-to-curve variance
    twice and then subtract two intervals, so their difference carries the sum of
    both. A paired ratio on the SAME instance holds the curve, the field size, the
    target and the seed fixed, so every source of variation common to the two
    arities cancels exactly. The remaining variance is the arity-specific solve
    variation alone, which is what the question is about.
    THE ONE-STEP PROPAGATION, EXACT AND OPPOSED. Incrementing m raises the Semaev
    polynomial degree to 2^{m-2} and lowers the exponent denominator by one step.
    Both are exact and they act in opposite directions; the measurement asks which
    wins on this solver stack at these sizes. That is a cost question about an
    implementation, not a mathematical question about elliptic curves, and the
    record says so.
    WHY A CURVE-FREE NULL IS REQUIRED. EV-R6-001 records, VERBATIM, that
    support-matched nulls cost about 1.3 to 1.5 times the real membership systems
    with the SAME scaling at m = 3 - the real systems track the null. A
    support-matched null is a polynomial system with no curve in it. If the m = 4
    real-versus-null cost ratio also sits near 1.3 to 1.5, THE ARITY RESULT IS A
    STATEMENT ABOUT THE SIZE AND SHAPE OF THE POLYNOMIAL SYSTEM AND NOT ABOUT
    ELLIPTIC CURVES OR THE ECDLP, and that consequence is pre-stated here.
  assumptions:
    - >-
      The Groebner backend can complete at least one m = 4 cell at some (p, B)
      inside the declared budget. IF IT CANNOT AT ANY SETTING THAT IS THE RESULT-
      the obstruction is instrumental rather than mathematical, and the record
      says so and does not convert it into a statement about arity.
    - >-
      The counting heuristic can be matched across m by choice of B, so that the
      arms are compared at matched expected decomposition yield rather than at
      matched B.
    - >-
      COST UNIT. Charged cost is counted in GROUP-OPERATION EQUIVALENTS with the
      conversion for algebraic solver work declared and frozen before the run, and
      is ALSO reported as raw solver operation counts. WALL-CLOCK SECONDS ARE THE
      BUDGET AND THE CENSORING VARIABLE ONLY and never enter the paired ratio- both
      sides of R carry the same unit.
    - >-
      The Groebner engine, the monomial order and the extraction method are PINNED
      AND RECORDED, because engine choice and monomial order change the solving
      degree materially.
    - >-
      The decomposition stage is reported SEPARATELY from the total, because
      matching the counting heuristic across m changes B, which changes the
      linear-algebra stage.
  proof_search_map:
    not_applicable_reason: >-
      Empirical cost measurement of an axis the cost model already asserts
      monotonicity on. No theorem, bound, certificate family, reduction or closure
      argument is proposed. The one derivation performed - the predicted paired
      ratio ell^{-(1+gamma)/12} and the band-degeneracy computation in statement
      (B) - is arithmetic within the source cost model, done to SIZE A BAND before
      compute rather than to claim anything. Recorded rather than omitted per
      docs/inventor-protocol.md section 8.
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-ARITY-1
      formal_statement: >-
        FOR THE TESTED SOLVER STACK AND THE TESTED ell, the SIGN of the paired
        m = 4 over m = 3 cost ratio is the same as at larger ell - that is, if
        degree growth dominates at toy ell it dominates at larger ell, and
        conversely.
      random_model_justification: >-
        NONE THAT IS RIGOROUS, STATED PLAINLY. FINDING-PF-IC-001 asserts
        monotonicity in m without any measurement above m = 3. The heuristic here
        is weaker than that assertion- it claims only sign stability, not
        magnitude - and it is recorded as an assumption rather than presented as a
        consequence of the model.
      supporting_results:
        - ref: FINDING-PF-IC-001
          provenance: internal
          claim: >-
            VERBATIM- the per-PDP cost model with gamma in [4.57, 5.86] at 90
            percent CI, total IC cost approximately ell^{(1+gamma)/m} with total
            exponent 2.05 and 90 percent CI [1.86, 2.29] at m = 3; and the
            informal dismissal of large m, VERBATIM- minimized at large m, but the
            Semaev polynomial degree grows doubly-exponentially in m.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED. The
            statement, invariance table, informal-argument and scope sections were
            read verbatim (lines 1 to 711 of 2777). The later versioned extension
            sections were NOT read and nothing from them is relied on.
        - ref: EV-R6-001
          provenance: internal
          claim: >-
            VERBATIM- total cost exponent alpha per target 2.074 with bootstrap 90
            percent CI (1.565, 2.621) over n = 110 targets; rho exponent 0.4988
            with CI90 (0.4813, 0.5161); d_reg median 2.0 flat across all cells;
            support-matched nulls costing about 1.3 to 1.5 times the real systems
            with the same scaling; and the boundary that the m = 4 arm was
            censored entirely with no m = 4 measurement existing in that evidence,
            even F = 6 at ell about 2^10.5 exceeding 300 seconds.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - EV-R6-001 read in full this task,
            77 lines; every quoted figure is verbatim.
      validation_experiment_ids:
        - EXP-ICEX-b02f77
      falsification_condition: >-
        The paired ratio R crosses the band in opposite directions at two tested
        ell within the same arity pair. Then the sign is not stable even across
        the tested range and no directional statement about arity may be made.
    - id: HEUR-ARITY-2
      formal_statement: >-
        The support-matched null cost ratio measured at m = 3 - about 1.3 to 1.5
        times the real system with the same scaling - persists at m = 4, so the
        arity behaviour is a property of polynomial-system size and shape rather
        than of the curve.
      random_model_justification: >-
        The null is constructed to match the real system support and dimension, so
        under the hypothesis that Groebner cost is governed by system shape the
        ratio should be a constant near 1. EV-R6-001 measured it at 1.3 to 1.5 at
        m = 3 across three cells. This is the standard matched-null imitation and
        is exactly what the curve-free arm re-tests one arity higher.
      supporting_results:
        - ref: EV-R6-001
          provenance: internal
          claim: >-
            VERBATIM- support-matched nulls cost about 1.3 to 1.5 times the real
            membership systems with the same scaling, and the control outcome
            records null GB times 1.80, 5.91 and 14.49 seconds against real 1.43,
            4.16 and about 9.9 seconds at F = 12, 14 and 16.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - read in full this task, 77 lines.
      validation_experiment_ids:
        - EXP-ICEX-b02f77
      falsification_condition: >-
        The m = 4 real-over-null cost ratio departs from [1.0, 2.0]. Then
        something arity-specific and not system-shape-specific is acting, and the
        curve-free reading no longer applies at m = 4 - which is itself the more
        interesting outcome and must be reported as such.
  structural_ingredients:
    - description: >-
        The cost model whose monotonicity in m is asserted and never measured
        above m = 3, and the informal degree-growth obstruction it offers against
        large m.
      citation: FINDING-PF-IC-001
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (lines 1 to
        711 of 2777).
      role: the assertion this record converts into a measurement
    - description: >-
        The committed m = 3 anchor, its bootstrap CI, its d_reg floor, its
        support-matched null ratio, and its explicit record that every m = 4 cell
        was censored.
      citation: EV-R6-001
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 77 lines.
      role: >-
        blocking m = 3 regression fixture, the source of the band-degeneracy
        computation, and the prior on censoring
    - description: >-
        The arity-threshold cost-model contract the source proposal names as the
        nearest record. ITS STATUS IS approved_execution_withheld, NOT a routing
        deadlock as the source characterises it; the source description of a
        three-decision deadlock is a READING and is not adopted here.
      citation: EXP-ICEX-146ff5
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - status field read directly this task.
        The three cited decisions DEC-20260805-bb162b, DEC-20260806-8f7e4f and
        DEC-20260806-e91b0f were NOT opened by this agent and their quoted content
        is RELAYED from the source proposal, not verified.
      role: >-
        the adjacent model contract this measurement is deliberately distinct
        from; no part of its dispute is adjudicated here
  reduction_chain:
    core_problem: >-
      The paired charged-cost ratio between arity 4 and arity 3 on matched
      prime-field instances at toy scale, and the censoring frontier of the arity
      axis on this solver stack.
    corollaries:
      - problem: >-
          The direction of the arity term in the ICEX cost model, currently
          asserted monotone and never measured above m = 3.
        reduction_ref: >-
          Internal- the cost model is this repository own accounting. No published
          reduction is cited.
        asymptotics_preserved: >-
          Not applicable. No attack and no asymptotic improvement is claimed in
          either direction.
  predictions:
    - metric: >-
        P1- paired ratio R(ell) = charged cost per target at m = 4 divided by
        charged cost per target at m = 3, same curve, same ell, same solver, same
        seed, same unit (dimensionless)
      direction: different
      minimum_effect: >-
        R below 1/3 reads as the 1/m gain dominating; R above 3 reads as degree
        growth dominating; R in [1/3, 3] is INCONCLUSIVE at that ell. DERIVED
        REFERENCE- under the cost model with gamma m-independent,
        R = ell^{-(1+gamma)/12}, about 0.024 at ell = 2^10.5 and gamma = 5.2. The
        two competing explanations are about two orders of magnitude apart across
        a band one order wide, so the alternative moves the statistic outside it.
    - metric: >-
        P2- the censoring frontier- the largest F at each m in {3, 4, 5} that
        completes within the declared per-cell wall-clock budget
      direction: different
      minimum_effect: >-
        REPORTED, NOT THRESHOLDED. This is the primary deliverable. Every censored
        cell is recorded with its budget, its partial progress and the ONE-SIDED
        BOUND R > budget / cost_m3 at that ell. A censored inventory that is empty
        at m = 5 should be treated as SUSPICIOUS rather than as success.
    - metric: >-
        P3- m = 3 regression against the committed anchor- fitted alpha and d_reg
        median at F in {12, 14, 16}
      direction: different
      minimum_effect: >-
        Fitted alpha inside the committed CI90 [1.565, 2.621] and d_reg median
        2.0. A miss means this solver stack is not the one that produced the
        committed anchor and NO m = 4 number is admissible.
    - metric: >-
        P4- solving degree at m = 4 against the 2^{m-2} scaling
      direction: different
      minimum_effect: >-
        A measured degree differing from the 2^{m-2} prediction at more than one
        (p, B) cell. Reported with the engine and monomial order named, because
        both change the solving degree materially.
    - metric: >-
        P5- curve-free control- real over support-matched-null charged cost ratio
        at m = 4, against the committed m = 3 value of 1.3 to 1.5
      direction: different
      minimum_effect: >-
        PRE-STATED CONSEQUENCE. If the m = 4 ratio also lies in [1.0, 2.0], the
        arity result is a statement about polynomial-system size and shape and
        MAY NOT BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP. A
        ratio outside [1.0, 2.0] at m = 4 is the curve-specific content and is the
        interesting outcome.
    - metric: >-
        P6- matched rho control on the identical instances
      direction: different
      minimum_effect: >-
        Fitted rho exponent inside the committed CI90 (0.4813, 0.5161) with all
        recoveries exact. Every arity number is reported as a RATIO TO RHO on the
        same instances and never in isolation. If index calculus at the best m is
        still above rho at every size - which is the expected outcome - THAT IS
        THE HEADLINE.
  test_boundary:
    instances:
      - >-
        Toy prime-field short-Weierstrass curves at three ell values in the
        neighbourhood of the committed cells, with B tuned per m so the counting
        heuristic is matched across arities.
      - >-
        The committed m = 3 anchor cells at F in {12, 14, 16}.
      - >-
        CURVE-FREE ARM- support-matched random polynomial systems of the same
        dimension and support as the membership systems, at each m, containing no
        curve equation.
    parameters:
      m: '3, 4, 5'
      ell: 'three values, chosen so that the committed anchor cells are included'
      B: 'tuned per m to match the counting heuristic; recorded per cell'
      engine: 'pinned and recorded, with the monomial order and extraction method'
      per_cell_budget: '3600 wall-clock seconds, declared before the run'
      seeds: 'shared across arities so the ratio is paired'
    implementation: >-
      One decomposition harness parameterised by arity, with ONE charged-operation
      counter, ONE wall-clock censoring rule and ONE reporting path shared by the
      m = 3 arm, the m = 4 arm, the m = 5 arm, the curve-free null arm and the rho
      control. An arm with its own counter is not comparable and is not built.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 40.0
      maximum_memory_gb: 16
      maximum_runs: 60
  falsification_conditions:
    - >-
      F1. The paired ratio R sits above 3 at every completing ell. The informal
      degree-growth obstruction is CONFIRMED BY MEASUREMENT at tested scope and
      becomes a genuine closure at the docs/inventor-protocol.md section 4
      standard, with the obstruction recorded as a measured quantity.
    - >-
      F2. The paired ratio R sits below 1/3 at every completing ell and the trend
      continues at m = 5. The one monotone-improving direction in this program own
      cost model is NOT closed at tested scope and the standing negative scope
      must be restated. This is the most consequential available outcome and
      requires independent review before any description.
    - >-
      F3. R lies in [1/3, 3] at every completing ell. INCONCLUSIVE at tested
      scope, reported plainly as such, with the achieved precision stated.
    - >-
      F4. No m = 4 cell completes at any setting within budget. AN INSTRUMENTAL
      OBSTRUCTION, recorded as an infrastructure receipt under AGENTS.md rule 5,
      NEVER as a mathematical obstruction and never as evidence that large m is
      closed.
    - >-
      F5. The m = 3 regression misses the committed CI or the d_reg median. This
      stack is not the one that produced the anchor; no m = 4 number is
      admissible.
    - >-
      F6. The matched rho control misses its committed exponent CI. INSTRUMENT
      FAILURE- the run is INVALID rather than negative.
    - >-
      F7. The m = 4 curve-free ratio lies in [1.0, 2.0]. Then the arity result is
      about polynomial-system shape and NOTHING HERE IS AN ELLIPTIC-CURVE OR ECDLP
      STATEMENT.
  interpretation_limits:
    - >-
      TOY SCALE. A measured crossover at toy sizes DOES NOT LOCATE THE CROSSOVER AT
      CRYPTOGRAPHIC SIZES. THE CROSSOVER ARITY AT CRYPTOGRAPHIC ell IS NOT TESTABLE
      AT ANY SCALE THIS PROGRAM CAN REACH- the Semaev polynomial degree at m = 5
      already exceeds what the host completes at toy ell. Stated here rather than
      the claim being quietly shrunk to whatever completed.
    - >-
      CENSORING IS NOT RANDOM. It correlates with exactly the cells that would
      decide the question, and that correlation must be stated in any conclusion
      drawn from the completing cells.
    - >-
      A timeout, crash or memory exhaustion is an infrastructure receipt under
      AGENTS.md rule 5 and is never a negative mathematical result about arity.
    - >-
      This record does NOT adjudicate the EXP-ICEX-146ff5 dispute. That contract
      status is approved_execution_withheld; the source proposal characterisation
      of a three-decision routing deadlock is a reading this record neither adopts
      nor contests, and the three decisions it cites were not opened by the author.
    - >-
      Even a favourable arity trend leaves index calculus far above rho at these
      sizes. Every arity number is reported as a ratio to rho on the same
      instances, and the expected headline is that the best m is still above rho.
    - >-
      Both sides of the paired ratio carry the SAME unit. Wall-clock seconds are
      the budget and censoring variable only and never appear in the ratio.
    - >-
      claim_tier toy. No attack, no exponent moved, sota_delta zero. Dominated by
      Pollard rho at exponent 1/2 on every row.
