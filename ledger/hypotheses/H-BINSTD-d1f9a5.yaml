# =============================================================================
# H-BINSTD-d1f9a5 -- DP-pool vs uniform vs HW-filter-only Semaev relation
# yield at toy Koblitz scale (Bailey HW-DP byproduct composition).
# Specified and approved under DEC-20261001-707505 from
# IDEA-20260922-6237e5 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. IDEA-20260922-6237e5 claim text is not
# edited (proposals immutable). Class: heuristic_validation / composition
# measurement. No exponent. No break. No n=131 transfer claimed.
# =============================================================================
hypothesis:
  id: H-BINSTD-d1f9a5
  question_id: RQ-BINSTD-b6f698
  related_question_ids: []
  source_idea: IDEA-20260922-6237e5
  experiment_id: EXP-BINSTD-a3cfee
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-707505
  proposed_by: coordinator
  title: >-
    Toy null-controlled test: does a Bailey-style HW(x)<=c distinguished-point
    pool enrich Semaev m=2,3 relation yield vs size-matched uniform and
    HW-filter-only pools?

  statement: >-
    SETTING. KN-LIT-661e97 documents the unfinished public ECC2K-130 rho
    campaign: Frobenius-power walk P_{i+1}=sigma^j(P_i) XOR P_i with
    j=((HW(x)/2) mod 8)+3, distinguished-point filter HW(x)<=34 in type-2
    normal basis, ~2^25.27 iterations per DP, ~2^33.1 DPs collected at
    2^58.3 iterations. A hybrid rho+index-calculus campaign might hope to
    harvest Semaev relations from that DP byproduct "for free".

    CLAIM (measurement). At toy Koblitz fields n in {17,23} (and optional
    second cutoff), run the SAME unmodified F2 Semaev relation search
    (m=2, then m=3) on three equal-size pools: (A) walk-sourced DP pool,
    (B) uniform-random curve points, (C) HW-filter-only rejection samples
    (same cutoff, no walk). Pre-registered null (HEUR-H1 / H_null): pairwise
    yield-rate ratios in [0.7, 1.4]. A ratio outside that band, replicated
    at a second independently seeded cell of the same size, is H_alt
    (surprising enrichment or deficit).

    CLAIM TIER: observational / heuristic_validation at toy scale.
    NO exponent move. NO break. NO transfer to n=131. Replay cost for
    walk coefficients is MEASURED and charged separately — not assumed
    free (KN-LIT-661e97 ~2^25.27 iters/DP at n=131; toy analogue measured
    directly).

  statement_note: >-
    IDEA-20260922-6237e5 claim text is immutable and left at status
    proposed. This hypothesis freezes the three-arm discriminator, HEUR
    id, certificate.kind vocabulary, and Stage 0-2 boundary for
    EXP-BINSTD-a3cfee.

  mechanism: >-
    OBJECT FRAME (from source IDEA). Representation R1: x-coordinate in a
    normal-basis representation of F_{2^n} so HW is well-defined
    analogously to KN-LIT-661e97 Section 3. Operation set Sigma:
    translation by factor-base elements — the EXISTING F2 Semaev relation
    search — applied to three differently-sourced input pools. No new
    Sigma; no new factor-base class. Trichotomy: Class I partial-action
    (identical to other F2 lines); what varies is the SAMPLING
    DISTRIBUTION. Lossy-projection test: not applicable (no new group
    projection). KN-OPEN-020: target-independent explicit finite listed
    sets (sampling procedure), already inside this program's F2 usage.
    OFF-LIMITS: F1 (rho) is the DATA SOURCE only, never the tracked
    attack object; F2 is the relation-search family under test as applied
    to DP vs control pools.

  assumptions:
    - >-
      A toy replica reproduces the MECHANISM (Frobenius-power walk step +
      HW cutoff in a normal basis) of KN-LIT-661e97 Section 3, not the
      numeric constants HW<=34 or DP density 2^-25.27; relative DP density
      vs sqrt(group order) is matched approximately at the toy n.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F1 as data source; F2 as relation
      search. No new escape from KN-OPEN-020 claimed.
    - >-
      Replay cost is charged at measured walk iterations to each
      contributing DP — not assumed free.
    - >-
      Toy disagreement or agreement is NOT extrapolated to n=131
      (interpretation_limits).
    - >-
      Uniform-arm yield must match the standard |F|^m/(m! * N) heuristic
      within sampling error before DP-arm results are trusted
      (instrument control).

  proof_search_map:
    bottleneck: >-
      Whether Semaev relation-yield rate on a DP pool differs from a
      size-matched uniform pool by more than sampling noise at toy scale.
    baseline_embedding:
      parameter_slice: >-
        Uniform-random pool arm IS the baseline every other F2 line uses
        when sampling a factor base — no walk, no DP filter.
      reproduction_check: >-
        At the smallest cell (n=17 or n=23, m=2), uniform-arm yield must
        match |F|^m/(m!*N) within sampling error; mismatch → instrument
        defect before trusting DP arm.
    observation_collision:
      observable: >-
        Relation-yield rate (valid Semaev relations per pool) at fixed m
        and pool size N, measured on DP, uniform, and HW-filter-only arms.
      distinct_preimage_search: >-
        Same DP/uniform ratio could arise from genuine walk correlation
        (H_alt) or from a mis-tuned toy cutoff (density artifact). Control:
        vary cutoff across an order-of-magnitude DP-density range; stable
        ratio supports H_alt reading, density-scaling supports artifact.
        HW-filter-only arm separates filter-alone vs walk-structure.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Matched-pair (triple) measurement: DP / uniform / HW-filter-only
          pools of equal size, same toy curve, same F2 search, same arity,
          single instrumented harness so engine/field arithmetic/target
          selection are held fixed.
        predicted_gain: >-
          Isolates sampling-source effect; removes engine confounds from
          the DP-vs-random comparison.
    quantifier_order: >-
      EXISTS toy (n,m,cutoff) cells at which DP and uniform yields are
      measured; PREDICTED (H_null): FORALL tested cells, pairwise ratios
      in [0.7,1.4]. No forall/exists claim about n=131.
    method_ceiling:
      strongest_certifiable_claim: >-
        At tested toy cells, DP-pool yield is [equal to / different from]
        uniform (and/or HW-filter-only) by measured factor with named
        two-sample test. Cannot certify n=131, m>3, or that replay
        overhead makes any enrichment practically useful.
      nearby_object_control: >-
        HW-filter-only rejection-sampled pool (same cutoff, no walk)
        isolates filter from walk; second field size and second cutoff
        check density-scaling artifacts.
    proof_obligations:
      - claim: Toy walk step + DP cutoff reproduce KN-LIT-661e97 Section 3 mechanism (not numeric constants)
        responsibility: baseline
      - claim: Uniform-arm yield matches |F|^m/(m!*N) within sampling error
        responsibility: baseline
      - claim: Every counted relation re-verified by direct curve arithmetic
        responsibility: correctness
      - claim: Replay cost charged at measured iterations-to-DP, not assumed free
        responsibility: runtime
      - claim: HW-filter-only arm reported separately from walk-sourced DP arm
        responsibility: scope
      - claim: No n=131 transfer / no exponent / no break claim
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      ECDLP on ECC2K-130 — whether rho DP byproduct enriches index-calculus
      relation supply (RQ-BINSTD-b6f698 composition seam)
    prior_best: >-
      Pollard rho 2^60.9 (KN-LIT-096); public progress 2^58.3 iterations /
      ~2^33.1 DPs (KN-LIT-661e97)
    time_exponent: n/a
    memory_exponent: n/a
    hidden_cofactor: >-
      Replay cost per contributing DP (explicitly charged; not hidden)
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-d1f9a5-H1
      formal_statement: >-
        (H_null.) Under the curve's point distribution on the tested toy
        Koblitz cells, the Hamming-weight-in-normal-basis statistic of
        x(P) and the event that x(P) participates in a fixed low-arity
        Semaev relation over a fixed explicit factor base are
        asymptotically independent, so E[yield_DP] = E[yield_uniform] =
        E[yield_HW_filter_only] at matched pool size N; pairwise ratios
        fall in [0.7, 1.4] with high probability under the pre-registered
        sample plan.
      random_model_justification: >-
        Bit-representation statistic (HW in a fixed basis) and algebraic
        root structure of a low-degree summation polynomial are generically
        unrelated absent a structural reason; classical independence
        heuristic, not a proved theorem — stated as HEUR for that reason.
        Interpolates: rigorous certificate re-verification of each relation
        (correctness) + standard |F|^m/(m!*N) random-model baseline for
        the uniform arm.
      supporting_results:
        - KN-LIT-661e97 DP protocol and progress table (internal)
        - IDEA-20260922-6237e5 H1 / H_null statement (internal)
        - Standard |F|^m/(m!*N) relation-yield heuristic used across F2 corpus (internal)
      validation_experiment_ids:
        - EXP-BINSTD-a3cfee
      falsification_condition: >-
        Pairwise yield-rate ratio outside [0.7, 1.4] at one toy cell AND
        replicated at a second independently seeded cell of the same size
        (with certificates intact and uniform-arm baseline OK) → H_alt;
        single-cell excursion without replication → noise, not H_alt.

  structural_ingredients:
    - description: >-
        Bailey et al. ECC2K-130 rho campaign: seed scheme, Frobenius-power
        walk, HW<=34 DP filter, ~2^25.27 iters/DP, ~2^33.1 DPs at 2^58.3
        iterations
      citation: KN-LIT-661e97
      provenance: internal
      verified_by: >-
        coordinator (knowledge/literature/KN-LIT-661e97.md present; source
        IDEA verified_by idea-generator full read; this session cites entry
        path, does not re-open primary paper PDF)
      role: DP protocol under composition; replay-cost figure
    - description: Rho baseline 2^60.9 iterations for ECC2K-130
      citation: KN-LIT-096
      provenance: internal
      verified_by: >-
        coordinator (knowledge/literature/KN-LIT-096.md present; cited via
        KN-LIT-661e97 / source IDEA)
      role: budget reference only; not a measured quantity here
    - description: >-
        Standard F2 Semaev relation-search over explicit finite factor bases
        (target-independent KN-OPEN-020 class)
      citation: RQ-BINSTD-b6f698 / program F2 lines
      provenance: internal
      verified_by: coordinator (mechanism already used in BINSTD/CERTBIN corpus)
      role: unmodified relation-search engine applied to three pools
    - description: >-
        Recalled generic independence of bit-HW filters and low-degree
        algebraic root structure (no specific published citation)
      citation: >-
        Standard heuristic on independence of bit-representation statistics
        and algebraic root structure (recalled; no specific source opened)
      provenance: recalled
      verified_by: null
      role: >-
        motivational pointer for H_null only — NOT used as support; the
        experiment itself is the validation

  reduction_chain:
    core_problem: >-
      Toy-scale distributional comparison of Semaev relation yield on
      DP-sourced vs control pools
    corollaries: []

  predictions:
    - metric: yield_ratio_DP_over_uniform_m2
      direction: same
      minimum_effect: >-
        Ratio in [0.7, 1.4] (H_null); outside band + second-cell replicate
        = H_alt
    - metric: yield_ratio_DP_over_HW_filter_only_m2
      direction: same
      minimum_effect: >-
        Ratio in [0.7, 1.4]; if DP and HW-filter-only agree with each
        other but both differ from uniform, attribute effect to filter
        alone (reportable distinct from walk-structure H_alt)
    - metric: replay_iterations_per_contributing_DP
      direction: higher
      minimum_effect: >-
        No numeric prediction (curve-specific); reported alongside yield
        ratios so finding-rate and realization-cost are never conflated
    - metric: certificate_pass_rate
      direction: exact
      minimum_effect: '1.0 on every counted relation in every arm'

  test_boundary:
    instances:
      - >-
        Stage 0 (zero scientific ECDLP attack trials): implement toy
        Koblitz walk+DP replica with byte-identical seed replay check;
        write preregistered-predictions.yaml and methodological-note.md;
        plan |F|^m/(m!*N) uniform baseline; tune HW cutoff for relative
        DP density — BEFORE Stage 1 yield comparisons
      - >-
        Stage 1: three-arm (DP / uniform / HW-filter-only) m=2 relation
        search at smallest executable cell n in {17,23}, pool size N,
        >=200 relation-search attempts per arm (or N large enough that
        expected relation count >> 1 under |F|^m/(m!*N)); certificates;
        pairwise permutation tests; replay-cost distribution on DP arm
      - >-
        Stage 2: second toy field size and/or second HW cutoff;
        optional m=3; density-scaling control; report whether any
        out-of-band ratio replicates
    parameters:
      field_degrees: [17, 23]
      optional_field_degrees: [31, 41]
      arities: [2, 3]
      pool_size_N: null  # frozen at Stage 0 once cutoff and density chosen
      min_attempts_per_arm: 200
      yield_ratio_band: [0.7, 1.4]
      seeds: [2026100101, 2026100102, 2026100103, 2026100104, 2026100105]
    implementation: >-
      New code under experiments/EXP-BINSTD-a3cfee/implementation/: toy
      Koblitz walk+DP builder (normal-basis HW), three-arm pool sampler,
      F2 Semaev m=2/3 relation search harness with certificate re-verify.
      May reuse existing F2/Semaev helpers from other EXP-* by import or
      copy under write_scope — do not edit foreign EXP records.
    budget:
      wall_clock_seconds: 14400
      memory_gb: 4
      maximum_runs: 40

  falsification_conditions:
    - >-
      Replayed walk does not reproduce recorded trail byte-for-byte →
      instrument defect; no DP-arm result until fixed.
    - >-
      Uniform-arm yield disagrees with |F|^m/(m!*N) beyond sampling error
      → instrument defect, not H_alt.
    - >-
      Yield ratio outside [0.7,1.4] at one cell but not replicated at a
      second independently seeded cell → noise, not H_alt.
    - certificate_pass_rate < 1.0 on any counted relation.
    - Claiming n=131 transfer, exponent move, or break from toy results.

  interpretation_limits:
    - Toy-scale measurement only; no attack on ECC2K-130; no n=131 claim.
    - Even under H_alt, best case is a CONSTANT-FACTOR relation-supply
      bonus on top of ordinary F2 — not exponent-moving (profile A1).
    - Says nothing about recovering Bailey et al. private (s,h) tables.
    - Replay cost is charged; enrichment of finding-rate ≠ free realization.
    - IDEA-20260922-6237e5 remains status proposed (immutable claim text).
    - Design/approval only until Stage 0/1/2 runs exist.
    - Timeout/crash is infrastructure, never negative math evidence.

  distinguishable_outcomes:
    - id: DO-1-null-agreement
      description: >-
        All pairwise ratios in [0.7,1.4] at Stage 1 and Stage 2 cells;
        uniform baseline OK; certificates pass — H_null supported at toy
        scope (closure of this free-lunch composition hope at tested cells).
      next_decision: support_scoped (toy only); document that hybrid
        proposals must not assume DP yield bonus without re-test
    - id: DO-2-halt-enrichment
      description: >-
        Ratio outside [0.7,1.4] replicated at two cells; certificates OK;
        uniform baseline OK — H_alt at toy scope. Attribute to walk vs
        filter using HW-filter-only arm.
      next_decision: refine — quantify constant factor; still no n=131
        transfer without a separate scaled design
    - id: DO-3-filter-only-effect
      description: >-
        DP and HW-filter-only agree; both differ from uniform (replicated)
        — effect attributable to HW filter alone, not Frobenius-power walk.
      next_decision: refine — report filter-alone reading; distinct from
        walk-structure H_alt as originally stated
    - id: DO-4-instrument-defect
      description: >-
        Replay byte-mismatch, or uniform baseline fails |F|^m/(m!*N), or
        certificate failures.
      next_decision: invalidate instrument; repair then re-approve amendment
    - id: DO-5-infrastructure
      description: Timeout/crash/OOM before completion.
      next_decision: failed_infrastructure; checkpoint; never reject_scoped
        on H1 from infra alone

  dominated_by: >-
    CHECKED. As a measurement: no prior corpus record composes this
    named public rho campaign's DP protocol with F2 relation-finding
    under a three-arm null control — not dominated on that composition.
    Against rho itself / any attack-time axis: n/a (no attack claimed;
    predicted outcome H_null has zero cost implication; H_alt at best
    constant factor). Matched Pollard rho on ECC2K-130 (KN-LIT-096 /
    KN-LIT-661e97) remains the attack baseline this does not move.
  sota_delta:
    time: >-
      n/a under predicted H_null; at most unquantified constant factor
      under H_alt, to be measured not asserted.
    memory: n/a; reuses storage any rho campaign already pays for DPs.
    data_queries: >-
      First three-arm (DP / uniform / HW-filter-only) null-controlled
      composition test of KN-LIT-661e97's DP protocol with F2 Semaev
      yield in this program.

  status: approved
  status_history:
