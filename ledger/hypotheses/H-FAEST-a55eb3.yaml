  falsification_conditions:
    - >-
      F1 (PRIMARY, CHEAPEST): max over C of revealed(c) <= T_open at the
      deployed sets. The filter is unreachable, rho = 1, G = 1, (H1)-(H3) all
      fail, and the deliverable is the scoped negative "the bAVC opening
