  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260808-0e9fa1
  proposal_id: IDEA-20260808-0e9fa1
  title: >
    Stage 0 closed-form Semaev-degree
    identities — deg S_{m+1}=2^{m-1} —
    before any hypersurface is
    constructed
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-084482
  specified_by: DEC-20260913-a99171
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260808-0e9fa1
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form Semaev-degree
    identities of IDEA-20260808-0e9fa1
    before any summation polynomial is
    constructed, any determinant lattice
    is built, or any discrete logarithm
    is solved. Stage 0 asserts only that
    on the frozen m-grid {3,4,5} the
    recalled formula
    deg(S_{m+1})=2^{m-1} equals 4, 8, 16
    and is strictly increasing in m. A
    nearby claim that the degree equals
    m is rejected. A dummy constant
    degree 2 is rejected as a degree
    table. This is not a
    determinant-method bound and not a
    Semaev evaluation. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260808-0e9fa1 tracks a
    determinant-method bound on the
    Semaev hypersurface of degree
    2^{m-1}. Stage 0 freezes only that
    degree identity so a later bound
    cannot be read from an instrument
    that silently changes deg(S_{m+1}).
    No S_m is constructed. No
    Coppersmith. No DLP solve.
  predictions:
    - id: P-S0-DETBND
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL reports
        deg(3)=4, deg(4)=8, deg(5)=16 and is
        monotone in m. KF deg=m is rejected.
        NULL constant-degree-2 is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF
        claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses
        a frozen identity. That
        falsifies only P-S0-DETBND
        at the frozen arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
      real_grid:
        m: [3, 4, 5]
        deg_S_m_plus_1: [4, 8, 16]
        formula: '2**(m-1)'
        must_degree_table: true
        must_monotone_in_m: true
      known_false:
        kind: degree_equals_m
        must_reject: true
      matched_null:
        kind: constant_degree_two
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-71d12e Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy / closed-form arithmetic
      only. No curve construction.
      No Semaev S_m evaluation. No
      Coppersmith. No DLP. No rho
      beat. The frozen numbers are
      the proposal's own identities,
      not a fitted result.
  assumptions:
    - id: A1
      statement: >
        Stage 0 evaluates only the
        frozen closed-form identities.
        It does not execute an attack
        and does not solve a DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether 2^{m-1} equals 4,8,16 on the
      frozen m-grid.
    baseline_embedding:
      parameter_slice: >
        The REAL grid, the KF claim,
        and the NULL dummy. Disclosed
        tightening: arithmetic
        calibrator only, not later
        stages of the proposal.
      reproduction_check: >
        REAL identities hold. KF
        rejected. NULL rejected.
    observation_collision:
      observable: recalled Semaev degree 2^{m-1} as a function of m
      distinct_preimage_search: >
        Hold the formula and set deg=m (KF).
        Hold the method and drop
        m-dependence (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen Stage 0 identity table.
        predicted_gain: >
          Exact known-false reject on
          KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze the formula and grid
      before reading the table.
      Existential equality at one
      grid does not imply an attack.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        arithmetic. Never an attack.
        Never a DLP solve. Never a
        rho beat. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is a constant degree 2. An
        argument that still calls it a
        Semaev degree table is
        proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-DETBND only. Not Semaev
    S_m evaluation. Not a determinant
    lattice. Not Coppersmith. Not a DLP
    solve. Not a rho beat. No Stage 1 of
    EXP-ECDLP-71d12e.
