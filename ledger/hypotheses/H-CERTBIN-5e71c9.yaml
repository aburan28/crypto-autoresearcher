# =============================================================================
# H-CERTBIN-5e71c9 -- Degree-bounded refutation of unsatisfiable m = 2 S_3
# descents at n = 17 on Semaev's diagonal: is plain Macaulay's "not reached at
# D <= 4" a closure artifact, and is the degree-4 refutation rate a property of
# the family rather than of one curve?
#
# Answers KN-OPEN-3c8f51 item (C) at n = 17 (claim C1, EXP-CERTBIN-e94b27) and
# its resolution item 4 (claims C2 and C3, EXP-CERTBIN-3f06d1). Designed under
# DEC-20260923-f25b97 NA-3 and NA-4; approved by DEC-20260924-8e2f47.
#
# ID PROVENANCE (disclosed): minted by the Coordinator subagent WITHOUT A SHELL
# (random 6-hex token; checked free only by grep over ledger/hypotheses,
# ledger/decisions and ledger/handoffs). The design snapshot archive
# TASK-20260924-d3a90c runs `python3 tools/allocate_id.py --check` on it before
# the first commit. Not official until that archive verifies.
# =============================================================================
hypothesis:
  id: H-CERTBIN-5e71c9
  question_id: RQ-CERTBIN-836ce2
  question_ids: [RQ-CERTBIN-836ce2]
  proposal_id: IDEA-20260923-5d0b8e
  open_problem_id: KN-OPEN-3c8f51
  source_decision: DEC-20260923-f25b97
  goal_ids: []
  goal_ids_note: >-
    RQ-CERTBIN-836ce2 is not attached to a goal (DEC-20260922-61cdc1 NA-2 is
    pending). This record edits no goal head and asserts no goal membership.
  designed_by: coordinator
  proposed_by: coordinator
  proposed_by_note: >-
    Not from an idea-generator session. It restates, as a falsifiable claim,
    the unexpected observation O-10/O-11 of EV-CERTBIN-6c3e0a (prior part (e)
    of EXP-CERTBIN-4e92d7 overturned) and the resolution criteria 1 and 4 of
    KN-OPEN-3c8f51. Both were committed before this record.
  recorded_at: '2026-09-24'

  statement: >-
    CEILING FIRST. No cost claim of any kind. At m = 2 the per-attempt
    satisfiability question is decided outright by oracle A (2^9 quadratic
    root-findings), and parallel Pollard rho dominates the whole setting. This
    hypothesis concerns the REFUTATION DEGREE of one family of Boolean systems
    under declared degree-bounded closures. It is exponent-adjacent only in the
    sense that refutation degree is the quantity Semaev's Assumption 1 and
    KN-OPEN-d218ec reason about; nothing here tests that assumption.

    Setting. The m = 2 direct S_3 Weil descent over F_2[t]/(t^17 + t^3 + 1),
    l = 9: 17 quadratic Boolean equations f_0..f_16 in 18 variables, in the
    Boolean ring B = F_2[v_0..v_17]/(v_i^2 + v_i). Three closures of degree D:
    - M_D: the row space of the fixed-shape multilinear Macaulay matrix (all
      mu*f_k, deg mu <= D - 2), as in EXP-CERTBIN-4e92d7;
    - W_D: the least F_2-subspace of B_{<=D} that contains M_D and is closed
      under g -> v_j*g whenever deg g <= D - 1 (the degree-D mutant closure);
    - an instance is REFUTED by a closure X iff 1 is in X.
    M_4 is a subspace of W_4, W_4 of W_5, and M_5 of W_5 (derived below).

    Claim, in three parts.
    (C1, tested by EXP-CERTBIN-e94b27; the claim under test is E-A.) At the
    Stage-1 cell (curve A = 97044, B = 126251), consider the 62 unsatisfiable
    subgroup-target attempts of RUN-CERTBIN-3b7e05 that M_4 does not refute.
    E-A (closure artifact): W_4 refutes at least 90% of them (>= 56 of 62).
    E-G (genuine refutation degree above 4): W_4 refutes at most 10% (<= 6 of
    62). Separately, every one of the 62 is refuted at D <= 5 by M_5 or W_4 or
    W_5 ("clean at D <= 5").
    (C2, tested by EXP-CERTBIN-3f06d1.) The plain M_4 refutation rate of
    unsatisfiable subgroup-target attempts is a property of the (n = 17,
    m = 2, l = 9) family and not of one curve or one V. On a new random curve
    with h = 2, on a new random curve with h = 4, and with a uniformly random
    9-dimensional V on the Stage-1 curve, the rate's CP95 interval overlaps
    the Stage-1 interval [0.799, 0.875], while the same-support affine and
    random-F_2 nulls stay at or below 0.05 (CP95 upper bound).
    (C3, tested by EXP-CERTBIN-3f06d1.) The x(2E) modulation replicates: on
    uniform x_R, unsatisfiable attempts with x_R in x(2E) are refuted at M_4
    more often than those off x(2E) (exact one-sided Fisher p < 0.01 per cell).

  mechanism: >-
    SOUNDNESS (exact). M_D and W_D lie in the ideal I of B generated by the
    f_k: rows are multiples of generators, and closure under sums and
    multiplication by a variable stays in I. An instance with a Boolean
    solution has 1 outside I. So a refutation by any of the three closures is
    a sound unsatisfiability certificate (Proposition S, IDEA-20260923-5d0b8e),
    and every refutation has an explicit form 1 = sum over a finite set C of
    pairs (mu, k) of mu*f_k in B, with mu multilinear monomials.

    WHY W_4 CAN EXCEED M_4. M_4 contains mu*f_k only for deg mu <= 2. A
    polynomial g in M_4 of degree <= 3 (a "degree fall") is multiplied by a
    variable in W_4 but not in M_4. The one S_3-specific fall exhibited so far
    is the LINEAR consequence ell = sum_k Tr(t^k / x_R^2) f_k = v_0 + v_9 +
    Tr(B / x_R^2) (EV-CERTBIN-6c3e0a O-11). In M_4 only mu*ell with
    deg mu <= 2 is present; W_4 also contains every mu*ell with deg mu = 3,
    i.e. it applies the linear substitution to the whole degree-4 system.
    E-A says that this kind of reuse of fallen polynomials, which F4 performs
    and plain Macaulay does not, is what the 62 were missing.

    THE COMPETING READING (E-G). With ell used as a substitution the system
    becomes 16 independent quadratics in 17 variables. Its semi-regular
    Boolean Hilbert series (1+z)^17 / (1+z^2)^16 has coefficients 1, 17, 120,
    408, 340, -2380, so the semi-regular degree of regularity is still 5
    (derived here). A generic system of that shape is therefore NOT expected
    to be refuted at degree 4 even by W_4. The 84% refuted by M_4 already
    exceeds the semi-regular expectation. E-G says the remaining 16% are the
    instances on which S_3's extra structure is absent and the refutation
    degree is 5 or more.

    MONOTONICITY (derived). If deg g <= 3 and g is in W_4, then v_j*g is in
    W_5, because g is in W_5 and deg g <= 4; by induction on the closure
    iteration, W_4 is a subspace of W_5. M_4 rows are M_5 rows, and M_5 is a
    subspace of W_5 by definition. W_D is the least fixpoint of a monotone
    map on a finite lattice, so it is unique and independent of the order in
    which products are added.

    C2 / C3 (transfer). The Stage-1 rate (324/386 = 0.839) and the x(2E)
    modulation (0.845 against 0.60-0.66) were measured on one curve (h = 4)
    and the polynomial-basis V. KN-OPEN-3c8f51 forbids quoting the rate as
    characteristic of the family before an h = 2 curve and a random-V
    replicate. HEUR-CERTBIN-RD1 states the transfer as a heuristic.

  assumptions:
    - >-
      Satisfiability is ALGEBRAIC: s >= 1 Boolean solutions of the descended
      system, decided by oracle A (O(2^l) root-finding over V) and oracle B
      (exhaustive 2^18 evaluation), never by any closure.
    - >-
      C1 uses only archived instances of RUN-CERTBIN-3b7e05. Their selection
      (M_4 did not refute them) is conditioned on a Stage-1 outcome. C1 speaks
      about that conditional set. The combined unsat-arm rate under W_4 is
      (324 + a)/386, which uses monotonicity (M_4 subset of W_4) for the 324
      instances M_4 already refuted; that step is a theorem, spot-checked on
      20 of them (EXP-CERTBIN-e94b27 C-MONO).
    - >-
      Polynomial-calculus framing (RECALLED, a pointer only; not relied on):
      W_D refutation resembles a degree-D polynomial-calculus refutation over
      F_2 with Boolean axioms (Clegg-Edmonds-Impagliazzo, recalled). If a
      reviewer confirms the correspondence at source, C1 measures the
      multilinear PC refutation degree of these systems. Nothing here depends
      on it.

  proof_search_map:
    bottleneck: >-
      Whether "1 in R_4" (84% of the unsat arm at the Stage-1 cell) is a stable
      statement about the S_3 family, or an artifact of (i) plain Macaulay
      closure and (ii) one curve and one V. It decides whether KN-OPEN-3c8f51
      items (B) and (C) are worth their next steps (DEC-20260923-f25b97 NA-5:
      the n = 19 cell is designed only if the D <= 5 picture is clean).
    baseline_embedding:
      parameter_slice: >-
        The Stage-1 measurement is reproduced exactly as a regression fixture
        before any new closure is computed: on the 62 U-set instances, the 62
        S-set instances and 20 instances M_4 refuted, the rebuilt M_4 must give
        the archived rank_4 and "1 in R_4" (and rank_3, "1 in R_3") per
        instance (EXP-CERTBIN-e94b27 C-BASE). The replication reproduces the
        Stage-1 fixture dimensions 323 x 988 and 2924 x 4048 and re-runs the
        reviewed Stage-1 instrument (EXP-CERTBIN-3f06d1 C-FIX, C-PROV).
      reproduction_check: >-
        (i) C-BASE per instance, zero mismatches. (ii) Fixture dimensions
        2924 x 4048 (D = 4) and 16796 x 12616 (D = 5). (iii) Every counted
        refutation carries a certificate verified by code that imports nothing
        from the closure engine.
    observation_collision:
      observable: '"1 in X" for a closure X, and its certificate.'
      distinct_preimage_search: >-
        A false refutation would be a satisfiable instance with 1 in X. That is
        impossible by soundness if the certificate verifies, so the only
        collision routes are a wrong arm label (checked by two oracles plus a
        re-run of oracle B) or a certificate that does not verify (checked on
        every counted refutation). The 62 satisfiable controls (and 10 at W_5)
        are the explicit search for a collision.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: W_D in place of M_D (reuse of degree falls within the degree bound).
        predicted_gain: Decides E-A against E-G on the 62.
      - transform: observable_fiber
        proposed_object: The per-instance closure label {W_4, M_5 only, W_5 only, none, undetermined}.
        predicted_gain: The refutation-degree distribution of the unsat arm at D <= 5.
    quantifier_order: >-
      C1: FOR the fixed archived set U62 (fixed before this record by the
      archived D = 4 flag), FOR each closure X in {W_4, M_5, W_5 on the
      residual}: EXISTS a verified certificate for "1 in X", or NOT. The
      thresholds (56, 31/32, 6) are fixed now. C2: FOR each of the three new
      cells (curve and V drawn from frozen seeds before any target), the
      rate's CP95 interval overlaps [0.799, 0.875] or does not.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested cells: the refutation-degree distribution of the unsat
        subgroup-target attempts under M_4, W_4, M_5 and W_5, with verified
        certificates, and the null and satisfiable controls under the same
        closures. Not F4 step degree, not any n other than 17, not m = 3, not
        any statement about Semaev's Assumption 1, not a cost.
      nearby_object_control: >-
        Proves-too-much: the same closures on 62 unsatisfiable same-support
        affine-null instances (F-AFF-1) and 62 unsatisfiable random-F_2
        instances (F-NULLF2), also not refuted by M_4. If they are refuted at
        the same closure at the same rate, S_3 structure explains nothing at
        that closure. Satisfiable controls must never be refuted.
    proof_obligations:
      - claim: Soundness of M_D and W_D (both lie in I), and the certificate form.
        responsibility: correctness
      - claim: W_D is a well-defined least fixpoint, independent of product order.
        responsibility: correctness
      - claim: Monotonicity M_4 <= W_4 <= W_5 and M_5 <= W_5.
        responsibility: correctness
      - claim: The semi-regular series computation (D_reg = 5 for 16 quadratics in 17 variables and for 17 in 18).
        responsibility: baseline
      - claim: Fixture dimensions 2924 x 4048 and 16796 x 12616.
        responsibility: size
    not_applicable_reason: >-
      A measurement hypothesis. The map is filled because soundness,
      monotonicity and the certificate form are small exact results the
      contracts rely on as instrument checks.

  rerandomization: null
  rerandomization_note: No worst-to-average-case device is used.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity claim. The four promotion gates do not apply. A refutation
    degree measured at n = 17 says nothing about any exponent without a
    separate, numbered transfer heuristic, and none is proposed here.

  heuristic_assumptions:
    - id: HEUR-CERTBIN-RD1
      formal_statement: >-
        (Rate transfer at fixed n.) For the m = 2 direct S_3 descent at n = 17,
        l = 9, the fraction of unsatisfiable subgroup-target attempts refuted
        by M_4 depends on (n, m, l) and on the target class (subgroup, i.e.
        x(2E)), and not on the curve (random ordinary, h in {2, 4}) or on the
        choice of the 9-dimensional F_2-subspace V: at each tested cell its
        CP95 interval overlaps the Stage-1 interval [0.799, 0.875].
      random_model_justification: >-
        None rigorous. It imitates the generic behaviour of structured systems
        whose degree falls come from the algebra of S_3 itself (the exhibited
        linear consequence holds on every curve-algebra instance), rather than
        from the particular coefficients of one curve.
      supporting_results:
        - EV-CERTBIN-6c3e0a O-10 and O-11 (single run, one curve; empirical_only)
      validation_experiment_ids: [EXP-CERTBIN-3f06d1]
      falsification_condition: >-
        At any tested cell the rate's CP95 interval is disjoint from
        [0.799, 0.875].

  structural_ingredients:
    - description: >-
        S_3 = (x_1x_2 + x_1x_3 + x_2x_3)^2 + x_1x_2x_3 + B for
        Y^2 + XY = X^3 + AX^2 + B.
      citation: KN-TECH-b18366
      provenance: internal
      verified_by: self-tested against point addition in RUN-CERTBIN-3b7e05 (C-SELF), J1 of REVIEW-CERTBIN-20260923-c51f07
      role: the relation equation being descended
    - description: >-
        The linear consequence sum_k Tr(t^k / x_R^2) f_k = v_0 + v_9 +
        Tr(B / x_R^2), on every curve-algebra instance at the Stage-1 cell.
      citation: EV-CERTBIN-6c3e0a O-11
      provenance: internal
      verified_by: RT-20260923-29e7af (j8_linear_consequence.py, 2,210 instances)
      role: the exhibited degree fall that W_4 reuses and M_4 does not
    - description: Semaev's Assumption 1 and its diagonal k = ceil(n/m) (used only to locate the cell).
      citation: KN-LIT-fa346d via KN-OPEN-d218ec
      provenance: kb
      verified_by: TASK-20260923-29e7af (corpus record read; frozen text not re-read)
      role: context only; not tested

  reduction_chain:
    core_problem: Unsatisfiability certification of one relation attempt of index calculus on E(F_{2^17}), m = 2.
    corollaries: []
    corollaries_note: No downstream problem is reached.

  predictions:
    - id: PA-1
      metric: a = number of the 62 U-set instances with a verified certificate for 1 in W_4
      direction: higher
      minimum_effect: >-
        E-A: a >= 56. E-G: a <= 6. The claim under test is E-A. a <= 31
        falsifies E-A as the predominant explanation; a >= 32 falsifies E-G.
    - id: PA-2
      metric: r = number of the 62 refuted at D <= 5 by M_5, W_4 or W_5 (verified)
      direction: higher
      minimum_effect: CLEAN iff r = 62; NEAR-CLEAN iff 59 <= r <= 61; RESIDUE iff r <= 58.
    - id: PA-3
      metric: Refutations of satisfiable controls under any closure
      direction: lower
      minimum_effect: Exactly 0 (soundness). Any is an instrument failure, never evidence.
    - id: PA-4
      metric: M_4 refutation rate of unsat subgroup-target attempts, per new cell (EXP-CERTBIN-3f06d1)
      direction: different
      minimum_effect: CP95 interval overlaps [0.799, 0.875] at every cell; nulls' CP95 upper bound <= 0.05.
    - id: PA-5
      metric: x(2E) versus off-x(2E) M_4 refutation rate on uniform x_R (F-RANDX unsat), per new cell
      direction: higher
      minimum_effect: x(2E) higher, exact one-sided Fisher p < 0.01.
  predictions_source: >-
    PA-1/PA-2 thresholds are fixed by this record before any W_D or M_5 value
    exists anywhere in the program. The 62/324/386 counts and the Stage-1
    interval come from EV-CERTBIN-6c3e0a. PA-4/PA-5 restate KN-OPEN-3c8f51
    resolution item 4 as thresholds.

  test_boundary:
    instances:
      - >-
        C1: the archived F-S3 test targets of RUN-CERTBIN-3b7e05 (n = 17,
        f = t^17 + t^3 + 1, l = 9, polynomial V, curve A = 97044, B = 126251),
        sets U62, S62, C20 and the null sets N-AFF62 and N-F262 of
        EXP-CERTBIN-e94b27.
      - >-
        C2/C3: the three cells of EXP-CERTBIN-3f06d1 (new h = 2 curve, new
        h = 4 curve, random V on the Stage-1 curve), n = 17, l = 9, D in {3, 4}.
    parameters:
      closures: M_4 (baseline), W_4, M_5, W_5 (residual only)
      sat_controls: 62 (S62), 10 of them also at W_5
      null_controls: 62 + 62
    implementation: experiments/EXP-CERTBIN-e94b27/impl/ and experiments/EXP-CERTBIN-3f06d1/impl/
    budget:
      enforcement: advisory
      note: Budgets are those of the two contracts; research time is unbudgeted (CLAUDE.md rule 11).
    excluded_from_boundary:
      - F4 step degree, F4 pair-list traces
      - any n other than 17; m = 3; the chained formulation
      - regime B
      - D >= 6

  falsification_conditions:
    - E-A (C1) is falsified if a <= 31.
    - E-G (C1) is falsified if a >= 32.
    - '"Clean at D <= 5" (C1) is falsified if r <= 58 with no instance left undetermined by budget.'
    - HEUR-CERTBIN-RD1 / C2 is falsified at a cell whose rate CP95 interval is disjoint from [0.799, 0.875].
    - C3 is not supported at a cell with exact one-sided Fisher p >= 0.2 (absent); 0.01 <= p < 0.2 is "weak".
    - >-
      A refuted satisfiable control, or a counted refutation whose certificate
      does not verify, falsifies the INSTRUMENT. The run is void and is not
      evidence about this hypothesis.

  interpretation_limits:
    - >-
      CLAIM TIER: toy. n = 17 only. No statement about F4 step degree, n = 19
      or beyond (KN-OPEN-3c8f51 item B), m >= 3, or any cost. Not evidence for
      or against Semaev's Assumption 1: the cell lies on its diagonal, so a
      low refutation degree is that assumption's content at work, not a test
      of it, and W_D is a Macaulay-type closure, not F4.
    - >-
      dominated_by: per attempt at m = 2, oracle A (2^9 root-findings) decides
      satisfiability and returns the solutions; it dominates every closure
      here. For the whole DLP at n = 17, parallel Pollard rho (about 160 group
      operations at q = 32603). sota_delta zero on every ECDLP cost axis.
    - >-
      A W_D refutation rate is conditional on the closure's definition. A
      non-refutation at W_5 is a bounded-degree statement, never a proof of
      satisfiability-free hardness.

