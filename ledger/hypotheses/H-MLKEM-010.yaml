hypothesis:
  id: H-MLKEM-010
  question_id: RQ-MLKEM-003
  goal_id: GOAL-MLKEM-003
  title: >-
    Carrier Table 5.1 Algorithm-3.1 costs are Theorem-4.1-consistent; any C.2
    mismatch is a transcription error decidable from the authors' pickle
  statement: >-
    For all nine (C0,CC,CN)×(Kyber-512/768/1024) cells, the Algorithm 3.1
    complexities printed in Carrier Table 5.1 equal Theorem 4.1 evaluated on
    the authors' optimized_withExperimentalPolar.pkl intermediates within
    0.25 bits; and if Table C.2 printed intermediates disagree with that
    pickle, the disagreement is a transcription error in C.2 rather than a
    failure of Theorem 4.1 or of the Table 5.1 headline (in particular the
    abstract CC shortfalls 3.5/11.9/12.3 bits).
  mechanism: >-
    Theorem 4.1 states T = Tsample + R·(N·Tdec + TFFT). Table C.2 lists the
    intermediates; Table 5.1 lists the totals. The authors' public optimizer
    pickle is an independent numerical witness of the same pipeline. Comparing
    the three sources localizes arithmetic vs transcription failures without
    needing to re-validate polar decoding.
  assumptions:
    - HAL hal-05406481 is a faithful archival copy of ePrint 2022/1750 (CRYPTO 2025).
    - optimized_withExperimentalPolar.pkl in CodedDualAttack is the artifact
      underlying the paper's experimental-polar cost table.
  asymptotic_claim: null
  heuristic_assumptions: []
  predictions:
    - metric: max_abs_delta_pickle_vs_table51
      direction: lower
      minimum_effect: at_most_0.25_bits
    - metric: abs_delta_c2_Tsample_CN_Kyber512_vs_pickle
      direction: higher
      minimum_effect: at_least_8_bits_if_printed_143.30
  test_boundary:
    instances: [Kyber-512, Kyber-768, Kyber-1024]
    parameters: {models: [C0, CC, CN]}
    implementation: experiments/EXP-MLKEM-010
  falsification_conditions:
    - Pickle vs Table 5.1 CC disagreement >0.5 bits on any Kyber set
    - Theorem 4.1 from pickle intermediates disagrees with pickle complexity >0.25 bits
  interpretation_limits:
    - Consistency of cost arithmetic is not validation of polar heuristics or Pwrong.
    - Not a cryptanalytic break of ML-KEM.
  status: analyzed
  proposed_by: coordinator
  approved_by: coordinator
  approved_at: '2026-07-31'
  evidence_ids: [EV-MLKEM-016]
