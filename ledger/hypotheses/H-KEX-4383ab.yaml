hypothesis:
  id: H-KEX-4383ab
  question_id: RQ-KEX-b8be01
  derived_from_idea: IDEA-20260813-2123f1
  added: '2026-08-25'

  statement: >-
    SCOPE: deterministic actions of a FINITE ABELIAN group G on a finite set X,
    transitive on the accepted public-state orbit, with a public encoding
    q from X onto a G-orbit Y0, all instantiated as explicitly enumerated toy
    action tables with log2 |G| <= 14 and log2 |X| <= 14. CLAIM TIER toy. NO
    ATTACK, NO EXPONENT, NO SECURITY CLAIM, NO STATUS CHANGE REQUESTED.

    THE HYPOTHESIS. For every such action and every encoding q for which the
    descended action g * q(x) = q(g * x) is well defined, the stabilizer
    H = Stab_G(q(x0)) is the GLOBAL kernel of the descended action on Y0, the
    induced action of G/H on Y0 is free and transitive, and consequently
    (i) the effective public-key fiber after quotienting by H has size exactly
    1, (ii) every representative of a single H-coset induces exactly ONE
    permutation of Y0 and yields exactly ONE shared output, and (iii) the
    log2 |H/K| discarded representation labels (K the kernel on X) carry
    exactly zero key-exchange entropy. Symmetrically, when q is NOT compatible
    with a well-defined descended action, the enumeration exhibits a concrete
    triple (x, x', g) with q(x) = q(x') and q(g*x) != q(g*x'), which the audit
    reports as a CORRECTNESS failure of the candidate protocol and never as
    hidden entropy.

    WHAT WOULD MAKE THIS FALSE, AND IT IS CHECKABLE BY ENUMERATION. A toy
    action table that passes every group-law, transitivity, commutativity and
    codomain certificate, whose encoding passes the well-definedness check, and
    on which either some element of H fails to fix some y in Y0, or some public
    fiber carries two distinct induced permutations or two distinct shared
    outputs. Any one such table refutes the hypothesis outright. The design
    enumerates completely rather than sampling, so this is a DECISION and not
    an estimate.

  mechanism: >-
    DERIVED IN-REPO FROM THE PARENT PROPOSAL. No external citation is asserted
    for any step; the sources listed in IDEA-20260813-2123f1 are motivation for
    the instantiation, not authority for the algebra.

    (1) STABILIZER IS KERNEL. G abelian, transitive on X, x0 fixed,
    K = Stab_G(x0). For k in K and arbitrary x = g * x0,
    k * x = k * (g * x0) = g * (k * x0) = g * x0 = x. So every element of K
    fixes every point, K is the global kernel, every point stabilizer equals K,
    and G/K acts freely and transitively on X.

    (2) THE SAME ARGUMENT ON THE QUOTIENT. If q(g * x) depends only on g and
    q(x) -- which is precisely what a peer must have in order to process a
    received public key -- then G acts on Y0 = G * q(x0), that action is
    transitive, and step (1) applied to it gives H = Stab_G(q(x0)) as the
    global kernel with G/H free and transitive on Y0. A public key q(g * x0)
    therefore determines the coset gH exactly, and the residual H/K label
    cannot change any descended action or any shared output.

    (3) THE CORRECTNESS FORK. If well-definedness fails there exist x, x' with
    q(x) = q(x') and some a in G with q(a * x) != q(a * x'). A participant
    holding q(x) then has no unique shared output, so the candidate is
    incorrect rather than secretly entropic. Adding public reconstruction data
    to restore uniqueness changes q; the refined encoding is the real q and is
    re-audited.

    (4) WHY AN ENUMERATION IS THE RIGHT INSTRUMENT. Steps (1)-(3) are
    unconditional for the stated quantifiers, so the experiment is not
    evidence FOR them; it is (a) a mechanical check that the derivation has no
    slip, (b) an instrument certification -- the positive control must produce
    a genuine correctness counterexample, and the nearby-object controls
    (nonabelian transitive, abelian nontransitive) must each FAIL a named
    premise -- and (c) a quantified entropy subtraction: exactly
    log2 |H/K| nominal bits removed, exactly log2 |G/H| effective bits kept.

  assumptions:
    - >-
      Every tested candidate is presented as a COMPLETE finite action table
      plus a complete encoding table, so closure, identity, inverse,
      commutativity, codomain and canonical-encoding certificates can be
      verified exhaustively before any fiber is measured. A certificate
      failure invalidates that table and stops interpretation for it; it is
      never evidence against the lemma.
    - >-
      Peer-key processing uses only the accepted public encoding and the
      declared public parameters. Unmodeled hidden state, interactive repair,
      probabilistic or stateful encodings are OUT OF SCOPE and any candidate
      needing them is reported as out-of-scope rather than as a refutation.
    - >-
      Secret samplers are uniform on G in the primary arm. A nonuniform arm is
      run separately and its entropy is pushed through the quotient exactly by
      Shannon and min-entropy, never by assuming uniformity survives.
    - >-
      Toy tables are instrumentation. They can refute the derivation but they
      cannot establish security of anything, and no candidate protocol is
      being evaluated for deployment.

  proof_search_map:
    bottleneck: >-
      The single inference "the public encoding is lossy, therefore the
      discarded fiber label is hidden secret entropy." Removing or confirming
      that step changes whether a lossy-encoding KEX candidate may be credited
      with log2 |H/K| extra bits before any cost analysis begins.
    baseline_embedding:
      parameter_slice: >-
        The hard-homogeneous-space equations pk_a = a * x0, pk_b = b * x0,
        shared = a * (b * x0) = b * (a * x0), instantiated on the candidate's
        actual accepted public representation, with the effective group taken
        AFTER quotienting stabilizers.
      reproduction_check: >-
        Before any quotient audit is reported, reproduce on each toy table:
        two-party agreement on 100 percent of sampled key pairs, public
        validation acceptance, the effective group order |G/H|, and the
        matched exhaustive and BSGS search sizes on the effective orbit. A
        mismatch on any of these is a specification stop, not a finding.
    observation_collision:
      observable: >-
        The public encoding q(x) together with its fiber label and the induced
        public action trace over all g in G.
      distinct_preimage_search: >-
        Enumerate every q-collision pair and, for each, every g in G, looking
        for q(g*x) != q(g*x'). The lexicographically first separating triple
        is a correctness counterexample and is reported verbatim. If none
        exists, compute H and test the induced G/H torsor. The positive
        control is constructed so that this search MUST return a triple; if it
        does not, the search is broken and no negative may be reported.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The effective quotient action of G/H on Y0 together with explicit
          q-fiber certificates, replacing the nominal group G and the nominal
          secret word.
        predicted_gain: >-
          Zero attack speedup. The transform deletes only entropy credited to
          action-inert fiber labels and surfaces correctness failures where
          the action does not descend.
    quantifier_order: >-
      FOR ALL finite abelian G, FOR ALL transitive actions of G on X, FOR ALL
      surjections q from X onto a G-orbit Y0 such that q(g*x) is well defined
      as a function of (g, q(x)), THERE EXISTS H containing K with Y0 a torsor
      for G/H. The witness H does not depend on g or on x, which is what makes
      this a structural statement rather than a per-instance screen. NOT
      quantified over: nonabelian, nontransitive, probabilistic, stateful,
      interactive or partially defined actions. It is explicitly NOT asserted
      that vectorization in G/H is easy.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: on the enumerated toy tables, information-theoretic hiding
        credited to public-state fibers is exactly zero and the effective
        secret entropy is exactly log2 |G/H|. It gives NO algorithmic speedup
        against vectorization in the faithful quotient, closes NO research
        direction, and says nothing about any deployed or proposed scheme.
      nearby_object_control: >-
        THREE, all pre-declared. (i) A NONABELIAN transitive action where a
        point stabilizer need not be normal -- the audit must REFUSE it by
        naming the failed abelian premise, not by returning fiber size 1.
        (ii) A disjoint union of two abelian orbits -- transitivity fails and
        the audit must refuse it. (iii) An encoding that omits one necessary
        orientation coordinate -- the audit must flag it as a correctness
        failure. A procedure that returns "fiber size 1, no hidden entropy" on
        (i) or (ii) has not identified the load-bearing premise and is
        measuring its own default path.
    proof_obligations:
      - claim: >-
          For a transitive abelian action the stabilizer of one point is the
          global kernel and every stabilizer is equal to it.
        responsibility: correctness
      - claim: >-
          Equivariance makes every public fiber an H/K coset and makes the
          induced G/H action on Y0 free and transitive.
        responsibility: strictness
      - claim: >-
          Where equivariance fails, a concrete pair of accepted public inputs
          yields inconsistent shared outputs and is exhibited.
        responsibility: interface
      - claim: >-
          The toy enumeration is complete over the declared table and absence
          of a counterexample inside it is never security evidence.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No complexity claim of any kind is made. No exponent
    moves, no attack is proposed, and sota_delta is zero on every attack axis
    (time, memory, data, queries, advice). Generic inversion in the faithful
    quotient remains at its matched square-root scale wherever that model
    applies, and this record does not improve it.

  heuristic_assumptions:
    - id: HEUR-KEX-1
      formal_statement: >-
        The finite toy action and encoding tables used as regressions are
        extensionally equal to the abstract action and encoding they are
        declared to instantiate, i.e. every table entry agrees with the
        abstract rule on every input.
      random_model_justification: >-
        Not a distributional assumption. The tables are checked exhaustively
        (closure, identity, inverse, commutativity, codomain, canonical
        encoding) at log2 |G| <= 14, so this is a decidable property rather
        than an imitation of a random model.
      supporting_results: []
      validation_experiment_ids: [EXP-KEX-6572c9]
      falsification_condition: >-
        Any group-law, codomain or canonical-encoding certificate failure on a
        table. That table is then invalid and is excluded with its defect
        recorded; it is NOT evidence against the hypothesis.
    - id: HEUR-KEX-2
      formal_statement: >-
        Any residual statistical association reported between a fiber label
        and a shared output is attributable to the algebraic equivalence
        relation only if it exceeds a same-shape random-relabeling null AND
        decays monotonically to zero as the coordinate is progressively
        canonicalized along G -> G/K -> G/H.
      random_model_justification: >-
        Random relabelings preserve orbit and fiber cardinalities while
        destroying algebraic association, so they give the correct conditional
        null for an artifact that is produced by counting alone.
      supporting_results: []
      validation_experiment_ids: [EXP-KEX-6572c9]
      falsification_condition: >-
        A reported association matched by the same-shape null, or failing to
        decay under canonicalization, is classified as an instrumentation or
        base-orbit artifact and may not support any interpretation.

  predictions:
    - metric: >-
        G1 -- effective_public_key_fiber_size after quotienting by H, maximum
        over all public states of all well-defined toy tables
      direction: lower
      minimum_effect: >-
        EXACTLY 1 on every table. Derived before any run. A single table with
        maximum effective fiber size greater than 1, whose certificates all
        pass, refutes the hypothesis.
    - metric: >-
        G2 -- within_fiber_distinct_induced_permutation_count and
        within_fiber_distinct_shared_output_count, maximum over all fibers of
        all well-defined toy tables
      direction: lower
      minimum_effect: >-
        EXACTLY 1 for both. This is the operative statement that the discarded
        label buys nothing. A fiber carrying two distinct shared outputs on a
        table whose well-definedness check PASSED is a contradiction between
        two of the instrument's own checks and blocks all interpretation until
        resolved.
    - metric: >-
        G3 -- entropy accounting -- (nominal_label_bits_removed,
        effective_entropy_bits) per table under a uniform secret sampler
      direction: different
      minimum_effect: >-
        EXACTLY (log2 |H/K|, log2 |G/H|) with the two summing to log2 |G/K|.
        Any table where the measured effective entropy exceeds log2 |G/H| by
        more than 0 bits refutes the entropy half of the claim.
    - metric: >-
        G4 -- action_separating_collision_count on the deliberately
        under-specified positive-control encoding
      direction: higher
      minimum_effect: >-
        AT LEAST 1, with the lexicographically first separating triple
        (x, x', g) reported and its two distinct shared outputs independently
        recomputed. Zero means the collision search cannot find a
        counterexample that is present by construction, the instrument is
        blind, and NO negative result may be reported from any arm.
    - metric: >-
        G5 -- nearby_control_failed_premise_count on the nonabelian-transitive
        and abelian-nontransitive controls
      direction: higher
      minimum_effect: >-
        AT LEAST 1 explicitly named failed premise in EACH of the two
        controls, with the failing proof step identified. A control that
        passes the audit and returns "fiber size 1" demonstrates that the
        audit is not using its premises and voids the method ceiling.
    - metric: >-
        G6 -- same-shape null effect size and its decay under
        G -> G/K -> G/H canonicalization, for any secondary statistical signal
      direction: lower
      minimum_effect: >-
        Monotone decay to zero at G/H, with the raw effect not exceeding the
        random-relabeling null at matched fiber sizes. A flat effect is
        recorded as an artifact, not a finding.

  test_boundary:
    instances:
      - >-
        Enumerated finite abelian action tables: cyclic Z/n, products
        Z/n1 x Z/n2, and one elementary abelian 2-group, each acting on X by
        translation of a torsor, with |G| in {8, 16, 64, 256, 1024, 4096} and
        |X| = |G/K| for declared kernels K of sizes 1, 2, 4, 8.
      - >-
        Encodings q: (a) the identity encoding; (b) a genuine equivariant
        quotient with |H/K| in {2, 4, 8}; (c) an ideal-word / relation
        duplicate encoding as a positive syntactic-redundancy control;
        (d) an encoding omitting one necessary coordinate, as the positive
        correctness-failure control.
      - >-
        Nearby-object controls: one nonabelian transitive action (a dihedral
        or symmetric group acting on cosets of a non-normal subgroup) and one
        abelian action on a disjoint union of two orbits.
      - >-
        OUT OF SCOPE: any real isogeny class action, any curve of any size,
        any probabilistic, stateful, interactive or partially defined action,
        and every candidate whose public representation is not fully
        enumerable at these sizes.
    parameters:
      max_group_log2: 14
      max_state_log2: 14
      kernel_sizes: [1, 2, 4, 8]
      h_over_k_sizes: [1, 2, 4, 8]
      samplers: ["uniform", "one declared nonuniform arm"]
      null_relabelings_per_table: 200
    implementation: experiments/EXP-KEX-6572c9
    budget:
      stage0_wall_clock_seconds: 600
      stage1_wall_clock_seconds: 1800
      stage2_wall_clock_seconds: 3600
      maximum_memory_gb: 4
      maximum_runs: 8

  distinguishable_outcomes:
    - outcome: >-
        Every well-defined table returns effective fiber size 1, one induced
        permutation and one shared output per fiber, entropy exactly
        log2 |G/H|; the positive control produces a separating triple; both
        nearby controls fail a named premise.
      means: >-
        The derivation has no slip at these sizes and the instrument
        discriminates. The audit becomes a usable pre-implementation screen:
        a lossy-encoding KEX candidate inside the stated quantifiers may not
        be credited with log2 |H/K| hidden bits. This is a control result, not
        a security result, and it closes nothing.
    - outcome: >-
        Some well-defined table, with all certificates passing, shows an
        effective fiber size above 1, or a fiber with two distinct induced
        permutations or two distinct shared outputs.
      means: >-
        THE HYPOTHESIS IS FALSE as stated and must be withdrawn by a
        superseding record. This is the highest-value outcome available here:
        it locates an error in an argument the parent proposal treats as
        elementary, and the offending table is the refutation artifact.
    - outcome: >-
        The positive control produces NO separating triple, or a nearby
        control passes the audit without failing a premise.
      means: >-
        INSTRUMENT FAILURE. The audit cannot see the failures it exists to
        see. Nothing negative may be reported from any arm; the deliverable is
        an instrument report plus the exact defect.
    - outcome: >-
        Certificates fail on a majority of tables, or the enumeration cannot
        complete inside budget.
      means: >-
        Infrastructure or construction defect, never mathematical evidence
        (AGENTS.md rule 5). The run is failed_infrastructure and returns to
        the executor with the defect list.

  falsification_conditions:
    - >-
      F1 (PRIMARY) -- a certificate-passing, well-definedness-passing toy
      table with maximum effective fiber size greater than 1 after quotienting
      by H. The hypothesis is refuted.
    - >-
      F2 -- a fiber of such a table carrying two distinct induced permutations
      of Y0 or two distinct shared outputs. Refutes the zero-entropy half
      directly.
    - >-
      F3 -- the measured effective entropy under a uniform sampler exceeds
      log2 |G/H| on any table. Refutes the entropy accounting.
    - >-
      F4 -- the positive control yields no separating triple. Instrument
      blind; no negative may be reported anywhere in this experiment.
    - >-
      F5 -- either nearby-object control passes the audit without a named
      failed premise. The method ceiling is not demonstrated and the audit's
      scope statement is unsupported.
    - >-
      F6 (THE PLANNED NEGATIVE) -- if every forced value comes out as
      predicted, the experiment has NOT finished unless it also emits the
      exact entropy subtraction per table, the enumerated premise list a
      candidate must satisfy for the screen to apply, and a named class of
      candidates the screen cannot decide. A confirmed forced value with no
      forward guidance is a fatigue report.

  interpretation_limits:
    - >-
      CLAIM TIER toy and no downstream citation may raise it. This is an
      algebraic control, not a key-recovery attack, and it gives zero speedup
      against vectorization in the faithful quotient.
    - >-
      It does NOT close RQ-KEX-b8be01, does not close ordinary class-action
      key exchange, and says nothing about the computational hardness of
      inverting a faithful class action.
    - >-
      Survival of any candidate outside or after this screen is never security
      evidence, and no deployment or implementation recommendation follows
      from any outcome.
    - >-
      The enumerated tables are abstract group actions, NOT isogeny class
      actions. Applying the screen to a real candidate requires that
      candidate's own public representation to be written out first, and that
      transcription is a separate task with its own record.

