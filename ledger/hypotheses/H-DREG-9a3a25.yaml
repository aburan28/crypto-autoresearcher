    The S_4 dimensions are 1, 3, 2, 3 and 1. Their squares sum to
    24 and their cubes sum to 64. The bound factor is 192 and the
    exact factor is 216. The peak factor is 64. The S_5 dimensions
    are 1, 4, 5, 6, 5, 4 and 1. Their squares sum to 120 and their
    cubes sum to 596. The bound factor is 2400 and the exact factor
    1728000/596 is strictly above 2899 and strictly below 2900.
    The peak factor is 400. Two divides both 24 and 120. The order
    of 2 modulo 3 is 2, so 9/4 is 2.25, while 9 over 2 to the power
    1.58 is strictly above 3 and strictly below 3.2.
  mechanism: >-
    The proposal prices an isotypic block decomposition by the
    dimensions of S_m. This contract adds those dimensions. It
    does not build a Macaulay matrix.
