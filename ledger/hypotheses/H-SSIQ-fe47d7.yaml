  heuristic_assumptions:
    - id: HEUR-SSIQ-Q37-1
      formal_statement: >-
        FOR the rank-3 ball-count identity underlying N1 and N3 (the same
        lattice EV-SSIQ-e43afd O-6 identifies), the count of curves within
        ball radius T of a fixed target, normalised by total curve count,
        is Theta(T^{3/2}p^{-1/2}) UNIFORMLY across T in the certificate's
        operative range T in [p^{1/8}, p^{1/4}], not merely at the
        incumbent's own T = p^{1/3}.
      random_model_justification: >-
        Same first-moment ball-count argument this goal already committed
        as D1 (EV-SSIQ-e43afd O-5), extended to a different radius range;
        the campaign's own HEUR-SS-1 (H-SSIQ-90e07b) already flags that
        D1 supplies only an upper bound and that the matching lower bound
        is unestablished. This heuristic inherits that same one-sidedness
        rather than resolving it.
      supporting_results:
        - >-
          EV-SSIQ-e43afd observations O-5 and O-6, cited not re-derived.
        - >-
          HEUR-SS-1 in H-SSIQ-90e07b, which names the identical gap at a
          different radius (theta in (0, 1/3)) and remains unestablished
          there.
      validation_experiment_ids: [EXP-SSIQ-ff61bc]
      falsification_condition: >-
        A named sub-1/3 route's audit row is scored PASS on N1 or N3 using
        this identity, and a subsequent independent check (e.g. an
        empirical ball-count fit, when infrastructure allows) shows the
        identity materially overstates the count at the operative radius --
        the certificate's PASS verdict on that row would then be optimistic
        and must be relabelled UNRESOLVED pending the correction.

  structural_ingredients:
    - description: >-
        Rank-3 trace-zero ball-count identity: the number of isogenies
        E -> E' of degree <= T lies in a rank-3 sublattice of discriminant
        asymptotic to p, giving a ball count ~T^{3/2}p^{-1/2}.
      citation: >-
        ledger/evidence/EV-SSIQ-e43afd.yaml observation O-6, already
        committed under this goal (used identically by L1's closure and by
        IDEA-20260805-250e50's STEP 3). Consumed here, not re-derived.
      role: supplies N1's and N3's shared ball-density computation
    - description: >-
        The screen-threshold cost identity E(theta, s, gamma) and its
        forced value E(1/4, 0, 1/4) = 3/8.
      citation: >-
        ledger/proposals/IDEA-20260805-250e50.yaml and
        ledger/hypotheses/H-SSIQ-90e07b.yaml, both verified as committed
        ledger records under this goal. CITED, NOT RE-DERIVED, per the
        explicit red-team instruction on this catalogue entry.
      role: corroborates the certificate's 3/8 figure via an independent axis

