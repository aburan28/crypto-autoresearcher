hypothesis:
  id: H-SSIQ-fe47d7
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea_ids:
    - IDEA-20260807-edb3f3

  statement: >-
    SCOPE: necessary for the LIST-AND-CLOSE ARCHITECTURE of the frozen
    source's section 0.3 only; not a model-independent lower bound and not a
    statement about any other algorithmic architecture. CLAIM TIER medium
    (a decision procedure over the goal's lever map; no measurement). NO
    ALGORITHM IS PROPOSED AND NO EXPONENT BELOW 1/3 IS CLAIMED ATTAINED.

    (H-B1, DERIVABLE, ZERO COMPUTE) A time-p^{1/4} covering statement under
    the list-and-close architecture, characterised by the certificate vector
    (k, r, beta, u) = (closable-family size, guaranteed covering radius,
    amortised per-entry check exponent, smoothness parameter of the split at
    radius r), forces four independently checkable conditions:
      N1: k >= p^{1/8} (rank-3 counting at radius p^{1/4}).
      N2: batched closability at k^{o(1)} amortised cost per entry
          (otherwise p^{1/4}*p^{1/8} = p^{3/8}).
      N3: the family's displacement law has median (not merely tail) at
          p^{1/4}, else p^{1/8} attempts x p^{1/4} per attempt = p^{3/8}.
      N4: universality preserved (covering holds for all E or a p^{-o(1)}
          fraction) and P0 = p^{-o(1)} at the split (u = log p/(4 log B) <
          the incumbent's log p/(3 log B), so this condition does not bind).
    N1 and N3 are the SAME ball-density computation
    (#{isogenies of degree <= p^{1/4}}/#{curves} = p^{3/8-1/2}), so
    enlarging the target family and re-randomising into the tail are one
    idea priced twice, both landing on 3/8 -- EXACTLY THE VALUE
    E(1/4, 0, 1/4) = 3/8 ALREADY DERIVED BY IDEA-20260805-250e50/
    H-SSIQ-90e07b's screen-threshold cost identity. THAT COINCIDENCE IS
    CITED HERE, NOT RE-DERIVED. Any mixed proposal using both N1 and N3
    still needs a combined deficit >= p^{1/8}; the 1/3 -> 1/4 gap cannot be
    crossed by quantity on either axis alone -- only N2 (a data-structure
    question) is unconstrained by this argument.

    (H-B2, MEASURABLE-BY-AUDIT, ZERO COMPUTE) Applying the certificate to a
    closed, pre-registered list of every sub-1/3 route named under this
    goal to date (L1-L5, N5, A1-A7, and every C1/C2/Q3 catalogue entry
    naming a route) produces a PASS/FAIL/UNRESOLVED table with the
    arithmetic shown per row. The known-answer gates require the incumbent
    (radius p^{1/3}) to return k=1, beta=0, N1-N4 all PASS, exponent exactly
    1/3, and the classical meet-in-the-middle to return exponent 1/2 through
    the same rank-4 machinery -- both forced, zero-compute checks that must
    pass before any named route's row is trusted.

  mechanism: >-
    STEP 1 -- N1's DERIVATION. Rank-3 counting (the same governing lattice
    identified by this goal's own L1 closure and by IDEA-20260805-250e50's
    STEP 3): a guaranteed radius r = p^{1/4} covering with family size k
    needs k*r^{3/2}*p^{-1/2} >= 1 (each family member's ball of radius r
    covers a p^{-1/2}*r^{3/2} fraction of curves by the same rank-3 ball-
    count identity this goal already committed via EV-SSIQ-e43afd O-6), so
    k >= p^{1/2}/p^{3/8} = p^{1/8}.

    STEP 2 -- N2's DERIVATION. Without batching, Q3-2's exchange-rate
    identity (a sibling entry, cited not re-derived) gives cost
    p^{1/4}*p^{1/8} = p^{3/8} for k = p^{1/8} lookups against the family;
    the only way to avoid that multiplication is amortised cost k^{o(1)}
    per entry, which is a data-structure property with no known argument in
    either direction under this goal as of this record.

    STEP 3 -- N3's DERIVATION AND ITS CITATION. D1 (this goal's own
    committed upper-bound derivation, EV-SSIQ-e43afd O-5, cited not re-
    derived) bounds the fraction of curves with delta_E <= p^{1/4} by
    p^{-1/8+o(1)}; using only the tail of that law forces p^{1/8} attempts
    at p^{1/4} cost each, again p^{3/8}. That this equals
    E(1/4, 0, 1/4) = 3/8 in IDEA-20260805-250e50/H-SSIQ-90e07b's
    screen-threshold identity is STATED AS A CITATION, per the red team's
    explicit instruction on this entry
    (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/DEDUP.md), not presented
    as new arithmetic of this hypothesis.

    STEP 4 -- N4's DERIVATION. The smoothness parameter u = log p/(4 log B)
    at radius p^{1/4} is smaller than the incumbent's u = log p/(3 log B)
    at radius p^{1/3} (same B), so u_split(1/4) < u_split(1/3): smoothness
    at the shallower radius is strictly easier, making N4's smoothness half
    non-binding by direct comparison of the two closed-form u values.

    STEP 5 -- THE DUALITY. N1's k >= p^{1/8} and N3's tail bound
    p^{-1/8+o(1)} are both instances of the single ball-density ratio
    p^{3/8-1/2}: N1 asks how many balls of radius p^{1/4} are needed to
    cover the curve set; N3 asks what fraction of curves already lie in one
    such ball. These are reciprocal readings of the same count, so a
    proposal combining "enlarge the family" (N1's axis) with "re-randomise
    into the tail" (N3's axis) does not multiply two independent savings --
    it squares the same p^{1/8} deficit, giving a combined requirement still
    >= p^{1/8} rather than a smaller one.

    STEP 6 -- THE AUDIT PROCEDURE. Enumerate every named sub-1/3 route under
    this goal; for each, state its (k, r, beta, u) as claimed or implied by
    its own record; evaluate N1-N4 against that statement; record
    PASS/FAIL/UNRESOLVED with the one-line arithmetic. Run the two known-
    answer gates (incumbent at r = p^{1/3}, MITM at r with rank 4) before
    trusting any named-route row.

  assumptions:
    - >-
      That the rank-3 ball-count identity this goal already committed
      (EV-SSIQ-e43afd O-6, the same lattice underlying N1's derivation and
      this goal's L1 closure) applies uniformly across the certificate's
      radius range, not only at the incumbent's own radius p^{1/3}. This is
      the same class of assumption HEUR-SS-1 in H-SSIQ-90e07b names as
      unestablished in one direction (a lower bound on the base rate); this
      hypothesis inherits that open question rather than resolving it.
    - >-
      That every named sub-1/3 route's (k, r, beta, u) can be read off or
      derived from its own record without inventing detail the route's
      author did not supply; a route whose record does not state enough to
      evaluate a condition is recorded UNRESOLVED, never guessed into PASS
      or FAIL.
    - >-
      That the list-and-close architecture is the correct characterisation
      of every named route being audited; a route using a structurally
      different architecture (relation collection, descent) is out of
      scope for this certificate and is recorded as such, not scored.

  proof_search_map:
    bottleneck: >-
      N2 -- batched closability at k^{o(1)} amortised cost. Of the four
      conditions, N1, N3 and N4 are number-theoretic and each has a known
      argument (derived in mechanism STEPS 1, 3, 4); N2 alone is a data-
      structure question with no argument in either direction anywhere in
      this campaign as of this record. Removing this bottleneck is the only
      audited route past the p^{3/8} barrier for the list-and-close
      architecture.
    baseline_embedding:
      parameter_slice: >-
        (k, r, beta, u) = (1, p^{1/3}, 0, log p/(3 log B)): the incumbent
        itself, no family enlargement, no re-randomisation, the archived
        algorithm's own split.
      reproduction_check: >-
        SYMBOLIC GATE: the certificate applied to the incumbent at
        r = p^{1/3} must return k=1, beta=0, N1-N4 all PASS, and total
        exponent exactly 1/3, matching this goal's own committed
        exponent_budget rows (F1-F3) within the already-recorded band.
        Failure of this gate voids the certificate before any named route
        is audited. Second gate: classical meet-in-the-middle (rank 4,
        k = 1) must return exponent exactly 1/2.
    observation_collision:
      observable: >-
        The certificate vector (k, r, beta, u) and the PASS/FAIL/UNRESOLVED
        verdict it produces on N1-N4.
      distinct_preimage_search: >-
        A route "enlarging the family" (N1's axis alone) and a route
        "exploiting the tail" (N3's axis alone) produce DIFFERENT
        certificate vectors (different k, same r) but, per STEP 5, the SAME
        minimum combined deficit p^{1/8} -- this is the duality the entry's
        structural observation names, and it is searched for directly
        rather than asserted: any route claiming to combine both axes must
        exhibit its actual k and its actual tail exponent separately, and
        the audit checks whether their product beats p^{1/8} or merely
        reproduces it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "is there a p^{1/4} route" by the four-numbers-and-a-table
          decision procedure (k, r, beta, u) evaluated against N1-N4 for a
          closed list of named routes.
        predicted_gain: >-
          Converts an open-ended search into a bounded, zero-compute audit
          whose two outcomes (no route passes; some route passes) are both
          reportable and both actionable -- a route that passes is
          immediately promoted to a designed experiment (falsifier F7-b),
          and a route that fails is closed with the arithmetic attached.
      - transform: specialization_pack
        proposed_object: >-
          The two known-answer gates (incumbent at r=p^{1/3}; MITM at rank
          4), which specialise the general certificate to two cases whose
          answers are already fixed by this goal's committed exponent_budget
          and by classical meet-in-the-middle respectively.
        predicted_gain: >-
          A certificate that fails either specialisation is void before any
          named route is audited, at zero cost -- the cheapest possible
          check on the instrument itself.
    quantifier_order: >-
      THE CLAIM: for any covering-based route under the list-and-close
      architecture achieving guaranteed time exponent p^{1/4}, THERE EXIST
      (k, r, beta, u) describing it, and THOSE VALUES MUST SATISFY N1-N4.
      This is a NECESSARY-CONDITION order (route -> certificate values ->
      conditions), not a sufficiency claim: a (k, r, beta, u) satisfying
      N1-N4 does not imply a route achieving p^{1/4} exists (falsifier
      F7-b names this explicitly -- passing promotes to a DESIGNED
      EXPERIMENT, not to a result).
    method_ceiling:
      strongest_certifiable_claim: >-
        A named route's own stated or derivable (k, r, beta, u) fails at
        least one of N1-N4, hence that route cannot achieve p^{1/4} under
        the list-and-close architecture as currently specified. IT CANNOT
        CERTIFY that a route passing all four actually achieves p^{1/4}
        (necessary, not sufficient), and it cannot certify anything about
        an architecture outside list-and-close.
      nearby_object_control: >-
        The classical meet-in-the-middle baseline (rank-4 counting, k = 1),
        which the certificate must return exponent exactly 1/2 for -- a
        certificate that cannot distinguish this well-understood p^{1/2}
        baseline from the incumbent's p^{1/3} has not calibrated its own
        rank/determinant machinery correctly.
    proof_obligations:
      - claim: N1's k >= p^{1/8} follows from rank-3 ball-counting at r = p^{1/4}.
        responsibility: baseline
      - claim: N2 is a data-structure condition with no argument in either direction under this goal as of this record.
        responsibility: scope
      - claim: N3's tail bound equals N1's family-size bound as the same ball-density ratio p^{3/8-1/2}.
        responsibility: correctness
      - claim: 3/8 is cited to IDEA-20260805-250e50/H-SSIQ-90e07b's screen-threshold identity, not re-derived.
        responsibility: scope
      - claim: The certificate reproduces exponent 1/3 on the incumbent and 1/2 on classical meet-in-the-middle.
        responsibility: baseline
      - claim: The certificate is necessary, never sufficient; a route passing N1-N4 is promoted to a designed experiment, not asserted as a result.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
