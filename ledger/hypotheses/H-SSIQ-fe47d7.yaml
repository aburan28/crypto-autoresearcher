    corollaries: []

  predictions:
    - metric: "G1 -- certificate applied to the incumbent at r = p^{1/3}"
      direction: different
      minimum_effect: >-
        EXACTLY k=1, beta=0, N1-N4 all PASS, exponent exactly 1/3. Forced
        before any named route is audited.
    - metric: "G2 -- certificate applied to classical meet-in-the-middle (rank 4, k=1)"
