    - metric: >-
        G3 -- PASS/FAIL/UNRESOLVED table over the closed list of every
        named sub-1/3 route under GOAL-SSIQ-001 (L1-L5, N5, A1-A7, and
        every C1/C2/Q3 route naming a mechanism), with arithmetic per row
      direction: different
      minimum_effect: >-
        Every route scored, no route silently omitted. The pre-registered
        expectation (P-a in the source catalogue entry) is that every
        sub-1/3 proposal made to date fails at least one of N1-N4,
        identifiably without compute -- but a PASS on any row is an equally
        valid and more consequential outcome, routed to review-breakthrough
        under AGENTS.md rule 12 immediately.
    - metric: >-
        G4 -- the N1/N3 duality check: for each named route claiming both
        family enlargement and tail exploitation, its combined deficit
        versus p^{1/8}
      direction: different
      minimum_effect: >-
        Combined deficit >= p^{1/8} for every such route (STEP 5's forced
        arithmetic). A route with combined deficit strictly below p^{1/8}
        would falsify the duality claim itself (falsifier F7-d).

  test_boundary:
    instances:
      - >-
        The full closed list of named sub-1/3 routes under GOAL-SSIQ-001 as
        of this record's freeze: levers L1-L5, N5, A1-A7, and every
        catalogue entry in the C1/C2/Q3 slices naming a mechanism.
      - >-
        Out of scope: any route using an architecture other than
        list-and-close (relation collection, descent, higher-dimensional
        embeddings); any model-independent lower bound; any claim about a
        specific p^{1/4} algorithm existing.
    parameters:
      radius_grid: ["p^{1/8}", "p^{1/6}", "p^{1/4}", "p^{1/3}"]
      certificate_fields: [k, r, beta, u]
      claim_tier: medium
    implementation: >-
      Zero compute. Pen-and-paper audit against already-committed goal
      records; no new code, no new build.
    budget: {}

  falsification_conditions:
    - >-
      F7-a -- the incumbent gate returns anything other than exponent 1/3,
      or the MITM gate returns anything other than 1/2. CERTIFICATE VOID;
      no named route may be audited.
    - >-
      F7-b -- any named route passes N1-N4. It is IMMEDIATELY PROMOTED to a
      designed experiment under AGENTS.md rule 12 review at max effort, and
      the certificate's usefulness is CONFIRMED, not refuted, by this
      outcome -- both outcomes of this falsifier are deliverables.
    - >-
      F7-c -- a sub-1/3 route is exhibited that VIOLATES the certificate
      (achieves p^{1/4} while failing N1 or N3). The architecture scoping
      is wrong and the section-0.3 identity needs a fifth parameter; this
      is named in the source catalogue entry as the single most valuable
      possible outcome of this line and must be reported with at least the
      emphasis of any other finding.
    - >-
      F7-d -- a third independent route to a p^{1/8} deficit gives a
      DIFFERENT number than 3/8. The "same computation twice" duality claim
      (STEP 5) is wrong and must be withdrawn by a superseding record.

  interpretation_limits:
    - >-
      CLAIM TIER MEDIUM (decision procedure over the lever map, no
      measurement). NO EXPONENT BELOW 1/3 IS CLAIMED ATTAINED OR NEAR-
      ATTAINABLE; a route passing N1-N4 is promoted to further work, never
      asserted as a result by this hypothesis alone.
    - >-
      SCOPED STRICTLY TO THE LIST-AND-CLOSE ARCHITECTURE. Any route using a
      structurally different architecture is out of scope and is recorded
      as NOT APPLICABLE, not scored PASS or FAIL.
    - >-
      THE 3/8 FIGURE IS CITED TO IDEA-20260805-250e50/H-SSIQ-90e07b
      THROUGHOUT. No record descending from this hypothesis may present the
      3/8 coincidence as newly derived here.
    - >-
      HIGH RISK BAND: outcome F7-c would reopen architecture scoping this
      goal's lever map otherwise treats as settled; that risk is inherent
      to a necessary-condition audit and is stated rather than minimised.
    - >-
      Consistent with this goal's own ceiling-slice statement (no lever on
      smoothness probability, Psi(X,B), modular-polynomial evaluation, or
      table cost moves the time exponent below 1/3): this entry's audit is
