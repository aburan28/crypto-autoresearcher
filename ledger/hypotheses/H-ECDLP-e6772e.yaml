hypothesis:
  id: H-ECDLP-e6772e
  question_id: RQ-ECDLP-4fcbd3
  goal_id: GOAL-ECDLP-001
  source_idea_ids:
    - IDEA-20261006-5db10b
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Doubling-sum character sum on y^2 = x^3 + x + 3 over F_47
  statement: >-
    Let E be y^2 = x^3 + x + 3 over F_47. Let s(P) = x(P) + x(2P)
    for affine points with y(P) ≠ 0 and s(P) ≠ 0. Let N be the
    number of such points, and let χ be the quadratic character of
    F_47. Then the absolute value of the sum of χ(s(P)) over those
    points is at least N/4. The concrete negative is that the
    absolute sum is strictly below N/4. No ECDLP exponent
    improvement is claimed.
  mechanism: >-
    Representation class R1. The chart value is s(P) = x(P) + x(2P)
    on the pinned model (A, B) = (1, 3), followed by χ(s(P)).
    Duplication gives x(2P) = λ(P)^2 - 2x(P), so s(P) = λ(P)^2 - x(P),
    with λ(P) = (3x(P)^2 + 1)/(2y(P)). Sigma is the singleton
    {doubling map [2]}. The class is branching. χ keeps only a sign,
    so the projection is lossy once N > 2. χ(s(2P)) is not a function
    of χ(s(P)). The priced number is the absolute character sum.
    Doubling defines s. It is not a rho step, a factor-base relation,
    or an endomorphism-orbit walk. The sum distinguishes a
    constant-fraction bias from a mean-zero signing. It is not a
    claim that the bias is a discrete-log character.
  assumptions:
    - >-
      The model is fixed as y^2 = x^3 + x + 3 over F_47. Discriminant
      -16(4 + 27·9) = -16·247 ≠ 0, so E is an elliptic curve.
    - >-
      χ(0) is not used. Points with s(P) = 0, y(P) = 0, or P at
      infinity are excluded from N and from the sum.
    - >-
      The discrete log is not an input to χ(s(P)). The predicate uses
      field arithmetic only.
    - >-
      The pre-registered summation set is all domain points, including
      both P and -P. Negation preserves s, so each term is counted
      twice, and that double-counting is part of the claim.
  proof_search_map:
    bottleneck: >-
      The absolute value of one character sum at p = 47. If that
      value is below N/4, the constant-fraction reading of this
      coordinate is false on this curve.
    baseline_embedding:
      parameter_slice: >-
        The same points with χ(s(P)) replaced by independent uniform
        signs. That null has mean 0 and mean square N.
      reproduction_check: >-
        Recompute s(P) from λ^2 - x and from x + x(2P) on every
        domain point. Any disagreement voids the sum.
    observation_collision:
      observable: the integer sum of χ(s(P))
      distinct_preimage_search: >-
        Two different subsets of the domain with the same character
        sum are not distinguished by this observable. Record the
        subset of points with χ(s(P)) = 1 so a second implementation
        can recompute the integer without reusing the first code path.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The single integer sum of χ(s(P)) at (A, B, p) = (1, 3, 47).
        predicted_gain: >-
          Packs the bias question into one comparison with N/4, which
          either holds or fails. The predicted gain in the ECDLP
          exponent is zero.
    quantifier_order: >-
      For this one curve, the absolute sum is at least N/4. There is
      no universal quantifier over curves or over p.
    method_ceiling:
      strongest_certifiable_claim: >-
        A lower bound on one character sum at p = 47. The method
        cannot certify a bias that stays a constant fraction as p
        grows, and it cannot certify a discrete-log correlation.
      nearby_object_control: >-
        The same sum for χ(x(P)) on this curve. If χ(x) already meets
        its own quarter threshold, the doubling in s is not the
        source of a large sum. A random signing that meets N/4 at
        least 20 times in 200 draws voids the threshold.
    proof_obligations:
      - claim: The random-sign null has mean square N.
        responsibility: baseline
      - claim: >-
          The absolute sum is computed in F_47 arithmetic from both
          formulas for s.
        responsibility: correctness
      - claim: The inequality is only at p = 47 for this (A, B).
        responsibility: scope
    not_applicable_reason: >-
      No subfield is inapplicable. The sum is an exact integer on a
      47-element field.
  asymptotic_claim:
    problem: >-
      Single-target discrete log on a prime-order subgroup. This
      measurement prices one character sum rather than group
      operations.
    prior_best: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations, met by
      rho up to a constant. The file was opened 2026-10-07.
    time_exponent: >-
      Unchanged at 1/2. A character sum on one toy curve is not an
      exponent.
    memory_exponent: >-
      Unchanged. The p = 47 sum stores the rational points once.
    hidden_cofactor: >-
      No o(1) term is introduced. A later model that turned a
      constant-fraction bias into an attack would still face the
      question's sample count Theta(epsilon^{-2}). That model is not
      claimed here.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        A uniform random signing of N domain points has mean 0 and
        mean square N. For the validation sample, the curve sum is
        treated as comparable to a character sum of a degree-at-most-4
        map from E to the projective line, whose typical size is on
        the order of sqrt(p) rather than a constant fraction of N.
        The p = 47 claim is that this particular sum is atypically
        large relative to the random signing, with absolute value at
        least N/4.
      random_model_justification: >-
        Independence of fair signs gives mean square N. The degree
        bound is elementary: x(2P) is a degree-4 rational function of
        P, so s has degree at most 4 as a map to the line. The
        Weil-type estimate c·deg·sqrt(p) is the bound named and marked
        unverified in RQ-ECDLP-4fcbd3. It is not used as a proof that
        the p = 47 sum is small.
      supporting_results:
        - >-
          Degree at most 4 of s, stated in IDEA-20261006-5db10b
          heuristic H1. The Weil-level sentence is the recalled
          sentence inside RQ-ECDLP-4fcbd3. No external paper was
          opened for it.
      validation_experiment_ids:
        - EXP-ECDLP-340a9e
      falsification_condition: >-
        The p = 47 absolute sum is already below N/4, with the two
        formulas for s in agreement.
  structural_ingredients:
    - description: >-
        s(P) = x(P) + x(2P) equals λ(P)^2 - x(P), and s has degree
        at most 4 as a map to the line.
      citation: IDEA-20261006-5db10b
      provenance: internal
      verified_by: ledger/proposals/IDEA-20261006-5db10b.yaml
      role: degree bound used to name the typical size
    - description: >-
        Generic-group lower bound of Omega(N^{1/2}) group operations.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent this character sum does not move
    - description: >-
        Negation identifies s(P) with s(-P). The sum is unchanged by
        replacing P with -P, and no square-root-of-two walk is claimed.
      citation: KR-RHO-fb88e6
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
      role: sign relation that double-counts each term
    - description: >-
        x(P-Q) is nearly free given x(P+Q). The quantity here is
        x(P)+x(2P), a different rational function.
      citation: KR-RHO-fbd582
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd582.yaml
      role: nearby coordinate cost this sum does not use
  predictions:
    - metric: >-
        The absolute character sum of χ(s(P)), divided by N.
      direction: higher
      minimum_effect: >-
        The ratio is at least 1/4. The concrete negative is an
        absolute sum strictly below N/4.
  test_boundary:
    instances:
      - E: y^2 = x^3 + x + 3 over F_47
      - 200 independent uniform signings of the same N points
      - the same sum for χ(x(P)) on this curve
      - instrument curve y^2 = x^3 + x over F_47
    parameters:
      curve: (A, B, p) = (1, 3, 47)
      domain: affine points with y ≠ 0 and s ≠ 0
      random_signings: 200
      null_count_threshold: 20
      instrument_curve: y^2 = x^3 + x over F_47
    implementation: >-
      Missing. No committed program enumerates this curve, sums
      χ(s(P)), and compares the absolute value with N/4.
    budget:
      enforcement: advisory
      maximum_memory_gb: 1
      maximum_runs: 1
  falsification_conditions:
    - >-
      The absolute sum of χ(s(P)) is strictly below N/4, and the two
      formulas for s agree. The constant-fraction claim is then false
      on this curve.
    - >-
      At least 20 of the 200 random signings also meet N/4. The
      threshold does not separate the curve from the null at this
      sample size, so a pass of the inequality is not evidence of
      structure.
  interpretation_limits:
    - >-
      A sum at least N/4 at p = 47 does not change the rho exponent
      1/2. The question's break-even bias against rho is on the order
      p^{-1/4}, and only after a decay test in p.
    - >-
      One prime is not a concentration result. Toy output from this
      question does not satisfy GOAL-ECDLP-001 or GOAL-CRYPTO-001.
    - >-
      The claim as written sums over both P and -P.
  rerandomization: >-
    No re-randomizing walk is part of this hypothesis. The comparison
    is an exact sum on a 47-element field, with 200 uniform signings
    as the null of the same shape.
  status_note: >-
    Specified, not approved. EXP-ECDLP-340a9e is review_required
    because check_approval_capacity rejects an approval on
    GOAL-ECDLP-001 and because the doubling-sum character driver is
    missing.
