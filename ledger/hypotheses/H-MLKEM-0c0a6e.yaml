      nothing is reportable.
    - >-
      F3. G3's graded positive control does not fire, or its slope leaves
      [0.8, 1.2], or it is non-monotone. The estimator does not measure collision
      energy; NO NEGATIVE RESULT MAY BE REPORTED.
