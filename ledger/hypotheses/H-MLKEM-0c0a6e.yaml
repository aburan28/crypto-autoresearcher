  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, THE PRIMARY FALSIFIER). Stage 0 finds that Ducas-Pulles
      already measure this quantity, or that MATZOV's Nf carries a covariance
      term the pinned code drops. In the first case the hypothesis is dominated
