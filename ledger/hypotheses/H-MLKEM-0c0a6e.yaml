  reduction_chain:
    core_problem: >-
      Measure the departure of the across-candidate second moment of the
      dual-FFT distinguisher's score vector from the value MATZOV.Nf's
      independence structure forces, at toy dimensions, and express it as a
      signed correction to Nf's sample count.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this measurement to any
      statement about FIPS 203 parameters, about ML-KEM's security categories, or
      about whether the dual attack beats the primal attack. KN-OPEN-016 asks the
      last of those and is NOT closed, narrowed or advanced by a toy-dimension
      second-moment measurement. Any citation of this hypothesis toward a
      crypto-scale cost must carry HEUR-PAR-3 by name and its unmet status.

  predictions:
    - metric: >-
        G1 - Parseval residual: |sum_{s'}|That(s')|^2 / D - sum_u |T[u]|^2|
        divided by sum_u |T[u]|^2, on every arm of every cell
      direction: lower
      minimum_effect: >-
        Below 1e-12 in double precision. Predicted value is 0; this is an
        identity. It is the first gate and a failure voids the package.
    - metric: >-
        G2 - matched-null departure: mean delta over >= 16 NULL-U draws per cell
      direction: different
      minimum_effect: >-
        EXACTLY 0 as the forced value, with acceptance |mean delta_null| <=
        2 * sd_pred(delta_null) from HEUR-PAR-2 evaluated at that cell's own
        (N, D, abar) BEFORE the real arm is read. The null CAN fail; a failure is
        a finding about the model, pre-registered as such.
    - metric: >-
        G3 - graded positive control: measured delta at duplication fractions
        f in {0, 0.02, 0.05, 0.10, 0.20}
      direction: higher
      minimum_effect: >-
        FORCED VALUE delta = f exactly. Acceptance: least-squares slope in
        [0.8, 1.2], monotone non-decreasing across all five points, and the f = 0
        point inside G2's band. IF G3 FAILS, THE INSTRUMENT IS BROKEN AND NO
        NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.
    - metric: >-
        G4 - null-band calibration across the load-factor ladder:
        mean delta_null at lambda = N/D in {0.25, 1, 4, 16}
      direction: different
      minimum_effect: >-
        EXACTLY 0 at every lambda, within 2 sd_pred at each. A monotone drift in
        lambda is an estimator bias; it must be corrected before the real arm is
        read, and it is the audit that decides whether the projection is lossy in
        the regime where the statistic has content.
    - metric: >-
        G5 - real-arm departure: delta on the certified sieve pool, per cell,
        over >= 3 independent instances
      direction: different
      minimum_effect: >-
        NO VALUE PREDICTED, BY DESIGN. What is pre-registered is the resolution
        (|delta| must exceed 3 sd_pred to be called resolved) and the three
        admissible reportable outcomes: AGREEMENT (unresolved, which
        GOAL-MLKEM-004's scope_discipline declares as publishable as departure),
        delta > 0 (Nf understates N), delta < 0 (Nf overstates it). The bit
        statement is log2(1 + delta) and nothing more.
    - metric: >-
        G6 - nearby-object separation: |delta_sieve - delta_nonsieve| at matched
        norms, for the BKZ-row family and the random-lattice-point family
      direction: different
      minimum_effect: >-
        Reported with its sign and its uncertainty; no target asserted. If it is
        below 3 sd_pred, the headline must state that delta is not a property of
        sieve output.
    - metric: >-
        G7 - skirt energy: (energy in the declared coherent neighbourhood minus
        |That(s_fft)|^2)/N, against Nf's exp(k_fft/3 (sigma_s pi/p)^2)
      direction: different
      minimum_effect: >-
        Same sign, and within a factor of 2, if the factor's reconstructed
        derivation (HEUR-PAR-4) is right. First measurement of that factor in
        this corpus; batch 2 recorded it as "identically 1 and untestable" in the
        campaign's geometry.
    - metric: >-
        G8 - D_eff = exp(max over wrong candidates of score^2 / (N (1 + delta))),
        reported with its spread
      direction: lower
      minimum_effect: >-
        NO FORCED VALUE EXISTS AND NONE IS CLAIMED. Under the independence
        structure D_eff = D. This is the residual the energy identity does not
        determine; naming it before the run is what prevents it from being
        pursued for three batches and then shown forced.

