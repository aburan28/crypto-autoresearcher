# =============================================================================
# H-BINSTD-32867d -- Restart-portfolio IC∪rho: Stage-0 symbolic V(β) floor
# and controlled-null per-attempt cost shape on the pure-Python W4 closure.
# Specified and approved under DEC-20261001-362f47 from
# IDEA-20260922-793fd8 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. IDEA-20260922-793fd8 claim text is not
# edited (proposals immutable). Incorporates HOLD-U / defective-mechanism
# review (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-793fd8.yaml):
# floor condition tightened to ratio < 1; portfolio min-race needs
# alpha_tail <= 1 on per-attempt cost (not CV > 1); available instrument
# is deterministic closure (controlled null), not CDCL. No exponent. No break.
# =============================================================================
hypothesis:
  id: H-BINSTD-32867d
  question_id: RQ-BINSTD-b6f698
  related_question_ids:
    - RQ-ICPERF-94c86e
  source_idea: IDEA-20260922-793fd8
  experiment_id: EXP-BINSTD-b7344f
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-362f47
  proposed_by: coordinator
  title: >-
    Portfolio IC∪rho cannot beat pure rho when IC is concentrated at floor
    ratio >=1; measure controlled-null CV on W4 closure (not CDCL)

  statement: >-
    SETTING. IDEA-20260922-793fd8 proposed that a concurrent restart
    portfolio of index calculus (Luby restarts) and matched Pollard rho,
    stopped at the first certificate, can beat pure rho only if (i) IC
    attempt costs are heavy-tailed AND (ii) IC's median full-pipeline cost
    is within ~two orders of magnitude of rho's. The 2026-09-26 BINSTD
    review (HOLD-U) found the mechanism defective as stated: in the
    concentrated-IC / exponential-rho limit, V(β) <= 0 for ALL β in (0,1)
    whenever the floor ratio ρ = mu_IC/mu_rho is >= 1 (derived: t-1 >= ln t
    at t=1/β); a sum of many i.i.d. attempt costs concentrates (LLN), so
    a heavy UPPER tail on single attempts does not produce a heavy LOWER
    tail on the pipeline total unless alpha_tail <= 1 (infinite mean);
    on ECC2K-130 the product-law FREE-oracle floor already exceeds rho at
    m <= 3; and no CDCL engine is installed — only the pure-Python
    bounded-degree W4 closure (EXP-CERTBIN-e94b27), whose cost is
    essentially deterministic by construction.

    CLAIM (experimental reading frozen here).
    (A) STAGE 0 (zero scientific ECDLP runs): symbolically verify V(0)=0
    and V(β)<=0 for deterministic IC at ρ>=1 on a β-grid; commit the
    closed-form V(β) table; compute product-law floor ratios for
    ECC2K-130 at m in {2,3,4,5,8} against rho ~2^60.81 — deciding the
    portfolio claim by ARITHMETIC at m<=3 (floor above rho) and leaving
    m>=4 as the arity/oracle question, not a portfolio question.
    (B) STAGE 1 (controlled null): on CERTBIN RC-1 (n=17, l=9, |V|=512),
    measure per-instance int32 operation-count CV, max/median, and Hill
    alpha_tail (bootstrap CI) for the W4 closure on the archived 400
    unsat targets (KN-FIND-5a8d3e) plus 100 planted sat targets, sat and
    unsat SEPARATELY; random-V and random-dense matched-shape controls.
    PREREGISTERED: CV < 0.1 (instrument-deterministic null). Any CV > 1
    is an instrument finding to diagnose first — NOT portfolio evidence.
    (C) STAGE 2 (schema + hold): write the ICPERF boundary-table
    distribution-column schema request (CV, max/median, Hill alpha+CI,
    watchdog-exclusion rate) as bycatch for when a SAT engine is
    installed; declare the rho∪IC portfolio claim HELD for ECC2K-130 at
    m<=3 by Stage-0 arithmetic; do NOT authorize a CDCL portfolio
    experiment without engines.

    NO ATTACK. NO EXPONENT. NO BREAK. certificate.kind: none for Stage 0/2;
    decomposition only if a planted sat target's closure is counted as a
    verified relation (optional; primary metrics are cost-shape).

  statement_note: >-
    IDEA-20260922-793fd8 claim text is immutable and left at status
    proposed. This hypothesis freezes the REVIEW-CORRECTED experimental
    reading: Stage-0 symbolic floor dominance, Stage-1 controlled-null
    closure cost shape, Stage-2 schema/hold — not the original portfolio
    measurement that the review showed cannot produce V>0 under the
    stated conditions.

  mechanism: >-
    OBJECT FRAME. Tracked object: (1) the scheduling portfolio value
    V(β)=E[T_rho]-E[min(T_IC(β),T_rho(β))] under concentrated-IC /
    exponential-rho; (2) the empirical per-instance cost distribution of
    the pure-Python W4 closure (controlled null for CDCL). Representation:
    no new point representation — Stage 1 reuses EXP-CERTBIN-e94b27
    RC-1 instances. Operation set for Stage 0 is symbolic algebra on V(β);
    for Stage 1 is the existing W4 closure pass (linear-algebra cost,
    essentially deterministic). Trichotomy: Class III (schedule /
    instrument measurement). Lossy projection: Stage 0 discards all
    engine internals and retains only (ρ, β); Stage 1 retains only
    per-instance operation counts. OFF-LIMITS: F1/F2 as attack stages —
    neither rho nor full IC pipeline is RUN as an attack; Stage 0 prices
    them symbolically / by product law; Stage 1 measures a local
    instrument only. Limb (D) of the IDEA (partial-FB rho jump set) remains
    scoped out.

  assumptions:
    - >-
      Review correction binds: floor condition is ρ < 1 (not <100); the
      portfolio min-race needs per-attempt alpha_tail <= 1 to avoid
      concentration — CV > 1 alone is insufficient (HOLD-U).
    - >-
      Product-law FREE-oracle floor at ECC2K-130 is an arithmetic lower
      bound independent of V (relations × targets × oracle = m·2^131);
      no draw goes below a floor.
    - >-
      EXP-CERTBIN-e94b27 W4 closure cost is essentially deterministic
      (fixed linear-algebra pass); Stage 1 is a CONTROLLED NULL for
      CDCL heavy-tail claims, not a substitute measurement of WDSat /
      CryptoMiniSat / CaDiCaL / Macaulay2.
    - >-
      CDCL engines named in RQ-ICPERF-94c86e are NOT installed; absence
      is an impediment for any backtracking-tail claim, never negative
      evidence about those engines.
    - >-
      Gomes–Selman–Crato and Luby–Sinclair–Zuckerman remain provenance
      recalled (IDEA); they are pointers only and do not support
      measured outcomes.
    - >-
      No deployed-curve portfolio value is claimed; Stage-0 ECC2K-130
      floor ratios are arithmetic bounds, not attack measurements.

  proof_search_map:
    bottleneck: >-
      Whether V(β) can be positive under concentrated IC: decided by the
      floor ratio ρ = mu_IC/mu_rho. When ρ >= 1, symbolic algebra gives
      V(β) <= 0 for all β. Separately: whether the local W4 instrument
      has near-zero CV (controlled null expectation).
    baseline_embedding:
      parameter_slice: >-
        β=0 → V(0)=0 by construction (pure rho). ρ→∞ with concentrated
        IC → V(β)<0 for β>0. CV→0 on the closure → controlled null.
      reproduction_check: >-
        Stage 0: re-derive V(β)<=0 for ρ>=1 on a β-grid (t-1 >= ln t);
        match HOLD-U numeric checks at ρ in {1,1.5,2,10,100}. Stage 1:
        CV < 0.1 on RC-1 W4 vs random-V / random-dense controls of
        matched matrix shape.
    observation_collision:
      observable: >-
        Scalar "hybrid helps / does not" or "attempt costs are heavy-tailed"
      distinct_preimage_search: >-
        Positive V could be genuine portfolio effect, infra truncation of
        the IC tail, mis-specified rho model, or simulation noise — HOLD-U
        already closes positive V at ρ>=1 by algebra. A large CV on the
        W4 closure could be genuine data-dependent blow-up OR watchdog /
        memory-pressure artifact (AGENTS.md rule 3) — infra exclusions
        must be logged separately.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Separate Stage-0 symbolic floor decision from Stage-1
          instrument-null cost-shape measurement; do not conflate
          controlled-null CV with CDCL heavy-tail claims.
        predicted_gain: >-
          Closes the portfolio question at m<=3 by arithmetic; yields a
          reusable distribution-column schema for ICPERF when engines
          arrive. No attack exponent moved.
    quantifier_order: >-
      FOR ALL β in (0,1) and all ρ >= 1: under deterministic IC and
      exponential rho, V(β) <= 0 (Stage 0, derived). FOR the RC-1 W4
      instrument: PREDICTED CV < 0.1 (Stage 1 controlled null). NOT
      CLAIMED: any statement that CDCL engines are thin- or heavy-tailed.
      NOT CLAIMED: V>0 on any deployed curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        (1) Symbolic V(β) table and product-law floor ratios at named m;
        portfolio held at ECC2K-130 m<=3. (2) Measured CV / max/median /
        Hill alpha on W4 closure at RC-1 with controls and infra-exclusion
        rate. Cannot certify CDCL tails; cannot certify a positive
        portfolio without engines and without ρ<1.
      nearby_object_control: >-
        Random-V subspace of matched dimension; random-dense GF(2)
        systems of matched matrix shape; sat vs unsat reported separately;
        optional ordinary-vs-Koblitz note (RC-1 is ordinary).
    proof_obligations:
      - claim: V(0)=0 and V(β)<=0 for ρ>=1 verified symbolically / on grid
        responsibility: baseline
      - claim: Product-law floor ratios tabulated for m in {2,3,4,5,8}
        responsibility: size
      - claim: Stage-1 CV < 0.1 on W4 (or diagnosed as instrument finding)
        responsibility: baseline
      - claim: Infra exclusions logged; never folded into finished sample
        responsibility: scope
      - claim: No CDCL / no break / no exponent / no V>0 claim from Stage 1 alone
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      ECDLP on standardized binary curves (RQ-BINSTD-b6f698) — whether a
      restart-portfolio composition of index calculus and matched Pollard
      rho can beat pure rho
    prior_best: >-
      Matched Pollard rho with curve symmetries under van Oorschot–Wiener
      (~2^60.9 for ECC2K-130; KN-LIT-096 / program baseline)
    time_exponent: n/a
    memory_exponent: n/a
    hidden_cofactor: >-
      Concurrent-execution overhead unmodelled in idealised V(β); product-
      law FREE-oracle floors are lower bounds (optimistic on oracle cost)
    claim_kind: cost_model_correction

  heuristic_assumptions:
    - id: HEUR-BINSTD-32867d-H0
      formal_statement: >-
        NONE for Stage-0 algebra. Under deterministic IC completion at
        mean mu_IC = ρ · mu_rho with ρ >= 1 and exponential rho, V(β) <= 0
        for all β in (0,1). This is a derived identity of the model, not
        a distributional heuristic.
      random_model_justification: >-
        Deterministic algebraic consequence of the concentrated-IC /
        exponential-rho model used in HOLD-U; no random-model gap for
        the inequality itself.
      supporting_results:
        - analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-793fd8.yaml (internal)
        - IDEA-20260922-793fd8 Stage-0 / claim (C) (internal)
      validation_experiment_ids:
        - EXP-BINSTD-b7344f
      falsification_condition: >-
        Stage-0 grid finds any (ρ>=1, β) with V(β)>0 under the stated
        closed-form model → derivation error; withdraw until corrected.
    - id: HEUR-BINSTD-32867d-H1
      formal_statement: >-
        (Controlled null.) On CERTBIN RC-1, the pure-Python W4 closure's
        per-instance int32 operation-count coefficient of variation
        satisfies CV < 0.1 for both the archived unsat set and the
        planted sat set when infra failures are excluded and reported
        separately. This is an instrument expectation, NOT a claim about
        CDCL/SAT engines.
      random_model_justification: >-
        The W4 closure is a fixed-shape linear-algebra pass over a
        deterministic Macaulay / mutant matrix for a fixed target; absent
        data-dependent early abort that changes dominant cost by orders
        of magnitude, relative spread should be tiny. Interpolates:
        deterministic matrix-size formula (rigorous for fixed shape) +
        empirical CV measurement (this experiment).
      supporting_results:
        - EXP-CERTBIN-e94b27 closure instrument (internal)
        - KN-FIND-5a8d3e archived unsat targets (internal)
        - HOLD-U concrete_experiment controlled-null prediction (internal)
      validation_experiment_ids:
        - EXP-BINSTD-b7344f
      falsification_condition: >-
        CV > 1 on either sat or unsat set with infra-exclusion rate
        <10% → instrument finding (data-dependent blow-up); diagnose
        before any portfolio reading. CV in [0.1, 1] → report and
        interpret cautiously (borderline), not as CDCL evidence.

