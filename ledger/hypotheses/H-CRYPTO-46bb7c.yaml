hypothesis:
  id: H-CRYPTO-46bb7c
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  recorded_at: '2026-09-13'
  converts_idea: IDEA-20260905-afa907
  converts_idea_note: >-
    Selected as one of exactly 2 unconverted proposals on RQ-CRYPTO-001 per
    `python3 tools/audit_proposal_backlog.py --question RQ-CRYPTO-001 --list`.
    Chosen over the sibling proposal IDEA-20260905-0d50d6 (an
    algebraic-geometry sheaf-monodromy transfer-lemma proposal) because this
    proposal's own `minimal_test` is a concrete, dependency-free, finite-table
    computation on cyclic groups of order 11 and 17 and cosets of Z/15,
    executable with plain exact arithmetic -- no PARI, Sage, GAP, or other
    unverified infrastructure required -- while the sibling requires genuine
    unproved algebraic-geometry theorem work with no clear decidable success
    criterion at this stage. Selection made by the orchestrating session;
    pre-allocated IDs supplied to this task and not re-litigated here.
  designed_by: TASK-20260913-154303
  experiment_contract: EXP-CRYPTO-3713bf
  refines: null
  statement: >-
    THE OBJECT UNDER TEST, PRECISELY. Fix a prime-order cyclic group G = Z/N
    (N prime) and a fixed public feature map v on G partitioning G into
    feature-fibers. Fix a restricted operation "grammar": a small, declared
    set of group operations available to a simulator (e.g. multiplication by
    one fixed small generator, or addition of one of a small fixed set of
    shifts) -- explicitly NOT the full translation group (every group element
    available as an operation). Define the HISTORY-CONDITIONED TRANSITION
    KERNEL on features as the conditional law of the next feature given the
    current feature and the applied operation, using ONLY feature-level
    information, never the underlying group element. Define delta_t as the
    maximal total-variation distance between two group elements' competing
    transition laws inside the same feature-fiber, conditioned on a
    length-t history of allowed operations. THE HYPOTHESIS UNDER TEST: for at
    least one restricted (non-full-translation) operation grammar, delta_t
    (or its associated fiber-size / description-length proxy) is measurably
    BELOW the value obtained for matched random balanced partitions of the
    same group with the same cell-size multiset and the same operation count,
    while for the SAME feature map with the full translation group added,
    that separation disappears -- either collapsing into the random-partition
    range or exposing that the "feature" secretly carries full state (fiber
    sizes collapsing toward singletons). BOTH OUTCOMES ARE INFORMATIVE: a
    confirmed separation is evidence that a restricted grammar can support an
    approximately lumpable feature dynamics; an absent separation, or a
    non-collapsing full-translation control, is an equally reportable
    negative result about this mechanism at this scale. THIS EXPERIMENT MAKES
    NO DISCRETE-LOGARITHM CLAIM AND NO GENERIC-LOWER-BOUND CLAIM. It targets
    only a small, self-contained, finite-table mathematical diagnostic about
    approximate lumpability of Markov-style feature dynamics, feeding a
    downstream gate per the proposal's own
    `goal_applicability.GOAL-CRYPTO-001` text ("a prerequisite ... it does
    not meet cryptographic completion"), never a complete algorithm and never
    a claim against GOAL-CRYPTO-001's own completion criteria.
  mechanism: >-
    (a) Fix G = Z/N for N in {11, 17} -- both self-generated, non-crypto-scale
    groups chosen purely for exhaustive enumerability. (b) Fix three partition
    families of G into feature-fibers: (i) COORDINATE-STYLE -- an explicit,
    cheap, publicly computable coordinate rule, fixed before any run: the
    fiber of x in Z/N is its residue modulo a small declared divisor-free
    modulus m (m=3 for N=11, giving fibers of size ~11/3; m=4 for N=17,
    giving fibers of size ~17/4; exact cell-size multiset recorded in the
    experiment contract's `test_boundary.parameters`); (ii) MATCHED-RANDOM --
    uniformly random balanced partitions of G with the identical cell-size
    multiset as (i), drawn (or exhaustively enumerated when feasible, per the
    experiment contract) with a fixed declared seed; this is the matched_null
    control; (iii) KNOWN-FALSE COSET CONTROL -- the genuine coset partition
    of the auxiliary composite-order group Z/15 by its subgroup structure
    (e.g. cosets of the order-5 or order-3 subgroup). Z/15 is NOT prime-order
    and has an EXACT (not merely approximate) quotient structure, so this
    control MUST show exact propagation (delta_t = 0 for every tested t)
    and MUST remain distinguishable from the prime-order cases; if it does
    not, the diagnostic itself is broken and no prime-order reading is
    trusted (mirrors CTL-2-GRH-BASELINE's role in H-ECRANK-7f0ec1: a
    known-answer control gates interpretability of everything else). (c) For
    the declared restricted operation grammar, build the exact conditional
    one-step transition table of each partition family by FULL ENUMERATION
    (both groups have order <=17, so this is exact, not sampled or
    approximated). (d) Compute delta_t for t in a small fixed range (t = 1..4)
    by exact composition of the one-step kernels, for every one of the three
    partition families, under the restricted grammar. (e) Separately repeat
    steps (c)-(d) with the FULL TRANSLATION GROUP (every group element
    available as an operation) to test the predicted collapse of any
    separation found in (d).
  assumptions:
  - >-
    G has prime order N for the two test groups (Z/11, Z/17); the auxiliary
    Z/15 control is explicitly non-prime-order and is used only as the
    known-false/known-exact comparator, never as a prime-order reading.
  - >-
    Features and partitions are fixed in advance, before any specific
    "secret" scalar or group element is considered -- the classification into
    fibers cannot be gamed by post-hoc partition choice conditioned on a
    target instance. This mirrors the proposal's own stated assumption
    ("features and operation family are fixed without scalar-dependent
    advice").
  - >-
    State description length, feature evaluation, and conditional-kernel
    access are all charged/counted resources, matching the proposal's second
    stated assumption; average-case and worst-history defects are treated as
    distinct quantities and neither is silently substituted for the other.
  proof_search_map:
    bottleneck: >-
      The exact enumeration-and-comparison step that decides everything: does
      the coordinate-style partition's history-conditioned delta_t, under the
      restricted grammar, fall below the matched-random-partition delta_t
      range on the SAME finite data (same group, same cell-size multiset,
      same operation count, same t)? Every other computation in this design
      (the coset control, the full-translation arm) exists to make that one
      comparison interpretable rather than to answer a different question.
    baseline_embedding:
      parameter_slice: >-
        The matched_null control fixture exactly as the proposal's
        `minimal_test.controls[0]` specifies: random balanced partitions of
        the same group with an identical cell-size multiset and an identical
        operation count to the coordinate-style partition under test.
      reproduction_check: >-
        An exact identity check that must pass BEFORE any prime-order result
        is reported: the Z/15 known-false coset control must show delta_t = 0
        (exact propagation) at every tested t. A diagnostic that cannot even
        reproduce the coset case as exact has found nothing about the
        prime-order cases and its output is uninterpretable, mirroring
        H-ECRANK-7f0ec1's CTL-2-GRH-BASELINE pattern (known-answer control
        gates everything downstream).
    observation_collision:
      observable: >-
        delta_t (total-variation distance between competing transition
        laws), fiber sizes, and description length of the history-conditioned
        transition kernels -- matching the proposal's own stated observable
        exactly.
      distinct_preimage_search: >-
        Hold the observable (delta_t) fixed and vary the underlying
        group-element-to-fiber assignment while keeping the same feature/fiber
        SHAPE (same cell-size multiset, same modulus family): check whether a
        low delta_t is an artifact of one lucky coordinate-rule labelling
        rather than a property of the coordinate-style family in general, by
        re-running the coordinate-style measurement with at least one
        independently chosen coordinate rule of the same family (e.g. a
        different small modulus, or a shifted residue rule) and confirming
        the separation (or its absence) is not overturned.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: history-conditioned transition kernel
      predicted_gain: >-
        the specific delta_t separation stated in `predictions` P1 (the
        coordinate-style restricted-grammar kernel measurably below the
        matched-null delta_t range) paired with the full-translation
        collapse stated in P2.
    quantifier_order: >-
      FOR EACH fixed grammar and feature map v, FOR EVERY allowed history h
      of length t, THERE EXISTS one feature-transition kernel valid for every
      state in that conditional fiber. Finding this for the ONE tested
      grammar/feature pair on Z/11 and Z/17 does NOT generalize to all
      features or all grammars, and no such generalization is claimed or
      tested anywhere in this hypothesis or its experiment; any extension to
      a different grammar, a different feature map, or a larger group is new,
      separately frozen work.
    method_ceiling:
      strongest_certifiable_claim: >-
        A finite-grammar, finite-group approximate-simulability result on
        exactly two explicit small groups (Z/11, Z/17) under one declared
        restricted grammar and one declared coordinate-style partition
        family. No general decision procedure over grammars or features, no
        asymptotic claim, and no attack on any cryptographic instance is made
        or certifiable from this design.
      nearby_object_control: >-
        The Z/15 known-false coset fixture (mechanism step (b)(iii)): a
        partition with genuine, exact quotient structure that this diagnostic
        must correctly classify as exact (delta_t = 0) and must not confuse
        with the approximate prime-order cases.
    proof_obligations:
    - claim: >-
        The fiber/kernel construction for every partition family is verified
        against brute-force group multiplication tables (both groups have
        order <=17, so a full multiplication-table cross-check is exact and
        cheap).
      responsibility: correctness
    - claim: >-
        The matched_null and known_false controls are demonstrably separated
        from the coordinate-style prime-order reading: the coset control
        shows exact propagation (delta_t = 0) and the matched-null
        distribution is drawn/enumerated independently of the coordinate rule
        under test.
      responsibility: baseline
    - claim: >-
        Construction cost and peak memory for every enumeration are charged
        and recorded; both groups are tiny (order <=17) so this obligation is
        a sanity check on the implementation, never a scaling or complexity
        claim.
      responsibility: runtime
    - claim: >-
        No claim is made or implied beyond the two tested groups (Z/11,
        Z/17), the one tested restricted grammar, and the one tested
        coordinate-style partition family; any transfer to other groups,
        grammars, or cryptographic scale is explicitly out of scope.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: none
  rerandomization_note: >-
    All group elements are enumerated exhaustively (N <= 17 in every tested
    group, including the Z/15 control), so no sampling is used for the
    coordinate-style or known-false partitions or for the transition-kernel
    construction. The matched-null partitions are drawn (or, where feasible,
    exhaustively enumerated over the matched cell-size shape) using a fixed
    declared seed of 20260913, to be recorded exactly in the experiment
    contract's `replication.seeds` field -- this is a reproducibility device
    for a fixed control fixture, not a worst-to-average-case reduction or a
    re-randomizing walk of any kind. Nothing in this hypothesis performs or
    relies on a rerandomization argument.
  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity-improvement or exponent claim is made anywhere in this
    hypothesis or its experiment. This is a finite combinatorial diagnostic
    on two explicitly named small groups (Z/11, Z/17) plus one auxiliary
    control group (Z/15); nothing here reduces the cost of solving ECDLP or
    any other central hard problem, so the four asymptotic-claim promotion
    gates of AGENTS.md do not engage.
  heuristic_assumptions:
  - id: HEUR-1
    formal_statement: >-
      For a fixed prime-order group G = Z/N, a fixed public coordinate-style
      feature map v (an explicit small-modulus residue rule), and a fixed
      restricted (non-full-translation) operation grammar, the
      history-conditioned transition-kernel defect delta_t of v under that
      grammar can be strictly and measurably smaller than the delta_t
      obtained from a uniformly random balanced partition of G with the same
      cell-size multiset and the same operation count, for at least one
      tested t in {1,2,3,4}; and this separation is destroyed (delta_t rises
      into, or above, the matched-random range, or fiber sizes collapse
      toward singletons) when the full translation group is added to the
      grammar.
    random_model_justification: >-
      WEAK, HONESTLY STATED SUPPORT. The only rigorous fact available here is
      the general theory of LUMPABLE (exactly quotientable) Markov chains:
      a partition of a Markov chain's state space is exactly lumpable if and
      only if the one-step transition probabilities out of every state in a
      given cell, summed into each other cell, agree across all states of
      that cell (the classical Kemeny-Snell lumpability criterion for finite
      Markov chains) -- under that EXACT partition-respecting structure,
      delta_t is identically zero for all t. This is the rigorous boundary
      case the Z/15 coset control is built to exhibit. NO rigorous theorem is
      recalled here that a coordinate-style partition of a GROUP's Cayley-like
      dynamics should have smaller APPROXIMATE lumpability defect than a
      matched random partition under a merely restricted (not full) operation
      grammar -- this is the untested, model-level step, and this experiment
      is precisely the check of it, not a consequence of it. Support is
      therefore marked weak and recalled, not retrieved or verified; if no
      stronger supporting theorem is known to any reviewer, that gap should
      be recorded as such rather than papered over.
    supporting_results:
    - description: >-
        Kemeny-Snell lumpability criterion for finite Markov chains (exact
        quotient partitions have identically zero transition-law defect).
      citation: >-
        Kemeny and Snell, "Finite Markov Chains" (1960), standard
        lumpability criterion; recalled from general knowledge, not
        independently re-read for this record.
      provenance: recalled
      verified_by: null
      role: >-
        fixes the delta_t = 0 boundary case that the Z/15 known-false
        control is designed to exhibit; provides no support for the
        approximate, restricted-grammar separation claim itself, which is
        untested by any rigorous result known to this task.
    validation_experiment_ids:
    - EXP-CRYPTO-3713bf
    falsification_condition: >-
      Either (a) the coordinate-style partition's delta_t falls within the
      matched-random-partition delta_t range at every tested t (1..4) and
      under the one tested restricted grammar, showing no separation; OR
      (b) the Z/15 known-false control fails to show exact propagation
      (delta_t != 0 at some tested t), which invalidates the diagnostic
      itself and makes any prime-order reading uninterpretable rather than
      negative.
  structural_ingredients:
  - description: >-
      Generic-group algorithms require expected square-root-order work; cited
      only as background context establishing the generic-model baseline
      this experiment does not test, challenge, or attempt to beat.
    citation: >-
      Shoup, "Lower Bounds for Discrete Logarithms and Related Problems"
      (1997)
    provenance: recalled
    verified_by: null
    role: >-
      generic-model baseline used only as context; not a bound this
      experiment tests, challenges, or attempts to improve on. Carried
      forward from the converted proposal's own citation, not independently
      re-verified by this task.
  - description: >-
      The proposal converted into this hypothesis: its claim, mechanism,
      minimal_test design, controls, assumptions, and proof_search_map are
      the direct source of this record's statement, mechanism, and
      proof_search_map fields.
    citation: ledger/proposals/IDEA-20260905-afa907.yaml
    provenance: internal
    verified_by: TASK-20260913-154303
    role: the proposal converted by this hypothesis.
  reduction_chain:
    core_problem: null
    core_problem_note: >-
      Not a reduction-chain hypothesis. This is a finite combinatorial
      diagnostic about approximate lumpability of feature dynamics, not a
      construction reducing one computational problem to another; no
      corollary problem is claimed to be reached from any core result here.
    corollaries: []
  predictions:
  - id: P1
    metric: >-
      delta_t (total-variation distance) of the coordinate-style partition
      family under the restricted operation grammar, at t = 1 (and,
      secondarily, at t in {2,3,4}), compared against the delta_t
      distribution of matched-random balanced partitions of the identical
      cell-size multiset and identical operation count.
    direction: >-
      lower than the matched-null range -- the coordinate-style delta_t at
      t=1 falls at or below the minimum of the matched-null delta_t
      distribution.
    minimum_effect: >-
      the coordinate-style delta_t at t=1 falls at or below the minimum of an
      explicitly enumerated or sampled matched-null delta_t distribution over
      at least 20 independently drawn random balanced partitions of the
      identical cell-size multiset; because both groups are small enough that
      exhaustive enumeration of ALL balanced partitions of a given cell-size
      shape may be feasible, exact enumeration is PREFERRED over sampling
      wherever the experiment contract confirms it is computationally
      feasible, and the contract states explicitly which mode (exhaustive or
      >=20-sample) was used for each group. Negative branch, stated as a real
      possible and informative outcome, not a failure: if the coordinate-style
      delta_t falls inside the matched-null range at every tested t, this
      hypothesis's central mechanism finds no separation at this scale and
      that is reported as a genuine negative result, not an infrastructure
      failure.
  - id: P2
    metric: >-
      the same delta_t / fiber-size / description-length quantities as P1,
      recomputed with the FULL TRANSLATION GROUP (every group element
      available as an operation) added to the grammar.
    direction: >-
      the separation found in P1 (if any) disappears -- delta_t under the
      full-translation grammar rises into or above the matched-random range,
      or the fiber-size / description-length proxy collapses toward the
      full-state table (singleton fibers), showing the coordinate feature
      secretly carried full state once unrestricted translations are
      available.
    minimum_effect: >-
      the coordinate-style delta_t under the full-translation grammar is no
      longer below the minimum of the matched-null delta_t range at t=1 (the
      same threshold used in P1), OR the fiber-size / description-length
      proxy collapses to within a small stated tolerance of the full |G|-state
      table. Negative branch, stated as informative rather than a failure: if
      the P1 separation persists unchanged under full translations, that
      means the "restricted vs full grammar" framing carries no explanatory
      power at this scale, and this is reported as a finding about the
      mechanism's limits, never suppressed or re-run to seek a different
      answer.
  test_boundary:
    instances:
    - Z/11 (prime-order test group)
    - Z/17 (prime-order test group)
    - >-
      Z/15 (auxiliary known-false coset-quotient control group; not
      prime-order)
    parameters:
      coordinate_style_modulus:
        Z/11: 3
        Z/17: 4
      restricted_grammar: >-
        multiplication by one fixed small generator of the group, or addition
        of one of a small fixed set of shifts -- exact generator/shift set
        and its size fixed and recorded in the experiment contract before any
        run.
      full_translation_grammar: >-
        every group element available as an additive shift (the complete
        translation group).
      t_range: [1, 2, 3, 4]
      matched_null_draw_count_or_enumeration: >-
        at least 20 independently drawn random balanced partitions per group
        per cell-size shape, OR full enumeration of all such partitions where
        the experiment contract confirms feasibility -- see EXP-CRYPTO-3713bf
        controls block for the exact mode used per group.
      fixed_seed: 20260913
    implementation: >-
      A self-contained Python script performing exhaustive group enumeration
      and exact rational/fraction arithmetic (Python's `fractions.Fraction`)
      for every total-variation-distance computation; no external
      mathematics package (PARI, Sage, GAP) is required or used.
    budget: see experiments/EXP-CRYPTO-3713bf/specification.yaml budget block
  falsification_conditions:
  - >-
    The Z/15 known-false coset control fails to show exact propagation
    (delta_t != 0 at some tested t). This means the diagnostic itself is
    broken and invalidates any prime-order reading; it is reported as an
    invalid-measurement finding about the diagnostic, never as evidence for
    or against P1/P2.
  - >-
    P1 fails: the coordinate-style partition's delta_t is indistinguishable
    from (falls within) the matched-random-partition delta_t range at every
    tested t under the one tested restricted grammar. This is a real,
    reportable negative result about this mechanism at this scale, not an
    infrastructure failure.
  - >-
    P2 fails: the full-translation grammar does not produce the predicted
    collapse (the P1 separation, if found, persists essentially unchanged).
    This means the restricted-vs-full-grammar framing carries no explanatory
    power at this tested scale and is reported as a finding against the
    mechanism's specific story, never suppressed or silently re-parameterized
    to seek a different answer.
  interpretation_limits:
  - >-
    NO DISCRETE-LOGARITHM CLAIM is made anywhere in this hypothesis or its
    experiment. No group element is ever recovered from a feature; no
    simulator that solves any instance of ECDLP or a related problem is
    built, tested, or claimed.
  - >-
    NO GENERIC-LOWER-BOUND CHALLENGE is made or implied. The Shoup 1997
    baseline cited in `structural_ingredients` is background context only.
  - >-
    NO CLAIM BEYOND Z/11, Z/17, AND THE Z/15 CONTROL is made. A result here
    does not transfer to any other group, any other operation grammar, any
    other feature map, or any cryptographic-scale instance without a
    separately frozen follow-up experiment.
  - >-
    A result here is scoped exactly as the converted proposal's own
    `goal_applicability.GOAL-CRYPTO-001` field states: "a prerequisite ... it
    does not meet cryptographic completion." This experiment does NOT by
    itself satisfy, partially satisfy, or advance any GOAL-CRYPTO-001
    completion criterion; it feeds a downstream gate only, and
    GOAL-CRYPTO-001's own record, status, and next_action are untouched by
    this hypothesis and its experiment.
  status: specified
  proposed_by: coordinator
  specified_by: TASK-20260913-154303
  novelty_status: unverified
  novelty_note: >-
    Carried from the converted proposal: nearest internal record is
    IDEA-20260726-004, which proposes a binary oracle-simulability decision
