    and is stated there as incomplete; this task does not re-run or extend
    that screen.
  dominated_by: >-
    Carried from the converted proposal's own honest statement, not
    re-audited by this task: "Unresolved; full time/memory/data frontier not
    checked. No established attack result." This hypothesis's specific
    addition over the proposal is the concrete finite-table measurement plan
    (fixed groups, fixed modulus rule, fixed grammar, fixed t-range, fixed
    controls, decidable predictions) that the proposal's own `minimal_test`
    describes at the design level but that no committed record currently
    executes or contains as a frozen experiment contract.
