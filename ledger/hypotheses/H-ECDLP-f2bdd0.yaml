hypothesis:
  id: H-ECDLP-f2bdd0
  id_allocation_provenance: >-
    Pre-minted and verified free on origin/main by the orchestrating
    session before this design (2026-09-09); relayed in the design
    instruction for IDEA-20260906-ac100b. Not derived by scanning state.
  question_id: RQ-ECDLP-78dbc5
  proposal_id: IDEA-20260906-ac100b
  derived_from_idea: IDEA-20260906-ac100b
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. RQ-ECDLP-78dbc5 is itself unbound (its
    goal_id_note names GOAL-ECDLP-001 as the umbrella candidate); binding
    is a separate Coordinator decision and is not made by this record.
  added: '2026-09-09'
  specified_at: '2026-09-09'
  specified_by: coordinator
  proposed_by: idea-generator
  status: specified

  title: >-
    THE BOREL CEILING AS A CHECKABLE DERIVATION ARTIFACT: for a uniformly
    random function on N points with a uniform distinguishing rule of
    expected walk length W (theta = 1/W, W <= N^{1/3}), Lemmas 1-6 (basin
    partition; Borel basin-size law with stated N-dependence; size-biased
    sampling; the unselected coverage law 1 - (1 + 2a)^{-1/2}; the oracle
    top-T ceiling C_max(a) = erfc(sqrt(x*/2)) with the stated root
    equation; the geometric online walk length) are written as a checkable
    derivation artifact with explicit error terms and two independent
    routes per lemma, so that the oracle online cost at T = N^{1/3} is
    1.28 N^{1/3} (1 + o(1)) near a = 1/4 and every selection rule on this
    question has a stated constant-factor ceiling -- verified by a
    zero-compute validator audit (Stage 0), a minutes-scale quadrature
    table with a permutation nearby-object control and a proves-too-much
    non-uniform-rule control (Stage 1), and a read-only re-read of the
    committed exact-enumeration residuals (Stage 2)

  statement: >-
    (A) STATEMENTS TO DERIVE (single-responsibility lemmas; the artifact is
    a checkable derivation, never a theorem and never labelled "proved").
    Let f be a uniformly random function on a set of size N and let each
    point be marked independently with probability theta = 1/W, W <=
    N^{1/3}. Define basins as in IDEA-20260906-aed829: B(d) is the set of
    points whose forward f-orbit reaches the distinguished point d before
    any other distinguished point.
      LEMMA 1 (partition). Basins of distinct marked points are disjoint;
      their union is the set of points whose forward orbit meets a marked
      point; the complement (mark-free cycles and their trees) has expected
      mass o(N) for W <= N^{1/3}, with the rate made explicit in the
      derivation document (the idea's O(W/sqrt(N)) * N is a loose bound to
      be sharpened or corrected by the Stage 0 audit).
      LEMMA 2 (size law). The basin size of a uniformly random marked point
      is distributed as the total progeny of a Galton-Watson process with
      Poisson(1 - theta) offspring, i.e. Borel(1 - theta), up to a
      total-variation error that vanishes as N -> infinity at fixed theta
      and also along theta = N^{-1/3}; the N-dependence (the "with
      replacement" approximation error of order (basin size)^2 / N =
      N^{1/3}, small relative to the tree size, not in absolute terms) is
      stated in the right metric in the derivation document.
      LEMMA 3 (size-biased sampling). A uniformly random point lies in a
      basin of size n with probability n P(n) / E[n]; the expected number
      of m independent uniform starts landing in a given basin of size n is
      m n / N. Exact given Lemma 1.
      LEMMA 4 (unselected law). The expected coverage of the union of
      basins hit by m independent uniform starts is
      1 - (1 + 2 a_m)^{-1/2} + O(theta), a_m = m W^2 / N, by integrating
      (1 - e^{-m n/N}) n P(n) with the Borel asymptotic
      P(n) = (2 pi)^{-1/2} n^{-3/2} e^{-n theta^2/2} (1 + O(theta + 1/n));
      the integral must start at n = 1 with the exact Borel mass or state
      the cutoff (confounder of the idea).
      LEMMA 5 (oracle ceiling). The expected total mass of the T largest
      basins is N C_max(a) with C_max(a) = erfc(sqrt(x*/2)) and x* the root
      of 2 x*^{-1/2} e^{-x*/2} - sqrt(2 pi) erfc(sqrt(x*/2)) = a sqrt(2 pi),
      plus O(theta) and a concentration error from the order statistics of
      N/W samples.
      LEMMA 6 (online cost). The number of steps of a uniform-start walk to
      its first marked point is Geometric(theta) independent of the basin
      it lies in; hence the expected online cost of a table of coverage C
      with restarts is W/C + O(W).
      ASSEMBLY. At T = N^{1/3}: L sqrt(T/N) = sqrt(a)/C_max(a), tabulated
      as 1.51, 1.35, 1.28, 1.30 at a = 1, 1/2, 1/4, 1/8, with the minimum
      near a in [0.2, 0.25]; at fixed L the minimum table is 1.64 N/L^2.
    (B) QUANTIFIER STATEMENT (frozen). FORALL N, FORALL theta = W^{-1} with
    W <= N^{1/3}, FOR a uniformly random function f and independent marks,
    FORALL T and FORALL stored sets X of size T, E[C(X)] <= C_max(T W^2/N)
    (1 + O(theta)) + (concentration term). The stored set may depend on f
    (it is chosen after seeing the walks); the bound is over the
    expectation of the maximum, which is what an oracle achieves. NOT
    claimed: for every f (no worst-case statement), nor for r-adding walks
    except through H1, nor for non-uniform distinguishing rules.
    (C) WHAT THE ARTIFACT BUYS. It converts "how much of the table is
    redundant" from an open measurement into a stated number with a stated
    error term, and it makes IDEA-20260906-cf3b76's invariance and
    IDEA-20260906-05ffb8's estimator ceiling corollaries of one object.
    Every empirical record in the batch tests one lemma: aed829 Step 2
    tests Lemma 2, Step 3 tests Lemmas 4-5, the memorylessness check tests
    Lemma 6; cf3b76 tests the rule-invariance extension; 05ffb8 lives
    inside the gap between Lemma 5 and the count rule.
    (D) WHAT IT DOES NOT BUY. Nothing about the exponent (KN-LIT-013);
    nothing about the r-adding walk beyond H1; nothing about non-generic
    structure; no attack and no speedup claim of any kind. The constant
    1.28 is a MODEL value for the oracle; Bernstein-Lange's 1.77 is a
    MEASUREMENT with finite T_gen/T = 2 and an 8W cap, and the record
    claims only that the ratio 1.38 is the sum of those losses, which
    aed829 measures.

  mechanism: >-
    The verification protocol of EXP-ECDLP-e962f6, three stages. STAGE 0
    (zero compute, HARD GATE on the ceiling claim): an independent
    validator reads the derivation document (Lemmas 1-6 with explicit
    error terms, two routes per lemma, the quantifier statement) and either
    accepts the error terms, corrects them, or refutes a lemma with a
    counterexample; all three outcomes are deliverables. STAGE 1 (minutes
    scale, new compute, bounded): (i) the quadrature table x*(a),
    C_max(a), sqrt(a)/C_max(a) at a in {1, 1/2, 1/4, 1/8} and on a fine
    grid, to four digits, reproducing the committed anchor values
    digit-for-digit (control C3); (ii) the permutation nearby-object
    control at N = 2^20 (control C2): a random permutation with the same
    DP marking has no trees, geometric segment sizes, and a top-T share of
    order T W/N, and the derivation must predict that collapse; (iii) the
    proves-too-much control (control C4): a non-uniform distinguishing
    rule (density 2theta on half the points, 0 on the other half) on which
    the Lemma 6 conclusion (Geometric(theta), mean W, independent of the
    basin) is known false, and the derivation machinery must fail loudly
    rather than reproduce C_max; (iv) one exact-basin array pass at
    N = 2^26 (the anchor that makes the decidable negative decidable; no
    committed run exists at 2^26, verified by search of the committed
    runs). STAGE 2 (no new compute, read-only): re-read the residuals
    between the exact top-T share and C_max(1/4) off the committed
    EXP-ECDLP-869870 runs at N in {2^20, 2^22, 2^24} (5 seeds each) and
    the committed EXP-ECDLP-612fb1 anchor values; the O(theta) terms must
    be visible and shrink as N^{-1/3}. The derivation document carries a
    per-lemma check box block; the Stage 0 audit verdicts are recorded in
    the validator's report, never by editing the archived document.

  assumptions:
    - >-
      H1 (random-function heuristic) of IDEA-20260906-aed829, used ONLY
      for the transfer from random functions to r-adding walks; the lemmas
      themselves are about random functions and carry no heuristic.
    - >-
      The Borel asymptotic and the singularity analysis are recalled
      standard results; the record names them as obligations to be checked
      by the Stage 0 audit, not as cited theorems.
    - >-
      The Aldous-type size-biased identity and the random-mapping tree
      statistics (Flajolet-Odlyzko; Aldous-Pitman; Otter/Dwass) are
      recalled pointers: no agent in this program has opened them, they
      may not support anything, and the Stage 0 validator is the named
      reader. The artifact's standing rests on the audit and the
      committed-data controls, not on these references.

  proof_search_map:
    bottleneck: >-
      Lemma 2's N-dependence: coupling the exploration of a basin in a
      random function of size N with a Poisson(1 - theta) Galton-Watson
      tree while the basin size is of order W^2 = N^{2/3}, where the
      "with replacement" approximation has error of order (basin size)^2/N
      = N^{1/3}, which is NOT small in absolute terms but IS small relative
      to the tree size; the derivation must state the error in the right
      metric.
    baseline_embedding:
      parameter_slice: >-
        T W^2 = N (a = 1) and the count rule with T_gen -> infinity: the
        formulas must reproduce a coverage of order 1 and an online cost of
        order W, which is the Bernstein-Lange heuristic regime.
      reproduction_check: >-
        Symbolic: Lemma 4 at a_m = 1 gives 0.423; Lemma 5 at a = 1 gives
        0.66; both between 0 and 1 and ordered (selected above unselected).
        Frozen fixture: the committed anchor values c_max_numeric /
        x_star_numeric of RUN-ECDLP-869870-011-N24-s1 (and
        RUN-ECDLP-612fb1-002 for a = 1/4) are the digit-for-digit
        regression fixture the quadrature must reproduce (control C3).
    observation_collision:
      observable: The coverage C(X) of a stored set.
      distinct_preimage_search: >-
        Two different stored sets with the same total basin mass have the
        same coverage and the same expected online cost (Lemma 6): the
        observable does not identify WHICH basins were stored, only how
        much mass. This collision is benign for the ceiling claim and fatal
        for any claim that a particular rule is "better" for reasons other
        than mass -- e.g. depth -- which is why 05ffb8's claim is stated in
        mass.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The resource measure is basin mass; the specialisation is the
          Borel law; the packing is the order-statistic integral over the
          partition-disjoint basins (Lemma 1).
        predicted_gain: >-
          A ceiling with an explicit constant and error term rather than a
          heuristic "T W^2 of order N".
      - transform: representation_reduction
        proposed_object: >-
          Replace "table of DPs" by "multiset of basin sizes"; the
          selection problem becomes a one-dimensional order-statistics
          problem.
        predicted_gain: >-
          Every selection rule is scored by one number; the oracle is
          trivial and the whole content is estimation.
    quantifier_order: >-
      FORALL N, FORALL theta = W^{-1} with W <= N^{1/3}, FOR a uniformly
      random function f and independent marks, FORALL T and FORALL stored
      sets X of size T, E[C(X)] <= C_max(T W^2/N) (1 + O(theta)) +
      (concentration term). The stored set may depend on f (it is chosen
      after seeing the walks); the bound is over the expectation of the
      maximum, which is what an oracle achieves. NOT claimed: for every f
      (no worst-case statement), nor for r-adding walks except through H1,
      nor for non-uniform distinguishing rules.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under H1, no selection rule at fixed (T, W) achieves expected
        coverage above C_max(a) (1 + o(1)), and the oracle online cost at
        T = N^{1/3} is 1.28 N^{1/3} (1 + o(1)) at a = 1/4." It cannot
        certify anything about the exponent, about non-uniform rules
        (cf3b76 extends it), or about non-functional walks.
      nearby_object_control: >-
        Random permutation walk (control C2 of EXP-ECDLP-e962f6): the
        ceiling must collapse to order T W/N there. If the derivation does
        not predict the collapse it has not identified the load-bearing
        structure (the tree branching), and its numbers are not
        trustworthy.
    proof_obligations:
      - claim: Basins partition the set of points reaching a mark (Lemma 1).
        responsibility: correctness
      - claim: The basin-size law is Borel(1 - theta) up to a stated error along theta = N^{-1/3} (Lemma 2).
        responsibility: size
      - claim: Uniform starts are size-biased samples with the stated hit law (Lemma 3).
        responsibility: correctness
      - claim: Unselected coverage integral equals 1 - (1 + 2a)^{-1/2} + O(theta) (Lemma 4).
        responsibility: success_probability
      - claim: Top-T mass equals N C_max(a) with the stated root equation (Lemma 5).
        responsibility: size
      - claim: Walk length to first mark is Geometric(theta) independent of basin (Lemma 6).
        responsibility: runtime
      - claim: The assembly table (1.51, 1.35, 1.28, 1.30) is correct to two digits.
        responsibility: baseline
      - claim: The permutation nearby object collapses the ceiling to order T W/N.
        responsibility: scope

  rerandomization: null

  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-AC100B-1
      formal_statement: >-
        Inherited from IDEA-20260906-aed829 (H1, the random-function
        heuristic): for an r-adding walk with r >= 16 on a prime-order
        group and a DP predicate of density theta = W^{-1} with W <=
        N^{1/3}, the DP-truncated functional graph has the same law as
        that of a uniformly random function on N points truncated at an
        independent Bernoulli(theta) marking, up to o(1) relative error in
        every statistic used, uniformly for N in [2^20, 2^40]. Used in
        THIS record ONLY for the transfer from random functions to
        r-adding walks; Lemmas 1-6 are statements about random functions
        and carry no heuristic.
      random_model_justification: As in IDEA-20260906-aed829.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-869870]
      falsification_condition: As in IDEA-20260906-aed829.

  structural_ingredients:
    - description: >-
        Borel distribution of Poisson Galton-Watson total progeny:
        P(|V(T)| = k) = e^{-mu k} (mu k)^{k-1} / k! for Poisson(mu)
        offspring; the basin-size law of Lemma 2.
      citation: "Borel distribution of Poisson Galton-Watson total progeny"
      provenance: retrieved
      verified_by: WebSearch snippet 2026-09-06 (formula confirmed), as recorded in IDEA-20260906-ac100b
      role: distribution law (Lemma 2)
    - description: >-
        Random-mapping tree and component size statistics; the rigorous
        half of the basin structure.
      citation: "Flajolet-Odlyzko, Random mapping statistics, EUROCRYPT 1989"
      provenance: recalled
      verified_by: null
      role: pointer for the Stage 0 validator; not support
    - description: >-
        Total-progeny law and singularity of a branching process.
      citation: "Otter 1949 / Dwass 1969, total progeny of a branching process"
      provenance: recalled
      verified_by: null
      role: pointer for the Stage 0 validator; not support
    - description: >-
        Size-biased Borel law of the component of a uniform vertex
        (Aldous-Pitman); the classical statement behind Lemma 3.
      citation: "Aldous-Pitman, tree-valued Markov chains derived from Galton-Watson processes, 1998"
      provenance: recalled
      verified_by: null
      role: pointer for the Stage 0 validator; not support
    - description: >-
        Coverage and chain-length analyses of (perfect) distinguished-point
        tables in the time-memory-tradeoff setting; closest prior art for
        Lemma 4 in other notation; not read beyond listings.
      citation: "Hong-Moon 2013; Lee-Hong 2016; Avoine-Junod-Oechslin 2008 (perfect-table tradeoff analyses)"
      provenance: retrieved
      verified_by: WebSearch listings 2026-09-06 (not read), as recorded in IDEA-20260906-ac100b
      role: prior-art pointer; not support
    - description: >-
        The measurement the derivation tests: the basin-partition coverage
        instrument and its (B1)-(B3) model numbers, cited as MODEL numbers
        only.
      citation: IDEA-20260906-aed829
      provenance: internal
      verified_by: record read 2026-09-09 (this design)
      role: the object of verification; model numbers
    - description: >-
        Committed exact-enumeration runs at N in {2^20, 2^22, 2^24} (5
        seeds each) and sampled runs at 2^30: the exact top-T shares, the
        committed c_max_numeric / x_star_numeric anchor values, the cycle
        and capped mass, the survival slopes.
      citation: EXP-ECDLP-869870 (runs RUN-ECDLP-869870-001..019)
      provenance: internal
      verified_by: summaries read 2026-09-09 (this design)
      role: exact-enumeration anchor (control C3); Stage 2 residual source
    - description: >-
        Committed runs carrying the C_max_model / x_star_model anchor
        values at a = 1/4 (N = 2^20) and the top-T shares at 2^20/2^24.
      citation: EXP-ECDLP-612fb1 (runs RUN-ECDLP-612fb1-001..036)
      provenance: internal
      verified_by: summaries read 2026-09-09 (this design)
      role: cross-check of the anchor values (control C3)

  reduction_chain:
    core_problem: >-
      The derivation of the oracle ceiling C_max(a) and the oracle online
      constant for a uniform-rule distinguished-point table at fixed
      (T, W), as a checkable derivation artifact with explicit error
      terms.
    corollaries:
      - problem: >-
          Walk-rule invariance of C_max (IDEA-20260906-cf3b76): whether the
          ceiling is invariant under changes of the walk rule.
        reduction_ref: >-
          IDEA-20260906-ac100b states the invariance as a corollary of the
          basin object; not designed here.
        asymptotics_preserved: constant-factor; no exponent
      - problem: >-
          The estimator ceiling of IDEA-20260906-05ffb8: how well basin
          sizes can be estimated from generation walks.
        reduction_ref: >-
          IDEA-20260906-ac100b states it lives inside the gap between
          Lemma 5 and the count rule; not designed here.
        asymptotics_preserved: constant-factor; no exponent

  predictions:
    - metric: >-
        sign and magnitude of the O(theta) residual between the Lemma 4-5
        values and the exact enumeration, at a = 1/4
      direction: lower
      minimum_effect: >-
        Residual below 10% at N = 2^24 and shrinking as N^{-1/3} across the
        committed grid {2^20, 2^22, 2^24} plus the new 2^26 anchor
        (expected shrinkage factor 2^{2/3} about 1.59 per 2^2 step in N),
        in the committed data re-read at Stage 2.
    - metric: >-
        oracle online cost at T = N^{1/3}, exact enumeration, versus
        1.28 N^{1/3}
      direction: different
      minimum_effect: >-
        Within 10% at N = 2^26 with a = 1/4 (the new anchor); the committed
        N = 2^24 value (1.2755 at seed 1) is the calibration point.
    - metric: >-
        random-permutation nearby object, top-T share at N = 2^20, a = 1/4
      direction: lower
      minimum_effect: >-
        Below 3 T W/N = 0.047 at every seed, i.e. the tree-driven ceiling
        collapses as predicted, and the Borel/erfc machinery does not
        reproduce C_max(1/4) = 0.39 on this object.
    - metric: >-
        outcome of the Stage 0 validator audit of Lemma 2 (and of each
        lemma)
      direction: different
      minimum_effect: >-
        One of: derivation accepted with stated error; error term
        corrected; refuted with a counterexample. All three are
        deliverables.

  test_boundary:
    instances: >-
      A uniformly random function on [0, N) (the generic object of the
      lemmas) at N in {2^20, 2^22, 2^24} (committed exact enumeration,
      EXP-ECDLP-869870, 5 seeds each) and N = 2^26 (the new Stage 1
      anchor, one array pass, seed 1); a uniformly random permutation on
      [0, 2^20) as the nearby object (3 seeds); a non-uniform
      distinguishing rule on [0, 2^20) (density 2theta on the even-hash
      half, 0 on the odd-hash half) as the proves-too-much object (1
      seed). No curve arm: the lemmas are about random functions, and the
      transfer to r-adding walks is H1 only, tested by
      EXP-ECDLP-869870, not here.
    parameters: >-
      a = T W^2 / N = 1/4 primary (T = N^{1/3} rounded to a power of two:
      64, 128, 256, 256, 1024 at N = 2^20, 2^22, 2^24, 2^26, 2^30; W =
      sqrt(a N / T); theta = 1/W; cap 8W); a in {1/8, 1/2, 1} for the
      quadrature table; the permutation and non-uniform objects at
      a = 1/4, N = 2^20 (T = 64, W = 64, theta = 1/64).
    implementation: >-
      Stage 0: zero-compute validator audit of the derivation document
      (separate reserved validator task; not part of this experiment's
      runs). Stage 1: deterministic quadrature (stated method, grid and
      tolerance; no seed); one exact-basin array pass at N = 2^26 (seed 1);
      three permutation array passes at N = 2^20 (seeds 1-3); one
      non-uniform-rule array pass plus M = 40000 online walks at N = 2^20
      (seed 1). Stage 2: read-only re-read of the committed summaries
      (no re-simulation, no modification; the sha256 of every committed
      file read is recorded in the run manifest).
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 4
      maximum_runs: 8
    out_of_scope: >-
      Cryptographic sizes; r-adding walks (H1 transfer only, tested by
      EXP-ECDLP-869870); non-functional walks; any statement about
      exponents; any re-simulation of the committed runs; any modification
      of a committed run record.

  falsification_conditions:
    - >-
      DECIDABLE NEGATIVE (Coordinator verdict ses_f7c589781ffeGfc3ONOpFH2U7b):
      Lemma 5's C_max(a) differs from the exact top-T share by more than
      15% at N = 2^26 (corrected residual, cycle and capped mass added
      back) WITH the residuals not shrinking as N^{-1/3} across
      {2^20, 2^22, 2^24, 2^26}: the ceiling formula is wrong and is
      withdrawn; the exact enumeration replaces it as the standing number.
    - >-
      Lemma 6 fails: the walk length to the first mark correlates with the
      basin size of the reached DP beyond the CI (Spearman correlation
      significant at alpha = 0.01 on the 2^26 anchor) or the mean walk
      length deviates from W beyond the CI: the online cost is not W/C and
      every cost figure in the batch must be re-derived from the measured
      length-conditional law.
    - >-
      The permutation walk does NOT collapse the ceiling: the top-T share
      is not below 3 T W/N at a majority of seeds, or the derivation
      document does not contain the collapse argument (tree branching as
      the load-bearing structure): the derivation has not identified the
      load-bearing structure; its numbers are void.
    - >-
      A validator exhibits a stored set with expected coverage above
      C_max(a) (1 + o(1)) under H1: the record is refuted outright.
    - >-
      The proves-too-much control fails to discriminate: the machinery
      reproduces C_max(1/4) within 15% on the non-uniform object AND the
      measured mean walk length is within the CI of W: the control object
      did not separate the uniformity assumption; the verification is
      incomplete (not a falsification of the derivation) and is routed to
      the Coordinator for a stronger object under a versioned amendment.

  interpretation_limits:
    - >-
      A checkable derivation artifact, never a theorem; proof_status
      derivation per docs/claims-and-verification.md. It binds random
      functions; it binds r-adding walks only through H1.
    - >-
      The ceiling is at fixed (T, W); it is not a bound on the (P, S, L,
      epsilon, U) frontier, which the batch and the W-choice move along.
    - >-
      No exponent is claimed or moved (KN-LIT-013); no attack, no speedup,
      no completion claim of any kind; the record states a ceiling
      constant with an error term and a decidable negative.
    - >-
      The recalled citations (Flajolet-Odlyzko, Otter/Dwass, Aldous-Pitman)
      are pointers for the Stage 0 validator, not support; the artifact's
      standing depends on the audit and the committed-data controls, not
      on these references.
    - >-
      Every number is claim_tier toy; the tested N range is 2^20..2^26
      (committed grid to 2^30 sampled); extrapolation to cryptographic N
      is an assumption stated per evidence record, never a result.

