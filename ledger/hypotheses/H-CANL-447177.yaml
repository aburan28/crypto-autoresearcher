hypothesis:
  id: H-CANL-447177
  question_id: RQ-CANL-63098f
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-761a8c
  statement: >-
    The covering fraction of a naive-height lift enumeration,
    rho_lift(B) = |{P in E(F_p) that are reductions of global points of canonical height at
    most B}| / N, decays with the ladder prime as rho_lift ~ c(curve, B) / p, so that the
    slope of log rho_lift against log p at a FIXED enumeration box and a FIXED global curve
    is exactly -1 on EVERY arm - CM and non-CM, every rank, every regulator - and any
    apparent CM advantage measured at a single small p is the abundance of small integers
    rather than arithmetic. An instrument that does not reproduce that slope within
    -1.00 +/- 0.15, that does not recover a planted lift at 100 percent, or that reports a
    lift for a planted-unliftable target, cannot support any L9 conclusion in either
    direction.
  mechanism: >-
    A naive x-coordinate lift draws x in [0, p), i.e. log_2 p bits. The number of global
    points on a rank-r curve with naive height at most log p is of order
    (log p)^{r/2} Reg^{-1/2}, and the number of residues is N ~ p, so
    rho_lift ~ (log p)^{r/2} / (Reg^{1/2} p). At r = 2 and Reg ~ 1 that is roughly 4.5
    percent at p = 101, 0.09 percent at p = 10^4 and about 2e-8 at p = 2^30 - seven orders
    of magnitude across the range a toy experiment spans. Holding the GLOBAL curve fixed
    across the ladder holds r and Reg exactly fixed by construction, so the only remaining
    p-dependence is the 1/N in the denominator and the slope of log rho_lift against log p
    is forced to -1 independently of rank and regulator. That rank-independence is what
    makes the slope a CALIBRATION rather than a measurement - it is the same number on
    every arm, so a fitted slope away from -1 indicts the pipeline before any arithmetic
    conclusion is drawn. The residual risk is at the smallest ladder primes, where distinct
    global points of bounded height can share a reduction and injectivity fails; the
    injectivity threshold is computable per curve and the two largest residuals are
    required to be reported against it.
  assumptions:
  - >-
    The canonical and naive heights differ by O(log |Delta|), so a naive-height box
    approximates a canonical-height ball up to a curve-dependent shift. The shift is
    MEASURED per curve and reported, not assumed small.
  - >-
    Holding the global curve fixed across the ladder holds the rank r and the regulator Reg
    fixed. True by construction and it is the design's main strength.
  - >-
    N ~ p for the primes used - curves are chosen with near-prime order so log N and log p
    are interchangeable to within a bit. Any curve with a large cofactor is excluded and the
    exclusion is recorded.
  - >-
    Every ladder prime is a prime of good reduction for the chosen global curves. Checked per
    (curve, p) pair; bad primes are dropped with a recorded reason, never silently.
  - >-
    The regulator estimated from exhibited generators may be off by the square of a finite
    index, which shifts rho_lift's intercept. Only SLOPES are claimed, never intercepts.
  proof_search_map:
    not_applicable_reason: >-
      Purely empirical instrumentation. It proves no theorem, states no asymptotic bound,
      constructs no certificate family and offers no reduction; its output is a calibration
      certificate. The one derived quantity - the forced slope -1 - follows in one line from
      rho_lift's denominator and is stated in the mechanism rather than requiring a proof
      architecture. KN-TECH-080's audits are therefore not applicable, and this field records
      that rather than nulling the map silently.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-CANL-C1
    formal_statement: >-
      FOR ALL fixed global curves E/Q with exhibited generators, and FOR ALL ladder primes p
      of good reduction, rho_lift(p) = c(curve, B) / p * (1 + o(1)) at fixed height box B,
      so the slope of log rho_lift against log p is -1 uniformly, independent of rank,
      regulator and CM.
    random_model_justification: >-
      Rigorous given that the numerator |red(S)| is independent of p (the global point set is
      fixed) and injective into E(F_p) once p exceeds a computable per-curve threshold - the
      largest denominator among differences of enumerated points. For the remaining small
      primes the classical distribution theorem imitated is the birthday bound for a uniform
      map into N residues, which is a uniform-model appeal and is labelled as one.
    supporting_results: []
    validation_experiment_ids:
    - EXP-CANL-8ad6f8
    falsification_condition: >-
      A fitted slope outside -1.00 +/- 0.15 on ANY arm, including every null arm, at ladder
      points above the computed injectivity threshold.
  - id: HEUR-CANL-C2
    formal_statement: >-
      The naive-height enumeration box captures a constant fraction of the canonical-height
      ball of the corresponding radius, uniformly over the tested curve set.
    random_model_justification: >-
      The height comparison |hhat - h_x/2| = O(log |Delta|) gives inclusions of balls with a
      shift, hence a constant-fraction capture with the constant depending on |Delta|. The
      heuristic content is UNIFORMITY over the curve set, and it is MEASURED - the empirical
      maximum shift per curve is a required metric - rather than assumed.
    supporting_results: []
    validation_experiment_ids:
    - EXP-CANL-8ad6f8
    falsification_condition: >-
      A measured shift differing by more than a factor 2 across arms, which makes cross-arm
      ratios uninterpretable and forbids any CM-versus-null comparison until the arms are
      re-matched on |Delta|.
  structural_ingredients:
  - description: >-
      Counting global points of bounded canonical height on a rank-r curve, of order
      (log p)^{r/2} Reg^{-1/2} at naive height bound log p.
    citation: null
    provenance: recalled
    verified_by: null
    role: numerator of the covering fraction; only its p-independence is load-bearing
  - description: >-
      The rank-1 closed form - on a rank-1 curve with generator P0, the reduction of the
      height-bounded global point set is exactly the multiples [m] red(P0) with
      m^2 hhat(P0) <= B, giving an exact integer count that grows like sqrt(B).
    citation: null
    provenance: internal
    verified_by: >-
      Required to reproduce exactly, as an integer, at every ladder point in the experiment's
      hard gate.
    role: closed-form self-validation of the enumeration
  - description: >-
      The k-resampling invariance control - resample the discrete-log target with the curve,
      the lift and the point fixed, and require every curve-only statistic to be unchanged.
    citation: RQ-TORS-8c7b79
    provenance: internal
    verified_by: >-
      Adopted with attribution from lane L7 rather than reinvented; re-executed here on this
      pipeline.
    role: leak detector for target information entering a curve statistic
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: Fitted slope of log rho_lift against log p at fixed height box, per arm, global curve held fixed
    direction: different
    minimum_effect: >-
      FORCED VALUE -1.00 with a jackknife interval inside +/- 0.15, on EVERY arm including
      every null. A slope outside that band on any arm indicts the pipeline and blocks every
      L9 measurement until it is fixed.
  - metric: rho_lift at p = 101 on a rank-2 curve with regulator of order 1
    direction: higher
    minimum_effect: >-
      A few percent, order 1 to 10 percent. THIS PREDICTION IS THE POINT - it is the artifact,
      pre-registered so that when it appears nobody mistakes it for a result. Its absence
      would mean the enumeration box is far too small and the ladder must be redesigned.
  - metric: CM-versus-matched-non-CM excess ratio, per ladder point
    direction: different
    minimum_effect: >-
      1.0 within a factor 2 at every ladder point AND with the same slope. An excess that is
      large at small p and vanishes at large p is the artifact; an excess CONSTANT across three
      decades is the only shape that could be arithmetic and is the pre-registered signal.
  - metric: Companion-height ratio under the genuine order action versus the synthetic null N3
    direction: higher
    minimum_effect: >-
      Genuine must grow like sqrt(|D_E|)/2; synthetic N3 must stay O(1). If N3 also grows, the
      apparent CM effect is a lattice-symmetry artifact and every CM attribution in the lane is
      withdrawn.
  - metric: Planted-positive recovery rate and planted-negative false-positive rate
    direction: different
    minimum_effect: >-
      FORCED - recovery 100 percent, false positives 0 percent. Either failure halts the lane;
      these are the two directions an instrument must demonstrate before any negative from it
      is admissible.
  - metric: k-resample invariance (null N4) - change in every curve-only statistic
    direction: different
    minimum_effect: >-
      FORCED VALUE exactly zero change. A nonzero change means a curve statistic is leaking
      target information through the implementation, which would manufacture a spectacular
      false positive if unnoticed.
  test_boundary:
    instances: >-
      Six global curves over Q with exhibited generators - three with complex multiplication
      and class number 1, three matched non-CM curves of the same exhibited rank and minimal
      discriminant within a factor 2 - reduced at each of at least five ladder primes spanning
      at least three decades. Plus a rank-1 curve for the closed-form self-validation and a
      rank-0 CM curve for the torsion-only null.
    parameters:
      ladder_primes:
      - 101
      - 1009
      - 10007
      - 100003
      - 1000003
      global_curves_cm: 3
      global_curves_matched_non_cm: 3
      height_bounds_per_curve: 8
      enumeration_box: x = u / w^2 with |u| <= U and 1 <= w <= W, U and W declared in bits and IDENTICAL across every arm
      slope_band:
      - -1.15
      - -0.85
      nulls:
      - N1 matched non-CM curve
      - N2 random lattice with matched regulator and a random surjection onto Z/N
      - N3 synthetic order-3 or order-4 Z-linear isometry substituted for the genuine zeta action
      - N4 target reshuffle - resample k with curve, lift and point fixed
      - N5 rank-0 torsion-only arm
    implementation: >-
      Exact integer enumeration of the naive-height box, exact reduction modulo each ladder
      prime, exact integer counts and denominators; jackknife intervals for the fitted slopes.
      All arms run on the IDENTICAL pipeline with the identical box and ladder in the same
      invocation. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 8.0
      maximum_runs: 24
  falsification_conditions:
  - >-
    The rank-1 closed form does not reproduce exactly as an integer at every ladder point. The
    enumeration is wrong and nothing in the lane may be reported until it is fixed.
  - >-
    Any arm's fitted slope falls outside -1.00 +/- 0.15 above its computed injectivity
    threshold. The pipeline is not measuring what the decay law says it measures.
  - >-
    Null N3 reproduces the genuine order action's companion-height growth. The CM effect is a
    lattice symmetry and every CM attribution in this lane must be withdrawn.
  - >-
    Null N4 shows any curve-only statistic moving with the resampled target. Implementation
    leak; halt.
  - >-
    Null N5 shows non-trivial coverage on a rank-0 curve. The counter is including torsion or
    twists.
  - >-
    Planted-positive recovery below 100 percent, or planted-negative false positives above 0
    percent. The instrument fails in one of the two required directions and no L9 negative may
    be reported from it.
  interpretation_limits:
  - >-
    This hypothesis produces no mathematical result about lifting, complex multiplication, or
    the ECDLP. Its entire output is a calibration certificate.
  - >-
    A PASSING certificate does not validate any L9 conclusion. It removes one class of
    artifact. A FAILING certificate does block every L9 conclusion drawn from the same pipeline.
  - >-
    Toy scale throughout. The decay law's extrapolation to cryptographic p is ARITHMETIC, not
    measurement, and must be labelled as such wherever it appears.
  - >-
    "No CM excess was found" from this instrument means "no CM excess above the instrument's
    sensitivity at the tested ladder", and the sensitivity floor of 1/|S| must be quoted with it.
  - >-
    Reducing one global curve at several primes gives curves of unrelated group structure. That
    is intended - it holds the global side fixed - but it means the arithmetic of E(F_p) varies
    uncontrolled across the ladder, so only the 1/N dependence may be read from it.
  distinguishable_outcomes:
  - outcome: >-
      Rank-1 closed form reproduces exactly; every arm fits slope -1.00 within +/- 0.15;
      planted positive recovers at 100 percent and planted negative at 0 percent; N3, N4 and N5
      all behave as forced; and the CM-versus-N1 excess ratio is 1.0 within a factor 2 at every
      ladder point with the same slope.
    means: >-
      The instrument is CALIBRATED and the small-p artifact is confirmed as an artifact. A
      calibration certificate is issued and every other L9 measurement may cite it. Any CM
      excess reported downstream must exceed the measured sensitivity floor and must be constant
      across decades to count as arithmetic.
  - outcome: >-
      All instrument checks pass, but the CM-versus-N1 excess ratio is materially above 1 AND
      CONSTANT across at least three decades with the same slope on both arms.
    means: >-
      A candidate arithmetic effect that is NOT explained by small-integer abundance. This is the
      pre-registered positive signal. It is not a result about the ECDLP; it nominates a
      follow-up experiment with independent replication, and N3 must be re-examined first
      because a lattice symmetry is the leading alternative explanation.
  - outcome: >-
      All instrument checks pass and the CM-versus-N1 excess is large at small p and decays to 1
      at large p.
    means: >-
      The excess is the small-integer artifact this record exists to name. Any L9 record
      reporting a CM advantage from a single small p is thereby refuted at the tested scope, and
      that refutation is the deliverable.
  - outcome: >-
      Any arm's slope falls outside the band, or the rank-1 closed form fails, or N4 leaks, or
      the planted positive is not recovered.
    means: >-
      The instrument is BROKEN. Under AGENTS.md rule 5 this is infrastructure signal, not
      negative mathematical evidence. The certificate fails, every L9 conclusion drawn from this
      pipeline is blocked, and the run returns to the Executor with the failing arm named.
  - outcome: >-
      Null N3 reproduces the genuine action's companion-height growth.
    means: >-
      The CM attribution mechanism itself is refuted - the effect the lane calls CM is a lattice
      symmetry available without any order action. Every CM attribution in the lane is withdrawn.
      This is the single most consequential negative available from this design.
