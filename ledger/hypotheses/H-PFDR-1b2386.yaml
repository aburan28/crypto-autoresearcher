hypothesis:
  id: H-PFDR-1b2386
  question_id: RQ-FBG-001
  source_idea_id: IDEA-20260830-c5c614
  batch_id: BATCH-c64bee
  title: >-
    Conservation binds only on the WHOLE group, so relation collection is free
    to attempt only targets in a set decidable from the target REPRESENTATION
    x(R) -- one point addition, no discrete logarithm. The measurable claim is
    not that a lift exists (a maximum over a grammar is positive by selection
    alone) but that the excess of the lift over its RANDOM-PARTITION SELECTION
    NULL follows a power law in N whose exponent is the deliverable, with a
    curve-free pushforward null deciding whether any of it is about curves.
  statement: >-
    (A) WHAT IS ALREADY CLOSED, SO THIS IS NOT MISTAKEN FOR IT. The mean
    per-target decomposition yield is binomial(B+m-1, m)/N for EVERY base of
    size B, so a structured geometry cannot raise mean yield at matched size;
    and the coverage advantage of any base over a matched random base is at most
    min(1, mu)/coverage_random, at most 1.582, attained only at mu = 1. Neither
    channel can grow with N. This record proposes NOTHING on either.
    (B) THE ESCAPE, WHICH IS A THEOREM ABOUT THE THEOREM. The conservation
    double count is a statement about the sum over ALL targets in the group. It
    says nothing about the average of the decomposition count over a proper
    subset. That escape becomes usable only if the target restriction is
    decidable from the target REPRESENTATION rather than from its logarithm --
    a conditional the corpus records as untested. This record tests it.
    (C) THE TWO METRICS. Let pi be a predicate computable from x(R) in O(1) field
    operations with no discrete logarithm, S = pi inverse of 1 with density
    sigma. Define LIFT rho = E over S of c_D divided by E over G of c_D, and
    PRECISION lambda = Pr[c_D >= 1 given S] divided by Pr[c_D >= 1]. Both are
    unconstrained by conservation, both are computable exactly at toy scale by
    exhaustive enumeration, and both are directly monetisable -- rho as relations
    per solve attempt, lambda as the fraction of doomed solve attempts avoided.
    (D) THE CLAIM IS ABOUT SCALING, NOT EXISTENCE. A maximum over a grammar is
    positive by selection alone, so the primary control is a RANDOM-PARTITION
    SELECTION NULL at the identical cell-size profile and the reported quantity
    is always an EXCESS over that null, never a raw maximum. The claim is that
    for x-line-defined geometries the excess obeys a power law in N whose
    exponent is the deliverable, with two pre-registered competing values: -1/2,
    square-root cancellation, the channel closed with a number attached; and 0,
    the channel survives and RQ-FBG-001 is ALIVE on a realizable channel.
    (E) WHY IT IS EXPONENT-SHAPED. With the target count pinned at
    m! N / B^{m-1} by conservation, relation collection costs
    (m! N / B^{m-1})(t_solve/rho + t_gen/sigma) and linear algebra costs L(B). At
    m = 3 with L(B) = Theta(B^2) and t_solve = Theta(1) the ledger
    6N/(rho B^2) + B^2 is minimised at B^4 = 6N/rho with total
    2 (6N/rho)^{1/2}. So a SUSTAINED lift rho about N^delta moves the
    relation-collection exponent from 1/2 to (1 - delta)/2, and a constant lift
    moves nothing. THE PREDICTED delta IS 0.
    (F) THE HARD CEILING THAT MAKES A LARGE LIFT SELF-DEFEATING. Conservation
    applied to the cell gives rho <= 1/sigma exactly, so an arbitrarily large
    lift requires an arbitrarily selective filter, and the net gain is capped by
    the affordable filter density. A sustained N^delta lift additionally requires
    sigma to shrink with N and the affordability assumption to survive that
    shrinkage, which HEUR-002 does not currently cover. This is disclosed in the
    statement rather than in a footnote.
    (G) THE ATTRIBUTION REQUIREMENT ADDED BY THIS RECORD. The tracked object is
    the pushforward of a count vector along a partition, which is defined for any
    finite abelian group with any labelling map and has nothing to do with
    curves. A CURVE-FREE NULL IS THEREFORE MANDATORY: the identical grammar,
    identical selection null and identical excess statistic on an abstract cyclic
    group of the same order whose elements carry a synthetic representation
    label, with an abstract base of matched size. If the curve-free null
    reproduces the excess and its scaling, the finding is about pushforwards of
    conserved count vectors and NOTHING in the run may be quoted as a statement
    about elliptic curves, summation polynomials or the ECDLP.
    (H) NOT CLAIMED. No attack, no break, no speedup, no security consequence.
    It is NOT claimed that a positive lift exists; the expected outcome is decay.
    It is NOT claimed that any recorded yield or coverage verdict is wrong -- this
    measures a quantity those verdicts do not constrain. It is NOT claimed that
    the frozen grammar is exhaustive; a null closes the existential over that
    grammar, that panel and that range, and nothing wider.
  mechanism: >-
    WHY A LIFT COULD EXIST, AS A CAUSAL ROUTE AND NOT A HOPE. The map from a
    factor base to its m-fold sumset is mediated on the curve by the summation
    polynomial, which is an algebraic relation between the REPRESENTATION of the
    target and the REPRESENTATIONS of the summands, not a relation in the
    exponent coordinate. A base defined by an x-line condition therefore
    constrains x(R) algebraically, because the sumset is the projection of an
    algebraic correspondence applied to a structured box. If that projection is
    biased with respect to a cheap x-line predicate, the bias is BY CONSTRUCTION
    visible from x(R) alone. For a base sampled uniformly on the x-line the same
    construction produces no bias by symmetry, which is the geometry null.
    Conservation is blind to all of it because the double count is indifferent to
    WHICH target receives the mass.
    THE LOSSY-PROJECTION TEST. The tracked object is the pushforward of the count
    vector along a representation-decidable partition: N integers collapse to k,
    discarding which target was hit, the multiplicity profile inside a cell, the
    base, the curve and the field. It is lossy COMPATIBLY with the operation
    relation collection performs -- generate a fresh target, evaluate the
    predicate, spend a solve only if it holds -- which acts on the retained
    object by selecting a cell, and the retained cell totals then determine the
    expected relations per solve exactly. The projection is NON-TRIVIAL only for
    k >= 2; at k = 1 the single cell is the whole group and the vector is pinned
    by conservation, so k = 1 is the degenerate change-of-coordinates case and
    doubles as the baseline reproduction check.
    WHY THE TWO METRICS ARE NOT THE SAME MEASUREMENT. The lift moves with total
    mass and the precision moves with support. A predicate can raise the lift
    while lowering the precision by selecting cells where multiplicity
    concentrates, which is what a small-multiples geometry does globally. Under a
    harvest-all solve the payoff is the lift; under one-relation-per-target it is
    the precision. Their DISAGREEMENT is itself a finding about where a geometry
    puts its mass.
  assumptions:
    - >-
      Targets are generated as R = aP + bQ with a and b uniform, so x(R) is
      available for free and a rejected target costs one point addition plus one
      predicate evaluation. This is what makes a representation-side filter
      admissible at all.
    - >-
      The counting convention is frozen before the run and identical across arms
      -- arity, symmetric or not, and whether effective size is nominal or
      negation-collapsed. Effective size is used throughout, because a silent
      x-collision changes the density and therefore every ratio.
    - >-
      The decomposition count is computed on the group and the predicate is
      evaluated on the representation. Under the symmetric convention the count
      descends to the x-line and the pushforward is well defined; under a
      non-symmetric convention it does not, and the symmetric convention is used
      for that reason.
    - >-
      Panel arms are verified against their labels from the committed source
      before any cell runs, because this corpus records a live harness path whose
      declared geometry and constructed geometry disagree.
    - >-
      [relayed] The log-space reference lift of 8.01 at a one-eighth window, and
      the 1.582 coverage envelope, are RELAYED from IDEA-20260830-c5c614, whose
      author records a PARTIAL read of the objections file. This coordinator did
      not open it. The 1.582 envelope is independently confirmed verbatim in
      KN-FIND-007; the 8.01 figure is NOT independently confirmed and is used
      only as a target for an instrument check whose pass threshold is set at
      half of it.
    - >-
      Toy scale binds. N at most 2^18, m = 3, generated curves. Nothing is
      claimed at cryptographic scale and the fitted exponent is a trend over four
      rungs.
  proof_search_map:
    bottleneck: >-
      The WHOLE-GROUP AVERAGING STEP inside the conservation double count. It is
      the single place where geometry independence is forced, and restricting the
      average to a proper, cheaply decidable subset of targets is the only
      identified way to remove it without needing a discrete logarithm.
    baseline_embedding:
      parameter_slice: >-
        k = 1, the trivial one-cell partition. The pushforward is the single
        number equal to the conserved total, the lift is identically 1 and the
        precision is identically 1, reproducing the conservation identity
        exactly. Any k >= 2 partition strictly refines it.
      reproduction_check: >-
        Per cell, the sum of the k cell totals must equal
        binomial(B_eff + m - 1, m) exactly with integer-exact counters and
        deviation required to be exactly 0. A nonzero deviation halts the run as
        an implementation error and nothing is reported.
    observation_collision:
      observable: >-
        The k-vector of cell totals under the frozen grammar, and the derived
        pair (lift, precision).
      distinct_preimage_search: >-
        A collision is exhibited by construction rather than hunted: two bases
        with identical cell-total vectors and different coverage exist whenever
        multiplicity is redistributed WITHIN a cell, so the observable does not
        determine coverage, rank or solve cost and this record may not be cited
        for any of them. The designed collision on the other side is the pair
        (small-multiples base, matched random base) evaluated under a
        REPRESENTATION grammar, predicted indistinguishable, against the same
        pair evaluated under the LOG-SPACE anchor, where a large lift is known to
        exist. A run in which those two evaluations agree has an instrument that
        cannot see a lift, and its null means nothing.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The pushforward of the decomposition-count vector along a partition of
          the x-line decidable in O(1) field operations without a discrete
          logarithm.
        predicted_gain: >-
          At m = 3, relation-collection exponent 1/2 becomes (1 - delta)/2 if a
          lift about N^delta is sustained. PREDICTED delta = 0 with the excess
          decaying like N^{-1/2}, in which case the gain is zero and the
          deliverable is the measured decay exponent.
    quantifier_order: >-
      THERE EXISTS an x-line-constructible geometry and a family of
      representation-decidable predicates, with densities bounded below by a
      fixed power of N, such that FOR ALL N in the tested range the lift is at
      least 1 + c for a fixed positive c. The witness predicate is explicitly
      ALLOWED to depend on N -- that is the honest order, it is strictly weaker
      than a uniform predicate, and it is why even a positive result would not be
      an algorithm. The negative closes only the existential over the frozen
      grammar, the tested panel and the tested range.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured power-law exponent for the excess of the maximum lift over its
        selection null, over one frozen grammar, one panel and four group sizes
        at toy scale. It can NEVER certify that no predicate outside the grammar
        works, and can certify nothing about solve cost or rank.
      nearby_object_control: >-
        THE LOG-SPACE PREDICATE ANCHOR, for which a large lift is already known
        to exist and which is UNREALIZABLE because evaluating it needs a discrete
        logarithm. A method that cannot separate the log-space anchor from a
        representation predicate is measuring the wrong coordinate, and the
        anchor is run at every rung for exactly that reason.
    proof_obligations:
      - claim: 'k = 1 reproduces the conservation identity exactly, lift and precision both 1.'
        responsibility: baseline
      - claim: 'Cell totals sum to binomial(B_eff + m - 1, m) with deviation exactly 0 in every cell.'
        responsibility: correctness
      - claim: >-
          The maximum over a grammar is positively biased, and the
          random-partition null measures that bias at the same cell-size profile;
          every reported effect is an excess over the MEASURED null distribution
          and never over a fixed absolute threshold.
        responsibility: success_probability
      - claim: >-
          The ledger has optimum B^4 = 6N/rho with total 2 (6N/rho)^{1/2} at
          m = 3, t_solve = Theta(1), L(B) = Theta(B^2).
        responsibility: runtime
      - claim: >-
          rho <= 1/sigma exactly, by conservation applied to the cell, so the net
          gain is capped by the affordable filter density.
        responsibility: strictness
      - claim: >-
          The CURVE-FREE pushforward null is run at every rung and its excess and
          decay exponent are reported beside every curve arm.
        responsibility: scope
      - claim: >-
          Nothing here is a statement about coverage, rank, solve cost or ECDLP
          hardness, and the record carries that boundary into every citation.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: 'the relation-collection exponent of m = 3 factor-base index calculus with a representation-decidable target filter'
    prior_best: 'Pollard rho at 0.886 sqrt(N) time with O(1) memory; within index calculus, the corpus own m = 3 position is far behind rho'
    time_exponent: >-
      (1 - delta)/2 conditional on a sustained lift about N^delta, with PREDICTED
      delta = 0 and therefore exponent 1/2 unchanged. The measurement produces
      delta with an interval; it does not produce an algorithm.
    memory_exponent: >-
      The filter itself is O(1) memory, which is its one attractive property: it
      trades time for time and adds no table. The MEASUREMENT stores one length-N
      count vector per arm.
    hidden_cofactor: >-
      The ledger charges a constant-cost solve; at real parameters the solve is
      superpolynomial in B and that, not yield, is where the method dies, so a
      positive delta would be necessary and nowhere near sufficient. The lift is
      capped by 1/sigma, and sigma is capped by a MACHINE CONSTANT rather than an
      asymptotic quantity. The fitted delta comes from four toy rungs and its
      interval will be wide; quoting it without the interval is the single most
      likely way this record gets misused.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        X-LINE ADDITIVE PSEUDORANDOMNESS. For a factor base of size B defined by
        an x-line condition, fixed arity m, and any cell of a
        representation-decidable partition with density bounded below by a fixed
        power of N, the cell total equals sigma times the conserved total times
        (1 + O(N^{-1/2+eps})) uniformly over the cells of the frozen grammar.
        Equivalently, the maximum lift minus 1 decays like N^{-1/2+o(1)} once the
        selection null is removed.
      random_model_justification: >-
        The rigorous half is the conservation identity itself: the sum of the
        cell totals is the conserved total exactly with no error term, so the
        only free quantity is how that fixed mass distributes and the deviations
        are constrained to cancel. The classical statement imitated is Weil-type
        square-root cancellation for character sums along a curve over a prime
        field, applied to the correspondence cut out by the summation polynomial.
        The gap, plainly: the Weil bound applies to complete character sums over
        the full curve, whereas the object here is an incomplete sum over the
        image of a structured box, so the citation gives the SHAPE of the
        expected cancellation and not a theorem covering this case. That gap is
        exactly why this is a heuristic and is the thing being measured.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            The conservation identity and its exactness for every base of a given
            size, the coverage bound and the 1.582 envelope, and the explicit
            statement that the identity says nothing about the DISTRIBUTION of
            the counts -- which is the quantity this record measures.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-e07d4b
      falsification_condition: >-
        The fitted decay exponent interval contains 0 and excludes -1/2 for any
        x-line geometry, with the curve-free null showing no such survival. The
        channel survives with N.
    - id: HEUR-002
      formal_statement: >-
        FILTER AFFORDABILITY. At the tested parameters, generating and testing one
        candidate target -- one point addition plus one predicate evaluation --
        costs at most one thousandth of one decomposition solve attempt, so a
        filter of density at least one thousandth adds at most 100 percent to
        relation-collection cost.
      random_model_justification: >-
        NO rigorous bound and no classical distribution theorem. This is an
        ENGINEERING RATIO and is labelled as one rather than dressed up. Its only
        prior support is a second-hand solve-cost figure that no agent under this
        task opened, so the ratio is MEASURED IN PROCESS at every rung and the
        admissible density floor is recomputed from the measurement rather than
        assumed.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-e07d4b
      falsification_condition: >-
        The measured cost ratio is below one thousand. The low-density members of
        the grammar are dropped before any gain is quoted.
  structural_ingredients:
    - description: >-
        The conservation identity, its exactness over the whole group, the
        coverage bound, and the explicit statement that the identity is silent
        about the distribution of the counts.
      citation: KN-FIND-007
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: what is closed, and the precise crack this record enters through
    - description: >-
        The measured restricted-target-set escape at a one-eighth log-space
        window and the statement that the route becomes live only if the
        restriction is decidable from the representation.
      citation: 'coordination/goals/GOAL-ICLIFT-001 red-team objections, RT-4 and RT-11'
      provenance: internal
      verified_by: >-
        RELAYED from IDEA-20260830-c5c614, which records a PARTIAL read. NOT
        opened by this coordinator; used only to size an instrument check.
      role: the motivating measurement and the anchor target
    - description: >-
        The algebraic link between the target x-coordinate and the summand
        x-coordinates through the summation polynomial, which is what makes an
        x-line bias visible from the representation alone.
      citation: 'Semaev, summation polynomials and the DLP on elliptic curves'
      provenance: recalled
      verified_by: null
      role: the causal route; not fetched or read by any agent under this task
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement is a measured decay
      exponent for one statistic on one channel.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- closed-form total check per cell: sum of the k cell totals against
        binomial(B_eff + m - 1, m). UNITS: integer
      direction: different
      minimum_effect: >-
        FORCED EXACT, deviation exactly 0 with integer counters. Any nonzero
        deviation is an implementation error and halts the battery.
    - metric: >-
        P2 -- k = 1 baseline slice: lift and precision. UNITS: dimensionless
        ratio
      direction: different
      minimum_effect: 'FORCED exactly 1 and 1, reproducing the conservation identity.'
    - metric: >-
        P3 -- maximum lift over the frozen grammar for the MATCHED RANDOM BASE,
        against the random-partition selection null at the same cell-size
        profile, 1000 draws. UNITS: dimensionless ratio
      direction: different
      minimum_effect: >-
        FORCED AGREEMENT within the measured null band at every rung. If the
        random base own maximum sits above its own selection null, the grammar or
        the null is broken and no other number in the run is readable.
    - metric: >-
        P4 -- LOG-SPACE ANCHOR lift on the small-multiples base at a one-eighth
        window. UNITS: dimensionless ratio
      direction: higher
      minimum_effect: >-
        At least 4.0, against a relayed reference value of about 8.01 at one
        recorded cell. THIS IS THE DYNAMIC-RANGE CONTROL: a lift of known
        approximate magnitude is planted where a discrete logarithm is allowed,
        and the instrument must see it. Falling below 4.0 means the apparatus
        cannot see a lift that is known to be there, and every null it reports is
        void. The threshold is set at half the relayed reference precisely
        because the reference is relayed and not independently confirmed.
    - metric: >-
        P5 -- excess of the maximum lift over the random-partition selection
        null, for the x-line geometries, per rung. UNITS: dimensionless ratio
      direction: higher
      minimum_effect: >-
        The threshold is the UPPER QUANTILE OF THE MEASURED NULL DISTRIBUTION at
        that cell-size profile, computed from the 1000 partition draws, and NOT a
        fixed absolute number. The source idea fixed threshold of 0.02 is not
        used, because whether 0.02 is above or below the selection-bias floor is
        a property of the grammar size and the cell sizes and is not known before
        the null is measured. Any excess below the measured quantile is reported
        as UNRESOLVED, never as an effect.
    - metric: >-
        P6 -- fitted slope of log(excess) against log N, per geometry, with a
        Holm-corrected interval. UNITS: dimensionless exponent
      direction: different
      minimum_effect: >-
        Compared against TWO pre-registered values with no sign pre-committed. An
        interval containing -1/2 and excluding 0 reads as square-root
        cancellation: the channel is closed with an exponent attached. An
        interval containing 0 and excluding -1/2 reads as survival: the channel
        is ALIVE. An interval containing both is UNDERPOWERED and is reported as
        such. THE REQUIRED RUNG COUNT AND PRECISION FOR A STATED SEPARATION
        BETWEEN -1/2 AND 0 ARE COMPUTED IN STAGE 0 AND REPORTED BEFORE THE
        LADDER RUNS, so an underpowered fit is declared in advance rather than
        discovered as a null.
    - metric: >-
        P7 -- decomposability precision and the net solve-skipping gain, net of
        the MEASURED predicate and regeneration cost. UNITS: dimensionless ratio
      direction: higher
      minimum_effect: >-
        At least 1.05 at any rung to be worth anything. A net gain below 1.0
        means the filter costs more than it saves and the recognizability channel
        is closed at these parameters even if the precision exceeds 1.
    - metric: >-
        P8 -- CURVE-FREE PUSHFORWARD NULL: the identical grammar, selection null
        and excess statistic on an abstract cyclic group of the same order with a
        synthetic representation label and an abstract base of matched size, at
        every rung. UNITS: dimensionless ratio and exponent
      direction: different
      minimum_effect: >-
        MEASURED AND REPORTED BESIDE EVERY CURVE ARM, with no predicted value.
        BLOCKING FOR ATTRIBUTION: the pushforward of a conserved count vector
        along a partition is defined for any finite abelian group with any
        labelling map. If the curve-free null reproduces the excess and its decay
        exponent, the finding is about pushforwards of conserved vectors and NO
        artifact may describe it as a statement about elliptic curves, summation
        polynomials or the ECDLP.
    - metric: >-
        P9 -- measured generation, predicate and solve costs in the same process,
        and the derived admissible density floor. UNITS: seconds and field
        operations
      direction: different
      minimum_effect: >-
        MEASURED, never imported. The entire monetisation of both metrics rests
        on this ratio and it is the cheapest thing in the design to measure
        directly.
  test_boundary:
    instances:
      - 'generated prime-order curves at N about 2^12, 2^14, 2^16, 2^18; 4 curves and 4 seeds per rung'
      - 'a six-arm geometry panel including the matched random null and the small-multiples log-space arm'
      - 'CURVE-FREE: an abstract cyclic group of the same order with a synthetic representation label'
    parameters:
      m: '3'
      B_rule: 'the frozen convention, with negation-collapsed effective size in every denominator'
      grammar: >-
        frozen in the contract before any cell runs: top k bits of x for k in
        {1, 2, 3}; the quadratic-residue class of x; bottom k bits of x for k in
        {1, 2, 3}; a declared high-bit interval matching one panel geometry own
        interval; plus the UNREALIZABLE log-space anchor, which exists only for
        calibration and is labelled as such on every row
      selection_null_draws: '1000 random partitions per cell-size profile'
      pooling_rule: 'cells with expected total below 30 are pooled by a rule frozen in Stage 0, never after seeing results'
      grammar_scaling: 'held fixed in BIT DEPTH rather than in absolute cell count, with both reported'
    implementation: >-
      Exhaustive enumeration of the complete count vector over the group per arm,
      so there is no sampling error in the cell totals and the only spread is
      across curves and seeds. No Groebner basis is built in the enumeration
      stages; solves are run only for timing under a declared wall-clock cap, and
      a cap hit is an infrastructure stop and never negative evidence.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 12
      maximum_memory_gb: 8
      maximum_runs: 400
  falsification_conditions:
    - >-
      F1 IMPLEMENTATION ERROR. Any cell totals fail to sum to the conserved
      total. The battery halts and nothing is reported.
    - >-
      F2 PIPELINE CONTRADICTS A COMMITTED IDENTITY. The k = 1 slice returns
      anything other than lift and precision both exactly 1.
    - >-
      F3 NULL MISCALIBRATED. The matched random base maximum lift exceeds its own
      random-partition null band at any rung. No effect in the run is readable.
    - >-
      F4 INSTRUMENT BLIND. The log-space anchor fails to show a lift of at least
      4.0 on the small-multiples base. The apparatus cannot see a lift that is
      known to be there and its nulls mean nothing.
    - >-
      F5 UNDERPOWERED, DECLARED IN ADVANCE. The Stage 0 power computation shows
      four rungs cannot separate -1/2 from 0 at the achievable precision. The
      slope arm is reported as underpowered with the required rung count stated,
      and no closure or survival is claimed from it.
    - >-
      F6 CHANNEL CLOSED. Every x-line geometry excess lies inside the measured
      selection-null band at every rung. The representation-side channel is
      closed over the frozen grammar, the tested panel and the tested range --
      the expected outcome -- and the deliverable is the measured band with its
      scaling, a bounded obstruction with a number, not a verdict.
    - >-
      F7 CHANNEL SURVIVES. The fitted slope interval contains 0 and excludes
      -1/2 for an x-line geometry, and the curve-free null does NOT reproduce it.
      RQ-FBG-001 growth clause is met on a realizable channel.
    - >-
      F8 ATTRIBUTION DENIED. The curve-free pushforward null reproduces the
      excess and its scaling. The finding is about pushforwards of conserved
      count vectors and not about elliptic curves; every artifact must say so in
      its own words.
    - >-
      F9 FILTER UNAFFORDABLE. The net solve-skipping gain is below 1.0 at every
      rung once predicate and regeneration costs are charged. The recognizability
      half is closed at these parameters even if the precision exceeds 1.
  interpretation_limits:
    - >-
      A measured lift is NOT a speedup and NOT an attack. No solve is
      accelerated, no relation is collected, no discrete logarithm is computed.
      The cost ledger is arithmetic over a cost model, not a measurement of a
      running algorithm.
    - >-
      A null closes the existential over ONE frozen grammar, ONE panel and ONE
      range. It says nothing about predicates outside the grammar, and the
      grammar is small and hand-chosen.
    - >-
      Toy scale, four rungs. A fitted exponent over four points with a Holm
      correction is a trend with a wide interval, not an asymptotic rate, and may
      not be quoted as one.
    - >-
      This record measures neither coverage nor rank nor solve cost and may not
      be cited about any of them; its observable provably fails to determine
      them.
    - >-
      The dominant confounder is the selection bias of a maximum over a grammar,
