hypothesis:
  id: H-SSIQ-6e0748
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-002
  statement: >-
    On the exhaustive minimal-degree data released with arXiv:2607.14624
    (Aubry-Oyono-Vincent), the counting function
    N(T, p) = #{supersingular E/F_bar_p : delta_E <= T}
    is described by a power law N = c * T^alpha * p^beta with
    alpha = 3/2 and beta = 1/2,
    the exponents predicted by derivation D1 of
    coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/TASK-20260805-87e568/L1_ceiling_audit.md
    section 6. The competing model, in which D1's ingredient (c) contributes a
    factor n^{1/2} rather than (np)^{o(1)}, predicts alpha = 2.
  statement_note: >-
    THE TWO MODELS ARE THE POINT. This hypothesis exists to be discriminated,
    not confirmed: alpha near 3/2 leaves lever L1 CLOSED-IN-SCOPE, and alpha
    near 2 FIRES THE PRE-COMMITTED REVERSION recorded in
    checkpoints/BATCH-001.yaml — L1 disjunct 2 returns to UNRESOLVED and the
    p^{1/4} degree-bound route reopens at exactly the target exponent. A test
    that could only agree would be worthless here.
  mechanism: >-
    D1 counts supersingular curves with a small minimal isogeny to their
    Frobenius conjugate by counting optimal embeddings of imaginary quadratic
    orders of discriminant -4nT-scale into maximal orders of B_{p,infinity},
    weighting by class number, and dividing by the p/12 total mass. The T
    dependence enters as (number of admissible n) x (class number h(D) ~
    |D|^{1/2}) = T x T^{1/2} = T^{3/2}; the p dependence enters as
    (mass of one class) / (p/12) with the embedding count contributing p^{1/2}.
    If instead the sum over intermediate orders between Z[sqrt(-np)] and the
    maximal order contributed n^{1/2} rather than (np)^{o(1)}, the T exponent
    would rise to 2 and the bound on the p^{1/4} fraction would degrade from
    p^{-1/8+o(1)} to p^{-o(1)} — which is exactly the threshold that decides
    L1's second disjunct.
  assumptions:
    - >-
      The released data is exhaustive over supersingular j-invariants for each
      p it covers, and delta_E in the dataset is the minimal degree of an
      isogeny E -> E^{(p)} in the same normalisation D1 uses. IF THE
      NORMALISATION DIFFERS, the run is invalid rather than negative — this is
      an invalidation rule, not a result.
    - >-
      The covered range (p <= 265207, log2 p <= 18) is deep enough to separate
      alpha = 3/2 from alpha = 2 at the achievable T range. If it is not, the
      correct outcome is INCONCLUSIVE with the separating power reported, NOT a
      verdict for either model.
    - >-
      An asymptotic prediction is being tested at sub-toy scale. Agreement is
      weak evidence; disagreement at a magnitude exceeding the fit's own
      uncertainty is strong evidence, because the failure mode predicts a
      DIFFERENT EXPONENT rather than a different constant.
  proof_search_map:
    not_applicable_reason: >-
      NOT a proof-oriented hypothesis. This is an empirical falsification test
      of one derivation's exponent, not a proposed mechanism for lowering the
      cost of a hard problem. docs/inventor-protocol.md section 8 binds
      proof-oriented proposals; the section-8 audit that this test serves was
      already performed in BATCH-001 (TASK-20260805-87e568) and is what
      produced D1. Filling this block with a bottleneck and a method ceiling
      would misrepresent an instrument check as a proposed attack.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. This hypothesis claims no complexity improvement
    of any kind. It predicts the exponents of a counting function in a dataset.
    Nothing here bears on the cost of the supersingular isogeny problem.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None. D1 is a derivation from standard analytic and Deuring-correspondence
    ingredients, not a heuristic in the sense of the archived source's
    Heuristic 1. The three ingredients that are not fetched-and-verified are
    recorded in EV-SSIQ-e43afd unresolved_confounds, and ingredient (d) is the
    one with no artifact at all (Validator finding V9).
  status: analyzed
  status_note: >-
    MOVED proposed -> analyzed by DEC-20260805-be2f87 on EV-SSIQ-29fcbb.
    analyzed, NOT supported and NOT weakened, and the distinction is the whole
    point: the test ran to completion under a contract frozen 71 seconds before
    the first data request, and returned INCONCLUSIVE with its primary metric
    VOID. Independent validation then established that the frozen instrument
    could not have returned the supporting branch AT ANY DATA (two null
    ensembles, different families and different code, agreeing to 0.005 on a
    ~ -0.36 bias, 1.8x the decision rule's own tolerance).
    So this hypothesis has been ANALYSED and remains UNTESTED. It is not
    retired: it is untestable on the accessible data, because T = p^{1/4} sits
    in saturation at every prime the dataset covers and discrimination needs
    log2 p >~ 22.5. Revisit if such data appears; do not re-run the same
    instrument.
    Only the Coordinator changes hypothesis status (AGENTS.md rule 1).
  scope_ceiling:
    claim_tier: toy
    detail: >-
      SUB-TOY, and it must be reported as such. The data reaches log2 p <= 18,
      BELOW the toy band RQ-SSIQ-9702af declares for this goal. No result from
      this hypothesis may be cited at toy scale without that qualifier, and
      none may be cited at crypto scale at all.
  why_this_test_and_not_another: >-
    It fails DIFFERENTLY from same-model re-derivation. Every session in
    BATCH-001 resolved to one model, so the single unresolved confound was that
    a shared systematic error would go uncaught (EV-SSIQ-e43afd
    unresolved_confounds, Validator V1). Re-deriving D1 again in a fifth
    session of the same model cannot fix that; measuring the exponent it
    predicts against data the model did not generate can. This is the Red Team's
    REC-1, chosen by DEC-20260805-2be965.
  owner: coordinator
  created_at: '2026-08-05'
