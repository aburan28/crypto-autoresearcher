  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, THE PRIMARY FALSIFIER). Any committed
      `surviving_(k3,k4)_pairs` value lying outside a 3-sd binomial interval
      around its forced value. U1 is refuted, parts (A)-(D) fall, and OBS-B2-1
      is STRONGER than claimed. This costs no compute and is the cheapest
      possible refutation.
    - >-
      F2. The pseudorandom-sieve surrogate failing to reproduce {1: 16} and
      {0: 16}. Part (B) is unsupported and is withdrawn.
    - >-
      F3. Stage 0 finding that the filter is not an 8-bit equality per structure
      or that the candidate space is not 2^20. The derivation is void.
    - >-
      F4. A measured slot dependence in the falsified-arm survivor rate. Part
      (D) is refuted and the finding is about the filter, not the control.
    - >-
      F5. Measured true-arm and falsified-arm S = 2 counts not differing by
      approximately 16 across three independent keys. HEUR-D2 is refuted and the
      arms are indistinguishable at every S, which would make part (C)'s
      proposed repair useless as well.
    - >-
      F6 (THE PLANNED NEGATIVE, PRE-REGISTERED BEFORE ANY GATE). If every gate
      passes, the deliverable is NOT "the control is worthless". It is a
      re-scoping statement naming exactly what OBS-B2-1 establishes (hint
      consumption, near-total power) and exactly what it does not (key
      isolation, near-zero power), PLUS the measured value of U1 with its
      interval, PLUS the repaired control specification. A pass that does not
      produce all three HAS NOT FINISHED. The negative disposition is a
      DELIVERABLE, not a failure.

  interpretation_limits:
    - >-
      CLAIM TIER toy and it may not be raised by any downstream citation.
      Reduced-round AES-128 only, r in {6, 7}, one construction, one machine.
      No statement about full-round or deployed AES under any outcome
      (RQ-AES-003 R6).
    - >-
      NO COMPARISON TO PUBLISHED CRYPTANALYSIS IS MADE IN EITHER DIRECTION
      (RQ-AES-003 R3, symmetric). Nothing here is claimed novel and nothing is
      claimed known.
    - >-
      THIS HYPOTHESIS IS SILENT ON WHETHER THE CONSTRUCTIONS ISOLATE THE CORRECT
      KEY BYTE. It concerns what the reported control measures. Merging the two
      would be the error the record exists to name.
    - >-
      NO STATUS CHANGE to EV-AES-005, EV-AES-d33b1c, EV-AES-d8a13e,
      DEC-20260802-9bda5c or DEC-20260802-b226fb is proposed or implied. Any
      re-scoping is a Coordinator act on a superseding record, never an edit
      (AGENTS.md rules 1 and 4).
    - >-
      INSTRUMENT FINDING, NOT MECHANISM FINDING. This bears on the CONTROL, which
      is the instrument. It supports and weakens no hypothesis about AES.
    - >-
      A pass here does NOT license the r=6 construction in any way. It remains
      DOMINATED (69.39 s against roughly 25 s over the same hinted residual,
      with 2^33 chosen plaintexts against O(1)), and r=7 remains not a key
      recovery.

