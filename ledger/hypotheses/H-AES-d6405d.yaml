      - >-
        New executions of the committed sq_null.c binary at nstruct in {1, 2, 3}
        and corruption slots t in {0, 1, 2}, on at least three independent
        target keys per cell.
      - >-
        A pseudorandom 8-bit sieve surrogate over the identical 2^20 candidate
        space, 20 trials with and 20 without planted pairs.
    parameters:
      cipher: AES-128, C1 reduced-round convention
      round_counts: [6, 7]
      candidate_space_per_cell: 65536
      cells: 16
      candidate_space_total: 1048576
      structures_S: [1, 2, 3]
      corruption_slots_t: [0, 1, 2]
      texts_per_structure: 4294967296
      independent_target_keys_minimum: 3
    implementation: >-
      The committed sq_null.c binary, rebuilt from its committed source with the
      recorded flags, plus a new surrogate written for this hypothesis. The
      proposing session has no shell for the executing environment and did NOT
      compute artifact digests; the Executor records instrument paths and
      sha256 values at setup.
    budget:
      stage_0_and_1_wall_clock_seconds: 1800
      stage_0_and_1_compute: "zero cipher work; arithmetic and file reading only"
      stage_2_wall_clock_seconds: 600
      stage_3_wall_clock_seconds_ceiling: 9000
      stage_3_note: >-
        Stage 3 is NOT authorized by this record. Only the Coordinator approves
        execution (AGENTS.md rule 1). The committed fold times of 44.36-128.15 s
