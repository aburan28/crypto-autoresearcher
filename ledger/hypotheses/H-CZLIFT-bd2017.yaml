  title: The canonical-lift rule and the torsion-section identities hold unchanged for p between 10^4 and 10^5
  statement: 'On 24 class-number-one CM anomalous curves and 16 CM-canonical plus 8 random-lift non-anomalous curves
    sampled with 10^4 <= p <= 10^5: rule_agreement = 1 and nondegenerate_success_rate = 1 for Smart''s attack against
    the canonical lift (precision 8), the five torsion-section rates equal 1 with identity_rate 1 for every section
    (precision 4), and every success rate sits within 4 standard errors of 1/p, moving the claim tier of H-CZLIFT-889c9d
    and H-CZLIFT-6d4ed1 from toy to medium.'
  mechanism: Both measurements are exact at every precision; nothing in them depends on p beyond the cost of exact
    point counting, which the sampler confines to the sampled curves.
  assumptions:
  - '#E(F_p) counted exactly by Legendre sums on the sampled curves only'
  - subgroup orders n >= 101 and n != p on the non-anomalous arm
  proof_search_map:
    not_applicable_reason: bounded measurement against a pre-registered prediction; no asymptotic claim
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
  - description: canonical prime-to-p torsion lifting and its reduction-isomorphism boundary
    citation: knowledge/techniques/KN-TECH-73630e.md
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the entry on disk
    role: the object the calibration and the construction instrument mirror
  reduction_chain:
    core_problem: whether a characteristic-zero lift of the ECDLP carries discrete-log information at the tested
      scope
    corollaries: []
  predictions:
  - metric: anomalous.rule_agreement, anomalous.nondegenerate_success_rate
    direction: different
    minimum_effect: exactly 1.0
  - metric: torsion rates and identity_rate
    direction: different
    minimum_effect: exactly 1.0
  - metric: success z-scores (both arms)
    direction: different
    minimum_effect: '|z| <= 4'
  test_boundary:
    instances:
    - 24 anomalous CM curves, 16 CM-canonical and 8 random-lift non-anomalous curves, 10^4 <= p <= 10^5, two seeds
    parameters:
      precision_a: 8
      precision_b: 4
    implementation: experiments/EXP-CZLIFT-f5e06c/implementation/run.py reusing the lane-1 drivers' measure_curve
      and summarize
    budget:
      wall_clock_seconds_per_run: 3600
  falsification_conditions:
  - any rule disagreement or identity failure
  - a section with z > 4 on both seeds
  interpretation_limits:
  - CM curves only at medium scale (random curves need counting the harness lacks beyond 10^5)
  status: approved
  status_note: Pre-run approval paired to EXP-CZLIFT-f5e06c under DEC-20261009-575cd3; asserts nothing about truth.
