  title: The canonical-lift rule and the torsion-section identities hold unchanged for p between 10^4 and 10^5
  statement: 'On 24 class-number-one CM anomalous curves and 16 CM-canonical plus 8 random-lift non-anomalous curves
    sampled with 10^4 <= p <= 10^5: rule_agreement = 1 and nondegenerate_success_rate = 1 for Smart''s attack against
    the canonical lift (precision 8), the five torsion-section rates equal 1 with identity_rate 1 for every section
    (precision 4), and every success rate sits within 4 standard errors of 1/p, moving the claim tier of H-CZLIFT-889c9d
    and H-CZLIFT-6d4ed1 from toy to medium.'
  mechanism: Both measurements are exact at every precision; nothing in them depends on p beyond the cost of exact
    point counting, which the sampler confines to the sampled curves.
  assumptions:
  - '#E(F_p) counted exactly by Legendre sums on the sampled curves only'
  - subgroup orders n >= 101 and n != p on the non-anomalous arm
  proof_search_map:
    not_applicable_reason: bounded measurement against a pre-registered prediction; no asymptotic claim
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
