  status_note: >-
    Decision refine (DEC-20261023-9de83a, EV-CZLIFT-e9a7cf).
    The exact clauses hold on both seeds at toy tier: the rule, Smart's recovery
    on pert_p lifts, the five torsion rates, the tau-ratio identity and the cost
    bound. The torsion clauses rest on same-code evidence.
    The 1/p clauses are inconclusive. The data bound the rates below 8.7e-4 per
    row (anomalous) and 5.2e-3 per row per torsion section, at 95%.
    "Moving the claim tier ... from toy to medium" is not met, because fields of
    at most 17 bits are toy by the mechanical rule.
    The open random-model rate goes to a numbered-heuristic successor.
    Not official until the ledger commit of TASK-20261023-4d7449 is verified.
