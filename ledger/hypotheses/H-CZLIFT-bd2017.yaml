    role: the object the calibration and the construction instrument mirror
  reduction_chain:
    core_problem: whether a characteristic-zero lift of the ECDLP carries discrete-log information at the tested
      scope
    corollaries: []
  predictions:
  - metric: anomalous.rule_agreement, anomalous.nondegenerate_success_rate
    direction: different
    minimum_effect: exactly 1.0
  - metric: torsion rates and identity_rate
    direction: different
    minimum_effect: exactly 1.0
  - metric: success z-scores (both arms)
    direction: different
    minimum_effect: '|z| <= 4'
  test_boundary:
    instances:
    - 24 anomalous CM curves, 16 CM-canonical and 8 random-lift non-anomalous curves, 10^4 <= p <= 10^5, two seeds
    parameters:
      precision_a: 8
      precision_b: 4
    implementation: experiments/EXP-CZLIFT-f5e06c/implementation/run.py reusing the lane-1 drivers' measure_curve
      and summarize
    budget:
      wall_clock_seconds_per_run: 3600
  falsification_conditions:
