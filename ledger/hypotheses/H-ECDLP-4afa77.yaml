  statement: >
    Fix cyclic groups Z/13 and Z/17 and a offset set S
    chosen before any subset is read. For a finite
    subset F, write C2(F) for the pair-correlation
    vector a |-> |{x in F : x+a in F}| and C3(F;S) for
    the triple-correlation vector (a,b) in S |->
    |{x in F : x+a in F and x+b in F}|. Stage 0 asserts
    only the instrument prediction of IDEA-20260905-c5113d
    on one frozen family: (i) every translate and every
    reflection of a frozen subset shares both C2 and
    C3; (ii) the two frozen C2-homometric pairs that
    are not in the same translation-reflection orbit
    have unequal C3 on the frozen S; (iii) a size-wrong
    or empty object is rejected before any certificate
    is read as a fiber. A later unauthorized stage may
    ask whether a sparse subset of S identifies every
    fiber in a larger family. Neither reading is a
    Fourier learner, a scalar decoder, or an ECDLP
    advantage.
  mechanism: >
    Pair correlation records squared Fourier magnitudes
    and forgets relative phase. Triple correlation
    couples three frequencies, so a relative phase can
    survive. Stage 0 evaluates that distinction on two
    frozen cyclic groups with a frozen offset set, two
    frozen C2-homometric non-equivalent pairs, one
    frozen translate, one frozen reflection, and one
    frozen same-size null per group. This is a new
    RQ-ECDLP-002 object after the BATCH-33cdc3
    lifting-audit trio is exhausted for this lane
    (4dca34 through Stage 1 as P-S1-RELATIVE, 8829cc
    through Stage 1 as P-S1-LDIV, 3e9133 already
    EXP-ECDLP-a5f766). It is not Stage 2 of
    EXP-ECDLP-4be480 and not Stage 2 of EXP-ECDLP-6a97f4.
  predictions:
    - id: P-S0-TRIPLECORR
      metric: well-defined C2 and C3 certificates on the frozen family
      direction: different
      minimum_effect: >
        After fixture_pass, every frozen admissible
        subset has a C2 vector of length n and a C3
        vector of length |S|. Translates and reflections
        share both vectors. Size-wrong and empty objects
        are rejected. One certified mismatch after
        fixture_pass is a scoped falsification of this
        instrument claim on the frozen family.
      claim_tier: observational
    - id: P-S0-PHASESEP
      metric: C3 inequality on each frozen C2-homometric non-equivalent pair
      direction: different
      minimum_effect: >
        Predicted exact: C2(F13-A)=C2(F13-B) and
        C3(F13-A;S13)!=C3(F13-B;S13); likewise for
        F17-A and F17-B on S17. Translation and
        reflection collisions persist exactly.
      claim_tier: observational
    - id: P-S1-SPARSEID
      metric: identifiability from a sparse subset of S
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0 does not
        search for a smaller offset set and does not
        claim fiber identifiability outside the frozen
        family.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-TRANSLATELEAK
      statement: >
        After fixture_pass, a frozen subset and its
        frozen translate have different C2 or different
        C3. If the mismatch is an encoding bug,
        classify failed_infrastructure.
    - id: F-S0-PHASESEP
      statement: >
        After fixture_pass, a frozen C2-homometric
        non-equivalent pair has equal C3 on the frozen
        S. That falsifies only P-S0-PHASESEP on this
        family.
    - id: F-S1-TRUTHTABLE
      statement: >
        After an authorized later stage, a claimed
        compact certificate retains the complete subset
        table. Unauthorized here.
  test_boundary:
    instances:
      - frozen Stage 0 two-group panel Z/13 and Z/17
    parameters:
      n13: 13
      n17: 17
      k13: 4
      k17: 6
      n_offsets_13: 6
      n_offsets_17: 6
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-90f602 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is a pair-versus-triple
      correlation instrument on two frozen cyclic
      groups. It is not a Fourier learner, not a
      scalar decoder, not Stage 2 of EXP-ECDLP-4be480,
      not Stage 2 of EXP-ECDLP-6a97f4, and not
      Stage 17 of EXP-ECDLP-420e73. No cryptographic
      transfer. Do not hunt a new subset. Do not
      enlarge S after this freeze.
  assumptions:
    - id: A1
      statement: >
        C2 and C3 are translation-invariant and
        reflection-invariant on a cyclic group. A
        certificate that separates a subset from its
        translate or reflection proves too much.
      status: explicit
    - id: A2
      statement: >
        Equivalence is the dihedral action generated
        by x |-> x+t and x |-> -x+t. No other
        automorphism is quotiented in Stage 0.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06 covers
        protocol approval once the contract is complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Compact, complete certification of a sparse
      third-order fiber correlation tensor. Stage 0
      only checks that the dense frozen-S tensor is
      well-defined and separates the frozen
      C2-homometric pairs.
    baseline_embedding:
      parameter_slice: >
        The matched-null and known-false fixtures in
        the Stage 0 family.
      reproduction_check: >
        Exact identity of C2 and C3 on every translate
        and reflection. Known-false control must remain
        unseparated.
    observation_collision:
      observable: >
        Number of non-equivalent fibers sharing a
        chosen pair or triple correlation certificate.
      distinct_preimage_search: >
        Hold C2 fixed on the frozen homometric pairs
        and read C3. Hold C2 and C3 fixed on the
        frozen translate and reflection.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >
          Frozen-S third-order fiber correlation tensor.
        predicted_gain: >
          Exact C2-collision / C3-separation on the
          frozen family. Zero claimed solver improvement.
    quantifier_order: >
      Freeze n, k, S, and the subset lists before
      reading certificates. Existential separation on
      this family does not imply a sparse S that
      identifies every F, and does not imply a decoder.
    method_ceiling:
      strongest_certifiable_claim: >
        Identifiability within the declared finite
        family up to the dihedral stabilizer. Never a
        scalar extraction result. Never an ECDLP
        exponent.
      nearby_object_control: >
        A subset and its translate necessarily share
        every translation-invariant correlation. An
        argument that separates them proves too much.
        Size-wrong objects are rejected before any
        certificate is read as a fiber.
    proof_obligations:
      - claim: well-defined C2 and C3 under the declared equivalences
        responsibility: correctness
      - claim: exact translate and reflection identity
        responsibility: baseline
      - claim: C3 separation of the frozen C2-homometric pairs
        responsibility: baseline
      - claim: no decoder, no Stage 2 of 4be480, no Stage 2 of 6a97f4, no Stage 17 of 420e73
        responsibility: interface
    not_applicable_reason: null
