  title: >
    On two frozen cyclic groups, a predeclared offset
    set makes the third-order correlation certificate
    separate at least one C2-homometric non-equivalent
    pair, while every translate and reflection shares
    both certificates
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260908-e70fa5
