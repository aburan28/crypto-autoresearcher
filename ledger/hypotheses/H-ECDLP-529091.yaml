# H-ECDLP-529091
# Hit-rate exponent arithmetic for IDEA-20261002-6e6ce8.
# No hit rate is measured. Approval: DEC-20261002-7fff2c.
hypothesis:
  id: H-ECDLP-529091
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20261002-6e6ce8
  experiment_id: EXP-ECDLP-2573eb
  specified_at: '2026-10-02'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261002-7fff2c
  title: >-
    At epsilon 1/8 the model exponent is 7/16.
  statement: >-
    At m = 5 and theta = 1 the model exponent is 2 times (1 minus
    epsilon) divided by 4. At epsilon = 0 the exponent is 1/2, so the
    gap is 0. At epsilon = 1/8 the exponent is 7/16, which is 1/16
    below 1/2. The cross products of 7/16 and 1/2 are 14 and 16, and
    their difference is 2. A constant factor of 2 does not appear in
    the exponent, so the epsilon = 0 cell stays equal to 1/2.
  mechanism: >-
    The proposal writes the balanced exponent
    2(1 - epsilon)/(m - theta). This contract checks that rational at
    two cells. It does not count hits and it does not build a curve.
  assumptions: []
  proof_search_map:
    bottleneck: The cross gap 2, which is the gap 1/16.
    baseline_embedding:
      parameter_slice: >-
        The balance written in IDEA-20261002-6e6ce8, read 2026-10-02.
        The fractions were computed in this design session. That
        computation is not a run.
      reproduction_check: >-
        One route cross-multiplies 7/16 against 1/2. The other
        evaluates 2(1 - epsilon)/4 at epsilon 0 and epsilon 1/8. They
        must agree on the gap 1/16.
    observation_collision:
      observable: The gap 1/16, and the exact tie at epsilon = 0.
      distinct_preimage_search: >-
        Reporting 7/16 as equal to 1/2 drops the gap 1/16. Reporting
        the epsilon = 0 cell as strictly below 1/2 drops the tie.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Two cells of the exponent at m = 5 and theta = 1.
        predicted_gain: Integer comparisons. No hit count.
    quantifier_order: >-
      The epsilon = 0 tie comes first, then the epsilon = 1/8 gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The gap 1/16 and the tie at epsilon = 0. Not a measured hit
        rate and not an attack cost.
      nearby_object_control: >-
        Epsilon = 0 reported as strictly below 1/2, and 7/16 reported
        as equal to 1/2.
    proof_obligations:
      - claim: 7/16 is 1/16 below 1/2.
        responsibility: correctness
      - claim: At epsilon = 0 the exponent equals 1/2.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Comparing 7/16 with 1/2 is an integer cross-multiplication.
        Those products were computed in this design session. That work
        is not a run.
      citation: ledger/proposals/IDEA-20261002-6e6ce8.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-02 (the fractions recomputed; no hit rate measured)
      role: the model exponent
  reduction_chain:
    core_problem: Check the two cells of 2(1 - epsilon)/4.
    corollaries: []
  predictions:
    - metric: gap_eighth
      direction: different
      minimum_effect: 7/16 is 1/16 below 1/2.
    - metric: tie_at_zero
      direction: different
      minimum_effect: At epsilon = 0 the gap is 0.
  test_boundary:
    instances: [two cells]
    parameters:
      gap_num: 1
      gap_den: 16
      cross_low: 14
      cross_high: 16
      cross_diff: 2
      tie_gap: 0
    implementation: Two arithmetic modules that must not import each other.
    budget:
      maximum_runs: 2
      maximum_memory_gb: 1
      maximum_workers: 1
  falsification_conditions:
    - Both implementations agree, the cross products of 7/16 and 1/2 are 14 and 16, and their difference is not 2.
  interpretation_limits:
    - This does not measure a hit rate and does not list cosets.
    - The papers named in the proposal were not reopened for this approval.
  dominated_by: No attack is claimed.
  sota_delta:
    time: No attack cost.
    memory: Not measured.
    data_queries: Not applicable.
