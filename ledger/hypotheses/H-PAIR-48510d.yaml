# H-PAIR-48510d
# Split and inert trace verdicts at 16, 20, 24, and 28 bits.
hypothesis:
  id: H-PAIR-48510d
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-PAIR-001
  source_idea: IDEA-20261005-3a18d1
  experiment_id: EXP-PAIR-c28df1
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-295703
  title: >-
    The class polynomial keeps the split traces through 28-bit primes
  statement: >-
    For discriminants -7, -23, and -47, and for each bit length
    B in {16, 20, 24, 28}, the smallest prime in the half-open
    interval from 2^(B-1) to 2^B that splits with a positive
    trace, and the smallest prime in that interval that is inert,
    behave as follows. On all 12 split cells, 4p = t^2 - v^2 D
    and every F_p-root gives twist traces {t, -t}. Root counts
    are 1, 3, and 5, matching the class numbers. On all 12 inert
    cells the Kronecker symbol is -1, each polynomial has one
    F_p-root, and that root's traces fail the norm equation.
    Sage and pari agree on the order of every split-root model,
    36 comparisons and 0 disagreements. These counts are a
    design-session prediction, not a run.
  mechanism: >-
    A split prime has a solution of the norm equation, so every
    exact root is a j-invariant of trace plus or minus t. An
    inert prime is outside that hypothesis. A root may still
    exist, and the failure mode is that its trace does not solve
    the norm equation. The bit-length bins test that reading at
    primes past 1811.
  assumptions:
    - p > 3. The curve of j = 0 is y^2 = x^3 + 1. The curve of j = 1728 is y^2 = x^3 + x. Otherwise k = j / (1728 - j) and the curve is y^2 = x^3 + 3 k x + 2 k.
    - A B-bit prime lies in 2^(B-1) <= p < 2^B. The split prime is the smallest such prime with Kronecker symbol 1 and a positive t solving 4p = t^2 - v^2 D for some positive integer v. The inert prime is the smallest such prime with Kronecker symbol -1.
    - Ground truth for a trace is a point count of the curve and of its quadratic twist. The label t is not ground truth.
    - The second counter is pari's cardinality of the same Weierstrass model. It is not a second count of the twist.
  proof_search_map:
    bottleneck: >-
      Whether an F_p-root at a 16-bit through 28-bit prime still
      has twist traces {t, -t} exactly on the split cells.
    baseline_embedding:
      parameter_slice: >-
        Three discriminants of class number 1, 3, and 5, and the
        smallest split and inert prime in each of four bit bins.
      reproduction_check: >-
        Two constructions of H_D agree as integer polynomials.
        On every split root, sage and pari cardinalities agree.
    observation_collision:
      observable: an inert root whose trace solves 4p = t^2 - v^2 D
      distinct_preimage_search: >-
        A split cell whose twist pair is not {t, -t}.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The same three discriminants read at the 28-bit end
          of the bin list.
        predicted_gain: >-
          The 28-bit split cells still have traces plus or minus
          t. No discrete-log exponent moves.
    quantifier_order: >-
      For each named discriminant, for each bit length, for the
      one selected prime, for each F_p-root.
    method_ceiling:
      strongest_certifiable_claim: >-
        The trace verdicts on these 12 split cells and 12 inert
        cells. Not a height law and not a statement about every
        prime in the bin.
      nearby_object_control: >-
        The class-number-1 discriminant -7. A trace mismatch
        there is a pipeline failure.
    proof_obligations:
      - claim: Every split twist pair equals {t, -t}
        responsibility: correctness
      - claim: Every inert root fails the norm equation
        responsibility: correctness
      - claim: Root counts are 1, 3, and 5
        responsibility: baseline
  predictions:
    - metric: split twist-pair match rate
      direction: higher
      minimum_effect: >-
        Match rate 1 on the 12 named cells. One certified
        mismatch falsifies the constructor on that cell.
    - metric: inert norm-equation hit count
      direction: lower
      minimum_effect: >-
        Hit count 0 on all 12 named inert cells, each of which
        still has one F_p-root.
  falsification_conditions:
    - >-
      One split cell whose point counts are certified and whose
      twist traces are not {t, -t} falsifies the split prediction
      on this window.
    - >-
      One inert root whose trace solves the norm equation
      falsifies the inert failure mode on this window.
  interpretation_limits:
    - The primes are the smallest in each bin, not a sample of the bin. No transfer to an unnamed prime is claimed.
    - A match on 12 cells does not certify the constructor outside the list.
    - Pollard rho, grumpy giants, and the automorphism discount are unchanged.
  test_boundary: >-
    Twelve split cells and twelve inert cells. The height
    regression and the primes at most 1811 are not part of
    this record.
