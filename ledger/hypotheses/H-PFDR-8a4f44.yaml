hypothesis:
  id: H-PFDR-8a4f44
  question_id: RQ-ECDLP-002
  goal_id: GOAL-PATH-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260808-726aa3
  batch_id: BATCH-2c45e2
  statement: >-
    THE SAVING A CHARACTER-SUM BOUND WOULD NEED IN ORDER TO CERTIFY A
    MULTIPLICATIVE-SUBGROUP FACTOR BASE IS NOT A SMALL IMPROVEMENT OVER
    SQUARE-ROOT CANCELLATION - IT IS THE WHOLE OF IT. Let H be the subgroup of the
    multiplicative group of the prime field of order B = (p-1)/d, so that
    membership is testable in polylog time by a single exponentiation, and let
    beta = log_p B. Expanding the windowed count of m-decompositions over the set
    of points whose x-coordinate lies in H by multiplicative characters gives a
    main term from the all-trivial character tuple and an error that is a sum of
    d^m - 1 nontrivial terms, each bounded by Weil-Deligne square-root
    cancellation at order p^{(m-1)/2} times a degree constant.
    (S1 THE DEFICIT IN CLOSED FORM) Under the source idea's stated bookkeeping the
    error dominates the main term exactly when
    D(m, beta) = (m-1)/2 + 2 - 2 m beta is positive, and the required saving gamma
    - the amount by which the exponent (m-1)/2 must drop for the inequality to
    reverse - equals D(m, beta). At the operating point beta = 1/m this gives
    gamma(m, 1/m) = (m-1)/2 EXACTLY, and the sign changes at
    beta* = (m+3)/(4 m).
    (S2 THE CONSEQUENCE, WHICH IS THE POINT) gamma(m, 1/m) = (m-1)/2 is the ENTIRE
    square-root exponent. So at the operating point no partial improvement over
    Weil-Deligne suffices - only TOTAL cancellation, a bound of the form |S| at
    most C with C independent of p, would close the gap. That converts a closure
    stated as "no known bound is strong enough" into a specific and almost
    certainly unattainable external requirement, which is a materially stronger
    and more useful statement than the original.
    (S3 THE DEFICIT IS NOT ELLIPTIC) The derivation uses only the degree and
    dimension of the hypersurface, the subgroup index, and the character-sum
    bookkeeping. It is predicted to be IDENTICAL for a curve-free absolutely
    irreducible hypersurface of the same degree and dimension. If so, gamma is a
    fact about exponential-sum bookkeeping and carries no elliptic-curve content,
    and must not be quoted as one.
  mechanism: >-
    The main term of the windowed decomposition count scales as B^m divided by p
    times the point count of the hypersurface, and the error as d^m times the
    Weil-Deligne bound, with d = p^{1-beta}. Because d^m grows as the factor base
    shrinks while the main term shrinks with it, the two race in opposite
    directions and the error wins below a threshold in beta. Writing out that race
    gives a linear function of beta whose value at the operating point is the
    deficit. The mechanism is the race itself; the research content is the NUMBER
    it produces and the fact that the number equals the whole exponent rather than
    a fraction of it. Naming that number converts a closure into a searchable
    external target - and, in this case, into an external target that is
    recognisably out of reach, which is a stronger closure than the one it
    replaces.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE BAND IS NON-DEGENERATE ONLY IF beta IS SWEPT, AND THE SOURCE IDEA DOES
      NOT SWEEP IT. The idea's falsifier is "gamma at most 0 at some admissible
      (m, beta)", but its stated operating point is the single value beta = 1/m,
      where TASK-20260904-5423ad computed gamma = (m-1)/2, which is strictly
      positive for every m at least 2 and can never reach 0. Evaluated only at the
      operating point the falsifier cannot fire, and the record would report a
      derivation with no discriminator.
    change_made: >-
      beta is swept over a declared range from 0.20 to 0.80 in steps of 0.05, at m
      in {2, 3, 4, 6}. TASK-20260904-5423ad computed the zero crossing at
      beta* = (m+3)/(4m), which is 0.625, 0.500, 0.4375 and 0.3750 for
      m = 2, 3, 4, 6 respectively - every one of them inside the declared sweep.
      The sign of gamma therefore changes within the tested range, the falsifier
      can fire, and a cell with gamma at most 0 is an immediately testable
      certified cell rather than a hypothetical.
    alternative_hypothesis_range: >-
      The competing explanation of the closure is that the d^m factor is a loose
      union bound and the true error is far smaller through cancellation among
      character tuples - in which case the deficit is overstated and gamma is
      smaller than derived. That alternative is measured directly by computing the
      exact character-sum expansion at small d and small m and comparing the true
      error against d^m times the maximum single sum. The ratio of true error to
      union bound is a dimensionless quantity in the range from 0 to 1 with real
      dynamic range; a ratio consistently below 0.1 would reduce gamma materially
      and is a reportable softening of the closure rather than a failure.
  assumptions:
  - >-
    The summation polynomial hypersurface is absolutely irreducible at the tested
    parameters, so Weil-Deligne applies with the stated degree constants. This is
    checked per cell and a cell where irreducibility fails is reported and
    excluded rather than assumed.
  - >-
    H is a subgroup of the multiplicative group of the prime field of index d,
    with membership decided by one exponentiation.
  - >-
    THE INEQUALITY DEFINING THE DEFICIT IS THE SOURCE IDEA'S OWN BOOKKEEPING AND
    IS NOT INDEPENDENTLY ESTABLISHED. TASK-20260904-5423ad derived
    D(m, beta) = (m-1)/2 + 2 - 2 m beta and the values above ARITHMETICALLY FROM
    THAT INEQUALITY AS STATED, and did not verify the inequality itself. Its
    symbolic re-derivation from the character expansion is the first gate of
    EXP-PFDR-1c5939, and if the bookkeeping is wrong every number in S1 and S2
    changes.
  - >-
    The degree constant in the Weil-Deligne bound grows with the degree of the
    summation polynomial, which doubles with m. It is tracked symbolically and not
    treated as a constant in m; treating it as constant understates the deficit.
  proof_search_map:
    bottleneck: >-
      The size of the nontrivial character sums over the summation hypersurface.
      Everything else in the closure - the main term, the subgroup index, the
      membership test - is elementary once that size is fixed.
    baseline_embedding:
      parameter_slice: >-
        d = 1, so H is the whole multiplicative group, beta = 1 and there is no
        nontrivial character tuple. The deficit must vanish identically and the
        expansion must reduce to the unrestricted count.
      reproduction_check: >-
        Symbolic - the expansion at d = 1 must reduce term by term to the
        unrestricted decomposition count, and the deficit expression must evaluate
        to a value with no nontrivial-character contribution. A frozen fixture
        stores the reduction.
    observation_collision:
      observable: >-
        The deficit D(m, beta), a single real number per cell.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, AND IT IS THE RECORD'S PRINCIPAL LIMIT. D depends
        on the hypersurface only through its degree and dimension, so every
        absolutely irreducible hypersurface of the same degree and dimension has
        the same D. The observable therefore cannot separate an elliptic-curve
        statement from a general exponential-sum statement, which is exactly why
        the curve-free arm is required and why S3 states the consequence in
        advance.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: >-
        The required external bound, stated as an explicit exponent target
        |S| at most C times p^{(m-1)/2 - gamma} with gamma computed rather than
        left implicit.
      predicted_gain: >-
        NO GAIN. The transform converts an open-ended closure into a named
        external requirement, and the requirement turns out to be total
        cancellation at the operating point, which strengthens the closure rather
        than reopening it.
    quantifier_order: >-
      CLAIMED - FOR ALL m at least 2 and FOR ALL beta in the declared sweep, the
      deficit is the stated linear function of beta, and at beta = 1/m the
      required saving equals the entire square-root exponent. THE STRONGER READING
      EXPLICITLY NOT CLAIMED - that no bound of any kind can certify the subgroup
      base. What is claimed is that no bound with a saving strictly less than the
      whole exponent can, under the stated bookkeeping.
    method_ceiling:
      strongest_certifiable_claim: >-
        A closed-form required-saving function gamma(m, beta), its value at the
        operating point, its sign change, and a recorded literature scan naming
        which bound families were checked against it. It can NEVER certify that no
        such bound exists, cannot produce an attack, and cannot certify anything
        about elliptic curves specifically if the curve-free arm reproduces it.
      nearby_object_control: >-
        A CURVE-FREE ABSOLUTELY IRREDUCIBLE HYPERSURFACE of the same degree and
        dimension, with no elliptic curve anywhere in its construction. The
        deficit is predicted IDENTICAL there. If it is, the hoped-for reading -
        that this is a fact about elliptic curves - FAILS, and the record must say
        so.
    proof_obligations:
    - claim: The character expansion of the windowed count is as stated.
      responsibility: correctness
    - claim: 'The deficit equals (m-1)/2 + 2 - 2 m beta.'
      responsibility: correctness
    - claim: 'gamma at the operating point equals the whole square-root exponent (m-1)/2.'
      responsibility: strictness
    - claim: The degree constant is tracked in m and not held constant.
      responsibility: size
    - claim: The d = 1 slice reduces to the unrestricted count.
      responsibility: baseline
    - claim: The deficit carries no elliptic-curve content if the curve-free arm reproduces it.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL. No algorithm is proposed and no complexity is improved. If an external
    bound with the required saving existed, the subgroup base would enter a
    relation-collection cost model at an exponent determined by the polylog
    membership test - that is the conditional prize and it is stated as
    conditional in interpretation_limits, never as a claim.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR the tested (m, d) cells, the d^m - 1 nontrivial character sums over the
      summation hypersurface do not conspire - their total is bounded by d^m times
      the maximum single sum and is not systematically smaller by cancellation
      among tuples, in the sense that the ratio of the true total error to
      d^m times the maximum single sum is bounded below by 0.1.
    random_model_justification: >-
      The rigorous half is that each individual sum is bounded by Weil-Deligne
      square-root cancellation. The heuristic half is independence of the sums
      across distinct nontrivial character tuples, which is the standard modelling
      assumption in subgroup-sum estimates and which the union bound implicitly
      assumes is not badly lossy.
    supporting_results: []
    supporting_results_note: >-
      EMPTY AND HONESTLY SO. The source idea names Weil, Deligne, Katz and
      Burgess-type subgroup bounds explicitly as recalled from memory and unread by
      this program. A recalled citation may not discharge this field under
      AGENTS.md rule 9. The assumption is measured directly instead, at small d and
      m where the full expansion is computable exactly.
    validation_experiment_ids:
    - EXP-PFDR-1c5939
    falsification_condition: >-
      The measured ratio of true total error to the union bound is below 0.1 at two
      or more cells with a consistent trend in d - the deficit is overstated,
      gamma is smaller than derived, and the closure softens by the measured
      amount. This is a genuine and reportable softening, not a failure.
  structural_ingredients:
  - description: >-
      Weil-Deligne square-root cancellation for character sums over an absolutely
      irreducible variety, with a degree-dependent constant.
    citation: >-
      Weil; Deligne. NAMED FROM MEMORY BY THE SOURCE IDEA AND NOT OPENED BY THIS
      PROGRAM.
    provenance: recalled
    verified_by: null
    role: >-
      supplies the error exponent (m-1)/2 that the required saving is quoted
      against; a pointer for the reviewer, not support
  - description: >-
      Burgess-type improvements for subgroup character sums in some ranges, named
      as the only plausible candidate family for meeting the required saving.
    citation: 'Burgess-type subgroup bounds. RECALLED, NOT READ.'
    provenance: recalled
    verified_by: null
    role: >-
      the family the literature scan must check first; confirming or refuting its
      sufficiency is a declared deliverable
  - description: >-
      The standing closure that the Weil bound cannot close the arithmetic
      factor-base yield gap, whose obstruction is that the discrete logarithm is
      not an algebraic function of the point.
    citation: KN-FIND-c93d45
    provenance: internal
    verified_by: >-
      TASK-20260904-5423ad read knowledge/findings/KN-FIND-c93d45.md in full. It
      states the DL-circularity obstruction, records confidence proved and
      evidence_level argument, and states NO required saving anywhere. This
      hypothesis supplies that number and does not contradict the record.
    role: the closure this record quantifies rather than reopens
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      gamma(m, beta) at the operating point beta = 1/m, an exponent of p,
      dimensionless
    direction: higher
    minimum_effect: >-
      EXACTLY (m-1)/2 - that is 0.5, 1.0, 1.5 and 2.5 at m = 2, 3, 4 and 6 - and
      therefore equal to the whole square-root exponent, so that no partial
      improvement over Weil-Deligne suffices at the operating point.
  - metric: >-
      the zero crossing beta* of gamma, dimensionless
    direction: different
    minimum_effect: >-
      EXACTLY (m+3)/(4m), that is 0.625, 0.500, 0.4375 and 0.3750 at
      m = 2, 3, 4 and 6. A cell with beta above beta* has gamma at most 0 and is
      CERTIFIED BY EXISTING BOUNDS and must be tested computationally at once.
  - metric: >-
      ratio of the exactly computed total character-sum error to d^m times the
      maximum single sum, dimensionless, per (m, d) cell
    direction: different
    minimum_effect: >-
      Reported per cell without a directional prediction. A ratio consistently
      below 0.1 with a trend in d softens the closure by a measured amount; a
      ratio near 1 confirms the bookkeeping is tight.
  - metric: >-
      curve-free deficit minus elliptic deficit at matched degree and dimension,
      dimensionless
    direction: different
    minimum_effect: >-
      PREDICTED EXACTLY ZERO. If it is zero, the deficit carries no elliptic-curve
      content and no statement about elliptic curves or the ECDLP may be quoted
      from it.
  - metric: >-
      decomposition coverage of the subgroup base against a matched random base of
      equal size, as a fraction of targets with at least one decomposition
    direction: lower
    minimum_effect: >-
      A drop of at least 0.05 in coverage would mean the subgroup base is
      additively degenerate and is closed for a second, independent reason. The
      MEAN decomposition count must match the random base exactly; anything else
      is a bug.
  test_boundary:
    instances:
    - >-
      Toy prime fields with a curve of prime-order subgroup, at 16 to 24 bits,
      with d chosen in {2, 3, 5} for the large-B regime and d large for the
      small-B regime, at least 20 primes per cell.
    - >-
      A curve-free absolutely irreducible hypersurface of the same degree and
      dimension over the same fields, containing no elliptic curve.
    - >-
      A coset of H rather than H itself, preserving multiplicative structure so
      that any difference isolates the subgroup's additive behaviour.
    parameters:
      arities: '2, 3, 4, 6 for the symbolic arm; 3 for the measured arm'
      beta_sweep: 'beta from 0.20 to 0.80 in steps of 0.05'
      exact_expansion_cells: 'd in {2, 3, 4, 5} and m in {2, 3}, where the full expansion is computable'
    implementation: >-
      Symbolic derivation in two independent computer-algebra engines for the
      deficit, and exact finite-field enumeration for the character-sum and
      coverage arms. No sampling in the symbolic arm.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 2
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
  - >-
    The symbolic re-derivation of the deficit from the character expansion does
    not reproduce (m-1)/2 + 2 - 2 m beta - the source idea's bookkeeping is wrong,
    every number in S1 and S2 changes, and the corrected form is the deliverable.
  - >-
    gamma at most 0 at some cell with beta at or below the operating point - that
    cell is certified by existing bounds and must be tested computationally at
    once, which would be a positive result.
  - >-
    A known bound family with a saving at least gamma is identified in the
    literature scan - the closure's scope must be narrowed and the
    multiplicative-subgroup base reopened.
  - >-
    The curve-free hypersurface reproduces the deficit exactly - the deficit is a
    fact about exponential-sum bookkeeping and NOT about elliptic curves, and
    nothing from this record may be quoted as a statement about elliptic curves or
    the ECDLP.
  - >-
    Measured coverage of the subgroup base falls materially below the random base
    - the base is additively degenerate and is closed for a second, independent
    reason.
  interpretation_limits:
  - >-
    DERIVING gamma PRODUCES NO ATTACK AND DOES NOT WEAKEN KN-FIND-c93d45. It makes
    the closure conditional on a stated external ingredient, which is the honest
    form for a closure whose obstruction is that no known bound is strong enough.
  - >-
    THE CONDITIONAL PRIZE, STATED AS CONDITIONAL. If an external bound with saving
    gamma existed, the subgroup base would enter a relation-collection cost model
    at an exponent set by its polylog membership test. That is the size of the
    prize. It is stated conditionally and is asserted nowhere.
  - >-
    Every number in S1 and S2 is arithmetic performed on the source idea's stated
    inequality by TASK-20260904-5423ad, which did NOT verify that inequality. The
    symbolic re-derivation is the experiment's first gate.
  - >-
    For small d, B is comparable to p and the regime is not the operating point;
    results there do not speak to beta = 1/m and are reported separately.
  - >-
    The x-coordinates of the points of the curve form a specific subset of the
    field of about half its size, so intersecting with H introduces a second bias
    that is measured separately and is not folded into the deficit.
  - >-
    UNTESTABLE AT REACHABLE SCALE. Whether the true character sums at
    CRYPTOGRAPHIC p and at the operating point behave as the union bound suggests
    cannot be measured - the exact expansion is computable only at small d and
    small m, and the number of nontrivial tuples is d^m, which is astronomically
    large at any deployed parameter. The measured ratio therefore bounds the
    bookkeeping only in the tested cells, and the extrapolation to the operating
    point is an assumption stated as one.
