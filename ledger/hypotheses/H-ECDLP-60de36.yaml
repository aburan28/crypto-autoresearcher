# H-ECDLP-60de36 -- Does the Petit-Kosters-Messeng 2-isogeny-chain factor base
# (proposed by the user, 2026-10-15, for P-256, where 2^96 | p+1) make Semaev
# m-decomposition cheaper to solve than the same set encoded densely, a random
# set of the same size, or enumeration?  Toy-scale, prime-field, falsifiable.
hypothesis:
  id: H-ECDLP-60de36
  question_id: RQ-ECDLP-001
  experiment_id: EXP-ECDLP-f49f75
  goal_id: GOAL-ECDLP-001
  specified_at: '2026-10-15'
  proposed_by: coordinator
  source: >-
    User proposal in session 2026-10-15: factor base B = {(u,v) in E(F_p) :
    Phi_x(u) = x(Phi(R))} with Phi a chain of 44 Velu 2-isogenies from
    E0: y^2 = x^3 + x (p = 3 mod 4, #E0 = p+1), |B| ~ N^(1/6), decomposition
    T = P1 + ... + P6 via Semaev summation polynomials. The user stated that the
    fast solver is missing; this hypothesis tests whether the chain encoding
    supplies any solver advantage at toy scale.
  title: >-
    Chain-encoded isogeny factor base versus dense encoding of the same set,
    a random set of equal size, and meet-in-the-middle enumeration, for
    Semaev m = 2 and m = 3 decomposition under one Groebner instrument
  statement: >-
    For prime p = 3 mod 4 with 2^L | p+1 and target curve y^2 = x^3 - 3x + b,
    encoding the factor-base x-set V = x(R + <K>) by L chained quadratic Velu
    equations per point (arm A) yields Groebner (std/slimgb + fglm) solving
    times for the Semaev m-decomposition system that are LOWER, and grow more
    slowly in |V| = 2^L, than (B) the same V encoded by its degree-2^L minimal
    polynomial, (C) a random set of size 2^L, and (E) meet-in-the-middle
    enumeration over the factor base.
  mechanism: >-
    PKM (PKC 2016) heuristic: a factor base with a low-degree, many-variable
    description (like a vector subspace in binary-field Weil descent) yields
    systems with small degree of regularity, so total Groebner cost could be
    polynomial in log p per decomposition instead of exponential in |V|.
  structural_ingredients:
    - description: Auxiliary-isogeny / rational-map factor bases for prime-field ECDLP
      citation: C. Petit, M. Kosters, A. Messeng, "Algebraic approaches for the elliptic curve discrete logarithm problem over prime fields", PKC 2016
      provenance: recalled
      role: source construction; recalled pointer, not support
    - description: Summation polynomials S_3 and S_{m+1} = Res_X(S_k, S_{m-k+3})
      citation: I. Semaev, "Summation polynomials and the discrete logarithm problem on elliptic curves", IACR ePrint 2004/031
      provenance: recalled
      role: decomposition system
    - description: Velu 2-isogeny x-map X = x + t/(x - x0), t = 3 x0^2 + A
      citation: J. Velu, "Isogenies entre courbes elliptiques", C. R. Acad. Sci. Paris 273 (1971)
      provenance: recalled
      verified_by: launcher asserts curve equations of every image point and chain(V) = c for all of V
      role: chain equations
  proof_search_map:
    not_applicable_reason: purely empirical solver-cost comparison at toy scale
  asymptotic_claim: null
  predictions:
    - metric: median Groebner total time (std_ms + fglm_ms), arm A vs arm B, per (m, L) cell where both complete
      direction: lower
      minimum_effect: arm A median below arm B median in at least 80% of jointly completed cells
    - metric: largest L completed within 600 s, arm A vs arms B and C, at m = 3
      direction: higher
      minimum_effect: arm A completes at least one larger L than B and C
  test_boundary:
    instances: ["toy primes, p bits ~ m*L, m in {2,3}, L in 3..12 (m=2), 3..6 (m=3)"]
    parameters: {timeout_s: 600, planted_per_cell: 4, random_per_cell: 2, solvers: [std, slimgb]}
    implementation: experiments/EXP-ECDLP-f49f75/pkm_isogeny_fb.py (Singular 4.3.2)
  falsification_conditions:
    - arm A median total time is at or above arm B median in at least 80% of jointly completed cells (under both solvers)
    - arm A is retired (all instances time out) at an L no larger than where arms B and C are retired, at m = 3
  interpretation_limits:
    - Toy scale and one Groebner implementation family (Singular std/slimgb); msolve/Magma F4 were not available. A negative result says this encoding does not help under this instrument at this scale; it does not prove no solver can exploit the chain.
    - m <= 3 only. P-256 would need m = 6 (S_7), which no arm here reaches.
    - No result here bears on P-256 security beyond showing the absence of a toy-scale signal.
  status: proposed
