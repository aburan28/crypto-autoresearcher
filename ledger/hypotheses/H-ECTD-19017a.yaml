hypothesis:
  id: H-ECTD-19017a
  question_id: RQ-ECTD-001
  source_proposal: IDEA-20260731-017
  linked_control_proposal: null
  goal_id: GOAL-ECTD-001
  statement: >-
    Let E_floor and E_crater be ordinary F_p-isogenous curves whose
    endomorphism rings differ by an index containing a prime conductor step
    q >= 17 (a vertical edge of an ordinary isogeny volcano). At toy sizes (N
    in [40,60] bits), across >=8 independent vertical conductor steps, the
    frozen Semaev/FB/Macaulay meter vector used by H-ECTD-001/EXP-ECTD-001
    either (a) stays within a factor 10 of its horizontal-neighbor baseline on
    every primary meter at every edge (continuity, a scoped Semaev-channel
    barrier against vertical Teske analogues), or (b) jumps by a factor >=100
    on at least one primary meter (or d_reg moves by >=2) on at least one
    edge, permutation-stable and surviving the outside-class and
    degree-profile nulls (discontinuity, nominating the crater or floor as a
    candidate private endpoint for a later, separate path-hiding experiment).
    The measurement is two-sided and preregistered before any run; a KS test
    between the vertical and horizontal ratio-sample distributions is the
    primary decision statistic. Neither branch establishes Galbraith
    path-finding hardness, isogeny-evaluation hardness, or a trapdoor;
    continuity closes only the equation-dependent Semaev channel across the
    tested conductor steps at toy N, and discontinuity only nominates a
    candidate for later work.
  mechanism: >-
    Galbraith (KN-LIT-7630) identifies the large-prime conductor gap as the
    case where ECDLP-equivalence via isogenies is least complete: computing
    the connecting isogeny across a vertical step may itself be hard, unlike
    the horizontal (same-level, ell-neighbor) case H-ECTD-001/H-ISO-001
    already measure. A Teske-style trapdoor that places a secret endpoint E_s
    at a different volcano level than the public E_pub needs an endpoint
    weakness that is level-specific (End-ring-dependent), not merely a secret
    GLV endomorphism (constant-factor only, already dominated). This
    hypothesis asks whether the SAME algebraic meters H-ECTD-001 measures
    horizontally show any discontinuity when the measurement crosses a
    conductor step vertically, sharing instrumentation with EXP-ECTD-001
    wherever the object (a single curve's Semaev/Macaulay meter vector) is
    identical. Distinct from H-ECTD-001 (horizontal, within one isogeny
    class, just weakened at 40-bit N per DEC-20260806-4a9604) and from
    IDEA-20260731-018 (trapdoor-DDH, a different predicate entirely).
  assumptions:
    - >-
      Conductor and endomorphism-ring index are computed correctly from each
      curve's own (a, b, p) via Kohel-style volcano identification (trace t,
      discriminant D_pi = t^2 - 4p, its square-free/conductor factorization).
    - Vertical isogenies of prime degree q are constructed via Vélu's formulas
      and independently verified to preserve the group order N.
    - deg(isogeny) coprime to N on every measured vertical edge, so ECDLP
      transports across the edge without changing the DL instance's hardness
      by a group-order artifact.
    - Timeouts/crashes are infrastructure, not mathematical negatives
      (AGENTS.md rule 5).
    - Class-invariant weak curves (anomalous/MOV/smooth-order/supersingular)
      appear only in negative-control arms, never as nominated secret
      endpoints (same discipline as H-ECTD-001).
  rerandomization: null
  asymptotic_claim:
    problem: ordinary F_p ECDLP trapdoor endpoint existence, vertical/conductor case (measurement only)
    prior_best: >-
      Pollard rho at exponent 1/2; H-ECTD-001 horizontal homogeneity
      (weakened, scoped to 40-bit N); H-ISO-001 short-neighbor homogeneity
      (scoped, rejected_scoped)
    time_exponent: >-
      No asymptotic claim. H-ECTD-19017a itself is measurement-only at
      claim_tier toy; a later EXP would be needed to convert a confirmed
      discontinuity into any empirical exponent statement, and even then only
      after path-hiding is separately shown at least matched-rho hard.
    memory_exponent: GB-scale Macaulay matrices at toy N, same order as EXP-ECTD-001
    hidden_cofactor: >-
      End-ring/conductor computation and volcano-vertical isogeny
      construction, both new relative to EXP-ECTD-001's driver (which only
      implements horizontal ell-neighbor walking)
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-ECTD-VERT-1
      formal_statement: >-
        Conditional on N and the imaginary quadratic field, Semaev meter laws
        at adjacent conductors differ only through End-module structure;
        absent a named End-specific solver, ratios concentrate near 1 (i.e.
        vertical meter ratios are drawn from a distribution indistinguishable,
        under the frozen KS test, from the horizontal ell-neighbor ratio
        distribution already characterized by H-ECTD-001/H-ISO-001).
      random_model_justification: >-
        No theorem. Motivated by the failure of class-invariant weaknesses to
        vary across a class, and by H-ISO-001's horizontal homogeneity result.
        JMV expander mixing (KN-LIT-237/KN-LIT-7631) applies within one
        volcano level and does NOT by itself justify cross-level
        exchangeability -- this is a materially different (untested) claim,
        which is exactly why this hypothesis measures it rather than assuming
        it. Treat as a test hypothesis only; validate via the two-sample KS
        test against the horizontal-ratio sample, never via JMV citation
        alone.
      supporting_results:
        - KN-LIT-7630 (Galbraith conductor-gap boundary) -- motivates the object, not the exchangeability claim
        - H-ISO-001 (horizontal short-neighbor homogeneity, rejected_scoped) -- motivates the null, not a proof
        - No theorem forces vertical Semaev meter constancy across a conductor step
      validation_experiment_ids:
        - H-ECTD-19017a's own eventual EXP (not yet frozen at hypothesis-write time)
      falsification_condition: >-
        Across >=8 independent prime conductor steps, all primary meter
        ratios lie in [0.1, 10] AND the two-sample KS test does not reject
        exchangeability against the matched horizontal-ratio sample at the
        pre-registered alpha -- continuity_scoped, a scoped Semaev-channel
        barrier only, never Galbraith path-finding hardness or Teske
        impossibility.
  structural_ingredients:
    - description: Large-prime conductor gap as the least-complete case of isogeny-based ECDLP equivalence
      citation: KN-LIT-7630
      role: shape of the vertical (conductor-changing) boundary this hypothesis measures
    - description: Teske elliptic-curve trapdoor via secret isogeny to weak endpoint
      citation: KN-LIT-7261
      role: designer-question shape shared with H-ECTD-001, here specialized to vertical (End-ring-changing) endpoints
    - description: Semaev summation polynomials and Gröbner/Macaulay meters
      citation: KN-LIT-001 / KN-TECH-002 (as used by H-ECTD-001/EXP-ECTD-001)
      role: primary algebraic meters, reused unchanged from EXP-ECTD-001 wherever the object is a single curve's own meter vector
  reduction_chain:
    core_problem: presence/absence of a vertical (conductor-step) Semaev/Macaulay meter discontinuity at toy N
    corollaries: []
  status: specified
  claim_tier: toy
  created_at: '2026-08-06'
  updated_at: '2026-08-12'
