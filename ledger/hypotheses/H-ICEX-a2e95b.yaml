hypothesis:
  id: H-ICEX-a2e95b
  question_id: RQ-ICEX-001

  statement: >-
    SCOPE: the CHARGING CONVENTION for right-censored attempts frozen in
    coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
    ic_exponent_protocol.yaml, evaluated on the MATCHED POLLARD-RHO AND BSGS
    BASELINE ARMS at that protocol's own ladder n = log2(ell) in
    {8, 10, 12, 16}, with caps applied POST HOC to fully recorded uncensored
    runs. CLAIM TIER toy. NO INDEX-CALCULUS ARM IS RUN, NO SDEG/MONO/RELN FEED
    IS CONSUMED, NO C_IC IS ASSEMBLED, NO ATTACK IS PROPOSED, NO EXPONENT IS
    MOVED.
    THE CLAIM. The protocol charges every attempt "including failed and censored
    attempts" and maps a wall cap to TIMEOUT_CENSORED, and contains -- across
    all 905 lines, grepped this session -- NO censoring-fraction metric, NO
    survival estimator, NO restart convention, and NO pin on attempts per
    replica. The word "censored" occurs exactly twice, at lines 402 and 736, and
    no correction accompanies either. Consequently the reported exponent is a
    function of an infrastructure parameter, and the function is exact.
    (C1) ONE-SIDED BIAS, BY THEOREM. For any cost X and cap M,
    E[min(X,M)] = int_0^M S(t) dt <= E[X] = int_0^inf S(t) dt, with deficit
    int_M^inf S(t) dt. The charged aggregate is a lower bound on the cost of the
    work attempted, never unbiased, for EVERY distribution.
    (C2) TWO ADMISSIBLE AGGREGATES, OPPOSITE DIRECTIONS. The frozen text does
    not say whether the reported quantity is the charged aggregate or the
    charged cost per certified success under restart. For matched rho, with
    S(t) = exp(-t^2/(2 ell)) and c := M/sqrt(ell), both have closed forms:
      (a) E[min(X,M)]/E[X] = erf(c/sqrt 2) = 2*Phi(c) - 1;
      (b) (E[min(X,M)]/P(X<=M))/E[X] = erf(c/sqrt 2)/(1 - exp(-c^2/2)).
    SESSION-COMPUTED at c = 0.25/0.5/1/2/4:
      (a) 0.197413 / 0.382925 / 0.682689 / 0.954500 / 0.999937  (increasing)
      (b) 6.416425 / 3.258850 / 1.735051 / 1.103896 / 1.000272  (decreasing)
    The induced shifts in the frozen alpha at n = 12 are -0.19506 to -0.00001
    for (a) and +0.22348 to +0.00003 for (b). Every entry at c <= 1 exceeds the
    entire quantity the goal is trying to resolve.
    (C3) A FIXED CAP CONTAMINATES THE SLOPE, NOT MERELY THE LEVEL. With M held
    constant across cells -- which is what budgets.per_attempt_defaults
    (wall_clock_seconds: 300) does, there being no per-cell override anywhere in
    the artifact -- c = M/sqrt(ell) falls like ell^{-1/2}. For c << 1,
    E[min(X,M)] -> M, a CONSTANT, so the fitted exponent -> 0; while
    E[min]/P(X<=M) -> M/(M^2/(2 ell)) = 2 ell/M, so the fitted exponent -> 1.
    THE TRUE EXPONENT IS EXACTLY 1/2. An unstated accounting convention selects
    between a measured 0 and a measured 1 on the goal's own control arm.
    (C4) THE BUDGET BLOCK FORCES CENSORING BY ARITHMETIC.
    maximum_attempts 128 x per_attempt wall 300 s = 38,400 s against a
    per_campaign wall of 7,200 s: a ratio of EXACTLY 5.3333, and
    floor(7200/300) = 24 full-length attempts per campaign. A sealed
    128-attempt schedule is feasible only if the mean attempt costs at most
    56.25 s, or the attempt SEQUENCE is itself truncated -- a second censoring
    mechanism with its own bias, also unmentioned.
    (C5) THE REPAIR IS FREE AND IS DERIVED, NOT STIPULATED. Because both bias
    ratios depend on M and ell only through c, setting M = c0 sqrt(ell) makes
    the bias a CONSTANT across the ladder, hence absorbed entirely into the
    intercept of a slope fit and invisible in the exponent. Reporting the
    censoring fraction q costs nothing (the terminal codes are already
    recorded), declaring which aggregate is meant costs nothing, and treating a
    cell with q above a declared threshold as alpha-UNDEFINED reuses machinery
    the protocol already has for R_gain = 0 (OBL-ZERO-RANK-COST).
    IF NO PART SURVIVES, THE DELIVERABLE IS STILL NAMED: a committed statement
    that the charging convention is unbiased at the tested ladder, plus the
    measured censoring fractions, which the goal needs either way.

  mechanism: >-
    DERIVED IN-REPO THIS SESSION. Every numeric value is SESSION-COMPUTED from
    the stated closed forms and is re-derived by hand as stage 1 of
    EXP-ICEX-01a79b. The one recalled item (the birthday survival function) is
    re-derived here and its empirical validation is a declared stage; Kaplan-
    Meier is named but NOT READ, NOT CITED, and not used unless the closed form
    fails validation.

    PART 1 -- THE ONE-SIDED INEQUALITY, WHICH NEEDS NO MODEL.
    For a nonnegative cost X with survival S(t) = P(X > t) and a cap M,
      E[min(X,M)] = int_0^M S(t) dt,   E[X] = int_0^inf S(t) dt,
    so the charged aggregate under-states the true cost by exactly
    int_M^inf S(t) dt >= 0. THIS HOLDS FOR EVERY DISTRIBUTION, so the SIGN of
    the bias and the existence of the deficit are theorems, not modelling
    choices. Everything distributional below affects only the SIZE.

    PART 2 -- THE CONTROL WHERE THE SIZE IS ALSO EXACT.
    Matched Pollard rho under the birthday model (HEUR-CEN-1): S(t) =
    exp(-t^2/(2 ell)) in step units. Then
      E[X]        = int_0^inf exp(-t^2/(2 ell)) dt = sqrt(pi ell/2),
      E[min(X,M)] = int_0^M   exp(-t^2/(2 ell)) dt
                  = sqrt(pi ell/2) * erf(M / sqrt(2 ell)),
      P(X <= M)   = 1 - exp(-M^2/(2 ell)).
    Writing c = M/sqrt(ell), all three depend on (M, ell) ONLY THROUGH c. That
    scale-freeness is the structural fact from which both the defect and its
    repair follow: bias is controllable by scaling M with sqrt(ell) and
    uncontrollable by fixing M.
      (a) ratio_aggregate(c)   = erf(c/sqrt 2) = 2 Phi(c) - 1,
      (b) ratio_per_success(c) = erf(c/sqrt 2) / (1 - exp(-c^2/2)).
    SESSION-COMPUTED, and note the two families approach 1 from OPPOSITE SIDES
    and never cross:
      c      = 0.25       0.50       1.00       2.00       4.00
      (a)    = 0.197413   0.382925   0.682689   0.954500   0.999937
      (b)    = 6.416425   3.258850   1.735051   1.103896   1.000272
      dalpha(a) at n=12 = -0.19506  -0.11541  -0.04589  -0.00560  -0.00001
      dalpha(b) at n=12 = +0.22348  +0.14203  +0.06625  +0.01188  +0.00003
    The opposition is the discriminating content: an account in which both move
    the same way is wrong, and the experiment is built to detect that.

    PART 3 -- WHY A FIXED CAP MOVES THE SLOPE.
    Hold M constant across the ladder. Then c = M/sqrt(ell) -> 0 as ell grows.
    Small-c expansions, both elementary:
      erf(x) = 2x/sqrt(pi) + O(x^3)  =>  E[min(X,M)] -> M.
        The charged aggregate SATURATES AT THE CAP: its log is log M, constant
        in ell, so the fitted slope tends to 0.
      1 - exp(-c^2/2) = c^2/2 + O(c^4)  =>  P(X<=M) -> M^2/(2 ell), so
        E[min]/P -> M/(M^2/(2 ell)) = 2 ell/M, whose fitted slope tends to 1.
    TRUE SLOPE: EXACTLY 1/2. So the same recorded runs, differing only in an
    unstated accounting convention and in whether the cap scales, straddle the
    truth from both ends. This is the inventor-protocol section 3 structural
    tell arriving by an unexamined route: the quantity that SHOULD keep growing
    with ell stops growing, and the parameter meant to reveal structure instead
    reveals the cap.

    PART 4 -- ASYMMETRY BETWEEN ARMS, STATED AS MOTIVATION AND NOT AS A FINDING.
    A concentrated cost distribution loses little mass beyond a cap set above
    its mean; a heavy-tailed one loses a lot. Rho and BSGS are concentrated
    (Rayleigh, sd of log2 X = 0.925164 bits, derived in H-ICEX-4ccbaa; BSGS
    nearly deterministic). An algebraic relation search is widely believed to be
    heavy-tailed. IF SO, at a common cap the index-calculus arm is censored more
    and receives more of the discount, and an accounting rule that discounts the
    arm it censors most is not neutral. THAT BELIEF IS RELAYED-UNVERIFIED, IS
    NOT MEASURED BY THIS PACKAGE, AND ENTERS NO FORCED VALUE. It is recorded as
    motivation and must never be cited as a result of this hypothesis.

    PART 5 -- THE INVERSION OF RULE 5, STATED CAREFULLY.
    AGENTS.md rule 5 and the protocol's OBL-TERMINAL-VOCABULARY prevent a
    timeout being read as NEGATIVE mathematical evidence. That protection is
    correct and this hypothesis does not touch it. What the charging rule does
    is the mirror image: it converts a timeout into a CHEAP ATTEMPT, i.e. into
    evidence FOR the arm that timed out. Both readings are errors; only one is
    guarded. NOTHING HERE ARGUES FOR CHARGING TIMEOUTS AS INFINITE OR FOR
    TREATING THEM AS NEGATIVE EVIDENCE -- that would be the forbidden reading in
    the other direction. The guard proposed is a reported fraction, a declared
    aggregate, and a scaled cap.

    PART 6 -- THE BUDGET ARITHMETIC, ZERO COMPUTE, FROM COMMITTED TEXT.
      per_attempt_defaults.wall_clock_seconds  = 300
      per_campaign_defaults.maximum_attempts   = 128
      per_campaign_defaults.wall_clock_seconds = 7200
      128 * 300 = 38,400 vs 7,200  =>  ratio EXACTLY 5.33333...,
      floor(7200/300) = 24 full-length attempts.
    One division on committed text, and it decides whether any sealed schedule
    of the declared size can run without truncation.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. Whether the per-attempt cap is
    intended fixed across cells or re-declared per cell at seal time. The
    artifact has one budgets block with no per-cell override and
    schedule_obligations does not list a per-cell cap among the fields to be
    sealed, but the artifact's author is not available to confirm it. That
    reading is isolated as HEUR-CEN-2 so that its failure voids the slope
    result (Part 3) and NOTHING ELSE: the one-sided inequality, the two-aggregate
    ambiguity, the absent censoring-fraction metric and the budget arithmetic
    all stand under every reading.

  assumptions:
  - >-
    ALL SESSION-COMPUTED VALUES ARE RE-DERIVED IN STAGE 1 BEFORE USE. They are
    stated so a reviewer can attack them, not so they can be cited.
  - >-
    POST-HOC CAPPING IS THE MEASUREMENT DESIGN, DELIBERATELY. Caps are applied
    to fully recorded uncensored runs rather than enforced live, so the censored
    and uncensored arms are the IDENTICAL runs and there is no between-arm
    confound at all. This isolates the ACCOUNTING effect, which is what is under
    audit, and it explicitly does NOT measure the operational cost of a real
    timeout (partial-state loss, restart overhead, cache effects). That
    limitation is declared, not discovered.
  - >-
    NO STATUS CHANGE, AMENDMENT, OR SUPERSESSION of the frozen ICEX protocol,
    GOAL-ICEX-001, RQ-ICEX-001, EV-ICEX-001, or DEC-20260731-015 is proposed or
    implied. Those are Coordinator decisions (AGENTS.md rule 1); a correction,
    if warranted, is a new record under a new id (rule 4).
  - >-
    THE ICEX MEASUREMENT BAN IS RESPECTED BY CONSTRUCTION. Nothing here consumes
    an SDEG, MONO, or RELN feed, assembles C_IC, invokes a summation polynomial,
    runs a relation search, or produces an index-calculus number. The measured
    arms are the generic baselines the protocol itself mandates as controls.

  proof_search_map:
    bottleneck: >-
      The step at which a censored attempt's cost enters the aggregate. If the
      censoring indicator is dropped at aggregation -- which it is, because
      min(X, M) is a perfectly well-behaved additive coordinate -- then no
      downstream improvement to the estimator, the threshold, or the certificate
      machinery can recover the lost information, because the aggregate no
      longer determines the cost. This step is upstream of every exponent the
      goal can report and it consumes none of the SDEG/MONO/RELN budgets.
    baseline_embedding:
      parameter_slice: >-
        c = infinity, i.e. no cap, on the matched Pollard-rho arm at each ladder
        cell. This is the exact slice on which the charging convention is
        trivially correct: with no censoring, charged cost IS cost, and the
        fitted slope must be 1/2.
      reproduction_check: >-
        SYMBOLIC THEN MEASURED. Symbolically, ratio_aggregate(infinity) = 1 and
        ratio_per_success(infinity) = 1 by inspection of the closed forms.
        Measured, the uncensored arm's fitted ladder slope must have a CI
        containing 0.500 and its mean step count must match 1.253314 sqrt(ell)
        within 10 per cent. A slope that merely looks near 1/2 is not a
        reproduction; the CI containment is the test, and failing it halts every
        downstream claim.
    observation_collision:
      observable: >-
        The charged aggregate C[c] for a cell, and the alpha derived from it.
      distinct_preimage_search: >-
        THE COLLISION SEARCH SUCCEEDS AND IS DECISIVE. Two cohorts with
        radically different true costs map to the SAME charged aggregate: a
        cohort in which every attempt finished just under M, and a cohort in
        which every attempt was stopped at M and would have run arbitrarily
        long. Both charge exactly n_attempts * M. The observable therefore does
        not determine the cost, and no additional condition in the frozen
        protocol separates them, because the separating information -- the
        censoring indicator -- is recorded in the receipts and never enters the
        aggregate. A SECOND, SHARPER COLLISION on the goal's own control arm:
        under a fixed cap, the SAME recorded rho runs yield a fitted exponent
        tending to 0 under aggregate (a) and to 1 under aggregate (b), so one
        ground-truth object with exponent exactly 1/2 has two admissible
        observables at opposite ends of the range. That is a direct falsifier of
        identifiability and it is measurable in minutes.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        Build a problem-specific resource measure that carries the censoring
        pattern: report (charged aggregate, censoring fraction q, cap multiple
        c) as an inseparable triple rather than the aggregate alone, and charge
        only over blocks whose censoring fraction is below a declared threshold,
        marking the rest alpha-UNDEFINED by reusing OBL-ZERO-RANK-COST's
        existing machinery.
      predicted_gain: >-
        Makes the collision above impossible to hide: two cohorts with the same
        aggregate but different q are no longer equal as measurements. Costs
        nothing, since the terminal codes are already recorded.
    - transform: telescoping_potential
      proposed_object: >-
        Randomize the location of the cap rather than fixing it -- set
        M = c0 sqrt(ell) so the truncation point tracks the cell -- and charge
        the resulting constant bias to the intercept of the ladder fit, where it
        is a global nuisance parameter rather than a per-cell distortion.
      predicted_gain: >-
        Because both bias ratios depend only on c, a fixed c0 makes the bias
        EXACTLY CONSTANT across cells, hence exactly absorbed by the intercept
        and exactly absent from the slope. This is a derived repair with a
        proof, not a heuristic mitigation, and it is the single
        highest-value-per-cost change available to the goal.
    - transform: observable_fiber
      proposed_object: >-
        Hold the charged aggregate fixed and vary the forgotten structure (the
        true tail beyond M). Ask whether any intrinsic invariant inside the
        frozen protocol distinguishes the resulting cohorts.
      predicted_gain: >-
        None exists, since the protocol reads only the aggregate; the fibre
        argument therefore delivers the non-identifiability at zero compute and
        before any run.
    quantifier_order: >-
      THE FROZEN CONVENTION, WRITTEN OUT: FOR ALL sealed campaigns, charging
      each attempt at min(cost, cap) and aggregating coordinatewise yields a
      C_IC whose alpha supports the declared comparison. THE COUNTER-STATEMENT:
      FOR ALL distributions and FOR ALL caps M, E[min(X,M)] <= E[X] with deficit
      int_M^inf S; and THERE EXISTS a cap schedule (namely any fixed M) such
      that FOR ALL ladders the fitted slope tends to 0 (aggregate a) or 1
      (aggregate b) regardless of the true exponent. THE TRAP BEING HUNTED: the
      protocol needs the verdict to be a function of the MATHEMATICS alone --
      EXISTS-convention FORALL-arms-and-budgets -- while what the text delivers
      is FORALL-arms EXISTS-budget-making-the-verdict-come-out-either-way, the
      reverse order. THE REPAIR'S OWN ORDER, stated with equal explicitness and
      weaker than one might wish: EXISTS a cap rule (M = c0 sqrt(ell)) such that
      FOR ALL cells the bias ratio is the same constant -- which removes the
      bias from the SLOPE but not from the LEVEL, so no claim is made that
      per-cell alphas become unbiased, only that the fitted exponent does.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that a charging convention in one frozen design artifact biases
        a measured exponent by a derived amount ON A GENERIC BASELINE ARM at a
        toy ladder, together with the closed forms and the repair. It CANNOT
        certify anything about index calculus; cannot measure the IC arm's
        censoring fraction (no IC arm is run); cannot move an exponent; cannot
        advance, narrow, or close KN-OPEN-001 or RQ-ICEX-001; and cannot
        establish that the defect materially changed any past ICEX conclusion,
        since EV-ICEX-001 records that no ICEX measurement has ever executed.
        Writing it up as a refutation of the ICEX programme would be the
        premature-closure failure mode and is forbidden by this record.
      nearby_object_control: >-
        BSGS IS THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION WEAKENS, and it
        is included because it cuts against the headline. Its cost is nearly
        deterministic -- ceil(sqrt(ell)) baby steps plus a uniform number of
        giant steps -- so it has little mass beyond any cap set above its mean.
        FORCED: at the same c, BSGS's censoring distortion must be
        substantially SMALLER than rho's. That is the correct behaviour and it
        shows the effect is a property of the cost DISTRIBUTION rather than of
        the accounting rule alone. A method that could not distinguish the
        heavy-tailed arm from the concentrated one would not have identified the
        load-bearing structure, which is the tail beyond the cap.
    proof_obligations:
    - claim: >-
        E[min(X,M)] = int_0^M S <= E[X], for every distribution.
      responsibility: correctness
    - claim: >-
        For rho, ratio_aggregate = erf(c/sqrt 2) and ratio_per_success =
        erf(c/sqrt 2)/(1-exp(-c^2/2)), with the five tabulated values each.
      responsibility: baseline
    - claim: >-
        Fixed cap => aggregate slope -> 0 and per-success slope -> 1, against a
        true 1/2.
      responsibility: strictness
    - claim: >-
        M = c0 sqrt(ell) makes the bias ratio constant across cells and hence
        absent from the fitted slope.
      responsibility: feasibility
    - claim: >-
        Budget ratio 128*300/7200 = 5.3333 and floor(7200/300) = 24.
      responsibility: runtime
    - claim: >-
        The reading that the cap is fixed across cells is a reading of an
        artifact, isolated as HEUR-CEN-2; its failure voids Part 3 only.
      responsibility: interface
    - claim: >-
        Nothing here transfers to an index-calculus arm; no IC censoring
        fraction is measured or claimed.
      responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. NO complexity claim of any kind. This is an AUDIT AND
    REPAIR OF A CHARGING CONVENTION. It makes no system easier to solve, moves
    no exponent, and adds no attack. Pollard rho remains the ECDLP baseline at
    0.886 sqrt(N) group operations under this program's convention, and
    sota_delta is ZERO on every attack axis. dominated_by is not applicable --
    no Pareto point is claimed; the frontier rows checked to justify that are
    enumerated in IDEA-20260805-45bf55.

  heuristic_assumptions:
  - id: HEUR-CEN-1
    formal_statement: >-
      FOR ALL toy cells in the declared boundary, the Pollard-rho step count X
      satisfies P(X > t) = exp(-t^2/(2 ell)) (1 + o(1)), whence
      E[X] = sqrt(pi ell/2), E[min(X,M)] = sqrt(pi ell/2) erf(M/sqrt(2 ell)),
      and P(X <= M) = 1 - exp(-M^2/(2 ell)).
    random_model_justification: >-
      The birthday computation, DERIVED HERE from S(t) rather than imported.
      What is heuristic is only the passage from a structured r-adding walk to a
      uniform random function, which is known to be imperfect for small r and
      for which NO SOURCE IS CITED. THIS HEURISTIC IS LOAD-BEARING ONLY FOR THE
      SPECIFIC NUMBERS: the one-sided inequality E[min] <= E[X], the collision
      argument, the repair, and the budget arithmetic hold for every
      distribution and do not depend on it.
    supporting_results: []
    validation_experiment_ids: [EXP-ICEX-01a79b]
    falsification_condition: >-
      The empirical survival of the recorded step counts departs from
      exp(-t^2/(2 ell)) beyond the declared Kolmogorov-Smirnov band at any cell.
      THE SPLIT IS DECLARED BEFORE THE RUN so a model failure cannot be used to
      rescue either side: the SPECIFIC FORCED NUMBERS become void and must be
      recomputed from the empirical survival, while the SIGN of the bias, the
      two-aggregate opposition, the repair, and the budget arithmetic SURVIVE
      unchanged.
  - id: HEUR-CEN-2
    formal_statement: >-
      The frozen per-attempt wall cap of 300 s is applied unchanged at every
      ladder cell rather than re-declared per cell at seal time.
    random_model_justification: >-
      NOT A DISTRIBUTIONAL ASSUMPTION -- it is a reading of a committed
      artifact, recorded as a heuristic assumption precisely because its author
      is unavailable to confirm it. Textual support: budgets is a single block
      with no per-cell override, and schedule_obligations does not list a
      per-cell cap among the fields to be sealed.
    supporting_results: []
    validation_experiment_ids: [EXP-ICEX-01a79b]
    falsification_condition: >-
      Stage 0 obtains a Coordinator statement that the cap is per-cell and
      scaled with sqrt(ell). Part 3 (the slope result) is then VOID BY INTENT,
      the record says so plainly rather than salvaging it, and repair R2 is
      already satisfied. The one-sided inequality, the aggregate ambiguity, the
      absent censoring fraction, and the budget arithmetic all stand.

  structural_ingredients:
  - description: >-
      The identity E[min(X,M)] = int_0^M P(X > t) dt for nonnegative X, and its
      consequence that truncation is one-sidedly downward-biasing for every
      distribution.
    citation: Elementary; derived in this record from the layer-cake identity.
    role: fixes the SIGN of the bias without any distributional assumption
  - description: >-
      The birthday survival function for a random walk on ell elements and the
      resulting Gaussian-integral closed forms
      int_0^M exp(-t^2/(2 ell)) dt = sqrt(pi ell/2) erf(M/sqrt(2 ell)).
    citation: >-
      RECALLED-STANDARD and RE-DERIVED IN THIS RECORD. No source is cited and
      none is asserted; empirical validation is a declared experiment stage.
    role: fixes the SIZE of the bias on the control arm
  - description: >-
      Kaplan-Meier nonparametric survival estimation as a fallback aggregate.
    citation: >-
      NAMED FROM MEMORY, NOT READ, NOT CITED, AND NOT USED unless the closed
      form fails validation. Recorded so a reviewer can see the intended
      fallback rather than discovering it mid-run.
    role: contingency aggregate if HEUR-CEN-1 fails

  reduction_chain:
    core_problem: >-
      Determine whether the ICEX charging convention for right-censored attempts
      biases the reported exponent, in which direction, by how much, and whether
      a cap rule exists that removes the bias from the fitted slope.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is NO reduction from this accounting question to
      any statement about index calculus, ECDLP cost, or KN-OPEN-001. Removing a
      measurement bias does not make any relation easier to find. Any citation
      of this hypothesis toward an ECDLP cost conclusion must carry that gap
      explicitly, and KN-OPEN-001 IS NOT CLOSED, NARROWED, OR ADVANCED BY
      ANYTHING HERE.

  predictions:
  - metric: >-
      B0 (ZERO COMPUTE) - budget feasibility ratio recomputed from the frozen
      artifact: maximum_attempts * per_attempt_wall / per_campaign_wall, and the
      implied full-length attempt count
    direction: different
    minimum_effect: >-
      'EXACTLY 5.33333 (= 128*300/7200) and EXACTLY 24 = floor(7200/300). One
      division on committed text, predicted before the stage runs. If the
      arithmetic does not reproduce, the numbers were misread and the entire
      budget section is withdrawn without prejudice to the rest.'
  - metric: >-
      B1 (NULL, MUST RETURN 1) - ratio of the uncensored charged aggregate to
      itself, and the uncensored fitted ladder slope for matched rho
    direction: different
    minimum_effect: >-
      'Ratio EXACTLY 1.000 by construction, and the fitted slope CI must CONTAIN
      0.500. This null can genuinely fail: if the uncensored slope excludes 0.5,
      the rho implementation is not the algorithm modelled and NO censoring
      conclusion may be drawn from it.'
  - metric: >-
      B2 - ratio of the censored charged aggregate to the uncensored aggregate,
      matched rho, at c = M/sqrt(ell) in {0.25, 0.5, 1, 2, 4}
    direction: lower
    minimum_effect: >-
      '0.197413 / 0.382925 / 0.682689 / 0.954500 / 0.999937, each within the
      Monte Carlo band at the declared replicate count, MONOTONE INCREASING with
      every adjacent pair reported pass/fail. Derived before any run from
      erf(c/sqrt 2).'
  - metric: >-
      B3 - ratio of censored-with-restart cost per certified solve to the
      uncensored mean, same cells, same c ladder
    direction: higher
    minimum_effect: >-
      '6.416425 / 3.258850 / 1.735051 / 1.103896 / 1.000272, MONOTONE DECREASING
      -- the OPPOSITE direction to B2, approaching 1 from above while B2
      approaches from below, with no crossing. THE OPPOSITION IS THE PREDICTION:
      if both aggregates move the same way, the account is refuted.'
  - metric: >-
      B4 - fitted ladder slope of log2(charged aggregate) on n for matched rho
      with a FIXED cap held constant across n in {8,10,12,16}
    direction: lower
    minimum_effect: >-
      'Strictly below 0.35, against a true exponent of exactly 0.500 and against
      the uncensored control slope whose CI must contain 0.500. The asymptotic
