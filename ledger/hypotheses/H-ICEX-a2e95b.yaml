    CLAIM TIER toy, unraisable by any downstream citation. This is an ACCOUNTING
    AUDIT, NOT AN ATTACK. It makes no system easier to solve and MOVES NO
    EXPONENT. Pollard rho remains the ECDLP baseline; sota_delta is ZERO on
    every attack axis; dominated_by is not applicable.
  - >-
    GENERIC BASELINES ARE NOT INDEX CALCULUS. Every measured arm has a known
    cost distribution, chosen precisely because the answer is known. The
    asymmetry argument of Part 4 -- that an IC arm would be censored more -- is
    RELAYED-UNVERIFIED, is NOT measured here, enters no forced value, and must
    never be cited as a finding of this hypothesis.
  - >-
    POST-HOC CAPPING MEASURES THE ACCOUNTING EFFECT ONLY. It deliberately does
    not capture partial-state loss, restart overhead, or cache effects, and no
    claim about the operational cost of a real timeout is made.
  - >-
