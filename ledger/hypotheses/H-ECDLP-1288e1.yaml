hypothesis:
  id: H-ECDLP-1288e1
  question_id: RQ-MODEL-e61cb2
  statement: >-
    The ENDO campaign's organising move is a resource-labelled decomposition of
    the ECDLP: each subproblem is indexed by the non-generic resource it
    consumes. A partition is only usable for allocating effort if every method
    lands in exactly one cell and no method lands outside it. The hypothesis is
    that attempting the placement for the full enumerable method inventory will
    find a nonzero count of methods that fit no cell, fit several, or fit only by
    stretching a cell's definition - in particular that hybrid methods, which
    consume two non-generic resources essentially rather than incidentally, break
    single-resource labelling. Source proposal: IDEA-20260815-17cead.
  mechanism: >-
    Enumerate the known ECDLP methods reachable from this corpus. For each,
    identify the non-generic resource it consumes and attempt placement in
    exactly one cell, citing the cell definition relied on. Report the methods
    that fit no cell, fit several, or fit only by loosening a definition.
    Placement is decidable only if the cell definitions are precise; cells that
    require judgement are the FINDING rather than a nuisance, and are reported as
    such.
  assumptions:
    - >-
      That the method inventory is enumerable from this corpus and the literature
      it cites. Methods outside that inventory are the partition's blind spot and
      cannot be tested here; a clean placement therefore does not show the
      partition covers methods nobody in this corpus has recorded.
    - >-
      That each cell's definition is precise enough for placement to be decidable.
      Cells requiring judgement are the finding.
    - >-
      CRITICAL LOCATION ASSUMPTION, UNRESOLVED AND FLAGGED. The source proposal
      draws the partition and its transport theorem from GOAL-ENDO-001's
      objective. THIS DESIGN SESSION COULD NOT LOCATE THAT RECORD: there is no
      ledger/goals/GOAL-ENDO-001.yaml as of 2026-09-04 (checked by glob over the
      whole goals directory), and there is no ledger/questions/RQ-ENDO-001.yaml,
      although a coordination/goals/GOAL-ENDO-001 directory does exist and
      contains batch review artefacts. The cell definitions the entire test
      consumes therefore have NO VERIFIED COMMITTED SOURCE at design time.
      Locating them is Stage 0 and is a DECISIVE GATE: if no committed artefact
      states the cell definitions, the placement cannot be performed and that
      absence is itself the reportable result.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes how the campaign allocates effort is the
      assumption that its resource partition is a partition. If cells overlap or
      leave methods uncovered, effort allocated against it is allocated against
      something that is not a partition.
    baseline_embedding:
      parameter_slice: >-
        The trivial boundary is a purely generic method, which by construction
        consumes no non-generic resource. The partition must say IN ADVANCE where
        such a method goes - a designated generic cell, or outside the partition
        entirely.
      reproduction_check: >-
        A frozen fixture: the pre-declared expected placement of the generic
        method is written down before the inventory is placed, and the procedure
        must return it. If the partition has not pre-declared it, that absence is
        recorded as the first finding.
    observation_collision:
      observable: 'The placement of a method into a cell, with the cited definition.'
      distinct_preimage_search: >-
        PERFORMED. Reducing a method to one consumed resource discards its other
        requirements, so many operationally different methods collapse to the same
        placement. That is the partition's own simplification and is exactly what
        the test probes; the placement carries no mathematics and must never be
        read as one.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The placement table with a cited cell definition per row, plus the three
          counts (no-cell, multi-cell, judgement-requiring).
        predicted_gain: >-
          Converts an untested organising structure into a table a reviewer can
          dispute row by row, before the campaign spends against it.
    quantifier_order: >-
      FOR ALL methods in the enumerated inventory, there EXISTS exactly one cell
      containing it under the cell's own stated definition. The existential that
      breaks it is THERE EXISTS a method consuming two non-generic resources
      ESSENTIALLY, not incidentally.
    method_ceiling:
      strongest_certifiable_claim: >-
        That, for the enumerated inventory and the cell definitions as located and
        quoted, placement is or is not decidable and exclusive. It CANNOT show the
        partition covers methods this corpus has not recorded, cannot validate any
        cell's research value, and establishes nothing mathematical about the
        ECDLP.
      nearby_object_control: >-
        A deliberately hybrid method that consumes two resources, which the
        procedure must flag MULTI-CELL rather than force into one; and a purely
        generic method, whose placement the partition must have pre-declared.
    proof_obligations:
      - claim: The cell definitions are located in a committed artefact and quoted
        responsibility: baseline
      - claim: Every placement cites the cell definition it relied on
        responsibility: correctness
      - claim: The generic-method null returns the pre-declared placement
        responsibility: interface
      - claim: The hybrid-method null is flagged multi-cell, not forced
        responsibility: interface
      - claim: Judgement-requiring placements are flagged rather than resolved silently
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-PART-1
      formal_statement: >-
        Every known ECDLP method consumes exactly one identifiable non-generic
        resource, so the campaign's partition is well defined on the method
        inventory.
      random_model_justification: >-
        Not a distributional claim. The motivating rigorous ingredient is the
        campaign's transport theorem, which is said to establish that difficulty
        is an isogeny-class invariant up to transport cost and thereby motivates
        labelling methods by the resource that leaves the generic model. THE GAP,
        STATED: methods routinely COMBINE resources - index calculus with an
        endomorphism-invariant factor base consumes both algebraic structure and
        endomorphisms - so single-resource labelling may simply be false for the
        interesting hybrids. This design session did not open the transport
        theorem and does not assert it.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-83ac2d
      falsification_condition: >-
        A method consuming two non-generic resources ESSENTIALLY, not
        incidentally. The hybrid methods are where the partition is most likely to
        fail and they are reported individually rather than pooled.
  structural_ingredients:
    - description: >-
        The ENDO campaign's resource-labelled partition and its transport theorem,
        which the source proposal names as the campaign's organising structure and
        as the motivation for labelling methods by consumed resource.
      citation: 'GOAL-ENDO-001 objective and transport theorem T1, as named by IDEA-20260815-17cead'
      provenance: internal
      verified_by: >-
        NOT VERIFIED, AND THE SOURCE COULD NOT BE LOCATED. The Coordinator
        subagent under TASK-20260904-43152a searched for the record on 2026-09-04
        and found NO ledger/goals/GOAL-ENDO-001.yaml and NO
        ledger/questions/RQ-ENDO-001.yaml; a coordination/goals/GOAL-ENDO-001
        directory exists and holds batch review artefacts, which were not opened.
        The cell definitions and the transport theorem are therefore taken here
        ONLY from IDEA-20260815-17cead's own summary, which is a characterisation
        this session could not check against any committed record. Under the
        program's citation rules this entry may not be treated as verified
        internal support: locating and quoting the definitions is Stage 0 of
        EXP-ECDLP-83ac2d and is a decisive gate on the whole design.
      role: >-
        Supplies the cells the placement is made into. Without them the experiment
        has no reference and cannot run past Stage 0.
  reduction_chain:
    core_problem: >-
      Whether a resource-labelled decomposition of the ECDLP is usable for
      allocating research effort.
    corollaries: []
  predictions:
    - metric: 'generic-method null placement (a cell label, or OUTSIDE, or UNDECLARED)'
      direction: different
      minimum_effect: >-
        FORCED to a pre-declared outcome. If the partition has not said in
        advance where a purely generic method goes, that absence is itself a gap
        and is the finding, not a failure of the procedure.
    - metric: 'hybrid-method null placement (single cell, MULTI-CELL, or NONE)'
      direction: different
      minimum_effect: >-
        FORCED to MULTI-CELL. A hybrid forced into one cell means the procedure is
        stretching definitions and every placement it made is suspect.
    - metric: >-
        count of methods fitting no cell, count fitting several, and count
        placeable only by stretching a definition (three integers, over an
        inventory whose size is reported as a measured floor)
      direction: different
      minimum_effect: >-
        The three counts are the deliverable and no value is predicted for them
        individually. What IS predicted is that their SUM is strictly positive,
        driven by hybrid methods. A sum of zero means the partition places
        cleanly, which is a legitimate and cheap confirmation.
    - metric: >-
        graded placement ladder - four synthetic methods consuming exactly 0, 1, 2
        and 3 declared resources (four placement outcomes)
      direction: different
      minimum_effect: >-
        NONE-or-generic-cell, exactly one cell, MULTI-CELL with 2 named, MULTI-CELL
        with 3 named, in that order. Any other result means the procedure is not
        resolving resource count and every placement is void.
  test_boundary:
    instances:
      - 'The full ECDLP method inventory enumerable from this corpus and the literature it cites.'
      - 'A purely generic method (Pollard rho) as the first null.'
      - 'A deliberately hybrid method (index calculus with an endomorphism-invariant factor base) as the second null.'
      - 'Four synthetic methods with declared resource counts 0, 1, 2 and 3.'
    parameters:
      placement_rule_frozen_before_inventory_is_read: true
      citation_required_per_placement: true
      inventory_size_reported_as: floor
      compute: none
    implementation: >-
      Symbolic placement by reading, with a placement rule and the expected null
      outcomes frozen and hashed before the inventory is enumerated.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 2
  falsification_conditions:
    - >-
      A null behaves unexpectedly - the generic method lands somewhere other than
      its pre-declared placement, or the hybrid is forced into a single cell. The
      partition's boundaries are not as declared and must be restated.
    - >-
      Many methods fit no cell. The partition does not cover the method space and
      cannot allocate effort.
    - >-
      Many methods fit several cells. The partition is not a partition and its
      cells overlap.
    - >-
      Placement is clean, with both nulls behaving as declared and all three
      counts zero. The partition is usable and this record confirms it cheaply
      before the campaign spends against it. This falsifies the hypothesis's
      central prediction and is a good outcome.
    - >-
      The graded ladder does not separate its four resource counts. The procedure
      is not resolving resource count and every placement is void.
    - >-
      STAGE 0 GATE: no committed artefact stating the cell definitions can be
      located. The placement cannot be performed and that absence is the reported
      result; nothing further is run.
  interpretation_limits:
    - >-
      This tests a TAXONOMY and establishes nothing mathematical about the ECDLP.
      Declared in advance, unconditionally: the test consumes no curve and
      performs no arithmetic on any group, so no output row may be quoted as a
      mathematical result or as a statement about elliptic curves. A curve-free
      object - any taxonomy of any subject - would produce the same kind of
      output.
    - >-
      Scoped to the enumerated method inventory, which is NOT claimed complete. An
      inventory drawn from this corpus inherits the corpus's blind spots, so a
      clean placement does not show the partition covers methods nobody here has
      recorded.
    - >-
      A clean placement supports USING the partition for allocation; it does not
      validate any cell's research value, and it may not be cited as evidence that
      any lane is worth funding.
    - >-
      DEFINITION STRETCHING is the central threat: placing a method by loosening a
      cell's definition makes the partition look exhaustive while destroying its
      meaning. That is why every placement must cite the definition it used, and
      why judgement-requiring placements are flagged rather than resolved.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, IN THE ONLY SENSE THAT APPLIES: whether the
      partition would be a good organising structure for methods not yet invented
      is untestable by any placement exercise, and is not claimed.
    - >-
      NO STATUS CHANGE AND NO REPRIORITISATION is proposed or implied. Those are
      Coordinator decisions.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260815-17cead.yaml
    - ledger/questions/RQ-MODEL-e61cb2.yaml
    - experiments/EXP-ECDLP-83ac2d/specification.yaml
