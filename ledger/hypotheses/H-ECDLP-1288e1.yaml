hypothesis:
  id: H-ECDLP-1288e1
  question_id: RQ-MODEL-e61cb2
  statement: >-
    GOAL-ENDO-001 labels every lane by the non-generic resource it must consume,
    drawing on the R1-R8 taxonomy fixed in DECOMPOSITION.md section 2. TWO PARTS
    OF THE SOURCE PROPOSAL'S QUESTION ARE ALREADY ANSWERED BY THE COMMITTED
    RECORD AND ARE NOT TESTED HERE: the labelling is NOT single-valued (L1 is
    declared "Resource R1, R2, R4" and L11 "Resource R1, R2", so lanes carry
    resource SETS), and a purely generic method is NOT undeclared but explicitly
    OUTSIDE the partition by the section-2 admissibility filter. What remains
    open, and is what this hypothesis tests, is whether the taxonomy is a usable
    COVER: whether every enumerable ECDLP method receives a nonempty resource set
    (or the declared `none` audit class) decidable from the section-2 table's own
    definitions, and whether two independent placers agree. The hypothesis
    predicts a nonzero count of methods that receive no resource, that are placed
    only by stretching a definition, or on which two placers disagree. Source
    proposal: IDEA-20260815-17cead.
  mechanism: >-
    Section 2 states the filter operationally: "A lane is inadmissible on its
    face if the only thing it does with phi is apply it to points of G. Any lane
    in this campaign must therefore name a resource that is not a group-operation
    output," and closes with "A lane that cannot name its resource is closed
    before it costs anything." The taxonomy is therefore load-bearing on what the
    campaign refuses to fund, not merely on how it files things. Its usability
    turns on two properties a placement exercise can decide cheaply: COVER, that
    every method a generator might bring receives a nonempty resource set or the
    declared `none` class; and DECIDABILITY, that the assignment follows from the
    table's own "What it is" column rather than from the placer's judgement.
    Failure of either does not make any lane wrong; it means the filter admits or
    excludes by judgement, which is a different and more expensive instrument
    than the record describes.
  assumptions:
    - >-
      That DECOMPOSITION.md is the operative statement of the taxonomy. It is the
      artefact GOAL-ENDO-001's own opening note names as fixing the
      decomposition, and its section 2 table is quoted verbatim in
      structural_ingredients below.
    - >-
      That the method inventory is enumerable from this corpus and the literature
      it cites. Methods outside that inventory are the taxonomy's blind spot and
      cannot be tested here; a clean cover therefore does not show the taxonomy
      covers methods nobody in this corpus has recorded.
    - >-
      That the fourteen lanes' own declared resource sets are the ground truth
      for a known-answer fixture. They are committed and they are stated per lane
      in section 4, which is what makes a fourteen-row known-answer check
      possible at zero compute.
    - >-
      That `Resource none` is a LEGITIMATE declared class and not a placement
      failure. L12 declares "Resource none - this lane audits resources" and L14
      declares "Resource none", so a procedure that scored those as NONE-fit
      would be measuring its own misreading.
  proof_search_map:
    bottleneck: >-
      Section 2's filter closes a lane "before it costs anything" when it cannot
      name its resource. The step whose removal changes what the campaign funds
      is therefore the decidability of resource naming, not the exclusivity of
      the labels.
    baseline_embedding:
      parameter_slice: >-
        The exact boundary of the existing filter is a method that does nothing
        with an endomorphism except apply it to points of the prime-order
        subgroup. Section 2 declares that inadmissible, so a purely generic
        method must place OUTSIDE.
      reproduction_check: >-
        A frozen fourteen-row fixture: applying the placement procedure to each
        lane's own decisive test must return that lane's declared resource set,
        exactly, including the two `none` lanes.
    observation_collision:
      observable: >-
        The resource set assigned to a method, together with the cited definition
        for each element.
      distinct_preimage_search: >-
        PERFORMED. Reducing a method to a resource set discards its cost model,
        its parameters, and its reachability, so operationally very different
        methods collide on the same set - L1 and L11 both contain R1 and R2 and
        are different lanes. That collision is the taxonomy's own simplification,
        which is why the placement carries no mathematics and why every row
        additionally records the lane's T5 reachability answer rather than
        pretending the set determines it.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The placement table with a quoted definition per assigned resource, a
          T5 reachability field per row, and three counts (no-resource,
          stretched, placer-disagreement).
        predicted_gain: >-
          Converts an untested admissibility filter into a table a reviewer can
          dispute row by row, before the filter is used again to refuse funding.
    quantifier_order: >-
      FOR ALL methods in the enumerated inventory there EXISTS a nonempty
      resource set, or the declared `none` class, assignable from the section-2
      table's own definitions without loosening any of them. The existential that
      breaks it is THERE EXISTS a method whose resource cannot be named from the
      table without stretching a definition, or on which two independent placers
      disagree.
    method_ceiling:
      strongest_certifiable_claim: >-
        That, for the enumerated inventory and the section-2 table as quoted,
        resource assignment is or is not decidable and reproducible. It CANNOT
        show the taxonomy covers methods this corpus has not recorded, cannot
        validate any lane's research value, and establishes nothing mathematical
        about the ECDLP.
      nearby_object_control: >-
        A purely generic method, which section 2 pre-declares OUTSIDE; a
        deliberately hybrid method, which must receive a multi-element set; and
        the two `Resource none` audit lanes, which must receive the `none` class
        rather than a no-fit verdict. Three nearby objects on which the procedure
        must give three different declared answers.
    proof_obligations:
      - claim: The section-2 table is quoted verbatim and every assignment cites it
        responsibility: baseline
      - claim: The fourteen-lane fixture returns each lane's declared resource set exactly
        responsibility: interface
      - claim: The generic-method null places OUTSIDE by the admissibility filter
        responsibility: interface
      - claim: The hybrid-method null receives a multi-element set, not a single label
        responsibility: interface
      - claim: Stretched and judgement-requiring assignments are flagged, never resolved silently
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-PART-1
      formal_statement: >-
        COVER AND DECIDABILITY. Every ECDLP method enumerable from this corpus
        can be assigned a nonempty subset of {R1,...,R8}, or the declared `none`
        audit class, using only the "What it is" definitions of the
        DECOMPOSITION.md section-2 table, and two independent placers applying
        that table agree on the assignment.
      random_model_justification: >-
        Not a distributional claim. The motivating rigorous ingredient is
        transport theorem T1, quoted in structural_ingredients, which establishes
        that ECDLP difficulty is constant across an F_p-isogeny class up to
        transport cost and thereby motivates labelling methods by the resource
        that leaves the generic model.
      supporting_results:
        - >-
          analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section 4,
          in which all fourteen lanes carry a declared resource set drawn from
          this taxonomy. Read verbatim by this design session; it is the fixture
          the validation uses and it is committed.
      validation_experiment_ids:
        - EXP-ECDLP-83ac2d
      falsification_condition: >-
        A method whose resource cannot be named from the table without loosening
        a definition, or on which two independent placers disagree. NOTE THE
        REVISION: the source proposal's version of this heuristic asserted that
        every method consumes EXACTLY ONE resource. THAT VERSION IS ALREADY
        FALSIFIED BY THE COMMITTED RECORD AT ZERO COMPUTE - L1 declares "Resource
        R1, R2, R4" and L11 declares "Resource R1, R2" - so it is not carried
        here as an open assumption. Multi-resource labelling is the campaign's
        existing practice, not a defect this experiment might discover.
  structural_ingredients:
    - description: >-
        The R1-R8 resource taxonomy and the admissibility filter that uses it,
        quoted verbatim from section 2: "A lane is inadmissible on its face if
        the only thing it does with `phi` is apply it to points of `G`. Any lane
        in this campaign must therefore name a resource that is not a
        group-operation output." The table's rows are R1 x-coordinates as field
        elements (index calculus, Semaev); R2 the curve equation (a,b) / model;
        R3 End(E) as a ring (ideals, norms, class group); R4 the isogeny graph /
        class-group action; R5 ell-torsion for ell != N as a Galois module; R6
        lifts to Z_p / char 0; R7 pairings into F_{p^k}; R8 multi-instance /
        preprocessing structure. Section 2 closes: "A lane that cannot name its
        resource is closed before it costs anything."
      citation: analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a opened
        analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md on
        2026-09-04 and read sections 2, 3, 4 (lane headers plus L11-L14 in full),
        5 and 6 VERBATIM, reproducing the taxonomy table and the filter sentences
        above from that read. This CONFIRMS the characterisation carried by
        IDEA-20260808-8e13ff and IDEA-20260808-ea3b4f that the R1-R8 taxonomy
        lives in DECOMPOSITION.md section 2. It also establishes the two facts
        that revise this hypothesis: the lanes carry resource SETS, and a generic
        method is excluded by the filter rather than unaddressed.
      role: >-
        Supplies the cells the placement is made into, the pre-declared outcome
        of the generic-method null, and the fourteen-row known-answer fixture.
    - description: >-
        Transport theorem T1, quoted verbatim: "Let `phi: E -> E'` be an
        `F_p`-isogeny of degree `d` with `gcd(d, N) = 1`. Then `phi` restricted to
        `G` is an injective group homomorphism, `phi(Q) = [k] phi(P)`, and
        `phi(P)` has order `N`. So the instance `(E, P, Q, k)` maps to
        `(E', phi(P), phi(Q), k)` with the same `k`." With T2: "ECDLP difficulty
        is therefore constant across an `F_p`-isogeny class up to transport
        cost."
      citation: 'analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section 3'
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a read section 3 verbatim
        on 2026-09-04 and reproduces T1 and T2 above. The document marks T1
        `[fact]` and its own section 6 states T1 "is elementary and is the only
        mathematical claim this document asserts without qualification"; T5, by
        contrast, is marked `[open]` and rests on GRH-conditional rapid mixing,
        "cited, not proved, here". Both qualifications are carried forward.
      role: >-
        The motivation for labelling methods by consumed resource, and the source
        of the mandatory T5 reachability field recorded on every placement row.
  reduction_chain:
    core_problem: >-
      Whether the resource taxonomy that GOAL-ENDO-001 uses to refuse funding to
      a lane is a decidable, reproducible cover of the method space.
    corollaries: []
  predictions:
    - metric: >-
        generic-method null placement (a resource set, or OUTSIDE, or UNDECLARED)
      direction: different
      minimum_effect: >-
        OUTSIDE, by the section-2 admissibility filter. THIS IS NOW A FORCED
        VALUE READ FROM THE RECORD, NOT AN OPEN QUESTION: the filter declares a
        method that only applies phi to points of G inadmissible on its face. The
        source proposal predicted that the partition might never have declared
        this; it has, and a return of UNDECLARED would mean the procedure is not
        applying section 2.
    - metric: 'hybrid-method null placement (size of the returned resource set)'
      direction: higher
      minimum_effect: >-
        At least 2, with each element citing its table row. A hybrid forced to a
        single resource means the procedure is discarding the multi-label
        structure the record already uses, and every assignment it made is
        suspect.
    - metric: >-
        fourteen-lane known-answer fixture - the number of lanes whose declared
        resource set the procedure reproduces exactly (integer out of 14)
      direction: higher
      minimum_effect: >-
        All fourteen, including the two `Resource none` audit lanes, which must
        return the `none` class and not a no-fit verdict. Anything below 14
        localizes the defect to a named lane and voids every assignment outside
        the fixture.
    - metric: >-
        count of inventory methods receiving NO resource, count placed only by
        STRETCHING a definition, and count on which two independent placers
        DISAGREE (three integers, over an inventory whose size is reported as a
        measured floor)
      direction: different
      minimum_effect: >-
        The three counts are the deliverable and no value is predicted
        individually. What IS predicted is that their SUM is strictly positive.
        A sum of zero is a clean confirmation that the filter is decidable and
        reproducible on the enumerable inventory, and it falsifies this
        prediction.
    - metric: >-
        graded synthetic ladder - four methods constructed to consume exactly 0,
        1, 2 and 3 taxonomy resources (four returned set sizes)
      direction: different
      minimum_effect: >-
        Returned set sizes exactly 0 (placing OUTSIDE by the filter), 1, 2 and 3,
        with the correct resources named at each. Any other result means the
        procedure is not resolving resource count and every assignment is void.
    - metric: >-
        number of placement rows carrying a T5 reachability answer (integer, out
        of rows placed)
      direction: higher
      minimum_effect: >-
        Every row. Section 3 states T5 "is stated here so that every lane in this
        campaign carries reachability as a mandatory second gate", so a placement
        row without it is incomplete by the campaign's own rule.
  test_boundary:
    instances:
      - 'The full ECDLP method inventory enumerable from this corpus and the literature it cites.'
      - 'The fourteen committed lanes and their declared resource sets, as a known-answer fixture.'
      - 'A purely generic method (Pollard rho) as the first null, pre-declared OUTSIDE.'
      - 'A deliberately hybrid method (index calculus with an endomorphism-invariant factor base) as the second null.'
      - 'Four synthetic methods consuming exactly 0, 1, 2 and 3 taxonomy resources.'
    parameters:
      taxonomy_source: 'analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section 2, R1-R8 plus the declared `none` class'
      placement_rule_frozen_before_inventory_is_read: true
      citation_required_per_assigned_resource: true
      t5_field_required_per_row: true
      inventory_size_reported_as: floor
      compute: none
    implementation: >-
      Symbolic placement by reading, with the placement rule, the quoted table
      and the pre-declared null outcomes frozen and hashed before the inventory
      is enumerated.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 2
  falsification_conditions:
    - >-
      The generic-method null does not place OUTSIDE. The procedure is not
      applying the section-2 admissibility filter and every assignment is
      suspect.
    - >-
      The hybrid-method null is forced to a single resource. The procedure
      discards the multi-label structure the committed lanes already use.
    - >-
      The fourteen-lane fixture is not reproduced exactly. The procedure cannot
      recover assignments that are already committed, so it cannot be trusted on
      assignments that are not.
    - >-
      All three counts are zero. The taxonomy is a decidable, reproducible cover
      of the enumerable inventory - a clean confirmation that falsifies this
      hypothesis's central prediction, obtained cheaply and before the filter is
      used again.
    - >-
      Many methods receive no resource. The taxonomy does not cover the method
      space, and section 2's filter would close them "before it costs anything"
      on a gap in the table rather than on their merits - which is the specific
      failure that would matter.
    - >-
      The graded synthetic ladder does not separate its four resource counts. The
      procedure is not resolving resource count and every assignment is void.
  interpretation_limits:
    - >-
      This tests a TAXONOMY and establishes nothing mathematical about the ECDLP.
      Declared in advance and unconditionally: the test consumes no curve and
      performs no arithmetic on any group, so no output row may be quoted as a
      mathematical result or as a statement about elliptic curves. A curve-free
      object - any taxonomy of any subject - would produce the same kind of
      output.
    - >-
      Scoped to the enumerated method inventory, which is NOT claimed complete.
      An inventory drawn from this corpus inherits the corpus's blind spots, so a
      clean cover does not show the taxonomy covers methods nobody here has
      recorded.
    - >-
      A clean cover supports CONTINUED USE of the section-2 filter; it does not
      validate any lane's research value, and it may not be cited as evidence
      that any lane is worth funding. DECOMPOSITION.md section 6 records that
      every lane is currently dominated as an attack by parallel Pollard rho with
      distinguished points at 0.886 sqrt(N), and nothing here changes that.
    - >-
      DEFINITION STRETCHING is the central threat: assigning a resource by
      loosening a table row makes the taxonomy look exhaustive while destroying
      the filter's meaning. Every assignment therefore cites the row it used,
      quoted, and stretched assignments are flagged with the loosening named.
    - >-
      The exclusivity question the source proposal posed is NOT tested here
      because the committed record already answers it: lanes carry resource sets,
      not single labels. Reporting a multi-label finding as a discovery would
      misrepresent the record.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, IN THE ONLY SENSE THAT APPLIES: whether
      the taxonomy would cover methods not yet invented is untestable by any
      placement exercise and is not claimed.
    - >-
      NO STATUS CHANGE AND NO REPRIORITISATION is proposed or implied. Those are
      Coordinator decisions.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260815-17cead.yaml
    - ledger/goals/GOAL-ENDO-001/goal.yaml
    - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
    - ledger/questions/RQ-MODEL-e61cb2.yaml
    - experiments/EXP-ECDLP-83ac2d/specification.yaml
