  title: >-
    The beta factor is 3 and the anomalous trace is 1.
  statement: >-
    The curve y squared equals x cubed plus 5 over the field of 7
    elements has 7 points, so its trace is 1. The six nonzero points
    fall into 2 orbits of size 3 under multiplication of the
    x-coordinate by 2, and into 3 pairs of size 2 under negation. The
    orbit factor is 6/2 = 3. The sign factor is 6/3 = 2. Their product
    is 6, which equals the nonzero count. The difference 6 minus 2 is
    4, and 4 is not the orbit factor. The same orbit factor 3 and sign
    factor 2 hold on y squared equals x cubed plus 6 over the field of
    13 elements, which has 7 points and trace 7. There 13 is congruent
    to 6 modulo 7, and 13 squared is congruent to 1 modulo 7, so the
    embedding degree is 2. On the first curve, 7 to the k minus 1
    leaves residue 6 modulo 7 for every positive k, so the group order
    never divides that quantity. The third named alpha is 67/100, and
    67/100 minus 2/3 equals 1/300. There are 5 alphas and 5 depths.
    The grid has 25 cells. The depths multiply to 1024.
  mechanism: >-
    The proposal asks for an exact integer factor of 3 on a j = 0
    curve, and for trace 1 when the point count equals the field
    size. This contract checks those counts. It does not run a
    detector.
