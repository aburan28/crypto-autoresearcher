  proposed_by: idea-generator
  approved_by_decision: DEC-20261002-5efbe8
  title: >-
    The floor model has j equal to 6912/31, not 0 and not 1728.
  statement: >-
    For y^2 = x^3 + A x + B, away from characteristics 2 and 3, the
    invariant is 1728 times 4 A^3 over 4 A^3 + 27 B^2 when that
    denominator is nonzero. The model (0, 1) has invariant 0. The
    model (1, 0) has invariant 1728. The model (1, 1) has numerator
    6912 and denominator 31, so the invariant is 6912/31. That
    fraction is not an integer, and 6912 is not 1728 times 31.
    The numerator 6912 is 2^8 times 27, so it is nonzero in every
    characteristic other than 2 and 3. In characteristics 5, 7, 11
    and 13 the floor residues are 2, 1, 9 and 7, while 1728 reduces
    to 3, 6, 1 and 12. In characteristic 31 the floor denominator
    vanishes, so that model is singular there. The factorials are
    24, 120 and 720. Five divides 120 and 720 and does not divide
    24. Seven divides none of the three. Two and three divide all
    three.
  mechanism: >-
    The proposal compares a curve with an extra automorphism, at
    invariant 0 or 1728, with a floor curve in the same odd
    characteristic, and it requires that the characteristic not
    divide m factorial. This contract checks those integer gates.
    It does not build a Macaulay matrix and it does not record a
    fall profile.
