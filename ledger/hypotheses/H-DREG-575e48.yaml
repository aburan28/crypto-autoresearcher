# H-DREG-575e48
# Crater and floor j-invariants for IDEA-20260922-1f9967.
# No Macaulay matrix. Approval: DEC-20261002-5efbe8.
hypothesis:
  id: H-DREG-575e48
  question_id: RQ-DREG-c8ae8d
  source_idea: IDEA-20260922-1f9967
  experiment_id: EXP-DREG-2cfbfc
  specified_at: '2026-10-02'
