hypothesis:
  id: H-ECQ-cec3c4
  question_id: RQ-ECQ-80f23c
  statement: The pencil of plane cubics through 8 rational points in general position is a rational
    elliptic surface whose Mordell-Weil group has rank 8 over Q(t); Mestre-Nagao sieving of its Q-rational
    specialisations, followed by descent, certifies curves over Q of rank >= 11 within a bounded
    search; and this route CANNOT reach 31, with the shortfall attributable to the base rank over
    Q(t) (8 here versus the roughly 18-20 the published records rest on) rather than to sieve volume
    alone.
  mechanism: 'Eight points in general position impose 8 conditions on the 10-dimensional space of
    plane cubics, leaving a pencil; its members meet in a 9th base point, and the 9 base points become
    sections of the elliptic surface. Taking one as the zero section leaves 8 independent sections,
    and a rational elliptic surface has Mordell-Weil rank at most 8 over Q-bar(t), so 8 is both reachable
    and maximal for this construction. Every specialisation t = t0 then has rank >= 8 over Q by Silverman
    specialisation, and the sieve looks for the t0 where extra independent points appear. The record
    pipeline is the SAME pipeline with a larger base: exceeding rank 8 over Q(t) needs a K3 elliptic
    surface rather than a rational one, which is where Elkies-class search lives and where this campaign
    stops.'
  assumptions:
  - 'Silverman specialisation: all but finitely many specialisations preserve independence. The experiment
    does not rely on it for any certified claim -- every reported rank over Q is recertified by exhibiting
    points on the specialised curve and checking its own regulator.'
  - The Mestre-Nagao statistic is a HEURISTIC prefilter only. It orders candidates; it never contributes
    to a certified rank. GOAL-ECRANK-001 measured it working poorly on twist families (top 400 of
    364756 yielded nothing above rank 4), which is on record as a reason not to trust it beyond ordering.
  proof_search_map:
    bottleneck: 'The rank of the base curve over Q(t). Sieve volume is the visible cost but the base
      rank is the exponent: the record curves rest on a Q(t) base of roughly 18-20, and no amount
      of sieving a rank-8 base substitutes for it.'
    baseline_embedding:
      parameter_slice: 'The published record ladder over Q: 28 (2006), 29 (2024), 30 (2026). This
        campaign embeds at the bottom of it, not near the top.'
      reproduction_check: 'The Alpoge-Howell rank-30 curve was already independently re-verified
        by this program: all 30 published generators lie on the curve in exact arithmetic and the
        30x30 regulator is 1.07e37 with least eigenvalue 0.294 at two precisions (RUN-ECRANK-e1e30e-003).
        That is the frozen fixture for what a real rank-30 certificate looks like, and any claim
        made here is measured against it.'
    observation_collision:
      observable: certified rank of a specialisation
      distinct_preimage_search: The sieve searches for specialisations whose certified rank exceeds
        the generic 8. Collisions -- distinct t0 giving the same rank -- are the normal case; the
        question is the tail.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: a rational elliptic surface with all 8 sections defined over Q, from 8 rational
        base points
      predicted_gain: rank >= 8 over Q for EVERY specialisation, versus rank <= 4 from the twist
        search this program already measured
    quantifier_order: EXISTS 8 rational points such that FOR ALL specialisations t0 outside a finite
      bad set the 8 sections stay independent, and EXISTS t0 among those searched whose certified
      rank is >= 11. Only the second existential is claimed; the first is a construction input and
      is verified by direct regulator computation at the t0 actually used.
    method_ceiling:
      strongest_certifiable_claim: rank >= (8 + whatever the sieve finds) for the specific curves
        exhibited. The construction cannot exceed 8 over Q(t) by the rational-elliptic-surface bound,
        so its ceiling over Q is set by how much extra a specialisation happens to carry. NOTHING
        here approaches 31, and the campaign says so before it runs rather than after it fails.
      nearby_object_control: 'The carried-forward Mestre producer TASK-20260822-a7a9e8 is the nearby
        object: a different construction aimed at the same quantity. If the two disagree by a lot
        on best achievable rank, the cheaper one is wrong somewhere.'
    proof_obligations:
    - claim: the 8 sections are independent at the specialisations used
      responsibility: correctness
    - claim: every reported rank over Q is backed by that many exhibited points
      responsibility: strictness
    - claim: the gap to 31 is measured on both axes, base rank and sieve volume
      responsibility: scope
    - claim: the Mestre-Nagao statistic is used only to order candidates
      responsibility: interface
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: Explicitly null. No complexity claim; this is a construction-and-measurement
    question.
  heuristic_assumptions:
  - id: HEUR-1
    statement: The Mestre-Nagao sum orders specialisations by likely rank well enough that the top
      of the ordering is worth certifying. Used ONLY for ordering. If it orders no better than chance
      the campaign still reports a certified best rank, just a worse one, and the measured hit rate
      is itself reported.
  predictions:
  - id: P1
    statement: The 8-point cubic pencil yields 8 sections whose specialisations have a nonsingular
      8x8 height regulator, confirming rank >= 8 over Q(t).
  - id: P2
    statement: Sieving and certifying yields at least one curve over Q of certified rank >= 11.
  - id: P3
    statement: The best certified rank stays far below 31, and the campaign returns the gap on both
      axes rather than a narrative.
  falsification:
  - 'P1 fails: the 8 sections are dependent, meaning the 8 base points were not in general position
    and the construction is wrong.'
  - 'P2 fails: no specialisation certifies above the generic 8 within budget, which would make the
    sieve, not the base rank, the binding constraint and would invert the campaign conclusion.'
  - 'P3 fails: a curve of rank >= 31 over Q is certified, which would be a world record and would
    route to review-breakthrough rather than review-adversarial.'
  status: specified
  owner: coordinator
