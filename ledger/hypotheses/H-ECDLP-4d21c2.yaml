hypothesis:
  id: H-ECDLP-4d21c2
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260815-284aff
  derived_from_idea: IDEA-20260815-284aff

  statement: >-
    SCOPE. A measurement of whether the classical sqrt(M) multi-target
    amortization of batch Pollard rho survives having its distinguished-point
    STORAGE CHARGED, at batch sizes 1, 4, 16 and 64 on one toy prime-order
    subgroup. NO NEW ALGORITHM, NO ATTACK, NO EXPONENT. Four conjuncts, each
    separately falsifiable.
    (C1, THE NULLS BEHAVE) Batch size one reproduces the single-target baseline
    exactly, and M independent non-sharing solves cost M times the baseline. The
    two fail in opposite directions: the first catches a batch harness that has
    lost the single-target case, the second catches a harness that is sharing
    something it should not. A failure of either voids every result.
    (C2, THE UNCHARGED FACTOR IS REALISED) With storage free, total cost grows
    about as sqrt(M) times the single-target cost across the tested batch sizes.
    This is an INSTRUMENT CHECK against the classical result, not the
    hypothesis's content; a batch harness that cannot reproduce a known factor
    cannot be trusted to measure a charged one.
    (C3, THE CHARGED PER-TARGET COST IS THE DECISION-RELEVANT NUMBER AND IT IS
    NOT sqrt(M)) Once the shared distinguished-point table is charged in the
    same cost model as computation, the realised per-target cost decays STRICTLY
    MORE SLOWLY than sqrt(N/M). The charged factor is necessarily worse than the
    uncharged one -- the parent proposal's own HEUR-BATCH-1 says so and states
    that the only question is by how much at reachable sizes.
    (C4, THE ANSWER DEPENDS ON THE EXCHANGE RATE AND THAT DEPENDENCE IS REPORTED
    RATHER THAN HIDDEN) Charging storage against computation requires a rate
    converting bytes into operation-equivalents. That rate is a choice, not a
    measurement, and a single chosen rate would make C3's answer an artifact of
    it. The charged result is therefore reported as a CURVE over a declared
    range of rates, with the rate at which amortization stops paying identified
    explicitly.
    THE MOST DECISION-RELEVANT OUTCOME IS A NEGATIVE ONE AND IT IS NAMED IN
    ADVANCE. If storage dominates before the factor is realised -- that is, if
    the charged per-target cost stops decreasing, or increases, within the
    tested batch range at a plausible rate -- then multi-target amortization is
    MEMORY-BOUND in practice at these sizes, and every record in this campaign
    that charges a multi-target effect at the uncharged sqrt(M) is overstating
    the attacker. The parent proposal calls this the most decision-relevant
    possible outcome and it is preserved as such.

  mechanism: >-
    THE GAP AS THE PROPOSAL STATES IT. Solving M instances on one curve costs
    about sqrt(M) times a single solve rather than M times, which is a real
    exponent-level effect and the one deployed systems actually face when many
    keys share a curve. The theoretical factor assumes an idealised shared walk
    with FREE storage. Whether it is realised at deployable batch sizes with
    distinguished-point storage charged is measurable and is not measured here.
    WHAT IS ACTUALLY RUN. Batch rho with a single shared distinguished-point
    table tracking all M targets: each step tests the current point against the
    M target tags, and a collision within one target's tag resolves that target.
    Per cell the run records total group operations to resolve all M targets,
    per-target operations, the peak table occupancy in entries and bytes, the
    peak resident memory, and the order in which targets resolve.
    THE CHARGING STEP, WHICH IS THE WHOLE POINT AND WHICH THE PROPOSAL FLAGS AS
    CONDITIONAL. The parent proposal's second assumption reads: storage cost can
    be charged in the same model as computation, and IF IT CANNOT, the
    amortization number is incomplete and must say so. That conditional is
    preserved as a live obligation rather than assumed away. Charging requires a
    rate r converting one byte of retained table into operation-equivalents.
    There is no measurement that determines r; it encodes what the accounting
    treats memory as worth. A contract that fixes one r and reports one number
    would be reporting r, not the algorithm. So the charged per-target cost is
    computed across a declared range of r spanning several orders of magnitude
    and reported as a curve, and the crossing rate -- the r at which increasing
    the batch stops paying -- is the reportable scalar.
    WHY THE UNCHARGED ARM IS ONLY AN INSTRUMENT. The sqrt(M) factor is classical
    and this record claims no novelty for it. Its role is a known-answer check:
    a harness whose uncharged factor is not about sqrt(M) has an implementation
    defect, and no charged number from it means anything. The parent proposal
    lists the uncharged comparison and the charged one side by side for exactly
    this reason.
    THE DOMINANT CONFOUNDER AND ITS DIRECTION. An UNCHARGED
    distinguished-point table makes amortization look FREE, which is the
    direction that overstates the attacker and understates the defender. That is
    the dangerous direction here, and it is the mirror image of the danger in
    the rho-baseline record, where a weak implementation overstates the
    incumbent. Every table therefore carries peak memory beside every operation
    count.
    THE SECOND CONFOUNDER, PRESERVED VERBATIM IN FORCE. Batch sizes reachable at
    toy problem sizes may not represent deployed ratios of batch size to group
    size. A batch of 64 against a 2^24 group is a ratio no deployment exhibits.
    The record offers NO extrapolation to deployed ratios and says so.

  assumptions:
    - >-
      That a shared distinguished-point table across targets is implementable in
      the available harness. The parent proposal's first assumption, preserved.
    - >-
      That storage cost can be charged in the same model as computation. THE
      PROPOSAL'S OWN CONDITIONAL IS PRESERVED IN FORCE: if it cannot, the
      amortization number is incomplete and the record must say so. The contract
      discharges this by making the exchange rate an explicit declared parameter
      swept over a range, rather than by asserting that a single charging is
      possible.
    - >-
      That the tag test is charged identically in the batch arm and the
      independent-runs arm, since at large M the per-step tag test can dominate
      the walk itself.
    - >-
      That instances and seeds are frozen before execution and shared across
      arms, so the batch and independent arms solve the same targets.
    - >-
      That the single toy group size tested is not claimed to represent any
      other, and that no batch-size-to-group-size ratio here is claimed to
      represent a deployed one.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      PURELY EMPIRICAL. No theorem, asymptotic bound, certificate family,
      reduction or closure argument is proposed. The parent proposal states
      under object_first_candidate that no tracked object propagating under a
      group law is proposed, and describes its own content as measuring a
      classical effect's realisation rather than proposing a new algorithm. Per
      templates/research-records.md a purely empirical hypothesis sets this
      field and leaves the other subfields null. The identifiability question
      that DOES apply -- whether the measurement could come out other than
      predicted -- is handled by the two forced nulls and by the charged-versus-
      uncharged split, which is where it belongs.

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. No complexity improvement is claimed and no exponent
    moves. The parent proposal states plainly that it proposes no algorithm for
    any hard problem, that the incumbent is the classical multi-target
    amortization result, and that it is measured here with storage charged
    rather than improved. Every value of the required claim_kind enum would be
    false. The proposal's target_complexity block is carried verbatim below.

  source_target_complexity:
    note: >-
      Carried VERBATIM from IDEA-20260815-284aff.
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is batch rho solves across batch sizes.
    memory_exponent: >-
      The shared distinguished-point table, which is the term being
      charged and grows with batch size.
    best_known: >-
      The incumbent is the classical multi-target amortization result,
      measured here with storage charged rather than improved.
    hidden_overhead: >-
      Table storage is the hidden term that makes large batches expensive
      and is precisely what citing sqrt(M) omits.
    tradeoff_note: >-
      Larger batches amortise better and cost more storage; the charged
      optimum is what a deployment or a comparison actually faces.

  heuristic_assumptions:
    - id: HEUR-BATCH-1
      source_id_in_proposal: HEUR-BATCH-1
      formal_statement: >-
        The sqrt(M) amortization factor is realised at batch sizes
        reachable in this experiment, with storage charged.
      random_model_justification: >-
        Carried verbatim from the parent proposal, including its own statement
        of the gap: 'Rigorous ingredient: the classical analysis of shared-walk
        collision search gives the factor for an idealised shared random walk
        with free storage. THE GAP: storage is not free and grows with the
        table, so the charged factor is necessarily worse than sqrt(M) and the
        question is only by how much at reachable sizes.'
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND CORRECT. The classical shared-walk analysis is RECALLED in the
        parent proposal and no agent in this program has opened the source, so
        AGENTS.md rule 9 forbids it from discharging this field. Stage 0 of the
        experiment reads what the committed corpus states and records it
        verbatim, which is the only route by which this field could later be
        filled.
      validation_experiment_ids: [EXP-ECDLP-7dba4b]
      falsification_condition: >-
        A realised factor materially worse than sqrt(M) once storage is
        charged.
      falsification_condition_operationalised: >-
        The proposal's condition is preserved verbatim above. It is made
        decidable by two additions attributed to the converting Coordinator.
        First, the UNCHARGED factor has a pre-registered band of plus or minus
        15 percent around sqrt(M) at each tested M, and that band is an
        instrument check rather than the hypothesis. Second, 'materially worse
        once storage is charged' is operationalised as the charged per-target
        cost failing to decrease monotonically in M over the tested range at a
        declared exchange rate; the rate at which that first happens is reported
        as the crossing rate. Without an exchange rate the phrase 'storage
        charged' has no numerical content at all, which is the gap this
        operationalisation closes.
      validation_plan_from_proposal: >-
        Carried verbatim: 'SAMPLE: >= 4 batch sizes x >= 20 repetitions.
        COMPARISON: realised factor against sqrt(M), charged and uncharged,
        reported side by side. TAIL CHECK: the largest batch size, where storage
        bites hardest. TRANSFER: none beyond tested sizes and ratios.'

  structural_ingredients:
    - description: >-
        The sibling contract in this series that measures the single-target rho
        baseline and freezes the instance set. The parent proposal states
        explicitly that this record extends that one to batches and SHOULD SHARE
        ITS IMPLEMENTATION.
      citation: 'experiments/EXP-ECDLP-4320a7/specification.yaml'
      provenance: internal
      verified_by: TASK-20260904-35fbe5
      role: >-
        Declared dependency. Its measured single-target constant is this
        record's NULL 1 reference value, and its instance set and charging
        convention are inherited so that batch-size-one genuinely reproduces the
        baseline rather than approximating it.
    - description: >-
        A draft contract under a DIFFERENT goal and question whose primary
        metrics include 'total and per-target group operations per arm per M',
        'peak store size in entries and bytes, per arm' and 'fitted exponent of
        M with confidence interval, per arm', whose controls include matched
        single-target rho at M equal to 1 and a randomly populated store, and
        whose success criterion is a fitted exponent of 0.50 plus or minus 0.05
        over M in 1 to 32 at toy scale.
      citation: 'experiments/EXP-MTGT-d4f8cd/specification.yaml'
      provenance: internal
      verified_by: TASK-20260904-35fbe5
      role: >-
        SUBSTANTIAL OVERLAP, FOUND DURING CONVERSION AND RECORDED RATHER THAN
        RESOLVED. That contract's same-curve multi-target arm is an instrument
        calibration for an isogeny-transport comparison, not its object; this
        record's object IS the charged multi-target cost. But the uncharged
        fitted exponent would be measured twice if both ran. Which contract owns
        that measurement is a Coordinator decision across two goals and is NOT
        made here. Stage 0 of the experiment reads it and reuses any completed
        result rather than re-measuring.
    - description: >-
        The classical analysis of shared-walk collision search giving the
        sqrt(M) total-cost factor for an idealised shared random walk with free
        storage, and the distinguished-point practice it is implemented with.
      citation: 'classical; nearest corpus entries KN-TECH-001 and KN-LIT-013'
      provenance: recalled
      verified_by: null
      role: >-
        The uncharged prediction used as the instrument check. RECALLED and
        therefore a pointer for the reviewer rather than support; Stage 0 reads
        what the committed corpus entries state before the value is used.

  reduction_chain:
    core_problem: >-
      Produce, at one toy prime-order subgroup and batch sizes 1, 4, 16 and 64,
      the measured total and per-target cost of shared-table batch rho and of M
      independent solves on the same targets; the peak table occupancy, table
      bytes and peak resident memory per batch size; the uncharged realised
      amortization factor against sqrt(M); and the CHARGED per-target cost as a
      curve over a declared range of storage-to-computation exchange rates, with
      the crossing rate identified.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. A charged amortization number reduces to NOTHING on
      its own. It does not change any existing record's cost model, does not
      retire the sqrt(M) citation, and does not adjudicate any past comparison.
      If the charged factor falls materially short, the consequence -- that
      records charging multi-target effects at sqrt(M) overstate the attacker --
      is a Coordinator judgement requiring its own decision record and its own
      re-reading of the affected records.

  predictions:
    - metric: >-
        A1 -- batch-size-one null, total cost of the batch harness at M equal
        to 1 against the single-target baseline on the same instances
      direction: different
      minimum_effect: >-
        FORCED to reproduce the single-target baseline within 2 percent. Carried
        in force from the proposal. A batch harness that has lost the
        single-target case measures nothing.
    - metric: >-
        A2 -- no-sharing null, M independent solves with the shared table
        disabled
      direction: different
      minimum_effect: >-
        FORCED to cost M times the baseline within 10 percent. Carried verbatim
        in force from the proposal: 'anything less means unintended sharing'.
        This fails in the opposite direction from A1.
    - metric: >-
        A3 -- uncharged realised amortization factor against sqrt(M)
      direction: different
      minimum_effect: >-
        Within plus or minus 15 percent of sqrt(M) at each of M equal to 4, 16
        and 64. INSTRUMENT CHECK. Outside the band, the harness does not
        reproduce a classical result and no charged number from it is
        reportable.
    - metric: >-
        A4 -- peak table entries, table bytes and peak resident memory per batch
        size
      direction: higher
      minimum_effect: >-
        Strictly increasing in M. NO MAGNITUDE IS PRE-REGISTERED; the proposal
        supplies none and guessing one would launder an estimate into a
        prediction. What IS pre-registered is that all three are reported per
        cell and appear beside every operation count.
    - metric: >-
        A5 -- charged per-target cost as a function of M, at each declared
        exchange rate
      direction: lower
      minimum_effect: >-
        THE MEASUREMENT, AND NO VALUE IS PRE-REGISTERED. The pre-registered
        content is structural: the charged per-target cost either decreases
        monotonically in M across the tested range at a given rate, or it does
        not, and that binary is decidable per rate from the primary metrics.
    - metric: >-
        A6 -- crossing rate, the smallest declared exchange rate at which the
        charged per-target cost stops decreasing in M within the tested range
      direction: different
      minimum_effect: >-
        Reported as a value or as an explicit statement that no crossing occurs
        anywhere in the declared rate range. This is the scalar the contract
        exists to produce and it is meaningful in either form.
    - metric: >-
        A7 -- resolution-order statistics, the cost of the first-resolved target
        against the last-resolved
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED. Reported as a DIAGNOSTIC and never as a
        claim, because per-target order effects make the TOTAL the only
        defensible primary quantity.

  test_boundary:
    instances:
      - >-
        One toy prime-order subgroup at 24 bits, drawn from the frozen instance
        set of EXP-ECDLP-4320a7 with its recorded seed.
      - >-
        Target sets of size 1, 4, 16 and 64, each target a fresh uniform element
        of the subgroup with its own recorded scalar, never reused across
        targets or across batch sizes.
      - >-
        At least 20 independent repetitions per batch size, each with its own
        recorded seed.
    parameters:
      subgroup_bit_size: 24
      batch_sizes: [1, 4, 16, 64]
      repetitions_per_batch_size: 20
      arms: ['batch, one shared distinguished-point table with a per-step tag test against all M targets', 'independent, M separate walks with sharing disabled']
      distinguished_point_rate_theta: >-
        Frozen before execution and held identical across arms and batch sizes.
        A theta chosen after seeing an amortization factor is a tuned instrument.
      exchange_rate_range: >-
        Storage charged against computation at rates r spanning at least six
        orders of magnitude, declared as a fixed ladder before execution. r is
        in operation-equivalents per retained byte per unit of walk. NO SINGLE
        RATE IS PRIVILEGED and the charged result is a curve over the ladder.
      charging_formula: >-
        charged_total(M, r) = measured_group_operations(M) + r * integral of
        retained table bytes over the walk, approximated by peak table bytes
        times walk length as declared in the contract. The approximation and its
        direction of error are stated in the contract rather than chosen at
        analysis time.
      charging_convention: >-
        Group-operation equivalents for time, one point addition equal to one
        operation, tag tests charged at one operation per target per step;
        memory in peak resident bytes, table entries and table bytes. Identical
        to EXP-ECDLP-4320a7's convention.
    implementation: >-
      Batch rho with a shared distinguished-point table, built on the same walk
      and curve arithmetic as EXP-ECDLP-4320a7's rho harness so that batch size
      one is the same algorithm as the single-target baseline rather than a
      reimplementation of it. Python 3, with a compiled inner loop recorded if
      one is used. NO network access is required and none may be used.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 10
      maximum_memory_gb: 8
      maximum_runs: 40
      note: >-
        The independent-runs arm at M equal to 64 dominates: 64 full solves at
        24 bits, 20 times over, is on the order of 5 times 10^6 group operations
        per repetition set. The batch arm is cheaper by construction, which is
        the effect being measured.

  falsification_conditions:
    - >-
      F1 (A NULL MISBEHAVES) -- batch size one does not reproduce the
      single-target baseline, or the no-sharing arm costs materially less than M
      times the baseline. Carried verbatim in force from the proposal: harness
      wrong, results VOID. In particular a no-sharing arm that is too cheap
      means the harness is sharing something it should not, which would
      manufacture the very effect under study.
    - >-
      F2 (INSTRUMENT FAILS THE KNOWN ANSWER) -- the uncharged factor lies
      outside plus or minus 15 percent of sqrt(M). The harness does not
      reproduce the classical result and no charged number from it is
      reportable. C2 fails.
    - >-
      F3 (THE CLASSICAL FACTOR SURVIVES CHARGING) -- the charged per-target cost
      continues to decrease in M across the tested range at every declared rate,
      with no crossing anywhere in the ladder. Carried from the proposal: the
      classical factor holds at these sizes and the campaign's multi-target
      accounting is sound at this scope. C3 is REJECTED and that is a clean,
      valuable result reported as the headline.
    - >-
      F4 (THE FACTOR FALLS SHORT) -- the charged per-target cost decays strictly
      more slowly than the uncharged one at plausible rates. Carried from the
      proposal: the idealisation does not hold at deployable batch sizes, which
      changes how the effect should be charged. C3 is supported at the tested
      scope only.
    - >-
      F5 (THE MEMORY-BOUND OUTCOME) -- storage dominates before the factor is
      realised, i.e. the charged per-target cost stops decreasing or increases
      within the tested batch range at a plausible rate. Carried verbatim in
      force from the proposal as the MOST DECISION-RELEVANT POSSIBLE OUTCOME and
      reported as such.
    - >-
      F6 (CHARGING IMPOSSIBLE) -- the retained-bytes integral cannot be measured
      or reasonably approximated, so no charged number can be formed. The parent
      proposal's own conditional then fires: the amortization number is
      INCOMPLETE and the record says so plainly rather than reporting an
      uncharged number as if it were charged.
    - >-
      F7 (TAG TEST DOMINATES) -- the per-step tag test's share of total charged
      cost exceeds 50 percent at M equal to 64, so the measured factor is
      dominated by tag-test arithmetic rather than by the sharing effect. The
      measurement is then about this implementation's tag test and is scoped to
      it, not about multi-target amortization.
    - >-
      F8 (SUPERSEDED) -- Stage 0 finds a completed run, under EXP-MTGT-d4f8cd or
      elsewhere, already reporting the charged multi-target per-target cost with
      table storage accounted. The hypothesis is superseded and the run cites
      that record. Absence of a search result is not evidence that none exists,
      and this worktree cannot see unmerged branches.

  interpretation_limits:
    - >-
      MEASURES A CLASSICAL EFFECT'S REALISATION; PROPOSES NO NEW ALGORITHM. The
      parent proposal's own limit, preserved exactly.
    - >-
      SCOPED TO THE TESTED BATCH SIZES, PROBLEM SIZE AND STORAGE MODEL. One
      group size, four batch sizes, one theta, one table representation.
    - >-
      TOY BATCH-TO-GROUP RATIOS MAY NOT REPRESENT DEPLOYED ONES AND NO
      EXTRAPOLATION IS OFFERED. Carried verbatim from the proposal. A batch of
      64 against a 2^24 group is a ratio no deployment exhibits.
    - >-
      THE CHARGED NUMBER IS A FUNCTION OF THE EXCHANGE RATE, WHICH IS A CHOICE.
      No single charged per-target cost is the answer; the curve and the
      crossing rate are. Quoting one point on that curve as the result is out of
      contract.
    - >-
      AN UNCHARGED TABLE MAKES AMORTIZATION LOOK FREE, which is the direction
      that overstates the attacker. That is why memory appears beside every
      operation count and why the uncharged arm is labelled an instrument check.
    - >-
      A DISTINCTNESS CHECK AGAINST THE ALREADY-CONVERTED SIBLING PROPOSAL IS
      OUTSTANDING. IDEA-20260731-013 covers the multi-target rho baseline and is
      recorded as already converted, on an unmerged branch, as H-ECDLP-6c52c0.
      That record CANNOT BE READ FROM THIS WORKTREE, so whether the present
      hypothesis is genuinely distinct from it -- rather than a second purchase
      of one measurement -- has NOT been established. This is a real, open
      limitation and it must be resolved before this hypothesis is approved.
    - >-
      SUBSTANTIAL OVERLAP WITH A DRAFT CONTRACT UNDER ANOTHER GOAL.
      EXP-MTGT-d4f8cd already contracts the uncharged fitted exponent of M with
      peak store size per arm, at toy scale, as the calibration arm of an
      isogeny-transport comparison. The uncharged arm here would duplicate it.
      Which contract owns that measurement is a cross-goal Coordinator decision
      and is not made by this record.
    - >-
      NOVELTY. The parent proposal records novelty_status 'adaptation' on the
      ground that the sqrt(M) result is classical and the contribution is
      measuring its realisation with memory charged. That verdict is preserved
      and no external literature was consulted during conversion.

