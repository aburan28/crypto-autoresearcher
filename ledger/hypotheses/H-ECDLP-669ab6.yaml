  proposal_id: IDEA-20260817-230971
  title: >
    Stage 0 closed-form Minkowski
    identities — m-independence and
    |D|-level-set e=alpha/2 — before
    any lattice is reduced
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-db809a
  specified_by: DEC-20260913-cdc65a
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260817-230971
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form Minkowski-exponent
    identities of IDEA-20260817-230971
    before any curve-attached lattice is
    constructed or any SVP is run. Stage
    0 asserts only that on the frozen
    (m, alpha) grid the Minkowski ceiling
    e = (1/r) log_p det equals alpha/2
    independently of m in {1,2,3,4}, and
    that the level set |D|=p^alpha gives
    e in {1/2, 1/3, 1/4, 1/6} at alpha in
    {1, 2/3, 1/2, 1/3}. A nearby claim
    that Minkowski on a rank-4 Hom
    lattice yields e=1/3 is rejected.
    A dummy that lets e fall with m is
    rejected as a ladder. This is not a
    lattice audit and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260817-230971 tracks e(L) =
    log_p(lambda_1) on lattices attached
    to an ordinary prime-field curve.
    Stage 0 freezes the orthogonal-sum
    arithmetic that kills the M_m(O)
    rank escape: rank r=2 m^2, log_p det
    = m^2 * alpha, so (1/r) log_p det =
    alpha/2 for every m. No End(E) is
    computed. No SVP. No Semaev S_m.
    No DLP solve.
  predictions:
    - id: P-S0-MINEXP
      metric: closed-form Minkowski identities on the frozen grid
      direction: different
      minimum_effect: >
        After fixture_pass, REAL is
        m-independent at every frozen
        alpha and hits e=alpha/2 on
        the four level-set points. KF
        (Minkowski rank-4 gives e=1/3)
        is rejected. NULL e-falls-with-m
        is rejected as a ladder.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that Minkowski on rank 4 yields
        e=1/3 is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL fails
        m-independence or misses a
        level-set value. That falsifies
        only P-S0-MINEXP at the frozen
        arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL Minkowski-arithmetic panel
    parameters:
      real_grid:
        m: [1, 2, 3, 4]
        alpha: ['1', '2/3', '1/2', '1/3']
        formula: e = alpha/2
        expected_e: ['1/2', '1/3', '1/4', '1/6']
        must_m_independent: true
        must_level_set: true
      known_false:
        kind: minkowski_rank4_gives_one_third
        claimed_e: '1/3'
        minkowski_e: '1/2'
        must_reject: true
      matched_null:
        kind: e_decreases_with_m
        dummy_formula: e = 1/(2*m)
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-1eea0b Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Exact rational arithmetic only.
      No lattice is built. No SVP. No
      curve. The formula e=alpha/2 is
      the proposal's own identity, not
      a measured exponent.
  assumptions:
    - id: A1
      statement: >
        The frozen formula is
        e = (1/r) log_p det = alpha/2
        with r=2 m^2 and |D|=p^alpha.
        Stage 0 does not reduce a
        lattice and does not solve a
        DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether the Minkowski ceiling is
      m-independent and equals alpha/2
      on the frozen level set.
    baseline_embedding:
      parameter_slice: >
        The REAL (m, alpha) grid, KF
        rank-4-gives-1/3 claim, and
        NULL e-falls-with-m dummy.
        Disclosed tightening:
        arithmetic calibrator only,
        not the proposal's L1-L7 SVP
        panel.
      reproduction_check: >
        REAL m-independent; level set
        {1/2,1/3,1/4,1/6}. KF
        rejected. NULL rejected.
    observation_collision:
      observable: Minkowski ceiling as a function of m and alpha
      distinct_preimage_search: >
        Hold alpha and let e fall
        with m (NULL). Hold rank 4
        and claim Minkowski gives
        e=1/3 (KF).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen (m, alpha) Minkowski table.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed attack improvement.
    quantifier_order: >
      Freeze the formula and grid
      before reading the table.
      Existential equality at one
      (m, alpha) is not an SVP
      measurement.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        arithmetic. Never a lattice
        audit. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is an m-dependent dummy
        exponent. An argument that
        still calls it a Minkowski
        ceiling is proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-MINEXP only. Not an
    SVP. Not End(E). Not M_m(O)
    reduction. Not Semaev S_m. Not
