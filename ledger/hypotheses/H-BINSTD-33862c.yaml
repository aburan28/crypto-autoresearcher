# H-BINSTD-33862c
# Integer certificate for IDEA-20260922-c07598 claim (A)-(B).
# Does not settle Aut(E). Approval: DEC-20261001-0bf8ad.
hypothesis:
  id: H-BINSTD-33862c
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-c07598
  experiment_id: EXP-BINSTD-de887b
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-0bf8ad
  title: >-
    On the five composite-degree ANSI curves the Frobenius eigenvalue has
    order k and the base-2 Frobenius is not an endomorphism, so the
    rho-symmetry divisor certified here is 2k rather than 32k.
  statement: >-
    Let q = 2^16. For each curve c2pnb176v1, c2pnb208w1, c2pnb272w1,
    c2pnb304w1, c2pnb368w1, parse the published order r and cofactor h.
    Set t = q + 1 - h. If r is an odd prime, the congruence
    X^2 - t X + q ≡ 0 (mod r) has a root mu with mu ≠ 1 and mu^k ≡ 1 (mod r),
    where k = m/16. The integer B is not in {0, 1}. The certificate records
    the Frobenius-and-negation divisor 2k and rejects 32k. It does not assert
    that the full automorphism group of E has order 2k.
  mechanism: >-
    The q-power Frobenius is an endomorphism because the coefficients lie in
    F_q, and on a subgroup of prime order r it acts by a root of the
    characteristic polynomial. k prime leaves only the orders 1 and k, and
    mu = 1 would put G inside E(F_q). The base-2 Frobenius fixes the equation
    only when A and B lie in F_2. B outside {0, 1} blocks that. Negation has
    order 2 and is not that Frobenius.
  assumptions: []
  proof_search_map:
    bottleneck: >-
      A square root of t^2 - 4q modulo the published prime r, and the check
      mu^k ≡ 1 (mod r).
    baseline_embedding:
      parameter_slice: >-
        Audit cofactors 65390, 65096, 65286, 65070, 65392 and traces 147, 441,
        251, 467, 145, read from analysis/binstd-curve-audit/audit-certificate.txt
        on 2026-10-01.
      reproduction_check: >-
        Parsed h equals q + 1 - t for those traces before the quadratic is solved.
    observation_collision:
      observable: existence of a root of order k, and B not in {0, 1}.
      distinct_preimage_search: >-
        One implementation takes one square root. The other takes the other
        sign. Both must find a root of order k. sect163k1, whose B is 1, must
        not be classified as "B outside F_2".
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The five published orders and the control sect163k1.
        predicted_gain: An integer divisor. No attack exponent moves.
    quantifier_order: >-
      For every one of the five curves, after r and h are parsed, r is prime
      and some root mu of X^2 - t X + q modulo r satisfies mu^k = 1 and
      mu ≠ 1. Separately, sect163k1 has B in {0, 1}.
    method_ceiling:
      strongest_certifiable_claim: >-
        The eigenvalue order is k and the base-2 Frobenius does not fix B.
        The divisor 2k is the order of the group generated by that eigenvalue
        action and negation, conditional on r prime. Full Aut(E) stays open.
      nearby_object_control: >-
        sect163k1 has B = 1. An implementation that reports B outside F_2 for
        that curve is invalid.
    proof_obligations:
      - claim: h = q + 1 - t matches the audit cofactors.
        responsibility: baseline
      - claim: A root mu of order k exists modulo prime r.
        responsibility: correctness
      - claim: B is outside {0, 1} on the five rows and inside it on sect163k1.
        responsibility: scope
      - claim: The certificate does not settle Aut(E).
        responsibility: scope
    not_applicable_reason: null
