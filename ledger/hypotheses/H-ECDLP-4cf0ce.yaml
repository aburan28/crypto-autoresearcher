  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-5707b9
  title: >-
    The bound (P*T + T*T + 1)/n equals 1/101 at P = T = 0, equals 1 at
    P = 0 and T = 10, and equals 16/101 at P = 2 and T = 3, all with n = 101.
  statement: >-
    For n = 101, the rational (P*T + T*T + 1)/n is 1/101 when P = T = 0,
    is 101/101 when P = 0 and T = 10, and is 16/101 when P = 2 and T = 3.
    A claimed success probability of 1 at P = T = 0 is strictly above 1/101
    and is labeled above_floor.
  mechanism: >-
    The proposal writes a success-probability ceiling linear in P*T and
    T*T. This contract evaluates that ceiling on three cells. It does not
    sample a generic group.
  assumptions: []
  proof_search_map:
    bottleneck: Three evaluations of one rational expression.
    baseline_embedding:
      parameter_slice: >-
        The displayed bound in IDEA-20260920-a92b0f, read 2026-10-01.
        The three fractions were reduced by hand. That reduction is not a run.
      reproduction_check: >-
        One implementation uses fractions. The other uses integer numerators.
        They must agree on all three cells.
    observation_collision:
      observable: The three reduced fractions and the above_floor label.
      distinct_preimage_search: >-
        A claimed success of 1 with zero queries must be above the floor.
        Labeling it inside the bound invalidates the run.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Three (P, T) cells at n = 101.
        predicted_gain: Three rationals. No attack cost.
    quantifier_order: >-
      For these three fixed cells, the reduced value of the bound is the
      preregistered fraction.
    method_ceiling:
      strongest_certifiable_claim: >-
        The arithmetic of the written bound. Not a proof in the generic
        group model and not a simulation.
      nearby_object_control: >-
        Success 1 at P = T = 0. It sits above the floor.
    proof_obligations:
      - claim: The three cells match 1/101, 1, and 16/101.
        responsibility: correctness
      - claim: Success 1 at zero queries is above_floor.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
