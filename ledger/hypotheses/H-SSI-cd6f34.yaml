hypothesis:
  id: H-SSI-cd6f34
  question_id: RQ-SSI-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260803-48e258
  statement: >-
    The committed BATCH-002/003 uncertainty is BADLY CONDITIONED FOR A MARGIN AND WELL
    CONDITIONED FOR A CROSSING. Concretely, two claims that can each fail independently.
    (S1) LOCUS. Let p*(w) be the prime size at which the corrected p^(1/3+o(1)) cost curve
    of the assessed supersingular-isogeny method crosses the matched Delfs-Galbraith /
    van Oorschot-Wiener middle-memory baseline at available memory w. Then p*(w) > 2^512
    for every w <= 2^40, under EVERY one of the eighteen committed measured-gamma readings
    and under BOTH values of the two-valued batched-evaluation scenario L4.
    (S2) RECONDITIONING. The width of the p*(w) band, expressed in log2(p) and divided by
    its own central value, is STRICTLY SMALLER than the width of the committed margin band
    divided by the committed margin, both evaluated at the matched point w = 2^30 and the
    NIST-I prime. S2 is the load-bearing claim: if it fails, the curve buys nothing over
    the scalar and the whole rearrangement is worthless even if S1 holds.
    Every emitted object inherits, unchanged and on its face, Heuristic 1 of the assessed
    method, which this hypothesis does NOT validate and does not substitute for.
  mechanism: >-
    The two compared costs scale differently in p, one as p^(1/3+o(1)) with a large measured
    per-entry overhead and one as p^(1/2) with a memory-dependent van Oorschot-Wiener
    constant, so their ratio is monotone in p and its zero crossing is a well-defined
    function of w. A margin evaluated at one p inherits the FULL width of the overhead
    uncertainty. A crossing point inherits only how fast the ratio moves through zero, which
    is governed by the DIFFERENCE of the two exponents, about 1/6. That difference is the
    entire mechanism, and it is why a band that is unusable as a magnitude can be usable as
    a location. The L4 batched-evaluation term, which has never been implemented and which
    removes a large but uncertain part of the corrected overhead, is carried as TWO CURVES
    rather than as one point, so that if both curves satisfy S1 the L4 ambiguity is
    discharged for this question without building the implementation.
  assumptions:
  - >-
    Every input is a COMMITTED number, read at run time out of the committed evidence and
    goal records, or a constant transcribed from a primary source with a quoted excerpt and
    a hash. The numeric values recited in the parent proposal IDEA-20260803-48e258 are
    TRANSCRIPTIONS and are not authority; the executor re-reads each from its committed
    source and reports any disagreement as a defect of the parent record rather than
    silently adopting either value.
  - >-
    The constant c is used ONLY as its committed bracket with its mandatory attachments,
    never as a point value. The prohibition recorded in DEC-20260802-48c72c on citing a
    point value for c binds here without exception.
  - >-
    Any evaluation at a (p, w) outside a fitted window is UNDEFINED and is drawn as a gap.
    It is never extrapolated. This is a contract obligation, not a reviewer's vigilance.
  - >-
    The o(1) in p^(1/3+o(1)) is NOT a constant and the curve treats it as one over the
    plotted range. This is the largest modelling gap, it is exactly the kind of term a
    crossover locus is sensitive to at large p, and it must be printed on the curve.
  - >-
    The eighteen gamma readings share the same acquired ell set and the same two
    implementations. Their spread is NOT a confidence interval and may never be reported as
    one.
  - >-
    The low end of the committed c bracket is the OPTIMISTIC end, not the conservative one,
    because one of the two seam-free exponents is a transient of the unimproved shared
    reduction. This binds against the program's own convenience.
  proof_search_map:
    not_applicable_reason: >-
      Not proof-oriented. No theorem, bound, certificate hierarchy, reduction or closure
      argument is proposed. The deliverable is a cost-model rearrangement of already
      committed measurements into a locus, and its correctness obligations are arithmetic
      reproduction (the known-answer gate) and window discipline (the fitted-window guard),
      both of which are discharged as controls in EXP-SSI-ad4f9b rather than as lemmas.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. No new attack is proposed, no exponent is claimed to move, and
    no cost is reduced. The underlying exponents p^(1/3+o(1)) and p^(1/2) are taken from the
    committed record and are inputs, not outputs. A crossover in an asymptotic cost model is
    not a crossover in practice.
  heuristic_assumptions:
  - id: HEUR-XO-1
    formal_statement: >-
      For all ell and all p in the ranges at which the crossover is evaluated, the measured
      per-entry overhead law, fitted over the committed ell window at a single committed
      p scale, extends with the SAME exponent and the SAME ell-independent structural
      prefactor.
    random_model_justification: >-
      Not a randomness heuristic. It is a uniformity-of-fit assumption. The prefactor was
      found ell-independent and structural in the committed measurement, which supports the
      ell direction. The p direction is NOT supported by any committed measurement, since
      the fit sits at a single p scale.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      A committed measurement of the p-scaling exponent at larger ell that disagrees with
      the fitted exponent. Under this hypothesis the curve is NOT evaluated outside its
      fitted window at all; out-of-window points are emitted as undefined segments, so this
      heuristic is contained rather than relied on.
  - id: HEUR-XO-2
    formal_statement: >-
      The van Oorschot-Wiener middle-memory Delfs-Galbraith baseline is correctly charged at
      every plotted w, including its collision-detection and memory-access costs, with a
      baseline constant k transcribed from a primary source.
    random_model_justification: >-
      Not a randomness heuristic. It is a transcription-fidelity assumption about a published
      cost model.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      The bibliographic transcription cannot be executed, or returns a constant inconsistent
      with the value the baseline has been charged at. In that branch only the RATIO-form
      curve is emitted, the absolute locus is reported UNRUN, and S1 is NOT evaluated.
  structural_ingredients:
  - description: >-
      The Delfs-Galbraith p^(1/2) baseline and the van Oorschot-Wiener middle-memory
      time-memory tradeoff, with their constants, as the matched comparison this hypothesis
      crosses against.
    citation: >-
      Named in the objective of GOAL-P13-001 and in the campaign's frozen bibliography; the
      exact constants are NOT held in this repository and must be transcribed with quoted
      excerpts and hashes before the absolute locus is emitted.
    provenance: recalled
    verified_by: null
    role: baseline cost model and its memory-dependent constant
  predictions:
  - metric: >-
      crossover_locus_lower_bound - min over the eighteen readings and both L4 scenarios of
      log2 p*(w), for w in {2^20, 2^25, 2^30, 2^35, 2^40}
    direction: higher
    minimum_effect: >-
      Strictly greater than 512 at every w and every admissible reading. A single admissible
      reading at or below 512 falsifies S1 and IS the campaign's concrete-threat finding.
  - metric: >-
      band_ratio - (width of the log2 p* band at w = 2^30, divided by the central log2 p*)
      divided by (width of the committed margin band, divided by the committed margin)
    direction: lower
    minimum_effect: >-
      Strictly below 1.0. A value at or above 1.0 falsifies S2, the reconditioning claim is
      wrong, and the negative is the honest deliverable.
  - metric: >-
      known_answer_gate_residual - for each of the eighteen readings, whether the curve
      machinery evaluated at w = 2^30 and the NIST-I prime returns a margin inside the
      committed BATCH-003 band
    direction: different
    minimum_effect: >-
      Eighteen of eighteen inside the committed band. Fewer than eighteen voids everything
      downstream; a curve that cannot reproduce the point it generalizes is void.
  - metric: >-
      null_baseline_displacement - the shift in log2 p*(2^30) when the corrected overhead is
      replaced by the source's original one-operation-per-entry convention
    direction: different
    minimum_effect: >-
      At least the magnitude implied by the measured overhead. A locus that barely moves
      means the corrected overhead is not driving the result and the record must be
      re-described.
  - metric: >-
      L4_scenario_separation - whether both L4 curves independently satisfy S1
    direction: different
    minimum_effect: >-
      Reported as JOINT or SPLIT. Joint discharges the L4 ambiguity for this question with
      no implementation built; split leaves the ambiguity standing and is reported as such.
  test_boundary:
    instances:
    - >-
      The NIST-I, NIST-III and NIST-V supersingular-isogeny parameter sets as named in the
      campaign's committed goal record, plus the synthetic prime ladder used to trace the
      locus.
    - >-
      Exactly the eighteen committed measured-gamma readings and the committed c bracket; no
      new gamma is acquired and no new measurement is made.
    parameters:
      memory_axis: 'w in {2^20, 2^25, 2^30, 2^35, 2^40}'
      readings: 'eighteen committed measured-gamma readings'
      l4_scenarios: 'two, at the committed low and high extremes of the batched-evaluation term'
      known_answer_point: 'w = 2^30 at the NIST-I prime'
    implementation: >-
      Pure arithmetic on committed numbers in standard-library Python plus a plotting/table
      writer. No solver, no isogeny computation, no field arithmetic, no seeds beyond the
      frozen input files. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 1.0
      maximum_memory_gb: 4
      maximum_runs: 6
  distinguishable_outcomes:
  - >-
    O1 (S1 HOLDS AND S2 HOLDS). Known-answer gate passes eighteen of eighteen, p*(w) > 2^512
    at every w <= 2^40 under every reading and both L4 scenarios, and band_ratio < 1.0.
    MEANING - the assessed method is asymptotically real and concretely irrelevant across the
    whole deployed memory range, stated as a curve with a pre-registered bound that could
    have failed. This is strictly stronger than the current INCONCLUSIVE margin and it
    discharges the L4 ambiguity without building the batched implementation.
  - >-
    O2 (S1 FAILS). Some admissible reading puts p*(w) at or below 2^512 for some w <= 2^40.
    MEANING - the campaign has the concrete threat finding it has been unable to reach, and
    it was reached by rearranging committed numbers rather than by new measurement. This
    outcome is escalated for independent review before any interpretation, and it is
    reported with the reading and the L4 scenario that produced it named.
  - >-
    O3 (S2 FAILS). band_ratio >= 1.0. MEANING - the reconditioning argument is WRONG. The
    crossover band is proportionally no narrower than the margin band, the curve buys nothing
    over the scalar, and the correct deliverable is that negative. This outcome does not
    depend on S1 and can occur together with O1's locus values.
  - >-
    O4 (MACHINERY VOID). The known-answer gate does not reproduce the committed margin band
    for all eighteen readings. MEANING - the curve machinery is wrong; no locus, no band and
    no scenario comparison is emitted, and the defect is the deliverable.
  - >-
    O5 (BIBLIOGRAPHY UNREACHABLE). The baseline constant k cannot be transcribed from a
    primary source. MEANING - only the ratio-form curve is emitted, the absolute locus is
    reported UNRUN under AGENTS.md rule 5, and S1 is NOT evaluated. This is an infrastructure
    outcome, never a negative mathematical result, and it does not weaken the assessed
    method in either direction.
  - >-
    O6 (OVERHEAD NOT LOAD-BEARING). The null-baseline control shows the crossover barely
    moves when the corrected overhead is replaced by the original convention. MEANING - the
    corrected overhead is not driving the locus, the BATCH-002/003 contribution is not doing
    the work claimed for it here, and the record must be re-described rather than defended.
  falsification_conditions:
  - >-
    band_ratio >= 1.0 - S2 is false and the reconditioning claim is refuted.
  - >-
    Any admissible reading puts p*(w) at or below 2^512 for w <= 2^40 - S1 is false.
  - >-
    The known-answer gate misses the committed margin band on any reading - the machinery is
    void and nothing is emitted.
  - >-
    Any curve segment is drawn through a region where a required input is outside its fitted
    window without being marked UNDEFINED - the contract's central discipline is broken and
    the run is invalid.
  interpretation_limits:
  - >-
    CONDITIONAL ON HEURISTIC 1 OF THE ASSESSED METHOD, which remains unvalidated. This
    hypothesis does not validate it, does not reduce the need for its pairing with a
    validation experiment, and inherits the condition exactly.
  - >-
    A crossover above the deployed range is a statement about a MODEL, not a security proof
    for any parameter set. The concrete-threat question for NIST-I remains INCONCLUSIVE
    unless S1 fails.
  - >-
    Implementation constants, parallelism and memory hierarchy are outside the model
    entirely. A crossover in an asymptotic cost model is not a crossover in practice.
  - >-
    Claim tier at most medium, matching the inputs, and only for segments inside fitted
    windows with the bibliographic constants transcribed.
  - >-
    NIST-III and NIST-V retain comfortable margins under every committed scenario and are
    not re-examined by this hypothesis.
  prior_evidence_refs:
  - EV-WESO-001
  - EV-PEC-2e67ff
  - EV-PEC-857664
  - DEC-20260802-48c72c
  - GOAL-P13-001
  status: proposed
  proposed_by: coordinator
  owner: coordinator
