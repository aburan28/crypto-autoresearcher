# =============================================================================
# H-BINSTD-e241a8 -- HOLD-N-corrected prime-degree / primitive-prime null
# ladder for RQ-BINSTD-b6f698 (triangulated c2pnb vs null toy pairs).
# Specified from IDEA-20260922-9e5383 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-f340fd.
#
# ZERO RUNS in this design packet. Incorporates HOLD-N / review corrections
# from analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9e5383.yaml:
# null precondition is ord_n(2)=n-1 (primitive prime), NOT "prime degree";
# replace n=31 arms; do not treat n=41 as a "poor" null; primary cell
# (d,k)=(2,17) vs n=37. No AUXIN. No Bedrock. Unlocks the lane's mandated
# null-object protocol for composite c2pnb rows.
# =============================================================================
hypothesis:
  id: H-BINSTD-e241a8
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-9e5383
  experiment_id: EXP-BINSTD-a66f64
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-f340fd
  status: approved
  proposed_by: coordinator
  title: >-
    A HOLD-N-corrected toy ladder preserving each deployed c2pnb-to-nearest-
    c2tnb field-size ratio at dk<=41, with null arms restricted to primitive
    primes (ord_n(2)=n-1), yields a WDSat conflict-ratio differential that
    attributes Frobenius-stable-subspace search effects to stability rather
    than field size

  statement: >-
    CLAIM (null-object protocol + differential measurement). RQ-BINSTD-b6f698
    mandates the prime-degree c2tnb curves as the nearby-object control for
    composite c2pnb rows, but deployed field sizes do not match (gaps up to
    87 bits). HYPOTHESIS (HOLD-N corrected): (A) a toy ladder with composite
    arms (d|16-ish, k prime, dk<=41) and NULL arms restricted to PRIMITIVE
    primes (ord_n(2)=n-1, so f=2 and only trivial Frobenius-stable subspaces)
    preserves each deployed c2pnb/c2tnb field-size RATIO with disclosed
    matching error; (B) on the primary cell (d,k)=(2,17) vs n=37, the WDSat
    conflict ratio of certified-UNSAT PDPs over the richest tau-stable
    F_4-subspace of the composite arm, against the orbit-naive null
    2^{ml}/m!, is attributable to Frobenius stability iff the within-curve
    non-stable control sits near 1 and the null arm verifies f=2; (C)
    ord_17(4)=4 yields f=5 and 32 stable subspaces — the richest reachable
    proxy. CORRECTED relative to the idea: "prime degree" does NOT imply
    no nontrivial stable subspace (ord_31(2)=5 gives f=7, 128 subspaces);
    every null arm must satisfy ord_n(2)=n-1. CLAIM TIER: toy measurement +
    structural census. NO attack. NO exponent. NO break.

  mechanism: >-
    NO NEW TRACKED OBJECT relative to IDEA-20260922-6cf862's Frobenius-stable
    F_{2^d}-subspace representation and IDEA-20260920-b9f0c5's WDSat
    conflict-ratio instrument. WHAT IS NEW after HOLD-N: (i) restate the
    null precondition as ord_n(2)=n-1 (primitive prime), not prime degree;
    (ii) freeze a corrected five-pair ladder with disclosed ratio errors and
    no n=31 null arms; (iii) primary cell (2,17)/n=37 with Stage-4 f=2
    verification on the null; (iv) within-curve non-stable control plus d=1
    cross-check against EXP-FROB-30006a / H-FROB-a5bf86. Charged stage:
    relation-search system count (WDSat conflicts on certified-UNSAT PDPs).

  assumptions:
    - >-
      Stable F_2-subspaces of F_{2^n} are the F_2[x]/(x^n-1)-submodules,
      counted by 2^f with f = 1 + (n-1)/ord_n(2); nontrivial intermediate
      dimensions vanish iff ord_n(2)=n-1.
    - >-
      The idea's n=31 null arms are DISQUALIFIED (ord_31(2)=5, f=7). Corrected
      nulls use primitive primes (n=29, 37, 53 as needed).
    - >-
      Primary cell null n=37 has ord_37(2)=36=n-1 (HOLD-N verified); composite
      (d,k)=(2,17) has ord_17(4)=4, f=5, 32 stable subspaces.
    - >-
      WDSat conflict-ratio instrument is reused from IDEA-20260920-b9f0c5 /
      EXP-FROB-30006a at base field F_4 for the composite arm; if WDSat is
      unavailable, Stages 0 and 4 still ship as structural deliverables and
      Stages 2-3 stop as O-INSTRUMENT.
    - >-
      Ratio-matching errors on the five-pair ladder are disclosed, not hidden;
      triangulation at dk<=41 cannot match all five deployed ratios exactly.
    - >-
      No Magma/Sage/AUXIN/Bedrock required; stdlib + existing CERTBIN/FROB
      Python preferred.

  proof_search_map:
    bottleneck: >-
      Whether a toy differential (composite-arm stable WDSat ratio vs
      primitive-prime null with verified f=2) can attribute any search-step
      pruning to Frobenius stability rather than field size, after correcting
      the idea's false "prime ⇒ no stable subspace" claim. Decidable by:
      Stage-0 corrected ladder arithmetic; Stage-4 null lattice census;
      Stages 2-3 WDSat ratios with within-curve non-stable control.
    baseline_embedding:
      parameter_slice: >-
        Incumbent = idea as written (n=31 null arms; "prime degree" null
        justification). Degenerate case of THIS corrected proposal: run the
        ladder with n=31 and report f=7 as if it were a precondition-absent
        null (HOLD-N artifact tell).
      reproduction_check: >-
        Zero-compute Stage 0: reproduce field-size gaps/ratios from audited
        degrees; recompute ord_17(4)=4, f=5, 32 subspaces; recompute
        ord_31(2)=5 (f=7, DISQUALIFY), ord_37(2)=36 (f=2, ACCEPT),
        ord_29(2)=28 (f=2, ACCEPT), ord_41(2)=20 (f=3, not a poor null).
        Any mismatch is O-TRANSCRIPTION.
    observation_collision:
      observable: >-
        "Composite-arm WDSat conflict ratio ≪ 1 means Frobenius stability
        helps the solving step."
      distinct_preimage_search: >-
        Colliding preimages without this contract: (i) field-size confound
        (mismatched degrees); (ii) mis-specified null with nontrivial lattice
        (n=31); (iii) within-curve non-stable subspace ALSO prunes (not
        stability-specific); (iv) genuine stability-driven pruning. Identifying
        tuple after this contract: (corrected_ladder, null_f, stable_ratio,
        non_stable_control_ratio, d1_crosscheck).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Corrected five-pair toy ladder + primary (2,17)/n=37 differential
          with primitive-prime null and within-curve non-stable control.
        predicted_gain: >-
          Instantiates RQ-BINSTD's mandated null-object protocol at executable
          scale without the HOLD-N false precondition; unlocks a stability-
          attributed search-step reading (positive or negative).
    quantifier_order: >-
      FOR each of five deployed c2pnb/c2tnb pairs: EXISTS a toy (d,k)/n cell
      with disclosed ratio error and null arm with ord_n(2)=n-1. FOR the
      primary cell: EXISTS WDSat conflict ratios on stable and non-stable
      arms OR O-INSTRUMENT; EXISTS Stage-4 proof that null f=2. NOT claimed:
      deployed-scale attack; that every prime-degree curve is a null;
      ECC2K-130 break (ECC2K-130 IS a valid primitive-prime null structurally,
      but this contract does not run it).
    method_ceiling:
      strongest_certifiable_claim: >-
        Corrected ladder arithmetic + primary-cell Stage-4 null census +
        WDSat stable vs non-stable ratios (or named instrument stop) decide
        whether Frobenius stability reaches the solving step at the richest
        reachable toy proxy.
      nearby_object_control: >-
        Within-curve size-matched non-stable F_4-subspace; primitive-prime
        null with verified f=2; disqualify any n=31 "null"; d=1 cross-check
        vs EXP-FROB-30006a.
    proof_obligations:
      - claim: >-
          Null arms satisfy ord_n(2)=n-1 (f=2); n=31 is never used as a null.
        responsibility: correctness
      - claim: >-
          Stage-0 gap/ratio table and ord_17(4)=4 lattice census reproduce
          from audited degrees / hand arithmetic.
        responsibility: correctness
      - claim: >-
          Within-curve non-stable control separates stability from incidental
          curve arithmetic before any positive attribution.
        responsibility: confound
      - claim: >-
          No ECDLP break / exponent / deployed-security claim from toy ratios.
        responsibility: scope

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Toy differential / structural census only; no complexity claim on ECDLP.

  heuristic_assumptions:
    - id: HEUR-BINSTD-9e5383-H1
      formal_statement: >-
        At the primary toy cell (d,k)=(2,17), WDSat conflict counts on
        certified-UNSAT PDPs over a Frobenius-stable F_4-subspace of
        dimension l, divided by 2^{m l}/m!, behave as in IDEA-20260920-b9f0c5:
        ratio within ~1% of 1 means basis-blind; ratio <=0.5 means material
        pruning attributable to stability only if the within-curve non-stable
        control stays near 1.
      random_model_justification: >-
        Inherits b9f0c5 / EXP-FROB-30006a's orbit-naive null model. No new
        distribution theorem claimed. HOLD-N corrects only the null-arm
        object identity.
      supporting_results:
        - IDEA-20260920-b9f0c5 (internal; WDSat conflict-ratio instrument)
        - H-FROB-a5bf86 / EXP-FROB-30006a (internal; d=1 design)
        - IDEA-20260918-9abf42 (internal; 2^f stable-subspace count)
        - IDEA-20260922-6cf862 (internal; F_{2^d} generalisation)
      validation_experiment_ids:
        - EXP-BINSTD-a66f64
      falsification_condition: >-
        A null arm with f>2 is reported as precondition-absent; OR a
        material stable-arm pruning (<=0.5) that the non-stable control also
        shows (stability attribution fails); OR Stage-0 arithmetic fails
        reproduction (O-TRANSCRIPTION).

  structural_ingredients:
    - description: HOLD-N review corrections and concrete primary-cell experiment.
      citation: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9e5383.yaml
      provenance: internal
      verified_by: coordinator (read in full 2026-10-02)
      role: defect list baked into this contract
    - description: WDSat conflict-ratio instrument (d=1 prior).
      citation: IDEA-20260920-b9f0c5
      provenance: internal
      verified_by: coordinator (proposal path exists; EXP-FROB-30006a approved)
      role: ratio instrument reused at F_4
    - description: Approved d=1 FROB experiment for cross-check.
      citation: EXP-FROB-30006a
      provenance: internal
      verified_by: coordinator (experiments/EXP-FROB-30006a/specification.yaml exists)
      role: Stage-3 d=1 cross-check source
    - description: F_{2^d} Frobenius-stable subspace object.
      citation: IDEA-20260922-6cf862
      provenance: internal
      verified_by: coordinator (sibling BINSTD design / idea on main)
      role: composite-arm object
    - description: Closed-form stable-subspace count 2^f.
      citation: IDEA-20260918-9abf42
      provenance: internal
      verified_by: coordinator (cited via idea + HOLD-N re-derivation)
      role: lattice census formula
    - description: CERTBIN gf2n/curve Python for toy field/curve arithmetic.
      citation: EXP-CERTBIN-e94b27
      provenance: internal
      verified_by: coordinator (impl/gf2n.py and impl/curve.py exist)
      role: Stage 1-2 arithmetic host

  reduction_chain:
    core_problem: >-
      Instantiate RQ-BINSTD's mandated c2tnb null-object protocol at toy scale
      without a false "prime ⇒ no stable subspace" precondition.
    corollaries:
      - problem: >-
          Decide whether Frobenius stability reaches the solving step on the
          richest reachable composite toy proxy, with a verified
          precondition-absent null.
        reduction_ref: IDEA-20260922-9e5383 + HOLD-N
        asymptotics_preserved: n/a (toy differential)

  predictions:
    - metric: null_arm_f_factors
      direction: lower
      minimum_effect: >-
        FORCED f=2 on every accepted null arm (ord_n(2)=n-1); f=7 on n=31
        is the Stage-0/4 artifact tell that disqualifies that arm
    - metric: composite_ord_17_4_census
      direction: different
      minimum_effect: >-
        ord_17(4)=4, f=5, 32 stable subspaces; dimension set includes
        {0,1,4,5,8,9,12,13,16,17}
    - metric: wdsat_conflict_ratio_composite_arm
      direction: different
      minimum_effect: >-
        Two non-overlapping bands vs 2^{ml}/m!: within ~1% of 1 (basis-blind)
        OR <=0.5 (material pruning); report which band
    - metric: within_curve_non_stable_control_ratio
      direction: higher
      minimum_effect: >-
        Must sit near 1 (or clearly above the stable arm) before attributing
        any stable-arm pruning to stability

  test_boundary:
    instances:
      - stage0_arithmetic: >-
          Corrected five-pair gap/ratio table; ord_n(2) census for
          {17,29,31,37,41,53}; ord_17(4)=4 lattice
      - primary_composite: >-
          E/F_4 over F_{4^17}=F_{2^34}, (d,k)=(2,17); richest stable
          F_4-subspace; m=2; l from admissible dims {4,5,8,9,...}
      - primary_null: 'n=37 primitive prime (ord_37(2)=36); Stage-4 f=2 check'
      - within_curve_control: 'size-matched random non-stable F_4-subspace'
      - d1_crosscheck: 'EXP-FROB-30006a / H-FROB-a5bf86 filed d=1 reading'
    parameters:
      primary_dk: [2, 17]
      primary_null_n: 37
      arity_m: 2
      wdsat_basis_blind_tol: 0.01
      wdsat_material_pruning: 0.5
      min_unsat_targets: 3
      corrected_null_rule: 'ord_n(2)=n-1'
      disqualified_null_example: {n: 31, ord: 5, f: 7}
    implementation: >-
      experiments/EXP-BINSTD-a66f64/implementation/; may read
      experiments/EXP-CERTBIN-e94b27/impl/ and
      experiments/EXP-FROB-30006a/ as input (read-only). Stdlib + existing
      project Python; no Magma/Sage/cypari2; no AUXIN; no Bedrock.
    budget:
      maximum_runs: 8
      total_cpu_hours_advisory: 4.0
      wall_clock_seconds_advisory: 14400

  falsification_conditions:
    - >-
      Any accepted null arm with f>2 (or use of n=31 as null) → protocol
      defect; not a scientific finding about stability (O-NULL-MISSPEC).
    - >-
      Stable-arm ratio <=0.5 AND non-stable control also <=0.5 → stability
      attribution falsified (O-ATTRIBUTION-FAIL).
    - >-
      Stage-0 ord_17(4)/gap table fails reproduction → O-TRANSCRIPTION.
    - >-
      Claiming any ECDLP cost bound / break / exponent from this contract.

  interpretation_limits:
    - >-
      Toy triangulation only. Transfer to deployed c2pnb rows is structural
      (ratio-preserving ladder) and disclosed with matching error; not a
      crypto-scale solve.
    - >-
      ECC2K-130 (n=131, ord_131(2)=130) is a valid primitive-prime null
      structurally (HOLD-N); this contract does not run ECC2K-130 and claims
      no attack on it.
    - >-
      Positive pruning at (2,17) does not imply the same on any deployed row;
      negative basis-blind reading strengthens the lane's negative search-step
      reading only at the tested toy proxy.
    - >-
      Timeouts/crashes are failed_infrastructure (AGENTS.md rule 5), never
      refutation of HEUR-BINSTD-9e5383-H1.

  distinguishable_outcomes:
    - id: O-STABILITY-REACHES-SOLVE
      meaning: >-
        Composite-arm stable ratio <=0.5 on every UNSAT replicate AND
        within-curve non-stable control near 1 AND null f=2 verified —
        first evidence Frobenius stability reaches the solving step at this
        toy proxy.
    - id: O-BASIS-BLIND
      meaning: >-
        Composite-arm ratio within ~1% of 1 with controls intact — even the
        densest reachable toy stable lattice buys nothing at the search step.
    - id: O-ATTRIBUTION-FAIL
      meaning: >-
        Non-stable control also drops to <=0.5; effect is not stability-
        specific; do not promote a stability finding.
    - id: O-NULL-MISSPEC
      meaning: >-
        Null arm f≠2 or n=31 used as null; protocol defect; reselect arms.
    - id: O-TRANSCRIPTION
      meaning: >-
        Stage-0 arithmetic fails reproduction from audited degrees / orders.
    - id: O-INSTRUMENT
      meaning: >-
        WDSat or F_4 descent builder unavailable; Stages 0/4 may still ship;
        do not read partial Stage-2 numbers as math success.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
