hypothesis:
  id: H-DREG-9cd42c
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  derived_from_idea: IDEA-20260815-cce6e2
  status: proposed
  added: '2026-09-04'

  statement: >-
    SCOPE. The CTRL-B instrument of GOAL-DREG-001 as admitted under
    DEC-20260725-026 and exercised by TASK-20260731-016 at the frozen cell
    n = 12, t = 3, ti = 0, seed 2026, D = 6 (EV-DREG-007, EV-DREG-008), and its
    behaviour at the ladder's next rungs n = 15 and n = 18. CLAIM TIER toy. NO
    ATTACK, NO EXPONENT, NO NEW LANE RESULT, NO PRIME-FIELD TRANSFER, AND NO STATUS
    CHANGE FOR H-DREG-001 OR GOAL-DREG-001 IS PROPOSED OR IMPLIED. This hypothesis
    verifies an INSTRUMENT; it produces no measurement of d_reg and contests no
    expansion decision.

    THE SEPARATION THIS HYPOTHESIS INSISTS ON, BECAUSE THE WHOLE DESIGN TURNS ON IT.
    CTRL-B has two separable parts. Part (a), THE ADMISSION MACHINERY - the
    restricted-support construction and the CTRL-B-Q-MACHINE-v1 path-pinned checks
    that produce restricted_support_hash, deleted_set_hash, rebuild_match and
    all_admission_metrics_pass - is combinatorial and hashing work and is cheap at
    any rung. Part (b), THE RANK MEASUREMENT the machinery gates - the chunked
    block-m4ri rank of the null system restricted to the sem support - is the
    expensive part, and at n = 15, D = 6 it measured 11.73 to 12.22 GiB of
    prepare-phase peak RSS on this host and terminated wholly
    failed_infrastructure without producing a rank. THIS HYPOTHESIS IS ABOUT PART
    (a) ONLY, and it says so rather than implying coverage it cannot deliver.

    THE HYPOTHESIS, IN FOUR CHECKABLE PARTS.

    (C1) THE CRITERION IS RECOVERABLE AND PRECISE. CTRL-B's admitted discrimination
      criterion can be quoted VERBATIM from committed artifacts and is stated
      precisely enough to be re-applied unchanged at a rung it was not admitted at -
      that is, it is a decidable predicate over named fields rather than a narrative.
      FALSIFIABLE: if it cannot be so quoted, the instrument cannot be verified at
      ANY rung, and any expansion under it proceeds under an unverified instrument,
      which the batch must then state explicitly rather than assume away.

    (C2) THE ADMITTED RUNG REPRODUCES. Applied to the committed admitted cell, a
      re-implementation of the criterion from its verbatim statement returns the same
      verdict and the same restricted_support_hash, deleted_set_hash and
      rebuild_match that EV-DREG-008 records. FALSIFIABLE: a mismatch is INSTRUMENT
      DRIFT or a re-implementation defect, and the identity control is what tells
      those two apart. Either way the expansion is blocked until it is resolved,
      because an instrument that does not reproduce at the rung where it was admitted
      is not verified anywhere.

    (C3) DISCRIMINATION SURVIVES THE NEXT RUNG. At n = 15, and at n = 18 for the
      trend, the criterion ADMITS correctly-constructed planted-positive support
      restrictions and REFUSES corrupted null restrictions, at the same standard it
      met at admission. The admitted standard is not a threshold to be argued over:
      all_admission_metrics_pass is an all-or-nothing gate, so the standard is
      100 per cent admission of planted positives and 100 per cent refusal of nulls,
      across at least three distinct corruption modes. FALSIFIABLE by any planted
      admission below 100 per cent or any null admission above 0 per cent at a rung
      where instances were built.

    (C4) THE INSTANCES ARE CONSTRUCTIBLE AT ALL. Planted and null instances are
      constructible at n = 15 and n = 18 inside the memory budget. FALSIFIABLE: if
      construction fails, the instrument CANNOT BE VERIFIED there and that is the
      expansion's binding constraint - a resource fact, reported as such, and never a
      statement about CTRL-B, about d_reg, or about RQ-DREG-001.

    WHAT A PASS WOULD AND WOULD NOT CLEAR. A pass clears the ADMISSION MACHINERY at
    the tested rungs. It does not clear the expansion: the expensive rank measurement
    that CTRL-B gates has already failed on this host at n = 15, and nothing in this
    hypothesis touches that. It also does not clear the expansion's scientific value,
    which is a separate judgement.

  mechanism: >-
    AN INSTRUMENT ADMITTED AT ONE RUNG IS NOT AUTOMATICALLY VALID AT THE NEXT, AND
    EXPANSION IS EXACTLY WHEN INSTRUMENTS QUIETLY STOP DISCRIMINATING. The admission
    of CTRL-B projected its behaviour at one cell onto every cell; an expansion is
    the first test of that projection, and re-running the discrimination check at the
    new rung BEFORE the expansion spends anything is the difference between an
    expansion and an expansion nobody can interpret.

    WHY DISCRIMINATION IS THE RIGHT WORD FOR AN ADMISSION CHECKER. CTRL-B's admission
    machinery is a classifier: it must ADMIT a support restriction that was
    constructed correctly and REFUSE one that was not. So the planted positive is a
    correctly-built restricted support with its matching deleted set and a rebuild
    that matches; the null is the same object corrupted in a named way - a support
    element added or dropped, a deleted-set entry perturbed, a rebuild seeded from
    the wrong parent. Discrimination is the gap between the admit rate on planted
    instances and the admit rate on nulls, and it is measurable at any rung where the
    instances can be built, for the cost of hashing.

    WHY THE CRITERION IS QUOTED VERBATIM AND HASHED FIRST. The single failure mode
    that would make this whole check worthless is CRITERION RELAXATION: applying a
    looser standard than the admission used would clear the expansion falsely, and it
    would do so invisibly, because the relaxed criterion would look like a criterion.
    Quoting the admitted text with its source path and sha256 into a declaration that
    is hashed before any instance exists removes the possibility.

    WHY A TRIVIAL CHECKER IS RUN ALONGSIDE. A discrimination score is only about the
    checker if the instance sets themselves do not carry the separation. An
    always-admit checker of the same shape, run on the identical planted and null
    sets, must score ZERO discrimination. If the trivial checker appears to
    discriminate, the harness is measuring instance construction rather than CTRL-B
    and nothing else in the run may be read. This is the null object required before
    any signal is believed, and it can fail.

    WHY CONSTRUCTION DIFFICULTY MUST NOT BE READ AS INSTRUMENT FAILURE. If planted
    instances are hard to build at the new rung, a failure is about the construction
    and not about CTRL-B. The design separates them by reporting constructibility per
    rung as its own metric with measured peak RSS, so a construction stop is legible
    as a resource fact.

  assumptions:
    - >-
      That CTRL-B's discrimination criterion is stated precisely enough in its
      admission to be re-applied. This is (C1) and it is TESTED, not assumed; the
      parent proposal's own prior on it is 0.8, which is not high enough to assume.
    - >-
      That planted positives and nulls are constructible at the next rung. This is
      (C4) and it is TESTED; construction difficulty at higher rungs is itself the
      expansion's binding constraint and is a first-class output.
    - >-
      That the admission machinery is separable from the rank measurement it gates -
      that the hashes, the deleted-set construction and the rebuild match can be
      computed without computing a rank. If this is false the contract cannot run
      within the host's memory and says so rather than attempting it.
    - >-
      That the committed artifacts of TASK-20260731-016 remain readable at their
      recorded paths with their recorded content. A path that has moved or whose
      content differs is a provenance failure and is reported, not worked around.

  proof_search_map:
    bottleneck: >-
      Whether an instrument this campaign has already used to produce a committed
      structural number still separates correct from corrupted constructions at the
      rung the campaign has selected to expand into. If it does not, every number the
      expansion produces is uninterpretable, and the cheapest moment to discover that
      is before the expansion rather than after.
    baseline_embedding:
      parameter_slice: >-
        The ADMITTED CELL n = 12, t = 3, ti = 0, seed 2026, D = 6 is the exact
        boundary at which the re-implementation and the incumbent must agree. The new
        rungs contain it as a slice of the same construction, not as an analogy.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE. The re-implemented criterion, applied to the exact
        committed artifact content of TASK-20260731-016, must return
        ctrl_b_admission_status admitted, all_admission_metrics_pass, rebuild_match
        true, and the two recorded hashes restricted_support_hash
        8a1bf796ccb340181af0c78920e9ebc9d527743d87d6053333ed3d4cbb7bae17 and
        deleted_set_hash
        a0203e81cd0947aea405bdb7c7ae98b2ddd60c970b96b1a7d2a5caf4b5d6809b as recorded
        in EV-DREG-008. THESE HASHES ARE READ FROM THE COMMITTED EVIDENCE RECORD AND
        ARE NOT RECOMPUTED BY THIS COORDINATOR; recomputing them is the fixture's job.
    observation_collision:
      observable: 'the discrimination score at a rung, admit rate on planted minus admit rate on nulls'
      distinct_preimage_search: >-
        THE COLLISION IS NAMED. A high score can arise from (a) a checker that really
        separates correct from corrupted constructions, (b) an instance generator
        whose nulls are corrupted so coarsely that any predicate separates them,
        (c) a checker keyed on an incidental field that happens to correlate with the
        corruption, or (d) a harness bug that labels instances by how they were built
        rather than by what the checker returned. Four preimages, one observable. The
        separating conditions are the TRIVIAL-CHECKER null, which must score zero and
        so kills (b) and (d); at least three DISTINCT corruption modes with per-mode
        refusal rates, which exposes (c) as a mode-specific pass; and the identity
        control on committed bytes, which pins (a) to the incumbent.
    constructive_transforms:
      - transform: nearby_object_control
        proposed_object: >-
          A trivial always-admit checker of the same shape as CTRL-B's admission
          predicate, and a second trivial always-refuse checker, both run on the
          identical instance sets at every rung.
        predicted_gain: >-
          Forced verdicts - zero discrimination for both - that make the real
          checker's score interpretable instead of merely large. No lane result, no
          exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold the checker fixed and vary the rung across n in 12, 15 and 18,
          exhibiting the discrimination score as a function of rung rather than at a
          single point.
        predicted_gain: >-
          The TREND, which is what says how far the ladder can be pushed at all,
          rather than a single pass or fail at one rung.
    quantifier_order: >-
      CLAIMED. FOR EACH rung at which the planted and null instances are actually
      constructible, THERE EXISTS a re-implementation of the verbatim admitted
      criterion that admits 100 per cent of at least 50 planted positives and refuses
      100 per cent of at least 50 nulls spanning at least three corruption modes. NOT
      CLAIMED, and each is the dangerous stronger reading: that the criterion
      discriminates at rungs where instances were NOT constructible; that
      discrimination of the admission machinery implies the RANK measurement it gates
      is feasible; or that any of this bears on whether d_reg tracks or departs from
      the semi-regular null.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The CTRL-B admission criterion, as quoted verbatim from its committed
        admission artifacts, reproduces its committed verdict and hashes on the
        admitted cell, and at the rungs where planted and null instances were
        constructible it admitted and refused at the reported rates against the
        reported corruption modes." It certifies NOTHING about the feasibility of the
        rank measurement CTRL-B gates, nothing about rungs where construction failed,
        nothing about d_reg, and nothing about the expansion's scientific value.
      nearby_object_control: >-
        The TRIVIAL ALWAYS-ADMIT CHECKER, whose discrimination score is forced to zero
        on the same instance sets. It is the object of the same shape for which the
        conclusion is known false, and if it scores above zero the measurement is of
        the instances rather than of the checker.
    proof_obligations:
      - claim: The admitted criterion is quoted verbatim with its source path and sha256 before any instance exists.
        responsibility: interface
      - claim: The re-implementation reproduces the committed verdict and both hashes on committed bytes.
        responsibility: baseline
      - claim: The trivial checkers score zero discrimination on the same instance sets.
        responsibility: correctness
      - claim: Nulls span at least three distinct corruption modes with per-mode rates reported.
        responsibility: strictness
      - claim: Constructibility and peak RSS are reported per rung, including for rungs not reached.
        responsibility: memory
      - claim: No statement is made about the gated rank measurement or about d_reg.
        responsibility: scope

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. This hypothesis proposes no algorithm for any hard problem, moves
    no exponent, and compares against no baseline. Its whole cost is planted and null
    instance construction plus checker evaluations at two or three rungs, and its whole
    output is a statement about an instrument.

  heuristic_assumptions:
    - id: HEUR-DREG-CTRLB-1
      formal_statement: >-
        FOR the CTRL-B admission criterion as admitted under DEC-20260725-026, the
        discrimination power measured at the rung where it was admitted
        (n = 12, t = 3, ti = 0, seed 2026, D = 6) predicts its discrimination power at
        the next ladder rungs n = 15 and n = 18, in the sense that a criterion meeting
        the all-or-nothing admission standard at the admitted rung also meets it at
        those rungs.
      random_model_justification: >-
        NOT DISTRIBUTIONAL, AND THE GAP IS STATED RATHER THAN PAPERED OVER. The
        rigorous ingredient is only that the criterion's DEFINITION is identical at
        every rung, so the definition itself cannot degrade. THE GAP: discrimination
        depends on the separation between the planted and null constructions, and that
        separation typically shrinks as a ladder ascends - which is exactly why
        instruments fail on expansion rather than on admission. The heuristic is
        therefore expected to be the weak point and is what the experiment measures.
      supporting_results: []
      supporting_results_note: >-
        No citation is asserted and none exists. The support is internal and is exactly
        the committed admission record: DEC-20260725-026, EV-DREG-007 and EV-DREG-008
        establish the criterion was met AT ONE CELL, which is the projection this
        heuristic questions rather than the evidence that discharges it.
      validation_experiment_ids: [EXP-DREG-c208ae]
      falsification_condition: >-
        Discrimination is materially weaker at n = 15 than at n = 12 - operationally,
        any planted admission rate below 100 per cent or any null admission rate above
        0 per cent at a rung where at least 50 planted and 50 null instances spanning
        at least three corruption modes were constructed.
    - id: HEUR-DREG-CTRLB-2
      formal_statement: >-
        FOR the CTRL-B protocol, the admission machinery - the restricted-support
        construction, the two hashes, and the rebuild match - is computable at a rung
        WITHOUT computing the rank it gates, at a peak resident set size bounded well
        below the memory cap.
      random_model_justification: >-
        Not distributional. It is a structural claim about the protocol's decomposition
        into a combinatorial admission stage and a linear-algebra measurement stage,
        and it is decided by construction plus measured peak RSS rather than by a model.
      supporting_results: []
      supporting_results_note: >-
        Internal and adverse-adjacent: the same lane's n = 15, D = 6 attempt measured
        11.73 to 12.22 GiB in its PREPARE phase before any rank kernel ran, which is
        the reason this heuristic must be stated and measured rather than assumed. If
        the admission stage is what carries that cost, this heuristic is false and the
        contract stops.
      validation_experiment_ids: [EXP-DREG-c208ae]
      falsification_condition: >-
        Constructing the planted and null instances, or evaluating the criterion on
        them, exceeds the declared peak-RSS threshold at n = 15. The admission machinery
        is then not separable from the expensive stage on this host, the instrument
        cannot be verified there, and that is a resource fact rather than a finding
        about CTRL-B.

  structural_ingredients: []
  structural_ingredients_note: >-
    None. Every object is internal to this program - a committed decision, two
    committed evidence records, and the committed task artifacts they cite. No external
    theorem is imported, so there is no citation to provenance-mark and none is
    asserted.

  reduction_chain: null
  rerandomization: null

  predictions:
    - metric: >-
        recoverability and precision of the admitted criterion, as a verdict -
        DECIDABLE PREDICATE or NARRATIVE - over named fields
      direction: different
      minimum_effect: >-
        A verbatim quotation with its source path and sha256, plus the verdict. A
        NARRATIVE verdict means the instrument is unverifiable at every rung including
        the one it was admitted at, and that outcome is a genuine and decision-relevant
        deliverable rather than a failure of the experiment.
    - metric: >-
        admitted-rung reproduction - verdict, restricted_support_hash, deleted_set_hash
        and rebuild_match against the values EV-DREG-008 records
      direction: different
      minimum_effect: >-
        FORCED TO EXACT AGREEMENT on all four. A mismatch is instrument drift or a
        re-implementation defect, is disambiguated by the identity control, and blocks
        the expansion until resolved. Failure here means the instrument has drifted, not
        that the rung is hard.
    - metric: >-
        discrimination at n = 15 - admit rate on at least 50 planted positives and
        admit rate on at least 50 nulls spanning at least three corruption modes
      direction: different
      minimum_effect: >-
        THE MEASUREMENT, AND THE STANDARD IS THE ADMITTED ONE, NOT A NEW ONE: 100 per
        cent planted admission and 0 per cent null admission, because
        all_admission_metrics_pass is an all-or-nothing gate. Anything less is
        DEGRADED and the expansion would produce results nobody could interpret.
    - metric: discrimination trend across rungs n in 12, 15 and 18
      direction: lower
      minimum_effect: >-
        Reported as a per-rung score, showing whether the instrument degrades gradually
        or fails sharply - which is what determines how far the ladder can be pushed at
        all, and is more useful than a single pass or fail.
    - metric: trivial always-admit and always-refuse checkers on the identical instance sets
      direction: different
      minimum_effect: >-
        FORCED TO ZERO DISCRIMINATION for both. A nonzero score means the harness is
        measuring instance construction rather than the checker, and NOTHING else in
        the run may be read.
    - metric: per-corruption-mode refusal rate at every rung
      direction: different
      minimum_effect: >-
        Reported per mode. A checker refusing one mode at 100 per cent and another at 0
        per cent has a mode-specific blind spot, which a pooled rate would hide, and the
        blind spot is the finding.
    - metric: constructibility and measured peak RSS per rung
      direction: different
      minimum_effect: >-
        Reported, including for any rung NOT REACHED. A construction failure is the
        expansion's binding constraint and is never evidence about CTRL-B, about d_reg,
        or about RQ-DREG-001.

  test_boundary:
    instances: >-
      The committed artifacts of the admitted CTRL-B cell (TASK-20260731-016 under
      BATCH-005, as cited by EV-DREG-008), plus SYNTHETIC planted-positive and null
      support restrictions constructed inside the contract at n in 12, 15 and 18 for
      the boolean chained Semaev system at m = 3, t = 3, ti = 0 over GF(2).
    parameters:
      m: 3
      t: 3
      ti: 0
      D: 6
      admitted_cell: 'n = 12, seed 2026'
      rungs: [12, 15, 18]
      planted_per_rung: 50
      nulls_per_rung: 50
      corruption_modes_minimum: 3
      trivial_checkers: ['always-admit', 'always-refuse']
      ranks_computed: 0
    implementation: >-
      Python 3.11. Support-restriction construction and hashing only; no Macaulay rank
      is computed and no linear algebra is performed. The criterion is re-implemented
      from its verbatim quoted statement, and the re-implementation is applied first to
      the committed artifact content as an identity control. Peak RSS measured per rung
      by the harness. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds: 1800
      total_cpu_hours: 2.0
      memory_gb: 8
      maximum_runs: 12

  distinguishable_outcomes:
    - outcome: >-
        CRITERION NOT RECOVERABLE AS A DECIDABLE PREDICATE.
      what_observing_it_would_mean: >-
        (C1) is FALSE. CTRL-B cannot be verified at any rung, including the one it was
        admitted at, and any expansion under it proceeds under an unverified instrument
        - which must then be stated explicitly in the batch rather than assumed away.
        This is a cheap, decision-relevant deliverable and it does not retract the
        committed measurement; it says what that measurement's instrument can and
        cannot be checked against.
    - outcome: >-
        IDENTITY CONTROL FAILS on committed bytes.
      what_observing_it_would_mean: >-
        The re-implementation is defective. NO rung result may be read, the drift
        question is unanswered, and the deliverable is the defect - deliberately
        distinguishable from (C2) failing with a passing identity control.
    - outcome: >-
        ADMITTED RUNG DOES NOT REPRODUCE, with the identity control passing.
      what_observing_it_would_mean: >-
        (C2) is FALSE and this is INSTRUMENT DRIFT rather than rung difficulty. The
        expansion is blocked until resolved, and the committed structural number the
        instrument produced needs a re-statement of what it rests on.
    - outcome: >-
        TRIVIAL CHECKER SCORES NONZERO DISCRIMINATION.
      what_observing_it_would_mean: >-
        The harness is measuring how the instances were built rather than what the
        checker returned. The run is VOID and nothing in it is read - which is why the
        trivial checkers are run and committed BEFORE the real one.
    - outcome: >-
        DISCRIMINATION HOLDS AT n = 15 AND THE TREND IS FLAT.
      what_observing_it_would_mean: >-
        (C3) holds at the tested rungs. The instrument is cleared for those rungs -
        AND ONLY THE ADMISSION MACHINERY IS CLEARED. The gated rank measurement is
        untouched by this result and has already failed on this host at n = 15, so the
        expansion is not cleared and the record must not be read as clearing it.
    - outcome: >-
        DISCRIMINATION DEGRADES AT n = 15.
      what_observing_it_would_mean: >-
        (C3) is FALSE. An expansion under this instrument would produce results nobody
        could interpret, and the correct response is to redesign the check rather than
        to run the expansion and caveat it afterwards. This is the outcome that saves
        the most and the parent proposal's own prior on it is 0.35.
    - outcome: >-
        INSTANCES NOT CONSTRUCTIBLE AT n = 15 within the memory budget.
      what_observing_it_would_mean: >-
        (C4) is FALSE and HEUR-DREG-CTRLB-2 is falsified: the admission machinery is
        not separable from the expensive stage on this host. The instrument cannot be
        verified there, the expansion would proceed without a validated instrument, and
        this must be stated explicitly. IT IS A RESOURCE FACT AND NEVER EVIDENCE about
        CTRL-B, d_reg or RQ-DREG-001 (AGENTS.md rule 5).
    - outcome: >-
        A MODE-SPECIFIC BLIND SPOT. The checker refuses some corruption modes and
        admits another.
      what_observing_it_would_mean: >-
        The instrument discriminates against the corruptions it was designed for and
        not against a named other one. This is more informative than a pooled pass or
        fail, it localises the weakness, and it is a deliverable in its own right.

  falsification_conditions:
    - >-
      The admitted criterion cannot be quoted as a decidable predicate over named
      fields. (C1) fails.
    - >-
      The re-implementation, applied to the committed artifact content, does not
      reproduce EV-DREG-008's recorded verdict and both recorded hashes. Identity
      control failure - the re-implementation is defective.
    - >-
      The admitted rung's verdict or hashes differ while the identity control passes.
      (C2) fails - instrument drift; resolve before any expansion.
    - >-
      Either trivial checker scores nonzero discrimination on the same instance sets.
      The harness is void.
    - >-
      Planted admission below 100 per cent, or null admission above 0 per cent, at a
      rung where at least 50 planted and 50 nulls spanning at least three corruption
      modes were built. (C3) fails at that rung.
    - >-
      Planted or null instances are not constructible at n = 15 within the memory
      budget. (C4) fails and HEUR-DREG-CTRLB-2 is falsified.

  interpretation_limits:
    - >-
      VERIFIES AN INSTRUMENT AND PRODUCES NO LANE RESULT. It does not contest the
      expansion decision, does not measure d_reg, does not touch any deficit, and
      changes no status.
    - >-
      SCOPED TO PART (a) OF CTRL-B, THE ADMISSION MACHINERY, AND TO THE TESTED RUNGS
      AND THE ADMITTED CRITERION. The rank measurement CTRL-B gates is explicitly OUT
      OF SCOPE, because it has already failed on this host at n = 15 with over 11 GiB
      of prepare-phase peak RSS. A pass here does not make that measurement feasible
      and must never be quoted as if it did.
    - >-
      A PASS CLEARS THE INSTRUMENT, NOT THE EXPANSION'S SCIENTIFIC VALUE. Those are
      different judgements and only the first is in evidence here.
    - >-
      A FAILURE HERE IS NOT A NEGATIVE RESULT ABOUT THE SEMAEV SYSTEM. It is a
      statement about a checker, and a construction failure is a statement about a
      host.
    - >-
      Toy scale, boolean, m = 3, t = 3, ti = 0, n at most 18. Nothing bears on
      prime-field ECDLP, moves any exponent, or touches the Pollard rho baseline.

  overlap_with_sibling_contracts:
    - >-
      WITH EXP-DREG-1db92b (H-DREG-a53645). Both read committed GOAL-DREG-001
      deficit-cell records. DECLARED DIVISION, so neither re-adjudicates the other:
      EXP-DREG-1db92b Stage 1 owns the provenance table for the D = 5 cells and this
      contract CONSUMES it; this contract owns the verbatim admitted-criterion
      extraction and the admitted or quarantined status of the D = 6 CTRL-B cell, and
      EXP-DREG-1db92b consumes THAT. THE CROSS-CHECK THAT CAN FAIL: both must agree on
      the identity of the n = 12, seed 2026 cell. A disagreement means one of the two
      is wrong and neither result may be interpreted until it is resolved.
    - >-
      WITH EXP-DREG-c92f56 (H-DREG-dafc39). No overlap in measured quantity - that
      contract computes graded ranks and this one computes none - but both carry a
      cheap, blocking, zero-compute Stage 0 that can end the contract before any
      spend. That is deliberate and shared: it is the same discipline applied to a
      derivation in one case and to an instrument in the other, and the two should be
      reviewed together for consistency of that pattern rather than separately.

