  title: >-
    The m=4 Koblitz leaf count over the m=3 leaf count is exactly 64/37,
    and that ratio sits strictly between 1.72 and 1.73.
  statement: >-
    2^{24}/6 has quotient 2796202 and remainder 4. 2^{32}/24 has quotient
    178956970 and remainder 16. 2^{32}/888 has quotient 4836674 and
    remainder 784. 2^{30}/120 has quotient 8947848 and remainder 64.
    2^{30}/3480 has quotient 308546 and remainder 1744. In each case twice
    the remainder exceeds the divisor, so the nearest integers are one
    above those quotients. The ratio of the exact m=4, mu=37 count to the
    exact m=3 count is 64/37, and 64/37 is strictly below 173/100. Also
    4*7 <= 37, while 5*5 <= 23 is false and 5*5 <= 29 is true. And 2^5 <
    37 < 2^6.
  mechanism: >-
    An exhaustive-core leaf count 2^{m l} divided by m! * mu is the
    arithmetic the proposal uses to compare arities. This contract checks
    those divisions. It does not run a search.
