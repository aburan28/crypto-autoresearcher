  statement: >-
    CONDITIONAL, UNSUPPORTED HYPOTHESIS. Let G=<P> be an odd prime-order
    prime-field short-Weierstrass subgroup of order N approximately p, let
    Q=[k]P, and let S=1[V>=1] be independently verified Boolean success for
    one frozen signed-y four-list root. On the preregistered uniform public
    family/model/root distribution, p_N=Pr[S=1] may scale as
    N^(-1/3+gamma_s+o(1)) with gamma_s>5/18 while selector regularity,
    subpolynomial root clustering, independent restarts, family/model
    stability, and the fully charged wiring-access model all hold. If so, one
    root costs N^(1/3+o(1)) raw work and live entries, expected raw work is
    N^(2/3-gamma_s+o(1)), and fully charged Wiener cost is
    N^(7/9-gamma_s+o(1)), strictly below the Pollard-rho N^(1/2+o(1)) exponent.
    No positive gamma_s, solver, speedup, attack, security impact, transfer to
    cryptographic scale, novelty, or breakthrough is presently observed.

  mechanism: >-
    For affine R=(x,y), map the centered y representative through the public
    signed-y antisymmetric label h_y. Each root draws fresh a,b,z and four
    length-L scalar lists without replacement. For Q'=[a]Q+[b]P, select left
    and right pairs by complementary labels, then accept only an exact point
    equality A+B=Q' whose reconstructed scalar independently verifies. The
    hypothesized gain is an exponent increase in marginal distinct verified
    Boolean success, not multiplicity Y, representation duplication, or a
    hidden model-selection effect.

  assumptions:
    - id: A1-group-family
      statement: >-
        Curves are odd prime-order short-Weierstrass subgroups with N
        approximately p; order, subgroup, cofactor, anomalous,
        coefficient-degeneracy, and exceptional-curve checks precede admission.
    - id: A2-public-no-advice
      statement: >-
        One public target and one preregistered family/model rule are used with
        no oracle, learned label, advice, reusable root table, post-treatment
        curve/model selection, or discovery cost omitted.
    - id: A3-seed-separation
      statement: >-
        Lists are without replacement within each list and every root, arm,
        size, gamma, eta, dataset, bootstrap, and fixture seed domain is disjoint.
    - id: A4-full-accounting
      statement: >-
        Every group and field operation, label, hash, join, equality,
        verification, record, byte, communication path, failed root, and
        retained artifact is charged by the frozen compiler schedule.

  heuristic_assumptions:
    source_yaml_key_path: idea.heuristic_assumptions
    source_subtree_sha256: d8a676a9fbf65ae3c303db1c35925b0f5fcadd1c73d286472b56cc391e56c0ca
    rows:
      - id: HA-1-selector-regularity
        formal_statement: >-
          Uniformly over the frozen family and roots, selected left and right
          sides are N^(1/3+o(1)) and bucket and exact point-sum multiplicities
          are N^o(1).
        boundary: >-
          A side above 4L, combined selected pairs above 8L, or polynomial
          multiplicity invalidates the cost model; cap failure is apparatus invalidity.
      - id: HA-2-distinct-match-enrichment
        formal_statement: >-
          The fixed public family/model rule has
          E[X]=N^(-1/3+gamma_x+o(1)); the decision-changing target is
          gamma_x>5/18 together with every Boolean bridge gate.
        boundary: >-
          No theorem or observation presently supports positive gamma_x on
          prime curves. A valid complete upper bound at or below 5/18 narrows
          only the frozen scope.
      - id: HA-3-subpolynomial-root-clustering
        formal_statement: >-
          For gamma_x<1/3, kappa_N=E[X^2]/E[X]=N^o(1),
          Y/max(1,X)=N^o(1), and p_N/E[X]=N^o(1) with exponent zero.
        boundary: >-
          Polynomial kappa or Y/X growth, or polynomial p_N/E[X] decay,
          breaks the runtime bridge even if expected matches rise.
      - id: HA-4-independent-restarts
        formal_statement: >-
          Conditional on the fixed input and model, disjoint root seeds create
          fresh a,b,z and list draws and the time to first S=1 is geometric.
        boundary: >-
          Any seed collision, list/table reuse, mutable carry-over, or
          out-of-envelope lag dependence invalidates restart inference.
      - id: HA-5-family-and-model-scaling
        formal_statement: >-
          The fixed public curve generator and four fixed model rules define a
          stable uniform-model marginal represented by the five-size ladder.
        boundary: >-
          Model views are nested observations, never restarts. Failure of the
          family or canonical gate prevents a model-robust claim and
          heterogeneity narrows scope and charges discovery.
      - id: HA-6-wiring-access-charge
        formal_statement: >-
          Selected tables are touched at nonvanishing rate, so fully charged
          Wiener cost is raw work times storage^(1/3).
        boundary: >-
          A different access or storage exponent requires a superseding cost
          record; logical traffic is not silently called physical traffic.
      - id: HA-7-finite-size-family-model
        formal_statement: >-
          On the exact 18--30-bit orders, the direct marginal log mean has one
          fixed eta in {-4,0,4}, a free intercept, and eta is never data-fitted.
        boundary: >-
          Eta coverage failure, curvature, or gate disagreement makes the
          asymptotic interpretation inconclusive.

  asymptotic_claim:
    problem: single-target no-advice prime-order prime-field ECDLP on the declared distribution
    prior_best: Pollard rho or vOW N^(1/2+o(1)) time with negligible live storage
    per_root_time: N^(1/3+o(1))
    time_exponent: N^(2/3-gamma_s+o(1))
    memory_exponent: N^(1/3+o(1))
    fully_charged_exponent: N^(7/9-gamma_s+o(1))
    decision_changing_threshold: gamma_s>5/18
    raw_rho_threshold: gamma_s>1/6
    standard_bsgs_full_threshold: gamma_s>1/9
    claim_kind: exponent_improvement
    hidden_cofactor: >-
      Lists, sorting, hashing, selected-pair and witness processing, XOF fixed
      blocks, fits, certificates, clustering, archive construction,
      communication, physical traffic, and unbounded o(1) constants.
    standing: conditional_target_unobserved

  proof_search_map:
    source_yaml_key_path: idea.proof_search_map
    binding_mode: exact_scientific_inheritance
    bottleneck: >-
      Establish or falsify marginal Boolean gamma_s>5/18 with per-root work
      and storage N^(1/3+o(1)); multiplicity or raw-only gamma_s>1/6 is insufficient.
    baseline_embedding:
      parameter_slice: >-
        gamma_s=0 gives probability N^(-1/3+o(1)), raw time
        N^(2/3+o(1)), storage N^(1/3+o(1)), and fully charged cost
        N^(7/9+o(1)), the memory-matched BSGS boundary.
      reproduction_check: >-
        A future baseline fixture must share encoding, counters, record widths,
        equality, verification, and Wiener calculator and reproduce
        exponents (2/3,1/3,7/9).
    observation_collision:
      observable: 'The ordered tuple (E[Y],E[X],kappa_N,p_N/E[X],p_N).'
      distinct_preimage_search: >-
        Diffuse and concentrated deterministic streams have equal E[X] and
        E[Y], while the concentrated stream has kappa=N^(1/3) and Boolean
        probability lower by N^(-1/3); the frozen matched-mean control must
        distinguish them.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: 'D,Y,X,V,S together with kappa_N and p_N/E[X]'
        predicted_gain: expose multiplicity-only and polynomial-concentration artifacts
      - transform: representation_reduction
        proposed_object: signed-y selection followed by exact points and independent scalar verification
        predicted_gain: prevent lossy labels from replacing exact equality
      - transform: observable_fiber
        proposed_object: fixed ECDLP instance under canonical and three public isomorphic models
        predicted_gain: separate representation effects from group structure
    quantifier_order: >-
      There exists one public h_y and one public family/model distribution fixed
      before data, and epsilon>0, such that for all sufficiently large N in the
      distribution p_N>=N^(-1/3+5/18+epsilon+o(1)), with HA-1, HA-3, HA-4,
      and HA-6 holding. No curve, model, eta, gamma, seed, or correction is
      selected after treatment. The toy ladder cannot establish this quantifier.
    method_ceiling:
      strongest_certifiable_claim: >-
        Since p_N<=1, gamma_s<=1/3. Four length-L lists impose
        N^(1/3+o(1)) raw-work and live-memory floors and a Wiener floor
        N^(4/9+o(1)).
      nearby_object_control: >-
        An exact quotient on Z/(M^3)Z has order-one Boolean success; a balanced
        antisymmetric odd-prime cyclic label is the gamma_s=0 leading null.
    proof_obligations:
      - {claim: signed-y antisymmetry and scalar recovery, responsibility: correctness}
      - {claim: selector caps and lossless schemas, responsibility: size}
      - {claim: complete group, field, hash, join, equality, verification, and byte counts, responsibility: runtime}
      - {claim: marginal distinct-match exponent, responsibility: success_probability}
      - {claim: Paley-Zygmund bridge and matched-mean collision, responsibility: success_probability}
      - {claim: direct marginal log-link and eta references, responsibility: interface}
      - {claim: independent restarts and inverse-probability cost, responsibility: runtime}
      - {claim: Wiener access charge and strict crossovers, responsibility: strictness}
      - {claim: preprocessing, discovery, advice, query, multi-target, and scale boundaries, responsibility: scope}
    not_applicable_reason: null

