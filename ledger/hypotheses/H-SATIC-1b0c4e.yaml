  authorised_by: DEC-20261003-82cf2b
  proposed_by: coordinator
  approved_by_decision: DEC-20261003-82cf2b
  status: approved
  title: >-
    Dual-route arithmetic of the one-leg restricted S_4 identity
    S_4(a,x_2,x_3,x_R)=(a+x_R)^4 S_3(x_2,x_3,u_+) S_3(x_2,x_3,u_-) on toy
    F_{2^n}, n in {5,17}
  statement: >-
    SETTING. F = F_2[t]/(f) with f = t^5+t^2+1 at n=5 and f = t^17+t^3+1 at
    n=17; B_curve = 1. For a != x_R in F, let G(X) = S_3(X,a,x_R) and
    Fpoly(X) = S_3(x_2,x_3,X) with
    S_3(u,v,X) = (u+v)^2 X^2 + (uv) X + (uv)^2 + B (IDEA-20260930-c5466b /
    KN-TECH-b18366 rearrangement of Semaev's characteristic-2 S_3). Let u_+,
    u_- be the roots of G when they exist in F.

    CLAIM UNDER TEST (toy, exact field arithmetic, no Weil descent, no W_D):
    (I) IDENTITY: Res_X(Fpoly, G) equals (a+x_R)^4 S_3(x_2,x_3,u_+)
    S_3(x_2,x_3,u_-) on every sampled tuple with a != x_R and G split in F.
    (R) ROUTE AGREEMENT: the schoolbook S_3 (xy+xz+yz)^2 + xyz + B equals the
    expanded bilinear form on those same evaluations.
    (C) KNOWN-FALSE: (a+x_R)^4 (g_+ XOR g_-) is not required to equal the
    resultant; a positive count of equalities on tuples with both factors
    nonzero and unequal is O-ARTIFACT, not support.

    NOT TESTED HERE: product-penalty Delta on Weil-descended systems, W_D
    rungs, M1 versus M2 of the idea, any ECDLP solve, any exponent, n>=131.
  mechanism: >-
    Two independent evaluation sequences of the same polynomial. Route school
    multiplies pairwise then squares the three-term sum. Route expand uses the
    idea's (a+b)^2 X^2 + ab X + (ab)^2 + B form. The resultant is the 4x4
    Sylvester determinant over F_{2^n}. The product side evaluates Fpoly at
    the half-trace roots of G and multiplies by lc(G)^2 = (a+x_R)^4.
    Lossy projection: the pair (sylvester, product) discards the four field
    elements. Off-limits F2 family declared; this packet does not escape it.
  assumptions:
    - n is odd so the half-trace solves Artin-Schreier Z^2+Z = c.
    - Tuples with a = x_R are excluded and counted.
    - Tuples whose G does not split in F are skipped (not a negative).
    - No Sage, Magma, AUXIN, or Bedrock. In-Python integer bit polynomials only.
  proof_search_map:
    bottleneck: >-
      Whether the textbook resultant identity for the restricted direct S_4
      residual holds in the program's schoolbook F_{2^n} arithmetic, which is
      the encoding obligation before any product-penalty closure.
    baseline_embedding:
      parameter_slice: >-
        n=5 (20 tuples) and n=17 (100 tuples); B=1; moduli t^5+t^2+1 and
        t^17+t^3+1.
      reproduction_check: >-
        Dual routes (school vs expand, Sylvester vs product) must agree on
        every kept tuple. Frozen seeds 2026100305 and 2026100317.
    observation_collision:
      observable: Per-tuple equality of Sylvester resultant and product side.
      distinct_preimage_search: >-
        Agreement could be (i) the identity, (ii) an unsound shared bug in
        both routes, or (iii) accidental zeroes. (ii) is attacked by the
        independent check.py re-derivation that does not import s3_eval.py.
        (iii) is attacked by the known-false XOR-sum control.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Hold (a,x2,x3,x_R) and vary presentation (resultant vs product).
        predicted_gain: Encoding check for IDEA-20260930-c5466b Stage 0.
    quantifier_order: >-
      Exact: FORALL a != x_R with G split in F, the identity holds. Empirical
      here: FOR the two cells, FOR the frozen PCG-style Python random streams,
      all kept tuples agree.
    method_ceiling:
      strongest_certifiable_claim: >-
        At n in {5,17} with the named moduli and B=1, the identity and the
        school/expand agreement hold on the frozen samples. Nothing about
        W_D, m>=4, or ECDLP cost.
      nearby_object_control: >-
        XOR-sum of the two inner S_3 values scaled by (a+x_R)^4, which is not
        the resultant.
    proof_obligations:
      - claim: S_3 school equals S_3 expand on evaluated roots.
        responsibility: correctness
      - claim: Sylvester resultant equals (a+x_R)^4 g_+ g_- when G splits.
        responsibility: correctness
      - claim: No transfer beyond n in {5,17}, B=1, and the named moduli.
        responsibility: scope
    not_applicable_reason: null
