hypothesis:
  id: H-ECDLP-48491e
  question_id: RQ-ECDLP-002
  statement: >-
    The GOAL-PATH-001 tier series has never written down which edges of its own
    dependency graph type-check. Extracting, for every declared feed edge, the
    four type coordinates (object_class, unit, scale, certificate_kind) from the
    producing goal, its frozen protocol artefact, and its experiment and
    evidence records, and comparing them against the consuming binding, will
    show that at least one declared option in the goal's own next_action serves
    completion clause 2 only and cannot advance clause 1 at all, and that the
    critical path for clause 1 may be blocked by a MISSING UNIT CONVERSION
    rather than by a missing measurement. No mathematics is claimed and no
    exponent is moved. Source proposal: IDEA-20260805-6a14e3.
  mechanism: >-
    A measurement package flows along a feed edge only if the producer output
    type matches the consumer input type. Types propagate deterministically
    under composition of edges exactly when each arrow's output type matches the
    next arrow's input type, so extracting types and composing them is a
    decidable check that costs no compute. Where the composition fails, the
    consuming protocol's own comparison rule declares the quantities
    incomparable, and the blocking defect is a conversion rather than a
    measurement - a materially cheaper thing to repair and a different next
    action.
  assumptions:
    - >-
      That a goal record's objective and next_action are an accurate statement
      of its lane's object class. They are the committed statement, but an
      executor may have measured something broader, so the protocol reads the
      experiment contracts and evidence records for each producer too and
      reports disagreements as findings rather than resolving them.
    - >-
      That the frozen consuming protocol artefact is the operative statement of
      what clause 1 requires. It is version 1.0.0-review per the source
      proposal, and a later version could change the feed pins; the exact
      artefact path and its review status are recorded on every row.
    - >-
      That the child-goal set in scope for clause 2 is resolvable by reading the
      goal record. The count is REPORTED as measured and is never assumed.
    - >-
      IMPORTANT STALENESS ASSUMPTION, FLAGGED. The source proposal was written
      on 2026-08-05 and characterises GOAL-PATH-001's next_action as offering
      "exactly three options". This design session read ledger/goals/
      GOAL-PATH-001.yaml on 2026-09-04 and found that field CHANGED: it now
      reads, verbatim in part, "THE THREE-WAY CHOICE IS RE-MADE. DEC-20260810-
      2f92d8 selects option (a), expand the GOAL-DREG-001 ladder under the
      admitted CTRL-B instrument, as the DIRECTION of the next PATH batch". The
      experiment therefore re-reads the CURRENT next_action at run time and
      reports both readings; it does not adopt the proposal's 2026-08-05
      characterisation as current.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the goal's decision is the unstated
      assumption that each next_action option advances the completion criterion
      the batch is being spent against. The audit makes that incidence explicit.
    baseline_embedding:
      parameter_slice: >-
        The trivial case is an edge whose producer and consumer are the SAME
        lane, where the type must match by construction. The extractor must
        return a full four-of-four match there.
      reproduction_check: >-
        A frozen regression fixture: run the extractor on the producer feed's
        own matched baseline symbols, which the consuming protocol requires to
        be in the same fixture subgroup and the same resource schema. It must
        report TYPE MATCH.
    observation_collision:
      observable: >-
        The four-coordinate type tuple (object_class, unit, scale,
        certificate_kind) of a measurement package.
      distinct_preimage_search: >-
        PERFORMED. Infinitely many distinct packages share a type, so the
        projection is enormously many-to-one and no value is recoverable from
        it. The audit asks only whether the arrow is defined and must never be
        cited as saying anything about a value.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The incidence matrix of next_action options against completion
          clauses, with a citation per entry.
        predicted_gain: >-
          Replaces an ambiguous three-way choice with an explicit table in which
          each entry can be falsified by opening the file it cites.
    quantifier_order: >-
      FOR ALL declared feed edges, the four type coordinates of the producer
      match those of the consuming binding. The existential that breaks it is
      THERE EXISTS a declared edge whose object class or unit does not match,
      and the audit's deliverable is the list of such edges.
    method_ceiling:
      strongest_certifiable_claim: >-
        That, as of the artefact versions read and recorded, certain declared
        edges do or do not type-check. It cannot certify that a producing lane
        is worthless, that its mathematics is wrong, or that it should be
        deprioritised, and it establishes nothing about any elliptic curve.
      nearby_object_control: >-
        A pair of records already known to be in the same object class and unit
        (must report MATCH) and an edge already documented as broken in a
        committed supersession block (must report MISMATCH). Two nearby objects
        on which the extractor must give opposite answers.
    proof_obligations:
      - claim: The extractor reports MATCH on a known same-type pair
        responsibility: interface
      - claim: The extractor reports MISMATCH on a known-broken edge
        responsibility: interface
      - claim: Each incidence-matrix entry cites the file and field it rests on
        responsibility: correctness
      - claim: The current next_action is re-read rather than assumed from the source proposal
        responsibility: baseline
      - claim: No output is read as a statement about elliptic curves
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        GOAL-PATH-001's completion criteria, as a disjunction. Quoted verbatim
        from the committed record: "GOAL-ICEX-001 reaches a committed
        Coordinator decision on a charged toy IC-vs-rho exponent within declared
        scope, OR every Tier 0-2 child goal has a committed scoped
        closure/decision that removes its uncertainty without an admissible
        surviving pipeline."
      citation: ledger/goals/GOAL-PATH-001.yaml
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a read the
        completion_criteria block of ledger/goals/GOAL-PATH-001.yaml by pattern
        search in this session and reproduces it verbatim above; the source
        proposal's two-clause characterisation is CONFIRMED faithful. The same
        read found the next_action field CHANGED since the proposal was written
        (see assumptions), and that discrepancy is recorded rather than
        smoothed over. The read was by pattern match over the file, not a
        full-file read; no other field of that record is asserted here.
      role: >-
        Fixes the two clauses the incidence matrix is built against.
  reduction_chain:
    core_problem: >-
      Whether the tier series' declared feed graph is well typed, and therefore
      whether its next_action options are well posed against its own completion
      criteria.
    corollaries: []
  predictions:
    - metric: >-
        number of occurrences of the string DREG in the frozen consuming
        protocol artefact (integer count)
      direction: lower
      minimum_effect: >-
        Exactly 0. A nonzero count falsifies the audit's first row outright and
        the record is withdrawn by a superseding record.
    - metric: >-
        number of declared feed bindings whose producer object class matches the
        consumer cell object class (integer, out of the number of declared
        bindings, which is itself reported as measured)
      direction: different
      minimum_effect: >-
        The source proposal predicts 2 of 3. Any other value means the reading
        of the protocol is wrong and the matrix must be rebuilt from the
        artefact rather than from the proposal.
    - metric: >-
        number of committed, reviewed conversions from the producer resource-
        vector coordinates to the consuming protocol primary coordinate
        (integer count, with paths)
      direction: different
      minimum_effect: >-
        Predicted 0, and this is the prediction most likely to be wrong, which
        is why it is stated. If it is 0, clause 1 is blocked on a missing
        conversion. If it is at least 1, the audit has found the conversion and
        clause 1's critical path is shorter than feared - a strictly good
        outcome the audit is equally happy to report.
    - metric: >-
        number of distinct named residuals gating the two remaining clause-1
        producers (integer count, quoted verbatim from each goal record)
      direction: lower
      minimum_effect: >-
        Predicted 1, a shared residual. If it is 2 there is no shared blocker,
        the fourth row of the matrix disappears, and the audit's most actionable
        finding evaporates.
    - metric: >-
        per-edge graded type score, an integer in {0,1,2,3,4} counting matching
        coordinates among (object_class, unit, scale, certificate_kind)
      direction: different
      minimum_effect: >-
        The distribution is the deliverable and no value is predicted. What IS
        predicted is that the score is not constant across edges: a constant
        score means the extractor has zero comparator spread and the audit is
        vacuous.
    - metric: >-
        number of in-scope non-terminal Tier 0-2 child goals (integer count)
      direction: different
      minimum_effect: >-
        NO PREDICTION IS REGISTERED. The audit has not read all child records
        and MUST NOT guess. The metric is declared so the number is reported
        rather than assumed and clause 2's true width is on the record.
  test_boundary:
    instances:
      - 'Every declared feed edge of the consuming protocol artefact, at the exact version read.'
      - 'Every child goal record listed on GOAL-PATH-001, plus each lane experiment contract and evidence record.'
      - 'Two synthetic control edges with planted type mismatches of known size.'
    parameters:
      type_coordinates: 'object_class, unit, scale, certificate_kind'
      artefact_version_recorded_per_row: true
      compute: none
    implementation: >-
      Reading of committed files plus a small extraction script that records,
      for each coordinate, the file and field it was read from. No computation
      beyond string extraction and table assembly.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 2
  falsification_conditions:
    - >-
      DREG appears in the consuming protocol feed bindings after all. The
      audit's first row is wrong and the record is withdrawn as a superseding
      record.
    - >-
      A committed, reviewed unit conversion is found. The unit objection does
      not bind and clause 1's path is shorter than the audit claims.
    - >-
      The two remaining clause-1 producers are gated on two distinct residuals.
      The shared-blocker row disappears.
    - >-
      The null control fails: the extractor reports a mismatch between a
      producer symbol and its own matched baseline. Nothing the audit reports
      may be believed.
    - >-
      The positive control fails: the extractor does not flag a known-broken
      edge. The instrument is insensitive and no clean bill of health may be
      issued for any other edge.
    - >-
      The graded score is constant across all edges. The extractor has no
      comparator spread and the audit is vacuous.
  interpretation_limits:
    - >-
      A finding that an edge does not type-check is NOT a finding that the
      producing lane is worthless, that its mathematics is wrong, or that it
      should be deprioritised. Each producing lane's own completion criterion is
      untouched by anything here. The revisit condition is stated: if a
      committed conversion between the two object classes is ever produced, the
      corresponding row must be recomputed.
    - >-
      NO STATUS CHANGE, NO next_action REWRITE, and NO reprioritisation is
      proposed or implied. Those are Coordinator decisions, and a frozen
      protocol is immutable - a confirmed defect is carried by a new protocol
      version, never by an edit.
    - >-
      THIS ESTABLISHES NOTHING ABOUT ELLIPTIC CURVES OR THE ECDLP. The audit
      consumes no curve, performs no arithmetic on any group, and produces no
      evidence about any curve. Declared in advance so that no output row can be
      quoted as a mathematical result.
    - >-
      NOT TESTABLE AT REACHABLE SCALE does not apply here in the usual sense:
      the audit has no scale at all. What IS unreachable is any statement about
      whether the measurements the graph would carry, once unblocked, would be
      interesting; the audit says nothing about that and must not be read as
      saying it.
    - >-
      The source proposal's characterisation of GOAL-PATH-001's next_action is
      STALE as of 2026-09-04 (see assumptions). Any conclusion drawn against the
      three-option reading must be restated against the current field.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260805-6a14e3.yaml
    - ledger/goals/GOAL-PATH-001.yaml
    - ledger/goals/GOAL-ICEX-001.yaml
    - ledger/goals/GOAL-SDEG-001.yaml
    - ledger/goals/GOAL-RELN-001.yaml
    - ledger/goals/GOAL-DREG-001.yaml
    - ledger/questions/RQ-ECDLP-002.yaml
    - experiments/EXP-ECDLP-11b20b/specification.yaml
