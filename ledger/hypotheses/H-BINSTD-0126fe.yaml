  title: >-
    On the composite ambient group of ECC2K-130 every exactly sum-compatible
    filter has alphabet in 1, 2, 4, so the exact capacity is 2 bits; the ideal
    k-list tree that would need about 26 bits of alphabet per internal level is
    therefore a CEILING of the k-list column and not a reachable cost; and the
    approximate capacity of the declared Koblitz-specific filter families is
    measurable on toy cells against exact positive controls at 2 and 4.

  statement: >-
    Let E be a binary Koblitz curve and G a finite abelian group written
    additively. Call h from G onto an alphabet of size M EXACTLY SUM-COMPATIBLE
    if there is a combining rule f with h(P + Q) = f(h(P), h(Q)) for all P, Q
    in G and f invertible in each argument.

    (A) CAPACITY CERTIFICATE, unconditional. Theorem C of KN-FIND-ffe1df
    (validator-confirmed there for prime order) re-run on an arbitrary finite
    abelian group: invertibility of f in each argument makes f a quasigroup
    operation, associativity of addition on G forces f associative, an
    associative quasigroup is a group, hence h is a surjective group
    homomorphism onto a group of order M, and Lagrange gives M dividing the
    order of G. The extension from prime order to composite order is a stated
    PROOF OBLIGATION of this hypothesis (obligation PO-1) and not an assumed
    step. Consequence on ECC2K-130, whose ambient group order is 4l with l the
    129-bit prime 680564733841876926932320129493409985129: the divisors of 4l
    are 1, 2, 4, l, 2l, 4l, so every alphabet strictly below l lies in 1, 2, 4
    and the exact capacity of the ambient group below l is log2(4) equal to
    2 bits. AMBIENT: the FULL group of order 4l. On the target subgroup of
    order l the same argument gives capacity 0 bits, because l is prime.

    (B) THE TWO NONTRIVIAL EXACT FILTERS, CONSTRUCTED. The order-2 filter is
    the quotient E onto E/2E, computed on y^2 + xy = x^3 + a x^2 + b as
    P maps to Tr(x(P)) + Tr(a), which is Tr(x(P)) on the ECC2K-130 model with
    a = 0. The criterion is RE-DERIVED IN THIS DESIGN FROM THE GROUP LAW, not
    relayed: Q equals 2P requires a solution of lam^2 + lam = x(Q) + a, which
    over F_{2^n} exists exactly when Tr(x(Q) + a) is 0, so Q lies in 2E exactly
    when Tr(x(Q)) equals Tr(a). The order-4 filter is the quotient E onto
    E/4E, which is cyclic of order 4 whenever the 2-Sylow subgroup is cyclic of
    order 4; the design constructs it as an explicit homomorphism onto Z/4 by
    scalar multiplication and takes the trace pair (Tr(x(P)), Tr(x(P/2))) as its
    cheap presentation on 2E, with the agreement of presentation and
    construction checked at setup. Design finding DF-1 of the audit sheet
    records that the trace pair as literally written is defined only on 2E and
    there takes 2 values, so the alphabet-4 reading belongs to the homomorphism
    onto E/4E on all of E; the contract tests the construction and reports the
    presentation beside it.

    (C) THE CEILING, EXPLICITLY COUNTERFACTUAL. Under the ideal k-list model
    stated in the experiment (k equal to 2^j lists of size L equal to
    N^(1/(j + 1)) over a group of order N, per-attempt cost k times L, factor
    base size B equal to L, relations B without orbit unknowns or B/262 with
    them, linear algebra k times relations squared), with N equal to l for the
    Wagner accounting, an ideal tree at k equal to 16 would need an alphabet of
    about 2^25.80 at each of three internal levels. The exact capacity of (A) is
    4. The gap is therefore about 23.80 bits per internal level, and at the
    exact capacity the same tree costs about 2^101.20 per attempt. The
    ideal-tree totals of the table in the audit sheet are the CEILING of the
    k-list column, CONDITIONAL ON A FILTER THAT (A) EXCLUDES EXACTLY, and are
    not a cost this or any construction reaches. Nothing in this hypothesis
    predicts or asserts any reachable cost below matched rho on ECC2K-130 or on
    any other curve, and the experiment's outcome table states no such cell.
    Any reading of a lead is pre-registered to review-breakthrough at max and
    to independent replication before interpretation.

    (D) THE ONE OPEN NUMBER, WHICH THE EXPERIMENT MEASURES. For a cheap
    NON-homomorphic filter the level-1 bucket gain is
    G(h) equal to M times the maximum over (a, b, c) of
    Pr[h(P + Q) equal to c given h(P) equal to a and h(Q) equal to b].
    PREDICTION, stated so it can fail: on toy prime-l Koblitz cells the exact
    filters read G equal to 2 and G equal to 4 within bootstrap error (the
    positive controls KN-FIND-ffe1df's red team found its own P2 control
    lacked); every declared Koblitz-specific family reads G minus 1 inside the
    random-label null's bootstrap spread at M equal to N^(1/3) and N^(1/4); and
    the excess does not grow along the ladder n in 19, 23, 29, 31. A family
    whose interval excludes the null at every cell, whose fitted slope is
    non-negative, and which survives the matched-marginal shuffle is the LEAD
    branch and is routed, not interpreted.

  statement_note: >-
    Two refinements of IDEA-20260926-136bd3 are recorded here and in the audit
    sheet as design corrections, and the proposal is NOT edited. DC-B1: the
    record's ideal-tree figure 2^24.7 relations at k equal to 8 with orbit
    unknowns is not reproducible under the model the record itself states; the
    recomputation gives 2^24.22 (32.25 minus log2(262) equal to 8.0334), and the
    0.48-bit difference is an arithmetic slip of the record. DC-B2: the
    record's 2^67.5 and 2^68.5 at k equal to 8 without orbit unknowns are the
    SAME line at two stages of the same sum, 67.50 being relations times
    per-attempt cost and 68.50 the total after adding a linear-algebra term of
    exactly equal size; the reconciliation is arithmetic and not a relabelling.
    Both are written out step by step in the audit sheet.

  mechanism: >-
    OBJECT FRAME. Representation R1 of RQ-ECDLP-623a32: the x-coordinate of a
    point of the FULL group E(F_2^n), read in a normal basis where Frobenius is
    a cyclic shift and in the polynomial basis. Operation set Sigma: pairwise
    addition of list elements at ONE merge level of a k-list tree, together
    with Frobenius and negation, under which every filter considered must be
    invariant or equivariant. Sigma is not the full translation action of the
    target subgroup: the legs and the intermediate sums live in E, whose
    translation block systems are the cosets of 2E and 4E (IDEA-20260922-153a90,
    cited by id, not re-litigated).

    TRICHOTOMY, TWO OBJECTS PLACED SEPARATELY. The exact filters are Class I
    partial-action objects: they propagate deterministically under all of Sigma
    because they are homomorphisms of E, and their entire content is the 2-bit
    block system of (A). Every non-homomorphic candidate is Class II BRANCHING:
    h(P + Q) is not a function of (h(P), h(Q)), and G(h) is the branching meter
    read at one level, with b equal to M divided by G.

    LOSSY-PROJECTION TEST AGAINST THE NAMED SIGMA. Every filter discards all of
    x but log2(M) bits, so it is lossy in the representation used, with fibres
    of size about 4l/M. For the exact filters the discard is Sigma-compatible by
    homomorphism and the test passes with L equal to log2(M) in 1, 2 and b
    equal to 1. For the branching filters the discard is compatible only to the
    extent that G(h) exceeds 1, which the experiment MEASURES rather than
    assumes; a filter with G equal to 1 has b equal to M and carries nothing
    forward. The projection is not a change of coordinates in either case.

    WHY A NULL READING WOULD BE ADMISSIBLE AT ALL. The same instrument is made
    to read forced nonzero values on nearby objects where the capacity is not
    2 bits: the composite-order n equal to 17 Koblitz cell, whose exact filters
    of alphabet 548 and 956 must read G equal to M, and the relabelled Z/lZ
    control with the log-interval key, which must read G about M/2 as an
    approximate filter. An instrument that cannot see those cannot assert the
    absence of structure on the prime-l cells.

    THE CEILING IS NOT A MECHANISM. (C) prices what a filter WOULD be worth. It
    proposes no construction, and the design carries it only as the column's
    ceiling under the label of (A)'s exclusion.

  assumptions:
    - >-
      The ECC2K-130 ambient group order is 4l with l the 129-bit prime above,
      and the 2-Sylow subgroup is cyclic of order 4. Both are recomputed and
      proved at setup for every executable cell, and at the deployed row they
      are read from the primary sources named in the experiment; the
      capacity certificate needs only that the proper subgroups have index in
      2, 4, l, 2l, 4l.
    - >-
      The ideal k-list accounting of (C) assumes independent uniformly random
      lists and a filter with G equal to M at every internal level. It is the
      IDEAL bound, is used only to state the ceiling, and is conditional on a
      filter that (A) excludes exactly.
    - >-
      OFF-LIMITS COMPONENT DECLARED: F2, factor-base decomposition, is the
      family. The k-list tree is a JOIN STRATEGY for its decomposition step and
      not a new factor base, so KN-OPEN-020 is engaged only through the
      orbit-union base inherited from KN-FIND-47da4e and charged there. F1 is
      not used. Theorem C of KN-FIND-ffe1df is used as a component and its
      argument re-run on a composite-order group as obligation PO-1.
    - >-
      Arithmetic only at deployed parameters. Every executable cell has n at
      most 31. No k-tree run at deployed parameters is designed, no
      target-dependent filter family is in scope, no level above 1 is measured,
      and IDEA-20260926-d3c5a5's engine is not used.
    - >-
      NO BUDGET QUANTITY IS USED. This hypothesis and its experiment use none
      of the quantities D1 (the floor-to-rho gap 2^-4.41), D2 (the per-target
      oracle budget 2^+5.71) or D3 (the re-optimised per-attempt budget
      2^+11.01) pinned by CORR-20260928-4cb669 at m equal to 4, and assert no
      per-attempt oracle budget of any kind. The only reference quantity is
      matched rho.
    - >-
      Matched rho on ECC2K-130 is 2^60.8090, equal to sqrt(pi l / (4 times
      131)) under CORR-20260922-81aeab's corrected convention, with negation
      and the 131-fold Frobenius class. AMBIENT: the target subgroup of order
      l. It is a reference for the ceiling line only and no outcome of the
      experiment is a comparison against it.

  proof_search_map:
    bottleneck: >-
      The level-1 bucket gain G(h) at alphabet M equal to N^(1/(j + 1)) for
      cheap filters on E(F_2^n) for a Koblitz curve. Every other quantity in
      the k-list route is fixed by (A) and (C): the exact capacity is a
      certificate, the ceiling is arithmetic, and the join floors of the
      proposal's (C3) and (C4) are arithmetic. The bottleneck is
      decision-changing because the k-list column of RQ-BINSTD-b6f698's
      reachability table is currently a prose closure by Theorem C and either
      outcome of the measurement replaces it with a quantity.
    baseline_embedding:
      parameter_slice: >-
        Three slices. (i) Z/2^n with h equal to the low log2(M) bits, which is
        Wagner's own setting: every subgroup 2^i Z/2^n is an exact filter and h
        must read G equal to M exactly. (ii) The relabelled Z/lZ control with
        h equal to the top log2(M) bits of the discrete logarithm: an
        approximate filter that must read G about M/2, top-bits additivity up
        to one carry. (iii) The composite-order Koblitz cell at n equal to 17
        with a equal to 0, whose group order the record states as
        4 times 137 times 239 from t_17 equal to 101: exact filters of alphabet
        548 and 956 must read G equal to M. This is the nearby object where
        the capacity is NOT 2 bits.
      reproduction_check: >-
        SYMBOLIC plus a FROZEN FIXTURE. Symbolic: the capacity argument of (A)
        applied to Z/2^n returns the subgroup filters, applied to
        Z/(4 times 137 times 239) returns every divisor as an admissible
        alphabet including 548 and 956, and applied to Z/4l returns 1, 2, 4
        below l. Frozen fixture: FIXTURE-B1 of the audit sheet, committed as
        code with its pass criteria stated before execution, must report
        G equal to M on the identity, G equal to 1 plus order M^(-1/2) on the
        random label, G equal to 2 on Tr(x), G equal to 4 on the E/4E
        homomorphism, and G equal to M on the alphabet-548 and -956
        homomorphisms of the composite cell, BEFORE any Koblitz-specific arm is
        read on that cell. FIXTURE-B2 commits the two absorbed calibration rows
        with their exact expected readings.
    observation_collision:
      observable: >-
        The pair (M, G(h)) per filter per cell, and the behaviour of G minus 1
        along the ladder n in 19, 23, 29, 31.
      distinct_preimage_search: >-
        TWO distinct objects give a high G reading, and they are the collision
        this design must separate. (i) A genuine approximate homomorphism.
        (ii) A filter whose MARGINAL is skewed, where one heavy bucket makes
        the maximum conditional probability large with no propagation content:
        this is exactly the popcount false positive of RT-EXP-1 recorded in
        KN-FIND-ffe1df, where the matched-marginal shuffle reproduced the
        excess. SEPARATION, mandatory on every arm: shuffle h's values among
        points of equal marginal bucket probability; a genuine signal must be
        destroyed and a marginal artifact preserved. A third preimage, a filter
        that is secretly exact, is separated by checking its kernel against the
        subgroup lattice, which on a prime-l cell admits only index 1, 2, 4.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The k-list tree's filter requirement rewritten as a subgroup-index
          condition on the ambient group. Encoding is exact, because the
          argument of (A) is an equivalence for exact filters; completeness and
          soundness are inherited from the argument re-run under PO-1; transfer
          is to any finite abelian group; cost loss is none.
        predicted_gain: >-
          The exact-capacity cell of the k-list column for ECC2K-130 reads
          2 bits from the cofactor, with the ideal-tree table as the column's
          ceiling. Zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold G(h) fixed and vary the forgotten structure: the prime-order
          target subgroup (predicted G at most 1 plus o(1) for every cheap h),
          the composite ambient group of order 4l (G equal to 2 and 4 exactly
          for the two homomorphic filters), and the composite toy cell at
          n equal to 17 (alphabets 548 and 956 available). The intrinsic
          invariant distinguishing the fibre is the subgroup lattice.
        predicted_gain: >-
          It makes a null reading on the prime-l cells admissible, because the
          same instrument reads forced nonzero values on the nearby objects.
    quantifier_order: >-
      (A) FOR ALL finite abelian groups G and FOR ALL h from G onto an alphabet
      of size M admitting a combining rule f with h(P + Q) equal to
      f(h(P), h(Q)) for all P, Q and f invertible in each argument: M divides
      the order of G and h is a group homomorphism. HENCE on ECC2K-130 every
      alphabet strictly below l lies in 1, 2, 4. (D) FOR THE TESTED cells and
      THE DECLARED filter families ONLY: G(h) minus 1 lies within the
      random-label spread and does not grow along the ladder. NOT CLAIMED:
      anything about undeclared filters; anything about target-dependent
      filters, which are declared out of family and are the widest open class;
      anything about levels above 1, whose inputs are conditioned on level-1
      survival; anything about any cost reachable on any deployed curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130 every exactly sum-compatible filter has alphabet at most
        4, and on toy Koblitz cells at n in 19, 23, 29, 31 the declared
        Koblitz-specific filter families read level-1 bucket gain within the
        stated interval of the random-label null at M equal to N^(1/3) and
        N^(1/4), with the exact filters reading 2 and 4 and the composite cell
        reading its alphabets." It can NEVER certify that no cheap filter
        exists, because the family is declared and therefore incomplete; it
        certifies nothing about the algebraic decomposition route, nothing
        about levels above 1, and nothing about the cost or the security of any
        deployed curve.
      nearby_object_control: >-
        The composite-order n equal to 17 Koblitz cell, where the capacity is
        above 2 bits, and the relabelled Z/lZ log-interval key, an approximate
        filter with G about M/2. Both must read high, or the instrument cannot
        see the object whose absence it would otherwise assert on the prime-l
        cells. Both are blocking controls of the experiment.
    proof_obligations:
      - claim: >-
          PO-1. Theorem C's quasigroup argument holds verbatim on a
          composite-order finite abelian group, giving M dividing the group
          order and h a homomorphism. This is its own proof obligation and is
          not inherited from KN-FIND-ffe1df, which states it for prime order.
        responsibility: correctness
      - claim: >-
          PO-2. The halving criterion on y^2 + xy = x^3 + a x^2 + b is
          Tr(x(Q)) equal to Tr(a) for membership in 2E, re-derived from the
          group law in this design, and the map P to Tr(x(P)) + Tr(a) is a
          surjective homomorphism onto E/2E when the 2-Sylow subgroup is
          non-trivial.
        responsibility: correctness
      - claim: >-
          PO-3. E/4E is cyclic of order 4 when the 2-Sylow subgroup is cyclic
          of order 4, the constructed map onto Z/4 is a surjective homomorphism,
          and the trace pair (Tr(x(P)), Tr(x(P/2))) is its presentation on 2E,
          well defined because the unique 2-torsion point lies in 2E.
        responsibility: correctness
      - claim: >-
          PO-4. The ideal k-list arithmetic of (C) at k in 4, 8, 16, 32 with
          and without orbit unknowns, including the k equal to 8
          reconciliations DC-B1 and DC-B2, under the model stated in the
          experiment.
        responsibility: baseline
      - claim: >-
          PO-5. The subspace-constrained-intermediate floor of the proposal's
          (C3), l times C_3 divided by 2B, evaluating to 2^101.00 times C_3 at
          B equal to 2^27, and the plain two-list join floor of its (C4),
          2 times sqrt(2^131/262) equal to 2^62.48 per relation.
        responsibility: runtime
      - claim: >-
          PO-6. G(h) is estimated with a stated sample size, enumerated seeds
          and a bootstrap interval, and the matched-marginal shuffle is run on
          every arm.
        responsibility: correctness
      - claim: >-
          PO-7. Every cell's group order, the primality of its l, and the
          cyclicity of its 2-Sylow subgroup are recomputed and proved at setup.
          The record's hand values t_19 equal to 797 and t_17 equal to 101 are
          INPUTS to be checked and are never cited as results.
        responsibility: baseline
      - claim: >-
          PO-8. The exact capacity, the ceiling table and the measurement are
          three separable quantities with three separate ambients, and nothing
          here bounds undeclared filters, the algebraic oracle, levels above 1,
          or any deployed curve's cost or security.
        responsibility: scope
      - claim: >-
          PO-9. Interface. The ceiling of (C) is conditional on a filter that
          (A) excludes exactly, and no interface in this design converts it
          into a reachable cost. This obligation is discharged by the
          experiment's outcome table containing no such cell.
        responsibility: interface
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by a filtered k-list decomposition oracle
    prior_best: >-
      Matched rho 2^60.8090 with negation and the 131-fold Frobenius class
      (CORR-20260922-81aeab convention; KN-FIND-aa2efc as scoped by
      CORR-20260928-4cb669). The plain two-list join floor recomputed in this
      design is 2^62.48 group operations per relation, above that reference at
      every arity and base size.
    time_exponent: >-
      NO EXPONENT IS CLAIMED IN EITHER DIRECTION. The unconditional content is
      a capacity certificate of 2 bits, which moves nothing. The ideal-tree
      totals are a CEILING conditional on a filter the certificate excludes
      exactly, and at the exact capacity the same tree costs about 2^101.20 per
      attempt.
    memory_exponent: >-
      For the ceiling, k lists of L points: about 2^33.89 bytes at k equal to 16
      and about 2^39.34 bytes at k equal to 8, under the x-only storage
      convention of the experiment. For the measurement, S sampled pairs per
      cell. Stated beside every time figure in the audit sheet table.
    hidden_cofactor: >-
      The k-list accounting hides sort and hash polylogarithmic factors and the
      multiset symmetry of the summands, a few bits, disclosed rather than
      absorbed. The ceiling is conditional, so the disclosure bears on a
      counterfactual.
    claim_kind: capacity_certificate_plus_control_measurement
    claim_kind_note: >-
      The template enum (exponent_improvement, cofactor_improvement,
      constant_factor) has no value for a record that claims no complexity
      improvement at all. The value above is the proposal's own
      claim_kind, carried, and is a declared departure from the enum recorded
      here rather than a silent one. Read it as: no complexity claim is made.

  heuristic_assumptions:
    - id: HEUR-B1
      short_name: uniform sums
      formal_statement: >-
        For lists L_1 and L_2 of distinct elements of E(F_2^131) drawn without
        structure, the number of ordered pairs (S, T) in L_1 times L_2 whose sum
        lies in a fixed set of 262 targets is distributed as
        Binomial(|L_1| times |L_2|, 262 / 2^131) to first order, uniformly in
        |L_1| and |L_2| below 2^40. The mean is asserted exactly; the Binomial
        SHAPE is the heuristic content.
      random_model_justification: >-
        The quantity is modelled by an occupancy count for independent uniform
        draws into 2^131 cells of which 262 are marked. The mean is exact by
        double counting, so the model is asked only for the shape of the
        fluctuation, which is the same request every van Oorschot-Wiener
        analysis in this program already makes of a rho walk.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            Yield conservation, the exact mean-yield identity, applied here to
            pair sums to fix the mean of the count exactly.
          verified_by: >-
            NOT VERIFIED BY THIS PRODUCER. Cited as relayed by
            IDEA-20260926-136bd3 heuristic H1, whose rigorous_support names it.
            The finding itself was not opened in this session. The reviewer of
            joint J2 is asked to check this discharge.
        - ref: classical balls-in-bins occupancy law
          provenance: recalled
          claim: >-
            For independent uniform draws the count in a fixed rare set is
            asymptotically Poisson-Binomial with the stated mean.
          verified_by: null
      validation_experiment_ids: [EXP-BINSTD-de9678]
      validation_plan: >-
        SAMPLE: on the primary n equal to 19 Koblitz cell, 200 independent list
        pairs at |L_1| equal to |L_2| equal to 2^8, by DIRECT PAIR-SUM COUNTING
        as IDEA-20260926-136bd3 specifies, against 262 fixed targets. No
        decomposition engine is used and IDEA-20260926-d3c5a5's engine is
        excluded. PREDICTED DISTRIBUTION: Binomial(2^16, 262 / #E) at the cell's
        own group order, stated before the run. COMPARISON: chi-squared of the
        observed count histogram against that Binomial, with the statistic and
        its degrees of freedom reported. TAIL CHECK: the maximum observed count
        over the 200 pairs against the Binomial upper tail at that count.
        TRANSFER: none claimed beyond the tested n. The floor arithmetic at
        n equal to 131 uses the exact mean only and no shape.
      falsification_condition: >-
        The chi-squared statistic exceeds its 99th percentile on the tested cell
        with the instrument's self-tests passing, or the maximum observed count
        sits above the Binomial upper tail at probability below 0.01. Either
        refutes HEUR-B1 on the tested cell and puts the (C4) floor's shape, not
        its mean, in question.
    - id: HEUR-B2
      short_name: decay transfer
      formal_statement: >-
        Let F be a declared filter family and G_n(F) its measured level-1 bucket
        gain at M equal to N^(1/3) on the Koblitz cell of degree n. If
        G_n(F) minus 1 lies within the random-label bootstrap spread and is
        non-increasing in N over n in 19, 23, 29, 31, then G_131(F) minus 1 is
        of order N^(-c) for some c greater than 0 at n equal to 131, that is,
        no usable gain. THIS IS A HEURISTIC OF TRANSFER, NEVER A BOUND, and the
        extrapolation distance is about 100 bits of N from 12 bits of measured
        range.
      random_model_justification: >-
        The model is square-root cancellation of character sums along the curve:
        for x-based interval and bit-window filters on prime-field curves,
        KN-FIND-ffe1df's Theorem A-prime bounds the level-1 agreement by 1/M
        plus a Weil-type term of order p^(-1/2), itself conditional on that
        line's H1-prime, which the finding records as largely untraced. No
        binary-field analogue is cited, and none is asserted. HEUR-B2 is the
        WEAKEST LINK of this hypothesis and is measured rather than assumed.
      supporting_results:
        - ref: KN-FIND-ffe1df
          provenance: internal
          claim: >-
            Theorem A-prime at level 1, the bucket-gain statistic
            G equal to M times the maximum conditional bucket probability, and
            the RT-EXP-1 result that every cheap filter tested on E(F_p) decayed
            indistinguishably from the SHA null at M equal to N^(1/3), with
            popcount and digit-sum reproduced exactly by the matched-marginal
            shuffle.
          verified_by: TASK-20260928-6880fc (finding read in full in this session)
        - ref: >-
            Square-root cancellation of character sums on a curve of genus 1
            (the classical statement imitated)
          provenance: recalled
          claim: >-
            RECALLED, NOT RETRIEVED. Used only to name the classical law the
            random model imitates. It supports nothing on its own and no
            binary-field instance of it is claimed.
          verified_by: null
      validation_experiment_ids: [EXP-BINSTD-de9678]
      validation_plan: >-
        SAMPLE: the four-cell ladder itself, per declared family, at
        M equal to N^(1/3) and N^(1/4), with the random label as the reference
        decay on every cell. PREDICTED DISTRIBUTION: the random-label null's own
        bootstrap distribution of G minus 1, measured on the same cell with the
        same code path, is the prediction; no closed form is asserted for the
        Koblitz families. COMPARISON: least-squares fit of log(G minus 1)
        against log N across the four cells with a bootstrap interval on the
        slope, beside the null's fitted slope. TAIL CHECK: the largest
        single-cell excess against the maximum of the null over 1000 resamples.
        TRANSFER ASSUMPTION, STATED: a slope measured over about 12 bits of N
        is carried 100 bits only as a heuristic and never as a bound; the
        record says so wherever the transfer appears.
      falsification_condition: >-
        A declared family whose G minus 1 interval excludes the random-label
        null at every cell of the ladder, whose fitted slope interval excludes
        negative values, and whose matched-marginal shuffle reads below the null
        width. That is the LEAD branch: it falsifies the transfer's premise on
        the tested range and is routed to review-breakthrough at max and to
        independent replication before any interpretation.

  heuristic_note: >-
    (A) is unconditional, subject only to obligation PO-1. (C) is arithmetic
    under the exact mean of HEUR-B1 and is in any case counterfactual. (D)'s
    null prediction is the falsifiable content of this hypothesis and rests on
    HEUR-B2, which the ladder measures. The a-priori expectation is stated so it
    cannot be chosen after the fact: the exact controls read 2 and 4, the
    composite control reads its alphabets, every declared family reads the null
    and does not grow, and the column closes for the declared families with the
    per-level gap as its measured obstruction.

  structural_ingredients:
    - description: >-
        Theorem C: a tree must invert its combining rule in each argument, so
        exact sum-compatibility plus associativity forces h to be a surjective
        homomorphism. Used as a component and re-run on a composite-order group
        under PO-1.
      citation: KN-FIND-ffe1df
      provenance: internal
      verified_by: TASK-20260928-6880fc (finding read in full)
      role: exact capacity from the subgroup lattice
    - description: >-
        Lagrange's theorem and the divisor structure of 4l with l prime, giving
        the admissible alphabets 1, 2, 4 below l.
      citation: elementary finite group theory, written out in the audit sheet
      provenance: internal
      verified_by: TASK-20260928-6880fc (derived in this session; joint J1 re-derives it)
      role: the certificate's arithmetic
    - description: >-
        The halving criterion and the E/2E quotient on a binary curve,
        RE-DERIVED FROM THE GROUP LAW in this design from the solvability of
        lam^2 + lam = x(Q) + a. NOT relayed through IDEA-20260922-1b16d7, whose
        parity statement the round-1 review finds reversed.
      citation: >-
        Fong, Hankerson, Lopez, Menezes, "Field inversion and point halving
        revisited" (2003), as the nearest published statement
      provenance: recalled
      verified_by: null
      role: the order-2 exact filter, used only as re-derived
    - description: >-
        The k-tree algorithm and its accounting: 2^j lists of size about
        N^(1/(j + 1)) over a group with a coordinate-splittable equality, time
        of order k times N^(1/(j + 1)).
      citation: D. Wagner, "A generalized birthday problem", CRYPTO 2002
      provenance: recalled
      verified_by: null
      role: >-
        The ceiling's list sizes. RECALLED, NOT RETRIEVED: no retrieval tool was
        in this producer's surface (impediment IMP-WAGNER of the audit sheet),
        so the accounting is RE-DERIVED from first principles in the audit sheet
        and the citation is a pointer only.
    - description: >-
        Bailey et al.'s normalisation to the lexicographically smallest
        conjugate of x in a normal basis, and the distinguished-point predicate
        on the Hamming weight of x, whose parity is the trace.
      citation: KN-LIT-661e97
      provenance: internal
      verified_by: TASK-20260928-6880fc (entry read in full)
      role: the declared Koblitz-specific filter families
    - description: >-
        Orbit unions of any size exist at n equal to 131 and the
        (representative, shift) parameterisation is cost-neutral at m equal to
        2; orbit unions with a materialised meet-in-the-middle oracle are a
        different trade priced elsewhere.
      citation: KN-FIND-47da4e
      provenance: internal
      verified_by: TASK-20260928-6880fc (entry read in full)
      role: the orbit-unknowns line of the ceiling, which is conditional

  reduction_chain: null

  predictions:
    - metric: exact_capacity_of_the_ambient_group_of_order_4l_below_l (bits)
      direction: different
      minimum_effect: >-
        EXACTLY 2 bits, with the admissible alphabet set exactly 1, 2, 4. Any
        other set refutes the certificate or the group order. Ambient: the full
        group of order 4l.
    - metric: exact_capacity_of_the_target_subgroup_of_order_l (bits)
      direction: different
      minimum_effect: EXACTLY 0 bits, the alphabet set being 1 alone, because l is prime.
    - metric: G_of_the_identity_and_of_the_random_label_on_every_cell (dimensionless)
      direction: different
      minimum_effect: >-
        The identity reads EXACTLY M. The random label reads 1 plus a term of
        order M^(-1/2), inside its own bootstrap interval. Either misreading is
        an instrument defect and blocks every other arm on that cell.
    - metric: G_of_Tr_x_and_of_the_E_over_4E_homomorphism_on_every_prime_l_cell (dimensionless)
      direction: different
      minimum_effect: >-
        EXACTLY 2 and EXACTLY 4 within bootstrap error. These are the positive
        controls KN-FIND-ffe1df's red team recorded as missing there. A
        misreading is an instrument defect and nothing else is read.
    - metric: G_of_the_alphabet_548_and_956_homomorphisms_on_the_composite_n17_cell (dimensionless)
      direction: different
      minimum_effect: >-
        EXACTLY M within sampling error, M being 548 and 956. This is the
        capacity certificate's positive control on the nearby object where the
        capacity is not 2 bits.
    - metric: G_of_the_log_interval_key_on_the_relabelled_ZlZ_control (dimensionless)
      direction: different
      minimum_effect: >-
        About M/2, top-bits additivity up to one carry, inside a factor of 1.5
        of M/2. The far-end positive control for approximate filters.
    - metric: >-
        G_minus_1_of_the_declared_Koblitz_families_at_M_equal_N_pow_1_over_3_and_1_over_4
        (dimensionless)
      direction: different
      minimum_effect: >-
        Inside the random-label null's bootstrap spread on every prime-l cell,
        and the fitted slope of log(G minus 1) in log N across the ladder at
        most 0 with its interval including negative values. A value whose
        interval excludes the null at every cell AND whose slope interval
        excludes negative values AND which survives the matched-marginal
        shuffle is the LEAD branch, which is routed and not interpreted.
    - metric: >-
        branching_b_of_the_x_coordinate_projection_and_of_the_halving_trace_bit
        (absorbed calibration rows of IDEA-20260926-d06324)
      direction: different
      minimum_effect: >-
        EXACTLY b equal to 2 with L equal to 1 for the x-coordinate projection
        on every arm, and EXACTLY b equal to 1 for the halving-trace bit on the
        full group with L equal to 0 on the odd-order subgroup. Either deviation
        is an instrument defect and blocks every other arm.
    - metric: >-
        ideal_k_list_ceiling_table_at_k_in_4_8_16_32_with_and_without_orbit_unknowns
        (log2 group operations, zero compute)
      direction: different
      minimum_effect: >-
        The frozen table of the audit sheet, reproduced to 0.5 bit per entry
        under the model stated in the experiment. CEILING ONLY, CONDITIONAL ON A
        FILTER THE CERTIFICATE EXCLUDES EXACTLY. A recomputation differing by
        more than 0.5 bit localises an arithmetic error in this design or in the
        recomputation, and the k equal to 8 reconciliations DC-B1 and DC-B2 must
        be reproduced as arithmetic.
    - metric: per_level_alphabet_gap_and_closure_cost_at_k_equal_16 (bits, log2 operations)
      direction: different
      minimum_effect: >-
        The gap between the alphabet the ideal tree would need and the exact
        capacity is about 23.80 bits per internal level, and at the exact
        capacity 4 the same tree costs about 2^101.20 per attempt. Design
        figures, reproduced to 0.5 bit.
    - metric: cell_setup_verdicts (group order, primality, cyclic 2-Sylow)
      direction: different
      minimum_effect: >-
        Every admitted cell's order is recomputed, its l proved prime, and a
        point of order 4 exhibited. t_19 equal to 797 and t_17 equal to 101 are
        INPUTS to be checked. A cell failing any check is reported and dropped,
        which is an admission outcome and never evidence.

  test_boundary:
    instances:
      - >-
        PRIMARY executable cell: the Koblitz curve y^2 + xy = x^3 + 1 over
        F_2[t]/(t^19 + t^5 + t^2 + t + 1), the same field as the n equal to 19
        RQ-CERTBIN-836ce2 cell. The record's hand arithmetic gives group order
        2^19 + 1 minus t_19 with t_19 equal to 797, that is 523492 equal to
        4 times 130873 with 130873 prime; the instrument RECOMPUTES the order
        and PROVES the primality before use, and the hand values are inputs.
      - >-
        LADDER: a equal to 0 Koblitz curves at n in 23, 29, 31 with the order
        divided by 4 prime, verified at setup. Cells failing admission are
        reported and dropped.
      - >-
        COMPOSITE-ORDER CONTROL: the a equal to 0 Koblitz curve at n equal to
        17, whose order the record states as 130972 equal to
        4 times 137 times 239 from t_17 equal to 101, recomputed at setup.
      - >-
        ORDINARY-CURVE CONTROL: the n equal to 19 RQ-CERTBIN-836ce2 cell with
        A equal to 46693, B equal to 306147 and cofactor 2, where
        Frobenius-invariant families are undefined and the coordinate families
        must read the same null.
      - >-
        GENERIC CONTROL: Z/lZ with l the primary cell's prime, elements
        relabelled by a recorded random bijection, plus the unrelabelled integer
        representation for the log-interval key.
      - >-
        RC-1 as the calibration arm of the two absorbed d06324 rows, at
        n equal to 17 with f equal to t^17 + t^3 + 1, A equal to 97044,
        B equal to 126251, order recomputed at setup.
      - >-
        DEPLOYED ROW, ARITHMETIC ONLY: ECC2K-130 enters as the capacity
        certificate and the ceiling table. No run touches it and no attack is
        designed against it.
    parameters:
      alphabets: M in N^(1/3) and N^(1/4) per cell, rounded to a power of two, recorded per cell
      samples: S equal to 2^20 uniform ordered pairs per cell, filter and M; 2^18 at n equal to 31
      bootstrap: 1000 resamples, percentile intervals at 95 percent
      seeds: enumerated 0 to 9 per cell, recorded; no random 64-bit seeds
      shuffle: matched-marginal shuffle on every arm, same sample size and seeds
      levels: level 1 only; levels above 1 are excluded
      ceiling_table: k in 4, 8, 16, 32, with and without orbit unknowns, N equal to l for the Wagner accounting
    implementation: >-
      Pure Python, standard library only, at the executor's choice of version,
      named with its version in the manifest. The modules the contract specifies
      are a general-n binary field, normal-basis conversion, the binary group
      law, point halving, the constructed E/2E and E/4E homomorphisms, the
      filter families, the bucket-gain estimator with bootstrap, the
      matched-marginal shuffle, and the (L, b) meter of the two calibration
      rows. No solver, no decomposition engine, no network.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: 21600
      maximum_memory_gb: 4
      maximum_runs: 6
      note: >-
        Advisory machine-protection ceilings under docs/research-budget-policy.md.
        Zero runs exist. See EXP-BINSTD-de9678 budget for the stage split.

  falsification_conditions:
    - >-
      An exactly sum-compatible filter on a prime-l Koblitz cell with alphabet
      strictly between 4 and l, exhibited with its combining rule verified
      exhaustively. That refutes (A) and this hypothesis is withdrawn. It would
      also contradict KN-FIND-ffe1df's argument, so it is a contradiction claim
      under AGENTS.md rule 12 and routes to review-breakthrough at max.
    - >-
      Tr(x) or the constructed E/4E homomorphism fails to read G equal to 2 or
      4 on any prime-l cell. Instrument defect; nothing else on that cell is
      read.
    - >-
      The composite n equal to 17 control fails to read G equal to M on its
      alphabet-548 or -956 homomorphism. The instrument cannot see capacity and
      no null on any cell is admissible.
    - >-
      A declared family meets the pre-registered lead threshold of
      EXP-BINSTD-de9678. The null prediction of (D) is falsified on the tested
      range; the route is live and is ROUTED to review-breakthrough at max and
      to independent replication before any interpretation. This is the most
      valuable outcome and the design states no cost consequence for it.
    - >-
      A recomputation of the ceiling table disagrees with the frozen table by
      more than 0.5 bit on any entry, or the k equal to 8 reconciliations
      DC-B1 and DC-B2 do not come out as arithmetic. An arithmetic error in
      this design, corrected by a new record before any use.
    - >-
      HEUR-B1 or HEUR-B2 meets its own falsification_condition. Each heuristic
      is refuted only through its own condition.
  falsification_note: >-
    An instrument failure, a failed exact control, a failed calibration row, a
    dropped cell, a timeout, a crash or an unreachable source invalidates the
    affected arm and is NEVER evidence against this hypothesis, however often a
    deterministic defect replicates (AGENTS.md core rule 5).

  interpretation_limits:
    - >-
      Specified, not approved. No run exists. Approval is solely the act of
      DEC-20260928-9d9c47 naming EXP-BINSTD-de9678.
    - >-
      NO ATTACK AND NO SPEEDUP. The hypothesis certifies a capacity, records a
      ceiling, and measures a control. Its expected outcome is a closure of the
      k-list column FOR THE DECLARED FAMILIES with a named exact obstruction and
      a measured per-level gap.
    - >-
      THE CEILING IS COUNTERFACTUAL. Every ideal-tree total is conditional on a
      filter that (A) excludes exactly. It is the column's ceiling, never a
      reachable cost, never a prediction, and never an outcome. No sentence of
      this record or of its experiment asserts a cost below matched rho on
      ECC2K-130 or on any curve.
    - >-
      THE ORBIT-UNKNOWNS LINE IS CONDITIONAL, TWICE OVER. Under
      CORR-20260925-649e25 the relations-equal-B/262 framing is a PER-ORBIT
      relation-count framing, conditional on a per-orbit unit that NO APPROVED
      CONTRACT HAS FIXED, and it is cited only as a dependency. The
      WITHOUT-ORBIT line is the unconditional one of the pair, and both lines
      sit under the conditional label of the previous item.
    - >-
      Levels above 1 of a tree are not measured, their inputs being conditioned
      on level-1 survival. A level-1 null is evidence, not a proof, exactly as
      KN-FIND-ffe1df records for the prime field.
    - >-
      Target-dependent filters, where h depends on the target, are declared out
      of the family and are named as the widest open class, following that
      finding's own item 9.
    - >-
      Toy tier for every measurement, n at most 31 against a deployed degree of
      131. A null at n at most 31 is not a null at n equal to 131; the decay
      ladder is the only transfer evidence and it is HEUR-B2, a heuristic and
      never a bound.
    - >-
      KN-OPEN-020 class: the orbit-union base of the ceiling is
      implicit-membership (KN-FIND-47da4e); the filter measurement uses no
      factor base at all.
    - >-
      This hypothesis asserts nothing about any curve's security, about whether
      index calculus beats rho on any curve, about any oracle meeting any
      budget, or about the AUXIN, FROB or QSP work of this program. It uses no
      D1, D2 or D3 quantity and asserts no per-attempt oracle budget.
    - >-
      FORWARD GUIDANCE regardless of outcome: the k-list objects NOT priced here
      are filters that read the discrete logarithm (closed by definition),
      target-dependent filters, and algebraic joins that are not rectangle
      covers, the last being the chained Semaev system, which is the SEMBIN
      questions'.

