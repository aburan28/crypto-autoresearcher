# sum-compatible filter capacity of the ambient group (a certificate), the
# ideal-tree cost table as that column's CEILING (a counterfactual conditional
# on a filter the certificate excludes), and the APPROXIMATE capacity of
# declared Koblitz-specific filter families (a controlled measurement at toy
# scale).
#
# Specified by TASK-20260928-6880fc (lane B of BATCH-d34db1, GOAL-ECDLP2M-001)
# from IDEA-20260926-136bd3 under DEC-20260928-63addc selected S2 scope and
# design_conditions C1 to C8, absorbing the two exact calibration rows of
# IDEA-20260926-d06324 (x-coordinate projection, b = 2; halving-trace bit,
# b = 1) and its controls on RC-1 as the calibration of the bucket-gain
# instrument. Read with CORR-20260928-4cb669, CORR-20260925-649e25 and
