hypothesis:
  id: H-FNDSA-58b464
  question_id: RQ-FNDSA-001

  statement: >-
    SCOPE: the second-moment tensor of the signature cloud produced by a
    Klein-family sampler at width sigma, tracked along the width homotopy
    that connects Babai nearest-plane signing (the NTRUSign map, sigma tending
    to 0) to the trapdoor-independent regime (sigma above the smoothing
    parameter). Empirical validation at toy lattice dimension n in {8, 16, 32}
    and at isolated leaf widths in {0.45, ..., 0.70}; standardized parameter
    sets entered BY DERIVATION ONLY. CLAIM TIER: toy for measurements,
    derivation for closed forms. NO ATTACK IS CLAIMED AND NO EXPONENT MOVES.
    THE CLAIM, IN FOUR PARTS.
    (A) FIRST-ORDER LEAF LAW. With eps = exp(-2 pi^2 s^2), the discrete
        Gaussian D_{Z, s, c} has mean bias
        E[z - c] = -4 pi s^2 eps sin(2 pi c) + O(eps^4) and second moment
        about the center
        E[(z - c)^2] = s^2 (1 - 8 pi^2 s^2 eps cos(2 pi c)) + O(eps^2).
        The anisotropy is FIRST order in eps at fixed center.
    (B) EXACT SECOND-ORDER CANCELLATION. Averaged over a uniform center, the
        first-order terms vanish; the two surviving second-order
        contributions -- the c-average of the second moment, which exceeds
        s^2 by 8 pi^2 s^4 eps^2, and the variance of the mean bias, which
        equals 8 pi^2 s^4 eps^2 -- ARE EQUAL. Hence the WITHIN-CENTER
        variance equals s^2 through order eps^2, while the POOLED second
        moment retains a relative inflation of exactly 8 pi^2 s^2 eps^2.
        THE POOLED ANISOTROPY IS QUADRATIC IN eps, NOT LINEAR.
    (C) FORCED VALUES AT THE STANDARDIZED CONSTANTS (recalled, Stage-0
        replaceable): relative anisotropy 8 pi^2 sigma_min^2 eps_0^2 =
        2^-85.99 at FN-DSA-512 and 2^-88.94 at FN-DSA-1024; implied signature
        counts N_moment = 1 / (d delta^2) = 2^161.98 and 2^166.89; hence the
        moment channel is 79.0 and 82.0 BITS WORSE than the normalizer
        channel of H-FNDSA-6a9cbb, and 98 and 103 bits outside the design
        query bound q_s = 2^64.
    (D) THE MEASURABLE CONSEQUENCE. Along the width homotopy the pooled
        anisotropy must decay as eps^2 = exp(-4 pi^2 s^2) with coefficient
        8 pi^2 s^2, MONOTONICALLY, from a value of order 1 at the Babai
        endpoint to below any representable double at s = 3.0. The fitted
        decay exponent alpha in (anisotropy) proportional to eps^alpha is
        PREDICTED TO BE 2.00 with tolerance 0.15.
    WHAT MAKES THE HYPOTHESIS FALSIFIABLE RATHER THAN DECORATIVE: the entire
    79-bit separation rests on HEUR-FN-5, the uniformity and independence of
    the leaf centers in the REAL recursion. If the centers are correlated --
    which a defective or reduced-precision ffSampling would produce -- the
    first-order term of (A) survives averaging, alpha measures 1.00 instead of
    2.00, and N_moment collapses from 2^161.98 to about 2^68.98 -- which would
    make the moment channel STRONGER than the normalizer channel by 14 bits
    and would reverse this record's whole conclusion. A MEASURED alpha NEAR 1.00 IS THEREFORE THE MOST
    VALUABLE OUTCOME AVAILABLE FROM THIS HYPOTHESIS, and the ladder exists to
    look for it.

  mechanism: >-
    DERIVED IN-RECORD; every closed form below was checked during ideation
    against direct summation of the defining series, OUTSIDE THE HARNESS on
    this machine, and must be re-derived and re-checked in-harness before
    citation.

    THE HOMOTOPY AND WHY sigma IS THE RIGHT PARAMETER. Klein's sampler draws
    z_i from D_{Z, sigma_i, c_i} with sigma_i = sigma / ||b~_i||. As
    sigma_i tends to 0 the distribution concentrates on round(c_i), the
    algorithm becomes Babai's nearest plane in the Gram-Schmidt frame, and the
    output offset is spread over the fundamental parallelepiped of that frame
    -- the NTRUSign signing map, whose covariance is
    diag(||b~_i||^2 / 12) in the Gram-Schmidt frame and therefore encodes the
    secret profile directly. As sigma_i grows past the smoothing parameter the
    per-direction variance becomes sigma_i^2, the contribution to the
    covariance in each Gram-Schmidt direction becomes
    ||b~_i||^2 sigma_i^2 = sigma^2, and the covariance becomes sigma^2 times
    the identity -- isotropic and trapdoor-independent. sigma is thus
    literally the parameter designed to destroy the parallelepiped signal, and
    the inventor protocol's structural tell applies with a DERIVED decay law
    rather than an expectation.

    THE COVARIANCE IS EXACTLY DIAGONAL IN THE SECRET FRAME. Because the leaf
    draws are independent given their centers, M = E[s s^T] decomposes as
    sum over i of v_i b~_i b~_i^T / ||b~_i||^2 with
    v_i = ||b~_i||^2 Var(z_i). No cross terms survive. This is why a closed
    form exists at all and it is a structural fact, not an approximation.

    (A), DERIVED BY DIFFERENTIATING THE THETA SERIES. Poisson summation gives
    Z_s(c) = s sqrt(2 pi) (1 + 2 eps cos(2 pi c) + O(eps^4)) with
    eps = exp(-2 pi^2 s^2). Then E[z - c] = s^2 d(log Z_s)/dc, which to first
    order is -4 pi s^2 eps sin(2 pi c); and
    E[(z - c)^2] = s^2 + s^4 d^2(log Z_s)/dc^2 + ..., which to first order is
    s^2 (1 - 8 pi^2 s^2 eps cos(2 pi c)). NUMERICAL CONFIRMATION, IDEATION
    SESSION: at s = 0.8 the closed form gives E[(z - c)^2] = 0.6398944965 at
    c = 0 against a directly summed 0.6398944972, relative agreement 1.1e-9;
    the same comparison at s = 0.7, 0.6, 0.5 gives 3.1e-7, 3.8e-5, 2.1e-3,
    a sequence consistent with the O(eps^2) remainder and therefore a check on
    the derivation rather than on the arithmetic alone. The mean-bias closed
    form -4 pi s^2 eps sin(2 pi c) reproduced the directly summed value at
    c = 0.25 to five significant figures at all eight widths tested.

    (B), THE CANCELLATION, WHICH IS THE ENTIRE CONTENT. Average over c uniform
    on [0, 1). The cos and sin terms integrate to zero, so the leading effect
    is second order. Two contributions and they are equal:
      (i) c-average of E[(z - c)^2] = s^2 (1 + 8 pi^2 s^2 eps^2) + O(eps^3);
      (ii) Var over c of the mean bias
           = E[(4 pi s^2 eps sin(2 pi c))^2] = 8 pi^2 s^4 eps^2.
    Therefore E_c[Var_z(z | c)] = (i) - (ii) = s^2 + O(eps^3): the
    WITHIN-CENTER variance is clean to second order. The POOLED second moment,
    which is what an observer without the centers measures, keeps (i) and so
    has relative inflation 8 pi^2 s^2 eps^2.
    NUMERICAL CONFIRMATION, IDEATION SESSION: the ratio of
    (c-averaged second moment / s^2 - 1) to eps^2 was measured at
    16.005, 19.742, 23.885, 28.425, 38.689 for s = 0.45, 0.50, 0.55, 0.60,
    0.70 against the derived 8 pi^2 s^2 = 15.995, 19.739, 23.885, 28.425,
    38.689 -- agreement to four significant figures at four of five points and
    to three at the smallest width, where the O(eps^3) remainder is largest.
    The mean-bias variance was independently measured as
    (4 pi s^2 eps)^2 / 2 and matched to five significant figures at all five
    widths. THE TWO QUANTITIES WERE COMPUTED BY DIFFERENT ROUTES AND CAME OUT
    EQUAL; the plausible structural cause, and the thing a symbolic
    re-derivation must confirm, is that both are the square of the same first
    Fourier coefficient.

    (C), THE COST BOOKKEEPING. The attacker estimates M from N signatures. A
    sample covariance entry has noise Theta(sigma^2 / sqrt(N)), so a relative
    anisotropy delta needs N = Theta(1 / delta^2), improved by at most the
    number of poolable directions: N = Theta(1 / (d delta^2)) (HEUR-FN-6,
    stated at its optimistic end so the reported separation is conservative in
    the attacker's favour). PER-ATTEMPT COST TIMES INVERSE SUCCESS
    PROBABILITY: one signature query plus O(d^2) accumulation work per sample,
    O(d^2) memory for the running matrix, times 1 / (N d delta^2). With
    delta = 8 pi^2 sigma_min^2 eps_0^2 = 1.3018e-26 = 2^-85.99 and d = 1024,
    N_moment = 2^161.98; at n = 1024, delta = 1.6798e-27 = 2^-88.94 and
    d = 2048, N_moment = 2^166.89.

    (D), AND WHY THE HYPOTHESIS IS ABOUT A MEASURABLE EXPONENT RATHER THAN A
    BIG NUMBER. Everything above is a statement about ISOLATED leaves with
    uniform centers. In the real recursion the centers are produced by the
    tower splitting and their joint law is unknown to this program. The
    hypothesis therefore stakes itself on a measurable exponent: fit
    (pooled anisotropy) proportional to eps^alpha along the width ladder in a
    FULL toy sampler. alpha = 2.00 confirms the cancellation survives the
    recursion and the 79-bit separation stands. alpha = 1.00 means it does
    not, the separation reverses to about 14 bits in the moment channel's
    favour, and the moment channel returns as the leading live object -- which would redirect the campaign back toward
    the historically successful attack family. Both outcomes are useful and
    the design commits to reporting whichever occurs.

  assumptions:
    - >-
      FROZEN DEFINITIONS, fixed before any evaluation.
      (1) rho_s(x) = exp(-x^2 / (2 s^2)); eps(s) = exp(-2 pi^2 s^2).
      (2) Pooled anisotropy of leaf i is defined as
          E[(z - c)^2] / s^2 - 1 averaged over c uniform, and of the lattice
          cloud as max_i v_i / min_i v_i - 1 with
          v_i = ||b~_i||^2 Var(z_i).
      (3) Derived law: pooled leaf anisotropy = 8 pi^2 s^2 eps(s)^2 + O(eps^3).
      (4) N_moment = 1 / (d delta^2) with delta the relative anisotropy.
      (5) The recalled parameter table is identical to H-FNDSA-6a9cbb's and
          is a Stage-0 input: q = 12289; sigma_min 1.277833697 and
          1.298280334; d = 1024 and 2048.
      No other degree of freedom exists; any post-hoc change is an amendment,
      never an edit.
    - >-
      THE ALIGNMENT METRIC USES SECRET INFORMATION BY CONSTRUCTION. Measuring
      how well the empirical covariance eigenvectors match the TRUE
      Gram-Schmidt frame requires knowing that frame. Every recovery figure
      produced this way is an UPPER BOUND on attacker capability and must be
      labelled as such in every sentence that quotes it. This is not a
      limitation to be noted once; it changes what the number means.
    - >-
      TOY DIMENSION DOES NOT MODEL n = 512 FOR THE POOLING FACTOR. The decay
      law in sigma is a property of the individual leaf and should transfer;
      the factor d and the center correlation structure are properties of
      dimension and must not be extrapolated from n = 32 to n = 512. The two
      are reported separately and never as one curve.
    - >-
      INSTRUMENT LINEAGE: NONE. This corpus contains no covariance or
      higher-moment measurement of any signature cloud, for any scheme. Every
      control must establish itself within the paired contract.

  proof_search_map:
    bottleneck: >-
      Whether the pooled second-moment anisotropy of a Gaussian-sampled
      hash-and-sign signature cloud is linear or quadratic in
      eps = exp(-2 pi^2 sigma_i^2). One power of eps is 46.5 bits at FN-DSA
      parameters, and the answer decides whether the NTRUSign-lineage moment
      attacks are 79 bits behind the best distributional channel or level with
      it. Nothing else in the moment family matters until this is settled, and
      it is settled by one symbolic derivation plus one ladder.
    baseline_embedding:
      parameter_slice: >-
        sigma tending to 0 at fixed lattice, which reproduces Babai
        nearest-plane signing exactly: the offset is the deterministic
        rounding error, the covariance in the Gram-Schmidt frame is
        diag(||b~_i||^2 / 12), and the parallelepiped-learning family applies
        by construction. This is the historical baseline the whole analogy
        rests on, reached as a limit of the object under study rather than as
        a separate scheme.
      reproduction_check: >-
        FROZEN FIXTURE, NOT YET RUN. At n = 8 and sigma_i = 0.05 the sampler
        must reproduce the parallelepiped covariance
        diag(||b~_i||^2 / 12) to within 5 per cent per direction from 10^5
        samples, with the eigenvectors aligning to the true Gram-Schmidt
        frame within 5 degrees. If it does not, the toy implementation is not
        the baseline and no statement about the homotopy may be made. A curve
        that merely resembles a parallelepiped is not a reproduction; the
        check is against the exact per-direction variances.
    observation_collision:
      observable: >-
        The pooled covariance M, its anisotropy ratio A, and the alignment of
        its eigenvectors with the Gram-Schmidt frame.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS DESIGNED INTO THE EXPERIMENT AS AN ARM.
        Two secret bases with the SAME multiset of Gram-Schmidt norms but
        DIFFERENT frames produce the SAME anisotropy ratio A and the same
        eigenvalue spectrum, while differing in eigenvectors. The scalar A is
        therefore NOT identifying for the trapdoor and any conclusion drawn
        from A alone is a conclusion about the norm profile only. SEPARATING
        CONDITION: the eigenvector alignment, which does distinguish them --
        and which requires knowing the frame, so it separates them for the
        EXPERIMENTER and not for an attacker. That asymmetry is the honest
        content of the collision and it is why the paired contract requires
        both statistics to be reported.
        A SECOND COLLISION, ON THE OTHER SIDE: at sigma above the smoothing
        parameter, EVERY key produces the same isotropic covariance to
        O(eps^2). Two ground-truth objects on opposite sides of the claimed
        conclusion -- a real trapdoor and a random rotation -- share the
        observable. That is exactly the design goal of the scheme, so the
        collision here is a confirmation of the mechanism rather than a
        falsifier, and the record distinguishes the two roles rather than
        counting the collision twice.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          Rather than bounding the anisotropy at the standardized width
          directly, where it is unmeasurable, randomize the location of the
          measurement along a continuous width ladder and charge the whole
          family to a single derived potential 8 pi^2 s^2 eps(s)^2. The
          ladder's six rungs each test the same potential at a different
          scale, so a failure at any rung localises where the potential stops
          describing the object.
        predicted_gain: >-
          Turns an unmeasurable quantity at sigma_min into a measurable
          exponent at sigma near 0.5, with 20 orders of magnitude of
          extrapolation carried by a derived law rather than by assertion.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (anisotropy ratio) fixed and vary the forgotten
          structure (the Gram-Schmidt frame at fixed norm profile). Ask
          whether any intrinsic invariant available to a public observer
          distinguishes the resulting objects.
        predicted_gain: >-
          Predicted none, which bounds the whole moment family to
          norm-profile recovery rather than key recovery. A found invariant
          would falsify that bound and would be far more interesting than the
          bound.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXISTS one closed form -- the single
      expression 8 pi^2 s^2 eps(s)^2, with no parameter fitted to any
      measurement -- such that FOR ALL widths s in the tested ladder, FOR ALL
      toy keys, and FOR ALL seeds, the measured pooled anisotropy matches it
      within the stated tolerance.
      THE WEAKER ORDER -- FOR ALL widths THERE EXISTS a coefficient fitting
      that width -- is trivially satisfiable, is NOT claimed, and is not
      admissible as a result. In particular, fitting alpha and K separately at
      each rung and reporting the fits is descriptive; the claim is that ONE
      (alpha, K) = (2.00, 8 pi^2) fits all six.
      THE TRAP BEING HUNTED: HEUR-FN-5 quantifies over leaves and messages
      ("for all leaves, the center is near-uniform"). If uniformity holds only
      ON AVERAGE over leaves while some leaf is strongly biased, the average
      anisotropy is quadratic while a SINGLE DIRECTION is linear -- and an
      attacker gets to choose the direction. The experiment therefore reports
      the MAXIMUM over leaves and not only the mean, because the quantifier
      order in the attack is existential in the leaf.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that the pooled second-moment anisotropy of a Klein-family
        sampler decays as exp(-4 pi^2 sigma_i^2) with coefficient
        8 pi^2 sigma_i^2, verified at six widths and three toy dimensions,
        and that the moment channel is consequently Pareto-dominated by the
        normalizer channel at the derived constants. It CANNOT certify: that
        no moment-like attack exists (higher moments beyond the second are
        untouched); that FN-DSA is secure; that any implementation realizes
        the exact-arithmetic law; or anything about a real ffSampling
        recursion at n = 512. Writing it up as a closure of the moment family
        would be the premature-closure failure mode.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS IS BUILT INTO
        THE HOMOTOPY AND IS ITS BEST FEATURE: the Babai endpoint at
        sigma_i = 0.05 is the same lattice, the same code path, the same
        statistic, and the same keys, with the conclusion (no exploitable
        anisotropy) EMPHATICALLY FALSE. A method that cannot separate
        sigma_i = 0.05 from sigma_i = 3.0 has not identified the load-bearing
        structure, which is the width. This is a stronger nearby-object
        control than most, because the two objects differ in exactly one
        scalar parameter and everything else is held identical.
        SECOND CONTROL, ON THE STATISTIC RATHER THAN THE OBJECT: two keys with
        matched Gram-Schmidt norm profiles and different frames must give the
        same anisotropy ratio. A method that gives different ratios is
        responding to something other than the profile.
    proof_obligations:
      - claim: >-
          The mean-bias and second-moment first-order forms in (A), against
          direct summation at every ladder width.
        responsibility: correctness
      - claim: >-
          The exact second-order cancellation in (B), by symbolic
          re-derivation and not only by numerical coincidence.
        responsibility: correctness
      - claim: >-
          The covariance is exactly diagonal in the Gram-Schmidt frame, i.e.
          leaf draws are independent given their centers in the implemented
          sampler.
        responsibility: interface
      - claim: >-
          N_moment = 1 / (d delta^2) with the pooling factor stated at its
          optimistic end, so the reported separation is conservative.
        responsibility: strictness
      - claim: >-
          The Babai endpoint reproduces diag(||b~_i||^2 / 12) and recovers the
          frame; without it no negative is reportable.
        responsibility: baseline
      - claim: >-
          Toy dimension bounds the decay law only, never the pooling factor,
          and every citation carries that gap.
        responsibility: scope

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No complexity improvement is claimed. The hypothesis
    produces a CHANNEL SEPARATION -- 2^161.98 against 2^83.00 in signature
    count, and O(n^2) against O(1) in memory -- which is a Pareto statement
    about two observables and not an attack cost. The moment channel is
    dominated on every axis by the normalizer channel of H-FNDSA-6a9cbb, and
    recording that domination is the deliverable.

  heuristic_assumptions:
    - id: HEUR-FN-5
      formal_statement: >-
        FOR ALL accepted keys and FOR ALL leaves i and distinct pairs (i, j),
        under a uniformly random message hash the leaf-center fractional parts
        satisfy |E[cos(2 pi c_i)]| <= 2^-10 and
        |E[cos(2 pi c_i) cos(2 pi c_j)]| <= 2^-10, so that the first-order
        anisotropy term -8 pi^2 sigma_i^2 eps_i cos(2 pi c_i) averages away
        and the pooled anisotropy is 8 pi^2 sigma_i^2 eps_i^2.
      random_model_justification: >-
        PARTIAL, AND THE GAP IS THE LOAD-BEARING ONE IN THIS RECORD. The root
        center is uniform because the message hash is; each subsequent center
        is an affine image of a residual whose distribution is a discrete
        Gaussian above the smoothing parameter, which is near-uniform modulo
        one -- that supports the MARGINAL bound. The JOINT bound is not
        supported. THE FAILURE DIRECTION IS UNSAFE AND EXPENSIVE: a surviving
        first-order term replaces delta = 8 pi^2 s^2 eps^2 = 2^-85.99 by
        delta = 8 pi^2 s^2 eps = 2^-39.49 at FN-DSA-512, dropping N_moment from
        2^161.98 to about 2^68.98 -- still 5 bits OUTSIDE the design query
        bound q_s = 2^64, but BELOW the normalizer channel's 2^83.00, which
        would make the moment channel the STRONGER of the two rather than
        the weaker.
        THE ENTIRE SEPARATION, AND THE ENTIRE SAFETY OF THE MOMENT CHANNEL,
        IS THIS ONE UNPROVED BOUND, and the record states it in those terms
        rather than burying it.
      supporting_results: []
      validation_experiment_ids: [EXP-FNDSA-177099]
      falsification_condition: >-
        MEASURED AND REPORTED BEFORE ANY DERIVED SEPARATION IS REPORTED. In a
        toy recursive sampler at n in {8, 16, 32} over at least 10^6 messages,
        report the MAXIMUM over leaves of |E[cos(2 pi c_i)]| and the MAXIMUM
        over pairs of |E[cos cos]| -- maxima, not means, because the attacker
        chooses the leaf. If either exceeds 2^-5, HEUR-FN-5 is refuted at the
        tested dimension, the 79-bit separation is withdrawn, and the record
        must report both the eps and eps^2 regimes with the measured crossover.
    - id: HEUR-FN-6
      formal_statement: >-
        Detecting a relative covariance anisotropy delta in dimension d from N
        samples requires N = Theta(1 / (d delta^2)), i.e. the d directions can
        be pooled coherently.
      random_model_justification: >-
        Standard sample-covariance concentration gives N = Theta(1 / delta^2)
        per direction; the factor d assumes the anisotropy has a known common
        shape across directions, which it does not in general. The bound is
        therefore stated at its OPTIMISTIC end, which makes N_moment SMALLER
        and the claimed separation SMALLER -- conservative in the direction
        that matters. If pooling is unavailable the moment channel is a
        further 10 bits worse at n = 512 and the separation grows to 89 bits.
      supporting_results: []
      validation_experiment_ids: [EXP-FNDSA-177099]
      falsification_condition: >-
        Measure the detection threshold directly at three toy dimensions and
        check the 1 / (d delta^2) scaling in BOTH arguments. A measured
        scaling without the d factor means the reported separation was
        understated and must be corrected upward, which is a correction and
        not a refutation; a scaling steeper than 1 / d means the estimator is
        exploiting structure the derivation does not describe and must be
        investigated before any number is quoted.

  structural_ingredients:
    - description: >-
        Poisson summation for the discrete Gaussian normalizer and its
        derivatives, giving the mean bias and second-moment modulation.
      citation: >-
        Classical; DERIVED IN-RECORD and numerically confirmed against direct
        summation at eight widths and four centers during ideation. No
        citation is asserted.
      role: supplies the first-order law (A) and, by squaring, the second-order law (B)
    - description: >-
        The degeneration of Klein's randomized nearest plane to Babai's
        deterministic nearest plane as the width tends to zero, giving a
        continuous path from the standardized scheme to the historically
        broken one.
      citation: >-
        Elementary and derived here; the identification of the zero-width
        limit with the NTRUSign signing map is RECALLED, UNVERIFIED and is a
        Stage-0 reading task.
      role: converts an analogy into a homotopy with a measurable parameter
    - description: >-
        The learning-a-parallelepiped attack family as the historical
        demonstration that the zero-width endpoint is exploitable.
      citation: >-
        RECALLED, UNVERIFIED (Nguyen-Regev; no paper read, no number used).
        THE EXPERIMENT DOES NOT DEPEND ON IT: the positive control establishes
        exploitability at the endpoint by its own measurement.
      role: motivation only; explicitly not load-bearing

  reduction_chain:
    core_problem: >-
      Determine whether the pooled second-moment anisotropy of a Klein-family
      signature cloud is linear or quadratic in exp(-2 pi^2 sigma_i^2), and
      hence whether the NTRUSign-lineage moment attacks are level with or far
      behind the normalizer channel at FN-DSA parameters.
    corollaries:
      - >-
        A Pareto ordering of the goal's two candidate distributional channels
        on time, memory and queries simultaneously, which tells the campaign
        which of its remaining batches are worth spending.
      - >-
        A reusable graded control -- the width homotopy with a derived decay
        law and a historically broken endpoint -- applicable to any
        Gaussian-sampled hash-and-sign scheme, not only FN-DSA.
    corollaries_note: >-
      NO reduction to any statement about FN-DSA's security, about key
      recovery, or about higher moments is claimed. In particular the
      fourth-moment statistic that broke NTRUSign is NOT analysed here; only
      the second moment is, and a second-moment bound does not bound the
      fourth. That gap is named as the successor question rather than elided.

  predictions:
    - metric: >-
        P1 -- symbolic verification that the two second-order contributions
        are exactly equal
      direction: different
      minimum_effect: >-
        EXACT EQUALITY, established symbolically and not only numerically.
        THIS IS THE ZERO-COMPUTE PRIMARY GATE: if they are not equal, the
        pooled anisotropy is O(eps) and the entire 79-bit separation reverses.
    - metric: >-
        P2 -- fitted decay exponent alpha in (pooled leaf anisotropy)
        proportional to eps^alpha over the six-rung ladder
      direction: different
      minimum_effect: >-
        2.00, tolerance 0.15, at the ISOLATED leaf.
    - metric: >-
        P3 -- fitted coefficient K in (pooled leaf anisotropy) = K s^2 eps^2
      direction: different
      minimum_effect: >-
        8 pi^2 = 78.957, tolerance 10 per cent. Pre-derived reference values
        of 8 pi^2 s^2 at s = 0.45, 0.50, 0.55, 0.60, 0.65, 0.70 are 15.995,
        19.739, 23.885, 28.425, 33.362, 38.689; ideation-session direct
        summation returned 16.005, 19.742, 23.885, 28.425, not measured,
        38.689.
    - metric: >-
        P4 -- fitted alpha in the FULL recursive toy sampler at n in
        {8, 16, 32}
      direction: different
      minimum_effect: >-
        2.00, tolerance 0.15. A measured 1.00 plus or minus 0.15 means the
        recursion breaks the cancellation, HEUR-FN-5 fails, and the moment
        channel returns to parity with the normalizer channel. THIS IS THE
        OUTCOME THAT WOULD MATTER and the design commits to reporting it.
    - metric: >-
        P5 -- Babai-endpoint reproduction: per-direction variance at
        sigma_i = 0.05 against the derived ||b~_i||^2 / 12, and eigenvector
        alignment with the true Gram-Schmidt frame
