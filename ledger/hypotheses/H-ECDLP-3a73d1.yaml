hypothesis:
  id: H-ECDLP-3a73d1
  question_id: RQ-ECDLP-002
  question_ids:
    - RQ-ECDLP-002
    - RQ-ECDLP-623a32
    - RQ-CRYPTO-001
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-e5c603
  derived_from_idea: IDEA-20260913-31457a
  added: '2026-09-13'
  statement: >-
    On an odd-prime-field elliptic curve E: y^2=(x-e_1)(x-e_2)(x-e_3)
    with full rational 2-torsion, the complete 2-descent character
    d(R)=(chi(x(R)-e_1),chi(x(R)-e_2)) under the standard 2-torsion
    convention is a four-valued homomorphism with kernel 2E(F_p).
    Consequently every R in 2E(F_p) has exactly four halves differing by
    E(F_p)[2], and d gives the four halves distinct labels. On every
    odd-order subgroup d is constant, so this exact branch separator exposes
    only the 2-primary cofactor already removed by Pohlig-Hellman and gives
    no prime-order ECDLP attack or exponent improvement.
  mechanism: >-
    The fibres of [2] are E[2]-cosets. The complete 2-descent map identifies
    E(F_p)/2E(F_p) with a subgroup of the square-class product, so its fibres
    are exactly those cosets and translation permutes them. A half may
    therefore be selected by its two-bit descent label. On an odd-order
    subgroup [2] is a bijection, the subgroup is contained in 2E(F_p), and
    the quotient label is forced to the identity. The full-group branch
    factor b=4 and label selectivity kappa=4 are thus cofactor phenomena;
    the odd subgroup has b=1 and image size 1.
  assumptions:
    - p is odd and the cubic is square-free and splits completely over F_p.
    - >-
      d uses the standard convention at (e_i,0): the vanishing factor is
      replaced by the product of the other two root differences. Literal
      chi(0) is not an alternative definition.
    - The label map and root order are fixed before any tested points or pairs.
    - No secret scalar, ECDLP solve, factor base, or prime-order attack is involved.
  test_boundary:
    instances:
      - >-
        Stage 0 only: E/F_23: y^2=x^3+16x+6 with ordered roots
        (e_1,e_2,e_3)=(1,2,20), #E=28, and R=(3,9).
    parameters:
      p: 23
      curve: y^2=x^3+16x+6
      ordered_roots: [1, 2, 20]
      curve_order: 28
      order_multiset: {'14': 18, '7': 6, '2': 3, '1': 1}
      exhaustive_points: 28
      exhaustive_ordered_pairs: 784
      maximum_runs: 1
    implementation: >-
      A future Executor implementation must derive every point, group
      operation, character, label, image, subgroup and division fibre from
      payload data using exact F_23 arithmetic. Expected labels may be used
      only after derived outputs are assembled, never as the computation.
    budget:
      authorized_stage: 0
      maximum_runs: 1
      maximum_memory_gb: 2
    out_of_scope: >-
      Stage 1 timing and pruning-cost measurement; Stage 2 prime-order
      contrast; cryptographic-scale transfer; any attack-cost or c estimate.
  distinguishable_outcomes:
    - outcome: >-
        Every exact anchor and payload-driven control passes, including
        exhaustive zero homomorphism violations, the four distinct half
        labels, the odd-subgroup constant image, null separation, the planted
        homomorphism, non-homomorphic fibre collision, coarsening ladder and
        all invalid-input refusals.
      means: >-
        The Stage 0 positive-control fixture and instrument are usable at the
        exact p=23 cell. This does not establish a new theorem, attack, cost,
        transfer, or hypothesis status.
    - outcome: >-
        An exact anchor disagrees or any control mutation fails to move the
        derived verdict in its registered direction.
      means: >-
        Instrument or fixture defect. Stop; retain both values; do not treat
        the result as mathematical evidence.
    - outcome: >-
        The matched random-label statistic does not separate the real and
        planted controls at the pre-registered empirical-null threshold.
      means: >-
        The violation instrument lacks discriminating power in this cell;
        Stage 0 is invalid, not negative evidence.
    - outcome: A timeout, crash, or resource failure occurs.
      means: Infrastructure signal only.
  predictions:
    - metric: full_group_descent_homomorphism_violations
      direction: lower
      minimum_effect: Exactly 0 among all 784 ordered pairs.
    - metric: full_group_descent_image
      direction: different
      minimum_effect: >-
        Exactly four labels, all with three-component product +1.
    - metric: halving_fibre_and_selectivity
      direction: different
      minimum_effect: >-
        R=(3,9) has four halves and four distinct labels; b=4 and kappa=4.
    - metric: odd_subgroup_image_size
      direction: lower
      minimum_effect: >-
        |2E|=7, 2E=<(3,9)>, and d has image size 1 on that subgroup.
    - metric: three_division_fibre_size
      direction: lower
      minimum_effect: Exactly one point, (10,4), maps by [3] to (3,9).
    - metric: matched_null_lower_tail_separation
      direction: different
      minimum_effect: >-
        The exact real value 0 lies strictly below the pre-registered 1%
        empirical lower quantile of 200 seeded random-label violation counts.
  falsification_conditions:
    - >-
      Any Stage 0 anchor mismatch after payload validation stops as a fixture
      or instrument defect; it does not falsify the mathematical statement.
    - >-
      Any of the shared-half-label, nonconstant-odd-subgroup, or wrong
      2-torsion mutations fails to make its derived gate false.
    - >-
      The planted Z/28 -> Z/4 homomorphism has nonzero native-law violations,
      or the non-homomorphic fibre-preserving relabeling has zero native-law
      violations.
    - >-
      Either improper coarsening has zero propagation-consistency violations,
      or the exact-coset/constant endpoints are not distinguished by image size.
    - Any invalid input is silently coerced instead of refused.
  interpretation_limits:
    - >-
      Stage 0 has claim ceiling `stage0_positive_control_fixture_only`.
      It reports no pruning-cost c, timing, attack cost, ECDLP solve, or
      certificate.
    - >-
      Full rational 2-torsion is a structured composite-order family.
      No transfer is licensed beyond that family, and no prime-order attack
      lens is claimed.
    - >-
      The established exponent gain is 0. The exhibited cofactor effect is
      already Pohlig-Hellman (KN-TECH-030), so this mechanism is dominated.
    - >-
      H-TORS-9851f8 supports the odd-order triviality mechanism. It does not
      establish this fixture's branch accounting or instrument validity.
    - >-
      KN-FIND-ffe1df's headline closure is withdrawn and is not support here.
      Only its exact Theorem C boundary is relevant: exact sum-compatible
      labels on prime-order groups, not approximate filters or the withdrawn
      Wagner-lane conclusion.
    - >-
      IDEA-20260806-c5d183 supplies the composite-order nearby-object control,
      not a prime-order attack.
  prior_evidence_refs:
    - IDEA-20260913-31457a
    - IDEA-20260806-c5d183
    - H-TORS-9851f8
    - KN-TECH-030
    - KN-FIND-ffe1df
  heuristic_assumptions:
    - id: H1-IDEA-20260913-31457a
      formal_statement: >-
        NONE OF THE STAGE 0 CORE IS HEURISTIC. The fibres of [2] are E[2]
        cosets; the complete 2-descent character has kernel 2E; and [2] is a
        bijection on every odd-order subgroup. Stage 0 checks a finite fixture
        exhaustively as an instrument gate, not as statistical support.
      random_model_justification: >-
        Not applicable. All core quantities are exact finite counts. The
        random-label distribution is a null for instrument discrimination,
        not a model of d.
      supporting_results:
        - ref: H-TORS-9851f8
          provenance: internal
          claim: Odd-primary homomorphisms into a 2-primary quotient are trivial.
          verified_by: parent-design-session-read-2026-09-13
      validation_experiment_ids: [EXP-ECDLP-08f99d]
      falsification_condition: >-
        An exact mismatch at the p=23 fixture first falsifies the fixture or
        implementation; a mathematical contradiction would require independent
        derivation and review, not this Stage 0 run.
    - id: H2-IDEA-20260913-31457a
      formal_statement: >-
        The pruning cost c, measured as the ratio of two Legendre-symbol
        evaluations to one elliptic-curve addition on the same
        implementation, lies between 0.05 and 0.5 group-operation
        equivalents for p between 2^8 and 2^26, and does not grow faster
        than the field-multiplication count of a single exponentiation by
        (p-1)/2.
      random_model_justification: >-
        No distributional model. The comparison is a measured ratio against
        the same implementation's own addition cost, which is why the metric
        is a ratio and not a wall-clock time.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        A measured ratio above 1 at any tested size, which would mean the
        pruner costs more than following a branch and would invert the
        exchange-rate conclusion at that scale.
      stage0_status: >-
        Carried exactly from IDEA-20260913-31457a but NOT TESTED by Stage 0.
        Stage 1 is specified in EXP-ECDLP-08f99d and remains unauthorized.
  proof_search_map:
    bottleneck: >-
      Whether the coordinate-dependent descent label's fibres are exactly
      cosets of 2E, giving a branch pruner, while becoming constant on the
      odd subgroup.
    baseline_embedding:
      parameter_slice: >-
        Composite order 28=4*7 with quotient E(F_23)/2E(F_23) of order 4;
        abstract regression fixture Z/28 -> Z/4 from
        IDEA-20260806-c5d183 and the Pohlig-Hellman cofactor boundary.
      reproduction_check: >-
        Exhaustively derive 0/784 violations for d and 0/784 native-law
        violations for k -> k mod 4. Require the random-label null and
        deliberately non-homomorphic relabeling to disagree in the declared
        metrics.
    observation_collision:
      observable: >-
        The pair (image size, fibre-propagation violation count).
      distinct_preimage_search: >-
        A deterministic non-homomorphic bijection phi of Z/4 applied to
        k mod 4 preserves image size 4 and gives zero fibre-propagation
        violations, yet gives positive native Z/4-law violations. Therefore
        image size plus fibre consistency cannot establish multiplication of
        labels; the native-law identity must be checked separately.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold image size and fibre propagation fixed while replacing the
          quotient label by phi(0)=1, phi(1)=0, phi(2)=2, phi(3)=3.
        predicted_gain: >-
          A direct identifiability limit: only the separate 784-pair
          native-law check can distinguish homomorphic from relabelled fibres.
      - transform: stronger_invariant
        proposed_object: Carry the two descent bits alongside each halving branch.
        predicted_gain: b=4 collapses to one selected branch on the 2-part only.
    quantifier_order: >-
      FOR ALL odd p and square-free fully split cubics, fix the ordered roots
      and d BEFORE points are selected; FOR ALL R,S in E(F_p), d(R+S)=d(R)d(S);
      FOR ALL R in 2E, its halves form one E[2]-coset and receive the four
      quotient labels; FOR ALL odd-order subgroups G and FOR ALL R in G,
      d(R) is the identity. Stage 0 tests only the declared p=23 instance.
    method_ceiling:
      strongest_certifiable_claim: >-
        At Stage 0, only that the exact p=23 positive-control fixture and
        discriminating instrument reproduce. Even later stages could certify
        only a structured-family cofactor pruner at measured implementation
        cost, never a prime-order ECDLP exponent improvement.
      nearby_object_control: >-
        The composite-order reduction Z/28 -> Z/4 is the positive nearby
        object from IDEA-20260806-c5d183. The same curve's order-7 subgroup
        and [1/3] fibre are the failure-side controls: image size 1 and
        branching 1.
    proof_obligations:
      - claim: The frozen curve, point set, orders and roots are exact.
        responsibility: baseline
      - claim: The standard 2-torsion convention yields the frozen d table.
        responsibility: correctness
      - claim: All 784 native homomorphism checks pass.
        responsibility: correctness
      - claim: Four halves have distinct labels and the order-7 subgroup is constant.
        responsibility: strictness
      - claim: The collision control bounds what image size and fibre consistency identify.
        responsibility: scope
      - claim: The only ECDLP gain is the cofactor already handled by Pohlig-Hellman.
        responsibility: interface
    not_applicable_reason: null
