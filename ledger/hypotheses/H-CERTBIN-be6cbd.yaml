  recorded_at: '2026-09-24'

  statement: >-
    CEILING FIRST. No cost claim. At m = 2 oracle A decides each attempt
    outright and parallel Pollard rho dominates the DLP. The claim concerns
    only WHICH PART of the descended S_3 system carries its degree-4
    refutation property at one cell.

    Setting (by reference to EXP-CERTBIN-e94b27 object): B =
    F_2[v_0..v_17]/(v_i^2 + v_i); f_0..f_16 are the coordinates of S_3 at
    target x_R over F_2[t]/(t^17 + t^3 + 1), with l = 9, V = {deg < 9} and
    curve A = 97044, B = 126251. M_4 and W_4 are as frozen there. A system is
    REFUTED by X iff 1 is in X. Write each f_k = q_k + l_k + b_k (bilinear
    quadratic part, linear part, constant). For S_3 at x_R, q_k is the k-th
    coordinate of phi_{x_R}(Q) = sum_s phi(t^s) Q_s with phi(y) = y^2 + x_R y
    and Q_s = sum_{i+j=s} v_i v_{9+j}.

    N-CONV(x_R) is the family of systems with q_k exactly S_3's at x_R, and
    l_k, b_k uniform random bits on S_3's union support U (degree <= 1
    columns of U). Only unsatisfiable draws are counted (exhaustive 2^18).

    Claim C-T (E-TENSOR; the claim under test). Over one unsatisfiable
    N-CONV draw at each of the 144 archived RC-1 targets x_R (U62, S62, C20),
    W_4 refutes at least 90% (>= 130 of 144), each with a verified
    degree-disciplined certificate. The same-support systems without the
    tensor (N-ELL144, and the archived nulls N-F262 and N-AFF62) stay at or
    below 10%.
    Competing reading E-LINEAR. S_3's specific lower-degree part (the Semaev
    linear part x_R^2 (x_1 + x_2)^2 and/or the curve constant B) is
    load-bearing. W_4 then refutes at most 10% of N-CONV draws (<= 14 of
    144), as for N-ELL.

  mechanism: >-
    LEMMA L-TOP (Coordinator derivation, exact; checked on every instance by
    EXP-CERTBIN-ddfe75 C-TOP). Let pi_4 be the projection of B_{<=4} onto the
    span of degree-4 monomials. For a row mu*f_k of M_4 (|mu| <= 2), mu*l_k
    and mu*b_k have degree <= 3. mu*m for a quadratic monomial m meeting mu
    collapses to degree <= 3. Hence pi_4(mu f_k) is the sum of mu u m over
    m in supp q_k with m disjoint from mu and |mu| = 2. It depends on q_k
    alone. Therefore:
    (i) P = rank pi_4(M_4) is a function of (q_0, ..., q_16) alone;
    (ii) dim(M_4 cap B_{<=3}) = rank M_4 - P, because the fallen space is
         the kernel of pi_4 on rowspace(M_4);
    (iii) the space Z_top of row-coefficient vectors whose combination has
         zero degree-4 part depends on the q_k alone and has dimension
         2924 - P. The left kernel K of M_4 lies inside it, and
         dim(M_4 cap B_{<=3}) = dim Z_top - dim K.
    So S_3, N-CONV and N-CONVL at the same x_R share P and Z_top. Their
    fallen dimensions differ only through how many top-degree syzygies lift
    to true syzygies. S_3 at U62 has rank M_4 = 2659-2673 (98-112 syzygies
    beyond the trivial 153) and 964-978 fallen dimensions, against 323 for
    exactly semi-regular nulls (RT-20260924-d95e70 J7, J8).

    WHY C-T. The red team found that S_3's refutation needs neither ell nor
    anything but the fallen space: "v_j-products of the non-ell part of F
    ALONE give W^(1) = B_{<=4} with 1 in it, on 62/62". L-TOP says the supply
    of top-degree cancellations is fixed by the quadratic part. A generic
    lower part should lift no more of them to true syzygies than S_3's does,
    so N-CONV keeps at least S_3's supply of falls.
    WHY E-LINEAR. Many falls do not by themselves give 1. The falls of N-CONV
    are different polynomials from S_3's. The semi-regular description
    transferred exactly to every generic-looking system measured so far
    (nulls 124/124, N-ELL 20/20). A random lower part might make the system
    generic enough for that description to transfer again.

    SUBSTITUTION (T4, T5 of RT-20260924-d95e70 j9-ptm/o2-declaration.yaml,
    status verified there). If a linear ell = sum_k c_k f_k with nonzero
    linear part lies in the span of the f_k, let pi substitute
    v_{j*} := ell + v_{j*} (j* the least index in ell's support). Then
    W_4 = pi^{-1}(W'_4) cap B_{<=4}, dim W_4 = dim W'_4 + 834, and 1 is in W_4
    iff 1 is in W'_4, where W'_4 is the degree-4 mutant closure of the 17
    substituted equations in 17 variables (T4). If
    R'_4 cap B'_{<=3} = rowspace(R'_3), then W'_4 = R'_4 (T5). The red team
    proved T4 for v_0 := v_9 + c. The proof uses only that pi is a ring
    homomorphism B -> B' with kernel ell*B, which holds for any affine
    substitution of one variable (Coordinator reading; checked per instance
    by C-T4). For S_3, N-CONV and N-CONVL, c_k = Tr(t^k / x_R^2) spans the
    left kernel of the quadratic-part matrix.

    SOUNDNESS AND CERTIFICATES. W_4 lies in the ideal generated by the f_k, so
    a refutation is an unsatisfiability certificate. A W_4 refutation is
    certified here by a straight-line certificate (wdag-v1, EXP-CERTBIN-ddfe75
    object.certificate_format) whose every product operand has degree <= 3
    and every Macaulay row has |mu| <= 2. By induction on the DAG each node is
    in W_4. This closes the observation fiber of flat certificates exhibited
    in RT-20260924-d95e70 J7 (a) (R-8, RC-D).

  assumptions:
    - Satisfiability is decided exactly by exhaustive evaluation over all 2^18 assignments (and re-decided by the independent verifier), never by a closure.
    - >-
      The 144 x_R are the archived U62, S62 and C20 targets of RUN-CERTBIN-c417e0
      (instance-sets.json). No curve or target is sampled. The draws condition on
      no closure outcome. Unlike U62 in RC-1, the primary N-CONV rate is
      UNCONDITIONAL over unsatisfiable draws.
    - >-
      S_3's union support U_k (EXP-CERTBIN-e94b27 instances.build_instances;
      RT-20260924-d95e70 o2-declaration union_support). Archived per-equation
      sizes are 100 or 99. The size is 99 exactly at the six k where bit k of
      B = 126251 is 0 (k = 2, 4, 6, 7, 9, 12). Since S_3 has only bilinear,
      linear and constant monomials, this reads as: U_k contains all 81
      bilinear and all 18 linear monomials, plus the constant iff bit k of B is
      1. This is a Coordinator reading of instrument-checks.json and B, and the
      executor verifies it (C-SUPPORT).

  proof_search_map:
    bottleneck: >-
      KN-OPEN-3c8f51 item (A) at n = 17: which part of S_3 produces the
      non-semi-regular M_4 that refutes every unsatisfiable subgroup-target
      attempt at W_4. The answer decides which control the n = 19 cell needs
      (DEC-20260924-e61f3b NA-2, NA-3) and whether "S_3-specific at W_4" may be
      quoted against anything stronger than same-support random bilinear
      systems (EV-CERTBIN-4a9d2f TA-7).
    baseline_embedding:
      parameter_slice: >-
        The S_3 reference arm IS the baseline. It uses the archived U62, C20
        and S62 systems through the same engine and code path. N-CONV
        coincides with S_3 on the slice "random bits = S_3's own lower part"
        (excluded from the draw as an identity draw).
      reproduction_check: >-
        (i) The engine reproduces the RC-1 W_4 records of every archived set
        field for field (C-REG b). The dispatching session reports the full
        tools/gf2_replay_rc1.py sweep (1062 records, 268 certificates, 0
        mismatches), and C-ENGINE re-runs it before any draw. (ii) The
        red-team R'_4 profiles of U62 and C20 are reproduced (C-REG c). (iii)
        N-ELL20's archived engine records are reproduced (C-REG d). (iv) Own
        construction of E_S3(x_R) equals the archived E_hex on all 144 x_R
        (C-CONSTRUCT).
    observation_collision:
      observable: '"1 in W_4" with a verified wdag-v1 certificate; "1 in M_4" with a verified flat certificate of max |mu| <= 2.'
      distinct_preimage_search: >-
        The known collision is the flat-certificate fiber (a max-deg-3 flat
        certificate fits both a W_4 refutation and an M_5-only refutation;
        RT-20260924-d95e70 J7 (a)). The wdag-v1 per-node degree bound
        separates it, and the verifier's degree-violation negative controls
        test that separation (C-VERIFIER kind (c)). The satisfiable control in
        every fresh arm is the explicit search for a false refutation. It is
        impossible by soundness if the certificate verifies, so it tests the
        arm label (C-ORACLE2) and the verifier.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold phi_{x_R}(Q) fixed and vary the forgotten lower-degree part
          (N-CONV), only the constant (N-CONVL), or the cokernel (N-CONV17).
        predicted_gain: Locates the part of S_3 that the W_4 signal depends on.
      - transform: stronger_invariant
        proposed_object: P = rank pi_4(M_4) and Z_top (L-TOP), shared across the family
        predicted_gain: Separates the supply of degree falls (fixed by q) from their use (depends on l, b).
    quantifier_order: >-
      FOR each of the 144 archived x_R (fixed before this record), FOR each
      fresh arm, the frozen seed stream determines the draws. The kept
      unsatisfiable draw is the first one with s = 0; it depends on x_R and the
      seed and on no closure outcome. FOR that draw, a verified wdag-v1
      certificate for 1 in W_4 EXISTS or NOT. The thresholds (130, 72/73, 14)
      are fixed now. No threshold depends on data.
    method_ceiling:
      strongest_certifiable_claim: >-
        At this cell, the W_4 (degree-4 polynomial-calculus-type) refutation
        rates of the declared synthetic families, with certificates, and their
        order along the ladder. Not an exact account of the mechanism
        (KN-OPEN-3c8f51 resolution criterion 3). Not F4 step degree. Not any
        n other than 17. Not x(2E) modulation. Not a cost.
      nearby_object_control: >-
        Proves-too-much objects, for which a "tensor" conclusion is known
        false or derived false: N-ELL (a linear fall without the tensor; T4/T5
        plus exact semi-regularity predict 0 refuted; archived 0/20) and the
        same-support nulls (neither; exactly semi-regular; 0/62 each). A
        method that refuted those at N-CONV's rate would not identify the
        tensor.
    proof_obligations:
      - claim: L-TOP (i)-(iii)
        responsibility: correctness
      - claim: T4 for an arbitrary one-variable affine substitution (generalization of the red team's T4)
        responsibility: correctness
      - claim: wdag-v1 soundness (every node in W_4 by induction; output 1 implies refuted)
        responsibility: correctness
      - claim: Reading of U_k from the archived sizes and B (C-SUPPORT)
        responsibility: interface
      - claim: Fixture dimensions M_4 2924 x 4048, M_3 323 x 988, R'_4 2618 x 3214, R'_3 306 x 834
        responsibility: size
    not_applicable_reason: null

