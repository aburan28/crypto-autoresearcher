hypothesis:
  id: H-MONO-45183a
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  status: supported_scoped
  status_note: >-
    Moved to `supported_scoped` by DEC-20260830-0f8def on independent
    Validator (holds_with_finding) and Red Team (holds_with_finding)
    review of EXP-MONO-12ce1c's two runs. Part A's containment claim
    (monodromy embeds in (Z/2)^(m-2), never full symmetric) is strongly,
    multiply-independently supported — most decisively by a dual-path
    cross-check with independently measured ~89% discriminating power and
    an independent exhaustive census of all 2,915,514 admissible triples
    at p=103 — NOT primarily by the raw 960,000-specialization headline
    count, which both reviewers independently proved is close to a
    necessary consequence of already-established facts (F_p's unique
    quadratic extension) rather than an independent Chebotarev-style
    test; this correction is carried explicitly in EV-MONO-efbd1c. Part A
    equality (HEUR-KUM-2) is corroborated via G8, not proven. Part B is
    supported, rescoped to the transversal sampling convention actually
    used (its own sign-convention control was empty by implementation).
    The frozen contract's own mandatory cross-curve null control failed
    exactly as both reviewers independently proved it must — it is
    unsatisfiable by construction for any companion object — a flaw in
    this record's own 25-day-old design, not in the execution; per the
    contract's own literal text this renders Stage 2 formally void, a
    trigger this decision does not lift but explains and routes around
    via independent evidence that does not depend on it. Full composition
    in EV-MONO-efbd1c. Promotes KN-FIND-6edecd (NOT a restatement of the
    already-committed KN-FIND-a8990a, which independently proves this
    same containment claim unconditionally and predates this record's
    own execution — KN-FIND-6edecd instead documents the independent-
    review cross-validation and one new control-design corollary). Does
    not close KN-OPEN-009 (only its full-symmetric-monodromy premise is
    addressed).

  statement: >-
    SCOPE: the m-th Semaev summation cover of a non-singular short-Weierstrass curve
    E : y^2 = f(x) = x^3 + Ax + B over a field of characteristic > 3; prime fields for
    the empirical arm; m in {3, 4, 5}; toy primes p in [100, 3000]; claim tier toy for
    everything measured, derivation tier for everything derived. NO ATTACK, NO EXPONENT,
    NO PRIME-FIELD-TO-CRYPTO-SCALE TRANSFER.

    THE HYPOTHESIS, IN TWO PARTS THAT SHARE ONE OBJECT.

    PART A (GENERIC FIBRE). The Semaev summation cover is a 2-Kummer cover. Its
    splitting field over K = k(x_1,...,x_{m-1}) is contained in
    K(sqrt(f(x_1)),...,sqrt(f(x_{m-1}))), so its geometric monodromy group is a quotient
    of (Z/2)^{m-1} / <(1,...,1)> = (Z/2)^{m-2}, acting REGULARLY on the 2^{m-2} roots;
    it equals (Z/2)^{m-2} whenever S_m is irreducible over K. Consequences, each stated
    as a measurable prediction below: (A1) the group is NEVER the full symmetric group
    for m >= 4, contradicting the expectation KN-OPEN-009 states verbatim; (A2) the ONLY
    attainable Frobenius cycle types at any m are 1^{2^{m-2}} and 2^{2^{m-3}}, so at
    m = 4 the types 4, 3+1 and 2+1+1 have frequency EXACTLY ZERO; (A3) the split
    frequency is (S^{m-1} + N_ns^{m-1})/p^{m-1} with S = (p-t-Z)/2, N_ns = (p+t-Z)/2, a
    formula that reduces at m = 3, after the x_1 = x_2 diagonal correction, EXACTLY to
    the committed closed form of EV-MONO-a0a89c OBS-3; (A4) the cover is IMPRIMITIVE for
    every m >= 4 and every curve, so a block system is generic rather than exceptional,
    and its resolvents are the y-coordinates -- resolvent decomposition of this cover IS
    the chord-and-tangent law, a change of coordinates in the sense of
    docs/inventor-protocol.md section 2.

    PART B (FACTOR-BASE SUBLOCUS). On the sublocus where every x_i is a factor-base
    element, the fibre splits completely at every m (EV-MONO-a0a89c OBS-5, not re-claimed
    here), so the cycle type carries no information; but the ROOT-MULTIPLICITY partition
    does. Two sign classes collide iff a signed subset sum of the P_i lies in E[2].
    Counting gives forced expected collision-pair counts 6(tau-1)/N at m = 4 and
    16 tau/N + 24(tau-1)/N at m = 5, where N = #E(F_p) and tau = #E(F_p)[2] = Z + 1.
    In particular the m = 4 rate is EXACTLY ZERO on a curve with trivial rational
    2-torsion and EXACTLY 6/N when tau = 2 -- a forced two-valued comparator on the
    exact locus where GOAL-MONO-001's next_action reports the existing instrument to be
    constant.

    WHAT THE HYPOTHESIS ASSERTS ABOUT THE GOAL'S PAUSE. If Part A survives, the
    imprimitivity half of KN-OPEN-009 -- which the goal's next_action proposes to carry
    forward into a further m >= 4 census -- is ANSWERED BY DERIVATION, and the census is
    unnecessary rather than merely unaffordable. If Part A fails, the derivation is
    wrong and the census becomes necessary again for a reason nobody had: the cover would
    then carry monodromy that the sign torsor does not explain, which is a far more
    interesting object than the one the goal was chasing.

  mechanism: >-
    DERIVED IN-REPO. No external source was read and none is cited. The full derivation
    is in IDEA-20260805-cf2d5a (Part A) and IDEA-20260805-90df50 (Part B); the load-bearing
    steps are restated here so this record stands alone.

    A-1. THE FIBRE. S_m(x_1,...,x_m) = 0 iff there are points P_i with x(P_i) = x_i
    summing to O. Fixing x_1..x_{m-1} and a square root y_i of f(x_i) fixes P_i up to
    sign, and the fibre over (x_1..x_{m-1}) is
    { x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}) : eps in {+-1}^{m-1} } which has at most
    2^{m-2} elements because eps and -eps agree. deg_T S_m = 2^{m-2} for m >= 3, so
    generically the fibre is exactly that set and the roots are distinct.

    A-2. THE FIELD AND THE GROUP. All roots lie in L' = K(y_1,...,y_{m-1}) with
    Gal(L'/K) = (Z/2)^{m-1} generated by y_i -> -y_i; the generators are independent
    because f(x_1),...,f(x_{m-1}) are pairwise distinct squarefree elements of the UFD
    k[x_1,...,x_{m-1}] (squarefree = f squarefree = E non-singular). The diagonal
    involution negates every P_i, hence every eps-sum, hence fixes every x-value. So the
    splitting field is inside (L')^{<diag>} and Gal embeds in (Z/2)^{m-2}. Transitivity
    (equivalently irreducibility of S_m over K) then forces a regular action and
    equality. At m = 3 this reproduces EV-MONO-a0a89c OBS-2 ((Z/2)^1 = S_2 for every
    non-singular E) which was proved there by the independent route
    disc_T S_3 = 16 f(x_1) f(x_2); the agreement of two independent derivations at
    m = 3 is the reason the m >= 4 extension is worth stating.

    A-3. FROBENIUS IS THE CHARACTER VECTOR. Over F_p, at a non-ramified specialization,
    Frobenius sends P_i to s_i P_i with s_i = chi(f(x_i)) in {+1,-1} the quadratic
    character. So Frob(sum eps_i P_i) = sum eps_i s_i P_i, which is +- the original for
    all eps precisely when all s_i coincide. Hence complete splitting iff all m-1
    characters agree; otherwise no root is rational and, because Frob^2 acts trivially,
    every orbit has size 2. NO OTHER CYCLE TYPE EXISTS. Counting x with f(x) a nonzero
    square gives (#E(F_p) - 1 - Z)/2 = (p - t - Z)/2 and the complementary count
    (p + t - Z)/2, whence A3.

    B-1. COLLISION CRITERION. x(A) = x(B) iff A = +-B. For A, B the sums over sign
    classes eps, eps' with differing set S, this is
    2 sum_{i in S} eps_i P_i = O or 2 sum_{i not in S} eps_i P_i = O, i.e. a signed
    subset sum lands in E[2].

    B-2. BRANCH PROBABILITIES AND THE COUNT. Under independent uniform factor-base
    points with distinct x_i and f(x_i) != 0: a singleton branch has probability EXACTLY
    0 (P_i in E[2] would force f(x_i) = 0); a size-2 branch has probability (tau-1)/N
    (the identity case is x_i = x_j, excluded); a branch of size >= 3 has probability
    tau/N. Summing over the C(2^{m-2},2) class pairs, using that the partitions of
    {1,2,3} are all of type (1,2) and those of {1,2,3,4} are of types (1,3) and (2,2)
    with 4 sign configurations each, gives the forced values 6(tau-1)/N at m = 4 and
    16 tau/N + 24(tau-1)/N at m = 5.

    B-3. WHY B IS NOT A RESTATEMENT OF A. Part A is about which roots are RATIONAL; Part
    B is about whether the roots are DISTINCT. On the factor-base sublocus Part A's
    statistic is constant (everything is rational, which is OBS-5) while Part B's is not.
    The two are independent invariants of the same fibre and the hypothesis is that the
    sign torsor governs both: A through its action on rationality, B through the
    degeneration of that action's freeness.

  proof_search_map:
    bottleneck: >-
      The single step that decides everything is the containment
      Gal(splitting field of S_m / k(x_1..x_{m-1})) <= (Z/2)^{m-1}/<diag>. If it holds,
      KN-OPEN-009's full-symmetric premise is false at every m >= 4 and the imprimitivity
      half is answered without a census. If it fails, the entire monodromy programme this
      goal was built on becomes live again and far more interesting. Everything else in
      this record is a consequence or a control.
    baseline_embedding:
      parameter_slice: >-
        m = 3, where the answer is already committed: EV-MONO-a0a89c OBS-2 (monodromy
        S_2, every non-singular E, no exceptional locus) and OBS-3 (exact split-density
        closed form, verified on 105 curves in RUN-MONO-4b50b6-002 with 0 mismatches, and
        established independently of the closed form by exhaustive enumeration of all
        p^2 pairs on 19 curves, 17,054,059 pairs, 0 disagreements).
      reproduction_check: >-
        SYMBOLIC AND ALREADY PERFORMED, BEFORE THIS RECORD WAS WRITTEN. Setting m = 3 in
        A3 gives numerator S^2 + N_ns^2 = (p-Z)^2/2 + t^2/2; subtracting the x_1 = x_2
        diagonal term (p - Z) yields N_split = S^2 + N_ns^2 - (p - Z) and
        freq_split - 1/2 = (t^2 - 2pZ + Z^2 - 2p + 2Z)/(2p^2), which is OBS-3's committed
        formula TERM FOR TERM including its diagonal correction. This is an exact
        identity in (p, t, Z), not a curve that resembles a curve on a plot. It is the
        strongest form of baseline embedding available here and it is what raises the
        prior on the m >= 4 extension.
      what_would_have_counted_as_failure: >-
        Any discrepancy in the constant, in the sign of t^2, or in the diagonal
        correction. The audit was run before the record was written specifically so that
        a failure would have prevented the record from existing.
    observation_collision:
      observable: >-
        The Frobenius cycle type of the fibre (Part A) and the root-multiplicity
        partition (Part B).
      distinct_preimage_search: >-
        SEARCHED, AND THE COLLISION IS MASSIVE AND IS DECLARED RATHER THAN HIDDEN. The
        cycle type is a function of the square-class vector alone -- m-2 bits -- so
        p^{m-1} distinct specializations share only 2^{m-2} observable values. Two
        ground-truth objects on OPPOSITE SIDES of the hoped-for conclusion definitively
        share it: a CM curve and a random ordinary curve with the same (t mod nothing,
        Z) pattern produce identical cycle-type distributions. THAT IS THE POINT AND NOT
        A DEFECT: the hypothesis asserts the observable cannot distinguish curve families,
        which is exactly why no exceptional locus can be detected by it, which is exactly
        why the goal's census could not have failed (EV-MONO-a0a89c OBS-6 measured the
        required excursion at 52-143 sigma). A collision that is PREDICTED by the
        hypothesis and would falsify the alternative is a confirmation of identifiability
        failure for the INSTRUMENT, not for the hypothesis. The separating condition the
        hypothesis supplies is Part B's tau, which does NOT collide across curve families
        at fixed N: tau = 1 and tau = 2 curves are forced to 0 and 6/N.
      residual_collision_risk: >-
        Part B's observable collides across all curves with the same (N, tau). If two
        curves with identical (N, tau) but different endomorphism rings gave different
        measured rates, the derivation would be incomplete; that pair is an explicit arm.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER, AND THE ORDER IS LOAD-BEARING:
        FOR ALL fields k with char k > 3, FOR ALL non-singular E/k, FOR ALL m >= 3,
        THERE EXISTS an injection of the monodromy group into (Z/2)^{m-2}.
      The witness -- the Kummer presentation by the m-1 square roots -- is UNIFORM: it is
      written down from f and the x_i with no dependence on the curve, the field, the
      characteristic (beyond > 3), the specialization, or a seed. That uniformity is what
      distinguishes this from the m = 3 discriminant argument, whose witness
      (disc_T S_3 = 16 f(x_1) f(x_2)) genuinely IS degree-2-specific, and it is why
      EV-MONO-a0a89c's boundary sentence "no analogue at m >= 4" is a statement about the
      witness rather than about the theorem.
      THE WEAKER ORDER IS NOT CLAIMED AND IS NOT ADMISSIBLE AS A RESULT: "for all E there
      exists a group containing the monodromy" is trivially true. Conversely the EQUALITY
      (as opposed to the containment) is claimed only in the order
      FOR ALL E, IF S_m is irreducible over k(x_1..x_{m-1}) THEN the group is exactly
      (Z/2)^{m-2} -- a conditional whose antecedent is unproved at m >= 4 (HEUR-KUM-2)
      and is measured, not assumed.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a scoped statement that the geometric and arithmetic monodromy of the
        m-th Semaev summation cover embeds in an elementary abelian 2-group of order
        2^{m-2}, for non-singular curves in characteristic > 3, with the empirical
        consequences verified at m in {3,4,5} on toy primes and one instrument lineage.
        IT CANNOT certify anything about F_{q^n} and the Weil-restriction setting where
        the actual Gaudry/Diem attack lives; it CANNOT certify a relation-rate statement
        (that is IDEA-20260805-a9a95d's object); it CANNOT bound any solver's cost;
        it CANNOT move any exponent; and it CANNOT close KN-OPEN-009, which has two
        halves of which this addresses one.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE HOPED-FOR CONCLUSION IS KNOWN FALSE is a uniformly random
        monic quartic over the same F_p, whose Galois group is generically the full S_4
        and whose Chebotarev densities are 1/24, 1/4, 1/8, 1/3, 1/4 for cycle types
        1^4, 2+1+1, 2^2, 3+1, 4. The identical classifier MUST reproduce those densities
        and MUST emit 4-cycles and 3+1 types. A method (or an implementation) that
        reports "only two cycle types" on a random quartic has not identified the
        load-bearing structure -- it has a bug -- and NO NEGATIVE MAY BE REPORTED. This
        lane already owns the degree-5 version of this control: EV-MONO-a0a89c OBS-7
        records random quintics matching Chebotarev(S_5) at 0.2026 versus 0.2 and 0.2451
        versus 0.25.
        A SECOND nearby object, closer still: the degree-4 polynomial whose roots are
        x(eps_1 P_1 + eps_2 P_2 + eps_3 P'_3) with P'_3 taken from a DIFFERENT curve. The
        sign-torsor argument does not apply across two curves, so 4-cycles and 3+1 types
        must reappear. A method that cannot separate the genuine S_4 fibre from the
        cross-curve one has not found the structure it claims.
    constructive_transforms:
      - transform: stronger_compositional_invariant
        proposed_object: >-
          Track the full square-class vector in (k^*/(k^*)^2)^{m-1} rather than only the
          cycle type it induces. The vector is strictly more state than the conclusion
          needs, and it is the stronger state that survives the recursion
          S_{m+1} = Res_X(S_m(...,X), S_3(...,X)): the sign torsor of the composite is
          the product of the sign torsors of the parts, which is why the result holds at
          every m by induction rather than only at the degrees one can compute.
        predicted_gain: >-
          Converts a per-degree computation into an induction, and makes the m = 5
          prediction a consequence of the m = 4 one rather than a separate measurement.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (cycle type) fixed and vary the forgotten structure (the
          curve, its endomorphism ring, its j-invariant) at fixed square-class vector.
          The intrinsic invariant proposed to distinguish the resulting objects is
          NONE for Part A -- the hypothesis asserts the fibre is genuinely
          indistinguishable -- and tau for Part B.
        predicted_gain: >-
          If some curve-intrinsic invariant DOES separate objects with equal square-class
          vectors, Part A is false and the exceptional locus KN-OPEN-009 hypothesizes may
          exist after all. This transform is the constructive form of the falsifier.
      - transform: baseline_as_boundary_lift
        proposed_object: >-
          Not applicable, and the reason is recorded rather than the field omitted: this
          hypothesis does not enlarge a certificate family or prove an inward improvement
          on a bound. It replaces a hypothesized group by a computed one; there is no
          boundary to lift.
        predicted_gain: n/a
    proof_obligations:
      - claim: >-
          The fibre of S_m over (x_1..x_{m-1}) is the set of signed-sum x-coordinates,
          and deg_T S_m = 2^{m-2}.
        responsibility: correctness
      - claim: >-
          f(x_1),...,f(x_{m-1}) are pairwise distinct squarefree elements of the UFD, so
          the m-1 Kummer generators are independent.
        responsibility: correctness
      - claim: >-
          The diagonal involution fixes every root, so the group embeds in the quotient
          by it.
        responsibility: correctness
      - claim: >-
          A3 reproduces EV-MONO-a0a89c OBS-3 exactly at m = 3, including the diagonal
          correction.
        responsibility: baseline
      - claim: >-
          S_m is irreducible over k(x_1..x_{m-1}) at m >= 4 (needed only for EQUALITY,
          not for any consequence).
        responsibility: strictness
      - claim: >-
          Part B's branch probabilities hold for the declared sampling construction, not
          merely for idealized independent uniform points.
        responsibility: soundness
      - claim: >-
          Nothing here transfers to F_{q^n}, to characteristic 2 or 3, or to any cost
          statement; every citation carries the gap.
        responsibility: scope
    not_applicable_reason: null

  heuristic_assumptions:
    - id: HEUR-KUM-1
      formal_statement: >-
        NONE LOAD-BEARING FOR THE CONTAINMENT. For every field k of characteristic > 3,
        every non-singular E/k and every m >= 3, the splitting field of
        S_m(x_1,...,x_{m-1},T) over k(x_1,...,x_{m-1}) is contained in the compositum of
        the m-1 quadratic extensions by sqrt(f(x_i)), fixed by the diagonal involution.
        This is asserted as a THEOREM, proved above, not as a heuristic; the entry exists
        to record that consequences A1-A4 need nothing beyond it.
      random_model_justification: >-
        Not applicable -- the statement is not distributional. Recorded explicitly
        because docs/target-result-profile.md requires every heuristic to carry a random-
        model justification, and a non-distributional claim must say why it has none
        rather than leave the field empty.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-12ce1c]
      falsification_condition: >-
        Any observed Frobenius cycle type at m >= 4 outside {1^{2^{m-2}}, 2^{2^{m-3}}} on
        a non-ramified specialization with distinct roots, with the nearby-object control
        passing.
    - id: HEUR-KUM-2
      formal_statement: >-
        FOR ALL m >= 4, S_m(x_1,...,x_{m-1},T) is irreducible over
        k(x_1,...,x_{m-1}), so the containment of HEUR-KUM-1 is an equality and the
        monodromy group is exactly (Z/2)^{m-2}.
      random_model_justification: >-
        NONE, AND THIS IS THE RECORD'S WEAKEST MATHEMATICAL LINK. It is what the whole
        monodromy framing of KN-OPEN-009 presupposes (a disconnected cover has no single
        monodromy group to ask about), and at m = 3 it is proved in EV-MONO-a0a89c OBS-2
        by squarefreeness of 16 f(x_1) f(x_2). At m >= 4 no proof is offered here and
        none is claimed.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-12ce1c]
      falsification_condition: >-
        Fewer than 2^{m-2} distinct Frobenius permutations realized over a large sample
        at m = 4, 5 -- which would indicate a proper subgroup, i.e. reducibility, and
        would make the conclusions STRONGER while making this assumption false. Reported
        as measured, never assumed; the experiment reports the realized-class count as a
        lower bound on the group order rather than asserting equality.
    - id: HEUR-COIN-1
      formal_statement: >-
        FOR the declared factor-base sampling construction, sums of two or more distinct
        drawn points are uniform on E(F_p) to within o(1/N) relative error, so
        P(signed subset sum in E[2]) = tau/N at leading order and the Part B forced
        values hold.
      random_model_justification: >-
        Exact for independent uniform points (a sum of independent uniforms on a finite
        abelian group is uniform, and P(uniform in E[2]) = tau/N). The gap is that the
        construction draws x-coordinates and applies a deterministic sign rule, so the
        drawn points are uniform on a transversal rather than on the group. The
        first-order effect of this is expected to be O(1/N) relative and therefore below
        the leading term, but this is an expectation and not a proof.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-12ce1c]
      falsification_condition: >-
        The fixed-sign and random-sign sampling arms disagreeing by more than the forced
        value's standard error at any cell. Then the Part B prediction is
        convention-dependent and must be restated per convention rather than repaired.
    - id: HEUR-DEG-3
      formal_statement: >-
        deg_T S_m = 2^{m-2} for all m >= 3.
      random_model_justification: >-
        Not distributional. Standard, and corroborated INSIDE this corpus rather than
        from an unread external source: EV-MONO-a0a89c OBS-5 states "2^{m-2} values
        matching deg_T S_m" and its red team verified the m = 4 case by building
        S_4 = Res_X(S_3(x_1,x_2,X), S_3(x_3,T,X)) over F_211 and factoring 193
        specializations.
      supporting_results: []
      validation_experiment_ids: [EXP-MONO-12ce1c]
      falsification_condition: >-
        The constructed S_4 or S_5 having a T-degree other than 4 or 8. This halts the
        experiment as a construction failure, which is an infrastructure outcome and
        never mathematical evidence (AGENTS.md rule 5).

  structural_ingredients:
    - description: >-
        Kummer theory over a UFD: the compositum of quadratic extensions by squarefree,
        pairwise-non-associate elements has Galois group the full elementary abelian
        2-group.
      citation: >-
        NOT RETRIEVED, NO SOURCE READ, NO CITATION ASSERTED. Elementary and derived in
        this record from squarefreeness of f (= non-singularity of E), which is the same
        hypothesis EV-MONO-a0a89c OBS-2 used at m = 3.
      role: supplies the containment and the independence of the m-1 sign generators
    - description: >-
        The chord-and-tangent addition law, in the form x(-Q) = x(Q) and the description
        of the summation-polynomial fibre by signed sums.
      citation: >-
        ledger/evidence/EV-MONO-a0a89c.yaml OBS-1, OBS-4 and OBS-5, which state the root
        description and record independent verification of it at m = 3 (17,054,059
        exhaustive pairs on 19 curves) and m = 4 (193/193 over F_211).
      role: identifies the fibre, and supplies Part B's collision criterion
    - description: >-
        The quadratic-character count #{x : f(x) is a nonzero square} = (p - t - Z)/2.
      citation: >-
        Derived here by counting affine points; corroborated by its reproducing OBS-3's
        committed closed form exactly.
      role: converts the group statement into the exact frequency law A3

  reduction_chain:
    core_problem: >-
      Determine the geometric and arithmetic monodromy group of the m-th Semaev
      summation cover, and the induced Frobenius cycle-type and root-multiplicity
      statistics, at m in {3,4,5}.
    corollaries:
      - >-
        The imprimitivity half of KN-OPEN-009 is answered at every m: block systems exist
        generically for m >= 4, and their resolvents are the y-coordinates, so
        resolvent decomposition of this cover is the addition law.
      - >-
        The "generic full symmetric/wreath monodromy" premise of KN-OPEN-009 is false for
        m >= 4, so the full-versus-exceptional dichotomy the goal's completion criterion
        (a) asks a census to decide does not exist as posed, and criterion (c) -- a scoped
        instrument/protocol no-go -- becomes the reachable one.
      - >-
        EV-MONO-a0a89c's recorded boundary "no analogue at m >= 4" would be superseded
        (never edited) by a record distinguishing the DEVICE, which is genuinely
        degree-2-specific, from the RESULT, which is not.
    corollaries_note: >-
      DELIBERATELY EXCLUDED FROM THE CHAIN: any statement about relation RATES (that is
      IDEA-20260805-a9a95d / H-MONO-663fb4), any statement about F_{q^n} and the
      Weil-restriction setting where the Gaudry/Diem attack actually operates, and any
      cost or exponent statement whatsoever. KN-OPEN-009 is NOT closed by this
      hypothesis; one of its two halves is addressed and the other is explicitly not.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO COMPLEXITY CLAIM OF ANY KIND. This is a determination of a
    Galois group and two induced statistics. It makes no system easier or harder to
    solve, moves no exponent, and adds no attack. Pollard rho at O(sqrt(N)) time and
    O(1) memory remains the prime-field ECDLP baseline (KN-OPEN-001). sota_delta is zero
