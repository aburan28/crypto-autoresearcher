# H-SSI-cb227f
# Equality bits of the same eight endomorphisms, read on E[4]
# instead of E[2]. H-SSI-d4f424 is the E[2] contract and is not edited.
hypothesis:
  id: H-SSI-cb227f
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  source_idea: IDEA-20261004-edbd24
  experiment_id: EXP-SSI-494592
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-1f5fae
  title: >-
    Equality bits on E[4] still glue iota to iota cubed, and at
    p=11 and p=19 they also glue three further endomorphisms
  statement: >-
    Fix p in {7, 11, 19}. Let E be y^2 = x^3 + x over F_{p^2} =
    F_p[i]/(i^2+1). Let iota send (x, y) to (-x, i y) and let pi
    be the p-power Frobenius. The witness set is W = {iota^a
    composed after pi^b : a in {0, 1, 2, 3}, b in {0, 1}}. For
    theta in W and R in E[4], the equality bit is 0 when
    theta(R) = R and 1 otherwise. The design-session partition,
    which is not a run, is the same under the closed form
    i^p = -i and under exponentiation. At p=7 the fibers are
    {(0,0)}, {(0,1)}, {(1,1)}, {(2,0)}, {(2,1)}, {(3,1)}, and
    {(1,0), (3,0)}. At p=11 and at p=19 the fibers are {(0,0)},
    {(0,1)}, {(2,1)}, {(1,0), (3,0)}, and
    {(1,1), (2,0), (3,1)}. Replaying the bits inside a fiber
    produces no disagreement. The bits do not determine the
    pair (a, b).
  mechanism: >-
    iota and iota^3 = [-1] composed with iota fix a point only
    when that point is O or (0, 0), so their equality-bit rows
    agree on every subset of E, including E[4]. The remaining
    collisions are not forced by that identity. At p=7 the other
    six witnesses have distinct rows. At p=11 and p=19 the three
    witnesses iota^2, iota composed after pi, and iota^3 composed
    after pi share one row.
  assumptions:
    - Composition applies pi^b first and then iota^a.
    - E[4] is the full 16-point kernel of multiplication by 4 inside E(F_{p^2}).
    - An equality bit records only whether theta fixes R. It does not record the image.
  proof_search_map:
    bottleneck: >-
      Whether the E[4] equality-bit row separates the eight
      witnesses that the E[2] row did not.
    baseline_embedding:
      parameter_slice: >-
        The same curve, primes, and witness set as H-SSI-d4f424.
        That hypothesis reads E[2] only. This one reads E[4].
      reproduction_check: >-
        Frobenius as the closed form (a, b) -> (a, -b) and
        Frobenius as the p-power map must give the same fibers.
        iota squared must equal negation on every point of E[4].
    observation_collision:
      observable: the set of points of E[4] fixed by a witness.
      distinct_preimage_search: >-
        Two pairs (a, b) with the same fixed-point set.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: equality bits on E[4] rather than on E[2]
        predicted_gain: >-
          Splits some E[2] fibers and leaves the iota / iota^3
          pair glued. No EndRing algorithm.
    quantifier_order: >-
      For each prime, for each of the eight witnesses, for each
      of the sixteen points of E[4].
    method_ceiling:
      strongest_certifiable_claim: >-
        The equality-bit partition of these eight maps on this
        16-point module. Not a decryption attack.
      nearby_object_control: >-
        p=7, where the only collision is iota with iota^3.
        p=11 and p=19 keep an extra fiber of size 3.
    proof_obligations:
      - claim: The fibers are the sets named in the statement
        responsibility: correctness
      - claim: Fiber counts are 7, 5, and 5
        responsibility: size
      - claim: Both Frobenius routes agree
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        These fibers do not transfer to a cryptographic
        endomorphism-ring encryption scheme.
      random_model_justification: The module is enumerated in full.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-494592
      falsification_condition: >-
        A later record that treats this partition as a break of a
        published scheme.
  structural_ingredients:
    - description: >-
        IDEA-20261004-edbd24 asks which torsion module a
        decryption transcript actually uses. H-SSI-d4f424 answered
        for E[2]. This hypothesis answers for E[4].
      citation: ledger/proposals/IDEA-20261004-edbd24.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-05, proposal file read
      role: source claim
  reduction_chain:
    core_problem: Separation of eight endomorphisms by E[4] equality bits.
    corollaries: []
  predictions:
    - metric: fiber_count
      direction: equal
      minimum_effect: "7 at p=7, 5 at p=11, 5 at p=19"
    - metric: largest_fiber
      direction: equal
      minimum_effect: "2 at p=7, 3 at p=11, 3 at p=19"
    - metric: replay_disagreements
      direction: equal
      minimum_effect: "0 at each prime"
  test_boundary:
    instances:
      - E[4] equality bits for the eight witnesses at p in {7, 11, 19}
    parameters:
      primes: [7, 11, 19]
      curve: "y^2 = x^3 + x"
      torsion: 4
    implementation: >-
      Affine addition over F_{p^2}, with both Frobenius routes.
    budget:
      maximum_runs: 6
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Both Frobenius routes agree, iota squared equals negation,
      and a fiber membership or a fiber count differs from the
      statement.
  interpretation_limits:
    - H-SSI-d4f424 is unchanged. This record does not replace it.
    - Not a SÉTA implementation and not an EndRing theorem.
    - A timeout, a crash, or a route disagreement is not evidence against the statement.
  dominated_by:
    verdict: not_applicable
    justification: A finite torsion audit. No exponent is claimed.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Records fiber counts 7, 5, 5 and largest fibers 2, 3, 3.
  status_note: >-
    Approved with EXP-SSI-494592 by DEC-20261005-1f5fae under the
    standing user authorization of 2026-09-06.
