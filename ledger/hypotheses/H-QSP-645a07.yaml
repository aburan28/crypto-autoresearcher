  reduction_chain:
    core_problem: >-
      Bounding the K-rational root count N_K(L) of L = X^{p^{n'}} - lambda(X)
      for n' not dividing n (claim (A)).
    corollaries:
    - problem: >-
        The admissible quality beta of every completely splitting quasi-subfield
        polynomial with n' < n not dividing n and r >= 1 (claim (B)):
        beta >= n/(n + n' - r) > 1/2.
      reduction_ref: >-
        internal, one line from (A) by comparing p^{n'} with
        max(d^{q+1}, p^{n'-r}), preceded by the two-conjunct step that gives
        n' < n
      asymptotics_preserved: not applicable (exact inequality, no asymptotics)
    - problem: >-
        The Proposition 8 cost of the quasi-subfield algorithm at any (p, n, n')
        with n' < n not dividing n, under H1 AND under the unsupported proviso
        kappa >= (n-1)/n (closure (E)).
      reduction_ref: KN-LIT-4fe9d2 Proposition 8 (retrieved), alpha_beta = 1/(2 kappa beta)
      asymptotics_preserved: >-
        Conditional on H1 and on the proviso. The exponent
        max(2 alpha_beta/m, 1 - alpha_beta(1/2 - 1/m)) is evaluated at integer m
        for n = 131 and reported as arithmetic on (B), NEVER as a measurement.

  predictions:
    note: >-
      THIS RECORD PRE-REGISTERS NOTHING NEW AND OPENS NO EXPERIMENT. The
      predictions of H-QSP-5540d7 (M1-M7) were pre-registered in the frozen
      contract of EXP-QSP-33b442, that contract ran, and its outcomes are in
      EV-QSP-a6aa4b. Restating them here as though they were open would convert
      an executed pre-registration into a post-hoc one. What follows are the
      STANDING predictions of the restated statement at the directions NOTHING
      HAS MEASURED, so that a future frozen contract has something to be scored
      against.
    standing:
    - metric: >-
        P1 -- N_K(L) / max(d^{q+1}, p^{n'-r}) for K-COEFFICIENT lambda at
        n = 131, which nothing in the program has touched (Stage 1b reached
        K-coefficients only at n = 11 and n = 13)
      direction: lower
      minimum_effect: >-
        <= 1 on every candidate. A single candidate above 1, certified by an
        explicitly listed and independently re-verified root set, is F1 and
        refutes (A) as stated.
    - metric: >-
        P2 -- the same ratio at n = 131 for lambda of exact degree ABOVE 7,
        which the census capped out
      direction: lower
      minimum_effect: <= 1 on every candidate; F1 otherwise.
    - metric: >-
        P3 -- the same ratio at p OUTSIDE {2, 3, 5, 7}, where no measurement of
        any kind exists and the transfer is by the derivation alone
      direction: lower
      minimum_effect: <= 1 on every candidate; F1 otherwise.
    - metric: >-
        P4 -- for any completely splitting L found at r >= 1 and n' < n
        anywhere: beta - n/(n + n' - r), and beta - n(n' - 1)/(n'(n + n' - r))
      direction: higher
      minimum_effect: >-
        >= 0 on the exact corollary, and a fortiori on the conservative one. A
        complete splitter below the exact corollary is F2; if it nonetheless
        satisfies the conservative form, the max form of (A) is wrong somewhere
        and the record WEAKENS to the sum form rather than being rejected.
    - metric: >-
        P5 -- the eliminant degree or solution count at (m, d) = (2, 2) and
        (2, 3), the cheapest cell that discriminates H1 and needs a resultant
        rather than a Groebner engine
      direction: different
      minimum_effect: >-
        A collapse below M(E) = 2^{m(m-1)} d^{m(m-1)/2} by a factor GROWING WITH
        d is H1's falsification condition and would refute (E)'s conclusion. The
        test is ASYMMETRIC and the asymmetry must be stated in the contract
        rather than discovered afterwards: a non-collapse at m = 2 is weak
        evidence for kappa >= 1, while a collapse at m = 2 is strong evidence
        against it. NA-5 designs this; it is not designed here and designing is
        not approving.

