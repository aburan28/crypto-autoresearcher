  heuristic_assumptions:
  - id: H1
    formal_statement: >-
      (Scope of the closure (E), not of Part I.) For the chain system S of
      KN-LIT-0a321c Section 3.1 at parameters (n, n', d, m), the cost of one
      decomposition attempt is at least M(E) = 2^{m(m-1)} d^{m(m-1)/2} field
      operations, uniformly in the instance; equivalently the total cost is
      governed by Proposition 8 of KN-LIT-4fe9d2 with some kappa >= 1, so that a
      factor base with beta > 1/2 cannot be compensated by a cheap solver.
      THE WEAKEST FORM (E) ACTUALLY NEEDS IS kappa >= (n-1)/n, which is 1/n
      below H1's own assumption and tends to it.
    random_model_justification: >-
      RECORDED HONESTLY UNDER NA-4(g), WHICH MEANS RECORDING THAT THERE IS NO
      RETRIEVED SUPPORT IN THE DIRECTION (E) USES THIS HEURISTIC.
      WITHDRAWN AS STATED: the previous declared "rigorous ingredient" asserted
      that the univariate eliminant h of Lemma 3.1 of KN-LIT-0a321c "has degree
      M(E)" and that root-finding a polynomial of degree M(E) "costs at least
      M(E) operations". ITS OWN CITED APPENDIX SAYS THE OPPOSITE IN BOTH
      PLACES: Huang Appendix A.1 says the polynomials are of degree "bounded by
      M(E)" and that root-finding's cost "can be neglected in the overall
      complexity estimation" (inputs/HUANG-2020-JMC-QSP/paper_fulltext.md lines
      1116-1118), and Lemma 3.1 gives the eliminant cost as a big-O. Both are
      UPPER bounds. The assertion is withdrawn rather than softened.
      WHAT SURVIVES, RETRIEVED: an upper bound on the eliminant degree and an
      upper bound on the solving cost. NEITHER SUPPORTS H1, because H1 is used
      to exclude a CHEAP solver and that exclusion needs a LOWER bound.
      THE STEP THAT WOULD BRIDGE THE GAP is the BKK / mixed-volume
      generic-attainment statement -- that the mixed-volume count is generically
      attained by systems with the given supports, so the eliminant does not
      collapse for a generic instance. THAT STATEMENT IS MARKED `recalled` IN
      THIS PROGRAM AND NO AGENT HAS OPENED IT; AGENTS.md rule 9 bars a recalled
      reference from discharging a heuristic's supporting_results. It is
      retained below as a POINTER for a reviewer and as support for NOTHING.
      A SUBSTANTIVE OBJECTION THAT SURVIVES EVEN IF SOMEONE RETRIEVES IT: the
      generic-attainment statement is about GENERIC supports, and these
      instances are not generic -- they are chain systems built from summation
      polynomials composed k times with a fixed lambda, whose supports are
      highly structured. Whether the mixed volume is attained on that family is
      the untested question, and a citation to the generic theorem does not
      settle the structured case (KN-OPEN-ac409f).
      CONCLUSION, STATED SO IT CANNOT BE MISREAD: AFTER HONOURING ITS OWN
      `recalled` LABEL, H1 HAS NO RETRIEVED SUPPORT IN ITS LOAD-BEARING
      DIRECTION. THIS IS A STATEMENT ABOUT THE RECORD'S SUPPORT AND NOT A CLAIM
      THAT H1 IS FALSE. H1 may well be true; it is needed only for (E), and
      (A)/(B) are unconditional.
    supporting_results:
    - >-
      KN-LIT-0a321c Appendix A.1: eliminant degree "bounded by M(E)", and
      root-finding cost that "can be neglected"
      (inputs/HUANG-2020-JMC-QSP/paper_fulltext.md:1116-1118). Provenance
