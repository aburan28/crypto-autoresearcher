  falsification_conditions:
  - >-
    F0. A step of (A) fails -- an identity does not hold, the degenerate case is
    mischaracterised, or D is applied to an element outside K: (A) is withdrawn
    and this record is superseded, not patched. Attacked at J1 and held.
  - >-
    F1. Any non-degenerate lambda at any p, n, n' with
    N_K(L) > max(d^{q+1}, p^{n'-r}), certified by an explicit root list a
    wrapper re-verifies: (A) is false as stated. If N nonetheless satisfies
    N <= d^{q+1} + p^{n'-r}, the max form is false and the sum form survives
    (WEAKEN to the sum form); if N exceeds the sum form too, (A) is rejected in
    scope. THIS REMAINS THE MOST VALUABLE OUTCOME THIS LINE CAN PRODUCE, and the
    directions where it would most plausibly live, in order, are: p outside
    {2,3,5,7}; degree above 7 at n = 131; K-coefficient lambda at n = 131.
  - >-
    F2. Any completely splitting L at r >= 1 with n' < n and
    beta < n/(n + n' - r): (B) is false as stated, with the same weaken/reject
    split against the conservative threshold.
  - >-
    F3. Theorem 1's equality case or Type 2 at n = 7 not attaining the bound:
    the tightness claim (C) is false; the bound may still hold.
  - >-
    F4. A demonstrated eliminant solver for the structured chain systems with
    kappa < (n-1)/n: (E)'s CONCLUSION is refuted, not merely its stated reason.
    (A) and (B) are untouched. This is the more valuable of the two directions
    (E) can move in.
  - >-
    F5. A retrieved or derived LOWER bound kappa >= (n-1)/n for the structured
    chain systems: (E)'s proviso is discharged and (E) becomes promotable
    SUBJECT TO the rest of promotion gate (2). This is the only route by which
    (E) moves upward (KN-OPEN-ac409f).
  - >-
    F6. Instrument disagreement, a fixture returning other than its forced
    count, a timeout, a crash, a memory cap or budget exhaustion: the RUN is
    invalid or the outcome is infrastructure, and neither is ever evidence about
    (A), (B) or (E) (AGENTS.md rules 3 and 5).

