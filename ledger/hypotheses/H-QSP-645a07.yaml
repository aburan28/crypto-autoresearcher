      EXP-QSP-33b442. NA-5 of DEC-20260917-793ae2 assigns the design of that
      contract. THE IMPEDIMENT MAY BE LARGER THAN THE CHEAPEST INFORMATIVE CELL
      REQUIRES: at (m, d) = (2, 2) or (2, 3) the system is two equations, a
      resultant suffices, and no Groebner engine is needed
      (TASK-20260917-52b4e6; KN-OPEN-ac409f).
    falsification_condition: >-
      A measured per-attempt decomposition at an executable cell (n, m, d) whose
      univariate degree or solution count over the closure is below M(E) by a
      factor that grows with d, i.e. a solver whose cost does not grow like
      d^{m(m-1)/2}. Such a solver with kappa < (n-1)/n would refute (E)'s
      CONCLUSION, not merely its stated reason, and would be a more valuable
      result than the closure. Until H1 is validated, (E) stays conditional
      whatever EXP-QSP-33b442 returned.
  - id: H2
    formal_statement: >-
      (Null-object model, used only for the tail check of the n = 131 census and
      the K-coefficient fixture; not load-bearing for (A), (B) or (E).) For
      lambda drawn uniformly from polynomials of degree d over F_2 (or over
      F_{2^n}), the number of Frobenius orbits of F_{2^n}-roots of L of size n
      is approximately Poisson with mean 1/n, and the number of roots in F_2 is
      Binomial(2, 1/2); over C candidates the number of orbit-carrying
      candidates is approximately Poisson(C/n).
    random_model_justification: >-
      Rigorous ingredient: (A) holds for every lambda, random or structured, so
      the null and the structured arm live under the same ceiling. Classical
      statement imitated: the expected number of irreducible factors of degree k
      of a uniformly random polynomial of degree >= k over F_q is about 1/k
      (RECALLED, Flajolet-Gourdon-Panario style statistics; not opened by this
      program, and supporting the DESIGN of the control only).
    supporting_results:
    - >-
      None retrieved. The recalled statistic supports the design of the control
      only; the control's outcome was measured directly.
    validation_experiment_ids:
    - EXP-QSP-33b442
    outcome_note: >-
      MEASURED AND NOT REFUTED, AND INDEPENDENTLY REINFORCED. Orbit-tail upper
      probabilities 0.1190 / 1.0 / 1.0 against Poisson(1.8626) at the three
      n = 131 cells; none below the pre-registered 0.01. The blind re-derivation
      supplied its own null model: expected orbit-carrying lambda 244/131 = 1.86
      against 4 observed, Poisson P[>=4] = 0.12; after the involution
      lambda(X) -> lambda(X+1)+1, which pairs (132,251) and (161,204), 2
      independent events against 0.93 expected, P[>=2] = 0.24
      (TASK-20260917-5fa7d5 section 9). THE FOUR MAXIMIZING lambda ARE THE
      GENERIC OUTCOME AND NOT A SIGNAL: the producer's `unexpected_observation`
      that all four are degree 7, non-linearized and slack 0 requires no
      explanation, and any later claim treating them as algebraically
      distinguished lacks evidence.
    falsification_condition: >-
      An orbit-carrying-candidate count at some n = 131 cell (244 candidates,
      mean 1.86) or at a K-coefficient fixture cell whose upper-tail Poisson
      probability is below 0.01. That refutes the null MODEL at that cell and is
      reported as an unexpected observation (AGENTS.md rule 8); it does not bear
      on (A), whose ceiling holds regardless, and it is not evidence of a large
      factor base (N stays <= d^{q+1}).

