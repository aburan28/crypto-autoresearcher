      three cells' to 'bounded at every n' with n' < n and n' not dividing n',
      with the closure READING of that bound conditional on H1 and currently
      un-promotable. The decision it changes: whether RQ-QSP-f9bbdb's decision
      target (a) (an existence result at n' = 33) can be pursued for ANY
      coefficient field, or is void.
