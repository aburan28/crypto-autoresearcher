    observation_collision:
      observable: >-
        The bound max(d^{q+1}, p^{n'-r}) on N_K(L), and the corollary
        beta >= n/(n + n' - r) for every completely splitting L with r >= 1 and
        n' < n.
      distinct_preimage_search: >-
        Two shapes with the same (n, n', d) and different N exist trivially; the
        bound is an upper bound and does not identify N. The collision that
        WOULD matter is a completely splitting L with r >= 1, n' < n and
        d^{q+1} < p^{n'} (or, for the fallback threshold, d^{q+1} < p^{n'} -
        p^{n'-r}). Searched and not found across the scope in
        EV-QSP-a6aa4b obstruction.scope. The other informative collision is a
        root of D that is NOT a root of L (the 'slack'), counted per candidate.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Track the full Frobenius chain x, x^{p^{n'}}, ..., x^{p^{(q+1)n'}}
        rather than x alone: the extra step past q is what makes the
        K-rationality condition a low-degree polynomial relation (degree
        p^{n'-r}) instead of a degree-p^n one.
      predicted_gain: >-
        Replaces the degree comparison of Lemma 4.1 (d^q p^r vs p^{n'}) by the
        comparison max(d^{q+1}, p^{n'-r}) vs p^{n'}, which is strong exactly
        where Lemma 4.1 is weak (r close to n').
    - transform: observable_fiber
      proposed_object: >-
        Hold N = p^{n'} fixed and vary r: the fibre is {r = 0} union
        {r >= 1, d >= p^{n'/(q+1)}}; the separating invariant is divisibility
        n' | n.
      predicted_gain: >-
        Converts the paper's question 'does a small-d QSP exist at some
        exceptional (q, n)' into 'only at n' | n, up to the beta > 1/2 floor'.
    quantifier_order: >-
      FORALL p, n, n' with n' not dividing n, FORALL lambda in F_{p^n}[X] of
      degree d >= 1 with D != 0: N_K(L) <= deg D <= max(d^{q+1}, p^{n'-r}). The
      polynomial D depends only on (lambda, n, n'), never on an instance or a
      seed. Consequently FORALL completely splitting such L WITH r >= 1 (which
      forces n' < n by cardinality plus non-divisibility): (q+1) l >= n' and
      beta >= n/(n + n' - r) > 1/2. The degenerate lambda (D = 0, possible only
      when (q+1) | n) satisfy N_K(L) <= p^{n'-j} < p^{n'} by a separate
      argument. The closure (E) is claimed only for the shapes enumerated in
      (D), only for n' < n not dividing n, and only under H1. The weaker reading
      'for each lambda there exists some bound' is not what is claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the cost model of Theorem 3.2 / Proposition 8 (H1), and provided
        kappa >= (n-1)/n, no factor base of the form {x : x^{p^{n'}} =
        lambda(x)} with lambda polynomial in F_{p^n}[X] and n' < n not dividing
