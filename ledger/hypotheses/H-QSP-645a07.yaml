        (correction C-6). (iv) The F_p-coefficient case is the slice verified in
        CORR-20260916-8d0b81.
      reproduction_check: >-
        Performed and archived. The symbolic slices are the Stage 0 derivation
        note of EXP-QSP-33b442; the numerical fixtures are RUN-QSP-33b442-S1
        (1260 exhaustive F_2 candidates at five cells, 0 instrument mismatches),
