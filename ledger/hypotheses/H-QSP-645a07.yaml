  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate in F_{p^n} together with its
    Frobenius conjugates x^{p^{kn'}} (R1 class). Operation set Sigma =
    {sigma^{n'}, substitution by lambda}, the two generators of the chain map
    phi of KN-LIT-0a321c Section 3.1. Attack stage: factor-base membership.
    Trichotomy: the priced quantity is coordinate-dependent (Class III) -- a
    property of the field representation's Frobenius, not of any group element
    -- and the algorithm it prices is Class I partial-action index calculus.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The quasi-subfield algorithm's object
    is K[X]/(L), the projection of K[X]/(X^{p^n} - X) that forgets every root
    outside V. Sigma-compatible: sigma^{n'} acts on K[X]/(L) as phi, the
    identity f^{p^{n'}} = phi(f) mod L the paper proves. Lossy: it keeps only
    |V| of the p^n points. (A) says the projection is lossy in the wrong
    direction -- its K-rational content is at most max(d^{q+1}, p^{n'-r})
    points -- unless the projection is a subfield (r = 0), in which case it is
    Diem's object and the max form is vacuous. No new object is proposed; the
    record prices the membership fibre of the existing one, and the successor
    object is IDEA-20260916-a17f43.
    WHY THE PROOF IS THREE LINES AND WHY THAT IS THE POINT. Appendix A.2 of
    KN-LIT-0a321c already contains x^{p^{kn'}} = lambda^{ok}(x) for lambda over
    F_p and applies sigma^r on the RIGHT to reach a polynomial G of degree
    d^q p^r; the only additions are (i) the coefficient twist that makes the
    identity hold for lambda in K[X], and (ii) running the chain one step
    FURTHER, to k = q + 1, where (q+1) n' = n + (n' - r) lets x in K collapse
    the left side to x^{p^{n'-r}} -- tiny exactly when r is close to n', the
    regime the paper identified as the attacker's best case. Comparing degrees
    does the rest.
    WHY IT CANNOT PROVE TOO MUCH, AS MEASURED RATHER THAN ASSERTED. At r = 0
    the max form reads N <= max(d^{q+1}, p^{n'}) >= deg L and is vacuous, so
    subfield polynomials (d = 1, N = p^{n'}) are untouched; the vacuity is a
    CONSEQUENCE of the derivation, because r occurs in exactly one place. The
    control was run in review against both declared known-false families and
    the declared failure signature was ABSENT on each: FAMILY 1 (n' | n) --
    vacuous on all 3422 triples with n <= 32, d <= 29; 0 violations of the full
    N <= deg D form in 65832 + 7244 candidates; 141 objects at r = 0 split
    completely and the derivation is vacuous on every one; of the 288 where it
    is non-vacuous at r = 0, none splits completely. FAMILY 2 (the linearized
    family of Theorem 1) -- 1032 F_2-linearized complete splitters at n <= 40
    enumerated by Proposition 2 ALONE, with no instrument of the experiment: 0
    violations of (B), 0 objects with 3/4 <= beta < (B)'s bound (the object that
    would satisfy Theorem 1 and refute (B)), 0 with beta < 3/4, and (B) exactly
    tight at (35,15), (35,20), (33,22), (36,24), (39,26)
    (TASK-20260917-52b4e6 section 5).
    WHERE THE EVIDENCE CAME FROM, AND WHAT IT IS NOT. EXP-QSP-33b442 ran five
    numerical stages at p = 2 under a frozen protocol; TASK-20260917-34b637 and
    TASK-20260917-52b4e6 attacked six named joints at review-breakthrough / max
    in independent sessions; TASK-20260917-5fa7d5 re-derived the load-bearing
    n = 131 quantity BLIND, from the statement and the parameters alone, by a
    method that never materialises L, and agreed with the producer EXACTLY on
    the maximum (132), the argmax, the candidate-set size (244), the histogram
    {0:62, 1:118, 2:60, 132:4} and the orbit sizes [1, 131]. That is evidence
    about the QUANTITY under the interpretation rule fixed in advance. It is
    NOT a replication of the experiment: no independent replication invocation
    was spent (PD-6).

  assumptions:
  - >-
    d >= 1 and D != 0 (non-degenerate). The degenerate case is fully
    characterised in the statement and is handled separately; it never splits
    completely as a set. Degeneracy is possible at all only when (q+1) | n.
  - >-
    N_K(L) counts DISTINCT roots. When lambda' = 0 (lambda a p-th power, e.g. a
    square at p = 2) L has repeated roots; the distinct-root count is what
    bounds |F| and is what is bounded.
  - >-
    (B) and (E) assume n' < n, now stated in both rather than inherited from
    the setting. (A) assumes no such thing and holds for every n'.
  - >-
    'Beats generic algorithms' means alpha_beta > 1 in Proposition 8 of
    KN-LIT-4fe9d2 with kappa the exponent of the solver; the closure (E) is a
    closure UNDER THAT COST MODEL (H1) and is stated as such. A solver model in
    which the cost does not grow with d is not excluded by (E); it is
    constrained by (A) directly, which bounds |F| and needs no cost model. A
    linear-time eliminant solver sits at kappa = 1, inside the closure at finite
    n by exactly 1/n and outside it asymptotically.
  - >-
    The derivation is for every p. Every numerical cell of EXP-QSP-33b442 is
    p = 2; the only p != 2 evidence in the program is the review artifact of
    TASK-20260917-34b637 at p in {3, 5, 7}. The transfer to general p is BY THE
    DERIVATION and never by measurement.
  - >-
    OFF-LIMITS COMPONENTS DECLARED, unchanged from H-QSP-5540d7: F2
    (factor-base decomposition) is the algorithm priced; the Frobenius-orbit
    reduction (RQ-FROB-7d8dd4) appears only inside quoted table rows; F6
    (endomorphism orbit) appears in (D)(iii) only as the reason an
    endomorphism-defined factor base is a subgroup.

  proof_search_map:
    bottleneck: >-
