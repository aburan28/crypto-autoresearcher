      parameter_slice: >-
        (i) Lemma 4.1 of KN-LIT-0a321c is the slice of the same chain identity
        where sigma^r is applied on the right at step q; (A) runs the chain to
        step q + 1 and applies x^{p^n} = x on the left. The two are incomparable
        and combine to q l + min(l, r) >= n'. (ii) Theorem 1's equality case
        (X^{p^2} + X^p + X over F_{p^3}) and Type 2 at n = 7 are the tightness
