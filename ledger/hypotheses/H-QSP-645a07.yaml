  what_this_record_is: >-
    A SUPERSEDING RESTATEMENT OF H-QSP-5540d7, MINTED BY DEC-20260917-ea9dd2
    UNDER NEXT ACTION NA-4 OF DEC-20260917-793ae2. NOTHING IN THE SCIENCE
    CHANGES HERE. No new measurement, no new derivation step, no new evidence
    record and no promotion. What changes is the TEXT: H-QSP-5540d7 is one
    record whose parts point different ways -- an unconditional bound that
    survived every attack of the review round opened by TASK-20260917-43701b,
    and a conditional closure reading whose stated reason that round refuted --
    and a single status field cannot move those two apart. This record splits
    them so they can move independently, states the n' < n clause the round
    found missing, withdraws the parts the round found overreaching, and records
    H1's support honestly. H-QSP-5540d7 is NOT edited beyond its status field
    and its text remains the historical record of what was put under review.
    Every figure quoted below is quoted from a committed artifact cited beside
    it; this session had no shell and ran nothing.

  statement: >-
    SETTING. K = F_{p^n}, sigma the p-Frobenius. For f in K[X] write f^{(k)}
    for f with every coefficient raised to the p^k-th power, so that
    f(z)^{p^k} = f^{(k)}(z^{p^k}) for every z in the algebraic closure
    (Frobenius is a ring homomorphism). Let lambda in K[X] have degree d >= 1,
    L = X^{p^{n'}} - lambda(X), and n = q n' + r with 0 <= r < n' (so q >= 1
    whenever n' < n). N_K(L) denotes the number of DISTINCT roots of L in K.
    Define the twisted iterates Lambda_1 = lambda and
    Lambda_{k+1} = Lambda_k^{(n')} o lambda, of degree d^{k+1}.

    ============================================================
    PART I -- UNCONDITIONAL. (A), (B), (C), (D). No cost model, no heuristic.
    ============================================================

    (A) THE TWISTED INJECTION BOUND, DERIVATION TIER. For every root x of L in
    the closure, x^{p^{(k+1)n'}} = Lambda_{k+1}(x) for every k >= 0:
    x^{p^{(k+1)n'}} = (x^{p^{kn'}})^{p^{n'}} = Lambda_k(x)^{p^{n'}} =
    Lambda_k^{(n')}(x^{p^{n'}}) = Lambda_k^{(n')}(lambda(x)) = Lambda_{k+1}(x).
    If moreover x in K then x^{p^n} = x, and since (q+1) n' = n + (n' - r),
    x^{p^{n'(q+1)}} = (x^{p^n})^{p^{n'-r}} = x^{p^{n'-r}}. Hence every K-root of
    L is a root of the DIFFERENCE POLYNOMIAL
    D(Y) := Lambda_{q+1}(Y) - Y^{p^{n'-r}}, and
        N_K(L) <= deg D <= max(d^{q+1}, p^{n'-r})   whenever D != 0.
    (No injection is needed in this form: x itself is the root of D. The
    proposal's form via y = x^{p^r} and H(Y) = Y^{p^{n'-r}} -
    lambda(Lambda_q^{(r)}(Y)) gives the weaker sum bound d^{q+1} + p^{n'-r};
    for lambda in F_p[X] the twists are trivial, Lambda_{q+1} = lambda^{o(q+1)},
    and D and H coincide up to sign, which is the F_2 form recorded in
    CORR-20260916-8d0b81.)
    (A) IS QUANTIFIED OVER EVERY p, n, n' AND EVERY NON-DEGENERATE lambda. It
    does NOT require n' < n; it requires only D != 0. Every step above uses
    x in K exactly once, at x^{p^n} = x, and nowhere is D applied to an element
    outside K (attacked and confirmed by TASK-20260917-34b637, joint J1).

    THE r = 0 VACUITY, STATED FOR BOTH FORMS, WHICH H-QSP-5540d7 STATED FOR
    ONLY ONE. At r = 0 the MAX form reads N <= max(d^{q+1}, p^{n'}) >= p^{n'} =
    deg L and carries no information: it is vacuous, and that vacuity is
    STRUCTURAL rather than arithmetic, because r enters (A) in exactly one
    place -- the exponent of Y^{p^{n'-r}} -- which at r = 0 is deg L itself
    (TASK-20260917-52b4e6 section 5, FAMILY 1). THE FULL FORM N <= deg D IS NOT
    VACUOUS AT r = 0 IN GENERAL: when d^{q+1} = p^{n'} the leading terms of
    Lambda_{q+1}(Y) and Y^{p^{n'}} can cancel and then deg D < deg L, so the
    bound bites. It is nevertheless correct there on everything measured -- 0
    violations of the full form in 65832 equal-degree-boundary plus 7244 broad
    candidates; 141 objects at r = 0 split completely and the derivation is
    vacuous on EVERY one; of the 288 candidates where the derivation is
    NON-vacuous at r = 0, NOT ONE splits completely (TASK-20260917-52b4e6
    section 5). What this record claims at r = 0 is therefore: the MAX form is
    vacuous, the deg D form is not, and (B) draws no conclusion at r = 0
    because (B) hypothesises r >= 1.

    THE DEGENERATE CASE. D = 0 requires d^{q+1} = p^{n'-r}, i.e. d = p^j with
    j(q+1) = n' - r (so j >= 1 because r < n'), AND Lambda_{q+1} equal to the
    monomial Y^{p^{n'-r}} exactly. A composition f o g of univariate
    polynomials OVER ANY FIELD equals a monomial Y^m only if g = c Y^e + b and
    f = c'(Y - b)^{m/e} (every root a of f forces g - a to have 0 as its only
    root, so f has one root); applied along the chain this forces
    lambda = c X^{p^j} + b, hence L = X^{p^{n'}} - c X^{p^j} - b = M^{p^j} with
    M = X^{p^{n'-j}} - c' X - b'. THE EXTRACTION c' = c^{p^{-j}},
    b' = b^{p^{-j}} REQUIRES THE p^j-TH POWER MAP TO BE SURJECTIVE ON K, i.e.
    K PERFECT -- here K = F_{p^n} IS FINITE, SO FROBENIUS IS AN AUTOMORPHISM
    AND THE ROOTS EXIST AND ARE UNIQUE. H-QSP-5540d7 wrote this step "over a
    field", which is true of the composition lemma and FALSE of the extraction
    in the stated generality; the correction is in the setting's favour and
    changes no bound. Then N_K(L) = N_K(M) <= p^{n'-j} < p^{n'}: a degenerate L
    NEVER SPLITS COMPLETELY as a set of distinct roots, it is excluded from (A)
    by hypothesis, and it is covered separately by the trivial bound
    N_K(M) <= deg M. For d not a power of p the degenerate case cannot occur.

    WHAT M ACTUALLY IS, CORRECTING A CITATION IN H-QSP-5540d7. For b = 0 (and
    then b' = 0, since b' = b^{p^{-j}}), M = X^{p^{n'-j}} - c'X is an affine
    BINOMIAL of subfield or multiplicative type, which is what Appendix C.2 of
    KN-LIT-0a321c and Proposition 6 of KN-LIT-4fe9d2 cover. FOR b != 0,
    M = X^{p^{n'-j}} - c'X - b' IS AN AFFINE TRINOMIAL, whose root set is a
    COSET of an additive subgroup, AND IT IS COVERED BY NEITHER CITED RESULT.
    H-QSP-5540d7 described the whole degenerate family as "a p^j-th power of an
    affine binomial of subfield or multiplicative type (Appendix C.2 of
    KN-LIT-0a321c; Proposition 6 of KN-LIT-4fe9d2)", which mis-cites the
    b != 0 subcase. NO BOUND DEPENDS ON THE CITATION: the bound follows from
    deg M alone, and the degenerate branch was independently confirmed on 26
    constructed instances at 26 (n, n') pairs (D == 0 symbolically on all 26,
    L == M^{2^j} as an exact integer identity, exhaustive distinct-root count
    equal to 2^{gcd(n'-j, n)}) and on the 164 further full-K degenerate lambda
    at (4,3), (6,4), (6,5), every one with N = p^{n'-j} EXACTLY and none
    splitting completely (TASK-20260917-52b4e6 section 2.2-2.3).

    WHEN A DEGENERATE CANDIDATE CAN EXIST AT ALL, WHICH IS A CRITERION ON n AND
    NOT A SMALLNESS CONDITION. Since (q+1)n' = n + (n' - r) identically,
    n' - r = (q+1)n' - n, so d = p^j with j(q+1) = n' - r is solvable in
    positive integers only if (q+1) DIVIDES n. THAT IS THE CRITERION:
    (q+1) | n. Every one of the 111 declared cells of EXP-QSP-33b442 has n
    prime with 2 <= n' < n, hence 2 <= q+1 < n, hence (q+1) does not divide n,
    hence NO CELL OF THAT EXPERIMENT COULD PRODUCE A DEGENERATE CANDIDATE and
    its reported "0 degenerate candidates" is a fact about the cell design and
    not an observation. An earlier reading -- that degeneracy is excluded
    because n' - r is small against q+1 >= 2 -- IS WRONG ON 56 OF THE 95
    STAGE-2 CELLS ((13,12) has n' - r = 11; (31,15) has 14) and is withdrawn
    here rather than repeated; the conclusion is unchanged
    (TASK-20260917-52b4e6; EV-QSP-a6aa4b boundaries).

    (B) THE BETA COROLLARY, WITH n' < n STATED. Let n' NOT divide n, let
    r >= 1, and suppose L splits completely in K as a set, N_K(L) = p^{n'}.
    FIRST, n' < n, AND THE STEP NEEDS TWO CONJUNCTS, NOT ONE.
    (i) CARDINALITY: N_K(L) counts DISTINCT roots IN K, so N_K(L) <= |K| = p^n;
    the antecedent N_K(L) = p^{n'} therefore forces p^{n'} <= p^n, i.e.
    n' <= n. (ii) NON-DIVISIBILITY: the hypothesis is that n' does not divide
    n, and n' = n divides n, so n' != n. Together, n' < n, hence q >= 1.
    CARDINALITY ALONE IS NOT ENOUGH AND THE COUNTEREXAMPLE TO THE ONE-CONJUNCT
    VERSION IS EXPLICIT: at n' = n with lambda = X, L = X^{p^n} - X has every
    element of K as a root, so N = p^n = p^{n'} is a COMPLETE SPLITTING at
    n' = n; there q = 1, r = 0, and n/(n + n' - r) = n/2n = 1/2 EXACTLY, so the
    strict inequality beta > 1/2 fails at equality. That object is excluded by
    (B)'s own non-divisibility hypothesis and by nothing else, which is why the
    second conjunct is load-bearing. IT IS ALSO THE PROVES-TOO-MUCH CONTROL
    SEEN FROM THE OTHER SIDE: n' = n is an instance of FAMILY 1, n' | n, and at
    r = 0 the bound's second term is p^{n'-r} = p^{n'} = deg L, so (A) is
    vacuous there and (B) draws no conclusion -- exactly the behaviour the
    control requires and observed (TASK-20260917-52b4e6 section 5).
    THEN, WITH n' < n AND r >= 1: L is non-degenerate (the degenerate case has
    N < p^{n'}), so p^{n'} <= max(d^{q+1}, p^{n'-r}); since p^{n'-r} < p^{n'}
    for r >= 1 this forces d^{q+1} >= p^{n'}, i.e. with l := log_p d,
    (q+1) l >= n' EXACTLY. Since (q+1) n' = n + n' - r,
        beta := l n / n'^2 >= n / ((q+1) n') = n / (n + n' - r) > 1/2,
    the strict inequality now being justified, because n + n' - r < 2n is
    exactly n' - r < n, which follows from n' < n. This is the EXACT corollary
    of the max form. The conservative form beta >= n(n' - 1)/(n'(n + n' - r))
    (from d^{q+1} >= p^{n'} - p^{n'-r} >= p^{n'-1}) is implied by it and is
    retained as the fallback threshold that survives if the max form fails
    while the sum form d^{q+1} + p^{n'-r} holds. Approximate splitting: if
    N_K(L) >= p^{n'}/c with c < p^r then d^{q+1} >= p^{n'}/c and
    beta >= n(n' - log_p c)/(n'(n + n' - r)). At n = 131 (prime, so every
    n' in 2..130 fails to divide n): beta >= 131/(131 + n' - r) >= 131/260 =
    0.504 at every n', and >= 131/132 = 0.992 at the ten n' with 131 = -1 mod
    n' (n' in {2, 3, 4, 6, 11, 12, 22, 33, 44, 66}, r = n' - 1). The premise
    (4) of RQ-QSP-f9bbdb that 131 = -1 mod n' is the best case is inverted: it
    is the worst.

    (C) RELATION TO THE PUBLISHED BOUNDS. Lemma 4.1 of KN-LIT-0a321c
    (q l + r >= n' for a QSP) and (A) ((q+1) l >= n' for complete splitting)
    are incomparable, (A) stronger iff l < r, and combine to
    q l + min(l, r) >= n'. Theorem 1 of KN-LIT-4fe9d2 (beta >= 3/4) is for
    linearized lambda with any n'; (B) is for any lambda with n' not dividing n
    and n' < n. (A) is attained with equality on Theorem 1's equality case
    X^{p^2} + X^p + X over F_{p^3} (n = 3, n' = 2, d = p, q = r = 1:
    max(p^2, p) = p^2 = N; beta = 3/4 = 3/(3 + 2 - 1)) and on Type 2 at n = 7
    (n' = 3, lambda = X^2 + X, d = 2, q = 2, r = 1: max(8, 4) = 8 = N;
    beta = 7/9 = 7/(7 + 3 - 1)); it is consistent with Type 2 at n = 31
    (n' = 15, d = 2^7, q = 2, r = 1: 2^21 >= 2^15) and with X^8 - X^3 over
    F_{2^4} (beta = 0.70 >= 4/(4 + 3 - 1) = 0.667). Section 5 of KN-LIT-0a321c
    asks whether Lemma 4.1 is tight and notes that removing the n mod n' term
    would show the approach cannot beat generic algorithms; (B) is that removal
    by a complementary bound, not by sharpening Lemma 4.1.
    TIGHTNESS IS NOW WITNESSED AT ODD CHARACTERISTIC TOO, WHICH H-QSP-5540d7
    COULD NOT SAY. The ratio N/bound is exactly 1 at (p, n, n') = (3, 8, 3)
    with d = 2 (N = 8 = max(8, 3)) and at (5, 5, 3) with d = 2 (N = 5 =
    max(4, 5)), measured by an independent implementation written against the
    STATEMENT (TASK-20260917-34b637). EVERY NUMERICAL CELL OF EXP-QSP-33b442 IS
    p = 2; the odd-p evidence is a REVIEW artifact and is scoped as such in
    EV-QSP-a6aa4b boundaries.

    (D) GENERALISATIONS, PRICED, WITH (ii) WITHDRAWN AS STATED. (i) lambda in
    K[X]: covered by (A) as stated (the twists change no degree). (ii) Rational
    lambda = a/b, a, b in K[X] coprime, d = max(deg a, deg b): WITHDRAWN AS
    STATED. H-QSP-5540d7 recorded it as a conjecture with the bound
    d^{q+1} + p^{n'-r} + q d^q; RUN-QSP-33b442-S5/report.md section 6 records
    it WITHDRAWN AS STATED because the pole bookkeeping was never written out.
    The consequence is carried through to (E) below: RATIONAL lambda ARE NOT
    CLOSED AND ARE A SURVIVOR, not a covered case. Nothing here asserts the
    rational extension is false; it is unproved and its verification route is
    the Stage 4 fixture of EXP-QSP-33b442 plus the missing derivation.
    (iii) Isogeny-L (Section 5 of KN-LIT-0a321c citing its [20], RECALLED, not
    read): a correspondence of bidegree (d, deg psi) between x and sigma^{n'} x
    falls under the correspondence form of (A) recorded in IDEA-20260916-a17f43;
    when it is an endomorphism relation the factor base is a subgroup of E(K)
    and on ECC2K-130 (|E(K)| = 4 * prime, KN-LIT-661e97) has order <= 4 or >=
    the prime. (iv) Double-large-prime, unsymmetrised and unbalanced variants
    change the relation bookkeeping, not the factor base; (A) applies
    unchanged. (v) (A) holds for every p and every n; the only escape from a
    NON-VACUOUS bound is r = 0, i.e. n' | n.

    ============================================================
    PART II -- CONDITIONAL. (E). Depends on the cost model H1 and on nothing
    in Part I being read as supplying it.
    ============================================================

    (E) THE CLOSURE READING, CONDITIONAL, RESTATED WITHOUT THE 4.876
    COMPARISON. Under the cost model of Theorem 3.2 of KN-LIT-0a321c /
    Proposition 8 of KN-LIT-4fe9d2 (heuristic H1 below), and FOR n' < n WITH
    n' NOT DIVIDING n -- equivalently, for a quasi-subfield polynomial in the
    sense of Definition 3.1 of KN-LIT-0a321c, whose requirement L | X^{q^n} - X
    supplies n' <= n from outside the derivation -- no factor base of the form
    {x in K : x^{p^{n'}} = lambda(x)} with lambda polynomial beats generic
    algorithms.
    THE SUFFICIENT CONDITION, STATED FIRST BECAUSE IT IS THE ROBUST PART. A
    factor base beats generic algorithms iff alpha_beta = 1/(2 kappa beta) > 1,
    i.e. iff kappa < 1/(2 beta) -- iff the solver is CHEAP. By (B),
    beta >= n/(n + n' - r) at every admissible n', so the smallest admissible
    beta at n = 131 over n' = 2..130 is 131/260 = 0.5038462 at n' = 130
    (q = 1, r = 1), and the closure holds as soon as
        kappa >= 1/(2 beta_min) = 260/262 = 130/131 = 0.9923664   at n = 131,
    with the general worst case n' = n - 1 giving the threshold EXACTLY
    (n-1)/n -- 0.857 at n = 7, 0.968 at n = 31, 0.9924 at n = 131, 0.9961 at
    n = 257, tending to 1. SO THE CLOSURE NEEDS kappa >= (n-1)/n AND NOTHING
    STRONGER. H1 itself assumes kappa >= 1, so (E)'s entire margin over its own
    assumption is 1/n: 0.76% at n = 131 and ZERO IN THE LIMIT.
    WHAT 4.876 IS, AND WHY IT IS NOT A REASON. Euler-Petit Proposition 7 states
    verbatim that kappa is "currently majored by 4.876"
    (inputs/EULER-PETIT-2019-QSP/paper_fulltext.md:2597) -- AN UPPER BOUND ON
    THE SOLVER EXPONENT -- and Huang Lemma 3.1 gives the eliminant cost as a
    big-O, also an upper bound. EXCLUDING A CHEAP SOLVER REQUIRES A LOWER
    BOUND. An upper bound on kappa bounds nothing in the direction (E) needs.
    H-QSP-5540d7 argued (E) by "beta > 1/2 forces kappa < 1, five times below
    Rojas' 4.876"; THAT COMPARISON IS WITHDRAWN AND IS NOT RESTATED HERE. It
    was refuted at DERIVATION tier by TASK-20260917-52b4e6 (objection O1) over
    verbatim quotations from two frozen source texts plus exact rational
    arithmetic, and the refutation is archived in EV-QSP-a6aa4b proof_refs.
    WHAT (E) THEREFORE IS, SAID PLAINLY: a conditional statement whose
    condition -- kappa >= (n-1)/n -- HAS NO RETRIEVED SUPPORT IN THE DIRECTION
    IT IS USED, and which is therefore un-promotable until a lower bound on
    kappa for these structured chain systems is established or measured. The
    open problem is stated in full at KN-OPEN-ac409f. (E) is NOT refuted in its
    CONCLUSION: no solver with kappa < (n-1)/n is exhibited anywhere; the break
    is that nothing in the record excludes one.
    ARITHMETIC ON (B), REPORTED AND NEVER MEASURED. At n = 131 the Proposition 8
    exponent at the bound is >= 0.898 (2^117.7) at every n' against rho's 2^60.9
    (KN-LIT-096). THIS IS ARITHMETIC ON (B) AND ON H1, NOT A MEASUREMENT OF ANY
    SOLVER: no decomposition was attempted and no Groebner, resultant or
    sub-quadratic GF(2)[X] engine is installed. Proposition 7 instantiated in
    full at integer m (carrying m!, m^{5.188} and 3^{kappa m^2}, which the
    m >> 1 form drops), minimised over n' not dividing n and m in 2..59 at
    beta = (B)'s bound and kappa = 4.876, gives 2^166.43 at (n' = 3, m = 2);
    dropping 3^{kappa m^2} entirely still gives 2^126.24. The idealisation
    therefore errs TOWARD the attacker by about 49 bits, which for a
    non-existence claim is the conservative direction -- and ALL OF IT IS
    CONDITIONAL ON kappa = 4.876 and hence on the very quantity in question
    (TASK-20260917-52b4e6).
    NAMED OBSTRUCTION: the K-rational fibre of the quasi-subfield relaxation is
    bounded by the degree of the difference polynomial D. Measured value and
    scope: EV-QSP-a6aa4b obstruction.
    FORWARD GUIDANCE -- FOUR SURVIVORS, NOT THREE. What (E) does NOT close:
    (S1) n' | n, Diem's subfield family; at n = 131 only n' in {1, 131}.
    (S2) correspondence shapes of conjugate degree >= 2 (IDEA-20260916-a17f43),
    which must be shown to RAISE deg D rather than to find a luckier lambda --
    see design_constraints_issued below.
    (S3) factor bases that are not root sets of a single X^{p^{n'}} - lambda.
    (S4) RATIONAL lambda, ADDED HERE, because (D)(ii) is WITHDRAWN AS STATED
    and H-QSP-5540d7's survivor list silently absorbed it.
    NO ATTACK, NO EXPONENT, NO STATEMENT ABOUT DEPLOYED CURVES.

  part_status:
    note: >-
      THE SPLIT REQUIRED BY NA-4 IS EXPRESSED HERE. The AGENTS.md lifecycle
      field `status` below is one field on one record and therefore cannot
      carry two answers; this block carries the per-part position so a later
      Coordinator decision can move one part without touching the other, which
      is the entire purpose of superseding H-QSP-5540d7. ONE IDENTIFIER WAS
      MINTED FOR THIS ACTION (H-QSP-645a07), so the split is INTERNAL to this
      record. If a future decision needs the two parts on genuinely different
      lifecycle tracks, it mints a second hypothesis id and supersedes this
      record again; that is a further act and is not performed here.
    part_I_unconditional:
      covers: (A), (B), (C), (D)
      position: analyzed
      evidence: EV-QSP-a6aa4b, direction `weakens` overall but SUPPORTING these
        parts at derivation tier on the tested scope, strength `strong`.
      what_blocks_promotion: >-
        Nothing in Part I was refuted and no refutation artifact of any tier was
        produced against (A) or (B). What blocks promotion of the RECORD is
        stated under `status` below and is not a defect of Part I: the record
        still carries Part II, promotion gate (2) of agents/coordinator.md is
        unsatisfied while H1 is unvalidated, and no independent replication
        invocation was spent (PD-6). A decision that wishes to promote Part I
        alone must first separate it onto its own record.
      what_would_move_it: >-
        Upward: a replication or a second independent lineage at the untested
        directions named in test_boundary.untested, plus separation from Part II.
        Downward: F1 or F2 below, at any p, n, n'.
    part_II_conditional:
      covers: (E)
      position: conditional_unvalidated_not_promotable
      what_blocks_promotion: >-
        Two independent blocks, either sufficient. (i) H1 carries
        validation_experiment_ids [] and IDEA-20260916-b84e2d is a proposal at
        status `proposed`, so no EXP-* id exists for promotion gate (2) to name;
        the gate's last sentence is unconditional. (ii) The condition (E) needs
        is a LOWER bound on kappa and every located constraint is an UPPER bound
        (KN-OPEN-ac409f).
      what_would_move_it: >-
        Upward: an established lower bound kappa >= (n-1)/n for the structured
        chain systems, by literature or by the measurement KN-OPEN-ac409f
        describes, PLUS the rest of gate (2). Downward: a demonstrated solver
        with kappa < (n-1)/n, which would refute (E)'s CONCLUSION rather than
        its stated reason and would be a more valuable result than the closure.

