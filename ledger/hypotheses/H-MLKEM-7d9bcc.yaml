hypothesis:
  id: H-MLKEM-7d9bcc
  # MINTED by the orchestrating session (tools/allocate_id.py --next
  # hypothesis --area MLKEM, --check'd, and two-scope cross-ref verified
  # against the 25 most-recently-updated remote branches, 0 hits) before
  # this record was filed under ledger/hypotheses/. EXP-MLKEM-42ea04
  # (referenced throughout this file) was minted and verified the same way.
  # RUN-* identifiers remain unminted -- those are per-run instances, minted
  # only when an actual run occurs, not by this drafting/filing step.
  goal_id: GOAL-MLKEM-005
  question_id: RQ-MLKEM-001
  source_idea: IDEA-20260805-3d71ca
  source_idea_companion: IDEA-20260814-8f8f45
  source_idea_optional_covariate: IDEA-20260814-137f68

  statement: >-
    CLAIM TIER: toy (q = 3329 is a 12-bit prime; toy by the mechanical
    field-bit-size rule of docs/claims-and-verification.md regardless of the
    tested BKZ dimension d in {256, 512}). NO ML-KEM BREAK IS CLAIMED, NOTHING
    HERE TOUCHES KEY RECOVERY, and no claim is made beyond the tested (n,
    beta) cells. Two conjuncts, each independently falsifiable, sharing one
    (basis, target)-generation apparatus so that the second is measured at
    zero marginal reduction cost against the first (see "Why one hypothesis,
    not two" below).

    (C1, THE TAIL LAW AND ITS BIT-SAVINGS READOUT -- from IDEA-20260805-3d71ca
    verbatim, unmodified in substance). For a static ML-KEM-shaped
    encapsulation key used for M ciphertext encapsulations under one
    BKZ-beta-reduced basis B of the q-ary lattice Lambda_q(A^T), the squared
    projected-error ratio R = ||pi_{d-beta}(t)||^2 / ||e||^2 of a ciphertext
    target t follows, over the left tail relevant to best-of-M selection,
    EITHER the frozen-norm Beta(beta/2, (d-beta)/2) law (Model B) OR the
    spherical-error chi-square law (Model A) OR NEITHER -- these differ by a
    factor sqrt(1 - beta/d) = 0.775 in the tail deviation at beta/d = 0.4, and
    the measurement resolves which. Under Model A the implied one-out-of-M
    session-key-recovery saving at M = 2^30, ML-KEM-768-like shapes, is 10.3
    bits; under Model B, 7.7 bits; each figure is a back-of-envelope from the
    model named beside it, not a measurement and not an ML-KEM cost claim.
    >= 5 bits at the tested M is the pre-registered materiality gate; < 2
    bits closes the mechanism as a curiosity at the tested shapes.

    (C2, THE ORDER-STATISTIC FLOOR TEST -- from IDEA-20260814-8f8f45
    verbatim, unmodified in substance). C1's Beta/chi-square comparison tests
    the single-draw MARGINAL law. It does not test whether the running
    minimum R_min(M) of M independent draws under one fixed basis can
    actually reach the small values the marginal law's left tail predicts,
    because e is drawn from a FINITE CBD(eta) alphabet: the achievable set of
    R values for a fixed basis is itself finite, so R_min(M) is bounded below
    by a basis-specific floor r_min(B) > 0 that no amount of additional
    sampling can beat, whereas the continuous Beta/chi-square models predict
    R_min(M) -> 0 as M -> infinity with no floor. C2 asks, independently of
    C1's own verdict: (a) does the empirical decay of R_min(M) over the
    reachable range of M (up to 2^20-2^22) show measurable deceleration
    relative to the Beta-law extreme-value asymptotic rate, and (b) does an
    exact (or certified-gap branch-and-bound) search for the minimum
    achievable R over the FULL finite CBD support, at a toy dimension small
    enough for exhaustive search (d <= ~20-30), sit strictly ABOVE the
    Beta law's own predicted quantile at the corresponding effective
    population size M = (2*eta+1)^d? A confirmed floor does not itself
    change C1's own bit-savings number; it TIGHTENS how far C1's own
    left-tail reading may be extrapolated toward larger M than the tested
    range (this includes tightening IDEA-20260814-10e5e1's own separately
    dispatched, out-of-scope-here, unbounded-M rows -- this hypothesis makes
    no claim about that idea's own arithmetic).

    WHY ONE HYPOTHESIS, NOT TWO. This drafting task's own reasoned call
    (task card TASK-20260814-dfaa60, deliverable 1): C1 and C2 are a SECOND
    CONJUNCT of one hypothesis, not a companion hypothesis and not a bare
    sub-claim folded into C1's own falsification list, for TWO reasons, with
    a third, OPERATIONAL point noted separately below (an earlier draft of
    this record miscounted it as a third structural reason; corrected here).

    First, GOAL-MLKEM-005's own completion criterion C3 (ledger/goals/
    GOAL-MLKEM-005.yaml completion_criteria.items) asks for a SINGLE
    adjudication of the projected-error left-tail measurement against its
    pre-registered prediction, and both conjuncts contribute to that single
    adjudication -- but NOT as two co-equal, structurally symmetric angles on
    it. C2 is SUBORDINATE to C1, exactly as this record's own
    interpretation_limits state below: "C2 does not, by itself, produce a C1
    bit figure; a confirmed floor only tightens how far C1's own reading may
    be extrapolated." C2 tests a BOUNDARY CONDITION on C1's own left-tail
    reading (whether the order-statistic decay the marginal law implies
    actually reaches the values the marginal law predicts, or is capped by a
    combinatorial floor first) -- not an independent second reading of the
    same adjudication. Treating C2 as a co-equal, independent hypothesis
    would misrepresent this subordinate relationship as much as burying it in
    a bare falsification-condition bullet would; a second CONJUNCT of the
    SAME hypothesis, explicitly subordinate in its own falsification
    structure and its own status effect (interpretation_limits, above),
    matches the actual relationship between them.

    Second, this program's own established precedent for exactly this shape
    -- H-MLKEM-11aabf's own C1 (exact fibre census) / C2 (block-size readout)
    split -- is a two-conjunct SINGLE hypothesis where each conjunct has its
    own falsification conditions and its own predictions, which is the same
    shape C1/C2 here have.

    A THIRD POINT, OPERATIONAL RATHER THAN STRUCTURAL, NOTED SEPARATELY.
    IDEA-20260814-8f8f45's own interpretation_limits state directly that it
    "is a NECESSARY COMPLEMENT to, not a replacement for, 3d71ca's own
    H1/H3 measurement -- it should be commissioned as an addition to that
    same protocol, not as an independent second experiment." An earlier
    draft of this record read this as the idea's own author "already
    [arguing] against the companion-hypothesis structure" and counted it as
    a third reason for the one-hypothesis choice above; that reading is
    corrected here. The cited text is an argument about sharing ONE
    EXPERIMENT CONTRACT (avoiding duplicated basis/target-generation cost),
    not a claim about HYPOTHESIS-RECORD structure -- 8f8f45's own author
    never addresses whether C1 and C2 belong in one hypothesis record or
    two. That question is answered by the first two reasons alone.

    A bare sub-claim folded into C1's own falsification_conditions was
    rejected because C2 carries its own numbered heuristics (H4, H5 below),
    its own predictions, and its own forced-value NULL-2/NULL-3 controls,
    which deserve first-class representation rather than a single buried
    bullet.

    IDEA-20260814-137f68 (the GSA-profile-fidelity covariate) is NOT a third
    conjunct of this hypothesis. Its own interpretation_limits state it is
    "DIAGNOSTIC ONLY" and that "a positive finding here does not itself move
    C1's bound in either direction" -- it makes no falsifiable prediction
    about whether C1 or C2 is TRUE, only a diagnostic correlation about WHY a
    departure, if found, might correlate with reduction quality. It is
    admitted into the shared protocol (prereg.md) as a discretionary,
    zero-marginal-cost analysis of Stage-1 byproduct data (per this goal's
    own next_action, which licenses but does not require it, conditional on
    it "not materially complicating the protocol" -- satisfied here because
    it needs no new basis generation and no new target sampling, only a
    second scalar computed from GSO data the main measurement already
    produces), but it is not itself part of this hypothesis's falsifiable
    structure and its outcome cannot move this hypothesis's status.

  mechanism: >-
    FIPS 203 ciphertext c = (u, v) with u = Compress(A^T r + e_1, d_u). For a
    fixed encapsulation key every ciphertext is a BDD target on the SAME
    lattice Lambda_q(A^T); only the target moves. Standard single-target
    costing pays T_BKZ(beta) / p(beta), because lowering p below ~1 must be
    repaid by re-randomising the basis and re-running BKZ. In the static-key
    setting M independent targets supply M independent draws of the success
    event at the price of ONE reduction. Two further ML-KEM-specific facts
    sharpen this from "M free repetitions" to something strictly stronger
    (C1's own mechanism, BOTH components carried, verbatim from
    IDEA-20260805-3d71ca -- an earlier draft of this record carried only
    component (i) and mislabelled that partial carry "unmodified"; corrected
    here). (i) SELECTION. The per-target projected-norm statistic rho(t) is
    computable in O(d^2) without attempting the expensive decode, so an
    attacker spends O(M d^2) to find the best targets and enumerates only
    those. (ii) FREE VERIFICATION. The FO transform derives the encryption
    coins deterministically as r = G(m || H(ek)), so any candidate decoding
    can be verified exactly and offline by re-encrypting -- list decoding
    therefore costs list size and nothing else: there is no distinguishing
    step and no false-positive budget. Both components are load-bearing:
    (i) alone would still require a distinguishing/false-positive accounting
    step per candidate; (ii) alone gives free verification but no cheap way
    to select which candidates are worth verifying. Together they give
    "select cheaply via rho(t), verify for free via re-encryption," which is
    the complete mechanism this hypothesis's C1 conjunct measures the
    left-tail distribution for.
    C2 adds no new mechanism of its own; it interrogates whether the SAME
    statistic's left tail, at the SAME fixed basis, is limited by a
    combinatorial floor that the continuous approximation C1 tests against
    cannot see, because the CBD(eta) alphabet e is drawn from has only
    (2*eta+1)^d achievable error vectors, hence a finite achievable set of R
    values with a genuine minimum -- a fact about the FINITE SUPPORT of the
    error distribution, not about the attack.

  assumptions:
    - >-
      The attacker observes M ciphertexts produced under one static ML-KEM
      encapsulation key (the HPKE/static-KEM deployment; M = 1 in the TLS 1.3
      ephemeral deployment, where the mechanism this hypothesis measures is
      void by construction).
    - >-
      Breaking one session (message/shared-secret recovery for one
      ciphertext) is counted as a material outcome; nothing here establishes
      long-term secret-key recovery.
    - >-
      The Gram-Schmidt tail profile (C1) and the running-minimum trajectory
      plus exact floor (C2) are computed against the SAME reduced basis for
      all M targets of a given (key, basis) draw -- both conjuncts share one
      basis-generation cost, which is the entire justification for testing
      them together.
    - >-
      C2's finite-alphabet floor argument is a deterministic combinatorial
      fact (a finite set has a minimum); its only heuristic content is
      FEASIBILITY of computing that minimum within budget at a toy dimension
      still informative -- an engineering claim, validated by direct
      wall-clock measurement (HEUR-MLKEM-7d9bcc-4 below), not assumed.

  proof_search_map:
    not_applicable_reason: null
    bottleneck: >-
      C1: the factor 1/p(beta) in the single-target primal-BDD cost T =
      T_BKZ(beta)/p(beta) -- removing it (selection-over-targets replacing
      repetition-by-re-randomisation) is the entire claimed gain, verbatim
      from IDEA-20260805-3d71ca.proof_search_map.bottleneck. C2: whether the
      continuous Beta extreme-value law this hypothesis's own C1 conjunct
      needs to describe the LEFT TAIL remains valid at the large-M end of the
      reachable range, or silently breaks down against a hard combinatorial
      floor before that end is reached, verbatim from
      IDEA-20260814-8f8f45.proof_search_map.bottleneck.
    baseline_embedding:
      parameter_slice: >-
        C1: M = 1 reproduces standard single-target primal BDD exactly
        (selection is vacuous). C2: M = 1 reduces the running-minimum
        trajectory to a single point with no order-statistic content, and is
        EXCLUDED from any decay-rate fit as a degenerate case, not a data
        point (both carried verbatim from the source ideas).
      reproduction_check: >-
        C1 (frozen regression fixture): at M = 1 the measured decode-success
        rate over independent (basis, target) pairs must equal the p(beta)
        the pinned estimator's own primal_bdd amplification assumes, to
        within the sampling interval; a mismatch invalidates the whole
        measurement before the multi-target arm is read. C2 (forced null,
        run first): at the SAME (n, beta) cells, C2's trajectory computation
        run on the required NULL-2 (Gaussian, continuous, matched-variance)
        arm must show NO measurable deceleration and NO brute-force floor
        above the Beta-law prediction -- a real, non-tautological check,
        because a bug that always reports "floor detected" regardless of
        input would fail it.
    observation_collision:
      observable: >-
        C1: the scalar rho(t) = ||pi_{d-beta}(t~)|| / (sigma sqrt(beta)).
        C2: the pair (measured decay-rate deceleration, exact r_min(B) versus
        its Beta-law prediction).
      distinct_preimage_search: >-
        C1 (verbatim): a target with a LARGE error vector whose projection
        happens to be small, and a target with a SMALL error vector whose
        projection is large, both exist by construction; rho does NOT
        identify "this target has a short error" -- the additional condition
        separating them is that decodability depends on the PROJECTION, not
        the full norm, which is exactly why rho and not ||e|| is the right
        observable. C2 (verbatim): a floor detected by BOTH the real-CBD arm
        and the NULL-2 (Gaussian) arm would be a collision on the
        discreteness explanation -- it would instead implicate the BASIS
        (overlapping with C1's own H3 shared-basis confound), and this idea's
        own verdict is explicitly downgraded to "floor present, basis-effect
        not excluded, discreteness not established" rather than over-claimed
        when that collision is found.
    constructive_transforms:
      - transform: telescoping_potential
        proposed_object: >-
          C1: the per-target tail profile as a randomised increment --
          instead of paying to re-randomise the unstable event (basis
          re-reduction), charge it to the free variation across targets.
        predicted_gain: >-
          Removal of the 1/p(beta) factor, capped at min(M, 1/p*) where p* is
          the estimator's own amplification factor at its chosen operating
          point.
      - transform: baseline_as_boundary_lift
        proposed_object: >-
          C1: the M = 1 single-target attack sits on the boundary of the
          family indexed by M; the claim is a strict inward improvement for
          M > 1, not mere feasibility.
        predicted_gain: 7.7 to 10.3 bits at M = 2^30 under the two stated models.
      - transform: observable_fiber
        proposed_object: >-
          C2: hold the basis B fixed, vary the forgotten structure (which
          draw achieved the running minimum, and every non-minimal draw); the
          trajectory and the exact floor are intrinsic invariants of (B, the
          CBD alphabet) that a single-draw marginal law does not expose.
        predicted_gain: >-
          Separates "the Beta law is adequate everywhere reachable" from
          "the Beta law is adequate in bulk but caps out," which bounds how
          far any downstream unbounded-M extrapolation (e.g.
          IDEA-20260814-10e5e1's own, out of scope here) may be pushed.
    quantifier_order: >-
      C1 (verbatim): FOR ALL FIPS 203 parameter sets P and all M, THERE
      EXISTS beta(M) such that FOR A RANDOM key and a random set of M
      ciphertexts, WITH PROBABILITY >= 1/2 at least one target decodes at
      block size beta(M); the witness beta(M) depends on M and the parameter
      set but NOT on the individual key or on any particular ciphertext. C2
      (verbatim): FOR the specific (n, beta, d) cells this protocol tests,
      EXISTS a measured deceleration statistic and an exact r_min(B) at the
      toy sub-cell chosen for brute-force search; no uniform claim over all
      ML-KEM parameter sets is made or attempted, and any extrapolation
      beyond the tested cells is flagged as exactly that (AGENTS.md rule 7).
    method_ceiling:
      strongest_certifiable_claim: >-
        C1: at most a saving of log2(1/p*) bits, where p* is the
        single-target-optimum success probability -- it cannot lower MLWE's
        exponent, cannot recover s, and cannot help when M = 1. C2: at most a
        quantified floor r_min(B) at TOY dimension, exactly, plus a
        statistical deceleration reading at the (n, beta) cells actually
        reached; it cannot certify the floor's value at ML-KEM dimension
        (d ~ 1000+), where exhaustive search is infeasible by construction.
      nearby_object_control: >-
        C1: the ephemeral-key deployment (fresh keypair per ciphertext,
        M = 1 by construction, basis cannot be shared) -- any pipeline
        reporting a gain there has not identified the load-bearing structure
        and is measuring its own harness. C2: any CONTINUOUS error law of
        matched variance (the same NULL-2 control) -- it has no finite
        alphabet and so cannot exhibit a combinatorial floor by construction;
        REQUIRED to pass (show no floor) before any real-CBD floor finding is
        reportable. SEE proof_architecture_audit.md SECTION 3 for a divergence
        this drafting task found between C1's own nearby-object control as
        LITERALLY specified (fresh basis per TARGET, up to 2^20-2^22 targets)
        and what is computationally tractable within this protocol's stated
        budget -- the frozen protocol (prereg.md section 3.4) scopes
        the NULL-3 control to a materially smaller M_null3, argued and
        flagged there, not silently narrowed.
    proof_obligations:
      - claim: C1 -- left-tail law of rho over targets at fixed basis.
        responsibility: success_probability
      - claim: C1 -- O(d^2) per-target selection cost and O(1) memory per target.
        responsibility: runtime
      - claim: C1 -- conversion from a factor c on required projected norm to Delta beta.
        responsibility: baseline
      - claim: C1 -- targets share one basis, so their rho values are not independent.
        responsibility: correctness
      - claim: C1/C2 -- session recovery only; s is untouched; no ML-KEM security claim.
        responsibility: scope
      - claim: C2 -- R_min(M) trajectory is a deterministic function of the draw prefix.
        responsibility: correctness
      - claim: >-
          C2 -- the brute-force/branch-and-bound search at toy d either
          completes exactly or reports a certified gap, never a silent
          approximation presented as exact.
        responsibility: feasibility
      - claim: >-
          C2 -- NULL-2 (Gaussian) shows no deceleration and no brute-force
          floor above the Beta prediction, run and checked BEFORE any real-arm
          floor finding is reported.
        responsibility: strictness
      - claim: >-
          C2 -- any floor found is reported with the collision check (basis
          effect not excluded) rather than as a clean discreteness verdict
          when NULL-2 also shows a floor.
        responsibility: scope

  rerandomization: null

  asymptotic_claim: null
  # No exponent-improvement claim: target_complexity in both source ideas
  # states explicitly this is not an MLWE exponent claim (a data-for-time
  # trade at fixed exponent, C1; a methodological tightening with no
  # attack-cost claim at all, C2). Per AGENTS.md's bias toward
  # exponent-targeting mechanisms, this hypothesis is disclosed here, plainly,
  # as NOT that kind of result -- it is admitted to this goal's portfolio
  # because it is the goal's own stated primary completion criterion (C3), not
  # because it targets an exponent.

  heuristic_assumptions:
    - id: HEUR-MLKEM-7d9bcc-1
      formal_statement: >-
        (= IDEA-20260805-3d71ca's own H1, renumbered to avoid collision with
        H-MLKEM-11aabf's HEUR-MLKEM-11aabf-1 numbering space.) For a q-ary
        lattice of dimension d arising from a uniformly random A in
        R_q^{k x k} and a BKZ-beta-reduced basis B of it, and for a target
        t = lattice point + (r, e_1 + c_u) with (r, e_1) drawn from FIPS 203's
        CBD samplers and c_u the deterministic compression residue, the
        squared projected norm ||pi_{d-beta}(t~)||^2 behaves, uniformly over
        beta/d in [0.2, 0.6], like ||e||^2 * B where B ~ Beta(beta/2,
        (d-beta)/2) independent of ||e||^2; equivalently, the last beta
        Gram-Schmidt directions of a BKZ-reduced basis are, for this purpose,
        a uniformly random beta-subspace with respect to the error.
      random_model_justification: >-
        The exact law of the squared norm of the projection of a FIXED
        vector onto a UNIFORMLY RANDOM beta-dimensional subspace of R^d is
        ||e||^2 * Beta(beta/2, (d-beta)/2) -- a theorem, not a heuristic; the
        heuristic content is only that the BKZ basis's tail directions may be
        treated as uniformly random relative to the error. The competing
        model A (chi-square) is the same statement with ||e||^2 replaced by
        its own fluctuating value, i.e. it double-counts the norm
        fluctuation, and is stated as the alternative precisely so the
        measurement can separate them.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-42ea04]
      falsification_condition: >-
        The measured left tail is thinner than BOTH derived curves by enough
        that the implied saving at the tested M falls below 2 bits (3d71ca's
        own falsification_conditions item 1).
    - id: HEUR-MLKEM-7d9bcc-2
      formal_statement: >-
        (= 3d71ca's own H2.) The conversion from a multiplicative factor
        c < 1 on the required projected norm to a block-size reduction is
        Delta beta = ln(c) / (2 ln delta), with delta the root-Hermite factor
        of BKZ-beta, uniformly over beta in [300, 900].
      random_model_justification: >-
        This is the 2016-estimate success condition sigma sqrt(beta) <=
        delta^{2 beta - d} q^{m/d} differentiated in beta at fixed d, m, q. It
        imitates no distribution theorem; it is a first-order expansion of a
        heuristic cost model and inherits every weakness of that model. It is
        stated separately from H1 so that a failure of the CONVERSION is not
        confused with a failure of the MEASUREMENT.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-42ea04]
      falsification_condition: >-
        The measured Delta beta at each of three error scales lambda departs
        materially from ln(lambda)/(2 ln delta), with delta taken from the
        measured root-Hermite factor of the same runs (3d71ca's own
        validation_plan for H2; toy scale, labelled as such).
    - id: HEUR-MLKEM-7d9bcc-3
      formal_statement: >-
        (= 3d71ca's own H3.) Conditioned on the basis, the M per-target
        statistics rho(t_1..t_M) are exchangeable and their extreme-value
        behaviour is that of M iid draws up to a correction of at most 20% in
        the deviation (1 - x) at M = 2^20.
      random_model_justification: >-
        No rigorous support. This is the assumption most likely to be false
        and the one that carries the headline; its classical analogue is the
        independence assumption underlying extreme-value laws for
        exchangeable arrays, and the shared basis is precisely a common
        factor such laws do not permit.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-42ea04]
      falsification_condition: >-
        Variance decomposition across >= 8 independent bases shows the
        between-basis component exceeds 20% of the total variance of rho --
        the iid extreme-value calculation is void and the headline must be
        restated per basis (3d71ca's own H3 validation_plan).
    - id: HEUR-MLKEM-7d9bcc-4
      formal_statement: >-
        (= IDEA-20260814-8f8f45's own H1.) The finite-alphabet CBD error's
        own combinatorial minimum achievable projected-norm ratio, r_min(B),
        is strictly positive and computable at some toy dimension small
        enough for exact or certified-gap search within budget.
      random_model_justification: >-
        Not a random-model heuristic -- a deterministic combinatorial fact (a
        finite set has a minimum). The only heuristic content is FEASIBILITY
        (whether that minimum is findable within budget at a dimension still
        informative), an engineering claim validated by directly measuring
        wall-clock at increasing d, not assumed.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-42ea04]
      falsification_condition: >-
        Exhaustive search is infeasible at every toy d small enough to remain
        informative (e.g. d <= 8, where the projected-error statistic is too
        degenerate to be meaningful) -- reported as "NOT COMPUTED: infeasible
        within budget," never defaulted to either verdict (8f8f45's own H1
        falsification, per this program's own established
        measure_hkz_indep.py convention).
    - id: HEUR-MLKEM-7d9bcc-5
      formal_statement: >-
        (= 8f8f45's own H2.) The Beta(beta/2, (d-beta)/2) order statistic's
        classical extreme-value asymptotic rate is the correct comparator for
        "deceleration," i.e. departure from it is attributable to the object
        under test and not to a mismatch between the asymptotic regime and
        the tested M range.
      random_model_justification: >-
        The Beta distribution's own extreme-value behaviour is a theorem, not
        a heuristic; the heuristic content is only whether the TESTED M range
        (up to ~2^22) is already in the asymptotic regime for the specific
        beta/d used, which is checked directly by comparing the fit's
        residuals at increasing M rather than assumed.
      supporting_results: []
      validation_experiment_ids: [EXP-MLKEM-42ea04]
      falsification_condition: >-
        The required NULL-2 (Gaussian, matched-variance) control itself shows
        apparent deceleration -- indicates the comparator, not the CBD
        object, is the source of any real-arm reading, voiding the whole
        measurement per the controls-before-belief discipline (8f8f45's own
        H2 falsification).

  structural_ingredients:
    - description: >-
        The exact law of the squared projected norm of a fixed vector onto a
        uniformly random beta-dimensional subspace of R^d: ||e||^2 *
        Beta(beta/2, (d-beta)/2).
      citation: >-
        Classical random-subspace projection theorem (elementary; not a
        fabricated citation -- no external paper is asserted beyond this
        being a standard fact about projections of a fixed vector onto a
        Haar-random subspace, exactly as IDEA-20260805-3d71ca states it).
      role: >-
        supplies the rigorous half of HEUR-MLKEM-7d9bcc-1's justification;
        the heuristic content is confined to whether a BKZ-reduced basis's
        tail directions behave as if Haar-random relative to the error.
    - description: >-
        The 2016 BDD success-probability estimate sigma sqrt(beta) <=
        delta^{2 beta - d} q^{m/d}, used here only in its differentiated
        (Delta beta) form.
      citation: >-
        The "2016 estimate" as referenced by IDEA-20260805-3d71ca's own H2;
        not independently re-verified against its original source in this
        drafting task -- the frozen protocol re-derives delta from the
        measured root-Hermite factor of the SAME runs rather than from a
        table, exactly to avoid importing an unverified citation as load
        bearing.
      role: converts a measured norm-ratio factor into a block-size delta.

  reduction_chain:
    core_problem: >-
      Does the left tail of the projected-error ratio R, at fixed shared
      BKZ-reduced basis and real ML-KEM-shaped CBD/compression noise, match
      the continuous Beta-law prediction the multi-ciphertext selection
      mechanism's bit-savings estimate is built on, and does that match
      survive to the order-statistic/floor level or break down against a
      combinatorial floor first?
    corollaries: []
    # No downstream problem is claimed reached by a published reduction; both
    # conjuncts terminate at the measurement itself. This is disclosed
    # explicitly rather than left implicit.

  predictions:
    - metric: >-
        C1 -- best_of_M_projected_norm_ratio: min over M targets of
        ||pi_{d-beta}(t~)|| / (sigma sqrt(beta)), at beta/d = 0.4, M = 2^20
        (scaled down from 2^30 for feasibility; the model prediction is
        recomputed at the tested M and beta before the run)
      direction: different
      minimum_effect: >-
        The tested M = 2^20 must resolve a 22.5% separation in the tail
        deviation (1 - x) between Model A and Model B at beta/d = 0.4;
        DECISION RULE FROZEN BEFORE THE RUN: report which of A, B, NEITHER
        the measured tail matches, with NEITHER an explicit and expected
        branch (verbatim from 3d71ca).
    - metric: >-
        C1 -- implied_bit_saving: log2 of the ratio between single-target
        cost T_BKZ(beta_1)/p(beta_1) and multi-target cost T_BKZ(beta_M) +
        M*O(d^2), under the GSA/2016-estimate conversion Delta beta =
        ln(c)/(2 ln delta)
      direction: lower
      minimum_effect: >-
        >= 5 bits at the tested M for the mechanism to be worth a follow-up;
        < 2 bits closes it as a curiosity at the tested shapes. Pre-run point
        estimates (Model A 10.3 bits, Model B 7.7 bits) are back-of-envelope,
        not measurements.
    - metric: >-
        C1 -- selection_efficiency: Spearman correlation between rho(t) and
        actual decode success at fixed beta, over >= 10^4 targets
      direction: higher
      minimum_effect: >-
        |rho_s| >= 0.5; if the cheap proxy does not predict decode success,
        the SELECTION half of the mechanism is dead even if the
        free-repetition half survives, and the two halves must be reported
        separately.
    - metric: >-
        C2 -- deceleration statistic: ratio of the measured local decay slope
        of R_min(M) at the largest reached decade of M to the closed-form
        Beta extreme-value asymptotic slope at the same M
      direction: lower
      minimum_effect: >-
        A ratio significantly below 1 (confidence interval over >= 8
        independent draws) is the deceleration signature; a ratio
        statistically indistinguishable from 1 is a clean negative (Beta law
        adequate throughout the reached range) and is an equally complete
        result.
    - metric: >-
        C2 -- r_min(B) at the brute-force toy cell, versus the Beta law's own
        predicted quantile at M = (2*eta+1)^d
      direction: higher
      minimum_effect: >-
        r_min(B) exceeding the Beta-law prediction by any measurable, exact
        margin confirms the floor exactly; equality within floating-point
        tolerance refutes it at that cell.
    - metric: C2 -- NULL-2 (Gaussian) floor-detection outcome
      direction: different
      minimum_effect: >-
        FORCED TO ZERO -- no deceleration, no floor above the Beta
        prediction. Any nonzero reading voids the real-arm finding as an
        instrument artifact.

  test_boundary:
    instances:
      - >-
        Genuine ML-KEM-shaped instances at n in {64, 128}, k = 2, q = 3329,
        secrets and errors from the real CBD samplers (eta1 = 3, eta2 = 2),
        and real FIPS 203 ciphertext compression (d_u = 10, d_v = 4, the
        ML-KEM-512/768 compression parameters, which are defined
        coordinate-wise and independent of n), giving d = 2nk in {256, 512}.
      - >-
        One BKZ-beta-reduced basis per (key, basis) draw, at beta in {40, 55,
        70}, >= 8 independent draws per (n, beta) cell, >= 2^20 targets per
        draw (up to 2^22 where budget permits).
      - >-
        A toy brute-force/certified-gap sub-cell at d <= ~20-30, chosen by a
        measured feasibility sweep at d in {8, 12, 16, 20}, for C2's exact
        floor arm only.
      - >-
        NOT IN SCOPE: any ML-KEM-512/768/1024 standardized-parameter instance
        at full scale (n = 256); any real ML-KEM key-recovery attempt; any
        decryption-failure or timing side channel; any claim about
        IDEA-20260814-10e5e1's own separately-dispatched C1 GAIN(u)
        arithmetic.
    parameters:
      q: 3329
      n: [64, 128]
      k: 2
      d: [256, 512]
      beta: [40, 55, 70]
      eta1: 3
      eta2: 2
      d_u: 10
      d_v: 4
      toy_floor_d: [8, 12, 16, 20]
    implementation: >-
      Real fpylll BKZ reduction (first real-lattice-reduction batch in this
      goal's RQ-MLKEM-001 history, per task card TASK-20260814-dfaa60); real
      CBD samplers; real FIPS 203 Compress/Decompress; batched Babai
      nearest-plane via BLAS for target generation and rho computation. Full
      staging in PREREG-8 (coordination/goals/GOAL-MLKEM-005/batches/
      BATCH-3b9962/tasks/TASK-20260814-dfaa60/prereg.md) and
      experiments/EXP-MLKEM-42ea04/specification.yaml.
    budget: {}
    # Populated in experiments/EXP-MLKEM-42ea04/specification.yaml, not duplicated here.

  falsification_conditions:
    - >-
      C1-F1: the measured left tail is thinner than BOTH derived curves by
      enough that the implied saving at the tested M falls below 2 bits --
      closed at the tested shapes with a mechanism (basis-error dependence
      suppresses the tail), not a fatigue report.
    - >-
      C1-F2: rho fails to predict decode success (|Spearman| < 0.2) -- the
      SELECTION half is refuted; the free-repetition half survives and must
      be reported separately.
    - >-
      C1-F3: NULL-3 (ephemeral arm, at its protocol-scoped M_null3 --
      prereg.md section 3.4) shows a comparable gain -- the whole
      effect is a harness artifact and the run is void as evidence.
    - >-
      C1-F4/C2-F4: NULL-2 (Gaussian arm) fails to reproduce curve A (C1) or
      shows deceleration/a floor (C2) -- the instrument is miscalibrated and
      no arm, of either conjunct, may be read until fixed.
    - >-
      C1-F5: the per-target Babai pass is measured to cost more than 10^-3 of
      the BKZ reduction -- the "selection is free" premise fails and the cost
      model must be rewritten before any bit figure is quoted.
    - >-
      C2-F1: no deceleration is measured at the reached M range AND the exact
      brute-force floor equals the Beta-law prediction within tolerance --
      the discreteness-floor hypothesis is refuted at the tested scale; a
      complete, informative negative.
    - >-
      C2-F2: a floor IS detected in BOTH the real-CBD arm and NULL-2 -- the
      collision case; the verdict downgrades to "floor present, basis-effect
      not excluded, discreteness not established."
    - >-
      C2-F3: exhaustive/certified-gap search is infeasible at every toy d in
      {8, 12, 16, 20} -- reported as NOT COMPUTED: infeasible within budget,
      never defaulted to either verdict of C2.

  interpretation_limits:
    - >-
      SESSION RECOVERY ONLY. Ciphertexts carry no information about the
      long-term secret s; nothing in this hypothesis bears on ML-KEM key
      recovery, and no NIST category claim follows from it (C1 and C2 both).
    - >-
      DEPLOYMENT-SCOPED. M = 1 in ephemeral-per-connection use (TLS 1.3
      hybrid key exchange), where C1's mechanism is void; applies to static
      KEM keys (HPKE-style, certificate-bound).
    - >-
      TOY SCALE. n in {64, 128}, beta <= 70 is a toy claim tier by the
      mechanical field-bit-size rule; any statement at ML-KEM parameters
      (n = 256) is an extrapolation and must be labelled one. C2's exact-floor
      arm is toy even relative to C1's own toy scale (d <= ~20-30).
    - >-
      C2 does not, by itself, produce a C1 bit figure; a confirmed floor only
      tightens how far C1's own reading may be extrapolated, and a refuted
      floor leaves C1's own verdict unchanged in either direction.
    - >-
      The mechanism (C1) is Bernstein's (IACR ePrint 2022/1580), not this
      program's; what is new here is the measurement of the load-bearing
      distribution at ML-KEM-shaped parameters and, for C2, the
      order-statistic/floor structure specifically.
    - >-
      IDEA-20260814-137f68's own GSA-fidelity covariate, if run, is
      diagnostic only and cannot move this hypothesis's status in either
      direction (see "Why one hypothesis, not two" in `statement` above).
    - >-
      NULL-3, as literally specified in IDEA-20260805-3d71ca ("fresh key and
      fresh basis PER TARGET," up to 2^20-2^22 targets), is computationally
      intractable within any defensible budget; the frozen protocol
      (prereg.md section 3.4) scopes it to a materially smaller
      M_null3, argued there and in proof_architecture_audit.md section 3.
      This weakens, but does not eliminate, C1-F3's discriminating power at
      the full tested M -- disclosed here as a genuine limitation, not
      papered over.

