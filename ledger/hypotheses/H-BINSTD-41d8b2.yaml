  title: >-
    Torus-row certificate at n=131: {k: 131|Phi_k(2)} = {130,17030} for
    k<=20000; Phi_130(2) valuation 1; Lemma L toy image = ker m_t(sigma)

  statement: >-
    SETTING. KN-OPEN-095df5 leaves the Couveignes–Lercier torus row without
    a degree bound. IDEA-20260926-6f2601 claims an exact certificate:
    (Part 1) for p=131, a=2 with ord_131(2)=130, 131 | Phi_k(2) iff
    k = 130 · 131^j, so every F_2-torus carrying a rational point of order
    131 has dimension >= phi(130)=48; (Part 2) Phi_130(2) =
    409368176241571 = 131 × 3124947910241 with 131 not dividing the
    cofactor; (Part 3–4) Lemma L — every translation-stable finite-
    dimensional F_2-space of F_2-rational functions on a torsor fibre
    evaluates to a Frobenius-stable F_2-subspace of F_(2^n), hence one of
    the four subspaces of IDEA-20260918-9abf42 at n=131 — and degree-1
    on the Weil restriction gives exactly the trace-zero hyperplane;
    non-stable W only rediscover orbit unions already priced by
    KN-FIND-47da4e, at >=17030 F_2-unknowns/slot vs 131 one-hot bits.

    CLAIM (experimental reading frozen here). A pure-Python zero-curve
    script decides the certificate outcomes below. No arity m, no
    per-attempt oracle, no ECC2K-130 curve/rho touch, no exponent.

    THREE OUTCOMES (pre-registered).
    (A) {k<=20000: 131|Phi_k(2)} = {130,17030} with phi 48 and 6240;
        v_131(Phi_130(2))=1 with 2^65+1 cross-check; n=17 toy image has
        dim=8, Frobenius-stable, equals ker m_t(sigma); random-b null
        unstable in >=9/10 trials; n=131 image has dim=130 and equals
        T_0 → row recorded as certificate with numbers 48 / T_0 / 17030.
    (B) Toy image not Frobenius-stable, OR dimension outside
        {0,1,8,9,16,17} → Lemma L / torsor hypothesis wrong as stated;
        withdraw citation of this certificate.
    (C) Some k<=20000 with 131|Phi_k(2) and phi(k)<48 → Part-1 lemma
        misremembered; re-derive Parts 3–4 from the corrected set.

    NO ATTACK. Certificate column only.

  statement_note: >-
    IDEA-20260926-6f2601 claim text is immutable and left at status
    proposed. This hypothesis freezes the experimental reading: cyclotomic
    census + Phi_130 factorisation + Lemma L toys. Couveignes–Lercier
    primary text remains unread (scope obligation on the IDEA).

  mechanism: >-
    OBJECT FRAME. Certificate for the torus row of RQ-BINSTD-b6f698 /
    KN-OPEN-095df5. Representation: values f(b) of F_2-rational functions
    on a torsor fibre of a commutative group over F_2. Operation set:
    translation by generator t of the order-n subgroup, identified with
    2-Frobenius on F_(2^n). Lemma L: tau_t-stable W ⇒ ev_b(W) is a
    Frobenius-stable F_2-subspace. At n=131 those are exactly four
    (IDEA-20260918-9abf42). Degree-1 filtration on Res_(F_(2^130)/F_2) G_m
    yields T_0. Non-stable W → Frobenius orbit union already parameterised
    by KN-FIND-47da4e. Declared components: structural_certificate only;
    none of F1–F3 attack stages.

  assumptions:
    - >-
      Torsor relation sigma(b)=b+t with fibre a single Frobenius orbit of
      length n (GGMP §4.2 as relayed by KN-OPEN-095df5 / KN-LIT-0d9d28).
      Shorter orbits land in a proper subfield and do not produce F_(2^n).
    - >-
      "Functions" means F_2-rational functions regular on the fibre;
      nontrivial line-bundle sections are out of scope (AV census is the
      abelian-variety companion date-token 20260926-5c26f9).
    - >-
      Standard cyclotomic-divisor lemma (p∤a ⇒ p|Phi_k(a) iff
      k=p^j ord_p(a)) is RECALLED; Stage 0 tests it on k<=20000.
    - >-
      F_(2^17030) arithmetic for the n=131 instance may use composite-field
      representation F_(2^130)·F_(2^131); timeout/OOM is infrastructure,
      never outcome A/B math.

  proof_search_map:
    bottleneck: >-
      Whether the torus row closes by an exact argument (Lemma L + four-
      subspace count) rather than cost recall; and the surviving number —
      extra F_2-unknowns/slot of the algebraic description of an orbit union.
    baseline_embedding:
      parameter_slice: >-
        n=17, ord_17(2)=8, G=Res_(F_(2^8)/F_2) G_m; stable-subspace lattice
        dimensions {0,1,8,9,16,17}; predicted image ker m_t(sigma) of dim 8.
      reproduction_check: >-
        Stage-1 toy: Frobenius-stable dim-8 image equal to ker m_t(sigma);
        random-b null NOT stable in >=9/10 trials; order-15 null as
        hypothesis check; modulus-swap control for p=17 on k<=20000.
    observation_collision:
      observable: >-
        Set {k: 131|Phi_k(2)}; Phi_130(2) factorisation; dim/stability of
        ev_b(W_1) and equality with ker m_t(sigma) / T_0.
      distinct_preimage_search: >-
        Stable dim-8 image at n=17 could arise by accident for random b;
        random-b and order-15 nulls separate torsor relation from accident.
        At n=131 the only stable subspace of dim 130 is T_0 — no collision.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Lemma L: every translation-stable Couveignes–Lercier function
          space evaluates to a Frobenius-stable subspace (or, if unstable,
          an orbit union).
        predicted_gain: >-
          Torus row becomes a certificate with numbers (48; T_0; 17030/slot)
          instead of prose. No attack-cost gain.
    quantifier_order: >-
      FOR ALL commutative algebraic groups G/F_2, all rational subgroups T
      of order 131, all torsor fibres, all tau_t-stable finite-dimensional
      F_2-spaces W of F_2-rational functions regular on the fibre: ev_b(W)
      is one of four subspaces (Lemma L). FOR ALL F_2-tori T, 131|#T(F_2)
      implies dim T >= 48. THERE EXISTS a torus of dimension 48 with a
      rational point of order 131 (T_130).
    method_ceiling:
      strongest_certifiable_claim: >-
        At n=131 over F_2 the torus row is either one of the four
        Frobenius-stable subspaces (degree-1 gives T_0) or an orbit union
        of an ordinary subspace; minimal torus dim 48; group-law description
        costs >=17030 F_2-unknowns/slot vs 131 bits. Does not certify
        non-stable W beyond the orbit-union reduction; does not price
        fibre-equation degree; does not read Couveignes–Lercier primary text.
      nearby_object_control: >-
        n=17 toy with random-b and order-15 nulls; modulus-swap p=17
        cyclotomic set {8,136,2312} for k<=20000; n=131 instance predicting
        T_0; basis-relabel invariance of dim/stability.
    proof_obligations:
      - claim: Lemma L's three-line proof is correct and matches GGMP torsor setting
        responsibility: correctness
      - claim: '{k<=20000: 131|Phi_k(2)} = {130,17030}'
        responsibility: correctness
      - claim: Phi_130(2)=409368176241571=131×3124947910241, 131∤cofactor
        responsibility: correctness
      - claim: n=17 toy image dim 8, stable, equals ker m_t(sigma)
        responsibility: baseline
      - claim: Couveignes–Lercier torus smoothness basis is ev_b(W) or its Frobenius closure (unread primary text)
        responsibility: scope
      - claim: 82+48 equation count for T_130 / fibre is a rank count only
        responsibility: size
    not_applicable_reason: null

