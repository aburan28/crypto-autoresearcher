  statement: >-
    For the natural M-level partitions of the coordinate (popcount at
    M = 2/4/16/64, residue at M = 4/16), the pair (lambda,
    PGL_2-stability) of the t != 0 level-character combined norm
    ||g||_{1,*} = max over t != 0 of sum over k != 0 of |g-hat_t(k)|
    (probability-normalised level indicators, complex level-index
    roots; ffe1df's own battery object and f68c7f's A(v) input) is
    measurable on the census's primary ladder, with the POP2 bridge
    reproducing the character run's VT reading, and the measurement
    decides the missing row class of the synthetic-statistic table:
    (a) a partition reads Moebius-stable AND above the partition
    Parseval level by more than 2SE -- the direct construction input
    the lane consumes (replicate before any use); (b) all partitions
    read flat or unstable -- the census's scoped negative extends from
    sets to the object class the lane actually keys on, and the
    non-set escape hatch (IDEA-20260921-4af08b) is the synthetic lane's
    remaining direction; and independently, the POP16 reading against
    the ffe1df band [0.36, 0.42] settles the 0.39-construction
    question alongside the character reading (VT 0.4063, in-band).

  mechanism: >-
    The constructions key on partitions, not sets: the bias machinery
    (f68c7f's A(v), ffe1df's battery, the a5757d merge) consumes the
    t != 0 level-characters g_t = sum_c omega^{tc} 1_{A_c}, whose
    combined norm is NOT determined by any single level's reading (the
    cross-term cancellations in the t-combination are invisible to
    set-level measurements), so the census's set table does not answer
    the partition question. The prior is (b): the popcount partition's
    levels are digit-structured (the set readings were unstable), and
    the residue partition's levels are AP-structured (flat, unstable);
    but the t-combination could absorb embedding dependence that the
    levels cannot (a partition can be stable while its levels are
    not), which is exactly what the measurement decides. The M = 2
    bridge ties the observable to the measured VT row (identical
    object at M = 2).

  assumptions:
    - Canonical probability normalisation per level indicator
      (vhat(0) = 1 per level per cell).
    - The census's frozen primary ladder verbatim.
    - Complex level-index roots omega = exp(2*pi*i/M) for the
      t-combination (frozen; NOT F_p roots).
    - Toy/medium scale; positive outcomes are candidates pending
      replication and the owed independent adversarial review.

  proof_search_map:
