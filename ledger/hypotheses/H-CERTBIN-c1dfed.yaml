# H-CERTBIN-c1dfed
# Stable-subspace dimensions for IDEA-20260926-917981.
# No closure. Approval: DEC-20261002-789bf5.
hypothesis:
  id: H-CERTBIN-c1dfed
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-917981
  experiment_id: EXP-CERTBIN-c7b981
  specified_at: '2026-10-02'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261002-789bf5
  title: >-
    A 9-dimensional Frobenius-stable subspace exists at n = 17 and
    not at n = 19 or n = 131.
  statement: >-
    The order of 2 modulo 17 is 8, because 2^8 is 1 and 2^4 is 16.
    The order of 2 modulo 19 is 18, because 2^18 is 1 and 2^9 is 18.
    The order of 2 modulo 131 is 130, because 2^130 is 1 while 2^10,
    2^26 and 2^65 are 107, 53 and 130. The stable dimensions, the
    values k*ord and k*ord+1 that do not exceed n, are 0, 1, 8, 9,
    16 and 17 at n = 17; 0, 1, 18 and 19 at n = 19; and 0, 1, 130
    and 131 at n = 131. Dimension 9 is in the first list only. The
    written M_4 counts 144 and 0 are not equal.
  mechanism: >-
    The proposal says a stable 9-dimensional subspace exists only
    when the order of 2 allows it. This contract checks those
    orders and lists. It does not build a closure.
  assumptions: []
  proof_search_map:
    bottleneck: Three orders and three dimension lists.
    baseline_embedding:
      parameter_slice: >-
        The degrees 17, 19 and 131 and the dimension 9 written in
        IDEA-20260926-917981, read 2026-10-02. The orders and the
        lists were recomputed in this design session. That
        computation is not a run.
      reproduction_check: >-
        One route computes the powers and the lists. The other
        repeats both in a separate module. They must agree.
    observation_collision:
      observable: The three orders and the membership of 9.
      distinct_preimage_search: >-
        A 9-dimensional stable subspace at n = 19 is false.
        Reporting that invalidates the run.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Three degrees and one dimension.
        predicted_gain: Integer comparisons. No attack cost.
    quantifier_order: >-
      Each order is computed, then each stable list is built,
      then 9 is tested for membership.
    method_ceiling:
      strongest_certifiable_claim: >-
        The orders and the lists. Not a closure outcome and not
        a statement that the basis is irrelevant.
      nearby_object_control: >-
        The order 4 at modulus 17. 2^4 is 16, not 1.
    proof_obligations:
      - claim: The orders are 8, 18 and 130.
        responsibility: correctness
      - claim: Dimension 9 is stable at n = 17 only among the three degrees.
        responsibility: correctness
      - claim: Dimension 9 at n = 19 or n = 131 is rejected.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The order of 2 modulo n is the least positive exponent
        with 2^e congruent to 1. A stable dimension is k times
        that order, or one more, and at most n. Both were
        computed here.
      citation: ledger/proposals/IDEA-20260926-917981.yaml
