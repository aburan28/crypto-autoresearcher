      reproduction_check: >-
        Verify [2]P + tau^2(P) + tau(P) = O on two subgroup points before
        counting. Re-measure n=19 order/r; mismatch is O-ARTIFACT.
    observation_collision:
      observable: >-
        Informative colliding-pair count after deleting the kernel spanned
        by the characteristic relation of each orbit.
      distinct_preimage_search: >-
        Kernel vector vs non-kernel collision are counted separately.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: relation module modulo (tau^2+tau+2)
        predicted_gain: >-
          Removes trivial rows. Predicted collision count stays birthday
          (delta=0) under HEUR-1.
    quantifier_order: >-
      FOR ALL frozen NEW n=19 seeds and k in {2,3}: ratio in [1/2, 2].
      The conditional exponent branch (all ratios >= r^{0.05}) is not asserted.
    method_ceiling:
      strongest_certifiable_claim: >-
        Either the informative collision count matches the birthday count
        at n=19 to within a factor 2 on the new seeds, or it does not.
        A match does not prove the same at m=83. A mismatch of factor
        r^{0.05} on one unreplicated package still does not authorize
        reject_scoped alone; this replicate is the gate before that call.
      nearby_object_control: >-
        n=17 (ord_17(2)=8, cyclotomic block splits) is nearby and not
        pooled. Z/rZ control must stay in [1/2, 2] or the instrument fails.
    proof_obligations:
      - claim: tau^2+tau+2=0 on E_0 and the log-row is zero in F_r
        responsibility: correctness
      - claim: birthday expectation C(C-1)/(2r) under a uniform random sum map
        responsibility: success_probability
      - claim: Stage-0 freeze hash is unchanged after Stages 1-2
        responsibility: interface
      - claim: n=17 is not pooled with the n=19 O-* label
        responsibility: scope
    not_applicable_reason: null
