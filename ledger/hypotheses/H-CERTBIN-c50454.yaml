  statement: >-
    CLAIM (heuristic-validation REPLICATION at a toy cell; NO ATTACK; NO
    EXPONENT MOVE). Same object as H-CERTBIN-d140ae / IDEA-20260930-d2d20c:
    Koblitz E_0: y^2+xy=x^3+1 over F_{2^19} with modulus t^19+t^5+t^2+t+1,
    #E=523492=4*130873, r=130873 prime (re-measured in Stage 0; mismatch is
    O-ARTIFACT). Frobenius satisfies tau^2+tau+2=0. HEUR-1: after deleting
    that kernel, the informative/birthday ratio on unordered 3-multisets of
    a target-independent k-orbit base (k in {2,3}) lies in [1/2, 2] on every
    frozen n=19 (seed, k) cell under NEW seeds 2026100311 (primary),
    2026100312 (holdout), Z/rZ 2026100313 — disjoint from the predecessor
    seeds 2026100301/02/03. C_eff is the smallest integer whose birthday
    expectation C_eff(C_eff-1)/(2r) lies in [5, 50]; Stage-0 freezes that
    prediction before Stage 1 and later stages MUST NOT rewrite Stage-0
    artifacts. A ratio >= r^{0.05} on every n=19 cell is the exponent-reading
    falsification branch at this cell only. Predicted time exponent remains
    1/2. n=17 is a nearby object with split cyclotomic block and is NOT
    pooled with n=19. No Certicom instance is solved. This package exists
    so a stronger adverse call (reject_scoped) is not taken on the
    unreplicated EV-CERTBIN-db7f15 weaken alone.
  mechanism: >-
    OBJECT FRAME (same as H-CERTBIN-d140ae). Representation R1: k
    normal-basis / Frobenius-orbit masks of a target-independent factor
    base. Operation set Sigma: addition of base-orbit points with Frobenius
    acting as lambda on logs. LOSSY PROJECTION: discard the weight-3 vector
    and keep its class modulo tau^2+tau+2. OPEN NUMBER: informative
    colliding pairs / (C_eff(C_eff-1)/(2r)) at C_eff with expectation in
    [5, 50]. What changes in this successor is the SEED SET and the hard
    Stage-0 lock (no later-stage rewrite of freeze files), not the object.
  assumptions:
    - The curve is E_0 with trace -1 (tau^2+tau+2). A random binary curve is different.
    - Seeds 2026100311/12/13 are disjoint from predecessor 2026100301/02/03.
    - Stage-0 preregistered-predictions.json is write-once; Stage 1/2 must not rewrite it.
    - n=19 is the measurement cell; n=17 nearby is not pooled and not a replicate.
    - Amazon Bedrock prohibited. No AUXIN.
    - Full-cost S stays null. A collision among base points is not a solved public target.
    - Predecessor O-MIXED ratios are not re-scored against this package's freeze.
  proof_search_map:
    bottleneck: >-
      Supply of informative F_r-rows among a k-orbit base after the
      characteristic kernel. Replication asks whether the predecessor
