hypothesis:
  id: H-PFDR-724ad2
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260801-003
  batch_id: BATCH-2eaca1
  title: >-
    The closed-form target-descent cost gate is BOTH passable and currently
    unpassed: a decidable ten-element descent certificate, calibrated on a
    curve-free positive control where a charged descent genuinely exists
    (index calculus over F_p^*) and on three negative controls it must
    reject, admits at least one algorithm -- and no sub-rho prime-field
    ECDLP claim in this corpus currently supplies one, the missing element
    being the same one in most cases
  statement: >-
    (A) THE GATE, AS A DECIDABLE OBJECT. A claim C is IN SCOPE if it
    asserts, for prime-field ECDLP at group order N, a total cost below the
    matched Pollard rho baseline. The gate is a check on a DESCENT
    CERTIFICATE, an artifact of ten declared elements:
      D1 factor base definition and its size B as an explicit function of N;
      D2 the descent tree: root the target point R, leaves in the factor
         base, with maximum depth L(B, N) and maximum branching w(B, N),
         both closed forms;
      D3 per-node cost c_i as a closed form in (B, N) in a declared unit,
         under a charging convention frozen before the check;
      D4 per-node success probability, hence the expected attempts per
         node -- the per-attempt-cost times inverse-success-probability
         bookkeeping the target profile requires;
      D5 the total T_descent(B, N) as a closed form, ASSEMBLED from D2-D4
         with the assembly shown;
      D6 the memory M_descent(B, N) as a closed form;
      D7 the matched rho baseline T_rho(N) under the SAME charging
         convention as D3;
      D8 the end-to-end comparison T_total = T_pre + T_rel + T_lin +
         T_descent + T_ver against T_rho, with the cost-minimising B named
         and the crossover N stated;
      D9 every heuristic the certificate rests on, numbered, each with a
         falsification condition and either archived validation evidence or
         a scheduled validation experiment;
      D10 an explicit partition of the steps into MEASURED and ASSUMED.
    A certificate is checked against three references: the verifier's own
    independent recomputation of D7; a BLIND RE-DERIVATION of T_descent
    from D2-D4 alone, performed without reading D5; and evaluation of D8 at
    log2 N in {64, 128, 256}. Eight failing conditions G1-G8 are defined in
    EXP-PFDR-e0edb5 and are decidable from the certificate and those three
    references.
    (B) THE TWO CLAIMS, WHICH POINT IN OPPOSITE DIRECTIONS AND MUST BOTH
    BE TESTED. H1 PASSABILITY: the gate is not unpassable by construction.
    There exists an algorithm whose descent certificate passes every one of
    G1-G8, and the witness is index calculus over F_p^* -- where the factor
    base is a set of small primes, the descent is the classical individual
    logarithm, the tree has stated depth and branching, and the charged
    total genuinely falls below the matched sqrt(p) generic baseline. THIS
    WITNESS CONTAINS NO ELLIPTIC CURVE, and that is the point: the gate is
    a cost-accounting instrument, and if it cannot certify the one
    sub-generic descent that demonstrably works, the gate is measuring the
    accountant rather than the algorithm. A gate that no algorithm can pass
    proves nothing about the algorithms it rejects.
    H2 CURRENT NON-COMPLIANCE: applied retroactively to the in-scope claims
    of this corpus, enumerated by a reproducible query at a recorded
    commit, the pass rate is 0 -- no in-scope claim currently supplies a
    certificate satisfying D1-D10. The source idea IDEA-20260801-003 asserts
    this rate as an established historical fact ('before, the historical
    rate is 0 percent') and names BATCH-028 and BATCH-029 as instances.
    THIS RECORD DOES NOT ADOPT THAT ASSERTION. The coordinator authoring
    this hypothesis did not open those batches; the rate is PRE-REGISTERED
    AS A PREDICTION TO BE MEASURED and a single pass refutes H2.
    (C) THE STRUCTURED FAILURE CLAIM. H3: among failing claims, the modal
    missing element is D4 or D5 -- the charged assembly of the descent
    tree -- rather than D1 or D2, i.e. claims describe a descent structure
    and omit its charging, which is a different and more repairable defect
    than having no descent at all. The per-claim failing element is the
    reportable output; a diagnosis of 'incomplete' with no element named is
    not.
    (D) THE SCOPE CLAIM. H4: if the identical gate is applied to in-scope
    cost claims from this program's NON-ELLIPTIC-CURVE areas and their pass
    rate is equally 0, then 'sub-rho ECDLP claims skip the descent charge'
    is a statement about how this program writes cost claims generally, not
    about the ECDLP lane, and it may not be reported as the latter. The
    curve-free comparison is mandatory and blocking, for the same reason
    the positive control is: an audit finding that reproduces on objects
    with no curve is not a finding about curves.
    (E) WHAT THIS RECORD IS NOT. It does not adopt the gate. Adopting a
    gate as a condition of admission to GOAL-ECDLP-001 is a governance
    change requiring its own Coordinator decision on the strength of this
    verification's result. This record specifies the check and predicts its
    outcome; it changes nothing.
  mechanism: >-
    A VERIFICATION PROTOCOL, NOT AN EXPERIMENT, AND DELIBERATELY NOT FORCED
    INTO ONE. Nothing here is sampled, no curve is generated, no solver
    runs, and there is no random variable, so there is no seed, no
    replication count and no effect size. What there is instead is a
    checked ARTIFACT, a stated REFERENCE, and a decidable FAILING
    CONDITION -- and the rigor of the design lives in making all three
    inspectable rather than in statistics that do not apply.
    STAGE 1, FREEZE THE CONVENTIONS BEFORE ANYTHING IS CHECKED. The
    charging convention is written down first: the cost unit (group
    operations on E(F_p), with a stated conversion for field operations),
    whether memory access is charged, whether the rho baseline is the plain
    0.886 sqrt(N) form or an automorphism-discounted variant, and what
    counts as one node visit. G4 exists precisely because a convention
    chosen after seeing a claim can be chosen to pass or fail it.
    STAGE 2, CALIBRATE ON FOUR FIXTURES, ALL BLOCKING, BEFORE ANY CORPUS
    CLAIM IS TOUCHED.
      FIX-POS, the curve-free positive control: index calculus over F_p^*,
        whose individual-logarithm descent has a genuinely charged tree and
        a total below the generic sqrt(p) baseline. The gate MUST PASS it.
        A gate that fails a known-passing algorithm is too strict, is void,
        and no rejection it issues means anything.
      FIX-UNCHARGED, the historical-failure-mode control: a certificate
        deliberately constructed to describe a complete tree while leaving
        the tree-CONSTRUCTION step uncharged, so its stated total is below
        its true total. The gate MUST FAIL it at G3. If it passes, the gate
        does not detect the exact defect it exists to detect and is void.
      FIX-PROVES-TOO-MUCH, the known-false-conclusion control: a
        certificate for a 'descent' that charges only the leaves, which
        would therefore certify a sub-rho total for exhaustive search. The
        gate MUST FAIL it. This is controls-before-belief applied to an
        argument rather than to a measurement: a null object detects an
        artifactual signal, a known-false object detects an artifactual
        gate.
      FIX-CONVENTION-DRIFT: a certificate identical to FIX-POS except that
        D3 charges field operations while D7 charges group operations. The
        gate MUST FAIL it at G4, demonstrating that the convention check is
        live rather than nominal.
    STAGE 3, THE BLIND RE-DERIVATION. For every certificate that survives
    G1-G4, an agent re-derives T_descent from D1-D4 and the frozen
    conventions ALONE, without reading D5, D8 or the claim's narrative.
    This is not replication: recomputing from the claimant's own assembly
    reproduces a wrong-but-self-consistent assembly faithfully, which is
    the failure mode a check cannot otherwise see. Agreement is then
    evidence about the cost; disagreement localises to one of two named
    derivations and is reported as such rather than resolved by preferring
    the claimant's.
    STAGE 4, THE RETROACTIVE AUDIT AND ITS CURVE-FREE COMPARISON. The
    in-scope ECDLP claims are enumerated by the declared query, checked in
    a deterministic order, and each receives a disposition and, if failing,
    the specific missing elements of D1-D10. The identical procedure is
    then applied to the declared non-ECDLP in-scope cost claims. Both pass
    rates are reported together, always, in either direction.
  assumptions:
    - >-
      The charging conventions are frozen in the contract before any
      certificate is inspected, and are identical for the claim under check
      and for its matched baseline.
    - >-
      An independent verifier can evaluate a closed-form cost expression at
      three parameter sets by exact integer or exact rational arithmetic; a
      derivation-aid script is permitted for that arithmetic and is not a
      run.
    - >-
      The in-scope claim population is fixed by a reproducible query
      executed once at a recorded commit; the corpus grows, so the pass
      rate is a statement about a named commit.
    - >-
      The FIX-POS certificate for F_p^* index calculus is WRITTEN as part of
      this protocol from standard published cost expressions, and is not
      taken from any existing corpus record; its own construction is
      therefore part of the deliverable and is itself subject to the blind
      re-derivation.
  proof_search_map:
    bottleneck: >-
      The recurring failure named by the source idea: a sub-rho claim
      supported by a relation-collection cost with no charged
      target-descent tree. Relations alone do not imply descent, and the
      cost of descending a target to the factor base is the step that goes
      missing. The gate exists to make that step's absence decidable rather
      than a matter of reading.
    baseline_embedding:
      parameter_slice: >-
        Index calculus over F_p^* is the exact boundary where a charged
        sub-generic descent exists and is uncontroversial. It is the old
        method whose success the gate must reproduce as a PASS.
      reproduction_check: >-
        Symbolic and numeric: the FIX-POS certificate must satisfy D1-D10,
        its blind re-derivation must agree with its D5 within the declared
        tolerance, and its D8 comparison must show a total below the
        matched generic sqrt(p) baseline at all three parameter sets. If
        any of these fails, the gate has failed to reproduce a known
        result and is void before it judges anything.
    observation_collision:
      observable: >-
        The gate disposition per claim, the signed gap
        log2(T_total) - log2(T_rho) in bits at each parameter set, and the
        per-claim set of missing certificate elements.
      distinct_preimage_search: >-
        REQUIRED AND BLOCKING. Three preimages of a 0 percent pass rate:
        (i) sub-rho ECDLP claims really omit the descent charge; (ii) the
        gate is unpassable, which FIX-POS detects directly and which is the
        source idea's own second falsification condition; (iii) this
        program writes ALL cost claims without charged sub-step
        accounting, which the non-ECDLP comparison detects. Only (i) is the
        claim; (ii) and (iii) are excluded first or the rate is not
        reported as a finding about the ECDLP lane.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the verdict 'the claim is incomplete' by the pair (failing
          condition G_i, missing element set from D1-D10).
        predicted_gain: >-
          A named missing element is repairable and comparable across
          claims; 'incomplete' is a verdict a later reader cannot act on,
          which is the fatigue-report failure mode applied to auditing.
      - transform: boundary_lift
        proposed_object: >-
          Extend the check from the descent step alone to the end-to-end
          D8 comparison at three standardized parameter sets, with memory
          reported beside time.
        predicted_gain: >-
          A gate on the descent step alone can be passed by a claim whose
          other stages sink it; D8 and D6 close that hole, and the signed
          gap in bits is a quantity rather than a verdict.
    quantifier_order: >-
      CLAIMED (H1): THERE EXISTS an algorithm whose descent certificate
      passes G1-G8 -- witnessed constructively by FIX-POS, not asserted.
      CLAIMED (H2): FOR ALL in-scope ECDLP claims in the declared
      population at the named commit, the certificate fails. NOT CLAIMED:
      that FOR ALL possible sub-rho algorithms no certificate exists --
      that is the source idea's second falsification condition and would be
      a far stronger statement, which this protocol cannot establish and
      does not attempt. A 0 percent measured rate is a property of the
      claims written so far, never of the claim class.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the charging conventions frozen in EXP-PFDR-e0edb5, the gate
        passes FIX-POS and rejects the three negative fixtures; applied to
        the declared in-scope population at commit C it passes k of n
        claims, the failing claims miss the elements listed per claim, and
        the non-ECDLP comparison population passes k' of n'.' It cannot
        certify that any failing claim is mathematically wrong, that any
        passing claim is correct, or that any claim's arithmetic is sound
        beyond the three checked parameter sets.
      nearby_object_control: >-
        FIX-PROVES-TOO-MUCH: a certificate whose conclusion (exhaustive
        search is sub-rho) is KNOWN FALSE. A gate that passes it has proved
        too much and is wrong somewhere nobody has read closely enough.
    proof_obligations:
      - claim: 'The gate passes FIX-POS, a curve-free algorithm with a genuinely charged descent.'
        responsibility: baseline
      - claim: 'The gate fails FIX-UNCHARGED at G3, FIX-PROVES-TOO-MUCH, and FIX-CONVENTION-DRIFT at G4.'
        responsibility: strictness
      - claim: 'G1-G8 are decidable from the certificate and the three declared references.'
        responsibility: correctness
      - claim: >-
          The blind re-derivation of T_descent reads D1-D4 and the frozen
          conventions only, with the read set declared.
        responsibility: interface
      - claim: 'The in-scope population is reproducible from the declared query at the named commit.'
        responsibility: scope
      - claim: 'Memory is reported beside time for every certificate, so no comparison is made on time alone.'
        responsibility: memory
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        CERTIFIABILITY. For every sub-rho prime-field ECDLP proposal
        admissible to GOAL-ECDLP-001, a closed-form charged descent tree
        satisfying D1-D10 can be written down and independently verified.
      random_model_justification: >-
        No rigorous ingredient exists: this is a structural claim about a
        class of proposals, not about a distribution. The source idea
        states as much ('None; structural claim about the proposal class,
        tested by the gate itself'). What this record adds is that a
        self-testing gate is worthless without a positive control, so the
        heuristic is bounded from one side by FIX-POS: at least one
        algorithm in the wider literature is certifiable, so unpassability
        is excluded as an explanation of a 0 percent rate. Whether every
        ECDLP proposal is certifiable remains untested and is not claimed.
      supporting_results:
        - ref: IDEA-20260801-003
          provenance: internal
          claim: >-
            HEUR-ECDLP-DESCENT-GATE-1 as originally stated, its explicit
            absence of rigorous support, and its validation plan ('the gate
            is the validation').
          verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-e0edb5
      falsification_condition: >-
        FIX-POS fails the gate. The gate is then unpassable by
        construction, every rejection it has issued is void, and the
        conventions must be rewritten before any claim is checked again.
    - id: HEUR-002
      formal_statement: >-
        CONVENTION SUFFICIENCY. The frozen charging conventions are
        specific enough that two independent verifiers, given the same
        certificate, agree on its disposition and on the signed gap
        log2(T_total) - log2(T_rho) at each parameter set to within 1 bit.
      random_model_justification: >-
        No rigorous ingredient; this is a claim about the precision of a
        written convention. It is numbered so that its failure is a
        reportable result, and it is measured directly by the blind
        re-derivation, whose disagreement magnitude in bits is the
        heuristic's own test statistic.
      supporting_results:
        - ref: IDEA-20260801-003
          provenance: internal
          claim: >-
            The confounder 'charging-convention drift between gate and
            baseline', and the assumption that charging conventions are
            fixed before the check.
          verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-e0edb5
      falsification_condition: >-
        A blind re-derivation differing from the certificate's own D5 by
        more than 1 bit in log2 at any of the three parameter sets on
        FIX-POS, where the certificate is known to be correct. That
        localises the disagreement to the conventions rather than to the
        claim, and the conventions are rewritten before the audit proceeds.
  structural_ingredients:
    - description: >-
        The classical individual-logarithm (descent) phase of index
        calculus over F_p^*, with its stated depth, branching and per-node
        cost -- the curve-free positive control that establishes the gate
        is passable.
      citation: 'classical index calculus / individual logarithm; see e.g. Joux-Odlyzko-Vercauteren style descent cost expressions'
      provenance: recalled
      verified_by: null
      role: >-
        FIX-POS. RECALLED, and therefore the contract requires the
        executor to construct the FIX-POS certificate from a source it
        actually reads and to record that source's provenance in the run
        package. A recalled cost expression may not discharge the positive
        control.
    - description: >-
        The matched Pollard rho baseline 0.886 sqrt(N) group operations at
        O(1) memory, and the mandatory-control status of rho and BSGS for
        this research question.
      citation: 'ledger/questions/RQ-ECDLP-002.yaml, constraints'
      provenance: internal
      verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
      role: definition of the reference in D7
    - description: >-
        The completion criterion this gate operationalises, verbatim:
        'complete end-to-end cost accounting showing a credible asymptotic
        or concrete cryptographic advantage over matched rho/BSGS
        controls'.
      citation: 'ledger/goals/GOAL-ECDLP-001/goal.yaml lines 7009-7018'
      provenance: internal
      verified_by: coordinator, TASK-20260904-b2a7e9 (lines read verbatim)
      role: >-
        the standard D8 makes decidable. CORRECTION OF THE SOURCE IDEA:
        IDEA-20260801-003 states that this criterion 'already requires full
        preprocessing, relation, linear-algebra, target-descent,
        verification, and memory accounting'. The verbatim text does not
        enumerate those stages; it says 'complete end-to-end cost
        accounting'. The enumeration is the idea's reading, and D8 adopts
        it as a PROPOSED refinement of the criterion rather than as its
        content. No completion criterion is changed by this record.
    - description: >-
        The per-attempt-cost times inverse-success-probability bookkeeping
        and the memory-beside-time requirement that D4 and D6 encode.
      citation: 'AGENTS.md "Target result profile"; docs/target-result-profile.md'
      provenance: internal
      verified_by: coordinator, TASK-20260904-b2a7e9 (AGENTS.md section read verbatim; docs/target-result-profile.md not opened)
      role: source of the D4 and D6 requirements
  reduction_chain:
    core_problem: >-
      No attack problem is reduced and no cryptanalytic claim is made. The
      core statement is that a decidable cost-accounting check is passable
      on a known-good algorithm and currently unpassed in this corpus.
    corollaries: []
  predictions:
    - metric: 'P1 -- FIX-POS (index calculus over F_p^*, curve-free positive control)'
      direction: different
      minimum_effect: >-
        FORCED PASS on all of G1-G8. A failure voids the gate; no
        rejection it issues means anything and the audit does not proceed.
    - metric: 'P2 -- FIX-UNCHARGED (tree-construction step left uncharged)'
      direction: different
      minimum_effect: 'FORCED FAIL at G3 specifically. Failing for a different reason is also a defect and is reported.'
    - metric: 'P3 -- FIX-PROVES-TOO-MUCH (charges only the leaves; would certify exhaustive search as sub-rho)'
      direction: different
      minimum_effect: 'FORCED FAIL. A pass means the gate certifies a known-false conclusion and is void.'
    - metric: 'P4 -- FIX-CONVENTION-DRIFT (D3 in field operations, D7 in group operations)'
      direction: different
      minimum_effect: 'FORCED FAIL at G4, demonstrating the convention check is live.'
    - metric: >-
        P5 -- blind re-derivation discrepancy |log2 T_descent(verifier) -
        log2 T_descent(claimed)| on FIX-POS, in bits
      direction: lower
      minimum_effect: >-
        <= 1 bit at each of log2 N in {64, 128, 256}. A larger discrepancy
        on the known-good certificate falsifies HEUR-002 and the
        conventions are rewritten before the audit proceeds.
    - metric: 'P6 -- pass rate over the declared in-scope ECDLP claim population'
      direction: lower
      minimum_effect: >-
        PREDICTED 0 of n (claim H2). A SINGLE PASS REFUTES H2 for that
        claim, and the passing claim's signed gap becomes the record's
        most important output -- it is the source idea's own first
        falsification condition and must be reported as a survival of the
        gate, not as an exception to it.
    - metric: 'P7 -- modal missing element among failing claims, from D1-D10'
      direction: different
      minimum_effect: >-
        PREDICTED D4 or D5 (claim H3): the structure is described, the
        charging is absent. A different modal element is a more informative
        result than the predicted one and is reported as such.
    - metric: >-
        P8 -- signed gap log2(T_total) - log2(T_rho) in bits at log2 N in
        {64, 128, 256}, per claim that supplies enough to evaluate it
      direction: different
      minimum_effect: >-
        Reported per claim per parameter set, with memory beside it. A
        claim that cannot be evaluated at all is recorded as such, and the
        inability is a datum, never estimated or filled in.
    - metric: >-
        P9 -- pass rate on the declared NON-ELLIPTIC-CURVE in-scope cost
        claims, checked by the identical gate
      direction: different
      minimum_effect: >-
        If it is also 0 and the modal missing element is the same, the
        finding is about this program's cost-claim writing across all
        areas and NOT about the ECDLP lane. THIS IS THE BLOCKING CURVE-FREE
        COMPARISON and its result governs how P6 may be described.
  test_boundary:
    instances:
      - >-
        Four fixtures: FIX-POS, FIX-UNCHARGED, FIX-PROVES-TOO-MUCH,
        FIX-CONVENTION-DRIFT, all constructed inside this protocol and all
        blocking
      - >-
        In-scope ECDLP claim population: live records under
        ledger/hypotheses/, ledger/evidence/ and experiments/*/ that assert
        a prime-field ECDLP total cost below the matched rho baseline,
        enumerated by the exact query stated in EXP-PFDR-e0edb5 and
        executed once at a recorded commit
      - >-
        Non-curve comparison population: live records asserting a total
        attack cost below a matched generic baseline in a declared
        non-elliptic area, enumerated by the same query shape
    parameters:
      certificate_elements: 'D1-D10 as defined in the statement'
      failing_conditions: 'G1-G8 as defined in EXP-PFDR-e0edb5'
      parameter_sets: 'log2 N in {64, 128, 256}'
      charging_convention: 'frozen in EXP-PFDR-e0edb5 before any certificate is inspected'
      rederivation_tolerance: '1 bit in log2 at each parameter set'
      excluded_by_name: >-
        superseded records; claims that do not assert a sub-baseline total
        (they are out of scope, not failures); binary-field and
        extension-field claims
    implementation: >-
      Symbolic audit plus exact arithmetic. A derivation-aid script
      evaluates closed forms at the three parameter sets; it is not a run,
      produces no manifest and is not evidence. ZERO RUNS: no curve is
      generated, no solver executes, no ECDLP instance is attempted.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 1
      maximum_memory_gb: 8
      maximum_runs: 0
  falsification_conditions:
    - >-
      F1 GATE VOID, TOO STRICT. P1 fails: FIX-POS does not pass. The gate
      is unpassable by construction. This is the source idea's own second
      falsification condition, it falsifies H1, and it is the single most
      important outcome to detect because every rejection the gate issues
      is meaningless until it is excluded.
    - >-
      F2 GATE VOID, TOO WEAK. P2, P3 or P4 fails: the gate passes a
      certificate with an uncharged step, a known-false conclusion, or a
      drifted convention. It does not detect what it exists to detect.
    - >-
      F3 CONVENTIONS INSUFFICIENT. P5 fails on FIX-POS. HEUR-002 is
      falsified; the conventions are rewritten under a versioned
      protocol_amendment and no corpus claim is checked under the old ones.
    - >-
      F4 H2 REFUTED, THE CLAIM SURVIVES THE GATE. P6 shows at least one
      pass. That claim's descent certificate is verified and its charged
      total is below the matched rho baseline at the checked parameter
      sets. This is a substantive positive result about that claim, is
      reported as such with its signed gap and its memory column, and
      requires independent review before any status change anywhere.
    - >-
      F5 SCOPE FAILURE, THE CURVE-FREE OUTCOME. P9 shows the same 0 rate
      and the same modal missing element in the non-curve population. The
      audit's finding is about this program's cost-claim conventions across
      every area; it is a controlled null with respect to the ECDLP lane
      and every artifact must say so in its own words.
    - >-
      F6 H3 REFUTED. P7's modal missing element is D1 or D2: claims do not
      describe a descent structure at all, rather than describing one and
      failing to charge it. A different and more serious defect than
      predicted, and a more useful finding.
    - >-
      F7 CLAIMS SUPPORTED. P1-P5 hold, P6 is 0, P7 is D4 or D5, and P9
      differs from P6. The gate is demonstrably passable, is currently
      unpassed in this lane, the missing element is named, and the
      Coordinator has a concrete basis for a SEPARATE decision on whether
      to adopt it. Adoption is not performed by this record.
  interpretation_limits:
    - >-
      A passed gate certifies the DESCENT TREE and the end-to-end
      arithmetic at three parameter sets. It does not certify the
      algorithm, does not verify any mathematical step, and is not a
      break.
    - >-
      A failed gate records that a claim is INCOMPLETE as written. It is
      not evidence that the claim is mathematically wrong and may never be
      cited as such. Incompleteness of a claim and falsity of a claim are
      different findings.
    - >-
      No crypto-scale claim is made anywhere. The three parameter sets are
      evaluations of stated closed forms, labelled estimates, never
      measurements.
    - >-
      The gate cannot detect an error INSIDE a correctly shaped closed
      form. It detects missing elements, uncharged steps, convention drift
      and blind-re-derivation disagreement. A certificate can pass and
      still be wrong in a way this protocol does not look for, and that
      limit is a property of the design rather than of its execution.
    - >-
      Every rate is scoped to one commit and one query. The corpus grows
      continuously and in several worktrees at once.
    - >-
      ADOPTING the gate as a condition of admission to GOAL-ECDLP-001 is a
      governance change and requires its own Coordinator decision. This
      record specifies and predicts; it enacts nothing, changes no
