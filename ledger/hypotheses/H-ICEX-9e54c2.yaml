hypothesis:
  id: H-ICEX-9e54c2
  question_id: RQ-ICEX-001
  source_proposal_id: IDEA-20260803-fa9839
  title: >-
    The arity threshold - the fully charged point-decomposition index-calculus versus
    rho comparison is a closed-form function of arity m and a free decomposition-oracle
    exponent d, and the winning window it defines is bounded and NOT monotone in m
  statement: >-
    FOR EVERY FIXED ARITY m >= 2, EVERY LINEAR-ALGEBRA EXPONENT omega IN THE DECLARED
    RANGE, AND EVERY FAMILY OF FACTOR BASES OF SIZE B(N) IN A GROUP OF PRIME ORDER N,
    the fully charged cost of point-decomposition index calculus - preprocessing,
    relation collection, linear algebra, target descent, verification, memory and
    multi-target accounting - is determined up to pinned constants by the arity m, the
    factor-base size B, and a single free parameter D_trial = N^d, because
    KN-FIND-007 / EV-FBG-001 fix the expected relations per trial EXACTLY and
    GEOMETRY-INDEPENDENTLY at C(B+m-1,m)/N. CONSEQUENTLY there exists a closed-form
    WINNING WINDOW W(m, omega) - the set of oracle exponents d at which the charged
    total is asymptotically below the matched Pollard-rho cost c_rho*sqrt(N) - and that
    window is computable with exact arithmetic and no measurement.
    THE HYPOTHESIS ASSERTS THE EXISTENCE, COMPUTABILITY AND SHAPE OF THE WINDOW. IT
    ASSERTS NOTHING WHATEVER ABOUT WHETHER ANY d INSIDE THE WINDOW IS ACHIEVABLE BY ANY
    ORACLE, AND THEREFORE NOTHING ABOUT THE HARDNESS OF PRIME-FIELD ECDLP IN EITHER
    DIRECTION. KN-OPEN-001 IS UNTOUCHED BY IT.
    The specific shape predicted, and pre-registered below as point predictions that can
    fail, is that the window is the INTERSECTION of three constraints - a harvest-all
    balance threshold, a one-relation-per-target threshold, and a physical
    trial-count admissibility bound - and that this intersection is EMPTY for m <= 4,
    maximal at m in {6, 7}, and SHRINKING like omega/(m-1) thereafter. That last clause
    contradicts IDEA-20260803-fa9839's own reading of its headline threshold
    d < (m-3)/4 as monotonically loosening in m.
  mechanism: >-
    THE FIRST TERM OF THE CHARGE IS NOT ESTIMATED, IT IS FORCED. KN-FIND-007 is a
    one-line double count - every size-m multiset of factor-base elements sums to
    exactly one target - so sum over targets of the decomposition count equals
    C(B+m-1,m) identically, for EVERY base of size B, and the mean per-target yield is
    C(B+m-1,m)/N with measured maximum absolute deviation exactly 0 across the 144
    untyped cells of EV-FBG-001. The number of trials needed to collect B relations is
    therefore B divided by that mean, i.e. m! N / B^(m-1) to leading order, with NO
    geometric freedom anywhere in it.
    EVERYTHING ELSE IS EITHER A PINNED CONSTANT OR A DECLARED PARAMETER. Linear algebra
    is c_LA * B^omega. Preprocessing is c_pre * B. Verification is c_ver * m * B.
    Descent is kappa_desc * D_trial * max(1, m!N/B^m). Memory is B group elements plus
    the m*B relation nonzeros. Multi-target amortizes preprocessing, relation collection
    and linear algebra over k targets while descent and verification stay per-target.
    The single free parameter is D_trial = N^d, the charged cost of DECIDING one
    candidate target.
    MINIMIZING THE TWO DOMINANT TERMS GIVES A CLOSED FORM. Stationarity of
    m! N D / B^(m-1) + c_LA B^omega gives B*^(m+omega-1) = (m-1) m! N D / (omega c_LA),
    hence B* ~ N^((1+d)/(m+omega-1)) and total ~ N^(omega(1+d)/(m+omega-1)). Beating
    c_rho*sqrt(N) requires omega(1+d)/(m+omega-1) < 1/2, i.e. d < (m-omega-1)/(2*omega).
    TWO CONSTRAINTS THE PROPOSAL OMITS ARE WHAT MAKE THE WINDOW BOUNDED. (i) The
    expected trial count m!N/B^(m-1) evaluated at B* must be at least 1 - a search that
    collects B relations in less than one trial is not physical - which forces
    d <= omega/(m-1). (ii) Under the one-relation-per-target harvesting convention the
    optimum is pinned at the kink B_k = (m!N)^(1/m) whenever the harvest-all optimum
    lies beyond it, which happens exactly for d > (omega-1)/m, and there the charged
    total is max(N^(1/m + d), c_LA N^(omega/m)), which beats rho only for m > 2*omega
    and d < (m-2)/(2m). Constraint (ii) is the repair of the proposal's own
    HEUR-AT-1 validation clause, which asserts that the exponent is identical under both
    harvesting conventions and that only a constant of at most 1.582 moves; that
    assertion holds only in the regime d <= (omega-1)/m and is false above it.
    WHY THE CALIBRATION GATE IS THE EXPERIMENT AND NOT A FORMALITY. A cost model that
    cannot be checked against an answer it did not choose measures nothing. Two
    quantities are available for that check without any external retrieval - the
    Gaudry-Diem 1/n! extension-field decomposition probability, which KN-FIND-007
    records IS this conservation mean at B = q, N = q^n, m = n, and the unrebalanced
    full-subfield-line exponent 2 in q at D_trial = q^0, both of which the model must
    reproduce EXACTLY in rational arithmetic before any prime-field row may be read.
    WHY THE PER-FIBRE MONODROMY CORRECTION DOES NOT ENTER, STATED AS A REVIEWABLE CLAIM.
    GOAL-ICEX-001's mandatory read (DEC-20260802-a51c82 / EV-MONO-a0a89c /
    KN-FIND-c41ea9) corrects a relation-rate estimator of the form
    freq_split*(W_eff/p)^2 by a factor 2(1 - 1/W_eff), and warns that a per-fibre factor
    of 2 compounds as 2^(n-1) over F_(q^n) and WOULD move an exponent. THIS CONTRACT
    DOES NOT USE THAT ESTIMATOR. It uses the exact conservation mean, which counts
    multisets of GROUP ELEMENTS and therefore already contains every sign assignment
    x(+-P_1 +- ... +- P_(m-1)) that the summation-fibre splitting enumerates, provided
    the factor base is parameterized by group-element count B rather than by
    x-coordinate count B_x = B/2. Applying both would double count. The claim is
    reviewable and is given a control that can refute it - the threshold must be
    invariant, in EXPONENT, under the B versus B_x reparameterization, with only the
    constant moving by 2^m.
  assumptions:
  - >-
    Sparse linear algebra on a B x B matrix with O(m) nonzeros per row costs
    c_LA * B^omega field operations, with omega = 2 (Wiedemann / Lanczos) as the
    headline row and omega swept over the declared range so that any future
    structured-solve result reads off its own consequence. The constant c_LA and the
    field-operation to group-operation conversion are PINNED IN THE CONTRACT BEFORE any
    threshold number is computed; a threshold row whose sign depends on them is reported
    SIGN-INDETERMINATE and may not be cited.
  - >-
    Approximately B independent relations are required. Relation RANK is not modelled.
    KN-FIND-007 records that the conservation mean scores a rank-deficient base as tied
    with a random base of the same size. Rank deficiency can only raise the true cost, so
    within the modelled algorithm the charge is a LOWER BOUND and its no-go readings are
    conservative while its positive readings are not.
  - >-
    The rho baseline is c_rho*sqrt(N) group operations and the BSGS baseline is
    c_bsgs*sqrt(N) time with sqrt(N) stored group elements, both pinned in the contract
    and both swept over the bands measured in the committed run
    RUN-YIELD-001-BASELINE-RHO-BSGS, where measured over model was 1.0249 to 1.1496 for
    rho against 0.886*sqrt(N) and 0.7177 to 0.7917 for BSGS against 2*sqrt(N) at
    12 to 18 field bits.
  - >-
    D_trial is the charged cost of deciding ONE candidate target, including forming the
    target, running the decomposition solver, and verifying its output. Amortized
    precomputation is charged separately as C_pre and is never folded into D_trial.
  - >-
    D_trial is used as an EXPECTATION. A solver whose per-instance cost is heavy-tailed
    is not described by this charge; the contract states this and forbids reading any
    threshold row as satisfied by a measured D_trial whose second moment is unbounded.
  - >-
    The comparison is asymptotic in N at fixed m and fixed omega. Constants are carried
    explicitly and swept, but no row is a concrete running time and none is a prediction
    about any implementation.
  proof_search_map:
    bottleneck: >-
      The balance between relation search and linear algebra, and the two constraints
      that bound it - the physical trial-count floor and the harvesting convention. The
      exact bottleneck claim is that the relation-search term is FULLY determined by the
      KN-FIND-007 conservation identity, that the free parameter is D_trial alone, and
      that every other quantity is either exact, a pinned constant, or a declared swept
      parameter. Removing any one of the three constraints changes the window, which is
      why all three are computed and reported separately rather than composed silently.
    baseline_embedding:
      parameter_slice: >-
        N = q^n, m = n, factor base the subfield line {P : x(P) in F_q} of size ~q,
        D_trial = q^delta with delta a declared input. The extension-field setting, where
        two quantities are known independently of this model.
      reproduction_check: >-
        GATE-A, hard-blocking and fully executable with no external retrieval. (A1) The
        conservation mean at B = q, N = q^n, m = n must satisfy
        n! * C(q+n-1,n)/q^n = prod_(j=0..n-1) (1 + j/q) as an EXACT rational identity at
        every (q, n) of the declared grid, hence -> 1/n! with first-order correction
        n(n-1)/(2q). This is the Gaudry-Diem decomposition probability that KN-FIND-007
        records IS the conservation mean, and it discriminates the three plausible
        counting conventions - the distinct-subset count C(B,m) gives the correction
        -n(n-1)/(2q), the naive B^m/m! gives 0, and the ordered-tuple count B^m gives a
        different leading constant. (A2) The relation-search charge must satisfy
        C_rel(B) * B^(m-1) = m! N D exactly at every declared B, and at B = q, delta = 0,
        m = n the charged total exponent in q must be exactly 2. (A3) The stationarity
        residual and the ratio T*/(c_LA B*^2) = (m+omega-1)/(m-1) must verify exactly.
        (A4) The optimizer exponent must be (1+d)/(m+omega-1), NOT 1/(m+omega-1); the
        latter is the d = 0 row only.
    observation_collision:
      observable: >-
        The pair (charged total exponent, optimizing factor-base size) as a function of
        (m, d, omega).
      distinct_preimage_search: >-
        ONE COLLISION IS ALREADY ON RECORD AND IS THE REASON THE MODEL IS KNOWN NOT TO BE
        TIGHT. IDEA-20260803-fa9839 records an unverified recollection that the reported
        extension-field exponent is 2 - 2/n, attained with linear algebra at
        B = q^((n-1)/n) - a SMALLER base than this model's optimum q^(n/(n+1)), at which
        this model's own relation-search term reads q^(2 - 1/n) and dominates. Two
        distinct preimages therefore reach different exponents through the same
        observable, which localizes the missing ingredient to the relation-search term
        rather than to the linear-algebra charge. THE RECOLLECTION IS UNVERIFIED,
        PRIMARY SOURCES ARE UNREACHABLE FROM THIS ENVIRONMENT, AND IT MAY NOT BE USED AS
        EVIDENCE; the collision is recorded as a declared limitation of the model, not as
        a finding about the literature. Further preimages the search must cover -
        harvest-all multi-relation yield, large-prime and double-large-prime partial
        relations, descent reuse across targets, and any structure making successive
        trials dependent.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The winning window W(m, omega) as the intersection of the balance threshold, the
        one-relation-per-target threshold and the trial-count admissibility bound, rather
        than the single balance threshold d < (m-3)/4.
      predicted_gain: >-
        Converts an unbounded and monotone-looking function of m into a bounded one that
        is empty for m <= 4 and maximal at m in {6,7}, which is a materially different
        instruction to the deferred measurement goals.
    - transform: representation_reduction
      proposed_object: >-
        The conversion map from a measured Groebner solving degree D_reg on n_v variables
        to a charged oracle exponent d, and its inverse - the maximum admissible solving
        degree D_reg_max(m, N, omega, n_v) that lands inside W(m, omega).
      predicted_gain: >-
        Turns each deferred goal's own primary metric into a single integer comparison
        against a committed table, which is the declared exit from the deferral deadlock.
    quantifier_order: >-
      FOR EVERY fixed arity m >= 2, FOR EVERY linear-algebra exponent omega in the
      declared range, FOR EVERY family of factor bases of size B(N), IF the charged
      per-trial decomposition cost satisfies D_trial = N^d with d in W(m, omega), THEN
      the charged total is asymptotically below c_rho*sqrt(N) under the declared charging
      conventions. THE ORDER MUST NOT BE INVERTED. This is NOT "there exists a factor
      base", it is NOT "there exists an oracle", and it asserts NOTHING about whether any
      such D_trial is achievable. The existence question is exactly KN-OPEN-001 and is
      untouched.
    method_ceiling:
      strongest_certifiable_claim: >-
        A committed, machine-readable threshold function plus the integer solving-degree
        tables it induces, valid within the declared charging conventions and pinned
        constants, at claim tier toy. THE MODEL CAN NEVER ESTABLISH A PRIME-FIELD
        ADVANTAGE, because it leaves D_trial free and takes no position on its
        achievability; its ceiling as a positive instrument is zero by construction. It
        also cannot establish a prime-field no-go, because a cleverer algorithm outside
        the modelled charge - large primes being the named candidate - can beat the
        modelled threshold, which is exactly what the extension-field observation
        collision indicates.
      nearby_object_control: >-
        The SAME model with the exact conservation mean replaced by (i) a naive
        independent-uniform yield estimate and (ii) an explicitly enumerated empirical
        mean on a random factor base and on a structured factor base in Z/N. If the
        threshold's EXPONENT moves under any substitution, the exactness of KN-FIND-007
        is not doing the work claimed for it and the claim must be re-described.
    proof_obligations:
    - claim: >-
        The expected relations per trial equal C(B+m-1,m)/N for every base of size B.
      responsibility: baseline
    - claim: >-
        The charged optimum and total are B* ~ N^((1+d)/(m+omega-1)) and
        T* ~ N^(omega(1+d)/(m+omega-1)).
      responsibility: runtime
    - claim: >-
        The trial count at the optimum is at least 1, giving d <= omega/(m-1).
      responsibility: feasibility
    - claim: >-
        Under one-relation-per-target the optimum is at the kink for d > (omega-1)/m and
        the window is m > 2*omega and d < (m-2)/(2m).
      responsibility: success_probability
    - claim: >-
        Descent, preprocessing and verification are charged and reported, and the run
        states at every cell whether any of them dominates.
      responsibility: interface
    - claim: >-
        Memory is B*(m,d) elements, reported beside every time row, in elements and bits.
      responsibility: memory
    - claim: >-
        The multi-target crossover k*(m,d,N) is bracketed between the batch and the
        independent-solve rho conventions.
      responsibility: scope
    - claim: >-
        No row licenses any statement about prime-field ECDLP hardness or any deployed
        curve.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. NO COMPLEXITY CLAIM OF ANY KIND IS MADE. No attack is proposed and
    no exponent for any problem is claimed. The object produced is a THRESHOLD FUNCTION
    relating a FREE parameter to the rho crossover, and it is silent on achievability by
    construction. The incumbent baselines are unchanged - Pollard rho at c_rho*sqrt(N)
    time and O(1) memory, BSGS at c_bsgs*sqrt(N) time and sqrt(N) memory; prime-field
    index calculus has NO known advantage (KN-OPEN-001) and this program's single support
    verdict for it was retracted (EV-IC-002). Charged but not eliminated, and declared
    rather than hidden - descent depth kappa_desc, relation rank, D_trial tail behaviour,
    the field-operation to group-operation conversion inside c_LA, and the m! and c_LA
    constants themselves. All are swept or declared; none is assumed away.
  dominated_by: >-
    NOT APPLICABLE AS AN ATTACK, WRITTEN EXPLICITLY RATHER THAN LEFT NULL. No algorithm is
    proposed and no Pareto point is claimed on any axis - time, memory, data, queries,
    advice or preprocessing - so there is no frontier row to be dominated on. As an
    ANALYTIC INSTRUMENT the incumbent is the ABSENCE of any written charged comparison,
    which is what GOAL-ICEX-001's eight-batch deferral chain rests on.
  sota_delta: >-
    ZERO ON EVERY ECDLP COST AXIS. No attack, no measurement, no exponent moved, no
    deployed system affected. The instrument delta is from six goals deferring a
    comparison that has never been written down, to a committed window function plus a
    per-goal integer table stating what each deferred measurement would have to read to
    change a verdict WITHIN THIS CHARGE.
  heuristic_assumptions:
  - id: HEUR-AT-1
    formal_statement: >-
      For every finite abelian group G of prime order N, every factor base D of B
      distinct elements of G \ {0}, and every m >= 1, the expected number of size-m
      multisets from D summing to a uniformly random target equals C(B+m-1,m)/N exactly;
      and trials against independent uniformly random targets are independent enough that
      an expectation-level charge predicts the total cost of collecting B relations to
      within a factor bounded by min(1,mu)/(1 - exp(-mu)) <= 1.582.
    random_model_justification: >-
      The MEAN is not modelled, it is EXACT and geometry-independent - a double count in
      which every size-m multiset sums to exactly one target. INDEPENDENCE AND
      CONCENTRATION ARE NOT PROVED; only the one-relation-per-target correction is
      bounded.
    supporting_results:
    - >-
      KN-FIND-007, proof_status derivation, maximum absolute deviation of the exact cell
      mean from the closed form exactly 0 across 144 cells.
    - >-
      EV-FBG-001, strength replicated, claim tier toy, independently recomputed by the
      validator without importing executor code.
    validation_experiment_ids:
    - EXP-ICEX-146ff5
    falsification_condition: >-
      An explicitly enumerated factor base of size B in a group of order N at which the
      exact mean of the per-target multiset count differs from C(B+m-1,m)/N. CTRL-NULL
      of EXP-ICEX-146ff5 enumerates exactly this on random, structured and degenerate
      bases in Z/N and fires an invalidation on any nonzero deviation.
  - id: HEUR-AT-2
    formal_statement: >-
      For every m and every B, sparse linear algebra on the B x B relation matrix with
      O(m) nonzeros per row costs Theta(B^omega) field operations with omega = 2, and no
      structured-solve improvement changes that exponent for the factor bases considered.
    random_model_justification: >-
      Standard for Wiedemann and Lanczos on sparse systems. NOT UNIVERSAL in this corpus -
      EV-STR-002 measured a structured solve beating Wiedemann by 3x to 90x at B >= 55 on
      endomorphism-invariant bases, and EV-STR-003 WITHDREW the comparative limb of that
      claim while leaving the phi_alpha metric UNADJUDICATED. A displacement-rank
      improvement is therefore neither established nor excluded here.
    supporting_results:
    - >-
      EV-STR-002 and EV-STR-003 as a contested pair, cited for the contest and not for a
      verdict.
    validation_experiment_ids:
    - EXP-ICEX-146ff5
    falsification_condition: >-
      A committed measurement of a solve at exponent omega < 2 on a factor base of the
      declared shape. EXP-ICEX-146ff5 does not test this; it emits d_max as a function of
      omega so that any such future result reads off its own consequence rather than
      invalidating the table.
  - id: HEUR-AT-3
    formal_statement: >-
      The charged cost of deciding one candidate target by a Groebner solve at solving
      degree D_reg on n_v variables is c_GB * binom(n_v + D_reg, D_reg)^omega_GB field
      operations, with omega_GB in the declared range.
    random_model_justification: >-
      The standard Macaulay-matrix charge - the solve is linear algebra on a matrix whose
      column count is the monomial count binom(n_v + D_reg, D_reg). It is the conversion
      every solving-degree measurement in this program would have to use to become a
      cost, and it is stated here so that the conversion is auditable rather than
      implicit. NOT VERIFIED against any measured solver in this corpus.
    supporting_results: []
    validation_experiment_ids:
    - EXP-ICEX-146ff5
    falsification_condition: >-
      A committed measurement in which a solver's operation count at a recorded solving
      degree differs from the Macaulay charge by more than the declared factor. Absent
      that, every D_reg_max row is explicitly conditional on HEUR-AT-3 and is labelled so.
  - id: HEUR-AT-4
    formal_statement: >-
      The per-fibre summation-splitting correction 2(1 - 1/W_eff) of DEC-20260802-a51c82
      corrects a Frobenius-census relation-rate ESTIMATOR and does not multiply the exact
      conservation mean, because the conservation count over a negation-closed
      group-element base of size B already enumerates every sign assignment that the
      splitting produces.
    random_model_justification: >-
      Elementary, and stated as a REVIEWABLE CLAIM rather than an assumption.
      KN-FIND-c41ea9 shows the summation fibre splits completely on the factor-base locus
      at every m, so the roots are x(+-P_1 +- ... +- P_(m-1)); in a negation-closed base
      those sign choices are distinct multisets of group elements and are already counted
      by C(B+m-1,m). KN-FIND-c41ea9 itself flags the alternative reading - that the
      compounding 2^(n-1) is a real lever - as UNTESTED, and this record does not close it.
    supporting_results:
    - KN-FIND-c41ea9
    - EV-MONO-a0a89c
    - DEC-20260802-a51c82
    validation_experiment_ids:
    - EXP-ICEX-146ff5
    falsification_condition: >-
      CTRL-PARAM of EXP-ICEX-146ff5 recomputes the whole threshold under the
      x-coordinate parameterization B_x = B/2. If the window's EXPONENT moves, the sign
      multiplicity is not already contained in the conservation count, HEUR-AT-4 is
      refuted, and the compounding clause of KN-FIND-c41ea9 is live.
  structural_ingredients:
  - description: >-
      The decomposition-yield conservation identity - for any finite abelian group of
      order N and any factor base of B distinct elements, the sum over targets of the
      size-m multiset count is exactly C(B+m-1,m).
    citation: >-
      Internal - KN-FIND-007, EV-FBG-001, experiments/EXP-FB3-001/conservation.md. An
      elementary double count, near-certainly folklore, no novelty claimed.
    role: exact relation-yield law, removes all geometric freedom from the first term
  - description: >-
      Complete splitting of the summation polynomial on the factor-base locus at every m.
    citation: Internal - KN-FIND-c41ea9, EV-MONO-a0a89c.
    role: >-
      fixes the sign-multiplicity accounting and is the reason HEUR-AT-4 is stated and
      controlled rather than assumed
  - description: >-
      Bezout bound |F_p| <= 3*d_p for a degree-d_p algebraic factor-base predicate against
      the projective cubic.
    citation: >-
      Internal - IDEA-20260801-021, KN-OPEN-020, which records honestly that the universal
      version is OPEN.
    role: >-
      converts the optimal factor-base size B*(m,d) into a required predicate degree,
      emitted as a secondary output feeding KN-OPEN-020 and IDEA-20260803-e2f5bd
  - description: >-
      Matched, certificate-verified Pollard rho and BSGS baselines at 12 to 18 field bits.
    citation: >-
      Internal - experiments/EXP-YIELD-001/runs/RUN-YIELD-001-BASELINE-RHO-BSGS.
    role: pins c_rho and c_bsgs against measurement rather than against assertion
  reduction_chain:
    core_problem: >-
      Computing the winning window W(m, omega) for fully charged point-decomposition
      index calculus against matched rho and BSGS.
    corollaries:
    - problem: >-
        Whether a measured Semaev solving degree (GOAL-SDEG-001), degree-of-regularity
        deficit (GOAL-DREG-001) or syzygy-cascade degree (GOAL-SIG-001) can land inside
        the window.
      reduction_ref: >-
        HEUR-AT-3, the Macaulay-matrix charge, inverted to give D_reg_max(m, N, omega,
        n_v). NOT a published reduction - an internal conversion, conditional on
        HEUR-AT-3 and labelled so wherever it appears.
      asymptotics_preserved: >-
        Only in exponent and only within the declared charging conventions; the
        conversion is conditional and carries HEUR-AT-3 forward unchanged.
  predictions:
  - metric: gate_a1_conservation_identity_exact
    direction: same
    minimum_effect: >-
      n! * C(q+n-1,n)/q^n equals prod_(j=0..n-1)(1 + j/q) EXACTLY, as a rational, at
      every (q, n) in the declared grid with n = 2..8. Tolerance ZERO - this is a
      rational identity and any deviation is an implementation defect. It fails, and is
      designed to fail, if the implementation uses C(B,m), B^m/m!, or B^m.
  - metric: gate_a2_relation_charge_scaling_exact
    direction: same
    minimum_effect: >-
      C_rel(B) * B^(m-1) equals m! * N * D EXACTLY at every B of the declared grid,
      tolerance ZERO; and at B = q, delta = 0, m = n the charged total exponent in q is
      EXACTLY 2. Fails on any mis-powered B, N or m! factor.
  - metric: gate_a3_optimizer_identities_exact
    direction: same
    minimum_effect: >-
      2 c_LA B*^(m+1) - (m-1) m! N D has relative magnitude below 1e-25 in 50-digit
      decimal arithmetic at omega = 2, and T*/(c_LA B*^2) equals (m+omega-1)/(m-1)
      EXACTLY as a rational, at m = 2..12 and every declared omega. The proposal's
      1e-12 is too loose for a closed-form identity and is tightened here.
  - metric: gate_a4_optimizer_exponent_is_one_plus_d
    direction: same
    minimum_effect: >-
      The optimizing factor-base exponent is EXACTLY (1+d)/(m+omega-1) as a rational, and
      the value 1/(m+omega-1) appears ONLY on the d = 0 row. A run reporting
      1/(m+omega-1) at d > 0 FAILS. This is the repair of BATCH-156658 defect 5.2.
  - metric: winning_window_shape
    direction: same
    minimum_effect: >-
      The window is PIECEWISE, because the two harvesting conventions agree only below
      the crossover d = (omega-1)/m. Formally
      W(m,omega) = { d >= 0 : d < omega/(m-1) AND [ ( d <= (omega-1)/m AND
      d < (m-omega-1)/(2*omega) ) OR ( d > (omega-1)/m AND m > 2*omega AND
      d < (m-2)/(2m) ) ] }.
      At omega = 2 the supremum of W is - EMPTY at m = 2 and m = 3; 1/4 at m = 4;
      3/10 at m = 5; 1/3 at m = 6 and m = 7; 2/7 at m = 8; 1/4 at m = 9; 2/9 at m = 10;
      1/5 at m = 11; 2/11 at m = 12. The maximum over m is 1/3, attained at m in {6,7},
      and beyond m = 8 the window DECAYS like 2/(m-1). These are exact rationals derived
      at design time WITHOUT AN INTERPRETER and are pre-registered as point predictions
      precisely so a mismatch is caught; a mismatch is as likely an error in this
      hypothesis as in the implementation, and either way it BLOCKS the run.
      CONTRAST WITH THE PROPOSAL, WHICH IS THE POINT OF CHARGING THE OMITTED TERMS -
      IDEA-20260803-fa9839's d < (m-3)/4 agrees at m = 4 (1/4) and grows without bound;
      the charged window agrees at m = 4, is strictly smaller at every m >= 5, peaks, and
      then shrinks.
  - metric: charged_stage_dominance_map
    direction: same
    minimum_effect: >-
      At every emitted cell the run reports the exponent of each of the seven charged
      stages and names the dominant one. Pre-registered - preprocessing and verification
      have exponent (1+d)/(m+omega-1) and never dominate; descent has exponent
      d + max(0, (omega-1-md)/(m+omega-1)) and equals the total EXACTLY at the
      admissibility boundary d = omega/(m-1) when omega = 2. A cell contradicting this
      is reported as an observation and blocks the table for that cell.
  - metric: memory_row_at_the_operating_point
