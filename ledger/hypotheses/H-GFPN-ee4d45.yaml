hypothesis:
  id: H-GFPN-ee4d45
  question_id: RQ-GFPN-c01af8
  goal_id: GOAL-GFPN-380702
  source_proposal: IDEA-20260920-63a902
  designed_from: IDEA-20260920-63a902
