  proposed_by: idea-generator
  designed_by: coordinator
  approval_decision: DEC-20260920-fe73de
  archived_by: TASK-20260920-717d6c
  title: >-
    Certificate-bearing SafeCurves-style parameter audit of EcGFp5 and EcMasFp5
  status: approved
  status_note: >-
    Pre-run approval paired to EXP-GFPN-726eb2 under DEC-20260920-fe73de.
    Not supported. Not running until /run after implementation artifacts exist.
    Designing was not approving; this mark is the separate Coordinator act
    under standing user authorization 2026-09-06 after protocol completeness.

  statement: >-
    Both deployed F_{p^5} curves (EcGFp5: Pornin ePrint 2022/274; EcMasFp5:
    Hermez HackMD design note) carry self-reported security properties that
    this program's SCURVE lane recomputes with certificates for standard
    curves: order and cofactor, embedding degree, CM discriminant bit-length,
    twist order and twist security, rigidity of the published parameter search,
    and — specific to GFPN — the provenance of the "142-bit" field-security
    figure (raw Gaudry floor in the EcGFp5 note; inherited on EcMasFp5) and of
    EcMasFp5's self-reported 101.93-bit twist security. Regenerating those
    certificates from the published equations with independent point counting
    and factorization, and tagging each published figure as computed /
    inherited / asserted, produces a certificate-bearing audit table. A
    self-reported figure that does not reproduce is itself a first-class finding.
    This hypothesis asserts no attack cost and no break of either curve.

  mechanism: >-
    Reuse SCURVE audit patterns: independent SEA / Sage-PARI point counting on
    the published Weierstrass models over F_{p^5} with p = 2^64 − 2^32 + 1;
    regenerate order factorization certificates (not copy); recompute embedding
    degree and CM discriminant; compute twist order and Pollard-rho twist
    security bits; reproduce the published search scripts (EcGFp5 b = c z^i;
    EcMasFp5 B = c z^i) for rigidity; extract security-section figures from the
    frozen source packages and tag provenance. Instrument control: one already-
    audited SCURVE curve re-run must reproduce its certificate byte-for-byte
    before either GFPN curve is scored.

  assumptions:
    - Public curve parameters only; no keys, signatures, or live systems.
    - Certificates (point counts, factorizations) are regenerated, not copied
      from the design notes.
    - Frozen sources inputs/PORNIN-2022-274-ECGFP5 and
      inputs/ECMASFP5-HACKMD-2025 are the sole parameter and figure authorities.
    - Different curve models between a note and an implementation repository are
      recorded as deviations, not silently reconciled.

  citations:
    - ref: KN-LIT-8aff72
      provenance: retrieved
      claim: >-
        EcGFp5 parameters, double-odd construction, Gaudry ≥ 2^142 theoretical
        floor, embedding-degree / search procedure as stated in ePrint 2022/274.
      verified_by: KN-LIT-8aff72 / SRC-PORNIN-2022-274-ECGFP5
    - ref: KN-LIT-47d541
      provenance: retrieved
      claim: >-
        EcMasFp5 equation, prime order, self-reported twist security 101.93 bits,
        inherited ~142-bit field claim.
      verified_by: KN-LIT-47d541 / SRC-ECMASFP5-HACKMD-2025
    - ref: KN-LIT-edd7ba
      provenance: retrieved
      claim: >-
        Quintic extension-field context (trace-zero / Semaev machinery); not used
        as a cover verdict here — cover audit is IDEA-20260920-10547b.
      verified_by: KN-LIT-edd7ba / SRC-GORLA-MASSIERER-2014-1403

  structural_ingredients:
    - description: >-
        SafeCurves criterion set (order, cofactor, embedding degree, CM, twist
        security, rigidity) as operationalized by this program's SCURVE lane.
      citation: experiments under EXP-SCURVE-* (instrument control)
      provenance: internal
      verified_by: coordinator (SCURVE control curve selection at run time)
      role: audit checklist and certificate schema

  proof_search_map:
    bottleneck: None; the audit is bounded recomputation with certificates.
    baseline_embedding:
      parameter_slice: >-
        One SCURVE curve already audited, re-run as the instrument control.
      reproduction_check: >-
        The instrument reproduces that curve's certificate byte-for-byte before
        scoring EcGFp5 / EcMasFp5.
    observation_collision:
      observable: Per-criterion pass/fail with certificate; per-figure provenance tag.
      distinct_preimage_search: Not applicable (audit, not a search claim).
    constructive_transforms: []
    quantifier_order: >-
      For each SafeCurves-style criterion and each named curve there exists a
      regenerated certificate or an explicit "not verifiable from the frozen note".
    method_ceiling:
      strongest_certifiable_claim: A certificate-bearing audit table for two curves.
      nearby_object_control: The SCURVE control curve.
    proof_obligations:
      - claim: Point counts and factorizations are independently regenerated.
        responsibility: correctness
      - claim: The 142-bit and 101.93 figures receive explicit provenance tags.
        responsibility: scope

  heuristic_assumptions: []
  asymptotic_claim: null

  predictions:
    - metric: criteria_verified
      direction: higher
      minimum_effect: >-
        All SafeCurves-style criteria decided with regenerated certificates for
        both EcGFp5 and EcMasFp5 (or explicitly marked not verifiable).
    - metric: inherited_or_asserted_figures
      direction: higher
      minimum_effect: >-
        At least the 142-bit figure tagged inherited raw-system floor on EcMasFp5;
        EcMasFp5 twist 101.93 tagged computed vs self-report after regeneration.

  test_boundary:
    instances:
      - EcGFp5 over F_{p^5}, p = 2^64 − 2^32 + 1 (frozen Pornin parameters)
      - EcMasFp5 over the same p (frozen Hermez parameters)
      - One SCURVE control curve with a prior certificate
    parameters:
      p: '18446744069414584321'
      claim_tier: observational
    implementation: EXP-GFPN-726eb2
    budget:
      wall_clock_seconds: null
      memory_gb: 8

  falsification_conditions:
    - >-
      A self-reported numeric figure (order bits, twist security, CM bits) does
      not reproduce under independent recomputation — recorded as a finding, and
      that criterion fails the "matches self-report" row (the audit still completes).
    - >-
      The SCURVE control certificate fails byte-for-byte reproduction — instrument
      invalidation, not a mathematical claim about either GFPN curve.

  interpretation_limits:
    - Audit only; no attack cost, no PDP band, no OA-SDH, no cover genus.
    - Does not decide whether 128-bit claims stand; that requires EXP-GFPN-05ff43.
    - Scope is the two named curves plus the instrument control.

  related_experiments:
    - EXP-GFPN-726eb2
