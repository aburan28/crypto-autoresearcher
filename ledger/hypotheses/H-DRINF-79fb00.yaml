# H-DRINF-79fb00 — specified from IDEA-20261005-cd4cf5.
# Protocol approval is DEC-20261006-619380. This record asserts nothing
# about a measured height. No polynomial was scored in this design.
hypothesis:
  id: H-DRINF-79fb00
  question_id: RQ-DRINF-6b5a9d
  source_proposal: IDEA-20261005-cd4cf5
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-DRINF-6b5a9d.yaml does not name a goal. This design
    does not attach one and does not create a goal record.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-DRINF-8ec117 is approved
    for a later executor. It does not mean the 4+2 split or the neighbor
    gap has been observed. Status moves only by DEC-20261006-619380 under
    the standing user authorization of 2026-09-06. No height was scored
    in this design.
  proposed_by: coordinator
  conversion_note: >-
    The six modules, the multiset of H_coeff, the agreement of H_gcd with
    H_coeff on those six, the neighbor gap of 1 on tau^2 + tau^3, the
    Carlitz control, and the Delta-scaling control are carried from
    IDEA-20261005-cd4cf5. The Coordinator added only the operational rule
    that a third height read from a PDF, if one is later opened, is a
    separate column and does not rename H_coeff or H_gcd. Those rules
    were fixed before any run.

  statement: >-
    TEST BOUNDARY. q = 3. tau is the map x |-> x^3. The six modules are
    Phi_T = g tau + Delta tau^2 at A-characteristic (T), with Delta
    nonzero in F_3. They are named M00 = 0*tau + 1*tau^2, M01 = 0*tau +
    2*tau^2, M10 = 1*tau + 1*tau^2, M11 = 1*tau + 2*tau^2, M20 = 2*tau +
    1*tau^2, and M21 = 2*tau + 2*tau^2. H_coeff is the least i with a
    nonzero coefficient of tau^i. H_gcd is the gcd of the tau-exponents
    that appear. The rank-1 module Psi_T = tau is the Carlitz control
    and is not one of the six. The rank-3 neighbor is Phi_T = tau^2 +
    tau^3 and is not one of the six. No torsion root is counted. No
    Frobenius characteristic polynomial is counted. No ECDLP exponent
    is claimed.

    PRE-REGISTERED PREDICTION, copied from IDEA-20261005-cd4cf5 before
    any run of EXP-DRINF-8ec117. On the six modules the multiset of
    H_coeff is {1, 1, 1, 1, 2, 2}, so height1_count is 4 and
    height2_count is 2. H_gcd equals H_coeff on each of the six.
    On tau^2 + tau^3, H_coeff is 2 and H_gcd is 1, so their difference
    is 1. The Carlitz control has H_coeff = H_gcd = 1.

    DISTINGUISHABLE OUTCOMES. (1) The counts are 4 and 2, the six
    modules agree, the neighbor difference is 1, and the Carlitz
    control agrees: the predicted split. (2) height1_count is not 4,
    or height2_count is not 2: negative. (3) Any of the six has
    H_gcd different from H_coeff: negative. (4) The two integers on
    tau^2 + tau^3 are equal: negative. (5) The Carlitz integers
    differ, or either is not 1: negative. (6) A unit scaling of Delta
    changes an integer, the gcd is taken of coefficients rather than
    exponents, a unit coefficient is suppressed, or the run fails:
    invalid, not evidence.

  mechanism: >-
    Two readings of height are scored on the written support before
    any census is treated as an invariant. The coefficient reading
    keeps the least exponent. The gcd reading keeps the gcd of the
    support. On a rank-2 module the support is {1, 2} or {2}, and
    those two integers are predicted to coincide, which is why the
    six modules cannot separate the readings. The neighbor has
    support {2, 3}, where the gcd reading returns 1 and the
    coefficient reading returns 2. Agreement on the six with
    disagreement on the neighbor means the six-module split does not
    identify the invariant. The projection keeps exponents and
    discards the nonzero values in F_3. Scaling Delta by a unit does
    not change the support. Delta = 1 and Delta = 2 are distinct
    modules with the same support, so the projection is not a
    coordinate change.

  assumptions:
    - tau is the q-power map x |-> x^3, and coefficients lie in F_3.
    - At A-characteristic (T) the constant term of Phi_T is 0.
    - H_coeff and H_gcd are defined from the written support, as above. A PDF definition that was not opened is not renamed onto either column.
    - The six pairs with g in {0, 1, 2} and Delta in {1, 2} are the full list at q = 3 with Delta nonzero.
    - The rank-3 neighbor is a nearby object, not one of the six modules.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement of two integer invariants on six modules
      and one neighbor at q = 3. It is not a proof, an asymptotic
      bound, a certificate family, a reduction, or a closure argument.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: unchanged; no ECDLP exponent is in scope
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: none introduced
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        On a rank-2 module Phi_T = g tau + Delta tau^2 over F_3, the
        gcd of the tau-support equals the least exponent. The sample
        is the six modules at q = 3, characteristic (T), plus the
        neighbor tau^2 + tau^3 on which the two integers are predicted
        to differ by 1. No transfer to larger q or to rank greater
        than 3 is claimed.
      random_model_justification: >-
        For a polynomial with at most two terms, the gcd of the
        exponents equals the least exponent whenever the least
        exponent divides the other. That divisibility is the
        arithmetic content of supports {1, 2} and {2}, and it fails
        for {2, 3}. This design session opened KN-LIT-174 and
        KN-LIT-1515. Neither note states this divisibility. Drinfeld's
        identification of the least tau-power with geometric height
        is recalled and was not opened, and is not support.
      supporting_results: []
      validation_experiment_ids:
        - EXP-DRINF-8ec117
      falsification_condition: >-
        height1_count is not 4, or height2_count is not 2, or any of
        the six modules has H_gcd different from H_coeff, or the two
        integers on tau^2 + tau^3 are equal.

  predictions:
    - metric: count of the six modules with H_coeff = 1
      direction: different
      minimum_effect: 4
    - metric: count of the six modules with H_coeff = 2
      direction: different
      minimum_effect: 2
    - metric: number of the six modules on which H_gcd differs from H_coeff
      direction: different
      minimum_effect: 0
    - metric: H_coeff minus H_gcd on Phi_T = tau^2 + tau^3
      direction: different
      minimum_effect: 1

  test_boundary:
    instances:
      - id: six-modules
        field: F_3
        characteristic: (T)
        modules:
          - id: M00
            rule: Phi_T = 0*tau + 1*tau^2
          - id: M01
            rule: Phi_T = 0*tau + 2*tau^2
          - id: M10
            rule: Phi_T = 1*tau + 1*tau^2
          - id: M11
            rule: Phi_T = 1*tau + 2*tau^2
          - id: M20
            rule: Phi_T = 2*tau + 1*tau^2
          - id: M21
            rule: Phi_T = 2*tau + 2*tau^2
        count: 6
      - id: carlitz
        module: Psi_T = tau
        role: nearby_object_on_which_the_two_definitions_still_coincide
      - id: rank3-neighbor
        module: Phi_T = tau^2 + tau^3
        role: nearby_object_on_which_coincidence_is_predicted_to_fail
    parameters:
      q: 3
      degree_of_T: 1
      extension_degree: 1
    implementation: >-
      Read the written support of each polynomial and compute the
      least exponent and the gcd of the exponents. No floating point.
      No height was scored while specifying this record.
    budget:
      maximum_runs: 2
      note: >-
        One scientific execution of the six modules, the Carlitz
        control, and the rank-3 neighbor. maximum_runs 2 allows one
        infrastructure retry under a new run id. The scientific
        objects are frozen at these polynomials.

  falsification_conditions:
    - height1_count is not 4, or height2_count is not 2.
    - Any of the six modules has H_gcd different from H_coeff.
    - On tau^2 + tau^3 the two integers are equal.
    - On Psi_T = tau the two integers differ, or either integer is not 1.

  interpretation_limits:
    - One prime field, degree 1. No statement about heights over extensions.
    - The rank-3 neighbor is outside the six-module list. It does not enlarge that list.
    - This is not a torsion cardinality and not an isogeny-class count.
    - Not an attack claim. No ECDLP exponent is in scope.

