hypothesis:
  id: H-ECDLP-84ca6a
  question_id: RQ-INSTR-f8faa0
  title: >-
    Four fabricated artifact hashes passed reviewer, validator and red team
    undetected, so a two-stage detector and a review-role calibration are both
    warranted; but the proposed second-stage statistic scores 0.115 on the
    actual placeholders, inside the genuine-digest null, so it has ZERO power
    against the exact defect it was built for and is replaced here by a
    parity-class symbol-count statistic that separates by more than six sigma
  statement: >-
    Source proposal IDEA-20260808-b3c97b (RQ-INSTR-f8faa0, class tooling).
    SCOPE: this program's own evidence pipeline. No cryptographic claim, no
    curve, no ECDLP content; the ECDLP token in the identifier is an allocation
    artifact.
    (A) THE MOTIVATING FACT, VERIFIED VERBATIM BY THIS COORDINATOR SESSION.
    EV-ECDLP-65b004 carries four artifact hashes that its own
    artifact_hash_integrity_finding describes as fabricated placeholders, each
    62 hex characters where SHA-256 has 64, not derived from any file. The same
    record carries reviewer verdict CONDITIONAL_PASS, validator verdict PASS
    with the note "All 120 arm-runs present and valid", and a red-team verdict
    raising a fatal objection to the interpretation. Three independent reviews,
    zero detections of a defect visible by counting characters.
    (B) CLAIM A, THE DETECTOR, WITH ITS SECOND STAGE REPLACED ON COMPUTED
    GROUNDS. Stage D1, a length and alphabet check, catches this class: 62 is
    not 64. Stage D3, recomputation against the bound commit, is strictly
    stronger but is not always applicable, and its coverage across the corpus is
    itself an unknown the instrument measures. THE SOURCE PROPOSAL'S STAGE D2 IS
    REFUTED HERE BY DIRECT COMPUTATION. It proposes the fraction of adjacent
    nibble transitions obeying the best affine successor rule x maps to x + c
    mod 16, asserts the observed filler scores 1.0, and sets a threshold at 0.5.
    Expanding the actual placeholder
    d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4 gives 61
    transitions whose difference multiset is 7 appearing 7 times, 9 six times, 8
    six times, 6 six times, 5 five times, 11 five times, 4 four times, 12 four
    times, 13 three times, 3 three times, 10 six times, 14 twice, 2 twice, 15
    once and 1 once. The best single rule therefore matches 7 of 61, i.e. 0.115,
    against a genuine-digest expectation for the maximum over 16 rules of about
    0.125. THE PLACEHOLDERS SIT INSIDE THE NULL AND D2 AT THRESHOLD 0.5 WOULD
    NEVER FIRE. The string is not a rotation of a fixed successor rule; it is
    two interleaved cycles, with odd nibble positions cycling through the six
    symbols a to f and even positions through the ten symbols 0 to 9, repeating
    with period 30 pairs.
    (C) THE REPLACEMENT, COMPUTED NOT LOOSENED. Stage D2 prime is the minimum
    over the two positional parity classes of the number of DISTINCT hex symbols
    that class uses. The placeholders score 6, since the odd class uses only
    a to f. For a genuine digest each parity class is 31 or 32 draws from 16
    symbols, giving an expected distinct count of 13.84 with standard deviation
    1.15, so a threshold at 8 sits 5.1 standard deviations below the null mean
    and 1.7 above the placeholder value. The false-positive probability is about
    1.7 times 10^-7 per parity class per digest, i.e. about 3 times 10^-3 across
    two classes and a corpus of 10^4 digests, and the placeholders fire with a
    6.8 sigma margin.
    (D) CLAIM B, THE REVIEW CALIBRATION, DECLARED UNDERPOWERED WITH ITS
    REQUIRED SAMPLE SIZE. Plant defects from a declared ladder into SANDBOX
    copies, measure per-role detection, and compute the escape-correlation
    factor as the observed probability that all three miss divided by the
    product of the three individual miss probabilities. Distinguishing that
    factor being 2 from its being 1 at three sigma, with per-role sensitivity
    near one half, requires about 88 planted packages PER DEFECT CLASS, i.e.
    about 528 packages and about 1584 role-reviews across a six-rung ladder.
    That is out of reach of any plausible batch budget in this program, so the
    calibration arm is declared UNDERPOWERED rather than run at a size that
    could not answer it.
  mechanism: >-
    D2 prime's power comes from a counting fact. A uniformly random 62-nibble
    string restricted to one parity class is about 31 independent uniform draws
    from 16 symbols, so the number of unseen symbols has mean 2.16 and standard
    deviation 1.15 and the distinct count concentrates near 13.84. A string
    built by interleaving a 6-cycle with a 10-cycle uses 6 symbols in one class
    and 10 in the other, so its minimum parity-class distinct count is 6, which
    is nearly seven standard deviations below the null. The separation is
    arithmetic rather than empirical. D2 prime exists because D3, recomputation,
    is stronger but not always applicable: the file may not exist at the bound
    commit, may have been produced outside the repository, or may be large.
    CLAIM B's mechanism is capture-recapture: three reviews of one artifact are
    three capture occasions on one defect population, and with planted defects
    the per-role sensitivities are directly observed.
  assumptions:
    - >-
      Artifact hashes are declared to be SHA-256 with 64 hex characters. Any
      other declared algorithm changes D1's length constant and the parity-class
      null's parameters, and must be READ FROM THE RECORD rather than assumed.
    - >-
      Sandbox copies and a sealed plant manifest are procedurally enforceable,
      so no planted artifact can ever reach the ledger. An instrument that
      injected false records into the evidence chain would itself be a
      fabrication vector.
    - >-
      Agent reviewers are non-deterministic, so any per-role sensitivity is
      estimated over repeats and the repeat count bounds the smallest resolvable
      rate at one over that count.
  proof_search_map:
    bottleneck: >-
      The step at which an artifact hash is accepted as evidence of integrity.
      Three reviews passed a defect visible by counting characters, so the
      acceptance step is currently unmeasured.
    baseline_embedding:
      parameter_slice: >-
        Genuine SHA-256 digests already committed in this corpus, where the
        detector must not fire.
      reproduction_check: >-
        Run D1 and D2 prime over every genuine digest in the committed ledger
        and report the empirical maximum of the statistic. THAT MAXIMUM, NOT
        THE MEAN, SETS THE USABLE THRESHOLD, and the smallest resolvable
        false-positive rate is one over the number of digests.
    observation_collision:
      observable: A 62 or 64 character hex string.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT BOUNDS WHAT ANY OF THIS CAN DO. A fabricated
        hash drawn from a genuine-looking random source is indistinguishable
        from a real digest by any statistic on the string alone. D1 and D2 prime
        are filler detectors, not fabrication detectors; only D3 addresses the
        general case, and its coverage is measured rather than assumed.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The minimum over positional parity classes of the distinct-symbol
          count, in place of the best-affine-successor transition fraction.
        predicted_gain: >-
          From zero separation on the actual defect to a 6.8 sigma separation,
          with a computed false-positive rate.
    quantifier_order: >-
      FOR ALL artifact hash claims in the committed ledger, D1 and D2 prime are
      evaluated and D3 is evaluated where applicable. NOT CLAIMED: that a
      passing hash is genuine, which no statistic on the string can establish.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the committed corpus contains the stated number of hashes failing
        D1, D2 prime or D3, and that the detector separates the known
        placeholders from the corpus's genuine digests by the stated margin. It
        CANNOT certify that any passing hash is genuine and it cannot measure
        review quality in general.
      nearby_object_control: >-
        Genuine digests, where the conclusion "this is fabricated" is known
        false. A detector that flags real hashes is worse than none.
    proof_obligations:
      - claim: The four placeholders score 0.115 on the proposed D2 statistic.
        responsibility: correctness
      - claim: A genuine digest's max-over-16 rule fraction is about 0.125.
        responsibility: baseline
      - claim: D2 prime separates the placeholders from genuine digests.
        responsibility: strictness
      - claim: D2 prime's detection decays as filler is replaced by random nibbles.
        responsibility: soundness
      - claim: The escape-correlation arm needs about 88 packages per class.
        responsibility: feasibility
      - claim: No planted artifact reaches the ledger.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For a genuine SHA-256 digest of a file not adversarially chosen, the hex
        nibbles behave as independent uniform draws from 16 symbols, so each
        positional parity class of about 31 nibbles has an expected distinct
        symbol count of 16 times (1 minus (15/16)^31) = 13.84 with standard
        deviation 1.15, and the minimum over the two classes is at least 9 with
        probability at least 1 minus about 2.4 times 10^-5.
      random_model_justification: >-
        Pseudorandomness of SHA-256 output on non-adversarial inputs is the
        standard modelling assumption underlying every use of it as a content
        identifier in this repository. Nothing stronger is needed, and the
        distinct-count moments follow from the occupancy distribution.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-6147b4]
      falsification_condition: >-
        Any genuine digest already committed in this corpus scores 8 or below on
        D2 prime. The null fires, the threshold is wrong, and D2 prime is
        withdrawn pending recalibration.
    - id: HEUR-002
      formal_statement: >-
        Replacing k of the 62 nibbles of the filler with uniform random nibbles
        raises the minimum parity-class distinct count from 6 to approximately
        6 plus 10 times (1 minus (15/16)^(k/2)), giving predicted values 7.5,
        8.8, 10.8 and 13.3 at k equal to 5, 10, 20 and 40.
      random_model_justification: >-
        Each substituted odd-class position draws uniformly from 16 symbols, of
        which 10 are absent from the filler's odd class, so the count of newly
        present symbols follows the standard coupon-collector expectation.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-6147b4]
      falsification_condition: >-
        D2 prime's statistic does not increase monotonically with k, or does not
        cross the threshold of 8 between k = 5 and k = 10. A statistic that does
        not decay when the structure it claims to detect is destroyed is the
        canonical artifact tell.
  structural_ingredients:
    - description: >-
        Four fabricated artifact hashes of 62 hex characters, disclosed in the
        record's own integrity note, alongside a reviewer CONDITIONAL_PASS, a
        validator PASS asserting all 120 arm-runs present and valid, and a
        red-team fatal objection to the interpretation.
      citation: EV-ECDLP-65b004
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read the artifact_hash_integrity_finding,
        the four artifact hash values and all three review verdicts verbatim in
        ledger/evidence/EV-ECDLP-65b004.yaml, and independently expanded the
        first placeholder to compute its transition-difference multiset
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: proposed_D2_statistic_on_the_actual_placeholders
      direction: lower
      minimum_effect: >-
        COMPUTED IN ADVANCE AND RECORDED AS A REFUTATION: 7 of 61, i.e. 0.115,
        against the source proposal's asserted 1.0 and its threshold of 0.5. The
        arm is retained ONLY as a negative control that must not fire.
    - metric: D2_prime_on_the_actual_placeholders
      direction: lower
      minimum_effect: >-
        EXACTLY 6, since the odd parity class uses only the six symbols a to f.
        Threshold 8. Margin 1.7 standard deviations below the threshold and 6.8
        below the null mean of 13.84.
    - metric: D2_prime_on_genuine_corpus_digests
      direction: higher
      minimum_effect: >-
        At least 9 on every genuine digest already committed. The empirical
        MAXIMUM of the statistic's complement, i.e. the minimum observed
        distinct count, is reported and is what sets the usable threshold. Any
        genuine digest at 8 or below is a false positive and must be reported.
    - metric: D2_prime_decay_under_random_substitution
      direction: higher
      minimum_effect: >-
        PREDICTED MAGNITUDES 7.5, 8.8, 10.8 and 13.3 at k equal to 5, 10, 20 and
        40 random nibbles substituted, monotone increasing, crossing the
        threshold of 8 between k = 5 and k = 10. A statistic that does not decay
        is measuring something other than the claimed structure.
    - metric: D3_coverage_across_the_corpus
      direction: different
      minimum_effect: >-
        Reported, no value predicted. The fraction of hash claims whose named
        path exists at the bound commit. A low fraction is the finding that
        recomputation is not universally available and that D1 and D2 prime are
        therefore load-bearing.
    - metric: escape_correlation_factor
      direction: higher
      minimum_effect: >-
        DECLARED UNDERPOWERED. Distinguishing a factor of 2 from a factor of 1 at
        three sigma with per-role sensitivity near one half requires about 88
        planted packages per defect class, about 528 packages and about 1584
        role-reviews for a six-rung ladder. The required size is stated rather
        than the claim being shrunk to what a batch can afford.
  test_boundary:
    instances:
      - every artifact hash claim in the committed ledger
      - the four known placeholders in EV-ECDLP-65b004
      - a decay ladder of filler strings with k random nibbles substituted
      - sandbox copies of review packages under a sealed plant manifest
    parameters:
      hash_length_expected: 64
      D2_prime_threshold: 8
      decay_ladder_k: [0, 5, 10, 20, 40]
      planted_packages_per_class_required: 88
    implementation: >-
      Read-only over the committed ledger for the detector phase. Planted
      defects exist only in sandbox copies and never in knowledge/ or ledger/.
    budget:
      wall_clock_seconds: 600
      memory_gb: 8
      maximum_runs: 4
  falsification_conditions:
    - >-
      Any genuine corpus digest scores 8 or below on D2 prime. The null fires,
      the threshold is wrong, and D2 prime is withdrawn pending recalibration.
    - >-
      D2 prime does not increase monotonically as random nibbles replace filler.
      The statistic is measuring something other than the claimed structure.
    - >-
      The proposed D2 statistic scores materially above 0.115 on the
      placeholders. The refutation computed here is wrong and must be corrected
      before D2 is retired.
    - >-
      Per-role sensitivity on the format class is above 0.8. The escape was an
      outlier rather than a systematic gap, which is important and would
      redirect effort elsewhere. NOTE that this cell is underpowered as
      declared, so a null result on it is not evidence either way.
  interpretation_limits:
    - >-
      AN INSTRUMENTATION RESULT ABOUT THIS PROGRAM'S OWN PROCESS. Not a
      cryptographic claim, not an accusation about any record or session, and it
      moves no exponent. There is no curve and no cryptographic object anywhere
      here, so the curve-free-null requirement is discharged by construction.
    - >-
      EV-ECDLP-65b004's SUBSTANTIVE NUMBERS ARE NOT INVALIDATED BY THE HASH
      DEFECT. That record states so itself: the numbers were independently
      spot-checked against the run's own analysis file. Only the hash-based
      integrity claim is affected.
    - >-
      D1 AND D2 PRIME ARE FILLER DETECTORS, NOT FABRICATION DETECTORS. A hash
      fabricated from a genuine-looking random string defeats both, and only D3
      addresses that case. The coverage of D3 is measured, not assumed.
    - >-
      THE REVIEW-CALIBRATION ARM IS UNDERPOWERED AT ANY PLAUSIBLE BATCH SIZE AND
      IS DECLARED SO. Its required sample size is stated. Running it small would
      produce a number that cannot distinguish the two remedies it exists to
      distinguish.
    - >-
      Measured sensitivities, if ever obtained, are properties of the sampled
      defect ladder and not of review quality in general, and reviewers who
      learn that plants exist change behaviour, so any measured sensitivity is
      an UPPER bound on unprimed sensitivity.
  status: proposed
  proposed_by: idea-generator
