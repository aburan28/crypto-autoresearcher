hypothesis:
  id: H-ICEX-c3de6f
  question_id: RQ-TORS-8c7b79
  statement: >-
    Let s_ell(R) = chi_p(psi_ell(x(R))) in {-1, 0, +1} be the Legendre-symbol
    coarsening of the division-polynomial residue ladder declared in
    IDEA-20260807-df906f, for ell in L = {3, 5, 7, 11, 13}, evaluated on points
    of a toy prime-order subgroup. The effective number of independent statistics
    N_eff, derived from the matrix of pairwise normalised mutual informations, is
    materially below the nominal count 5 - specifically N_eff <= 4.0 - and the
    deficit exceeds what a curve-free family of random polynomials of matched
    degrees (4, 12, 24, 60, 84) produces under the identical coarsening.
  mechanism: >-
    All five statistics are polynomial functions of the same field element x(R),
    so they cannot be independent in any strict sense; the measurable question is
    how much of the nominal count survives. Coarsening each residue to a
    three-valued symbol is what makes the question non-vacuous - the raw residues
    are deterministic functions of one variable and their pairwise mutual
    information saturates at the entropy of the coarser variable, which forces
    N_eff to 1 by construction and admits no alternative. The coarsened ladder has
    a genuine distribution, so N_eff can range over [1, 5] and an alternative
    hypothesis can move it.
  assumptions:
  - >-
    BAND NON-DEGENERACY, ADDED BY THIS CONTRACT AND NOT PRESENT IN THE SOURCE
    IDEA. The source idea proposes measuring dependence among the declared
    division-polynomial statistics without fixing a coarsening. Read against
    IDEA-20260807-df906f verbatim, the declared object is the residue VECTOR
    v_L(R) = (psi_ell(x(R)))_{ell in L}, whose components are exact deterministic
    functions of x(R). For that object the effective independent count is 1 by
    construction, over the whole declared range, and no alternative hypothesis
    can move it. This contract therefore fixes the coarsening s_ell = chi_p
    composed with psi_ell as the measured statistic and states the change
    explicitly; the coarsening, not the raw ladder, is what is measured.
  - >-
    Points are sampled uniformly from the prime-order subgroup by taking random
    scalar multiples of the generator. The scalars are discarded and never used,
    and the discard is enforced mechanically and recorded.
  - >-
    Points with psi_ell(x(R)) = 0 are ell-torsion x-coordinates and are recorded
    in a separate zero census rather than folded into the symbol distribution
    silently.
  - >-
    Dependence measured on toy curves is scoped to those curves. The statistics
    have small fixed ranges while the point sample grows, so the estimator
    saturates rather than the statistic changing; this is a property of the
    instrument and is reported as such.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      A dependence measurement among declared observables. No theorem is sought
      and no proof-oriented claim is made; the map's audits do not apply and the
      reason is recorded rather than the map omitted.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL pairs (ell, ell prime) in L with ell not equal to ell prime, and
      FOR ALL tested toy curves, the normalised mutual information between
      s_ell and s_ell_prime on uniformly sampled subgroup points is at most 0.05,
      so N_eff is at least 4.0.
    random_model_justification: >-
      The division polynomials at distinct primes have coprime degrees and their
      root sets are disjoint torsion subgroups, which suggests the coarsened
      symbols behave like independent fair signs. THE GAP, STATED - they are all
      functions of one x-coordinate, so exact independence is impossible and only
      the magnitude of the dependence is at issue. That magnitude is what the
      measurement returns.
    supporting_results:
    - >-
      Disjointness of ell-torsion x-coordinate sets for distinct ell, used as the
      reason to expect small rather than zero dependence.
    validation_experiment_ids:
    - EXP-ICEX-909638
    falsification_condition: >-
      N_eff below 4.0 with a bootstrap interval excluding 4.0, on at least three
      of the five tested curves.
  structural_ingredients:
  - description: >-
      The division-polynomial residue ladder, read verbatim from
      IDEA-20260807-df906f - for odd primes ell, psi_ell(x) in F_p[x] has degree
      (ell^2 - 1)/2, that is 4, 12, 24, 60, 84 for ell = 3, 5, 7, 11, 13, and its
      roots are exactly the x-coordinates of the non-zero ell-torsion points;
      v_L(R) = (psi_ell(x(R)))_{ell in L} with L = {3, 5, 7, 11, 13}. This record
      measures the Legendre coarsening of that ladder, not the ladder itself.
    citation: IDEA-20260807-df906f
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, ladder definition and degrees read verbatim)
    role: definition of the measured family
  reduction_chain: null
  predictions:
  - metric: duplicated_statistic_plant_recovery
    direction: different
    minimum_effect: >-
      Adding k exact duplicates of s_3 to the panel, for k = 1 and k = 2, must
      reduce N_eff by exactly k relative to the nominal count 5 + k, within
      +/- 0.25. This is the defect of known size, its predicted magnitude and its
      graded dynamic range. A measure that misses the k = 1 plant detects nothing.
  - metric: independent_synthetic_panel_recovery
    direction: different
    minimum_effect: >-
      Five independent uniform three-valued variables, matched on marginal
      distribution to the observed symbols, must return N_eff = 5.00 within
      +/- 0.25. This is the upper anchor of the band.
  - metric: effective_independent_count_n_eff_against_nominal_five
    direction: lower
    minimum_effect: >-
      N_eff at or below 4.0 with a bootstrap 95 percent interval excluding 4.0,
      on at least three of the five tested curves.
  - metric: curve_free_matched_degree_polynomial_null_n_eff
    direction: different
    minimum_effect: >-
      Reported beside the curve arm. If the curve-free null reproduces the N_eff
      deficit within 0.25, the deficit is a property of polynomial degree and
      coarsening, not of elliptic curves.
  test_boundary:
    instances:
    - at least 5 toy prime-order curves at 20 to 28 bits
    - at least 20000 uniformly sampled subgroup points per curve
    parameters:
      ell_ladder: [3, 5, 7, 11, 13]
      coarsening: Legendre symbol of psi_ell evaluated at x, values in {-1, 0, +1}
      duplicate_plant_k: [0, 1, 2]
    implementation: >-
      Division-polynomial recurrence over F_p[x] computed once per curve, Horner
      evaluation at x(R), Legendre symbol by modular exponentiation.
    budget:
      wall_clock_seconds_per_run: 600
      maximum_memory_gb: 8
      maximum_runs: 60
  falsification_conditions:
  - >-
    The k = 1 duplicate plant does not reduce N_eff by 1.00 within +/- 0.25. The
    dependence measure has no demonstrated dynamic range and no number from it is
    admissible.
  - >-
    The independent synthetic panel does not return 5.00 within +/- 0.25. The
    estimator is biased and every N_eff it reports is inadmissible.
  - >-
    N_eff matches the nominal count 5 within the band. The coarsened statistics
    are effectively distinct at this scope and HEUR-001 stands.
  - >-
    The curve-free matched-degree polynomial null reproduces the N_eff deficit.
    The dependence is definitional, arising from degree and coarsening rather
    than from curve structure.
  interpretation_limits:
  - >-
    This measures relationships among observables. It establishes nothing about
    the ECDLP and produces no attack, no exponent and no cost model.
  - >-
    Scoped to the declared coarsening. A different coarsening is a different
    statistic and would return a different N_eff; the number is not a property of
    the division polynomials.
  - >-
    THE SOURCE IDEA OVERCLAIMS ONE STEP AND THE OVERCLAIM IS NOT ADOPTED. It
    states that a low effective count would mean the corpus's several recorded
    torsion negatives are one negative repeated. This design measures dependence
    among STATISTICS, not among the SCREENS that consumed them; the screens
    differ in null, sample size and decision rule as well as in statistic. No
    conclusion about corpus coverage may be drawn from this experiment, and any
    such conclusion needs the separate screen-power audit.
  - >-
    A curve-free null of random polynomials at matched degrees is mandatory. If
    it reproduces the signature, nothing here may be quoted as a statement about
    elliptic curves or the ECDLP.
  status: proposed
  proposed_by: coordinator
