  status_note: >-
    REJECTED AS POSED, AT TOY TIER (DEC-20261023-039ddf, EV-CZLIFT-f2a401,
    strength strong, proof_status derivation). Scope: F_p^*, two seeds of 40
    seeded primes 50 < p < 2000 with 40 pairs each, precision 4, g the
    smallest primitive root as frozen in run.py. False clauses: (a) the naive
    integer section's ratio equals d at 13/1600 and 20/1600 (z = 7.65, 9.14),
    exactly on the pairs with g^d mod p^2 < p (Eisenstein's logarithmic
    property of the Fermat quotient: every pair with g^d < p succeeds, no pair
    with p <= g^d < p^2 can, the rest at the exact conditional null); (b) the
    non-canonical sections are not homomorphic on a fraction near 1/p (naive
    exactly when x*y < p; Hensel with probability p^-3). Clauses that held:
    the Teichmuller section is homomorphic and log_p-vanishing on every sampled
    pair with the ratio never defined; the random-Hensel ratio equals d at
    0.56x of mean 1/p (95% CI 0.12-1.63). The stated mechanism
    Hom(Z/(p-1), Z_p) = 0 is not refuted; the refuted part is the implicit
    random-model assumption for a structured section. The excess carries no
    discrete-log information beyond an O(log p) integer logarithm and is no
    evidence about elliptic curves; an elliptic analogue exists on integral
    multiples of a small global point (red-team O1, review-side), so the
    "no elliptic analogue" sentence of DEC-20261009-44c288 is not carried.
    Not official until the ledger archive TASK-20261023-4d7449 is verified.
