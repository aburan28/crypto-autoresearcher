  title: On F_p^* the Teichmuller section is the unique homomorphic section, log_p vanishes on it, and non-canonical
    sections recover d at the random rate
  statement: 'For 40 primes 50 < p < 2000 with generator g and precision 4: the Teichmuller section is a homomorphism
    on every sampled pair and the functional log_p(s(x)^{p-1}) vanishes on it identically, so its Smart-style ratio
    is never defined; the naive-integer and random-Hensel sections are homomorphic on a fraction near 1/p of pairs
    and their ratio log_p(s(g^d)^{p-1})/log_p(s(g)^{p-1}) equals d mod p at a rate within 4 standard errors of the
    mean of 1/p.'
  mechanism: 'Hom(Z/(p-1), Z_p) = 0: an additive functional on Z_p^* that factors through a section vanishes on
    the torsion mu_{p-1}, which is the image of the Teichmuller section; any other section differs by a 1-unit whose
    log is the whole output. This is H-CZLIFT-6d4ed1 with E replaced by the multiplicative group, in which the p-adic
    route is universally agreed not to help.'
  assumptions:
  - p odd prime, precision k = 4 < p; log_p by the series on 1 + pZ_p (exact at this precision)
  - d in [2, p-3]
  proof_search_map:
    not_applicable_reason: bounded measurement against a pre-registered prediction; no asymptotic claim
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
  - description: canonical prime-to-p torsion lifting and its reduction-isomorphism boundary
    citation: knowledge/techniques/KN-TECH-73630e.md
    provenance: internal
    verified_by: coordinator, this session (2026-10-09), read the entry on disk
    role: the object the calibration and the construction instrument mirror
  reduction_chain:
    core_problem: whether a characteristic-zero lift of the ECDLP carries discrete-log information at the tested
      scope
    corollaries: []
  predictions:
  - metric: teichmuller.homomorphism_rate and teichmuller.functional_vanishing_rate
    direction: different
    minimum_effect: exactly 1.0
  - metric: naive.success_rate and hensel.success_rate against reference_inv_p
    direction: different
    minimum_effect: '|z| <= 4'
  test_boundary:
    instances:
    - 40 seeded primes in (50, 2000), 40 pairs each
    parameters:
      precision: 4
    implementation: experiments/EXP-CZLIFT-bdae69/implementation/run.py
    budget:
      wall_clock_seconds_per_run: 3600
  falsification_conditions:
  - a Teichmuller pair failing the homomorphism or vanishing identity (instrument)
  - a non-canonical section with z > 4 on both seeds
  interpretation_limits:
  - a calibration on G_m; it bears on elliptic curves only by analogy of the exact sequence
