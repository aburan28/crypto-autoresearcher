      scope
    corollaries: []
  predictions:
  - metric: teichmuller.homomorphism_rate and teichmuller.functional_vanishing_rate
    direction: different
    minimum_effect: exactly 1.0
  - metric: naive.success_rate and hensel.success_rate against reference_inv_p
    direction: different
    minimum_effect: '|z| <= 4'
  test_boundary:
    instances:
    - 40 seeded primes in (50, 2000), 40 pairs each
    parameters:
      precision: 4
    implementation: experiments/EXP-CZLIFT-bdae69/implementation/run.py
    budget:
      wall_clock_seconds_per_run: 3600
  falsification_conditions:
  - a Teichmuller pair failing the homomorphism or vanishing identity (instrument)
  - a non-canonical section with z > 4 on both seeds
  interpretation_limits:
