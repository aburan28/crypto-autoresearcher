hypothesis:
  id: H-ICPERF-2c57cc
  question_id: RQ-ICPERF-94c86e
  question_ids:
    - RQ-ICPERF-94c86e
    - RQ-SATIC-1ae57a
  goal_id: GOAL-ICPERF-e6b6a4
  proposal_id: null
  proposal_note: >-
    No IDEA record. This is the SUCCESSOR hypothesis owed by H-ICPERF-cc4847's
    `superseding_restatement_owed` block (recorded in DEC-20260915-87360d
    corrections_recorded). It restates the two wordings that record names and
    carries forward, unchanged, the clauses EV-ICPERF-390707 measured. It
    proposes no new mechanism.
  supersedes: H-ICPERF-cc4847
  supersedes_note: >-
    H-ICPERF-cc4847 is `weakened` and FROZEN; it is not edited by this record
    and nothing here withdraws it. What changes: (1) P1 is restated to admit
    twist decompositions with the side recorded, because a system encoding
    S_4 = 0 cannot distinguish E from its quadratic twist and the five
    unverified answers of RUN-ICPERF-305ca3 were certified twist
    decompositions (EV-ICPERF-390707 joint V1); (2) P6's mechanism clause is
    DROPPED, because the relabelling control of REVIEW-ICPERF-20260913-66fd51
    (proves_too_much object 2, FAILED) reproduced the structured-versus-null
    conflict gap by renaming variable indices alone. Q2 and Q5's Groebner
    clause are carried unchanged: they were UNMEASURED, not refuted (AGENTS.md
    core rule 5), for the instrument reasons EXP-ICPERF-e21835 repairs.
  title: >-
    On Trimoska's S_4 Weil-descent PDP instances at l <= 6, measured with a
    REPAIRED instrument, the SAT-over-Groebner gap is measurable rather than
    censored, every SAT answer is a decomposition on E or on its quadratic twist
    with the side recorded, and the branching-order clause carries the gap
  statement: >-
    For the 60 shipped instances of SRC-ICPERF-TRIMOSKA-ECICB-2024 (cells
    (15,5), (17,6), (19,6); 10 S + 10 U each), run on this host with WDSat
    rebuilt from SRC-ICPERF-TRIMOSKA-WDSAT-2024, the installed generic engines
    (Macaulay2 1.22 F4 over ZZ/2 with field equations; Singular 4.3.2 with BOTH
    std and slimgb; CryptoMiniSat 5.11 on CNF-XOR and pure CNF; CaDiCaL 1.7 and
    MiniSat 2.2 on pure CNF), a matched random Boolean null object per template,
    and an instrument whose four measured defects (EV-ICPERF-390707 joints V2
    and V3) have been repaired and independently accepted:

    (Q1) all 30 S certificates verify on the curve with independent arithmetic,
    and every SAT answer any engine returns is a root of the shipped system and
    a valid decomposition ON E OR ON ITS QUADRATIC TWIST, with the side
    RECORDED per answer. The twist fraction is a measured column of the boundary
    table, not an anomaly to be investigated.

    (Q2) per cell, the median WDSat wall time is at least 10x below the median
    wall time of every Groebner engine that finishes, on S and on U separately.
    At least one Groebner engine finishes on the (15,5) cell.

    (Q3) the branching order carries the gap: (a) the explicit core order
    (-g 1..ml) reproduces the default's conflict count EXACTLY on every
    instance (an identity check on the -g wiring, not a finding); (b) the
    non-core-first order, run on the first 5 S and 5 U instances of each cell
    under a 120 s timeout, has a median wall time at least 2x the default's on
    the same instances on every (cell, label), timeouts counted at their
    timeout as a right-censored lower bound; and (c) giving CryptoMiniSat only
    the pure-CNF encoding costs it at least 10x the median wall time of WDSat
    on the ANF at l = 6, per cell and label independently computed.

    (Q4) enabling WDSat's Gaussian elimination (-x) does not reduce median wall
    time by more than 10% on any (cell, label) whose default median exceeds
    0.05 s; a (cell, label) under that floor is reported as unresolvable by
    wall clock and asserts nothing.

    (Q5) for the SAT solvers the median U cost exceeds the median S cost by at
    least 2x in conflicts on every cell, while for the Groebner engines the S/U
    median engine-CPU ratio lies within [0.5, 2] on every cell where an engine
    finishes both.

    (Q6) on the matched random null objects WDSat's median conflicts are at
    least 10x its median on the structured U instances of the same cell, WHERE
    BOTH FINISH. No attribution of that gap to descended structure is claimed:
    see `mechanism` and `interpretation_limits`.

    Every prediction is scored by a reduction that reports, per clause,
    `evaluated: true|false` with a reason, and reports `holds: null` for any
    prediction quantified over cells that is unevaluable on any cell.
  mechanism: >-
    Unchanged from H-ICPERF-cc4847 for Q2-Q5, and cited rather than restated:
    Proposition 1 of KN-LIT-102cdb -- assigning the ml core variables
    x_{i,j} determines every e-variable by unit propagation through the linking
    equations e_k = sigma_k(x), so a DPLL search branching only on the core has
    a search space of 2^{ml} and never pays for the e-layer, while a Groebner
    engine pays for the e-layer in the Macaulay matrix regardless of order.

    WHAT THIS RECORD NO LONGER CLAIMS. H-ICPERF-cc4847's P6 read the
    null-object comparison as evidence that "the solver's speed is a property
    of the descended structure, not of the size". REVIEW-ICPERF-20260913-66fd51
    proves_too_much object 2 FAILED: permuting the variable indices of
    Xn15l5-11-U -- which preserves the system exactly and changes only the
    labels -- moved WDSat from 31,257 conflicts to a ten-seed median of
    4,224,251, i.e. 135x the shipped order and 0.55x the matched null. The
    structured instance spans 361x across variable orders where its null spans
    2.14x. A null object differs from a structured one in BOTH content and
    (implicitly) emitted variable order, so the comparison cannot separate the
    two, and wdsat.c makes the default branching sequence literally the index
    order. Q6 therefore asserts only that the null objects are harder where
    both finish.

    THE DESIGN THAT WOULD SEPARATE THEM is IDEA-20260915-7ef636's
    2x2-plus-planted-core null: structure present/absent crossed with a
    core-exposing versus a scrambled variable order, plus a null object with a
    planted core. That is ranked work under GOAL-ICPERF-e6b6a4 next_action item
    (4) and is NOT designed, approved, or executed by this hypothesis or by
    EXP-ICPERF-13f001. Until it runs, the attribution stays open and Q3's
    branching-order clause is the only order/structure statement this goal has
    measured evidence for -- strengthened, not weakened, by the relabelling
    result, since it reaches the branching-order conclusion by a route with no
    -g flag in it.
  assumptions:
    - >-
      The installed generic engines are stand-ins for Magma F4 / PolyBoRi,
      which are absent; Q2 is about the gap to THESE engines and asserts
      nothing about Magma.
    - >-
      Singular slimgb is admitted as a SECOND Singular configuration beside
      std, not as a replacement: EV-ICPERF-390707 joint V2 measured slimgb
      finishing n15l5-1-S in 167.4 s where std exceeds 900 s, both being
      Groebner engines over the same ideal. Any cell reporting slimgb reports
      std beside it, censored where it is censored.
    - >-
      The shipped U label is a RANDOM TARGET, not a certificate of
      unsatisfiability. This is read off the upstream generator
      (find_points.sage: an S instance takes x_R = x(P1+P2+P3) for points on E;
      a U instance takes x_R uniformly at random with no check) and confirmed
      by the exhaustive V^3 enumeration of EV-ICPERF-390707 joint V1, which
      agrees with the solvers on 60/60 instances. Every "U instance" statement
      in this hypothesis is about 30 specific shipped files.
    - >-
      WDSat's performance depends on the compile-time __MAX_ID__ being exact;
      every cell is run on a build sized to the value the solver itself
      reports.
    - >-
      Macaulay2's F4 is MULTI-THREADED on this host (EV-ICPERF-390707 joint V2
      measured 170.56 CPU-seconds against 49.97 wall seconds on n15l5-1-S, a
      3.4x ratio). Wall and CPU are therefore reported separately for every
      Groebner row and no wall-time ratio is presented as a CPU-time ratio.
    - >-
      Memory is bounded by a RESIDENT-SET watchdog, never by RLIMIT_AS: the
      same joint measured Macaulay2 reserving 145.4 GiB of address space
      against a 6.82 GiB resident peak. A garbage-collected algebra system's
      address-space reservation is not its memory requirement.
    - >-
      Wall time and conflicts are taken with the machine otherwise quiet; a row
      whose recorded load average exceeds the pinned core count is flagged, not
      discarded.
  proof_search_map:
    applicability: >-
      Measurement hypothesis, not a proof-oriented proposal. The four audits
      are recorded as they apply; nothing here is a theorem.
    bottleneck: >-
      The PDP step's solve cost per instance, in conflicts (SAT) and
      engine-reported CPU seconds (Groebner), on the authors' own instances.
    baseline_embedding:
      exact_baseline: >-
        The in-repo baseline is the default-order WDSat run on each instance,
        against which every variant and every engine is a ratio on the same
        machine. Table 4 / Table 2 of SRC-SATIC-TRIMOSKA-2019 are REPORTED
        numbers and enter no ratio here.
      reproduction_status: >-
        reproduced_in_repo_for_the_SAT_column: RUN-ICPERF-305ca3 and
        RUN-ICPERF-4ec9b9 measured it at 504 rows each, and
        EV-ICPERF-390707 joint V2 re-ran four WDSat rows from rebuilt binaries
        reproducing status, conflict count and the full assignment bit string
        exactly. The GROEBNER column is not yet reproduced at all -- that is
        what the repaired instrument is for.
    observation_collision:
      what: >-
        Whether a smaller ratio than reported is the ENCODING rather than the
        solver: the pure-CNF file expands each XOR by XORtoCNF.sh and may
        simply be larger. Controlled by running CryptoMiniSat on both the
        CNF-XOR and the pure-CNF forms of the same instance (Q3c).
      second_collision: >-
        Whether the Groebner column measures the ALGORITHM or the SCRIPT. It
        measured the script in RUN-ICPERF-305ca3: all 32 emitted .m2 files
        carried a parse error raised after F4 completed, so the column was zero
        at any memory limit. Controlled by EXP-ICPERF-e21835's acceptance
        criteria, which require a parsed RESULT line agreeing with two
        independent engines before this hypothesis is tested at all.
    quantifier_order: >-
      For every shipped instance (60), for every engine that finishes within
      budget: the ratios in Q2-Q6 are per-cell medians over the 10 S or the 10
      U instances. Nothing is claimed for any instance, cell, engine or l
      outside the 60, and nothing is claimed about any curve.
    method_ceiling:
      ceiling: >-
        l <= 6 and n <= 19 are all the generator ships; nothing about the
        reported 200 GB wall at l = 8 is reachable from this row.
      nearby_object_control: >-
        The matched random Boolean system of identical shape is the null
        object, and Q6 is its prediction -- WITH the attribution dropped,
        because the relabelling control showed a shape-matched null is not a
        sufficient control for a structure claim. The control that would
        suffice is named in `mechanism` and is not part of this hypothesis.
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  asymptotic_claim_note: >-
    Null on purpose. This is one column of one row of a measured boundary
    table at n <= 19; it makes no complexity claim and no promotion gate of
    agents/coordinator.md applies to it.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None. Every clause is scored directly from the run's raw table; no clause
    is conditional on an unproven distributional assumption.
  structural_ingredients:
    - description: >-
        Proposition 1 (core-variable propagation in the Weil-descended S_4
        system) and the SAT-versus-Groebner PDP comparison whose direction Q2
        tests.
      citation: KN-LIT-102cdb / SRC-SATIC-TRIMOSKA-2019
      provenance: internal
      verified_by: >-
        Read in repo as inputs/SATIC-TRIMOSKA-2019 and summarized in
        knowledge/literature/; cited by H-ICPERF-cc4847 and by
        EXP-ICPERF-66fd51 before RUN-ICPERF-305ca3.
      role: mechanism for the branching-order clause Q3
    - description: >-
        The quadratic twist of a binary curve shares the summation-polynomial
        relation: S_4 vanishes on x-coordinates over the algebraic closure, so
        a root whose x-coordinates all have trace 1 is a twist decomposition
        and not an encoding defect. Q1's restatement rests on this.
      citation: EV-ICPERF-390707 joint V1
      provenance: internal
      verified_by: >-
        TASK-20260913-6c5729 (validator, independent session): 52/52 ANF
        equations satisfied, f3 = 0 under the reviewer's own GF(2^19)
        arithmetic, trace 1 on all four elements, x(P1 +/- P2 +/- P3) = x_R on
        the twist for 2 of 8 sign choices.
      role: correctness of the side-classified verifier
  reduction_chain:
    core_problem: null
    corollaries: []
  reduction_chain_note: >-
    Null: a measurement row reduces to nothing and nothing reduces to it.
  predictions:
    - metric: >-
        Q1 -- fraction of SAT answers that are roots of the shipped system AND
        decompositions on E or on its twist, with the side recorded
      direction: higher
      minimum_effect: >-
        1.0 (every answer). A recorded side is part of the measurement: an
        answer classified as a root but neither an E- nor a twist-decomposition
        falsifies Q1.
    - metric: Q2 -- per-cell median (WDSat default wall) / (Groebner engine wall)
      direction: lower
      minimum_effect: >-
        <= 0.1 on every cell and label where a Groebner engine finishes, with
        at least one finisher on (15,5). Reference from EV-ICPERF-390707 joint
        V2 on n15l5-1-S: Macaulay2 F4 49.97 s wall, Singular slimgb 167.4 s,
        WDSat default ~0.005 s.
    - metric: Q3a -- conflict count, core order versus default, per instance
      direction: different
      minimum_effect: exact equality on 60/60; any difference falsifies
    - metric: >-
        Q3b -- per-(cell,label) median wall, non-core-first over default,
        right-censored
      direction: higher
      minimum_effect: ">= 2x"
    - metric: >-
        Q3c -- per-(cell,label) median wall, CryptoMiniSat pure CNF over WDSat
        ANF, at l = 6
      direction: higher
      minimum_effect: >-
        ">= 10x on each of the four l = 6 (cell,label) pairs INDEPENDENTLY.
        Reference: the corrected all-10 ratios of EV-ICPERF-390707 joint V3 are
        10.396 / 34.472 / 67.460 / 83.500 and the matched-subset ratios are
        26.071 / 34.468 / 327.664 / 82.629. The tight cell (n17l6/S) clears 10
        by 4%."
    - metric: Q4 -- per-(cell,label) median wall, gauss_elim over default
      direction: higher
      minimum_effect: ">= 0.9x, above a 0.05 s default-median floor"
    - metric: Q5 -- median U/S conflicts (SAT); median S/U engine CPU (Groebner)
      direction: different
      minimum_effect: ">= 2x for SAT on every cell; within [0.5, 2] for Groebner"
    - metric: >-
        Q6 -- per-cell median conflicts, matched null object over structured U,
        where both finish
      direction: higher
      minimum_effect: >-
        ">= 10x. Carries NO mechanism claim; a cell where the null does not
        finish is unevaluable in this quantity and is reported as such rather
        than dropped."
  test_boundary:
    instances:
      - the 60 shipped instances, unchanged, identified by INFO-file parameters
      - matched random null objects generated from a recorded seed
    parameters:
      n: [15, 17, 19]
      l: [5, 6]
      m_minus_1: 3
      curve: the single fixed Koblitz curve of the generator, y^2 + xy = x^3 + x^2 + 1
    implementation: >-
      EXP-ICPERF-13f001, using the repaired instrument frozen by
      EXP-ICPERF-e21835 and referenced by content hash. Not the
      EXP-ICPERF-66fd51 code tree, which stays frozen and is the instrument
      whose defects EV-ICPERF-390707 measured.
    budget:
      per_invocation_wall_seconds_max: 1800
      child_rss_limit_gb: 8
      note: >-
        RSS watchdog, never RLIMIT_AS. 8 GiB is chosen against a measured
        6.71-6.82 GiB unconstrained peak (EV-ICPERF-390707 joint V2), i.e.
        ~17% headroom on a 15 GB host, and it is an HONEST limit: a row it
        kills was genuinely too large, which the 6 GB RLIMIT_AS was not.
    scale: >-
      toy (n <= 19, l <= 6); every instance solved to completion or recorded as
      budget-stopped with its limit
    excluded:
      - any n or l not shipped by the generator
      - any engine not installed on this host; Magma F4 and PolyBoRi/BRiAl
      - every reported literature timing
      - >-
        the structure-versus-variable-order attribution, which needs
        IDEA-20260915-7ef636's design and is not tested here
  falsification_conditions:
    - >-
      Q1 fails: a shipped certificate does not verify, or any engine returns an
      assignment that is not a root of the shipped system, or a root that is a
      decomposition on NEITHER E nor its quadratic twist. Note what is NO
      LONGER a falsification: a twist decomposition with the side recorded.
      That was H-ICPERF-cc4847 P1's defect and this record fixes the wording,
      not the data.
    - >-
      Q2 fails on any cell where a Groebner engine finishes: the median
      WDSat/Groebner wall ratio is above 0.1. Q2 is UNEVALUABLE, not failed, on
      a cell where none finishes -- and it reports `evaluated: false` with the
      reason rather than nothing.
    - >-
      Q3 fails: (a) the explicit core order differs from default in conflicts
      on any instance; (b) the non-core-first censored median wall is not at
      least 2x the default's on some (cell,label); or (c) CryptoMiniSat on pure
      CNF is within 10x of WDSat on some l = 6 (cell,label) computed
      independently -- the identical-value defect of RUN-ICPERF-305ca3's
      summary made this clause untestable and its repair is a precondition.
    - >-
      Q4 fails: -x reduces median wall time by more than 10% on some
      (cell,label) whose default median exceeds 0.05 s.
    - Q5 fails on any cell where the clause is evaluable.
    - >-
      Q6 fails: matched null objects are not harder for WDSat by 10x in median
      conflicts on some cell where both finish. This would mean the null object
      is not a harder object of the same shape; it would NOT, either way, say
      anything about structure versus variable order.
    - >-
      INSTRUMENT PRECONDITION, and it is not a falsification of anything: if
      EXP-ICPERF-e21835's acceptance fails, EXP-ICPERF-13f001 is not approved
      and this hypothesis is not tested. An unrepaired instrument produces no
      evidence for or against Q1-Q6.
  interpretation_limits:
    - >-
      A confirmed Q2 is a statement about the named engine builds on one host
      on 60 instances; it is not a statement about Magma F4, about l > 6, or
      about the end-to-end attack, whose other phases are unmeasured here.
    - >-
      Q6 carries NO mechanism reading. Anyone quoting it as evidence that
      WDSat exploits descended structure is quoting a claim this record
      deliberately removed; the relabelling control that removed it is
      EV-ICPERF-390707 proves_too_much object 2.
    - >-
      Q3b and Q6 are ONE finding about variable order rather than two
      independent mechanisms, per DEC-20260915-87360d. They are stated
      separately because they are separately measured, not because they are
      independent.
    - >-
      No rho or BSGS comparison exists in this hypothesis; nothing here bears
      on RQ-ICPERF-94c86e's decision target beyond one column of one row.
      Building the generic-baseline column is GOAL-ICPERF-e6b6a4 next_action
      item (5).
    - >-
      Budget stops (timeouts, RSS-watchdog kills) are infrastructure outcomes,
      excluded from medians with the count of exclusions reported per cell, and
      never evidence against a prediction.
    - >-
      A twist decomposition is a genuine root of the shipped system and a
      genuine relation for the TWIST, not a defect and not a relation for E.
      In a relation-search column it must be counted on the correct curve or
      not at all.
