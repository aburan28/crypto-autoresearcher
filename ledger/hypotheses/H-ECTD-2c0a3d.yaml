hypothesis:
  id: H-ECTD-2c0a3d
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_idea_ids:
    - IDEA-20261005-1b41d9
  added: '2026-10-10'
  status: approved
  proposed_by: coordinator
  title: >-
    Rational group invariant factors on the first eligible ordinary
    rational 2-isogeny through characteristic 64
  statement: >-
    In the frozen lexicographic scan of (p,a,b,r), with p an odd prime
    at most 64, E: y^2=x^3+a*x+b ordinary and T=(r,0) a rational
    point of order 2, there is a first edge whose rational degree-2
    quotient E2 is ordinary, has the same trace but a different j,
    and whose common point count N has a prime square divisor. The
    exact invariant-factor pair of E(F_p) differs from that of
    E2(F_p) in at least one coordinate. Both the existence and pair
    difference are part of this bounded prediction.
  mechanism: >-
    A rational degree-2 isogeny has a rational kernel of size 2.
    Its map on rational points has image size N/2 and index 2 in
    the codomain group of the same order N. This permits the
    codomain rational group to have a different invariant-factor
    pair, while a coefficient scaling gives the same group pair
    by an explicit point bijection. The experiment measures one
    endpoint property and makes no algorithmic cost claim.
  assumptions:
    - >-
      The source and quotient are nonsingular and ordinary, with
      matching point counts and traces and different j-invariants.
      These are checked, not inferred merely from the formula.
    - >-
      Only a common order N divisible by q^2 for some prime q is
      eligible; a square-free N forces a single finite abelian
      group type and is rejected before the pair comparison.
    - >-
      The selection order is (p,a,b,r) ascending, considering every
      rational root r. This prospective rule resolves ambiguity in
      the source proposal's first-root wording.
    - >-
      Characteristic 3 is included. Its quotient has A=3r=0,
      so it is already in short-Weierstrass form; at p at least 5,
      the quotient is normalized by an exact x translation.
  proof_search_map:
    not_applicable_reason: >-
      This is a finite, deterministic endpoint measurement with
      p at most 64, not a proposed theorem or asymptotic method.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        The frozen scan has an eligible edge, and the first such
        edge has unequal source and codomain invariant-factor pairs.
      random_model_justification: >-
        This is a finite existence-and-difference prediction rather
        than a random-group law. The source idea offered a uniform
        group-type imitation, but this protocol does not rely on
        its distributional accuracy. The prediction is checked by
        exhaustive finite enumeration.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECTD-07b200
      falsification_condition: >-
        A complete valid scan has no eligible edge, or its first
        eligible edge passes every control and the source and
        codomain pairs are equal.
  structural_ingredients: []
  predictions:
    - metric: difference_coordinates
      direction: greater_than_zero
      minimum_effect: 1 of 2 coordinates on the first eligible edge
  test_boundary:
    instances:
      - >-
        Every nonsingular short-Weierstrass source over odd prime
        p from 3 through 64, with coefficients represented in
        0 through p-1 and every rational 2-torsion root r
    parameters:
      prime_range: odd primes 3 through 64 inclusive
      selection_order: lexicographic (p,a,b,r)
      isogeny_degree: 2
      selected_edges: 1 if any exist
      scaling_parameter: 2
    implementation: >-
      Enumerate and validate every candidate in order. On the
      first eligible edge, enumerate both full rational groups,
      compute each exponent as the lcm of exact point orders and
      the second invariant factor as N divided by the exponent.
      Independently recompute source, quotient, and scaled-source
      groups and preserve the full rejection trace.
    budget:
      enforcement: advisory
      maximum_runs: 1
      maximum_workers: 1
      maximum_memory_gb: 1
  falsification_conditions:
    - >-
      The valid complete scan reaches p=64 without an eligible edge.
    - >-
      The valid first eligible edge has identical ordered
      invariant-factor pairs on source and quotient.
  interpretation_limits:
    - >-
      A difference on this edge establishes endpoint-specific group
      structure only in the measured finite scope; it gives no
      private-path, transfer, weakness, or ECDLP-cost claim.
    - >-
      Equality on this edge leaves other edges and larger primes
      unresolved. A no-instance result concerns only the frozen
      finite search.
    - >-
      A failed quotient, point count, ordinarity, scaling control,
      timeout, crash, or incomplete trace invalidates the reading
      rather than supplying a mathematical negative.
