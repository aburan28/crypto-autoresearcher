hypothesis:
  id: H-ROS-7a19e0
  question_id: RQ-ROS-595c15
  derived_from_idea: IDEA-20260809-47bb6d
  added: '2026-08-25'
  statement: >-
    The published polynomial-time ROS solver can be implemented and run to completion inside one
    batch at small group orders, producing a LITERAL forged blind-Schnorr signature on a message
    never signed, which verifies under a blind-Schnorr verifier implemented independently of the
    attack code. That is the first claim and it is binary - either the artifact exists and its
    certificate re-verifies, or the implementation is wrong and the goal halts until it is fixed.
    THE SECOND CLAIM IS THE ONE THAT MAKES THIS A MEASUREMENT RATHER THAN A REPRODUCTION. The
    solver's cost, measured across the number of concurrently opened signing sessions and across the
    group order, follows a stateable curve with a TRANSITION - prohibitive below a session count that
    tracks the logarithm of the group order, and falling sharply above it. The location of that
    transition, its sharpness, and the memory it costs are the deliverable, and having the curve
    rather than the asymptotic verdict is what lets any later instantiation question in this goal be
    answered quantitatively rather than by citation.
    THE THIRD CLAIM IS THE CONTROL THAT MAKES THE SECOND FALSIFIABLE. At session counts well below
    the transition, the solver must FAIL within the declared budget. A solver that succeeds
    everywhere has no transition to locate, and a solver that fails everywhere has not been shown to
    work; only a solver that separates the two regimes has measured anything.
    Nothing here is a statement about any deployed protocol, wallet, service or chain. Every
    certificate is against this program's own blind-Schnorr implementation at small parameters.
  mechanism: >-
    The blind-Schnorr signing protocol lets a signer produce signature shares on blinded challenges
    without seeing the message. An attacker that opens several sessions concurrently receives several
    independent commitments and may choose its blinded challenges after seeing all of them. The ROS
    problem asks for a linear combination of the received challenges, together with a target
    challenge, that is consistent with a hash of a message never submitted; solving it converts the
    signer's honest responses into a signature on that message. The solver's cost is governed by how
    many independent linear relations the attacker can form, which is exactly the number of
    concurrent sessions, and the transition appears where that number becomes sufficient to represent
    a target challenge in the span - which is why it is expected to track the logarithm of the group
    order rather than the order itself.
    The measurement is therefore over two axes with a predicted interaction, not over one axis with a
    predicted threshold, and reporting a curve rather than a verdict is what distinguishes this
    record from a citation. The below-threshold control is load-bearing for the same reason the
    transition is - a sharp fall that is really an artifact of the search order would show up as
    success below the predicted transition, and nothing else in the design would catch it.
  assumptions:
    - >-
      The ROS reference is fetched and filed from primary text under a run record before the solver
      is implemented. The parent proposal records it as RECALLED, REQUIRED READ and NOT YET READ; a
      solver written from recall reproduces a memory, not a published algorithm, and its cost curve
      would be a property of the memory.
    - >-
      The honest blind-Schnorr signing protocol is implemented and validated FIRST - honest sessions
      must produce signatures that the independent verifier accepts - because a broken protocol
      implementation manufactures forgeries out of its own bugs.
    - >-
      The verifier is implemented independently of the solver and of the signer, and shares no
      module, constant table or serialization with either. A forgery accepted only by code written
      alongside the attack is not a forgery.
    - >-
      Every session and every solver run is seeded and replayable, since a forgery that cannot be
      replayed cannot be verified by anyone else.
    - >-
      "Small group orders" means orders chosen so that a complete sweep is affordable, not orders
      chosen because the attack works there. The group-order grid is declared before any run.
  test_boundary:
    instances: >-
      This program's own blind-Schnorr implementation over three declared small group orders, with an
      independently implemented verifier. No deployed protocol, no production library, no external
      service.
    parameters: >-
      Three group orders; concurrent session counts swept around the logarithm of each, including at
      least two counts well below it for the control and at least two well above; twenty trials per
      cell with declared seeds; certificates emitted at every successful cell.
    quantities: >-
      Forgery success indicator and certificate bytes; solver operations and peak memory per cell;
      the fitted transition location and sharpness per group order; the below-threshold failure rate.
    out_of_scope: >-
      Any statement about a deployed protocol, wallet, custody service or chain; any claim of a new
      attack, since the algorithm is published and this record does not claim it; any statement about
      mitigations or about protocols that are not this program's blind-Schnorr implementation.
  distinguishable_outcomes:
    - outcome: >-
        The honest path validates; a literal forgery is produced at the smallest parameter and its
        certificate re-verifies under the independent verifier; the below-threshold control fails
        within budget at every low session count; and the measured transition location tracks the
        logarithm of the group order across all three orders.
      means: >-
        The artifact and the curve both exist. This goal gains a reproduced forgery and a measured
        cost surface, which are the instruments the rest of the goal needs. No new attack is claimed
        and no deployed system is implicated.
    - outcome: >-
        Honest path validates and a forgery is produced, but the transition location does NOT track
        the logarithm of the group order.
      means: >-
        The measured curve contradicts the published account as this program has implemented it.
        Investigation comes BEFORE anything is recorded - the likely causes are a solver variant, a
        different cost accounting, or an implementation defect - and no cost surface is published
        until the discrepancy is resolved or characterised.
    - outcome: >-
        No forgery is produced at any reachable parameter within the batch budget.
      means: >-
        Either the implementation is wrong or the reachable parameter range does not include the
        regime where the solver succeeds. This is a BUDGET AND IMPLEMENTATION outcome about this
        solver, never a mathematical statement about the ROS problem, and it halts the goal until
        resolved.
    - outcome: >-
        The solver succeeds at session counts well below the predicted transition.
      means: >-
        The transition is not real as measured - most likely an artifact of the search order or of a
        cost accounting that does not charge what it should. The cost surface is void until the
        accounting is corrected, and the third claim is refuted.
    - outcome: >-
        Honest signing fails to produce verifier-accepted signatures before any forgery is attempted.
      means: >-
        The protocol implementation is broken. Any "forgery" produced afterwards would be a bug
        report against this program's own code. Blocking; nothing else runs.
    - outcome: >-
        A produced forgery's certificate fails re-verification under the independent verifier.
      means: >-
        The run is completed_invalid. A claimed forgery whose certificate does not re-verify is not a
        forgery, and no cost figure from that cell is admissible.
  prior_evidence_refs:
    - RQ-ROS-595c15
    - GOAL-ROS-001
    - IDEA-20260809-47bb6d
  falsification_conditions:
    - No forgery at any reachable parameter within the batch budget.
    - The transition location does not track the logarithm of the group order.
    - The solver succeeds at session counts well below the predicted transition, voiding the transition.
    - Honest signing fails to produce verifier-accepted signatures.
    - Any forgery certificate fails re-verification under the independently implemented verifier.
    - >-
      The verifier shares code with the signer or the solver, in which case its acceptance carries no
      information and the run is invalid.
  interpretation_limits:
    - >-
      Certificates are against this program's own blind-Schnorr implementation at small parameters.
      Nothing here is a statement about any deployed protocol, wallet, service or chain.
    - >-
      The algorithm is published and this record does not claim it. What is claimed is the ARTIFACT
      and the CURVE - a reproduced forgery inside this program and a measured cost surface.
    - >-
      Non-completion at a cell is a BUDGET outcome about this solver under AGENTS.md rule 3, never a
      mathematical result about the ROS problem.
    - >-
      The cost surface is scoped to the three group orders, the swept session counts, the declared
      cost accounting and the implementation at the recorded commit. It transfers to nothing else
      without a stated assumption.
    - >-
      A measured transition that matches the logarithm of the group order at three small orders is
      consistent with the published account at those orders. It is not a verification of the
      published asymptotic claim, which this design cannot reach.
