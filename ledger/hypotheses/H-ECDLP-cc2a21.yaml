  title: >-
    At B = 64 the unstructured balance ties exponent 1/2 on the boundary
  statement: >-
    Log base 2 of 64 is 6, and 6 squared is 36. B squared is 4096.
    B cubed is 262144. B to the fourth is 16777216. The model relation
    cost is N over B squared. Setting that cost equal to B squared
    gives N = 16777216 and T = 4096, and T squared equals N, so the
    unstructured exponent is 1/2. At that balance, B to the fourth
    over N equals 1, so the strict cut fails. Setting the relation
    cost equal to B times 36 gives T = 2304 and N = 9437184. T cubed
    is 12230590464, which equals that N times 1296, and 1296 is 36
    squared. B to the fourth exceeds 9437184 by 7340032. Nine times
    16777216 equals sixteen times 9437184, so the ratio is 16/9, which
    is 7/9 above 1. Writing the relation cost as N over B drops one
    factor of B. That page has unstructured N = 262144, with T cubed
    equal to N squared, and circulant N = 147456, with T squared equal
    to 36 times N.
  mechanism: >-
    The proposal balances relation collection against a linear-algebra
    charge. This contract checks that page at B = 64. It does not
    build a relation matrix and it does not test commutation.
