# H-NTRU-b09cf3 — specified from IDEA-20261005-bd02d9.
# Protocol approval is DEC-20261006-7d3135. This record asserts nothing
# about an attack, a bit-security change, or a movement of the fatigue
# exponent. No lattice was reduced while writing it.
hypothesis:
  id: H-NTRU-b09cf3
  question_id: RQ-NTRU-9015ee
  source_proposal: IDEA-20261005-bd02d9
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-NTRU-9015ee.yaml does not name a goal. This design
    does not attach one.
  status: approved
  status_note: >-
    approved means the control protocol in EXP-NTRU-fe4ae9 is approved for
    a later executor. It does not mean the dense-sublattice transition was
    observed. Status moves only by DEC-20261006-7d3135 under the standing
    user authorization of 2026-09-06. No BKZ profile was computed in this
    design.
  proposed_by: coordinator
  conversion_note: >-
    The claim, the cells N+/N-/I/M, the fatigue-ratio gate, the controls,
    and the falsification conditions are carried from IDEA-20261005-bd02d9.
    The Coordinator added the planted cell P, the random q-ary cell R as an
    explicit basis, the pre-registered z-shape predicate, the secret-tied
    check, the BKZ sweep, and the RNG pin. Those pins were fixed before any
    reduction.

  statement: >-
    TEST BOUNDARY. n = 64, ring Z[x]/(x^64+1), lattice dimension 128.
    Ternary means independent coefficients in {-1, 0, 1}. The fatigue ratio
    is r = q / (0.004 * n^2.484), computed by the harness with math.pow.
    Hand values are labels only: the design-time Python 3.12.8 evaluation
    gave a curve near 122.63, r(q=32) near 0.261, and r(q=1024) near 8.35.
    The gate is the sign, r(q=32) < 1 < r(q=1024). This hypothesis does not
    move the exponent 2.484, does not claim Ring-LWE or Module-LWE is
    broken, and does not claim a bit-security improvement.

    PRE-REGISTERED PREDICTION, fixed before any run. On one ternary NTRU
    lattice at q=1024 (cell N+), the pre-registered z-shape predicate fires
    and a reduced basis vector lies in the secret span. On the same
    construction at q=32 (cell N-), on a cyclotomic ideal lattice of
    dimension 128 (cell I), on a rank-2 module lattice of dimension 128 at
    q=1024 whose public element is not an NTRU trapdoor (cell M), and on a
    random q-ary lattice of dimension 128 and the same determinant as N+
    (cell R), that predicate does not fire. A planted dense sublattice that
    is not NTRU-shaped (cell P) does fire, so a silent N+ is not confused
    with a dead detector.

    DISTINGUISHABLE OUTCOMES. (1) N+ detected, N-/I/M/R silent, P alive,
    ratio signs correct, no log-unit certificate, no isometry score:
    assigns the panel to the NTRU dense-sublattice line. (2) The same
    z-shape predicate fires on I, on M, or on R: the transition appears on
    a non-NTRU lattice and the specificity claim fails. (3) N- is detected
    while r(q=32)<1: the reported curve does not separate this toy point.
    (4) N+ is silent while r(q=1024)>1 and P fires: this design does not
    see the published transition. (5) P is silent, a ratio sign is wrong,
    a log-unit decoder ran, or an isometry bit-gap was scored: inconclusive
    or invalid, and not a negative result about the fatigue curve.

  mechanism: >-
    The tracked object is the dense sublattice of an NTRU lattice, seen as
    a Z-shape in the Gram-Schmidt profile together with a vector in the
    secret span, at a block size inside the frozen sweep. KN-TECH-045
    reports that object for ternary NTRU once q crosses 0.004*n^2.484. The
    projection keeps that unusually short span and discards the rest of
    the profile. It is predicted to propagate under BKZ only when the span
    is present and the fatigue ratio is above 1. A cyclotomic ideal does
    not plant an NTRU secret span. A module lattice whose public element
    was not built as g*f^{-1} does not plant it. A random q-ary lattice of
    matched determinant does not plant it. Cell P plants a dense
    sublattice by a different construction so the predicate can be seen to
    fire without an NTRU public key.

    LINE SEPARATION. A log-unit certificate, in the sense of KN-TECH-046
    (short generator recovered by decoding the log-unit lattice, at
    approximation factor exp(O~(sqrt(n)))), is a different line. This
    hypothesis does not run that decoder. If a run emits one, the
    observation is the class-group line and is not scored as fatigue. A
    2–15 bit cost gap that vanishes when coefficient isometries are
    removed is KN-OPEN-026. This hypothesis does not compute a bit
    discount. If a run emits one, the observation is the isometry line and
    is not scored as the dense-sublattice transition.

  assumptions:
    - Ternary secrets are independent uniform coefficients in {-1, 0, 1}. Fixed-weight ternary and non-ternary secrets are out of scope. KN-TECH-045 states that other secret laws shift the fatigue point and that this corpus does not record by how much.
    - The harness computes r with Python math.pow and keeps the panel only when r(q=32)<1 and r(q=1024)>1. The design-time floats are labels, not inputs.
    - ML-KEM-shaped in cell M means ambient rank 2 over Z[x]/(x^64+1), dimension 128, q=1024, with a public element that was not computed as g*f^{-1}. It is not a FIPS 203 parameter set.
    - The z-shape predicate below is this contract's detector. It is not a re-derivation of the Ducas–van Woerden statistic. The constant 0.004 and the exponent 2.484 were not re-derived.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      Empirical control at one toy dimension. No theorem, asymptotic
      bound, or reduction is claimed. The four inventor-protocol audits
      are not the object of this protocol. The nearby-object role is
      played by cells I, M, R, and P inside EXP-NTRU-fe4ae9.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    No exponent, cofactor, or constant-factor improvement is claimed.
    target time and memory stay at the reported ternary-NTRU fatigue-point
    block size. The exponent 2.484 is not moved.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For ternary NTRU, the dense-sublattice transition sits at
        q ~ 0.004 * n^2.484. Above that curve, reduction sees the
        sublattice inside the frozen block-size sweep. Below it, the
        transition is absent. The exponent 2.484 and the constant 0.004
        are reported, not re-derived. One n does not refit them.
      random_model_justification: >-
        KN-TECH-045 reports the concrete curve as the point where an NTRU
        lattice stops behaving like an LWE lattice of the same dimension
        and determinant. Cell R is that matched LWE-style object. The
        random-model content used here is only that comparison. No
        smoothness law and no Dickman function is invoked.
      supporting_results:
        - ref: KN-TECH-045
          provenance: internal
          claim: >-
            Concrete fatigue point q ~ 0.004 * n^2.484 for ternary NTRU,
            and asymptotic q = n^(2.484+o(1)), reported from the
            KN-LIT-114 abstract. The constant and the exponent were not
            re-derived in that note or in this design.
          verified_by: knowledge/techniques/KN-TECH-045.md
        - ref: KN-LIT-114
          provenance: internal
          claim: >-
            The knowledge entry reports the same asymptotic and concrete
            fatigue point and attributes the mechanism to recovery of
            secret-key information via the dense sublattice. This design
            read the knowledge entry, not a re-derivation of the paper.
          verified_by: knowledge/literature/KN-LIT-114.md
      validation_experiment_ids:
        - EXP-NTRU-fe4ae9
      falsification_condition: >-
        Inside EXP-NTRU-fe4ae9, with the harness confirming r(q=32)<1 and
        r(q=1024)>1, either cell N- is detected or cell N+ is silent while
        cell P fires. A timeout is not a falsification.
  structural_ingredients:
    - description: >-
        Ternary NTRU fatigue point as an instance-validity gate, concrete
        form q ~ 0.004 * n^2.484.
      citation: KN-TECH-045
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-045.md
      role: >-
        Supplies the curve the ratio r is computed from. Does not supply
        the z-shape threshold, which is local to this contract.
    - description: >-
        Reported source of that curve in this corpus.
      citation: KN-LIT-114
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-114.md
      role: >-
        Names the reported asymptotic and concrete fatigue point. Not a
        substitute for reading the paper's proofs.
    - description: >-
        Class-group and log-unit line, excluded from the score.
      citation: KN-TECH-046
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-046.md
      role: >-
        Names the observation this control must not score as fatigue.
    - description: >-
        Coefficient-isometry bit discount, excluded from the score.
      citation: KN-OPEN-026
      provenance: internal
      verified_by: knowledge/open-problems/KN-OPEN-026.md
      role: >-
        Names the 2–15 bit gap this control must not score as the
        dense-sublattice transition.
  reduction_chain:
    core_problem: >-
      Whether the pre-registered dense-sublattice detector at n=64 fires
      only on ternary NTRU above the reported fatigue curve.
    corollaries: []
  predictions:
    - metric: dense_sublattice_detected
      direction: different
      minimum_effect: >-
        Equal to 1 on N+ and on the planted cell P, and equal to 0 on N-,
        I, M, and R, when the ratio signs are confirmed.
  test_boundary:
    instances:
      - cell N+, ternary NTRU, n=64, q=1024, dimension 128
      - cell N-, the same construction at q=32
      - cell I, principal ideal in Z[x]/(x^128+1), dimension 128
      - cell M, rank-2 module lattice, dimension 128, q=1024, no NTRU trapdoor
      - cell R, random q-ary lattice, dimension 128, determinant q^64
      - cell P, planted non-NTRU dense sublattice, dimension 128, determinant q^64
    parameters:
      n: 64
      dimension: 128
      q_above: 1024
      q_below: 32
      bkz_block_sizes: [8, 12, 16, 20]
      bkz_tours: 1
    implementation: >-
      fpylll BKZ, one tour per block size, Gram-Schmidt norms from that
      reduced basis. No other solver.
    budget:
      enforcement: advisory
      maximum_runs: 2
  falsification_conditions:
    - >-
      The z-shape predicate fires on cell I, cell M, or cell R. The
      transition is then not specific to overstretched NTRU.
    - >-
      Cell N- is detected while the harness reports r(q=32)<1. The
      reported curve does not separate this toy point, or the detector
      fires without the dense sublattice.
    - >-
      Cell N+ is not detected while the harness reports r(q=1024)>1 and
      cell P fires. This design does not see the published transition.
    - >-
      A log-unit certificate is scored as fatigue, or a coefficient-isometry
      bit gap is scored as the transition. That run is invalid. It does
      not support and does not refute the NTRU line.
  interpretation_limits:
    - Toy n=64 only. No statement about sntrup761, NTRU-HPS, or any deployed parameter set.
    - Being below the fatigue point is not a security argument.
    - Does not claim Ring-LWE or Module-LWE is broken and does not claim a bit-security improvement.
    - Does not refit 0.004 or 2.484. One dimension is not a fit.
    - RQ-NTRU-9015ee withholds the deployed-ring measurement until submission specifications are filed. This hypothesis is the toy control, not that measurement.
    - Absence inside the block-size sweep is absence inside the sweep. It is not absence at every block size.
    - A log-unit certificate belongs to KN-TECH-046. A 2–15 bit isometry gap belongs to KN-OPEN-026. Neither is a fatigue observation.
  citations:
    - ref: IDEA-20261005-bd02d9
      provenance: internal
      claim: >-
        Source proposal. The cells, the ratio gate, and the refusal to
        claim an attack are copied from it.
      verified_by: ledger/proposals/IDEA-20261005-bd02d9.yaml
    - ref: KN-TECH-045
      provenance: internal
      claim: >-
        Fatigue point for ternary NTRU at q ~ 0.004*n^2.484. Constant and
        exponent not re-derived.
      verified_by: knowledge/techniques/KN-TECH-045.md
    - ref: RQ-NTRU-9015ee
      provenance: internal
      claim: >-
        The question asks where the dense-sublattice transition sits and
        requires a planted-null lattice of the same dimension and
        determinant. It forbids a deployed-security statement.
      verified_by: ledger/questions/RQ-NTRU-9015ee.yaml
