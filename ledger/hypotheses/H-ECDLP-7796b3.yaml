      A ranks first, and a
      zero-consumer ratio is
      undefined rather than infinite.
    baseline_embedding:
      parameter_slice: >
        REAL A/B table, KF infinite
        zero-consumer, NULL
        unestimable D.
      reproduction_check: >
        ratio(A)=5; ratio(B)=30;
        rank [A,B]. KF rejected.
        NULL has no numeric cost.
    observation_collision:
      observable: cost / unblocks versus ranking
      distinct_preimage_search: >
        Hold cost and drop the
        unblocks denominator to 0
