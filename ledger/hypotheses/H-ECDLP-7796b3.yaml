  title: >
    Stage 0 cost-per-conclusion
    identities — A ranks before B,
    zero-consumer undefined — before
    any deferred lane is priced
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-3ab929
