  related_hypotheses: []
  statement: >
    Fix the closed-form
    cost-per-unblocked-conclusion
    identities of IDEA-20260815-143d6e
    on one frozen two-lane toy table
    before any SDEG / RELN / SIG /
    MONO / ICEX batch is priced or
    dispatched. Stage 0 asserts only
    that lane A (cost 10, unblocks 2)
    has ratio 5, lane B (cost 30,
    unblocks 1) has ratio 30, and A
    ranks before B; that a nearby
    claim that a zero-consumer lane
    has infinite ratio is rejected
    (the ratio is undefined); and
    that an unestimable lane with no
    comparable batch is not assigned
    a numeric cost. This is not a
    prioritisation decision and not
    a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260815-143d6e tracks
    cost per unblocked conclusion.
    Stage 0 freezes the exact
    rational identities
    ratio = cost / unblocks on a
    two-row table so a later ranking
    cannot be read from an
    instrument that cannot fail.
    No live batch is costed. No
    Semaev S_m. No DLP solve.
  predictions:
    - id: P-S0-COSTPK
      metric: toy cost-per-conclusion identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL has
        ratio(A)=5, ratio(B)=30, and
        rank [A, B]. KF infinite
        zero-consumer ratio is
        rejected. NULL unestimable
        lane has no numeric cost.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that a zero-consumer lane
        has infinite ratio is
        accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        misses ratio(A)=5,
        ratio(B)=30, or A-before-B.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL cost-table panel
    parameters:
      real_table:
        A: {cost: 10, unblocks: 2, ratio_num: 5, ratio_den: 1}
        B: {cost: 30, unblocks: 1, ratio_num: 30, ratio_den: 1}
        must_rank: [A, B]
      known_false:
        kind: zero_consumer_infinite
        C: {cost: 1, unblocks: 0}
        must_reject: true
        must_undefined: true
      matched_null:
        kind: unestimable_no_comparable
        D: {comparable_batch: null}
        must_no_numeric_cost: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-8bbafa Stage 0 runner
    budget:
