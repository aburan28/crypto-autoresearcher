        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed campaign decision.
    quantifier_order: >
      Freeze the table before
      reading the rank. Toy ranking
      is not a PATH dispatch.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen rationals.
        Never a live-lane price.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is an unestimable lane.
        An argument that still
        assigns it a numeric cost
        is proves-too-much.
