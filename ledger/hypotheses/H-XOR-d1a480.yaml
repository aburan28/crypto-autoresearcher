hypothesis:
  id: H-XOR-d1a480
  question_id: RQ-ECDLP-002
  id_note: >-
    This record formalizes the claim experiments/EXP-SEMAEV-f48dd1/specification.yaml
    (frozen, status: approved) cites as hypothesis_id: H-XOR-YIELD, and
    ledger/evidence/EV-ECDLP-65b004.yaml cites (as H_XOR_YIELD, underscored)
    in its interpretation.hypothesis_implications key. "H-XOR-YIELD" is
    MALFORMED under this repository's own identifier schema
    (^H-[A-Z]+-(?:\d{3}|[0-9a-f]{6})$ -- area codes are letters-only, "YIELD"
    is not a valid \d{3} or 6-hex suffix; python3 tools/allocate_id.py --check
    H-XOR-YIELD returns REFUSE: malformed) and was never mintable as a real
    ledger record under any prior state of this repository. This is a
    disclosed defect in a FROZEN contract, not silently corrected: the spec
    is not edited in place (protocol amendments require a versioned
    successor, not an in-place edit of a frozen document, and this ID
    mismatch does not itself block reading the spec's actual, unambiguous
    scientific content). H-XOR-d1a480 is the correctly-formed record for the
    same claim; any future reader following spec.hypothesis_id to a
    nonexistent H-XOR-YIELD file should be redirected here by this note. If
    EXP-SEMAEV-f48dd1 is ever amended, its versioned successor should cite
    H-XOR-d1a480 directly.
  statement: >-
    An x-oracle (privileged access to whether a candidate tuple decomposes
    over the Semaev factor base, without performing the decomposition) gives
    a Semaev relation-finding search a yield advantage -- more relations
    found per unit of the full enumeration space |F|^m -- over a search
    guided by a random (uninformative) predictor, at toy scale (m=3, 7-8 bit
    prime fields).
  mechanism: >-
    Three arms are compared against a common enumeration space |F|^m: Arm A
    (exhaustive search, every candidate checked), Arm B (x-oracle-guided
    MITM, using the oracle to filter candidates before verification), and
    Arm C (random predictor, a null baseline with no structural information
    about decomposability). Yield is defined, per the frozen spec, as
    relations_found / |F|^m for every arm -- deliberately NOT
    relations_found / candidates_verified, so that the metric measures
    advantage over the enumeration space itself rather than conflating it
    with a filtering strategy's own precision.
  assumptions: []
  proof_search_map:
    not_applicable_reason: >-
      Purely empirical/measurement hypothesis at toy scale; not a proof,
      asymptotic bound, or closure argument.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients: []
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: delta_mean (Y_A - Y_C, group-level mean over 8 independent (prime, b) groups)
      direction: higher
      minimum_effect: statistically significant at alpha=0.05, corrected for pseudo-replication (n=8 groups, not n=40 cells)
  test_boundary:
    instances:
      - m=3, primes {101, 103, 107, 211}, b in {0.4, 0.5}, seeds 1-5
    parameters:
      claim_tier: toy
      field_bits: 7-8
    implementation: experiments/EXP-SEMAEV-f48dd1/implementation/full_grid.py
    budget: {}
  falsification_conditions:
    - delta_mean not statistically significant once correctly computed over independent groups (n=8), not pseudo-replicated cells (n=40)
    - Y_A (exhaustive) equals Y_B (x-oracle MITM) exactly, indicating any measured advantage is relative to the random-predictor null only, not evidence that the oracle improves yield over exhaustive search itself
  interpretation_limits:
    - >-
      Toy-scale only (7-8 bit prime fields); no claim about cryptographic-scale
      parameters (AGENTS.md rule 7).
    - >-
      The experiment's own frozen design compares the oracle against a random
      predictor (Arm C), not against exhaustive search restructured to use
      equivalent information (Arm A vs Arm B is the correct comparison for
      "does the oracle help find MORE relations", and Arm A vs Arm C or
      Arm B vs Arm C is the comparison this spec actually runs). This
      framing gap is exactly what the red-team review below identifies as
      the fatal interpretation concern.
    - No cost model (field operations, wall-clock, or otherwise) is provided; "speedup" is undefined without one.
  status: rejected
  proposed_by: idea-generator
  status_history:
    - status: proposed
      note: >-
        Retroactively recorded. The frozen experiment (specification.yaml,
        approved_by: coordinator) and its full-grid run (RUN-SEMAEV-f48dd1-grid)
        already existed, with independent reviewer/validator/red-team verdicts
        already recorded in EV-ECDLP-65b004.yaml, by the time this formal
        hypothesis record was minted (2026-08-07). This record formalizes an
        already-substantially-completed research thread rather than opening a
        new one; see id_note above for why the formal record was missing.
    - status: analyzed
      note: >-
        Set to reflect the evidence and three independent reviews already
        present in EV-ECDLP-65b004.yaml at the time this record was minted.
    - status: rejected
      note: >-
        Per DEC-20260808-6a7ac4 (decision: reject_scoped), committed in the
        same batch as this record. The rejection is scoped to this
        hypothesis's specific prediction (see the decision's
        the_scoped_rejection block for exactly what is and is not rejected);
        it is not a rejection of RQ-ECDLP-002, GOAL-ECDLP-001, or the
        x-oracle mechanism's real cost-reduction effect.
