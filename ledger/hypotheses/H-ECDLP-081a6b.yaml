    - >-
      The twist-computed x(Q) disagrees with the direct-root x(Q) at ANY
      j = m-1 trial. The cost identity is falsified; the isomorphism or the
      sign convention has an error the hand derivation missed. This is the
      record's headline negative result and is reported as such.
    - >-
      The wrong-rescaling-constant mutant ALSO reproduces x(Q) at a rate near
      1.000. The exact-match test has no discriminating power and the main
      result is unsupported however clean.
    - >-
      The nearest-non-twist curve E'' reproduces x(Q) at a materially nonzero
      rate. The pipeline is not testing the isomorphism.
    - >-
      The operation count exceeds m-1 additions plus one multiplication plus
      one O(1) lookup. The route is not the one derived.
    - >-
      Any j = m-1 tuple in the identity arm fails to split completely. That
      would contradict the already-committed parity law rather than this
      record, and must be escalated to independent review rather than
      absorbed.
    - >-
      The tau = 4 curve shows NO measurable difference at intermediate j AND
      the sample size is independently judged adequate. Then the genericity
      gap either does not exist as stated or is smaller than the collision
      formula predicts.
    - >-
      Any timeout, crash, or construction failure. failed_infrastructure
      under AGENTS.md rule 5, never negative evidence.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, IN EITHER DIRECTION. Even if the identity
      holds exactly, D_trial stays O(m) on both branches, the attempt count
      is unchanged, and the accounting remains strictly worse than Pollard
      rho at every finite m.
    - >-
      TOY SCALE for every measurement: p at most 1009, m at most 5.
    - >-
      THE PARITY LAW IS NOT THIS RECORD'S CONTENT AND IS NOT RE-TESTED HERE.
      It is already derived as a theorem in this lane and already measured by
      a COMPLETED, independently reviewed experiment at m in {3,4,5} with at
      least 20,000 specializations per cell - a fact the source idea did not
      have when it was written. Any later reader citing this record as the
      source of that law is mis-citing it.
    - >-
      The twist cost identity is a HAND DERIVATION, UNVERIFIED BY COMPUTATION
      by any agent in this program. It carries no more weight than that until
      the paired contract runs.
    - >-
      DISCLOSED OVERHEADS, never folded into "identical to j = 0": one extra
      F_p multiplication per attempt; the twisted-factor-base build cost,
      charged separately from per-attempt cost; and a second precomputed
      table of the same order as the first, a 2x memory increase.
    - >-
      The partial locus - some coordinates on-curve, some off, none free - is
      NOT addressed here and is a natural next object.
    - >-
      Whether the genericity gap ever fires at cryptographically relevant
      scale is untouched; this record establishes only its EXISTENCE and
      order of magnitude at toy scale. THAT QUESTION CANNOT BE TESTED AT
      REACHABLE SCALE by this design, and the contract says so rather than
      narrowing the claim silently.
    - >-
      NO STATUS CHANGE to any record is proposed or implied.

