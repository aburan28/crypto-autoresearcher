    - metric: >-
        exact SET equality between the twist-computed x(Q) and the
        direct-root x(Q) at every sampled j = m-1 tuple; dimensionless rate
        in [0,1]
      direction: same
      minimum_effect: >-
        1.000, exact set equality in 100 percent of sampled tuples, at m in
        {4,5} and p in {211, 1009}. A SINGLE mismatch falsifies the cost
        identity and is reported as the headline negative result.
