  status: proposed
  proposed_by: idea-generator

  statement: >-
    TEST BOUNDARY FIRST. Toy scale, p in {211, 1009}, m in {4, 5}, exact
    computation rather than statistics. NO EXPONENT MOVES IN EITHER
    DIRECTION: even if the identity holds exactly, the per-attempt cost
    D_trial stays O(m) on both branches, the attempt count is unchanged, and
    the composed accounting remains strictly worse than Pollard rho at every
    finite m.

    THE CLAIM. Fix a non-residue delta mod p, once per p and shared across
    all constructions in a cell. On the j = m-1 locus - every specialised
    x_i has f(x_i) a quadratic NON-residue, so the corresponding point P_i is
    defined only over F_{p^2} and satisfies Frob(P_i) = -P_i - write
    f(x_i)/delta = (y_i')^2 with y_i' in F_p, which is possible because
    non-residue divided by non-residue is a residue. Then the map
    (x, y') maps to (X, Y) = (delta*x, delta^2*y') carries the auxiliary
    curve (y')^2 = f(x)/delta isomorphically onto the standard quadratic
    twist E_delta: Y^2 = X^3 + A*delta^2*X + B*delta^3, an ordinary elliptic
    curve OVER F_p with its own F_p-rational addition law. Because an
    isomorphism of elliptic curves commutes with the group law over any field
    where it is defined, the signed sum Q = sum eps_i P_i can be computed as
    R = sum eps_i (delta*x_i, delta^2*y_i') on E_delta(F_p) - exactly m-1
    group additions using ONLY F_p arithmetic - followed by
    x(Q) = X(R) * inverse(delta) mod p, one multiplication by a precomputed
    constant.

    PREDICTED, AND THIS IS THE TESTABLE CONTENT: the twist-computed x(Q)
    equals the DIRECT polynomial-root x(Q) exactly, at every sampled j = m-1
    tuple, so D_trial for the j = m-1 branch is m-1 additions plus one
    multiplication plus one O(1) lookup against a precomputed twisted factor
    base - the SAME ORDER as the already-pinned j = 0 branch, with one
    disclosed extra constant-time operation, and NOT the "genuine
    root-finding, not reducible to group additions" cost that the lane's own
    cost-model record originally predicted for this locus.

    HONEST STATUS OF THE DERIVATION. The algebra was worked BY HAND in the
    source record and has NOT been machine-checked by any agent in this
    program. The discriminant scaling delta^3*f(X/delta) = X^3 +
    A*delta^2*X + B*delta^3 was re-derived by direct expansion rather than
    taken on a citation's authority; the general facts that a quadratic twist
    of a non-singular curve is non-singular and that an isomorphism commutes
    with the group law are RECALLED and were not fetched. This hypothesis
    carries no more evidentiary weight than "hand derivation, unverified by
    computation" until the paired experiment runs.

    WHAT IS NOT CLAIMED. No attack, no exponent, no new attempt count, no
    algorithm. Nothing about the parity law itself, which is already derived
    and already measured elsewhere in this lane at higher resolution than
    this record contemplates. Nothing about the partial locus (some
    coordinates on-curve, some off). No status change to any record.

  mechanism: >-
    THE TRACKED OBJECT is the signed-sum point Q = sum eps_i P_i on the
    j = m-1 locus, followed NOT through E(F_{p^2}), where it lives natively
    with two-element coordinates per field element, but through its image
    R = sum eps_i (delta*x_i, delta^2*y_i') on the quadratic twist
    E_delta(F_p) - an F_p-RATIONAL avatar of the same group element.

    WHAT IS DISCARDED AND WHY THAT IS NOT MERELY A CHANGE OF COORDINATES. The
    F_{p^2}-coordinate representation of Q, which is four F_p elements of raw
    data per point, is replaced by (X, Y) in F_p x F_p - exactly the
    F_p-rational half. What is dropped is the sqrt(delta)-multiple structure,
    which is FIXED and shared by every point of the trace-minus-one set
    {P : Frob(P) = -P}, so no information about Q itself is lost: X/delta
    recovers x, and Y/delta^2 together with the curve-wide choice of
    sqrt(delta) recovers y. The representation nonetheless drops from an
    F_{p^2}-arithmetic COST MODEL to an F_p-arithmetic cost model, and that
    drop is the entire content of the claim. A change of coordinates would be
    free; this is not, and the operation count is the deliverable.

    WHY THE ISOMORPHISM STEP IS THE LOAD-BEARING ONE. Frob(P_i) = -P_i on
    this locus because Frob(sqrt(delta)) = delta^{(p-1)/2} * sqrt(delta) =
    -sqrt(delta) for delta a non-residue, while y_i' in F_p is
    Frobenius-fixed. So every P_i on the locus is (x_i, sqrt(delta)*y_i'),
    and the composite (x, y_i') to (x, sqrt(delta)*y_i') to
    (delta*x, delta^2*y_i') is an isomorphism defined over F_p(sqrt(delta))
    covering an isomorphism to E over the same field. Isomorphisms of
    elliptic curves are morphisms of group schemes and so commute with
    addition; that single fact is what licenses computing the signed sum on
    E_delta(F_p) and reading x(Q) off the result. If the identity fails
    empirically, the error is in the sign convention or in this isomorphism
    step, and the experiment localises which.

  assumptions:
    - >-
      p > 3, E non-singular, and a fixed non-residue delta chosen ONCE per p
      and shared across all j = m-1 constructions in a cell, so the twisted
      factor base is a stable precomputed table.
    - >-
      The m-1 specialised x_i are drawn with distinct x-values and f(x_i)
      nonzero for all i; the ramified locus is excluded.
    - >-
      The committed harness summation-polynomial and curve-arithmetic modules
      are correct as already committed, not re-verified here beyond the
      mandatory j = 0 fixture reproduction.
    - >-
      The parity law itself - that the fibre splits completely over F_p iff
      j = 0 or j = m-1 - is NOT re-tested here. It is already derived as a
      theorem in this lane and already measured by a completed, independently
      reviewed experiment at m in {3,4,5} with at least 20,000
      specializations per cell. This record CONSUMES that law to define its
      locus and adds nothing to it.
    - >-
      Toy scale binds: p at most 1009, m at most 5.

  proof_search_map:
    bottleneck: >-
      Whether the twist-arithmetic isomorphism actually reproduces the direct
      polynomial root x(Q) at every tested j = m-1 configuration. If it does,
      the j = m-1 branch is cheap by the SAME mechanism class as j = 0 - group
      arithmetic, no root-finding - completing the lane's cost identity into a
      two-branch law with one unified mechanism. If it does not, the sign
      convention or the isomorphism step has an error the hand derivation
      missed, and the "genuinely open, expensive" status originally predicted
      for j = m-1 must be re-examined on different grounds.
    baseline_embedding:
      parameter_slice: >-
        The lane's own committed m = 4, p = 211, j = 0 fixture - 193
        specialisations, 193/193 complete splitting, root sets exactly the
        signed sums - on the same curve (p = 211, a = 37, b = 57).
      reproduction_check: >-
        193/193 complete splitting reproduced cell for cell via the committed
        harness summation polynomial, before any j > 0 cell is interpreted.
        This is a HARD GATE and it is the ONLY role the parity census plays
        in this record; it is a baseline check, not a new measurement.
    observation_collision:
      observable: >-
        The set {x(sum eps_i P_i)} over sign classes, computed two ways: by
        factoring the specialised summation polynomial over F_p, and by group
        arithmetic on E_delta(F_p) followed by rescaling.
      distinct_preimage_search: >-
        FOUND, AND TWO CANDIDATE CONTROLS ARE REJECTED AS DEGENERATE BECAUSE
        OF IT. The compared object is a SET of x-values over all sign
        classes, and two natural "wrong" constructions leave that set FIXED
        by construction: (i) flipping the sign of y_i', which merely relabels
        eps_i in the signed-sum enumeration; and (ii) rebuilding BOTH the
        twist and the final rescaling with a different non-residue delta',
        which is an F_p-isomorphic twist since delta' = s^2 * delta gives
        X(R')/delta' = X(R)/delta. Neither could fail even against a wrong
        construction, so neither is admissible as a control. The surviving
        discriminating mutation is to rescale by delta' while building the
        twist with delta, which scales the x-set by delta/delta' not equal to
        1 and therefore CAN fail.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The j = m-1 signed-sum point Q, replaced by its quadratic-twist
          avatar R on E_delta(F_p), moving the computation from F_{p^2}
          arithmetic to F_p arithmetic on a different, standard curve.
        predicted_gain: >-
          Collapses the j = m-1 branch's per-attempt cost from genuine
          root-finding of a degree-2^{m-2} polynomial to m-1 group additions
          plus one multiplication - the SAME asymptotic order as the j = 0
          branch - extending the lane's cost identity rather than restating
          that the fibre splits.
    quantifier_order: >-
      FOR EVERY m in {4,5} and p in {211, 1009}, AND FOR EVERY sampled tuple
      (x_1,...,x_{m-1}) with all coordinates non-residue, the twist-computed
      x(Q) EQUALS the direct-root x(Q) as a SET over sign classes. This is a
      bounded universal over the tested cells, falsifiable at every one of
      them, and it is NOT an unbounded claim about every m or every p.
      NOT CLAIMED: anything about intermediate j, about the partial locus,
      about m >= 6, or about cryptographic scale.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the j = m-1 locus at the tested m and p, the signed sum admits
        an m-1-group-addition-plus-O(1) cost identity via quadratic-twist
        arithmetic, certified by exact computation rather than by
        statistics." NOT certifiable: anything about m >= 6, where the
        summation-polynomial construction cost grows; anything about
        intermediate j; anything about whether this changes any attempt
        count, which it does not; and nothing whatever about the ECDLP.
      nearby_object_control: >-
        THE NEAREST-NON-TWIST CURVE. Replace E_delta by a DIFFERENT
        non-singular curve E'' over F_p that is NOT the quadratic twist of E
        by delta - specifically E'': Y^2 = X^3 + A*delta^2*X + B*delta^3 + c
        for the smallest c >= 1 leaving it non-singular - and run the
        identical pipeline. The conclusion is KNOWN FALSE on E'' because the
        isomorphism does not exist there, so the agreement rate must collapse
        to near 0. An instrument that reports agreement on E'' is not testing
        the isomorphism and its main result is unsupported however clean.
    proof_obligations:
      - claim: "The m = 4, p = 211, j = 0 fixture reproduces cell for cell (193/193)."
        responsibility: baseline
      - claim: "delta^3 * f(X/delta) = X^3 + A*delta^2*X + B*delta^3, by direct expansion."
        responsibility: correctness
      - claim: "For delta a non-residue, Frob(sqrt(delta)) = -sqrt(delta), hence Frob(P_i) = -P_i on the j = m-1 locus."
        responsibility: correctness
      - claim: "The twist-computed x(Q) equals the direct-root x(Q) at every sampled j = m-1 tuple."
        responsibility: correctness
      - claim: >-
          The wrong-rescaling-constant mutant FAILS to reproduce x(Q) in the
          majority of trials, and the two degenerate mutants (sign flip;
          twist and rescaling both rebuilt with delta') are excluded in
          advance with the reason stated.
        responsibility: strictness
      - claim: "The nearest-non-twist curve E'' reproduces x(Q) at a rate near 0."
        responsibility: interface
      - claim: >-
          The one extra F_p multiplication and the second precomputed table
          are counted and reported SEPARATELY, never folded into "the same
          cost as j = 0".
        responsibility: scope

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null, and emphatically so. NO EXPONENT IS PROPOSED OR MOVED.
    If the identity holds, D_trial for the j = m-1 branch is pinned at m-1
    additions plus one multiplication plus one O(1) lookup - the same order
    as the j = 0 branch. Composed with the formulation's attempt count the
    total accounting is UNCHANGED: Theta(|F|^{m-1}) attempts, or
    Theta(|F|^{ceil(m/2)}) with a meet-in-the-middle join, strictly worse
    than Pollard rho's O(sqrt(N)) at every finite m. Memory rises by an
    additional |F| words for the twisted factor base beside the on-curve base
    already charged - a constant-factor 2x increase, not an exponent change,
    and disclosed rather than folded into "the same memory as j = 0".

  heuristic_assumptions:
    - id: HEUR-TWIST-1
      formal_statement: >-
        The quadratic-twist isomorphism (x, y') maps to (delta*x, delta^2*y')
        from (y')^2 = f(x)/delta onto E_delta: Y^2 = X^3 + A*delta^2*X +
        B*delta^3, covering the map to E via y = sqrt(delta)*y', commutes
        with the group law; hence the twist-computed x(Q) equals the
        direct-root x(Q) at every j = m-1 tuple.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL ASSUMPTION - it is a standard algebraic fact
        recorded as a heuristic here only because NO AGENT IN THIS PROGRAM
        HAS OPENED A SOURCE FOR IT. Any isomorphism of Weierstrass curves
        over a field extension is a morphism of group schemes and so commutes
        with addition (RECALLED, not fetched). The SPECIFIC algebraic
        identity used - the coefficient scaling delta^3*f(X/delta) = X^3 +
        A*delta^2*X + B*delta^3 - was independently re-derived by direct
        expansion in the source record rather than taken on any citation's
        authority, and it is re-derived symbolically again as a zero-compute
        gate in the paired contract.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-5b534b]
      falsification_condition: >-
        Any j = m-1 trial in which the twist-computed x(Q) differs from the
        direct-root x(Q). A single mismatch falsifies the cost identity and
        is reported as the record's HEADLINE NEGATIVE RESULT, not buried.
    - id: HEUR-TWIST-2
      formal_statement: >-
        The exact-match test has discriminating power: a construction that
        differs from the correct one in the final rescaling constant FAILS to
        reproduce x(Q) in the large majority of trials.
      random_model_justification: >-
        Rigorous in outline - rescaling X(R) by delta' rather than delta
        scales the whole x-set by the factor delta/delta' not equal to 1, so
        the returned set is generically different. THE HEURISTIC CONTENT is
        the word "generically": a coincidental fixed set is possible in
        principle at small p, which is why the control is measured over 50
        trials rather than argued, and why its measured failure rate is a
        required metric rather than an assumption.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-5b534b]
      falsification_condition: >-
        The wrong-rescaling mutant reproduces x(Q) at a rate near 1.000. The
        exact-match test then has no discriminating power and the main
        result, however clean, is UNSUPPORTED.
    - id: HEUR-TWIST-3
      formal_statement: >-
        For a sampled tuple with INTERMEDIATE j, no signed subset sum of the
        corresponding points lies in E[2]. This genericity condition is what
        makes "intermediate j never splits" hold literally rather than
        generically; under independent-uniform sampling it fails with
        probability of order tau/N, where tau is the order of the rational
        2-torsion.
      random_model_justification: >-
        The classical statement imitated is that a sum of independent uniform
        elements of a finite abelian group is uniform. THE GAP, stated
        against this record's interest: the sampling here draws
        x-coordinates by residue class and applies a deterministic sign
        convention rather than drawing points uniformly on E(F_p), so the
        leading-order tau/N estimate is imitative rather than exact for this
        construction.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-5b534b]
      falsification_condition: >-
        A curve with full rational 2-torsion (tau = 4) shows NO measurable
        elevation in intermediate-j splitting over the fixture curve at a
        sample size independently judged adequate to detect a tau/N-order
        effect. Alternatively, if both remain at the sampling-noise floor,
        the honest report is that toy-scale N is too large for the effect to
        be visible at this sample size - which must be stated rather than
        treated as confirmation of absence.

