# =============================================================================
# H-CSIDH-10eb0a — specified from IDEA-20261006-3cc090, read at
# ledger/proposals/IDEA-20261006-3cc090.yaml on branch
# design/session-b-20261009 (at origin/main). The file parses as YAML;
# it was written to the H-PAIR-79f258 shape and re-read in full after
# writing (this session's tool surface has no shell, so yaml.safe_load
# was not run here). No quote was changed; restatements add only the
# frozen implementation decisions recorded in EXP-CSIDH-7886f6 (the two
# enumerations E1 and E2 and the explicit reduction conditions).
# Question RQ-CSIDH-64343f, goal GOAL-CSIDH-001. The prediction under
# test is the idea's own: the nearest integer r to the 30-term truncation
# of the Dirichlet series for L(1, chi) at discriminant -83, enclosed
# in a rational interval of length strictly less than 1/2, equals the
# reduced-form count h. The concrete negative is that the instrument
# checks pass and r differs from h; an instrument_failure row is not an
# outcome of this hypothesis. A mismatch closes only this discriminant
# and this truncation length. Equality is not a proof of the
# class-number formula, and no security or cost claim is made. This
# session did not enumerate the forms and did not compute the
# truncation.
#
# DESIGN-TIME CORRECTION OF THE SOURCE IDEA'S CONTROL PREMISE. The
# source idea IDEA-20261006-3cc090 asks that discriminant -84 be
# labeled non-fundamental before the -83 row is scored. That premise
# is false: -84 = 4*(-21) with -21 congruent to 3 modulo 4 and
# squarefree, so -84 is the fundamental field discriminant of
# Q(sqrt(-21)) (conductor 1). The nearest genuinely non-fundamental
# discriminant is -92 = 4*(-23) with -23 congruent to 1 modulo 4, an
# order of conductor 2 in Q(sqrt(-23)). This hypothesis keeps the
# source idea's intent — the instrument must state fundamentality
# explicitly before any row is scored — by requiring the driver to
# label all of -83, -84, and -92 by one criterion routine, with -83
# and -84 labeled fundamental and -92 labeled non-fundamental, and
# any mislabel voiding the run. The claim row (r against h at -83)
# is unchanged.
# =============================================================================
hypothesis:
  id: H-CSIDH-10eb0a
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  source_idea_ids:
    - IDEA-20261006-3cc090
  added: '2026-10-09'
  status: specified
  proposed_by: coordinator
  title: >-
    The nearest integer to a 30-term class-number truncation equals
    the form count at discriminant -83
  statement: >-
    Let p = 83 and let D = -83. The discriminant is fundamental: 83 is
    prime and 83 is congruent to 3 modulo 4. Let h be the number of
    reduced positive-definite binary quadratic forms [a, b, c] with
    b^2 - 4ac = -83, under the standard reduction conditions |b| <= a
    <= c and b >= 0 when |b| = a or a = c, each form counted once. Let
    chi(n) be the Kronecker symbol (-83 / n) for n from 1 to 30, and
    let L30 be the sum of chi(n)/n for n from 1 to 30, an exact
    rational. Let S be (sqrt(83) / pi) times L30, where pi is the
    circle constant, not a Frobenius endomorphism. Replace sqrt(83)
    and pi by rational bounds so that S is enclosed in a rational
    interval of length strictly less than 1/2, with the sign of L30
    handled correctly when the enclosure is multiplied. If that
    interval contains two integers, or meets an integer plus 1/2, the
    row is instrument_failure and no nearest integer is scored.
    Otherwise let r be the unique integer nearest to every point of the
    interval. The prediction taken from IDEA-20261006-3cc090 is that
    the instrument checks pass and r = h. The concrete negative is
    that the instrument checks pass and r is different from h; an
    instrument_failure row is not an outcome of this hypothesis. The
    test boundary is one discriminant (-83), one truncation length (30
    terms), and one form-count convention. A mismatch closes only this
    discriminant and this truncation length; it does not refute the
    infinite sum. Equality is not a proof of the class-number formula.
    This is not an invariant-factor count, it is not the congruence of
    a Frobenius endomorphism with 1 modulo a prime, and it states no
    security level and no cost claim.
  mechanism: >-
    The tracked object is the class number, read as a form count,
    against one partial sum of the Dirichlet series for L(1, chi).
    The representation is the set of reduced positive-definite
    binary quadratic forms of discriminant -83. The operation set
    Sigma is enumeration of that set, not composition and not
    elliptic translation. Class: coordinate-dependent, because h
    is a property of the whole set and is constant on forms.
    Lossy-projection test against Sigma: the forms are discarded
    and the integer h is kept. Many sets share a cardinality, so
    the projection is lossy. Two outcomes are separated before any
    run. r = h says this 30-term truncation, under the declared
    rational bounds, already names the form count. r different
    from h says the truncation has not settled. The question asks
    for a certified class-group order at a small CSIDH-like
    discriminant. The order is the product of the invariant
    factors, which a different record ignores. This record scores
    the order and ignores the factors.
  assumptions:
    - >-
      Discriminant -83 is fundamental (83 is prime and 83 is
      congruent to 3 modulo 4), and the number of reduced
      positive-definite forms is the class number of
      Z[(1+sqrt(-83))/2].
    - >-
      The form count h is certified only when two independent
      enumerations agree: E1, a direct nested-loop enumeration over
      a, b, c ranges with the reduction inequalities, and E2, a
      second enumeration with a different loop structure and
      set-based deduplication. A disagreement is an instrument
      failure that voids the run, never a scored row.
    - >-
      The weight w in the recalled formula is 2 at this
      discriminant, so the factor in front of L(1, chi) is
      sqrt(p) / pi. If a later primary read shows a different
      weight, the row is instrument_failure rather than a mismatch.
    - >-
      The nearest integer is scored only when the rational interval
      has length strictly less than 1/2 and contains exactly one
      integer. A wider interval, a two-integer interval, or a
      half-integer boundary is instrument_failure, not a mismatch.
    - >-
      No quantum oracle and no security level enter the claim.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a finite comparison of one truncation with one form
      count. It does not propose a theorem, a bound on a quantum
      cost, a certificate beyond the two form enumerations and the
      rational interval, a reduction, or a closure of the
      class-number formula.
  predictions:
    - metric: >-
        absolute difference between the nearest integer r and the form
        count h
      direction: lower
      minimum_effect: equal to 0
  test_boundary:
    instances:
      - >-
        discriminant -83 with the 30-term truncation of the Dirichlet
        series for L(1, chi)
    parameters:
      p: 83
      discriminant: -83
      truncation_length: 30
      nonfundamental_control: -92
      secondary_fundamental_control: -84
      certificate: two enumerations agree
    implementation: experiments/EXP-CSIDH-7886f6/implementation/driver.py
    budget:
      maximum_runs: 1
  falsification_conditions:
    - >-
      The interval meets the length bound, r is scored, and r is
      different from h. That difference is the negative observation.
    - >-
      The two form enumerations disagree and the disagreed h is then
      used. That is an invalid instrument, not this falsification.
    - >-
      Any fundamentality label among -83, -84, -92 is wrong (-83
      and -84 must label fundamental, -92 non-fundamental; see the
      design-time correction in the header). That is an invalid
      instrument, not this falsification.
  interpretation_limits:
    - >-
      Equality at 30 terms is not a proof of the class-number formula
      and is not a CSIDH-512 class number.
    - >-
      A mismatch closes only this discriminant and this truncation
      length. It does not refute the infinite sum.
    - >-
      The circle constant in the formula is not the Frobenius
      endomorphism, and the claim is not a congruence modulo the
      group order.
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        The tail of L(1, chi) after 30 terms, multiplied by
        sqrt(83) / pi, has absolute value strictly less than 1/2, so
        the nearest integer to the truncation equals the class number.
        The tail bound is the heuristic. The form count is the
        measurement.
      random_model_justification: >-
        The infinite-sum identity is recalled and was not opened. No
        theorem opened in this session bounds the tail at 30 terms
        for this character. KN-LIT-508, as read, estimates how
        often a prime misses the class number, which is a different
        statistic.
      supporting_results: []
      validation_experiment_ids:
        - EXP-CSIDH-7886f6
      falsification_condition: >-
        The instrument checks pass and r is different from h. The
        tail bound is then false at this discriminant and this
        truncation length. An instrument_failure row is not this
        falsification.
  structural_ingredients:
    - description: >-
        The note estimates a count of discriminants whose class number
        is not divisible by a fixed prime l. It does not evaluate a
        30-term truncation at discriminant -83.
      citation: KN-LIT-508
      provenance: kb
      verified_by: >-
        this design session (design/session-b-20261009) opened
        knowledge/literature/KN-LIT-508.md on 2026-10-09; the file
        relays the paper's abstract (arXiv 1612.04443) and marks the
        paper itself as not independently verified.
      role: adjacent statistic, not the truncation claim
    - description: >-
        For the fundamental discriminant -p with p congruent to 3
        mod 4 and p greater than 3, the class number equals
        (sqrt(p) / pi) times L(1, chi), with w = 2. Not opened as a
        primary text in this session. The truncation at 30 terms is
        not that identity.
      citation: >-
        Dirichlet class-number formula for imaginary quadratic fields
      provenance: recalled
      verified_by: null
      role: >-
        the infinite-sum identity the truncation approximates, a
        pointer for the reviewer, not support
    - description: >-
        A generic algorithm on a prime-order group needs Omega of the
        square root of the group order. This form count is not a
        generic discrete logarithm.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        this design session (design/session-b-20261009) opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml on
        2026-10-09.
      role: unchanged generic exponent, different problem
  status_note: >-
    Specified and paired with EXP-CSIDH-7886f6, whose status is
    review_required. No run has been launched. Neither h nor the
    truncation was computed in this session.
