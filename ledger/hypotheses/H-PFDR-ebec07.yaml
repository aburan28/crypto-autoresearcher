hypothesis:
  id: H-PFDR-ebec07
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260811-e1ae92
  batch_id: BATCH-2c45e2
  statement: >-
    THE CHEAP SYMMETRY GROUP OF THE x-LINE IS TWICE THE AUTOMORPHISM GROUP, AND
    EXACTLY HALF OF IT SURVIVES TO A PRIME-ORDER SUBGROUP - BUT THE ONLY PLACE THAT
    CLAIM CAN BE TESTED IS THE EVEN-COFACTOR CASE, WHICH THE STANDARD SETTING
    EXCLUDES.
    (S1 THE GROUP) Let the degree-two quotient of the curve by inversion branch over
    the four-point set consisting of the three roots of the cubic and the point at
    infinity. The Mobius transformations preserving that set inject into the
    symmetric group on four letters, always contain the Klein four-group, and have
    order 4, 8 or 12 exactly at generic, harmonic and equianharmonic cross-ratio -
    which is the classical trichotomy that DEFINES the j-invariant, at generic j, at
    1728 and at 0. Structurally the group is the two-torsion translations extended by
    the automorphisms modulo inversion, of order twice the automorphism group.
    (S2 THE OBSTRUCTIONS, AND WHICH ONE CAN ACTUALLY BE MEASURED) Two independent
    reasons prevent the extra factor from acting on a prime-order subgroup.
    IRRATIONALITY - translation by a two-torsion point is rational only if the group
    order is even, so with prime order there is no rational non-identity translation
    at all. COSET NON-PRESERVATION - even when the translation IS rational, it maps
    the subgroup to a disjoint coset, since a prime-order subgroup of odd order
    contains no element of order two. ON A PRIME-ORDER CURVE THE TWO ARE COMPLETELY
    CONFOUNDED and neither can be measured separately; only on a curve with rational
    two-torsion does the second stand alone, and that is the ONLY arm that tests
    anything.
    (S3 THE CEILING, DERIVED RATHER THAN QUOTED) The would-be walk ceiling from the
    full x-line symmetry group is the square root of twice the automorphism group,
    at most the square root of 12; the actual ceiling on the prime-order subgroup is
    the square root of the automorphism group, at most the square root of 6. The gap
    is a factor of the square root of 2, and it is closed by S2 rather than assumed.
  mechanism: >-
    The x-coordinate map is the degree-two quotient by inversion, so any Mobius
    transformation of the x-line that lifts to a curve automorphism must preserve the
    branch locus. A Mobius map is determined by the images of three points, so the
    stabiliser of a four-point set injects into the symmetric group on four letters
    and is finite of order dividing 24. The Klein four-group of double transpositions
    is always realised, by the translations by two-torsion points, each of which IS a
    Mobius map because the x-coordinate of a sum with a two-torsion point is a
    degree-one rational function of the x-coordinate - and is not a function of the
    x-coordinate at all for a non-two-torsion point, which is why the group is the
    two-torsion and not the whole curve. The extra automorphisms at the two special
    j-values supply the enlargement to 8 and 12. On the prime-order subgroup the
    translations leave the state space on the first application, so a walk whose state
    space is that subgroup cannot use them: the map is cheap, of degree one, possibly
    rational, and simply not an operation on the object the problem lives in.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      ON THE STANDARD SETTING - PRIME GROUP ORDER, COFACTOR ONE - EVERY PRE-REGISTERED
      STATISTIC IN THE SOURCE IDEA HAS A BAND OF WIDTH ZERO. There the group order is
      odd, so there is no rational two-torsion, the rational branch-locus stabiliser
      is exactly the automorphisms modulo inversion, and the subgroup preserving the
      x-image of the prime-order subgroup is the same set - so the two quantities the
      idea compares are EQUAL BY CONSTRUCTION and their ratio is 1 with no alternative
      attainable. The idea itself names this as a confounder; TASK-20260904-5423ad
      records it as a band failure, because a design run only on cofactor-one curves
      would report agreement with a prediction that could not have disagreed.
    change_made: >-
      THE EVEN-COFACTOR ARM IS PROMOTED FROM A SUPPORTING ARM TO A BLOCKING,
      MANDATORY PRIMARY MEASUREMENT, and is required to include curves with FULL
      rational two-torsion so that the rational stabiliser is four times the surviving
      subgroup rather than twice. On such a curve the ratio of the rational
      stabiliser's order to the order of the subgroup preserving the x-image is
      predicted to be exactly 4 under S2 and exactly 1 if coset non-preservation
      fails, and there are THREE non-trivial rational translations, each of which is an
      independent chance to falsify. Both predicted values are exact small integers
      with no overlap and both are attainable, so the band is non-degenerate. The
      cofactor-one arm is retained as an instrument check and is labelled as one.
    alternative_hypothesis_range: >-
      Under S2 the even-cofactor ratio is exactly 4 for a curve with full rational
      two-torsion and exactly 2 for one with a single rational two-torsion point.
      Under the alternative that some rational translation preserves the x-image, the
      ratio is 1 or 2 where 4 is predicted, the usable cheap symmetry group on the
      subgroup is strictly larger than the automorphisms modulo inversion, the walk
      ceiling rises to the square root of the automorphism group times the rational
      two-torsion order, and the pre-registered escalation applies. The statistic is
      an exact set equality on an enumerable set, so there is no statistical power
      question and no threshold to tune.
  assumptions:
  - >-
    The characteristic is greater than 3 and the curve is ordinary. In characteristic
    3 the two special j-values coincide and in characteristic 2 the automorphism
    structure differs entirely; nothing here applies there, and that is a hypothesis
    rather than a convenience.
  - >-
    A Mobius transformation fixing three points is the identity, so the branch-locus
    stabiliser injects into the symmetric group on four letters and its order divides
    24. This is what makes the enumeration by three-point determination exhaustive.
  - >-
    For a two-torsion point the x-coordinate of the translated point is a degree-one
    rational function of the x-coordinate; for a non-two-torsion point it is not a
    function of the x-coordinate at all. Verified symbolically before the enumeration
    rather than assumed.
  - >-
    The subgroup has odd prime order, so it contains no element of order two and is
    disjoint from its translate. This is the elementary content of coset
    non-preservation.
  - >-
    Toy scale for the empirical arm, since the subgroup must be enumerated - primes up
    to about 2 to the 20. The claim tested is an exact set equality, so the test is
    exhaustive per curve and no statistical power question arises.
  proof_search_map:
    bottleneck: >-
      The lane treats the automorphism group as the complete supply of cheap symmetry
      and never asks what the largest cheap symmetry group of the x-line is. That
      framing makes the ceiling look like a fact about the curve when it is a fact
      about which symmetries survive to the prime-order subgroup, and it leaves the
      generic curve looking symmetry-free when its x-line carries a Klein four-group.
    baseline_embedding:
      parameter_slice: >-
        The generic curve with j not special and prime group order. There the
        stabiliser over the splitting field is 4, its rational part is 1, the part
        preserving the x-image is 1, and the ceiling is the square root of 2 - which is
        exactly the negation factor already inside this program's baseline convention.
      reproduction_check: >-
        A frozen fixture on which the run must report stabiliser order 4 over the
        splitting field, 1 over the base field, 1 preserving the x-image, and must
        independently confirm the automorphism order 2 from j. Any deviation halts the
        line before any special-j curve is touched.
    observation_collision:
      observable: >-
        The pair consisting of the stabiliser order and the order of the subgroup
        preserving the x-image of the prime-order subgroup.
      distinct_preimage_search: >-
        THE FIRST COMPONENT COLLIDES BY DESIGN AND THE RECORD SAYS SO - all curves with
        the same j have the same stabiliser, and there are about twice the prime many
        curves per j once twists are counted, so the observable is massively
        non-identifying for the curve. That is the content rather than a defect, since
        the claim is precisely that the first component is a function of j alone. THE
        DANGEROUS COLLISION IS IN THE SECOND COMPONENT - two curves with the same j and
        the same stabiliser but different counts of symmetries preserving the x-image.
        The claim says this cannot happen when the order is an odd prime, so finding it
        refutes the claim directly, and the search is free because it is the
        even-cofactor arm.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move from the automorphism group of the curve to the automorphism group of the
        x-line preserving the branch locus, where the hypothesis becomes an exact group
        order and a set equality rather than a cost comparison.
      predicted_gain: >-
        Turns a recorded ceiling constant into a derived one with an explicit account
        of the factor it never had, and exposes the generic curve's Klein four-group,
        which the automorphism-only framing renders invisible. NO COST GAIN.
    - transform: observable_fiber
      proposed_object: >-
        Hold j fixed and vary the two-torsion rationality, that is the cofactor parity.
        The distinguishing invariant is the rational two-torsion order, and the claim
        is that it changes the rational symmetry group but NOT the subgroup preserving
        the x-image.
      predicted_gain: >-
        SEPARATES THE TWO OBSTRUCTIONS EMPIRICALLY. Without it they are confounded and
        a null could be attributed to either. This is the whole reason the
        even-cofactor arm is mandatory.
    quantifier_order: >-
      CLAIMED IN THIS ORDER - FOR ALL ordinary curves over prime fields with
      characteristic greater than 3 and FOR ALL subgroups of odd prime order, the set of
      branch-locus stabiliser elements preserving the x-image of that subgroup is
      EXACTLY the image of the automorphisms modulo inversion, of order 1, 2 or 3. THE
      WEAKER READING EXPLICITLY NOT CLAIMED - that for SOME curves the translations fail
      to preserve the x-image, which would be a curiosity. THE STRONGER READING
      EXPLICITLY NOT CLAIMED - anything about composite-order subgroups, about the full
      group of rational points, or about any set other than the x-image of the subgroup.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the Mobius group induced by curve automorphisms has order twice the
        automorphism group, in 4, 8 or 12, determined by j alone; that its rational part
        is the rational two-torsion order times half the automorphism order; and that
        the part preserving the x-image of an odd-prime-order subgroup is exactly half
        the automorphism order, so the walk ceiling is the square root of the
        automorphism order and not of twice it. IT CAN NEVER CERTIFY anything about
        non-Mobius maps of the x-line, anything about mechanisms operating on the full
        group of rational points rather than on the subgroup, anything over extension
        fields, anything in characteristic 2 or 3, and nothing whatsoever about the
        hardness of the problem.
      nearby_object_control: >-
        A CURVE WITH EVEN COFACTOR AND FULL RATIONAL TWO-TORSION, where irrationality
        FAILS and only coset non-preservation stands. The method must report a rational
        stabiliser four times the surviving subgroup there. A method that reports the
        same two numbers on that curve as on a prime-order curve has NOT separated the
        two obstructions and has not identified the load-bearing structure, which is
        coset preservation rather than rationality.
    proof_obligations:
    - claim: 'The stabiliser injects into the symmetric group on four letters and always contains the Klein four-group.'
      responsibility: correctness
    - claim: 'The stabiliser order is 4, 8 or 12 at generic, harmonic and equianharmonic cross-ratio.'
      responsibility: correctness
    - claim: 'The stabiliser is the two-torsion extended by the automorphisms modulo inversion.'
      responsibility: correctness
    - claim: 'Translation by a two-torsion point is a Mobius map of the x-line and translation by any other point is not a function of the x-coordinate.'
      responsibility: correctness
    - claim: 'For odd prime order the subgroup and its translate are disjoint, so no non-trivial translation preserves the x-image.'
      responsibility: strictness
    - claim: 'The generic slice reproduces stabiliser 4, rational part 1, usable subgroup 1.'
      responsibility: baseline
    - claim: 'The enumeration by three-point determination is complete.'
      responsibility: interface
    - claim: 'Nothing is claimed for the full group of rational points, for extension fields, or for characteristic at most 3.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL, AND THE RECORD CANNOT MOVE AN EXPONENT BY CONSTRUCTION, because the group it
    studies is finite of order at most 12 and a birthday saving of the square root of 12
    is a constant. The relevant numbers are a would-be ceiling of at most the square root
    of 12 and an actual ceiling of at most the square root of 6; against a
    negation-inclusive baseline convention the actual extra discount is at most the
    square root of 3.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      NO PROBABILISTIC HEURISTIC IS USED ANYWHERE, and this entry exists to say so
      explicitly rather than to leave the block empty. Every quantity is an exact finite
      invariant - a subgroup order of the symmetric group on four letters, a finite set
      equality, and the elementary fact that an odd-order group contains no involution.
      The only assumption with content is OPERATIONAL - that the enumeration of
      candidate Mobius maps is complete.
    random_model_justification: >-
      NOT APPLICABLE, AND RIGOROUS RATHER THAN HEURISTIC. A Mobius map is determined by
      the images of three points, so ranging over the at most 24 injective assignments
      of three chosen branch points into the branch set, constructing the unique map for
      each and testing whether it preserves the set, enumerates the stabiliser
      exhaustively. No classical distribution theorem is imitated because none applies.
    supporting_results: []
    supporting_results_note: >-
      EMPTY AND APPROPRIATELY SO. The mathematics is classical and is NOT claimed as new;
      the relevant textbook statements are recalled and unopened by this program, and
      the enumeration validates itself by producing the same integer through two
      independent routes on every curve.
    validation_experiment_ids:
    - EXP-PFDR-43cd9f
    falsification_condition: >-
      Any curve on which the enumerated stabiliser order over the splitting field is not
      twice the automorphism order computed independently from j, or on which the
      cross-ratio orbit classification disagrees with j. Either is an implementation
      defect and the run is INVALID.
  structural_ingredients:
  - description: >-
      The generic, harmonic and equianharmonic trichotomy of a four-point set on the
      projective line, the identification of the harmonic and equianharmonic cases with
      the two special j-values, the structure of the automorphism group of a genus-one
      curve as translations extended by the automorphisms fixing the origin, and the
      explicit degree-one form of two-torsion translation on the x-line.
    citation: >-
      Standard elliptic-curve and classical-invariant-theory texts. CITED FROM MEMORY
      AND NOT RE-VERIFIED; no external source was reachable to the filing session and
      none was opened by this program.
    provenance: recalled
    verified_by: null
    role: >-
      supplies S1; every one of these is re-derived or re-enumerated by the experiment
      rather than relied on, which is why the recall is admissible here
  - description: >-
      This program's pause condition requiring that work stop for an independent
      adversarial review before any record states an excess over the
      automorphism-discounted baseline.
    citation: 'GOAL-ENDO-001 pause condition P3'
    provenance: internal
    verified_by: >-
      TASK-20260904-5423ad read ledger/goals/GOAL-ENDO-001/goal.yaml and confirms P3
      reads that any candidate appearing to exceed the automorphism-discounted rho
      baseline pauses work for an independent review-adversarial session before any
      record states the excess, and for review-breakthrough at maximum effort before any
      record calls it a break.
    role: >-
      the pre-registered handling of the one outcome of this hypothesis that could raise
      a constant
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      order of the branch-locus stabiliser over the splitting field, an integer, by
      j-family
    direction: different
    minimum_effect: >-
      EXACTLY 4 at generic j, 8 at the harmonic value and 12 at the equianharmonic
      value, on every curve. Any other value refutes the trichotomy or the enumeration.
  - metric: >-
      ratio of the order of the rational branch-locus stabiliser to the order of the
      subgroup preserving the x-image, on curves with FULL rational two-torsion, a
      dimensionless integer ratio
    direction: higher
    minimum_effect: >-
      EXACTLY 4. THIS IS THE DECISIVE ARM AND THE ONLY ONE THAT TESTS COSET
      NON-PRESERVATION IN ISOLATION. A ratio of 1 or 2 where 4 is predicted refutes coset
      non-preservation, raises the ceiling to the square root of the automorphism order
      times the rational two-torsion order, and fires the pre-registered escalation.
  - metric: >-
      order of the subgroup preserving the x-image, an integer, on curves with even
      cofactor
    direction: lower
    minimum_effect: >-
      EXACTLY half the automorphism order, that is 1, 2 or 3, INDEPENDENT of the
      rational two-torsion order. Any larger value is the same refutation as above.
  - metric: >-
      order of the rational branch-locus stabiliser as a function of the rational
      two-torsion order, across the cofactor sweep
    direction: higher
    minimum_effect: >-
      GROWING by exactly the rational two-torsion order while the preserving subgroup
      stays exactly half the automorphism order. The predicted shape is one curve rising
      and one flat. If BOTH rise, coset non-preservation is false; if NEITHER rises, the
      rationality computation is broken. Stating the predicted shape of both curves in
      advance is what makes this a test.
  - metric: >-
      cross-ratio orbit classification against j computed from the curve equation, as an
      agreement rate
    direction: different
    minimum_effect: >-
      Agreement on 100 percent of curves. Disagreement is an implementation defect and
      voids the run.
  test_boundary:
    instances:
    - >-
      Toy ordinary prime-field curves covering all three j-families at primes up to
      about 2 to the 20, with the prime-order subgroup enumerable.
    - >-
      MANDATORY - curves with EVEN cofactor and FULL rational two-torsion, at each
      j-family where such curves exist, with a large odd prime-order subgroup.
    - >-
      A cofactor sweep with rational two-torsion order 1, 2 and 4 at each j-family.
    - >-
      The quadratic twist of each curve, which shares its j.
    parameters:
      characteristic_scope: 'greater than 3, ordinary curves only'
      enumeration_bound: 'at most 24 candidate Mobius maps per curve, by three-point determination'
      subgroup_enumeration: 'exhaustive, so the test is a set equality with no sampling'
    implementation: >-
      Exact finite-field arithmetic with the point at infinity handled EXPLICITLY as a
      branch point, a projective representation of the branch locus, and two independent
      routes to the automorphism order - by enumeration and from j.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 1
      maximum_memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
  - >-
    F1 ZERO COMPUTE, PRIMARY. Coset non-preservation is wrong - the translate of the
    subgroup meets the subgroup for some two-torsion point and odd prime order. This is
    elementary group theory and its failure would mean the setup is mis-stated; the
    record is withdrawn by a superseding proposal.
  - >-
    F2 THE DECISIVE EMPIRICAL FALSIFIER. On a curve with rational two-torsion, some
    non-trivial rational stabiliser element preserves the x-image of the subgroup. Then
    the usable cheap symmetry group is larger than the automorphisms modulo inversion,
    the ceiling rises, and GOAL-ENDO-001 pause condition P3 fires - work stops for an
    independent review-adversarial session BEFORE any record states the excess. This is
    the only outcome that could change a constant and its handling is pre-registered.
  - >-
    F3. The stabiliser order over the splitting field is not twice the automorphism
    order on some curve, or the cross-ratio classification disagrees with j.
    Implementation defect; run INVALID.
  - >-
    F4. The random four-point null reports enlarged stabilisers at an appreciable rate -
    the enumeration is finding structure that is not there and every number is void.
  - >-
    F5 THE MAIN NEGATIVE, AND THE INTENDED DELIVERABLE. Every prediction holds. The lane
    acquires a derived rather than quoted ceiling, an explicit accounting of the factor
    it never had, and a third obstruction class - coset non-preservation - independent of
    the scalar argument and of the non-homomorphism argument. It must be recorded with
    the surviving open item named, namely the quotient over the full group of rational
    points for table-based mechanisms, together with the identity showing that summing a
    relation over translated points shifts the sum by a multiple of the translation and
    so destroys relation validity.
  interpretation_limits:
  - >-
    THE MATHEMATICS IS CLASSICAL AND IS NOT CLAIMED AS NEW. What may be new to this
    program is the use - assembling it into a ceiling argument, naming coset
    non-preservation as an obstruction distinct from the two the lane already has, and
    delivering the accounting table.
  - >-
    NO ATTACK, NO EXPONENT, NO SPEEDUP. The entire content is worth at most a factor of
    the square root of 2 even in the counterfactual where coset non-preservation failed,
    which bounds the stakes and is stated so that nobody reads the record as promising
    more.
  - >-
    THE COFACTOR-ONE ARM CANNOT TEST ANYTHING AND IS LABELLED AS AN INSTRUMENT CHECK.
    There the two obstructions are confounded and the two compared quantities are equal
    by construction. Any run using only cofactor-one curves would report agreement with a
    prediction that could not have disagreed.
  - >-
    SCOPED TO PRIME FIELDS WITH CHARACTERISTIC GREATER THAN 3, ORDINARY CURVES, AND
    SUBGROUPS OF ODD PRIME ORDER. Extension fields, where Frobenius supplies further
    cheap maps, characteristic 2 and 3, supersingular curves, composite-order subgroups
    and higher genus are outside every argument here.
  - >-
    THE FACTOR IS CLOSED FOR THE SUBGROUP AND EXPLICITLY NOT CLOSED FOR THE FULL GROUP
    OF RATIONAL POINTS. Table-based and factor-base mechanisms over the full group
    survive, and the identity that makes them unpromising - that summing a relation over
    translated points shifts the sum by a multiple of the translation - is attached so
    the next session starts from the obstruction rather than from the idea.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The empirical arm requires
    enumerating the prime-order subgroup, so it is bounded at about 2 to the 20 by
    memory. That is not a real limitation for the CLAIM, because coset non-preservation
    is an elementary group-theoretic fact that does not depend on scale - but the
    IMPLEMENTATION-completeness of the enumeration is verified only at those sizes, and
    the record does not claim to have verified an implementation at any larger size.
  - >-
    THIS RECORD MEASURES NO COST. It counts group elements. A larger usable group would
    raise a ceiling, and a ceiling is not a measurement.
