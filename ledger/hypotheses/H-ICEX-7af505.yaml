hypothesis:
  id: H-ICEX-7af505
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260808-f4edc6
  title: >-
    THE WINDOWED DECOMPOSITION COUNT IS A FUNCTION OF THE DISCRETE-LOG MULTISET
    ALONE, SO ITS MEAN IS A PROOF AND ITS COVERAGE AND VARIANCE ARE A TEST OF ONE
    THING ONLY - whether an x-coordinate window maps to a PSEUDORANDOM subset of
    Z/N - with a planted true dlog interval as the control, whose predicted
    coverage is about 2700 times smaller than the Poisson value at the design cell,
    and a separate lattice-reach arm whose scrambled null must fail at every B
  statement: >-
    (A) THE EXACT IDENTITY, WHICH IS A PROOF AND NOT AN ARM. KN-FIND-007 states
    VERBATIM that for a factor base D of B distinct elements of a group of order N
    and any m, the number of size-m multisets summing to a target r, written
    c_D(r), satisfies sum over r of c_D(r) = binomial(B+m-1, m) exactly, so the
    mean per-target yield is binomial(B+m-1, m)/N FOR EVERY BASE OF SIZE B,
    INDEPENDENTLY OF HOW THE BASE IS CHOSEN. THE MEAN IS THEREFORE NOT AN
    OBSERVABLE OF THIS EXPERIMENT- any measured deviation from it beyond
    floating-point error is a harness bug and nothing else, and NO OUTCOME ON THE
    MEAN IS AN ELLIPTIC-CURVE STATEMENT. It is recorded here as a proof, with the
    consequence that the source prediction -mean equals the identity- is a
    construction check rather than evidence.
    (B) WHAT IS ACTUALLY FREE, AND WHY IT IS STILL NOT A CURVE STATEMENT BY
    ITSELF. c_D(r) depends only on the image of D under the discrete logarithm,
    that is on a SUBSET OF Z/N. Coverage - the fraction of targets with at least
    one decomposition - and the dispersion Var(count)/mean are therefore also
    functions of that subset alone and are computable with no curve present. What
    the curve supplies is ONE THING- the map from an x-coordinate window to its
    dlog subset. SO THE ONLY ELLIPTIC CONTENT AVAILABLE IN THE YIELD HALF IS
    WHETHER AN x-COORDINATE INTERVAL, ARITHMETIC PROGRESSION OR RANDOM SUBSET
    MAPS TO A SUBSET OF Z/N THAT BEHAVES LIKE A UNIFORM RANDOM ONE. That is the
    claim, stated exactly, and it is much narrower than the source framing.
    (C) THE PRE-REGISTERED PREDICTION. For every window type - x-interval,
    x-arithmetic-progression, random x-subset - the coverage matches
    1 - exp(-mu) with mu = binomial(B+m-1, m)/N to within Poisson error, and
    Var(count)/mean lies in [0.85, 1.20], indistinguishable from a UNIFORM RANDOM
    SUBSET OF Z/N of the same size. PRE-STATED CONSEQUENCE, FROZEN HERE- IF THE
    WINDOW ARMS ARE INDISTINGUISHABLE FROM THE CURVE-FREE RANDOM-Z/N NULL, NOTHING
    IN THE YIELD HALF MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE
    ECDLP; the finding is that x-coordinate windows give pseudorandom dlog
    subsets.
    (D) THE CONTROL WITH DEMONSTRATED DYNAMIC RANGE, COMPUTED HERE. The planted
    defect is a TRUE INTERVAL IN DLOG SPACE - the factor base taken as the
    multiples 0 through B-1 of P - whose statistics are known in closed form. At
    the design cell p about 2^22, N about 2^22, B = 2^8, m = 3-
        mu = binomial(258,3)/2^22 = 2829056/4194304 = 0.6745,
        Poisson coverage = 1 - exp(-0.6745) = 0.4906,
        dlog-interval coverage = (3B-2)/N = 766/4194304 = 1.83e-4.
    THE RATIO IS ABOUT 2690. The dispersion for the planted arm is enormously
    overdispersed while the Poisson arms sit at 1. SO THE CONTROL HAS ABOUT THREE
    ORDERS OF MAGNITUDE OF DEMONSTRATED DYNAMIC RANGE and must fire at that
    magnitude, rather than merely returning a number.
    (E) THE REACH HALF, WHICH IS GENUINELY CURVE-DEPENDENT. The largest B at which
    a small-root solver still returns a PLANTED windowed decomposition is a
    property of the Semaev system and the shift lattice, not of the dlog multiset.
    Its artifact tell is the SCRAMBLED-WINDOW NULL, which must fail at every B, and
    its decay control is the scramble fraction swept from 0 to 1, which must drive
    the reach monotonically to zero.
    (F) WHAT THIS DOES NOT DO. It is an instrument ledger. It proposes no attack,
    moves no exponent, and licenses no claim about any curve above the tested p.
  mechanism: >-
    THE OBJECT AND ITS PROJECTION, STATED WITH THE LOSS NAMED. The yield half
    projects (curve, window) onto the multiset of counts c_D(r) over targets r,
    and thence onto three numbers- mean, coverage, dispersion. The mean is fixed by
    an identity, so the projection retains exactly two free numbers. What is
    discarded is the entire additive structure of the dlog subset except its
    representation function summary; what is retained is compatible with the only
    operation the pipeline performs, namely counting size-m multisets, because
    that operation is a function of the subset alone.
    WHY THE PLANTED DLOG INTERVAL IS THE RIGHT DEFECT. The whole question is
    whether an x-window is additively structured in the group. A TRUE dlog
    interval is maximally additively structured- its m-fold sumset is an interval
    of size 3B-2 rather than the roughly binomial(B+2,3) distinct values a random
    subset produces - so it exhibits, at a known magnitude, exactly the failure
    the x-window arms are being tested for. A control that returns a number proves
    nothing; this one has a closed-form answer three orders of magnitude away from
    the null.
    WHY PLANTING IS NECESSARY IN THE REACH HALF. A solver failure on a natural
    instance is ambiguous between -no decomposition existed- and -the solver could
    not find it-. Choosing m windowed points and setting the target to their sum
    removes that ambiguity by construction, at the cost of introducing HEUR-WIN-2,
    that planted decompositions are distributed like natural ones, which is
    checked directly at the smallest cell against exhaustive enumeration.
    WHY THE DECAY CONTROL IS THE ARTIFACT TELL. Scrambling the window destroys
    whatever structure the reach depends on. A reach that does not decay as the
    scramble fraction rises is the canonical artifact signature- a quantity that
    fails to decay when the parameter meant to destroy it increases.
  assumptions:
    - >-
      Curves are generated with a prime-order subgroup of known order, and window
      arms are matched on MEASURED size after the x-coordinate 2-to-1 fibre and
      2-torsion effects are accounted for, not on nominal size.
    - >-
      Exact enumeration is used wherever B^m is at most about 2^30, which at m = 3
      allows B up to 2^10 and at m = 4 up to 2^7. Beyond that the count is not
      enumerated and no count is reported.
    - >-
      The solver configuration - reduction algorithm, block size, shift set - is
      PINNED IN THE CONTRACT before execution, because the reach is a property of
      that configuration and of nothing else.
    - >-
      UNITS. Counts are integers; coverage is a probability; dispersion is a
      dimensionless ratio of a variance to a mean of the same quantity; the reach
      epsilon-hat is log_p(B^m) and is dimensionless. NO WALL-CLOCK QUANTITY
      ENTERS ANY REPORTED RATIO.
    - >-
      Solver failures caused by numerical precision or by root extraction are
      CLASSIFIED SEPARATELY from failures caused by the bound; pooling them
      under-reports the reach and is forbidden.
  proof_search_map:
    not_applicable_reason: >-
      An instrument ledger. The one exact result it uses - the KN-FIND-007 mean
      identity - is already committed and proved, and is used here to REMOVE an arm
      rather than to claim anything. The reach half is an empirical calibration of
      a solver, not a theorem. No new theorem, bound, certificate family,
      reduction or closure argument is proposed. Recorded rather than omitted per
      docs/inventor-protocol.md section 8.
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-WIN-1
      formal_statement: >-
        FOR ALL tested (p, m, B) and FOR ALL three window types, the windowed
        decomposition counts over uniform targets are Poisson with parameter
        mu = binomial(B+m-1, m)/N, equivalently the dlog image of the window
        behaves like a uniform random subset of Z/N of the same size with respect
        to m-fold representation counts.
      random_model_justification: >-
        RIGOROUS INGREDIENT- the exact mean identity of KN-FIND-007, which fixes
        the first moment for EVERY base and leaves only the distribution free. THE
        HEURISTIC PART is the representation-function Poisson model for random
        sumsets, the standard imitation for m-fold representation counts of a
        random subset in the range where mu is of order 1. WHAT IS ACTUALLY BEING
        TESTED is not the Poisson model but whether the x-window dlog image
        satisfies it, which is the only elliptic content available here.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            VERBATIM- sum over r in G of c_D(r) = binomial(B+m-1, m) exactly, hence
            the mean per-target yield is binomial(B+m-1, m)/N for EVERY base of
            size B independently of how the base is chosen; that coverage obeys
            coverage at most min(1, mean) with equality iff no target has two
            decompositions; the measured Bose-Chowla Sidon coverage ratio 1.1071
            and the small-multiples collapse to 0.0021 with concentration 1224x at
            2^18; and the explicit statement that it says nothing about the cost of
            FINDING a decomposition, which is where the index-calculus cost sits.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - KN-FIND-007 read in full this
            task, 96 lines; every quoted figure and passage is verbatim.
      validation_experiment_ids:
        - EXP-ICEX-4a3099
      falsification_condition: >-
        The interval arm coverage ratio against the curve-free random-Z/N null
        falls outside [0.9, 1.1], or its dispersion falls outside [0.85, 1.20],
        reproduced across seeds. Then x-intervals carry additive structure the mean
        identity cannot see, which reopens the yield question for boxes
        specifically and is a genuine finding against the windowed programme.
    - id: HEUR-WIN-2
      formal_statement: >-
        Planted windowed decompositions are distributed like naturally occurring
        ones, so recovery thresholds measured on planted instances transfer to
        natural instances at the same (p, m, B).
      random_model_justification: >-
        Planting fixes the m summands uniformly in the window, so the target is
        uniform in the subgroup; the imitation is the equidistribution of sums of
        uniform windowed points. This is heuristic and is checked directly rather
        than assumed.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ICEX-4a3099
      falsification_condition: >-
        Recovery rates on planted instances differ from those on naturally found
        instances at the smallest cell, where exhaustive enumeration supplies the
        natural ones. Then planting is biased and the reach measurement must be
        redone on natural instances only, at a much higher cost, and the planted
        reach numbers are withdrawn.
  structural_ingredients:
    - description: >-
        The exact decomposition-yield identity that makes the mean a proof rather
        than an observable, together with its own statement that it says nothing
        about the cost of finding a decomposition.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 96 lines.
      role: >-
        removes the mean arm, supplies the coverage ceiling, and bounds what the
        yield half can support
    - description: >-
        The summation-polynomial and small-root machinery on which the reach half
        depends. RELAYED- this agent did NOT open knowledge/techniques/KN-TECH-015.md,
        KN-TECH-002.md or KN-TECH-006.md; they are named in IDEA-20260808-f4edc6
        source_refs, which this agent read in full, and nothing is quoted from
        them here. Marked recalled rather than internal for that reason, so it
        supports nothing. THE CONTRACT DOES NOT DEPEND ON THEM- P5 reports the
        measured reach as a calibration of instrument shape and explicitly does
        NOT validate any derived epsilon, precisely because no derived bound has
        been read at source by this agent.
      citation: KN-TECH-015, KN-TECH-002, KN-TECH-006
      provenance: recalled
      verified_by: null
      role: >-
        the reach half instrument, named for the reviewer; supplies no bound this
        record relies on
  reduction_chain:
    core_problem: >-
      Whether an x-coordinate window maps to a dlog subset of Z/N whose m-fold
      representation counts are indistinguishable from a uniform random subset, and
      what the small-root reach is on planted windowed decompositions.
    corollaries:
      - problem: >-
          The yield and reach inputs that several windowed proposals in this lane
          currently assume without an artifact.
        reduction_ref: >-
          Internal- no published reduction is cited and none is needed.
        asymptotics_preserved: >-
          Not applicable. No attack and no asymptotic claim.
  predictions:
    - metric: >-
        P1- measured mean windowed decomposition count against
        binomial(B+m-1, m)/N, per cell (dimensionless)
      direction: different
      minimum_effect: >-
        EQUAL TO FLOATING-POINT ERROR AT EVERY CELL FOR EVERY WINDOW TYPE. THIS IS
        A CONSTRUCTION CHECK AND NOT EVIDENCE- the mean is fixed by an identity, so
        a deviation is a harness bug and nothing may be interpreted until it is
        fixed. NO OUTCOME ON THIS METRIC IS AN ELLIPTIC-CURVE STATEMENT.
    - metric: >-
        P2- coverage ratio, window arm over CURVE-FREE random-Z/N null of the same
        size, per cell (dimensionless)
      direction: different
      minimum_effect: >-
        IN [0.9, 1.1] for the x-interval, x-arithmetic-progression and random
        x-subset arms. A systematic shortfall for the interval arm indicates
        additive clustering in its dlog image and is a genuine finding against the
        windowed programme.
    - metric: >-
        P3- dispersion Var(count)/mean, per arm per cell (dimensionless)
      direction: different
      minimum_effect: >-
        IN [0.85, 1.20] for all three window arms and for the curve-free null. An
        excess for the interval arm indicates structure.
    - metric: >-
        P4- planted dlog-interval control- coverage ratio against the curve-free
        random-Z/N null at the design cell (dimensionless)
      direction: lower
      minimum_effect: >-
        BELOW 0.01, AND THE COMPUTED VALUE IS ABOUT 3.7e-4. DERIVED- at
        p about 2^22, B = 2^8, m = 3 the null coverage is 1 - exp(-0.6745) = 0.4906
        while a true dlog interval covers only (3B-2)/N = 766/4194304 = 1.83e-4, a
        ratio of about 2690 to 1. Its dispersion must EXCEED 10. IF THE PLANTED
        DEFECT DOES NOT FIRE AT THAT MAGNITUDE THE INSTRUMENT CANNOT SEE ADDITIVE
        STRUCTURE AT ALL AND EVERY NULL RESULT IN THE YIELD HALF IS VOID.
    - metric: >-
        P5- planted-root recovery threshold epsilon-hat = log_p(B^m) at failure,
        per solver configuration (dimensionless)
      direction: different
      minimum_effect: >-
        REPORTED WITH ITS SOLVER CONFIGURATION NAMED. Where a derived reach exists
        for that configuration it is compared and the gap reported; where none
        exists the measured value is reported as a calibration of instrument shape
        and NOT as a validation of any derived epsilon.
    - metric: >-
        P6- scrambled-window null- planted-root recovery on a random size-B subset
        replacing the window, at every B (dimensionless)
      direction: lower
      minimum_effect: >-
        NO RECOVERY AT ANY B. THIS IS THE ARTIFACT TELL. If the scrambled arm
        recovers planted roots, the reach measurement is an artifact of the lattice
        rather than of the window and EVERY REACH NUMBER IS VOID.
    - metric: >-
        P7- decay control- reach as a function of the scramble fraction swept from
        0 to 1 (dimensionless)
      direction: lower
      minimum_effect: >-
        MONOTONE DECAY TO ZERO, with the reach at scramble fraction 0.5 AT MOST 50
        PERCENT of its unscrambled value and NO recovery at any B at scramble
        fraction 1.0. A quantity that fails to decay when the parameter meant to
        destroy it increases is the canonical artifact signature.
    - metric: >-
        P8- exhaustive-enumeration ground truth at the smallest cell
      direction: different
      minimum_effect: >-
        The counter must agree with brute-force enumeration on EVERY target at the
        smallest cell. A disagreement invalidates every count in the run.
  test_boundary:
    instances:
      - >-
        Toy prime-order curves at at least four p values in [2^18, 2^28], so that
        the crossing of binomial(B+m-1,m)/N through 1 is spanned.
      - >-
        Window arms- x-interval, x-arithmetic-progression, random x-subset, matched
        on MEASURED size.
      - >-
        CURVE-FREE NULL ARM- a uniformly random size-B subset of Z/N, with m-subset
        sums as decompositions and NO curve arithmetic in the code path.
      - >-
        PLANTED-DEFECT ARM- the factor base taken as the multiples 0 through B-1 of
        the generator, i.e. a TRUE INTERVAL IN DLOG SPACE, whose coverage and
        dispersion are known in closed form.
      - >-
        SCRAMBLED-WINDOW ARM and a scramble-fraction sweep for the reach half.
    parameters:
      p: 'at least four values in [2^18, 2^28]'
      m: '3, with 4 attempted where B^m stays at or below 2^30'
      B: '2^6, 2^7, 2^8 at m = 3; at most 2^7 at m = 4'
      solver_configuration: 'reduction algorithm, block size and shift set pinned in the contract'
      scramble_fraction: '0, 0.25, 0.5, 0.75, 1.0'
      seeds: 'declared before the run; at least 5 per cell'
    implementation: >-
      An exact enumerator over multisets from the factor base, sharing ONE counter
      and ONE reporting path with the curve-free arm and the planted arm, plus a
      shift-lattice small-root module for the reach half. The largest object is a
      B^m enumeration buffer of at most 2^30 entries, STREAMED rather than
      materialised.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 8.0
      maximum_memory_gb: 8
      maximum_runs: 40
  falsification_conditions:
    - >-
      F1. The measured mean differs from binomial(B+m-1, m)/N by more than
      floating-point error. HARNESS BUG; nothing else may be interpreted until it
      is fixed. This is not a result about curves.
    - >-
      F2. The interval arm coverage or dispersion departs materially from the
      curve-free random-Z/N null. Windows have additive structure the mean identity
      cannot see; the yield question reopens for boxes specifically.
    - >-
      F3. The planted dlog-interval control does NOT fire at its computed magnitude
      - coverage ratio below 0.01 and dispersion above 10. The instrument cannot
      see additive structure and EVERY NULL RESULT IN THE YIELD HALF IS VOID; the
      run is INVALID rather than negative.
    - >-
      F4. The scrambled-window arm recovers planted roots at any B. The reach
      measurement is an artifact and every reach number is void.
    - >-
      F5. The reach fails to decay monotonically as the scramble fraction rises.
      The canonical artifact signature; the reach half is withdrawn.
    - >-
      F6. Planted and naturally enumerated instances have different recovery rates
      at the smallest cell. Planting is biased and the reach numbers are withdrawn.
    - >-
      F7. All three window arms match the curve-free random-Z/N null, as predicted.
      Then x-coordinate windows give pseudorandom dlog subsets, yield is removed as
      an explanation for anything in the windowed programme, and NOTHING IN THE
      YIELD HALF IS AN ELLIPTIC-CURVE OR ECDLP STATEMENT.
  interpretation_limits:
    - >-
      THE MEAN IS AN IDENTITY AND IS NOT AN OBSERVABLE. It is recorded as a proof.
      No outcome on it is an elliptic-curve statement, and a deviation is a bug.
    - >-
      COVERAGE AND DISPERSION ARE FUNCTIONS OF THE DISCRETE-LOG MULTISET ALONE. The
      only elliptic content in the yield half is whether an x-window maps to a
      pseudorandom subset of Z/N. IF THE CURVE-FREE RANDOM-Z/N NULL MATCHES, NOTHING
      IN THAT HALF IS AN ELLIPTIC-CURVE OR ECDLP STATEMENT. Pre-stated so it cannot
      be renegotiated after the data.
    - >-
      TOY SCALE, p at most 2^28. THE REACH HALF CALIBRATES INSTRUMENT SHAPE ONLY AND
      MUST NEVER BE QUOTED AS A CRYPTO-SCALE epsilon. NO CRYPTO-SCALE REACH IS
      TESTABLE AT ANY SCALE THIS PROGRAM CAN REACH, because exact enumeration is
      bounded by B^m at most 2^30 and the planted-instance construction needs the
      window to be enumerable. Stated rather than the claim being quietly shrunk.
    - >-
      x-coordinate 2-to-1 fibres and 2-torsion inflate the point set and the
      counts; every arm is normalised by MEASURED size and a nominal-size
      comparison is inadmissible.
    - >-
      Solver failures from precision or root extraction are classified separately
      from failures from the bound. Pooling them under-reports the reach.
    - >-
      At small p the quantity binomial(B+m-1,m)/N is coarse; at least four p values
      are required to see its crossing through 1, and a single p supports no
      statement about the crossing.
    - >-
      claim_tier toy. No attack, no exponent moved, sota_delta zero. Nothing here
      licenses any claim about a curve above the tested p.
