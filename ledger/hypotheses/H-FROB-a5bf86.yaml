hypothesis:
  id: H-FROB-a5bf86
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  source_proposal: IDEA-20260920-b9f0c5
  designed_from: IDEA-20260920-b9f0c5
  added: '2026-09-20'
  proposed_by: idea-generator
  designed_by: coordinator
  approval_decision: DEC-20260920-cf8ded
  archived_by: TASK-20260920-956d12
  title: >-
    WDSat is basis-blind on Frobenius-stable PDP factor bases at rich n unless
    conflicts fall materially below 2^{ml}/m!
  status: approved
  status_note: >-
    Pre-run approval paired to EXP-FROB-30006a under DEC-20260920-cf8ded.
    Not supported. Prior HEUR-FROB-WDSAT-NULL is new and is NOT attributed to
    IDEA-20260906-a77711 (DEC-20260920-f1e672 repair note).

  statement: >-
    On Koblitz E/F_2 over F_{2^{41}} (primary) and F_{2^{43}} (decisive,
    capacity-gated), for Frobenius-stable factor bases V cut from intermediate
    irreducible factors of T^n - 1, WDSat conflict counts on independently
    certified-UNSAT m-summand PDPs equal the orbit-naive null 2^{m l}/m!
    within about 1% (basis-blind: invariant V free but worthless to search),
    unless they fall to ≤ 50% of that null on every primary replicate
    (material pruning: then branch-order / conflict-depth is the follow-on).
    Size-matched random non-stable V is the control. No rewriting-degree claim;
    no deployed-curve claim.

  mechanism: >-
    Stable V exist at dim 20 (n = 41) and dim 14 (n = 43) by the divisor
    correspondence. The open question after a77711 is whether that geometry
    prunes a fixed-target SAT search. WDSat conflicts vs 2^{ml}/m! is the
    preregistered observable.

  assumptions:
    - Toy public Koblitz parameters only.
    - WDSat sized exactly from each ANF (ICPERF build discipline).
    - UNSAT certified independently before scoring conflicts.
    - HEUR-FROB-WDSAT-NULL is a reference, not a theorem.

  predictions:
    - metric: conflict_ratio_vs_null
      direction: flat_or_lower
      minimum_effect: >-
        ≈1 within 1% ⇒ basis-blind. ≤0.5 on all primary certified-UNSAT
        replicates ⇒ pruning.
    - metric: stable_vs_random_ratio_gap
      direction: near_zero_if_blind
      minimum_effect: >-
        If both arms ≈1, blindness is general. If only stable <<1, pruning is
        invariant-specific.

  test_boundary: >-
    Primary: n = 41, m = 2, l = 20, ≥3 certified-UNSAT targets, stable and
    random V. Decisive: n = 43, m = 3, l = 14, three V_i, capacity-gated.
    Regression: one ICPERF/Trimoska WDSat UNSAT cell within 2x conflicts.

  falsification_criteria:
    - Primary cell yields no certified-UNSAT with matched MAX_ID.
    - Pruning claimed without independent UNSAT certificate.
    - Stable and random ratios diverge >10% near 1 without re-scoping the claim.

  heuristic_assumptions:
    - id: HEUR-FROB-WDSAT-NULL
      statement: >-
        Basis-blind reference conflict count is 2^{m l}/m! on these ANFs.
      falsification_condition: >-
        Random-V arm systematically far from 1 while instrument checks pass —
        then replace the null before scoring the stable arm.

  proof_search_map:
    bottleneck: Stable-V WDSat conflicts vs 2^{ml}/m! on fixed-target UNSAT.
    baseline_embedding:
      parameter_slice: n = 41 primary; n = 43 decisive.
      reproduction_check: ICPERF/Trimoska WDSat UNSAT within 2x.
    observation_collision:
      observable: conflicts; ratio to null; optional depth histogram.
      distinct_preimage_search: random same-dimension V.
    constructive_transforms:
      - transform: frobenius_stable_factor_base
        proposed_object: V = ker f(σ)
        predicted_gain: decide basis-blind vs pruning
    quantifier_order: Preregistered cells measured end-to-end on fresh UNSAT targets.
    method_ceiling:
      strongest_certifiable_claim: Named-cell conflict ratio; no asymptotics.
      nearby_object_control: Random V; optional poor-n structural control.
    proof_obligations:
      - claim: UNSAT independently certified.
        responsibility: correctness
      - claim: MAX_ID matches ANF.
        responsibility: runtime
      - claim: Ratio uses preregistered null.
        responsibility: cost-model

  interpretation_limits:
    - Approval is not support.
    - Null ≈1 does not close every Frobenius use — only this search observable.
    - ECC2K-130 remains poor-n (no intermediate stable V).
