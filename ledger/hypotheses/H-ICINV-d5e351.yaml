hypothesis:
  id: H-ICINV-d5e351
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  source_design: analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md section 4, E1

  statement: >-
    SCOPE. One complete, already-enumerated, Hurwitz-Kronecker-certified ordinary
    F_p-isogeny class: p = 4001, t = 30, D = t^2 - 4p = -15104 = -59 * 16^2
    (D_0 = -59, f = 16), 138 curves. Exact symbolic computation over F_p on every
    curve. No sampling, no target draw, no null object, no p-value, no solver
    timing. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO SPEEDUP, sota_delta ZERO.

    CLAIM (H1). The exact symbolic Semaev geometry of a curve is either an
    isogeny-class invariant or it is not, and this hypothesis holds that the
    question is decidable at zero statistical cost on this one class. Concretely,
    for every curve E_i = (a_i, b_i) in the class, the following are computed
    exactly and compared across the class -- (i) the monomial support of S_3 and
    of S_4; (ii) the singular locus of the Semaev variety S_m = 0 and its
    dimension; (iii) the graded Betti table and Castelnuovo-Mumford regularity of
    the ideal generated by S_m TOGETHER WITH ITS PARTIAL DERIVATIVES and
    EXPLICITLY WITHOUT the factor-base membership polynomials f_V; (iv) the
    degree and the F_p-factorisation type of the elimination polynomial of that
    same f_V-free ideal.

    H1 asserts that this comparison is DECISIVE IN BOTH DIRECTIONS, per T3 of
    DECOMPOSITION.md section 3 -- constancy of all four families across the class
    closes the d_reg axis of RQ-ICINV-475b5e for these functionals with a NAMED
    obstruction, and variation in any one of them hands the campaign the target
    min_{E' ~ E} C(E') and promotes the matched-order experiments. It does NOT
    assert which way the comparison falls. The directional content of H1 is
    confined to the preregistered predictions below, each of which is fixed here
    before any execution.

    WHY THE f_V POLYNOMIALS ARE REMOVED, STATED AS THE HYPOTHESIS'S CENTRAL
    PREMISE. The committed harness builds, for the m = 3 test
    (harness/semaev.py:92-121), the ideal < S_3(x1, x2, x_R), f_V(x1), f_V(x2) >
    with f_V(x) = prod_{v in V} (x - v). The two membership polynomials are
    univariate of degree |V| and already generate a zero-dimensional radical
    ideal of degree |V|^2 in shape position; the curve enters that ideal ONLY
    through S_3, which is bidegree (2,2). The solving degree is therefore pinned
    by |V| and not by the curve. That is not a conjecture: it is the standing
    explanation of the campaign's own most puzzling committed pair
    (red_team_notes.md section 11, hand-verified), where the S_3 monomial support
    really does drop 13 -> 9 at j = 0 and 13 -> 10 at j = 1728 -- a 23-31%
    reduction in the algebraic object -- while the Groebner time moves by only
    -0.44% and -0.67% and gb_size for j = 1728 moves the WRONG WAY at +3.41%. In
    inventor-protocol terms the observation collision is real and exact and does
    not survive projection onto the cost functional, because the cost functional
    is dominated by f_V. Deleting f_V from the ideal is precisely what turns the
    measured object back into a functional of the curve. This hypothesis measures
    that curve functional; it makes NO claim that the f_V-free functional is a
    cost model for any attack, and section 2 of the design document is the reason
    it must not be read as one.

    WHAT IS NOT CLAIMED. Nothing about the ECDLP in the prime-order subgroup G.
    Nothing about Groebner solving time, first-fall degree of the deployed
    system, relation-collection cost, any speedup, any exponent, or any curve at
    cryptographic scale. Nothing about any prime other than 4001 and no trace
    other than 30. No statistic of any kind is computed, so this hypothesis is
    outside the scope of pause condition P1 and of GOAL-ENDO-001 criterion C4.

  mechanism: >-
    STEP 0 -- WHY THIS CLASS AND WHY IT IS THE CHEAPEST DECISIVE TEST. The class
    is already enumerated and certified complete against the Hurwitz-Kronecker
    mass formula (BATCH-cb71b5 what_survived_review, third item), so no
    enumeration cost is incurred and no completeness argument has to be made
    twice. Its 2-volcano has depth 4 and five levels with true level counts
    {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} summing to the enumerated 138, built by
    Velu and cross-checked against h(D_0 f'^2) by the campaign's own red team
    (red_team_notes.md section 10). So the class supplies a five-valued
    within-class covariate at zero additional cost, and every invariant computed
    here can be reported against it without any new volcano construction.

    STEP 1 -- WHAT T4 ALREADY DETERMINES, SO THAT IT IS NOT MISREPORTED AS A
    RESULT. T4 (DECOMPOSITION.md section 3) fixes t, hence D, hence D_0 = -59.
    j = 0 requires D_0 = -3 and j = 1728 requires D_0 = -4, so NEITHER OCCURS
    ANYWHERE IN THIS CLASS and every member has a_i != 0 and b_i != 0. By the
    hand-verified support derivation of red_team_notes.md section 11 -- generic
    3 + 4 + 1 + 3 + 2 = 13 monomials, a = 0 drops the four monomials a*x1*x3,
    a*x2*x3, -2a*x1*x2 and a^2 to leave 9, b = 0 drops -4b*x3, -4b*x1, -4b*x2 to
    leave 10 -- the S_3 monomial support is CONSTANT AT 13 on all 138 curves as a
    matter of derivation, not of measurement. This is stated here so that
    observing it cannot later be presented as a finding, and so that a run
    reporting anything other than 13 is diagnosed as an implementation defect
    rather than as a discovery.

    STEP 2 -- WHERE THE REMAINING DEGREES OF FREEDOM ACTUALLY LIVE. With the
    support pinned by STEP 1, the only invariants that can vary across this class
    are the finer ones: the coefficients themselves, and therefore the geometry
    they define. Specifically -- the dimension and degree of the singular locus
    V(S_3, d S_3/d x1, d S_3/d x2, d S_3/d x3); the graded Betti table and the
    Castelnuovo-Mumford regularity of that Jacobian ideal; the degree and
    F_p-factorisation type of the generator of its elimination ideal in one
    variable; and the corresponding S_4 quantities. These are functions of
    (a_i, b_i) alone. Every one of them is invariant under the gauge action
    (a, b) -> (u^4 a, u^6 b) up to the induced weighted change of variables, so a
    difference between two curves in the class is a difference between two
    j-invariants and not an artifact of the chosen Weierstrass representative --
    which the run must certify by recomputing every invariant on a second,
    randomly gauge-transformed model of the same curve and requiring agreement.

    STEP 3 -- WHY THE COMPARISON IS DECISIVE IN BOTH DIRECTIONS. This is T3,
    applied to a functional C that is now genuinely a functional of the curve
    because f_V has been removed. If C is constant on the class, then by T2 no
    curve in the class is algebraically preferable under C, the d_reg axis of
    RQ-ICINV-475b5e is closed FOR THESE FUNCTIONALS AND THIS CLASS, and the
    obstruction has a name: the Jacobian ideal of S_3 has a class-constant graded
    structure, so no isogeny walk can improve it. If C varies, the campaign has
    min_{E' ~ E} C(E') as a target and must immediately confront the T5
    reachability gate, which is why EXP-VOLC-9f5571 carries that gate in the same
    batch. Both outcomes are archivable; neither is presumed.

    STEP 4 -- THE GRADING, WHICH THE DESIGN DOCUMENT DID NOT FIX AND WHICH BETTI
    TABLES DEPEND ON. A Betti table is defined only for a graded module, and S_3
    with (a, b) specialised to F_p constants is inhomogeneous of total degree 4.
    This contract therefore FIXES the grading rather than leaving it to the
    executor: the Jacobian ideal is homogenised with respect to a new variable
    x0 and resolved over F_p[x0, x1, x2, x3] with the standard grading, and the
    graded Betti numbers beta_{i,j} and reg are read from that minimal free
    resolution. The affine singular locus and its dimension are computed
    SEPARATELY on the un-homogenised ideal, because homogenisation can add
    components at infinity and conflating the two would make a difference at
    infinity look like a difference between curves. Both are reported; neither
    substitutes for the other. The choice of grading is declared, not derived,
    and any successor comparing against these numbers must use the same one.

    STEP 5 -- WHAT MAKES A DIFFERENCE REAL. A per-curve invariant that differs
    between two members of the class is admitted only if it survives three
    checks, all cheap and all mandatory: (i) it is reproduced after a random
    gauge transformation of each curve's Weierstrass model (STEP 2); (ii) it is
    reproduced by a second, independent computer-algebra backend on a declared
    subsample of at least 20 curves including every curve on which a difference
    is claimed; (iii) it is invariant under the declared monomial order for the
    quantities that are order-independent by theory (Betti numbers, regularity,
    dimension, degree) -- a dependence on monomial order in any of those four is
    an implementation defect, reported as one, and never as a curve difference.

  assumptions:
    - >-
      [fact] Semaev's third summation polynomial for short Weierstrass
      y^2 = x^3 + a x + b is
      S_3 = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3 + ((x1 x2 - a)^2 -
      4b(x1+x2)), with generic monomial support 13. Hand-verified by the
      campaign's red team (red_team_notes.md section 11) and re-verified
      symbolically by the run before any other quantity is computed.
    - >-
      [fact] T4. Fixing the isogeny class fixes t, p, N, D and D_0; j = 0 occurs
      only when D_0 = -3 and j = 1728 only when D_0 = -4. D_0 = -59 here, so
      neither special j occurs and a_i != 0 != b_i on every member.
    - >-
      [fact] T1/T2/T3 as stated in DECOMPOSITION.md section 3. Used as the
      interpretive frame; T1 and T2 are elementary, T3 is a statement about what
      a constancy result licenses and is used only in that role.
    - >-
      [committed, not re-derived here] The class enumeration itself: 138 members
      at p = 4001, t = 30, certified against the Hurwitz-Kronecker mass formula,
      and the true 2-volcano level distribution {0: 3, 1: 9, 2: 18, 3: 36,
      4: 72} built by Velu in red_team_notes.md section 10. The run re-emits the
      enumeration under its own record; if it disagrees with the committed count
      the run terminates PREMISE-FAILED and reports the disagreement, because
      that would be a defect in a certified artifact and is more important than
      anything else this contract measures.
    - >-
      [declared, not a fact] The grading and homogenisation convention of
      mechanism STEP 4. It is a CHOICE. Betti tables and regularity are not
      defined without it, and a different convention gives different numbers that
      are not comparable to these.
    - >-
      [declared] The elimination polynomial of an f_V-free ideal is not the
      elimination polynomial the deployed index-calculus formulation solves. It
      is defined here as the monic generator of I ^ F_p[x3] for
      I = <S_3, d_1 S_3, d_2 S_3, d_3 S_3>, and when that elimination ideal is
      the zero ideal the run records "empty" together with the dimension of the
      projection rather than inventing a degree.
    - >-
      [scope] p = 4001 only, one class, 138 curves, arities m = 3 (required) and
      m = 4 (support and singular locus required; Betti table and regularity
      recorded as a secondary and permitted to be reported as not_computed if the
      declared budget is exhausted, which is a budget statement and never a
      result). claim_tier toy.

  proof_search_map:
    bottleneck: >-
      The campaign has never measured d_reg, d_ff, a Macaulay rank or a Betti
      table -- groebner_basis_max_degree is annotated in the committed source as
      "proxy, NOT degree of regularity" (harness/semaev.py:85). Every statement
      the campaign has made about solving-degree invariance therefore rests on a
      proxy computed from an ideal in which f_V, not the curve, pins the degree.
      The bottleneck is exactly that substitution, and removing f_V is the one
      change that converts the measured object into a curve functional.
    baseline_embedding:
      parameter_slice: >-
        The committed special-j comparison at p = 1009 (RUN-JINV-p1009-a): S_3
        support 9 (j = 0, 6 curves), 10 (j = 1728, 4 curves), 13 (generic, 12
        curves), with gb_seconds ratios 0.9956 and 0.9933 and gb_size ratios
        1.0102 and 1.0341. That is the exact boundary at which the old method
        (with f_V in the ideal) is known to be insensitive to a large, exact
        change in S_3.
      reproduction_check: >-
        SYMBOLIC, NOT STATISTICAL, AND IT IS A GATE. Before any class-wide
        computation, the run must symbolically re-derive the support counts 13,
        9 and 10 for generic (a, b), for a = 0, and for b = 0, and must
        reproduce support 13 on all 138 members of the p = 4001 class. Failure
        of either is an implementation defect and makes the run INVALID; it is
        not evidence about the class.
    observation_collision:
      observable: >-
        The pair (graded Betti table, Castelnuovo-Mumford regularity) of the
        f_V-free Jacobian ideal of S_3, per curve.
      distinct_preimage_search: >-
        A COLLISION IS THE EXPECTED OUTCOME AND IS THE POINT. Distinct curves in
        one class can share a Betti table for at least three distinct reasons:
        genuine class-invariance of the graded structure; insensitivity of the
        chosen grading to the coefficient variation that actually occurs; and
        degeneration of the resolution to a Koszul complex whenever the four
        Jacobian generators form a regular sequence, which would make the table
        a function of the degrees alone and of nothing else about the curve. The
        run separates the third from the first two by testing the regular-
        sequence condition explicitly per curve and reporting it, so a constancy
        result that is really a Koszul degeneration is labelled as one rather
        than reported as isogeny-class invariance.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the campaign's scalar Groebner-time proxy by the graded Betti
          table of the f_V-free Jacobian ideal together with the singular-locus
          dimension and degree and the elimination-polynomial factorisation type
          -- four invariants that are functions of (a, b) alone, are exactly
          computable at this scale, and carry no sampling error at all.
        predicted_gain: >-
          Encoding: exact, no estimator and no null object. Completeness: the
          four invariants do not reconstruct any attack cost and are not claimed
          to; the gain is that they are curve functionals, which the proxy was
          not. Soundness: gauge-invariance certified per curve, and a
          second-backend cross-check on a declared subsample. Transfer: DECLARED
          UNMET beyond this class and this p -- nothing here extrapolates.
          Cost: bounded by the declared budget; the whole computation is
          deterministic and re-runnable bit-for-bit from the class enumeration.
    quantifier_order: >-
      CLAIMED IN THIS ORDER: FORALL curves E_i in the single class
      (p = 4001, t = 30), FORALL four invariant families, the computed value is
      recorded; and the class-level statement is FORALL pairs (E_i, E_j) in the
      class, invariant(E_i) = invariant(E_j) -- or its negation, exhibited by an
      explicit pair. The weaker order (EXISTS a pair that agrees) is not claimed
      and would support nothing. No quantifier over primes, classes, traces or
      arities beyond those enumerated is claimed anywhere.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that on one certified-complete ordinary isogeny class at
        p = 4001 with t = 30, under one declared homogenisation and monomial
        order, four exactly-computed symbolic invariants of the f_V-free Semaev
        Jacobian ideal are, or are not, constant across the class, and where they
        vary, whether the variation tracks the true 2-volcano level. It cannot
        certify anything about Groebner solving time in the deployed formulation,
        about relation-collection cost, about any other class or prime, about any
        exponent, or about the ECDLP in the prime-order subgroup.
      nearby_object_control: >-
        THE NULL OBJECT IS A SIZE-MATCHED SET OF 138 RANDOM ORDINARY CURVES AT
        p = 4001 DRAWN FROM OUTSIDE THIS CLASS (declared traces, recorded). It is
        the closest object in every respect the computation touches -- same
        prime, same Weierstrass family, same symbolic pipeline, same grading,
        same monomial order -- and differs only in not being one isogeny class.
        If the four invariants are equally constant on the random set, then their
        constancy on the class is a property of S_3's shape and NOT of the
        isogeny class, and the closure claim collapses. This control is
        DETERMINISTIC and carries no p-value; it is a comparison of two exact
        multisets of invariants.
    proof_obligations:
      - claim: >-
          The symbolic S_3 for short Weierstrass has support 13 generically, 9 at
          a = 0, 10 at b = 0, and support 13 on every member of the p = 4001
          class.
        responsibility: baseline
      - claim: >-
          The four invariant families are gauge-invariant, i.e. unchanged under
          (a, b) -> (u^4 a, u^6 b) with the induced weighted change of variables.
        responsibility: correctness
      - claim: >-
          Betti numbers, regularity, singular-locus dimension and degree are
          independent of the monomial order under the declared grading.
        responsibility: correctness
      - claim: >-
          The class enumeration re-emitted by the run agrees with the committed
          138-member Hurwitz-Kronecker-certified census.
        responsibility: interface
      - claim: >-
          Constancy on the class is not a Koszul degeneration; the regular-
          sequence condition is tested and reported per curve.
        responsibility: strictness
      - claim: >-
          Nothing here transfers to solving time in the f_V formulation, to
          another class or prime, or to the ECDLP in G.
        responsibility: scope
    not_applicable_reason: null
    not_applicable_reason_note: >-
      Filled rather than excused. The success branch of this hypothesis is a
      CLOSURE ARGUMENT with a named obstruction, which AGENTS.md places squarely
      inside the proof-architecture portfolio, so the four cheap pre-compute
      audits above are exactly the audits the coordinator must see before
      approving implementation.

  rerandomization: null
  rerandomization_note: >-
    No worst-to-average-case device is used or needed. Every curve in the class
    is computed; there is no instance to re-randomise and no reduction to pull
    back. The gauge re-randomisation of mechanism STEP 2 is a CORRECTNESS check
    on the representative, not a complexity device, and must not be read as one.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NO COMPLEXITY CLAIM OF ANY KIND. sota_delta is ZERO on every axis.
    dominated_by: parallel Pollard rho with distinguished points at
    0.886 sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006),
    and on CM curves its automorphism-discounted variant (KN-TECH-018), where a
    factor at or below sqrt(6) is baseline calibration and never an attack. This
    hypothesis produces no algorithm and no cost improvement, and any downstream
    record citing it toward a cost or exponent statement is making an
    unsupported inference.

  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    DELIBERATELY EMPTY, and the emptiness is the design. This hypothesis has no
    conditional dependence on any heuristic because it computes exact symbolic
    invariants of explicit polynomials over F_p on a completely enumerated set of
    curves. There is no sampling distribution to model, no tail to check and no
    random-model justification to give. That is also why this contract does not
    depend on the SR3 gate and is not blocked by EXP-INSTR-36c8cf under
    GOAL-ENDO-001 criterion C4: C4 governs instruments that estimate, and this
    one does not estimate.

  structural_ingredients:
    - description: >-
        Semaev summation polynomials S_3 and S_4 for a short Weierstrass curve
        over F_p, with their explicit coefficient shape in (a, b).
      citation: >-
        Standard; the S_3 expression used is the one committed in
        harness/semaev.py and hand-verified in red_team_notes.md section 11. No
        external citation is asserted beyond that.
      role: supplies the polynomial whose geometry is the object of study
    - description: >-
        Minimal free resolutions, graded Betti numbers and Castelnuovo-Mumford
        regularity of a homogeneous ideal over a field.
      citation: >-
        Standard commutative algebra; used computationally, not as a cited
        theorem. The concrete numbers come from the declared CAS backend and are
        cross-checked by a second backend on a declared subsample.
      role: defines the invariant whose class-constancy is being tested
    - description: >-
        Hurwitz-Kronecker class-number mass formula, used to certify that the
        enumerated class is complete.
      citation: >-
        Implemented in harness/isogeny_class.py:class_census and already
        exercised on this exact class; no external citation asserted beyond what
        that module documents.
      role: completeness certificate for the 138-member class

  reduction_chain:
    core_problem: >-
      Decide whether four exactly-computable symbolic invariants of the f_V-free
      Semaev Jacobian ideal are constant across one certified-complete ordinary
      F_p-isogeny class, and if not, whether the variation tracks the true
      volcano level.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no corollary about the ECDLP, about Groebner
      solving time in the deployed f_V formulation, about relation-collection
      cost, about any exponent, or about any curve at cryptographic scale, and
      none is claimed. The only downstream consequences permitted are (i) a
      Coordinator decision on the status of the d_reg axis of RQ-ICINV-475b5e
      scoped to this class, and (ii) prioritisation of EXP-JINV-bd141d and
      EXP-VOLC-9f5571.

  predictions:
    - metric: >-
        P1 -- S_3 monomial support on every member of the p = 4001, t = 30 class
      direction: different
      minimum_effect: >-
        EXACTLY 13 on all 138 curves, with zero variation. This is DERIVED, not
        expected: D_0 = -59 forces a_i != 0 != b_i by T4, and the support count
        depends only on whether a = 0 or b = 0. Any other value is an
        implementation defect and makes the run INVALID. Recorded as a
        prediction so that observing 13 can never be presented as a finding.
    - metric: >-
        P2 -- graded Betti table and Castelnuovo-Mumford regularity of
        <S_3, d_1 S_3, d_2 S_3, d_3 S_3> homogenised in F_p[x0,x1,x2,x3], across
        the 138 curves
      direction: different
      minimum_effect: >-
        THE DECISIVE MEASUREMENT, AND ITS DIRECTION IS DELIBERATELY NOT FIXED.
        The recorded outcome is the number of DISTINCT Betti tables and the
        number of distinct regularity values across the class, exhibited as
        exact multisets. Constancy means exactly one distinct table and one
        distinct regularity on 138 of 138 curves. Variation means at least one
        explicitly exhibited pair (E_i, E_j) in the same class with different
        tables. The design document does not predict which occurs and this
        record does not invent a figure; the falsification conditions below
        cover both branches, and both are archivable.
    - metric: >-
        P3 -- number of distinct (singular-locus dimension, singular-locus
        degree) pairs across the class
      direction: different
      minimum_effect: >-
        Reported as an exact multiset over 138 curves. Any curve whose singular
        locus has dimension differing from the class mode is listed individually
        with its (a, b), its j-invariant and its true 2-volcano level. No
        threshold is applied and no test is performed: this is a census.
    - metric: >-
        P4 -- degree and F_p-factorisation type of the elimination polynomial of
        the f_V-free ideal
      direction: different
      minimum_effect: >-
        Reported as an exact multiset of (degree, partition of the degree by
        irreducible factor degrees, "empty" where the elimination ideal is zero)
        over 138 curves, with the count of curves in each cell.
    - metric: >-
        P5 -- CONTROL: the same four invariant multisets on 138 random ordinary
        curves at p = 4001 drawn from outside this class
      direction: different
      minimum_effect: >-
        Constancy on the class is only informative if the control set is NOT
        equally constant. If both multisets are singletons, the correct reading
        is that the invariant is a property of S_3's shape and not of the
        isogeny class, and the closure claim is withdrawn. This comparison is
        exact and carries no p-value.
    - metric: >-
        P6 -- association between any observed invariant variation and the true
        2-volcano level {0: 3, 1: 9, 2: 18, 3: 36, 4: 72}
      direction: different
      minimum_effect: >-
        Reported as a contingency table of invariant value against true level,
        with the exact cell counts. NO significance test is applied: the crater
        has n = 3 and the campaign's own detection-bound table
        (red_team_notes.md section 6) shows nothing below a 9.8% excess is
        detectable at that stratum size, so a p-value here would be theatre. A
        DETERMINISTIC statement -- "every level-0 curve has table X and no
        level-4 curve does" -- is admissible; a statistical one is not.

  test_boundary:
    instances:
      - >-
        THE SINGLE CLASS: p = 4001, t = 30, D = -15104 = -59 * 16^2, 138 curves,
        already enumerated and Hurwitz-Kronecker-certified. Re-emitted by the run
        under its own record and compared to the committed census.
      - >-
        THE CONTROL SET: 138 random ordinary curves at p = 4001 with traces
        declared in the run record and drawn from outside t = 30. Same prime,
        same symbolic pipeline, same grading, same monomial order.
      - >-
        OUT OF SCOPE: every other prime, every other trace, supersingular
        classes, extension fields, arities m > 4, any ideal containing f_V, any
        Groebner timing, any relation-collection quantity, and every statement
        about the ECDLP in the prime-order subgroup.
    parameters:
      prime: 4001
      trace: 30
      discriminant: -15104
      fundamental_discriminant: -59
      conductor: 16
      class_size_expected: 138
      arities: [3, 4]
      arity_required: 3
      ideal_definition: "I_m = <S_m, and all first partial derivatives of S_m>; f_V is EXCLUDED"
      f_V_prohibition: >-
        No factor-base membership polynomial may appear in any ideal computed by
        this experiment. Including one makes the run INVALID.
      grading: "homogenise with a new variable x0; standard grading on F_p[x0,x1,...]"
      monomial_order_declared: degrevlex
      gauge_recheck: "recompute all invariants on (u^4 a, u^6 b) for a recorded random u per curve"
      second_backend_subsample_minimum: 20
      true_volcano_levels_reference: "{0: 3, 1: 9, 2: 18, 3: 36, 4: 72}, red_team_notes.md section 10"
      control_set_size: 138
      statistics_used: none
      null_object_kind: >-
        Deterministic nearby-object control (random-curve invariant multiset). NO
        NULL-B, NO NULL-C, no permutation test, no chi-square, no p-value.
    implementation: >-
      Symbolic computation over F_p requiring a computer-algebra backend capable
      of minimal free resolutions. THE CAMPAIGN'S EXISTING HARNESS CANNOT DO
      THIS: it is pure Python over sympy, which computes no Betti tables. The
      contract therefore requires a stage-0 infrastructure gate in which the
      executor declares and records the exact backend and version (Macaulay2,
      Singular, or Sage driving one of them), and a second independent backend
      for the cross-check subsample. Absence of a working backend is a terminal
      INFRASTRUCTURE stop reported as such under AGENTS.md rule 5, never a
      mathematical result and never evidence that the invariants are constant.
      harness/semaev.py and harness/exp_icinv.py MUST NOT BE EDITED; new code
      goes in a new module so every committed run stays reproducible.
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 6
      maximum_memory_gb: 8
      maximum_runs: 8
      budget_provenance: >-
        COORDINATOR-SET. The design document states no budget for E1. These
        figures are set to bound the task, not derived from any measurement, and
        exhausting them is a budget event reported under AGENTS.md rule 5.
      dominant_cost: >-
        The 138 minimal free resolutions at m = 3 and, if attempted, the 138 at
        m = 4. Resolutions are computed once per curve and reused across every
        reported invariant; recomputing them per invariant is prohibited.

  falsification_conditions:
    - >-
      F1 (MINUTES, ZERO CLASS-WIDE COST, THE PRIMARY GATE). The symbolic support
      re-derivation does not reproduce 13 / 9 / 10, or the class-wide S_3 support
      is not 13 on all 138 curves, or the re-emitted census disagrees with the
      committed 138. Implementation defect or certified-artifact defect. The run
      terminates PREMISE-FAILED, reports the disagreement, and H1 is untouched in
      either direction.
    - >-
      F2 (THE CLOSURE BRANCH). All four invariant families are constant across
      all 138 curves AND the random-curve control set exhibits the SAME single
      values. Then the constancy is a property of S_3's shape, not of the isogeny
      class, and no closure of the d_reg axis is licensed. This is a refutation
      of the closure reading, not a confirmation of it, and must be reported as
      one.
    - >-
      F3 (THE OTHER CLOSURE BRANCH, WHICH IS A RESULT). All four invariant
      families are constant across the class WHILE the control set exhibits
      several distinct values. Then the d_reg axis is closed for these
      functionals on this class with a named obstruction, scoped to p = 4001,
      t = 30, m = 3 (and m = 4 where computed), the declared grading and the
      declared monomial order.
    - >-
      F4 (THE VARIATION BRANCH). At least one explicitly exhibited pair of
      curves in the class differs in at least one invariant family, surviving the
      gauge recheck and the second-backend cross-check. Then min_{E' ~ E} C(E')
      exists as a target, and the T5 reachability gate becomes binding
      immediately -- the variation is NOT an attack and may not be reported as
      one until EXP-VOLC-9f5571's gate is discharged.
    - >-
      F5. Constancy is explained by a Koszul degeneration -- the four Jacobian
      generators form a regular sequence on every member, so the Betti table is a
      function of the generator degrees alone. Then the constancy carries no
      information about the isogeny class and is reported as a degeneration, not
      as invariance.
    - >-
      F6. Any of Betti numbers, regularity, singular-locus dimension or degree
      depends on the monomial order in the computed output. Implementation
      defect; the run is INVALID and returns to the executor with the defect
      named. Not evidence about H1.
    - >-
      F7 (PLANNED NEGATIVE, PRE-REGISTERED). If the outcome is constancy, the
      batch does not get to emit "the axis is closed" and stop. It must emit the
      named obstruction, the exact scope of the closure, the control comparison
      of F2/F3, the Koszul test of F5, and concrete forward guidance naming what
      remains open -- at minimum whether the same constancy holds at another
      conductor and whether it holds for m = 4. A negative naming no successor
      has not finished and its honest status is unverified
      (docs/inventor-protocol.md closure standard).

  interpretation_limits:
    - >-
      claim_tier toy and no downstream citation may raise it. One prime, one
      trace, one class, 138 curves. Nothing here is a statement about any
      cryptographic parameter.
    - >-
      THE f_V-FREE IDEAL IS NOT THE DEPLOYED SYSTEM. Section 2 of the design
      document is the reason f_V is removed and is equally the reason a result
      about the f_V-free ideal does not transfer to solving time in the
      formulation the harness actually runs. A regularity difference here is NOT
      a predicted Groebner speedup; the committed -0.44% / -0.67% pair is the
      standing demonstration that large exact changes in S_3 do not move that
      cost functional.
    - >-
      A VARIATION RESULT IS NOT AN ATTACK. It is a variance result, and T5 makes
      variance worthless unless the minimiser is reachable. The reachability gate
      lives in EXP-VOLC-9f5571 and is not discharged here.
    - >-
      H-ENDO-001 is used as the admissibility filter and is NOT retested: every
      endomorphism acts as a scalar on the prime-order subgroup, so this lane's
      resource is R1/R2 (x-coordinates as field elements, and the curve
      equation), never a group-operation output. KN-FIND-b7e091's generic-group
      closure is treated as binding and is not revisited.
    - >-
      Nothing in this contract bears on H-STR-002 in either direction: no
      factor base is constructed, no relation is collected, and no equivariance
      is tested. GOAL-ENDO-001 pause condition P2 is therefore not triggered.
    - >-
      Nothing in this contract bears on H-ICINV-6c7920 in either direction. That
      hypothesis is about a target sampler; this contract draws no targets and
      computes no rate. It neither presumes H-ICINV-6c7920 true nor false.

