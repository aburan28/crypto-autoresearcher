  title: >-
    The integer 9 has 3 doublings and 1 addition
  statement: >-
    The integer 9 has bit length 4. Its bits are 1, 0, 0, and 1.
    Reaching it by doubling and adding uses 3 doublings and 1
    addition. Four exceeds three by 1. Three exceeds one by 2. Four
    exceeds one by 3. The product of 4, 3, and 1 is 12. Their sum
    is 8. Two readings of the addition count are both 1, so that
    gap is 0 and their product is 1.
  mechanism: >-
    The proposal writes the counts 4, 3, and 1. This contract
    checks those integers. It does not add a curve point.
  assumptions: []
  proof_search_map:
    bottleneck: The gap between bit length 4 and addition count 1.
    baseline_embedding:
      parameter_slice: >-
        The counts 4, 3, and 1 in IDEA-20261003-f1baef, read
        2026-10-04. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 9. The other counts the
        doublings and additions. They must agree that the counts
        are 4, 3, and 1.
    observation_collision:
      observable: The addition count 1 and the product 12.
      distinct_preimage_search: >-
        Reporting the addition count as 0 drops that count. Two
        readings of the addition count make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The counts 4, 3, and 1.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The bit length 4 comes first, then the doubling count 3,
      then the addition count 1, then the nearby gap 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 4, 3, and 1. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both are 1, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 9 is 4.
        responsibility: correctness
      - claim: The doubling count is 3 and the addition count is 1.
        responsibility: correctness
      - claim: The nearby gap is 0 and the nearby product is 1.
        responsibility: scope
    not_applicable_reason: null
