    The proposal compares a degree-4 column count with an
    overdetermined row count on a ladder one below the ray n equal
    to 3 l, and it places the m equal to 3 exponent 2 n over 3
    above the rho exponent n over 2 by n over 6. This contract
    checks those integers. It does not build a closure.
