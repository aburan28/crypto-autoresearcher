    Three times 8 minus 23 is 1. Three times 10 minus 29 is 1. Three
    times 12 minus 35 is 1. Three times 14 minus 41 is 1. At (23, 8)
    the row count is 3151 and the column count is 2517, so the rows
    exceed the columns by 634. At (29, 10) the counts are 6119 and
    6196, so the rows fall short by 77. At (35, 12) the counts are
    10535 and 12951, so the rows fall short by 2416. At (41, 14) the
    counts are 16687 and 24158, so the rows fall short by 7471. At
    n equal to 131, four times 131 minus three times 131 is 131, and
    nine times 131 minus eight times 131 is 131.
