hypothesis:
  id: H-IC-bcc2eb
  question_id: RQ-IC-a39c7e
  statement: On the fixed toy factorbase schedule, exact certificates discriminate correct interfaces and useful
    output from the listed adverse controls; coverage/new-rank benefit is unknown and may be zero.
  mechanism: "For target alpha=(35x,y), verify cube root condition, alpha on all G and unique nonzero lambda from\
    \ alpha(P)=lambdaP, plus allG action; do not assign scalar to nonstable cyclic lines.; Auxiliary C_a y\xB2=x\xB3\
    +a*x, a0=1,a_next=-4a; maps(x+a/x,y(1-a/x\xB2)). Enumerate all rational points and complete rational composite\
    \ kernel; require kernel size2^d for complete rational-kernel cells. Smaller rational kernel is an explicit\
    \ inadmissible complete-kernel cell, with separately labeled rational-fiber census retained.; Choose lex first\
    \ A with Phi(A) finite and A outside kernel per d; list full rational coset and lifts. Compare target bases\
    \ using exact list, independently expanded rational map incl numerator/denominator, and quadratic chain x_j*x_{j+1}=x_j\xB2\
    +a_j with rational auxiliary y lifts. Require equality of actual target point sets before any cost comparison.\
    \ No isogeny from auxiliary curve to target asserted.; Also export catalog of every finite image fiber at all\
    \ d in canonical image order for the combined panel. Preserve kernel/pole branch and separate P1-only x-fiber\
    \ (no rational-lift requirement) as adverse controls.; For every admitted rational finite nonkernel coset, record\
    \ full actual base and all-target ordered m2/3 tuple histogram, valid point witnesses and paid membership/relation\
    \ work; include empty bases. Report lex first-coset slice separately. Orbit-complete each actual base under\
    \ certified alpha, recording actual M,U, exact raw and reduced rank modr; transformed-only copies contribute\
    \ at most one quotient dimension per original family. Target R is a public point label, not a verifier scalar/log\
    \ column. Newly generated decompositions may add rank; no table of verifier point logs is supplied to the candidate.\
    \ All-G admission/census enumeration is charged toy setup, not unknown-scalar recovery.; Enumerate all rational\
    \ order3 cyclic lines on E/F25 y\xB2=x\xB3+1; alpha=(z*x,y) with z\xB2+z+1=0. Test every line and retain nonstable-line\
    \ rejection.; Rank accounting clarification: report homogeneous R=O base-row rank and per-fixed-R augmented\
    \ quotient rank separately, with dimensions. Distinct target-label columns cannot be pooled and called new useful\
    \ rank for a fixed ECDLP; no verifier a/log table is supplied. The transformed-family rank check acts on the\
    \ entire row and its target orbit weight. Any pooled diagnostic is explicitly labeled as such and excluded from\
    \ useful-rank scoring."
  assumptions:
  - All field/curve/subgroup/map admissions must be independently certified in-run.
  - Known families retained by explicit user instruction; no new method or speedup established.
  proof_search_map:
    bottleneck: Actual valid field/decomposition certificates, independent reduced rank and charged complete pipeline.
    baseline_embedding:
      parameter_slice: same-base explicit list
      reproduction_check: Preserve exact baseline and mandatory nearby-object controls on the frozen schedule.
    observation_collision:
      observable:
      - kernel and stable subgroup admission
      - list/expanded/chain exact base-set equality
      - actual M,U and full target decomposition histogram
      - new quotient-rank yield per paid attempt, explicit zero-rank cells
      distinct_preimage_search: Preserve degenerate witnesses, invalid lifts, duplicate orbit rows and positive-dimensional
        short-vector controls where applicable.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Exact factorbase interface certificates
      predicted_gain: Discrimination only; no cost improvement assumed.
    quantifier_order: For every admitted frozen fixture/case verify certificates; existential successful or faster
      solving remains unproved. No transfer beyond the finite schedule.
    method_ceiling:
      strongest_certifiable_claim: Toy observations and exact implementation witnesses pending independent review.
      nearby_object_control:
      - same-base explicit list
      - identity alpha
      - size-matched seeded random base
      - random coordinate labels and relabeled cyclic generic-group control
      - transformed-only rows versus genuinely fresh decompositions
      - nonstable torsion line
      - kernel/pole fiber retained projectively
      - P1 roots without auxiliary rational lifts
    proof_obligations:
    - claim: Exact admission, valid output and complete accounting in every declared panel
      responsibility: correctness
    not_applicable_reason: null
  predictions:
  - metric: kernel and stable subgroup admission
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: list/expanded/chain exact base-set equality
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: actual M,U and full target decomposition histogram
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: new quotient-rank yield per paid attempt, explicit zero-rank cells
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  test_boundary:
    instances:
    - target
    - alpha_x
    - auxiliary
    - depths
    - tuple_lengths
    - target_law
    - rank2_control
    parameters:
      target:
      - 97
      - 0
      - 2
      alpha_x: 35
      auxiliary:
      - 97
      - 1
      - 0
      depths:
      - 0
      - 1
      - 2
      - 3
      tuple_lengths:
      - 2
      - 3
      target_law: all G targets including O for oracle; separate affine targets for polynomial interfaces
      rank2_control:
        p: 5
        quadratic:
        - 1
        - 1
        A: 0
        B: 1
        torsion_prime: 3
        alpha: (z*x,y)
      coset_schedule: Every rational finite nonkernel coset, represented by lex first A in its rational fiber, for
        each d0..3; exact full rational-fiber census, no postselection. Report original first-coset slice separately.
        Preserve empty target bases and duplicate actual-base histograms with correct denominator.
    implementation: tools/lattice_ic_factorbase.py
    budget:
      maximum_runs: 1
      maximum_memory_gb: 2
  falsification_conditions:
  - Empty bases/zero new rank are measured results, not infrastructure failures; inconsistent same-base certificates
    are invalid and cannot justify any scientific conclusion.
  interpretation_limits:
  - Synthetic tiny fields only; no asymptotic extrapolation, novelty or performance claim.
  - Development tests are software checks, not admitted scientific evidence.
  - Hypothesis remains proposed until specification/approval; no scientific promotion without independent review.
  status: proposed
  proposed_by: coordinator
  idea_ids:
  - IDEA-20261015-1e8145
  asymptotic_claim: null
  heuristic_assumptions: []
