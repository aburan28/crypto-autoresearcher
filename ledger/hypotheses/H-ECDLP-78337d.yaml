  statement: >
    Fix the prime-order / twist-order
    split of one Weierstrass toy before
    any Weil-restriction index calculus,
    Gaudry factor base, Semaev polynomial,
    cubical point, Tate pairing, or
    Coppersmith solve is read. Stage 0
    asserts only that on E: y^2=x^3+3
    over F_7 the point count is N=13,
    the twist order is N'=3, gcd(13,3)=1,
    there is no F_7 2-torsion, and the
    same construction rejects the
    nearby curve y^2=x^3+2 over F_7
    whose order is 9. Frozen REAL
    affine points are the 12 pairs
    (1,2),(1,5),(2,2),(2,5),(3,3),(3,4),
    (4,2),(4,5),(5,3),(5,4),(6,3),(6,4).
    NULL empty point-list rejected.
    p=0 rejected. This is not a yield
    ratio k, not Gaudry, not Semaev S_m,
    not Velu, and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260906-476f20 Stage 0 hard
    gate is whether a declared prime-order
    Weierstrass toy has N prime, N' =
    2p+2-N, gcd(N,N')=1, and empty
    F_p 2-torsion, and whether a
    composite-order nearby curve is
    rejected. Stage 0 freezes that
    identity as exact tables on F_7.
    No Weil restriction. No factor-base
    decomposition. This is a new
    GOAL-ECDLP-001 object after Stage 0
    of EXP-ECDLP-8eaf6a held as
    P-S0-REFSPLIT (DEC-20260908-df47d8).
    It is not Stage 1 of EXP-ECDLP-8eaf6a
    and not Stage 1 of this experiment.
  predictions:
    - id: P-S0-TWISTCOS
      metric: well-defined prime-order / twist-order table on frozen F_7 toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL N equals
        13, N' equals 3, gcd equals 1,
        affine count equals 12, and
        2-torsion is empty. KF composite
        order 9 is rejected. NULL empty
        point-list is rejected. p=0 is
        rejected. One certified miss after
        fixture_pass is a scoped
        falsification of this instrument
        at the frozen toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF composite
        order 9 is accepted as a
        prime-order target. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REALORDER
      statement: >
        After fixture_pass, REAL fails
        to match N=13, N'=3, gcd=1,
        affine count 12, or empty
        2-torsion. That falsifies only
        P-S0-TWISTCOS at the frozen toy.
