    prose: >
      Toy scale. Stage 0 is exact
      Weierstrass point-count arithmetic
      on one frozen prime-order toy and
      one composite nearby curve. It is
      not Weil restriction, not Gaudry,
      not Semaev S_m, not Velu, not
      Stage 1 of EXP-ECDLP-2a466a, and
      not Stage 1 of EXP-ECDLP-8eaf6a.
      No cryptographic transfer. No
