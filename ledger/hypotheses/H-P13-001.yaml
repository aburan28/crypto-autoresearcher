  falsification_boundary: >-
    These positions assess one frozen external text and one numerical cost
    model. No cryptographic-size computation was performed. The positions do
    not bear on the security of CSIDH/(qt-)Pegasis or torsion-based schemes,
    which the attack does not cover.
    EXTENSION (DEC-20260802-8227b9): the per_entry_cost_calibration position
    additionally binds to exactly one prime (p = 1099511627563, an 80-bit
    F_{p^2}), to the 45 prime degrees actually measured in 2 <= ell <= 211, to
    one pure-Python implementation pair sharing all but its polynomial
    multiplication routine, and to one 396-second run. Its quantifier order is
    "for THIS implementation pair, there exists gamma such that for all ell in
    the measured range" - never the uniform form over implementations or primes.
    The p-axis has n = 1, so the intercept's log-p scaling is derived from the
    committed pipeline and not measured. Nothing here is a cryptographic-scale
    measurement and the extrapolated c carries no claim tier at all.
    EXTENSION (DEC-20260802-48c72c): the per_entry_cost_calibration,
    per_entry_cost_band_structure and extrapolation_law_status positions bind to
    the same single prime, to the 47 prime degrees 2 <= ell <= 211, to the same
    implementation pair, and to one 791.751-second run. THE ~7.5 UNMEASURED
    OCTAVES REMAIN AN ASSUMPTION WHATEVER THE ESTIMATOR DOES: 6.48 octaves from
    the top of W-MID to ell ~ B_opt ~ 2^14.2 at NIST-I, about 18 at
    log2 p = 768, and this experiment does not reduce that gap by a single
    octave. The p-axis is no longer n = 1 - C-PSCALE supplies three points - but
    those points are at 40-, 60- and 80-bit fields and carry a `toy` ceiling, and
    they were taken at ell in {3,5,7,11,13}, disjoint from the window the
    exponent is applied to, which is a residual quantifier-order defect the
    pairing rule does not forbid and a successor contract should. The
    identifiability limit is unchanged and now MEASURED rather than merely named:
    per-entry cost laws that agree over ell <= 211 diverge by a further ~11.5
    bits at ell ~ 2^14.2, and the separator is a third implementation at a
    different multiplication exponent (NC2c), which is unbuilt.
