        pass) are not satisfied by committed artifacts, and the breakthrough
        review tier is non-degradable and unavailable in this harness.
  adjudicated_positions:
    mathematical_validity_conditional: >-
      SUPPORTED at independent-review level (reviewer + scoped tail repair):
      no mathematical error found in any verifiable part; four non-fatal
      defects recorded (Algorithm 1 seeding omission; Corollary 1.2 cites a
      nonexistent Proposition 8.5 of [35] and silently imports GRH for the
      isogeny direction; Section 4.1 'lower bound' mislabeled by ~2.2 bits;
      harmless P0 sign slip). Theorem 1.5's external source arXiv:2607.14624
      verified to exist and to state the used bound (GAP-7 closed).
    heuristic_1_status: >-
      UNPROVEN, NOT FALSIFIED. Producer analysis reduces it to
      near-disjointness of rare events with a correct first moment
      (trace-formula); no exponent-breaking bias found; a constant-factor
      signed bias against smoothness (ramified small primes) identified.
      Red team: the paper's Figures 1-2 test only the body of the
      distribution (u ~ 4-8) under an unidentified size model; the tail at
      the operating point u ~ 13 has zero experimental resolution.
      ADDENDUM (DEC-20260802-8227b9): BATCH-002 measured a cost, not a
      smoothness, and bears on this position in NO WAY. RT-H1..RT-H4 remain
      open and controls NC-3 and NC-6 remain unrun. Recorded here because P0
      sits inside every margin number in the concrete-threat positions below:
      a constant-factor error in P0 at the operating point moves every margin
      row by the same amount.
    concrete_threat_nist1: >-
      INCONCLUSIVE (verdict unchanged; content REVISED by DEC-20260802-8227b9
      after NC-2; the prior text is preserved verbatim under
      superseded_positions below and is NOT deleted).
      The deciding measurement was executed under a contract frozen before any
      datum (EXP-PEC-6be870, frozen at 0e773e9a) and independently reviewed.
      TWO SCENARIOS ARE RETIRED. (i) "The overhead swallows the NIST-I
      advantage" - retired: it rested on red-team RT-C1's calibration gamma = 2,
      which the Red Team itself retracted in an independent session as an
      arithmetic error (its step (b) divides by ell+1 and its step (c) then
      charges ell^2 per entry anyway; Lemma 3.3 amortises over batches of
      <= ell+1 entries and RUN-PEC-6be870-a confirms entries = ell+1 at all 484
      samples), and which additionally headlined the c = 2.0 row while its own
      derivation supported only c >= 1.78. (ii) The c = 0 corner inherited from
      Section 4.1 - refuted by the measurement itself: per-entry cost is 1843.5
      to 94023.4 counted F_{p^2} multiplications over 2 <= ell <= 211 at
      p ~ 2^40, not 1, and even the most attack-favourable constructible
      scenario (quasi-linear or batched multiplication) still carries ~11.6 bits
      of modelled NIST-I overhead because of an irreducible ell-independent
      floor of order log p.
      WHAT REMAINS OPEN: whether the modelled advantage over Delfs-Galbraith at
      w = 2^30 is roughly 5 bits or roughly 23 bits. The defensible span is
      5.40 to 22.67 bits, width 17.27 bits, against irreproducibility bands of
      2.2309 bits (NIST-I time) and 3.5133 bits (largest deviation anywhere in
      RUN-P13VOW-001's control). The span's width is set almost entirely by
      quantities NC-2 did not measure - an unimplemented quasi-linear or batched
      Sutherland-type multiplication routine (up to 13.25 bits) and an unmeasured
      p-scaling of the intercept (2.7 bits) - not by anything it did measure.
      A 17.3-bit interval is not a concrete threat assessment, and AGENTS.md
      rule 7 forbids presenting an 80-bit-field measurement over ell <= 211 as
      validation at NIST-I. Both independent reviewers reach INCONCLUSIVE
      separately and the Coordinator concurs.
      NARROWING ACHIEVED (real, and not a determination): the defensible margin
      interval at w = 2^30 went from [2.27, 34.27] bits (width 32.00, lower end
      INSIDE the irreproducibility band) to [5.40, 22.67] bits (width 17.27,
      lower end OUTSIDE both bands) - 46% of the prior uncertainty width.
    concrete_threat_nist3_nist5: >-
      NOT THREATENED under all tested overhead scenarios (margins 19.6-50
      bits at c = 2).
      ADDENDUM (DEC-20260802-8227b9): unchanged as a position. The
      extrapolation-law defect recorded below applies to the NIST-III/V rows
      equally and is repaired by the same zero-compute NC2b recomputation; since
      the defect UNDERSTATES overhead and these margins survive even the
      overstated c = 2 scenario, the position is not in doubt from that
      direction. It inherits every limitation of the c-model, including the
      untested Heuristic 1 tail that sets P0.
    per_entry_cost_calibration: >-
      NEW POSITION (DEC-20260802-8227b9), the batch's solid positive result.
      The frozen paper's Section 4.1 assumption that "constructing a table costs
      a single F_{p^2}-operation per entry" is REFUTED AT THE TESTED SCALE, IN
      THE ATTACK'S DISFAVOUR. Measured in the paper's own unit at
      p = 1099511627563 (80-bit F_{p^2}), median over an 8-member j-pool: 1843.5
      counted F_{p^2} multiplications per entry at ell = 2 and 94023.4 at
      ell = 211, i.e. 10.8 to 16.5 bits above the assumed 1. The result does not
      depend on the defective extrapolation law, on the fitted exponent, or on
      the response-heterogeneity defect: the run's own null object, whose
      per-entry cost is O(1) in ell BY CONSTRUCTION, still costs ~4900-5100
      multiplications per entry (2^12.3). The ell-independent component is
      structural in the committed pipeline - root-finding requires x^{p^2} mod f,
      i.e. ~2*log2(p) polynomial squarings per batch of ell+1 entries - so no
      choice of multiplication routine removes it; only its polynomial-degree
      cofactor changes. Fitted exponents on homogeneous series over the measured
      range: 0.9332 (schoolbook IMPL-A, ell 11..211) and 0.7929 (Karatsuba
      IMPL-B, ell 11..101), with an ell-independent prefactor of 2^8.92 per
      entry. Both anchors named before any datum - the paper's gamma = 0 and
      RT-C1's gamma = 2 - fall outside the measured interval for this
      implementation pair. SCOPE: `medium` claim tier; one prime, ell <= 211, one
      pure-Python implementation pair, one 396-second run; a measured exponent
      from an unoptimised implementation is an UPPER bound on the achievable
      per-entry exponent and simultaneously a LOWER bound with respect to the
      costs excluded in the attack's favour (Phi_ell storage and I/O, coefficient
      reduction, hashing, table access). The two directions are not netted.
    extrapolation_law_status: >-
      NEW POSITION (DEC-20260802-8227b9). The pre-registered law
      c = gamma * log2(B_opt) / sqrt(log2 p) is DEFECTIVE and its outputs are
      under a citation prohibition. It maps the fit's SLOPE and discards its
      INTERCEPT, implicitly setting A = 1 while RUN-PEC-6be870-a measured
      A = 2^8.924 (fit.windows W-MID intercept = 8.924066290325673). The
      refutation is internal to the run: applied to the run's own C-NULL object,
      whose per-entry cost is O(1) in ell by construction and which was measured
      at 2^12.3 multiplications per entry, the law returns c_null ~ 0 - it
      reports "no overhead" for an object measured at ~4900 operations per entry
      against an assumed 1. Intercept-corrected, with the intercept's log-p
      scaling, c at NIST-I is ~1.42-1.80, not the reported 0.864. Repair: NC2b,
      zero compute, using the intercepts already committed, validated by
      confirming it returns c_null ~ 0.77 for C-NULL. Until NC2b is on the
      record, no record derived from this hypothesis may cite c = 0.864 (or
      0.771 / 0.868 / 1.0389 / the c_kappa values) as a measured or modelled
      overhead for NIST-I.
  superseded_positions:
    - field: concrete_threat_nist1
      superseded_by: DEC-20260802-8227b9
      superseded_at: "2026-08-02"
      prior_text_verbatim: >-
        INCONCLUSIVE. At zero hidden overhead the vOW middle regime beats
        Delfs-Galbraith at all tested budgets, but a defensible per-entry cost
        calibration (c ~ 1.8) shrinks the NIST-I margin to ~2.3 bits, inside
        the paper's own +-3.51-bit irreproducibility band.
      reason: >-
        The clause "a defensible per-entry cost calibration (c ~ 1.8) shrinks
        the NIST-I margin to ~2.3 bits" is no longer supported. It conflated two
        numbers - the c ~ 1.8 the red team derived and the c = 2.0 row it quoted
        (2.27 bits, versus 5.87 bits at c = 1.78) - and the derivation behind
        both contained an arithmetic error the Red Team has since retracted in
        an independent session against committed data. The verdict INCONCLUSIVE
        is unchanged; its content is replaced. The prior text is retained here
        verbatim and is not deleted, per AGENTS.md rule 4.
      coincidence_flag: >-
        Intercept-corrected c at NIST-I now lands at ~1.42-1.80, numerically
        near the retired 1.8, for an entirely different and better-supported
        reason (the discarded intercept, not the exponent). This is a
        COINCIDENCE, not a confirmation of the prior position, and no record may
        read it as one. The flag is the Red Team's own and is now official.
  binding_constraints_on_downstream_records:
    - >-
      No record may cite c = 0.864 at NIST-I (nor 0.771 / 0.868 / 1.0389 / the
      c_kappa values) as this programme's overhead estimate until NC2b is on the
      record. They may be cited only as the output of a law known to be
      defective, with DEC-20260802-8227b9 adjudication A attached.
    - >-
      No record may quote gamma = 0.9739, the curvature 0.0488, or
      gamma_local_top = 1.1706 without stating that the fitted response changes
      definition at the ell = 101/103 seam and giving the homogeneous readings
      (0.9332 and 0.7929; curvature 0.0225 with CI [0.0194, 0.0366];
      gamma_local_top 1.0187). The reported gamma exceeds BOTH constituents of
      the pointwise minimum it is computed from, which no genuine exponent can
      do.
    - >-
      The single_exponent_model_misspecified declaration STANDS but at roughly
      half its reported magnitude, and the residual curvature is concentrated at
      the small-ell end - the regime the contract itself declared
      non-extrapolating. Neither 1.1706 nor 1.0187 is evidence that the exponent
      is still rising toward 2 at ell ~ 2^14.2.
    - >-
      Margin statements are quoted at w = 2^30; the larger-w rows are not read as
      improvements, because the model's +0.5-bit-per-memory-bit credit is
      approximately cancelled by real access latency beyond DRAM (RT-C2 as
      narrowed).
    - >-
      RUN-PEC-6be870-a did NOT meet its completion gate (25 of 26 core ell;
      ell = 97 lost to a transient fetch obstruction). No record may describe it
      as having met it, and no record may treat that obstruction as mathematical
      evidence about the attack (AGENTS.md rule 5).
  falsification_boundary: >-
    These positions assess one frozen external text and one numerical cost
    model. No cryptographic-size computation was performed. The positions do
    not bear on the security of CSIDH/(qt-)Pegasis or torsion-based schemes,
    which the attack does not cover.
    EXTENSION (DEC-20260802-8227b9): the per_entry_cost_calibration position
    additionally binds to exactly one prime (p = 1099511627563, an 80-bit
    F_{p^2}), to the 45 prime degrees actually measured in 2 <= ell <= 211, to
    one pure-Python implementation pair sharing all but its polynomial
    multiplication routine, and to one 396-second run. Its quantifier order is
    "for THIS implementation pair, there exists gamma such that for all ell in
    the measured range" - never the uniform form over implementations or primes.
    The p-axis has n = 1, so the intercept's log-p scaling is derived from the
    committed pipeline and not measured. Nothing here is a cryptographic-scale
    measurement and the extrapolated c carries no claim tier at all.
