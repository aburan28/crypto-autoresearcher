        concrete_threat_nist1, per_entry_cost_calibration and
        extrapolation_law_status is revised (prior text preserved verbatim under
        superseded_positions) and one new position is added.
        NO STATUS TRANSITION IS SUPPORTED, for the same four reasons as
        BATCH-002 plus one that is now sharper: gate 2 of the promotion gates
        requires every conditional dependence to carry archived validation
        evidence or a scheduled validation experiment, and Heuristic 1 - the
        heuristic the theorem is conditional on - has had NO validation
        experiment run in three of four budgeted batches. Gate 4 remains
        unsatisfiable in this harness because review-breakthrough is
        non-degradable.
  adjudicated_positions:
    mathematical_validity_conditional: >-
      SUPPORTED at independent-review level (reviewer + scoped tail repair):
      no mathematical error found in any verifiable part; four non-fatal
      defects recorded (Algorithm 1 seeding omission; Corollary 1.2 cites a
      nonexistent Proposition 8.5 of [35] and silently imports GRH for the
      isogeny direction; Section 4.1 'lower bound' mislabeled by ~2.2 bits;
      harmless P0 sign slip). Theorem 1.5's external source arXiv:2607.14624
      verified to exist and to state the used bound (GAP-7 closed).
    heuristic_1_status: >-
      UNPROVEN, NOT FALSIFIED. Producer analysis reduces it to
      near-disjointness of rare events with a correct first moment
      (trace-formula); no exponent-breaking bias found; a constant-factor
      signed bias against smoothness (ramified small primes) identified.
      Red team: the paper's Figures 1-2 test only the body of the
      distribution (u ~ 4-8) under an unidentified size model; the tail at
      the operating point u ~ 13 has zero experimental resolution.
      ADDENDUM (DEC-20260802-8227b9): BATCH-002 measured a cost, not a
      smoothness, and bears on this position in NO WAY. RT-H1..RT-H4 remain
      open and controls NC-3 and NC-6 remain unrun. Recorded here because P0
      sits inside every margin number in the concrete-threat positions below:
      a constant-factor error in P0 at the operating point moves every margin
      row by the same amount.
      ADDENDUM (DEC-20260802-48c72c): BATCH-003 likewise measured a cost and
      bears on this position in NO WAY; the run says so itself. RT-H1..RT-H4 are
      untouched and NC-3 and NC-6 are STILL UNRUN, now for the third consecutive
      batch. THE STATUS OF THIS POSITION IS UNCHANGED AND ITS PRIORITY IS NOT:
      it is now the BINDING uncertainty in the programme rather than a background
      caveat. The c-programme has resolved the measured-gamma contribution to a
      4.805-bit span and is at its method ceiling (RT3-P3: gamma = exponent(M) - 1
      and M is at most schoolbook, so this method can only narrow the overhead
      from above within [0, 1] in the exponent). P0 multiplies every one of the
      eighteen margin rows identically. Continuing to refine c while P0 carries an
      unbounded constant-factor uncertainty is optimising the wrong term, and the
      window to correct it closes with BATCH-004. Independently, promotion gate 2
      of agents/coordinator.md requires a conditional result to be PAIRED with a
      heuristic-validation experiment in the same or the following batch; that
      pairing is now three batches overdue, and it is the Coordinator's
      obligation rather than a reviewer's preference.
    concrete_threat_nist1: >-
      INCONCLUSIVE (verdict unchanged through three batches; content REVISED by
      DEC-20260802-48c72c after the NC2b/NC2a repair; the two prior texts are
      preserved verbatim under superseded_positions below and are NOT deleted).
      THE SIGN IS ROBUST. All eighteen measured-gamma readings (6 (series,
      window) fits x 3 alphas) put the modelled advantage over Delfs-Galbraith at
      w = 2^30 in [8.3498, 13.1544] bits, a span of 4.805 bits whose WORST member
      clears the 2.2309-bit NIST-I time irreproducibility band by 6.1 bits and
      the 3.5133-bit maximum-deviation band by 4.8 bits.
      THE MAGNITUDE IS NOT. Adding assumption L4 - batched Sutherland-type or
      quasi-linear evaluation, UNIMPLEMENTED, worth 11.50 to 13.25 bits, i.e. 48
      to 59 per cent of the corrected overhead - the defensible span is
      [8.3498, 22.2927] bits at alpha = 1 throughout (width 13.9429) or
      [8.3498, 24.9708] allowing alpha in {0, 1, alpha_hat} (width 16.6210). That
      is four to seven times the irreproducibility band and its width is still
      set almost entirely by a subroutine nobody has written - which the frozen
      paper itself names as the expected implementation route. A 14-to-17-bit
      interval is not a concrete threat assessment.
      WHAT CHANGED: the surviving question is no longer "5 bits or 23 bits" but
      "8 bits or 22 bits", on a HOMOGENEOUS, COMPLETE-GRID, FULLY
      NULL-CONTROLLED measurement whose estimator passed a real self-validation
      gate against a real defect. Two scenario families are dead: the near-zero
      margin (retired in BATCH-002 on the Red Team's own retraction, and killed
      here by a METHOD CEILING rather than by a flat measurement) and c = 0
      (refuted by the measurement itself).
      NARROWING ACHIEVED (real, and not a determination): the defensible interval
      went from [5.40, 22.67] bits (width 17.27) to [8.3498, 22.2927] (width
      13.9429) on the like-for-like alpha = 1 convention - 19.3 per cent, with
      THE LOW END UP 2.95 BITS - and the old 5.40 low end NO LONGER EXISTS,
      because it came from a quadratic on a compositionally mixed response.
      ADDITIONAL REASONS THE VERDICT DOES NOT MOVE: a pre-registered falsifier
      FIRED (FC-4, MECHANISM-INCONSISTENT) and is not lifted by post-hoc
      restriction; AGENTS.md rule 7 forbids presenting an 80-bit-field
      measurement over ell <= 211 as validation at NIST-I; every margin row is
      0.60 to 1.00 bits PESSIMISTIC by the unpriced charging-point assumption
      (RT3-C1); and the BASELINE side of the comparison has still not been
      instrumented at all (RT3-C9, plus the unquantified constant k from the
      frozen bibliography's [15] and [3]). Both independent reviewers reach
      INCONCLUSIVE separately and the Coordinator concurs.
    concrete_threat_nist3_nist5: >-
      NOT THREATENED under all tested overhead scenarios (margins 19.6-50
      bits at c = 2).
      ADDENDUM (DEC-20260802-8227b9): unchanged as a position. The
      extrapolation-law defect recorded below applies to the NIST-III/V rows
      equally and is repaired by the same zero-compute NC2b recomputation; since
      the defect UNDERSTATES overhead and these margins survive even the
      overstated c = 2 scenario, the position is not in doubt from that
      direction. It inherits every limitation of the c-model, including the
      untested Heuristic 1 tail that sets P0.
      ADDENDUM (DEC-20260802-48c72c): unchanged as a position, now on repaired
      numbers. The corrected bracket at those levels is NIST-III
      [1.232366, 1.488390] and NIST-V [1.178237, 1.435130], and both remain far
      inside the margins that survive the retired c = 2 scenario. It continues to
      inherit every limitation of the c-model, including the untested Heuristic 1
      tail that sets P0 and the unquantified baseline constant k.
    per_entry_cost_calibration: >-
      REVISED AND STRENGTHENED (DEC-20260802-48c72c); prior text preserved
      verbatim under superseded_positions.
      The frozen paper's Section 4.1 assumption that "constructing a table costs
      a single F_{p^2}-operation per entry" is REFUTED AT THE TESTED SCALE, IN
      THE ATTACK'S DISFAVOUR - now on a HOMOGENEOUS response over a COMPLETE
      47-prime grid (2 <= ell <= 211, 47 acquired, 47 admitted, 0 excluded,
      ell = 97 re-acquired), with BOTH implementations at every admitted ell at
      the identical j-set {0..7}, and with C-NULL covering 100 per cent of every
      fitted window (47/47, 43/43, 8/8) by construction rather than by luck.
      SEAM-FREE EXPONENTS on the pre-registered primary window W-MID (43 admitted
      ell >= 11), each independently reproduced by both reviewers from raw
      samples: gamma_A = 0.9328644281 (schoolbook, fitted level at ell = 1 of
      2^9.2983509117) and gamma_B = gamma_S-MIN = 0.8100336227 (Karatsuba,
      2^9.7307533347). S-MIN coincides with S-B at every admitted ell, so it
      carries no information beyond S-B.
      THE REFUTATION DOES NOT DEPEND on the exponent, on the extrapolation law,
      or on the seam: the run's own null object, whose per-entry cost is O(1) in
      ell BY CONSTRUCTION, still costs 4914.45 to 5118.83 counted F_{p^2}
      multiplications per entry, i.e. REF_null = 12.2595 MEASURED bits above the
      assumed 1. The ell-independent component is structural in the committed
      pipeline (root-finding requires x^{p^2} mod f, i.e. ~2*log2 p polynomial
      squarings per batch of ell+1 entries), so no choice of multiplication
      routine removes it; only its polynomial-degree cofactor changes.
      SCOPE: `medium` claim tier; one prime p = 1099511627563, ell <= 211, one
      pure-Python implementation pair sharing every line but poly_mul, one
      791.751-second run. A measured exponent from an unoptimised implementation
      is an UPPER bound on the achievable per-entry exponent and simultaneously a
      LOWER bound with respect to the costs excluded in the attack's favour. The
      two directions are not netted. The supported quantifier order is "for THIS
      implementation pair, at THIS p, there exists gamma such that for all ell in
      [11, 211]"; gamma_A and gamma_B are NOT independent estimates and their
      difference 0.1228308054 measures the multiplication routine under a FIXED
      split structure.
    per_entry_cost_band_structure: >-
      NEW POSITION (DEC-20260802-48c72c), and the batch's real structural
      contribution.
      The measured per-entry cost curve carries the RECURSION STRUCTURE OF ITS
      OWN MULTIPLICATION ROUTINE as a phase-locked sawtooth. With
      KARATSUBA_THRESHOLD = 16 in the committed instrument, residuals about each
      series' own W-MID fit DROP at ell = 17, 37, 67 and 131 - exactly the
      recursion band boundaries - and rise monotonically within each band, on
      IMPL-B and not on IMPL-A. The discriminating control is a NULL ON THE
      EXPLANATION and it is free: an integer `depth` regressor defined
      identically for both series takes -0.0749 bits per recursion level on
      IMPL-B (R^2 0.999158 -> 0.999758, max |residual| 0.0537 -> 0.0293, 72 per
      cent of the residual variance) and +0.0066 on IMPL-A, where it does
      nothing. The decomposition closes: 0.8919 - 0.0749 = 0.8170 against the
      measured W-MID slope 0.8100. The Validator reached the same mechanism from
      the instrument rather than the residuals: poly_rem_monic is schoolbook
      Theta(ell^2) and SHARED by both implementations, so IMPL-B becomes
      reduction-dominated as ell grows and its measured exponent must rise toward
      IMPL-A's - confirmed by the A/B ratio saturating (1.000 at ell 13, 1.295 at
      101, 1.396 at 151, 1.4055 at 199, 1.4049 at 211) and by the W-TOP exponent
      gap collapsing to 0.012692 against 0.122831 on W-MID.
      TWO CONSEQUENCES, PULLING OPPOSITE WAYS, NEITHER NETTED.
      (1) Anomaly A-3 (gamma_B 0.810034 on W-MID against 0.958496 on W-TOP) is an
      IDENTIFIED IMPLEMENTATION ARTIFACT and, correctly paired under the
      contract's binding pairing_rule, is worth 1.007 bits of NIST-I margin
      (2.774 at log2 p = 768) rather than an exponent revision - because W-TOP's
      higher slope comes with a lower intercept and the two nearly cancel.
      Deleting the pairing rule makes the same anomaly cost 2.4 bits and fall
      outside the published bracket, so the rule is load-bearing.
      (2) gamma_B = 0.810 IS A TRANSIENT, NOT AN ASYMPTOTIC EXPONENT, because
      IMPL-B leaves the shared reduction schoolbook, so the Karatsuba gain must
      saturate. The onset is in the committed data: per-band increments of
      log2(A/B) are +0.1118, +0.1178, +0.1163, +0.0921, a 21 per cent fall at the
      last step, with a within-band positioning bias below 0.003 bits. On four
      increments this is SUGGESTIVE, NOT ESTABLISHED. THEREFORE THE BRACKET'S LOW
      END IS THE OPTIMISTIC READING and the high end is the defensible one for
      this implementation family: if gamma_B -> gamma_A = 0.9329, the low end
      rises to c = 1.436129 and the margin falls 13.036 -> 11.291, i.e. -1.75
      bits.
      STATUS: the band model is a REGRESSOR FITTED TO COMMITTED DATA, not a
      proof. NC2a-BAND - extending past the 255/257 and 511/521 boundaries and
      moving the threshold to 8 so the boundaries must MOVE with it - is what
      would prove the mechanism rather than fit it.
    extrapolation_law_status: >-
      REPAIRED AND CITABLE IN A BOUNDED FORM (DEC-20260802-48c72c); prior text
      preserved verbatim under superseded_positions.
      The corrected law
      c = [log2 A + alpha*log2(log2 p_level / log2 p_meas) + gamma*log2 B_opt]
      / sqrt(log2 p_level), with (log2 A, gamma) always the intercept and slope
      of the SAME fit of the SAME series over the SAME window, PASSES its
      pre-registered self-validation gate NC2b-G1 at a worst miss of 0.271670
      bits of a 0.75-bit tolerance (at W-MID, log2 p = 768), leaving 0.478330
      bits of margin, while the SUPERSEDED law applied to the same null object
      misses by 12.176314 to 12.605090 bits and FAILS at every one of the ten
      evaluation points. c_null at NIST-I is 0.759087 against the ~0.77
      pre-registered by DEC-20260802-8227b9. Both reviewers recomputed the gate
      and the corrected c independently, agreeing to ~1e-16.
      THE PAIRING RULE IS THE STRUCTURAL FIX. Adjudication A's defect (pairing a
      measured slope with an assumed intercept A = 1) was one instance of a
      family; the rule closes the family, and it is what makes A-3 cost 1.007
      bits instead of 2.4.
      THE LAW'S LIMITS ARE EQUALLY OFFICIAL AND TRAVEL WITH EVERY CITATION.
      (i) The gate's tolerance derivation contains NO VARIANCE TERM. Analytic 95
      per cent prediction intervals on the extrapolated level are +/- 0.3523 bits
      on the committed null's W-MID window at log2 B_opt = 26.1 and +/- 1.3626 on
      the 8-point W-TOP arm, so the PASS is about 1.4 noise half-widths and NOT a
      0.478-bit cushion, and the failing confirmatory arm (A-1, 0.920520 bits at
      W-TOP / 768) has no resolving power in either direction. The gate validates
      LEVEL RETENTION only and has no power against L1, L2, L5 or the pairing
      rule. This is a defect of the frozen contract, not of the execution.
      (ii) The charging point at ell = B_opt OVERSTATES the entry-weighted
      table-build cost by 0.60 to 1.00 bits at every field size (exact
      enumeration 0.598 and 0.625 at matched w; Dickman asymptotic 0.868-1.001),
      so every c is overstated by 0.038-0.063 and every margin understated by 0.6
      to 1.0 bits.
      (iii) alpha = 1 is DERIVED and MECHANISM-INCONSISTENT, never
      measured-consistent: FC-4 fired (|1.1596976732 - 0.9935080487| =
      0.1661896244 > 0.15), and although the firing is driven by ell = 3 and 5
      alone - both below the Karatsuba threshold, where the two implementations
      are bit-identical - A POST-HOC RESTRICTION OF THE ell-GRID CANNOT LIFT A
      PRE-REGISTERED FALSIFIER. FC-2 correctly did NOT fire: the jackknife
      interval [1.1342844597, 1.1778020727] OVERLAPS [0.85, 1.15] without
      containment, and it missed firing by 1.35 per cent of the point estimate.
      CITABLE FORM: the BRACKET, never a single number. At SQIsign NIST-I,
      c in [1.327077, 1.576444], i.e. a modelled advantage over Delfs-Galbraith
      of 9.05 to 13.04 bits at w = 2^30; NIST-III [1.232366, 1.488390]; NIST-V
      [1.178237, 1.435130]; log2 p = 576 [1.158104, 1.414551]; log2 p = 768
      [1.114020, 1.367929]. The bracket is a span across two declared modelling
      choices (implementation; p-scaling) and is NOT a confidence interval. It is
      a MODEL SUBSTITUTION and carries NO claim tier. The eight mandatory
      attachments are enumerated in DEC-20260802-48c72c.citability_ruling and
      bind every downstream record.
  superseded_positions:
    - field: concrete_threat_nist1
      superseded_by: DEC-20260802-8227b9
      superseded_at: "2026-08-02"
      prior_text_verbatim: >-
        INCONCLUSIVE. At zero hidden overhead the vOW middle regime beats
        Delfs-Galbraith at all tested budgets, but a defensible per-entry cost
        calibration (c ~ 1.8) shrinks the NIST-I margin to ~2.3 bits, inside
        the paper's own +-3.51-bit irreproducibility band.
      reason: >-
        The clause "a defensible per-entry cost calibration (c ~ 1.8) shrinks
        the NIST-I margin to ~2.3 bits" is no longer supported. It conflated two
        numbers - the c ~ 1.8 the red team derived and the c = 2.0 row it quoted
        (2.27 bits, versus 5.87 bits at c = 1.78) - and the derivation behind
        both contained an arithmetic error the Red Team has since retracted in
        an independent session against committed data. The verdict INCONCLUSIVE
        is unchanged; its content is replaced. The prior text is retained here
        verbatim and is not deleted, per AGENTS.md rule 4.
      coincidence_flag: >-
        Intercept-corrected c at NIST-I now lands at ~1.42-1.80, numerically
        near the retired 1.8, for an entirely different and better-supported
        reason (the discarded intercept, not the exponent). This is a
        COINCIDENCE, not a confirmation of the prior position, and no record may
        read it as one. The flag is the Red Team's own and is now official.
    - field: concrete_threat_nist1
      superseded_by: DEC-20260802-48c72c
      superseded_at: "2026-08-02"
      prior_text_verbatim: >-
        INCONCLUSIVE (verdict unchanged; content REVISED by DEC-20260802-8227b9
        after NC-2; the prior text is preserved verbatim under
        superseded_positions below and is NOT deleted).
        The deciding measurement was executed under a contract frozen before any
        datum (EXP-PEC-6be870, frozen at 0e773e9a) and independently reviewed.
        TWO SCENARIOS ARE RETIRED. (i) "The overhead swallows the NIST-I
        advantage" - retired: it rested on red-team RT-C1's calibration gamma = 2,
        which the Red Team itself retracted in an independent session as an
        arithmetic error (its step (b) divides by ell+1 and its step (c) then
        charges ell^2 per entry anyway; Lemma 3.3 amortises over batches of
        <= ell+1 entries and RUN-PEC-6be870-a confirms entries = ell+1 at all 484
        samples), and which additionally headlined the c = 2.0 row while its own
        derivation supported only c >= 1.78. (ii) The c = 0 corner inherited from
        Section 4.1 - refuted by the measurement itself: per-entry cost is 1843.5
        to 94023.4 counted F_{p^2} multiplications over 2 <= ell <= 211 at
        p ~ 2^40, not 1, and even the most attack-favourable constructible
        scenario (quasi-linear or batched multiplication) still carries ~11.6 bits
        of modelled NIST-I overhead because of an irreducible ell-independent
        floor of order log p.
        WHAT REMAINS OPEN: whether the modelled advantage over Delfs-Galbraith at
        w = 2^30 is roughly 5 bits or roughly 23 bits. The defensible span is
        5.40 to 22.67 bits, width 17.27 bits, against irreproducibility bands of
        2.2309 bits (NIST-I time) and 3.5133 bits (largest deviation anywhere in
        RUN-P13VOW-001's control). The span's width is set almost entirely by
        quantities NC-2 did not measure - an unimplemented quasi-linear or batched
        Sutherland-type multiplication routine (up to 13.25 bits) and an unmeasured
        p-scaling of the intercept (2.7 bits) - not by anything it did measure.
        A 17.3-bit interval is not a concrete threat assessment, and AGENTS.md
        rule 7 forbids presenting an 80-bit-field measurement over ell <= 211 as
        validation at NIST-I. Both independent reviewers reach INCONCLUSIVE
        separately and the Coordinator concurs.
        NARROWING ACHIEVED (real, and not a determination): the defensible margin
        interval at w = 2^30 went from [2.27, 34.27] bits (width 32.00, lower end
        INSIDE the irreproducibility band) to [5.40, 22.67] bits (width 17.27,
        lower end OUTSIDE both bands) - 46% of the prior uncertainty width.
      reason: >-
        The verdict INCONCLUSIVE is unchanged for a third batch; the numbers are
        replaced because the measurement they rested on has been superseded by a
        seam-free one and the estimator has been repaired. Specifically: the
        5.40 low end NO LONGER EXISTS - it came from a quadratic on a
        compositionally inhomogeneous response, and adjudication B's seam is now
        removed - and the 22.67 high end is replaced by 22.2927 (alpha = 1
        throughout) or 24.9708 (allowing alpha in {0, 1, alpha_hat}) on the
        corrected law. The claim that the width is set by "an unmeasured
        p-scaling of the intercept (2.7 bits)" is also corrected: C-PSCALE has
        now measured alpha at three primes and the whole alpha question is worth
        0.4277 bits at NIST-I, not 2.7 - though its pre-registered falsifier FC-4
        fired and its derivation is contradicted in mechanism. The prior text is
        retained here verbatim and is not deleted, per AGENTS.md rule 4.
