hypothesis:
  id: H-P13-001
  title: "Wesolowski 2026 p^{1/3+o(1)} attack on the supersingular isogeny problem: conditional validity and concrete threat"
  class: external_claim_assessment
  source_ref: SRC-P13-WESOLOWSKI-2026
  statement: >-
    Under Heuristic 1 (the degree of the smallest isogeny E -> E^{(p)} is
    B-smooth with probability u^{-u(1+o(1))}, u = log(p/2)/(3 log B)), a Las
    Vegas algorithm solves OneEnd, EndRing, and Isogeny for supersingular
    curves over F_{p^2} in expected time and memory p^{1/3+o(1)}, improving on
    the stable p^{1/2}(log p)^{O(1)} baseline; the van Oorschot-Wiener
    middle-memory regime may concretely threaten SQIsign-family parameters.
  mechanism: >-
    Guaranteed short conjugate isogeny (degree <= (p/2)^{1/3}, Theorem 1.5 /
    arXiv:2607.14624) + smoothness rerandomization by 2-isogeny walks +
    meet-in-the-middle on B-smooth isogenies of degree <= B^{1/2}(p/2)^{1/6}.
