# H-HAWK-458e97 — specified from IDEA-20261005-a5cf85.
# Protocol approval is DEC-20261005-d9b692. No norm-one unit of a
# quaternion order was enumerated in this design.
hypothesis:
  id: H-HAWK-458e97
  question_id: RQ-HAWK-001
  source_proposal: IDEA-20261005-a5cf85
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-HAWK-001.yaml does not name a goal_id in the
    record read on 2026-10-05. This design does not attach one.
  status: approved
  status_note: >-
    approved means the rank protocol in EXP-HAWK-3510a9 is approved for
    a later executor. It does not mean r = 0, and it does not mean a
    HAWK key was recovered. Status moves only by DEC-20261005-d9b692
    under the standing user authorization of 2026-09-06.
  proposed_by: coordinator
  conversion_note: >-
    The two readings, the ramification gate, the Gram-bound shell, the
    Smith-normal-form rank, and the two meter rings are carried from
    IDEA-20261005-a5cf85. The Coordinator pre-registered r = 0 with a
    finite shell as the reading under test, so that r >= 1 is a
    negative result. That choice was fixed before any enumeration.
    IDEA-20261005-3a18d1 is already cited by H-PAIR-c5e676 and is not
    this hypothesis.

  statement: >-
    TEST BOUNDARY. One maximal order O in a definite quaternion algebra
    over Q whose printed ramification set is exactly {3, infinity}.
    O^1 is the set of elements of O with reduced norm exactly 1. r is
    the Z-rank of the free part of the abelianization of O^1. No other
    prime, no second order, and no HAWK parameter set is in scope.

    PRE-REGISTERED PREDICTION, fixed before any run. The norm-one shell
    is finite and r = 0. That is the reading in which every homomorphism
    from O^1 into a Euclidean space has image {0}. The negative side of
    the same prediction is r >= 1, which means a free abelian log image
    of positive rank exists at this toy. A third outcome, an infinite
    shell with r = 0, is neither success nor that falsification.

    DISTINGUISHABLE OUTCOMES. (1) Ramification exactly {3, infinity},
    shell finite, r = 0, both meter checks passing, and the two listings
    agreeing: the finite-torsion reading holds at this order. This does
    not prove short-generator hardness and does not recover a HAWK key.
    (2) The same gates, with r >= 1: the finite-torsion reading is false
    at this order. This does not supply a decoder. (3) Shell infinite
    and r = 0: neither the finite reading nor a positive-rank lattice
    reading holds. (4) Wrong ramification, a meter mismatch, disagreeing
    listings, an unproven bound, or a timeout: inconclusive.

  mechanism: >-
    A Dirichlet logarithm lands in an abelian torsion-free target, so it
    kills the commutator subgroup and the torsion. The largest rank of a
    discrete log image equals r. The projection from O^1 onto the free
    part of its abelianization discards the commutator and the torsion.
    If r = 0 that projection is the identity element in every log target.
    If r >= 1 the retained part is a positive-rank lattice, and
    multiplication on that part becomes addition after the log.
    KN-TECH-081, read in this design session, separates this
    non-commutative unit group from the cyclotomic log-unit lattice of
    KN-TECH-046 and records no measured rank. KN-OPEN-024 Q2 asks
    whether such a lattice exists for stage-2 decoding. This hypothesis
    measures r at one toy order and does not answer Q2 at HAWK size.

  assumptions:
    - The algebra is accepted only when the system prints ramification exactly {3, infinity}. A model string is not assumed correct in advance.
    - r is a lattice rank in a Euclidean space. A non-abelian word metric is outside this reading.
    - One maximal order at p = 3 is the whole sample. No transfer.
    - The Eurocrypt 2025 rank-2 module-LIP to nrd-PIP reduction is unchecked. HAWK key recovery is unclaimed.
    - The meter rings are not O and are not the cyclotomic lattice of KN-TECH-046.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is one rank measurement at p = 3. It is not a proof, an
      asymptotic attack, a certificate family, or a closure of Q1 or Q2.

  asymptotic_claim:
    problem: none — no HAWK attack and no ECDLP improvement is claimed
    prior_best: >-
      g >= 2 PIP in M_g(O) is a recalled heuristic expected polynomial-time
      report. g = 1 stage-2 structure is unmeasured in KN-OPEN-024.
    time_exponent: unchanged; no exponent against HAWK parameters
    memory_exponent: unchanged; no exponent against HAWK parameters
    hidden_cofactor: none claimed
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        At p = 3, once ramification is exactly {3, infinity}, the reduced
        norm is a positive definite quaternary form, and the set of basis
        coefficient vectors with Q(x) = 1 is finite and equal to the set
        found by searching the box cut out by the smallest eigenvalue of
        the Gram matrix.
      random_model_justification: >-
        The finiteness statement is recalled from Borel-Harish-Chandra
        and was not opened. It is the statement under test. It imitates
        no Dickman or Canfield-Erdos-Pomerance law. The sample is p = 3
        only.
      supporting_results: []
      validation_experiment_ids:
        - EXP-HAWK-3510a9
      falsification_condition: >-
        Two completed listings of the same shell disagree, or a completed
        listing inside the Gram bound finds r >= 1. A timeout or an
        unproven bound does not falsify H1.

  structural_ingredients:
    - description: >-
        Q2 asks whether the norm-one unit group of a maximal order in
        B_{p, infinity} has a logarithmic lattice a decoder could use.
        No rank is recorded. The Eurocrypt 2025 reduction is relayed
        and not verified.
      citation: KN-OPEN-024
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-05 read
        knowledge/open-problems/KN-OPEN-024.md
      role: the stage-2 question this toy does not close
    - description: >-
        PIP and short-generator recovery are different stages. The
        reduced-norm-one unit group of an order in B_{p, infinity} is
        not the Dirichlet unit lattice of a commutative order. No rank
        is asserted.
      citation: KN-TECH-081
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-05 read
        knowledge/techniques/KN-TECH-081.md
      role: separates this ring from KN-TECH-046
    - description: >-
        Recalled and not opened: an order in a quaternion algebra
        ramified at infinity has finite unit group, which would force
        r = 0. No theorem number was opened. This is the prediction
        under test, not support.
      citation: Borel-Harish-Chandra finiteness for anisotropic arithmetic groups
      provenance: recalled
      verified_by: null
      role: statement under test

  predictions:
    - metric: free_Z_rank_r
      direction: lower
      minimum_effect: r = 0. The integer r >= 1 differs from 0 by at least 1 and falsifies this prediction.
    - metric: shell_finite_bit
      direction: different
      minimum_effect: The shell is finite. An infinite shell is not this prediction.

  test_boundary:
    instances:
      - id: maximal-order-p3
        prime: 3
        role: the only quaternion order
      - id: meter-units-of-Z
        expected_free_rank: 0
        role: meter
      - id: meter-units-of-Z-adjoin-sqrt2
        expected_free_rank: 1
        role: meter
    parameters:
      prime: 3
      orders: 1
      independent_listings: 2
    implementation: >-
      A computer-algebra quaternion algebra, one maximal order, the Gram
      matrix of the reduced norm, a box search from the smallest
      eigenvalue, and Smith normal form of the abelianization relation
      matrix. The design session enumerated no element of O^1.
    budget:
      enforcement: advisory
      maximum_runs: 2

  rerandomization: null

  falsification_conditions:
    - Ramification exactly {3, infinity}, enumeration completed inside the Gram bound, and r >= 1 falsifies the finite-torsion reading at this toy.
    - A crash, a timeout, an unproven bound, a wrong ramification set, or a meter mismatch decides neither reading.
    - Either completed outcome leaves HAWK key recovery unclaimed and leaves the Eurocrypt 2025 reduction unchecked.

  interpretation_limits:
    - One maximal order in the algebra ramified at 3 and infinity. No statement about HAWK-512, HAWK-1024, or any other prime.
    - No exponent against HAWK parameters. r >= 1 does not supply a decoder. r = 0 does not prove short-generator hardness.
    - KN-TECH-046 is a different ring. This design session did not open that file. The separation was read in KN-TECH-081.
    - An infinite shell with r = 0 is reported as its own outcome and is not labeled finite.

