hypothesis:
  id: H-MCE-efa9b2
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  source_idea_id: IDEA-20260805-554b9d

  statement: >-
    SCOPE FIRST. Claim tier TOY. This hypothesis is about ACCOUNTING for
    published algorithms, not about Classic McEliece's security, and no outcome
    of it may be reported as a statement about the security of any parameter
    set. No attack is proposed. No exponent is improved. RQ-MCE-e65b3c's toy
    ceiling is untouched.
    THE CLAIM, IN TWO SEPARABLE HALVES.
    (H1-A, UNCONDITIONAL AND DERIVABLE) For a repeat-until-success information-
    set-decoding variant V whose memory is resident for the duration of the run,
    with RAM-model time exponent tau_V and memory exponent mu_V in a fixed
    asymptotic regime, the Wiener full cost exponent is phi_V = tau_V + mu_V,
    and phi_V is INVARIANT under parallelising the independent outer iterations.
    Since Prange has mu = 0, the correct full-cost comparator against Prange is
    tau_V + mu_V < tau_Prange, strictly harder than the published
    tau_V < tau_Prange. This half is a derivation and its falsifier is an error
    in the derivation, not a measurement.
    (H1-B, EMPIRICAL AND CONDITIONAL ON TRANSCRIPTION) When published (tau, mu)
    pairs for the declared variant list are transcribed under a stated regime
    and ranked under the five declared accounting bases B1..B5, the ranking
    permutation is NOT constant across bases: there is at least one ordered pair
    of variants whose relative order under B1 (RAM word-operations, memory free)
    differs from their order under B5 (Wiener full cost). The pre-registered
    specific instance is (Prange, BJMM).
    (H1-C, CONCRETE AND SELF-CONTAINED) The exact Prange expected-iteration
    count at the five Classic McEliece parameter sets is
    C(n,w)/C(n-k,w) with w = t, and the closed form w*log2(n/(n-k)) is a STRICT
    LOWER BOUND on its base-2 logarithm at every set, with relative gap below
    5 per cent. This half needs no external source at all.
    WHAT WOULD FALSIFY THE HYPOTHESIS AS A WHOLE: H1-A refuted by a correct
    counterargument to the parallelisation-invariance step; or H1-C's strict
    inequality failing at any parameter set. H1-B failing is NOT a falsification
    of the hypothesis's value -- it is the honest negative that three code-based
    goals have each named as deliverable number one, and it is reported with the
    same weight as a positive.

  mechanism: >-
    DERIVED IN-REPO. The only external input is the full-cost model itself,
    taken from KN-TECH-035 (in-repo, READ); its source KN-LIT-094 was NOT READ
    and is not cited as an authority here. Everything else below is derived.

    SKELETON OF THE FAMILY. Every ISD variant in the Prange-Stern-Dumer-MMT-
    BJMM-May-Ozerov lineage has one shape: repeat independent randomised
    iterations, each of which permutes the columns of the parity-check matrix,
    performs a Gaussian elimination, and searches a structured subspace for a
    low-weight pattern. Write, in a fixed asymptotic regime with n the code
    length,
      N_it = 2^(n*iota*(1+o(1)))   expected outer iterations
      C_it = 2^(n*gamma*(1+o(1)))  time per iteration
      M    = 2^(n*mu*(1+o(1)))     peak memory, resident across the iteration
      T    = N_it * C_it = 2^(n*tau*(1+o(1))),  tau = iota + gamma.

    STEP 1, THE FULL-COST LOWER BOUND. Wiener full cost is hardware quantity
    times time occupied. A memory cell is hardware. If M cells are occupied for
    the run then FC >= M*T = 2^(n*(tau+mu)*(1+o(1))).

    STEP 2, PARALLELISATION INVARIANCE -- THE STEP THAT MAKES tau+mu THE RIGHT
    COMPARATOR RATHER THAN A PESSIMISTIC ONE. Distribute the N_it independent
    iterations over P processors. Wall time becomes T/P. Hardware becomes P*M,
    because each processor needs its own list memory in order for its iteration
    to be independent. Then FC = (P*M)*(T/P) = M*T, unchanged for every P. So
    the exponent tau+mu is a fixed point of exactly the transformation that
    makes the step-count comparison look improvable. Sharing a single memory
    across P processors does not evade this: it reintroduces the wiring cost
    that KN-TECH-035 records as converting BSGS's n^(1/2+o(1)) step count into
    n^(2/3+o(1)) full cost, so the shared variant pays a different charge rather
    than none. That BSGS/rho separation is used below as the positive control
    precisely because it is the published instance of this phenomenon.

    STEP 3, THE COMPARATOR. Prange stores the permuted parity-check matrix and
    nothing else, so mu_Prange = 0 and phi_Prange = tau_Prange. Hence V beats
    Prange under full cost if and only if tau_V + mu_V < tau_Prange. The whole
    advanced lineage obtains tau_V < tau_Prange by RAISING gamma to LOWER iota;
    full cost charges the raised side twice whenever the lists are the memory.

    STEP 4, THE SECOND FORCED VALUE. In pure representation-technique variants
    the dominant per-iteration operation is building and merging lists whose
    size is exactly the thing stored: building a list of size L costs
    Theta~(L), storing it costs Theta~(L). Hence mu = gamma up to sub-
    exponential factors, so phi = iota + 2*gamma, and the comparison becomes
    iota_V + 2*gamma_V < iota_Prange -- the variant must buy back twice the
    per-iteration exponent it spends. This is CHECKABLE against any published
    triple (time exponent, memory exponent, success probability) via the
    residual |mu_V - (tau_V - iota_V)|, and it CAN FAIL for a variant whose
    merge is superlinear in its list size. May-Ozerov's nearest-neighbour search
    is the named candidate failure (NOT READ -- relayed); detecting the failure
    is informative and is pre-declared so it cannot be presented afterwards as a
    confirmation.

    STEP 5, THE CONCRETE HALF, WHICH DEPENDS ON NOTHING EXTERNAL. Prange
    succeeds in one iteration exactly when all w errors fall outside the chosen
    information set, i.e. inside the n-k redundancy coordinates:
      P_succ = C(n-k, w)/C(n, w),
      log2 N_it = sum_{i=0}^{w-1} log2( (n-i)/(n-k-i) ).
    Each factor is STRICTLY INCREASING in i because
      d/di [ (n-i)/(n-k-i) ] = k/(n-k-i)^2 > 0 for k > 0,
    so every factor after i = 0 strictly exceeds n/(n-k) and therefore
      log2 N_it  >  w * log2( n/(n-k) )   for k > 0 and w > 1.
    That strict inequality is a forced value with a one-line proof, derived
    before any run, checkable at five parameter sets in exact integer
    arithmetic, and falsifiable by a single counterexample. Multiplying N_it by
    a declared Gaussian-elimination cost and a declared basis conversion yields
    the concrete memory-charged Prange baseline that GOAL-MCE-001 completion
    criterion 2 asks for, from (m, n, t) values EV-MCE-332f99 O-1 already
    transcribed and an independent validator already recomputed 5 out of 5.

    STEP 6, THE REGIME, DECLARED BEFORE IT IS DISCOVERED. Steps 1-4 are written
    for the constant-rate constant-relative-weight regime where published ISD
    exponents live and costs have the shape 2^(c*n). Classic McEliece does not
    live there: w = t with t*m < n, so w/n is small. KN-LIT-fa9bc8 reports (NOT
    READ -- relayed via its own corpus entry, whose own text says the full text
    was not read) that in the sub-linear weight regime the advantage of advanced
    ISD over Prange largely disappears in TIME ALONE. If that is right, the
    full-cost argument is a SECOND and INDEPENDENT reason for the same ordering,
    and the two must be reported separately so that neither borrows the other's
    force. The regime is therefore the graded axis of the test, not a nuisance.

    WHAT IS NOT DERIVED AND IS THE WEAKEST LINK. That the memory reported in a
    published source is resident for the run rather than streamed. This is a
    per-variant classification made from pseudocode, it is HEUR-FC-1 below, and
    a variant that cannot be classified from obtained text is EXCLUDED from the
    ranking rather than assumed resident.

  assumptions:
    - >-
      NO CONVENTION IS ADOPTED. GOAL-MCE-001.objective_correction and
      DEC-20260803-a5b9b1 D-3 establish that ISD-FC-2026 is not adopted and that
      this goal may not bind to it, while RQ-MCE-e65b3c.constraints still
      instructs binding to it and forbids deriving a competitor. Both are
      satisfied by refusing to choose: EVERY number is reported under ALL FIVE
      bases B1..B5 simultaneously, so the deliverable is basis-parametric and
      adopts nothing. The basis TAXONOMY B1..B5 is taken from that document's
      section 2.1, which was read; no rule, rate or number is taken from it,
      and it states in its own section 0 that it contains no arithmetic.
    - >-
      Every transcribed row carries an explicit REGIME column (full-distance vs
      half-distance decoding; constant vs sub-linear relative weight; worst-case-
      over-rate vs at-a-fixed-rate). Rows from different regimes are never
      compared. This is the single most likely bookkeeping error and it is
      fenced structurally rather than by care.
    - >-
      Published papers normally report ONE point on a variant's time-memory
      curve, usually the time-optimal one. phi computed there is an UPPER BOUND
      on the variant's true full-cost exponent, so any negative conclusion is
      scoped to the published operating point and says nothing about memory-
      restricted variants, whose existence is relayed and unverified.
    - >-
      Wiener's own caution is adopted as a rule, quoted from KN-TECH-035: step
      counting is CONSERVATIVE FROM THE DEFENDER'S SIDE, so full cost is unsafe
      only when used to declare two algorithms equivalent. Nothing here may be
      used to argue that Classic McEliece is weaker than its published estimates.
    - >-
      The environment was MEASURED for this record rather than assumed, because
      the scouting reports disagreed: python 3.11.15, numpy 2.4.6 PRESENT, and
      sage, sympy and fpylll all ABSENT (import errors recorded). No stage of
      this hypothesis needs any of the absent packages; every computation is
      pure-Python arbitrary-precision integer arithmetic.

  proof_search_map:
    bottleneck: >-
      The single step in which memory is priced. Every ISD ranking in the
      literature is produced by a cost model that charges zero for resident
      memory, and the entire advanced-ISD lineage's advantage over Prange is
      purchased with resident memory. If the pricing of that one step changes,
      the ranking is a different permutation and no other step of any variant
      needs re-examining. Nothing downstream -- better parameter optimisation,
      tighter list-size bounds, quantum speedups -- can repair a comparator
      that omits the resource the comparison turns on.
    baseline_embedding:
      parameter_slice: >-
        mu := 0 for every variant. In that slice full cost equals time by
        definition, so the B5 ranking is IDENTICAL to the B1 ranking, and the
        pipeline must reproduce the published time-only ranking exactly. This
        is an exact reproduction of the incumbent, not a resemblance.
      reproduction_check: >-
        SYMBOLIC AND EXACT. With mu = 0 the comparator tau + mu collapses to
        tau, so the inversion count between B1 and B5 must be EXACTLY 0 as an
        integer, with no tolerance. A curve that merely looks like the baseline
        is not an embedding; this is an integer identity on a permutation. It
        is also the experiment's null arm, so the baseline reproduction and the
        null are the same computation, which is deliberate.
    observation_collision:
      observable: >-
        The pair (tau, mu), and the derived scalar phi = tau + mu, standing in
        for a whole algorithm.
      distinct_preimage_search: >-
        COLLISIONS EXIST AND ARE EXPECTED, and the hypothesis is written so that
        they do not damage it. Two algorithms with identical (tau, mu) are
        indistinguishable to this instrument, and that is acceptable because the
        claim is about the RANKING INDUCED BY THE OBSERVABLE, not about
        recovering the algorithm. The collision that WOULD be fatal is different
        and is searched for explicitly: two rows with the same tau but different
        mu that the published tables report as the same algorithm at different
        operating points. Such a pair means the table is reporting a tradeoff
        curve as a point, and every phi computed from it is an upper bound of
        unknown looseness. The transcription stage flags any variant appearing
        more than once with different mu, and the flag halts its row.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A basis-indexed resource measure phi_B, one per accounting basis
          B in {B1,...,B5}, realised by specialising the general full-cost
          formula to each basis, and charged only over the disjoint blocks
          (time, memory, wiring) that the basis declares separately.
        predicted_gain: >-
          Turns "ISD comparison depends on the cost model" -- a sentence the
          literature already contains -- into a computed table of five
          permutations whose differences are exactly the disputed charges. The
          gain is that disagreement becomes localisable to a basis rather than
          arguable.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable phi fixed and vary the forgotten structure: the
          synthetic ladder of hypothetical variants sharing one tau_0 and
          carrying mu in {0, 0.25, 0.50, 0.75, 1.00}*tau_0.
        predicted_gain: >-
          The count of ladder members beating a fixed Prange row under full cost
          must be NON-INCREASING in mu. If it is not, the comparator is
          responding to something other than memory and the instrument fails
          before any real number is read.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. H1-A: FOR ALL variants V in the declared list with
      resident memory, FOR ALL processor counts P >= 1, the full cost exponent
      equals tau_V + mu_V. The witness (the accounting) may not depend on V, on
      P, or on the regime -- one formula, quantified over everything.
      H1-B is deliberately the WEAKER order and says so: THERE EXISTS an ordered
      pair (V, W) and THERE EXISTS a regime such that their B1 order differs
      from their B5 order. It is an existential and is not to be reported as if
      it were universal. In particular "full cost reorders the ISD family" is a
      FORBIDDEN SENTENCE unless a universally quantified statement is
      separately established, which this hypothesis does not attempt.
      H1-C: FOR ALL five parameter sets, log2 N_it > w*log2(n/(n-k)) strictly.
      Universal over a finite set, hence checkable exhaustively.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a basis-indexed table of published asymptotic exponents for a
        named finite list of ISD variants, in named regimes, at published
        operating points, plus an exact concrete Prange cost at five parameter
        sets under five declared bases. It CANNOT certify that any variant is
        the best possible under full cost, cannot certify anything about
        memory-restricted variants nobody transcribed, cannot bound any
        adversary's real cost, cannot support any claim about Classic
        McEliece's security in either direction, and cannot be promoted above
        claim tier toy by any citation.
      nearby_object_control: >-
        BSGS versus Pollard rho on a generic group of order N -- the closest
        object where the hoped-for conclusion is KNOWN, with a published answer
        the method must reproduce. Under step counting both are N^(1/2+o(1));
        under full cost KN-TECH-035 records BSGS at N^(2/3+o(1)) and rho at
        N^(1/2+o(1)). The instrument must return 2/3 and 1/2 to within 0.001 and
        must rank them tied-or-BSGS-favoured under B1 and strictly rho-favoured
        under B5. If it cannot separate that pair it has not identified the
        load-bearing structure, and NO negative about ISD may be reported at
        all. A second nearby object where the conclusion FAILS: two variants
        both with mu = 0, where full cost must change nothing.
    proof_obligations:
      - claim: FC >= M*T for a resident-memory algorithm, and FC = M*T is invariant under outer-loop parallelisation.
        responsibility: correctness
      - claim: mu_Prange = 0, i.e. Prange's memory is polynomial in n.
        responsibility: baseline
      - claim: mu = gamma up to sub-exponential factors for pure representation-technique variants.
        responsibility: feasibility
      - claim: log2 C(n,w) - log2 C(n-k,w) > w*log2(n/(n-k)) strictly, for k > 0, w > 1.
        responsibility: strictness
      - claim: Each transcribed row's regime is identified from primary text and rows of different regimes are never compared.
        responsibility: interface
      - claim: Every conclusion is scoped to the published operating point, and memory-restricted variants are declared absent rather than assumed absent.
        responsibility: scope
      - claim: A blocked source is an infrastructure outcome and never negative mathematical evidence.
        responsibility: runtime
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim:
    problem: >-
      Syndrome decoding of a random binary linear code, in a stated asymptotic
      regime. NOTE: no improvement to this problem is claimed anywhere in this
      record. The claim is about the COMPARATOR under which existing algorithms
      for it are ranked.
    prior_best: >-
      NOT ASSERTED. This corpus holds no transcribed ISD exponent table, and no
      exponent value is stated from memory anywhere in this record. Naming the
      best-known time exponent is the first OUTPUT of the transcription stage,
      not an input to this hypothesis.
    time_exponent: >-
      NOT ASSERTED for any variant. The derived relation is phi = tau + mu,
      with tau and mu transcription targets.
    memory_exponent: >-
      mu_Prange = 0 (polynomial memory), derived. All other memory exponents are
      transcription targets and none is asserted.
    hidden_cofactor: >-
      Polynomial factors in n throughout; the unextracted constants that
      KN-TECH-035 declares as a limit of the full-cost model itself; and the
      sub-exponential factors in every published ISD exponent statement. At
      n = 6960 an exponent difference of 0.005 is roughly 35 bits, so the
      asymptotic table and the concrete table are two separate objects and
      neither may be used to argue the other.
    claim_kind: cost_model_reordering

  heuristic_assumptions:
    - id: HEUR-FC-1
      formal_statement: >-
        FOR ALL variants V in the declared list, the peak memory reported in the
        source for V is occupied for a constant fraction of V's running time --
        not streamed and discarded, not amortised across independent restarts in
        a way that lowers the peak below the reported figure.
      random_model_justification: >-
        Structural, not distributional. The representation-technique variants
        build lists inside one iteration and consume them inside that iteration,
        so peak memory coincides with peak per-iteration work and the outer loop
        repeats the pattern; Prange is the classified-as-streaming case, which
        is why mu_Prange = 0. This reading is from standard pseudocode
        descriptions and is NOT verified from primary text in this record.
      supporting_results: []
      validation_experiment_ids: [EXP-MCE-350abf]
      falsification_condition: >-
        Any variant whose obtained text shows the reported memory is transient
        or amortised. Its phi is then not tau + mu, its row is marked
        UNCLASSIFIED and EXCLUDED from the ranking, and the exclusion is
        reported. If a majority of rows must be excluded the ranking is not
        computed at all and that is the result.
    - id: HEUR-FC-2
      formal_statement: >-
        FOR ALL pure representation-technique variants V with a published
        success probability, mu_V = tau_V - iota_V up to o(1), where
        2^(-n*iota_V) is the per-iteration success probability.
      random_model_justification: >-
        Derived, not assumed: building and merging a list of size L costs
        Theta~(L) with hashing and storing it costs Theta~(L), so stored size
        and per-iteration work share an exponent. The named failure mode is a
        variant whose merge is superlinear in list size.
      supporting_results: []
      validation_experiment_ids: [EXP-MCE-350abf]
      falsification_condition: >-
        Residual |mu_V - (tau_V - iota_V)| >= 0.02 in exponent units for a
        variant classified as pure representation-technique. The variant is then
        NAMED as decoupling time from memory, is reported rather than dropped,
        and HEUR-FC-2 is recorded as failing for it. Cost of being wrong: zero
        compute -- it is arithmetic on transcribed numbers.
    - id: HEUR-FC-3
      formal_statement: >-
        Wiener full cost, FC = hardware quantity times time occupied under a
        three-dimensional wiring model, is an admissible accounting basis for
        comparing algorithms of this kind, and adopting it does not invert any
        conclusion for reasons extrinsic to memory.
      random_model_justification: >-
        NONE OFFERED, AND THIS IS THE LOAD-BEARING EXTERNAL ASSUMPTION OF THE
        WHOLE HYPOTHESIS, recorded here rather than buried. KN-TECH-035 states
        the model and states its own limits (asymptotic, unextracted constants,
        one technology abstraction, three spatial dimensions); KN-LIT-094 was
        NOT READ and is not cited as an authority.
      supporting_results: []
      validation_experiment_ids: [EXP-MCE-350abf]
      falsification_condition: >-
        Not falsifiable by this experiment, and saying so is the point. The
        mitigation is structural: EVERY number is reported under all five bases,
        so a reader who rejects B5 still receives B1..B4 and can see exactly
        which conclusions depend on the rejected basis. This is why the
        deliverable is basis-parametric, and it is the reason rather than a side
        effect.

  structural_ingredients:
    - description: >-
        Wiener full-cost accounting, including the worked BSGS n^(2/3+o(1))
        versus parallel-collision-search n^(1/2+o(1)) separation used here as
        the positive control, and the defender-side conservatism caution
        adopted here as a scope rule.
      citation: >-
        knowledge/techniques/KN-TECH-035.md, READ in repo this session. Its
        underlying source KN-LIT-094 was NOT READ and no page, theorem number
        or figure from it is asserted anywhere.
      role: the accounting basis B5 and the positive-control forced values
    - description: >-
        The five-basis taxonomy B1 RAM word-operations, B2 bit-operations,
        B3 logic gates, B4 gates plus memory-access penalty, B5 full cost.
      citation: >-
        coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-0100a5/isd_costing_convention.md
        section 2.1, READ in repo. NOT ADOPTED as a convention
        (DEC-20260802-344883 D-6, DEC-20260803-a5b9b1 D-3) and no rule, rate or
        number is taken from it.
      role: the index set of the basis-parametric deliverable
    - description: >-
        Sub-linear error weight analysis of ISD, reporting that the advantage of
        advanced variants over Prange largely disappears in the regime McEliece
        occupies.
      citation: >-
        KN-LIT-fa9bc8 (Canto Torres-Sendrier, PQCrypto 2016, DOI
        10.1007/978-3-319-29360-8_10). NOT READ -- relayed claim; the corpus
        entry itself states the full text was not read and no figure reproduced.
        Treated as a hypothesis to test in the graded regime arm, never as
        support.
      role: the regime axis, and a competing explanation to be separated from full cost
    - description: >-
        The five Classic McEliece parameter sets, k = n - m*t, and the exact
        rates 85/109, 35/48, 157/209, 5413/6960, 51/64.
      citation: >-
        ledger/evidence/EV-MCE-332f99.yaml observation O-1, transcribed from
        mceliece-spec-20221023.pdf sections 3 and 7 by TASK-20260803-f3aece and
        independently recomputed 5/5 by TASK-20260803-409c5e.
      role: the entire input to the concrete half; no external source needed

  reduction_chain:
    core_problem: >-
      Given published (time exponent, memory exponent, regime) triples for a
      named finite list of syndrome-decoding algorithms, determine the ranking
      permutation induced by each of five accounting bases, and compute the
      exact Prange cost at five Classic McEliece parameter sets under each.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY, and the emptiness is a claim about scope rather than
      an omission. There is no reduction from this bookkeeping result to any
      statement about Classic McEliece's security, about HQC's, or about
      SDitH's, and none is claimed. If the ranking inverts, the consequence is
      that a DIFFERENT PUBLISHED EXPONENT is the appropriate baseline for a
      future cost comparison -- which changes what a future record must cite,
      not what any scheme's security is. Any citation of this hypothesis toward
      a security conclusion must carry that gap explicitly.

  predictions:
    - metric: >-
        FV-1: sign of [log2 C(n,w) - log2 C(n-k,w)] - w*log2(n/(n-k)) at the
        five Classic McEliece parameter sets, exact integer/rational arithmetic,
        w = t.
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE at 5 of 5. Forced by d/di[(n-i)/(n-k-i)] = k/(n-k-i)^2
        > 0. One non-positive value falsifies the derivation and halts every
        downstream number until it is re-derived.
    - metric: >-
        FV-1b: relative gap (exact - approx)/exact for the same quantity.
      direction: lower
      minimum_effect: >-
        Below 0.05 at every set. If exceeded, the closed form is not usable as a
        sanity check and only the exact computation is reported.
    - metric: >-
        Null-arm inversion count: number of ordered variant pairs whose B1 order
        differs from their B5 order, on the mu-zeroed arm.
      direction: lower
      minimum_effect: >-
        EXACTLY 0, integer, no tolerance. Any nonzero means the pipeline
        manufactures inversions and NOTHING may be reported from any arm.
    - metric: >-
        Positive-control full-cost exponents for BSGS and Pollard rho on a
        generic group of order N.
      direction: different
      minimum_effect: >-
        2/3 and 1/2 respectively, each to within 0.001, with the B1-to-B5 order
        change present. Failure means the instrument is broken and no negative
        may be reported.
    - metric: >-
        Graded ladder: count of synthetic variants with mu in
        {0, 0.25, 0.50, 0.75, 1.00}*tau_0 that beat a fixed Prange row under
        full cost.
      direction: lower
      minimum_effect: >-
        NON-INCREASING across the five mu points, and equal at every point to
        the count of members satisfying tau_0 + mu < tau_Prange. Non-monotone
        localises the fault in the comparator.
    - metric: >-
        Treatment-arm inversion count between B1 and B5 over the transcribed
        variant list, with the (Prange, BJMM) pair reported separately.
      direction: higher
      minimum_effect: >-
        AT LEAST 1, CONDITIONAL on the transcribed numbers satisfying
        mu_BJMM > tau_Prange - tau_BJMM. The conditional is stated as an
        inequality on numbers not yet read; NO exponent value is asserted. If
        the proviso fails the prediction was conditional and is not falsified,
        and the reported result is the negative table -- which is itself the
        deliverable GOAL-MCE-001, GOAL-HQC-001 and GOAL-SDITH-001 each name
        first and none has produced.
    - metric: >-
        FV-2 residual |mu_V - (tau_V - iota_V)| per list-based variant.
      direction: lower
      minimum_effect: >-
        Below 0.02 in exponent units for pure representation-technique variants.
        Larger identifies a superlinear-merge variant, which is REPORTED, not
        dropped, and was pre-declared here.
    - metric: >-
        Graded regime sweep: phi_V - phi_Prange as a function of relative weight
        W = w/n, at five or more points from half-distance down to t/n.
      direction: different
      minimum_effect: >-
