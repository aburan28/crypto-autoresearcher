hypothesis:
  id: H-DREG-45c58f
  question_id: RQ-DREG-c8ae8d
  proposal_id: IDEA-20260922-221a70
  added: '2026-09-22'
  title: >-
    On the first odd-prime rational ell-isogeny the frozen search accepts,
    the rebuilt Semaev system keeps the domain new_falls support and the
    cleared pullback scales that support by ell
  statement: >-
    Predict label M on the single edge selected below. Let E be an ordinary
    short-Weierstrass curve over an odd prime field, and let phi be one
    rational cyclic ell-isogeny from E, with ell in {3, 5, 2}. Let (R) be
    the Semaev system rebuilt on the codomain from its own coefficients, and
    let (P) be the cleared substitution of the degree-ell x-coordinate map
    into E's generators. Label M means the set of degrees with new_falls
    strictly positive on (R) equals that set on E, the set on (P) equals ell
    times that set among degrees that finished inside the frozen caps, and
    every cleared generator total-degree ratio equals ell. The prediction is
    falsified by label C, by label N when M's stricter equalities fail, or
    by a finished edge whose cleared degree ratio is not ell, which withdraws
    HEUR-45c58f-H2 for that edge. Label U falsifies nothing about the ideals.
    No ECDLP exponent is claimed.
  mechanism: >-
    The object is one decomposition system in two presentations, plus the
    domain system it is compared with. Representation is field coordinates
    on E and on the codomain, together with the rational functions f and g
    actually substituted, where the x-coordinate of phi is f/g. The attack
    stage is relation decomposition only. The operations are Macaulay
    multiplication by monomials up to a frozen total-degree cap, and
    composition with f/g followed by clearing denominators. Those integers,
    the new_falls supports and the generator total degrees, are reports of
    those operations. They are not claimed to be invariant under translation,
    and they are not a new factor base. Vélu's formulas were not opened.
    HEUR-45c58f-H2 is the symbolic check that replaces that recollection.
    The fall meter is the new_falls identity restated in
    EXP-DREG-d76c97 from IDEA-20260916-4b7c1e, applied to E, to (R), and
    to (P). A matrix that does not finish is neither a drop nor a match.
  assumptions:
    - >-
      The tested kernel is generated by an F_p-rational point of order ell,
      so ell divides the point count of E. The proposal's phrase "ell
      coprime to the group order" is impossible for that kernel and is not
      assumed. The frozen substitute is gcd(ell, N_E) = 1, where N_E is the
      largest prime factor of the point count. The degree comparison itself
      uses the polynomials the implementation substitutes.
    - >-
      f/g is the map the implementation substitutes on the selected edge.
      HEUR-45c58f-H2 is about those polynomials after clearing denominators,
      not about a formula read from a paper.
    - >-
      (R) and E may differ at the same factor-base cardinality. No constancy
      theorem is assumed. E, (R), (P), and the gauge use the same total-degree
      column partition.
    - >-
      The edge is the first tuple the frozen search accepts. It is not
      replaced after the degree ratios are known.
  proof_search_map:
    bottleneck: >-
      Separating the multiplier ell from a change in the rebuilt system's
      new_falls support, without reading an unfinished matrix as a large
      degree.
    baseline_embedding:
      parameter_slice: >-
        The new_falls vector of E at every degree from 1 through 6, recorded
        before (R) or (P) is compared with it.
      reproduction_check: >-
        On every finished degree of E, of (R), of (P), and of the gauge,
        falls(D) equals rank(M_D) minus the rank on degree-exactly-D columns,
        and new_falls(D) equals falls(D) minus rank(M_{D-1}). A negative
        value is an instrument failure.
    observation_collision:
      observable: >-
        The positive new_falls support of (R), and the support of (P) after
        dividing finished degrees by ell.
      distinct_preimage_search: >-
        (R) and the scaled (P) are two presentations. Equal supports are a
        collision: on this edge the isogeny did not change the intrinsic
        degree. E and its gauge model are the coordinate null and must
        collide. A gauge mismatch blocks M, C, and N.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The pair of presentations (R) and (P) of one decomposition system
          along the one rational ell-isogeny the frozen search accepts.
        predicted_gain: >-
          Decides whether a degree change is the ell multiplier or a change
          in the rebuilt system. No ECDLP exponent gain.
    quantifier_order: >-
      The edge is the first (p, a, b, ell) accepted by the search in
      EXP-DREG-d76c97, not an edge chosen after seeing degrees. For all
      three generators, HEUR-45c58f-H2 asserts that the total degree of the
      cleared pullback equals ell times the total degree on E. For all
      degrees that finished inside the caps, the label rule assigns exactly
      one of M, C, N, or U. The hypothesis predicts M. It does not quantify
      over a class.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this one toy edge, either label M holds, or the rebuilt profile
        drops while the pullback still matches the in-cap ell-scaled support,
        or the two presentations agree after scaling, or the edge is
        unmeasured. Toy tier only. Not outcome O1, O2, or O3 of RQ-DREG-c8ae8d.
      nearby_object_control: >-
        The gauge model of E at the same j, which must reproduce E's
        new_falls vector, and one random rational map of the same bidegree
        as f/g. A degree-pattern match with that random map means the
        pattern is degree arithmetic. It does not by itself assign C.
    proof_obligations:
      - claim: >-
          The integer ell used to scale degrees is the degree of the reduced
          f/g actually substituted, and degrees of (P) above its cap are
          left unmeasured.
        responsibility: correctness
      - claim: >-
          new_falls is computed from full-column ranks. A negative value or
          an unfinished matrix is label U, not a drop and not a large degree.
        responsibility: baseline
      - claim: >-
          One edge inside primes from 101 through 211. Not a class census
          and not an ECDLP exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: outcome_label
      direction: different
      minimum_effect: >-
        The single label is M on the selected edge, with the gauge vector
        equal to E's vector and every required matrix finished.
    - metric: cleared_generator_degree_ratio
      direction: higher
      minimum_effect: >-
        For each of the three generators, the total degree of the cleared
        pullback equals ell times the total degree of the source generator.
        Any other value, including an undefined degree, withdraws
        HEUR-45c58f-H2 on this edge.
  test_boundary:
    instances:
      - >-
        The first ordinary short-Weierstrass edge accepted by the search in
        EXP-DREG-d76c97, or the no-edge stop at p = 211.
      - the gauge model of that edge at u = 2
      - one random rational map drawn from random.Random(20260922)
    parameters:
      field: odd prime, first success in 101 through 211 inclusive, else no edge
      model: short Weierstrass y^2 = x^3 + a*x + b
      nonsingular_predicate: b*(4*a^3 + 27*b^2) != 0
      ordinary: trace not 0 mod p
      ell_order: [3, 5, 2]
      h: 3
      D_max_E: 6
      D_max_R: 6
      D_max_P: min(ell*6, 12)
      seed: 20260922
    implementation: experiments/EXP-DREG-d76c97/specification.yaml
    budget:
      maximum_runs: 1
      maximum_memory_gb: 4
      maximum_workers: 1
  falsification_conditions:
    - >-
      The selected edge finishes and at least one cleared generator degree
      ratio is not ell. HEUR-45c58f-H2 is withdrawn on that edge. No later
      sentence may say the pullback multiplies degrees by ell for that edge.
    - >-
      The label is C. (R) dropped relative to E while (P) still matched the
      in-cap ell-scaled support. That falsifies the prediction of label M.
      It does not by itself establish a class outlier.
    - >-
      The label is N because M's stricter set equalities and ratio test do
      not all hold, while the positive-fall set of (R) equals the support
      of (P) after dividing by ell. The isogeny did not change the intrinsic
      degree on that edge.
    - >-
      Label U falsifies nothing about the ideals. An unfinished matrix, a
      negative new_falls value, a gauge mismatch, a failed certificate, or
      no edge is unmeasured.
  interpretation_limits:
    - >-
      Toy tier only. Primes at most 211, one edge. No transfer to a
      cryptographic prime is assumed or claimed.
    - >-
      new_falls is not the degree of regularity and d_lf_obs is not the
      Huang-Kosters-Petit-Yeo last-fall degree. d_lf_obs is a lower bound
      inside the cap.
    - >-
      Zeros of new_falls inside a cap are not zeros above that cap. Degrees
      of (P) above min(ell*6, 12) are unmeasured.
    - >-
      This is not a class census, not a syzygy witness search, not the
      characteristic-2 boolean ladder of EXP-DREG-dd668d, not a new factor
      base, and not a rerun of the neighbor screen closed by DEC-20260716-003.
    - >-
      ECDLP cost is unchanged. Pollard rho remains the comparison point for
      an attack, and this hypothesis does not charge a walk.
    - >-
      Vélu's paper was not opened. HEUR-45c58f-H2 is not a citation of it.
    - >-
      Label C does not decide outcomes O1, O2, or O3 of RQ-DREG-c8ae8d.
  heuristic_assumptions:
    - id: HEUR-45c58f-H1
      formal_statement: >-
        On this one edge, inside the cap of a presentation, d_lf_obs is the
        largest finished degree with new_falls strictly positive, or none
        if there is no such degree. It is a lower bound on the last positive
        fall of that same generating set and filtration. It is not the
        Petit-Quisquater first-fall assumption, and a vector of zeros through
        the cap does not prove that the solving degree is small above the cap.
      random_model_justification: >-
        No random model. The quantity is an integer read from exact ranks,
        or the token none when no positive fall finished inside the cap.
      supporting_results: []
      validation_experiment_ids:
        - EXP-DREG-d76c97
      falsification_condition: >-
        If a degree-by-degree elimination of E's generating set finishes at
        some D-star at most 6, and the highest degree that elimination uses
        differs from d_lf_obs(E) by at least 1, HEUR-45c58f-H1 is false on E.
        EXP-DREG-d76c97 does not run that elimination, so this experiment
        cannot fire this condition. A flat new_falls profile does not confirm
        the heuristic.
    - id: HEUR-45c58f-H2
      formal_statement: >-
        Let f/g be the reduced degree-ell x-coordinate map substituted on the
        selected edge. For each of the three generators of E, clearing
        denominators after substituting x maps to f/g multiplies that
        generator's total degree by ell. This is an identity to check on
        that one edge. It is not a theorem.
      random_model_justification: >-
        No random model. Composition of rational functions suggests the
        factor ell, and clearing denominators can cancel, so that suggestion
        does not prove the cleared equality. The equality is the claim under
        test.
      supporting_results: []
      validation_experiment_ids:
        - EXP-DREG-d76c97
      falsification_condition: >-
        On the selected edge, any cleared generator whose total degree is
        not ell times the source total degree, or whose degree is undefined,
        withdraws HEUR-45c58f-H2 for that edge.
  asymptotic_claim: null
  citations:
    - ref: IDEA-20260922-221a70
      provenance: internal
      claim: >-
        The proposal this hypothesis specifies. Two presentations, (R) and
        (P), and the labels M, C, N, and U. The coprimality phrase in that
        proposal is corrected in this record.
      verified_by: coordinator, full file read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        Parent question. Timeouts are not degree evidence. This hypothesis
        is one edge, not a class outcome.
      verified_by: coordinator, full file read 2026-09-22
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: >-
        new_falls(D) is falls(D) minus rank(M at D-1), and falls(D) is
        rank(M_D) minus the rank on degree-exactly-D columns. Restated in
        the experiment so this hypothesis does not depend on that idea
        being approved. Not the degree of regularity and not the HKPY
        last-fall degree.
      verified_by: coordinator, lines 1-80 read 2026-09-22
    - ref: EXP-DREG-dd668d
      provenance: internal
      claim: >-
        Characteristic-2 boolean ladder and grevlex solving degree. This
        hypothesis does not use that ladder.
      verified_by: coordinator, specification.yaml read 2026-09-22
    - ref: DEC-20260716-003
      provenance: internal
      claim: >-
        Scoped rejection of an l-isogeny neighbor comparison that used
        degree of regularity. This hypothesis does not rerun that screen
        and does not use that meter.
      verified_by: coordinator, full file read 2026-09-22
    - ref: Vélu isogeny formulas and the x-coordinate rational map
      provenance: recalled
      claim: >-
        A separable isogeny of degree ell is given by rational functions,
        and the induced map on x-coordinates has degree ell. Not opened.
        HEUR-45c58f-H2 is the check that replaces this recollection.
      verified_by: null
  status: specified
  proposed_by: coordinator
