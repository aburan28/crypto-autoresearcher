hypothesis:
  id: H-FIND-10256a
  question_id: RQ-FIND-001
  status: proposed
  added: '2026-08-05'
  source_idea_id: IDEA-20260805-6fedc7

  statement: >-
    SCOPE: the eleven knowledge entries KN-FIND-017..027 committed by
    GOAL-FIND-001 on 2026-07-25, every citation edge into them across ledger/,
    experiments/, knowledge/, docs/ and coordination/, and the promotion rule
    as written in DEC-20260725-024. CLAIM TIER: not applicable -- no
    mathematical claim about the ECDLP, no exponent, no algorithm, no scale
    transfer. NO ATTACK.
    RQ-FIND-001 asks which results "must be promoted into knowledge/findings so
    future ideation cannot re-cross closed scopes", and GOAL-FIND-001's
    objective adds "so Tier 1-2 ideation treats closed families as durable
    internal ground truth". Both sentences are claims about DELIVERY, and
    delivery runs through an identifier: an agent writes KN-FIND-0xx and a
    later reader resolves it against knowledge/findings/. THE HYPOTHESIS IS
    THAT THE DELIVERY CHANNEL IS DEFECTIVE FOR THIS GOAL'S OWN OUTPUT, AND
    THAT THE SELECTION STEP THAT PRODUCED THE OUTPUT COULD NOT HAVE PRODUCED
    ANY OTHER. Three separately falsifiable sub-claims:
    (S1) MISRESOLUTION EXISTS AND IS FORCED, NOT INFERRED. Records under
    coordination/goals/GOAL-AES-002 and -003 attribute to "KN-FIND-017 Fact 2"
    the statement that the obstruction lies at the affine layer L inside
    SubBytes and that byte-wise inversion preserves GF(2^8)-collinearity.
    knowledge/findings/KN-FIND-028.md carries the heading "## Fact 2 - Inv
    preserves GF(2^8)-collinearity; the affine layer L does not".
    knowledge/findings/KN-FIND-017.md is "Scoped finding from EV-BKK-001",
    about Newton box-saturation of target-sectioned Semaev systems, and shares
    no vocabulary with it. The adjudication is therefore a string-containment
    test between two committed files and not an opinion: the edge resolves
    uniquely to 028 and cannot resolve to 017.
    (S2) THE COLLISION IS A MERGE-TIME RENUMBERING WITH CONSTANT OFFSET 11.
    GOAL-AES records additionally declare KN-FIND-018 and KN-FIND-019
    "RESERVED BUT NOT COMMITTED TO", identifiers this goal had already
    committed. The prediction is that every misresolving edge into 017/018/019
    resolves to 028/029/030 respectively -- offset exactly 11, not an arbitrary
    remapping. A single deviant offset refutes S2 while leaving S1 intact.
    (S3) THE SELECTION GATE ADDS ZERO BITS. The section 1.1 population is
    defined by strength = replicated; the gate promoted 11 of 11 and issued 0
    not_warranted. If the promotion rule is "strength in {replicated, strong}",
    promotion is a deterministic function of a pre-existing field, the
    11-of-11 rate is forced rather than earned, and citing it as quality
    assurance is citing a tautology.
    WHAT THIS HYPOTHESIS EXPLICITLY DOES NOT CLAIM, because the measurement
    came out the other way: the WORDING gate had real discrimination. Diffing
    the REVISE'd BATCH-001 draft against the PASS'd BATCH-002 draft gives 94
    changed lines over 379 -> 411, adding proof_refs to research/THM_BKKMV1.md,
    internal_refs to DEC-20260722-003, and an explicit note that the all-m law
    remains CONJECTURE C1 (open). That is the review instrument's positive
    control and it PASSED. Any write-up that omitted it would be selecting its
    evidence.

  mechanism: >-
    DERIVED IN-REPO FROM FILES READ ON 2026-08-05, by targeted extraction with
    80 characters of context for the coordination files and by direct read of
    the knowledge entries' front matter and headings. The coordination
    documents were NOT read in full and the characterisation of their
    surrounding arguments is deliberately absent.

    THE DELIVERY MODEL. A promotion installs a fact F as a file; the retrieval
    handle is an identifier i; delivery succeeds for a downstream record r iff
    the entry r's author meant is the entry i names. Four disjoint modes
    exhaust the edge population and each is decidable by inspection:
      (A) MISRESOLUTION -- r cites i, the material r attributes to i is absent
          from file(i) and present in exactly one file(j), j != i.
      (B) RESERVATION COLLISION -- r declares i uncommitted while i is
          committed with unrelated content.
      (C) SELF-REFERENCE -- r lies inside coordination/goals/GOAL-FIND-001/,
          so the edge is the promotion machinery citing itself and carries no
          information about external uptake.
      (VALID) everything else.
    Only VALID edges are evidence that the objective clause is satisfied.

    WHY THE OBVIOUS METRIC IS REFUSED. Raw citation counts for
    KN-FIND-017..027, measured this session, are 26, 24, 18, 12, 11, 10, 10,
    10, 10, 11, 20. That looks like healthy uptake. But the breakdown of
    KN-FIND-017's 26 by directory is: 11 inside coordination/goals/
    GOAL-FIND-001/ (mode C, the promotion citing itself), 8 inside
    coordination/goals/GOAL-AES-001/002/003 (the population containing the
    mode-A edges), 2 ledger/evidence, 2 ledger/decisions, 2 ledger/corrections,
    1 ledger/goals, 1 knowledge/, 1 knowledge/findings. So the count's floor is
    set by self-reference and its most numerous external component is the very
    family in which the misresolution was found. A comparator whose spread is
    dominated by a near-constant self-reference floor cannot separate delivery
    from ceremony, which is the mirror failure the inventor protocol names, and
    it is why the measured quantity here is the CLASSIFIED edge count with four
    non-degenerate cells rather than the raw count.

    THE FORCED ADJUDICATION, IN ONE LINE EACH. Attributed material: "Fact 2",
    the affine layer L inside SubBytes, GF(2^8)-collinearity under byte-wise
    inversion. containment(material, file(KN-FIND-028)) = TRUE -- the heading
    was read verbatim. containment(material, file(KN-FIND-017)) = FALSE --
    017's scoped claim reads "Toy p<=1009, m in {3,4,5}: target-sectioned
    Semaev systems are Newton box-saturated (MV=multigraded Bezout); no
    support-aware BKK solve-cost advantage in tested scope", and the entry
    contains no section named Fact 2. The two entries share no technical
    vocabulary whatsoever: one is about Newton polytopes of summation
    polynomials over prime fields, the other about the algebra of AES
    components over GF(2^8). USING CONTAINMENT RATHER THAN JUDGEMENT IS THE
    DESIGN DECISION THAT MAKES S1 DECIDABLE, and it is what distinguishes this
    from an auditor asserting that a citation "looks wrong".

    THE ARITHMETIC OF S2. GOAL-FIND-001 committed 017..027 (eleven entries, one
    per section 1.1 evidence record) on 2026-07-25. The AES lane's findings
    occupy 028, 029, 030 -- respectively the AES component-algebra facts, the
    mutation-control false-green census, and, with some irony, "Directory-scan
    ID allocation is not concurrency-safe across branches; two campaigns
    against one main allocate the same next-free id". If the AES lane drafted
    against next-free numbers 017/018/019 in its own worktree before the FIND
    promotion merged, its prose references were written against those numbers
    and were shifted by exactly eleven when the files landed, leaving the prose
    behind. Three consecutive pairs (017->028, 018->029, 019->030) lining up
    under one constant is unlikely to be coincidence, but it is INFERRED: no
    allocation log and no git history were consulted this session, and the
    inference is exposed as a falsifiable prediction rather than asserted.

    THE INFORMATION CONTENT OF THE SELECTION GATE. Let S be the strength field
    and P the promotion outcome over the section 1.1 population. Measured: S is
    constant (replicated) across all eleven and P is constant (promoted) across
    all eleven. The conditional entropy H(P | S) on this population is exactly
    0, so I(P ; X | S) = 0 for every feature X, trivially and unavoidably. THE
    DEGENERACY IS THE FINDING AND IT CANNOT FAIL ON THIS POPULATION -- which is
    precisely why an honest test of the gate must be run on a population with
    variation, and why the paired experiment builds one. The complementary cell
    is documented rather than measured here: the assessment (READ) records that
    27 of 28 newer decisions carry promoted: [] with a not_warranted reason of
    the form "preliminary evidence, not a replicated/strong finding", which is
    the S = preliminary, P = not_promoted corner of the same 2x2.

    WHERE THE JUDGEMENT ACTUALLY LIVED, AND WHY IT IS REPORTED. The two-batch
    structure supplies a free two-point sensitivity demonstration for the
    review instrument, and it came out POSITIVE: 94 changed lines between the
    REVISE'd and PASS'd drafts, adding proof references, decision
    cross-references and an explicit open-conjecture caveat. Had that diff been
    empty or cosmetic, the PASS would have been a control that cannot fail and
    NO conclusion about the selection gate would have been reportable either,
    since both gates would then be untrustworthy for the same reason. The
    positive result is therefore load-bearing in both directions and is stated
    up front.

    COST BOOKKEEPING. Population: 58 edges into 017/018/019 from the AES trees
    plus roughly 90 further edges into the eleven entries, on the order of 150.
    Per-edge cost: locate the citing sentence, then two containment tests --
    seconds. No inverse-probability term appears because nothing is sampled:
    the population is enumerable and is enumerated exhaustively.

    WHAT IS NOT DERIVED AND IS THE WEAKEST LINK. Whether any mode-A edge sits
    in a record a later agent would actually RESOLVE, as opposed to a task log
    or a reading receipt. One of the located occurrences is inside a
    manifest.yaml timestamp marker recording "context read complete (...,
    KN-FIND-017, KN-FIND-018)", which is a reading receipt and carries no
    scientific claim at all. If the whole mode-A set turns out to be of that
    kind, the blast radius is near zero and the finding must be reported at
    that size. This is the hypothesis's real risk and it is stated rather than
    buried.

  assumptions:
  - >-
    That 80-character extraction windows established attribution correctly. A
    sentence could cite 017 legitimately and mention SubBytes for an unrelated
    reason. The containment test is designed so this does not matter for the
    decisive class -- if 017 does not contain the attributed material the
    citation cannot be to 017 whatever the surrounding prose says -- but the
    paired experiment reads full paragraphs before classifying anything.
  - >-
    That "RESERVED BUT NOT COMMITTED TO" in the GOAL-AES records means what it
    appears to mean. The phrase could belong to a different namespace
    convention; stage 0 reads those paragraphs in full.
  - >-
    That the promotion rule in DEC-20260725-024 is the rule actually applied.
    It is read and frozen in stage 0 before being applied to any control
    population.
  - >-
    That KN-FIND-030 does not already enumerate this instance. Its body says
    "The two instances" and this session did NOT read which two. If it does,
    S1 and S2 are a rediscovery, are reported as one, and the novelty claim is
    withdrawn.
  - >-
    All figures here are SESSION-COMPUTED outside the harness and are not
    evidence. Reproduction in-harness is stage 1 of the paired experiment; any
    divergence is an erratum against this record.

  proof_search_map:
    bottleneck: >-
      The resolution step: the moment a reader turns the string KN-FIND-0xx
      into a file. Every downstream use of every promoted finding passes
      through it, it is performed silently and without tooling, and its failure
      mode is a WRONG ANSWER rather than an error. A dangling identifier would
      be caught by validation; an identifier that resolves to a real but wrong
      entry is caught by nothing in this repository, and the whole value of a
      promotion collapses at exactly that point.
    baseline_embedding:
      parameter_slice: >-
        A citation edge known to be correct: a GOAL-AES record citing
        KN-FIND-028 for its Fact 2 material. Here the intended behaviour is
        fully exercised and the classifier must return VALID.
      reproduction_check: >-
        Run the containment classifier on that edge and confirm mode = VALID.
        IF A KNOWN-CORRECT EDGE IS CLASSIFIED AS MODE A, the classifier has no
        specificity and NO mode-A count may be reported from any run. This is
        the audit's negative control and it executes before the population is
        touched.
    observation_collision:
      observable: >-
        The identifier string as it appears in a citing record.
      distinct_preimage_search: >-
        THE COLLISION IS EXHIBITED, NOT SEARCHED FOR, AND IT IS THE FINDING.
        Two distinct ground-truth objects -- (i) the Newton box-saturation
        finding from EV-BKK-001, (ii) the AES component-algebra facts about
        MixColumns and the affine layer -- share the observable "KN-FIND-017"
        in the corpus as committed. A reader who resolves the observable
        recovers (i); an author who wrote it meant (ii). The observable
        therefore does not identify the object, which is the identifiability
        failure in its purest form, and the containment test recovers the
        intended preimage from the citing sentence's own attributed material.
        The reservation-collision mode is the same failure one step earlier: two
        campaigns claimed the same observable for different objects before
        either had committed.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable fixed and enumerate its preimage: for each of
        KN-FIND-017..027, the set of DISTINCT entries that citing records
        actually mean by it. A disambiguation register mapping (citing record,
        cited id) -> resolved id, filed as a NEW record.
      predicted_gain: >-
        No mathematical gain and none is claimed. The gain is that resolution
        becomes checkable and future readers of the affected sentences get the
        entry their author meant. IMPORTANT CONSTRAINT: the register is the
        ONLY admissible repair shape. CLAUDE.md states existing records are
        immutable and must not be renamed, and AGENTS.md rule 2 says
        corrections supersede -- renaming 017..027 would invalidate every
        archive receipt binding those paths, which is exactly the failure
        KN-FIND-030 documents.
    - transform: controlled_population
      proposed_object: >-
        A matched control population for the selection gate: evidence records
        of comparable age, layout and lane whose strength is NOT replicated,
        against which the frozen promotion rule is run.
      predicted_gain: >-
        Converts an 11-of-11 rate that cannot fail into a confusion matrix that
        can. This is the null object the section 1.1 population structurally
        cannot supply.
    quantifier_order: >-
      THE SWAP IS BETWEEN THE OBJECTIVE AND WHAT WAS MEASURED. The objective
      clause reads: FOR ALL closed families, THERE EXISTS a durable knowledge
      entry SUCH THAT Tier 1-2 ideation treats it as ground truth. What the
      ledger establishes is the strictly weaker: FOR ALL section 1.1 evidence
      records, THERE EXISTS a committed file. The gap is the third clause, and
      it quantifies over READERS, not over files. A file that exists but
      resolves wrongly for some reader satisfies the weaker statement and
      violates the stronger one -- and the mode-A edges are exactly witnesses
      of that violation. Stated as the trap being hunted: a witness (the
      resolving entry) that is allowed to depend on WHO IS READING cannot
      support a conclusion asserted uniformly over readers. Note also the
      quantifier hidden in S3: "the gate promoted every replicated record" is
      a universal over a population on which the predicate is constant, and a
      universal over a constant population carries no information about the
      predicate.
    method_ceiling:
      strongest_certifiable_claim: >-
        The audit can certify, at most: that specific citation edges attribute
        material absent from the entry they name and present in exactly one
        other; the counts of each mode per entry; whether the offset over the
        mode-A set is constant; and that on the section 1.1 population the
        promotion outcome is a deterministic function of the strength field.
        It CANNOT certify that the promoted entries are unimportant, wrong, or
        unused -- a low VALID count is a fact about consumption in a program of
        ephemeral agents, nothing more. It CANNOT certify that the collision
        caused any downstream error, only that it makes one possible; whether a
        mode-A edge changed anyone's reasoning is not observable from the
        corpus. It CANNOT be generalised to the other 37 entries in
        knowledge/findings/ without repeating the measurement. Writing it up as
        "the promotion failed" would exceed every one of these limits.
      nearby_object_control: >-
        The nearby object where the desired conclusion (correct resolution)
        DOES hold is the set of edges into KN-FIND-028/029/030 from the same
        GOAL-AES records -- same authors, same files, same period, correct
        target. The classifier MUST return VALID for those. If it cannot
        separate them from the mode-A edges, it is keying on the family
        boundary rather than on content and has not found the load-bearing
        feature. This arm is required, not optional, and it is the sharpest
        available test that the method measures resolution rather than
        cross-family unfamiliarity.
    proof_obligations:
    - claim: >-
        The Fact-2 material appears in KN-FIND-028 and does not appear in
        KN-FIND-017.
      responsibility: correctness
    - claim: >-
        KN-FIND-017 and KN-FIND-028 share no technical vocabulary, so no
        alternative reading makes the citation correct.
      responsibility: strictness
    - claim: >-
        The classifier returns VALID on known-correct edges into 028/029/030.
      responsibility: feasibility
    - claim: >-
        Offsets over the mode-A set are constant and equal to 11.
      responsibility: baseline
    - claim: >-
        The frozen promotion rule refuses every member of the matched
        non-replicated control.
      responsibility: baseline
    - claim: >-
        The audit closes nothing about the quality or importance of any entry.
      responsibility: scope

  falsifiable_predictions:
  - >-
    containment(Fact-2 material, KN-FIND-028) = TRUE and
    containment(Fact-2 material, KN-FIND-017) = FALSE. Either failing withdraws
    the hypothesis entirely.
  - >-
    n_mode_A_edges >= 3 across the corpus. Exactly 1 means the defect is a
    single sentence and must be reported at that size.
  - >-
    Every mode-A edge into 017/018/019 resolves with offset exactly 11. One
    deviant offset refutes S2.
  - >-
    The negative control (a known-correct edge into KN-FIND-028) classifies as
    VALID. Failure voids every mode-A count.
  - >-
    The graded control -- deleting 0, 25, 50, 75 percent of the attributed
    material's distinctive tokens -- yields a monotone non-increasing
    classification confidence, with VALID at 0 percent and UNDECIDABLE (not
    mode A) at 75 percent. Any mode-A verdict at 75 percent means the
    classifier fabricates resolutions from thin evidence.
  - >-
    The frozen promotion rule applied to the matched non-replicated control
    promotes exactly 0 of them and reproduces the eleven promotions from
    `strength` alone with zero errors. Any deviation refutes S3.
  - >-
    Mode-C (self-reference) edges are a substantial fraction of KN-FIND-017's
    26, predicted near 11. This is a prediction about the raw metric's
    unsuitability and it can fail.

  scope_limits:
  - >-
    No mathematical claim of any kind. No exponent moves. Nothing here bears on
    the ECDLP, on AES, or on any algorithm.
  - >-
    A low VALID count for an entry is not evidence the entry is unimportant.
  - >-
    RENAMING IS FORBIDDEN AND IS NOT PROPOSED. Any repair is a new
    disambiguation register or a Coordinator-authored superseding correction.
  - >-
    The collision is a namespace defect and not a fault of either campaign;
    both followed the convention in force, and the program already owns the
    mechanism as KN-FIND-030. Any write-up assigning blame to a campaign would
    be wrong about the mechanism as well as unfair.
  - >-
    GOAL-FIND-001's completion CRITERION is about coverage and may well be met;
    this hypothesis audits the OBJECTIVE clause about downstream use, which is
    a different sentence. Conflating them would let a delivery finding
    masquerade as a coverage failure.
  - >-
    No status change to GOAL-FIND-001, GOAL-AES-001/002/003, any KN-FIND entry
    or any decision is proposed or implied. AGENTS.md rule 1 reserves that to
    the Coordinator.
