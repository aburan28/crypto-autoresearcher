  specified_at: '2026-10-04'
  approved_at: '2026-10-04'
  authorised_by: DEC-20261004-927012
  proposed_by: coordinator
  status: approved
  title: >-
    On y^2=x^3+x+1 over F_10007 the two Cheon closed forms at the exact
    maximal admissible divisors of r±1 either separate by a factor of 2
    (O-SPLIT) or they do not (O-NO-SPLIT), against a d=2 formula null

  statement: >-
    SETTING (IDEA-20261005-447d82). Let E be the pinned nonsingular curve
    y^2=x^3+x+1 over the prime field F_10007, let N=#E(F_10007), and let r
    be the largest prime factor of N. Let d_minus be the largest divisor of
    r-1 lying in [2, floor(sqrt(r))], and d_plus the largest divisor of r+1
    in that same interval. Using the group-operation shapes recorded in
    KN-LIT-90e34c, with the common log factor omitted because it cancels in
    a ratio, define B_minus=sqrt(r/d_minus)+sqrt(d_minus),
    B_plus=sqrt(r/d_plus)+d_plus, and B_rho=sqrt(r).

    CLAIMS UNDER TEST:
    (S0) Zero-compute freeze of the curve pin, closed forms, thresholds
    (split_ratio=2, null_ratio=1.25, r_min=16), dual-factor methods, the
    r_null consecutive-integer obstruction, and the d=2 nearby-object
    control. Numeric N/r/ratio are NOT preregistered.
    (SPLIT) O-SPLIT: pinned ratio max(B_minus,B_plus)/min(B_minus,B_plus)
    is at least 2, d2_ratio < 1.25, r>=16, reconstruction ok.
    (NOSPLIT) O-NO-SPLIT: pinned ratio strictly less than 2, d2_ratio < 1.25,
    r>=16, reconstruction ok.
    (ART) O-ARTIFACT: the d=2 formula ratio is at least 1.25 (the factor-2
    gap is an artifact of the two formulas at small d).
    (RSMALL) O-R-SMALL: r<16 so the admissible window is too small.
    (MIS) O-MISMATCH: the two factorizations or the two point-counts disagree,
    or a product fails to reconstruct.
    (WRONG) O-WRONG-INTEGER: reported d taken from N±1 rather than r±1.
    (SING) O-SINGULAR: curve discriminant 0 mod p.
    (IMP) O-IMPEDIMENT: timeout/crash/infra; never mathematical negative.

    The idea's r_null (smallest prime > 2^16 with (r_null-1)/2 and
    (r_null+1)/2 both prime) is empty: those two integers are consecutive,
    so the only both-prime pair is (2,3) giving r=5. That obstruction is
    frozen in Stage 0. The nearby-object control that the claim actually
    needs is the same ratio with d=2 on both sides, evaluated on the
    measured r. No auxiliary points are supplied, Cheon's algorithm is not
    run, and ordinary ECDLP is not claimed to improve.

  mechanism: >-
    Object frame from IDEA-20261005-447d82. Representation (R1): the integer
    r, the largest prime factor of the point count of a short-Weierstrass
    model, as a coordinate of the model. Operation set Sigma is the pair of
    maps r |-> r-1 and r |-> r+1 followed by exact factorization. Sigma is
    not translation on E. Trichotomy: coordinate-dependent, because every
    point of E shares the same r. Lossy-projection: discards coefficients,
    points, cofactor N/r, and the secret scalar; retains prime factors of
    r-1 and r+1. F1 (walk collision) appears only inside the closed-form
    bounds; the test does not walk. The r-1 shape charges sqrt(d) and the
    r+1 shape charges d (KN-LIT-90e34c). Compact BINSTD-style measurement,
    not an AUXIN walk successor of EXP-AUXIN-339fb0.

  assumptions:
    - r is the largest prime factor of #E(F_10007), not of a cofactor and not N itself unless N is prime.
    - The omitted O(log r) multiplier from KN-LIT-90e34c is the same on B_minus, B_plus, and B_rho, so it does not change the ratios.
    - No protocol is asserted to publish the auxiliary powers for this curve.
    - r_null as written in the idea is unsatisfiable; the d=2 formula evaluation is the constructible nearby-object control.
    - Timeouts/crashes are O-IMPEDIMENT, never negative evidence.

  proof_search_map:
    not_applicable_reason: >-
      Exact integer measurement of two divisors on one toy order, not a
      proof of an algorithm and not a security reduction. The four cheap
      audits still run as falsification aids (inventor-protocol §8).
    bottleneck: >-
      The step that can move the ratio is the pair (d_minus, d_plus) inside
      the two closed forms. Replacing either shape by the other, or finding
      no divisor above 2, removes the claimed factor-2 split.
    baseline_embedding:
      parameter_slice: >-
        One curve, p=10007, E: y^2=x^3+x+1. Nearby object: d=2 on both
        closed forms at the measured r. The idea's r_null search is empty.
      reproduction_check: >-
        Two independent factorizations of r-1 and of r+1 must return the
        same multiset of prime factors, and the product of each multiset
        must equal the integer. Two independent point-counts of E(F_p) must
        agree.
    observation_collision:
      observable: max(B_minus,B_plus)/min(B_minus,B_plus)
      distinct_preimage_search: >-
        Any other curve with the same r yields the same ratio. The d=2
        formula evaluation is a second integer with the same formulas and
        forced d=2; its ratio must stay below 1.25.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the factored integers r-1 and r+1 for this E
        predicted_gain: >-
          A certified factor-2 split or a certified failure to split, plus
          a d=2 null on which the formulas do not split.
    quantifier_order: >-
      exists one pinned curve (this E) such that the exact maximal
      admissible divisors make the Cheon-shape ratio at least 2, and the
      d=2 formula ratio on that same r is <1.25. Universal quantification
      over standardized curves is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        The exact factorizations of r-1 and r+1 for this order, and whether
        the two closed forms differ by a factor of 2 on those divisors. Not
        a solve, and not a statement about any deployed curve.
      nearby_object_control: >-
        d=2 on both sides must keep the ratio below 1.25. If the formulas
        already separate by 2 at d=2, they do not measure divisor structure.
        The idea's r_null (both (r±1)/2 prime, r>2^16) is empty because
        those halves are consecutive integers.
    proof_obligations:
      - claim: Both factorizations multiply back to r-1 and r+1.
        responsibility: correctness
      - claim: Point counts by Jacobi and Euler criterion agree.
        responsibility: correctness
      - claim: Metric uses r±1, not N±1.
        responsibility: scope

  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        No random model is used. r-1 and r+1 are factored exactly; d_minus
        and d_plus are maxima over a finite divisor set, not smoothness
        samples.
      random_model_justification: >-
        For an integer m < 10007+2*sqrt(10007)+1, trial division up to
        sqrt(m) terminates and returns every prime factor. The Cheon shapes
        are the closed forms in KN-LIT-90e34c with the common log factor
        removed from a ratio.
      supporting_results:
        - KN-LIT-90e34c (internal; closed forms)
        - Hasse bound |N-(p+1)| <= 2 sqrt(p)
      validation_experiment_ids:
        - EXP-AUXIN-fef6ac
      falsification_condition: >-
        Twin factorization disagreement, reconstruction failure, or a
        claimed smoothness sample in place of an exact factorization.

  structural_ingredients:
    - description: >-
        For prime order p, an auxiliary d-th power with d dividing p-1 costs
        O(log p*(sqrt(p/d)+sqrt(d))) group operations; inputs through exponent
        2d with d dividing p+1 cost O(log p*(sqrt(p/d)+d)).
      citation: knowledge/literature/KN-LIT-90e34c.md
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-90e34c.md
      role: the two closed forms evaluated at exact divisors
    - description: >-
        Cheon auxiliary-input attacks are not ordinary ECDLP from P and
        [alpha]P; r-1 inputs give roughly sqrt(r/d)+sqrt(d) while the r+1
        variant has a linear d term.
      citation: knowledge/techniques/KN-TECH-0f24d0.md
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-0f24d0.md
      role: taxonomy gate; no ordinary-ECDLP claim
    - description: >-
        A divisor of the right size is necessary for the attack to bite and
        is not sufficient; the census is not a vulnerability finding.
      citation: ledger/questions/RQ-AUXIN-f8d8c0.yaml
      provenance: internal
      verified_by: ledger/questions/RQ-AUXIN-f8d8c0.yaml
      role: question constraint

  reduction_chain:
    core_problem: exact r±1 divisor ratio on one toy curve
    corollaries: []

  predictions:
    - metric: max(B_minus,B_plus)/min(B_minus,B_plus) on the pinned curve
      direction: different
      minimum_effect: factor at least 2 versus the d=2 formula null < 1.25

  test_boundary:
    instances:
      - y^2=x^3+x+1 over F_10007
    parameters:
      p: 10007
      a: 1
      b: 1
      split_threshold: 2.0
      null_threshold: 1.25
      r_min: 16
    implementation: experiments/EXP-AUXIN-fef6ac/implementation/run.py
    budget:
      wall_clock_seconds: 600
      memory_gb: 1
      maximum_runs: 3

  falsification_conditions:
    - r<16, so the interval [2, floor(sqrt(r))] is too small (O-R-SMALL).
    - The two factorizations of r-1 or of r+1 disagree, or either product fails to reconstruct (O-MISMATCH).
    - The pinned ratio is strictly less than 2 (O-NO-SPLIT).
    - The d=2 formula ratio is at least 1.25 (O-ARTIFACT).
    - The reported divisors are of N±1 rather than r±1 (O-WRONG-INTEGER).

  interpretation_limits:
    - A factor-2 gap is a necessary-condition calculation. It is not a break, not a protocol finding, and not an ordinary-ECDLP improvement.
    - Nothing here transfers to NIST P-256, secp256k1, Curve25519, BN254, or BLS12-381.
    - The log-factor omission cancels in the ratio and does not certify an implementation's addition count.
    - Cheon's algorithm is not run; auxiliary points are not supplied.
    - The idea's r_null search is empty; that is a construction defect, not a Cheon-split observation.

  novelty_status: adaptation
  dominated_by: >-
    KR-RHO-13bf67 dominates any ordinary discrete-log exponent claim; this
    record makes none, and the exponent delta is 0. Opened baselines that
    do not dominate the divisor certificate: KN-LIT-90e34c, KN-TECH-0f24d0
    row 7, IDEA-20260930-704e43 (walks at planted d), KR-RHO-037e22,
    KR-RHO-93979e, KR-RHO-fb88e6. None of those is an exact factorization
    of r-1 and r+1 for this order.
  sota_delta: >-
    Ordinary discrete-log time-exponent delta is 0 versus sqrt(r). The
    quantity claimed to differ is the ratio of the two Cheon closed forms
    at the exact maximal admissible divisors of r-1 and r+1 for
    y^2=x^3+x+1 over F_10007.
  cited_evidence: []
