hypothesis:
  id: H-AUXIN-9d9ee0
  question_id: RQ-AUXIN-f8d8c0
  source_idea: IDEA-20261005-447d82
  derived_from_idea: IDEA-20261005-447d82
  experiment_id: EXP-AUXIN-fef6ac
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-AUXIN-f8d8c0 is owned by GOAL-AUXIN-a93442. This design does not edit
