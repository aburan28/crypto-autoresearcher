hypothesis:
  id: H-ICEX-fe2944
  question_id: RQ-EQLA-0d3f40
  statement: >-
    In the index-calculus pipeline as this program actually implements it, at
    summation arity m in {2, 3} and factor-base sizes |V| spanning at least a
    fourfold range at toy prime-field scale, the sparse-linear-algebra stage
    accounts for a cost share s below 1e-3 of total pipeline field operations at
    every tested cell, so the Amdahl ceiling 1/(1 - s) on any linear-algebra
    improvement is below 1.001; and s decreases as |V| grows across the tested
    range. Separately and as pure instrument calibration, the relation matrices
    the harness produces from ordinary unstructured factor bases have shift-based
    displacement rank within 2 of min(rows, cols), matching a random sparse 0/1
    matrix of identical dimensions and density.
  mechanism: >-
    Per relation, the pipeline pays one zero-dimensional polynomial-system solve
    at arity m, whose cost grows superpolynomially in |V| in practice, against an
    amortised share of one sparse solve costing Otilde(|V|^2) field operations
    over Theta(|V|) relations. The ratio of the two therefore grows with |V|, so
    the linear-algebra stage becomes RELATIVELY cheaper as the experiment gets
    larger. That is the inverse of the asymptotic regime in which index-calculus
    linear algebra is the interesting stage, and the inversion is the named
    obstruction: the target stage is dominant only in a regime this harness
    cannot instrument.
  assumptions:
  - >-
    The pipeline can be instrumented with per-stage field-operation counters
    without changing the algorithm it runs. If counter-instrumented and
    uninstrumented total runtimes disagree by more than 5 percent, the
    measurement is void and is reported as void.
  - >-
    Cost is charged in FIELD OPERATIONS on both sides of every ratio. Wall clock
    is recorded per stage as a cross-check only and never divided into an
    operation count; a wall-clock-over-operations quantity is not a cost share
    and is forbidden by this contract.
  - >-
    Toy factor-base sizes only. No claim is made about the asymptotic regime in
    which linear algebra is known to dominate; the obstruction named here is
    explicitly regime-bound.
  - >-
    Host load is a validity precondition, not a nuisance. A cell measured above
    the declared load threshold is an infrastructure event and is discarded as
    unmeasured, never reported as a small or large share.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      Purely empirical cost accounting plus an instrument calibration. The
      Amdahl identity is arithmetic; the full-displacement-rank expectation for a
      random sparse matrix is used as a null band, not proved here. Section 8 of
      the inventor protocol requires the reason to be recorded rather than the
      map omitted.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL cells (m, |V|) in the declared grid, with m in {2, 3} and |V|
      ranging over at least a fourfold interval at toy p, the per-relation field
      operation count of the polynomial-system solve exceeds the per-relation
      field operation count of the sparse solve by at least a factor 1e3.
    random_model_justification: >-
      Not a randomness assumption. The rigorous ingredient is a complexity
      comparison: a sparse solve on a matrix with O(1) entries per row costs
      Otilde(|V|^2) field operations amortised over Theta(|V|) relations, hence
      Otilde(|V|) per relation, while one decomposition attempt at arity m solves
      a zero-dimensional system whose Bezout number is polynomial in |V| with
      exponent m-1 up to the deck-group quotient. The heuristic content is only
      that measured constants do not overturn that exponent gap at the tested toy
      sizes.
    supporting_results:
    - >-
      Sparse elimination cost model, standard, used as an upper bound on the
      matrix stage rather than as a result of this program.
    validation_experiment_ids:
    - EXP-ICEX-b84478
    falsification_condition: >-
      A measured per-relation cost ratio below 1e3 at any tested cell, or a
      measured s at or above 0.1 at any tested cell.
  - id: HEUR-002
    formal_statement: >-
      FOR ALL tested cells, the shift-based displacement rank of the relation
      matrix produced from an unstructured factor base lies within 2 of
      min(rows, cols).
    random_model_justification: >-
      A sparse 0/1 matrix of the tested dimensions and density behaves, for the
      purpose of a shift displacement operator, like a generic matrix of the same
      shape, whose displacement rank is full up to a small constant. The
      justification is genericity of the matrix, not any property of the curve.
    supporting_results:
    - >-
      Genericity of displacement rank for generic matrices; used as a null band,
      not proved here.
    validation_experiment_ids:
    - EXP-ICEX-b84478
    falsification_condition: >-
      A measured displacement rank more than 2 below min(rows, cols) on any
      unstructured relation matrix, reproduced at a second seed.
  structural_ingredients:
  - description: >-
      Amdahl bookkeeping. A stage of cost share s admits a pipeline speedup of at
      most 1/(1 - s) even under infinite improvement of that stage.
    citation: arithmetic identity, no external source relied on
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, derived in this record)
    role: cost ceiling
  - description: >-
      Automorphism-discounted rho baseline convention against which any pipeline
      speedup would have to be read.
    citation: KN-TECH-018
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, file read in full)
    role: baseline calibration
  reduction_chain: null
  predictions:
  - metric: linear_algebra_cost_share_s_in_field_operations
    direction: lower
    minimum_effect: >-
      Below 1e-3 at every tested cell. A cell at or above 0.1 falsifies the
      prediction at that cell and must be reported cell-by-cell, never pooled.
  - metric: amdahl_ceiling_one_over_one_minus_s
    direction: different
    minimum_effect: >-
      Below 1.001 at every tested cell.
  - metric: trend_of_s_against_factor_base_size
    direction: lower
    minimum_effect: >-
      Strictly decreasing over the declared fourfold range of |V| at each arity,
      with the decrease exceeding the seed-to-seed interquartile range of s at
      the smallest and largest |V|.
  - metric: displacement_rank_of_unstructured_relation_matrices
    direction: different
    minimum_effect: >-
      Within 2 of min(rows, cols), matching the random sparse null within its own
      seed-to-seed spread.
  test_boundary:
    instances:
    - toy prime-field short-Weierstrass curves at the harness default ladder
    - at least 10 seeds per cell
    parameters:
      arity_m: [2, 3]
      factor_base_sizes: fourfold range, exact values frozen in EXP-ICEX-b84478
      host_load_threshold: declared and enforced per run
    implementation: >-
      The campaign index-calculus pipeline with added per-stage field-operation
      counters; the counters are the only change and their neutrality is checked.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 16
      maximum_runs: 200
  falsification_conditions:
  - >-
    s at or above 0.1 at any tested cell. The linear-algebra lane is live in this
    program's own operating regime and the closure claim fails at that cell.
  - >-
    s increases with |V| across the declared range. The inversion argument in the
    mechanism is wrong and the regime bound on the obstruction is unsupported.
  - >-
    The matrix-dominated planted control is not reported as matrix-dominated at
    the predicted magnitude. The instrument is void and every share it produced
    is inadmissible.
  - >-
    Unstructured relation matrices show displacement rank more than 2 below
    min(rows, cols). Report and replicate; this is a surprise about the harness,
    not evidence about any structured factor base.
  - >-
    Instrumented and uninstrumented total runtimes differ by more than 5 percent.
    The instrument perturbs what it measures and the run is void.
  interpretation_limits:
  - >-
    Toy scale, claim tier toy. No attack, no exponent, no speedup. The record
    bounds the VALUE of a hypothetical linear-algebra improvement and constructs
    none.
  - >-
    Pause condition P2 of GOAL-ENDO-001 reads verbatim - P2. A lane result would
    bear on H-STR-002 in either direction. Work pauses until DEFER-BATCH009-001
    is discharged under GOAL-ECDLP-001; this campaign may not transition that
    hypothesis. This hypothesis constructs no equivariant or phi-stable factor
    base, applies no isotypic fold, and measures no structured relation matrix.
    Nothing here bears on H-STR-002 in either direction, and any later citation
    of it against H-STR-002 is a misuse of the record.
  - >-
    A confirmed small s does NOT say equivariant linear algebra cannot work. It
    says this program cannot measure whether it works. That is a statement about
    the instrument's regime and is the only closure the design supports.
  - >-
    The regime where index-calculus linear algebra dominates is NOT reachable by
    this harness and is NOT tested. This claim is untestable at reachable scale
    and the contract says so rather than shrinking it to a size that can be run.
  - >-
    The displacement-rank arm's null is a random sparse 0/1 matrix, an object
    with no curve in it. If that curve-free object reproduces the measured
    displacement rank, nothing from this arm may be quoted as a statement about
    elliptic curves or the ECDLP.
  - >-
    The source idea describes a sqrt(6) = 2.449 baseline-calibration band as
    something KN-TECH-018 defines. Read verbatim, KN-TECH-018 states a rho
    speedup factor of about sqrt(|Aut|), giving sqrt(2) for negation and about
    sqrt(2m) for an order-m automorphism, and does not name a sqrt(6) band. The
    sqrt(6) figure is a READING of that entry at |Aut| = 6 and is recorded here
    as a reading, not as a quotation.
  status: proposed
  proposed_by: coordinator
