# =============================================================================
# H-BINSTD-61dad7 -- Abscissa-density Weil vacuity + toy density census
# Specified from IDEA-20260926-cafcf1 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-91a6dd.
#
# HOLD-X4 certificate-first unlocker (DEC-20260928-63addc rank 12).
# Corrects vacuous Weil support of IDEA-20260922-1a081a HB1-2 and
# IDEA-20260915-8fe0ef H1; unlocks HOLD-B restatement precondition.
# ZERO RUNS in this design packet. No AUXIN. No Bedrock. No curve attack.
# Claim tier: control / structural certificate. Ceiling: at most 2^m yield.
# =============================================================================
hypothesis:
  id: H-BINSTD-61dad7
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-cafcf1
  experiment_id: EXP-BINSTD-c05a0f
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-91a6dd
  status: approved
  proposed_by: coordinator
  title: >-
    Weil-bound vacuity of subspace abscissa density at every index-calculus
    dimension on ECC2K-130 (l <= 66 at n=131), with a toy H_random /
    H_struct density census against a shape-matched ordinary-curve control

  statement: >-
    CLAIM (control / structural certificate; HOLD-X4). On E_a : y^2 + xy =
    x^3 + a x^2 + b over F_{2^n} with b=1, nonzero x is an abscissa of E_0
    iff Tr(x)=Tr(1/x) and of E_1 iff Tr(x)+Tr(1/x)=1. For V an F_2-subspace
    of dimension l inside ker Tr, the abscissa count is 2^{l-1} + E with
    |E| <= 2^{n/2} by a Kloosterman Fourier argument (claim B of the source
    idea; Weil bound recalled). That error exceeds the main term precisely
    when l <= n/2 + 1 — at n=131 every l <= 66, covering every filed
    index-calculus dimension (m=3 ~l=44; m=4 ~l=33). CONSEQUENCES: (C) the
    stated Weil support of IDEA-20260922-1a081a HB1-2 and IDEA-20260915-
    8fe0ef H1 is VACUOUS at those dimensions (band may still hold for other
    reasons); (D) lambda_x is a free design parameter bounded only by 2^m
    in yield (4 bits at m=4), and the discriminating question is whether
    constructible families behave as H_random (binomial / extreme-value)
    or H_struct (excess density that reads b=1). HYPOTHESIS: Stage-0
    freezes the vacuity table and the two support corrections; Stages 1–3
    measure toy densities at n in {17,19,23} under F0–F3 families with the
    ordinary-curve control; Stage 4 reports exactly one of O-H-RANDOM /
    O-H-STRUCT / named instrument-defect outcomes. CLAIM TIER: control.
    NO attack. NO exponent. NO ECC2K-130 break. NO Magma/Sage/AUXIN.

  mechanism: >-
    NO NEW TRACKED OBJECT on E(F_{2^131}). Object = abscissa density of an
    F_2-subspace V (representation R1). Sigma = {Frobenius, x -> 1/x};
    phi(x)=Tr(x)+Tr(1/x) is Sigma-invariant. Trichotomy: Class III,
    coordinate-dependent (density is a field-coordinate property). Lossy
    projection x -> phi(x) is the twist selector; content of this record
    is the quantitative Fourier statement (B) and the toy H_random /
    H_struct census. WHAT IS NEW: vacuity threshold l <= n/2+1 instantiated
    at n=131; correction to two filed heuristics' stated support; blocking
    ordinary-curve control for any H_struct reading. Charged stage: factor-
    base membership / yield column of RQ-BINSTD — not decomposition cost.

  assumptions:
    - >-
      V inside ker Tr is assumed for the clean form of (B); for general V
      the same O(2^{n/2}) error applies to the product character
      (source idea assumptions).
    - >-
      Weil bound |K(lambda)| <= 2^{n/2+1} for lambda != 0 is RECALLED
      (Carlitz–Uchiyama / Weil); vacuity needs only O(2^{n/2}), not the
      constant. Stage 0 records the constant as sourced-or-flagged under
      TW-07 (HOLD-X4 remaining_uncertainty).
    - >-
      Fourier identity 1_V(x) = 2^{l-n} sum_{lambda in V^perp}
      (-1)^{Tr(lambda x)} is elementary (recalled); written in Stage 0
      so a reviewer can check line by line.
    - >-
      Yield heuristic |F|^m / (m! N) is taken as filed; this contract audits
      only the abscissa density that enters |F|.
    - >-
      No Magma/Sage/cypari2/AUXIN/Bedrock required; primary path reuses
      experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (trace, inversion)
      generalised to n in {19,23} plus a density driver.

  proof_search_map:
    bottleneck: >-
      Whether any constructible subspace family at dimension l <= n/2 has
      abscissa density beyond the binomial extreme-value prediction, given
      that the Weil bound does not forbid it. Decidable by: Stage-0
      vacuity arithmetic + support correction; Stage-1 RC-1 anchor;
      Stage-2 F0 binomial null; Stage-3 F1/F2/F3 vs ordinary control;
      Stage-4 named O-* reading.
    baseline_embedding:
      parameter_slice: >-
        l = n (whole field): density exactly 1/2 - 1/2^n on E_0 (K(0)=-1),
        reproduced by (B) with V^perp={0}. l=1: density 0 or 1 trivially
        (bound vacuous) — sanity anchor. RC-1 V={deg<9} at n=17: count
        within 256±40 (2.5 binomial sd).
      reproduction_check: >-
        Zero-compute Stage 0: vacuity table for n in {17,19,23,131};
        re-derive abscissa condition on E_0 over F_4. Stage 1: exact
        abscissa count of RC-1's V against 256±40 before any family census.
    observation_collision:
      observable: >-
        Abscissa density of V, and its maximum over a family, per
        (n, l, family, curve).
      distinct_preimage_search: >-
        High density can come from (i) genuine structure (H_struct) or
        (ii) extreme-value of a large unstructured family (H_random with
        large N). Separated by reporting family size N and extreme-value
        prediction beside every maximum, and by the ordinary-curve control
        (same N, same vacuity): (ii) matches both curves; (i) need not.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold l fixed; vary family F0 (random), F1 (multiplicative shifts
          cU), F2 (low-weight normal-basis spans), F3 (greedy in abscissa
          set). Intrinsic invariant: excess of max density over extreme-
          value prediction, curve-differentiated by ordinary control.
        predicted_gain: >-
          None beyond 2^m in yield even in the best case; transform exists
          to make the Weil-free regime measured rather than asserted.
    quantifier_order: >-
      (B) FORALL n, FORALL subspaces V of dim l inside ker Tr: abscissa
      count = 2^{l-1}+E with |E|<=2^{n/2} (arithmetic on a recalled bound).
      (D) EXISTS a family and toy cell where max density exceeds extreme-
      value by the Stage-0 threshold — the contract PREDICTS its negation
      (H_random) for F0–F3. NOT claimed: any density at l=33,n=131 beyond
      the vacuity arithmetic; any exponent; any ECDLP break.
    method_ceiling:
      strongest_certifiable_claim: >-
        At n in {17,19,23}, l in the Stage-0 grid: maximum abscissa density
        over [family] is [value] against extreme-value [value], on E_0 and
        ordinary control alike; plus the vacuity certificate at n=131 for
        every l<=66. Ceiling on attack: factor at most 2^m in yield
        (4 bits at m=4), never an exponent.
      nearby_object_control: >-
        BLOCKING. Ordinary curve of the same n (RC-1 at n=17; BRIEF n=19
        cell A=46693,B=306147) with condition Tr(x)+Tr(a)+Tr(b/x^2)=0:
        same Fourier vacuity, same binomial null. Excess on E_0 only →
        H_struct reading b=1; excess on both → family Fourier support,
        not Koblitz-specific.
    proof_obligations:
      - claim: >-
          x!=0 is an abscissa of E_0 iff Tr(x)=Tr(1/x) (re-derived).
        responsibility: correctness
      - claim: >-
          Fourier identity and |E|<=2^{n/2} (claim B); vacuity iff
          l <= n/2+1, hence all l<=66 at n=131.
        responsibility: correctness
      - claim: >-
          HB1-2 (1a081a) and H1 (8fe0ef) cite Weil support at dimensions
          where it is vacuous (correction, not band refutation).
        responsibility: baseline
      - claim: >-
          Yield gain from density d is exactly (2d)^m and at most 2^m;
          no exponent claim.
        responsibility: scope
      - claim: >-
          Ordinary control has the same vacuity and the same null;
          every family maximum carries N and extreme-value prediction.
        responsibility: interface

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Control only; source asymptotic_claim.claim_kind is control with
    time_exponent unchanged (at most 2^m yield if H_struct).

  heuristic_assumptions:
    - id: HEUR-BINSTD-cafcf1-H1
      formal_statement: >-
        (H_random.) For V drawn uniformly among dimension-l subspaces of
        ker Tr, the abscissa count is Binomial(2^l-1, 1/2) to within the
        variance, and the maximum over an enumerable family of size N of
        unstructured members follows the extreme-value law
        2^{l-1} + sqrt(2^{l-1} ln N).
      random_model_justification: >-
        Rigorous ingredient: mean over ALL subspaces is exactly
        2^{l-1}-2^{l-n}. Classical statement imitated: equidistribution of
        Kloosterman angles (Katz, recalled), making the indicator behave
        like a fair coin over unstructured sets. Vacuity of Weil support
        does not require this heuristic; the census does.
      supporting_results:
        - IDEA-20260926-cafcf1 (internal; claim B arithmetic)
        - IDEA-20260922-1a081a (internal; HB1-2 band under correction)
        - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (internal instrument)
      validation_experiment_ids:
        - EXP-BINSTD-c05a0f
      falsification_condition: >-
        F0 mean/variance outside binomial band at any Stage-2 cell, or
        F0 nulls differ between E_0 and ordinary control by more than one
        sd of the mean → O-ARTIFACT (instrument/derivation defect), not a
        mathematical refutation of vacuity (B). A family max above Stage-0
        thresholds on E_0 not on control at two n → O-H-STRUCT (positive
        outcome, still bounded by 2^m).

  structural_ingredients:
    - description: >-
        Vacuity threshold and yield-column correction unlocking HOLD-B
        restatement precondition (HOLD-X4).
      citation: DEC-20260928-63addc HOLD-X4 / hold_rerank HOLD-B
    - description: Curve-blindness C1 — cost laws read the curve through lambda_x.
      citation: IDEA-20260922-1a081a
    - description: x(P+T)=sqrt(b)/x inversion symmetry (phi invariance).
      citation: IDEA-20260922-29b1c5
    - description: Existing GF(2^n) trace/inversion instrument.
      citation: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py

  predictions:
    - metric: abscissa_count_RC1_V_deg_lt9_n17
      direction: same
      minimum_effect: >-
        Within 256 ± 40 (2.5 binomial sd); baseline anchor, not a finding.
    - metric: max_density_F1_shifts_l8_n17
      direction: same
      minimum_effect: >-
        H_random predicts ~0.65 ± 0.03 (extreme value of Binomial(255,1/2)
        over N=2^17-1); a maximum above 0.75 on E_0 that the ordinary
        control does not reach is H_struct and must be replicated at n=19
        before it is read.
    - metric: greedy_max_dim_F3_n_in_17_19_23
      direction: same
      minimum_effect: >-
        H_random predicts about log2(n)+1; a dimension exceeding that by
        3 or more at two n is H_struct.
    - metric: F0_empirical_mean_sd_vs_binomial
      direction: same
      minimum_effect: >-
        Mean and variance within sampling error of Binomial(2^l-1, 1/2)
        at every Stage-2 cell; E_0 and ordinary F0 nulls agree within one
        sd of the mean.

  test_boundary:
    instances:
      - stage0_certificate: >-
          Vacuity table l<=n/2+1 for n in {17,19,23,131}; re-derivation of
          abscissa condition; Weil-constant sourced-or-flagged; HB1-2 /
          8fe0ef H1 support-correction note; F4 sanity check.
      - stage1_anchor: >-
          RC-1 n=17, f=t^17+t^3+1, A=97044, B=126251, V={deg<9}; exact
          abscissa count vs 256±40.
      - stage2_null: >-
          F0 random subspaces, 200 draws per (n,l) on E_0 and ordinary
          control; dimensions per Stage-0 grid.
      - stage3_families: >-
          F1 multiplicative shifts; F2 low-weight normal-basis spans;
          F3 greedy (10^4 restarts); maxima with extreme-value predictions;
          E_0 vs ordinary control.
      - stage4_reading: >-
          Exactly one O-* label; no n=131 density claim beyond vacuity.
      - no_deployed_attack: >-
          No ECC2K-130 / FIPS curve decomposition run under this card.
    parameters:
      n_values: [17, 19, 23]
      l_grid:
        17: [6, 8, 9]
        19: [6, 8, 10]
        23: [8, 10, 11]
      families: [F0_random, F1_multiplicative_shifts, F2_low_weight_nb, F3_greedy]
      f0_draws_per_cell: 200
      f3_restarts: 10000
      seeds_base: 2026092671
      vacuity_n131_l_max: 66
      f1_h_struct_threshold_n17_l8: 0.75
      f3_h_struct_dim_excess: 3
      rc1:
        n: 17
        poly: t^17 + t^3 + 1
        A: 97044
        B: 126251
        V: deg_lt_9
        expected_count_center: 256
        expected_count_tol: 40
      ordinary_n19:
        A: 46693
        B: 306147
    implementation: >-
      experiments/EXP-BINSTD-c05a0f/implementation/ density driver plus
      read-only reuse of experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      (generalised to n in {19,23} under write_scope if needed as a copy
      or thin wrapper — do not overwrite the CERTBIN instrument in place
      without a documented path). Pure Python. No Magma/Sage; no AUXIN;
      no Bedrock; no SAT/Gröbner solver.
    budget:
      maximum_runs: 4
      total_cpu_hours_advisory: 2.0
      wall_clock_seconds_advisory: 7200

  falsification_conditions:
    - >-
      Anchor count outside 256±40 at RC-1 → O-ARTIFACT; nothing read.
    - >-
      F0 nulls differ between E_0 and ordinary control by more than one
      sd of the mean → O-ARTIFACT.
    - >-
      A family maximum exceeds Stage-0 thresholds on E_0 and not on the
      control at two n → O-H-STRUCT (positive outcome, still ≤2^m yield).
    - >-
      Claiming an exponent move, ECC2K-130 break, or n=131 measured density
      from this card.
    - >-
      If IDEA-20260915-eee7e4 already states the vacuity threshold: novelty
      item (B) is withdrawn in a superseding note; (C) and (D) stand
      (O-PRIOR-STATED); Stages 1–4 still run for the census.

  interpretation_limits:
    - >-
      Control on the yield column; no attack, no exponent, no run at
      n=131 beyond the vacuity arithmetic.
    - >-
      Best case is a factor 2^m in yield (4 bits at m=4), disclosed as a
      constant under docs/target-result-profile.md.
    - >-
      Corrects the stated support of HB1-2 and 8fe0ef H1; does not refute
      their bands, which may hold for other reasons.
    - >-
      Toy l are near n/2 where vacuity is marginal; do not extrapolate toy
      maxima to l=33 at n=131 — only the vacuity statement transfers
      (arithmetic).
    - >-
      Timeouts/crashes/budget aborts are O-IMPEDIMENT (AGENTS.md rule 5),
      never negative evidence against HEUR-BINSTD-cafcf1-H1 or vacuity.

  distinguishable_outcomes:
    - id: O-H-RANDOM
      meaning: >-
        All family maxima within extreme-value / F0 empirical bands on both
        E_0 and ordinary control; vacuity certificate and support
        corrections recorded — predicted outcome; yield column's 1/2^m
        factor re-supported by measurement.
    - id: O-H-STRUCT
      meaning: >-
        A named family exceeds Stage-0 thresholds on E_0 and not on the
        ordinary control at two n — constant-factor (≤2^m) yield lever that
        reads b=1; family named; never an exponent.
    - id: O-ARTIFACT
      meaning: >-
        Anchor outside 256±40, or F0 not binomial, or E_0/ordinary F0
        nulls disagree — instrument/derivation defect; no science reading.
    - id: O-PRIOR-STATED
      meaning: >-
        Vacuity threshold already stated in IDEA-20260915-eee7e4 (opened
        in Stage 0); novelty (B) withdrawn by superseding note; (C)/(D)
        and census still delivered.
    - id: O-IMPEDIMENT
      meaning: >-
        Budget/infra stop with measured quantity; never negative evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
