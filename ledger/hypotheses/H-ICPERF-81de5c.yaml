# NOT novelty-checked by this record). Rank 2 of DEC-20260916-3c0cf5.
#
# THIS HYPOTHESIS MAKES AN EXPONENT STATEMENT ABOUT THE INCUMBENT AND
# PROPOSES NO IMPROVEMENT. The one outcome that would turn it into an
# improvement claim -- c(l) decaying, i.e. a sub-exhaustive regime -- is
# pre-declared here as NOT promotable from this hypothesis's own
# experiment, and is routed to a successor that must pass the four
# promotion gates of agents/coordinator.md. See `promotion_gate_position`.
# =====================================================================

hypothesis:
  id: H-ICPERF-81de5c
  question_id: RQ-ICPERF-94c86e
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-94168f
  designed_from: IDEA-20260915-0d8e90
  designed_from_note: >-
    IDEA-20260915-0d8e90 is `proposed` with `novelty_status: adaptation` and
    was NOT novelty-screened by this record. Two of its supporting citations
    (Yokoyama-Yasuda-Takahashi-Kogure 2020; Galbraith-Gebregiyorgis 2014/806)
    are `retrieved` by another agent in another session and are NOT re-opened
    here; they are carried as pointers to where the same statement is made in
    the literature, and they support nothing in this record.
  status: specified
  proposed_by: coordinator
  recorded_at: '2026-09-16'

  statement: >-
    (L1, THE CONFLICT LAW.) On Weil-descended S_4 instances over
    V = {deg x < l} with m = 3 factor-base points, WDSat in its default
    configuration refutes an UNSATISFIABLE instance in
    conf = c * 2^{3l} conflicts with c in [0.9, 1.0], INDEPENDENT of n at
    fixed l -- that is, it visits essentially every assignment of the 3l core
    variables and prunes nothing above the leaves. Equivalently: the fitted
    slope of log2(median UNSAT conflicts) in n at fixed l is 0.00 +- 0.05.
    (L2, THE RELATION-PHASE CLOSED FORM.) Charging each target C_U = c 2^{3l}
    conflicts when undecomposable (probability 1 - p) and C_S on average when
    decomposable, with p = 1 - exp(-lambda) and lambda the exact-mean yield,
    the relation-search phase of an S_4 index calculus driven by this solver
    costs T_rel = (N_rel / p) * [(1 - p) C_U + p C_S]. In the small-lambda
    regime every shipped cell is in (lambda <= 0.33), this is
    T_rel ~ 3 c * 2^{n+l} conflicts.
    (L3, WHAT L2 SAYS.) T_rel has exponent 1 in n at fixed l -- exponentially
    worse than exhaustive search over the group (2^n) and exponentially worse
    than rho (0.886 * 2^{n/2}) -- and is INDEPENDENT of how l is balanced,
    because a larger l makes each instance 8x costlier and 8x fewer targets
    are needed, exactly cancelling. The boundary-table quantity that carries
    information is therefore the FITTED EXPONENT of T_rel in n at fixed l
    (predicted 1.00 +- 0.10), and c(l) as l grows (predicted flat).
    (L4, WHERE THE INTERESTING OUTCOME LIVES.) A measured c(l) below 0.5 at
    l = 7 or 8 would mean propagation prunes and the SAT point-decomposition
    problem has a sub-exhaustive regime -- the only route by which a
    SAT-driven index calculus could move off exponent 1. That outcome is what
    this hypothesis exists to look for; the prior is that it does not happen,
    and the prior is recorded here before the measurement.

  mechanism: >-
    WHY THE LAW IS A MECHANISM AND NOT A TAUTOLOGY. Proposition 1 of
    KN-LIT-102cdb (relayed, not reproduced) says that once the 3l core
    variables are assigned, every e-variable is fixed by propagation through
    e_k = sigma_k(x), so the DPLL tree over the core has 2^{3l} leaves. What
    it does NOT say is whether propagation from a PARTIAL core assignment
    ever refutes a subtree. L1 asserts that it essentially never does, and
    that assertion can fail in two directions that mean different things:
    c dropping with l means there IS pruning (L4); c constant means the SAT
    advantage reported in KN-LIT-102cdb is an advantage in the CONSTANT and
    the MEMORY of an exhaustive search over V^3, which is a precise, citable
    characterisation of what RQ-SATIC-1ae57a's attribution question is about.

    WHY THE UNIT IS CONFLICTS AND NOT SECONDS. Conflicts (WDSat's conf[0]) is
    hardware-independent and comparable across builds (KN-LIT-6e036d); the
    per-conflict cost t_conf grows with the ANF size and with MAX_ID and is
    machine- and load-dependent. Every exponent in L1-L3 is fitted on
    CONFLICTS, and wall seconds are reported beside them and enter no fitted
    quantity. That is also what lets this hypothesis be tested without a quiet
    host, which matters because the host is held by another lane.

    WHAT THE NULL COMPARISON HERE CANNOT DO, STATED BEFORE IT IS RUN. The
    null objects (matched random Boolean systems) are used to test ONE thing:
    that a fit to 2^{3l} is not an artifact of instance SIZE. They are
    explicitly NOT used to attribute anything to "the descended structure".
    EV-ICPERF-390707's proves_too_much object 2 FAILED: relabelling the
    variable indices of a structured instance reproduces the
    structured-versus-null gap, so that comparison cannot separate structure
    from emitted variable order. EXP-ICPERF-13f001 CH-7 removed the
    attribution from its predecessor's row for exactly this reason, and this
    record carries the same removal forward rather than quietly reinstating
    it. The separation that WOULD recover the attribution is
    IDEA-20260915-7ef636's 2x2-plus-planted-core design and is not this
    hypothesis's.

    WHY THE SYMMETRY-BREAKING CONSTANT IS WORTH MEASURING. If WDSat's -b flag
    enforced a full ordering x_1 <= x_2 <= x_3 the leaf count would be
    C(2^l + 2, 3) ~ 2^{3l}/6, i.e. c ~ 0.17. The unreviewed medians of
    RUN-ICPERF-305ca3 show about 2.5x fewer conflicts under -b, not 6x, so the
    shipped -b enforces a PARTIAL order and the gap between 2.5x and 6x is a
    measurable inefficiency of the symmetry breaking -- a number, not an
    opinion. What -b actually enforces must be READ FROM THE VENDORED SOURCE
    before the constant is interpreted; the source is in the repository.

  assumptions:
    - >-
      conf[0] counts every leaf-level conflict once and WDSat has no restarts
      that would inflate the count relative to distinct leaves. WDSat is DPLL
      with XOR reasoning and no clause learning (KN-LIT-6e036d); to be
      CONFIRMED on the vendored build and recorded, not assumed.
    - >-
      The default variable order branches on the 3l core variables first
      (P3a of H-ICPERF-cc4847: core_order reproduces default exactly on 60/60
      instances -- UNREVIEWED). Control C-KF-ORDER is the guard: if the
      default were not core-first, the known-false arm would not separate.
    - >-
      N_rel ~ |Fb_E|/2 assumes the negation map halves the unknowns and no
      Frobenius quotient. On the generator's curve, which IS a Koblitz curve
      (a, b in F_2), a Frobenius quotient exists at some n and changes N_rel
      by a further factor n -- that is IDEA-20260915-8fe0ef's object, ranked 6
      and not designed here. HEUR-2 states the assumption and this record's
      T_rel is scoped by it.
    - >-
      Every reference value taken from RUN-ICPERF-305ca3 (per-cell default-U
      medians 30978.5 / 254656.5 / 255301 conflicts, wall medians, U/S ratios,
      the ~2x symmetry-breaking wall reduction) is an UNREVIEWED OBSERVATION.
      Control C-RECON re-establishes it from results.jsonl before any new cell
      is read; until then it is an input, never a result.

  proof_search_map:
    bottleneck: >-
      The per-instance UNSAT cost of the point-decomposition solver as a
      function of l, which multiplies the number of targets to give the
      relation-search phase -- the phase RQ-ICPERF-94c86e names as the next
      column of the boundary table after point decomposition.
    baseline_embedding:
      parameter_slice: >-
        The three shipped cells. c must reproduce 0.945 / 0.971 / 0.974 from
        RUN-ICPERF-305ca3's results.jsonl with the contract's row filter
        before any new cell is read.
      reproduction_check: >-
        Recompute the per-cell default-U medians from results.jsonl and divide
        by 2^{3l}; agreement to the last printed digit, or the law is being
        fitted to the wrong numbers.
    observation_collision:
      observable: c = median UNSAT conflicts / 2^{3l}, per (cell, config, side).
      distinct_preimage_search: >-
        c ~ 1 has at least two preimages: "exhaustive core, no pruning", and
        "pruning that saves exactly what restarts or learned-clause overhead
        costs". WDSat has no learning, which removes one; the collision is
        broken measurably by counting DECISIONS as well as conflicts (under
        the exhaustive reading, decisions track the leaf count) and by the
        C-KF-ORDER arm, in which a scrambled order must visit far more than
        2^{3l} nodes -- so the LAW is a property of the core-first order, not
        of the instance size.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The cost of one relation search as a sum over targets of per-target
          charges, each charge specialised to SAT or UNSAT and to the exact
          table count of that target (which EXP-ICPERF-2f2e40 supplies
          exactly, per target, rather than as a distributional assumption).
        predicted_gain: >-
          A closed form with one measured constant per configuration,
          checkable cell by cell, which makes the n-exponent of the pipeline a
          FITTED NUMBER instead of an assumption.
    quantifier_order: >-
      FOR EVERY cell (n, l) with l <= 8 admitted by this contract's admission
      rules AND FOR EVERY default-configuration UNSAT instance on a
      certified-U SIDE-0 target, conf lies in [0.9, 1.0] * 2^{3l} up to a
      per-instance spread of at most 10% about the cell median. The EXPONENT
      claims (L1 slope, L3 slope) are about the MEDIAN across cells at fixed
      l, not about any instance.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at l <= 8, on this host, with this solver and this factor-base
        family, the SAT-driven S_4 relation search has fitted exponent 1 in n
        while the rho column has 1/2. Nothing about l >= 9, nothing about any
        other solver, nothing about m != 3, and nothing about
        summation-polynomial index calculus in general.
      nearby_object_control: >-
        Degree- and shape-matched random Boolean systems at each admitted cell
        (C-NULL). The law predicts NO fit to 2^{3l} for them. A fit there
        means the count measures instance size rather than the core structure
        and L1's mechanism paragraph is withdrawn. Scope limit recorded in
        advance: passing C-NULL does NOT license attributing the law to "the
        descended structure" (see mechanism).
    proof_obligations:
      - claim: the default order is core-first (P3a)
        responsibility: baseline
      - claim: leaf count = 2^{3l} when no partial-assignment refutation occurs
        responsibility: correctness
      - claim: T_rel closed form from per-target charges
        responsibility: runtime
      - claim: p = 1 - exp(-lambda) with the exact-mean lambda
        responsibility: success_probability
      - claim: WDSat has no restarts inflating conf[0] above the distinct-leaf count
        responsibility: interface
      - claim: every exponent is scoped to the admitted cells, this solver and this host
        responsibility: scope

  asymptotic_claim:
    problem: >-
      ECDLP on binary elliptic curves via SAT-driven S_4 (Weil-descent
      summation-polynomial) index calculus -- the INCUMBENT method, as
      instantiated by WDSat on the Trimoska factor-base family.
    prior_best: >-
      Pollard rho with the negation map, 0.886 * 2^{n/2} group operations and
      O(w) memory (KN-LIT-73f7e1 / KN-LIT-042).
    time_exponent: >-
      1 in n at fixed l, for the relation-search phase of the incumbent SAT
      pipeline: T_rel ~ 3 c * 2^{n+l} conflicts. THIS IS A MEASUREMENT OF THE
      INCUMBENT, NOT A PROPOSED IMPROVEMENT -- the number is WORSE than both
      rho (1/2) and exhaustive group search (1).
    memory_exponent: >-
      0 in the instance: WDSat's memory is fixed at compile time (about 17 MB
      flat, KN-LIT-6e036d), against rho's O(w) chosen freely. The two are not
      comparable without saying so, and this record says so.
    hidden_cofactor: >-
      t_conf, the per-conflict cost, grows polynomially in n and l (ANF size)
      and with MAX_ID. The conflicts unit hides it DELIBERATELY so that the
      exponent is fittable on a loaded host; wall seconds are reported beside
      every conflict count and enter no fit.
    claim_kind: constant_factor
    claim_kind_note: >-
      DECLARED AS THE LEAST WRONG OF THE THREE PERMITTED VALUES AND EXPLAINED
      RATHER THAN LEFT TO BE MISREAD. No exponent is improved and no cofactor
      is improved; the record MEASURES an incumbent's exponent and proposes
      nothing. `exponent_improvement` would be false. The honest reading of
      this block is: prior_best stands, this row is dominated by it at every
      n, and the only quantity this hypothesis offers the frontier is an
      honest measurement of how far the dominated row is behind.

  promotion_gate_position:
    engages_the_four_gates: false_for_this_hypothesis_as_stated
    why: >-
      agents/coordinator.md gates any asymptotic-complexity claim moving
      toward `supported`. L1-L3 are asymptotic STATEMENTS, so the gates bind
      the moment anyone proposes to move this hypothesis to `supported`, and
      they are not satisfiable from EXP-ICPERF-61c136 alone: three to five
      toy cells with a fitted slope do not constitute gate 3's concrete-cost
      table, and gate 1's lemma decomposition of the T_rel bookkeeping is not
      written. This hypothesis may therefore reach `analyzed` on its
      experiment and no further, and this record says so BEFORE the experiment
      runs so that no later reader has to infer it.
    the_outcome_that_would_change_this: >-
      L4. If c(l) is measured below 0.5 at l = 7 or 8, the SAT PDP has a
      sub-exhaustive regime and the closed form's exponent becomes an upper
      bound only. That is an IMPROVEMENT-SHAPED result and it is explicitly
      NOT promotable from this hypothesis: it would require its own
      hypothesis, its own mechanism for the pruning, and all four gates --
      proof decomposition, numbered heuristics with validation, a
      concrete-cost table with honest o(1)/memory/parallel accounting and an
      affected-vs-safe scope statement, and independent review-adversarial
      plus a red-team pass on the cost model. Recorded now, at the moment it
      costs nothing, because L4 is the outcome this line most wants to find
      and therefore the one most at risk of being over-read.

  rerandomization: null

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For a target with k unordered table solutions, the position of
        WDSat's FIRST solution in the core tree is uniform over the leaves, so
        the expected SAT conflict count satisfies
        C_S ~ C_U / (6k + 1).
      random_model_justification: >-
        Rigorous side: for a FIXED traversal order and a uniformly random
        placement of the 6k solution leaves among 2^{3l}, the expected
        position of the minimum is exactly 2^{3l}/(6k+1) -- the order
        statistics of k uniform points on [0,1], whose expected minimum is
        1/(k+1). Imitated side: that WDSat's fixed order relates to the
        solution set as a uniformly random placement does. The solution set is
        NOT random -- it is the orbit structure of triples summing to R -- so
        this is the heuristic, and it is the one this record most expects
        could fail.
      supporting_results:
        - 'Order statistics of k i.i.d. uniform points: E[min] = 1/(k+1). Elementary; derived here, no external citation offered or needed.'
        - >-
          Exact per-target k supplied by EXP-ICPERF-2f2e40's table, not
          assumed -- which is what makes this heuristic testable per k rather
          than only in aggregate.
      validation_experiment_ids:
        - EXP-ICPERF-61c136
      falsification_condition: >-
        Over >= 200 S instances per admitted cell with k known exactly from
        the table, the empirical distribution of conflicts_S / 2^{3l}
        departing from Beta(1, 6k) per k at a chi-square p below 0.01; OR the
        tail check failing -- the fraction of S instances with conflicts above
        0.9 * 2^{3l} differing from (0.1)^{6k} by more than its binomial
        sampling error. A failure means C_S is not order-uniform, which
        changes the SAT term of T_rel; it does NOT touch L1, which is an UNSAT
        statement.
    - id: HEUR-2
      formal_statement: >-
        The relation requirement is N_rel = |Fb_E| / 2 + extra with
        extra <= 10, i.e. the relation matrix over the negation quotient
        reaches full rank after that many relations.
      random_model_justification: >-
        Rigorous side: a random sparse matrix over F_r with 3 nonzeros per row
        reaches full rank with O(1) excess rows with high probability
        (classical random-matrix rank results). Imitated side: that these
        structured rows -- triples of factor-base points on one curve, with a
        parity class attached -- behave like that random matrix. They may not:
        a systematic rank deficit is exactly the trace-parity obstruction of
        IDEA-20260913-cedd2f / H-SEMBIN-83a856, under which half the targets
        have zero decompositions, or a Frobenius dependency on this Koblitz
        curve.
      supporting_results:
        - >-
          H-SEMBIN-83a856 (status supported, this program): Tr(x_P) + Tr(a)
          computes E/2E, and a V inside ker Tr gives half the targets exactly
          zero decompositions. Provenance internal; read as a committed record
          by this Coordinator, 2026-09-16.
        - >-
          Classical random sparse matrix rank results -- provenance RECALLED,
          therefore a pointer and not support (AGENTS.md rule 9). No agent in
          this program has opened a source for this bound; it backs nothing
          and is recorded so a reviewer can check the argument.
      validation_experiment_ids:
        - EXP-ICPERF-61c136
      falsification_condition: >-
        Collecting relations to 1.5 * |Fb_E|/2 at an admitted cell and finding
        `extra` above 10, or a rank profile with a systematic deficit. Either
        is reported as the named obstruction (parity class or Frobenius
        dependency) rather than as noise.

  structural_ingredients:
    - description: >-
        The 2^{ml} core search space of a Weil-descended S_{m+1} SAT instance:
        once the ml core variables are assigned, every e-variable is fixed by
        propagation.
      citation: KN-LIT-102cdb, Proposition 1
      provenance: internal
      verified_by: >-
        coordinator 2026-09-06 (PDF read, relayed into that corpus record);
        re-read as a corpus record by idea-generator TASK-20260915-5ba08b and
        by this Coordinator 2026-09-16. The underlying PDF is NOT re-opened
        here.
      role: the leaf-count premise L1 tests
    - description: >-
        WDSat is a DPLL solver with native XOR reasoning, a fixed branching
        order on the core variables and NO clause learning; conf[0] is its
        hardware-independent primary counter and its memory is fixed at
        compile time.
      citation: KN-LIT-6e036d
      provenance: internal
      verified_by: coordinator (record author); re-read 2026-09-16
      role: why conflicts is the unit and why one collision preimage is removed
    - description: >-
        The Groebner-side analogue of the same statement: under statistical
        assumptions on summation polynomials the S-polynomial cost of one
        naive point decomposition is about d^m when the ideal is trivial, and
        the naive index-calculus method "cannot be more efficient than
        Pollard's rho method ... [and] even the brute force method".
      citation: 'doi:10.1515/jmc-2019-0029, Yokoyama-Yasuda-Takahashi-Kogure, Complexity bounds on Semaev naive index calculus method for ECDLP, J. Math. Cryptol. 2020, Sections 4.1-4.2 and conclusion'
      provenance: retrieved
      verified_by: >-
        idea-generator TASK-20260915-5ba08b (WebSearch fetch, sections read in
        that session, as recorded in IDEA-20260915-0d8e90). NOT re-opened by
        this record and NOT load-bearing for anything here -- it is the
        nearest published statement of the same shape, offered so a reviewer
        can see this record is not claiming the conclusion is new.
      role: context; the SAT law is the same statement measured in conflicts
    - description: >-
        The rho baseline constant against which the exponent gap is stated,
        and the corrections this goal has already measured for it.
      citation: KN-LIT-73f7e1, with EV-ICPERF-390707 joint V6 (carry sqrt(n) not sqrt(2n); use r not #E; n = 15 unusable for an asymptotic constant at ~7 equivalence classes)
      provenance: internal
      verified_by: coordinator 2026-09-15 (KN-LIT-73f7e1); EV-ICPERF-390707 read by this Coordinator 2026-09-16
      role: the comparison column -- DERIVED here, not measured (see interpretation_limits)

  reduction_chain:
    core_problem: >-
      The per-instance cost of the SAT point-decomposition problem, and the
      relation-search phase cost it implies.
    corollaries:
      - problem: >-
          The index-calculus/rho ratio of the RQ-ICPERF-94c86e boundary table
          at the admitted cells.
        reduction_ref: >-
          Internal arithmetic: T_rel from measured C_U, C_S, p and N_rel,
          against a DERIVED rho column. No external reduction is cited.
        asymptotics_preserved: >-
          Only for the relation-search phase. Linear algebra and descent are
          not costed here and the end-to-end boundary at a cell exists only
          when every column is measured (GOAL-ICPERF-e6b6a4 objective 3).

  predictions:
    - metric: c = median UNSAT conflicts / 2^{3l}, WDSat default, certified-U SIDE-0 targets
      direction: different
      minimum_effect: in [0.9, 1.0] at every admitted cell, with per-instance spread at most 10% about the cell median
    - metric: c under symmetry breaking (-b), same targets
      direction: lower
      minimum_effect: >-
        in [0.17, 0.5]; the distance above 1/6 is the symmetry-breaking
        deficit and is REPORTED AS A NUMBER, read against what the vendored
        -b source actually enforces
    - metric: fitted slope of log2(median UNSAT conflicts) in n at fixed l
      direction: different
      minimum_effect: 0.00 +- 0.05
    - metric: fitted slope of log2(T_rel) in n at fixed l, T_rel computed from MEASURED p, C_U and C_S
      direction: different
      minimum_effect: 1.00 +- 0.10, against a DERIVED rho slope of 0.50 (the rho column is not measured here)
    - metric: T_rel at fixed n across l in {6, 7, 8} (the l-cancellation)
      direction: different
      minimum_effect: within a factor 1.5 of each other
    - metric: c on the matched random null objects at each admitted cell
      direction: different
      minimum_effect: >-
        OUTSIDE [0.9, 1.0]. EV-ICPERF-390707 recorded nulls at 20-114x higher
        conflicts where they finished (unreviewed), so the control has already
        been shown capable of separating; this restates it as a prediction.
    - metric: c under the noncore_first (scrambled) order at l <= 7
      direction: higher
      minimum_effect: >-
        conflicts far above 2^{3l} (lower bound >= 50x per the unreviewed
        prior observation). The law must FAIL here, confirming it is a
        property of the core-first order.
    - metric: 'HEUR-1: empirical conflicts_S / 2^{3l} against Beta(1, 6k) per exact k'
      direction: different
      minimum_effect: chi-square p above 0.01 per k with at least 20 instances at that k; tail fraction above 0.9 * 2^{3l} consistent with (0.1)^{6k}

  test_boundary:
    instances: >-
      Certified-U (side-0) and certified-S instances emitted by
      EXP-ICPERF-2f2e40's sampler at the cells that contract admits, plus the
      three shipped cells for the reproduction control. V = {deg x < l},
      m - 1 = 3, one Koblitz curve, one host.
    parameters:
      configs: WDSat default; WDSat -b (symmetry breaking); WDSat noncore_first (known-false order control)
      solvers_named_and_versioned: WDSat @ 61c6ff3, rebuilt per cell with exact static sizing derived from each ANF; no other engine is used
      stratification: side of x_R (0/1) separate; S and U separate, never pooled
      primary_unit: conflicts (conf[0]); decisions beside it; wall and cpu seconds SECONDARY and in no fit
    implementation: >-
      New tree under experiments/EXP-ICPERF-61c136/code/. It does not edit the
      frozen EXP-ICPERF-66fd51 tree, does not edit BATCH-a33cda's contracts,
      and consumes EXP-ICPERF-2f2e40's sampler output as data.
    budget:
      note: >-
        Advisory. The binding term is the noncore_first control, whose cost is
        >= 50x the default arm's at the same cell -- which is why the
        admission rule below is stated per (cell, config) and not per cell.

  falsification_conditions:
    - >-
      c(l) below 0.5 at l = 7 or 8 for the default order on certified-U
      side-0 targets: L1 fails and the SAT PDP has a pruning regime. L2's
      exponent becomes an UPPER BOUND only, and the interesting successor is
      to measure the pruning -- under its own hypothesis and the four
      promotion gates (see promotion_gate_position).
    - >-
      Fitted UNSAT-conflict slope in n at fixed l outside [-0.1, 0.1]: the
      per-instance cost depends on n, contradicting the leaf-count reading.
    - >-
      T_rel slope in n outside [0.85, 1.15] on the measured cells: the closed
      form is wrong somewhere named by the per-cell residuals.
    - >-
      The law fitting the null objects (c in [0.9, 1.0] for matched random
      systems): the count measures instance size, not the core, and L1's
      mechanism paragraph is withdrawn.
    - >-
      The noncore_first arm ALSO fitting c in [0.9, 1.0]: the law is not a
      property of the core-first order and the observation collision is
      unbroken.
    - >-
      NOT a falsifier: a timeout, a watchdog stop, a mis-sized build, a cell
      or config refused by an admission rule, or a censored median. Those are
      infrastructure outcomes (AGENTS.md rule 5) and a timed-out UNSAT run is
      never evidence about unsatisfiability.

  interpretation_limits:
    - >-
