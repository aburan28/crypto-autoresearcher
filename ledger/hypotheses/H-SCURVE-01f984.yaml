# H-SCURVE-01f984
# Stage-0 trigger calibration for IDEA-20261007-bc5054.
# M-221 is not this hypothesis.
hypothesis:
  id: H-SCURVE-01f984
  question_id: RQ-SCURVE-7af163
  goal_id: GOAL-SCURVE-873d08
  source_idea: IDEA-20261007-bc5054
  added: '2026-10-12'
  status: specified
  statement: >-
    On y^2 = x^3 + 3x + 2 over F_5 and on y^2 = x^3 + 1 over F_5 the
    predicate "trace equals 1, or the embedding degree is at most 12"
    triggers, and on y^2 = x^3 + 3x + 5 over F_17 it does not. The same
    predicate on the destroyed inputs trace 0 and order 5 over F_5 does
    not trigger.
  test_boundary: >-
    Three curves, one null input pair, and embedding search bound 12.
    No 221-bit field and no SafeCurves cell.
  mechanism: >-
    Trace one is the anomalous condition. An embedding degree at most
    12 is the small multiplicative-transfer condition. Both are exact
    integer checks on a point count. The null removes trace one and
    uses an order equal to the field prime, which does not divide
    p^k - 1.
  distinguishable_outcomes:
    - >-
      The point-count controls hold, both positives trigger, and the
      negative and the null do not.
    - >-
      The point-count controls hold, and a positive misses or the
      negative or the null triggers.
    - >-
      A point count disagrees or a Hasse or nonsingularity check
      fails. That outcome invalidates the run.
  falsification: >-
    The controls hold and the trigger matrix is not two positives
    followed by a negative and a null that stay quiet.
  not_claimed: >-
    No safety verdict, no M-221 comparison, and no statement about a
    deployed curve.
