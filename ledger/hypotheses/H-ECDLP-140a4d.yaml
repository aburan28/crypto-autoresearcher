hypothesis:
  id: H-ECDLP-140a4d
  question_id: RQ-SIG-001

  statement: >-
    SCOPE: the SIG lane s syzygy cascade statistic at D in {4, 5, 6}, one curve,
    against an independently generated matched-shape random null at EACH D.
    CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO STATUS CHANGE TO H-SIG-001,
    GOAL-SIG-001 OR ANY OTHER RECORD.
    GOAL-SIG-001 s committed next_action reads, verbatim, "Protocol repair PASS
    (SIG-D6-NULL-RECAL-v2). Defer calibration executor until campaign capacity
    prioritizes D>=6 null recalibration; keep D<=5 cascade admissible." The
    blocking obligation is therefore established program state, not this record s
    assertion. The claim under test is that the cascade excess over a null
    generated INDEPENDENTLY AT EACH D shrinks with D and vanishes at D = 6 -
    that is, the cascade s apparent persistence is confounded with the null s own
    degree dependence. The complementary outcome, an excess surviving at D = 6
    against an independently generated null, keeps the cascade admissible on much
    better footing than the lane currently has.
    THE RECORD IS A NULL SPECIFICATION. Its content is the CONSTRUCTION of the
    reference, and specifically the refusal to obtain the D at or above 6 null by
    extrapolating the D at or below 5 baseline, which would bake the trend under
    test into the reference.

  mechanism: >-
    Generate random systems matched to the Semaev system at each D on SHAPE ALONE
    - variable count, degree sequence, sparsity, field - with no curve structure
    anywhere in the generator, and with generation parameters at each D fixed
    without reference to any data measured at any other D. Measure the cascade
    statistic on both arms at D in {4, 5, 6}, overlapping the admissible D at or
    below 5 range so the new null can be cross-checked against the lane s
    admitted baseline where both exist. Report three quantities separately - the
    Semaev statistic per D, the null statistic per D, and the excess - because it
    is the SECOND of those that an extrapolated baseline would have hidden and
    that no record in this program currently reports.
    WHY THE NULL MUST BE SHOWN NON-VACUOUS BEFORE IT IS USED AS A REFERENCE.
    A null that returns a number is not a null that can detect anything. Two
    properties are therefore forced before any excess is read - the null s
    seed-to-seed spread at each D must be strictly positive, because a spread of
    exactly zero means the generator is not random and the reference is a
    constant masquerading as a distribution; and a cascade PLANTED in a random
    system at a known size must be detected, at swept sizes, with the detected
    magnitude tracking the planted magnitude. A statistic that cannot see a
    cascade it was told about cannot report the absence of one.
    WHERE THE ROUTE MAY SIMPLY BE UNAVAILABLE. Matched-shape systems at D = 6 may
    not solve inside any budget this program can grant. If so, that is an
    infrastructure outcome under AGENTS.md rule 5, it is reported as the largest
    D at which both arms completed, and it is NEVER converted into a negative
    result or repaired by extrapolating the lower-degree null.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. No algorithm and no exponent. Compute is dominated by
    solving matched-shape random systems at D = 6, which is the lane s existing
    binding constraint and the recorded reason the work was deferred.

  rerandomization: null

  proof_search_map:
    not_applicable_reason: >-
      A baseline-calibration control, not a proof-oriented proposal - no theorem,
      reduction, certificate family or asymptotic is asserted. Recorded as
      non-applicable rather than omitted, per docs/inventor-protocol.md section
      8. The one proof-adjacent element, that a generic system of matched shape
      has syzygy behaviour governed by the Koszul complex, is used only as a
      sanity comparison where computable and is not relied on for any verdict.

  assumptions:
    - >-
      Matched-shape random systems are generable and solvable at D = 6 within the
      declared budget. IF NOT, the lane s blocking question is unanswerable by
      this route and the record reports that rather than substituting an
      extrapolated null.
    - >-
      Matched shape is fully specifiable - variable count, degree sequence,
      sparsity, field. Every dimension NOT matched is a confound and must be
      enumerated explicitly in the run record; an unenumerated mismatch
      invalidates the comparison at that D.
    - >-
      No null generation parameter at any D is fitted, tuned or selected using
      data measured at any other D. This independence must be auditable from the
      run record alone, not asserted in prose.

  heuristic_assumptions:
    - id: HEUR-NULL-1
      formal_statement: >-
        A random system matched on variable count, degree sequence, sparsity and
        field is an admissible null for the Semaev cascade statistic at every
        tested D, in the sense that its expected cascade statistic is what the
        Semaev statistic would be if the Semaev system carried no structure
        beyond its shape.
      random_model_justification: >-
        The rigorous ingredient is that for a generic system of matched shape the
        syzygies are governed by the Koszul complex and are therefore predictable
        from shape alone, independently of any curve. THE GAP, AND IT IS THE
        LANE S WHOLE SUBJECT - matched shape does not imply matched syzygy
        behaviour, because the Semaev system is not generic; that non-genericity
        is exactly what is under study, so admissibility of the null is assumed,
        not proved.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-de5206]
      falsification_condition: >-
        The planted-cascade control failing to fire at any planted size, or the
        null exhibiting cascade structure that its shape alone cannot explain
        (checked against the Koszul prediction wherever that prediction is
        computable at the tested D).

  structural_ingredients:
    - description: >-
        GOAL-SIG-001 s committed next_action, which names D at or above 6 null
        recalibration as the deferred blocking step and records that the D at or
        below 5 cascade remains admissible.
      citation: ledger/goals/GOAL-SIG-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/goals/GOAL-SIG-001.yaml lines 90-110 directly. The next_action
        string quoted in this record s statement is verbatim from line 104-106.
        The remainder of that goal record was NOT read.
      role: establishes that the obligation is program state, not this record s claim
    - description: >-
        The SIG lane s declared instrumented object and decision target.
      citation: ledger/RQ-SIG-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/RQ-SIG-001.yaml in full (33 lines).
      role: defines the statistic being calibrated
    - description: >-
        The lane s admitted D at or below 5 baseline, against which the new null
        must agree in the overlap.
      citation: >-
        Referenced by IDEA-20260815-76b225 and by GOAL-SIG-001 s next_action. THE
        UNDERLYING BASELINE RUN RECORDS WERE NOT OPENED BY THIS AGENT and no
        numeric value from them is asserted here; Stage 0 must resolve them from
        committed artifacts before the overlap check can be scored.
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04 - read only
        ledger/goals/GOAL-SIG-001.yaml lines 90-110 and
        ledger/proposals/IDEA-20260815-76b225.yaml. The existence of the baseline
        is confirmed from those; its values are not.
      role: overlap cross-check, and a check on the existing baseline itself

  predictions:
    - metric: >-
        P1 - null seed-to-seed spread of the cascade statistic at each D, over at
        least 3 independent seeds, reported BEFORE any excess is computed
      direction: different
      minimum_effect: >-
        STRICTLY GREATER THAN ZERO at every D. A spread of exactly 0 means the
        generator is not random, the reference is a constant, and the excess it
        would produce is a width-zero comparison that could never fire - the run
        STOPS at that D and reports a degenerate null.
    - metric: >-
        P2 - PLANTED CASCADE dynamic range - a cascade planted in a random system
        at known size s, s swept over at least 4 values spanning an order of
        magnitude
      direction: higher
      minimum_effect: >-
        Detected at EVERY planted size, with the measured magnitude increasing
        monotonically in s and matching the pre-computed predicted magnitude
        within the seed spread. Detection at one size only is not a pass.
    - metric: >-
        P3 - agreement between the new independently generated null and the
        lane s admitted baseline at D at or below 5
      direction: different
      minimum_effect: >-
        FORCED AGREEMENT within the measured generation variance. Disagreement
        blocks the lane until resolved and is itself an important finding about
        the existing baseline, not a nuisance to be averaged away.
    - metric: >-
        P4 - the NULL S OWN cascade statistic as a function of D, reported as a
        standalone quantity with its spread
      direction: different
      minimum_effect: >-
        No direction pre-committed. THIS IS THE QUANTITY AN EXTRAPOLATED BASELINE
        WOULD HAVE HIDDEN and reporting it is the record s primary deliverable
        regardless of what the excess does.
    - metric: >-
        P5 - cascade excess, defined as Semaev statistic minus mean null
        statistic at the same D, in units of the statistic (integer count),
        reported per D with the interval induced by the null spread
      direction: lower
      minimum_effect: >-
        BOUNDED is declared if the excess at D = 6 is within the null s own seed
        spread at D = 6. SURVIVING is declared if the excess at D = 6 exceeds
        twice that spread. The band between is pre-declared INCONCLUSIVE at D = 6
        and must be reported as such.
    - metric: >-
        P6 - CURVE-FREE SCOPE GATE - the null arm is itself curve-free by
        construction, and the record states the consequence in advance
      direction: different
      minimum_effect: >-
        If the Semaev arm and the matched curve-free arm are indistinguishable at
        every reached D, then the cascade at those degrees is a property of
        systems of that shape and NOTHING from this experiment may be quoted as a
        statement about elliptic curves or the ECDLP. This is the outcome the
        record considers most likely at D = 6 and it is written down in advance
        so it cannot be reframed afterwards.

  test_boundary:
    instances: >-
      One curve from the SIG lane s panel at the lane s existing summation arity;
      matched-shape random systems generated independently at each D; a planted-
      cascade arm inside the random ensemble.
    parameters:
      degrees: [4, 5, 6]
      null_seeds_per_degree: 3
      planted_cascade_sizes: at least 4 values spanning an order of magnitude
      matched_dimensions: [variable_count, degree_sequence, sparsity, field]
      unmatched_dimensions: enumerated per run, never left implicit
    implementation: >-
      The lane s existing Groebner and cascade instrumentation, plus an
      independent matched-shape system generator whose per-D parameters are
      derived only from the Semaev system s shape at that D.
    budget:
      wall_clock_seconds_per_run: 21600
      maximum_memory_gb: 16
      maximum_runs: 60

  falsification_conditions:
    - >-
      F1 - the null s seed spread is exactly 0 at any D. Degenerate null; that D
      is stopped and reported, and no excess is computed there.
    - >-
      F2 - the planted cascade is not detected at every planted size, or the
      detected magnitude does not track the planted magnitude. The statistic is
      not fit for purpose and NO negative from it is admissible.
    - >-
      F3 - the new null disagrees with the lane s admitted D at or below 5
      baseline beyond generation variance. One of the two is wrong; the lane is
      blocked until it is resolved, and this is a finding about the existing
      baseline.
    - >-
      F4 - D = 6 systems do not solve within budget on either arm. The route is
      unavailable. Report the largest D reached and the resource trace as
      failed_infrastructure; NEVER extrapolate the lower-degree null to fill the
      gap, and never report a negative from the missing cell (AGENTS.md rule 5).
    - >-
      F5 - solver timeout asymmetry - the null solves at D = 6 and the Semaev
      system does not, or the reverse. The comparison at that D is between a
      measurement and a non-measurement and is withdrawn.
    - >-
      F6 - the cascade excess vanishes at D = 6 against the matched null. The
      cascade is bounded at the tested scope, which is the lane s decision
      reached honestly and is a completed result rather than a failure.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Calibrates a baseline. Decides the cascade question only
      within the tested D range, on the tested curve, under one solver.
    - >-
      No exponent and no attack. If the cascade survives, its exploitability
      needs its own cost table and this record supplies none.
    - >-
      A bounded verdict at D = 6 is scoped to D = 6 and does not close the lane
      at higher degrees.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. Whether the cascade
      persists at the degrees an actual decomposition attack would need is beyond
      any budget this program can grant, and the record does not shrink its claim
      to hide that - it reports the largest D it reached and leaves the rest
      open.
    - >-
      The matched-shape null is assumed admissible, not proved admissible. A
      vanishing excess therefore bounds the cascade against THIS null, not
      against every possible reference.
    - >-
      Changes no status. Any consequence for H-SIG-001 or GOAL-SIG-001 is a
      Coordinator decision made elsewhere on committed evidence.

  status: proposed
  proposed_by: coordinator

