  title: >-
    The whole-field attempt coefficient is 2^59 times 128/131.
  statement: >-
    Twice 131 is 262. The ratio 256/262 reduces to 128/131, and 128 times
    131 is 16768, which is 393 below 131 times 131. The attempt
    coefficient 2^67 / 262 equals 2^59 times 128/131, so it lies strictly
    below 2^59. The stored-residual coefficient 2^66 / 262 equals 2^58
    times 128/131, so it lies strictly below 2^58. The prefactor
    2^132 / 262 equals 2^124 times 128/131, so it lies strictly below
    2^124. The base-2 logarithm of 262 lies strictly above 803/100 and
    strictly below 804/100. The factorial 12! is 479001600. Its base-2
    logarithm lies strictly above 28835/1000 and strictly below
    28836/1000, so the written 288/10 is low. The ratio 2^29 / 12! equals
    524288/467775, which is strictly above 1, so 2^96 / 12! lies strictly
    above 2^67. At a base of 2^8 the product 2^25 times 262 is
    8791261184, which exceeds 479001600 by 8312259584.
  mechanism: >-
    The proposal prices a free-leg search and a double-large-prime
    prefactor by dividing powers of two by 262. This contract checks
    those quotients and the factorial comparison. It does not build a
    factor base and it does not run an oracle.
