# H-CANL-2d15e2 — specified from IDEA-20261005-8276a8.
# Protocol approval is DEC-20261006-8faafb. This record asserts no
# xedni success and no change in the discrete-log exponent 1/2.
# The design session checked point substitutions, discriminants, and
# the F_17 guard count. It did not compute Q_4.
hypothesis:
  id: H-CANL-2d15e2
  question_id: RQ-CANL-63098f
  source_proposal: IDEA-20261005-8276a8
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-CANL-2e09c5 is
    approved for a later executor. It does not mean the CM-null gap
    is at least 0.25. Status moves only by DEC-20261006-8faafb under
    the standing user authorization of 2026-09-06. This design session
    wrote no run artifact and did not double a point to 16P.
  proposed_by: coordinator
  conversion_note: >-
    The prediction, the three models, the points (2, 3), (0, 1), and
    (1, 1), the thresholds 0.25, 0.10, and 0.05, the ordinary test
    against #E(F_19) = 20, the square-free kernel test, and the p=17
    refusal are carried from IDEA-20261005-8276a8. The Coordinator
    pinned Decimal precision 50, the cancellation of 4^n in Q_n, the
    boundary band 1e-12, and the agreed point count 18 at p=17.

  statement: >-
    TEST BOUNDARY. Let p=19. Let C_cm be y^2 = x^3 + 1 over Q with
    P_cm = (2, 3), C_n1 be y^2 = x^3 + x + 1 with P_n1 = (0, 1), and
    C_n2 be y^2 = x^3 - x + 1 with P_n2 = (1, 1). For x(2^n P) = a/b
    in lowest terms with b > 0, h = ln max(|a|, |b|) when that maximum
    is at least 2, using natural log at Decimal precision 50.
    hhat_n = h / 4^n and lambda_{19,n} = v_19(b) * ln(19) / 4^n.
    Q_n = lambda_{19,n} / hhat_n when h > 0, and is undefined when
    h = 0. The ratio equals v_19(b) * ln(19) / h.

    PRE-REGISTERED PREDICTION, fixed before any executor run. After
    the reduction of C_cm at 19 is ordinary (#E is not 20), both nulls
    pass the non-CM square-free-kernel test at q = 5, 7, 19, every
    scored point has |Q_4 - Q_3| <= 0.05, and the procedure refuses
    to score y^2 = x^3 + 1 at p=17, the gaps satisfy
    |Q_4(P_cm) - Q_4(P_n1)| >= 0.25 and
    |Q_4(P_n1) - Q_4(P_n2)| <= 0.10. A finished CM-null gap strictly
    below 0.25, with the null-null gap at most 0.10 and those gates
    passing, falsifies a CM effect of this quantity at this pin.
    Xedni is not claimed to work.

    DISTINGUISHABLE OUTCOMES. (1) The gates pass and both inequalities
    hold: the branch claim holds at this pin. (2) The gates pass,
    the null-null gap is at most 0.10, and the CM-null gap is strictly
    below 0.25: the branch claim fails. (3) The null-null gap exceeds
    0.10: the nulls do not match, and the claim fails. (4) The
    reduction at 19 is supersingular, a null fails the kernel test,
    a height is undefined, or a ratio drifts by more than 0.05: the
    claim is not scored as a separation. (5) A Q_4 comparison is
    emitted at p=17: the object identification fails. (6) A timeout
    or a disagreement of the two rational implementations: infrastructure
    or void, not a statement about canonical height.

  mechanism: >-
    Representation: three short-Weierstrass models over Q, one of them
    the j=0 model. Operation set: duplication on the Mordell-Weil
    group. The integer ratio Q_n is read on that orbit after the same
    4^n normalization of the p-denominator and the naive height.
    Adding an unrelated point leaves the orbit. The projection
    discards y, every prime valuation except 19, and the archimedean
    size except as the denominator of Q_n. Many points can share a
    ratio. The ratio is used only where |Q_4 - Q_3| <= 0.05. The
    ordinary reduction of the j=0 model names which global model is
    the candidate canonical lift of its special fiber. No discrete
    log is lifted. KR-IC-cd159a remains the standing negative result
    for lift-to-Q attacks.

  assumptions:
    - (2, 3) lies on y^2 = x^3 + 1, (0, 1) lies on y^2 = x^3 + x + 1, and (1, 1) lies on y^2 = x^3 - x + 1, by direct substitution. None is asserted to generate the Mordell-Weil group.
    - Q_4 is an operational ratio of two exact functions of a and b. It is not asserted to equal a Neron local height unless |Q_4 - Q_3| <= 0.05 on that point.
    - The factor sqrt(6) on a j=0 curve is a rho constant. It is not Q_4.
    - This session counted #E(F_17) = 18 for y^2 = x^3 + 1. It did not compute 16P and it does not know Q_4.

  proof_search_map:
    bottleneck: >-
      Whether v_19 of the denominator of x(16P), divided by the naive
      height of that same point, differs by at least 0.25 between the
      j=0 model and C_n1 while the two nulls differ by at most 0.10.
      Rank, class-polynomial degree, and the rho automorphism factor
      are different quantities.
    baseline_embedding:
      parameter_slice: >-
        p=19, n=4, three named models and three named integral points,
        plus the refused reduction at p=17.
      reproduction_check: >-
        Two rational implementations return the same reduced x(8P) and
        x(16P), and two point counters agree on every required #E(F_q).
    observation_collision:
      observable: Q_4
      distinct_preimage_search: >-
        C_n1 and C_n2 are two non-CM models at the same p. If their
        Q_4 values differ by more than 0.10, the observable moves with
        the curve and not only with the CM label, and the claim fails.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Q_4 on the doubling orbit of each named point
        predicted_gain: >-
          A gap of at least 0.25 between the j=0 model and C_n1, with
          the two nulls inside 0.10, or an explicit failure of that gap.
    quantifier_order: >-
      There exist three named points on three named models such that,
      after the ordinary and non-CM checks, the CM-null gap is at
      least 0.25 and the null-null gap is at most 0.10. Not for all
      CM curves, and not for all primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        At p=19 and n=4, either this denominator share separates the
        j=0 model from C_n1 by at least 0.25 while the nulls differ by
        at most 0.10, or it does not. No ECDLP solve is certifiable
        from Q_4.
      nearby_object_control: >-
        At p=17 the curve y^2 = x^3 + 1 has trace 0. The procedure
        must refuse to score it. Emitting a finite comparison there
        falsifies the identification of the object.
    proof_obligations:
      - claim: Q_4 is computed from the denominator valuation and the naive height of the same point 16P.
        responsibility: correctness
      - claim: The CM-null gap at this pin is at least 0.25 when the null-null gap is at most 0.10.
        responsibility: baseline
      - claim: No xedni success and no exponent change is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits one height-share comparison. It is not a
      proof that a lift solves or fails ECDLP beyond KR-IC-cd159a.

  rerandomization: >-
    There is no re-randomizing walk. The three orbits are the named
    points doubled in place. No discrete log is pulled back.

  asymptotic_claim:
    problem: >-
      Whether Q_4 at p=19 and n=4 meets the two inequalities in the
      prediction. ECDLP is not claimed to be faster.
    prior_best: >-
      Pollard rho at exponent 1/2. On the j=0 model the iteration
      count is discounted by sqrt(6), a constant, as in KR-RHO-0528e7
      and KN-TECH-018. KR-IC-cd159a says characteristic-zero lifts do
      not beat that baseline.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. Coordinate bits of 2^n P
      grow like 4^n times the naive height. At n=4 that is a
      measurement cost.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement of ECDLP is claimed, so none of those three labels
      is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        No random model is used. Q_4 is a ratio of two exact functions
        of the integers a, b in x(16P) = a/b. No distribution of
        heights is assumed.
      random_model_justification: >-
        The duplication map is the chord-and-tangent formula, and v_19
        and the naive height of a reduced fraction are exact. The
        frontier row KR-IC-cd159a, opened this session, records that
        xedni fails. That failure is not a distribution for Q_4. The
        literature note behind the row was not opened in this session.
      supporting_results:
        - ref: IDEA-20261005-8276a8
          provenance: internal
          claim: >-
            The proposal states Q_4, the thresholds 0.25 and 0.10, and
            the rule that a CM-null gap below 0.25 falsifies a CM effect
            at this pin.
          verified_by: ledger/proposals/IDEA-20261005-8276a8.yaml
        - ref: KR-IC-cd159a
          provenance: internal
          claim: >-
            Xedni and lifting to characteristic zero fail with negligible
            probability. This hypothesis does not contradict that row.
          verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
      validation_experiment_ids:
        - EXP-CANL-2e09c5
      falsification_condition: >-
        The gates pass, the null-null gap is at most 0.10, and the
        CM-null gap is strictly below 0.25. That is the branch negative.
        An undefined height does not falsify the arithmetic.

  structural_ingredients:
    - description: >-
        Xedni calculus and lifting to characteristic zero succeed with
        negligible probability. A measured Q_4 does not revive them.
      citation: KR-IC-cd159a
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
      role: standing negative result that bounds the interpretation
    - description: >-
        An automorphism group of order m discounts rho's iteration
        count by about sqrt(m). For j=0 the factor is sqrt(6). The
        exponent stays 1/2.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
      role: rho-constant control, not a height
    - description: >-
        The program charges the automorphism-adjusted rho constant.
        The discount is a constant, not an attack.
      citation: KN-TECH-018
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-018.md
      role: same rho-constant control, second source

  reduction_chain:
    core_problem: >-
      The numerical comparison of Q_4 on three named points at p=19.
    corollaries: []

  predictions:
    - metric: abs(Q_4(P_cm) - Q_4(P_n1)), gated by abs(Q_4(P_n1) - Q_4(P_n2)) <= 0.10
      direction: different
      minimum_effect: CM-null gap at least 0.25 and null-null gap at most 0.10

  test_boundary:
    instances:
      - C_cm with P_cm = (2, 3)
      - C_n1 with P_n1 = (0, 1)
      - C_n2 with P_n2 = (1, 1)
      - refused guard y^2 = x^3 + 1 over F_17
    parameters:
      prime: 19
      duplication_index: 4
      decimal_precision: 50
    implementation: >-
      Exact rational doubling, two implementations, Decimal natural log
      at precision 50. No computer-algebra system is required.
    budget:
      maximum_runs: 1
      enforcement: advisory

  falsification_conditions:
    - The reduction of C_cm at 19 is supersingular, so the canonical-lift label does not apply.
    - Either null fails the non-CM kernel test.
    - hhat_4 = 0 on any scored point, or a double lands at infinity.
    - abs(Q_4 - Q_3) > 0.05 on any scored point.
    - abs(Q_4(P_cm) - Q_4(P_n1)) < 0.25 while the null-null gap is at most 0.10 and the other gates pass.
    - abs(Q_4(P_n1) - Q_4(P_n2)) > 0.10.
    - The procedure emits a Q_4 comparison for the supersingular j=0 reduction at p=17.

  interpretation_limits:
    - KR-IC-cd159a already says lift-to-characteristic-zero ECDLP attacks fail. A large or small Q_4 does not revive xedni and does not move the exponent 1/2.
    - Q_4 is not the canonical height of order N in the decision target of RQ-CANL-63098f unless a later argument identifies them.
    - Toy claim tier only. p=19 and n=4 do not transfer to cryptographic primes.
    - The sqrt(6) rho discount is a constant on a different algorithm.

  citations:
    - ref: IDEA-20261005-8276a8
      provenance: internal
      claim: >-
        Source prediction and gates, carried into this hypothesis
        without a change of threshold.
      verified_by: ledger/proposals/IDEA-20261005-8276a8.yaml
    - ref: KR-IC-cd159a
      provenance: internal
      claim: >-
        Xedni and characteristic-zero lifts fail with negligible
        probability.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The j=0 automorphism discount is sqrt(6), a constant, and the
        exponent remains 1/2.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        The rho baseline constant is adjusted by about sqrt(|Aut|).
        That adjustment is not a height.
      verified_by: knowledge/techniques/KN-TECH-018.md
