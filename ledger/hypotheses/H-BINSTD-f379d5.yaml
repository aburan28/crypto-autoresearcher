# =============================================================================
hypothesis:
  id: H-BINSTD-f379d5
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-6cf862
  experiment_id: EXP-BINSTD-f018f4
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-09-30'
  approved_at: '2026-09-30'
  authorised_by: DEC-20260930-210890
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6cf862.yaml
  proposed_by: coordinator
  title: >-
    On the five composite-degree ANSI curves the F_{2^16}-rational factor base
    is structurally empty in the prime-order subgroup (h = #E(F_q), gcd(h,r)=1);
    that obstruction is subgroup reachability inside KN-OPEN-020's high-degree
    class; the surviving phi-stable F_{2^16}-subspace lattice has d =
    ord_k(2^16) = 5,3,1,9,11 and only c2pnb272w1 admits every dimension — with
    corrected matched-rho label sqrt(pi*r/(4k)) and net Frobenius-quotient gap
    sqrt(k) (relation) / k^(3/2) (LA)

  statement: >-
    SETTING. The five composite-degree ANSI X9.62 binary curves are subfield
    curves E/F_q with q = 2^16, attacked over F_{q^k}, k prime: c2pnb176v1
    (k=11), c2pnb208w1 (13), c2pnb272w1 (17), c2pnb304w1 (19), c2pnb368w1 (23)
    (analysis/binstd-curve-audit/; OpenSSL 3.0.13 secondary source). phi denotes
    the q-power Frobenius. G is the prime-order subgroup of order r (161, 193,
    257, 289, 353 bits); h the published cofactor.

    (A) EMPTINESS. The subfield-rational factor base F_sub = E(F_q) is
    STRUCTURALLY EMPTY in G at deployed parameters, with a one-line
    certificate and no compute: E(F_q) = ker(phi-1) has order exactly
    #E(F_q) = q+1-t, and the audit certifies this integer IS the published
    cofactor h (Weil recursion from t reproduces the published group order).
    Since r is prime and r > h, gcd(h,r)=1, so G ∩ E(F_q) = {O}. Every
    F_q-rational combination lies in E(F_q); a target R in G, R≠O, is never
    such a sum. General lemma stated by IDEA-20260906-a77711 at toy scale;
    this hypothesis instantiates it at the five deployed rows with certificates.

    (B) KN-OPEN-020 OBSTRUCTION CLASS. F_sub is not a bounded-degree algebraic
    factor base (membership predicate degree 2^16), so it sits in
    KN-OPEN-020's HIGH-DEGREE open class. It nevertheless fails completely for
    a reason outside degree/Bezout/coverage: cofactor-subgroup coprimality
    (subgroup reachability). This is a second, independent obstruction living
    inside that open class.

    (C) PHI-STABLE LATTICE CENSUS (CORRECTED NET FIGURES). The surviving object
    is V_W = {P in E(F_{q^k}): x(P) in W} for W an F_q-subspace of F_{q^k} with
    W^q = W. By the normal-basis theorem the phi-stable F_q-subspaces are the
    monic divisors of T^k-1 over F_q. For k odd prime, with
    d = ord_k(2^16) = 5, 3, 1, 9, 11 at k = 11, 13, 17, 19, 23, there are
    2^{1+(k-1)/d} stable subspaces (counts 8, 32, 2^17, 8, 8) with dimension
    sets {0,1,5,6,10,11}, {0,1,3,4,6,7,9,10,12,13}, {0..17},
    {0,1,9,10,18,19}, {0,1,11,12,22,23}. Only c2pnb272w1 (d=1) admits every
    dimension. CORRECTED MATCHED-RHO LABEL (CORR-20260922-81aeab; review):
    sqrt(pi*r/(4k)) group operations — quoted rows KEPT:
    2^78.1, 2^94.0, 2^125.8, 2^141.7, 2^173.6. CORRECTED NET FROBENIUS-
    QUOTIENT GAP (conditional on a full factor-k relation gain): sqrt(k) on
    the relation-dominated branch (2^1.73, 1.85, 2.04, 2.12, 2.26 at the five
    k); k^(3/2) on the LA-dominated branch. NO exponent moves either way.
    The original IDEA's sqrt(k/2) net is retained only as a named falsifiable
    alternative derived against the wrong label.

  statement_note: >-
    IDEA-20260922-6cf862 claim text is immutable and left at status proposed.
    Review verdict sound_with_corrections: (i) replace matched-rho label by
    sqrt(pi*r/(4k)), keep quoted rows; (ii) replace net movement sqrt(k/2) by
    sqrt(k) / k^(3/2); (iii) freeze per-row product-law floor and lattice
    rounding cost as Stage 0 deliverables; (iv) name concrete toy curves for
    Part 2. This hypothesis freezes those corrections as primary predictions.

  mechanism: >-
    OBJECT FRAME. Representation: x-coordinate of a point of E(F_{q^k}) as a
    vector in the F_q[T]/(T^k-1)-module F_{q^k} (normal basis), phi = cyclic
    shift. Operation set Sigma: translation by factor-base elements together
    with <phi> of order k (partial-action Class I). Lossy projection pi sends
    P in V_W to its <phi>-orbit index, discarding log_2 k bits per leg;
    Sigma-compatible because W is phi-stable and phi acts as a scalar on G.
    The priced open number is orbit canonicalisation (Booth, O(k) word
    comparisons in a normal basis). Emptiness (A) is subgroup reachability,
    invisible to cost models that charge only description/membership/relation/
    descent. Off-limits components used: F2 (factor-base decomposition), F6
    (endomorphism orbit).

  assumptions:
    - k is an odd prime and q = 2^16, so T^k-1 = (T-1) Phi_k over F_q is squarefree.
    - r is prime and r > h (true at published parameters for all five rows).
    - Normal basis theorem for F_{q^k}/F_q (classical).
    - Uses F2 and F6 as declared components.
    - Arithmetic only at deployed parameters for Stage 0; no attack run at m >= 131.
    - Toy Stage 1 cells must pass coprimality screening (gcd(h_cell, r_cell)=1)
      before use; screened-out cells are reported, not used as tests of (A).
    - Net gap figures are conditional on a full factor-k relation gain (upper
      bound; S2 rank question deferred).

  proof_search_map:
    bottleneck: >-
      Before any cost can be charged for an index-calculus line on the five
      composite-degree ANSI curves, someone must say WHAT the factor base is.
      The two structurally described candidates are the F_q-rational points and
      the phi-stable F_q-subspaces. The first is empty for a reason no cost
      model charges (subgroup reachability).
    baseline_embedding:
      parameter_slice: >-
        IDEA-20260918-9abf42's closed form at base field F_2 must be reproduced
        exactly when q is set to 2: f = 1+(n-1)/ord_n(2), dims {0,1}+ord_n(2).{...};
        at n=131 exactly four subspaces of dimensions 0, 1, 130, 131.
      reproduction_check: >-
        (i) Setting q=2, k=131 in (C) returns f=2 and dims {0,1,130,131}.
        (ii) Independent factorisation of T^k-1 over F_{2^16} yields factor
        counts 3,5,17,3,3. (iii) Cofactor identity h=q+1-t reproduces
        65390, 65096, 65286, 65070, 65392 from traces 147,441,251,467,145.
        (iv) Matched-rho closed form sqrt(pi*r/(4k)) reproduces the kept rows
        78.1, 94.0, 125.8, 141.7, 173.6 (CORR-20260922-81aeab).
    observation_collision:
      observable: >-
        Pair (number of phi-stable F_q-subspaces, dimension set) at each k;
        boolean "exists phi-stable W of dim l with (m-1)l >= k for some m<=5".
      distinct_preimage_search: >-
        Coarse lattice may be arithmetic (ord_k(2^16)) or an artefact of
        restricting to SUBSPACES. Distinguishing preimage: orbit-union family
        of KN-FIND-47da4e (stable at every size); if coarseness were an
        artefact, orbit unions would relieve it. Reported as control, not support.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The <phi>-orbit class of a factor-base point, canonicalised by cyclic
          minimisation in a normal basis
        predicted_gain: >-
          Relation-search system count / k, LA dimension / k (cost / k^2), at
          O(k) word comparisons per canonicalisation. CORRECTED net gap vs
          matched rho under label sqrt(pi*r/(4k)): sqrt(k) on the relation-
          dominated branch; k^(3/2) on the LA-dominated branch; both conditional
          on full factor-k relation gain. NO exponent moves. (Original IDEA
          predicted sqrt(k/2) against the wrong label — retained as named
          alternative.)
      - transform: representation_reduction
        proposed_object: >-
          Factor base as an F_q[T]/(T^k-1)-ideal rather than an F_2-subspace of
          F_{2^{16k}}
        predicted_gain: >-
          Membership becomes an F_q-linear test of rank k-dim W instead of an
          F_2-linear test of rank 16k-16 dim W; identical predicate, k-times
          fewer rows.
    quantifier_order: >-
      FOR EACH of the five k there EXISTS a computable finite lattice of
      phi-stable F_{2^16}-subspaces, exhibited in closed form; and FOR EACH of
      the five rows, FOR EVERY target R in G and FOR EVERY multiset of points of
      E(F_{2^16}), the sum is not R. The second quantifier order is the emptiness
      certificate; the first is a census.
    method_ceiling:
      strongest_certifiable_claim: >-
        On each of c2pnb176v1/208w1/272w1/304w1/368w1 the F_{2^16}-rational
        factor base yields zero relations for any target in the prime-order
        subgroup, because E(F_{2^16}) has order exactly the published cofactor
        and that cofactor is coprime to r; and the phi-stable F_{2^16}-subspaces
        of F_{2^{16k}} number 2^{1+(k-1)/d} with d=ord_k(2^16)=5,3,1,9,11, so
        only c2pnb272w1 admits stable subspaces of every dimension. PLUS the
        per-row product-law floor and lattice rounding cost (Stage 0 arithmetic).
        Certifies NOTHING about whether any phi-stable base yields a cost below
        rho, nothing about solving degree, nothing about prime-extension curves,
        and nothing about non-F_{2^16}-subspace bases.
      nearby_object_control: >-
        (i) PROVES-TOO-MUCH: emptiness on named toy subfield cell E/F_16 over
        F_{2^20} (k=5) must return empty for F_16-rational base on G-targets
        AND must NOT return empty for cofactor-subgroup targets. (ii) NULL
        OBJECT: ordinary binary curve over F_{2^{20}} with B not in F_16, where
        phi is not an endomorphism — neither (A) nor (C) has content.
    proof_obligations:
      - claim: E(F_q)=ker(phi-1) is a subgroup of E(F_{q^k}) of order q+1-t
        responsibility: correctness
      - claim: h=q+1-t equals the published cofactor for each of the five rows
        responsibility: baseline
      - claim: gcd(h,r)=1 for each of the five rows, hence G ∩ E(F_q)={O}
        responsibility: correctness
      - claim: phi-stable F_q-subspaces ↔ monic divisors of T^k-1 over F_q
        responsibility: correctness
      - claim: d=ord_k(2^16)=5,3,1,9,11 at k=11,13,17,19,23
        responsibility: correctness
      - claim: >-
          Matched-rho rows use sqrt(pi*r/(4k)) (CORR-20260922-81aeab); quoted
          figures 78.1, 94.0, 125.8, 141.7, 173.6 are kept
        responsibility: baseline
      - claim: >-
          Net Frobenius-quotient gap is sqrt(k) (relation) / k^(3/2) (LA),
          conditional on full factor-k gain; no exponent moves
        responsibility: runtime
      - claim: Nothing in (A)-(C) bounds any solving-stage cost
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      ECDLP in the prime-order subgroup of the five composite-degree ANSI X9.62
