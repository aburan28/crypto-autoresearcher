    hidden_cofactor: >-
      The arity-m decomposition constant, at least m!, disclosed and not
      estimated; lattice rounding cost vs product-law floor (Stage 0)
    claim_kind: structural_emptiness_plus_constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-f379d5-H0
      formal_statement: >-
        NONE FOR (A) OR (C). The emptiness certificate and the subspace census
        are unconditional finite arithmetic. Recorded so the absence is explicit.
      random_model_justification: >-
        E(F_q)=ker(phi-1) has order q+1-t (Weil); Lagrange plus gcd(h,r)=1 gives
        G ∩ E(F_q)={O}; normal basis + ideal structure of F_q[T]/(T^k-1) gives
        the subspace correspondence.
      supporting_results:
        - Weil theorem for #E(F_q) (classical; internal audit reproduction)
        - Normal basis theorem (classical)
        - IDEA-20260918-9abf42 correspondence at q=2 (internal)
      validation_experiment_ids:
        - EXP-BINSTD-f018f4
      falsification_condition: >-
        Independent factorisation of T^k-1 over F_{2^16} disagrees with factor
        counts 3,5,17,3,3; OR any certified G-target decomposition over E(F_q).
    - id: HEUR-BINSTD-f379d5-H1
      formal_statement: >-
        BALANCE HEURISTIC (cost rows only, never to claim emptiness). A
        decomposition index calculus over a factor base of size B ~ q^l with
        arity m on a group of size N ~ q^k succeeds per attempt with probability
        about B^m/(m! N) and needs about B relations: design condition ml >= k
        (enumerated) or (m-1)l >= k (free-last-leg / Joux-Vitse).
      random_model_justification: >-
        Counting upper bound B^m/m! is exact; attainment of the rate (vs mere
        bound) is the heuristic, imitating classical smooth-decomposition
        heuristics (Gaudry-Diem / Dickman–de Bruijn analogue).
      supporting_results:
        - Exact counting upper bound B^m/m! (combinatorial)
        - KN-FIND-aa2efc product-law floor table form (internal; Stage 0 recomputes)
      validation_experiment_ids:
        - EXP-BINSTD-f018f4
      falsification_condition: >-
        Measured relations-per-attempt on Stage 1 cell (c) disagree with
        B^m/(m! N) by more than a factor 4 against the size-matched random
        base (d) as reference, with certificates that pass re-verification.
    - id: HEUR-BINSTD-f379d5-H2
      formal_statement: >-
        RHO BASELINE CONVENTION (CORRECTED LABEL). The matched baseline is
        sqrt(pi*r/(4k)) group operations: Pollard rho with negation and the
        order-k Frobenius class map (CORR-20260922-81aeab). Quoted rows
        2^78.1, 2^94.0, 2^125.8, 2^141.7, 2^173.6 are KEPT; only the formula
        text and derived net-gap figures change.
      random_model_justification: >-
        sqrt(pi/4) constant and sqrt(|Aut|) symmetry gain are standard
        (KN-TECH-006 convention); the CORR-20260922-81aeab correction replaces
        the mislabelled 0.886 sqrt(r)/sqrt(2k) text.
      supporting_results:
        - CORR-20260922-81aeab (internal)
        - Review recomputation of rows under sqrt(pi*r/(4k)) (internal)
      validation_experiment_ids:
        - EXP-BINSTD-f018f4
      falsification_condition: >-
        Closed-form sqrt(pi*r/(4k)) on the five published r fails to reproduce
        the kept rows within 0.05 bits; OR the convention fails to reproduce
        KN-LIT-096's 2^60.9 for ECC2K-130 under the same unit.

