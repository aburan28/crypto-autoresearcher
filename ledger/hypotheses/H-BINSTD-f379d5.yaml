# defects (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-6cf862.yaml;
# verdict sound_with_corrections): matched-rho label sqrt(pi*r/(4k)); net gap
# sqrt(k) / k^(3/2); product-law floor + lattice rounding in Stage 0; named
