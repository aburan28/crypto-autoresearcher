  converts_idea: IDEA-20260906-ae1cfa
  converts_idea_note: >
    Converts the open ECRANK proposal IDEA-20260906-ae1cfa (rational
    interval Schur certificates for incremental rank witnesses) into a
    specified hypothesis and first frozen contract. Selected by user
    direction of 2026-09-08 (recorded in DEC-20260908-84d015, which also
    defers the prior goal-head next_action -- the v3 amendment +
    replication of EXP-ECRANK-73275e -- behind this design with a named
    revisit condition).
  opening_decision: DEC-20260908-84d015
  experiment_contract: EXP-ECRANK-52d039
  refines: null
  statement: >
    (S1, soundness) For a supplied finite set of points on a named
    elliptic curve over a declared field, a rational interval enclosure
    of the canonical height pairing -- built from exact coordinates, a
    proved height-difference bound C, repeated doubling with error
    <= C/4^n, and polarization -- together with rational interval
    LDL^T factorization, certifies Z-independence of the points whenever
    every rational pivot lower bound it outputs is strictly positive,
    and certifies nothing (UNRESOLVED) whenever any enclosed pivot
    includes 0. The quantifier order is universal over the box: the
    certificate is sound because ALL real symmetric matrices contained
    in the certified interval box have positive LDL pivots, not because
    one member of the box is positive definite. (S2, certification
    power) For an object with true minimal pivot margin gamma > 0 and
    stated per-entry enclosure error w(n), the certificate succeeds at
    every n with w(n) below the pre-registered sufficient bound for
    that object, so the required precision is bounded above by a
    quantity computable before the factorization runs.     (S3, elliptic
    interface) On one named curve E/Q (frozen candidate list, selected
    by run-start exact verification of nonsingularity, on-curve, and
    non-torsion by the Mazur test m*P != O for m = 1..12 -- the
    established exact control of EXP-ECRANK-e1e30e, never the
    certificate), the same pipeline derives an explicit C(E),
    certifies the singleton independent object {P} (independent by the
    run-start non-torsion control, NOT by the certificate -- no
    circular grounding), never certifies the dependent object {P, 2P}
    (dependent by exact construction), and reports the existing
    numerical regulator of EXP-ECRANK-e1e30e as a comparison-only
    cross-check (a floating claim of independence on {P, 2P} is a
    pre-registered collision event, expected behavior, never a
    failure; the floating determinant is not itself a sound
    certificate).
  mechanism:
    S1_interval_schur_soundness: >
      The canonical height pairing is a positive definite quadratic
      form on E(K)/torsion (established: KN-TECH-060 via KN-LIT-7621),
      so a positive definite pairing on the span of P_1..P_r rules out
      any nontrivial integer relation. The certificate never evaluates
      the true pairing: it encloses it. Exact coordinates of 2^n P
      (rational arithmetic on the curve) give the naive height h(2^n P)
      exactly; the proved bound |h(Q) - lambda_E(Q)| <= C over the
      relevant set of points gives the rational interval
      [h(2^n P)/4^n - C/4^n, h(2^n P)/4^n + C/4^n] for lambda_E(P), and
      polarization (lambda_E(P+Q) - lambda_E(P) - lambda_E(Q))/2
      encloses every pairing entry outward. Rational interval LDL^T
      then produces rational LOWER bounds on every pivot; all > 0
      implies every matrix in the box is positive definite (the
      universal-over-box quantifier), which implies independence. Any
      pivot interval containing 0 yields no conclusion: UNRESOLVED.
      The incremental Schur step adds one point at a time: the new
      pivot is the Schur complement of the previously certified block,
      and positive block plus positive Schur complement is equivalent
      to positive whole matrix, so the certificate is a nested
      positive-cone witness, one rational inequality per added point.
    S2_precision_bound: >
      For a test object with known exact true Gram matrix and true
      minimal pivot margin gamma, the sufficient bound n* is computed
      at run start by an INDEPENDENT verifier implementation of the
      interval factorization (the program's blind re-derivation pattern
      applied to the load-bearing quantity; no code shared with the
      producer pipeline): n* is the least n such that the verifier's
      interval LDL on the declared box at width w(n) (the schedule
      w(n) = w0 * 4^-n, frozen per object) has every pivot lower bound
      > 0. The producer certificate is then required to succeed at
      every n >= n*, and n_cert (the smallest n at which the producer
      succeeds) is reported per object; the claim n_cert <= n* is a
      theorem of the stated mechanism conditional on exact outward
      interval arithmetic, NOT a heuristic. Agreement of producer and
      verifier on every object and width is itself a frozen control
      (C6); disagreement localizes to exactly one of the two named
      implementations.
    S3_height_interface: >
      On the named curve the constant C(E) is derived exactly (every
      inequality in the derivation an exact rational check) from the
      standard height-difference bound made explicit in the Weierstrass
      invariants (source: Silverman AEC, recalled -- see citations; the
      derivation itself is a required run artifact, blind-re-derived by
      the independent verifier, and the certificate is conditional on
      the recorded C(E)). The independent object is the singleton {P},
      grounded by the run-start Mazur non-torsion control (m*P != O,
      m = 1..12, exact -- the established control of
      EXP-ECRANK-e1e30e, NOT the certificate, so the grounding is not
      circular); the certificate certifies the 1x1 pairing enclosure
      <P,P> > 0 at a reported n_cert. The dependent object {P, 2P}
      (2P by exact duplication) has a singular true Gram matrix whose
      final pivot interval contains 0 at every finite n, so the only
      sound outcomes are UNRESOLVED or a rejection -- INDEPENDENT on
      {P, 2P} at any n is the elliptic-level soundness falsifier. The
      numerical regulator in the style of EXP-ECRANK-e1e30e's
      regulator_check.py is recomputed comparison-only: agreement of
      sign on the {P} self-height is expected; a positive floating
      determinant on the {P, 2P} Gram is a pre-registered COLLISION
      EVENT (the ill-conditioned regime the certificate exists for),
      recorded, never a failure; the floating value never enters a
      verdict.
  numbered_predictions:
    - id: P1
      claim: >
        Every INDEPENDENT verdict emitted by the pipeline carries a
        complete exact witness: rational lower bounds on every LDL
        pivot, all > 0, re-derived by the independent verifier from the
        stated enclosures alone (no code shared with the producer).
        Zero unwitnessed INDEPENDENT verdicts over all runs.
      source: S1; tests R1, R2, R3.
    - id: P2
      claim: >
        The four pre-registered abstract controls behave exactly as
        frozen: C1 (zero-width diagonal baseline) returns INDEPENDENT
        with all pivots 1 and determinant 1; C2 (duplicate point /
        exact integer combination, independently permuted order) never
        returns INDEPENDENT; C3 (singular matrix with interval
        endpoints rounded INWARD) is rejected by the enclosure-
        derivation check, never INDEPENDENT; C4 (coarse box containing
        an exactly singular matrix with positive floating members)
        returns UNRESOLVED at the coarse width.
      source: S1; test R1.
    - id: P3
      claim: >
        For every abstract test object with true minimal margin
        gamma > 0, the certificate succeeds at every n >= n* (the
        pre-registered sufficient bound), and the measured n_cert
        satisfies n_cert <= n*.
      source: S2; test R1.
    - id: P4
      claim: >
        On the named curve of R2: the singleton {P} is certified at a
        reported n_cert with the derived C(E) and its blind re-
        derivation archived; the dependent object {P, 2P} never
        returns INDEPENDENT at any tested n (UNRESOLVED expected); the
        comparison-only regulator cross-check agrees in sign with the
        certificate on the {P} self-height, and any positive floating
        determinant on {P, 2P} is recorded as a pre-registered
        collision event.
      source: S3; test R2.
    - id: P5
      claim: >
        R3 replay (fresh process, identical inputs and declared seeds =
        none) reproduces R1/R2 verdicts, pivot lower bounds, n_cert
        values, and certificate witness bytes bit-for-bit.
      source: determinism control; test R3.
  heuristic_assumptions:
    - id: HEUR-1
      statement: >
        (Carried unchanged from the proposal, UNVERIFIED.) The rational
        enclosure precision needed for a supplied witness grows
        moderately with its regulator condition number. No bound, no
        distribution theorem, no direction claim.
      random_model_justification: >
        None claimed. The structural starting points (exact supplied-
        object identities; the zero-width baseline) do not prove the
        family-level performance assumption.
      falsification_condition: >
        Not falsifiable by this contract's first gate: the contract
        REPORTS n_cert versus the true margin gamma per object (and
        versus n*) as data; a pattern contradicting moderate growth is
        recorded as a finding against HEUR-1, which then stands
        falsified-at-tested-scope pending a dedicated test. Accepting a
        DEPENDENT point is the soundness falsifier (F1), not a HEUR-1
        event.
  structural_ingredients:
    - Established fact, positive semi-definiteness of the canonical
      height pairing on E(K)/torsion and vanishing exactly on torsion
      (KN-TECH-060, confidence established, via KN-LIT-7621).
    - Established fact, the doubling-limit definition of the canonical
      height and the boundedness of naive-minus-canonical height
      (Silverman AEC, provenance recalled -- reviewer pointer; the
      named-curve constant C(E) is derived and archived in R2).
    - The existing exact verifier baseline and the Mazur non-torsion
      test of EXP-ECRANK-e1e30e (verify_certificate.py,
      regulator_check.py) as the S3 cross-check object and the
      grounding control for {P}, read-only.
    - The proposal's own four controls (exact baseline, matched null,
      known-false inward rounding, observation collision), which this
      contract freezes verbatim as C1-C4.
  rerandomization: none
  rerandomization_note: >
    No randomization: all test objects (abstract matrices, the curve,
    the point sets, the dependent combinations, the order
    permutations) are deterministically constructed from frozen
    declarations; the declared seed set is empty by construction.
  asymptotic_claim: null
  asymptotic_claim_note: >
    No asymptotic claim. First gate: abstract 3x3 objects with margins
    in {0, 2^-20, 1} and enclosure widths 2^-10/2^-30, plus one small
    named curve over Q. Certificate-time/precision tradeoff is
    reported, not bounded, at this scope.
  proof_search_map:
    baseline_reproduction: >
      (a) C1: the exact rational diagonal Gram matrix diag(1,...,1) at
      zero width yields LDL pivots all 1 and determinant 1 -- the
      algebraic certificate fixture, executed before any proposed gain
      is read. (b) The existing numerical regulator pipeline of
      EXP-ECRANK-e1e30e is re-run read-only on the named curve before
      the new certificate's verdict is compared to it.
    observation_collision: >
      C4 is the frozen collision object (positive floating members and
      an exactly singular matrix sharing a coarse interval box).
      Corpus scan for a filed record implementing interval-enclosed
      height-matrix independence certification: performed 2026-09-08
      over knowledge/ and ledger/ (KB index unavailable in this
      worktree; direct corpus search). No internal record found
      implementing this mechanism; nearest internal mechanism is
      IDEA-20260905-ee822d (divisibility forests -- different object:
      it divides displayed points to repair local-residue blindness,
      uses no enclosures and no positivity certificate). Absence of a
      match is NOT a novelty proof (retrieval policy bound);
      novelty_status stays as declared.
    quantifier_order: >
      For EVERY real symmetric matrix contained in the certified
      interval box, all LDL pivots are positive; existence of one
      positive definite matrix in the box is insufficient and must not
      be used as a soundness argument anywhere in the pipeline.
    method_ceiling: >
      Strongest certifiable claim: Z-independence of the SUPPLIED
      points on the named curve at the tested precision. No discovery
      of a new curve, no rank upper bound, no promotion of the
      unpromoted C1-closure candidate of DEC-20260905-7adca0 (IMP-2
      intact), no re-dispatch of the N1 witness lane. Nearby-object
      controls: C3 (inward-rounded singular) and C2 (dependent set).
    proof_obligations:
      - claim: >
          The interval LDL^T pivot lower bounds are valid rational
          underestimates of every pivot of every matrix in the box
          (correctness, universal-over-box).
        responsibility: correctness
      - claim: >
          The charged cost expression covers all doubling-coordinate
          growth, logarithm/height enclosure, factorization,
          verification, and peak memory (runtime).
        responsibility: runtime
      - claim: >
          Peak live state (interval matrix, doubled-point storage,
          witness) is charged and reported against the budget (memory).
        responsibility: memory
      - claim: >
          HEUR-1 (moderate precision growth) remains unverified; the
          gate reports n_cert vs gamma and n* as data only
          (success_probability).
        responsibility: success_probability
      - claim: >
          Scope gate, supplied points only; no curve discovery; no
          promotion; IMP-2 untouched (interface).
        responsibility: interface
      - claim: >
          First-gate scope, abstract 3x3 objects + one small named
          curve over Q; no transfer beyond (scope).
        responsibility: scope
  predictions:
    - P1
    - P2
    - P3
    - P4
    - P5
  test_boundary: >
    Abstract stage (R1): the frozen set of exact rational 3x3 Gram
    matrices and widths named in the contract (zero-width diagonal
    baseline; the margin family {0, 2^-20, 1}; enclosure widths
    2^-10 and 2^-30; the inward-rounded and observation-collision
    objects; the dependent-permutation objects). Elliptic stage (R2):
    ONE named curve E/Q chosen by the frozen candidate-list rule
    (first candidate passing run-start exact verification of
    nonsingularity, P-on-curve, P non-torsion by the Mazur test
    m=1..12, and exact C(E) derivability); the independent object is
    the singleton {P}, grounded by that non-torsion control (never by
    the certificate -- no circular grounding); the dependent object
    is {P, 2P} (dependent by exact construction). Exact rational
    arithmetic throughout (stdlib fractions); no PARI, no Magma, no
    network; no floating-point value ever enters a verdict (the
    regulator cross-check is comparison-only). Precision n bounded
    above by n_max = 60 in R2 (4^-60 error factor); exceeding n_max
    is an F3 interface outcome, not a verdict. Toy claim tier; no
    cryptographic-scale claim, no C1 effect, no C2 effect.
  falsification_conditions:
    - id: F1_soundness
      condition: >
        The pipeline returns INDEPENDENT for any object known to be
        dependent (C2 at any permutation; the R2 dependent set at any
        n), or accepts the C3 inward-rounded enclosure, or emits an
        INDEPENDENT verdict whose witness contains a pivot lower bound
        <= 0 (the independent verifier's recheck catches this).
      closes: >
        S1 at the tested scope; the certificate family is unsound as
        implemented and must not be used on any witness until repaired
        and re-reviewed.
    - id: F2_power
      condition: >
        An abstract object with true minimal margin gamma > 0 fails to
        certify at n = n* (the pre-registered sufficient bound), with
        the run record separating implementation defect (invalidation,
        core rule 3) from derivation defect (the sufficient-bound
        derivation is wrong).
      closes: >
        S2 at the tested scope (the stated sufficient bound is not
        sufficient); the mechanism stands only below that bound.
    - id: F3_interface
      condition: >
        No candidate curve in the frozen list passes run-start exact
        verification, or C(E) cannot be derived by the stated exact
        method for the selected curve, or the singleton {P} fails to
        certify at any n <= n_max, or the comparison-only regulator
        cross-check disagrees in SIGN with the certificate on the {P}
        self-height. A positive floating determinant on {P, 2P} is a
        pre-registered collision event, never an F3.
      closes: >
        S3 at the tested scope (interface unresolved); S1/S2 stand or
        fall on R1 independently. A cross-check sign disagreement is a
        pipeline-arithmetic flag, never a mathematical falsification.
  walls:
    - The review-breakthrough wall -- the unpromoted C1-closure
      candidate of DEC-20260905-7adca0 remains gated by IMP-2; nothing
      here promotes, re-dispatches, or touches it.
    - The descent wall -- no 2-descent or ellrank anywhere; every
      independence conclusion in this experiment is the interval
      certificate or the pre-registered exact baseline.
    - The scope wall -- supplied points only; the 31-point ICARM-302
      witness is a named FOLLOW-UP after this experiment's review, not
      an input to this contract.
  assumptions:
    - HEUR-1 as stated (unverified; reported, not tested, at this gate).
    - The standard height-difference bound is derivable in explicit
      rational form for the selected small curve (F3 names the
      otherwise case as interface-unresolved, not as a falsification).
    - The frozen candidate list (recalled pointers, each verified
      exactly at run start) contains at least one (curve, point) pair
      passing all run-start checks; if none does, F3 names it as
      interface-unresolved and the gate stops there (no list
      extension mid-run -- that would be a protocol change and goes
      through a versioned amendment).
  confounders:
    - The regulator cross-check uses floating arithmetic; a
      cross-check disagreement may be a floating-condition-number
      artifact of the OLD pipeline, not an error in the new one --
      both pipelines' arithmetic are re-derived and the disagreement
      is localized before any verdict is affected.
    - Coordinate growth under repeated doubling is charged in full
      (O(4^n * H) bit scale per the proposal's cost model); any
      uncharged growth is a cost-model defect, recorded.
    - The duplicate lane history of this goal (DEC-20260908-84d015) is
      process context only -- the abandoned lane's unarchived artifacts
      are not inputs and carry no evidential standing here.
  interpretation_limits: >
    A supported S1 licenses using the certificate as a sound
    independence witness for SUPPLIED points at the tested scope; it
    does not establish any rank upper bound, discover any curve, or
    move the C1-closure candidate. A supported S2 bounds required
    precision by the pre-registered sufficient quantity at the tested
    scope; it says nothing about the growth of that bound across
    curves (HEUR-1 remains unverified). A supported S3 validates the
    interface on one small curve; transfer to the 31-point witness or
    to degree > 1 fields is a separate, separately frozen contract.
  novelty_status: adaptation
  novelty_note: >
