  statement: >-
    The integer 1048575 has bit length 20. Its bits are twenty 1s.
    Reaching it by doubling and adding uses 19 doublings and 19
    additions. Twenty exceeds nineteen by 1. Nineteen equals nineteen,
    so that gap is 0. The product of 20, 19, and 19 is 7220. Their sum
    is 58. Two readings of the addition count are both 19, so that gap
    is 0 and their product is 361.
  mechanism: >-
    The proposal writes the counts 20, 19, and 19. This contract
    checks those integers. It does not add a curve point.
