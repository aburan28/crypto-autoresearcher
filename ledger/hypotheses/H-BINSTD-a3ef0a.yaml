  statement: >-
    The n list is 17, 23, and 31. The dimension list is 3 and 4.
    Three times 2 is 6. Twenty-three minus 17 is 6, and 31 minus 23
    is 8. Eight minus 6 is 2, which equals the written doubling
    factor. Thirty-one minus 17 is 14. Fourteen minus 6 is 8.
    Fourteen minus twice 6 is 2. The product of 8, 2, and 2 is 32.
    Six times 2 is 12, and 3 times 4 is 12, so 12 minus 12 is 0.
    Seventeen plus 23 plus 31 is 71. Seventeen times 23 times 31
    is 12121.
  mechanism: >-
