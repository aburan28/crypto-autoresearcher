  related_hypotheses: []
  statement: >
    Fix the closed-form detection-delta
    identities of IDEA-20260904-cc1b0d
    before any anomalous or small-k
    curve is constructed and before
    SSSA or MOV is evaluated. Stage 0
    asserts only that D_anomalous=1 and
    D_smallk=1, that the Aut-visible
    families satisfy 1/D^2 = 3 at j=0
    and 1/D^2 = 2 at j=1728, and that
    the closed-form S ratio S(28)/S(20)
    equals 80/7. A nearby claim that
    the anomalous family carries the
    j=0 Aut discount is rejected. A
    dummy that reports D=0 (always
    detects) is rejected. This is not
    a planted-weak battery and not a
    DLP solve. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260904-cc1b0d tracks the
    census detection delta D(F,b) on
    families whose ground truth is
    known independently. Stage 0
    freezes the identities that the
    declared generic method set cannot
    see anomalous or small-k weakness
    (D=1) while it can see Aut
    discounts as exact squares, and
    that the closed-form S(F,b) =
    (886/1000)*2^{b/2}/b grows from
    20 to 28 bits as 80/7. No curve
    is constructed. No SSSA. No MOV.
    No Semaev S_m. No DLP solve.
  predictions:
    - id: P-S0-SENSG
      metric: toy sensitivity-gap identities
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        reports D_anomalous=1,
        D_smallk=1, 1/D_j0^2=3,
        1/D_j1728^2=2, and
        S(28)/S(20)=80/7. KF
        anomalous-has-Aut-discount
        is rejected. NULL D=0 is
        rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF claim
        that D_anomalous equals the
        j=0 Aut discount is accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL
        misses D=1 on planted-weak
        families, misses an Aut
        square, or misses S ratio
        80/7.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL sensitivity-arithmetic panel
    parameters:
      real_identities:
        D_anomalous: 1
        D_smallk: 1
        D_j0_sq_inv: 3
        D_j1728_sq_inv: 2
        S_formula: (886/1000)*2**(bits/2)/bits
        S_ratio_28_over_20: '80/7'
        must_d_anomalous_one: true
        must_aut_squares: true
        must_s_ratio_80_over_7: true
      known_false:
        kind: anomalous_has_aut_discount
        claimed_D_anomalous_sq_inv: 3
        must_reject: true
      matched_null:
        kind: constant_zero_detection
        dummy_D: 0
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-8ef9c1 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Exact rational arithmetic only.
      No planted curve. No SSSA. No
      MOV. The 80/7 ratio is the
      proposal formula at 20 and 28
      bits, not a measured gap.
  assumptions:
    - id: A1
      statement: >
        The frozen identities are
        D=1 on anomalous and small-k,
        Aut squares 3 and 2, and
        S(28)/S(20)=80/7. Stage 0
        does not construct a curve
        and does not run SSSA or MOV.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether D=1 on planted-weak
      families, Aut squares hold, and
      S(28)/S(20)=80/7.
    baseline_embedding:
      parameter_slice: >
        REAL D and S identities, KF
        anomalous-Aut-discount, NULL
        D=0 always-detects.
        Disclosed tightening:
        arithmetic calibrator only,
        not the proposal's W1-W6
        battery.
      reproduction_check: >
        D=1; Aut squares 3 and 2;
        S ratio 80/7. KF rejected.
        NULL rejected.
    observation_collision:
      observable: detection delta D versus Aut-discount squares
      distinct_preimage_search: >
        Hold the anomalous family and
        assign it the j=0 Aut
        discount (KF). Hold the
        method and report D=0
        (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen D/S identity table.
        predicted_gain: >
          Exact known-false reject on KF.
          Zero claimed planted-weak solve.
    quantifier_order: >
      Freeze the D and S identities
      before any curve is built.
      Toy D=1 is not a census
