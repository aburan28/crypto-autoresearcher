  proposal_id: IDEA-20260904-cc1b0d
  title: >
    Stage 0 closed-form sensitivity-gap
    identities — D=1 on planted-weak
    families and Aut-discount squares —
    before any weak curve is built
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-0a4169
  specified_by: DEC-20260913-75d185
