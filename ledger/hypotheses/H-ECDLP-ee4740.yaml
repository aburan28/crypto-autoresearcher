    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        identities. Never SSSA.
        Never MOV. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is a D=0 always-detects
        dummy. An argument that
        still calls it a sensitivity
        gap is proves-too-much.
