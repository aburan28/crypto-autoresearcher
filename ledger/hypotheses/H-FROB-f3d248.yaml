# =============================================================================
# H-FROB-f3d248 -- Artin-Schreier genus-5/6 order-131 census plus ladder note.
# Specified from IDEA-20261002-8f26ce under RQ-FROB-7d8dd4 / GOAL-FROB-6333a9.
# Approved DEC-20261002-cf888a. ZERO RUNS in this design packet.
# Stages 0-1 authorized. No AUXIN. No Bedrock. No curve attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-FROB-f3d248
  question_id: RQ-FROB-7d8dd4
  source_idea: IDEA-20261002-8f26ce
  experiment_id: EXP-FROB-f495ea
  goal_id: GOAL-FROB-6333a9
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-cf888a
  status: approved
  proposed_by: coordinator
  title: >-
    Artin-Schreier normal forms of genus 5 and 6 over F_2 either contain a
    model with 131 | #Jac(F_2)=P(1) (explicit equation) or contain none;
    genus-1 census and dual point-count controls gate the table

  statement: >-
    CLAIM (arithmetic-table / structural measurement; NO ATTACK; NO EXPONENT).
    Let C_f : y^2 + y = f(x) be an Artin-Schreier curve over F_2 with f of
    odd degree 11 (genus 5) or 13 (genus 6), reduced to a frozen normal form
    under f -> f(x+b) + h^2 + h. For each such form compute point counts
    N_k = #C_f(F_{2^k}) for k <= genus by solving y^2 + y = f(x), recover
    the L-polynomial L(T)=prod(1-alpha_i T) by Newton identities, and test
    whether 131 divides P(1)=L(1)=#Jac(F_2). Stage 0 requires every
    genus-1 (deg-3) normal form to have N_1 in {1,2,3,4,5} and dual
    point-count agreement. Stage 1 reports integer hit counts at genus 5
    and 6. A zero does not exclude non-Artin-Schreier Jacobians. Ladder
    eliminant degree is Stage 2 (not authorized under this card). Target
    elliptic curve stays in R1; no n>=131 ECDLP solve.

  mechanism: >-
    OBJECT FRAME. Representation of the elliptic point: R1 x-coordinate.
    Representation of the auxiliary point: (x,y) on the Artin-Schreier
    curve, then the Jacobian class. Operation set Sigma: Artin-Schreier
    translation tau(x,y)=(x,y+1) of order 2. TRICHOTOMY: partial-action
    (x is constant on tau-orbits). LOSSY-PROJECTION TEST against <tau>:
    discard y; fibres are tau-orbits; lossy (two points per general x).
    PRICE: quotient canonicalisation costs one field addition (factor 2).
    The open numbers are (hit_count_g5, hit_count_g6) and, later, the
    ladder eliminant degree. OFF-LIMITS: F2 Semaev stage; GHS empty at
    prime n; Jacobian DLP exponent of KR-IC-a4dd54 not claimed for E.

  predictions:
    - metric: genus-1 N_1 for every deg-3 normal form
      direction: same
      minimum_effect: >-
        every value in {1,2,3,4,5}; dual implementations agree
    - metric: >-
        hit_count_g5 = number of deg-11 normal forms with 131 dividing P(1)
      direction: different
      minimum_effect: >-
        0 or >=1 are different explanations (O-EMPTY vs O-HIT)
    - metric: >-
        hit_count_g6 = number of deg-13 normal forms with 131 dividing P(1)
      direction: different
      minimum_effect: >-
        0 or >=1 are different explanations
    - metric: genus-2 P(1) histogram vs Weil ceiling 34
      direction: same
      minimum_effect: >-
        every P(1) in 1..34 (H1 tail)

  test_boundary:
    instances:
      - Stage 0: all AS normal forms of degree 3 over F_2 (genus 1)
      - Stage 1: all AS normal forms of degrees 11 and 13; genus-2 histogram
    parameters:
      target_prime: 131
      ladder_primes: [19, 23, 31, 41]
      q: 2
      genera_authorized: [1, 2, 5, 6]
    implementation: >-
      Pure Python under experiments/EXP-FROB-f495ea/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      No Magma/Sage/cypari2/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      Genus-1 N_1 escapes {1,2,3,4,5}, or dual point-count implementations
      disagree (O-ARTIFACT; table void).
    - >-
      Genus-2 P(1) outside the Weil ceiling (1..34) for any normal form
      (O-ARTIFACT).
    - >-
      A reported 131-hit fails recomputation of P(1) under the checker /
      second count path (O-ARTIFACT).
    - >-
      Claiming an n=131 exponent move or ECDLP break under this card
      (protocol invalid).

  distinguishable_outcomes:
    - id: O-HIT
      meaning: >-
        hit_count_g5 + hit_count_g6 >= 1 after passing Stage-0/controls;
        at least one explicit AS model with 131 | P(1) is written out.
        No exponent claim.
    - id: O-EMPTY
      meaning: >-
        Both hit counts are 0 after passing controls. The AS family at
        genus 5/6 supplies no order-131 model. Non-AS groups remain open
        (census IDEA-20260926-5c26f9).
    - id: O-ARTIFACT
      meaning: >-
        Genus-1 census fail, dual-count disagreement, or Weil-ceiling
        violation. No hit-count claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never
        negative evidence against the AS census claim.

  interpretation_limits:
    - >-
      A zero is not an emptiness certificate for all abelian varieties of
      dimension 5 or 6 (that is the Weil-polynomial census column).
    - >-
      Factor-2 tau symmetry is a constant, not an exponent improvement.
    - >-
      Ladder eliminant degree is UNMEASURED under Stages 0-1; Stage 2 is
      a separate authorization.
    - >-
      No attack at field degree >= 131. ECC2K-130 is not an instance.
    - 'KN-OPEN-020 class: high-degree / implicit-membership on the ladder arm.'

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        P(1) mod 131 for this family behaves like a uniform random residue
        as f varies over normal forms, so a zero hit count is informative
        about the family.
      random_model_justification: >-
        Weil bound caps P(1); uniformity is not proved. Pattern imitated:
        equidistribution of character-sum angles (comparison model only).
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-f495ea
      falsification_condition: >-
        At genus 2, some P(1) lies outside the Weil ceiling, or the
        histogram is incompatible with the achievable-count list used as
        the comparison model (reported; does not alone void hit counts).

  asymptotic_claim:
    problem: >-
      Existence of an explicit Artin-Schreier model of genus 5 or 6 over
      F_2 with 131 dividing #Jac(F_2), as a Couveignes-factor-base column
      beside the Weil-polynomial census
    prior_best: >-
      Pollard rho ~ 2^{n/2} on binary curves; Weil-polynomial census returns
      characteristic polynomials without equations (IDEA-20260926-5c26f9)
    time_exponent: >-
      NO EXPONENT MOVED. Hit counts are integers; tau factor 2 is constant.
    memory_exponent: O(1) relative to the tiny F_{2^k} enumerations (k<=6)
    hidden_cofactor: normal-form orbit reduction cost; Newton identity arithmetic
    claim_kind: arithmetic_table_measurement

  proof_search_map:
    bottleneck: >-
      Whether P(1) for the Artin-Schreier L-polynomial is 0 mod 131 at
      genus 5 or 6.
    baseline_embedding:
      parameter_slice: >-
        Genus 1: every normal form of degree 3. N_1 must lie in
        {1,2,3,4,5}.
      reproduction_check: >-
        Dual point-count implementations must agree on five fixed forms
        per genus; genus-1 census must pass before any genus-5/6 number
        is read.
    observation_collision:
      observable: 'the pair (f, P(1) mod 131)'
      distinct_preimage_search: >-
        Two normal forms with the same P(1) and different eliminant
        degrees (Stage 2) would show the Weil polynomial does not
        determine the degree; Stage 1 only records the count.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The Artin-Schreier subfamily inside genus-5/6 curves over F_2,
          packed with the x-quotient by tau.
        predicted_gain: >-
          A model given by a single polynomial f when a hit exists, else
          a family-scoped zero.
    quantifier_order: >-
      Exists f of degree 11 or 13 with 131 | P(1), or for all such normal
      forms the residue is nonzero. No claim for a general curve of
      genus 5 outside this family.
    method_ceiling:
      strongest_certifiable_claim: >-
        A hit or a zero inside this normal-form family at genus 5/6.
        Cannot certify emptiness of all abelian varieties of dimension
        5 or 6.
      nearby_object_control: >-
        Genus-1 census and genus-2 Weil-ceiling histogram; dual count
        instrument.
    proof_obligations:
      - claim: Genus-1 counts land in {1,2,3,4,5} before any genus-5 count is kept.
        responsibility: baseline
      - claim: P(1) equals sum of L-coefficients from Newton identities on N_1..N_g.
        responsibility: correctness
      - claim: Hit counts are integers with dual-count agreement on spot checks.
        responsibility: baseline
      - claim: No n=131 ECDLP exponent is certified.
        responsibility: scope
    not_applicable_reason: null

  dominated_by: >-
    Time: rho at n/2 dominates any attack claim (none made). Memory:
    van Oorschot-Wiener not improved. Data/queries: at most 1/n plus
    constant 2 from tau. Checked.
  sota_delta:
    time: 'exponent delta 0 against n/2'
    memory: 0 against van Oorschot-Wiener rho memory
    data_queries: 'factor 2 from tau, constant'

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
