  assumptions:
    - "This deliberately selects the known j=1728 arithmetic resource. It cannot test arbitrary ordinary classes or the existence of a new auxiliary algorithm."
    - "All endpoints share p, trace and r; gcd(3,r)=1. Endomorphism-level certificates and the eigenvalue sign are verified and charged."
    - "No output from [3λ] alone extracts an unknown scalar. λ is identified using the public generator, never a hidden target DLP."
