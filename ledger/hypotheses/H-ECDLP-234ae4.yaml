  statement: "On the frozen conductor-3 CM calibration panel, a transported degree-9 evaluation of the fixed scalar [3λ] can give a fully charged amortized auxiliary speedup of at least 20 percent at 4096 queries relative to the best declared scalar-multiplication implementation, while producing identical subgroup outputs. This is an empirical implementation hypothesis, not a novel endomorphism or an ECDLP algorithm."
