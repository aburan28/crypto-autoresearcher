hypothesis:
  id: H-MOD-e9d87e
  question_id: RQ-ECDLP-002
  proposal_id: IDEA-20260806-0c9de1
  added: '2026-08-06'
  statement: >-
    An ECDLP instance (E, P, Q = kP) with N = ord(P) prime is a pair of
    F_p-points of X_1(N) over one point of X_0(N), and k mod +-1 is the
    coordinate of the second relative to the first in a torsor under
    (Z/N)^*/{+-1}. Three quantities are FORCED and are derivable at zero compute:
    (F1) the torsor's Galois-cohomological obstruction class is trivial, because
    the instance is rational, so descent contributes exactly 0 bits; (F2) for N
    prime > 3 with Aut(E) = {+-1} the diamond action is free and transitive, so
    every diamond-invariant function of a SINGLE fibre point is constant on the
    fibre and carries no information about k; (F3) the one structural relation
    characteristic p supplies -- the congruence relation -- involves the diamond
    <p mod N>, and p and N are public, so it relates known data to known data.
    If all three hold, the representation contributes zero bits and that is a
    closure with three named obstructions.
  mechanism: >-
    X_1(N) parametrises pairs (curve, point of exact order N); X_0(N)
    parametrises (curve, cyclic subgroup of order N). Since <Q> = <P>, the points
    (E, P) and (E, Q) of X_1(N) share an image in X_0(N), the covering is Galois
    with group (Z/N)^*/{+-1} acting by diamond operators <d>: (E, P) |-> (E, dP),
    and <k>(E, P) = (E, Q). The decomposition induced is a FIBRATION of the
    problem rather than a factorisation of an element: solving the ECDLP =
    forget the point (free, and loses exactly the answer) THEN recover the torsor
    coordinate (the whole problem).
    F1 is the standard fact that a torsor with a rational point is trivial; the
    only delicacy is the group scheme, since the Weil-pairing normalisation makes
    mu_N appear and the Galois action on mu_N differs from that on Z/N. F2 is
    near-tautological once freeness and transitivity are established, and its
    CONTENT is the observation that every "new invariant of the modular point"
    anyone would propose is diamond-invariant unless it uses P directly -- in
    which case it is the group representation we started from. F3 is the sharpest
    of the three because it sits exactly where a reader expects the payoff.
  assumptions:
    - N prime, N > 3, Aut(E) = {+-1}, so the diamond action is free.
    - >-
      p does not divide N and the moduli interpretation survives reduction for
      the (N, p) pairs used. Toy pairs are chosen to satisfy this and the choice
      is recorded.
    - >-
      "Contributes zero bits" is scoped to the three NAMED constructions --
      Galois descent on the fibre, diamond-invariant single-point functions, and
      the congruence relation at p. It is NOT a claim that no construction
      whatsoever can extract information from this representation, and the
      write-up must not slide into that stronger reading.
  proof_search_map:
    bottleneck: >-
      Whether any function on X_1(N)(F_p) computable in less than DLP time is
      non-constant on a single fibre. F1-F3 rule out three families; the
      bottleneck is whether that enumeration is anywhere near complete, and this
      record does not claim it is.
    baseline_embedding:
      parameter_slice: N = 5, 7 at small p, where X_1(N) has genus 0
      reproduction_check: >-
        Exhaustive: for EVERY (E, P, k) in the toy range, the computed fibre
        coordinate must equal k mod +-1 as an integer. Exact comparison, every
        instance, not a sample.
    observation_collision:
      observable: the X_0(N) image of an instance, plus any proposed fibre statistic
      distinct_preimage_search: >-
        THE COLLISION IS THE THEOREM, NOT A FALSIFIER, AND IT HAS A CLOSED FORM:
        the phi(N)/2 instances (E, P, kP) for varying k all share one X_0(N)
        image, so the fibre IS a complete collision class and its size is exactly
        the number of bits the descent discards. What must be searched for is the
        OPPOSITE -- a fibre-level statistic with fewer collisions than phi(N)/2 --
        which F2 predicts cannot exist among diamond-invariant single-point
        functions.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The ECDLP as the torsor-coordinate problem for X_1(N) -> X_0(N), with
          separate encoding, completeness, soundness, transfer and cost-loss
          obligations.
        predicted_gain: >-
          ZERO BITS, and the record says so in advance. A transform whose
          predicted gain is zero and which states it is an honest transform; the
          value is the derivation.
      - transform: observable_fiber
        proposed_object: >-
          Hold the X_0(N) image fixed, vary the choice of P within its subgroup,
          and look for an intrinsic invariant distinguishing the resulting
          X_1(N) points beyond the tautological one.
        predicted_gain: >-
          F2 predicts none exists among diamond-invariant functions. An exception
          would be a genuine new handle and would supersede this record.
    quantifier_order: >-
      F2, explicitly: FORALL E/F_p with Aut(E) = {+-1}, FORALL primes N > 3 with
      N | #E(F_p), FORALL functions f on X_1(N)(F_p) invariant under the diamond
      action, FORALL P, P' in the same fibre: f(E, P) = f(E, P'). Swapping to
      EXISTS f FORALL P states something different and false-looking; the order
      is what makes F2 the observation it is rather than a triviality about one
      function.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Galois descent on the fibre, diamond-invariant single-point functions,
        and the congruence relation at p each contribute zero bits toward k, for
        rational instances with N prime and Aut(E) = {+-1}." It can NEVER certify
        that the modular representation is useless in general.
      nearby_object_control: >-
        The composite-N case, or j = 0 / j = 1728, where the action is NOT free.
        The method must give a DIFFERENT answer there. A derivation producing
        "zero bits" uniformly, including where freeness fails, has not used
        freeness and is asserting its conclusion rather than deriving it. This is
        the single sharpest check on whether F2 is real, and it costs nothing.
    proof_obligations:
      - claim: The fibre coordinate equals k mod +-1.
        responsibility: correctness
      - claim: The torsor is trivial because the instance is rational.
        responsibility: correctness
      - claim: The diamond action is free for N prime > 3 with Aut(E) = {+-1}.
        responsibility: correctness
      - claim: The congruence relation involves only <p mod N>.
        responsibility: baseline
      - claim: Hecke acts on fibres through the diamond quotient.
        responsibility: correctness
      - claim: Conclusions are scoped to rational instances with prime N.
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The modular curves X_1(N) and X_0(N), the diamond operators, and the
        Galois covering structure between them.
      citation: >-
        Classical modular-curve theory. ABSENT from this program's 88 recorded
        techniques ("modular curve", "X_1(N)", "diamond operator" all return zero
        hits) and NOT re-read in this session; Stage 0 obtains statements.
      role: supplies the representation and the torsor structure
    - description: >-
        The Eichler-Shimura congruence relation in characteristic p, expressing
        the Hecke correspondence at p via Frobenius and the diamond <p>.
      citation: >-
        Classical. RECALLED, UNVERIFIED; F3 is the forced value most likely to be
        misremembered and Stage 0 exists for it.
      role: supplies F3, the sharpest of the three forced values
  reduction_chain:
    core_problem: >-
      Whether a modular-curve representation of an ECDLP instance supplies any
      computable handle the group representation does not.
    corollaries: []
  predictions:
    - metric: Galois-cohomological obstruction class of the fibre torsor
      direction: different
      minimum_effect: >-
        Exactly trivial, zero exceptions across every tested (N, p, E). One
        exception refutes F1 and is a major finding: computable structure
        attached to an ECDLP instance.
    - metric: >-
        number of diamond-invariant single-point functions found non-constant on
        a fibre
      direction: different
      minimum_effect: >-
        Exactly 0 in the free case, AND STRICTLY GREATER THAN 0 in at least one
        non-free case (j = 0 or composite N). BOTH HALVES ARE REQUIRED: the
        second is what shows the derivation used freeness rather than assuming
        the conclusion.
    - metric: Hecke separation statistic on fibres for small ell != p
      direction: different
      minimum_effect: >-
        Identically zero by derivation. The random-correspondence null must give
        a non-zero value, or the statistic cannot discriminate and its vanishing
        means nothing.
  test_boundary:
    instances: >-
      Curves over small p with N in {5, 7, 11, 13}, exhaustively enumerated, plus
      j = 0 and j = 1728 curves and one composite-N case for the non-free control.
    parameters:
      N_values: [5, 7, 11, 13]
      p_range: small primes with p not dividing N and N | #E(F_p)
      ell_values: small primes != p for the Hecke statistic
      non_free_controls: [j = 0, j = 1728, one composite N]
    implementation: >-
      Direct construction of X_1(N)(F_p) and X_0(N)(F_p) as finite sets with the
      diamond action, verified against direct group computation on E(F_p).
    budget:
      total_cpu_hours: 4
      maximum_memory_gb: 4
  falsification_conditions:
    - >-
      The fibre coordinate does not equal k mod +-1 on some toy instance. The
      dictionary is wrong; the record is superseded and nothing downstream is
      reported.
    - >-
      A non-trivial torsor class is found for a rational instance. F1 refuted;
      MAJOR, and becomes the successor proposal immediately.
    - >-
      A diamond-invariant single-point function is found non-constant on a fibre
      in the free case. F2 refuted; same escalation.
    - >-
      The non-free control gives the SAME answer as the free case. The derivation
      did not use freeness and is therefore not established, whatever its
      conclusion; the line halts.
    - >-
      The Hecke separation statistic is non-zero where the derivation forces
      zero. Implementation error or wrong derivation; halt and record.
  interpretation_limits:
    - >-
      Scoped to the two named encodings of the lens, a rational instance, N prime
      > 3, Aut(E) = {+-1}, and the three named constructions.
    - >-
      The toy computations verify the DICTIONARY and the CONTROLS. They do not
      verify the derivations at cryptographic N, which nothing here reaches --
      X_1(N) has genus of order N^2/24 and cannot be written down at that size.
      A derivation error would therefore not be caught by these computations.
    - >-
      A zero-bit conclusion is about this lens, not about the ECDLP.
    - >-
      The cuspidal / degeneration route is NOT proposed: it is already closed by
      H059 / H062 in ledger/REVIEW-H100-20260717.md, and F1-F3 concern the smooth
      fibre and are not implied by that closure.
  status: specified
  proposed_by: idea-generator
  specified_by: coordinator
  specified_at: '2026-08-06'
