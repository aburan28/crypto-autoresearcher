hypothesis:
  id: H-ICEX-6d0c9a
  question_id: RQ-ECDLP-002
  statement: >-
    For M discrete-log targets in one prime-order subgroup solved by a
    shared-walk parallel collision search with a single distinguished-point
    table, the realised amortization factor A(M) = M * ops_1 / ops_M, measured in
    GROUP OPERATIONS on both sides of the ratio, matches the classical sqrt(M)
    prediction to within 25 percent at batch sizes M in {1, 4, 16, 64} at toy
    subgroup sizes; and the distinguished-point table required to realise it
    grows fast enough that per-target cost with storage charged is materially
    worse than the uncharged factor suggests.
  mechanism: >-
    A shared table lets any two walks from any two targets collide usefully, so
    the expected number of steps to obtain M useful collisions grows like sqrt(M)
    times the single-target cost rather than M times it. The idealisation assumes
    free storage. Storage grows with the table, so the charged factor is
    necessarily worse than sqrt(M); the measurable question is by how much at
    reachable batch sizes.
  assumptions:
  - >-
    A shared distinguished-point table across targets is implementable, and the
    implementation is the SAME rho implementation used for the single-target
    baseline, so the M = 1 arm reproduces that baseline exactly.
  - >-
    UNITS. Computation is charged in group operations and storage is charged in
    stored group elements and in bytes. Both sides of the amortization ratio are
    group-operation counts. Wall clock is recorded but never divided into an
    operation count; a wall-clock-over-operations quantity is not a cost and is
    forbidden by this contract.
  - >-
    Toy batch-to-group-size ratios may not represent deployed ratios. No
    extrapolation to deployed batch sizes is offered.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      A measurement of a classical effect's realisation. No theorem is sought and
      no new algorithm is proposed; the sqrt(M) analysis is classical and is
      measured, not improved.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL M in {1, 4, 16, 64} at the tested toy subgroup sizes, the realised
      amortization factor A(M), measured in group operations, satisfies
      |A(M) - sqrt(M)| <= 0.25 * sqrt(M).
    random_model_justification: >-
      The classical shared-walk collision analysis treats the walk as a uniform
      random function on the group and gives the sqrt(M) factor for free storage.
      THE GAP, STATED - storage is not free and grows with the table, so the
      charged factor is necessarily worse than sqrt(M) and the question is only
      by how much at reachable sizes.
    supporting_results:
    - >-
      Parallel collision search with distinguished points, KN-TECH-006, read in
      full - expected about 0.886 * sqrt(n) group operations serial, about
      sqrt(n)/m wall clock on m processors, small per-processor memory.
    validation_experiment_ids:
    - EXP-ICEX-fafeec
    falsification_condition: >-
      A realised A(M) outside sqrt(M) by more than 25 percent at any M in the
      declared ladder, with the M = 1 and no-sharing nulls both passing.
  structural_ingredients:
  - description: >-
      The program baseline convention, read verbatim from KN-TECH-006 - 0.886 *
      sqrt(n) group operations, van Oorschot-Wiener parallelization assumed,
      fully charged (setup + failed attempts + verification + memory traffic).
    citation: KN-TECH-006
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, file read in full)
    role: single-target baseline the batch arm amortises
  reduction_chain: null
  predictions:
  - metric: batch_size_one_null
    direction: different
    minimum_effect: >-
      FORCED to reproduce the single-target baseline group-operation count
      exactly, run for run, on identical seeds. A departure means the batch code
      path is not the baseline code path and no factor from it is admissible.
  - metric: no_sharing_null
    direction: different
    minimum_effect: >-
      FORCED A = 1.00 within 0.10. M independent solves with M independent tables
      must cost M times the baseline. Anything below 1.00 means unintended
      sharing and voids the run.
  - metric: partitioned_table_planted_defect
    direction: different
    minimum_effect: >-
      With the shared table artificially partitioned into 4 independent tables,
      the predicted factor is sqrt(M/4), that is exactly 4.00 at M = 64 against
      an unpartitioned prediction of 8.00. The instrument must report 4.00 within
      0.50. This is the defect of known size and its predicted magnitude.
  - metric: realised_amortization_factor_A_of_M_in_group_operations
    direction: different
    minimum_effect: >-
      Compared against sqrt(M) at each M in {1, 4, 16, 64}, with a 95 percent
      interval from at least 30 repetitions per cell. A shortfall exceeding 25
      percent at any M identifies where the idealisation breaks.
  - metric: per_target_cost_with_storage_charged
    direction: different
    minimum_effect: >-
      Reported as a pair - group operations per target and stored group elements
      per target - never combined into one number. The decision-relevant
      statement is the pair and the batch size at which storage becomes the
      binding constraint.
  test_boundary:
    instances:
    - toy prime-order subgroups at 32 and 36 bits
    - at least 30 independent repetitions per batch size
    parameters:
      batch_sizes: [1, 4, 16, 64]
      distinguished_point_granularity: frozen and recorded per run
      walk: r-adding walk with r frozen and recorded
    implementation: >-
      One rho implementation serving both the single-target and the batch arm,
      with the table shared or partitioned by a declared flag.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 16
      maximum_runs: 240
  falsification_conditions:
  - >-
    The M = 1 arm does not reproduce the single-target baseline exactly. The
    harness is wrong and every factor it reports is void.
  - >-
    The no-sharing arm reports A below 1.00 beyond 0.10. Unintended sharing;
    results void.
  - >-
    The partitioned-table plant does not return 4.00 within 0.50 at M = 64. The
    instrument has no demonstrated dynamic range and no factor is admissible.
  - >-
    The realised A(M) falls short of sqrt(M) by more than 25 percent at any M
    with both nulls passing. The idealisation does not hold at reachable batch
    sizes and HEUR-001 is falsified within the tested scope.
  - >-
    Storage exceeds the declared memory budget before M = 64 is reached. The
    effect is memory-bound in practice at these sizes; report the reached M and
    do not extrapolate.
  interpretation_limits:
  - >-
    Measures a classical effect's realisation. Proposes no new algorithm, claims
    no exponent, and produces no attack.
  - >-
    Scoped to the tested batch sizes, subgroup sizes, walk parameters, storage
    model and hardware. Toy batch-to-group ratios may not represent deployed
    ones and no extrapolation is offered.
  - >-
    A(M) = sqrt(M) IS CURVE-FREE BY CONSTRUCTION. The classical analysis uses
    only the group law and the walk, so nothing about the amortization factor is
    a statement about elliptic curves. This is recorded as a proof about the
    quantity, not as an experimental arm, and it is pre-declared that NO outcome
    on A(M) is an elliptic-curve statement. A curve-free Z/n arm is nevertheless
    run as an IMPLEMENTATION check and is labelled as such, never as a curve
    control.
  - >-
    The one quantity here that is not curve-free is the per-group-operation cost
    of curve arithmetic, which is reported separately in seconds per operation
    and is never mixed into the amortization ratio.
  status: proposed
  proposed_by: coordinator
