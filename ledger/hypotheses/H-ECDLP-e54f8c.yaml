  statement: >
    Fix D = -4 and three (p, R, x)
    triples before any membership is
    read. Stage 0 asserts only Gauss
    reduction membership of IDEA-20260905-ab4a6e
    on this family: x in F_p is a box
    member iff there exist integers u, v
    with |u|, |v| <= R and u + i*v
    reducing to x along a root of
    T^2 + 1 = 0 in F_p. (i) REAL is
    p=13 R=1 x=1, the interval slice
    (u,v)=(1,0), and x is in the box;
    (ii) KF is p=13 R=1 x=2 and x is
    outside the box; (iii) NULL is p=7
    and T^2+1 has no root, so the
    reduction is rejected; (iv) p=0 or
    R<0 is rejected before membership is
    read as a census. This is not a
    factor base, not a relation vector,
    not a Groebner census, not a CM
    curve hunt, and not Stage 1.
    Membership is not a decoder or an
    ECDLP advantage.
  mechanism: >
    For D = -4, O_K = Z[i] and p splits
    iff p = 1 mod 4. Then T^2+1 splits
    in F_p and reduction of u+vi is
    u + root*v. Box membership of a
    frozen residue is exact brute force
    over the (2R+1)^2 lattice points.
    A non-split p has no root and is
    rejected. Stage 0 evaluates that
    instrument on one frozen family.
    This is a new RQ-ECDLP-002 object
    after Stage 0 of EXP-ECDLP-daf1bb
    held as P-S0-HOM (DEC-20260908-0e6ae9).
    It is not Stage 1 of EXP-ECDLP-daf1bb
    and not a box factor base.
  predictions:
    - id: P-S0-BOX
      metric: well-defined exact Gaussian-integer box membership on the frozen family
      direction: different
      minimum_effect: >
        After fixture_pass, REAL is in
        the box. KF is outside the box.
        NULL is rejected as non-split.
        Zero p and negative R are
        rejected. One certified miss after
        fixture_pass is a scoped
        falsification of this instrument on
        the frozen family.
      claim_tier: observational
    - id: P-S1-FBASE
      metric: box factor-base census or relation yield
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0
        does not construct F_box, does not
        enumerate a curve, and does not
        run a relation or Groebner census.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFOUT
      statement: >
        After fixture_pass, KF reports
        in-box. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALBOX
      statement: >
        After fixture_pass, REAL is
        outside the box. That falsifies
        only P-S0-BOX on this family.
    - id: F-S1-FBASE
      statement: >
        After an authorized later stage, a
        claimed box base fails the interval
        slice. Unauthorized here.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      discriminant: -4
      real: {p: 13, R: 1, x: 1, u: 1, v: 0}
      known_false: {p: 13, R: 1, x: 2}
      matched_null: {p: 7}
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-b3f975 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is exact brute-force
      Gauss reduction on three frozen
      (p, R, x) triples at D = -4. It is
      not a factor base, not a relation
      vector, not a Groebner census, not
      Stage 1 of EXP-ECDLP-daf1bb, not
      Stage 1 of EXP-ECDLP-0d1336, not
      Stage 1 of EXP-ECDLP-1aa0f8, not
      Stage 1 of EXP-ECDLP-79f8c4, not
      Stage 1 of EXP-ECDLP-628891, not
      Stage 1 of EXP-ECDLP-9e9536, not
      Stage 1 of EXP-ECDLP-90f602, and not
      Stage 2 of EXP-ECDLP-4be480. No
      cryptographic transfer. Do not hunt
      a new curve after this freeze.
  assumptions:
    - id: A1
      statement: >
        The KF residue x=2 at p=13 R=1
        lies outside the box. An argument
        that assigns every F_p residue
        box membership proves too much.
      status: explicit
    - id: A2
      statement: >
        The NULL prime p=7 does not split
        in Z[i].
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06
        covers protocol approval once the
        contract is complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
