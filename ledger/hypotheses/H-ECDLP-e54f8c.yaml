        Existence of |u|,|v| <= R with
        u + root*v congruent to x.
      distinct_preimage_search: >
        Hold p=13 R=1 and change x from 1
        to 2. Hold D=-4 and change p from
        13 to 7.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact box membership.
        predicted_gain: >
          Exact known-false out-of-box
