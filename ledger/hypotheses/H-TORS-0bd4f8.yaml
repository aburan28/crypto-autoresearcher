# =============================================================================
# H-TORS-0bd4f8 — specified from IDEA-20261006-507d69 (bytes copied
# unchanged from origin/design/frob-1e54b5-theta). Question
# RQ-TORS-8c7b79. The prediction under test is the idea's own: on
# y^2 = x^3 + 2x + 3, at the smallest prime p with 13 ≤ p ≤ 200 where
# the curve is nonsingular and has a rational point T of order exactly
# 3, at least one unordered pair of distinct nontrivial <T>-cosets
# shares the successive x-difference multiset M. A finished pair count
# of 0, with the group-law and difference-sum controls passing and at
# least two cosets present, is the concrete negative. This record does
# not assert that a collision occurs.
# =============================================================================
hypothesis:
  id: H-TORS-0bd4f8
  question_id: RQ-TORS-8c7b79
  source_idea_ids:
    - IDEA-20261006-507d69
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Collision count of successive x-difference multisets on cosets of
    one rational order-3 point
  statement: >-
    Let E be y^2 = x^3 + 2x + 3. Let p be the smallest prime with
    13 ≤ p ≤ 200 such that E over F_p is nonsingular and has an
    F_p-rational point T of order exactly 3, frozen as the first such
    point in lexicographic x then least nonnegative y. For an affine
    point P not in <T>, M(P) is the multiset of the three successive
    x-differences x(P+T)-x(P), x(P+2T)-x(P+T), and x(P)-x(P+2T) in
    F_p. M is constant on <T>-cosets. The idea's prediction is that
    the number of unordered pairs of distinct nontrivial cosets with
    equal M is at least 1. A finished count of 0, after the group-law
    cycle closes, the three differences sum to 0, the identity coset
    is excluded, and at least two nontrivial cosets exist, is the
    concrete negative. No exponent improvement is claimed.
  mechanism: >-
    The tracked object is the successive x-difference multiset of the
    partial action of translation by one frozen point T of order 3.
    Passing to the coset discards which of the three points is the
    representative. Passing from the coset to M discards every
    y-coordinate and the absolute x-coordinates. A collision means
    that second discard fails to separate blocks. A zero count means
    M separates blocks on this one curve and is still only an index-3
    label. Neither outcome moves the generic exponent 1/2.
  assumptions:
    - >-
      T is the first affine point, in increasing x then increasing y,
      for which the group law gives 2T affine and 3T equal to the
      point at infinity. A signed residue is not used.
    - >-
      The identity coset is excluded because x is undefined at the
      point at infinity. Every scored coset is three affine points.
    - >-
      No factor base and no advice table for a secret scalar are
      built. Collision counting compares multisets of the enumerated
      group.
    - >-
      The curve equation is frozen. If no prime in the interval
      supplies an order-3 point, the equation is not replaced.
  proof_search_map:
    bottleneck: >-
      Whether M separates <T>-cosets. A collision means these
      differences do not canonicalise the orbit. Injectivity means
      they do, on this toy curve only, and the label is still index 3.
    baseline_embedding:
      parameter_slice: >-
        The generic exponent 1/2 of KR-RHO-13bf67, and the
        torsion-symmetry decomposition constant of KR-IC-955fd6. This
        control does not reproduce either algorithm.
      reproduction_check: >-
        For one representative of each tested coset, check that P,
        P+T, and P+2T are affine, that 3T is the point at infinity,
        and that the three differences sum to 0 in F_p.
    observation_collision:
      observable: the multiset M(P)
      distinct_preimage_search: >-
        Search for two nontrivial cosets with equal M. That pair is
        an observation collision. A finished count of 0 is the
        falsifier of this claim, and it is a real outcome.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The successive x-difference multiset as a label of
          translation by one order-3 point.
        predicted_gain: >-
          A collision count. Zero is separation. At least one is
          failure of separation. Neither moves an exponent.
    quantifier_order: >-
      There exists a smallest prime p with 13 ≤ p ≤ 200 such that E
      has a rational point T of order exactly 3, and for that p there
      exist two distinct nontrivial <T>-cosets with the same M.
    method_ceiling:
      strongest_certifiable_claim: >-
        On one curve over one prime p ≤ 200, M either collides or
        separates <T>-cosets. No statement about a secret scalar, and
        no statement past that p.
      nearby_object_control: >-
        Shuffle the affine x-coordinates among the same nontrivial
        points, recompute difference multisets on the same cosets, and
        record that null collision count. The group-law M is not read
        as special when its count lies in the central 90 percent of
        500 shuffles.
    proof_obligations:
      - claim: 3T is the point at infinity, checked by the group law, before M is formed.
        responsibility: correctness
      - claim: >-
          A separating M on an index-3 quotient is at most a square-root-of-3
          constant and is not scored as an attack.
        responsibility: scope
    not_applicable_reason: >-
      This is a control on a coset label, not a theorem, bound,
      certificate, reduction, or closure. The map audits that control
      only.
  rerandomization: >-
    No re-randomizing walk is used. The 500 x-shuffles are a null for
    the collision count on a fixed partition. They do not pull a
    discrete logarithm back to an input instance.
  asymptotic_claim:
    problem: prime-field ECDLP
    prior_best: Pollard rho at Theta(N^{1/2}) group operations
    time_exponent: '1/2, unchanged; this hypothesis does not move it'
    memory_exponent: O(1) for rho, unchanged; the measurement stores O(p) labels with p at most 200
    hidden_cofactor: none; no attack cost is proposed
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against rho is 1. claim_kind is filled so
      the non-claim is explicit. A separating label of an index-3
      quotient is at most a square-root-of-3 constant and is not
      claimed here.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        On a fixed partition into n nontrivial cosets, a uniform
        shuffle of the affine x-coordinates produces collision counts
        whose sample mean is compared with n(n-1)/(2 R_hat), where
        R_hat is the mean number of distinct shuffled multisets. The
        comparison is the rational gap defined in EXP-TORS-6150c0. It
        imitates a uniform draw into a set of size R_hat. It is not a
        model of large-p torsion, and it does not use a Weil estimate.
      random_model_justification: >-
        Birthday counting on a finite set. The opened row KR-IC-5a43e5
        is a vanishing criterion for summation polynomials and is not
        a distribution for M. KR-RHO-13bf67 is the complexity baseline,
        not a distributional theorem for these differences.
      supporting_results: []
      validation_experiment_ids:
        - EXP-TORS-6150c0
      falsification_condition: >-
        The absolute gap between the sample mean of the 500 shuffle
        collision counts and n(n-1)/(2 R_hat) exceeds one quarter of
        the maximum of that birthday quantity and 1, in exact rational
        arithmetic. That observation means the null comparison is
        mis-specified. The pair-count claim is then still the raw
        count; the heuristic flag does not convert a zero into a
        collision or a collision into a zero.
  structural_ingredients:
    - description: >-
        Small-order torsion is already used to shrink a symmetrised
        decomposition. This hypothesis builds no summation system.
      citation: KR-IC-955fd6
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
      role: fence around torsion-shrunk point decomposition
    - description: >-
        Semaev summation polynomials vanish on x-coordinates that sum
        to the identity. M is a difference multiset on a torsion
        coset, not a summation polynomial.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: fence around summation polynomials
    - description: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. An injective label of an index-3 quotient
        changes a constant by at most sqrt(3) and is not claimed as an
        attack.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: unchanged complexity baseline
    - description: >-
        Naive Semaev index calculus over prime fields does not beat
        generic methods under the stated statistical assumptions. This
        hypothesis is not index calculus.
      citation: KR-IC-5931ee
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
      role: fence around prime-field index calculus
    - description: >-
        Curves in one isogeny class share their group structure. This
        hypothesis uses one curve and does not walk an isogeny class.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: fence around isogeny-class transfer
    - description: >-
        Bounded-degree algebraic factor bases over a generic
        prime-field subgroup are scoped out, and the universal
        statement is open. This hypothesis declares no factor base.
      citation: KN-OPEN-020
      provenance: internal
      verified_by: knowledge/open-problems/KN-OPEN-020.md
      role: fence around factor bases
    - description: >-
        Theorem C says an exactly sum-compatible bucket index on a
        prime-order group is a surjective homomorphism, impossible for
        1 < M < N. M here is a multiset of differences, not asserted
        to be sum-compatible.
      citation: KN-FIND-ffe1df
      provenance: internal
      verified_by: knowledge/findings/KN-FIND-ffe1df.md
      role: fence, not a hypothesis under test
  reduction_chain:
    core_problem: toy collision count of one order-3 coset label
    corollaries: []
  predictions:
    - metric: >-
        number of unordered pairs of distinct nontrivial <T>-cosets
        with equal M
      direction: higher
      minimum_effect: >-
        At least 1. A finished count of 0, with at least two cosets
        and the controls passing, is the concrete negative.
    - metric: fraction of nontrivial cosets whose M is unique
      direction: lower
      minimum_effect: >-
        Strictly below 1 when the pair count is at least 1.
  test_boundary:
    instances:
      - one short-Weierstrass curve y^2 = x^3 + 2x + 3 over the first eligible prime at most 200
    parameters:
      A: 2
      B: 3
      p_min: 13
      p_max: 200
      torsion_order: 3
      shuffles: 500
      central_mass: '0.90'
    implementation: >-
      Scan primes, freeze the first order-3 point, partition
      nontrivial cosets, count colliding M pairs, and draw 500
      x-shuffles on that partition. No discrete-log search.
    budget:
      scientific_shuffles: 500
      maximum_runs: 1
  falsification_conditions:
    - >-
      The eligible prime is fully scored, the group-law cycle closes,
      every difference triple sums to 0 in F_p, the identity coset is
      absent from the scored set, at least two nontrivial cosets
      exist, and the colliding-pair count is 0. That finished count is
      the concrete negative.
    - >-
      No prime p with 13 ≤ p ≤ 200 supplies a nonsingular model with a
      rational point of order exactly 3.
    - >-
      Fewer than two nontrivial cosets exist, so there is no pair to
      collide. The claim's existential pair statement is then false on
      this equation, and the count is not promoted to a collision.
  interpretation_limits:
    - >-
      The statistic does not determine a secret scalar. A separating
      label of an index-3 quotient leaves a discrete log in a group of
      size N/3.
    - >-
      Evidence is claim_tier toy and stops at the first eligible prime
      at most 200 on this equation.
    - >-
      Not a factor base, not a summation polynomial, and not an entry
      in the open class of KN-OPEN-020.
    - >-
      A curve-only count of rational 3-torsion points is not the
      claim. The claim is the collision count of M.
    - >-
      A group-law failure or a difference triple that does not sum to
      0 blocks scoring. Neither is a pair count of 0.
