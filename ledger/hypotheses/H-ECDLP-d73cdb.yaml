  reduction_chain:
    core_problem: Check the five cells of 2/(m - theta).
    corollaries: []
  predictions:
    - metric: gap_at_half
      direction: different
      minimum_effect: 4/9 is 1/18 below 1/2.
    - metric: tie_at_one
      direction: different
      minimum_effect: At m = 5 and theta = 1 the gap is 0.
  test_boundary:
    instances: [five cells]
    parameters:
      gap_half_num: 1
      gap_half_den: 18
      tie_at_one: 0
      gap_zero_num: 1
      gap_zero_den: 10
      tie_m4: 0
