# H-ECDLP-d73cdb
# Exponent-cut arithmetic for IDEA-20261002-3722ca.
# No seed set is scanned. Approval: DEC-20261002-ade3b7.
hypothesis:
  id: H-ECDLP-d73cdb
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20261002-3722ca
  experiment_id: EXP-ECDLP-645b56
  specified_at: '2026-10-02'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261002-ade3b7
  title: >-
    At arity 5 the model exponent 4/9 is 1/18 below 1/2.
  statement: >-
    The model time exponent is 2 divided by m minus theta. It lies
    strictly below 1/2 exactly when theta is strictly below m minus 4,
    provided m minus theta is positive. At m = 5 and theta = 1/2 the
    exponent is 4/9, which is 1/18 below 1/2. At m = 5 and theta = 1
    the exponent is 1/2, so the gap is 0. At m = 5 and theta = 0 the
    exponent is 2/5, which is 1/10 below 1/2. At m = 4 and theta = 0
    the exponent is 1/2, so the gap is 0. At m = 4 and theta = 1 the
    exponent is 2/3, which exceeds 1/2 by 1/6.
  mechanism: >-
    The proposal balances relation collection against a square matrix
    and obtains the exponent 2/(m - theta). This contract checks that
    comparison. It does not list seeds and it does not build a curve.
  assumptions: []
  proof_search_map:
    bottleneck: The cross gap 1 on the denominator 18.
    baseline_embedding:
      parameter_slice: >-
        The balance written in IDEA-20261002-3722ca, read 2026-10-02.
        The fractions were computed in this design session. That
        computation is not a run.
      reproduction_check: >-
        One route cross-multiplies 4/9 against 1/2. The other
        evaluates 2 divided by m minus theta at the five cells. They
        must agree on the gap 1/18.
    observation_collision:
      observable: The gap 1/18, and the exact ties at theta = 1.
      distinct_preimage_search: >-
        Reporting 4/9 as equal to 1/2 drops the gap 1/18. Reporting
        the m = 4, theta = 0 cell as strictly below 1/2 drops the
        tie.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Five cells of the exponent 2/(m - theta).
        predicted_gain: Integer comparisons. No seed list.
    quantifier_order: >-
      The cut theta < m - 4 is checked first, then the five cells.
    method_ceiling:
      strongest_certifiable_claim: >-
        The gaps 1/18, 0, 1/10, 0 and the excess 1/6. Not a measured
        theta and not an attack cost.
      nearby_object_control: >-
        Theta = 1 at m = 5 reported as strictly below 1/2, and the
        m = 4, theta = 0 cell reported as strictly below 1/2.
    proof_obligations:
      - claim: 4/9 is 1/18 below 1/2.
        responsibility: correctness
      - claim: At m = 5 and theta = 1 the exponent equals 1/2.
        responsibility: correctness
      - claim: At m = 4 and theta = 0 the exponent equals 1/2.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Comparing 4/9 with 1/2 is an integer cross-multiplication.
        Those products were computed in this design session. That work
        is not a run.
      citation: ledger/proposals/IDEA-20261002-3722ca.yaml
