  title: >-
    On the ten-point sample the tail index is 2 over the logarithm of 2.
  statement: >-
    The ten costs are four 2s, three 4s, two 8s and one 16. Their sum is
    52 and their sum of squares is 448. The mean is 26/5. The variance
    with divisor 10 is 444/25, so the coefficient of variation is the
    square root of 111, divided by 13. That value is strictly above 1/2
    and strictly above 10/13, and strictly below 11/13. The two central
    order statistics are both 4, so the median is 4 and the maximum
    divided by the median is 4. The upper fifth of the sample is the two
    largest values, 16 and 8, and the next value is 8. The Hill mean of
    the logarithms is half the logarithm of 2, and the reciprocal tail
    index is 2 over the logarithm of 2. A partial sum of the series for
    that logarithm through 20 terms puts the index strictly above 14/5
    and strictly below 29/10, and strictly above 2. The proposal's
    written target count is 687, with 2 censored, so 685 remain. The
    censored fraction 2/687 is strictly below 1/20, and 2 is strictly
    below half of 687. Twenty percent of 687 is 687/5, which is 137
    plus 2/5, not 137. The symmetry band from 7/10 to 3/2 contains 1.
    The ratio 2 lies 1/2 above 3/2, and the ratio 3/5 lies 1/10 below
    7/10.
  mechanism: >-
    The proposal defines a coefficient of variation, a maximum-to-median
    ratio and a Hill tail index. This contract checks those definitions
    on one sample and on the proposal's written counts. It does not
    open an archived row.
