      N <= 96 with l >= 2 does not reach it, and every citation toward that
      question must carry the gap explicitly. KN-OPEN-011 is NOT closed,
      narrowed, or advanced by anything in this hypothesis.

  predictions:
    - metric: >-
        A1 -- shape of the recovery-rate curve in m at N = 64, l = 4, over a
        grid spanning m_lo - 6 to m_hi + 30 with m_lo, m_hi computed from the
        MEASURED delta_0 before the sweep is read
      direction: different
      minimum_effect: >-
        NON-MONOTONE: rise from <= 0.10 below the lower edge, a plateau
        >= 0.60, and a fall back to <= 0.10 at m >= m_hi + 20. A monotone
        non-decreasing curve out to m_hi + 30 falsifies A1 and the window
        framing is withdrawn.
    - metric: >-
        A2 -- lower edge: smallest m with certified recovery rate >= 0.5 at
        N = 64, l = 4
      direction: different
      minimum_effect: >-
        Within +/- 25 percent of F3's predicted m_lo at the measured delta_0.
