  falsification_conditions:
    - >-
      F1 (PRIMARY, CHEAPEST). |Bhat| at (l=1, e=0) is outside
      0.6366198 +/- 0.002, or |Bhat| at the extinction point e = (2^l-1)/2^l
      exceeds 4/sqrt(M). Part B1 is refuted, or the simulator is broken; either
      way nothing else in Part B may be reported. Cost: minutes.
    - >-
      F2. The l = 2 and l = 3 interior points are missed while l = 1 is hit.
      The contraction law is an l = 1 coincidence and the general form is
      withdrawn.
    - >-
      F3. Disjoint-support bias multiplication misses (2/pi)^2 or (2/pi)^4.
      HEUR-EC-5 is refuted, S_F is wrong, and the crossing statement B3 is
      withdrawn.
    - >-
      F4. The recovery curve in m is monotone non-decreasing out to m_hi + 30
      at a cell where F3 predicts an upper edge. A1 is refuted.
    - >-
      F5. Any certified recovery at m below the information edge. The
      determinant / target-norm derivation is wrong and Part A is rebuilt.
    - >-
      F6. Recovery in a cell F3 predicts EMPTY at the measured delta_0. Either
      delta_0 does not describe the reducer, or the Gaussian heuristic fails at
      these dimensions.
    - >-
      F7. Measured lattice recovery under errors exceeds (1-e)^m by more than
      1.5x at any tested e. HEUR-EC-7 is refuted and S_L < m.
    - >-
      F8 (VOIDS EVERYTHING POSITIVE). The no-leakage null produces any
      certified recovery. The pipeline is reading d through an unintended path
      and no positive number in the experiment stands.
    - >-
      F9 (VOIDS EVERY NEGATIVE). The positive control fails to reach 18/20. The
      instrument is broken and NO negative result may be reported at all.
    - >-
      F10 (THE PLANNED NEGATIVE, AND IT IS A DELIVERABLE). No part survives and
      the batch does NOT emit (a) the exact (l, N, m) boundary where F3 stops
      describing the reducer, (b) the measured contraction law that replaces
      F4, and (c) a named successor. A negative that does not produce those
      three HAS NOT FINISHED.

  interpretation_limits:
    - >-
      CLAIM TIER medium, and no downstream citation may raise it. N <= 96 by
      the mechanical rule in docs/claims-and-verification.md. NOTHING HERE IS A
      STATEMENT ABOUT 256-BIT DEPLOYED CURVES, and RQ-ECDSA-87625f's 1-bit-at-
      256-bit question is untouched.
    - >-
      THE LEAKAGE ASSUMPTION TRAVELS WITH EVERY SENTENCE. Every recovery is a
      recovery GIVEN l exactly-known (or e-erroneous) top nonce bits per
      signature from an ASSUMED side channel. Without that clause the statement
      is a misreport. GOAL-ECDSA-001.next_action names this trap as specific
      and likely.
    - >-
      SAYS NOTHING ABOUT ECDLP IN EITHER DIRECTION. KN-TECH-019 records that
      the HNP pipeline is not a plain ECDLP attack and KN-OPEN-011 owns the
      transfer question; it stays with GOAL-ECDLP-001 and GOAL-PATH-001
      (GOAL-ECDSA-001.non_duplication).
    - >-
      AN EMPTY WINDOW IS A STATEMENT ABOUT delta_0, NOT ABOUT REACHABILITY. It
      says this reducer cannot do that cell. The predicate/sieving family
      exists precisely to change the effective delta_0 and is OUTSIDE this
      hypothesis; writing "l-bit leakage is out of reach at N bits" from an
      empty window is exactly the premature-closure failure mode
      (docs/inventor-protocol.md section 4).
    - >-
      B3 IS A DERIVED CONSEQUENCE, NOT A MEASUREMENT, and its lattice input
      models the NAIVE route. If the predicate route's error law differs, B3 is
      restricted to the naive route in every citing sentence. Presenting w* as
      a measured threshold would violate the validation ladder
      (docs/inventor-protocol.md section 6 step 2).
    - >-
      INSTRUMENT FINDING, NOT ATTACK FINDING. A validated F3 makes existing
      success reports interpretable; it makes no instance easier to solve and
      moves no exponent. sota_delta is zero on every attack axis.

