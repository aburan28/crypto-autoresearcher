  reduction_chain:
    core_problem: >-
      Predict, from structural data alone, whether the exact-leakage HNP
      lattice pipeline recovers the key at a given (N, l, m), and how both
      families' costs respond to leakage error rate e.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from anything here to a
