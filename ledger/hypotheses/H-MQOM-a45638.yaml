  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY) - the (k, D) reproduction failing at any of the
      six cells. The reconstruction is not the specification's model, Q1 is
      false, and every downstream statement is void. This costs seconds and is
      the cheapest refutation available.
    - >-
      F2 - the cost residual spread exceeding 0.2 bits. The 6.1 constant is an
      artifact of the chosen cells and no cost re-derivation may be built.
    - >-
      F3 - a nonpositive series coefficient at k = 0 for any MQOM (q, n=m). Q2's
      identity is wrong.
    - >-
      F4 - the overdetermined nearby-object control returning the same (k, D) as
      the m = n case. The rule is reading n alone.
    - >-
      F5 - fewer than two binding-row changes under M1 at 2^80, or any negative
      margin shift. Transcription or arithmetic error; halt.
    - >-
      F6 - Q4's positive control failing to produce a deficit at
      o = floor(n/2). Instrument broken; no negative may be reported from any
      arm.
    - >-
      F7 - Q4's seed spread comparable to or larger than the deficits measured.
      The instrument measures noise and is reported as doing so.
    - >-
      F8 (THE PLANNED NEGATIVES, BOTH DELIVERABLES) - (a) if the memory sweep
      changes no binding row at any level under any ceiling, the scoped negative
      "for MQOM v2.1's twelve published attack rows, charging memory changes
      nothing" is the product, stated with its exact boundary; (b) if Q4's
      graded curve is flat at every interior o while the positive control fires,
      the scoped negative "this instrument has no power against oil structure at
      n <= 12 over F_2" is the product, and it forbids any statement about the
      structured schemes. A run that produces neither statement HAS NOT
      FINISHED.

  interpretation_limits:
    - >-
      CLAIM TIER: derivation for Q1-Q3, TOY for Q4, and neither may be raised by
      any downstream citation. NO ATTACK, NO SOLVE, NO EXPONENT. Nothing here
      makes any MQ system easier to solve.
    - >-
      A finding that MQOM looks STRONGER under memory charging is not a
      certification of MQOM. It is a statement about one accounting axis applied
      to twelve published rows and says nothing about algorithms absent from the
      table.
    - >-
      Q2's undefinedness is a CITATION HYGIENE RULE, not a weakness of MQOM: it
      says "MQOM's solving degree" is not well formed without naming k, and it
      redirects any d_reg transfer onto the k-guessed sub-system.
    - >-
      TOY IS NOT DEPLOYED. Q4 reaches n <= 12 against MQOM's n = 48 to 320.
      AGENTS.md rule 7 binds absolutely, and this program's own record of
      toy-to-crypto extrapolation failures -- prime-field solves at p = 1009
      extrapolated to N = 2^256 -- is the reason the goal record demands honest
      uncertainty. No extrapolation from Q4 to any MQOM parameter set is
      permitted, and any conditional statement must carry that history by name.
    - >-
      The q = 2 rows are EXCLUDED from the reproduction claim: their costs rest
      on an estimator the specification states is its own and unpublished, and
      on an unpublished Crossbred+ variant. The 7-bit disagreement with
      CryptographicEstimators v2.0.0 is reported as a live disagreement, never
      resolved by preference.
    - >-
      Scoped to MQOM v2.1. No Round-3 specification exists as of 2026-08-05.

