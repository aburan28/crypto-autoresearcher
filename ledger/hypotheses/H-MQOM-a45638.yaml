hypothesis:
  id: H-MQOM-a45638
  question_id: RQ-MQOM-001

  statement: >-
    SCOPE: MQOM v2.1's own MQ security analysis (Section 4.2 and Tables 16, 17,
    18), its nine (q, n=m) parameter sets, exact integer arithmetic, plus toy
    exact linear algebra at n <= 12 over F_2 and n <= 8 over F_16 / F_256.
    CLAIM TIER: derivation for the table work, TOY for every measurement. NO
    ATTACK, NO EXPONENT, NO CRYPTO-SCALE STATEMENT, NO SOLVE OF ANY MQOM
    INSTANCE.
    FOUR PARTS, EACH FALSIFIABLE SEPARATELY.
    (Q1, REPRODUCTION) The specification's published attack parameters for
    q = 16 and q = 256 are generated with no free choices by minimising, over
    the number k of guessed variables, the cost of hybrid XL-Wiedemann on the
    sub-system of m equations in n - k variables, where the solving degree comes
    from the specification's own series (1 - z^2)^m / (1 - z)^(n-k+1). All six
    published (k, D) pairs are reproduced exactly, and the reconstructed log2
    cost differs from the published cost by a CONSTANT residual of about 6.1
    bits at all six cells.
    (Q2, UNDEFINEDNESS) At MQOM's own shape m = n the series collapses to
    (1 + z)^n / (1 - z), so a_d = sum_{j<=d} C(n,j) > 0 for every d and the
    specification's own definition of "solving degree" HAS NO VALUE at k = 0.
    The quantity becomes defined only after k >= 1 variables are guessed.
    Consequently the phrase "MQOM's solving degree" is not well formed without
    naming k, and any transfer of this program's degree-of-regularity
    instrumentation to MQOM must target the k-guessed sub-system rather than the
    public map.
    (Q3, THE UNCHARGED MEMORY COLUMN) Each security level's derived margin is
    set by a MINIMUM over algorithm rows whose memory is printed in the same
    table and never charged. At q = 2 Category V the minimising row is Dinur's
    second algorithm at cost 280 with SPACE 2^208, below Crossbred at 282 with
    space 2^145; at q = 256 Category III the minimising row is PXL at 216 with
    2^128.9 non-zero coefficients, below WXL at 217.5 with 2^90.8. THE
    HYPOTHESIS: imposing any memory ceiling below 2^208 changes the binding row
    at at least two of the nine levels, and the derived margin can only INCREASE
    -- so MQOM looks STRONGER under memory charging, not weaker.
    (Q4, THE MATCHED NULL) MQOM's map is fully random and unstructured by design
    and is therefore the matched null object for the structured MQ family (UOV,
    MAYO, QR-UOV, SNOVA), which this corpus has never measured against any null.
    At toy sizes, the exact Macaulay rank of a MQOM-shaped random system equals
    the semi-regular prediction at every cell with n - k >= 6, and the rank
    deficit of a UOV-shaped system is non-decreasing in the oil dimension o,
    with o = 0 being exactly the MQOM object. Where the graded curve is flat the
    instrument has no power at that size, and that measured limitation forbids
    any negative statement about any structured scheme.

  mechanism: >-
    PROVENANCE AND ITS LIMITS. The specification was READ this session from
    https://mqom.org/docs/mqom-v2.1.pdf (HTTP 200, 707578 bytes), extracted with
    a pure-zlib PDF stream reader because pdftotext is absent and pypdf crashes
    on import here. THE EXTRACTION IS LOSSY: table cells arrive in reading order
    and no page numbers survive. Every transcribed cell is to be re-verified
    against the rendered PDF as stage 0 and the hypothesis is not testable until
    it is. All arithmetic labelled "derived in this session" was computed here
    in pure Python with exact integers, OUTSIDE the harness, with no run record;
    it is re-derivable in seconds and must be re-derived in-harness before any
    evidence record cites it.

    INFRASTRUCTURE STATE, REPORTED AS INFRASTRUCTURE AND NEVER AS MATHEMATICS
    (AGENTS.md rule 5). GOAL-MQOM-001's next_action requires checking the
    degree-of-regularity backend before any solving-degree experiment is
    designed. Measured this session: numpy 2.4.6 imports; sympy does not exist;
    Sage does not exist, so src/ic_first_fall_fast.py fails at line 23
    ("from sage.all import GF, Matrix") and cannot be imported at all. The
    backend is therefore not in the state EV-DREG-004 left it in -- it is
    absent from this container. EV-DREG-004 itself carries validity_status
    in_progress_rebuilt, two filesystem incidents, a cell destroyed at 24.93 per
    cent of columns, and three of four run_ids that are collective range labels
    resolving to no manifest. Its object is a BOOLEAN CHAINED SEMAEV system at
    n = 21 over GF(2) with field equations carried; MQOM's objects are dense
    random MQ over F_2 / F_16 / F_256 with m = n. THE TWO ARE DIFFERENT OBJECTS
    AND NO NUMBER TRANSFERS. This hypothesis is written so that Q1, Q2 and Q3
    need none of that machinery, and Q4 needs only a small purpose-built exact
    rank routine.

    THE SPECIFICATION'S OWN MODEL, quoted from the extracted Section 4.2:
    "Consider the series expansion: sum_j a_j z^j = (1 - z^2)^m / (1 - z)^(n+1).
    The smallest index j such that a_j <= 0 is the solving degree of the
    semi-regular sequence (see [CG23] for more details). When d is strictly less
    than the solving degree, then the rank of the degree-d Macaulay matrix is
    C(n+d,d) - a_d (in the non-binary case). If d is equal or greater than the
    solving degree, then the rank is just C(n+d,d) (the number of columns)."
    An equivalent matrix-F5 recurrence is also given:
    R_{d,j+1} = R_{d,j} + C(n+d-2, d-2) - R_{d-2,j}, with R_{d,m} = C(n+d,d) -
    a_d. The BW1 operation count is given as about
    2*(1 + n~/m~) * N^2 * (C(n+2,2) + m~) with N = C(n+d,d), and the hybrid
    method is described as: choose 0 <= k <= n, guess k variables, solve the
    remaining system of m equations in n - k variables by F5 or XL-Wiedemann,
    repeat -- "the sub-systems that are actually solved in step 3 are more
    overdetermined than the input system, and therefore have a much lower
    solving degree".

    Q2 DERIVED. With m = n the numerator and denominator share (1-z)^n:
    (1 - z^2)^n / (1 - z)^(n+1) = (1+z)^n (1-z)^n / (1-z)^(n+1)
    = (1+z)^n / (1-z), whose coefficient of z^d is sum_{j<=min(d,n)} C(n,j),
    strictly positive for every d >= 0. Verified this session at all nine
    (q, n=m) = (2,160), (2,240), (2,320), (16,56), (16,84), (16,116), (256,48),
    (256,72), (256,96) out to d = 60, with the first coefficients matching the
    closed form exactly (for n = 160: a_1 = 161 = 1 + 160, a_2 = 12881 =
    1 + 160 + 12720). This is not an error in the specification -- an
    exactly-determined quadratic system has about 2^n solutions over the
    algebraic closure by Bezout, so its ideal is not the ideal of one point and
    the Macaulay matrix never saturates -- but it means THE HYBRID LAYER CARRIES
    THE ENTIRE COST MODEL, and it is the reason Q1 must minimise over k.

    Q1 DERIVED. For each (q, n=m) and each k, set nv = n - k, compute
    d_solv(k) = min{ d : a_d <= 0 } for (1 - z^2)^m / (1 - z)^(nv+1), and score
    cost(k) = k*log2 q + log2( 2 * C(nv + d, d)^2 * C(nv+2, 2) ), which is the
    specification's BW1 shape with the (1 + n~/m~) factor set to 1 and the + m~
    term dropped. The argmin:
      q=16,  n=56  -> k=13, D=13, cost 144.5  [published Table 17: 13, 13, 150.6]
      q=16,  n=84  -> k=17, D=19, cost 204.7  [published Table 17: 17, 19, 210.8]
      q=16,  n=116 -> k=24, D=24, cost 272.8  [published Table 17: 24, 24, 278.9]
      q=256, n=48  -> k=3,  D=22, cost 150.9  [published Table 16: 3,  22, 157.0]
      q=256, n=72  -> k=5,  D=28, cost 211.4  [published Table 16: 5,  28, 217.5]
      q=256, n=96  -> k=8,  D=33, cost 274.3  [published Table 16: 8,  33, 280.4]
    Six of six on BOTH coordinates, with log2 N also matching at the first cell
    (40.8 reconstructed against 40.8 published). The residual published-minus-
    reconstructed is 6.1 bits at every one of the six cells. A CONSTANT RESIDUAL
    ACROSS SIX CELLS SPANNING THREE SECURITY LEVELS AND TWO FIELD SIZES IS A
    MISSING CONSTANT FACTOR IN THE TRANSCRIPTION, NOT A MODELLING DISAGREEMENT,
    and identifying it is a one-page obligation. 2^6.1 is about 68.6, which is
    neither the 3 nor the 1.75 matrix-vector-product factors the specification
    discusses, so the residual is genuinely unexplained and the reconstruction
    is used ONLY for (k, D) until it is resolved.

    Q3, THE TABLES AND THE BINDING ROW. Transcribed from the extracted
    Tables 16, 17, 18 (re-verification is stage 0). Reading (algorithm, cost,
    log2 memory) per level:
      q=2   Cat I  : Crossbred (144, 75.3), Crossbred+ (147, 37.3),
                     Dinur1 (160, space 129), Dinur2 (148, space 107)
      q=2   Cat III: Crossbred (213, 111), Crossbred+ (216, 54),
                     Dinur1 (223, 190), Dinur2 (214, 158)
      q=2   Cat V  : Crossbred (282, 145), Crossbred+ (285, 70.4),
                     Dinur1 (283, 248), Dinur2 (280, 208)
      q=16  Cat I  : WXL (150.6, 50.7), PXL (142.8, 79.3)
      q=16  Cat III: WXL (210.8, 73.5), PXL (209.3, 116.3)
      q=16  Cat V  : WXL (278.9, 94.0), PXL (284.9, 149.2)
      q=256 Cat I  : WXL (157.0, 68.0), PXL (148, 86.5)
      q=256 Cat III: WXL (217.5, 90.8), PXL (216, 128.9)
      q=256 Cat V  : WXL (280.4, 110.6), PXL (283, 169)
    The minimising row is the higher-memory one at six of the nine levels, and
    at q = 2 Category V it is a row requiring 2^208 bits of storage. The
    re-costing sweeps a declared menu of models -- M0 time only; M1 a hard
    memory ceiling C in {2^40, 2^60, 2^80, 2^100, 2^120, 2^150, 2^210} with
    rows above C excluded; M2 an AT^2 proxy score log2 T + 0.5*log2 M; M3 a
    memory-access penalty log2 T + c*log2 M for c in {0, 0.1, 0.25} -- and
    reports THE PERMUTATION TABLE of binding rows, never a single revised
    number. Under M1 at C = 2^80, two flips are forced by inspection: q=2 Cat V
    moves from Dinur2 (280) to Crossbred (282), and q=256 Cat III moves from PXL
    (216) to WXL (217.5).
    A SEPARATE UNIT DEFECT IS RECORDED AS PART OF Q3 AND MUST NOT BE CONFLATED
    WITH THE MEMORY QUESTION. The q = 2 table is explicitly in GATES: the
    specification applies "a penalty of a factor 20n" following [Bou24] and
    writes that the Moebius transform costs "about 20*n*d*2^n gates". The q = 16
    and q = 256 tables report a "cost" derived from arithmetic operations in
    F_16 and F_256 with no stated conversion. Comparing 142.8 from Table 17
    against a gate-count security bar is therefore a unit comparison this
    program must not make silently. Establishing the unit of each column is a
    reading task with a binary answer.

    Q4, THE MATCHED NULL AND ITS INSTRUMENT. Fix (q, n, m, D) and a seed; build
    the degree-D Macaulay matrix (over F_2, squarefree monomials with
    x_i^2 = x_i carried; over F_16 / F_256, all monomials of degree <= D);
    measure exact rank; report the first-fall degree
    d_ff = min{D : rank_D < prediction}. The NULL ARM is a MQOM-shaped uniformly
    random system, whose predicted rank C(nv+D,D) - a_D is FROZEN BEFORE ANY
    LINEAR ALGEBRA IS RUN and can fail at every cell. The GRADED ARM is a
    UOV-shaped system with an oil space of dimension o and a random invertible
    change of variables, swept over o in {0, 1, 2, 3, 4, floor(n/2)}, where
    o = 0 IS the null. The POSITIVE CONTROL is o = floor(n/2) with m <= o, where
    a linear-algebra solution exists and the rank MUST fall below the prediction
    -- if it does not, the instrument is broken and no negative result may be
    reported from any arm.
    WHY THIS SERVES MORE THAN ONE GOAL. GOAL-UOV-001, GOAL-MAYO-001,
    GOAL-QRUOV-001 and GOAL-SNOVA-001 are draft goals with no evidence, and the
    known obstacle is that a UOV public key is designed to look semi-regular so
    that measuring it alone measures nothing. The missing half is a matched
    random arm at identical (q, n, m) and identical support; MQOM supplies it at
    parameters that are themselves a NIST submission. The reusable rule this
    hypothesis proposes for the program is one sentence: A DEVICE THAT FIRES
    IDENTICALLY ON THE MQOM-SHAPED NULL HAS NOT FOUND STRUCTURE.

  assumptions:
    - >-
      FROZEN DEFINITIONS, fixed before evaluation, no free parameter.
      (1) a_d(m, nv) := [z^d] (1 - z^2)^m / (1 - z)^(nv+1), computed as
      sum_{j<=d/2} (-1)^j C(m,j) C(nv + d - 2j, d - 2j) in exact integers.
      (2) d_solv(m, nv) := min{d <= 400 : a_d <= 0}, or "undefined".
      (3) cost(k) := k*log2 q + log2(2 * C(nv+d,d)^2 * C(nv+2,2)) with
      nv = n - k and d = d_solv(m, nv).
      (4) The model menu M0, M1, M2, M3 with the ceilings and constants listed
      above, closed before any table is transformed.
      (5) The Q4 cell list, degrees and seeds, frozen in stage 1 before any rank
      is computed. Any change after a value is observed requires a superseding
      record, never an edit.
    - >-
      That the extracted Tables 16, 17, 18 and the Section 4.2 series are
      faithful. Stage 0 re-verifies; a single transposed column changes the
      binding-row analysis and the audit halts if one is found.
    - >-
      That M1/M2/M3 are DECLARED MODELS, not facts. No claim is made that any is
      the right accounting for block Wiedemann. The deliverable is the
      permutation table indexed by model, which is honest under all of them at
      once.
    - >-
      NO ASSUMPTION that structure is visible at toy sizes in Q4. The honest
      expectation is that it may not be, and the deliverable is built to be
      worth having either way.

  proof_search_map:
    bottleneck: >-
      The choice of k in the hybrid method. It is the single step that converts
      an exactly-determined system with no defined solving degree into an
      overdetermined one with a finite solving degree, and every published MQ
      cost figure for MQOM is the value of a minimum over it. If the k-optimum
      or the series governing it is wrong, every number in Tables 16 and 17 is
      wrong; if the memory of the minimising row is charged, the minimum can
      land elsewhere. Nothing else in Section 4.2 has that leverage.
    baseline_embedding:
      parameter_slice: >-
        The six published (k, D) cells of Tables 16 and 17 themselves. Not an
        analogous regime: the exact published parameter choices, so baseline and
        target coincide and no extrapolation intervenes. Table 18 (q = 2) is
        EXCLUDED from the reproduction claim because its costs come from an
        estimator the specification states is its own and unpublished, and from
        an unpublished algorithm variant (Crossbred+); that exclusion is
        declared here rather than discovered later.
      reproduction_check: >-
        SYMBOLIC AND EXACT, AND PASSED BEFORE THIS RECORD WAS WRITTEN: six of
        six on (k, D), with log2 N matching at the checked cell and a constant
        6.1-bit cost residual. These are exact integer identities against
        published values, not a curve resembling a baseline. Stage 1 of
        EXP-MQOM-1e17ed recomputes them in the harness with a receipt, and a
        failure at any cell halts everything downstream.
    observation_collision:
      observable: >-
        The pair (k, D) per cell, the scalar cost, the binding-row label per
        level, and in Q4 the integer rank profile (rank_2, ..., rank_Dmax).
      distinct_preimage_search: >-
        A COLLISION EXISTS IN Q4 AND IT IS STRUCTURAL, NOT ACCIDENTAL: the rank
        profile is invariant under GL_n(F_q), so every system in a linear-change-
        of-variables orbit -- including a UOV key and its unhidden central map
        -- shares the observable. That is not a defect: it is exactly the
        attacker's own view, since the trapdoor is concealed by precisely that
        change of variables. The separating condition, if any, is the RANK
        DEFICIT relative to the semi-regular prediction, and testing whether it
        separates the o = 0 and o > 0 fibres IS the graded arm. If the deficit
        does not separate them at reachable sizes, identifiability fails at
        those sizes and the instrument's power is reported as zero there.
        A SECOND COLLISION IS ALREADY VISIBLE AND MUST BE REPORTED: at q = 2
        Category I the specification's own Table 18 gives Crossbred cost 144
        while the public CryptographicEstimators v2.0.0 (git commit 0d9bd3f925e)
        gives 151.17 for MQEstimator.MQProblem(n=160, m=160, q=2), and the
        specification lists four specific ways it considers that library wrong.
        Two ground-truth-claiming estimates of the same quantity differ by 7
        bits; the honest disposition is to report both, per AGENTS.md retrieval
        policy item 7, and never to pick one.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Replace "how hard is MQ at MQOM's parameters" by a problem-specific
          resource measure -- the pair (binding row identity, binding cost)
          under a frozen menu of cost models -- realised by specialising to the
          twelve published rows and adding charges only over the declared,
          disjoint model menu.
        predicted_gain: >-
          Turns an open cryptanalytic question into a finite permutation table
          computable in seconds, with the encoding obligation (the measure reads
          only published columns), the completeness obligation (all four models
          reported), the soundness obligation (no model is selected), and the
          transfer obligation DECLARED UNMET: nothing transfers to algorithms
          absent from the table, in particular to any future MQ solver.
      - transform: observable_fiber
        proposed_object: >-
          Hold the Macaulay rank profile fixed and vary the forgotten structure:
          the oil dimension o at identical (q, n, m, support, seed discipline).
          The proposed intrinsic invariant distinguishing the fibres is the rank
          deficit against the semi-regular prediction.
        predicted_gain: >-
          If the deficit does not distinguish o = 0 from o > 0 at reachable
          sizes, the instrument has not identified the load-bearing structure
          and that fires at the cost of one toy sweep, before any structured-MQ
          goal spends a batch on it.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXISTS one fixed scoring rule (the frozen
      cost(k) with the specification's series), chosen before any evaluation and
      depending on no cell, such that FOR ALL six published q=16/q=256 cells the
      argmin reproduces the published (k, D). The witness may NOT depend on q,
      n, the category, or the cell. The weaker order -- FOR ALL cells THERE
      EXISTS a rule -- is trivially satisfiable, is NOT claimed, and is not
      admissible as a result.
      SEPARATELY, THE QUANTIFIER TRAP BEING HUNTED IN THE TARGET: the
      specification's semi-regularity assumption is stated as "it only depends
      on n and m, and does not depend from the actual coefficients", which is a
      FOR ALL COEFFICIENT CHOICES statement. Q4's seed control tests exactly
      that quantifier: if the measured rank varies with the seed at fixed
      (q, n, m, D), the universal statement is false at that size and the
      correct object is a distribution rather than a formula.
    method_ceiling:
      strongest_certifiable_claim: >-
        AT MOST: (i) that the specification's own published (k, D) choices for
        q = 16 and q = 256 are reproduced exactly by its own stated series;
        (ii) that at MQOM's m = n the series has no nonpositive coefficient;
        (iii) that under a declared memory model the binding row changes at
        listed levels and the derived margin does not decrease; and (iv) a
        toy-scale, multi-seed table of exact Macaulay ranks for MQOM-shaped and
        UOV-shaped systems at n <= 12 over F_2. IT CANNOT certify any MQ
        hardness at MQOM's deployed sizes, cannot bound any solver's cost at
        cryptographic scale, cannot validate semi-regularity at n = 160, cannot
        move any exponent, and cannot make any statement about UOV, MAYO,
        QR-UOV or SNOVA as deployed. Writing it up as if it could would be the
        overclaiming failure mode, and this program's own record of
        toy-to-crypto extrapolation failures is the reason the goal record
        demands honest uncertainty here.
      nearby_object_control: >-
        TWO, BOTH FREE. (a) SYNTHETIC OVERDETERMINED TWIN: q = 16, n = 56,
        m = 112. The hoped-for conclusion (a large optimal k) FAILS there by
        construction -- an overdetermined system has a nonpositive series
        coefficient at low degree with little or no guessing, so the optimum
        must be k near 0 and D far below 13. A pipeline returning k = 13, D = 13
        for both is responding to n alone and has not identified the (n, m)
        dependence that is the whole model. (b) THE UOV-SHAPED SYSTEM AT
        o = floor(n/2) with m <= o, where the semi-regular conclusion is KNOWN
        FALSE because a linear-algebra solution exists. An instrument that
        cannot separate that pair from the o = 0 null has not found the
        load-bearing structure, and no negative may be reported from it.
    proof_obligations:
      - claim: >-
          The frozen scoring rule reproduces all six published (k, D) pairs of
          Tables 16 and 17 exactly.
        responsibility: baseline
      - claim: >-
          a_d > 0 for all d <= 400 at all nine MQOM (q, n=m), i.e. the series
          identity (1-z^2)^n/(1-z)^(n+1) = (1+z)^n/(1-z).
        responsibility: correctness
      - claim: >-
          The published-minus-reconstructed cost residual is constant to within
          0.2 bits across the six cells; until it is explained, no cost claim is
          built on the reconstruction.
        responsibility: strictness
      - claim: >-
          Binding-row changes under M1 are computed from the transcribed table
          alone and are reproducible by hand at the two named levels.
        responsibility: feasibility
      - claim: >-
          Charging a cost axis is monotone, so the derived margin cannot
          decrease; any decrease indicates a transcription or arithmetic error.
        responsibility: correctness
      - claim: >-
          Q4's null-arm prediction is frozen before any rank is computed, and
          the seed spread is reported before any model error.
        responsibility: interface
      - claim: >-
          Every Q4 number is toy and no citation may raise its tier; the
          boolean-versus-prime-field and toy-versus-deployed gaps travel with
          every statement.
        responsibility: scope
      - claim: >-
          Table 18 (q = 2) is excluded from the reproduction claim because its
          costs rest on an unpublished estimator and an unpublished algorithm.
        responsibility: interface
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO complexity improvement is claimed and no exponent is
    moved. The exponents in play are the specification's own claimed attack
    exponents (144 / 213 / 282 at q = 2; 142.8 / 209.3 / 278.9 at q = 16;
    148 / 216 / 280.4 at q = 256), and the only possible output is a revision of
    WHICH of them binds, by one to two bits, in the direction of larger. A
    result that makes the target look stronger is still a result and is the
    honest half of GOAL-MQOM-001's completion criterion. dominated_by is not
    applicable: no Pareto point is claimed and no algorithm is proposed.

  heuristic_assumptions:
    - id: HEUR-MQOM-MQ-1
      formal_statement: >-
        SEMI-REGULARITY, THE ASSUMPTION MQOM'S ENTIRE MQ ANALYSIS RESTS ON.
        FOR ALL q in {2, 16, 256}, FOR ALL nv >= 6, FOR ALL m, FOR ALL d below
        the solving degree, and FOR a uniformly random choice of coefficients,
        the rank of the degree-d Macaulay matrix of m quadratics in nv variables
        equals C(nv+d, d) - a_d with probability 1 - o(1); in particular it does
        not depend on the coefficients.
      random_model_justification: >-
        The specification's own justification, quoted: the assumption "is
        usually well-verified in practice on unstructured systems, and is
        therefore standard in all the cryptographic literature". THAT IS AN
        APPEAL TO PRACTICE, NOT A THEOREM, and the primary sources it cites
        ([Bar04], [BFS15], [CG23]) were NOT RETRIEVED for this record. This
        program has a specific recorded reason for caution: semi-regularity is
        inherited unnamed by 24 files and 13 experiment contracts here, and it
        is exactly the assumption known to fail for summation-polynomial
        systems. MQOM's map is unstructured by design, which is the strongest
        available case FOR the assumption -- and is why MQOM is simultaneously
        the right null object for the structured schemes.
      supporting_results: []
      validation_experiment_ids: [EXP-MQOM-1e17ed]
      falsification_condition: >-
        Any Q4 null-arm cell with nv >= 6 whose exact rank differs from the
        frozen prediction, replicated across at least two seeds. Reported FIRST,
        before anything about structure, because it invalidates a baseline that
        13 experiment contracts in this corpus and the security analysis of a
        NIST Round-3 candidate both inherit.
    - id: HEUR-MQOM-MQ-2
      formal_statement: >-
        VISIBILITY. That an oil space of dimension o produces a Macaulay rank
        deficit detectable at the sizes reachable in this container (n <= 12
        over F_2, n <= 8 over F_16 / F_256, D <= 4).
      random_model_justification: >-
        NONE, AND THIS IS THE WEAKEST LINK IN Q4. It is entirely possible that
        the deficit appears only at n far beyond reach, in which case the graded
        curve is flat and the instrument is uninformative at toy scale.
      supporting_results: []
      validation_experiment_ids: [EXP-MQOM-1e17ed]
      falsification_condition: >-
        A flat deficit across the whole o sweep INCLUDING the positive control
        at o = floor(n/2) with m <= o. That combination means the instrument is
        broken rather than that structure is invisible, and the contract
        requires that reading first.
    - id: HEUR-MQOM-MQ-3
      formal_statement: >-
        COST-MODEL RELEVANCE. That charging memory (a hard ceiling, AT^2, or a
        memory-access penalty) better predicts realisable attack cost than a
        bare operation count, for block-Wiedemann-style computations at the
        reported sizes.
      random_model_justification: >-
        NONE OFFERED. The specification argues the question is genuinely open in
