  reduction_chain:
    core_problem: >-
      Reproduce, unit-check and memory-charge MQOM v2.1's own MQ security
      analysis at its exact (q, n=m) parameter sets, and calibrate its
      underlying semi-regularity assumption by exact measurement at the largest
      sizes this container can reach.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Q4's instrument is offered as a DONOR ARTIFACT to
      GOAL-UOV-001, GOAL-MAYO-001, GOAL-QRUOV-001 and GOAL-SNOVA-001, but that
      is an offer of tooling and a matched null, NOT a reduction and NOT a
      corollary: nothing measured here supports or weakens any claim about those
      schemes' deployed parameters, and their public maps are different objects.
      There is likewise no reduction to KN-OPEN-002, whose question is the
      growth of the solving degree for prime-field summation-polynomial systems;
      MQOM's fields are binary and its systems are dense and random, and a
      toy-scale calibration at n <= 12 does not reach any growth range.

  predictions:
    - metric: >-
        G1 - reproduction gate: number of the six published q=16/q=256 cells
        whose (k, D) is reproduced exactly by the frozen scoring rule
      direction: higher
      minimum_effect: >-
        EXACTLY 6 of 6, both coordinates, exact integers. Below 6 halts
        everything downstream: the reconstruction is then not the
        specification's model.
    - metric: >-
        G2 - residual spread: max minus min of (published cost minus
        reconstructed cost) over the six cells, in bits
      direction: lower
      minimum_effect: >-
        BELOW 0.2 bits around a common value of about 6.1. A larger spread means
        the residual is parameter-dependent and no re-costing may be built on
        the reconstruction.
    - metric: >-
        G3 - undefinedness gate: number of the nine MQOM (q, n=m) sets having a
        nonpositive a_d for some d <= 400 at k = 0
      direction: lower
      minimum_effect: >-
        EXACTLY 0 of 9. Forced by (1-z^2)^n/(1-z)^(n+1) = (1+z)^n/(1-z).
        A single nonpositive coefficient falsifies the identity outright.
    - metric: >-
        G4 - overdetermined nearby-object control: optimal k for the synthetic
        twin q = 16, n = 56, m = 112
      direction: lower
      minimum_effect: >-
        STRICTLY BELOW 13, and D strictly below 13. The rule must return a
        different answer for m = 2n than for m = n at the same n; if it does
        not, it is reading n alone and G1 is a coincidence of the search range.
    - metric: >-
        G5 - binding-row changes under M1 at ceiling 2^80, out of nine levels
      direction: higher
      minimum_effect: >-
        AT LEAST 2, and specifically q=2 Cat V (Dinur2 280 -> Crossbred 282) and
        q=256 Cat III (PXL 216 -> WXL 217.5), both hand-checkable from the
        transcribed table.
    - metric: >-
        G6 - margin direction: sign of (binding cost under M1) minus (binding
        cost under M0), per level
      direction: higher
      minimum_effect: >-
        NON-NEGATIVE at all nine levels, strictly positive at at least two. A
        negative value anywhere indicates a transcription or arithmetic error,
        because excluding rows cannot lower a minimum.
    - metric: >-
        G7 - graded memory-ceiling monotonicity: binding cost as a function of
        the ceiling C over seven values, per level
      direction: lower
      minimum_effect: >-
        NON-INCREASING IN C at every level, and exactly constant once C exceeds
        the largest memory in that level's rows. A non-monotone response
        localises a filter bug rather than leaving "it did not work".
    - metric: >-
        G8 - Q4 null-arm agreement: fraction of measured cells with nv >= 6
        whose exact rank equals the frozen semi-regular prediction
      direction: higher
      minimum_effect: >-
        1.00. Any disagreement refutes HEUR-MQOM-MQ-1 at that size and is
        reported before anything about structure.
    - metric: >-
        G9 - Q4 seed spread: seed-to-seed spread of the measured rank at each
        cell, reported BEFORE any model error at that cell
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Semi-regularity asserts coefficient-independence, so any
        nonzero spread is itself a refutation of the assumption at that size and
        must be reported first. If the spread is comparable to the deficits
        being measured, the instrument is measuring noise and must be reported
        as doing so, never as a fit.
    - metric: >-
        G10 - Q4 graded monotonicity and positive control: change in rank
        deficit as the oil dimension o increases through at least four interior
        points, and the deficit at o = floor(n/2) with m <= o
      direction: higher
      minimum_effect: >-
        NON-NEGATIVE at every step, and STRICTLY POSITIVE at o = floor(n/2). IF
        THE POSITIVE CONTROL DOES NOT FIRE, THE INSTRUMENT IS BROKEN AND NO
        NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.

