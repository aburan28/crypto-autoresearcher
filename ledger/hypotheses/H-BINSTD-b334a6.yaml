  statement: >-
    CLAIM (heuristic_validation / encoding-structure instrument; NO ATTACK;
    NO EXPONENT). Successor after EV-BINSTD-53bc6d (O-INCONCLUSIVE on
    EXP-BINSTD-6fd454 seed 202610039715: n17_l4 distinct_rTr=2) and
    unreplicated parent EV-BINSTD-d3a6be. Using NEW diversity catalog seed
    202610034821 ∉ {202610038196, 202610038782, 202610039715} and Twin-B
    meters under EXP-BINSTD-dbca92, FORALL Stage-1 cells (n,ℓ)∈{(17,3),(17,4)}:
    (i) ADMISSION — twin meters agree and catalog yields ≥3 distinct r_Tr and
    ≥2 distinct N_nl; (ii) only after (i), Spearman's ρ(r_Tr, N_nl) ≤ −0.70
    (O-SUPPORT) OR fails the band (O-FAIL-BAND). If (i) fails → O-INCONCLUSIVE
    (then consider ℓ-scoped HEUR). NO break. NO n≥131 transfer. Do NOT re-run
    EXP-BINSTD-871156. Do NOT expand Stage-2. Do NOT promote KN-FIND.

  mechanism: >-
    Same OBJECT FRAME and encoder pin as H-BINSTD-c16539 / H-BINSTD-6d5b4a /
    IDEA-20261003-4f41d0. WHAT IS NEW: (1) third catalog seed 202610034821;
    (2) forbidden-seed gate covers parent 202610038196, v1 202610038782, and
    6fd454 replication 202610039715; (3) explicit (17,4) floor-recovery
    target after EV-BINSTD-53bc6d. Admission floors and Spearman ≤−0.70 band
    unchanged. Twin-B meters reused under a new EXP directory.

  predictions:
