  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; admission floors met on every Stage-1 cell; ρ(r_Tr, N_nl)
        ≤ −0.70 on every Stage-1 cell under the third seed / Twin-B meters.
        No attack claim.
    - id: O-FAIL-BAND
