        Twin OK; floors met; ρ > −0.70 on at least one Stage-1 cell.
    - id: O-INCONCLUSIVE
      meaning: >-
        Catalog collapses below distinct_rTr≥3 or distinct_Nnl≥2 on a
        completed cell after diversity-seeking freeze (max ≤128). Then
        consider ℓ-scoped HEUR (not support).
    - id: O-ARTIFACT
      meaning: >-
        Twin disagreement, freeze/regression failure, or forbidden prior
        seed reuse. No band claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-BINSTD-b334a6 / H-BINSTD-c16539 / H-BINSTD-6d5b4a.

