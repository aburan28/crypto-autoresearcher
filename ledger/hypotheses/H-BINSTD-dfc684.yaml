# =============================================================================
# H-BINSTD-dfc684 -- HOLD-X1 optional sub-arm / HOLD-T supersession:
# Frobenius divisor cancels on the orbit system; m=4 curve-shape null at
# n=31 on a Frobenius-stable base. Specified from IDEA-20261001-e740ce under
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Approved DEC-20261002-e6818c.
#
# Portfolio: DEC-20260929-7257b2 ranks e740ce as optional sub-arm of HOLD-X1
# (IDEA-20260926-4b65e3 Stages 1-2 / EXP-CERTBIN-fad576 designed separately on
# PR #1571 without folding this cell). Opens as its own BINSTD contract:
# stable-base m=4 CNF-XOR leaf-count null, disjoint from HOLD-X1's non-stable
# window / closure-oracle cells. ZERO RUNS in this design packet. No AUXIN.
# No Bedrock. Claim tier: measurement / toy. No attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-dfc684
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-e740ce
  supersedes_idea: IDEA-20260922-493606
  experiment_id: EXP-BINSTD-b94ec8
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-e6818c
  status: approved
  proposed_by: coordinator
  title: >-
    At n=31, m=4, l in {5,6} on a Frobenius-stable V the Koblitz/ordinary
    median UNSAT leaf-count ratio lies in [0.8, 1.25] (curve-shape null);
    the withdrawn per-instance divisor 1/31 is false; search-space size
    equals |V^m/S_m| on every curve shape

  statement: >-
    CLAIM (measurement / toy; HOLD-X1 optional sub-arm; HOLD-T supersession;
    NO ATTACK). Setting: binary curves over F_{2^31}; Koblitz toys (a in F_2)
    and one ordinary null (b not in F_2); V a Frobenius-stable F_2-subspace of
    dimension l in {5,6} (the only m=4-admissible stable cells among
    n in {17,23,31,41}); m=4; CNF-XOR descent of S_{m+1} with S_m
    lexicographic breaking (WDSat). (A) COUNTING IDENTITY (exact). On the
    orbit system Omega = (V^m/S_m) x Z/n the free C_n action cancels the
    per-instance Frobenius divisor n exactly; gauge j=0 leaves |V^m/S_m|
    points — the single-instance search. Hence |G|=m! on every curve shape;
    493606's Koblitz arm (priced with mu=n) and pseudorandom arm are predicted
    EQUAL at the latter. Ceiling: IDEA-20260926-9c5694 Proposition Sigma
    (per-instance stabiliser S_m), cited. (B) ADMISSIBILITY (exact arithmetic).
    The only m=4 cells with a nontrivial stable V among the R4-c degrees are
    (n,l) in {(31,5),(31,6)}; search sizes 2^{20}/24 and 2^{24}/24. (C) SHAPE
    NULL (heuristic H1). Median per-target UNSAT leaf count, Koblitz over
    ordinary, same V, same solver, ratio in [0.8, 1.25] at both l; withdrawn
    prediction was ~0.032. Polynomial-window bases of the same dimension are
    the base-shape control. (D) BEARING. At ECC2K-130 an m=4 CNF-XOR attempt
    at balanced l sits ~2^{116} above D3=2^{11.01}; no outcome here is a
    speedup, exponent move, or deployed-curve verdict. CLAIM TIER: measurement
    / toy. NO Magma/Sage/AUXIN. Missing WDSat build → O-IMPEDIMENT, never
    evidence.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinates; CNF-XOR descent of
    S_{m+1}). Operation set Sigma_op = <sigma> on the orbit system Omega, not
    on one instance. Trichotomy: partial-action (index calculus). LOSSY-
    PROJECTION TEST against Sigma_op: Omega -> Omega/C_n is lossy (n to 1)
    and deterministic, but Omega/C_n bijects with the single-instance space,
    so as a cost object it is a change of coordinates — the algebraic content
    of (A), zero compute. Measurement (C) tests whether a real solver's leaf
    count depends on the curve when the search space does not. IDEA-20260904-
    3c7a91 consequence B2 (curve independence) predicts it does not; status
    proposed, read as prediction not validated law.

  assumptions:
    - >-
      Primary field n=31 with a fixed irreducible verified at setup; Phi_31
      factors into six quintics over F_2; V5 = ker g(sigma) for one quintic g;
      V6 = F_2 + V5. Koblitz toys a=1 (#E=2*1073696471) and a=0
      (#E=4*536893589; worksheet AC-9; primality of cofactors not load-bearing
      for the structure). Ordinary null: b not in F_2, same admission rule.
      G = largest prime-order subgroup with r not dividing #E(F_2).
    - >-
      SOLVER: WDSat (vendored per DEC-20260924-99ce20 HOLD-A). A missing build
      is an impediment (O-IMPEDIMENT), never evidence against H1 or (A).
    - >-
      OFF-LIMITS: F2 (decomposition) as the family and F6 (endomorphism orbit)
      as the named operation set only. No new factor base. No run at n>=131;
      deployed rows enter only as claim-(D) arithmetic.
    - >-
      HOLD-X1 (IDEA-20260926-4b65e3 / EXP-CERTBIN-fad576) plans m=4 cells on
      NON-stable windows with a closure oracle; this cell is stable-base +
      CNF-XOR leaf count — disjoint. Riding as a sub-arm was optional; this
      contract opens the cell standalone under standing authorization.

  heuristics:
    - id: H1
      statement: >-
        CURVE-SHAPE INDEPENDENCE AT m=4. For a complete CNF-XOR search with
        S_m lexicographic breaking at n=31, m=4, l in {5,6}, the median
        per-target UNSAT leaf count on a Koblitz toy and on an ordinary curve,
        at the same V, agree within a factor 1.25.
      rigorous_support: >-
        RIGOROUS: counting identity (A) — equal search-space size; no
        per-instance Frobenius divisor (Proposition Sigma). HEURISTIC: unit
        propagation prunes no differently on the two curves (imitates
        IDEA-20260904-3c7a91 B2).
      falsification_condition: >-
        Replicated Koblitz/ordinary median ratio outside [0.8, 1.25] on both
        Koblitz curves and not reproduced by the window control; OR ratio
        below 0.1 (near 1/31) on the Koblitz stable arm.
      validation_plan: >-
        SAMPLE 50 UNSAT targets per arm, two Koblitz + one ordinary, two
        bases (stable, window) and two l. COMPARE median ratios against
        [0.8, 1.25] with bootstrap intervals. TAIL: per-target maxima.
        TRANSFER: none beyond the cell.

  heuristic_note: >-
    Counting identity and admissibility screen are exact. H1 is the only
    heuristic; expected outcome is the null. A replicated ratio near 1/31
    would mean a per-instance divisor exists after all (headline).

  predictions:
    - metric: koblitz_over_ordinary_median_leaf_ratio at n=31, m=4, l=5 and l=6, stable V
      direction: same
      minimum_effect: >-
        Within [0.8, 1.25] at both l. Withdrawn 493606 prediction ~0.032.
        Replicated ratio <0.5 not reproduced by window control → curve-shape
        effect → review-adversarial before interpretation.
    - metric: measured_median_leaf_over_search_size at each arm
      direction: report
      minimum_effect: >-
        Reported against 2^{ml}/m! (43690.7 at l=5; 699050.7 at l=6) and
        multiset counts (52360; 766480); no band imposed by this contract.
    - metric: window_over_stable_median_leaf_ratio on the Koblitz curve, same l
      direction: same
      minimum_effect: Within [0.8, 1.25].
    - metric: certificate_pass_rate on planted SAT targets, every arm
      direction: exact
      minimum_effect: EXACTLY 1.0. Any failure voids the run before any count.
    - metric: admissible_stable_m4_cells at n in {17,23,31,41} (Stage 0, zero compute)
      direction: exact
      minimum_effect: EXACTLY {(31,5),(31,6)}.

  test_boundary: >-
    Toy n=31, m=4, l in {5,6}, one field, one solver (WDSat), stable and
    window bases, two Koblitz + one ordinary curve. Nothing transfers to
    m>=5, other n, deployed curves, or any IC-vs-rho claim. Stage 0 is zero
    compute (identity + screen + claim-(D) arithmetic). Stage 2 is the
    measurement. Narrows IDEA-20260807-32f96d's "zero measured m>=4 cells"
    gap by one binary cell on one solver; does not address arity crossover.

  falsification_criteria:
    - >-
      Koblitz/ordinary median ratio outside [0.8, 1.25], replicated on both
      Koblitz curves and not reproduced by the window control: shape null
      false at this cell; route to review-adversarial.
    - >-
      Ratio near 1/31 (<0.1) on the Koblitz stable arm: per-instance
      Frobenius divisor exists, contradicting (A)/Proposition Sigma; headline,
      replicate.
    - >-
      Any planted certificate failing, or fixture E0 failing: soundness /
      instrument defect; run void; no evidence either way.
    - >-
      An admissible stable m=4 pair other than (31,5) and (31,6) found by
      independent arithmetic: screen wrong; (B) restated.

  distinguishable_outcomes:
    - id: O-NULL
      label: shape_null_confirmed
      when: >-
        Ratios at both l in [0.8, 1.25]; window control agrees; certificates
        pass; Stage-0 screen = {(31,5),(31,6)}.
    - id: O-DIVISOR
      label: per_instance_divisor_survives
      when: Replicated Koblitz/ordinary ratio <0.1 on stable arm.
    - id: O-SHAPE
      label: curve_shape_effect_not_divisor
      when: >-
        Ratio outside [0.8, 1.25] but not near 1/31, replicated, not
        reproduced by window control.
    - id: O-ARTIFACT
      label: instrument_or_soundness_defect
      when: Fixture E0 fail, planted certificate fail, or export-structure mismatch.
    - id: O-IMPEDIMENT
      label: infrastructure_stop
      when: >-
        WDSat missing/unbuildable, timeout, OOM, or other infrastructure
        failure. Never negative mathematical evidence (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      Whether the curve's Frobenius structure changes the cost of one m=4
      decomposition attempt at all, once the per-instance divisor is gone.
    baseline_embedding:
      parameter_slice: >-
        Ordinary-curve arm at the same (n, V, m, l) is the baseline. Under
        the counting identity it and the Koblitz arm have the same search
        space. Gauge j=0 slice = single-instance search exactly.
      reproduction_check: >-
        Frozen fixture E0. (i) CNF-XOR exports of Koblitz and ordinary at
        same (V,m,l) have identical variable counts and block structure.
        (ii) 20 planted SAT targets per arm, each certified by group
        arithmetic. (iii) Search-size 2^{ml}/m! (and multiset form) printed
        beside measured median before any ratio is read.
    observation_collision:
      observable: Median per-target UNSAT leaf count, Koblitz over ordinary.
      distinct_preimage_search: >-
        A ratio below the band could come from (i) a Frobenius-dependent
        solver effect (live reading); (ii) descended-system sparsity
        difference (separated by clause/XOR-row counts); (iii) different
        abscissa density of V (separated by |F_V| and the window base).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Orbit-system gauge quotient as the single-instance search (A).
        predicted_gain: None; the n cancels. That is the content.
      - transform: observable_fiber
        proposed_object: Fix (V,m,l); vary only curve shape and base shape.
        predicted_gain: Separates curve effects from search-space size.
    quantifier_order: >-
      Counting identity: FOR ALL Koblitz toys, FOR ALL stable V, FOR ALL m,
      gauge-fixed orbit search = |V^m/S_m|. Exact. Admissibility: FOR the
      four degrees and m=4, EXISTS stable V with 4(l-1)<=n and l>=2 IFF
      n=31 and l in {5,6}. Exact. Shape null: FOR the tested cells and named
      solver, ratio in the band. Heuristic.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At n=31, m=4, l in {5,6} on a stable V, the complete CNF-XOR
        search's median UNSAT leaf count is [measured] on the Koblitz toy
        and [measured] on the ordinary curve, ratio [measured], against
        search size 2^{ml}/m!." Certifies nothing about m>=5, cost per
        relation, any deployed curve, or the 32f96d crossover.
      nearby_object_control: >-
        Ordinary curve at identical (n,V,m,l) (blocking); polynomial-window
        base (no stable structure). Both must agree with the Koblitz stable
        arm within the band for the null to be read.
    proof_obligations:
      - claim: Counting identity (A) (free C_n on Omega; gauge j=0).
        responsibility: correctness
      - claim: m=4 admissibility screen at n in {17,23,31,41}.
        responsibility: correctness
      - claim: ord_37(2)=36 and ord_29(2)=28 (493606 degrees host no nontrivial stable subspace).
        responsibility: correctness
      - claim: Claim-(D) arithmetic uses D3 never D1 and CORR-20260922-81aeab rho.
        responsibility: interface
      - claim: Every SAT answer certified by group arithmetic; every UNSAT count with termination reason.
        responsibility: correctness
      - claim: No sentence states a speedup, exponent move, affordability advantage, or closure.
        responsibility: scope
    not_applicable_reason: null

  confounders:
    - Abscissa density |F_V| may differ between curves; reported per arm.
    - Descended-system sparsity differs between a,b in F_2 and generic b; clause/XOR-row counts reported.
    - Solver and branching order dominate absolute counts; ratios on the same solver/order are the read quantity.
    - Below-cap cells: at l=5 nearly every target is UNSAT; planted targets carry the SAT side.
    - Memory abort / timeout is infrastructure (rule 5), never evidence about the null.

  interpretation_limits:
    - Toy tier at n=31, m=4, l in {5,6}. Nothing transfers to m>=5, other n, or deployed curves.
    - Narrows IDEA-20260807-32f96d by one binary cell on one solver; crossover untouched.
    - Not a competitiveness claim; claim-(D) places a deployed m=4 attempt ~2^116 above D3.
    - Approval does not assert the hypothesis is true.

  claim_tier: measurement
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
