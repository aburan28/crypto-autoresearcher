      balance would overstate the package and is prohibited here in advance.
    - >-
      THE MARGIN IS NOT COMFORTABLE. gamma/gamma_crit is between 0.55 and 0.69,
      so a factor 1.45 to 1.81 error in gamma flips the verdict. Any citation
      of the negative must carry that number, and a citation that presents the
