    - H-ECDLP-a3598b
    - H-ECDLP-77caa5
    - H-ECDLP-07c7c6
    - H-ECDLP-2ade73
  statement: >
    Fix a characteristic-zero field K and a smooth proper
    connected elliptic curve E/K given by a short Weierstrass
    model y^2 = x^3 + A x + B with nonzero discriminant.
    Let D = {P, Q} be two distinct K-rational points of E.
    Write H1_rel for algebraic de Rham H^1(E, D), H1_ord for
    ordinary H^1_dR(E), and K_forget for the kernel of the
    forgetful map H1_rel -> H1_ord. Stage 0 asserts only the
    rank-only prediction of IDEA-20260905-8829cc: the
    dimension triple (dim H1_rel, dim H1_ord, dim K_forget)
    equals (3, 2, 1) and is unchanged by replacing D with
    another distinct K-rational pair or by an admissible
    short-Weierstrass unit scaling of the model. A later
    unauthorized stage may attach a compatible marked
    Frobenius. Neither reading is a Kedlaya point-count,
    a canonical curve lift, a scalar coordinate, or an
    ECDLP advantage.
  mechanism: >
    The long exact sequence of the pair (E, D) with
    H^1_dR(D) = 0 for a reduced 0-dimensional scheme of
    two points, H^0_dR(E) = K, and H^0_dR(D) = K^2, has
    restriction the diagonal embedding. The degree-1
    cohomology of the cone of Omega_E -> Omega_D is then
    coker(restriction) direct-sum H^1_dR(E), of dimensions
    1 + 2. The forgetful map is projection to the second
    summand, with 1-dimensional kernel. Stage 0 evaluates
    that cone formula on one frozen toy Weierstrass curve
    over Q with two frozen marked pairs and one frozen
    unit scaling. This is the remaining open sibling of
    the BATCH-33cdc3 lifting-audit trio after
    IDEA-20260905-4dca34 (EXP-ECDLP-6a97f4) and
    IDEA-20260905-3e9133 (EXP-ECDLP-a5f766, other lane).
    It is not Stage 2 of EXP-ECDLP-6a97f4 and not Stage 17
    of EXP-ECDLP-420e73.
  predictions:
    - id: P-S0-DIMTRIPLE
      metric: dimension triple (dim H1_rel, dim H1_ord, dim ker)
      direction: lower
      minimum_effect: >
        Predicted exact triple (3, 2, 1) on every frozen
        admissible marked pair and on the frozen unit
        scaling of the first pair. One certified mismatch
        after fixture_pass is a scoped falsification of
        this rank-only claim on the frozen curve.
      claim_tier: observational
    - id: P-S0-MARKCOLLISION
      metric: difference of the dimension triple across two frozen distinct pairs
      direction: lower
      minimum_effect: >
        Predicted exact zero. The rank summary collides
        for all distinct rational marks on this curve.
      claim_tier: observational
    - id: P-S1-FROBENIUS
      metric: marked Frobenius characteristic polynomial versus unmarked baseline
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0 does not
        construct a Frobenius operator on the marked
        object. Relative de Rham rank is not a Frobenius.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-DIMTRIPLE
      statement: >
        After fixture_pass, a frozen admissible pair has
        dimension triple other than (3, 2, 1). If the
        mismatch is a smoothness, distinctness, or cone
        encoding bug, classify failed_infrastructure.
    - id: F-S0-MARKDEPENDENCE
      statement: >
        After fixture_pass, the two frozen distinct pairs
        produce different dimension triples. That falsifies
        only P-S0-MARKCOLLISION on this curve.
    - id: F-S1-UNMARKED-LEAK
      statement: >
        After an authorized later stage, a claimed
        mark-sensitive invariant factors completely
        through unmarked H^1_dR(E). Unauthorized here.
  test_boundary:
    instances:
      - frozen Stage 0 one-curve panel over Q, A=1, B=1
    parameters:
      char: 0
      n_pairs: 2
      n_scalings: 1
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-4be480 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is a rank-only cone audit of
      relative versus ordinary de Rham on one Weierstrass
      curve over Q. It is not a Kedlaya algorithm, not a
      Serre-Tate lift, not a marked Frobenius, not
      P-S1-DIGIT, not Stage 2 of EXP-ECDLP-6a97f4, and
      not Stage 17 of EXP-ECDLP-420e73. No cryptographic
      transfer. Stage 5 of EXP-ECDLP-a98ea9 is not
      authorized. H-ECDLP-e9d9bb, H-ECDLP-77caa5,
      H-ECDLP-07c7c6, H-ECDLP-2ade73, and H-ECDLP-a3598b
      remain at their recorded statuses. W is not
      classified. EXP-ECDLP-a5f766 remains another lane.
  assumptions:
    - id: A1
      statement: >
        Algebraic de Rham of a reduced 0-dimensional
        scheme of two K-points has H^0 = K^2 and
        H^{>0} = 0. This is the Stage 0 working model
        of H^*(D). It is not a crystalline or rigid
        cohomology comparison.
      status: explicit
    - id: A2
      statement: >
        Ordinary H^1_dR(E) is spanned by dx/y and
        x dx/y on a smooth short Weierstrass model.
        Linear independence is the 2-by-2 coefficient
        identity in that basis.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06 covers
        protocol approval once the contract is complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Locate exactly where marked data enters the
      relative object and where the rank summary
      forgets it.
    baseline_embedding:
      parameter_slice: >
        One smooth proper elliptic curve over Q, two
        distinct rational marks, no Frobenius.
      reproduction_check: >
        Recover dim H^1_dR(E) = 2 independent of the
        marks, then assemble the cone of Omega_E ->
        Omega_D and read the dimension triple.
    observation_collision:
      observable: >
        The dimension triple (dim H1_rel, dim H1_ord,
        dim ker of the forgetful map), predicted (3, 2, 1).
      distinct_preimage_search: >
        Two distinct marked pairs must give the same
        triple. The unmarked H^1 must coincide for both
        pairs. A later Frobenius is a different object.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >
          Forgetful-map diagram of marked versus
          unmarked de Rham in degree 1.
        predicted_gain: >
          Exact classification of retained rank
          information. Zero claimed solver improvement.
    quantifier_order: >
      Freeze K, E, the two marked pairs, the scaling,
      and the cone formula before reading ranks.
      Existential nonconstancy of a later invariant
      does not imply injectivity or scalar decoding.
    method_ceiling:
      strongest_certifiable_claim: >
        The dimension triple equals (3, 2, 1) on the
        frozen curve and pairs, and collides across
        those pairs. Never a Frobenius. Never an
        ECDLP exponent.
      nearby_object_control: >
        Unmarked H^1_dR(E) on the same curve with
        different marks must coincide. An argument
        extracting distinct marked information from
        that unchanged object proves too much.
        Repeated marks (P = Q) are rejected before
        any rank is read.
    proof_obligations:
      - claim: smoothness, connectedness, and distinct rational marks on the frozen curve
        responsibility: baseline
      - claim: dim H^1_dR(E) = 2 via the Weierstrass basis
        responsibility: baseline
      - claim: cone formula yields (3, 2, 1)
        responsibility: correctness
      - claim: unmarked baseline independent of the marks
        responsibility: baseline
      - claim: no Frobenius, no Kedlaya, no Stage 2 of 6a97f4, no Stage 17 of 420e73
        responsibility: interface
    not_applicable_reason: null
