  title: >
    Relative de Rham H^1 of a smooth proper elliptic curve
    with two distinct rational marks has dimension triple
    (3, 2, 1) independent of the marks; Frobenius on a
    marked object is a later unauthorized stage
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260908-3b8d07
  specified_by: DEC-20260908-18ecbd
  specified_at: '2026-09-08'
  created: '2026-09-08'
  updated: '2026-09-08'
  depends_on:
    - IDEA-20260905-8829cc
    - DEC-20260908-4572c5
    - IDEA-20260905-4dca34
    - IDEA-20260905-3e9133
  related_hypotheses:
