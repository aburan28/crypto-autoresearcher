  falsification_conditions:
    - >-
      F1 (MILLISECONDS, THE PRIMARY FALSIFIER). C1 fails on a table that survived
      its own two-pass transcription diff. Everything downstream is void for that
      parameter set; report a transcription or document defect and STOP. This is the
      cheapest possible termination of the whole line and it is ordered first for
      that reason.
    - >-
      F2. The Rademacher null does not return the binomial tail exactly. Hard
      pipeline failure; halt and report nothing about FrodoKEM.
    - >-
      F3. The mutation response falls outside [-0.33, -0.08] bits. The control has
      failed; no reproduction and no discrepancy may be reported. Distinguish
      HEUR-FD-2 failure from pipeline failure by the graded ladder's linearity.
    - >-
      F4. The nearby-object control (G8) returns a result within 5 bits of chi's.
      The pipeline responds to variance rather than to the tail, and G7's bracket
      and the sensitivity derivation are suspect.
    - >-
      F5. The enclosure fails to contain the fully exact answer at any ladder rung.
      HEUR-FD-3 refuted; halt Stage 5 and report no enclosure-based number.
    - >-
      F6. The exactly computed log2 DFR falls below the Gaussian bracket. Parameters
      or pipeline wrong; re-read rather than report.
    - >-
      F7 (NOT A FALSIFICATION, PRE-REGISTERED). If a "discrepancy" of about 6 bits
      appears, the FIRST reading is the per-coordinate versus per-key convention and
      only the SECOND is an error in the document. That order is fixed here and may
      not be reversed after the fact.
    - >-
      F8 (THE PLANNED NEGATIVE). If the enclosure at the true dimensions cannot be
      driven below 2 bits within budget, the batch must still emit the table gate
      results, the mutation and graded control results, the reduced-dimension ladder,
      and the enclosure achieved, with the budget outcome stated as a budget outcome.
      A run that stops without emitting those HAS NOT FINISHED. The negative
      disposition is a deliverable.

  interpretation_limits:
    - >-
      SPLIT CLAIM TIER. CRYPTO is available ONLY for the arithmetic assertion that a
      certified enclosure does or does not contain a printed figure at the
      standardised parameters. EVERY security reading is capped at TOY by
      RQ-FRODO-3260cc.scope.claim_tier_ceiling, and a record that reports both at one
      tier has failed regardless of what it computed.
    - >-
      A DISCREPANCY IS NOT AN ATTACK, NOT A BREAK, AND NOT A STATEMENT ABOUT
      DEPLOYED FRODOKEM, until it is costed with a charged attacker cost and
      independently reviewed (RQ-FRODO-3260cc.constraints). No record from this
      hypothesis may use the words break, attack, or vulnerable.
    - >-
      A REPRODUCTION VERIFIES AN ARITHMETIC ASSERTION AND NOTHING ELSE. It does not
      verify the parameter choice, the IND-CCA argument, the FO transform, the
      designers' method, or LWE hardness.
    - >-
      THE MUTATION CONTROL LICENSES THE COMPARISON; IT DOES NOT STRENGTHEN IT. A
      pipeline that detects a 0.167-bit perturbation has shown it detects
      perturbations of about that size and nothing smaller. The detection floor is a
      reported metric and every citation must carry it.
    - >-
      IMPLEMENTATION-SIDE FRODOKEM RESULTS (KN-LIT-2088, KN-LIT-3859, KN-LIT-118,
      KN-TECH-047) ARE OUT OF SCOPE and may not be scored as evidence about this
      hypothesis in either direction (AGENTS.md rule 7).
    - >-
      TIMEOUTS, MISSING PACKAGES, AND MEMORY EXHAUSTION IN STAGE 5 ARE
      INFRASTRUCTURE SIGNAL. They are never evidence about the failure rate
      (AGENTS.md rule 5), and GOAL-FRODO-001.pause_conditions says so in its own
      words.

