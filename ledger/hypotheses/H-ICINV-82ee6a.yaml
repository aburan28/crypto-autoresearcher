  test_boundary:
    instances:
      - >-
        Ordinary short-Weierstrass curves y^2 = x^3 + a x + b over F_p for the
        seven primes of the frozen ladder rule (largest prime strictly below 2^k,
        k in {12, 14, 16, 18, 20, 22, 24}), sampled by a seeded deterministic
        stream, with singular and supersingular (t = 0) instances rejected.
      - >-
