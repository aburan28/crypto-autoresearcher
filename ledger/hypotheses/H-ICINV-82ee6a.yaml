      harness/toycurve.py and harness/runner.py are imported unmodified.
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 6
      maximum_memory_gb: 4
      maximum_runs: 12
      dominant_cost: >-
        Group-order determination by baby-step/giant-step (O(p^{1/4}) group
        operations per curve, ~2^6 at p ~ 2^24) and exact factorisation of d ~ p by
        trial division to 2^12, per sampled curve. Both are cheap and neither is an
        algorithm at any scale; the ladder stops at 2^24 because exact factorisation
        of d is what makes m exact.

