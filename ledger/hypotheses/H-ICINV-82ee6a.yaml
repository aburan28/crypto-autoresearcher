  proof_search_map:
    bottleneck: >-
      THE EXACT FIELD OVER WHICH THE SQUARE-ROOT VELU OPERATION COUNT IS STATED.
      Everything in mechanism STEP 3 is elementary once that is fixed and nothing
      in it is defensible until it is. This is a LITERATURE question, not a compute
      question, it is the cheapest discriminator in the record, and it can invert
      the record's conclusion. It is STAGE 0 and it gates every other stage.
    baseline_embedding:
      parameter_slice: >-
        ell small and prime, ell-torsion eigenspace F_p-rational, m = 1. In that
        slice the corrected accounting Otilde(sqrt(d) * m) must degenerate EXACTLY
        to Otilde(sqrt ell) field operations, reproducing the corpus's existing
        per-step charge for one class-group action step.
      reproduction_check: >-
        FROZEN FIXTURE AND A GATE. Three toy curves and three small ell with
        F_p-rational eigenspaces, declared in EXP-ICINV-fcb497 by a frozen
        selection rule. The m = 1 determination must be produced by the SAME code
        path that computes m in STAGE 3 -- not by a special case -- and the
        corrected accounting must reduce to the classical Velu operation count
        within the stated constant. If the formula does not degenerate at m = 1 the
        formula is wrong and STAGE 3's numbers are uninterpretable.
    observation_collision:
      observable: >-
        The pair (d, m): endomorphism degree and kernel-generator field extension
        degree.
      distinct_preimage_search: >-
        REQUIRED, PERFORMED, AND EXPECTED TO SUCCEED -- WHICH IS WHY NO
        IDENTIFIABILITY IS CLAIMED. (d, m) is a pair of integers and its fibre is
        large: curves over different primes with different traces can share it
        exactly. EXP-ICINV-fcb497 reports the observed collision multiset as a
        required artifact. The record claims only a COST bound, a forward-direction
        statement unaffected by collisions. ANY DOWNSTREAM USE OF (d, m) AS AN
        IDENTIFYING INVARIANT IS FORBIDDEN BY THIS HYPOTHESIS and would be
        falsified by the collision table it produces.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "degree d", which is what the corpus's cost charges track, by the
          Galois module (Z/d, multiplication by lambda). The retained extra state
          (lambda) is exactly what survives composition by CRT and exactly what
          decides the cost.
        predicted_gain: >-
          NOT A SPEEDUP. The gain is decidability: the corrected cost becomes a
          computable function of the retained state, so every row of the STAGE-1
          barrier table has a well-defined right answer instead of a judgement.
      - transform: representation_reduction
        proposed_object: >-
          Restate "is this isogeny cheaply evaluable" as the exact arithmetic
          condition ord_d(lambda) small, moving the question out of an
          implementation model and into a multiplicative-order computation.
        predicted_gain: >-
          Converts an unfalsifiable cost-model worry into a toy-scale measurement
          with a matched null and a planted positive control. That conversion is
          the deliverable.
    quantifier_order: >-
      CLAIMED (theorem, no algorithmic quantifier): FORALL ordinary E/F_p, FORALL
      primitive non-scalar alpha = u + v pi in Z[pi] with gcd(v, deg alpha) = 1,
      THERE EXISTS a unique lambda in (Z/d)^* such that pi acts on ker alpha as
      multiplication by lambda, and the field of definition of a generator of
      ker alpha is EXACTLY F_{p^m}, m = ord_d(lambda).
      PREDICTED, NOT CLAIMED (H1): FORALL epsilon > 0, for ALL BUT A DENSITY-ZERO
      SET of such (E, alpha), m > d^{1-epsilon}. This carries an existential over
      exceptional sets and is what the measurement tests, at toy scale, against a
      matched empirical null.
      NOT CLAIMED: that no ordinary curve has a small-m minimal endomorphism. Such
      curves may exist; finding one is a VALUABLE OUTCOME of this experiment, is
      pre-registered as such, and would still not be an attack because mechanism
      STEP 4 still bites.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the STAGE-0-resolved external assumption about where the square-root
        Velu operation count is stated, no exponent currently recorded in this
        ledger changes when isogeny-evaluation costs are recomputed, and on the
        measured toy ladder the minimal non-scalar endomorphism of a generic
        ordinary E/F_p is NOT evaluable in Otilde(sqrt p) F_p-operations." It can
        NEVER certify that the ECDLP is hard, that no other isogeny-evaluation
        technique exists, anything about crypto-scale p, or anything about
        supersingular curves.
      nearby_object_control: >-
        THE SMALL-ell RATIONAL-EIGENSPACE ISOGENY, where the desired conclusion
        ("square-root Velu does not help") MUST FAIL, because there it genuinely
        helps by a square root of a polylog quantity. This is the object the
        argument must NOT kill. It is instantiated as the frozen m = 1 fixture in
        baseline_embedding and as heuristic H2; an argument that also kills it is
        proving too much.
    proof_obligations:
      - claim: min over v != 0 of N(u + v pi) equals |D|/4 up to rounding (T3).
        responsibility: size
      - claim: >-
          pi acts on ker alpha as the scalar lambda = -u v^{-1} mod d when
          gcd(v, d) = 1, and ker alpha is cyclic of order d (T1).
        responsibility: correctness
      - claim: >-
          A generator of ker alpha is defined over F_{p^m}, m = ord_d(lambda), and
          over no proper subfield (T2).
        responsibility: correctness
      - claim: >-
          Square-root Velu costs Otilde(sqrt d) operations in the kernel-generator
          field.
        responsibility: interface
      - claim: >-
          The corrected accounting degenerates to Otilde(sqrt ell) at m = 1, so it
          does not kill the nearby object.
        responsibility: baseline
      - claim: >-
          alpha acts on the prime-order subgroup as the scalar u + v mod N, so no
          cost verdict here is an ECDLP statement.
        responsibility: scope
      - claim: >-
          The planted family d = r^2 - 1, lambda = r is detected with m = 2 exactly.
        responsibility: soundness
      - claim: >-
          Every measurement is toy scale because computing m requires factoring
          d ~ p, and no crypto-scale statement follows.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  rerandomization_note: >-
    No worst-to-average-case device is used or needed. Curves are sampled directly
    and every measured quantity is computed exactly on the sampled instance; there
    is nothing to re-randomise and no reduction to pull back.

  asymptotic_claim:
    problem: >-
      Evaluation of a degree-d endomorphism / isogeny of an ordinary E/F_p,
      measured in F_p-operations. NOT the ECDLP.
    prior_best: >-
      Otilde(d) F_p-operations by classical Velu, which is what this corpus
      currently charges; an erroneous application of square-root Velu would suggest
      Otilde(sqrt d).
    time_exponent: >-
      Otilde(sqrt(d) * m). For the minimal non-scalar endomorphism, d = Theta(p)
      and m ~ d under H1, giving Otilde(p^{3/2}) -- AN UPWARD CORRECTION, worse
      than the Otilde(p) already charged. In the applicable small-ell regime
      (H2, m <= 2) it is Otilde(sqrt ell) with ell = polylog(p).
    memory_exponent: >-
      The baby-step/giant-step table is Otilde(sqrt d) elements of the
      kernel-generator field, i.e. Otilde(sqrt(d) * m) F_p-elements:
      Otilde(p^{3/2}) in the generic endomorphism case and Otilde(sqrt ell) in the
      applicable case. STATED BESIDE TIME because a square-root-time algorithm with
      square-root memory must never be quoted as if memory were free.
    hidden_cofactor: >-
      Two items, disclosed rather than buried. (i) The Otilde in Otilde(sqrt d)
      hides the polylogarithmic cost of the resultant/remainder-tree machinery,
      which is a large constant in practice. (ii) COMPUTING m AT ALL REQUIRES
      FACTORING d ~ p, which is subexponential, not polynomial. That cost is paid
      only by this AUDIT and never by an attacker, but it is what caps every
      measurement at toy scale and is why no crypto-scale statement is made.
    claim_kind: cofactor_improvement
    claim_kind_note: >-
      RECORDED HONESTLY AND AGAINST THE RECORD'S OWN INTEREST. The only regime
      where square-root Velu applies to this corpus gains a polylog cofactor, which
      docs/target-result-profile.md classifies as explicitly NOT target-class. The
      record's own headline movement is an UPWARD cost correction, which is not an
      improvement of any kind. sota_delta against the ECDLP frontier is ZERO:
      0.886 sqrt(N) before and after (KN-TECH-001, KN-TECH-006, KN-TECH-018,
      KN-TECH-031).
    promotion_gate_status: >-
      THIS ASYMPTOTIC BLOCK MAY NOT MOVE THE HYPOTHESIS TOWARD `supported`. Of the
      four coordinator promotion gates it satisfies at most (1) partially -- the
      obligations are decomposed above but the main theorem's per-attempt-cost x
      inverse-success bookkeeping is not assembled, because no algorithm is
      proposed. Gate (2) is OPEN (H1's validation is this experiment, at toy scale
      only; the external distribution citations are unverified). Gate (3) is OPEN
      until the concrete-cost table of EXP-ICINV-fcb497 exists. Gate (4) is OPEN
      (no independent review, no red-team pass). The ceiling for this record on the
      strength of EXP-ICINV-fcb497 alone is `analyzed`.

  heuristic_assumptions:
    - id: HEUR-ORD-1
      formal_statement: >-
        For the minimal non-scalar alpha = u + v pi in Z[pi] of a uniformly sampled
        ordinary E/F_p with gcd(v, d) = 1, the scalar lambda = -u v^{-1} mod d
        behaves with respect to multiplicative order like a uniformly random
        element of (Z/d)^*. Formally: for every epsilon > 0 the density of
        instances with ord_d(lambda) <= d^{1-epsilon} tends to 0 as p -> infinity,
        uniformly for d in [p/4, 4p].
      random_model_justification: >-
        RIGOROUS SIDE: ord_d(lambda) always divides Carmichael's lambda-function of
        d, and for lambda != ±1 the relation d | lambda^m - 1 with lambda < d
        forces m >= log d / log lambda >= 2, which excludes only the trivial cases.
        No rigorous lower bound of the claimed strength is asserted.
        DISTRIBUTION SIDE: the classical theory of multiplicative orders of a fixed
        integer modulo varying n, under which a typical element's order exceeds
        n^{1/2+o(1)} for almost all n and n^{1-o(1)} outside a sparse set. THESE
        ATTRIBUTIONS (Erdos-Murty; Kurlberg-Pomerance) ARE CITED FROM BACKGROUND
        KNOWLEDGE AND ARE [unverified] IN THIS CAMPAIGN. Nothing operational
        depends on them: the experiment's comparison distribution is the MATCHED
        EMPIRICAL NULL of a uniformly random unit mod the SAME d, which is the
        correct comparison precisely because the true order distribution depends on
        the factorisation of d.
      supporting_results: []
      supporting_results_note: >-
        DELIBERATELY EMPTY. No external result is asserted as support because none
        has been read in this campaign. The divisibility bound above is elementary
        and is derived here.
      validation_experiment_ids: [EXP-ICINV-fcb497]
      falsification_condition: >-
        Median log m / log d below 0.5 at the largest measured prime AND not rising
        across the ladder; OR a KS-significant DEFICIT of log m / log d against the
        matched random-unit null on the same d, at the pre-registered level, at the
        two largest decades. Either falsifies HEUR-ORD-1 as stated and NAMES the
        family of small-m curves as a forward deliverable.
    - id: HEUR-M2-2
      formal_statement: >-
        Over this corpus's actual isogeny-evaluation regime -- an ideal of prime
        norm ell = polylog(p) with F_p-rational ell-torsion eigenspace, the
        CSIDH/Kohel-style class-group action step -- the kernel generator is defined
        over F_p or F_{p^2}; formally, m divides 2 for every class-group action
        step appearing in any ledger design of this campaign.
      random_model_justification: >-
        NO DISTRIBUTION MODEL IS NEEDED AND NONE IS OFFERED. This is structural: an
        ell-isogeny step in the Cl(O) action is defined by an eigenspace of pi on
        E[ell] whose eigenvalue is a root of X^2 - tX + p mod ell; when that root
        lies in F_ell and the eigenspace is F_p-rational, a generator is
        F_p-rational and m = 1 (m = 2 in the twisted case). It is a fact about how
        the action is implemented, not a genericity claim.
      supporting_results: []
      supporting_results_note: >-
        Derived here from the eigenvalue condition; no external citation asserted.
      validation_experiment_ids: [EXP-ICINV-fcb497]
      falsification_condition: >-
        Any class-group action step identified in the STAGE-1 audit, or measured in
        the STAGE-2 m = 1 fixture, with m > 2. That would mean a ledger design is
        evaluating a non-rational-kernel isogeny and its cost accounting is wrong --
        exactly the stale figure this audit hunts, and it would be escalated
        immediately rather than absorbed.
      validation_method_amended: >-
        AMENDED AWAY FROM THE PARENT PROPOSAL AND THE CHANGE IS DECLARED.
        IDEA-20260807-9fb27c's validation_plan for this heuristic says "instrument
        every class-group action step in the campaign's existing isogeny-walk code
        to assert m in {1,2} at runtime". THAT IS REFUSED HERE: it would edit
        harness modules that other committed runs and other campaigns depend on,
        which breaks reproducibility of already-archived runs for the convenience of
        this experiment. HEUR-M2-2 is instead validated by (a) a READ-ONLY static
        audit of every isogeny-step construction in harness/ and analysis/, recorded
        as rows of the STAGE-1 barrier table, and (b) the STAGE-2 m = 1 fixture in
        a NEW module. Coverage is consequently WEAKER than runtime instrumentation
        and that weakness is recorded rather than papered over.

  structural_ingredients:
    - description: >-
        Commutativity of End_{F_p}(E) for ordinary E, giving Galois-stability of
        ker alpha and F_p-rationality of the kernel polynomial.
      citation: >-
        Standard ordinary-CM theory (Deuring/Waterhouse); used qualitatively and
        re-derived in mechanism STEP 2. No specific external source is asserted as
        having been read in this campaign.
      role: rationality of the kernel SUBGROUP, which is what makes the
        irrationality of its POINTS the whole content of the record
    - description: >-
        The square-root Velu baby-step/giant-step evaluation of a cyclic-kernel
        degree-d isogeny in Otilde(sqrt d) field operations.
      citation: >-
        Attributed to Bernstein-De Feo-Leroux-Smith, "Faster computation of
        isogenies of large prime degree", ANTS XIV / eprint 2020/341.
        [unverified -- cited from background knowledge, not read in this campaign].
        Secondary corpus reference KN-LIT-780 (Adj-Chi-Dominguez, eprint 2020/1109)
        reports the same Otilde(sqrt ell) figure as "field operations" WITHOUT
        disambiguating the field, and its own body states its claims are relayed
        from the abstract without independent verification. STAGE 0 of
        EXP-ICINV-fcb497 resolves this against a hash-pinned retrieved artifact and
        NOTHING may be asserted about the operation count before it does.
      role: the load-bearing external interface; its resolution can invert this
        record
    - description: >-
        CRT propagation of the Galois module: for alpha = alpha_1 alpha_2 with
        coprime degrees, ker alpha = ker alpha_1 (+) ker alpha_2 as Galois modules,
        so m = lcm(m_1, m_2).
      citation: Elementary; derived here.
      role: makes the tracked object (d, lambda, m) compose, which is the
        concrete-testability axis of the lossy projection

  reduction_chain:
    core_problem: >-
      Determine the field of definition of a generator of the kernel of the minimal
      non-scalar endomorphism of an ordinary E/F_p, and thereby the correct
      F_p-operation cost of evaluating it; and audit every isogeny-evaluation cost
      recorded in this ledger against that corrected model.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no corollary about the ECDLP, no attack, no
      speedup, and none is claimed. The only permitted downstream consequences are
      (i) a Coordinator decision on any barrier-table row whose exponent changes and
      (ii) a Coordinator decision on the status of IDEA-20260807-9fb27c if STAGE 0
      returns BASE_FIELD.

