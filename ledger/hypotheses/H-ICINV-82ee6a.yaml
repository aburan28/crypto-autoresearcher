        IDEA-20260807-9fb27c. A BASE_FIELD verdict REFUTES the cost corollary CC,
        makes the Otilde(sqrt p) knife edge REAL, and requires
        IDEA-20260807-9fb27c to be SUPERSEDED. THAT OUTCOME IS A SUCCESS OF THE
        EXPERIMENT, NOT A FAILURE OF IT, and is pre-registered as a first-class
        branch with its own decision rule. An AMBIGUOUS verdict permits NO cost
        statement in either direction.
    - metric: >-
        P2 -- median of log m / log d per prime decade, m = ord_d(lambda) for the
