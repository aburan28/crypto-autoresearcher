        which is a pure integer construction and touches no curve.
      - >-
        The m = 1 baseline fixture: three toy curves and three small prime ell with
        F_p-rational ell-torsion eigenspaces, chosen by the frozen rule in
        EXP-ICINV-fcb497.
      - >-
        OUT OF SCOPE: supersingular curves; extension fields; any p >= 2^24; the
        full endomorphism ring O when the conductor exceeds 1 (see the declared
