hypothesis:
  id: H-ICINV-82ee6a
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  parent_idea_id: IDEA-20260807-9fb27c
  experiment_ids: [EXP-ICINV-fcb497]

  statement: >-
    SCOPE. Ordinary elliptic curves E/F_p over prime fields, p > 3, sampled at
    toy scale on a ladder of primes below 2^24; endomorphisms taken from the
    Frobenius order Z[pi] (see the DECLARED SCOPE NARROWING in `assumptions`);
    exact factorisation of the endomorphism degree d ~ p, which is what caps the
    ladder. CLAIM TIER toy. NO ATTACK, NO SPEEDUP, NO EXPONENT IMPROVEMENT
    CLAIMED; the only quantitative movement claimed is a cost accounting that
    moves UPWARD, i.e. against the campaign's own interest.

    CLAIM T (theorem, unconditional, checkable by derivation). Let E/F_p be
    ordinary with Frobenius pi satisfying pi^2 - t pi + p = 0, and let
    alpha = u + v pi in Z[pi] be non-scalar (v != 0) and primitive (not divisible
    by a rational integer > 1), with d = deg alpha = N(alpha) = u^2 + u v t + v^2 p.
    (T1) If gcd(v, d) = 1 then ker alpha is cyclic of order d, is Galois-stable,
    and pi acts on it as multiplication by the scalar lambda = -u v^{-1} mod d.
    (T2) A generator of ker alpha is defined over F_{p^m} with m = ord_d(lambda),
    and over no proper subfield of it.
    (T3) min over v != 0 of N(u + v pi) = |D|/4 up to rounding, D = t^2 - 4p,
    attained at v = ±1 and u = round(-t/2); for generic t = O(sqrt p) this is
    Theta(p).

    CLAIM H1 (heuristic, genericity, TESTED HERE AT TOY SCALE ONLY). For the
    minimal non-scalar alpha of a uniformly sampled ordinary E/F_p, lambda behaves
    with respect to multiplicative order like a uniformly random element of
    (Z/d)^*: for every epsilon > 0 the density of instances with
    ord_d(lambda) <= d^{1-epsilon} tends to 0 as p -> infinity.

    CLAIM H2 (structural, about this corpus's own isogeny steps). For every
    class-group action step used in any ledger design of this campaign -- prime
    norm ell = polylog(p), F_p-rational ell-torsion eigenspace -- the kernel
    generator is defined over F_p or F_{p^2}, i.e. m divides 2.

    COST COROLLARY CC (CONDITIONAL, AND ITS CONDITION IS THE EXPERIMENT'S HARD
    GATE). IF the square-root Velu operation count Otilde(sqrt d) is stated over
    the field of definition of a kernel generator -- an EXTERNAL, UNVERIFIED
    literature fact whose determination is STAGE 0 of EXP-ICINV-fcb497 -- and IF
    H1 holds, THEN evaluating the minimal non-scalar endomorphism of a generic
    ordinary E/F_p costs Otilde(sqrt(d) * m) = Otilde(p^{3/2}) F_p-operations,
    which is WORSE than the Otilde(d) = Otilde(p) this corpus already charges and
    is NOT the Otilde(sqrt p) that a naive application of square-root Velu would
    suggest. CC IS NOT CLAIMED UNCONDITIONALLY AND MAY NOT BE CITED WITHOUT ITS
    STAGE-0 VERDICT.

    CLAIM AUDIT-Z (pre-registered null of the audit). Zero cost claims currently
    recorded in this ledger change their stated EXPONENT under the corrected cost
    model, because every isogeny this corpus actually evaluates has a rational or
    near-rational kernel and polylog degree (H2), where square-root Velu saves a
    cofactor and not an exponent.

    WHAT IS NOT CLAIMED. Nothing about supersingular curves, whose endomorphism
    ring is non-commutative and whose kernel-rationality picture is entirely
    different; nothing at cryptographic scale (computing m requires factoring
    d ~ p); nothing about whether some other isogeny-evaluation technique exists;
    and nothing that would make (d, m) an identifying invariant of a curve -- the
    fibre of (d, m) is large and any downstream use of it as an invariant is
    forbidden by this record.

  distinguished_from_H_ICINV_6c7920: >-
    REQUIRED BY THE DISPATCHING HANDOFF AND STATED EXPLICITLY. H-ICINV-6c7920 is
    an INSTRUMENT-ARTIFACT hypothesis: it claims that a measured within-class
    over-dispersion of the m = 3 decomposition rate (EV-ENDO-10109d) is produced
    by the target sampler's incomplete group coverage, indexed by
    r = #{x : x^3+ax+b = 0}. This hypothesis is a COST-MODEL AND GALOIS-STRUCTURE
    hypothesis about the field of definition of the points of an endomorphism
    kernel. They share a research question and a goal and NOTHING ELSE:
      (i)  different tracked object -- (r, coverage fraction, VR_pooled) there,
           (d, lambda, m) here;
      (ii) different metric -- a NULL-B variance ratio there, a multiplicative
           order and a KS statistic here;
      (iii) no shared code path -- that experiment's modules
           (harness/exp_icinv.py, harness/exp_icinv_fullgroup.py,
           harness/run_fullgroup.py) are UNDER EDIT PROHIBITION here and are not
           imported by this experiment at all;
      (iv) no shared primes, factor bases, samplers, seeds or curve selection
           rule; this experiment enumerates no isogeny class and computes no
           factor base;
      (v)  NO OUTCOME OF EITHER CHANGES THE STATUS OF THE OTHER. In particular a
           refutation of H-ICINV-6c7920 leaves T, H1, H2, CC and AUDIT-Z
           untouched, and a STAGE-0 inversion here leaves EV-ENDO-10109d and
           H-ICINV-6c7920 untouched.
    The only permitted interaction is bookkeeping: if the STEP-1 barrier table
    (STAGE 1) finds a cost claim inside the ICINV lane whose exponent changes,
    that is escalated to a Coordinator decision and never applied as an edit.

  relationship_to_IDEA_20260807_c36472: >-
    DISJOINT AND STATED RATHER THAN LEFT TO THE READER. IDEA-20260807-c36472
    prices TRANSPORT: the NUMBER of class-group action evaluations needed to reach
    a specified member of an isogeny class, quoted as Otilde(p^{1/4}) and marked
    [open] pending re-verification in that record. This hypothesis prices the
    INTERIOR of a single isogeny/endomorphism evaluation, in field operations.
    The two multiply; neither moves the other. Nothing here discharges, weakens,
    strengthens or re-verifies c36472's [open] mark, and that mark is INHERITED
    UNCHANGED by any write-up that cites both. The barrier table of STAGE 1 must
    contain a row for c36472's p^{1/4} figure recording exponent_changed = no with
    that reason, so the non-interaction is a measured row and not an assertion.

  mechanism: >-
    STEP 1 -- THE WORRY, STATED SO IT COULD WIN. Several cost arguments in this
    corpus charge "evaluating a degree-d isogeny costs Otilde(d)". If a
    square-root Velu style algorithm evaluates a cyclic-kernel degree-d isogeny in
    Otilde(sqrt d) operations, any barrier resting on the Otilde(d) figure is
    stale. And by T3 the minimal non-scalar endomorphism of an ordinary E/F_p has
    degree d = |D|/4 = Theta(p) for generic t, so Otilde(sqrt d) = Otilde(sqrt p)
    would TIE the 0.886 sqrt(N) rho baseline (KN-TECH-001, KN-TECH-006). A tie at
    the birthday bound is close enough to the campaign's target profile that it
    must be checked rather than assumed away. THIS IS THE HYPOTHESIS THIS RECORD
    EXISTS TO SETTLE, IN EITHER DIRECTION.

    STEP 2 -- THE ALGEBRA (T1, T2), ZERO COMPUTE, EACH LINE CHECKABLE. alpha
    commutes with pi because End_{F_p}(E) is commutative for ordinary E, so
    ker alpha is Galois-stable and the kernel polynomial has F_p coefficients:
    THE SUBGROUP IS RATIONAL. The POINTS are a separate matter. On ker alpha the
    relation u + v pi = 0 holds; when gcd(v, d) = 1, v is invertible mod d and pi
    acts on ker alpha = Z/d as multiplication by lambda = -u v^{-1} mod d. A
    generator T then satisfies pi^m(T) = T iff lambda^m = 1 mod d, so the smallest
    field containing a generator is F_{p^m} with m = ord_d(lambda). Rationality of
    the subgroup does NOT give rationality of its points, and that gap is the
    entire content of this record.

    STEP 3 -- WHY IT COSTS WHAT IT COSTS (CC). The square-root Velu
    baby-step/giant-step structure runs over multiples of a GENERATING POINT of
    the kernel, so its operation count is counted in the field where that point
    lives. Under the STAGE-0 verdict KERNEL_FIELD, the cost of alpha is
    Otilde(sqrt d) operations in F_{p^m} = Otilde(sqrt(d) * m) F_p-operations up
    to log factors. With d ~ p and m ~ d ~ p under H1 this is Otilde(p^{3/2}).
    THE KNIFE EDGE IS THEREFORE ILLUSORY, AND ILLUSORY IN THE UNFAVOURABLE
    DIRECTION. Under the STAGE-0 verdict BASE_FIELD the whole of STEP 3 fails,
    the knife edge is real, and this record's cost corollary is refuted while T,
    H1, H2 and STEP 4 survive untouched.

    STEP 4 -- THE SECOND, INDEPENDENT KILL, RECORDED BECAUSE ONE OBSTRUCTION IS
    NOT A CLOSURE. Suppose STEP 3 failed and some family had m = polylog(p), so
    the endomorphism really were evaluable in Otilde(sqrt p). It would still be
    worthless for the ECDLP: by H-ENDO-001 and KN-FIND-b7e091, alpha acts on the
    prime-order subgroup G = <P> as multiplication by the scalar mu = u + v mod N,
    because pi acts as the identity on E(F_p). mu is computable in O(1) integer
    operations from (u, v, N) and [mu]P in O(log N) group operations. The
    expensive isogeny evaluation returns a point a scalar multiplication already
    returns. STEP 3 is about COST; STEP 4 is about INFORMATION; each alone
    suffices. H-ENDO-001 IS USED HERE AS THE ADMISSIBILITY FILTER GOAL-ENDO-001
    REQUIRES, AND IS NOT RE-TESTED BY THIS HYPOTHESIS OR BY EXP-ICINV-fcb497.

    STEP 5 -- WHERE SQUARE-ROOT VELU DOES APPLY, AND THE NEARBY-OBJECT CONTROL
    (H2). The isogenies this campaign actually evaluates are class-group action
    steps: prime norm ell small, ell-torsion eigenspace F_p-rational, so m = 1
    (m = 2 twisted) by construction and d = ell = polylog(p). There square-root
    Velu is a GENUINE improvement, poly(ell) -> Otilde(sqrt ell): a cofactor gain
    inside an already-polylog step, which multiplies no exponent. AN ARGUMENT THAT
    ALSO KILLS THIS CASE IS PROVING TOO MUCH and has mis-identified the
    load-bearing structure, which is kernel-point rationality and not degree size.

    STEP 6 -- WHY THE MEASUREMENT IS WORTH ITS COST. m is an arithmetic quantity
    nobody in this corpus has computed; a repository grep for "field of definition
    of the kernel", "kernel field" and "kernel polynomial degree" returned zero
    hits on 2026-08-07 (IDEA-20260807-9fb27c novelty_screen). If m is
    systematically small on an identifiable family of ordinary curves, H1 lapses
    on that family, the Otilde(sqrt p) tie is real there, and the family is an
    object worth naming even though STEP 4 still bites. Measuring m is cheap at
    toy scale and has never been done here.

  assumptions:
    - >-
      [fact] E/F_p ordinary, p > 3, End_{F_p}(E) an order O in the imaginary
      quadratic field of discriminant D_0, pi the Frobenius with
      pi^2 - t pi + p = 0, p not dividing t. Standard Deuring/Waterhouse. VERIFIED
      PER INSTANCE at toy scale by an order certificate: #E is determined by
      baby-step/giant-step within the Hasse interval and certified by
      [#E]P = O for the sampled points together with uniqueness of the annihilating
      multiple in that interval; supersingularity is excluded by t != 0.
    - >-
      [DECLARED SCOPE NARROWING, AND IT IS A NARROWING OF THE PARENT PROPOSAL]
      alpha ranges over Z[pi], NOT over the full endomorphism ring O when the
      conductor f = [O : Z[pi]] exceeds 1. IDEA-20260807-9fb27c's STEP 3 is
      ambiguous on this point ("the conductor f and O; the minimising (u,v) of the
      norm form"). It is FROZEN here as Z[pi] because the norm form
      u^2 + u v t + v^2 p is then unambiguous and directly computable, and because
      a conclusion about the minimal endomorphism of O requires the O-basis, which
      is a strictly larger computation. CONSEQUENCE, STATED PLAINLY: where f > 1,
      O may contain a non-scalar element of SMALLER degree than the Z[pi]-minimum,
      so T3 and every d reported here are statements about Z[pi] and no conclusion
      about the O-minimum is claimed. EXP-ICINV-fcb497 reports the O-minimal
      degree as a DECLARED SECONDARY where f <= 100, and stratifies every primary
      statistic by f so a conductor effect is visible rather than pooled away.
    - >-
      [fact, conditional on gcd] alpha primitive and gcd(v, d) = 1, so pi acts on
      ker alpha by a scalar and ker alpha is cyclic. Instances failing this are the
      DEGENERATE CASE: they are detected, counted, excluded from the primary
      statistic, and reported. They are never silently dropped. If they exceed 20%
      the cyclic-kernel analysis does not cover the typical case and T1/T2 must be
      extended to non-cyclic kernels before any conclusion is drawn.
    - >-
      [EXTERNAL, UNVERIFIED, LOAD-BEARING] The square-root Velu operation count is
      stated over the field of definition of a kernel generator. This is the single
      assumption whose resolution can INVERT this record. It is attributed in the
      parent proposal to Bernstein-De Feo-Leroux-Smith, "Faster computation of
      isogenies of large prime degree" (ANTS XIV, 2020) -- CITED FROM AN AGENT'S
      BACKGROUND KNOWLEDGE AND NOT READ IN ANY SESSION OF THIS CAMPAIGN. The
      attribution and the operation count both carry
      [unverified -- not read this session] and MUST travel with that mark into
      every downstream write-up until STAGE 0 of EXP-ICINV-fcb497 resolves them
      against a hash-pinned retrieved artifact.
    - >-
      [EXTERNAL, UNVERIFIED] The classical distribution results imitated in H1's
      random-model justification -- Erdos-Murty and Kurlberg-Pomerance on
      multiplicative orders modulo varying n -- are LIKEWISE cited from background
      knowledge and are [unverified] in this campaign. No decision threshold in
      EXP-ICINV-fcb497 depends on them: the comparison distribution is the MATCHED
      EMPIRICAL NULL (a uniformly random unit mod the SAME d), precisely because
      the theoretical order distribution depends on the factorisation of d.
    - >-
      [filter, not re-tested] H-ENDO-001's scalar action of an endomorphism on a
      prime-order subgroup, and KN-FIND-b7e091's generic-group closure, are USED as
      the admissibility filter for mechanism STEP 4 exactly as GOAL-ENDO-001's
      opening note requires. This hypothesis does not test them, does not depend on
      them for T, H1, H2 or CC, and may not be cited as evidence about them.
    - >-
      [scope, hard] Everything empirical here is TOY SCALE, capped by the cost of
      FACTORING d ~ p exactly. p < 2^24 on the frozen ladder. No extrapolation of
      the measured distribution of m to cryptographic p is a validated claim; any
      such statement is an extrapolation and must be labelled one.

  novelty_status: unverified
  novelty_status_note: >-
    CARRIED FORWARD UNCHANGED FROM IDEA-20260807-9fb27c AND NOT QUIETLY DROPPED.
    Internal novelty is real (zero corpus hits for the kernel's field of
    definition). External novelty is almost certainly NIL -- that a degree-d
    isogeny is cheaply evaluable only when its kernel points live in a small
    extension is folklore in the isogeny literature -- and NO EXTERNAL NOVELTY IS
