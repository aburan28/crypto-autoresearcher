    - >-
      F2. log m / log d is measured well below 1 and does not rise with d on an
      identifiable family of ordinary curves. HEUR-ORD-1 is falsified ON THAT
      FAMILY; the family is NAMED, characterised by whatever (t, D, f, d) features
