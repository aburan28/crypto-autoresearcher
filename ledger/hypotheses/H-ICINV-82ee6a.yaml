    - >-
      F6. The m = 1 fixture does not return m = 1, or the corrected accounting does
      not degenerate to Otilde(sqrt ell) there. The argument proves too much: it
      would also kill the regime where square-root Velu genuinely helps, so it has
      mis-identified the load-bearing structure and the cost formula is wrong.
    - >-
      F7 (PLANNED NEGATIVE, PRE-REGISTERED). If the predicted null outcome holds --
      STAGE 0 returns KERNEL_FIELD, H1 survives, zero barrier rows flip -- the
      deliverable is NOT "nothing changed". It is the enumerated barrier table with
      one row per corpus cost claim and an explicit exponent-changed column, the
      per-decade order distributions with their matched nulls, and the named
      obstruction (kernel-point irrationality) with forward guidance. A negative
      that names no obstruction and no successor has not finished and its honest
      status is unverified (docs/inventor-protocol.md closure standard).

  interpretation_limits:
    - >-
      THIS RECORD MOUNTS NO ATTACK AND CLAIMS NO SPEEDUP. Its predicted outcome is
      that nothing changes. Its value is that "nothing changes" becomes a table with
      a reason instead of an assumption. dominated_by is NOT null: parallel rho with
      distinguished points (0.886 sqrt(N) time, O(1) memory), BSGS (sqrt(N) /
      sqrt(N)) and automorphism-discounted rho (KN-TECH-018) all dominate it
      trivially, and the corrected Otilde(p^{3/2}) endomorphism-evaluation figure is
      dominated by simply NOT evaluating the endomorphism -- mechanism STEP 4's
      scalar u + v mod N returns the same point in O(log N) group operations.
    - >-
      claim_tier TOY, and no downstream citation may raise it. p < 2^24, capped by
      exact factorisation of d ~ p. Nothing here is crypto-scale validation
      (AGENTS.md rule 7).
    - >-
      ORDINARY CURVES OVER PRIME FIELDS ONLY. Supersingular curves have a
      non-commutative endomorphism ring and an entirely different kernel-rationality
      picture; NOTHING here transfers, and in particular nothing here bears on
      KN-TECH-055 or on the Wesolowski exemplar of docs/target-result-profile.md.
    - >-
      TWO DIFFERENT SQUARE ROOTS, AND CONFLATING THEM MISREPORTS THIS RECORD.
      Otilde(sqrt d) is a square root of the ISOGENY DEGREE; 0.886 sqrt(N) is a
      square root of the GROUP ORDER. They coincide numerically here only because
      d ~ p ~ N.
    - >-
      MINIMALITY IS NOT UNIQUENESS. Several alpha can attain or nearly attain the
      minimum degree with different lambda and very different m; the experiment
      reports the window of the k = 5 smallest degrees so that a reported m is not
      an artefact of tie-breaking.
    - >-
      SMALL-d ARTEFACTS AND CONDUCTOR STRATA. At the small end of the ladder the
      multiplicative-order distribution is dominated by the arithmetic of individual
      d; per-decade distributions are reported and never a pooled statistic, and
      results are stratified by conductor f because curves at different volcano
      levels have different O, different norm forms and different minimal d.
    - >-
      Timeouts, crashes, OOM, retrieval failures and failures to factor d are
      INFRASTRUCTURE OUTCOMES and are never negative mathematical evidence
      (AGENTS.md rule 5). In particular a STAGE-0 network failure is not a
      BASE_FIELD verdict.

