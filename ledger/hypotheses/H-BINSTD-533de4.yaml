# =============================================================================
# H-BINSTD-533de4 -- Matched-dim poly vs normal usable_dimensions basis-swap
# meter on toy Koblitz n. Specified from IDEA-20261001-880180 under
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Approved DEC-20261003-d10361.
# ZERO RUNS in this design packet. Stages 0-1 authorized. No AUXIN. No Bedrock.
# No break / exponent / n>=131 transfer.
# =============================================================================
hypothesis:
  id: H-BINSTD-533de4
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-880180
  experiment_id: EXP-BINSTD-ce4668
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-d10361
  status: approved
  proposed_by: coordinator
  title: >-
    At fixed dim(V), polynomial vs normal ambient basis either diverges the
    Part-1 usable_dimensions readout by median abs diff ≥ 1 on toy n=17
    matched pairs, or the bases are equivalent (median 0) for this predicate

  statement: >-
    CLAIM (heuristic_validation / instrument meter; NO ATTACK; NO EXPONENT).
    Let U(n) be the Part-1 usable_dimensions set derived from d=ord_n(2) as in
    EXP-BINSTD-178742 part1_surface (stable dims minus {0,1,n-1,n}). For each
    toy n∈{17,23,31} and each matched pair (V_poly, V_normal) of F_2-subspaces
    with the same dimension ℓ∈[⌊n/8⌋,⌊n/4⌋], define the usable readout
    usable_card(V) = |U(n)| if V is Frobenius-stable and dim(V)∈U(n), else 0.
    V_poly is the geometric-progression span in the frozen polynomial basis;
    V_normal uses the same α-pattern as a normal-coordinate GP mapped through
    a Stage-0-frozen normal generator. CLAIM: on ≥20 Stage-0-frozen pairs at
    n=17, median_i |usable_card(V_poly_i) − usable_card(V_normal_i)| is ≥ 1
    (O-DIVERGE) OR equals 0 (O-EQUIVALENT). A shuffle-null of pair labels must
    drop below the observed median when the observed median is ≥ 1. Stages 0-1
    only; n=23,31 deferred. NO break. NO n≥131 transfer. NO PDP claim.

  mechanism: >-
    OBJECT FRAME. Representation: the same dim-ℓ abstract construction
    realized once under a polynomial basis of F_{2^n} and once under a normal
    basis. Operation set: Part-1 usable_dimensions predicate plus Frobenius-
    stability of the concrete coordinate rowspace (no Semaev solve, no walk).
    Trichotomy: Class II coordinate-dependent — the readout may depend on the
    embedding, not on a group homomorphism. Lossy-projection: comparing two
    embeddings of matched dim discards the concrete span generators; if the
    predicate is basis-invariant the difference is 0 (null). OFF-LIMITS: F2
    factor-base decomposition as primary lens; choosing V to claim PDP
    speedup. WHAT IS NEW: a matched-dim basis-swap meter for the usable
    readout, complementary to IDEA-20261001-11aa69 (emptiness gate) and
    fbee3f (product co-meter).

  predictions:
    - metric: median_abs_diff_usable_dimensions_poly_vs_normal
      direction: different
      minimum_effect: >-
        ≥ 1 (O-DIVERGE) or = 0 (O-EQUIVALENT) at n=17 on ≥20 frozen pairs
    - metric: null_shuffle_median
      direction: lower
      minimum_effect: >-
        shuffle median < observed median when observed ≥ 1; else O-ARTIFACT

  test_boundary:
    instances:
      - Stage 0: freeze P_n seeds, irreducibles, normal generators, predicate pin
      - Stage 1: n=17, ≥20 matched pairs; median + shuffle null + RESULTS.md
    parameters:
      toy_n: [17, 23, 31]
      stage1_n: 17
      min_pairs: 20
      dim_band: '[floor(n/8), floor(n/4)]'
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-ce4668/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      No Magma/Sage/cypari2/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 3600
      memory_gb: 1
      maximum_runs: 3

  falsification_conditions:
    - Predicate source hash drifts after Stage-0 freeze (O-ARTIFACT).
    - Nonzero median with shuffle null not strictly below (O-ARTIFACT).
    - Claiming PDP / exponent gains from a basis divergence alone (protocol invalid).
    - Transferring toy divergence to n≥131 without a new contract (protocol invalid).
    - Editing P_n / predictions after seeing medians (protocol invalid).

  distinguishable_outcomes:
    - id: O-DIVERGE
      meaning: >-
        median_abs_diff ≥ 1 at n=17 with shuffle null below; poly vs normal
        usable readout diverges for this predicate at this scale. No PDP claim.
    - id: O-EQUIVALENT
      meaning: >-
        median_abs_diff = 0; bases recorded as equivalent for this predicate
        at n=17 under the frozen construction.
    - id: O-ARTIFACT
      meaning: >-
        Predicate pin drift, shuffle-null failure, or Stage-0 freeze corruption.
        No median claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-BINSTD-533de4.

  interpretation_limits:
    - Toy meter only; no PDP claim; no n≥131 transfer.
    - Does not retire 11aa69/fbee3f/d53638; complementary basis-swap probe.
    - Stage 2 (n=23,31) is a separate authorization.
    - Empty or nonzero usable readout is not a security claim.

  heuristic_assumptions:
    - id: HEUR-BINSTD-880180-H1
      formal_statement: >-
        FORALL n∈{17,23,31}, over a pre-registered set P_n of ≥20 matched
        pairs with dim V=ℓ∈[⌊n/8⌋,⌊n/4⌋]: median_abs_diff
        (usable_card(V_poly), usable_card(V_normal)) ≥ 1.
      random_model_justification: >-
        Rigorous: usable_card is an exact predicate of the coordinate
        realization of V. Classical: KR-IC-73db3f treats polynomial geometric
        spans as the default cheap V; whether the program's usable readout is
        invariant under the normal-basis re-embedding is the transfer
        hypothesis under test. Stage 1 tests n=17 only under this card.
      supporting_results:
        - KR-IC-73db3f
      validation_experiment_ids:
        - EXP-BINSTD-ce4668
      falsification_condition: >-
        Median absolute difference = 0 on frozen P_n at Stage-1 n (O-EQUIVALENT,
        a valid scientific negative of O-DIVERGE), OR re-running with shuffled
        pair labels yields the same nonzero median (O-ARTIFACT).

  asymptotic_claim:
    problem: >-
      Whether Part-1 usable_dimensions readout is basis-invariant under
      poly↔normal matched-dim constructions at RQ-BINSTD toys
    prior_best: >-
      KR-IC-73db3f qualitative V-choice guidance; Part-1 emptiness gate under
      IDEA-20261001-11aa69 / EXP-BINSTD-27f623 (sibling design, not this claim)
    time_exponent: 'NO EXPONENT MOVED. Basis-swap meter only.'
    memory_exponent: O(n^2) bit matrices for subspace representations at n≤31
    hidden_cofactor: Building matched normal-basis images of poly spans
    claim_kind: heuristic_validation_meter

  proof_search_map:
    bottleneck: >-
      Whether median |usable_card(V_poly)−usable_card(V_normal)| is ≥ 1 or 0
      on frozen matched-dim pairs at toy n.
    baseline_embedding:
      parameter_slice: >-
        Stage 0: Part-1 census ok for n∈{17,23,31}; predicate pin; ≥20 pair seeds.
      reproduction_check: >-
        Dual Part-1 routes (iteration vs divisor) must agree; checker
        recomputes usable sets independently of stage orchestration.
    observation_collision:
      observable: 'the pair (basis_label, usable_card(V))'
      distinct_preimage_search: >-
        Shuffle-null of pair labels: a nonzero median that survives shuffle
        is an artifact, not a basis effect.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Matched-dim GP spans under poly vs normal ambient bases at n=17.
        predicted_gain: >-
          A diverge-or-equivalent label for the usable readout at toys.
    quantifier_order: >-
      Exists a frozen P_17 on which median abs diff ≥ 1, or for all pairs in
      P_17 the diff is 0. No claim for arbitrary V or n≥131.
    method_ceiling:
      strongest_certifiable_claim: >-
        O-DIVERGE or O-EQUIVALENT at n=17 under this construction.
        Cannot certify basis-invariance of every FB predicate.
      nearby_object_control: >-
        Shuffle-null; Part-1 dual-route agreement; predicate pin.
    proof_obligations:
      - claim: Stage-0 Part-1 census ok before any median is read.
        responsibility: baseline
      - claim: usable_card definition matches the frozen Stage-0 pin.
        responsibility: correctness
      - claim: Shuffle null gates O-DIVERGE.
        responsibility: baseline
      - claim: No PDP/exponent is certified.
        responsibility: scope
    not_applicable_reason: null

  dominated_by: >-
    CHECKED KR-IC-73db3f / KR-IC-1fcdbc dominate as attack mechanisms; this
    record only adds a matched-dim basis-swap test for one predicate.
  sota_delta:
    time: n/a — no attack
    memory: n/a
    data_queries: >-
      First pre-registered matched-dim poly↔normal usable readout
      divergence meter on RQ-BINSTD toys.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
