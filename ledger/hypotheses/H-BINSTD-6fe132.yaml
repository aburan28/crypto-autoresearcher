          verified_by: coordinator, this design session (path present; Stage 0 rechecks)
      validation_experiment_ids:
        - EXP-BINSTD-f124db
      falsification_condition: >-
        Stage 0 finds any d11575 cell with n(c)!=d/gcd(c,d), or any
        tau(dk') disagreeing with tau(d)*tau(k') on a correctly coprime
        pair (would be a construction bug if gcd!=1).
    - id: HEUR-BINSTD-6fe132-H1
      formal_statement: >-
        H-0e3641-1 / imported d11575-C2 TRANSFER. Genus (Artin-Schreier
        level of the magic number B under an order-n Frobenius) depends
        only on the period n and on B, not on which divisor c realises n.
        Extended here to divisors that need not be multiples of k — the
        case d11575 never needed.
      random_model_justification: >-
        Plausible because all order-n elements of a cyclic Galois group
        act identically on the filtration structure; NOT independently
        verified for non-k-related divisors before Stage 2.
      supporting_results:
        - ref: IDEA-20260922-0e3641
          provenance: internal
          claim: Isolates H-0e3641-1 and flags C2 as imported/unverified transfer
          verified_by: coordinator, this design session (Read)
        - ref: IDEA-20260922-d11575
          provenance: internal
          claim: C2 magic-number/genus depends on period n (source of import)
          verified_by: >-
            coordinator, this design session (Read; C2 itself still
            carries d11575's open re-derivation obligation)
        - ref: IDEA-20260922-8278db
          provenance: internal
          claim: Regime-ratio diagnostic rho_reg=g/log2(q) used as context in (C)
          verified_by: >-
            coordinator, this design session (Read title/claim;
            diagnostic not re-tested in this experiment)
      validation_experiment_ids:
        - EXP-BINSTD-f124db
      falsification_condition: >-
        Stage 2 computes disagreeing Artin-Schreier levels / genera at
        two divisors sharing period n on the (4,9) toy cell — revise (C)
        to mark genus-sharing UNVERIFIED for non-k-related divisors.
    - id: HEUR-BINSTD-6fe132-H2
      formal_statement: >-
        (C) NET COST IS OPEN. This hypothesis asserts NO prediction that
        the smaller-q shared-period cell beats, matches, or loses to the
        larger-q sibling under the d11575 regime split. Any Stage 2 cost
        table is observational data at toy scale only.
      random_model_justification: >-
        Regime ratio g/log2(q) moves adversely as q shrinks; net effect
        is indeterminate a priori (proposal heuristic_note).
      supporting_results:
        - ref: IDEA-20260922-0e3641
          provenance: internal
          claim: Predictions list net_cost_ordering direction unknown
          verified_by: coordinator, this design session (Read)
      validation_experiment_ids:
        - EXP-BINSTD-f124db
      falsification_condition: >-
        Not falsifiable by a single cost ordering — the heuristic is the
        OPENNESS claim. Overclaiming a security conclusion from one toy
        cell would violate the hypothesis scope (protocol invalidation),
        not refute a directional prediction.

