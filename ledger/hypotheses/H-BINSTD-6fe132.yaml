  proposed_by: coordinator
  title: >-
    General GHS conjugate-period n(c)=d/gcd(c,d); tau(N)=2*tau(16)=10 is
    minimal at k prime among N=16k' curves; composite-k' shared-period
    smaller-q lane tested at toy scale with cost left OPEN

  statement: >-
    SETTING. E/F_q, q=2^d, d=16 for the five deployed ANSI composite-degree
    curves (audit), attacked over F_{q^k}, N=dk, k in {11,13,17,19,23} prime.
    Companion to IDEA-20260922-d11575 (k-prime two-family census); this
    record generalises the period formula and counts the search surface.

    (A) PERIOD FORMULA. For ANY divisor c of N=dk, the conjugate period of
    E under the F_{2^c}-power Frobenius sigma_c is
        n(c) = d / gcd(c, d)
    exactly. Derivation: sigma_c^i fixes A,B in F_{2^d} iff d | c*i; least
    positive i is d/gcd(c,d). Specialises to d11575's two k-prime families:
    c|d => n=d/c; c=jk with j|d => n=d/j.

    (B) DIVISOR-COUNT MINIMALITY. For gcd(d,k')=1, tau(dk')=tau(d)*tau(k').
    At d=16, tau(16)=5, so tau(N)=10 iff k' is prime, and tau(N)>=15 for
    any composite k'>1 (e.g. k'=9 → 15; k'=15 → 20; k'=21 → 20). Exact
    number-theoretic fact: the five ANSI curves carry the fewest GHS
    candidate base fields among ALL curves of shape N=16k', k'>1.

    (C) SHARED PERIOD, SMALLER BASE FIELD — COST OPEN. Composite k' admits
    divisors c,c' with gcd(c,d)=gcd(c',d) but c!=c', hence identical n and
    (under imported d11575-C2 / H-0e3641-1) identical genus range, at
    strictly different q=2^c. Whether the smaller-q cell is exploitable is
    EXPLICITLY LEFT OPEN: shrinking q at fixed g raises regime ratio
    g/log2(q). No security ordering of composite-k' vs k-prime is claimed.

  statement_note: >-
    IDEA-20260922-0e3641 claim text is immutable and left at status proposed.
    Review verdict sound (HOLD-H consolidated_into_d11575). Defects/guidance
    absorbed: (1) design as structural companion, not a competing attack;
    (2) (A)/(B) are proven arithmetic — Stage 0 certificates; (3) H-0e3641-1
    genus-transfer is the sole heuristic under test; (4) (C) net cost stays
    direction:unknown; (5) ECC2K-130 bearing is the d=1 vacuous control
    (no GHS lattice), not a product-law claim. When IDEA-20260922-d11575 is
    later designed, this packet is the natural "why the lattice is minimal"
    section (HOLD-H); designing now freezes the open-idea obligation under
    AGENTS.md ECC instruction 3.

  mechanism: >-
    OBJECT FRAME. Representation R1 (same object as d11575: a divisor c of
    N and the associated conorm-norm relation vector). Sigma: translation
    by degree-one places of the covering curve over F_{2^c} (Class I
    partial-action; cited from d11575, not restated). WHAT IS TESTED: (i)
    arithmetic certificate that n(c)=d/gcd(c,d) reproduces d11575's ten
    cells and extends to composite-k' divisors; (ii) tau-minimality table;
    (iii) toy shared-period pair at (d,k')=(4,9) with mechanical Frobenius
    orbit-size check; (iv) Artin-Schreier level / genus agreement across
    that pair (H-0e3641-1); (v) optional charged-cost comparison reported
    as OPEN data, never as a security claim. Declared component: F2
    (GHS-cover factor-base enumeration stage), structural only.

  assumptions:
    - d=16, k prime on the five audited ANSI rows (analysis/binstd-curve-audit/).
    - >-
      d11575 C2 (genus/magic-number range determined by period n alone) is
      IMPORTED for (C)/H-0e3641-1 and extended beyond k-related divisors;
      Stage 2 is the first direct transfer check. If genus disagrees,
      revise (C), do not silently keep the import.
    - Arithmetic only at deployed parameters; executable arms are toy cells
      with dk' <= 41 (primary (4,9); k-prime control (4,7); d=1 null).
    - No scientific GHS attack run at deployed N in {176,208,272,304,368}.
    - (C) net cost remains OPEN regardless of toy cost ordering.

  proof_search_map:
    bottleneck: >-
      Whether (A) holds beyond d11575's two special cases on composite-k'
      divisors, and whether imported C2 / H-0e3641-1 transfers to a
      non-k-related shared-period pair at toy scale.
    baseline_embedding:
      parameter_slice: >-
        k-prime ten-cell table of d11575 at d=16 (all five curves);
        toy (d,k')=(4,9) with shared-period pair c=3 and c=9 (both n=4);
        k-prime control (4,7); d=1 null.
      reproduction_check: >-
        Stage 0: n(c)=d/gcd(c,d) matches d11575 stated periods on all ten
        cells per curve; tau table matches {10,15,20,20} for k' in
        {prime,9,15,21}. Stage 1: N=36 divisor lattice periods agree with
        (A); Frobenius orbit size equals predicted n on a constructed
        toy E/F_{2^4}. Stage 2: AS-level/genus at c=3 and c=9 agree, or
        disagreement falsifies H-0e3641-1 transfer.
    observation_collision:
      observable: >-
        Pair (period n, base-field size q=2^c) across divisors sharing n.
      distinct_preimage_search: >-
        Identical n at different q is the composite-k' degree of freedom
        k-prime denies. Cost must NOT be inferred from n alone — regime
        ratio depends on q (IDEA-20260922-8278db diagnostic, imported
        unmodified as context, not re-tested here).
    constructive_transforms:
      - transform: base_field_enumeration
        proposed_object: >-
          Full divisor lattice of N=dk' for composite k', versus
          d11575's two-family k-prime enumeration.
        predicted_gain: >-
          tau(d)*(tau(k')-2) extra candidate cells at shared genus range
          and smaller q — MORE SEARCH SURFACE; NO cost claim
          (HOLD-H / (C) open).
    quantifier_order: >-
      FOR ALL divisors c of N=dk, n(c)=d/gcd(c,d) EXACTLY. FOR ALL k'>1,
      tau(dk')>=2*tau(d) with equality IFF k' prime. SEPARATELY AND LEFT
      OPEN: whether any extra composite-k' cell beats its shared-period
      larger-q sibling in charged cost once regime validity is accounted
      for — no quantifier asserted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The five deployed ANSI composite-degree curves minimise tau(N) at
        10 among N=16k' curves; the general period formula holds on the
        tested lattice including a composite-k' toy; and (if Stage 2
        passes) genus agrees across one shared-period pair at (4,9).
        Cannot certify that composite-k' cells are cheaper or more
        dangerous, cannot move an exponent, and cannot claim a break.
      nearby_object_control: >-
        (i) d=1 / prime-degree null: period formula and extra-divisor
        argument evaporate (ECC2K-130 shape). (ii) k-prime toy (4,7):
        only the two families exist; no shared-period unequal-q pair.
        (iii) Mis-specified cell with gcd(d,k')!=1: tau multiplicativity
        fails — construction error, not a finding against (B).
    proof_obligations:
      - claim: n(c)=d/gcd(c,d) from automorphism-order argument
        responsibility: correctness
      - claim: n(c) reproduces d11575 periods on both k-prime families
        responsibility: baseline
      - claim: tau(dk)=tau(d)*tau(k) for gcd(d,k)=1; minimised at k prime
        responsibility: correctness
      - claim: H-0e3641-1 genus depends only on period (imported C2 transfer)
        responsibility: scope
      - claim: (C) net cost left open — no security ordering claimed
        responsibility: scope

  asymptotic_claim:
    problem: >-
      Structural size of the GHS base-field search lattice for curves of
      shape N=16k' (ANSI composite-degree family and composite-k'
