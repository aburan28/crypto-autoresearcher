    time_exponent: n/a (structural comparison; no algorithm claimed)
    memory_exponent: n/a
    hidden_cofactor: >-
      Regime-boundary sensitivity of g/log2(q) when q shrinks at fixed
      genus; GTTD/Enge-Gaudry constants as in d11575 if any cost arm runs
    claim_kind: structural_comparison_open_cost_question

  heuristic_assumptions:
    - id: HEUR-BINSTD-6fe132-H0
      formal_statement: >-
        NONE FOR (A) OR (B). The period formula and tau-minimality are
        unconditional finite algebra / elementary number theory.
        Recorded so absence is explicit.
      random_model_justification: >-
        RIGOROUS: automorphism order in a cyclic Galois group; Euler
        tau multiplicativity on coprime arguments.
      supporting_results:
