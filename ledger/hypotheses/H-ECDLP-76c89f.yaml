  statement: >
    Fix the exact charged-cost identities of IDEA-20260808-3f8a2b before any MITM table, any Semaev grid, or any discrete logarithm is claimed. Stage 0 asserts only that for |F|=3 and m=2 the Arm A cost is 2*|F|^m=18 and the Arm B table-plus-query skeleton is |F|^2+|F|=12. A nearby claim that Arm B costs 0 (oracle free) is rejected. The empty-field dummy is rejected. This is not a relation-finding run and not a rho beat. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260808-3f8a2b compares exhaustive Arm A cost 2*|F|^m to MITM Arm B cost |F|^2+|F|+2*candidates. Stage 0 freezes the skeleton arithmetic on |F|=3, m=2. No grid. No Semaev S_m. No DLP.
  predictions:
