hypothesis:
  id: H-ECDLP-5a484e
  question_id: RQ-ECDLP-002
  statement: >-
    A GGM SIMULABLE verdict closes an augmented-oracle candidate at exponent 1/2
    only when the simulator overhead C_sim is sub-polynomial in N. For a
    simulator of overhead C_sim, inlining it into Shoup's generic lower bound
    yields T >= c*sqrt(N)/C_sim augmented-oracle queries and an attack-cost floor
    of c*sqrt(N)*C_real/C_sim, where C_real is the concrete cost of one oracle
    query. Applied to the four oracle verdicts recorded in DEC-20260726-007, the
    hypothesis predicts jet BINDING, elliptic_net BINDING, endomorphism BINDING
    but with a model-dependent overhead (0 group operations in the structured
    GGM, Theta(log n) in the strict Shoup GGM), and incidence VACUOUS at every
    yield-admissible factor-base size, because B^m >= m!*N there forces
    sqrt(N)/C_sim below 1. Source proposal: IDEA-20260727-004.
  mechanism: >-
    If every query to an augmented oracle O can be answered by a generic-group
    algorithm using at most C_sim group operations and equality tests, then any
    T-query O-algorithm converts into a purely generic algorithm using at most
    C_sim*T group operations, so Shoup forces C_sim*T >= c*sqrt(N). The
    attacker pays T*C_real, giving the floor c*sqrt(N)*C_real/C_sim. The ratio
    G = C_sim/C_real is exactly the maximum multiplicative advantage the oracle
    can confer, and G > 1 is necessary for any augmented-oracle attack to beat
    matched Pollard rho. For the incidence oracle the cheapest known generic
    simulation is enumeration over factor-base m-tuples, C_sim = Theta(B^m/m!),
    which at any yield-admissible B is at least N, so the induced floor is below
    one group operation and the bound asserts nothing.
  assumptions:
    - >-
      Shoup's generic lower bound applies in the generic group model actually
      used by EXP-GGM-001, and inlining a simulator with the recorded overhead
      is a valid conversion of an augmented-oracle algorithm into a generic one.
    - >-
      The C_sim values recorded in DEC-20260726-007 are upper bounds on the
      cheapest generic simulation. A cheaper simulator changes the verdict,
      which is falsification condition one rather than a defect of the design.
    - >-
      Yield admissibility (B^m >= m!*N) is required for the incidence oracle to
      be useful at all. An oracle over a base too small to decompose anything
      answers "no decomposition" trivially and confers nothing.
    - >-
      The BINDING and VACUOUS thresholds are conventions and are frozen in the
      contract before any evaluation, never chosen after seeing the numbers.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the recorded conclusion is the inference
      from "SIMULABLE" to "no sub-birthday advantage". That inference is
      quantifier-free in DEC-20260726-007 and this hypothesis supplies the
      missing quantitative budget.
    baseline_embedding:
      parameter_slice: >-
        The old-method boundary is the constant-overhead case C_sim = O(1),
        where the induced floor is c*sqrt(N) and the closure at exponent 1/2 is
        exactly Shoup's own statement. The budget must reproduce that case
        identically.
      reproduction_check: >-
        Symbolic: at C_sim = 1 the induced floor formula must reduce to
        c*sqrt(N) and classify BINDING at every tested N, with the classifier
        returning the same label as the recorded EXP-GGM-001 control gate.
    observation_collision:
      observable: >-
        The induced floor value log2(c*sqrt(N)/C_sim) and its BINDING /
        INDETERMINATE / VACUOUS label.
      distinct_preimage_search: >-
        The observable is a function of (C_sim, N) alone and therefore collides
        massively: every oracle with the same overhead growth maps to the same
        label, including oracles that touch no elliptic curve. That collision is
        why the contract requires a curve-free null and forbids reading any
        label as a statement about elliptic curves.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The simulation gap ratio G = C_sim/C_real, replacing the binary
          SIMULABLE label with a measured quantity.
        predicted_gain: >-
          Converts an unquantified closure into a bound that can be compared,
          re-scoped and inverted by later work; G <= 1 means the oracle cannot
          beat matched rho no matter how the simulation is arranged.
    quantifier_order: >-
      FOR ALL yield-admissible B and FOR ALL m in {2,3,4,5} and FOR ALL tested
      N, the incidence induced floor is below 1 (VACUOUS). The existential that
      breaks it is THERE EXISTS a yield-admissible (B, m, N) at which the
      incidence floor classifies BINDING.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the recorded overheads, taken as given, do not by themselves
        establish a sub-birthday exclusion for the incidence oracle. It cannot
        certify that no such exclusion exists, and it cannot certify that any
        attack exists.
      nearby_object_control: >-
        A synthetic oracle with C_sim = 2 (must classify BINDING) and one with
        C_sim = N (must classify VACUOUS). These are the nearby objects on which
        the budget must give opposite answers.
    proof_obligations:
      - claim: The induced floor formula reduces to Shoup at C_sim = O(1)
        responsibility: baseline
      - claim: Yield admissibility forces C_sim >= N for the incidence oracle
        responsibility: feasibility
      - claim: The endomorphism simulator costs differ between the two GGM variants
        responsibility: correctness
      - claim: The classifier labels all declared control oracles correctly
        responsibility: interface
      - claim: No label is read as a statement about elliptic curves
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Shoup's generic-group lower bound: any algorithm solving discrete log in
        a group of prime order N using only generic operations requires
        Omega(sqrt(N)) group operations.
      citation: >-
        V. Shoup, Lower bounds for discrete logarithms and related problems,
        EUROCRYPT 1997. Named as the nearest work this design session can
        recall; no agent in this program opened it for this record.
      provenance: recalled
      verified_by: null
      role: >-
        Supplies the sqrt(N) numerator of the induced floor. Being `recalled`,
        it is a pointer for the reviewer and may not discharge any supporting
        result.
    - description: >-
        The four recorded EXP-GGM-001 oracle verdicts and their overheads
        (jet SIMULABLE C=1, endomorphism SIMULABLE C=0, elliptic_net SIMULABLE
        O(log N), incidence SIMULABLE O(B^m)), together with the sentence this
        hypothesis tests, quoted verbatim from the record: "Not closed at 1/2 by
        the constant-overhead bound, but no sub-birthday advantage."
      citation: ledger/decisions/DEC-20260726-007.yaml
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a opened
        ledger/decisions/DEC-20260726-007.yaml in this session by pattern search
        and read the context, rationale and limitations blocks containing the
        four verdicts, the four-of-four control gate, and the quoted sentence.
        The read was by pattern match over that file rather than a full-file
        read; the quoted lines were returned verbatim and are reproduced above.
      role: >-
        Supplies the C_sim inputs the budget is evaluated on and the exact
        sentence whose scope this hypothesis tests.
  reduction_chain:
    core_problem: >-
      Whether a SIMULABLE verdict, as recorded, licenses the claim of no
      sub-birthday advantage for oracles whose simulation overhead is not
      sub-polynomial.
    corollaries: []
  predictions:
    - metric: >-
        induced_floor_status per oracle per m per N, where the induced floor is
        0.886*sqrt(N)/C_sim in group-operation equivalents (dimensionless count
        of group operations)
      direction: different
      minimum_effect: >-
        Classification is jet BINDING, elliptic_net BINDING, endomorphism
        BINDING, incidence VACUOUS, at every yield-admissible B for m in
        {2,3,4,5} and N in {2^16, 2^24, 2^32, 2^64}. A BINDING classification for
        incidence at any yield-admissible B falsifies the hypothesis.
    - metric: >-
        endomorphism simulator operation count, in group operations, in the
        structured GGM and in the strict Shoup GGM, reported as a function of
        log2(n)
      direction: different
      minimum_effect: >-
        0 group operations in the structured GGM and Theta(log n) in the strict
        Shoup GGM, the two differing by a factor Theta(log n). Both still give a
        BINDING floor, so the closure survives; if the two models give the same
        count, the model-dependence prediction is false.
    - metric: >-
        simulation gap ratio G = C_sim/C_real for the incidence oracle, in
        matched group-operation equivalents (dimensionless), with a confidence
        interval, at toy bit sizes 12 through 24
      direction: lower
      minimum_effect: >-
        G <= 1 when C_real charges the fully yield-charged decomposition cost.
        The competing prediction is G > 1 growing with N across at least three
        sizes, which would be the first quantitative non-generic signal the
        program has produced and would require independent review before any
        promotion.
    - metric: >-
        control classification pass count, out of the declared control set
        (integer)
      direction: different
      minimum_effect: >-
        Every declared control classified correctly. Anything below a full pass
        means the quantitative test is unsound and every verdict it produced is
        void.
  test_boundary:
    instances:
      - >-
        The four EXP-GGM-001 augmented oracles as recorded in DEC-20260726-007,
        evaluated symbolically on their recorded overheads.
      - >-
        Toy prime-field curves at 12 to 24 bits for the C_real measurement only.
      - >-
        Synthetic overhead oracles carrying no curve at all, for the graded null.
    parameters:
      m_values: '2, 3, 4, 5'
      N_values: '2^16, 2^24, 2^32, 2^64'
      B_rule: 'B = ceil((m! * N)^(1/m)), with yield admissibility reported per cell'
      toy_bit_sizes_for_C_real: '12, 16, 20, 24'
    implementation: >-
      A short Python program computing the induced floor and the frozen
      classifier, plus a separate toy driver measuring the yield-charged
      decomposition cost on real curves and on a curve-free surrogate.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 2
      maximum_memory_gb: 8
      maximum_runs: 4
  falsification_conditions:
    - >-
      A generic simulator for the incidence oracle with C_sim = N^o(1) is
      exhibited. The oracle IS closed at exponent 1/2 and no scope correction to
      DEC-20260726-007 is warranted.
    - >-
      Any declared control oracle is misclassified. The quantitative test is
      unsound and none of its verdicts may be used.
    - >-
      The incidence floor classifies BINDING at some yield-admissible B. The
      vacuity claim is false at that parameterization.
    - >-
      The endomorphism simulator costs the same in the structured and strict
      Shoup models. The model-dependence prediction is false and the recorded
      C = 0 is model-independent after all.
    - >-
      The curve-free surrogate reproduces the measured G trend. Nothing measured
      may then be quoted as a statement about elliptic curves or the ECDLP.
  interpretation_limits:
    - >-
      A VACUOUS verdict removes a claimed closure. It is NOT evidence that an
      attack exists and must never be reported as a positive result or as a
      weakening of ECDLP security.
    - >-
      Stages evaluating the classifier consume only the pair (C_sim, N) and no
      curve whatsoever. No label they produce is a statement about elliptic
      curves. Only the C_real measurement touches a curve, and it is controlled
      against a curve-free surrogate for exactly that reason.
    - >-
      G is a monotone reparameterization of the membership-query cost exponent
      already used in an external report corpus, as the source proposal
      discloses. Measuring G does not produce an independent result from that
      lane and must not be reported as one.
    - >-
      C_real depends on the solver implementation, so only the sign of G - 1 and
      its trend in N are interpretable, never its absolute value.
    - >-
      The floors at N = 2^64 and above are arithmetic evaluations of a cost
      model, not measurements. NOT TESTABLE AT REACHABLE SCALE: no run in this
      contract measures any quantity at cryptographic N, and the claim that the
      classification persists at cryptographic N is stated as an arithmetic
      extrapolation of the recorded overhead growth, not as evidence.
    - >-
      No hypothesis status changes and no promotion follows from this test. Its
      only output is a constraint on what may be asserted about the elliptic-net
      and incidence oracles.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260727-004.yaml
    - ledger/decisions/DEC-20260726-007.yaml
    - ledger/hypotheses/H-GGM-001.yaml
    - ledger/questions/RQ-ECDLP-002.yaml
    - experiments/EXP-ECDLP-05ea4d/specification.yaml
