hypothesis:
  id: H-PAIR-a82328
  question_id: RQ-PAIR-f2e31f
  added: '2026-08-25'
  derived_from_idea: IDEA-20260809-172a9e
  statement: >-
    A PUBLISHED PAIRING SECURITY LEVEL EVALUATES ONE POLYNOMIAL SELECTION; THE ADVERSARY-RELEVANT
    STATISTIC IS THE TAIL OF THE DISTRIBUTION OVER SELECTIONS, NOT ITS MODE. Three claims that can each
    fail independently.
    (S1) SELECTION QUALITY IS A DISTRIBUTION, NOT A POINT. For a fixed tower target field shape at small
    field sizes, running the polynomial-selection search repeatedly under a declared budget produces a
    distribution of quality scores whose spread is measurable and whose seed-to-seed behaviour at fixed
    budget is stable - i.e. the search is genuinely sampling a space rather than returning a
    seed-determined answer.
    (S2) THE BUDGET IS A LIVE PARAMETER. The best-of-N quality score IMPROVES with the log of the
    selection budget across at least three of the four declared budget rungs before saturating, so the
    budget a defender's estimate implicitly fixes is not the budget an adversary would spend. Selection is
    a ONE-TIME PRECOMPUTATION for an attacker, which is exactly why the best-of-N and not the typical
    selection is the relevant statistic.
    (S3) THE SPREAD IS MATERIAL. The gap between the median and the best-of-N quality score, translated
    into estimated cost bits through a calibrated score-to-cost model, is at least 1 bit. A spread below
    the reporting resolution of that translation FALSIFIES the concern.
    STATED PLAINLY - S3 DEPENDS ON AN EXTERNAL, NOT-YET-APPROVED SCORE-TO-COST CALIBRATION. The primary
    deliverable is therefore the SCORE-DOMAIN distribution, which needs no translation; the bits
    conversion is secondary and is reported as UNRUN if no committed calibration exists.
  mechanism: >-
    Polynomial selection for the target field is a SEARCH whose output quality varies, and a security
    estimate is a function of the selection actually found. Published levels correspond to one selection
    each. Because selection is a one-time precomputation, an adversary can afford a far larger search
    budget than the one implicit in a published estimate, so the statistic that matters is the BEST OF MANY
    rather than the typical - and the difference between the two is exactly what a single-selection estimate
    cannot show. The measurement is therefore a distribution over selections at increasing budgets, with the
    best-of-N curve as the object and its saturation point as the decision-relevant feature: saturation at a
    small budget means a larger adversary budget buys nothing and the concern is empty, which is a
    reassuring and reportable negative; failure to saturate means the estimate's implicit budget is a free
    parameter nobody has declared.
  assumptions:
  - >-
    The quality score is well defined and implementation-independent to the resolution claimed. This is
    NOT assumed - it is tested, by requiring two independently written implementations of the score to rank
    the top candidates identically. A score that does not survive that check is not a measurable object and
    no distribution over it is reportable.
  - >-
    The search at fixed budget samples the space rather than returning a seed-determined answer. Also
    tested, by requiring the distributions at fixed budget across different seeds to agree within a declared
    tolerance. A heavy seed dependence at fixed budget means the search is not sampling and the distribution
    is NOT the object claimed.
  - >-
    Measurements are at SMALL field sizes with the same tower shape as the deployed target. Extrapolation to
    a deployed prime carries its own interval and is NOT a security verdict.
  - >-
    The score-to-cost translation comes from a SEPARATE, EXTERNAL record that is not approved and may not
    exist in committed form. Where it is unavailable or unstable, the bits conversion is reported UNRUN and
    the score-domain result stands on its own. NO bit figure is invented to fill the gap.
  - >-
    Selection quality distributions have been studied for integer factorisation. Nothing here claims novelty
    against that literature; what is proposed is the transfer to a TOWER target field with a fixed deployed
    prime, and the framing as a best-of-N precomputation whose budget the defender's estimate implicitly
    fixes.
  proof_search_map:
    not_applicable_reason: >-
      Not proof-oriented. No theorem, bound, certificate hierarchy, reduction or closure argument is
      proposed; the deliverable is an empirical distribution over the outputs of an existing search
      procedure, and its correctness obligations are instrument obligations - a score that two
      implementations agree on and a search that samples rather than memorises - which are discharged as
      controls in EXP-PAIR-cde187 rather than as lemmas.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. No attack, no exponent, no cost reduction. The deliverable is a DISTRIBUTION
    where the literature reports a POINT, with the tail identified as the adversary-relevant statistic.
    Measurements are at small field sizes and any extrapolation to a deployed prime carries its own interval
    and is not a security verdict.
  heuristic_assumptions:
  - id: HEUR-PAIR-1
    formal_statement: >-
      SHAPE TRANSFER. The shape of the selection-quality distribution - in particular the ratio of the
      median-to-best gap to the distribution's own spread, and the budget at which the best-of-N curve
      saturates - measured at the small field sizes executed, is representative of the shape at the
      deployed field size with the same tower shape.
    random_model_justification: >-
      NOT a randomness heuristic and it is not dressed as one. It is a pure transfer assumption whose whole
      content is that it is an assumption. There is no model under which the saturation budget must be
      scale-invariant, and the search space grows with the field size, so the saturation budget could
      plausibly grow with it. Every extrapolated statement is labelled as an extrapolation.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      The two executed field sizes themselves disagree about the saturation budget or about the
      median-to-best gap by more than the declared resolution. That is a WITHIN-CONTRACT test of the
      transfer at the only two scales available, and it is why two sizes rather than one are executed.
  - id: HEUR-PAIR-2
    formal_statement: >-
      SCORE-TO-COST STABILITY. The mapping from a selection's quality score to an estimated attack cost in
      bits is stable enough, over the range of scores observed, that a score gap of the observed size
      translates into a bit gap with a resolution finer than the gap itself.
    random_model_justification: >-
      Not a randomness heuristic. It is a calibration-stability assumption about an EXTERNAL model that this
      hypothesis does not own and that is not approved. If it fails, the score-domain result stands and the
      bits conversion is UNRUN.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      The translation's own resolution over the observed score range is coarser than the observed
      median-to-best score gap. Then the measurement cannot support a claim in bits, S3 is not evaluable,
      and that is reported rather than papered over with a number.
  structural_ingredients:
  - description: >-
      The extended tower number field sieve and the pairing key-size analyses that fix the target field
      shape and the standard quality measure for a selection.
    citation: >-
      Extended tower number field sieve and pairing key-size references - RECALLED and NOT read in this
      program. They are REQUIRED READS before any absolute claim, and this hypothesis's own score-domain
      result does not depend on them beyond fixing the tower shape and the quality measure.
    provenance: recalled
    verified_by: null
    role: fixes the target field shape and the quality measure the distribution is taken over
  - description: >-
      The score-to-cost calibration that converts a quality-score gap into estimated cost bits.
    citation: >-
      An EXTERNAL sibling proposal in this lane, NOT part of this hypothesis and NOT approved. Its
      identifier is deliberately not asserted here as a dependency that has been checked.
    provenance: recalled
    verified_by: null
    role: >-
      the only route to the bits metric; if it is unavailable or fails its own stability check, the bits
      metric is UNRUN and the score-domain result stands alone
  predictions:
  - metric: 'best-of-N quality score as a function of the log of the selection budget, over four declared budget rungs'
    direction: higher
    minimum_effect: >-
      Improvement exceeding the score resolution from the first rung to at least the third, before
      saturating. IMMEDIATE SATURATION - improvement below the score resolution from the first rung to the
      fourth - falsifies S2, makes the selection budget irrelevant, and is a reassuring and publishable
      NEGATIVE.
  - metric: 'gap between the median and the best-of-N quality score at the largest budget, in score units'
    direction: higher
    minimum_effect: >-
      Above the score resolution established by the two-implementation scoring control. A gap at or below
      that resolution means the distribution is not measurably wide and the concern is falsified in the score
      domain, before any translation is attempted.
  - metric: 'the same gap translated into estimated cost bits through the calibrated score-to-cost model'
    direction: higher
    minimum_effect: >-
      At least 1 bit. A spread below the translation's own reporting resolution falsifies S3. IF NO COMMITTED
      CALIBRATION EXISTS, this metric is reported UNRUN and no bit figure is stated.
  - metric: >-
      agreement of the score distributions at fixed budget across seeds, as the overlap of their interquartile
      ranges
    direction: different
    minimum_effect: >-
      Agreement within the declared tolerance. A heavy seed dependence at fixed budget means the search is
      NOT sampling the space, the distribution is not the object claimed, and nothing is reportable.
  - metric: 'agreement of two independently written scoring implementations on the ranking of the top candidates'
    direction: different
    minimum_effect: >-
      Identical ranking of the top candidates. A disagreement means the score is not well defined to the
      resolution claimed and no distribution over it is reportable.
  - metric: >-
      difference between the two executed field sizes in saturation budget and in median-to-best gap
    direction: different
    minimum_effect: >-
      Within the declared resolution. A disagreement between the two sizes falsifies HEUR-PAIR-1's transfer at
      the only two scales available and forbids any extrapolation to the deployed size.
  test_boundary:
    instances:
    - >-
      Two small field sizes sharing the deployed target's tower shape, so the transfer assumption is tested
      at the only two scales the budget reaches rather than assumed at one.
    - >-
      A deliberately degraded search - a search restricted to a small fraction of its normal candidate space -
      as a positive control where the distribution MUST be measurably worse.
    parameters:
      budgets: 'four rungs, spaced by a declared factor, with the rung schedule frozen before any run'
      seeds: 'declared, with at least three per (field size, budget) cell'
      scoring: 'two independently written implementations of the quality measure'
      tower_shape: 'fixed and identical across both field sizes'
    implementation: >-
      Repeated invocation of the polynomial-selection search at declared budgets with declared seeds, with the
      FULL score distribution retained per cell rather than its summary; two independent scoring
      implementations run over the same candidate sets; and the score-to-cost translation applied only if a
      committed calibration exists. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 14400
      total_cpu_hours: 40.0
      maximum_memory_gb: 16
      maximum_runs: 24
  distinguishable_outcomes:
  - >-
    O1 (BUDGET IS A LIVE PARAMETER). The seed control and the scoring control both pass; the best-of-N curve
    improves across at least three rungs before saturating; the median-to-best score gap exceeds the score
    resolution; and, where a committed calibration exists, that gap is at least 1 bit. MEANING - a published
    single-selection level implicitly fixes a selection budget that an adversary need not respect, and the
    adversary-relevant statistic is the tail. Reported as a distribution with its tail, scoped to the executed
    field sizes.
  - >-
    O2 (SATURATION - A REASSURING NEGATIVE). The best-of-N curve improves by less than the score resolution
    from the first rung to the fourth. MEANING - selection budget is IRRELEVANT; a larger adversary search
    buys nothing; the concern is empty at these field sizes. This is a publishable negative and it is the
    outcome the design most wants to be able to detect cleanly.
  - >-
    O3 (SPREAD BELOW RESOLUTION). The median-to-best score gap is at or below the resolution established by
    the two-implementation scoring control. MEANING - the distribution is not measurably wide, S3 is
    falsified in the SCORE domain before any translation is attempted, and no bits claim is made.
  - >-
    O4 (SEARCH NOT SAMPLING). The score distributions at fixed budget differ heavily across seeds. MEANING -
    the search is not sampling the space, the distribution is not the object claimed, and NOTHING is
    reportable - this is an invalid run, not a negative result about selection budgets.
  - >-
    O5 (SCORE NOT WELL DEFINED). The two independent scoring implementations rank the top candidates
    differently. MEANING - the quality measure is not well defined to the resolution claimed; no distribution
    over it is reportable and the defect is the deliverable.
  - >-
    O6 (TRANSLATION UNAVAILABLE OR UNSTABLE). No committed score-to-cost calibration exists, or its
    resolution over the observed score range is coarser than the observed gap. MEANING - the bits metric is
    UNRUN under AGENTS.md rule 5, the score-domain result stands alone and is reported as such, and NO bit
    figure is invented.
  - >-
    O7 (TRANSFER FAILS BETWEEN THE TWO EXECUTED SIZES). The two field sizes disagree about the saturation
    budget or the median-to-best gap by more than the declared resolution. MEANING - HEUR-PAIR-1 is falsified
    at the only two scales available and no extrapolation to a deployed size may be attempted at all.
  falsification_conditions:
  - >-
    Best-of-N quality saturates immediately - improvement below the score resolution from the first budget
    rung to the fourth. S2 is false and the selection budget is irrelevant.
  - >-
    The median-to-best score gap is at or below the score resolution. S3 is false in the score domain.
  - >-
    The score-to-cost translation is not stable enough to convert the observed spread into bits. The
    measurement cannot support a claim in bits and that is reported rather than filled in.
  - >-
    The score distributions at fixed budget depend heavily on the seed. The search is not sampling the space
    and the distribution is not the object claimed.
  - >-
    Two independent scoring implementations rank the top candidates differently. The score is not well defined
    and nothing is reportable.
  - >-
    The two executed field sizes disagree about the saturation budget beyond the declared resolution.
    HEUR-PAIR-1 fails at the only scales tested.
  interpretation_limits:
  - >-
    Measured at SMALL FIELD SIZES. Extrapolation to the deployed prime carries its own interval, rests on
    HEUR-PAIR-1, and is NOT a security verdict.
  - >-
    No attack is proposed and no cost is reduced. The delta is a distribution where the literature reports a
    point, with the tail identified as the adversary-relevant statistic.
  - >-
    The bits metric depends on an EXTERNAL, unapproved score-to-cost calibration that this hypothesis does not
    own. Where it is unavailable, the bits metric is UNRUN and no figure is stated.
  - >-
    The literature has NOT been checked for this transfer. Selection-quality distributions are studied for
    integer factorisation, no novelty is claimed against that, and the required reads are recalled and
    unread in this program.
  - >-
    A best-of-N statistic is scoped to the search implementation used. A different selection implementation
    explores a different space and its distribution is a different object.
  prior_evidence_refs:
  - RQ-PAIR-f2e31f
  - GOAL-PAIR-001
  status: proposed
  proposed_by: coordinator
  owner: coordinator
