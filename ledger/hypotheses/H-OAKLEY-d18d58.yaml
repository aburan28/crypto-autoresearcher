# H-OAKLEY-d18d58
# Stage-0 four-sum count for IDEA-20261007-36251a.
# The other three subspace classes are not this hypothesis.
hypothesis:
  id: H-OAKLEY-d18d58
  question_id: RQ-OAKLEY-264353
  goal_id: GOAL-ECDLP2M-001
  source_idea: IDEA-20261007-36251a
  added: '2026-10-12'
  status: specified
  statement: >-
    On y^2 + xy = x^3 + z over F_2[z]/(z^25 + z^3 + 1), with the factor
    base of affine points whose x-coordinate lies in the subfield
    F_32, the number of distinct affine points that occur as an ordered
    sum of four factor-base points agrees with C(36, 5) = 376992 within
    a factor of 2.
  test_boundary: >-
    One modulus, one curve, the subfield factor base, and ordered
    four-sums. No second subspace, no p=7 cell, no SAT encoding, no
    Groebner basis, and no timing.
  mechanism: >-
    Heuristic H2 in IDEA-20261007-36251a compares a decomposition count
    at p=5 with C(q+4, 5)/N for q=32. This hypothesis reads that
    comparison as the size of the ordered four-sum image against
    C(36, 5). The field cardinality cancels in the ratio.
  distinguishable_outcomes:
    - >-
      The planted identities hold, and the image size is between half
      and twice 376992, endpoints included.
    - >-
      The planted identities hold, and the image size is strictly below
      one quarter of 376992 or strictly above four times 376992.
    - >-
      The planted identities fail. That outcome invalidates the run.
  falsification: >-
    The planted identities hold and the image size disagrees with
    376992 by more than a factor of 4.
  not_claimed: >-
    No yield per second, no ranking of subspace classes, and no
    statement about the Oakley endpoint curves.
