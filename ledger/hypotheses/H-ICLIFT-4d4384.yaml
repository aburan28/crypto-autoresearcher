hypothesis:
  id: H-ICLIFT-4d4384
  question_id: RQ-XEDN-001
  idea_id: IDEA-20260805-64aef4
  goal_id: GOAL-ICLIFT-001

  statement: >-
    SCOPE: the frozen EXP-XEDN-002 family y^2 = x^3 + b(t) over F_p with
    deg b = 6 exactly, the frozen is_square_poly predicate (nonzero square with
    squarefree root, y = 0 excluded), both the monic-x and the free-x slot
    conventions carried side by side, and p in {5, 7, 11, 13, 17, 19} with 23
    best-effort. CLAIM TIER toy. NO ATTACK CLAIM, NO EXPONENT CLAIM, NO CLOSURE
    OF CANDIDATE B2, NO STATEMENT ABOUT NON-ISOTRIVIAL FAMILIES OR NUMBER-FIELD
    XEDNI, AND NOTHING ABOUT RELATION COEFFICIENTS.
    Let s(b) be the number of admissible slots on the surface b, let
    lambda = E[s] and F2 = E[s(s-1)] over the uniform measure on the family, and
    define the over-dispersion factor
        g_eff(p) := 1 + (F2 - lambda^2)/lambda.
    THE HYPOTHESIS: g_eff is BOUNDED in p on each residue branch separately, and
    specifically g_eff = 1 EXACTLY on the branch p = 2 mod 3, where mu_3 is not
    contained in F_p and the orbit mechanism KN-FIND-003 identifies is
    unavailable, while on the branch p = 1 mod 3 it satisfies 3 <= g_eff <= 50
    with a slope versus log p whose jackknife interval INCLUDES 0.
    WHY THIS IS THE RIGHT QUANTITY AND NOT ANOTHER DENSITY MEASUREMENT:
    F2/lambda^2 is identically Pr[a second section is present | one section is
    present] / Pr[a second section is present]. That ratio is exactly what
    DEC-20260724-021's fatal objection RT-5 needs and exactly what the census
    could not supply, because the census reported the mean (from which alpha = 3
    follows) and the >= 9-section tail (a criterion RT-4 showed is "neither
    necessary nor sufficient"), and never the second moment. Under the measure
    the attack actually uses, the first section is free -- the red team built one
    at 10,201 of 10,201 attempts -- so the operative quantity is the CONDITIONAL
    abundance of the second, and g_eff is it.
    FALSIFICATION AND WHAT IT WOULD MEAN: g_eff >= 1.5 anywhere on the
    p = 2 mod 3 branch refutes the mu_3 attribution and obliges a superseding
    record against KN-FIND-003's mechanism claim; a per-branch slope excluding 0
    upward with magnitude >= 0.5 means the prescribed measure carries a GROWING
    advantage the uniform census could not see, RT-5 becomes fatal in substance
    rather than only in scope, and the closure recorded for this route must be
    revisited.

  mechanism: >-
    DERIVED; the only inputs are the definition of a factorial moment and the
    arithmetic of F_p.

    (1) WHY A FIRST MOMENT CANNOT ANSWER RT-5. The xedni construction does not
    draw a surface and hope for a section: given a section (x(t), y(t)) the
    surface is determined by b := y^2 - x^3, so prescribing ONE section has
    probability 1 by construction. That is exactly what the red team measured
    (10,201 of 10,201 at p = 101, against a uniform per-slot rate of 4.76e-07).
    The attack needs TWO sections on one surface, so the operative quantity is
    Pr[2nd | 1st], and by the definition of the factorial moments
    Pr[2nd | 1st]/Pr[2nd] = E[s(s-1)]/E[s]^2 = F2/lambda^2. The census enumerated
    the per-surface histogram that determines F2 and reported only lambda and a
    tail.

    (2) THE FORCED NULL, DERIVED. If section incidences were independent across
    surfaces (a Poisson model) then F2 = lambda^2 and g_eff = 1 identically. If
    instead the sections on a surface arrive in orbits of size g under an
    automorphism acting freely on them, with the orbit count Poisson of mean
    nu = lambda/g, then s = gK and
        F2 = E[gK(gK-1)] = g^2(nu + nu^2) - g*nu = lambda^2 + (g-1)*lambda,
    so g_eff = g EXACTLY. g_eff is therefore a model-free readout of the
    effective orbit size and is the quantitative form of RT-4's
    distinct-is-not-independent objection.

    (3) THE NULL OBJECT IS INSIDE THE FAMILY AND IS FREE. mu_3 is contained in
    F_p exactly when p = 1 mod 3. KN-FIND-003 attributes the observed structure
    on this family to mu_3 orbits S + wS + w^2 S = O at primes p = 1 mod 3, and
    EVERY prime tested in EXP-XEDN-003 (7, 13, 19, 31) is on that branch. On the
    complementary branch the cube roots of unity are absent from F_p, the
    mechanism is unavailable, and the FORCED VALUE IS g_eff = 1 EXACTLY. Same
    family, same predicate, same enumeration code, same degree shapes: a matched
    null of identical shape that can genuinely fail.

    (4) WHAT THE ARCHIVED ARTIFACT ALREADY CONTAINS. The per-surface histograms
    at p = 5, 7, 11, 13 are committed in
    experiments/EXP-XEDN-002/runs/RUN-XEDN-002-C/raw-result.json (field
    histogram_slots_per_surface). Reading them and forming the second factorial
    moment is arithmetic on four short integer vectors. A SESSION-SIDE READING
    PERFORMED OUTSIDE THE HARNESS -- NOT A RUN, NOT EVIDENCE, AND TO BE
    REPRODUCED IN-HARNESS WITHOUT IMPORTING CENSUS CODE AS STAGE 1 -- gives, in
    the free-x convention, g_eff = 0.992 (p=5), 5.096 (p=7), 1.017 (p=11),
    5.483 (p=13); and in the monic-x convention 1.034, 8.144, 1.032, 8.294. The
    branch separation is total.
    TWO CONSEQUENCES, STATED WITH EQUAL FORCE. FIRST, the null holds on the
    archived data to within 2%, which if reproduced is the first controlled null
    this route has ever had. SECOND, THE ORBIT MODEL DOES NOT FIT AS POSED:
    g = 3 forces g_eff = 3 and g = 6 forces g_eff = 6, and the readings sit
    between. Something beyond a single free mu_3 orbit contributes -- a mixture
    of orbit sizes, an interaction with the y -> -y doubling (points are exactly
    twice slots), or residual clustering the automorphism does not explain -- and
    identifying it is the experiment's mechanism arm. It is NOT a parameter to be
    fitted after the fact, and the contract forbids reporting a fitted g as
    though it were derived.

    (5) THE DECISION, BOTH BRANCHES PRE-COMMITTED. If g_eff is bounded, then
    prescribing the first section multiplies the chance of a usable second by a
    constant; the uniform-measure exponent alpha = 3 is not rescued, but neither
    does RT-5 reopen the route -- the obstruction survives the change of measure,
    now attached to a named mechanism (bounded automorphism orbits) instead of a
    density exponent. If g_eff grows with p, the prescribed measure carries an
    advantage the uniform census structurally could not see, and the closure must
    be revisited. Both outcomes are reportable; the second is the one that would
    matter, and its prior is stated honestly rather than assumed away.

  assumptions:
    - >-
      The archived RUN-XEDN-002-C histograms are what they say they are. Stage 1
      re-derives them independently without importing census code; a bin-level
      disagreement suspends everything downstream and becomes the deliverable.
    - >-
      "Section" means a hit slot of the frozen degree shape under the frozen
      predicate. Both conventions are carried throughout; EV-XEDN-001 records
      that the census's own multi-section margin FLIPPED between them, so no
      verdict may rest on one.
    - >-
      g_eff measures conditional ABUNDANCE of distinct sections, not
      independence in the Mordell-Weil group. A large g_eff driven entirely by
      automorphism orbits is precisely the case where the extra sections are
      useless to the attack, and that must be stated in the same sentence as the
      number.
    - >-
      Conditioning on "the surface carries a section" is not identical to the
      attack's conditioning on "the surface carries a section through a specific
      point at a specific place". The gap is HEUR-ICL-X2 and is not closed here.

  proof_search_map:
    bottleneck: >-
      The step at which the change from the uniform measure to the constructed
      (prescribed-point) measure could convert a p^-3 rarity into a workable
      rate. Prescribing the first section removes the p^-3 factor entirely, by
      construction. So the whole question is what the SECOND section costs
      conditionally, and g_eff is precisely the multiplicative correction between
      the uniform and conditional rates for it. If g_eff is bounded, no
      re-measurement of the first-section density under any measure can change
      the conclusion; if it grows, the exact identity the census established
      never bore on the attack at all.
    baseline_embedding:
      parameter_slice: >-
        The exact slice reproducing the established baseline is the census's own
        first moment: lambda per surface at p = 5, 7, 11, 13 in both conventions,
        together with the closed forms N_slots = (p-1)p^8,
        N_hit = p^2(p^4 - 3p^3 + 2p^2 + p - 1)/2 and
        P_lift = (p^3 - 2p^2 + 1)/(2p^6). Any independent enumeration must
        reproduce these EXACTLY before its second moment is looked at.
      reproduction_check: >-
        A frozen fixture: the four archived per-surface histograms, bin for bin,
        in both conventions, plus n_surfaces = (p-1)p^6 (62500, 705894,
        17715610, 57921708) and the parity check that section points are exactly
        twice slots. Matching lambda alone is NOT a reproduction; the histogram
        must match bin for bin, because the second moment lives in the bins the
        first moment averages away.
    observation_collision:
      observable: >-
        The per-surface section count s(b), and the population statistics
        (lambda, F2) built from it.
      distinct_preimage_search: >-
        Collisions in s(b) are massive and are the point: at p = 13 more than
        50.8 million of 57.9 million surfaces share s = 0, and 6.2 million share
        s = 3. A collision search on the FIRST moment therefore finds ground-
        truth objects on both sides of the claimed conclusion trivially -- two
        surfaces with the same lambda-contribution, one carrying a mu_3 orbit and
        one carrying three unrelated sections, are indistinguishable to the
        census's statistic. That is a direct identifiability falsifier against
        the mean, and it is why the mean could not answer RT-4 or RT-5. The
        second moment does NOT collide across the branches: 0.98 and 1.04 against
        10.53 and 10.71 for F2/lambda^2. The proposed observable separates the
        pair the incumbent observable cannot, which is the condition an
        observation-collision audit is supposed to establish.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the full factorial-moment sequence of s rather than its mean:
          (lambda, F2) and, where the histogram supports it, F3. The moments
          preserve strictly more state than the promotion criterion required, and
          that surplus state is exactly what survives the change of measure --
          the conditional rates the attack consumes are ratios of consecutive
          factorial moments.
        predicted_gain: >-
          Separation of the two residue branches by an order of magnitude
          (F2/lambda^2 ~ 1 versus ~10) where the incumbent statistic separates
          them by 15%. No attack gain is claimed.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (s = 3) fixed and vary the forgotten structure:
          three sections forming a mu_3 orbit versus three sections in general
          position. The intrinsic invariant distinguishing them is the
          group-law relation S + wS + w^2 S = O, which stage 3 verifies directly
          on the enumerated sections.
        predicted_gain: >-
          The orbit-size distribution, which converts g_eff from a number into a
          mechanism, and which is the only way the derived g_eff = g can be
          tested rather than fitted.
    quantifier_order: >-
      THE HYPOTHESIS: FOR ALL p in the tested set with p = 2 mod 3, g_eff(p) = 1
      (within tolerance); and THERE EXIST constants 3 <= c1 <= c2 <= 50 such that
      FOR ALL tested p = 1 mod 3, c1 <= g_eff(p) <= c2. The constants are allowed
      to depend on the family and the convention but NOT on p -- that is the
      whole content of "bounded", and it is what the slope test operationalises.
      THE TRAP BEING HUNTED: a witness allowed to depend on p. Reporting
      "g_eff is bounded" after observing two values per branch is exactly such a
      failure, because any two points are bounded. This is why the contract
      demands three primes per branch before any boundedness verdict, and why the
      archived two-point-per-branch reading is explicitly NOT sufficient for the
      conclusion even though it is sufficient for the null.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that on the frozen isotrivial family, under the frozen
        predicate, at p <= 23, the conditional abundance of a second distinct
        section given a first is bounded on each residue branch, with the
        p = 2 mod 3 branch at the forced value 1. It CANNOT certify anything
        about independence in the Mordell-Weil group, about relation
        coefficients, about non-isotrivial families, about the two-point
        prescribed measure, or about any p beyond the tested set. Writing it up
        as "the prescribed measure does not help function-field xedni" would
        exceed the method's ceiling and is forbidden by the interpretation
        limits below.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion FAILS is the branch
        p = 1 mod 3 itself: there the sections ARE strongly clustered
        (F2/lambda^2 ~ 10), so a method claiming "sections are unclustered" is
        refuted on it immediately. Running both branches with identical code is
        therefore simultaneously the null and the nearby-object control, and a
        method that reported the same g_eff on both would have failed to identify
        the load-bearing structure. A second nearby object, NOT run here and
        named as forward guidance: the non-isotrivial family (a != 0), where mu_3
        is absent for a different reason and where GOAL-XEDN-001's lineage
        already works -- deliberately not entered, to avoid duplicating that
        goal.
    proof_obligations:
      - claim: F2/lambda^2 = Pr[2nd | 1st]/Pr[2nd] identically.
        responsibility: correctness
      - claim: free orbits of size g force g_eff = g exactly under a Poisson orbit count.
        responsibility: correctness
      - claim: mu_3 is contained in F_p iff p = 1 mod 3.
        responsibility: correctness
      - claim: n_surfaces = (p-1)p^6 and N_slots = (p-1)p^8 for the frozen family.
        responsibility: baseline
      - claim: The independent enumeration reproduces the archived histograms bin for bin.
        responsibility: interface
      - claim: Three primes per branch are required before any boundedness verdict.
        responsibility: strictness
      - claim: >-
          The result is scoped to the frozen isotrivial family, the frozen
          predicate, and p <= 23, and says nothing about MW independence.
        responsibility: scope

  rerandomization: null

  asymptotic_claim:
    problem: >-
      The lift probability of the function-field xedni representation
      (RQ-XEDN-001), under the constructed rather than the uniform measure.
    prior_best: >-
      DEC-20260724-021's exact uniform-measure identity
      P_lift(p) = (1 - 2/p + p^-3)/(2p^3), alpha = 3, scoped to the frozen family
      and explicitly NOT a statement about the measure the attack uses.
    time_exponent: >-
      No exponent is claimed to move. The hypothesis's positive branch says the
      conditional correction is a CONSTANT, so the effective exponent under the
      prescribed measure for the second section is unchanged at 3 up to that
      constant. Its negative branch is the exponent-relevant one: if
      g_eff ~ p^delta, the effective per-additional-section exponent is 3 - delta
      and the route's cost model changes materially. The contract is designed so
      that this branch is detectable, not so that it is claimed.
    memory_exponent: >-
      Of the measurement only: the enumeration buckets p^7 (x, y) pairs by the
      induced b, so a dense bucket table is O((p-1)p^6) counters -- 8.9e8 at
      p = 19 and the binding resource. The contract requires a streaming or
      two-pass count instead and charges it explicitly. No attack memory claim
      exists anywhere here.
    hidden_cofactor: >-
      The p^7 enumeration constant, quoted from the archived cost (13.8 s and
      448 MB for p in {5,7,11,13} together) and extrapolated by the exact
      enumeration size, not by a runtime guess.
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-ICL-X1
      formal_statement: >-
        IF the sections carried by a surface of the frozen family arrive in
        orbits of a fixed size g under an automorphism group acting FREELY on
        them, AND the number of orbits per surface is Poisson with mean
        lambda/g, THEN F2 = lambda^2 + (g-1)*lambda and g_eff = g exactly.
      random_model_justification: >-
        The algebraic identity is exact for a Poisson orbit count; the random
        model is applied to the ORBIT count rather than to the section count,
        which is the correct level given a group action, and freeness is the
        condition that makes s = gK rather than a mixture.
      supporting_results: []
      validation_experiment_ids: [EXP-ICLIFT-290f2e]
      falsification_condition: >-
        Measured g_eff differing by more than 20% from the value implied by the
        MEASURED orbit-size distribution at any tested prime. The session reading
        already indicates the pure-g model fails as posed (5.10 and 5.48 against
        a predicted 3 or 6), so this heuristic is expected to be refuted and the
        deliverable is the mixture that replaces it.
    - id: HEUR-ICL-X2
      formal_statement: >-
        FOR ALL p in the tested set, conditioning on "the surface carries at
        least one section" differs from the attack's conditioning on "the surface
        carries a section through a prescribed point at a prescribed place" by a
        factor bounded independently of p.
      random_model_justification: >-
        None offered. This is the residual measure gap; a justification would
        need transitivity of the family's automorphisms on (place, point) pairs,
        which is asserted nowhere in this record.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        An exact two-point prescribed count differing from lambda * g_eff by a
        factor growing with p. Performing that count is named as forward guidance
        and is not contracted here.

  structural_ingredients:
    - description: >-
        mu_3 orbit relations S + wS + w^2 S = O among free-x sections on the
        j = 0 family at p = 1 mod 3.
      citation: >-
        Internal: KN-FIND-003, promoted by DEC-20260724-022 from EV-XEDN-002 at
        confidence "reported", proof_status empirical_only, scoped to
        p in {7, 13, 19, 31}. Not an external citation and not treated as one.
      role: >-
        Supplies the mechanism that predicts the branch separation, and hence the
        forced null on the complementary branch.
    - description: >-
        Shioda-Tate rank bound r <= 8 for a rational elliptic surface, used by
        the census to justify the s >= 9 criterion.
      citation: >-
        RECALLED, UNVERIFIED, and relayed inside the program's own artifact,
        which states "literature; not recomputed here". No theorem number, page,
        author or year is asserted. NOTHING IN THIS HYPOTHESIS DEPENDS ON IT:
        g_eff is a moment of a measured histogram and needs no geometry to be
        defined. It is listed only because the census's tail statistic did depend
        on it.
      role: >-
        None here; recorded so the dependency structure is visible.

  reduction_chain:
    core_problem: >-
      Whether the constructed (prescribed-point) measure changes the abundance of
      usable sections enough to reopen the function-field lift route within the
      frozen family.
    corollaries:
      - problem: >-
          Whether RT-4's distinct-versus-independent objection is quantitatively
          large or small on the tested family.
        reduction_ref: >-
          Immediate: g_eff = g for free orbits of size g; derived above, no
          external reduction cited.
        asymptotics_preserved: Yes within the tested scope.
      - problem: >-
          Whether KN-FIND-003's mu_3 attribution is the actual mechanism or a
          coincidence of the primes chosen.
        reduction_ref: >-
          The p = 2 mod 3 branch is the matched null; the attribution predicts
          g_eff = 1 there and nothing else does.
        asymptotics_preserved: Yes within the tested scope.

  predictions:
    - metric: g_eff(p) on the p = 2 mod 3 branch, free-x convention
      direction: lower
      minimum_effect: >-
        FORCED VALUE 1.000, tolerance |g_eff - 1| <= 0.05 at every prime on the
        branch. Can fail.
    - metric: g_eff(p) on the p = 1 mod 3 branch, free-x convention
      direction: higher
      minimum_effect: >-
        >= 3.0 at every prime on the branch (the minimum the orbit model can
        produce) and <= 50 at every prime (so the prediction can fail upward too).
    - metric: per-branch slope of g_eff versus log p, with a jackknife interval
      direction: different
      minimum_effect: >-
        THE DECISION METRIC. Predicted interval INCLUDES 0 on both branches. An
        interval excluding 0 upward with |slope| >= 0.5 is the reopening
        condition.
    - metric: >-
        independent reproduction of the archived per-surface histograms at
        p in {5, 7, 11, 13}
      direction: different
      minimum_effect: BIN-FOR-BIN EXACT in both conventions; any discrepancy suspends everything.
    - metric: n_surfaces and N_slots identities
      direction: different
      minimum_effect: >-
        EXACTLY (p-1)p^6 and (p-1)p^8; a one-line instrument check that can fail.
    - metric: Pr[>= 2 sections | >= 1 section] divided by Pr[>= 2 sections]
      direction: higher
      minimum_effect: >-
        The RT-5 readout. Predicted to track F2/lambda^2 to within a factor 2 and
        to be bounded on each branch; it is reported whether or not it tracks.

  test_boundary:
    instances:
      - p = 2 mod 3 branch (null): p in {5, 11, 17} with 23 best-effort
      - p = 1 mod 3 branch (treatment): p in {7, 13, 19}
      - both slot conventions (monic-x and free-x) at every prime
      - >-
        planted in-population positive control: a surface carrying a constructed
        mu_3 orbit at a p = 1 mod 3 prime
    parameters:
      family: "y^2 = x^3 + b(t) over F_p, deg b = 6 exactly"
      predicate: "frozen is_square_poly (nonzero square, squarefree root, y = 0 excluded)"
      section_shape: "deg x <= 2, deg y <= 3"
      enumeration: "fibering over (x, y) pairs bucketed by the induced b; p^7 pairs per prime"
      moments: "lambda, F2, F2/lambda^2, g_eff; slots and points reported separately"
    implementation: experiments/EXP-ICLIFT-290f2e
    budget:
      wall_clock_seconds: 7200
      maximum_memory_gb: 8
      maximum_runs: 8

  falsification_conditions:
    - >-
      g_eff >= 1.5 at any prime on the p = 2 mod 3 branch. The mu_3 attribution
      is wrong, KN-FIND-003's mechanism claim needs a superseding record, and
      this hypothesis's null is void.
    - g_eff < 3.0 at any prime on the p = 1 mod 3 branch.
    - >-
      Per-branch slope of g_eff versus log p excluding 0 upward with magnitude
      >= 0.5. The negative branch is withdrawn and the closure must be revisited.
    - Any bin-level disagreement with the archived histograms at p <= 13.
    - >-
      Failure of the planted mu_3 orbit positive control: no negative result may
      be reported from any arm (AGENTS.md rule 5; inventor protocol section 3).

  interpretation_limits:
    - >-
      Toy scale, one frozen isotrivial family, one predicate, one pair of degree
      shapes, p <= 23. Not a closure of candidate B2, of function-field xedni, of
      non-isotrivial families, or of number-field xedni; the eleven sentences
      DEC-20260724-021 forbids are not asserted.
    - >-
      A bounded g_eff does NOT close the route. It shows one specific objection
      does not convert into a growing advantage on the tested primes. Forward
      guidance if that is the outcome: the two-point prescribed count (both P and
      Q on one surface, a strictly stronger conditioning than measured here),
      the non-isotrivial family under the prescribed measure, higher-degree
      section shapes, and the rank/independence question raised in
      IDEA-20260805-e5dd09.
    - >-
      Nothing here is evidence about relation coefficients and nothing here
      touches the EXP-XEDN-003..007 lineage or GOAL-XEDN-001/002/003.
    - >-
      The session readings quoted in the mechanism are readings of a committed
      artifact performed OUTSIDE the harness. They are not runs, they are not
      evidence, and no record may cite them until stage 1 reproduces them.
    - >-
      Conditional abundance is not usability. Extra sections generated by an
      automorphism orbit are exactly the ones the attack cannot use, and every
      report of g_eff must carry that sentence.

  status: proposed
