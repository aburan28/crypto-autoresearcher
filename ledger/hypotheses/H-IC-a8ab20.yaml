hypothesis:
  id: H-IC-a8ab20
  question_id: RQ-IC-a39c7e
  statement: On the fixed toy combined schedule, exact certificates discriminate correct interfaces and useful output
    from the listed adverse controls; coverage/new-rank benefit is unknown and may be zero.
  mechanism: Rebuild exact same auxiliary catalog in this run using shared exported code, charge all setup; do not
    treat previous run outputs as free computation. At each rational target/auxiliary lifted x, retain complete
    chain intermediates with centered integer representatives and pole branches.; For every W bound, measure actual
    retained M and fraction of points/chains whose every intermediate satisfies abs(centered x_j)<W; W97 is a whole-field
    baseline. Record distributions/maxima, rejected points and density loss. No bound nearp is called low-height.;
    All-target ordered-tuple group-sum density by DP for m2/3/5 before/after chain-height filters, actual first
    moment and coverage; for m3/5 addition tree record intermediate group x heights separately, including O branch.
    Uniform and planted cohorts separate.; Compose actual m2 S3 with two auxiliary chain-membership systems and
    terminal finite-image constraints in shared centered integer x variables; include every y-lift/projective exception
    in verification. For polynomial system f_i=0 modp, build shifts x^a*product(f_i^b_i)*p^(t-sum b_i), all b_i>=0,sum
    b_i<=t, |a|<=L. Use all declared equations, exact HNF/integer-row lattice, actual support/rank/bit counts and
    n64,D256 caps. Root boxes are signed abs(x)<W for intermediate/target coordinates retained by the height filter;
    column weights use W. Zero-dimensional equations and extraction must satisfy all original systems and target
    sum. Matched no-chain baseline uses exactly the same final target candidates and root boxes. At least the identity/no-chain
    panel performs actual LLL, even if no strict certificate results.; Demonstrate precisely whether density-preserving
    small intermediate coordinates coexist with certified independent integer equations. Larger variable boxes are
    charged in column weights and caps; do not multiply independent conditional benefits or inject oracle roots
    into candidate extraction.
  assumptions:
  - All field/curve/subgroup/map admissions must be independently certified in-run.
  - Known families retained by explicit user instruction; no new method or speedup established.
  proof_search_map:
    bottleneck: Actual valid field/decomposition certificates, independent reduced rank and charged complete pipeline.
    baseline_embedding:
      parameter_slice: d0 identity/no-chain
      reproduction_check: Preserve exact baseline and mandatory nearby-object controls on the frozen schedule.
    observation_collision:
      observable:
      - height-filter retention and actual uniform target coverage
      - new variables/degrees/monomials/weighted norms
      - valid complete chain+point witness and genuinely extracted roots
      - full construction/extraction/new-rank cost or explicit zero-yield/cap
      distinct_preimage_search: Preserve degenerate witnesses, invalid lifts, duplicate orbit rows and positive-dimensional
        short-vector controls where applicable.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Exact combined interface certificates
      predicted_gain: Discrimination only; no cost improvement assumed.
    quantifier_order: For every admitted frozen fixture/case verify certificates; existential successful or faster
      solving remains unproved. No transfer beyond the finite schedule.
    method_ceiling:
      strongest_certifiable_claim: Toy observations and exact implementation witnesses pending independent review.
      nearby_object_control:
      - d0 identity/no-chain
      - identical final base as explicit list
      - fullfield intermediate bound97
      - tiny intermediate windows causing measured density loss
      - random same-size base and coordinate relabeling
      - projective/pole kernel branch
      - positive-dimensional chain-equation controls
    proof_obligations:
    - claim: Exact admission, valid output and complete accounting in every declared panel
      responsibility: correctness
    not_applicable_reason: null
  predictions:
  - metric: height-filter retention and actual uniform target coverage
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: new variables/degrees/monomials/weighted norms
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: valid complete chain+point witness and genuinely extracted roots
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  - metric: full construction/extraction/new-rank cost or explicit zero-yield/cap
    direction: different
    minimum_effect: Exact valid output, zero yield, rejected adverse control or explicit instrument stop, as preregistered;
      no benefit threshold asserted.
  test_boundary:
    instances:
    - target
    - auxiliary
    - depths
    - coordinate_bounds
    - tuple_lengths
    - reduction_m
    - reduction_t
    - reduction_L
    - selected_fibers
    - minimum_stage
    parameters:
      target:
      - 97
      - 0
      - 2
      auxiliary:
      - 97
      - 1
      - 0
      depths:
      - 0
      - 1
      - 2
      - 3
      coordinate_bounds:
      - 2
      - 4
      - 8
      - 16
      - 32
      - 97
      tuple_lengths:
      - 2
      - 3
      - 5
      reduction_m: 2
      reduction_t: 1
      reduction_L: 0
      selected_fibers: Every finite image fiber catalog for density/height; for actual combined lattice choose first
        admitted nonempty target base in canonical fiber order at each d, not adaptive best fiber.
      minimum_stage: At least one identity-depth or explicit window control must exercise a real lattice reduction;
        other cells may honestly yield no certified equation.
      root_boxes: For each fixed bound W, every retained original/chain x variable uses signed integers -W+1..W-1
        and weight_bound W; finite-field reductions map them back modulo97.
    implementation: tools/lattice_ic_combined.py
    budget:
      maximum_runs: 1
      maximum_memory_gb: 2
  falsification_conditions:
  - Small-height density collapse or missing independent certified equations is scoped adverse measurement. No generic
    impossibility, performance or crypto-scale transfer follows.
  interpretation_limits:
  - Synthetic tiny fields only; no asymptotic extrapolation, novelty or performance claim.
  - Development tests are software checks, not admitted scientific evidence.
  - Hypothesis remains proposed until specification/approval; no scientific promotion without independent review.
  status: proposed
  proposed_by: coordinator
  idea_ids:
  - IDEA-20261015-1e8145
  - IDEA-20261015-9defe9
  asymptotic_claim: null
  heuristic_assumptions: []
