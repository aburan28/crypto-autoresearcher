hypothesis:
  id: H-MLKEM-007
  question_id: RQ-MLKEM-001
  title: >-
    Covariance-aware fusion over a negacyclic isometry orbit reduces the
    short-vector sample count of toy layered-dual scoring
  statement: >-
    At toy ML-KEM-like parameters (synthetic MLWE over Z_q[X]/(X^n+1), n in
    {32, 64}, q=3329, module rank k=2, centered-binomial eta=3 secret and
    error laws), a scoring pipeline that (1) reuses one short-vector pool
    across a selected orbit of negacyclic coefficient isometries X^j, (2)
    evaluates the selected orbit scores by batched negacyclic convolution,
    and (3) fuses the per-orbit scores with generalized least-squares (GLS)
    weights derived from a score covariance matrix estimated only on
    disjoint training instances, recovers planted secret components in a
    frozen single-layer layered-dual scoring task with at least 4x fewer
    short vectors at n=64 (at least 2x at the n=32 gate) than the unfused
    single-orbit baseline at matched held-out false-positive rate, with
    held-out orbit-score effective rank r_eff >= 4.0 at n=64 (>= 2.0 at the
    n=32 gate) for at least one selected orbit subset of size at most 32,
    at least 2x lower held-out wrong-candidate false-positive rate than
    naive unweighted orbit averaging on the same vectors, and no greater
    total charged score work. Failure to meet any threshold rejects this
    speculative composition as non-material at toy scale.
  mechanism: >-
    Multiplication by X^j in Z_q[X]/(X^n+1) is a signed coefficient
    permutation that commutes with the public matrix action, so
    X^j*b = A*(X^j*s) + X^j*e preserves A and, because the
    centered-binomial law is symmetric and iid across coordinates,
    preserves the secret and error distributions exactly (EV-MLKEM-001).
    One short-vector pool therefore yields dual scores for every selected
    orbit element without fresh lattice-reduction work, and the orbit
    scores are one batched negacyclic convolution rather than n independent
    scans. Because orbit scores are correlated reindexings of shared vector
    material, naive independence weighting is invalid (Ducas--Pulles
    correction, as recorded in the novelty screen of
    TASK-20260722-201/candidate_report.yaml); GLS fusion with the estimated
    score covariance downweights redundant orbit elements. The composition
    yields information only if the held-out score covariance has effective
    rank materially above one and the amortized scoring survives complete
    work accounting; otherwise it is correlated reindexing or generic
    batching.
  assumptions:
    - The attacked object inside the test boundary is a synthetic toy MLWE instance with a planted secret; no standardized ML-KEM parameter set is attacked or solved.
    - Passive public-key data only; no decapsulation, failure, timing, power, hint, or plaintext-checking oracle is available anywhere in the design.
    - The exact centered-binomial eta=3 law with integer weights is used for secrets and errors; no sparse, binary, or uniform substitute.
    - One p-adic layer of a frozen simplified layered-dual scoring task is the measurement surface; the carry-aware LaMS layer derivation required by DEC-20260722-003 is a separate open prerequisite this hypothesis does not claim to discharge.
    - Covariance estimation and orbit-subset selection use only training instances; held-out instances come from the same frozen sampler with disjoint seeds.
    - Short-vector score tails are modeled with the Ducas--Pulles dependence correction discipline, not an independence heuristic.
    - Reuse is credited only within one target instance; no cross-instance preprocessing is claimed.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For the frozen toy sampler, pool construction, and selected orbit
        subset, the wrong-candidate orbit-score covariance matrix Sigma
        estimated on the 15 training instances is representative of
        held-out instances from the same distribution: GLS weights fitted
        on training instances keep their held-out false-positive rate
        within the frozen factor-2 prediction band computed from the
        training covariance, and the held-out effective rank
        r_eff = (tr Sigma)^2 / tr(Sigma^2) deviates from its training
        estimate by less than 50 percent.
      random_model_justification: >-
        Each wrong-candidate orbit score is a sum of many weakly dependent
        near-zero-mean terms over pool vectors and ring coordinates, so by
        a law-of-large-numbers argument the per-instance score vector
        concentrates and a covariance estimator over 15 independent
        instances sits close to its expectation. The isometry orbit
        contributes signed permutations of the same summands, which changes
        covariance structure but not this concentration argument. No
        independence between orbit scores is assumed; that is exactly the
        dependence the covariance model is required to capture.
      supporting_results:
        - >-
          EV-MLKEM-001 (internal literature/derivation review): negacyclic
          monomial isometries preserve ML-KEM's centered-binomial laws, and
          orbit-target scoring is adjoint to known rotated-vector scoring,
          so rank and covariance must be measured, not assumed.
        - >-
          Ducas--Pulles score-dependence correction, doi
          10.1007/s00145-025-09560-7, as recorded in the novelty screen of
          coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-201/candidate_report.yaml:
          naive score independence is invalid and covariance discipline is
          required.
      validation_experiment_ids: [EXP-MLKEM-007]
      falsification_condition: >-
        The held-out false-positive rate under GLS fusion falls outside the
        frozen factor-2 band predicted from the training covariance, or the
        held-out effective rank deviates from its training estimate by 50
        percent or more, or naive unweighted averaging matches GLS on
        held-out instances.
  structural_ingredients:
    - description: >-
        Exact invariance of the centered-binomial secret/error laws under
        negacyclic monomial isometries; makes one short-vector pool
        reusable across the orbit without distributional error.
      citation: >-
        EV-MLKEM-001 (internal literature/derivation review under
        coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/), confirmed by
        both independent reviews recorded there.
      role: distribution_law
    - description: >-
        Isometry-aware code-based dual hybrid comparator; after an
        author-confirmed estimator bug its corrected isometric gains are
        approximately 0--0.8 bit, which bounds plausible headroom and
        forbids paraphrasing toy gains as standardized-baseline
        improvements.
      citation: >-
        ePrint 2026/279 as recorded in
        coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-201/candidate_report.yaml
        and corrected in EV-MLKEM-001.
      role: matched_comparator
    - description: >-
        Score false-positive discipline under dependence; forbids
        independence weighting in the fusion rule.
      citation: >-
        Ducas--Pulles, doi 10.1007/s00145-025-09560-7, as recorded in the
        candidate report novelty screen.
      role: covariance_model
  reduction_chain: null
  predictions:
    - metric: orbit_score_effective_rank
      direction: higher
      minimum_effect: >-
        r_eff >= 4.0 on held-out n=64 instances for at least one selected
        orbit subset of size at most 32, where
        r_eff = (tr Sigma)^2 / tr(Sigma^2); gate: r_eff >= 2.0 at n=32.
    - metric: short_vector_count_for_50_percent_layer_success
      direction: lower
      minimum_effect: >-
        The fused pipeline needs at least 4x fewer short vectors than the
        unfused single-orbit baseline at n=64 (gate: at least 2x at n=32)
        to reach 50 percent layer success at matched held-out
        false-positive rate in the frozen single-layer scoring task.
    - metric: held_out_false_positive_rate_gls_vs_unweighted
      direction: lower
      minimum_effect: >-
        At least 2x lower for GLS fusion than for naive unweighted orbit
        averaging on the same vectors and score threshold.
    - metric: total_charged_score_work
      direction: lower
      minimum_effect: >-
        The frozen integer-operation plus memory-traffic accounting of the
        fused pipeline, including covariance estimation and orbit-subset
        search, is below the unfused baseline's scoring work for the same
        task; a vector-count gain with equal or greater total work is
        non-material.
    - metric: true_orbit_vs_random_signed_permutation_gain
      direction: different
      minimum_effect: >-
        The true negacyclic orbit retains at least 1.0 bit more projected
        total-cost gain under the frozen toy cost model than size-matched
        random signed permutations fixed before seeing each secret;
        otherwise the effect is generic batching, not ring structure.
  test_boundary:
    instances:
      - >-
        Synthetic MLWE instances over Z_3329[X]/(X^n+1), n in {32, 64},
        module rank k=2, planted secrets and errors iid centered-binomial
        eta=3; 30 frozen seeds per n, split 15 training / 15 held-out
        before any covariance estimation.
      - One matched short-vector pool per instance from the frozen toy pool construction, reused across all selected orbit elements.
      - Size-matched random signed permutation controls fixed before seeing each secret.
    parameters:
      q: 3329
      n: [32, 64]
      module_rank_k: 2
      cbd_eta: 3
      layer_prime_p: 3
      layers_measured: 1
      orbit_subset_size_cap: 32
      training_seeds_per_n: 15
      held_out_seeds_per_n: 15
    implementation: >-
      New scoring-layer-only implementation under
      experiments/EXP-MLKEM-007/implementation/: exact small-ring MLWE
      sampler with integer-weight CBD, negacyclic orbit scoring by direct
      and batched-convolution evaluation, covariance estimation and GLS
      fusion, ablation and permutation controls, and operation/memory
      instrumentation. No BKZ, no standardized-parameter estimator run, no
      LaMS p-adic stack beyond the frozen single-layer scoring task.
    budget:
      wall_clock_seconds: 6000
      cpu_hours: 2.0
      maximum_memory_gb: 4
      maximum_runs: 4
  falsification_conditions:
    - >-
      The covariance-model control fails: per-orbit coefficient laws
      deviate from the exact centered-binomial eta=3 distribution beyond
      sampling error at the frozen chi-square and moment tolerance.
    - >-
      The known-answer control fails: the unfused baseline cannot recover
      the planted secret at the reference vector count, so the instrument
      is inadequate.
    - >-
      Held-out r_eff is below 2.0 at n=32 (gate stop) or below 4.0 at n=64
      for every selected subset of size at most 32: correlated reindexing.
    - >-
      The held-out short-vector requirement is not reduced by at least 2x
      at n=32 (gate) or 4x at n=64 at matched false-positive rate.
    - >-
      GLS fusion does not beat naive unweighted averaging by at least 2x in
      held-out false-positive rate: fusion has no advantage over the
      ablation baseline.
    - >-
      Size-matched random signed permutations reproduce the true-orbit gain
      within 1.0 projected bit under the frozen toy cost model: generic
      batching.
    - >-
      Total charged score work of the fused pipeline is not below the
      unfused baseline's despite any vector-count gain: non-bottleneck
      local gain.
    - HEUR-001's falsification condition triggers: the covariance model does not transfer to held-out instances.
  distinguishable_outcomes:
    structural_information_gain_candidate: >-
      All controls pass; n=32 gate and n=64 thresholds met; true orbit
      beats random signed permutations; total charged work falls. Supports
      H-MLKEM-007 within the toy boundary only and justifies a full
      derivation and estimator study, nothing more.
    correlated_reindexing: >-
      Held-out effective rank is below the gate/threshold. Orbit scores are
      reindexings with rank near one; the composition is rejected at toy
      scale.
    fusion_no_advantage: >-
      GLS fusion does not beat naive unweighted averaging on held-out
      false-positive rate; the covariance-aware term contributes nothing.
    generic_batching: >-
      Random signed permutations match the true orbit within 1.0 projected
      bit; any gain is a generic implementation optimization.
    non_bottleneck_local_gain: >-
      Vector counts improve but total charged score work does not; the
      local gain is consumed by covariance, scoring, memory, or retry
      costs.
    known_answer_baseline_failed: >-
      The unfused baseline cannot recover the planted secret at the
      reference vector count. Instrument inadequacy; no conclusion about
      the mechanism.
    covariance_control_failed: >-
      The isometry fails to preserve the centered-binomial law at the
      frozen tolerance. The mechanism's distribution premise fails at toy
      scale.
    invalid_implementation_or_instrumentation: >-
      Scalar and batched scores disagree on an exact small-instance check,
      seed discipline is violated, or required artifacts are missing.
      Infrastructure only.
  interpretation_limits:
    - Toy lattices support no conclusion about standardized ML-KEM; per RQ-MLKEM-001 constraints, toy-instance improvements are hypothesis-generating only.
    - This is a speculative composition test, not a demonstrated attack (the proposal's own words); no ML-KEM-512/768/1024 solve, estimator projection, or asymptotic claim is made.
    - The experiment tests scoring-layer statistics only. DEC-20260722-003's required carry-aware LaMS layer derivation and corrected commit-pinned matched baseline remain open prerequisites for any full-attack claim and are not discharged here.
    - A passing result justifies only a full derivation and estimator study; even an eventual 2-bit-class estimator refinement would be a concrete refinement, not an asymptotic breakthrough or a practical ML-KEM break.
    - The corrected ePrint 2026/279 isometric gains (approximately 0--0.8 bit per EV-MLKEM-001) bound the plausible headroom; results must not be paraphrased as improving a standardized matched baseline.
    - Nothing here bears on side-channel, fault, or oracle-dependent attacks, or on MLWE hardness in general.
  selected_by: coordinator
  source_proposal: IDEA-20260722-001
  evidence_basis: [EV-MLKEM-001]
  status: approved
  proposed_by: coordinator
