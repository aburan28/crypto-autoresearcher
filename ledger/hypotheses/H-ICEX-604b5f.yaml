      citation: CORR-20260810-eb9062
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 124 lines.
      role: a blocking contract requirement and the source of the M2 statistic
    - description: >-
        The explicit form of S_3 and the two semi-invariance biconditionals at
        a = 0 and b = 0. THE EXPLICIT FORM IS WHAT THE DERIVATION IN STATEMENT (A)
