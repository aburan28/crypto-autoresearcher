      citation: IDEA-20260807-5ddccf
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (claim (A) and
        mechanism blocks read verbatim; the remainder not opened).
      role: the polynomial the derivation acts on, and the basis of HEUR-SING-2
    - description: >-
        The degeneration-divisor catalogue, cited for the fact that S_3 has NO
        weight-12 coefficient factor, which is why P2 has no object at m = 3 and why
        the m = 4 arm is the only place it can be tested.
      citation: IDEA-20260811-a7c1df
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 459 lines.
      role: the locus catalogue and the source of the m = 3 scope limit
    - description: >-
        The automorphism-discounted rho baseline under which a factor at or below
        sqrt(6) is baseline calibration. RELAYED- this agent did NOT open
        knowledge/techniques/KN-TECH-018.md; the threshold is quoted from
        RQ-JINV-8fc13a decision_target, which this agent read in full.
      citation: KN-TECH-018
      provenance: recalled
      verified_by: null
      role: the comparator any future cost claim would be charged against; none is made here
  reduction_chain:
    core_problem: >-
      Whether any computable invariant of the Semaev hypersurface distinguishes the
      j-line degeneration loci from generic curves, given that the reduced affine
      singular locus at m = 3 is derived here to be constant.
    corollaries:
      - problem: >-
          Whether the coordinate-accident or the geometric reading of the
          degeneration divisor is supported.
        reduction_ref: >-
          Internal- no published reduction is cited. The derivation in statement (A)
          is this record own and is offered for machine verification.
        asymptotics_preserved: >-
          Not applicable. No cost is measured, no exponent is claimed, sota_delta
          zero.
  predictions:
    - metric: >-
        P1- DEGENERACY AUDIT- the number of DISTINCT values taken by each of
        (affine dim, affine deg), the multiplicity excess, the homogenised
        (dim, deg) and the Hilbert series, across generic, a = 0, b = 0, ten random
        curves and the weight-12 loci at m = 3 (count)
      direction: different
      minimum_effect: >-
        THIS IS THE BLOCKING PRE-COMPUTE GATE AND THE PRIMARY DELIVERABLE. Derived
        prediction- the affine pair takes EXACTLY ONE value, (0, 6), at all of them.
        If EVERY statistic takes exactly one value, the m = 3 arm HAS NO DYNAMIC
        RANGE, is declared NON-DISCRIMINATING, and the run proceeds on m = 4 alone
        or terminates with the derivation note as its deliverable.
    - metric: >-
        P2- affine (dim Sing, deg Sing) at a = 0 and at b = 0, m = 3
      direction: different
      minimum_effect: >-
        DERIVED PREDICTION (0, 6), IDENTICAL TO GENERIC. THIS REVERSES THE SOURCE
        PREDICTION, which asked for a strict increase. The derivation in statement
        (A) is the reason, and a machine confirmation of (0, 6) at a = 0 and b = 0
        REFUTES the source P1 ANALYTICALLY. A strict increase at either would refute
        THIS record derivation instead and is by far the more interesting outcome,
        requiring the derivation to be re-examined before anything else is read.
    - metric: >-
        P3- multiplicity excess M1 = deg(J_affine) minus the number of DISTINCT
        affine singular points, per locus, m = 3 (non-negative integer)
      direction: higher
      minimum_effect: >-
        NULL VALUE 0, established by the fixture where degree 6 matches six distinct
        points. ALTERNATIVE AT LEAST 1 - an integer-valued statistic with a null of
        exactly zero and a one-sided alternative, so it cannot be crossed by noise.
        A strictly positive excess at a = 0 or b = 0 supports HEUR-SING-2 in its
        surviving multiplicity form.
    - metric: >-
        P4- homogenised (dim, deg) per locus, reported in a SEPARATE LABELLED COLUMN
        with its ring named, m = 3
      direction: different
      minimum_effect: >-
        BASELINE dimension 1 on the fixture, per CORR-20260810-eb9062. The generic
        homogenised DEGREE is established in the audit and any locus differing from
        it by at least 1 is a pre-registered positive. The behaviour at infinity is
        NOT fixed by the affine derivation, which is why this statistic retains
        freedom.
    - metric: >-
        P5- affine (dim, deg), multiplicity excess and Hilbert series at the six
        weight-12 loci, m = 4
      direction: different
      minimum_effect: >-
        IDENTICAL TO THE m = 4 GENERIC VALUES AT ALL SIX. Any single change is a
        pre-registered positive. IF THE m = 4 ARM IS CENSORED, THIS PREDICTION IS
        UNTESTED, NOT CONFIRMED - a budget stop may never be read as evidence that
        the weight-12 loci are inert.
    - metric: >-
        P6- blocking fixture- affine dimension and degree on (a,b) = (441, 294) at
        p = 4001
      direction: different
      minimum_effect: >-
        EXACTLY 0 AND 6 IN BOTH ENGINES, with homogenised dimension 1 reported
        separately. Any other value blocks the run. THE DERIVATION IN STATEMENT (A)
        PREDICTS THIS INDEPENDENTLY OF THE COMMITTED ARTIFACT, so agreement is a
        two-route check rather than a single-source reproduction.
    - metric: >-
        P7- planted defects of known magnitude
      direction: different
      minimum_effect: >-
        FORCED VALUES. On the polynomial S_3 times a declared linear form L the
        pipeline must report affine dimension EXACTLY 1, since the singular locus
        contains the curve V(S_3) intersect V(L); on S_3 squared it must report
        affine dimension EXACTLY 2, the whole surface. A pipeline that does not
        detect a dimension jump of known size CANNOT DETECT A REAL ONE and every
        negative it reports is VOID.
    - metric: >-
        P8- engine and order agreement rate
      direction: different
      minimum_effect: >-
        100 PERCENT of computed cells agree between two engines sharing no code
        path, and between two monomial orders. Dimension and degree are
        order-independent mathematically, so disagreement is an implementation
        error and nothing is established until reconciled.
    - metric: >-
        P9- SAME-POLYTOPE RANDOM-POLYNOMIAL CONTROL- the identical pipeline on a
        random polynomial with the same Newton polytope as S_m, specialised to the
        same loci
      direction: different
      minimum_effect: >-
        PREDICTED to show the SAME locus-independence as S_m. PRE-STATED
        CONSEQUENCE- if a random same-polytope polynomial shows the same behaviour
        at the loci, any result here is a statement about SPECIALISING POLYNOMIALS
        TO A COEFFICIENT SUBVARIETY and NOT about Semaev geometry or elliptic
        curves, and may not be quoted as one.
  test_boundary:
    instances:
      - >-
        The frozen fixture (a,b) = (441, 294) at p = 4001.
      - >-
        A generic curve, a = 0, b = 0, one curve on each of the six weight-12 loci,
        and ten random curves, at p = 4001 and at one prime above 2^20.
      - >-
        C-NULL-LOCUS- ten random weight-12 loci not among the eight, identical
        pipeline.
      - >-
        PLANTED DEFECT ARM- the polynomials S_3 times a declared linear form, and
        S_3 squared, whose singular-locus dimensions are known in advance.
      - >-
        SAME-POLYTOPE RANDOM-POLYNOMIAL CONTROL at each locus.
    parameters:
      m: '3 as the blocking instrument arm; 4 as the only arm in which P2 is testable'
      p: '4001 and one prime above 2^20; p in {2, 3} excluded explicitly'
      ideal: 'f_V-free Jacobian ideal, S_m together with its m partial derivatives'
      rings: 'affine and homogenised, computed separately and reported in separate labelled columns'
      orders: 'degrevlex and one further order; dimension and degree must agree'
      engines: 'two engines sharing no code path, named in the manifest'
    implementation: >-
      Symbolic computation only. No sampling, no timing-based metric, no p-value.
      The m = 4 Jacobian ideal is the memory risk and the contract caps it; an
      exceedance is a CENSORED cell and never a negative.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 12.0
      maximum_memory_gb: 16
      maximum_runs: 30
  falsification_conditions:
    - >-
      F1. The fixture does not reproduce affine (0, 6). The pipeline disagrees with
      a committed review computation AND with the derivation in statement (A), and
      nothing is admissible.
    - >-
      F2. THE DEGENERACY AUDIT SHOWS EVERY STATISTIC CONSTANT AT m = 3. The m = 3
      arm is NON-DISCRIMINATING, which is the predicted outcome and is a real
      result- the singular-locus functional cannot separate the degeneration
      divisor because it IS the 2-torsion locus. The run proceeds on m = 4 alone or
      terminates with the derivation note.
    - >-
      F3. The affine pair MOVES at a = 0 or b = 0 at m = 3. THE DERIVATION IN
      STATEMENT (A) IS WRONG. That is the most interesting available outcome; the
      derivation must be re-examined symbolically before any other reading, and the
      source P1 would be reinstated.
    - >-
      F4. A random locus in C-NULL-LOCUS moves a statistic. Specialisation artifact;
      every positive is void.
    - >-
      F5. A planted defect is not detected at its known dimension. The pipeline
      cannot see a jump of known size and EVERY NEGATIVE IT REPORTS IS VOID; the run
      is INVALID rather than negative.
    - >-
      F6. Two engines or two monomial orders disagree. Implementation error, never a
      result; nothing established until reconciled.
    - >-
      F7. The m = 4 arm is censored by time or memory. P2 IS UNTESTED. Under
      AGENTS.md rule 5 this is an infrastructure receipt and is NEVER a statement
      that the weight-12 loci are inert.
    - >-
      F8. The same-polytope random-polynomial control reproduces the behaviour at
      the loci. Any result is about specialising polynomials to a coefficient
      subvariety and NOT about Semaev geometry or elliptic curves.
  interpretation_limits:
    - >-
      THE DERIVATION IN STATEMENT (A) IS THIS AGENT OWN HAND ARITHMETIC ON A
      COMMITTED FORM OF S_3, AND IS TO BE MACHINE-VERIFIED RATHER THAN TRUSTED. It
      establishes CONTAINMENT exactly - the six permutations of the cubic roots are
      singular points for every (a, b) - and EQUALITY only on the one committed
      fixture. The m = 4 count of 21 is a derivation SKETCH, with containment argued
      and equality unchecked and no fixture available.
    - >-
      A j-LINE RESULT, COLLIDING ON TWISTS, therefore carrying no isogeny-class
      information in either direction. AND, AFTER THE DERIVATION, COLLIDING ON
      EVERYTHING AT m = 3.
    - >-
      f_V-FREE FORMULATION ONLY. Non-transferable to the deployed system by the same
      argument that makes it a curve functional at all.
    - >-
      IF THE m = 4 ARM IS CENSORED, P2 IS UNTESTED AND NOT CONFIRMED. Stated here
      because the reachable-scale answer for the weight-12 loci may simply be that
      they are not reachable- the m = 4 Jacobian ideal is the memory risk and its
      feasibility is unknown before the audit runs.
    - >-
      NO TIME IS MEASURED AND NO COST CONSEQUENCE IS ASSERTED. A positive-dimensional
      singular locus is a genuine input to solver behaviour, since the system is
      then not a regular sequence, but this record MEASURES NO TIME and refuses to
      assert the connection.
    - >-
      IF THE SAME-POLYTOPE RANDOM-POLYNOMIAL CONTROL REPRODUCES THE BEHAVIOUR,
      NOTHING HERE IS A STATEMENT ABOUT SEMAEV GEOMETRY OR ELLIPTIC CURVES.
      Pre-stated so it cannot be renegotiated after the data.
    - >-
      Degree computed as vector-space dimension counts MULTIPLICITY, and the number
      of distinct points is computed separately. Reporting one as the other is
      exactly the confusion M1 is built to expose.
    - >-
      claim_tier toy. No attack, no exponent, no speedup, sota_delta zero.
      Dominated by every row of the attack frontier, since no solver is produced.
