hypothesis:
  id: H-ICEX-604b5f
  question_id: RQ-JINV-8fc13a
  source_idea_id: IDEA-20260811-34f29d
  title: >-
    THE SINGULAR LOCUS OF THE SEMAEV HYPERSURFACE AT m = 3 IS THE 2-TORSION LOCUS
    AND IS (dim, deg) = (0, 6) FOR EVERY NONSINGULAR CURVE - DERIVED AND VERIFIED
    BY HAND HERE - so the source pre-registered split P1 CANNOT FIRE AT m = 3, its
    six weight-12 loci DO NOT EXIST AT m = 3 AT ALL, and the discriminator is
    rebuilt as a scheme-theoretic multiplicity excess plus the homogenised locus,
    behind a blocking seconds-long degeneracy audit that decides before compute
    whether ANY of them has dynamic range
  statement: >-
    (A) THE DERIVATION, PERFORMED IN THIS RECORD AND OPEN TO MACHINE CHECK. Write
    S_3(x1,x2,x3) = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3
    + ((x1 x2 - a)^2 - 4 b (x1+x2)), the form committed in IDEA-20260807-5ddccf
    claim (A). Let r1, r2, r3 be the roots of the curve cubic x^3 + a x + b, i.e.
    the x-coordinates of the three nonzero 2-torsion points. Substituting
    e1 = r1+r2+r3 = 0, e2 = a, e3 = -b gives, BY DIRECT ARITHMETIC-
      (r1-r2)^2 = r3^2 - 4 r1 r2 = -3 r3^2 - 4a, since r1 r2 = a + r3^2;
      dS_3/dx3 at (r1,r2,r3) = 2(r1-r2)^2 r3 - 2[(r1+r2)(r1 r2 + a) + 2b]
        = 2(-3 r3^3 - 4a r3) - 2(-r3^3 - 2a r3 + 2b)
        = -4(r3^3 + a r3 + b) = 0;
      S_3 at (r1,r2,r3) = (-3 r3^2 - 4a) r3^2 + 2 r3^4 + 4a r3^2 - 4b r3
        + r3^4 + 4b r3 = 0.
    S_3 is symmetric, so all three partials vanish there too. THEREFORE THE SIX
    PERMUTATIONS OF THE CUBIC ROOTS ARE SINGULAR POINTS OF V(S_3) FOR EVERY (a,b).
    This is the geometric content of the Kummer picture- V(S_3) is the image of the
    surface {P1+P2+P3 = O} in E^3 under the x-map, a 2-to-1 quotient by the
    simultaneous sign flip whose affine fixed points are exactly the triples of
    NONZERO 2-torsion summing to O, of which there are exactly 3! = 6.
    (B) THE COMMITTED FIXTURE CONFIRMS EQUALITY ON ONE CURVE. DEC-20260810-d70ece
    records VERBATIM that msolve returned, for the f_V-free Jacobian ideal at
    (a, b) = (441, 294) over F_4001, the reduced grevlex basis
    [x1 + x2 + x3, x2^2 + x2 x3 + x3^2 + 441, x3^3 + 441 x3 + 294], whose leading
    monomials {x1, x2^2, x3^3} give affine dimension 0 and degree 6. THAT IDEAL IS
    EXACTLY (e1, e2 - a, e3 + b), the ideal of the six permutations. The staircase
    {x2^i x3^j : i < 2, j < 3} HAS VECTOR-SPACE DIMENSION 1*2*3 = 6 FOR EVERY
    (a, b), so if the Jacobian ideal keeps that form the degree is 6 identically.
    (C) THE CONSEQUENCE, WHICH BREAKS THE SOURCE DESIGN. The source pre-registers
    P1- dim or deg Sing STRICTLY LARGER at a = 0 and at b = 0 than generically. But
    at a = 0 the cubic is x^3 + b with three distinct roots whenever b is nonzero
    and p is not 3, and at b = 0 it is x(x^2 + a) with three distinct roots
    whenever a is nonzero. THE SIX POINTS ARE STILL SIX DISTINCT POINTS AND THE
    STATISTIC DOES NOT MOVE. UNDER THE DERIVATION ABOVE, (dim, deg) Sing IS
    (0, 6) IDENTICALLY OVER EVERY NONSINGULAR CURVE IN CHARACTERISTIC NOT 2 OR 3,
    INCLUDING ALL EIGHT DEGENERATION LOCI. THE DISCRIMINATOR IS WIDTH-ZERO BY
    CONSTRUCTION AND P1 CANNOT FIRE AT m = 3.
    (D) THE SECOND DEFECT- P2 HAS NO OBJECT AT m = 3. IDEA-20260811-a7c1df states
    VERBATIM that S_3 HAS NO WEIGHT-12 COEFFICIENT FACTOR, so the six weight-12
    loci first appear at m = 4 and the m = 3 arm can only see j = 0 and j = 1728.
    THE m = 4 ARM IS THEREFORE THE ONLY ARM IN WHICH P2 IS TESTABLE, and the source
    itself declares m = 4 a stretch. PRE-REGISTERED HERE- IF THE m = 4 ARM IS
    CENSORED, P2 IS UNTESTED, NOT CONFIRMED. A budget stop may never be read as
    evidence that the weight-12 loci are inert.
    (E) WHAT REPLACES THEM, AND WHY THESE HAVE A CHANCE. Three statistics survive
    the derivation with genuine freedom-
      M1, MULTIPLICITY EXCESS = deg(J_affine) - (number of DISTINCT affine singular
        points). The derivation fixes the reduced locus but NOT the scheme
        structure; the fixture value is 6 - 6 = 0, and a group action creating
        non-reduced structure at a = 0 or b = 0 would move it to a strictly
        positive integer. Null value 0, alternative at least 1, integer-valued.
      M2, THE HOMOGENISED (dim, deg), which CORR-20260810-eb9062 records VERBATIM
        is dimension 1 on five class members while the affine value is 0 and degree
        6. The behaviour at infinity is where the 2-torsion triples involving the
        point at infinity live and is NOT fixed by the affine derivation.
      M3, THE HILBERT SERIES of the affine Jacobian ideal, reported in full rather
        than collapsed to (dim, deg).
    (F) THE BLOCKING DEGENERACY AUDIT, WHICH IS THE HONEST CENTREPIECE. Before any
    main cell runs, compute all three statistics at m = 3 for a generic curve, for
    a = 0, for b = 0, for ten random curves and for one curve on each weight-12
    locus. THIS COSTS SECONDS. IF ALL THREE ARE CONSTANT ACROSS EVERY ONE OF THEM,
    THE m = 3 ARM HAS NO DYNAMIC RANGE, IT IS DECLARED NON-DISCRIMINATING, AND THE
    RUN EITHER PROCEEDS ON m = 4 ALONE OR TERMINATES WITH THE DERIVATION NOTE AS
    ITS DELIVERABLE. That negative - the singular-locus functional cannot separate
    the degeneration divisor because it IS the 2-torsion locus - is a real result
    and is the most likely one.
  mechanism: >-
    WHY THE OBJECT WAS CHOSEN AND WHY THE DERIVATION UNDERCUTS IT. Singular-locus
    dimension and degree are model-independent up to isomorphism of the
    hypersurface, so they were proposed to discriminate a COORDINATE ACCIDENT from
    a GEOMETRIC DEGENERATION where support cannot. That property is real. What the
    derivation shows is that at m = 3 the invariant is determined by E[2], hence by
    the roots of x^3 + a x + b, hence by a datum that is the SAME SHAPE at every
    nonsingular curve- three distinct roots. Model independence bought
    interpretability and cost all variation.
    THE SAME ARGUMENT AT m = 4, STATED AS A RISK RATHER THAN A RESULT. V(S_4) is
    the image of the 3-fold {P1+...+P4 = O} in E^4 under the x-map, quotiented by
    the simultaneous sign flip, whose fixed locus is again the all-2-torsion locus.
    Counting 4-tuples of NONZERO 2-torsion summing to O in the Klein four-group-
    choose P1, P2, P3 freely from the three nonzero elements (27 ways), then
    P4 = P1+P2+P3 must be nonzero, which fails only for the 6 orderings of the
    three distinct elements, leaving 21. SO THE m = 4 REDUCED SINGULAR LOCUS IS
    PLAUSIBLY 21 POINTS FOR EVERY CURVE AND MAY BE JUST AS CONSTANT. THIS IS A
    DERIVATION SKETCH AND NOT A THEOREM- the containment argument is the same as at
    m = 3 but equality was not checked and no fixture exists at m = 4. It is
    recorded so the m = 4 arm is not entered believing the statistic must move, and
    it is exactly what the degeneracy audit tests at m = 4 before the expensive
    cells run.
    WHERE FREEDOM REMAINS. Nothing in the derivation constrains the SCHEME
    structure of the Jacobian ideal, the behaviour at infinity, or the full Hilbert
    series. A finite group action along its fixed locus is precisely the mechanism
    that could create non-reduced structure, so M1 is the statistic the source
    heuristic H2 actually bears on, and the source chose the wrong projection of it.
    WHY THE PLANTED DEFECT IS NOT A CURVE. Because the derivation says the curve
    cannot move the statistic, a planted defect must be a POLYNOMIAL rather than a
    curve. Multiplying S_3 by a declared linear form L makes the singular locus
    contain V(S_3) intersect V(L), a curve, so dim jumps from 0 to 1 by
    construction; squaring S_3 makes the whole surface singular, dim 2. Both are
    defects of exactly known magnitude that the pipeline must report.
  assumptions:
    - >-
      Characteristic p is not 2 and not 3, so the partial derivatives behave and
      the cubic has three distinct roots exactly when the curve is nonsingular.
      p = 4001 satisfies this and the contract excludes small characteristic
      explicitly.
    - >-
      The ideal is built WITHOUT the factor-base membership polynomials, so the
      object is a functional of the CURVE rather than of the factor-base size.
    - >-
      AFFINE AND HOMOGENISED VALUES ARE REPORTED DISTINCTLY, both labelled, with
      the RING each was computed in named, per CORR-20260810-eb9062. This is a
      BLOCKING contract requirement and not a note.
    - >-
      Degree computed as vector-space dimension of the quotient COUNTS
      MULTIPLICITY. The contract states which convention it reports and uses one;
      the number of DISTINCT points is computed separately, because M1 is exactly
      the difference between them.
    - >-
      The degeneration loci are as catalogued in IDEA-20260811-a7c1df, re-derived
      as gate 1 rather than assumed.
    - >-
      UNITS. Dimension and degree are DIMENSIONLESS NON-NEGATIVE INTEGERS. NO TIME
      IS MEASURED AND NO COST IS CLAIMED anywhere in this record; wall-clock is
      recorded for budget only and enters no comparison.
  proof_search_map:
    bottleneck: >-
      The geometric-versus-combinatorial ambiguity- without a model-independent
      invariant, no amount of support data decides whether the degeneration is
      real. THE DERIVATION IN STATEMENT (A) SHOWS THAT THE CHEAPEST SUCH INVARIANT,
      dim and deg of the reduced singular locus at m = 3, IS CONSTANT, so the
      bottleneck moves to the scheme structure and the behaviour at infinity.
    baseline_embedding:
      parameter_slice: >-
        The generic curve at p = 4001, with the specific frozen fixture being the
        validator committed computation- for the f_V-free Jacobian ideal at
        (a,b) = (441, 294), msolve returned the reduced grevlex basis
        [x1 + x2 + x3, x2^2 + x2 x3 + x3^2 + 441, x3^3 + 441 x3 + 294], giving
        affine dimension 0 and degree 6, with homogenised dimension 1.
      reproduction_check: >-
        The pipeline must reproduce affine (0, 6) and homogenised dimension 1 on
        that exact curve, in BOTH engines, before any other curve is computed. A
        frozen regression fixture drawn from a committed review artifact, not a
        curve chosen by this record. THE DERIVATION IN (A) PREDICTS THAT FIXTURE
        INDEPENDENTLY, which is the strongest single check available here- two
        independent routes to the same (0, 6).
    observation_collision:
      observable: >-
        The pair (dim Sing, deg Sing) of the affine Jacobian ideal.
      distinct_preimage_search: >-
        PERFORMED AND SEVERELY POSITIVE, AND THAT IS THE FINDING. Twists share j
        and therefore the whole hypersurface up to the weighted substitution, so
        the pair collides across isogeny classes exactly as support does - that was
        already known. THE DERIVATION IN (A) SHOWS A FAR WORSE COLLISION- the pair
        is (0, 6) for EVERY nonsingular curve in characteristic not 2 or 3, so its
        preimage is the whole moduli space and it separates NOTHING. A functional
        whose fibre is everything is not a discriminator, and the source design
        rests on it being one.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace (dim, deg) of the reduced locus by the SCHEME-THEORETIC data-
          the multiplicity excess deg(J_affine) minus the number of distinct
          affine singular points, the FULL HILBERT SERIES of the Jacobian ideal,
          and the HOMOGENISED (dim, deg) reported distinctly. The Hilbert series is
          determined by the initial ideal and so is obtainable from a Groebner
          basis on this host, unlike graded Betti numbers, which are not determined
          by the initial ideal and are exactly why the predecessor stopped.
        predicted_gain: >-
          Restores the possibility of variation- the derivation fixes the REDUCED
          locus and says nothing about multiplicity, about infinity, or about the
          graded structure. This is a strict strengthening at no infrastructure
          cost, and identifying it is this record main technical contribution.
      - transform: boundary_lift
        proposed_object: >-
          Move the primary arm from m = 3 to m = 4, where the six weight-12 loci
          actually exist, and treat m = 3 solely as a blocking instrument check
          against a value the derivation predicts in advance.
        predicted_gain: >-
          P2 becomes testable at all. At m = 3 it has no object, since S_3 has no
          weight-12 coefficient factor.
    quantifier_order: >-
      AS THE SOURCE STATES IT- FOR ALL six weight-12 loci the pair equals its
      generic value, and THERE EXIST two loci (a = 0, b = 0) where it differs.
      AS THIS RECORD RESTATES IT AFTER THE DERIVATION- FOR ALL nonsingular (a, b)
      in characteristic not 2 or 3, the REDUCED affine singular locus of V(S_3) is
      the set of 6 permutations of the roots of x^3 + a x + b, so the pair is
      (0, 6) universally and the existential half is FALSE AT m = 3. The surviving
      existential is on the SCHEME statistics- THERE EXISTS a locus at which the
      multiplicity excess, the homogenised degree or the Hilbert series differs
      from generic - and it is that, not the source statement, that the contract
      tests.
    method_ceiling:
      strongest_certifiable_claim: >-
        A multiplicity-excess, affine and homogenised dimension and degree, and
        Hilbert-series table for the f_V-free Jacobian ideal at the reachable loci
        and a generic control, at two primes, cross-checked in two engines. IT
        CANNOT CERTIFY A SOLVING-COST CONSEQUENCE and cannot certify anything about
        the deployed f_V-bearing system.
      nearby_object_control: >-
        A DIFFERENT MODEL OF THE SAME CURVE. If a statistic moves at a locus in
        short Weierstrass coordinates but not in another model of the same curve,
        the effect was a coordinate artifact and the method has not identified
        intrinsic structure. Since the derivation already shows the reduced pair is
        model-independent AND constant, this control now bears on the SCHEME
        statistics, which is where the remaining freedom is.
    proof_obligations:
      - claim: The baseline fixture reproduces affine (0, 6) and homogenised dimension 1
        responsibility: baseline
      - claim: >-
          The derivation in statement (A) is machine-verified symbolically - the
          six permutations of the cubic roots satisfy S_3 and all three partials
          for symbolic (a, b)
        responsibility: correctness
      - claim: >-
          The degeneracy audit determines, before the main run, whether any of the
          three statistics varies at m = 3 across generic, a = 0, b = 0, ten random
          curves and the weight-12 loci
        responsibility: feasibility
      - claim: Affine and homogenised values are reported distinctly with their rings named
        responsibility: interface
      - claim: An independent engine confirms every value
        responsibility: correctness
      - claim: >-
          A censored m = 4 arm leaves P2 UNTESTED and is never reported as
          confirming it
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-SING-1
      formal_statement: >-
        Dimension, degree and the Hilbert series of the Jacobian ideal are exactly
        recoverable from the staircase of a reduced Groebner basis in any degrevlex
        order, so an engine that computes a Groebner basis computes all three.
      random_model_justification: >-
        NOT A HEURISTIC BUT A THEOREM PLUS A VERIFIED INSTANCE, and it is recorded
        here as the reason the contract is executable at all. Dimension, degree and
        the Hilbert series are determined by the INITIAL ideal; graded Betti
        numbers are not, which is precisely why the predecessor contract had no
        independent engine for them on this host.
      supporting_results:
        - ref: DEC-20260810-d70ece
          provenance: internal
          claim: >-
            VERBATIM- msolve 0.9.5 supports -g 2 and prints the full reduced
            grevlex Groebner basis; degree is a function of the initial ideal
            exactly as dimension is; the validator demonstrated it on the f_V-free
            Jacobian ideal of (a, b) = (441, 294), where msolve returned
            [x1 + x2 + x3, x2^2 + x2 x3 + x3^2 + 441, x3^3 + 441 x3 + 294], whose
            leading monomials {x1, x2^2, x3^3} give affine dimension 0 and degree 6,
            agreeing with Sage vector_space_dimension with no Sage in the
            computation path. VERBATIM ALSO- graded Betti numbers have no
            independent engine on this host at all, and that single fact made the
            predecessor cross-check criterion unmeetable.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - DEC-20260810-d70ece read in full
            this task, 442 lines; every quoted passage is verbatim.
        - ref: CORR-20260810-eb9062
          provenance: internal
          claim: >-
            VERBATIM- on five members of the p = 4001, t = 30 class the f_V-free
            Jacobian ideal has AFFINE dimension 0 and vector_space_dimension
            (degree) 6, while its HOMOGENISATION has dimension 1; and the required
            action that any successor compute the singular locus on the
            UN-HOMOGENISED ideal, compute the homogenised values separately, and
            REPORT BOTH DISTINCTLY with the ring each was computed in named.
            VERBATIM ALSO- Sage 10.9 MPolynomialIdeal has NO .degree() method, so a
            successor must obtain degree by a route that exists.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - CORR-20260810-eb9062 read in full
            this task, 124 lines; every quoted passage is verbatim.
        - ref: IDEA-20260807-5ddccf
          provenance: internal
          claim: >-
            VERBATIM- the explicit form
            S_3 = (x1-x2)^2 x3^2 - 2((x1+x2)(x1 x2 + a) + 2b) x3
            + ((x1 x2 - a)^2 - 4 b (x1+x2)), and the two semi-invariance facts with
            their biconditionals- at a = 0 every monomial has total degree
            congruent to 1 mod 3 giving a weight-1 relative invariant for the
            diagonal mu_3 action, holding IFF a = 0; at b = 0 every monomial has
            even total degree giving a genuine invariant of the diagonal sign
            action, holding IFF b = 0. The explicit S_3 is what the derivation in
            statement (A) is performed on.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - the claim (A) and mechanism blocks
            of IDEA-20260807-5ddccf read verbatim this task (pattern-scoped read
            with surrounding context). PARTIAL READ, DECLARED- the remainder was not
            opened.
        - ref: IDEA-20260811-a7c1df
          provenance: internal
          claim: >-
            VERBATIM- S_3 HAS NO WEIGHT-12 COEFFICIENT FACTOR, so the dictionary
            must reproduce exactly the committed 13/9/10 for generic, a = 0 and
            b = 0 and predict NO further special j at m = 3; and the S_4
            stratification into blocks carrying a (248), b (214), a^3+8b^2 (48),
            -a^3+8b^2 (36), -a^3+12b^2 (6), 3a^3+32b^2 (6), a^3+6b^2 (4),
            5a^3+48b^2 (1). THIS IS WHY P2 HAS NO OBJECT AT m = 3.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - IDEA-20260811-a7c1df read in full
            this task, 459 lines.
      validation_experiment_ids:
        - EXP-ICEX-e00b22
      falsification_condition: >-
        Two engines or two monomial orders disagree on dimension, degree or the
        Hilbert series. Dimension and degree are order-independent mathematically,
        so a disagreement is an IMPLEMENTATION ERROR, never a result, and nothing
        is established until it is reconciled.
    - id: HEUR-SING-2
      formal_statement: >-
        A finite linear group action preserving a hypersurface produces additional
        structure along its fixed locus - if not additional REDUCED components,
        which the derivation in statement (A) rules out at m = 3, then non-reduced
        multiplicity, so the multiplicity excess deg(J_affine) minus the number of
        distinct affine singular points is strictly positive at a = 0 or at b = 0
        and zero generically.
      random_model_justification: >-
        The mu_3 and sign invariances at a = 0 and b = 0 are DERIVED with
        biconditionals in IDEA-20260807-5ddccf. The step from invariance to extra
        SCHEME structure is classical intuition about quotient singularities and is
        NOT a theorem in this setting; it is labelled heuristic. NOTE THAT THE
        SOURCE VERSION OF THIS HEURISTIC - extra REDUCED singularities, moving dim
        or deg - IS REFUTED BY THE DERIVATION IN STATEMENT (A), and what survives
        is only the multiplicity form stated here.
      supporting_results:
        - ref: IDEA-20260807-5ddccf
          provenance: internal
          claim: >-
            The mu_3 relative invariance at a = 0 and the sign invariance at b = 0,
            each with a biconditional on the coefficient, and the remark that mu_3
            has no fixed points on the x-line other than 0 while the fixed points of
            the sign action on the x-line are the 2-torsion.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (claim (A)
            and mechanism blocks read verbatim).
      validation_experiment_ids:
        - EXP-ICEX-e00b22
      falsification_condition: >-
        The multiplicity excess is zero at a = 0 and at b = 0 as well as
        generically. The group action is SCHEME-THEORETICALLY INERT as well as
        geometrically inert, which strengthens the coordinate-accident reading of
        the whole divisor and is a clean cheap informative negative.
  structural_ingredients:
    - description: >-
        The decision recording the msolve staircase route to dimension and degree,
        the frozen (441, 294) fixture giving affine (0, 6), and the finding that
        graded Betti numbers have no independent engine on this host - which is what
        scopes this contract to metrics the host can actually cross-check.
      citation: DEC-20260810-d70ece
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 442 lines.
      role: the frozen fixture, the executable metric set, and the D1 stop that scopes it
    - description: >-
        The correction requiring the singular locus on the UN-HOMOGENISED ideal
