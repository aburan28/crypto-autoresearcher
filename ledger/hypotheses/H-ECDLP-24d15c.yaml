hypothesis:
  id: H-ECDLP-24d15c
  question_id: RQ-ECDLP-165d4b

  statement: >-
    SCOPE: an audit of the decision rule pre-registered in H-ECDLP-e42bda, plus a
    measurement of the one free parameter that rule s power depends on, at toy
    prime-order ordinary curves of 12 to 16 bits. CLAIM TIER toy. NO ATTACK, NO
    EXPONENT, NO STATEMENT ABOUT ANY CURVE FAMILY S GENERICITY, NO STATUS CHANGE
    TO H-ECDLP-e42bda OR ANY OTHER RECORD.
    A census cell reports a verdict, and the verdict is a lossy projection of the
    run that discards the whole work distribution and keeps one bit. An empty
    cell can mean the family is generic, or it can mean the instrument is blind
    at this sample size, and nothing in this lane currently distinguishes them.
    THE ARITHMETIC PART IS EXACT AND CHECKABLE BY HAND. H-ECDLP-e42bda
    pre-registers, verbatim, that "The Hodges-Lehmann paired median ratios
    FULL/NEG and FULL/BASE are each <= 0.90, with exact two-sided 2^8
    sign-permutation p-values <= 0.025 each under the pre-registered Bonferroni
    family-wise alpha 0.05 rule, on all eight held-out groups". For eight pairs,
    the exact two-sided sign-permutation p-value for k minority signs is twice
    the sum of binomial(8, i) for i at most k, divided by 256 - giving 2/256 =
    0.0078125 at k = 0 and 18/256 = 0.0703125 at k = 1. AT A THRESHOLD OF 0.025,
    NOTHING WEAKER THAN ALL EIGHT PAIRS MOVING THE SAME WAY CAN REACH
    SIGNIFICANCE.
    THE CLAIM UNDER TEST is that the design s power at its own pre-registered
    effect size therefore rests on an unmeasured correlation between the paired
    arms log work, and that the measured correlation falls below the value that
    effect size would require. A measurement showing the correlation IS that high
    refutes this record and is a genuine, reusable positive fact about
    seed-coupled quotient walks.

  mechanism: >-
    Two stages, the first costing no compute at all.
    STAGE A, SYMBOLIC. Enumerate all 256 sign assignments, emit the exact
    two-sided p-value table for a range of pair counts and thresholds, and
    compose it with the log-variance of the idealised collision-time law to emit
    a minimum-detectable-effect table indexed by pair count, correlation,
    threshold and power. Under the idealised law the squared collision time is
    asymptotically exponential, so the variance of the log collision time is one
    quarter of the trigamma function at 1, that is pi squared over 24, about
    0.4112, and its standard deviation is about 0.6413; for a paired comparison
    the standard deviation of the log ratio is that times the square root of
    twice one minus the correlation. Every one of those constants is reproduced
    here so a reviewer can check them without a source.
    STAGE B, MEASUREMENT AND PLANTED DIAL. Instantiate the lane s own pairing
    convention on toy curves, estimate the correlation with a bootstrap interval,
    and check the empirical standard deviation of log work against the derived
    value. Then sweep a synthetic, fully charged canonicalisation on a FAKE orbit
    structure of declared size, which by construction delivers a known expected
    discount and no mathematics, and measure the empirical detection rate of the
    lane s exact rule at each dial setting. That produces the instrument s power
    CURVE directly, and the curve must agree with the closed form at the measured
    correlation. Agreement validates the formula for reuse; disagreement means
    the closed form is the wrong model and the empirical curve is the deliverable
    instead.
    WHY THE DIAL MUST BE SWEPT AND WHY ITS ZERO POINT IS A NULL. A dial at no
    discount is a null object with a known correct answer - the detection rate
    must equal the threshold. A dial at a real discount is a planted defect of
    known size. Sweeping between them is what turns a claim that the rule is
    underpowered into a measured operating characteristic, and it is the only
    form in which the result is reusable by the census.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. The exponent is one half and is unchanged; NO EXPONENT IS
    CLAIMED OR MOVED. This is an instrument calibration and is offered as a
    building block whose priority rests entirely on the fact that every negative
    result this lane can produce is uninterpretable without it.

  rerandomization: null

  proof_search_map:
    bottleneck: >-
      The step that converts an observed set of eight paired ratios into a
      verdict. Every null cell this lane can produce passes through it, and its
      operating characteristic has never been computed.
    baseline_embedding:
      parameter_slice: >-
        Zero correlation and eight pairs at a threshold of 0.025 must reproduce
        the exact sign-permutation tail 0.0078125 for eight concordant pairs and
        0.0703125 for seven, which is a pure combinatorial identity with no curve
        arithmetic in it.
      reproduction_check: >-
        Frozen fixture - enumerate all 256 sign assignments, tabulate the exact
        two-sided p-value for each minority count, and assert both values to the
        last digit. A symbolic check; if it fails, the implementation of the
        lane s own test is wrong and that is the finding.
    observation_collision:
      observable: the cell verdict, detected or not detected
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. Exhibit two planted dial settings - one
        delivering no effect at all and one delivering a real effect - that
        produce the SAME not-detected verdict at eight pairs with high
        probability. That collision is exactly the failure this record names, and
        finding it is the cheapest proof that this census s empty cells are not
        interpretable without a floor. Failure to find such a pair after the dial
        sweep would refute the record.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A per-cell detection floor - the minimum detectable effect at the
          cell s own pair count, measured correlation, threshold and target power
          - attached to every census cell.
        predicted_gain: >-
          Converts every null cell in this census from an uninterpretable silence
          into a bounded statement, at zero marginal cost per cell once the
          correlation is measured once.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the not-detected verdict - the set of true effect sizes
          consistent with it at that cell s pair count and correlation.
        predicted_gain: >-
          Names, as an interval rather than a hunch, exactly which non-generic
          effects this census would have missed.
    quantifier_order: >-
      CLAIMED - FOR ALL pair counts, thresholds and correlations, THERE EXISTS a
      computable minimum detectable effect such that the lane s decision rule
      rejects with probability at most the target power for every true effect
      smaller than it. EXPLICITLY NOT CLAIMED - that any particular cell of this
      census contains a real effect. The record asserts nothing about curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the pre-registered eight-pair sign-permutation rule at its declared
        threshold has a stated power function under the idealised collision-time
        null, and that the measured correlation at 12 to 16 bits is a stated
        value with a stated interval. It can NEVER certify that a curve family is
        generic, that no non-generic mechanism exists, or that a larger pair
        count would find one.
    nearby_object_control: >-
        The SAME power computation applied to a design already believed adequate
        - a single-arm estimate with many seeds and a tight interval. The method
        must report that design as adequately powered and the eight-pair sign
        rule as not. A method that condemns both has not identified the
        load-bearing structure, which is the DISCRETENESS of the sign statistic
        rather than sample size as such.
    proof_obligations:
      - claim: At eight pairs the declared threshold forces all eight concordant.
        responsibility: correctness
      - claim: The standard deviation of log collision time under the idealised null.
        responsibility: correctness
      - claim: Power equals the per-pair correct-sign probability to the eighth power.
        responsibility: success_probability
      - claim: The correlation is estimated under the lane s own pairing convention.
        responsibility: interface
      - claim: The planted dial delivers no real advantage and is charged in full.
        responsibility: correctness
      - claim: No statement is made about any curve family s genericity.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The idealised collision-time law is the NULL MODEL for charged work, not a
      claim about the implemented walk. The empirical standard deviation of log
      work is measured, and the closed form is DISCARDED if the measured value
      differs from the derived one by more than 20 percent.
    - >-
      The lane s decision rule is exactly as written in H-ECDLP-e42bda. If a
      frozen contract differs from that record s text, the audit is re-run
      against the frozen text and every number changes.
    - >-
      The planted dial delivers no mathematical advantage and is charged in full.
      Its only role is to move the true effect size to a known value. Any
      implementation in which the dial leaks real structure voids the sweep, and
      a peek-check on the dial is part of the design rather than a courtesy.
    - >-
      Power is computed for the SIGN test actually pre-registered. A different
      statistic has different power and this audit says nothing about it.

  heuristic_assumptions:
    - id: HEUR-FLOOR-1
      formal_statement: >-
        For a fully charged collision-search walk on a cyclic group of prime
        order with a partition into sufficiently many branches, the charged
        collision time scaled by the square root of the group order converges to
        the standard Rayleigh law, so that the squared time is asymptotically
        exponential and the variance of the log time is pi squared over 24.
      random_model_justification: >-
        The rigorous ingredient is the exponential limit of the birthday waiting
        time. The classical distribution imitated is the standard random-mapping
        limit law for cycle length in a random function on a finite set, which is
        the same limit underlying the constant this program already records for
        the expected collision time. THE HEURISTIC STEP is that the IMPLEMENTED
        partition walk behaves like a uniformly random function of its size,
        which is the standard assumption for such walks and is not proved for any
        concrete partition.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-72a191]
      falsification_condition: >-
        Measured standard deviation of log charged work outside a 20 percent band
        around the derived value. The idealised law is then the wrong model for
        the implemented walk, every closed-form number here is void, and only the
        empirical power curve survives.
    - id: HEUR-FLOOR-2
      formal_statement: >-
        Under the lane s shared pair token, the pair of log charged works for the
        two arms is bivariate with a correlation independent of the group within
        the tested bit range, so that the standard deviation of the log ratio is
        the single-arm value times the square root of twice one minus that
        correlation.
      random_model_justification: >-
        No rigorous support is claimed and this is a modelling convenience. The
        rigorous part is only the identity that for equal-variance variables the
        standard deviation of their difference is the common standard deviation
        times the square root of twice one minus the correlation.
        Group-independence of the correlation is the heuristic.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-72a191]
      falsification_condition: >-
        Heterogeneity of the estimated correlation across bit sizes at the
        declared test level. The detection-floor table is then emitted PER BIT
        SIZE rather than globally, and that heterogeneity is itself a census
        cell.

  structural_ingredients:
    - description: >-
        The pre-registered decision rule under audit - Hodges-Lehmann paired
        median ratios at or below 0.90, exact two-sided 2^8 sign-permutation
        p-values at or below 0.025 each under a Bonferroni family-wise alpha of
        0.05, on all eight held-out groups.
      citation: ledger/hypotheses/H-ECDLP-e42bda.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read the
        matching passages of ledger/hypotheses/H-ECDLP-e42bda.yaml directly - its
        statement, its assumption that eight held-out groups and all calibration
        rows are fixed before any candidate-family outcome is observed, its
        predictions block quoted verbatim above, and its falsification
        conditions. THE FULL FILE WAS NOT READ END TO END; the quoted strings are
        verbatim from the passages that were.
      role: the rule whose operating characteristic is computed
    - description: >-
        The census s scope and its constraint that toy and medium runs cannot be
        promoted to cryptographic-scale claims and that all positive observations
        require independent validation and red-team review.
      citation: ledger/questions/RQ-ECDLP-165d4b.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-ECDLP-165d4b.yaml in full (42 lines).
      role: the census whose empty cells this record proposes to bound
    - description: >-
        Random-mapping statistics and the birthday analysis giving the Rayleigh
        limit law for collision time.
      citation: >-
        Classical random-mapping and birthday-problem analysis. NO SOURCE WAS
        OPENED for this record; the constants are reproduced in the mechanism so
        a reviewer can check them by hand, and the empirical arm measures them
        rather than trusting them.
      provenance: recalled
      verified_by: null
      role: supplies the null model for charged work
    - description: >-
        The observed seed-to-seed dispersion of quotient-arm ratios reported by
        an existing evidence record in this lane, which the source idea uses as
        its nearest measured comparison.
      citation: >-
        Taken from IDEA-20260829-172151, which cites EV-ENDO-10109d. THAT
        EVIDENCE RECORD WAS NOT OPENED BY THIS AGENT and none of its numbers is
        asserted here; the nearby-object control must resolve them from the
        committed record at Stage 0.
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04 - read only
        ledger/proposals/IDEA-20260829-172151.yaml. The characterisation is taken
        from that record and is not an independent reading of EV-ENDO-10109d.
      role: the nearby adequately-powered design the method must not condemn

  predictions:
    - metric: >-
        P1 - minimum number of concordant pairs required by the pre-registered
        eight-pair exact two-sided sign-permutation test at its declared
        threshold
      direction: different
      minimum_effect: >-
        EXACTLY 8 of 8. Any other value means the p-value table has been
        mis-derived, which is itself decision-relevant. Zero compute; checkable
        by hand from the identity in the statement.
    - metric: >-
        P2 - empirical standard deviation of log charged work per single arm,
        with interval (dimensionless, natural-log units)
      direction: different
      minimum_effect: >-
        Within 20 percent of the derived value of about 0.6413. Outside that band
        the idealised null is the wrong model, every closed-form number here is
        void, and the empirical power curve becomes the sole deliverable.
    - metric: >-
        P3 - measured Pearson correlation of log charged work between the paired
        arms under a shared pair token, target scalar, partition seed and
        stopping rule, with a bootstrap interval (dimensionless)
      direction: lower
      minimum_effect: >-
        UNDERPOWERED is declared if the interval s UPPER bound falls below the
        correlation the pre-registered effect would require at the target power.
        ADEQUATELY POWERED is declared if the interval s LOWER bound reaches or
        exceeds it, which REFUTES this record s central claim and is a reusable
        positive fact about seed-coupled quotient walks. The comparison is made
        against an interval bound, never against the point estimate.
    - metric: >-
        P4 - SHUFFLED-PAIR NULL - the shared pair token broken so the two arms
        use independent seeds, correlation re-estimated
      direction: lower
      minimum_effect: >-
        FORCED to fall to approximately 0. This is what shows the estimator is
        measuring coupling and not bookkeeping, and it gives the correlation
        estimator a demonstrated dynamic range from near 0 to whatever the
        coupled value is. A shuffled correlation that stays high means the two
        arms share a deterministic prefix and the coupled number is manufactured.
    - metric: >-
        P5 - NULL DIAL at no discount - an identically charged canonicalisation
        with orbit size 1, delivering no discount, over at least 200 replications
      direction: different
      minimum_effect: >-
        Detection rate FORCED to equal the declared threshold within Monte Carlo
        error. A materially higher rate means the rule is anti-conservative and
        every past p-value in this lane is suspect, which is an instrument defect
        that suspends every number including this record s.
    - metric: >-
        P6 - PLANTED DIAL SWEEP - empirical detection rate of the lane s exact
        rule at planted discounts spanning no effect through the largest effect
        the lane s own mechanism can produce, at least 200 replications per
        setting
      direction: higher
      minimum_effect: >-
        The detection rate must be MONOTONE NON-DECREASING across the sweep and
        must agree with the closed-form power at the measured correlation within
        binomial error at every setting. Disagreement means the closed form is
        wrong and the empirical curve is the deliverable.
    - metric: >-
        P7 - number of distinct planted discounts sharing the not-detected
        verdict in at least 80 percent of replications
      direction: higher
      minimum_effect: >-
        At least 3 of 4 low settings, establishing the observation collision.
        Fewer than 2 refutes the collision claim and the interpretability
        argument fails.
    - metric: >-
        P8 - CURVE-FREE ARM - the identical correlation and log-work-dispersion
        measurement on a curve-free cyclic group of the same order, with a
        matched-cost random-mapping walk
      direction: different
      minimum_effect: >-
        EXPECTED TO REPRODUCE THE SIGNATURE and the consequence is pre-declared
        for exactly that reason. If the curve-free group reproduces the measured
        correlation and log-work dispersion within their intervals, the
        detection-floor result is a statement about collision-search walk
        statistics on cyclic groups and NOTHING from it may be quoted as a
        statement about elliptic curves or the ECDLP. The floor remains usable by
        the census as an instrument fact; it carries no curve content.

  test_boundary:
    instances: >-
      About 40 toy prime-order ordinary curves at 12 to 16 bits where the group
      order is exactly known by exhaustive point count, so no estimation error
      enters; a curve-free cyclic group arm at matched orders; a planted-dial
      arm.
    parameters:
      bit_sizes: [12, 13, 14, 15, 16]
      curves: 40
      seeds_per_curve: 40
      dial_settings: no-discount through the largest mechanism-attainable discount, at least 6 settings
      replications_per_dial: 200
      pair_counts_tabulated: [4, 8, 12, 16, 24, 32]
      thresholds_tabulated: [0.05, 0.025]
    implementation: >-
      Symbolic enumeration of the sign-permutation table and the power grid, plus
      the lane s existing toy-curve and collision-search drivers under the lane s
      own pairing convention, plus a synthetic fully charged dial that cannot
      access the target scalar or the underlying orbit.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 200

  falsification_conditions:
    - >-
      F1 - the exact sign-permutation table does not force all eight concordant
      at the declared threshold. The arithmetic claim is wrong; the record is
      withdrawn and superseded.
    - >-
      F2 - measured correlation reaches the required value with its interval
      excluding the weaker alternative. The pre-registered design is adequately
      powered for its stated effect, this record s central claim is refuted, and
      the positive fact is the deliverable instead.
    - >-
      F3 - measured log-work dispersion outside the 20 percent band. The
      idealised null is wrong for the implemented walk; all closed-form numbers
      are void and only the empirical power curve survives.
    - >-
      F4 - the no-discount dial detects at materially above the threshold. The
      rule is anti-conservative; instrument defect, and every number in the lane
      including this record s is suspended pending repair.
    - >-
      F5 - the shuffled-pair null does not drop the correlation to near 0. The
      estimator is measuring bookkeeping, not coupling, and the coupled number is
      manufactured.
    - >-
      F6 - the planted sweep is non-monotone or disagrees with the closed form.
      The closed form is the wrong model; the empirical curve is the deliverable.
    - >-
      F7 - no two dial settings share a verdict at the declared rate. The
      observation collision does not occur and the interpretability argument
      fails.
    - >-
      F8 - the curve-free arm reproduces the signature. Scope collapses to
      collision-search statistics on cyclic groups and no elliptic-curve
      statement may be made.

  interpretation_limits:
    - >-
      CLAIM TIER toy. THIS RECORD MAKES NO STATEMENT ABOUT ANY CURVE FAMILY S
      GENERICITY, about the automorphism mechanism, or about the ECDLP. It is an
      audit of a decision rule.
    - >-
      Scoped to the exact statistic pre-registered in H-ECDLP-e42bda. A different
      statistic has different power and is not covered.
    - >-
      The correlation is measured at 12 to 16 bits. Whether the paired coupling
      strengthens or weakens with bit size is a TRANSFER ASSUMPTION and is NOT
      established here.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. The design s power at the
      bit sizes the census actually cares about cannot be measured here, because
      the correlation is measured only where full walks are cheap. The floor is
      reported at the sizes where it was measured and the transfer is recorded as
      unjustified rather than quietly assumed.
    - >-
      A measured detection floor bounds Type II error under the stated null model
      only. IT DOES NOT CONVERT AN UNRESOLVED CELL INTO A NEGATIVE ONE, and an
      underpowered design is a design fact, not evidence that a mechanism is
      absent.
    - >-
      Changes no status. Any consequence for H-ECDLP-e42bda or for the census s
      recorded cells is a Coordinator decision made elsewhere on committed
      evidence.

