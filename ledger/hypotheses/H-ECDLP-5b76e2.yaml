# H-ECDLP-5b76e2
# Exponent-band arithmetic for IDEA-20260920-dd041a.
# No corpus census and no character sum. Approval: DEC-20261001-b26fa1.
hypothesis:
  id: H-ECDLP-5b76e2
  question_id: RQ-ECDLP-160d89
  source_idea: IDEA-20260920-dd041a
  experiment_id: EXP-ECDLP-65f903
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-b26fa1
  title: >-
    The rationals satisfy 1/6 < 1/5 < 1/4, and for every integer n > 1 the
    inequality n^2 < n^3 records n to the power 1/6 below n to the power 1/4.
  statement: >-
    Cross-multiplication gives 1/6 < 1/5 because 5 < 6, and 1/5 < 1/4
    because 4 < 5. The witness 1/5 lies in the half-open interval from
    1/6 to 1/4. For n = 64, n^2 = 4096 and n^3 = 262144, so n^2 < n^3.
    Raising both sides of n^{1/6} < n^{1/4} to the 12th power is exactly
    that comparison.
  mechanism: >-
    The proposal names an exponent band between a spectral floor and a
    learner exponent. This contract checks that the band contains a
    rational and that the corresponding powers are ordered for n = 64.
    It does not inspect a key family.
  assumptions: []
  proof_search_map:
    bottleneck: Four integer comparisons.
    baseline_embedding:
      parameter_slice: >-
        The band written in the title of IDEA-20260920-dd041a, read
        2026-10-01. The comparisons were done by hand. They are not a run.
      reproduction_check: >-
        One implementation uses fractions. The other uses cross-multiplication
        of integers. They must agree.
    observation_collision:
      observable: The two inequalities and the n = 64 power comparison.
      distinct_preimage_search: >-
        A reversed band, 1/4 < 1/6, must be labeled false. Reporting it
        true invalidates the run.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The witness rational 1/5 and the integer 64.
        predicted_gain: An ordered band. No attack cost.
    quantifier_order: >-
      The inequalities 1/6 < 1/5 and 1/5 < 1/4 hold, and for n = 64 the
      integers n^2 and n^3 satisfy n^2 < n^3.
    method_ceiling:
      strongest_certifiable_claim: >-
        These comparisons. Not a census of corpus keys and not a character
        sum.
      nearby_object_control: >-
        The reversed comparison 1/4 < 1/6. It is false.
    proof_obligations:
      - claim: 1/5 lies strictly between 1/6 and 1/4.
        responsibility: correctness
      - claim: 64^2 < 64^3.
        responsibility: correctness
      - claim: The reversed comparison is false.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Cross-multiplication of positive rationals. No external paper was
        opened.
      citation: ledger/proposals/IDEA-20260920-dd041a.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-01 (title and opening claim read; inequalities checked by hand)
      role: the band comparison
  reduction_chain:
    core_problem: Show the named exponent band contains a rational.
    corollaries: []
  predictions:
    - metric: witness_inside_band
      direction: different
      minimum_effect: True for 1/5.
    - metric: power_comparison
      direction: different
      minimum_effect: 4096 < 262144.
  test_boundary:
    instances: [three rationals, n=64]
    parameters:
      n: 64
    implementation: Fractions and integer cross-multiplication, written apart.
    budget:
      maximum_runs: 2
      maximum_memory_gb: 1
      maximum_workers: 1
  falsification_conditions:
    - Both implementations agree and 1/5 is not strictly between 1/6 and 1/4, or 64^2 is not less than 64^3.
  interpretation_limits:
    - This does not say any key family sits in the band.
    - No spectral norm is computed.
  dominated_by: No attack is claimed.
  sota_delta:
    time: No attack cost.
    memory: Not measured.
    data_queries: Not applicable.
