hypothesis:
  id: H-ECTD-cda162
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_idea_ids:
    - IDEA-20261006-4e7025
  added: '2026-10-10'
  status: approved
  proposed_by: coordinator
  title: Public affine x-sum equality on one ordinary curve over F_89
  statement: >-
    On E: y^2=x^3+x+1 over F_89, after checking that E is nonsingular
    and ordinary, at least one eligible unordered pair of distinct
    affine points {P,Q} with both y-coordinates nonzero, P not equal
    to -Q, and finite P+Q satisfies x(P+Q)=x(P)+x(Q) in F_89.
    A complete valid enumeration with W=0 falsifies this bounded claim.
  mechanism: >-
    The public affine x-coordinate is a coordinate-dependent projection
    of the group law. For eligible P,Q, the chord-and-tangent formula
    gives x(P+Q)=lambda^2-x(P)-x(Q), so the proposed equality is a
    finite-field condition on a public slope. Counting its solutions
    measures this representation on one model. It supplies no hidden
    isogeny, private endpoint, or discrete-log algorithm.
  assumptions:
    - >-
      The model is over prime F_89, has nonzero discriminant, and is
      ordinary. The experiment computes each admission check rather
      than treating it as an observed conclusion.
    - >-
      Every affine point and eligible unordered pair is enumerated
      exactly once; group addition is checked independently.
    - >-
      A field-label permutation is a null for coordinate labels only.
      It does not alter pair eligibility, group addition, or W.
  proof_search_map:
    not_applicable_reason: >-
      This is an exact finite census of one public model, with no
      theorem, reduction, asymptotic bound, or closure claim.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        If the predicate value lambda^2-2(x(P)+x(Q)) were uniform
        and independent over eligible pairs, a pair would satisfy
        the proposed equality with probability 1/89. This is a
        diagnostic imitation, not a premise needed for the exact W
        verdict and not a theorem about E.
      random_model_justification: >-
        A uniform F_89 value is zero with frequency 1/89. Eligible
        pairs share points and slopes, so independence is not
        asserted for the actual census.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECTD-97777a
      falsification_condition: >-
        A complete valid census has W=0; a different permuted-label
        count is recorded without changing the W verdict.
  structural_ingredients: []
  predictions:
    - metric: W
      direction: greater_than_zero
      minimum_effect: 1 eligible unordered pair
  test_boundary:
    instances:
      - E y^2=x^3+x+1 over F_89, one public model only
    parameters:
      field_prime: 89
      coefficients: {a: 1, b: 1}
      pair_order: lexicographic point order, then indices i<j
      label_seed: 5140517
    implementation: >-
      Enumerate all rational affine points, compute every eligible
      sum with the actual group law, count W and a separately labeled
      permuted-coordinate null, and replay the count independently.
    budget:
      enforcement: advisory
      maximum_runs: 1
      maximum_workers: 1
      maximum_memory_gb: 1
  falsification_conditions:
    - Every admission and instrument control passes and W equals 0.
  interpretation_limits:
    - >-
      W greater than zero shows only a public equality on this exact
      curve and eligible-pair definition. It does not identify a
      secret isogeny or an endpoint-specific weakness.
    - >-
      W equal to zero rejects only the stated existence claim on
      this model; it says nothing about other curves or fields.
    - >-
      A singular or supersingular model, group-law mismatch, failed
      round trip, checker disagreement, or incomplete enumeration
      makes the census invalid or unmeasured, not W=0.
