hypothesis:
  id: H-ECDLP-f3d2fd
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260815-3c9919
  derived_from_idea: IDEA-20260815-3c9919

  statement: >-
    SCOPE. A charged measurement of the incumbent baseline, Pollard rho with
    distinguished points, on toy prime-order subgroups at 16, 20, 24 and 28
    bits. NO NEW ALGORITHM, NO ATTACK, NO EXPONENT. Four conjuncts, each
    separately falsifiable.
    (C1, THE INSTRUMENT IS CORRECT) Every instance carries a known solution and
    the recovered scalar is re-verified against the original instance before any
    timing is admitted. An unrecovered or unverified instance voids the cell.
    (C2, THE STEP-COUNT CONSTANT IS MEASURABLE AND MATCHES THE BIRTHDAY
    PREDICTION) The measured expected step count divided by sqrt(N) is a
    constant across the four sizes, agreeing with the prediction for the
    DECLARED walk variant within a pre-registered band. The step-count constant
    is a property of the walk and is claimed to transfer across sizes; the
    WALL-CLOCK constant is not, because per-step field arithmetic grows with p,
    and the two are reported in separate columns and never combined.
    (C3, THE DISTINGUISHED-POINT TERM AND THE MEMORY ARE FIRST-CLASS AND
    NON-ZERO) The distinguished-point predicate, table insertion and table
    storage carry a measurable share of total charged cost and a measurable
    peak memory, both reported per (size, theta) cell. A baseline quoted without
    them is not a charged baseline.
    (C4, THE PARALLEL SPEEDUP CURVE IS MEASURED RATHER THAN ASSUMED) Speedup
    versus worker count over 1, 2, 4 and 8 workers is MEASURED on this
    program's hardware, together with the total-work inflation that
    parallelisation causes. This is the conjunct with the most content, because
    the one approved rho contract in this repository, EXP-RHO-60da4f,
    explicitly MODELS parallelisation as near-linear rather than measuring it
    and lists that as an optimistic assumption.
    A GENUINE NEGATIVE EXISTS AND IS NAMED. If Stage 0 finds that a completed
    run under EXP-RHO-60da4f already reports the collision constant, the
    distinguished-point table size and the peak resident memory, then the parent
    proposal's motivating premise -- that no record in this corpus measures
    rho's constant -- is FALSE at the tested scope, C2 and C3 are superseded,
    and the contract narrows to C4 alone or terminates. That outcome is a real
    deliverable and is reported as the headline, not buried.

  mechanism: >-
    THE GAP AS THE PROPOSAL STATES IT. Every comparison in this campaign names
    Pollard rho as the baseline and cites it asymptotically as O(sqrt(N)) with
    an unstated constant. A charged comparison needs the constant, the
    distinguished-point overhead, the collision-storage memory and the parallel
    speedup curve, measured on the same hardware as any competitor. Until then
    one side of every charged comparison in the campaign is a citation and the
    other is a measurement, which is not a charged comparison.
    WHAT IS ACTUALLY MEASURED. Parallel rho with distinguished points is run to
    solution on instances whose solutions are known in advance. Per instance the
    run records group operations to solution, wall clock, peak resident memory,
    distinguished-point table entries at peak, worker count and the seed. The
    constant is then fitted from the step counts, and the parallel curve from
    the wall clocks and total work at each worker count.
    THE MEASURED-VERSUS-MODELED SEPARATION IS STRUCTURAL, NOT COSMETIC. Group
    operations, step counts, wall clock, peak memory, table entries and speedup
    are MEASURED. The predicted step-count constant, the near-linear
    parallelisation law, and any statement about behaviour above 28 bits are
    MODELED. Every table carries the two in separate columns and no cell mixes
    them. A number without a column is not reportable.
    THE CONSTANT'S OWN AMBIGUITY, FOUND DURING CONVERSION AND NOT PAPERED OVER.
    The parent proposal's HEUR-RHO-BASE-1 names sqrt(pi*N/4) as the rigorous
    birthday ingredient, i.e. approximately 0.8862 * sqrt(N). That is the value
    for a walk searching an effectively halved state space -- the
    negation-quotiented walk on N/2 classes. An UN-quotiented random walk on N
    states has expected step count sqrt(pi*N/2), approximately 1.2533 * sqrt(N).
    The proposal does not say which variant it intends, and the difference is a
    factor of sqrt(2), which is larger than any band worth pre-registering. The
    contract therefore requires the walk variant to be DECLARED before
    execution and reports the measurement against the prediction for the
    declared variant, with the other prediction shown alongside. Silently
    choosing whichever prediction the data matched would have made C2
    unfalsifiable, which is precisely the failure the pre-registration exists to
    prevent.
    THE DOMINANT RISK, IN THE DIRECTION THAT MATTERS. The parent proposal names
    implementation quality as the dominant confounder and names its direction: a
    WEAK rho baseline inflates the incumbent's cost and therefore FLATTERS every
    competitor measured against it. That is the dangerous direction, because it
    manufactures apparent gains everywhere downstream. The remedy is a
    known-answer verification gate, a random-oracle walk control that realises
    the ideal random-map constant by construction, and a pre-registered
    acceptance band on the fitted constant -- outside which the correct verdict
    is 'the implementation is weak', not 'the constant is this'.
    THE HARDWARE BINDING. The wall-clock constant is a property of this machine
    and this implementation, not of the algorithm. Only ratios against
    competitors measured on the SAME machine are portable, and the record says
    so in every place a wall-clock number appears.

  assumptions:
    - >-
      That a competent rho implementation is achievable in the available
      harness. The parent proposal states the failure direction explicitly: an
      unoptimised implementation inflates the baseline in the direction that
      flatters every competitor, which is the dangerous direction.
    - >-
      That toy sizes admit enough repetitions for the constant to be fitted with
      a usable interval. The contract makes the achieved interval a reported
      quantity rather than an assumption.
    - >-
      That the walk variant, the distinguished-point rate theta and the charging
      convention are frozen before execution and applied identically to every
      arm and to the BSGS second baseline.
    - >-
      That instances with known solutions can be constructed at every tested
      size, so that correctness is verified before any timing is admitted.
    - >-
      That worker counts up to 8 are available on the execution host without the
      run process group being descheduled. If they are not, the parallel arm is
      censored and reported as censored, never as a measured curve.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      PURELY EMPIRICAL. This hypothesis proposes no theorem, no asymptotic
      bound, no certificate family, no reduction and no closure argument. It
      measures a known algorithm whose analysis is classical and published. The
      parent proposal states under object_first_candidate that no tracked object
      propagating under a group law is proposed and that the record's content is
      the measured cost of an incumbent. Per templates/research-records.md a
      purely empirical hypothesis sets this field and leaves the other subfields
      null; that is complete work here rather than an omission. The
      identifiability question that DOES apply -- whether the measurement could
      come out other than predicted -- is handled by the pre-registered
      acceptance band and the two nulls.

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. No complexity improvement is claimed and no exponent
    moves. The parent proposal states plainly that it proposes no algorithm for
    any hard problem and that the incumbent is measured here and NOT improved.
    Every value of the required claim_kind enum would be false. The proposal's
    target_complexity block is carried verbatim below.

  source_target_complexity:
    note: >-
      Carried VERBATIM from IDEA-20260815-3c9919 so that the proposal's
      claim-conditioning fields survive conversion intact.
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is many full rho solves at toy sizes.
    memory_exponent: >-
      Distinguished-point table, which is the memory term being measured.
    best_known: >-
      The incumbent is the published rho analysis and its van Oorschot-
      Wiener parallelisation, measured here and not improved.
    hidden_overhead: >-
      Distinguished-point parameter choice trades memory against restart
      cost and can be tuned to flatter the baseline in either direction,
      so it is reported per run.
    tradeoff_note: >-
      A stronger baseline makes every competitor look worse and is the
      honest choice; a weak one silently inflates every comparison in the
      campaign.

  heuristic_assumptions:
    - id: HEUR-RHO-BASE-1
      source_id_in_proposal: HEUR-RHO-BASE-1
      formal_statement: >-
        The measured rho constant at toy sizes describes the constant at
        larger sizes for the same implementation.
      random_model_justification: >-
        Carried verbatim from the parent proposal, including its own statement
        of the gap: 'Rigorous ingredient: the birthday analysis giving the
        sqrt(pi*N/4) expected step count, which is exact and size-independent.
        THE GAP: the per-step cost is not size-independent, since field
        arithmetic cost grows with p, so the wall-clock constant does not
        transfer even though the step-count constant does -- and conflating the
        two is the specific error this heuristic guards against.'
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND CORRECT. The birthday analysis and the van Oorschot-Wiener
        parallelisation are RECALLED in the parent proposal; no agent in this
        program has opened either source, and AGENTS.md rule 9 forbids a
        recalled reference from discharging this field. Stage 0 of the
        experiment reads whatever the committed corpus holds and records it
        verbatim, which is the only route by which this field could later be
        filled.
      validation_experiment_ids: [EXP-ECDLP-4320a7]
      falsification_condition: >-
        A measured step-count constant departing from the birthday
        prediction.
      falsification_condition_operationalised: >-
        The proposal's condition is preserved verbatim above and is made
        decidable in the contract by three additions that the proposal does not
        supply and that are attributed to the converting Coordinator: the walk
        variant is DECLARED before execution; the prediction is the value for
        that variant, 0.8862 for the negation-quotiented walk or 1.2533 for the
        un-quotiented walk; and the band is plus or minus 5 percent on the
        fitted constant with its bootstrap interval reported. Without a declared
        variant the condition cannot be evaluated, because the two candidate
        predictions differ by sqrt(2).
      validation_plan_from_proposal: >-
        Carried verbatim: 'SAMPLE: >= 4 sizes x >= 30 instances. COMPARISON:
        measured step count against sqrt(pi*N/4). TAIL CHECK: instances in the
        slowest decile, checked for distinguished-point parameter effects.
        TRANSFER: step-count constant transfers; wall-clock constant does not,
        and both are reported separately.'

  structural_ingredients:
    - description: >-
        The approved contract that already measures a collision constant, the
        distinguished-point table size and peak resident memory for a
        negation-quotient rho walk at 2^32 to 2^48, and that explicitly MODELS
        parallelisation as near-linear rather than measuring it, listing that as
        an optimistic assumption whose bias 'flatters every configuration
        equally'.
      citation: 'experiments/EXP-RHO-60da4f/specification.yaml'
      provenance: internal
      verified_by: TASK-20260904-35fbe5
      role: >-
        The nearest existing contract, read during conversion. It is the reason
        C4 is the conjunct carrying the most content and the reason Stage 0 is a
        terminator: if a completed run under it already supplies the constant
        and the memory, this record's C2 and C3 are superseded.
    - description: >-
        A walk driven by a keyed hash into the group, which realises the ideal
        random-map constant by construction and therefore bounds what any
        candidate walk can achieve.
      citation: 'experiments/EXP-RHO-60da4f/specification.yaml, control C2_random_oracle_walk'
      provenance: internal
      verified_by: TASK-20260904-35fbe5
      role: >-
        Implementation-quality control. Adopted by the converting Coordinator
        from the existing contract; the parent proposal names implementation
        quality as its dominant risk but supplies no instrument for it.
    - description: >-
        The birthday analysis of collision search, giving an expected step count
        proportional to sqrt(N) with a constant that depends on whether the walk
        is negation-quotiented, and the van Oorschot-Wiener distinguished-point
        parallelisation with its near-linear speedup prediction.
      citation: 'classical; nearest corpus entries KN-TECH-001 and KN-TECH-006'
      provenance: recalled
      verified_by: null
      role: >-
        The predicted values against which the measurement is compared. RECALLED
        and therefore a pointer for the reviewer rather than support: Stage 0
        reads whatever the committed corpus entries actually state and records
        them verbatim before any comparison is made.
    - description: >-
        Baby-step giant-step as the second measured baseline on the same
        instances, giving a cross-check that catches implementation-quality
        problems a single baseline would hide.
      citation: 'nearest corpus entries KN-TECH-031 and KN-TECH-035'
      provenance: recalled
      verified_by: null
      role: >-
        The parent proposal's NULL 2. Recalled citation; the algorithm is
        textbook and no novelty is claimed for it.

  reduction_chain:
    core_problem: >-
      Produce, for toy prime-order subgroups at 16, 20, 24 and 28 bits on this
      program's hardware, a measured charged cost of parallel rho with
      distinguished points -- step-count constant with interval, wall-clock
      constant with interval, distinguished-point overhead share, peak memory
      and table occupancy per theta, and measured speedup and total-work
      inflation over 1, 2, 4 and 8 workers -- with a BSGS second baseline on the
      same instances and every number labelled measured or modeled.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. A measured baseline reduces to NOTHING on its own. It
      does not improve rho, does not show any competitor better or worse, and
      does not license re-reading any past comparison. Re-reading a past charged
      comparison against a newly measured baseline would be a separate
      Coordinator act with its own decision record, and the parent proposal's
      own prior that 0.5 of existing comparisons might change materially is a
      motivation for the measurement, not a result of it.

  predictions:
    - metric: >-
        R1 -- known-solution verification on every instance before any timing is
        recorded
      direction: different
      minimum_effect: >-
        FORCED correct on 100 percent of admitted instances, with the recovered
        scalar re-verified against the original instance. Any failure means the
        implementation is wrong and the affected cells are void.
    - metric: >-
        R2 -- fitted step-count constant, measured steps divided by sqrt(N),
        per size and pooled, with a bootstrap interval
      direction: different
      minimum_effect: >-
        Agreement within plus or minus 5 percent with the prediction for the
        DECLARED walk variant -- 0.8862 negation-quotiented, 1.2533
        un-quotiented -- at every one of the four sizes. This is the
        measurement; it is reported with the hardware, the implementation and
        the variant stated.
    - metric: >-
        R3 -- size-independence of the step-count constant, the fitted slope of
        the constant against log N
      direction: different
      minimum_effect: >-
        Consistent with zero within the reported interval. A slope excluding
        zero refutes the transferable half of HEUR-RHO-BASE-1 at the tested
        scope and every constant is then scoped to its own size.
    - metric: >-
        R4 -- measured parallel speedup versus worker count over 1, 2, 4 and 8
      direction: higher
      minimum_effect: >-
        Predicted near-linear per the van Oorschot-Wiener model. The parent
        proposal's rule is preserved exactly: a materially worse curve indicates
        an IMPLEMENTATION PROBLEM rather than a finding, and is reported as
        such. 'Materially worse' is pre-registered by the converting Coordinator
        as speedup below 0.6 times the worker count at 8 workers.
    - metric: >-
        R5 -- distinguished-point overhead share of total charged cost, and peak
        memory and peak table occupancy per (size, theta)
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED for the magnitudes; the parent proposal
        supplies none and guessing one would launder an estimate into a
        prediction. What IS pre-registered is that all four quantities are
        reported per cell and that peak memory appears beside time in every
        table. A baseline reported without them does not satisfy this
        hypothesis.
    - metric: >-
        R6 -- BSGS second baseline on the same instances, operations and peak
        memory
      direction: different
      minimum_effect: >-
        BSGS must use fewer group operations than rho at every tested size when
        its table is unconstrained. If it does not, one of the two
        implementations is wrong and neither baseline is admissible. No memory
        prediction is pre-registered.
    - metric: >-
        R7 -- Stage 0 supersession check against EXP-RHO-60da4f and its runs
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED. The check is executed and its command and
        output recorded verbatim. Absence of a completed run is not evidence
        that none exists elsewhere in the repository's branches, and the record
        states that limit.

  test_boundary:
    instances:
      - >-
        Prime-order subgroups of prime-field short-Weierstrass curves at
        subgroup bit sizes 16, 20, 24 and 28, with the group order, the base
        point order and the non-anomalous condition certified per instance.
      - >-
        At least 200 instances per size, each with a scalar drawn uniformly and
        RECORDED before the solve, so that correctness is a check and not a
        report.
      - >-
        The same instances reused verbatim by the BSGS second baseline and by
        any sibling contract that needs a matched rho reference.
    parameters:
      subgroup_bit_sizes: [16, 20, 24, 28]
      instances_per_size: 200
      instances_per_size_minimum_from_proposal: 30
      instances_per_size_rationale: >-
        A COORDINATOR ADDITION, DERIVED AND FLAGGED, NOT MEASURED. The collision
        time normalised by sqrt(N) has a Rayleigh limit with mean sqrt(pi/2)
        approximately 1.2533 and standard deviation sqrt(2 - pi/2)
        approximately 0.6551, so its coefficient of variation is approximately
        0.523. The relative standard error of the mean is therefore about 9.5
        percent at the proposal's minimum of 30 instances and about 3.7 percent
        at 200. A 9.5 percent interval cannot decide a 5 percent band, so the
        proposal's own acceptance test would be undecidable at its own minimum.
        The ACHIEVED interval is reported per cell and the pre-registered band
        is evaluated against it; the derivation above is a model statement and
        is never substituted for the measured interval.
      walk_variant: >-
        DECLARED BEFORE EXECUTION AND FROZEN. Either negation-quotiented, whose
        predicted constant is 0.8862, or un-quotiented, whose predicted constant
        is 1.2533. Both predictions are reported; only the declared one is the
        acceptance test. If the variant is not declared in the approval
        decision, the contract is not approvable.
      distinguished_point_rate_theta: >-
        Frozen before Stage 1 and held identical across arms and worker counts,
        with a 4x sweep at 20 bits as a separate cell to expose theta effects on
        table size and restart cost.
      worker_counts: [1, 2, 4, 8]
      charging_convention: >-
        Group-operation equivalents for time, one point addition equal to one
        operation; memory charged separately in bits and in peak resident bytes.
        Identical across rho, BSGS and every worker count.
      hardware_binding: >-
        The wall-clock constant is bound to the execution host and is portable
        only as a ratio against a competitor measured on the same host. Recorded
        with the host description in every manifest.
    implementation: >-
      The existing harness rho implementation with distinguished points, or a
      new one recorded as such, plus a BSGS implementation with an instrumented
      table. Python 3 with the program's standard toy-curve arithmetic, or a
      compiled inner loop if one is used, recorded either way. NO network access
      is required and none may be used.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 8
      maximum_memory_gb: 8
      maximum_runs: 40
      note: >-
        Expected total work is small -- 200 instances at 28 bits is on the order
        of 4 million group operations -- so the budget is dominated by the
        parallel arm's repetitions and by BSGS table construction at 28 bits
        rather than by the rho walks.

  falsification_conditions:
    - >-
      F1 (INSTRUMENT WRONG) -- a known solution is not recovered, or a recovered
      scalar fails re-verification against the original instance. Carried
      verbatim from the proposal: implementation wrong. The affected cells are
      void and no constant is reportable from them.
    - >-
      F2 (WEAK IMPLEMENTATION, NOT A FINDING) -- the parallel curve is far from
      linear, pre-registered as speedup below 0.6 times the worker count at 8
      workers. Carried from the proposal: implementation problem, to be fixed
      before a baseline is reported. This is explicitly NOT evidence about
      parallel rho as an algorithm.
    - >-
      F3 (CONSTANT OFF PREDICTION) -- the fitted step-count constant lies
      outside plus or minus 5 percent of the prediction for the DECLARED walk
      variant, reproduced across sizes and with the random-oracle walk control
      also off. Carried from the proposal: either the implementation is weak or
      the cost model differs, and BOTH must be resolved before the baseline is
      used by anything.
    - >-
      F4 (NON-TRANSFERABLE CONSTANT) -- the fitted constant's slope against
      log N excludes zero. HEUR-RHO-BASE-1's transferable half is refuted at the
      tested scope; every constant is scoped to its own size and no pooled
      constant may be quoted.
    - >-
      F5 (BASELINE INCOHERENCE) -- BSGS uses more group operations than rho at
      any tested size with an unconstrained table. One of the two
      implementations is wrong; neither baseline is admissible until resolved.
    - >-
      F6 (PREMISE ALREADY FALSE) -- Stage 0 finds a completed run under
      EXP-RHO-60da4f, or any other committed run, already reporting a collision
      constant with a distinguished-point table size and peak memory. The parent
      proposal's premise that no record measures rho is FALSE at the tested
      scope; C2 and C3 are superseded and the contract narrows to C4 or
      terminates. Reported as the headline outcome.
    - >-
      F7 (MEMORY NOT ACCOUNTED, A FAILURE OF THE REPORT) -- any output quoting a
      rho or BSGS cost without peak memory beside it, or mixing measured and
      modeled numbers in one column. The result is out of contract regardless of
      the numbers, because a baseline measured without memory accounting is not
      the baseline this hypothesis asserts.

  interpretation_limits:
    - >-
      MEASURES A KNOWN ALGORITHM; PRODUCES NO NEW ATTACK AND NO EXPONENT. The
      parent proposal's own limit, preserved exactly.
    - >-
      THE CONSTANT IS IMPLEMENTATION- AND HARDWARE-BOUND AND IS NOT A PROPERTY
      OF THE ALGORITHM. Only ratios against competitors measured on the same
      machine are portable.
    - >-
      TOY SIZES ONLY; THE FIT IS A TOY-RANGE FIT. Bit sizes 16 to 28. Nothing
      here supports any statement at cryptographic size, and the step-count
      constant's transfer beyond 28 bits is HEUR-RHO-BASE-1, which the
      experiment tests over a 12-bit range and cannot test beyond it.
    - >-
      THE WALL-CLOCK CONSTANT DOES NOT TRANSFER ACROSS SIZES, because per-step
      field arithmetic cost grows with p. The step-count constant and the
      wall-clock constant are separate columns and combining them is out of
      contract.
    - >-
      THE DISTINGUISHED-POINT RATE CAN BE TUNED TO FLATTER THE BASELINE IN
      EITHER DIRECTION, which is why theta is frozen, reported per run, and
      swept once as its own cell.
    - >-
      A MEASURED BASELINE DOES NOT RE-ADJUDICATE ANY PAST COMPARISON. Doing so
      is a separate Coordinator act with its own decision record.
    - >-
      NOVELTY. The parent proposal records novelty_status 'unverified' and says
      plainly that the algorithm and its analysis are classical and that van
      Oorschot-Wiener parallelisation is published, so nothing mathematical is
      new. That verdict is preserved and no external literature was consulted
      during conversion.

