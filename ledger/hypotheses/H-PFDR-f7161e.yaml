hypothesis:
  id: H-PFDR-f7161e
  question_id: RQ-DREG-001
  source_idea_id: IDEA-20260828-d91efa
  batch_id: BATCH-c64bee
  title: >-
    The amalgam Hilbert-series identity H_full = H_A * H_B / H_{k[U]} is a
    CANDIDATE predictor of the committed boolean chained-Semaev rank deficits,
    and its first obligation is to prove it is not a re-derivation of the
    semi-regular reference the deficits are already measured against -- because
    if the tensor prediction reproduces sr_pred exactly, the predicted deficit
    is identically zero, the pre-registered agreement band has width zero, and
    the test cannot fire in either direction.
  statement: >-
    (A) THE OBJECT. In the boolean chained Semaev system at t = 3 over
    GF(2), IDEA-20260828-d91efa asserts a block decomposition into an ideal
    I_A of n quadrics on the (U, X3) block and an ideal I_B of n cubics on the
    (U, X1, X2) block, sharing only the U variables, so that
    R = k[U, X1, X2, X3]/(I_A + I_B) equals R_A tensor_{k[U]} R_B. Under
    Tor-independence the standard identity gives
    H_full(z) = H_A(z) * H_B(z) / H_{k[U]}(z), with the per-block semi-regular
    approximants H_A(z) = (1 + z)^{n+k} (1 + z^2)^{-n} and
    H_B(z) = (1 + z)^{n+2k} (1 + z^3)^{-n} as stated by the source idea from
    H-DREG-5a3ac1. R_B is almost certainly NOT flat over k[U], so the identity
    is a heuristic extension and not a theorem here.
    (B) THE PREDICTION UNDER TEST, IN THE ONLY CURRENCY THE GOAL MEASURES.
    GOAL-DREG-001 measures a RANK DEFICIT against a global semi-regular
    reference sr_pred(n, D), not a raw column count. The committed deficits
    read verbatim from H-DREG-5a3ac1 are 29,418 - 28,096 = 1,322 at n = 12
    D = 5 and 145,881 - 143,882 = 1,999 at n = 18 D = 5, and that record also
    states the n = 15 D = 5 deficit as 1,862. THE PREDICTION IS THEREFORE
    D_pred(n, D) = [truncated partial sum of H_A H_B / H_{k[U]} at degree D]
    - sr_pred(n, D), compared against the committed D_meas(n, D), with a
    correction term c(n, D) = D_meas - D_pred reported at every admitted cell
    whether or not the naive c = 0 form holds.
    (C) THE OBLIGATION THAT COMES FIRST AND IS BLOCKING -- THE
    NON-DEGENERACY OF THE TEST ITSELF. sr_pred is itself a generic /
    semi-regular count, and H_A, H_B are themselves semi-regular approximants.
    It is therefore entirely possible that the tensor formula reproduces
    sr_pred SYMBOLICALLY, giving D_pred identically 0 at every cell. In that
    case the source idea's pre-registered plus-or-minus 25 percent agreement
    band is a band of width zero around zero, no measured deficit of any size
    can ever agree with it, and no measured deficit can distinguish the tensor
    mechanism from the reference it is being compared to. THE FIRST DELIVERABLE
    IS THE SYMBOLIC QUANTITY Delta0(n, D) = [tensor prediction] - sr_pred(n, D),
    computed before any comparison. If Delta0 is identically zero the honest
    result is that the identity is a re-derivation of the existing null and
    carries no new content on this observable, and that result is archived
    rather than the band being run.
    (D) THE THREE OUTCOMES, ALL DELIVERABLES. (i) Delta0 identically 0: the
    mechanism is not separable from the semi-regular reference on this
    observable; reported, and the forward guidance is that a separating
    observable must be graded (the full Hilbert function), not a single
    truncated deficit. (ii) Delta0 nonzero and D_pred agrees with D_meas within
    a band set as a fraction of |Delta0|: the tensor identity is a candidate
    zero-marginal-compute predictor, still requiring an out-of-sample check
    before any use. (iii) Delta0 nonzero and D_pred misses: the correction term
    c(n, D) is the object, its sign and growth across the admitted cells are the
    measurement, and the lane learns where cross-block structure lives.
    (E) WHAT IS NOT CLAIMED. No algorithm, no exponent, no ECDLP statement, no
    transfer to t >= 4 or to prime fields, and no forward extrapolation past the
    memory wall on the strength of a fit at committed cells alone.
  mechanism: >-
    The tracked object is the pair of per-block Hilbert series (H_A, H_B)
    together with one scalar correction c(n, D). It is a lossy projection of the
    glued Macaulay system: it discards every coefficient, the monomial order,
    the curve, the field and the incidence pattern between blocks, retaining two
    closed-form series and one integer. It is lossy compatibly with the
    operation the instrument performs only IF Tor-independence holds, because
    exactly then does the graded dimension of the tensor product factor; when it
    fails, the discarded cross-block syzygies re-enter and c(n, D) is their
    measure. That conditional compatibility is why this hypothesis is a
    candidate and not a theorem, and it is why the correction term is a required
    output rather than an error bar.
    WHY THE COMPARISON MUST BE MADE IN DEFICIT AND NOT IN RANK. The committed
    ranks are of order 10^4 to 10^5 and the deficits are of order 10^3, so a
    band placed on the rank is roughly a factor 7 band on the deficit and passes
    trivially, while a band placed on the deficit is a band of order 1 percent
    on the rank and is a real test. The source idea states its band as
    plus-or-minus 25 percent without saying of what; this record fixes it to the
    deficit and to |Delta0|, and records the change.
    WHERE THE ARGUMENT STOPS. It stops at t >= 4, where the block graph becomes
    a path rather than an amalgam; at prime fields, where there is no boolean
    field equation and the series convention changes; and at any cell whose
    committed rank is a subset-column rank rather than a full-column exact rank,
    which RQ-DREG-001 declares INVALID as evidence for the semi-regular arm.
  assumptions:
    - >-
      [inherited, load-bearing] The block decomposition asserted by
      IDEA-20260828-d91efa from H-DREG-152cff -- I_A on (U, X3), I_B on
      (U, X1, X2), sharing only U -- is correct. THIS RECORD DID NOT OPEN
      H-DREG-152cff and does not verify it; the decomposition is a Stage 0
      blocking precondition to be re-derived from the committed source of the
      chained system, not assumed.
    - >-
      [inherited, load-bearing] H_A and H_B as stated are the per-block
      semi-regular series H-DREG-5a3ac1 computes. THIS RECORD READ
      H-DREG-5a3ac1 ONLY BY TARGETED SEARCH, not in full, and confirmed from it
      the deficit arithmetic 29,418 - 28,096 = 1,322 at n = 12 D = 5, the
      n = 18 D = 5 pair 145,881 - 143,882 = 1,999, and the n = 15 D = 5 deficit
      1,862. The series forms themselves are taken from the source idea and are
      a Stage 0 blocking re-derivation.
    - >-
      [correction to the source idea] IDEA-20260828-d91efa states its cells as
      n in {9, 12} and D in {5, 6}, four committed cells. The cells this
      coordinator could confirm from H-DREG-5a3ac1 are n = 12, n = 15 and
      n = 18, all at D = 5. The n = 9 and D = 6 cells are NOT confirmed to
      exist, and Stage 0 enumerates the actually committed cells rather than
      adopting the idea list. A design that runs on cells that do not exist
      would have manufactured its own data.
    - >-
      [convention] The boolean field-equation convention introduces (1 + z)
      factors where the classical polynomial ring has (1 - z)^{-1}. Both sides
      of the identity are put in the SAME convention explicitly and the
      derivation is shown, or the comparison is invalid by construction rather
      than by mechanism.
    - >-
      [scope] Any committed rank obtained from a subset-column computation is
      excluded. RQ-DREG-001 states subset-column rank is INVALID for the
      semi-regular arm and only full-column exact ranks are evidence.
  proof_search_map:
    bottleneck: >-
      Whether the glued system deficit is a determined function of the two
      sub-ideal Hilbert series plus one correction, or depends on cross-block
      syzygy content that no per-block computation can see. The exact step whose
      removal changes the answer is the gluing of I_A and I_B into a single
      nb-variable Macaulay matrix.
    baseline_embedding:
      parameter_slice: >-
        The FULL-SUPPORT null: I_A and I_B replaced by generic full-support
        quadrics and cubics of the same shape, whose deficit against sr_pred is
        forced to be exactly 0. H-DREG-5a3ac1 carries the same control and its
        own proof obligation states the full-support null returns deficit
        exactly 0 at its budgeted cell.
      reproduction_check: >-
        Symbolic and exact, zero compute. The tensor formula evaluated on the
        full-support null must return deficit exactly 0 under the adapted
        boolean series convention. A nonzero value is a bug in the series
        algebra and nothing else in the record may be read.
    observation_collision:
      observable: >-
        The single integer D_pred(n, D), the predicted deficit at a cell.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and its success is the reason
        Delta0 must be computed first. Every pair (I_A, I_B) with the same
        (H_A, H_B) produces the same D_pred regardless of its actual cross-block
        syzygies; and, more sharply, the semi-regular reference sr_pred is
        itself a candidate preimage of the same value. The BLOCK-PERMUTED
        system, in which the quadric and cubic families are swapped between
        blocks, is the constructed second preimage: it changes H_A and H_B
        computably and must give a computably different prediction. A formula
        that cannot separate the true pairing from its permutation is measuring
        block SIZES and not the amalgam.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the full nb-variable Macaulay matrix by the pair (H_A, H_B)
          plus one measured scalar c(n, D), each computable in a strictly
          smaller ring.
        predicted_gain: >-
          Encoding is NOT exact a priori; the flatness condition is under test.
          Completeness and soundness are checked against committed deficits at
          zero new compute. Transfer is DECLARED UNMET beyond t = 3 and beyond
          boolean fields, and the growth of c(n, D) is unknown and is an output
          rather than an assumption.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable D_pred fixed and vary the forgotten structure --
          the block assignment, the support pattern -- and ask what intrinsic
          invariant separates the resulting systems. The prediction is that at
          the truncated-deficit resolution NONE does, which is the content of
          the Delta0 gate.
        predicted_gain: >-
          A clean statement of what the truncated deficit cannot see, which is
          the forward guidance if Delta0 vanishes.
    quantifier_order: >-
      CLAIMED, and only in the direction the committed data can settle. THERE
      EXISTS a correction function c(n, D) such that for the enumerated
      committed cells, D_meas(n, D) = D_pred(n, D) + c(n, D), with c MEASURED
      and never fitted, and its sign and magnitude reported per cell.
      NOT CLAIMED: that c is bounded, that c has any particular n-dependence,
      that the identity holds for all n, or that any forward prediction at an
      uncomputed cell is validated by agreement at committed cells.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the enumerated committed cells of GOAL-DREG-001, the tensor
        Hilbert-series identity predicts the measured rank deficit to within a
        stated distance, and the residual correction takes the stated values."
        It can NEVER certify that cross-block syzygies are absent, that the
        identity holds at any uncomputed cell, or anything about t >= 4, prime
        fields, d_reg growth, or the ECDLP.
      nearby_object_control: >-
        The BLOCK-PERMUTED system, which is blocking. It has the same block
        SIZES and a different incidence, so a method that returns the same
        prediction for both is responding to sizes alone and has not identified
        the amalgam structure.
    proof_obligations:
      - claim: >-
          Delta0(n, D) = [tensor prediction] - sr_pred(n, D) is computed
          symbolically at every admitted cell BEFORE any comparison, and is
          reported whether or not it is zero.
        responsibility: strictness
      - claim: >-
          The boolean series convention is applied identically to both sides,
          with the derivation shown.
        responsibility: correctness
      - claim: The full-support null returns predicted deficit exactly 0.
        responsibility: baseline
      - claim: >-
          The block-permuted control returns a prediction that differs from the
          true pairing by more than the reporting resolution.
        responsibility: strictness
      - claim: >-
          The admitted cell list is enumerated from committed full-column exact
          ranks, not from the source idea list.
        responsibility: baseline
      - claim: >-
          c(n, D) is reported per cell, never averaged across cells and never
          tuned.
        responsibility: interface
      - claim: >-
          Nothing transfers to t >= 4, to prime fields, or to any uncomputed n.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        NEAR-FLATNESS. For the specific graded quotients R_A and R_B arising
        from the boolean chained Semaev system at t = 3, the Hilbert series of
        R_A tensor_{k[U]} R_B agrees with H_A H_B / H_{k[U]} in every
        coefficient up to degree D, despite R_B not being flat over k[U].
      random_model_justification: >-
        The flat case is a standard commutative-algebra theorem, quoted by the
        source idea from a web search and NOT verified against a pinned theorem
        by this coordinator. The near-flat extension has no rigorous support and
        imitates the same near-generic assumption the semi-regular heuristic
        already makes for a non-generic system. It is the quantity under test,
        not a support.
      supporting_results:
        - ref: IDEA-20260828-d91efa
          provenance: internal
          claim: >-
            States the tensor-over-k[U] identity, its flatness precondition, the
            expected failure of that precondition, and the correction term
            c(n, D) as the object if the naive form fails.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
        - ref: H-DREG-5a3ac1
          provenance: internal
          claim: >-
            Carries the committed deficit arithmetic 29,418 - 28,096 = 1,322 at
            n = 12 D = 5, 145,881 - 143,882 = 1,999 at n = 18 D = 5, the
            n = 15 D = 5 deficit 1,862, and the full-support null whose deficit
            is forced to exactly 0.
          verified_by: >-
            coordinator, TASK-20260904-9c61a9 (targeted search of the record,
            NOT a full read; the quoted arithmetic was read on the returned
            lines)
      validation_experiment_ids:
        - EXP-PFDR-d2263b
      falsification_condition: >-
        D_pred misses D_meas by more than the band set from |Delta0| at any
        admitted cell. The naive c = 0 form is false and c(n, D) becomes the
        object.
    - id: HEUR-002
      formal_statement: >-
        SEPARABILITY. The tensor prediction is not symbolically equal to the
        semi-regular reference sr_pred, i.e. Delta0(n, D) is not identically
        zero on the admitted cells.
      random_model_justification: >-
        No rigorous ingredient. This is a claim about two closed forms and is
        decided by symbolic algebra at zero compute. It is numbered separately
        because its failure makes the entire comparison vacuous rather than
        negative, and a vacuous test that is reported as a negative is the
        failure mode this record exists to avoid.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-d2263b
      falsification_condition: >-
        Delta0 identically 0. The identity is a re-derivation of the existing
        null on this observable; the band is not run, and the record reports the
        non-separability as its result.
  structural_ingredients:
    - description: >-
        The Hilbert-series identity for a tensor product over a base ring with
        one flat factor, H_{M tensor_A N} = H_M H_N / H_A.
      citation: 'standard graded commutative algebra; no pinned theorem opened'
      provenance: recalled
      verified_by: null
      role: >-
        supplies the functional form. RECALLED by this coordinator: the source
        idea marks it retrieved on the strength of a web search summary, which
        is not a read source. The contract requires the executor to state the
        exact hypotheses of the identity it uses and where it read them.
    - description: >-
        The committed rank deficits of GOAL-DREG-001 against the global
        semi-regular reference, and the full-support null whose deficit is 0.
      citation: 'ledger/hypotheses/H-DREG-5a3ac1.yaml'
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-9c61a9 (targeted search; the quoted deficit
        arithmetic read verbatim on the returned lines)
      role: the measured comparator and the zero-deficit baseline
    - description: >-
        The rule that subset-column rank is INVALID for the semi-regular arm and
        that only full-column exact ranks are evidence.
      citation: 'ledger/RQ-DREG-001.yaml, constraints'
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: the admissibility filter on the cell list
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The statement is about whether one closed
      form predicts a measured integer at cells that already exist.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- Delta0(n, D), the symbolic difference between the tensor
        prediction and sr_pred, at every admitted cell. UNITS: columns (integer)
      direction: different
      minimum_effect: >-
        REPORTED FIRST AND BLOCKING, with NO predicted value, because predicting
        it would prejudge the separability question. Delta0 identically 0 halts
        the band comparison and is itself the result.
    - metric: >-
        P2 -- the full-support null prediction. UNITS: columns (integer)
      direction: different
      minimum_effect: >-
        FORCED EXACTLY 0. A nonzero value is a bug in the boolean series
        convention and nothing else may be read.
    - metric: >-
        P3 -- |D_pred - D_meas| at each admitted cell, against a band of
        0.25 * |Delta0(n, D)|. UNITS: columns (integer)
      direction: different
      minimum_effect: >-
        Agreement inside the band at EVERY admitted cell is the positive
        outcome. Agreement at one cell and a miss at another is reported as
        NON-GENERALIZING and never averaged. The band is a fraction of the
        separation the formula actually claims, not of the deficit and not of
        the rank, precisely so it cannot be satisfied by a formula that predicts
        nothing.
    - metric: >-
        P4 -- the block-permuted prediction minus the true-pairing prediction.
        UNITS: columns (integer)
      direction: different
      minimum_effect: >-
        FORCED NONZERO and larger than the reporting resolution. Zero means the
        formula responds to block sizes and not to incidence, and the mechanism
        is under-determined.
    - metric: >-
        P5 -- the PLANTED-DEFECT calibration: H_A perturbed by removing exactly
        one generator, so the predicted deficit must move by a hand-derivable
        amount. UNITS: columns (integer)
      direction: different
      minimum_effect: >-
        FORCED to move by the derived amount, exactly. This is the dynamic-range
        demonstration: an instrument that does not move when a defect of known
        size is planted cannot be read when it fails to move on the real object.
    - metric: >-
        P6 -- c(n, D) = D_meas - D_pred per admitted cell, with its sign.
        UNITS: columns (integer)
      direction: different
      minimum_effect: >-
        REPORTED PER CELL with no predicted value and never fitted. Two or three
        cells cannot establish a growth law and no growth law is fitted from
        them; the values and their signs are the deliverable.
  test_boundary:
    instances:
      - >-
        The committed full-column exact rank cells of GOAL-DREG-001 for the
        boolean chained Semaev system at t = 3, enumerated at Stage 0 from the
        ledger and frozen before any comparison
      - 'the full-support generic null of matched shape (curve-free)'
      - 'the block-permuted system of matched block sizes'
      - 'one planted-defect variant of H_A'
    parameters:
      arity: 't = 3, boolean GF(2) chained representation only'
      cells: >-
        enumerated at Stage 0; the cells this record could confirm are
        n = 12 D = 5 (deficit 1,322), n = 15 D = 5 (1,862) and n = 18 D = 5
        (1,999). The source idea list n in {9, 12}, D in {5, 6} is NOT adopted.
      band: '0.25 * |Delta0(n, D)|, set per cell after Delta0 is computed and before D_pred is compared'
      convention: 'boolean field-equation series convention, applied identically to both sides and shown'
    implementation: >-
      Closed-form series arithmetic in exact integers. NO Macaulay matrix is
      built, NO rank is computed, and NO new cell is measured. The entire
      protocol reads committed integers and evaluates truncated power series.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 1
      maximum_memory_gb: 8
      maximum_runs: 0
  falsification_conditions:
    - >-
      F1 VACUOUS TEST. Delta0 is identically 0 on the admitted cells. The tensor
      identity is not separable from the semi-regular reference on the truncated
      deficit, the band is not run, and the reported result is the
      non-separability with its forward guidance toward a graded observable.
    - >-
      F2 SERIES BUG. The full-support null does not return predicted deficit
      exactly 0. The boolean convention adaptation is wrong and nothing in the
      record may be read.
    - >-
      F3 SIZE-ONLY RESPONSE. The block-permuted control returns a prediction
      indistinguishable from the true pairing. The formula sees block sizes and
      not incidence.
    - >-
      F4 INSTRUMENT DEAD. The planted-defect perturbation does not move the
      prediction by the derived amount. The evaluator is not computing what it
      claims and no null from it means anything.
    - >-
      F5 NAIVE FORM FALSE. D_pred misses D_meas beyond the band at any admitted
      cell. HEUR-001 is falsified; c(n, D) with its per-cell sign is the
      surviving deliverable.
    - >-
      F6 CELL INVENTORY EMPTY OR SINGLE. Fewer than two admitted cells exist.
      The comparison is reported as UNDERPOWERED with the inventory attached; it
      is not run on one cell and quoted as agreement.
    - >-
      F7 EVERYTHING HOLDS. Delta0 nonzero, the null and controls dispose as
      forced, and D_pred agrees within the band at every admitted cell. The
      tensor identity becomes a CANDIDATE zero-marginal-compute predictor,
      explicitly not validated for forward extrapolation, and the next step is
      an out-of-sample check against a cell measured after the prediction is
      frozen.
  interpretation_limits:
    - >-
      Toy scale, t = 3, boolean GF(2) only. Nothing transfers to t >= 4, where
      the block graph becomes a path, nor to prime fields, where the series
      convention changes and there is no boolean field equation.
    - >-
      A PASS at committed cells is a retrodiction. It is not a validated
      extrapolation route past the memory wall and may never be quoted as one
      without an out-of-sample cell measured after the prediction is frozen.
    - >-
      A FAIL does not close GOAL-DREG-001 or answer RQ-DREG-001. It localises
      where cross-block structure lives and hands forward the correction term.
    - >-
      The comparison inherits whatever error the per-block semi-regularity
      heuristic already carries for these sub-systems, which is untested
      independently. With a small number of committed cells the design cannot
      separate a failure of sub-ideal semi-regularity from a failure of the
      combination formula, and it does not claim to.
    - >-
      No exponent, no algorithm, no attack, no ECDLP claim. sota_delta is zero
      on every cost axis.
