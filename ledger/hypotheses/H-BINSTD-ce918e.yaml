  proposed_by: coordinator
  title: >-
    At fixed dim(V)=ℓ on toy binary cells, peak RSS of S_3 encode+one-shot
    solve under a shared XOR-SAT pin stays ≤ M₀·2^{α·ℓ} (α,M₀ frozen), or
    the band breaks

  statement: >-
    CLAIM (heuristic_validation / memory instrument; NO ATTACK; NO EXPONENT).
    Let V ⊂ F_{2^n} be an F_2-subspace of dimension ℓ. Encode the Weil-
    descended Semaev S_3 PDP with x1,x2 ∈ V under a frozen XOR-SAT pin and
    perform one-shot F₂ linear solve of the pure-linear slice (stdlib pin;
    no Magma/Sage). Let peak_rss be the process peak RSS in bytes measured
    by resource.getrusage. FORALL Stage-1 cells (n,ℓ)∈{(17,3),(17,4)}, with
    (α,M₀) frozen at Stage 0, peak_rss ≤ M₀·2^{α·ℓ} — OR the band is broken
    and recorded as memory-super-exponential-in-ℓ / n-sensitive at toys
    (O-FAIL-BAND). Distinct from IDEA-20261001-214fd3 (last-fall), 556cea
    (solving vs first-fall), febbe1 (N_var Spearman), and solver races.
    NO break. NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} with V an F_2-subspace of
    fixed dimension ℓ; Operation: encode descended S_3 and one-shot solve
    under a frozen pin; Observable: peak_rss_bytes. Trichotomy: Class I
    instrument (memory law). Lossy-projection: RSS discards which clauses
    dominate. OFF-LIMITS: last-fall / solving degree; dim(V·V)→N_var;
    engine bake-offs; yield. WHAT IS NEW: a frozen (α,M₀) peak-RSS band
    versus n at fixed ℓ on RQ-BINSTD toys.

  predictions:
    - metric: peak_rss_bytes
      direction: upper_bounded
      minimum_effect: '≤ M₀ · 2^{α·ℓ} at each Stage-1 (n,ℓ) cell'
    - metric: twin_agreement
      direction: same
      minimum_effect: 'encode N_var path A = path B on every measured V'
    - metric: rss_probe_available
      direction: same
      minimum_effect: 'resource.getrusage peak RSS probe returns a finite integer'

  test_boundary:
    instances:
      - 'Stage 0: freeze V family, (α,M₀), XOR-SAT pin, RSS probe; twin check'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3),(17,4)} peak-RSS vs band'
    parameters:
      alpha: 1.0
      M0_bytes: 16777216
      catalog_seed: 202610032056
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-cb15a4/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin meters in encode_s3.py. RSS via resource.getrusage. No Magma/
      Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - >-
      Editing (α,M₀) after Stage-0 freeze (protocol invalid).
    - >-
      Claiming practical binary IC or an exponent move from a toy memory
      band (KR-IC-1fcdbc).
    - >-
      Equating peak RSS with last-fall or solving degree (214fd3 / 556cea).
    - >-
      Transferring the band to n≥131 without a new contract.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; RSS probe OK; peak_rss ≤ band on every Stage-1 cell.
        Memory band holds at toys. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; RSS probe OK; peak_rss > band on at least one Stage-1 cell.
        Band broken at this scale.
    - id: O-INCONCLUSIVE
      meaning: >-
        RSS probe returns no usable finite measurement on a completed cell.
    - id: O-ARTIFACT
      meaning: Twin disagreement or freeze/regression failure. No band claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze / RSS probe
        unavailable at Stage 0. Never negative evidence against H-BINSTD-ce918e.

  interpretation_limits:
    - Memory band only; does not predict yield or beat rho.
    - Shared XOR-SAT pin; a different pin needs a new idea/contract.
    - >-
      Stage-2 (n∈{19,23,29,31} + random-Boolean null) authorized on successor
      EXP-BINSTD-ff5050 (DEC-20261003-953dd5); not on parent EXP-BINSTD-cb15a4.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - OS RSS is an upper envelope, not exact heap accounting.

  heuristic_assumptions:
    - id: HEUR-BINSTD-20561e-H1
      formal_statement: >-
        FORALL ℓ∈{3,4}, FORALL Stage-1 n=17 cells: on the frozen V family and
        shared XOR-SAT pin, peak_rss(encode+solve) ≤ M₀ · 2^{α·ℓ} with
        (α,M₀)=(1.0, 16777216) frozen at Stage 0.
      random_model_justification: >-
        Rigorous: at fixed ℓ the descended variable count is governed by
        dim(V) and product-space structure (KR-IC-73db3f), not by n once
        Weil restriction is written; classical SAT/encode memory scales with
        clause store size. If that channel dominates, RSS should stay inside
        a frozen exponential-in-ℓ band; if n-dependent fill-in or solver
        heuristics dominate, the band breaks. The band is the pre-registered
        transfer hypothesis at toys — not a claim that SAT beats rho.
      supporting_results:
        - KR-IC-5765d2
        - KR-IC-73db3f
        - KR-IC-1fcdbc
      validation_experiment_ids:
        - EXP-BINSTD-cb15a4
        - EXP-BINSTD-ff5050
        - EXP-BINSTD-a33de2
      falsification_condition: >-
        peak_rss > M₀·2^{α·ℓ} at a completed Stage-1 cell (O-FAIL-BAND), OR
        twin failure (O-ARTIFACT), OR RSS probe unavailable (O-IMPEDIMENT /
        O-INCONCLUSIVE).

  asymptotic_claim:
    problem: >-
      Peak-RSS predictability of Weil-descended S_3 encode+solve at fixed ℓ
      on toy binary IC cells
    prior_best: >-
      KR-IC-5765d2 (SAT/XOR PDP); KR-IC-1fcdbc (binary IC slower than rho)
    time_exponent: >-
      NO EXPONENT MOVED. Memory instrument only; a held band does not move
      binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: >-
      Pre-registered upper band M₀·2^{α·ℓ} at toys; not an asymptotic claim.
    hidden_cofactor: Encoder constants; solver heap fragmentation; OS RSS noise
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether encode+solve peak RSS stays inside a frozen exponential-in-ℓ
      band at fixed dim(V)=ℓ, or whether n-sensitive fill-in breaks it.
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, poly basis V=span{1,t,t^2}; twin N_var must agree and RSS
        probe must return a finite integer before any band is read.
      reproduction_check: >-
        Independent check.py recomputes twin N_var on the Stage-0 probe and
        re-derives band_bytes = M₀·2^{α·ℓ} on Stage-1 panels.
    observation_collision:
      observable: 'peak_rss_bytes vs M₀·2^{α·ℓ} per (n,ℓ)'
      distinct_preimage_search: >-
        A held band could arise from (i) ℓ-dominated encode size (claim) or
        (ii) an OS RSS floor that hides growth. Separated by requiring twin
        encode agreement and by Stage-2 multi-n + random-Boolean null (not
        authorized here).
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Frozen (α,M₀) band + twin encode meters + getrusage peak-RSS probe
          on encode+one-shot F₂ solve.
        predicted_gain: >-
          A decidable support/fail label for the memory-law reading at toys.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3) and (17,4): peak_rss ≤ band is PREDICTED.
      NOT CLAIMED: n∈{19,23,29,31} under this card; n≥131; any attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named Stage-1 toy cells, measured peak_rss lies ≤ or > the
        frozen band, with twin agreement.
      nearby_object_control: >-
        Twin disagreement (artifact); RSS probe failure (impediment/
        inconclusive). Stage-2 random-Boolean null not authorized.
    proof_obligations:
      - claim: Twin N_var paths agree on every measured V.
        responsibility: baseline
      - claim: Band arithmetic matches frozen (α,M₀).
        responsibility: baseline
      - claim: peak_rss vs band decides O-SUPPORT vs O-FAIL-BAND.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
