hypothesis:
  question_id: "RQ-CRYPTO-001"
  goal_id: "GOAL-CRYPTO-001"
  status: "proposed"
  proposed_by: "coordinator"
  task_id: "TASK-20260906-264d58"
  recorded_at: "2026-09-06"
  novelty_status: "unverified"
  asymptotic_claim: null
  heuristic_assumptions: []
  rerandomization: "No worst-to-average-case claim. Deterministic fixture selection and declared seeded controls only."
  dominated_by: "Unresolved across full time/memory/data frontier; no non-domination or new attack asserted."
  sota_delta: "Measured improvement: none; design only. Each local numeric threshold is a prospective diagnostic, not an ECDLP exponent claim."
  id: "H-ECDLP-f8cea6"
  source_proposal: "IDEA-20260905-7e154b"
  statement: "A public reduced-Tate character can be evaluated and decoded without hidden scalar input on the finite frozen fixture panel, and the complete transfer/evaluation/decoding/verification cost can be measured separately. The diagnostic cost hypothesis is that at least one embedding-degree bin offers a >=20 percent end-to-end speedup over matched curve BSGS on both independent instances. This is known-pairing interface calibration, not evidence for a new arithmetic character."
  mechanism: "Fix public nonzero G of prime order r and T in E(Fp^k) with χ(G)=t_r(G,T) nontrivial, k=ord_r(p). Evaluate χ(R)=t_r(R,T) using Miller evaluation with final exponent (p^k-1)/r; serialize a field element in a frozen polynomial basis. Decode χ(Q) relative to χ(G) by explicitly implemented order-r BSGS, then verify [a]G=Q. Generator construction, nontrivial T search, field construction, character evaluation, tables and final verification are charged."
  assumptions:
    - "Use the reduced Tate pairing, not a Weil self-pairing. T need not be r-torsion and is chosen in the quotient interface E(Fp^k)/rE(Fp^k). Nontriviality is checked directly."
    - "A nontrivial prime-order character is injective as a mathematical map but its field-element encoding is not a free scalar label."
    - "Finite-field BSGS is a transparent calibration decoder; no best finite-field algorithm or generic character impossibility is claimed."
  predictions:
    - metric: "Fully charged matched curve-BSGS cost / character-transfer-BSGS cost"
      direction: "higher"
      minimum_effect: ">=1.20 at q=64 on both selected instances of at least one embedding-degree bin in both timing seeds."
  test_boundary:
    instances:
      - "Two deterministic generated instances per embedding bin k=1, k=2, k=3..6, k=7..12, subject to finite search caps."
    parameters:
      prime_start_bits:
        - 8
        - 10
      r_min: 17
      r_max: 251
      k_max: 12
      queries:
        - 1
        - 64
    implementation: "Sage finite fields and reduced Tate pairing; explicit BSGS in both groups, isolated scalar verifier."
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 1
      maximum_memory_gb: 8
      maximum_runs: 1
  falsification_conditions:
    - "Complete valid panel and no cell gives an end-to-end speedup over curve BSGS; this rejects only this decoder/interface cost hypothesis."
    - "Trivial χ(G), homomorphism failure or scalar leakage invalidates affected fixture; inability to find T within a cap is inconclusive."
  interpretation_limits:
    - "Bilinearity and finite-label agreement are baseline controls, not research discoveries."
    - "This does not test the existence of special non-pairing characters or prove that high embedding degree forbids every useful representation."
    - "Any speedup is against the declared BSGS baselines at tiny r; no Pollard-rho, memory-frontier or cryptographic-security claim."
  proof_search_map:
    bottleneck: "Turning a computable character value into an inexpensive usable logarithm without hiding cost in output encoding."
    baseline_embedding:
      parameter_slice: "Same order-r input Q=aG, direct curve BSGS and reduced-Tate transfer plus field BSGS; same q and memory-accounting rule."
      reproduction_check: "χ(O)=1, χ(G)^r=1, χ(G)!=1, exhaustive χ([a]G)=χ(G)^a for a=0..r-1, and independent [decoded]G=Q."
    observation_collision:
      observable: "Canonical k-coefficient field-element vector."
      distinct_preimage_search: "Exhaustively enumerate all r scalar-labelled reference points only in isolated verifier; report duplicate character outputs and reject nontriviality claims if fewer than r distinct outputs."
    constructive_transforms:
      - transform: "representation_reduction"
        proposed_object: "Known reduced-Tate public character interface"
        predicted_gain: "Prospective finite-parameter cost crossover, no asymptotic gain asserted."
    quantifier_order: "Select fixture before timing, then T from a fixed bounded sequence using only public data and χ(G)!=1; evaluate every frozen target without its label. The evaluator must not adapt T to Q or use verifier tables."
    method_ceiling:
      strongest_certifiable_claim: "Reproducible baseline character/decoder cost decomposition on the finite panel."
      nearby_object_control: "Trivial character and deliberately leaked scalar oracle; both must be rejected as usable honest character interfaces."
    proof_obligations:
      - claim: "Public inputs, field basis, nontriviality, pairing final exponent and subgroup correctness are explicit."
        responsibility: "interface"
      - claim: "Include all field/T search, preprocessing, decoder and verification cost."
        responsibility: "runtime"
      - claim: "Known-control reproduction cannot discharge a novel-character or crypto-tier claim."
        responsibility: "scope"
    not_applicable_reason: null
