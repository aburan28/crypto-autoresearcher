# H-SSI-b52528
# Distribution-bridge slice of IDEA-20261004-a09dd4.
# Toy j-support and tag-pullback audit. Not an integer-count contract.
hypothesis:
  id: H-SSI-b52528
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  source_idea: IDEA-20261004-a09dd4
  experiment_id: EXP-SSI-e502f5
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-07057a
  title: >-
    Collapsing every supersingular j to the j=1728 key matches the
    uniform bare set only when that set has size 1
  statement: >-
    For p in {7, 11, 19}, let S_p be the set of supersingular
    j-invariants in F_{p^2} = F_p[i]/(i^2+1). A design-session
    enumeration, which is not a run, found
    S_7 = {6}, S_11 = {0, 1}, S_19 = {7, 18}, with 1728 mod p
    equal to 6, 1, and 18. Every element is F_p-rational.
    Let T_id be the identity on S_p, T_collapse the constant map
    onto {1728 mod p}, and T_forget the identity on j with the
    orientation tag deleted. Total variation of T_id and of
    T_forget against the uniform distribution on S_p is 0.
    Total variation of T_collapse is 0 at p=7 and 1/2 at p=11
    and at p=19. Pullback of the source state from the transcript
    fails on 0, 1, and 1 inputs under T_collapse, and on every
    input under T_forget.
  mechanism: >-
    Enumerate S_p by testing Weierstrass models of every j in
    F_{p^2}. Push uniform measure on S_p through the three
    compilers. Distance is the total variation of the output
    j-distribution against uniform S_p. Pullback reads only the
    stored transcript. T_collapse lands on the oriented j=1728
    key and forgets every other source. T_forget keeps every j
    and drops the tag, so the bare distribution is matched and
    the witness is not recovered.
  assumptions:
    - F_{p^2} is F_p[i]/(i^2+1) for these p congruent to 3 mod 4.
    - A j-invariant is supersingular when the point count of its
      short-Weierstrass model over F_{p^2} lies in
      {(p-1)^2, (p+1)^2, p^2+1, p^2+1-p, p^2+1+p}.
    - The model is y^2 = x^3 + 1 at j=0, y^2 = x^3 + x at j=1728,
      and y^2 = x^3 + 3kx + 2k with k = j/(1728-j) otherwise.
    - The transcript of T_collapse stores only the output j.
      The transcript of T_forget stores j and omits the tag.
  proof_search_map:
    bottleneck: >-
      A compiler that is simultaneously within total variation 0
      of uniform S_p and able to pull a non-redundant witness back.
    baseline_embedding:
      parameter_slice: >-
        S_p at p in {7, 11, 19}, the identity compiler, and the
        constant map onto 1728 mod p. IDEA-20261004-a09dd4 supplies
        the bridge shape. This slice does not instantiate SÉTA or
        LIT-SiGamal walks.
      reproduction_check: >-
        Euler-criterion point counting and exhaustive-square point
        counting must return the same S_p. The design-session sets
        are recomputed by those routes. They are not a run.
    observation_collision:
      observable: >-
        The output j-multiset, its total variation against uniform
        S_p, and whether pullback returns the input state.
      distinct_preimage_search: >-
        T_collapse sends every j to one key. At |S_p|=2 the two
        sources are distinct preimages of one output, and the
        transcript keeps only one of them.
    constructive_transforms:
      - transform: rejection_corrected_projection
        proposed_object: T_collapse
        predicted_gain: >-
          Names the total-variation gap 1/2 at p=11 and p=19.
          No attack exponent.
    quantifier_order: >-
      For each fixed p, enumerate every j in F_{p^2}, then every
      input in the measured S_p, then apply each compiler once.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact support sizes, total variations, and pullback failure
        counts for three compilers at three primes. Not a reduction
        to EndRing and not a statement at cryptographic size.
      nearby_object_control: >-
        T_id on S_p against itself. Distance 0 and pullback
        failures 0. That control is not a bridge from another locus.
    proof_obligations:
      - claim: The measured S_p equals the pre-registered sets
        responsibility: size
      - claim: T_collapse has total variation 1 - 1/|S_p|
        responsibility: correctness
      - claim: T_forget matches uniform S_p and fails every pullback
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        Exhaustive distances at these three primes describe only
        these three compilers. They do not bound a compiler at a
        larger prime.
      random_model_justification: >-
        S_p is enumerated in full. There is no sampling model.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-e502f5
      falsification_condition: >-
        A later record that treats a total variation at p in
        {7, 11, 19} as a cryptographic indistinguishability bound.
  structural_ingredients:
    - description: >-
        IDEA-20261004-a09dd4 states the distribution-bridge
        bookkeeping condition. This hypothesis tests three frozen
        compilers on enumerated supersingular j-invariants.
      citation: ledger/proposals/IDEA-20261004-a09dd4.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-05, proposal file read
      role: source claim and scope boundary
  reduction_chain:
    core_problem: >-
      Whether any frozen compiler matches uniform S_p and pulls
      the source state back.
    corollaries: []
  predictions:
    - metric: support_S
      direction: equal
      minimum_effect: >-
        S_7={6}, S_11={0,1}, S_19={7,18}, each element in F_p
    - metric: tv_collapse
      direction: equal
      minimum_effect: 0 at p=7, and 1/2 at p=11 and p=19
    - metric: pullback_failures_forget
      direction: equal
      minimum_effect: |S_p| at each prime
  test_boundary:
    instances:
      - supersingular j-invariants in F_{p^2} for p in {7, 11, 19}
    parameters:
      primes: [7, 11, 19]
      compilers: [T_id, T_collapse, T_forget]
    implementation: >-
      Two square tests, Euler's criterion and an exhaustive table
      of squares. Both count points on the same curve models.
    budget:
      maximum_runs: 6
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Both square tests agree, and the measured S_p differs from
      the pre-registered set at any prime.
    - >-
      Both square tests agree, and any recorded total variation or
      pullback-failure count differs from the statement.
    - >-
      A frozen compiler other than T_id has total variation 0 and
      zero pullback failures at p=11 or p=19.
  interpretation_limits:
    - T_id is a control. Matching a distribution to itself is not a bridge.
    - No result transfers to SÉTA, LIT-SiGamal, or a larger prime.
    - At p=7 the constant map and the identity coincide because |S_7|=1.
    - The papers named in IDEA-20261004-a09dd4 were not reopened here.
    - A timeout, a crash, or a square-test disagreement is not evidence against the statement.
  dominated_by:
    verdict: not_applicable
    justification: >-
      This audit measures three compilers. It claims no time or
      memory exponent and no PKE construction.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Records support sizes 1, 2, 2 and collapse distances 0, 1/2, 1/2.
  status_note: >-
    Approved with EXP-SSI-e502f5 by DEC-20261005-07057a under the
    standing user authorization of 2026-09-06.
