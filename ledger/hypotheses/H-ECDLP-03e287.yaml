hypothesis:
  id: H-ECDLP-03e287
  question_id: RQ-ECDLP-bc7a54
  goal_id: GOAL-ECDLP-001
  source_idea_ids:
    - IDEA-20261006-4c39d3
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Interpolation degree of the scalar on the small-x set against a
    random labelling
  statement: >-
    For an ordinary prime-order subgroup of size N on a short-Weierstrass
    curve over F_p, the minimal total degree of a bivariate polynomial in
    the affine coordinates that agrees with the discrete logarithm on a
    subset S of {Q : x(Q) < p^{2/3}} with |S| at least 2 N^{1/2} is at
    least half the minimal total degree of the same interpolation for a
    random bijection from Z/N to a set of N labels in F_p^2. No ECDLP
    exponent improvement is claimed. A ratio below 1/2 would falsify this
    statement and would still not by itself be an exponent.
  mechanism: >-
    Representation class R1: the integer digits of the affine coordinates
    (x, y). The operation set is negation only. The interval indicator
    x < p^{2/3} is invariant under negation, and the sign of y flips.
    The polynomial is allowed to read the full (x, y) of a point already
    known to lie in the interval. The quantity under test is the minimal
    total degree of a polynomial that matches the discrete log on S,
    compared with the same degree for a random labelling. A table of S
    is precomputation of size |S|, not a hint-family inversion. There is
    no summation polynomial and no trace morphism.
  assumptions:
    - >-
      Negation is quotiented before any degree is compared with the
      random labelling. The factor of two that negation can contribute
      is the 1/2 in the claimed ratio.
    - >-
      An interpolant that is a table of the points in S is precomputation
      of size |S| and is not scored as a short polynomial.
    - >-
      The anomalous curve is a calibration object. A cheap p-adic
      logarithm there is the known anomalous attack and is not evidence
      for the ordinary arm.
  proof_search_map:
    bottleneck: >-
      Producing the discrete log from the coordinates of a point in the
      small-x set without a table of that set. If the interpolation
      degree stays at the random-label degree, this grammar of
      polynomials does not remove that bottleneck.
    baseline_embedding:
      parameter_slice: >-
        Pollard rho at Theta(N^{1/2}) group operations with polynomial
        memory, and the Bernstein-Lange point of KR-RHO-ea34b8.
      reproduction_check: >-
        On the random bijection, the minimal total degree must sit at
        the generic interpolation threshold for |S| points, within a
        factor of 2 across two independent bijections. If the two random
        degrees differ by more than that, the instrument is void.
    observation_collision:
      observable: >-
        The minimal total degree of a polynomial agreeing with the
        discrete log on S.
      distinct_preimage_search: >-
        Inside one fiber of the interval-and-sign projection, list pairs
        with the same interval bit, the same sign of y, and different
        absolute discrete logs. A function of that projection cannot
        separate such a pair.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The minimal-degree bivariate polynomial on the full coordinates
          of a subset S of the small-x set, after the negation quotient.
        predicted_gain: >-
          A degree ratio at least 1/2 against the random labelling. The
          predicted gain in the ECDLP exponent is zero.
    quantifier_order: >-
      For every ordinary prime-order curve in the toy ladder, and for
      every bivariate polynomial of total degree less than half the
      random-label degree, there exists a point of S on which the
      polynomial disagrees with the discrete log.
    method_ceiling:
      strongest_certifiable_claim: >-
        A lower bound on interpolation degree inside the grammar of
        bivariate polynomials, on one interval subset, at toy N. The
        method cannot certify that every conceivable inversion is
        expensive.
      nearby_object_control: >-
        An anomalous curve of comparable size, where a p-adic logarithm
        is a cheap function of a lifted coordinate. The same instrument
        must return a degree ratio strictly below 1/2 on that curve, or
        the instrument is blind and the ordinary result is void.
    proof_obligations:
      - claim: >-
          The random-label degree is computed on two bijections and the
          ordinary degree is compared with their minimum.
        responsibility: baseline
      - claim: >-
          Every polynomial evaluation is checked against an exhaustive
          discrete-log table by the identity [k]P = Q.
        responsibility: correctness
      - claim: >-
          A degree ratio of 1/2 or higher does not reduce the
          Omega(N^{1/2}) operation count.
        responsibility: runtime
      - claim: >-
          The anomalous arm reproduces a cheap logarithm, certified by
          [k]P = Q, or the instrument is void.
        responsibility: feasibility
      - claim: >-
          The result is scoped to bivariate polynomials and to the
          interval x < p^{2/3}.
        responsibility: scope
    not_applicable_reason: >-
      No subfield is inapplicable. The degree is an exact integer on a
      tabulated group. There is no success-probability heuristic in the
      claim.
  asymptotic_claim:
    problem: >-
      Single-target discrete log on an ordinary prime-order subgroup,
      priced by interpolation degree rather than by group operations.
    prior_best: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations, met by rho
      up to a constant, and KR-RHO-ea34b8, about N^{1/3} online after
      about N^{2/3} precomputation. Both files were opened 2026-10-07.
    time_exponent: >-
      Unchanged at N^{1/2}. A degree ratio is not an exponent.
    memory_exponent: >-
      Unchanged. Rho uses polynomial memory. The toy table of size N is
      the measurement instrument, not an algorithm.
    hidden_cofactor: >-
      No o(1) term is introduced. The degree is reported as an integer.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For a random bijection from Z/N to labels in F_p^2, the minimal
        total degree of a bivariate polynomial agreeing with the label's
        preimage on a subset S of size at least 2 N^{1/2} equals the
        generic interpolation degree of an arbitrary function on S, up
        to a factor of 2, for N in (2^{10}, 2^{12}).
      random_model_justification: >-
        The space of total-degree-d bivariate polynomials has dimension
        (d+1)(d+2)/2. Below the d where that dimension exceeds |S|, a
        polynomial cannot interpolate an arbitrary function. HEUR-1 says
        a random labelling meets that dimension threshold. It is checked
        at the toy sizes, not assumed at cryptographic size.
      supporting_results:
        - >-
          Dimension count (d+1)(d+2)/2, stated in
          IDEA-20261006-4c39d3 heuristic H1. No external theorem is
          added beyond that count.
      validation_experiment_ids:
        - EXP-ECDLP-58aaaa
      falsification_condition: >-
        Either random bijection has minimal degree less than half the
        smallest d with (d+1)(d+2)/2 >= |S|, or the two random degrees
        differ by more than a factor of 2.
  structural_ingredients:
    - description: >-
        Dimension of the space of total-degree-d polynomials in two
        variables, (d+1)(d+2)/2.
      citation: IDEA-20261006-4c39d3 heuristic H1
      provenance: internal
      verified_by: ledger/proposals/IDEA-20261006-4c39d3.yaml
      role: threshold the random-label degree is compared with
    - description: >-
        Generic-group lower bound of Omega(N^{1/2}) group operations.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent this degree test does not move
  predictions:
    - metric: >-
        Ratio of the minimal total degree of a bivariate polynomial
        agreeing with the discrete log on S, ordinary curve, to the
        minimum of the same degree on two random bijections of the
        same order.
      direction: higher
      minimum_effect: '>= 1/2'
    - metric: >-
        The same degree ratio on the anomalous calibration curve.
      direction: lower
      minimum_effect: '< 1/2'
  test_boundary:
    instances:
      - two ordinary prime-order short-Weierstrass curves
      - one anomalous curve of similar size
      - two random bijections Z/N to labels in F_p^2
    parameters:
      N: in (2^{10}, 2^{12})
      subset: >-
        S subset of {Q : integer x(Q) < p^{2/3}}, size
        min(|D_x|, ceil(2 N^{1/2})), negation-quotiented
      excluded_curve: y^2 = x^3 + x + 1
    implementation: >-
      Missing. No committed program reports the minimal total degree
      of a bivariate polynomial agreeing with the discrete log on S,
      the same degree for two random bijections, and the same degree
      on one anomalous curve.
    budget:
      enforcement: advisory
      maximum_memory_gb: 4
      maximum_runs: 1
  falsification_conditions:
    - >-
      The ordinary degree ratio is strictly below 1/2 on both ordinary
      curves in the ladder, with the instrument checks passed.
    - >-
      The anomalous calibration ratio is not strictly below 1/2. The
      instrument is then blind, and the ordinary ratio is not evidence.
    - >-
      The two random bijections differ by more than a factor of 2 in
      minimal degree. The baseline is then unstable and the comparison
      is void.
  interpretation_limits:
    - >-
      No ECDLP exponent improvement is claimed. A ratio of 1/2 would be
      the negation ambiguity already in KR-RHO-fb88e6, a constant on
      the iteration count.
    - >-
      A ratio below 1/2 would falsify this statement on this toy subset
      and would not yet be an algorithm of cost N^{1/3}.
    - >-
      The grammar is bivariate polynomials. A cheap inversion outside
      that grammar is not constrained.
  rerandomization: >-
    No re-randomizing walk is part of this hypothesis. The comparison
    is an exact degree on a tabulated group.
  status_note: >-
    Specified, not approved. EXP-ECDLP-58aaaa is review_required
    because check_approval_capacity rejects an approval on
    GOAL-ECDLP-001 and because the degree driver is missing.
