hypothesis:
  id: H-ECDLP-d76995
  question_id: RQ-ICEX-001

  statement: >-
    SCOPE: the ICEX lane s charged index-calculus versus Pollard rho comparison
    at the toy fixtures the lane already runs. CLAIM TIER toy. NO ATTACK, NO
    EXPONENT, NO STATUS CHANGE TO ANY RECORD.
    The lane s headline comparison is a ratio of two costs. If the two sides are
    measured on separately generated instance sets, instance-to-instance
    difficulty variation enters the ratio as variance and, if generation differs
    between sides, as bias. The claim under test is that instance-to-instance
    variation is a SUBSTANTIAL share of the total variance at these sizes -
    formally, that the per-instance log-cost correlation rho between the two
    methods on the same instance exceeds 0.3, so that pairing reduces the
    variance of the log ratio by the factor 1 minus rho and materially narrows
    the lane s interval at no extra compute.
    The complementary outcome - instances are nearly interchangeable at toy scale
    and pairing buys almost nothing - is equally reportable and would tell the
    lane it may stop paying for a design constraint that does not help.
    THE RECORD IS A DESIGN CONTROL. It produces no comparison result; it
    establishes whether the lane s comparison design is worth what it costs, and
    it supplies a planted-effect instrument that can price the design s
    sensitivity.

  mechanism: >-
    Freeze one instance set with certificates, require every method to run on
    exactly those instances, and report PAIRED per-instance log ratios rather
    than a ratio of per-side means, with the pairing enforced by the harness
    rather than by convention. Estimate rho as the Pearson correlation of the two
    methods log charged work across the frozen set, with a bootstrap interval,
    and compare the paired and unpaired interval widths measured on the SAME
    data.
    WHY A PLANTED EFFECT IS REQUIRED AND NOT OPTIONAL. Reporting that pairing
    narrows an interval says nothing about whether the narrowed interval can
    detect anything. The design therefore injects a KNOWN multiplicative cost
    inflation d into one arm at swept magnitudes and requires the paired
    estimator to recover d within its interval at every magnitude, and the
    detection rate to rise monotonically with d. That converts "the design is
    tighter" into "the design detects an effect of size d with probability q",
    which is the only form in which a design control is usable by the lane.
    WHY A CURVE-FREE ARM IS MANDATORY AND WHY ITS LIKELY OUTCOME IS WRITTEN DOWN
    IN ADVANCE. Paired experimental design is a general statistical fact, and a
    pair of synthetic cost oracles with a shared instance effect will reproduce
    the entire variance-reduction signature with no elliptic curve anywhere in
    them. The record expects that, states it before the run, and pre-commits the
    consequence, so that a result about experimental design cannot afterwards be
    presented as a result about elliptic curves.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Null deliberately. No algorithm, no complexity claim, no exponent. Cost is
    the lane s existing runs reorganised onto one instance set, plus a synthetic
    planted-effect arm.

  rerandomization: null

  proof_search_map:
    not_applicable_reason: >-
      An experimental-design control, not a proof-oriented proposal. No theorem,
      reduction, certificate family or asymptotic is asserted. Recorded as
      non-applicable rather than omitted, per docs/inventor-protocol.md section
      8. The one proof-adjacent element - that for equal-variance paired
      measurements the variance of the difference is 2 sigma squared times
      (1 minus rho) - is an exact identity, stated in the contract, checkable by
      hand, and used only to interpret the measured rho.

  assumptions:
    - >-
      Both methods can run to completion on the same instances. If index calculus
      requires a differently generated instance, the comparison is NOT paired and
      that must be reported as an unpaired comparison with its variance penalty
      stated, never worked around by substituting a nearby instance.
    - >-
      The frozen set is large enough that the paired interval is informative. The
      contract fixes the size in advance and reports the achieved interval width
      whether or not it is useful.
    - >-
      Instances on which either method fails are REPORTED, never dropped.
      Dropping them compares the methods on the subset the weaker one could
      handle, which flatters it - this is the design s dominant bias and it is
      named rather than managed silently.

  heuristic_assumptions:
    - id: HEUR-PAIR-1
      formal_statement: >-
        Instance-to-instance difficulty variation is a substantial share of the
        total variance in the lane s cost comparison at the tested sizes, so that
        the per-instance log-cost correlation rho between the two methods exceeds
        0.3 and the paired design reduces the variance of the log ratio by the
        factor 1 minus rho.
      random_model_justification: >-
        The rigorous ingredient is exact - for paired measurements of equal
        variance the variance of the difference excludes the shared instance
        effect entirely, giving var(log ratio) equal to 2 sigma squared times
        (1 minus rho). No distribution is imitated. THE GAP - the SIZE of the
        instance effect for the ECDLP at toy scale is unmeasured in this program,
        and if instances are nearly interchangeable then rho is near 0 and the
        pairing buys nothing. That is precisely what the unpaired reproduction
        arm measures directly rather than assuming.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-b473c0]
      falsification_condition: >-
        Paired and unpaired designs giving interval half-widths whose ratio is
        within 10 percent of 1 on the same data, which means rho is
        indistinguishable from 0 at the tested sizes.

  structural_ingredients:
    - description: >-
        The ICEX lane s decision target - a committed Coordinator decision on
        whether the charged toy index-calculus exponent excludes one half within
        its declared scope - and its constraint that full charging covers
        preprocessing, relations, linear algebra, descent, memory and
        multitarget.
      citation: ledger/questions/RQ-ICEX-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-ICEX-001.yaml in full (27 lines).
      role: the comparison whose design this record constrains
    - description: >-
        The mandatory matched rho and BSGS control requirement.
      citation: ledger/questions/RQ-SDEG-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-SDEG-001.yaml in full (25 lines). READING FLAGGED -
        IDEA-20260815-95fefb attributes the matched-controls requirement to the
        ICEX lane. The verbatim string "Matched rho/BSGS controls and
        certificates are mandatory" appears in RQ-SDEG-001 s constraints, not in
        RQ-ICEX-001, whose constraints instead read "Full charging (preprocess,
        relations, LA, descent, memory, multitarget)" and "Independent
        review-xhigh required before any advantage language". Both questions bind
        the comparison; the attribution is corrected here rather than inherited.
      role: the control obligation the frozen instance set must satisfy
    - description: >-
        Exact variance identity for paired equal-variance measurements.
      citation: >-
        Elementary statistics, reproduced in full in the contract so a reviewer
        can check it without a source. NO TEXT WAS OPENED for this record.
      provenance: recalled
      verified_by: null
      role: converts the measured rho into a predicted variance reduction

  predictions:
    - metric: >-
        P1 - SAME-METHOD-TWICE NULL - one method run twice on the frozen set
        under different seeds, paired ratio per instance
      direction: different
      minimum_effect: >-
        Median paired log ratio FORCED to 0 within its bootstrap interval, AND
        the per-instance spread strictly greater than 0. A spread of exactly 0
        means the second run is a deterministic replay rather than an independent
        measurement, the null has width zero, and it can never detect a pairing
        failure - the run STOPS and reports a degenerate null.
    - metric: >-
        P2 - PLANTED EFFECT, SWEPT - a known multiplicative cost inflation d
        injected into one arm, d swept over {1.00, 1.05, 1.10, 1.25, 1.50, 2.00},
        at least 200 replications per level
      direction: higher
      minimum_effect: >-
        The paired estimator must recover d within its interval at EVERY level,
        the detection rate must be monotone non-decreasing in d, and the rate at
        d = 1.00 must equal the declared alpha within Monte Carlo error. An
        estimator that recovers only the largest planted effect has no
        demonstrated dynamic range and cannot price the design.
    - metric: >-
        P3 - measured per-instance log-cost correlation rho between the two
        methods on the frozen set, with bootstrap interval (dimensionless)
      direction: higher
      minimum_effect: >-
        PAIRING MATERIAL is declared if the lower bound of the interval exceeds
        0.3. PAIRING IMMATERIAL is declared if the upper bound is below 0.1. The
        band between is pre-declared INCONCLUSIVE.
    - metric: >-
        P4 - ratio of paired to unpaired interval half-width for the same
        quantity computed on the same data (dimensionless)
      direction: lower
      minimum_effect: >-
        Predicted to equal the square root of (1 minus rho) within the bootstrap
        interval. A measured ratio inconsistent with the measured rho means the
        estimator is not implementing the paired design it claims, which is an
        instrument failure and not a finding about instances.
    - metric: >-
        P5 - count and identity of instances on which either method failed, and
        the paired estimate recomputed with and without them
      direction: different
      minimum_effect: >-
        Reported explicitly. If the failures cluster on one side, the paired
        estimate over the survivors is BIASED and must be reported with the
        failures rather than over the survivors.
    - metric: >-
        P6 - CURVE-FREE ARM - the identical pairing analysis run on two synthetic
        cost oracles with a shared instance effect of the measured size and no
        elliptic curve anywhere
      direction: different
      minimum_effect: >-
        EXPECTED TO REPRODUCE THE SIGNATURE, and the consequence is pre-declared
        for exactly that reason. If the curve-free oracles reproduce the
        variance-reduction and the recovered planted effects within their
        intervals, the result of this experiment is a statement about paired
        experimental design and NOTHING from it may be quoted as a statement
        about elliptic curves or the ECDLP. The measured rho remains a fact about
        this lane s instances; the design benefit does not.

  test_boundary:
    instances: >-
      One frozen set of at least 30 certificate-carrying toy ECDLP instances from
      the ICEX lane s admitted fixture range; a synthetic curve-free oracle pair
      matched to the measured instance effect; a planted-effect arm.
    parameters:
      frozen_set_size: 30
      planted_effect_levels: [1.00, 1.05, 1.10, 1.25, 1.50, 2.00]
      replications_per_level: 200
      alpha: 0.05
      certificate_requirement: every instance in the frozen set carries a verified certificate
    implementation: >-
      Harness-enforced instance pairing over the lane s existing index-calculus
      and Pollard rho drivers, plus a synthetic cost-oracle arm and a
      planted-effect injector that is charged in full and cannot access the
      target scalar.
    budget:
      wall_clock_seconds_per_run: 1800
      maximum_memory_gb: 8
      maximum_runs: 300

  falsification_conditions:
    - >-
      F1 - the same-method-twice null has spread exactly 0. Degenerate null; the
      run stops and reports it rather than treating a deterministic replay as a
      pairing check.
    - >-
      F2 - the same-method-twice null s median paired ratio differs from 1 beyond
      its interval. The pairing is not real and the design does not work.
    - >-
      F3 - the planted-effect sweep is not monotone, or the estimator fails to
      recover d at any level, or the d = 1.00 detection rate exceeds alpha
      materially. The estimator is anti-conservative or blind; no negative from
      it is admissible.
    - >-
      F4 - index calculus cannot run on the same instances. The comparison cannot
      be paired; report it as unpaired with its variance penalty stated.
    - >-
      F5 - failures cluster on one side. The paired ratio over survivors is
      biased and must be reported with the failures.
    - >-
      F6 - rho is indistinguishable from 0. Pairing buys the lane nothing at
      these sizes, which is a clean, useful and cheap result.
    - >-
      F7 - the curve-free oracle arm reproduces the signature. Scope collapses to
      experimental design and no elliptic-curve statement may be made.

  interpretation_limits:
    - >-
      CLAIM TIER toy. An experimental-design requirement. PRODUCES NO COMPARISON
      RESULT and no exponent.
    - >-
      Pairing removes instance VARIANCE, not generation BIAS. If the frozen set
      is generated in a way that favours one method, pairing tightens a biased
      estimate, and this record measures the former and cannot detect the latter.
    - >-
      Scoped to methods that can run on identical instances. Where they cannot,
      the honest report is an unpaired comparison with its penalty stated.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY. The lane s actual question
      - whether a charged index-calculus exponent excludes one half - is not
      settled by this record and cannot be settled at reachable toy sizes; the
      measured rho at toy scale carries no guarantee at any larger size, and no
      transfer is claimed.
    - >-
      Changes no status. Any consequence for the lane s comparison design is a
      Coordinator decision made elsewhere on committed evidence.

  status: proposed
  proposed_by: coordinator

