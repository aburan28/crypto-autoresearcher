hypothesis:
  id: H-ICEX-a321e1
  question_id: RQ-ECDLP-002
  statement: >-
    The ECDLP mechanism screens this program has run have unmeasured error rates.
    For the five most-cited screens with recoverable, runnable implementations,
    each screen detects a planted positive built from its OWN stated target
    structure with sensitivity at or above 0.80 at the sample size it originally
    used, and holds a false-positive rate on matched nulls at or below its
    nominal level plus three standard errors. Where a screen fails either bound,
    the negatives it produced are under-powered and their honest status is
    unverified.
  mechanism: >-
    A screen is a measuring instrument that projects an instance to a verdict. An
    instrument with unmeasured sensitivity can return a negative because nothing
    is there or because it could not see; an instrument with an inflated
    false-positive rate can return a positive from noise. Replaying each screen
    against planted positives and matched nulls, at the sample size it actually
    used, converts a pile of verdicts into verdicts with known power.
  assumptions:
  - >-
    Screen implementations are recoverable and runnable. Where they are not, the
    screen is listed as UNMEASURABLE rather than assumed adequate, and the count
    of unmeasurable screens bounds what the audit can conclude.
  - >-
    A planted positive can be constructed from the screen's OWN stated target
    structure. Planting a structure slightly different from what the screen
    targets manufactures a false insensitivity result and would unfairly
    discredit a sound screen; the plant construction is therefore derived from
    the screen's own contract text and that derivation is an artifact.
  - >-
    Screens were run at whatever sample size the campaign afforded, so a low
    power finding may reflect budget rather than design. The report separates the
    two by giving, per screen, both the power at its ORIGINAL sample size and the
    sample size that would reach 0.80 power at the same effect.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      Instrument metrology over this program's own screens. Standard power
      analysis, applied retrospectively; no theorem is sought and no mathematical
      claim about the ECDLP follows.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR EACH audited screen, a planted positive constructed from that screen's
      own stated target structure is detected with empirical sensitivity at or
      above 0.80 at the sample size the screen originally used.
    random_model_justification: >-
      The rigorous ingredient is standard power analysis for a test statistic
      whose null distribution is known analytically. THE GAP, STATED - for most
      of these screens the null distribution is EMPIRICAL rather than analytic,
      so power must itself be estimated by simulation and inherits that
      simulation's Monte Carlo error, which at 400 replicates is about 0.025 on a
      proportion near 0.5.
    supporting_results:
    - >-
      Standard power analysis for a one-sample test with known null distribution,
      used only on the analytic calibration control.
    validation_experiment_ids:
    - EXP-ICEX-0098c0
    falsification_condition: >-
      A screen failing to detect its own planted target structure at its original
      sample size with sensitivity at or above 0.80, with a binomial interval
      excluding 0.80.
  structural_ingredients:
  - description: >-
      KN-OPEN-019, read verbatim on the stakes - this program has repeatedly
      concluded that the classical ECDLP space is saturated, and every one of
      those conclusions is currently a statement about the search, not about the
      problem. That is exactly the claim this audit converts into a measured
      quantity or leaves standing as unverified.
    citation: KN-OPEN-019
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, statement and why-it-matters sections read verbatim)
    role: the standing conclusion whose evidentiary basis is audited
  reduction_chain: null
  predictions:
  - metric: analytic_power_ladder_reproduction
    direction: different
    minimum_effect: >-
      A trivial detector with analytically computable power - a one-sample test
      on a known-variance Gaussian mean - is planted at effect sizes chosen to
      give nominal power 0.10, 0.50 and 0.90. FORCED - the harness must reproduce
      each within 0.05, which at 400 replicates is about two Monte Carlo standard
      errors. This is the defect of known size, at three predicted magnitudes,
      and it is the demonstrated dynamic range of the whole audit.
  - metric: per_screen_sensitivity_to_planted_positives
    direction: different
    minimum_effect: >-
      No value pre-committed per screen beyond the 0.80 bound in HEUR-001.
      Screens that fail to detect their own planted structure are the headline
      result.
  - metric: per_screen_false_positive_rate_on_matched_nulls
    direction: different
    minimum_effect: >-
      Compared against the screen's own nominal level. At 400 matched nulls and a
      nominal 0.05, the standard error is about 0.011, so a rate above 0.083 is
      three standard errors above nominal and is called materially elevated.
  - metric: minimum_detectable_effect_size_at_the_original_sample_size
    direction: different
    minimum_effect: >-
      Reported per screen in the screen's own statistic units, beside the effect
      size the screen's contract said it was looking for.
  - metric: counts_of_unmeasurable_and_untestable_screens
    direction: different
    minimum_effect: >-
      Reported explicitly. A large count bounds what the audit can conclude and
      is itself a reportable fact about the corpus.
  test_boundary:
    instances:
    - the five most-cited ECDLP mechanism screens with recoverable implementations
    - at least 400 planted positives and 400 matched nulls per screen
    parameters:
      screen_selection_rule: frozen before any screen is run
      original_sample_size_per_screen: read from that screen's own committed contract
      analytic_calibration_powers: [0.10, 0.50, 0.90]
    implementation: >-
      The screens' own committed implementations, re-run unmodified, with the
      instance generator replaced by the plant and null generators.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 60
  falsification_conditions:
  - >-
    The harness misreports the analytic power ladder at any of the three points.
    Harness bug; no screen number from the run is admissible.
  - >-
    Most candidate screens are unmeasurable. The audit cannot conclude at corpus
    level and must say so rather than generalising from the survivors.
  - >-
    A screen fails to detect its own planted positive at its original sample
    size. The negatives it produced are uninformative at that sample size and
    their honest status is unverified. THIS CONTRACT DOES NOT PERFORM THE
    RELABELLING; that is a Coordinator decision on this evidence.
  - >-
    A screen's false-positive rate is materially above nominal. Past positives
    from that screen may have been noise and past negatives were computed against
    a mis-stated level.
  - >-
    Every screen detects its plants and holds its nominal level. The corpus's
    negatives are better founded than the saturation worry suggests, which is a
    reassuring and useful outcome and is reported as such.
  interpretation_limits:
  - >-
    Measures instruments, not the ECDLP. No mathematical claim about elliptic
    curves or discrete logarithms follows from any outcome.
  - >-
    Scoped to five screens with recoverable implementations. A corpus-wide
    false-positive rate is NOT ESTABLISHED by five screens and is UNTESTABLE AT
    REACHABLE SCALE within this contract's budget; the contract says so rather
    than presenting a five-screen result as a corpus statement.
  - >-
    A low-power finding re-labels past negatives as unverified. It does not make
    them positive, and it is not evidence that the screened mechanism works.
  - >-
    Per screen, where the screened signature could be produced by a curve-free or
    non-curve object of the same shape, a curve-free arm is run and its outcome
    is pre-stated to control the reading - if the curve-free object triggers the
    screen, that screen's past positives are not statements about elliptic curves
    and may not be quoted as such.
  status: proposed
  proposed_by: coordinator
