hypothesis:
  id: H-SSIQ-dad689
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea_ids:
    - IDEA-20260807-d53a93

  statement: >-
    SCOPE: the toy table L(E,X,B) built once per field size under this
    goal's toy-scale infrastructure (shared with C2-5, C2-10, C2-12, Q2-5,
    Q2-10), at log2 p <= 40, with the coverage ratio rho = M/(p/12) computed
    from the same build. CLAIM TIER toy for every measured quantity. NO
    ALGORITHM IS PROPOSED AND NO EXPONENT IS CLAIMED.

    THE HYPOTHESIS HAS TWO HALVES.

    (H-A1, DERIVABLE, ZERO COMPUTE) With X = B^{1/2}(p/2)^{1/6} and
    M ~ Psi(X,B)*X, rho ~ B*p^{-2/3+o(1)}: rho is not a free knob, it is
    pinned by p and B and decays like p^{-2/3}. At crypto NIST-I scale
    rho = 2^{93.28-252.42} = 2^{-159.14}; at reachable toy scales rho is
    between 2^{-5.4} (p = 2^20, B = 30, M ~ 2^{11.0}) and 2^{-18.0}
    (p = 2^40, B = 100, M ~ 2^{18.4}) -- a gap of 141-154 octaves that no
    reachable p closes (driving rho to 2^{-159} needs p >= B^{3/2}*2^{238.7}).
    Expected ordinary collisions in the table are M^2/(2*p/12): ~2^{4.6} ~=
    24 at p = 2^20 and 2^{-66.9} at NIST-I. FORCED VALUES, computed before
    any run.

    (H-A2, MEASURABLE, TOY TIER) A subsampling instrument built on the
    shared toy table CLASSIFIES each named statistic into rho-stable
    (fitted slope of the statistic against log(rho') indistinguishable from
    0 within 2 sigma across three field sizes, for the tested range only)
    or rho-unstable (any other outcome). Predicted rho-unstable: C2-10's
    collision profile, C2-10's locus-occupancy, C2-5's survival probability
    whenever fR ~= 1. Predicted rho-stable: neighbour auto-correlation,
    sigma-orbit distribution, Q2-10's alignment exponent e, Q2-5's
    rho_LSH. THIS HALF IS A CLASSIFICATION WITH A MEASUREMENT BEHIND EACH
    ROW, NOT A SINGLE PASS/FAIL VERDICT: every row's outcome, whichever way
    it falls, is a full deliverable of the hypothesis. A rho-unstable
    verdict on any predicted-rho-stable statistic, or vice versa, is not a
    failure of the hypothesis -- it is a corrected prediction, reported with
    the measurement that corrected it.

  mechanism: >-
    STEP 1 -- THE PINNING IDENTITY. rho = M/(p/12) with M ~ Psi(X,B)*X and
    X = B^{1/2}(p/2)^{1/6} (the frozen source's own Algorithm 2 parameters,
    shared with this goal's exponent_budget factor F3). Substituting gives
    rho ~ B*p^{-2/3+o(1)}, so rho is a deterministic function of (p, B), not
    an independent parameter of the toy build.

    STEP 2 -- THE OCTAVE GAP. Evaluating the identity at the reachable toy
    range (log2 p in [20, 40]) and at NIST-I gives the two endpoints quoted
    in H-A1; the gap in log2(rho) is 141-154 octaves, forced arithmetic on
    the identity in STEP 1.

    STEP 3 -- THE SUBSAMPLING INSTRUMENT. Build the shared toy table once
    per field size; for rho' in {rho, rho/4, rho/16, ..., rho/2^10}, draw a
    uniform random subsample of the corresponding size (200 bootstrap
    resamples per level) and compute each candidate statistic on it. Fit
    each statistic's value against log(rho') by ordinary least squares; a
    fitted slope with |slope| <= 0.1 per octave and a 2-sigma confidence
    interval containing 0, reproduced at all three field sizes, is the
    rho-stable verdict.

    STEP 4 -- THE CHARGE (what the subsample is NOT). A subsample of size m
    from a table built at radius X is NOT the same object as a freshly
    built table L(E,X',B) at a smaller radius X' chosen so that its
    cardinality equals m: the subsample retains the full degree profile of
    the X-radius build with fewer entries, while the smaller table has a
    different (smaller) degree profile at full density. Both objects are
    built and their statistic values compared; a mismatch localizes whether
    a candidate statistic's rho-dependence is a density effect (visible in
    the subsample) or a radius effect (visible only in the resized build).

    STEP 5 -- KNOWN-ANSWER GATES. (i) The expected number of ordinary
    collisions in a subsample of size m must follow the exact
    hypergeometric/binomial prediction m(m-1)/(2*p/12) to within its
    interval at every level; an instrument that misses the one quantity
    whose law is known in closed form has no power over the ones whose law
    is not. (ii) At rho' = rho (no subsampling), every statistic must
    reproduce its committed full-table value bit-for-bit.

  assumptions:
    - >-
      That the shared toy table build (the same harness used by C2-5,
      C2-10, C2-12) is available and produces a table whose entries can be
      uniformly subsampled without introducing a construction-order bias;
      this is checked by the known-answer gate (STEP 5(ii)), not assumed.
    - >-
      That a statistic's dependence on rho over the tested range (three
      orders of magnitude in rho', three field sizes) is representative of
      its dependence over the full 141-154 octave gap to crypto scale. THIS
      IS NOT CLAIMED: the rho-stable verdict is explicitly scoped "for the
      tested range only" and no extrapolation beyond it is licensed by this
      hypothesis.
    - >-
      That the subsample and the resized-radius build are the only two
      confounded explanations for an observed rho-dependence; a statistic
      failing the charge check in STEP 4 is reported as confounded rather
      than assigned to either explanation without further work.

  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is purely empirical (an instrument-validity study,
      not a proof-oriented claim about the archived algorithm's exponent);
      the identity in H-A1 is a two-line algebraic substitution already
      shown in full in the mechanism field, not a proof requiring the
      structured proof_search_map apparatus.

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. This entry is a validity-control instrument for toy-
    scale statistics used elsewhere in the campaign's lever map. It measures
    a coverage ratio and classifies statistics by their sensitivity to it;
    it does not touch, move, or bound any of the exponent_budget factors
    F1-F4 or any lever L1-L5/N5/A1-A7 directly, and no exponent of any kind
    is claimed, attained, or implied to be attainable.

  heuristic_assumptions:
    - id: HEUR-SSIQ-Q28-1
      formal_statement: >-
        FOR the statistics named rho-stable in H-A2's prediction, FOR ALL
        rho' in the tested range [rho/2^10, rho] at three field sizes
        (log2 p in {20, 30, 40} or the nearest reachable triple), the
        statistic's expected value under uniform subsampling is independent
        of rho' up to a slope bounded by 0.1 per octave.
      random_model_justification: >-
        Neighbour auto-correlation, sigma-orbit distribution, and the
        alignment/LSH statistics named are functions of the table's
        structural (non-collision) content, which subsampling at fixed
        radius preserves in distribution by construction if the underlying
        statistic is a property of individual entries or of pairs at fixed
        structural distance, rather than a property of the collision
        density itself.
      supporting_results:
        - >-
          The forced hypergeometric collision law used as the known-answer
          gate (STEP 5(i)), which is a rigorous distributional fact about
          uniform subsampling and calibrates the instrument's power to
          detect a true rho-dependence.
      validation_experiment_ids: [EXP-SSIQ-e6dc7d]
      falsification_condition: >-
        Any predicted-rho-stable statistic returns |slope| > 0.1 per octave
        with a 2-sigma CI excluding 0 at any of the three field sizes.
    - id: HEUR-SSIQ-Q28-2
      formal_statement: >-
        FOR the statistics named rho-unstable in H-A2's prediction (C2-10's
        collision profile, C2-10's locus-occupancy, C2-5's survival
        probability whenever fR ~= 1), the fitted slope against log(rho')
        is bounded away from 0 by more than 0.1 per octave with a 2-sigma
        CI excluding 0.
      random_model_justification: >-
        These are collision-flavoured statistics by direct construction
        (functions of the occupancy histogram or of near-saturated survival
        events), and rho directly parameterises the expected collision
        count via the hypergeometric law in STEP 5(i), so their dependence
        on rho' is expected to be first-order rather than an artefact.
      supporting_results:
        - >-
          The expected-ordinary-collisions closed form M^2/(2*p/12), which
          is exact and gives the forced magnitude (~24 at p = 2^20) that a
          working instrument must reproduce at rho' = rho.
      validation_experiment_ids: [EXP-SSIQ-e6dc7d]
      falsification_condition: >-
        Any predicted-rho-unstable statistic returns a slope indistinguishable
        from 0 (within 2 sigma) at all three field sizes with the known-
        answer gate passing.

  structural_ingredients:
    - description: >-
        The occupancy histogram (n_k)_{k>=0} of the codomain key space of
        L(E,X,B) and its summary statistic, the coverage ratio
        rho = M/(p/12).
      citation: >-
        DERIVED IN ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/Q2.md,
        section "Q2-8", from the frozen source's own X = B^{1/2}(p/2)^{1/6}
        (Algorithm 2 step 1) and Psi(X,B)*X list-cardinality bound (Lemma
        3.2), both already cited by this goal's exponent_budget factors F2
        and F3.
      role: >-
        supplies the pinning identity rho ~ B*p^{-2/3+o(1)} that makes the
        gap-size and the collision-count forced values in H-A1.

  reduction_chain:
    core_problem: >-
      N/A -- this hypothesis is a validity-control instrument on toy-scale
      measurements, not a statement about OneEnd, EndRing, or the
      supersingular isogeny problem directly.
    corollaries: []

  predictions:
    - metric: "P1 -- rho at NIST-I, computed symbolically from the pinning identity"
      direction: different
      minimum_effect: >-
        EXACTLY 2^{-159.14}. Forced before any run; any other value stops
        the line at Stage 0.
    - metric: "P2 -- octave gap between reachable toy rho and crypto rho"
      direction: different
      minimum_effect: >-
        141-154 octaves across the stated toy range. Forced arithmetic.
    - metric: "P3 -- expected ordinary collisions at p = 2^20"
      direction: different
      minimum_effect: >-
        EXACTLY 2^{4.6} ~= 24, matching M^2/(2*p/12) with the stated M.
    - metric: >-
        P4 -- classification of each of the eight named statistics into
        rho-stable / rho-unstable, with fitted slope and its 2-sigma CI, at
        three field sizes
      direction: different
      minimum_effect: >-
        Per HEUR-SSIQ-Q28-1/2's pre-registered predicted classification.
        EITHER direction of a given row's outcome is a full result; the
        deliverable is the completed table with a measurement behind every
        row, not a specific split.
    - metric: >-
        P5 -- hypergeometric known-answer gate: expected ordinary
        collisions in a subsample of size m versus m(m-1)/(2*p/12)
      direction: different
      minimum_effect: >-
        Agreement within the closed-form interval at every subsample level;
        failure here voids every other reading in the batch.

  test_boundary:
    instances:
      - >-
        The shared toy table build already used by C2-5/C2-10/C2-12/Q2-5/
        Q2-10, at log2 p <= 40, three field sizes.
      - >-
        Out of scope: any statistic not on the closed pre-registered list
        of eight (C2-10 collision profile, C2-10 locus-occupancy, C2-5
        survival probability, neighbour auto-correlation, sigma-orbit
        distribution, Q2-10 alignment exponent e, Q2-5 rho_LSH, and the
        matched null); any prime above the toy range; any claim about
        crypto-scale rho.
    parameters:
      field_sizes_log2_p: [20, 30, 40]
      B_grid: [30, 60, 100]
      rho_prime_levels: [rho, rho/4, rho/16, rho/64, rho/256, rho/1024]
      bootstrap_resamples_per_level: 200
      claim_tier: toy
    implementation: >-
      Pure Python plus numpy, reusing the shared toy-table harness this
      campaign has already built for the C2 slice. No new dependency.
    budget: {}

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE) -- the pinning identity does not return 2^{-159.14}
      at NIST-I or the 141-154 octave gap at the stated toy range. The
      identity is wrong and the line stops before any build.
    - >-
      F2 -- the hypergeometric known-answer gate fails at any subsample
      level. The instrument is broken and no classification of any
      statistic may be reported.
    - >-
      F3 -- the full-table reproduction check at rho' = rho fails to match
      the committed full-table value bit-for-bit for any statistic. That
      statistic's row is reported invalid_measurement, not classified.
    - >-
      F4 -- ALL statistics are found rho-stable with slope within 2 sigma
      of 0 at all three field sizes, with the hypergeometric gate passing.
      This is a VALID, FULLY INFORMATIVE outcome (per the catalogue's own
      falsifier text): the concern is void, toy results in this slice
      transfer in this respect, and the campaign gains a validity control
      it did not have. It is not treated as a null result.
    - >-
      F5 -- any statistic shows |slope| > 0.1 per octave. That statistic is
      declared non-extrapolable and its committed toy value may not be
      cited at crypto scale by any sibling record, including values already
      recorded before this hypothesis ran.

  interpretation_limits:
    - >-
      CLAIM TIER TOY THROUGHOUT. No exponent is claimed, moved, or implied.
      This hypothesis validates instruments; it does not itself supply a
      lever on F1-F4.
    - >-
      A rho-unstable verdict on any statistic is not a failure of this
      hypothesis or of the sibling entry that uses that statistic -- it is
      a scope correction that the sibling entry must carry forward.
    - >-
      Extrapolability is established only within the tested rho' range at
      the tested field sizes; the 141-154 octave gap to crypto scale is
      NOT closed by any outcome of this hypothesis.
    - >-
      THIS HYPOTHESIS'S H-A2 RESULT IS A PRECONDITION FOR CITING several
      not-yet-designed sibling toy entries (Q2-5, Q2-9, Q2-10, Q3-8, and by
      extension C2-5/C2-10/C2-12) at any scale beyond "unvetted toy". Per
      the catalogue's hard sequencing constraint, no sibling entry's toy
      value may be cited as extrapolable until this hypothesis's
      classification exists.

