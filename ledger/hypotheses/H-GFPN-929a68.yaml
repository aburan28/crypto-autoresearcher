  title: >-
    The schoolbook ratio is 33/14, which is 3/70 below 12/5.
  statement: >-
    The prime p equals 2 to the 64 minus 2 to the 32 plus 1, which is
    18446744069414584321, and 2 to the 64 minus (2 to the 32 minus 1)
    equals that same integer. The schoolbook product of the
    coefficient rows 1, 2, 3, 4, 5 and 6, 7, 8, 9, 10 uses 25
    multiplications and equals 6, 19, 40, 70, 110, 114, 106, 85, 50.
    Folding the degree-5 and higher terms by the rule z to the 5
    equals 3 gives 348, 337, 295, 220, 110. A 2-plus-3 split uses 6
    multiplications on the low third, 3 on the high pair, and 6 on
    the cross term, which is 15. With a squaring count of 15, five
    multiplications and one squaring cost 140 in the schoolbook count
    and 90 in the split count. Six times 55 is 330. The schoolbook
    ratio 330/140 is 33/14, which exceeds 2 by 5/14 and exceeds 3/2
    by 6/7, and which lies 3/70 below 12/5. The split ratio 330/90 is
    11/3, which lies 1/30 below 37/10. Fifteen percent of 140 is 21.
    Fifteen percent of 90 is 27/2, and 14 exceeds that by 1/2. The
    fifth power of 33/14 exceeds 2 to the 6, and the tenth power of
    11/3 lies strictly between 2 to the 18 and 2 to the 19. The batch
    shares 1/4, 1/8, 1/16, 1/32 and 1/64 sum to 31/64, and the batch
    sizes multiply to 1048576.
  mechanism: >-
    The proposal prices one affine step by word products. This
    contract checks the multiplication counts, the fold, and the
    ratios. It does not run a walk.
