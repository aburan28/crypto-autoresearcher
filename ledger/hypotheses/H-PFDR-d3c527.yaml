hypothesis:
  id: H-PFDR-d3c527
  question_id: RQ-ECDLP-160d89
  source_idea_id: IDEA-20260901-d77aa8
  batch_id: BATCH-c64bee
  title: >-
    The conditioned cross-collision row of a keyed LEAF join is the keyed
    ADDITIVE ENERGY of the fibre system, and its Fourier dual turns any
    concentration beyond uniform into a heavy Fourier coefficient of some fibre
    indicator along a discrete-logarithm character -- so coordinate-bucket keys
    sit at the Weil level and cannot concentrate at any s below 1, conditional on
    ONE recalled one-variable character-sum bound whose exact mixed form is the
    record blocking extraction and whose absence downgrades the conclusion to a
    heuristic rather than voiding it.
  statement: >-
    SETTING. G is generated by P and has prime order N. A KEYED LEAF JOIN uses
    public maps alpha and beta from G to a key set of size K, fixed before the
    lists and independent of the target, and emits every pair whose keys agree by
    hashing, in near-linear time plus output, so the enumeration exponent is 1 by
    construction. Population fibres are the preimages A_c and B_c. Write M for
    the number of matched population pairs and r_c(g) for the number of pairs in
    A_c x B_c summing to g.
    (E1) THE ENERGY IDENTITY, EXACT. The emitted-sum distribution is
    p(g) = (1/M) sum over c of r_c(g), and its collision probability is
    coll = sum over g of p(g)^2 = E_key / M^2, where E_key is the KEYED ADDITIVE
    ENERGY of the fibre system. The conditioned cross-collision row of
    H-JPR-3a00f0 -- collision probability Theta(N^{-2/3}) -- is therefore the
    statement E_key >= M^2 N^{-2/3}, and more generally the Renyi-2 support
    exponent s is defined by E_key = M^2 N^{-s}. NO ACCEPTED SET APPEARS: the
    soundness hypothesis used elsewhere in this lane is not needed to state the
    row and is never used here.
    (E2) THE FOURIER DUAL, EXACT. Since the sum over c of the convolutions of the
    fibre indicators has Fourier transform equal to the sum over c of the
    products of their transforms, Parseval gives
    coll = 1/N + (1/(N M^2)) times the sum over nonzero frequencies of the
    squared modulus of that product sum, with the transform taken along the
    characters of G, i.e. along the discrete logarithm. Bounding the inner sum by
    Cauchy-Schwarz and Parseval on one side gives, for balanced fibres of size
    N/K, coll <= 1/N + tau_max^2 K^3 / N^3 where tau_max is the largest modulus
    of a nonzero-frequency Fourier coefficient of any fibre indicator.
    Consequently ANY s below 1 FORCES tau_max >= N^{(3-s)/2} K^{-3/2}, which at
    K = N^{1/3} is N^{1 - s/2}.
    (E3) COORDINATE-BUCKET KEYS ARE THE PAIR COIN, CONDITIONALLY. If alpha
    buckets a bounded-degree coordinate -- an interval in x, a quadratic-character
    class, any set cut from the base field by an interval or a multiplicative
    condition and pulled back to G -- then, conditional on a one-variable mixed
    character-sum bound of Weil type, every fibre has tau_max of order
    N^{1/2} times a power of log N, so coll is 1/N times (1 + o(1)) at
    K = N^{1/3}: s = 1 - o(1). The coordinate-bucket keyed leaf join therefore
    emits UNIFORM sums, its level-2 cross-collision sits at the ambient rate, and
    it is exactly the independent pair coin with expected time N. This holds at
    EVERY s, closing the coordinate-bucket family on the whole enumeration-1 line
    rather than only at the corner.
    (E4) EVERY CONCENTRATING KEY IS A LEARNABLE COARSE-LOG PREDICTOR. A fibre
    indicator is an efficiently computable function of the point. By (E2) it has
    a Fourier coefficient of relative size at least N^{1/3 - s/2} at some
    frequency. A sparse Fourier learner recovers a heavy coefficient of the
    induced function of the exponent for both the generator and the target,
    giving the frequency and its product with the secret, hence the secret. So a
    concentrating key is never used best by the four-list route -- which is a
    statement about how such a key WOULD be used and is not a claim that one
    exists.
    (E5) THE THRESHOLD IS NON-DEGENERATE AT EVERY s BELOW 1, AND ITS POWER NEAR
    s = 1 IS STATED RATHER THAN ASSUMED. At s = 1 the required tau_max is exactly
    N^{1/2}, the Weil level, so the necessary condition is exactly non-binding at
    the null and strictly binding for every s below 1; the statistic therefore has
    the whole interval between the random level N^{1/3} and the fibre size
    N^{2/3} to move in, a factor N^{1/3} of dynamic range. But near s = 1 the gap
    between the required and available levels is only the logarithmic cofactor, so
    the argument CANNOT exclude s = 1 minus a term of order log log N over log N
    -- which is exactly the s = 1 - o(1) it claims and no more.
    (E6) NOT CLAIMED. No key with s below 1 is exhibited or predicted; the record
    predicts none exists among coordinate keys and says NOTHING about keys
    computed by other means. No ECDLP speedup, no implementation, no run.
  mechanism: >-
    THE TRACKED OBJECT is the fibre indicator of a key, viewed through its
    Fourier transform along the characters of G. The projection from a fibre -- a
    set of N/K points -- to its heaviest nontrivial Fourier coefficient discards
    everything except one correlation with one logarithm character, and retains
    exactly the quantity (E2) shows bounds concentration. The discard is
    compatible with addition because convolution is multiplication on the Fourier
    side, which is why the energy of a SUM of fibre pairs is controlled by
    single-fibre coefficients: no bilinear estimate is needed, only Parseval and
    one Cauchy-Schwarz.
    WHY THE LANE DID NOT HAVE THIS. The lane keys were placed on SUMS, which is
    post-hoc and costs quadratic enumeration, so the analytic record in this lane
    reached for BILINEAR sums over an acceptance matrix and predicted their
    nontriviality threshold exceeds N^{1/3}. A key that reaches enumeration
    exponent 1 is a key on LEAVES, and for leaf keys the concentration row is a
    statement about single-fibre transforms, for which ONE-VARIABLE bounds at the
    Weil level suffice. Moving the key from sums to leaves is what makes the row
    provable, and it is forced anyway by the certificate own enumeration
    condition.
    WHY THIS RECORD IS CURVE-FREE EXCEPT AT ONE POINT, AND WHY THAT MATTERS.
    (E1), (E2) and (E4) are statements about a finite abelian group, a partition
    of it, and Fourier analysis on it. They contain no curve. Both positive
    controls are curve-free by construction: a vector space over the field of two
    elements with a prefix key, whose fibres are cosets of a subgroup so the
    indicator is maximally biased and the exponent is exactly 2/3; and a cyclic
    group with a log-bucket key, whose fibres are intervals in the exponent. The
    ONLY curve-specific ingredient in the entire record is the Weil-level bound in
    (E3). The deliverable must therefore attribute the closure precisely: the
    identity and the dual are group-theoretic, and only the coordinate-bucket
    conclusion is a statement about elliptic curves -- and it is conditional.
  assumptions:
    - >-
      N is prime and the characters of G are indexed by the discrete logarithm.
    - >-
      Keys are fixed before the lists and independent of the target; fibres are
      population sets and sampled lists are uniform, so sampled emitted sums are
      samples from the population distribution.
    - >-
      Balanced fibres of size N/K in the displayed bound. The unbalanced case
      changes constants and not the exponent, and that is a stated proof
      obligation rather than an assumption.
    - >-
      Both sides use keys with the same fibre-size profile; the negated side
      needed for zero relations has the same transform up to conjugation.
    - >-
      No exact nontrivial quotient of G is assumed. (E2) is a bound, not a
      structure claim -- which matters because this question own constraints
      forbid assuming such a quotient.
    - >-
      [BLOCKING CLAIM BOUNDARY] RQ-ECDLP-160d89 declares its claim boundary as
      static theorem and certificate architecture only, with NO implementation,
      experiment, curve generation, run or ECDLP result authorized. Read verbatim
      by this coordinator. This hypothesis and its contract are therefore ZERO
      RUN by the question own boundary and not merely by choice, and the exact
      Fourier instrument the source idea sketches for a future session is
      explicitly NOT proposed here.
  proof_search_map:
    bottleneck: >-
      The concentration row has been a heuristic in this lane because it was
      posed for a key on SUMS. Posed for a key on LEAVES it is an energy, whose
      Fourier dual is a single-fibre statement. That re-posing is the
      decision-changing step.
    baseline_embedding:
      parameter_slice: >-
        Three slices, all curve-free. A vector space over the field of two
        elements with a prefix key, where fibres are cosets of a subgroup: the
        identity must return collision probability equal to the reciprocal of the
        complementary subgroup size, exponent exactly 2/3, and tau_max exactly
        equal to the fibre size, reproducing the known corner. A cyclic group with
        a top-bits-of-logarithm key, where fibres are exponent intervals:
        exponent exactly 2/3. And a uniformly random key: tau_max of order
        sqrt(N/K) times a log factor, exponent 1 - o(1).
      reproduction_check: >-
        Symbolic on all three, with the constants written out. If (E1) and (E2)
        do not return exponent exactly 2/3 on both positive controls, the
        identity is wrong and the record is void.
    observation_collision:
      observable: 'the Renyi-2 support exponent s of the emitted sums'
      distinct_preimage_search: >-
        REQUIRED. Two keys can share s = 1 - o(1) for different reasons: a
        coordinate-bucket key, whose bias sits at the Weil level N^{1/2}, and a
        random key, whose bias sits at the random level N^{1/3}. They are
        distinguished by tau_max, which differs by a factor N^{1/6} between them.
        Since NEITHER reaches the required N^{1 - s/2} for any s below 1, the
        collision is harmless for the conclusion, but it MUST be reported so that
        "Weil level" is never misread as "structure".
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the concentration row from a distributional statement about sums
          to the Fourier side, where it becomes an inequality between one number
          and one function of the exponent and the key count.
        predicted_gain: >-
          Converts the row from "no rigorous support presently known" to
          "rigorous modulo one one-variable character-sum bound", and closes every
          coordinate-bucket leaf key at all s below 1 at zero compute.
      - transform: stronger_invariant
        proposed_object: >-
          Track the full Fourier profile per fibre rather than the scalar
          exponent, since the profile is what survives the tree recursion --
          convolution multiplies transforms.
        predicted_gain: >-
          Level-by-level control of concentration with no new heuristic per
          level.
    quantifier_order: >-
      (E2): FOR ALL prime N, FOR ALL public keys with K classes and balanced
      fibres, IF the emitted-sum collision probability is N^{-s} THEN THERE
      EXISTS a fibre and a nonzero frequency with coefficient modulus at least
      N^{(3-s)/2} K^{-3/2}. (E3): FOR ALL coordinate-bucket keys of bounded
      degree, FOR ALL fibres and all nonzero frequencies, the coefficient modulus
      is of order N^{1/2} times a power of log N -- CONDITIONAL on the recalled
      bound -- hence s is at least 1 - o(1). No witness depends on the lists or on
      the target.
      NOT CLAIMED: (E3) for keys not cut from a bounded-degree coordinate by an
      interval or a multiplicative condition.
    method_ceiling:
      strongest_certifiable_claim: >-
        For keyed leaf joins: an exact identity, a NECESSARY condition on the key
        for any s below 1, and the closure of the coordinate-bucket family at
        s = 1 - o(1) conditional on one extracted bound. It can NEVER certify
        that no key with large Fourier bias exists -- (E4) makes such a key a
        discrete-logarithm oracle rather than impossible -- nor anything about
        joins that are not keyed leaf joins.
      nearby_object_control: >-
        The two objects where the negative conclusion FAILS, both curve-free and
        both blocking: the vector space with a prefix key, where fibres are
        cosets of a subgroup and the indicator is maximally biased; and the
        cyclic group with a log-bucket key, where fibres are exponent intervals.
        The argument MUST return exponent 2/3 on both, or it is wrong. The
        load-bearing structure it identifies is that on a prime-order
        elliptic-curve group no coordinate-defined set has Fourier bias above the
        Weil level -- and that single sentence is the ONLY curve-specific claim in
        the record.
    proof_obligations:
      - claim: 'The collision probability equals the keyed additive energy over the squared pair count.'
        responsibility: correctness
      - claim: >-
          The Parseval expansion and the Cauchy-Schwarz bound
          coll <= 1/N + tau_max^2 K^3 / N^3 for balanced fibres.
        responsibility: correctness
      - claim: 'The unbalanced-fibre version has the same exponent.'
        responsibility: size
      - claim: >-
          For a coordinate-cut set, expanding the indicator in additive characters
          of the base field and applying a mixed sum bound of square-root type
          gives tau_max of order N^{1/2} times a power of log N.
        responsibility: feasibility
      - claim: >-
          The heavy Fourier coefficient of a fibre indicator transfers to the two
          induced functions of the exponent at the frequency and at its product
          with the secret.
        responsibility: interface
      - claim: >-
          The learner cost is below the four-list per-attempt cost over the
          relevant exponent range, for the stated polynomial degree.
        responsibility: runtime
      - claim: >-
          Both curve-free positive controls return exponent exactly 2/3 and the
          random null returns 1 - o(1).
        responsibility: baseline
      - claim: >-
          The identity and the dual are group-theoretic and are reported as such;
          only (E3) is a statement about elliptic curves, and it is conditional.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: 'prime-order ECDLP by a four-list keyed leaf join'
    prior_best: 'Pollard rho at N^{1/2+o(1)} time and O(1) memory; BSGS at (N^{1/2}, N^{1/2})'
    time_exponent: >-
      UNCHANGED. Two numbers are claimed and neither is an improvement. The
      coordinate-bucket keyed join sits at s = 1 - o(1), which on the lane cost
      surface is N^{1/2 - o(1)} before retries and expected time N with retries:
      never sub-rho. A hypothetical key with s below 1 would be used better by
      the learner cascade than by the four-list route.
    memory_exponent: >-
      The coordinate-bucket join pays list memory for nothing. The cascade uses
      polylogarithmic memory. NO memory improvement is claimed.
    hidden_cofactor: >-
      The o(1) in s = 1 - o(1) is of order log log N over log N, coming from the
      logarithmic factor in the Weil-level bound; the learner polynomial in the
      reciprocal of the relative bias; and the group cofactor. Nothing
      superpolynomial.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        SAMPLE TO POPULATION. Emitted sums of sampled lists are independent
        samples from the population emitted-sum distribution, and the sampled
        cross-collision count over the survivors concentrates around the
        population prediction with relative error o(1).
      random_model_justification: >-
        The expectation identity is exact. The VARIANCE bound is not rigorous,
        because pairs share leaves; this imitates the second-moment concentration
        in the standard list-size analysis for generalized birthday joins and is
        the same gap an existing record in this lane already carries.
      supporting_results:
        - ref: H-JPR-3a00f0
          provenance: internal
          claim: >-
            The conditioned cross-collision row at Theta(N^{-2/3}), which this
            record rewrites as an energy row.
          verified_by: >-
            coordinator, TASK-20260904-9c61a9 (targeted search of the record; the
            quoted row and its exponent read on the returned lines)
      validation_experiment_ids:
        - EXP-PFDR-410259
      falsification_condition: >-
        A symbolic second-moment bound with the shared-leaf dependence charged
        shows the relative error is not o(1) at the relevant list sizes. The
        sample-to-population step is not available and every conditioned row must
        be restated at the population level only.
    - id: HEUR-002
      formal_statement: >-
        WEIL-LEVEL BIAS OF COORDINATE SETS. For any set cut from G by a
        bounded-degree coordinate condition -- interval, residue class,
        multiplicative-subgroup membership of the coordinate -- the largest
        nonzero-frequency Fourier coefficient modulus is of order N^{1/2} times a
        power of log N.
      random_model_justification: >-
        Rigorous IF the recalled mixed-form character-sum bound applies as
        recalled. It imitates the classical square-root cancellation of Weil sums
        along a curve twisted by a group character, the elliptic analogue of the
        Polya-Vinogradov bound for intervals in a prime field. THE EXACT MIXED
        FORM IS THE RECORD BLOCKING EXTRACTION and is the only place where a
        curve enters at all.
      supporting_results:
        - ref: >-
            Kohel and Shparlinski, On exponential sums and group generators for
            elliptic curves over finite fields; Lange and Shparlinski, Certain
            exponential sums and random walks on elliptic curves
          provenance: recalled
          claim: >-
            Bounds of square-root order for sums of additive characters of the
            base field evaluated at the coordinate over a subgroup, possibly
            twisted by a character of the group. WHETHER THE MIXED FORM IS
            INCLUDED IS NOT VERIFIED by any agent in this program.
          verified_by: null
      validation_experiment_ids:
        - EXP-PFDR-410259
      falsification_condition: >-
        The extraction finds NO mixed-form bound in the named sources. (E3) is
        DOWNGRADED to a heuristic with the pure-subgroup form as its rigorous
        half, the record survives as a reformulation plus a named extraction gap,
        and no coordinate-bucket closure may be quoted as rigorous.
  structural_ingredients:
    - description: >-
        Parseval and the convolution theorem on a finite abelian group, which
        supply (E1) and (E2) with no assumption.
      citation: 'elementary Fourier analysis on finite abelian groups; the derivation is reproduced in the statement'
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (the derivation is short and is checked here)
      role: the load-bearing identity and its dual
    - description: >-
        Square-root cancellation for mixed exponential sums along an elliptic
        curve twisted by a character of the group.
      citation: >-
        Kohel and Shparlinski, ANTS-IV 2000; Lange and Shparlinski, Canad. J.
        Math. 2005
      provenance: recalled
      verified_by: null
      role: >-
        THE SINGLE CURVE-SPECIFIC INGREDIENT AND THE BLOCKING EXTRACTION. Not
        opened by any agent in this program. Until it is, (E3) is a heuristic.
    - description: >-
        Sparse Fourier learning over a cyclic group in time polynomial in the
        logarithm of the modulus and the reciprocal of the relative bias.
      citation: 'Akavia, Goldwasser and Safra, Proving hard-core predicates using list decoding'
      provenance: recalled
      verified_by: null
      role: >-
        the cascade in (E4), which is shared with a sibling proposal in the same
        source session and is claimed only as a corollary, not independently.
  reduction_chain:
    core_problem: >-
      A keyed leaf join whose emitted sums concentrate beyond uniform.
    corollaries:
      - problem: 'the discrete logarithm in the same group'
        reduction_ref: >-
          (E4), via a sparse Fourier learner applied to the fibre indicator
          composed with scalar multiplication -- RECALLED and unverified
        asymptotics_preserved: 'polynomial in the reciprocal of the relative bias; unverified'
  predictions:
    - metric: >-
        P1 -- the exponent s returned by (E1) and (E2) on the two CURVE-FREE
        positive controls: the vector-space prefix key and the cyclic log-bucket
        key. UNITS: dimensionless exponent
      direction: different
      minimum_effect: >-
        FORCED EXACTLY 2/3 on both, with tau_max exactly equal to the fibre size
        on the first and of order the fibre size over pi on the second. Any
        deviation voids the record. These controls contain NO CURVE and their
        purpose is to demonstrate that the identity fires where concentration is
        provably present.
    - metric: >-
        P2 -- the tau_max threshold at K = N^{1/3} as a function of s. UNITS:
        dimensionless exponent of N
      direction: different
      minimum_effect: >-
        EXACTLY N^{1 - s/2} up to constants: relative bias of order 1 at
        s = 2/3, and exactly the Weil level N^{1/2} at s = 1. A derivation giving
        a threshold BELOW the Weil level at some s below 1 has an error, because
        it would let coordinate keys concentrate. The available range between the
        random level N^{1/3} and the fibre size N^{2/3} is a factor N^{1/3}, so
        the statistic has genuine room to move; but near s = 1 the margin over
        the Weil level is only logarithmic, and the record therefore claims
        s = 1 - o(1) and NOT s = 1.
    - metric: >-
        P3 -- the RANDOM-KEY NULL: tau_max and s for a uniformly random key at
        K = N^{1/3}. UNITS: exponent
      direction: different
      minimum_effect: >-
        FORCED tau_max of order sqrt(N/K) times a log factor, i.e. the random
        level N^{1/3}, and s = 1 - o(1). This is the floor: any coordinate key
        must sit between it and the Weil level, and the record predicts it does.
    - metric: >-
        P4 -- the exact MIXED or PURE form of each extracted character-sum bound,
        recorded verbatim with its exact quantifiers. UNITS: categorical
      direction: different
      minimum_effect: >-
        BLOCKING AND REPORTED WHATEVER IT IS. (E3) needs the MIXED form -- a sum
        over the group of an additive character of the coordinate twisted by a
        character of the group. If only the pure-subgroup form is available, (E3)
        is DOWNGRADED to a heuristic with the pure form as its rigorous half and
        the record says so in its own words rather than quoting a conditional
        result as rigorous.
    - metric: >-
        P5 -- s for the coordinate-interval bucket leaf key, conditional on the
        extracted bound. UNITS: exponent
      direction: higher
      minimum_effect: >-
        At least 1 minus a term of order log log N over log N. THIS IS THE ONLY
        CURVE-SPECIFIC PREDICTION IN THE RECORD and it inherits the
        conditionality of P4 in full.
    - metric: >-
        P6 -- learner cost against four-list per-attempt cost, tabulated over the
        exponent range between 2/3 and 1 at the stated learner polynomial degree.
        UNITS: exponent of N
      direction: different
      minimum_effect: >-
        REPORTED AS A TABLE with the learner polynomial degree as a stated free
        parameter, and with the range of degrees for which the cascade beats the
        four-list route named explicitly. This is a corollary shared with a
        sibling proposal and is NOT independent evidence.
    - metric: >-
        P7 -- CURVE-FREE ATTRIBUTION STATEMENT: which of (E1), (E2), (E3), (E4)
        contain an elliptic curve. UNITS: categorical, per statement
      direction: different
      minimum_effect: >-
        FORCED AND REPORTED. (E1), (E2) and (E4) are group-theoretic and are
        reproduced exactly by the two curve-free controls and the random null;
        only (E3) is a statement about elliptic curves. The deliverable must
        attribute the closure at that granularity, and describing the identity or
        the dual as an elliptic-curve result is prohibited.
  test_boundary:
    instances:
      - 'CURVE-FREE POSITIVE CONTROL 1: a vector space over the field of two elements with a prefix key'
      - 'CURVE-FREE POSITIVE CONTROL 2: a cyclic group with a top-bits-of-logarithm key'
      - 'CURVE-FREE NULL: a uniformly random key at the same class count'
      - 'the coordinate-interval bucket leaf key on a prime-order elliptic-curve group (symbolic only)'
    parameters:
      K: 'N^{1/3} in the displayed bound; the threshold is stated as a function of both s and K'
      fibre_balance: 'balanced in the displayed bound; the unbalanced case is a stated proof obligation'
      extraction_sources: 'the two named character-sum papers, with the exact statement and its quantifiers recorded verbatim'
      runs: '0'
    implementation: >-
      STATIC AND SYMBOLIC ONLY. Zero runs, no implementation, no curve
      generation, no join executed, no list built. This is REQUIRED by the
      question own claim boundary, which authorises static theorem and
      certificate architecture only. The exact Fourier instrument that would
      measure s at toy scale without running a join is deliberately NOT proposed
      here and would need its own authority.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 1
      maximum_memory_gb: 8
      maximum_runs: 0
  falsification_conditions:
    - >-
      F1 IDENTITY WRONG. (E1) and (E2) return an exponent other than 2/3 on
      either curve-free positive control. The identity is wrong and the record is
      void.
    - >-
      F2 BOUND INAPPLICABLE. A coordinate-bucket leaf key is exhibited with
      tau_max exceeding N^{1/2+delta} for some positive delta. Either the
      recalled bound does not apply, in which case the record is downgraded, or
      (E3) is false.
    - >-
      F3 EXTRACTION GAP. The extracted literature contains no mixed-form bound.
      (E3) becomes a heuristic with the pure form as its rigorous half; the
      record survives as a reformulation plus a NAMED extraction gap, and the
      coordinate-bucket closure may not be quoted as rigorous.
    - >-
      F4 CAUCHY-SCHWARZ LOSS. The bound is shown to lose a power of N for
      unbalanced fibres in a way that changes the threshold exponent. The
      balanced-fibre assumption fails and the threshold must be restated.
    - >-
      F5 NOT A FALSIFICATION, AND ROUTED. A key with s below 1 on a prime-order
      elliptic-curve group is exhibited. (E2) then predicts a Fourier-biased
      fibre and (E4) predicts a sub-four-list algorithm; the object is routed to
      an independent review at the highest effort tier per AGENTS.md rule 12. It
      is NOT claimed here.
    - >-
      F6 ATTRIBUTION MIS-STATED. Any artifact describes (E1), (E2) or (E4) as an
      elliptic-curve result. They are group-theoretic and are reproduced by
      curve-free controls; the artifact is invalid.
  interpretation_limits:
    - >-
      Zero runs, no implementation, no curve generation, no ECDLP result -- which
      is not a stylistic choice but the question own declared claim boundary.
    - >-
      (E3) is CONDITIONAL on a recalled bound and is a pointer until an agent
      opens the source and records the exact mixed-sum statement. No agent in this
      program has done so.
    - >-
      The record closes the coordinate-bucket LEAF-key family on the
      enumeration-1 line; it does not close keys computed by other means, and it
      is not an ECDLP lower bound.
    - >-
      The identity and its dual are facts about finite abelian groups. Only the
      coordinate-bucket conclusion is about elliptic curves, and both positive
      controls that demonstrate the instrument fires are curve-free. Attributing
      the closure to elliptic-curve structure would be attributing a
      group-theoretic fact to a curve.
    - >-
      Near s = 1 the threshold exceeds the Weil level only by a logarithmic
      factor, so the argument excludes s below 1 asymptotically and cannot
      exclude s = 1 minus a term of order log log N over log N. That is exactly
      what is claimed.
    - >-
      Toy-scale measurement of s would sit inside the gap between the Weil level
      and the random level at reachable field sizes, so a measured exponent at
      those sizes would be INCONCLUSIVE by construction. The record predicts that
      difficulty rather than a signal, and no measurement is proposed here.
    - >-
      No hypothesis, experiment or goal status changes; no sub-rho mechanism is
