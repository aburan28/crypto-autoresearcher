  title: >-
    HOLD-T: affordability table WITHOUT /mu (orbit cancelation); Koblitz vs
    ordinary arm_ratio predicted ~1 at n=19 m=3 l=5 on pure-Python S_4/W_4;
    n=37/29 have no tau-stable V of dim 8/6; source shape-differential is
    named falsifiable alternative — no exponent / rho claim

  statement: >-
    SETTING. Binary curves over F_{2^n}, CNF-XOR / S_{m+1} descended point-
    decomposition cost at toy scale. Source IDEA-20260922-493606 claimed a
    Koblitz-shaped m=4,l=8,n=37 cell becomes affordable via a per-instance
    leaf-count divisor mu=n from IDEA-20260922-7ab503, while a matched
    pseudorandom-shaped null stays ~64x more expensive.

    HOLD-T CORRECTED PART (A) — REMOVE /mu; SHOW CANCELATION. Absolute
    Frobenius is an equivariance between conjugate targets (IDEA-20260906-
    a77711 Lemmas A1/A2 at q=2; H-BINSTD-74b002 / EXP-BINSTD-375338 already
    freezes this correction for 7ab503). On the sound orbit system the leaf
    count is n * 2^{m l} / (m! * n) = 2^{m l}/m!. There is NO per-instance
    factor n. The corrected Stage-0 affordability table therefore has a
    SINGLE column 2^{ml}/m! identical for Koblitz-shaped and pseudorandom-
    shaped curves. Frozen recomputed cells (integer arithmetic):
      m=3,l=8: 2^{24}/6 = 2,796,203
      m=4,l=8: 2^{32}/24 = 178,956,971
      m=5,l=6: 2^{30}/120 = 8,947,849
      m=4,l=5 (admissible stable cell n=31): 2^{20}/24 = 43,691
    The source IDEA's /37 and /29 columns are REJECTED as primary; retained
    only as the named falsifiable alternative Stage 1 is designed to refute
    via arm_ratio ~1 (not ~1/n).

    HOLD-T CORRECTED PART (B) — STABLE-V CENSUS BLOCKS n=37 AND n=29. At
    prime n, tau-stable subspaces of F_{2^n} have dimensions governed by
    ord_n(2). Review-computed and Stage-0-to-recompute: ord_37(2)=36,
    ord_29(2)=28 — Phi_n irreducible over F_2; dims {0,1,n-1,n} only. No
    8-dimensional (resp. 6-dimensional) stable V exists at n=37 (resp. 29),
    so the source IDEA's Frobenius-shift encoding cannot act on the search
    cube at those cells. Measurement cells MUST use n in {17,19,23,31,41}
    (or other degrees with mid-dimension stable V when a Frobenius-indexed
    arm is claimed). The primary Stage-1 cell freezes the review's concrete
    experiment: n=19 (ord_19(2)=18; NO tau-stability claimed), m=3, l=5,
    random 5-dimensional polynomial-basis V (3*(5-1)=12<=19 admissible).

    HOLD-T CORRECTED PART (C) — INSTRUMENT AND ANCHOR. WDSat/CaDiCaL are
    NOT installed in this repository; the CNF-XOR leaf-count arm the source
    IDEA proposed is therefore unavailable. This protocol uses the pure-
    Python Macaulay/W_D closure instrument under
    experiments/EXP-CERTBIN-e94b27/impl/{macaulay,closure,curve,gf2n}.py,
    measuring S_4 descent refutation cost at (m,l)=(3,5) — a DIFFERENT
    oracle from CNF-XOR leaf counts, stated as such. The m=3,l=8 ~2.8e6
    figure from IDEA-20260904-b40e6d is a DESIGN ESTIMATE, not a completed
    run; Stage 0 records that explicitly and does not treat it as measured
    wall-clock. S_4 Macaulay feasibility at 15 variables is itself the first
    Stage-1 metric (untested); instrument_unavailable / watchdog expiry is
    infrastructure (AGENTS.md rule 3), not negative math evidence.

    HOLD-T CORRECTED PART (D) — WHAT IS CLAIMED. Primary prediction:
    arm_ratio = median(ops_Koblitz)/median(ops_ordinary) in [0.8, 1.25] at
    the frozen n=19,m=3,l=5 cell (shape does NOT decide affordability on
    this instrument). Secondary: corrected Stage-0 table and cancelation
    identity hold as arithmetic certificates. A replicated arm_ratio < 0.5
    would be NEW (a shape effect that is not the per-instance symmetry) and
    routes to review-breakthrough before interpretation — it is NOT the
    expected success path. NO competitiveness-with-rho claim (source (E)
    retained as disclaimer). NO m>=4 CNF-XOR cell claimed executed here;
    the corpus m>=4 gap of IDEA-20260807-32f96d stays open but shape-blind
    under the corrected table (successor seam: RQ-CERTBIN / S_5 closure).

  statement_note: >-
    IDEA-20260922-493606 claim text is immutable and left at status
    proposed. Review verdict defective (HOLD-T return_for_revision).
    Defects absorbed: (1) remove /mu; show orbit cancelation citing a77711
    / KN-FIND-47da4e / H-BINSTD-74b002; (2) forbid n in {29,37} as
    measurement cells for Frobenius-indexed arms; freeze n=19 concrete
    cell; (3) declare missing CNF-XOR engine; re-plan on pure-Python
    S_4/W_4; (4) label b40e6d anchor as unmeasured design estimate;
    (5) primary prediction is arm_ratio~1, not shape differential;
    (6) no exponent / rho claim. Successor seam for true m>=4 measurement
    remains CERTBIN S_5 extension (review successor_seam), not this packet.

  mechanism: >-
    OBJECT FRAME. Representation: x-coordinates in a fixed F_2-basis;
    S_4 Weil descent + W_4 mutant closure (pure-Python). Operation set for
    the shape comparison: identical (m,l,n,V-dimension) on a Koblitz-shaped
    curve (a,b in F_2) versus an ordinary CERTBIN cell over the same field
    — NO per-instance mu-orbit constraint (HOLD-T: that constraint is
    unsound / cancelled). Trichotomy: the corrected claim is a CONTROL
    MEASUREMENT (Class I partial-action comparison of two curve shapes at
    fixed parameters), not a new tracked object and not a solver-
    engineering speedup. Lossy-projection: the source IDEA's tracked object
    (Frobenius-orbit representative as leaf divisor) is REJECTED; what
    survives is the honest gap "measure an m>=4 cell shape-blindly" plus
    the Stage-1 equality prediction.

  assumptions:
    - >-
      a77711 A1/A2 at q=2 hold (imported from IDEA-20260906-a77711 /
      H-BINSTD-74b002); Stage 1 does not re-prove them at deployed scale.
    - >-
      Pure-Python S_4/W_4 at n=19,m=3,l=5 is the authorized instrument;
      CNF-XOR leaf counts are NOT measured in this packet.
    - >-
      IDEA-20260904-b40e6d's ~2.8e6 figure is a design estimate (unmeasured
      for Stage-0 anchoring purposes).
    - n=19 toy only for Stage 1; no deployed-curve attack runs.
    - No claim that m=4 or m=5 becomes competitive with rho.

  proof_search_map:
    bottleneck: >-
      Whether, after removing the nonexistent per-instance mu divisor, any
      residual Koblitz-vs-ordinary differential appears in S_4/W_4
      refutation cost at the frozen toy cell — and whether the pure-Python
      S_4 instrument reaches those parameters at all.
    baseline_embedding:
      parameter_slice: >-
        Stage 0: corrected 2^{ml}/m! table + cancelation identity +
        ord_n(2)/stable-dim census for n in {17,19,23,29,31,37,41}.
        Stage 1: n=19, m=3, l=5, two arms (ordinary CERTBIN A=46693,B=306147
        vs Koblitz y^2+xy=x^3+1), 100 targets/arm, 5 seeds.
      reproduction_check: >-
        Stage 0 recomputes 2^{24}/6, 2^{32}/24, 2^{30}/120, 2^{20}/24 and
        the cancelation n*2^{ml}/(m!*n)=2^{ml}/m! exactly. Stage 0
        recomputes ord_n(2) for the census set and marks {29,37} empty for
        mid-dimension V. Stage 1 ground-truth enumerates 3-fold V-sums for
        planted targets.
    observation_collision:
      observable: >-
        (arm_ratio of median ops_per_attempt, refutation_rate per arm,
        certificate_pass_rate)
      distinct_preimage_search: >-
        An arm_ratio << 1 could be (i) a genuine non-symmetry shape effect
        or (ii) an implementation confound (different V draw, different
        planting, solver bug). Broken by shared target-generation seeds,
        dual random-V null within each arm, and independent certificate
        verification of every found decomposition.
    constructive_transforms:
      - transform: remove_false_divisor
        proposed_object: >-
          Shape-blind affordability table 2^{ml}/m! plus a measured
          arm_ratio control at one toy cell.
        predicted_gain: >-
          Converts the source IDEA's false shape-differential into a
          falsifiable equality prediction and keeps the honest m>=4 gap
          visible without a Koblitz story.
    quantifier_order: >-
      CLAIMED: GIVEN a77711 cancelation, the Stage-0 table entries equal
      2^{ml}/m! (not 2^{ml}/(m!*n)); AND at the frozen Stage-1 cell,
      arm_ratio lies in [0.8,1.25] OR the instrument is unavailable
      (infrastructure). NOT CLAIMED: any per-instance mu gain; any
      competitiveness with rho; any m>=4 CNF-XOR completion; any statement
      at n in {29,37} as Frobenius-stable measurement cells.
    method_ceiling:
      strongest_certifiable_claim: >-
        Corrected arithmetic table + census; and (if Stage 1 completes)
        equality of Koblitz vs ordinary S_4/W_4 cost distributions at one
        toy cell, OR a breakthrough-routed unexpected differential. Cannot
        certify m>=4 CNF-XOR affordability, cannot move an exponent, cannot
        claim a break.
      nearby_object_control: >-
        (i) Within-arm second random V (bounds run-to-run spread).
        (ii) Planted decomposable targets (soundness). (iii) Forbidden
        cells n in {29,37} listed as structurally empty for mid-dim V.
    proof_obligations:
      - claim: Stage-0 table equals 2^{ml}/m! (no /mu) for frozen cells
        responsibility: correctness
      - claim: cancelation identity n*2^{ml}/(m!*n)=2^{ml}/m! shown
        responsibility: correctness
      - claim: ord_37(2)=36 and ord_29(2)=28; empty mid-dim V
        responsibility: baseline
      - claim: arm_ratio in [0.8,1.25] OR instrument_unavailable
        responsibility: scope
      - claim: certificate_pass_rate=1.0 on every claimed find
        responsibility: correctness
      - claim: no rho-competitiveness / no deployed break claim
        responsibility: scope

