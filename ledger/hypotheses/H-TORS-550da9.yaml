hypothesis:
  id: H-TORS-550da9
  question_id: RQ-TORS-8c7b79
  goal_id: GOAL-ENDO-001
  source_idea_ids:
    - IDEA-20261006-923439
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Factor-count gap of the monic 7-division polynomial of
    y^2=x^3+x+1 over F_23 and its quadratic twist
  statement: >-
    Let p=23 and let E be y^2=x^3+x+1 over F_p. Let c be the smallest
    nonsquare in F_p. Let E^c be y^2=x^3+c^2 x+c^3. Let I(C) be the
    number of irreducible factors, counted with multiplicity, of the
    monic 7-division polynomial of C in F_p[x]. The prediction taken
    from IDEA-20261006-923439 is that the absolute difference of I(E)
    and I(E^c) is at least 1. The concrete negative is that I(E)
    equals I(E^c) after the degree, discriminant, c=1, and trace
    checks pass. A failed check is not that negative. The statistic
    does not depend on a secret scalar and does not move the generic
    exponent 1/2.
  mechanism: >-
    The representation is the monic 7-division polynomial on the
    affine x-line. The operation set is Frobenius on the roots, not
    translation on E(F_p). The projection discards the roots and the
    coefficients and keeps one integer, the multiplicity-weighted
    factor count. Many polynomials share a count, so the projection
    is lossy. Two explanations are separated by the same integer.
    E-orbit says the counts differ by at least 1. E-scale says an
    F_p-rational change of x identifies the factorizations, so the
    counts agree. Agreement is the negative. No factor base is
    proposed.
  assumptions:
    - >-
      For A=1 and B=1, 4A^3+27B^2=31 and 31 mod 23 is 8, not 0, so E
      is nonsingular. The twist discriminant is checked by the run
      and is not precomputed here.
    - >-
      The quadratic twist model is y^2=x^3+A c^2 x+B c^3 with A=1
      and B=1. The claim uses a nonsquare c. The c=1 model is the
      original equation.
    - >-
      I(C) counts irreducible factors with multiplicity. A square-free
      count that drops multiplicity is a different integer.
    - >-
      The monic 7-division polynomial is built from the odd-index
      recurrence psi_1=1, psi_2=2y, psi_3=3x^4+6Ax^2+12Bx-A^2,
      psi_4=4y(x^6+5Ax^4+20Bx^3-5A^2 x^2-4ABx-8B^2-A^3),
      psi_5=psi_4 psi_2^3-psi_1 psi_3^3,
      psi_7=psi_5 psi_3^3-psi_2 psi_4^3, reduced by y^2=x^3+Ax+B,
      then divided by its leading coefficient. The recurrence was
      read from experiments/EXP-ECTD-001/driver/divpoly.py. A degree
      other than 24 means the instrument built the wrong polynomial.
  proof_search_map:
    bottleneck: >-
      The gap |I(E)-I(E^c)|. The trace a_p is a different integer
      and is recorded only as a twist check.
    baseline_embedding:
      parameter_slice: >-
        p=23, E: y^2=x^3+x+1, twist by the smallest nonsquare, ell=7.
        The minimum effect is a gap of at least 1.
      reproduction_check: >-
        Each polynomial is built twice and the coefficient lists must
        agree. The degree of each claim polynomial is 24. The c=1
        model returns the same factor count as E.
    observation_collision:
      observable: I(C)
      distinct_preimage_search: >-
        E and E^c are two models. If their factor counts agree, the
        observable collides and E-scale holds for this pair.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the Frobenius orbits on the roots of psi_7
        predicted_gain: the two factor counts differ by at least 1, or they agree
    quantifier_order: >-
      There exists one nonsquare c in F_23, the smallest one, such
      that the factor counts differ by at least 1. Not for every
      curve and not for every ell.
    method_ceiling:
      strongest_certifiable_claim: >-
        At p=23 and ell=7 the two factor counts differ, or they agree.
        No discrete log is certifiable. The statistic does not depend
        on a secret scalar.
      nearby_object_control: >-
        For c=1 the twisted model is the original equation and the
        factor counts must agree. A disagreement falsifies the
        instrument. That control is the known-equal object.
    proof_obligations:
      - claim: I(C) is the multiplicity-weighted irreducible-factor count of the monic 7-division polynomial.
        responsibility: correctness
      - claim: I(E)=I(E^c), with the instrument checks passed, is a negative for this pair. It is not a confirmation.
        responsibility: scope
    not_applicable_reason: >-
      This is a comparison of two factor counts at one prime. It is
      not a proof that torsion data reveals a discrete logarithm.
  rerandomization: >-
    No re-randomizing walk is used. The prime, the curve, the level,
    and the rule that picks c are frozen. The 30 random degree-24
    polynomials are a null sample for the factor-count integer. They
    do not choose the reading row.
  asymptotic_claim:
    problem: one factor-count gap at p=23 and ell=7
    prior_best: >-
      Opened KR-RHO-13bf67 states that a generic algorithm on a
      prime-order group needs Omega(sqrt(p)) group operations, and
      that Pollard rho meets that bound up to a constant. This
      hypothesis moves neither figure.
    time_exponent: '1/2, unchanged'
    memory_exponent: >-
      unchanged. The polynomial has 25 coefficients. The group need
      not be stored.
    hidden_cofactor: >-
      No o(1) attack term is claimed. The division polynomial is not
      a relation collector.
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against the opened generic bound is 1.
      A factor-count gap is not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        The multiplicity-weighted factor count of psi_7 for this twist
        pair differs by at least 1. A uniform random pair of monic
        degree-24 polynomials over F_23 supplies a null range for the
        integer, not a model of Frobenius.
      random_model_justification: >-
        Frobenius on the 7-torsion satisfies its characteristic
        polynomial X^2-tX+p. Orbit lengths on x-coordinates are
        constrained by that matrix together with the identification
        of P and -P. A random polynomial is not constrained by a
        2-by-2 matrix. The pre-registered minimum effect from
        IDEA-20261006-923439 is a gap of at least 1, not a tail
        probability.
      supporting_results: []
      validation_experiment_ids:
        - EXP-TORS-77e641
      falsification_condition: >-
        The instrument checks pass and I(E) equals I(E^c). That
        equality refutes the predicted gap on this pair. A degree
        failure, a zero discriminant, a c=1 mismatch, a trace mismatch,
        and a timeout do not refute the heuristic.
  structural_ingredients:
    - description: >-
        Naive Semaev index calculus over prime fields does not beat
        generic algorithms under the row's statistical assumptions.
        A factor count of psi_7 is not that attack.
      citation: KR-IC-5931ee
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
        on 2026-10-06
      role: fence around an index-calculus reading of the gap
    - description: >-
        Semaev's S_m vanishes on x-coordinates of points that sum to
        the identity, with degree 2^{m-2} in each variable. psi_7 has
        degree 24 and is not S_m.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
        on 2026-10-06
      role: fence around a summation-polynomial reading
    - description: >-
        Small-order torsion and S_m symmetry shrink point-decomposition
        systems on extension-field curves. The row is a PDP cost claim.
      citation: KR-IC-955fd6
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
        on 2026-10-06
      role: fence around a decomposition-cost reading
    - description: >-
        The 2016 survey states that prime-field ECDLP has no known
        attack better than rho for general curves.
      citation: KR-IC-9e610d
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-9e610d.yaml
        on 2026-10-06
      role: unchanged time exponent
    - description: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. Pollard rho meets that bound up to a constant.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
      role: unchanged time exponent
    - description: >-
        Over a finite field, isogenous curves have the same number of
        points. A quadratic twist is not asserted to be F_p-isogenous
        to E. The trace check asks for the negation, which is the twist
        relation, not an isogeny.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
      role: fence around reading the twist as an isogeny walk
    - description: >-
        MOV and Frey-Ruck apply when the embedding degree is small, and
        anomalous curves are trace one. A factor-count gap is neither
        an embedding degree nor a trace-one test.
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
        on 2026-10-06
      role: fence around a transfer-attack reading of the gap
    - description: >-
        The odd-index division-polynomial recurrence used by the driver
        is the one in the vendored divpoly module. Silverman's book was
        not opened.
      citation: experiments/EXP-ECTD-001/driver/divpoly.py
      provenance: internal
      verified_by: >-
        design session opened that file on 2026-10-06 and checked that
        the driver's psi_7 on y^2=x^3+x+1 over F_23 has degree 24 and
        leading coefficient 7 before it is made monic. The factor
        counts were not computed.
      role: the polynomial whose factor count is I(C)
  reduction_chain:
    core_problem: one factor-count gap at p=23 and ell=7
    corollaries: []
  predictions:
    - metric: absolute_difference_of_I_E_and_I_twist
      direction: different
      minimum_effect: at least 1
  test_boundary:
    instances:
      - y^2=x^3+x+1 over F_23 and its twist by the smallest nonsquare
    parameters:
      p: 23
      A: 1
      B: 1
      ell: 7
      secondary_p: 29
      null_polynomials: 30
      null_seed: 20261006
    implementation: >-
      Build the monic 7-division polynomial of E, of E^c, and of the
      c=1 model. Factor each in F_23[x] and count irreducible factors
      with multiplicity. Check degrees, discriminants, the c=1 count,
      and the trace negation. Emit the gap. Do not search for a
      discrete logarithm. The p=29 repeat and the 30 random polynomials
      are written beside the gap and do not choose the reading row.
    budget:
      cell: one prime, one twist pair, ell=7
      maximum_runs: 1
  falsification_conditions:
    - >-
      The instrument checks pass and I(E) equals I(E^c). That equality
      is the concrete negative.
    - >-
      The c=1 factor count differs from I(E). The instrument is then
      invalid and the claim is not established.
    - Either polynomial has degree different from 24.
    - The twist trace is not the negation of the original trace.
    - Either discriminant is 0.
  interpretation_limits:
    - >-
      The statistic is computed from the curve equation alone. It does
      not depend on a secret scalar k. A curve-only statistic is
      k-independent, and this record does not contradict that sentence.
    - >-
      A nonzero gap is not a summation-polynomial attack and does not
      move the prime-field index-calculus conclusion in KR-IC-5931ee
      or KR-IC-9e610d. The discrete-log exponent delta is 0.
    - No factor base, relation, or descent is defined.
    - >-
      The p=29 gap and the random-polynomial range are recorded beside
      the claim. They do not choose the reading row. A timeout is not
      the negative.
