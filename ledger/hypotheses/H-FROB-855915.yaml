hypothesis:
  id: H-FROB-855915
  question_id: RQ-FROB-7d8dd4
  source_proposal: IDEA-20260926-197ecf
  proposal_id: IDEA-20260926-197ecf
  title: >-
    Tau-Horner chain on a Koblitz curve: distinct-relation yield is m! times
    the plain chain at unchanged descended shape (heuristic H1), a constant
    factor, not an ECDLP exponent
  status: approved
  proposed_by: idea-generator
  designed_by: coordinator
  approved_by: coordinator
  approval_decision: DEC-20260930-f693b9
  approved_at: '2026-09-30'
  novelty_status: unverified
  novelty_note: >-
    Unverified against Galbraith-Granger-Merz-Petit, eprint 2020/1315. The
    knowledge-base abstract (KN-LIT-0d9d28) says the Frobenius endomorphism
    improves symmetry breaking for Koblitz curves. The full text was not
    opened. This record does not assert that the tau-Horner chain is new.

  statement: >-
    On the frozen toy Koblitz cells of EXP-FROB-5e15ed, exact ordered-tuple
    enumeration gives a pooled yield ratio P1 = (distinct verified relations
    per target, tau-Horner) / (same, plain chain) inside [0.8 m!, 1.2 m!] at
    every cell, because the plain sum is m!-to-one on distinct entries by
    symmetry and the tau-Horner map is treated as injective on those tuples
    (heuristic H1). The descended chain is predicted to have the same closure
    work as the plain chain (P2). The ordinary [2]-Horner link is predicted
    to have descended degree at least 5 against plain degree 3 (P3). The
    predicted budget move is a constant of about 2 to 2.5 bits after
    rebalancing, recomputed as arithmetic and labeled modeled. No ECDLP
    exponent moves. Pollard rho at exponent 1/2 dominates.

  mechanism: >-
    On y^2 + xy = x^3 + a x^2 + 1 over F_{2^n} the 2-Frobenius tau satisfies
    x(tau P) = x(P)^2. The tau-Horner decomposition of a target R over
    F_V = {P : x(P) in V} is an ordered tuple (P_1, ..., P_m) with
    R = tau^{m-1}(P_1) + ... + P_m, equivalently the Horner recursion
    u_1 = P_1, u_k = tau(u_{k-1}) + P_k, R = u_m. Each link replaces
    S_3(x(u_{k-1}), x_k, x(u_k)) = 0 by S_3(x(u_{k-1})^2, x_k, x(u_k)) = 0.
    Squaring is F_2-linear and, in a normal basis, a cyclic shift of
    coordinates, so the Weil descent is the plain chain with each consumed
    node block rotated. The plain sum is m!-to-one on tuples with distinct
    entries: every ordering is the same relation. The tau-Horner map has no
    such symmetry. Heuristic H1 says it is injective on tuples up to a
    birthday error, so each algebraic solution is a distinct relation
    log R = sum_k lambda^{m-k} log P_k with lambda the Frobenius eigenvalue,
    a known scalar. Expected distinct relations per attempt therefore rise
    by m! at the same system shape. This is a symmetry-counting statement.
    It is not a Dickman smoothness law. On an ordinary curve the only
    symmetry-breaking endomorphisms are integer multiples; the [2]-Horner
    link has x([2]u) of degree 4, so the descended degree rises. That
    control is what makes the zero-degree claim Koblitz-specific.

  assumptions:
    - >-
      The plain chain and the tau-Horner chain are compared at the same V,
      the same n, the same targets, and the same closure code path.
    - >-
      Relations are distinct coefficient vectors over F_V after identifying
      P and -P. Both arms use that sign convention.
    - >-
      The lower-chain condition (a shorter decomposition makes the chain
      equivalence conditional) applies to both arms and is checked by the
      enumerator.
    - >-
      Executable cells are only the frozen panel at n in {17, 19}. Content
      at n = 131 is arithmetic on published constants. No transfer to
      deployed curves.
    - >-
      The proposal's H1 side condition ml <= n holds for cells (17, 2, 8),
      (19, 2, 9) and (19, 3, 6). Cell (17, 3, 6) has ml = 18 > 17. It stays
      in the panel because IDEA-20260926-197ecf lists it in the quantifier
      order. It is not dropped and the P1 rule is not relaxed for it.
    - >-
      Standing user authorization of 2026-09-06 covers approval of a complete
      contract. Approval is not evidence that H1 is true.

  predictions:
    - metric: >-
        P1, yield ratio = (distinct verified relations per target, tau-Horner)
        / (distinct verified relations per target, plain chain), pooled over
        targets, per cell
      direction: higher
      minimum_effect: >-
        Inside [0.8 m!, 1.2 m!] at every frozen Koblitz cell (2 at m = 2,
        6 at m = 3). Closed interval. A ratio below 0.5 m! or above 2 m! on
        any Koblitz cell, with the Z/NZ control in band and relations
        verified, falsifies H1 there.
    - metric: >-
        P2, closure-work ratio = (GF(2) row operations of W_4 on the
        tau-Horner descent) / (same on the plain descent), matched targets,
        per Stage-2 cell
      direction: same
      minimum_effect: >-
        Inside [0.83, 1.2] on every Stage-2 cell. Outside [0.5, 2] on two
        cells is outcome (ii): reported, budget claim suspended, not a
        silent pass.
    - metric: >-
        P3, descended Boolean degree of one ordinary-curve [2]-Horner link,
        read from the ANF, against plain-link degree 3
      direction: higher
      minimum_effect: >-
        At least 5. P3 = 3 withdraws the Koblitz-specificity clause and is
        not success.
    - metric: >-
        P4, corrected per-attempt budget column at m = 5, 6, 8 under the
        producer's model, recomputed in Python and labeled modeled
      direction: higher
      minimum_effect: >-
        About 2.3, 2.5 and 2.7 bits above 2^13.96, 2^19.77 and 2^27.37.
        The predicted move after rebalancing is a constant of about 2 to
        2.5 bits. A disagreement with the proposal's stated figures by more
        than 0.5 bit is an arithmetic error for a superseding record, not a
        curve result.

