  falsification_conditions:
    - >-
      P1 < 0.5 m! or P1 > 2 m! on any Koblitz cell, with that comparison's
      Z/NZ control inside [0.8 m!, 1.2 m!] and every relation verified:
      H1 is false on that cell. Structural collisions of the tau-Horner map.
    - >-
      P2 outside [0.5, 2] on two Stage-2 cells, instruments intact: outcome
      (ii). The shape-invariance reading fails for rotated node blocks.
      Reported. The budget claim is suspended. Not a silent pass and not,
      by itself, a rejection of H1.
    - >-
      P3 = 3 on an ordinary [2]-Horner link: the control does not separate,
      and the Koblitz-specificity clause is withdrawn. Not success.
    - >-
      Recomputation of claim (D) disagrees with the proposal's stated bit
      figures by more than 0.5 bit: arithmetic error, for a superseding
      record, not a curve result.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Injectivity of the tau-Horner map on tuples. For a subspace V of
        dimension l, the map (P_1, ..., P_m) -> sum_k tau^{m-k} P_k has no
        m!-fold symmetry. Distinct tuples therefore give distinct relations,
        so the distinct-relation yield is m! times the plain chain, up to
        the birthday error in the proposal's H1 statement: tuples that
        collide do so except for a fraction O(|F_V|^m / 2^n). The plain sum
        is exactly m!-to-one on distinct entries by symmetry of addition.
      formal_statement: >-
        For V a subspace of dimension l and F_V = {P : x(P) in V}, the plain
        map (P_1, ..., P_m) -> P_1 + ... + P_m is m!-to-one on tuples with
        distinct entries. The tau-Horner map (P_k) -> sum_k tau^{m-k} P_k is
        injective on those tuples up to a birthday fraction
        O(|F_V|^m / 2^n). Equivalently, distinct verified relations per
        solved ordered tuple are predicted to be 1 for tau-Horner and 1/m!
        for the plain chain, and the pooled ratio P1 of those yields is
        predicted to be m!.
      rigorous_support: >-
        The plain sum is m!-to-one on distinct entries by symmetry of
        addition: every ordering is the same relation. The tau-Horner map
        has no such symmetry, because the coefficients are the distinct
        powers lambda^{m-k}. That counting comparison is the rigorous
        ingredient. It is not a Dickman smoothness law, and it is not
        claimed as one. A collision of the tau-Horner map is a nontrivial
        relation sum_k lambda^{m-k} (log P_k - log P'_k) = 0. Under a model
        where base-point logs are uniform in the prime-order subgroup, such
        a relation has probability 1/N per tuple pair. That uniformity model
        is the heuristic part, not a theorem of this record.
      random_model_justification: >-
        Symmetry gives the plain chain's factor m! with no randomness. The
        only random-model step is the absence of a structural collision
        family for the tau-Horner map beyond the birthday count. This is not
        Dickman's theorem and not a smoothness probability.
      supporting_results:
        - >-
          Counting fact internal to this hypothesis: the plain sum is
          m!-to-one on distinct entries. No external distribution theorem
          is discharged. Eprint 2020/1315 is nearest prior art and is not
          support; its full text was not read.
      validation_experiment_ids:
        - EXP-FROB-5e15ed
      falsification_condition: >-
        P1 < 0.5 m! or P1 > 2 m! on any frozen Koblitz cell of
        EXP-FROB-5e15ed, with the relabelled Z/NZ control inside
        [0.8 m!, 1.2 m!] and the relations verified as group identities.

  proof_search_map:
    bottleneck: >-
      Whether the m! symmetry factor in the product law can be removed
      without changing the descended system's shape. Prior routes
      (symmetrised polynomials, solver-side symmetry breaking) pay in
      degree, variables, or solver constraints.
    baseline_embedding:
      parameter_slice: >-
        m = 2 on the Koblitz cell (n, m, l) = (17, 2, 8): the tau-Horner
        chain is the single equation S_3(x_1^2, x_2, x_R) = 0, the pattern
        (1, 0); the plain chain is the pattern (0, 0). The record must
        reproduce a yield ratio of exactly the m = 2 case of the P1 band
        around 2!, and equal closure work where Stage 2 applies. On RC-1
        the plain arm must reproduce archived W_4 labels for 10 U62 and 5
        S62 systems.
      reproduction_check: >-
        Frozen regression: 10 archived RC-1 U62 systems and 5 archived RC-1
        S62 systems through the plain-chain code path reproduce their
        archived W_4 labels. Then the m = 2 Koblitz cell with exact
        enumeration of both maps.
    observation_collision:
      observable: >-
        The pair (distinct relations per target, closure work per attempt)
        for the two chains at a fixed frozen (n, m, l, V).
      distinct_preimage_search: >-
        A yield ratio near m! could be (i) injectivity of the tau-Horner map
        or (ii) a counting error that counts orderings as relations in the
        tau arm only. Separated by the relabelled Z/NZ control, where both
        maps are computed on integers with lambda replaced by a recorded
        element of order n: the ratio must fall in the same band, a counting
        fact about a symmetric map versus an injective map, and by
        re-verifying every relation as a group identity.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the plain chain link S_3(x(u_{k-1}), x_k, x(u_k)) by
          S_3(x(u_{k-1})^2, x_k, x(u_k)). In a normal basis this is a
          rotation of the node block. Completeness: every tau-Horner
          decomposition is a solution. Soundness: every solution is
          re-verified as a group identity with coefficients lambda^{m-k}.
          The squaring matrix on the node block and the normal-basis
          rotation are both implemented and must agree.
        predicted_gain: >-
          m! in distinct relations per solved attempt. About 2 to 2.5 bits
          on the budget column after rebalancing. No exponent gain.
    quantifier_order: >-
      FOR ALL Koblitz curves and subspace bases V, the descended tau-Horner
      chain is the descended plain chain with rotated node blocks
      (unconditional given linearity of squaring). FOR the cells
      (n, m, l) = (17, 2, 8), (17, 3, 6), (19, 2, 9), (19, 3, 6): the yield
      ratio is PREDICTED inside [0.8 m!, 1.2 m!] and, on the two m = 3
      cells, the closure-work ratio is PREDICTED inside [0.83, 1.2]. NOT
      CLAIMED: any per-attempt cost at n = 131, and no claim that the
      constant beats Pollard rho.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named toy Koblitz cells the tau-Horner chain yields a
        distinct-relation ratio inside the P1 band relative to the plain
        chain, at W_4 closure work inside the P2 band on the m = 3 cells;
        on the ordinary controls the [2]-chain has descended degree P3 >= 5
        against plain degree 3. It certifies nothing about solving cost at
        m >= 5 or at n = 131 beyond the modeled arithmetic of claim (D).
      nearby_object_control: >-
        The ordinary RC-1 curve and the n = 19 CERTBIN cell, with the
        [2]-Horner chain (symmetry broken, degree raised) and with the plain
        chain; the relabelled Z/NZ control for the counting claim.
    proof_obligations:
      - claim: >-
          x(tau P) = x(P)^2, and tau acts on the prime-order subgroup as
          lambda with lambda^n = 1, re-checked on each Koblitz cell.
        responsibility: baseline
      - claim: >-
          The descended tau-Horner link is the plain link with the node
          block rotated (normal basis), and the squaring-matrix form agrees.
        responsibility: correctness
      - claim: >-
          Ordered solution counts of the two chains agree in expectation;
          distinct-relation counts differ by m! under H1.
        responsibility: success_probability
      - claim: >-
          The corrected budget column of claim (D), recomputed in Python
          and labeled modeled, not measured.
        responsibility: correctness
      - claim: >-
          Every relation is verified as a group identity with coefficients
          lambda^{m-k}.
        responsibility: correctness
      - claim: >-
          Nothing is asserted at n = 131 beyond arithmetic on published
          constants. No transfer to deployed curves. The time exponent
          versus Gaudry and versus rho is unchanged.
        responsibility: scope

  asymptotic_claim:
    problem: >-
      ECDLP relation-collection yield for subspace-base index calculus on a
      binary Koblitz curve, at the frozen toy cells. Not a claim that the
      ECDLP exponent improves.
    prior_best: >-
      Pollard rho at exponent 1/2, and the Gaudry-style product law whose
      relation term still carries m!. Time and memory exponents are those
      of that prior, unchanged.
    time_exponent: >-
      Unchanged versus Gaudry and versus Pollard rho. The m! symmetry factor
      is removed from the relation term only. After rebalancing, the
      predicted move is a constant of about 2 to 2.5 bits.
    memory_exponent: >-
      Unchanged versus Gaudry and versus Pollard rho.
    hidden_cofactor: >-
      The m! symmetry factor removed from the relation term only. No new
      superpolynomial cofactor is claimed.
    claim_kind: constant_factor

  dominated_by: Pollard rho at exponent 1/2
  sota_delta:
    time_exponent: 0
    memory_exponent: 0
    time: >-
      Exponent 0. Quantitatively, the predicted change is a constant of
      about 2 to 2.5 bits on the relation term after rebalancing. That
      constant does not beat Pollard rho.
    memory: none
    data_queries: none

  interpretation_limits:
    - >-
      Constant-factor mechanism only. No exponent moves. A 2 to 2.5 bit
      constant is not an ECDLP speedup and is not a win over rho.
    - >-
      Toy tier at n in {17, 19}. Those degrees do not transfer to n = 131.
      The n = 131 content is arithmetic on published constants.
    - >-
      Novelty versus eprint 2020/1315 stays unverified until the full text
      is read.
    - >-
      A timeout, crash, verification failure, RC-1 regression failure, or
      Z/NZ ratio outside [0.8 m!, 1.2 m!] is an instrument defect and is
      not evidence against H1.

