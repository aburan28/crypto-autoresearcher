  proof_search_map:
    bottleneck: >-
      The 4-point decomposition rate at n = 5 and the per-attempt cost of the
      symmetrized 4-variable system, which together set the work term; the
      query term is counting.
    baseline_embedding:
      parameter_slice: >-
        Joux-Vitse's own F_{p^5} systems: 5 equations of total degree 8 in 4
        variables from the 5th summation polynomial, degrevlex Groebner basis
        at |p'| = 16, 25, 32 bits (frozen text lines 678-716).
      reproduction_check: >-
        At |p'| ~ 16 bits the built S_4 system has exactly 5 equations of
        total degree 8 in 4 variables and its reduced degrevlex Groebner basis
        has at most 329 generators (JV's F4 bases never exceeded 329
        generators and the reduced basis is no larger than any basis); the
        ideal degree D_4 is recorded. Wall time is not reproduced (different
        hardware and engine).
    observation_collision:
      observable: >-
        Per cell: |F| representatives; D_4 per arm; F_{p'} operations per
        attempt; attempts to first success and the success count over a
        fixed attempt budget; verified SDHP answers; projected (queries,
        work) at p = 2^64.
      distinct_preimage_search: >-
        Random curves of both torsion types at every p' separate "EcGFp5 /
        EcMasFp5 shape" from "any curve of this torsion type"; the raw arm
        under identity symmetrization separates the symmetrization gain from
        solver behaviour.
    constructive_transforms:
      - transform: oracle_substitution_for_linear_algebra
        proposed_object: Factor-base logs obtained by oracle queries instead of relations plus linear algebra
        predicted_gain: Removes the p^{2-2/5} relation and LA terms; work becomes 24 p C_pdp4; queries p/2. No exponent claim beyond JV's own.
    quantifier_order: >-
      There exists a preregistered toy-p' ladder (cost ladder: >= 3 primes
      spanning >= 12 bits; rate ladder: 3 small primes) on which, for each
      curve shape and arm, D_4, per-attempt cost and the decomposition rate
      are measured on fresh known-d oracle instances and fresh challenges.
    method_ceiling:
      strongest_certifiable_claim: >-
        A (queries, work) pair per curve at p = 2^64 under HEUR-GFPN-DFLAT4 and
        HEUR-GFPN-RATE4 with measured constants, labeled modeled; the queries
        figure is arithmetic. No statement about any protocol's exposure of a
        static-DH oracle and no full-DLP statement.
      nearby_object_control: >-
        Random curves of both torsion types; the rho ruler as the generic
        full-DLP comparison row; the raw arm.
    proof_obligations:
      - claim: Every accepted decomposition lifts to four verified signed factor-base points summing to X_r, and every SDHP answer Y equals [d]X under independent scalar multiplication.
        responsibility: correctness
      - claim: The query count equals the factor-base representative count actually used by the model, reported next to the lazily-issued count.
        responsibility: cost-model
      - claim: The oracle model is declared as an input and never turned into a protocol claim.
        responsibility: scope
      - claim: D_4 is flat along the cost ladder per arm, or HEUR-GFPN-DFLAT4 is falsified and the work projection is void for that arm.
        responsibility: scope
      - claim: The per-attempt [r]X scalar multiplication, system construction, Groebner/FGLM, root extraction and lifting are all charged.
        responsibility: runtime

  heuristic_assumptions:
    - id: HEUR-GFPN-DFLAT4
      formal_statement: >-
        For fixed n = 5, fixed m = 4, fixed symmetrization arm A in {raw, S_4,
        2-torsion x| S_4}, and for all primes p' on the frozen cost ladder,
        the FGLM ideal degree D_4,A of the descended (n-1)-point system over
        F_{p'} is independent of p' up to relative variation < 10% across any
        three ladder primes spanning >= 12 bits.
      random_model_justification: >-
        The descended ideal is cut out by polynomials whose number, degrees
        and monomial structure are determined by n, m and the symmetrization
        group, not by the characteristic; for large p' its Groebner geometry
        is that of a generic system of that shape, so D_4,A is a combinatorial
        invariant of (n, m, A). Same justification as HEUR-GFPN-DFLAT
        (H-GFPN-9a29be) restated for m = 4.
      supporting_results:
        - ref: KN-LIT-673219
          provenance: retrieved
          claim: JV's complexity statements are in terms of n and q with the Groebner cost governed by system shape; their precomputed pair list is reused unchanged across |p'| = 16, 25, 32 bits (lines 706-710).
          verified_by: coordinator, TASK-20260921-1fb8ef
        - ref: KN-LIT-8aff72
          provenance: retrieved
          claim: Design-note degree model depends on k = n only.
          verified_by: KN-LIT-8aff72 / SRC-PORNIN-2022-274-ECGFP5
      validation_experiment_ids:
        - EXP-GFPN-659e34
      falsification_condition: >-
        On any completed arm, measured D_4 varies by more than 10% across
        three cost-ladder primes spanning >= 12 bits. The work projection to
        p = 2^64 for that arm is then void ("not transferable"); a timeout or
        memory exhaustion does not falsify it.
    - id: HEUR-GFPN-RATE4
      formal_statement: >-
        For a random curve E over F_{p'^5} of prime-order (or near-prime-order)
        group and the factor base F of x-rational points up to negation, the
        probability that a uniformly random point of the group is a sum of
        four signed points of F is (1/(24 p'))(1 + o(1)), uniformly in p' on
        the rate ladder; operationally, the measured rate times 24 p' lies in
        [0.25, 4] on every completed rate cell.
      random_model_justification: >-
        The number of unordered signed 4-multisets of F is ~ (2|F|)^4 / 4! ~
        p'^4 / 24 and their sums are distributed like p'^4/24 uniformly random
        group elements among ~ p'^5, so the covered fraction is ~ 1/(24 p').
        This is the standard m-sum counting heuristic; JV state the
        decomposition fraction as "1 in n! or q (n-1)! depending on the
        details" (line 753). The [0.25, 4] tolerance absorbs orbit
        non-freeness and factor-base size deviations at toy p'.
      supporting_results:
        - ref: KN-LIT-673219
          provenance: retrieved
          claim: Decomposition fraction 1/(q (n-1)!) for (n-1)-point decompositions; degree-5 complexity O(2^{b/5}) oracle calls plus 4! 2^{b/5} c~(5, 2^{b/5}).
          verified_by: coordinator, TASK-20260921-1fb8ef
      validation_experiment_ids:
        - EXP-GFPN-659e34
      falsification_condition: >-
        On two completed rate cells, the observed success count over the fixed
        attempt budget of 6 x 24 p' attempts is <= 1, or the measured rate
        times 24 p' lies outside [0.25, 4]. The attempt-count projection at
        p = 2^64 is then re-derived from the measured constant if the deviation
        is a constant, and declared void if the deviation is p'-dependent.

  asymptotic_claim:
    problem: Oracle-assisted static Diffie-Hellman on E(F_{p^5}) at p = 2^64 - 2^32 + 1 (EcGFp5, EcMasFp5), concrete cost
    prior_best: >-
      Joux-Vitse 2010: O(2^{b/5}) oracle calls plus 4! 2^{b/5} c~(5, 2^{b/5})
      work at field size b bits (frozen text line 773); no published number
      for these two curves. Generic full-DLP ruler 0.886*sqrt(n) ~ 2^159.8 /
      2^159.3 group operations.
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: >-
      Symmetrized-polynomial construction, per-attempt scalar multiplication,
      FGLM exponent between 2 and 3 on the 4-variable system, orbit lifting;
      the oracle answers (~ p/2 group elements) are the memory term.
    claim_kind: constant_factor
    claim_kind_note: >-
      Measurement of the constants of a known algorithm in a declared oracle
      model; the p^{1+o(1)} work and p^{1} query shapes are JV's, not new.

  predictions:
    - metric: projected_queries_bits_at_p_2_64
      direction: lower
      minimum_effect: Between 62 and 65 bits for both curves (arithmetic, log2(|F|) with |F| ~ p/2).
    - metric: projected_work_bits_at_p_2_64
      direction: lower
      minimum_effect: Below 100 bits for both curves when HEUR-GFPN-DFLAT4 and HEUR-GFPN-RATE4 hold; proposal band 84-93 bits.
    - metric: ideal_degree_D4_per_arm
      direction: lower
      minimum_effect: >-
        D_4 on the S_4 arm at least 2^3 below the raw arm on every completed
        cost cell; on EcGFp5-shaped cells the 2-torsion x| S_4 arm at least
        2^2 further below (free-orbit prediction |G| = 192; measured gap
        reported as orbit_nonfreeness_ratio).
    - metric: decomposition_rate_times_24p
      direction: different
      minimum_effect: In [0.25, 4] on every completed rate cell.
    - metric: D4_variation_across_ladder
      direction: different
      minimum_effect: Relative variation < 10% across >= 3 cost-ladder primes spanning >= 12 bits per arm.

  test_boundary:
    instances:
      - EcGFp5-shaped double-odd curves over F_{p'^5} on the toy ladders
      - EcMasFp5-shaped prime-order curves over F_{p'^5} on the toy ladders
      - Matched random curves with and without rational 2-torsion
      - Simulated oracle with generator-known d; fresh challenges X
    parameters:
      n: 5
      m: 4
      p_crypto: '18446744069414584321'
      cost_ladder: '>= 3 primes spanning >= 12 bits (candidates near 2^12, 2^18, 2^24)'
      rate_ladder: '3 primes near 2^10, 2^11, 2^12'
      arms: [raw, S4, torsion_S4]
      claim_tier: toy
    implementation: EXP-GFPN-659e34
    budget:
      wall_clock_seconds: null
      memory_gb: 16

  falsification_conditions:
    - HEUR-GFPN-RATE4 fails as stated (rate more than 4x below 1/(24 p') on two completed rate cells) -- the work projection is re-derived or void, and the "below 100 bits" prediction is not asserted.
    - HEUR-GFPN-DFLAT4 fails (D_4 varies > 10% across the cost ladder) -- the work projection for that arm is void.
    - D_4 on the S_4 arm is not at least 2^3 below the raw arm on a completed cost cell (symmetrization gain absent at m = 4).
    - Named-shape D_4 differs from the matched random same-torsion control by more than 10% on matched cells (mechanism not generic; re-scope).
    - Any SDHP answer or oracle answer fails independent verification -- instrument invalidation, not a mathematical statement.

  interpretation_limits:
    - Oracle-model cost only; says nothing about whether any deployed protocol exposes a static-DH oracle, and asserts no break of any system.
    - Nothing about the full ECDLP exponent; the full-DLP (n-1) variant enters only as the modeled attempts lower bound that closes IDEA-20260920-9e672a's bookkeeping.
    - Toy measurement; transfer to p = 2^64 is arithmetic-only under the two named heuristics; wall time is never extrapolated.
    - Scope is the two named curve shapes plus random controls at n = 5; no statement about other extension degrees or primes.

  related_experiments:
    - EXP-GFPN-659e34
    - EXP-GFPN-05ff43
