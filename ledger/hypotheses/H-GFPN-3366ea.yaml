# =============================================================================
# H-GFPN-3366ea -- Oracle-assisted static Diffie-Hellman (Joux-Vitse, n=5,
# m=n-1=4) cost on EcGFp5 and EcMasFp5 at p = 2^64 - 2^32 + 1.
# Designed from IDEA-20260920-73dc35 under GOAL-GFPN-380702 / RQ-GFPN-c01af8.
# Ranked design_now by DEC-20260921-683a85. Approval: DEC-20260921-b5c2da
# (standing user authorization 2026-09-06). Pre-run; NOT supported.
# =============================================================================
