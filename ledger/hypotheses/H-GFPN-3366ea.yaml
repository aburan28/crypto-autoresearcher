  title: >-
    Oracle-assisted SDHP on E(F_{p^5}) via (n-1)-point decomposition: queries
    ~ p/2 and work ~ 24 p C_pdp4 per curve, measured at toy p' and projected
    arithmetically to p = 2^64
  status: approved
  status_note: >-
    Pre-run approval paired to EXP-GFPN-659e34 under DEC-20260921-b5c2da.
    Not supported. No run exists. Designing was not approving; the approval
    is the separate Coordinator act under standing user authorization
    2026-09-06 after the protocol-completeness check recorded in that
    decision. Dispatch is sequenced after EXP-GFPN-05ff43's implementation
    commit (TASK-20260921-838c4a dispatch_preconditions).

  statement: >-
    In the oracle-assisted static Diffie-Hellman model of Joux-Vitse
    (inputs/JOUX-VITSE-2010-157/paper_fulltext.md, section 5, Definition 3:
    a learning phase of adaptive queries X_i -> [d]X_i, then a fresh challenge
    X to be answered by [d]X), the Gaudry/Joux-Vitse factor base
    F = {P in E(F_{p^5}) : x(P) in F_p, y(P) in S} with S a half-set of
    representatives up to negation gives, for both EcGFp5 (Pornin 2022,
    KN-LIT-8aff72) and EcMasFp5 (Hermez 2025, KN-LIT-47d541): (i) a learning
    phase of |F| ~ p/2 oracle queries, i.e. about 63 bits at
    p = 2^64 - 2^32 + 1, with no heuristic beyond counting F; and (ii) a
    challenge phase of one successful (n-1) = 4-point decomposition of a
    randomized challenge X_r = [r]X, whose expected attempt count is
    ~ 24 p under HEUR-GFPN-RATE4 and whose per-attempt cost C_pdp4 (one
    scalar multiplication plus one solve of the 5-equation, degree-8,
    4-variable descended system in its symmetrized form) is measured at toy
    p' in F_{p'} operations and is p'-independent in its ideal degree under
    HEUR-GFPN-DFLAT4. The projected work at p = 2^64 is then
    log2(24 p) + log2(C_pdp4) ~ 68.6 + log2(C_pdp4) bits, predicted in
    [84, 93] bits from the proposal's degree model; a value outside that
    range is reported, not adjusted. Both dimensions are reported per curve
    as a line SEPARATE from full ECDLP, with the oracle model stated as an
    input. This hypothesis asserts no attack on any protocol and no change
    to the full-ECDLP exponent; it measures the constants of a published
    algorithm at deployed parameters.

  mechanism: >-
    Joux-Vitse section 5 (frozen text, lines 740-766): learning phase queries
    Q = [d]P for each P in F; modified descent: for a challenge X pick random
    r coprime to the group order, form X_r = [r]X, test whether X_r is a sum
    of m = 4 signed factor-base points by solving the Weil-restricted
    symmetrized 5th summation polynomial (5 equations over F_p of total
    degree 8 in 4 variables, frozen text lines 678-680); on success output
    Y = [r^{-1}] (sum of eps_i Q_i). Decomposition fraction: JV state
    "1 in n! or q (n-1)! depending on the details" (line 753); for m = n-1 =
    4 with |F| ~ p/2 signed representatives the number of signed 4-sums is
    ~ p^4 / 4! against a group of size ~ p^5, giving ~ 1/(24 p) per attempt
    (HEUR-GFPN-RATE4). Symmetrization arms for the 4-variable system: (ii)
    S_4 in elementary symmetric functions (the JV form, both curves); (iii)
    on EcGFp5-shaped double-odd curves, translation by the rational
    2-torsion point (0,0) acts by x -> b/x, so the system in t_i = x_i + b/x_i
    then elementary-symmetric carries (Z/2)^3 x| S_4 of order 192 (the
    (Z/2)^{m-1} x| S_m action of FHJRV as used in H-GFPN-9a29be for m = 5);
    (i) raw descended system as the identity control. The proposal's "/16
    more with the 2-torsion" is NOT adopted: for m = 4 the torsion factor is
    2^{m-1} = 8, and the orbit size is a prediction to be measured
    (orbit_nonfreeness_ratio), not assumed. Work is projected along the
    p-axis by counting attempts (24 p, corrected by the measured rate
    constant) times measured per-attempt F_{p'} operations; wall time is
    never transferred. The query term needs no transfer heuristic: it is the
    representative count of F, which is ~ p/2 by construction.

  assumptions:
    - Public curve parameters only (frozen SRC-PORNIN-2022-274-ECGFP5, SRC-ECMASFP5-HACKMD-2025); the oracle is SIMULATED with a generator-known d; no key, signature, protocol or live system is queried, and no protocol is claimed to expose such an oracle.
    - Every oracle answer and every final SDHP answer is re-verified by scalar multiplication in code independent of the solver; the solver code path never receives d.
    - Queries are counted per factor-base representative up to negation (|F| ~ p/2), as in the frozen JV text ("~ q/2 well-suited oracle queries", line 155); the actually-issued lazy queries are reported separately and never replace the model count.
    - Same solver, same targets and same instances across arms on each cell; timeouts and memory exhaustion are not_measured (AGENTS.md rule 3), never evidence about D_4 or the rate.
    - EcMasFp5-shaped prime-order curves have no rational 2-torsion and no arm (iii); both curve shapes are primary here (unlike EXP-GFPN-05ff43, where EcMasFp5 is a control shape).
    - Cheon-type auxiliary-input attacks (RQ-AUXIN-f8d8c0) are a different oracle model and are not a component or a ruler here; the generic comparison ruler is Pollard rho at 0.886*sqrt(n) (KN-TECH-006, KN-TECH-018), about 2^159.8 (EcMasFp5) and 2^159.3 (EcGFp5) group operations for the full DLP.

