  statement: >
    Fix the closed-form portfolio-yield
    identities of IDEA-20260815-5f2a58
    before any historical batch outcome
    is scored, any prior is updated, or
    any discrete logarithm is solved.
    Stage 0 asserts only that on the
    frozen prior 4-tuple {1/10, 1/5,
    3/20, 1/20} the sum is exactly 1/2
    and is strictly less than n=4. A
    nearby claim that expected yield
    equals n (every proposal survives)
    is rejected. A dummy
    prior-independent yield 1 is
    rejected as an aggregate. This is
    not a calibration measurement and
    not a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260815-5f2a58 tracks
    E[yield]=sum of stated priors
    against a historical base rate.
    Stage 0 freezes the summation
    identity on an exact rational
    4-tuple so a later scrape cannot
    move the aggregate. No outcome is
    read. No Semaev S_m. No Coppersmith.
    No DLP solve.
  predictions:
    - id: P-S0-PORTCAL
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL reports
        1/10+1/5+3/20+1/20=1/2 and 1/2<4. KF
        expected-yield=n is rejected. NULL
        constant-yield-1 is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF
        claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses
        a frozen identity. That
        falsifies only P-S0-PORTCAL
        at the frozen arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
      real_grid:
        priors: ['1/10', '1/5', '3/20', '1/20']
        n: 4
        expected_yield: '1/2'
        must_sum_eq_half: true
        must_sum_lt_n: true
      known_false:
        kind: expected_yield_equals_n
        must_reject: true
      matched_null:
