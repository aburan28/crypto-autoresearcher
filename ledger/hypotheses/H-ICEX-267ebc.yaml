hypothesis:
  id: H-ICEX-267ebc
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260807-291968
  title: >-
    THE DOMINATING TERM OF THE PROGRAM CENTRAL NEGATIVE HAS NEVER BEEN MEASURED-
    the harvested prime-field relation matrix, tracked as (oversampling, row
    weight, rank profile, peak memory, solve exponent) against a support-matched
    random sparse matrix over the SAME modulus, with the one committed anchor
    being 59 relations against 54 factor-base unknowns yielding only 45 solved
    logs, and with the modulus at that anchor COMPOSITE so that rank is not field
    rank and must be reported per prime factor
  statement: >-
    (A) WHAT THE COMMITTED RECORDS SAY, QUOTED. FINDING-PF-IC-001 states VERBATIM
    that the d_reg = 2 floor is a genuine non-degenerate solve and that it does
    not lower the cost, because the cost is dominated by the |F|-size linear
    algebra over the membership-quotient ring, not by the solving degree. The only
    end-to-end prime-field index-calculus run in the corpus, EV-SEMAEV-b3db54,
    records exactly one linear-algebra datum, VERBATIM- 45 of 54 factor-base
    discrete logs solved by Gaussian elimination mod N, an underdetermined system
    with 9 factor-base points unsolvable, with the note that adding more relations
    would fix this. That observation was never followed up.
    (B) THE MEASUREMENT. Harvest genuine independently certified relations on toy
    prime-field curves at field bits 12, 16, 20 and 24 at a fixed harvest
    parameter, logging the rank after EVERY relation, until saturation. The
    tracked object is the matrix itself, as the quintuple (oversampling factor,
    row-weight histogram, rank-versus-relations curve, peak matrix memory,
    measured solve exponent).
    (C) THE CURVE-FREE NULL, WHICH IS MANDATORY AND WHICH DECIDES WHAT MAY BE
    SAID. Every statistic is reported as real against a SUPPORT-MATCHED RANDOM
    SPARSE MATRIX over the same modulus with the same dimensions and the same
    row-weight distribution. That null object contains no curve, no group and no
    factor base. PRE-STATED CONSEQUENCE- if every statistic matches the null, the
    harvested relation matrix is GENERIC FOR ITS SHAPE, the assumed c_LA * B^omega
    term in every ICEX and ECDLP comparison is justified by measurement, and
    NOTHING IN THIS RECORD MAY BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR
    THE ECDLP - it is a statement about sparse matrices of that shape over that
    modulus.
    (D) THE CORRECTION THIS RECORD MAKES TO ITS OWN SOURCE, WHICH IS BLOCKING.
    EV-SEMAEV-b3db54 records p = 1009 with N = 951 and B = 54. 951 = 3 * 317 IS
    COMPOSITE. Gaussian elimination mod a composite modulus does not compute a
    field rank, and a forced-value gate of the form the source proposes - rank
    exactly B-1, never B - is not even well posed over Z/951 without saying which
    ring. THIS HYPOTHESIS THEREFORE REQUIRES rank to be reported PER PRIME FACTOR
    of the group order via the Chinese remainder decomposition, with the modulus
    named on every rank row. A rank figure quoted without its modulus is
    inadmissible.
    (E) THE BAND, SIZED RATHER THAN ASSERTED. The source predicts an oversampling
    factor stably above 1.0. For a random matrix over a large prime field the
    expected number of rows to reach rank B-1 is B-1 plus a vanishing excess, so
    the NULL VALUE IS ESSENTIALLY 1.000 AND -any value above 1.0- IS A BAND OF
    WIDTH ZERO ON THE WRONG SIDE. The discriminator is therefore restated as the
    DIFFERENCE rho_real - rho_null measured in the same run, with rho defined as
    relations harvested at first attainment of rank B-1 divided by B-1. The
    committed anchor gives that difference real room- at p = 1009 the run held 59
    relations against 54 unknowns, i.e. rho at least 59/53 = 1.113, and had still
    NOT saturated.
    (F) WHAT THIS DOES NOT DO. It revises no headline of FINDING-PF-IC-001. It
    proposes no attack, moves no exponent, and a measured c_LA can move cost
    comparisons in EITHER direction, including against index calculus.
  mechanism: >-
    THE TRACKED OBJECT AND WHY THE PROJECTION IS HONEST ABOUT BEING WEAK. The
    relation set is projected onto (rank profile, weight histogram, peak memory,
    fitted solve exponent). What is discarded is which factor-base points appear
    in which relation- the matrix identity is not recoverable from the summary.
    The source record itself calls this a WEAK object and this hypothesis agrees-
    it can produce cost constants and distributions and can never produce a
    mathematical statement about the ECDLP, which is why its class is measurement
    and why its null is curve-free.
    ONE-STEP PROPAGATION, EXACT. Appending one certified relation adds one row;
    the rank increases by 0 or 1 and the weight histogram gains one observation.
    Both are deterministic given the relation, so the rank-versus-relations curve
    is an exactly reproducible object given the relation stream and its seed.
    WHY THE NULL IS THE WHOLE ARGUMENT. Sparse matrices of a given shape and
    weight have well-understood rank and solve behaviour. The only question with
    content is whether the supports index calculus ACTUALLY PRODUCES depart from
    that. If they do not, the corpus gains a measured constant where it had an
    assumption. If they do, the departure must survive replication before it is
    described as anything, because the program own KN-FIND-007 establishes that
    factor-base geometry REDISTRIBUTES decomposition yield rather than creating
    it, which lowers the prior on a structural departure.
    WHY MEMORY IS A FIRST-CLASS METRIC HERE. FINDING-PF-IC-001 places the cost in
    the linear algebra, and no record in this corpus charges the matrix memory at
    all. Peak matrix memory is measured with an allocator-level probe and reported
    in BYTES beside a counted STORED-NONZEROS figure; the two are reported side by
    side and neither substitutes for the other.
  assumptions:
    - >-
      Genuine relations can be harvested at field bits 12 to 24 in the existing
      harness. EV-SEMAEV-b3db54 shows they can at p = 1009, where 59 relations
      were found in 67 trials.
    - >-
      Every relation carries a certificate re-verified independently of the
      collector per docs/claims-and-verification.md, so no fabricated or
      unverified relation enters the matrix. An uncertified relation is discarded
      and counted, never used.
    - >-
      The harvest parameter beta is held FIXED at 1/m and the factor-base size B
      varies only through the field size, so B and beta are not confounded.
    - >-
      MODULUS DISCIPLINE. The group order N may be composite at these toy sizes.
      Rank, kernel and solve are computed and reported PER PRIME FACTOR of N, with
      the modulus named on every row. A single -rank- figure over a composite
      modulus is inadmissible output of this hypothesis.
    - >-
      COST AND MEMORY UNITS. Solve cost is counted in FIELD OPERATIONS in the
      named modulus, never in wall-clock seconds; wall-clock is recorded for
      budget only. Memory is reported as counted STORED NONZEROS and separately as
      allocator BYTES. NEITHER UNIT IS EVER DIVIDED BY THE OTHER.
  proof_search_map:
    not_applicable_reason: >-
      Purely empirical measurement of an object the cost model already assumes. No
      theorem, bound, certificate family or reduction is proposed. The one
      derivation used - that a random matrix over a large field saturates rank at
      an excess vanishing in the field size - is classical and is used to size a
      band, not to make a claim. Recorded rather than omitted per
      docs/inventor-protocol.md section 8.
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-RELMAT-1
      formal_statement: >-
        The oversampling factor, row-weight distribution and rank behaviour
        measured at field bits 12 to 24 at matched harvest parameter are
        DIRECTIONALLY representative of larger factor-base size B at the same
        parameter- that is, the SIGN of any real-minus-null difference is stable
        as B grows, even though its magnitude is not claimed to be.
      random_model_justification: >-
        NONE THAT IS RIGOROUS, AND THIS IS STATED PLAINLY. The heuristic is the
        ordinary assumption that a trend fitted over four sizes extends one step
        further. It is recorded as an assumption precisely so that the record does
        not present four toy sizes as a law, and the validation plan reports the
        trend WITH ITS INTERVAL rather than a point value.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            VERBATIM- the exact mean decomposition yield E_r[c_D(r)] =
            binomial(B+m-1, m)/N for EVERY base of size B, independently of how
            the base is chosen; and its own explicit statement that it says
            nothing about the cost of finding a decomposition or about the linear
            algebra stage, which is where the index-calculus cost actually sits.
            The second half is why this hypothesis exists- KN-FIND-007 CANNOT
            deliver any statement about the matrix, and says so.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - KN-FIND-007 read in full this
            task, 96 lines; both quoted passages are verbatim.
        - ref: FINDING-PF-IC-001
          provenance: internal
          claim: >-
            VERBATIM- the cost is dominated by the |F|-size linear algebra over
            the membership-quotient ring, not by the solving degree; and the total
            IC cost model ell^{(1+gamma)/m} with total exponent 2.05, 90 percent
            CI [1.86, 2.29] at m = 3.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - the statement section and
            invariance table of FINDING-PF-IC-001 read directly this task (first
            page of a 2777-line file, lines 1 to 711). The later versioned
            extension sections were NOT read and nothing from them is relied on.
            PARTIAL READ, DECLARED.
        - ref: EV-SEMAEV-b3db54
          provenance: internal
          claim: >-
            VERBATIM- 45 of 54 factor-base discrete logs solved by Gaussian
            elimination mod N, an underdetermined system with 9 factor-base points
            unsolvable, at p = 1009 with N = 951 and B = 54, from 59 relations
            found in 67 trials. The compositeness of N = 951 = 3 * 317 is this
            agent own arithmetic on the recorded value, not a statement in that
            record.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - EV-SEMAEV-b3db54 read in full this
            task, 50 lines.
      validation_experiment_ids:
        - EXP-ICEX-324406
      falsification_condition: >-
        The sign of the real-minus-null difference on the oversampling factor
        reverses between adjacent tested sizes. Then the trend is not stable even
        across the tested range and no directional statement may be made.
  structural_ingredients:
    - description: >-
        The standing cost model whose dominating term this hypothesis measures,
        including its explicit statement that the cost sits in the linear algebra
        rather than the solving degree.
      citation: FINDING-PF-IC-001
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - PARTIAL READ, DECLARED (lines 1 to 711
        of 2777; statement, invariance table, informal argument and scope section
        read verbatim).
      role: the assumption this record replaces with a measurement
    - description: >-
        The only end-to-end prime-field index-calculus run in the corpus,
        supplying the blocking regression fixture and the anchor showing that
        saturation was NOT reached at 59 relations against 54 unknowns.
      citation: EV-SEMAEV-b3db54
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 50 lines.
      role: blocking regression fixture and the oversampling anchor
    - description: >-
        The yield conservation identity, cited for its explicit boundary- it fixes
        the MEAN and says nothing about the matrix, so it can neither support nor
        refute anything here.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 96 lines.
      role: the boundary of what the yield literature can supply
  reduction_chain:
    core_problem: >-
      The measured structure of the harvested prime-field relation matrix at toy
      scale, against a support-matched random null over the same modulus.
    corollaries:
      - problem: >-
          The c_LA * B^omega term in every ICEX and ECDLP cost comparison in this
          repository, currently assumed rather than measured.
        reduction_ref: >-
          Internal- the cost model is this repository own accounting. No published
          reduction is cited.
        asymptotics_preserved: >-
          Not applicable. A measured c_LA can move comparisons in EITHER
          direction, including against index calculus, and no improvement is
          claimed.
  predictions:
    - metric: >-
        P1- oversampling difference rho_real - rho_null, where rho = relations
        harvested at first attainment of rank B-1, divided by B-1 (dimensionless)
      direction: higher
      minimum_effect: >-
        A DIFFERENCE, not a level. Departure is declared at rho_real - rho_null
        above 0.15 at at least 3 of the 4 tested sizes; agreement at absolute
        difference at most 0.05. The band is sized to a per-cell standard error of
        about 0.02, which the contract obtains with at least 10 independent
        harvest seeds per cell. THE SOURCE PREDICTION -any value above 1.0- IS
        REJECTED HERE AS A WIDTH-ZERO BAND, because the null value is itself
        essentially 1.000.
    - metric: >-
        P2- fitted solve exponent difference omega_real - omega_null over
        B in {16, 40, 101, 256}, from FIELD-OPERATION counts (dimensionless)
      direction: different
      minimum_effect: >-
        A difference exceeding 0.35 in absolute value is a departure; at most 0.15
        is agreement. Sizing- over a 16x range in B the log-log lever arm has
        standard deviation about 1.44 in log2 B, so with 5 seeds per cell and a
        per-cell log2 residual spread of 0.3 the standard error on each exponent
        is about 0.047 and on the difference about 0.066, making 0.35 a 5 sigma
        band and 0.15 a 2.3 sigma band. Cells below B = 32 are MEASURED AND
        REPORTED but EXCLUDED FROM EVERY FIT by a rule declared here, because at
        B = 16 constants dominate any exponent.
    - metric: >-
        P3- planted-structure control- the fitted solve exponent on a matrix with
        a deliberately planted block structure of known size, against the
        support-matched null at the same dimensions and weight
      direction: lower
      minimum_effect: >-
        THE PLANTED DEFECT MUST FIRE AT ITS PREDICTED MAGNITUDE. A
        block-diagonal matrix with k equal blocks solves in k times the cost of
        one block of size B/k, i.e. an exponent lower by the amount the block
        decomposition predicts and at least 0.5 below the null at k = 4. If the
        pipeline does not detect a planted structure of that size, IT CANNOT
        DETECT A REAL ONE AND NO NEGATIVE IT REPORTS IS ADMISSIBLE.
    - metric: >-
        P4- peak matrix memory, reported as counted STORED NONZEROS and separately
        as allocator BYTES, per cell
      direction: higher
      minimum_effect: >-
        REPORTED AT EVERY CELL for both the harvested matrix and the null, with
        the solver named, because Gaussian elimination and a sparse solver have
        very different profiles. This term is currently UNCHARGED anywhere in the
        corpus, so any measured value is new information; no threshold is
        pre-registered and none is needed.
    - metric: >-
        P5- row-weight histogram, real against support-matched null, per cell
      direction: different
      minimum_effect: >-
        The null is CONSTRUCTED to match this distribution, so agreement here is a
        CONSTRUCTION CHECK and not evidence. It is reported as such and is
        explicitly excluded from the departure count. A mismatch means the null
        was built wrongly and the run is INVALID.
    - metric: >-
        P6- regression fixture- reproduction of the committed p = 1009 cell
      direction: different
      minimum_effect: >-
        EXACTLY 45 of 54 factor-base logs solved from the committed 59 relations
        at p = 1009, N = 951, B = 54, under the recorded Gaussian-elimination
        convention and with the modulus named. Any other value means the harness
        differs from the one that produced the only committed run, and NOTHING
        DOWNSTREAM IS ADMISSIBLE until reconciled.
    - metric: >-
        P7- forced-value rank gate, reported PER PRIME FACTOR of N
      direction: different
      minimum_effect: >-
        At saturation the rank over each prime factor must be B-1 and not B, AND
        THE KERNEL VECTOR MUST BE EXHIBITED. If rank B is observed, the run
        reports the kernel test and states which of the two readings holds - the
        expected kernel relation is absent from this construction, or the harness
        is wrong - rather than assuming either.
  test_boundary:
    instances:
      - >-
        Toy prime-field short-Weierstrass curves at field bits 12, 16, 20 and 24,
        with the group order factorisation recorded per instance.
      - >-
        The committed fixture cell p = 1009, N = 951, B = 54.
      - >-
        CURVE-FREE ARM- support-matched random sparse matrices over the same
        modulus with the same dimensions and row-weight distribution, containing
        no curve, no group and no factor base.
      - >-
        PLANTED-STRUCTURE ARM- block-diagonal matrices with k = 4 equal blocks at
        matched dimension and weight, whose solve exponent is known in advance.
    parameters:
      field_bits: '12, 16, 20, 24'
      beta: 'fixed at 1/m; B varies only through the field size'
      B: 'approximately 16, 40, 101, 256; cells with B below 32 excluded from every fit'
      m: '3'
      solver: 'named per cell; both a dense Gaussian elimination and a sparse solver are run and reported separately'
      modulus: 'per prime factor of N, named on every rank and solve row'
      seeds: 'at least 10 harvest seeds per cell for P1; at least 5 per cell for P2'
    implementation: >-
      The existing relation harvester with an added matrix recorder that logs the
      rank after every appended relation, plus an allocator-level memory probe and
      an explicit field-operation counter shared by the harvested arm, the
      curve-free null arm and the planted-structure arm. An arm with its own
      counter is not comparable and is not built.
    budget:
      wall_clock_seconds_per_run: 900
      total_cpu_hours: 20.0
      maximum_memory_gb: 8
      maximum_runs: 60
  falsification_conditions:
    - >-
      F1. Every statistic matches the support-matched null within its stated
      agreement band. THE RELATION MATRIX IS GENERIC FOR ITS SHAPE, the assumed
      c_LA * B^omega term is justified by measurement, the gap that motivated this
      record closes, and NOTHING HERE MAY BE QUOTED AS AN ELLIPTIC-CURVE OR ECDLP
      STATEMENT. This is the predicted outcome and it is a real result.
    - >-
      F2. rho_real - rho_null is at most 0.05 at every size. The currently
      uncharged oversampling term really is free at tested scope.
    - >-
      F3. The p = 1009 regression fixture does not reproduce 45 of 54. The harness
      differs from the one that produced the only committed prime-field IC run and
      nothing downstream is admissible.
    - >-
      F4. The planted block structure is not detected at its predicted exponent
      drop. The pipeline cannot see structure of a size it must be able to see;
      every negative it reports is VOID and the run is INVALID rather than
      negative.
    - >-
      F5. The row-weight histogram of the null does not match the harvested one.
      The null was built wrongly; the run is INVALID.
    - >-
      F6. Relations cannot be harvested to saturation at bits 20 or above within
      budget. CENSORED INFRASTRUCTURE under AGENTS.md rule 5, recorded with the
      budget and the rank reached; NEVER evidence about the matrix.
    - >-
      F7. A departure exceeding the bands survives replication across seeds. That
      is the interesting outcome, it must be replicated at a second size before it
      is described as anything, and it does not by itself move any cost
      comparison.
  interpretation_limits:
    - >-
      TOY SCALE, field bits at most 24 and B at most 256. THE c_LA * B^omega TERM
      AT CRYPTOGRAPHIC B IS NOT TESTABLE AT ANY SCALE THIS PROGRAM CAN REACH- a
      cryptographic factor base is of size 2^40 or more and neither the harvest
      nor the solve is within reach. That is stated rather than the claim being
      quietly shrunk; this record measures the term at toy B and claims nothing
      beyond it.
    - >-
      A measured c_LA REPLACES AN ASSUMED ONE in cost comparisons. It is not an
      attack, it moves no exponent, and it can move comparisons in EITHER
      direction, including against index calculus.
    - >-
      Nothing here revises the headline of FINDING-PF-IC-001. It measures the term
      that finding says dominates.
    - >-
      IF THE CURVE-FREE NULL MATCHES, NOTHING HERE IS AN ELLIPTIC-CURVE STATEMENT.
      Pre-stated so it cannot be renegotiated after the data.
    - >-
      RANK OVER A COMPOSITE MODULUS IS NOT FIELD RANK. Every rank, kernel and
      solve figure is reported per prime factor of the group order with the
      modulus named; a figure quoted without its modulus is inadmissible, and the
      committed fixture at N = 951 = 3 * 317 is exactly why.
    - >-
      Solve cost is counted in FIELD OPERATIONS. Wall-clock is recorded for budget
      accounting only and never enters a fit or a ratio, and no quantity in this
      record is a wall-clock figure divided by an operation count.
    - >-
      claim_tier toy. No attack, no exponent moved, sota_delta zero. Dominated by
      Pollard rho at exponent 1/2 on every row.
