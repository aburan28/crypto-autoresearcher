  statement: >
    Fix the exact k-cap arithmetic of IDEA-20260808-e40da2 before any merge tree, any Fourier coefficient, or any key recovery is claimed. Stage 0 asserts only that at N=160 one has 160/5=32>=16 and 160/6<32, so k=4 is allowed and k=5 is not. A nearby claim that k=5 is allowed at N=160 is rejected. The dummy k=0 as the 1-bit boundary is rejected. This is not a sample-acquisition run. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260808-e40da2 caps k by N/(k+1)>=2^k. Stage 0 freezes the N=160 comparison. No lists. No HNP.
  predictions:
    - id: P-S0-KCAP
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL identities hold and the nearby KF
        claim is rejected. NULL is rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses a frozen identity. That
        falsifies only P-S0-KCAP at the frozen arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
      real_grid:
        N: 160
        k4_lhs: 32
        k4_rhs: 16
        k4_ok: true
        k5_ok: false
        must_k4_ok: true
        must_k5_not_ok: true
      known_false:
        kind: k5_allowed_at_N160
        must_reject: true
      matched_null:
        kind: k0_is_the_1bit_boundary
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDSA-c83101 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy / closed-form arithmetic only. No curve construction
      that would constitute an attack. No Semaev S_m evaluation.
      No Coppersmith. No DLP. No rho beat. The frozen numbers are
      the proposal's own identities, not a fitted result.
  assumptions:
    - id: A1
      statement: >
        Stage 0 evaluates only the frozen closed-form identities.
        It does not execute an attack and does not solve a DLP.
      status: explicit
    - id: A2
