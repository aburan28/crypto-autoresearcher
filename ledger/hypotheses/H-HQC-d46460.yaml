hypothesis:
  id: H-HQC-d46460
  question_id: RQ-HQC-001

  statement: >-
    SCOPE: HQC's ambient ring R = F_2[X]/(X^n - 1) at the three published
    parameter sets and at reduced cells with n prime, n <= 4099; the
    fixed-weight ensemble A1 of the BATCH-001 transcription; the error vector
    e' = x . r2 - r1 . y + e; N <= 1e6 samples per cell. CLAIM TIER toy for
    every measured quantity. NO ATTACK, NO EXPONENT, NO STATEMENT ABOUT
    DEPLOYED HQC's SECURITY.
    TWO CLAIMS, one unconditional and one conditional, deliberately separated.
    (C1, UNCONDITIONAL, ZERO COMPUTE) Evaluation at X = 1 is the unique
    nontrivial F_2-algebra homomorphism out of R whenever ord_n(2) = n - 1,
    which HQC's own parameter-selection rule ("the smallest primitive prime
    greater than n1 n2") forces; and under it the weight of the full-length
    error vector satisfies w(e') = w_e (mod 2) with probability EXACTLY 1, for
    every admissible (x, y, r1, r2, e). Consequently SPEC Eq. (3)'s binomial
    weight model for e' is wrong in total variation by 1/2 - O((1-2p*)^n) as a
    statement about the full ambient vector, and assumption A5 is exactly
    false rather than approximately true at that level.
    (C2, CONDITIONAL ON HEUR-HQC-CHI-2) The security-relevant residue of C1 is
    damped by exactly one geometric factor per truncated coordinate: the parity
    bias of the weight of the code-relevant prefix is B(l) = (1 - 2p*)^l with
    l = n - n1 n2, giving 3.378e-03 / 7.191e-07 / 1.105e-22 at HQC-1 / HQC-3 /
    HQC-5. HQC IS NOT WEAKENED BY THIS RECORD AND THE RECORD SAYS SO IN ITS OWN
    HEADLINE.
    THE OPERATIONAL CONSEQUENCE, and the reason this is worth running: any
    reduced-parameter joint-moment measurement of inner-decoder dependence -
    including the one GOAL-HQC-001's committed next_action queues for
    BATCH-004 - implicitly chooses l, and at small l the character channel
    injects an algebraically forced dependence of magnitude (1-2p*)^l that is
    NOT the residual dependence the measurement is after. The hypothesis
    therefore predicts a FORCED DECAY CURVE that any honest instrument must
    reproduce, and defines the residual as the part that does not decay at that
    rate. If no residual survives at reachable cells, the deliverable is a
    parameter-selection rule plus a bounded negative with its exact boundary.

  mechanism: >-
    DERIVED IN-REPO; no external source is cited and none is needed. The
    primary text is quoted only through the BATCH-001 transcription at
    coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md,
    which is image-verified per formula and whose published constants this
    session independently reproduced (below). Values marked
    [SESSION-COMPUTED] were computed while writing this record with the stated
    procedure and are PRE-REGISTERED FORCED VALUES to be re-derived in-harness;
    they are not measurements and no evidence record may cite them as such.

    STEP 1 - THE RING HAS EXACTLY TWO FACTORS. SPEC section 4.1: n is "the
    smallest primitive prime greater than n1 n2", i.e. n is prime and 2 is a
    primitive root mod n, so ord_n(2) = n - 1. Over F_2, X^n - 1 =
    (X - 1) . Phi(X) where Phi has degree n - 1, and the degree of the
    irreducible factors of Phi equals ord_n(2) = n - 1, so Phi is irreducible.
    By CRT, R = F_2 x F_{2^{n-1}}: exactly two factors, hence exactly one
    nontrivial F_2-algebra homomorphism R -> F_2. [SESSION-COMPUTED by explicit
    order computation over the prime factorisation of n - 1: ord_n(2) = n - 1
    holds for n = 17669 (order 17668), n = 35851 (35850), n = 57637 (57636).]
    This is the "compute ord_n(2)" gate the program-wide angle inventory names
    as HQC's cheapest decisive test, and it resolves as the inventory
    anticipated - the CRT-split family has no room. What the inventory did not
    say, and what this record supplies, is that the one surviving projection is
    not information-free.

    STEP 2 - THE HOMOMORPHISM AND THE IDENTITY. chi_1 : R -> F_2, f -> f(1),
    is well defined (1 is a root of X^n - 1) and multiplicative (it is
    evaluation), and chi_1(f) = w(f) mod 2. Applying it to SPEC section 6.1's
    e' = x . r2 - r1 . y + e, with subtraction equal to addition in
    characteristic 2:
      chi_1(e') = chi_1(x) chi_1(r2) + chi_1(r1) chi_1(y) + chi_1(e).
    A1 fixes w(x) = w(y) = w and w(r1) = w(r2) = w_r, so the first two terms
    are the SAME element of F_2 and cancel. Hence chi_1(e') = w_e mod 2, i.e.
      w(e') = w_e (mod 2)  identically.
    At HQC-1 and HQC-5, w_e = 75 and 149 are odd, so w(e') is always odd; at
    HQC-3, w_e = 114, so it is always even. Note precisely what carries the
    argument: not that the two products are equidistributed, but that they are
    EQUAL, which is a consequence of the scheme's own symmetric weight choice.

    STEP 3 - WHAT THIS DOES TO THE MODEL. SPEC Eq. (3) states
    Pr[w(e') = d] = C(n, d) p*^d (1 - p*)^{n-d}. Under it, parity is Bernoulli
    with bias (1 - 2p*)^n, which at n = 17669 and p* = 0.34 is below 1e-2400.
    The modelled law therefore places essentially half its mass on an
    IMPOSSIBLE parity class, and the total variation distance between modelled
    and true weight laws is at least 1/2 - O((1-2p*)^n). A5 is not a good
    approximation at this level; it is maximally wrong at it. This is a
    statement about e' over the full ambient length and is NOT yet a statement
    about the DFR - which is step 4, and is the part that keeps the record
    honest.

    STEP 4 - THE DAMPING, DERIVED. A23 records SPEC's rule that computations
    happen in length n while the concatenated code occupies the first n1 n2
    coordinates and the trailing l = n - n1 n2 are truncated. Since
    w(e'_prefix) = w(e') - w(tail) and w(e') has fixed parity,
      parity(w(e'_prefix)) = (w_e mod 2) XOR parity(w(tail)).
    If the l tail coordinates are independent Bernoulli(p*) - HEUR-HQC-CHI-2,
    which is A5 reused on at most 37 coordinates, precisely the regime RMRS
    Remark 4.2 supports verbatim ("a small proportion of HQC bits do behave as
    i.i.d Bernoulli variables") - then the XOR of l such bits has bias
    (1 - 2p*)^l, so
      B(l) := |2 Pr[parity(w(e'_prefix)) = w_e mod 2] - 1| = (1 - 2p*)^l.
    [SESSION-COMPUTED in exact rationals from Prop 6.1.1 and Eq. (2):
    p-tilde = 0.215761 / 0.236295 / 0.246846 and p* = 0.339788 / 0.361804 /
    0.372489 at HQC-1/3/5, reproducing SPEC Table 9's printed 0.3398 and
    Table 11's 0.3618 and 0.3725 at every printed digit; l = 5 / 11 / 37 from
    n1 n2 = 17664 / 35840 / 57600 against n = 17669 / 35851 / 57637; hence
    B = 3.378e-03 / 7.191e-07 / 1.105e-22.] THE HONEST READING: at HQC's own
    parameters an exact algebraic constraint is destroyed by an accident of
    parameter selection - the gap to the next primitive prime - and what
    survives at NIST-5 is 1e-22. No advantage follows from 1e-22 and none is
    claimed.

    STEP 5 - WHY THE RECORD IS NEVERTHELESS WORTH HAVING. (a) It is the FIRST
    dependence channel in this campaign with a derived magnitude. Three
    batches established that A17's failure direction cannot be signed
    (DEC-20260802-9664c6 D-6) and that direct measurement at HQC's parameters
    is structurally infeasible (EV-HQC-0e9116: T_req about 1/DFR, 3.4e41 /
    6.8e59 / 8.4e79 trials). This channel is exact and free. (b) It is an
    UNCONTROLLED CONFOUNDER for the queued measurement: a reduced parameter set
    is a choice of l, nothing in the queued design fixes l, and at small l the
    forced parity coupling among block weights can exceed the residual the
    measurement is trying to see. The operational output is a selection rule -
    match (1-2p*)^l to the level being modelled, and report B(l) beside every
    joint moment. (c) It converts the inventor protocol's decay test from a
    heuristic into an exact prediction: the measured bias MUST fall by one
    factor of (1 - 2p*) per truncated coordinate, and a bias that fails to
    decay at that rate localises a second channel instead of leaving "it did
    not work".

    STEP 6 - THE CLOSURE, AT THE INVENTOR-PROTOCOL SECTION 4 STANDARD, AND ITS
    FORWARD GUIDANCE. Named obstruction: R has exactly two CRT factors by
    HQC's own parameter rule, so the CRT/character family contains exactly one
    nontrivial projection and its entire content is the single parity bit of
    step 2. Argument: any F_2-algebra homomorphism out of R factors through one
    of the two factors; F_{2^{n-1}} is a field and has no proper quotient, so
    no further coordinate-computable invariant comes from the decomposition.
    Forward guidance, naming what remains open rather than declaring anything
    impossible: the residual dependence in e' is not of ring-decomposition
    origin and must come from the two structures the character cannot see - the
    FIXED WEIGHTS of x, y, r1, r2, e (which chi_1 compresses to one bit) and
    the ADDITIVE / SUPPORT GEOMETRY of the cyclic convolution (which chi_1
    ignores entirely). IDEA-20260805-15258a proposes the second of those as its
    own object; the queued BATCH-004 joint moment is aimed at it too.

  assumptions:
    - >-
      TRANSCRIPTION FIDELITY. That the BATCH-001 transcription reproduces SPEC
      section 6.1's definition of e' and A1's fixed-weight sampling correctly.
      Support is strong - each displayed formula is image-verified against a
      rendered page, and the BATCH-001 red team reproduced SPEC's published
      numbers nine ways - and this session adds an independent check by
      recomputing p* from the transcribed Prop 6.1.1 and reproducing Table 9
      and Table 11 exactly. It remains an assumption and Stage 0 re-reads the
      two sentences that carry everything.
    - >-
      SYMMETRIC WEIGHT READING, AND IT IS LOAD-BEARING. SPEC section 4.1 reads
      "the parameters w, w_r and w_e denote the weight of the vectors (x, y),
      (r1, r2) and e respectively", which in printed English does not
      distinguish "each of x and y has weight w" from "the pair has total
      weight w". Under the symmetric reading the two convolution terms cancel
      identically and C1 holds as stated. Under the total-weight reading the
      identity weakens to chi_1(e') = w(x)w(r2) + w(y)w(r1) + w_e mod 2, still
      exactly computable per instance from the sampled weights but no longer
      instance-independent. RESOLVING THIS IS STAGE 0 AND THE PACKAGE MAY NOT
      PROCEED PAST IT ON THE AMBIGUOUS READING. The record is written to
      survive either answer and to report which holds.
    - >-
      PRIMITIVITY. That "primitive prime" carries its standard meaning (2 is a
      primitive root mod n). Independently checkable and independently checked
      [SESSION-COMPUTED]; if it fails at any level, C1's uniqueness clause is
      void while the identity itself survives, and the record must be split.
    - >-
      Measurement is by exact fixed-weight sampling (Fisher-Yates on the
      support), NOT by HQC's deployed SampleFixedWeightVect, which A22 records
      as biased with tau values in SPEC Table 12. The biased-sampler variant is
      a declared successor and is not tested here.

  proof_search_map:
    bottleneck: >-
      Assumption A5 - the coordinate-independence of e' - and its downstream
      A17. Every DFR number in SPEC section 6.1, and hence the delta that
      Theorem 6.3 multiplies by (q_RO + q_D), passes through it. Three batches
      have circled it without measuring it, because measuring it directly at
      HQC's parameters needs about 1/DFR trials. The bottleneck this record
      attacks is not the measurement but the PREMISE: A5 is an assertion of
      independence, and a single exact algebraic dependence refutes it as
      stated at zero cost, converting the open question from "is A5 true" to
      "how much of the dependence is accounted for".
    baseline_embedding:
      parameter_slice: >-
        l -> infinity (equivalently, the i.i.d. Bernoulli(p*) ensemble on the
        full length) reproduces the model's own regime exactly: the parity bias
        vanishes, Eq. (3) becomes the true weight law, and every prediction of
        this hypothesis collapses onto SPEC's. The opposite slice, l = 0, is
        the pure-character regime with bias exactly 1. HQC's three parameter
        sets sit at l = 5, 11, 37 between them, and the whole content is the
        interpolation.
      reproduction_check: >-
        SYMBOLIC PLUS NUMERIC, AND ALREADY RUN AT THE SYMBOLIC LEVEL BEFORE
        THIS RECORD WAS WRITTEN. Recomputing p-tilde from the transcribed
        Prop 6.1.1 and p* from Eq. (2) in exact rationals reproduces SPEC
        Table 9's 0.3398 and Table 11's 0.3618 and 0.3725 to every printed
        digit at all three levels [SESSION-COMPUTED]. A curve that merely
        resembles the source is not a reproduction; these are the source's own
        constants recovered from its own formulas. Stage 2 repeats it
        in-harness and the package is disqualified if it does not reproduce.
    observation_collision:
      observable: >-
        The single bit parity(w(e')) on the full vector, and the derived
        real-valued bias B(l) on the prefix.
      distinct_preimage_search: >-
        A collision search on a one-bit observable is trivial and the answer is
        that collisions are MASSIVE - half the ambient space maps to each
        value - so the observable identifies essentially nothing about an
        individual instance. That is not a defect here because the claim is not
        an identifiability claim about instances; it is a claim about the
        ENSEMBLE, and the relevant collision question is whether the treatment
        and null ENSEMBLES collide under the observable. They provably do not:
        treatment is a point mass, null is uniform to within 1e-2400. The
        collision search that WOULD falsify the record is a null ensemble that
        also yields a point mass, and the design tests for exactly that as an
        invalidation rather than assuming it away.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "is A5 approximately true" (a vague distributional question
          with no exact answer) by "what is the image of e' under the CRT
          decomposition of R" (an exact algebraic question with a one-line
          answer). The move is into a model where the hypothesis is an exact
          equality rather than an approximation.
        predicted_gain: >-
          Converts an unmeasurable assertion into a proved identity plus a
          derived damping law, at zero compute, and yields the residual
          decomposition the queued measurement needs. Encoding obligation: the
          identity must be shown to be about the SAME e' the DFR analysis uses.
          Transfer obligation to the prefix vector is EXPLICITLY PARTIAL and is
          carried by HEUR-HQC-CHI-2, not hidden.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (parity of w(e')) fixed and vary the forgotten
          structure - the ensemble generating e'. The intrinsic invariant
          separating the fibres is the SPREAD of the observable: zero on the
          fixed-weight convolution ensemble, maximal on the i.i.d. ensemble.
        predicted_gain: >-
          A discriminator between the true and the modelled ensemble with
          separation exactly 1 at l = 0, which is what makes the l = 0 cell a
          positive control that cannot be passed by accident.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR ALL n prime with ord_n(2) = n - 1, FOR ALL
      w, w_r, w_e, FOR ALL x, y of weight w, FOR ALL r1, r2 of weight w_r, FOR
      ALL e of weight w_e, w(e') = w_e (mod 2). There EXISTS no instance-
      dependent witness anywhere in the statement; the conclusion is uniform
      and the proof is a homomorphism identity, so the dangerous
      quantifier inversion (a witness silently allowed to depend on the
      instance) cannot occur for C1.
      FOR C2 THE ORDER IS WEAKER AND IS STATED AS SUCH: FOR ALL cells, IF the
      tail coordinates are jointly independent Bernoulli(p*), THEN B(l) =
      (1-2p*)^l. The antecedent is HEUR-HQC-CHI-2 and it is a distributional
      assumption about the very structure C1 refutes elsewhere in the vector.
      That partial circularity is disclosed here rather than discovered by a
      reviewer: C2 is the NULL HYPOTHESIS of the graded ladder, and breaking it
      is the ladder's most valuable outcome.
      WHAT IS NOT CLAIMED, in either order: that the character channel is the
      ONLY dependence. Asserting FOR ALL dependence channels, the channel is
      chi_1, would be false and is nowhere stated.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: (i) an exact parity identity for the HQC error vector under
        the symmetric fixed-weight reading; (ii) a proof that the ambient ring
        admits exactly one nontrivial character; (iii) a derived damping law
        with a measured confirmation at reduced cells; (iv) an upper bound on
        the residual non-character dependence at exactly the cells measured.
        The method CANNOT certify anything about HQC's DFR at its own
        parameters, cannot move a security level in either direction, cannot
        close A5 or A17 (it refutes A5's literal form and leaves its engineering
        adequacy on codeword supports untouched), and cannot support any
        chosen-ciphertext consequence.
      nearby_object_control: >-
        TWO, both cheap and both mandatory. FIRST, the i.i.d. Bernoulli(p*)
        ensemble on the same length: the closest object to the treatment,
        differing only in the structure whose effect is claimed, and the object
        on which the hoped-for conclusion MUST FAIL - its parity is free. A
        method that reports a fixed parity there is measuring its own
        implementation. SECOND, a cell with n prime but ord_n(2) < n - 1, so
        that R has MORE than two CRT factors: the identity must still hold
        (chi_1 exists for every n) while the uniqueness clause must not. A
        method that cannot separate "the identity" from "the closure" is
        reporting one claim as two.
    proof_obligations:
      - claim: >-
          ord_n(2) = n - 1 at all three published parameter sets, computed and
          not assumed from SPEC's wording.
        responsibility: baseline
      - claim: >-
          chi_1 is the unique nontrivial F_2-algebra homomorphism out of R when
          ord_n(2) = n - 1.
        responsibility: correctness
      - claim: >-
          w(e') = w_e mod 2 identically under the symmetric weight reading;
          and the modified identity under the alternative reading.
        responsibility: correctness
      - claim: >-
          p-tilde and p* recomputed in exact rationals reproduce SPEC Table 9
          and Table 11 at every printed digit.
        responsibility: baseline
      - claim: >-
          B(l) = (1 - 2p*)^l for the prefix under HEUR-HQC-CHI-2, with the
          heuristic's status carried on every citation.
        responsibility: success_probability
      - claim: >-
          The null ensemble's parity is free, verified rather than assumed.
        responsibility: interface
      - claim: >-
          Nothing here transfers to a statement about deployed HQC's security;
          the damping is stated on every citation.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. THERE IS NO COMPLEXITY CLAIM OF ANY KIND. No exponent
    moves, no algorithm is proposed, no cost is asserted, and sota_delta on
    every attack axis - time, memory, data, queries, advice - is exactly zero.
    dominated_by is not applicable because no Pareto point is claimed. The
    exponent-bearing lane of this goal is the ISD baseline and it is
    H-HQC-1d9b21, not this record.

  heuristic_assumptions:
    - id: HEUR-HQC-CHI-1
      formal_statement: >-
        NONE LOAD-BEARING FOR C1. FOR ALL admissible (x, y, r1, r2, e) under
        A1's symmetric fixed-weight ensemble, w(e') = w_e (mod 2). This is a
        theorem, not a heuristic, and the entry exists to record that C1 is
        UNCONDITIONAL where every prior claim in this campaign was
        conditional. The only assumption in C1's vicinity is evidentiary - that
        the transcribed text says what it is quoted as saying.
      random_model_justification: >-
        Not applicable: the statement is deterministic. Recorded rather than
        omitted, because a blank field would read as an oversight.
      supporting_results: []
      validation_experiment_ids: [EXP-HQC-bd30c0]
      falsification_condition: >-
        A single sampled instance at l = 0 whose weight parity differs from
        w_e mod 2, OR an exhaustive enumeration at n = 7 exhibiting a
        counterexample. Either refutes C1 outright and the record is superseded,
        never edited.
    - id: HEUR-HQC-CHI-2
      formal_statement: >-
        FOR ALL cells in the declared boundary, the l truncated tail
        coordinates of e' are jointly independent Bernoulli(p*), hence the
        prefix parity bias is exactly (1 - 2p*)^l. Asserted ONLY for the tail
        of l <= 37 coordinates and NOT for the n1 n2 retained coordinates, and
        asserted uniformly over cells rather than cell by cell.
      random_model_justification: >-
        Partial and honestly partial. The strongest available support is RMRS
        Remark 4.2, quoted verbatim in the BATCH-001 transcription: "a small
        proportion of HQC bits do behave as i.i.d Bernoulli variables" - a
        statement about exactly this regime, made by the derivation source SPEC
        points at. SPEC Table 10's simulation is the other. NEITHER IS A PROOF,
        and the correct reading is that C2 is a prediction under a weakened
        form of the assumption C1 refutes elsewhere. The circularity is
        deliberate: C2 is the ladder's null hypothesis.
      supporting_results: []
      validation_experiment_ids: [EXP-HQC-bd30c0]
      falsification_condition: >-
        |B_hat(l) - (1 - 2p*)^l| > 4/sqrt(N) at any l above the declared
        measurement floor 8/sqrt(N), consistently across the three cells. Such
        a departure refutes HEUR-HQC-CHI-2 AND simultaneously exhibits a
        non-character dependence channel in the tail, which is the most
        valuable outcome the experiment can produce.

  structural_ingredients:
    - description: >-
        CRT decomposition of F_2[X]/(X^n - 1) for n prime with 2 primitive
        mod n: X^n - 1 = (X - 1) . Phi(X) with Phi irreducible of degree
        n - 1, hence R = F_2 x F_{2^{n-1}}.
      citation: >-
        NO CITATION IS ASSERTED. This is standard finite-field theory (the
        degrees of the irreducible factors of the n-th cyclotomic polynomial
        over F_q equal ord_n(q)); it was DERIVED AND VERIFIED IN-REPO by
        computing ord_n(2) directly at the three parameter sets. Treating a
        remembered textbook statement as an authority is exactly what
        AGENTS.md rule 9 forbids, so the computation is the support.
      role: >-
        establishes that exactly one nontrivial character exists, which is what
        turns an observation into a closure with a named obstruction
    - description: >-
        Bias of a XOR of l independent Bernoulli(p) bits equals (1 - 2p)^l.
      citation: >-
        Elementary and derived in this record (the Fourier-Walsh coefficient of
        a product is the product of coefficients). No citation asserted.
      role: supplies the exact damping law and hence the graded ladder's forced curve
    - description: >-
        HQC's analytic DFR model - Prop 6.1.1, Eq. (1)-(3), Props 6.1.3/6.1.4,
        Theorem 6.1 - with 23 numbered assumptions and 10 published-text
        anomalies.
      citation: >-
        coordination/goals/GOAL-HQC-001/batches/BATCH-001/tasks/TASK-20260802-6344ed/dfr_model_transcription.md,
        an in-repo transcription of the HQC specification dated 22/08/2025
        (sha256 174186cb5fdc0108aad914391360c222f52ea533bfb406146fac124b3a25406d)
        and of arXiv:2005.10741 (sha256
        cbb7dbd670f27cdcf602438018df52745c0af495050aedb3b83a0b00986f5446).
        Neither PDF is committed to this repository. THE PDFs WERE NOT READ BY
        THIS SESSION; every quotation here is at one remove through the
        transcription, which is image-verified per formula, and that remove is
        recorded rather than glossed.
      role: supplies A1, A5, A17, A23, the parameter table, and p*

  reduction_chain:
    core_problem: >-
      Determine, exactly and at zero compute, one dependence channel among the
      coordinates of HQC's error vector e', and derive how much of it survives
      the truncation the concatenated decoder applies.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this identity to any
      statement about HQC's decoding failure rate at its selected parameters,
      to the IND-CCA2 advantage, or to any attack, and none is claimed. The
      damping factor 1.1e-22 at NIST-5 is the reason: an exact constraint whose
      surviving residue is 1e-22 supports no downstream corollary. Any citation
      of this hypothesis toward a security statement must carry that number.

  predictions:
    - metric: >-
        G1 - parity_fixed_fraction, treatment arm, full length, over N = 1e6
        samples at each of three reduced cells
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000000 (1000000 of 1000000). No tolerance; a single
        counterexample halts the package and triggers the weight-reading fork.
    - metric: >-
        G2 - parity_fixed_fraction, matched i.i.d. Bernoulli(p*) null arm, same
        n, same p*, same N
      direction: different
      minimum_effect: >-
        Within 0.5 +/- 0.002 (four binomial standard errors at N = 1e6). The
        forced value is 0.5 + (1-2p*)^n/2, indistinguishable from 0.5 at every
        cell. IF THE NULL ALSO RETURNS 1.000000 the arms are not differently
        constructed and every comparison in the package is void.
    - metric: >-
        G3 - B_hat(0), treatment, no truncation (the positive control)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000. The effect is algebraically total here; an instrument
        that cannot see it may not report its absence anywhere else.
    - metric: >-
        G4 - the graded ladder B_hat(l) against the forced curve (1 - 2p*)^l
        for l in {0, 1, 2, 3, 4, 5}
      direction: lower
      minimum_effect: >-
        |B_hat(l) - (1-2p*)^l| <= 4/sqrt(N) at every l whose forced value
        exceeds the declared floor 8/sqrt(N), PLUS strict monotone decrease
        across the tested range. At N = 1e6 the floor is 0.008, so with
        p* near 0.34 the cells l = 0..4 (forced 1.000, 0.320, 0.1026, 0.0329,
        0.01053) are tested and l = 5 (0.00337) is reported as below floor and
        NOT counted as a test. A bias that fails to decay is the canonical
        artifact tell.
    - metric: >-
        G5 - ord_n(2) recomputed in-harness at n in {17669, 35851, 57637}
      direction: different
      minimum_effect: >-
