# H-ECDLP-753879 — stage-0 instrument for IDEA-20261009-8d09c0 (SNFS-D4).
# Specified under DEC-20261012-e7075a. No run exists in this design packet.
# Rank r >= 2, smoothness, and mutual information stay outside this boundary.
hypothesis:
  id: H-ECDLP-753879
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20261009-8d09c0
  derived_from_idea: IDEA-20261009-8d09c0
  experiment_id: EXP-ECDLP-903c48
  goal_id: GOAL-ECDLP-001
  specified_at: '2026-10-12'
  proposed_by: coordinator
  status: specified
  title: >-
    Stage-0 instrument for a rank-1 elliptic net: division-polynomial
    zeros versus the group-law order of one point on y^2 = x^3 + 2 over F_11
  statement: >-
    On y^2 = x^3 + 2 over F_11, the point P = (1, 5) has group-law order 12.
    The rank-1 division-polynomial net at P, with W(0) = 0, W(1) = 1,
    W(2) = 2y, and the doubling recurrences, satisfies W(n) = 0 in F_11 for
    n = 1..24 if and only if 12 divides n. The first positive zero is 12.
    This stage does not estimate mutual information and does not test a
    rank r >= 2 kernel lattice.
  mechanism: >-
    For a non-identity point, the division polynomial psi_n vanishes at P
    exactly when nP is the identity. The rank-1 elliptic net is that
    sequence. Stage 0 computes the net from the recurrence and the order
    from the chord-and-tangent group law, and compares them on one
    preregistered point. Agreement is the rank-1 reproduction check named
    by IDEA-20261009-8d09c0. It is not a test that small-prime net structure
    carries information about an unknown kernel.
  assumptions:
    - >-
      Arithmetic is exact in F_11. A timeout or an exception is an instrument
      failure, not evidence about sieve independence.
    - >-
      The point has nonzero y-coordinate, so the even-index recurrence can
      divide by W(2) = 2y. The cell does not include 2-torsion.
  proof_search_map:
    bottleneck: >-
      Whether the recurrence-defined rank-1 net vanishes exactly on the
      multiples of the group-law order. Stage 0 checks one point.
    baseline_embedding:
      parameter_slice: >-
        Chord-and-tangent addition of P = (1, 5) until the sum is the
        identity, and the division-polynomial recurrence through n = 24.
      reproduction_check: >-
        5^2 = 1^3 + 2 in F_11, the order is 12, and the net zeros in 1..24
        are exactly 12 and 24.
    observation_collision:
      observable: >-
        group_law_order, first_positive_zero, and zeros_match_order_multiples.
      distinct_preimage_search: >-
        The group law and the recurrence are separate calculations. Matching
        zeros check the net implementation against addition. They do not
        estimate mutual information.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The zero set of W(n) for n = 1..24.
        predicted_gain: none; this stage records whether that zero set equals 12Z
    quantifier_order: >-
      For this single cell (p = 11, P = (1, 5), window 1..24), the first
      positive net zero equals the group-law order and every later zero in
      the window is a multiple of that order. No claim is made for all
      curves or for mutual information.
    method_ceiling:
      strongest_certifiable_claim: >-
        The stage-0 instrument accepts or rejects this one rank-1 cell.
        No sieve-cost statement and no independence statement follow.
      nearby_object_control: >-
        Non-multiples in the same window, including n = 6, must be nonzero.
        A random lattice of matching index is not built in this stage.
    proof_obligations:
      - claim: P lies on the curve and the group-law order is computed by addition
        responsibility: baseline
      - claim: net values are written by the run, not copied from this record as a result
        responsibility: runtime
      - claim: mutual information is not measured here
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: group_law_order_equals_12
      direction: different
      minimum_effect: group_law_order equals 12 on this cell
    - metric: first_positive_net_zero_equals_order
      direction: different
      minimum_effect: first_positive_zero equals 12
    - metric: window_zeros_are_the_order_multiples
      direction: different
      minimum_effect: zeros in 1..24 are exactly [12, 24]
  test_boundary:
    instances:
      - curve y^2 = x^3 + 2 over F_11
      - point P = (1, 5)
      - net window n = 1..24
    parameters:
      p: 11
      a: 0
      b: 2
      point: [1, 5]
      window_end: 24
    implementation: >-
      experiments/EXP-ECDLP-903c48/implementation/run.py, pure Python,
      no external algebra system
    budget:
      enforcement: advisory
      note: one deterministic cell; machine protection is on the handoff
  falsification_conditions:
    - >-
      Instrument invalid if the group-law order is not 12, if the first
      positive net zero is not 12, or if any n in 1..24 disagrees with
      "zero exactly when 12 divides n". That outcome does not decide the
      mutual-information claim of IDEA-20261009-8d09c0.
    - >-
      The alive condition of IDEA-20261009-8d09c0 (positive mutual information
      between Lambda_p membership and smoothness or Lambda_q membership,
      across at least three primes, with a random-lattice control at zero)
      is outside this test boundary. It stays open.
  interpretation_limits:
    - >-
      A pass checks one rank-1 net against addition. It is not evidence that
      small-prime net values leak the kernel lattice modulo a large prime.
    - >-
      A fail invalidates this instrument cell only. It is not negative evidence
      about sieve independence.
    - Negative evidence closes only the exact tested scope.
    - No deployed curve and no private-key recovery is in scope.
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        Not under test in EXP-ECDLP-903c48. The parent idea's independence
        statement is about rank r >= 2 nets, smoothness, and several small
        primes. This cell does not sample that model.
      random_model_justification: >-
        No random lattice is drawn. The only comparison is addition versus
        the division-polynomial recurrence on one point.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Not applicable to this experiment. No mutual-information observation
        is produced.
  structural_ingredients:
    - description: >-
        Rank-1 division polynomials as the elliptic net of a point. The
        initial terms and doubling recurrences are the instrument, not a
        citation check of Ward or Stange.
      citation: IDEA-20261009-8d09c0
      provenance: internal
      verified_by: >-
        design session 2026-10-12 read ledger/proposals/IDEA-20261009-8d09c0.yaml
      role: names the rank-1 reproduction check; the formulas evaluated are in the runner
  asymptotic_claim: null
  dominated_by: >-
    KN-TECH-009, as named by the parent idea: a rank-1 net that matches the
    point order is the known EDS rank of apparition, not a sub-rho method.
    This hypothesis claims no exponent delta.
  sota_delta: >-
    None in exponent. The counted delta is a frozen rank-1 instrument cell.
    The parent idea's mutual-information table is not produced.
  citations:
    - ref: IDEA-20261009-8d09c0
      provenance: internal
      claim: parent proposal, write-once, not modified by this hypothesis
      verified_by: >-
        design session 2026-10-12 read ledger/proposals/IDEA-20261009-8d09c0.yaml
    - ref: KN-LIT-018
