hypothesis:
  id: H-PFDR-9aadc0
  question_id: RQ-PFDR-ae2fba
  source_idea_id: IDEA-20260903-cf63ad
  title: >-
    The prime-field digit twin of the binary chained Semaev system has neither
    ingredient of the exhibited binary degree-3 syzygy (the Boolean identity
    P(1 + P) = 0 fails in characteristic p and no subset-sum of its two
    generators degenerates in degree), so if KN-FIND-006's 8 dim V deficit is
    Frobenius-mediated the twin shows deficit 0 at every degree up to the
    Koszul cell D = 8, while a chaining-graph mechanism predicts a deficit
    affine in the digit length s at D = 8
  statement: >-
    SETTING. E/F_p short Weierstrass, p > 3, arity m = 3, chained t = 3 tree
    over F_p with no Weil descent: E1 = S_3(x_1, x_2, u), E2 = S_3(u, x_3,
    x_R), x_R constant, u a FREE F_p variable (the internal node), each leaf
    x_k = sum_{i<s} a_{k,i} 2^i with digit equations a(a - 1) = 0 (d = 2),
    leaf window [0, 2^s).
    (S1) SHAPE, DERIVED: E1 and E2 each have total degree 4 in (u, digits);
    the twin has exactly TWO generators of degree 4 plus 3s field equations
    in 3s + 1 variables; one summation equation stays one equation
    (IDEA-20260830-84cdb7 claim C), so the binary cells D = 3, 4 have no
    literal twin; the first multiplier degrees are D = 5, 6, 7 and the first
    cross-generator (Koszul) cell is D = 8.
    (S2) SURVIVING SYZYGIES, DERIVED: Koszul syzygies survive (exact in every
    commutative ring); the n_q Frobenius syzygies f^2 = f of KN-FIND-006's
    generic baseline do NOT survive (in F_p[a]/(a^2 - a), f = a_1 + a_2 has
    f^2 = f + 2 a_1 a_2 != f because 2 is a unit); the field-equation
    relations are absorbed by the multilinear quotient. Hence the twin's
    generic baseline is Koszul ONLY: predicted generic rank at D < 8 equals
    the row count, and at D = 8 the row count minus one.
    (S3) THE BINARY MECHANISM IS ABSENT TWICE, DERIVED: ingredient (i), the
    identity P(1 + P) = 0 for affine P, needs P^2 = P, which fails in
    F_p[a]/(a^2 - a) for every affine P with at least two variables;
    ingredient (ii), a subset-sum of generators whose top-degree part
    cancels, is impossible because the degree-4 part of E1 contains
    x_1^2 x_2^2 (free of u) while the degree-4 part of E2 is u^2 x_3^2, so
    c_1 E1 + c_2 E2 has degree 4 for every (c_1, c_2) != (0, 0).
    (S4) TWO MECHANISMS. M1 (characteristic-2 artifact): deficit(D) =
    rows(D) - rank(Mac_D) - koszul(D) = 0 for all D <= 8, at every s, every p
    and every curve, matching the support-matched null within seed noise.
    M2 (chaining-graph property surviving the change of characteristic):
    deficit(8) = alpha s + beta with alpha != 0 over s in {3, 4, 5},
    p-independent, possibly with an s-independent constant deficit at some
    D in {5, 6, 7}. M3 (neither): a nonzero deficit not affine in s, or
    varying with p, reported as such.
    (S5) The s = 1 slice with general d IS IDEA-20260830-cb8e46's chained
    encoding J generator for generator, so the twin inherits cb8e46's
    IDEAL-level degeneracy at every s; only GENERATOR-level observables (the
    deficit measured here) can differ from the point set, and a nonzero
    deficit is never an ideal invariant.
  mechanism: >-
    TRACKED OBJECT: the degree-graded extra-syzygy vector deficit(D),
    D = 5..8, computed in the multilinear-in-a, free-in-u Macaulay matrix
    over F_p with cumulative multipliers (all m f_i with deg m <= D - 4), so
    that koszul(8) = 1 and koszul(D < 8) = 0. It is a genuinely lossy
    projection (a 5310 x 56751 matrix at s = 5, D = 8 collapses to four
    integers) compatible with degree increment (extra syzygies at D multiply
    into extra syzygies at D + 1). WHY THE TWIN AND NOT THE DIRECT DIGIT
    SYSTEM: 84cdb7's direct S_{m+1} has no internal node and cannot host a
    chaining-graph syzygy; the binary law lives on the chained tree (shared
    u), and only a chained twin can ask whether that law is about the tree
    or about characteristic 2. The twin adds exactly the free internal
    variable u and the second generator. WHY CHEAP: rows at D = 8 are
    2 sum_{j<=4} C(3s, j)(5 - j): 886 at s = 3, 2372 at s = 4, 5310 at
    s = 5; columns sum_{j<=8} C(3s, j)(9 - j): 2304, 12381, 56751. The
    deficit is bounded by the row count and is a small exactly computable
    integer. STRUCTURAL TELLS (docs/inventor-protocol.md section 3): a
    genuine chaining-graph deficit must be independent of p and must grow
    with s; a deficit constant in s and varying in p is the canonical
    artifact tell and is reported as suspected artifact before M2.
  assumptions:
    - >-
      p > 3, E non-singular, d = 2, 2^s <= p so digit representations are
      unique; planted targets (three window points on the curve, u and x_R
      by point addition) with certificates; no yield statement is read.
    - >-
      deficit(D) = rows(D) - rank(Mac_D) - koszul(D) under the cumulative-
      multiplier convention in the multilinear quotient; all ranks exact
      over F_p.
    - >-
      Null arms are generated by a frozen rule (uniform coefficients on the
      same support; or on the same variable sets and multidegree with u
      shared) and their realised degree distribution is reported.
    - >-
      The F_p Macaulay meter, extended with a free (non-squarefree)
      variable, has passed the p = 2 known answer against KN-FIND-006 under
      the same deficit convention (deficit(3) = 1, deficit(4) = 31 at
      n = 12, null 0) and the planted-syzygy positive control.
  proof_search_map:
    bottleneck: >-
      Whether the one measured structural deficit in this program's degree
      lane (8 dim V, binary) has a prime-field existence at all. If it does
      not, every argument that imports binary deficit structure to
      RQ-PFDR-ae2fba's degree column is void; if it does, the prime-field
      degree column has a candidate mechanism that is neither the CRT
      degeneracy nor the digit membership.
    baseline_embedding:
      parameter_slice: >-
        s = 1 with general d: the twin equals cb8e46's chained encoding J
        with the interval base V = [0, d), generator for generator. Second
        slice: the committed binary n = 12 system, on which the ported meter
        must return deficit(3) = 1, deficit(4) = 31, null 0.
      reproduction_check: >-
        Symbolic equality of the generator list at s = 1, d in {4, 8} with
        cb8e46's J; the graded ranks of that slice are RECORDED as a frozen
        fixture (no prime-field chained graded-rank instrument exists to
        compare against, per IDEA-20260903-399a18); exact reproduction of
        the KN-FIND-006 integers on the binary calibration arm. Any mismatch
        halts the line as an instrument finding.
    observation_collision:
      observable: >-
        The vector (deficit(5), ..., deficit(8)) per cell and its fitted
        s-slope at D = 8.
      distinct_preimage_search: >-
        REQUIRED. (a) NULL-SUPPORT and NULL-TOPOLOGY arms: distinct ground
        truths with the same observable would mean the deficit is a property
        of sparse chained multilinear systems, not of Semaev polynomials.
        (b) The non-curve cubic: the S_3 formula at the coefficients of a
        singular Weierstrass cubic; a matching deficit means the effect is
        about the S_3 formula, not the curve. (c) Two curves at the same p
        with different j must give the same deficit under M2; a
        curve-dependent deficit is M3.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the chaining graph fixed and vary the characteristic: the
          binary descended system (k = dim V) against the prime-field digit
          twin (s digits). The intrinsic invariant distinguishing them is
          the pair of identities (S2)-(S3).
        predicted_gain: >-
          Converts 'is the binary deficit transferable' into one of three
          pre-registered integers per s.
      - transform: representation_reduction
        proposed_object: >-
          The chained tree with digit leaves is 84cdb7's digit presentation
          with one internal free node added; encoding exact, completeness
          exact, soundness by post-filtering on f(x) square, cost loss the
          extra variable u.
        predicted_gain: >-
          A presentation on which a chaining-graph syzygy CAN exist.
    quantifier_order: >-
      M1 as claimed: FOR ALL p > 3 in the tested set, FOR ALL curves and
      planted targets in the tested families, FOR ALL s in {3, 4, 5}, FOR
      ALL D <= 8, deficit(D) = 0 within the null's seed spread. M2 as
      claimed: THERE EXIST alpha != 0, beta such that FOR ALL tested p and
      curves, deficit(8) = alpha s + beta at s in {3, 4, 5}. The vacuous
      reading FOR ALL cells THERE EXISTS an affine fit is excluded by
      requiring the slope CI to exclude 0 AND the p-ladder and curve spread
      to sit inside the null band.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the tested (s, p, curve) ladder, the prime-field digit twin of
        the chained t = 3 Semaev system has extra-syzygy dimensions
        deficit(5..8) equal to [values], against nulls at [values].' It can
        never certify anything about D > 8, m > 3, the solving degree or
        its cost (IDEA-20260806-7ea402), yield, or cryptographic scale.
      nearby_object_control: >-
        The binary system at k = s, where the deficit is KNOWN nonzero
        (8k - 1 at D = 4); the support-matched null, where it is known
        zero. A meter that cannot separate those two may not report a twin
        value.
    proof_obligations:
      - claim: >-
          E1 and E2 have total degree 4 in (u, digits) and their degree-4
          parts have disjoint digit supports, so no subset-sum degenerates.
        responsibility: correctness
      - claim: >-
          f^2 != f in F_p[a]/(a^2 - a) for f = a_1 + a_2, so the Frobenius
          syzygy has no analogue and the generic baseline is Koszul only.
        responsibility: correctness
      - claim: >-
          The s = 1 slice reproduces cb8e46's chained J exactly.
        responsibility: baseline
      - claim: >-
          Row and column counts per cell are as tabulated and every cell
          stays under the declared column and memory caps, checked by
          pre-flight.
        responsibility: memory
      - claim: >-
          The ported meter reproduces KN-FIND-006's integers on the binary
          calibration arm under the same deficit convention.
        responsibility: interface
      - claim: >-
          Nothing beyond the tested ladder is claimed.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        KOSZUL-GENERICITY OF THE SUPPORT-MATCHED NULL. For uniformly random
        polynomials on the twin's supports, the products E_i m with
        deg m <= D - 4 are linearly independent in the multilinear-in-a,
        free-in-u quotient for D <= 7 and have exactly one dependency (the
        Koszul pair) at D = 8, uniformly over s in {3, 4, 5} and p >= 2^12.
      random_model_justification: >-
        Rigorous: the Koszul syzygy is exact and is the only trivial syzygy
        of a two-element sequence in a commutative ring; the field-equation
        relations are absorbed by the quotient. Classical distribution
        imitated: Froberg / Bardet-Faugere-Salvy semi-regularity -- a
        generic sequence has only the trivial syzygies degree by degree. The
        Boolean version needs the Frobenius correction; by (S2) the
        prime-field multilinear version does not, and that difference is
        itself what HEUR-001 checks.
      supporting_results:
        - ref: KN-FIND-006
          provenance: internal
          claim: >-
            The binary generic degree-4 baseline is exactly n_q Frobenius
            plus C(n_q, 2) Koszul pairs; the support-matched null is exactly
            0; deficit(3) = 1 and deficit(4) = 8k - 1.
          verified_by: coordinator, TASK-20260903-b5d2ae (finding read in full)
        - ref: IDEA-20260903-cf63ad
          provenance: internal
          claim: >-
            (S2): which generic syzygies survive the change of
            characteristic; H1 as stated here.
          verified_by: coordinator, TASK-20260903-b5d2ae (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-20ee58
      falsification_condition: >-
        A nonzero NULL-SUPPORT deficit at some D <= 8 at p >= 2^12 in more
        than the small-p rank-drop budget of EXP-PFDR-fd901a; the
        Koszul-only baseline or the meter is then wrong and no twin value is
        read.
    - id: HEUR-002
      formal_statement: >-
        STRUCTURAL-BETTI READING. A genuine chaining-graph deficit is
        deterministic in dimension, independent of p and of the curve at
        fixed s, and affine in s at fixed D = 8 over the tested range.
      random_model_justification: >-
        Rigorous ingredient: KN-FIND-006 records the binary deficit as
        exactly closed-form in k with a deterministic dimension and its null
        exactly 0. Classical statement imitated: graded Betti numbers of a
        structured ideal are constant under generic coefficient
        specialisation. The heuristic content is that the same reading
        applies to a prime-field twin at all; the p-ladder is where it is
        tested.
      supporting_results:
        - ref: KN-FIND-006
          provenance: internal
          claim: >-
            deficit(4) = 8k - 1 exact for k = 3..7 with null 0.
          verified_by: coordinator, TASK-20260903-b5d2ae (finding read in full)
      validation_experiment_ids:
        - EXP-PFDR-20ee58
      falsification_condition: >-
        A nonzero SEM deficit whose spread across curves at fixed (s, p) or
        across p at fixed s exceeds the null's seed band (M3 / artifact),
        or whose fitted s-slope interval contains 0.
  structural_ingredients:
    - description: >-
        The Boolean identity P(1 + P) = 0 for affine P and its failure in
        F_p[a]/(a^2 - a); the disjoint top-degree supports of E1 and E2.
      citation: IDEA-20260903-cf63ad (S2)-(S3); KN-FIND-006; experiments/EXP-DREG-001/DREG_DEFICIT_CLOSED_FORM.md
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (cf63ad and KN-FIND-006 read in full; the closed-form note as cited by cf63ad, not reopened)
      role: the derivation that the binary mechanism has no F_p analogue
    - description: >-
        The chained encoding J over F_p with a free internal node and its
        ideal-level CRT degeneracy.
      citation: IDEA-20260830-cb8e46
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (as cited in cf63ad and RQ-PFDR-ae2fba; not reopened)
      role: the s = 1 baseline embedding and the reason only generator-level observables can move
    - description: >-
        The topology-matched null over GF(2) for the binary chained system.
      citation: IDEA-20260808-11b8c7
      provenance: internal
      verified_by: coordinator, TASK-20260903-b5d2ae (as cited in cf63ad; not reopened)
      role: the NULL-TOPOLOGY arm carried to F_p
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement is a control between
      two mechanisms for a measured binary law; a nonzero deficit is a
      mechanism finding whose cost image is zero unless the solve bit flips
      (IDEA-20260806-7ea402).
    corollaries: []
  predictions:
    - metric: >-
        P1 -- deficit(D) on NULL-SUPPORT at every cell, D in {5, 6, 7, 8}
      direction: different
      minimum_effect: >-
        Exactly 0 for every seed (forced by the Koszul-only baseline, up to
        the small-p rank-drop budget); any nonzero value beyond that budget
        voids the run set.
    - metric: >-
        P2 -- deficit(3), deficit(4) of the ported meter on the binary
        n = 12 calibration arm
      direction: different
      minimum_effect: >-
        Exactly 1 and 31 with null 0; a miss blocks every prime-field
        number.
    - metric: >-
        P3 -- deficit(D), D in {5, 6, 7}, on SEM at s in {3, 4, 5}
      direction: different
      minimum_effect: >-
        M1 predicts 0 at every cell. An s-INDEPENDENT positive constant at
        some D across all three s and all p is the analogue of deficit(3) =
        1 and reads as M2's constant term; a value varying with p at fixed s
        is an artifact.
    - metric: >-
        P4 -- deficit(8) on SEM minus deficit(8) on NULL-TOPOLOGY, fitted
        against s in {3, 4, 5}
      direction: different
      minimum_effect: >-
        M1: all three residuals 0 within the null seed spread (honest prior
        0.75). M2: slope CI excluding 0 with residuals p-independent within
        spread (prior 0.10). M3: nonzero but slope CI containing 0 or
        residuals inconsistent across p. With three s points the resolution
        is one integer per point; an interval spanning two branches is
        reported unresolved.
    - metric: >-
        P5 -- generator list at (s = 1, d = B) against cb8e46's chained J
      direction: different
      minimum_effect: >-
        Forced symbolic identity; a single mismatch halts the line.
  test_boundary:
    instances:
      - >-
        d = 2, s in {3, 4, 5}, p in {4099, 16411, 65537}; 6 curves of
        generic j per p; planted targets with certificates; D in {5, 6, 7,
        8}; s = 6 at D <= 6 only; (s = 6, D = 8) excluded by name
      - >-
        binary calibration arm: the committed GF(2) chained system at
        n = 12 (k = 4), from the EXP-DREG-001 builder
      - >-
        s = 1 slice, d in {4, 8}, symbolic against cb8e46's J
    parameters:
      D_range: '5..8'
      arms: 'SEM (the twin); NULL-SUPPORT; NULL-TOPOLOGY; non-curve cubic'
      column_cap: '60,000 columns; 4 GiB dense-equivalent working set; pre-flight abort'
      deficit_convention: 'cumulative multipliers, deg m <= D - 4, multilinear-in-a, free-in-u'
    implementation: >-
      The F_p port of experiments/EXP-SBRG-60c55e/driver/macaulay.py
      extended with a free variable and the cumulative-multiplier deficit
      convention, calibrated on the binary n = 12 system (KN-FIND-006) under
      the same convention and on the planted-syzygy positive control.
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 80
      maximum_memory_gb: 16
      maximum_runs: 60
  falsification_conditions:
    - >-
      F1. Stage 0 finds a subset-sum of E1, E2 whose degree-4 part cancels,
      or an affine P in F_p[a]/(a^2 - a) with P^2 = P and at least two
      variables: (S3) is wrong and the hypothesis is superseded.
    - >-
      F2. NULL-SUPPORT shows a nonzero deficit at some D <= 8 beyond the
      small-p budget: the Koszul-only baseline or the meter is wrong;
      nothing else is read.
    - >-
      F3. The binary calibration arm does not return 1 and 31: the port is
      broken.
    - >-
      F4 (expected). All SEM residuals are 0 within spread at s in {3, 4,
      5}: M1. The binary 8 dim V law is a characteristic-2 phenomenon at the
      tested cells and cannot be imported to RQ-PFDR-ae2fba's degree column;
      the obstruction is named (Frobenius-linearity of squaring and the
      Boolean idempotent law, both absent).
    - >-
      F5. Residuals at D = 8 fit alpha s + beta with alpha's CI excluding 0,
      p-independent: M2. A chaining-graph syzygy exists over F_p; a
      mechanism finding, not a cost finding.
    - >-
      F6. Nonzero residuals constant in s or varying with p: artifact or M3;
      reported with the tell that fired.
    - >-
      F7. A memory or time stop on any cell is failed_infrastructure and
      never evidence.
  interpretation_limits:
    - >-
      No attack, no exponent, no security claim; a control between two
      mechanisms for a measured binary law.
    - >-
      Toy tier: p <= 2^16, s <= 5 at D = 8, m = 3, d = 2; nothing at
      cryptographic scale and no extrapolation in s.
    - >-
      A nonzero deficit is a property of a generating set; the ideal is a
      point set by cb8e46 and the deficit's cost image is zero unless the
      solve bit flips.
    - >-
      M1 at the tested cells closes the import of the binary deficit into
      the prime-field degree column, not KN-OPEN-002.
