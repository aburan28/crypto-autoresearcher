  title: >-
    On y^2 = x^3 + x + 1 over F_17, the chord through (0, 1) and (4, 1)
    meets the curve again at (13, 16), and the sum of the first two points
    is (13, 1).
  statement: >-
    The three points (0, 1), (4, 1), and (13, 16) lie on
    y^2 = x^3 + x + 1 over F_17 and are collinear. The chord-and-tangent
    sum of (0, 1) and (4, 1) is (13, 1), the negation of (13, 16). The
    triple (0, 1), (4, 1), (0, 16) is not collinear.
  mechanism: >-
    A line through two points of an elliptic curve meets the curve in a
    third point, and the three sum to the identity. This is the elliptic
    control in the proposal. It is not an incidence-search benchmark.
  assumptions: []
