# H-ENDO-5a33ae
# Isogenous-model screen for IDEA-20261016-15a6fc. Modelled operation
# counts for a known-scalar k*P only; no timing and no ECDLP claim.
hypothesis:
  id: H-ENDO-5a33ae
  question_id: RQ-ENDO-476761
  goal_id: GOAL-ENDO-001
  source_idea: IDEA-20261016-15a6fc
  added: '2026-10-16'
  status: approved
  status_history:
    - {status: specified, at: '2026-10-16', by: coordinator}
    - {status: approved, at: '2026-10-16', by: coordinator, decision: DEC-20261016-5cd7e2}
  approved_by: coordinator
  approval_decision_id: DEC-20261016-5cd7e2
  statement: >-
    Arm M. At least one verified deployed prime-field population curve, after
    a model change on a rational ell-isogenous neighbour, has a modelled
    one-shot k*P cost that is lower than the best model on E itself. The cost
    charges the forward chain, the dual chain, the model maps and the scalar
    adjustment. It is computed at S = 1 M, and E's own unit-endomorphism GLV is
    part of E's baseline. The route must pass point verification.
    Arm A. No population curve whose own root is not a j = 0 or j = 1728
    crater has |D_K| <= 20. So volcano ascent to a cheap-endomorphism crater
    gives nothing on deployed curves.
  arms:
    M: >-
      Model change. BFS over rational ell-isogenies. Price the cheapest model
      on every node (a = -3 class, twisted Edwards where 4 | #E). The gain is
      measured against the best model on E.
    A: >-
      Volcano ascent. D_K and f_pi from t^2 - 4p, certified up to
      |D_K| <= 2^20. The unit 2-GLV is priced on every j = 0 or j = 1728
      crater that the walk reaches.
    C: >-
      Isogeny-cycle GLV. This is restated as a dominated control
      (harness/endosweep/README.md, "isogeny-cycle pump"). It is not run by
      EXP-ENDO-25ad84.
  mechanism: >-
    The identity is k P = phi_hat(k' phi(P)) with k' = k d^-1 mod n.
    #E is an isogeny invariant, so a prime-order curve can never reach a
    Montgomery or Edwards model. On such a curve only the a = -3 class (that
    is, -3/a' is a fourth power) and the conductor can change along an edge.
  test_boundary:
    instances:
      - verified prime-field curves from harness/endosweep/targets.py deployed_targets()
      - verified prime-field curves from std-curves @77fe6e3585ca2c2225b59d7df24b7c775437276f
      - the two constructed controls of EXP-ENDO-25ad84
    parameters:
      max_bits: 521
      ells: [2, 3, 5, 7, 11, 13]
      depth: 2
      max_nodes_per_curve: 64
      disc_bound: 1048576
      samples_per_cost: 200
      verify_scalars: 8
      seed: 20261016
      cost_columns: [S = 1 M primary, S = 0.8 M sensitivity]
    implementation: harness/endosweep/isomodel.py via experiments/EXP-ENDO-25ad84/implementation/run.py
    budget:
      wall_clock_seconds: 10800
      memory_gb: 2
      maximum_runs: 1
  distinguishable_outcomes:
    - >-
      The controls and the instrument check pass. At least one population
      curve has a verified best route with one-shot gain > 0 at S = 1 M.
      Arm M is positive at the modelled tier.
    - >-
      The controls pass. Some population curve has persistent gain > 0, but
      every one-shot gain is <= 0. Arm M is rejected for one-shot k*P in this
      scope, and the persistent rows are reported separately.
    - >-
      The controls pass and no population curve has persistent gain > 0.
      Arm M is null in this scope.
    - >-
      The ascent control passes and no non-crater population curve has
      |D_K| <= 20. This supports the zero-hit prediction of arm A. A single
      such curve refutes it.
    - >-
      A control or the instrument check fails. The dependent arm is
      indeterminate. This is an instrument alert, not evidence.
  falsification: >-
    With the controls and the instrument check passing, every population
    curve's best route has one-shot gain <= 0 at S = 1 M. For arm A, a
    non-crater population curve with |D_K| <= 20 falsifies the zero-hit
    prediction.
  proof_search_map:
    not_applicable_reason: >-
      Not proof-oriented. This is a modelled cost measurement with routes
      verified on points.
  interpretation_limits:
    - These are modelled counts, not timings. A gain makes the route a candidate for a timed comparison (bench skill) only.
    - Known-scalar cost is not ECDLP cost, and no rho or ECDLP figure moves.
    - Results are scoped to the listed curves, ells, depth, node cap and cost model. There is no transfer to other models, to fixed-base k*P or to constant-time complete formulas.
    - The idea's heuristics H1-H3 are not validated by this contract. The depth-1 a = -3 neighbour fraction is descriptive only.
  not_claimed: >-
    No exponent, no ECDLP or rho cost, no wall-clock speedup, and no claim
    about curves or models outside the boundary.
