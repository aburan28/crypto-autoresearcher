        "minimum_effect": "[Z^{2r} : W_r] = N exactly, for every tested r in {1, 2, 3, 4} and every tested instance, computed as the Smith normal form / Hermite normal form index of the explicitly constructed lattice. Any instance with index strictly less than N falsifies C1 and is a scoped positive requiring independent review.",
        "source_prediction": 1,
        "qualification": "Unit coefficient and correct subgroup/eigenvalue prerequisites are checked. A mismatched index is quarantined for independent arithmetic audit before scientific interpretation."
