      {
        "metric": "mitm_group_operations_over_sqrt_N_versus_r",
        "direction": "higher",
        "minimum_effect": "Measured meet-in-the-middle cost of finding a witness in W_r, divided by sqrt(N), is non-decreasing in r and grows at least like 2^{r-1} between r = 1 and r = 4, with the r = 1 value within a factor 2 of 1. A ratio that DECREASES with r at any tested size falsifies the neutrality claim and is the single most informative possible outcome of this record.",
        "source_prediction": 2,
        "qualification": "The source005 threshold is r4/r1>=8, distinct from source008/shared threshold4. Score ordinary endpoint, useful endpoint and complete pass separately. A finite nonmonotone constant is not a universal exponent counterexample."
      },
      {
