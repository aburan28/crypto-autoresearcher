    "title": "Finite exit-map and witness tests with full cover index-calculus costs",
    "statement": "Test all original witness, distribution, cover and census predictions with exact finite interfaces and complete costs; determine which finite assertions survive their controls without treating source closure claims as facts.",
    "mechanism": {
      "shared": "Use exact shared_component and methods.kernel/minima/MITM/random_sublattice/rho/BSGS/H1_census/H1_certification/H1_statistics from the pinned source specification. The summary below is explanatory; exact pinned source wins if wording differs. Consume archived common16/20/24-bit results, and matching28/32-bit fixtures/counts where applicable, only through verified future archive TASK-20260908-4cbaa8. Do not remeasure identical cell/method/input hashes. Add12-bit cells under the identical law. Full CDF and additional count radii are distinct consumer work. A missing source result blocks the dependent cell; it does not license silently replacing the source experiment.",
      "shared_summary": "The pinned ENDO-SHARED-v1 law fixes the SHA256 domains, actual p-bit bands, pool of128 primes by64 curves, largest prime subgroup N>=2^(bits-4), and verified point/eigenvalue action. J0 uses [id,phi,phi^2,id]; J1728 uses [id,psi,-id,-psi]; GEN has primary r1 and repeated identity/Frobenius controls at higher r. Independent map rank is distinct from map count. The exact pinned shared specification governs the public/private interface and every algorithm detail.",
      "distribution": "Primary exhaustive algorithm at each distinct N from field12/16/20: enumerate every signed integer pair in [-R,R]^2, R=ceil(sqrt(N)), excluding zero. For b not congruent0 mod N assign k=-a*b^(-1) mod N and, if k in1..N-1, update the minimum norm and lexicographically first witness in its histogram slot. Include b=0 multiples of N explicitly; no primitive-pair restriction. Enumerate pairs in increasing maxnorm then a then b, so the first update is exact. Independently certify every k using signed-offset floor_sum count at h=minimum-1 and replay the witness at minimum. For sampled24/28/32 cells, the primary exact solver enumerates b=1..R, computes the least-absolute residue a=-k*b mod N, evaluates max(abs(a),b), includes the opposite pair and b=0 candidate(N,0), and chooses the least norm/lexicographic witness. Every minimizing vector has |b|<=R; ties between residue representatives are retained. This is O(sqrt(N)) per sampled scalar, not a hidden DLP solve. Check all sampled minima with the independent floor_sum checker. Normalize by sqrt(N). The exact census has no iid p-value; sampled CDFs receive Wilson95% intervals.",
      "finite_count_comparison": "For integer h=floor(X)<N, the all-k mean nonzero witness count is4*h^2/(N-1), because each pair with nonzero a,b in the box determines exactly one nonzero k. Axis multiples are accounted separately outside this range. Enumerate all N+1 projective coefficient lines over F_N as a separate finite uniform index-N ensemble, including both axis charts. Compare exact finite incidence formulas separately with the Haar/Siegel square area4*X^2/N. Score the source ceiling4*epsilon^2+3/sqrt(N) at epsilon.05/.1/.2/.4 using exact integer inequalities; the finite ensemble is not Haar by definition.",
      "Haar_sampler": "Independently sample100000 unimodular plane lattices using the standard modular fundamental domain: draw x uniformly[-1/2,1/2], y0=sqrt(1-x^2), accept x with probability (sqrt3/2)/y0, then draw u uniformly(0,1) and set y=y0/u; draw theta uniformly[0,pi). Basis columns are rotation(theta)*( (1/sqrt(y),0), (x/sqrt(y),sqrt(y)) ). Joint density is proportional dx dy dtheta/y^2 and normalization integral int[-1/2,1/2] dx/sqrt(1-x^2)=pi/3 is checked. Uniform reals are deterministic infinite bitstreams from SHA256 domain EXIT-HAAR-v1/seed271828/sample/tag/counter; interval arithmetic refines comparisons to decide acceptance and bounds, rather than using an arbitrary truncated tail. The first basis vector supplies Euclidean candidate normC=1/sqrt(y); every vector with infinitynorm<=C has Euclidean norm<=sqrt2*C, so enumerate all integer n with |n|sqrt(y)<=sqrt2*C and all m with |m+n*x|/sqrt(y)<=sqrt2*C, excludingzero. Interval arithmetic at128,256,... bits determines shortest supnorm to absoluteerror<=1e-8; include numericaluncertainty. Minkowski bounds the true minimum by1, permitting95% Hoeffding error sqrt(log40/(2*100000)) plus numericalbound on the reference mean. Compare exact mean(lambda/sqrtN) against this independently measured Haar mean with source5% relative tolerance and reference uncertainty. This is a new explicitly defined Haar-minimum comparison, not a formula supplied by Siegel. Report original undefined Siegel-minimum attribution as corrected. Point-count area is the distinct theorem observable; do not apply finite-variance standard errors to unbounded cusp point counts. The confidence statement uses the preregistered iid Haar random model implemented with deterministic SHA256 pseudorandom bitstreams; it is not a deterministic discrepancy bound for this seed. Numerical interval error is separate from sampling error.",
      "tail": "Report the minimum, every k attaining it and the complete count histogram. For prime N>2 in the nonzero-k census, minimum1 occurs exactly at k=1 and k=N-1, as checked by enumerating the eight nonzero norm1 pairs. Compare the source O(1) tail intuition with this exact finite control. Include corrupted controls that count the zero vector or normalize by p instead of N; those must be identified.",
      "cover_construction": "For every frozen GEN curve E:y^2=x^3+a*x+b and seed, hash-sample monic A of degree d with B=1 for POLY-d1/d2/d3, or monic B of degree d-1 for RAT-d2/d3. Accept the first eligible of128 candidates. Require gcd(A,B)=1, squarefree F=B*(A^3+a*A*B^2+b*B^3), actual degree3d for POLY or4d-1 for RAT, and exact genus floor((degree(F)-1)/2). Define C:Y^2=F(t) and pi(t,Y)=(A/B,Y/B^2). POLY-d1 is a genus1 isomorphism calibration; POLY-d2 has degree6/genus2; POLY-d3 has degree9/genus4; RAT-d2 has degree7/genus3; RAT-d3 has degree11/genus5. Verify connectedness, constant field Fp, irreducibility of A(t)-x*B(t) over K(E), and at least one rational place for the RR interface. Record all singular, wrong-degree, disconnected or otherwise rejected candidates and their full selection costs. No degree4 substitution or approximate genus. Exclude the verified degree1 calibration from the genus2-5 slope tests.",
      "divisor_maps": "Construct the exact tower K_E=F_p(x)[y]/(y^2-f(x)), K_C=K_E[t]/(A(t)-xB(t)), and verified isomorphism toF_p(t)[Y]/(Y^2-F(t)) withY=yB^2. Pull back a placeP as sum_{Q|P} e(Q/P)Q, computing allQ by relative place decomposition, e=v_Q(embedded localuniformizerofP), f=degree(Q)/degree(P) sinceconstantfieldFp. Absolute rational-base RamificationIndex/InertiaDegree values are not substituted forrelativecover indices. PushforwardQ=f(Q/P)P. Include everyfinite/pole/infinity place, inseparablecandidate rejection and sums e*f=d. Verify principaldivisorpullbacks and NormConorm=d on degreezero divisors. ForT∈E(Fp), pi*(T-O_E) is literal differenceof complete fibers, notpi*(T)-d*an arbitrarilychosen infinity. Verifygcd(N,d)=1, [N]pi*(P)=0, pi*(P)!=0, and1000random subgroup pairs witha principalfunction certificate of homomorphism equality. Pushforwardpullback equals[d] on originals; independent checker verifies functions/valuations and originalpoint identity.",
      "RR_arithmetic": "Use exact function-field divisors and RiemannRochSpace in locked Magma V2.29. Choose the first rational place by the frozen infinity-first canonical encoding and explicitly record every infinity place; an even-degree genus2 model need not have a rational Weierstrass point. For degree-zero D, find the smallest e=0,...,g such that L(D+e*O_C) is nonzero. Enumerate nonzero sections modulo Fp* by normalizing their first nonzero basis coefficient to1. For each section s compute the effective divisor E=D+e*O_C+div(s), choosing the lexicographically least effective divisor by sorted canonical place/multiplicity list. Store E-e*O_C and s as the class representative/certificate. Every equivalent D has the same set of effective representatives, so the canonical choice is class-invariant. Addition and binary scalar multiplication reduce exact divisors by this rule. All section enumeration, place factorization and arithmetic costs are charged. No odd-degree Cantor replacement is used for the even-degree arm; no constant-field-extension conorm API is treated as a general cover pullback.",
      "jacobian_order": "Compute the exact characteristic polynomial of Frobenius L_C(T) using the locked Magma V2.29 curve/function-field ZetaFunction/LPolynomial intrinsic; record the actual intrinsic, options and underlying algorithm selected by that fixed build. Check integral degree2g and functional equation, set J=L_C(1), factor J with proof certificates, set e=v_N(J), M=N^e, c=J/M. Independently obtain direct point counts over Fp and Fp^2 at the small control fields and compare zeta coefficients. No approximate point count or heuristic order is allowed. All order/factoring work is charged; unavailable intrinsic or incomplete certificate is an operational prerequisite failure, not scientific evidence. Primary projection and modular arithmetic are specified separately. No class-group logarithm map is called.",
      "projection_arms": "Primary N-primary arm: compute exact J=#Jac(C)(Fp), e=v_N(J), M=N^e and c=J/M; gcd(c,N)=1. Project every factor-base class and both transported targets by [c]. All projected classes are annihilated by M, while projected input has exact order N. Integer row arithmetic is modulo M, not N unless e=1. Secondary norm arm when #E=h_E*N and gcd(h_E*d,N)=1: T(D)=pi^*([h_E]pi_*(D)); verify T(pi^*P)=[h_E*d]pi^*P and exact N-order. Project every factor-base row, set M=N. Independently verify all relative norm/conorm certificates. Include direct elliptic pi_*(D) relation and rho/BSGS comparator to expose simplification. Empty applicability gate is unavailable for that arm; no whole-Jacobian cyclicity assumed.",
      "IC_factor_base": "Enumerate all rational places of C except O_C, including other infinity places; store class P-O_C with exact RR representation. Full arm uses every such place. For g>=2 double-large-prime arm takes min(total,floor(p^(1-1/g))) places by SHA256 rank of canonical place encoding, remaining degree-one places are large primes. No involution quotient without its divisor offset; this protocol uses both points. Genus1 identity calibration uses the full arm only. Construct and hash all projected factor-base classes, charging projection and storage. No class-group DLP or precomputed logarithm oracle.",
      "IC_relations": "For each cover/arm/projection, sample exactly 200*max(1,B) independent alpha uniform in [0,N-1], in blocks of20*max(1,B), where B is factor-base size. Compute alpha*D_P for raw transported D_P, canonical RR-reduce before projection and factor effective divisor. Record degree, multiplicities and the principal-function certificate alpha*D_P=sum v_P*(P-O_C). A full smooth divisor gives a relation; the double-large-prime arm admits at most two distinct outside-base places with their full multiplicities. Alpha=0, duplicate classes/relations, failures and all attempted masks remain in denominators. Project the certified relation only after raw decomposition, retaining alpha. The transported subgroup is not assumed uniformly distributed in the entire Jacobian.",
      "IC_large_primes": "Use exact sparse elimination of the large-prime coefficient columns over Z/M, with the graph of at most two large-prime vertices per row as a sparsity index. Attach an integer combination vector to each eliminated row. Prefer lexicographically first unit pivot; when none exists, use integer Smith normal form on the augmented modular matrix [A | M*I] with exact unimodular transforms. Emit only combinations with every large-prime coefficient divisible by M. These are weighted cycles, not XOR graph cycles; odd cycles and nonunit multiplicities retain their exact modular effect. Re-evaluate emitted relations as divisor classes. Keep graph vertices, edges, connected components, dependence and emitted-row ranks separately. Matrix convention: rows are collected relations. If L is the R-by-ell large-prime coefficient matrix, compute the integer kernel of [L^T | -M*I_ell]; the first R coordinates of each kernel generator give a certified modular row combination. Target large-prime elimination solves the corresponding affine integer system using Smith transforms. Deterministic pivot order is increasing place key then row index. No nonunit is inverted.",
      "IC_linear_algebra": "Build sparse projected factor-base rows with known scalar alpha. When M=N, use lexicographic sparse row echelon over F_N with combination certificates. When e>1, compute integer Hermite/Smith transforms for the module generated by relation rows and M times coordinate unit vectors. Decide exact target-row membership in that module, returning coefficients; do not substitute a field-N rank for a Z/N^e module test. Verify every claimed row combination coefficient-wise mod M and by exact divisor-class equality. A zero projected divisor relation with nonzero alpha mod N is an invalid arithmetic certificate because D_P has exact order N. Rank-deficient output after the fixed sample count is a valid finite relation-yield outcome. For B factor-base columns and relation matrix V with R rows, target membership solves [V^T | M*I_B]*(lambda,z)=w^T over integers; exact Smith transforms decide solvability and return a solution, with free coordinates set0 in Smith coordinates. All transform matrices and residuals are serialized/hash-bound. Sparse field elimination is an optimization only when M is prime and must return the same checked membership certificate.",
      "IC_descent": "For each of20 independently sampled target scalars s (checker-only), set raw D_Q=pi^*([s]P-O_E). For at most10000 independent masks u in[0,N-1], reduce raw D_Q+[u]D_P and factor. Accept full-smooth or large-prime rows whose large primes can be eliminated using the precomputed graph/module, then test target row membership in projected base-row module. If v_target=sum lambda_i*v_i mod M, recover s_hat=sum lambda_i*alpha_i-u mod N. Verify [s_hat]P=Q on original E and [s_hat]projected D_P=projected D_Q. Stop on first verified scalar per target; after10000 masks record descent_or_rank_incomplete and exact missing module invariants. No BSGS fallback may be counted as IC success.",
      "IC_fits": "Report raw CPU, wall time, prime-field operations, RR calls, factorization, place decomposition, group additions, norm/conorm, zeta/factorization, sparse/Smith elimination and peak resident/disk bytes. Convert to elliptic-addition equivalents only with a same-field measured calibration of10000 additions and report raw units beside it. Cold cost includes fixtures, all rejected cover candidates, maps, order/projection, factor base, relations, linear algebra and all target descents; amortized cost divides reusable preprocessing by exactly20 targets. Fit log measured total successful-solve cost versus log p per actual genus and declared algorithm across >=3 complete field sizes; also fit versus log N, publish standard error, seed bootstrap10000 resamples and leave-one-size-out fits. Partial/censored cells receive no invented runtime. Compare fastest complete member of the declared portfolio, never label it globally best available. A fit below0.85 violates the source finite predicate; below0.5 is a follow-up lead only, not an asymptotic lower-bound contradiction.",
      "E1_fixtures": "For each actual field-bit band12/16/20/24 and seed1..5 enumerate odd v with p=(1+163*v^2)/4 in the band in a SHA256-seeded permutation; search the entire finite v range. Require p prime, compute HilbertClassPolynomial(-163) mod p, construct the j curve and its quadratic twist, and select an actually counted curve with #E=p. Verify discriminant and cardinality; unavailable if no candidate, never assume CM trace. Choose uniform nonzero P and20 uniform nonzero target scalars. P-bit and subgroup-bit labels remain separate. For j neither0 nor1728, use a=3*j/(1728-j), b=2*j/(1728-j), then quadratic twist by the least nonsquare. If a CM j is0 or1728 use the complete sextic/quartic twist list and exact point counts; no division by a zero denominator or assumed twist order.",
      "E1_formal_log": "For each fixture try16 coefficient lifts a+p*A,b+p*B in seeded order. Lift each input point by fixed residue x and Hensel y to the same curve, handling y=0 explicitly; compute [p] of each lift. In the formal neighborhood use t=-x/y and psi(R)=t([p]R_lift)/p mod p. Start p-adic precision4, then6 then8; require certified residues stable under the next precision and psi(P)!=0. A lift with zero psi(P) is retried and charged, not divided by zero. Recover s=psi(Q)/psi(P), verify original scalar and1000 random-pair additivity checks with independent finite-field arithmetic. All lift, scalar multiplication and precision costs charged. Exhausted lifts/precision is unavailable, not a negative against the anomalous attack. Actual speed versus rho is measured; no modeled operation placeholder. Fix coefficient-lift A,B uniform in[0,p-1] for each lift counter; Hensel y selects the unique root reducing to the input y. Precision acceptance uses equal certified residues at4/6 or6/8 only; instability through8 is precision_unavailable. For O define psi(O)=0. Add the published Smart1997 F43 calibration E:y^2=x^3-4*x^2-128*x-432,P=(0,16),Q=(12,1),m=10: retain the generalized Weierstrass coefficients or apply a recorded exact x-translation to short form, verify the original points and scalar before checking the lift ratio. The prose swap in the source is not copied into the algorithm. This calibration is additional to every12/16/20/24-bit fixture.",
      "E2_fixtures": "Actual p-bit bands12/16/20/24, kappa1/2/3/4/6, seeds1..5. For each N-bit band max(4,floor(bits/2)-2)..floor(bits/2), take the first128 primes from the seeded initial candidate requiring N>7 and N=1 mod lcm(kappa,12). Choose first seed-ordered primitive kappa-th root z mod N (z=1 for kappa1); t0=z+1, roots y0 of3*y0^2=-(t0-2)^2 mod N. For u,v in[-128,128] in seeded order form t=t0+u*N,y=y0+v*N and p=(t^2+3*y^2)/4, requiring integer prime p in the declared p-bit band, H=p+1-t divisible N and exact ord_N(p)=kappa. Construct all six j0 sextic twists and count exactly, accepting first with order H. Retain actual p,N,H,t,y and all search costs. Cocks-Pinch-sized p is never relabelled N bits. Empty finite construction pool means unavailable cell, preserving that source panel obligation.",
      "E2_pairing": "For H=N^e*c choose uniform R, first project[c], then multiply by N until exact order N is reached; reject zero. This avoids H/N annihilation when N^2 divides H. Build F_(p^kappa) by lexicographically first irreducible monic polynomial, charging the search. For up to4096 uniform T on E over that extension, compute zeta=ReducedTatePairing(P,T,N) with Miller functions and final exponent (p^kappa-1)/N; require zeta!=1 and zeta^N=1. Do not substitute a raw Tate coset or assume an independent N-torsion partner. Compute eta from Q and solve eta=zeta^s by exact multiplicative BSGS in order N, verify original E scalar and1000 pairing additivity pairs. Charge extension construction, pairing, inversions, exponentiation, FFDLP and output checks. A small embedding degree does not guarantee measured toy speed below rho; preserve the source speed predicate as a measurement, separate from positive-control correctness.",
      "H2_embedding_degree": "Use the shared GEN curve-generation law extended to field bits16/24/32/48 and seeds1..100, with all rejected candidates counted. For N!=p factor N-1 with proof certificates, reduce exponent N-1 by each prime factor while p^(e/l)=1 mod N to obtain exact ord_N(p). If factorization is incomplete report certified bounds/unknown, not large degree or no exit. Compare normalized log(order)/log N with10000 uniform nonzero residues per curve and exact conditional distribution Pr(order=d)=phi(d)/(N-1), d|N-1. The exact low-order tail is sum_{d|N-1,d<=sqrt(N)}phi(d)/(N-1). The source asymptotic bound and random-curve-to-uniform-residue assertion are not assumed; a single small order is recorded against its finite null probability, not automatically an anomaly.",
      "H3_uniform_sampler": "For each admitted cover at bits12/16/20/24/32 and g2/3/4/5 plus one same-field random squarefree same-genus hyperelliptic null, obtain exact point counts and numbers A_d of degree-d closed places for d1..g by zeta/Mobius inversion. Sample partitions (n_1,..,n_g), sum d*n_d=g, with weight product binom(A_d+n_d-1,n_d). For each d sample a uniform multiset of n_d degree-d places: sample iid uniform places and accept with probability product(multiplicity!)/n_d!. A uniform degree-d place comes from a uniform point in C(F_(p^d)) conditioned on Frobenius orbit size exactly d; canonicalize the orbit. Sample uniform affine points by x-uniform and acceptance (#y roots)/2, then uniform root, mixing finite and infinity with their exact counts. For effective divisor E of degree g calculate l(E), M_E=(p^l(E)-1)/(p-1), and accept with probability1/M_E. Because every degree-g class is effective and has exactly M_E effective representatives, the resulting class E-g*O_C is uniform on Pic^0. Keep all rejection and RR costs. No short random walk is called uniform.",
      "H3_measurements": "Obtain1000 independently accepted uniform classes per curve; canonical RR-reduce each, recording reduced degree, complete degree-one splitting and factorization pattern. Restricted factor bases have min(total,floor(p^alpha)) hash-ranked rational places for alpha.4/.6/.8/1, with alpha1 separately distinguished from all-points complete base when total differs from p. Compare observed full-splitting rate to1/g! and restricted rate to p^(-g*(1-alpha))/g! as source heuristics, with exact binomial95% intervals. Compute finite uniform-polynomial factorization-pattern null using exact counts of irreducibles and partition coefficients; do not invent a meaning for the source undefined rho_FF expression. Compare each cover to same-genus null and separately to transported-subgroup relation samples from IC. Report maximum splitting batch, exact pattern likelihood or parametric multinomial10000 simulations when expected counts<5, plus multiplicity/degree strata. Larger-than-predicted rates are observations, not instrument failure. Verify sampler on complete small-field p7/11 genus2/3 class enumerations using independent RR equivalence classes before scaling. For every curve/g/alpha cell report predicted probability p0, expected successes1000*p0, actual successes and exact two-sided Clopper-Pearson95% interval. Mark expected successes<5 or expected failures<5 low_power; an all-zero cell has one-sided95% upper bound1-0.05^(1/1000), which cannot validate a much smaller p0 or its exponent. Use exact binomial upper-tail probability for an excess under the specified model, with Holm correction across the declared H3 comparison family at familywise0.05. Full-splitting and alpha1 power are reported separately. Completing the panel is not validating H3.",
      "finite_census": "Census consists only of all frozen toy fixtures, H2 sampled curves and six named standardized curves from official SEC2 v2 and NIST SP800-186 tables: secp256k1,P-192,P-224,P-256,P-384,P-521. Download exact official documents at execution, hash bytes, record section/curve, independently transcribe p,a,b,P,N,h twice and verify equality, discriminant, point and order certificates. No unverified private curve registry. Record N=p, exact/partial embedding degree, each actually constructed/evaluated E1/E2/E3 map with defining equations, image order, applicability and measured map cost, and every unavailable/unknown branch. Assign a SET of supported channel tags, not a forced exclusive partition. Generic cover existence does not make its DLP easier; multiple tags are allowed. On large standardized fields only arithmetic invariants and explicit map-cost certificates actually computed are evidence; no deployed-curve DLP timing is fabricated. Unknown is not no-exit. Source zero-unassigned/exactly-one predicate is reported literally and its finite/nonexclusive defect explained. Algebraic group structure does not by itself classify every efficient finite-group map or prove an algorithmic lower bound.",
      "randomness": "New consumer randomness uses SHA256 UTF8 ECDLP-EXIT-v1|stage|family|bits|seed|model|target|tag|counter; indices start0 except declared seeds1..5/1..100, UTF8 fixed textual decimal encoding, counters start0, byte blocks big-endian. Use unbiased rejection as shared law; for pools use Fisher-Yates with these draws. Uniform finite-field elements use canonical polynomial-basis coordinate ordering. New24/28/32 sampled scalars are10000 iid draws including duplicates, distinct from shared50 sample except reuse exact matching scalar/cell computations. Cover coefficients are uniform in Fp with forced leading1; model tags POLY-d1/POLY-d2/POLY-d3/RAT-d2/RAT-d3. Null hyperelliptic models: first128 uniform monic squarefree polynomials of same degree as paired cover, first admitting a rational place O; accept first, charge rejection. For H3 p32 use identical GEN curve law and cover law, with no DLP-solve stage added. Rational O is lexicographically first by infinity-first then affine canonical point encoding. Uniform point sampling for E1/E2/H3 always weights affine/infinity using exact total counts; the shared source point-generation law remains unchanged.",
      "small_controls": "Independent exact arithmetic controls use primes7 and11, genera2 and3, both degrees2g+1 and2g+2, first squarefree monic polynomial in lex order with at least one rational point; enumerate all effective divisors of degree g, quotient by independent principal-divisor testing, and compare exact class counts with zeta and uniform sampler weights symbolically before drawing. Enumerate all k at N5/7/11 for lattice/count controls, no scientific execution in design. E1 y=0 or O lifting is handled separately: O maps0, nonzero p-order points on odd anomalous E cannot be nontrivial2-torsion; reject any contrary fixture. E2 T at a Miller evaluation pole uses an equivalent divisor shift with recorded certificate, or rejects T and charges the attempt.",
      "floor_sum_checker": "For prime N and integer0<=h<N, positive-b count is S(h,k)=sum_{b=1}^h (floor((k*b+h)/N)-floor((k*b-h-1)/N)). It counts exactly a in[-h,h] satisfying a+k*b=0 mod N for each positive b. Multiply by2 for negative-b symmetry, then add nonzero b=0 multiples of N (zero in this range). Implement signed Euclidean floor_sum F(n,m,a,c)=sum_{i=0}^{n-1}floor((a*i+c)/m), reducing signed a,c by quotient/remainder before standard Euclidean recursion; S=F(h,N,k,k+h)-F(h,N,k,k-h-1). Require S(minimum-1,k)=0 and replay a witness of that norm. Cross-check this implementation with direct pair enumeration for all k at N5/7/11 and direct sums for50 deterministic k per larger N. Checker does not read primary histogram update code.",
      "count_profile": "At exhaustive sizes, extend the one-pass pair histogram only to the largest missing radius floor(4*sqrt(N)); increment per-k shell counts and cumulative grid counts, reusing shared exact r1 radius counts whenever integer radius matches. Enumerate nonzero pairs with b invertible, assign k, and separately account for axis multiples; all radii here are<N for admitted fixtures. At sampled sizes, compute counts by a separate direct sum over positive b up to h of the same exact interval endpoints, plus symmetry, for each missing geometric-grid radius. The independent floor_sum implementation checks every sampled count. Histograms include primitive and nonprimitive pairs and +/- pairing. Shared higher-r count panels at16/20 are reused; the12-bit extension executes the pinned shared H1 algorithms for r1..4,c=.5/1/2/4. No preferred/alternative unspecified primary remains.",
      "null_curve_law": "For each H3 cover/null pair, preserve exactly p, actual g and normalized hyperelliptic polynomial degree D (POLY-d2 D6, POLY-d3 D9, RAT-d2 D7, RAT-d3 D11). Generate128 monic degree-D polynomials; each coefficient below the leading1 is an independent uniform Fp draw under ECDLP-EXIT-v1 with stage H3-null, the paired family/bits/seed/model and tag candidate{j}-coefficient{i}. Reject nonsquarefree polynomials, wrong genus, disconnected/nonconstant-Fp models or absence of any rational place; accept the first eligible candidate, retaining all rejections. Choose O by the same infinity-first order. Empty pool means unavailable null cell; do not choose a convenient substitute. At32 bits consume shared GEN32 and apply exactly the same cover law; only H3 class/splitting measurements run there."
    },
