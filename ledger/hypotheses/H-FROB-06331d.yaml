  title: >-
    Translation by 1 moves every negation pair in Z/19Z
  statement: >-
    Two times 10 is 20, and 20 minus 19 is 1, so 2 is invertible modulo
    19. The only residue with x equal to minus x is 0. Nineteen minus 1
    divided by 2 is 9, so there are 9 pairs of size 2. For the residue
    1, the translated pair is the set with 0 and 2, and the negation
    pair of 2 is the set with 2 and 17. Those sets differ. The same
    comparison fails for every one of the 19 residues, so the mismatch
    count is 19. Two is not 0 modulo 19, because 19 leaves remainder 1
    on division by 2.
  mechanism: >-
    The proposal prices negation fibres on an order-19 point by the
    same involution on Z/19Z. This contract checks that labelling. It
    does not build a surface and it does not compute an ideal.
