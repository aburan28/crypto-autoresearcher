      nearby_object_control: >-
        A reported match count of 19, and 2 reported congruent to 0
        modulo 19.
    proof_obligations:
      - claim: The witness sets are {0, 2} and {2, 17}.
        responsibility: correctness
      - claim: The mismatch count is 19.
