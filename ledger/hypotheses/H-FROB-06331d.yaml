        The involution x to minus x on Z/19Z in IDEA-20261002-bedc95,
        read 2026-10-02. The 19 residues were compared in this design
        session. That comparison is not a run.
      reproduction_check: >-
        One route lists all 19 residues. The other uses that 2 is
        invertible and that x equal to 0 and x equal to minus 1 cannot
        hold together. They must agree on the count 19.
    observation_collision:
      observable: The mismatch count 19, and the witness sets.
      distinct_preimage_search: >-
        Reporting a match count of 19 drops every moved fibre.
        Reporting 2 congruent to 0 modulo 19 drops the remainder 1.
    constructive_transforms:
