# H-ECDLP-af796a — stage-0 instrument for IDEA-20261009-581f5d (SNFS-E3).
# Specified under DEC-20261012-a99281. No run exists in this design packet.
# SNFS-E1 (IDEA-20261009-b01e42) and SNFS-E4 (IDEA-20261009-fb9bae) stay proposed.
# This hypothesis does not edit those proposals or any goal head.
hypothesis:
  id: H-ECDLP-af796a
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20261009-581f5d
  derived_from_idea: IDEA-20261009-581f5d
  experiment_id: EXP-ECDLP-f34097
  goal_id: GOAL-ECDLP-001
  specified_at: '2026-10-12'
  proposed_by: coordinator
  status: specified
  title: >-
    Stage-0 instrument for a prescribed-fibre bounded-height section:
    a known-generator oracle and a two-unknown enumeration on one
    preregistered constant surface over F_31
  statement: >-
    On the preregistered constant Weierstrass surface
    y^2 = x^3 + x + 30 over F_31, with planted degree-0 section (x, y) = (2, 3),
    the known-generator oracle recovers coefficient vector (2, 0, 3, 0) at
    multiplier v = 1, blind enumeration of the two free degree-1 coefficients
    finds (x1, y1) = (0, 0) among the polynomial-identity solutions, and a
    preregistered two-unknown linear control with planted root (4, 5) recovers
    that root. This stage does not measure T_section against p^{1/2} and does
    not measure degree of regularity.
  mechanism: >-
    A section of degree at most d through a fibre point is a polynomial system
    in the section coefficients. When a Mordell-Weil generator is known, the
    same point is also a small-coefficient multiple of that generator. Stage 0
    checks both readings on one constant surface whose section has degree 0,
    which is inside the degree-1 bound. The surface is not a high-rank lift
    and is not a prescribed arbitrary ordinary fibre.
  assumptions:
    - >-
      The fibre group law and the polynomial identity are computed in F_31
      with exact arithmetic. A timeout or an exception is an instrument
      failure, not evidence about section cost.
    - >-
      SNFS-E1 and SNFS-E4 are not inputs. Degree d = 1 and prime p = 31 are
      preregistered for the instrument. They are not the Gaussian-heuristic
      degree from SNFS-E4.
  proof_search_map:
    bottleneck: >-
      Recovery of one bounded-height section through a prescribed fibre point.
      Stage 0 only checks that the oracle and the enumerator can see a planted
      degree-0 section.
    baseline_embedding:
      parameter_slice: >-
        Known-generator multiples v = 1..8 of the planted section, and
        exhaustive search of (x1, y1) in F_31^2.
      reproduction_check: >-
        The planted point satisfies y^2 = x^3 + x + 30 in F_31, and the
        coefficient vector (2, 0, 3, 0) satisfies the section identity.
    observation_collision:
      observable: >-
        oracle_recovered, structured_contains_planted, random_contains_planted,
        and the two solution counts.
      distinct_preimage_search: >-
        The random control is a different preregistered linear system with the
        same variable count. A pass on it checks the enumerator, not surface
        structure. Degree shape is not matched in this stage.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Coefficient search of x(t) = 2 + x1 t and y(t) = 3 + y1 t.
        predicted_gain: none; this stage records whether the planted vector is found
      - transform: specialization_pack
        proposed_object: >-
          Known-generator multiples on the constant section.
        predicted_gain: none in the exponent; the search is a finite check
    quantifier_order: >-
      For this single preregistered cell (p = 31, d = 1, t0 = 0), the oracle
      returns v = 1 and both enumerations contain their planted solutions.
      No claim is made for all p or for T_section <= p^0.45.
    method_ceiling:
      strongest_certifiable_claim: >-
        The stage-0 instrument accepts or rejects this one planted cell.
        No asymptotic section-cost statement follows.
      nearby_object_control: >-
        Two-unknown linear system with planted root (4, 5). Variable count
        matches. Degree shape does not.
    proof_obligations:
      - claim: the planted point lies on the fibre and the section identity holds at (0, 0)
        responsibility: baseline
      - claim: solution counts and timings are written by the run, not by this record
        responsibility: runtime
      - claim: degree of regularity is not measured here
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: oracle_recovers_planted_coefficient_vector
      direction: different
      minimum_effect: >-
        oracle_multiplier equals 1 and oracle_recovered is true on this cell
    - metric: structured_enumeration_contains_planted
      direction: different
      minimum_effect: >-
        (x1, y1) = (0, 0) is among the identity solutions, and the solution
        count is recorded
    - metric: random_control_contains_planted
      direction: different
      minimum_effect: >-
        the unique solution of the preregistered linear control is (4, 5)
  test_boundary:
    instances:
      - constant surface y^2 = x^3 + x + 30 over F_31
      - planted section (x, y) = (2, 3)
      - linear control u + 2v = 14 and u - v = -1
    parameters:
      p: 31
      degree_bound: 1
      t0: 0
      oracle_v_max: 8
    implementation: >-
      experiments/EXP-ECDLP-f34097/implementation/run.py, pure Python,
      no external algebra system
    budget:
      enforcement: advisory
      note: one deterministic cell; machine protection is on the handoff
  falsification_conditions:
    - >-
      Instrument invalid if the oracle does not return v = 1, if (0, 0) is
      absent from the section-identity solutions, or if (4, 5) is absent from
      the linear-control solutions. That outcome does not refute the
      section-cost claim of IDEA-20261009-581f5d.
    - >-
      The alive conditions of IDEA-20261009-581f5d (T_section <= p^0.45 across
      at least three primes, or a lower degree of regularity than a random
      system) are outside this test boundary. They stay open.
  interpretation_limits:
    - >-
      A pass is an instrument check on a constant surface. It is not evidence
      that a bounded-height section through a prescribed ordinary fibre is
      cheaper than Pollard rho.
    - >-
      A fail invalidates this instrument cell only. It is not negative evidence
      against the section-cost hypothesis.
    - Negative evidence closes only the exact tested scope.
    - No deployed curve and no private-key recovery is in scope.
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        Not under test in EXP-ECDLP-f34097. The parent idea's semi-regular
        degree-of-regularity comparison requires a later amendment that
        measures d_reg on a structured coefficient system and a degree-matched
        random system.
      random_model_justification: >-
        Stage 0's random control matches variable count only. That is not a
        semi-regular model.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Not applicable to this experiment. No d_reg observation is produced.
  structural_ingredients:
    - description: >-
        Mordell-Weil height and the section interpretation used to name the
        parent problem. Not used as a numerical input.
      citation: Shioda 1990
      provenance: recalled
      verified_by: null
      role: problem name only; no formula from this source is evaluated
  asymptotic_claim: null
  citations:
    - ref: IDEA-20261009-581f5d
      provenance: internal
      claim: parent proposal, write-once, not modified by this hypothesis
      verified_by: >-
        design session 2026-10-12 read ledger/proposals/IDEA-20261009-581f5d.yaml
    - ref: KN-LIT-029
