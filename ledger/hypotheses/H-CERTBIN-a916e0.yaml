# H-CERTBIN-a916e0
# Four-target union rare-event linearization control vs multi-target rho.
# Source: IDEA-20260930-14c753. Stages 0-1. No ECDLP solve.
# Approval: DEC-20261004-2be060.
hypothesis:
  id: H-CERTBIN-a916e0
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260930-14c753
  experiment_id: EXP-CERTBIN-c97c23
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-04'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261004-2be060
  title: >-
    The four-target union column is the rare-event linearization, and
    charged membership is not a batch discrete-logarithm speedup
  statement: >-
    Representation class R1 (x-coordinate). Let p <= min(1, C(B+m-1, m)/r).
    For L independent uniform targets, P(at least one hit) = 1-(1-p)^L,
    which is at most min(1, L*p) and equals L*p only as p -> 0. The archived
    four-target unions at the audit rows equal 4 times the one-target
    ceilings to the printed digits (rare-event limit). At a toy cell with
    p about 1/2 the same linearization is false: L*p - (1-(1-p)^L) >= 1
    at L = 4. Separately, the expected number of membership tests until
    each of L chosen targets has been hit is at least L/p, and with
    T_test equal to the complementary half-fold enumeration size of
    IDEA-20260930-77ec1c the charged addition count exceeds the
    multi-target Frobenius-rho iteration estimate
    sqrt(pi * r / (4 * n)) * sqrt(L) at both toy cells on the Koblitz
    n = 19 prime-order subgroup (r = 130873). The uncharged column
    T_test = 1 is reported and is not the headline. This does not move
    the ECDLP exponent and does not solve a discrete logarithm.
  mechanism: >-
    OBJECT FRAME. Representation R1 x-coordinates build the sumset whose
    indicator is scored. Operation set Sigma: independent draws of L
    targets under the uniform law on the prime-order subgroup, plus one
    charged membership query per target. Sigma is not the translation
    action. Trichotomy: branching. Each target is a branching event of
    success at most p. The union count does not propagate under
    translation of a single target. LOSSY PROJECTION: keeps the hit count
    among L targets and discards which targets hit and their discrete
    logs. OPEN NUMBER: (L_loss, b) with L_loss the identity of the hit
    target and b the mean fiber. The toy measures union frequency and
    charges T_test in additions. TWO READINGS: E-RARE (predicted) vs
    E-BATCH (lead at that cell only if charged ratio < 1).
  assumptions:
    - >-
      Targets under the uniform law are independent draws. A shared walk
      that reuses distinguished points is KR-RHO-46c2c6 and is not this
      experiment.
    - >-
      T_test is the number of group additions the complementary half-fold
      membership procedure performs, including misses. A unit-cost test
      is a separate labelled column and is not the headline.
    - >-
      The toy cell uses the Koblitz n = 19 prime-subgroup order r = 130873
      (as frozen in EXP-CERTBIN-ad3e87 / |G| = 4*130873). The Stage-1
      image is the enumerable m = 3 multiset-sum labeling into Z/rZ under
      a frozen seed; no Magma/Sage/AUXIN; no discrete-logarithm solve.
  proof_search_map:
    bottleneck: >-
      Reading the four-target union as linear batch coverage. The identity
      1-(1-p)^L is not a step of an algorithm. Charging T_test is the step
      whose omission creates the hopeful reading.
    baseline_embedding:
      parameter_slice: >-
        Archived equalities 4 * one-target ceiling = four-target union at
        both m = 83 seeds named in IDEA-20260930-14c753, plus toy cells
        at n = 19, m = 3, p about 1/50 and p about 1/2.
      reproduction_check: >-
        Stage 0 recomputes 4 * C/r and 1-(1-C/r)^4 at the two archived
        cells before any toy run. They must match the rare-event form. A
        mismatch means the archived column is not this identity and the
        control stops as O-ARTIFACT.
    observation_collision:
      observable: >-
        union hit frequency of L uniform targets, and additions charged
        until all L chosen targets hit
      distinct_preimage_search: >-
        Two L-tuples with the same hit count and different hit sets. The
        test records one such pair if it occurs. Absence in a small sample
        is not a failure.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of the union-count projection, plus the charged
          addition total as a second observable the union count discards.
        predicted_gain: >-
          Kills the uncharged linearization. No exponent gain is predicted.
    quantifier_order: >-
      FOR ALL p in (0, 1] and all integers L >= 1: 1-(1-p)^L <= min(1, L*p),
      with equality to L*p only in the limit p -> 0. Separately, at the toy
      cells, the prediction is that charged additions exceed the
      Frobenius-rho iteration estimate. The second sentence is a
      measurement; the first is an identity.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the toy cells, either the charged membership method beats the
        rho iteration estimate or it does not. Beating it at n = 19 with
        an enumerable sumset does not transfer to m = 83.
      nearby_object_control: >-
        The p = 1/2 cell, where L*p exceeds 1 and "union = L * ceiling" is
        false. An instrument that still reports a factor L there has proved
        too much. A full-image cell (image equals the subgroup) coexists
        with unknown logarithms: union frequency 1 and relation-rank 0.
    proof_obligations:
      - claim: 1-(1-p)^L <= min(1, L*p) for p in [0, 1]
        responsibility: correctness
      - claim: the archived four-target figures match 4 times the one-target ceilings in the rare-event limit
        responsibility: baseline
      - claim: expected tests for L chosen targets are at least L/p
        responsibility: runtime
      - claim: comparison with rho is valid only with T_test charged
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-CERTBIN-a916e0-H1
      formal_statement: >-
        Uniform independent targets hit the exact image with probability
        p = |image|/r, so a batch of L targets has union probability
        1-(1-p)^L. The sumset of a subspace factor base does not push this
        probability up to min(1, L*C/r) once L*p is no longer small.
      random_model_justification: >-
        For independent Bernoulli trials the union probability is exactly
        1-(1-p)^L. Independence of draws is part of the experiment, not a
        theorem about the curve.
      supporting_results: []
      validation_experiment_ids:
        - EXP-CERTBIN-c97c23
      falsification_condition: >-
        At p about 1/50 the measured union frequency of L = 4 differs from
        1-(1-p_hat)^L by more than 0.15 after one redraw, or the empty-batch
        tail relative error exceeds 50 percent on 100 batches.
  structural_ingredients:
    - description: >-
        Complementary half-fold T_test size from IDEA-20260930-77ec1c /
        EXP-CERTBIN-ec9d83: for m = 3, k = floor(m/2) = 1, store B and
        enumerate C(B+1, 2) complementary pairs.
      citation: ledger/proposals/IDEA-20260930-77ec1c.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-04, file read
      role: charged membership cost
    - description: >-
        Multi-target Frobenius-rho iteration shape
        sqrt(pi * r / (4 * n)) * sqrt(L). Kuhn-Struik recalled, not opened;
        does not discharge novelty or back the approval.
      citation: Kuhn and Struik, multi-target discrete log (recalled; not opened)
      provenance: recalled
      verified_by: null
      role: reference cost shape (pointer only)
  reduction_chain:
    core_problem: >-
      Whether the audit four-target union, once T_test is charged, is a
      rare-event identity rather than a batch discrete-logarithm speedup
      at the toy cells.
    corollaries: []
  predictions:
    - metric: union_frequency_minus_one_minus_one_minus_p_to_the_L
      direction: lower
      minimum_effect: >-
        absolute deviation below 0.05 at L = 4 for both p about 1/50 and
        p about 1/2; a deviation above 0.15 voids the draw or the image
    - metric: linearization_error_at_p_one_half
      direction: higher
      minimum_effect: >-
        L*p - (1-(1-p)^L) >= 1 at L = 4, p = 1/2; a measured union near 2
        is an instrument failure
    - metric: charged_additions_over_rho_iteration_estimate
      direction: higher
      minimum_effect: >-
        ratio > 1 at both toy cells under charged T_test; ratio < 1 is
        E-BATCH and is reported as a lead only at that cell
  distinguishable_outcomes:
    - id: O-RARE
      meaning: >-
        Stage 0 baseline passes; at both toy cells union frequency matches
        1-(1-p_hat)^L within tolerance; charged ratio > 1 at both cells;
        p = 1/2 linearization error >= 1. Predicted control outcome.
    - id: O-BATCH
      meaning: >-
        Charged ratio < 1 at either cell. E-RARE is false there. Report the
        cell, ratio, and addition total. Not an ECC2K-130 result.
    - id: O-ARTIFACT
      meaning: >-
        Stage 0 archived-identity mismatch; or at p about 1/2 the measured
        union is within 0.1 of L*p; or Stage-1 image/draw disagreement
        after one redraw; or other instrument void.
    - id: O-IMPEDIMENT
      meaning: >-
        Crash, missing freeze table, or other infrastructure failure. Not
        a negative mathematical result.
  test_boundary:
    instances:
      - >-
        Stage 0 arithmetic freeze of archived rare-event identities and
        toy protocol parameters
      - >-
        Stage 1 enumerable m = 3 multiset-sum image on the Koblitz n = 19
        prime-order subgroup labels (r = 130873), two B cells
    parameters:
      n: 19
      m: 3
      r: 130873
      L_values: [4, 32]
      batches_L4: 100
      batches_L32: 20
      p_targets: [0.02, 0.5]
      max_image_enumerations: 10000000
      seed_stage0: 2026100414
      seed_stage1: 2026100415
    implementation: >-
      Pure-Python Stages 0-1 worksheet under
      experiments/EXP-CERTBIN-c97c23/implementation/. No Magma, Sage,
      AUXIN, or Bedrock. No ECDLP solve.
    budget:
      maximum_runs: 2
      maximum_memory_gb: 4
      maximum_workers: 1
  falsification_conditions:
    - >-
      At p about 1/2 the measured union frequency is within 0.1 of L*p for
      L = 4: the instrument does not implement a probability in [0, 1].
    - >-
      At p about 1/50 the union frequency differs from 1-(1-p)^L by more
      than 0.15 after one redraw.
    - >-
      The charged ratio is below 1 at either cell: E-RARE is false there
      (O-BATCH).
  interpretation_limits:
    - KN-OPEN-020: no new factor base. The subspace is a component.
    - >-
      A charged ratio below 1 is evidence only at n = 19 for that B and m.
      It does not transfer to m = 83.
    - >-
      The rare-event identity does transfer because it is combinatorial.
      Transfer of the identity is not transfer of a speedup.
    - Full-cost S stays null. This record does not produce a scalar.
    - >-
      KR-RHO-46c2c6 already prices distinguished-point reuse. This control
      does not propose a better batch rho.
    - Recalled Kuhn-Struik does not support the approval decision.
  dominated_by: >-
    Multi-target Frobenius rho on time and queries whenever the charged
    ratio is above 1, which is the prediction.
  sota_delta:
    time: >-
      No attack cost claimed. Predicted charged outcome does not beat
      sqrt(L*r/n).
    memory: >-
      Enumerated image at the toy cell, at most 10^7 points. Not a proposed
      attack memory.
    data_queries: Membership tests charged explicitly; not a query reduction.
