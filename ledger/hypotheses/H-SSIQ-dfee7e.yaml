hypothesis:
  id: H-SSIQ-dfee7e
  question_id: RQ-SSIQ-9702af
  source_idea: IDEA-20260930-0d7c7d
  experiment_id: EXP-SSIQ-c0a99a
  goal_id: GOAL-SSIQ-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-f31aec
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-f31aec
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-f31aec
  proposed_by: coordinator

  title: >-
    Arm I integer law: median k(d) of B-smooth degrees at SQIsign-I/V B=2^20
    is either ≥80 with G*≥4 (O-REPRESENTATION) or <8 on every powered cell
    (O-NEGLIGIBLE), with cover simulation matching 1-(1-ρ²)^{k/2}

  statement: >-
    CLAIM (heuristic_validation / integer-only Arm I; NO ATTACK; NO EXPONENT).
    Let k(d) be the number of admissible divisors of a B-smooth integer d in
    the split window [ceil(d/X), X] with X = floor(sqrt(B)·(p/2)^{1/6}).
    FOR the frozen Arm I cells (p,B) ∈ {(5·2^{248}-1, 2^{20}),
    (27·2^{500}-1, 2^{20})} with ≥100 sampled B-smooth d: either (i)
    median k ≥ 80 AND G* ≥ 4 on at least one cell with twin k-agreement and
    H1 max |P_emp - formula| ≤ 0.02 (O-REPRESENTATION), OR (ii) median k < 8
    on every powered cell (O-NEGLIGIBLE), OR (iii) neither (O-MIXED).
    The cover formula P = 1-(1-ρ²)^{k/2} is H1. The k=2 nearby object must
    read P=ρ² and G<1; character thinning must not beat random thinning.
    NO p^{1/4}. NO isogeny walk. Arm II/III unauthorized. Do not treat infra
    failure as a negative mathematical result.

  mechanism: >-
    OBJECT: the degree of a cyclic isogeny, indexed in Wesolowski Algorithm 1
    (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md). OPERATION: hash-thin the
    listed degrees to S_ρ; a claw survives iff some unordered admissible pair
    {a, d/a} both lie in S_ρ. Bookkeeping: P(cover|d,ρ)=1-(1-ρ²)^{k(d)/2};
    gain G ≈ 0.45√k in time and memory when k≫5. Arm I samples the NULL law
    (B-smooth integers with shortest-vector density construction) with no
    curve or quaternion machinery. Twin meters: independent divisor
    enumerations (path A iterative, path B recursive) must agree on k(d);
    blake2b vs sha256 cover Monte Carlo each compared to the formula.

  predictions:
    - metric: median_k
      direction: different
      minimum_effect: >-
        O-REPRESENTATION iff median≥80 on a powered cell; O-NEGLIGIBLE iff
        median<8 on every powered cell
    - metric: gstar
      direction: higher
      minimum_effect: '≥ 4 for O-REPRESENTATION; < 1.3 for O-NEGLIGIBLE; < 1 on k=2'
    - metric: h1_maxdev
      direction: lower
      minimum_effect: '≤ 0.02 pass; ≥ 0.1 falsifies H1 (O-ARTIFACT)'
    - metric: twin_k_agreement
      direction: same
      minimum_effect: k_a = k_b on every measured d

  test_boundary:
    instances:
      - 'Stage 0: freeze cells, formula, thresholds, k=2 / 14-prime / character fixtures; twin probe'
      - 'Stage 1 authorized: Arm I at SQIsign-I and SQIsign-V with B=2^20; regression p=2^40-87, B=2^12'
    parameters:
      p_i: 5 * 2**248 - 1
      p_v: 27 * 2**500 - 1
      p_reg: 1099511627689
      B20: 1048576
      B12: 4096
      n_samples_k: 20000
      n_cover: 10000
      n_hash_seeds: 50
      rho_grid: [0.02, 0.05, 0.1, 0.2, 0.4, 0.8]
      median_representation: 80
      median_negligible: 8
    implementation: >-
      Pure Python under experiments/EXP-SSIQ-c0a99a/implementation/;
      command surface implementation/run.py driven by trial-plan.json.
      Twin meters in meters.py (divisor paths + dual hashes). No
      Magma/Sage/AUXIN/Bedrock. No Deuring sampler.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin k meters disagree on any measured d (O-ARTIFACT).
    - k=2 control P not matching ρ² within 0.05, or G>1 on that object.
    - H1 maxdev > 0.1 on a powered cell.
    - k<1 on any sampled B-smooth d (instrument / sampler defect).
    - Claiming an exponent move or p^{1/4} from Arm I.
    - Running Arm II/III under this card.
    - Using Magma/Sage/AUXIN/Bedrock as the success path.

  distinguishable_outcomes:
    - id: O-REPRESENTATION
      meaning: >-
        Twin OK; ≥1 powered Arm I cell with median k≥80 and G*≥4; H1 maxdev
        ≤0.02; k=2 control holds. Concrete-cost thinning is live at the null
        law. No exponent claim.
    - id: O-NEGLIGIBLE
      meaning: >-
        Twin OK; every powered Arm I cell has median k<8. Lever void at these
        cells; exponent-ceiling statement of the IDEA still stands.
    - id: O-MIXED
      meaning: >-
        Twin OK; medians fall in [8,80) or G* misses its band. Report per cell;
        neither representation nor negligible fires.
    - id: O-INCONCLUSIVE
      meaning: Every Arm I cell underpowered (<100 samples). Band not read.
    - id: O-ARTIFACT
      meaning: Twin fail, k=2/character/H1 instrument fail, or k<1. No k-claim kept.
    - id: O-IMPEDIMENT
      meaning: Missing Stage-0 freeze, timeout, or crash. Never negative evidence.
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze twin_ok; not a scientific Arm I verdict.

  interpretation_limits:
    - No exponent moves. Time and memory remain p^{1/3+o(1)}.
    - Arm I is the null (integer) law, not Deuring-sampled shortest isogenies.
    - Arm II/III are gated and unauthorized; SQIsign-size k of genuine degrees
      is not measured here.
    - Sample size 20000 (vs IDEA's 100000) is frozen as sufficient to separate
      median≥80 vs <8; it is not a post-hoc cut.
    - Toy/integer evidence is observational; no cryptographic attack cost.

  heuristic_assumptions:
    - id: HEUR-SSIQ-0d7c7d-H1
      formal_statement: >-
        Hash indicators {h(a)<ρ} over distinct integers are independent with
        probability ρ, so P(cover|d,ρ)=1-(1-ρ²)^{k(d)/2}.
      random_model_justification: >-
        Exact for a random function; instrument uses keyed blake2b (path A)
        and sha256 (path B) truncated to 64 bits.
      supporting_results:
        - IDEA-20260930-0d7c7d
        - knowledge/techniques/KN-TECH-055.md
      validation_experiment_ids:
        - EXP-SSIQ-c0a99a
      falsification_condition: >-
        Maximum |P_emp - formula| > 0.1 on the frozen ρ grid (O-ARTIFACT).
    - id: HEUR-SSIQ-0d7c7d-H2
      formal_statement: >-
        Arm I (null law) is the reference distribution for k; Arm II is not
        run under this card, so H2 is NOT claimed decided here.
      random_model_justification: >-
        IDEA-20260930-0d7c7d H2 (Deuring correspondence). Unauthorized here.
      supporting_results:
        - IDEA-20260930-0d7c7d
      validation_experiment_ids:
        - EXP-SSIQ-c0a99a
      falsification_condition: >-
        Not testable on this card; do not read Arm I medians as genuine
        shortest-isogeny k.

  asymptotic_claim:
    problem: >-
      Full-memory list cardinality F3 of OneEnd / Wesolowski p^{1/3+o(1)}
      (RQ-SSIQ-9702af), degree-thinned by representation multiplicity
    prior_best: >-
      Time and memory p^{1/3+o(1)} conditional on Heuristic 1; multiplicity k
      previously priced only on the middle-memory vOW branch
      (IDEA-20260805-b4bc59)
    time_exponent: >-
      NO EXPONENT MOVED. Gain factor G=0.45√k inside the source's
      superpolynomial o(1), if k is large.
    memory_exponent: NO EXPONENT MOVED. Same G on stored entries.
    hidden_cofactor: Source o(1) divided by G; parent-closure (H4) not measured.
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Distribution of k(d) for B-smooth integers at SQIsign sizes under the
      Arm I sampler, and whether the cover formula holds for the hash family.
    baseline_embedding:
      parameter_slice: >-
        ρ=1 recovers the incumbent list; k=2 two-prime object must read P=ρ².
      reproduction_check: >-
        Stage-0 fixtures: 14-prime twin k; k=2 twin k==2; formula(k=2,ρ)=ρ².
        check.py recomputes the k=2 fixture independently.
    observation_collision:
      observable: 'the pair (k(d), P_emp(ρ)) per sampled degree'
      distinct_preimage_search: >-
        Squarefree vs clustered divisors; twin divisor enumerations; dual
        hashes vs formula (not vs each other).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Degree set S_ρ and per-solution survival 1-(1-ρ²)^{k/2}
        predicted_gain: Factor 0.45√k in time and memory; none at the exponent.
    quantifier_order: >-
      FORALL frozen Arm I cells: the median-k band decides representation vs
      negligible vs mixed. NOT CLAIMED: Arm II genuine degrees; Arm III
      wall-clock; any exponent < 1/3.
    method_ceiling:
      strongest_certifiable_claim: >-
        On named Arm I cells, median k and H1 deviation are measured integers
        / fractions. Ceiling k≤τ(d)=p^{o(1)} is classical and not re-proved.
      nearby_object_control: >-
        k=2 two-prime d (G<1); character thinning (gain 1). A method reporting
        G>1 on either proves too much.
    proof_obligations:
      - claim: Twin divisor paths agree on every measured d.
        responsibility: baseline
      - claim: k=2 control matches ρ².
        responsibility: baseline
      - claim: Cover formula vs P_emp within H1 band.
        responsibility: success_probability
      - claim: Nothing asserted at the exponent; Arm II/III off.
        responsibility: scope

  proves_too_much:
    objects:
      - id: PTM-K2
        object: >-
          d=ℓ1 ℓ2 with two primes within factor 2 of sqrt(d) and X < d ≤ X²
          so k=2
        known_false_conclusion: G>1 or P_cover ≠ ρ²
        failure_signature: >-
          Instrument reports G>1 or |P_emp-ρ²|>0.05 on this object
      - id: PTM-CHAR
        object: Multiplicative-character thinning (jacobi(·,5)=+1)
        known_false_conclusion: Structured thinning beats random thinning without correlation
        failure_signature: >-
          Character cover used as if independent pair events; claimed gain >1
          from correlation

  prior_art:
    nearest:
      - ref: knowledge/techniques/KN-TECH-055.md
