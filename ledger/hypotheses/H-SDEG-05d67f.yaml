# =============================================================================
# H-SDEG-05d67f — specified from IDEA-20261006-4b8f91 (bytes copied
# unchanged from origin/design/mlkem-0e9abf-isometry). Question
# RQ-SDEG-001. The prediction under test is the idea's own: the pooled
# lower-median solving degree at p=127 rises by at least 1 from B=4 to
# B=8. A finished increment of 0, or a negative increment, is a
# negative. This record does not assert that the degree moves.
# =============================================================================
hypothesis:
  id: H-SDEG-05d67f
  question_id: RQ-SDEG-001
  source_idea_ids:
    - IDEA-20261006-4b8f91
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Crossed (p, B) grid for prime-field S_3 grevlex solving degree
  statement: >-
    On ordinary short-Weierstrass curves over the primes 31, 61, and
    127, with a set-theoretic x-coordinate factor base of cardinality
    B in {4, 6, 8}, let d_solve(p, B) be the lower median of the
    grevlex solving degrees of the sixteen S_3 systems at that cell
    (two curves, eight factor-base draws). The idea's prediction is
    that d_solve(127, 8) - d_solve(127, 4) is an integer at least 1.
    An increment of 0 falsifies "the degree moves with B" on this
    grid. An increment below 0 is the same directional failure. The
    fixed-B range of d_solve at B=6 across the three primes is
    reported and selects between a B-only reading (range 0) and a
    field-size reading (range at least 1). It does not replace the
    increment test. No index-calculus advantage and no exponent
    change are claimed.
  mechanism: >-
    The tracked object is the integer d_solve of one S_3 ideal in
    three variables, each variable cut by the degree-B membership
    polynomial of one factor base. The operation is grevlex
    elimination. The observable keeps only the highest total degree
    the declared solver reaches. Many ideals share one degree, so
    the projection is lossy, and the integer is what RQ-SDEG-001
    asks to scale. A ladder in p alone cannot separate a
    base-cardinality law from a field-size law, because an
    index-calculus schedule sets B as a function of p. The crossed
    grid unties them. The semi-regular expression in (m, B) is a
    comparator curve only.
  assumptions:
    - >-
      Field equations x_i^p - x_i are omitted on every cell. Each
      prime in {31, 61, 127} is strictly above 16, and 16 sits above
      the B-only comparator at B=8, which is 12. A basis element of
      total degree at least p voids that target rather than entering
      the median as a scored degree.
    - >-
      One monomial order, grevlex, and one solver build are frozen
      for the grid. A second build recomputes one audit cell and
      must return the same integer.
    - >-
      Every counted degree comes from a run that terminates with a
      recorded basis or a recorded inconsistency, and with a degree
      transcript. A timeout is infrastructure.
    - >-
      The factor base is a set of B rational abscissae. No new
      decomposition method is proposed.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        m=3, grevlex, B in {4, 6, 8}, p in {31, 61, 127}. Not an
        attack baseline.
      reproduction_check: >-
        Recompute d_solve on the audit cell (p=31, first curve,
        B=4, target index 0) with a second solver build and require
        the same integer.
    observation_collision:
      observable: d_solve
      distinct_preimage_search: >-
        Two targets in one cell may share d_solve. That collision
        carries no discrete logarithm.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the preimage of one degree value on the (p, B) grid
        predicted_gain: >-
          none as an attack; the fiber records which cells share a
          degree
    quantifier_order: >-
      For all three primes and all three cardinalities, the recorded
      lower-median degree is an integer. Exists-versus-forall attack
      language is not used.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale statement that the lower-median degree on this
        nine-cell grid rises with B at p=127, or that the increment
        is not positive.
      nearby_object_control: the support-matched random system
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Measurement of a degree response surface. The nearby random
      system and the frozen-cell recompute discharge the
      pre-compute audits.
  rerandomization: null
  asymptotic_claim:
    problem: prime-field ECDLP
    prior_best: Pollard rho at Theta(N^{1/2}) group operations
    time_exponent: '1/2, unchanged; this hypothesis does not move it'
    memory_exponent: polylogarithmic per rho walk, unchanged
    hidden_cofactor: none; no attack cost is proposed
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against rho is 1. claim_kind is filled so
      the non-claim is explicit. The separator is an integer degree
      increment, not a cheaper discrete logarithm.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For a support-matched random system whose generator degrees
        do not depend on p, with field equations omitted, the
        distribution of d_solve at fixed B is the same at p=31, 61,
        and 127, up to a shift of 0.
      random_model_justification: >-
        The monomial support and the generator degrees are
        independent of p under the omission rule, so the matrix
        shape is the same integer design reduced modulo different
        primes. Corank probabilities of a uniform coefficient matrix
        do vary with the field. That classical fact is the model
        being imitated. It is not a theorem about S_3.
        KN-LIT-0acb8c was not opened in this design session and is
        not a supporting result.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SDEG-ffec77
      falsification_condition: >-
        At fixed B, the three empirical distributions of d_solve on
        the 20 random systems, one distribution per prime, have a
        range of lower medians at least 1.
  structural_ingredients:
    - description: >-
        S_3 has degree 2 in each variable at m=3. The explicit
        short-Weierstrass polynomial used here is the one printed in
        the opened re-derivation note.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: degree bound and the summation polynomial itself
    - description: >-
        Explicit S_3(x1,x2,x3) over a short-Weierstrass curve, opened
        in this session.
      citation: >-
        coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py
      provenance: internal
      verified_by: >-
        coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py
      role: frozen polynomial
  reduction_chain:
    core_problem: toy grevlex solving degree of one S_3 factor-base ideal
    corollaries: []
  predictions:
    - metric: >-
        d_solve(p=127, B=8) - d_solve(p=127, B=4), where each
        d_solve(p, B) is the lower median of the sixteen solver
        degrees at that cell
      direction: higher
      minimum_effect: >-
        at least 1. A median increment of 0 falsifies "the degree
        moves with B" on this grid. An increment below 0 is the same
        failure.
    - metric: >-
        max_p d_solve(p, B=6) - min_p d_solve(p, B=6) over
        p in {31, 61, 127}
      direction: different
      minimum_effect: >-
        0 under the B-only explanation; at least 1 under the
        field-size explanation. The reported integer selects the
        explanation and does not replace the increment test.
  test_boundary:
    instances:
      - ordinary short-Weierstrass curves over F_31, F_61, and F_127
    parameters:
      primes: [31, 61, 127]
      cardinalities: [4, 6, 8]
      curves_per_prime: 2
      targets_per_cell: 8
      random_replicates_per_cell: 20
      monomial_order: grevlex
      m: 3
    implementation: >-
      One declared grevlex solver for the grid, plus one second
      build on the single audit cell. No discrete-log search.
    budget:
      scientific_systems: 325
      maximum_runs: 1
  falsification_conditions:
    - >-
      The pooled lower-median increment at p=127 from B=4 to B=8
      equals 0. That is the concrete negative named by
      IDEA-20261006-4b8f91.
    - >-
      That same increment is negative. The degree did not move
      upward with B.
    - >-
      The random arm's fixed-B range at B=6 equals the S_3 range
      and both are at least 1. The field-size reading is then an
      artifact of solving over F_p. This gate qualifies the range
      reading. It does not rewrite a finished increment.
  interpretation_limits:
    - >-
      Toy primes only. A flat or unit increment on this grid does
      not transfer to cryptographic p or to B growing like p^{1/3}.
    - >-
      The factor base is a set-theoretic subset of F_p of size B.
      This hypothesis does not leave that class.
    - >-
      No comparison with Pollard rho is implied by a degree pattern.
    - >-
      One solver degree is the metric. Solving degree, degree of
      regularity, and Castelnuovo-Mumford regularity are not
      identified.
    - >-
      If the two curves at a cell differ by at least 1 in their
      per-curve lower medians, that cell's prime effect is not
      separable from the curve. The flag is reported. The increment
      test still uses the pooled median the idea named.
