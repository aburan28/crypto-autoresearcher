hypothesis:
  id: H-PFGB-f9ae08
  question_id: RQ-SDEG-001
  statement: >-
    For target-sectioned prime-field Semaev decomposition systems with a
    set-theoretic factor base V of size B, a correctly measured first-fall degree
    and true solving degree either track the pre-registered support-matched
    semi-regular reference on the toy ladder or exhibit a reproducible
    non-generic collapse that can be quantified. The experiment tests whether a
    collapse below the declared charged threshold occurs; it does not assume
    that a proxy, a wall time, or a binary-field measurement is a true d_reg.
  mechanism: >-
    The membership ideal of a set V subset F_p has a degree-B univariate
    generator, while the Semaev generator has fixed degree for fixed m. Under
    the semi-regular null this gives a closed Hilbert-series prediction for the
    reference degree profile. Any departure is therefore attributable only to
    measured syzygies or special structure after the support, curve, target, and
    seed controls pass; the existing max-degree proxy is explicitly excluded
    from that inference.
  assumptions:
    - The backend reports exact graded ranks or an independently verified equivalent, with Sage/GBLA or a dense reference fingerprint captured in the manifest.
    - The Semaev system, factor-base polynomial, and null share the same variables, monomial support, field, and target convention.
    - Curves and factor bases are selected before solving-degree measurements, and degenerate targets are recorded rather than discarded.
    - The measured ladder remains toy-tier; no fitted slope is promoted to an asymptotic law.
  proof_search_map:
    bottleneck: >-
      Separate the true solving-degree observable from the first-fall proxy and
      from the semi-regular reference; otherwise a rank deficit or a solver
      timeout is observationally indistinguishable from a mathematical signal.
    baseline_embedding:
      parameter_slice: >-
        Reproduce the existing EXP-SEMAEV-001 overlap cells and its max-degree
        proxy while labeling that value as proxy-only.
      reproduction_check: >-
        Independently recompute the exact null Hilbert coefficients and dense
        small-cell ranks before opening the prime-field growth ladder.
    observation_collision:
      observable: d_ff, d_reg, matrix dimension, and resource usage
      distinct_preimage_search: >-
        Hold the polynomial support and field fixed while randomizing coefficients
        for a support-matched null; also compare a planted known-solution cell.
        Equal d_ff with different matrix dimensions demonstrates why degree alone
        cannot be converted to attack cost.
    quantifier_order: >-
      Fit only the declared model family on the lower rungs and score the held-out
      top rungs. A toy fit is not a statement about all primes, all m, or m growing
      with field size.
    method_ceiling:
      strongest_certifiable_claim: >-
        A reproducible toy-tier measurement of d_ff and d_reg for the declared
        prime-field Semaev family and controls, or an instrument/backend no-go.
      nearby_object_control: >-
        The support-matched semi-regular null and the binary Weil-descent control
        must be distinguishable; if they are not, the instrument has not measured
        the prime-field mechanism.
  asymptotic_claim: null
  predictions:
    - metric: null_calibration_residual
      direction: lower
      minimum_effect: exact zero on dense reference cells, within the declared integer tolerance on the fast path
    - metric: sem_vs_null_dreg_gap
      direction: same
      minimum_effect: >-
        The primary branch is no statistically reliable non-generic drop below
        the null; a reproducible drop is the explicit positive branch and must be
        reviewed independently before any interpretation.
    - metric: held_out_growth_model_error
      direction: lower
      minimum_effect: >-
        The pre-registered model family is evaluated on held-out field-size rungs;
        post-hoc curve selection is not permitted.
  test_boundary:
    instances:
      - prime fields with bit sizes [8, 10, 12, 14, 16, 18, 20]
      - decomposition arities m in [2, 3, 4]
      - at least 3 deterministic ordinary curves per (m, field_bits) cell
      - at least 4 independent seeds per measured cell
    parameters:
      factor_base_sizes: [4, 6, 8, 12, 16]
      training_rungs: [8, 10, 12, 14, 16]
      held_out_rungs: [18, 20]
      omega_columns: [2.0, 2.807]
    implementation: >-
      New parameterized implementation under the experiment directory. It may
      not execute until the true-degree backend gate and dense-reference fixture
      gate pass in a separate reviewed task.
    budget:
      wall_clock_seconds: 259200
      memory_gb: 32
      maximum_runs: 120
  falsification_conditions:
    - The null fails exact dense-reference calibration or the backend cannot record a non-null version/fingerprint; the experiment is infrastructure-failed and says nothing mathematical.
    - A valid prime-field cell shows d_reg below the null with non-overlapping replicated intervals, or d_ff grows with field size under the declared held-out rule; escalate as a potentially critical finding.
    - Any conclusion relies on the max-degree proxy, wall time alone, a binary-field transfer, or a cell censored by timeout/OOM; that conclusion is invalid.
  interpretation_limits:
    - The experiment cannot close KN-OPEN-002 or establish an asymptotic law.
    - A negative result closes only the tested prime-field Semaev/interface scope and does not rule out other solvers or representations.
    - A positive signal is not a breakthrough until independently reviewed at the required policy and reproduced with complete artifacts.
  source_refs:
    - knowledge/open-problems/KN-OPEN-002.md
    - experiments/EXP-SEMAEV-001/specification.yaml
    - ledger/questions/RQ-SDEG-001.yaml
  status: proposed
  proposed_by: coordinator
