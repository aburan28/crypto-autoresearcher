  title: >-
    GHS cover genus floor at n = 7 in odd characteristic: the span dimensions are the degrees of divisors of
    x^7 - 1 over F_2 ({1, 3, 4, 6, 7}), genus 7 is reached only by split 2-torsion through (m, r) = (3, 7),
    and the other 2-torsion types have floors 161 (E(K)[2] = Z/2, 4 | #E(K)), 193 (#E(K) = 2 mod 4) and 193
    (odd order, j not in F_q); the characteristic-2 magic number obeys the same divisor rule
  statement: >-
    Let q be an odd prime power, K = F_{q^7}, sigma the q-Frobenius, E: y^2 = x^3 + a2 x^2 + a4 x + a6 over K,
    B = x(E[2]) together with infinity, and for an F_q-structure tau = M sigma M^-1 on P^1_K let B' = M^-1 B,
    r the number of points of the union of the sigma^i B' (0 <= i < 7), m the F_2-dimension of the span of their
    indicator vectors, and g = 2^(m-2)(r-4)+1 (m >= 2) the genus of the (Z/2)^m compositum of the seven
    conjugate double covers (construction and genus formula of aburan28/crypto
    research/ghs_cover_census_n5_20261013, cited). Derived statements (proofs below, written before any panel):
    (M7) m is in {1, 3, 4, 6, 7}; (D0) m >= 2 implies g >= 7; (E7) the allowed (m, r) per 2-torsion type are
    those printed by spectrum.py 7 of EXP-PEXT-212d5c; in particular m in {3, 4, 6} and genus below 161 occur
    only for E(K)[2] = (Z/2)^2, and g = 7 occurs exactly for (m, r) = (3, 7), i.e. B' = {sigma^i x : i in S}
    with x in K \ F_q and S a weight-4 word of one of the two [7,3,4] cyclic codes; (T7) E(K)[2] = Z/2 implies
    g >= 161, and #E(K) = 2 mod 4 implies g >= 193; (O7) #E(K) odd implies every structure has m = 1 or
    g in {193, 577, 769}, exactly one structure has m = 1 or g = 193, and for j not in {0, 1728} that one has
    g = 193 iff j(E) is not in F_q. Measured claims, as tested: at q = 3 a stratified census (24 classes per
    stratum, every j in F_q class, their 2-isogeny neighbours, every structure of every model) shows no
    violation of the derived statements and attains the split floor 7; the genus-7 configurations exist at
    q = 3, 5, 7 and their j-set coincides with the censused split curves of minimum 7 at q = 3; the fraction of
    split j-invariants reaching genus 7 falls like q^-3 between q = 5 and q = 7 (heuristic H1); and in
    characteristic 2, at N = 7 l (l = 1, 2, 3), the classical GHS magic number m_b equals deg lcm(Ord_b, x + 1),
    so m_b is in {1, 4, 7} with counts q - 1, 2 q^4 - 2 q, q^7 - 2 q^4 + q.
  mechanism: >-
    Lemma M (sibling n = 5 study): the span of the sigma-translates of 1_{B'} is the cyclic F_2[x]/(x^n - 1)-module
    generated by 1_{B'}, so m is the degree of a divisor of x^n - 1. For n = 3 and 5, 2 is a primitive root and
    only {1, n-1, n} occur; x^7 - 1 = (x+1)(x^3+x+1)(x^3+x^2+1) over F_2 (ord_7(2) = 3) adds m = 3, 4, 6. The
    module splits over sigma-orbits: a K-point of degree d (1, 2 or 3) lies in a short orbit (size d, constant
    summand, annihilator x + 1, possible since gcd(d, 7) = 1) or a free orbit (size 7d) where it occupies one
    position of Z/7, and m = deg lcm over orbits of (x^7 - 1)/gcd(s_O, x^7 - 1), s_O the position polynomial.
    A single free 7-orbit with s_O = (x+1) f, f a cubic factor, gives m = 3, r = 7, g = 7: this needs four
    K-rational points in one orbit (split 2-torsion). A conjugate pair or a cubic triple in a free orbit has a
    single position and forces m = 7, which is what keeps the non-split floors at 161 and above. The same
    divisor rule governs characteristic 2, where the magic number is the dimension of the span of
    (1, sigma^i b), i.e. deg lcm(Ord_b, x + 1), so m_b = 4 (genus 7 or 8) comes from the cubic factors.
  derivations:
    written_at: '2026-10-24'
    written_before_any_panel: true
    note: >-
      Paper proofs by the Coordinator's design lane. Finite steps are kernel-checked by
      experiments/EXP-PEXT-212d5c/implementation/lean/CoverCensusN7.lean when its Lean trial builds, and the
      placement enumeration by spectrum.py; the census checks every statement on every model (violations).
    lemma_M7: >-
      As Lemma M of the sibling: x acts as sigma, (x^7 - 1) annihilates 1_{B'}, so the span is F_2[x]/(d) for the
      annihilator d | x^7 - 1 and m = deg d. Divisors of (x+1)(x^3+x+1)(x^3+x^2+1) have degrees 0, 1, 3, 4, 6, 7;
      d = 1 is excluded (B' nonempty), so m is in {1, 3, 4, 6, 7}.
    orbit_lemma: >-
      A point of K-degree d has sigma-orbit size e with e | 7d and e not dividing 7d' for d' < d, so e in
      {d, 7d}; e = d puts the point in F_{q^d}, where sigma^7 generates the same group on the orbit as sigma
      (gcd(d, 7) = 1), so B' contains the whole short orbit, every translate contains it, and its summand of the
      module has annihilator x + 1. In a free orbit Z/7d the K-conjugacy classes are the cosets of <7>, the
      quotient is Z/7, and the translates of B' restricted to the orbit are the translates of the position set S;
      the span there is the cyclic code generated by s_O(x) = sum over S of x^i, of dimension
      7 - deg gcd(s_O, x^7 - 1). The span of the direct sum has annihilator the lcm of the summands'.
      (Lean: Orbit.period_three_or_twentyone, Orbit.period_two_or_fourteen for the orbit sizes.)
    lemma_D0: For n prime and m >= 2 the seven translates are distinct and each gives an elliptic quotient, so g >= 7 (sibling Lemma D0).
    lemma_E7: >-
      Enumerate placements (spectrum.py 7, exhaustive over the finitely many orbit assignments and positions).
      Split (four K-points): allowed (m, r) = (1,4), (3,7), (4,8), (6,7), (6,14), (7,8), (7,9), (7,10), (7,14),
      (7,15), (7,16), (7,21), (7,22), (7,28); genera 7, 17, 49, 129, 161, 193, 321, 353, 385, 545, 577, 769.
      g = 7 iff (3,7): r = 7 forces one free 7-orbit containing all four points (an F_q point would add 1 to r),
      |S| = 4, and m = 3 iff a cubic factor divides s_O, i.e. s_O = (x+1) f up to rotation (weight 4); the 14
      such S are the nonzero words of the two [7,3,4] codes ({0,2,3,4} and {0,1,2,4} with rotations). Every
      other weight-4 S has m = 6, g = 49 (Lean: Rot7.weight4_dim3, Rot7.weight4_dim3_or_6). Type (1,1,2)
      (E(K)[2] = Z/2): the pair has one position, so if it lies in a free 14-orbit m = 7 and r >= 16; if short
      (beta in F_{q^2}), the two K-points must not both be in F_q (else m = 1), and a single 7-orbit position or
      two positions with weight 2 (gcd with x^7 - 1 is x + 1) give h = f1 f2, lcm with x + 1 = x^7 - 1, m = 7;
      allowed (7,9), (7,10), (7,16), (7,21), (7,22), (7,28), floor 161 at (7,9) = {beta, beta^q} plus
      {x, sigma^k x}. Type (1,3) (odd order): (1,4) or (7,10), (7,22), (7,28); genera 193, 577, 769. So m in
      {3, 4, 6} and every genus below 161 need split 2-torsion.
    proposition_T7: >-
      Sibling Proposition T holds for every odd n: for type (1,1,2), chi = [cr(a1, a2; beta, beta-bar)] in
      U_1/U_1^2 is trivial iff 4 | #E(K), and the configuration {beta, beta^q} with {x, sigma^k x} has
      mu = h(x)^(1 - (-q)^k) with an even exponent, so chi = 1. Hence #E(K) = 2 mod 4 excludes (7,9), and the next
      allowed value is (7,10): g >= 193. E(K)[2] = Z/2 with 4 | #E(K): g >= 161 (E7).
    lemma_O7: >-
      Odd #E(K): the cubic is irreducible over K, a root theta has orbit 3 or 21 (orbit lemma), the K-point a has
      orbit 1 or 7. (3,1): m = 1; (3,7): r = 10; (21,1): r = 22; (21,7): r = 28; in the last three the free orbit
      of a or of theta has one position, m = 7, g = 193, 577, 769. PGL2(K) acts simply transitively on the
      Q^3 - Q points of degree 3 over K, and PGL2(F_q) simply transitively on F_{q^3} \ F_q, which lies in that
      set because gcd(3, 7) = 1; so exactly one coset of PGL2(F_q), i.e. one structure, has theta in F_{q^3}, and
      it is m = 1 iff B is PGL2(K)-equivalent to a sigma-stable set, which forces j in F_q and, for j not in
      {0, 1728}, is implied by it (sibling Prop. O5 argument verbatim with 5 replaced by 7).
  assumptions:
  - Construction, Lang reduction and genus formula of the sibling studies (cited, not re-derived); odd n so the Frobenius extends to the compositum with order n (Diem 2003, as cited there).
  - Branch set x(E[2]) plus infinity; other degree-2 functions (Hess's generalisation) are out of scope.
  - q = 3 is characteristic 3; q = 5 and 7 separate any characteristic-3 effect in the enumeration arm.
  proof_search_map:
    bottleneck: >-
      Which algebraic quantity fixes the minimum genus at prime n: the factorisation of x^n - 1 over F_2 (via the
      module structure) together with the K-degree type of B, or something else that only n = 7 can separate.
    baseline_embedding:
      parameter_slice: n = 3 and n = 5 censuses of the sibling repository (aburan28/crypto research/ghs_cubic_cover_census_20261012, ghs_cover_census_n5_20261013)
      reproduction_check: >-
        regression trial of EXP-PEXT-212d5c: the ported tool reproduces the merged n = 3 (q = 3, 5, 7) and n = 5
        (q = 3) records byte for byte; spectrum.py reproduces the sibling derived spectra at n = 3 and 5.
    observation_collision:
      observable: per-model minimum genus, (m, r) histogram, 2-torsion stratum, j
      distinct_preimage_search: >-
        a census or enumeration bug versus a mathematical counterexample: separated by the regression fixture,
        the subcover-sum identity on every evaluated structure, the configuration-to-curve agreement at q = 3 and
        the independent blind recount at review.
    constructive_transforms:
    - transform: constructive_enumeration
      proposed_object: every genus-7 configuration x in K \ F_q (up to PGL2(F_q)) with the 14 code patterns
      predicted_gain: exact j-set of split curves of genus 7 at q = 3, 5, 7 without the q^12 structure scan
    quantifier_order: >-
      FOR ALL odd q: the derived statements (paper proofs); FOR the tested q (3 census; 3, 5, 7 enumeration;
      2, 4, 8 in characteristic 2): the measured attainment and counts. No claim for untested q is measured.
    method_ceiling:
      strongest_certifiable_claim: >-
        derived floors and spectrum for every odd q (paper proof, finite steps in Lean, census agreement);
        attainment of the split floor at q = 3, 5, 7; attainment of the non-split floors only where a censused
        q = 3 model reaches them
      nearby_object_control: characteristic 2 at N = 7 l (classical magic number) against KR-IC-791cb7
    proof_obligations:
    - claim: genus formula and Lang reduction of the sibling construction
      responsibility: cited (aburan28/crypto research/ghs_cover_census_n5_20261013 PROTOCOL.md)
    - claim: descent of the cover to F_q with a transfer injective on the large prime subgroup
      responsibility: out of scope; open, never implied by a genus count
    - claim: attainment of the non-split floors 161 / 193 / 577 for every q
      responsibility: open; measured only at q = 3 in a sample
    not_applicable_reason: null
