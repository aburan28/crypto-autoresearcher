  heuristic_assumptions:
  - id: H1
    statement: The fraction of split j-invariants over F_{q^7} whose curves reach genus 7 falls like q^-3.
    rigorous_support: >-
      none; a configuration count: 14 (q^7 - q)/(q^3 - q) ~ 14 q^4 configurations against about q^7/6 split
      j-invariants, if each attaining j carries a bounded number of configurations
    validation_plan: >-
      EXP-PEXT-212d5c construct trial: rate = |J7|/|J_split| at q = 3, 5, 7; out-of-sample test on q = 5, 7 only
      (slope of log rate on log q in [-3.5, -2.5] and ratio of rate q^3 at q = 7 over q = 5 in [0.8, 1.25]);
      q = 3 was seen in the design smoke test and is reported only.
    validation_experiment_ids:
    - EXP-PEXT-212d5c
    falsification_condition: slope outside [-3.5, -2.5] or ratio outside [0.8, 1.25] on valid construct runs
  structural_ingredients:
  - description: Lemma M, Lemma D0, Lemma E, Prop. O5, Prop. T, cover_census_n.rs and the n = 3 / n = 5 records
    citation: aburan28/crypto research/ghs_cover_census_n5_20261013 (README.md, PROTOCOL.md) at f7ed67332588643447fdeca66b3790febbcf9e92
    provenance: retrieved
    verified_by: coordinator design lane 2026-10-24, files read in /home/user/crypto
    role: construction, regression fixture, proof templates
  - description: classical GHS magic number m_b and genus 2^(m-1) - 1 or 2^(m-1) in characteristic 2; Hess genus-7 family at N = 7 l
    citation: KR-IC-791cb7 (Menezes-Teske, Menezes-Teske-Weng, full text read per the row)
    provenance: internal
    verified_by: coordinator design lane 2026-10-24, row opened
    role: >-
      nearby-object control. The row's genus-7 family at N = 7 l is Hess's generalised GHS with density about
      2^-(2l+1); the classical magic number computed here has m_b = 4 on 2 q^4 - 2 q elements (density about
      2 q^-3). The control tests the divisor rule, not the row's density, which concerns other degree-2 functions.
  - description: odd-characteristic classification of GHS-weak curves for d in {2, 3, 5, 7}
    citation: KN-LIT-bf1772
    provenance: internal
    verified_by: coordinator 2026-10-24, record opened (abstract only)
    role: prior-art pointer; not read
  reduction_chain:
    core_problem: the minimum genus of the (2,...,2) GHS compositum at prime n, by 2-torsion type
    corollaries: []
  predictions:
  - id: P1
    metric: set of m over all censused structures (q = 3)
    direction: equals
    minimum_effect: '{1, 3, 4, 6, 7}; any other m refutes M7; a proper subset is under-coverage'
    source: IDEA-20261024-b58e07 prediction 1
  - id: P2
    metric: split floor
    direction: attains
    minimum_effect: genus 7 at q = 3, 5, 7 (enumeration) and on a censused split curve at q = 3, only through (m, r) = (3, 7), only on split curves
    source: IDEA-20261024-b58e07 prediction 2 (q = 3 or 5 there; q = 7 added at design)
  - id: P3
    metric: minimum genus by non-split stratum (q = 3 census)
    direction: at_least
    minimum_effect: 161 (Z/2, 4 | #E), 193 (2 mod 4), 193 (odd, j not in F_q), 577 (odd, j in F_q, j != 0)
    source: IDEA-20261024-b58e07 prediction 3 ("above 7; per-type floors derived at design"), floors derived here before any panel
  - id: P4
    metric: minimum genus of odd-order curves with j not in F_q
    direction: equals
    minimum_effect: 193, attained by exactly one structure per curve
    source: IDEA-20261024-b58e07 prediction 4
  - id: P5
    metric: derived-check violations over every censused model
    direction: equals
    minimum_effect: 0
    source: derivations above (any violation is a counterexample certificate or a bug)
  - id: P6
    metric: characteristic-2 classical magic-number histogram at N = 7 l, l = 1, 2, 3
    direction: equals
    minimum_effect: 'm in {1, 4, 7} with counts q - 1, 2 q^4 - 2 q, q^7 - 2 q^4 + q; m_b = deg lcm(Ord_b, x + 1) for every b'
    source: design lane 2026-10-24 (cross-characteristic arm of the IDEA; counts derived from the normal basis theorem)
  - id: P7
    metric: configuration-to-curve agreement at q = 3
    direction: equals
    minimum_effect: every censused split model has minimum 7 iff its j is in the q = 3 enumeration (disagreement invalidates)
    source: IDEA-20261024-b58e07 falsification condition 3
  test_boundary:
    instances:
    - 'n = 7, q = 3, K = F_{3^7}: K-isomorphism classes by the characteristic-3 families, strata odd / odd_jFq / Z2_2mod4 / Z2_0mod4 / split; 24 classes per stratum by the fixed-seed stream (seed 20261012, tag 3077), every j in F_q class, and all K-rational 2-isogeny neighbour classes; every structure of every model ((Q^3 - Q)/(q^3 - q) = 435,847,959 per model)'
    - 'n = 7, q = 3, 5, 7: every genus-7 configuration (14 (q^7 - q)/(q^3 - q) configurations) mapped to j'
    - 'characteristic 2: N = 7 l, l = 1, 2, 3 (q = 2, 4, 8), every b in K*'
    - 'regression: n = 3, q = 3, 5, 7 and n = 5, q = 3, every class (merged records)'
    parameters:
      strata_k: 24
      seed: 20261012
      threads: 4
      genus_formula: 2^(m-2)(r-4)+1
    implementation: >-
      experiments/EXP-PEXT-212d5c/implementation/ (cover_census_n7.rs, spectrum.py, char2_magic.py, run.py,
      analyze.py, check.py, lean/CoverCensusN7.lean, fixtures/), sha256-bound by the trial plan at approval
    budget:
      maximum_runs: 6
      maximum_workers: 4
      maximum_memory_gb: 4
    scope_note: >-
      Toy fields only. Structural genus statements; no curve over F_q is constructed, no transfer, discrete
      logarithm, cost or speedup is claimed; nothing about any deployed or standardized curve.
  distinguishable_outcomes:
  - 'O-SUPPORT (support_scoped): regression passes, P1 confirmed, P2 confirmed, P3 to P5 confirmed, P6 confirmed, P7 confirmed; floors derived and the split floor attained at the tested q.'
  - 'O-REFUTE (refute in scope): a censused model below its derived floor, an m outside {1,3,4,6,7}, a non-split model at genus 7, or a characteristic-2 histogram off the predicted counts; the model and structure are archived as a counterexample certificate and the derivation is wrong.'
  - 'O-PARTIAL (inconclusive): no refutation, but P1 observes a proper subset of the spectrum or P2 is not attained in the census sample; the derived statements stand untested where unattained.'
  - 'O-INVALID (not evidence): regression fixture fails, subcover-sum mismatch, or P7 disagreement (configuration-to-curve map wrong).'
  - 'not evidence: a timeout, memory kill or crash is failed_infrastructure (AGENTS.md rule 5).'
  falsification_conditions:
  - A structure below the derived floor of its type is a counterexample certificate against that derivation. (IDEA, unadjusted)
  - A non-split curve at genus 7, or any m in {2, 5}, refutes the mechanism at n = 7. (IDEA, unadjusted)
  - No genus-7 curve while the enumeration finds configurations means the configuration-to-curve map is wrong (invalid, not null). (IDEA, unadjusted)
  - A characteristic-2 magic-number histogram different from the predicted counts refutes the cross-characteristic divisor rule at N = 7 l.
  - H1 (heuristic): log-rate slope between q = 5 and 7 outside [-3.5, -2.5] or the rate q^3 ratio outside [0.8, 1.25].
  confounders:
  - Characteristic 3 at q = 3 (the n = 3 pilot had char-3 exceptions); the enumeration arm runs q = 5, 7 as well; the census arm is q = 3 only.
  - The trace-zero class #E(K) = Q + 1 (the n = 3 exception) is reported in the per-curve records (order field) and not pooled away.
  - j = 0 = 1728 in characteristic 3 (supersingular); O7's j in F_q clause excludes it and the analysis drops j = 0 from the odd_jFq floor.
  - Stratified sampling, not exhaustive at n = 7, so class minima are not computed; per-model minima are exact.
  interpretation_limits:
  - Bounded q and samples; a floor is a theorem only where proved; attainment is measured only where observed.
  - Genus says nothing about descent to F_q, transfer injectivity, hyperellipticity of m = 3 covers or cost.
  - Other degree-2 functions (Hess) can give lower genus; the characteristic-2 control is the classical construction only.
  status: specified
