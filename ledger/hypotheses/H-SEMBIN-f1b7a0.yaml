  title: >-
    The labelled binary counts through eight leaves are the odd double factorials.
  statement: >-
    For t leaves the equation count is t - 1 and the auxiliary count is
    t - 2. The slot identity t + 1 + 2(t - 2) equals 3(t - 1). The
    labelled rooted counts for t = 3 through 8 are 3, 15, 105, 945,
    10395 and 135135, and the successive ratios are 5, 7, 9, 11 and 13.
    The plane-tree count at t = 3 is 2, not 3. At n = 571, t = 12 and
    k = 48 the binary variable count is 10 times 571 plus 12 times 48,
    which is 6286. For arity 3, 4 and 5 the leaf excess 11 leaves
    remainders 1, 2 and 3, so no full tree exists. The cleared numerators
    are 6291, 6296 and 6301. The written integers 3146, 2099 and 1575
    sit 1/2 above 6291/2, 1/3 above 6296/3, and 1/4 below 6301/4. The
    degree figures 4, 10, 17 and 26 meet j squared plus 1 at the last
    three arities, and the quadratic at arity 2 is 5, which is 1 above 4.
  mechanism: >-
    The proposal states four tree invariants and an arity variable count.
    This contract checks those counts as integer identities. It does not
    enumerate trees and it does not minimise a monomial proxy.
