hypothesis:
  id: H-GRUMPY-1ead49
  question_id: RQ-GRUMPY-964876
  goal_id: null
  derived_from_idea: IDEA-20260906-7bd805
  successor_experiment: EXP-GRUMPY-eb8675
  decision_id: DEC-20260913-f79682
  status: approved
  proposed_by: coordinator
  recorded_at: '2026-09-13'
  statement: >-
    In the generic prime-order group written as Z/l, the set C_n of targets
    solved by any schedule in the declared family S after n additions is a
    union of three explicit interval systems determined by (l, S, n) alone
    (Theorem A). The all-target mean is therefore the exact integer ratio
    (1/l) * sum_n (l - |C_n|), computable by a target-free covered-set
    counter and independently by exhaustive per-target simulation. Those two
    instruments agree on every frozen prime l and disagree on the frozen
    composite NULL-B. This does not move the DLP exponent, does not claim
    the Bernstein-Lange instance until the 23/32 pin succeeds, and does not
    cover the negation map.
  mechanism: >-
    Each collision type is linear in the target x with a unit coefficient
    (l prime, s and s-1 units). Membership of x in C_n therefore does not
    depend on x. The mean of first-hit time is the tail sum of complement
    sizes. A second instrument that actually walks each x must return the
    same integers. Composite l is the nearby object where unique recovery
    fails and the instruments must disagree.
  assumptions:
    - l is an odd prime not equal to 3 on every REAL row.
    - Cost unit is one group addition. Lookups, storage, and precomputation
      of mP, (m+1)P, sQ are reported separately and are not folded into the mean.
    - b_0 = 0 and the opening giant elements are not charged as additions
      (frozen charging convention).
    - The mean is accumulated per addition, not per round-robin triple.
    - Collision detection is immediate (each new element is looked up in
      the other two tables).
    - The negation-map variant is out of scope.
    - Novelty of the phase / finite-l formula against unread Bernstein-Lange
      and GWZ full texts stays unverified (IDEA-20260906-7bd805).
  proof_search_map:
    bottleneck: >-
      Whether the two instruments return identical |C_n| on prime l, and
      whether the one-giant / BL-pin slices hit their closed-form anchors.
    baseline_embedding:
      parameter_slice: >-
        Rate vector (1,1,0) is interleaved BSGS with predicted mean/sqrt(l)
        = 4/3 + O(1/sqrt(l)). Classical full-baby-then-giant at 1.5 sqrt(l)
        is the second slice. The BL pin is existence of a point of S with
        |C_n|/l = 23/32 within 1/sqrt(l) at n = 1.5 sqrt(l).
      reproduction_check: >-
        Frozen fixtures l in {1031, 4099, 16411}. (1,1,0) mean/sqrt(l) within
        2/sqrt(l) of 4/3. |C_n|/l at n = 1.5 sqrt(l) for classical BSGS
        within 1/sqrt(l) of 0.5625.
    observation_collision:
      observable: the integer |C_n| for every n, equivalently the exact mean numerator
      distinct_preimage_search: >-
        Per-target simulation versus target-free covered-set counter must
        agree on every prime fixture. Disagreement localises to a named
        (n, x). Composite NULL-B must disagree.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: membership of x in a target-independent union of interval systems
        predicted_gain: exact integer mean without simulating any target
    quantifier_order: >-
      Theorem A: for all odd primes l != 3, for all schedules in S, for all
      n, C_n is the stated union. Stage 1 tests only the frozen fixtures and
      the frozen S grid. Theorem B (continuum rho, O(1) residual, phase
      reading) is NOT authorized in this experiment.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the frozen primes and S grid, the two instruments agree and the
        named baseline slices hold or fail as recorded. No optimality
        outside S, no negation-map constant, no elliptic-curve claim.
      nearby_object_control: >-
        NULL-B composite l = 2062 = 2*1031: instruments must disagree.
        NULL-A random three-sequence walk at l = 1031: covered-set counter
        is not applicable; report the simulated mean only.
    proof_obligations:
      - claim: Collision types are linear in x with unit coefficients; no self-collisions in range.
        responsibility: correctness
      - claim: The two instruments compute the same |C_n| on prime l.
        responsibility: interface
      - claim: One-giant and classical BSGS slices reproduce 4/3 and 0.5625 within the stated tolerances.
        responsibility: baseline
      - claim: Nothing is claimed beyond S, l prime, additions as cost unit, no negation map.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: generic prime-order DLP average-case constant of two-grumpy-giants-and-a-baby
    prior_best: conjectural 1.25 sqrt(l) (GWZ 2017 landing page, retrieved; unread PDF)
    time_exponent: 0.5
    memory_exponent: 0.5
    hidden_cofactor: 'O(1) additions claimed; Stage 1 does not certify the residual law (Theorem B unauthorized)'
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        Drifting-lattice averaging for b-h overlaps (IDEA-20260906-7bd805).
        Not tested in Stage 0-1.
      random_model_justification: >-
        Residues of k(m+1)/2 mod m are an arithmetic progression.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: Stage 2 pairwise-overlap deviation exceeding 4 sqrt(l) (unauthorized here)
    - id: H2
      formal_statement: >-
        Phase completeness of the m-window (IDEA-20260906-7bd805). Not tested
        in Stage 0-1.
      random_model_justification: m -> phi is a rotation-like sequence on a window of width sqrt(l)/4.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: largest phi gap exceeding 8/sqrt(l) on a Stage 2 ladder (unauthorized here)
  structural_ingredients:
    - description: Bernstein-Lange two grumpy giants and a baby; 23/32 success at 1.5 sqrt(l)
      citation: IACR ePrint 2012/294 abstract (KN-LIT-7291)
      provenance: retrieved
      verified_by: TASK-20260906-faad4d (abstract pages only; full text unread)
      role: schedule family and fixed-budget anchor
    - description: GWZ conjectural grumpy constant 1.25
      citation: Galbraith-Wang-Zhang AMC 11(3) 2017 landing page / ePrint 2015/605
      provenance: retrieved
      verified_by: TASK-20260906-faad4d (landing page only; PDF unread)
      role: comparison row, not a Stage 1 success criterion
  reduction_chain:
    core_problem: exact all-target mean of a declared grumpy-giants schedule on Z/l
    corollaries: []
  predictions:
    - metric: M1 two-instrument integer agreement on frozen primes
      direction: different
      minimum_effect: exact equality of |C_n| and of the mean numerator on every prime fixture; forced disagreement on l=2062
    - metric: M2 baseline slices
      direction: different
      minimum_effect: >-
        (1,1,0) mean/sqrt(l) within 2/sqrt(l) of 4/3; classical BSGS
        |C_n|/l at n=1.5 sqrt(l) within 1/sqrt(l) of 0.5625; BL pin is
        existence, not a requirement for statements about S
  test_boundary:
    instances:
      - 'Z/l for l in {1031, 4099, 16411}'
      - 'NULL-B composite l=2062'
      - 'NULL-A random walk at l=1031'
    parameters:
      mu_grid: [1]
      s_grid: [2, 1]
      rate_vectors:
        - [1, 1, 1]
        - [1, 1, 0]
      charging: first_elements_uncharged
    implementation: EXP-GRUMPY-eb8675 Stage 0 pin + Stage 1 two-instrument census
    budget:
      wall_clock_seconds: 1800
      maximum_runs: 1
  falsification_conditions:
    - F1 Stage 0 finds a missing collision type or an in-range self-collision; supersede before any Stage 1 number is read.
    - F2 M1 fails on a frozen prime; no mean is believed until the (n,x) is localised.
    - F3 Baseline slices miss 4/3 or 0.5625 beyond tolerance at all three primes; Theorem A counting is wrong on this instrument.
    - F5 no point of S hits 23/32; the record makes no Bernstein-Lange-instance claim.
    - Timeout or crash is infrastructure, never mathematical evidence.
  interpretation_limits:
    - claim_tier toy for every Stage 1 number
    - No ECDLP exponent movement; no attack; no elliptic finding
    - Theorem B, phase READING 1/2, and the GWZ 1.25 comparison are Stage 2 and unauthorized
    - Novelty versus unread full texts remains unverified
