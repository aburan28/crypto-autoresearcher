        proposed_object: Three prime degrees and two weights.
        predicted_gain: Integer comparisons. No attack cost.
    quantifier_order: >-
      Primality is checked first, then the binomials, then the
      orbits, then the 98-class sum.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class counts and the even-weight index. Not a fibre
        size and not a statement that a trace spectrum helps.
      nearby_object_control: >-
        The undivided binomial 366145 used as the class count,
        and a quadratic count of 66.
    proof_obligations:
      - claim: The quadratic class count at degree 131 is 65.
        responsibility: correctness
      - claim: The cubic class count at degree 131 is 2795.
        responsibility: correctness
      - claim: No weight-3 string of length 131 has a short period.
        responsibility: correctness
    not_applicable_reason: null
