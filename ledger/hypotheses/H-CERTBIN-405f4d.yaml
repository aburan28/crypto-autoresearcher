  title: >-
    Degree 131 has 65 quadratic classes and 2795 cubic classes.
  statement: >-
    C(131, 2) is 8515 and divides by 131 with quotient 65 and
    remainder 0. C(131, 3) is 366145 and divides by 131 with
    quotient 2795 and remainder 0. Every weight-3 string of
    length 131 has rotation orbit 131, so the cubic class count
    is 2795 and not 366145. At degree 17 the quotients are 8 and
    40. At degree 19 they are 9 and 51. Adding 33 cubic classes
    to the 65 quadratic classes gives 98, and 131 minus 98 is 33.
    The nonzero even-weight vectors in a 65-bit space number
    2^64 - 1, which is 18446744073709551615. No weight-3 string
    of length 131 has a shorter period.
  mechanism: >-
    The proposal counts 65 quadratic classes and 2795 cubic
    classes. This contract recomputes those quotients and the
    orbits. It does not evaluate a trace.
  assumptions: []
  proof_search_map:
    bottleneck: The cubic class count at degree 131.
    baseline_embedding:
      parameter_slice: >-
        The class counts written in IDEA-20260926-bbf2ed, read
        2026-10-02. The orbits were enumerated in this design
        session. That enumeration is not a run.
      reproduction_check: >-
        One route divides the binomial by the degree. The other
        enumerates necklaces in a separate module. They must agree.
    observation_collision:
      observable: The cubic class count and the short-period count.
      distinct_preimage_search: >-
        A cubic class count of 366145 is the undivided binomial.
        Reporting it as the class count invalidates the run. A
        quadratic count of 66 is one above 65.
    constructive_transforms:
