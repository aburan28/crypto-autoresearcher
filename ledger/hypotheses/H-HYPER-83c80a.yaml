        Binding question, read from ledger/questions/RQ-HYPER-7ca025.yaml.
        This hypothesis does not claim the Richelot triples agree and does
        not claim an ECDLP exponent improvement.
      verified_by: ledger/questions/RQ-HYPER-7ca025.yaml
