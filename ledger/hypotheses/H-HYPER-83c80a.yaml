# H-HYPER-83c80a — specified from IDEA-20261005-79cb0a.
# Protocol approval is DEC-20261006-9419f4. The source idea lives on
# origin/design/cycle-20261005-domain and is not copied here.
# This record asserts no ECDLP exponent change and does not evaluate a
# Richelot codomain triple. No sextic was built in this design.
hypothesis:
  id: H-HYPER-83c80a
  question_id: RQ-HYPER-7ca025
  source_proposal: IDEA-20261005-79cb0a
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-HYPER-7ca025 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the Prym-dimension protocol in EXP-HYPER-6d92f8 is
    approved for a later executor. It does not mean the dimension 1 was
    observed. Status moves only by DEC-20261006-9419f4 under the standing
    user authorization of 2026-09-06. No function field was built in this
    design.
  proposed_by: coordinator
  conversion_note: >-
    The predicted Prym dimension 1, the lex-first admissible sextic over
    F_11, the repeated-factor control, the ramified control, and the
    arithmetic comparison with the integers (cover genus 4, base
    dimension 1) are carried from IDEA-20261005-79cb0a, which was read
    from origin/design/cycle-20261005-domain. The Coordinator froze the
    genus routine, the valuation list, and the subtraction control before
    any run of EXP-HYPER-6d92f8. EXP-HYPER-d81a41 remains the Richelot
    formula comparison on the same selector. This hypothesis does not
    restate that comparison.

  statement: >-
    TEST BOUNDARY. One sextic over F_11. The sextic is y^2 = f, where f
    is the product of the first admissible triple of monic quadratics in
    the lexicographic order frozen in EXP-HYPER-6d92f8, the same order
    EXP-HYPER-d81a41 uses to name its input. Q1 is the lexicographically
    least factor of that triple. The instrument builds the extension
    w^2 = Q1 of the function field of y^2 = f, lists the valuations of
    Q1, and computes the genus of that extension by a function-field
    genus routine. It does not evaluate a Richelot (U, V, W) triple.

    PRE-REGISTERED PREDICTION, fixed before any run. When the extension
    degree is 2, every valuation of Q1 is even, and the constant field
    of the extension is F_11, the genus equals 3 and the Prym dimension,
    defined as that genus minus 2, equals 1. Any other dimension is a
    negative. Outcome B, in which a check fails and the dimension 1 is
    not obtained, is also a negative. Both are negatives, so success can
    fail.

    DISTINGUISHABLE OUTCOMES. (1) The three controls pass, the extension
    degree is 2, the odd-valuation count is 0, the constant field is
    F_11, the two genus methods agree on 3, and the Prym dimension is 1:
    success for the prediction. (2) The three controls pass, and either
    the recorded Prym dimension is an integer other than 1, or outcome B
    is recorded because the degree is not 2, some valuation is odd, the
    constant field is larger than F_11, or the agreed genus is not 3:
    negative. (3) A control fails, the two genus methods disagree, the
    Weil check fails, or the admissible search is empty: invalid, not
    evidence. (4) A timeout or crash: failed_infrastructure, not evidence.

    No discrete-logarithm algorithm is claimed. No exponent moves. At
    genus 2 the index-calculus exponent in KR-IC-a4dd54 stays 2 - 2/g = 1.

  mechanism: >-
    An etale double cover of a genus-2 curve has genus 3 when
    Riemann-Hurwitz applies with no ramification: 2g - 2 = 2*(2*2 - 2).
    Heuristic H1 says that if Q1 is not a square in the function field of
    y^2 = f and every place has even valuation on Q1, then w^2 = Q1 is a
    geometrically connected etale double cover, the function-field genus
    routine returns 3, and the connected kernel of the norm has dimension
    1. The dimension is reported only after those checks. It is genus
    minus 2, not a number written in by the formula. A second genus
    reading from point counts must agree. The p1498 script's arithmetic
    gate uses cover genus 4, elliptic dimension 1, and Prym dimension 3.
    The same subtraction that returns 1 on the pair (3, 2) must return 3
    on the pair (4, 1). That control is arithmetic. The result JSON of
    that script is not an input, and the script is not run.

  assumptions:
    - The sextic is the first admissible triple in the order shared with EXP-HYPER-d81a41. Q1 is the lexicographically least factor of that triple.
    - H1 identifies an etale geometrically connected double cover with Prym dimension equal to genus minus 2, and predicts that integer is 1 on this factor.
    - The genus used in the dimension is the function-field genus, checked against point counts. It is not obtained by substituting into Riemann-Hurwitz and writing 3.
    - A different quadratic factor is a different run. A failure on Q1 is not repaired by switching factors.
    - Toy scope is one sextic over F_11. No statement about a cryptographic field.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is one function-field genus on a toy sextic, not a theorem,
      bound, certificate, reduction, or closure. Riemann-Hurwitz is the
      prediction the valuation list and the genus routine can reject.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: >-
      KR-IC-a4dd54, soft-O(q^{2-2/g}) for a genus-g Jacobian. At g = 2
      that is soft-O(q), the same power of q as rho on a group of size
      about q^2. Not beaten.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is a genus, a dimension, an
      odd-valuation count, and three control bits. No relation matrix
      is stored.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        If Q1 is not a square in the function field of y^2 = f and every
        place has even valuation on Q1, and the constant field of
        w^2 = Q1 is F_11, then that extension is a geometrically
        connected etale double cover of genus 3, and the connected kernel
        of the norm has dimension 1.
      random_model_justification: >-
        The sample is one sextic, the lex-first admissible triple over
        F_11, plus three controls. There is no random draw and no tail
        across primes.
      supporting_results: []
      validation_experiment_ids:
        - EXP-HYPER-6d92f8
      falsification_condition: >-
        The controls pass and the recorded Prym dimension is an integer
        other than 1, or the controls pass and outcome B is recorded
        because the degree is not 2, some valuation is odd, the constant
        field properly contains F_11, or the agreed genus is not 3.
    - id: H2
      formal_statement: >-
        The subtraction genus(cover) - genus(base) returns 1 on the pair
        (3, 2) and returns 3 on the pair (4, 1). The second pair is the
        cover genus and elliptic dimension written in
        p1498_simple_prym_quotient_obstruction.py. A subtraction that
        swaps those outputs is not a dimension.
      random_model_justification: >-
        This is integer subtraction on two frozen pairs. It is not a
        random model.
      supporting_results: []
      validation_experiment_ids:
        - EXP-HYPER-6d92f8
      falsification_condition: >-
        The subtraction returns 1 on (4, 1), or returns 3 on (3, 2).
        The sextic dimension is then not read.

  structural_ingredients:
    - description: >-
        KR-IC-a4dd54 states that index calculus with double large primes
        on a genus-g Jacobian over F_q costs soft-O(q^{2-2/g}) and beats
        rho for g at least 3. At g = 2 the exponent is 1. This hypothesis
        does not change it.
      citation: KR-IC-a4dd54
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-a4dd54.yaml
      role: unchanged genus-2 cost baseline
    - description: >-
        KR-IC-5ea2f8 states that GHS Weil descent maps an elliptic
        discrete logarithm over an extension to a hyperelliptic Jacobian
        over the base field, for special fields and curves. This cover
        is not that descent.
      citation: KR-IC-5ea2f8
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
      role: scope fence; no GHS descent is run
    - description: >-
        The source lines of p1498_simple_prym_quotient_obstruction.py set
        elliptic_dimension = 1, require prym_dimension == 3, and require
        cover_genus == elliptic_dimension + prym_dimension == 4. The norm
        composed with pullback is the string multiplication by 3. Those
        integers are the arithmetic control. The result JSON was not opened
        and the script was not run.
      citation: inputs/refs/tasks/ecdlp_index_calculus/p1498_simple_prym_quotient_obstruction.py
      provenance: internal
      verified_by: inputs/refs/tasks/ecdlp_index_calculus/p1498_simple_prym_quotient_obstruction.py
      role: arithmetic control integers (4, 1) versus (3, 2)
    - description: >-
        Recalled pointer, text not opened: a degree-2 cover with
        ramification divisor of degree R satisfies
        2g_cover - 2 = 2*(2g_base - 2) + R. R = 0 and g_base = 2 give
        g_cover = 3. The valuation list and the genus routine are what
        this record uses in place of a citation of a proof.
      citation: Riemann-Hurwitz for a degree-2 cover
      provenance: recalled
      verified_by: null
      role: pointer only; the genus that is read is the routine's genus

  reduction_chain:
    core_problem: >-
      Whether the double cover cut out by the lex-least quadratic factor
      of the first admissible sextic over F_11 has Prym dimension 1.
      Not an attack.
    corollaries: []

  predictions:
    - metric: prym_dimension
      direction: different
      minimum_effect: >-
        The dimension equals 1. Any other integer is the negative. Outcome
        B, in which the dimension 1 is not obtained, is also the negative.
    - metric: genus_of_the_extension
      direction: different
      minimum_effect: >-
        When the etale checks pass, the genus equals 3. A different genus
        makes the dimension genus minus 2 different from 1.

  test_boundary:
    instances:
      - the lex-first admissible monic quadratic triple over F_11
      - the lex-least factor Q1 of that triple, as the cover function
      - the repeated-factor triple (x^2+1, x^2+1, x^2+2), as a rejected input
      - the function f on the projective line, as the ramified control
      - the integer pairs (3, 2) and (4, 1), as the subtraction control
    parameters:
      field: F_11
      base_genus: 2
      predicted_prym_dimension: 1
      predicted_cover_genus: 3
      p1498_control_pair: [4, 1]
      p1498_control_difference: 3
    implementation: >-
      A later executor selects the triple, lists valuations, and computes
      the genus. This design does not build the function field.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: One sextic. The second run id is an infrastructure retry, not a second scientific sample.

  falsification_conditions:
    - The controls pass and the recorded Prym dimension is an integer other than 1.
    - The controls pass and outcome B is recorded: the extension degree is not 2, some valuation of Q1 is odd, the constant field properly contains F_11, or the agreed genus is not 3.
    - The subtraction returns 1 on (4, 1) or returns 3 on (3, 2). That failure is invalid, not a sextic negative: the dimension is not read.
    - The repeated-factor triple is accepted. That failure is invalid.
    - The valuation test on f as a function on the projective line reports no odd valuation. That failure is invalid.

  interpretation_limits:
    - Toy scope: one sextic over F_11. No statement about a cryptographic field and no statement about EcGFp5.
    - A Prym dimension of 1 does not move the discrete logarithm on the genus-2 Jacobian into an elliptic curve. The base Jacobian remains dimension 2.
    - KR-IC-a4dd54 at genus 2 stays soft-O(q). This record does not change that exponent.
    - EXP-HYPER-d81a41 remains the Richelot-formula comparison. This record does not compute (U, V, W).
    - The p1498 script remains the dimension-3 cubic Prym. Its result JSON is not an input.
    - q = 11 is one field. A genus of 3 here does not say the same factor is etale over every odd prime.

  citations:
