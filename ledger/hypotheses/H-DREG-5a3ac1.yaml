hypothesis:
  id: H-DREG-5a3ac1
  question_id: RQ-DREG-001

  statement: >-
    SCOPE: boolean chained Semaev (t = 3, ti = 0, m = 3) over GF(2), exact
    Macaulay rank at D = 5, sizes n in {9, 12}; comparison against COMMITTED sem
    ranks, no new sem computation. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO
    PRIME-FIELD TRANSFER, NO H-DREG-001 STATUS CHANGE.
    The rank deficits this goal has measured against the global semi-regular
    reference sr_pred(n,D) - 1,322 at n=12 D5, and the 17,947 / 10,837 pair at
    n=12 D6 - are substantially an effect of the system's VARIABLE-BLOCK
    INCIDENCE PATTERN rather than of elliptic-curve arithmetic. Formally, with
    BMN the uniform ensemble of boolean systems sharing the sem's supports
    exactly (n quadrics on the (U, X3) block, n cubics on the (U, X1, X2) block,
    uniform random coefficients on those supports), and
      D_glob = sr_pred(n,D) - rank_sem,   D_block = E[rank_BMN] - rank_sem,
      s      = D_block / D_glob,
    the claim is s >= 0.50 at n = 12, D = 5. The complementary prediction
    s <= 0.15 is the declared falsifier and is the MORE valuable outcome, because
    a deficit surviving a support-matched null is the strongest toy-scale
    positive this goal can produce.
    THE REASON THIS IS WORTH MEASURING AT ALL is a contradiction already on the
    record: at n = 12, D = 6 the corpus holds TWO null ranks for essentially the
    same column set (174,035 vs 174,033) and the same degree histogram -
    156,520 (arm P, TASK-20260731-016, deficit vs sr_pred exactly 0) and 149,410
    (arm R, EV-SIG-008 N1, deficit 7,110) - so the SAME sem measurement
    (rank 138,573) yields a deficit of 17,947 or 10,837 depending on which null
    is chosen, a 40 per cent spread produced by convention alone. NEITHER null is
    drawn from the sem's supports: arm P deletes columns from a full-support
    system after building it, arm R constructs supports by seeded greedy
    set-cover. The matched null has never been built, and until it is, every
    deficit in this goal is a difference against an object of a different shape.

  mechanism: >-
    WHAT THE REFERENCE ACTUALLY MODELS. sr_pred(n,D) = N(nb,D) - sum_{k<=D} h_k^+
    with h_k the coefficients of H_n(z) = (1+z)^{nb} (1+z^2)^{-n} (1+z^3)^{-n},
    nb = n + 3*ceil(n/3). Reconstructed and validated this session against every
    committed value it should return: sr_pred(9,3..6) = 180 / 1,674 / 9,504 /
    28,068; sr_pred(12,3..6) = 312 / 3,834 / 29,418 / 156,520; nrows(9,6) =
    45,324; nrows(12,5) = 31,512; nrows(12,6) = 183,312. It also recovers three
    committed deficits exactly as sr_pred minus a committed rank -
    29,418 - 28,096 = 1,322 (n=12 D5), 145,881 - 143,882 = 1,999 (n=18 D5), and
    268,674 - 265,950 = 2,724 (n=21 seed 1 D5). So the reference is correctly
    implemented and correctly transcribed; the question is whether it is the
    right object to subtract.

    IT MODELS 2n POLYNOMIALS IN GENERAL POSITION ON ALL nb VARIABLES. The real
    ones are not. Derived from src/semaev_tree.py (see H-DREG-152cff mechanism
    steps 1-2, and IDEA-20260805-90a841): at t = 3 the chain has exactly two S_3
    equations, S_3(u_1, x_1, x_2) and S_3(u_1, x_3, R_X), whose Weil descents
    give n boolean CUBICS supported on (U, X1, X2) - n + 2k variables - and n
    boolean QUADRICS supported on (U, X3) - n + k variables. x_3 never meets x_1
    or x_2. The system is an AMALGAM OF TWO BLOCKS GLUED ALONG U, and the
    reference has averaged that away before it produces a number.

    THE STRUCTURAL REASON A BLOCK SYSTEM SHOULD DIFFER. Evaluating the same
    series construction per block, H_A(z) = (1+z)^{n+k} (1+z^2)^{-n} and
    H_B(z) = (1+z)^{n+2k} (1+z^3)^{-n}, the block freeze degrees are
      phi_A = 4, 5, 6, 6, 6, 7, 7, 8, 9   and   phi_B = 7, 8, 9, 10, 10, 11, 13,
      14, 15   against   phi_full = 6, 7, 8, 8, 9, 9, 10, 11, 12
    at n = 9, 12, 15, 17, 18, 21, 24, 27, 30. The (U, X3) block reaches its own
    freeze degree 2 to 3 degrees earlier than the ambient model expects at every
    rung - at n = 12, h^A = [1, 16, 108, 368, 458, -1104, ...] versus the global
    h = [1, 24, 264, 1724, 7104, 16920, 7494]. Relations internal to a block are
    also cheaper than the ambient model prices them, and each one can be lifted
    by any monomial in the variables its block does not use, a multiplicity of
    C(2k, D-d) for block A. Both effects are invisible to sr_pred.

    THE NAIVE QUANTITATIVE FORM OF THAT MECHANISM IS ALREADY FALSIFIED, AND IT
    IS STATED HERE BEFORE ANY RUN RATHER THAN DROPPED LATER. If the D = 5 deficit
    were block-A freeze lifted by X1-X2 monomials it would require phi_A <= 5,
    which holds at n = 12 but FAILS at n = 15 (phi_A = 6) and beyond - yet the
    committed n = 15 D5 deficit, 1,862, is LARGER than the n = 12 one, 1,322. So
    there is no derived closed form for the block-structured null's Hilbert
    series in hand, and this hypothesis does not pretend to one. THAT IS PRECISELY
    WHY THE DESIGN IS A MEASURED NULL AND NOT A PREDICTED ONE: the matched
    ensemble supplies empirically what no series in this record can supply
    analytically, and the honest gap is recorded as a gap.

    WHAT IS FORCED PRE-RUN, EVEN WITHOUT THAT SERIES. The BMN's COLUMN SET is
    forced exactly, because it is a function of the supports alone (H-DREG-152cff):
      ncols(9,5) = 11,032   ncols(9,6) = 29,332
      ncols(12,5) = 46,717  ncols(12,6) = 174,035
    with the last two of these committed. So the construction is checkable before
    any rank is computed, and a BMN whose column count misses these is not
    matched and the run stops. That is the cheapest decisive gate in the design.

    WHAT s MEASURES, AND WHY NOBODY HAS IT. s is the share of the measured
    departure attributable to support incidence rather than to the curve. It has
    never been computed at any cell in this program. A large s means the five
    committed D5 deficits are largely a combinatorial artifact of how the chained
    system distributes variables among equations - which changes their reading
    without making the ECDLP any easier. A small s means the departure survived
    the strongest control available at toy scale, which is a real positive and is
    what this goal exists to look for.

  assumptions:
    - >-
      That the sem's per-equation supports are recoverable from a committed
      system hash (EXP-DREG-004 records prefix 0da7ff6aa40007e8) or rebuildable.
      Sage is ABSENT in the container verified this session, so a rebuild here is
      impossible and the fallback is the BLOCK-TEMPLATE null, whose supports are
      generated from the derived block-incidence pattern rather than copied from
      the sem. The fallback matches block structure but not per-equation support
      and is strictly weaker; every number produced under it must say so on its
      face. Which of the two was used is a required artifact.
    - >-
      That exact GF(2) rank is reachable without Sage at the budgeted cells. A
      bit-packed elimination over numpy uint64 at n = 9 D5 (11,032 columns x
      10,440 rows, ~15 MB) and n = 12 D5 (46,717 x 31,512, ~184 MB) is arithmetic
      this container can do. n = 12 D6 (174,035 x 183,312) is NOT budgeted and is
      explicitly out of scope; the committed CTRL-B run needed 7.16 GB and
      1,623.8 s under Sage for a cell of that size.
    - >-
      That rank_sem at the compared cells is read from committed artifacts and
      never recomputed here. rank_sem(12,5) = 28,096 is taken from the h012c
      instrument's own declared validation gate (src/h012c_block_m4ri.py header:
      "Validation gates: n=12 sem D5 ti0 -> 28096 ; n=18 sem D5 ti0 -> 143882"),
      which is a SOURCE COMMENT, not a run receipt. Resolving it to a run receipt
      is a stage-0 obligation, and if it cannot be resolved the n = 12 comparison
      is reported as unresolved rather than made.

  proof_search_map:
    bottleneck: >-
      The comparator. Every deficit this goal has produced, and the decision the
      goal's completion criterion will be made on, is a subtraction against
      sr_pred. If sr_pred is the wrong shape, the ladder can be run to n = 24
      without the answer improving. The two existing nulls disagreeing by 7,110
      at the one cell where both exist is direct evidence that the comparator
      convention moves numbers of the same order as the effect.
    baseline_embedding:
      parameter_slice: >-
        The FULL-SUPPORT random null at n = 12, D = 6, where the committed
        BATCH-002 calibration records rank = sr_pred = 156,520 exactly, deficit 0.
        That cell is the baseline the instrument must reproduce: a full-support
        null lands on the semi-regular prediction. The design reproduces the same
        behaviour one degree lower and at a second n (n = 9 D5, forced 9,504;
        n = 12 D5, forced 29,418), which is where it is affordable.
      reproduction_check: >-
        NUMERICAL AND EXACT, and it can fail. The full-support null arm must
        return rank exactly 9,504 at n = 9 D5 and exactly 29,418 at n = 12 D5. A
        rank near those values is not a reproduction; the committed calibration
        is an exact equality and so is this one. If it fails, a second
        implementation (the Sage-based h012c engine, in an environment that has
        it) must be used before any other arm is read, and if the two
        implementations disagree that is an INFRASTRUCTURE finding under
        AGENTS.md rule 5, never mathematical evidence.
    observation_collision:
      observable: >-
        The single integer rank at a cell, and the derived deficit against a
        chosen reference.
      distinct_preimage_search: >-
        A COLLISION IS COMMITTED AND IS THE REASON THIS HYPOTHESIS EXISTS. At
        n = 12, D = 6, two null objects with essentially identical column sets
        (174,035 vs 174,033) and identical degree histograms {2:12, 3:12} give
        ranks 156,520 (arm P, seed 2026) and 149,410 (arm R, seed 2). The
        observable "deficit of the sem" is therefore NOT determined by
        (n, D, column set, degree histogram) - it is determined only once the
        null CONSTRUCTION is fixed. H-SDEG-0dd021 proposes the arm rule as the
        separating condition and tests it by modelling. This hypothesis proposes
        the complementary separator: fix the construction by forcing the null's
        supports to equal the sem's, so no convention remains to choose. If the
        BMN's rank lands at neither 156,520 nor 149,410 at that cell, there are
        THREE conventions and the corpus has been comparing against a menu.
        (That cell is out of this experiment's budget and the statement is
        recorded as a prediction for whoever can afford it.)
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the supports fixed and vary the forgotten structure - the
          coefficients, hence the curve, R_X, B_curve and the basis. The
          intrinsic invariant proposed to distinguish the sem from the ensemble
          is its RANK RESIDUAL after the ensemble mean is subtracted, i.e.
          D_block.
        predicted_gain: >-
          If D_block is within the ensemble's own seed-to-seed spread, no
          intrinsic invariant has been exhibited and the sem is not distinguished
          from a random member of its support class by rank at that degree. That
          is a clean, reportable, control-backed negative and it fires at a cost
          this container can pay.
      - transform: stronger_compositional_invariant
        proposed_object: >-
          Preserve the per-equation support (not merely the block pattern and not
          merely the degree histogram) when constructing the null, because the
          support is what survives the Macaulay construction deterministically
          while coefficients do not.
        predicted_gain: >-
          Removes the column-set difference from the comparison entirely, by
          construction and checkably (forced column counts above), which is
          exactly the confound BATCH-002 quarantined the D6 headline for.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FORALL cells (n, D) in the declared boundary,
      EXISTS a share s(n,D) = D_block/D_glob such that s >= 0.50, where D_block is
      an expectation over the null ensemble estimated from >= 3 seeds. NOTE
      CAREFULLY WHAT IS NOT CLAIMED: not that s is uniform in (n,D), not that a
      single formula predicts it, and not that any witness is instance-uniform.
      The sem side is ONE system per cell and the null side is an ENSEMBLE, so
      the comparison is a point against a distribution and is legitimate only
      with the distribution's spread reported first - which is why spread is a
      primary metric and is reported before any s. If the ensemble spread is
      comparable to D_glob, the quantifier collapses to a distributional
      statement and the claim must be restated as such rather than retained.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that at one or two toy cells (n <= 12, D = 5), a stated fraction
        of the sem's rank deficit against the global semi-regular reference is
        reproduced by a random system sharing its supports. It cannot certify
        anything about d_reg, cannot reach the freeze degree at n = 12
        (phi_full = 7), cannot support or reject the polynomial-solve scenario,
        cannot move an exponent, and cannot license a status change on H-DREG-001
        or H-SIG-001 - only the Coordinator may make one (AGENTS.md rule 1).
      nearby_object_control: >-
        THE BLOCK-PERMUTED NULL: same block sizes (n, k, k, k), same degree
        histogram, but the degree-3 family placed on (U, X3) and the degree-2
        family on (U, X1, X2). Its column count differs from the true one in a
        computable way, so it is a genuinely nearby object on which the
        hypothesis's mechanism should NOT hold in the same form. A measurement
        that cannot separate the true block pattern from its permutation is
        responding to block SIZES, not to incidence, and has not identified the
        load-bearing structure. A SECOND nearby control, and the more important
        one: the FULL-SUPPORT null, where the hoped-for conclusion fails by
        construction - its deficit is forced to be exactly 0, and if the
        instrument reports otherwise nothing else may be read.
    proof_obligations:
      - claim: The BMN's column set equals the sem's exactly.
        responsibility: correctness
      - claim: The full-support null returns deficit exactly 0 at both budgeted cells.
        responsibility: baseline
      - claim: >-
          The ensemble's seed-to-seed rank spread is small relative to the
          deficits being compared, reported before any comparison.
        responsibility: strictness
      - claim: >-
          rank_sem at each compared cell resolves to a committed run receipt, not
          to a source comment.
        responsibility: interface
      - claim: >-
          Exact GF(2) rank, with per-chunk pivot accounting summing to the
          reported rank.
        responsibility: correctness
      - claim: >-
          A timeout, OOM or missing dependency is infrastructure signal, never
          negative mathematical evidence.
        responsibility: runtime
      - claim: >-
          Nothing transfers to D near d_reg, to t >= 4, or to prime fields.
        responsibility: scope
    not_applicable_reason: null

  heuristic_assumptions:
    - id: HEUR-BMN-1
      formal_statement: >-
        ENSEMBLE CONCENTRATION. For fixed supports, the exact GF(2) rank of the
        degree-D Macaulay matrix of a uniformly random system on those supports
        concentrates: the seed-to-seed spread at the budgeted cells is small
        relative to the deficits under comparison (order 10^3).
      random_model_justification: >-
        NOT PROVED, AND IT IS THE LOAD-BEARING ASSUMPTION OF THE WHOLE DESIGN.
        The usual general-position argument predicts concentration but bounds no
        fluctuation. In-corpus partial support: at n = 12 D6 the sem's own rank
        moves only from 138,570 (seed 2) to 138,573 (seed 2026), a spread of 3
        against deficits of order 10^4; and the full-support null attains sr_pred
        exactly wherever it has been measured. That is suggestive and is one
        cell. H-SDEG-0dd021's HEUR-BF-1 asserts the stronger property
        (determinism) and records that it has no surviving random-model
        justification; this record asserts the weaker one and measures it.
      supporting_results: []
      validation_experiment_ids: [EXP-DREG-9ac65a]
      falsification_condition: >-
        MEASURED AND REPORTED FIRST, BEFORE ANY s IS COMPUTED. >= 5 seeds at
        n = 9 D5 and >= 3 at n = 12 D5. If the spread at a cell is >= 0.25 *
        D_glob at that cell, the comparison at that cell is WITHDRAWN and the
        cell reports a distribution instead of a share. Zero spread is also a
        failure: it means the ensemble is degenerate (e.g. the coefficient
        sampler is not random) and the null is not a null.
    - id: HEUR-BMN-2
      formal_statement: >-
        SUPPORT SUFFICIENCY. The deficit-relevant difference between the sem and
        a generic system of the same degree histogram is carried by the supports,
        so an ensemble matched on supports is the correct null.
      random_model_justification: >-
        THIS IS THE HYPOTHESIS UNDER TEST, NOT AN ASSUMPTION GRANTED TO IT, and
        it is listed here because the INTERPRETATION of a small s depends on it.
        If there is coefficient-level structure invisible to supports - which is
        entirely possible, since the coefficients encode the curve - then a
        matched null will not capture it and a small s is the right answer for
        the wrong reason.
      supporting_results: []
      validation_experiment_ids: [EXP-DREG-9ac65a]
      falsification_condition: >-
        The block-permuted control. A coefficient-level effect shows up as s
        small at BOTH n = 9 and n = 12 while the permuted control also reproduces
        most of the deficit - i.e. the measurement is insensitive to which blocks
        are which. Report that pattern explicitly if it occurs.

  structural_ingredients:
    - description: >-
        Block-incidence support law, giving the BMN's forced column counts and
        making the construction checkable before any rank is computed.
      citation: >-
        ledger/hypotheses/H-DREG-152cff.yaml (this batch), derived from
        src/semaev_tree.py. NOT independently reviewed at the time of writing;
        if H-DREG-152cff's stage 1 fails, this hypothesis's construction gate
        loses its forced values and must fall back to comparing the BMN's column
        set to the sem's committed set directly.
      role: pre-run verification of the null's matching
    - description: >-
        Global semi-regular series and the sr_pred convention.
      citation: >-
        Re-derived in-repo and validated against 8 committed integers this
        session. Primary literature (Bardet-Faugere-Salvy) is recorded elsewhere
        in this corpus as NOT RETRIEVED AND NOT VERIFIABLE FROM THIS
        ENVIRONMENT; no citation is asserted.
      role: the incumbent reference whose shape is under test
    - description: >-
        Committed calibration that a full-support null attains sr_pred exactly.
      citation: >-
        GOAL-DREG-001 BATCH-002 checkpoint ("null rank=sr_pred=156520, deficit 0
        => calibrated") and EV-DREG-008 certificate_refs.
      role: positive control / sensitivity demonstration

  reduction_chain:
    core_problem: >-
      Determine what fraction of the boolean chained-Semaev rank deficit against
      the global semi-regular reference is reproduced by a random system sharing
      the sem's supports.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No corollary about d_reg, about the polynomial-solve
      scenario, about cost, or about prime fields follows from a D = 5 rank
      comparison at n <= 12. In particular this does NOT bear on KN-OPEN-002,
      whose question is prime-field solving-degree growth.

  predictions:
    - metric: >-
        C1 - construction gate: column count of the block-matched null at
        n=9 D5, n=9 D6, n=12 D5, n=12 D6
      direction: different
      minimum_effect: >-
        'EXACTLY 11,032 / 29,332 / 46,717 / 174,035, zero tolerance. A mismatch
        means the null is not matched and TERMINATES the run before any rank.'
    - metric: >-
        C2 - positive control: deficit of the FULL-SUPPORT random null against
        sr_pred at n=9 D5 and n=12 D5
      direction: different
      minimum_effect: >-
        'EXACTLY 0, i.e. rank exactly 9,504 and exactly 29,418. This reproduces
        the committed n=12 D6 calibration one degree lower and at a second n. If
        it is not exactly 0, the instrument is broken and NO negative result may
        be reported from any arm.'
    - metric: >-
        C3 - spread: seed-to-seed spread of rank_BMN at each cell, reported
        BEFORE any comparison to rank_sem
      direction: lower
      minimum_effect: >-
        'Strictly between 0 and 0.25 * D_glob at that cell (i.e. between 0 and
        ~330 at n=12 D5). Zero spread is an instrument failure; spread >= 0.25 *
        D_glob withdraws the comparison at that cell.'
    - metric: >-
        C4 - THE HYPOTHESIS: s = (E[rank_BMN] - rank_sem) / (sr_pred - rank_sem)
        at n = 12, D = 5, against rank_sem = 28,096 and D_glob = 1,322
      direction: higher
      minimum_effect: >-
        's >= 0.50, i.e. E[rank_BMN] >= 28,757. FALSIFIER: s <= 0.15, i.e.
        E[rank_BMN] <= 28,294. The band 0.15 < s < 0.50 is pre-declared
        INCONCLUSIVE at this cell and must be reported as such, not narrated
        toward either side.'
    - metric: >-
        C5 - second rung: the same s at n = 9, D = 5
      direction: higher
      minimum_effect: >-
        's >= 0.50 with the same falsifier band. NOTE: rank_sem(9,5) is not
        established in this record, so this rung is conditional on resolving it
        from a committed artifact; if it cannot be resolved, the rung reports
        rank_BMN and its spread and no s.'
    - metric: >-
        C6 - graded control, 5 interior points, monotonicity reported: deficit of
        a null interpolating from block supports (f = 0) to full supports (f = 1)
        at n = 9, D = 5
      direction: lower
      minimum_effect: >-
        'Monotone decrease in f, reaching EXACTLY 0 at f = 1. A quantity that
        fails to decay as the parameter meant to destroy it increases is the
        canonical artifact tell; a non-monotone curve localises the effect to a
        named cross-block monomial class instead of leaving "it did not work".'
    - metric: >-
        C7 - nearby-object control: deficit of the BLOCK-PERMUTED null at
        n = 9, D = 5
      direction: different
      minimum_effect: >-
        'Different from the true block-matched null''s deficit by more than the
        seed spread. If indistinguishable, the measurement responds to block
        sizes rather than incidence and HEUR-BMN-2 is unsupported.'

  test_boundary:
    instances:
      - >-
        Boolean chained Semaev, t = 3, ti = 0, m = 3; sem ranks read from
        committed artifacts only, never recomputed in this experiment.
      - >-
        Null arms: BMN (block-matched, supports = the sem's or, declared, the
        derived block template), FULL (full-support), PERM (block-permuted), and
        the graded family GRAD(f) for f in {0, 0.25, 0.5, 0.75, 1}.
      - >-
        Cells: n = 9 D = 5 (primary, cheap, >= 5 seeds) and n = 12 D = 5
        (decisive, >= 3 seeds). n = 9 D = 6 is an optional stretch OUTSIDE the
        completion gate. n = 12 D = 6 is OUT OF SCOPE and not budgeted.
    parameters:
      t: 3
      ti: 0
      m: 3
      field: GF(2)
      n_values: [9, 12]
      n_optional_out_of_gate: [9]
      degrees: [5]
      degrees_optional: [6]
      nb_by_n: {9: 18, 12: 24}
      k_by_n: {9: 3, 12: 4}
      forced_ncols: {"9,5": 11032, "9,6": 29332, "12,5": 46717, "12,6": 174035}
      forced_srpred: {"9,5": 9504, "12,5": 29418}
      committed_sem_ranks_to_resolve: {"12,5": 28096}
      null_seed_counts: {"9,5": 5, "12,5": 3}
    implementation: >-
      Pure Python construction of the null systems (random GF(2) coefficients on
      prescribed supports) plus a bit-packed numpy uint64 Gaussian elimination
      over column chunks, with per-chunk new-pivot accounting so the reported
      rank is the sum of per-chunk pivots and is auditable. NO SAGE IS REQUIRED
      FOR ANY NULL ARM - verified this session that numpy 2.4.6 is present and
      that `import sage` fails, so src/semaev_tree.py and src/h012c_block_m4ri.py
      cannot run here. That is precisely why the design compares against
      COMMITTED sem ranks instead of recomputing them.
    budget:
      stage0_wall_clock_seconds: 900
      stage1_wall_clock_seconds: 1800
      stage2_wall_clock_seconds: 3600
      stage3_wall_clock_seconds: 21600
      maximum_memory_gb: 4
      maximum_runs: 40
      note: >-
        n = 12 D5 dominates the budget (46,717 columns x 31,512 rows, ~184 MB
        packed). If it exhausts wall clock, that is failed_infrastructure and the
        experiment reports the n = 9 rung plus an infrastructure receipt; it is
        NEVER reported as a null result at n = 12 (AGENTS.md rule 5).

  falsification_conditions:
    - >-
      F1 (THE CONSTRUCTION GATE, MINUTES, TERMINATES THE RUN) - the BMN's column
      count differs from the forced value at any cell. The null is not matched;
      nothing downstream is reportable and the cheapest possible refutation of
      the design has fired.
    - >-
      F2 - the full-support null's deficit is not exactly 0 at n = 9 D5. The
      instrument is broken. NO negative result is reported (AGENTS.md rule 5,
      inventor protocol section 3).
    - >-
      F3 (THE HYPOTHESIS'S OWN FALSIFIER, AND THE MORE VALUABLE OUTCOME) -
      s <= 0.15 at n = 12 D5 with spread within bounds. The deficit is NOT
      substantially block incidence; it survived a support-matched null; the
      goal gains its strongest toy-scale positive and this hypothesis is
      rejected in scope.
    - >-
      F4 - ensemble spread >= 0.25 * D_glob at a cell, or spread exactly 0. The
      comparison at that cell is withdrawn and a distribution (or an instrument
      failure) is reported instead.
    - >-
      F5 - rank_sem(12,5) = 28,096 cannot be resolved to a committed run receipt.
      The n = 12 comparison is reported UNRESOLVED. A source-code comment is not
      a run receipt and may not be treated as one.
    - >-
      F6 (THE PLANNED NEGATIVE, PRE-REGISTERED) - whatever s comes out, the batch
      must emit the BMN's rank, its spread, the graded curve and the permuted
      control at every cell it reached. A run that reports only s has not
      finished, and a run that reports s without the spread reported first is
      inadmissible.

  interpretation_limits:
