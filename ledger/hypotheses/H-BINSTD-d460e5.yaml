# packet. No AUXIN. No Bedrock. No curve attack / exponent claim. No n≥131.
# =============================================================================
hypothesis:
  id: H-BINSTD-d460e5
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-92aa34
  experiment_id: EXP-BINSTD-9d67ed
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-5c1347
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-5c1347
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-5c1347
  proposed_by: coordinator

  title: >-
    After Karabina auxiliary symmetrisation on toy binary S_3 cells, median
    residual nonlinear clause density C_nl/N_var stays ≤ α=3

  statement: >-
    CLAIM (heuristic_validation / encoding-residue instrument; NO ATTACK;
    NO EXPONENT). For each Stage-1 cell (n,ℓ)∈{(17,3),(17,4)}, across ≥20
    independent xR targets under a shared encoder pin, after the frozen
    Karabina auxiliary change of variables (S=x1+x2, P=x1 x2 plus symmetric
    S3), median C_nl/N_var ≤ α with α frozen at 3 — OR the band fails
    (symmetrisation-leaves-dense-nonlinear-residue at this scale). Twin
    meters must agree. The unsymmetrised S3 encode is the null (α is not
    claimed on the null; prediction: null median ≥ treated median). NO
    break. NO n≥131 transfer. Distinct from IDEA-20261001-5c936b (wall-time
    race), 99487f (torsion/halving), and 878222 (Trace-linear without
    symmetrisation).

  mechanism: >-
    OBJECT FRAME as IDEA-20261002-92aa34. Representation: FB x-coords in
    V=span{1,t,...,t^{ℓ-1}}. Operation: dual-route Python encode — null
    Weil-descends S_3(x1,x2,xR); treated adds Karabina auxiliaries S,P with
    K1 symmetric S3(S,P), K2 S=x1+x2, K3 P=x1 x2 — then counts residual
    nonlinear Weil-bit clauses C_nl and remaining nonlinear variables
    N_var after pure-linear F2 pivots. Observable: median C_nl/N_var.
    Dual meters (packed-mask vs frozenset-monomial) are the
    dual-implementation control. WHAT IS NEW vs the idea: an in-Python
    residual-density meter (no Magma SAT detector) with frozen α=3.

  assumptions:
    - Frozen ℓ∈{3,4}, α=3, seeds, encoder pin, Karabina auxiliary transform.
    - Pure-Python GF(2^n); no Magma/Sage/AUXIN/Bedrock.
    - Residue density ≠ wall-time race ≠ torsion cost ratio.
    - C_nl/N_var ≤ α ≠ practical binary IC (KR-IC-1fcdbc).

  predictions:
    - metric: median_Cnl_over_Nvar_treated
      direction: upper_bounded
      minimum_effect: '≤ α=3 at each Stage-1 cell'
    - metric: completed_target_count
      direction: lower_bounded
      minimum_effect: '≥ 20 targets per cell'
    - metric: null_unsymmetrised_Cnl_over_Nvar
      direction: larger_or_equal
      minimum_effect: 'null median ≥ treated median'
    - metric: twin_agreement
      direction: same
      minimum_effect: 'C_nl and N_var path A = path B on every measured target'

  test_boundary:
    instances:
      - 'Stage 0: freeze α=3, pin, seeds, Karabina transform; twin probe on (17,3)'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3),(17,4)} ≥20 targets treated+null'
    parameters:
      alpha: 3
      n_targets: 20
      target_seed: 2026100302
      pin_seed: 2026100301
      moduli:
        - {n: 17, polynomial: 't^17+t^3+1'}
        - {n: 19, polynomial: 't^19+t^5+t^2+t+1'}
        - {n: 23, polynomial: 't^23+t^5+1'}
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-9d67ed/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Dual meters in encode_residue.py. No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin meters disagree on any measured target (O-ARTIFACT).
    - Median treated C_nl/N_var > 3 at a completed Stage-1 cell (O-FAIL-BAND).
    - Median treated ≤ 3 but null median < treated (O-FAIL-NULL).
    - Editing α after seeing densities.
    - Claiming practical binary IC or an exponent move from a toy residue band.
    - Transferring the band to n≥131 without a new contract.
    - Counting linear Trace/K1/K2 clauses as nonlinear residue.
    - Equating this meter with a Karabina vs XOR-SAT wall-time race (5c936b).

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; ≥20 targets; median treated ≤ 3 on every Stage-1 cell;
        null median ≥ treated. Residue band holds at toys. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; ≥20 targets; median treated > 3 on at least one Stage-1
        cell. Symmetrisation-leaves-dense-nonlinear-residue at this scale.
    - id: O-FAIL-NULL
      meaning: >-
        Twin OK; ≥20; treated band holds; but null median < treated
        (symmetrisation increased density).
    - id: O-INCONCLUSIVE
      meaning: Fewer than 20 completed targets on a Stage-1 cell.
    - id: O-ARTIFACT
      meaning: Twin disagreement or N_var=0 with leftover C_nl. No band claim.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never
        negative evidence against H-BINSTD-d460e5.

  interpretation_limits:
    - Encode-residue density only; does not claim solve-time or yield win.
    - Shared encoder pin; a different pin needs a new idea/contract.
    - Clause classification is pin-dependent.
    - Stage-2 n∈{19,23} not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.

  heuristic_assumptions:
    - id: HEUR-BINSTD-92aa34-H1
      formal_statement: >-
        FORALL Stage-1 cells (n,ℓ)∈{(17,3),(17,4)}: across ≥20 independent
        xR targets, median C_nl/N_var after Karabina auxiliary
        symmetrisation ≤ α with α frozen at 3.
      random_model_justification: >-
        Rigorous: KR-IC-8b9daa / KR-IC-955fd6 argue that symmetric
        coordinates remove redundant monomials from the descended system.
        Classical: if the remaining system is near-linear after the
        auxiliary change of variables, residual nonlinear density is
        bounded by a small α independent of n at fixed ℓ; if hidden
        high-degree structure survives (beyond the P=x1 x2 bilinear
        block), the band fails. The α band is the pre-registered transfer
        hypothesis at toys — not a claim that symmetrisation beats rho.
      supporting_results:
        - KR-IC-8b9daa
        - KR-IC-955fd6
        - KR-IC-1fcdbc
      validation_experiment_ids:
        - EXP-BINSTD-9d67ed
      falsification_condition: >-
        Median C_nl/N_var > 3 at a completed Stage-1 cell
        (symmetrisation-leaves-dense-nonlinear-residue), OR twin failure
        (O-ARTIFACT), OR fewer than 20 completed targets (O-INCONCLUSIVE).

  asymptotic_claim: null

  structural_ingredients:
    - description: Karabina symmetric-function / Weil-restriction PDP reformulation.
      citation: KR-IC-8b9daa
      provenance: retrieved
      verified_by: IDEA-20261002-92aa34 prior_art / frontier map
      role: treated encoding
    - description: S_m symmetry / torsion can cut PDP cost; not a residue-density band.
      citation: KR-IC-955fd6
      provenance: retrieved
      verified_by: IDEA-20261002-92aa34 prior_art / frontier map
      role: nearby mechanism, not this meter
    - description: Binary summation stays slower than rho; residue band ≠ beat-rho.
      citation: KR-IC-1fcdbc
      provenance: retrieved
      verified_by: IDEA-20261002-92aa34 prior_art / frontier map
      role: scope ceiling

  dominated_by: >-
    CHECKED KR-IC-8b9daa dominates as the symmetrisation mechanism;
    this hypothesis only adds a frozen residual nonlinear-density band
    with an in-Python dual-route meter.
  sota_delta:
    time: n/a — no attack
    memory: n/a
    data_queries: >-
      First pre-registered α=3 band for residual nonlinear clause density
      after Karabina auxiliary symmetrisation on RQ-BINSTD toys, separated
      from solver races and torsion cost ratios.

  proof_search_map:
    bottleneck: >-
      Whether Karabina auxiliary symmetrisation leaves residual nonlinear
      clause density C_nl/N_var ≤ 3 on named toy cells, measured by an
      in-Python dual-route meter (not a Magma SAT detector).
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, first frozen target xR; twin C_nl and twin N_var must
        agree on both treated and null encodes before any α-band reading.
      reproduction_check: >-
        Independent check.py recomputes the Stage-0 probe and Stage-1
        row0 with the same Field/encode_residue paths; refuses JSON n
        keys that are strings; refuses band outcomes without ≥20 targets
        and twin_ok.
    observation_collision:
      observable: 'the pair (C_nl, N_var) per (encode, xR) under the frozen pin'
      distinct_preimage_search: >-
        Null unsymmetrised encode is the nearby-object control; α is not
        claimed on the null. Twin A/B disagreement is the collision tell.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Karabina auxiliaries S=x1+x2 (linear) and P=x1 x2 (bilinear)
          plus F2-linear symmetric S3(S,P); residue is the bilinear block.
        predicted_gain: >-
          A decidable O-SUPPORT/O-FAIL-BAND (or O-FAIL-NULL) at toys
          without a solver bake-off.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3) and (17,4): ≥20 targets THEN median
      treated density ≤ 3 predicted. NOT CLAIMED: n∈{19,23} under this
      card; n≥131; any attack; solver wall-time.
    method_ceiling:
      strongest_certifiable_claim: >-
        On named Stage-1 toys under the frozen pin, either the α=3 band
        holds, fails, or the null-order prediction fails, with twin
        agreement; encode-residue only.
      nearby_object_control: >-
        Unsymmetrised S3 encode (null); twin disagreement (artifact);
        N_var=0 with leftover C_nl (artifact).
    proof_obligations:
      - claim: Twin C_nl/N_var paths agree on every measured target.
        responsibility: baseline
      - claim: JSON freeze files store n and ell as integers in list rows, never as object keys.
        responsibility: interface
      - claim: Median treated density ≤ 3 after ≥20 targets (or a named O-* stop).
        responsibility: success_probability
      - claim: Null encode is measured and does not silently become the treated meter.
        responsibility: baseline
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
