hypothesis:
  id: H-ECDLP-30a2a1
  question_id: RQ-ECDLP-002
  title: >-
    The Semaev factor base may be indexed by a degree-d map E -> P^1 for any
    d >= 2, and the resulting generalised summation relation has a Newton
    polytope and per-variable degree that are functions of the chosen map --
    a regime the monodromy universality of KN-FIND-a1f3c2 does not cover,
    because that finding is a statement about the degree-2 x-coordinate cover
    alone
  statement: >-
    Source proposal IDEA-20260808-2e14f7 (RQ-ECDLP-002, class representation).
    For E/F_p ordinary with p greater than 3, let D be an effective divisor
    class of degree d on E and u_D the associated degree-d map E -> P^1. A
    window W in P^1(F_p) of size B defines a factor base V equal to the set of
    F_p-rational points of u_D^{-1}(W). THREE SEPARABLE CLAIMS, IN DECREASING
    STRENGTH OF THE EVIDENCE THIS HYPOTHESIS CAN OFFER.
    C1 (CURVE-FREE, PROVED NOT MEASURED). The expected size of V is
    d times B times (1 + O(B^{-1/2})) and the Frobenius cycle-type
    distribution on fibres is the Chebotarev distribution of the Galois
    closure of u_D. Both statements hold for ANY degree-d cover of P^1 by ANY
    smooth curve and use no group law, so neither is evidence about elliptic
    curves or the ECDLP. They are recorded here as a derivation and as an
    instrument check, never as an arm.
    C2 (CURVE-BOUND, THE ACTUAL CLAIM). The generalised summation relation --
    eliminate the point coordinates from u_D(P_1), ..., u_D(P_m) subject to
    P_1 + ... + P_m = R -- exists only because E carries a group law. Its
    per-variable degree and Newton polytope are functions of d and of the
    divisor class, and for d = 3, m = 3 the per-variable degree is strictly
    greater than the degree-2 value 4.
    C3 (SCOPE CORRECTION). KN-FIND-a1f3c2's monodromy C_2^(m-2) is derived
    from the splitting field generated by y_i with y_i^2 = f(x_i), i.e. from
    the quadratic extensions attached to the x-coordinate cover. Read verbatim
    (knowledge/findings/KN-FIND-a1f3c2.md lines 37 to 41 by this coordinator
    session), it therefore quantifies the d = 2 case only, and a degree-d
    cover with d greater than 2 is outside its stated terms. Confirming that
    the degree-3 Galois closure is not contained in an elementary abelian
    2-group is a scope correction to that finding, not an attack.
  mechanism: >-
    A degree-2 map forces the addition relation into the biextension or Kummer
    form and forces per-variable degree 2^(m-1) after elimination. A degree-3
    map has fibres of size 3, so a window of size B supplies about 3B points.
    The trade under test is that fibre multiplicity buys factor-base size
    without consuming the coefficient-bound budget that limits small-root
    reach, while elimination through a larger fibre raises the per-variable
    degree. The hypothesis asserts only that the two effects are separately
    measurable and that the second is computable symbolically at d = 3, m = 3.
    It asserts nothing about which effect wins, because the reach functional
    that would decide it is not resolvable in this program (see
    interpretation_limits).
  assumptions:
    - E/F_p ordinary, p greater than 3, and d less than p so that separable
      degree-d maps from effective divisor classes exist.
    - Elimination is performed by resultants in the same convention used for
      Semaev polynomials, and that convention is frozen before any degree-3
      computation is run.
    - >-
      PRIMITIVITY IS A THEOREM AT d = 3, NOT AN ARM. A degree-3 map cannot
      factor through a degree-2 map, because degrees of maps of curves are
      multiplicative and 2 does not divide 3. The source proposal's
      falsification condition "every primitive degree-d map factors through
      the Kummer quotient" is therefore forced false at d = 3 by algebra and
      cannot fire there. It is a live condition only at d = 4, where the
      factorisation 4 = 2 times 2 is available, and the experiment moves it to
      that cell rather than retaining a discriminator that cannot move.
  proof_search_map:
    bottleneck: >-
      The per-variable degree of the eliminated summation relation. It is the
      only quantity in the solve stage that the choice of map changes and that
      no committed record in this program has computed for d greater than 2.
    baseline_embedding:
      parameter_slice: >-
        d = 2, m = 3. The construction must return the standard fourth Semaev
        polynomial with per-variable degree 4, and the monodromy computation
        must return a group inside C_2^(m-2) in agreement with KN-FIND-a1f3c2.
      reproduction_check: >-
        Symbolic equality of the d = 2 output with the committed S_4 expression
        used by RQ-ECDLP-002 records, checked as exact polynomial identity in
        Z[x1,x2,x3,A,B] rather than by support count.
    observation_collision:
      observable: >-
        The pair consisting of the Newton polytope and the Galois group of the
        fibre cover.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE REASON THE CURVE-FREE ARM IS A PROOF
        RATHER THAN AN EXPERIMENT. Fibre multiplicity d and generic S_d
        monodromy are produced by every degree-d cover of P^1, elliptic or
        not, so an observation of either separates nothing about E. What
        cannot be reproduced without a group law is the summation relation
        itself, so the identifying observable is the polytope of that
        relation and nothing upstream of it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The factor base indexed by u_D^{-1}(W) for a degree-3 map in place of
          the x-coordinate preimage, with the summation relation re-derived in
          that indexing.
        predicted_gain: >-
          d-fold factor-base size per unit of coefficient-bound budget, paid
          for by a per-variable degree strictly above 4 and by a branch
          ambiguity of d^m per candidate rather than 2^(m-2).
      - transform: stronger_invariant
        proposed_object: >-
          The Galois group of the Galois closure of u_D as an invariant of the
          indexing, replacing the implicit assumption that every factor-base
          indexing is the Kummer quotient.
        predicted_gain: >-
          A stated scope qualifier that every future citation of
          KN-FIND-a1f3c2 must carry.
    quantifier_order: >-
      FOR the fixed prime set and FOR d in the tested set, THERE EXISTS a
      symbolic generalised summation relation whose per-variable degree and
      Newton polytope are computed exactly. NOT CLAIMED: any statement
      quantified over all divisor classes of degree d, over all p, or over the
      moduli of degree-d maps. NOT CLAIMED: that any measured polytope implies
      anything about solve cost, since the reach functional is not evaluated
      here.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested primes and for the named degree-3 divisor classes, the
        generalised summation relation has the stated per-variable degree and
        Newton polytope, and the Galois closure of the cover has the stated
        group. It cannot certify universality over the moduli of degree-3
        maps, and it cannot certify any cost consequence.
      nearby_object_control: >-
        A degree-3 map from a genus-2 curve to P^1 at matched fibre size. The
        multiplicity and cycle-type statistics must be indistinguishable from
        the elliptic case, and the summation relation must fail to exist at
        all. A method that reports a summation-relation polytope there has not
        identified the group law as the load-bearing structure.
    proof_obligations:
      - claim: d = 2 reproduces the committed fourth Semaev polynomial exactly.
        responsibility: baseline
      - claim: A degree-3 map cannot factor through a degree-2 map.
        responsibility: correctness
      - claim: The degree-3 summation relation exists and is computable at m = 3.
        responsibility: feasibility
      - claim: Its per-variable degree strictly exceeds 4.
        responsibility: strictness
      - claim: Fibre multiplicity and cycle type are curve-free.
        responsibility: scope
      - claim: No cost or reach consequence is asserted.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For a primitive separable degree-d map u_D from E/F_p to P^1 and a
        window W in P^1(F_p) of size B, the number of F_p-rational points of
        u_D^{-1}(W) is d times B times (1 + O(B^(-1/2))), with the implied
        constant depending only on d and on the genus.
      random_model_justification: >-
        Frobenius cycle types on the fibres of the Galois closure equidistribute
        over the conjugacy classes of the Galois group, so the expected number
        of rational points in a fibre is the number of fixed points of a
        uniformly random group element, which is 1 by Burnside for a transitive
        action; summed over B fibres this gives B, and counting with the
        multiplicity of the cover gives dB for the point count over the window.
      supporting_results:
        - ref: >-
            Chebotarev density for function fields with a Weil-bound error term,
            and the Riemann hypothesis for curves over finite fields
          provenance: recalled
          claim: >-
            Equidistribution of Frobenius conjugacy classes in the Galois group
            of a cover of curves over F_p, with error O(q^(-1/2)) per fibre.
            Pointer only, hedged. No agent in this program has opened a source
            for this statement, so it may not discharge this heuristic.
          verified_by: null
      validation_experiment_ids: [EXP-ECDLP-8748c4]
      falsification_condition: >-
        The measured ratio of the count of u_D^{-1}(W) to B, averaged over
        1000 random windows at fixed d, differs from d by more than the stated
        3-sigma band at any tested prime.
    - id: HEUR-002
      formal_statement: >-
        For a generic degree-3 divisor class on E/F_p, the Galois group of the
        Galois closure of u_D over F_p(P^1) is the full symmetric group S_3.
      random_model_justification: >-
        A generic degree-3 cover has full monodromy; the alternative A_3 occurs
        exactly when the discriminant of the fibre polynomial is a square in
        the function field, which is a codimension-one condition on the class.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-8748c4]
      falsification_condition: >-
        The empirical Frobenius cycle-type distribution over 1000 fibres per
        curve matches the A_3 distribution (no transpositions observed) at
        every tested curve, or matches a distribution supported on an
        elementary abelian 2-group.
  structural_ingredients:
    - description: >-
        The monodromy of the m-th Semaev summation polynomial as a cover is
        exactly C_2^(m-2) for every non-singular prime-field elliptic curve,
        derived from the splitting field generated by the square roots of
        f(x_i).
      citation: KN-FIND-a1f3c2
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read knowledge/findings/KN-FIND-a1f3c2.md
        lines 1 to 42 in full; the derivation's dependence on the degree-2
        x-coordinate cover is explicit in its proof sketch
      role: scope boundary that this hypothesis extends past
    - description: >-
        The mean number of decompositions per target is a conservation identity
        independent of which factor base of a given size is used, so no yield
        claim is made or needed here.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, confirmed by direct file lookup that
        the record exists at knowledge/findings/KN-FIND-007.md. ITS CONTENT WAS
        NOT READ BY THIS SESSION, so this entry is a pointer and discharges
        nothing: the invariance of yield under a change of factor-base indexing
        at matched size must be re-read from the record by a reviewer, who names
        itself in a new record, before it supports any conclusion here
      role: yield invariance, used only to justify a matched-size comparison
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: fibre_multiplicity_ratio_V_over_W_at_matched_window
      direction: higher
      minimum_effect: >-
        For d = 3 the ratio is 3.00 with a 3-sigma band of plus or minus 0.29
        at 1000 sampled windows per prime (binomial standard error of the
        per-fibre rational-point count is at most sqrt(3)/sqrt(1000) = 0.055,
        so 3 sigma is 0.164; the band is widened to 0.29 to absorb the
        O(B^(-1/2)) Weil term at the smallest tested prime). For d = 4 the
        value is 4.00 under the same band. THIS IS CURVE-FREE AND IS AN
        INSTRUMENT CHECK, NOT EVIDENCE ABOUT E.
    - metric: per_variable_degree_of_generalised_summation_relation_d3_m3
      direction: higher
      minimum_effect: >-
        Strictly greater than 4, which is the committed degree-2 value at
        m = 3. Any value less than or equal to 4 falsifies C2 and would be the
        single most interesting outcome available here.
    - metric: galois_group_of_degree_3_cover_closure
      direction: different
      minimum_effect: >-
        S_3 or A_3, i.e. not contained in any elementary abelian 2-group. A
        group inside C_2^k means KN-FIND-a1f3c2 extends past its stated scope,
        which is itself a finding. THIS IS CURVE-FREE AND IS RECORDED AS A
        SCOPE CORRECTION, NOT AS AN ADVANTAGE.
    - metric: degree_4_map_primitivity_fraction
      direction: different
      minimum_effect: >-
        Reported, not predicted. The fraction of sampled degree-4 divisor
        classes whose map factors through a degree-2 map. This cell exists
        because the factorisation falsifier is forced false at d = 3 and can
        only be tested at even d.
  test_boundary:
    instances:
      - E/F_p ordinary short Weierstrass, p in {65537, 1048583, 16777259}
      - 8 curves per prime drawn by a declared rule fixed before any run
      - divisor classes of degree 2, 3 and 4, primitivity checked per class
    parameters:
      d_values: [2, 3, 4]
      m: 3
      windows_per_prime: 1000
      window_size_B: 64
      elimination: resultant, convention frozen before execution
    implementation: >-
      Exact symbolic computation over Z[x,A,B] and exact arithmetic over F_p.
      No timing-based inference, no solver heuristics, no floating point.
    budget:
      wall_clock_seconds: 3600
      memory_gb: 8
      maximum_runs: 24
  falsification_conditions:
    - >-
      The degree-3 generalised summation relation is not constructible at
      m = 3 within the declared budget. That is an infrastructure or
      feasibility outcome under AGENTS.md rule 5, never evidence that the
      object does not exist, and it is reported as such.
    - >-
      The degree-3 relation has per-variable degree less than or equal to 4.
      C2 is falsified and the d-fold size gain is not paid for at all, which
      would make the lever more interesting rather than less.
    - >-
      The degree-3 Galois closure is contained in an elementary abelian
      2-group at every tested curve. C3 is falsified and KN-FIND-a1f3c2
      extends past its stated scope.
    - >-
      The d = 2 baseline fails to reproduce the committed fourth Semaev
      polynomial as an exact polynomial identity. The instrument disagrees
      with committed algebra and no d greater than 2 result is admissible.
    - >-
      The fibre multiplicity ratio at d = 3 falls outside 3.00 plus or minus
      0.29. HEUR-001 is refuted at the tested scale, and since that quantity
      is curve-free the failure localises to the implementation of the map or
      the window sampler, not to E.
  interpretation_limits:
    - >-
      SCOPE. This is a statement about the algebra of the factor-base indexing
      for ordinary elliptic curves over prime fields at toy primes. It is not
      an attack, it moves no exponent, and no yield claim is made.
    - >-
      THE REACH ARM IS NOT DESIGNED HERE AND MUST NOT BE INFERRED. The source
      proposal routes its cost consequence through a threshold it names
      "E1-01" and a formula eps greater than m/(2(m-1)). THIS COORDINATOR
      SESSION DID NOT SEARCH FOR E1-01, so this record makes NO CLAIM THAT IT IS
      ABSENT from the repository; the honest statement is that the identifier
      was not resolved here and the threshold's definition is therefore not in
      hand. The eps-hat arm is left undesigned for that reason. Any later
      contract that wants it must first locate and cite the record defining
      E1-01, or supersede this hypothesis with one that states the threshold in
      full.
    - >-
      TWO OF THE THREE OBSERVABLES ARE CURVE-FREE BY CONSTRUCTION. Fibre
      multiplicity and Frobenius cycle type are properties of any degree-d
      cover of P^1 and are reproduced by a genus-2 curve, by a hyperelliptic
      curve of any genus, and by a covering with no group structure at all.
      They are recorded as a derivation and an instrument check and may never
      be cited as a statement about elliptic curves or the ECDLP. Only the
      polytope of the summation relation is curve-bound.
    - >-
      Toy monodromy computations at a handful of curves are toy and cannot
      establish or refute universality in either direction.
    - >-
      The branch ambiguity of the construction grows as d^m rather than
      2^(m-2). That is a real and growing constant-factor tax, it is charged
      in the cost discussion, and it is not offset by anything measured here.
  status: proposed
  proposed_by: idea-generator
