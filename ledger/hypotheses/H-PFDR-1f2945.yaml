hypothesis:
  id: H-PFDR-1f2945
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260808-c64123
  batch_id: BATCH-2c45e2
  statement: >-
    DESCENT OVER A FINITE FIELD HAS NO HIDING PLACE, AND THE INSTRUMENT THAT WOULD
    DETECT ONE MUST BE SHOWN TO HAVE DYNAMIC RANGE BEFORE ITS SILENCE MEANS
    ANYTHING. Three claims that can each fail independently, stated in decreasing
    order of how much elliptic-curve content they actually carry.
    (S1 THE INSTRUMENT CLAIM, WHICH IS THE ONE WITH CONTENT) A descent instrument
    that reports no variation on a prime-order subgroup is informative only if the
    same instrument, unchanged, reports variation of a KNOWN SIZE where variation
    provably exists. On a curve whose l-torsion is non-cyclic over the base field
    the quotient by l has order l squared and points outside the prime-order
    subgroup fall into at least two distinct classes; the instrument must report
    exactly l squared and exactly the predicted number of distinct classes. On a
    curve over the rationals with known nonzero Sha or positive rank the same
    instrument must report a nonzero Selmer gap. Both are planted defects of known
    size in settings where the finite-field conclusion is KNOWN FALSE.
    (S2 THE FINITE-FIELD STATEMENT) For an elliptic curve over a prime field and a
    prime l different from the characteristic, the l-descent map is an isomorphism
    onto the first cohomology of the l-torsion module, so the quotient of the
    rational points by l has the same order as the rational l-torsion, there is no
    Selmer gap, and on a subgroup of prime order N with l different from N the
    quotient is trivial and the descent class of every point is independent of the
    scalar.
    (S3 THE ONE NON-DEGENERATE CELL AND ITS PRICE) At l equal to N the descent map
    is an isomorphism of groups of order N and is not zero, but computing the
    connecting map explicitly requires a rational basis of the N-torsion and hence
    embedding degree one; the fraction of toy curves admitting such a basis must
    agree cell by cell with the divisibility of p minus one by N.
  mechanism: >-
    Descent is powerful over a number field because the first cohomology of the
    curve is large and the Selmer group sits strictly between the Mordell-Weil
    quotient and that cohomology, leaving room for the Tate-Shafarevich group -
    room in which arithmetic information can hide. Over a finite field the
    absolute Galois group is procyclic of cohomological dimension one and Lang''s
    theorem makes the first cohomology of a connected algebraic group vanish, so
    every torsor is trivial and the room collapses. A trapdoor needs somewhere the
    public cannot compute; the finite-field descent formalism has nowhere. That is
    a theorem rather than an observation about current technique - which is
    precisely why the research content of testing it is not the theorem but the
    instrument, and why S1 rather than S2 is the load-bearing claim.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      BOTH OF THE SOURCE IDEA''S PRIMARY PREDICTIONS HAVE BANDS OF WIDTH ZERO, AND
      ONE OF THEM IS NOT AN ELLIPTIC-CURVE STATEMENT AT ALL. First, the prediction
      that the order of the quotient by l equals the order of the l-torsion holds
      for EVERY FINITE ABELIAN GROUP and every l, by the structure theorem alone -
      the map given by multiplication by l on a finite abelian group has kernel the
      l-torsion and image of index equal to the kernel''s order. Lang''s theorem is
      not needed for it and elliptic curves are not needed for it. Nothing can move
      that statistic except a coding error. Second, the prediction that the descent
      class of a scalar multiple is independent of the scalar on a subgroup of
      prime order N with l different from N is forced by elementary group theory,
      since multiplication by l is a bijection on a group of order coprime to l, so
      the quotient is the trivial group and there is exactly one class available to
      report. A statistic with one attainable value cannot discriminate any
      hypothesis.
    change_made: >-
      The planted-defect arms are promoted from controls to the PRIMARY
      measurement, and the primary reported quantity becomes the instrument''s
      detection rate against defects of KNOWN SIZE - l squared distinct classes on
      a non-cyclic l-part, and a nonzero Selmer gap on a rational curve with known
      nonzero Sha or positive rank. Those statistics have real dynamic range - the
      number of distinct classes ranges over at least two values by construction -
      and their failure is exactly the failure mode that makes a reported silence
      worthless. The two forced identities are retained and reported as
      IMPLEMENTATION CHECKS, labelled as such, and are explicitly forbidden from
      being cited as findings.
    alternative_hypothesis_range: >-
      Under H_blind - the instrument cannot see a descent class difference at all -
      the planted arms report one class where l squared classes exist and a zero
      Selmer gap where a nonzero one exists, so the detection rate is 0. Under
      H_working the detection rate is 1. The statistic is a rate on the closed unit
      interval with both endpoints attainable and with a defect of known size
      fixing the expected value in advance. Separately, the l equal to N
      cross-tabulation is a two-by-two contingency table over at least 200 curves
      in which a single off-diagonal entry falsifies S3, and off-diagonal entries
      are attainable if the rationality computation or the recalled
      Balasubramanian-Koblitz condition is wrong.
  assumptions:
  - >-
    E is an elliptic curve over a prime field with p greater than 3, and l is a
    prime different from the characteristic.
  - >-
    Lang''s theorem - the first Galois cohomology of a connected algebraic group
    over a finite field vanishes - and the cohomological dimension one of a finite
    field. BOTH RECALLED AND NOT RE-VERIFIED against a primary source by this
    program. They are load-bearing for S2 only, and S2''s measured predictions are
    forced by finite abelian group theory independently of them, so no measurement
    below depends on the recall being right.
  - >-
    The Balasubramanian-Koblitz condition used in S3 is RECALLED AND NOT
    RE-VERIFIED. S3''s prediction is the cross-tabulation agreement, which is
    measured directly, so a failure indicts either the recall or the computation
    and the experiment reports which.
  - >-
    Every computation is over the prime field. An implementation that computes
    descent by lifting to the integers has silently changed the question, and the
    field of definition of every computation is asserted in the run record.
  proof_search_map:
    bottleneck: >-
      Whether the descent formalism over a finite field admits any object a
      designer could hide information in. Everything else - the size identity, the
      class computation - is elementary once that is settled.
    baseline_embedding:
      parameter_slice: >-
        A curve with cyclic l-part and cofactor 1, where the l different from N
        test is VACUOUS because no such l divides the group order. That slice must
        be reported as vacuous rather than as a confirmation, and its frequency
        across the sample is itself a reported quantity.
      reproduction_check: >-
        A frozen fixture of at least 20 curves on which the quotient order and the
        torsion order are computed by two independent routes - the invariant-factor
        decomposition and direct enumeration of the quotient - which must agree
        exactly. Agreement is an implementation check, never a finding.
    observation_collision:
      observable: >-
        The pair consisting of the order of the quotient by l and the multiset of
        descent classes of scalar multiples.
      distinct_preimage_search: >-
        PERFORMED AND MASSIVELY POSITIVE, AND IT IS THE RECORD''S CENTRAL LIMIT.
        The first component collides across every finite abelian group with the
        same l-primary structure, elliptic or not; the second collides across every
        group of order coprime to l. The observable therefore identifies almost
        nothing, which is why the curve-free arm is required and why the planted
        arms rather than the identities carry the content.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the descent map over the trivial class, shown to contain the
        whole prime-order subgroup for every l different from N.
      predicted_gain: >-
        NO GAIN AND NONE CLAIMED. The value is a scope statement - a designer
        cannot hide in a group that has exactly one element.
    quantifier_order: >-
      CLAIMED - FOR ALL elliptic curves over prime fields with p greater than 3,
      FOR ALL primes l different from the characteristic and different from N, and
      FOR ALL scalars, the descent class of the scalar multiple on the prime-order
      subgroup is the trivial class. THE READING EXPLICITLY NOT CLAIMED - that this
      says anything about descent over number fields, where it is a powerful tool,
      or that it closes the route through a lift, which a different lane owns.
    method_ceiling:
      strongest_certifiable_claim: >-
        That the finite-field l-descent of a prime-order subgroup is trivial for
        every l different from N, that the size identity holds, and that the l
        equal to N cell requires embedding degree one - together with a
        demonstration that the instrument used to establish the first of these can
        detect a planted difference of known size. It can NEVER certify anything
        about descent over a lift, about number fields, or about any trapdoor
        construction that does not live in the finite-field descent formalism.
      nearby_object_control: >-
        A CURVE OVER THE RATIONALS WITH KNOWN NONZERO SHA OR POSITIVE RANK, where
        the finite-field conclusion is KNOWN FALSE and a nonzero Selmer gap exists.
        The instrument must find it. An instrument that reports emptiness there has
        proved too much and its finite-field silence means nothing.
    proof_obligations:
    - claim: 'The order of the quotient by l equals the order of the l-torsion.'
      responsibility: correctness
    - claim: 'The descent class on a prime-order subgroup is trivial for l different from N.'
      responsibility: correctness
    - claim: 'The instrument detects a planted difference of size l squared.'
      responsibility: baseline
    - claim: 'The instrument detects a nonzero Selmer gap where one exists.'
      responsibility: feasibility
    - claim: 'Rational N-torsion basis existence agrees with the divisibility of p minus one by N.'
      responsibility: scope
    - claim: 'The size identity carries no elliptic-curve content if a finite abelian group reproduces it.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL. No exponent is claimed and none is foreclosed; the descent route never
    had a costed exponent. The l equal to N cell has exactly the cost of the
    pairing-based reduction and that is stated rather than left implicit.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING IN S1, S2 OR S3. The only
      distributional statement in the record is a scope note - that the cofactor of
      N in the group order is small and typically smooth for curves generated as
      cryptographic practice generates them, so the l different from N cell is
      typically thin and often vacuous.
    random_model_justification: >-
      The imitated model is the standard curve-generation heuristic that the
      cofactor behaves like a small random integer. It is used only to anticipate
      how often the test is vacuous and never to support any claim.
    supporting_results: []
    supporting_results_note: >-
      EMPTY BY DESIGN. The scope note is measured directly - the cofactor
      distribution over the sampled curves is a reported quantity - rather than
      assumed from any external result.
    validation_experiment_ids:
    - EXP-PFDR-3d7c39
    falsification_condition: >-
      The measured cofactor distribution has a heavy tail, or the fraction of
      curves with cofactor 1 exceeds 0.5 so that the l different from N test is
      vacuous on a majority of the sample. Either makes the scope note wrong and
      is reported; neither touches S1, S2 or S3.
  structural_ingredients:
  - description: >-
      Lang''s theorem - the first Galois cohomology of a connected algebraic group
      over a finite field vanishes - together with the cohomological dimension one
      of a finite field.
    citation: 'Lang. RECALLED, STANDARD, NOT RE-VERIFIED BY THIS PROGRAM.'
    provenance: recalled
    verified_by: null
    role: >-
      supplies the structural reason for S2; a pointer for the reviewer, and NOT
      load-bearing for any measurement, since S2''s measured predictions follow
      from finite abelian group theory alone
  - description: >-
      The structure theorem for finite abelian groups, from which the identity
      between the order of the quotient by l and the order of the l-torsion follows
      for any finite abelian group whatsoever.
    citation: 'Classical, textbook.'
    provenance: recalled
    verified_by: null
    role: >-
      THE REASON THE SIZE IDENTITY CARRIES NO ELLIPTIC-CURVE CONTENT, and hence the
      reason the curve-free arm of EXP-PFDR-3d7c39 is binding rather than optional
  - description: >-
      The Balasubramanian-Koblitz condition relating a rational basis of the
      N-torsion to the divisibility of p minus one by N.
    citation: 'Balasubramanian and Koblitz. RECALLED, NOT RE-VERIFIED.'
    provenance: recalled
    verified_by: null
    role: >-
      the predicted content of the S3 cross-tabulation, which the experiment
      measures rather than assumes
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      planted-defect detection rate on curves with non-cyclic l-part, dimensionless,
      the fraction of planted curves on which the instrument reports exactly
      l squared for the quotient order and at least two distinct descent classes
      among points outside the prime-order subgroup
    direction: higher
    minimum_effect: >-
      EXACTLY 1.00 on at least 30 planted curves. Anything below 1.00 means the
      instrument is blind and NO reported absence of variation is admissible.
  - metric: >-
      Selmer-gap detection on the rational nearby object, a binary outcome per
      curve
    direction: different
    minimum_effect: >-
      A NONZERO Selmer gap reported on every rational curve of the fixture with
      known nonzero Sha or positive rank. A zero gap there means the code returns
      emptiness rather than measuring it, and the finite-field silence is worthless.
  - metric: >-
      curve-free reproduction of the size identity, a binary outcome per random
      finite abelian group
    direction: different
    minimum_effect: >-
      PREDICTED TO REPRODUCE ON 100 PERCENT of random finite abelian groups of
      matched l-primary structure. If it does, the size identity carries no
      elliptic-curve content and may not be quoted as a statement about elliptic
      curves.
  - metric: >-
      cross-tabulation of rational N-torsion basis existence against divisibility of
      p minus one by N, a two-by-two contingency table over at least 200 curves
    direction: different
    minimum_effect: >-
      BOTH OFF-DIAGONAL CELLS EXACTLY ZERO. A single curve with a rational basis
      and N not dividing p minus one falsifies S3.
  - metric: >-
      cofactor distribution over the sampled curves, and the fraction of curves on
      which the l different from N test is vacuous
    direction: different
    minimum_effect: >-
      Reported without a directional prediction. The vacuous fraction is reported
      per bit size and vacuous curves are never pooled with tested ones.
  test_boundary:
    instances:
    - >-
      At least 200 toy ordinary prime-field curves at 16 to 24 bits with the full
      invariant-factor decomposition of the group computed.
    - >-
      At least 30 deliberately constructed curves with non-cyclic l-part for some
      prime l - the planted-defect arm.
    - >-
      A fixture of curves over the rationals with known nonzero Sha or positive
      rank - the proves-too-much nearby object.
    - >-
      At least 200 random finite abelian groups with matched l-primary structure
      and NO CURVE ANYWHERE - the curve-free arm.
    parameters:
      scalars_per_curve: 100
      primes_l: 'every prime l dividing the group order, per curve'
      field_scope: 'prime fields with p greater than 3 only'
    implementation: >-
      Existing harness point arithmetic plus invariant-factor decomposition; a
      separate independent quotient-enumeration routine for the two-route check;
      an external descent implementation for the rational fixture, whose identity
      and version are pinned. No new machinery.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 1
      maximum_memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
  - >-
    The planted-defect detection rate is below 1.00 - the instrument is blind, the
    run is INVALID, and no absence of variation may be reported in any direction.
  - >-
    The rational nearby object shows a zero Selmer gap where a nonzero one is
    known - the instrument reports emptiness rather than measuring it and has
    proved too much.
  - >-
    Any measured dependence of the descent class on the scalar for l different from
    N on a prime-order subgroup - S2 is wrong and the descent lane reopens with a
    concrete instance. Because this is forced by elementary group theory, the first
    hypothesis to test is an implementation defect, and only a defect-free
    reproduction in a second engine may be reported as anything else.
  - >-
    Any toy curve with the quotient order differing from the torsion order - the
    identity fails, which would contradict the structure theorem for finite abelian
    groups, so the computation is indicted first.
  - >-
    A rational basis of the N-torsion on a curve with N not dividing p minus one -
    S3 is wrong.
  - >-
    The curve-free arm reproduces the size identity - the identity carries no
    elliptic-curve content and NOTHING FROM IT may be quoted as a statement about
    elliptic curves or about descent specifically.
  interpretation_limits:
  - >-
    THIS IS A STATEMENT ABOUT DESCENT OVER A PRIME FIELD, not about elliptic curves
    over prime fields in general, and certainly not about descent over number
    fields where it is a powerful tool. It does not close the route through a lift,
    which a different lane owns.
  - >-
    THE SOURCE IDEA MISDESCRIBES GOAL-ECTD-001 AND THE MISDESCRIPTION IS NOT
    ADOPTED. The idea asserts that the goal''s title names torsion and descent as a
    priority family and that closing descent would satisfy the goal''s completion
    criterion 1 for that family. TASK-20260904-5423ad read the committed record at
    ledger/goals/GOAL-ECTD-001.yaml. Its title is a statement about prime-field
    elliptic-curve trapdoors by a Teske analogue via secret isogenies to rare
    endpoint weaknesses, and contains neither the word torsion nor the word
    descent. Its objective prioritizes, in order, secret isogeny-aligned factor
    bases with Semaev and Groebner heavy tails, large-conductor vertical barriers,
    hidden correspondences, and trapdoor DDH as a weaker first target. DESCENT IS
    NOT ONE OF THE FOUR NAMED PRIORITY FAMILIES. Completion criterion 1 does have a
    barrier branch, but it is scoped to "each prioritized endpoint family", so a
    descent closure does not discharge it. No outcome of this hypothesis may be
    reported as advancing a GOAL-ECTD-001 completion criterion.
  - >-
    Toy verification confirms a derivation. It is not crypto-scale evidence and is
    not presented as such.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. Whether a descent-
    based trapdoor can exist on a LIFT - which is where the source idea says every
    surviving descent trapdoor must live - is not testable by this hypothesis or
    its experiment at any scale, because the canonical lift of a cryptographic-size
    curve and the canonical heights of its lifted points are not computable within
    any budget this program has. The record therefore establishes nothing about the
    lift route in either direction and does not narrow it.
  - >-
    Curves whose l-torsion is non-cyclic genuinely have a larger quotient; pooling
    them with cyclic instances would manufacture an appearance of variation, so
    they are reported as a separate arm and never pooled.
  - >-
    Where the cofactor of N is 1 the l different from N test is vacuous. Vacuous
    instances are reported separately and are never counted as confirmations.
