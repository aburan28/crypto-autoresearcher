hypothesis:
  id: H-ICEX-245779
  question_id: RQ-QRE-6dba8c
  source_idea_id: IDEA-20260809-5a36f3
  title: >-
    The RSA-against-ECDLP quantum cost ratio is assembled by dividing headline
    numbers from papers that do not share assumptions, and costing both under one
    assumption set should move it- but the pipeline the source idea instantiates
    DOES NOT EXIST in this corpus, its stated upstream record delivers only a
    reversible arithmetic-layer gate count, and the governing research question
    forbids any pipeline output before two primary papers are filed, so this is
    designed as a staged VERIFICATION protocol whose first two stages are
    blocking gates and whose discriminating band carries a computed
    non-degeneracy pre-check
  statement: >-
    SCOPE FIELD, AND THE HANDOFF LABEL IS WRONG FOR THIS RECORD. This is QUANTUM
    RESOURCE ESTIMATION for RSA-2048 factoring and 256-bit prime-field ECDLP
    under Shor's algorithm with surface-code fault tolerance, as scoped by
    RQ-QRE-6dba8c, which this task opened and read in full. It is NOT classical
    prime-field ECDLP cryptanalysis. The dispatching handoff describes all seven
    proposals in its batch as prime-field ECDLP; that label is provisional and is
    incorrect here, and every conclusion drawn from this record must be scoped to
    quantum resource estimation.

    (A) THE CLAIM AS THE SOURCE STATES IT. Costing RSA and ECDLP under a single
    assumption set, with this program's own arithmetic-layer counts, produces a
    RATIO of physical qubits and of time whose value differs from the ratio
    obtained by dividing published headline numbers, and the difference is
    attributable to specific, nameable assumption mismatches.

    (B) THE PIPELINE DOES NOT EXIST, AND THAT IS VERIFIED RATHER THAN ASSUMED.
    IDEA-20260809-5a36f3 says 'Instantiate one pipeline twice' and 'Run both
    problems through the pipeline at several assumption sets including each
    published paper's own'. Its dominated_by field names IDEA-20260809-593de3 as
    the upstream record. This task opened IDEA-20260809-593de3 and read it in
    full. IT IS A PROPOSAL WITH status proposed, NOT AN ARTIFACT, and what it
    proposes is narrower than a pipeline- its claim is that 'reversible circuits
    for modular multiplication and exponentiation have Toffoli counts that follow
    from their construction, and those counts can be derived and CHECKED by
    simulating the same circuits classically at small bit widths'. That is the
    ARITHMETIC LAYER ALONE. It contains no error-correction layer, no magic-state
    distillation, no layout or routing, and no physical-qubit or wall-clock
    output. THERE IS THEREFORE NO PIPELINE TO INSTANTIATE, and this contract's
    first substantive stage is to build and validate one, gated on the literature.

    (C) THE GOVERNING QUESTION IMPOSES A BLOCKING GATE. RQ-QRE-6dba8c, read in
    full, constrains- 'No pipeline output is recorded before at least two primary
    resource-estimation papers are filed as KN-LIT entries with their input
    tables extracted.' It further constrains that 'Every constant in the pipeline
    is either derived in the record or cited to a filed source; an unsourced
    constant fails review', and that 'No record produced under this question may
    contain a date, timeline, probability of arrival, or policy recommendation'.
    The source idea's own source_refs read 'Published RSA and ECC quantum
    resource estimates -- RECALLED, REQUIRED READS', and its novelty_screen reads
    'WEB NOT CHECKED'. NO PRIMARY SOURCE HAS BEEN READ BY ANY AGENT IN THIS
    PROGRAM FOR THIS LANE. Stage 0 of the contract is therefore literature
    acquisition, and it is blocking.

    (D) BOTH SIDES OF EVERY RATIO ARE CHARGED IN ONE UNIT, WHICH IS NOT
    AUTOMATIC HERE. Physical qubits are dimensionless counts and pose no
    difficulty. TIME DOES- a published wall-clock figure is (surface-code cycles)
    times (that paper's cycle time), and two papers use different cycle times, so
    dividing two published wall-clock figures silently divides two different
    units. This record charges the time ratio in SURFACE-CODE CYCLES, a
    dimensionless count, and converts to seconds only by applying ONE declared
    cycle time identically to both sides. A ratio formed from seconds under two
    different cycle times is a units error and is refused.

    (E) THE PAIRING IS DECLARED, BECAUSE THE RATIO IS OTHERWISE MEANINGLESS. A
    ratio between an RSA-2048 instance and a 256-bit ECDLP instance is not a
    comparison of two problems unless the pairing is stated. The declared pairing
    is NOMINAL CLASSICAL SECURITY LEVEL, and the sensitivity of every reported
    ratio to that choice is a required output, so that a reader who prefers a
    different pairing can re-read the table.

    (F) THE DISCRIMINATING BAND, AND ITS NON-DEGENERACY PRE-CHECK. The statistic
    is D := log10(ratio_unified) - log10(ratio_crosspaper). Pre-registered-
    |D| at least 0.30, a factor of 2, records DIFFERS; |D| at most 0.10 records
    EFFECTIVELY ALIGNED; between is INCONCLUSIVE, declared in advance.
    NON-DEGENERACY IS CHECKED BEFORE THE VERDICT, NOT AFTER- the pipeline is
    first evaluated at EACH paper's own declared assumption set, producing two
    ratios. If those two ratios agree within 0.10 in log10, then the two papers'
    assumption sets are already effectively aligned, D cannot reach 0.30 by
    construction, and THE CELL IS DECLARED UNDERPOWERED with the observed spread
    reported. No DIFFERS verdict may be recorded from a cell that failed this
    pre-check.

    (G) WHAT IS NOT CLAIMED, AND CANNOT BE. No quantum hardware is used, no
    quantum advantage is asserted, and no statement about which cryptosystem will
    be broken first, in what order, or on what timeline may be derived. Those are
    excluded by RQ-QRE-6dba8c and by the source idea's own interpretation limit,
    and the exclusion is absolute rather than a matter of care in phrasing.
  mechanism: >-
    Instantiate one costing pipeline twice, changing ONLY the arithmetic layer -
    modular exponentiation for RSA against elliptic-curve point addition and its
    group order for ECDLP - and report the ratio of physical qubits and of
    surface-code cycles with every other input held identical. The pipeline is
    built as a pure function from (algorithm parameters, physical error rate,
    cycle time, code distance, distillation scheme, connectivity) to (physical
    qubits, surface-code cycles), with each paper's own input table available as
    a fixture. The difference between the unified ratio and the cross-paper ratio
    is then decomposed by turning one assumption at a time from paper A's value
    to paper B's value, and the residual interaction is reported rather than
    absorbed.
  assumptions:
  - >-
    Two primary resource-estimation papers are obtainable and filed as KN-LIT
    entries with their input tables extracted. IF THEY ARE NOT, the contract
    stops at Stage 0 and reports the acquisition failure as its result; nothing
    downstream is run and no ratio is recorded.
  - >-
    The pipeline is a deterministic pure function of its declared inputs, with
    every constant either derived in the record or cited to a filed source.
  - >-
    The two problems are paired at nominal classical security level, declared
    before any number is computed, with the sensitivity of every ratio to that
    pairing reported.
  - >-
    Time is charged in surface-code cycles on both sides. Seconds appear only
    under one declared cycle time applied identically.
  - >-
    Arithmetic-layer counts are validated by classical simulation of the same
    reversible circuits at small bit widths, as IDEA-20260809-593de3 proposes;
    that validation is a PREREQUISITE of this contract and is not assumed
    complete.
  proof_search_map:
    bottleneck: >-
      Reproduction. Every downstream number is meaningless unless the pipeline
      can reproduce each published headline from that paper's own stated inputs.
      The bottleneck is not the comparison; it is whether the instrument can
      express the assumption sets it is asked to compare.
    baseline_embedding:
      parameter_slice: >-
        Each paper's own declared input set, run through the pipeline, must
        return that paper's own headline physical-qubit count and cycle count.
      reproduction_check: >-
        PAPER-ASSUMPTION REPRODUCTION, BLOCKING. Within a tolerance declared
        before the run, per paper, per output. Reproduction FAILURE is a
        first-class result and is reported with its magnitude rather than tuned
        away, per RQ-QRE-6dba8c's own constraint.
    observation_collision:
      observable: >-
        A single reported ratio of physical qubits, or of time.
      distinct_preimage_search: >-
        COLLISION EXPECTED AND HANDLED. Many distinct (error rate, cycle time,
        code distance, distillation scheme, connectivity) tuples produce the same
        ratio, because a ratio divides out anything the two arms share. The ratio
        therefore does NOT identify the assumption set, and no conclusion may
        rest on a ratio quoted without its assumption set. The separator is the
        per-assumption decomposition, which is a required output.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the pair of published headline numbers by the pair (assumption
        vector, output vector), so that a ratio is always accompanied by the
        vector that produced it.
      predicted_gain: >-
        Converts a cross-paper division into a computation whose inputs a reader
        can vary.
    - transform: boundary_lift
      proposed_object: >-
        Emit the ratio as a function over the declared assumption ranges rather
        than at a point, with the one-at-a-time decomposition beside it.
      predicted_gain: >-
        Makes the practical output - which single assumption the difference is
        actually about - a table rather than a sentence.
    quantifier_order: >-
      FOR EACH declared assumption set S, THERE EXISTS a pipeline evaluation
      giving (physical qubits, cycles) for each problem and hence a ratio r(S).
      The claim is about the DIFFERENCE between r(S_unified) and the cross-paper
      quotient, quantified over the declared S. It is NOT a claim that any r(S)
      is correct, and it is not a claim about any assumption set outside the
      declared range.
    method_ceiling:
      strongest_certifiable_claim: >-
        Under these stated physical assumptions, the pipeline gives these values
        and this ratio, and moving these assumptions moves it by this much. It
        can NEVER certify what a real machine would cost, and it may never be
        turned into an ordering-in-time, a timeline, a probability of arrival, or
        a migration recommendation.
      nearby_object_control: >-
        A CURVE-FREE arm- cost a generic 256-bit modular-arithmetic Shor instance
        with the same number of modular multiplications and the same operand
        width, containing no elliptic curve. If it reproduces the ECDLP arm's
        totals within the declared tolerance, then the ratio is a statement about
        operand width and modular-multiplication count and NOT about elliptic
        curves.
    proof_obligations:
    - claim: The pipeline reproduces each paper's headline from that paper's own inputs.
      responsibility: baseline
    - claim: Both arms differ ONLY in the arithmetic layer at a given assumption set.
      responsibility: correctness
    - claim: Every ratio is formed within one unit, with time in surface-code cycles.
      responsibility: interface
    - claim: The problem pairing is declared and its effect on every ratio is reported.
      responsibility: scope
    - claim: The ratio difference is decomposed by assumption, with the interaction residual reported.
      responsibility: strictness
    - claim: >-
        The non-degeneracy pre-check is run before any DIFFERS verdict, and a
        failing cell is declared UNDERPOWERED.
      responsibility: feasibility
    - claim: No timeline, date, ordering-in-time, or policy statement appears anywhere.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HQ-1
    formal_statement: >-
      FOR each of the two filed papers, the pipeline as built can express that
      paper's declared assumption set exactly, so that its headline outputs are
      reproducible from its own inputs within the pre-declared tolerance.
    random_model_justification: >-
      Not a distributional assumption. It is an EXPRESSIVENESS assumption about
      the instrument, and it is checkable directly; it is numbered because every
      later number in this contract fails if it is false.
    supporting_results:
    - >-
      NONE YET. RQ-QRE-6dba8c requires two primary papers to be filed as KN-LIT
      entries with their input tables extracted, and no such entry exists for
      this lane. This heuristic is undischarged by construction until Stage 0
      completes.
    validation_experiment_ids:
    - EXP-ICEX-a54be2
    falsification_condition: >-
      A paper's headline cannot be reproduced from its own stated inputs within
      the pre-declared tolerance, or one of its assumptions cannot be expressed
      by the pipeline at all. Either is a first-class reported result and blocks
      every comparison that would have used that paper.
  - id: HQ-2
    formal_statement: >-
      FOR the declared assumption ranges, the difference between the unified
      ratio and the cross-paper quotient is dominated by one or two named
      assumptions, in the sense that the one-at-a-time decomposition accounts for
      at least 70 percent of the difference in log10 and the interaction residual
      is at most 30 percent.
    random_model_justification: >-
      The pipeline is multiplicative in several of its layers, so a log-scale
      one-at-a-time decomposition is close to additive when the layers do not
      interact strongly. That near-additivity is exactly what the residual
      measures, so the assumption is refutable on its own terms.
    supporting_results:
    - >-
      NONE. No sensitivity analysis of this kind exists in this corpus, which is
      RQ-QRE-6dba8c's stated motivation.
    validation_experiment_ids:
    - EXP-ICEX-a54be2
    falsification_condition: >-
      The interaction residual exceeds 30 percent of the difference in log10.
      Then the difference does NOT decompose by assumption, strong interactions
      must be reported instead of a decomposition, and no single assumption may
      be named as responsible.
  structural_ingredients:
  - description: >-
      The reversible arithmetic-layer count this contract consumes, and the
      classical-simulation validation that makes it usable.
    citation: ledger/proposals/IDEA-20260809-593de3.yaml
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- opened and read in full on 2026-09-04.
      IT IS A PROPOSAL WITH status proposed, NOT AN ARTIFACT, and it delivers
      only Toffoli counts for modular multiplication and exponentiation; it
      contains no error-correction, distillation, layout, physical-qubit or
      wall-clock layer. The source idea's description of an existing pipeline is
      corrected here rather than inherited.
  - description: >-
      The scope, constraints and claim-tier ceiling this record operates under,
      including the two-primary-paper gate and the timeline prohibition.
    citation: ledger/questions/RQ-QRE-6dba8c.yaml
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- opened and read in full on 2026-09-04;
      the constraints quoted in statement (C) are verbatim.
  - description: >-
      Published quantum resource estimates for RSA factoring and for elliptic-
      curve discrete logarithms, and for magic-state distillation cost.
    citation: >-
      'Named as research targets in RQ-QRE-6dba8c- Gidney-Ekera; Gidney''s later
      reduced estimate; Roetteler, Naehrig, Svore and Lauter; Litinski. Every one
      is recorded in that question as RECALLED and UNVERIFIED.'
    provenance: recalled
    verified_by: null
    role: >-
      The papers whose input tables Stage 0 must obtain and file. POINTERS ONLY.
      No agent in this program has read any of them, and no number from any of
      them may be used until a new record marks it retrieved with a named
      verifier.
  reduction_chain:
    core_problem: >-
      The ratio of physical qubits and of surface-code cycles between RSA-2048
      factoring and 256-bit prime-field ECDLP under a single declared assumption
      set, together with a decomposition of its difference from the cross-paper
      quotient.
    corollaries: []
  predictions:
  - metric: paper_reproduction_gap
    direction: different
    minimum_effect: >-
      Each filed paper's headline physical-qubit count and cycle count are
      reproduced from that paper's own stated inputs within the tolerance
      declared before the run. A gap is reported with its magnitude and is a
      first-class result, never tuned away.
  - metric: non_degeneracy_prescreen_spread
    direction: higher
    minimum_effect: >-
      The two ratios obtained by running the pipeline at each paper's OWN
      assumption set differ by more than 0.10 in log10. Below that, the
      assumption sets are already aligned, the DIFFERS band is unreachable by
      construction, and the cell is declared UNDERPOWERED with the spread
      reported.
  - metric: ratio_difference_D
    direction: different
    minimum_effect: >-
      'D := log10(ratio_unified) - log10(ratio_crosspaper), reported separately
      for physical qubits and for surface-code cycles. PRE-REGISTERED- |D| at
      least 0.30 records DIFFERS; |D| at most 0.10 records EFFECTIVELY ALIGNED;
      between is INCONCLUSIVE. No verdict from a cell that failed the
      non-degeneracy pre-screen.'
  - metric: assumption_decomposition_coverage
    direction: higher
    minimum_effect: >-
      The one-at-a-time decomposition accounts for at least 70 percent of D in
      log10, with an interaction residual at most 30 percent. Above 30 percent
      the difference does not decompose and strong interactions are reported
      instead.
  - metric: curve_free_arm_agreement
    direction: different
    minimum_effect: >-
      The curve-free 256-bit modular-arithmetic arm reproduces the ECDLP arm's
      physical-qubit and cycle totals within 10 percent, or does not. See
      falsification_conditions for the pre-stated consequence of agreement.
  test_boundary:
    instances:
    - RSA-2048 modular exponentiation under Shor, at the filed papers' declared parameters
    - 256-bit prime-field ECDLP point addition under Shor, at the filed papers' declared parameters
    - >-
      Curve-free control- a generic 256-bit modular-arithmetic Shor instance with
      the ECDLP arm's modular-multiplication count and operand width and no curve
    parameters:
      assumption_axes:
      - physical error rate
      - surface-code cycle time
      - code distance
      - magic-state distillation scheme
      - connectivity and routing model
      - arithmetic-layer construction
      problem_pairing: nominal classical security level, declared before any evaluation
      time_unit: surface-code cycles
      required_filed_papers: 2
    implementation: >-
      One deterministic pipeline as a pure function, with each paper's input
      table as a fixture, and one shared arithmetic-layer counter used by both
      arms and by the curve-free control.
    budget:
      wall_clock_seconds_per_run: 600
      maximum_memory_gb: 8
      maximum_runs: 40
  falsification_conditions:
  - >-
    Q0 ACQUISITION GATE, BLOCKING AND FIRST. Fewer than two primary resource-
    estimation papers can be obtained and filed as KN-LIT entries with their
    input tables extracted. The contract STOPS, the acquisition failure is the
    reported result, and NO ratio, sensitivity table, or comparison is recorded.
    This is required by RQ-QRE-6dba8c and is not waivable inside this contract.
  - >-
    Q1 PIPELINE GATE, BLOCKING AND SECOND. The pipeline cannot express one
    paper's assumption set, or cannot reproduce its headline within the
    pre-declared tolerance. The comparison is incomplete and says so; no unified
    ratio may be reported against that paper.
  - >-
    Q2 NON-DEGENERACY PRE-SCREEN, BLOCKING FOR ANY DIFFERS VERDICT. If the two
    papers' own assumption sets produce ratios within 0.10 in log10, the cell is
    UNDERPOWERED- the assumptions are already effectively aligned, there is
    nothing to decompose, and the DIFFERS band cannot be reached. Report the
    spread and the required spread; do not shrink the claim.
  - >-
    Q3 DECOMPOSITION. The interaction residual exceeds 30 percent of D in log10.
    The difference cannot be decomposed by assumption and strong interactions are
    reported instead of a decomposition. No single assumption may be named.
  - >-
    Q4 UNIT DISCIPLINE, HARD. Any time ratio formed from seconds under two
    different cycle times, or any ratio mixing counts with seconds, voids the
    affected number. Time ratios are surface-code cycles over surface-code
    cycles.
  - >-
    Q5 CURVE-FREE NULL, REQUIRED, CONSEQUENCE PRE-STATED. If the curve-free
    256-bit modular-arithmetic arm reproduces the ECDLP arm's physical-qubit and
    cycle totals within 10 percent, then every number this contract produces is a
    statement about operand width and modular-multiplication count and NOT about
    elliptic curves. The result may not be reported as an elliptic-curve or ECDLP
    finding, and any evidence record must say so in its boundaries.
  - >-
    Q6 PROHIBITED OUTPUT. Any record derived from this contract that contains a
    date, timeline, probability of arrival, ordering-in-time between the two
    cryptosystems, or a migration or policy recommendation is in breach of
    RQ-QRE-6dba8c and is void regardless of its numbers.
  interpretation_limits:
  - >-
    FIELD SCOPE. This is quantum resource estimation under surface-code fault
    tolerance, not classical prime-field ECDLP cryptanalysis. Nothing here bears
    on the classical hardness of any discrete-logarithm problem, and the batch
    handoff's prime-field ECDLP label does not apply to this record.
  - >-
    A ratio under stated assumptions is not a statement about which cryptosystem
    will be broken first. No timeline, ordering-in-time, or migration
    implication may be drawn or recorded, per RQ-QRE-6dba8c and per the source
    idea's own limit.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED PLAINLY, AND IT IS THE CENTRAL LIMIT
    HERE. The pipeline's physical assumptions - error rate, cycle time, code
    distance, distillation yield, connectivity - CANNOT be validated by this
    program at all, because no quantum hardware is used and none is reachable.
    Every output is conditional on an assumption vector that this contract can
    vary but can never check. The reproducible content is the ARITHMETIC- that
    the pipeline reproduces published headlines from published inputs, and how
    its outputs move when an input moves.
  - >-
    The pairing of RSA-2048 with 256-bit ECDLP is a declared choice at nominal
    classical security level. A reader preferring a different pairing must re-read
    the sensitivity table; the ratio is not pairing-independent and is never
    quoted as if it were.
  - >-
    NO PRIMARY SOURCE HAS BEEN READ BY ANY AGENT IN THIS PROGRAM FOR THIS LANE.
    Every external number named in RQ-QRE-6dba8c or in the source idea is
    recorded there as RECALLED and UNVERIFIED, and none of them may back any
    statement in a record derived from this contract until a new record marks it
    retrieved with a named verifier.
  - >-
    The upstream arithmetic-layer record IDEA-20260809-593de3 is a PROPOSAL, not
    an artifact, and its own novelty_status is `known` with its sources recorded
    as recalled required reads. This contract does not treat it as delivered.
  status: proposed
  proposed_by: idea-generator
