# =============================================================================
# H-SDEG-34cff4 — specified from IDEA-20261006-6bb2ec (bytes copied
# unchanged from origin/design/mlkem-0e9abf-isometry). Question
# RQ-SDEG-001. The prediction under test is the idea's own: on the
# F_61, B = 8, S_3 cell, the median of peak_nnz(S_3) /
# peak_nnz(support-matched) over eight targets lies in the closed
# interval from 1/2 to 2, or is strictly greater than 2, and the
# median of peak_nnz(S_3) / peak_nnz(dense) is at most 1/2. A
# finished support-matched median strictly below 1/2 is the concrete
# negative. This record does not assert which supportive reading
# occurs.
# =============================================================================
hypothesis:
  id: H-SDEG-34cff4
  question_id: RQ-SDEG-001
  source_idea_ids:
    - IDEA-20261006-6bb2ec
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Peak nonzero count of one F_61 S_3 Macaulay matrix against
    support-matched and dense controls
  statement: >-
    For one ordinary short-Weierstrass curve over F_61, one recorded
    factor base of B = 8 abscissae, and eight targets, let R_s be the
    median of peak_nnz(S_3) / peak_nnz(support-matched) and let R_d
    be the median of peak_nnz(S_3) / peak_nnz(dense). The idea's
    prediction is that R_s is at least 1/2, with the closed interval
    from 1/2 to 2 read as support-priced memory and a value strictly
    above 2 read as fill-in, and that R_d is at most 1/2. A finished
    R_s strictly below 1/2, both medians taken over eight complete
    targets, is the concrete negative: the Semaev peak is sparser
    than either named reading allows. A finished R_d strictly above
    1/2 is the other named negative, the dense-column comparison.
    No exponent improvement is claimed.
  mechanism: >-
    The tracked object is peak_nnz, the largest number of nonzero
    entries stored in the degree-8 Macaulay matrix of the specialized
    S_3 system while grevlex Gaussian elimination runs. The
    support-matched arm keeps the monomials of those generators and
    replaces every nonzero coefficient. The dense arm keeps the row
    and column index sets and fills every entry, so it has no forced
    zero. The priced quantities are the two medians R_s and R_d.
    Hits and misses are pooled for those medians. The witness tuple
    is discarded. Exhaustive addition supplies the optional split,
    and the solver is not the labeler.
  assumptions:
    - >-
      peak_nnz counts nonzero field elements stored after each row
      subtraction of the frozen elimination, including the matrix
      before the first row operation. initial_nnz is that count
      before the first row operation. Both definitions are the
      transcript of EXP-SDEG-ff4996.
    - >-
      The support-matched null uses exactly the monomials present in
      the expanded S_3 generator and the two membership polynomials
      for that target, with fresh nonzero coefficients in F_61.
    - >-
      The dense null has the same row and column index sets as that
      target's Semaev matrix. Every entry is an independent uniform
      coefficient in F_61. No structural zero is forced.
    - >-
      No symmetrized summation polynomial and no torsion coordinate
      is introduced. The generator is ordinary S_3 specialized at
      the target abscissa.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        The support-matched peak_nnz is the baseline memory
        coordinate, at p = 61 and B = 8, on eight targets.
      reproduction_check: >-
        A second solver build recomputes initial_nnz and peak_nnz
        on every scored target and must return the same integers.
    observation_collision:
      observable: peak_nnz
      distinct_preimage_search: >-
        Two targets may share a peak count. That collision is
        recorded and is not a discrete logarithm.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: matrices with a given peak_nnz
        predicted_gain: none as an attack
    quantifier_order: >-
      The claim is an empirical statement about two sample medians
      on one declared cell. It is not a quantified security theorem.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this cell the support-matched median is at least 1/2 or
        strictly below 1/2, and the dense median is at most 1/2 or
        strictly above 1/2.
      nearby_object_control: support-matched generators and a dense matrix of the same shape
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Memory-coordinate measurement. The two random matrices are the
      nearby objects.
  rerandomization: >-
    No re-randomizing walk is used. Targets are drawn once from the
    prime-order subgroup. The random arms redraw coefficients only.
  asymptotic_claim:
    problem: prime-field ECDLP
    prior_best: Pollard rho at Theta(N^{1/2}) group operations
    time_exponent: '1/2, unchanged; this hypothesis does not move it'
    memory_exponent: polylogarithmic per rho walk, unchanged
    hidden_cofactor: none; no attack cost is proposed
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against rho is 1. claim_kind is filled so
      the non-claim is explicit. The separator is a ratio of toy
      nonzero counts, not a cheaper discrete logarithm.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For uniform random nonzero coefficients on a fixed monomial
        support, at p = 61, the median peak_nnz of twenty such
        systems and the median peak_nnz of the eight Semaev systems
        lie within a factor of 2 of each other, whenever the only
        structure in the Semaev matrix is that support.
      random_model_justification: >-
        On a fixed support, a uniform nonzero coefficient
        specialisation preserves the structural zeros. The expected
        number of initial nonzeros equals the support size times
        (1 - 1/p). Fill-in under elimination is not given by that
        count. The assumption imitates the model that peak memory is
        determined by support plus a field-independent fill-in
        factor. KN-LIT-0acb8c, opened in this session, is a
        bibliographic summary of a Macaulay time bound and is not an
        input to the ratio.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SDEG-ff4996
      falsification_condition: >-
        The median peak_nnz of the twenty support-matched systems
        on the first scored target's support lies strictly outside a
        factor of 2 of the median peak_nnz of the eight Semaev
        systems. That observation refutes HEUR-1 on this cell. It is
        recorded beside the reading row and does not by itself
        replace a finished support-matched median below 1/2.
  structural_ingredients:
    - description: >-
        S_3 vanishes when points with those x-coordinates sum to the
        identity up to signs. Degree 2 in each variable. The explicit
        short-Weierstrass polynomial used here was opened in
        v1_blind_rederive.py.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: degree pattern of the ordinary S_3 generator
    - description: >-
        Explicit S_3(x1, x2, x3) over a short-Weierstrass curve,
        opened in this session.
      citation: >-
        coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py
      provenance: internal
      verified_by: >-
        coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-642cf5/v1_blind_rederive.py
      role: frozen cubic-free formula specialized at the target abscissa
    - description: >-
        Naive prime-field Semaev index calculus does not beat generic
        methods under the assumptions of that row. Baseline only.
      citation: KR-IC-5931ee
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
      role: the rho comparison this measurement does not move
    - description: >-
        Bibliographic summary of a probabilistic Macaulay time bound.
        The full text was not read. The bound is not used.
      citation: KN-LIT-0acb8c
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-0acb8c.md
      role: adjacent literature, not an input to the ratio
  reduction_chain:
    core_problem: toy peak nonzero count of one S_3 Macaulay matrix
    corollaries: []
  predictions:
    - metric: >-
        median over eight F_61 targets of peak_nnz(S_3) /
        peak_nnz(support-matched), and median of peak_nnz(S_3) /
        peak_nnz(dense)
      direction: different
      minimum_effect: >-
        A support-matched median in the closed interval from 1/2 to 2
        supports the support-priced reading. A support-matched median
        strictly above 2 supports fill-in as the memory term. Both
        require the dense median to be at most 1/2. A finished
        support-matched median strictly below 1/2 is the concrete
        negative.
  test_boundary:
    instances:
      - one ordinary short-Weierstrass curve over F_61
    parameters:
      prime: 61
      cardinality: 8
      summation_polynomial: S_3
      targets: 8
      draw_cap: 32
      macaulay_degree: 8
      h1_replicates: 20
      monomial_order: grevlex
      variable_order: x1 > x2
    implementation: >-
      One grevlex Gaussian elimination on each Macaulay matrix, one
      support-matched system and one dense matrix per scored target,
      twenty further support-matched systems on the first target's
      support, and one second build of the eight Semaev matrices.
      No discrete-log search.
    budget:
      scientific_systems_cap: 124
      maximum_runs: 1
  falsification_conditions:
    - >-
      The eight targets are complete, the second build matches, and
      the support-matched median is strictly below 1/2. That finished
      ratio falsifies both the factor-of-two support reading and the
      fill-in reading. It is the concrete negative named for this
      contract.
    - >-
      The eight targets are complete, the second build matches, the
      support-matched median is at least 1/2, and the dense median is
      strictly above 1/2. The sparse-memory reading against the dense
      column bound is then false on this cell.
    - >-
      After 32 draws, fewer than eight targets have a usable triple
      of peak counts. The comparison is inconclusive, not a
      confirmation of either reading.
  interpretation_limits:
    - >-
      One prime and B = 8. A factor-of-two statement here is not a
      memory exponent for cryptographic parameters.
    - >-
      peak_nnz is an implementation count for the declared
      elimination. A different linear-algebra kernel can change it.
    - >-
      This does not propose a sparse algorithm and does not claim
      that the dense Macaulay bound is avoided at large degree.
    - >-
      A median of peak_nnz / initial_nnz at least 2, with the
      support-matched median still inside the closed interval from
      1/2 to 2, retires initial_nnz as the memory coordinate and
      keeps the peak comparison. It is not a negative.
    - >-
      No comparison with Pollard rho is implied by a nonzero-count
      ratio. KR-IC-5931ee, opened in this session, remains the
      prime-field Semaev negative under its stated assumptions.
