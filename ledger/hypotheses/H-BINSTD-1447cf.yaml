# =============================================================================
# H-BINSTD-1447cf -- HOLD-X10 instance-dependence / known-log pool census.
# Specified from IDEA-20260926-beb5b6 under RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001. Approved DEC-20261002-eaddc1.
#
# HOLD-X10 (DEC-20260928-63addc rank 23; revisit_when: certificate shortlist
# HOLD-X3..X5 written). Consolidates IDEA-20260926-178821 (conjugate known-log
# base) and IDEA-20260926-b48c9d (Gamma-orbit tau-adic base) as class members,
# not separate contracts. ZERO RUNS in this design packet. No AUXIN.
# No Bedrock. No curve attack / exponent claim. Claim tier: control /
# measurement. Stages 0-4 authorized. TW-03 / TW-10 carried into review.
# =============================================================================
hypothesis:
  id: H-BINSTD-1447cf
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-beb5b6
  experiment_id: EXP-BINSTD-684a71
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-eaddc1
  status: approved
  proposed_by: coordinator
  title: >-
    Target-dependent factor bases collapse to instance-dependent known-log
    pools (or relabelings); on the n=19 Koblitz cell the tau-adic walk DP
    pool's zero-sum m-subset counts equal the Poisson prediction and both
    controls (H_generic), closing the KN-OPEN-020 target-dependent row with
    the priced m-SUM floor

  statement: >-
    CLAIM (control / measurement; HOLD-X10; NO ATTACK). Setting: binary
    curves over F_{2^n}, n=19 toy cell (Koblitz + ordinary) and the
    relabelled Z/(4l) control; known-log pools of size B in {32,64,128}.
    HYPOTHESIS: (A) Instance-dependence lemma (exact, Stage 0): a factor
    base whose description depends on the target R shares unknowns across
    random-target descents only through its instance-dependent part; the
    three cases are (i) known-log pools, (ii) relabelings of ordinary
    bases (x_Q+V, x_Q V, F_V-Q, phi^{-1}(F_V)), (iii) mixtures — with
    (ii) lossless and product-law neutral. (B) On ECC2K-130 arithmetic
    alone (Stage 0): a pool of B=2^33 DPs has expected C(B,m)/l zero-sum
    m-subsets ≈ 2^{-1.6} (m=4) and 2^{29.1} (m=5); two-list / filter-capped
    k-tree finding costs ≥ 2^{66} at m in {3,4}, above rho remaining
    ≈2^{60.5}. (H_generic / H_structured) At n=19, for m in {3,4} and B in
    {32,64,128}, the Koblitz walk pool's zero_sum_ratio to Poisson lies in
    [0.5, 2] and within [0.67, 1.5] of both the relabelled and non-walk
    controls (H_generic, predicted); an excess >3× replicated across ≥10
    of 20 seeds and absent on both controls is H_structured. Bracket-
    vanishing rate ≈ 1/l. CLAIM TIER: measurement. NO exponent. NO
    ECC2K-130 break. NO Magma/Sage/AUXIN. TW-03 (178821 D1-as-budget) and
    TW-10 (beb5b6 toy-rho convention) are carried into the review round,
    not adjudicated as closures under this card.

  mechanism: >-
    OBJECT FRAME. Representation R1: pool of pairs ((a_i,b_i), W_i) with
    x(W_i) in the DP set (F1 walk object with known representation).
    Operation set Sigma = {walk step W→σ^j(W)+W, σ, negation} — a proper
    sub-action of translation. Trichotomy: BRANCHING for the pool as a
    whole (DP predicate HW(x)≤w); Class I for the zero-sum relation vector.
    Lossy projection W→[x(W) is distinguished] is Sigma-compatible with
    σ/negation and not with the walk step. WHAT IS NEW relative to 178821
    (conjugate known-log base, arity ≈23) and b48c9d (Gamma-orbit): the
    instance-dependence lemma, the zero-sum arithmetic of the collected
    B=2^33 pool, and the walk-versus-non-walk / relabelled census that
    decides H_generic vs H_structured. Charged stage: m-SUM search over
    the pool — relation collection and LA vanish for known-log pools.
    Consolidated members 178821 and b48c9d are cited class endpoints, not
    redesigned.

  assumptions:
    - >-
      Collected DPs have known (a,b) in terms of k relative to start
      points; campaign data are not required — only count and predicate.
    - >-
      Two-list bound is the generic m-SUM cost; k-tree needs a
      sum-compatible filter capped at 2 bits (IDEA-20260926-136bd3).
    - >-
      Executable work is toy-tier n=19 only; n=131 figures are Stage-0
      arithmetic + H_generic transfer, labelled extrapolation.
    - >-
      OFF-LIMITS: F1 supplies the pool; F2 is the family; F7
      (Bernstein-Lange tables) is dominated for a single instance.
    - >-
      Amazon Bedrock prohibited. No AUXIN. No Magma/Sage as success path.
    - >-
      TW-03 / TW-10: review-breakthrough items on comparator conventions;
      this contract measures the census and does not rewrite those
      proposals' claim text.

  proof_search_map:
    bottleneck: >-
      Whether any walk-carried known-log pool carries Z[τ]-structure an
      m-SUM solver could read below the two-list bound; the certificate
      predicts no (H_generic) and the census tests it.
    baseline_embedding:
      parameter_slice: >-
        m=2 on the pool = DP-DP collision; B=524 conjugate structure =
        178821; B=1 with Gamma_w = b48c9d; relabelled Z/(4l) random
        known-log pool = generic Poisson slice.
      reproduction_check: >-
        Stage 0: re-derive C(B,m)/l at B=2^33 and 2^35.5 within 0.3 bit of
        2^{-1.6} / 2^{29.1} (m=4/5); toy fixture C(64,4)/130873 ≈ 4.9 on
        the relabelled control. Stage 2: every counted zero-sum verifies by
        curve arithmetic; bracket rate ≈1/l. Mismatch → O-ARTIFACT.
    observation_collision:
      observable: >-
        Zero-sum m-subset count per pool per m; bracket-vanishing rate;
        ops_4sum vs ops_rho on the same instance.
      distinct_preimage_search: >-
        Excess could be (i) Z[τ] concentration (H_structured), (ii)
        repeated points, (iii) sign handling. Separated by de-duplication,
        relabelled control (shares sign code), and non-walk random pool.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold "pool of B known-log points with m-SUM mechanism" fixed;
          vary production: tau-adic walk (Koblitz), 16-adding walk
          (ordinary), random known-log draw, relabelled Z/(4l) walk.
        predicted_gain: >-
          None on any cost axis under H_generic; a measured null instead
          of an asserted one.
      - transform: representation_reduction
        proposed_object: >-
          Rewrite the KN-OPEN-020 target-dependent class as the three-way
          instance-dependent split of claim (A).
        predicted_gain: >-
          Two cases become relabelings; the third is priced by Stage 0 and
          tested by the census.
    quantifier_order: >-
      FORALL target-dependent bases F_R used for random-target descent:
      unknowns shared only through the instance-dependent part (exact).
      FORALL known-log pools of size B: expected zero-sums C(B,m)/l and
      generic m-SUM cost B^{ceil(m/2)}. EXISTS the n=19 cell where the
      walk pool is measured; PREDICTED agreement (H_generic).
    method_ceiling:
      strongest_certifiable_claim: >-
        On ECC2K-130 the collected 2^33 DP pool is expected to contain
        ≈2^{-1.6} zero-sum 4-subsets and ≈2^{29.1} zero-sum 5-subsets;
        finding one costs ≥2^{66} by two-list / filter-capped k-tree,
        above rho remaining ≈2^{60.5}; and on the n=19 Koblitz cell the
        walk pool's zero-sum counts at m≤4 equal Poisson and both
        controls within the frozen bands. Certifies nothing about a
        structured m-SUM solver (not proposed).
      nearby_object_control: >-
        Relabelled Z/(4l) walk (blocking; must sit on Poisson); ordinary
        n=19 16-adding walk (no-Z[τ] null); random non-walk known-log
        pool; de-duplication by point; curve-arithmetic verification of
        every zero-sum and every rho solve.
    proof_obligations:
      - claim: Instance-dependence lemma (A) with the three-way split.
        responsibility: correctness
      - claim: Class-(ii) relabelings are lossless (one line each).
        responsibility: correctness
      - claim: Zero-sum counts C(B,m)/l at B=2^33 and 2^35.5, re-derived.
        responsibility: size
      - claim: Two-list + 2-bit filter cap give ≥2^{66} at m in {3,4}.
        responsibility: runtime
      - claim: Bracket-vanishing rate ≈1/l on the toy cell.
        responsibility: success_probability
      - claim: Every toy zero-sum re-verified by curve arithmetic.
        responsibility: correctness
      - claim: Nothing proposes or bounds a structured m-SUM solver.
        responsibility: scope
    not_applicable_reason: null

  heuristic_assumptions:
    - id: H-beb5b6-1
      formal_statement: >-
        (H_generic.) For the tau-adic walk DP pool on the n=19 Koblitz
        cell, at every (m,B) in {3,4}×{32,64,128}, the ratio of exhaustive
        zero-sum count to C(B,m)/l lies in [0.5, 2] and within [0.67, 1.5]
        of both the relabelled and non-walk controls, across 20 seeds.
      random_model_justification: >-
        Under a uniform random model of known-log points in an order-l
        group, m-subset sums are approximately Poisson with mean C(B,m)/l;
        the walk's Z[τ] structure is assumed not to concentrate the DP
        pool onto a structured sub-lattice at these sizes.
      supporting_results:
        - >-
          Exact expectation C(B,m)/l for uniform random m-subsets in a
          group of order l (elementary counting).
        - >-
          Two-list / Wagner k-SUM bounds (recalled; used for cost floor
          only, not for the census prediction).
      validation_experiment_ids: [EXP-BINSTD-684a71]
      falsification_condition: >-
        Koblitz/Poisson ratio outside [0.5, 2] or Koblitz/control ratio
        outside [0.67, 1.5] at m in {3,4}, replicated across ≥10 of 20
        seeds and absent on both controls → H_structured (H_generic
        false for the tau-adic walk pool).

  predictions:
    - metric: zero_sum_ratio (Koblitz walk / Poisson) at m in {3,4}, B in {32,64,128}
      direction: same
      minimum_effect: >-
        Within [0.5, 2] at every cell and within [0.67, 1.5] of both
        controls (H_generic). Excess >3× replicated → H_structured.
    - metric: bracket_vanishing_rate
      direction: lower
      minimum_effect: >-
        About 1/l = 1/130873; rate >1/1000 on any arm → O-ARTIFACT.
    - metric: ops_4sum / ops_rho at B=128, 50 seeds
      direction: higher
      minimum_effect: >-
        Reported ratio; design caps B≤128 < sqrt(l) so m=2 collisions do
        not dominate. Not extrapolated to n=131.
    - metric: Stage-0 recomputed E[zero-sum 4-subsets] at B=2^33
      direction: same
      minimum_effect: 2^{-1.6} within 0.3 bit; else arithmetic error.

  test_boundary:
    instances:
      - n19_koblitz_walk_pool
      - n19_ordinary_16adding_pool
      - n19_relabelled_Z4l_pool
      - n19_random_knownlog_pool
    parameters:
      n: 19
      modulus: t^19 + t^5 + t^2 + t + 1
      koblitz_order: 4 * 130873
      l: 130873
      B: [32, 64, 128]
      m_census: [2, 3, 4]
      seeds_per_arm: 20
      stage3_seeds: 50
    implementation: >-
      Pure-Python toy walk + DP collection + (a,b) bookkeeping + pair-hash
      zero-sum census + two-list 4-SUM + toy rho with classes, on
      EXP-CERTBIN-e94b27/impl/{gf2n,curve}.py generalised to n=19.
    budget:
      wall_clock_seconds: 14400
      memory_gb: 4
      maximum_runs: 8

  falsification_conditions:
    - >-
      Relabelled control off Poisson by >2× at any m → O-ARTIFACT;
      nothing read about H_generic.
    - >-
      Verified zero-sum with nonzero bracket that does not yield k →
      bookkeeping defect; record withdrawn as evidence.
    - >-
      Koblitz excess >3× Poisson at m in {3,4}, replicated, absent on both
      controls → H_generic false; class reopened (H_structured).
    - >-
      Stage-0 B=2^33 counts disagree with 2^{-1.6}/2^{29.1} by >0.5 bit →
      arithmetic error; superseding Stage-0 note required before Stage 1.

  interpretation_limits:
    - Toy tier n=19; n=131 row is Stage-0 arithmetic under H_generic only.
    - No structured m-SUM solver is proposed or bounded.
    - No ECDLP exponent moved; sota_delta zero on every attack axis.
    - TW-03 / TW-10 comparator conventions are review items, not closures here.
    - KN-OPEN-020 target-dependent class closed only under H_generic reading.

  distinguishable_outcomes:
    - id: O-H-GENERIC
      meaning: >-
        H_generic holds: class closed with instance-dependence lemma and
        priced known-log-pool row (2^{-1.6}/2^{29.1}; m-SUM ≥2^{66}).
    - id: O-H-STRUCTURED
      meaning: >-
        Replicated Koblitz-only excess; pool non-generic; structured m-SUM
        object handed forward (separate proposal).
    - id: O-ARTIFACT
      meaning: >-
        Control off Poisson, bracket rate off 1/l, verification failure, or
        Stage-0 arithmetic mismatch; nothing read.
    - id: O-IMPEDIMENT
      meaning: >-
        Infra/timeout/missing dependency; never negative mathematical
        evidence (AGENTS.md rule 3).

  asymptotic_claim: null
  asymptotic_claim_note: >-
    No exponent improvement claimed. Stage-0 prices a known-log-pool row
    of the reachability table; the census is a control measurement.

  dominated_by: >-
    Parallel Pollard rho on ECC2K-130 (≈2^{60.81}) dominates the m-SUM
    route (≥2^{66}) under H_generic. At the toy cell, rho also dominates
    the 4-SUM at B≤128 by design. The record dominates nothing on an
    attack axis; it supplies a closed class certificate.

  sota_delta:
    time: Zero on every ECDLP axis.
    memory: Zero on every ECDLP axis.
    data_queries: Not applicable.

  status_note: >-
    Approved under standing user authorization by DEC-20261002-eaddc1.
    Approval asserts nothing about whether H_generic holds.
