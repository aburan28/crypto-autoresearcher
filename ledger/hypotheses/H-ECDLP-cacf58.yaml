  proof_search_map:
    bottleneck: >
      Whether the split-prime
      Gauss-norm table holds as
      exact integer arithmetic on
      the frozen toy. Stage 0 only
      checks that identity, the
      inert known-false, and the
      empty nearby object.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL
        fixtures. Disclosed
        tightening: split/inert
        Gauss-norm calibrator
        only, not the proposal's
        Coppersmith / E1-01
        eps-hat, not Semaev S_m,
        not a yield ratio k.
      reproduction_check: >
        REAL norms equal
        [0, 1, 4, 4, 2, 1, 2, 2,
        1, 2, 4, 4, 1]. KF inert
        p=7 rejected. NULL empty
        residue list rejected.
        p=0 rejected.
    observation_collision:
      observable: >
        shortest-lift Gauss norms
        versus the frozen 13-tuple.
      distinct_preimage_search: >
        Hold the ring Z[i] and
        replace the split prime
        by an inert prime (KF).
        Hold the ring and replace
        the residue list by empty
        (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact split-prime Gauss-norm table.
        predicted_gain: >
          Exact known-false inert
          reject on KF. Zero
          claimed attack
          improvement.
    quantifier_order: >
      Freeze the ring and the
      split prime before reading
      the table. Existential
      equality at one toy does
      not imply Coppersmith reach
      and does not imply a rho
      beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen toys.
        Never Coppersmith.
        Never Semaev S_m.
        Never a yield ratio k.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is the empty residue
        list. An argument that
        still assigns it a true
        Gauss table is wrong. KF
        is the inert prime; an
        argument that assigns
        every prime a split
        Gauss table is wrong.
    proof_obligations:
      - claim: well-defined exact split-prime Gauss-norm table
        responsibility: correctness
      - claim: exact REAL 13-tuple at p=13
        responsibility: baseline
      - claim: exact KF inert reject at p=7
        responsibility: baseline
      - claim: no Coppersmith, no Semaev S_m, no Velu, no yield k, no Stage 1 of a294b6/835df6/5f3822/6ffef4/11c247/114eb2/821bc5/735974/fdae20/089e80/b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
