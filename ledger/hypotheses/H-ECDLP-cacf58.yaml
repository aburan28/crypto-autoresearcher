  statement: >
    Fix the ring Z[i] before any
    Coppersmith small-root solve,
    Semaev polynomial, Velu map,
    yield ratio, or (L,b) meter is
    read. Stage 0 asserts only that
    a split-prime Gauss-norm table
    is a well-defined integer
    identity and that the same
    construction rejects an inert
    prime. For p = 13 (p ≡ 1 mod 4)
    the prime splits as ππ̄ with
    π = 2+3i. The π-lattice has
    basis (2,3), (-3,2). The
    shortest-lift norms of residues
    x = 0..12 are the frozen
    13-tuple
    [0, 1, 4, 4, 2, 1, 2, 2, 1, 2,
    4, 4, 1]. KF is inert p = 7
    (p ≡ 3 mod 4): the split-prime
    construction is rejected.
    NULL empty residue list is
    rejected. p=0 is rejected.
    This is not Coppersmith, not
    Semaev S_m, not a Velu isogeny,
    not a yield ratio k, not
    elliptic M_S, not an (L,b)
    meter, not an Aut census, not
    an orbit cost, not a 1D-versus-
    2D eps-hat comparison, and not
    a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260906-09b937 says every
    x in F_p is a coset of the
    rank-2 lattice p_K when p
    splits in O_K, and Gauss-
    Lagrange reduction reads a
    shortest lift in O(log p).
    Stage 0 freezes that identity
    as exact integer norms on one
    split toy and rejects the
    inert nearby object. The
    producer enumerates shortest
    vectors in (x,0) + Z(2,3) +
    Z(-3,2) and compares the
    resulting norms to the frozen
    table. The KF inert prime and
    the NULL empty list are the
    proves-too-much and nearby-
    object controls. No
    Coppersmith solve is run.
    No Semaev S_m is formed.
    This is a new GOAL-ECDLP-001
    object after Stage 0 of
    EXP-ECDLP-835df6 held as
    P-S0-DECKTYPE
    (DEC-20260908-a3cc26). It is
    not Stage 1 of EXP-ECDLP-835df6
    and not Stage 1 of this
    experiment.
  predictions:
    - id: P-S0-QRESIDUE
      metric: well-defined exact split-prime Gauss-norm table on a frozen toy
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        norms equal the frozen
        13-tuple
        [0, 1, 4, 4, 2, 1, 2, 2,
        1, 2, 4, 4, 1]. KF inert
        p=7 is rejected. NULL
        empty residue list is
        rejected. p=0 is rejected.
        One certified miss after
        fixture_pass is a scoped
        falsification of this
        instrument at the frozen
        toys.
      claim_tier: observational
    - id: P-S1-COPPERSMITH
      metric: Coppersmith / E1-01 eps-hat of a 2D box versus a 1D window
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here.
        Stage 0 does not run
        Coppersmith, does not form
        Semaev S_m, and does not
        claim an eps-hat comparison.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-INERT
      statement: >
        After fixture_pass, KF
        inert p=7 is accepted as a
        split-prime Gauss table.
        An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALNORM
      statement: >
        After fixture_pass, REAL
        fails to match the frozen
        13-tuple of norms. That
        falsifies only
        P-S0-QRESIDUE at the
        frozen split toy.
    - id: F-S1-COPPERSMITH
      statement: >
        After an authorized later
        stage, a claimed eps-hat
        comparison that misses the
        proposal's pre-registered
        null. Unauthorized here.
  test_boundary:
