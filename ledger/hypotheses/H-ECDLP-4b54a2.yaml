  title: >-
    PREPROCESSING RE-READING OF THE WINDOWED SMALL-ROOT FAMILY AT (m = 3, w = 1):
    does the JOINT small-root region of the coupled summation system
    {S_3(x1, x2, y), S_3(y, x3, x_R)} reach an S T^2 exponent below the
    generic-group line, once the lattice determinant condition is stated
    correctly

  statement: >-
    SETTING AND CODOMAINS. p is a prime, E/F_p is an ordinary curve of prime
    order N (N = p up to O(sqrt p)), P generates E(F_p), and x(.) is the affine
    x-coordinate in F_p read as an integer in [0, p). The factor base is
    F_beta = { R in E(F_p) : x(R) in [0, p^beta) }. The advice is the table of
    discrete logarithms of F_beta, so S = p^beta table entries, computed
    generically by batch rho at precomputation cost p^{(1 + beta)/2}. The
    online algorithm draws c uniformly, sets R_c = Q + [c]P (uniform in E(F_p)),
    and tries to write R_c = P1 + P2 + P3 with all P_i in F_beta by ONE joint
    small-root solve, modulo p, of the two-equation system
    f1(x1, x2, y) = S_3(x1, x2, y) = 0 and f2(y, x3) = S_3(y, x3, x_R) = 0 in the
    four unknowns x1, x2, x3 in [0, p^beta) and the kept internal node
    y = x(P1 + P2) in [0, p^gamma), gamma <= 1, where x_R = x(R_c) is KNOWN.
    Each trial succeeds with probability p^{3 beta + gamma - 2 + o(1)} (heuristic
    HEUR-1), so the online cost is T = p^{2 - 3 beta - gamma + o(1)} trials, and
    the algorithm's storage-time product is S T^2 = p^e with
    e = 4 - (5 beta + 2 gamma), measured in the same exponent codomain as the
    generic-group preprocessing bound S T^2 = Omega~(p) of Corrigan-Gibbs and
    Kogan (KN-LIT-013), whose generic line is e = 1.
    CLAIM UNDER TEST (the generator's claim, NOT the Coordinator's expectation).
    Let R_HG(t, order) be the set of (beta, gamma) with beta >= 0, 0 <= gamma <= 1
    and 3 beta + gamma <= 2 (the information ceiling of two equations in four
    unknowns) satisfying beta*A + gamma*B <= C_HG for the shift set JS(t; order)
    frozen in EXP-ECDLP-64fa3d, where (A, B, C_HG) are integers read off that
    shift set
    under the Howgrave-Graham determinant convention HG defined in that
    contract. The claim is that the extrapolated or finite-t region meets
    {5 beta + 2 gamma > 3}, equivalently that the joint capacity kappa_HG
    (the value of 3 beta + gamma on the gamma = 1 boundary of R_HG) exceeds 8/5,
    equivalently that e_HG < 1 at prime fields F_p with p to infinity for fixed
    multiplicity t, within the frozen JS(t) family only.
    SECOND, INDEPENDENT COMPONENT (the convention audit, a Coordinator
    derivation added at design time). The committed instrument
    tools/smallroot_reach.py compares prod X_i^{s_i} with p^{s_p} where s_p is
    the p-exponent of det(L) (the sum over shifts of t - k), whereas the
    Howgrave-Graham criterion det(L) < p^{t N} makes the correct comparison
    exponent t*N - s_p = sum over shifts of k. The two agree in the n = 1 limit
    (which is all its calibration test covers) and differ for n >= 2: in the
    committed convention TOOL the full-box limit is 2n/(d(n+1)); in convention HG
    it is 2/(d(n+1)); at n = 2, d = 1 TOOL reads 4/3, above the information
    bound 1. This is a checkable prediction of this hypothesis about the
    instrument, decided by exact integer determinants, not a heuristic.

  mechanism: >-
    Index calculus with a windowed factor base in the preprocessing model: rows
    (I) relation collection and (II) linear algebra of the full-ECDLP demand of
    IDEA-20260903-81a943 disappear because the factor-base logarithms are
    computed generically in precomputation, leaving only the per-target demand
    (I') (2m - 1) beta - 2G > 1 (G = sum over kept nodes of (1 - gamma_v)) against
    the solvability supply (III) m beta + sum over kept nodes of gamma_v <= eps
    (w + 1). Eliminating G gives eps_req_pre(m, w) =
    (w + 1/2 + 1/(2(2m - 1))) / (w + 1), attained at G = 0 and
    beta = 1/(2m - 1); at (m, w) = (3, 1) this is eps = 4/5 per equation, total
    capacity 8/5 over two equations. The supply is the joint Jochemsz-May-style
    shift lattice of the two polynomials, whose exact per-variable exponent sums
    are computed by the frozen JS(t) builder and compared under both the
    correct convention HG and the committed convention TOOL. Nothing in the
    mechanism uses more than the Newton polytopes of f1 and f2 (13 and 9
    monomials).

  assumptions:
    - >-
      The two polynomials have generic coefficients on their Newton polytopes
      (a, b, x_R generic in F_p): supp(f1^i f2^j) equals the Minkowski sum
      i*supp(f1) + j*supp(f2). Validated for i + j <= 3 by control C-GEN of
      EXP-ECDLP-64fa3d (HEUR-3), never assumed beyond that.
    - >-
      The leading coefficients of f1 and f2 under the frozen monomial orders are
      invertible modulo p (true for all but a p^{-Omega(1)} fraction of
      (a, b, x_R)).
    - >-
      Exponent bookkeeping is in the p -> infinity limit at fixed multiplicity
      t, with the t -> infinity value obtained by the frozen two-point
      Richardson extrapolation in 1/t and its three-point consistency check
      (HEUR-4). LLL approximation factors and dimension factors are 2^{O(dim)}
      = p^{o(1)} at fixed t and are outside the exponent.
    - >-
      Scope is prime-order ordinary curves over F_p in the short Weierstrass
      form y^2 = x^3 + a x + b, with no small embedding degree, no anomalous
      structure and no endomorphism beyond negation.

  proof_search_map:
    bottleneck: >-
      The joint small-root capacity of the coupled system, read at the
      gamma = 1 vertex of the region R_HG(t, order), against the threshold
      kappa = 8/5; and, upstream of it, WHICH determinant convention defines
      that capacity. Removing the wrong-convention step (TOOL) changes every
      supply number in tools/smallroot_reach.py and CLOSURE.md.
    baseline_embedding:
      parameter_slice: >-
        Single polynomial, n = 1: Coppersmith's univariate reach 1/d exactly,
        d in {1, 2, 3, 4, 5, 8, 16}, under convention HG (and under TOOL, where
        the committed test already passes). Second slice, n >= 2 full box:
        the HG limit 2/(d(n+1)); the TOOL limit 2n/(d(n+1)). Third slice, the
        committed single-S_3 value 0.840814 (13 of 27 monomials) reproduced
        under TOOL as an audit row.
      reproduction_check: >-
        Frozen regression fixtures inside EXP-ECDLP-64fa3d controls K1, K2, K3a
        and R-TOOL-repro, plus the hand instance n = 1, d = 2, t = 1
        (three-dimensional lattice, det = p^2 X^3, HG reach 1/3, TOOL reading
        2/3) checked by exact integer arithmetic.
    observation_collision:
      observable: >-
        The pair (per-variable exponent sums s_i, comparison exponent) of a
        triangular shift lattice, i.e. a function of the Newton polytopes and
        the shift assignment only.
      distinct_preimage_search: >-
        Collision exhibited by construction and it is the audit itself: the
        conventions HG and TOOL assign different capacities to the SAME
        explicit lattice (same integer basis, same determinant). Also
        collided: a summation pair and a random pair on identical polytopes
        have the same observable, so the calculator can never see
        summation-specific structure; control C-GEN and the near-polytope
        control bound that blindness to the generic-support assumption.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The preprocessing decision rewritten as one linear inequality
          5 beta + 2 gamma > 3 over the integer triple (A, B, C) of a
          triangular shift lattice, encoded exactly, complete for the frozen
          JS(t) family, sound because every JS(t) basis is verified triangular
          with distinct leading monomials and the HG inequality is a theorem.
        predicted_gain: >-
          An exponent decision by exact integer arithmetic instead of a toy
          crossover measurement.
      - transform: boundary_lift
        proposed_object: >-
          The m = 2 slice as the boundary (bivariate S_3(x1, x2, x_R), full
          3 x 3 box) and (m, w) = (3, 1) as the first strict inward step.
        predicted_gain: >-
          Strict improvement only if kappa_HG > 8/5; otherwise a certified
          non-improvement at the first inward step within the frozen family.
    quantifier_order: >-
      EXISTS (beta, gamma) with 5 beta + 2 gamma > 3 and gamma <= 1 such that FOR
      ALL sufficiently large primes p and FOR ALL prime-order curves in scope,
      for a 1 - o(1) fraction of re-randomised targets, the online algorithm
      returns the logarithm in p^{2 - 3 beta - gamma + o(1)} trials, ASSUMING
      HEUR-1 and HEUR-2. The witness (beta, gamma) and the multiplicity t may
      not depend on p or on the curve. The frozen family fixes the polynomial
      supports before any coefficient is drawn.
    method_ceiling:
      strongest_certifiable_claim: >-
        Within the frozen JS(t; order) family, t <= 8, two monomial orders,
        symmetric windows on x1, x2, x3: a deterministic exponent-arithmetic
        verdict (ALIVE_FINITE, ALIVE_EXTRAPOLATED, NEAR_THRESHOLD,
        DEAD_IN_FAMILY, DEAD_AT_TESTED_T_ONLY, VOID_CALIBRATION). A DEAD verdict
        closes ONLY that family and never a lattice method in general (finite-t
        values are lower bounds on capacity; no rigorous upper bound on lattice
        capacity is available). An ALIVE verdict is heuristic (HEUR-1, HEUR-2)
        and routes to review-breakthrough at max effort before any status move.
      nearby_object_control: >-
        (i) The m = 2 slice and the eliminated single-polynomial formulation
        S_4(x1, x2, x3, x_R) of the same root set, computed beside the joint
        region; a joint region that beats the eliminated form must be
        attributed to joint shifts and not to bookkeeping. (ii) The committed
        convention TOOL, which must be shown to violate the information bound
        exactly where derivation says (n >= 2, d = 1) and nowhere else in the
        tested grid.
    proof_obligations:
      - claim: >-
          Convention HG is the Howgrave-Graham condition det(L) < p^{t N}, and
          every JS(t) basis is triangular with det(L) = p^{sum of (t - level)}
          times prod X_i^{s_i}.
        responsibility: correctness
      - claim: >-
          eps_req_pre(m, w) and the 8/5 threshold at (3, 1) follow from
          (I') and (III) with G = 0, beta = 1/(2m - 1).
        responsibility: baseline
      - claim: >-
          The nine-monomial support of f2 and the thirteen-monomial support of
          f1 hold for generic (a, b, x_R).
        responsibility: size
      - claim: >-
          The t -> infinity value is obtained from finite t by Richardson
          extrapolation in 1/t with a consistency check.
        responsibility: runtime
      - claim: >-
          Per-trial success probability is p^{3 beta + gamma - 2 + o(1)}.
        responsibility: success_probability
      - claim: >-
          Under HEUR-2, the shortest LLL vectors define a zero-dimensional
          common zero set containing the planted root.
        responsibility: correctness
      - claim: >-
          log Q = sum eps_i log P_i - c, certified by one scalar multiplication.
        responsibility: interface
      - claim: >-
          Every statement is scoped to prime-order curves over F_p in the stated
          class, the frozen shift-set family, and convention HG.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: >-
    Worst-to-average-case device: R_c = Q + [c]P for c drawn uniformly from
    {0, ..., N - 1}. R_c is exactly uniform on E(F_p), so the per-trial success
    probability does not depend on Q (unconditional). The logarithm is pulled
    back by log Q = sum_i eps_i log P_i - c (mod N), with eps_i in {+1, -1} and
    log P_i read from the advice table, and is certified by one scalar
    multiplication. No mixing-time argument is needed because there is no walk.

  asymptotic_claim:
    problem: >-
      Discrete logarithm with preprocessing in prime-order E(F_p), storage-time
      tradeoff S T^2 (S in table entries, T in online trials of polynomial cost
      each).
    prior_best: >-
      Generic-group preprocessing bound S T^2 = Omega~(p) (Corrigan-Gibbs and
      Kogan, KN-LIT-013), attained by Bernstein-Lange (KN-LIT-3060, KN-LIT-5230)
      at S = T = p^{1/3} with precomputation p^{2/3}; no advice: Pollard rho
      p^{1/2}.
    time_exponent: >-
      CONDITIONAL, NOT CLAIMED. T = p^{2 - 3 beta - gamma}; S T^2 = p^{4 - 5 beta
      - 2 gamma}; at the gamma = 1 vertex beta = (kappa - 1)/3 and
      S T^2 = p^{(11 - 5 kappa)/3}, which is below the generic line iff
      kappa > 8/5. Whether any kappa exceeds 8/5 in the frozen family is the
      test; Coordinator prior of ALIVE under HG is at most 0.03.
    memory_exponent: >-
      S = p^beta table entries (beta = (kappa - 1)/3 at the vertex); online
      lattice memory poly(t, log p); precomputation working memory of batch rho
      O(sqrt(|F| N)).
    hidden_cofactor: >-
      The o(1) hides the finite-multiplicity loss O(1/t) and LLL on lattices of
      dimension Theta(t^4): polynomial in log p at fixed t with very large
      constants; sign and ordering constants (3!, 2^3) and the |F_beta|
      constant. Any ALIVE verdict must be re-priced at t in {2, 3, 4} before a
      concrete-cost table exists.
    claim_kind: exponent_improvement

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        YIELD EQUIDISTRIBUTION (the generator's H-A1). For p prime, E/F_p in
        scope, 0.2 <= beta <= 0.37, 0.5 <= gamma <= 1: |F_beta| =
        p^beta (1 + o(1)), and for R uniform in E(F_p) the number of triples
        (P1, P2, P3) in F_beta^3 with x(P1 + P2) in [0, p^gamma) and
        P1 + P2 + P3 in {R, -R} is asymptotically Poisson with mean
        kappa_0 p^{3 beta + gamma - 2}, uniformly in that range (kappa_0 the
        counted sign and ordering constant).
      random_model_justification: >-
        Sums of independent uniform elements of a finite abelian group are
        uniform and the number of representations of a uniform target by a
        random set is Poisson. Weil-type character sums for points with
        x-coordinate in an interval (recalled) give equidistribution up to a
        p^{1/2 + o(1)} error, non-trivial only for windows longer than p^{1/2};
        at the relevant beta near 0.2 they are vacuous, so the count is
        heuristic and must be measured.
      supporting_results:
        - ref: IDEA-20260923-9e4b71
          provenance: internal
          claim: yield exponent 3 beta + gamma - 2 and the Poisson model
          verified_by: null
      validation_experiment_ids: []
      falsification_condition: >-
        Exact enumeration at p in {2^20, 2^24, 2^28}, three curves each, of the
        representation counts of 10^4 uniform R per (beta, gamma) cell shows a
        mean deviating from the model by more than a factor 2 at the largest p,
        or a count histogram rejecting Poisson at the 0.01 level. SCHEDULED, NOT
        YET AN EXPERIMENT: no validation experiment id exists for HEUR-1. It is
        owed only if EXP-ECDLP-64fa3d returns ALIVE_FINITE or
        ALIVE_EXTRAPOLATED (DEC-20260929-b371e1 next_actions); a DEAD or VOID
        verdict issues no conditional claim, so nothing conditional on HEUR-1 is
        dispatched. This entry therefore caps the hypothesis below supported.
    - id: HEUR-2
      formal_statement: >-
        JOINT LATTICE INDEPENDENCE (the generator's H-A2). For the coupled
        system at multiplicity t, whenever the Howgrave-Graham determinant
        condition holds at the true bounds, the shortest LLL vectors of the
        JS(t) lattice define polynomials whose common zero set with f1 and f2 is
        zero-dimensional and contains the planted root, for all but a
        p^{-Omega(1)} fraction of instances.
      random_model_justification: >-
        Howgrave-Graham's lemma is unconditional (a short enough vector gives an
        identity over Z); only algebraic independence of several such vectors is
        heuristic. Classical statement imitated: generic polynomials with
        prescribed Newton polytopes meet in the BKK number of points.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Planted-root LLL recovery for the coupled system at p near 2^40, 2^64,
        2^96, t in {2, 3, 4}, on a grid of (beta, gamma) straddling the computed
        boundary, 50 instances per cell: recovery below 0.5 inside the region at
        every p, or non-decay outward across the boundary. SCHEDULED ONLY
        CONDITIONALLY on an ALIVE verdict, exactly as HEUR-1. The bivariate
        corroboration trial lll-corroboration of EXP-ECDLP-64fa3d tests only the
        determinant criterion on a bilinear pair, not HEUR-2 for this system.
    - id: HEUR-3
      formal_statement: >-
        GENERIC SUPPORT. For generic (a, b, x_R) in F_p, the support of
        f1^i f2^j equals the Minkowski sum i*supp(f1) + j*supp(f2) for every
        i + j <= 3, where supp(f1) has the thirteen monomials of S_3 and
        supp(f2) the nine monomials of the 3 x 3 box in (x3, y).
      random_model_justification: >-
        Coefficients of a product of polynomials with independent generic
        coefficients on given supports have no forced cancellation; a
        cancellation would need a coincidence of order p^{-1}.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-64fa3d
      falsification_condition: >-
        Control C-GEN of EXP-ECDLP-64fa3d finds, for either coefficient draw and
        any (i, j) with i + j <= 3, an actual support differing from the
        Minkowski sum. The family is then NOT silently repaired: the deviation
        is recorded, and the verdict is computed both on the Minkowski model and
        on the actual supports for i + j <= 3.
    - id: HEUR-4
      formal_statement: >-
        EXTRAPOLATION REGULARITY. For each monomial order and each of the two
        scale-free ratios C/A and B/A of the JS(t) shift sets (which determine
        the feasible polygon), the sequence in t is a smooth function of 1/t, so
        the two-point Richardson value 2 q(t_b) - q(t_b/2) estimates the
        t -> infinity limit to within 0.02 in the exponent e.
      random_model_justification: >-
        The determinant sums are polynomials in t; ratios of polynomials of
        equal degree have an expansion in 1/t. The committed instrument relies
        on the same regularity.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-64fa3d
      falsification_condition: >-
        The frozen three-point quadratic extrapolation in 1/t through the three
        largest completed t and the two-point Richardson value differ by more
        than 0.02 in e for either monomial order: the extrapolated verdict is
        then unresolved and only finite-t values are used.

  structural_ingredients:
    - description: >-
        Howgrave-Graham lemma and the LLL determinant criterion det(L) < p^{t N}
        for a triangular shift lattice of dimension N whose vectors vanish
        modulo p^t at the root.
      citation: >-
        Howgrave-Graham, Finding small roots of univariate modular equations
        revisited, 1997; Coppersmith, 1996 (recalled; the contract restates the
        inequality and the exact-determinant audit K3a checks the arithmetic)
      provenance: recalled
      verified_by: null
      role: determinant criterion
    - description: >-
        Jochemsz-May extended strategy: shift sets built from leading
        monomials and Minkowski powers of the Newton polytope.
      citation: Jochemsz and May, Asiacrypt 2006; Takayasu and Kunihiro (recalled)
      provenance: recalled
      verified_by: null
      role: shift-set construction
    - description: >-
        Committed reach instrument, demand rows (I)-(III), S_3 support of 13 of
        27 monomials and the measured reaches 0.840814 and 0.413684 under
        convention TOOL.
      citation: tools/smallroot_reach.py; analysis/smallroot-reach/CLOSURE.md; IDEA-20260903-81a943
      provenance: internal
      verified_by: coordinator, this session (tools/smallroot_reach.py read in full)
      role: baseline and audit target
    - description: >-
        Generic-group preprocessing bound S T^2 = Omega~(eps N).
      citation: KN-LIT-013
      provenance: kb
      verified_by: relayed corpus abstract; paper body not read
      role: comparison line
    - description: >-
        Kuhn-Struik batch reuse, about sqrt(2 L N) group operations for L
        logarithms.
      citation: IDEA-20260906-ee3543 (retrieved citation held in that record)
      provenance: internal
      verified_by: >-
        top-level session at archive time read ledger/proposals/IDEA-20260906-ee3543.yaml
        (the sqrt(2 U N) total is stated there as a retrieved figure); the primary
        Kuhn-Struik text was not read by any agent for this record
      role: precomputation cost of the factor-base logarithm table

  reduction_chain:
    core_problem: >-
      Small-root solvability of the coupled summation system, decided as an
      exact integer inequality over a triangular shift lattice.
    corollaries: []

  predictions:
    - metric: >-
        e_HG, the exponent of p in S T^2 for the (m = 3, w = 1) algorithm,
        minimised over t in 1..8 and the two frozen monomial orders (finite t)
        and over the frozen Richardson extrapolation, under convention HG,
        exponent codomain with the generic-group line at e = 1
      direction: lower
      minimum_effect: >-
        e_HG <= 0.98 in convention HG. THIS IS THE GENERATOR'S CLAIM.
        Coordinator prior of meeting it: at most 0.03; generator prior of the
        analogous statement under convention TOOL: 0.1.
    - metric: >-
        Full-box reach epsilon in convention HG at (n = 2, d = 2) as t goes to
        infinity, normalised as product of window sizes <= p^epsilon for one
        modular equation
      direction: different
      minimum_effect: >-
        epsilon_HG = 1/3 within 2e-3, against epsilon_TOOL = 2/3 for the same
        lattice in convention TOOL. Closed forms 2/(d(n+1)) and 2n/(d(n+1)).
    - metric: >-
        Convention TOOL reach at (n = 2, d = 1) as t goes to infinity, same
        normalisation as above, against the information bound epsilon <= 1
      direction: higher
      minimum_effect: >-
        epsilon_TOOL = 4/3 within 2e-3, exceeding 1; convention HG reads 2/3
        for the same lattice. TOOL exceeds 1 on exactly the tested pairs with
        d = 1 and n >= 2 and on no other tested pair.
    - metric: >-
        Support of the root block f2(y, x3) = S_3(y, x3, x_R) for generic
        (a, b, x_R), number of monomials of the box [0, 2]^2 with nonzero
        coefficient
      direction: different
      minimum_effect: >-
        exactly 9 of 9 (the tool-credited trivariate 13-monomial support does
        not apply to a root block with x_R known)
    - metric: >-
        eps_req_pre at (m, w) in {(2,0), (3,0), (3,1), (4,1), (4,2), (5,3)},
        per-equation supply needed for e < 1 in the preprocessing model
      direction: different
      minimum_effect: >-
        exactly 2/3, 3/5, 4/5, 11/14, 6/7, 8/9 respectively, by exact
        rational linear programming (independent of the closed form)
    - metric: >-
        Single-S_3 reach epsilon in convention HG, trivariate 13-monomial
        polytope, t to infinity, normalisation as above
      direction: lower
      minimum_effect: >-
        epsilon_HG below the convention-TOOL value 0.840814 by a factor between
        2 and 3.5; Coordinator prior band [0.25, 0.40] (a prior, not a gate)

  test_boundary:
    instances:
      - >-
        Symbolic and exact-integer polynomial systems only: f1 = S_3(x1, x2, y)
        and f2 = S_3(y, x3, x_R) over Z and Z_{2^61 - 1} with two frozen
        coefficient draws. No curve group is generated and no discrete
        logarithm is computed.
    parameters:
      window_exponents: symmetric beta on x1, x2, x3 and gamma on y, gamma in [0, 1]
      multiplicity: t in 1..8 (1..6 mandatory)
      monomial_orders: two frozen graded lexicographic orders O1 and O2
      demand_cells: (m, w) in {(2,0), (3,0), (3,1), (4,1), (4,2), (5,3)}
    implementation: >-
      Frozen exact-rational JS(t) builder with an independent checker, to be
      written by the executor task TASK-20260929-9c9f99 against the frozen
      specification experiments/EXP-ECDLP-64fa3d/specification.yaml.
    budget:
      maximum_memory_gb: 8
      maximum_runs: 8
      maximum_workers: 1
      estimates_advisory: true

  falsification_conditions:
    - >-
      Verdict DEAD_IN_FAMILY under convention HG (every frozen (order, t) cell
      and both extrapolated values with e >= 1.02 and consistent
      extrapolation): the claim under test is falsified WITHIN the frozen JS(t)
      family, t <= 8, symmetric windows, and closes nothing beyond it.
    - >-
      Verdict VOID_CALIBRATION: an instrument or convention gate failed. This
      is an infrastructure-class outcome, never mathematical evidence for or
      against the claim, and a superseding protocol is owed.
    - >-
      The convention audit is FALSIFIED (and then the design must be
      superseded, not repaired) if the exact-integer determinant control K3a
      shows that the TOOL comparison exponent equals the Howgrave-Graham slack
      for some instance with n >= 2, or if the information-bound control K2
      shows convention HG exceeding 1 on any tested full box.

  interpretation_limits:
    - >-
      Proposal-level record; the contract is frozen but no run exists. Every
      exponent in this record is a model number under the stated convention.
    - >-
      An ALIVE verdict is heuristic (HEUR-1, HEUR-2), toy-tier evidence at most,
      and a claim below the generic line is breakthrough-class under AGENTS.md
      rule 12: it needs review-breakthrough at max effort before any status
      change and is paired with a heuristic-validation experiment in the
      following batch.
    - >-
      A DEAD verdict closes ONLY the frozen JS(t) family with symmetric windows
      under exact-arithmetic lattice conditions; asymmetric leaf windows, rank-2
      GAP windows, non-tree systems, non-triangular or superpolynomial-dimension
      lattices stay open.
    - >-
      If convention TOOL is shown wrong, the committed reach numbers 0.840814 and
      0.413684 and the closure margin -0.0481 of IDEA-20260903-81a943 are
      superseded by additive correction records, never edited; the direction of
      the error (TOOL over-credits the attack) means the closure conclusion is
      not weakened, but that is a finding to be recorded by a later decision, not
      asserted here.
    - >-
      Nothing here concerns extension fields, and nothing here is a hardness
      result for ECDLP or a statement about any deployed curve.
