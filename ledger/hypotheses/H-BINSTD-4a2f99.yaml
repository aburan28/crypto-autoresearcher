  heuristic_assumptions:
    - id: HEUR-BINSTD-4a2f99-H0
      formal_statement: >-
        NONE FOR Stage-0 arithmetic. ord_n(2), f, ord_17(4), and the
        corrected ratio table are unconditional finite computations.
      random_model_justification: >-
        Exhaustive modular orders; divisor-lattice correspondence for
        Frobenius-stable subspaces (IDEA-20260918-9abf42, cited).
      supporting_results:
        - IDEA-20260918-9abf42 closed-form f=1+(n-1)/ord_n(q) (internal)
        - HOLD-N independent recomputation of ord_31(2)=5 (internal review)
      validation_experiment_ids:
        - EXP-BINSTD-cf4bf7
      falsification_condition: >-
        Any recomputed ord_n(2)/f or ratio disagrees with the frozen table;
        OR a mid-dimension stable V exhibited on n=37.
    - id: HEUR-BINSTD-4a2f99-H1
      formal_statement: >-
        BASIS-BLIND PRIOR (optional Stage 2 only). On the primary composite
        cell, WDSat conflict ratio on the richest stable V sits near 1
        (within 1% of 1.0 = basis-blind per b9f0c5), matching the d=1 prior.
        Material pruning is ratio <=0.5 on every certified-UNSAT replicate
        AND within-curve non-stable control near 1.
      random_model_justification: >-
        Imported from IDEA-20260920-b9f0c5 / H-FROB-a5bf86 prior; not
        re-justified here. Applies only if Stage 2 runs.
      supporting_results:
        - IDEA-20260920-b9f0c5 thresholds (internal; cited via review)
        - H-FROB-a5bf86 (internal; d=1 design carrier)
      validation_experiment_ids:
        - EXP-BINSTD-cf4bf7
      falsification_condition: >-
        Stage 2 ratio <=0.5 while within-curve non-stable also <=0.5
        (stability attribution fails); OR stable and non-stable disagree
        by <10% while both near 1 after claiming a stability effect.
    - id: HEUR-BINSTD-4a2f99-H2
      formal_statement: >-
        NEAREST-NEIGHBOUR PAIRING (design choice). Absolute field-degree
        distance selects the c2tnb neighbour; not claimed unique or optimal.
      random_model_justification: >-
        Matches RQ-FROB-7d8dd4 matched-size principle as a default; no
        uniqueness proof.
      supporting_results:
        - RQ-BINSTD-b6f698 scope clause (internal)
      validation_experiment_ids:
        - EXP-BINSTD-cf4bf7
      falsification_condition: >-
        Not a mathematical falsifier; a reviewer may re-pair under another
        metric and file a superseding ladder without refuting H0/H1.

