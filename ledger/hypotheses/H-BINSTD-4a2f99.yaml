  title: >-
    HOLD-N: triangulated c2pnb/c2tnb field-size ladder with PRIMITIVE-PRIME
    null arms (ord_n(2)=n-1); primary cell (d,k)=(2,17) vs n=37; n=31
    disqualified as null (f=7); optional WDSat conflict-ratio — no exponent

  statement: >-
    SETTING. RQ-BINSTD-b6f698 mandates a null object for composite-degree
    c2pnb rows against nearby prime-degree c2tnb curves, but deployed field
    sizes do not match (gaps up to 87 bits). IDEA-20260922-9e5383 proposed a
    toy ladder preserving each deployed c2pnb-to-nearest-c2tnb field-size
    RATIO at dk<=41, plus a WDSat conflict-ratio differential on a
    Frobenius-stable subspace of the composite arm. HOLD-N (2026-09-26)
    found the load-bearing null claim defective as stated.

    HOLD-N CORRECTED PART (A) — NULL PRECONDITION IS ord_n(2)=n-1.
    "Prime degree ⇒ no nontrivial Frobenius-stable F_2-subspace" is FALSE.
    Stable F_2-subspaces of F_{2^n} correspond to factors of x^n-1 over F_2
    and number 2^f with f = 1+(n-1)/ord_n(2). They are trivial
    (dims {0,1,n-1,n} only, f=2) IFF ord_n(2)=n-1 (primitive prime).
    Independent recomputation (design session): ord_31(2)=5 ⇒ f=7
    (128 stable subspaces including mid-dimension); ord_37(2)=36=n-1 ⇒ f=2;
    ord_29(2)=28=n-1 ⇒ f=2; ord_41(2)=20 ⇒ f=3 (not poor); ord_53(2)=52=n-1
    ⇒ f=2. Source IDEA null arms using n=31 (pairs 1,2,4) are REJECTED.
    Corrected null arms MUST be primitive primes. Source "prime-degree"
    wording is retained only as the named falsifiable alternative Stage 0
    is designed to refute via the n=31 contrast certificate.

    HOLD-N CORRECTED PART (B) — TRIANGULATED LADDER WITH RESTATED ERRORS.
    Composite arms keep k prime and d | 16 (toy analogue of m=16k). Null
    arms are primitive primes. Frozen corrected table (ratio = dk/n;
    error in percentage points vs deployed target):
      pair 1: c2pnb176v1/c2tnb191v1 target 0.921; (d,k)=(4,7) dk=28 vs
        n=29; ratio 0.966; err +4.5pp (was n=31, invalid).
      pair 2 PRIMARY: c2pnb208w1/c2tnb191v1 target 1.089; (d,k)=(2,17)
        dk=34 vs n=37; ratio 0.919; err −17.0pp (was n=31 at +0.8pp —
        ratio match worsened by the validity correction; disclosed).
      pair 3: c2pnb272w1/c2tnb239v1 target 1.138; (d,k)=(2,19) dk=38 vs
        n=37; ratio 1.027; err −11.1pp (unchanged null; already primitive).
      pair 4: c2pnb304w1/c2tnb359v1 target 0.847; (d,k)=(4,7) dk=28 vs
        n=29; ratio 0.966; err +11.9pp (was n=31, invalid).
      pair 5: c2pnb368w1/c2tnb359v1 target 1.025; (d,k)=(2,19) dk=38 vs
        n=37; ratio 1.027; err +0.2pp (best ratio match; unchanged).
    Primary measurement cell remains pair 2 for lattice richness
    (ord_17(4)=4, f=5, 32 stable subspaces, dims
    {0,1,4,5,8,9,12,13,16,17}), not for best ratio (pair 5).

    HOLD-N CORRECTED PART (C) — DIFFERENTIAL AND CONTROLS.
    On the composite arm, measure WDSat conflict ratio on a richest
    Frobenius-stable F_4-subspace against orbit-naive null 2^{ml}/m!
    (IDEA-20260920-b9f0c5 instrument, cited; H-FROB-a5bf86 is the filed
    d=1 design). On the null arm, confirm STRUCTURAL ABSENCE of mid-
    dimension stable subspaces by factoring x^n-1 over F_2 (must give
    f=2). Within-curve size-matched NON-stable F_4-subspace control
    (from IDEA-20260922-6cf862 Part 2) separates stability from incidental
    curve arithmetic. CONTRAST CONTROL (not a null arm): n=31
    (non-primitive prime, f=7) at similar field size — varies lattice
    richness while holding primeness fixed (review successor_seam).
    Poor-n control n=41 is REJECTED (f=3, moderately rich).

    HOLD-N CORRECTED PART (D) — INSTRUMENT GATE. WDSat is NOT installed
    in this repository (same as HOLD-I/HOLD-T siblings). Stages 0, 1, 4
    are the authorized required success path (arithmetic + curve
    construction + structural null/contrast certificates). Stages 2–3
    (WDSat conflict ratio + within-curve non-stable control under that
    instrument) are OPTIONAL and write instrument_unavailable when
    no CNF-XOR/WDSat engine is present — infrastructure (AGENTS.md
    rule 3), never negative math evidence.

    CLAIM TIER: toy / instrument. NO exponent move. NO break. NO rho
    competitiveness. NO deployed-curve attack.

  statement_note: >-
    IDEA-20260922-9e5383 claim text is immutable and left at status
    proposed. Review verdict sound_with_corrections (HOLD-N /
    design_after). Defects absorbed into this hypothesis and
    EXP-BINSTD-cf4bf7: primitive-prime null precondition; n=31
    disqualified; n=41 poor-control rejected; ratio errors restated;
    WDSat gated. Source "every prime has no stable subspace" is the
    named falsifiable alternative, not the frozen claim.

  mechanism: >-
    OBJECT FRAME. Representation: x-coordinates in a Frobenius-stable
    F_{2^d}-subspace of F_{2^{dk}} on the composite arm (IDEA-20260922-
    6cf862 / IDEA-20260918-9abf42 correspondence with q=2^d), cited not
    re-derived. Operation set Sigma: factor-base translation + <phi>
    (partial-action Class I). WHAT THIS PACKET ADDS is the HOLD-N-
    corrected parameter selection that ties the toy ladder to the five
    deployed c2pnb/c2tnb field-size ratios with a VALID "precondition
    absent" null (ord_n(2)=n-1), plus an explicit n=31 contrast that
    the source IDEA wrongly treated as a null. Lossy-projection and
    WDSat conflict-ratio instrument are reused from 6cf862 / b9f0c5
    without re-derivation. Declared components: F2 (factor-base
    decomposition / relation-search stage).

  assumptions:
    - >-
      Null-arm validity requires ord_n(2)=n-1; prime degree alone is
      insufficient (HOLD-N).
    - >-
      Composite (d,k) keeps k prime and d dividing a power of 2; ratio
      matching errors after the n=31→primitive re-selection are accepted
      and disclosed (pair 2 primary worsens to −17pp).
    - >-
      Nearest-c2tnb pairing uses absolute field-degree distance (source
      design choice H-9e5383-1); not re-optimized here.
    - >-
      WDSat / CNF-XOR may be absent; Stages 0/1/4 do not require it.
    - >-
      Arithmetic only at toy dk<=41 / n<=53; no attack at m>=131.
    - >-
      d=1 cross-check cites H-FROB-a5bf86 / IDEA-20260920-b9f0c5; if that
      result is not yet archived, Stage 2 optional arm records the gap
      without inventing a d=1 number.

  proof_search_map:
    bottleneck: >-
      Whether a Frobenius-stable subspace at the HOLD-N-corrected primary
      cell produces a WDSat conflict-ratio effect that the within-curve
      non-stable control does NOT show, while a primitive-prime null
      certifies the stability precondition is absent — and whether the
      source "prime⇒no subspace" claim survives the n=31 contrast.
    baseline_embedding:
      parameter_slice: >-
        Setting d=1 recovers IDEA-20260918-9abf42 / IDEA-20260920-b9f0c5
        F_2-base ladder; this packet's novelty is d>1 plus deployed-
        triangulated primitive-prime null selection.
      reproduction_check: >-
        (i) ord_17(4)=4 by exhaustive 4^k mod 17; f=5; 32 subspaces;
        dims {0,1,4,5,8,9,12,13,16,17}. (ii) Independent factorisation
        of T^17-1 over F_4 must agree. (iii) ord_31(2)=5, f=7;
        ord_37(2)=36, f=2; ord_29(2)=28, f=2; ord_41(2)=20, f=3.
    observation_collision:
      observable: >-
        WDSat conflict ratio on composite stable V; structural f on null
        and contrast arms; within-curve non-stable ratio.
      distinct_preimage_search: >-
        Composite ratio <1 could be genuine stability pruning or an
        incidental property of the toy curve. Distinguisher: within-curve
        non-stable control (same curve, matched dimension). If that also
        drops, do not credit stability. Separately, an implementation that
        reports a mid-dim stable V on n=37 has a bug (f must be 2).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Five-pair corrected ladder with disclosed ratio errors and a
          reusable primitive-prime vs non-primitive contrast template.
        predicted_gain: >-
          Converts an invalid null protocol into a valid instrument; no
          attack-cost gain claimed.
    quantifier_order: >-
      FOR EACH of the five deployed pairs THERE EXISTS a disclosed toy
      (d,k)/n analogue with stated ratio error (design). SEPARATELY,
      ord_n(2) and f are EXACT for the frozen n set. SEPARATELY, any
      Stage-2 ratio claim is scoped to the primary cell and instrument.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy ladder exists that triangulates the five deployed ratios
        with disclosed errors after restricting null arms to primitive
        primes; at the primary cell the composite arm has a 32-element
        F_4-stable lattice and the n=37 null arm has f=2; n=31 has f=7
        and is not a valid null. Certifies NOTHING about whether WDSat
        conflicts actually differ (optional Stage 2), nothing about
        transfer to deployed field sizes beyond disclosed ratio errors,
        and nothing about exponents or rho.
      nearby_object_control: >-
        (i) Within-curve non-stable subspace on the composite arm.
        (ii) Non-primitive contrast n=31 (f=7) at similar size.
        (iii) d=1 cross-check via H-FROB-a5bf86 / b9f0c5 when available.
    proof_obligations:
      - claim: ord_17(4)=4, f=5, 32 subspaces, stated dimension set
        responsibility: correctness
      - claim: ord_31(2)=5 ⇒ f=7; ord_37(2)=36 ⇒ f=2; ord_29(2)=28 ⇒ f=2
        responsibility: correctness
      - claim: Corrected ladder ratios and percentage-point errors as frozen
        responsibility: baseline
      - claim: Null arms with ord_n(2)<n-1 are invalid for this protocol
        responsibility: scope
      - claim: No exponent / rho / break claim
        responsibility: scope
    not_applicable_reason: null

