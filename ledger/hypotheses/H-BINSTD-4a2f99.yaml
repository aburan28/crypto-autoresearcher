# from IDEA-20260922-9e5383 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001,
# absorbing 2026-09-26 HOLD-N review defects
# (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-9e5383.yaml;
# verdict sound_with_corrections): null precondition is ord_n(2)=n-1
# (primitive prime), not "prime degree"; n=31 disqualified (f=7); n=41
# not a poor lattice; WDSat gated.
#
# ZERO RUNS in this design packet. IDEA-20260922-9e5383 claim text is not
# edited (proposals immutable); this hypothesis cites it and freezes the
# HOLD-N-absorbed restatement for experimental purposes.
# =============================================================================
hypothesis:
  id: H-BINSTD-4a2f99
  question_id: RQ-BINSTD-b6f698
  related_question_ids: []
  source_idea: IDEA-20260922-9e5383
  experiment_id: EXP-BINSTD-cf4bf7
