hypothesis:
  id: H-CSIDH-5fc69f
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  derived_from_idea: IDEA-20260809-666d3d
  added: '2026-08-25'
  statement: >-
    The per-query cost that every quantum cost estimate for CSIDH multiplies its
    oracle-query count by - the cost of evaluating the class group action
    REVERSIBLY - can be constructed and counted inside this program as a
    classical reversible-circuit problem, and the resulting count is VALID in
    the only two senses that matter to a downstream estimate: (i) the circuit
    computes the same group action as a direct classical implementation on every
    tested input, and (ii) all ancilla are returned clean by explicit
    uncomputation inside the counted circuit. Under those two gates, the
    measured gate count at three small parameter sizes agrees with the count
    the construction's own structure predicts, so that the number this program
    owns is an independently derived per-query cost rather than an adopted
    figure from either side of the published dispute.
  mechanism: >-
    A quantum attack on CSIDH is an oracle algorithm whose total cost is
    (queries) x (cost per query). The query count is exactly what the published
    models dispute; the per-query cost is the factor they all share and none
    disputes in kind. Implementing the isogeny evaluation as a reversible
    circuit - parameterized by the prime set and the exponent bounds, with
    explicit uncomputation of every intermediate - makes that shared factor a
    countable object rather than a cited one. Counting proceeds by traversal of
    the constructed circuit under a declared gate set, so the count is a
    property of an artifact this program holds, not of a formula. Correctness
    and reversibility are then established by SIMULATION against a direct
    classical implementation of the action: agreement on random inputs certifies
    that the circuit computes the action, and ancilla returning to the zero
    state certifies that the count is not understated by leaving garbage behind.
    Dirty ancilla is the classic failure mode here precisely because it makes a
    circuit cheaper and wrong at the same time, so it is gated rather than
    assumed. Owning the validated number lets this program later compare
    disputing query-count models WITHOUT adopting either side's per-query
    figure - which is the entire point, and is a neutrality property, not a
    security verdict.
  assumptions:
    - >-
      [RECALLED, NOT RETRIEVED] The CSIDH specification and the published
      concrete quantum-circuit costings for the class group action. The parent
      proposal's own novelty screen states "WEB NOT CHECKED" and labels these
      REQUIRED READS. This hypothesis therefore claims NO agreement or
      disagreement with any published count; a comparison against published
      figures is a separate task requiring those sources to be retrieved first.
    - >-
      The direct classical implementation used as ground truth is itself
      validated against known small-parameter results BEFORE it is trusted. A
      circuit validated against an unvalidated oracle certifies nothing.
    - >-
      A gate count under a declared gate set and memory model is not portable
      across gate sets. Any later use of this number must carry the gate set,
      the ancilla model, and the arithmetic word size with it.
    - >-
      Small parameter sizes do not exhibit the asymptotic structure of deployed
      CSIDH parameter sets. The measured counts are measured; any statement
      about CSIDH-512 or larger is MODELED and is labeled as such wherever it
      appears.
  proof_search_map:
    not_applicable_reason: >-
      This is a construction-and-measurement record, not a proof-oriented one.
      No theorem, asymptotic bound, certificate hierarchy, reduction or closure
      argument is claimed; the deliverable is a validated artifact and a table
      of counts. The one structural obligation - that the construction's implied
      scaling is reproduced by traversal - is discharged empirically by the
      measured-versus-modeled comparison, not by a proof, and the record says so
      rather than dressing it as one.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The CSIDH class group action and its evaluation via Velu-style isogeny
        computation over F_p with p = 4 * prod(l_i) - 1.
      citation: CSIDH specification
      provenance: recalled
      verified_by: null
      role: the function the circuit must implement
    - description: >-
        Published concrete reversible/quantum circuit costings for the CSIDH
        group action, against which this program's independent count would later
        be compared.
      citation: null
      provenance: recalled
      verified_by: null
      role: >-
        external baseline, NOT used in this hypothesis; named so that the
        absence of a comparison is visible rather than silent
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        simulation_agreement_fraction - fraction of random inputs on which the
        reversible circuit's output equals the direct implementation's output
      direction: higher
      minimum_effect: >-
        Exactly 1.0 at every parameter size, with zero tolerance. Anything less
        invalidates the count entirely.
    - metric: >-
        ancilla_clean_fraction - fraction of simulated executions in which every
        ancilla register is returned to the zero state
      direction: higher
      minimum_effect: >-
        Exactly 1.0. Any dirty ancilla means the count is not a valid input to
        any fault-tolerant estimate, and the record must say so rather than
        report the number.
    - metric: >-
        measured-versus-modeled gate count ratio, per parameter size, under the
        declared gate set
      direction: different
      minimum_effect: >-
        Within a factor of 1.25 of the count the construction's structure
        implies. A larger discrepancy indicates a bug in traversal or in
        uncomputation and is a defect finding, not a cost finding.
    - metric: >-
        peak ancilla width in qubits, measured, versus the analytic size of the
        dominant register
      direction: different
      minimum_effect: >-
        Within a factor of 1.25 of the analytic size. Memory is a first-class
        cost here, not a footnote.
  test_boundary:
    instances:
      - three small CSIDH-shaped parameter sets, toy scale, named in the contract
      - a direct classical implementation of the same action, as ground truth
    parameters:
      parameter_sizes: 3
      random_inputs_per_size: 500
      gate_set: declared in the contract and reported with every count
      memory_model: declared in the contract and reported with every count
    implementation: >-
      A reversible circuit for isogeny evaluation with explicit uncomputation,
      parameterized by the prime set and the exponent bounds; gate counting by
      circuit traversal; a separate direct classical implementation of the
      action used only as ground truth and validated first.
    budget:
      estimated_wall_clock_seconds: 7200
      note: >-
        The parent proposal declares implementation cost medium-to-high and
        compute cost LOW: the expense is writing a correct reversible circuit,
        not running it. Simulation of 500 inputs at three toy sizes is minutes.
  distinguishable_outcomes:
    - outcome: >-
        simulation_agreement_fraction = 1.0 and ancilla_clean_fraction = 1.0 at
        all three sizes, and measured counts within a factor of 1.25 of the
        construction's implied counts.
      means: >-
        This program owns an independently constructed and validated per-query
        cost for the CSIDH group action at toy scale, under a named gate set and
        memory model. It can then compare disputing query-count models without
        adopting either side's per-query figure. NO security verdict follows.
    - outcome: >-
        simulation_agreement_fraction < 1.0 at any size.
      means: >-
        The circuit does not compute the group action. The count is void and the
        deliverable is a defect report; no number may be published, and the
        failure is a bug in this program's construction, not evidence about
        CSIDH.
    - outcome: >-
        Ancilla cannot be uncomputed within the constructed circuit
        (ancilla_clean_fraction < 1.0).
      means: >-
        The count is NOT a valid input to any fault-tolerant estimate, because a
        circuit leaving garbage is both cheaper and wrong. The record must say
        exactly this and report the obstruction, rather than publish an
        understated cost.
    - outcome: >-
        Both gates pass but the measured count departs from the construction's
        implied scaling by more than a factor of 1.25 across sizes.
      means: >-
        A traversal or uncomputation bug, OR an unmodeled cost the construction
        hides. The pre-committed diagnostic order is traversal first,
        uncomputation second, model third; only after all three are excluded may
        the discrepancy be reported as a real unmodeled cost.
    - outcome: >-
        The direct classical implementation fails its own validation against
        known small-parameter results.
      means: >-
        There is no ground truth, so nothing about the circuit is certifiable.
        Measurement stops; this is an instrument failure and no count is
        recorded.
  prior_evidence_refs:
    - RQ-CSIDH-64343f
    - GOAL-CSIDH-001
    - IDEA-20260809-666d3d
  falsification_conditions:
    - Simulation disagreement at any parameter size.
    - >-
      Ancilla cannot be uncomputed within the constructed circuit, in which case
      the count is not a valid input to any fault-tolerant estimate and the
      record says so.
    - >-
      Measured-versus-modeled gate count ratio outside a factor of 1.25 at any
      size after traversal and uncomputation bugs are excluded.
    - >-
      The direct classical implementation fails validation against known
      small-parameter results, so no ground truth exists.
  interpretation_limits:
    - >-
      A GATE COUNT IS NOT A SECURITY LEVEL. It is one factor in models this
      program does not adjudicate, and no verdict on CSIDH follows from it in
      either direction.
    - >-
      Measured at three small parameter sizes only. Any number quoted at
      CSIDH-512 or any deployed parameter set is MODELED, must be labeled
      modeled in the same table cell, and carries the model's formula and its
      source.
    - >-
      The count is bound to its declared gate set, ancilla model and arithmetic
      word size and is not portable without them.
    - >-
      NO comparison against published costings is made or implied. The parent
      proposal's screen records WEB NOT CHECKED; the published figures are
      RECALLED and unretrieved, and agreement or disagreement with them is a
      separate task.
    - >-
      Externally dominated by published concrete-cost work, stated plainly. The
      delta this record offers is independence and validation, not a lower
      number.
  status: proposed
  proposed_by: idea-generator
