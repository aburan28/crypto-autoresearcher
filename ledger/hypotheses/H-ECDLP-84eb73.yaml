  title: >
    Embedding-order Stage 0 identity —
    ord_N(p) and the forced cyclotomic
    factor-degree multiset; k=1 nearby
    pair is rejected as generic
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260908-3444f5
  specified_by: DEC-20260908-c83366
