  statement: >
    Fix the embedding-degree integer
    k = ord_N(p) and the forced
    cyclotomic factor-degree multiset
    {1} union {k}^((N-1)/k) before any
    Riemann-Roch space, Miller function,
    Tate pairing, theta group, or
    matrix M_D is built. Stage 0
    asserts only that on the frozen
    REAL pair (N,p)=(7,11) one has
    gcd(7,10)=1, k=3, and degrees
    [1, 3, 3], and that the nearby
    KF pair (7,29) has k=1 (N divides
    p-1) and is rejected as a generic
    large-k target. NULL empty pair
    rejected. N=0 rejected. This is
    not a pairing transfer, not MOV,
    not Frey-Ruck, not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260906-aa6da3 Stage 0 hard
    gate is the forced factorisation
    pattern and its nearby-object
    counterpart, derived from (N,p)
    alone. Stage 0 freezes that
    identity as exact tables. No
    Miller function. No Tate pairing.
    No L(N.O). No M_D. This is a new
    GOAL-ECDLP-001 object after Stage 0
    of EXP-ECDLP-2a466a held as
    P-S0-TWISTCOS (DEC-20260908-3e3bce).
    It is not Stage 1 of EXP-ECDLP-2a466a
    and not Stage 1 of this experiment.
  predictions:
    - id: P-S0-EMBORD
      metric: well-defined embedding-order / factor-degree table on frozen (N,p) toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL k equals
        3, gcd equals 1, and degrees
        equal [1, 3, 3]. KF k=1 is
        rejected. NULL empty pair is
        rejected. N=0 is rejected. One
        certified miss after fixture_pass
        is a scoped falsification of this
        instrument at the frozen toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF k=1 is
        accepted as a generic large-k
        target. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALORD
      statement: >
        After fixture_pass, REAL fails
        to match k=3, gcd=1, or degrees
        [1, 3, 3]. That falsifies only
        P-S0-EMBORD at the frozen toy.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      real_pair:
        N: 7
        p: 11
        must_gcd: 1
        must_k: 3
        must_degrees: [1, 3, 3]
      known_false:
        N: 7
        p: 29
        must_k: 1
        must_N_divides_p_minus_1: true
        must_reject: true
      matched_null: {kind: empty_pair, must_reject: true}
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-71c37d Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is exact
      multiplicative-order arithmetic
      of p modulo N on one frozen
      generic pair and one k=1 nearby
      pair. It is not Miller, not Tate,
      not a level-N model, not Stage 1
      of EXP-ECDLP-71c37d, and not
      Stage 1 of EXP-ECDLP-2a466a.
      No cryptographic transfer. No
      rho beat.
  assumptions:
    - id: A1
      statement: >
        REAL is (N,p)=(7,11). KF is
        (7,29) with k=1. Stage 0 does
        not construct g_D, V, or M_D.
      status: explicit
    - id: A2
      statement: >
        IDEA-20260906-aa6da3 is the
        R2 / F4 identification claim.
        Stage 0 tests only the
        embedding-order calibrator, not
        the proposal's pairing transfer
        or N^2 cost of V.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether a declared pair (N,p) has
      k = ord_N(p) and the forced
      degree multiset {1} union
      {k}^((N-1)/k), and whether a
      k=1 nearby pair is rejected as
      generic.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: embedding-
        order calibrator only, not the
        proposal's Miller / theta
        linearisation.
      reproduction_check: >
        REAL k equals 3. gcd equals 1.
        Degrees equal [1, 3, 3]. KF
        k=1 rejected. NULL empty pair
        rejected. N=0 rejected.
    observation_collision:
      observable: embedding order versus k=1 nearby order
      distinct_preimage_search: >
        Hold N=7 and replace p=11 by
        p=29 (KF). Hold the pair and
        replace it by empty (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact embedding-order / factor-degree table.
        predicted_gain: >
          Exact known-false k=1 reject
          on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze N and p before reading the
      table. Existential equality at one
      toy does not imply a pairing
      transfer and does not imply a
      rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen toys. Never a
        pairing bound. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is the empty pair. An
        argument that still assigns it
        a true order table is
        proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-EMBORD only. Not
    Miller. Not Tate. Not MOV. Not
