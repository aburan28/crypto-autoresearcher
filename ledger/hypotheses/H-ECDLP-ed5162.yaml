hypothesis:
  id: H-ECDLP-ed5162
  question_id: RQ-ECDLP-002
  statement: >-
    SETTING. Let E/F_p be a prime-field elliptic curve with a prime-order
    subgroup G = <P> of order N, Q = [k]P. Suppose there exists a public
    ordinary isogeny phi: E -> E'' of degree ell, with deg(phi) coprime to N,
    landing in a NAMED special curve family: E1 anomalous (N = p, Smart-Araki-
    Satoh-Semaev polynomial-time DLP), E2 low-embedding-degree (MOV/Frey-Ruck
    pairing reduction), or E3 subfield/Weil-descent-susceptible (GHS). Because
    deg(phi) is coprime to N, phi is injective on G and the discrete log
    transfers as log_E(Q) = log_{E''}(phi(Q)) times the inverse of deg(phi) mod
    N, so any special-curve algorithm on E'' pulls back to a discrete log on E.
    THE CHARGED COST GATE. Define the total charged attack cost as
    C_total(ell) = C_path(ell) + C_special(E'', N), where C_path(ell) is the
    group-operation-equivalent cost of finding AND evaluating the degree-ell
    isogeny path from E to a special E'', and C_special is the cost of the
    named special-curve algorithm on E''. THE CLAIM is that for a GENERIC
    random prime-field curve E with NO PLANTED PATH, the minimal such
    C_path(ell) over every ell up to the degree budget ell_max = N^{1/2}
    satisfies C_path(ell) >= 0.886 sqrt(N) WITH HIGH PROBABILITY under
    heuristic HEUR-ISO-1 (random ordinary-isogeny-graph distance to the sparse
    special set), so that C_total is never smaller than matched Pollard rho
    (0.886 sqrt(N) group operations) on generic curves at the tested scale,
    and isogeny transfer therefore CANNOT be credited as an ECDLP exponent
    improvement on generic curves. THE CLAIM IS FALSIFIED IN SCOPE if a
    constructive search over >=20 random (unplanted) toy curves at 20, 24, and
    28 bits finds, for >=2 of them, a total charged cost C_total < 0.7 times
    matched rho, together with a verified [k]P=Q discrete-log certificate on E
    pulled back through phi. This is a NEGATIVE / SAFETY-GATE hypothesis: no
    exponent improvement is asserted by the claim being true, and confirming
    it moves no ECDLP exponent. Its function is to stop any special-curve
    result from being silently credited as a generic-curve attack before the
    isogeny path-finding cost has been charged against it.
  mechanism: >-
    Special-curve ECDLP algorithms (Smart-Araki-Satoh-Semaev anomalous; MOV;
    Frey-Ruck; GHS Weil descent on weak extension fields) are each fast only
    on a SPARSE family of curves, identified by an exact predicate (trace of
    Frobenius equal to 1 for anomalous; embedding degree k below a stated
    bound for MOV/Frey-Ruck; subfield-descent admissibility for GHS). An
    ordinary isogeny of degree coprime to N is a group isomorphism on G, so
    walking the ordinary isogeny graph from a generic E toward any member of
    the union of these sparse families is a legitimate way to IMPORT a special
    algorithm's speed onto a generic curve, PROVIDED the walk itself is
    cheap. This hypothesis installs a cost gate that forces exactly that
    provision to be checked: before crediting a special-curve algorithm as a
    generic-curve attack, the minimal-degree ordinary-isogeny path from the
    generic curve to the special set must be found and its cost charged
    alongside the special algorithm's own cost. The bottleneck the gate
    measures is path-finding, not path-evaluation: evaluating a found
    degree-ell isogeny costs only poly(log p, log ell) field operations
    (standard Velu-style formulas), so the total cost is dominated by how far
    the generic curve sits from the sparse special set in the isogeny graph.
    That distance is modeled, under HEUR-ISO-1, using the ordinary-isogeny
    volcano/crater structure of Delfs-Galbraith (recalled) as a (small
    constant)-regular graph on which distances to a sparse subset behave like
    hitting times in a random regular graph of the same degree -- the same
    random-walk-on-the-class-group intuition that underlies Couveignes'
    hard-homogeneous-space construction (recalled). External structural
    ingredient, made explicit rather than assumed: ordinary isogeny volcano
    geometry supplies the graph MODEL that HEUR-ISO-1 relies on; it does not
    by itself supply the hitting-time law to the sparse special set, which is
    the part this hypothesis's validation experiment tests empirically at toy
    scale.
  assumptions:
    - >-
      deg(phi) is coprime to N for every isogeny step considered, so each
      step (and every finite composition of steps) is injective on G and the
      discrete-log transfer formula log_E(Q) = deg(phi)^{-1} mod N times
      log_{E''}(phi(Q)) is exact and requires no correction term.
    - >-
      Special-family detectors are EXACT, not heuristic: anomalous status is
      decided by computing #E(F_p) and comparing to p; embedding degree k is
      computed exactly as ord_N(p); subfield/Weil-descent susceptibility is
      decided by the GHS admissibility predicate for the tested extension
      degrees. A false negative in a detector would UNDERSTATE the special
      set's density and bias C_path upward (toward the safety conclusion),
      never the reverse, and this asymmetry is recorded as a confounder
      below rather than assumed away.
    - >-
      Constructive path search is TOY SIZES ONLY (20, 24, 28 bits). Nothing
      this hypothesis can establish, in either direction, is evidence about
      cryptographic-size curves; that transfer question is out of scope and
      is restated in interpretation_limits.
    - >-
      The isogeny degree budget ell_max = N^{1/2} matches the group-operation
      budget a matched Pollard rho would spend to solve the instance outright
      (0.886 sqrt(N)), so a path search that exhausts the budget without
      success is charged as having failed to beat rho, not as inconclusive.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      This is not a proof-oriented, exponent-targeting hypothesis under
      docs/target-result-profile.md / KN-TECH-080. It asserts NO complexity
      improvement on any problem -- sota_delta in the originating proposal
      states explicitly that no exponent improvement is claimed -- and its
      confirmation moves no ECDLP exponent. It is an empirical charged-cost
      gate plus a heuristic-validation measurement (HEUR-ISO-1's hitting-time
      prediction against toy-scale isogeny censuses), admissible under the
      same profile as a cost-model / screening record rather than as a
      target-class mechanism. The proof-architecture audit therefore does not
      apply; falsification is by constructive counterexample search
      (test_boundary below), not by proof-search failure.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-ISO-1
      formal_statement: >-
        For a random ordinary curve E/F_p sampled uniformly among prime-order
        curves at a given bit size, model the ell_0-isogeny graph restricted
        to its volcano crater as a d-regular graph on n vertices, with
        d = ell_0 + 1 fixed by the smallest usable step prime ell_0 and n on
        the order of the class number of the relevant order (heuristically
        Theta(sqrt(p)) by the Delfs-Galbraith volcano picture, recalled).
        Let S be the sparse subset of vertices satisfying any of the E1/E2/E3
        special-family predicates, of measured size s = |S|. HEUR-ISO-1
        asserts that the minimal number of graph steps r* from a uniformly
        random start vertex to S is distributed as the hitting time of a
        uniformly random d-regular graph to a uniformly random subset of size
        s, i.e. P(r* > r) is well approximated by (1 - s/n)^{B_r} where
        B_r = d(d-1)^{r-1} is the expected ball-of-radius-r size before
        self-intersection becomes material, so that the expected minimal
        TOTAL DEGREE ell* = ell_0^{r*} solves d(d-1)^{r*-1} ~ n/s. The charged
        path cost C_path(ell*) is then the group-operation-equivalent cost of
        the corresponding meet-in-the-middle search over that many candidate
        vertices, which under this model concentrates near ell*^{1/2} nodes on
        each side.
      random_model_justification: >-
        The volcano crater at a fixed small step prime ell_0 is genuinely
        (ell_0+1)-regular (recalled structural fact, Delfs-Galbraith), so the
        regular-graph model is not an approximation of the DEGREE structure,
        only of the DISTANCE-TO-A-SPARSE-SET behavior on it. Treating short
        isogeny walks as approximately equidistributing over the crater
        mirrors the mixing-time heuristic that hard-homogeneous-space
        constructions (Couveignes, recalled) already rely on for random
        self-maps of the class-group action; this hypothesis borrows the same
        random-walk intuition and applies it to hitting a SPECIAL subset
        rather than to sampling the whole crater uniformly.
      supporting_results:
        - >-
          RECALLED, NOT RETRIEVED: Delfs-Galbraith description of the ordinary
          isogeny volcano crater as an (ell_0+1)-regular graph on a set of
          size governed by the relevant class number. Cited as a pointer for
          the reviewer; no agent in this program has opened the source, so it
          backs no supporting_results discharge until a retrieving agent
          confirms it in a new record (provenance: recalled).
        - >-
          Classical random-regular-graph hitting-time / birthday-style
          occupancy approximation for the distance from a random vertex to a
          random sparse target set, used here as a MODEL rather than an
          authority (provenance: recalled; textbook combinatorics, no
          specific paper cited or needed).
      validation_experiment_ids:
        - EXP-ECDLP-bbb42f
      falsification_condition: >-
        The synthetic random-regular-graph null arm of EXP-ECDLP-bbb42f (a
        pure combinatorial Monte Carlo of the (ell_0+1)-regular
        hitting-time model, computed with NO elliptic-curve arithmetic at
        all) fails to reproduce its own closed-form hitting-time prediction
        within the pre-declared KS-distance tolerance -- which would indicate
        an error in the model's implementation, not in HEUR-ISO-1 itself --
        OR the toy-scale KS comparison between the observed min-ell
        distribution on real curves and the HEUR-ISO-1 prediction exceeds the
        pre-declared toy-scale tolerance at all three tested bit sizes with a
        trend that does not shrink as the special-set predicate is relaxed
        (i.e. as s grows), which would indicate the volcano-crater random
        model does not describe real special-set hitting times even
        qualitatively at these sizes.
  structural_ingredients:
    - description: >-
        Smart-Araki-Satoh-Semaev polynomial-time discrete-log algorithm for
        anomalous curves (trace of Frobenius equal to 1, i.e. N = p).
      citation: Smart-Araki-Satoh-Semaev anomalous-curve algorithm (recalled)
      provenance: recalled
      verified_by: null
      role: >-
        Defines the E1 special-family predicate and its (polynomial-time)
        cost C_special once a curve is known to be anomalous.
    - description: >-
        MOV / Frey-Ruck pairing-based reduction of ECDLP to a finite-field
        discrete log via the Weil or Tate pairing, cost governed by the
        embedding degree k = ord_N(p).
      citation: MOV reduction; Frey-Ruck reduction (recalled)
      provenance: recalled
      verified_by: null
      role: >-
        Defines the E2 special-family predicate (embedding degree below a
        stated bound) and its cost model C_special.
    - description: >-
        GHS Weil-descent attack, reducing ECDLP over a prime-field curve
        admitting a suitable extension-field structure to a hyperelliptic-
        curve DLP over a subfield.
      citation: GHS Weil descent (recalled)
      provenance: recalled
      verified_by: null
      role: >-
        Defines the E3 special-family predicate (subfield/Weil-descent
        admissibility) and its cost model C_special.
    - description: >-
        Ordinary isogeny volcano structure: the ell_0-isogeny graph on
        ordinary curves of a fixed discriminant organizes into levels with an
        (ell_0+1)-regular crater, used here as the graph MODEL underlying
        HEUR-ISO-1.
      citation: Delfs-Galbraith ordinary isogeny volcano structure (recalled)
      provenance: recalled
      verified_by: null
      role: >-
        Supplies the regular-graph degree and the crater-size scaling that
        HEUR-ISO-1's hitting-time formula is built on.
    - description: >-
        Hard-homogeneous-space construction via random walks on ordinary-
        curve class-group orbits, used here only for its mixing-time
        intuition, not for any cryptographic construction.
      citation: Couveignes hard homogeneous spaces (recalled)
      provenance: recalled
      verified_by: null
      role: >-
        Motivates treating short ordinary-isogeny walks as approximately
        equidistributing on the crater, which HEUR-ISO-1's random_model_
        justification relies on.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: min_charged_transfer_ratio
      direction: higher
      minimum_effect: >-
        min (C_path(ell) + C_special(E'', N)) / matched_rho_cost >= 1.0 on at
        least 90% of random (unplanted) toy curves sampled across the three
        tested bit sizes; this is the primary safety-gate prediction.
    - metric: fraction_of_curves_with_ratio_below_1
      direction: lower
      minimum_effect: >-
        At most 10% of unplanted curves show a charged ratio below 1 under
        the null reading; a fraction materially exceeding that, WITH
        verified certificates on >=2 curves and ratio < 0.7, is the
        discriminating falsification event defined below, not a graded
        failure of this prediction alone.
    - metric: observed_min_ell_distribution_ks_distance_to_heur_iso_1_prediction
      direction: lower
      minimum_effect: >-
        The KS distance between the observed distribution of per-curve
        minimal charged-degree ell and HEUR-ISO-1's random-regular
        hitting-time prediction does not exceed the pre-declared toy-scale
        tolerance at any of the three tested bit sizes. This is the
        heuristic-validation prediction (secondary to the safety-gate claim)
        and is reported alongside it, never substituted for it.
  test_boundary:
    instances:
      - >-
        At least 20 independently sampled random prime-field curves with
        prime-order subgroups at EACH of 20, 24, and 28 bits (>=60 unplanted
        curve instances total), selected by a deterministic, reproducible
        rule stated in the experiment contract.
      - >-
        A planted-path positive control at each of the three bit sizes:
        start from a curve already satisfying an E1/E2/E3 predicate and walk
        a short random ordinary isogeny of bounded degree to a generic-
        looking E_rand; the harness must recover a cheap REVERSE path.
      - >-
        A synthetic null requiring no elliptic-curve arithmetic at all: a
        direct Monte Carlo simulation of the (ell_0+1)-regular
        hitting-time model HEUR-ISO-1 posits, used to validate the
        combinatorial prediction independently of any curve-specific effect.
    parameters:
      bit_sizes: '20, 24, 28'
      isogeny_degree_budget_ell_max: N^{1/2}, matching the matched-rho
        group-operation budget
      special_family_predicate_set: >-
        E1 anomalous (N = p); E2 low embedding degree (k below a stated
        bound, MOV/Frey-Ruck); E3 subfield/Weil-descent-susceptible (GHS
        admissibility predicate)
    implementation: >-
      Bounded ordinary isogeny BFS / meet-in-the-middle path search up to
      the degree budget, per-curve special-family predicate evaluation,
      matched Pollard rho and BSGS baselines, and an exit-map consistency
      check against IDEA-20260727-005's algebraic-self-map classifier -- all
      specified in EXP-ECDLP-bbb42f.
    budget: {}
  falsification_conditions:
    - >-
      At least 2 random (unplanted) curves, across the tested bit sizes,
      show a total charged transfer ratio C_total/matched_rho < 0.7 WITH a
      verified [k]P=Q discrete-log certificate on E pulled back through the
      isogeny path: the generic-curve safety claim FAILS inside the tested
      scope and independent review is mandatory before any further use of
      the claim.
    - >-
      The planted-path positive control is NOT recovered at any tested bit
      size (the harness fails to find a cheap reverse path from a known
      special curve to its planted generic-looking image): the harness is
      VOID and no reading, positive or negative, may be taken from it until
      the defect is fixed and the control re-run.
  interpretation_limits:
    - >-
      TOY GRAPH DIAMETER IS NOT CRYPTOGRAPHIC GRAPH DIAMETER. A negative
      (safety-confirming) result at 20-28 bits does not establish, and must
      never be presented as establishing, isogeny-transfer safety at
      cryptographic curve sizes; the volcano crater size and special-set
      density both scale with the field, and nothing in this design measures
      that scaling directly.
    - >-
      STRUCTURED PUBLIC CURVES (explicit CM discriminant, pairing-friendly
      construction, or any other curve chosen for algebraic structure rather
      than sampled generically) are OUT OF the generic-curve claim entirely
      and must be scored under a separate, explicitly structured analysis if
      ever attempted; nothing here bears on them.
    - >-
      ONLY ORDINARY ISOGENIES ARE IN SCOPE. Supersingular isogeny graphs,
      which have different mixing behavior and are the subject of a
      different research lane in this program, are not modeled by
      HEUR-ISO-1 and are not tested by EXP-ECDLB-bbb42f.
    - >-
      A CONFIRMED SAFETY GATE MOVES NO EXPONENT. Even full confirmation of
      this hypothesis at every tested cell is not, and must never be
      reported as, an exponent-improving or target-class result; it is a
      cost-accounting discipline that prevents a special-curve result from
      being silently miscredited as a generic-curve attack.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260731-008.yaml
    - ledger/questions/RQ-ECDLP-002.yaml
    - ledger/proposals/IDEA-20260727-005.yaml
    - experiments/EXP-ECDLP-bbb42f/specification.yaml
