  title: >-
    A transported drop of 2 against a random drop of 1 is a presentation effect.
  statement: >-
    The drop of an arm is the native integer minus that arm's integer.
    If the transported integer equals the native integer, the reading is
    no movement, including the triples (5, 5, 5) and (5, 5, 4). If the
    two drops are equal and nonzero, the reading is equal enrichment,
    which is the triple (5, 3, 3) with drops 2 and 2. If the transported
    drop is at least the random drop plus 1, the reading is presentation,
    which is the triple (5, 3, 4) with drops 2 and 1. If the random drop
    is strictly larger, the reading is weaker, which is the triple
    (5, 4, 2) with drops 1 and 3. Three seeds 4, 4, 4 have spread 0.
    Three seeds 4, 4, 3 have spread 1, and that spread blocks a
    presentation label. A degree-2 map X^2 + 1 over X, cleared against
    each of 0, 1 and 2, has degree 2 three times. The random-generator
    count equals the set size 3, not the degree 2. Two is coprime to 15.
    Three and five are not.
  mechanism: >-
    The proposal compares a transported membership set with a fresh set
    and with a same-count random enrichment. This contract checks the
    reading rules and the pullback degree count. It does not build a
    matrix and it does not form an isogeny graph.
