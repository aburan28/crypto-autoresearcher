hypothesis:
  id: H-QALG-82fb90
  question_id: RQ-QALG-122b59
  derived_from_idea: IDEA-20260815-6ed3c9
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  title: >-
    Uniform baseline attribution across the portfolio's quantum claims: at least one
    claimed advantage is scored against a generic classical baseline rather than
    against the best structure-exploiting classical algorithm, and does not survive
    re-scoring
  statement: >-
    SCOPE: every record in this program's committed corpus that asserts a QUANTUM cost
    advantage over a classical baseline, enumerated by a MECHANICAL rule fixed before
    any re-scoring is performed; the classical state of the art as documented in this
    corpus on the run date; and the parameter regimes each claim itself states. This is
    an evidentiary audit of the program's own records. IT PRODUCES NO NEW ALGORITHM AND
    NO NEW BOUND, and a failed re-scoring re-labels a claim's advantage - it does not
    show any quantum algorithm is wrong.
    THE CLAIM, in three separable parts.
    (B1) CONTROLS BEHAVE. A claim whose advantage is uncontested survives re-scoring,
    and a claim already known to be baseline-inflated fails it. If either control
    misbehaves, the audit harness is wrong and NOTHING may be concluded.
    (B2) SCOREABILITY. A majority of the enumerated claims state their classical
    baseline and their parameter regime explicitly enough to be re-scored. Claims that
    do not are listed as unscoreable rather than skipped, and their count is itself a
    finding about the portfolio.
    (B3) AT LEAST ONE FAILURE. Among the scoreable claims, at least one has an
    advantage that does not survive re-scoring against the best structure-exploiting
    classical algorithm for the same instance class, in at least one of the regimes the
    claim itself asserts.
    ALL THREE ARE ASSERTED AND EACH CAN FAIL SEPARATELY. In particular, the outcome
    "every claim survives" FALSIFIES (B3) and is a genuine, reassuring result about the
    portfolio's comparisons - it is recorded as such and is not treated as a null run.
  mechanism: >-
    A quantum advantage is a RATIO, and a ratio has two ends. Scoring the quantum end
    carefully while taking the classical end to be brute force inflates the ratio by
    exactly the amount the structure-exploiting classical algorithm would have saved -
    which for structured instances can be the entire claimed advantage. The audit
    therefore recomputes each claimed advantage with the classical end replaced by the
    best structure-exploiting classical algorithm documented for the same instance
    class, at the same parameter regime, and reports the ratio before and after. Two
    features make this decidable rather than a matter of taste: the enumeration of
    claims is mechanical and fixed in advance, so the audit cannot be steered by which
    claims are chosen; and where the best classical baseline is contested, BOTH
    candidates are carried and both ratios are reported, so the audit cannot be steered
    by which baseline is preferred either. The failure mode this design must avoid is
    its own mirror image - choosing an unrealistically strong classical baseline would
    unfairly retire sound claims - and carrying contested baselines in both variants is
    what prevents it.
  assumptions:
    - >-
      The set of claims to audit is determined by a MECHANICAL enumeration rule over the
      committed corpus, fixed and hash-committed before any re-scoring. A hand-picked
      claim set would make the headline count meaningless, and this is the single most
      likely way the audit would manufacture its own conclusion.
    - >-
      A best structure-exploiting classical baseline is identifiable per instance class
      FROM THIS CORPUS. Where it is contested, both candidates are reported rather than
      one chosen. Where none is documented, the claim is unscoreable and is listed.
    - >-
      Advantages are compared at the exponent level and at the parameter regimes each
      claim itself states, not at a single regime chosen by the auditor. An advantage can
      survive in one regime and not another, so a single verdict per claim would be wrong.
    - >-
      The audit is a snapshot. Classical baselines move, so every verdict carries its run
      date and its cited baseline, and the record says so prominently rather than in a
      footnote.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "of the claims enumerated by the frozen rule on this date, this many were
        scoreable, this many failed re-scoring against the cited best classical baseline in
        at least one stated regime, and this many were unscoreable." It certifies nothing
        about claims outside the enumeration, nothing about future classical baselines, and
        nothing about whether any quantum algorithm is correct.
      nearby_object_control: >-
        Two claims with KNOWN answers: one whose advantage is uncontested, which must
        survive; and one already known to be baseline-inflated, which must fail. They are
        the only reason a verdict on an unknown claim carries information.
    proof_obligations: []
    not_applicable_reason: >-
      This hypothesis is an evidentiary audit of the program's own records rather than a
      proof-oriented claim: it asserts no theorem, no bound and no reduction, and the
      KN-TECH-080 audits have no mathematical object to act on. The method_ceiling and
      nearby_object_control subfields ARE filled, because those two are what make an audit
      of this kind decidable at all, and nulling them would remove the audit's only
      controls. The remaining subfields are null with this reason recorded, per
      templates/research-records.md.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-QALG-82fb90-1
      formal_statement: >-
        For each audited instance class, the best structure-exploiting classical algorithm
        is identifiable from this corpus as it stands on the run date. Quantifiers: for
        every instance class appearing in the enumerated claim set.
      random_model_justification: >-
        Not a random model. The rigorous ingredient is that for the classes involved the
        classical state of the art is documented in this corpus. THE GAP, stated: classical
        baselines move, and this corpus is not the literature. A re-scoring is a statement
        about what this corpus documents at one moment, not a durable verdict, and it is
        time-stamped for exactly that reason.
      supporting_results: []
      validation_experiment_ids:
        - EXP-QALG-fd1f97
      falsification_condition: >-
        A classical algorithm better than the one used as baseline is found for an audited
        class, whether during the audit or afterwards. The affected verdicts are superseded
        by a new record under a new id - never edited - and the audit's snapshot status is
        what makes that the correct repair.
    - id: HEUR-QALG-82fb90-2
      formal_statement: >-
        Exponent-level comparison at the regimes each claim states is sufficient to decide
        whether an advantage survives; a claim whose advantage turns on constant factors
        rather than exponents is classified as such and is NOT scored by this audit.
      random_model_justification: >-
        None. This is a scoping decision made explicit so that a constant-factor claim is
        not silently retired by an exponent-level comparison that was never designed to see
        it - which would be the audit's own mirror failure.
      supporting_results: []
      validation_experiment_ids:
        - EXP-QALG-fd1f97
      falsification_condition: >-
        A claim whose stated advantage is at the exponent level in one regime and at the
        constant-factor level in another. It must then be split by regime rather than given
        a single classification.
  structural_ingredients:
    - description: >-
        The quantum cost claims held in this program's committed corpus, and the classical
        algorithms documented here as their baselines.
      citation: null
      provenance: internal
      verified_by: >-
        The enumeration is over committed records and is reproducible from the frozen rule
        plus a commit sha. No external literature is consulted or asserted; where this
        corpus does not document a classical baseline, the claim is unscoreable and is
        listed as such rather than filled from recollection.
      role: the population being audited
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: uncontested_advantage_control
      direction: different
      minimum_effect: >-
        FORCED to SURVIVE re-scoring. POSITIVE CONTROL: if a claim whose advantage is
        uncontested is retired by the harness, the harness is choosing baselines wrongly and
        NO verdict from the run is admissible.
    - metric: known_inflated_control
      direction: different
      minimum_effect: >-
        FORCED to FAIL re-scoring. NEGATIVE CONTROL: if a claim known to be baseline-inflated
        survives, the harness cannot detect inflation and every "survives" verdict it issued
        is uninformative - the classic control that cannot fail.
    - metric: scoreable_fraction
      direction: higher
      minimum_effect: >-
        Above one half of the enumerated claims, under part (B2). Below that, the finding is
        that the portfolio's quantum claims do not state their baselines well enough to be
        audited - which is a real and reportable result about the corpus, and falsifies (B2).
    - metric: claims_failing_rescoring
      direction: higher
      minimum_effect: >-
        At least one, under part (B3). ZERO falsifies (B3) and is a genuine reassuring
        result: the portfolio's quantum comparisons are sound at the exponent level against
        the cited baselines on this date, and it is recorded as a finding rather than as a
        null run.
    - metric: regime_dependence_count
      direction: different
      minimum_effect: >-
        No pre-registered value. The number of claims that survive in one stated regime and
        fail in another is reported, since a single verdict per claim would be wrong where
        this count is non-zero.
  test_boundary:
    instances: >-
      Every committed record asserting a quantum cost advantage, enumerated by the frozen
      mechanical rule, plus the two control claims.
    parameters:
      enumeration_rule: >-
        Fixed and hash-committed before any re-scoring; the rule, not a list, is the frozen
        object, so the audit is reproducible against a later corpus state.
      regimes: every parameter regime each claim itself states
      contested_baselines: reported in both variants, never resolved by preference
      comparison_level: exponent-level; constant-factor claims are classified and excluded
    implementation: >-
      Symbolic re-scoring against documented complexities. No algorithm is implemented, no
      instance is attacked, and no benchmark is run.
    budget:
      total_cpu_hours: 1
      maximum_runs: 10
  falsification_conditions:
    - >-
      Either control behaves wrongly - the uncontested claim is retired, or the known-inflated
      claim survives. The harness is invalid and NOTHING may be concluded from any verdict.
      (B1) is falsified.
    - >-
      Fewer than half the enumerated claims are scoreable. (B2) is falsified, and the finding
      is that the portfolio's quantum claims do not state their baselines well enough to be
      audited - a real result about the corpus, reported as one.
    - >-
      Zero scoreable claims fail re-scoring. (B3) is falsified. The portfolio's quantum
      comparisons are sound against the cited baselines at the stated regimes on this date.
      This is reassuring, it is worth recording, and it must not be written as an
      inconclusive run.
    - >-
      The verdict on any claim changes when a contested baseline's other candidate is used.
      That claim is UNDECIDED by this audit and is reported as undecided, never resolved by
      preferring a baseline.
  interpretation_limits:
    - >-
      This re-scores existing claims. It produces no new algorithm, no new bound, and no
      statement about whether any quantum algorithm is correct.
    - >-
      A failed re-scoring RE-LABELS a claim's advantage against a stated classical baseline.
      It does not show the quantum algorithm is wrong, and the deliverable must not be
      written as if it did.
    - >-
      Scoped to the claims enumerated by the frozen rule, the baselines documented in this
      corpus, and the run date. Classical baselines move; every verdict carries its date.
    - >-
      Choosing an unrealistically strong classical baseline would unfairly retire sound
      claims. That is this audit's own mirror failure and is why contested baselines are
      carried in both variants rather than resolved.
    - >-
      No status change to any audited record is proposed or implied. A re-labelling travels
      as a superseding record under a new id and only by the Coordinator.
  prior_evidence_refs:
    - RQ-QALG-122b59
    - IDEA-20260815-6ed3c9
  distinguishable_outcomes:
    - outcome: >-
        Both controls behave; a majority of claims are scoreable; at least one scoreable claim
        fails re-scoring in a stated regime, robustly across contested-baseline variants.
      means: >-
        SUPPORTS all three parts. Next decision: the failing claims are re-labelled through
        superseding records naming the baseline and the regime; the ranked list becomes the
        audit's deliverable; and the enumeration rule is retained so the audit can be re-run
        cheaply when the corpus grows.
    - outcome: >-
        Both controls behave; a majority are scoreable; ZERO claims fail re-scoring.
      means: >-
        FALSIFIES (B3), and this is a real finding. The portfolio's quantum comparisons are
        sound against the cited baselines at the stated regimes on this date. Next decision:
        record it as a clean pass with its scope and date, and do NOT re-run with a stronger
        baseline chosen to produce a failure - that would be the mirror failure.
    - outcome: >-
        Both controls behave but fewer than half the claims are scoreable.
      means: >-
        FALSIFIES (B2). The binding problem is that the portfolio's claims do not state their
        baselines. Next decision: the deliverable becomes the unscoreable list plus a
        requirement that future quantum claims state their baseline and regime, which is a
        process fix rather than a re-labelling.
    - outcome: >-
        A control behaves wrongly, or verdicts flip across contested-baseline variants.
      means: >-
        NO EVIDENCE EITHER WAY. Harness invalid, or the comparison is undecidable for those
        claims. Next decision: fix the harness before any verdict is read; report flipping
        claims as undecided rather than resolving them by preference.
