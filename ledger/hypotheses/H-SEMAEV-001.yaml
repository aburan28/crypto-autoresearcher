hypothesis:
  id: H-SEMAEV-001
  question_id: RQ-ECDLP-001
  statement: Over toy prime fields of 8-12 bits, with a fixed factor base of 14 points,
    the reduced Groebner basis of the S_3 length-2 decomposition system has a maximum
    total degree (observable proxy) bounded by a small constant (<= 6), and its wall
    time stays below one second, not growing super-linearly across the tested bit
    range.
  mechanism: S_3 is degree 2 in each variable; intersecting it with the factor-base
    indicator polynomials yields a low-dimensional zero-set whose reduced basis the
    Buchberger/F5 routine can express in low degree at these sizes. The factor-base
    indicator degree (14) inflates the generating system but not necessarily the reduced
    basis.
  assumptions:
  - sympy grevlex Groebner is a faithful (if unoptimized) solver at toy scale
  - reduced-basis max degree is an implementation-bound proxy, not d_reg
  predictions:
  - metric: groebner_basis_max_degree_proxy
    direction: different
    minimum_effect: bounded by 6 across tested bits
  - metric: groebner_seconds
    direction: different
    minimum_effect: below 1.0s and not super-linear in bit size
  test_boundary:
    instances:
    - seeds 1-2 x bits 8/10/12
    - 6 curves
    parameters:
      factor_base_size: 14
      decomposition_length: 2
    implementation: harness/semaev.py at the recorded commit
    budget:
      wall_clock_seconds_per_run: 60
  falsification_conditions:
  - reduced-basis max-degree proxy exceeds 6 on any tested instance
  - any run exceeds 1.0s wall time, or time grows super-linearly in bits
  interpretation_limits:
  - toy prime fields only; says nothing about medium/crypto scale
  - absolute timings are sympy-bound and not a cost model
  status: analyzed
  proposed_by: idea-generator
