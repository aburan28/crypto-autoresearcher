hypothesis:
  id: H-ECDLP-32e5d7
  question_id: RQ-ECDLP-bc7a54
  source_idea: IDEA-20261003-76df35
  derived_from_idea: IDEA-20261003-76df35
  experiment_id: EXP-ECDLP-9e8926
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-ECDLP-bc7a54 copies GOAL-ECDLP-001 from its record. This design does not edit any
    goal head (including GOAL-ECDLP2M-001.yaml, which is out of write-scope).
    Attachment to a goal is a later record if a Coordinator so decides.
  specified_at: '2026-10-04'
  approved_at: '2026-10-04'
  authorised_by: DEC-20261004-57f0cc
  proposed_by: coordinator
  status: approved
  title: >-
    On a Python-enumerable toy ladder, the mixed-spectrum constant C(E) is
    bounded and flat while Theorem U's tightness ratio tau(D) stays <= 1 on a
    constructed library (O-U-HOLDS), or else a C-growth / tau-violation /
    instrument artifact is localised

  statement: >-
    SETTING (Stages 0-1 of IDEA-20261003-76df35). Let E/F_p be ordinary of prime
    order n, g a generator. For D closed under negation, A_x(D) and A_L(D) are
    the Wiener norms of the x-coordinate and discrete-log profiles. The mixed
    spectrum is S(a,t) = sum_{Q != O} e_p(a x(Q)) e_n(t log_g Q), and
    C(E) = max_{a != 0, t} |S(a,t)| / sqrt(p). Theorem U: if |D| <= p and
    A_L(D) <= p/2 then |D| <= 4 (C(E) sqrt(p) + 1) A_x(D) A_L(D). Class K(K1,K2)
    of interval-type chi and structured-exponent omega inherits alpha = 1/2
    exactly when K1, K2 are polylog. Heuristic H1: C(E) <= 4 uniformly on the
    tested ordinary prime-order toys. Scope number A_L(W(m,w)) is Stage 3 of the
    idea and is OUT OF SCOPE for this Stages 0-1 authorization (successor).

    CLAIMS UNDER TEST at the approved cells:
    (S0) Zero-run worksheet: Theorem U with constants, class-K corollary,
    D_x and interval-of-logs readings, piecewise corollary vs DR-CGK honesty,
    anomalous treatment, retrieval status for Kohel-Shparlinski / Ahmadi-
    Shparlinski Lemma 1, H1 prediction table on bits {10..14}.
    (C1) Exact mixed-spectrum C(E) on the frozen ladder versus NULL-1
    pairing-preserving relabelings, with j=0 orbit equalities, anomalous
    ceiling arm when found, and a minimal library of D_x / D_I / random sets
    for tau(D).
    (HOLD) O-U-HOLDS: tau(D) <= 1 for every library set; C(E) <= 4 (soft) /
    <= 6 (hard stop); slope of C(E) in ln p consistent with 0; j=0 equalities
    pass.
    (GROW) O-C-GROWING: C(E) rising in p with CI excluding 0 upward, or any
    curve with C(E) > 6.
    (VIOL) O-TAU-VIOLATION: tau(D) > 1 for any library set with measured C(E).

  mechanism: >-
    OBJECT FRAME from IDEA-20261003-76df35. Representation R1: affine x in F_p
    with additive characters; exponent profile over Z/n characters. Tracked
    object: the Wiener-norm pair (A_x, A_L) coupled by the mixed spectrum S.
    Operation set: translation (A_L invariant; A_x not) and, on j=0, the
    automorphism beta. Class III on the coordinate half. Priced open numbers:
    C(E) (Stages 0-1) and A_L(W) (Stage 3, deferred). Stage 0 is zero-curve
    arithmetic. Stage 1 enumerates toys and reads C(E)/tau against NULL-1.

  assumptions:
    - n is prime on the prime-order arm; the toy ladder enforces it.
    - D is closed under negation before any Wiener-norm claim (RQ constraint).
    - Interval Wiener bound A_x([0,B)) <= (4/pi^2) ln p + 2 is recalled; Stage 1
      checks it exactly on constructed intervals.
    - Recalled Kohel-Shparlinski absolute constant 4 is not support until the
      primary is retrieved; Stage 1 uses the measured C(E) and a hard stop at 6.
    - Python enumeration (+ optional numpy.fft) is the engine; timeouts/crashes
      are O-IMPEDIMENT, never negative evidence.
    - Stages 2-3 of the idea (full Wiener library; A_L(W) ladder) are out of
      this authorization and require a successor DEC.

  proof_search_map:
    bottleneck: >-
      Membership of invertible-side canonical sets in class K: Theorem U is
      sharp for structured-exponent sets and silent for spectrally complex
      exponent profiles. Whether D_w is the latter is Stage 3 (deferred);
      Stages 0-1 certify the size bound and measure C(E).
    baseline_embedding:
      parameter_slice: >-
        A_x = A_L = 1 corresponds to D = everything: S(0,0) = n-1 reproduces
        |D| = n-1 with no error. D_x(B) alone reproduces the f558e4 pinning as
        the joint form with L an interval.
      reproduction_check: >-
        Frozen fixture: Theorem U with MEASURED C(E) must give tau(D) <= 1 for
        every constructed library set; j=0 orbit equalities S(a,t)=S(zeta a,
        lambda t)=S(a,-t) to float tolerance 1e-9 * sqrt(p).
    observation_collision:
      observable: The pair (A_x(D), A_L(D)) and the curve constant C(E).
      distinct_preimage_search: >-
        Anomalous and random curves are predicted to share the same C(E) band;
        C(E) certifies the size bound for sparse doubly-simple sets, not curve
        hardness.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the linear advantage of one statistic (f558e4) by the bilinear
          pairing of two Wiener expansions.
        predicted_gain: Set-size bound with exponent exactly 1/2 for class K(polylog, polylog).
      - transform: representation_reduction
        proposed_object: Hint family -> (A_x, A_L) -> mixed spectrum.
        predicted_gain: Duality proved for interval-type chi and structured-exponent omega.
      - transform: observable_fiber
        proposed_object: Hold the class fixed; vary random / j=0 / anomalous / NULL-1.
        predicted_gain: Shows the theorem is about the class, not curve hardness.
    quantifier_order: >-
      FOR ALL ordinary prime-order E/F_p, FOR ALL D closed under negation with
      |D| <= p and A_L(D) <= p/2: |D| <= 4 (C(E) sqrt(p) + 1) A_x(D) A_L(D).
      Class K is fixed BEFORE the curve. Stage-3 A_L(W) is EXISTS-free (measured).
    method_ceiling:
      strongest_certifiable_claim: >-
        Toy-tier C(E)/tau certificate deciding O-U-HOLDS vs O-C-GROWING /
        O-TAU-VIOLATION on the frozen ladder, with Theorem U worksheet and
        NULL-1 / j0 / anomalous controls. Nothing outside class K; no hardness
        claim about a curve; A_L(W) deferred.
      nearby_object_control: >-
        Relabelled generic group (NULL-1): C_null expected near sqrt(ln(pn)) and
        growing. Anomalous curve: theorem holds, curve weak (alpha=1 outside
        |D|<=p regime).
    proof_obligations:
      - claim: Theorem U with constants, including the n=p case treatment.
        responsibility: correctness
      - claim: Interval / union Wiener bounds (chi side); interval / AP / GLV-box (exponent side) as Stage-0 arithmetic.
        responsibility: size
      - claim: Class K corollary alpha <= 1/2 + log(4 C K1 K2)/log n and HINTWALK floor.
        responsibility: scope
      - claim: Mixed spectrum computable in n FFTs of length p on the toy ladder.
        responsibility: runtime
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        There is an absolute C_0 <= 4 such that C(E) <= C_0 for every ordinary
        prime-order E/F_p on the tested field_bits {10..14} ladder (uniformity
        in p claimed only at tested sizes; cited Kohel-Shparlinski supplies the
        asymptotic O(1)).
      random_model_justification: >-
        Rigorous half: Kohel-Shparlinski / Ahmadi-Shparlinski Lemma 1 (<< q^{1/2}).
        Classical half: extremal of pn complex Gaussians predicts NULL-1 growth
        ~ sqrt(ln(pn)).
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-9e8926
      falsification_condition: >-
        Any curve with C(E) > 6, or a slope of max C(E) in ln p whose CI excludes
        0 upward on the ladder.
    - id: H2
      formal_statement: >-
        (Deferred to Stage 3.) log A_L(W(m,w)) / log |W| converges as n grows
        with w/m fixed. Not under test in Stages 0-1.
      random_model_justification: Parseval / Cauchy-Schwarz sandwich 1 <= A_L <= |W|^{1/2}.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Not scored in this authorization; successor Stage-3 contract owns it.

  structural_ingredients:
    - description: Ahmadi-Shparlinski Lemma 1 restates Kohel-Shparlinski Corollary 1 for mixed sums.
      citation: 'arXiv:1302.4210'
      provenance: retrieved
      verified_by: idea-generator via IDEA-20261003-76df35 citations
      role: bound on S(a,t) for a != 0
    - description: Generic Omega(sqrt n) floor; Theorem U reaches the same exponent on the curve for class K.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: coordinator, idea prior_art read 2026-10-04
      role: adjacent generic bound
    - description: Kangaroo inverts intervals of logs; Theorem U proves no interval-type chi recognises a dense subset.
      citation: KR-RHO-898783
      provenance: internal
      verified_by: coordinator, idea prior_art read 2026-10-04
      role: bounded omega class
    - description: Anomalous curves; ceiling control (theorem holds, curve weak).
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: coordinator, idea prior_art read 2026-10-04
      role: nearby-object ceiling

  reduction_chain:
    core_problem: set-size uncertainty bound coupling coordinate and exponent Wiener norms via mixed spectrum
    corollaries: []

  predictions:
    - metric: Stage-0 Theorem U / class-K / H1 table self-checks
      direction: same
      minimum_effect: All Stage-0 self-checks pass before any enumeration.
    - metric: C(E) per curve versus NULL-1 band on bits {10..14}
      direction: lower
      minimum_effect: >-
        O-U-HOLDS iff C(E) <= 4 soft / <= 6 hard, slope consistent with 0,
        tau<=1 on library, j0 pass; O-C-GROWING iff C>6 or rising slope;
        O-TAU-VIOLATION iff tau>1.
    - metric: j=0 spectral orbit residuals
      direction: same
      minimum_effect: Equalities to float tolerance 1e-9 * sqrt(p); else O-ARTIFACT.
    - metric: NULL-1 C_null growth
      direction: higher
      minimum_effect: Reported; equality of bands is not a falsification of Theorem U.

  test_boundary:
    instances:
      - seeded random prime-order short-Weierstrass toys on field_bits {10..14}
      - NULL-1 relabelled pairing-preserving draws per size
      - j=0 orbit positive control when a j=0 curve is found
      - anomalous ceiling when a CM toy is found
      - library sets D_x(B), D_I(L), random equal-size for tau
    parameters:
      field_bits: [10, 11, 12, 13, 14]
      curves_per_size_declared: 10
      null1_per_size_declared: 10
      j0_per_size_declared: 2
      executed_taper_note: >-
        Pure-Python/numpy wall-clock disclosure (not a silent threshold change):
        full 10/10 on bits<=12; 4/4 on bits 13-14. Declared scientific counts
        remain 10/10; incomplete cells relative to the declaration are labelled
        in artifacts and may yield O-IMPEDIMENT if the discriminator cannot be
        read.
      C0_soft: 4
      C0_hard: 6
      tau_hard: 1.0
      j0_tol_factor: 1.0e-9
      seeds_base: 2026100476
    implementation: experiments/EXP-ECDLP-9e8926/implementation/run.py
    budget:
      maximum_runs: 3
      maximum_memory_gb: 4
      maximum_workers: 1

  falsification_conditions:
    - O-U-HOLDS is falsified iff any library set has tau(D) > 1 with measured C(E), or any curve has C(E) > 6, or C(E) rises in p with CI excluding 0.
    - j=0 equality failure or calibration-row miss voids the instrument (O-ARTIFACT).
    - Timeouts/crashes are O-IMPEDIMENT, never mathematical negatives.
    - Stages 2-3 claims (full Wiener library; A_L(W) E-SPREAD/E-STRUCTURED) are not scored here.

  interpretation_limits:
    - Claim tier toy for every measurement; Theorem U is derivation-level conditional on the cited character-sum bound.
    - Class K is narrow by design; polynomial omegas (IDEA-20261003-cd1903 / EXP-ECDLP-02bd1c), partial omegas, character-defined chi and digit statistics are outside it.
    - Nothing here says the ECDLP is hard; the anomalous ceiling is explicit.
    - A_L(W) / D_w scope is deferred to a Stage-3 successor.
    - Recalled Kohel-Shparlinski absolute constant is not support (AGENTS.md rule 9).
    - No exponent-moving attack is proposed or tested.
    - Magma/Sage/AUXIN/Bedrock are not success paths.

  dominated_by: >-
    n/a (model lower-bound measurement). Checked against KR-RHO-13bf67,
    KR-RHO-898783, KR-RHO-ea34b8, KR-RHO-53c89f and the idea's prior_art rows;
    no attack axis occupied. Sibling EXP-ECDLP-02bd1c occupies the algebraic-
    omega / A(1) axis, not the bilinear set-size uncertainty axis.
  sota_delta:
    time: Zero on every ECDLP attack axis. Model delta is Theorem U at alpha=1/2 for class K with measured C(E).
    memory: Zero.
    data_queries: Not applicable.
