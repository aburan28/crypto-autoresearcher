  statement: >
    Fix the exact two-leaf unit-product
    identity S = u0 * u1 before any
    dyadic product tree, CRT metadata,
    Semaev polynomial, P1553 recurrence,
    factor-base table, or sparse rank
    audit is built. Stage 0 asserts only
    that on the frozen REAL ring Z/5Z
    one has children u0=2, u1=3, parent
    1, and that the nearby KF sum map
    u0+u1 yields 0 and is rejected as a
    generic unit-product. NULL empty
    child pair rejected. modulus 0
    rejected. This is not a Semaev
    relation, not a rho beat. Stages 1+
    stay unauthorized.
  mechanism: >
    IDEA-20260825-823de4 Stage 0 hard
    gate is the two-leaf product and its
    nearby-object counterpart, derived
    from the frozen (Z/5Z)^× units
    alone. Stage 0 freezes that identity
    as exact tables. No Semaev S_m. No
    P1553 recurrence. No factor-base.
    No CRT. No Velu. This is a new
    GOAL-ECDLP-001 object after Stage 0
    of EXP-ECDLP-6b3d67 held as
    P-S0-FROBSEM (DEC-20260908-1cb051).
    It is not Stage 1 of EXP-ECDLP-6b3d67
    and not Stage 1 of this experiment.
  predictions:
    - id: P-S0-UNITPROD
      metric: well-defined two-leaf unit-product table on frozen toys
      direction: different
      minimum_effect: >
        After fixture_pass, REAL parent
        equals 1, and KF sum is rejected.
        NULL empty pair is rejected.
        modulus 0 is rejected. One
        certified miss after fixture_pass
        is a scoped falsification of this
        instrument at the frozen toys.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF sum is
        accepted as a generic unit-product
        target. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL fails
        to match parent 1. That
        falsifies only P-S0-UNITPROD
        at the frozen toy.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      real_units:
        modulus: 5
        u0: 2
        u1: 3
        must_parent: 1
      known_false:
        kind: sum_instead_of_product
        must_parent: 0
        must_reject: true
      matched_null: {kind: empty_pair, must_reject: true}
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-1dc6e1 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is exact
      (Z/5Z)^× arithmetic of one frozen
      two-leaf product and one sum
      nearby map. It is not Semaev, not
      a P1553 recurrence, not Stage 1
      of EXP-ECDLP-1dc6e1, and not
      Stage 1 of EXP-ECDLP-6b3d67.
      No cryptographic transfer. No
      rho beat.
  assumptions:
    - id: A1
      statement: >
        REAL is (Z/5Z)^× with children
        (2, 3). KF is the sum map.
        Stage 0 does not build a P1553
        recurrence, CRT, or Semaev S_m.
      status: explicit
    - id: A2
      statement: >
        IDEA-20260825-823de4 is the
        dyadic quotient-ring unit-product
        interface claim. Stage 0 tests
        only the two-leaf product
        calibrator, not the proposal's
        tree, CRT metadata, or p^{1/3}
        aspiration.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether a declared two-leaf parent
      equals u0 * u1 in (Z/5Z)^×, and
      whether a nearby sum map is
      rejected as generic.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: two-leaf
        unit-product calibrator only,
        not the proposal's dyadic tree
        or CRT metadata.
      reproduction_check: >
        REAL parent equals 1. KF sum
        rejected. NULL empty pair
        rejected. modulus 0 rejected.
    observation_collision:
      observable: product versus sum of the same two units
      distinct_preimage_search: >
        Hold the children and replace
        the product by the sum (KF).
        Hold the pair and replace it by
        empty (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact two-leaf unit-product table.
        predicted_gain: >
          Exact known-false sum reject
          on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze the ring and children
      before reading the table.
      Existential equality at one toy
      does not imply a tree bound and
      does not imply a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen toys. Never a
        Semaev bound. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is the empty child pair.
        An argument that still assigns
        it a true parent table is
        proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-UNITPROD only. Not
    Semaev. Not a P1553 recurrence.
    Not a factor-base. Not CRT. Not
