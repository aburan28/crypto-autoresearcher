  title: >
    Two-leaf unit-product Stage 0
    identity — parent equals the
    product of two public units in
    (Z/5Z)^×; the nearby sum is
    rejected as generic
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260908-452b3a
