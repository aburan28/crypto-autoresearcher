hypothesis:
  id: H-JINV-db2776
  question_id: RQ-JINV-8fc13a
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-51675e
  statement: >-
    THE AFFECTED SET FOR THE ESTABLISHED SPECIAL-j EFFECT IS EXACTLY {D_0 = -3, D_0 = -4}, NOT
    THE SMALL-DISCRIMINANT SET, AND DECIDING MEMBERSHIP COSTS NINE INTEGER SQUARE TESTS RATHER
    THAN A FACTORISATION. Three claims that can each fail independently.
    (S1) CHEAP EXACT TEST. For E/F_p with p > 3 and trace t, the Frobenius discriminant is
    D = t^2 - 4p < 0 and D = D_0 f^2 with D_0 fundamental, so deciding whether D_0 equals a
    specific fundamental d requires only that D/d be a perfect square - one exact integer square
    test. Deciding membership in the nine class-number-one discriminants therefore costs nine
    square tests and deciding |D_0| <= B costs B square tests, with NO factorisation of t^2 - 4p
    anywhere. The square-test route must agree EXACTLY with a factoring-based computation of D_0
    on every curve of a toy validation set.
    (S2) STRUCTURAL SEPARATION. Over F_p with p > 3, |Aut_{F_p}(E)| is 2, 4 or 6 and nothing
    else - 6 requires j = 0 and p congruent to 1 mod 3, 4 requires j = 1728 and p congruent to 1
    mod 4, and every other curve has 2. CONSEQUENTLY a curve with small |D_0| that is not -3 or
    -4 has |Aut| = 2 and therefore an extra rho discount of EXACTLY ZERO. Small |D_0| BY ITSELF
    CONFERS NO DISCOUNT, and seven of the nine class-number-one discriminants confer none.
    (S3) BOUNDED MAGNITUDE. Against this program's negation-inclusive baseline convention of
    0.886 sqrt(N) group operations, the EXTRA discount at special j is sqrt(|Aut|/2), i.e.
    log2(sqrt(3)) at j = 0, log2(sqrt(2)) at j = 1728, and exactly 0 elsewhere. The largest extra
    discount over the whole audited corpus is therefore at most log2(sqrt(3)), and no entry in
    the resulting table moves any parameter recommendation.
  mechanism: >-
    The audit is a projection of a deployed curve onto the pair (D_0, |Aut|), computed from its
    published parameters alone. That projection is ISOGENY-INVARIANT - D_0 is a function of the
    trace and is therefore constant on an F_p-isogeny class, and |Aut| is determined by j together
    with a congruence on p - so the classification is a permanent property of a curve family
    rather than a snapshot an attacker can improve. Because j = 0 requires D_0 = -3 and no isogeny
    walk changes D_0, a curve whose class contains no j = 0 curve cannot be walked to one at any
    cost: the target does not exist in the class. Symmetrically a j = 0 curve cannot escape the
    discount. The audit's whole value is that it converts a qualitative scope sentence into a
    per-curve table with an exact bit column whose modal value is zero, and corrects the scope
    error - 'small discriminant means weaker' - that the structural separation refutes.
  assumptions:
  - >-
    Published curve parameters are used as published; no parameter is recalled from memory. If a
    parameter is not in the corpus, that audit cell reads OPEN with the reason named, and the
    executor must obtain it from a cited source before filling it. A cell marked OPEN is a
    correct audit entry; a guessed one is fabrication.
  - >-
    The j-invariant is computed from short Weierstrass form. Curves given in Montgomery or Edwards
    form are converted first and the conversion is recorded, because j is a model invariant but the
    coefficients are not. A conversion error changes j and hence the classification, and is the
    single most likely way to get a wrong row.
  - >-
    The nine class-number-one discriminants are taken as classical and are not re-derived. Nothing
    in the audit's correctness depends on the list being complete, because the sweep to the declared
    bound does not use it.
  - >-
    The discount applies to rho on the PRIME-ORDER SUBGROUP. Quoting it against the full group order
    rather than the subgroup order would be an accounting error of up to half the log of the cofactor.
  - >-
    This hypothesis makes NO security claim about any deployed system, recommends no parameter
    change, and its largest produced number is below one bit.
  proof_search_map:
    bottleneck: >-
      Deciding D_0 from D = t^2 - 4p WITHOUT factoring. That is the only technical step, and S1
      resolves it - testing a candidate fundamental d requires one perfect-square test of D/d, so a
      bounded sweep is linear in the bound with no factorisation anywhere.
    baseline_embedding:
      parameter_slice: >-
        Toy curves at 16 to 24 bits, where t^2 - 4p is small enough to factor outright. The
        square-test audit must reproduce the factoring-based D_0 exactly on every one.
      reproduction_check: >-
        A frozen fixture of at least 200 toy curves with D_0 computed BOTH ways, requiring exact
        integer equality on all of them. Any mismatch halts the line before any deployed curve is
        audited, because a misclassified discriminant puts a wrong entry in a scope table, which is
        worse than having no table.
    observation_collision:
      observable: 'The pair (D_0, |Aut|).'
      distinct_preimage_search: >-
        REQUIRED, AND EXPECTED TO SUCCEED IN BOTH DIRECTIONS; both collisions are informative.
        (i) Same pair, different curves - every j = 0 curve over every p congruent to 1 mod 3
        collides, so the observable identifies a FAMILY and not a curve, which is why the audit
        outputs a family classification and not a per-curve security claim. (ii) Same 'smallness'
        of |D_0|, different |Aut| - D_0 = -163 and D_0 = -3 are both class-number-one CM
        discriminants with |Aut| 2 and 6 respectively. That second collision IS S2, and it is the
        reason 'small |D_0|' is the wrong column heading for the affected set.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the discount map over the value 1 - i.e. the set of curves with no extra
        discount - shown to contain every prime-field curve except those with j = 0 and p congruent
        to 1 mod 3, or j = 1728 and p congruent to 1 mod 4.
      predicted_gain: >-
        No cost gain and none claimed. The gain is a correct scope statement that every other
        proposal in this lane needs in order to be reportable at all, produced in under a minute of
        compute, and the correction of a scope error that is easy to make and expensive to publish.
    quantifier_order: >-
      INTENDED - FOR ALL prime-field curves E/F_p with p > 3 in the audited corpus, the extra rho
      discount over the negation-discounted baseline EQUALS sqrt(|Aut_{F_p}(E)|/2), which is 1
      unless j is 0 or 1728 with the corresponding congruence on p. THE DANGEROUS WEAKER READING,
      NOT CLAIMED - FOR ALL E THERE EXISTS a discount, which would suggest every CM curve gets
      something. It does not. The audit obligation is that the discount column reads exactly zero
      for every row with |Aut| = 2, including the small-|D_0| rows, and that no reader can infer
      otherwise from the table's layout.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Curve X has j-invariant j, fundamental discriminant D_0 (or |D_0| greater than the swept
        bound), automorphism group of order |Aut|, and therefore an extra rho discount of exactly
        sqrt(|Aut|/2) against this program''s baseline convention.' It can NEVER certify that curve
        X is secure, that no other structure exists, or that this is the total effect of all
        special-j mechanisms - only that it is the total effect of the ESTABLISHED one.
      nearby_object_control: >-
        A CURVE WITH SMALL |D_0| BUT |Aut| = 2 - a deliberately constructed D_0 = -7 or D_0 = -163
        curve at toy scale. The hoped-for conclusion 'small discriminant means weaker' FAILS there,
        and the audit must report a discount of exactly 0.000. A tool that reports any discount for
        D_0 = -163 has not identified the load-bearing structure, which is the automorphism group
        and not the discriminant's size.
    proof_obligations:
    - claim: 'D_0 = d if and only if D/d is a perfect square, for d fundamental.'
      responsibility: correctness
    - claim: '|Aut| over F_p with p > 3 is 2, 4 or 6, under the stated j and congruence conditions.'
      responsibility: correctness
    - claim: 'The extra discount over the negation-discounted baseline is sqrt(|Aut|/2).'
      responsibility: correctness
    - claim: 'The audit reproduces factoring-based D_0 on every curve of the toy fixture.'
      responsibility: baseline
    - claim: 'D_0 is constant on an F_p-isogeny class.'
      responsibility: soundness
    - claim: 'Every table cell is computed or explicitly marked OPEN; none is recalled.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. No exponent is claimed or moved. The audited effect is a CONSTANT
    multiplier at most sqrt(3) on the baseline; the audit's own cost is linear in the sweep bound in
    integer square tests plus one modular inversion per curve. The bit table charges only the
    birthday-constant discount and does NOT charge the fruitless-cycle escape overhead at |Aut| = 6,
    which this program has not measured - so the tabulated bits are an UPPER BOUND on the realised
    advantage and the table says so in its caption.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    NONE. Every step is exact integer arithmetic or a textbook classification. The only non-derived
    input is the classical list of class-number-one discriminants, which is cited as classical and on
    which the audit's correctness does not depend, since the bounded sweep does not use it.
  structural_ingredients:
  - description: >-
      The classification of automorphism groups of elliptic curves over F_p with p > 3 into orders
      2, 4 and 6, with 6 at j = 0 and 4 at j = 1728 under the corresponding congruences on p.
    citation: Textbook (Silverman, Arithmetic of Elliptic Curves, III.10).
    provenance: recalled
    verified_by: null
    role: fixes the affected set and the magnitude of the extra discount
  - description: >-
      Tate's isogeny theorem over finite fields - F_p-isogenous curves have equal characteristic
      polynomial of Frobenius, hence equal trace, hence equal D and equal D_0.
    citation: Classical; recorded in this campaign's own transport results.
    provenance: internal
    verified_by: 'RQ-JINV-8fc13a and the campaign decomposition note'
    role: makes the classification an isogeny-class invariant, hence unreachable by any attacker action
  - description: >-
      This program's baseline convention of 0.886 sqrt(N) group operations for parallel rho with
      distinguished points, which ALREADY INCLUDES the sqrt(2) from negation.
    citation: KN-TECH-001, KN-TECH-006, KN-TECH-018.
    provenance: internal
    verified_by: 'knowledge/techniques/KN-TECH-006.md'
    role: >-
      the baseline the extra discount is quoted against; quoting sqrt(6) rather than sqrt(3) here
      would double-count negation and overstate the discount by half a bit
  predictions:
  - metric: 'audit-versus-factoring agreement rate on the toy validation fixture, as exact counts'
    direction: different
    minimum_effect: >-
      Exact agreement on every curve of the fixture, at least 200 of 200. Anything less halts the
      line and no deployed curve is audited.
  - metric: 'classification of a curve of the form y^2 = x^3 + b over a prime p congruent to 1 mod 3'
    direction: different
    minimum_effect: >-
      j = 0, D_0 = -3, |Aut| = 6 and an extra discount of log2(sqrt(3)). Any other result means
      either the corpus parameters or the audit is wrong and must be resolved before the table is
      emitted.
  - metric: 'classification of the pseudorandomly generated standardized curves in the corpus'
    direction: different
    minimum_effect: >-
      |D_0| greater than the swept bound and |Aut| = 2, hence an extra discount of exactly 0.000. A
      small |D_0| for a pseudorandomly generated standardized curve would be a significant and
      surprising finding requiring independent replication before any reporting.
  - metric: 'reported discount at |D_0| in {7, 8, 11, 19, 43, 67, 163}'
    direction: different
    minimum_effect: >-
      Exactly 0.000 bits at every one. This is S2 and it is the audit's sharpest internal consistency
      check. A discount that DECAYS gradually with |D_0| rather than dropping to zero immediately
      after 4 means the tool is conflating CM with extra automorphism.
  - metric: 'D_0 reported across every member of a toy isogeny class'
    direction: different
    minimum_effect: >-
      Identical for every member. Variation within a class means the audit is reading the curve
      rather than the class and every number is void.
  - metric: 'largest extra discount over the whole audited corpus, in bits'
    direction: different
    minimum_effect: >-
      Exactly log2(sqrt(3)). A larger value would exceed the |Aut| = 6 ceiling, which is impossible
      over prime fields with p > 3, and therefore indicates a bug rather than a discovery.
  test_boundary:
    instances:
    - >-
      A toy validation fixture of at least 200 curves at 16 to 24 bits where t^2 - 4p is factorable
      outright, including deliberately constructed D_0 = -3 and D_0 = -4 instances, deliberately
      constructed small-|D_0|-but-|Aut|=2 instances, one complete toy isogeny class, and the six
      sextic twists of one j = 0 curve.
    - >-
      Every prime-field curve the program's corpus names with published parameters. Curves whose
      parameters are not in the corpus are audited as OPEN cells, not filled from memory.
    parameters:
      sweep_bound: 'B = 10^6 square tests for the |D_0| <= B sweep, reported alongside every negative cell'
      class_number_one_set: 'the nine classical discriminants, tested by nine square tests'
      field_scope: 'prime fields with p > 3 only'
    implementation: >-
      Standard-library Python integer arithmetic plus one modular inversion per curve for j; exact
      integer square testing with no floating point anywhere. A separate, independent factoring-based
      D_0 routine for the validation fixture only. Toy isogeny-class enumeration by character-table
      trace counting. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 2
      maximum_runs: 6
  distinguishable_outcomes:
  - >-
    O1 (ALL THREE HOLD). The toy fixture agrees exactly on every curve; the j = 0 family classifies
    as (D_0 = -3, |Aut| = 6, log2(sqrt(3)) bits); the pseudorandom standardized families classify as
    (|D_0| > B, |Aut| = 2, 0.000 bits); every |D_0| in {7,...,163} reports exactly 0.000; D_0 is
    constant across the toy isogeny class; the six sextic twists all report D_0 = -3. MEANING - the
    lane acquires a correct affected-versus-safe scope statement with an exact bit column, the
    affected set has size 2 rather than 9, and every other result in this lane becomes reportable
    with a correct scope sentence.
  - >-
    O2 (TOOL WRONG). Any disagreement between the square-test route and factoring on the toy fixture.
    MEANING - the audit tool is wrong, most likely on the fundamental-discriminant congruence
    convention; the line halts and NO deployed curve is audited. Nothing about the mathematics is
    concluded.
  - >-
    O3 (S2 FALSE). A nonzero discount is reported at some |D_0| in {7, 8, 11, 19, 43, 67, 163}.
    MEANING - the tool is conflating 'CM' with 'extra automorphism', which is precisely the scope
    error this hypothesis exists to prevent; the number is a bug, not a discovery, and the affected
    set's size is not what S2 says.
  - >-
    O4 (SURPRISING POSITIVE). A pseudorandomly generated standardized curve classifies with
    |D_0| <= B. MEANING - a significant and surprising claim about a standardized curve. It is NOT
    reported until independently replicated under AGENTS.md rule 12, and the first hypothesis to test
    is a transcription error in the corpus's stored parameters.
  - >-
    O5 (ISOGENY INVARIANCE VIOLATED). D_0 varies within a toy isogeny class, or the six sextic twists
    of a j = 0 curve do not all report D_0 = -3. MEANING - the audit is reading the curve rather than
    the class; every number is void and the failure is the deliverable.
  - >-
    O6 (COVERAGE SHORTFALL). A material fraction of the corpus's curves lack published parameters and
    audit as OPEN. MEANING - the table is correct but incomplete, the OPEN cells are enumerated with
    their reasons, and an OPEN cell means neither safe nor affected. This is a reportable partial
    result, not a failure.
  falsification_conditions:
  - >-
    The audit disagrees with factoring on any curve of the toy fixture - S1 is false as implemented;
    the tool is wrong and nothing is audited until it is fixed.
  - >-
    Any nonzero discount at |D_0| in {7, 8, 11, 19, 43, 67, 163} - S2 is false as implemented.
  - >-
    Any curve reports |Aut| outside {2, 4, 6} - impossible over prime fields with p > 3; a bug.
  - >-
    The largest extra discount over the corpus exceeds log2(sqrt(3)) - S3 is violated, which is
    impossible over prime fields with p > 3 and therefore indicates a bug.
  - >-
    D_0 varies within a toy isogeny class - the isogeny-invariance premise is violated by the tool.
  interpretation_limits:
  - >-
    No security claim about any deployed system. The largest number in the table is below one bit and
    no parameter recommendation changes.
  - >-
    The table covers the ESTABLISHED special-j effect (the automorphism discount) only. If another
    proposal in this lane finds anything, the table must be extended by a superseding record; it may
    NOT be read as an upper bound on all possible special-j effects.
  - >-
    Scoped to prime fields with p > 3. Constructions over F_{p^2} with larger rational endomorphism
    structure, and binary-field Koblitz curves, carry more structure and are outside every number here.
  - >-
    'Not small' means only 'greater than the swept bound', and every negative cell names the bound
    that was actually swept. It is not 'D_0 is large' in any stronger sense.
  - >-
    A cell marked OPEN means the test was not run. It does not mean the curve is safe and it does not
    mean it is affected.
  - >-
    Pairing-friendliness is a DIFFERENT AXIS. Some curves are affected here because they are j = 0 and
    separately have small embedding degree, which is another lane's subject; conflating the two would
    misstate both, and this hypothesis makes no pairing claim.
