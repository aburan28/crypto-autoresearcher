    direction: different
    minimum_effect: >-
      'EXACTLY 0.000 +/- 0.02 for serial rho and 0.500 +/- 0.02 for BSGS. One
      constant threshold cannot be correct for both, and the measurement is
      unambiguous. This is D2''s decisive pair and it costs seconds.'
  - metric: >-
      G7 - Fieller bounded-set fraction under equal true slopes (b3 = 0),
      10000 replications, eps = 0.05, versus the delta-method finite-interval
