  interpretation_limits:
  - >-
    CLAIM TIER toy, and it may not be raised by any downstream citation. This is
    an INSTRUMENT AUDIT, NOT AN ATTACK. It makes no system easier to solve and
    MOVES NO EXPONENT. Pollard rho remains the ECDLP baseline. sota_delta is
    ZERO on every attack axis. dominated_by is not applicable -- no Pareto
    point, no cost claim.
  - >-
    GENERIC BASELINES ARE NOT INDEX CALCULUS. Every measured arm here is a
    generic algorithm with a known exponent, chosen precisely because the answer
    is known. Nothing measured transfers to the behaviour of an index-calculus
    arm, whose cost may not be a power law at all (HEUR-BF-R2). Every citation
    toward an IC conclusion must carry that gap explicitly.
  - >-
    NO STATUS CHANGE IS PROPOSED for GOAL-ICEX-001, RQ-ICEX-001, EV-ICEX-001,
    DEC-20260731-015, or the frozen protocol. The protocol is not superseded,
    edited, or invalidated. A correction, if warranted, is a NEW record under a
    NEW id naming the exact clause (AGENTS.md rules 1 and 4).
  - >-
    THE THREE SOURCE PROPOSALS ARE NOT THREE WITNESSES. IDEA-20260805-c8524f,
    -c06631 and -4d31bc were written in one session by one agent and share
    assumptions; they are three applications of one observation. Treating their
    agreement as corroboration would be a provenance error.
  - >-
    THE RHO CONSTANT DISAGREEMENT (0.886 vs 1.2533) IS REPORTED, NOT
    ADJUDICATED. Both records carrying them remain valid. This hypothesis
    reports both and takes no position, per AGENTS.md's retrieval policy item 7.
  - >-
    A CONFIRMING OUTCOME DOES NOT SHOW THAT A REPAIRED ESTIMATOR WOULD RESOLVE
    THE GOAL'S QUESTION. The resolution analysis says it would not, at 3
    replicas of 1 attempt. Presenting the repair as a route to the completion
    criterion without the attempts-per-replica requirement attached would
    misrepresent it.

