hypothesis:
  id: H-ICEX-4ccbaa
  question_id: RQ-ICEX-001

  statement: >-
    SCOPE: the exponent OBSERVABLE frozen in
    coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
    ic_exponent_protocol.yaml, evaluated on GENERIC BASELINE ARMS (Pollard rho
    with and without negation, van Oorschot-Wiener rho at 2^theta stored points,
    BSGS) and on SYNTHETIC COST ORACLES with programmable (A, a), at the
    protocol's own ladder n = log2(ell) in {8, 10, 12, 16}. CLAIM TIER toy.
    NO INDEX-CALCULUS ARM IS RUN, NO SDEG/MONO/RELN FEED IS CONSUMED, NO C_IC IS
    ASSEMBLED, NO ATTACK IS PROPOSED, AND NO EXPONENT IS MOVED.
    THE CLAIM. The quantity named in GOAL-ICEX-001's sole completion criterion
    is not an exponent, and three independent defects are each derivable in
    closed form before any run:
    (D1) FUNCTIONAL FORM. alpha_coord[c] = log(C[c])/log(ell) equals
    a_c + log(A_c)/log(ell) for any cost law C = A ell^a. It is therefore
    UNIT-COVARIANT -- rescaling the coordinate's unit by lambda shifts it by
    log(lambda)/log(ell), worth 2.4914 at n = 12 for a nanoseconds-to-seconds
    relabelling of the protocol's own admissible primary coordinate
    cpu_time_ns -- and CONSTANT-CONTAMINATED. Applied to the protocol's own
    mandated matched rho control, an object whose group-operation exponent is
    EXACTLY 1/2, it returns FORCED values 0.47822 / 0.48257 / 0.48548 / 0.48911
    at n = 8/10/12/16 under this program's committed A_rho = 0.886227
    convention, or 0.54072 / 0.53257 / 0.52715 / 0.52036 under the A_rho =
    1.253314 convention -- both conventions being simultaneously live in this
    corpus. THE NULL EXCLUDES 1/2 AT EVERY CELL, AND WHICH SIDE IT EXCLUDES FROM
    IS DECIDED BY WHICH RHO CONSTANT THIS PROGRAM WRITES DOWN. The same
    estimator separates rho from BSGS by log2(A_bsgs/A_rho)/n = +0.03240 at
    n = 8 falling as 1/n, though both have true exponent exactly 1/2.
    (D2) THRESHOLD TYPE. The predicate PRED-ALPHA-EXCLUDES-HALF-TOY compares
    alpha against the constant 1/2 while alpha is computed per coordinate. The
    derived baseline exponent is a FUNCTION of the coordinate: 1/2 for group
    operations, 0 for serial-rho memory and io and communication, theta for
    VW-rho memory, 1/2 for BSGS memory, and 2/3 for BSGS FULL COST -- the last
    being an already-established in-corpus record
    (knowledge/techniques/KN-TECH-035.md, confidence "established": "Shanks's
    baby-step giant-step needs n^{1/2+o(1)} processor steps but has full cost
    n^{2/3+o(1)}"). The threshold is therefore too generous by +0.5 on memory
    and too harsh by -1/6 on BSGS full cost, IN THE SAME VECTOR.
    (D3) DECISION OBJECT. Even after repairing D1 and D2, the exponent answers
    "does IC eventually win" while the goal needs "at what size". The crossover
    order log ell* = -b1/b3 from a joint fit is unit-invariant and its honest
    interval is a Fieller set that is FORCED to be unbounded with probability
    exactly 1 - eps when the true slopes are equal, against a delta-method
    interval that is finite with probability 1.
    THE REPAIRS ARE ALL INSIDE THE LADDER THE PROTOCOL ALREADY SEALS: an OLS
    slope of log C on log ell (unit-invariant by construction), a matched
    per-coordinate baseline delta = log(C_IC/C_base)/log(ell) (null value 0 on
    every coordinate), and a Fieller-set crossover. Their honest resolution
    limit is likewise derivable: with 4 cells and R replicas, S_xx = 3 * 35 =
    105 at R = 3, so SE(a_hat) = sigma/10.247 and resolving |a - 1/2| = 0.05 at
    95 per cent requires sigma_{log2 C} < 0.2300 bits, hence -- given the
    derived single-attempt Rayleigh spread of 0.925164 bits -- AT LEAST 17
    ATTEMPTS PER REPLICA. The protocol pins replications_per_cell_minimum = 3
    and pins nothing about attempts per replica.
    IF NO PART OF THIS SURVIVES, THE DELIVERABLE IS STILL A NAMED RESULT: a
    committed statement that the frozen observable is sound at the tested ladder
    together with the measured resolution floor, which the goal needs either
    way.

  mechanism: >-
    DERIVED IN-REPO THIS SESSION. Every numeric value below was computed in this
    session from the stated closed forms, is labelled SESSION-COMPUTED, and is
    re-derived by hand as stage 1 of EXP-ICEX-b8b2b6 rather than taken on trust.
    No external source is load-bearing; the two recalled items (the birthday
    survival function and Fieller's attribution) are re-derived here and their
    verification is a declared stage.

    PART 1 -- THE IDENTITY AND ITS CONSEQUENCES.
    Let ell be a cell's subgroup order, n = log2 ell, and model an arm's charged
    cost in coordinate c by C[c] = A_c ell^{a_c}. This is the weakest model
    under which "exponent" means anything; if it fails, alpha estimates nothing
    and the objection strengthens.
      alpha_coord[c] = log C[c] / log ell = a_c + log(A_c)/log(ell).      (*)
    (1a) UNIT COVARIANCE. C -> lambda C sends alpha -> alpha + log2(lambda)/n.
    SESSION-COMPUTED for lambda = 10^-9 (ns -> s): -3.7372 / -2.9897 / -2.4914 /
    -1.8686 at n = 8/10/12/16. Five of the protocol's six additive coordinates
    carry units (cpu_time_ns, io_read_bytes, io_write_bytes,
    communication_sent_bytes, communication_received_bytes) and both listed
    nonadditive memory coordinates do. Only group_operations_by_declared_type is
    dimensionless, and even it is convention-covariant at up to log2(1.5)/n =
    0.0731 at n = 8 depending on whether {add, dbl, mixed_add} are pooled.
    (1b) INVARIANT DIFFERENCE. For two arms in the SAME unit at the SAME cell,
    delta := log(C_1/C_2)/log(ell) has lambda cancel exactly. This is the only
    unit-invariant single-cell statistic available, and the protocol computes
    the matched baselines that would supply it (CTRL-MATCHED-RHO,
    CTRL-MATCHED-BSGS) and then compares against a constant instead.
    (1c) THE SLOPE. Fitting log C = log A + a log ell across cells sends a unit
    change entirely into the intercept. The slope is exactly unit-invariant.
    A grep of all 905 lines of the frozen protocol for slope / regress / fit /
    log-log returns no cross-cell estimator; the confidence_interval_rule is
    explicitly within-cell ("Across sealed replicas (minimum 3)"), and
    seeds.replications_per_cell_minimum = 3 with replica_index inside cell_id.

    PART 2 -- THE NULL, WITH ITS FORCED VALUES.
    Pollard rho under the birthday model (HEUR-BF-R1): S(t) = exp(-t^2/(2 ell)),
    so E[steps] = int_0^inf S = sqrt(pi ell/2) = 1.253314 sqrt(ell), and the
    true group-operation exponent is EXACTLY 1/2. With the negation map the walk
    is on ell/2 classes and A_rho = sqrt(pi/4) = 0.886227, which
    KN-TECH-035 records as this program's own convention ("the program's
    baseline convention is 0.886*sqrt(n) group operations, van
    Oorschot-Wiener parallelization assumed, fully charged"). By (*):
      alpha_rho(n) = 1/2 + log2(A_rho)/n. SESSION-COMPUTED:
      A = 0.886227: 0.47822 / 0.48257 / 0.48548 / 0.48911  (BELOW 1/2)
      A = 1.253314: 0.54072 / 0.53257 / 0.52715 / 0.52036  (ABOVE 1/2)
    Both constants are live simultaneously in this corpus: ledger/H-R6-001.yaml
    names "the T24-verified rho baseline (1.253 / 0.886 constants...)" and
    H-YIELD-001 / H-DS-001 / H-IT-001 / GOAL-ECDLP-001 use 0.886. NO POSITION IS
    TAKEN HERE ON WHICH IS CORRECT; the co-existence is the datum, and picking
    one would be the failure AGENTS.md's retrieval policy item 7 forbids.
    BSGS with a full baby table of ceil(sqrt(ell)) entries and mean sqrt(ell)/2
    giant steps has A_bsgs = 1.5, hence
      alpha_bsgs(n) - alpha_rho(n) = log2(1.5/1.253314)/n
        = +0.03240 / +0.02592 / +0.02160 / +0.01620.   SESSION-COMPUTED.
    Two objects with IDENTICAL true exponent receive different observables, and
    the separation is of the same order as the effect sought.

    PART 3 -- THE PER-COORDINATE BASELINE TABLE (D2), derived by inspection.
      serial rho (Floyd/Brent): group_ops 1/2; peak_memory 0 (O(1) group
        elements); io 0; communication 0; AT 1/2; AT^2 1.
      VW rho, 2^theta distinguished points: group_ops 1/2; peak_memory theta;
        communication theta. THETA IS A FREE PARAMETER OF THE BASELINE AND THE
        PROTOCOL NEVER PINS IT, while its dominance predicate ("C_IC not
        coordinatewise dominated by C_rho on a predeclared critical set")
        depends on it.
      rho with negation: exponents identical to serial rho; only A moves. So
        this row and the first are indistinguishable to the TABLE and are NOT
        indistinguishable to alpha -- which is Part 1 restated as a consistency
        check between D1 and D2.
      BSGS: group_ops 1/2; peak_memory EXACTLY 1/2; FULL COST 2/3 per
        KN-TECH-035 (RELAYED from that record; KN-LIT-094 NOT READ).
    Threshold error 1/2 - a_base: +0.5 on serial-rho memory/io/communication,
    +0.5 - theta on VW memory, 0.0 on group operations and BSGS memory,
    -0.1667 on BSGS full cost. BOTH SIGNS APPEAR IN THE SAME VECTOR, which is
    why neither a uniform tightening nor a uniform loosening repairs it, and
    why the correct repair is the matched delta whose null value is 0 on every
    coordinate.

    PART 4 -- THE CROSSOVER AND ITS FIELLER SET (D3), derived from scratch.
    Pool both arms and fit log C = b0 + b1 I + b2 L + b3 (I L), L = log ell, I
    the treatment indicator. The curves meet where b1 + b3 L = 0, i.e. at
    x* = -b1/b3, and a unit rescaling of BOTH arms shifts only b0, so x* is
    exactly unit-invariant. Inverting the exact linear-hypothesis test for
    b1 + x b3 = 0 gives the confidence SET
      S = { x : (b1 + x b3)^2 <= t^2 (V11 + 2 x V13 + x^2 V33) },
    a quadratic inequality whose leading coefficient is b3^2 - t^2 V33, positive
    exactly when |b3|/SE(b3) > t. FORCED CONSEQUENCE: under equal true slopes
    (b3 = 0), P(S bounded) = P(reject H0: b3 = 0) = eps, so at eps = 0.05 the
    correct procedure REFUSES to name a crossover in 95 per cent of
    replications, while a delta-method interval is finite with probability 1 and
    is TIGHTEST exactly where the evidence is weakest. That inversion is the
    structural tell.

    PART 5 -- THE HONEST RESOLUTION LIMIT OF THE REPAIR, which is the part the
    goal needs regardless of whether D1-D3 survive.
    With cells n in {8,10,12,16} and R replicas each, x-bar = 11.5 and
      S_xx = R * (3.5^2 + 1.5^2 + 0.5^2 + 4.5^2) = R * 35.0;  R = 3 => 105.0.
    So SE(a_hat) = sigma_{log2 C} / sqrt(105) = sigma / 10.247, and with
    t_{0.975,10} = 2.228, resolving |a - 1/2| = eps needs
      sigma_{log2 C} < eps * sqrt(105) / 2.228 = 4.598 eps.
    SESSION-COMPUTED: eps = 0.20 -> sigma < 0.9198 bits; eps = 0.10 -> 0.4599;
    eps = 0.05 -> 0.2300 (cost reproducible to a factor 1.173).
    The single-attempt spread is itself derivable for rho: ln X = ln s +
    (1/2) ln(2E) with E ~ Exp(1), so Var(ln X) = (1/4)(pi^2/6) = 0.411234 and
    sigma_{log2 X} = 0.925164 BITS. Averaging k attempts per replica gives
    sigma/sqrt(k), so k >= (0.925164/(4.598 eps))^2:
      eps = 0.20 -> k >= 1.01; eps = 0.10 -> k >= 4.05; eps = 0.05 -> k >= 16.19.
    HENCE THE DELIVERABLE "AT LEAST 17 ATTEMPTS PER REPLICA TO RESOLVE 0.05",
    which is a concrete pre-compute requirement on a parameter the frozen
    artifact does not mention.

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. That C = A ell^a is adequate
    over an 8-bit lever arm. It is provable for rho and BSGS (both exactly
    Theta(sqrt ell)) and FALSE IN PRINCIPLE for a genuinely subexponential IC
    arm, which is not a power law at all. Every fit therefore carries a
    mandatory sub-ladder refit ({8,10,12} vs {10,12,16}) whose slope spread is
    reported as the model-adequacy statistic, and if that spread exceeds the
    effect size the honest deliverable is "this ladder cannot support a slope
    claim", stated with its boundary rather than worked around.

  assumptions:
  - >-
    THE PER-CELL READING OF alpha. The frozen formula divides by log(ell), and
    replica indices live inside cell_id, so alpha is a per-cell quantity and the
    CI is within-cell. AN ALTERNATIVE READING EXISTS AND IS RECORDED BEFORE ANY
    MEASUREMENT: a reviewer might intend an informal across-cell comparison of
    the four alphas. Under that reading D1's unit objection is UNCHANGED (every
    alpha shifts, by cell-dependent amounts log lambda / n), the rho-versus-BSGS
    separation is UNCHANGED, D2 is UNCHANGED, and what changes is only that no
    estimator and no CI is pinned for the across-cell quantity. Stage 0 of
    EXP-ICEX-b8b2b6 records the Coordinator's reading BEFORE any number is
    produced, and the record is designed to lose gracefully: if the answer is
    "across-cell OLS slope on the dimensionless coordinate", D1 collapses to the
    Part 5 resolution deliverable alone and that is reported as the result.
  - >-
    ALL SESSION-COMPUTED NUMBERS ARE RE-DERIVED IN STAGE 1 BEFORE USE. They are
    stated here so a reviewer can attack them, not so they can be cited. Any
    disagreement between the stage-1 hand derivation and the values above halts
    the line, and the correction is a new record rather than an edit.
  - >-
    NO STATUS CHANGE, AMENDMENT, OR SUPERSESSION OF THE FROZEN ICEX PROTOCOL IS
    PROPOSED OR IMPLIED. Those are Coordinator decisions. This hypothesis
    produces derivations and baseline measurements; a protocol amendment, if
    warranted, is a separate committed record under a new id (AGENTS.md rule 4).
  - >-
    THE ICEX MEASUREMENT BAN IS RESPECTED BY CONSTRUCTION. DEC-20260731-015 and
    EV-ICEX-001 forbid ICEX measurement until charged SDEG/MONO/RELN packages
    exist. Nothing here consumes a feed, assembles C_IC, runs a relation
    campaign, invokes a summation polynomial, or produces an index-calculus
    number. The measured arms are generic baselines that the protocol itself
    mandates as controls; the treatment arm is a synthetic cost oracle. Any
    drift across that line invalidates the package rather than extending it.

  proof_search_map:
    bottleneck: >-
      The single step alpha := log(C)/log(ell) together with its comparison to
      the constant 1/2. Everything else in the ICEX design -- the feed pins, the
      no-scalarization obligation, the certificate requirements, the forbidden
      transforms, the activation gates -- is downstream of, and independent of,
      this one map. Repairing or condemning it is upstream of the goal's only
      completion criterion and consumes none of the SDEG/MONO/RELN budgets,
      because it needs no feed at all.
    baseline_embedding:
      parameter_slice: >-
        The matched Pollard-rho control at each ladder cell, on the
        group-operation coordinate. This is the exact slice on which the frozen
        estimator is SUPPOSED to be correct: rho's exponent is 1/2 by
        construction, the coordinate is dimensionless, and the protocol
        already mandates the arm (CTRL-MATCHED-RHO). If the estimator is sound
        anywhere, it is sound here.
      reproduction_check: >-
        SYMBOLIC FIRST, THEN MEASURED. Symbolically, (*) forces
        alpha_rho(n) = 1/2 + log2(A_rho)/n, which is a closed form with no free
        parameter once A_rho is fixed by the implementation. Measured, the
        rho arm's own mean operation count determines A_rho empirically and the
        four alpha values must match the closed form to within the replica CI.
        A curve that merely looks like 1/2 is not a reproduction; these are
        exact scalar identities against values derived before the run.
    observation_collision:
      observable: >-
        alpha_coord = log(C)/log(ell) at a single cell, with its within-cell
        replica CI, compared to the constant 1/2.
      distinct_preimage_search: >-
        THE COLLISION SEARCH SUCCEEDS AND IT IS THE HYPOTHESIS'S CONTENT, in the
        form that is worse for an estimator than the usual one. The usual
        failure is two distinct objects sharing an observable; here ONE
        GROUND-TRUTH PROPERTY MAPS TO MANY OBSERVABLES. Concretely: (i) rho and
        BSGS both have true exponent exactly 1/2 and receive alphas differing by
        +0.03240 at n = 8; (ii) rho-with-negation and rho-without have identical
        exponents and receive alphas differing by 0.0625 at n = 8, on opposite
        sides of 1/2; (iii) the SAME rho campaign recorded in nanoseconds and in
        seconds receives alphas differing by 2.4914 at n = 12. In the reverse
        direction the collision is also present: an arm with true exponent 0.40
        and A = 10^9 and an arm with true exponent 0.60 and A = 10^9 both
        receive alpha above 1/2 at every cell (minimum excess
        log2(10^9)/16 - 0.10 = 1.769), so the observable does not separate a
        genuine win from a genuine loss. Each of these is a direct falsifier of
        identifiability, and no additional condition in the frozen protocol
        separates them.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move from the one-parameter observable alpha to the two-parameter model
        (log A, a) fitted jointly across the sealed ladder, in which the
        hypothesis becomes an exact statement about a regression coefficient
        rather than an approximate statement about a ratio. Encoding: the same
        sealed campaign data, no new measurement. Completeness: the slope is
        identifiable from >= 2 distinct ell. Soundness: unit invariance is
        exact. Transfer: NONE CLAIMED to crypto scale -- the fit is local to the
        window. Cost loss: none; it is a post-processing change.
      predicted_gain: >-
        Converts a quantity contaminated by log A / log ell into one in which
        log A is an estimated nuisance parameter, and makes the ladder's
        resolution limit computable in advance (SE = sigma/10.247 at R = 3).
    - transform: observable_fiber
      proposed_object: >-
        Hold the observable alpha fixed and vary the forgotten structure
        (log A, a) along the line a = alpha - log A/log ell. Ask whether any
        intrinsic invariant inside the frozen protocol distinguishes the
        resulting arms.
      predicted_gain: >-
        If none exists -- and none does, since the protocol reads only C at one
        ell -- the frozen observable provably cannot separate a change in the
        constant from a change in the exponent, and the fibre argument delivers
        that at zero compute.
    - transform: boundary_lift
      proposed_object: >-
        Enlarge the reported family from {alpha} to
        {slope a_hat, matched delta per coordinate, crossover x* with Fieller
        set, extrapolation ratio x*/n_max, censoring fraction}, and prove a
        strict inward improvement rather than mere feasibility: each new
        quantity has a null value that is correct on every coordinate
        (0 for delta, 1/2 for a_hat on both baselines, unbounded set for x*
        under equal slopes) where the incumbent's null value is correct on at
        most three of eleven coordinates.
      predicted_gain: >-
        A decision rule whose null is right everywhere, at no additional
        measurement cost, since every input is already a mandated output.
    quantifier_order: >-
      THE FROZEN CLAIM, WRITTEN OUT: THERE EXISTS a predeclared primary
      coordinate and CI method such that FOR ALL sealed campaigns, "the CI of
      alpha_primary excludes 1/2" indicates a toy-scope index-calculus advantage
      over matched rho. THE COUNTER-STATEMENT CLAIMED HERE: FOR ALL cost laws
      C = A ell^a and FOR ALL cells ell, alpha = a + log A/log ell, so FOR EVERY
      target value v THERE EXISTS a constant A placing alpha at v regardless of
      a -- hence the witness (the verdict) is allowed to depend on the unit and
      on the constant, which the claimed uniform conclusion forbids. THE
      QUANTIFIER TRAP BEING HUNTED, stated explicitly: the protocol needs
      EXISTS-estimator FORALL-arms, and what alpha delivers is at best
      FORALL-arms EXISTS-unit-convention-making-the-verdict-come-out-either-way,
      which is the reverse order and is not a decision procedure. The REPAIR's
      own quantifier order is stated with equal explicitness and is weaker than
      one might wish: EXISTS one estimator (the OLS slope, fixed and
      parameter-free) FORALL arms and FORALL unit conventions, the estimate is
      invariant -- but the RESOLUTION is a per-ladder quantity, so no uniform
      claim is made that the ladder can resolve any given eps, and the
      resolution floor is reported per configuration rather than asserted.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that ONE formula and ONE threshold in ONE frozen design
        artifact are, at the tested toy ladder and on generic baseline arms,
        respectively not unit-invariant and not coordinate-correct, with
        derived error magnitudes. It CANNOT certify that index calculus does or
        does not beat rho; cannot move any exponent; cannot advance, narrow, or
        close KN-OPEN-001 or RQ-ICEX-001; cannot say anything about
        cryptographic scale; and cannot establish that a repaired estimator
        would have resolved the goal's question, since the resolution analysis
        says the opposite unless attempts per replica are raised. Writing it up
        as a refutation of the ICEX programme would be the premature-closure
        failure mode and is forbidden by this record.
      nearby_object_control: >-
        BSGS IS THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION FAILS, and it
        is included because it cuts against the headline in two separate ways.
        (i) On the MEMORY coordinate, BSGS's baseline exponent is exactly 1/2,
        so the frozen threshold is RIGHT there -- the one cell of the whole
        table where it is correct for a reason. (ii) On the FULL-COST
        coordinate, KN-TECH-035 puts BSGS at 2/3, so the frozen threshold is too
        HARSH by 1/6, i.e. the error runs in the direction OPPOSITE to the
        headline "the threshold manufactures IC wins". An account predicting a
        uniform direction of error is refuted by this object, and the experiment
        must report both cells. A method that could not distinguish the
        memory row from the full-cost row would not have identified the
        load-bearing structure, which is the coordinate index itself.
    proof_obligations:
    - claim: >-
        alpha = a + log A / log ell, hence unit covariance with shift
        log lambda / log ell.
      responsibility: correctness
    - claim: >-
        alpha_rho(n) = 1/2 + log2(A_rho)/n, with the stated four values under
        each of the two live A_rho conventions.
      responsibility: baseline
    - claim: >-
        The per-coordinate baseline exponents 0 / theta / 1/2 / 2/3 as derived,
        each carrying its convention.
      responsibility: baseline
    - claim: >-
        The BSGS full-cost exponent 2/3 is RELAYED from KN-TECH-035 and is not
        independently verified here; KN-LIT-094 was NOT READ.
      responsibility: scope
    - claim: >-
        The Fieller set's leading coefficient is positive iff b3 is significant,
        hence P(bounded | b3 = 0) = eps exactly.
      responsibility: strictness
    - claim: >-
        SE(a_hat) = sigma/sqrt(R * 35) and the derived attempts-per-replica
        floor k >= 17 for eps = 0.05.
      responsibility: feasibility
    - claim: >-
        sigma_{log2 X} = 0.925164 bits for a single rho attempt, from
        Var(ln X) = pi^2/24.
      responsibility: success_probability
    - claim: >-
        Nothing here transfers beyond the tested toy ladder and generic arms;
        no index-calculus conclusion is licensed.
      responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. There is NO complexity claim of any kind. This is an
    AUDIT AND REPAIR OF A MEASUREMENT INSTRUMENT. A repaired estimator makes an
    exponent comparison interpretable; it makes no system easier to solve, moves
    no exponent, and adds no attack. Pollard rho remains the ECDLP baseline at
    0.886 sqrt(N) group operations under this program's convention, and
    sota_delta is ZERO on every attack axis (time, memory, data, queries,
    advice, preprocessing). dominated_by is not applicable: no Pareto point is
    claimed, and the frontier rows checked to justify that are enumerated in the
    three source proposals.

  heuristic_assumptions:
  - id: HEUR-BF-R1
    formal_statement: >-
      FOR ALL toy cells in the declared boundary, the Pollard-rho walk behaves
      as a uniform random function on its state space, so the step count X to
      the first repeat satisfies P(X > t) = exp(-t^2/(2 ell)) (1 + o(1)),
      whence E[X] = sqrt(pi ell/2) and Var(ln X) = pi^2/24.
    random_model_justification: >-
      The functional form is DERIVED HERE rather than imported: E[X] =
      int_0^inf S(t) dt gives sqrt(pi ell/2) directly, and writing
      ln X = ln s + (1/2) ln(2E) with E ~ Exp(1) gives Var(ln X) =
      (1/4) Var(ln E) = pi^2/24. WHAT IS HEURISTIC IS ONLY the step from a
      structured r-adding walk to a uniform random function, which is known to
      be imperfect for small r and for which NO SOURCE IS CITED HERE. This
      heuristic is LOAD-BEARING ONLY FOR THE PREDICTED NUMBERS: the
      unit-covariance identity, the collision arguments, the per-coordinate
      table, and the Fieller derivation hold for ANY cost law whatsoever and do
      not depend on it.
    supporting_results: []
    validation_experiment_ids: [EXP-ICEX-b8b2b6]
    falsification_condition: >-
      MEASURED FIRST AND REPORTED BEFORE ANY MODEL COMPARISON. The empirical
      mean step count and the empirical sd of log2(steps) are measured at all
      four cells and reported against 1.253314 sqrt(ell) and 0.925164 bits
      BEFORE any alpha is compared to a forced value. If the empirical mean
      departs by more than 10 per cent at any cell, the forced alpha_rho values
      are recomputed from the MEASURED A_rho and the theory values are reported
      alongside as a separate line, never substituted for the measurement.
  - id: HEUR-BF-R2
    formal_statement: >-
      Over the sealed window n in [8, 16], each arm's charged cost is adequately
      modelled by C = A ell^a with a SINGLE constant a (no curvature term
      identifiable from four cells).
    random_model_justification: >-
      NONE THAT SURVIVES SCRUTINY FOR A GENERAL ARM, AND THIS IS THE RECORD'S
      WEAKEST LINK. It is provable for rho and BSGS, both exactly
      Theta(sqrt ell). It is FALSE IN PRINCIPLE for a subexponential
      index-calculus arm, which is not a power law at any window. The repair
      (the OLS slope) therefore rests on an assumption that the object it is
      meant to measure violates, and saying so is required rather than optional.
    supporting_results: []
    validation_experiment_ids: [EXP-ICEX-b8b2b6]
    falsification_condition: >-
      The sub-ladder refit spread |a_hat({8,10,12}) - a_hat({10,12,16})| exceeds
      the effect size being tested at any arm. The deliverable then becomes
      "this ladder cannot support a slope claim for this arm", stated with its
      exact boundary, and the crossover machinery of D3 is NOT applied to that
      arm.
  - id: HEUR-BF-R3
    formal_statement: >-
      The OLS coefficient vector from the pooled two-arm fit is approximately
      jointly normal with covariance sigma^2 (X'X)^{-1} at 24 points and 20
      residual degrees of freedom, so that the Fieller inversion has its nominal
      level.
    random_model_justification: >-
      Exact under i.i.d. normal log-cost errors; asymptotically valid otherwise.
      NOT ASSUMED SAFE: rho's step count is Rayleigh, so log-costs are skewed,
      and at 3 replicas per cell the central limit theorem has little to work
      with. This is the load-bearing distributional assumption of D3 alone; D1
      and D2 do not use it.
    supporting_results: []
    validation_experiment_ids: [EXP-ICEX-b8b2b6]
    falsification_condition: >-
      The Monte Carlo bounded-set fraction under b3 = 0 falls outside the
      binomial band [0.0457, 0.0543] at 10000 replications with NORMAL errors
      (implementation defect, halts the line), or the same fraction with errors
      resampled from MEASURED rho log-residuals differs from the normal-error
      fraction by more than 0.02 (a finding about the ladder's noise structure,
      reported as such rather than as a defect of the estimator).

