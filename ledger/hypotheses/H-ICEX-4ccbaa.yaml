  predictions:
  - metric: >-
      G1 (ZERO COMPUTE) - unit-covariance delta: alpha on one rho campaign
      recorded in nanoseconds minus alpha on the identical campaign recorded in
      seconds, at n = 12
    direction: different
    minimum_effect: >-
      'EXACTLY +2.4914 = log2(10^9)/12, to floating-point tolerance 1e-9. If the
      measured difference is 0, alpha is unit-invariant, the identity (*) is
      wrong, and D1 is falsified outright at zero cost.'
  - metric: >-
      G2 - alpha_rho(n) under the frozen estimator, group-operation coordinate,
      matched rho control, at n = 8/10/12/16, reported under BOTH live A_rho
      conventions
    direction: different
    minimum_effect: >-
      'Under A_rho = 0.886227: 0.47822 / 0.48257 / 0.48548 / 0.48911, all four
      CIs entirely BELOW 1/2. Under A_rho = 1.253314: 0.54072 / 0.53257 /
      0.52715 / 0.52036, all four entirely ABOVE. Tolerance: the measured value
      must lie within the replica CI of the closed form evaluated at the
      MEASURED A_rho. If any CI contains 1/2 at k >= 16 attempts per replica,
      the "null fails" claim is refuted at that cell and is reported as refuted.'
  - metric: >-
      G3 - alpha_bsgs(n) - alpha_rho(n), same cells, same units, same coordinate
    direction: higher
    minimum_effect: >-
      '+0.03240 / +0.02592 / +0.02160 / +0.01620 at n = 8/10/12/16, computed as
      log2(A_bsgs/A_rho)/n from the two arms'' own MEASURED mean operation
      counts. THE FORM IS THE PREDICTION: the gap must be inversely proportional
      to n with R^2 >= 0.95. A gap independent of n, or a gap of zero, refutes
      the constant-contamination mechanism.'
  - metric: >-
      G4 - regression of (alpha_arm(n) - 1/2) on 1/n, four points per arm, for
      arms in {rho, rho-negation, bsgs}: R^2 and fitted intercept
    direction: higher
    minimum_effect: >-
      'R^2 >= 0.95 and |intercept| <= 0.01 for every arm. This is the structural
      tell of inventor-protocol section 3: contamination that decays exactly as
      1/n is the signature of a constant term, and a genuine exponent estimator
      would instead return the same value at every cell. A flat alpha(n) refutes
      the mechanism; an intercept significantly away from 0 means the arm was
      mis-modelled and the arm, not the estimator, is at fault.'
  - metric: >-
      G5 (POSITIVE CONTROL, MUST FIRE) - slope-estimator recovery on the
      synthetic oracle over the grid a_true in {0.40,0.45,0.50,0.55,0.60} x
      A in {1, 10^3, 10^9}, on the protocol's own ladder shape
    direction: lower
    minimum_effect: >-
      '|a_hat - a_true| < 0.01 in ALL 15 cells, INDEPENDENT of A. Simultaneously
      the frozen estimator must return a_true + log2(A)/n, hence exceed 1/2 at
      every cell for every a_true when A = 10^9 (minimum excess
      log2(10^9)/16 - 0.10 = 1.769). Both halves are exact arithmetic. IF THE
