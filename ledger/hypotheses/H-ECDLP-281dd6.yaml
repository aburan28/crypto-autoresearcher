# =============================================================================
# H-ECDLP-281dd6 -- SNFS-G2 specified: over a Mersenne prime p = 2^c - 1 the
# four smallest embedding degrees of a prime-order subgroup are exact
# Cunningham / Aurifeuillean conditions on l (k = 1 iff ord_l(2) | c - 1;
# k = 2 impossible since p + 1 = 2^c; k = 3 iff l | Phi_6(2^c); k = 4 iff
# l | 2^(2c-1) - 2^c + 1), and nothing beyond k = 4 is cyclotomic in 2; the
# multiplicative side (p + 1 = 2^c, a degree-5 SNFS polynomial for F_p^* at
# p = 2^521 - 1) is the mirror image. CORRECTION at design time: the source
# proposal IDEA-20261009-64a1c0 stated the identity k = ord_l(2)/gcd(ord_l(2), c),
# which is FALSE (p = 2^c - 1 is not 2^c modulo l); the design-session smoke
# test's identity control caught it and the proposal is corrected on its
# unmerged branch. Derived from IDEA-20261009-64a1c0 (addendum G). Status
# proposed with specified_by; nothing here asserts an outcome. Public
# parameters only; no secret scalar; no key is attacked.
# =============================================================================
hypothesis:
  id: H-ECDLP-281dd6
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  derived_from_idea: IDEA-20261009-64a1c0
  added: '2026-10-09'
  statement: >-
    Let p = 2^c - 1 be a Mersenne prime with c prime and let l be an odd prime
    dividing #E(F_p) for a curve E/F_p, with embedding degree k(l) = ord_l(p).
    (Exact) k = 1 iff ord_l(2) divides c - 1 (since p - 1 = 2 (2^(c-1) - 1));
    k = 2 never occurs (since p + 1 = 2^c); k = 3 iff l divides Phi_3(p) =
    2^(2c) - 2^c + 1 = Phi_6(2^c), i.e. ord_l(2^c) = 6; k = 4 iff l divides
    Phi_4(p)/2 = 2^(2c-1) - 2^c + 1, the Aurifeuillean factor of 2^(4c-2) + 1,
    so ord_l(2) divides 8c - 4. For k >= 5, Phi_k(2^c - 1) is not a product of
    cyclotomic values at 2 and no such condition exists. (Census, heuristic)
    Apart from these exact exclusions, the distribution of k over seeded
    random curves over Mersenne primes is the Balasubramanian-Koblitz
    distribution observed over matched random primes: the cofactor statistic
    t = (l-1)/k and the small-k fraction show no arm difference under
    pre-registered tests, and the number of curve orders whose large prime
    factor l has ord_l(2) <= 10^4 is at most the index-heuristic prediction
    n_curves * 10^4 / l_mean up to a constant factor 3. (Deployed) For P-521
    (p = 2^521 - 1), P-192, P-224 and P-256, ord_l(p) > 10^6 by direct
    exponentiation, and for P-521 additionally k is not in {1, 2, 3, 4} by
    the four exact conditions evaluated modulo l. (Multiplicative side, modeled)
    At p = 2^521 - 1 the special polynomial x^5 - 16 (root m = 2^105,
    16 p = m^5 - 16) has mean log2 algebraic norm over a frozen (a, b) box
    of side B smaller than the base-m expansion 2^101 x^4 - 1 at the same
    root by 97 - log2 B +/- 3 bits (derived: 5 log2 B + 4 against
    101 + 4 log2 B), i.e. about 77 bits at B = 2^20, and p + 1 = 2^c is
    fully smooth.
  mechanism: >-
    The embedding degree is the least k with l | Phi_k(p). With p = 2^c - 1:
    Phi_1(p) = p - 1 = 2 (2^(c-1) - 1), Phi_2(p) = p + 1 = 2^c,
    Phi_3(p) = p^2 + p + 1 = 2^(2c) - 2^c + 1 = Phi_6(2^c), and
    Phi_4(p) = p^2 + 1 = 2 (2^(2c-1) - 2^c + 1) with
    (2^(2c-1) - 2^c + 1)(2^(2c-1) + 2^c + 1) = 2^(4c-2) + 1 (Aurifeuille).
    So k = 1, 3, 4 are divisibility conditions on Cunningham-type numbers
    2^(c-1) - 1, Phi_6(2^c) and the Aurifeuillean L-factor of 2^(4c-2) + 1,
    and k = 2 is impossible for odd l. Phi_6(p) = 2^(2c) - 3 2^c + 3 already
    has no such form, and neither does Phi_k(p) for k >= 5 in general; the
    naive identity k = ord_l(2)/gcd(ord_l(2), c) is false because p is
    2^c - 1, not 2^c, modulo l. Nothing in this touches E beyond its group
    order: the curve side is slightly more protected against pairing transfer
    than over a random prime (in exactly the k = 2 sense) while the
    multiplicative groups F_p^* and F_{p^2}^* are more exposed (p + 1 smooth;
    16 p = (2^105)^5 - 16 gives a degree-5 small-coefficient polynomial for
    F_p^* at p = 2^521 - 1). This is the sharpest exact form of H-ECDLP-bd1572
    limb L1 available for Mersenne primes.
  assumptions:
    - >-
      Toy Mersenne primes 2^13 - 1, 2^17 - 1, 2^19 - 1, 2^31 - 1 model the
      exact conditions faithfully (they hold for every c) and the census
      distribution adequately for the arm comparison; absolute cost is not
      extrapolated.
    - >-
      The Balasubramanian-Koblitz random model is the right null for the
      embedding degree of a random prime-order subgroup (KN-LIT-086).
    - >-
      The index heuristic Pr[ord_l(2) <= D] ~ c0 * D / l for a random prime
      l of size l (Artin-type index distribution, recalled) is used only to
      size the census prediction, with the constant flagged.
    - >-
      Deployed-curve constants (p, l, base point) are public; a constant that
      fails the order check is reported as a constant error and excluded,
      never corrected in place.
  proof_search_map:
    bottleneck: >-
      None for the exact conditions (they are elementary); for the census the
      open quantity is whether the form of p shifts the distribution of k,
      which H-ECDLP-bd1572 L1 already predicts it does not.
    baseline_embedding:
      parameter_slice: >-
        EXP-ECDLP-6dacdb part A at 16-bit special primes m^d - c; this record
        is the Mersenne specialisation with the exact identity added.
      reproduction_check: >-
        For every Mersenne census row the four exact conditions (k = 1 iff
        ord_l(2) | c - 1; k != 2; k = 3 iff ord_l(2^c) = 6; k = 4 iff
        l | 2^(2c-1) - 2^c + 1) are checked; a single violation invalidates
        the run (it would be an arithmetic bug, not a finding).
    observation_collision:
      observable: cofactor statistic t = (l-1)/k and the small-k fraction per arm
      distinct_preimage_search: >-
        matched random primes of the same bit length scored by the same code;
        the supersingular curve y^2 = x^3 + x over p = 3 mod 4 must report
        k = 2 (the nearby object the transfer reaches) on the random arm,
        while on the Mersenne arm its order p + 1 = 2^c is a 2-group with no
        odd l at all.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the Mersenne form p = 2^c - 1, under which Phi_1, Phi_2, Phi_3, Phi_4 at p are Cunningham-type numbers in 2
        predicted_gain: none in exponent; exact conditions for k in {1, 2, 3, 4} and a census statistic
    quantifier_order: >-
      For all Mersenne primes p = 2^c - 1 with c prime and all odd primes l |
      #E(F_p): the four conditions for k in {1, 2, 3, 4} hold (exact). For the
      tested toy primes and seeded curves: there exists no pre-registered arm
      statistic that differs beyond its tolerance.
    method_ceiling:
      strongest_certifiable_claim: >-
        four exact conditions verified on every row, a toy census with no arm
        difference, exact lower bounds on ord_l(p) for public curves, and a
        modeled norm-size comparison for F_p^* at 2^521 - 1; no asymptotic
        statement and no key-size statement.
      nearby_object_control: supersingular y^2 = x^3 + x (k = 2) on the random arm
    proof_obligations:
      - claim: the four exact conditions hold on every Mersenne census row
        responsibility: correctness
      - claim: arm comparison uses identical code paths, seeds and exclusions
        responsibility: scope
      - claim: deployed lower bounds are reported as bounds, never as exact k
        responsibility: strictness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For seeded random curves over a Mersenne prime p, the distribution of
        the cofactor t = (l-1)/k of the largest prime factor l of #E equals the
        distribution over matched random primes of the same bit length, except
        for the exact conditions on k in {1, 2, 3, 4}.
      random_model_justification: >-
        The form of p enters E(F_p) only through p itself; the embedding
        degree is determined by l and p, and l is the large prime factor of a
        Hasse-interval integer with no known bias from the form of p
        (Balasubramanian-Koblitz, KN-LIT-086).
      supporting_results:
        - KN-LIT-086 (improbability of small embedding degree for random curves)
        - H-ECDLP-bd1572 limb L1 and EXP-ECDLP-6dacdb (same statistic at m^d - c primes)
      validation_experiment_ids: [EXP-ECDLP-8cc60d]
      falsification_condition: >-
        A pre-registered arm test (permutation test on mean log2 t,
        two-proportion test on the k <= 20 fraction, two-sample KS on log2 t,
        all at alpha = 0.01) rejecting with the controls passing and the
        exact conditions verified on every row.
    - id: HEUR-002
      formal_statement: >-
        For a random prime l of size L, Pr[ord_l(2) <= D] <= c0 * D / L with
        c0 <= 3, so the expected number of census curves whose l has
        ord_l(2) <= 10^4 is at most 3 * n_curves * 10^4 / L.
      random_model_justification: >-
        ord_l(2) = (l-1)/t with the index t distributed like a random divisor
        weighted by 1/t^2 (Artin-Hooley-type heuristic, recalled); the primes
        with small ord_l(2) are exactly the Cunningham factors of 2^d - 1 for
        small d, which are sparse at size L.
      supporting_results:
        - Cunningham tables of 2^n - 1 factors (Brent-Montgomery-te Riele, recalled)
      validation_experiment_ids: [EXP-ECDLP-8cc60d]
      falsification_condition: >-
        An observed count of curves with ord_l(2) <= 10^4 exceeding the
        Poisson 99.9 % quantile of the predicted mean at any toy prime.
  structural_ingredients:
    - description: MOV reduction and the embedding-degree condition l | q^k - 1.
      citation: KN-LIT-084
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-084.md
      role: the transfer whose exposure the exact conditions govern
    - description: Improbability of small embedding degree for random prime-order curves.
      citation: KN-LIT-086
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-086.md
      role: null model for the census (HEUR-001)
    - description: Transfer attacks apply only to special curves (known-results row).
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
      role: frontier row this record sharpens for Mersenne primes
    - description: Kilobit SNFS factorization of the Mersenne number 2^1039 - 1.
      citation: KN-LIT-2090
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-2090.md
      role: the Cunningham-project SNFS whose polynomial choice the multiplicative-side part mirrors
    - description: Fast arithmetic modulo 2^521 - 1 for P-521.
      citation: KN-LIT-3833
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-3833.md
      role: the Mersenne form as a field-arithmetic fact; P-521 is the deployed Mersenne case
    - description: Cunningham tables of factors of 2^n +/- 1.
      citation: Brent, Montgomery, te Riele, Factorizations of a^n +/- 1 (Cunningham tables)
      provenance: recalled
      verified_by: null
      role: a pointer, not support, for the small-ord_l(2) prime census (AGENTS.md rule 9)
    - description: Generalized Mersenne primes p = f(2^k) and their fast reduction.
      citation: Solinas 1999, Generalized Mersenne numbers (CORR 99-39)
      provenance: recalled
      verified_by: null
      role: pointer for the P-192/P-224/P-256 forms; never support
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: exact_condition_violations_count
      direction: lower
      minimum_effect: exactly 0 over every Mersenne census row (four conditions)
    - metric: k_equals_2_count_mersenne_arm
      direction: lower
      minimum_effect: exactly 0 for odd l on every Mersenne prime; the random arm's k = 2 count is reported
    - metric: arm_difference_tests_rejections
      direction: lower
      minimum_effect: 0 rejections at alpha = 0.01 among the three pre-registered tests, per seed
    - metric: small_ord_l_2_count_vs_prediction
      direction: lower
      minimum_effect: observed count <= Poisson 99.9 % quantile of 3 * n * 10^4 / L at every prime
    - metric: deployed_ord_l_p_lower_bound
      direction: higher
      minimum_effect: "> 10^6 for P-521, P-192, P-224, P-256; k not in {1, 2, 3, 4} for P-521 by the exact conditions"
    - metric: norm_size_gap_bits_special_minus_basem_at_2_521_minus_1
      direction: lower
      minimum_effect: "-(97 - log2 B) +/- 3 bits at B in {2^20, 2^30, 2^40} (special smaller); modeled, not sieved"
  test_boundary:
    instances:
      - toy Mersenne primes 2^13 - 1, 2^17 - 1, 2^19 - 1, 2^31 - 1 with one matched random prime each per seed
      - 64 seeded random curves per prime per seed; anomalous curves excluded and counted
      - public parameters of P-521, P-192, P-224, P-256 (no secret scalar)
    parameters:
      claim_tier: toy
      point_counting: exact Legendre-sum count for p < 2^20; baby-step giant-step order in the Hasse interval for 2^31 - 1, cross-checked against the exact count at the three smaller primes
      ord_computation: exact, from the factorisation of l - 1 by trial division (l < 2^32)
      deployed_bound: direct exponentiation to 10^6 steps
      norm_box: "|a|, |b| <= 2^20, 10^5 seeded samples"
    implementation: >-
      experiments/EXP-ECDLP-8cc60d/implementation/run.py, pure Python 3
      standard library; primeset.py is the byte-identical battery copy.
    budget:
      enforcement: advisory
      total_cpu_hours: 3
      maximum_memory_gb: 1
  falsification_conditions:
    - "Exact conditions: any Mersenne census row violating one of the four conditions, including any k = 2 with odd l (an arithmetic error, which invalidates the run rather than refuting a theorem)."
    - "HEUR-001: a pre-registered arm test rejects at alpha = 0.01 with CTRL-COUNT, CTRL-EXACT and the supersingular control passing."
    - "HEUR-002: the small-ord_l(2) count exceeds the Poisson 99.9 % quantile of its prediction at any toy prime."
    - "Deployed: ord_l(p) <= 10^6 for any of the four public curves (then the k* question of EXP-ECDLP-6dacdb part B is live for that curve)."
    - "Multiplicative side: the measured norm gap departs from 97 - log2 B by more than 3 bits at any box (then the modeled comparison is wrong and is re-derived before any use)."
  interpretation_limits:
    - The four exact conditions are theorems; the experiment is a finite receipt that the code implements them correctly, and cannot be promoted beyond that.
    - Toy census only; no crypto-scale cost is measured or extrapolated.
    - "'More protected against transfer' means only: k = 2 is excluded and k in {1, 3, 4} requires a Cunningham or Aurifeuillean factor; k >= 5 is unconstrained; it is not a security claim about any curve."
    - Deployed lower bounds are bounds from direct exponentiation, never the exact embedding degree.
    - The norm-size comparison is modeled arithmetic over a box, not a sieve, and concerns F_p^*, never E or any key.
    - No statement that any parameter set is trapdoored is made or implied (GOAL-SNFS-001 scope rule).
  status: proposed
  proposed_by: user
  specified_by: coordinator-design-session-20261009-G
