hypothesis:
  id: H-ECDLP-a0d5d6
  question_id: RQ-ECDLP-001
  title: >-
    Column-chunked dense elimination bounds the working set but not the
    accumulator, so a rank-times-columns pivot carrier is tens of gigabytes at a
    768212-column cell no matter how the columns are chunked; a black-box Krylov
    rank costs nonzeros instead, and the whole question turns on one unmeasured
    density that can be read off the generator with no matrix allocated
  statement: >-
    Source proposal IDEA-20260829-cb2a65 (RQ-ECDLP-001, class tooling).
    (A) THE DIAGNOSIS. The exact GF(2) Macaulay rank instrument sweeps columns
    in chunks while maintaining a persistent pivot carrier across chunks, and
    its own audit asserts that the carrier pivot count equals the accumulated
    rank. A carrier holding r pivot rows over an n-column space costs r times n
    bits regardless of chunk width, so column chunking bounds the WORKING SET
    but not the ACCUMULATOR. At n = 768212 columns and rank of order 7 times
    10^5 the carrier is about 6.7 times 10^10 bytes, i.e. about 67 GB. An 8 GiB
    contract and a 12 GiB host ceiling are two orders of magnitude away and no
    chunk-width tuning closes that gap.
    (B) THE PROPOSED SHAPE CHANGE. Compute rank as a black box: never form or
    store an echelon basis, access the matrix only through matrix-vector
    products. Memory becomes proportional to the nonzero count plus a handful of
    vectors, and time becomes proportional to the number of columns times the
    nonzero count. At the same cell the dense instrument costs about
    4.6 times 10^17 bit operations and about 67 GB, while the black-box route
    costs about 2.3 times 10^13 bit operations and about 1.2 times 10^8 bytes,
    IF the nonzero count is what the sparsity argument predicts.
    (C) THE DECISION QUANTITY, RESTATED IN THE RIGHT UNIT. The source proposal
    pre-registers a three-way rule on the dimensionless density d/n, with
    viability at d/n at most 0.001 and death at d/n at least 0.05. AT
    n = 768212 THOSE THRESHOLDS ARE 768 AND 38410 NONZEROS PER ROW, while the
    proposal's own predicted density is about 30 nonzeros per row, i.e.
    d/n = 3.9 times 10^-5. The predicted value is 25 times below the viability
    threshold and 1000 times below the kill threshold, and the kill arm cannot
    fire on the stated mechanism at all: a Macaulay row is one generator times
    one monomial, Boolean-reduced, so its support is bounded by the generator's
    term count, which is in the tens, not the tens of thousands. THE BAND IS
    THEREFORE REPLACED, NOT LOOSENED, BY THE QUANTITY THE DECISION ACTUALLY
    TURNS ON: whether the black-box representation fits the contract in BYTES.
    With R rows, d nonzeros per row and 4-byte column indices, the storage is
    4 R d bytes plus O(n) words, so an 8 GiB contract admits
    d at most 2150 at R = 10^6, and the rule is stated on that comparison with R
    MEASURED rather than assumed.
    (D) BOTH OUTCOMES ARE DELIVERABLES. Viable: the memory wall is a tooling
    artifact with a named replacement. Not viable: the wall is a genuine density
    property of the boolean Semaev Macaulay matrices at the tested degree, which
    is a measured structural fact nobody currently has, and it retires the
    black-box route by argument rather than by fatigue.
  mechanism: >-
    Dense elimination on an n-column space costs order rank times n bits of
    accumulator and order rank squared times n bit operations, so at n about
    7.7 times 10^5 the instrument is blocked on BOTH axes and a larger machine
    would not rescue it. Black-box Krylov rank changes both exponents at once:
    memory becomes order nonzeros, time becomes order columns times nonzeros,
    and the rank is read from the degree of a minimal polynomial of a
    preconditioned operator rather than from an echelon basis. Over GF(2) the
    preconditioner analysis is weakest, and the standard remedy is a blocked
    variant whose block width coincides with the natural bit-packing width, so
    the blocking that raises the success probability is free in memory. The
    success probability is treated as a MEASURED quantity via repeated trials
    with fresh preconditioners, never as a quoted bound.
  assumptions:
    - >-
      THE LOAD-BEARING ASSUMPTION IS THE UNMEASURED DENSITY, AND THE WHOLE
      DESIGN EXISTS TO MEASURE IT FIRST AND KILL THE RECORD IF IT IS FALSE.
    - >-
      The existing system generator can be streamed row by row without
      materialising the matrix. If it cannot, a streaming adapter is the first
      implementation task and its cost is charged here rather than hidden.
    - >-
      Rank over GF(2) of the Macaulay matrix is the quantity the consuming lane
      needs. That is taken from the consuming goal's own admissibility rule and
      is not reopened here.
    - >-
      THE FIGURES ANCHORING THE DIAGNOSIS AT THE FAILED CELL ARE UNVERIFIED BY
      THIS PROGRAM. The source proposal states that the n = 15 attempt's column
      count, peak resident memory and exhaustion outcome live on an unmerged
      branch and were NOT read by its authoring session. THIS COORDINATOR
      SESSION DID NOT READ THEM EITHER and asserts none of them. They are
      carried as REPORTED and are discharged by a blocking verification stage.
  proof_search_map:
    bottleneck: >-
      The accumulator in exact GF(2) rank computation, namely storing rank times
      n bits of pivot rows. Removing that single storage requirement is the
      whole of the proposed change; everything else in the pipeline is
      untouched.
    baseline_embedding:
      parameter_slice: >-
        The n = 12 cell that the current instrument COMPLETED cleanly, whose
        committed values are a restricted null rank of 156520 and a Semaev rank
        of 138573.
      reproduction_check: >-
        Exact integer equality on both ranks at that cell, plus exact equality
        with the closed-form Macaulay ranks of a calibration ladder where the
        answer is derived rather than computed. Two independent kinds of ground
        truth, one committed measurement and one closed form. Any mismatch on
        either halts the line and NOTHING is reported about the larger cell.
    observation_collision:
      observable: A single integer, the rank.
      distinct_preimage_search: >-
        TRIVIALLY AND MASSIVELY COLLIDING, and that is why an integer agreement
        at one cell is weak evidence of kernel correctness. The separation comes
        from reproducing TWO different committed integers, from a closed-form
        ladder whose predicted rank VARIES cell by cell, and from a deletion
        mutation. An implementation validated on one rank value has not been
        validated.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the explicit row-echelon representation of the row space by a
          Krylov representation in which rank is the degree of a minimal
          polynomial of a preconditioned operator, with encoding, completeness,
          soundness, transfer and cost-loss obligations kept separate.
        predicted_gain: >-
          Memory from order rank times columns to order nonzeros plus columns;
          time from order rank squared times columns to order columns times
          nonzeros. Both are PREDICTIONS, both are required metrics, and both
          can fail.
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure, peak resident memory as an
          explicit function of rows, columns, nonzeros per row and block size,
          charged only over proved-disjoint allocation blocks.
        predicted_gain: >-
          Converts the feasibility of the next cell from an experiment into an
          arithmetic question answered before any budget is spent.
    quantifier_order: >-
      CLAIMED: FOR ALL cells in the ladder, IF the generated matrix's nonzero
      count satisfies the byte-denominated contract test, THEN THERE EXISTS a
      black-box rank procedure whose peak resident memory is bounded by the
      fitted formula and whose output equals the exact rank with probability at
      least 1 minus a MEASURED epsilon. NOT CLAIMED, and this is where black-box
      methods usually go wrong: that the procedure is exact deterministically.
      It is Monte Carlo in its preconditioner, a returned rank is a lower bound
      correct with high probability, and repeated trials raise but never
      eliminate the doubt.
    method_ceiling:
      strongest_certifiable_claim: >-
        For matrices of the measured density, exact GF(2) rank is obtainable
        within the contract with probability at least 1 minus a measured epsilon
        per trial. It can NEVER certify a rank deterministically, never certify
        anything about denser matrices, and never produce mathematical evidence
        about a degree of regularity by itself.
      nearby_object_control: >-
        A DENSE matrix of the same dimensions with a planted known rank. The
        method must be visibly WORSE on it, in both time and memory, while still
        returning the correct rank. A kernel that looks good on the dense
        control is not exploiting sparsity and its sparse-case numbers are
        meaningless.
    proof_obligations:
      - claim: The measured nonzeros per row of the target system.
        responsibility: feasibility
      - claim: Peak resident memory is bounded by the fitted formula on every
          calibration cell.
        responsibility: memory
      - claim: Rank equals 156520 and 138573 exactly at the committed cell.
        responsibility: baseline
      - claim: Rank equals the closed form on a ladder where it varies cell by cell.
        responsibility: correctness
      - claim: A one-column deletion lowers the reported rank by exactly 1.
        responsibility: soundness
      - claim: Measured failure probability over at least 30 fresh preconditioners.
        responsibility: success_probability
      - claim: Every reported rank is labelled probabilistic with its trial count.
        responsibility: interface
      - claim: The dense nearby-object control shows the method is worse there.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        The GF(2) Macaulay matrices generated by the boolean chained pipeline
        have a nonzero count per row bounded by the term count of the generating
        polynomials, hence independent of the number of columns, so the total
        nonzero count is of order rows times a constant rather than rows times
        columns.
      random_model_justification: >-
        The rigorous ingredient is structural and elementary: a Macaulay row is
        one input polynomial multiplied by one monomial, so its support size
        equals that input's support size before reduction, and Boolean reduction
        can only merge terms, never create them. The classical statement
        imitated is the standard sparsity assumption underlying sparse
        polynomial-system linear algebra, namely that Macaulay matrices inherit
        the sparsity of their generators. THE GAP: the generating polynomials
        may themselves be dense in the relevant variables, in which case the
        assumption fails outright, and that is exactly what the first stage
        measures.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-6386da]
      falsification_condition: >-
        The measured per-row nonzero count exceeds the independently computed
        term count of the generating polynomials, which would be an
        implementation defect; or the byte-denominated contract test fails,
        which retires the route with a measured number attached.
    - id: HEUR-002
      formal_statement: >-
        For the preconditioned matrices arising here, the blocked black-box rank
        procedure over GF(2) returns the exact rank with probability at least
        1 minus epsilon per trial, with epsilon small enough that a small
        constant number of trials makes the maximum over trials correct with
        high probability.
      random_model_justification: >-
        THE RIGOROUS INGREDIENT IS DELIBERATELY NOT QUOTED. The relevant
        small-field preconditioner analysis lives in literature no agent in this
        program has opened, and transcribing a probability bound from memory
        would be a fabrication under AGENTS.md rule 9. The assumption is stated
        as purely empirical and its only support in this record is measurement.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-6386da]
      falsification_condition: >-
        The measured failure rate exceeds 10 percent per trial on any cell with
        an independently known rank, in which case the method is reported
        unusable for that cell class rather than rescued by more trials.
  structural_ingredients:
    - description: >-
        The committed n = 12 cell values, a restricted null rank of 156520 and a
        genuine deficit of 17947 equal to 156520 minus 138573, admitted and
        red-team reviewed.
      citation: EV-DREG-008
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read the observations of
        ledger/evidence/EV-DREG-008.yaml and confirmed that
        rank_null_restricted equals 156520 and that deficit_genuine equals 17947
        stated as 156520 minus 138573, so the Semaev rank 138573 is the
        committed complement
    - description: >-
        The failed larger cell's column count, peak resident memory and
        exhaustion outcome, reported to live on an unmerged branch.
      citation: RUN-DREG-001-MEASURE-N15-NULL-2026
      provenance: recalled
      verified_by: null
      role: >-
        REPORTED, NOT VERIFIED, AND LABELLED `recalled` FOR THAT REASON. This is
        an internal run identifier, but `provenance: internal` would assert that
        an agent in this program read the record, and none has: the source
        proposal's own citation says its authoring session did not read the
        artifacts, and THIS COORDINATOR SESSION DID NOT READ THEM EITHER. The
        figures are said to live on an unmerged branch this worktree does not
        carry, so their absence here is a branch-visibility fact and NOT a claim
        that the run record does not exist. No arithmetic in this hypothesis
        depends on their exact values, and a blocking verification stage
        discharges them, and may promote this entry to `internal` in a new
        record, before any budget is spent.
    - description: >-
        Black-box Krylov rank over finite fields with random preconditioners,
        the small-field strengthening, and the blocked variant.
      citation: black-box sparse linear algebra over finite fields
      provenance: recalled
      verified_by: null
      role: >-
        Pointer only. NONE of these sources has been opened by any agent in this
        program, no theorem statement or probability bound is transcribed, and
        no bound from them is used as support anywhere: the success probability
        is a measured quantity.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: measured_nonzeros_per_row
      direction: different
      minimum_effect: >-
        Reported as mean, median, maximum and full histogram, measured by
        streaming with no matrix allocated. THE DECISION IS TAKEN IN BYTES, not
        in the dimensionless ratio: with 4-byte column indices the black-box
        storage is 4 times rows times nonzeros-per-row bytes plus O(columns)
        words, and the route is admissible iff that fits the declared contract.
        At a million rows and an 8 GiB contract the admissible ceiling is about
        2150 nonzeros per row.
    - metric: peak_memory_of_the_streaming_count
      direction: lower
      minimum_effect: >-
        Predicted under 1 GiB, i.e. at least an order of magnitude below the
        reported failure. If the count itself exhausts memory, the generator
        cannot be streamed and that pipeline defect is a first-order finding
        that must be fixed before any rank method is discussed.
    - metric: exact_rank_at_the_committed_cell
      direction: different
      minimum_effect: >-
        FORCED EXACT: 156520 and 138573. Off by any amount in any direction
        halts the line. This is the single hardest gate in the design.
    - metric: rank_on_the_closed_form_ladder
      direction: different
      minimum_effect: >-
        FORCED EXACT on every cell of a ladder whose predicted rank VARIES cell
        by cell, so agreement is not a coincidence of one number. A kernel
        validated only where the answer is constant is not validated.
    - metric: one_column_deletion_mutation
      direction: lower
      minimum_effect: >-
        REQUIRED TO DROP THE RANK BY EXACTLY 1. A planted defect of known size
        with a forced magnitude, applied to the calibration cells this record
        proposes and to nothing else.
    - metric: measured_peak_memory_versus_the_fitted_formula
      direction: different
      minimum_effect: >-
        The formula must predict the measured peak within 25 percent across a
        calibration set spanning at least a 100-fold range of nonzeros, and must
        never UNDERPREDICT. A formula that fits at one size predicts nothing at
        another and the larger-cell feasibility claim is withdrawn.
    - metric: measured_failure_rate_over_fresh_preconditioners
      direction: different
      minimum_effect: >-
        At least 30 independent draws, reported with an exact binomial interval
        and never as a quoted theoretical bound. Above 10 percent the method is
        unusable under an exact-rank admissibility rule and the record says so
        rather than proposing to relax the rule.
    - metric: dense_nearby_object_control
      direction: higher
      minimum_effect: >-
        The black-box kernel must be MEASURABLY WORSE on a dense matrix of the
        same dimensions with planted rank, in both time and memory, while still
        returning the correct rank. If it looks good there it is not exploiting
        sparsity and every sparse number is suspect.
  test_boundary:
    instances:
      - the committed n = 12 cell with two known integers
      - a closed-form calibration ladder whose predicted rank varies cell by cell
      - a dense matrix of matched dimensions with planted rank
      - a sparse matrix with a large nilpotent part
    parameters:
      block_width: the natural bit-packing width
      preconditioner_draws: at least 30 per cell
      calibration_nonzero_range: at least 100-fold
    implementation: >-
      Exact GF(2) arithmetic, streaming density count with no matrix allocation,
      operation counts reported alongside wall clock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 8
      maximum_runs: 20
  falsification_conditions:
    - >-
      The byte-denominated contract test fails, i.e. 4 times rows times
      nonzeros-per-row exceeds the contract. The black-box route is retired for
      that cell class and the measured density is filed as an obstruction with
      value, units, runs and scope, with forward guidance naming what remains.
    - >-
      The generator cannot be streamed without materialising the matrix. Stage 0
      is impossible and the pipeline defect is the finding.
    - >-
      The carrier is not rank times columns bits. The memory diagnosis is wrong
      and this record must be rewritten around the real cause before any kernel
      is built.
    - >-
      The verification stage finds the reported figures materially different.
      The memory arithmetic is redone against the real numbers before anything
      else proceeds; the citation is superseded by reference and never edited.
    - >-
      The new kernel fails to reproduce 156520 or 138573 exactly. It is not
      computing rank and nothing about the larger cell may be said.
    - >-
      The deletion mutation does not lower the rank by exactly 1. The kernel is
      not tracking column deletions and its ranks are not trustworthy.
    - >-
      The measured failure rate exceeds 10 percent per trial.
    - >-
      The dense control shows no disadvantage. The kernel is not exploiting
      sparsity and its sparse-case numbers mean nothing.
  interpretation_limits:
    - >-
      THIS IS TOOLING. It produces no mathematical result, no evidence about any
      degree of regularity, and no ECDLP claim of any kind. RANK OF A GF(2)
      MATRIX IS CURVE-FREE BY CONSTRUCTION, so the curve-free-null requirement
      is discharged as a proof rather than an arm: no output of this instrument
      can be misread as a statement about elliptic curves.
    - >-
      THE FAILURE IT ADDRESSES IS AN INFRASTRUCTURE STOP under AGENTS.md rule 5
      and remains one whatever this record finds. It is never negative
      mathematical evidence.
    - >-
      IT AUTHORISES NOTHING. Running any ladder cell of the consuming goal
      requires that goal's own Coordinator approval, which this record neither
      has nor requests.
    - >-
      A probabilistic rank is a weaker claim tier than an exact one and every
      number must be labelled as such. THE CONSUMING LANE'S ADMISSIBILITY RULE
      MAY NOT ACCEPT IT AT ALL, which is a contract-level risk flagged rather
      than assumed away, and must be settled by that lane's owner BEFORE any of
      its cells are run.
    - >-
      THE ANCHORING FIGURES ARE UNVERIFIED BY THIS PROGRAM. Neither the source's
      authoring session nor this coordinator session read them. They are carried
      as reported, a blocking stage discharges them, and nothing here may be
      quoted as though they had been checked.
    - >-
      No novelty is claimed for black-box rank, which is textbook. What is
      proposed is its application and calibration here, and the external sources
      were surfaced by search and not read.
  status: proposed
  proposed_by: idea-generator
