    - EV-DREG-004
    - EV-IC-002
    - EV-STR-003
    - EV-DS-004
    - KN-FIND-029
    - KN-OPEN-002
  falsification_conditions:
    - >-
      F1 - the two-number gate misses either committed value by more than 5
      percent. The candidate closed form is WRONG; the ladder is not authorized on
      it.
    - >-
      F2 - the ladder error exceeds the stated bounds. The form describes n = 12
      and not the phenomenon; report as a fitted description, not a mechanism.
    - >-
      F3 - the saturation-shape prediction is wrong at any cell. The model does
      not distinguish the two regimes and cannot repair d_reg predictions.
    - >-
      F4 - the n = 9 known-shape control does not reproduce. The model contradicts
      a committed diagnosis and the contradiction is routed to a correction
      record.
    - >-
      F5 - no candidate passes. THE NEGATIVE DISPOSITION IS THE DELIVERABLE,
      stated with its exact boundary in fa9839-consumable form.
    - >-
      F6 - the seed-to-seed spread is comparable to the model error. HEUR-001
      fails and the model is fitting noise.
  interpretation_limits:
    - >-
      THIS IS A MODEL REPAIR, NOT AN ATTACK. A validated closed form makes d_reg
      predictions usable; it does not make any system easier to solve and moves no
      exponent. sota_delta is zero on every attack axis.
    - >-
      Claim tier TOY. KN-OPEN-002 is NOT closed by a repaired model at n <= 13; a
      growth law needs the growth range, which this ladder does not reach.
    - >-
      Nothing here supports or weakens H-SIG-001, H-DREG-001, or any hypothesis
      about the Semaev cascade. It is about the NULL, which is the INSTRUMENT, and
      instrument findings are not mechanism findings - EV-STR-003 and EV-DS-004
      are this programme's own precedents for keeping that distinction.
    - >-
      BOOLEAN AND PRIME-FIELD SYSTEMS ARE DIFFERENT OBJECTS. The SIG/DREG lineage
      is boolean; the ECDLP target is prime-field. A repaired boolean d_reg model
      DOES NOT TRANSFER, and any citation toward prime-field cost must carry that
      gap explicitly.
    - >-
      EV-SIG-008 is explicitly `single_cell` at seed 2. A ladder at one seed per
      cell cannot separate a mechanism from seed variation; single-seed cells must
      be MARKED as such wherever budget forces them.
    - >-
      A crash at n = 13, D = 6 is an INFRASTRUCTURE outcome and never mathematical
      evidence (AGENTS.md rule 5). The chunked design exists so a crash costs a
      chunk rather than a cell.
  status: proposed
  proposed_by: idea-generator
