hypothesis:
  id: H-SDEG-082f7f
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  derived_from_idea: IDEA-20260803-202a15
  added: '2026-08-25'
  statement: >-
    The unexplained D = 6 rank deficits committed at n = 12 - 7,110 against the
    semi-regular prediction under EV-SIG-008's column-matched generic null (rank
    149,410 against 156,520, far below ncols - |V| = 174,031 and therefore NOT
    variety saturation), and 17,947 under EV-DREG-008's support-restricted CTRL-B
    null - are BOTH produced by ONE closed form with NO parameter fitted to
    either. Specifically: the semi-regular Hilbert-series prediction is the
    positive part of a TRUNCATED series, the truncation is a MODELLING CONVENTION
    rather than a property of the system, and at the freeze degree D = 6 that
    convention discards a quotient which the boolean system - carrying
    x_i^2 = x_i as genuine relations - does not discard. The candidate closed
    form is the UNTRUNCATED boolean/Koszul series with the field-equation
    contribution carried explicitly, and the predicted deficit is the discarded
    quotient's dimension at degree D. Because that quantity depends on the
    SUPPORT of the system, the two null families must give DIFFERENT deficits -
    which is why the two-number requirement is a constraint a wrong model cannot
    satisfy by accident. The hypothesis further predicts the form reproduces
    extra_D within 5 percent across an n = 9..13 by D = 5,6 ladder under both null
    families, reproduces the SIGN CROSSING recorded in EV-SIG-008 (D5
    support-induced share falling 40.6 percent at n = 9 to 0.0 percent at n = 12
    while the D6 defect turns on over the same range), and correctly classifies at
    every cell whether the null SATURATES at rank = ncols - |V| (the n = 9 shape)
    or COLLAPSES below it (the n = 12 shape). IF NO CANDIDATE PASSES, THE NAMED
    NO-GO IS THE DELIVERABLE: d_reg-derived cost predictions are unusable at
    D >= 6 over the tested n range, stated with its exact boundary.
  mechanism: >-
    Three goals - GOAL-SDEG-001, GOAL-DREG-001 and GOAL-SIG-001 - measure against
    a semi-regularity model that a committed measurement says is WRONG at D = 6,
    and D = 6 is where their questions live. Repairing or condemning that model is
    upstream of all three and consumes none of their budgets. The mechanism
    candidate comes from EV-SIG-006's own diagnosis: D6 is the FREEZE DEGREE of
    the semi-regular Hilbert series, at which the model's frozen quotient is
    unrealizable by any generic boolean system - measured variety sizes 0/1/6
    against a frozen 3,112 dimensions at n = 9. A Hilbert-series model that
    truncates at freeze discards information the actual boolean system retains,
    and the discarded quantity is COMPUTABLE. EV-SIG-006's further finding that
    "the support asymmetry exists at all degrees and is exactly explained by the
    up-closure law" is the ingredient connecting the two null families: the
    discarded quotient's dimension depends on the system's support, so a
    column-matched generic null and a support-restricted null are predicted to
    give different deficits AT THE SAME n AND D, and the model is constrained by
    their DIFFERENCE rather than only by their levels. The ladder exists because
    EV-SIG-008 records the D5 picture at n = 12 as CLEAN (support-induced share
    0.0 percent against 40.6 percent at n = 9), so the phenomenon TURNS ON between
    n = 9 and n = 12 at D = 6 while D = 5 becomes cleaner over the same range; a
    model must reproduce that crossing, not one point on one side of it.
  assumptions:
    - >-
      The two committed numbers are read AS-IS and are NOT re-derived by this work
      as a way of making them agree with a model. 7,110 comes from EV-SIG-008's
      column-matched generic null; 17,947 comes from EV-DREG-008's
      support-restricted CTRL-B. THEY ARE DIFFERENT NULLS AND THE MODEL MUST
      EXPLAIN THE DIFFERENCE, NOT AVERAGE THEM. A record that reconciles them by
      reinterpreting either measurement is inadmissible.
    - >-
      The candidate closed form is FROZEN, with its parameters fixed, BEFORE any
      new cell is computed. Fitting a parameter after seeing a ladder cell
      converts the test into a description and is the exact failure EV-IC-002
      retracted a verdict for; KN-FIND-029 records five false-green escapes across
      three repairs of one mutation control.
    - >-
      Rank computations are exact over the working field with a reproducible
      pivoting order and a persisted system hash, following the EXP-DREG lineage.
      The EV-DREG-004 incident - a destroyed checkpoint at 24.93 percent of
      columns with a measured carrier-codec bottleneck - is why chunked execution
      with per-chunk receipts is REQUIRED rather than suggested.
    - >-
      Semi-regular sequences, the Bardet-Faugere-Salvy degree-of-regularity
      framework, and Hilbert series for boolean systems with field equations are
      the natural home for the candidate form and ARE NOT RETRIEVED - primary
      sources are unreachable from this environment. THE MODEL MUST THEREFORE BE
      DERIVED IN-REPO FROM FIRST PRINCIPLES AND VALIDATED AGAINST THE COMMITTED
      NUMBERS, not transcribed. Any recalled form may be used only as a candidate
      to test, never as an authority, and must be labelled as such.
    - >-
      GOAL-DREG-001's own record describes the raw 17,947 as QUARANTINED AS
      CONFOUNDED. If the model cannot explain the difference between the two
      numbers, the honest reading may be that they are NOT COMPARABLE rather than
      that the model failed - and WHICH READING APPLIES MUST BE STATED BEFORE THE
      GATE RUNS, not chosen afterwards.
  proof_search_map:
    bottleneck: >-
      The TRUNCATION CONVENTION at the freeze degree. It is the exact step whose
      removal changes the predicted deficit from zero to a computable quantity,
      and everything downstream - the ladder, the crossing, the saturation shape -
      is evaluation of the resulting form.
    baseline_embedding:
      parameter_slice: >-
        n = 9 at both D = 5 and D = 6, where EV-SIG-006 records that every
        histogram-matched generic null SATURATES to rank = ncols - |V|. That is
        the exact old-method boundary the repaired model must reproduce.
      reproduction_check: >-
        Frozen regression fixture - the model must reproduce the n = 9 saturation
        shape and the 40.6 percent D5 support-induced share at n = 9 BEFORE any
        n = 12 prediction is believed. A model contradicting a committed diagnosis
        routes the contradiction to a correction record rather than overriding it.
    observation_collision:
      observable: >-
        extra_D, the rank deficit against the semi-regular prediction, together
        with the categorical saturation-shape classification (saturates at
        ncols - |V| versus collapses below it).
      distinct_preimage_search: >-
        THE COLLISION IS NAMED AND IS THE REASON FOR THE TWO-NUMBER REQUIREMENT. A
        single deficit value has many preimages: a wrong truncation convention, a
        seed fluctuation, a support-histogram artifact, and a genuine mechanism
        all produce "some number at n = 12, D = 6". A model fitted to ONE deficit
        is indistinguishable from all of them. Requiring ONE form to produce 7,110
        under one null family AND 17,947 under another, at the same n and D, with
        nothing tuned to either, is the additional condition that separates them.
        The categorical saturation-shape prediction is a second separator and is
        much harder to satisfy by accident than a numeric one.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the truncated semi-regular Hilbert series by the UNTRUNCATED
          boolean/Koszul series with the field-equation contribution carried
          explicitly, so the predicted deficit is the dimension of the quotient
          the truncation discards.
        predicted_gain: >-
          Turns an unexplained empirical defect into a computable quantity with no
          free parameter, testable at zero compute against two committed numbers
          before any rank is recomputed.
      - transform: observable_fiber
        proposed_object: >-
          Hold (n, D) fixed and vary the NULL FAMILY, so the model is constrained
          by the DIFFERENCE between the column-matched and support-restricted
          deficits rather than by their levels.
        predicted_gain: >-
          Converts a level match (fittable) into a difference match (not
          fittable without the support dependence being right).
    quantifier_order: >-
      CLAIMED - there EXISTS a single closed form F, with parameters frozen before
      any new cell is computed, such that for all n in {9,...,13}, for all
      D in {5, 6} and for all null families in the declared pair, F predicts
      extra_D within the stated tolerance, AND F(n = 12, D = 6, column-matched) is
      within 5 percent of 7,110 AND F(n = 12, D = 6, support-restricted) is within
      5 percent of 17,947. NOT CLAIMED - anything at n > 13, anything at D > 6,
      anything about prime-field systems (the SIG/DREG lineage is BOOLEAN and the
      ECDLP target is prime-field), and anything about whether the Semaev cascade
      is exploitable.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over n in {9,...,13} and D in {5, 6}, under the two committed null
        families, a frozen closed form predicts the rank deficit against the
        semi-regular model to within the stated tolerance and correctly classifies
        the saturation shape at every cell" - OR its negation, stated as an
        explicit boundary beyond which d_reg-derived cost predictions are
        unusable. It certifies nothing about prime-field systems, nothing about
        KN-OPEN-002's growth law (which needs a growth range this ladder does not
        reach), and nothing about any attack.
      nearby_object_control: >-
        n = 9, where the committed diagnosis says every histogram-matched generic
        null SATURATES - the nearest object on which the "below-freeze collapse"
        conclusion is KNOWN FALSE. A model that predicts collapse there proves too
        much and is void.
    proof_obligations:
      - claim: 'The frozen form returns extra_6 within 5 percent of 7,110 for the column-matched null at n = 12'
        responsibility: baseline
      - claim: 'The same frozen form returns extra_6 within 5 percent of 17,947 for the support-restricted null at n = 12'
        responsibility: baseline
      - claim: 'No parameter of the form is fitted to either committed number'
        responsibility: strictness
      - claim: 'The form reproduces the n = 9 saturation shape recorded in EV-SIG-006'
        responsibility: correctness
      - claim: 'The form reproduces the D5 support-induced share crossing from 40.6 to 0.0 percent'
        responsibility: correctness
      - claim: 'Rank computations are exact with reproducible pivoting and persisted system hashes'
        responsibility: feasibility
      - claim: 'The deficit is deterministic in (n, D, support histogram, null family) rather than seed-dependent'
        responsibility: success_probability
      - claim: 'Boolean results do not transfer to prime-field systems and no citation toward prime-field cost omits that gap'
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        The D6 deficit is a DETERMINISTIC function of (n, D, support histogram,
        null family) and not a stochastic property of the particular random system
        drawn.
      random_model_justification: >-
        NOT ESTABLISHED, and this entry exists to say so. EV-SIG-008 is a single
        cell at a single seed and is explicitly labelled `single_cell`. If the
        deficit is seed-dependent at fixed support, THE ENTIRE PREMISE THAT A
        CLOSED FORM EXISTS IS WRONG.
      supporting_results:
        - >-
          None. The heuristic is unsupported by design and is measured before any
          model error is reported.
      validation_experiment_ids:
        - EXP-SDEG-784d56
      falsification_condition: >-
        The seed-to-seed spread at fixed (n, D, null family) is comparable to the
        model error. The model is then FITTING NOISE and must be reported as such,
        never as a fit.
    - id: HEUR-002
      formal_statement: >-
        The truncation convention at the freeze degree is the responsible
        discrepancy, so an untruncated series with field equations carried
        explicitly is the right candidate family.
      random_model_justification: >-
        Derived from EV-SIG-006's own committed and independently reviewed
        diagnosis - that D6 is the freeze degree and the frozen quotient of 3,112
        dimensions is unrealizable by any generic boolean system, with variety
        sizes 0/1/6 measured. THE INFERENCE FROM "THE CONVENTION IS SUSPECT" TO
        "THIS PARTICULAR UNTRUNCATED FORM IS RIGHT" IS NOT SUPPORTED and is THE
        WEAKEST LINK in the hypothesis.
      supporting_results:
        - EV-SIG-006's freeze-degree diagnosis and measured variety sizes 0/1/6
        - EV-SIG-006's up-closure law explaining the support asymmetry at all degrees
      validation_experiment_ids:
        - EXP-SDEG-784d56
      falsification_condition: >-
        The two-number gate misses either committed value by more than 5 percent.
        The candidate is discarded BEFORE any ladder is authorized, which bounds
        the cost of being wrong to ZERO.
  structural_ingredients:
