  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: two_number_point_prediction
      direction: same
      minimum_effect: >-
        The frozen closed form returns extra_6 within 5 percent of 7,110 for the
        column-matched generic null AND within 5 percent of 17,947 for the
        support-restricted null, both at n = 12, D = 6, with NO parameter fitted
        to either. Two independent point predictions against committed numbers;
        missing EITHER falsifies the candidate.
    - metric: ladder_prediction_error
      direction: same
      minimum_effect: >-
        Median absolute relative error below 5 percent and maximum below 15
        percent across the n = 9..13 by D = 5,6 ladder under both null families. A
        model that hits n = 12 and misses the ladder is fitted to a point rather
        than describing a mechanism.
    - metric: crossing_reproduction
      direction: same
      minimum_effect: >-
        The model reproduces the SIGN CROSSING recorded in EV-SIG-008 - the D5
        support-induced share falling from 40.6 percent at n = 9 to 0.0 percent at
        n = 12 while the D6 defect turns on over the same range. A model that
        predicts the magnitudes but not the crossing is describing two unrelated
        regimes and must say so.
    - metric: saturation_shape_discrimination
      direction: same
      minimum_effect: >-
        At every cell the model states whether the null saturates at
        rank = ncols - |V| (the n = 9 shape recorded in EV-SIG-006) or collapses
        below it (the n = 12 shape recorded in EV-SIG-008), and is correct at 100
        percent of cells. A categorical prediction, much harder to satisfy by
        accident than a numeric one.
    - metric: negative_disposition_completeness
      direction: same
      minimum_effect: >-
        If no candidate form passes, an explicit statement of which D and n ranges
        make d_reg-derived cost predictions unusable, in a form
        IDEA-20260803-fa9839 can consume as a NOT-THRESHOLD-CONVERTIBLE finding. A
        negative that does not produce that statement has not finished.
    - metric: seed_spread_vs_model_error
      direction: lower
      minimum_effect: >-
        The seed-to-seed spread of extra_D at fixed (n, D, null family) must be
        SMALLER than the model's own error, reported BEFORE any model error is
        reported. A comparable spread means the model is fitting noise.
  test_boundary:
    instances:
      - >-
        boolean Macaulay systems over the SIG/DREG lineage at n in {9, 10, 11, 12,
        13}, D in {5, 6}
      - the column-matched generic null family of EV-SIG-008
      - the support-restricted CTRL-B null family of EV-DREG-008
      - n = 14, OPTIONAL and explicitly outside the completion gate
    parameters:
      n_ladder: '{9, 10, 11, 12, 13}'
      degrees: '{5, 6}'
      null_families: 2
      seeds_per_cell_minimum: 2
      two_number_targets: '7110 (column-matched) and 17947 (support-restricted), both at n = 12, D = 6'
      tolerance_gate: 5 percent on each committed number
      tolerance_ladder: median under 5 percent, maximum under 15 percent
    implementation: >-
      Exact rank over the working field with a reproducible pivoting order and a
      persisted system hash, following the EXP-DREG lineage. CHUNKED execution
      under a fresh write_scope with per-chunk receipts, so an infrastructure
      failure costs a chunk rather than a cell. The closed form is derived in-repo
      and frozen with its parameters in a hash-bound contract before any new rank
      is computed.
    budget:
      estimated_wall_clock_seconds: 43200
      note: >-
        THE GATE COSTS NOTHING - evaluating a frozen closed form at two committed
        cells is arithmetic, and it is what authorizes the rest. The ladder is
        exact rank over Macaulay matrices; n = 13, D = 6 dominates and is
        materially larger than n = 12, D = 6 whose ncols is already 174,031. The
        parent declares implementation medium and compute medium.
  distinguishable_outcomes:
    - outcome: >-
        The two-number gate passes (both within 5 percent, nothing fitted), the
        ladder error stays inside its bounds under both null families, the
        crossing is reproduced, and the saturation shape is correct at 100 percent
        of cells.
      means: >-
        The truncation convention was the responsible discrepancy and d_reg
        predictions are REPAIRABLE at D >= 6 over the tested n range. Three blocked
        goals - GOAL-SDEG-001, GOAL-DREG-001, GOAL-SIG-001 - regain a usable model
        at the degree their questions live at. It is a MODEL REPAIR, not an
        attack: no system becomes easier to solve and no exponent moves.
    - outcome: >-
        The two-number gate MISSES either committed value by more than 5 percent.
      means: >-
        The candidate closed form is WRONG. The ladder is NOT authorized on that
        candidate; the batch either proposes a second frozen candidate or reports
        the negative. THIS COSTS ZERO COMPUTE, which is the entire reason the gate
        runs first.
    - outcome: >-
        The gate passes but the ladder error exceeds its bounds.
      means: >-
        The form describes n = 12 and not the phenomenon. It is reported as a
        FITTED DESCRIPTION, not a mechanism, and cannot be used to repair d_reg
        predictions elsewhere.
    - outcome: >-
        The saturation-shape prediction is wrong at any cell.
      means: >-
        The model does not distinguish the two regimes - saturation versus
        below-freeze collapse - and therefore cannot be used to repair d_reg
        predictions at all, whatever its numeric accuracy.
    - outcome: >-
        The n = 9 known-shape control does not reproduce.
      means: >-
        The model CONTRADICTS a committed, independently reviewed diagnosis. The
        contradiction is routed to a CORRECTION RECORD; it is not resolved by
        adjusting the model.
    - outcome: >-
        The seed-to-seed spread at fixed cell is comparable to the model error.
      means: >-
        HEUR-001 fails: the deficit is not a deterministic function of
        (n, D, support, null family), the premise that a closed form exists is
        wrong, and no model error may be reported as a fit. This is measured FIRST
        for exactly that reason.
    - outcome: >-
        NO candidate form passes.
      means: >-
        THE NEGATIVE DISPOSITION IS THE DELIVERABLE - d_reg-derived cost
        predictions are UNUSABLE at D >= 6 over the tested n range, stated with its
        exact boundary and in a form IDEA-20260803-fa9839 can consume as a
        NOT-THRESHOLD-CONVERTIBLE finding. This outcome is PLANNED FOR, not a
        failure, and it is as valuable as the confirmation.
    - outcome: >-
        The model cannot explain the DIFFERENCE between 7,110 and 17,947.
      means: >-
        The honest reading may be that the two numbers are NOT COMPARABLE - they
        come from different experiments with different null constructions,
        different seeds, different support histograms and different admission
        metrics, and GOAL-DREG-001 describes the raw 17,947 as QUARANTINED AS
        CONFOUNDED - rather than that the model failed. WHICH READING APPLIES MUST
        BE STATED BEFORE THE GATE RUNS.
  prior_evidence_refs:
    - RQ-SDEG-001
    - GOAL-SDEG-001
    - GOAL-DREG-001
    - GOAL-SIG-001
    - IDEA-20260803-202a15
