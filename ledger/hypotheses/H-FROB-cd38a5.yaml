# H-FROB-cd38a5 — specified from IDEA-20261005-1e54b5.
# Protocol approval is DEC-20261006-e2ae0a. The source idea lives on
# origin/design/cycle-20261005-domain and is not copied here.
# This record asserts no ECDLP exponent change and no factor base at
# degree 131. No curve was enumerated in this design.
hypothesis:
  id: H-FROB-cd38a5
  question_id: RQ-FROB-7d8dd4
  source_proposal: IDEA-20261005-1e54b5
  goal_id: null
  goal_id_note: >-
    This design binds the question RQ-FROB-7d8dd4 and does not attach a
    goal record. It does not create one.
  status: approved
  status_note: >-
    approved means the kernel-count protocol in EXP-FROB-70ce69 is approved
    for a later executor. It does not mean the triple (1, 1, 4) was
    observed. Status moves only by DEC-20261006-e2ae0a under the standing
    user authorization of 2026-09-06. No model was enumerated in this design.
  proposed_by: coordinator
  conversion_note: >-
    The predicted kernel triple (1, 1, 4), the 2048-pair model list, the
    elliptic controls, and the refusal to move an exponent are carried from
    IDEA-20261005-1e54b5, which was read from
    origin/design/cycle-20261005-domain. The Coordinator froze the
    point-count formulas already present in
    experiments/EXP-FROB-7d51ae/implementation/hyperelliptic.py, the
    companion-matrix order check, and the assignment rows. Those rules were
    fixed before any run of EXP-FROB-70ce69.

  statement: >-
    TEST BOUNDARY. One isogeny class of abelian surfaces over F_2. The
    Frobenius polynomial is P(T) = T^4 + 3T^3 + 5T^2 + 6T + 4, so
    P(1) = 19. A hit is a genus-2 model y^2 + h(x)y = f(x) over F_2, with
    deg h at most 3 and deg f at most 6, whose curve point counts are
    N1 = 6 over F_2 and N2_curve = 6 over F_4 and whose characteristic
    polynomial equals P. On each hit the kernel sizes
    n2(F_2), n2(F_4), n2(F_8) are the numbers of Jacobian points Q over
    those fields with 2Q equal to the identity. N2_curve is a curve point
    count. n2 is a kernel size. They are different integers.

    PRE-REGISTERED PREDICTION, fixed before any run. On every hit the
    triple (n2(F_2), n2(F_4), n2(F_8)) equals (1, 1, 4). Any other triple
    on a hit is a negative. Zero hits is a third outcome: this class has
    no genus-2 model in the 2048-pair list, and the kernel triple is then
    unmeasured. Zero hits is not the negative and is not success.

    DISTINGUISHABLE OUTCOMES. (1) At least one hit, and every hit has
    triple (1, 1, 4), and the elliptic and polynomial controls pass:
    success for the prediction. (2) At least one hit whose triple is not
    (1, 1, 4), with the controls passing: negative. (3) Zero hits, controls
    passing: no F_2 model, degree unmeasured. (4) An elliptic control
    fails, the pair count is not 2048, or the polynomial identity fails:
    invalid, not evidence. (5) A timeout or crash: failed_infrastructure,
    not evidence.

    No discrete-log exponent moves. No factor base at degree 131 is claimed.
    The rho exponent on a binary elliptic curve stays 1/2.

  mechanism: >-
    The separable factor of P modulo 2 is T^2 + T + 1. Heuristic H1 says
    that factor is the characteristic polynomial of Frobenius on the étale
    quotient A[2]^et, a group scheme (Z/2)^2, with Frobenius of order 3
    and no eigenvalue 1. The only F_2-point and the only F_4-point of that
    (Z/2)^2 is then the identity, and all four geometric points are
    rational over F_8. Heuristic H2 says a local group scheme contributes
    no further geometric points, so the kernel of [2] has size at most 4.
    The integer where the kernel size jumps from 1 to 4 is the degree of
    the level structure a level-2 theta chart of a principal polarization
    would need. The chart is not built. The measured objects are the three
    kernel sizes and the hit count.

  assumptions:
    - The model list is the 2048 pairs named in IDEA-20260926-80209d. This protocol adds kernel sizes on the hits and does not rebuild the present-or-absent ladder.
    - H1 identifies the separable factor of P modulo 2 with Frobenius on A[2]^et. The triple is conditional on that identification.
    - A genus-2 Jacobian model supplies a principal polarization. If no model exists, the theta-chart degree is not measured.
    - Infinity and the characteristic polynomial use the formulas frozen in the experiment from the opened hyperelliptic helper. A different infinity convention is a different protocol.
    - Toy scope is this one class of order 19. Order 131, dimensions 5 and 6, and the norm-one torus of dimension 48 are out of scope.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a finite kernel count on a toy Jacobian, not a theorem,
      bound, certificate, reduction, or closure. The matrix arithmetic
      under H1 is a prediction the count can refute.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: Pollard rho at exponent 1/2, not beaten
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      None in an o(1) term. The output is three kernel sizes and a hit
      count. The factor 1/n of a Frobenius-invariant factor base is not
      changed, and no factor base at degree 131 is constructed.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For an ordinary surface in this class, the characteristic
        polynomial of Frobenius on the étale group scheme A[2]^et of rank
        2^2 is the separable factor T^2 + T + 1 of P(T) modulo 2.
        Equivalently, Frobenius acts on (Z/2)^2 by a matrix of order 3
        with no eigenvalue 1, so the kernel sizes over F_2, F_4, and F_8
        are 1, 1, and 4.
      random_model_justification: >-
        The sample is the hit list of a complete finite enumeration, not a
        random sample of surfaces. No uniformity over a family is assumed.
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-70ce69
      falsification_condition: >-
        A Jacobian model of this P(T) whose kernel triple is not (1, 1, 4).
    - id: H2
      formal_statement: >-
        Geometric points of A[2] are exactly the points of the étale
        quotient. The connected component of the identity contributes the
        identity only, so each kernel size is at most 4.
      random_model_justification: >-
        This is a structural claim about one group scheme, checked by the
        kernel sizes on the hit list, not by a random model.
      supporting_results: []
      validation_experiment_ids:
        - EXP-FROB-70ce69
      falsification_condition: >-
        A kernel of size greater than 4 on a hit, over F_2, F_4, or F_8.

  structural_ingredients:
    - description: >-
        KN-OPEN-095df5 records that no abelian variety over F_2 of
        dimension at most 4 has 131 dividing its point count, and states
        the genus-2 Weil ceiling 33.97. Order 19 sits inside that ceiling.
        This hypothesis does not reopen the order-131 census.
      citation: KN-OPEN-095df5
      provenance: internal
      verified_by: knowledge/open-problems/KN-OPEN-095df5.md
      role: scope fence; order 131 is not the object
    - description: >-
        IDEA-20260926-80209d names the unique genus-2 ladder class over F_2
        at order 19, with h = x^2 + 3x + 1 and this P(T), and the 2048-pair
        model search with N1 = 6 and N2_curve = 6.
      citation: IDEA-20260926-80209d
      provenance: internal
      verified_by: ledger/proposals/IDEA-20260926-80209d.yaml
      role: source of the model list and the point-count identity
    - description: >-
        KR-IC-b0fcda states that a Frobenius-invariant factor base cuts the
        number of systems by at most 1/n and speeds linear algebra by n^2.
        This hypothesis does not change that factor.
      citation: KR-IC-b0fcda
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
      role: unchanged factor-base baseline
    - description: >-
        The opened helper freezes a1 = N1 - 3, a2 = (N2_curve - 5 + a1^2) / 2,
        and the polynomial T^4 + a1 T^3 + a2 T^2 + 2 a1 T + 4, together with
        #Jac(F_2) = (N1^2 + N2_curve) / 2 - 2. At (6, 6) this is P(T) and
        order 19.
      citation: experiments/EXP-FROB-7d51ae/implementation/hyperelliptic.py
      provenance: internal
      verified_by: experiments/EXP-FROB-7d51ae/implementation/hyperelliptic.py
      role: frozen point-count and characteristic-polynomial convention
    - description: >-
        Recalled pointer, text not opened: a level-2 theta structure on a
        principally polarized abelian surface uses a Lagrangian in A[2].
        The count is the field of those geometric points, conditional on H1.
      citation: Mumford, Tata lectures on theta, level structures
      provenance: recalled
      verified_by: null
      role: pointer only; the experiment does not build a theta chart

  reduction_chain:
    core_problem: >-
      Whether the kernel of [2] on a genus-2 model of this class has sizes
      (1, 1, 4) over F_2, F_4, and F_8. Not an attack.
    corollaries: []

  predictions:
    - metric: kernel_triple
      direction: different
      minimum_effect: >-
        On every hit, (n2(F_2), n2(F_4), n2(F_8)) equals (1, 1, 4). Any
        other triple is the negative.
    - metric: hit_count
      direction: different
      minimum_effect: >-
        Either at least one model of this P(T), in which case the triple is
        read, or zero models, in which case the degree is unmeasured.

  test_boundary:
    instances:
      - one isogeny class over F_2 with P(T) = T^4 + 3T^3 + 5T^2 + 6T + 4
      - the 2048 models y^2 + h(x)y = f(x) with deg h <= 3 and deg f <= 6
      - the five elliptic point-count classes over F_2 as the kernel-counter control
    parameters:
      field: F_2
      group_order: 19
      predicted_triple: [1, 1, 4]
      pair_count: 2048
    implementation: >-
      A later executor enumerates the pairs and the kernels. This design
      does not enumerate them.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: One exhaustive enumeration. The second run id is an infrastructure retry, not a second scientific sample.

  falsification_conditions:
    - A Jacobian model of this P(T) whose triple (n2(F_2), n2(F_4), n2(F_8)) is not (1, 1, 4). H1 is then false for this class.
    - A kernel of size greater than 4 on a hit. H2 is then false on that model.
    - The even-order elliptic control reports n2(F_2) = 1. The instrument cannot see rational 2-torsion, and no surface count is read. That failure is invalid, not a negative on the surface.

  interpretation_limits:
    - Toy scope: one isogeny class over F_2, group order 19. No statement about order 131, about dimension 5 or 6, or about the norm-one torus of dimension 48.
    - The rho exponent stays 1/2. The Frobenius-invariant factor-base saving stays the factor in KR-IC-b0fcda. A level structure over F_8 does not change either number.
    - This record does not compute a Mumford eliminant and does not compute the degree of a Kummer ideal.
    - Fast-theta monomial support in odd characteristic is a different comparison. The metric here is a kernel count in characteristic 2.
    - Zero hits does not falsify H1. It leaves the kernel triple unmeasured.

