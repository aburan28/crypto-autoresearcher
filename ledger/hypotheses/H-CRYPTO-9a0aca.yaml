hypothesis:
  id: H-CRYPTO-9a0aca
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260815-abcbbc
  derived_from_idea: IDEA-20260815-abcbbc

  statement: >-
    SCOPE. A mechanical extraction over this repository's own committed ECC goal
    records, producing a portfolio status matrix. NO MATHEMATICAL CLAIM, NO
    SECURITY CLAIM, NO ECDLP CONTENT, AND NO PRIORITISATION. The hypothesis has
    four conjuncts and each is separately falsifiable.
    (C1, EXTRACTION IS SOUND) A frozen extraction rule applied to every ECC goal
    record yields, per goal, its status, its blocking obligation, its nearest
    reachable decision and its revisit condition, and it passes two forced
    controls: a COMPLETED goal must show NO blocking obligation, and an ACTIVE
    goal with a clear next_action must extract cleanly. A rule that fails either
    control is wrong and no count derived from it is reportable.
    (C2, THE CONTRACT GAPS ARE REAL AND COUNTABLE) At least one ECC goal records
    an impediment or a deferral WITHOUT the concrete clearing condition
    AGENTS.md requires. Under the current contract that is an impediment entry
    lacking a checkable `clears_when` or a `recheck`; under the pre-2026-09-04
    wording the parent proposal was written against, it was a deferral lacking a
    recorded revisit condition. Both readings are extracted and reported
    separately.
    (C3, ADVANCEABILITY IS COUNTABLE) The number of ECC goals whose next_action
    names no reachable decision is a countable quantity, reported as its own
    category. NO VALUE IS PRE-REGISTERED for C3.
    (C4, THE MATRIX IS MECHANICAL) Two independent extractors applied to the same
    frozen rule agree on a declared sample. If they do not, the extraction
    requires judgement rather than mechanism, and THAT is the finding -- the
    matrix is then reported as a judgement-laden survey with its disagreement
    rate, never as a mechanical view.
    A GENUINE NEGATIVE EXISTS AND IS NAMED: zero goals lacking a clearing
    condition, with both nulls firing, REFUTES C2 at the tested scope and means
    the ECC portfolio is contract-complete on that rule. That is a clean result
    and a deliverable.

  mechanism: >-
    THE GAP, STATED AS A MEASUREMENT RATHER THAN A COMPLAINT. This program's ECC
    surface spans dozens of goals in states from draft to completed, several
    blocked on each other and several deferred. Goal records carry status and
    next_action individually; NO RECORD ASSEMBLES THEM. So nobody can currently
    answer, from committed state, which goals are live, what each is waiting on,
    and which have a decision within reach. A status matrix built from committed
    records answers that mechanically, and checking each deferral against the
    rule requiring a clearing condition is the part that is a check rather than a
    report.

    THE EXTRACTION. For each ECC goal, extract from its COMMITTED record only --
    never from session memory -- its status, its blocking obligation, its nearest
    reachable decision, and any recorded revisit or clearing condition. Report
    parse failures rather than skipping them. Report goals whose next_action is
    prose naming no decision as a DISTINCT CATEGORY rather than folding them into
    either the advanceable or the blocked set.

    THE ECC SET IS READ, NOT DERIVED. This is binding and it is the single most
    important implementation constraint. AGENTS.md declares the ECC area set ONCE
    in orchestration/research-priority.yaml, read through tools/ecc_priority.py,
    and states plainly: do not re-derive it anywhere, and DO NOT INFER IT FROM AN
    IDENTIFIER PREFIX. GOAL-CRYPTO-001 is an ECDLP search; DREG, SDEG, SIG, MONO,
    RELN, ICEX, ICLIFT and XEDN are Semaev and index-calculus machinery; and
    several elliptic-sounding areas are excluded with a recorded reason. An
    extraction that builds its own ECC set by prefix matching measures a
    different portfolio and is invalid. The membership question is answered by
    `tools/ecc_priority.py --classify` per record and by `--list-areas` for the
    set, and the tool's output is recorded verbatim.

    THE CONTRACT MOVED UNDER THIS PROPOSAL, AND THE HYPOTHESIS IS WRITTEN AGAINST
    THE CURRENT ONE. The parent proposal was filed 2026-08-15 and speaks of
    goals `deferred or paused with no recorded revisit condition`. On 2026-09-04
    AGENTS.md removed `paused` and `blocked` from the permitted goal statuses
    entirely: a campaign that meets an impediment now STAYS ACTIVE and records an
    `impediments` entry naming the condition, what is blocked, a concrete
    `clears_when`, a `recheck` command, and what it asserts nothing about. The
    matrix therefore extracts BOTH readings and reports them separately:
    (a) IMPEDIMENTS LACKING A CLEARING CONDITION -- the current contract's gap;
    (b) GOALS STILL CARRYING status paused OR blocked -- a countable violation of
    a rule that now refuses those statuses by name, which did not exist when the
    proposal was written and which the matrix is well placed to find;
    (c) DEFERRALS WITHOUT A REVISIT CONDITION under the proposal's original
    wording, for continuity with the record that motivated the work.
    Writing the contract against the stale rule would have produced a matrix that
    measured a wording no longer in force, and that is recorded here rather than
    silently corrected.

    THE TWO FORCED CONTROLS, AND WHY THEY ARE NOT DECORATIVE. NULL 1: a COMPLETED
    goal must show NO blocking obligation. If it shows one, the extraction is
    wrong -- a completed goal by definition has nothing pending, so a blocking
    obligation there is the rule reading prose it should not be reading. NULL 2:
    an ACTIVE goal with a clear, decision-naming next_action must extract
    cleanly, which calibrates the rule against a known-good case. The two fail in
    different directions: null 1 catches over-extraction, null 2 catches
    under-extraction, and a rule that fails both for the same reason is not
    responding to the fields it names.

    THE LOAD-BEARING WEAKNESS, NAMED BEFORE IT IS DISCOVERED. Goal next_actions
    are long prose and vary enormously in precision, so reducing one to a
    blocking obligation requires judgement. Judgement applied silently would make
    the matrix look mechanical while being a set of opinions. The remedy is C4:
    two independent extractors on a declared sample under the identical frozen
    rule, with the disagreement rate reported. A high disagreement rate does not
    void the work -- it RELABELS it, from a mechanical view to a judgement-laden
    survey, and that relabelling is itself worth recording because the parent
    proposal's own prior of only 0.5 on this point is the least confident number
    in the record.

    THE SECOND WEAKNESS, ALSO NAMED. A goal's recorded status may lag its actual
    state, because updates happen at batch boundaries. So the matrix describes THE
    LEDGER, not THE CAMPAIGN, and it carries its date. HEUR-PORT-1 below states
    that assumption and its gap in the proposer's own words, and the tail check it
    prescribes -- goals whose most recent citing decision postdates their status
    update -- is what measures the lag rather than assuming it away.

  assumptions:
    - >-
      That ECC goal records are parseable and their statuses are current. The
      parent proposal reports an earlier survey confirming this FOR MOST BUT NOT
      ALL, so parse failures are expected and are REPORTED rather than skipped;
      an unparseable record is a finding, not an omission.
    - >-
      That blocking obligations are extractable from next_actions, which are prose
      and vary enormously in precision. This is the weakest assumption in the
      record and C4 measures it rather than presuming it.
    - >-
      That the ECC set is READ from orchestration/research-priority.yaml through
      tools/ecc_priority.py and never re-derived, and in particular never inferred
      from an identifier prefix. An extraction that builds its own set measures a
      different portfolio and is invalid.
    - >-
      That the goal count in the parent proposal (26 ECC goals) is RELAYED from
      the session that filed it and is NOT evidence. The corpus grows and differs
      between worktrees; the experiment re-derives the count at a fixed commit and
      reports its own number.
    - >-
      That both goal layouts are in scope. A goal may be a single
      ledger/goals/GOAL-X.yaml or a sharded ledger/goals/GOAL-X/ directory with
      goal.yaml and per-batch checkpoints; both validate, conversion is
      incremental, and an extraction that handles only one layout silently omits
      the other half of the portfolio.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      PURELY EMPIRICAL AND ADMINISTRATIVE. This hypothesis proposes no theorem,
      asymptotic bound, certificate family, reduction or closure argument, and the
      parent proposal states explicitly that no tracked object propagating under a
      group law is proposed. Its content is a mechanical extraction over committed
      files with two forced controls. Per templates/research-records.md, a purely
      empirical hypothesis sets this field and leaves the other subfields null;
      that is complete work here rather than an omission. The identifiability
      question that DOES apply -- whether the extraction can distinguish a goal
      with a blocking obligation from one without -- is handled by the two nulls
      in the predictions below, which is the right place for it.

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. No complexity result is claimed and no exponent moves; the
    parent proposal states plainly that it proposes no algorithm for any hard
    problem. Its target_complexity block is carried verbatim below under
    source_target_complexity so that nothing is softened or dropped in conversion.

  source_target_complexity:
    note: >-
      Carried VERBATIM from IDEA-20260815-abcbbc so that the proposal's
      claim-conditioning fields survive conversion intact.
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is parsing and extraction across goal
      records.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent portfolio view exists; individual goal records carry
      their own state without assembly.
    hidden_overhead: >-
      Prose next actions require judgement to reduce to a blocking
      obligation, which is where the extraction is weakest.
    tradeoff_note: >-
      A mechanical matrix is cheap and shallow; it triages rather than
      prioritises, and the Coordinator's judgement supplies the rest.

  heuristic_assumptions:
    - id: HEUR-PORT-1
      source_id_in_proposal: HEUR-PORT-1
      formal_statement: >-
        A goal's committed record accurately reflects its current state
        and blocking obligation.
      random_model_justification: >-
        NOT A RANDOM MODEL, and labelled as such rather than dressed as one. The
        parent proposal offers a structural argument in place of one and it is
        preserved verbatim: 'Rigorous ingredient: goal records are the campaign's
        declared state and are updated by Coordinator decision, so they are the
        authoritative source by construction. THE GAP: updates happen at batch
        boundaries, so a goal worked on between boundaries has a stale record, and
        the matrix would describe the last checkpoint rather than the present.'
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND CORRECT. The proposal's support is a structural argument about
        how goal records are maintained, not a rigorous bound plus a distribution
        theorem. Populating this field would present that argument as discharge.
      validation_experiment_ids: [EXP-CRYPTO-fcc033]
      falsification_condition: >-
        A goal whose recorded state contradicts its most recent
        committed decision.
      validation_plan_from_proposal: >-
        Carried verbatim: 'SAMPLE: all ECC goals, with each status cross-checked
        against the most recent decision citing that goal. TAIL CHECK: goals whose
        most recent decision postdates their status update. TRANSFER: none; the
        matrix is a snapshot and carries its date.'

  structural_ingredients:
    - description: >-
        The single declared ECC area set and its classifier, which the extraction
        must READ rather than re-derive, and which explicitly forbids inferring
        membership from an identifier prefix.
      citation: 'orchestration/research-priority.yaml via tools/ecc_priority.py'
      provenance: internal
      verified_by: TASK-20260904-e1420d
      role: authoritative definition of the portfolio being surveyed
    - description: >-
        The current rule that a goal may not take status paused or blocked, that a
        campaign meeting an impediment stays active and records an `impediments`
        entry with condition, what_is_blocked, clears_when, recheck and
        asserts_nothing_about, and that an impediment is never evidence.
      citation: 'AGENTS.md, "Goals are never paused" (2026-09-04)'
      provenance: internal
      verified_by: TASK-20260904-e1420d
      role: >-
        The contract the matrix checks against, which CHANGED after the parent
        proposal was written and which the hypothesis is deliberately written
        against rather than against the stale wording.
    - description: >-
        The requirement that any deprioritization or closure record its evidence,
        budget, test boundary, remaining uncertainty, and a concrete successor or
        revisit condition.
      citation: 'AGENTS.md, "Research-direction integrity and auditability"; CLAUDE.md rule 9'
      provenance: internal
      verified_by: TASK-20260904-e1420d
      role: the obligation whose absence the matrix counts
    - description: >-
        Existing tooling that already renders parts of a portfolio view --
        the priority classifier, the standing obstruction registry, the dispatch
        plan renderer, the merge digest, and the open-lane lister.
      citation: 'tools/ecc_priority.py, tools/obstruction_registry.py, tools/research_dispatch.py, tools/merge_digest.py, tools/goal_lanes.py'
      provenance: internal
      verified_by: TASK-20260904-e1420d
      role: >-
        Possible incumbents. Whether any already assembles the matrix is a Stage 0
        terminator added by the converting Coordinator; the parent proposal names
        none of them.

  reduction_chain:
    core_problem: >-
      Produce, from committed records at a stated commit and date, a per-goal
      matrix over the declared ECC portfolio giving status, blocking obligation,
      nearest reachable decision and clearing or revisit condition, together with
      counts of the goals lacking a clearing condition, the goals whose next_action
      names no reachable decision, and the goals whose records do not parse.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. The matrix reduces to NOTHING. It does not prioritise, it
      does not rank, it does not justify closing or reopening any goal, it does not
      show any goal was wrongly deferred, and it changes no status. A missing
      clearing condition is a CONTRACT GAP TO BE FILLED, not evidence that the
      deferral was wrong -- the parent proposal says exactly this and it is
      preserved. Filling a gap, reranking, or retiring a goal are Coordinator acts
      requiring their own decision records.

  predictions:
    - metric: >-
        G1 -- completed-goal null: the blocking obligation extracted for a
        COMPLETED ECC goal
      direction: different
      minimum_effect: >-
        FORCED NONE. A completed goal has nothing pending by definition. If the
        extraction reports a blocking obligation there it is reading prose it
        should not read, the rule is wrong, and NO count derived from it is
        reportable.
    - metric: >-
        G2 -- active-goal null: extraction on an ACTIVE ECC goal whose next_action
        names a clear decision
      direction: different
      minimum_effect: >-
        FORCED CLEAN EXTRACTION -- status, blocking obligation and nearest decision
        all resolved without judgement. This calibrates against a known-good case
        and fails in the opposite direction from G1: G1 catches over-extraction,
        G2 catches under-extraction.
    - metric: >-
        G3 -- count of ECC goals recording an impediment or deferral with NO
        concrete clearing condition, under the current contract's `clears_when`
        and `recheck` fields
      direction: different
      minimum_effect: >-
        AT LEAST ONE. The parent proposal's prior is 0.6 that several exist. Each
        is a contract gap under AGENTS.md and is DIRECTLY ACTIONABLE. A count of
        ZERO with both nulls firing REFUTES this conjunct at the tested scope and
        means the ECC portfolio is contract-complete on that rule -- a clean
        negative and a real deliverable.
    - metric: >-
        G4 -- count of ECC goals still carrying status `paused` or `blocked`,
        which AGENTS.md refuses by name as of 2026-09-04
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED. This category did not exist when the parent
        proposal was written and guessing it would be fabrication under AGENTS.md
        rule 9. It is reported because the matrix is exactly the instrument that
        would find such a record, and because each one is a validation error rather
        than a judgement call.
    - metric: >-
        G5 -- count of ECC goals whose next_action names no reachable decision
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED. Reported as a DISTINCT CATEGORY, never folded
        into either the advanceable or the blocked set. A next_action naming no
        decision cannot advance its goal, and a portfolio broader than it is
        advanceable is the finding a campaign at this scale most needs.
    - metric: >-
        G6 -- inter-extractor agreement rate on the declared sample, two
        independent extractors under the identical frozen rule
      direction: higher
      minimum_effect: >-
        AT LEAST 0.80 agreement on the blocking-obligation field. Below that, the
        extraction is judgement rather than mechanism and the matrix MUST be
        relabelled a judgement-laden survey and reported with its disagreement
        rate. That relabelling is a finding, not a failure, and the parent
        proposal's own prior of 0.5 on extractability is why the check exists.
    - metric: >-
        G7 -- list of unparseable ECC goal records, and the count of ECC goals at
        the fixed commit
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED for either. The parent proposal's figure of 26
        ECC goals is RELAYED from its own session and the corpus grows and differs
        between worktrees; adopting it as a prediction would launder a relayed
        number into a measurement. Parse failures are REPORTED rather than skipped,
        per the proposal's own control.

  test_boundary:
    instances:
      - >-
        Every goal record classified as ECC by tools/ecc_priority.py at a fixed
        commit, in BOTH layouts -- single ledger/goals/GOAL-X.yaml files and
        sharded ledger/goals/GOAL-X/ directories with goal.yaml and checkpoints.
      - >-
        Two forced controls chosen and NAMED before extraction: one COMPLETED ECC
        goal and one ACTIVE ECC goal with a decision-naming next_action.
      - >-
        The most recent committed decision citing each goal, for the staleness
        cross-check.
      - >-
        A declared sample of goals, at least 8 or one third of the portfolio,
        whichever is larger, for the two-extractor agreement measurement.
    parameters:
      ecc_set_source: 'orchestration/research-priority.yaml, read through tools/ecc_priority.py; never re-derived and never inferred from an identifier prefix'
      extracted_fields: ['status', 'blocking obligation', 'nearest reachable decision', 'clearing or revisit condition']
      gap_readings: ['impediment lacking clears_when or recheck', 'status paused or blocked', 'deferral lacking a revisit condition under the pre-2026-09-04 wording']
      agreement_threshold: 0.80
      agreement_sample_minimum: 8
      commit_fixed: 'recorded at run time; the portfolio grows and an unfixed denominator is not reproducible'
      source_of_truth: 'committed records only, never session memory'
    implementation: >-
      Python 3 standard library plus a YAML parser for the goal records, and
      tools/ecc_priority.py invoked for membership with its output recorded
      verbatim. NO NETWORK ACCESS is required and none may be used. The two
      independent extractors for the agreement measurement are two separate agent
      sessions applying the same written rule, neither reading the other's output
      before both are recorded.
    budget:
      stage0_wall_clock_seconds: 900
      stage1_wall_clock_seconds: 900
      stage2_wall_clock_seconds: 1200
      total_wall_clock_seconds: 3000
      maximum_memory_gb: 8
      note: >-
        Parsing a few dozen YAML files is milliseconds. The budget is sized to the
        careful reading of prose next_actions and to running the extraction twice
        independently, which is the whole cost.

  falsification_conditions:
    - >-
      F1 (OVER-EXTRACTION) -- a COMPLETED goal shows a blocking obligation. The
      extraction is wrong; NO count derived from it is reportable.
    - >-
      F2 (UNDER-EXTRACTION) -- an ACTIVE goal with a clear decision-naming
      next_action does not extract cleanly. The extraction is wrong in the opposite
      direction; no count is reportable.
    - >-
      F3 (THE CLEAN NEGATIVE) -- zero ECC goals lack a clearing or revisit
      condition while both nulls fire. C2 is REJECTED at the tested scope: the ECC
      portfolio is contract-complete on that rule and the proposal's motivating
      concern does not hold. A real deliverable, reported as such rather than
      buried.
    - >-
      F4 (NOT MECHANICAL) -- the two extractors agree below 0.80 on the
      blocking-obligation field. C4 is rejected: the extraction requires judgement,
      the matrix is RELABELLED a judgement-laden survey and reported with its
      disagreement rate, and it may not be cited as a mechanical view of the
      portfolio.
    - >-
      F5 (NOT PARSEABLE) -- goal records do not parse. The portfolio cannot be
      surveyed mechanically at all, which is a process finding and is reported as
      one, with the exact list of unparseable records so the debt is closable.
    - >-
      F6 (SUPERSEDED BY EXISTING TOOLING) -- Stage 0 finds that
      tools/ecc_priority.py, tools/obstruction_registry.py,
      tools/research_dispatch.py or tools/goal_lanes.py already assembles this
      matrix. The hypothesis is superseded; the run reports and cites that output
      rather than re-deriving it. Absence of a search result is not evidence that
      no such tooling exists, and the check is executed rather than asserted.
    - >-
      F7 (SCOPE OVERREACH, A FAILURE OF THE REPORT RATHER THAN OF THE EXTRACTION)
      -- any output that ranks or prioritises goals, that recommends closing,
      reopening or retiring one, that treats a missing clearing condition as
      evidence the deferral was wrong, or that changes any goal's status or
      next_action. Every one of those is a Coordinator act requiring its own
      decision record.

  interpretation_limits:
    - >-
      AN ADMINISTRATIVE VIEW. It makes no scientific claim and PRIORITISES
      NOTHING. It triages; the Coordinator's judgement supplies the rest, and
      ranking is explicitly outside this hypothesis.
    - >-
      IT DESCRIBES THE LEDGER, NOT THE CAMPAIGN. Committed records may lag actual
      state because updates happen at batch boundaries, and in a repository worked
      by many concurrent sessions the lag is real. The matrix is a snapshot and
      CARRIES ITS DATE AND ITS COMMIT; a matrix quoted without both is out of
      contract.
    - >-
      A MISSING REVISIT OR CLEARING CONDITION IS A CONTRACT GAP TO BE FILLED, NOT
      EVIDENCE THE GOAL WAS WRONGLY DEFERRED. This is the parent proposal's own
      limit and it is preserved exactly. Reading a count of gaps as a criticism of
      the campaigns that hold them inverts it.
    - >-
      AN IMPEDIMENT IS NEVER EVIDENCE. Counting impediments says nothing about the
      science of any goal, and an infrastructure failure or exhausted budget
      recorded on an active goal does not become a finding by being tabulated
      (AGENTS.md rule 5 and the "Goals are never paused" section).
    - >-
      NOT toy, medium or crypto evidence about the ECDLP or anything else. It may
      never be cited in a cost or complexity statement.
    - >-
      SCOPE MISMATCH, RECORDED RATHER THAN HIDDEN. The parent proposal is filed
      under RQ-CRYPTO-001 but surveys the whole ECC goal surface rather than
      addressing RQ-CRYPTO-001's own question of whether a non-generic algorithm
      can beat Pollard rho. It is bound to RQ-CRYPTO-001 to preserve its provenance
      chain and should be ranked on its portfolio-level value.
    - >-
      NOVELTY, AS THE PROPOSAL STATES IT. The parent proposal records
      novelty_status `adaptation` on the ground that portfolio status reporting is
      administrative and the contribution is the contract check. That verdict rests
      on a read of internal goal records -- internal provenance, not a recalled
      external citation -- so it is not the unsupported `adaptation` AGENTS.md rule
      9 forbids. It remains unverified against any external literature and no
      external novelty is claimed.

