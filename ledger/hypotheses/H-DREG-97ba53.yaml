  title: >-
    Over F_5, twenty of twenty-five short Weierstrass curves are nonsingular,
    and the trace-2 class is the three curves (1, 0), (1, 2), (1, 3).
  statement: >-
    For y^2 = x^3 + A x + B over F_5, five pairs (A, B) are singular and
    twenty are nonsingular. Point counts give orders with multiplicities
    2:1, 3:2, 4:3, 5:2, 6:4, 7:2, 8:3, 9:2, 10:1. The four curves of order 6
    have trace 0 and are supersingular. The ordinary trace-2 class is exactly
    (A, B) in {(1, 0), (1, 2), (1, 3)}, each of order 4. For (1, 0), each of
    the four units u in F_5 sends (A, B) to (u^4 A, u^6 B) and preserves j.
  mechanism: >-
    A class reading needs a complete list of curves before any fall profile.
    This contract is that list at p = 5. It does not build a Semaev
    polynomial.
  assumptions: []
  proof_search_map:
    bottleneck: Visiting all 25 pairs and counting points on each nonsingular curve.
    baseline_embedding:
      parameter_slice: >-
        Short Weierstrass model and the discriminant -16(4A^3 + 27B^2).
        A design-time enumeration produced the counts below. It is not a run.
      reproduction_check: >-
        One loop orders A then B. The other orders B then A. The sets of
        nonsingular pairs and their orders must agree.
    observation_collision:
      observable: The set of (A, B, order) and the gauge j values.
      distinct_preimage_search: >-
        Order from the Legendre count versus the trace t = 6 - order.
        Supersingular means p divides t.
    constructive_transforms:
