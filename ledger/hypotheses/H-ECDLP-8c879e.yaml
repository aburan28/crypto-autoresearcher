# H-ECDLP-8c879e
# Stage-0 chord-slope fibres for IDEA-20261006-76e571.
# One curve over F_53. Not a walk.
hypothesis:
  id: H-ECDLP-8c879e
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-76e571
  added: '2026-10-12'
  status: specified
  statement: >-
    On the first eligible curve y^2 = x^3 + x + B over F_53, the chord
    slope from P to P+G loses at least a fifth of D and splits on at
    least half its values, whenever the image is nonempty and the
    500-draw null model is usable.
  test_boundary: >-
    One prime and the first eligible coefficient from 1 through 26.
    The row for 2G is recorded and does not decide the claim. No walk
    is inside this boundary.
  mechanism: >-
    The tracked object is one slope, or a sentinel when the chord is
    vertical. Loss and split are two integer tests. A usable model and
    an unusable model are different finished states.
  distinguishable_outcomes:
    - >-
      The curve is scored, the null model is usable, and both integer
      tests pass.
    - >-
      The curve is scored, the null model is usable, and at least one
      integer test fails.
    - >-
      No eligible curve exists, the image is empty, or the null model
      is below four fifths. That outcome leaves the claim unscored.
  falsification: >-
    The worksheet is scored and either the loss test or the split test
    fails.
  not_claimed: >-
    No sum-compatible bucket index, no walk, and no change to the
    generic exponent 1/2.
