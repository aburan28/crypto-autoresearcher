hypothesis:
  id: H-ICEX-ab1da2
  question_id: RQ-FBG-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260830-f89eaf
  statement: >-
    THE ONE CHANNEL THIS PROGRAM'S CONSERVATION FINDING NAMES AS UNCAPTURED IS RELATION RANK, AND
    THIS REPOSITORY HOLDS ZERO MEASURED RANK VALUES FOR ANY FACTOR-BASE GEOMETRY. Define the
    RANK-SATURATION OVERHEAD: for a base D of size B in a group of prime order N, the
    index-calculus system has B+1 unknowns - the base logarithms and the target logarithm - and
    each harvested decomposition of a target contributes one row. Let
    kappa(D, N) = (number of harvested rows, in the declared harvest order, before the coefficient
    matrix attains rank B+1) divided by (B+1), with kappa declared infinite if a pre-registered
    budget of rows is exhausted without full rank.
    (C1) BASELINE. kappa for a matched random base is at most a small declared threshold above 1 at
    every rung, and decreasing in N, since the singularity probability falls with the field size.
    This is the number a one-sided rank bound elsewhere in this program depends on and which nobody
    has measured.
    (C2) NO ADVANTAGE IS AVAILABLE. Since kappa is at least 1 for every base by counting alone, the
    best conceivable rank ADVANTAGE is kappa for a random base, which C1 puts at 1 plus a vanishing
    term. The hypothesis therefore predicts that no geometry in the panel has kappa materially
    below the random baseline - and it is designed so that CLOSING ITS OWN CHANNEL is the
    informative outcome.
    (C3) A FORCED DEFICIENCY EXISTS AND IS PREDICTABLE IN ADVANCE. Under the x-coordinate
    convention, two listed base elements sharing an x-coordinate are the same unknown, so the
    matrix carries two identical columns, can never exceed rank B, and kappa is infinite. A
    committed battery in this program observed exactly this collision in the wild and recorded it
    as an effective-size drop without asking what it did to rank.
    (C4) THE DISCRIMINATION, WHICH IS THE POINT. Two explanations for why structured geometries
    underperform have never been separated. Under PURE COVERAGE, a structured base loses only
    because a random target decomposes less often, and once a decomposable target is found its
    relations are as good as anyone's - so kappa is indistinguishable from the random baseline for
    EVERY geometry, including the collapsed ones. Under ADDITIONAL RANK DEGENERACY, a structured
    base also produces relations that span less, because its decomposable targets are few and its
    rows are correlated, so the penalties COMPOUND and kappa is materially elevated for the
    concentrated geometries. These make opposite predictions on the same battery and are measured
    in one run at low cost.
    (C5) NOT CLAIMED. No attack, no break, no speedup, no solve time. This is not a displacement-rank
    measurement and makes no structured-solve claim; no linear-algebra method is run, timed or
    compared.
  mechanism: >-
    WHY RANK IS A DIFFERENT OBJECT FROM COVERAGE AND NOT A RESTATEMENT OF IT. Coverage counts which
    TARGETS are reachable. Rank counts which DIRECTIONS in the unknown space are constrained. The
    two come apart in a way that is easy to state and has never been measured here: a base with tiny
    coverage can still produce abundant rows, because a concentration statistic says its few
    reachable targets each admit very many decompositions, and every one of those decompositions is
    a DISTINCT equation even though they share a right-hand side. Whether many rows from few targets
    span the space is answered by neither measured quantity, and its answer decides whether the two
    penalties add or multiply.
    THE LOSSY-PROJECTION TEST. The tracked object is the ROW SPACE of the harvested relation matrix,
    projected to its dimension - one integer standing in for a subspace. Violently lossy: it forgets
    which targets, which base elements, the coefficients, the curve and the field, and vast numbers
    of distinct matrices share it. Lossy COMPATIBLY with the operation relation collection performs,
    because appending one harvested row is a rank-one update - the dimension increases by exactly
    zero or one and never more - so the retained integer propagates deterministically under the very
    operation being performed, and the SHAPE of the resulting staircase is a richer reading than its
    endpoint. It is not a change of coordinates: two bases with identical mean and coverage can have
    different kappa, which is exactly the separation the design is for.
    WHY THE CURVE-FREE NULL CARRIES THE BASELINE. The random-base baseline C1 is, in substance, a
    random-matrix fact: rows are nonnegative integer exponent vectors of weight at most the arity
    with a fixed row sum, plus one extra column, and how many such rows are needed to span is a
    question about that row model and not about elliptic curves. A curve-free generator producing
    rows of exactly that shape, with no curve, no group law and no decomposition anywhere, therefore
    reproduces the baseline signature. Running it is what separates "a random factor base saturates
    in 1 + epsilon times B+1 rows" from "rows of this shape saturate in 1 + epsilon times B+1 rows",
    and the standing scope constraint of the pfdr-battery lane requires it here for exactly that
    reason.
  assumptions:
    - >-
      The system is the standard one with B+1 unknowns. If the harness's actual solve uses a
      different unknown set, kappa must be restated for it before any number is quoted; the contract
      fixes the unknown set in writing before the run.
    - >-
      Rank is taken over the prime field of the group order, so exact linear algebra is available and
      no modular accident can occur; for a non-prime group order the reduction to prime-order
      components is done explicitly rather than assumed.
    - >-
      Rows are harvested by exact decomposition enumeration using known logarithms at toy scale, so
      relation collection is a counting operation and not a solver output. NO SOLVE IS RUN and no
      certificate of a solve is claimed.
    - >-
      Targets are drawn with uniform independent coefficients and the harvest order is declared
      before the run.
    - >-
      Panel arms are verified against their labels from the committed source before any cell runs,
      because at least one live harness path builds a named geometry under a different name and has
      NO seed dependence at all, so reporting a seed interval for it would be meaningless.
  proof_search_map:
    not_applicable_reason: >-
      NOT A PROOF-ORIENTED HYPOTHESIS, and the reason is specific rather than a shrug. No theorem,
      certificate family, reduction or asymptotic claim is proposed. The only derivations used are
      elementary and stated inline: that B+1 independent equations require at least B+1 rows, hence
      kappa is at least 1 for every base with no assumption whatever; and that two listed base
      elements sharing an x-coordinate give identical columns, hence rank at most B and kappa
      infinite. The section-8 audits that would otherwise apply are discharged inside the contract's
      controls - the matched random base is the baseline, the duplicated-column base is the positive
      control proving the instrument can see a deficiency it was handed, the row-permutation
      recomputation is the nearby-object control separating a property of the base from a property of
      the harvest order, and the curve-free row generator is the object control that fixes the scope
      of the baseline.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-RNK-1
      formal_statement: >-
        RANDOM-BASE RANK SATURATION. For a uniformly random base of size B in a group of prime order
        N, with relation rows harvested from uniform targets by exact enumeration, the number of rows
        needed for the (B+1)-column coefficient matrix to attain full rank is (B+1) times
        (1 + a term of order 1/N); concretely kappa for the random arm is at most the declared
        threshold at every tested rung and decreasing in N.
      random_model_justification: >-
        THE RIGOROUS HALF is the counting bound kappa at least 1, which holds for every base with no
        assumption and carries the one-sided conclusion regardless of what the random baseline turns
        out to be. THE CLASSICAL DISTRIBUTION STATEMENT IMITATED is the rank distribution of random
        matrices over a finite field - the probability that a few extra uniform rows fail to span
        falls geometrically in the field size - together with standard full-rank results for random
        sparse matrices of bounded row weight. THE GAP, stated plainly: the rows here are neither
        uniform nor independent. They are nonnegative integer exponent vectors of bounded weight with
        a fixed row sum, so they lie in an affine hyperplane, and rows harvested from the same target
        share their last column exactly. Whether that structure costs more than the stated vanishing
        term is what the measurement decides, which is why this is a heuristic and not a lemma - and
        why the curve-free generator with the same row shape is the arm that isolates it.
      supporting_results:
        - >-
          Standard rank statistics of random matrices over a finite field, and full-rank results for
          sparse random matrices of bounded row weight. RECALLED ONLY; no agent in this program has
          opened either source, neither is directly applicable given the affine-hyperplane and
          shared-column structure, and this entry is a pointer for the reviewer that supports nothing.
      validation_experiment_ids:
        - EXP-ICEX-87fbf7
      falsification_condition: >-
        kappa for the matched random arm exceeds the declared threshold at any rung. The heuristic is
        refuted, and with it the one-sided rank bound another record in this program rests on; the
        channel REOPENS. This is the single most valuable way the hypothesis can come out wrong.
    - id: HEUR-RNK-2
      formal_statement: >-
        HARVEST INDEPENDENCE FROM ORDER. For every arm, kappa computed in the declared harvest order
        and kappa computed on a uniformly random permutation of the identical row multiset agree in
        distribution, so kappa is a property of the base and the target draw rather than of the
        harvester's scheduling.
      random_model_justification: >-
        THE RIGOROUS INGREDIENT is that the FINAL rank of a fixed row multiset is order-independent by
        definition of a row space; only the SATURATION POINT can depend on order, and it does so only
        through which rows arrive early. THE CLASSICAL STATEMENT IMITATED is exchangeability: if rows
        were independent and identically distributed the saturation point would be exchangeable and
        order would be irrelevant in distribution. THE GAP: rows are harvested in blocks, one block
        per decomposable target, and blocks are internally correlated, so a target-major order is NOT
        exchangeable with a uniformly permuted one. For a concentrated geometry this is expected to
        bite, and the size of the bite is itself a reportable number.
      supporting_results:
        - >-
          Elementary linear algebra for the order-independence of the final rank; no external source
          is relied on for it.
      validation_experiment_ids:
        - EXP-ICEX-87fbf7
      falsification_condition: >-
        The paired difference between the declared-order and permuted-order kappa exceeds the declared
        per-rung threshold FOR THE RANDOM ARM. kappa is then an artefact of harvest order and no
        cross-geometry comparison in the run stands. If it exceeds threshold only for concentrated
        arms, that is a finding about block correlation and is reported as such rather than as a rank
        result.
  structural_ingredients:
    - description: >-
        The parent proposal's definition of kappa, its four directional claims, its seven controls
        including the duplicated-column positive control, and its growth arm.
      citation: ledger/proposals/IDEA-20260830-f89eaf.yaml
      provenance: internal
      verified_by: >-
        TASK-20260904-8f2f95, coordinator design session, full read of the record on 2026-09-04.
    - description: >-
        The committed conservation finding, which states in its own text that relation rank and
        independence are NOT captured and that the mean scores a rank-deficient base as tied with a
        random base of the same size. That statement is the gap this hypothesis fills.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        IDEA-20260830-f89eaf records a full read of knowledge/findings/KN-FIND-007.md on 2026-08-29
        and quotes the sentence verbatim. TASK-20260904-8f2f95 read that proposal and did NOT open the
        finding; the quotation and every coverage and concentration value taken from it are
        second-hand, and the contract re-reads the finding in its zero-compute stage.
    - description: >-
        The committed battery artifact recording an observed x-coordinate collision as an
        effective-size drop, which is the wild instance of the forced rank deficiency predicted here.
      citation: experiments/EXP-FB3-001/conservation.md
      provenance: internal
      verified_by: >-
        IDEA-20260830-f89eaf records a full read of that artifact in its authoring session.
        TASK-20260904-8f2f95 did not open it; the effective-size figures are second-hand and the
        contract re-reads the artifact before the effective-size accounting is scored.
    - description: >-
        The nearest existing rank proposal in this lane, which measures a DIFFERENT rank invariant -
        displacement rank relative to a declared shift operator - and answers a structured-solve
        question rather than a relation-count question. Neither implies the other.
      citation: IDEA-20260816-dca08c
      provenance: internal
      verified_by: >-
        IDEA-20260830-f89eaf records a full read of that proposal and states the distinction.
        TASK-20260904-8f2f95 did not open it and relies on the distinction for positioning only.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        kappa for the matched random base, per rung, dimensionless ratio to B+1
      direction: different
      minimum_effect: >-
        At most the declared threshold above 1 at every rung, and decreasing in N. A value materially
        above the threshold at any rung falsifies the baseline heuristic and REOPENS the channel.
    - metric: >-
        kappa for the CURVE-FREE row generator - rows of the same shape, same weight bound, same row
        sum, same shared-right-hand-side block structure, with no curve anywhere, dimensionless
      direction: different
      minimum_effect: >-
        Within the declared per-rung resolution of the matched random base. Agreement means the
        baseline is a fact about the ROW MODEL, not about elliptic-curve factor bases, and every
        statement about kappa for a random base must be scoped that way.
    - metric: >-
        minimum over the panel of (kappa for the geometry minus kappa for the matched random base),
        per rung
      direction: different
      minimum_effect: >-
        Predicted no lower than a small negative resolution. A geometry materially below the random
        baseline reaches full rank in fewer relations than random and exhibits a genuine rank
        ADVANTAGE, which would reopen the channel; the metric is stated so it cannot be quietly
        skipped.
    - metric: >-
        kappa for the concentrated small-multiples geometry minus kappa for the matched random base
      direction: higher
      minimum_effect: >-
        Either indistinguishable from zero - supporting the pure-coverage explanation, so the entire
        penalty sits in target trials - or materially positive, supporting the compounding
        explanation. The two readings are mutually exclusive and both are reportable.
    - metric: >-
        kappa for the duplicated-column positive control
      direction: different
      minimum_effect: >-
        FORCED INFINITE. The matrix cannot exceed rank B. A finite value means the rank computation or
        the unknown-set definition is wrong and NOTHING else in the run is readable.
    - metric: >-
        slope of (kappa for the geometry minus kappa for the matched random base) against the
        logarithm of N, per geometry, with a Holm correction across the panel
      direction: different
      minimum_effect: >-
        Predicted flat, with an interval containing zero, since kappa is a ratio to B+1 and carries no
        obvious dependence on N. An interval excluding zero is the ONLY way the rank channel could be
        exponent-relevant, in either direction, and would be the headline. No sign is pre-committed.
    - metric: >-
        agreement between kappa under the declared harvest order and kappa after a random permutation
        of the identical harvested rows
      direction: different
      minimum_effect: >-
        FORCED AGREEMENT within the declared per-rung threshold for the random arm. Disagreement means
        kappa is a property of the harvest order rather than of the base, and every cross-geometry
        comparison in the run is void.
    - metric: >-
        number of DISTINCT decomposable targets contributing rows, per arm per rung
      direction: lower
      minimum_effect: >-
        Predicted far smaller for the concentrated geometry, tracking its recorded coverage ratio.
        Reported as the covariate that makes the discrimination interpretable: if kappa is elevated
        ONLY where the distinct-target count is small, the mechanism is shared right-hand-side columns
        rather than the geometry as such.
  test_boundary:
    instances:
      - >-
        Four group-order rungs spanning at least a factor of sixty-four, with base size set by the
        declared rule and arity three.
      - >-
        A panel of seven arms per rung: matched random (the null), a high-bit interval geometry, a
        small-height geometry, a coset-union geometry, the concentrated small-multiples geometry, a
        low-collision near-ceiling geometry, and a DUPLICATED-COLUMN base as the positive control.
      - >-
        A CURVE-FREE row generator arm at every rung, matched on row shape, weight bound, row sum and
        block structure, with no curve.
      - >-
        Four curves and four seeds per arm per rung, with the seed-variation audit applied to any arm
        whose construction has no seed dependence.
    parameters:
      unknown_set: 'B+1 unknowns, fixed in writing before any cell runs'
      harvest_order: 'declared before the run and recorded; the permuted recomputation uses the identical row multiset'
      infinity_budget: 'a declared multiple of B+1 rows, after which kappa is recorded infinite; the FULL staircase is published so a later reader can re-scope the budget without a rerun'
      resolution: 'kappa is quantised in steps of one over B+1, so the per-rung resolution is computed in the zero-compute stage and thresholds are applied PER RUNG rather than globally'
      arithmetic: 'exact linear algebra over the prime field, with a second independent arithmetic path as a consistency check'
    implementation: >-
      Exact decomposition enumeration on the existing counter plus an incremental rank over the prime
      field, under experiments/EXP-ICEX-87fbf7/driver/. NO Groebner basis is built and NO solver is
      invoked, so the degree-of-regularity memory wall cannot be reached from here and any resource
      stop is an infrastructure failure rather than evidence.
    budget:
      wall_clock_seconds_total: 14400
      maximum_memory_gb: 8
      maximum_runs: 12
  falsification_conditions:
    - >-
      The duplicated-column positive control returns a finite kappa. The rank computation or the
      unknown-set definition is wrong and NOTHING in the run is readable.
    - >-
      kappa under a random row permutation differs from kappa under the declared order by more than
      the per-rung threshold FOR THE RANDOM ARM. kappa is an artefact of harvest order and no
      cross-geometry comparison stands.
    - >-
      kappa for the matched random arm exceeds the declared threshold at any rung. The baseline
      heuristic is falsified, the one-sided rank bound elsewhere in this program is withdrawn, and the
      channel is REOPENED.
    - >-
      Some geometry has kappa materially below the random baseline. A rank ADVANTAGE exists,
      contradicting the no-advantage claim, and the question gains a live channel.
    - >-
      Every panel geometry has kappa indistinguishable from the random baseline at every rung. THE
      PURE-COVERAGE EXPLANATION IS SUPPORTED: structured bases fail through coverage alone, the
      penalties do not compound, and the rank channel closes with a MEASURED band and a stated
      resolution.
    - >-
      A concentrated geometry has kappa materially above the random baseline. THE COMPOUNDING
      EXPLANATION IS SUPPORTED, which strengthens the existing scoped kill rather than weakening it
      and supplies a concrete disqualifying criterion for base selection.
    - >-
      The growth-slope interval excludes zero for any geometry in either direction. The rank channel is
      dependent on the group order, which is the only route by which it could be exponent-relevant, and
      it becomes the run's headline.
    - >-
      The curve-free row generator does NOT reproduce the random baseline. The baseline is not a fact
      about the row model alone; that is a finding in its own right and changes what the baseline may
      be quoted for.
  interpretation_limits:
    - >-
      A kappa value is NOT a solve time and NOT a speedup. No linear-algebra method is run, timed or
      compared; the record measures how many relations must be harvested, not what solving them costs.
    - >-
      The rank channel's best conceivable ADVANTAGE is the random baseline itself, by the counting
      bound. A favourable result here cannot be large, and the hypothesis is expected to close its own
      channel. That asymmetry is stated up front so that a null is not later presented as a
      disappointment.
    - >-
      kappa charges NOTHING for finding the decomposable targets: at toy scale they are found by exact
      enumeration with known logarithms, which is exactly the cost that dominates a real attack and is
      precisely what the coverage channel already accounts for. kappa must never be netted against
      coverage; the two are reported side by side and their product is the honest quantity.
    - >-
      Toy scale, four rungs, generated curves. A growth slope over four rungs is a trend with a wide
      interval, not an asymptotic rate.
    - >-
      Scoped to the standard (B+1)-unknown system. A different formulation of the index-calculus linear
      algebra would have a different kappa and this hypothesis says nothing about it.
    - >-
      If the curve-free row generator reproduces the baseline, the supported statement is about a ROW
      MODEL - bounded-weight nonnegative exponent vectors with a fixed row sum and shared right-hand-side
      blocks - and may NOT be restated as a statement about elliptic-curve factor bases.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-FBG-001
    - IDEA-20260830-f89eaf
    - KN-FIND-007
    - IDEA-20260816-dca08c
    - IDEA-20260829-c6e7a4
  distinguishable_outcomes:
    - outcome: >-
        The positive control is infinite, the permutation check agrees, the random baseline is inside
        its threshold and matched by the curve-free arm, and every geometry's kappa is
        indistinguishable from the baseline including the concentrated one.
      meaning: >-
        The pure-coverage explanation is supported and the rank channel closes with a measured band, a
        stated per-rung resolution, and an explicit scope note that the baseline is a row-model fact.
    - outcome: >-
        The concentrated geometry's kappa is materially elevated.
      meaning: >-
        The compounding explanation is supported. The penalties multiply rather than add, which
        strengthens the existing scoped kill and hands base selection a concrete disqualifying
        criterion.
    - outcome: >-
        Some geometry's kappa is materially below the baseline.
      meaning: >-
        A rank advantage exists. The no-advantage claim is contradicted and the question gains a live
        channel; the result is bounded above by the baseline itself and is stated with that ceiling.
    - outcome: >-
        The random baseline exceeds its threshold.
      meaning: >-
        The baseline heuristic is refuted and the one-sided rank bound elsewhere in this program is
        withdrawn. This is the most valuable way the hypothesis can be wrong.
    - outcome: >-
        The positive control is finite, or the permutation check disagrees for the random arm.
      meaning: >-
        Instrument failure. Nothing in the run is readable in either direction; this is an
        infrastructure and implementation outcome, never negative mathematical evidence.
    - outcome: >-
        The curve-free row generator does not reproduce the baseline.
      meaning: >-
        The baseline is not a property of the row model alone. The measurement stands but its scope
        statement changes, and the difference between the two arms becomes the object worth explaining.
