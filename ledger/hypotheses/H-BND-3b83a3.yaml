    alpha = 1/2 on four toy sizes per domain.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None. Nothing here is conditional on an unproven heuristic; the
    measurement is direct.
  structural_ingredients:
    - description: >-
        Negation-map BSGS halves the search space using the involution
        P -> -P on prime-order groups; the resulting table of about sqrt(r)/2
        entries is the memory axis of the trade.
      citation: >-
        aburan28/crypto@031811fb80958a2efa9a75d0793a8d9f136fdee9:docs/bounds/README.md
        (method registry entry ecbench::generic::bsgs_negation, method id
        ECM1h87f6341629c3) and docs/ecbench/README.md section 7
      provenance: internal
      verified_by: >-
        coordinator subagent, 2026-10-06, read the sealed bound record
        docs/bounds/records/challenge-prime-toy-reference-e1-bsgs-negation.json
        (method.entry, method_id) and the lane README's section 7 pointer
      role: time-memory trade mechanism (P1)
    - description: >-
        Signed-Frobenius classes <sigma, -1> on a Koblitz curve over F_{2^n}
        give A = 2n usable automorphisms, hence floor S = sqrt(pi / 4n); both
        koblitz arms walk on those classes, so the comparison is between two
        constants at the same floor.
      citation: KR-RHO-037e22
      provenance: internal
      verified_by: >-
        coordinator subagent, 2026-10-06, read
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml and the
        per-size automorphisms_available / floor_s fields of
        ECBND1hbc8602528f48 (58, 34, 38, 46 for n = 29, 17, 19, 23)
      role: floor shared by both koblitz arms (P2)
    - description: >-
        A fixed set-up charge appears in a gae = C * r^alpha fit as a fitted
        alpha well below 1/2 over a short size range; both koblitz arms show
        this signature, so their exponents are description, not law.
      citation: >-
        aburan28/crypto@031811fb80958a2efa9a75d0793a8d9f136fdee9:docs/bounds/README.md
        section 4 (as cited by research/ecbench_bounds_challenges_20261006/README.md)
      provenance: internal
      verified_by: >-
        coordinator subagent, 2026-10-06, read the stages blocks of
        ECBND1h1573ea580e89 (setup share_of_gae 0.7157, setup alpha 0.079)
        and ECBND1hbc8602528f48 (setup share 0.3556, setup alpha 0.018)
      role: why P2 is constant-level and toy-scoped
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - id: P1-ops
      metric: >-
        prime toy, paired ops ratio bsgs.negation / rho.negation in
        ecbench.gae over 96 pairs on 4 sizes (verdict axes[ops])
      direction: lower
      minimum_effect: point estimate < 1 and 95 % interval upper bound < 1
    - id: P1-memory
      metric: >-
        prime toy, paired memory ratio (table entries / sqrt r), candidate /
        incumbent (verdict axes[memory])
      direction: higher
      minimum_effect: point estimate > 1 and 95 % interval lower bound > 1
    - id: P2-ops
