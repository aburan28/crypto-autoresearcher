    pre_execution_freeze: >-
      aburan28/crypto docs/bounds/challenges/prime-toy-reference.json
      (ECCH1h904625668686, nonce 20261006) and
      docs/bounds/challenges/koblitz-toy-reference.json (ECCH1h76d71da2a89c,
      nonce 20261008): each fixes the four curves, 8 planted targets per
