    sessions_ran: >-
      prime ECBS1h3a5708ad901b started_unix_ms 1791253765415, finished
      1791253767226; koblitz ECBS1h5eaf9eef9f25 started 1791253767374,
      finished 1791253769222 (session.json of each).
    what_this_record_adds: >-
      The ledger-side falsifiable statement the Coordinator judges the sealed
      verdicts against. Because it post-dates the outcome, its predictions
      are scored as the challenge's own acceptance rule would have scored
      them, and the record carries no pre-registration credit.
  statement: >-
    On the two toy standing challenges at epoch 1, the best already-measured
    alternative beats or trades against the committed incumbent at the
    CONSTANT level only: (P1) on the prime toy domain ECDOM1ha1f283af3a5d,
    bsgs.negation against rho.negation has a paired ops ratio
    (candidate / incumbent, ecbench.gae, 96 pairs on 4 sizes) whose point
    estimate is below 1 with a 95 % interval excluding 1, while its memory
    ratio (table entries / sqrt r) is above 1 with an interval excluding 1,
    i.e. a time-memory trade and not a dominating advance; (P2) on the
    koblitz toy domain ECDOM1h080dd3dc639e, rho.signed_frobenius
    (cap_multiple = 64) against rho.signed_frobenius_strong (dp_bits = 4,
    lanes = 32, step_cap_factor = 2000) is better on BOTH ops and memory with
    intervals excluding 1, because the strong variant's fixed set-up
    dominates its total at toy r; and (P3) in neither challenge do the fitted
    exponents' 95 % intervals separate, so no exponent moves.
  mechanism: >-
    P1: baby-step giant-step with the negation map stores about sqrt(r)/2
    table entries and performs about the same order of group operations as a
    negation-map rho walk, but without the walk's random-mapping overhead
    (collision detection by table lookup instead of by distinguished-point
    walking), so at fixed alpha = 1/2 its constant lands below rho's at the
    price of a sqrt(r) table -- the textbook time-memory trade, nothing
    beyond it. P2: rho.signed_frobenius_strong is a 32-lane lock-step walk
    whose set-up (32 lane scalar multiplications, distinguished-point
    machinery) is a fixed charge of several hundred group-addition
    equivalents; at r between 2^15 and 2^21, where sqrt(r) is itself a few
    hundred, that fixed charge is the majority of the strong walk's total,
    while the lean tuned walk pays a much smaller set-up. The paired ratio
    should therefore be driven by the setup stage, the search stage should
    read closer to 1, and the advantage should shrink as r grows -- which is
    why this is a constant-level, toy-scale statement about the reference
    and not a statement about the strong walk at medium scale.
  assumptions:
    - >-
      The ecbench accounting unit charges one group addition as one unit
      regardless of field cost, so both verdicts are blind to primitive-level
      differences by design (docs/bounds-and-frontiers.md section 1).
    - >-
      Table inserts and lookups (bsgs), canonicalisations (rho variants),
      partition hashes and table queries (strong walk) are counted but not
      priced; both bounds therefore carry bounded: true, and the uncharged
      axis is reported, not deciding.
    - >-
      Both arms and the A/A control are deterministic under shared seeds, so
      the control ratio must read exactly 1.0000 [1.000, 1.000]; a control
      that does not is an instrument fault, not a result.
    - >-
      The incumbent's fresh measurement must fall inside its recorded bound's
      interval (incumbent drift check); otherwise the verdict is inadmissible
      and this hypothesis is not tested.
