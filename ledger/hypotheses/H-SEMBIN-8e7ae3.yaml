hypothesis:
  id: H-SEMBIN-8e7ae3
  question_id: RQ-SEMBIN-9fa4ba
  statement: >-
    On a binary curve of prime extension degree n, an m-summand index calculus
    whose decomposition oracle is a generic m-SUM search cannot fall below the
    van Oorschot-Wiener rho baseline at any summand count without a store whose
    size exceeds rho's entire work. Concretely: the store exponent required for
    any sub-rho cell is bounded below by n/2, so the memory alone costs at least
    what the attack it replaces costs in total.
  statement_note: >-
    The claim is about the FAMILY under a stated oracle class, not about any one
    oracle. It is a conditional negative: it bounds what generic m-SUM can do and
    is silent on a sub-generic oracle, which it names as the surviving route.
  mechanism: >-
    Three terms trade against each other and the trade has no interior win.
    Relations needed grow as |F|. Trials per relation fall as |F|^m against the
    group order. The oracle's own cost rises in |F|, and how fast depends
    entirely on how much it may store: with O(1) store an m-SUM enumeration
    costs |F|^(m-1), and the d and m exponents then cancel exactly, leaving a
    total of 2^n at every m and every factor-base size. Meet-in-the-middle
    breaks that cancellation, but only by buying time with store: time
    |F|^ceil(m/2) against store |F|^floor(m/2). So every bit of sub-rho margin is
    purchased in memory, and the purchase price is set by the same exponent that
    delivers the margin.

    The asymmetry that hid this: rho's total WORK is invariant along its own
    time-memory curve (HEUR-VOW-CURVE), so a store buys the baseline parallel
    wall-clock efficiency but never fewer operations. The index-calculus side's
    store buys operations directly. Costing one side's memory and not the other's
    therefore flatters index calculus by exactly the quantity at issue.
  predictions:
    - >-
      Memory-free enumeration gives a total independent of d and of m, so no
      factor-base tuning and no summand count rescues it.
    - >-
      With store free, the first summand count strictly below the published
      ECC2K-130 reference is m = 8.
    - >-
      The minimum store admitting any sub-rho cell has exponent at least n/2 at
      every m, minimised near m = 8.
    - >-
      No store budget at or below 2^80 admits a sub-rho cell at any binary
      degree the program tracks.
  falsification_condition: >-
    A summand count and factor-base dimension at which the memory-charged total
    falls below the baseline with a store exponent below n/2, under the stated
    oracle class. Equivalently, any cell where the sweep finds sub-rho cost at a
    store the machine could plausibly hold.
  falsification_note: >-
    A sub-generic m-SUM oracle would also falsify the hypothesis as stated, and
    that is the intended reading rather than a loophole: the hypothesis is worth
    holding precisely because refuting it requires exhibiting the one object the
    family has never produced.
  heuristic_assumptions:
    - id: HEUR-GENERIC-MSUM
      statement: >-
        m-SUM over the group of points of a binary elliptic curve admits no
        better generic time-store tradeoff than partial meet-in-the-middle: with
        store |F|^s the time is |F|^(m-s) for s at most floor(m/2).
      random_model_justification: >-
        It is the standard generalised-birthday accounting, and the program has
        one measured point consistent with it: the Riemann-Roch oracle at m = 3
        realises Theta(|F|^2) with constant near 2 and loses to structureless
        pair enumeration, which is exactly the m = 3 case where
        meet-in-the-middle gives no time advantage at all.
      falsification_condition: >-
        An m-SUM algorithm on this group, for any m, with time below
        |F|^(m-s) at store |F|^s. The curve's group structure -- Frobenius,
        the 2-torsion, the low-degree function field -- is where such an
        algorithm would come from, and none of those has produced one here.
      validation_experiment_ids: []
      validation_plan: >-
        Not validated and not validatable by this contract, which is a
        derivation. The measured m = 3 anchor is a single consistent point, not a
        validation. A direct attempt at a sub-generic m-SUM oracle on this group
        is the successor this hypothesis points at, and it is the honest place
        for the family's remaining budget.
      status: unvalidated
    - id: HEUR-VOW-CURVE
      statement: >-
        vOW total work is 0.886 * 2^(n/2), independent of store size and
        processor count; wall time is W(1/M + 1/w); memory is 3n max(w, M) bits.
      random_model_justification: >-
        Inherited from H-SEMBIN-97ea23 (status: supported), where it is stated
        and justified.
      falsification_condition: >-
        As recorded there: a store size or processor count at which measured
        total work departs from 0.886 * 2^(n/2) by more than the 0.5 bits
        separating this corpus's two walk constants.
      validation_experiment_ids: []
      status: unvalidated
  structural_ingredients:
    - >-
      The product law's independence of dim V, which is what makes the summand
      count rather than the factor base the only free parameter worth sweeping.
    - >-
      Work-invariance along the vOW curve, which is what makes charging the
      oracle's store a fair rather than a punitive comparison.
    - >-
      The measured m = 3 coincidence between the family's implicit base and the
      generic prediction, which anchors the oracle exponent empirically at one
      point instead of assuming it everywhere.
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. The statement is about concrete store exponents at named
    degrees, not about an exponent in n, and dressing it as asymptotic would
    invite the promotion gates of docs/target-result-profile.md Part D for a
    claim it does not make.
  proof_search_map: null
  proof_search_map_note: >-
    Null because this is not a proof-oriented proposal in the sense of
    docs/inventor-protocol.md section 8: it proves nothing about the object, it
    prices a family under a stated oracle class. The one place a proof belongs is
    HEUR-GENERIC-MSUM, and that is named as unvalidated rather than assumed
    proved.
  status: specified
  status_note: >-
    `proposed` as authored. Only the Coordinator moves this, and nothing here has
    been run.
  status_history:
    - status: proposed
      at: '2026-09-28'
      by: coordinator
      note: authored with no contract approved and nothing run
    - status: specified
      at: '2026-09-28'
      by: coordinator
      decision: DEC-20260928-7c3d91
      note: >-
        A frozen, approved contract now specifies this hypothesis's test:
        EXP-SEMBIN-04ec3c, approved 2026-09-28 with pre-approval amendments
        A1-A8. `specified` and NOT `approved`: this program records experiment
        approval on the experiment, where AGENTS.md rule 1 puts it, and advancing
        the hypothesis in the same act would add nothing while reading downstream
        as endorsement. Approval of a protocol asserts nothing about the truth of
        its hypothesis.
  status_ceiling:
    binding: true
    decision: DEC-20260928-7c3d91
    ceiling: analyzed
    reasons:
      - >-
        HEUR-GENERIC-MSUM is `unvalidated` with `validation_experiment_ids: []`.
        Under agents/coordinator.md promotion gate 2 an unvalidated heuristic
        caps the claim below `supported`, and this heuristic carries the entire
        statement.
      - >-
        One derivation run cannot reach `replicated`.
      - >-
        Four of the five scored predictions are consequences of the cost model
        rather than searches (EXP-SEMBIN-04ec3c amendment A2), so their
        confirmation is evidence about an implementation, not about the model.
    what_this_does_not_do: >-
      It does not weaken the hypothesis and does not deprioritise it. The ceiling
      is on the STATUS, not on the work: the route above `analyzed` is validating
      HEUR-GENERIC-MSUM, which is named as this hypothesis's own successor and is
      scheduled by DEC-20260928-7c3d91 rather than left to `validation_plan`
      prose.
  question_id_attribution_ruling:
    decision: DEC-20260928-7c3d91
    ruling: >-
      `question_id: RQ-SEMBIN-9fa4ba` IS MIS-ATTRIBUTED AND IS LEFT UNEDITED.
      RQ-SEMBIN-9fa4ba is GOAL-SEMBIN-cbf422's question and its four objects are
      chain length t = m, path chaining topology, low-degree subspace V, and the
      absorbed n^{4 omega} cofactor. None of them is the decomposition oracle's
      store. The memory-charged cost lane is GOAL-SEMBIN-5078bc's: its objective
      item (4) COST asks for time AND memory against a rho comparator with
      negligible memory (KN-OPEN-86e7e1), its completion criterion 4 asks for
      exactly a time-and-memory record against vOW parallel rho with a tradeoff
      curve in m, H-SEMBIN-97ea23 -- the supported baseline-coherence result this
      hypothesis builds on -- is that goal's, and GOAL-SEMBIN-cbf422's own
      committed identifier note states that "the memory-charged crossover work is
      EXP-SEMBIN-f4a17b under GOAL-SEMBIN-5078bc".
    effect: >-
      The owning goal is GOAL-SEMBIN-5078bc. RQ-SEMBIN-9fa4ba is read as a
      SECONDARY attribution, which is defensible on its cofactor limb and its
      constraint that a trade leaving the exponent alone is still a result. The
      field is not edited because that is a content change to a record, not a
      lifecycle move; a superseding record is the remedy if the secondary reading
      is ever insufficient.
    binding_consequence: >-
      This hypothesis and EXP-SEMBIN-04ec3c DISCHARGE NO COMPLETION CRITERION OF
      EITHER GOAL. In particular they do not discharge GOAL-SEMBIN-5078bc
      criterion 4, which names the CHAINED-S_3 index calculus whose stage-1 cost
      carries the n^{4 omega} Groebner cofactor; this contract deliberately
      admits no Groebner cost at all. Reporting an oracle-family cost sweep as
      progress against that criterion is the error CORR-20260916-402547 corrects
      on a sibling campaign and EV-ICPERF-10c5fc warns about in its own
      completion_criteria_impact block.
  dominated_by: null
  dominated_by_note: >-
    Checked rather than defaulted. No record in this program bounds the
    decomposition-oracle family by memory at any summand count; the committed
    free-oracle floor charges the oracle nothing at all, and the measured panel
    is m = 3 only. The nearest frontier row is KN-FIND-aa2efc, which this
    extends from one arity to all of them by adding the resource it left free.
  sota_delta: >-
    Quantitative claim: converts a known m = 3 negative into a family-wide bound
    over all m by pricing the one resource the existing floor table leaves free.
    If P3 holds, the delta is that the family's entry price is stated in bits of
    store for the first time rather than left open.
  created_at: '2026-09-28'
  owner: coordinator
