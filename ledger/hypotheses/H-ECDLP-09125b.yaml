hypothesis:
  id: H-ECDLP-09125b
  question_id: RQ-ECDLP-c1b7b1
  goal_id: GOAL-ECDLP-001
  added: '2026-09-11'
  derived_from_idea: IDEA-20260911-2dd68d
  instrument_idea: IDEA-20260905-dacf4f
  repairs_claim_of: H-ECDLP-6a9479
  statement: >-
    THIS HYPOTHESIS EXISTS SPECIFICALLY TO MAKE H-ECDLP-6a9479 CLAIM (3)
    DECIDABLE where EXP-ECDLP-a26bde's original test design could not (see
    DEC-20260911-74c9dc rationale B and EV-ECDLP-95ec68's inference/
    unresolved_confounds): that design pooled a mathematical tautology
    (m=1) with genuine trials and used a 3/p falsification threshold below
    the 68-sample ladder's coarsest measurable nonzero rate (1/68), so no
    outcome of it could have discriminated "no systematic linearity" from
    "one coincidence". This record states the REPAIRED, resolution-matched
    version of the same claim. SCOPE: the same five frozen global curves of
    H-ECDLP-6a9479/EXP-ECDLP-a26bde plus one new engineered positive-control
    curve (A=5, B=10, (x0,y0)=(1,4), doubling slope lambda=1 exactly, giving
    2S^=(-1,-2) over Q by construction), each reduced at toy primes in
    [2^10,2^14) selected by the identical seeded procedure
    (driver/curves.py) and criteria as the original five. CLAIM: after (i)
    excluding the m=1 entry as a mathematical tautology (the same
    torsion-defect-digit function called twice on identical arguments,
    never an independent trial; confirmed by direct reading of
    experiments/EXP-ECDLP-a26bde/driver/stage23.py lines ~124-135), (ii)
    excluding, via an explicit pre-registered cross-prime screen, any
    tested multiple m whose x-coordinate (for section s_x) or y-coordinate
    (for section s_y) reduces to a global rational value of exactly +1 or
    -1 at EVERY one of a curve's tested primes simultaneously -- the only
    rationals that are (p-1)-th roots of unity for every odd prime p, hence
    the only possible source of a prime-independent, recurring "free"
    agreement under a Teichmuller-style lift (elementary: any root of unity
    has archimedean absolute value 1, and the only rationals of absolute
    value 1 are +-1) -- and (iii) using a per-instance sample size N_i =
    ceil(20 * p_i) chosen so the chance-level expected agreement count
    mu_0_i = N_i / p_i >= 20 (making a 3x-chance systematic effect
    statistically resolvable at alpha=0.01, not merely "more than one hit
    in 68 tries"): two INDEPENDENTLY REALIZED canonical non-homomorphic
    contrast sections -- s_x (Teichmuller-lift x, Hensel-lift y; the
    existing instrument.teichmuller_section, reused unmodified) and s_y
    (Teichmuller-lift y, Hensel-lift x from the cubic; a new, symmetric,
    independently coded construction) -- will each show a pooled
    post-exclusion agreement-rate ratio rho_hat = (observed agreements) /
    mu_0 whose 95% exact-Poisson CI is consistent with 1 and excludes any
    value >= 3, jointly with a one-sided Poisson test at alpha=0.01, across
    the 20 original (curve,prime) instances plus 4 new positive-control
    instances. A third, seeded pseudorandom-digit null-object section
    s_rand (no possible +-1-type degeneracy by construction) must
    simultaneously read as chance (95% CI contains 1) as a validity control
    on the statistic and null model themselves. The positive-control
    curve's known m=2 coincidence must be flagged by the cross-prime screen
    on 4/4 of its tested primes, independently confirming the screen
    catches the exact degeneracy class it was built to catch. This makes
    claim (3), AS AMENDED, decidable at toy scale for the first time:
    falsifiable both by a resolvable excess (rho_hat_x or rho_hat_y's CI
    with lower bound >= 3, jointly with p < 0.01) and by instrument failure
    (screen blind to the positive control, or s_rand's CI excluding 1),
    with the two kept as distinct, non-conflatable verdicts.
  mechanism: >-
    This mechanism is the same one EV-ECDLP-95ec68 and DEC-20260911-74c9dc
    identified as the reason H-ECDLP-6a9479 claim (3) could not be decided,
    restated as a repaired test design rather than a diagnosis. No "safe"
    replacement section immune to the +-1 degeneracy exists among
    Teichmuller-style (multiplicative-root-of-unity) lifts of a rational
    coordinate: since Q's only roots of unity are +1 and -1, whichever
    coordinate (or fixed rational transform of it) is Teichmuller-lifted,
    its universal-degeneracy set is always exactly {+1,-1} relabelled,
    never empty and never avoidable by choice of transform. The correct fix
    is therefore not a redesigned "safe" section but (1) a decidable,
    pre-registered EXCLUSION rule for this named, proven degeneracy class
    and (2) a second construction realized differently enough that its own
    instance of the same degeneracy fires at a different, essentially
    disjoint set of m (verified per curve, not assumed), giving
    cross-validation instead of false independence -- e.g. curve 2 hits
    x=-1 at m=2 but y(2S^)=-4, not +-1, so s_y is a genuine independent
    check on the SAME curve, not a relabelling of the same accident.
    GROUNDING FOR NON-HOMOMORPHISM (not assumed): KN-TECH-73630e proves any
    section of <S> -> E^(Q_p) other than the (unique) torsion section t is
    automatically non-homomorphic (E_1 is pro-p and torsion-free, so no
    nonzero homomorphism from an order-n group with gcd(n,p)=1 exists into
    it); s_x and s_y are already confirmed in EXP-ECDLP-a26bde's committed
    raw data to diverge from t at generic m (e.g. RUN-ECDLP-a26bde-009,
    m=3: d_mS=5536 vs u_mS=4238), so both are non-homomorphic by this
    theorem with no separate proof needed per section. WHY THIS IS A
    REPAIR OF H-ECDLP-6a9479 CLAIM (3) SPECIFICALLY: that hypothesis's
    prediction ("rate at most 3/p, never systematically") is restated here
    verbatim in substance, with the tautology removed, the threshold
    resolution-matched to a sample size chosen to resolve it, and the one
    named confound (curve 2's doubling-slope-1 coincidence) turned into an
    engineered, independently-verifiable positive control rather than an
    unplanned artifact discovered post hoc. A "supported" outcome here is
    evidence about the repaired test, at toy scale, consistent with (but
    not a new proof of) KN-TECH-73630e's uniqueness theorem; it does not
    retroactively change H-ECDLP-6a9479's own `analyzed`/claim-(3)-`refine`
    status, which remains an immutable record of what THAT evidence showed.
  assumptions:
    - >-
      Good ordinary reduction, gcd(n,p)=1, #E(F_p) != p at every tested
      instance, exactly as EXP-ECDLP-a26bde's scope; the new engineered
      curve's four reduction primes are generated and filtered by the same
      seeded procedure (driver/curves.py) with the same criteria.
    - >-
      Reduction mod p^K commutes with the elliptic-curve group law (a
      standard ring-homomorphism fact about the group law's polynomial
      formulas, not a heuristic); this licenses computing [m]S mod p^K via
      padic.pmul for arbitrarily large integer m without ever forming the
      exact global rational mS^.
    - >-
      Q's only roots of unity are +1 and -1 (elementary, not a heuristic:
      any root of unity has archimedean absolute value 1, and the only
      rationals of absolute value 1 are +-1); this is the sole basis for
      the claim that the Teichmuller-lift degeneracy's exact set over Q is
      {+-1} and nothing else, for any coordinate or fixed-rational-multiple
      transform of it. Only the cross-prime SCREEN used to detect this
      cheaply (heuristic H2 below) is heuristic, not the underlying fact.
    - >-
      KN-TECH-73630e's uniqueness theorem is taken as proven (not
      re-derived); it licenses treating s_x, s_y and s_rand as
      non-homomorphic without a separate homomorphism-failure proof for
      each, given each is already confirmed to diverge from t at generic m
      in the existing raw data.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is an empirical measurement/control repair of an existing
      experiment's test design, not a proof-oriented claim, and
      docs/inventor-protocol.md section 8's proof-architecture gate does
      not apply. Checked specifically against the risk of smuggling a proof
      claim in via the "decidable" framing: "decidable" here means only
      that the pre-registered statistic (a joint alpha=0.01 significance /
      effect>=3 bar on an exact-Poisson CI) can, by construction, land on
      one side or the other given the achieved sample size -- a statement
      about statistical resolving power, not about mathematical
      provability. No theorem is proved or claimed here; a "supported"
      outcome is toy-scale empirical evidence consistent with
      KN-TECH-73630e's uniqueness theorem (already proven, cited, and
      unchanged by this record), never a re-derivation or strengthening of
      it. The relevant audit is the null-object control (s_rand) and the
      known-coincidence positive control, not a proof architecture.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null, mirroring H-ECDLP-6a9479: this is a statistical
    repair of one contrast-arm test, not a complexity claim of any kind.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a non-homomorphic contrast section s (s != t at generic points,
        by KN-TECH-73630e), the digit d(s(mS)) behaves, over the tested
        m-ladder, as an approximately uniform, approximately independent
        draw from Z/pZ, so P(d(s(mS)) = m*d(s(S)) mod p) ~= 1/p per
        non-degenerate trial.
      random_model_justification: >-
        The same "no algebraic structure forcing linearity, hence uniform"
        modeling choice used for unrelated pseudorandom functions/hash
        digests; not a theorem about elliptic-curve formal groups.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-e36df2]
      falsification_condition: >-
        s_rand's own measured rho_hat (a section engineered to have zero
        structure) departs from chance (its 95% CI excludes 1), which
        would falsify H1 or the statistic itself independent of anything
        observed on s_x/s_y; additionally, per-instance chi-square
        goodness-of-fit of the empirical digit distribution against
        Uniform(Z/pZ) for s_x and s_y, reported alongside the main
        statistic at no extra compute cost.
    - id: H2
      statement: >-
        A multiple m for which x(mS) mod p_i (or y(mS) mod p_i) lies in
        {1, p_i-1} SIMULTANEOUSLY for every one of a curve's k (~4-8)
        tested primes has probability ~(2/p_avg)^(k-1) of being an
        accidental multi-prime coincidence rather than a genuine global
        rational identity x(mS^) = +-1 (or y(mS^) = +-1) exactly; this
        false-positive rate is treated as negligible (e.g. ~10^-11 to
        10^-16 for the tested prime range) against the achieved sample
        sizes.
      random_model_justification: >-
        A standard CRT-flavored equidistribution heuristic modeling the
        residues of a fixed rational number modulo distinct, unrelated
        primes as independent draws, for the purpose of an ensemble-level
        false-positive-rate estimate over the family of tested m -- not a
        claim about any single fixed rational. The converse direction (an
        exact +-1 identity forces agreement at every prime of good
        reduction) is a theorem, not part of this heuristic.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-e36df2]
      falsification_condition: >-
        Tabulating the per-prime base rate of x(mS) mod p_i in {1,p_i-1}
        on EXP-ECDLP-a26bde's already-committed raw data (free) and on this
        experiment's new ladder shows a rate inconsistent with ~2/p_i, or
        a screen-flagged multiple small enough for exact verification turns
        out NOT to be exactly +-1 (a directly falsifying counterexample to
        the screen's reliability at that scale).
  structural_ingredients:
    - description: >-
        Uniqueness of the homomorphic prime-to-p torsion section (any
        other section is automatically non-homomorphic).
      citation: KN-TECH-73630e
      provenance: internal
      verified_by: claude-code-session 2026-09-11 (read in full, this dispatch)
      role: licenses treating s_x, s_y, s_rand as non-homomorphic without a separate per-section proof
    - description: >-
        The exact algebraic derivation that curve 2's doubling slope
        lambda=(3*1+9)/(2*6)=1 gives 2S^=(-1,-4) exactly over Q, and that
        1 and -1 are, for every odd prime, exact (p-1)-th roots of unity
        reproduced with zero p-adic correction by teichmuller_lift_scalar
        and hensel_lift_sqrt.
      citation: experiments/EXP-ECDLP-a26bde/analysis.md
      provenance: internal
      verified_by: claude-code-session 2026-09-11 (read in full, hand-checked the arithmetic, this dispatch)
      role: the mechanism explaining the confound this hypothesis is designed to exclude/control for
    - description: >-
        Claim (3)'s exact original statement and the carve-out diagnosing
        exactly the two design defects (m=1 tautology; unresolved 3/p
        threshold) this hypothesis's test design repairs.
      citation: H-ECDLP-6a9479
      provenance: internal
      verified_by: claude-code-session 2026-09-11 (read in full, this dispatch)
      role: the hypothesis this record exists to make decidable
    - description: >-
        The pooled 24/1360 and corrected 4/1340 statistics, the m=1
        tautology, and the curve-2/m=2 instrument-artifact explanation,
        each independently re-derived by the reviewing dispatch.
      citation: EV-ECDLP-95ec68
      provenance: internal
      verified_by: claude-code-session 2026-09-11 (read in full, this dispatch)
      role: the evidence record establishing the confound and next_actions this hypothesis executes
    - description: >-
        Rationale block B's carve-out of claim (3) as `refine`, and the
        next_actions this hypothesis and its experiment implement in full.
      citation: DEC-20260911-74c9dc
      provenance: internal
      verified_by: claude-code-session 2026-09-11 (read in full, this dispatch)
      role: the coordinator decision this record and EXP-ECDLP-e36df2 discharge
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: teichmuller_x_pooled_rate_ratio (s_x, post m=1 and post cross-prime-degeneracy exclusion, pooled over 20 original + 4 positive-control instances)
      direction: different
      minimum_effect: >-
        95% CI for rho_hat_x contains 1.0 and its upper bound is strictly
        below 3.0 (indistinguishable from chance, inconsistent with any
        systematic effect at or above the original 3/p bound).
    - metric: teichmuller_y_pooled_rate_ratio (s_y, independently-realized construction, identical statistic)
      direction: different
      minimum_effect: >-
        Same band as s_x (CI contains 1.0, upper bound < 3.0), AND required
        to agree in verdict with rho_hat_x (both inside the band, or both
        outside it); a split verdict is reported as an open confound, not
        resolved by either reading alone.
    - metric: positive_control_screen_flag_rate (engineered curve, m=2, across its 4 reduction primes)
      direction: higher
      minimum_effect: >-
        Flagged as x-degenerate on 4/4 of the engineered curve's tested
        primes at m=2; failure to flag on any of the 4 is an instrument
        defect in the screen itself, not a finding about claim (3).
    - metric: random_control_rate_ratio (s_rand, seeded pseudorandom-digit null object, same statistic, no exclusion needed)
      direction: different
      minimum_effect: >-
        95% CI for rho_hat_rand contains 1.0. A CI excluding 1.0 means the
        chance-level null model or the s_rand implementation itself is
        broken, invalidating any reading of rho_hat_x / rho_hat_y until
        fixed.
  test_boundary:
    instances:
      - the same five global curves and 20 (curve,prime) pairs frozen for EXP-ECDLP-a26bde (experiments/EXP-ECDLP-a26bde/frozen_curves_and_primes.json), reduced ladder unchanged in curve/prime identity but extended in m
      - one new engineered positive-control curve (A=5, B=10, x0=1, y0=4, lambda=1, 2S^=(-1,-2)) with 4 reduction primes selected by the identical seeded driver/curves.py procedure and criteria, in the same [2^10,2^14) bit range
    parameters:
      m_ladder_per_instance: "m = 2..N_i+1 (skipping n | m), N_i = ceil(20 * p_i); m=1 computed once as the baseline, outside the loop"
      alpha: 0.01
      minimum_resolvable_effect: 3x chance rate
      mu_0_target: 20
    implementation: >-
      A NEW driver under experiments/EXP-ECDLP-e36df2/driver/, reusing or
      adapting (never modifying in place) EXP-ECDLP-a26bde/driver/
      instrument.py's padic.pmul, split_point, teichmuller_lift_scalar and
      teichmuller_section; EXP-ECDLP-a26bde's own driver/, runs/ and
      specification.yaml are frozen artifacts of 22 already-official runs
      (cited by EV-ECDLP-95ec68) and are not touched by this hypothesis's
      test.
    budget:
      wall_clock_seconds_per_run: null
      total_cpu_hours: 6
      maximum_memory_gb: 6
      maximum_runs: 25
  falsification_conditions:
    - >-
      rho_hat_x's or rho_hat_y's 95% CI has a lower bound >= 3, jointly
      with a one-sided Poisson p < 0.01 (systematic, resolvable excess over
      chance): claim (3) as amended is FALSE; the "never systematically"
      prediction is wrong and the digit dynamics of s_x/s_y need
      re-derivation. This is a real possible outcome, not excluded by
      design.
    - >-
      The cross-prime screen fails to flag the engineered positive
      control's known m=2 coincidence on any of its 4 primes: the corrected
      instrument is defective, and no claim-3 verdict from this run is
      trustworthy until fixed.
    - >-
      s_rand's 95% CI excludes 1.0: the chance-level null model itself (or
      the s_rand implementation) is broken; nothing about claim (3) can be
      read from rho_hat_x/rho_hat_y until this is resolved.
    - >-
      The Stage 0 pmul-vs-exact-Fraction regression check shows any
      mismatch on the existing m=1..256 data: the new computation path is
      not faithful and the whole Stage 2/3 design must be re-derived before
      trusting results at m beyond 256.
    - "Crashes, timeouts, memory exhaustion at any stage: infrastructure, never negative mathematical evidence (AGENTS.md rule 5)."
  interpretation_limits:
    - >-
      Toy tier throughout, identical scope to H-ECDLP-6a9479: 5 original
      curves plus 1 engineered curve, primes in [2^10,2^14), no transfer to
      cryptographic scale claimed or implied.
    - >-
      This record repairs and tests claim (3) alone; it does not re-litigate
      claims (1), (2) or (4) of H-ECDLP-6a9479, already `support`-ed at
      strength `strong`, and its outcome cannot change H-ECDLP-6a9479's
      immutable `analyzed` status or status_note -- only this record's own
      status changes as evidence comes in.
    - >-
      A "supported" outcome (rho_hat consistent with chance on both s_x and
      s_y, with both controls passing) is a toy-scale empirical measurement
      consistent with KN-TECH-73630e's uniqueness theorem, not a new proof
      of it; the theorem is assumed, not re-derived.
    - >-
      No attack and no exponent claim anywhere in this record: every
      multiple tested is generated from a global point whose scalar m is
      known to the generator; nothing here recovers an unknown discrete
      log.
  distinguishable_outcomes:
    - outcome: >-
        Stage 0 passes (0 mismatches); both rho_hat_x and rho_hat_y's CIs
        contain 1 and exclude any value >= 3; s_rand's CI contains 1; the
        positive control is flagged 4/4 at m=2.
      meaning: >-
        Claim (3) as amended is supported at toy scale, at this repaired
        resolution: no systematic linearity is resolvable, and the
        instrument (screen, null control) behaves as designed. Closes
        DEC-20260911-74c9dc's carve-out.
    - outcome: >-
        Stage 0 passes; the positive control and s_rand controls pass; but
        rho_hat_x's or rho_hat_y's CI has a lower bound >= 3 with p < 0.01.
      meaning: >-
        Claim (3) as amended is falsified: a systematic, resolvable excess
        exists, contradicting the "never systematically" prediction and
        requiring re-derivation of the digit dynamics.
    - outcome: >-
        rho_hat_x and rho_hat_y disagree in verdict (one inside the band,
        one outside).
      meaning: >-
        Reported as an open, unresolved confound; neither a support nor a
        falsification of claim (3) from this run alone.
    - outcome: >-
        Stage 0 shows any mismatch, OR the positive control's screen fails
        to flag its known m=2 coincidence on any prime, OR s_rand's CI
        excludes 1.
      meaning: >-
        Instrument invalidation, not a claim-3 verdict either way; the
        defect is fixed and the test re-run before any reading of
        rho_hat_x/rho_hat_y is trusted.
    - outcome: Crashes, timeouts, memory exhaustion at any stage.
      meaning: Infrastructure failure; never negative mathematical evidence (AGENTS.md rule 5).
  prior_evidence_refs:
    - H-ECDLP-6a9479
    - EV-ECDLP-95ec68
    - DEC-20260911-74c9dc
  status: proposed
  proposed_by: coordinator
  specified_by: coordinator, 2026-09-11, per /design-experiment IDEA-20260911-2dd68d
