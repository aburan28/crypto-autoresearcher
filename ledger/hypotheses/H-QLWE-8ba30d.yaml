# H-QLWE-8ba30d — specified from IDEA-20261005-9f4777.
# Protocol approval is DEC-20261005-2bfd2c. No lattice was built and no
# log-unit decoder was run in this design. No Ring-LWE attack and no
# exponent improvement is claimed.
hypothesis:
  id: H-QLWE-8ba30d
  question_id: RQ-QLWE-9108dc
  source_proposal: IDEA-20261005-9f4777
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-QLWE-9108dc.yaml does not name a goal_id in the
    record read on 2026-10-05. This design does not attach one.
  status: approved
  status_note: >-
    approved means the control protocol in EXP-QLWE-d3a060 is approved
    for a later executor. It does not mean a log-unit certificate was
    observed, and it does not mean Ring-LWE or NTRU is broken. Status
    moves only by DEC-20261005-2bfd2c under the standing user
    authorization of 2026-09-06.
  proposed_by: coordinator
  conversion_note: >-
    The four cells, the certificate bit, the fatigue ratio, the
    structure-blind BKZ column, and the reported Ideal-SVP label
    exp(O~(sqrt(n))) are carried from IDEA-20261005-9f4777. The
    Coordinator pre-registered the separated reading: certificate 1
    only on the degree-128 cyclotomic principal ideal, certificate 0
    on ternary NTRU, on plain LWE, and on the coefficient-isometry
    module cell, with the approximation-factor label attached only
    beside the certificate. That choice was fixed before any run.
    The three mechanisms stay in three assignment rows.

  statement: >-
    TEST BOUNDARY. Ambient dimension 128. Cell A is one principal
    ideal in Z[x]/(x^128+1) with a planted generator whose
    coefficients lie in {-1,0,1}. Cell B is ternary NTRU in
    Z[x]/(x^64+1) at q=32 and at q=1024. Cell C is plain LWE, a
    q-ary lattice of dimension 128 at q=32 with a ternary secret and
    no ring. Cell D is a rank-2 module lattice of dimension 128 over
    Z[x]/(x^64+1) at q=32 whose only added symmetry is the
    coefficient map x |-> x^5, with no NTRU trapdoor. No other
    dimension, modulus, or secret law is in scope. The quantum
    class-group step and the Stickelberger close-principal-multiple
    step are not run.

    PRE-REGISTERED PREDICTION, fixed before any run. The classical
    log-unit certificate is 1 on cell A and 0 on cells B, C, and D.
    The label exp(O~(sqrt(n))) is recorded only on a vector that
    carries that certificate. At degree 128 the illustration of that
    reported label is exp(sqrt(128)), about 8.19e4. BKZ approximation
    factors do not receive the label.

    DISTINGUISHABLE OUTCOMES. The three mechanisms are not one
    result. (1) Certificate 1 on A, with the label attached only
    there, assigns to the cyclotomic ideal. (2) Certificate 0 on both
    NTRU moduli, with the fatigue ratio recorded and no label,
    assigns to NTRU. (3) Certificate 0 on plain LWE because there is
    no unit lattice, with the BKZ factor unlabeled, assigns to plain
    LWE. (4) Certificate 1 on B, C, or D falsifies specificity.
    Certificate 0 on A falsifies detection. A BKZ-factor match
    between A and C within a factor of 2, together with certificate
    0 on A, is a BKZ artifact and assigns to none of the three.
    Disagreement across the two seeds, a domain-check bug, or a
    crash is inconclusive.

  mechanism: >-
    The tracked object is the log-unit decoding certificate: a
    generator recovered by decoding in the log-embedding of the unit
    lattice of the cyclotomic field Q[x]/(x^128+1). That projection
    discards the ideal's non-unit data and still propagates under the
    unit-group action, so it is lossy rather than a change of
    coordinates. Cell A is the only cell inside that domain. Cell B
    is an NTRU lattice. Its structural feature, when the fatigue
    ratio crosses 1, is a dense sublattice, which is a different
    mechanism and does not supply this certificate. Cell C has no
    ring and no unit lattice, so the certificate is undefined there
    and the recorded bit is 0 with reason no_unit_lattice. Cell D
    applies a coefficient isometry. It does not supply the degree-128
    cyclotomic unit lattice. KN-TECH-046, read in this design
    session, reports Ideal-SVP in quantum polynomial time at
    approximation factor exp(O~(sqrt(n))) on cyclotomic ideal
    lattices, and it does not claim that Ring-LWE at polynomial
    approximation factors is broken. This hypothesis measures which
    cell receives the certificate. It does not move that factor.

  assumptions:
    - The toy certificate is the classical log-unit decoding step on a planted principal ideal. The quantum class-group computation and the Stickelberger step are not run.
    - Same ambient dimension 128 is the match across cells. Ring degree is 128 on cell A and 64 on cells B and D, because those constructions embed in dimension 2n and k*n.
    - Ternary planted generator and ternary NTRU and LWE secrets. No other secret law.
    - The exp(O~(sqrt(n))) label is the published ceiling from KN-TECH-046. It is not a BKZ output and it is not re-derived here.
    - n in the NTRU fatigue formula is the ring degree 64, not the ambient dimension.

  proof_search_map:
    bottleneck: >-
      The classical log-unit decoding step on a principal ideal of
      Z[x]/(x^128+1). Removing it leaves only the structure-blind BKZ
      baseline, which does not carry the certificate.
    baseline_embedding:
      parameter_slice: >-
        One fixed BKZ block size beta = 20 on cells A, B, and C at
        ambient dimension 128. The block size is frozen before any run.
      reproduction_check: >-
        Record the BKZ approximation factor of each returned vector in
        a column separate from log_unit_certificate. The baseline
        column does not receive the label exp(O~(sqrt(n))).
    observation_collision:
      observable: >-
        The pair (cell id, log_unit_certificate in {0,1}), plus
        whether the exp(O~(sqrt(n))) label was attached.
      distinct_preimage_search: >-
        Cells B, C, and D are distinct inputs that must not map to
        certificate 1. A certificate of 1 on any of them is a
        collision and falsifies specificity.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of the log-embedding decoder on principal ideals
          of Z[x]/(x^128+1), scored by equality with a torsion-unit
          multiple of the planted generator.
        predicted_gain: >-
          A discriminator between the cyclotomic ideal and the other
          three cells. No change to the approximation exponent.
    quantifier_order: >-
      For the planted principal ideal in Z[x]/(x^128+1), the
      certificate is an ideal-lattice object at the reported factor
      exp(O~(sqrt(n))). The statement is not "there exists an
      average-case Ring-LWE sample at a polynomial approximation
      factor that this decoder solves." The quantifiers do not move
      from a worst-case cyclotomic ideal at large gamma to
      average-case Ring-LWE at small gamma.
    method_ceiling:
      strongest_certifiable_claim: >-
        At dimension 128 the certificate is present on the planted
        cyclotomic principal ideal and absent on ternary NTRU, plain
        LWE, and the coefficient-isometry module cell, and the
        published label is attached only with the certificate. No
        exponent moves. No deployed system is affected.
      nearby_object_control: >-
        Plain LWE of dimension 128 with no ring; ternary NTRU at q=32
        and at q=1024; a rank-2 module lattice whose only added map
        is x |-> x^5.
    proof_obligations:
      - claim: >-
          Certificate 1 means the decoder returned an element equal to
          plus or minus x^k times the planted generator in
          Z[x]/(x^128+1).
        responsibility: correctness
      - claim: >-
          Cells B, C, and D are outside that domain, and a coerced
          embedding that manufactures a degree-128 ideal from them
          invalidates the run.
        responsibility: interface
      - claim: >-
          The strongest reading is a toy discriminator. It is not an
          attack cost.
        responsibility: scope
    not_applicable_reason: >-
      The map applies. No audit is omitted. This record is a control,
      not a proof that the approximation factor improves.

  asymptotic_claim:
    problem: none — no Ring-LWE, Module-LWE, or NTRU attack is claimed
    prior_best: >-
      Ideal-SVP in quantum polynomial time at approximation factor
      exp(O~(sqrt(n))) in cyclotomic fields, as reported by KN-TECH-046.
    time_exponent: unchanged; this control does not move the published exponent
    memory_exponent: unchanged; this control does not move the published exponent
    hidden_cofactor: >-
      The O~ in exp(O~(sqrt(n))) hides polylog factors in the published
      statement. Not re-derived. No new overhead is claimed.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        Cyclotomic Ideal-SVP is reported solvable in quantum polynomial
        time at approximation factor exp(O~(sqrt(n))), and that factor
        is not claimed to reach the polynomial approximation factors
        used by Ring-LWE. The toy certificate tested here is only the
        classical log-unit step on a planted short generator.
      random_model_justification: >-
        There is no Dickman or Canfield-Erdos-Pomerance model. The
        planted generator is ternary by construction. The sample is
        two seeds at degree 128. The published factor is not re-fit.
      supporting_results: []
      validation_experiment_ids:
        - EXP-QLWE-d3a060
      falsification_condition: >-
        Both seeds give certificate 0 on the planted ideal, or any
        seed gives certificate 1 on NTRU, plain LWE, or the module
        cell. A timeout or a crash does not falsify H1.

  structural_ingredients:
    - description: >-
        Composed Ideal-SVP in quantum polynomial time at approximation
        factor exp(O~(sqrt(n))) on cyclotomic ideal lattices, via
        class-group and S-units, log-unit short-generator recovery,
        and a Stickelberger close principal multiple. Ring-LWE at
        polynomial approximation factors is not claimed broken. The
        factor was not re-derived in this design.
      citation: KN-TECH-046
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-05 read
        knowledge/techniques/KN-TECH-046.md
      role: the published ceiling this control does not move
    - description: >-
        The question requires a plain-LWE null object and a nearby
        ring with the claimed structure removed, and it separates
        large-gamma ideal lattices from small-gamma average-case
        Ring-LWE.
      citation: RQ-QLWE-9108dc
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-05 read
        ledger/questions/RQ-QLWE-9108dc.yaml
      role: the null-object and quantifier-order obligations

  predictions:
    - metric: log_unit_certificate
      direction: different
      minimum_effect: >-
        1 on the degree-128 principal ideal and 0 on ternary NTRU at
        q=32, on ternary NTRU at q=1024, on plain LWE of dimension
        128, and on the k=2 module lattice with only x |-> x^5.
    - metric: approximation_factor_label
      direction: different
      minimum_effect: >-
        The label exp(O~(sqrt(n))) is recorded only with the
        certificate. At degree 128 the reported illustration is
        exp(sqrt(128)), about 8.19e4. BKZ factors on the NTRU and
        plain-LWE cells do not receive the label.

  test_boundary:
    instances:
      - id: cell-A-cyclotomic-ideal
        ring: Z[x]/(x^128+1)
        role: the only cell inside the log-unit certificate domain
      - id: cell-B-ntru-q32
        ring: Z[x]/(x^64+1)
        q: 32
        role: NTRU below the fatigue threshold
      - id: cell-B-ntru-q1024
        ring: Z[x]/(x^64+1)
        q: 1024
        role: NTRU above the fatigue threshold
      - id: cell-C-plain-lwe
        ring: none
        q: 32
        role: null object
      - id: cell-D-module-isometry
        ring: Z[x]/(x^64+1)
        map: x |-> x^5
        role: nearby object with the degree-128 unit lattice removed
    parameters:
      ambient_dimension: 128
      bkz_block_size: 20
      seeds:
        - 20261005
        - 20261006
    implementation: >-
      Classical log-unit decoding on cell A only. Domain refusal on
      cells B, C, and D. One BKZ block size 20 on A, B, and C as the
      structure-blind baseline. The design session built no lattice.
    budget:
      enforcement: advisory
      maximum_runs: 2

  rerandomization: >-
    None. This control does not re-randomize a principal ideal into
    an average-case Ring-LWE sample, and it does not pull a solution
    back to a Ring-LWE instance.

  falsification_conditions:
    - Certificate 1 on either NTRU cell, on plain LWE, or on the isometry-only module cell falsifies specificity. The quantity is then not specific to the cyclotomic log-unit chain.
    - Certificate 0 on the planted cyclotomic principal ideal, on both seeds, falsifies detection. This design does not see the chain.
    - Under the fixed BKZ budget, if the ideal cell's approximation factor and the plain-LWE cell's approximation factor agree within a factor of 2 and the ideal carries no certificate, that split is a BKZ artifact and assigns to none of the three mechanisms.
    - A certificate that flips from 0 at NTRU q=32 to 1 at NTRU q=1024 moved under an overstretched modulus. That assigns to the modulus, not to the log-unit chain.
    - A crash, a timeout, a seed disagreement, or a coerced embedding of B, C, or D into a degree-128 ideal decides nothing.

  interpretation_limits:
    - Toy dimension 128 only. No statement about any deployed system.
    - Does not claim Ring-LWE or Module-LWE is broken at polynomial approximation factors.
    - Does not claim a bit-security improvement or an exponent improvement.
    - A dense-sublattice transition that flips only when the NTRU fatigue ratio crosses 1 is the NTRU line. It is not a positive for the log-unit certificate.
    - The quantifier order stays on an ideal-lattice object at the reported factor exp(O~(sqrt(n))), not on average-case Ring-LWE at a polynomial factor.
    - Recovering a planted short generator shows the log-unit step at polynomial length. It does not exhibit the Stickelberger approximation factor.

  citations:
    - ref: IDEA-20261005-9f4777
      provenance: internal
      claim: >-
        At dimension 128 a log-unit certificate appears on a planted
        principal ideal in Z[x]/(x^128+1) and not on ternary NTRU,
        plain LWE, or a module lattice with only x |-> x^5. No attack
        and no exponent improvement is claimed.
      verified_by: >-
        coordinator design session 2026-10-05 read
        ledger/proposals/IDEA-20261005-9f4777.yaml
    - ref: RQ-QLWE-9108dc
      provenance: internal
      claim: >-
        The question requires a plain-LWE null and a nearby ring with
        the claimed structure removed, and it separates large-gamma
        ideal lattices from small-gamma average-case Ring-LWE.
      verified_by: >-
        coordinator design session 2026-10-05 read
        ledger/questions/RQ-QLWE-9108dc.yaml
    - ref: KN-TECH-046
      provenance: internal
      claim: >-
        Ideal-SVP in quantum polynomial time at approximation factor
        exp(O~(sqrt(n))) in cyclotomic fields. Ring-LWE at polynomial
        approximation factors is not claimed broken. The factor was
        not re-derived.
      verified_by: >-
        coordinator design session 2026-10-05 read
        knowledge/techniques/KN-TECH-046.md
