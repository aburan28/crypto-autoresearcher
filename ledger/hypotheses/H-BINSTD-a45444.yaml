  title: >-
    HOLD-O chain E>2E>4E=C (quotients Z/2, Z/4) closes target-side cofactor
    reading; Stage 0 builder coset-restriction audit (H_spent vs H_unspent);
    Stage 1 toy V/V_C yield census priced as base-size 4^{m-1} with h=2 and
    Z/(4l) controls — no free cofactor lever, no exponent claim

  statement: >-
    SETTING. ECC2K-130: E: y^2+xy=x^3+1 over F_2^131 with #E = 4*l, l a
    129-bit prime (KN-LIT-661e97). The 2-Sylow S is cyclic Z/4 (one rational
    2-torsion when b!=0), C is the unique order-l subgroup, G = S x C by
    Sylow coprimality (gcd(4,l)=1).

    HOLD-O CORRECTED PART (A) — CHAIN CERTIFICATE, NOT THE SOURCE IDEA'S
    FALSE STEP. The source IDEA claimed "S has only quotients trivial or
    all of S". That is FALSE: Z/4 admits the quotient Z/4→Z/2. The full-
    translation-compatible lossy quotients trivial on C-targets but
    nontrivial on legs are exactly the chain
        E > 2E > 4E = C
    with quotients E/2E ≅ Z/2 (the map pi = Tr(x)+Tr(a) of
    IDEA-20260913-cedd2f) and E/4E ≅ Z/4. Both carry NO information about
    a C-target's discrete log (they are identically 0 on C), so the
    target-side "spend the cofactor via a group quotient" reading closes
    to the same C-reduction rho already performs — a restatement of the
    prime-order rigidity consequence on C (IDEA-20260806-c5d183 Theorem C
    analogue), not a new exponent lever. Leg-side use of the same chain
    (parity free; E/4E bit non-linear in x) is owned by the DC-04 cluster
    (IDEA-20260922-1b16d7 / IDEA-20260922-153a90) and is NOT re-litigated
    here.

    HOLD-O CORRECTED PART (B) — BASE SIZE, NOT A FREE COFACTOR SPEND.
    Whether builders restrict candidate x-coordinates to one cofactor
    coset (H_unspent) or admit all cosets (H_spent) is an empirical
    code-read. If H_unspent, relaxing the restriction enlarges the raw
    pool; by yield conservation (KN-FIND-aa2efc / KN-FIND-007) this is
    ordinary factor-base SIZE: unrestricted legs give ~4^{m-1} more
    decompositions per C-target at ~4x the unknowns — the standard
    base-size trade, NOT a structural "free" gain. Drop the source IDEA's
    "free" framing.

    NULL CONTROLS (HOLD-O FIX). No ordinary binary curve y^2+xy=x^3+a x^2+b
    has odd order (rational 2-torsion (0,sqrt(b)) always exists), so the
    source IDEA's h=1 null is IMPOSSIBLE in this family. Controls are:
    (i) h=2 sibling (Z/4 quotient absent; parity map still present);
    (ii) relabelled Z/(4l) generic group as structure control.

  statement_note: >-
    IDEA-20260922-e3048d claim text is immutable and left at status
    proposed. Review verdict defective (HOLD-O return_for_revision).
    Defects absorbed into this restatement: (1) enumerate E>2E>4E=C with
    Z/2 and Z/4 quotients; (2) reframe part B as base-size with 4^{m-1}
    pricing; (3) replace h=1 null by h=2 + Z/(4l); (4) cross-cite DC-04
    for the leg-side lever; (5) Stage 0 writes the chain certificate
    before any yield census. No exponent claim; no deployed break.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x-coordinates). Part (A) uses the
    FULL translation action only to certify the quotient chain — closed
    reading. Part (B) uses Class I partial action (factor-base translation)
    and asks a COORDINATE-DEPENDENT (Class III) engineering question about
    which x-coordinates builders retain. DECLARED COMPONENT: F2 (factor-
    base / candidate generation). WHAT IS ADDED: HOLD-O-corrected chain
    certificate + builder audit table + pre-registered base-size yield
    census with h=2 and generic-group controls. No new factor base
    (KN-OPEN-020 N/A). RQ-FROB-7d8dd4 boundary: prime extension degree;
    no subfield descent.

  assumptions:
    - >-
      l is a 129-bit prime (KN-LIT-661e97); gcd(4,l)=1. Primality of the
      ECC2K-130 order factor is taken from the cited corpus record;
      Stage 0 re-checks the toy n=19 cell's order factorisation directly.
    - >-
      For b!=0 the rational 2-torsion is a single point, so S ≅ Z/4
      (cyclic); HOLD-O and the 2026-09-26 review confirm this for the
      Koblitz family used here.
    - >-
      h=1 is impossible in the ordinary binary Weierstrass family; the
      protocol never requests an h=1 null.
    - >-
      Part (B) gain, if any, is a constant-factor base-size effect priced
      by 4^{m-1}; it does not change per-attempt solve cost formulas and
      does not move any ECC2K-130 floor row against rho 2^60.9.
    - >-
      Leg-side parity / E/4E pricing is owned by DC-04 (1b16d7/153a90);
      this hypothesis does not claim that lever.
    - >-
      No scientific run at deployed m=131; ECC2K-130 appears only as the
      named structural setting and methodological note.

  proof_search_map:
    bottleneck: >-
      (1) Whether the HOLD-O chain certificate (E>2E>4E=C) hand-checks on
      Z/12 and on the n=19 Koblitz order. (2) Whether existing SEMBIN /
      DREG / QSP / CERTBIN builders restrict candidates to one cofactor
      coset. (3) Whether the toy V/V_C yield ratio matches 4^{m-1} on both
      the curve and the Z/(4l) replica.
    baseline_embedding:
      parameter_slice: >-
        Matched rho on C (KN-LIT-096 / 2^60.9) already performs the
        C-reduction part (A) shows is the only target-informative
        full-translation quotient. Base-size law 4^{m-1} is the part (B)
        baseline.
      reproduction_check: >-
        SYMBOLIC Stage 0: enumerate subgroups of Z/12; verify endomorphism
        preservation on Sylow parts; write chain E>2E>4E on the n=19
        Koblitz cell (#E=4*130873). Empirical Stage 1: V/V_C ratios vs
        4^{m-1} and parity ratio vs 2.
    observation_collision:
      observable: >-
        (A) enumerated quotient chain; (B) per-builder restricted yes/no
        with code pointer; (C) mean decompositions-per-C-target ratio
        V/V_C at m in {2,3}.
      distinct_preimage_search: >-
        A V/V_C deviation from 4^{m-1} on the curve but not on the
        Z/(4l) replica would be a coset-dependent concentration the group
        theory does not predict (review negative outcome). Identical
        replica deviation is window-size arithmetic. Class-sum violations
        are classifier defects, not findings.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move membership from C-only representatives to full-curve
          x-coordinates, deferring C-reduction to verification — ONLY if
          Stage 0 finds H_unspent. Encoding unchanged. Cost: standard
          base-size trade (4^{m-1} yield at 4x unknowns), not free.
        predicted_gain: >-
          At most the base-size law; zero if H_spent. Explicitly not an
          exponent move. Predicted H_spent more likely (RC-1 V={deg<9}
          is already all-coset at contract level per the review).
    quantifier_order: >-
      Part (A): FORALL finite abelian G=S x C with |S|=4, |C|=l odd prime,
      the full-translation quotients trivial on C are exactly the chain
      quotients Z/2 and Z/4 (and the full C-projection). Unconditional
      group theory once S≅Z/4 is fixed. Part (B): EXISTS a builder that
      restricts to one coset — existential, empirical, decided by Stage 0,
      not asserted either way here.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested toy cells (n in {17,19}, m in {2,3}), the chain
        certificate holds, the builder audit table is [table], and the
        V/V_C ratio is within [0.5,2] x 4^{m-1} on curve and replica (or
        the named negative/artifact outcome). Explicitly cannot certify
        a deployed break, an exponent move, or the DC-04 leg-side lever.
      nearby_object_control: >-
        h=2 Koblitz (Z/4 absent; parity ratio still 2); relabelled
        Z/(4l) generic group (structure control); random size-matched
        subspace null window; class-2 mirror targets (V_C must give zero).
    proof_obligations:
      - claim: Chain E>2E>4E=C with quotients Z/2 and Z/4 is written and hand-checked on Z/12 and n=19
        responsibility: correctness
      - claim: h=1 null is never requested; h=2 and Z/(4l) controls are present
        responsibility: baseline
      - claim: Part (B) is priced as base-size 4^{m-1}, never as a free structural gain
        responsibility: scope
      - claim: Every counted decomposition has class-sum 0 in Z/4 (or Z/2 on h=2)
        responsibility: correctness
      - claim: Builder audit cites concrete code/spec pointers per row
        responsibility: scope
      - claim: No conclusion about any deployed curve's security; no exponent claim
        responsibility: scope
      - claim: Leg-side parity/E/4E lever is cross-cited to DC-04, not claimed here
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      ECDLP on ECC2K-130 — target-side cofactor reading and candidate-pool
      base-size accounting (RQ-BINSTD-b6f698)
    prior_best: Pollard rho with Frobenius and negation, ~2^60.9 (KN-LIT-096)
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      Part (B) at best a constant-factor base-size multiplier priced by
      4^{m-1} on yield and ~4x on unknowns; disclosed, not hidden in o(1).
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-a45444-H1
      formal_statement: >-
        At fixed window V={deg < l_dim}, the mean number of m-fold
        decompositions per random C-target using unrestricted V, divided
        by the same using V_C (C-coset-restricted), equals 4^{m-1}
        (1+o(1)) as the window grows, matching the abstract base-size
        count on Z/(4l).
      random_model_justification: >-
        RIGOROUS: coset fractions of x-values are 1/4, 1/4, 1/2 for
        classes 0, 2, {1,3} under negation pairing (review re-derivation).
        HEURISTIC: Semaev roots behave like uniform draws from the window
        for yield accounting (yield conservation KN-FIND-aa2efc).
      supporting_results:
        - ref: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-e3048d.yaml
          provenance: internal
          claim: HOLD-O concrete_experiment predicts V/V_C = 4^{m-1}
          verified_by: coordinator, this design session (Read, full review)
        - ref: knowledge/findings/KN-FIND-aa2efc.md
          provenance: internal
          claim: yield conservation / product-law base-size accounting
          verified_by: >-
            cited inside the e3048d review; coordinator did not re-open the
            finding body this session (pointer retained)
      validation_experiment_ids:
        - EXP-BINSTD-58758f
      falsification_condition: >-
        V/V_C outside [0.5, 2] x 4^{m-1} on the curve while inside on the
        Z/(4l) replica at the tested (n,m,window) — report and replicate;
        do not absorb.

  structural_ingredients:
    - description: >-
        ECC2K-130 group order 4*l with l a 129-bit prime
      citation: KN-LIT-661e97
      provenance: internal
      verified_by: IDEA-20260922-e3048d citations; coordinator read proposal
      role: Sylow orders for part (A)
    - description: >-
        Matched rho baseline ~2^60.9 with Frobenius and negation
      citation: KN-LIT-096
      provenance: internal
      verified_by: IDEA-20260922-e3048d citations; coordinator read proposal
      role: baseline that already performs C-reduction
    - description: >-
        E/2E class map pi = Tr(x)+Tr(a); measured yield lever on legs
      citation: IDEA-20260913-cedd2f
      provenance: internal
      verified_by: e3048d review records_read; coordinator read review
      role: Z/2 quotient in the HOLD-O chain
    - description: >-
        DC-04 leg-side quotient chain (parity free; E/4E non-linear)
      citation: IDEA-20260922-1b16d7
      provenance: internal
      verified_by: e3048d review successor_seam; coordinator did not redesign DC-04
      role: owns the residual live lever; out of scope here
    - description: >-
        Yield conservation / product-law base-size pricing
      citation: KN-FIND-aa2efc
      provenance: internal
      verified_by: e3048d review citation; pointer retained
      role: prices part (B) as base size not free gain

  reduction_chain:
    core_problem: >-
      Certify the HOLD-O cofactor quotient chain on the target side and
      measure whether builder coset restriction exists and matches
      base-size pricing at toy scale
    corollaries:
      - problem: >-
          DC-04 leg-side parity / E/4E window condition (owned elsewhere)
        reduction_ref: IDEA-20260922-1b16d7 / IDEA-20260922-153a90
        asymptotics_preserved: true

  predictions:
    - metric: chain_certificate_Z12_and_n19
      direction: exact
      minimum_effect: >-
        Subgroup list and endomorphism preservation match the chain
        enumeration; any disagreement voids part (A) until localised.
    - metric: builder_coset_restriction_table
      direction: different
      minimum_effect: >-
        Per-builder yes/no with code pointer. Prediction: H_spent
        (no restriction) is more likely; H_unspent is the surprising
        and more valuable finding.
    - metric: yield_ratio_V_over_V_C
      direction: higher
      minimum_effect: >-
        Mean ratio in [0.5, 2] x 4^{m-1} at m in {2,3} on both curve and
        Z/(4l) replica (HEUR-BINSTD-a45444-H1).
    - metric: parity_ratio_V0_over_random
      direction: higher
      minimum_effect: >-
        Near 2 on h=4 cells; still near 2 on h=2 control; Z/4 bookkeeping
        reports undefined on h=2.
    - metric: class_sum_violations
      direction: exact
      minimum_effect: 'Exactly 0; any positive is instrument halt.'
    - metric: h1_null_never_requested
      direction: exact
      minimum_effect: Protocol artifacts never name an h=1 binary-curve null.

  test_boundary:
    instances:
      - >-
        Stage 0 (zero scientific group walks): HOLD-O chain certificate
        on Z/12 and n=19 Koblitz order; builder code/spec read table for
        SEMBIN, DREG, QSP, CERTBIN (RC-1) candidate-generation paths
      - >-
        Stage 1 (toy): n=19 Koblitz #E=4*130873; RC-1 n=17 ordinary h=4
        sibling; census m in {2,3}; windows V, V_C, V'_0, random subspace;
        40 C-targets + 20 class-2 mirrors; Z/(4l) replica
      - >-
        Stage 2 (control): h=2 Koblitz a=1 at n=19 (#E=2*262543);
        replicate ratios; confirm Z/4 undefined and parity ratio ~2
    parameters:
      n: [17, 19]
      m: [2, 3]
      window_dim: [9, 10]
      cofactor_h: [2, 4]
    implementation: >-
      Reuse experiments/EXP-CERTBIN-e94b27/impl/{gf2n,curve,instances}.py
      for scalar arithmetic and [l]P membership. New coset-classifier +
      census script under EXP-BINSTD-58758f/implementation/. Pure-Python
      acceptable within advisory budget.
    budget:
      wall_clock_seconds: 43200
      memory_gb: 4
      maximum_runs: 24

  falsification_conditions:
    - >-
      Chain certificate fails on Z/12 or n=19: withdraw part (A) until
      localised.
    - >-
      One class-sum violation among counted decompositions: classifier /
      instrument defect; halt; not a math finding.
    - >-
      V/V_C outside [0.5,2] x 4^{m-1} on the curve while inside on the
      replica: HEUR-BINSTD-a45444-H1 rejected at tested scope; report and
      replicate.
    - >-
      Replica and curve both deviate identically: window-size arithmetic
      artifact; not a coset finding.
    - >-
      Protocol requests or reports an h=1 ordinary binary-curve null:
      HOLD-O defect re-introduced; invalid run set.

  interpretation_limits:
    - >-
      Scoped to tested n in {17,19}, m in {2,3}, named windows, instruments,
      and builders audited. No transfer to m=131 claimed.
    - >-
      Part (A) closes only the target-side group-homomorphism reading;
      leg-side lever is DC-04.
    - >-
      Part (B) at best constant-factor base-size accounting; dominated by
      rho at 2^60.9; not target-class under docs/target-result-profile.md.
    - >-
      No attack, no curve solved, no relation to any deployed key.
    - >-
      Source IDEA claim text remains proposed/immutable; only this
      hypothesis carries the HOLD-O restatement.

  distinguishable_outcomes:
    - id: DO-1-H-spent-base-size-holds
      description: >-
        Stage 0 finds H_spent on all audited builders; Stage 1 ratios match
        4^{m-1} and parity ~2; chain certificate passes — seam closed;
        residual live lever is DC-04 only.
      next_decision: support_scoped_close_target_side_cofactor_reading
    - id: DO-2-H-unspent-base-size-holds
      description: >-
        Stage 0 finds H_unspent in >=1 builder; Stage 1 ratios still match
        4^{m-1} — engineering constant-factor pool enlargement available,
        priced as base size; open a tiny follow-up to relax that builder.
      next_decision: support_scoped_open_builder_relaxation_successor
    - id: DO-3-curve-only-deviation
      description: >-
        V/V_C deviant on curve, OK on replica — coset-dependent
        concentration; replicate before any claim.
      next_decision: weaken_or_replicate_HEUR
    - id: DO-4-instrument-fail
      description: >-
        Class-sum violations or chain certificate failure — invalid /
        infrastructure; not negative math evidence against the corrected
        group theory until localised.
      next_decision: invalid_repair_executor

  dominated_by: >-
    Dominated by matched rho at ~2^60.9 on time. A <=2-bit base-size
    constant cannot close a ~60-bit gap. Stated explicitly (Pareto honesty).

  sota_delta:
    time: >-
      Zero cryptanalytic movement. At most log2(4)=2 bits of pool-size /
      base-size accounting if H_unspent; zero otherwise.
    memory: >-
      At most proportional factor-base storage if unrestricted windows are
      adopted; zero otherwise.
    data_queries: >-
      First HOLD-O-corrected chain certificate plus builder coset-restriction
      audit table in this corpus for ECC2K-130's cofactor reading.

