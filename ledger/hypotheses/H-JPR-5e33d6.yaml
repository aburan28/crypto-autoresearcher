hypothesis:
  id: H-JPR-5e33d6
  question_id: RQ-ECDLP-160d89
  source_proposal_id: IDEA-20260901-a66d70
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-160d89 is bound to no active goal head. GOAL-ECDLP-001 is paused
    at its 57-batch ceiling (DEC-20260823-eb7baf) and this record does not
    open a lane on it. This is a standalone design record under the question's
    own claim boundary.
  title: >-
    Order-join rigidity and the SFT cascade: on a prime-order group a sound
    two-pointer (sorted range-scan) join key is an approximate homomorphism
    into R/Z, hence a heavy-Fourier-coefficient function of the discrete
    logarithm, hence -- conditional on the recalled Akavia-Goldwasser-Safra
    sparse Fourier transform -- a polynomial-time discrete-logarithm oracle;
    the order-join branch of the RQ-ECDLP-160d89 certificate therefore has
    conditional exponent 0, not 1/3
  statement: >-
    SETTING. G = <P> of odd prime order N, Q = [x]P. An ORDER KEY is a map
    nu from G to Z/N (ties allowed), computable per point in (log N)^{O(1)}
    field operations, fixed before the lists are drawn and independent of Q.
    For cyclic windows J, J' of Z/N of lengths w, w', the TWO-POINTER JOIN
    sorts two source-labelled lists by nu and emits every pair (R, S) with
    nu(R) + nu(S) in J'. Its accepted set is D = nu^{-1}(J), |D| = sigma, and
    it is (1-eta)-SOUND if at least a (1-eta) fraction of emitted pairs
    satisfy R + S in D. f = nu/N maps G into R/Z and g = e(f) = exp(2 pi i f).

    THREE STATIC CLAIMS, with exact quantifier order.

    (T1) EXACT ORDER RIGIDITY. FOR ALL odd primes N, FOR ALL injective nu
    from G to Z/N (a cyclic order on G), FOR ALL D subset G with
    2 <= |D| <= (N-1)/2 such that EVERY translate D - T, T in G, is a
    nu-interval, THERE EXIST a in (Z/N)^* and c in Z/N with
    nu = plus-or-minus a*log_P + c, and D is a log-interval. The witness
    (a, c, sign) depends on nu and D only. Extension to be confirmed, not
    claimed: by complementation (D is a nu-interval iff G minus D is) the
    range extends to 2 <= |D| <= N-2.

    (T2) SOUNDNESS OF A TWO-POINTER JOIN IS APPROXIMATE ADDITIVITY. FOR ALL
    prime N, FOR ALL order keys nu (injectivity NOT required), FOR ALL
    windows with w' >= (1-eta')w, IF the join is (1-eta)-sound in the
    population sense (HEUR-001 transfers the sampled statement), THEN there
    is an explicit constant C such that for all but a 3*delta fraction of
    pairs (R, R') in G x G, with delta = O(eta + eta') carrying an explicit
    constant,
        || f(R + R') - f(R) - f(R') ||_{R/Z} <= C*(eta + eta')*w/N.
    At w = Theta(N^{2/3}) and constant eta this is additive precision
    N^{-1/3+o(1)}.

    (T3) THE CASCADE. FOR ALL prime N, FOR ALL efficiently computable order
    keys nu fixed before the lists and independent of Q, FOR ALL windows with
    w' >= (1-eta')w, IF the two-pointer join is (1-eta)-sound with eta + eta'
    strictly below an absolute threshold tau_0 (the Stage 1 quantity M2 of
    EXP-JPR-402649), THEN THERE EXISTS an algorithm, depending on nu but not
    on Q or on the list randomness, that computes log_P(Q) for EVERY Q using
    (log N)^{O(1)} evaluations of nu plus (log N)^{O(1)} group operations and
    poly(log N) memory -- CONDITIONAL on the recalled AGS sparse Fourier
    transform statement (structural ingredient 3) in the exact form Stage 2
    lemma (iii) extracts. Mechanism: T2 gives Re sum_xi ghat(xi)|ghat(xi)|^2
    >= 1 - gamma with gamma = O(delta + w/N); Parseval gives a frequency
    xi_0 with |ghat(xi_0)| >= 1 - gamma, i.e. a heavy coefficient at the
    character R -> e(xi_0*log_P(R)/N); the functions t -> g([t]P) and
    t -> g([t]Q) on Z/N then have heavy coefficients at xi_0 and xi_0*x;
    two SFT calls return them and division mod N returns x.

    HEADLINE (conditional, not an attack). An order key satisfying the
    certificate's soundness row at eta + eta' < tau_0 exists only if the
    ECDLP on G is solvable in (log N)^{O(1)} evaluations of nu. The
    conditional exponent of the four-list route through such a key is 0,
    not 1/3. Unconditionally claimed: nothing below N^{1/2}. NOT CLAIMED:
    anything for eta + eta' >= tau_0, for orders chosen after seeing Q, for
    hash joins, for polynomial-relation joins, or for joins tolerating
    constant coverage loss (the one-percent regime, HEUR-002).
  mechanism: >-
    THE TRACKED OBJECT is the rank of a point in a public cyclic order,
    coarsened to a window of width w. The projection discards the fine
    position within a window and keeps which window; the discard is
    compatible with the join's window arithmetic exactly to the extent nu is
    approximately additive, which is why additivity, not concentration, is
    the load-bearing quantity (docs/inventor-protocol.md section 2, measured
    by eta rather than assumed).

    WHY THE ARGUMENT HAS THIS SHAPE. Every closure record in this lane ends
    with the slogan 'the key is a coarse discrete logarithm'. That slogan is
    a negative only if a coarse logarithm is expensive, which
    IDEA-20260829-390ccc carries as its heuristic H3 with the validation
    route 'literature check against the hidden number problem'. This
    hypothesis turns H3 into a theorem-shaped statement: a coarse logarithm
    available on EVERY point is an oracle, not advice about x (the object
    IDEA-20260829-7169d6 prices), and an oracle whose output is a
    heavy-Fourier-coefficient function of the logarithm is what the sparse
    Fourier transform and hidden-number literature converts into a full
    logarithm in polynomial time.

    T1 (elementary, internal). Translates of a nontrivial D in a prime-order
    group are pairwise distinct (D - T = D - T' forces D + (T' - T) = D, and
    T' - T generates G). There are exactly N cyclic width-w intervals, so the
    N translates are all of them. For w <= (N-1)/2 two distinct width-w
    intervals meet in w - 1 points iff their starts differ by one step
    (2w <= N-1 forbids two-ended overlap), so translation, which preserves
    intersection sizes, acts on the N-cycle of intervals by graph
    automorphisms, embedding G into the dihedral group D_N. For odd prime N
    the only order-N subgroup of D_N is the rotation subgroup (a subgroup of
    odd order contains no reflection), so the start map is affine in an
    injective homomorphism rho from G to Z/N, i.e. rho = a*log_P. The
    interval system recovers the cyclic order (the element s is the unique
    element of I_s not in I_{s+1}), so nu = plus-or-minus rho + c. No
    hypothesis on how nu is computed is used.

    T2 (symbolic, Stage 1 of EXP-JPR-402649). Soundness on the row of R says
    the row window W_R = nu^{-1}(J' - nu(R)), a nu-interval with START
    j' - nu(R) (an exact affine function of nu(R)), lies inside D - R up to
    an eta_R*w' exceptional set with average eta_R = eta; the size condition
    w' >= (1-eta')w then bounds the symmetric difference of D - R and W_R by
    O((eta_R + eta')w) for most R (Markov on eta_R supplies the constant).
    The rows R, R', and R + R' are each good except on a delta fraction,
    which is where the 3*delta union bound comes from. THE LOAD-BEARING
    STEP, flagged for the derivation and for review: comparing the interval
    approximating D - (R + R') with the translate by -R' of the interval
    approximating D - R, so that their starts differ by O((eta + eta')w).
    The proposal's sketch states this step in one sentence; Stage 1 must
    write it in full or report that only the coarser defect O(w) (from
    window membership alone) is available, which still gives additive
    precision N^{-1/3+o(1)} at w = N^{2/3} but with a different constant
    entering M2.

    T3 (symbolic, Stage 2). Lemma (i): the Fourier identity
    E_{R,R'} g(R+R') conj g(R) conj g(R') = sum_xi ghat(xi)|ghat(xi)|^2 and
    the Parseval extraction max_xi |ghat(xi)| >= 1 - gamma, including the
    exclusion of xi_0 = 0 (which needs f non-constant on a positive
    fraction; the emitted-count condition Theta(L) with |D| = Theta(N/L)
    supplies it and must be invoked explicitly) and the uniqueness of the
    heavy frequency when (1 - gamma)^2 > 1/2. Lemma (ii): transfer from G to
    Z/N; the coefficient of t -> g([t]P) at xi equals ghat(xi) identically,
    and the coefficient of t -> g([t]Q) at xi*x equals ghat(xi) by the
    substitution u = t*x. Lemma (iii): two SFT calls and one division mod N;
    depends on the recalled AGS statement and is the record's single
    external dependence.

    STAGE 3 (stated, not claimed). When coverage is a constant bounded away
    from 1, T2's size-matching step fails and only 'additivity on a dense set
    of pairs' remains; Balog-Szemeredi-Gowers plus a Freiman-type theorem in
    Z/N would give agreement with an affine function of log on a dense
    subset, a noisy coarse-log oracle with unknown error positions; whether
    HNP-with-errors closes that gap in polynomial time is HEUR-002 and is
    recorded as an obligation.
  assumptions:
    - >-
      A1. N prime and odd, G = <P> the full prime-order subgroup; T1 uses that
      every nonzero element generates G and that a subgroup of odd order of
      D_N contains no reflection.
    - >-
      A2. nu is fixed before the lists are sampled and does not read Q;
      data-dependent orders are outside every statement here.
    - >-
      A3. Lists are uniform independent samples of G via source labels
      (a, b); soundness measured on sampled pairs equals population soundness
      up to concentration (HEUR-001).
    - >-
      A4. Emitted count Theta(L) requires w' = Theta(N/L) = Theta(N^{2/3});
      constants are stated at w' >= (1 - eta')w and the regime w' << w is
      deferred to Stage 3.
    - >-
      A5. No exact nontrivial quotient of G is assumed (RQ constraint); T1
      proves the interval system IS the log coordinate, i.e. the quotient by
      nothing.
  proof_search_map:
    bottleneck: >-
      Converting the lane's slogan 'the key is a coarse discrete logarithm'
      into a cost. Without T3 the slogan is a heuristic (IDEA-20260829-390ccc
      H3); with it the order-join branch has conditional exponent 0, which is
      the decision-changing number for RQ-ECDLP-160d89's certificate.
    baseline_embedding:
      parameter_slice: >-
        Z/N with nu the identity and D a genuine interval: the log-interval
        positive control of IDEA-20260829-390ccc and IDEA-20260829-7169d6.
        T1 must return nu = identity (rho = -id on start positions), T2 must
        hold with zero defect, and T3 must be vacuous because the logarithm
        is already known.
      reproduction_check: >-
        Symbolic: with nu = id the start map is s(T) = j - T and
        rho(T') = -T', an injective homomorphism, as T1 predicts. FROZEN
        FIXTURE, a HAND ENUMERATION and not a run: at N = 23, w = 5, the
        23 width-5 cyclic intervals and the 23 translates of one of them must
        coincide as sets, and translation by each T must act on the interval
        cycle as rotation by exactly -T. The enumeration is written into
        derivation.md of EXP-JPR-402649; no code and no run record.
    observation_collision:
      observable: >-
        Emitted pair count Theta(L) from a sorted scan with window w'.
      distinct_preimage_search: >-
        Two objects share the observable and lead to opposite conclusions:
        (a) the log order on Z/N, where the scan is sound with eta = 0;
        (b) the x-coordinate integer order of K-EC-XINTERVAL-1
        (IDEA-20260823-cab6c6) used as a two-pointer key, which emits exactly
        as many pairs but is sound only at rate w/N = 1/L -- the independent
        pair coin of JPR-REV-4 with expected time N. The separating condition
        is soundness, which T2 identifies with the additivity defect of nu.
        The collision is therefore disclosed and separated, not repaired.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Encode the join's soundness row as an approximate-homomorphism
          condition on f = nu/N, then as a heavy Fourier coefficient of
          e(f), then as an SFT instance. Interface obligations: encoding
          (T2), completeness (every sound scan gives the condition),
          soundness (a heavy coefficient gives x), transfer (from G to Z/N
          via t -> [t]P and t -> [t]Q), cost (poly(log N) SFT queries times
          the cost of nu).
        predicted_gain: >-
          Moves the branch's conditional exponent from 1/3 to 0, i.e. shows
          the certificate row is satisfiable only by a polynomial-time break.
      - transform: observable_fiber
        proposed_object: >-
          Hold the emitted count fixed and vary the order: log order, x
          order, and planted corrupted log orders with a declared corruption
          fraction q. The intrinsic invariant distinguishing them is the
          Fourier mass of e(nu/N) at its heaviest frequency.
        predicted_gain: >-
          A single computable statistic predicting, for any candidate order
          key, whether its scan can be sound. Zero compute here; the toy
          computation (M4) is FUTURE and excluded from this record.
    quantifier_order: >-
      T1: FOR ALL odd primes N, FOR ALL injective nu, FOR ALL D with
      2 <= |D| <= (N-1)/2, IF every translate of D is a nu-interval THEN
      THERE EXIST a, c, sign with nu = plus-or-minus a*log_P + c; the witness
      depends on (nu, D) only. T2: FOR ALL prime N, FOR ALL nu, FOR ALL
      (w, w', eta, eta') with w' >= (1-eta')w, IF population-(1-eta)-sound
      THEN the additivity bound holds off a 3*delta set; the constants C and
      the constant in delta are absolute. T3: FOR ALL prime N, FOR ALL
      efficiently computable nu fixed before the lists and independent of Q,
      FOR ALL windows with w' >= (1-eta')w, IF the join is (1-eta)-sound with
      eta + eta' < tau_0, THEN THERE EXISTS an algorithm, depending on nu but
      not on Q or on the list randomness, computing log_P(Q) for EVERY Q with
      (log N)^{O(1)} evaluations of nu. NOT CLAIMED: anything for
      eta + eta' >= tau_0, or for orders chosen after seeing Q, or for
      non-injective nu under T1 (T1 needs injectivity; T2 and T3 do not).
    method_ceiling:
      strongest_certifiable_claim: >-
        A conditional impossibility for ONE join primitive (sorted range scan
        with a predeclared order), conditional on the ECDLP not being
        polynomial-time and on the recalled AGS statement. It can NEVER
        certify anything about hash joins (IDEA-20260829-390ccc),
        polynomial-relation joins (IDEA-20260901-730f23), data-dependent
        orders, or joins tolerating constant coverage loss (Stage 3), and it
        is not an ECDLP lower bound and does not close the lane.
      nearby_object_control: >-
        Where the conclusion FAILS: F_2^{3m} with the lexicographic order and
        a prefix-subspace accepted set. The scan is sound and complete, no
        log order exists, and there is no logarithm to recover; T1's
        distinct-translates step fails because the stabilizer of D is D
        itself, and T2's additivity is false because XOR is not addition of
        ranks. A version of this argument that closed XOR would prove too
        much. Second control: composite Z/(d*e) with coset intervals, where
        the translates are not pairwise distinct and the dihedral embedding
        is not injective.
    proof_obligations:
      - claim: Translates of a nontrivial D in a prime-order group are pairwise distinct.
        responsibility: correctness
      - claim: >-
          For 2 <= w <= (N-1)/2, distinct width-w cyclic intervals meet in
          w-1 points iff they are adjacent, so translation acts on the
          interval cycle by graph automorphisms; the boundary widths w = 1
          and w > (N-1)/2 are handled (excluded, or reduced by
          complementation) explicitly.
        responsibility: correctness
      - claim: >-
          G of odd prime order embeds in D_N only as rotations; hence the
          start map is affine in log_P and the interval system recovers the
          cyclic order up to reversal.
        responsibility: strictness
      - claim: >-
          Soundness plus size matching gives approximate additivity of nu
          with defect C*(eta+eta')*w on a 1 - 3*delta fraction of pairs, with
          C and the constant in delta explicit; in particular the
          translate-comparison step is written in full or its unavailability
          is reported with the coarser O(w) fallback.
        responsibility: correctness
      - claim: >-
          The Fourier identity sum_xi ghat(xi)|ghat(xi)|^2 = E g(x+y) conj g(x)
          conj g(y), the Parseval extraction of a heavy frequency, the
          exclusion of xi_0 = 0, and the uniqueness of the heavy frequency
          when (1 - gamma)^2 > 1/2.
        responsibility: correctness
      - claim: >-
          Heavy coefficient of e(f) on G transfers to heavy coefficients of
          t -> e(f([t]P)) and t -> e(f([t]Q)) on Z/N at xi_0 and xi_0*x.
        responsibility: interface
      - claim: >-
          AGS SFT recovers a tau-heavy coefficient in poly(log N, 1/tau)
          queries in the query model this record uses (query access to
          t -> g([t]P) and t -> g([t]Q), each query costing O(log N) group
          operations plus one evaluation of nu). The exact required
          statement is written down verbatim as an external obligation.
        responsibility: feasibility
      - claim: >-
          Total cost is (log N)^{O(1)} evaluations of nu plus poly(log N)
          group operations; memory poly(log N). Per-attempt cost times
          inverse success probability is bookkept explicitly, including the
          SFT's own failure probability.
        responsibility: runtime
      - claim: >-
          The theorem is silent on F_2^n and on composite N, and the
          log-order control is reproduced exactly, including the N = 23
          hand fixture.
        responsibility: scope
      - claim: >-
          The four-list route through a sound order key has conditional
          exponent exactly 0 (M3); the strict improvement over the lane's
          1/3 is a separate obligation from the feasibility lemma.
        responsibility: baseline
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    This record claims no attack and no complexity improvement, so
    asymptotic_claim is null by the template's rule. Its content is a
    CONDITIONAL COLLAPSE of one branch: if a sound order key existed, the
    discrete logarithm would cost (log N)^{O(1)} evaluations of nu (exponent
    0). Unconditionally claimed: nothing below N^{1/2}. Best known remains
    Pollard rho at N^{1/2+o(1)} time and O(1) memory (KN-TECH-006) and BSGS
    at N^{1/2} time and memory; Shoup's generic bound (KN-TECH-005) is not
    contradicted because nu reads coordinates.
  heuristic_assumptions:
    - id: HEUR-001
      label: H1 of IDEA-20260901-a66d70 (sample-to-population transfer)
      numbering_note: HEUR ids are local to this hypothesis record.
      formal_statement: >-
        For every odd prime N, every fixed order key nu, every window pair
        (J, J'), and lists of L = N^{1/3} uniform independent points, the
        soundness rate measured over the emitted sampled pairs equals the
        population soundness rate over all of G x G (pairs with
        nu(R) + nu(S) in J') within O(L^{-1/2}) with probability 1 - o(1)
        over the list randomness, uniformly in nu.
      random_model_justification: >-
        For a FIXED nu the emitted-pair soundness indicator is a bounded
        U-statistic of order two over the sampled lists; concentration for
        such statistics is rigorous (Hoeffding-type bounds for U-statistics).
        The heuristic content is only that the emitted count Theta(L) is
        large enough for the deviation to be negligible and that the
        shared-leaf dependence (each leaf participates in many emitted pairs)
        does not inflate the variance beyond the second-moment bound; this
        imitates the law of large numbers for an empirical acceptance rate.
      supporting_results:
        - ref: >-
            W. Hoeffding, 'Probability inequalities for sums of bounded random
            variables', J. Amer. Statist. Assoc. 58 (1963), including the
            U-statistics section
          provenance: recalled
          claim: >-
            Exponential concentration of bounded U-statistics of order two
            around their mean; used as the rigorous half of HEUR-001. Not
            opened in this program; pointer only.
          verified_by: null
        - ref: IDEA-20260829-3f0f4b
          provenance: internal
          claim: >-
            Its H1 records the same shared-leaf dependence for survivor
            counts and the same non-rigorous variance step; HEUR-001 is the
            soundness-rate analogue.
          verified_by: coordinator, TASK-20260902-d89741 (record read in full)
      validation_experiment_ids:
        - EXP-JPR-402649
      validation_note: >-
        EXP-JPR-402649 validates HEUR-001 SYMBOLICALLY only: Stage 1 writes
        the second-moment bound with the shared-leaf dependence charged. The
        empirical validation (24 <= log2 N <= 34, 200 list draws per cell,
        comparison against the population value computed by convolution over
        the log coordinate, tail check on the most extreme draw) is FUTURE,
        needs separate authority, and is not scheduled by this record.
      falsification_condition: >-
        A written second-moment bound showing the emitted-pair soundness
        rate has variance not o(1) at L = N^{1/3} for some fixed nu (symbolic
        refutation), or, under a future authorized experiment, a replicated
        deviation between sampled and population soundness exceeding
        C*L^{-1/2} beyond stated error bars.
    - id: HEUR-002
      label: H2 of IDEA-20260901-a66d70 (one-percent regime)
      numbering_note: HEUR ids are local to this hypothesis record.
      formal_statement: >-
        For every prime N and every order key nu, IF nu is approximately
        additive with defect O(w/N) in R/Z on a set of pairs of density
        c > 0 (not necessarily near 1), THEN a discrete logarithm can be
        computed in N^{o(1)} evaluations of nu.
      random_model_justification: >-
        Balog-Szemeredi-Gowers plus a Freiman-type theorem in Z/N would give
        agreement of nu with an affine function of log on a dense subset,
        i.e. a noisy coarse-log oracle with unknown error positions; the
        passage from that oracle to a full logarithm is the
        hidden-number-problem-with-errors setting, whose polynomial
        solvability at constant error rate is NOT verified here. This
        imitates the passage from 99-percent to 1-percent stability in
        additive combinatorics and is the record's weakest joint.
      supporting_results:
        - ref: >-
            A. Balog and E. Szemeredi (1994) and W. T. Gowers, 'A new proof of
            Szemeredi's theorem for arithmetic progressions of length four',
            GAFA 1998 -- the Balog-Szemeredi-Gowers theorem
          provenance: recalled
          claim: >-
            A set with many additive quadruples contains a large subset with
            small doubling. Pointer only; not opened in this program.
          verified_by: null
        - ref: >-
            arXiv:math/0505198 -- B. Green and I. Z. Ruzsa, 'Freiman's theorem
            in an arbitrary abelian group'
          provenance: recalled
          claim: >-
            Small doubling implies containment in a coset progression of
            bounded dimension; already recalled by IDEA-20260829-390ccc and
            still unopened.
          verified_by: null
        - ref: >-
            Bleichenbacher's Fourier-analytic treatment of the hidden number
            problem with erroneous samples (circulated 2000, reported in later
            HNP literature), and the Boneh-Venkatesan lattice route
          provenance: recalled
          claim: >-
            The HNP-with-errors line; the exact error-rate threshold and
            whether it applies with error positions unknown are the
            unverified quantities. Pointer only; hedged.
          verified_by: null
      validation_experiment_ids: []
      validation_note: >-
        EXP-JPR-402649 Stage 3 STATES the HEUR-002 obligation (the exact
        HNP-with-errors statement required, in external-obligations.yaml)
        and does NOT validate it; validation is a literature extraction under
        separate authority. If no result covers constant error, T3 is
        restated for the 99-percent regime only and the gap is published.
      falsification_condition: >-
        A literature extraction, recorded by an agent that opened the
        sources, showing that every available HNP-with-errors result
        requires error rate o(1) or known error positions; or an explicit
        family of order keys additive on a density-c set of pairs for which
        no N^{o(1)} logarithm algorithm follows from the cited route.
  structural_ingredients:
    - description: >-
        Dihedral-embedding step of T1: a translation-invariant width-w
        interval system on a group of odd prime order embeds the group in
        Aut(C_N) = D_N, necessarily as rotations, so the start map is affine
        in an injective homomorphism to Z/N. Reuses the translation-invariance
        step of IDEA-20260807-df906f theorem (A).
      citation: IDEA-20260901-a66d70 (T1 sketch); IDEA-20260807-df906f (theorem A)
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260902-d89741: both records read in full; the
        derivation itself is UNVERIFIED and is the object of EXP-JPR-402649
        Stages 0-1, not something this field certifies.
      role: correctness of T1 (order rigidity)
    - description: >-
        Fourier stability of approximate homomorphisms into R/Z: an
        epsilon-approximate homomorphism of a finite abelian group correlates
        with a character. This record re-derives the weak Fourier version it
        needs in T3 lemma (i) and cites the literature only as where sharper
        constants live.
      citation: >-
        D. Kazhdan, 'On epsilon-representations', Israel J. Math. 43 (1982)
      provenance: recalled
      verified_by: null
      role: distribution/stability law behind T3 lemma (i)
    - description: >-
        Sparse Fourier transform over Z/N: given query access to a function
        with a tau-heavy Fourier coefficient, find that coefficient in
        poly(log N, 1/tau) time. THE SINGLE EXTERNAL OBLIGATION of this
        record; the exact query model and tau dependence are unverified and
        must be extracted verbatim when the source is opened (T3 lemma iii).
      citation: >-
        A. Akavia, S. Goldwasser, S. Safra, 'Proving hard-core predicates
        using list decoding', FOCS 2003
      provenance: recalled
      verified_by: null
      role: feasibility of T3 lemma (iii); the only external dependence
    - description: >-
        Fallback cascade: recovery of alpha from MSB_k(alpha*t mod N) for
        random known t with k about sqrt(log N) bits by lattice reduction.
        Named as the alternative to AGS when T2 holds at precision better
        than N^{-1/2}, i.e. w < N^{1/2}; not opened.
      citation: >-
        D. Boneh and R. Venkatesan, 'Hardness of computing the most
