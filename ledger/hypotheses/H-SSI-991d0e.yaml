# H-SSI-991d0e
# Residual endpoint ambiguity after publishing only the middle
# j-invariant of a depth-two Phi_2 walk. The unlabeled walk
# counts and the weighted two-step laws are different contracts
# and are not edited.
hypothesis:
  id: H-SSI-991d0e
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  source_idea: IDEA-20261004-e4c461
  experiment_id: EXP-SSI-474826
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-850856
  title: >-
    Publishing the middle supersingular j-invariant leaves 0, 2,
    and 4 depth-two walks ambiguous at p=7, 11, and 19
  statement: >-
    Let S_7 = {6}, S_11 = {0, 1}, and S_19 = {7, 18}. An edge
    joins j to j' inside S_p when Phi_2(j, j') is 0 mod p.
    Distinct neighbor j-invariants are 6 to {6}; 0 to {1};
    1 to {0, 1}; 7 to {7, 18}; and 18 to {7, 18}. A depth-two
    walk is a triple (start, middle, end). Publishing the pair
    (start, middle) leaves one endpoint at (6, 6); endpoints
    {0, 1} at (0, 1); the single endpoint 1 at (1, 0); endpoints
    {0, 1} at (1, 1); and endpoints {7, 18} at each of (7, 7),
    (7, 18), (18, 7), and (18, 18). The number of such pairs
    with more than one endpoint is 0, 2, and 4. The number with
    exactly one endpoint is 1, 1, and 0. The largest endpoint
    set has size 1, 2, and 2. Publishing the end as well makes
    the endpoint agree with the graph.
  mechanism: >-
    The middle vertex is one auxiliary label. At p=7 the only
    walk is the loop, so the middle already names the end. At
    p=11 the step through 0 has only one continuation, and the
    two steps through 1 do not. At p=19 every vertex has both
    vertices as neighbors, so every middle still allows both
    ends.
  assumptions:
    - Edges are pairs inside S_p with Phi_2 congruent to 0 mod p.
    - Distinct neighbor j-invariants are used. Edge multiplicity is not a second middle.
    - Depth is exactly two.
  proof_search_map:
    bottleneck: >-
      Whether the middle j-invariant separates depth-two endpoints.
    baseline_embedding:
      parameter_slice: >-
        The same Phi_2 neighbor graph as the unlabeled walk
        count. That count does not condition on the middle.
      reproduction_check: >-
        The monomial formula for Phi_2 and the expanded cubic
        in the second variable must yield the same neighbor sets.
    observation_collision:
      observable: >-
        The set of endpoints reachable from one pair (start, middle).
      distinct_preimage_search: >-
        A pair whose endpoint set has size greater than 1.
    constructive_transforms:
      - transform: auxiliary_information_exposure
        proposed_object: the published middle j-invariant
        predicted_gain: >-
          Separates one walk at p=11 and none at p=19. No attack
          exponent.
    quantifier_order: >-
      For each prime, every start in S_p, then every distinct
      neighbor, then every distinct neighbor of that neighbor.
    method_ceiling:
      strongest_certifiable_claim: >-
        Residual ambiguity of these finite walks after one
        published label. Not an impossibility theorem for
        isogeny encryption.
      nearby_object_control: >-
        The loop at p=7, where the only pair has one endpoint,
        and the step (1, 0) at p=11, the only separated pair
        on a graph that is otherwise ambiguous.
    proof_obligations:
      - claim: Neighbor sets match the statement
        responsibility: correctness
      - claim: Ambiguous middles are 0, 2, and 4
        responsibility: size
      - claim: A published triple has endpoint disagreement 0
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        These middle-label counts do not transfer to a
        cryptographic endomorphism-ring encryption scheme.
      random_model_justification: The walks are enumerated in full.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-474826
      falsification_condition: >-
        A later record that treats these counts as a break of a
        published scheme.
  structural_ingredients:
    - description: >-
        IDEA-20261004-e4c461 asks how much auxiliary data
        separates conflicting depth-two labels. This hypothesis
        tests the middle j-invariant alone.
      citation: ledger/proposals/IDEA-20261004-e4c461.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-05, proposal file read
      role: source claim
  reduction_chain:
    core_problem: Residual endpoint ambiguity after a published middle.
    corollaries: []
  predictions:
    - metric: ambiguous_middles
      direction: equal
      minimum_effect: "0 at p=7, 2 at p=11, 4 at p=19"
    - metric: separated_middles
      direction: equal
      minimum_effect: "1 at p=7, 1 at p=11, 0 at p=19"
    - metric: max_endpoint_fiber
      direction: equal
      minimum_effect: "1 at p=7, 2 at p=11, 2 at p=19"
  test_boundary:
    instances:
      - depth-two Phi_2 walks on S_p for p in {7, 11, 19}
    parameters:
      primes: [7, 11, 19]
      depth: 2
    implementation: >-
      Two evaluations of Phi_2, the monomial form and the cubic
      expansion in the second variable.
    budget:
      maximum_runs: 6
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Both Phi_2 evaluations agree and an ambiguous-middle count,
      a separated-middle count, or an endpoint set differs from
      the statement.
  interpretation_limits:
    - The unlabeled walk contract is unchanged. This record does not replace it.
    - Not a CSIDH action, not SiGamal, and not a theorem about all PKE.
    - A timeout, a crash, or a formula disagreement is not evidence against the statement.
  dominated_by:
    verdict: not_applicable
    justification: A finite graph audit. No exponent is claimed.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Records ambiguous middles 0, 2, 4 and separated middles
      1, 1, 0.
  status_note: >-
    Approved with EXP-SSI-474826 by DEC-20261005-850856 under the
    standing user authorization of 2026-09-06.
