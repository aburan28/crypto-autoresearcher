  reduction_chain:
    core_problem: >-
      Whether the Step 5 verdict of a monodromy-certification protocol is the
      declared function of its inertia lower bound, its realized value and
      its structural upper bound, at a realized-class count an order of
      magnitude beyond the battery that validated it.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. This is a protocol test on synthetic data; it reaches
    no downstream mathematical problem and asserts no reduction.

  predictions:
    - metric: "ARM A protocol verdict (U = 100) at each sample-size tier; categorical in {DECIDED, UNDECIDED}"
      direction: different
      minimum_effect: >-
        UNDECIDED at every tier where the realized-class count is below 100;
        DECIDED at and after the tier where it reaches 100, because
        R_stab = U outright and the committed Step 5 declares that
        self-certifying. AN UNDECIDED VERDICT AFTER FULL REALIZATION IS A
        FALSIFIER: the protocol would be refusing where its own rule
        certifies.
    - metric: "ARM B protocol verdict (U = 200, same census data) at each tier; categorical"
      direction: different
      minimum_effect: >-
        UNDECIDED at EVERY tier, with both bounds (U = 200, L = 1) reported,
        regardless of how uniformly the 100 realized classes fill out. A
        DECIDED verdict at any tier is overclaiming and is rejected outright.
    - metric: "agreement between Arm A and Arm B at and after the completion tier; boolean"
      direction: different
      minimum_effect: >-
        THE ARMS MUST DISAGREE. Identical census data, two declared U values,
        two forced verdicts. If they agree - both DECIDED or both UNDECIDED -
        the verdict is not a function of the declared bounds and THAT is the
        finding, more consequential than either arm alone.
    - metric: >-
        realized-class count as a function of sample size (the
        coupon-collector curve); integer count in 0..100 per sample size
      direction: higher
      minimum_effect: >-
        Materially slower convergence to "most classes seen" than any of the
        six already-tested battery members, quantitatively confirming that
        this object stresses the sampling requirement in a regime the
        existing battery does not reach. The completion tier - the smallest
        declared sample size at which the count reaches 100 - is a reported
        quantity in its own right and is what makes Arm A's transition
        checkable.
    - metric: "reproduction of the already-committed order-120 member's UNDECIDED verdict under the same implementation; categorical"
      direction: same
      minimum_effect: >-
        EXACT reproduction. Any mismatch means the protocol implementation
        has drifted and the new object's result is uninterpretable until
        fixed.
    - metric: "chi-square statistic of the realized-class histogram against the uniform 1/100 law at each sample size; dimensionless"
      direction: different
      minimum_effect: >-
        Not rejecting uniformity at the 1 percent level at the largest tested
        sample size. A rejection means the sampler is biased and the census
        is measuring the sampler rather than the protocol.

  test_boundary:
    instances:
      - "One abstract group: Z/100 in its regular representation on 100 points."
      - "Two arms differing ONLY in the declared structural upper bound: Arm A with U = 100, Arm B with U = 200 (the dihedral ambient on the same 100 points)."
      - "The already-tested order-120 battery member, re-run as a blocking reproduction gate."
      - "A sample-size stability arm at 3x the largest declared size."
    parameters:
      group: "Z/100, regular representation, 100 points"
      U_arm_A: 100
      U_arm_B: 200
      L: "1 in both arms, by design, no inertia bound derived"
      sample_sizes: "{200, 1000, 5000, 20000}"
      ladder_tiers: "k = 1..4, a DISCLOSED relabelling of the four sample-size tiers, not genuine base change"
    implementation: >-
      Pure integer arithmetic over an explicit multiplication table or the
      cyclic group's own addition. A deterministic pseudo-Frobenius rule
      mapping a base-point index to a group element, disclosed in full in the
      contract. NO CURVE, NO POLYNOMIAL, NO FIELD EXTENSION, NO COVER is
      constructed anywhere.
    budget: >-
      See EXP-ECDLP-7d929c. The whole battery is a few hundred thousand
      integer operations and a 100-entry counter table.

  falsification_conditions:
    - >-
      ARM A returns UNDECIDED after the census has realized all 100 elements
      with U = 100 declared. The protocol refuses where its own committed
      Step 5 second disjunct certifies, and its verdict is not the function
      its text states.
    - >-
      ARM B returns DECIDED at any tier with U = 200 declared and R_stab at
      most 100. That is overclaiming and is rejected outright, exactly as the
      scoped-down member's own falsification condition specifies.
    - >-
      The two arms return the SAME verdict at and after the completion tier.
      The verdict is not a function of (L, R_stab, U); this is the single
      most consequential possible outcome of this record and must be
      escalated to independent review rather than absorbed.
    - >-
      The already-tested order-120 member fails to reproduce its committed
      UNDECIDED verdict. The implementation has drifted and nothing new is
      interpretable.
    - >-
      The realized-class count at the largest sample size changes materially
      when the sample size is tripled. Sampling instability voids the
      stability reading and Arm A's completion tier.
    - >-
      The chi-square test rejects uniformity of the realized histogram at the
      1 percent level at the largest sample size. The sampler is biased and
      the census measures the sampler.
    - >-
      Any timeout or crash. INFRASTRUCTURE outcome under AGENTS.md rule 5.

  interpretation_limits:
    - >-
      TOOLING/PROTOCOL CLAIM ONLY. No curve, monodromy, cover or relation-rate
      content, and NO ECDLP CLAIM OF ANY KIND in either direction.
    - >-
      THE LADDER MACHINERY IS REPURPOSED, NOT GENUINE. No field extension
      exists behind this abstract object; the k levels are a disclosed
      relabelling of increasing sample-size tiers. This must never be
      mistaken for a field-theoretic result.
    - >-
      Passing does not certify the protocol at cryptographic-scale group
      orders (thousands to millions of classes). It extends the tested range
      from about 120 to 100-200 with a materially larger observable
      granularity, and no further. THE CRYPTOGRAPHIC-SCALE FORM OF THIS
      QUESTION CANNOT BE TESTED AT REACHABLE SCALE by any design in this
      family, because the sampling cost of a coupon-collector census grows
      with the class count; that is stated rather than narrowed away.
    - >-
      GROUP CHOICE IS ONE INSTANTIATION, NOT A FAMILY. Z/100's regular
      representation is the cleanest closed-form comparator; a non-abelian
      group of order 100 or 200 would also match the literal specification
      and might behave differently under sampling. This record tests one
      concrete instantiation and says so.
    - >-
      THE SOURCE IDEA'S SINGLE-ARM PREDICTION IS SUPERSEDED HERE, and the
      reason is recorded in `design_note`: run as the source specifies, the
      experiment would return DECIDED under the committed Step 5 and would
      then be scored as a falsification of a `supported` record for behaving
      correctly. The two-arm design exists to prevent that manufactured
      falsification and to give the discriminator a reachable second verdict.
    - >-
      NO STATUS CHANGE to the protocol record or to any other record is
      proposed or implied. Coordinator authority alone, AGENTS.md rule 1.

