  design_note: >-
    DESIGN ONLY, AND THE SOURCE IDEA'S CENTRAL PREDICTION IS CORRECTED HERE
    RATHER THAN ADOPTED. The source proposes a large-order abstract group as
    the literal version of a battery member that was scoped down, and
    predicts that the protocol under test "RETURNS UNDECIDED with both bounds
    reported, REGARDLESS of how densely the observed histogram matches the
    group's own known law", declaring that "a DECIDED verdict at any k
    falsifies the protocol outright".
    THE COORDINATOR READ THE PROTOCOL VERBATIM RATHER THAN TAKING THAT
    READING. ledger/hypotheses/H-MONO-59f6a6.yaml, mechanism STEP 5, states:
    "Report DECIDED with the group when L = R_stab = U, OR when R_stab = U
    outright (realizing the full structural ceiling is self-certifying even
    without an independently derived L -- O5's own logic: nothing can be
    realized beyond U). Report UNDECIDED, with both bounds, otherwise."
    THE SOURCE'S READING OMITS THE SECOND DISJUNCT, AND THE OMISSION IS
    DECISIVE. The source's recommended object is the regular representation
    of a group of order 100 with the structural upper bound U declared as 100
    - so once a census realizes all 100 elements, R_stab = U outright and the
    COMMITTED protocol REQUIRES a DECIDED verdict. Run as the source
    specifies, the experiment would return DECIDED, and the source's own
    falsification condition would then record a `supported` hypothesis as
    "overclaiming, rejected outright" for doing exactly what its committed
    text says it should do. That is a MANUFACTURED FALSIFICATION, and it is
    also a degenerate discriminator in the opposite direction: the declared
    band admits only one verdict, so the test cannot distinguish a protocol
    that refuses correctly from one that refuses always.
    THE FIX, AND IT IS THIS RECORD'S CONTRIBUTION: run TWO ARMS on the SAME
    census data with two declared structural upper bounds, one forcing
    DECIDED and one forcing UNDECIDED. That restores dynamic range - the
    verdict function is then required to return both values on identical data
    - and it tests the property the source actually wanted to test.
    No status of any record is changed and nothing here is evidence.

  status: proposed
  proposed_by: idea-generator

  statement: >-
    TEST BOUNDARY FIRST, AND IT IS UNUSUALLY NARROW. This is a
    TOOLING/PROTOCOL hypothesis about a VERDICT FUNCTION evaluated on
    SYNTHETIC ABSTRACT-GROUP DATA. There is no elliptic curve, no polynomial,
    no cover, no field extension and no relation rate anywhere in it. It
    makes NO ECDLP claim of any kind, in either direction.

    THE ARTIFACT UNDER TEST is the five-step base-change-ladder protocol
    validated on a six-object battery at p = 211, and specifically its Step 5
    verdict discipline: DECIDED when L = R_stab = U, OR when R_stab = U
    outright; UNDECIDED with both bounds otherwise.

    THE GAP BEING CLOSED. That battery's largest-order member was SCOPED DOWN
    from a specification calling for roughly 100 realized classes each of
    density about 1/100 to a random monic quintic, for a stated feasibility
    reason - a group of order about 100 cannot act faithfully on a fibre of
    size at most 8 - and the record naming that scoping-down states, in its
    own words, that "the idea's literal N5 remains untested and is named as
    future work". Nothing since has tested it. The tested battery's largest
    group order is 120 acting on a fibre of size 5; nothing in it approaches
    100 realized permutations as the observable granularity.

    THE CLAIM, IN TWO PARTS, ONE PER ARM.
    ARM A, DECIDED-FORCED. Take G = Z/100 in its regular representation on
    100 points, sampled by a disclosed deterministic pseudo-Frobenius rule,
    with the structural upper bound declared as U = 100 and no inertia-derived
    lower bound (L = 1 by design). PREDICTED: the protocol returns UNDECIDED
    at every sample size at which the census has NOT yet realized all 100
    elements, and returns DECIDED at and after the sample size at which it
    has - because R_stab = U outright, which the committed Step 5 declares
    self-certifying. The transition sample size is itself a
    coupon-collector measurement.
    ARM B, UNDECIDED-FORCED. Take the SAME sampled Z/100 census data, but
    declare the ambient structural upper bound to be the dihedral group of
    order 200 acting on the same 100 points, so U = 200 while the realized
    group is the order-100 rotation subgroup and no L is derivable.
    PREDICTED: R_stab = 100 < U = 200 at every sample size, so the protocol
    returns UNDECIDED at every tier, NO MATTER how uniformly the 100 realized
    classes fill out and no matter how convincingly the histogram matches the
    known law. THIS IS THE LITERAL STRESS TEST THE SOURCE WANTED, and it is
    now non-degenerate because Arm A can and must return the other verdict on
    the same data.

    THE DISCRIMINATION. The two arms differ ONLY in the declared U. If the
    protocol's verdict is the function of (L, R_stab, U) its committed text
    says it is, the two arms MUST disagree once the census is complete. If
    they agree - both DECIDED or both UNDECIDED - then the verdict is not a
    function of the declared bounds, and THAT is the finding, considerably
    more consequential than either arm alone.

    WHAT IS NOT CLAIMED. No curve, monodromy, cover or relation-rate content.
    No claim that the protocol is certified at cryptographic-scale group
    orders. No status change to any record; the protocol record under test
    remains `supported` and only a Coordinator decision could move it.

  mechanism: >-
    THE FIVE-STEP PROTOCOL IS REUSED UNMODIFIED: structural upper bound U;
    inertia lower bound L, deliberately NOT derived here and recorded as
    trivial L = 1 by design, exactly as the scoped-down battery member did;
    realized-class census; the ladder; and the Step 5 verdict discipline. The
    only new content is the OBJECT and the sampling convention needed to
    reach a genuinely large class count at toy compute, plus the two-arm
    structure that gives the verdict function something to discriminate.

    THE OBJECT. G = Z/100 acting on itself by left multiplication - the
    regular representation on 100 points, so a census over G's elements IS a
    census over its 100 realized permutations at density exactly 1/100 each.
    Pseudo-Frobenius elements are sampled by a FIXED, DISCLOSED deterministic
    rule (the j-th sampled element is g^j for a generator g, with j drawn by
    a declared index sampler), rather than derived from a polynomial's
    splitting field. That sidesteps the polynomial-construction and inertia
    derivation entirely and is the same convention the battery's own
    density-comparator members already use.

    WHY THE LADDER MACHINERY IS A RELABELLING HERE, DISCLOSED IN ADVANCE. No
    field extension exists behind this abstract object. The k levels are a
    declared relabelling of increasing sample-size tiers, NOT genuine base
    change. This must never be mistaken for a field-theoretic result and is
    stated as a repurposing in every report.

    WHY TWO ARMS RATHER THAN ONE. A single arm with U = 100 forces DECIDED
    once the census completes; a single arm with U = 200 forces UNDECIDED
    always. Either alone is a test whose acceptance band admits one verdict,
    which cannot distinguish a protocol that refuses CORRECTLY from one that
    refuses ALWAYS, nor a protocol that certifies correctly from one that
    certifies always. Running both on IDENTICAL census data makes the
    declared U the only independent variable and makes the verdict function
    itself the measured object. That is the design's whole content.

    WHY THIS IS A STRONGER TEST THAN THE ALREADY-TESTED SUBSTITUTE. The
    tested member has group order 120 acting on a fibre of size 5, where the
    coarsest observable is a cycle type and a census can look complete
    quickly. Here the observable granularity is 100 distinct GROUP ELEMENTS
    on a 100-point set, so a coupon-collector argument requires materially
    more draws before every class is seen even once, and the temptation to
    read "we saw close to 100 distinct outcomes, evenly spread" as
    completeness is stronger and more realistic. Under Arm B that temptation
    must be refused; under Arm A it must NOT be, because the ceiling really
    is reached.

  assumptions:
    - >-
      An abstractly-sampled permutation group, with no polynomial or curve
      behind it, is an admissible object for THIS protocol, exactly as the
      battery's existing density-comparator members treat realized subgroup
      order as a comparator against a known density law rather than as a
      literal generated-subgroup computation on a fixed labelled fibre.
    - >-
      The pseudo-Frobenius sampling rule produces uniform draws over the
      chosen group. For Z/100 under g^j with a generator g, uniformity of the
      GROUP element follows from uniformity of the index j mod 100 by
      elementary group theory; the actual gap is the statistical uniformity
      of the index sampler itself, which is tested rather than assumed.
    - >-
      The structural upper bound U is a DECLARED input in both arms, fixed in
      the contract before any sampling, and is the only variable that differs
      between them.
    - >-
      No inertia-derived lower bound is available or used in either arm;
      L = 1 by design, exactly as the scoped-down battery member specified
      for itself.
    - >-
      Any convenient toy prime used to index a modular sampling rule is
      incidental; the group under test is abstract and depends on no elliptic
      curve and on no cover.

  proof_search_map:
    bottleneck: >-
      Whether the protocol's verdict is actually a FUNCTION of (L, R_stab, U)
      as its committed Step 5 states, when evaluated at a class count an
      order of magnitude larger than anything the validating battery reached
      and where a dense-looking census makes overclaiming realistic rather
      than obviously premature.
    baseline_embedding:
      parameter_slice: >-
        The already-tested scoped-down member (a random monic quintic, group
        order 120, fibre size 5, U = 120, L = 1) is the parameter slice this
        record must not contradict: under the identical Step 5 logic it
        returns UNDECIDED, because its realized value is a DENSITY-COMPARATOR
        quantity rather than a literal generated-subgroup order and so never
        equals U as a generated subgroup.
      reproduction_check: >-
        Re-run that member's cell under the same protocol implementation and
        require EXACT reproduction of its committed UNDECIDED verdict. A
        mismatch means the implementation, not the new object, has changed,
        and no new-object result is interpretable until it is fixed.
    observation_collision:
      observable: >-
        The realized-class density histogram as a function of sample size,
        for a group with no independently derivable inertia lower bound.
      distinct_preimage_search: >-
        FOUND, AND IT IS THE POINT. A dense, near-uniform histogram over 100
        classes is consistent BOTH with "this is the whole ambient structure
        and nothing larger exists" and with "this is a proper subgroup of a
        larger ambient structure that a finite sample cannot distinguish from
        completeness". The two are observationally IDENTICAL at any finite
        sample size without an independent bound - which is why the protocol
        must refuse rather than infer. The two-arm design realises exactly
        this collision as an experiment: Arm A and Arm B feed the SAME
        histogram to the protocol under two declared ambient structures, and
        the verdict must differ.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          An abstract, disclosed pseudo-Frobenius sampling rule over a group
          of order 100-200, replacing a polynomial and inertia derivation
          entirely.
        predicted_gain: >-
          Reaches the literal 100-class scale at zero polynomial-construction
          cost, isolating the sampling and refusal-discipline question from
          the algebro-geometric derivation question the smaller battery
          members also test.
      - transform: observable_fiber
        proposed_object: >-
          Hold the census data fixed and vary the DECLARED structural upper
          bound U between 100 and 200, so that the verdict function is the
          only thing being measured.
        predicted_gain: >-
          Converts a one-verdict test with a width-zero band into a
          two-verdict test in which both outcomes are forced and reachable,
          and in which agreement between the arms is itself a finding.
    quantifier_order: >-
      FOR the declared object and FOR EVERY tested sample-size tier: under
      ARM A (U = 100) the protocol returns UNDECIDED while the realized class
      count is below 100 and DECIDED once it reaches 100; under ARM B
      (U = 200) it returns UNDECIDED at every tier regardless of the
      histogram. NOT CLAIMED: anything about a genuine algebro-geometric
      cover of this size, anything at group orders beyond a few hundred, and
      anything about elliptic curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On synthetic abstract-group data whose realized-class count is an
        order of magnitude larger than anything previously tested in this
        lane, the protocol's Step 5 verdict is (or is not) the declared
        function of L, R_stab and U, returning both verdicts on identical
        data under two declared ambient bounds." It CANNOT certify anything
        about a genuine cover of this size, since none is constructed; it
        cannot certify behaviour at group orders beyond a few hundred, where
        sampling cost becomes binding; and it certifies nothing whatever
        about elliptic curves or the ECDLP.
      nearby_object_control: >-
        The already-tested scoped-down member, order 120, is the nearby
        object: under the identical Step 5 logic it must return UNDECIDED,
        and any divergence in its verdict under this implementation localises
        the change to the implementation rather than to the new object.
    proof_obligations:
      - claim: "The pseudo-Frobenius sampling rule produces a uniform distribution over the chosen group, checked by chi-square on the realized histogram."
        responsibility: correctness
      - claim: "The already-tested order-120 member reproduces its committed UNDECIDED verdict under the same implementation."
        responsibility: baseline
      - claim: "No inertia-derived lower bound is available or used for the new object; L = 1 by design in both arms."
        responsibility: strictness
      - claim: >-
          Under Arm A the protocol returns DECIDED once R_stab = U = 100, as
          the committed Step 5 second disjunct requires, and UNDECIDED
          before.
        responsibility: interface
      - claim: >-
          Under Arm B the protocol returns UNDECIDED at every tier, since
          R_stab = 100 < U = 200 and L = 1.
        responsibility: interface
      - claim: >-
          The two arms DISAGREE at and after the completion tier. Agreement
          means the verdict is not a function of the declared bounds.
        responsibility: strictness

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null and emphatically so. NO ALGORITHM OR ATTACK IS
    PROPOSED, no exponent is claimed or moved, and NO ECDLP CLAIM OF ANY KIND
    is made in either direction. Memory is O(1) beyond a 100-to-200 entry
    class-count table. Pollard rho at 0.886*sqrt(N) with O(1) memory remains
    the prime-field baseline and is not touched, mentioned or approached.

  heuristic_assumptions:
    - id: HEUR-PROT-1
      formal_statement: >-
        The disclosed pseudo-Frobenius sampling rule produces independent
        uniform draws over the chosen group's elements, so the realized-class
        density histogram converges to the group's own known law (uniform
        1/100 per class under the regular representation) as sample size
        grows.
      random_model_justification: >-
        For the recommended construction - Z/100 under g^j for a generator g
        with j drawn from a large index range and reduced mod 100 -
        uniformity of the GROUP element given uniformity of the index is
        EXACT by elementary group theory, since a generator's powers cycle
        through every element exactly once per period. It is recorded as a
        heuristic only because the sampling of the INDEX j itself must be
        checked for statistical uniformity mod 100, which is the actual gap
        and is measured rather than assumed.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-7d929c]
      falsification_condition: >-
        A chi-square goodness-of-fit test rejecting uniformity at the 1
        percent level at the largest tested sample size, indicating the
        sampling rule itself is biased. In that case the census is measuring
        the sampler and no verdict may be read.
    - id: HEUR-PROT-2
      formal_statement: >-
        The realized-class count at the largest tested sample size is stable:
        tripling the sample size does not change it.
      random_model_justification: >-
        A coupon-collector bound: with 100 classes at uniform density, the
        expected number of draws to see every class is about 100 * H(100),
        roughly 519, so a sample of 20000 is far into the regime where every
        class has been seen with overwhelming probability. The classical
        statement imitated is the standard coupon-collector concentration
        result. THE GAP is that the bound assumes the sampler is uniform,
        which is HEUR-PROT-1 and is measured separately.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-7d929c]
      falsification_condition: >-
        The realized-class count at the largest tested sample size changes
        materially when the sample size is tripled. That is sampling
        instability and it voids the stability reading and, with it, Arm A's
        completion-tier determination.

