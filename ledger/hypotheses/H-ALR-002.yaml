hypothesis:
  id: H-ALR-002
  question_id: RQ-ALR-002
  statement: >-
    The R182 target-gcd multiplicity is an exact nonzero weight on candidate
    source components, and 2c weighted source power moments recover the
    degree-c candidate locator, while standard represented projector and
    A-linear target-Krylov routes retain an nN coefficient body.
  mechanism: >-
    On each squarefree split target chart, the Fermat projector
    1-M_RP^(p-1) has trace equal to deg gcd(W,R_P). Summing chart traces gives
    a source weight m_P that is nonzero exactly for candidates when total
    target degree is below the characteristic. The moments sum_P m_P x(P)^k
    have a weighted Vandermonde factorization, so Berlekamp-Massey recovers the
    candidate locator after coefficient reversal.
  assumptions:
    - The source divisor is squarefree with distinct source x-coordinates
    - Public target duplicates are removed and opposite points use separate x-injective charts
    - Total target degree is below the field characteristic, preventing nonzero multiplicity cancellation
    - Asymptotic costs are charged in represented input and output dimensions
  predictions:
    - metric: nested_projector_trace_equals_target_gcd_degree
      direction: equal
      minimum_effect: all 13 controls pass
    - metric: weighted_prony_locator_replay
      direction: equal
      minimum_effect: all 13 candidate locators match independent factors
    - metric: source_blind_trace_label_completeness
      direction: less
      minimum_effect: one exact equal-spectrum collision has different candidate locators
    - metric: represented_route_exponent_B
      direction: greater
      minimum_effect: 7/2 versus the 5/2 rho proxy
    - metric: slp_direct_nested_moment_constructor
      direction: different
      minimum_effect: remains open unless an explicit softly O(n+N+c) algorithm is supplied
  test_boundary:
    instances:
      - AutoLab R182 replay seeds 16001, 16002, 18104, and 18206 on three curve families
      - new strided source-divisor family at seed 18307
      - exact F_101 source-row-swap collision
    parameters:
      source_commit: 583225fe9224d3f2a3dc910d88108deeb5cb31b6
      source_round: R183
      harness_state: V132
    implementation: experiments/EXP-ALR-002/source/p1553_m6_sparse_projector_prony_locator_probe_r183.py
    budget:
      maximum_runs: 1
  falsification_conditions:
    - Any Fermat-projector trace differs from the target-chart gcd degree
    - Any nonzero multiplicity support differs from direct group-law candidate support
    - Any weighted Hankel rank or Berlekamp-Massey order differs from candidate degree c
    - Any recovered locator differs from its independent candidate factor
    - A source-blind target trace is credited despite the exact row-swap collision
    - A represented route is credited below rho without charging its nN body
  interpretation_limits:
    - Exactness, collision, and locator recovery are established only on finite toy controls
    - No general nonlinear trace, SLP, circuit, RAM, or data-structure lower bound is claimed
    - No compact nested-moment constructor, factor logs, identical fresh-target descent, generic-prime attack, rho improvement, or Shoup improvement is supplied
  status: analyzed
  proposed_by: autolab-r183-port
