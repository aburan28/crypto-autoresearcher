    doublings and 1 addition. The binary weight is 2. Three exceeds
    two by 1. Two exceeds one by 1. The product of the bit length,
    the doubling count, and the addition count is 6. Their sum is 6.
    Two readings of 6 each have 1 addition, so that gap is 0.
