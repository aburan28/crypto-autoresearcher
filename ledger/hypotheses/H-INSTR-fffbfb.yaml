hypothesis:
  id: H-INSTR-fffbfb
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aa267f
  source_proposal_id: IDEA-20260807-34754f

  statement: >-
    SCOPE: the label-permutation null (NULL-C) implemented at
    harness/exp_icinv.py::permutation_null and called by harness/run_icinv.py, on
    completely enumerated F_p-isogeny classes at toy primes p in {4001, 6007}.
    CLAIM TIER toy. THIS IS AN INSTRUMENT HYPOTHESIS. IT ASSERTS NOTHING ABOUT
    ECDLP COST, NO SPEEDUP, NO EXPONENT, NO ATTACK. sota_delta is ZERO on every
    axis and no deployed or standardized curve is in scope.

    Four numbered claims, each separately checkable and separately falsifiable.

    C1 (DIAGNOSIS -- arithmetic, in-sample). The free label permutation reported
    by the campaign's committed runs on the full-field liftable density is the
    group order N = #E(F_p) plus the rational-2-torsion term, exactly and with no
    residual. Precisely: at a pool of complete classes at fixed p, writing
    Y_i = (N_{c(i)} - 1 + z_i)/2 for the full-field liftable count (the identity
    verified on every curve by harness/exp_icinv.py::liftable_count_identity),
      observed statistic  T_obs = mean_c Var(z_c)/4
      free-permutation null mean  E[T_pi | free] = S^2_Y
                                 = (S^2_N + S^2_z + 2*Cov(N,z)) / 4
    where S^2_X is the pooled (n-1)-denominator sample variance over the pooled
    curve set. Both are closed forms in (N_c, n_c, {z_i}) alone and neither
    requires any measurement beyond z.

    C2 (DESIGN -- statistical). Restricting the permutation to blocks that are a
    COARSENING OF THE CLASS PARTITION (every block is a union of whole classes,
    which is automatic when blocks are defined by a class invariant such as N or
    the twist pair) yields a valid conditional permutation test of "class
    membership is independent of the functional given the block", preserves the
    group-size multiset exactly, makes the permutation block-separable, and makes
    the null mean computable in closed form as the size-matched mean over classes
    of the BLOCK-pooled sample variance, E[T_pi | B] = mean_c S^2_{block(c)}.
    Its residual N-nuisance is then EXACTLY the within-block variance of N, is
    reportable as a per-rung nuisance budget, and is bounded by the band width.

    C3 (UTILITY -- empirical, and the clause that can say the fix is worse than
    the disease). At the campaign's pools and class sizes the blocked test still
    detects a planted between-class effect of size 0.8 within-class standard
    deviations at the finest NON-DEGENERATE blocking, in at least 90% of
    replicates at level 0.05.

    C4 (CONSEQUENCE -- and it is predicted FALSE for the calibration functional,
    which is the point). At fixed p, N = p + 1 - t is INJECTIVE in the trace, so
    no non-degenerate blocking can drive the residual N contrast to zero. For a
    functional that is an exact affine function of N -- which the full-field
    liftable count provably is -- the blocked p-value therefore CANNOT be rescued
    at fixed p, and the honest instrument output is not an absolute p-value but
    the pair (nuisance budget, minimum detectable effect) at each rung, together
    with the functional's decay curve compared against a pure-N surrogate of
    matched within-class noise.

    IF C1 FAILS the proposal's diagnosis of the committed 664x ratio is withdrawn
    at zero compute. IF C2 FAILS (the blocked null fires on a trace-independent
    labelling, or the closed form misses the empirical null mean) no result may be
    reported from the design at all. IF C3 FAILS the recorded conclusion is that
    THE STRATIFIED NULL IS NOT BETTER THAN THE FREE ONE at these pools and the
    design is not recommended for adoption. IF C4 turns out FALSE for some
    functional -- i.e. a functional's signal survives the finest non-degenerate
    blocking while a matched pure-N surrogate's does not -- then the campaign has a
    genuine between-class effect beyond the group order, which is the outcome
    worth the whole exercise.

  mechanism: >-
    DERIVED FROM SOURCE AND FROM COMMITTED ARTIFACTS. Every step below is read
    from harness/exp_icinv.py, harness/run_icinv.py, harness/isogeny_class.py and
    the committed raw-result.json files named in source_refs, and re-derived here.
    Nothing is recalled and no external citation is asserted except where marked
    standard.

    STEP 1 -- WHAT THE INSTRUMENT AS BUILT DOES.
    harness/exp_icinv.py::permutation_null pools the measured values across the
    selected classes, shuffles them freely, re-partitions into groups of the SAME
    SIZES, and returns (observed, null_mean, p_value) with the statistic
    "mean within-group variance", UNWEIGHTED across groups, and the estimator
    p = #{v <= observed}/B. harness/run_icinv.py labels it "NULL-C: does the
    grouping by isogeny class carry any information?" and prints "class grouping
    reduces within-group variance" whenever p < 0.05. Three defects follow
    immediately and none of them is an opinion: the estimator can return exactly
    0.0, which is not a p-value; the unweighted mean over groups of unequal size
    weights small classes up; and the free shuffle mixes N across the shuffled
    groups.

    STEP 2 -- WHY THE FREE PERMUTATION IS THE WRONG NULL, AS ARITHMETIC.
    At fixed p an F_p-isogeny class is indexed by its trace t (Tate; used as
    harness/isogeny_class.py already uses it, not re-derived), and
    N = #E(F_p) = p + 1 - t is CONSTANT within the class and DIFFERENT between
    classes. Any functional depending on N therefore carries a between-class
    component that is definitionally true of isogeny classes and says nothing
    about isogeny structure. A free permutation samples that component into the
    null's within-group variance, the observed value sits below the null, and the
    test fires -- detecting "different classes have different group orders".

    STEP 3 -- THE CLOSED FORM FOR THE NULL MEAN, WHICH MAKES THE ABOVE EXACT
    RATHER THAN RHETORICAL. Under a uniformly random assignment of the pooled
    values to groups of fixed sizes, each group is a simple random subset without
    replacement, so E[s^2_c] = S^2 for every group c, hence
      E[mean_c s^2_c] = S^2   and   E[SS_within/(n-K)] = S^2,
    S^2 being the pooled sample variance of the whole pool. BOTH the committed
    unweighted statistic and the size-weighted statistic therefore have the same
    expectation, and it is a closed form in the data. Under a blocking whose
    blocks are unions of whole classes, each group lies entirely inside one block,
    the permutation is block-separable, and the same argument inside each block
    gives
      E[mean_c s^2_c | B] = mean_c S^2_{block(c)},
      E[SS_within/(n-K) | B] = weighted mean_c S^2_{block(c)},
    with S^2_beta the pooled sample variance over block beta. This is the whole
    statistical content of the design and it is checkable to Monte-Carlo error.

    STEP 4 -- THE CALIBRATION FUNCTIONAL HAS A KNOWN ANSWER.
    harness/exp_icinv.py::liftable_count_identity derives, and every committed
    EXP-ICINV run verifies on every curve, that the full-field liftable count is
      L = #{x in F_p : x^3 + ax + b is a square} = (N - 1 + z)/2,
    z the rational 2-torsion x-count. Hence within a class L varies ONLY through
    z, so Var_within(L) = Var(z)/4 exactly; and between classes L differs by
    exactly (N_c - N_c')/2 = (t' - t)/2. Substituting into STEP 3 gives, in COUNT
    units,
      T_obs = mean_c Var(z_c)/4,
      E[T_pi | free] = S^2_Y = (S^2_N + S^2_z + 2*Cov(N,z))/4.
    Nothing is fitted; the entire free-permutation behaviour of this functional is
    determined by (N_c, n_c, {z_i}).

    STEP 5 -- THE CLOSED FORM EVALUATED AT THE CAMPAIGN'S COMMITTED SLICE, AND
    CHECKED AGAINST IT. All inputs below are read from
    experiments/EXP-ICINV-180a0d/runs/RUN-ICINV-p4001-a/raw-result.json and are
    identical in the three EXP-ICINV-9b1f7c p = 4001 runs:
      t =  30: N = 3972, n = 138, mean z = 1.9565217391304348,
               Var(z) = 1.0053951126626468
      t = -30: N = 4032, n = 138, same mean z and Var(z)
      t =  18: N = 3984, n =  98, mean z = 1.8571428571428572,
               Var(z) = 0.9896907216494846
      t = -18: N = 4020, n =  98, same mean z and Var(z)
    The committed detail field records "distinct values: 2" for two_torsion_x in
    all four classes, so z is in {1,3}, and mean and size then FORCE the
    composition: 66 curves with z = 3 and 72 with z = 1 in each n = 138 class,
    42 with z = 3 and 56 with z = 1 in each n = 98 class. In exact rationals
    Var(z) = 72864/72473 and 96/97 respectively.
    Derived at freeze time by this Coordinator, in count units:
      mean_c Var(z_c)/4 = 0.24938572928901642
        against the committed metric
        full_field_liftable_within_class_count_variance = 0.24938572928898783,
        residual 2.859e-14  (independently recorded as 2.86e-14 in
        CORR-20260807-2c9ae4 and in RUN-ICINV-p4001-identity's decay_verdict);
      grand mean of N = 4002 exactly; SS_N = 311904; S^2_N = 662.2165605095541;
      SS_z = 468.6101762..., S^2_z = 0.9949260...;
      Cov(N,z) = 0 EXACTLY, because the pool is two symmetric twist pairs and the
        +t and -t contributions cancel term by term;
      S^2_Y = (662.2165605 + 0.9949260)/4 = 165.8028717 count^2,
      i.e. 165.8028717 / 4001^2 = 1.0357456e-05 in RATE units.
    The committed window_decay cell at W = 4001 records
      observed_mean_within_variance = 1.557881769803647e-08,
      null_mean                     = 1.0357263552475702e-05,
      permutation_p_value           = 0.0.
    The closed form reproduces the observed value EXACTLY
    (0.24938572928901642 / 4001^2 = 1.5578817698e-08) and the null mean to a
    relative residual of 1.9e-05, which is inside the Monte-Carlo error of the
    B = 1000 permutations that run used. THE 664x IS THE GROUP ORDER: the ratio
    1.0357263552475702e-05 / 1.557881769803647e-08 = 664.79.

    STEP 6 -- THE BLOCKING LADDER, AND THE FACT THAT TWIST BLOCKING AND N BLOCKING
    PULL IN OPPOSITE DIRECTIONS. Order the rungs by Delta_max, the maximum
    within-block spread of N. Evaluating STEP 3's closed form at the committed
    slice, again at freeze time and again from committed numbers alone:
      R0 FREE      one block            Delta_max = 60   E[T_pi] = 165.8029 count^2
                                                          ratio T_obs/E = 1/664.8
      R1 TWIST     blocks {30,-30},{18,-18}
                                        Delta_max = 60   E[T_pi] = 153.8651 count^2
                                                          ratio           = 1/617.0
      NBAND(24)    blocks {30,18},{-18,-30}
                                        Delta_max = 12   E[T_pi] =   9.0279 count^2
                                                          ratio           = 1/36.2
      R5 PERCLASS  one block per class  Delta_max =  0   E[T_pi] = T_obs, ratio = 1,
                                                          p-hat forced to exactly 1
    TWO CONSEQUENCES THE PARENT PROPOSAL DOES NOT DRAW, AND THEY ARE THE REASON
    THIS CONTRACT EXISTS RATHER THAN A DIRECT IMPLEMENTATION OF THE PROPOSAL.
    (i) TWIST BLOCKING IS NEARLY POWERLESS AGAINST N. The quadratic-twist pair
    {t,-t} is the pair with the LARGEST N gap in the pool (2|t| = 60 and 36 here),
    not the smallest, so blocking on it removes the between-pair contrast and
    keeps the largest within-pair one. The nuisance falls by 7%, from 1/664.8 to
    1/617.0. Twist blocking is justified by EXCHANGEABILITY (twist-invariant
    functionals duplicate values across the pair), not by N, and the two must not
    be conflated.
    (ii) THE TWO BLOCKINGS CANNOT BE COMPOSED AT FIXED p WITHOUT DEGENERATING.
    Their intersection separates t from -t whenever the band width is below 2|t|;
    at this slice with w = ceil(Delta_pool/2) = 30 against min 2|t| = 36 every
    intersection block holds exactly one class, so the composed rung is the
    identity permutation.

    STEP 7 -- WHAT THE DESIGN CAN AND CANNOT DELIVER, GIVEN STEP 6.
    Since N is injective in t at fixed p, distinct classes never share N, so no
    non-degenerate blocking sets the residual N contrast to zero. For a functional
    that is an exact affine function of N the blocked p-value therefore stays at
    the resolution floor at every non-degenerate rung -- for the calibration
    functional at this slice the best available ratio is 1/36.2, still far below
    1. The instrument's honest outputs are therefore:
      (a) an EXACT conditional test at each rung, with a p-value estimator that
          cannot return 0, namely p-hat = (1 + #{v <= T_obs})/(1 + B);
      (b) the NUISANCE BUDGET at each rung, defined as E[T_pi | rung] evaluated on
          the functional `order` (whose within-class variance is exactly 0), i.e.
          the residual within-block variance of N in N^2 units;
      (c) the MINIMUM DETECTABLE EFFECT delta*(rung) from a planted-effect power
          curve, so a non-significant result is reported as a BOUND and never as
          "no effect";
      (d) the DECAY CURVE of each functional's ratio across the ladder, compared
          against a pure-N surrogate of matched within-class noise. A functional
          decaying slower than its matched surrogate has structure beyond N; a
          functional that does not decay at all as Delta_max falls has a nuisance
          that is NOT N and that nobody has named, which is the canonical artifact
          tell of docs/inventor-protocol.md section 3.

    STEP 8 -- LAYER 1, AND THE PREDICTION IT MAKES AGAINST ITSELF. Returning the
    exact sum-set size |mV| alongside the hit count removes the binomial sampling
    variance from the decomposition functionals entirely. That STRICTLY INCREASES
    the instrument's power and therefore STRICTLY INCREASES the danger from an
    uncorrected N confound. Pre-registered here so it cannot be claimed
    afterwards: under the FREE permutation the exact count should be MORE
    significant than the sampled rate, not less. |mV| is NOT claimed N-free -- it
    is bounded by N and its additive-collision rate depends on N -- only free of
    the SAMPLING dependence on N.

  assumptions:
    - >-
      Tate: two elliptic curves over F_p are F_p-isogenous iff they have the same
      trace. Used to define the class exactly as harness/isogeny_class.py already
      uses it; standard, not re-derived, and no citation is asserted beyond that.
    - >-
      Within a class N is exactly constant, since N = p + 1 - t. Elementary.
    - >-
      Enumeration completeness is CERTIFIED, not assumed: harness/isogeny_class.py
      ::class_census checks each class's automorphism-weighted size against the
      Hurwitz-Kronecker class number H(4p - t^2), and a census failure makes the
      run invalid rather than a result. Every pool in this hypothesis's test
      boundary is a completely enumerated class set.
    - >-
      Every declared blocking is a coarsening of the class partition. This is not
      a modelling choice but a consequence of defining blocks by class invariants
      (N, the twist pair), and it is what makes the permutation block-separable
      and the null mean closed-form.
    - >-
      HEUR-INSTR-1 below (within-block exchangeability under H0) is the one
      assumption the design cannot prove. It is what blocking buys and it is what
      the null-object arms test.
    - >-
      TOY SCALE ONLY. Complete enumeration costs O(p^2) character-sum work, so the
      design lives at p of order 2^12 to 2^13. At those p the largest prime factor
      of N is around 12 bits and NO functional measured here is an attack cost at
      any scale that matters. This is a measurement about a measuring instrument,
      not about cost.

  proof_search_map:
    bottleneck: >-
      The exchangeability argument together with the closed form for the null
      mean. Everything else is bookkeeping: the validity of the test rests
      entirely on the claim that, under H0, curves within a block are exchangeable
      with respect to the measured functional, and the interpretability of every
      reported number rests on E[T_pi | B] = mean_c S^2_{block(c)} being exact
      rather than approximate.
    baseline_embedding:
      parameter_slice: >-
        p = 4001, traces {30, -30, 18, -18} as returned by
        harness/run_icinv.py::pick_classes(4001, n_control = 3), fb_m2 = 40,
        fb_m3 = 13, window = 400, targets = 400, seed = 20260807 -- exactly the
        parameters of RUN-ICINV-p4001-a and of the three EXP-ICINV-9b1f7c p = 4001
        runs.
      reproduction_check: >-
        SPLIT BY SAMPLER PROVENANCE, because this campaign's target sampler has
        been corrected TWICE and a naive "reproduce the committed p-values" check
        would fail for a reason that is not instrument instability.
        SAMPLER-FREE ROWS, identical in all four committed p = 4001 runs and the
        valid fixtures for current code: permutation_null.liftable_density raw
        count r = 1 of B = 2000 (reported as p = 0.0005); window_decay at
        W = 4001 with r = 0 of B = 1000 (reported as p = 0.0), observed
        1.557881769803647e-08, null_mean 1.0357263552475702e-05; and
        full_field_liftable_within_class_count_variance = 0.24938572928898783.
        SAMPLER-DEPENDENT ROWS: the only valid fixture for current code is
        RUN-ICINV-p4001-degenfix (post CORR-20260807-9f83be), whose
        permutation_p_values are decomp_efficiency_m2 = 0.7815,
        decomp_efficiency_m3 = 0.098, decomp_rate_m2_RAW = 0.2825,
        decomp_rate_m3_RAW = 0.107. RUN-ICINV-p4001-a's decomposition rows used
        the confounded hash-and-lift sampler and CORR-20260807-a05e1e forbids
        citing them; RUN-ICINV-p4001-uniform's used the pre-fix targets_uniform.
        Neither is a reproduction target. Failure to reproduce the SAMPLER-FREE
        rows is instrument instability and halts everything.
    observation_collision:
      observable: >-
        The blocked permutation p-value p-hat at a given rung.
      distinct_preimage_search: >-
        REQUIRED, and a collision is EXPECTED and is the calibration rather than a
        defect. Find two pooled objects with the same p-hat at the same rung, one
        where the grouping is the true isogeny class and one where it is the
        synthetic trace-independent labelling of the same size multiset. The
        p-hat's resolution at the campaign's sample sizes is what that collision
        fixes, and it is what makes a non-significant result reportable as a bound
        rather than as "no effect". A SECOND collision is searched for and is the
        sharper one: two DIFFERENT blockings giving the same p-hat on the same
        functional. It is expected to exist, and its existence is exactly why
        every reported p-hat in this design must travel with (Delta_max,
        nuisance_budget, delta*) and is meaningless without them.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the Monte-Carlo permutation null MEAN, which currently requires
          B re-partitions of the pooled set, by the closed form
          E[T_pi | B] = mean_c S^2_{block(c)} computed once from the block-pooled
          sample variances.
        predicted_gain: >-
          Encoding: exact, and derived from the sampling-without-replacement
          identity E[s^2] = S^2 rather than fitted. Completeness and soundness:
          checked against the empirical Monte-Carlo mean at every rung to within
          3 Monte-Carlo standard errors, and against the committed
          null_mean = 1.0357263552475702e-05 at freeze time (relative residual
          1.9e-05). Cost loss: none; the closed form is cheaper on every axis. It
          does NOT replace the permutation distribution itself, which is still
          needed for the p-value -- only its mean, which is the quantity every
          "664x" style ratio is built from.
      - transform: observable_fiber
        proposed_object: >-
          Hold p-hat fixed and vary the blocking. The intrinsic invariants
          proposed to distinguish the resulting designs are the pair
          (Delta_max, nuisance_budget) and the minimum detectable effect
          delta*(rung).
        predicted_gain: >-
          The gain is a PROHIBITION, which is the useful kind here: no record may
          report a blocked p-value without the rung's Delta_max, nuisance budget
          and delta*. That prohibition is the direct answer to the failure mode
          this hypothesis documents, in which a bare p-value of 0.0 was read as
          structure.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER. FOR ALL declared functionals C, FOR ALL pooled sets
      S of complete isogeny classes at a fixed p that are FROZEN BEFORE ANY
      FUNCTIONAL IS MEASURED, and FOR EVERY declared blocking B of S that is a
      coarsening of the class partition, the within-block label permutation is a
      valid null for the statement "class membership is independent of C given the
      block", and its null mean is exactly mean_c S^2_{block(c)}.
      The dangerous weaker reading, FOR ALL C THERE EXISTS S -- letting the pool be
      chosen after seeing C -- is NOT claimed, and stage S0's pool freeze exists to
      forbid it.
      ADDED HERE AND NOT PRESENT IN THE PARENT PROPOSAL: FOR EVERY blocking B at
      fixed p, the residual nuisance is EXACTLY the within-block variance of N and
      is strictly positive unless B is the per-class partition, because
      N = p + 1 - t is injective in t. There is NO blocking at fixed p that both
      removes the N contrast and leaves a non-trivial permutation.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "at this p, on these completely enumerated classes, with these
        functionals, class membership explains no variance beyond the declared
        block structure, down to an effect of size delta*(rung), conditional on a
        residual N nuisance of nuisance_budget(rung)". It can NEVER certify exact
        invariance; it can never certify anything at a p it did not enumerate; and
        it can certify nothing at all about ECDLP cost, since no quantity it
        measures is an attack cost at p ~ 2^12.
      nearby_object_control: >-
        TWO, and they do different jobs.
        (1) THE SYNTHETIC TRACE-INDEPENDENT LABELLING, matching the true
        class-size multiset. Its forced answer is "does not fire above the
        declared level"; it can only fail if the implementation is wrong, and it
        is included for exactly that reason.
        (2) THE PURE-N SURROGATE, Y-tilde_i = N_{c(i)}/2 + eps_i with Var(eps)
        matched to the functional's measured within-class variance. Its answer is
        NOT forced: it traces the decay curve a purely N-driven signal produces at
        this pool under this ladder, and it is the reference every real
        functional's curve is read against. A design that cannot separate a real
        functional from its matched N surrogate has not identified the
        load-bearing structure and is measuring the group order.
    proof_obligations:
      - claim: Within a class N is exactly constant.
        responsibility: correctness
      - claim: >-
          E[s^2] = S^2 for a simple random subset without replacement, hence
          E[mean_c s^2_c] = E[SS_within/(n-K)] = S^2 under free permutation.
        responsibility: correctness
      - claim: >-
          A blocking that is a coarsening of the class partition makes the
          permutation block-separable, so E[T_pi | B] = mean_c S^2_{block(c)}.
        responsibility: correctness
      - claim: >-
          The blocked permutation preserves the group-size multiset exactly.
        responsibility: soundness
      - claim: >-
          p-hat = (1 + #{v <= T_obs})/(1 + B) is a valid p-value and cannot return
          0, unlike the committed #{v <= T_obs}/B which returned exactly 0.0 at
          five of the six windows of RUN-ICINV-p4001-a.
        responsibility: soundness
      - claim: >-
          The committed free-permutation result at W = p is explained by the N
          difference plus the archived liftable-count identity, with no residual
          beyond Monte-Carlo error.
        responsibility: baseline
      - claim: >-
          class(t) and class(-t) have equal size and, for twist-invariant
          functionals, identical value multisets.
        responsibility: correctness
      - claim: >-
          Nothing here transfers to medium or cryptographic scale, and no quantity
          measured is an attack cost.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  rerandomization_note: >-
    NOT APPLICABLE. No worst-to-average-case device is used or needed: this
    hypothesis produces no algorithm, mounts no attack, and solves no instance.
    The field is explicitly null rather than absent so a reader cannot mistake an
    omitted field for an overlooked one.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. NO COMPLEXITY CLAIM OF ANY KIND IS MADE. No exponent moves,
    no cofactor improves, and the four promotion gates in agents/coordinator.md do
    not apply because there is nothing to promote toward. For prime-field ECDLP the
    baseline is unchanged and unchallenged: parallel Pollard rho with distinguished
    points at 0.886*sqrt(N) group operations and O(1) memory (KN-TECH-001,
    KN-TECH-006), the automorphism-discounted variant on CM curves (KN-TECH-018),
    and BSGS at sqrt(N) time and memory. sota_delta: ZERO.

  heuristic_assumptions:
    - id: HEUR-INSTR-1
      formal_statement: >-
        WITHIN-BLOCK EXCHANGEABILITY. For every declared functional C, every frozen
        pool S of complete isogeny classes at fixed p, and every declared blocking
        B of S, under the null hypothesis "class membership carries no information
        about C beyond the block", the vector of measured values restricted to any
        block beta is exchangeable with respect to the class labels present in
        beta.
      random_model_justification: >-
        NONE BEYOND THE DESIGN ITSELF, and this is stated rather than dressed up.
        Exchangeability is not derived from a distributional model of the
        functional; it is what the blocking is FOR, and it can fail for a nuisance
        that is correlated with the class label but not with the blocking variable.
        The design's answer is empirical: the two null-object arms measure the
        realized type-I error at every rung, and a rung whose empirical size is
        outside its binomial band has an exchangeability violation that the
        blocking did not remove.
      supporting_results: []
      validation_experiment_ids: [EXP-INSTR-85b102]
      falsification_condition: >-
        The synthetic trace-independent labelling, or the delta = 0 row of the
        planted-effect study, rejects at level 0.05 in a number of replicates
        outside the exact two-sided 99% Binomial(R, 0.05) interval, at any rung
        and either prime. The blocking is then wrong at that rung and NO result may
        be reported from it.
    - id: HEUR-INSTR-2
      formal_statement: >-
        TWIST PAIRING. For every ordinary trace t at a fixed p with -t also
        ordinary, class(t) and class(-t) have equal cardinality and consist of the
        quadratic twists of one another; consequently every twist-invariant
        functional carries IDENTICAL value multisets across the pair.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL CLAIM AND NOT QUOTED AS A THEOREM. The equal-size half
        is consistent with the committed enumeration (n = 138, 138, 98, 98 at
        traces 30, -30, 18, -18) and with the class number depending on t only
        through D = t^2 - 4p, which is invariant under t -> -t. The multiset half
        follows for the 2-torsion x-count from x^3 + a d^2 x + b d^3 = d^3 f(x/d),
        and is stated here as a checkable prediction the experiment must confirm.
      supporting_results: []
      validation_experiment_ids: [EXP-INSTR-85b102]
      falsification_condition: >-
        At either prime, some pooled pair {t,-t} has unequal class sizes, or the
        sorted vector of two_torsion_x over class t differs from that over class
        -t. Twist blocking then loses its stated basis, must be reported as
        unjustified rather than silently retained, and must be replaced by explicit
        |D| = |t^2 - 4p| matching.

  structural_ingredients:
    - description: >-
        Tate's isogeny theorem over a finite field: equal trace is equivalent to
        F_p-isogeny, which is what makes "the isogeny class" a well-defined
        grouping indexed by t and what makes N constant within it.
      citation: >-
        Standard. Used exactly as harness/isogeny_class.py::isogeny_classes already
        uses it ("Tate: same trace <=> F_p-isogenous"); not re-derived here and no
        external reference is asserted beyond that use.
      role: defines the grouping variable and fixes N within it
    - description: >-
        The Hurwitz-Kronecker class-number mass formula, used as an enumeration
        completeness certificate rather than as a result.
      citation: >-
        harness/isogeny_class.py::class_census and ::hurwitz_class_number, whose
        own docstring records that adding the primitivity condition changed the
        census from rejecting 60 of 127 traces at p = 1009 to accepting them.
      role: certifies that a measured class is the WHOLE class
    - description: >-
        The liftable-count identity #{x : x^3+ax+b is a square} = (#E - 1 + z)/2.
      citation: >-
        Derived in harness/exp_icinv.py::liftable_count_identity and verified
        (_liftable_identity_holds = identity_verified) on every curve of every
        class in every committed EXP-ICINV run at three primes.
      role: makes the calibration functional a known-answer test
    - description: >-
        The randomization identity E[s^2] = S^2 for a simple random subset drawn
        without replacement, hence E[MS_within] = S^2 under complete randomization.
      citation: >-
        Elementary; derived in this record at mechanism STEP 3 and verified
        numerically at freeze time against the committed
        null_mean = 1.0357263552475702e-05 to a relative residual of 1.9e-05. No
        external citation is asserted.
      role: converts the permutation null's mean into a closed form

  reduction_chain:
    core_problem: >-
      Decide whether the campaign's label-permutation null, as committed, is
      measuring isogeny structure or the group order, and if the latter, supply a
      design under which the same measurement becomes attributable -- together
      with an honest statement of the residual nuisance and the power that design
      costs.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no corollary about ECDLP cost, about the
      isogeny-class invariance question of RQ-ICINV-475b5e, about H-STR-002 in
      either direction, or about any lane's substantive result. An instrument
      hypothesis constrains how future measurements may be READ; it produces no
      measurement of its own about curves. Any future record citing this
      hypothesis toward a cost or attack conclusion is making an unsupported
      inference and this note exists to make that visible.

  predictions:
    - metric: >-
        P1 -- closed-form reproduction of the committed free-permutation null mean
        for the full-field liftable density at the frozen p = 4001 slice
      direction: different
      minimum_effect: >-
        E[T_pi | free] = (S^2_N + S^2_z + 2*Cov(N,z))/4 = 165.8028717 count^2
        = 1.0357456e-05 in rate units, against the committed
        null_mean = 1.0357263552475702e-05: relative residual <= 1e-3. And
        T_obs = mean_c Var(z_c)/4 = 0.24938572928901642 count^2 against the
        committed 0.24938572928898783: residual <= 1e-9. IN-SAMPLE. This is a
        REPRODUCTION, never a prediction, and every downstream statement must say
        so -- the committed numbers were open on screen when the closed form was
        written.
    - metric: >-
        P2 -- twist-pair blocking on the full-field liftable density at the frozen
        p = 4001 slice
      direction: higher
      minimum_effect: >-
        E[T_pi | twist] = 153.8651 count^2 and ratio T_obs/E = 1/617.0, against
        1/664.8 free: a change of about 7%, and p-hat REMAINS AT THE RESOLUTION
        FLOOR 1/(1+B). THIS CONTRADICTS THE PARENT PROPOSAL IDEA-20260807-34754f,
        whose prediction 1 expects the stratified p-value to rise above 0.05 with
        honest prior 0.75, when "stratified" is read as twist-only. The
        contradiction is arithmetic, was derived before any run, and is recorded
        here so that neither outcome can be claimed after the fact.
    - metric: >-
        P3 -- finest non-degenerate N band on the full-field liftable density at
        the frozen p = 4001 slice
      direction: higher
      minimum_effect: >-
        The band width 24 gives blocks {t=30,t=18} and {t=-18,t=-30}, Delta_max = 12,
        E[T_pi] = 9.0279 count^2 and ratio 1/36.2. Still far below 1 and p-hat
        still at the floor. PRE-REGISTERED CONSEQUENCE: at this pool the full-field
        liftable density does NOT clear 0.05 at ANY non-degenerate rung, and it
        cannot, because N is injective in the trace. A run reporting otherwise for
        this functional has an implementation defect, not a discovery.
    - metric: >-
        P4 -- the degenerate per-class rung, every functional, every pool
      direction: higher
      minimum_effect: >-
        p-hat EXACTLY 1.0 and ratio exactly 1, because the permutation is the
        identity. Zero tolerance; any other value is an implementation defect and
        halts the run.
    - metric: >-
        P5 -- twist-invariance of the 2-torsion x-count
      direction: different
      minimum_effect: >-
        The sorted vector of two_torsion_x over class t equals that over class -t
        for every pooled pair, at both primes, EXACTLY. At the frozen p = 4001
        slice this predicts 66 curves with z = 3 and 72 with z = 1 in each of the
        traces 30 and -30, and 42 with z = 3 and 56 with z = 1 in each of 18 and
        -18. Forced by the committed means, sizes and "distinct values: 2"; not
        measured by this Coordinator.
    - metric: >-
        P6 -- composition of twist blocking with N banding at the frozen slice
      direction: different
      minimum_effect: >-
        DEGENERATE: with w = ceil(Delta_pool/2) = 30 against min 2|t| = 36 in the
        pool, every intersection block holds exactly one class and the composed
        rung is the identity permutation with p-hat = 1.0. The two blockings are in
        direct tension at fixed p and cannot be composed without destroying the
        test.
    - metric: >-
        P7 -- exact sum-set size versus sampled decomposition rate under the FREE
        permutation, both primes
      direction: lower
      minimum_effect: >-
        THE COUNTERINTUITIVE ONE, CARRIED FROM THE PARENT PROPOSAL AND
        PRE-REGISTERED SO IT CANNOT BE CLAIMED AFTERWARDS. Removing the binomial
        sampling noise should make the free permutation MORE significant on the
        exact count |mV| than on the sampled rate at the same m, because the N
        confound is no longer masked by sampling noise. Parent proposal's honest
        prior: 0.35.
    - metric: >-
        P8 -- power of the blocked test at the finest non-degenerate rung
      direction: higher
      minimum_effect: >-
        At least 0.90 detection at level 0.05 for a planted between-class effect of
        0.8 within-class standard deviations, at the finest non-degenerate rung of
        the twelve-class pool at both primes. Below that, the recorded conclusion
        is that the blocking has destroyed the test's power and the stratified null
        is NOT better than the free one at these pools. delta*(rung), the smallest
        planted effect detected with power >= 0.80, is reported at EVERY rung
        without a prediction attached.

  test_boundary:
    instances:
      - >-
        POOL-A: p = 4001, the four largest ordinary classes as returned by
        harness/run_icinv.py::pick_classes(4001, n_control = 3). Realized in the
        committed runs as traces {30, -30, 18, -18}, sizes 138/138/98/98.
        Reproduction and head-to-head arm.
      - >-
        POOL-B: p = 4001, the twelve largest ordinary classes,
        pick_classes(4001, n_control = 11). Ladder, power and size arm. The
        realized trace list is recorded at stage S0 before any functional is
        measured and is NOT predicted here.
      - >-
        POOL-C: p = 4001, twelve ordinary traces drawn uniformly without
        replacement from all ordinary traces with class size >= 20, under the
        declared seed derivation. Selection control for the class-size selection
        that pick_classes performs.
      - >-
        POOL-D: p = 6007, the twelve largest ordinary classes,
        pick_classes(6007, n_control = 11). Second-prime replication, MANDATORY
        for any between-class statement in this campaign under
        CORR-20260807-a05e1e required_action 4.
      - >-
        OUT OF SCOPE: any p above ~2^13 (complete enumeration is O(p^2)); binary
        and extension fields; supersingular classes (t = 0 is excluded by
        pick_classes and obeys a different mass formula); any curve of
        cryptographic size; any solver, relation collection or discrete-logarithm
        computation.
    parameters:
      primes: [4001, 6007]
      pool_rule: harness/run_icinv.py::pick_classes, n_control as declared per pool
      minimum_class_size: 20
      blocking_rungs: [FREE, TWIST, NBAND_w2, NBAND_w3, NBAND_w4, PERCLASS, TWIST_AND_NBAND_w2]
      band_width_rule: "w2 = ceil(Delta_pool/2), w3 = ceil(Delta_pool/8), w4 = ceil(Delta_pool/32), each at least 2"
      block_index_rule: "floor((N - N_min)/w)"
      statistics: [pooled_within_group_variance, unweighted_mean_group_variance]
      p_value_estimator: "(1 + #{v <= T_obs})/(1 + B), both tails reported"
      permutations_primary: 10000
      permutations_power_study: 1000
      planted_effect_grid_in_sd: [0.0, 0.1, 0.2, 0.4, 0.8, 1.6]
      replicates_per_control_cell: 200
      reproduction_seed: 20260807
      master_seed: 85102
      windows: ["p//32", "p//16", "p//8", "p//4", "p//2", "p"]
      fb_m2: 40
      fb_m3: 13
      targets: 400
    implementation: >-
      Pure Python plus numpy, Sage-free, on the existing harness modules
      harness/isogeny_class.py, harness/exp_icinv.py and harness/toycurve.py. NO
      SOLVER, NO DISCRETE LOGARITHM, NO CERTIFICATE BEYOND CURVE MEMBERSHIP, since
      every rate is measured by exact enumeration over the factor base. New
      functionality (blocked permutation, closed-form null mean, exact sum-set
      size, control objects) is added as NEW functions; no existing function's
      behaviour may change, because four committed runs depend on the current
      behaviour of `_targets`, `targets_uniform` and `permutation_null` and this
      campaign has already been bitten twice by a silently altered sampler.
    budget:
      wall_clock_seconds_per_run: 5400
      total_cpu_hours: 6
      maximum_memory_gb: 4
      maximum_runs: 16
      note: >-
        The dominant cost is the O(p) full-field liftable count and 2-torsion count
        per curve over roughly 1200 curves per twelve-class pool, plus the
        vectorized permutation study. The committed RUN-ICINV-p4001-a measured 472
        curves in 43.4 s wall, so the measurement is minutes; the power study is
        the only arm that needs a numpy-vectorized permutation, and if it is not
        vectorized it will exceed budget. That is a budget fact to be reported as
        infrastructure, never as a result.

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, THE PRIMARY FALSIFIER OF C1) -- the closed form does not
      reproduce the committed slice: mean_c Var(z_c)/4 differs from the committed
      full_field_liftable_within_class_count_variance = 0.24938572928898783 by more
      than 1e-9, or the closed-form null mean differs from the committed
      null_mean = 1.0357263552475702e-05 by more than 1e-3 relative. Then either
      the identity or the reporting is wrong, the diagnosis that the committed 664x
      is the group order is WITHDRAWN, and everything downstream waits.
    - >-
      F2 -- the SAMPLER-FREE committed rows do not reproduce on the frozen slice
      (r = 1 of 2000 for permutation_null.liftable_density; r = 0 of 1000 and
      observed 1.557881769803647e-08 against null 1.0357263552475702e-05 at
      window_decay W = 4001). Instrument instability; nothing is concluded and the
      deliverable is the discrepancy.
    - >-
      F3 (FALSIFIER OF C2, and the parent proposal's own) -- the synthetic
      trace-independent labelling fires under the blocked permutation above its
      declared binomial band at any rung. The blocking is wrong and NO result may
      be reported from it.
    - >-
      F4 (FALSIFIER OF C3, AND THE OUTCOME "THE FIX IS WORSE THAN THE DISEASE")
      -- power at 0.8 within-class standard deviations at the finest
      non-degenerate rung falls below 0.90. Recorded conclusion: the stratified
      null is NOT better than the free one at these pools, the design is not
      recommended for adoption, and the campaign's between-class claims must be
      restricted to statements about means with the realized N spread declared
      beside them. THIS IS A REACHABLE NEGATIVE AND IT IS NOT A FAILURE OF THE
      EXPERIMENT.
    - >-
      F5 -- the degenerate per-class rung returns anything other than exactly 1.0,
      or the functional `order` returns a nonzero within-class variance. Both are
      forced values; either failure is an implementation defect and halts the run.
    - >-
      F6 (FALSIFIER OF HEUR-INSTR-2) -- some pooled twist pair has unequal class
      sizes, or unequal sorted two_torsion_x vectors, at either prime. Twist
      blocking loses its stated basis and is reported as unjustified; it is
      replaced by explicit |D| matching rather than quietly retained.
    - >-
      F7 (FALSIFIER OF C4, AND THE OUTCOME WORTH THE WHOLE EXERCISE) -- some
      functional's ratio T_obs/E[T_pi] remains below 1/4 at the finest
      non-degenerate rung while its matched pure-N surrogate's ratio at the same
      rung has risen above 1/2, at both primes. The residual is then NOT the group
      order, this hypothesis's C4 is false for that functional, and the campaign
      has a genuine between-class effect beyond N to chase. It is a real falsifier
      with a real probability and it is the reason to run the test.
    - >-
      F8 -- a functional's ratio fails to increase monotonically across the N
      ladder while its matched surrogate's does. This is the canonical artifact
      tell of docs/inventor-protocol.md section 3: the nuisance is something other
      than N and has not been named. Reported as an open anomaly with the failing
      rung exhibited, never as a discovery and never as a failure.

  interpretation_limits:
    - >-
      CLAIM TIER toy, and no downstream citation may raise it. p <= 6007, the
      largest prime factor of N is around 12 bits, nothing here is an attack cost,
      and no speedup against any baseline is produced or claimed. sota_delta ZERO.
    - >-
      THIS IS AN INSTRUMENT HYPOTHESIS. It governs how a class-level null may be
      READ. It says nothing about whether the functionals measured are
      attack-relevant, which is RQ-ICINV-475b5e's and the L11 lane's question, and
      it does not adjudicate the isogeny-class invariance question in either
      direction.
    - >-
      A non-significant blocked result is a BOUND and not "no effect". Its size is
      delta*(rung) and reporting it without that number is an overclaim. The bound
      is additionally conditional on nuisance_budget(rung), which is strictly
      positive at every non-degenerate rung at fixed p.
    - >-
      Nothing here bears on H-STR-002 in either direction: no displacement rank, no
      relation matrix and no phi-invariant factor base is measured, so
      GOAL-ENDO-001 pause condition P2 is not engaged.
    - >-
      The unexplained density-independent within-class over-dispersion recorded by
      DEC-20260807-41c173 next action N8 is NOT addressed here. That is a
      WITHIN-class anomaly; this hypothesis concerns the BETWEEN-class null. The
      two must not be conflated and no result here explains that one.
    - >-
      Both this session and any review of it resolve to models on the same backend,
      so "independent session" in this campaign means independent context, not
      independent judgement (AGENTS.md rule 13, suspended closure quorum).

