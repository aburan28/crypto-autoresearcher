# H-MLKEM-201e11 — specified from IDEA-20261005-0e9abf.
# Protocol approval is DEC-20261006-fa4684. This record asserts no bit-security
# improvement and no attack. No sample was drawn in this design.
hypothesis:
  id: H-MLKEM-201e11
  question_id: RQ-MLKEM-003
  source_proposal: IDEA-20261005-0e9abf
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-MLKEM-003.yaml does not name a goal. This design
    does not attach one and does not create a goal record.
  status: approved
  status_note: >-
    approved means the attribution protocol in EXP-MLKEM-a1a3e1 is approved
    for a later executor. It does not mean a bit gap was measured, and it
    does not mean an isometry discount exists. Status moves only by
    DEC-20261006-fa4684 under the standing user authorization of 2026-09-06.
    No matrix was sampled in this design.
  proposed_by: coordinator
  conversion_note: >-
    The three cells, the 2-bit and 1-bit thresholds, the plain-LWE control,
    and the refusal to score an ideal-lattice approximation factor as bits
    are carried from IDEA-20261005-0e9abf. The Coordinator added the named
    cost expression ISO-CTRL-1, the admission predicate, the eight seeds,
    and the assignment rows. Those rules were fixed before any run.

  statement: >-
    TEST BOUNDARY. Toy only. n = 64, secret Hamming weight 8 with
    coefficients in {0,1}, q = 3329. Cell S is sparse-secret Ring-LWE in
    Z[x]/(x^64+1). Cell U is plain LWE of dimension 64 with the same weight,
    the same q, and 64 rows. Cell I is the degree-64 cyclotomic ring with
    no Ring-LWE samples. The toy symmetry is x |-> x^r for r odd,
    0 < r < 128. This is not a FIPS 203 parameter set. No attack is claimed.
    No exponent is claimed. The reported 15-bit and 2–3-bit figures in
    KN-OPEN-026 are not re-derived and are not success conditions.

    WHICH OBSERVATION ASSIGNS A BIT GAP TO COEFFICIENT ISOMETRY. The gap
    on S is the folded-minus-unfolded difference, in one named cost model,
    and the same difference on U is under 1 bit. That pair assigns the gap
    to the coefficient isometry at this toy point.

    WHICH OBSERVATION SHOWS THE SAME GAP ON PLAIN LWE. A gap of at least
    2 bits on U is the same gap with the isometry removed. That observation
    means the gap is not an isometry discount.

    PRE-REGISTERED PREDICTION, fixed before any run. On the eight frozen
    seeds, the median gap on S is at least 2 bits and the median gap on U
    is under 1 bit, in model ISO-CTRL-1, and cell I carries no bit gap.
    A median gap on U of at least 2 bits falsifies the attribution. A
    median gap on S under 1 bit falsifies the claim that this toy design
    sees an isometry discount. Neither outcome confirms or refutes the
    unread 15-bit report.

    DISTINGUISHABLE OUTCOMES. (1) Median gap on S is at least 2 bits,
    median gap on U is under 1 bit, and cell I has no bit gap: the gap is
    assigned to the coefficient isometry at this toy point. (2) Median gap
    on U is at least 2 bits: the same gap survives on plain LWE, so it is
    not an isometry discount. (3) Median gap on S is under 1 bit: this toy
    design does not see an isometry discount. (4) Cell I is given a numeric
    bit gap, or a separation that exists only at approximation factor
    exp(sqrt(64)) is reported as a 2–15 bit isometry discount: the
    class-group line has been mislabeled. (5) A seed range above 2 bits,
    or a median in the open interval from 1 to 2: inconclusive. (6) A
    crash, a wrong orbit count for the odd residues, or an evaluation of
    the NTRU fatigue ratio: invalid, not evidence.

  mechanism: >-
    The tracked object is the orbit of one weight-8 secret under the
    coefficient maps x |-> x^r for r odd. Folding charges that orbit once.
    Unfolding charges it as separate representatives. The bit gap is the
    log of the ratio of those two charges, in one expression. Plain LWE
    has no ring automorphism. The same expression is evaluated there. If
    the gap remains, the expression did not need the isometry, so the gap
    is not an isometry discount. The projection is lossy: the orbit index
    discards which representative was written down, and that discard is
    legitimate only while the admission predicate says the samples
    transform under the same maps. The class-group object is a different
    line: a log-unit certificate at approximation factor exp(O~(sqrt(n))).
    The NTRU object is a third line: a dense sublattice above the fatigue
    ratio. Neither is an input to the gap.

  assumptions:
    - The toy symmetry is the set of maps x |-> x^r for r odd and 0 < r < 128. If KN-LIT-7663 uses a different coefficient isometry, a negative here does not touch that paper.
    - q = 3329 and n = 64 are a toy pair. They are not FIPS 203 parameters.
    - The 15-bit and 2–3-bit figures are reports in KN-OPEN-026. They are not targets.
    - Bit gaps are differences inside ISO-CTRL-1 only. A gap read from another model is out of scope.
    - Noise is zero on the admission check. The predicate is algebraic. A noisy identity is not this test.
    - The lattice term 0.292 * 40 is a disclosed constant so the model has one expression. It is not a BKZ simulator output and it cancels in the gap.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is an attribution control on eight toy seeds. It is not a proof,
      an asymptotic bound, a certificate family, a reduction, or a closure
      argument. It does not claim an attack.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: BKZ / core-SVP for an ML-KEM-shaped module lattice, not beaten
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      ISO-CTRL-1 adds a constant lattice term that cancels in the gap.
      Core-SVP memory-access terms are not estimated.
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: HA-1
      formal_statement: >-
        On these eight seeds, with n = 64, weight 8, q = 3329, and model
        ISO-CTRL-1, the median folded-minus-unfolded gap on the ring cell
        is at least 2 bits and the median gap on plain LWE of the same
        dimension is under 1 bit. A gap that is still at least 2 bits on
        the plain LWE cell is not an isometry discount. A separation that
        appears only as an approximation factor at least exp(sqrt(64)) is
        not an isometry discount. No transfer to a standardized parameter
        set is claimed.
      random_model_justification: >-
        The secrets are uniform among {0,1}^64 vectors of weight 8, drawn
        by the frozen seeds. The orbit size is whatever the maps do to
        those vectors. The model does not assume the action is free.
      supporting_results: []
      validation_experiment_ids:
        - EXP-MLKEM-a1a3e1
      falsification_condition: >-
        The median gap on the plain LWE cell is at least 2 bits, or the
        median gap on the ring cell is under 1 bit.

  structural_ingredients:
    - description: >-
        KN-OPEN-026 reports coefficient-isometry gaps of up to 15 bits on
        sparse-secret Ring-LWE and 2–3 bits on Kyber/ML-KEM, and says those
        figures are unverified reports. This hypothesis does not re-derive
        them.
      citation: KN-OPEN-026
      provenance: internal
      verified_by: knowledge/open-problems/KN-OPEN-026.md
      role: source of the reported figures that are not success conditions
    - description: >-
        KN-TECH-046 is the class-group and unit-lattice line, at
        approximation factor exp(O~(sqrt(n))). Cell I exists so that line
        is not scored as a bit gap.
      citation: KN-TECH-046
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-046.md
      role: line that must stay an approximation factor, not a bit discount
    - description: >-
        KN-TECH-045 is the ternary NTRU fatigue point near
        q ~ 0.004 * n^2.484. This control does not evaluate that ratio
        and does not use EXP-NTRU-fe4ae9.
      citation: KN-TECH-045
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-045.md
      role: line excluded from the cost expression
    - description: >-
        KN-LIT-7663 is named by KN-OPEN-026 as the coefficient-isometry
        source of the reported bit figures. This session did not open that
        literature file.
      citation: KN-LIT-7663
      provenance: recalled
      verified_by: null
      role: pointer only; not support for any bit figure

  reduction_chain:
    core_problem: >-
      Attribution of one toy bit gap to a coefficient isometry, or refusal
      of that attribution. Not an attack.
    corollaries: []

  predictions:
    - metric: isometry_bit_gap_S
      direction: higher
      minimum_effect: >-
        Median over the eight seeds of at least 2 bits on cell S in
        ISO-CTRL-1.
    - metric: isometry_bit_gap_U
      direction: lower
      minimum_effect: >-
        Median over the eight seeds under 1 bit on cell U in the same model.
        A median of at least 2 bits on U is the observation that the gap is
        not an isometry discount.
    - metric: ideal_bit_gap
      direction: lower
      minimum_effect: >-
        The token absent on cell I. An approximation factor is not converted
        into bits.

  test_boundary:
    instances:
      - cell S, sparse-secret Ring-LWE, ring Z[x]/(x^64+1)
      - cell U, plain LWE, dimension 64, 64 rows
      - cell I, degree-64 cyclotomic, no samples, no bit gap
    parameters:
      n: 64
      hamming_weight: 8
      coefficient_set: "{0,1}"
      q: 3329
      model: ISO-CTRL-1
      seeds: [2026100601, 2026100602, 2026100603, 2026100604, 2026100605, 2026100606, 2026100607, 2026100608]
    implementation: >-
      A later executor computes orbits by applying the maps. This design
      does not sample.
    budget:
      enforcement: advisory
      maximum_runs: 2
      note: Eight frozen seeds. The run cap is an infrastructure retry, not a scientific sample-size change.

  falsification_conditions:
    - The median gap on plain LWE is at least 2 bits. The gap is not an isometry discount.
    - The median gap on the ring cell is under 1 bit. This toy design does not see an isometry discount. That does not confirm or refute the reported 15-bit figure.
    - Cell I is given a numeric bit gap of at least 2 at an approximation factor below exp(sqrt(64))/2, with no coefficient orbit folded. The lines are not separated by this test.
    - The only separation on cell I is an approximation factor at least exp(sqrt(64)), and that separation is reported as a 2–15 bit isometry discount. That mislabels the class-group line.

  interpretation_limits:
    - No bit-security improvement is claimed. A toy gap is not a discount for any deployed parameter set and is not a statement about FIPS 203 or ML-KEM categories.
    - Does not claim Ring-LWE is broken.
    - Does not answer the core-SVP versus memory-charged sieve question in RQ-MLKEM-003. That question withholds a sieve experiment until primary sources are filed as KN-LIT. This record is an attribution control with its own cost expression.
    - The 15-bit and 2–3-bit numbers stay reports.
    - A dense-sublattice transition that tracks q/(0.004*n^2.484) is the NTRU line (KN-TECH-045). This control does not evaluate it and does not merge with EXP-NTRU-fe4ae9.
    - A log-unit certificate at exp(O~(sqrt(n))) is the class-group line (KN-TECH-046). It is not scored in bits.

  citations:
    - ref: KN-OPEN-026
      provenance: internal
      claim: >-
        The entry reports coefficient-isometry gaps of up to 15 bits and
        2–3 bits and does not verify them. Read from
        knowledge/open-problems/KN-OPEN-026.md.
      verified_by: knowledge/open-problems/KN-OPEN-026.md
    - ref: KN-TECH-045
      provenance: internal
      claim: >-
        Ternary NTRU fatigue near q ~ 0.004 * n^2.484 is a different line.
        This hypothesis does not evaluate that ratio.
      verified_by: knowledge/techniques/KN-TECH-045.md
    - ref: KN-TECH-046
      provenance: internal
      claim: >-
        Ideal-SVP via class groups and unit lattices sits at approximation
        factor exp(O~(sqrt(n))). This hypothesis does not turn that factor
        into a bit gap.
      verified_by: knowledge/techniques/KN-TECH-046.md
    - ref: KN-LIT-7663
      provenance: recalled
      claim: >-
        Named by KN-OPEN-026 as the source of the reported bit figures.
        This session did not open the literature file.
      verified_by: null
    - ref: RQ-MLKEM-003
      provenance: internal
      claim: >-
        The question asks about core-SVP versus a memory-charged sieve.
        This control does not answer that question.
      verified_by: ledger/questions/RQ-MLKEM-003.yaml
    - ref: IDEA-20261005-0e9abf
      provenance: internal
      claim: >-
        Source proposal. The 2-bit and 1-bit thresholds and the plain-LWE
        falsifier are copied from it.
      verified_by: ledger/proposals/IDEA-20261005-0e9abf.yaml
