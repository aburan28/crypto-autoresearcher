hypothesis:
  id: H-PROP-c95932
  question_id: RQ-PROP-24458b
  derived_from_idea: IDEA-20260815-14872b
  added: '2026-08-25'

  statement: >-
    SCOPE: prime-order cyclic groups G of order N in {11, 13, 17, 23} for the
    exhaustive arm and at least six prime orders spanning a 6x range for the
    frontier arm, with statistic sizes s = |S| in {2,...,8} and auxiliary-state
    budgets |A| in {1, 2, 4, 8, 16, 32}. CLAIM TIER toy. NO ATTACK, NO
    EXPONENT, NO ECDLP COST CLAIM, NO STATUS CHANGE REQUESTED.

    TWO CLAIMS, TESTED SEPARATELY AND WITH DIFFERENT EPISTEMIC WEIGHT.

    CLAIM B (THE STATE-SIZE BOUND, EXACT REGIME). For prime N, any pair
    (v, a) from G to S x A that propagates EXACTLY under the group law -- i.e.
    there is F with (v,a)(R + R') = F((v,a)(R), (v,a)(R')) for all R, R' --
    and is non-constant satisfies |S| * |A| >= N. The auxiliary register must
    therefore be at least as large as the information the statistic discarded,
    and the pattern "lossy object plus a little help" is unavailable in the
    exact regime. This is asserted as a COROLLARY of the rigidity theorem
    recorded in IDEA-20260807-df906f, not as new mathematics, and the
    experiment DECIDES it by complete enumeration at small N rather than
    estimating it.

    CLAIM F (THE PROBABILISTIC FRONTIER, OPEN CELL). The achievable frontier
    q_maj(|A|, s) over curve-derived pairs on prime-order subgroups of toy
    elliptic curves coincides, within the empirical null spread, with the
    frontier achievable over arbitrary labelings of Z/N at the same sizes.
    THE HYPOTHESIS IS THAT THE FRONTIER IS A FACT ABOUT SIZES AND NOT ABOUT
    CURVES. If a curve-derived frontier point exceeds the curve-free Z/N
    frontier at matched (|A|, s) by more than the null spread, reproducibly
    across at least three prime orders, CLAIM F IS FALSE -- and that is the
    only outcome in this design that would justify a follow-on proposal.

    THE SCOPE RESTRICTION THAT MATTERS. "Auxiliary state" means a function of
    the point alone. Pair-dependent state and history-dependent state are
    DIFFERENT and weaker notions, are treated separately, and Claim B is not
    asserted for them; conflating the three is the primary overclaim risk of
    this record and is enumerated separately in the design.

  mechanism: >-
    DERIVED FROM THE PARENT PROPOSAL. Total dependence on the rigidity theorem
    of IDEA-20260807-df906f is acknowledged rather than minimised -- if that
    theorem is wrong, Claim B is worthless.

    (1) THE COROLLARY. The rigidity theorem assumes nothing about the target
    set, so it applies verbatim to the map R |-> (v(R), a(R)) into S x A. It
    concludes that an exactly propagating map out of a prime-order group is
    injective or constant. Constant is the empty case. Injective gives
    |S| * |A| >= N by pigeonhole, hence |A| >= N / |S|. That is the whole
    argument, and its brevity is exactly why the enumeration at N <= 23 is
    worth running -- a counterexample would most likely indicate a
    definitional slip in what "propagates" means, which is itself worth
    finding.

    (2) THE THREE DEGENERATE CASES THAT MUST BE SEPARATED, NOT ASSUMED AWAY.
    (i) (v,a) constant. (ii) a depending on the PAIR being combined rather
    than on the point -- a genuinely weaker notion for which the corollary is
    NOT claimed. (iii) a partial or undefined on some inputs. Case (iii) is
    where a real counterexample would live and the enumeration must search it
    explicitly rather than restrict to total functions.

    (3) THE CONSISTENCY CHECK WITH THE ONE KNOWN INHABITANT. Elliptic nets
    (KN-TECH-009, KN-LIT-018) are the named prior art for auxiliary-state
    constructions and carry UNBOUNDED state, so the corollary predicts they
    satisfy the bound comfortably. Retrodicting the cell's only known
    inhabitant is the cheapest available evidence the argument is not vacuous,
    and a net propagating exactly on state smaller than N/|S| at toy scale
    would refute Claim B outright and more cheaply than any enumeration.

    (4) THE TWO-DIMENSIONAL SWEEP INTO THE OPEN CELL. Claim B pins the
    exact-propagation end -- bounded state is unavailable there at any price.
    IDEA-20260815-f558e4 pins the zero-state end -- probability collapses to
    the 1/s baseline for anything efficiently computable. Whether anything
    lives between is decided by measuring q_maj on the (|A|, s) grid against
    two matched nulls and one curve-free control. The instrument's competence
    is established by the planted-positive control, and the |A| = 1 edge must
    reproduce the sibling record's frozen fixture exactly or both records are
    blocked.

  assumptions:
    - >-
      The rigidity theorem of IDEA-20260807-df906f is correct as stated. TOTAL
      DEPENDENCE. Independent re-derivation from its own statement is a stage-1
      duty of the experiment, not an assumption carried into the results.
    - >-
      N prime. Load-bearing and enforced by protocol -- the composite-order
      control exists precisely because Claim B must FAIL there, and a pipeline
      reporting the same bound on composite order is measuring the wrong
      thing.
    - >-
      "Auxiliary state" is a function of the point alone in the primary arm.
      The pair-dependent and partial-state variants are enumerated in their own
      arms and their results are reported separately and never pooled.
    - >-
      Local search over labelings finds near-optima at the tested sizes. NOT
      GUARANTEED. The planted-positive recovery control is the only defence and
      a failure there voids every Stage-3 negative.
    - >-
      Toy scale throughout. Nothing about cryptographic N follows from any
      outcome, and the coincidence of the two frontiers at toy N is explicitly
      an open extrapolation, recorded as unjustified.

  proof_search_map:
    bottleneck: >-
      NOT the corollary, which is three lines, but the Stage-3 search.
      Claiming the open cell is empty requires having searched it competently,
      and a negative from a weak optimiser is a fatigue report wearing a plot.
      The planted-positive recovery control is therefore BLOCKING, not
      advisory.
    baseline_embedding:
      parameter_slice: >-
        "|A| = 1, s = 3, N = 23 -- the exact cell IDEA-20260815-f558e4 uses as
        its own frozen fixture."
      reproduction_check: >-
        The |A| = 1 edge of the sweep must reproduce the sibling record's
        q_maj value for the interval partition BY EXACT RATIONAL ARITHMETIC.
        The parent proposal states that value as 0.5369 and attributes it to
        IDEA-20260815-f558e4; this contract does not assert it as measured
        here, and the executor must read it from that record's own committed
        text before comparing. Identical numbers or the two pipelines disagree
        and neither may report a frontier.
    observation_collision:
      observable: >-
        The pair (state size, achieved propagation probability).
      distinct_preimage_search: >-
        The falsifier to hunt is TWO STRUCTURALLY DIFFERENT (v,a) pairs at the
        same frontier point -- one curve-derived, one arbitrary. If the
        frontier is achieved equally by objects that see the curve and objects
        that do not, the frontier is a fact about SIZES and no curve-specific
        conclusion may be drawn. The check is cheap -- run the identical
        optimisation on Z/N with no curve at all and compare on the same axes.
        It is the single most important audit in this design.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry the auxiliary register alongside the statistic and treat the
          PAIR as the invariant, encoded as a labeling of G by S x A.
          Completeness -- exact, every bounded-state object is such a labeling.
          Soundness -- Claim B bounds the exact regime for all of them.
          Transfer -- to E(F_p) by the group isomorphism, non-constructively.
        predicted_gain: >-
          Removes the exact half of one escape at zero compute and localises
          the remaining question to a two-dimensional frontier that can be
          plotted with its search budget attached.
    quantifier_order: >-
      THE CLAIM IS -- FOR ALL prime N, FOR ALL v, FOR ALL a, IF (v,a)
      propagates exactly AND is non-constant THEN |S| * |A| >= N. The bound
      does not depend on v or a, which is what makes it a bound rather than a
      screen. THE TRAP, NAMED -- the converse, that |S| * |A| >= N SUFFICES for
      exact propagation, IS FALSE and must never be stated or implied. The
      bound is necessary, not sufficient.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most -- "in the exact regime the state-size bound holds by the cited
        theorem and was not contradicted by complete enumeration at N <= 23;
        and within the tested budgets, statistic families, prime orders and
        search effort, the achieved probabilistic frontier is [these numbers]
        against [these nulls]." IT CANNOT SHOW THE OPEN CELL IS EMPTY IN
        GENERAL -- only that a bounded search did not find an inhabitant, which
        is a statement about the search unless the two analytic bounds are
        shown to meet.
      nearby_object_control: >-
        Z/N WITH NO CURVE AT ALL, run through the identical pipeline, plus a
        COMPOSITE-ORDER control at matched size where Claim B must FAIL. Both
        are mandatory and are reported on the same axes as the signal, never
        in an appendix.
    proof_obligations:
      - claim: >-
          Every exactly propagating non-constant (v,a) on prime-order G
          satisfies |S| * |A| >= N, over the complete enumeration.
        responsibility: correctness
      - claim: >-
          The pair-dependent and partial-state variants are enumerated and
          reported separately from the point-function variant.
        responsibility: scope
      - claim: >-
          The elliptic-net state size at toy scale satisfies the bound.
        responsibility: correctness
      - claim: >-
          Local search recovers the planted (v,a) optimum at every tested
          (|A|, s).
        responsibility: interface
      - claim: >-
          The |A| = 1 edge reproduces the sibling record's frozen fixture
          exactly.
        responsibility: baseline
      - claim: >-
          The curve-free Z/N control is reported alongside every frontier
          point.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No algorithm for the ECDLP or for any other problem is
    proposed. Pollard rho at O(sqrt(N)) remains the incumbent and nothing here
    competes with it. A frontier point, if one were found, would be a
    candidate OBJECT with a bounded description, and converting one into an
    algorithm is separate work with its own cost table.

  heuristic_assumptions:
    - id: HEUR-AUX-B1
      formal_statement: >-
        For prime N, any pair (v,a) from G to S x A that propagates exactly
        under the group law and is non-constant satisfies |S| * |A| >= N.
      random_model_justification: >-
        NOT A HEURISTIC BUT A COROLLARY, recorded here because this record
        rests on it entirely. The rigorous ingredient is the rigidity theorem
        of IDEA-20260807-df906f, whose proof assumes nothing about the target
        set; the counting step is pigeonhole. The one genuine gap is the
        definitional scope of "auxiliary state", which is a question of what is
        being claimed rather than of whether the argument is valid.
      supporting_results: []
      validation_experiment_ids: [EXP-PROP-ba2e44]
      falsification_condition: >-
        One exhibited non-constant exactly propagating pair with
        |S| * |A| < N at prime N, from the complete enumeration.
    - id: HEUR-AUX-B2
      formal_statement: >-
        The achievable probabilistic frontier q_maj(|A|, s) over efficiently
        computable curve-derived pairs coincides, within the empirical null
        spread, with the frontier achievable over arbitrary labelings of Z/N at
        the same sizes.
      random_model_justification: >-
        The rigorous ingredient is the character-sum bound invoked in
        IDEA-20260815-f558e4, which caps curve-derived Fourier structure at the
        N^(-1/2) scale, combined with the majority-advantage expansion used
        there. THE COMPOSITION IS UNWRITTEN and this is genuinely a heuristic
        -- it is the assumption that adding a bounded register creates no curve
        structure the register-free case lacks.
      supporting_results: []
      validation_experiment_ids: [EXP-PROP-ba2e44]
      falsification_condition: >-
        A curve-derived frontier point exceeding the curve-free Z/N frontier at
        the same (|A|, s) by more than the empirical null spread, reproducibly
        across at least 3 prime orders.

  predictions:
    - metric: >-
        E1 -- exact_propagation_counterexample_count -- the number of
        non-constant exactly propagating pairs (v,a) with |S| * |A| < N found
        by complete enumeration over N in {11, 13, 17, 23} and |S|, |A| in
        {2, 3, 4}
      direction: lower
      minimum_effect: >-
        EXACTLY 0. This is a DECISION, not an estimate, because the
        enumeration is complete. A single counterexample refutes Claim B and
        the record stops.
    - metric: >-
        E2 -- near_miss_count -- pairs propagating on more than 99 percent of
        input pairs but not all, at |S| * |A| < N
      direction: different
      minimum_effect: >-
        Reported whatever its value, with every near miss archived. Near misses
        are where a definitional slip in "propagates" would surface, and a
        zero-counterexample result accompanied by many near misses means
        something different from a zero-counterexample result with none.
    - metric: >-
        E3 -- elliptic_net_state_size versus the N / |S| bound at toy scale
      direction: higher
      minimum_effect: >-
        The measured net state size must be at least N / |S| at every tested
        toy curve. A violation refutes Claim B outright and more cheaply than
        E1.
    - metric: >-
        E4 -- planted_positive_recovery_rate -- fraction of (|A|, s) cells at
        which local search recovers the planted DL-coordinate optimum
      direction: higher
      minimum_effect: >-
        1.00 -- every cell. Below 1.00, Stage-3 negatives are inadmissible and
        the open cell is reported as UNTESTED rather than empty.
    - metric: >-
        E5 -- fixture_agreement at |A| = 1, s = 3, N = 23, interval partition
      direction: different
      minimum_effect: >-
        EXACT EQUALITY with the value committed in IDEA-20260815-f558e4, read
        from that record rather than assumed here, computed in exact rational
        arithmetic. Disagreement blocks both records.
    - metric: >-
        E6 -- curve_versus_curvefree_gap -- the paired per-cell difference
        q_maj_curve minus q_maj_ZmodN over the (|A|, s) grid, against the
        empirical null spread
      direction: different
      minimum_effect: >-
        NO NUMERIC THRESHOLD IS PRE-COMMITTED for the frontier's height,
        because any number stated here would be invented to be passed. What IS
        pre-committed -- the gap is claimed non-zero only if it exceeds the
        empirical null spread at the same cell AND reproduces across at least 3
        prime orders AND the excess DECAYS as N grows at fixed (|A|, s). A gap
        flat in N is recorded as an artifact.
    - metric: >-
        E7 -- composite_order_control -- whether the enumeration finds
        exactly propagating lossy pairs at composite N of matched size
      direction: higher
      minimum_effect: >-
        AT LEAST 1 such pair must be found. Claim B must FAIL on composite
        order because the rigidity theorem needs primality. A pipeline
        reporting the same bound on composite order is measuring its own
        default path and every Claim-B result is void.

  test_boundary:
    instances:
      - >-
        Exhaustive arm -- all labelings of G of prime order N in
        {11, 13, 17, 23} into S x A with |S|, |A| in {2, 3, 4} and
        |S| * |A| < N, in three variants -- point-function state (primary),
        pair-dependent state, and partial state.
      - >-
        Frontier arm -- prime-order subgroups of toy elliptic curves at at
        least 6 prime orders spanning a 6x range, with |A| in
        {1, 2, 4, 8, 16, 32} and s in {2,...,8}.
      - >-
        Curve-free control arm -- Z/N with no curve at all, identical grid and
        identical optimiser.
      - >-
        Composite-order control at matched size, where Claim B must fail.
      - >-
        Elliptic nets at toy curves, for the state-size consistency check.
      - >-
        OUT OF SCOPE -- any cryptographic-size N, any group that is not a
        prime-order subgroup in the primary arm, and any claim about
        differential cryptanalysis on the symmetric side, which is named as a
        structural analogy in the parent proposal and is tested nowhere here.
    parameters:
      exhaustive_primes: [11, 13, 17, 23]
      exhaustive_sizes: [2, 3, 4]
      state_budgets: [1, 2, 4, 8, 16, 32]
      statistic_sizes: [2, 3, 4, 5, 6, 7, 8]
      null_samples_per_cell: 200
      random_restarts_per_cell: 200
      frontier_prime_count_min: 6
    implementation: experiments/EXP-PROP-ba2e44
    budget:
      stage1_wall_clock_seconds: 1800
      stage2_wall_clock_seconds: 1800
      stage3_wall_clock_seconds: 14400
      maximum_memory_gb: 4
      maximum_runs: 12

  distinguishable_outcomes:
    - outcome: >-
        E1 = 0 over the complete enumeration, E3 satisfied by nets, E4 = 1.00,
        E5 exact, E7 >= 1, and E6's gap within the null spread at every cell.
      means: >-
        Claim B is not contradicted where it is decidable, the instrument is
        competent, and the frontier is a fact about SIZES rather than about
        elliptic curves. The honest headline is a controlled null -- the open
        cell was searched at the tested budgets and no curve-specific
        inhabitant was found. This is a real result under
        docs/inventor-protocol.md section 3 and it closes nothing.
    - outcome: >-
        E1 >= 1 -- a non-constant exactly propagating pair with
        |S| * |A| < N at prime N.
      means: >-
        CLAIM B IS FALSE. Either the rigidity theorem is misapplied or
        "propagates" is being defined differently in two places. The
        counterexample is archived verbatim as the refutation artifact and the
        record is withdrawn by a superseding record. Given the argument's
        brevity this is the most informative single outcome available.
    - outcome: >-
        E6's gap exceeds the null spread at some cell, reproducibly across
        3 or more prime orders, and DECAYS with N.
      means: >-
        CLAIM F IS FALSE and the open cell is inhabited by something the
        curve-free control cannot reach. This is the positive outcome and the
        only one that justifies a follow-on proposal; it would still claim no
        algorithm, no exponent and no attack, and would require independent
        replication before any status moves.
    - outcome: >-
        E4 < 1.00, or E5 disagrees, or E7 = 0.
      means: >-
        INSTRUMENT FAILURE. The open cell is reported as UNTESTED, not empty;
        no Stage-3 negative is admissible; and where E5 disagrees, both this
        record and IDEA-20260815-f558e4's lane are blocked until the
        discrepancy is located.
    - outcome: >-
        A gap that is flat in N.
      means: >-
        ARTIFACT under docs/inventor-protocol.md section 3, recorded as a
        controlled null and never as a finding.

  falsification_conditions:
    - >-
      F1 -- an exactly propagating non-constant lossy (v,a) with
      |S| * |A| < N at prime N. Claim B refuted; the record stops.
    - >-
      F2 -- an elliptic net violating the bound at toy scale. Same
      consequence, reached more cheaply.
    - >-
      F3 -- local search fails to recover the planted optimum at any cell. No
      admissible Stage-3 negative; the cell stays open and is reported as
      untested.
    - >-
      F4 -- the |A| = 1 edge disagrees with IDEA-20260815-f558e4's fixture.
      Pipeline bug; both records blocked.
    - >-
      F5 -- the curve frontier matches the curve-free Z/N frontier within the
      null spread. Claim F is CONFIRMED and Claim F's own consequence is that
      nothing curve-specific has been found; the record must say so plainly
      rather than presenting the frontier as an elliptic-curve result.
    - >-
      F6 -- the composite-order control returns no counterexample to Claim B.
      The pipeline cannot see the case where the bound must fail, and every
      Claim-B result from it is void.
    - >-
      F7 -- any achieved excess is flat in N. Artifact, recorded as a
      controlled null.

  interpretation_limits:
    - >-
      This addresses the EXACT half of ONE escape (E2 of IDEA-20260807-df906f).
      E1 is bounded separately by IDEA-20260815-f558e4, E3 and E4 are
      untouched, and KN-OPEN-019 is not closed by any of it.
    - >-
      No attack, no exponent, no cost claim. A frontier point would be a
      candidate object; converting one into an algorithm needs a separate
      proposal with its own cost table.
    - >-
      Everything is scoped to prime-order subgroups under the group law. The
      corollary is FALSE on composite order, which is not a defect but the
      content of the Pohlig-Hellman cell.
    - >-
      Toy scale throughout; claim tier capped at toy. The corollary is a
      derivation artifact per docs/claims-and-verification.md, never "proved",
      and a complete enumeration at N <= 23 checks the derivation rather than
      establishing an extrapolation.
    - >-
      The record's structural observation that the open cell has the shape of
      differential cryptanalysis is an ANALOGY named in the parent proposal. It
      is tested nowhere in this design and no outcome supports or refutes it.

