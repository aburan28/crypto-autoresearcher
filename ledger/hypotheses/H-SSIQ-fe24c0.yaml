# =============================================================================
# H-SSIQ-fe24c0 — specified from IDEA-20261006-2abea4 (bytes copied
# unchanged from origin/design/hyper-79cb0a-prym, blob
# 5bd9739da7c93ae940ef8b62fc279c6da374a9ef). Question RQ-SSIQ-9702af.
# The prediction under test is the idea's own: every supersingular j
# at p = 101 has least separable degree δ at most 3, and at least one
# j has δ at least 2. The concrete negative is that some supersingular
# j has least found degree at least 4 inside the cap 8. This record
# does not move the conditional exponent 1/3.
# =============================================================================
hypothesis:
  id: H-SSIQ-fe24c0
  question_id: RQ-SSIQ-9702af
  source_idea_ids:
    - IDEA-20261006-2abea4
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Least separable degree from E to E^{(p)} is at most 3 on the
    supersingular set in characteristic 101, and not always 1
  statement: >-
    Let p = 101. Let J be the set of supersingular j-invariants in
    characteristic p, each lifted to a curve E over F_{p^2}. Let
    δ(j) be the least degree of a separable isogeny E to E^{(p)}.
    The prediction taken from IDEA-20261006-2abea4 is that every
    δ(j) is an integer at most 3, and that at least one j has
    δ(j) at least 2. The integer 3 is the floor of factor F1 in
    RQ-SSIQ-9702af: (101/2)^{1/3} is greater than 3.6 and less
    than 3.7, so an integer degree obeying that ceiling is at most
    3. The concrete negative is that some supersingular j has least
    found degree at least 4 inside the search cap 8. A second
    negative, for the witness clause, is that every δ(j) equals 1.
    This census does not move the conditional p^{1/3+o(1)} exponent,
    does not test B-smoothness, and is not a curve-side versus
    quaternion-side comparison.
  mechanism: >-
    The tracked object is the j-invariant of a supersingular curve.
    The operation is the p-power Frobenius on j, sending E to
    E^{(p)}. δ(j) is the least d in 1 through 8 for which a
    separable cyclic kernel of degree d has codomain j-invariant
    equal to j^p, or 9 if no such d exists. Degree 1 means j^p = j.
    The projection keeps the integer δ(j) and discards the kernel.
    Distinct kernels can share one degree. The ordinary control is
    excluded from the maximum. A maximum at least 4 is the negative
    observation for the ceiling. A maximum of 1 is the negative
    observation for the claim that this prime witnesses a degree
    above the subfield locus.
  assumptions:
    - p = 101 is prime, and the supersingular locus is the set of roots of the supersingular polynomial in characteristic 101.
    - Degree 1 means j lies in F_p, checked by j^p = j.
    - For degree d from 2 through 8, every cyclic kernel is represented by a root of the corresponding division polynomial, and the codomain j is compared with j^p.
    - An inseparable isogeny is not counted. A kernel defined only over an extension is still counted if the isogeny degree is the integer d.
    - The ordinary control is excluded from the supersingular maximum.
  proof_search_map:
    bottleneck: >-
      The minimal degree δ(E to E^{(p)}), which is factor F1 of
      RQ-SSIQ-9702af and the input to the later split.
    baseline_embedding:
      parameter_slice: >-
        p = 101 only. Ceiling integer 3, because (101/2)^{1/3} is
        less than 4. Search cap 8, strictly above that ceiling.
      reproduction_check: >-
        Recompute δ for the lexicographically first supersingular j
        by an independent kernel enumeration. Disagreement voids
        the census.
    observation_collision:
      observable: the integer δ(j)
      distinct_preimage_search: >-
        Record two kernels of the same degree on one j, or two
        j-invariants with the same δ and distinct kernels. If no
        collision exists in the set, record that the fibres were
        singletons on this prime.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the finite supersingular set at p = 101
        predicted_gain: >-
          One histogram of δ. No change to the conditional exponent
          1/3.
    quantifier_order: >-
      For every supersingular j in characteristic 101, there exists
      a separable isogeny to the p-conjugate of degree at most 3,
      and there exists at least one j whose least such degree is at
      least 2. A universal quantifier over all primes is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        The histogram of δ on this one prime. It does not prove the
        degree bound for any other prime and does not produce a
        p^{1/4} algorithm.
      nearby_object_control: >-
        One ordinary j in F_{p^2}, selected by a rule frozen before
        any degree is scored. The ceiling 3 is not claimed for it.
        A small δ on that ordinary j does not support the
        supersingular bound.
    proof_obligations:
      - claim: Every enumerated supersingular j has a recorded δ at most 3 or a recorded counterexample degree.
        responsibility: size
      - claim: The second enumeration of the first j agrees.
        responsibility: correctness
      - claim: At least one δ is at least 2, or the set is entirely degree 1 and the prediction fails.
        responsibility: scope
    not_applicable_reason: >-
      This is a histogram at one prime. It does not propose a
      theorem for every prime, a complexity bound, or a closure of
      factor F1. The map audits that histogram only.
  rerandomization: >-
    No re-randomizing walk is used. The instance is the full
    supersingular set at p = 101, not a random draw. Nothing pulls
    a discrete logarithm back to an input point.
  asymptotic_claim:
    problem: >-
      least separable degree of E to E^{(p)} on the supersingular
      set at one toy prime
    prior_best: >-
      The opened question states a conditional time and memory
      p^{1/3+o(1)} under its heuristic. KR-RHO-13bf67, opened, is
      the generic discrete-logarithm floor Ω(√N). This hypothesis
      does not attack that group and does not move 1/3.
    time_exponent: '1/3, unchanged'
    memory_exponent: >-
      unchanged, the same p^{1/3+o(1)} memory. The census stores
      one integer per supersingular j at p = 101.
    hidden_cofactor: >-
      The o(1) in p^{1/3+o(1)} is not estimated. Kernel enumeration
      at p = 101 hides no attack term because no attack is run.
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against the opened isogeny exponent is 1.
      claim_kind is filled so the non-claim is explicit. A histogram
      of integers is not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For each supersingular j at p = 101, the least separable
        degree equals the least d in 1..8 for which a cyclic kernel
        of degree d has codomain j-invariant j^p, or else that
        degree exceeds 8. The finite check imitates an exhaustive
        search over a finite set of kernels, not a smoothness model.
      random_model_justification: >-
        No distribution theorem is used. For each fixed degree
        d at most 8 there are finitely many cyclic kernels. The
        opened question states a ceiling (p/2)^{1/3} less than 4
        at this prime, so a complete search through degrees at most
        3 decides the ceiling, and the cap 8 only detects a miss.
        The quantity sampled is the multiset of δ(j) on the full
        set, not a tail probability.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSIQ-354ffb
      falsification_condition: >-
        Some supersingular j has least found degree at least 4
        inside the cap 8. That observation refutes the ceiling on
        this set. It does not refute the degree bound at any other
        prime.
  structural_ingredients:
    - description: >-
        Over a finite field, isogenous curves share the number of
        points, and walking an isogeny class does not reach a
        different group-structure weakness class. This census does
        not walk toward a weak curve.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
      role: fence around a weak-curve walk
    - description: >-
        A generic-group discrete logarithm needs Ω(√N) group
        operations. The census is not a discrete-logarithm algorithm.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
      role: unchanged generic exponent
    - description: >-
        GHS Weil descent maps some elliptic discrete logarithms to
        a hyperelliptic Jacobian. No cover is built here.
      citation: KR-IC-5ea2f8
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
        on 2026-10-06
      role: fence around a cover attack
    - description: >-
        The Weil descent to F_2 of S_3 on ordinary binary curves has
        first fall degree 2, because the trace of x is a group
        morphism to F_2. This census computes no first-fall degree.
      citation: KR-IC-f5c584
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        on 2026-10-06
      role: fence around a descent reading
    - description: >-
        Recalled pointer, not opened: a separable isogeny E to
        E^{(p)} of degree at most (p/2)^{1/3} exists for
        supersingular E over F_{p^2}. The census treats that
        sentence as a finite prediction at p = 101, not as a
        theorem this session verified.
      citation: >-
        Aubry-Oyono-Vincent minimal-degree bound, as cited by
        RQ-SSIQ-9702af
      provenance: recalled
      verified_by: null
      role: source of the ceiling sentence, not support
  reduction_chain:
    core_problem: >-
      toy histogram of least separable degrees at characteristic 101
    corollaries: []
  predictions:
    - metric: max_delta_over_supersingular_j
      direction: lower
      minimum_effect: the maximum is an integer at most 3
    - metric: count_of_j_with_delta_at_least_2
      direction: higher
      minimum_effect: at least 1
  test_boundary:
    instances:
      - every supersingular j-invariant in characteristic 101
      - one ordinary j in F_{101^2}, excluded from the maximum
    parameters:
      prime: 101
      degree_cap: 8
      ceiling: 3
      field_polynomial: a^2 - 2
    implementation: >-
      Build the supersingular polynomial in characteristic 101 and
      list every root in F_{p^2}. For each root, test j^p = j, then
      enumerate cyclic kernels of degrees 2 through 8 and compare
      codomain j-invariants with j^p. Record δ(j) as the least hit,
      or 9 if none. Repeat the first j with a second kernel order.
      Score one ordinary j by the same procedure and keep it out of
      the maximum. No discrete logarithm is searched.
    budget:
      census: one pass over the supersingular set at p = 101
      maximum_runs: 1
  falsification_conditions:
    - >-
      Some supersingular j has least found degree at least 4 inside
      the cap 8. That is the concrete negative for the ceiling.
    - >-
      Every supersingular j has δ = 1. That is the negative
      observation for the claim that this prime witnesses a degree
      above the subfield locus.
    - The two enumerations of the first j disagree. The census is void and is not evidence about the ceiling.
  interpretation_limits:
    - p = 101 only. No transfer to cryptographic p and no statement about Heuristic 1.
    - The conditional time and memory remain p^{1/3+o(1)} if the opened question's other factors stand. This histogram does not lower 1/3.
    - A maximum of 3 is compatible with a later 1/4 target failing, because 3 is already above (101/2)^{1/4}, which is less than 3.
    - The recalled degree bound was not opened. Agreement at p = 101 does not verify that source.
    - KR-IC-f5c584 is a binary S_3 first-fall statement. Agreement or failure of δ at p = 101 says nothing about first fall degree 2.
