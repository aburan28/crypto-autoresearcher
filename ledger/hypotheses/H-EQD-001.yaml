hypothesis:
  id: H-EQD-001
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-001
  batch_id: BATCH-023
  source_proposal: null
  source_proposal_note: >-
    NO IDEA-* RECORD IS THE SOURCE, AND THAT IS RECORDED RATHER THAN PAPERED OVER.
    This hypothesis is the direct promotion of the forward guidance of REV-20260801-012,
    the independent contract review that returned REVISE on EXP-SMTH-001 at BATCH-022,
    adopted by DEC-20260801-007 which closes BATCH-022 as an RC-22 NON-EXECUTION and
    opens BATCH-023. It carries no ideation lineage because it is not a new mechanism;
    it is the isolation, as a separately falsifiable and directly measurable statement,
    of ONE LOAD-BEARING INPUT to the named heuristic HEUR-DS-1 - the joint law of the
    half-arity Semaev fibre invariants themselves.
  source_review: REV-20260801-012
  source_review_files:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  authorizing_decision_id: DEC-20260801-007
  experiment_ids:
  - EXP-EQD-001

  statement: >-
    THE CLAIM IS STATED AT LIMB L2 EXACTLY AS experiments/EXP-EQD-001/specification.yaml
    DEFINES IT, AND AT NO OTHER LIMB. For prime-field Semaev index calculus at arity
    m = 4 over the FROZEN DETERMINISTIC factor base of 512 x-coordinates of E(F_p) -
    the first 512 x-coordinates in F_p in increasing integer order that are
    x-coordinates of points of E(F_p) - the fibre invariants produced by the frozen
    half-arity fibre-invariant map INT-2, enumerated EXHAUSTIVELY over the
    C(512, 2) = 130816 unordered half-tuples (i, j) with i < j, are NOT DISTINGUISHABLE,
    at the thresholds calibrated under THR-EQD-1 from a MEASURED null distribution and
    at the frozen resolution ladder K in {16, 64}, from the fibre invariants produced by
    a UNIFORMLY RANDOM 512-point factor base of E(F_p) with distinct x-coordinates under
    the IDENTICAL map, the IDENTICAL enumeration and the IDENTICAL code path, at the two
    toy field sizes bits in {16, 20}. The fibre invariant is the pair
    (e_1, e_2) = ((-c_1) * c_2**(-1) mod p, c_0 * c_2**(-1) mod p), the two elementary
    symmetric functions of the root multiset of f_ij(Z) = c_2 Z**2 + c_1 Z + c_0 with
    c_2 = (x_i - x_j)**2, c_1 = -2 * ((x_i + x_j) * (x_i * x_j + a) + 2 * b) and
    c_0 = (x_i * x_j - a)**2 - 4 * b * (x_i + x_j) over F_p. THE PAIR IS NEVER ENCODED
    INTO A SINGLE INTEGER ANYWHERE IN THIS HYPOTHESIS OR ITS EXPERIMENT. THIS HYPOTHESIS
    CLAIMS A TOY-SCALE DISTRIBUTIONAL STATUS REPORT AT LIMB L2 AND NOTHING ELSE. It
    claims no smoothness behaviour, no cost saving, no exponent, no crypto-scale or
    medium-scale validity of anything, and no consequence for any deployed scheme.

  mechanism: >-
    The Semaev summation polynomial S_4 encodes the condition that four points of E sum
    to a target, and the meet-in-the-middle rewrite factors the search through the
    identity that S_4(x1, x2, x3, x4) = 0 holds iff there exists an intermediate
    x-coordinate Z with S_3(x1, x2, Z) = 0 and S_3(x3, x4, Z) = 0. The half-arity partial
    map is therefore (x_i, x_j) -> the root multiset of S_3(x_i, x_j, Z), a degree-2
    fibre whose COMPLETE invariant is the pair (e_1, e_2). The claw table of the
    meet-in-the-middle rewrite is keyed on the image of that map over the factor base.
    Every generic-behaviour argument about that table - including the smoothness
    accounting HEUR-DS-1 asserts - presumes that restricting the map to a DETERMINISTIC
    factor base, rather than to a random one, induces no structure in the fibre
    invariants. The mechanism of THIS hypothesis is exactly that presumption, stated as
    a directly computable two-sample question and decided against a matched null of the
    same shape. No factorization, no Dickman model, no analytic reference distribution,
    no engine, no backend, no cost identity and no wall-clock proxy enters the mechanism
    at all.

  why_this_is_separated_from_H_SMTH_001: >-
    H-SMTH-001 states HEUR-DS-1 itself - a claim about the B-SMOOTHNESS of an integer
    encoding of the intermediate against the Dickman law. H-EQD-001 states ONE
    LOAD-BEARING INPUT to it - the joint law of the fibre invariants, measured directly
    against a matched empirical null. THE MEASURED QUANTITY IS DIFFERENT, THE REFERENCE
    IS DIFFERENT, AND THE FALSIFICATION CONDITIONS ARE DIFFERENT. H-SMTH-001 IS NOT
    ALTERED, NOT RE-SCORED, NOT REOPENED AND NOT SUPERSEDED by this hypothesis; it
    remains at status `specified` with no evidence in either direction, and
    experiments/EXP-SMTH-001/specification.yaml remains hash-bound, unedited and NOT
    APPROVED.

  assumptions:
  - Toy prime-field curves at field sizes 16 and 20 bits; no live keys; no discrete logarithm is computed or claimed.
  - >-
    `bits` names the FIELD prime p and nothing else. The prime-order subgroup order is
    irrelevant to this hypothesis, which computes no discrete logarithm, harvests no
    relation and runs no search (RT047-B5 discipline discharged rather than inherited).
  - The real factor base is the frozen deterministic subset of E(F_p) of exact size Bfb = 512.
  - >-
    Bfb = 512 is a DECLARED DEPARTURE from H-DS-001.test_boundary.instances, which lists
    64, 128 and 256. It is admissible because this hypothesis is not H-DS-001 and does
    not touch it, and because C(512, 2) = 130816 clears the carried 10**5 sample minimum
    with 30.8 percent of margin. Nothing about H-DS-001's test boundary is altered or
    annotated by this departure.
  - >-
    The diagonal is EXCLUDED BY CONSTRUCTION, not counted and then dropped. The leading
    coefficient c_2 = (x_i - x_j)**2 vanishes over F_p exactly when x_i = x_j, so every
    enumeration is over i < j with distinct x-coordinates and the sample count is
    declared at 130816 accordingly. This is the direct repair of RV012-A2.
  - >-
    NO THRESHOLD ANYWHERE IN THIS HYPOTHESIS OR ITS EXPERIMENT IS DERIVED FROM AN
    ANALYTIC LAW. Every threshold is a stated order statistic of a MEASURED null
    distribution, fixed by a rule frozen before the calibration ran. This is the direct
    structural repair of RV012-A1.
  - >-
    A timeout, crash, resource exhaustion, budget cancellation or driver-hash mismatch is
    infrastructure or instrument signal and is NEVER evidence against this hypothesis in
    either direction (AGENTS.md rule 5).
  - >-
    The apparatus must demonstrate IN THE SAME RUN that it can detect a deviation of the
    class the decision statistics face - the PC-1 power certificate under CERT-EQD-1 -
    and that it does not manufacture one - the apparatus-identity control DV-7. Absent
    either, the run decides nothing.

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. This hypothesis asserts no exponent, no complexity and no
    asymptotic behaviour of any kind. All four asymptotic promotion gates G1 through G4
    remain OPEN across the program and nothing in this hypothesis, under any outcome of
    EXP-EQD-001, moves any of them. There is no path from this record, under any branch,
    to hypothesis status `supported` on any asymptotic claim anywhere in the program.

  heuristic_assumptions:
  - id: HEUR-DS-1
    relation: LOAD-BEARING INPUT, NOT IDENTITY. See interpretation_limits below.
    inherited_from: H-DS-001.heuristic_assumptions
    formal_statement_quoted_verbatim: >-
      "Intermediate degrees arising from half-arity Semaev partial maps on uniform random
      targets behave, for B-smoothness purposes, like uniform random integers of the same
      bitlength - the probability an intermediate is B-smooth is within a constant factor
      of Dickman rho(u) with u = log D / log B, where D bounds the intermediate degree."
    validation_experiment_ids:
    - EXP-SMTH-001
    validation_status: >-
      NEVER VALIDATED AND NEVER REFUTED, AT ANY SCALE, AS OF THE BATCH-023 OPENING, AND
      NOT VALIDATED OR REFUTED BY THIS HYPOTHESIS UNDER ANY BRANCH. EXP-SMTH-001 was
      never approved and never run. EXP-EQD-001 measures no smoothness at all.

  predictions:
  - metric: STAT-CHI-16 between OBJ-REAL and OBJ-NULL-RFB, per bit size
    direction: same
    minimum_effect: >-
      At or below the 199th ascending order statistic of the 200 CAL-1 replicate values
      of STAT-CHI-16 at that bit size, at BOTH bits 16 and bits 20. The exact
      false-rejection level of that rule on the measured null is 2/201 = 0.00995.
  - metric: STAT-CHI-64 between OBJ-REAL and OBJ-NULL-RFB, per bit size
    direction: same
    minimum_effect: >-
      At or below the 199th ascending order statistic of the 200 CAL-1 replicate values
      of STAT-CHI-64 at that bit size, at BOTH bit sizes.
  - metric: STAT-KS1-E1 between OBJ-REAL and OBJ-NULL-RFB, per bit size
    direction: same
    minimum_effect: >-
      At or below the 199th ascending order statistic of the 200 CAL-1 replicate values
      of STAT-KS1-E1 at that bit size, at BOTH bit sizes.
  - metric: STAT-KS1-E2 between OBJ-REAL and OBJ-NULL-RFB, per bit size
    direction: same
    minimum_effect: >-
      At or below the 199th ascending order statistic of the 200 CAL-1 replicate values
      of STAT-KS1-E2 at that bit size, at BOTH bit sizes.
  - metric: STAT-DUP on OBJ-REAL, per bit size
    direction: same
    minimum_effect: >-
      Inside the two-sided calibrated band [3rd, 398th] order statistic of the 400 CAL-1
      STAT-DUP values at that bit size, an exact two-sided level of 5/401 = 0.01247. THIS
      IS THE ARTIFACT TELL and a breach falsifies the INSTRUMENT, not this hypothesis.
  family_wise_statement: >-
    DECLARED IN ADVANCE RATHER THAN DISCOVERED LATER. The favourable branch N-2 requires
    all four two-sample tests to fail to reject at BOTH bit sizes - eight tests at level
    0.00995 each - so on a correct null the probability that N-2 is reached is about
    (1 - 0.00995)**8 = 0.9234 and the probability that a correct null is misread as a
    deviation is about 0.0766. That figure is the ATTAINABILITY of the favourable branch
    and it is measured-calibrated rather than modelled. Contrast EXP-SMTH-001, whose
    favourable branch required a tail rule that a correct null passed 0 times in 16.

  test_boundary:
    instances:
    - toy prime fields at bits in {16, 20}, one curve instance per field size from master seed 2301
    parameters:
      arity_m: 4
      d_half: 2
      factor_base_size_Bfb: 512
      real_factor_base_policy: frozen_deterministic_subset
      fibre_invariant_map: INT-2
      encoding: >-
        NONE. The pair (e_1, e_2) is measured directly and is never encoded into a single
        integer. Deleting the encoding step is the direct repair of RV012-B6.
      n_per_sample_set: 130816
      enumeration: unordered half-tuples (i, j) with i < j, diagonal excluded by construction
      resolution_ladder_K: [16, 64]
      excluded_resolution_rung: >-
        K = 256, DECLARED UNATTAINABLE IN ADVANCE under POW-EQD-1 at 1.996 expected counts
        per cell per arm, with the powering sample sizes stated - n >= 327680 at Bfb = 810
        for a five-per-cell floor, n >= 1966080 at Bfb = 1984 for a thirty-per-cell floor.
      matched_null_object: OBJ-NULL-RFB
      matched_null_construction: >-
        512 points drawn uniformly at random from E(F_p) with distinct x-coordinates,
        rejecting and redrawing on an x-collision, pushed through an IDENTICAL pipeline
        in which the ONLY difference from the real arm is the source of the 512 points.
        This is the mandatory null object of docs/inventor-protocol.md section 3.2, and
        it is matched by construction rather than by argument.
      instrument_characterization_objects: [OBJ-NULL-IND, OBJ-NULL-UNIF2]
      planted_deviation_object: OBJ-PLANT-delta
      planted_delta_ladder: [0.005, 0.01, 0.02, 0.05, 0.1]
      apparatus_identity_control: >-
        Two fresh independent OBJ-NULL-RFB draws against each other, DERIVABLY the same
        law. Rejection is an implementation defect; NON-REJECTION IS NOT CORROBORATION
        and may not be reported as such (RT048-H4 handled in advance).
      baselines: >-
        NONE APPLY. This hypothesis makes no cost claim, so matched Pollard rho and
        matched BSGS are not baselines for it and are not measured. Its Pareto position is
        recorded in the evidence record as a distributional statement with no cost axis,
        and `dominated_by: null` remains forbidden.
    implementation: >-
      New driver experiments/EXP-EQD-001/implementation/eqd001_driver.py under the frozen
      contract experiments/EXP-EQD-001/specification.yaml. No EXP-DS-001 and no
      EXP-SMTH-001 driver, module, control, amendment or run artifact is imported,
      modified or staged. No factorization library is needed at all and no new dependency
      is introduced.
    budget:
      calibration_run_wall_clock_seconds: 3600
      real_run_wall_clock_seconds: 1800
      total_cpu_hours: 2
      maximum_memory_gb: 4
      maximum_runs: 2

  falsification_conditions:
  - >-
    F-EQD-1 - branch N-4 of the frozen reading rule RR-EQD-1. At BOTH tested field sizes
    at least one retained statistic of DV-1 through DV-4 rejects at its calibrated
    threshold, with PC-1 rejecting and DV-7 not rejecting. H-EQD-001 is then reported
    FAILED AT TOY SCALE, scoped exactly to INT-2, the frozen deterministic factor-base
    policy at Bfb = 512, the two tested toy field sizes, m = 4 and the frozen resolution
    ladder. This is a `weaken`, NEVER a `reject_scoped` on one unreplicated run, and in
    particular never reject_scoped-as-impossibility. It is NEVER an adverse finding about
    HEUR-DS-1 in either direction.
  - >-
    F-EQD-2 - branch N-1, the artifact tell. STAT-DUP on OBJ-REAL falls outside its
    calibrated band at either bit size. This FALSIFIES THE INSTRUMENT, not the
    hypothesis - it says the sampled quantity is collapsing onto or spreading off the
    admissible support, so INT-2 as implemented is a stand-in. Disposition is
    `inconclusive` with a named repair.
  - >-
    F-EQD-3 - CAL-STOP-1. No delta on the frozen ladder reaches a 0.95 detection rate at
    both bit sizes, so the apparatus has no certified power against the alternative class
    it exists to detect. That falsifies the APPARATUS before the real arm runs, records
    NON-EXECUTION of the real arm, and is never a result about any object. The named
    repairs are a larger n or a different statistic, NEVER a relaxed threshold and NEVER
    a weaker delta bar.
  - >-
    F-EQD-4 - branch N-5, apparatus failure. PC-1 fails to reject, or DV-7 rejects, or the
    in-run null-vs-null statistics fall outside the archived CAL-1 distribution beyond the
    numerically declared margin. Instrument failure; no disposition in either direction.

  interpretation_limits:
  - id: IL-EQD-HEUR
    title: relation to HEUR-DS-1, carried VERBATIM from the frozen contract
    carried_verbatim_from: experiments/EXP-EQD-001/specification.yaml, what_this_establishes_and_what_it_leaves_untested.relation_to_HEUR_DS_1_stated_precisely
    text: >-
      EQUIDISTRIBUTION OF THE FIBRE INVARIANTS IS A LOAD-BEARING INPUT TO HEUR-DS-1 AND
      IS NOT IDENTICAL TO IT, AND NOTHING IN THIS BATCH MAY BLUR THAT. HEUR-DS-1 is a
      statement about B-SMOOTHNESS of the intermediates - that the probability an
      intermediate is B-smooth is within a constant factor of Dickman rho(u). This
      experiment measures no smoothness, factors no integer, and computes no largest
      prime factor. What a favourable outcome here would establish is that one route by
      which HEUR-DS-1 could fail - a detectable factor-base-induced departure in the
      joint law of the fibre invariants at the tested resolutions - is not present at
      this n and these cells. What it would NOT establish, under any branch, is
      (1) that the induced integer law carries the Dickman smoothness law at the toy X,
      which is a separate and unmeasured quantitative claim and which the finite-X
      corrections measured by REV-20260801-012 make non-trivial precisely at the large-u
      end; (2) anything about the alternative faithful encoding of the intermediate, the
      x-coordinate x(P_i +/- P_j) below p, which the claw table is actually keyed on;
      (3) anything at m = 5, at any other factor-base size, at any non-toy field size,
      or for target-driven rather than factor-base-driven half-tuples; (4) any cost
      consequence, any early abort, any exponent.
  - id: IL-EQD-L1
    title: limb L1 is a DERIVATION and never an experimental finding of this batch
    text: >-
      (e_1, e_2) IS NOT UNIFORM ON F_p x F_p, AND THIS IS A DERIVATION RATHER THAN A
      RESULT. The roots of S_3(x_i, x_j, Z) are x(P_i + P_j) and x(P_i - P_j), which are
      x-coordinates of points of E(F_p); the set X_E of such x-coordinates has size about
      p/2; and (e_1, e_2) determines the unordered root pair as the roots of
      t**2 - e_1 t + e_2. So the admissible support of (e_1, e_2) has size about
      |X_E|**2 / 2, that is about p**2 / 8, A DENSITY OF ABOUT ONE EIGHTH in F_p x F_p.
      A statistic with enough resolution to see the support therefore rejects the uniform
      law with certainty, and it rejects it because half of F_p consists of
      non-x-coordinates - an elliptic-curve fact, not a Semaev fact, and the exact
      analogue of the x(P) = x(-P) factor 2 that was the entire structural content of the
      BATCH-020 measurement. NO BRANCH OF THE READING RULE MAY PRESENT THAT DENSITY AS AN
      EXPERIMENTAL RESULT OF THIS BATCH. CAL-4 checks it empirically as an INSTRUMENT
      CHARACTERIZATION only, and the 2-torsion caveat is part of that check - if #E(F_p)
      is even, halving is not a bijection on E and the realizable set of root pairs is
      smaller than all of X_E choose 2, which moves the density figure. OBJ-NULL-UNIF2 is
      DERIVABLY NON-MATCHED and is never a reference distribution for any decision
      variable.
  - id: IL-EQD-L3
    title: limb L3 is an instrument fact and never a result about the map
    text: >-
      Whether the half-tuple DEPENDENCY STRUCTURE itself - each factor-base point
      appearing in 511 pairs - moves the statistic is measured by CAL-3 against
      independently drawn point pairs. It is the empirical justification for choosing a
      random FACTOR BASE rather than independent pairs as the matched null. It appears in
      no branch condition of the reading rule and neither outcome is a result about the
      Semaev map.
  - id: IL-EQD-SMOOTHNESS-OWED
    title: the smoothness measurement remains OWED and is not discharged here
    text: >-
      The direct smoothness measurement of HEUR-DS-1 remains UNPERFORMED across
      twenty-three batches. It is carried as declared open item OPEN-BATCH023-A with its
      two named repairs - calibrate KS, RATE and TAIL against a MEASURED null at the
      actual X instead of against the asymptotic rho, and enumerate i < j - and it is
      ranked into the BATCH-024 opening. NO OUTCOME OF EXP-EQD-001 DISCHARGES IT and no
      deliverable of this batch may say that it does.
  - id: IL-EQD-SCOPE
    title: toy scope and unreplicated status
    text: >-
      Toy scale only, two field sizes, one curve instance each, one master seed, one host,
      one unreplicated real arm. A favourable outcome is `replicate`, never `support`, and
      never validation of anything above the toy tier. The calibration run
      RUN-EQD-001-calib is EXPRESSLY NON-EVIDENTIAL about this hypothesis, about
      HEUR-DS-1 and about H-SMTH-001 in either direction, and no evidence record may cite
      it as bearing on any hypothesis.
  - id: IL-EQD-POWER
    title: what remains uncertified
    text: >-
      CAL-2 measures the detection rate against a PRE-DECLARED alternative class - the
      OBJ-PLANT-delta ladder - and CERT-EQD-1 turns that measurement into an in-run
      certificate. WHAT REMAINS UNCERTIFIED IS POWER AGAINST ALTERNATIVES OUTSIDE THE
      PLANT CLASS. That limitation is declared here in advance and must be repeated in
      the evidence record. "Deviates if and only if" in the decision-variable variation
      check is a statement about the SUPPORT of the deviation, not about the POWER to
      detect it.
  - id: IL-EQD-NO-COST
    title: no cost consequence under any outcome
    text: >-
      No cost consequence follows from any outcome. Even a clean favourable branch
      licenses no early abort, no charged saving and no exponent, because this experiment
      measures no wall-clock time, no charged unit, no operation count, no cost ratio and
      no R at all.
  - id: IL-EQD-UNTOUCHED
    title: records this hypothesis does not move
    text: >-
      H-DS-001 remains `weakened` with its status_scope; H-IC-001 and H-STR-002 remain
      weakened; H-SMTH-001 remains `specified` with no evidence in either direction;
      EV-DS-001 through EV-DS-004 are not re-scored; and experiments/EXP-SMTH-001 and
      every EXP-DS-001 artifact are untouched. None of them is reopened, re-scored or
      superseded by this hypothesis.
  - id: IL-EQD-GATES
    title: promotion gates
    text: >-
      All four asymptotic-claim promotion gates G1 through G4 remain OPEN. S1_met, F1_met,
      F2_met and structure_gate_passed cannot be evaluated by this hypothesis at all,
      because its experiment runs no search.
  - id: IL-EQD-REVIEW-INDEPENDENCE
    title: review independence under this harness
    text: >-
      Under this Claude Code harness the authoring and reviewing sessions both resolve to
      claude-opus-5. Reviews of this hypothesis and its experiment are independent in the
      AGENTS.md sense - a separate session that did not author the artifact - but NOT in
      the model sense, and no review produced here is admissible toward the three-model
      closure quorum of AGENTS.md rule 13.

