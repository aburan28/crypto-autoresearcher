  status_scope_batch023_close:
    id: SCOPE-EQD-ANALYZED-1
    written_by_decision: DEC-20260801-008
    written_at: '2026-08-01'
    what_analyzed_asserts: >-
      EXACTLY ONE THING - that this hypothesis's experiment EXP-EQD-001 has been executed once,
      validated ADMISSIBLE with zero defects, independently red-teamed, and READ UNDER ITS
      FROZEN RULE, and that the branch the rule selected is N-2. It asserts that the analysis
      stage is complete. IT ASSERTS NOTHING ABOUT THE HYPOTHESIS BEING TRUE.
    what_was_measured_and_where_it_binds: >-
      On the two toy curve instances generate_instance(2301, 16) (p = 46663, #E = 46860) and
      generate_instance(2301, 20) (p = 767551, #E = 767427), at Bfb = 512, m = 4,
      n = C(512, 2) = 130816 half-tuples per arm, ONE master seed, ONE host and ONE null draw
      per cell - the fibre invariants (e_1, e_2) = INT-2 induced by the frozen deterministic
      factor base were NOT DISTINGUISHED from those induced by a single uniformly drawn
      512-point factor base on the same curve, by any of the three RETAINED statistics
      (two-sample chi-square of homogeneity at K = 16 and K = 64, and the two-sample KS
      statistic on the e_1 marginal), each against the 199th of 200 measured null-versus-null
      replicate values. Six of six failed to reject. The family-wise level of that conjunction
      is 0.0582, NOT 0.00995.
    the_bound_that_travels_with_it: >-
      THE MEASURED DETECTION FLOOR IS PART OF THE STATUS AND NOT A FOOTNOTE. Against the ONLY
      alternative class ever measured - an e_1-MARGINAL plant - the branch-level floor is
      delta = 0.02 with joint power at least 0.861, and the frozen certification predicate
      certifies delta = 0.05. A deviation of that class affecting about 1 percent of the 130816
      half-tuples, of order 1300 pairs, would have been MISSED ABOUT 85 PERCENT OF THE TIME, and
      at 0.5 percent essentially always. AND ZERO POWER WAS MEASURED AGAINST ANY DEVIATION THAT
      PRESERVES BOTH MARGINALS AND MOVES ONLY THE DEPENDENCE BETWEEN e_1 AND e_2 - the frozen
      plant moves the e_1 marginal only, so a copula-type deviation of ARBITRARY magnitude is
      not excluded at all. THIS RUN BOUNDS DEPARTURES IN THE e_1 MARGINAL; IT DOES NOT BOUND THE
      JOINT LAW. Since the real base is a small-x window (max x = 1052 against p = 46663), that
      is exactly the shape a structured base would produce.
    what_this_status_does_NOT_assert:
    - 'NOT `supported`. The state machine requires `replicated` first and this is one unreplicated toy run.'
    - 'NOT that the fibre invariants are generic, equidistributed or random-like in any broader sense.'
    - 'NOT validation or refutation of HEUR-DS-1 at any tier, in either direction. No smoothness was measured and no integer was factored.'
    - 'NOT any statement about the e_2 marginal beyond what two coarse joint grids see.'
    - 'NOT any statement about a deviation the deterministic and the random base SHARE, to which a two-sample design is blind by construction.'
    - 'NOT any separation of "deterministic selection rule" from "small-x window", which this design confounds.'
    - 'NOT any medium-scale, crypto-scale, asymptotic or affected-scheme claim. Toy tier only.'
    - 'NOT S1_met, F1_met, F2_met or structure_gate_passed, and NOT any movement of G1 through G4, which all remain OPEN.'
