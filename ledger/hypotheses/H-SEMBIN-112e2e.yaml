hypothesis:
  id: H-SEMBIN-112e2e
  question_id: RQ-SEMBIN-fa2e3f
  statement: >-
    On identical chained-S_3 Boolean instances, Semaev's d_F4 (KN-LIT-fa346d
    Section 4.4: the maximal total degree of a polynomial occurring before F4
    terminates, with the trailing "No pairs to reduce" steps at degrees 5, 6, 7
    excluded) and the Macaulay-rank statistic D that GOAL-DREG-001's block-m4ri
    instrument reports are DIFFERENT quantities satisfying d_F4 <= D, and the
    inequality is strict on instances GOAL-DREG-001 has already measured.
    Concretely: GOAL-DREG-001's reported work at Macaulay degrees 5 and 6
    (EV-DREG-008) is therefore NOT a counterexample to Assumption 1, and the two
    campaigns have not been in contradiction. The predicted separation is exactly
    the excluded tail: the degrees at which the Macaulay instrument still finds
    rank-contributing rows are degrees at which F4, by Semaev's own accounting,
    has no critical pairs left to reduce.
  mechanism: >-
    The two statistics are read off different objects at different stopping points.
    Semaev's d_F4 is a property of an F4 TRACE: the algorithm maintains a working
    set of critical pairs, selects a degree, reduces, and terminates; d_F4 is the
    largest total degree seen strictly before termination. Section 4.5.1 reports
    step degrees 5, 6 and 7 at which F4 reports "No pairs to reduce" and excludes
    them from d_F4, because a step with no pairs performs no reduction and reveals
    no new leading terms.
    The Macaulay-rank statistic is a property of a FIXED-DEGREE LINEAR ALGEBRA
    PROBLEM: for each degree d, build the Macaulay matrix of all products of
    generators by monomials up to degree d and compute its rank, or its rank
    deficiency against the count of degree-d monomials. It has no notion of
    critical pairs and no notion of termination. It reports a degree as active
    whenever the degree-d block contributes rank the degree-(d-1) block did not,
    which happens for rows that are algebraic consequences already implied by lower
    degrees -- exactly the rows an F4 pair-selection strategy never forms because
    Buchberger's criteria discard them.
    That gives the direction of the inequality. Every degree at which F4 does real
    reduction work is a degree at which the Macaulay matrix must also gain rank
    (the reduction produces a polynomial of that degree that was not in the span
    below it), so d_F4 <= D. The converse fails whenever the Macaulay block gains
    rank from a row F4's criteria eliminate, so strictness is expected rather than
    exceptional.
    Two further sources of separation, both measurable on the same instances and
    both of which must be separated from the pair-criteria effect before the map is
    claimed. First, the Boolean field equations x^2 = x are handled differently by
    the two instruments -- as explicit generators in a Macaulay construction, and
    often implicitly by a Boolean-aware F4 -- and including them changes which
    degree a given consequence first appears in. Second, GOAL-DREG-001 may report a
    solving degree, a degree of regularity in the semi-regular sense, or a
    first-degree-of-rank-deficiency; these coincide for semi-regular systems and
    diverge for the chained system, which is provably NOT semi-regular (its first
    fall degree is 4 at every t, well below the semi-regular prediction).
    The mechanism is therefore not "one instrument is wrong". It is that the map
    between them is a specific, checkable function of the pair-selection strategy,
    the field-equation convention, and the degree definition, and no record in this
    repository states it.
  assumptions:
    - >-
      The instances compared are byte-identical Boolean systems, generated once and
      handed to both instruments, rather than regenerated per instrument from the
      same (n, m, t, k). A regeneration difference in variable order or in the
      subspace basis would confound the whole comparison and is the most likely way
      to get a spurious separation.
    - >-
      An open-source engine can be made to report a trace statistic commensurable
      with Semaev's definition -- that is, to expose per-step degrees and to
      distinguish a step that reduced pairs from a step that found none. If it
      cannot, this hypothesis is untestable as stated and the honest outcome is an
      impediment, not a result.
    - >-
      GOAL-DREG-001's instrument can be run on instances chosen here rather than
      only on the ones already in its own frozen contracts.
    - >-
      Semaev's exclusion of the empty tail steps is read here as he states it in
      Section 4.5.1. This is a reading of the frozen text, not an inference about
      his implementation, which was never published.
  proof_search_map:
    bottleneck: >-
      The step that makes any degree measurement in this program comparable to the
      paper's: a stated, instance-level map from the reported statistic to Semaev's
      d_F4. Without it every downstream boundary measurement is uninterpretable,
      because a disagreement is equally explicable as a definitional difference.
    baseline_embedding:
      parameter_slice: >-
        The published cells of KN-LIT-fa346d Table 1 at n = 13, m = t = 4, k = 4
        and n = 17, m = t = 3, k = 6, where the paper reports d_F4 = 4 and gives
        MAGMA timings. These are the exact old-method boundary: the instruments must
        agree with each other AND with the paper's value of 4 there, or the
        comparison has no control.
      reproduction_check: >-
        Both instruments report 4 on the reproduction cells. A frozen regression
        fixture stores the generated Boolean system, its sha256, and both reported
        degree traces, so any later re-measurement is compared rather than merely
        repeated.
    observation_collision:
      observable: >-
        The reported degree statistic as a function of the instance. Two instruments
        are said to collide when they return the same value.
      distinct_preimage_search: >-
        Search for instances where the two statistics AGREE numerically for
        different reasons -- for instance where the Macaulay block gains rank at
        degree 4 from a pair-criteria-eliminated row while F4 also reaches degree 4
        by real reduction. An agreement of this kind is the dangerous case: it would
        make the map look like the identity on the reproduction cells and diverge
        off them, which is precisely how a definitional gap survives a control.
        Enumerate per-degree rank increments and per-step pair counts, not just the
        maxima, so the reason is visible and not only the number.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The per-degree pair-count and rank-increment profile of an instance, as a
          vector, instead of its maximum. The maximum is the lossy projection whose
          fibres are the source of the confusion.
        predicted_gain: >-
          Both d_F4 and D become functions of the profile, so the map between them
          is read off directly rather than inferred from two scalars.
      - transform: specialization_pack
        proposed_object: >-
          The Boolean field equations x^2 = x as an explicit, toggleable generator
          set, so the convention becomes an independent variable of the measurement
          rather than a hidden property of each instrument.
        predicted_gain: >-
          Separates the field-equation convention from the pair-criteria effect;
          either one alone can shift a reported degree by one.
    quantifier_order: >-
      For every instance I in the declared cell set, d_F4(I) <= D(I). There EXISTS
      an instance in the declared set at which the inequality is strict. The
      converse universal -- that the inequality is strict for all instances -- is
      NOT claimed, and neither is any statement about instances outside the cell
      set. In particular no claim is made forall n.
    method_ceiling:
      strongest_certifiable_claim: >-
        A stated map, with its per-degree profiles, on the finitely many instances
        actually measured (n <= 21 and the m = 2 window). Not a theorem that
        d_F4 <= D in general, which would need an argument about F4 pair selection
        this experiment does not attempt.
      nearby_object_control: >-
        A random dense Boolean system of matched shape -- same variable count, same
        equation count, same degree profile -- whose first fall degree is not 4 by
        construction. On such a system the two statistics should BOTH rise, and
        rise together. If the separation between them is the same on the structured
        and the matched-random system, the separation is a property of the two
        instruments' conventions and says nothing about the chained structure, which
        is the outcome that would make this hypothesis uninteresting rather than
        false.
    proof_obligations:
      - claim: >-
          The generated Boolean system is the chained system of KN-LIT-fa346d
          eq. (5) at the declared (n, m, t, k) -- n(t-1) equations in n(t-2) + kt
          variables, algebraic degree 3.
        responsibility: correctness
      - claim: Both instruments agree on 4 at the two reproduction cells.
        responsibility: baseline
      - claim: d_F4 <= D on every measured instance.
        responsibility: strictness
      - claim: >-
          The separation, where present, is attributable to pair-criteria
          elimination rather than to the field-equation convention or to variable
          ordering.
        responsibility: correctness
      - claim: >-
          No statement about Assumption 1's truth follows from this hypothesis. It
          establishes commensurability, not validity.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For chained-S_3 Boolean instances at fixed (n, m, t, k), the difference
        D - d_F4 is a function of the pair-selection strategy and the
        field-equation convention alone, and is independent of the random draw of
        the target point R and of the curve coefficient B.
      random_model_justification: >-
        The difference is being asserted to be a property of the ALGORITHMS rather
        than of the instance. Under the model in which the descended system's
        degree-d Macaulay blocks behave like random matrices of their size subject
        to the structural rank defect the chained form imposes, the rank increments
        depend on the shape and the defect, both fixed by (n, m, t, k), and not on
        R or B. This is the natural null; it is stated so it can be falsified rather
        than assumed.
      supporting_results:
        - >-
          Semaev's own Tables 1-2 report d_F4 = 4 in every one of 2300 systems
          across 100 random z per cell, which is consistent with the maximum being
          insensitive to the draw within a cell (KN-LIT-fa346d, "Experimental basis,
          exactly"; provenance kb via inputs/SEMAEV-2015-310/tables.yaml).
        - >-
          The Bardet-Faugere-Salvy semi-regular degree-of-regularity theory predicts
          rank behaviour from shape alone for generic systems. Recalled pointer
          only; no agent in this program has opened it, and it does not support this
          entry (AGENTS.md rule 9).
      validation_experiment_ids:
        - EXP-SEMBIN-c2c312
      falsification_condition: >-
        D - d_F4 varies across the 20 random R draws within a single cell by more
        than the instrument's own reported repeatability, or varies between B = 1 and
        random B at fixed (n, m, t, k). Either observation refutes HEUR-001 and means
        the map is instance-dependent, which would make a single stated map wrong and
        is a more interesting outcome than the hypothesis.
  structural_ingredients:
    - description: >-
        The chained S_3 presentation of point decomposition: eq. (5) of the frozen
        paper, giving n(t-1) equations in n(t-2) + kt Boolean variables of algebraic
        degree 3, against degree 2^{t-1} for the single summation polynomial eq. (4).
      citation: KN-LIT-fa346d; inputs/SEMAEV-2015-310/paper_fulltext.md eq. (5)
      provenance: kb
      verified_by: TASK-20260913-8702c8
      role: the system both instruments are run on
    - description: >-
        Semaev's definition of d_F4 and his explicit exclusion of the degree-5/6/7
        "No pairs to reduce" tail steps, Section 4.4 and end of Section 4.5.1.
      citation: inputs/SEMAEV-2015-310/paper_fulltext.md Sections 4.4, 4.5.1
      provenance: kb
      verified_by: TASK-20260913-8702c8
      role: the definition whose difference from a Macaulay statistic is the claim
    - description: >-
        GOAL-DREG-001's block-m4ri Macaulay-rank instrument and its reported work at
        Macaulay degrees 5 and 6 on this same Boolean system.
      citation: ledger/goals/GOAL-DREG-001.yaml; EV-DREG-008
      provenance: internal
      verified_by: TASK-20260913-8702c8
      role: the second statistic, and the reason the map is load-bearing now
    - description: >-
        Kosters-Yeo and Huang-Kosters-Yeo on the gap between first fall degree and
        degree of regularity for summation systems, which is the general form of the
        distinction this hypothesis makes instance-level and concrete.
      citation: KN-LIT-7604; KN-LIT-7607
      provenance: internal
      verified_by: TASK-20260913-8702c8
      role: prior art that the two degrees separate; not evidence for this map
  reduction_chain:
    core_problem: >-
      Commensurability of degree statistics for chained-S_3 Boolean systems.
    corollaries:
      - problem: >-
          Whether GOAL-DREG-001's existing degree-5/6 measurements bear on Semaev's
          Assumption 1.
        reduction_ref: >-
          Direct: the map, once stated, is applied to the already-recorded values.
          No published reduction is invoked.
        asymptotics_preserved: not_applicable
      - problem: >-
          Whether a boundary measurement under H-SEMBIN-2d7708 can be compared to
          the paper's own cells at all.
        reduction_ref: >-
          Direct dependency; EXP-SEMBIN-7e1371 declares EXP-SEMBIN-c2c312 as a
          prerequisite for this reason.
        asymptotics_preserved: not_applicable
  predictions:
    - metric: d_F4_at_reproduction_cells
      direction: different
      minimum_effect: >-
        Exactly 4 at n = 13, m = t = 4, k = 4 and at n = 17, m = t = 3, k = 6,
        matching KN-LIT-fa346d Table 1. Any other value is a calibration failure
        and stops the experiment as a procedure defect, not as a finding about
        Semaev.
    - metric: statistic_ordering
      direction: different
      minimum_effect: >-
        d_F4 <= D on every measured instance, with no exception. A single instance
        with d_F4 > D refutes the stated direction of the map.
    - metric: separation_strictness
      direction: higher
      minimum_effect: >-
        D - d_F4 >= 1 on at least one instance in the declared cell set, and on the
        instances closest in shape to those GOAL-DREG-001 measured at Macaulay
        degrees 5 and 6.
    - metric: separation_vs_matched_null
      direction: different
      minimum_effect: >-
        The separation on the structured chained system differs from the separation
        on the matched-shape random Boolean null by at least 1 in the degree
        statistic. If the two separations are equal, the measured gap is an artifact
        of the two conventions and the hypothesis is uninteresting.
    - metric: separation_invariance
      direction: different
      minimum_effect: >-
        D - d_F4 constant across the 20 random R draws within each cell, and across
        B = 1 versus random B. Variation refutes HEUR-001.
  test_boundary:
    instances:
      - >-
        E/F_{2^n}: Y^2 + XY = X^3 + A X^2 + B, so
        S_3(x_1,x_2,x_3) = (x_1x_2 + x_1x_3 + x_2x_3)^2 + x_1x_2x_3 + B; B = 1 and
        random B
      - >-
        chained S_3 Boolean systems from eq. (5) at the cell set below, generated
        ONCE per instance and handed byte-identically to both instruments
      - >-
        matched-shape random dense Boolean control systems at the same variable
        count, equation count and degree profile
    parameters:
      reproduction_cells:
        - {n: 13, m: 4, t: 4, k: 4}
        - {n: 17, m: 3, t: 3, k: 6}
      separation_cells:
        - {n: 15, m: 5, t: 3, k: 3}
        - {n: 19, m: 3, t: 3, k: 7}
        - {n: 21, m: 3, t: 3, k: 7}
        - {n: 12, m: 6, t: 6, k: 2}
      off_diagonal_cells:
        - {n: 17, m: 3, t: 3, k: 7}
        - {n: 17, m: 3, t: 3, k: 8}
      subspace_variants: [low_degree_polynomial, random_k_dimensional]
      curve_coefficient: [B_equals_1, B_random]
      draws_per_cell: 20
      field_equation_convention: [explicit_generators, engine_implicit]
    implementation: >-
      Open-source only: a Boolean-aware F4 or F5 exposing per-step degrees and pair
      counts, plus GOAL-DREG-001's existing block-m4ri Macaulay-rank instrument
      re-run on instances generated here. No MAGMA licence exists in this program,
      so the paper's timings are explicitly NOT a target; only its reported degree
      value of 4 is.
    budget:
      wall_clock_seconds_per_cell: 3600
      maximum_memory_gb: 8
      maximum_runs: 480
      enforcement: advisory
  falsification_conditions:
    - >-
      An instance in the declared cell set with d_F4 > D. This refutes the stated
      direction of the map and means the two statistics are not ordered as claimed.
    - >-
      D - d_F4 = 0 on every measured instance including the off-diagonal cells. The
      two statistics would then be the same quantity in this regime, GOAL-DREG-001's
      degree-5/6 measurements WOULD be in tension with Assumption 1, and this
      hypothesis is wrong in the direction that matters most.
    - >-
      The separation on the matched-shape random null equals the separation on the
      structured system, making the gap a convention artifact carrying no
      information about the chained construction.
    - >-
      D - d_F4 varies with the random draw of R or with B at fixed (n, m, t, k),
      refuting HEUR-001 and any single stated map.
    - >-
      Either instrument fails to return 4 at both reproduction cells. This is a
      procedure defect that invalidates the run; under AGENTS.md rule 5 it is never
      evidence about Semaev's assumption.
  interpretation_limits:
    - >-
      This hypothesis establishes COMMENSURABILITY and never validity. Confirming
      d_F4 < D says nothing about whether Assumption 1 is true; it says that one
      apparent counterexample to it is not one. RQ-SEMBIN-fa2e3f's boundary work
      under H-SEMBIN-2d7708 is where validity is addressed.
    - >-
      Nothing here bears on Assumption 2 (d_F4 = o(sqrt(n/ln n))), which is a
      different claim with a different consequence set.
    - >-
      The map is claimed only on the finitely many instances measured, n <= 21 plus
      the declared off-diagonal cells. No transfer to n = 409, 571 is claimed or
      implied, and the 27-fold extrapolation the paper's own conclusion needs is
      untouched by this record.
    - >-
      A memory or wall-clock stop on any cell is an impediment with a recheck. It is
      not negative evidence about the map and not evidence about Assumption 1
      (AGENTS.md rule 5).
    - >-
      No claim about the security of any deployed curve, in either direction.
  status: specified
  status_history:
    - status: proposed
      at: '2026-09-13'
      by: coordinator
    - status: specified
      at: '2026-09-13'
      by: coordinator
      ref: DEC-20260913-ebd639
      note: >-
        Frozen contract EXP-SEMBIN-c2c312 approved. Execution NOT authorized:
        this contract needs a Groebner and a Macaulay engine, and the ranking
        puts the two derivation-only contracts first.
  validation_experiment_ids:
    - EXP-SEMBIN-c2c312
  specified_by: DEC-20260913-ebd639
  proposed_by: coordinator
  added: '2026-09-13'
