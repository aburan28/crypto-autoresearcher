# Specified and approved under DEC-20261006-3cccf4. ZERO scientific runs.
# No Magma/Sage/Bedrock. No CSIDH-512 figure. GOAL-CSIDH-001.yaml and
# GOAL-ECDLP2M-001.yaml are not edited.
# =============================================================================
hypothesis:
  id: H-CSIDH-73e6ab
  question_id: RQ-CSIDH-64343f
  source_idea: IDEA-20261005-1896e8
  derived_from_idea: IDEA-20261005-1896e8
  experiment_id: EXP-CSIDH-999626
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-CSIDH-64343f is owned by GOAL-CSIDH-001. This design does not edit that
    head and does not edit GOAL-ECDLP2M-001.yaml.
  specified_at: '2026-10-06'
  approved_at: '2026-10-06'
  authorised_by: DEC-20261006-3cccf4
  proposed_by: coordinator
  status: approved
  title: >-
    At disc=-419 the probe C(1,2)/C(1,M_free) is an integer ≥2 against a
    memory-blind control that stays at 1 (O-SEPARATES), or M_free<4 so the
    cap does not bind (O-NO-BIND)

  statement: >-
    SETTING (IDEA-20261005-1896e8). At p=419 (p=4*3*5*7-1, p≡3 mod 4), let O
    be Z[(1+sqrt(-p))/2] of discriminant -419. Let N be the class number of
    O, certified by agreement of two independent exhaustive enumerations of
    the reduced positive-definite binary quadratic forms of that
    discriminant. Define n=max(1, ceil(log2(max(N,2)))), M_free=2^{ceil(sqrt(n))},
    and C(G,M)=G*2^{ceil(sqrt(n))}*ceil(M_free/M). C_blind(G)=G*2^{ceil(sqrt(n))}
    deletes the ceil(M_free/M) factor.

    CLAIMS UNDER TEST:
    (S0) Zero-compute freeze of disc=-419 (not -4*419), formulas, M labels,
    G in {1,2}, twin enumerations, and the forced-N=1 nearby object.
    Numeric N is NOT preregistered.
    (SEP) O-SEPARATES: enumerations agree; M_free>=4; C(1,2)/C(1,M_free)
    is an integer >=2; C_blind ratio=1; replacing G by 2G multiplies costs
    by 2 and leaves ratios unchanged; forced N=1 returns ratio 1.
    (NOBIND) O-NO-BIND: enumerations agree and M_free<4.
    (BLIND) O-BLIND-MOVED: C_blind changes when M changes.
    (G) O-G-NOT-COMMON: a ratio changes when G is replaced by 2G.
    (N1) O-N1-GAP: forced N=1 produces a ratio other than 1.
    (MIS) O-MISMATCH: the two enumerations disagree.
    (DISC) O-WRONG-DISC: an enumeration used disc=-4*419 as N.
    (IMP) O-IMPEDIMENT: timeout/crash/infra; never mathematical negative.

    C is an instrument defined here, not a reproduction of a published bit
    figure. No quantum algorithm is run. No CSIDH-512 security level is stated.

  mechanism: >-
    Object frame from IDEA-20261005-1896e8. Tracked object is the pair of
    integers (N, M), not a Montgomery coefficient and not an isogeny-graph
    vertex. Sigma = {replace M, scale G}. Coordinate-dependent: the ratio
    is a function of the resource-model coordinate M and N, not of a hidden
    class-group element. Lossy projection retains only the cost ratio.
    The 2^{ceil(sqrt(n))} factor is a declared stand-in inside the
    KN-LIT-071 shape 2^{O(sqrt(log N))}; the O is not expanded.

  assumptions:
    - Discriminant is -419, not -4*419. A mismatch is O-WRONG-DISC, not a class-number result.
    - C and C_blind are the instrument above, not Peikert's simulator and not SQALE.
    - Both enumerations are exhaustive, not probabilistic samples.
    - Forced N=1 is a nearby-object control, not asserted to be the class number of -419.
    - Timeouts/crashes are O-IMPEDIMENT, never negative evidence.

  proof_search_map:
    not_applicable_reason: >-
      Control on one cost-model coordinate at one class number, not a proof
      of a hidden-shift algorithm or of a CSIDH security level. The four
      cheap audits still run as falsification aids.
    bottleneck: >-
      The step that decides whether the two probe evaluations differ is
      ceil(M_free/M) once N is fixed. Removing M removes the gap.
    baseline_embedding:
      parameter_slice: 'p=419, disc=-419, G in {1,2}, caps M=2 and M=M_free(N).'
      reproduction_check: >-
        Two reduced-form enumerations of disc=-419 return the same N, equal
        to the cardinality of the form set.
    observation_collision:
      observable: the ratio C(1,2)/C(1,M_free)
      distinct_preimage_search: >-
        Any other order with the same N yields the same ratio. The ratio is
        constant on N and is not a secret-key invariant.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the pair (N, M) at disc=-419
        predicted_gain: A yes/no separation of the memory cap at one certified N, with blind control at 1.
    quantifier_order: >-
      FORALL certified class numbers N of disc=-419 (there is one), EXISTS
      the derived M_free such that C(1,2)/C(1,M_free)>=2, and FORALL labels
      M in {2,M_free}, C_blind is independent of M. A single N with
      M_free<4 falsifies the separation.
    method_ceiling:
      strongest_certifiable_claim: >-
        Either the probe ratio at this prime is an integer >=2 and the blind
        control ratio is 1, or the certified N is too small for M=2 to bind.
        Neither outcome is a quantum security level.
      nearby_object_control: >-
        The same probe on forced N=1 (n=1, M_free=2) must return ratio 1.
        An implementation that reports a gap at N=1 is wrong.
    proof_obligations:
      - claim: The ratio depends on M only through ceil(M_free/M).
        responsibility: correctness
      - claim: Twin enumerations agree and every kept form has disc=-419 and is reduced.
        responsibility: correctness

  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        No random model is used. N is the cardinality of a finite set of
        reduced forms, and C is an integer function of (N,G,M).
      random_model_justification: >-
        The class number of a negative discriminant equals the number of
        reduced binary quadratic forms of that discriminant; the set is
        finite and the probe arithmetic is exact.
      supporting_results:
        - KN-LIT-071 (internal; 2^{O(sqrt(log N))} shape)
        - KN-TECH-051 (internal; memory-axis dispute, no security number)
      validation_experiment_ids:
        - EXP-CSIDH-999626
      falsification_condition: Twin enumeration disagreement or a claimed CSIDH-512 bit figure.

  structural_ingredients:
    - description: Positions 2 and 3 in KN-TECH-051 disagree on quantum-memory allowance, not on a quoted security number.
      citation: knowledge/techniques/KN-TECH-051.md
      provenance: internal
      verified_by: knowledge/techniques/KN-TECH-051.md
      role: memory-axis dispute; forbids citing a CSIDH security figure
    - description: Kuperberg sieve 2^{O(sqrt(log N))}; probe uses a fixed stand-in inside that shape.
      citation: knowledge/literature/KN-LIT-071.md
      provenance: internal
      verified_by: knowledge/literature/KN-LIT-071.md
      role: asymptotic shape; O not expanded
    - description: Concrete CSIDH quantum cost remains open.
      citation: knowledge/open-problems/KN-OPEN-014.md
      provenance: internal
      verified_by: knowledge/open-problems/KN-OPEN-014.md
      role: this idea does not close KN-OPEN-014

  reduction_chain:
    core_problem: toy memory-cap ratio at disc=-419
    corollaries: []

  predictions:
    - metric: C(G=1,M=2)/C(G=1,M=M_free)
      direction: higher
      minimum_effect: integer factor at least 2

  test_boundary:
    instances:
      - reduced forms of discriminant -419
    parameters:
      p: 419
      disc: -419
      G: [1, 2]
      M_labels: [2, M_free]
    implementation: experiments/EXP-CSIDH-999626/implementation/run.py
    budget:
      wall_clock_seconds: 600
      memory_gb: 1
      maximum_runs: 3

  falsification_conditions:
    - The two form enumerations disagree on N (O-MISMATCH).
    - The certified N gives M_free<4 (O-NO-BIND).
    - C_blind changes when M changes (O-BLIND-MOVED).
    - Either ratio changes when G is replaced by 2G (O-G-NOT-COMMON).
    - Forced N=1 produces a ratio other than 1 (O-N1-GAP).

  interpretation_limits:
    - A separation or failure at p=419 says nothing about CSIDH-512. RQ-CSIDH-64343f forbids a security-level verdict.
    - The probe is not KN-LIT-127's simulator and not KN-LIT-129's constrained sieve.
    - Failure because N is small is a statement about this prime, not that memory is irrelevant at large class numbers.
    - Hidden-shift query-exponent delta is 0. Discrete-log exponent delta is 0.

  novelty_status: adaptation
  dominated_by: >-
    KN-LIT-071's 2^{O(sqrt(log N))} dominates any reading of this probe as a
    faster algorithm; exponent delta is 0. Opened baselines that do not
    dominate the toy ratio: KN-TECH-051, KN-LIT-127, KN-LIT-129, KN-OPEN-014,
    KR-RHO-755e35.
  sota_delta: >-
    Hidden-shift query-exponent delta is 0. The quantity claimed to move is
    the probe cost ratio between M=2 and M=M_free at the certified class
    number of discriminant -419.
  cited_evidence: []
  amazon_bedrock: NOT SELECTED
