hypothesis:
  id: H-ECDLP-f9aa58
  question_id: RQ-JINV-8fc13a
  statement: >-
    The campaign's single most-cited cost measurement bearing on special
    j-invariants has no control. A SHAM system - a polynomial carrying a
    special-j SUPPORT PATTERN with GENERIC COEFFICIENT VALUES, which is not the
    summation system of any curve - occupies the fibre of the support map over a
    special-j support class at a generic point, so running it alongside the
    generic and the genuinely special systems under one paired protocol
    discriminates, BEFORE any interpretation, between a purely combinatorial
    support effect, a coefficient-value effect, and no effect at all. The
    hypothesis predicts the third: all three arms indistinguishable within the
    paired design's stated minimum detectable effect. Source proposal:
    IDEA-20260811-18bbf9.
  mechanism: >-
    Solver cost is a function of the ideal, and the ideal is determined by the
    coefficients, of which the support is a coarse shadow. If cost depended only
    on support, any system with the same support would cost the same and the sham
    would reproduce the special system exactly. If cost depended on finer
    structure - a factorisation, a singular locus, a non-generic Hilbert function
    - the sham would behave like the generic system, because deleting monomials
    at generic coefficients creates none of those. The experiment is therefore a
    direct fibre probe of the support map, and its outcomes correspond exactly to
    the three places the dependence could live.
  assumptions:
    - >-
      Deleting a coefficient block leaves a zero-dimensional ideal of the same
      degree in the membership-bearing formulation. THIS IS AN INVALIDATION RULE
      CHECKED PER ARM, not an assumption to be carried: if the sham ideal has a
      different dimension or degree from the generic arm, it is not a valid null,
      the cell is dropped, and the drop is reported.
    - >-
      That the execution host can run a timing experiment honestly. A committed
      decision records load averages above 43 on a 14-core host at two probes and
      states that a statistical contract cannot be run honestly at that
      oversubscription. THIS IS A TIMING CONTRACT AND IS THEREFORE GATED ON HOST
      LOAD; a degraded run is an infrastructure event and never a null result.
      This design session did NOT open that decision record and the experiment
      must read the recorded load figures and the threshold from it rather than
      from the source proposal.
    - >-
      That both the membership-free and the membership-bearing formulations are
      run and reported separately, because the deployed system's solving degree is
      pinned by the factor-base size in one of them and only the other is a curve
      functional.
    - >-
      That the committed timing pair is reproducible at the configuration where
      it was measured. VERIFIED BY THIS DESIGN SESSION: the pair is recorded in a
      red-team notes file as coming from a run at p = 1009, reading verbatim
      "j0: gb_seconds ratio = 0.9956 (-0.44%) gb_size ratio = 1.0102 (+1.02%)
      ... S_3 support 9 vs 13 (-30.8%) n_curves=6" and "j1728: gb_seconds ratio =
      0.9933 (-0.67%) gb_size ratio = 1.0341 (+3.41%) ... S_3 support 10 vs 13
      (-23.1%) n_curves=4". THE SOURCE PROPOSAL'S MINIMAL TEST PROPOSES p = 4001,
      WHICH IS NOT WHERE THE COMMITTED PAIR LIVES; the reproduction gate must
      therefore be run at p = 1009 before any p = 4001 arm is interpreted.
  proof_search_map:
    bottleneck: >-
      The missing control on the campaign's single most-cited cost measurement.
      Without it, "support does not project onto cost" is an observation about
      one pair of numbers rather than a controlled result.
    baseline_embedding:
      parameter_slice: >-
        The generic arm at m = 3 with the committed factor-base configuration AT
        p = 1009, which is the configuration the committed pair was measured at.
        The contract must reproduce the committed relative figures - -0.44
        percent, -0.67 percent and +3.41 percent - within the stated run-to-run
        variability before any sham arm is interpreted.
      reproduction_check: >-
        A frozen regression fixture: re-run the committed j = 0 versus generic
        pair on the same code path at p = 1009 and confirm the SIGN and ORDER OF
        MAGNITUDE. If the pair cannot be reproduced, the timing instrument has
        drifted and no comparison is admissible.
    observation_collision:
      observable: 'Groebner solve time, basis size, and a solving-degree proxy.'
      distinct_preimage_search: >-
        PERFORMED. Two very different systems can share a solve time by accident,
        which is why the design is PAIRED over seeds and reports a distribution
        rather than a point estimate. More seriously, the campaign's own
        maximum-degree observable is annotated in its source as a PROXY and NOT a
        degree of regularity, so the degree observable is known to collide with
        the quantity it is named after. The contract must report it under its true
        name and must not infer a degree of regularity from it. This design
        session did not open that source and the run must confirm the annotation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the support map - hold support fixed, vary coefficients.
          The sham and the special system are two points of one fibre; the
          generic system is a point of a different fibre.
        predicted_gain: >-
          Turns an uncontrolled anomaly into a three-way discrimination with a
          pre-registered reading for each branch, plus the campaign's first
          stated minimum detectable effect for a Groebner cost comparison.
    quantifier_order: >-
      FOR ALL degeneration loci and FOR ALL generic curves, the solve cost of the
      sham arm equals the solve cost of the generic arm within the stated band.
      The existential that breaks it is THERE EXISTS a locus and a generic curve
      where the sham costs measurably less. NOTE THE QUANTIFIER OVER CURVES: the
      design must use SEVERAL generic curves, not one, or the quantifier is
      untested.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at the tested prime, decomposition length, factor-base
        configuration, monomial order, engine and budget, the three arms are
        indistinguishable at the stated detectable effect size. It CANNOT certify
        that no cost effect exists at other parameters, and the record must report
        the MINIMUM DETECTABLE EFFECT rather than claiming absence.
      nearby_object_control: >-
        A system with a genuinely smaller solving degree - for example one
        factor-base polynomial of lower degree. Running it and confirming the
        pipeline sees a difference is the method's sensitivity floor and is a
        BLOCKING control.
    proof_obligations:
      - claim: The sham ideal has the same dimension and degree as the generic arm
        responsibility: interface
      - claim: The three arms are indistinguishable at the stated band
        responsibility: success_probability
      - claim: The pipeline detects a planted genuine cost difference at each planted size
        responsibility: interface
      - claim: The committed j = 0 pair reproduces at the prime where it was measured
        responsibility: baseline
      - claim: Nothing measured on the sham is stated as a fact about elliptic curves
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-SHAM-1
      formal_statement: >-
        A polynomial obtained from the summation polynomial by deleting a
        coefficient block, with the remaining coefficients generic, behaves
        computationally like a random member of its support class - in particular
        its ideal is zero-dimensional of the same degree as the generic one in
        the membership-bearing formulation.
      random_model_justification: >-
        In the membership-bearing formulation the two univariate membership
        polynomials already generate a zero-dimensional radical ideal in shape
        position, and the summation polynomial only cuts it down, so
        zero-dimensionality is STRUCTURAL rather than heuristic there. The
        heuristic part is only that the DEGREE is unchanged.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-092f48
      falsification_condition: >-
        A sham cell whose ideal dimension or degree differs from the generic arm.
        Any such cell is DROPPED AND COUNTED, never silently retained, and if
        most cells at a deletion size fail, the null is not valid at that
        deletion size and those arms are dropped.
    - id: HEUR-SHAM-2
      formal_statement: >-
        Paired Groebner timings at fixed input are log-normally distributed with
        a run-to-run coefficient of variation small enough that the declared seed
        count detects the declared band shift at the declared power.
      random_model_justification: >-
        No theorem. This is an empirical assumption about the instrument and the
        campaign has never measured it. It is stated as a heuristic precisely
        because the record's whole value rests on the achieved power.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-092f48
      falsification_condition: >-
        The pilot arm's measured coefficient of variation implies a minimum
        detectable effect exceeding the declared band. The band is then WIDENED
        BEFORE the main run and the widening is recorded; it is never adjusted
        afterwards.
  structural_ingredients:
    - description: >-
        The committed uncontrolled timing pair this experiment supplies a control
        for, quoted verbatim from the committed red-team notes: "j0: gb_seconds
        ratio = 0.9956 (-0.44%) gb_size ratio = 1.0102 (+1.02%) trivial_frac
        ratio = 0.9714 (-2.86%) S_3 support 9 vs 13 (-30.8%) n_curves=6" and
        "j1728: gb_seconds ratio = 0.9933 (-0.67%) gb_size ratio = 1.0341
        (+3.41%) trivial_frac ratio = 0.9429 (-5.71%) S_3 support 10 vs 13
        (-23.1%) n_curves=4", both attributed in that file to a run at p = 1009.
      citation: coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
      provenance: internal
      verified_by: >-
        Coordinator subagent under TASK-20260904-43152a located and read these
        lines by pattern search in that file on 2026-09-04 and reproduces them
        verbatim above. The source proposal's characterisation of the pair is
        CONFIRMED faithful on every figure it cites (-0.44, -0.67, +3.41, -30.8,
        -23.1 percent). THE READ ALSO ESTABLISHED that the pair comes from a
        p = 1009 run, which the source proposal does not state and which matters
        because its minimal test proposes p = 4001; that discrepancy is recorded
        in assumptions and drives the reproduction gate's parameter choice. The
        read was by pattern match over that file, not a full-file read, so no
        other section of it is asserted here.
      role: >-
        Supplies the baseline the reproduction gate must hit before any sham arm
        is interpreted, and the effect sizes the pre-registered bands are set
        wider than.
  reduction_chain:
    core_problem: >-
      Whether the observed near-zero timing change at special j-invariants means
      "support does not matter" or "support matters but was cancelled by
      something else", which are different explanations with different
      consequences.
    corollaries: []
  predictions:
    - metric: >-
        paired ratio of Groebner solve time, sham over generic (dimensionless,
        from per-seed solve times in nanoseconds)
      direction: different
      minimum_effect: >-
        Within plus or minus 3 percent with a 95 percent paired confidence
        interval containing 1.000. PRE-REGISTERED AS NO DIFFERENCE. The 3 percent
        band is chosen a priori to be wider than the committed -0.44 and -0.67
        percent effects and is an UNTESTED TOLERANCE, stated as such; the pilot
        arm may widen it before the main run.
    - metric: >-
        paired ratio of Groebner solve time, special over generic (dimensionless)
      direction: different
      minimum_effect: >-
        Within plus or minus 3 percent, pre-registered as NO DIFFERENCE, and
        expected to reproduce the committed sign - slightly negative at j = 0.
    - metric: 'paired ratio of basis size, sham over generic (dimensionless, basis element counts)'
      direction: different
      minimum_effect: >-
        Within plus or minus 6 percent, pre-registered as NO DIFFERENCE. The band
        is wider because the committed basis-size effect at j = 1728 was +3.41
        percent - the opposite sign to the timing effect and larger - so the
        quantity is known to be noisy or structurally unrelated to support.
    - metric: 'ideal dimension and degree equality across arms (integers, exact)'
      direction: different
      minimum_effect: >-
        EXACT EQUALITY required for a cell to be admissible. Any inequality
        invalidates that cell of the sham arm; the count of invalidated cells is
        reported and is itself informative about how violent the deletion is.
    - metric: >-
        sensitivity-control detection at four planted effect sizes
        (dimensionless detection probability per planted size)
      direction: higher
      minimum_effect: >-
        Detection probability must RISE MONOTONICALLY across planted effect sizes
        of approximately 1, 3, 10 and 30 percent and must reach 1.0 at the
        largest. A flat-at-zero curve means the instrument is blind and every
        null in this record is void; a flat-at-one curve at the smallest planted
        size means the band is far too wide and must be restated.
  test_boundary:
    instances:
      - 'ARM-G: the summation system of a generic curve, untouched.'
      - 'ARM-S: THE SHAM - the same system with exactly the monomials of a degeneration block deleted, generic coefficients elsewhere. Not the system of any curve.'
      - 'ARM-X: the summation system of a genuine curve on the degeneration locus at the same prime.'
      - 'The committed p = 1009 configuration, for the reproduction gate only.'
    parameters:
      reproduction_gate_prime: 1009
      main_arms_prime: 4001
      m_values: '3 primary; 4 only for the two largest deletion blocks, memory permitting'
      generic_curves_per_cell: 5
      factor_base_densities: 'at least 3, bracketing 1/m! which is about 0.167'
      seeds_per_arm: 20
      monomial_orders: 2
      formulations: 'membership-free and membership-bearing, reported in separate tables'
    implementation: >-
      The campaign's existing solve pipeline, with identical factor bases,
      identical targets, identical monomial order and identical budget across
      arms, paired over seeds, gated on host load read from a bound source.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 24
      maximum_memory_gb: 16
      maximum_runs: 6
  falsification_conditions:
    - >-
      The sensitivity control is not detected at the largest planted effect size.
      The instrument is blind, the run is INVALID, and no null may be reported.
    - >-
      OUTCOME A - the sham and the special arm agree with each other and differ
      from the generic arm beyond the band. Support is the whole story and the
      lane should chase support after all.
    - >-
      OUTCOME B - the sham agrees with the generic arm and the special arm differs
      beyond the band. A coefficient-value effect exists that support cannot
      explain, pointing at reducibility or singular structure.
    - >-
      OUTCOME D - the sham differs from BOTH. The sham is not a valid null, most
      likely because deleting coefficients changed the dimension or degree of the
      ideal; the run is INVALID rather than informative and the dimension check
      catches it before interpretation.
    - >-
      The sham ideal's dimension or degree differs from the generic arm in most
      cells. The null is not valid at that deletion size and those arms are
      dropped, retaining only the small-block ones.
    - >-
      The committed j = 0 pair does not reproduce at p = 1009. The instrument has
      drifted and the whole comparison is inadmissible.
    - >-
      Host load exceeds the declared threshold. Infrastructure receipt, never a
      result.
  interpretation_limits:
    - >-
      Scoped to the tested prime, decomposition length, factor-base
      configuration, monomial order, engine and budget. A null is a BOUND AT THE
      STATED DETECTABLE EFFECT, never an absence.
    - >-
      ARM-S IS NOT A CURVE. Nothing measured on it is a statement about elliptic
      curves. It solves no ECDLP instance, its solutions are not decompositions,
      and only its COST is comparable - any correctness statistic computed from it
      is void by construction and the contract forbids computing a decomposition
      rate on it.
    - >-
      DECLARED IN ADVANCE: if ARM-S reproduces ARM-X's cost signature, the effect
      is a combinatorial support effect that a curve-free object reproduces, and
      NOTHING measured may be quoted as a statement about elliptic curves or the
      ECDLP. That is OUTCOME A and it is a curve-free explanation, not a curve
      result.
    - >-
      Claim tier toy. No attack, no exponent, no speedup, and the delta against
      every row of the attack frontier is zero.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SHRUNK: whether
      special-j support affects solve cost at cryptographic p cannot be tested
      here or by any reachable extension of this design. The comparison is at
      p = 1009 and p = 4001, and the record asserts nothing beyond those.
    - >-
      The campaign's maximum-degree observable is a PROXY and not a degree of
      regularity by its own source annotation. It is reported under its true name
      and no degree of regularity is inferred from it.
    - >-
      GOAL BINDING VERIFIED 2026-09-04. An earlier draft of this record reported
      GOAL-ENDO-001 as absent; that was a lookup error against the sharded
      layout. The record is at ledger/goals/GOAL-ENDO-001/goal.yaml, carries
      `status: active`, and lists RQ-JINV-8fc13a among its fourteen lane
      questions. This hypothesis sits in lane L3 of
      analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md,
      "j-invariant special values and CM discriminant size", declared "Resource
      R2, R3" - read verbatim.
    - >-
      L3's declared OBSTRUCTION TO BEAT binds this hypothesis and is quoted
      verbatim: "KN-TECH-018: the automorphism discount is a constant `<=
      sqrt(6)`, never an exponent. Any claim here must exceed that or be labelled
      as baseline calibration." Nothing in this hypothesis exceeds it and nothing
      claims to; any timing difference at or below that factor is baseline
      calibration by the lane's own rule, not a finding.
    - >-
      GOAL-LEVEL OBLIGATION C4 BINDS AND IS DISCHARGED BY THIS DESIGN, quoted
      verbatim: "Every instrument used to support any conclusion has passed both
      directions of its RQ-INSTR-f8faa0 control: it detects a planted signal and
      it rejects a matched null." The planted-signal direction is the four-level
      sensitivity ladder; the matched-null direction is the sham arm. Passing
      both is this instrument's C4 discharge and is reported as such.
    - >-
      GOAL-LEVEL PAUSE CONDITION P1 BINDS, quoted verbatim: "The instrument fails
      its RQ-INSTR-f8faa0 two-directional control. Measurement stops until the
      instrument is repaired under a new contract; existing measurements taken
      with the failed instrument are marked attempted_and_inconclusive, never
      negative evidence." A blind sensitivity ladder is therefore a goal-level
      pause, not merely a void run. P3 also binds: any apparent excess over the
      automorphism-discounted rho baseline pauses work for an independent
      review-adversarial session before any record states it, and for
      review-breakthrough at max effort before any record calls it a break.
  status: proposed
  proposed_by: coordinator
  source_refs:
    - ledger/proposals/IDEA-20260811-18bbf9.yaml
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
