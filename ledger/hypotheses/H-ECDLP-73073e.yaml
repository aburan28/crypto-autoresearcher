  statement: >-
    The integer 17 has bit length 5. Its bits are 1, 0, 0, 0, and 1.
    Reaching it by doubling and adding uses 4 doublings and 1
    addition. Five exceeds four by 1. Four exceeds one by 3. The
    product of 5, 4, and 1 is 20. Their sum is 10. Two readings of
    the addition count are both 1, so that gap is 0 and their
    product is 1.
  mechanism: >-
    The proposal writes the counts 5, 4, and 1. This contract
    checks those integers. It does not add a curve point.
