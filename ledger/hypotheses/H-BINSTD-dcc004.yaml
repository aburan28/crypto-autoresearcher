# =============================================================================
# H-BINSTD-dcc004 -- block/Krylov-Wiedemann vs dense GE on toy sparse GF(2)
# matrices. Specified from IDEA-20261002-79a077 under RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001. Approved DEC-20261003-3ff445. ZERO RUNS in this design
# packet. Stages 0-2 authorized. No AUXIN. No Bedrock. No Magma/Sage.
# No curve attack / exponent claim. Distinct from 7def74 / 9ff676 / 9d8520.
# =============================================================================
hypothesis:
  id: H-BINSTD-dcc004
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-79a077
  experiment_id: EXP-BINSTD-4c6404
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-3ff445
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-3ff445
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-3ff445
  proposed_by: coordinator

  title: >-
    At frozen surplus and sparsity, does Krylov/Wiedemann beat dense GE on
    toy binary IC-like relation matrices (n∈{17,23,31})?

  statement: >-
    CLAIM (heuristic_validation / LA-solver instrument; NO ATTACK; NO
    EXPONENT). FORALL admitted toy cells n∈{17,23,31} and surplus
    s∈{1.5,2.0}×r(n): over N_rep=7 seeded full-rank square GF(2) operators
    obtained by XOR-folding a surplus-s sparse generator of odd row-weight
    5 onto r(n)∈{32,48,64} columns, the ratio
    R := median(wall_Wiedemann) / median(wall_dense) satisfies R ≤ τ with
    τ=1.0 frozen at Stage 0 — OR the race fails and is recorded as
    dense-GE-still-cheaper at this scale (O-FAIL-BAND). Both arms are
    pure-Python GF(2) arithmetic on identical packed row bytes. Dual
    median aggregators must agree. Distinct from IDEA-20261002-7def74
    (nnz fill-in band, not solver race), 9d8520 (orphans), and 9ff676
    (orbit-unique yield). NO break. NO n≥131 transfer. CLAIM TIER:
    heuristic_validation.

  mechanism: >-
    OBJECT FRAME. Representation: square GF(2) operator A of size r(n)
    obtained from a surplus-s sparse (0,1)-matrix with frozen odd row-weight
    5 (IC-like exact-weight rows vs Bernoulli-null of matched mean weight).
    Operation A: Krylov/Wiedemann reconstruction of A x = b (sparse matvec
    + Krylov dependence). Operation B: bit-packed dense Gaussian elimination
    on the same packed rows. Observable: wall-time ratio R at each (n,s).
    Trichotomy: Class I instrument (LA solver race on fixed matrices).
    Lossy-projection: R discards which rows caused pivots; null is a matched
    Bernoulli sparse matrix with the same shape/weight band. OFF-LIMITS:
    nnz fill-in without a solver race (7def74); relation yield; PDP engine
    races; Magma/Sage/AUXIN. WHAT IS NEW: a frozen τ=1.0 race of
    Python Krylov/Wiedemann vs Python dense GE on RQ-BINSTD toy matrices.

  novelty_status: unverified
  assumptions:
    - Frozen r(n), surplus schedule, τ=1.0, N_rep=7, seeds, odd row-weight 5.
    - Both solvers implemented in experiments/EXP-BINSTD-4c6404/implementation/gf2la.py.
    - Same matrix bytes for both solvers; no post-hoc sparsification.
    - R ≤ τ ≠ practical binary IC (KR-IC-1fcdbc).
    - Dual independent median aggregators must agree before a band verdict.
    - No Magma/Sage/AUXIN/Bedrock.

  predictions:
    - metric: wiedemann_over_dense_median_wall_ratio
      direction: upper_bounded
      minimum_effect: '≤ τ=1.0 at each (n,s) cell'
    - metric: matrix_nnz
      direction: recorded
      minimum_effect: 'nnz band logged; no post-hoc edit'
    - metric: null_random_sparse_ratio
      direction: comparable
      minimum_effect: 'null race reported beside IC-like matrices; interval [0.25, 4.0]'
    - metric: dual_median_agreement
      direction: same
      minimum_effect: 'median_sort == median_insert on every scored arm'

  test_boundary:
    instances:
      - 'Stage 0: freeze r(n), surplus, τ=1.0, N_rep, seeds, weight, solver pin'
      - 'Stage 1 authorized: n=17, s∈{1.5,2.0} IC-like races'
      - 'Stage 2 authorized: n∈{23,31} IC-like + Bernoulli-null'
    parameters:
      tau: 1.0
      n_rep: 7
      row_weight: 5
      surplus: [1.5, 2.0]
      r_n: {17: 32, 23: 48, 31: 64}
      catalog_seed: 2026100307
      pin_seed: 2026100308
      null_seed: 2026100309
      null_ratio_interval: [0.25, 4.0]
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-4c6404/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Dual clocks (perf_counter, monotonic) and dual medians (sort vs insert).
      No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 36000
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      R > τ=1.0 at a completed (n,s) cell (O-FAIL-BAND /
      dense-GE-still-cheaper).
    - Editing τ after seeing ratios (protocol invalid).
    - Changing matrix bytes between solvers (protocol invalid).
    - Claiming practical binary IC or an exponent move from a toy LA race.
    - Equating this race with nnz fill-in (7def74) without wall-time.
    - Transferring the band to n≥131 without a new contract.
    - Using Magma/Sage/AUXIN/Bedrock as a success path.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        ≥5 successful full-rank races per required (n,s) cell; dual medians
        agree; R ≤ 1.0 on every completed authorized IC-like cell; Stage-2
        null ratios in [0.25, 4.0]. Toy LA-solver band holds. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Dual medians agree; ≥5 successes per required cell; R > 1.0 on at
        least one completed IC-like cell (dense-GE-still-cheaper).
    - id: O-NULL-FAIL
      meaning: >-
        Stage-2 IC-like timings complete but a null-cell ratio lies outside
        [0.25, 4.0]; meter not separated from generator artifact.
    - id: O-INCONCLUSIVE
      meaning: >-
        Fewer than 5 full-rank successful races on a required cell; band not
        read as support/fail.
    - id: O-ARTIFACT
      meaning: >-
        Dual-median disagreement, combinadic disagreement, Ax≠b, or freeze
        regression. No band claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Timeout, crash, or missing Stage-0 freeze. Infrastructure; never
        negative evidence against H-BINSTD-dcc004 / HEUR-BINSTD-79a077-H1.
        (Python solvers are present in-repo; this label is for infra only.)
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze twins agree; no scientific timing yet.

  interpretation_limits:
    - Wall-time race only; correctness is self-checked by Ax=b, not an ECDLP certificate.
    - Python interpreter overhead dominates r≤64; a Wiedemann loss at toys does not refute sparse-LA practice at cryptographic scale.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - Surplus is XOR-folded onto a square operator; it is not a live relation collector from a Koblitz curve.

  heuristic_assumptions:
    - id: HEUR-BINSTD-79a077-H1
      formal_statement: >-
        FORALL n∈{17,23,31} and s∈{1.5,2.0}: median(wall_Wiedemann) /
        median(wall_dense) ≤ τ=1.0 over N_rep=7 seeded full-rank square
        builds of size r(n) with frozen odd row-weight 5.
      random_model_justification: >-
        Rigorous: sparse iterative methods have cost linear in nnz·Krylov
        length when early termination occurs; dense GE is Θ(r³) bit ops.
        Classical: at Python toy r≤64, interpreter/Krylov-overhead can
        dominate, so the τ=1.0 band is a pre-registered transfer hypothesis
        that can fail honestly at toys — not a claim that IC beats rho.
      supporting_results:
        - KR-IC-ae532f
        - KR-IC-1fcdbc
        - KR-IC-9e610d
      citations:
        - ref: KR-IC-ae532f
          provenance: retrieved
          claim: Practical IC pipelines use sparse LA; no frozen Wiedemann/GE race here.
          verified_by: IDEA-20261002-79a077 frontier_map rows_checked (build_frontier_map.py).
        - ref: KR-IC-1fcdbc
          provenance: retrieved
          claim: Binary summation stays slower than rho; a toy LA race ≠ beat-rho.
          verified_by: IDEA-20261002-79a077 frontier_map rows_checked (build_frontier_map.py).
        - ref: KR-IC-9e610d
          provenance: retrieved
          claim: Survey consensus — no practical IC at deployed sizes.
          verified_by: IDEA-20261002-79a077 frontier_map rows_checked (build_frontier_map.py).
      validation_experiment_ids:
        - EXP-BINSTD-4c6404
      falsification_condition: >-
        R > τ=1.0 at a completed (n,s) cell (dense-GE-still-cheaper), OR
        <5 successful races (O-INCONCLUSIVE), OR dual-median/Ax=b failure
        (O-ARTIFACT). Infrastructure timeout is O-IMPEDIMENT, never
        negative evidence.

  structural_ingredients:
    - description: Practical IC pipelines include a sparse linear-algebra step
      citation: KR-IC-ae532f
      provenance: retrieved
      verified_by: IDEA-20261002-79a077 frontier_map
      role: existence of sparse-LA as the compared folklore
    - description: Binary IC remains slower than rho at practical sizes
      citation: KR-IC-1fcdbc
      provenance: retrieved
      verified_by: IDEA-20261002-79a077 frontier_map
      role: scope ceiling — toy race is not beat-rho

  asymptotic_claim: null

  dominated_by: >-
    CHECKED KR-IC-ae532f / classical sparse-LA practice dominates as the
    existence of Wiedemann-style solvers; this record only adds a frozen
    τ=1.0 race against dense GE on RQ-BINSTD toy matrices.

  sota_delta:
    time: n/a — no attack
    memory: n/a
    data_queries: >-
      First pre-registered τ=1.0 Python dual-route race of Krylov/Wiedemann
      vs dense GE on RQ-BINSTD toy relation-shaped matrices, separated from
      nnz fill-in bands.

  proof_search_map:
    bottleneck: >-
      Whether Krylov/Wiedemann median wall time is ≤ dense GE median wall
      time at (n,s)∈{17,23,31}×{1.5,2.0} on frozen sparse GF(2) squares, or
      whether Python/Krylov overhead leaves dense GE cheaper at toys.
    baseline_embedding:
      parameter_slice: >-
        r(17)=32, r(23)=48, r(31)=64; surplus {1.5,2.0}; row-weight 5;
        τ=1.0; N_rep=7; catalog_seed 2026100307 written before any timing.
      reproduction_check: >-
        Independent check.py recomputes dual medians and combinadic twins;
        refuses τ≠1.0 after freeze; refuses band outcomes without admitted
        Python solvers; Ax=b is checked in-run before a race is scored.
    observation_collision:
      observable: 'median wall-time ratio R = t_Wiedemann / t_dense'
      distinct_preimage_search: >-
        A cheap-looking R could be (i) sparse-vs-dense structure (claim) or
        (ii) a generator/Python artifact. Separated by identical matrix
        bytes, dual clocks, dual medians, and Stage-2 Bernoulli-null of
        matched shape/weight whose ratio is recorded in [0.25, 4.0].
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Frozen τ=1.0 band + dual median aggregators + pure-Python dual
          GF(2) solvers (Krylov/Wiedemann vs bit-packed dense GE).
        predicted_gain: >-
          A decidable support/fail/null/artifact label for HEUR-BINSTD-79a077-H1
          at toys.
    quantifier_order: >-
      FORALL cells (17|23|31, s∈{1.5,2.0}): R ≤ 1.0 is PREDICTED on
      completed cells. NOT CLAIMED: n≥131; any exponent; any ECDLP solve;
      Magma/Sage equivalence; 7def74 nnz band.
    method_ceiling:
      strongest_certifiable_claim: >-
        On named toy cells, the τ=1.0 wall-time band decides support/fail
        with dual-median agreement, Ax=b self-checks, and a Stage-2 null.
      nearby_object_control: >-
        Dual-median/combinadic disagreement (O-ARTIFACT); <5 successes
        (O-INCONCLUSIVE); Bernoulli-null ratio outside [0.25,4.0]
        (O-NULL-FAIL); infra timeout (O-IMPEDIMENT).
    proof_obligations:
      - claim: Dual median aggregators agree on every scored arm.
        responsibility: baseline
      - claim: Combinadic twins agree on the frozen n-catalog.
        responsibility: baseline
      - claim: τ=1.0 is frozen before any scientific timing.
        responsibility: baseline
      - claim: Both solvers receive identical packed row bytes (matrix_sha256).
        responsibility: correctness
      - claim: Ax=b holds for every scored race.
        responsibility: correctness
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
