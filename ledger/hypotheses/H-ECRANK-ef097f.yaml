hypothesis:
  id: H-ECRANK-ef097f
  title: >
    The degree-8 rung with the base curves that now exist: separability of the
    coset sum from the base rank, measured rather than assumed
  status: specified
  question_id: RQ-ECRANK-27dcc5
  goal_id: GOAL-ECRANK-002
  converts_idea: IDEA-20260829-173a32
  recorded_at: '2026-09-09'
  designed_by: TASK-20260909-a4da3d
  statement: >
    Given the committed high-rank base curves - certified rank exactly 12
    over Q for the EV-ECQ-0d142e pencil curve, the two certified rank-13
    Mestre pool curves, a deterministic sample of certified rank-12 and
    rank-11 pool curves, plus a matched rank-3/4 arm drawn from the
    committed 502-curve pool - and given the k = 3 and k = 4 coset
    optimisation of H-ECRANK-f2a2f7, reproduced exactly on the committed
    degree-8 control before any new number is believed, the quantity that
    decides the degree-8 question is not the base rank but the
    SEPARABILITY of the non-maximal-class contribution T_k from it.
    Pre-registered: P1, the best k = 3 total over the frozen search space
    lands in the interval [26, 30], i.e. base rank transfers into the
    coset sum but the total still falls short of 31; P2, the separability
    slope beta of T_3 on base rank is not distinguishable from 0, with a 95
    percent interval excluding |beta| > 1; P3, a finite base rank R* with a
    bootstrap interval is derived from the measured coset structure as the
    base rank that would be needed for a k = 3 total of 31 - the number
    GOAL-ECRANK-002 completion criterion C2 names; P4, the best k = 4
    total reaches at least 38 against the committed 32. Every reported
    total is a lower bound twice over: only exhibited points count, and a
    censored twist contributes zero.
  mechanism: >
    For K the multiquadratic field attached to a subgroup V of
    Q*/(Q*)^2 of order 2^k, rank E(K) = sum over d in V of rank E^(d)(Q)
    is an EXACT decomposition, with the d = 1 term being rank E(Q).
    Points from distinct classes are Z-independent by the character
    argument (distinct isotypic components of the Q[Gal(K/Q)]-module), so
    no metric input is needed across classes; only within a class does
    multiplicity require a separate independence certificate, and the
    certificate kind is recorded per class with the rung carrying the
    weakest kind used. Write T_k(E, V) = sum over the 2^k - 1 non-identity
    classes of V of rank E^(d)(Q). Two mechanisms pull in opposite
    directions and the experiment separates them: (A) INDEPENDENCE, a
    generic quadratic twist has its own Mordell-Weil group with no
    structural link to E(Q), so T_3 is about 16 for ANY base and the
    rank-13 total at k = 3 is about 29, short of 31 by about 2; (B)
    COUPLING, high base rank is bought with small conductor-to-height
    ratio or a special fibration that correlates with the local data
    driving twist ranks, in which case T_3 shifts with the base and the
    estimate is wrong in a direction the experiment reports. The tracked
    object is the COSET RANK VECTOR - the map from a subgroup V of order
    2^k to the integer vector (certified rank E^(d)(Q))_{d in V}, read as
    a function of the base curve E. The prediction interval of P1 and the
    extrapolation of P3 rest on the numbered heuristics HA-1 (separability)
    and HA-2 (product classes generic); no certified total depends on
    either, since every total is a sum of unconditional exhibited-point
    lower bounds.
  assumptions:
  - >
    Every rank entering a coset sum is an UNCONDITIONAL LOWER BOUND from
    exhibited points on the exact twist, re-verified on-curve in exact
    rational arithmetic by a verifier that did not find the point. No
    analytic rank, no Selmer bound, no BSD.
  - >
    Twists whose descent hits the alarm contribute ZERO to every coset
    sum and are counted as timed_out, never as rank 0. A censored twist
    biases every reported total DOWNWARD, so every reported total is a
    lower bound in a second, independent sense.
  - >
    Within-class multiplicity is certified by the committed regulator
    discipline (Neron-Tate heights, weakness labelled, no singular
    regulator found in the committed ladder) because the exact F_l
    reduction route of IDEA-20260829-d53906 is not yet validated
    (proposal status proposed, no experiment references it as of this
    design). The certificate kind is recorded per class, never averaged
    over the certificate.
  - >
    The base curves are used as committed. This hypothesis runs NO new
    search for high-rank curves over Q; it consumes the ones already
    certified in highrank_pool.json and certified_curves.json.
  predictions:
  - id: P1
    metric: >
      best k = 3 total (rank certified over a degree-8 multiquadratic
      field) over the frozen search space, with the committed rank-12 and
      rank-13 base curves and the frozen support, both columns, exact and
      regulator-assisted
    direction: >
      increase over the committed 20, but FALL SHORT of 31
    minimum_effect: >
      total in the interval [26, 30]. Below 26 means the base rank did
      not transfer at all and separability fails downward; 31 or above
      would be a new Pareto point and falsifies the prediction in the
      valuable direction.
  - id: P2
    metric: >
      the separability slope beta in an OLS regression of T_3 (the sum
      over the 7 non-identity classes of the best order-8 coset per base)
      on the committed certified base rank, across the 32 frozen bases of
      rank 3, 4, 11, 12 and 13, same frozen support
    direction: >
      beta not distinguishable from 0
    minimum_effect: >
      |beta| < 0.5 twist-rank units per unit of base rank, with a 95
      percent interval excluding |beta| > 1.0. A beta of 1.0 or more
      would mean each unit of base rank buys another unit somewhere in
      the coset, which would change the entire degree-lowering calculus.
  - id: P3
    metric: >
      R*, the base rank that would be needed for a k = 3 total of 31,
      derived from the measured coset structure (GOAL-ECRANK-002
      completion criterion C2)
    direction: >
      a finite number is produced, with an error bar
    minimum_effect: >
      the estimate is reported with a bootstrap interval over cosets
      whose width is under 6 rank units. An interval wider than that
      means the coset population is too heterogeneous for the
      extrapolation and the honest output is the heterogeneity, not the
      extrapolation.
  - id: P4
    metric: >
      best k = 4 total (degree-16 field) with the new bases, both
      columns, against the committed 32
    direction: increase
    minimum_effect: >
      at least 38. The committed rung is 32 from a rank-4-class base;
      adding about 9 of base rank should carry through at k = 4 if
      separability holds. Failure to move at k = 4 while k = 3 moves
      would be internally inconsistent and indicates a pipeline defect
      rather than a result.
  test_boundary: >
    32 frozen base curves (2 certified rank 13, 1 certified rank 12
    pencil curve plus 9 certified rank 12, 10 certified rank 11, all from
    the committed highrank_pool.json in file order, plus the EV-ECQ-0d142e
    pencil curve from certified_curves.json, plus a matched arm of 2 rank
    4 and 8 rank 3 curves from the committed 502-curve pool in file order
    including the committed degree-8 control base). The frozen support
    S = {-1, 2, 3, 5, 7, 11, 13} gives 127 nontrivial squarefree classes;
    the frozen search space is the FULL enumeration of all 11,811
    order-8 subgroups and all 11,811 order-16 subgroups of the F_2^7
    class space, per base. Descent alarm 30 s for the primary arm, 240 s
    on a frozen 11-class subsample for the censoring arm, 20 s for the
    regression control on the committed control base. Out of boundary:
    every larger support, every alarm, every base outside the frozen
    set, every d beyond the frozen squarefree kernels, and any statement
    about rank over Q. A shortfall at k = 3 is a property of this frozen,
    enumerated search space and this alarm budget; it is never a proof
    that degree 8 is unreachable, and the record must state the
    enumerated denominator wherever the shortfall appears.
  falsification_conditions:
  - >
    The regression control fails to reproduce the committed k = 3
    control (per-class profile and best total 20) on the committed
    control base and support. Everything downstream is unreadable until
    fixed; the affected runs are invalid.
  - >
    P1 fails upward: a k = 3 total of 31 or more is certified. That is a
    new Pareto point at degree 8 and the prediction was wrong in the
    direction the programme wants; it must then survive the full
    independent-verifier and null-object battery before it is stated
    anywhere, and the C1 question becomes live.
  - >
    P1 fails downward: the best k = 3 total with a rank-13 base is at or
    below the committed 20 from a rank-4 base. Then base rank does NOT
    transfer into the coset sum at all, separability is false in the
    surprising direction, and the entire premise of GOAL-ECRANK-002's
    resume condition is refuted.
  - >
    P2 fails: |beta| exceeds 1.0 with the interval excluding 0. Then
    coset totals are coupled to base rank and every extrapolation in
    H-ECRANK-f2a2f7 must be recomputed.
  - >
    The timeout rate on the new base curves exceeds 80 percent, making
    every total a censored lower bound of unknown depth. That is an
    INFRASTRUCTURE outcome, not a mathematical negative, and it
    invalidates P1 and P3 rather than settling them.
  heuristic_assumptions:
  - id: HA-1
    statement: >
      Fix a base curve E/Q and let d range over the squarefree integers
      supported on the frozen prime set S = {-1, 2, 3, 5, 7, 11, 13},
      excluding the trivial class. Then the ranks rank E^(d)(Q) are
      modelled as INDEPENDENT draws from a single distribution D(E)
      depending on E only through quantities that do NOT include rank
      E(Q); in particular the conditional expectation of T_k = sum over
      the 2^k - 1 non-identity classes of V is (2^k - 1) times the mean
      of D(E), independent of rank E(Q). This is the SEPARABILITY
      assumption, restated formally and numbered, that
      H-ECRANK-f2a2f7 flags in prose as most likely wrong.
    rigorous_support: >
      PROVEN BOUND FIXING THE QUANTITY: rank E(K) = sum over d in V of
      rank E^(d)(Q) is an exact identity, not an approximation, so T_k
      is a well-defined integer and the only modelling is of its
      DISTRIBUTION. Further, the unconditional Bhargava-Shankar bounds
      on average 2-Selmer size cap the average rank in the family from
      above and forbid the mean of D(E) from being large. CLASSICAL
      DISTRIBUTION THEOREM IMITATED: the conjectural Goldfeld /
      Katz-Sarnak picture for quadratic twist families, under which
      ranks are 0 or 1 with density 1/2 each and higher ranks occur with
      polynomially small density, together with the Delaunay /
      Poonen-Rains models for the Selmer and Sha distributions. THE GAP
      IS DECLARED: the classical half here is conjectural where the
      target profile's exemplar is a theorem, and no unconditional
      distribution theorem for twist ranks is available. That is
      recorded as an obstruction and not papered over.
    validation_plan: >
      SAMPLE: the 32 frozen bases across the strata 3-4, 11, 12, 13,
      each with all 127 frozen classes profiled, about 4,064 certified
      twist ranks in total. PREDICTED DISTRIBUTION: the empirical rank
      histogram per stratum against a single pooled distribution,
      compared by a chi-squared test on binned ranks and by the fitted
      slope beta; and the pooled mean against the committed anchor,
      where the 364,756-twist scan of EV-ECRANK-b6c9b6 found NO twist of
      rank >= 5. TAIL CHECKS: the maximum twist rank per stratum, and
      whether any stratum produces a twist of rank >= 5 - a single such
      twist on a high-rank base would be a strong signal of coupling.
      TRANSFER ASSUMPTION RECORDED: d is bounded by the frozen support
      and the conclusion does not extend to larger d.
  - id: HA-2
    statement: >
      Let V be generated by k independently chosen classes d_1..d_k. The
      2^k - 1 - k PRODUCT classes d_S = prod_{i in S} d_i, |S| >= 2, are
      modelled as behaving like GENERIC square classes with respect to
      twist rank, so that selecting the generators for high twist rank
      confers no advantage on the products. Consequently the expected
      coset total is rank E(Q) + k times E[rank given selected] + (2^k -
      1 - k) times E[rank given generic], and selection buys a vanishing
      fraction of the total as k grows.
    rigorous_support: >
      PROVEN BOUND: V being a subgroup is forced - the multiquadratic
      field Q(sqrt d : d in V) has degree exactly |V| only when V is a
      subgroup of Q*/(Q*)^2, so the product classes are not free
      parameters. That is an algebraic fact, not a modelling choice, and
      it is what makes the heuristic necessary. The unconditional
      Bhargava-Shankar cap again bounds the generic mean from above.
      CLASSICAL DISTRIBUTION THEOREM IMITATED: the same twist
      distribution as HA-1 applied to the product classes; the
      modelling content is the INDEPENDENCE of the product classes from
      the selected generators, analogous to assuming that products of
      selected integers behave like random integers of their size with
      respect to a multiplicative statistic.
    validation_plan: >
      SAMPLE: from the twist ranks computed for HA-1, form all
      subgroups V of order 8 and 16 inside the frozen support and split
      each coset's classes into GENERATORS (the k classes chosen for
      high rank in the coset's sorted generator representation) and
      PRODUCTS. Compare the mean rank of the product classes against
      the mean rank of the generator classes within the same cosets,
      tested by a permutation test with at least 2,000 permutations at
      the frozen seed 20260909. SCALE: about 4,064 twist ranks already
      computed; the comparison is free. PREDICTED DISTRIBUTION:
      equality of the two means. TAIL CHECK: the maximum product-class
      rank against the maximum generator-class rank. FALSIFYING
      OBSERVATION: product-class mean exceeding the generator-class
      mean by more than 0.3 rank units would mean selection DOES
      propagate through products, which would raise every coset total
      and is the single cheapest route to degree 8 that this design
      could discover.
  heuristic_assumptions_note: >
    Both heuristics govern PREDICTIONS and EXTRAPOLATIONS only. No
    certified rank depends on either: a certified coset total is a sum
    of unconditional exhibited-point lower bounds, and it stands
    whatever the distributions turn out to be. What the heuristics carry
    is P1's interval, P3's extrapolated base rank, and the
    interpretation of any shortfall - which is exactly where
    GOAL-ECRANK-002's C2 lives, so the conditionality must be rendered
    wherever C2's number is quoted.
  proof_search_map:
    bottleneck: >
      T_k, the sum of twist ranks over the 2^k - 1 non-identity classes
      of V. The base rank term is now large and measured; every
      remaining unknown at k = 3 is in T_3. The step whose removal
      changes the answer is "raise T_3 above 18 while keeping |V| = 8",
      and no lever for that has been identified, which is precisely why
      T_3 must be MEASURED as a function of the base rather than
      assumed constant.
    baseline_embedding:
      parameter_slice: >
        k = 0, V trivial, K = Q. The construction returns exactly rank
        E(Q) and nothing more - 12 for the pencil curve, 13 for the best
        Mestre pool curves, 3 for the control base. This is the exact
        old-method boundary and it is a regression fixture, not a
        separate code path.
      reproduction_check: >
        Frozen and run FIRST as run R1: the pipeline must reproduce the
        committed degree-8 control - the per-class profile of the
        committed control base under the committed support and alarm,
        and the committed best total 20 achieved by the committed coset
        - before any number computed on a new base curve is believed. A
        pipeline that returns more than 20 there has a bug that would
        manufacture the headline, and this is a stop condition.
    observation_collision:
      observable: >
        The k = 3 optimum, as a function of the maximum twist rank
        present in the coset.
      distinct_preimage_search: >
        SEARCHED FOR EXPLICITLY, as H-ECRANK-f2a2f7 already specifies:
        two cosets with the SAME maximum twist rank but DIFFERENT
        totals falsify separability directly. A second and more
        dangerous collision is structural and is new here - V is a
        SUBGROUP, so once d_1, d_2, d_3 are chosen the remaining four
        classes d_1d_2, d_1d_3, d_2d_3, d_1d_2d_3 are FORCED. Two
        searches that select the same three generators but report
        different totals would indicate a bug in the coset
        construction; two searches selecting different generators with
        the same product set are the same object counted twice and must
        be canonicalised modulo squares before any distribution over
        cosets is formed. The full-enumeration design makes the
        canonicalisation exact: each subgroup is its sorted tuple of
        nonzero class elements.
    quantifier_order: >
      EXISTS a base curve E from the committed set and EXISTS a subgroup
      V of order 8 such that FOR ALL 8 classes d in V the exhibited
      points are non-torsion, lie on E^(d), and their per-class
      certified multiplicities sum to at least 31. The existential over
      (E, V) is discharged by exhibition over a FROZEN finite search
      space declared before the run; the universal is over 8 explicit
      classes. The separability claim carries a different and weaker
      quantifier and must not be stated with this one: it is "FOR the
      tested base curves and the tested coset population, the
      conditional mean of T_3 given rank E(Q) has slope beta", an
      estimate over a sample, never a statement about all curves.
    method_ceiling:
      strongest_certifiable_claim: >
        rank E(K) >= sum over the |V| classes of the certified
        multiplicities, a LOWER bound only. The eigenspace argument
        alone certifies at most |V| at fixed k, so any degree-8 result
        at rank 31 needs an average multiplicity of nearly 4 per class.
        Nothing here can say anything about rank over Q beyond the d = 1
        term, and nothing can prove degree 8 UNREACHABLE - a failure is
        a property of the search space actually enumerated, and the
        record must say so.
      nearby_object_control: >
        Two. (i) k = 4, same pool, same bases: if the new base curves
        raise the k = 4 total well above the committed 32 while leaving
        k = 3 far below 31, that is separability failing in the
        informative direction, exactly as H-ECRANK-f2a2f7 pre-registers.
        (ii) THE OLD POOL AS A MATCHED ARM: the rank-3/4 curves are run
        through the identical pipeline in the same session. Without
        this arm the base effect is confounded with every change in the
        pipeline since the committed measurement.
    proof_obligations:
    - claim: each exhibited point lies on its stated twist and is non-torsion
      responsibility: correctness
    - claim: within-class multiplicities are independent, by a named and recorded certificate kind
      responsibility: correctness
    - claim: "V is a subgroup, so K is the field named and [K : Q] = |V|"
      responsibility: interface
    - claim: the support set and coset enumeration were frozen before the run
      responsibility: strictness
    - claim: any reported shortfall is a property of the enumerated search space and not a proof of unreachability
      responsibility: scope
    not_applicable_reason: null
  dominated_by: >
    Carried from the proposal, checked row by row against every rung on
    this question's frontier; null is NOT asserted. Row 1,
    EV-ECRANK-b6c9b6 D = 32, R = 32 float-free: dominates the predicted
    k = 3 outcome on RANK (32 > 30) but is beaten on DEGREE (32 vs 8),
    so neither dominates the other and this is a genuine new Pareto cell
    if P1 lands in [26,30]. Rows 2-5, the D = 64, D = 16 regulator, D =
    32 R = 52 and D = 64 R = 68 rows of the same record: dominate on
    rank, dominated on degree; a k = 4 result of 38-41 would STRICTLY
    dominate the D = 16 R = 32 row (same degree, higher rank) and that,
    not the degree-8 rung, is this proposal's most likely concrete
    gain. Row 6, D = 2, R = 31 relative to an external rank-30 input:
    DOMINATES the predicted k = 3 outcome outright on both axes (higher
    rank, far smaller degree) and is the row this proposal must be
    compared against honestly; its weakness is that its 31 is relative
    to an external result and its 30x30 independence step is a floating
    regulator. Row 7, EV-ECQ-0d142e, D = 1, R = 12 exact over Q:
    dominates on degree, dominated on rank. Row 8, RUN-ECQ-f5af06-v2-A-
    certify, D = 1, R = 31 float-free confirmation of an external
    curve: dominates on degree and is float-free; on rank it ties the
    target. Row 9, the external world record rank >= 31 over Q:
    dominates everything on degree. HONEST SUMMARY: under P1 this
    proposal is DOMINATED by rows 6, 8 and 9 on the (rank, degree)
    plane and produces a new cell only against rows 1-5. Its
    non-dominated deliverable is not a rung at all - it is the
    separability slope beta and the C2 number, which no row on the
    frontier contains.
  sota_delta: >
    QUANTITATIVELY. (i) Degree-8 rung: committed value 20; predicted
    26-30; the delta is +6 to +10 certified rank at fixed degree 8, and
    the target 31 is predicted MISSED by about 2. (ii) Degree-16 rung:
    committed 32; predicted at least 38; delta +6 or more at fixed
    degree, and this one would strictly dominate a committed row. (iii)
    Base rank input: the pipeline's best base moves from 4 (committed,
    2 curves in 49,692) to 13 (committed, 2 curves in 34,740), a factor
    of about 3.25 on the d = 1 term. (iv) The separability slope beta:
    currently UNMEASURED anywhere in this repository, so the entire
    degree-lowering calculus rests on an assumption its own hypothesis
    record marks as most likely wrong; after this work it is a number
    with an interval. (v) GOAL-ECRANK-002 completion criterion C2
    currently has status OPEN with no number; this produces the number
    it names. NO CLAIM OF ANY KIND ABOUT RANK OVER Q, where the delta
    is exactly zero.
