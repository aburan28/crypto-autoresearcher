  statement: >-
    Four times 32603 is 130412. Its base-2 logarithm is strictly above
    16.99 and strictly below 17, because the hundredth power of 130412
    lies strictly between 2 to the 1699 and 2 to the 1700. The inversion
    count floor of the base-2 logarithm of 16, plus the Hamming weight
    of 16, minus 1, is 4. An addition that uses one such inversion, two
    further multiplications and one squaring therefore uses 6
    multiplications and 17 squarings when the inversion also uses 16
    squarings. The product 2924 times 2924 times 64 is 547185664, which
    is 2814336 below 550000000. The width 4048 uses 64 words, and the
    last word holds 16 live bits, leaving 48 pad bits in a 64-bit word.
    The ratio 28631/4009 exceeds 71/10 by 1671/40090. A Machin lower
    bound computed in this session puts the circle constant strictly
    above 102400/32603, so the square root of that constant times
    32603/4 is strictly above 160. The three product-law values
    48603/5, 1621995/529 and 228881/128 each exceed that square root.
    The first is strictly above 2 to the power 13.2 and strictly below
    2 to the power 13.3. The second is strictly above 2 to the power
    11.5 and strictly below 2 to the power 11.6. The third is strictly
    above 2 to the power 10.8 and strictly below 2 to the power 10.9.
  mechanism: >-
    The proposal converts a closure into group-operation equivalents
    and compares a toy floor with a square-root count. This contract
    checks those products. It does not count a closure.
