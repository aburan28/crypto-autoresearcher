hypothesis:
  id: H-PAIR-27e16a
  question_id: RQ-PAIR-21313f
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-464ff8
  statement: >-
    For every prime p > 3, every ordinary curve E over F_p, every odd prime N distinct from p and
    exactly dividing the group order, every endomorphism psi of E over the algebraic closure, and every
    point P of order N in the rational subgroup G, the Weil self-pairing e_N(P, psi(P)) equals 1
    identically - so no endomorphism of an ordinary prime-field curve yields a non-trivial Weil
    self-pairing on the cryptographic subgroup, and the CM endomorphism is not a distortion map. The
    single configuration in which the argument does not run is Frobenius acting as a scalar on the full
    N-torsion, which forces E[N] to be contained in E(F_p), hence N dividing p - 1 (embedding degree 1)
    AND N^2 dividing the group order - a pair of conditions no cryptographic curve satisfies. The
    Jordan-block case, where p = 1 mod N but the N-torsion is not fully rational, is NOT an exception.
  mechanism: >-
    E ordinary over F_p means the geometric endomorphism ring is an order O in an imaginary quadratic
    field, hence COMMUTATIVE - this is the ordinary/supersingular dichotomy and it is the only external
    input. Frobenius pi lies in O, so commutativity gives psi commuting with pi for every psi in O,
    including endomorphisms a priori defined only over an extension; therefore psi maps the kernel of
    pi - 1 into itself. Now G is the intersection of E[N] with that kernel. If pi is NOT the scalar 1 on
    E[N], the kernel is cyclic of order N, so psi restricted to G is an endomorphism of a cyclic group of
    prime order, i.e. multiplication by some lambda in Z/N - in particular psi(P) lies in the subgroup
    generated by P and no distortion map exists. The Weil pairing is alternating, so e_N(P, P) = 1 and
    hence e_N(P, psi(P)) = e_N(P, P)^lambda = 1 identically. The exceptional case is exactly the failure
    of the hypothesis in the middle step - pi scalar on E[N] - and since G is nonzero and contained in
    the kernel of pi - 1, that scalar must be 1, i.e. the full N-torsion is rational. Two consequences
    follow at once, from the Weil pairing and from Lagrange - full rational N-torsion forces the N-th
    roots of unity into F_p, hence embedding degree 1, and forces N^2 into the group order. This closes,
    unconditionally and with no heuristic, the family "compose the Weil pairing with an endomorphism of
    E to obtain a self-pairing on G computable from one point". It does NOT close the Tate self-pairing,
    which is not alternating; it does not close pairings between G and a subgroup of an extension field
    not equal to G, which is the classical transfer and needs a second point; and it says nothing about
    supersingular curves, where the endomorphism ring is non-commutative and the commutativity step fails
    at its first line - which is precisely why distortion maps exist there.
  assumptions:
  - >-
    The ordinary/supersingular dichotomy - for E ordinary over F_p the geometric endomorphism ring is an
    order in an imaginary quadratic field, hence commutative; for E supersingular it is a maximal order in
    a quaternion algebra. TEXTBOOK, NOT TRANSCRIBED IN THIS CORPUS. Everything rests on this one sentence
    and a literature transcription is owed before this hypothesis is promoted.
  - >-
    N is an odd prime distinct from p, the group order is EXACTLY divisible by N, and E is ordinary.
    Supersingular and anomalous curves are handled elsewhere and are explicitly outside scope.
  - >-
    Whether the published characterisation of the remaining cases for ordinary curves coincides with the
    exceptional case stated here is OPEN. The relevant paper's abstract was verified but its theorem
    statements were not read, and this hypothesis must not be cited as agreeing with it until they are.
  - >-
    On a generic ordinary curve the only cheaply evaluable endomorphisms are the integers and Frobenius
    itself, and Frobenius acts as 1 on G by construction - so a test using only Frobenius is nearly
    vacuous. Any test must include curves with small discriminant where a genuine non-integer,
    non-Frobenius endomorphism is explicit, or it measures almost nothing.
  proof_search_map:
    bottleneck: >-
      The commutativity step - the claim that every geometric endomorphism commutes with Frobenius. Remove
      it and nothing else in the argument survives. It is also the exact step that fails on supersingular
      curves, which is why the two cases have opposite answers.
    baseline_embedding:
      parameter_slice: >-
        The supersingular slice. Setting the endomorphism ring to a quaternion order and keeping every other
        line of the argument must REPRODUCE the known positive - distortion maps exist and the modified
        self-pairing is non-degenerate.
      reproduction_check: >-
        Symbolic, plus a numerical positive control on the standard supersingular curve with its textbook
        distortion map. An argument that also "proves" no distortion map on a supersingular curve proves too
        much and is void.
    observation_collision:
      observable: >-
        The scalar lambda in Z/N by which psi acts on G, together with the value e_N(P, psi(P)).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - many distinct endomorphisms share one lambda, namely all those
        congruent modulo the ideal generated by N and pi - 1. That collision is not a defect; it IS the
        content. It says the pairing observable retains only one residue of the whole endomorphism ring, and
        therefore that no amount of endomorphism cleverness can enlarge the observable. Recording the
        collision explicitly is what upgrades "we tried some endomorphisms" to "the observable cannot
        separate them".
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Replace the scalar lambda with the full pair - the action on BOTH Frobenius eigenlines, the rational
        one and its complement. This retains strictly more state and is what a distortion map would exploit.
      predicted_gain: >-
        None for the attacker, and that is the point - the second coordinate is NOT computable from
        F_p-rational data on G, because the complementary eigenline is not rational. The transform is stated
        so the record shows the stronger invariant was considered and dismissed for a reason, not overlooked.
    quantifier_order: >-
      INTENDED AND CLAIMED - FOR ALL primes p > 3, FOR ALL ordinary E over F_p, FOR ALL odd primes N exactly
      dividing the group order and distinct from p, FOR ALL psi in the geometric endomorphism ring, FOR ALL P
      of order N in G - e_N(P, psi(P)) = 1.
      The dangerous weaker reading, NOT claimed - FOR ALL psi THERE EXISTS P. The argument gives the strong
      order because lambda does not depend on P.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No endomorphism of an ordinary prime-field curve yields a non-trivial WEIL self-pairing on the
        cryptographic subgroup." It certifies nothing about the Tate self-pairing, nothing about pairings with a
        second independent point, nothing about correspondences that are not endomorphisms of E, and nothing
        about the hardness of the ECDLP.
      nearby_object_control: >-
        Two, and both must behave DIFFERENTLY or the argument has not located the load-bearing structure. First,
        the supersingular curve, where the desired conclusion FAILS and must be seen to fail. Second, an ordinary
        curve with full rational N-torsion, where the middle step's hypothesis fails and the conclusion must
        again fail.
    proof_obligations:
    - claim: The endomorphism ring of an ordinary curve is commutative and contains Frobenius.
      responsibility: correctness
    - claim: Frobenius non-scalar on E[N] implies the intersection of ker(pi - 1) with E[N] is cyclic of order N.
      responsibility: correctness
    - claim: The Weil pairing is alternating.
      responsibility: correctness
    - claim: Frobenius scalar on E[N] forces full rational N-torsion, hence N divides p - 1 and N^2 divides the group order.
      responsibility: strictness
    - claim: The supersingular positive control returns a non-trivial pairing.
      responsibility: baseline
    - claim: The exceptional configuration is exhibited constructively, not merely asserted.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
  - description: >-
      The ordinary/supersingular dichotomy for endomorphism rings of elliptic curves over finite fields.
    citation: null
    provenance: recalled
    verified_by: null
    role: >-
      The single external input on which the entire argument rests. TEXTBOOK but not transcribed into this
      corpus; a literature transcription is owed before promotion, and its absence is a declared gap rather than
      a silence.
  - description: >-
      The Weil pairing is alternating, so the self-pairing of any point with itself is trivial.
    citation: null
    provenance: recalled
    verified_by: >-
      Checked numerically as part of the instrument validation - the pipeline must return 1 for e_N(P, P) on
      every tested curve, including the supersingular positive control where e_N(P, psi(P)) is non-trivial.
    role: the step that collapses the scalar action to the identity
  - description: >-
      The standard supersingular curve over F_p with p = 3 mod 4 and its textbook distortion map, on which a
      non-trivial modified self-pairing exists.
    citation: null
    provenance: recalled
    verified_by: >-
      Required to fire as the blocking positive control; if it does not, every negative in this record is an
      instrument artifact.
    role: positive control and proves-too-much slice
  - description: >-
      A prior in-repository statement of the same obstruction as an ordinary lift gate, phrased under the
      hypothesis that the two N-torsion Frobenius eigenvalues are distinct.
    citation: ledger/FINDING-PF-IC-001.md
    provenance: internal
    verified_by: >-
      Read; this hypothesis DUPLICATES that argument and says so. Its increments are the exact characterisation
      of the eigenvalue hypothesis's failure, the Jordan-block sub-case, and retrievability as a first-class
      record.
    role: prior art inside this corpus, cited rather than rediscovered
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      Fraction of (ordinary toy curve, endomorphism psi, point P) triples with e_N(P, psi(P)) not equal to 1,
      over curves whose group order is exactly divisible by N and with embedding degree above 1
    direction: lower
    minimum_effect: >-
      EXACTLY ZERO out of every triple tested, with no tolerance. A single non-trivial value is either a
      refutation of the argument or an instrument bug, and this record commits IN ADVANCE to treating the
      instrument as the first suspect and to running the positive control before reporting anything.
  - metric: Agreement between the recovered scalar for Frobenius and 1
    direction: different
    minimum_effect: >-
      Exact equality on 100 percent of ordinary toy curves. Frobenius acts as the identity on G by definition of
      rationality, so any disagreement is an arithmetic bug and halts the line.
  - metric: Fraction of supersingular positive controls with e_N(P, psi(P)) not equal to 1
    direction: higher
    minimum_effect: >-
      100 percent. Below that, the instrument cannot see a distortion map and NO negative from it is
      interpretable.
  - metric: >-
      Whether an ordinary curve with full rational N-torsion can be constructed at toy scale, and whether the
      middle step's conclusion fails on it
    direction: different
    minimum_effect: >-
      If constructed, some endomorphism must move P off the subgroup generated by P and a non-trivial
      self-pairing must appear. If it cannot be constructed inside budget, the closure boundary is UNEXHIBITED
      and the claim is capped at "no counterexample found in the tested family".
  - metric: Value of e_N(P, P) on every tested curve, including the supersingular control
    direction: different
    minimum_effect: >-
      EXACTLY 1 everywhere, since the Weil pairing is alternating. A non-trivial value here means the pairing
      implementation is wrong - most likely a missing final exponentiation - and every number is void.
  test_boundary:
    instances: >-
      At least 200 toy ordinary curves over prime fields with p between 2^16 and 2^20, group order exactly
      divisible by an odd prime N distinct from p, and small embedding degree so the pairing value's field is
      computable. Curves with small discriminant are REQUIRED in the sample, because on a generic ordinary curve
      the only cheaply evaluable endomorphisms are the integers and Frobenius, and Frobenius acts as 1 on G by
      construction. Plus the standard supersingular curve as positive control, and a search for an ordinary curve
      with full rational N-torsion as the exceptional-case construction.
    parameters:
      p_range_bits:
      - 16
      - 20
      minimum_ordinary_curves: 200
      embedding_degree: small and deliberately selected, since the claim is that the value is 1 for all k and small k is where a non-trivial value would be easiest to produce
      required_small_discriminant_curves: curves with j = 0 or j = 1728 so a genuine non-Frobenius endomorphism is explicit
      exceptional_search_condition: N divides p - 1 AND N^2 divides the group order, for small N
    implementation: >-
      Exact finite-field arithmetic with a Weil pairing implementation including its final exponentiation, checked
      by a deliberately broken variant that omits it. Endomorphism evaluation for Frobenius and, on
      small-discriminant curves, for an explicit non-integer endomorphism. The scalar by which psi acts on G is
      recovered and reported alongside the eigenvalue predicted by the characteristic polynomial of Frobenius mod N.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 3.0
      maximum_runs: 12
  falsification_conditions:
  - >-
    Any ordinary toy curve whose group order is exactly divisible by N, with embedding degree above 1, on which
    some endomorphism gives e_N(P, psi(P)) not equal to 1, SURVIVING the instrument controls. That refutes the
    argument and would be the most important observation available in this area.
  - >-
    The supersingular positive control returning 1. Instrument failure under AGENTS.md rule 5, never mathematical
    evidence, and nothing is reported.
  - >-
    e_N(P, P) returning anything other than 1 on any curve. The pairing implementation is wrong and every number
    is void.
  - >-
    The published characterisation of the remaining cases differing from the exceptional case stated here. One of
    the two is wrong; the record is superseded, not amended.
  - >-
    Failure to construct any exceptional curve at toy scale, which leaves the closure boundary UNEXHIBITED and
    caps the claim at "no counterexample found in the tested family". This is not a refutation but it is a real
    limitation and must be reported as one.
  interpretation_limits:
  - >-
    This is a CLOSURE of one family, not a hardness result. It moves no exponent and makes no curve safer than it
    already was.
  - >-
    Scoped to ordinary curves over PRIME fields whose group order is exactly divisible by N. It says nothing about
    supersingular curves, about extension fields, or about anomalous curves.
  - >-
    The mathematics is textbook and is already recorded twice in this repository. Presenting it as a new result
    would be overclaiming; its value is placement under an explicit resource taxonomy, precision about the
    exception, and retrievability by the next lane that needs it.
  - >-
    Confusing "no distortion map for G" with "no distortion map at all" is the obvious misreading. The claim is
    about the rational eigenline only.
  distinguishable_outcomes:
  - outcome: >-
      e_N(P, P) is 1 everywhere; the supersingular positive control fires at 100 percent; the recovered Frobenius
      scalar is exactly 1 on every ordinary curve; and no ordinary triple with embedding degree above 1 gives a
      non-trivial self-pairing.
    means: >-
      The closure holds at the tested scope with its instrument demonstrated in both directions. The family
      "compose the Weil pairing with an endomorphism to get a self-pairing on G computable from one point" is
      closed for ordinary prime-field curves, with the obstruction named as commutativity of the endomorphism
      ring rather than as an embedding-degree argument.
  - outcome: >-
      All instrument controls pass AND an exceptional curve with full rational N-torsion is constructed, on which
      some endomorphism moves P off its own subgroup and a non-trivial self-pairing appears.
    means: >-
      The closure boundary is EXHIBITED constructively rather than asserted. This is the strongest form of the
      result available - a closure whose exceptional case can be produced is a real boundary, and one whose
      exceptional case cannot be produced has not been shown to be one.
  - outcome: >-
      All instrument controls pass but no exceptional curve can be constructed inside budget.
    means: >-
      The closure boundary is UNEXHIBITED. The claim is capped at "no counterexample found in the tested family"
      and the exceptional-case characterisation remains an argument rather than a demonstrated boundary. A real
      limitation, reported as one, with the search's coverage stated.
  - outcome: >-
      Some ordinary triple with embedding degree above 1 gives a non-trivial self-pairing, and it survives the
      positive control, the alternating check and the broken-pairing check.
    means: >-
      The argument is REFUTED - either commutativity, or the cyclicity of the rational eigenline, or the
      alternating property has been misapplied. This would be the most important observation this design can
      produce and requires independent replication before any downstream use.
  - outcome: >-
      The supersingular positive control returns 1, or e_N(P, P) is not 1 anywhere.
    means: >-
      INSTRUMENT FAILURE. Infrastructure signal under AGENTS.md rule 5, never mathematical evidence. Nothing is
      reported and the run returns to the Executor with the failing control named.
  - outcome: >-
      The published characterisation of the exceptional cases turns out to differ from the one stated here.
    means: >-
      One of the two is wrong and finding out which is the deliverable. The record is superseded under a new id
      rather than edited. If instead it AGREES, this record's increment is a re-derivation and should be
      downgraded to a corpus transcription - which is a legitimate and honest outcome.
