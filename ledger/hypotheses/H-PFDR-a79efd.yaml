hypothesis:
  id: H-PFDR-a79efd
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260808-d6d973
  batch_id: BATCH-2c45e2
  statement: >-
    DEGREE AND YIELD ARE TWO ENDS OF ONE BUDGET IN THE WINDOWED ADDITION-TREE
    FAMILY, AND THE YIELD HALF IS A COUNTING FACT THAT AN ELLIPTIC CURVE IS NOT
    NEEDED TO PRODUCE. Organise a decomposition of a target into m summands by a
    binary addition tree with internal node set I. Retain a subset S of the
    internal nodes as explicit variables windowed to size B prime, and eliminate
    the rest by resultants.
    (S1 THE YIELD LAW) The expected number of decompositions of a uniform target
    drops by exactly the factor (B prime over p) raised to the size of S, relative
    to the unwindowed count, up to an equidistribution error. Measured as a fitted
    exponent of the window ratio, that exponent equals the size of S.
    (S2 THE DEGREE LAW) Each eliminated internal node of subtree height h
    contributes per-variable degree 2 to the power h to the resulting equation, so
    the empty-S extreme gives the summation polynomial of per-variable degree 2 to
    the power m minus 1, and grouping the leaves into g groups of size c balances
    the two exponents with an interior optimum at c equal to g equal to the square
    root of m.
    (S3 THE YIELD LAW IS NOT ELLIPTIC) S1 uses only that the internal node value is
    determined by the leaves and equidistributed in the field. It is predicted to
    hold IDENTICALLY for a curve-free object of the same cardinalities. If it does,
    the yield half is combinatorics and no statement about elliptic curves or the
    ECDLP may be quoted from it; only the degree half, which uses the recursive
    resultant construction, can carry elliptic-curve content.
  mechanism: >-
    On the yield side, once the m leaves are fixed every internal node value is
    determined, so requiring one to land in a window of size B prime is an event of
    probability the window ratio, and the events multiply while the leaf count
    stays below the point where the constraints interact. On the degree side, the
    bidegree-(2,2) three-variable relation squares in the surviving variables at
    each resultant elimination, which is the standard recursive construction and is
    why the m-summand relation has per-variable degree 2 to the power m minus 1.
    Any solver whose reachable box scales as a power of the field size divided by
    the degree therefore pays exactly what the yield saves, so the two knobs are one
    conserved budget rather than two independent dials, and the family's two
    extremes are both dead by arithmetic before any solver is chosen.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE SOURCE IDEA'S YIELD ARM IS UNMEASURABLE AT ITS OWN STATED PARAMETERS AND
      WAS RE-PARAMETERISED. The idea proposes p about 2 to the 22 with B in
      {2^4, 2^5, 2^6} at m = 4 and asks for agreement with the predicted factor to
      within a factor of 2. At B = 2^6 the unwindowed expected count is about
      B^4 divided by 24 N, which is about 0.17 decompositions per target; windowing
      ONE internal node multiplies it by a window ratio of about 2 to the minus 16,
      giving about 2.5 expected events per million targets, against which a
      factor-2 band is Poisson noise. Windowing BOTH internal nodes of a
      four-leaf caterpillar gives about 4 times 10 to the minus 11 per target -
      that is, ZERO EVENTS IN ANY REACHABLE SAMPLE - so the idea's own headline
      prediction that the fully windowed yield is "zero to within Poisson noise"
      is satisfied identically by an empty measurement and cannot distinguish the
      law from a broken pipeline.
    change_made: >-
      The measured quantity became the FITTED EXPONENT of the window ratio rather
      than a per-cell count, and the parameters were chosen for power. At p about
      2 to the 18 with B = 2 to the 7 and m = 4 the unwindowed count is about 42.7
      decompositions per target, so a window ratio of 2 to the minus 2 through 2 to
      the minus 8 gives, at S of size one, between about 10.7 and 0.17 events per
      target, and at S of size two between about 2.7 and 6.5 times 10 to the minus
      4 per target - which over 10 to the 5 targets is roughly 10 to the 6 down to
      65 events per cell. Every cell has counting power, the exponent is fitted
      across four window ratios spanning six binary orders of magnitude, and the
      band on the fitted exponent is 0.15.
    alternative_hypothesis_range: >-
      The competing explanation the source idea itself names is that windowing an
      internal node also constrains the leaves once the leaf count becomes
      comparable to a power of the field size, so the events are not independent
      and the fitted exponent departs from the size of S. THAT REGIME IS MADE
      REACHABLE ON PURPOSE - a cell at p about 2 to the 12 with B = 2 to the 7 and
      m = 4 has a leaf count of 2 to the 28 against a field-size power of 2 to the
      24, so the constraints must interact there and the fitted exponent must
      depart. The design therefore contains cells where each competing explanation
      predicts a different fitted exponent, and the two are separated by more than
      the 0.15 band.
  assumptions:
  - >-
    The summation relations are constructed by iterated resultants from the
    bidegree-(2,2) three-variable relation, and the degree bookkeeping follows that
    construction. An implementation that builds them another way is measuring a
    different object and must say so.
  - >-
    Targets are drawn uniformly from the prime-order subgroup and the window is an
    interval or an arithmetic progression, declared per cell.
  - >-
    The two-torsion points and the two-to-one fibre of the x-coordinate map inflate
    raw counts by small factors that are divided out by a declared rule BEFORE any
    comparison against the closed form. The rule is frozen before execution.
  - >-
    Equidistribution of internal node values in the field is an assumption at the
    tested sizes, not a theorem applied blindly, and it is measured directly by the
    binning arm.
  proof_search_map:
    bottleneck: >-
      The per-variable degree of the decomposition system, which sets the reach of
      any small-root or degree-sensitive solver. Reducing it is what would change
      the family's cost, and the yield law is what that reduction has to be paid
      for with.
    baseline_embedding:
      parameter_slice: >-
        S empty, which reproduces the standard summation-polynomial system exactly,
        with per-variable degree 2 to the power m minus 1 and the unwindowed yield.
      reproduction_check: >-
        Symbolic degree check at m equal to 3, 4 and 5 against 4, 8 and 16, in two
        engines sharing no code, together with a counted unwindowed yield matching
        the closed form within Poisson error on a frozen fixture.
    observation_collision:
      observable: >-
        The pair consisting of the maximum per-variable degree and the yield factor.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED - two distinct trees on the same number of
        leaves with the same maximum eliminated-subtree height and the same number
        of windowed nodes give the same pair while being genuinely different trees.
        The search over all binary trees on at most 6 leaves is exhaustive and
        cheap, and a collision shows the pair is not a complete invariant of the
        tree, which bounds what the law can be used to say.
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: >-
        A potential on trees equal to the base-p logarithm of the yield factor plus
        the base-2 logarithm of the maximum per-variable degree.
      predicted_gain: >-
        The potential is claimed near-constant along the family. A tree with
        strictly smaller potential is the target and would falsify conservation;
        exhibiting one is a positive result for the family.
    quantifier_order: >-
      CLAIMED - FOR ALL m, FOR ALL binary addition trees on m leaves and FOR ALL
      windowing patterns, the yield equals the unwindowed count times the window
      ratio raised to the number of windowed nodes up to an equidistribution error,
      AND the maximum per-variable degree equals 2 raised to the largest eliminated
      subtree height. THE READING EXPLICITLY NOT CLAIMED - that this bounds all
      solvers. A solver insensitive to degree escapes the trade entirely; none is
      known to this program and that is a statement about this program's knowledge.
    method_ceiling:
      strongest_certifiable_claim: >-
        A trade law for the windowed binary addition-tree family, with both halves
        measured at toy scale and the degree half verified symbolically. It can
        NEVER certify a lower bound on all solvers, and if the curve-free arm
        reproduces the yield half then that half certifies nothing about elliptic
        curves either.
      nearby_object_control: >-
        GENUS-TWO INDEX CALCULUS, where an analogous tree has the same degree
        growth and the same yield law and yet index calculus wins, because the base
        field is smaller. The law alone therefore does not close prime fields, and
        an argument that concluded otherwise would have proved too much. The
        missing ingredient is the subfield, and naming it is part of the record.
    proof_obligations:
    - claim: 'The yield factor is the window ratio raised to the number of windowed nodes, up to equidistribution error.'
      responsibility: success_probability
    - claim: 'The maximum per-variable degree is 2 raised to the largest eliminated subtree height.'
      responsibility: size
    - claim: 'Both extremes violate either the linear-algebra budget or the solver reach budget.'
      responsibility: strictness
    - claim: 'The yield law holds identically for a curve-free object of matched cardinalities.'
      responsibility: scope
    - claim: 'The fitted exponent departs from the node count in the interacting regime.'
      responsibility: feasibility
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL. The record moves no exponent by itself. It BOUNDS a family - any windowed
    addition-tree scheme inherits a total exponent constrained by the maximum
    per-variable degree the retained tree produces - and a bound on a family is not
    a complexity claim about a problem. Recording an asymptotic_claim would assert
    an improvement that this record explicitly denies making.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR leaves drawn uniformly from the window, the internal node values are
      equidistributed in the prime field, so the probability that a given internal
      node lands in a window of size B prime equals the window ratio up to an error
      of order the inverse square root of the field size, uniformly over the tested
      cells.
    random_model_justification: >-
      The imitated model is equidistribution of the x-coordinates of sums of random
      points, which is the same quasirandomness expectation this program's
      technique corpus records elsewhere. The rigorous ingredient would be
      square-root cancellation for character sums on the three-variable relation,
      which is absolutely irreducible for generic parameters.
    supporting_results: []
    supporting_results_note: >-
      EMPTY. The square-root cancellation result is recalled and unread by this
      program and may not discharge this field under AGENTS.md rule 9. The
      equidistribution is measured directly by the binning arm instead.
    validation_experiment_ids:
    - EXP-PFDR-e62f8a
    falsification_condition: >-
      The chi-square of the internal-node-value histogram against uniform rejects at
      the declared level with a departure that GROWS as the field size grows across
      the tested range. A departure that shrinks with field size is a small-field
      artifact and is reported as one.
  structural_ingredients:
  - description: >-
      The recursive resultant construction of the summation relations and the
      resulting per-variable degree doubling at each elimination.
    citation: KN-TECH-002
    provenance: internal
    verified_by: >-
      Relayed from IDEA-20260808-d6d973 source_refs. NOT opened by
      TASK-20260904-5423ad and marked relayed for that reason. The degree values 4,
      8 and 16 at m equal to 3, 4 and 5 are re-derived symbolically as the
      experiment's first gate rather than taken from the record.
    role: fixes the degree half of the trade
  - description: >-
      This program's finding that the mean decomposition yield is conserved under
      changes of factor-base geometry at fixed arity, and that it says nothing about
      the cost of finding a decomposition.
    citation: KN-FIND-007
    provenance: internal
    verified_by: >-
      Relayed from IDEA-20260808-d6d973, which reports reading it in full. NOT
      opened by TASK-20260904-5423ad and marked relayed.
    role: >-
      the nearest known statement, and the one this record is disjoint from - it
      conserves mean yield at fixed arity across geometries, whereas this record
      trades degree against yield across tree shapes at fixed factor base
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      fitted exponent of the window ratio in the measured yield, dimensionless,
      per (tree, windowing pattern) cell in the non-interacting regime
    direction: different
    minimum_effect: >-
      EQUAL TO THE NUMBER OF WINDOWED INTERNAL NODES, within 0.15, at every
      non-interacting cell, with the fit spanning at least four window ratios over
      six binary orders of magnitude.
  - metric: >-
      fitted exponent of the window ratio in the INTERACTING regime, where the leaf
      count exceeds the relevant power of the field size
    direction: different
    minimum_effect: >-
      DEPARTING from the number of windowed nodes by more than 0.15. If it does NOT
      depart there, the independence assumption is more robust than the confounder
      analysis expects and that is itself a reportable finding.
  - metric: >-
      maximum per-variable degree of the eliminated system, an integer, at m equal
      to 3, 4 and 5 with S empty
    direction: different
    minimum_effect: >-
      EXACTLY 4, 8 and 16. Any other value falsifies the degree half or the
      construction, and which is decided by re-deriving in a second engine.
  - metric: >-
      curve-free fitted exponent minus elliptic fitted exponent at matched
      cardinalities, dimensionless
    direction: different
    minimum_effect: >-
      PREDICTED EXACTLY ZERO. If it is zero, the yield law is combinatorics and no
      statement about elliptic curves or the ECDLP may be quoted from it.
  - metric: >-
      the tree potential, the base-p logarithm of the yield factor plus the base-2
      logarithm of the maximum per-variable degree, dimensionless, over all binary
      trees on at most 6 leaves
    direction: different
    minimum_effect: >-
      Near-constant along the family within a declared tolerance. A tree with
      strictly smaller potential falsifies conservation and is a positive result
      for the family.
  test_boundary:
    instances:
    - >-
      Toy prime-field curves with prime-order subgroups at about 2 to the 18 and 2
      to the 20, the non-interacting regime, at least 10 to the 5 uniform targets
      per cell.
    - >-
      A deliberately INTERACTING cell at about 2 to the 12 with the same leaf
      budget, where the leaf count exceeds the relevant power of the field size.
    - >-
      A curve-free object of matched cardinalities - a random abelian group of the
      same order with a random addition-compatible index map, containing no
      elliptic curve and no summation polynomial - at every window ratio.
    parameters:
      arities: '4 for the counted arm; 3, 4, 5 for the symbolic degree arm; up to 6 leaves for the tree enumeration'
      leaf_window: 'B = 2 to the 7'
      internal_window_ratios: '2 to the minus 2, minus 4, minus 6, minus 8'
      windowing_patterns: 'S of size 0, 1 and 2 on the four-leaf caterpillar and on the balanced tree'
      targets_per_cell: 100000
    implementation: >-
      Direct enumeration of windowed tuples and counting of decompositions, with
      the two-torsion and fibre correction applied by the frozen rule; symbolic
      resultant computation in two independent engines for the degree arm.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 6
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
  - >-
    The fitted exponent departs from the number of windowed nodes by more than 0.15
    at a non-interacting cell - S1 as stated is wrong and the yield half of the
    duality fails.
  - >-
    The symbolic degree at m equal to 3, 4 or 5 with S empty is not 4, 8 or 16 -
    S2 is wrong or the construction differs from the assumed one.
  - >-
    Some tree shape achieves BOTH a maximum per-variable degree of at most 4 AND a
    yield within a constant of the unwindowed mean - the trade is not conserved,
    the interior optimum is better than predicted, and this is a POSITIVE result
    that reopens the family.
  - >-
    THE CURVE-FREE ARM REPRODUCES THE YIELD LAW EXACTLY - S3 holds, the yield half
    is combinatorics, and nothing from it may be quoted as a statement about
    elliptic curves or the ECDLP. Only the degree half may then carry
    elliptic-curve content.
  - >-
    The equidistribution chi-square rejects with a departure growing in field size
    - HEUR-001 is falsified and the closed form loses its error term.
  interpretation_limits:
  - >-
    This is a statement about a specific solver-shape family - binary addition
    trees with windowed internal nodes - and about solvers whose reach degrades
    with degree. A solver insensitive to degree escapes it entirely; that none is
    known to this program is a statement about this program.
  - >-
    THE YIELD HALF IS PREDICTED TO BE CURVE-FREE AND THE CONSEQUENCE IS PRE-STATED.
    If the curve-free arm reproduces it, the yield law is a counting fact about
    windows and determined values, not about elliptic curves, and half of this
    record's content carries no elliptic-curve claim.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The interior optimum
    at group size the square root of m matters only at arities large enough for the
    grouping to be nontrivial, which begins around m equal to 9. A counted yield
    measurement at m equal to 9 requires enumerating windowed nine-tuples and is
    beyond any budget this program has, so the interior optimum is verified
    SYMBOLICALLY ONLY - as a degree statement - and its yield half at that arity is
    NOT measured by this or any reachable experiment.
  - >-
    Two-torsion and the two-to-one x-coordinate fibre inflate raw counts and are
    divided out by a rule frozen before execution. A rule chosen after seeing counts
    would be fitting.
  - >-
    Toy scale throughout. No exponent moves and no attack is claimed.
