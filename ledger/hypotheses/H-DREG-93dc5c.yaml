  title: >-
    Over F_2, the resultant in y of y^2 + 1 and y + x is x^2 + 1, and the
    content in y of x(y^2 + 1) is x.
  statement: >-
    Let p = y^2 + 1 and q = y + x in F_2[x, y]. The resultant of p and q
    with respect to y is x^2 + 1. Let a = x(y^2 + 1). As a polynomial in y,
    its coefficients have content x, and the total degree of a is 3. A
    resultant taken with respect to x is not this y-resultant.
  mechanism: >-
    q is monic linear in y, so the resultant in y is p evaluated at y = x.
    The content is the gcd of the coefficients of y. This is the proposal's
    degree-and-content reading on a toy pair, not a summation-polynomial
    tower.
  assumptions: []
