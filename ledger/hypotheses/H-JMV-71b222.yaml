hypothesis:
  id: H-JMV-71b222
  question_id: RQ-JMV-001
  derived_from_idea: IDEA-20260807-63ab15
  added: '2026-08-25'

  statement: >-
    SCOPE: (A) the primary text of Jao-Miller-Venkatesan 2005
    (arXiv math/0411378) as retrieved and double-transcribed, against the
    load-bearing inputs H-JMV-001 and H-JMV-002 declare UNVERIFIED; and (B) the
    order lattice between Z[pi] and the maximal order for isogeny classes at
    p around 2^20, where the full level structure is enumerable. CLAIM TIER --
    the transcription half is a documentary fact at whatever scale the paper
    states; the structural half is toy. NO ECDLP ATTACK IS PROPOSED, and
    RQ-JMV-001's own constraint forbids one.

    PART V (THE VERIFICATION). Both approved JMV hypotheses rest on inputs
    recorded as LOAD-BEARING AND UNVERIFIED because "the paper is not in the
    corpus". The hypothesis is that a verified transcription CAN be produced
    from the primary text -- the verbatim Figure 1 rows, the statements of the
    four cited results, and, because H-JMV-002 states that a factor of 2 moves
    a logarithm across zero, THE PAPER'S OWN CAYLEY-GRAPH DEGREE AND EIGENVALUE
    NORMALIZATION CONVENTIONS, which is exactly where such a factor hides.
    THE SHARP, TWO-SIDED QUESTION INSIDE IT -- whether the verified Figure 1
    value for the tested curve AGREES with the value H-JMV-001 assumes. If it
    agrees, H-JMV-001's arithmetic-audit claim has no subject and is withdrawn,
    which that hypothesis's own falsification conditions already anticipate. If
    it disagrees, the subject exists and the audit is worth running.

    PART G (THE UNFRAMED GAP). RQ-JMV-001's third declared knowledge gap -- the
    cross-level case, which the source paper explicitly does not cover -- has
    no hypothesis and no experiment and is represented in the ledger only by a
    conditional sentence inside an unapproved specification. The hypothesis is
    that at p around 2^20, where the level structure is fully enumerable, the
    VERTICAL (level-changing) graph is CONNECTED for the tested conductor
    structures. If it is DISCONNECTED at any tested conductor, a JMV-style
    mixing argument across levels is structurally excluded there, which is a
    named obstruction with forward guidance. If it is connected with fast
    mixing, the cross-level gap is not the obstruction it might be, and
    order-only curve selection is better supported than the source literature
    claims.

    WHAT THIS RECORD DOES NOT DO. It supplies the CONTENT of a correction to
    RQ-JMV-001's knowledge_gap field; it does not make the correction. That is
    a Coordinator act on a committed record and is not implied by any outcome
    here.

  mechanism: >-
    (1) WHY THE VERIFICATION IS THE DECISIVE FIRST STEP AND COSTS NO COMPUTE.
    Two approved hypotheses declare their central input unverified and
    load-bearing. Until it is verified, dispatching their experiments spends
    compute on a subject that may not exist. The parent proposal further
    records that the existing corpus entry for the paper is a bulk-seed relay
    generated from a PDF's first two pages, whose own text says its claims are
    relayed from the abstract without independent verification -- so it
    contains no Figure 1, no lemma statement, and no normalization convention,
    and a second unsourced statement is not a source.

    (2) WHY DOUBLE TRANSCRIPTION IS THE CONTROL. A single reader transcribing a
    table can silently normalise it. Two independent transcriptions compared
    CHARACTER BY CHARACTER is the only control available that detects a
    paraphrase imported as a source, and it is cheap. A disagreement means
    neither is admissible until reconciled.

    (3) WHY THE NORMALIZATION CONVENTION IS SINGLED OUT. H-JMV-002 states that
    a factor of 2 moves the sign of a logarithm. Degree and eigenvalue
    conventions for a Cayley graph differ by exactly such factors across the
    literature -- whether the graph is taken as a multigraph, whether inverse
    generators are counted once or twice, whether the adjacency matrix is
    normalised by the degree. Transcribing the four statements without the
    conventions they are stated under would produce a verified-looking record
    that still cannot settle the question the audit exists to settle.

    (4) WHY THE VERTICAL GRAPH IS THE RIGHT OBJECT FOR PART G. The lossy
    projection is isogeny class to its order lattice with vertical adjacency --
    the curves themselves are discarded and only the endomorphism-order level
    is retained. This is genuinely lossy (many curves share a level) and the
    retained part propagates deterministically, because a vertical isogeny step
    changes the order by one prime level and the class-number ratio at that
    step is computable exactly. At p around 2^20 the whole lattice is
    enumerable, so connectivity is a computable yes-or-no and is not forced
    either way a priori.

    (5) THE CONTROLS THAT MAKE PART G MEAN ANYTHING. A FORCED VALUE -- the
    horizontal (same-level) graph is connected under the source paper's own
    hypotheses, and the instrument must reproduce that BEFORE any vertical
    claim is admissible. A NULL -- a random graph on the same level set with
    matched degrees; if mixing behaviour matches, the level structure carries
    nothing and no structural reading of the vertical graph is available.

  assumptions:
    - >-
      The primary source is retrievable at execution time. The parent proposal
      records a measurement on 2026-08-07 that arXiv was reachable from this
      environment; THAT MEASUREMENT IS NOT ASSERTED HERE AS CURRENT and must be
      re-established at run time. If it is not reachable, the outcome is
      SOURCE-BLOCKED, recorded as such, and absorbed nowhere.
    - >-
      p around 2^20 makes the level structure fully enumerable, as RQ-JMV-001
      itself scopes. If it does not for a chosen conductor structure, that
      structure is excluded and the exclusion is reported.
    - >-
      Class-number computations at these sizes are exact. Whether the number of
      LEVELS is large enough for connectivity to mean anything is a separate
      question and is reported per conductor rather than assumed.
    - >-
      A bulk-seeded corpus entry is not a source. Any statement carried forward
      from the existing entry must be re-established from the primary text or
      dropped.
    - >-
      Correcting RQ-JMV-001's knowledge_gap field, superseding the existing
      corpus entry, or changing the status of H-JMV-001 or H-JMV-002 are
      COORDINATOR acts. This record supplies content for them and performs none
      of them.

  proof_search_map:
    bottleneck: >-
      For Part V -- the single unverified input that two approved hypotheses
      declare load-bearing. Until it is checked, every downstream JMV
      experiment risks having no subject. For Part G -- whether a level-changing
      mixing argument is even formulable, which is decided by connectivity
      before any mixing rate is worth computing.
    baseline_embedding:
      parameter_slice: >-
        The horizontal (same-level) isogeny graph at the same conductor
        structures, where connectivity is asserted by the source paper's own
        hypotheses.
      reproduction_check: >-
        FORCED VALUE, GATING. The instrument must reproduce horizontal
        connectivity at every tested conductor structure BEFORE any vertical
        connectivity result is admissible. An instrument that cannot find a
        component structure it is told is trivial cannot be trusted to report
        one it is not.
    observation_collision:
      observable: >-
        For Part G, the pair (number of connected components of the vertical
        graph, mixing statistic) at a given conductor structure.
      distinct_preimage_search: >-
        Run the identical mixing measurement on a RANDOM graph over the same
        level set with matched degrees. If the two produce indistinguishable
        mixing behaviour, the level structure carries no information and the
        observable does not identify anything about isogeny classes. This is
        the collision that bounds every structural reading of Part G.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The order lattice with vertical adjacency, replacing the isogeny
          class itself -- the curves are discarded, only the endomorphism-order
          level is retained, and adjacency carries an exactly computable
          class-number ratio.
        predicted_gain: >-
          Turns "does a JMV-style argument port across levels" into a
          computable connectivity question at enumerable sizes, before any
          mixing rate is estimated. No attack and no speedup.
    quantifier_order: >-
      Part G's claim is -- FOR the tested conductor structures at the tested
      p, the vertical graph has [this many] components. It is NOT quantified
      over conductor structures generally, over larger p, or over the family of
      isogeny classes; and a connectivity result at enumerable sizes says
      nothing about cryptographic sizes, where class numbers grow and the
      structure may change. Part V's claim is a documentary equality or
      inequality between a transcribed value and an assumed one, quantified
      over nothing.
    method_ceiling:
      strongest_certifiable_claim: >-
        Part V -- at most, "the primary text states [these values] under [these
        conventions], and H-JMV-001's assumed value [agrees / disagrees] with
        the transcribed one." Part G -- at most, "at the tested conductor
        structures and p, the vertical level graph has [k] components and its
        mixing statistic is [value] against a matched random null." NEITHER can
        certify anything about attack cost, about cryptographic sizes, or about
        whether curves of the same order have the same difficulty; and
        RQ-JMV-001 forbids proposing an attack at all.
      nearby_object_control: >-
        The RANDOM matched-degree graph on the same level set. If it mixes
        indistinguishably from the vertical graph, the method has not
        identified anything about the level structure and every structural
        reading is void.
    proof_obligations:
      - claim: >-
          The two independent transcriptions of Figure 1 and the four
          statements agree character by character.
        responsibility: interface
      - claim: >-
          The transcribed degree and eigenvalue normalization conventions are
          stated verbatim, with their source location.
        responsibility: correctness
      - claim: >-
          The instrument reproduces horizontal connectivity at every tested
          conductor structure.
        responsibility: baseline
      - claim: >-
          The vertical graph's components and the class-number ratios at each
          level step are computed exactly, not estimated.
        responsibility: correctness
      - claim: >-
          Nothing transfers to cryptographic sizes or to attack cost.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No attack is proposed -- RQ-JMV-001's own constraint
    forbids one -- and no complexity claim of any kind is made. The best-known
    baseline in this area remains the source paper's own GRH-conditional mixing
    result, once verified, and this record neither improves nor challenges it.

  heuristic_assumptions:
    - id: HEUR-JMV3-1
      formal_statement: >-
        Vertical connectivity measured at p around 2^20 is indicative of
        vertical connectivity at cryptographic sizes.
      random_model_justification: >-
        NONE. Class numbers grow with p and the level structure may change
        qualitatively. This is recorded as an UNJUSTIFIED extrapolation, not as
        a supported assumption, and it is not used to support any conclusion --
        the deliverable reports connectivity AT THE TESTED SIZES and states
        this limit explicitly.
      supporting_results: []
      validation_experiment_ids: [EXP-JMV-80e0c7]
      falsification_condition: >-
        Vertical connectivity differing between the two tested conductor
        structures, or varying with p across the tested range, which would show
        the quantity is not stable even inside the tested window and that no
        extrapolation is available at all.
    - id: HEUR-JMV3-2
      formal_statement: >-
        The number of LEVELS at the tested conductor structures is large enough
        that a connectivity verdict carries information, i.e. the vertical
        graph is not trivially connected by having one or two vertices.
      random_model_justification: >-
        Not distributional. It is a sizing condition on the instrument, and it
        is checked directly -- the level count and component sizes are reported
        per conductor rather than summarised into a boolean.
      supporting_results: []
      validation_experiment_ids: [EXP-JMV-80e0c7]
      falsification_condition: >-
        A tested conductor structure whose level count is below the declared
        minimum. That conductor is excluded and the exclusion is reported; a
        connectivity verdict from it is not admissible.

  predictions:
    - metric: >-
        V1 -- transcription_agreement -- character-by-character agreement
        between two independent transcriptions of the verbatim Figure 1 rows,
        the four cited statements, and the degree and eigenvalue normalization
        conventions
      direction: different
      minimum_effect: >-
        EXACT agreement on every character. A disagreement means NEITHER
        transcription is admissible until reconciled, and nothing downstream
        may be reported.
    - metric: >-
        V2 -- assumed_versus_verified -- whether the verified Figure 1 value
        for the curve H-JMV-001 concerns AGREES with the value that hypothesis
        assumes
      direction: different
      minimum_effect: >-
        Reported as agree or disagree with both values printed. AGREEMENT
        withdraws H-JMV-001's subject, which its own falsification conditions
        already anticipate; DISAGREEMENT establishes that the subject exists.
        Both are complete answers and the design is equally willing to report
        either.
    - metric: >-
        V3 -- convention_capture -- whether the paper's degree and eigenvalue
        normalization conventions were located and transcribed verbatim, with
        their source location
      direction: different
      minimum_effect: >-
        CAPTURED, with location. If the paper does not state them explicitly,
        that ABSENCE is itself the finding and must be reported as an absence
        with the search terms used, because H-JMV-002's factor-of-2 concern
        then cannot be settled from the primary text at all.
    - metric: >-
        G1 -- horizontal_connectivity -- the number of connected components of
        the same-level graph at each tested conductor structure
      direction: lower
      minimum_effect: >-
        EXACTLY 1 at every tested conductor, as the source paper's own
        hypotheses assert. GATING -- if the instrument cannot reproduce this,
        NO vertical result is admissible.
    - metric: >-
        G2 -- vertical_connectivity -- the number of connected components of
        the level-changing graph, and their sizes, at each tested conductor
        structure
      direction: lower
      minimum_effect: >-
        Predicted 1 (connected). A count above 1 at any tested conductor
        structurally EXCLUDES a JMV-style mixing argument across levels there,
        which is a named obstruction with forward guidance and is the more
        consequential outcome.
    - metric: >-
        G3 -- class_number_ratios -- the exact class-number ratio at each
        vertical level step, per conductor structure
      direction: different
      minimum_effect: >-
        Reported exactly, per step. These are the quantities any cross-level
        mixing statement would have to be formulated in terms of, and reporting
        them is a deliverable independent of the connectivity verdict.
    - metric: >-
        G4 -- random_null_mixing -- the mixing statistic of a matched-degree
        random graph on the same level set, against the vertical graph's
        statistic
      direction: different
      minimum_effect: >-
        Reported on the same axes. If the two are indistinguishable, the level
        structure carries nothing and no structural reading of G2 is available
        -- that is a controlled null and is reported as one.
    - metric: >-
        G5 -- level_count -- the number of levels per tested conductor
        structure, with component sizes
      direction: higher
      minimum_effect: >-
        Above the declared minimum, else that conductor is EXCLUDED and its
        connectivity verdict is inadmissible. A graph with two vertices is
        connected for reasons that carry no information.

  test_boundary:
    instances:
      - >-
        The primary text of Jao-Miller-Venkatesan 2005 (arXiv math/0411378),
        retrieved at run time, double-transcribed.
      - >-
        At least TWO conductor structures c_pi with several divisors, at
        p around 2^20, chosen before retrieval and declared.
      - >-
        The horizontal (same-level) graph at those conductor structures, as the
        gating forced value.
      - >-
        A matched-degree random graph on the same level set, as the mixing
        null.
      - >-
        OUT OF SCOPE -- any ECDLP attack (forbidden by RQ-JMV-001), any
        cryptographic-size p, any claim about curve selection in deployment,
        and any status change to H-JMV-001, H-JMV-002, RQ-JMV-001 or the
        existing corpus entry for the paper.
    parameters:
      target_prime_scale: "p around 2^20, full level structure enumerable"
      conductor_structures: 2
      minimum_level_count: declared before the run
      transcription_readers: 2
      source: arXiv math/0411378
    implementation: experiments/EXP-JMV-80e0c7
    budget:
      stage0_wall_clock_seconds: 600
      stage1_agent_hours: 4
      stage2_wall_clock_seconds: 3600
      maximum_memory_gb: 4
      maximum_runs: 4

  distinguishable_outcomes:
    - outcome: >-
        V1 exact, V3 captured, and V2 shows the verified value DISAGREES with
        H-JMV-001's assumed value.
      means: >-
        The arithmetic-audit claim has a subject and the two approved JMV
        hypotheses are unblocked with a verified input. Their experiments
        become worth dispatching. NO status change follows automatically --
        that is a Coordinator act on a committed record.
    - outcome: >-
        V1 exact, V3 captured, and V2 shows AGREEMENT.
      means: >-
        H-JMV-001's arithmetic-audit claim HAS NO SUBJECT and is withdrawn,
        which that hypothesis's own falsification conditions already
        anticipate. This is a clean negative, it is fully reachable, and it
        saves the compute that dispatching its experiments would have spent.
    - outcome: >-
        V1 disagrees between the two readers.
      means: >-
        NEITHER transcription is admissible. Nothing downstream may be reported
        until reconciled; the deliverable is the located discrepancy. This is
        the outcome that a single-reader design could not detect at all.
    - outcome: >-
        V3 not captured -- the paper does not state its normalization
        conventions explicitly.
      means: >-
        H-JMV-002's factor-of-2 concern CANNOT be settled from the primary
        text. The absence is reported with its search terms, and that
        hypothesis's load-bearing input remains unverified for a documented
        reason rather than an undocumented one.
    - outcome: >-
        G1 fails -- the instrument does not reproduce horizontal connectivity.
      means: >-
        INSTRUMENT FAILURE. No vertical result is admissible; the deliverable
        is the instrument defect.
    - outcome: >-
        G1 passes and G2 shows the vertical graph DISCONNECTED at some tested
        conductor.
      means: >-
        A JMV-style mixing argument across levels is structurally excluded
        there. This is a named obstruction with forward guidance and is the
        more consequential Part-G outcome. It is scoped to the tested conductor
        structures and p, and HEUR-JMV3-1 is explicitly unjustified.
    - outcome: >-
        G1 passes, G2 shows connectivity, and G4 shows the vertical graph mixes
        indistinguishably from the matched random null.
      means: >-
        The level structure carries no information the null lacks. Connectivity
        is reported as a fact, but NO structural reading of it is available --
        a controlled null.
    - outcome: >-
        The source is not retrievable at run time.
      means: >-
        SOURCE-BLOCKED. Part V does not run and reports nothing; this is an
        infrastructure and access state, never evidence in either direction
        (AGENTS.md rule 5). Part G may still run, since it needs no source.

  falsification_conditions:
    - >-
      F1 -- the source confirms H-JMV-001's assumed values. The
      arithmetic-audit claim has no subject and is withdrawn, exactly as that
      hypothesis's own falsification conditions state.
    - >-
      F2 -- the two independent transcriptions disagree. Neither is admissible
      until reconciled and nothing downstream may be reported.
    - >-
      F3 -- the vertical graph is connected WITH fast mixing that exceeds the
      matched random null. Part G's obstruction reading is FALSE, the
      cross-level gap is not the obstruction it might be, and order-only curve
      selection is better supported at these sizes than the source literature
      claims.
    - >-
      F4 -- the instrument fails to reproduce horizontal connectivity. No
      vertical result is admissible.
    - >-
      F5 -- the vertical graph's mixing is indistinguishable from the matched
      random null. No structural reading is available; controlled null.
    - >-
      F6 -- a tested conductor structure's level count falls below the declared
      minimum. That conductor is excluded and its verdict is inadmissible; if
      both are excluded, Part G is UNTESTED rather than answered.
    - >-
      F7 -- the paper's normalization conventions are absent from the primary
      text. H-JMV-002's factor-of-2 concern is unsettleable from the source and
      that is reported as the finding.

  interpretation_limits:
    - >-
      Neither half is an ECDLP attack, and RQ-JMV-001 forbids proposing one.
      Nothing here bears on attack cost.
    - >-
      Part G's results at p around 2^20 are TOY SCALE. Class numbers grow and
      the structure may change; HEUR-JMV3-1 is recorded as an unjustified
      extrapolation and is not used.
    - >-
      Correcting RQ-JMV-001's knowledge_gap, superseding the existing corpus
      entry for the paper, and changing the status of H-JMV-001 or H-JMV-002
      are COORDINATOR acts. This record supplies content and performs none of
      them; no outcome implies a transition.
    - >-
      A bulk-seeded corpus entry can look verified. Any superseding entry must
      state its provenance level explicitly, and this experiment's transcription
      is admissible only with both readers' outputs and their comparison
      attached.
    - >-
      Connectivity at enumerable sizes may mean little if the levels are few.
      The level count is reported per conductor precisely so a reader can see
      whether the verdict carries information.

