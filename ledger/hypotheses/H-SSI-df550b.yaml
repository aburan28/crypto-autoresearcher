hypothesis:
  id: H-SSI-df550b
  question_id: RQ-SSI-001
  class: distributional
  source_proposal: IDEA-20260805-062bee

  statement: >-
    SCOPE: supersingular elliptic curves over F_{p^2} for p prime, p = 3 mod 4, at toy sizes
    p <= a few thousand; minimal isogeny degrees measured through L-smooth degrees only for a
    declared small prime set L. CLAIM TIER toy. NO ATTACK, NO NEW ALGORITHM, NO EXPONENT
    CLAIMED TO MOVE, NO CRYPTO-SCALE TRANSFER.
    Let delta(E) be the smallest degree of a separable isogeny E -> E^{(p)} to the Frobenius
    conjugate, and let F(D) = #{E : delta(E) <= D} out of N ~ p/12 supersingular
    j-invariants. THE HYPOTHESIS IS THAT THIS ONE DISTRIBUTION CARRIES THE EXPONENT OF THE
    BEST-KNOWN ALGORITHM FOR THE SUPERSINGULAR ENDOMORPHISM PROBLEM, VIA A FORCED IDENTITY,
    AND THAT THE DISTRIBUTION OBEYS A TWO-EXPONENT POWER LAW.
    (i) IDENTITY (derived, not measured): writing F(D)/N = c * D^beta * p^{-gamma} on the
        range where the law holds, the covering threshold -- the D at which F(D)/N reaches 1
        -- is p^{gamma/beta}, and the published meet-in-the-middle costs Theta(delta) up to
        the o(1), so THE ALGORITHM'S TIME EXPONENT IS gamma/beta.
    (ii) LAW (the substantive, falsifiable part): (beta, gamma) = (3/2, 1/2), giving
        exponent 1/3 and reproducing Theorem 1.5's published bound deg <= (p/2)^{1/3}.
    (iii) MATCHED NULL (forced, and the instrument's self-calibration): replacing the target
        E^{(p)} by a uniformly random supersingular target forces (beta, gamma) = (2, 1),
        hence exponent 1/2 -- EXACTLY the classical Delfs-Galbraith baseline. The same code
        must return 1/2 on the null and 1/3 on the treatment, or it is not measuring
        exponents at all.
    (iv) EXACT ANCHORS, both forced before any run: delta(E) = 1 precisely when j(E) lies in
        F_p, so F(1) is the F_p-rational subfield count ~ h(-p) ~ sqrt(p); and
        delta(E') <= m^2 delta(E) for any degree-m isogeny walk E -> E', so every curve at
        2-isogeny distance k from the subfield set satisfies delta <= 4^k.
    THE DELIVERABLE IS THE MEASURED PAIR (beta, gamma) WITH ITS PRE-REGISTERED THREE-WAY
    FORK -- beta ~ 1/2 means only the subfield-walk structure is visible and the covering
    exponent is 1; beta ~ 3/2 means the published exponent 1/3 is a covering threshold and,
    by the derived tail argument, is already optimal inside this architecture; beta >= 1.85
    means the covering threshold sits below p^{1/3} at the tested scale, which would be the
    most consequential single outcome available in this goal and would authorise a
    derivation, not a claim.

  mechanism: >-
    ALL QUOTATIONS ARE FROM inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, READ IN FULL IN
    THIS SESSION. Every step labelled RECALLED is a candidate to check and is carried into
    the experiment as a stage or a heuristic; none is cited as authority.

    (A) THE COST IS THE DEGREE. Paper section 1.4 (verbatim): "a recent result [4] proves
    that there always exists an isogeny E -> E^{(p)} of degree at most (p/2)^{1/3} ... if
    the degree factors as a product of small primes ... it factors as phi = eta o psi where
    both eta and psi are smooth and of much smaller degree ~ (p/2)^{1/6}. One can then hope
    to find them by listing smooth isogenies from E and from E^{(p)} of degree ~ (p/2)^{1/6},
    until they 'meet in the middle'." Section 1.1 (verbatim): "the algorithm essentially
    resolves a claw-finding problem for two sets of size N = p^{1/3+o(1)}". The two are
    consistent because the number of isogenies of degree <= X from a fixed curve is
    sum_{d<=X} sigma(d) ~ X^2, and the paper's own section-4.1 cost model writes the table
    size as M = Psi(X,B) * X, i.e. X^2 times the smoothness density. Hence a curve whose
    minimal degree is delta yields lists of size ~delta and time ~delta. THE EXPONENT OF THE
    ALGORITHM IS THE EXPONENT OF delta. This is the paper's own bookkeeping re-derived, and
    it is claimed as such.

    (B) THE COVERING IDENTITY. With F(D)/N = c D^beta p^{-gamma}, setting the left side to 1
    gives D = (p^{gamma}/c)^{1/beta} and therefore EXPONENT = gamma/beta. Arithmetic, zero
    compute, and the entire reason one measured slope decides an exponent.

    (C) WHY (3/2, 1/2) IS THE CANDIDATE. RECALLED, UNVERIFIED, AND THE LOAD-BEARING STEP:
    under the Deuring correspondence, supersingular curves admitting a degree-d isogeny to
    their own Frobenius conjugate correspond to optimal embeddings of a quadratic order of
    discriminant of size ~dp into a maximal order of B_{p,infinity}, and the count of such
    curves is governed by a class number h ~ sqrt(dp) up to a bounded L(1,chi) and a small
    multiplicity from Galois / Atkin-Lehner identification. Summing over d <= D:
    F(D) ~ c' sqrt(p) sum_{d<=D} sqrt(d) ~ (2c'/3) sqrt(p) D^{3/2}, i.e. beta = 3/2,
    gamma = 1/2, exponent 1/3 -- WHICH REPRODUCES THEOREM 1.5'S EXPONENT EXACTLY. That
    agreement is the internal check that this is the right counting, and it is also the
    reason NO NOVELTY IS CLAIMED for the counting itself.
    TWO INDEPENDENT PUBLISHED ANCHORS PIN THE SAME LAW AT D = 1:
      - delta(E) = 1 iff E is isomorphic to E^{(p)} iff j(E) in F_p; the F_p-rational
        supersingular set has size ~ h(-p) ~ sqrt(p), so F(1)/N ~ C p^{-1/2}.
      - The paper's section 1.3 (verbatim), describing the earlier [24, 26] algorithms:
        random walks continue "until E' is 'adjacent' to its conjugate E'^{(p)} -- an event
        which occurs with probability O(p^{-1/2})". Adjacency is delta = O(1), so that
        published probability IS F(O(1))/N and it is p^{-1/2}, pinning gamma = 1/2.

    (D) THE LIPSCHITZ LAW, WITH ITS WITNESS. For w : E -> E' of degree m, the conjugate
    isogeny w^{(p)} : E^{(p)} -> E'^{(p)} also has degree m, so for the minimal
    phi : E -> E^{(p)} the composite phi' = w^{(p)} o phi o w_hat : E' -> E'^{(p)} has degree
    m * delta(E) * m. HENCE delta(E') <= m^2 delta(E), with an explicit witness. Three
    consequences, all forced and all used as controls:
      - re-randomisation cannot cheapen delta except by paying m^2;
      - a curve at 2-isogeny distance k from the subfield set has delta <= 4^k -- AN EXACT
        PRE-REGISTERED UPPER ENVELOPE ON EVERY MEASURED VALUE, which can fail;
      - the subfield set's expander growth alone gives only F(D)/N >~ D^{1/2} p^{-1/2}, i.e.
        beta >= 1/2 and exponent <= 1. SO THE SUBFIELD-WALK ROUTE ALONE PREDICTS THE KOHEL-
        LEVEL EXPONENT 1, AND THE ENTIRE GAP BETWEEN beta = 1/2 AND beta = 3/2 IS THE
        STRUCTURE THE 2026 RESULT LIVES ON.

    (E) THE DERIVED METHOD CEILING (zero compute). Run the meet-in-the-middle with degree
    budget T on each of R re-randomised curves. Success needs R c T^beta p^{-gamma} ~ 1, so
    R = p^{gamma} / (c T^{beta}) and total cost ~ R T = p^{gamma} T^{1-beta} / c. FOR
    beta > 1 THIS IS STRICTLY DECREASING IN T, so the optimum is T as large as the guarantee
    permits: T = p^{1/3} by Theorem 1.5, R = 1, total p^{1/3}. The published parameter choice
    is therefore already optimal within this architecture and no lucky-instance search
    improves on it -- CONDITIONAL ON beta > 1, which is exactly what the experiment measures.
    For beta < 1 the sign flips and many-walks-small-budget would win. beta is thus both the
    exponent and the parameter deciding whether the architecture is tight.

    (F) WHAT THE MEASUREMENT CAN ACTUALLY SEE, STATED AS A LIMIT RATHER THAN A CAVEAT. The
    graph is built from ell-isogeny edges for ell in a declared set L, so the measured
    quantity is delta_L >= delta and the measured law is the L-smooth restriction
    F_L(D) ~ C sqrt(p) sum_{d <= D, d L-smooth} sqrt(d). THAT RESTRICTED PREDICTION IS
    COMPUTED IN EXACT INTEGER ARITHMETIC BEFORE THE RUN for every (p, D) cell, and the
    measured/predicted RATIO is the reported quantity. A ratio that drifts with D means the
    smoothness restriction rather than the law is producing the slope -- the canonical
    artifact tell for this design -- and beta_hat is then not an exponent.

  assumptions:
    - >-
      Pure endomorphism / path-finding instances. No torsion images published under a secret
      isogeny, no SQIsign transcript, no CSIDH secret. RQ-SSI-001 places the SIDH/SIKE
      torsion-image regime out of scope as a positive target and this record stays inside it.
    - >-
      p = 3 mod 4 throughout, so that F_{p^2} = F_p[i] with i^2 = -1 and j = 1728 is
      supersingular. This is a construction convenience and it restricts the tested scope; a
      p = 1 mod 4 arm is explicitly NOT claimed and is named as remaining open.
    - >-
      delta is measured as delta_L through the ell-isogeny graph for ell in L. Conflating
      delta_L with delta anywhere in the output is a measurement error the contract forbids.
    - >-
      The step-(A) accounting (cost ~ delta) is inherited from the paper and is not an
      independent claim of this record. If it is wrong, the identity of step (B) still holds
      as a statement about the distribution but no longer says anything about the algorithm.
    - >-
      NO STATUS CHANGE to KN-OPEN-013/014/015, KN-TECH-024/029/050, H-SSI-001, or any
      existing record is proposed or implied.

  proof_search_map:
    bottleneck: >-
      The step at which the exponent 1/3 enters the analysis. In the published algorithm it
      enters exactly once, through Theorem 1.5's degree bound deg(phi) <= (p/2)^{1/3} for
      the minimal separable isogeny E -> E^{(p)}; everything downstream (the 1/6 half-degree
      split, the p^{1/3} claw sets, the p^{1/3} memory) is arithmetic on that one number.
      Removing or improving that bound is the ONLY way the exponent moves inside this
      architecture, and the hypothesis restates the bound as a covering threshold so that it
      becomes a measurable quantity rather than a cited constant.
    baseline_embedding:
      parameter_slice: >-
        The random-target slice. Replace E^{(p)} by a uniformly random supersingular target
        and the identical measurement must reproduce the PRE-2026 baseline exponent 1/2, via
        (beta, gamma) = (2, 1): the number of curves within degree D of a fixed curve is
        ~D^2 out of N ~ p/12, so covering happens at D ~ p^{1/2}. This is an exact
        reproduction of Delfs-Galbraith's exponent from the same instrument, not a curve that
        resembles it.
      reproduction_check: >-
        Symbolic first (the D^2/N count is elementary), then measured as the null arm at
        every prime cell. The reproduction check is a HARD GATE: if the null arm does not
        return 1/2, no treatment number is admissible.
    observation_collision:
      observable: >-
        The integer delta(E) -- one number per curve -- and the derived pair (beta, gamma).
      distinct_preimage_search: >-
        The observable is MASSIVELY non-injective by design and the record quantifies it
        rather than hiding it: at D ~ p^{1/3} the fibre of a single delta value has size
        ~sqrt(p) D^{1/2} ~ p^{2/3}, and at D = 1 the fibre is the whole F_p-rational
        subfield set of size ~sqrt(p). A COLLISION IS THEREFORE GUARANTEED AND IS NOT A
        FALSIFIER HERE, because the hypothesis is distributional: it asserts a law about the
        FIBRE SIZES, not an identification of curves. The identifiability question that DOES
        bite is whether two DIFFERENT laws can produce the same measured slope, and the
        answer is the pair of arms: (3/2, 1/2) and (2, 1) give different slopes in BOTH D
        and p, so the treatment and the null are separated on two independent axes. If they
        are not separated in the data, the instrument has not identified anything and the
        contract halts.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a problem-specific resource measure -- the covering threshold of the
          delta-distribution -- and realise it by specialising to the Frobenius-conjugate
          target. Charges are added only over the disjoint blocks {E : delta(E) in [D, 2D]},
          whose sizes are what the law predicts.
        predicted_gain: >-
          None to any attacker. The gain is that "can the supersingular exponent go below
          1/3?" becomes "is beta above 3/2?", a single measurable number with a
          pre-registered fork, which no prior record in this goal supplies.
      - transform: observable_fiber
        proposed_object: >-
          Hold delta fixed and vary the forgotten structure (the curve, its maximal order,
          its position relative to the subfield set). The intrinsic invariant proposed to
          distinguish the resulting objects is the graph distance k to the subfield set,
          whose relation to delta is bounded by the derived envelope delta <= 4^k.
        predicted_gain: >-
          A graded control that localises any failure to a specific distance shell rather
          than leaving "the law did not fit".
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXIST absolute constants C, beta = 3/2, gamma = 1/2 such
      that FOR ALL sufficiently large p and FOR ALL D in the declared window,
      F(D)/N = (C + o(1)) D^{beta} p^{-gamma}. The constants may NOT depend on p or D. The
      weaker order -- FOR ALL p THERE EXISTS a (C, beta, gamma) fitting that p -- is
      trivially satisfiable by any two-parameter fit and is EXPLICITLY NOT CLAIMED and NOT
      ADMISSIBLE as a result. Because the contract fits within each prime and then compares
      across primes, the uniformity obligation is discharged only by the cross-prime
      agreement of beta_hat, and a beta_hat that drifts with p collapses the claim to a
      per-prime description, which must then be reported as such.
      SEPARATELY, THE QUANTIFIER TRAP IN THE ALGORITHMIC CONSEQUENCE: Theorem 1.5 is
      "FOR ALL E THERE EXISTS an isogeny of degree <= (p/2)^{1/3}" -- a worst-case existence
      bound. The hypothesis is about the DISTRIBUTION of the witness's degree. NO
      DISTRIBUTIONAL MEASUREMENT CAN REFUTE AN EXISTENCE BOUND, and any output of this
      hypothesis that reads as bearing on Theorem 1.5's correctness is malformed.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a measured pair (beta_hat, gamma_hat) for the L-SMOOTH minimal degree to the
        Frobenius conjugate, over supersingular graphs at p = 3 mod 4 and p at most a few
        thousand, on one graph construction, with a matched null and an exact positive
        control. It cannot certify the unrestricted law, cannot establish any complexity
        bound, cannot move any exponent, cannot bear on Theorem 1.5, and cannot close
        KN-OPEN-013 -- whose question is about cryptographic-scale hardness, which p <= a few
        thousand does not reach by any argument.
      nearby_object_control: >-
        THE NEAREST OBJECT ON WHICH THE HOPED-FOR CONCLUSION IS KNOWN FALSE IS THE RANDOM
        TARGET, and it is a required arm rather than a discussion point. For a uniformly
        random supersingular target the covering exponent is 1/2, not 1/3 -- the 2026 result
        does NOT apply and the classical baseline does. An instrument that returns the same
        (beta, gamma) for both targets has not found the Frobenius structure and has measured
        graph geometry instead. A SECOND nearby object, on which the conclusion holds
        trivially and which is therefore the positive control: the F_p-rational subfield set,
        where delta = 1 exactly.
    proof_obligations:
      - claim: >-
          F(D)/N = c D^{3/2} p^{-1/2} on the declared window, with c independent of p and D.
        responsibility: correctness
      - claim: >-
          delta(E) = 1 exactly when j(E) in F_p, and the subfield count is ~ h(-p).
        responsibility: baseline
      - claim: >-
          delta(E') <= m^2 delta(E) for every degree-m walk, with the stated witness.
        responsibility: correctness
      - claim: >-
          The published algorithm's time is Theta(delta) up to the o(1), so exponent =
          gamma/beta.
        responsibility: runtime
      - claim: >-
          The L-smooth restriction multiplies the law by the separately computed factor and
          introduces no other D-dependence.
        responsibility: strictness
      - claim: >-
          Nothing here transfers to cryptographic scale, and nothing here bears on
          Theorem 1.5.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: >-
    THE PUBLISHED ALGORITHM'S OWN RE-RANDOMISATION IS AN OBJECT OF STUDY HERE RATHER THAN A
    DEVICE THIS RECORD INTRODUCES. Paper section 1.4 (READ, verbatim): "one can re-randomise
    the instance of the problem by performing a random walk E -> E', then hoping that the
    method works for E', and pulling back the solution to E through the walk." The pull-back
    is exactly the composite phi' = w^{(p)} o phi o w_hat of mechanism step (D), and the
    Lipschitz bound delta(E') <= m^2 delta(E) is the quantitative statement of what the walk
    costs. MIXING-TIME JUSTIFICATION: the supersingular ell-isogeny graph is Ramanujan and
    walks of length O(log p) mix -- RECALLED, UNVERIFIED, NO SOURCE READ IN THIS SESSION; the
    graph's connectivity was confirmed empirically in the feasibility probe at p = 103, 251,
    503, 1019, which is a check, not a proof, and is labelled so.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. NO COMPLEXITY IMPROVEMENT IS CLAIMED. The hypothesis is a statement
    about a distribution and an identity relating that distribution to an EXISTING
    algorithm's exponent. It makes no problem easier to solve, adds no attack, and moves no
    exponent. The exponent it discusses -- 1/3, from a published result -- is not this
    record's to claim. dominated_by is not applicable because no Pareto point is proposed;
    the rows checked are listed in IDEA-20260805-062bee.

  heuristic_assumptions:
    - id: HEUR-DELTA-1
      formal_statement: >-
        THERE EXISTS an absolute constant C > 0 such that FOR ALL sufficiently large primes
        p and FOR ALL D with 1 <= D <= (p/2)^{1/3},
        #{E supersingular over F_{p^2} : delta(E) <= D} = (C + o(1)) * sqrt(p) * D^{3/2},
        where delta(E) is the minimal degree of a separable isogeny E -> E^{(p)}. C may not
        depend on p or on D.
      random_model_justification: >-
        The quantity should behave like the count of optimal embeddings of quadratic orders
        of discriminant ~dp into maximal orders of B_{p,infinity}, summed over d <= D, with
        each d contributing a class number h ~ sqrt(dp) up to a bounded L(1,chi). Under that
        model sum_{d<=D} sqrt(dp) ~ (2/3) sqrt(p) D^{3/2}. THE MODEL IS RECALLED AND NO
        SOURCE FOR IT WAS READ IN THIS SESSION.
      supporting_results:
        - >-
          NOT RETRIEVED. The intended rigorous ingredients are the Deuring correspondence
          and Eichler's optimal-embedding / class-number relation, neither of which was read
          here. They are named so that a reviewer can attack the attribution, and they are
          NOT cited as authority for any number.
        - >-
          READ AND USED AS ANCHORS RATHER THAN AS SUPPORT: Theorem 1.5 of
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (deg <= (p/2)^{1/3} for all E), which
          fixes the covering exponent at 1/3; and section 1.3's statement that conjugate-
          adjacency "occurs with probability O(p^{-1/2})", which fixes gamma = 1/2 at D = O(1).
      validation_experiment_ids: [EXP-SSI-6a2619]
      falsification_condition: >-
        beta_hat outside [1.35, 1.65] at every completed prime, with fit quality R^2 >= 0.9
        and a measured/predicted ratio that does NOT drift by more than a factor 3 across the
        D window. (All three conditions are required together: a bad fit or a drifting ratio
        makes beta_hat uninterpretable and is reported as such rather than as a refutation.)
    - id: HEUR-DELTA-2
      formal_statement: >-
        FOR ALL D and all declared prime sets L,
        #{E : delta_L(E) <= D} / #{E : delta(E) <= D} =
        (sum_{d <= D, d L-smooth} sqrt(d)) / (sum_{d <= D} sqrt(d)) * (1 + o(1)),
        i.e. the L-smooth restriction acts multiplicatively and introduces no further
        D-dependence.
      random_model_justification: >-
        It assumes the per-degree curve counts depend on d only through sqrt(d) and not on
        d's arithmetic type. THIS IS FALSE IN DETAIL -- squares, degrees divisible by p, and
        very small d all behave specially -- and it is stated because the measurement cannot
        avoid it.
      supporting_results: []
      validation_experiment_ids: [EXP-SSI-6a2619]
      falsification_condition: >-
        The measured/predicted ratio varies by more than a factor 3 across the D window at
        fixed p. The restriction, not the law, is producing the slope.
    - id: HEUR-DELTA-3
      formal_statement: >-
        DECLARED NOT LOAD-BEARING, RECORDED SO NOBODY INFERS IT. Nothing in this hypothesis
        assumes, uses, tests, supports, or weakens Heuristic 1 of the source paper (the
        SMOOTHNESS of the minimal degree). This hypothesis concerns its SIZE. The two are
        independent and this record does not inherit Heuristic 1's condition.
      random_model_justification: n/a
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        n/a. If any output of EXP-SSI-6a2619 is cited as bearing on Heuristic 1, that
        citation is malformed and this entry is the record that says so.

  structural_ingredients:
    - description: >-
        Theorem 1.5: every supersingular E/F_{p^2} admits an isogeny to E^{(p)} of degree at
        most (p/2)^{1/3}.
      citation: >-
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, section 1.5, READ VERBATIM IN THIS
        SESSION. The theorem is attributed there to its reference [4], WHICH WAS NOT READ.
      role: fixes the covering exponent at 1/3 and supplies the exact upper limit of the D window
    - description: >-
        Conjugate-adjacency probability O(p^{-1/2}) for random walks.
      citation: >-
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, section 1.3, READ VERBATIM.
      role: pins gamma = 1/2 at D = O(1), independently of the class-number model
    - description: >-
        Optimal-embedding / class-number count h(-4dp) ~ sqrt(dp) for curves d-isogenous to
        their Frobenius conjugate.
      citation: >-
        RECALLED, UNVERIFIED, NO SOURCE READ. This is the load-bearing recalled ingredient
        and its validation is the experiment. It is not cited as authority.
      role: supplies beta = 3/2
    - description: >-
        Conjugation of isogenies: deg(w^{(p)}) = deg(w), giving the Lipschitz law
        delta(E') <= m^2 delta(E) with witness w^{(p)} o phi o w_hat.
      citation: >-
        Derived in this record from the definition of the Frobenius conjugate. Elementary.
      role: supplies the exact 4^k envelope control and the re-randomisation cost

  reduction_chain:
    core_problem: >-
      Determine the exponent of the covering threshold of the minimal Frobenius-conjugate
      isogeny degree over the supersingular graph, at toy scale, for L-smooth degrees.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from a toy-scale distributional measurement
      to any cryptographic-scale statement, and none is claimed. In particular KN-OPEN-013
      is NOT closed, narrowed, or advanced by a measurement at p <= a few thousand, and any
      citation of this hypothesis toward cryptographic cost must carry that gap explicitly.

  predictions:
    - metric: >-
        beta_hat: OLS slope of log(F_L(D)/N) against log D over the declared window
        1 <= D <= p^{1/3}, treatment arm (target E^{(p)}), largest completed prime
      direction: different
      minimum_effect: >-
        'PRE-REGISTERED THREE-WAY FORK. [1.35, 1.65] -> consistent with 3/2 and with
        exponent 1/3 already optimal in this architecture. [0.35, 0.65] -> consistent with
        1/2, only subfield-walk structure visible, covering exponent 1 at this scale, an
        instrument-scope result and NOT a refutation of anything. >= 1.85 -> covering
        threshold below p^{1/3} at the tested scale; hypothesis-generating only and routed
        to a derivation. Outside [0.3, 2.5], or R^2 < 0.9: no power law at this scale, and
        NOTHING is concluded about any exponent.'
    - metric: >-
        beta_hat_null and gamma_hat_null, random-target arm, identical code and window
      direction: different
      minimum_effect: >-
        'beta_hat_null = 2.0 +/- 0.25 and gamma_hat_null = -1.0 +/- 0.25, i.e. covering
        exponent 1/2. HARD GATE: if the null does not reproduce the classical
        Delfs-Galbraith exponent, the instrument does not measure covering exponents and no
        treatment number may be reported at all.'
    - metric: >-
        gamma_hat: slope of log(F(1)/N) against log p across completed prime cells, measured
        exactly (delta = 1 needs no smoothness restriction)
      direction: different
      minimum_effect: >-
        '-0.50 +/- 0.15, derived from #{j in F_p} ~ h(-p) ~ sqrt(p) against N ~ p/12. This
        anchor is independent of the graph construction -- it is a membership test on j --
        and is the cheapest falsifier of the p-scaling half of the law.'
    - metric: >-
        positive_control_rate: fraction of curves with j(E) in F_p returning delta_L = 1
      direction: higher
      minimum_effect: >-
        'EXACTLY 1.000. Forced: j in F_p implies E ~ E^{(p)} and the identity is separable of
        degree 1. Below 1.000 is an implementation defect and NO negative result may be
        reported from that cell.'
    - metric: >-
        envelope_violations: count of curves with delta_L(E) > 4^{k(E)}, k = 2-isogeny
        distance to the nearest F_p-rational vertex
      direction: lower
      minimum_effect: >-
        'EXACTLY 0. Derived with an explicit witness. One violation halts the run before any
        slope is reported and forces either a superseding correction to the derivation or an
        implementation repair.'
    - metric: >-
        graded_monotonicity: median delta_L per distance shell k = 0, 1, 2, 3, ...
      direction: higher
      minimum_effect: >-
        'Non-decreasing in k across at least 3 interior shells, with the 4^k envelope
        satisfied in every shell. A non-monotone median localises the defect to a named
        shell instead of leaving "the law did not fit".'
    - metric: >-
        smoothness_gap_drift: max/min over the D window of the ratio F_L(D) / F_L_predicted(D)
      direction: lower
      minimum_effect: >-
