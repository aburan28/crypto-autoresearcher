        and relation collection 2^{2n/3} poly(n) at polynomial memory

  predictions:
    - metric: >-
        r_4(n, l) = verified W_4 refutations among unsatisfiable inner
        instances at each approved cell (CP95 exact), 60 instances per cell
      direction: different
      minimum_effect: >-
        E-BOUNDED iff r_4 >= 0.90 at every ladder cell including (35,12) and
        (41,14); E-DECAY iff r_4 <= 0.50 at any cell where it was >= 0.90 at a
        smaller cell; E-DRIFT iff the least refuting rung at (35,12) or (41,14)
        is >= 5 on >= 50 percent of instances. Honest prior carried from the
        idea: about 0.45 on E-BOUNDED. Only (23,8) and (35,12) are authorized.
    - metric: >-
        null_rung(n, l) = least refuting rung of the same-support random inner
        system, 30 draws per cell
      direction: different
      minimum_effect: >-
        Predicted to equal the Stage-0 counting rung (4 at (23,8); 4 or 5 at
        (29,10); 5 at (35,12), (41,14); 6 at (47,16)); S_3-ABOVE-NULL at a cell
        iff the object's CP95 lower bound at W_4 exceeds the null's CP95 upper
        bound at W_4.
    - metric: >-
        r_3(n, l) = verified W_3 refutations (the structural rung on cells
        where degree 4 is generic by counting)
      direction: different
      minimum_effect: >-
        Reported; E-W3 iff r_3 >= 0.50 at (17,6) and (23,8). No direction
        preferred (c3a917's 3 of 3 is a located observation). Only (23,8) is
        authorized; (17,6) is a Stage-2 cell.
    - metric: refuted satisfiable inner controls (count)
      direction: same
      minimum_effect: 'exactly 0 by Proposition S; any refutation voids the run.'
    - metric: >-
        measured per-node C_W (mean ops_to_1 on verified-refuted object
        instances, GF(2) word operations) against the Stage-0 size law
