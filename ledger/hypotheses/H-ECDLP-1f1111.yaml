  falsification_conditions:
    - 'E-BOUNDED falsified iff r_4 <= 0.50 at (35,12) or (41,14) (verified refutations only; evaluable at (35,12) in the approved cells).'
    - 'E-DRIFT falsified iff the least refuting rung is <= 4 on >= 90 percent of unsatisfiable inner instances at both (35,12) and (41,14) (needs (41,14): NOT evaluable in the approved cells).'
