  interpretation_limits:
    - >-
      CLAIM TIER toy. Nothing at n = 131 is measured; l* and the 2^{2n/3} row
      are extrapolations under H2 and are labelled so wherever they appear.
    - >-
      THIS DOES NOT TOUCH THE PRODUCT LAW ON ECC2K-130. At m = 3 the free-oracle
      floor 2^68.58 exceeds rho's 2^60.81 (KN-FIND-aa2efc, unreviewed in this
      program), so no m = 3 oracle, this one included, reaches the challenge; at
      m = 4 the pipeline is dead by tens of bits. The record changes the
      per-attempt EXPONENT within the binary family, not the verdict on any
      deployed curve.
    - >-
      A W_D non-refutation is a degree-D statement, never a hardness claim; a
      refutation rate is not a solve.
    - >-
      RATE IS NOT EXPONENT (Coordinator-derived). E-BOUNDED at 60 instances per
      cell bounds the rate (CP95 lower bound at 60/60 is 0.025^(1/60), about
      0.9404, derived by formula, recomputed in Stage 0) but cannot exclude a
      constant non-refuted fraction, which leaves the per-attempt exponent at
      2 l. A positive Stage-1 outcome is NECESSARY, NOT SUFFICIENT, for the
      exponent law; E-DRIFT / E-DECAY / a falsified E-BOUNDED are conclusive
      only within the stated cells and certificates.
    - >-
      Not evidence for or against Semaev's Assumption 1 as stated for the
      chained system: the inner object is m = 2 and the closure is a
      Macaulay-type closure, not an F4 step degree. It is a direct test of the
      bounded-degree premise at m = 2 off the diagonal (the disputed territory
      of KR-IC-889857).
    - >-
      At (23,8) a high r_4 carries no structural content (degree 4 is generic
      by counting); only the W_3 rung there and the (35,12) cell can see
      structure.
    - >-
      Two or three cells are not a trend (KN-FIND-c3a917); one curve per n; the
      polynomial basis only; nothing transfers to prime fields or non-subspace
      V (KN-OPEN-020 scoped-out class, not escaped).
    - >-
      Design and protocol approval only until Stage 0-1 runs exist. Stage 2 (the
      wrapper over m - 2 legs), the (m = 3) per-attempt cost law, H3 validation
      and any SAT/SMT work are NOT authorized. The cells (29,10), (41,14) and
      (47,16) are NOT authorized.

  promotion_gates:
    status: >-
      None of the four asymptotic-complexity promotion gates is satisfied: no
      archived lemma decomposition, H2 / H2-TAIL / H3 unvalidated, no
      concrete-cost table at standardized parameters, no independent
      review-xhigh and red-team pass. The claim may reach `analyzed` at most and
