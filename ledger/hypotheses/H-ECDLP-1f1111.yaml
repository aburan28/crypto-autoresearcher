# =============================================================================
# H-ECDLP-1f1111 -- Is the refuting degree of the m = 2 inner Semaev S_3
# object bounded (rung W_4, rate >= 0.90) along the OFF-DIAGONAL ray n = 3 l,
# or does it drift / decay with the cell as the same-support semi-regular null
# does?  The one assumption (H2) carrying the only exponent claim of
# IDEA-20260930-b26bbc.
#
# Specified and approved (protocol form only) under DEC-20261002-dd642f from
# IDEA-20260930-b26bbc under RQ-ECDLP-f0a7b0. No goal owns the question.
#
# ZERO RUNS in this design packet. The IDEA's claim text is immutable and is not
# edited; this hypothesis cites it, copies its thresholds verbatim, and adds
# only operational detail. Stages 0-1 on the cells (23,8) and (35,12) are
# approved; Stage 2 (the m = 3 wrapper) and any SAT/SMT work are NOT designed or
# approved here.
# =============================================================================
hypothesis:
  id: H-ECDLP-1f1111
  question_id: RQ-ECDLP-f0a7b0
  source_idea: IDEA-20260930-b26bbc
  derived_from_idea: IDEA-20260930-b26bbc
  experiment_id: EXP-ECDLP-7d2a86
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    No goal owns RQ-ECDLP-f0a7b0, so no goal head is edited and no checkpoint is
    owed. The idea's alternative routing (under RQ-CERTBIN-836ce2 by the
    DEC-20260924-4f8a03 ownership rule, GOAL-ECDLP2M-001) was considered and
    not taken, because that goal's queue currently has an integrity defect (a
    decision record owned by two tasks) and this design touches no goal head.
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-dd642f
  proposed_by: coordinator
  title: >-
    Off-diagonal persistence ladder of the degree-4 mutant refutation of the
    certified m = 2 inner object S_3(x_1, x_2, u) = 0 (V = {deg < l}, n = 3 l):
    E-BOUNDED versus E-DRIFT / E-DECAY at the cells (23, 8) and (35, 12),
    with W_3 rung, same-support null, planted-satisfiable, deliberately easy and
    random-u controls

  statement: >-
    SETTING. F = F_2[t]/(f) with f the least irreducible polynomial of degree n
    (least integer value, bit i = coefficient of t^i); one ordinary curve per n
    y^2 + xy = x^3 + A x^2 + B drawn by a seeded rule (A, B and #E recorded);
    V = {deg < l} in the polynomial basis; B_fb = {P : x(P) in V}, closed under
    negation. For R in the odd-order subgroup and P_3 in B_fb the INNER INSTANCE
    is the Weil-descended Boolean system of S_3(x_1, x_2, u) = 0 with
    u = x(R - P_3): 2 l variables, n equations of Boolean degree 2. It is
    satisfiable iff u is the abscissa of a sum of two elements of B_fb
    (ENCODING; Semaev's S_3 and closure of B_fb under negation).

    CLAIMS UNDER TEST (all scoped to the approved cells, the tested curves, V,
    the pinned closure engine and the 3 GB cap):
    (S) SOUNDNESS, exact: for every inner instance and every D, 1 in W_D implies
    unsatisfiable (Proposition S of IDEA-20260923-5d0b8e). Tested as: 0
    refutations of any satisfiable instance.
    (B) E-BOUNDED (cell reading): the verified W_4 refutation rate r_4 among
    unsatisfiable inner instances is >= 0.90 at (23, 8) and (35, 12), with the
    same-support null at its Stage-0 counting rung and 0 refuted satisfiable
    controls. (23, 8) is a cell where degree 4 is GENERIC by counting
    (3151 rows >= 2517 columns), so a high r_4 there carries no structural
    content; (35, 12) is the first approved cell where it is not (10535 rows <
    12951 columns, semi-regular reference D_reg = 5).
    (D) E-DRIFT / E-DECAY (the competing readings): the least refuting rung
    rises with the cell as the null's does (r_4 <= 0.50 at (35, 12) is
    equivalent to rung >= 5 on >= 50 percent), or r_4 falls with l from >= 0.90
    to <= 0.50.
    (X) EXPONENT, CONDITIONAL AND NOT TESTED HERE: IF the refuting degree stays
    bounded along n = 3 l then the m = 3 per-attempt exponent is
    (m-2) l + O(log l) instead of (m-1) l. This is H2's extrapolation and is
    labelled as such wherever it appears. SEE interpretation_limits: a rate of
    0.90 is NOT sufficient for the exponent; the exponent needs the non-refuted
    fraction to be at most poly(l) 2^{-l} (derived by the Coordinator from the
    idea's own cost formula), which Stage 1 cannot resolve.

    TEST BOUNDARY. Stage 0 (zero-run: counting table, size law and l* under H2,
    power table, the inner-target stream rule) and Stage 1 on exactly the cells
    (23, 8) and (35, 12). The cells (29, 10), (41, 14) and optional (47, 16) of
    the idea's ladder carry the same thresholds, pre-registered here, but their
    execution is NOT authorized by this design; they are unlocked only by an
    additive protocol_amendment citing a committed Coordinator decision. The
    full E-BOUNDED row of the idea needs (41, 14); the approved cells can issue
    E-BOUNDED-PARTIAL, E-DRIFT-SUPPORTED, E-DECAY, INTERMEDIATE, ARTIFACT or
    NOT-DISCRIMINATING (see the experiment's decision rules).

  statement_note: >-
    IDEA-20260930-b26bbc's claim text is immutable and left at status proposed.
    Every threshold below is copied from its minimal_test, predictions and
    falsification_conditions. One ambiguity of the idea was resolved by a
    deterministic rule fixed before any run and recorded in the experiment's
    local_ambiguity_rules (LA-1): "rate >= 0.90 (CP95)" is decided on the POINT
    estimate (as the predictions block states) with the strict CP95-lower-bound
    reading reported beside it. The idea's rule that UNDETERMINED(budget) on more
    than 20 percent of a cell's instances at the primary rung voids the outcome
    is carried verbatim (applied to the run, LA-2).

  mechanism: >-
    OBJECT FRAME (carried from the idea). Representation R1: Boolean
    coordinates of the legs in a basis of V. The relation-search object is
    unchanged (Class I partial action under translation by factor-base elements);
    no group-structure claim. The solver-side tracked object is the LABEL of a
    depth-l node: for the prefix P_3 the pair (refuted at rung D | not refuted |
    satisfiable, certificate). Operation set Sigma: restriction (fix one leg by
    group arithmetic; exact because B_fb is closed under negation) followed by
    the D-bounded ring action of B = F_2[v]/(v_i^2 + v_i) on the inner ideal
    (W_D). Trichotomy: coordinate-dependent in the weak sense of Proposition B
    of IDEA-20260926-917981 (closure depends on the SET V and on u). Lossy
    projection test: the label discards the inner system, the closure and the
    identity of P_3, keeping one symbol and one certificate; Sigma-compatible
    because W_D is closed under the D-bounded action and the label is a
    deterministic function of (V, u, D); genuinely lossy because distinct
    prefixes collapse to the same label.

    WHY THE LADDER IS THE DISCRIMINATOR. The certified cells (KN-FIND-5a8d3e at
    n = 17, l = 9; KN-FIND-c3a917 at n = 19, l = 10) sit on Semaev's diagonal
    n = 2 l - 1. At l = n/3 the inner system is overdetermined (n = 3 l
    equations in 2 l unknowns). By counting alone the plain degree-4 Macaulay
    matrix has n C(2l, <= 2) rows against C(2l, <= 4) columns, rows >= columns
    for l <= 8, so at (23, 8) the null is refuted at degree 4 by
    overdetermination with no structure needed. Structure is visible only at
    rung D = 3 on toy cells and at D = 4 where rows < columns, first at (35, 12).
    The semi-regular reference D_reg of the null, from the series
    (1+z)^{2l}/(1+z^2)^n (first non-positive coefficient), is 4 at (23, 8) and
    5 at (35, 12) (idea's figures; the Coordinator re-checked the coefficients
    by hand for (23,8), (29,10), (35,12), (41,14), (47,16) and (12,17); Stage 0
    recomputes them in the engine's own arithmetic).

    WHAT THE CERTIFIED m = 2 RESULTS DO AND DO NOT SAY (boundaries inherited
    from KN-FIND-5a8d3e section 3-4 and KN-FIND-c3a917 section 2, 4): the W_4
    refutation there is carried by degree-2 falls in the convolution tensor's
    neighbourhood and is NOT S_3-specific at W_4; flat (mu, k) certificates do
    not certify W_4 membership unless max degree of mu is <= 2. This design
    therefore counts a W_D refutation only with a degree-disciplined wdag-v1
    certificate verified by separate-process code, and counts a W_4
    non-refutation as adverse evidence only with an ann-v1 annihilator
    certificate (or worst-case, see the experiment).

    OFF-LIMITS COMPONENT DECLARED (docs/object-frame-ideation.md section 2): F2
    is the family; V = {deg < l} lies inside KN-OPEN-020's scoped-out class and
    is not escaped.

  assumptions:
    - >-
      Satisfiability of every inner instance is decided by an exact enumeration
      oracle (oracle A: 2^l quadratic root-findings, cross-checked by
      exhaustive 2^{2l} evaluation by the separate-process verifier); a closure
      never decides satisfiability.
    - >-
      The inner target u = x(R - P_3) is an abscissa of a full-group element;
      the certified cells used x(2E) subgroup targets and uniform field
      elements, so the u-distribution is a declared transfer (H1), not an
      assumption of identity. The random-u arm measures it.
    - >-
      The GF(2) closure engine (experiments/EXP-CERTBIN-e94b27/impl/closure.py
      with macaulay.py) is generic in (nv, D, neq) and is used UNCHANGED, pinned
      by sha256; the inner-instance builder, ladder driver, wdag-v1 / ann-v1
      extractors, ops counters and the verifier are new code.
    - >-
      One curve per n (curve, cofactor and modulus change together along the
      ladder); a second curve per n is the first replication owed and is not in
      this design.
    - >-
      OFF-LIMITS COMPONENT: F2 as the family; V inside KN-OPEN-020's scoped-out
      class; nothing here escapes it.
    - >-
      Uses F_{2^n} arithmetic and point counting written in this experiment;
      no deployed curve, no live key, no discrete logarithm attempted.

  proof_search_map:
    bottleneck: >-
      Whether the refuting degree of the unsatisfiable m = 2 inner object stays
      bounded (D <= 4) as (n, l) grow along n = 3 l, with rate near 1. Only
      that fact converts the per-attempt cost from 2^{(m-1) l} to
      2^{(m-2) l} poly(l); without it nothing in the idea moves. COORDINATOR
      REFINEMENT (derived, see quantifier_order and interpretation_limits):
      the exponent needs the non-refuted fraction (or a bounded-degree fallback
      for it), not merely a rate >= 0.90.
    baseline_embedding:
      parameter_slice: >-
        The archived m = 2 cells (n, l) = (17, 9) and (19, 10) are the exact
        slice where the inner theory is known to refute 386/386 and 400/400.
        The instrument must reproduce, before any new cell is read (C-BASE),
        the archived W_4 labels, iteration counts and dimensions of
        RUN-CERTBIN-c417e0 on the 10 lowest-idx U62 and 5 lowest-idx S62 systems
        (15), and the new inner-instance builder must reproduce the archived
        descended equations (macaulay.descended_E of the pinned copy) on those 15
        archived targets. The idea's C-LOOP belongs to the Stage-2 wrapper and is
        deferred with it.
      reproduction_check: >-
        C-BASE exact match on 15 systems (both the engine labels and the
        builder equations); C-FIX: Closure(nv, D, neq) row and column counts
        equal the Stage-0 table at (18, 4, 17), (16, 3/4/5, 23) and
        (24, 3/4/5, 35); Stage-0 table of semi-regular references and row/column
        counts committed (hash-recorded) before any closure runs and compared to
        the engine's own counts: (12,17):4, 1343/794; (14,19):4, 2014/1471;
        (16,23):4, 3151/2517; (20,29):4, 6119/6196; (24,35):5, 10535/12951;
        (28,41):5, 16687/24158; (32,47):6, 24863/41449; (18,17):5 (pairs are
        (nv, neq); D_reg then rows/columns at D = 4). The Coordinator
        recomputed the row/column counts and the D_reg of (12,17), (16,23),
        (20,29), (24,35), (28,41), (32,47) by hand and found them equal to the
        idea's figures; Stage 0 is the authoritative recomputation.
    observation_collision:
      observable: >-
        Per inner instance: exact sat flag and solution count, the least
        refuting rung (least degree D in {3, 4, 5} with a verified refutation
        by M_D or W_D; '>5' if none of those run refutes), the first iteration
        containing 1, ops_to_1 and ops_to_fix (GF(2) 64-bit-word XOR
        operations), and the degree-disciplined certificate.
      distinct_preimage_search: >-
        A high W_4 rate can come from (i) structure of the S_3 descent,
        (ii) overdetermination (rows >= columns at degree 4: true at (23, 8)),
        or (iii) an unsound instrument. (iii) is excluded by Proposition S plus
        the planted and natural satisfiable controls (any refutation voids the
        run). (ii) is separated by the same-support null AND by the cell where
        rows < columns at degree 4 ((35, 12)); a rate that tracks the null's is
        reading (ii). (i) is what remains and is the only reading that carries
        an exponent. Known collision inherited from KN-FIND-c3a917: the
        refutation is carried by the quadratic tensor's neighbourhood and is not
        S_3-specific at W_4, so 'S_3-ABOVE-NULL' means 'not semi-regular and
        its falls suffice', nothing more; the nearby object separating tensor
        from curve (N-CONV, same exact tensor with random lower part) is NOT in
        this design and is named as a candidate follow-up.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'decide the two-leg residual by enumerating one leg' by '1 lies
          in W_D of the 2l-variable Boolean ideal'. Separate obligations:
          ENCODING, COMPLETENESS (non-refuted instances go to oracle A),
          SOUNDNESS (certificates re-verified by the separate-process checker),
          TRANSFER (declared unmet beyond the tested cells; H2 carries it), COST
          LOSS (at toy cells the closure loses to oracle A by orders of
          magnitude; the gain is asymptotic).
        predicted_gain: >-
          Per-attempt exponent (m-2) l + O(log l) against (m-1) l, conditional
          on H2 AND on the non-refuted fraction being <= poly(l) 2^{-l}; zero at
          toy scale.
      - transform: specialization_pack
        proposed_object: >-
          Per-attempt cost split over disjoint node classes (refuted at rung D,
          missed, satisfiable). The per-node constants (ops_to_1, ops_to_fix,
          oracle A cost) are measured at Stage 1; the per-attempt law and the
          wrapper are Stage 2 and are not designed here.
        predicted_gain: >-
          Measured constants from which l* is computed under H2 and labelled an
          extrapolation (Stage 0 prepares the formula; Stage 1 supplies c_W).
    quantifier_order: >-
      Soundness: FORALL inner instances, FORALL D, 1 in W_D implies unsatisfiable
      (exact). The exponent claim of the idea: EXISTS a constant D_0 (claimed 4)
      such that FORALL cells (n, l) on the ray n = 3 l in the tested range, the
      fraction of unsatisfiable inner instances refuted at W_{D_0} is >= 0.9;
      the witness D_0 may NOT depend on the cell. The weaker order (for each
      cell there exists a D) is generic and carries no exponent. The quantifier
      at risk is the one over cells, and the ladder attacks it; this design
      measures two cells of it. COORDINATOR-DERIVED GAP, not in the idea: the
      per-attempt cost is 2^l (c_group + C_W) + (1 - r_D) 2^l 2^l c_A (the
      idea's own formula), so the exponent l + O(log l) needs
      (1 - r_D) <= poly(l) 2^{-l}, i.e. a TAIL statement over 2^l inner
      instances per attempt, or a bounded-degree fallback (a constant D_1 > D_0
      refuting the non-refuted remainder at polynomial cost). A rate of 0.90 at
      60 instances leaves the exponent at 2 l with a constant-factor gain. H2 as
      worded by the idea does not state this tail; it is recorded as the
      derived requirement H2-TAIL below.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At the cells (23,8) and (35,12) [and, if later authorized by
        amendment, (29,10), (41,14), (47,16)] the unsatisfiable m = 2 inner
        objects are refuted at the rungs and rates stated, each counted
        refutation by a verified wdag-v1 certificate, each counted W_4
        non-refutation of an object or null instance backed by an ann-v1
        certificate or counted adversely, with null rates and satisfiable-control
        counts as stated; the Stage-0 table, size law and l* under H2 are
        (computed).' It certifies nothing beyond the tested cells, nothing about
        F4 step degree, nothing at n = 131, nothing about the m = 3 wrapper or
        per-attempt cost, and no change to any ECDLP cost.
      nearby_object_control: >-
        The same-support random inner system at each cell (predicted refuted
        only at its own counting rung) is the object on which the
        bounded-degree conclusion must fail; the planted satisfiable inner
        instance (refutation must fail by theorem); the deliberately easy object
        (inner system plus l random affine relations, which every rung that
        completes must refute). The random-u arm separates the transfer H1.
    proof_obligations:
      - claim: >-
          R = P_1 + P_2 + P_3 with P_i in B_fb iff there is P_3 in B_fb such
          that x(R - P_3) is the abscissa of a sum of two elements of B_fb; the
          inner Boolean system is satisfiable iff the latter holds.
        responsibility: correctness
      - claim: >-
          Proposition S applies to the inner system with field equations
          (radical, zero-dimensional over F_2), so every refutation is sound.
        responsibility: correctness
      - claim: >-
          The Stage-0 counts (rows, columns, semi-regular references) are as
          tabulated and the engine's counts agree.
        responsibility: size
      - claim: >-
          C_W(n, l) is polynomial in l at fixed D (columns C(2l, <= D)); the
          size law's constant is measured per cell in GF(2) word operations.
        responsibility: runtime
      - claim: >-
          The W_4 working set at l = 44 is about 1.2 x 10^12 bits (idea's
          estimate; the Coordinator re-derived n C(2l,<=2) x C(2l,<=4) bits at
          n = 132, l = 44 as about 1.27 x 10^12); memory is polynomial but not
          negligible and is disclosed.
        responsibility: memory
      - claim: >-
          Every counted refutation has a verified wdag-v1 certificate and every
          adverse non-refutation an ann-v1 certificate or the worst-case
          counting rule.
        responsibility: correctness
      - claim: >-
          Nothing transfers to prime fields, to non-subspace V, to n = 131
          except by the labelled extrapolation under H2.
        responsibility: scope
      - claim: >-
          The relation-collection charge 6 x 2^{n-l} C_W and the Poisson half
          (H3) are heuristic-conditional and are NOT validated here (Stage 2).
        responsibility: success_probability
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      binary-field point decomposition at m = 3 over a subspace factor base:
      per-attempt cost and relation-collection cost (RQ-ECDLP-f0a7b0; bears on
      RQ-SATIC-1ae57a decision target (b))
    prior_best: >-
      loop at 2^{(m-1) l} per attempt and 3 x 2^n relation collection at poly
      memory (IDEA-20260904-96c4f3); SAT ceiling 2^{ml}/m!; pair table 2^{2n/3}
      at 2^{2n/3} memory; ECDLP: rho at 0.886 x 2^{n/2}
    time_exponent: >-
      per attempt l + O(log l) CONDITIONAL on H2 and H2-TAIL (D_0 = 4) against
      2 l; relation collection 2^{2n/3} poly(n) at poly memory; rho unchanged.
      NEVER BELOW n/2. NOT TESTED by this experiment (extrapolation).
    memory_exponent: polynomial (about 1.2 x 10^12 bits at l = 44, idea estimate)
    hidden_cofactor: >-
      a degree-11 polynomial in l with constant about 0.04 word operations
      (idea's arithmetic, re-derived in Stage 0); crossover l* about 50 under an
      implied per-node loop cost of about 1.8 x 10^2 word operations (derived by
      the Coordinator from the idea's two figures; the idea does not state the
      unit; Stage 0 recomputes l* against a declared per-node constant)
    claim_kind: per_attempt_exponent_conditional_on_H2

  heuristic_assumptions:
    - id: HEUR-ECDLP-1f1111-H1
      formal_statement: >-
        (Inner-target transfer.) The W_D refutation rate on unsatisfiable inner
        instances with target u = x(R - P_3), R uniform in the odd-order
        subgroup and P_3 uniform in B_fb, equals the rate on uniform-u instances
        at the same (n, l, V, curve) to within 0.05.
      random_model_justification: >-
        Imitates the uniform-x_R arm of KN-FIND-c3a917 (600/600 across three
        strata, no x(2E) modulation measurable at W_4); the rigorous ingredient
        is Proposition B of IDEA-20260926-917981 (closure depends only on the
        set V and u), so the only free quantity is the distribution of u.
      supporting_results:
        - KN-FIND-c3a917 (uniform-x_R arm, internal)
        - IDEA-20260926-917981 Proposition B (internal)
      validation_experiment_ids:
        - EXP-ECDLP-7d2a86
      validation_plan: >-
        SAMPLE a random-u arm (u uniform in F_{2^n}, 30 unsatisfiable instances)
        at each approved cell beside the inner-target arm; COMPARE r_4 by exact
        CP95 overlap; TAIL: report the maximum least refuting rung over the
        inner-target arm against the random-u arm. TRANSFER: none beyond the
        tested cells. NOTE (derived): within-0.05 is not resolvable at 60 and 30
        instances; only CP95 overlap is decidable, and the record says so.
      falsification_condition: >-
        CP95 intervals of r_4 (inner-target arm) and r_4 (random-u arm) do not
        overlap at a cell.
    - id: HEUR-ECDLP-1f1111-H2
      formal_statement: >-
        (Bounded refuting degree along the ray.) There is a constant D_0
        (claimed 4) such that, for the m = 2 S_3 descent with V = {deg < l} and
        n = 3 l, the fraction of unsatisfiable instances with 1 in W_{D_0} is
        >= 0.9 for every l in the tested range, and, as the extrapolation the
        exponent needs, for all l.
      random_model_justification: >-
        Rigorous ingredient: W_D is sound (Proposition S) and its column count
        C(2l, <= D_0) is polynomial in l. Published statement imitated
        (recalled, conditions not checked): bounded last fall degree of
        Weil-descended systems independently of n (Huang-Kosters-Yeo as
        abstracted in KR-IC-fbdb61 / KN-LIT-7607), with the two certified
        cells. Known failure: KN-FIND-c3a917 section 3 shows plain M_4
        persistence is FALSE between n = 17 and 19 (0.839 to 0) while W_4
        persistence held; KR-IC-889857 records the first-fall premise as
        disputed. H2 is the assumption most likely to fail.
      supporting_results:
        - KN-FIND-5a8d3e (386/386 at n = 17, l = 9, diagonal, internal)
        - KN-FIND-c3a917 (400/400 and 600/600 at n = 19, l = 10, diagonal, internal)
      validation_experiment_ids:
        - EXP-ECDLP-7d2a86
      validation_plan: >-
        SAMPLE the cells (23, 8) and (35, 12) with 60 unsatisfiable inner
        instances each (cells (29,10), (41,14), (47,16) pre-registered, not
        authorized); COMPARE the least refuting rung against the null's counting
        rung per cell and against the constant-D_0 model; TAIL: report the
        maximum least-refuting rung per cell and the fraction UNDETERMINED
        (budget). Extrapolation to l = 44 (n = 131) is stated as extrapolation
        everywhere; the (53, 18) cell is the next step only if the full ladder
        returns E-BOUNDED.
      falsification_condition: >-
        r_4 <= 0.50 at (35, 12) (verified refutations only, adverse
        non-refutations by the worst-case rule); recorded in the experiment's
        decision rules EB-DR-4.
    - id: HEUR-ECDLP-1f1111-H2-TAIL
      formal_statement: >-
        (Derived by the Coordinator from the idea's own cost formula; NOT in the
        idea.) The exponent l + O(log l) additionally needs the fraction of
        unsatisfiable inner instances NOT refuted at the chosen bounded rung to
        be at most poly(l) 2^{-l}, or a bounded-degree fallback that refutes the
        remainder at polynomial cost.
      random_model_justification: >-
        Per-attempt cost 2^l (c_group + C_W) + (1 - r_D) 2^l 2^l c_A: the second
        term is 2^{2l} (1 - r_D) c_A, so a constant (1 - r_D) leaves the
        exponent at 2 l.
      supporting_results:
        - IDEA-20260930-b26bbc claim, THE EXPONENT, CONDITIONAL (internal)
      validation_experiment_ids: []
      validation_plan: >-
        Not testable at Stage 1: 95 percent exclusion of a non-refuted fraction
        2^{-l} needs about 3 x 2^l zero-failure samples (rule of three; derived:
        768 at l = 8, 12288 at l = 12, to be recomputed exactly in Stage 0's
        power table). Stage 1 reports the rung distribution (which feeds a
        bounded-fallback reading) and the exact CP95 of every rate. A candidate
        tail test is named for a later decision, not designed here.
      falsification_condition: >-
        Not falsifiable at Stage 1; a measured non-refuted fraction bounded away
        from zero as l grows (with no bounded fallback) falsifies the exponent
        reading while leaving E-BOUNDED's rate statement intact.
    - id: HEUR-ECDLP-1f1111-H3
      formal_statement: >-
        (Poisson decomposition probability.) For uniform R the number of m = 3
        decompositions over B_fb is Poisson with mean C(|B_fb|+2, 3)/N, so the
        target count for 2^l relations is 6 x 2^{n - 2l} (1 + o(1)).
      random_model_justification: >-
        KN-FIND-007's conservation identity fixes the mean exactly; the Poisson
        half is the standard occupancy heuristic (Diem) with the concentration
        failure mode KN-FIND-007 measured for additive bases.
      supporting_results:
        - KN-FIND-007 (internal)
      validation_experiment_ids: []
      validation_plan: >-
        SCHEDULED, NOT DESIGNED HERE: the idea's validation (exact
        decomposition-count distribution by the (m-1)-loop at the wrapper cells,
        100 attempts each, chi-squared against Poisson, maximum count per
        target) belongs to Stage 2, which is designed only after Stage 1 returns
        E-BOUNDED. H3 is not used by any Stage-0/1 decision.
      falsification_condition: >-
        Chi-squared rejection of Poisson on the loop's count histogram (Stage 2).

