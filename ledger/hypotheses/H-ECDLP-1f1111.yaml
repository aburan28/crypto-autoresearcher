  dominated_by: >-
    CHECKED. On the ECDLP, rho / van Oorschot-Wiener at 0.886 x 2^{n/2}
    dominates every row here on time and memory at every n. On relation
    collection in this family the pair-table row (2^{2n/3} time and memory) ties
    the idea's CONDITIONAL time exponent at exponential memory; the loop
    dominates on memory. At toy scale the loop dominates the pipeline on every
    axis by orders of magnitude. On ECC2K-130 the product law closes m = 3
    regardless. Honest Pareto statement: 'a conditional new row at
    (2^{2n/3} poly, poly memory), dominated by rho', and only if H2 and
    H2-TAIL hold.
  sota_delta:
    time: >-
      Zero on the ECDLP. Within the binary subspace-base family and conditional
      on H2 and H2-TAIL: per-attempt exponent (m-2) l + O(log l) against
      (m-1) l. At toy scale: negative by the closure's constant. NOTHING IN
      STAGE 0-1 MEASURES A COST DELTA.
    memory: >-
      Polynomial against the pair table's 2^{2n/3} at the same conditional time
      exponent; against the loop, polynomial instead of O(1).
    data_queries: Not applicable.

  distinguishable_outcomes:
    e_bounded_partial: >-
      r_4 >= 0.90 at (23,8) and (35,12), null at its counting rung at both,
      0 refuted satisfiable controls: H2 survives its first off-diagonal test at
      the first approved cell where degree 4 is not generic; the (29,10) /
      (41,14) extension is the next gate; the full E-BOUNDED row is not issued.
    e_drift_supported: >-
      the least refuting rung at (35,12) is >= 5 on >= 50 percent of unsatisfiable
      inner instances (r_4 <= 0.50, adverse non-refutations certified or
      counted worst-case): the refutation seen at n = 17, 19 was
      overdetermination or diagonal structure, not a bounded-degree property
      along the ray; E-BOUNDED is falsified.
    e_decay: >-
      r_4 falls from >= 0.90 at (23,8) to <= 0.50 at (35,12).
    intermediate: >-
      0.50 < r_4 < 0.90 at (35,12): no outcome-table row fires; neither
      E-BOUNDED nor E-DRIFT is established or falsified; reported with the rung
      distribution; a follow-up (second curve per n, larger N, cell extension)
      is a new decision.
    not_discriminating: >-
      the null is refuted at W_4 at (35,12) (not at its counting rung) or its
      refutation tracks the object's: readings (i) and (ii) are not separated at
      that cell.
    artifact: >-
      any refuted satisfiable control, any failed certificate, C-BASE mismatch,
      easy control not refuted at a completed rung, instrument-identity mismatch:
      the run is void; UNDETERMINED(budget) on more than 20 percent of a cell's
      instances at W_4 (the primary rung): void, carried verbatim from the idea.
      A void run says nothing (AGENTS.md rule 3).
    infrastructure: >-
      Crash, timeout, memory abort, environment restart: failed_infrastructure,
      never a mathematical miss.

