  statement: >-
    The integer 15 has binary weight 4. Its non-adjacent digits,
    from low to high, are -1, 0, 0, 0, 1, so that weight is 2.
    Four exceeds two by 2. The product of the two weights is 8.
    Their sum is 6. The binary length is 4 and the non-adjacent
    length is 5. Five exceeds four by 1. Two readings of the
    non-adjacent weight are both 2, so that gap is 0 and their
    product is 4.
  mechanism: >-
    The proposal writes the integer 15 and the weights 4 and 2.
    This contract checks those integers. It does not add a curve
    point.
