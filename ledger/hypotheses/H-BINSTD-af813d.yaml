    exponents differ by 3/10 and by 721/10. Also 8 * 100^{10} is
    strictly above 123^{10} and strictly below 124^{10}, so 2^{3/10}
    lies strictly between 123/100 and 124/100. The gap 721/10 is
    strictly above 72, strictly below 73, and strictly above 50.
