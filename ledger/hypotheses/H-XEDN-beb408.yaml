hypothesis:
  id: H-XEDN-beb408
  question_id: RQ-XEDN-003

  statement: >-
    SCOPE: Weierstrass parameter space of y^2 = x^3 + a(t)x + b(t) over F_p(t)
    with deg a <= 4, deg b = 6, p in {7,13,19,31}; prescribed section shapes
    deg x <= 2, deg y <= 3; k in {1,2,3,4,5} prescribed sections. CLAIM TIER toy.
    NO ATTACK, NO EXPONENT CLAIMED FOR ANY ATTACK, NO CRYPTO-SCALE TRANSFER.
    THE HYPOTHESIS. Prescribing k section x-polynomials and solving for the
    surface is a system of exactly 7k scalar equations over F_p in exactly
    12 + 4k unknowns -- 5 for a, 7 for b, 4 for each y_i, with the x_i FIXED by
    the instance -- so the expected number of surfaces carrying a prescribed
    k-tuple is c_k * p^(12 - 3k) * (1 + o(1)) for a constant c_k depending only
    on k. Three consequences, all forced before any run:
    (C1) the measured exponents at k = 1..5 are 9, 6, 3, 0, -3;
    (C2) k = 4 is exactly the boundary of the free-plant regime, and every
    prescribed section beyond the fourth costs a factor p^3;
    (C3) that marginal p^3 coincides with the alpha = 3 this program already
    measured by an unrelated square-counting argument, recorded in
    DEC-20260724-021 as P_lift(p) = (1 - 2/p + p^-3)/(2 p^3).
    Further, the ATTACK-RELEVANT statistic is not the lane's global relation
    minimum but the PRESCRIBED-SUPPORT relation lattice
    L(S;Q) = {c in Z^k : sum c_i P_i = O}, whose minimal-support vectors have
    infinity norm in {1,2,3,4,6} by the affine-mark ceiling of H-XEDN-906489, and
    whose non-vanishing rate at k = 4 defines an exponent delta that is
    UNMEASURED and that this hypothesis exists to measure. The per-relation cost
    under the stated model is T(k,p) ~ 2^k * p^(max(0, 3(k-4))) * p^delta.
    NO VALUE OF delta IS PREDICTED. Predicting one without a derivation would be
    the failure this program's own records forbid.

  mechanism: >-
    DERIVED IN-REPO. Full derivation, confounders and Pareto accounting:
    ledger/proposals/IDEA-20260805-d426f9.yaml.

    (1) WHAT THE CONSUMER NEEDS. An index-calculus-style relation source must
    produce relations SUPPORTED ON PRESCRIBED POINTS. The XEDN lane's metric is a
    minimum over all relations among all enumerated sections; minimisation over a
    superset is monotone downward, so that metric neither bounds nor estimates
    L(S;Q). L(S;Q) can be {0} on a surface whose global relation lattice has rank
    8, and the global minimum is 1 on essentially every section-rich surface
    (H-XEDN-906489 P1). The two statistics are unrelated and the lane measured
    the one the attack does not consume.

    (2) THE COUNT. Fix prescribed x_1..x_k, each of degree <= 2 and each FIXED by
    the instance (they are the lifts of the target x-coordinates, not free
    parameters). Unknowns: a has 5 coefficients, b has 7 (deg b = 6 exactly),
    each y_i has 4 -- total 12 + 4k. Equations: y_i^2 = x_i^3 + a x_i + b is an
    identity of polynomials of degree at most 6, since deg x_i^3 <= 6,
    deg(a x_i) <= 6 and deg b = 6, hence 7 scalar equations per section -- total
    7k. The system is LINEAR in (a,b) at fixed (x_i,y_i) and QUADRATIC in each
    y_i. For a system behaving like a generic one of this shape the expected
    solution count is p^(12 + 4k - 7k) = p^(12 - 3k).

    (3) READING THE EXPONENT. k=1: p^9. k=2: p^6 -- ABUNDANT, AND THIS IS THE
    REGIME THE CENSUS SAMPLER ACTUALLY USES: EXP-XEDN-005's
    fiber_find_rich_surfaces draws two sections and solves
    a = ((y1^2 - x1^3) - (y2^2 - x2^3))/(x1 - x2), b = y1^2 - x1^3 - a x1, and it
    succeeds easily, which a 6-dimensional solution family explains. k=3: p^3.
    k=4: p^0, the exactly-determined boundary, O(1) surfaces per prescribed
    4-tuple. k=5: p^-3, about p^3 tuples per surface. Each further section
    multiplies by p^3.

    (4) THE CROSS-CHECK. That marginal p^3 is not new. DEC-20260724-021 measured,
    exhaustively and with an independently re-derived closed form on this very
    family, P_lift(p) = (1 - 2/p + p^-3)/(2 p^3), i.e. alpha = 3, by counting
    squares rather than parameters. Two unrelated derivations giving the same
    marginal exponent is either structure or coincidence, and separating them is
    cheap. Note further that (1 - 2/p + p^-3)/2 -> 1/2, so the same identity
    predicts an expected slot count of about 1/2 per uniformly drawn surface --
    which is the Burnside prediction of IDEA-20260805-4ed1b1 arriving by a third
    route. Three routes to one constant is a strong internal consistency signal
    and is recorded as such, not as proof.

    (5) THE CEILINGS. On a chi = 1 surface with irreducible fibres the
    Mordell-Weil lattice is E8, so at most 8 independent sections and at most 240
    sections of the free-x shape exist, absolutely and for every p. A relation
    supported on the prescribed set needs those sections to be DEPENDENT, hence
    k strictly greater than the rank of their span. With at most 4 free-plantable
    sections, a relation requires their span to have rank <= 3 -- a proper closed
    condition on the solution family whose probability is the unmeasured p^-delta.

    (6) THE ASSEMBLED PRICE, AND WHAT IT IS NOT. T(k,p) ~ 2^k * p^(max(0,3(k-4)))
    * p^delta, where 2^k is the square-class factor (each identity needs the
    relevant leading constant to be a quadratic residue; the census code tests
    both signs explicitly), p^(3(k-4)) is the dimension deficit, and p^delta
    prices dependence. Each factor is separately measurable, which is the point:
    it is the validation-ladder discipline of isolating every assumption the cost
    analysis rests on and measuring it where measurement is possible. T IS A
    PER-RELATION FIGURE. The consuming index calculus needs about B independent
    relations over a factor base of size B plus a linear-algebra stage this
    hypothesis does not model, and presenting T as an attack cost would be
    exactly the partial-cost error this program forbids.

    (7) WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. delta. There is no argument
    here for its value or even for it being a clean power of p. The system is
    visibly non-generic -- a and b are shared across all k identities, the
    equations are quadratic in y_i, and excess components are exactly what hidden
    structure would produce -- so both the p^(12-3k) count and the power-law form
    of the dependence rate are assumptions, numbered HEUR-P1 and HEUR-P2, each
    with its own falsification condition. Additionally, the specialisation of a
    Mordell-Weil relation to a relation among the target points requires good
    reduction and does not require injectivity to be automatic; that gap is
    DECLARED UNMET rather than deferred, and no arm claims a usable ECDLP
    relation was produced.

  assumptions:
    - >-
      The prescribed x_i are FIXED by the instance and are NOT free. If the lifts'
      x-polynomials may be chosen freely the count becomes 12 + 7k unknowns
      against 7k equations and every k is free -- which is the census sampler's
      situation and precisely not the attacker's. This distinction is the entire
      content of the word "prescribed" and every arm turns on it.
    - >-
      deg b = 6 exactly, so b's leading coefficient is nonzero and b contributes
      7 unknowns rather than 6.
    - >-
      Squarefree discriminant and chi = 1, so the ceilings 8 and 240 hold.
      Outside the window they do not, and no arm applies them there.
    - >-
      Genericity of the solution count is HEUR-P1 and is measured, not assumed.
    - >-
      Specialisation preserving a relation is NOT assumed. The deliverable is a
      cost, and the specialisation gap is declared unmet.
    - >-
      ENVIRONMENT, MEASURED THIS SESSION: numpy 2.4.6 present; sympy absent; sage
      absent. All arms are pure-Python integer and F_p arithmetic; the counting
      arm needs no elliptic-curve arithmetic at all, and the dependence arm needs
      a pure-Python group law over F_p(t). Any arm requiring a CAS is an
      infrastructure request, not an experiment (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      The success probability of producing ONE relation supported on prescribed
      points. Every cost statement about a function-field xedni relation source
      multiplies through it, and no record in this corpus contains it. The
      exponent 3(k-4) + delta is that bottleneck written down; measuring delta is
      the single step that converts the lane's six evidence records from an
      uncosted census into a priced construction.
    baseline_embedding:
      parameter_slice: >-
        k = 2, which is EXACTLY the census sampler's regime. The committed
        fiber_find_rich_surfaces in
        experiments/EXP-XEDN-005/implementation/run_census.sage is a working
        implementation of the k = 2 case with the same filters (a nonzero,
        deg a <= 4, deg b = 6, disc nonzero, j non-constant), and the committed
        raw results record how many pairs it consumed per surface found
        (fiber_pairs_budget, per-surface). That is the exact baseline the count
        must reproduce.
      reproduction_check: >-
        NUMERICAL AND COMMITTED, not visual. The k = 2 cell of the new counting
        arm must reproduce the committed sampler's yield under identical filters,
        within a stated factor. A count that predicts p^6 solutions but cannot
        reproduce a working sampler at k = 2 has not embedded the baseline and no
        other k may be reported.
    observation_collision:
      observable: >-
        The pair (does a surface exist for this prescribed tuple, is L(S;Q)
        nonzero).
      distinct_preimage_search: >-
        The collision hunted here is deliberate and is the null arm: prescribed
        x-tuples drawn UNIFORMLY at random, with no relation to any curve or
        target, versus x-tuples that are genuine lifts of target points. The
        parameter count cannot see where x_i came from, so it FORCES the two arms
        to have identical solution-count exponents. If they collide as predicted,
        the observable is confirmed to be a property of the parameter space and
        not of the instance -- which is the honest reading and bounds what the
        construction can ever reveal about a target. If they do NOT collide, the
        count is not the operative mechanism and something about the lifts is
        doing work, which would be a genuine discovery. Both outcomes are
        informative; the collision is the predicted one.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: THERE EXIST constants c_k, one for each k, such that
      FOR ALL primes p in the tested set and FOR ALL prescribed x-tuples drawn
      uniformly, the EXPECTED solution count is c_k p^(12-3k)(1+o(1)). The
      constants may depend on k but NOT on p and NOT on the tuple; that is the
      content. The weaker order -- for each tuple there exists a constant -- is
      trivially satisfiable and is explicitly NOT claimed. The distinction
      matters because a tuple-dependent constant would mean the count describes
      no family, and the experiment reports the full per-tuple histogram
      precisely so that tuple-dependence is visible rather than averaged away.
      Second quantifier note, on the cost: T(k,p) is an EXPECTATION over surface
      trials, not a bound for every instance, and no arm may restate it as a
      worst-case or as a guarantee.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a measured dimension law for a Weierstrass parameter space over
        four small primes, a measured dependence rate at k = 4, and a
        per-relation cost expression with every factor labelled measured,
        derived, or unmeasured. It CANNOT certify that the route works, cannot
        certify that it fails, cannot bound any attack, cannot move any exponent
        of the ECDLP, and cannot license any sentence on
        DEC-20260724-021's forbidden list. An extrapolation from p in {7..31} to
        cryptographic p is outside the method's ceiling and is not attempted.
      nearby_object_control: >-
        THE FREE-CHOICE COUNT, k unknowns instead of k fixed. Take the identical
        machinery and let the x_i be free (12 + 7k unknowns, 7k equations). The
        hoped-for conclusion -- that prescribing is expensive -- FAILS there by
        construction: every k is free and the exponent never goes negative. A
        method that returns the same exponents for prescribed and free x has not
        identified the load-bearing structure, and in that case no cost statement
        may be made. This control is exact, costs one extra sweep, and is the
        sharpest available test that the count is measuring prescription rather
        than the shape of the equations.
    proof_obligations:
      - claim: The identity y_i^2 = x_i^3 + a x_i + b is exactly 7 scalar equations under deg a <= 4, deg b = 6, deg x_i <= 2.
        responsibility: correctness
      - claim: Unknowns number exactly 12 + 4k with x_i prescribed, and exactly 12 + 7k with x_i free.
        responsibility: correctness
      - claim: The expected solution count follows p^(12-3k) with a k-only constant.
        responsibility: feasibility
      - claim: The k = 2 cell reproduces the committed census sampler's yield under identical filters.
        responsibility: baseline
      - claim: Dependence of the prescribed sections is verified in the group law over F_p(t), not by specialisation alone.
        responsibility: correctness
      - claim: T(k,p) is a per-relation expectation and excludes the consumer's linear algebra and all memory costs.
        responsibility: cost
      - claim: No sentence from DEC-20260724-021's forbidden list is stated or implied.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: >-
    A per-relation cost expression only, and conditional: under HEUR-P1 and
    HEUR-P2, the expected number of surface trials to obtain one Mordell-Weil
    relation supported on k prescribed sections in this window is
    T(k,p) ~ 2^k * p^(max(0, 3(k-4))) * p^delta with delta unmeasured. This is
    NOT an ECDLP complexity claim: it prices one step of one construction,
    excludes the consuming linear algebra, excludes all memory, and makes no
    statement about any curve outside p in {7,13,19,31}.
  asymptotic_claim_note: >-
    Stated rather than nulled because the lane has produced six evidence records
    with no cost statement at all, and Pareto honesty requires one. It is
    conditional on two numbered heuristics, one of which has no supporting
    argument whatever, and both conditions travel with every citation.

  heuristic_assumptions:
    - id: HEUR-P1
      formal_statement: >-
        Let X = (x_1,...,x_k) be polynomials of degree <= 2 over F_p drawn
        uniformly, and N(X) the number of (a, b, y_1..y_k) with deg a <= 4,
        deg b = 6, deg y_i <= 3 and y_i^2 = x_i^3 + a x_i + b for all i. Then
        E_X[N(X)] = c_k p^(12-3k)(1 + o(1)) as p -> infinity, with c_k depending
        only on k.
      random_model_justification: >-
        The unconditional half is the equation and unknown count itself, a matter
        of degree bookkeeping checked by hand in Stage 0. The conditional half is
        that the variety is a complete intersection of the expected dimension
        with no excess components. That is a real assumption and is NOT
        justified: the equations share a and b across all i and are quadratic in
        y_i, so the system is far from generic and excess intersection is exactly
        what a hidden structure would look like. NO SOURCE IS CITED AND NONE IS
        CLAIMED.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-5202c1]
      falsification_condition: >-
        The measured slope of log_p E[N] against k is not -3.0 within +/- 0.4, or
        the measured exponent at any single k differs from 12 - 3k by more than
        0.4 in log_p units after the square-class factor is divided out, or the
        per-tuple histogram shows tuple-dependence large enough that a single
        constant c_k cannot describe the cell.
    - id: HEUR-P2
      formal_statement: >-
        At k = 4, the probability over the solution family that the four planted
        sections span a lattice of rank strictly less than 4 is p^(-delta) for
        some delta >= 0 constant in p over the tested range.
      random_model_justification: >-
        NONE OFFERED. THIS IS THE WEAKEST LINK IN THIS RECORD and it is stated as
        such rather than smoothed over. That dependence is a proper closed
        condition is clear; that its probability follows a clean power of p is
        assumed only so the measurement has a form to report against.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-5202c1]
      falsification_condition: >-
        The measured rates at p in {7,13,19,31} do not fit a power law with
        acceptable residuals. In that case the RAW RATES are the deliverable, no
        exponent is invented for them, and T(k,p) is reported with its dependence
        factor left as a measured table rather than a power.

  structural_ingredients:
    - description: >-
        The two-section solve a = ((y1^2-x1^3)-(y2^2-x2^3))/(x1-x2),
        b = y1^2-x1^3-a x1, with a polynomial-divisibility test.
      citation: >-
        experiments/EXP-XEDN-005/implementation/run_census.sage,
        fiber_find_rich_surfaces. READ IN FULL IN THIS SESSION. It is the k = 2
        instance of the construction analysed here and it is the baseline the
        count must reproduce.
      role: committed working baseline at k = 2
    - description: >-
        Measured per-slot lift probability P_lift(p) = (1 - 2/p + p^-3)/(2 p^3),
        alpha = 3, exhaustive at small p with an independently re-derived closed
        form.
      citation: >-
        ledger/decisions/DEC-20260724-021.yaml, whose limitations also record
        that alpha = 3 is the naive square-density codimension count and NOT the
        JKSST prediction, and whose forbidden-sentence list binds this record.
      role: independent cross-check on the marginal exponent 3
    - description: >-
        Mordell-Weil rank ceiling 8 and section ceiling 240 for chi = 1 with
        irreducible fibres.
      citation: >-
        H-XEDN-906489 and its sources; the underlying Shioda theory was NOT READ
        and is carried there as HEUR-X1.
      role: bounds how many prescribed points one surface can ever carry

  reduction_chain:
    core_problem: >-
      Price one relation supported on prescribed sections in the function-field
      xedni construction, and identify which factor of that price is unmeasured.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No corollary about ECDLP cost, about index calculus
      feasibility, or about any curve follows from a toy-scale per-relation
      expectation over p in {7..31}, and none is claimed. The consuming linear
      algebra is unmodelled and the memory column is uncomputed; both are named
      in target_complexity rather than hidden.

  predictions:
    - metric: >-
        P1 -- solution-count exponent: log_p of the mean solution count per
        prescribed k-tuple, k in {1,2,3,4,5}, p in {7,13,19,31}, >= 2000 tuples
        per cell, square-class factor divided out
      direction: different
      minimum_effect: >-
        EXACTLY the sequence 9, 6, 3, 0, -3, each within +/- 0.4 in log_p units.
        Forced before any run.
    - metric: >-
        P2 -- free-plant boundary: the largest k with mean solution count >= 1 at
        every tested p
      direction: different
      minimum_effect: >-
        EXACTLY 4. If it is 3 or 5 the bookkeeping is off by one and no cost
        statement may be made until the error is located.
    - metric: >-
        P3 -- marginal exponent: d(log_p mean solution count)/dk, compared with
        the alpha = 3 of DEC-20260724-021
      direction: different
      minimum_effect: >-
        -3.0 +/- 0.4, agreeing in magnitude with alpha = 3. Disagreement is the
        more informative outcome and localises the error to one of two
        independently re-derivable derivations.
    - metric: >-
        P4 -- NULL ARM, random prescribed x with no curve provenance: its
        solution-count exponents
      direction: different
      minimum_effect: >-
        IDENTICAL to the treatment arm at every k, within +/- 0.4. Forced,
        because the count cannot see where x_i came from. A difference means the
        count is not the mechanism.
    - metric: >-
        P5 -- NEARBY-OBJECT CONTROL, free x instead of prescribed x: its
        solution-count exponents
      direction: different
      minimum_effect: >-
        12 (i.e. constant in k), never negative. If the free-x arm returns the
        same exponents as the prescribed arm, the method is not measuring
        prescription and no cost statement may be made.
    - metric: >-
        P6 -- prescribed-support non-vanishing rate at k = 4: fraction of
        obtained surfaces on which L(S;Q) is nonzero, verified in the group law
        over F_p(t)
      direction: different
      minimum_effect: >-
        STRICTLY BETWEEN 0 AND 1 at every tested p. This is the comparator-spread
        test and it can fail: a rate of exactly 0 everywhere means the free-plant
        regime never yields a relation and delta is effectively infinite in the
        tested window; a rate of exactly 1 means the construction imposes a
        hidden relation and the object is not measuring the instance. Both
        extremes are real findings and both are reportable.
    - metric: P7 -- delta, from the regression of log(1/rate) against log p
      direction: different
      minimum_effect: >-
        NO FORCED VALUE. This is the unknown the hypothesis exists to measure.
        The pre-registered obligation is the REPORTING RULE: delta is reported
        with its regression uncertainty and residuals, and the assembled T(k,p)
        is reported as only as good as its worst-measured factor.
    - metric: >-
        P8 -- prescribed minimal-support norms: infinity norms of minimal-support
        vectors of L(S;Q) wherever nonzero
      direction: different
      minimum_effect: >-
        A subset of {1,2,3,4,6}, with 5 FORBIDDEN. Carried as a cross-check on
        H-XEDN-906489's ceiling: a single observed 5 refutes that ceiling through
        this experiment rather than through its own.

  test_boundary:
    instances:
      - Prescribed x-tuples of size k in {1,2,3,4,5} over F_p, p in {7,13,19,31}, at least 2000 tuples per cell.
      - Treatment arm (x-tuples arising as lifts of curve points), null arm (uniform random x with no curve provenance), and nearby-object arm (x free rather than prescribed).
      - k = 4 dependence arm with group-law verification over F_p(t).
    parameters:
      primes: [7, 13, 19, 31]
      k_values: [1, 2, 3, 4, 5]
      deg_a_max: 4
      deg_b: 6
      section_shape: "deg x <= 2, deg y <= 3"
      tuples_per_cell_min: 2000
      arithmetic: "exact F_p and integer, pure Python; no CAS"
    implementation: experiments/EXP-XEDN-5202c1
    budget:
      stage0_wall_clock_seconds: 600
      stage1_wall_clock_seconds: 1800
      stage2_wall_clock_seconds: 3600
      maximum_memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      F1 (CHEAPEST, ZERO ELLIPTIC-CURVE ARITHMETIC) -- the measured
      solution-count exponents are not 9, 6, 3, 0, -3. HEUR-P1 is refuted, the
      cost equation is withdrawn, and it is rebuilt around the measured slope.
    - >-
      F2 -- the free-plant boundary is not exactly k = 4. An off-by-one exists in
      the bookkeeping and must be located before any cost statement.
    - >-
      F3 -- the null arm differs from the treatment arm. The dimension count is
      not the operative mechanism.
    - >-
      F4 -- the nearby-object (free x) arm returns the same exponents as the
      prescribed arm. The method does not distinguish prescription and no cost
      statement may be made.
    - >-
      F5 -- the k = 2 cell fails to reproduce the committed census sampler's
      behaviour under identical filters. The implementation is broken and NOTHING
      negative may be reported.
    - >-
      F6 -- the prescribed-support non-vanishing rate is exactly 0 or exactly 1
      at every p. The tracked object has no comparator spread and the hypothesis
      fails its own identifiability test.
    - >-
      F7 (THE PLANNED NEGATIVE, A DELIVERABLE) -- if every forced exponent
      confirms and delta turns out large, the batch must still emit the assembled
      T(k,p) beside the Pollard rho baseline at the tested p, with every factor's
      provenance labelled and with the forward guidance in interpretation_limits
      attached. A negative that does not produce that statement has not finished,
      and a bare tally of failed cells would be a fatigue report rather than a
      closure.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Nothing here is an attack, a crypto-scale statement, or a
      cost bound on any deployed curve. The exponents are properties of a
      Weierstrass parameter space over p in {7,13,19,31}, a range of under half a
      decade in log p; no extrapolation to cryptographic p is made or implied.
    - >-
      T(k,p) is a PER-RELATION expectation. It excludes the consuming index
      calculus's requirement of about B independent relations, excludes the
      linear-algebra stage entirely, and charges NO memory. Quoting it as an
      attack cost would be the partial-cost error this program's own records
      forbid, and any citation must carry all three exclusions.
    - >-
      The specialisation gap is DECLARED UNMET: a Mordell-Weil relation
      specialises to a relation among fibre points at a good fibre, but the
      specialisation map need not be injective and a relation among fibre points
      need not lift. No arm claims a usable ECDLP relation was produced.
    - >-
      DEC-20260724-021's published forbidden-sentence list binds this record word
      for word. Nothing here states or implies that the multi-section or
      Mordell-Weil relation-source route is closed, that no lifting-based
      relation source exists over F_p(t), or that section-rich surfaces are
      exponentially rare over F_p(t).
    - >-
      REQUIRED FORWARD GUIDANCE, supplied whatever the outcome. If T turns out
      large the named ways out are: (i) chi >= 2 surfaces (deg a <= 8,
      deg b <= 12), where the parameter budget and the rank ceiling both grow --
      8 becomes as much as 18 -- and every exponent in the count changes;
      (ii) NON-INTEGRAL sections x = g/h^2, which enlarge the section supply
      beyond the 240 roots and which no XEDN contract has enumerated;
      (iii) accepting relations of smaller support, trading information per
      relation against cost; (iv) amortising one surface across many target
      tuples, which the ceilings 8 and 240 bound explicitly. Each is named as
      open. None is declared impossible.
    - >-
      No status change to any XEDN record is proposed or implied.

