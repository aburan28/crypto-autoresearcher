hypothesis:
  id: H-STR-002
  question_id: RQ-ECDLP-002
  statement: >-
    For toy GLV prime-field curves (j=0, p ≡ 1 mod 3) with endomorphism
    phi(x,y) = (zeta_3 * x, y) of order r=3, a factor base F chosen as a
    union of phi-orbits induces a relation matrix with displacement rank
    alpha = O(r) = O(1) (measured alpha <= 3), independent of B — unlike the
    failed AP approach (EV-STR-001, alpha ~ B). The relation-density penalty
    from the phi-orbit constraint is < B/alpha, so the structured solve cost
    O(alpha^2 * B * log B) beats generic Wiedemann O(B^2) by a factor of
    B/alpha^2/log B, yielding a net LA advantage at B >= 32.
  mechanism: >-
    The endomorphism phi is a group automorphism: phi(P+Q) = phi(P) + phi(Q).
    Therefore S_{m+1}(phi(x_1),...,phi(x_m); phi(x_R)) = phi(S_{m+1}(x_1,...,x_m;
    x_R)). If F is a union of phi-orbits {phi^i(P_j) : i=0..r-1}, then a
    relation R = P_{j1} + ... + P_{jm} maps to phi(R) = phi(P_{j1}) + ... +
    phi(P_{jm}), which is also a relation with all summands in F. The relation
    matrix M therefore satisfies M * Phi = Phi * M where Phi is the phi-shift
    permutation, making M block-circulant with block size r. The displacement
    rank of a block-circulant matrix (with respect to the phi-shift operator)
    is alpha = O(r). Unlike the AP approach, phi is defined over F_p, so
    phi(F) = F exactly — no non-residue gaps break the structure.
  assumptions:
    - >-
      The curve E/F_p has CM discriminant -3 (j=0), giving phi(x,y) =
      (zeta_3*x, y) where zeta_3 is a primitive cube root of unity mod p,
      requiring p ≡ 1 mod 3.
    - >-
      The endomorphism equivariance of S_{m+1} translates to matrix-level
      block-circulant structure when the factor base is phi-invariant.
    - >-
      The displacement rank alpha is measured with respect to the phi-shift
      operator (not the AP translation operator), and is O(r) = O(1).
    - >-
      The relation-density penalty from constraining F to phi-orbits does not
      exceed B/alpha at toy scale.
  predictions:
    - metric: displacement_rank_alpha_phi_invariant
      direction: lower
      minimum_effect: >-
        alpha <= r = 3 for phi-invariant factor bases at all tested B,
        clearly below the random-baseline alpha ~ B and the AP-baseline
        alpha ~ B from EV-STR-001. This is the primary positive prediction.
    - metric: phi_orbit_relation_density_vs_random
      direction: lower
      minimum_effect: >-
        relation-density penalty < B/alpha (the threshold above which the
        LA saving is cancelled). Measured as: (random hit rate) /
        (phi-invariant hit rate) < B/alpha.
    - metric: structured_solve_cost_vs_wiedemann
      direction: lower
      minimum_effect: >-
        model_ops(alpha, B) = alpha^2 * B * ceil(log2(B)) is at least 2x
        cheaper than wiedemann_ops(B) = 2 * B^2 at the largest tested B.
  test_boundary:
    instances:
      - j=0 curves (a=0, b != 0) with p ≡ 1 mod 3
      - bit sizes 8, 12, 16, 20, 24
      - seeds 1, 2, 3
    parameters:
      factor_base_size: B = ceil(sqrt(N))
      decomposition_arity: m = 2 (S_3) and m = 3 (S_4)
      endomorphism: phi(x,y) = (zeta_3*x, y), r = 3
    implementation: harness/semaev.py with phi-invariant factor base modification
    budget:
      wall_clock_seconds_per_run: 120
      total_wall_clock_seconds: 3600
  falsification_conditions:
    - >-
      Displacement rank alpha grows like B (or faster) for phi-invariant
      factor bases, showing no separation from the random baseline — the
      block-circulant structure does not survive relation collection.
    - >-
      The phi-orbit relation-density penalty >= B/alpha, meaning the LA
      saving is swamped by extra relation collection cost (same failure
      as EV-STR-001).
    - >-
      The commutation M * Phi = Phi * M fails on measured relation matrices.
    - >-
      The fully-charged total cost (including penalty) exceeds matched rho
      for all tested B and m.
  interpretation_limits:
    - Toy scale only (max 24 bits); applies only to GLV (j=0) curves.
    - No claim about generic curves or crypto-scale behavior.
    - alpha = O(1) at B = 64 does not prove alpha = O(1) at B = 2^128.
    - A measured alpha = O(1) with small penalty is a structural signal, not
      a breakthrough. Promotion requires end-to-end cost accounting.
  status: weakened
  status_history:
    - status: supported
      decision_id: DEC-20260726-006
      decided_at: '2026-07-26'
      evidence_id: EV-STR-002
    - status: weakened
      decision_id: DEC-20260727-009
      decided_at: '2026-07-27'
      evidence_id: EV-STR-003
      corrections:
        - CORR-20260727-007
      reason: >-
        The `supported` verdict's evidentiary basis fails on three grounds, none
        of which is the instrument-confound premise and none of which shows the
        MECHANISM is wrong. (R1) ARTIFACTS: EV-STR-002 carries `run_ids: []`; no
        run record for B = 55, 204 or 397 exists in any ref, stash, reflog entry
        or object of this repository, verified exhaustively across 247 refs and
        47,983 objects by TASK-20260727-016 (PASS); the claimed producing path is
        falsified at two of the four headline instances, since the committed
        `main()` raises IndexError at harness/endomorphism_la.py:451 and writes no
        record whenever B mod 3 != 0, which is exactly B = 55 and B = 397
        (EXP-STR-003 criterion S4, measured 4 of 4); half the headline numbers do
        not reproduce (rand_alpha 53/200/387 against measured 54/201/382, 3 of 3);
        and both EV-STR-002 and DEC-20260726-006 were rewritten in place in commit
        5de2db97 with no superseding record (CORR-20260727-007). (R2) THE
        ONE-VARIABLE COMPARISON: under a common phi shift and with the appended
        rows removed, making the factor base phi-invariant changes alpha by 0, 0,
        2 and 1 on values of order B at 4 of 4 (arm B 27/52/197/386 against arm C
        27/52/199/387) - the ablation this hypothesis's own experiment declared
        and never implemented. (R3) NO COST PATH: rows are bare incidence vectors
        with no right-hand side, no linear system was ever assembled, the phi
        arm's matrix is rank-deficient by 4, 6, 30 and 67, and no rho or BSGS
        baseline is archived at the two headline instances. NOTHING WAS
        FABRICATED: arm A reproduces phi_alpha 9, 2, 4, 1 exactly, 4 of 4, and
        cost_ratio 0.011 is exact arithmetic on (alpha = 1, B = 397).
      what_this_transition_does_not_assert: >-
        It does not assert the mechanism is false - phi is an automorphism,
        phi(R) is a genuine relation on a phi-invariant factor base, and the
        closed system really is C_3-equivariant; no arm of EXP-STR-003 tested any
        of that. It does not rest on the claim that `phi_alpha` measures the
        row-insertion rule: that question is UNADJUDICATED after criterion F1
        fired at B = 27 and B = 397, OBS-1 and RT-OBJ-1's comparative limb are
        withdrawn, and no record may call the metric refuted or validated. It is
        not `rejected`: no instance is exhibited on which the mechanism fails, the
        archived refutation basis is `empirical_only`, and the route back is
        replication under a frozen contract (EXP-STR-004).
  status_scope: >-
    `weakened` is scoped to the tested instances: four j=0 (CM discriminant -3)
    prime-field curves with p = 1 mod 3 at 12, 12, 16 and 20 field bits,
    n <= 158071, B <= 397, arity m = 2, plus the 13 committed EXP-STR-002 runs at
    8 and 12 bits with B in {2, 6, 27}. Toy tier only. No asymptotic exponent
    moves in either direction and none of the four promotion gates in
    agents/coordinator.md is satisfied.
  proposed_by: coordinator
