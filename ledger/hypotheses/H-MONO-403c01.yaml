hypothesis:
  id: H-MONO-403c01
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260904-a1b81b
  status: proposed
  added: '2026-09-04'

  statement: >-
    SCOPE: m=4, prime field F_101 (SAME prime as EXP-MONO-bb6fa1, deliberately,
    to isolate curve/R-dependence from prime-dependence), a SECOND ordinary
    curve E'/F_101 with j not in {0,1728}, DIFFERENT from EXP-MONO-bb6fa1's
    own E:y^2=x^3+x+1, and a SECOND point R' on it, chosen by the same
    kind of fixed declared rule. Claim tier toy for measurement.

    THE HYPOTHESIS. H-MONO-572e7e's own EXP-MONO-bb6fa1 measured, on ONE
    (curve,R), a density triple excluding trivial/C_2/A_3 and consistent
    with G_R=S_3, plus a striking, UNEXPLAINED exact-rational observation:
    split density R3 = 17/101 = (p+1)/(6p) EXACTLY, matching the same
    O(1/p)-correction SHAPE as the program's own already-derived null-
    object closed forms, but on a genuinely different (non-null) object
    V_R whose own expected value has no known closed form. This
    hypothesis tests, on a SECOND object at the SAME prime: (I) does the
    excludes-named-rivals, consistent-with-S3 reading REPRODUCE (a real
    step toward confirmation, not proof); (II) does R3's own exact value
    ALSO equal 17/101 = (p+1)/(6p) EXACTLY (suggesting a genuine,
    curve/R-independent, prime-dependent law worth a real derivation
    attempt), or does it differ (showing the first match was a
    coincidence specific to that one object, while the qualitative
    "consistent with S_3" reading may still hold or may not).

  mechanism: >-
    Identical to H-MONO-572e7e's own mechanism (IDEA-20260904-a1b81b
    STEP 1-4), reusing EXP-MONO-bb6fa1's own already-independently-
    verified enumeration method (symmetric-coordinate census, avoiding
    the ordered-variety trap) and S_4 construction (read-only reuse of
    experiments/EXP-MONO-815525/implementation/derive_s4.py), with TWO
    changes: (1) a different curve and R, chosen by a declared rule
    disjoint from the first; (2) Stage 1's own tolerance criterion is
    CORRECTED per CORR-20260904-8cc20f -- both nearby-object controls
    are checked against the EXACT closed-form finite-p triple (zero
    tolerance, since both are exhaustive deterministic censuses), not
    the flawed asymptotic-plus-sampling-error band.

  falsification_condition: >-
    Per H-MONO-572e7e's own falsification structure, applied again: any
    measured triple on the new object matching NO named subgroup of S_3
    (with corrected controls passing) is an anomaly requiring
    investigation. Specifically for R3's own exact-value question: if
    R3 does NOT equal 17/101 on the new object, this falsifies "R3=(p+1)
    /(6p) is a curve/R-independent law at p=101" (a live but explicitly
    NOT-yet-asserted possibility from EXP-MONO-bb6fa1), while leaving the
    qualitative S_3-consistency question separately assessable from the
    new object's own full triple.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Reuses H-MONO-572e7e's own H1 (HEUR-CHEB-1) and H2 (HEUR-IRR-1)
        unchanged, now tested on a second object as a genuine (not
        merely nominal) replication.
      rigorous_support: See H-MONO-572e7e's own H1/H2.
      validation_plan: >-
        Identical Stage-0/1/R8 pipeline as EXP-MONO-bb6fa1, on the new
        (curve,R), with Stage 1's tolerance corrected per
        CORR-20260904-8cc20f.
      falsification_condition: See H-MONO-572e7e's own H1/H2.

  target_complexity:
    time_exponent: NOT APPLICABLE, per H-MONO-572e7e's own target_complexity, unchanged.
    memory_exponent: O(1) beyond a counter vector; identical to H-MONO-572e7e.
    best_known: Pollard rho (KN-OPEN-001), untouched.

  claim_boundary_and_test_boundary: >-
    Tests ONLY a second (curve,R) at the SAME prime p=101, isolating
    curve/R-dependence from prime-dependence. Does not test a different
    prime (a p-ladder check, per the idea's own R7, is named as separate
    future scope). Does not test Stage 2/3 of IDEA-20260904-a1b81b's own
    broader design. Does not close KN-OPEN-009 or authorize any status
    change.

