hypothesis:
  id: H-ECDLP-c9e189
  question_id: RQ-SDEG-001

  statement: >-
    SCOPE: the SDEG lane Semaev decomposition pipeline over prime fields, at the
    toy sizes the lane already runs, one machine, one solver. CLAIM TIER toy.
    NO ATTACK, NO EXPONENT, NO STATUS CHANGE TO ANY EXISTING RECORD.
    The lane reports decomposition cost as wall clock. The claim under test is
    that a portable cost unit - field operations counted by type - and the
    machine-bound unit disagree materially about the lane's fitted local cost
    exponent. Formally, let alpha_wall be the local log-log slope of wall clock
    against log p and alpha_ops the same slope against a weighted field-operation
    count, both fitted over the identical instance set. The claim is that
    alpha_wall and alpha_ops differ by more than the union of their bootstrap
    intervals at the tested sizes. The complementary outcome - the two fits agree
    - is the more likely one at these sizes, is equally reportable, and would
    establish that wall clock was adequate over the tested range, which is a
    clean result the lane does not currently have.
    THE RECORD IS A CONTROL RECORD. Its primary deliverable is not the exponent
    comparison but a calibrated, dynamic-range-demonstrated operation counter and
    an explicit instrumentation boundary, without which no cost unit in this lane
    is auditable in either direction.

  mechanism: >-
    Instrument the pipeline to count F_p operations by type - multiplications,
    squarings, inversions, additions - alongside wall clock, and record both per
    instance. Wall clock and operation counts are collected in SEPARATE runs on
    the same seeds, because counting instrumentation itself perturbs wall clock;
    the perturbation is measured and reported rather than assumed negligible.
    Fit the local slope under each unit over the same instance set and report the
    difference with its interval.
    WHY THE COUNTER MUST BE CALIBRATED BEFORE IT IS BELIEVED. An operation
    counter is an instrument, and an instrument that returns a number is not the
    same as an instrument that returns the right number. The design therefore
    fixes the counter against a computation whose operation count is known in
    closed form, and then sweeps a KNOWN multiple of that computation so the
    counter has to track a planted change of known size - a counter that
    reproduces one fixed value proves only that it can reproduce one fixed value.
    WHERE THE BOUNDARY IS. Any algebra library whose internals cannot be
    instrumented is the boundary of the count, and the fraction of wall clock
    spent inside that boundary is a required reported quantity. An operation
    count that omits a dominant uninstrumented library is less trustworthy than
    the wall clock it replaces, and the design reports the fraction rather than
    claiming completeness.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. This record proposes no algorithm, claims no complexity
    improvement, and moves no exponent for any hard problem. The only exponents
    it touches are the LOCAL FITTED SLOPES of the lane s own measured cost over
    a toy range; they are descriptive statistics of a measurement, not asymptotic
    claims, and may not be quoted as such.

  rerandomization: null

  proof_search_map:
    not_applicable_reason: >-
      This is a measurement-instrument and cost-unit control, not a
      proof-oriented proposal. It asserts no theorem, no reduction, no
      certificate family and no asymptotic. Recorded as non-applicable rather
      than silently omitted, per docs/inventor-protocol.md section 8. The one
      proof-adjacent element is the closed-form operation count of the
      calibration computation, which is elementary and is stated in the contract
      so it can be checked by hand.

  assumptions:
    - >-
      The pipeline is instrumentable for operation counting down to a stated
      boundary. Library internals that cannot be counted are the boundary and are
      REPORTED with the fraction of wall clock they consume; they are never
      assumed negligible.
    - >-
      Operation counts by type are collected in runs separate from the timing
      runs, on the same seeds, so that instrumentation overhead does not
      contaminate the wall-clock arm. The overhead is itself measured.
    - >-
      Solver behaviour is deterministic given the seed and the input, so that the
      operation count for a fixed instance is a fixed integer. This is an
      assumption about the CODE and it is tested directly by the load null,
      because a solver with any timing-dependent branch would break it.

  heuristic_assumptions:
    - id: HEUR-OPS-1
      formal_statement: >-
        For a fixed prime size, the total cost of one Semaev decomposition in the
        lane s pipeline is, up to a factor F bounded and slowly varying over the
        tested range of p, a fixed positive linear combination of the counted
        field-operation types, with weights independent of p.
      random_model_justification: >-
        NOT A DISTRIBUTIONAL HEURISTIC AND THE FIELD IS FILLED HONESTLY RATHER
        THAN PADDED. The rigorous ingredient is that each counted operation has a
        cost fixed for a fixed field size, so a weighted count is an exact cost
        in a model that charges only those operations. No distribution is
        imitated and none is needed. THE GAP, AND IT IS THE WHOLE GAP: memory
        access patterns, cache behaviour and allocator effects are not counted at
        all, they grow in importance with problem size, and they are therefore
        largest exactly where the lane would want to extrapolate. F is not known
        to be near 1 and this record does not assume it is.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-9cd134]
      falsification_condition: >-
        The ratio of wall clock to weighted operation count, measured per size,
        drifts monotonically with size by more than a factor of 2 across the
        tested range. That is F failing to be slowly varying, and it means the
        two units are measuring different things in a size-dependent way - which
        is a positive result for the record and must be reported as the headline
        rather than folded into the exponent comparison.

  structural_ingredients:
    - description: >-
        The lane s own declared cost model and its stated need for a C_decomp
        with confidence intervals suitable as the numerator of an
        index-calculus-versus-rho comparison.
      citation: ledger/questions/RQ-SDEG-001.yaml
      provenance: internal
      verified_by: >-
        coordinator subagent under TASK-20260904-c0edda, 2026-09-04, read
        ledger/questions/RQ-SDEG-001.yaml in full (25 lines). The quoted
        obligation is its decision_target and its constraint that matched
        rho/BSGS controls and certificates are mandatory.
      role: the cost model whose unit this record changes
    - description: >-
        Published Semaev and index-calculus complexity statements are expressed
        in field operations rather than seconds, which is the comparability this
        record restores.
      citation: >-
        General practice in the algebraic-cryptanalysis literature. NO SPECIFIC
        PAPER IS BEING RELIED ON and none was opened for this record.
      provenance: recalled
      verified_by: null
      role: motivation only, not support

  predictions:
    - metric: >-
        P1 - counter calibration against a closed-form operation count, and
        against a swept known multiple of it
      direction: different
      minimum_effect: >-
        FORCED EXACT at every sweep point. The counter must return the closed-form
        value exactly at multiplier 1 and exactly k times that value at
        multiplier k for k in {1, 2, 4, 8, 16}. Exact at one point only is NOT a
        pass - an instrument with no demonstrated dynamic range cannot support a
        negative.
    - metric: >-
        P2 - wall clock and operation count under swept artificial machine load
      direction: different
      minimum_effect: >-
        FORCED SPLIT. Wall clock must rise monotonically across load levels
        {0, 1, 2, 4} competing CPU-burner processes, by a total factor of at
        least 1.5 at the highest level; operation count must be bit-identical at
        every level. This is the record s whole argument in one measurement and
        BOTH halves can fail.
    - metric: >-
        P3 - fraction of wall clock spent inside the uninstrumented library
        boundary
      direction: different
      minimum_effect: >-
        Reported per size, no direction pre-committed. If it exceeds 0.5 at any
        size the operation count is declared INCOMPLETE at that size and no
        exponent may be fitted from it there.
    - metric: >-
        P4 - alpha_wall minus alpha_ops, the difference of the two locally fitted
        cost slopes over the identical instance set
      direction: different
      minimum_effect: >-
        No direction pre-committed. DISAGREEMENT is declared if the bootstrap
        intervals of the two slopes are disjoint; AGREEMENT is declared if the
        difference and its interval are contained in plus or minus 0.05.
        The band strictly between those two is pre-declared INCONCLUSIVE and must
        be reported as such rather than narrated toward either side.
    - metric: >-
        P5 - the same two fits computed on a CURVE-FREE matched-shape random
        polynomial system instrumented by the identical counter
      direction: different
      minimum_effect: >-
        No direction pre-committed and this is the record s scope gate. If the
        curve-free arm reproduces the wall-clock-versus-operation-count
        discrepancy signature within its own interval, the finding is a property
        of the solver and the instrumentation, NOT of elliptic curves, and
        nothing from this experiment may be quoted as a statement about elliptic
        curves or the ECDLP.

  test_boundary:
    instances: >-
      The SDEG lane s existing prime-field Semaev decomposition instances at the
      toy sizes already run by the lane, at least 4 sizes with at least 20
      instances each; plus a matched-shape curve-free random system arm at the
      same shapes.
    parameters:
      sizes: at least 4 prime sizes spanning the lane s admitted toy range
      instances_per_size: 20
      load_levels: [0, 1, 2, 4]
      calibration_multipliers: [1, 2, 4, 8, 16]
      counted_operation_types: [multiplication, squaring, inversion, addition]
    implementation: >-
      Instrumentation wrapper around the lane s existing pipeline. Timing runs
      and counting runs are separate processes on identical seeds.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 8
      maximum_runs: 240

  falsification_conditions:
    - >-
      F1 - the counter does not reproduce the closed-form value exactly at
      multiplier 1, or does not track the swept multiple exactly. The
      instrumentation is wrong. No number from any arm is admissible and no
      negative may be reported.
    - >-
      F2 - the operation count moves at all under artificial load. The counter is
      measuring something machine-dependent, or the solver has a timing-dependent
      branch. Either way the portability premise fails and that is the finding.
    - >-
      F3 - wall clock does not move under load. The load generator is not
      loading the machine; the null is inert and must be repaired before it can
      discriminate anything.
    - >-
      F4 - the two fits agree within plus or minus 0.05. Wall clock was adequate
      over the tested range. A clean, cheap, positive result for the lane s
      existing practice, and it must be reported as such and not buried.
    - >-
      F5 - the two fits disagree with disjoint intervals. The lane s fitted
      exponent depends on the machine over the tested range and every downstream
      comparison must be restated in operations.
    - >-
      F6 - the curve-free arm reproduces the same discrepancy signature. The
      result is about the solver, not about curves, and its scope statement
      changes accordingly BEFORE anything is quoted.

  interpretation_limits:
    - >-
      CLAIM TIER toy. Scoped to the instrumented pipeline, the tested prime
      sizes, one solver, one machine, and the declared instrumentation boundary.
    - >-
      Produces NO cost model, NO attack and NO asymptotic exponent. The fitted
      slopes are descriptive statistics over a toy range.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SHRUNK. The
      claim that field-operation counts remain a faithful cost proxy at
      cryptographic prime sizes cannot be tested by this or any experiment this
      program can run, because the cache and memory effects that would break the
      proxy appear at sizes far beyond the reachable range. The record measures
      the proxy s fidelity over the range it can reach and states the transfer as
      unjustified.
    - >-
      Operation counts are portable only to the extent the instrumentation is
      complete. The boundary fraction of P3 is what bounds that portability and
      it must accompany every quoted count.
    - >-
      A single-machine measurement cannot establish machine-independence; it can
      only establish that ONE machine s wall clock does or does not track the
      portable unit over the tested range.

  status: proposed
  proposed_by: coordinator

  source_refs:
    - ledger/proposals/IDEA-20260815-66496a.yaml
    - ledger/questions/RQ-SDEG-001.yaml
    - ledger/handoffs/TASK-20260904-c0edda.yaml
    - docs/inventor-protocol.md
    - templates/research-records.md

  authoring_note: >-
    Written under TASK-20260904-c0edda (DESIGN ONLY) from IDEA-20260815-66496a.
    The source idea s characterisation of RQ-SDEG-001 was checked against the
    record itself before being adopted. The source idea offers two nulls; this
    record adds a swept-multiplier dynamic-range arm to the calibration null and
    a curve-free matched-shape arm with its consequence pre-declared, per the
    control-lane requirements in the handoff. Nothing here approves, freezes or
    authorises anything.
