# =============================================================================
# H-CERTBIN-adccf3 -- HOLD-X5 Frobenius-conjugate attempt correlation
# (Propositions T, Sigma; overlap census). Specified from IDEA-20260926-9c5694
# under RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001. Approved DEC-20261002-780e64.
#
# Certificate shortlist HOLD-X5 (DEC-20260928-63addc rank 13). Consolidates
# IDEA-20260926-917981 (stable-V Proposition F control). Folds
# IDEA-20261001-93e740 Lemma A2-prime as Stage-0/1 pre-gate (TW-7257-2 /
# DEC-20260929-7257b2). ZERO RUNS in this design packet. No AUXIN. No Bedrock.
# No curve attack / exponent claim. Claim tier: control / certificate.
# Stages 0-1 authorized; optional Stage-2 closure arm design_after.
# =============================================================================
hypothesis:
  id: H-CERTBIN-adccf3
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-9c5694
  experiment_id: EXP-CERTBIN-a14350
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-780e64
  status: approved
  proposed_by: coordinator
  title: >-
    On non-stable subspace bases the n Frobenius conjugates of one target are
    n attempts over n conjugate bases (Proposition T); their indicator
    correlation equals the overlap term within sampling error (E-OVERLAP) or
    exceeds it (E-EXTRA), with stable-V concordance 1.000 and ordinary-curve
    null rho_j≈0 as blocking controls

  statement: >-
    CLAIM (control / certificate; HOLD-X5; NO ATTACK). Setting: Koblitz
    siblings E: y^2+xy=x^3+a x^2+b with b in F_2 over F_{2^n}, n in {17,19};
    G the odd-order prime-order subgroup; V an F_2-subspace; sigma the
    absolute 2-Frobenius. HYPOTHESIS: (T) for every Koblitz E, every V, every
    target R and lag j, the attempt "decompose sigma^j R over V" is, up to
    invertible F_2 recombination of equations, the attempt "decompose R over
    sigma^{-j} V" (Proposition T; b in F_2 required). On a non-stable V the
    n conjugates are therefore n attempts of one target over n different
    bases on the SAME curve; on a stable V they collapse to one attempt
    (917981 Proposition F / T2). (Sigma) For R of prime order r>n in G, the
    stabiliser of ONE fixed-target instance inside
    <leg-permutations, negation, Frobenius shift> is exactly S_m
    (Proposition Sigma). (OVERLAP) The lag-j indicator autocorrelation
    rho_j of chi_V(sigma^j R) along an orbit is bounded below by the
    overlap term o_j from d_j=dim(V cap sigma^j V) and measured p=|S|/|G|;
    H1 predicts equality. Stage 0 writes T and Sigma, computes all d_j and
    o_j (including ECC2K-130 (m,l)=(4,33) arithmetic labelled derived), and
    freezes the 93e740 Lemma A2-prime signed-form check as a pre-gate.
    Stage 1 exhaustively censuses chi_V over G on K17/K19 with four bases
    (polynomial V, stable V_S, random V', ordinary RC-1 null) and decides
    exactly one of E-OVERLAP / E-EXTRA / E-NULL-FAIL / O-ARTIFACT.
    CLAIM TIER: control. NO exponent. NO ECC2K-130 break. NO Magma/Sage/AUXIN.

  mechanism: >-
    OBJECT FRAME. Representation R1 (x_R and its coordinate vector).
    Operation set Sigma_op = <sigma> acting on the odd-order subgroup as the
    scalar of order n. Tracked object: orbit label vector
    L(R)=(chi_V(sigma^j R))_j and its lag autocorrelations rho_j.
    Trichotomy: Class I partial-action. Lossy projection: L discards all but
    n indicator bits; Sigma-compatible by rotation. WHAT IS NEW relative to
    917981 (stable V only) and a77711 (equivariance lemmas): Proposition T's
    transport to CONJUGATE BASES on a non-stable V with explicit b-in-F_2
    hypothesis; the pre-priced overlap lower bound; Proposition Sigma as the
    per-instance symmetry ceiling; and the exhaustive census deciding
    E-OVERLAP vs E-EXTRA. Charged stage: attempt-generator / relation-
    collection accounting — not a solve of any descended system under the
    required Stages 0-1 (optional Stage-2 closure arm is design_after).

  assumptions:
    - >-
      K17: y^2+xy=x^3+x^2+1 over F_2[t]/(t^17+t^3+1), |G|=65587 (re-counted
      in run). K19: y^2+xy=x^3+1 over F_2[t]/(t^19+t^5+t^2+t+1), |G|=130873
      (re-counted). n | (r-1) so every nonzero orbit has size n.
    - >-
      V={deg<l} in the polynomial basis (non-stable at these (n,l)); stable
      V_S used only as positive control at n=17. Frobenius of x_R by field
      squaring; normal basis not required by the census.
    - Satisfiability at m=2 decided by exhaustive sumset enumeration, never by a closure.
    - >-
      OFF-LIMITS: F2 family; F6 only as named operation set; V inside
      KN-OPEN-020 scoped-out linear-subspace class.
    - Executable work is toy-tier only; ECC2K-130 overlap figure is arithmetic only.

  proof_search_map:
    bottleneck: >-
      Whether n conjugate attempts over a non-stable V carry correlation
      beyond the base-intersection overlap term (E-EXTRA), the only
      Koblitz-specific coupling on this seam that could exceed the known
      1/n; and whether any elimination work is shareable beyond affine-family
      retention (T4 says no).
    baseline_embedding:
      parameter_slice: >-
        Stable-V case (917981 Proposition F; GGMP 1/n): on V_S at n=17 the
        census MUST return label concordance exactly 1.000 before any
        non-stable number is read.
      reproduction_check: >-
        (i) Stable arm concordance = 1.000 on all orbits. (ii) Proposition T
        on 10^3 sampled (R,j): solution sets of sigma^j R over V and R over
        sigma^{-j} V correspond under sigma^{-j}. (iii) Lemma A2 / A2-prime
        gate: signed-form shared-tuple rate matches 93e740 H1 Poisson
        prediction within band; a headline A2 (unsigned "no common tuple")
        violation is recorded but does not void T if A2-prime accounts for it.
    observation_collision:
      observable: Orbit label vector L(R) and lag-j autocorrelation rho_j over all of G.
      distinct_preimage_search: >-
        Nonzero rho_j from (i) base intersection (o_j, precomputed), (ii)
        curve-and-base coincidence beyond it (E-EXTRA), or (iii) sumset
        size/parity artifact. Separated by random V' (own d_j) and
        ordinary-curve null where T fails; only (ii) survives both.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Same census on four bases (polynomial V, stable V_S, random V',
          ordinary-curve null with conjugate x_R as random-x targets).
        predicted_gain: Decides E-OVERLAP vs E-EXTRA and confirms E-NULL; no cost gain.
      - transform: representation_reduction
        proposed_object: >-
          Replace "orbit system solved once" by "one target over n conjugate
          bases" (Proposition T).
        predicted_gain: Zero beyond known 1/n on a stable V; that is the content.
    quantifier_order: >-
      Proposition T: FORALL Koblitz E (b in F_2), FORALL V, FORALL x_R,
      FORALL j: exact. Proposition Sigma: FORALL prime n, FORALL subspace V
      of dimension 2..n-2, FORALL R of prime order in G: stabiliser is S_m.
      Empirical: FOR the two named cells and four bases, rho_j as measured
      (exact over G).
    method_ceiling:
      strongest_certifiable_claim: >-
        On n=17 and n=19 Koblitz siblings with named V, conjugate attempts
        have exact rho_j against overlap o_j, with stable concordance 1.000
        and ordinary-curve null within 3 sigma of 0. Nothing about m>=3,
        about n=131 beyond the 2^{-64} overlap arithmetic, or about any cost.
      nearby_object_control: >-
        Ordinary RC-1 where Proposition T fails (T3); stable V_S where T
        collapses to known 1/n; random V' shape null; 93e740 A2-prime gate.
    proof_obligations:
      - claim: Proposition T (F_2-coefficients of S_{m+1} for b in F_2; recombination invertible).
        responsibility: correctness
      - claim: Overlap term is a lower bound on rho_j.
        responsibility: correctness
      - claim: Proposition Sigma (S_m is the full stabiliser at prime n on subspace bases).
        responsibility: strictness
      - claim: d_j by linear algebra agrees with direct enumeration of V cap sigma^j V.
        responsibility: size
      - claim: Orders of both Koblitz siblings re-counted before use.
        responsibility: baseline
      - claim: Lemma A2-prime signed-form gate (93e740) recorded before unsigned A2 is used as a void.
        responsibility: interface
    not_applicable_reason: null

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        Beyond pairs with both legs in F_{V cap sigma^{-j} V}, membership of
        R in S and in sigma^{-j} S is independent, so rho_j equals the
        overlap term o_j (computed from d_j and measured p).
      random_model_justification: >-
        Inclusion of the intersection sumset in both S and sigma^{-j} S is
        exact (lower bound). Equality imitates the random-map model for
        near-disjoint-base sumsets.
      supporting_results:
        - >-
          IDEA-20260926-9c5694 claim (overlap term derivation); Semaev 2015
          §4.3 random-map model pointer (KN-LIT-fa346d, recalled until run
          cites retrieved).
      validation_experiment_ids: [EXP-CERTBIN-a14350]
      falsification_condition: >-
        Any rho_j - o_j > 3 sigma on a Koblitz cell → H1 false at that cell
        (E-EXTRA); if none exceeds → H1 supported as E-OVERLAP within scope.
    - id: H-A2PRIME
      formal_statement: >-
        In sign-free (x-only) systems, Sol(R,V) and Sol(sigma^j R,V) may share
        tuples exactly when a nonempty proper signed sub-sum is a half of
        (1 - s lambda^j) R (IDEA-20261001-93e740 Lemma A2-prime); count is
        Poisson at the pre-registered rate of that record's H1.
      random_model_justification: >-
        Halving relation is exact algebra; rate uses random-model occupancy
        of the named half-elements inside V^m.
      supporting_results:
        - IDEA-20261001-93e740 claim (C); IDEA-20260906-a77711 Lemma A2 (signed form).
      validation_experiment_ids: [EXP-CERTBIN-a14350]
      falsification_condition: >-
        Shared-tuple count outside the 93e740 band after correct sign
        accounting → A2-prime mis-stated; stop before reading rho_j as
        E-EXTRA / E-OVERLAP if the instrument depends on the unsigned form.

  predictions:
    - metric: concordance of L(R) on stable V_S at n=17
      direction: same
      minimum_effect: 'exactly 1.000; any deviation voids the instrument (O-ARTIFACT).'
    - metric: rho_1 on V={deg<9}, n=17 Koblitz a=1, exact over G
      direction: different
      minimum_effect: >-
        E-OVERLAP iff |rho_1 - o_1| <= 3 sigma with o_1 from d_1=5 and
        measured p; E-EXTRA iff rho_1 - o_1 > 3 sigma; sigma ≈ 0.004 at |G|=65587.
    - metric: rho_j for j=2..n-1 against o_j from computed d_j
      direction: different
      minimum_effect: 'E-OVERLAP requires agreement at every j; one lag with excess >3 sigma is E-EXTRA.'
    - metric: rho_j on ordinary RC-1 with conjugate x_R as random-x targets
      direction: same
      minimum_effect: 'within 3 sigma of 0 for every j (E-NULL); nonzero → localize artifact first.'
    - metric: Lemma A2-prime shared-tuple rate at m=2 on stable and non-stable V
      direction: different
      minimum_effect: 'within 93e740 H1 band; unsigned A2 "zero shared tuples" may fail without voiding T.'
    - metric: ECC2K-130 overlap at (m,l)=(4,33), computed not measured
      direction: lower
      minimum_effect: 'of order 2^{-64}; derived arithmetic with d_1=17 re-derived in Stage 0.'

  test_boundary:
    instances:
      - stage0_propositions_note: >-
          Write Propositions T and Sigma; compute d_j for j=1..n-1 per base;
          freeze o_j(p) formulae; ECC2K-130 (4,33) overlap arithmetic;
          freeze 93e740 Lemma A2-prime pre-gate predictions.
      - stage1_census_K17: >-
          Koblitz n=17, m=2, l=9, V={deg<9}; bases V, V_S, V'; exhaustive
          over G; RC-1 ordinary null with conjugate x_R as random-x.
      - stage1_census_K19: >-
          Koblitz n=19, m=2, l=10, V={deg<10}; bases V, V'; exhaustive over G.
      - stage1_reproduction: >-
          Stable concordance; T1 on 10^3 samples; A2 / A2-prime gate on same.
      - optional_stage2_closure: >-
          M_4/W_4 on 50 orbits x n conjugates — NOT authorized under this
          approval (design_after HOLD-X5 census arms / n=17 successor).
    parameters:
      m: 2
      n_cells: [17, 19]
      l_by_n: {17: 9, 19: 10}
      sigma_threshold: 3.0
      t1_samples: 1000
      seeds:
        V_prime: 20261002
        closure_subsample: null
    implementation: >-
      experiments/EXP-CERTBIN-a14350/implementation/ reading
      experiments/EXP-CERTBIN-e94b27/impl/{gf2n,curve}.py (copy/wrap under
      write_scope; parameterise n=19 modulus ~20 lines as EXP-CERTBIN-060020).
      Pure Python; numpy optional. No Magma/Sage/cypari2; no AUXIN; no Bedrock.
    budget:
      maximum_runs: 4
      total_cpu_hours_advisory: 2.0
      wall_clock_seconds_advisory: 7200

  falsification_conditions:
    - >-
      Proposition T falsified by any (R,j) where the two enumerations give
      solution sets that do not correspond under sigma^{-j}.
    - >-
      Stable-V concordance ≠ 1.000 or order re-count disagrees → instrument
      void (O-ARTIFACT); nothing else read.
    - >-
      E-OVERLAP falsified iff any rho_j - o_j > 3 sigma on a Koblitz cell;
      E-EXTRA falsified iff none does.
    - >-
      E-NULL falsified iff ordinary-curve arm shows |rho_j| > 3 sigma at any j.
    - >-
      A2-prime gate outside band after sign accounting → stop before
      promoting E-EXTRA as Koblitz-specific structure.
    - >-
      Claiming any ECDLP speedup, exponent move, or ECC2K-130 break under this card.

  interpretation_limits:
    - Toy tier; m=2; two Koblitz cells; nothing about m>=3 cost or ECC2K-130 beyond overlap arithmetic.
    - Proposition T needs b in F_2; ordinary curves are the null, not a host.
    - Proposition Sigma stated for subspace bases at prime n; orbit-union bases out of scope.
    - KN-OPEN-020 class of V not escaped.
    - Optional Stage-2 closure concordance is design_after; W_4 ceiling concordance is uninformative if run.
    - Ceiling first: no arity row moves; at most ~1 group-op of a ~2^{4.4}–2^{11} per-attempt budget at m=4.

  distinguishable_outcomes:
    - id: O-E-OVERLAP
      meaning: >-
        Stable concordance 1.000; T1 and A2-prime gates pass; every Koblitz
        rho_j within 3 sigma of o_j; ordinary null within 3 sigma of 0:
        conjugates are independent attempts up to computable overlap;
        tau-generator validated as free near-independent attempt generator
        on non-stable V; seam item closes with a measured number.
    - id: O-E-EXTRA
      meaning: >-
        Gates pass and at least one Koblitz rho_j exceeds o_j by >3 sigma,
        absent on V' and on the ordinary null: Koblitz-specific coupling
        beyond base intersection; hand to successor with review-adversarial
        before any cost reading.
    - id: O-E-NULL-FAIL
      meaning: >-
        Ordinary-curve arm shows |rho_j|>3 sigma: artifact to localise;
        no Koblitz reading until cleared.
    - id: O-ARTIFACT
      meaning: >-
        Stable concordance below 1.000, T1 mismatch, order re-count disagree,
        or A2-prime gate broken in a way that voids the instrument: nothing
        else read.
    - id: O-A2PRIME
      meaning: >-
        Unsigned A2 "no common tuple" fails but A2-prime accounts for the
        shared tuples within band: record the signed-form correction;
        proceed to rho_j readings under O-E-OVERLAP / O-E-EXTRA.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative evidence.

  dominated_by: >-
    Checked row by row. At the cells: oracle A and rho dominate everything;
    this record claims a control and two propositions. At ECC2K-130: rho at
    2^60.81 already uses the Frobenius orbit; non-stable conjugates are
    attempts, not savings. The record dominates nothing; n/a (no result claimed).
  sota_delta:
    time: >-
      Zero on every ECDLP axis. Against prior state: Proposition T (transport
      to conjugate bases), Proposition Sigma, and the first pre-priced
      measurement of conjugate-attempt correlation on a non-stable V.
    memory: Zero.
    data_queries: Not applicable.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
