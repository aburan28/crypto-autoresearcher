hypothesis:
  id: H-RELN-427bfd
  id_allocation_provenance: >-
    Token pre-minted by the orchestrating session on 2026-09-06 with
    `python3 tools/allocate_id.py --next hypothesis --area RELN` and confirmed
    free with `--check` before this record was authored. Not derived by
    scanning state; not re-minted here.
  question_id: RQ-RELN-61638a
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. GOAL-RELN-001 (factor-base decomposition
    probability audit) is the natural host, as RQ-RELN-61638a and the source
    proposal both state. Binding is a Coordinator ledger-archive act recorded
    separately; this record does not perform it.
  source_proposal: IDEA-20260906-1f6bfe
  status: proposed
  proposed_by: coordinator
  recorded_at: '2026-09-06'
  novelty_status: unverified
  novelty_note: >-
    Carried from IDEA-20260906-1f6bfe. Every external reference (PySR,
    AI Feynman, FunSearch, Bose-Chowla, Kohel-Shparlinski, Stevens-de Zeeuw,
    Bourgain-Katz-Tao) is recalled and unopened; the crypto-kb index was
    empty in the authoring session. What is claimed new to THIS PROGRAM is the
    composition (recovery-gated symbolic regression scored against a
    pre-committed list, terminating in proof obligations), not novelty
    against the literature.

  statement: >-
    A deterministic, pinned symbolic-regression pipeline -- primary engine an
    exhaustive bounded grammar search, secondary engine a hash-pinned PySR run
    -- that first recovers, with all constants free, at or below the canonical
    node count of each target and with zero residual, the three pre-registered
    proved-or-derived laws INV-1 (conservation mean C(B+m-1, m)/N,
    KN-FIND-007), INV-7 (the m = 2 exact random-base law
    1 - C(n-B, B)/C(n, B), n = (N-1)/2, IDEA-20260906-86cd30, re-checked
    exhaustively at 8-16 bits) and INV-8 (the semi-regular reference
    d_reg = ceil((m(B-1)+D_S)/2), IDEA-20260808-093497), will, when fitted on
    the dispersion index Delta = Var_r[c_D]/mu and the k-rich counts
    R_k = #{r : c_D(r) >= k} (k = 1..8, coverage = R_1/N) of x-interval bases
    on prime-order curves over the rungs N <= 2^18 with the 2^20 rung held
    out, return for the E x-interval arm a Pareto front whose survivors within
    one null standard error of the best held-out error are all algebraically
    equivalent to the random-base law INV-A1
    (Delta = 1 - m(B-1)/N + O((1+mu)/N)) and whose k-rich profile lies within
    three null standard errors of the Poisson tail N P[Poisson(mu) >= k] at
    m = 3 and of the runs law INV-A2 at m = 2 for every k with expected count
    at least 5 (the NULL outcome, which this hypothesis PREDICTS), rather than
    an expression with explicit N- or B-dependence beyond INV-A1 that predicts
    the held-out 2^20 rung by at least five null standard errors better than
    INV-A1, replicates on at least three curves, is absent on the relabelled
    Z/N random arm and is not the Z/N interval expression (the ALIVE outcome,
    not predicted) -- the two outcomes being distinguishable by the
    pre-committed criteria of EXP-RELN-141a86 and neither being reportable
    unless every Stage-0 recovery control is recovered.

  mechanism: >-
    The object is the summary-statistic vector s(D) = (mu, Delta, E_m,
    R_1..R_8, third factorial moment T) of the decomposition-count vector
    c_D(r) = #{size-m multisets from D summing to r}, as a function of
    (N, B, m, geometry, convention). Two proved anchors fix what the
    instrument must see before it is believed. (1) Conservation (KN-FIND-007,
    INV-1) makes the mean geometry-invariant, so every geometry effect lives
    in the distribution, and the second-moment identity sum_r c_D(r)^2 = E_m(D)
    (INV-2) reads the dispersion index as multiset additive energy,
    Delta = E_m/M - mu with M = C(B+m-1, m). (2) For a uniformly random
    B-subset of Z/N with N prime the pair-counting of INV-A1 gives
    E[Delta] = 1 - m(B-1)/N + O((1+mu)/N); the m = 2 x-class law INV-7 is
    exact (the decomposition graph is a path). The RANDOM law is therefore a
    closed form with no free parameter, and the question 'does an x-interval
    base carry additive structure visible in s(D)' becomes 'does any
    expression of bounded complexity in the frozen grammar fit the E-arm
    statistics on N <= 2^18 and predict 2^20 better than the random law,
    while failing on the objects where a departure is KNOWN (Z/N interval
    base [1, B], Delta of order B^2; small-multiples log-space base,
    concentration ratio 1224 at 2^18) and being absent on the relabelled Z/N
    random arm'. The exhaustive grammar engine makes 'no such expression
    below C_max' a coverage statement about the grammar rather than a remark
    about a stochastic search; the recovery controls make 'no expression'
    distinguishable from 'blind instrument'; the pre-committed list makes a
    recovered expression a comparison against something written before the
    fit; and the off-diagonal B-ladder is what separates B-dependence from
    N-dependence, which are collinear on the matched-size diagonal
    B = ceil((6N)^(1/3)). Every survivor is a proof obligation with a
    proves-too-much object and a 2^22 counterexample search before any proof
    attempt; nothing recovered is evidence.

  assumptions:
    - >-
      N = #E(F_p) is an odd prime on every curve arm, so that m < N is a unit
      mod N and the affine action of INV-3 and the distinctness casework of
      INV-A1 apply; even-order curves are outside every statement here.
    - >-
      Exhaustive count vectors at 2^20 with an off-diagonal B-ladder (at least
      three B values per rung) exist, either from the sibling battery
      EXP-RELN-f202be (IDEA-20260906-d1494b) or from the contract's own
      enumeration stage; without off-diagonal cells B and N are collinear and
      no expression can separate B-dependence from N-dependence.
    - >-
      Discrete logs are known by construction for measurement only
      (EXP-FB3-001 convention); nothing here is an attack step.
    - >-
      PySR at the pinned release honours deterministic = True with procs = 0
      and multithreading = False (recalled from the PySR review literature;
      verified at Stage 0 by two bit-identical runs, which is a blocking check
      for the secondary arm only).
    - >-
      Toy tier throughout (N <= 2^22); no crypto-scale claim follows from any
      outcome.
    - >-
      The committed EXP-FB3-001 tables are read in their own convention
      (m = 3, unsigned multisets from B distinct logs, whole-group targets,
      concentration conc = (1/N) sum_r c(c-1)) and translated to Delta only by
      the identity INV-A6, never by rescaling.

  candidate_invariants:
    - id: INV-1
      statement: >-
        For every base D of B distinct elements of a finite abelian group of
        order N and every m >= 1, sum_r c_D(r) = C(B+m-1, m); hence the mean
        per-target count mu = C(B+m-1, m)/N depends on (B, m, N) only.
      status: proved
      proof_route: >-
        Double count over size-m multisets (KN-FIND-007, derivation-level,
        validator-recomputed, confirmed on 67,784 closed-form checks in
        EXP-FB3-001). Used here as recovery control (i).
      proves_too_much_control: >-
        Not applicable as a discriminator: the identity holds on Z/N interval,
        small-multiples and random bases alike, which is why it is a control
        and not a claim about curves.
      settled_by: null
    - id: INV-2
      statement: >-
        sum_r c_D(r)^2 = E_m(D) := #{ordered pairs (A, A') of size-m multisets
        from D with sum A = sum A'}. Hence Var_r[c_D] = E_m/N - mu^2 and the
        dispersion index Delta(D) := Var/mean = E_m/M - mu. Since the M
        diagonal pairs give E_m >= M, Delta >= 1 - mu.
      status: provable_elementary
      proof_route: >-
        Expand sum_r c(r)^2 as a count of ordered pairs of multisets with the
        same sum; the rest is algebra. Checked in the source proposal; the
        a25f11 record states the m = 2 case. Not yet on the ledger at general
        m.
      proves_too_much_control: >-
        Holds for every base in every abelian group; its only discriminating
        content is the value of E_m, which the other entries address.
      settled_by: null
    - id: INV-2prime
      statement: >-
        For D of B elements drawn i.i.d. uniformly from Z/N (N prime, with
        replacement, B counted with multiplicity), E[E_m(D)] = M + M(M-1)/N
        and E[Delta] = 1 - 1/N exactly, because for A != A' the difference
        sum A - sum A' is a nonzero integer combination of independent
        uniforms with coefficients of absolute value <= m < N and is uniform
        on Z/N.
      status: provable_elementary
      proof_route: >-
        Uniformity of a nontrivial linear form in independent uniform
        variables over a prime-order group; linearity of expectation.
        CORRECTION TO THE SEED SKETCH (carried from the proposal): this is the
        with-replacement law. The program's random base is B DISTINCT logs,
        and the distinct-element correction is NOT O(m/B) as sketched but of
        order mB/N (INV-A1), which dominates the 1/N term for every B >= 2.
      proves_too_much_control: >-
        A statement about random multisets in Z/N; must hold on the Z/N
        random arm and must FAIL on the Z/N interval arm (Delta of order
        B^2).
      settled_by: null
    - id: INV-2doubleprime
      statement: >-
        If W = -W with |W| = 2B and m = 3, then for every Q in W the B
        multisets {P, -P, Q} (one per x-class, including Q's own) sum to Q,
        so c_W(Q) >= B = |W|/2 on W and E_3(W) >= 2B * B^2 = |W|^3/4. The
        forced mass is exactly 2B^2 = |W|^2/2 multisets out of
        M = C(2B+2, 3), a fraction ~ 3/(2B) of all multisets, concentrated
        on the 2B targets of W.
      status: provable_elementary
      proof_route: >-
        Direct enumeration of the forced multisets (checked in the proposal:
        the multisets {P, -P, Q} for P ranging over the B x-classes are
        pairwise distinct and distinct across Q). CORRECTION TO THE SEED
        SKETCH: the forced term |W|^3/4 exceeds the random excess
        ~ M^2/N ~ |W|^6/(36N) iff |W|^3 < 9N; at the M ~ N operating point
        |W| ~ (6N)^(1/3) the ratio forced/random is 1.5 (comparable, not
        dominant), and with |W| = 2B, B = (6N)^(1/3) it is |W|^3 = 48N > 9N
        and the random term dominates. The reduced convention (exactly m
        points, signs free, no {P, -P} pair) must be declared before any
        dispersion number is reported.
      proves_too_much_control: >-
        Must be ABSENT on the unsigned convention (the 144 FB3 cells use B
        distinct logs with no forced negation pairs) and PRESENT on the
        symmetric arm of conservation.md section 3 (B' = 234); a pipeline
        that reports a forced term on the unsigned cells has mixed
        conventions.
      settled_by: null
    - id: INV-3
      statement: >-
        The affine group of Z/N (r -> ur + t, u a unit) acts on bases with
        c_{uD+t}(ur + mt) = c_D(r). A uniformly random B-subset is invariant
        in law under this action, so for any FIXED target set S the expected
        lift rho(S) = E[sum_{r in S} c_D(r)]/(|S| mu) equals exactly 1.
        Clusters in the log coordinate cannot exist for a random base; any
        cluster is a property of the specific log-set log(D) up to affine
        maps, and the representation enters only through which log-set an
        x-defined base produces.
      status: provable_elementary
      proof_route: >-
        Multisets map to multisets under elementwise affine maps; translation
        by t alone already shows E[c_D(r)] is target-independent (m is a unit
        mod N). QUALIFICATION: the VARIANCE of a cell total needs the
        covariances P[sum A = r, sum A' = r'] for r != r', which the
        pair-counting of INV-A1 supplies but which do not follow from
        INV-2prime alone; that computation is part of the obligation.
      proves_too_much_control: >-
        Holds for random bases in Z/N with or without a curve; the
        discriminating content is entirely in the pushforward along an
        x-defined S, which is INV-4c.
      settled_by: null
    - id: INV-4
      statement: >-
        With ORDERED-tuple energy E^ord_m(D) = #{(d_1..d_m, d'_1..d'_m) in
        D^(2m) : sum d = sum d'} one has E^ord_m = (1/N) sum_chi |S_D(chi)|^(2m),
        S_D(chi) = sum_{P in D} chi(P) over characters of the cyclic group;
        the trivial character contributes B^(2m)/N, and if |S_D(chi)| <= K
        for chi != 1 then E^ord_m <= B^(2m)/N + K^(2m-2) B by Parseval.
      status: provable_elementary
      proof_route: >-
        Fourier inversion on the cyclic group; standard. TWO THRESHOLDS: the
        bound beats the trivial E^ord_m <= B^(2m-1) as soon as K < B, i.e.
        (with the recalled Kohel-Shparlinski-type K ~ p^(1/2) log p for
        x-interval bases) B > p^(1/2) log p; it certifies the RANDOM value
        B^(2m)/N (1 + o(1)) only when K^(2m-2) B << B^(2m)/N, i.e.
        B >> p^(m/(2m-1)), which at m = 3 is p^(3/5) -- far above the
        index-calculus B ~ p^(1/3). The multiset energy of INV-2 differs from
        the ordered energy by a bounded combinatorial factor per multiplicity
        pattern; the translation is part of the obligation.
      proves_too_much_control: >-
        Z/N with the interval base [1, B]: |S(chi)| ~ B at small frequencies,
        so the bound does not go through, and E_3 is of order B^5 there; the
        instrument must see that over-dispersion.
      settled_by: null
    - id: INV-4c
      statement: >-
        CONJECTURE (open target): for x-interval bases on prime-order curves
        and B in [p^(1/3), p^(1/2)], E_3(D) = (1 + o(1)) (M + M^2/N), i.e.
        Delta(D) = Delta_random (1 + o(1)); the x-interval base carries no
        excess 3-fold additive energy beyond the random law.
      status: open
      proof_route: >-
        No route below B ~ p^(3/5) is known to this record; the character-sum
        route (INV-4) is the only one recalled and it stops at p^(3/5). The
        toy instrument EXP-RELN-141a86 is the only probe; an alive outcome
        would be a formula to attack, a null outcome the measured obstruction
        (the energy excess with its interval per rung) for the record.
      proves_too_much_control: >-
        Z/N interval base (Delta of order B^2, the departure is KNOWN to
        exist) and the small-multiples log-space base (concentration ratio
        1224 at 2^18 in EXP-FB3-001); any 'no departure' expression must NOT
        fit those arms.
      settled_by: null
    - id: INV-5a
      statement: >-
        L(4 O) = span{1, x, y, x^2}, so P_1 + P_2 + P_3 + P_4 = O iff the four
        points are the intersection of E with a curve alpha x^2 + beta x +
        gamma y + delta = 0 (counted with multiplicity). Hence at m = 3,
        c_D(R) is the number of such conics through -R whose other three
        intersections with E lie in D, and at m = 2 it is the number of lines
        through -R meeting D twice. The degenerate case gamma = 0 is the pair
        of vertical lines {P, -P, Q, -Q}, which is exactly the forced
        negation cluster of INV-2doubleprime.
      status: provable_elementary
      proof_route: >-
        Riemann-Roch for the dimension, Abel's theorem for the equivalence
        sum P_i ~ 4 O iff sum P_i = O; all four points affine since O is not
        in D and R != O, so the pole order is exactly 4 and the conic is
        unique up to scalar.
      proves_too_much_control: >-
        Not applicable (an exact reformulation on the curve; it says nothing
        about Z/N and cannot be tested there).
      settled_by: null
    - id: INV-5b
      statement: >-
        CONJECTURE: the mass of k-rich targets sum_{r : c_D(r) >= k} c_D(r) for
        an x-interval base is bounded by a point-conic incidence bound over
        F_p in the two-parameter family of conics of INV-5a, giving an upper
        bound on cluster mass that decays in k faster than the random-law
        Poisson tail would allow beyond some k_0(B, p).
      status: open
      proof_route: >-
        Point-curve incidence bounds over F_p (Stevens-de Zeeuw 2017,
        Bourgain-Katz-Tao 2004; recalled) applied to the conic family through
        a fixed point; whether they beat the trivial bound at B ~ p^(1/3) is
        exactly the open question. The instrument's role is to fit the
        measured k-rich counts R_k against the Poisson tail
        N P[Poisson(mu) >= k] and report the largest k at which the two agree.
      proves_too_much_control: >-
        Z/N interval base, where k-rich mass is deterministic and large
        (c(r) of order B^2 near r = 3B/2); an incidence-type bound stated for
        curves must not hold there.
      settled_by: null
    - id: INV-6
      statement: >-
        Sigma_m(D) = Sigma_{m-1}(D) + D: if R is m-decomposable then R - P is
        (m-1)-decomposable for some P in D. Decomposability propagates along
        translation-by-D edges with an arity shift.
      status: provable_elementary
      proof_route: >-
        Definition unfolding. Recorded so that a learned model given
        translation edges is credited with a theorem, not a discovery; the
        discovery question is correlation at FIXED m along coordinate
        neighbourhoods, which is INV-4c again.
      proves_too_much_control: >-
        Not applicable (holds in every abelian group).
      settled_by: null
    - id: INV-7
      statement: >-
        On a prime-order curve, for a uniformly random B-subset V of the
        n = (N-1)/2 x-classes and any target R != O, P[R has a signed
        2-decomposition over V] = 1 - C(n-B, B)/C(n, B) (loop counted), and
        c(R) follows the runs distribution of a random B-subset of a path.
      status: provable_elementary
      proof_route: >-
        Derived in IDEA-20260906-86cd30 (proposal status, not yet
        validator-reviewed): the m = 2 incidence graph is a path, so failure
        is an independent B-set of a path. Used here as recovery control
        (ii), with the closed form RE-CHECKED by exhaustive enumeration at
        8-16 bits before it is trusted as a control; a disagreement replaces
        the control by the exhaustive table and is reported to the 86cd30
        lane.
      proves_too_much_control: >-
        Z/N interval base at m = 2 in the unsigned convention, where c(r) is a
        deterministic triangular profile, not the runs law.
      settled_by: null
    - id: INV-8
      statement: >-
        The semi-regular reference degree of the m-variable decomposition
        system with generator degrees (D_S, B, ..., B) is
        d_reg = ceil((m(B-1) + D_S)/2), the index of the first non-positive
        coefficient of (1 + z + ... + z^(B-1))^m (1 - z^(D_S)).
      status: provable_elementary
      proof_route: >-
        Generating-function coefficient a_d - a_{d - D_S} with a the m-fold
        convolution of the length-B box, unimodal and symmetric about
        m(B-1)/2; derived in IDEA-20260808-093497 and hand-verified there on
        two cells. Used as recovery control (iii) on the degree side, with the
        table generated by exact integer convolution.
      proves_too_much_control: >-
        Not a claim about curves; the control is that the formula must FAIL
        (be replaced by the true first-fall degree) on a non-semi-regular
        system, e.g. the Semaev arm of DREG whose rank deficits 1,322 /
        1,862 / 1,823 / 1,999 are exactly the departure.
      settled_by: null
    - id: INV-9
      statement: >-
        Delta(D) >= 1 - mu with equality iff D is a B_m set in the multiset
        sense (all m-fold sums with repetition distinct); under-dispersion is
        the signature of a low-energy base, and Bose-Chowla B_3 bases attain
        the floor.
      status: provable_elementary
      proof_route: >-
        The equality clause of INV-2; Bose-Chowla B_h sets have all h-fold
        sums with repetition distinct by definition (recalled). Consistent
        with the red-team measurement max_count = 1 at q = 13.
      proves_too_much_control: >-
        A Z/N statement; B_3 sets are built in log space (Z/(q^3 - 1)) and
        are not x-decidable, so the floor is a control, not a lever.
      settled_by: null
    - id: INV-A1
      statement: >-
        NEW (derived in the source proposal, unreviewed). For D a uniformly
        random B-subset of Z/N (N prime, DISTINCT elements) and m < N, the
        ordered pairs (A, A') of m-multisets whose multiset difference is
        c ({a} - {b}) for a single pair a != b and 1 <= c <= m number
        P_prop = B(B-1) C(B+m-1, m-1) (hockey-stick sum over c), and each has
        collision probability exactly 0; every other pair A != A' collides
        with probability 1/N (1 + O(m^2/N)). Hence
        E[E_m(D)] = M + (M(M-1) - P_prop)/N + O(M^2/N^2) and
        E[Delta(D)] = 1 - m(B-1)/N + O((1+mu)/N).
        At m = 3: Delta_random = 1 - 3(B-1)/N + O((1+mu)/N).
      status: provable_elementary
      proof_route: >-
        Casework on the multiset difference: proportional differences force
        a = b (c is a unit mod N), impossible under distinctness; non-
        proportional differences fix one element as a function of the others
        that avoids the excluded values except on O(1/N) of the space.
        Hockey-stick identity sum_{j=0}^{m-1} C(B-1+j, j) = C(B+m-1, m-1) and
        P_prop/(M N) = m(B-1)/N. The O-term's constant is the open part of
        the obligation. DISCLOSED ONE-CELL SPOT CHECK made by the proposal's
        author while deriving (not evidence): RUN-FB3-001-N18 cell 1
        (N = 261643, B = 117) has null concentration 1.0938256 and mean
        1.0465367, giving Delta_null = 0.99865 against the predicted
        1 - 3*116/261643 = 0.99867 and the seed sketch's 1 - 1/N = 0.999996.
        The 2^14 and 2^16 null means were NOT inspected and are the
        pre-registered check of EXP-RELN-141a86 (prediction P2).
      proves_too_much_control: >-
        A Z/N statement: must hold on the Z/N random arm and the E random arm
        alike (it is NOT a curve claim) and must FAIL on the Z/N interval and
        small-multiples arms. It is also the correction of INV-2prime that
        makes the predicted NULL outcome of INV-4c a sharp expression rather
        than '1 - 1/N'.
      settled_by: null
    - id: INV-A2
      statement: >-
        NEW. At m = 2 in the x-class convention, for a uniformly random
        B-subset V, the expected k-rich count is
        E[#{R != O : c(R) >= k}] = (N - 1) P_runs[c >= k], with P_runs the
        two-term loop mixture of the runs law of IDEA-20260906-86cd30
        Corollary 2d, because every nonzero target has the same law.
      status: provable_elementary
      proof_route: >-
        Linearity of expectation over targets plus Corollary 2a/2d of 86cd30
        (target-independence of the law); the variance of the runs count is
        classical (recalled, Feller vol. 1) and gives the second moment for
        free.
      proves_too_much_control: >-
        Z/N interval at m = 2 (deterministic k-rich profile 2B + 1 - 2k
        targets for the unsigned base [1, B], k <= B/2 roughly); the runs
        law must not fit it.
      settled_by: null
    - id: INV-A3
      statement: >-
        NEW. Exact count of the forced negation clusters at m = 3 as a
        function of |W|: for every symmetric W of size 2B, exactly
        |W|^2/2 multisets of type {P, -P, Q} exist, each target Q in W
        receives exactly |W|/2 of them, targets outside W receive none, and
        the induced dispersion floor is
        Delta(W) >= (|W|^3/4 + M - |W|^2/2)/M - mu with M = C(|W|+2, 3).
      status: provable_elementary
      proof_route: >-
        Enumeration as in INV-2doubleprime plus the diagonal count for the
        remaining multisets; equality iff the non-forced multisets have all
        sums distinct and avoid W.
      proves_too_much_control: >-
        Absent on unsigned bases (the 144 FB3 cells), present on the
        symmetric arm (B' = 234) and on any Z/N symmetric set; it is a
        convention statement, not a curve statement.
      settled_by: null
    - id: INV-A4
      statement: >-
        NEW as a stated formula. For any B_3 set D (all 3-multiset sums
        distinct) with M <= N, coverage(D) = M/N = C(B+2, 3)/N exactly and
        Delta(D) = 1 - mu; for Bose-Chowla's schedule |A| = q, N = q^3 - 1
        the coverage ratio against the Poisson random value tends to
        (1/6)/(1 - e^(-1/6)) = 1.0856. Check against the committed
        red-team probe: C(15, 3)/2196 = 455/2196 = 0.207195, which is the
        recorded coverage to six digits.
      status: provable_elementary
      proof_route: >-
        The accounting identity cov = mean - (1/N) sum (c-1)^+ of
        conservation.md with (c-1)^+ = 0 for a B_3 set. Used as a recovery
        control on the coverage side (Sidon control).
      proves_too_much_control: >-
        Log-space construction in Z/(q^3 - 1); not x-decidable; the control
        is that no x-defined base in the battery may reach it (INV-9 floor).
      settled_by: null
    - id: INV-A5
      statement: >-
        NEW. Third factorial moment under the random model: with
        T = sum_r c(c-1)(c-2) (ordered triples of pairwise distinct multisets
        with equal sums), E[T] = T_2/N^2 + T_1/N + O(.), where T_2 counts
        triples whose two difference vectors are linearly independent mod N
        and non-degenerate under distinctness and T_1 the rank-one triples;
        to leading order (1/N) E[T] = mu^3 (1 + o(1)), the Poisson third
        factorial moment, so the skewness of the random count vector is
        mu^(-1/2) (1 + o(1)).
      status: conjecture
      proof_route: >-
        Same casework as INV-A1 one level up (classify triples by the rank of
        the difference lattice); provable_elementary in the i.i.d. model, a
        conjecture with distinctness corrections whose combinatorics are not
        written out. SR target: the measured (1/N) T against mu^3 on the
        random and E arms.
      proves_too_much_control: >-
        Z/N interval base (T of order B^7, not mu^3 N); must fail there.
      settled_by: null
    - id: INV-A6
      statement: >-
        Convention-translation identity for the committed FB3 tables: with
        conc = (1/N) sum_r c(r)(c(r) - 1) (the frozen concentration statistic),
        Var_r[c] = conc + mu - mu^2 and Delta = conc/mu + 1 - mu; hence the
        144-cell table yields Delta and E_3 = N(conc + mu) exactly without
        any rescaling.
      status: provable_elementary
      proof_route: >-
        One line from sum c^2 = sum c(c-1) + sum c. Used as zero-compute
        sanity fit; the table also stores `variance`, which must equal
        conc + mean - mean^2 to floating precision in every cell.
      proves_too_much_control: >-
        Not applicable (an identity of definitions).
      settled_by: null

  predictions:
    - metric: >-
        P1 -- recovery complexity (nodes, frozen counting rule of
        EXP-RELN-141a86) and residual of INV-1, INV-7, INV-8, INV-A4, INV-A6
        on each engine
      direction: different
      minimum_effect: >-
        Each recovered at or below its canonical node count with zero residual
        on the primary engine; PySR at the pinned seed reproduces itself
        bit-identically on a second run. Any control not recovered on the
        primary engine ends the line; a control not recovered on PySR drops
        the PySR arm; a control recovered only above its canonical count is a
        degraded instrument and raises the complexity bound of every later
        claim by the excess.
    - metric: >-
        P2 -- committed-data check of INV-A1: Delta_null from the 2^14 and
        2^16 FB3 null means (Delta = conc_null/mu + 1 - mu) against
        1 - 3(B-1)/N
      direction: different
      minimum_effect: >-
        Agreement within 3 null SE of the mean (about 2e-3) at both rungs,
        for the shared untyped null of all three geometries; the sketch value
        1 - 1/N is predicted to be REJECTED by more than 10 SE at 2^14. Zero
        new compute. A miss at either rung refutes INV-A1's leading term and
        it drops to `conjecture`.
    - metric: >-
        P3 -- held-out error at 2^20 of the best expression for Delta on the
        E x-interval arm, in null SE, versus INV-A1 evaluated there
      direction: different
      minimum_effect: >-
        PREDICTED NULL: |Delta_obj - Delta_random| <= 3 null SE at 2^20 on
        every curve, and no front expression beats INV-A1's held-out error by
        more than 1 SE. ALIVE: an expression with explicit N- or B-dependence
        beyond INV-A1 that beats it by >= 5 SE at 2^20, replicated on >= 3
        curves, absent on the relabelled Z/N random arm, and not the Z/N
        interval expression -- opens a proof obligation and a 2^22
        counterexample search; it is not evidence.
    - metric: >-
        P4 -- k-rich counts R_k for k in {2..8} on the E arms against the
        Poisson tail N P[Poisson(mu) >= k] at m = 3 and against the runs law
        INV-A2 at m = 2
      direction: different
      minimum_effect: >-
        Agreement within 3 SE for every k with expected count >= 5 at m = 2
        (exact law) and at m = 3 (Poisson within the Janson bracket of
        86cd30). A replicated excess at some k_0 that GROWS with N across
        2^14..2^20 is the alive tail signature (INV-5b).
    - metric: >-
        P5 -- observation-collision set size on the Delta front per arm
        (number of distinct expressions within 1 SE of the best)
      direction: different
      minimum_effect: >-
        At least 3 on the diagonal-only data (B and N collinear), at most 1
        once the off-diagonal B-ladder is included. If the set does not
        shrink with the off-diagonal cells, the grammar's B/N separation is
        insufficient and no B-dependence claim may be made.
    - metric: >-
        P6 -- pre-registered n_vars = 21 deficit predictions from the three
        lowest-complexity fits to the DREG series 1,322 / 1,862 / 1,823 /
        1,999
      direction: different
      minimum_effect: >-
        Three numbers with complexities, emitted and hashed BEFORE any n = 21
        cell is run; scored only if EV-DREG-004's untouched cell is ever
        measured. No claim is made from four points, and the report must say
        the fit is unidentifiable at this sample size.

  test_boundary:
    instances:
      - >-
        Committed EXP-FB3-001 cells (RUN-FB3-001-N14, -N16, -N18, -FAMILY,
        -CTRL): 3 untyped x-line geometries (high_bit_interval, small_height,
        coset_union) x 3 sizes x 4 curves x 4 seeds at m = 3, unsigned
        convention, plus their shared matched-random null (200 draws) and the
        control geometries (small_multiples_H017, qr_walk_H016, symmetric
        arm).
      - >-
        Exhaustive count-vector summaries at N in {2^14, 2^16, 2^18, 2^20}
        with an off-diagonal B-ladder {round(B0/2), B0, 2 B0},
        B0 = ceil((6N)^(1/3)), m in {2, 3}, on at least 4 prime-order curves
        per rung, from EXP-RELN-f202be if archived, else from the contract's
        own enumeration stage; 2^22 only for the Stage-2 counterexample
        search.
      - >-
        Control objects: Z/N with the interval base [1, B]; relabelled Z/N
        with a random base; Bose-Chowla B_3 bases in Z/(q^3 - 1) for
        q in {29, 41, 67, 101}; the small-multiples log-space base with the
        q-decay ladder q in {0, 0.25, 0.5, 0.75, 1}.
      - >-
        The DREG deficit series (n_vars = 12 / 15 / 17 / 18) as a
        prediction-only target.
    parameters:
      arity_m: [2, 3]
      rungs_log2_N: [14, 16, 18, 20]
      held_out_rung_log2_N: 20
      counterexample_rung_log2_N: 22
      complexity_cap_nodes: 12
      statistics: [Delta, E_m, R_k for k in 1..8, coverage, third_factorial_moment]
      engines: [exhaustive_grammar, pysr_pinned]
    implementation: >-
      From-scratch exhaustive grammar engine with exact rational constant
      reconstruction (primary); PySR at a hash-pinned release with
      deterministic settings (secondary); FFT/exact multiset count-vector
      enumeration for the own-enumeration fallback; all as specified in
      EXP-RELN-141a86. No implementation exists under this design.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: 21600
      total_cpu_hours: 40
      maximum_memory_gb: 16
      maximum_runs: 8
      maximum_workers: 4

  falsification_conditions:
    - >-
      F-NULL-IS-REPORTABLE (stated first so it is not mistaken for failure):
      the NULL outcome -- every Delta survivor on the E x-interval arm
      algebraically equivalent to INV-A1 within 1 null SE, k-rich profile
      within 3 SE of the Poisson tail / runs law -- CONFIRMS this
      hypothesis's prediction and is a valid, reportable result carrying the
      measured obstruction (energy excess with its interval per rung). It is
      not an instrument failure.
    - >-
      F-ALIVE: all Stage-0 recovery controls recovered, and an expression for
      Delta, E_3 or an R_k with explicit N- or B-dependence beyond INV-A1
      beats INV-A1's held-out error at 2^20 by >= 5 null SE, replicates on
      >= 3 curves, is absent on the relabelled Z/N random arm and is not the
      Z/N interval expression. The predicted NULL is refuted; the survivor
      becomes a proof obligation with a 2^22 counterexample search before any
      proof attempt. This is the falsification of the hypothesis's
      prediction, not evidence of anything about ECDLP.
    - >-
      F-INSTRUMENT (not a mathematical outcome): any Stage-0 recovery control
      (INV-1, INV-7, INV-8, INV-A4, INV-A6) not recovered on the primary
      engine, or the Z/N interval positive control fitted by the random-law
      expression within tolerance, or the small-multiples q-decay excess not
      falling monotonically to zero. The pipeline is uninformative; no
      expression, null or alive, may be reported; the hypothesis is untested,
      and the outcome is `inconclusive` pending a re-frozen instrument under
      a new experiment ID.
    - >-
      F-A1: the committed 2^14 or 2^16 FB3 null means disagree with INV-A1's
      leading term by more than 3 SE. INV-A1 drops to `conjecture`; the
      predicted null of P3 is re-expressed against the MEASURED random arm
      instead of a closed form (a versioned amendment, never an edit).
    - >-
      F-IDENT: the observation-collision set on the Delta front does not
      shrink when the off-diagonal B-ladder is added. No B-versus-N claim may
      be made from this grammar; the null/alive verdict is scoped to the
      collinear diagonal.
    - >-
      F-PYSR: PySR at the pinned configuration does not reproduce itself
      bit-identically, or the pinned release is unavailable. The secondary
      arm is failed_infrastructure and is dropped from every claim; the
      primary arm stands alone.
    - >-
      F-CTRL-DISAGREE: the exhaustive 8-16 bit m = 2 table disagrees with the
      INV-7 closed form. The control is REPLACED by the exhaustive table and
      the disagreement is reported to the IDEA-20260906-86cd30 lane; it is
      not silently fixed.

  interpretation_limits:
    - >-
      Toy tier (N <= 2^22); no crypto-scale statement follows from any
      outcome; no exponent is moved by any outcome.
    - >-
      A recovered expression is a candidate invariant, never evidence
      (RQ-RELN-61638a constraint 4); a proof obligation is a task for a
      prover, not a result; a proof is separate work outside this record.
    - >-
      Over-dispersion is not a lever by itself: by conservation it LOWERS
      coverage, and clusters are exploitable only if they are locatable from
      x(R) without a discrete logarithm (INV-3, IDEA-20260830-c5c614). An
      alive INV-4c outcome is a formula to prove, and only its pushforward
      along an x-decidable set could ever feed an exponent.
    - >-
      Every conclusion is scoped to the frozen grammar, C_max (or the largest
      completed complexity C_complete), leaf sets, conventions, rungs, curves
      and engines; 'the random law is the only closed form' is a coverage
      statement about the grammar.
    - >-
      The candidate_invariants list is the user-facing deliverable; every
      entry's `settled_by` is null until a committed record (proof note,
      counterexample certificate, evidence record) settles it, and this
      hypothesis record never edits itself -- settlement is recorded in a
      superseding record.

  proof_search_map:
    bottleneck: >-
      Whether ANY summary statistic of the count vector for x-defined bases
      has a closed form in (N, B, m) that departs from the random law
      (INV-A1 and its k-rich, coverage and third-moment companions). If none
      does at toy scale, the cluster question of RQ-RELN-61638a(i) reduces to
      the pushforward lift of c5c614 with the random law as its analytic
      null; if one does, that expression is the theorem to prove.
    baseline_embedding:
      parameter_slice: >-
        The three recovery controls as exact slices: INV-1 on every cell
        (m = 3 and m = 2), INV-7 on the m = 2 random arm, INV-8 on the
        integer-convolution table; plus INV-A4 on the Sidon control and
        INV-A6 on the committed variance column. Every one must be recovered
        with zero residual at or below its canonical node count before Stage
        1 opens.
      reproduction_check: >-
        Frozen fixture: the hashed closed-form tables for the five controls
        and the exhaustive 8-16 bit m = 2 enumeration; both engines must emit
        the stated expressions (or algebraic equivalents, checked by symbolic
        simplification) at the stated complexity.
    observation_collision:
      observable: >-
        A (complexity, held-out error) point on the Pareto front for a target
        statistic.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: many algebraically distinct
        expressions share a front point on <= 4 rungs (e.g. 1 - 3(B-1)/N,
        1 - 3B/N and 1 - c N^(-2/3) are indistinguishable on the matched-size
        diagonal B = ceil((6N)^(1/3)) because B and N are collinear there).
        The pipeline reports every such set as a SET and never picks a
        member; the off-diagonal B-ladder is the only thing that separates
        B-dependence from N-dependence and is therefore a data REQUIREMENT,
        not an option.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Pack the statistics by convention (unsigned D at m = 3; x-class W at
          m = 2; symmetric D u -D; the degree table; the DREG series) and fit
          within a convention pack only, each pack with its own leaf set;
          cross-convention relations (the 2^m factor, the forced term) are
          candidate invariants, not preprocessing.
        predicted_gain: >-
          Removes the largest known source of spurious N-dependence
          (convention drift across records) before any fit is run, and
          bounds the enumeration per pack.
      - transform: observable_fiber
        proposed_object: >-
          For each front expression, the set of bases (E x-interval, E random,
          Z/N random, Z/N interval, Sidon, small-multiples) on which it holds;
          an expression whose fibre contains both E arms and the Z/N random
          arm is a random-set law.
        predicted_gain: >-
          Turns 'SR found a formula' into 'SR found a formula about THIS class
          of bases', which is the only form a proof obligation can take.
      - transform: stronger_invariant
        proposed_object: >-
          Replace Delta by the full k-rich profile (R_1..R_8) and the third
          factorial moment, which can detect a departure Delta cannot (a
          heavy tail with the same variance).
        predicted_gain: >-
          A departure invisible in the second moment but visible in the tail
          would still be caught; the Poisson tail is the pre-registered
          reference (INV-A5, INV-5b).
    quantifier_order: >-
      What the instrument can support: FOR ALL target statistics s in the
      declared list, FOR ALL expressions e in the frozen grammar with
      complexity <= C_max, IF e fits every cell with N <= 2^18 within the
      null SE AND predicts the 2^20 cells within the null SE, THEN e is a
      candidate invariant for s over the tested bases, with the fibre of
      bases on which it holds recorded. What it can support about the null:
      FOR ALL e in the grammar with complexity <= C_max, no e departs from
      the random law on the E arms within tolerance -- a coverage statement
      scoped to the grammar, C_max and the rungs. What it can NEVER
      support: FOR ALL N, or any statement outside the grammar.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Within this grammar, at complexity <= C_max, on these rungs and
        conventions, the only expressions for s on x-defined bases that
        survive the held-out rung are algebraically equivalent to the random
        law' -- or the complementary list of survivors with their fibres.
        SR finds expressions; proofs are separate work and are not certified
        by anything here. Nothing about m >= 4, crypto scale, solve cost or
        any exponent.
      nearby_object_control: >-
        Z/N with the interval base [1, B], where the departure from the
        random law is KNOWN to exist (E_3 of order B^5, Delta of order B^2)
        and where the instrument must recover an expression with that growth;
        and the small-multiples log-space base with concentration ratio 1224
        at 2^18. If the pipeline reports 'no departure' on either, it is
        blind and its E-arm null is void.
    proof_obligations:
      - claim: The five recovery controls are recovered at or below their canonical node counts with zero residual on the primary engine.
        responsibility: baseline
      - claim: INV-A1's O((1+mu)/N) remainder has an explicit constant, and its leading term matches the committed 2^14 and 2^16 null means.
        responsibility: correctness
      - claim: Every front expression is scored against the pre-committed list and every equal-error set is reported as a set.
        responsibility: interface
      - claim: Every survivor has a proves-too-much control on which it was actually run and a counterexample search at the next rung before any proof attempt.
        responsibility: strictness
      - claim: Off-diagonal (N, B) cells exist at every rung so that B- and N-dependence are separately identifiable.
        responsibility: feasibility
      - claim: The exhaustive enumeration reaches C_max = 12 within the stage budget, or reports the largest completed complexity and scopes every coverage statement to it.
        responsibility: runtime
      - claim: Every conclusion carries grammar, C_max, rungs, conventions and the claim tier toy.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  rerandomization_note: >-
    No worst-to-average-case device: nothing here is an algorithm for an
    instance. The only randomness is the matched-random null draws, the
    curve-cluster bootstrap and the declared engine seeds, all fixed in
    EXP-RELN-141a86.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity improvement is claimed. The proposal's target_complexity
    block is carried as 'NOT AN EXPONENT PROPOSAL'; relation collection is
    untouched.

  heuristic_assumptions:
    - id: HEUR-H1
      formal_statement: >-
        RANDOM-BASE MODEL. For D a uniformly random B-subset of Z/N (N prime)
        and every ordered pair (A, A') of distinct m-multisets whose multiset
        difference is not c({a} - {b}), P[sum A = sum A'] = 1/N (1 + O(m^2/N));
        proportional differences collide with probability 0. Consequently
        E[Delta] = 1 - m(B-1)/N + O((1+mu)/N) (INV-A1) and the k-rich profile
        is Poisson(mu) to the same order.
      random_model_justification: >-
        Exact for i.i.d. uniform elements (a nonzero linear form in
        independent uniforms over a prime-order group is uniform); the
        distinct-element version is the same statement conditioned on an
        event of probability 1 - O(B^2/N), with the proportional pairs
        removed exactly.
      supporting_results:
        - >-
          IDEA-20260906-1f6bfe candidate INV-A1 derivation (internal,
          unreviewed) and IDEA-20260906-86cd30 Theorem 2 for the exact m = 2
          case (internal, proposal status). No external citation is relied
          on; none is recalled beyond the elementary uniformity statement.
      validation_experiment_ids: [EXP-RELN-141a86]
      falsification_condition: >-
        (1) The committed 2^14 or 2^16 FB3 null means disagree with
        1 - 3(B-1)/N by more than 3 null SE (P2). (2) Exhaustive averaging
        over ALL B-subsets at N in {31, 61}, B in {4, 5}, m in {2, 3} gives
        E[E_m] differing from M + (M(M-1) - P_prop)/N by more than the
        O(M^2/N^2) term's bound. (3) Monte Carlo over 10^4 random bases at
        N ~ 2^14 and 2^16 on the off-diagonal ladder shows R_k outside 3 SE
        of Poisson(mu) at some k with expected count >= 5, or the largest
        observed c(r) outside the Poisson extreme-value prediction, or the
        smallest observed Delta below the Sidon floor 1 - mu.
    - id: HEUR-H2
      formal_statement: >-
        SEARCH COMPLETENESS. PySR at the pinned release, seed and
        configuration finds every expression of complexity <= C_max that the
        exhaustive engine finds on the same table, and the exhaustive engine
        is complete by construction up to C_max (or up to the largest
        completed complexity C_complete, reported).
      random_model_justification: >-
        Not a random model. Exhaustive enumeration is complete up to C_max by
        definition; PySR's evolutionary search has no completeness guarantee,
        and the recalled review literature says its seed controls the result
        only in single-process mode. Stated so that a PySR 'not found' is
        never used as evidence.
      supporting_results:
        - >-
          Recalled only: Review of PySR (Genetic Programming and Evolvable
          Machines, 2024; seen as a search snippet 2026-09-06, body not
          opened) on single-process reproducibility. A recalled reference is
          a pointer, not support.
      validation_experiment_ids: [EXP-RELN-141a86]
      falsification_condition: >-
        Any exhaustive-engine expression of complexity <= C_max on a control
        or Stage-1 table that PySR does not emit at the same table; a miss
        rate above 0 at any complexity demotes PySR's negatives at that
        complexity. A non-bit-identical second PySR run at the same seed
        drops the arm.
    - id: HEUR-H3
      formal_statement: >-
        RUNG TRANSFER. The (N, B)-dependence of every target statistic on the
        E arms is smooth enough between 2^18 and 2^20 that an expression
        fitted on three rungs and an off-diagonal ladder is meaningfully
        tested on a fourth; equivalently, the held-out error of a TRUE law is
        within the null SE.
      random_model_justification: >-
        The exact laws INV-1 and INV-7 transfer to any rung with zero error,
        which anchors the tolerance: a held-out failure of an m = 3
        expression is the expression's, not the rung's. This imitates the
        standard train/held-out logic of AI Feynman and PySR usage
        (recalled).
      supporting_results:
        - >-
          KN-FIND-007 (internal, established) for INV-1's exactness at every
          rung; IDEA-20260906-86cd30 (internal, proposal status) for INV-7.
      validation_experiment_ids: [EXP-RELN-141a86]
      falsification_condition: >-
        INV-1 or INV-7 fitted on N <= 2^18 has nonzero held-out error at 2^20
        or 2^22, or INV-A1 on the RANDOM arm has held-out error above 3 null
        SE at 2^20 -- in which case the tolerance for the E arms is undefined
        and no E-arm verdict is issued.

