        "grammar": "Choose a bit mask M in0..255. Evaluate only selected predicates in increasing ID order; use the chart assigned to the first true predicate, else the explicit default chart. Assignments are from enabled J, where J is one of the8 subsets of{0,1,2,3} containing3. Every selected predicate and the default has exactly one chart. The priority rule partitions every input, including O; no overlapping cell is scored twice.",
        "calibration_measurements": "For each curve/seed measure every fixed S_j over the identical128 calibration targets with3 fresh-cache stream repetitions. Retain total and per-stage/per-target process-group CPU nanoseconds and exact operation traces. For each (j,t), c_jt is the median of the3 active-query plus fallback/recovery CPU values; zero/nonpositive resolution is flagged invalid_measurement. Separately record each actual table-build cost and permitted-routing-prefix cost with3 repetitions. Full acquisition, correctness oracle, controls and optimization work remain charged in C_cal.",
        "optimizer": "For each of256 masks and8 enabled sets J, partition the calibration targets. In each nonempty priority cell choose j∈J minimizing the sum of c_jt in that cell; tie by smaller j. Empty cells/default with no training examples use chart3. Score = sum chosen cell costs + median measured total routing-prefix CPU for M + sum median actual build costs of all tables in J, with union counted once. Enabled but unused tables are still built/charged in deployment. Minimize the exact integer score; ties by(popcount M,popcount J,M,J-bitmask,assignments in selected-ID order then default). Store all2048 scores, component sums and chosen assignments, not just the winner. This is the fixed algorithm, not a claim of global optimality over arbitrary routers.",
        "subset_scope": "The eight primitive predicates and their order are fixed before calibration; only the subset, enabled chart set and assignments are fitted on the allowed calibration records. Thus at most eight predicates are used, while all members of the source’s fixed eight-element family are examined. No ninth feature, threshold search or rule permutation is allowed.",
        "fixed_deployable_comparator": "Record j_star minimizing the calibration sum c_jt plus its observed setup; tie smaller j. Its later performance is derived from the identical measured fixed S_j stream with its own calibration-selection charge. This is secondary to the source’s hindsight min_j mean fixed-chart benchmark.",
        "H1_witness_selection": "For every curve, primitive predicate i and side v, require at least32 calibration targets in that cell in each of its six streams. For each stream choose j_cell in{0,1,2,3} minimizing the sum of c_jt over that cell; tie smaller j. Compare the sum of those selected cell costs over six streams with the sum of costs of each stream's already calibration-selected j_star on the same cell. Select the (i,v) minimizing this pooled positive-denominator ratio by exact cross multiplication; tie(i,v), false before true. Store all eligible/ineligible candidates, the six j_cell values and all sums. Run the identical definition for the null feature association. Freeze the single curve-level real/null H1 witness and six cell-chart assignments before holdout. Zero denominator is invalid measurement; no eligible stratum is explicit insufficient information, without replacing a cell or sampling again.",
        "policy_artifact": "Each calibration RUN first writes calibration-measurements.json and seals policy-core.json with its exact measurement/source/fixture hashes,36 real/null routers,18 fixed choices and3+3 H1 witnesses or explicit no-eligible entries. After the private oracle flush and complete RUN manifests, global selected-policies.json copies the three sealed cores verbatim and binds their actual hashes/manifests, totaling54 real+54 null policies,54 fixed choices and9+9 H1 records. It does not hash itself, calibration-summary.json or the later global policy-score-index.json. The calibration+policy snapshot externally binds the actual global bundle SHA before holdout activation.",
        "phase_gate": "All3 calibration RUNs, required controls and raw policy-score records must be complete. The actual calibration/policy snapshot and subsequent calibration-integrity decision-only ledger TASK-20260909-341475 with DEC-20260909-406441 must be published. The separate holdout activation names the actual policy bundle SHA256, calibration source/claim/record hashes and immutable implementation lock. If any binding is absent, changed or inconsistent, refuse holdout before sampling any heldout target.",
        "null_association": "For every curve/seed and phase, uniformly permute the phase target-feature records with Fisher-Yates using purpose feature-permutation. The real arm uses the identity row map; the null arm uses the frozen permutation. Solver targets, all a/beta labels, U/Dj, overlap and target set remain unchanged. Only router-visible coordinate features are reassigned. Calibration and holdout permutations are independent. Both arms use the same full-length feature-row input structure and lookup API; permutation construction/storage and all actual extra work are charged.",
        "null_shape": "Permutation is a bijection of the exact phase features, so all one-/multi-predicate feature histograms and chart/base union/overlap are preserved. A cost-column label is never permuted into the router. Null policies use exactly the same2048-candidate optimizer and receive only their training feature association.",
        "holdout_order": "Use the identical2048 targets for all six active strategies. Repetition0 order is[S0,S1,S2,S3,real_router,null_router], repetitions1 and2 rotate left by2 and4. Every repetition starts fresh tables and process state, with one worker and no cross-method cache. Any physically common fixture/reference work has an explicit full-charge event attribution to every compared strategy.",
        "independence": "Scientific Executor implements the frozen selector; it may not edit policy by judgement, inspect heldout cost for selection or retry until a favorable policy appears. The policy validator is a separate fresh session and cannot alter the producer bytes. A defect requires an additive protocol/implementation correction and new admission.",
        "calibration_reproducibility": "The selector is deterministic given the retained measured calibration matrix and setup/prefix costs, not from the seed alone: fresh CPU measurements may choose another valid policy. This is why actual score records and actual selected-policy bytes/hash are frozen and snapshotted before holdout. Replaying the exact retained matrix must reproduce the same mask/J/assignments/H1 choices bit-for-bit. No fresh calibration is repeated to seek a favorable policy."
      },
      "cost": {
        "primary_unit": "Charged process-group CPU nanoseconds on one fixed reported hardware/software configuration. Every contribution is a directly measured stage event with a frozen attribution weight; this is not a conversion between group/field/lookup units and not an estimate of wall-clock or asymptotic complexity.",
        "physical_vs_charged": "Record physical total CPU over every helper/repetition separately from algorithm/deployment charged totals. Shared fixture/reference work is measured once but charged in full to each arm/instance that would require it, with event IDs and unit weights. Do not label the duplicated charge sum as physical CPU. No free cached input, oracle, failed search, policy tuning, verifier or copied source data.",
        "components": [
          "curve/field/challenge generation and all rejected candidates",
          "base/interval/digit/membership construction and serialization",
          "calibration timing of all four charts and all required controls",
          "all2048 real and null policy scores, failed/tied candidates and policy production",
          "holdout table setup and enabled unused tables",
          "router feature/predicate/selection work",
          "first-chart and union fallback queries, including negative targets",
          "canonical witness/group recovery and signed relation construction",
          "full independent reference census, certificate checking and all-pairs/triples calibration audit",
          "exact informative-rank/augmented-consistency/final-solution checking",
          "postrun independent frozen-verifier execution, including I/O",
          "durable raw storage/checkpoints/spill serialization and reads/writes",
          "common input equality/negation/base-membership collision audit and its witness storage"
        ],
        "target_stage": "For each stream/strategy use the complete middle-CPU holdout repetition among3, ties by repetition ID, retaining that repetition’s full component vector. Also retain all3 totals and their min/max; do not sum unrelated per-stage minima. Calibration induction C_cal is the physical sum of all actually performed training/repetitions/search/control work for that policy, not divided by3.",
        "primary_formula": "For curve c, seed s and strategy a: C_total(a,c,s)=C_acq(c,s)+C_cal(a,c,s)+C_hold_mid(a,c,s)+C_postverify(a,c,s), with all stage attributions explicitly disjoint inside each term. Learned real/null policies pay their entire allowed calibration induction, including shared chart labels charged fully. A fixed S_j has no learned-policy training charge, but pays every input/correctness/certificate prerequisite it uses. Cost to measure the other fixed comparators is retained in experiment-audit totals; the hindsight minimum is explicitly an optimistic comparator, not an uncharged selectable oracle provided to the candidate.",
        "source_ratio": "For each curve, R_c=sum_s C_total(real,c,s) / min_j sum_s C_total(S_j,c,s). The minimizing fixed chart is one j across the six streams of that curve, not a separate hindsight choice per target or seed. Divide by the identical6*2048 attempted targets to obtain mean charged target cost. All target failures and construction costs are included. Report each curve/seed/rung and no pooled-field replacement.",
        "fixed_storage": "Every strategy receives the same U point pool stored once, the same three membership masks and endpoint/factored/digit descriptions, P,Q, target law and8GiB aggregate cap. Its table/feature/model/certificate storage is additionally recorded and charged; do not pad baseline memory to hide a difference. U cardinality and overlap must be exactly equal. A memory-cap violation invalidates that comparison, not the hypothesis.",
        "diagnostics": "Keep separate exact EC add/double, base-field add/mul/inverse, integer/comparison/random/hash/table lookup counters with operand widths. No unexplained scalar sum. Record per-target SAT/UNSAT, first-chart/fallback use, full solution count, returned witness, rank increment, table entries/bytes, live/RSS peak, stored bytes and I/O. Hindsight baseline, deployed j_star, union S3, cold/steady and any modeled amortization view are labeled separately.",
        "calibration_allocation": "The stage ledger must identify physical calibration events versus copies of their charges. Real and null selector use the same measured chart-label matrix but each is charged its full generation/verification cost; null permutation construction is additional. No return from a cheap calibration subset may be scored as if unmeasured target work were known.",
        "postverification": "The independent frozen-verifier Executor rechecks already recorded certificates/metrics for both phases without generating or rerunning source samples. Its measured per-arm/instance verification cost is added by the frozen final reducer before primary ratios are finalized. Earlier execution-report ratios are provisional until this stage; it is never a free parent audit.",
        "uncertainty": "Report all six independent stream totals and all3 timing repetitions, empirical median and nearest-rank10/50/90/100 percentiles, and worst-decile mean over the largest ceil(T/10) active target costs. Ratios are exact finite descriptive statistics. No six-seed significance, population expectation or cross-curve independence theorem is claimed. Timer resolution, negative deltas, missing helper CPU or unexplained drift is invalid_measurement.",
        "zero_cases": "A denominator<=0 or missing stage cost is undefined/incomplete, never a favorable ratio. No-success, empty H1 stratum or absent construction remains explicitly separate. Stored/peak-memory quantities are not CPU units.",
        "closed_stage_map": {
          "C_acq": [
            "field/curve candidate search and exact full-order verification",
            "generator/base/challenge construction",
            "target-pool partition and membership/digit descriptions",
            "mandatory immutable input decoding and source/lock checks"
          ],
          "C_cal_learned": [
            "all128 calibration target constructions and rejections",
            "all four fixed-chart cost-label streams and all three timing repetitions",
            "training private-census/correctness/rank and ordinary identity/null/leak controls",
            "all2048 policy scores, prefix measurements, ties and winner selection",
            "policy/H1 serialization, calibration null feature permutation and verification"
          ],
          "C_cal_fixed": "No policy-induction charge for a prechosen fixed j. Any actual per-instance certificate/input check it requires is charged in C_acq or C_hold; costs incurred solely to measure other benchmark arms remain explicitly in physical experiment-audit totals, not silently given to the candidate.",
          "C_hold": [
            "all2048 target generation and rejection work",
            "enabled table construction including unused enabled tables",
            "feature/predicate/selector and query/fallback work",
            "witness conversion, free-input equality/negation audit, rank/Q-identifiability and full private-census certificate verification",
            "all required source-run startup/guards/serialization/checkpoint/spill I/O"
          ],
          "C_postverify": [
            "complete separately executed original-record verifier and final reducer costs, with exact per-arm/instance attribution"
          ],
          "audit_only": [
            "primary literature delivery and administrative snapshot/publication",
            "implementation/build and preimplementation synthetic software QA",
            "physical measurements of other comparator arms not needed to deploy a fixed prechosen j"
          ],
          "discipline": "Audit-only engineering/administrative costs are still archived and reported separately; they are not mathematical acquisition, policy training, fallback, solution verification or recovery costs. No billable algorithmic event may be reassigned audit-only. Final reducer rejects unknown/double-counted/missing stage tags and preserves physical totals alongside every attributed arm bill."
        }
      },
      "comparison": "Four fixed start strategies including full U, actual learned router and matched-null router; no hidden global best-solver or ECDLP frontier claim."
