      "fixture_contract": {
        "field_selection": "For rung b, enumerate integers p in [2^b,2^b+2^(b-3)) ascending, certify primality by complete trial division up to floor(sqrt(p)), retain the first at most32 primes satisfying p mod4=3. For each retained p, scan A,B in{0,...,63} lexicographic order. Reject 4A^3+27B^2=0. Select the first p having three qualifying curves of distinct j in Fp; retain the first three such curves in coefficient order. If no such p exists, all three rung slots are unavailable; do not extend the pool or replace the field.",
        "curve_eligibility": "Full group order N=#E(Fp) must be an odd prime, N!=p, N!=p+1 and 2^b-2^(b-4)<=N<=2^b+2^(b-4). Record trace t=p+1-N and nonzero t. j=1728*4A^3/(4A^3+27B^2) modp is used solely to avoid repeated isomorphism class within the selected field. Special j values are not silently discarded if ordinary.",
        "cardinality_certification": "Primary generator builds the exact map y^2->sorted y for all y in Fp, enumerates every x and obtains all affine points plus O. An independently implemented checker uses Euler/residue tests and the p mod4=3 root formula y=rhs^((p+1)/4), checks y^2=rhs and both signs, and compares complete point lists/counts. The point-count paths share no root table or group-add implementation. Every rejected candidate records its exact coefficient/eligibility reason, primality/count transcript and charged work; successful curves retain the entire point list.",
        "generator": "P is the lexicographically first nonidentity affine point by numeric (x,y). Because full N is prime, a nonidentity point has order N; independently verify [N]P=O and P!=O. Full curve-order proof is required, not a helper returning only a prime subgroup.",
        "points_and_encoding": "Field elements are integers0..p-1. Encode O as tag0; affine points tag1 followed by exactly w=ceil(bit_length(p)/8) big-endian bytes for x and y. Numeric point order is O first, then (x,y); no x-only keys. A negation class is {Q,-Q}, represented by the lexicographically lesser affine pair. On these odd-prime-order curves there is no nonidentity y=0 point. Controls include that case separately.",
        "randomness": "Counter stream SHA256 over UTF8 compact JSON array [\"EXP-RELN-bbe291/v1\",b,curve_slot,stream_seed,phase,purpose,counter]. Strings are literal ASCII, integers decimal with no leading zeros, separators comma/colon and no whitespace, no Unicode normalization. Counter starts0 per purpose; digest interpreted unsigned big-endian. Draw range M by rejecting u>=floor(2^256/M)*M, then u modM. Log every counter/rejection. Independence is the declared seed-stream construction, not a proof that deterministic hashes are random.",
        "base_selection": "Let K_b be8,20,48. Sort all (N-1)/2 nonidentity negation classes by numeric x. Draw a uniform offset w0 in0..((N-1)/2-2K_b) with purpose base-offset. Keep the consecutive2K_b classes from w0. Allow coincident offsets across independent seed streams, label them and do not resample by cost. Their both-sign union U has exactly4K_b points.",
        "charts": "D0 takes local class indices0..K-1; D1 takes K/2..3K/2-1; D2 takes K..2K-1, always both signs. Each chart has2K points, adjacent overlaps K points, D0∩D2 empty and no triple overlap. D3=U is the full-union fixed strategy/fallback. Record exact endpoints ell_j=x(first class),u_j=x(last class), all class/sign maps, memberships and raw point lists.",
        "interval_digit_membership_mapping": "Each Dj is precisely the curve points whose x lies in integer interval[ell_j,u_j], because its classes are consecutive among all eligible x values. Equivalently write x=ell_j+sum_{k=0}^{d_j-1}2^k z_k as an integer, z_k∈{0,1}, d_j=ceil(log2(u_j-ell_j+1)), impose0<=sum<=u_j-ell_j and x<p; no modular wrap. The exact finite membership polynomial is the factored product over the K distinct selected x values. Degree K and all factors are stored; no expansion or polynomial solving is falsely claimed cheap. The verifier checks interval, digit/range and root-list membership agree on the complete curve-point list. The tested solver materializes these same points; untested polynomial-solver claims are excluded.",
        "challenge": "For each curve/seed instance draw Q uniformly from the full group point list with purpose challenge, rejecting O, ±P and every point in U. Do not compute or store log_P(Q) or factor-base logs. The fixed point Q is used only to generate public targets and verify final optional rank solutions.",
        "target_split": "Generate a Fisher-Yates permutation of the complete sorted group point list using phase split/purpose target-partition and the fixed counter law. First floor(N/4) points form C; the rest H. Freeze both sets before training, but keep the heldout sample sequence unmaterialized until actual policy publication. Require |C|>=128 and |H|>=2048; otherwise the instance is unavailable without new seeds or substitution. Only membership/hash commitments are exposed outside the input controller as necessary.",
        "target_sampling": "For each phase sample independent a,beta uniformly from F_N using purpose target-a and target-b; form R=[a]P+[beta]Q with the fixed double-and-add algorithm and record its construction cost. Reject if R is outside that phase pool or already selected in that same phase. Retry at most1,048,576 candidate pairs per accepted target position; preserve failures. Exactly128 calibration and2048 holdout targets are distinct within phase and disjoint across phases for that instance. Public a,beta do not enter router features. The target law is uniform without replacement on the declared C or H pool under the stated uniform-draw model; all strategies share the identical samples.",
        "unavailable_rule": "A missing field/curve/base/challenge/target construction is an unavailable source slot, not a replacement, successful sample or negative mathematical result. Preserve all attempts and gate later complete conclusions. No exact parameter values are claimed generated by this design.",
        "scalar_multiplication": "Use nonnegative scalar representatives0..N-1, MSB-first binary double-and-add starting O; for each bit double then conditionally add the input point, including explicit scalar0. No window/precomputed scalar table or uncharged batch method. The independent checker may use its separately frozen projective path, with all its work separately charged."
