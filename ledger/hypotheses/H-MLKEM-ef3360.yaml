hypothesis:
  id: H-MLKEM-ef3360
  question_id: RQ-MLKEM-003
  added: '2026-08-25'
  derived_from_idea: IDEA-20260821-374af4
  statement: >-
    THE DIMENSIONS-FOR-FREE DISCOUNT IS COMMITTED IN THIS PROGRAM AS A SIZE BUT NEVER AS AN ACHIEVABLE
    COUNT. Three claims that can each fail independently.
    (S1) THE ACHIEVABLE COUNT DEPARTS FROM THE CHARGED LAW. Define f_meas(beta) as the largest lift depth
    f such that a sieve run in the projected sublattice of dimension beta - f, followed by Babai lifting
    of every pool vector back to the full block, still returns a vector of norm at most a pre-declared
    multiple of the Gaussian heuristic. On ML-KEM-shaped q-ary bases, over the CLAMP-FREE blocksize window
    where the implementation's own wrapper does not bind, f_meas departs from the closed-form law THE
    PINNED ESTIMATOR ACTUALLY CHARGES by at least 1.5 dimensions, with a sign STABLE ACROSS SEEDS. The
    SIGN is the deliverable - positive means the estimator charges too much and the committed bit counts
    are overstated; negative means they are understated.
    (S2) THE DISCOUNT IS A PROPERTY OF SIEVING, NOT OF POOL SIZE. The sieve pool's f_meas exceeds that of a
    matched non-sieve pool of the same cardinality and the same decile-by-decile norm profile, run through
    the identical lifting code path, by at least 1.0 dimension; and the pool-cardinality-forced component
    of f_meas, computed in closed form before any run, does not account for the whole of it.
    (S3) THE TWO LAWS ARE SEPARABLE IN LEVEL BUT NOT IN SLOPE. Over the reachable window the two published
    laws differ by more than the design's claimed 1.5-dimension resolution in LEVEL, so the LEVEL test
    discriminates them; their SLOPES over the same window differ by far less than the design can resolve,
    so the slope is reported as a consistency check and is NOT the discriminator.
    EXPLICITLY WITHDRAWN AND NOT CLAIMED - that this repository holds no dimensions-for-free value. It
    holds a committed magnitude from a prior batch, carried as a numbered hypothesis in a committed evidence
    record, and that leg is withdrawn. WHAT REMAINS is f_meas, for which no record holds a value, a bound or
    a null floor.
  mechanism: >-
    The estimator's cost is exponential in an EFFECTIVE sieve dimension that is already net of a
    dimensions-for-free subtraction, so a shift of D dimensions in the subtraction rule moves the reported
    cost by a fixed number of bits per dimension. Every dimensions-for-free number in this program is the
    output of EVALUATING A FORMULA, not of running a sieve and seeing how many dimensions it could actually
    give up. The tracked object closes that gap - the minimum Babai-lifted norm over the pool as a function
    of lift depth. That object is hard-lossy in a direction compatible with its consumer: the full state is a
    pool of very many vectors, the projection retains ONE scalar per lift depth and discards which vector
    achieved it, all other vectors, all coefficient data and the whole geometry of the pool; but Babai lifting
    is applied vector-wise, so the minimum over the lifted pool is determined by the pool AS A SET, and the
    downstream consumer - the reduction tour - uses only the shortest lifted vector it is handed. Increasing
    the lift depth by one composes one more rounding step onto every lift and removes one dimension of
    sieving, so the minimum is non-decreasing in depth IN EXPECTATION - which is a CHEAP INTERNAL FALSIFIER,
    because a measured non-monotonicity means the lifting implementation is wrong and no achievable count is
    reportable at all. CRITICALLY, the measurement SETS the lift depth explicitly, so the implementation's own
    free-dimension choice does not enter the measured quantity; it enters only the choice of which law a
    residual is taken against, and over part of the window the value the implementation applies is FORCED by
    a clamp rather than by any property of the lattice.
  assumptions:
  - >-
    The committed magnitude of the discount and the identity of the law the pinned estimator charges are taken
    from COMMITTED EVIDENCE and are NOT re-established here. If a zero-compute programmatic reproduction
    disagrees with the parent record's hand arithmetic, that part of the parent is VOID and the disagreement is
    the reportable result.
  - >-
    The instrument can be rebuilt. Its own committed reproducibility warning says it will not survive a session
    boundary, and a failed rebuild is an INFRASTRUCTURE failure under AGENTS.md rule 5, never negative evidence.
  - >-
    The clamp-free blocksize window is reachable within budget. Committed timings at a lower dimension make this
    plausible but do NOT establish it for the lifting-augmented variant, and the window above the reachable
    range is explicitly NOT assumed reachable - the cost grows steeply enough in the dimension that a
    substantially larger blocksize is outside any plausible batch budget, which is why the clamp-free window is
    only a few cells wide.
  - >-
    The success radius is declared BEFORE any data exists and is never revised. A radius chosen after seeing the
    lifted-norm curve would set the achievable count to whatever is wanted.
  - >-
    The measurement sets the lift depth explicitly, so the implementation's wrapper does not enter the measured
    quantity. It enters only the naming of the residual's target - and over the clamped part of the window the
    applied value is FORCED by the wrapper and is therefore inadmissible as a finding.
  - >-
    The core-SVP time constant used to convert dimensions to bits is a CONVENTION recorded in this corpus, not a
    verified quantity. If it is wrong the conversion factor changes but the structure of the claim does not.
  proof_search_map:
    bottleneck: >-
      Not a proof. The bottleneck in the COST CHAIN, which is what this hypothesis targets, is the map from
      blocksize to effective sieve dimension. Everything downstream - the time exponent, the memory charge, the
      category comparison - is applied to that number. A prior committed batch established what that map's
      FORMULA is worth; what is unestablished is whether a real pool ACHIEVES it.
    baseline_embedding:
      parameter_slice: >-
        Lift depth zero reproduces the no-discount baseline exactly - the sieve runs at full blocksize and the
        tracked minimum is the pool minimum. This is the exact old-method boundary, and the prior batch's
        switched-off counterfactual is its committed arithmetic analogue.
      reproduction_check: >-
        BITWISE - at lift depth zero the tracked minimum must equal the pool minimum computed by an INDEPENDENT
        code path, on a frozen fixture at one blocksize and one seed, re-checked on every instrument rebuild.
        Additionally, a zero-compute stage must reproduce the committed discount values from the closed-form law
        at the committed blocksizes, and reproduce the inversion of the committed effective dimensions back to
        nominal blocksizes, BEFORE either is cited.
    observation_collision:
      observable: 'f_meas(beta), a single integer per blocksize and seed.'
      distinct_preimage_search: >-
        COLLISION FOUND, AND IT IS THE POINT OF THE NULL OBJECT - a non-sieve pool with matched cardinality and
        matched norm multiset is a distinct preimage that MAY yield the same achievable count. The design does
        not assume it does not; it MEASURES it. If the collision is real, f_meas does not identify 'sieving' and
        the interpretation is restricted to 'a pool of this size and this norm profile', which is stated as the
        scope in that branch. A SECOND COLLISION - over the clamped part of the window the value the
        implementation applies and the estimator's charged law are numerically close at one end and far at the
        other, so a residual quoted WITHOUT NAMING ITS TARGET is ambiguous by many dimensions. Every residual
        carries its target's name or it is not reportable.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the CHARGED discount convention by the MEASURED threshold, moving the estimator input from a
        formula to an observed quantity with an error bar.
      predicted_gain: >-
        A SIGNED correction of size (the core-SVP constant) times (the measured minus the charged count) bits per
        parameter set, with the sign UNKNOWN before the run. Against the committed margins, a correction of a
        handful of dimensions is decision-relevant at the largest parameter set and a large minority of the margin
        at the others.
    quantifier_order: >-
      FOR ALL blocksizes in the clamp-free window and FOR ALL seeds in the declared set, THERE EXISTS a lift depth
      such that the tracked minimum clears the declared radius at every depth up to it and fails at the next. The
      claim is then about the SEED-AVERAGED achievable count and its residual against the charged law. NOTE THE
      ORDER CAREFULLY - nothing is claimed uniformly in blocksize beyond the measured window, the extrapolation
      heuristic is the ONLY bridge to the estimator's own blocksizes, and the clamped cells are quantified
      SEPARATELY and contribute NO statement about which law the estimator should charge.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At the executed blocksizes, on ML-KEM-shaped q-ary bases with this modulus and this sieve kernel, the
        achievable free-dimension count is the measured value with its interval, and its signed residual against
        the law the pinned estimator charges is the measured residual with its interval.' Nothing about the
        standardized parameter sets' blocksizes, nothing about other lattice families, nothing about other sieve
        kernels, and nothing about which law is right outside the executed window.
      nearby_object_control: >-
        A lattice with an unusually FLAT Gram-Schmidt profile - a random unimodular-transformed cube - where
        lifting should succeed far deeper because there is no q-ary shape to fight. Running the same measurement
        there MUST give a materially different achievable count; if it gives the same one, the instrument is
        reading a property of the LIFTING CODE and not of the lattice.
    proof_obligations:
    - claim: 'At lift depth zero the tracked minimum equals the pool minimum bitwise.'
      responsibility: baseline
    - claim: 'The tracked minimum is non-decreasing in lift depth up to noise.'
      responsibility: correctness
    - claim: 'The pool-cardinality-forced component of the achievable count is computed in closed form and subtracted.'
      responsibility: strictness
    - claim: 'Every residual names its target law, and the clamped cells'' residuals are reported against all three targets.'
      responsibility: interface
    - claim: 'The null object is drawn at least eight times per cell and reported as an interval.'
      responsibility: success_probability
    - claim: 'The zero-compute stage reproduces the committed discount values and the inversion programmatically before either is cited.'
      responsibility: baseline
    - claim: 'No statement is made about blocksizes above the executed window except through the extrapolation heuristic.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. No attack, no break, no exponent moved, and no statement about the security of any
    standardized parameter set. Measurements in the executed window are TOY SCALE and say nothing about the
    estimator's own blocksizes except through a numbered extrapolation heuristic whose whole content is that the
    extrapolation is an ASSUMPTION. A measurement that AGREES with a law inside error is a real and reportable
    outcome that closes nothing. Nothing here is offered as a correction to any committed evidence record, and the
    independent-review requirement is UNMET and inherited.
  heuristic_assumptions:
  - id: H1
    formal_statement: >-
      BLOCKSIZE EXTRAPOLATION. The signed residual between the achievable free-dimension count and the closed-form
      law charged by the pinned estimator, measured at blocksizes in the executed clamp-free window on
      ML-KEM-shaped q-ary bases, has the SAME SIGN and an order-of-magnitude comparable size at the blocksizes the
      estimator actually evaluates for the standardized parameter sets, which are an order of magnitude larger.
    random_model_justification: >-
      NOT a randomness heuristic and it is not dressed as one. It is a pure extrapolation assumption and its whole
      content is that it is an assumption. There is no random model under which a residual measured at a small
      blocksize must persist at a large one; the closed-form law's own asymptotic character means the residual
      could plausibly shrink, grow or change sign. THIS IS THE ONLY BRIDGE between the measurement and any
      statement about standardized parameters, and every extrapolated number must be labelled as extrapolated and
      never as measured.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      Not falsifiable within this hypothesis's budget, and that is stated rather than hidden - reaching the
      estimator's own blocksizes is far outside any plausible batch budget on this instrument. The correct
      handling is therefore to report the extrapolated bit correction as an EXTRAPOLATION with H1 named, never as
      a measurement, and to refuse any category verdict that rests on it.
  - id: H2
    formal_statement: >-
      KERNEL AND PROFILE GENERALITY. The achievable free-dimension count measured with one sieve kernel on
      q-ary bases at the executed blocksizes is representative of the count other kernels would achieve on
      lattices of the same Gram-Schmidt profile, up to the declared resolution.
    random_model_justification: >-
      Not a randomness heuristic. Different sieve kernels do not produce the same pool, so the achievable count is
      scoped to the kernel used unless at least two are run. This is declared as an assumption precisely so that
      a single-kernel number is not read as a kernel-free one.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-a32c63
    falsification_condition: >-
      Two kernels run at the same blocksize and seed give achievable counts differing by more than the declared
      resolution. Then the number is about ONE kernel and every residual must carry the kernel's name.
  structural_ingredients:
  - description: >-
      The dimensions-for-free construction - sieving in a projected sublattice and lifting pool vectors back by
      Babai rounding, with an asymptotic count of order the dimension over its logarithm.
    citation: 'The corpus''s literature entry for the dimensions-for-free paper, whose own record notes the analysis was not re-derived here.'
    provenance: internal
    verified_by: KN-LIT-105
    role: defines the object being measured and supplies the closed-form law the estimator charges
  - description: >-
      The committed magnitude of the discount in this program, and the identification of which law the pinned
      estimator implements, both read off a committed batch's own run output and its evidence record's numbered
      hypothesis.
    citation: 'GOAL-MLKEM-003 BATCH-011 committed results and EV-MLKEM-021''s numbered dimensions-for-free hypothesis.'
    provenance: internal
    verified_by: ledger/evidence/EV-MLKEM-021.yaml
    role: >-
      the committed baseline; THIS ENTRY IS THE REASON ONE LEG OF THE PARENT PROPOSAL IS WITHDRAWN, and nothing
      here proposes that it is wrong about anything
  - description: >-
      The committed primal costs, margins against the classical cutoffs, and effective sieve dimensions at the
      three standardized parameter sets, under a pinned estimator commit.
    citation: EV-MLKEM-020.
    provenance: internal
    verified_by: ledger/evidence/EV-MLKEM-020.yaml
    role: supplies the margins against which any extrapolated correction is judged decision-relevant or not
  - description: >-
      The implementation's free-dimension wrapper, which CLAMPS the linear rule and returns zero below a
      threshold, so that over part of any small-blocksize window the applied value is forced by the clamp and not
      by the law.
    citation: 'The sieve library''s block-reduction module, functions for the default free-dimension rule and its wrapper.'
    provenance: retrieved
    verified_by: idea-generator@2026-08-24 in IDEA-20260821-374af4
    role: >-
      determines which cells of the measurement window are clamp-free, hence which residuals bear on the
      estimator's charge at all
  - description: >-
      The recorded inability to combine the discount with bulk short-vector output, held as an open problem of
      this program.
    citation: KN-LIT-109, KN-OPEN-016.
    provenance: internal
    verified_by: knowledge/open-problems/KN-OPEN-016.md
    role: >-
      the standing constraint on any ATTACK use of a large achievable count; this hypothesis measures the count and
      makes no attack, so it neither closes nor is closed by that open problem
  predictions:
  - metric: >-
      signed residual of the seed-averaged achievable count against the law the ESTIMATOR charges, over the
      clamp-free window, in dimensions
    direction: different
    minimum_effect: >-
      At least 1.5 dimensions in magnitude, with the sign stable across seeds. A residual within 1.5 of zero across
      the whole clamp-free window is a NEGATIVE and is the outcome to bet on second-most.
  - metric: >-
      signed residual of the seed-averaged achievable count against the UNCLAMPED linear implementation law, same
      window, in dimensions
    direction: different
    minimum_effect: >-
      At least 1.5 dimensions. Reported SEPARATELY from the estimator-law residual - a residual against one is not
      a residual against the other, and merging them is the single most likely misreading of the output.
  - metric: >-
      signed residual against the value the implementation ACTUALLY APPLIES, over the CLAMPED cells, in dimensions
    direction: different
    minimum_effect: >-
      At least 1.5 dimensions, reported separately and NEVER merged with the clamp-free window, because the applied
      value there is forced by the wrapper and not by the lattice.
  - metric: 'achievable count on the sieve pool minus achievable count on the matched non-sieve null pool, in dimensions'
    direction: higher
    minimum_effect: >-
      At least 1.0 dimension. If the null returns the same count within its interval, the discount is a property of
      pool size and norm profile rather than of sieving, and no sieve-derived statement is reportable from this
      instrument.
  - metric: 'fitted slope of the achievable count against blocksize over the whole window, with its confidence interval'
    direction: different
    minimum_effect: >-
      DEMOTED DELIBERATELY, AND THE ARITHMETIC THAT DEMOTES IT IS PART OF THE PREDICTION. The two published laws'
      slopes over the reachable window differ by far less than this design can resolve, so a minimum effect stated
      against one of them would be larger than the separation it is meant to detect and could not fire in the
      intended direction. THE REQUIREMENT IS - report the fitted slope with an interval and state whether that
      interval excludes each law's slope, both, or neither. The slope is a CONSISTENCY CHECK, not the
      discriminator.
  - metric: 'level separation actually available between the two laws over the measured window, in dimensions'
    direction: higher
    minimum_effect: >-
      Above the design's claimed 1.5-dimension resolution. THIS is the metric the discrimination rests on, and if it
      falls below the resolution the design cannot separate the conventions and must say so.
  test_boundary:
    instances:
    - >-
      ML-KEM-shaped q-ary bases at the standardized modulus, BKZ-preprocessed under a pinned preprocessing recipe,
      at blocksizes in a clamp-free PRIMARY window and a clamped SECONDARY window.
    - >-
      The matched non-sieve null pool at every cell - random integer combinations followed by Babai rounding against
      the same reduced basis, resampled until the norm multiset matches the real pool decile by decile.
    - >-
      The flat-profile nearby object - a random unimodular-transformed cube - at a subset of cells.
    parameters:
      windows: 'a clamp-free primary window and a clamped secondary window, with the clamp crossover computed and frozen before any run'
      seeds: 'three per blocksize'
      success_radius: 'declared before any data exists, with the achievable count also reported at three declared radii so the dependence is visible'
      null_draws: 'at least eight per cell, reported as an interval'
      kernels: 'at least two sieve kernels, or every number is scoped to one kernel by name'
    implementation: >-
      A rebuilt lattice-sieving instrument at pinned versions, with the rebuild receipt reproducing a committed
      database size before any new measurement is trusted; explicit lift-depth sweeps with Babai lifting of every
      pool vector; an independent code path for the depth-zero pool minimum. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 21600
      total_cpu_hours: 60.0
      maximum_memory_gb: 64
      maximum_runs: 40
  distinguishable_outcomes:
  - >-
    O1 (MEASURABLE SIGNED RESIDUAL). The zero-compute stage reproduces the committed values and the inversion; the
    depth-zero bitwise check and the monotonicity gate pass; the null gap is at least 1.0 dimension; and the residual
    against the estimator's charged law is at least 1.5 dimensions with a stable sign across seeds. MEANING - at the
    executed blocksizes the charged discount and the achievable one differ by a measured signed amount; POSITIVE
    means the estimator charges too much and the committed bit counts are overstated, NEGATIVE means they are
    understated. Any statement about standardized parameters from this is an EXTRAPOLATION under H1 and is labelled
    as one.
  - >-
    O2 (CONVENTION QUESTION EMPIRICALLY EMPTY - THE SECOND-MOST-LIKELY OUTCOME). Both residuals lie within 1.5
    dimensions of zero across the clamp-free window. MEANING - the two laws agree with measurement and with each
    other where it can be checked, the convention question is empty in this range, and the extrapolation gap at the
    estimator's own blocksizes is the only remaining uncertainty. A real negative.
  - >-
    O3 (NOT ABOUT SIEVING). The matched non-sieve null returns the same achievable count within its interval.
    MEANING - the discount is a property of pool CARDINALITY and NORM PROFILE, not of sieving; the whole literature
    attribution to sieving is not readable from this instrument, and that strong negative is the headline.
  - >-
    O4 (LIFTING BROKEN). The tracked minimum is not monotone in lift depth. MEANING - the lifting implementation is
    wrong; NO achievable count is reported and the batch reports an implementation defect.
  - >-
    O5 (OBJECT DISSOLVES). The measured achievable count equals the closed-form pool-cardinality-forced component
    within error. MEANING - the measurement is about cardinality and the tracked object carries no independent
    content.
  - >-
    O6 (INSTRUMENT READS ITS OWN CODE). The flat-profile nearby object returns the same achievable count as the
    q-ary bases. MEANING - the instrument is reading the lifting code rather than the lattice and the object is void.
  - >-
    O7 (RESOLUTION INSUFFICIENT). The seed intervals at every clamp-free cell overlap BOTH published laws. MEANING -
    the reachable window cannot separate the conventions at the claimed resolution, and the record reports that the
    discrimination it proposed is NOT achievable on this instrument. Declared in advance so it is a result and not a
    disappointment.
  - >-
    O8 (PARENT ARITHMETIC VOID). The zero-compute programmatic stage does not reproduce the committed discount values
    from the closed-form law, or does not invert the committed effective dimensions to the stated nominal blocksizes.
    MEANING - the parent's hand arithmetic is wrong, every law-versus-law gap figure it states is void, and the
    disagreement is the reportable result. This is the CHEAPEST way this hypothesis can fail and it fails before any
    sieve runs.
  falsification_conditions:
  - >-
    Both residuals lie within 1.5 dimensions of zero across the clamp-free window - S1 is false in the tested range.
  - >-
    The matched non-sieve null returns the same achievable count within its interval - S2 is false; the discount is
    not a sieving property as far as this instrument can see.
  - >-
    The measured achievable count equals the pool-cardinality-forced component within error - the object dissolves.
  - >-
    The tracked minimum is not monotone in lift depth - the lifting implementation is wrong and nothing is reported.
  - >-
    The flat-profile nearby object returns the same achievable count - the instrument reads its own code.
  - >-
    The level separation between the two laws over the measured window falls below the claimed resolution - S3 is
    false and the design's discriminator does not exist.
  - >-
    The zero-compute programmatic stage disagrees with the parent's hand arithmetic - that part of the parent is
    void.
  interpretation_limits:
  - >-
    The executed blocksizes are TOY SCALE, and the clamp-free part of the window is only a few cells wide. Nothing
    here is a statement about the standardized parameter sets, which need blocksizes an order of magnitude larger.
    The only bridge is H1 and it is an ASSUMPTION.
  - >-
    The estimator charges one law and the implementation applies another, clamped. A residual against one is NOT a
    residual against the other, and the output is uninterpretable if the two are merged. Only a residual against the
    ESTIMATOR's law bears on the committed bit counts.
  - >-
    Over the clamped cells the applied value is FORCED by the wrapper and not by the lattice. Reporting that the
    applied value is far below a law there is a FORCED FACT and is inadmissible as a finding.
  - >-
    Nothing here is offered as a correction to any committed evidence record or to the prior batch, and nothing here
    moves the status of any existing hypothesis. The independent-review requirement is unmet and inherited.
  - >-
    A large achievable count would still face the recorded open problem of combining the discount with bulk
    short-vector output before it could become an attack improvement. This hypothesis measures the count and makes no
    attack; it neither closes nor is closed by that open problem.
  - >-
    The achievable count is scoped to the sieve kernel used and to the preprocessing recipe pinned. Different kernels
    do not produce the same pool, and two runs at the same blocksize with different preprocessing give different
    counts.
