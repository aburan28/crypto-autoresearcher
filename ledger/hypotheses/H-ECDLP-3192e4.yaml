# =============================================================================
# H-ECDLP-3192e4 — specified from IDEA-20261006-688a37 (bytes copied
# unchanged from origin/design/ectd-e7ad98-conductor, blob
# 51b7c6c2d2c4b08264742473401566e857c5e7cc). Question RQ-ECDLP-4fcbd3.
# The prediction under test is the idea's own: the integers Z_1*N_2
# and Z_2*N_1 differ by at least 1, after both models have been
# checked nonsingular and ordinary. The concrete negative is that
# those two products are equal. This record does not move the
# generic exponent 1/2.
# =============================================================================
hypothesis:
  id: H-ECDLP-3192e4
  question_id: RQ-ECDLP-4fcbd3
  source_idea_ids:
    - IDEA-20261006-688a37
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Y-axis hit counts along scalars 2, 5, and 11 differ as rates on
    y^2 = x^3 + x + 1 and y^2 = x^3 + x + 2 over F_2053
  statement: >-
    Let p = 2053. Let E1 be y^2 = x^3 + x + 1 and E2 be
    y^2 = x^3 + x + 2 over F_p. For m in {2, 5, 11}, the proper
    prefix scalars of 11 = 1011_2 after the leading 1, and for P in
    E_i(F_p), count a hit when [m]P is affine and has x-coordinate 0.
    Let Z_i be that hit count and let N_i = #E_i(F_p), including the
    point at infinity. The prediction taken from IDEA-20261006-688a37
    is that Z_1*N_2 and Z_2*N_1 differ by at least 1, after both
    curves have been checked nonsingular and ordinary, meaning N_i
    is not p + 1 = 2054. The concrete negative is that the instrument
    checks pass and Z_1*N_2 equals Z_2*N_1. Equality of the two
    products is the negative. A singular model or a model with
    N_i = 2054 means the ordinary pair is not available. That
    outcome is not a rate and is not the negative. This cell is not
    a discrete logarithm and does not move the generic exponent 1/2.
  mechanism: >-
    The representation is the affine x-coordinate. The operation set
    is the three maps [2], [5], and [11] coming from one fixed binary
    chain. The predicate x([m]P) = 0 is not a function of the
    predicate x(P) = 0, so the label does not propagate
    deterministically along those maps. The projection keeps only
    whether x([m]P) is 0 and discards y, the discrete log, and every
    nonzero x. Many points share the miss label, so the projection
    is lossy. Z_i counts the fiber of x = 0 under the three maps.
    The integer the claim prices is the absolute difference of the
    cross products Z_1*N_2 and Z_2*N_1. Group order is cancelled by
    the cross product. Equality of the products is the observation
    that the two rates agree, including the case where both hit
    counts are 0.
  assumptions:
    - p = 2053 is prime. The source idea checked this by trial division by every prime at most 43. This cell recomputes that check and does not trust it silently.
    - For A = 1 and B = 1, 4 A^3 + 27 B^2 = 31, which is not 0 in F_2053. For A = 1 and B = 2 the same quantity is 112, which is not 0 in F_2053. Both models are nonsingular when those values are recomputed as nonzero.
    - (0, 1) and (0, -1) lie on E1 because both squares equal 1 and the right-hand side at x = 0 is 1. No such substitution is asserted for E2.
    - The prefix scalars of 11 = 1011_2 after the leading 1 are exactly 2, then 5, then 11. No other addition chain is used.
    - The point at infinity is never a hit. An implementation that stores infinity as x = 0 does not measure Z_i.
  proof_search_map:
    bottleneck: >-
      The cross-product gap |Z_1*N_2 - Z_2*N_1| at p = 2053 on the
      two named cubics. Group order alone is a confounder and is
      cancelled by the cross product. The gap is not an exponent.
    baseline_embedding:
      parameter_slice: >-
        p = 2053, scalar 11, prefixes {2, 5, 11}, models E1 and E2.
        The minimum effect is an absolute difference of at least 1.
      reproduction_check: >-
        Each scalar is computed by double-and-add and again by adding
        P repeatedly. The two images must agree on every point.
        Disagreement voids the cell. Each reported hit is checked to
        satisfy the cubic.
    observation_collision:
      observable: the unordered pair of rates, represented by the two products Z_i * N of the other curve
      distinct_preimage_search: >-
        E1 and E2 are two cubics at the same p. If the products
        agree, the same observable arises from both equations.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the fiber of x = 0 under each prefix map [m]
        predicted_gain: >-
          The cross products differ by at least 1, or the record
          reports that they do not. No change to the exponent 1/2.
    quantifier_order: >-
      There exist one prime p = 2053 and two named ordinary
      nonsingular models such that the absolute difference of the
      cross products is at least 1. A universal quantifier over all
      primes and all cubics is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        At p = 2053 the two rates differ, or they do not. No discrete
        logarithm and no sub-rho algorithm is certifiable from Z_i.
      nearby_object_control: >-
        The same maps scored against a frozen permutation of the
        x-labels, using the same group law, are reported beside the
        cubic products. If that control gap has the same absolute
        value, the cubic gap is not interpreted as special to these
        two equations. The control does not replace Z_i.
    proof_obligations:
      - claim: Z_i counts only affine points with x = 0 on the named prefixes, and N_i counts every rational point including infinity.
        responsibility: correctness
      - claim: A product equality, with the instrument checks passed, is a negative for the gap. It is not a confirmation.
        responsibility: scope
    not_applicable_reason: >-
      The map applies to this one integer comparison. No subfield is
      waived. The cell is not a theorem about Pollard rho.
  rerandomization: >-
    No re-randomizing walk is used. The two cubics and the three
    scalars are frozen. Nothing pulls a discrete logarithm back to
    an input point.
  asymptotic_claim:
    problem: >-
      one cross-product gap of a y-axis hit count at p = 2053
    prior_best: >-
      Opened KR-RHO-13bf67 states that a generic algorithm on a
      prime-order group needs Omega(sqrt(p)) group operations, and
      that Pollard rho meets that bound up to a constant. This
      hypothesis moves neither figure.
    time_exponent: '1/2, unchanged'
    memory_exponent: >-
      unchanged. The census stores the current point and two
      integer counters. The group need not be stored.
    hidden_cofactor: >-
      No o(1) attack term is claimed. The census is Theta(p) field
      operations and returns one integer gap.
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against the opened generic bound is 1.
      claim_kind is filled so the non-claim is explicit. A hit-count
      gap is not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For these two cubics, the indicator that [m]P has x = 0, as
        P runs through E_i(F_p) and m runs through {2, 5, 11}, has
        mean Z_i / (3 N_i) within 1/N_i of the fraction of points
        with x = 0, as it would for a uniformly random endomorphism
        of a set of size N_i. The random-map mean is the distribution
        being imitated. It is not a theorem about these cubics.
      random_model_justification: >-
        Each [m] is a group endomorphism. The fiber of a point under
        [m] is bounded by gcd(m, N_i) when the point is in the image.
        That fiber bound is the proved piece. KR-RHO-13bf67, opened,
        bounds generic discrete logarithms and does not state this
        mean. The comparison of the two rates is the pre-registered
        minimum effect from IDEA-20261006-688a37, which is an
        absolute cross-product gap of at least 1, not a tail
        probability.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-5988e1
      falsification_condition: >-
        The instrument checks pass and Z_1*N_2 equals Z_2*N_1. That
        equality refutes the predicted gap on this cell. It does not
        refute the generic bound. A singular model, a model with
        N_i = 2054, and a timeout do not refute the heuristic. They
        leave the cell unmeasured or invalid.
  structural_ingredients:
    - description: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. Pollard rho meets that bound up to a
        constant. A coordinate count that does not exploit a
        non-generic operation does not move the exponent.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
      role: unchanged time exponent
    - description: >-
        The negation map changes the iteration count of rho by a
        factor near sqrt(2) and introduces fruitless cycles. This
        cell does not walk on negation classes.
      citation: KR-RHO-fb88e6
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
        on 2026-10-06
      role: fence around a negation-map reading of the hit count
    - description: >-
        r-adding walks change the rho walk constant. The chain here
        is one scalar's three prefixes, not an r-adding walk.
      citation: KR-RHO-cd86f5
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-cd86f5.yaml
        on 2026-10-06
      role: fence around a walk-constant reading
    - description: >-
        Doubling and addition on a short Weierstrass model are
        rational maps, so each prefix [m]P is a definite point. The
        book was not opened in this session.
      citation: >-
        Silverman, The Arithmetic of Elliptic Curves, chord-and-tangent
        duplication
      provenance: recalled
      verified_by: null
      role: the group law used to evaluate the prefixes
  reduction_chain:
    core_problem: >-
      one cross-product comparison of a y-axis hit count at p = 2053
    corollaries: []
  predictions:
    - metric: absolute_difference_of_cross_products
      direction: different
      minimum_effect: The absolute difference of Z_1*N_2 and Z_2*N_1 is at least 1.
  test_boundary:
    instances:
      - E1 given by y^2 = x^3 + x + 1 over F_2053
      - E2 given by y^2 = x^3 + x + 2 over F_2053
    parameters:
      field_prime: 2053
      prefixes: [2, 5, 11]
      ordinary_excluded_order: 2054
      minimum_gap: 1
    implementation: >-
      Enumerate both curves. Recompute both discriminants and both
      point counts. For every point and each prefix, compute the
      scalar by double-and-add and by repeated addition. Increment
      Z_i when the image is affine with x = 0. Emit the four integers
      and the two products. Do not search for a discrete logarithm.
    budget:
      cell: one prime and two named curves
      maximum_runs: 1
  falsification_conditions:
    - >-
      The instrument checks pass and Z_1*N_2 equals Z_2*N_1. That
      integer equality is the concrete negative.
    - >-
      Either model is singular, or either N_i equals 2054. The
      ordinary pair is then not available. That outcome is not the
      rate-equality negative.
    - The census of E1 does not contain the point (0, 1). The instrument is void.
  interpretation_limits:
    - A nonzero gap is a statement about one predicate on one chain at p = 2053. It is not evidence that a coordinate distinguisher beats rho.
    - KR-RHO-13bf67 still bounds generic algorithms by Omega(sqrt(N)). The exponent delta is 0.
    - The question's decision target asks about leakage into key recovery. This record does not supply that leakage. A gap only separates unequal rates from equal rates.
    - No factor base is defined.
    - The random-label control is reported beside the cubic products. It is not substituted for them.
    - A missing point (0, 1), a singular model, N_i = 2054, and a timeout are not the negative.
