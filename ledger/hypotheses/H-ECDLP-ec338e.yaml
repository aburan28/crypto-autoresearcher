hypothesis:
  id: H-ECDLP-ec338e
  question_id: RQ-MAYO-001
  title: >-
    MAYO forgery is a trace system in a k by n matrix unknown, not a generic
    quadratic system in kn scalars; the degree-4 Macaulay rank of the whipped
    system is the first degree at which that structure can show, because at
    degree 3 the rank of any such system is forced to the row count and the
    deficit cannot exist
  statement: >-
    Source proposal IDEA-20260808-f104a2 (RQ-MAYO-001, class representation).
    FIELD NOTE, RECORDED BECAUSE THE DISPATCHING HANDOFF MISLABELS IT. This
    hypothesis is about the MAYO multivariate signature scheme over F_q. It is
    not about elliptic curves, not about prime fields in the ECDLP sense, and
    carries no ECDLP content whatever; the ECDLP area token in its identifier
    is an allocation artifact and must not be read as a scope statement.
    Writing the k whipped blocks as the rows of an unknown X in F_q^(k by n),
    the r-th whipped equation over the splitting field is
    tr(C_r X M_r X^T) = t_r, with C_r of size k by k and M_r the n by n polar
    matrix of the r-th underlying form. TWO CLAIMS.
    (A) MACAULAY RANK DEFICIT AT DEGREE 4. Every whipped equation is built from
    one underlying key through k(k+1)/2 emulsifier slots, so the degree-D
    Macaulay row space lies inside a Kronecker-structured subspace determined
    by the underlying map. CLAIM: at degree 4 the whipped system's Macaulay
    rank is strictly below that of a uniformly random quadratic system at
    matched (kn, m, q), the excess deficit over the generic Koszul count is a
    function of k, and it grows with k.
    (B) BILINEAR REMODELLING. Substituting X = U G with U in F_q^(k by k) and G
    in F_q^(k by n) makes the system bilinear in (U, G) at the cost of k^2
    extra unknowns. CLAIM AS RESTATED HERE, AND IT IS THE OPPOSITE OF THE
    SOURCE PROPOSAL'S: at every declared toy cell the generic bigraded
    degree-of-regularity bound for a bilinear system of bidegree (1,1) in
    (k^2, kn) variables is min(k^2, kn) + 1 = k^2 + 1, which equals 10, 26, 17
    and 37 at the four declared cells, while the determined-system value for
    the flat arm after hybrid fixing is m + 1, which equals 7, 7, 9 and 9. The
    generic bound therefore predicts the remodelling LOSES at every declared
    cell. The experiment measures whether the whipped structure beats its own
    genericity bound; a measured bigraded degree below the flat degree would
    mean the structure helps beyond bilinearity, which is the informative
    outcome and is not what the source proposal predicted.
    THE TWO CLAIMS READ THE SAME STRUCTURE IN OPPOSITE DIRECTIONS. (A) says
    structure REMOVES usable equations and makes forgery harder than the random
    null, i.e. MAYO's direct-attack estimate is pessimistic in the defender's
    favour. (B) says structure ADDS a solving route. Both can hold; the
    experiment measures which dominates, in units of solving degree AND field
    operations, never in degree alone.
  mechanism: >-
    A generic sequence of m quadratic forms in N variables has no linear
    syzygies, so at degree 3 its Macaulay matrix (each form times each
    variable) has rank exactly m times N. At the declared cells that is 180,
    300, 384 and 576 rows against 4960, 22100, 19600 and 64824 columns, so both
    arms are far from saturation and both have rank equal to the row count
    EXACTLY. The first syzygies of a generic quadratic sequence are the Koszul
    relations f_i f_j minus f_j f_i, which live in degree 4, so degree 4 is the
    first degree at which any rank deficit exists at all: there the generic
    deficit is exactly C(m,2), namely 15, 15, 28 and 28 at the four cells,
    against row counts m times C(N+1,2) of 2790, 7650, 9408 and 21024. The
    whipped system's claimed extra deficit is an integer excess above that
    generic Koszul count and it has room to move. The counting argument for the
    excess is that a whipped row is a monomial multiple of an equation
    factoring through a k(k+1)/2-dimensional slot structure, so the row space
    is confined to a proper subspace of the generic one; that is a countable
    constraint, not a heuristic, and the experiment counts it.
  assumptions:
    - >-
      The whipped map has the bilinear-in-polar-values form used in the
      companion M1-01 slice. This is definitional for the construction under
      test and is re-derived symbolically at k = 1 before any measurement.
    - >-
      Exact linear algebra over F_q is available at the declared sizes. The
      largest matrix is 21024 rows by 1150626 columns over F_16 at the k = 6
      cell, which is the binding feasibility constraint and is why that cell
      carries a separate go/no-go check.
    - >-
      MAYO's published k lies in a range where a toy trend in k is at least
      qualitatively relevant. THIS IS AN ASSUMPTION AND IT IS NOT DISCHARGED
      ANYWHERE IN THIS PROGRAM. The published parameter set has not been read
      by this coordinator session and no number from it is asserted here.
  proof_search_map:
    bottleneck: >-
      The solving degree of MAYO's whipped forgery system. It is the only
      quantity in the direct-attack cost that is not fixed by parameter
      counting.
    baseline_embedding:
      parameter_slice: >-
        k = 1, where the whipped system degenerates to the underlying UOV
        system and the substitution X = U G degenerates to a scalar rescaling.
        Both claims must return no deficit and no gain there.
      reproduction_check: >-
        Frozen fixture. A k = 1 instance whose degree-4 Macaulay rank equals
        that of the planted-isotropy null EXACTLY, as an integer, on every
        seed. Not within a band: at these dimensions the rank of a generic
        sequence is deterministic and the correct significance rule is exact
        integer equality.
    observation_collision:
      observable: The degree-D Macaulay rank, and the measured solving degree.
      distinct_preimage_search: >-
        COLLISION FOUND IN ADVANCE, AND IT IS WHY THE SECOND NULL EXISTS. A
        random system carrying a planted totally isotropic subspace of the same
        dimension and a genuine whipped system can share a degree-4 Macaulay
        rank. The planted-isotropy null is the additional condition that
        separates them; without it the observable is not identifying and no
        conclusion about whipping is available from the rank alone.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The unknown as a k by n matrix X with trace-form equations, and the
          factorisation X = U G moving the hypothesis into an exact bidegree
          condition.
        predicted_gain: >-
          A solving degree governed by the bigraded rather than the singly
          graded Hilbert series. PREDICTED NEGATIVE at every declared cell by
          the generic bound k^2 + 1 versus m + 1, as computed in the statement.
      - transform: observable_fiber
        proposed_object: >-
          Hold the degree-4 Macaulay rank fixed and vary the hidden structure
          across whipped, planted-isotropy and uniformly random arms.
        predicted_gain: >-
          Either an invariant separating the fibre, or the honest conclusion
          that Macaulay rank does not see whipping.
    quantifier_order: >-
      FOR ALL four declared cells, THERE EXISTS a seed-independent integer gap
      between the whipped arm's degree-4 Macaulay rank and BOTH nulls' ranks,
      and that gap is monotone increasing in k at fixed (n, m, o). The gap is
      allowed to depend on the cell; no law uniform in (n, m, k) is claimed and
      none may be inferred.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested toy parameters the whipped system's degree-4 Macaulay
        rank differs from both nulls by a stated integer, and its measured
        bigraded solving degree and operation count are the stated values. It
        can certify nothing about published MAYO parameters and no forgery of
        any kind.
      nearby_object_control: >-
        A whipped system built from k INDEPENDENT underlying keys, one per
        block. The deficit's claimed cause is key reuse, so the mechanism
        requires the deficit to vanish there. A method still reporting a
        deficit on independent keys has not identified the load-bearing
        structure and its whipped numbers mean nothing.
    proof_obligations:
      - claim: The degree-3 rank equals m times N exactly in every arm.
        responsibility: baseline
      - claim: The whipped Macaulay row space lies in the stated Kronecker subspace.
        responsibility: correctness
      - claim: The excess deficit above C(m,2) grows with k.
        responsibility: strictness
      - claim: The generic bigraded bound applies to the remodelled system.
        responsibility: feasibility
      - claim: Operation counts, not degrees alone, decide claim (B).
        responsibility: runtime
      - claim: The k = 6 cell is feasible in exact linear algebra within budget.
        responsibility: memory
      - claim: Toy results do not transfer to published parameters.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For a uniformly random sequence of m quadratic forms in N variables
        over F_q with m much less than the dimension of the space of quadratic
        forms, the degree-3 Macaulay rank is exactly m times N, and the degree-4
        Macaulay rank is exactly m times C(N+1,2) minus C(m,2), with no
        seed-to-seed variation at the declared dimensions.
      random_model_justification: >-
        A generic quadratic sequence has no linear syzygies, so the degree-3
        rows are independent; its first syzygies are the Koszul relations, of
        which there are exactly C(m,2) in degree 4. Failure of genericity for a
        uniformly random sequence over F_q has probability bounded by a
        negative power of q whose exponent is the codimension of the
        degeneracy locus, which at these dimensions is large enough that the
        rank is deterministic in practice; the experiment measures the
        realised variation rather than assuming it.
      supporting_results:
        - ref: >-
            The Koszul complex of a regular sequence, and the semi-regularity
            model of Bardet, Faugere and Salvy for random quadratic systems
          provenance: recalled
          claim: >-
            Generic quadratic sequences are regular in low degrees, so their
            degree-D Macaulay rank equals the semi-regular count. Pointer only,
            hedged; no agent in this program has opened a source for it and it
            may not discharge this heuristic.
          verified_by: null
      validation_experiment_ids: [EXP-ECDLP-fe11f2]
      falsification_condition: >-
        Any uniformly random arm at any declared cell returns a degree-3 rank
        different from m times N, or a degree-4 rank different from
        m times C(N+1,2) minus C(m,2), or returns different integers on
        different seeds.
    - id: HEUR-002
      formal_statement: >-
        The bigraded Hilbert series of a generic bilinear system of bidegree
        (1,1) in (k^2, kn) variables predicts its solving degree, and that
        prediction is min(k^2, kn) + 1 for the declared cells.
      random_model_justification: >-
        The remodelled system is assumed to behave like a generic bilinear
        system of its bidegree, which is the same imitation support-minors
        modelling makes for MinRank.
      supporting_results:
        - ref: >-
            Faugere, Safey el Din and Spaenlehauer, on Groebner bases of
            bihomogeneous ideals generated by polynomials of bidegree (1,1)
          provenance: recalled
          claim: >-
            The degree of regularity of a generic bilinear system is bounded by
            an expression of min(n_x, n_y) + 1 type. Pointer only, hedged;
            NOT OPENED by any agent in this program, and the exact statement,
            its hypotheses and its constant must be read from the source before
            this heuristic is discharged or before any bound is quoted.
          verified_by: null
      validation_experiment_ids: [EXP-ECDLP-fe11f2]
      falsification_condition: >-
        A matched RANDOM bilinear system of the same bidegree returns a
        measured solving degree different from the bound at any declared cell,
        which would mean the bound does not describe generic behaviour at these
        sizes and cannot be used to price the whipped arm.
  structural_ingredients:
    - description: >-
        Solving degree and first-fall degree conventions for polynomial system
        solving as used in this program.
      citation: KN-TECH-011
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, confirmed by direct file lookup that
        the record exists at knowledge/techniques/KN-TECH-011.md and that it is
