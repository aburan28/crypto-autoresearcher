        BODY WAS NOT READ BY THIS SESSION, so this entry is a pointer and
        discharges nothing; a reviewer must read it, and name itself in a new
        record, before its conventions are relied on for a multivariate
        signature scheme
    - description: >-
        MQ and Boolean polynomial-system solving conventions for XL,
        BooleanSolve and the crossbred hybrid.
      citation: KN-TECH-053
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read its front matter and confirmed
        its title is "MQ and Boolean polynomial-system solving - XL,
        BooleanSolve, and the crossbred hybrid" and that its tags place it in
        the index-calculus calibration thread, not in a UOV costing thread
