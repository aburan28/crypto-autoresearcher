        The MAYO specification, which fixes the whipping construction, the
        published parameter sets and the published direct-attack estimate.
      citation: MAYO specification
      provenance: recalled
      verified_by: null
      role: >-
        REQUIRED READ, NOT YET READ BY ANY AGENT IN THIS PROGRAM. No number
        from it is asserted anywhere in this hypothesis or its experiment, and
        no comparison against the published direct-attack level may be recorded
        until an agent that opened it says so in a new record.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: degree_3_macaulay_rank_every_arm
      direction: different
      minimum_effect: >-
        FORCED EXACT VALUES, PRE-REGISTERED AS AN INSTRUMENT CHECK AND NOT AS
        A DISCRIMINATOR: 180, 300, 384 and 576 at the four cells, in EVERY arm
        including the whipped one. A whipped rank below its row count at
        degree 3 is a LINEAR SYZYGY of the whipped system, which is a much
        stronger and more specific finding than a rank deficit and must be
        reported under its own name rather than folded into the deficit curve.
    - metric: degree_4_excess_deficit_above_koszul_whipped_minus_random
      direction: higher
      minimum_effect: >-
        At least 1 additional dependency at k = 3, reported as an EXACT INTEGER
        against generic values of 15, 15, 28 and 28 dependencies and row counts
        of 2790, 7650, 9408 and 21024. An excess of exactly 0 at every cell
        falsifies claim (A).
    - metric: degree_4_excess_deficit_as_a_function_of_k
      direction: higher
      minimum_effect: >-
        Strictly increasing across the k = 3 to k = 5 pair at fixed (n, m, o)
        and across the k = 4 to k = 6 pair. AN EXCESS THAT DOES NOT GROW WITH
        THE PARAMETER THAT ADDS THE STRUCTURE IS THE CANONICAL ARTIFACT TELL
        and is reported as evidence the measurement is broken, never as
        evidence about MAYO.
    - metric: measured_solving_degree_flat_minus_bilinear
      direction: lower
      minimum_effect: >-
        PREDICTION INVERTED FROM THE SOURCE PROPOSAL ON COMPUTED GROUNDS. The
        generic bigraded bound k^2 + 1 exceeds the flat determined-system value
        m + 1 at every declared cell (10 versus 7, 26 versus 7, 17 versus 9, 37
        versus 9), so the remodelling is predicted to LOSE. A measured bigraded
        degree strictly below the flat degree at any cell means the whipped
        structure beats its own genericity bound and is the informative outcome.
    - metric: field_operations_to_solution_flat_versus_bilinear
      direction: different
      minimum_effect: >-
        Reported alongside every degree. A lower degree at a higher operation
        count is a NEGATIVE result for claim (B), stated in advance so it
        cannot be reported as a win afterwards. Both sides are counted in the
        same unit, namely F_q multiplications.
  test_boundary:
    instances:
      - (q, n, m, o, k) equal to (16, 10, 6, 2, 3)
      - (q, n, m, o, k) equal to (16, 10, 6, 2, 5)
      - (q, n, m, o, k) equal to (16, 12, 8, 3, 4)
      - (q, n, m, o, k) equal to (16, 12, 8, 3, 6)
    parameters:
      degrees: [3, 4]
      arms: [whipped, uniform_random, planted_isotropy, independent_keys, k_equals_1]
      seeds_per_cell: 20
    implementation: >-
      Exact linear algebra over F_16. No floating point, no timing-based
      inference, no solver heuristics for the rank arm.
    budget:
      wall_clock_seconds: 3600
      memory_gb: 8
      maximum_runs: 40
  falsification_conditions:
    - >-
      Whipped and matched-random degree-4 Macaulay ranks are equal as integers
      at every cell and every seed. Claim (A) dies at the tested scope.
    - >-
      The planted-isotropy null shows the same excess deficit as the whipped
      arm. The deficit is caused by the isotropic subspace and not by whipping;
      this is a controlled null and is the correct outcome to report.
    - >-
      The independent-keys nearby object still shows an excess deficit. The
      mechanism is misidentified, and no whipped number in the run may be
      interpreted.
    - >-
      The excess deficit fails to grow with k. Under the inventor protocol's
      artifact tell this is evidence the measurement is broken, not evidence
      about MAYO.
    - >-
      The measured bigraded solving degree is greater than or equal to the flat
      degree at every cell. Claim (B) as restated here is CONFIRMED and the
      source proposal's version of (B) is falsified.
    - >-
      Any uniformly random arm returns a degree-3 rank other than m times N.
      HEUR-001 is refuted and every degree-4 number in the run is
      uninterpretable until the instrument is repaired.
  interpretation_limits:
    - >-
      NOT AN ECDLP RECORD AND NOT A CURVE RECORD. The object is the MAYO
      whipped public map over F_16 at toy parameters. There is no elliptic
      curve anywhere in this hypothesis, so the standing curve-free-null
      requirement is discharged BY CONSTRUCTION rather than by an arm: no
      result here can be misread as a statement about elliptic curves because
      none of its objects is one. That is recorded as a proof, not as a control.
    - >-
      Everything measured is toy scale and is reported as toy scale under
      AGENTS.md rule 7. A rank deficit at (kn, m) around 50 by 8 says nothing
      directly about published dimensions, and the deliverable is the SHAPE of
      the deficit in k and its separation from the two nulls, not an
      extrapolated attack cost.
    - >-
      No forgery is claimed, attempted or implied, and no statement about any
      MAYO parameter set may be derived from this record.
    - >-
      Toy k values of 3 to 6 need not reach the regime of the published k,
      which this session has not read. The deficit curve's shape may not
      extrapolate. This is stated as a limit and is not designed away.
    - >-
      The remodelling adds k^2 variables. A lower solving degree does not by
      itself mean lower total cost, and the contract forbids reporting a degree
      win without its operation count.
  status: proposed
  proposed_by: idea-generator
