  title: >-
    One rational root is not full 2-torsion, and one gauge model short of four blocks the label.
  statement: >-
    A model is on the locus when a is 0, or b is 0, or the cubic
    x^3 + a x + b has three roots. The model (0, 1) is on the locus
    at every tested prime. Its root counts are 1, 3, 1 and 3 at
    primes 5, 7, 11 and 13. The model (1, 0) is on the locus at
    those primes, with root counts 3, 1, 1 and 3. The model (1, 1)
    has product 1, so it is generic unless it has three roots. Its
    root counts are 0, 0, 1 and 1, so it is generic at all four
    primes. One root is not three roots. The reading O2 needs the
    locus integers equal, a floor gap of at least 1, Hamming
    distance 0, and at least four gauge models. The row 4, 4, 6, 4
    with distance 0 and four models is O2. The row 5, 4, 6, 4 is
    falsified. The row 4, 4, 4, 4 is matched, not O2. Distance 1
    blocks the label. Three gauge models block the label.
  mechanism: >-
    The proposal compares a special-model curve with a generic
    classmate in the same class. This contract checks which of
    three models sit on the locus and how the reading rules fire.
    It does not measure a fall profile.
