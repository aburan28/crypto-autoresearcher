        The gcds were computed in this design session. That computation
        is not a run.
      reproduction_check: >-
        One route computes the seven gcds. The other multiplies the
        cofactor by 263 and checks the remainder 68. They must agree.
    observation_collision:
      observable: The seven gcds and the shortfall 1600256.
      distinct_preimage_search: >-
        Reporting a gcd greater than 1 drops the monomial root count.
        Reporting 264 cubed as at least 20000000 drops the shortfall
