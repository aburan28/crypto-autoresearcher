  title: >-
    Each gcd of 2^33 minus d with 2^131 minus 1 is 1 for d from 1 to 7.
  statement: >-
    For each d from 1 to 7, the greatest common divisor of 2^33 minus d
    and 2^131 minus 1 is 1. The power 2^33 leaves remainder 68 on
    division by 263. The integer 263 divides 2^131 minus 1, and the
    cofactor is 10350794431055162386718619237468234569. Seven to the
    fourth is 2401. Four to the fourth is 256, which is 2^8. The power
    2^34 exceeds 2^33 by 2^33. The cube 264^3 is 18399744, which is
    1600256 below 20000000. The written histogram counts 62, 118, 60
    and 4 sum to 244, and 4/244 equals 1/61. The written tail 2^{-12}
    exceeds 2^{-16} by the factor 16.
  mechanism: >-
    The proposal uses gcd(2^33 - d, 2^131 - 1) = 1 to fix the root
    count of a monomial twist, and it writes a sampling ceiling and a
    vacuous bound. This contract checks those integers. It does not
    build a matrix.
  assumptions: []
  proof_search_map:
    bottleneck: The seven gcds, and the shortfall 1600256.
    baseline_embedding:
      parameter_slice: >-
