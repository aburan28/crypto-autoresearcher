      decided_at: '2026-08-01'
      reason: >-
        BATCH-020 CTRL-RT025-UNPLANTED control (RUN-DS-001-ctrl-unplanted,
        snapshot 1d241a878b4f0e74cadbb5e2e0995c0bf6f97cbd) is ADMISSIBLE
        (VAL-20260801-001, verified to an unusually high standard including
        independent re-derivation of 400 certificates and full re-execution) but
        INCONCLUSIVE ON MECHANISM under RT-20260731-047's blocking objections
        RT047-B1..B5. Status remains analyzed — not supported, not weakened, not
        rejected. Evidence EV-DS-003.
        (i) ARITHMETIC BAR, INDEPENDENT OF EVERY OBJECTION: this run COULD NOT
        HAVE MET THIS HYPOTHESIS'S OWN CRITERION. predictions.
        per_relation_cost_ratio_R requires R < 0.5 at B >= 64 on AT LEAST TWO
        bit sizes among {16,20,24}; RUN-DS-001-ctrl-unplanted supplies ONE bit
