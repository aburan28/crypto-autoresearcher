  mechanism_test_status:
    recorded_by: DEC-20260801-003
    recorded_at: '2026-08-01'
    exercised: false
    statement: >-
      AS OF BATCH-020 THE MECHANISM OF THIS HYPOTHESIS HAS NEVER BEEN TESTED.
      Every real arm executed in the EXP-DS-001 series (RUN-DS-001-impl,
      RUN-DS-001-measure, RUN-DS-001-ctrl-unplanted) ran with
      smoothness_abort = false, so the B-smoothness predicate is_B_smooth was
