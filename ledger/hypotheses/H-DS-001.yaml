      additionally provable-identity (D = 2^40 vs x < p = 752627 < 2^20) and the
      join is exact group equality, so the split arm as executed is a generic
      hash-join meet-in-the-middle available on any group. This is a statement
      about the instrument, NOT about the hypothesis: it means no evidence for
      or against the mechanism has yet been generated.
    blocking_next_test: >-
