        (ii) TEST-BOUNDARY DEVIATION: the tested cell's PRIME-ORDER SUBGROUP IS
        n = 241, i.e. ~7.9 BITS, not the 20-bit prime-order subgroup
        test_boundary.instances asks for. p = 752627 is the 20-bit FIELD, and
