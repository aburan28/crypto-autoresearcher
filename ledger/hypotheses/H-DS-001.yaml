        - RT-20260801-008 objection RT048-B4
      original_value_preserved: random_multihomogeneous_matched_multidegree
      operative_value: NULL-DS-ADDITIVE-Z753848
      statement: >-
        SUPERSESSION BY ADDITION, NOT A REWRITE. The null object named above,
        NULL-DS-RANDOM-MULTIHOMOGENEOUS, admits no composition law - null_full_hit
        is a blake2b random-oracle test - so no meet-in-the-middle is possible on it
        even in principle and it was DECLARED UNMATCHED for structure-dependence
        readings by RT047-B2 and by CTRL-RT047-MATCHED-NULL. The object actually run
        in BATCH-021 is NULL-DS-ADDITIVE-Z753848, the additive cyclic group Z/NZ
