hypothesis:
  id: H-DS-001
  question_id: RQ-ECDLP-002
  source_proposal: IDEA-20260731-007
  linked_control_proposal: IDEA-20260731-011
  sub_goal_id: SG-ECDLP-001
  goal_id: GOAL-ECDLP-001
  statement: >-
    For prime-field Semaev index calculus at arity m in {4,5} with factor-base
    size B in {64,128,256} on 16-, 20-, and 24-bit prime-order subgroups, the
    degree-split meet-in-the-middle / smoothness claw rewrite of membership
    search yields a charged per-relation cost ratio
    R = cost_split / cost_naive strictly below 0.5 on at least two bit sizes
    with successful relation harvest, and that gain is structure-dependent:
    the identical claw machinery on a same-shape random multihomogeneous null
    object (IDEA-20260731-011) yields R_null >= 0.9 whenever R < 0.5. Under the
    named Dickman-style heuristic HEUR-DS-1 the intermediate degrees arising
    from half-arity Semaev partial maps behave like uniform random integers of
    the same bitlength for B-smoothness purposes. This hypothesis claims a
    toy-scale charged-cost saving and a heuristic-status report; it does not
    claim a crypto-scale ECDLP exponent below matched Pollard rho.
  mechanism: >-
    A Semaev summation polynomial S_m encodes the condition that m points on E
    sum to a target. Naive membership enumerates (m-1)-tuples into a Groebner
    or resultant engine. The degree-split rewrite factors the search into two
    enumerations of size about B^{ceil(m/2)} and B^{floor(m/2)}, stores one
    side keyed by an intermediate invariant (codomain of a partial summation
    map), and looks for claws — converting a single hard search into a
    smoothness/collision problem. HEUR-DS-1 justifies early abort when partial
    sums land outside a smooth ideal class by asserting Dickman-like smoothness
    of intermediate degrees. The decisive prediction is the charged ratio R,
    not an immediate sub-birthday end-to-end break: assembling with the
    free-oracle LA floor of IDEA-20260727-003 still predicts end-to-end
    exponent E >= ~1/2 against matched rho unless HEUR-DS-1 yields a
    superpolynomial smoothness gain that survives the null-object control.
  assumptions:
    - Toy prime-field curves with prime-order subgroups; no live keys.
    - Factor base is a frozen deterministic subset of E(F_p) of size B.
    - Naive and split membership share an identical Groebner/resultant backend
      and calibration; calibration perturbation ±10x must not flip the sign of
      (R - 0.5) when R is decisive.
    - HEUR-DS-1 holds at the tested toy sizes, or the experiment reports its
      failure explicitly (KS / tail) without treating infrastructure failure as
      heuristic falsification.
    - Usable relations require eventual matrix rank B-1 or are labeled incomplete.
    - Any recovered discrete log carries a certificate re-verified by the run
      wrapper (docs/claims-and-verification.md).
  rerandomization: null
  asymptotic_claim:
    problem: prime-field ECDLP via Semaev index calculus (membership / relation cost)
    prior_best: >-
      Pollard rho ~0.886 N^{1/2} group ops (generic); Semaev IC typically worse
      on prime fields at the free-oracle LA floor (IDEA-20260727-003)
    time_exponent: >-
      Conditional under HEUR-DS-1: max(beta*m/2*(1-Theta((log u)/u)),
      omega_LA*beta, beta) with beta>=1/m; optimistic m=5, beta=1/5, omega_LA=2
      still ~1/2. THIS HYPOTHESIS DOES NOT ASSERT AN UNCONDITIONAL EXPONENT
      MOVE; toy R measurements cannot support asymptotic_claim toward
      `supported` (promotion gates remain open).
    memory_exponent: beta*m/2 for the claw table (same order as half-enumeration)
    hidden_cofactor: >-
      o(1) hides Dickman u^{-u} factors, Groebner poly(D) factors, and hash
      constants; none are proved negligible at crypto size
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: HEUR-DS-1
      formal_statement: >-
        Intermediate degrees arising from half-arity Semaev partial maps on
        uniform random targets behave, for B-smoothness purposes, like uniform
        random integers of the same bitlength: the probability an intermediate
        is B-smooth is within a constant factor of Dickman rho(u) with
        u = log D / log B, where D bounds the intermediate degree.
      random_model_justification: >-
        Canfield–Erdős–Pomerance / Dickman–de Bruijn govern integer smoothness;
        the heuristic transfers that law to Semaev intermediate ideals over F_p
        in the absence of a proven correspondence.
      supporting_results:
        - Canfield–Erdős–Pomerance smoothness estimates
        - Dickman–de Bruijn rho(u) for the proportion of B-smooth integers <= X
        - Semaev summation-polynomial degree bounds (KN-LIT-001 / KN-TECH-002)
      validation_experiment_ids:
        - EXP-DS-001
      falsification_condition: >-
        At a tested toy size with >=10^5 sampled intermediates, the empirical
        CDF of intermediate degrees (or their largest prime factors) has
        Kolmogorov–Smirnov distance from Dickman rho(u) exceeding the
        pre-registered threshold in EXP-DS-001, or the smoothest-sample tail
        probability under rho is inconsistent with the observed extreme by the
        contract's tail check — reported as HEUR-DS-1 failed at toy scale, not
        as crypto-scale refutation.
  structural_ingredients:
    - description: >-
        Meet-in-the-middle / claw rewrite converting a high-arity membership
        search into two half-arity enumerations plus collision (methodological
        analogy to Wesolowski-style bottleneck conversion; not an isogeny claim)
      citation: docs/target-result-profile.md; IDEA-20260731-007
      role: algorithmic rewrite of Semaev membership search
    - description: Dickman–de Bruijn smoothness law for integer factorizations
      citation: classical analytic number theory (CEP / Dickman)
      role: HEUR-DS-1 random-model backbone
  reduction_chain:
    core_problem: charged Semaev membership / relation cost at toy prime-field ECDLP
    corollaries: []
  predictions:
    - metric: per_relation_cost_ratio_R
      direction: lower
      minimum_effect: >-
        R = cost_split/cost_naive < 0.5 at B>=64 on at least two bit sizes among
        {16,20,24}, with successful harvest of the contract's minimum relation
        count, and with R_null >= 0.9 on the matched null object whenever R < 0.5
    - metric: assembled_exponent_proxy_E
      direction: different
      minimum_effect: >-
        Assembled E remains >= 0.45 vs ~0.886 sqrt(N) matched rho unless a
        HEUR-DS-1 superpolynomial gain appears and survives the null object; a
        claimed E<0.45 without surviving null is a packaging failure
    - metric: HEUR_DS_1_toy_KS
      direction: different
      minimum_effect: >-
        Toy HEUR-DS-1 sampling either passes the pre-registered KS/tail checks
        or is explicitly reported failed; missing samples are reported missing,
        never fabricated
  test_boundary:
    instances:
      - 16-, 20-, and 24-bit prime-order subgroups (toycurve harness)
      - B in {64, 128, 256}
      - m in {4, 5}
    parameters:
      factor_base_policy: frozen_deterministic_subset
      relation_harvest_target: '>=200 successful relations per method or wall-clock stop'
      null_object: random_multihomogeneous_matched_multidegree
      baselines:
        - matched_pollard_rho_with_negation
        - matched_BSGS
    implementation: >-
      New EXP-DS-001 driver under experiments/EXP-DS-001/; Semaev/Groebner
      backend shared across naive, split, and null arms; harness/toycurve.py
      for instances; harness/rho.py (or equivalent) for matched rho; certificate
      verification for any recovered discrete log
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 48
      maximum_memory_gb: 16
  falsification_conditions:
    - >-
      R >= 0.9 at all tested (B,m) cells with successful relation harvest: claw
      rewrite adds no charged saving; idea weakened/rejected_scoped to tested
      parameters.
    - >-
      R_null < 0.5 whenever R < 0.5: apparent gain is an engine artifact, not
      Semaev structure (IDEA-20260731-011 gate).
    - >-
      Implementation cannot harvest the minimum successful relations on either
      method within budget: infrastructure inconclusive, not mathematical
      negative (AGENTS.md rule 5).
  interpretation_limits:
    - Toy-scale only; R<0.5 is not crypto-scale validation of HEUR-DS-1.
    - Even optimistic HEUR-DS-1 does not by itself clear the LA floor at m<=4
      (IDEA-20260727-003).
    - H-IC-001 remains weakened and is not reopened by this hypothesis.
    - H-STR-002 remains weakened; this lane is not STR instrument polish.
    - All four asymptotic-claim promotion gates remain open; no path from this
      toy contract alone to hypothesis status `supported` on an exponent claim.
  status: analyzed
  status_history:
