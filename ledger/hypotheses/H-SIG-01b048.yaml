    "title": "Exact relative separator syzygy quotient, Tor and signature diagnostics",
    "statement": "For the fixed finite panel, complete relative relation classes may be assembled from side modules and a fully witnessed intersection/Tor quotient; a small raw or membership-removed quotient does not by itself bound scalar/module signatures, endpoint elimination degree or total construction cost. The experiment tests exactness, minimality and the separately declared finite cost opportunity.",
    "mechanism": {
      "notation": "F=(f_1,...,f_a) in A and G=(g_1,...,g_b) in B are complete ordered lists, including membership equations when declared. I=(F)R and K=(G)R; J denotes membership ideal only, never the right ideal.",
      "C1": "P=direct_sum_i R(-deg f_i), Q=direct_sum_j R(-deg g_j). d1:P direct_sum Q -> R maps (u,v) to sum u_i*f_i+sum v_j*g_j. Z=ker d1.",
      "side": "Z_A=ker(A^a -> A), Z_B=ker(B^b -> B); U is image of (R tensor_A Z_A) direct_sum (R tensor_B Z_B) in P direct_sum Q. These extensions are polynomial extensions, hence free/flat; this justifies transporting side kernels, but says nothing about flatness of A/(F) or B/(G) over S.",
      "koszul": "For each i,j the cross relation is k_ij=(g_j*e_i,-f_i*e_j). V_K is their full R-span. Internal principal/Koszul relations already lie in U. No Boolean f_i^2+f_i identity is admitted.",
      "membership": "Collect all tagged membership generators from both lists (including both shared F_d(s) tags). Let Z_mem be the full kernel of their map to R, embedded with zero core coordinates. M is its full image, not just pairwise membership Koszuls. In particular the duplicate relation e_Fs,left-e_Fs,right is included and retained with its witness.",
      "objects": "Q_raw=Z/(U+V_K), Q_rel=Z/E with E=U+V_K+M. Both are reported; never discard M without reporting the classes it removes. The measured relative gluing object is Q_rel. Syzygy/signature modules of the core modulo memberships are separately defined below, not identified with Q_rel by matching counts.",
      "complex": "C2 is the free module on certified complete side-syzygy generators, all cross pairs and certified complete membership-syzygy generators, with d2 given by their explicit columns in C1. C2 -> C1 -> C0=R is a complex, d1*d2=0, and H1=Q_rel. d2 need not be injective; no H2-exactness or whole resolution is claimed. All kernel completeness statements at H1 use degreewise certificates.",
      "intersection_map": "pi:Z -> I intersect K sends (u,v) to sum u_i*f_i=-sum v_j*g_j. Its kernel is U. Image of V_K is IK. Hence Q_raw has the candidate canonical isomorphism (I intersect K)/(IK), with pi inverse obtained from explicit two-sided membership witnesses. Image T_mem=pi(M) modulo IK is retained and Q_rel corresponds to ((I intersect K)/IK)/T_mem. These elementary manual derivations require independent proof/certificate review before use as evidence.",
      "Tor": "Apply the tensor long exact sequence to 0->I->R->R/I->0 with R/K: the kernel of I/IK -> R/K is (I intersect K)/IK, giving Tor_1^R(R/I,R/K). Raw Tor_1 is reported before quotienting T_mem. There is no replacement by an underived fiber product, no assumption Tor vanishes, and no identification with Tor over S or S/(F_d) without an additional comparison theorem. Higher Tor groups and tensor-product resolutions are outside this H1 protocol; no claimed complex exactness depends on their vanishing.",
      "witnesses": "For every candidate q record its full (u,v), pi(q), side lifts, membership lifts, product-ideal lift and class coordinates. For pi injectivity modulo explained relations, every zero class gets an explicit decomposition in E; for surjectivity, every independently derived intersection basis vector gets a lift to Z. The checker verifies all coefficients, both directions, and rank-completeness certificates."
    },
