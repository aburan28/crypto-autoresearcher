# H-MONO-9ce194 — specified from IDEA-20261005-70b25b.
# Protocol approval is DEC-20261005-b5fa9e. This record asserts nothing
# about the image. No monodromy permutation was computed in this design.
hypothesis:
  id: H-MONO-9ce194
  question_id: RQ-MONO-001
  source_proposal: IDEA-20261005-70b25b
  goal_id: null
  goal_id_note: >-
    ledger/questions/RQ-MONO-001.yaml does not name a goal in the record
    read on 2026-10-05. This design does not attach one and does not edit
    GOAL-MONO-001. H-MONO-0b3def names that goal; this hypothesis does not
    inherit that binding.
  status: approved
  status_note: >-
    approved means the test protocol in EXP-MONO-01e759 is approved for a
    later executor. It does not mean the image claim is supported. Status
    moves only by DEC-20261005-b5fa9e under the standing user authorization
    of 2026-09-06. No monodromy permutation was computed in this design.
  proposed_by: coordinator
  conversion_note: >-
    The mechanism, the order-4 versus order-dividing-2 versus order-8
    split, the four-curve panel, the character control, the null quartic,
    and the falsification conditions are carried from IDEA-20261005-70b25b.
    The Coordinator added operational pins: the six curves at p=101, the
    field polynomial, the CPython sample streams, and the labelling rule.
    Those pins were fixed before any run. IDEA-20261005-ddbf31 is a
    different base (symmetric) and is not this hypothesis; an open pull
    request already specifies that one.

  statement: >-
    TEST BOUNDARY. m = 3, p = 101, characteristic greater than 3. E is a
    nonsingular short Weierstrass curve y^2 = x^3 + A x + B over F_101.
    The base is the ordered configuration space of pairs (x1, x2) in
    F_101 × F_101 with x1 ≠ x2 and f(x1) f(x2) ≠ 0, where
    f(x) = x^3 + A x + B. The fibre is
    Psi = {P+Q, -(P+Q), P-Q, -(P-Q)} with x(P) = x1 and x(Q) = x2.
    The tested homomorphism is the action of p-power Frobenius on a
    labelling of Psi. The pre-registered comparison groups are the
    biquadratic group (Z/2)^2 of order 4, its subgroups of order
    dividing 2, and the wreath group of order 8. No claim is made for
    m other than 3, for any prime other than 101, for a singular curve,
    or for the symmetric base. The two-element set of sum x-coordinates
    is the character-control quotient, not the object under test.

    PRE-REGISTERED PREDICTION, fixed before any run. On each ordinary
    curve in the panel below, the group generated by the p-power
    Frobenius permutations of Psi has order exactly 4, every element
    has order dividing 2, the group contains no 4-cycle, and every
    scored permutation preserves the inverse-pair partition. That is
    the full group of the degree-at-most-4 extension
    k(x1, x2, y1, y2) over k(x1, x2). The negative sides of the same
    prediction are: order dividing 2 on every ordinary curve; a mix of
    order 4 and order dividing 2 inside the panel; order 8 or a
    4-cycle or an element of order greater than 2; a permutation that
    breaks the partition; or a 3-cycle.

    DISTINGUISHABLE OUTCOMES. (1) Order 4, exponent 2, no 4-cycle,
    partition preserved, on all four ordinary curves, with the character
    control, the null quartic, and the inertia check passing: assigns
    the panel to the full degree-4 reading. This does not prove the
    image has order 4 for every ordinary j. (2) Order dividing 2 on all
    four ordinary curves, same checks passing: falsifies the full
    degree-4 reading on this panel. (3) Order 4 on at least one ordinary
    curve and order dividing 2 on another, same checks passing: assigns
    an exceptional locus inside the panel. (4) Order 8, a 4-cycle, or
    an element of order greater than 2, on any ordinary curve, checks
    passing: the image escaped the degree-at-most-4 closure. (5) A
    permutation that does not preserve the inverse-pair partition:
    the partition is not a block system of this operation set. (6) A
    3-cycle or an order outside {1, 2, 4, 8}: the image is not a
    2-group. (7) A failed control or an inertia disagreement:
    inconclusive, and not a negative result.

  mechanism: >-
    Psi is a function of the ordered pair of x-coordinates. The deck
    transformations available on this base are negation of P and
    negation of Q, realized as inertia about f(x1) = 0 and f(x2) = 0.
    The swap of x1 and x2 is not a loop in the ordered base. The
    extension k(x1, x2, y1, y2) over k(x1, x2) has degree at most 4,
    and over a field of characteristic greater than 2 its Galois group
    embeds in (Z/2)^2. An image of order 8, or any element of order
    greater than 2, does not fit in that group. The projection that
    forgets y-coordinates sends Psi to {x(P+Q), x(P-Q)} and discards
    the sign inside each inverse pair. That partition is a block system
    of the generated group if and only if every measured permutation
    sends blocks to blocks. KN-FIND-c41ea9, read in this design
    session, gives disc_T of the third Semaev polynomial equal to
    16 f(x1) f(x2), so the quotient by the blocks is the quadratic
    character product and is not a third branch component.

  assumptions:
    - Characteristic greater than 3 and f squarefree, so E is nonsingular and the x-map is separable.
    - A specialization is scored only when Psi has four distinct affine points and x1 ≠ x2. Shorter fibres are dropped, not recorded as a smaller group.
    - j = 0 and j = 1728 are an artifact panel. They are computed and excluded from the ordinary tally.
    - At p = 101 every j = 0 curve is supersingular, because 101 ≡ 2 (mod 3). The pinned j = 0 artifact is therefore a supersingular-plus-automorphism curve. A small image there is not an ordinary exceptional locus.
    - The generating set is p-power Frobenius at F_101-rational pairs. Specializations over F_{101^2} are not sampled.
    - No factor base is built and no discrete logarithm is solved.

  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement of one monodromy image at a pinned toy prime.
      It is not a proof, an asymptotic bound, a certificate family, a
      reduction, or a closure argument. No proof-search audit is required
      before the census.

  asymptotic_claim:
    problem: none — no complexity improvement is claimed
    prior_best: unchanged rho exponent 1/2
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: none introduced
    claim_kind: not_applicable

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For this cover, the p-power Frobenius permutations at 64 uniform
        good pairs (x1, x2) in F_101 × F_101 generate the arithmetic
        image of rho_ord on Psi whenever every conjugacy class of that
        image has positive density.
      random_model_justification: >-
        Carried from IDEA-20261005-70b25b, which points at the Chebotarev
        note KN-LIT-039. This design session did not re-open that note.
        The census does not treat H1 as proved. The character control and
        the null quartic are the instrument gates. If either fails, the
        image reading is withheld.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        The null quartic, on one redraw to 256 separable samples, still
        shows no cycle type 3+1, or the character product disagrees with
        the factorization type of {x(P+Q), x(P-Q)} on any good pair.
        Either event withholds the Psi reading. It is a failure of this
        sample as an instrument, not a disproof of Chebotarev for every
        cover, and not by itself a drop in the Psi image.
    - id: H2
      formal_statement: >-
        On a pinned ordinary curve at p = 101, the geometric image over
        the ordered base is generated by the tame inertia about f(x1) = 0
        and about f(x2) = 0. The locus where x(P+Q) and x(P-Q) collide
        is the same divisor, because disc_T S_3(x1, x2, T) = 16 f(x1) f(x2).
      random_model_justification: >-
        The source idea records a generation-by-inertia statement as
        provenance recalled and says no source was opened. This design
        session also opened no source for that generation statement. The
        discriminant identity was read in KN-FIND-c41ea9. H2 is used only
        as a pre-registered agreement check against the Frobenius sample.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        The inertia subgroup and the Frobenius subgroup on the same curve
        disagree in order or in cycle-type inventory. The group-order
        reading is then withheld. The disagreement is not scored as a
        proper subgroup. A simple root of the degree-4 discriminant off
        the divisor f(x1) f(x2) = 0 is recorded and used as a generator;
        it is not discarded to protect the identity.

  structural_ingredients:
    - description: >-
        For y^2 = x^3 + A x + B in characteristic greater than 3, the
        discriminant in T of the third Semaev polynomial satisfies
        disc_T S_3(x1, x2, T) = 16 f(x1) f(x2). The two roots are
        x(P+Q) and x(P-Q). Split and inert are the quadratic character
        product of f(x1) and f(x2).
      citation: KN-FIND-c41ea9
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-05 read the identity and the
        three consequences in knowledge/findings/KN-FIND-c41ea9.md
      role: character-control law and the statement that the collision locus is not a third branch

  predictions:
    - metric: order of the permutation group generated on Psi
      direction: different
      minimum_effect: >-
        Order exactly 4, versus order dividing 2, versus order 8.
        Order 4 with exponent 2 is the full biquadratic group on that
        curve. Order dividing 2 is a proper subgroup. Order 8 means the
        image is not contained in the degree-at-most-4 closure.
    - metric: agreement of the x-projection with the Legendre product chi(f(x1)) chi(f(x2))
      direction: different
      minimum_effect: >-
        Agreement on all 64 good pairs, versus at least one good pair
        whose factorization type disagrees with that product. Agreement
        is an instrument pass. Disagreement withholds the order reading.

  test_boundary:
    instances:
      - id: ordinary-1
        equation: y^2 = x^3 + x + 1
        A: 1
        B: 1
        trace: -3
        point_count: 105
        j_mod_p: 34
        role: ordinary_panel
      - id: ordinary-2
        equation: y^2 = x^3 + x + 2
        A: 1
        B: 2
        trace: 2
        point_count: 100
        j_mod_p: 4
        role: ordinary_panel
      - id: ordinary-3
        equation: y^2 = x^3 + x + 3
        A: 1
        B: 3
        trace: 15
        point_count: 87
        j_mod_p: 93
        role: ordinary_panel
      - id: ordinary-4
        equation: y^2 = x^3 + x + 4
        A: 1
        B: 4
        trace: 4
        point_count: 98
        j_mod_p: 14
        role: ordinary_panel
      - id: artifact-j0
        equation: y^2 = x^3 + 1
        A: 0
        B: 1
        trace: 0
        point_count: 102
        j_mod_p: 0
        role: artifact_panel
        note: supersingular at p = 101
      - id: artifact-j1728
        equation: y^2 = x^3 + x
        A: 1
        B: 0
        trace: 2
        point_count: 100
        j_mod_p: 11
        role: artifact_panel
    parameters:
      prime: 101
      m: 3
      sample_size: 64
      null_redraw_cap: 256
      field_polynomial: z^2 + 2
    implementation: >-
      CPython 3.12.8 random.Random.randrange(101) for the sample streams.
      Point counts are the trace formula t = -sum of Legendre(f(x), 101)
      and #E(F_101) = 102 - t. j ≡ 1728 * 4 A^3 * (4 A^3 + 27 B^2)^{-1}
      (mod 101). These counts were executed in the design session as
      pins. No Frobenius permutation of Psi was computed.
    budget:
      enforcement: advisory
      maximum_runs: 2
      sample_size_frozen: 64

  rerandomization: null

  falsification_conditions:
    - >-
      Order dividing 2 on all four ordinary curves, with the character
      control clean, the null quartic emitting a 3-cycle, and inertia
      agreeing, falsifies the full degree-4 reading on this panel.
    - >-
      Order 4 on one ordinary curve and order dividing 2 on another,
      under the same checks, is the exceptional-locus reading and
      falsifies uniformity on the panel.
    - >-
      Order 8, a 4-cycle, or an element of order greater than 2, on any
      ordinary curve, falsifies the assertion that the coordinates of
      Psi lie in an extension of degree at most 4.
    - >-
      A scored permutation or an inertia permutation that breaks the
      inverse-pair partition falsifies the block-system reading for
      negation of P and negation of Q.
    - >-
      A 3-cycle in the Psi group falsifies both the biquadratic reading
      and the order-8 wreath reading.
    - >-
      A character-control mismatch, a null quartic with no 3-cycle after
      the one allowed redraw, or an inertia disagreement makes the run
      inconclusive and falsifies nothing.

  interpretation_limits:
    - m = 3 and p = 101 only. No statement at cryptographic size and no transfer to m >= 4 or to any other prime.
    - The sample is F_101-rational pairs. It does not decide the image over F_{101^2} specializations or over the symmetric base.
    - No ECDLP exponent, no relation rate, and no decomposition algorithm.
    - Full order 4 on these four curves does not prove emptiness of an exceptional locus outside the panel.
    - The j = 0 artifact is supersingular at this prime. It is reported and then excluded from the ordinary tally.
    - Sorted-label Frobenius permutations can fabricate a group. An order reading is withheld when that group disagrees with the inertia subgroup.

  citations:
