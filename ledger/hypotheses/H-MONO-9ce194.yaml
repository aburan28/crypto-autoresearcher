        The m = 3 question is full symmetric or wreath monodromy versus
        an exceptional locus, with j = 0 and j = 1728 kept out of the
        ordinary tally.
      verified_by: >-
        coordinator design session 2026-10-05 read
        ledger/questions/RQ-MONO-001.yaml
    - ref: KN-FIND-c41ea9
      provenance: internal
      claim: >-
        disc_T S_3(x1, x2, T) = 16 f(x1) f(x2), and the geometric
        monodromy of that quadratic is S_2 for every nonsingular E in
        characteristic greater than 3.
      verified_by: >-
        coordinator design session 2026-10-05 read the identity section
        of knowledge/findings/KN-FIND-c41ea9.md
    - ref: H-MONO-0b3def
