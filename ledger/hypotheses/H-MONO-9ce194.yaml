      provenance: internal
      claim: >-
        Over the ordered base, the signed-sum fibre Psi has image order
        4, or order dividing 2 on an exceptional curve, or order 8 if
        the degree-4 containment fails. The swap of x1 and x2 is not a
        loop of this base.
      verified_by: >-
        coordinator design session 2026-10-05 read
        ledger/proposals/IDEA-20261005-70b25b.yaml on origin/main
    - ref: RQ-MONO-001
