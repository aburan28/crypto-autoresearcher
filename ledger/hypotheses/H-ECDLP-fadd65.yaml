  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-152a19
  title: >-
    Binomial(r, 1/r) has variance (r-1)/r for r in {2, 3, 4, 16}, which is
    1/r below the Poisson(1) variance.
  statement: >-
    For r in {2, 3, 4, 16}, the variance r*(1/r)*(1-1/r) equals (r-1)/r.
    The four values are 1/2, 2/3, 3/4, and 15/16. Each differs from 1 by
    1/r. The stored-entry factor r/(r-1) at r = 16 is 16/15. Expanding the
    binomial second moment for r = 2 gives the same 1/2.
  mechanism: >-
    An r-adding walk's in-degree, under a uniform independent model, is
    binomial with mean 1. Its variance is then 1 - 1/r rather than 1.
    This contract checks that algebra. It does not simulate a walk.
  assumptions: []
  proof_search_map:
    bottleneck: The product r * (1/r) * (1 - 1/r) and one explicit second moment.
    baseline_embedding:
      parameter_slice: >-
        The variance sentence in IDEA-20260923-5d07e3, read 2026-10-01.
        The four fractions were reduced by hand. That reduction is not a run.
      reproduction_check: >-
        One route uses the closed product. The other, for r = 2, sums
        k^2 times the binomial probabilities and subtracts the squared mean.
        They must agree on 1/2.
    observation_collision:
      observable: The four variances and the Poisson gap.
      distinct_preimage_search: >-
        Reporting variance 1 for r = 2 is the Poisson control, and it is
        false. Accepting it invalidates the run.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Four integer values of r.
        predicted_gain: Four rationals. No attack cost.
    quantifier_order: >-
      For each listed r, the closed-form variance equals (r-1)/r, and for
      r = 2 the expanded second moment matches.
    method_ceiling:
      strongest_certifiable_claim: >-
        The binomial formula at these four r. Not a measured walk and not
        a generic-group impossibility.
      nearby_object_control: >-
        The constant 1. It is not the variance at any listed r.
    proof_obligations:
      - claim: The four variances are 1/2, 2/3, 3/4, and 15/16.
        responsibility: correctness
      - claim: The r = 2 expansion matches 1/2.
        responsibility: correctness
      - claim: Variance 1 is rejected at r = 2.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
