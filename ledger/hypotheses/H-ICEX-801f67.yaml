hypothesis:
  id: H-ICEX-801f67
  question_id: RQ-ICEX-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260830-2993a4
  statement: >-
    THIS LANE'S DELIVERABLE IS AN EXPONENT IN THE GROUP ORDER FITTED OVER FOUR TOY SIZES, WHICH
    FOUR RECORDS IN THE SAME LANE ARGUE IS NOT IDENTIFIABLE. The hypothesis is that it can be
    replaced by an exponent in the FACTOR-BASE SIZE that is identifiable at ONE field size.
    (D1) THE OBSERVABLE. For a full-relation point-decomposition pipeline at arity m over a base
    of size B, let C be the number of candidate decompositions the oracle's answer logically
    settles per target and D the charged operations it spends. The DECISION RATE is C/D and the
    DECISION-RATE EXPONENT r is the slope of its logarithm against log B, fitted AT FIXED FIELD
    SIZE across a decade of B.
    (D2) THE MAPPING IS AN EXACT REPARAMETRISATION, NOT NEW MATHEMATICS. With C of order B^{m-1}
    and D of order B^{theta}, r = m - 1 - theta, which reproduces this lane's existing two-regime
    cost model term by term and places its two disputed arity-two numbers at exactly the two
    endpoints of the interval [0, 1].
    (D3) THE STRUCTURAL BY-PRODUCT. D at least 1 forces r at most m - 1. Combined with the
    rho pass line this gives an inequality between two integers, and at arity two the whole
    admissible range is a unit interval whose best endpoint is worse than rho - so the named
    obstruction is not "the oracle is slow" but "there is not enough candidate space at arity two
    for any oracle to be fast in the required sense".
    (D4) THE CLAIM THAT MAKES THE RECORD WORTH FILING, AND ITS CENTRAL RISK. r is IDENTIFIABLE
    where the incumbent exponent is not: it is fitted within one field size over many cells rather
    than between four sizes. The hypothesis is FALSE if, at MATCHED total compute budget on the
    same pipeline, the confidence interval on r is not at least three times narrower than the
    confidence interval on the incumbent exponent. There is no fallback reading, because the
    mathematics is acknowledged to be a reparametrisation.
    (D5) THE PASS LINE MUST BE MEASURED, NOT QUOTED. Whether a measured r "clears rho" is a
    comparison against a constant this program has never measured. The rho baseline is therefore
    an ARM of this hypothesis: Pollard rho run to completion on the SAME group orders and the SAME
    machine, with its step-count DISTRIBUTION recorded and its constant fitted, and the folklore
    constant used only as a cross-check on that fit and never as an input to a verdict.
  mechanism: >-
    THE TRACKED OBJECT AND ITS LOSSY-PROJECTION STATUS. The object is the decision rate - the
    ratio, per target, of candidate decompositions settled to charged operations spent. It is a
    genuinely lossy projection of the oracle's execution: it discards the instance, the curve, the
    field representation, the monomial order, the solver's internal state, the identity of the
    candidates settled and the order in which they were settled, retaining one rational number. It
    is lossy COMPATIBLY because both counters are additive over the run, so the ratio propagates
    deterministically under the only composition the pipeline performs - concatenating targets -
    and under restriction to a sub-base, which is what lets the sweep in B exist at all.
    WHY THE CHANGE OF COORDINATE HAS CONTENT RATHER THAN BEING COSMETIC. The incumbent exponent is
    defined through a per-trial COST, so measuring it requires deciding what a trial costs and
    comparing across sizes. r is defined as the exponent of a RATIO OF TWO COUNTERS INCREMENTED IN
    THE SAME RUN, so the unit of an operation cancels in the ratio and only its dependence on B
    survives. That cancellation is the whole point: the dominant confounder in this lane is the
    charging convention - a group operation versus a field multiplication versus a hash probe -
    and it moves the LEVEL of the decision rate by a constant factor while leaving r untouched.
    WHY THE COMPLETENESS FRACTION BELONGS IN THE NUMERATOR. An oracle that examines only part of
    the candidate set settles only part of it. Charging it the measured completeness fraction times
    the total candidate count, rather than the full count, is what makes the instrument report a
    known constant-factor improvement as a constant and not as a rate change - and reproducing a
    committed constant-factor speedup as a change in the LEVEL with r UNMOVED is the instrument's
    baseline test.
    WHY THE CURVE-FREE NULL READS THE OPPOSITE WAY HERE, AND WHY THAT IS STATED IN ADVANCE. r is a
    cost accounting and carries no structural information: a random predicate of identical cost,
    with no curve and no decomposition anywhere in it, has the SAME r by construction. The
    curve-free null is therefore MANDATORY and its forced value is AGREEMENT, not vanishing. An r
    that MOVES when the decomposition predicate is replaced by a curve-free predicate of matched
    cost means the estimator is reading structure into a cost ratio and is broken. This is the
    opposite of the usual null-object reading and is written here so that a later reader cannot
    invert it.
  assumptions:
    - >-
      Prime-order group of order N, factor base of size B, arity m fixed per run. The pipeline is a
      FULL-RELATION point-decomposition pipeline; partial-relation pipelines are out of scope
      because their relation supply is not the candidate count at all.
    - >-
      C is the measured completeness fraction times the number of multisets of size m-1 from the
      base, and BOTH factors are measured per cell rather than assumed. The completeness fraction
      is verified exhaustively against a reference complete oracle at small B.
    - >-
      D is measured in the run's frozen charging convention. The unit cancels in r by design, but
      the LEVEL is convention-dependent and is reported with its convention attached on every row.
    - >-
      The two-regime mapping from r to the incumbent exponent is INHERITED from another record in
      this lane and is not verified here. If that derivation is wrong, r is still measured
      correctly and its translation is wrong; every deliverable states r first.
    - >-
      A power law in B is ASSUMED TO EXIST for the oracle under test. That assumption is itself a
      primary falsifiable prediction and is tested by a lack-of-fit statistic, never presumed. An
      oracle that fails lack-of-fit is reported as HAVING NO EXPONENT, which is a legitimate
      outcome.
  proof_search_map:
    bottleneck: >-
      The identifiability of this lane's deliverable. The step whose replacement changes what the
      lane can conclude is "estimate an exponent from measurements available at toy scale". The
      bottleneck is not the algorithm; it is that the quantity currently reported cannot be
      estimated from the data the lane can collect.
    baseline_embedding:
      parameter_slice: >-
        The affine substitution r = m - 1 - theta reproduces this lane's existing two-regime model
        term by term, its threshold identically, and its two disputed arity-two numbers as the
        endpoints of a unit interval.
      reproduction_check: >-
        Symbolic identity check on all three, verified numerically across a declared range of
        arities to a declared tolerance, plus a FROZEN REGRESSION FIXTURE: the instrument run on a
        committed constant-factor variant at its own two committed cells must recover the committed
        speedup as a change in the LEVEL of the decision rate, with the fitted r identical within
        its confidence interval. An instrument that reports a change in r for a change a committed
        finding calls not-exponent-moving is broken and nothing downstream may be read.
    observation_collision:
      observable: >-
        The fitted r at a single cell, i.e. r estimated as the ratio of logarithms from one pair
        rather than as a slope.
      distinct_preimage_search: >-
        COLLISION EXHIBITED AND IT DICTATES THE DESIGN. A single-cell ratio is
        constant-contaminated in exactly the way this lane's own audits say the incumbent exponent
        is: an oracle spending a constant times B to the zero and one spending B to a power chosen
        to match at that B give the same single-cell value and different values at any other B. The
        separator is the SLOPE ACROSS A DECADE OF B AT FIXED FIELD SIZE, never a single-cell ratio,
        and the instrument is specified to REFUSE a single-cell estimate. This is the one place the
        record could repeat the exact defect it exists to fix.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the lane's deliverable from an exponent in the group order to an exponent in the base
          size, in a coordinate where the operation-unit convention cancels and the fit is a
          within-size regression over many cells rather than a between-size regression over four.
        predicted_gain: >-
          A confidence interval on the decision-relevant exponent narrow enough to have a pass line,
          at a compute budget the lane already has. NO ATTACK EXPONENT IS MOVED IN EITHER DIRECTION.
      - transform: stronger_invariant
        proposed_object: >-
          Report the triple (r, arity, lack-of-fit) together with the measured peak query space,
          rather than the scalar incumbent exponent, which is known to map distinct
          (cost-exponent, arity) pairs to the same value.
        predicted_gain: >-
          Restores identifiability of the deliverable at no additional measurement cost, since every
          component is already recorded per run.
    quantifier_order: >-
      CLAIMED. FOR ALL point-decomposition oracles whose charged cost admits a power law UNIFORMLY
      on the feasible range of B at fixed field size, THERE EXISTS a decision-rate exponent
      r = m - 1 - theta, estimable from a within-size sweep, and the inherited two-regime mapping
      assigns it a unique incumbent exponent. The uniformity in B is load-bearing: AN ORACLE WHOSE
      FITTED COST EXPONENT DRIFTS WITH B HAS NO EXPONENT and the framework does not apply to it - a
      live possibility for an algebraic oracle with degree falls, which is why the lack-of-fit
      statistic is required rather than optional. NOT CLAIMED: that r is estimable for every
      oracle. NOT CLAIMED: that a measured r says anything at another group order, another arity or
      another field.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Oracle X at arity m over a prime field in the tested range has decision-rate exponent
        r plus or minus its interval, hence within the inherited model a stated incumbent exponent,
        hence it does or does not clear the MEASURED rho pass line on these same instances." It can
        NEVER certify that any r is achievable by some undiscovered oracle, that the two-regime
        model is correct, that a toy-scale r transfers to cryptographic scale, or anything about
        partial-relation pipelines.
      nearby_object_control: >-
        THE EXTENSION-FIELD ORACLE. Instantiate the instrument where the candidate count and the
        oracle cost are known by construction, so that r is forced to a known value. THE INSTRUMENT
        MUST RETURN THAT VALUE. If it does, and returns a different value on the prime-field sweep,
        it has localised the whole prime-versus-extension difference in one measured scalar, which
        is the strongest thing it can do. If it cannot separate the two, it is not measuring the
        load-bearing structure and must not be used.
    proof_obligations:
      - claim: The affine substitution reproduces both regimes, the threshold, and the two disputed endpoint values.
        responsibility: baseline
      - claim: D at least 1 implies r at most m-1, hence the pass line requires arity at least four.
        responsibility: correctness
      - claim: The estimator recovers a planted r within its stated tolerance on synthetic oracles.
        responsibility: feasibility
      - claim: A committed constant-factor variant moves the decision rate's LEVEL and not r.
        responsibility: baseline
      - claim: The interval on r at matched budget is at least three times narrower than the interval on the incumbent exponent.
        responsibility: strictness
      - claim: The extension-field instantiation returns the forced value.
        responsibility: scope
      - claim: The rho pass line used in any verdict is measured on the same instances and machine, not quoted.
        responsibility: baseline
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-DEC-1
      formal_statement: >-
        For each oracle under test there exist a positive constant and an exponent such that the
        charged per-target cost is that constant times B to that exponent, up to a vanishing
        correction, uniformly for B in the tested range at fixed field size, so that the logarithm
        of the cost is linear in the logarithm of B with homoscedastic residuals.
      random_model_justification: >-
        RIGOROUS BY CONSTRUCTION for two of the three oracles tested: a signed-sum sweep performs a
        fixed multiple of B point operations per target and a precomputed-table oracle performs a
        bounded number of probes, so the assumption is a theorem for them and they serve as positive
        controls. The classical statement imitated for the remaining case is the fixed-parameter
        asymptotic convention under which a bounded-size algebraic solve has a power-law cost in the
        base size; this program's own open-problem record notes that the low-degree-of-regularity
        heuristic behind that convention is studied mostly over binary fields and is NOT settled
        over prime fields, which is precisely why lack-of-fit is required and why "no exponent" is
        an admissible outcome.
      supporting_results:
        - >-
          The program's open-problem record on solving-degree behaviour over prime fields, cited as
          the reason the power law is not assumed for the algebraic oracle. Second-hand to this
          session; the contract re-reads it in its zero-compute stage.
      validation_experiment_ids:
        - EXP-ICEX-c156e2
      falsification_condition: >-
        The lack-of-fit statistic rejects linearity at the declared level for an oracle. That oracle
        HAS NO EXPONENT and is reported as such; no r is quoted for it and no mapped incumbent
        exponent is derived from it.
    - id: HEUR-DEC-2
      formal_statement: >-
        The number of candidate decompositions settled per target equals a completeness fraction
        times the exact multiset count from the base, with the completeness fraction constant in B
        for a given oracle.
      random_model_justification: >-
        The multiset count is an exact double count of the same kind as this program's conservation
        identity and is exact for a complete oracle. The heuristic content is entirely in the
        constancy of the completeness fraction for an INCOMPLETE oracle, and this corpus's one
        measured instance of a non-trivial completeness fraction reports two DIFFERENT values at two
        different field sizes - direct evidence that it is not constant across regimes and must be
        measured per cell rather than assumed. The assumption is therefore stated in the weakest
        usable form and is checked rather than relied upon.
      supporting_results:
        - >-
          The program's committed finding recording a constant-factor variant with two differing
          measured completeness fractions. Second-hand to this session; the contract re-reads it and
          compares against what it actually says.
      validation_experiment_ids:
        - EXP-ICEX-c156e2
      falsification_condition: >-
        The measured completeness fraction varies with B by more than the declared tolerance within
        one field size. Completeness is instance-dependent, r must be reported with that dependence
        disclosed, and any r computed with a constant fraction is withdrawn.
  structural_ingredients:
    - description: >-
        The parent proposal's definition of the decision rate, the affine mapping, the structural
        upper bound, the planted-value calibration, the convention-invariance control and the
        matched-budget comparison.
      citation: ledger/proposals/IDEA-20260830-2993a4.yaml
      provenance: internal
      verified_by: >-
        TASK-20260904-8f2f95, coordinator design session, full read of the record on 2026-09-04.
    - description: >-
        The lane's existing two-regime cost model, of which the decision rate is an affine
        reparametrisation and from which the mapping to the incumbent exponent is inherited
        unchanged.
      citation: IDEA-20260808-2ef5c8
      provenance: internal
      verified_by: >-
        IDEA-20260830-2993a4 records a full read of that proposal in its authoring session.
        TASK-20260904-8f2f95 read the child and did NOT open the parent; the mapping is second-hand
        and the contract re-derives it symbolically in its zero-compute stage before use.
    - description: >-
        The committed finding supplying the constant-factor regression fixture and the two measured
        completeness fractions.
      citation: KN-FIND-8f2c90
      provenance: internal
      verified_by: >-
        IDEA-20260830-2993a4 records a full read of that finding in its authoring session.
        TASK-20260904-8f2f95 did not open it; the fixture values are second-hand and the contract
        re-reads the finding before the fixture is scored.
    - description: >-
        The Pollard rho baseline constant against which any pass-line verdict is stated. THIS
        PROGRAM HAS NEVER MEASURED IT; the commonly quoted value is a folklore constant and is used
        here only as a cross-check on a constant this contract measures directly.
      citation: KN-TECH-001 and KN-TECH-006
      provenance: internal
      verified_by: >-
        Named by several records in this lane as the frontier baseline. TASK-20260904-8f2f95 did NOT
        open either technique note, and this contract deliberately does not depend on them: the rho
        constant is measured as an arm of the experiment on the same instances and the same machine,
        and the quoted value appears only in a cross-check column.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        fitted r for the signed-sum sweep oracle at arity two, from a sweep across a decade of B at
        fixed field size, with a bootstrap interval
      direction: different
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION 0.00 with a 95 per cent interval of half-width below 0.10. A
        fitted r differing from 0 by more than 0.10 means the sweep is not being charged a linear
        cost per target, and every downstream number in this lane that assumes it is, is void.
    - metric: >-
        fitted r for the precomputed-table oracle at arity two, constant-time query
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED 1.00 plus or minus 0.10, the upper endpoint of the admissible interval at
        arity two. Together with the sweep prediction this pins both endpoints of the arity-two
        dispute by measurement rather than by assumption.
    - metric: >-
        planted-value calibration - fitted r for synthetic oracles constructed to have declared r by
        spending exactly the corresponding number of charged operations
      direction: different
      minimum_effect: >-
        RECOVERY WITHIN 0.10 AT EVERY PLANTED VALUE, with the residual showing no trend in the
        planted value. A systematic bias above 0.10 means the estimator is broken and no measured r
        may be reported. BLOCKING.
    - metric: >-
        confidence-interval half-width of fitted r against that of the incumbent exponent at MATCHED
        total compute budget on the same pipeline
      direction: lower
      minimum_effect: >-
        THE CENTRAL CLAIM AND THE CENTRAL RISK. At least three times narrower. If it is not narrower
        at all, the identifiability argument fails and the hypothesis should be rejected; there is
        no fallback reading.
    - metric: >-
        r under the CURVE-FREE null - the decomposition predicate replaced by a random predicate of
        identical charged cost, with no curve and no decomposition anywhere
      direction: different
      minimum_effect: >-
        FORCED UNCHANGED within the interval. Note the direction: r is a cost accounting and MUST
        agree here. An r that MOVES under this null means the estimator is reading structure into a
        cost ratio and is broken. This is the opposite of the usual null-object reading.
    - metric: >-
        r and the decision-rate LEVEL under charging conventions differing by two orders of
        magnitude in the probe cost
      direction: different
      minimum_effect: >-
        The level must move and r must NOT, by more than its interval. A fitted r that moves under a
        pure unit change falsifies the instrument's design property.
    - metric: >-
        MEASURED rho baseline - the mean step count of Pollard rho run to completion on the SAME
        group orders and the SAME machine, and the fitted constant in the mean-steps-to-collision
        law
      direction: different
      minimum_effect: >-
        Reported as a fitted constant with a bootstrap interval AND as the full empirical step-count
        distribution. The commonly quoted folklore constant appears only as a cross-check column. A
        pass-line verdict stated against a quoted rather than measured constant is inadmissible.
    - metric: >-
        lack-of-fit statistic for the power-law assumption, per oracle
      direction: different
      minimum_effect: >-
        Reported per oracle against a threshold declared before the run. PREDICTED PASS for the two
        exact-power-law oracles and PREDICTED AT RISK for any algebraic oracle. An oracle that fails
        is reported as HAVING NO EXPONENT, which is a legitimate and informative outcome.
  test_boundary:
    instances:
      - >-
        Three prime field sizes at the toy scale, with at least eight values of B spanning at least
        a factor of sixteen at each, at arity two.
      - >-
        Three real oracles at arity two: the signed-sum sweep, a committed constant-factor variant,
        and a precomputed-table oracle.
      - >-
        Synthetic planted-value oracles at a declared ladder of planted r.
      - >-
        The curve-free random-predicate null at every cell, matched in charged cost.
      - >-
        A Pollard rho arm run TO COMPLETION on the same group orders on the same machine, with at
        least 2000 attempts per group order.
      - >-
        The extension-field instantiation where r is forced by construction, as the nearby-object
        control.
    parameters:
      charging_convention: 'frozen before any run; the probe charge is additionally swept across two orders of magnitude as an invariance control'
      B_range: 'at least eight values spanning at least a factor of sixteen at each field size; a field size whose feasible range is narrower is excluded BEFORE the run'
      yield_screen: 'cells pre-screened for mean per-target yield inside a declared band, so that saturation does not distort the cost for reasons unrelated to r'
      completeness_check: 'exhaustive cross-check against a reference complete oracle at every cell with B below the declared exhaustive threshold'
      machine: 'named and pinned; every cost row and the rho arm carry it'
    implementation: >-
      Pure Python under experiments/EXP-ICEX-c156e2/driver/ with two counters added to an existing
      sweep implementation, a synthetic-oracle harness, a weighted least-squares fit with bootstrap
      intervals, and a Pollard rho implementation instrumented for exact step counts. No Macaulay
      matrix and no Groebner basis is built in the minimal test; the largest object is a sumset table
      at the declared maximum B.
    budget:
      wall_clock_seconds_total: 21600
      maximum_memory_gb: 8
      maximum_runs: 14
  falsification_conditions:
    - >-
      The estimator does not recover planted r within the declared tolerance. THE INSTRUMENT IS
      BROKEN; no measured r is reported and the record is withdrawn rather than re-tuned after seeing
      the data.
    - >-
      The interval on r is not at least three times narrower than the interval on the incumbent
      exponent at matched budget. THE IDENTIFIABILITY CLAIM - the whole reason this hypothesis exists
      over its parent - fails, and the hypothesis should be rejected.
    - >-
      Fitted r moves by more than its interval under a pure change of the charging convention. The
      claimed convention-invariance is false and r is no better than the incumbent in the respect
      that motivated it.
    - >-
      The constant-factor fixture reports a change in r. The instrument contradicts a committed
      finding's own not-exponent-moving characterisation and is broken.
    - >-
      Fitted r for the sweep at arity two differs from 0 by more than the declared tolerance. The
      sweep's true charge is not what this lane assumes - a result MORE valuable than the instrument
      itself, and reported as such.
    - >-
      Fitted r MOVES under the curve-free random-predicate null. The estimator is reading structure
      into a cost ratio.
    - >-
      The rho arm's fitted constant cannot be measured at the declared precision, or its step-count
      distribution is inconsistent with the model used to fit it. NO PASS-LINE VERDICT MAY BE STATED;
      r is reported without one.
    - >-
      Everything holds. The lane acquires a deliverable identifiable at one field size, the arity-two
      dispute is pinned at both endpoints of a unit interval whose best value is worse than a MEASURED
      rho, and the arity-four cells that exist nowhere in this corpus become measurable at known cost.
  interpretation_limits:
    - >-
      NO MATHEMATICS IS CLAIMED AS NEW. The decision rate is an affine reparametrisation of an
      existing model in this lane and the two-regime mapping is inherited verbatim. The claim is
      entirely about identifiability and measurement design, and the hypothesis should be judged on
      the matched-budget interval comparison alone.
    - >-
      SCOPED TO FULL-RELATION POINT-DECOMPOSITION PIPELINES. Partial-relation pipelines do not have a
      candidate-count-based relation supply and the mapping does not apply to them.
    - >-
      A TOY-SCALE r IS A TOY-SCALE r. Transfer to cryptographic scale is neither claimed nor
      validated, and the tested field sizes and base sizes are stated on every row.
    - >-
      r IS AN INSTRUMENT, NOT A DISCOVERY. It has the same value on a curve-free predicate of the
      same cost, which is exactly what the mandatory null verifies. NOTHING STRUCTURAL MAY BE
      INFERRED FROM AN r ALONE.
    - >-
      The mapping from r to the incumbent exponent is inherited and unverified. If that derivation is
      wrong, r remains correctly measured and its translation is wrong; every deliverable states r
      first and the mapped value second, with the inheritance named.
    - >-
      Every r row is emitted WITH the measured peak query space of the oracle that produced it,
      because at arity two an r of one is bought with quadratic space - so r without its memory column
      is exactly as unidentifiable as the incumbent exponent without its space column.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-ICEX-001
    - IDEA-20260830-2993a4
    - IDEA-20260808-2ef5c8
    - IDEA-20260829-b5a2c8
    - KN-FIND-8f2c90
    - KN-OPEN-002
  distinguishable_outcomes:
    - outcome: >-
        Planted values recovered, fixture moves the level and not r, curve-free null agrees,
        convention invariance holds, and the interval on r is at least three times narrower at matched
        budget.
      meaning: >-
        The identifiability claim is supported at the tested field sizes. The lane can be offered a
        new reporting object - the triple with its peak query space - and the arity-two dispute is
        pinned by measurement against a MEASURED rho constant.
    - outcome: >-
        The interval on r is not narrower.
      meaning: >-
        The central claim fails. The reparametrisation buys nothing measurable and the hypothesis is
        rejected on its own declared criterion; this is the outcome the design most needs to be able
        to reach.
    - outcome: >-
        r moves under the curve-free null or under the convention sweep.
      meaning: >-
        The estimator is broken - it is reading structure into a cost ratio, or the unit does not
        cancel as designed. No measured r is admissible in either direction.
    - outcome: >-
        The sweep's fitted r differs materially from zero.
      meaning: >-
        The per-trial charge this lane assumes for its simplest oracle is wrong. That is more
        valuable than the instrument and is reported as the headline, with the affected downstream
        records named.
    - outcome: >-
        The rho arm cannot be fitted at the declared precision.
      meaning: >-
        The pass line is unavailable. r is reported without a verdict; quoting the folklore constant
        as a substitute is prohibited by this hypothesis.
    - outcome: >-
        An algebraic oracle fails lack-of-fit.
      meaning: >-
        That oracle HAS NO EXPONENT in B on the tested range. This is a legitimate and informative
        result and the framework must report it rather than force a fit.
