hypothesis:
  id: H-ICEX-835c4f
  question_id: RQ-ECDLP-002
  statement: >-
    The program has no measured Pollard-rho baseline. Measured on this program's
    own hardware over a four-size toy ladder with at least 100 instances per
    size, the step-count constant c defined by E[group operations] = c * sqrt(n)
    equals 0.8862 within 10 percent for a walk on POINTS, and 0.6267 within 10
    percent for a walk on NEGATION CLASSES; the distinguished-point overhead,
    peak collision-storage memory and the parallel speedup curve are measurable
    to the stated precision; and the parallel speedup is within 20 percent of
    linear up to the machine core count.
  mechanism: >-
    The expected number of steps to a birthday collision in a group of size m is
    sqrt(pi * m / 4). Walking on points gives m = n and c = sqrt(pi/4) = 0.8862.
    Walking on negation classes gives m = n/2 and c = 0.8862 / sqrt(2) = 0.6267.
    The step-count constant is size-independent and transfers; the wall-clock
    constant is not, because field-arithmetic cost grows with p, and conflating
    the two is the specific error this hypothesis exists to prevent.
  assumptions:
  - >-
    A competent implementation is achievable. An unoptimised baseline inflates
    the reference cost in the direction that flatters every competitor, which is
    the dangerous direction, so implementation quality is reviewed before any
    number is admitted.
  - >-
    UNITS. The step-count constant is fitted from GROUP OPERATIONS against
    sqrt(n). Wall clock is reported separately in seconds and separately as
    seconds per group operation; it is never divided into an operation count and
    never enters the constant.
  - >-
    Toy sizes admit enough repetitions for the constant to be fitted with a
    usable interval. At 100 instances per size the standard error on the mean
    step count is about 5.2 percent, since the collision time has relative
    standard deviation about 0.523.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      A measurement of a classical algorithm's constants on this program's
      hardware. No theorem is sought and nothing mathematical is claimed.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL four tested toy subgroup sizes, the fitted step-count constant of
      the point walk satisfies |c - 0.8862| <= 0.10 * 0.8862, and the fitted
      constant of the negation-class walk satisfies |c - 0.6267| <= 0.10 * 0.6267.
    random_model_justification: >-
      The birthday analysis giving expected steps sqrt(pi * m / 4) is exact for a
      uniform random function on a set of size m and is size-independent. THE
      GAP, STATED - the per-step cost is NOT size-independent, since field
      arithmetic cost grows with p, so the wall-clock constant does not transfer
      even though the step-count constant does.
    supporting_results:
    - >-
      KN-TECH-006, read in full - expected about 0.886 * sqrt(n) group operations
      serial, about sqrt(n)/m wall clock on m processors, small per-processor
      memory; walk quality tightened by Teske, with well-chosen r-adding walks
      about 20 percent faster than the original three-branch map.
    validation_experiment_ids:
    - EXP-ICEX-91952c
    falsification_condition: >-
      A fitted step-count constant whose 95 percent interval excludes the
      analytic constant for the corresponding walk, at any tested size.
  structural_ingredients:
  - description: >-
      A DOCUMENTED DISAGREEMENT BETWEEN TWO COMMITTED KNOWLEDGE ENTRIES, WHICH
      THIS EXPERIMENT IS SIZED TO SETTLE. KN-TECH-006 states, verbatim, expected
      about 0.886 * sqrt(n) group operations serial, and separately that negation
      and other cheap automorphisms give a FURTHER constant-factor speedup.
      KN-TECH-018 states, verbatim, that the convention 0.886 * sqrt(n) with
      negation ALREADY INCLUDES the sqrt(2) negation factor. These cannot both
      hold - sqrt(pi/4) = 0.8862 is the plain birthday constant, and a
      negation-class walk gives 0.6267. This record reports both walks against
      both analytic constants and states which convention the measurement
      supports. It does not edit either entry.
    citation: KN-TECH-006 and KN-TECH-018
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, both files read in full)
    role: baseline convention under dispute
  reduction_chain: null
  predictions:
  - metric: known_solution_verification
    direction: different
    minimum_effect: >-
      FORCED correct on every instance before any timing or count is recorded. A
      single unrecovered known solution voids the run.
  - metric: counter_injection_forced_value_control
    direction: different
    minimum_effect: >-
      With a declared factor-2 inflation injected into the group-operation
      counter, the reported constant must be exactly 2.000 times the uninjected
      constant, within 0.01. A forced-value check on the accounting itself.
  - metric: negation_class_walk_planted_defect
    direction: lower
    minimum_effect: >-
      Switching from a point walk to a negation-class walk must reduce the fitted
      step-count constant by exactly sqrt(2) = 1.414, within 15 percent. This is
      the defect of known size and its predicted magnitude, and it is also what
      settles the KN-TECH-006 versus KN-TECH-018 disagreement.
  - metric: walk_quality_planted_defect
    direction: higher
    minimum_effect: >-
      A three-branch walk must be about 20 percent more expensive in steps than a
      well-chosen r-adding walk with r = 20, per KN-TECH-006. The instrument must
      report a ratio of 1.20 within 0.15. At 100 instances per cell the standard
      error on the mean is about 5.2 percent, so a 20 percent effect is about 3.8
      standard errors and the band is not degenerate.
  - metric: fitted_step_count_constant_with_interval_across_the_size_ladder
    direction: different
    minimum_effect: >-
      Reported per size with a 95 percent interval, beside the analytic constant
      for the corresponding walk, with hardware and implementation stated.
  - metric: parallel_speedup_versus_processor_count
    direction: higher
    minimum_effect: >-
      Within 20 percent of linear up to the machine core count. A materially
      worse curve indicates an implementation problem and is reported as an
      implementation finding, never as a mathematical one.
  test_boundary:
    instances:
    - toy prime-order subgroups at 28, 32, 36 and 40 bits
    - at least 100 instances per size per walk mode
    parameters:
      walk_modes: [point_walk, negation_class_walk]
      r_adding_partitions: [3, 20]
      distinguished_point_granularity: swept and recorded per run
    implementation: >-
      One rho implementation with walk mode, partition count and
      distinguished-point granularity as declared flags; BSGS on the same
      instances as a second measured baseline.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 16
      maximum_runs: 60
  falsification_conditions:
  - >-
    A known solution is not recovered. The implementation is wrong and the run is
    void.
  - >-
    The counter-injection control does not return exactly 2.000. The accounting
    is wrong and every constant is inadmissible.
  - >-
    The negation-class plant does not reduce the constant by sqrt(2) within 15
    percent. The instrument has no demonstrated dynamic range on the quantity it
    exists to measure.
  - >-
    A fitted constant's 95 percent interval excludes the analytic constant for
    its walk at any size. Either the implementation is weak or the cost model
    differs; both must be resolved before the baseline is used anywhere.
  - >-
    The parallel curve departs from linear by more than 20 percent. An
    implementation problem, reported as such and fixed before a baseline is
    published.
  interpretation_limits:
  - >-
    Measures a known algorithm. Produces no new attack, no exponent and no
    mechanism.
  - >-
    The WALL-CLOCK constant is implementation- and hardware-bound and is not a
    property of the algorithm; only ratios against competitors measured on the
    same machine are portable. The STEP-COUNT constant is size-independent and
    is the transferable quantity. The two are reported separately and never
    combined.
  - >-
    THE BIRTHDAY CONSTANT IS CURVE-FREE BY CONSTRUCTION. sqrt(pi * m / 4) is a
    statement about a uniform random function on a set of size m and mentions no
    elliptic curve. This is recorded as a proof about the quantity rather than as
    an experimental arm, and it is pre-declared that NO outcome on the
    step-count constant is an elliptic-curve statement. A curve-free Z/n arm is
    run as an IMPLEMENTATION check and labelled as such.
  - >-
    Toy sizes only; the fit is a toy-range fit and the four-size ladder cannot
    distinguish a constant from a slowly varying function of n.
  status: proposed
  proposed_by: coordinator
