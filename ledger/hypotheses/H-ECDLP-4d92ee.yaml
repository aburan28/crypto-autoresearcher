# =============================================================================
# H-ECDLP-4d92ee -- The Kodaira-Spencer defect digit delta_KS: a canonical
# O(log n)-cost digit of the unique n-torsion lift into a NON-CONSTANT
# first-order deformation of a prime-order ordinary curve; three exact identities
# (C1, C2, C3) as calibrations; DL-spectrum measurement deferred to Stage 2.
# Specified and approved (Stages 0-1 ONLY) under DEC-20261002-a31a7b from
# IDEA-20260930-8e3b75 under RQ-ECDLP-c1b7b1.
#
# ZERO RUNS in this design packet. IDEA-20260930-8e3b75 claim text is not edited
# (proposals immutable); this hypothesis cites it and freezes its thresholds
# VERBATIM. No attack is claimed and no exponent moves.
#
# OVERLAP RULE: this hypothesis does NOT edit, supersede or absorb
# H-ECDLP-f1e714 / EXP-ECDLP-1e6502 (the Witt-direction digit library census,
# status draft, approved_by null). It shares a measurement instrument with it
# and adds a new library member family with its own gates; see
# shared_with_existing_contracts below.
# =============================================================================
