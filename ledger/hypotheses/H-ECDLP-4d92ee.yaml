  interpretation_limits:
    - >-
      No exponent moves and no attack is claimed. delta_KS is a measurement
      object. Any E-LEAD outcome would require replication at a fourth seed and
      one further size, then independent review-breakthrough at max effort
      (AGENTS.md rule 12) before any record states it; no exploit is modelled
      before that.
