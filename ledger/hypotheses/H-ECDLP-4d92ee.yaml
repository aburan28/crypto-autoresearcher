        delta_1, Witt delta_2, Teichmuller third digit and their post-functions),
        which lives in the Witt direction over Z/p^k; this hypothesis lives in
        the equicharacteristic direction over F_p[eps].
      - >-
        The four Stage 1 gates (C1 exact identity, exhaustive homomorphism check,
