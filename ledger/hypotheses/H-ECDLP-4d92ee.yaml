      Crash, timeout or missing dependency: failed_infrastructure; missing cells
      stay missing.
    frozen_stage2_outcomes: >-
      E-WHITE, E-LEAD, INCONCLUSIVE and ARTIFACT exactly as in the predictions
      list; not decidable under this contract.

