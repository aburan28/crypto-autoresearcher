      Toy tier (claim_tier toy). Stage 1 reaches field_bits 10 to 16; Stage 2
      would reach 2^16 to 2^24. Nothing transfers to cryptographic p by any
      argument here (H2 is labelled extrapolation).
    - >-
      A white spectrum, if later measured, is a statement about single-character
      correlations of the declared members; it says nothing about adaptive
      combinations of many digits (the stated gap of IDEA-20260905-b6154d).
    - >-
      The anomalous arm is KNOWN (Belding 2007; the p-adic form is Smart /
      Satoh-Araki / Semaev, KN-TECH-033). It is a calibration, never a result.
      The Hasse-invariant criterion is a derivation obligation.
    - >-
      Passing Stage 1 certifies the instrument at the declared curves only. It
      supports no statement about any other curve, direction, precision or
      reference convention.
    - >-
      KN-TECH-06bb4e gains a cell (local, torsion, equicharacteristic, F2 prime in
      the idea wording) only if the Coordinator later promotes it; this record
      names the cell and does not edit the taxonomy.
    - Stage 2 (census at 2^16 to 2^24, E-LEAD / E-WHITE) and the 2^32 replication are NOT designed or approved by this record.

