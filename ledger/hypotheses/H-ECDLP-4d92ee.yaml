    collision_finding: >-
      The measurement is NOT already inside an existing frozen contract: no
      existing contract computes a dual-number torsion lift or any delta_KS
      value (EXP-ECDLP-a5f766 audits the first-order coordinate jet of
      x^2/A under gauge and pullback, symbolically, and measures no discrete-log
      statistic; EXP-ECDLP-daf1bb Stage 0 is a Hom(Z/N, .) calibrator and
      explicitly excludes dual-number jets). No stop condition applies.

  mechanism: >-
    OBJECT FRAME. Representation: the point P is represented by its unique
    order-n lift s(P) into E_eps(F_p[eps]/eps^2) (class R3, local-ring
    representation with a NON-constant curve). Operation set Sigma: the lifted
    group law of E_eps(R) restricted to s(G), transported by the isomorphism s,
    with the fixed reference ref and fixed direction. Trichotomy: Class III,
    coordinate-dependent. delta alone does not propagate under translation: its
    one-step law needs the bounded-degree cocycle c(P, Q) = psi(ref(P) + ref(Q) -
    ref(P + Q)). The object tracked through a census is the pair (DL-frequency
    a, |delta^(a)|) for which translation acts by a phase, so spectral
    magnitudes propagate deterministically (lossy and compatible).

    CORE COMPUTATION (the idea). [n] ref(P) lies in K, and [n] ref(P) = [n](s(P)
    - delta V) = -n delta V, so delta(P) = -(n^{-1} mod p) psi([n] ref(P)).
    COORDINATE-LEVEL RECIPE (derived by the Coordinator in this design session
    by hand from the idea formulas; UNREVIEWED; Stage 0 must re-derive it or
    replace it with a proved alternative before any gate uses it): write
    A = [n-1] ref(P), a point above -P with x(A) = x_P + eps alpha. Then
    A + ref(P) = [n] ref(P) = K_t with t = -alpha/(2 y_P), hence
    delta(P) = alpha / (2 n y_P) mod p. Every addition on the way to A has
    distinct reduced x-coordinates (right-to-left double-and-add with partial
    sums below n-1), so the affine formulas over R never meet a non-unit
    denominator, and the final step needs no point-at-infinity chart. Self-test
    by hand in the trivial direction: s(P) = ((1 + 2 lambda eps) x_P,
    (1 + 3 lambda eps) y_P), [n-1] ref(P) = -s(P) - (n-1) delta V_{-P}, which
    gives alpha = 2 lambda x_P + 2 (n-1) y_P delta and delta = lambda x_P / y_P
    is consistent with alpha = 2 n lambda x_P.
    COORDINATE-LEVEL RECIPE FOR s: s(P) = ref(P) + K_delta, that is
    (x_P + eps 2 y_P delta, y_P + eps (x_P/(2 y_P) + (3 x_P^2 + a) delta)) in
    direction (1, 0).
    C2 HAND DERIVATION SKETCH (Coordinator, UNREVIEWED, to be re-derived or
    refuted in Stage 0): let E1 and E2 be lifts to Z/p^2 differing by p (a', b'),
    t_1 the order-n section of E1 (an exact homomorphism). The map Phi that sends
    a point of E2(Z/p^2) of the form (x_{t1(P)} + p u, y_{t1(P)} + p v) to
    (x_P + eps u, y_P + eps v) in E_eps(F_p[eps]) is a group homomorphism,
    because the addition law is a rational function with integer coefficients,
    F(t_1(P1), t_1(P2); A, B) = t_1(P1 + P2) exactly, and the first-order
    expansion in p coincides with the first-order expansion in eps. Hence
    Phi(t_2(P)) is an order-n point above P and equals s(P), so
    (x(t_2(P)) - x(t_1(P)))/p = x-displacement of s(P) = 2 y_P delta(P), which is
    (C2). A residual obligation is the treatment of kernel (above-O) points,
    where the affine chart fails.
    C3 NOTE (Coordinator observation, to be settled in Stage 0): for the trivial
    direction Sigma_triv(P) = psi([p] ref(P)) = 0 on every anomalous curve,
    although a_p = 1 there, because s is then a homomorphism and [p] kills K. The
    criterion "Sigma != 0 iff a_p == 1 mod p" of the idea therefore needs the
    qualifier "for a non-trivial direction" (or a statement of the exact
    condition on the Kodaira-Spencer class). The idea panel uses direction (1, 0)
    and its pass criterion is the certified recovery, not the criterion text; the
    qualifier does not alter any gate.

  assumptions:
    - >-
      E ordinary, #E(F_p) = n prime, n != p, p > 3, a != 0, b != 0, so the
      direction (1, 0) is non-trivial (b != 0) and y_P != 0 for every P != O. The
      anomalous panel (n = p) is a control, never a target.
    - >-
      Dual-number arithmetic is exact: (u + eps w)^{-1} = u^{-1} - eps w u^{-2}
      for u a unit; every affine addition on E_eps is the short-Weierstrass
      formula over R; no point above O other than kernel elements is formed.
    - >-
      The delta digit is computed from coordinates only; discrete logs are used
      solely to index a spectrum at Stage 2 (RQ-ECDLP-c1b7b1 constraint: no
      predicate evaluated in a census may take the scalar as input).
    - >-
      OFF-LIMITS COMPONENTS: F5 as the boundary (the same construction over
      Z/p^2 is IDEA-20260905-3a30d5, bridged by (C2)); F4 (pairing transfer) and
      the anomalous fragment are known inhabitants of the fast high-degree door;
      no factor base, no walk, no lift to characteristic zero is proposed.

  proof_search_map:
    bottleneck: >-
      Whether the defect of the coordinate-defined reference section relative to
      the unique equicharacteristic torsion lift is correlated with any character
      of G beyond the white level (Stage 2, not authorized here). At the Stage 0-1
      scope the bottleneck is instrument and derivation validity: that the exact
      identities (A), (B), (C1) are derived and reproduced bit for bit before any
      spectrum exists.
    baseline_embedding:
      parameter_slice: >-
        The trivial deformation direction (a', b') = lambda (4a, 6b), where the
        family is the constant curve in a moving coordinate system (nearby-object
        control of IDEA-20260905-3e9133) and delta must equal lambda x_P / y_P
        exactly; the anomalous case n = p, where Sigma is a nonzero
        homomorphism and recovers the scalar (Belding 2007 abstract; Smart
        analogue); and the Witt direction via (C2).
      reproduction_check: >-
        Symbolic ((C1) derived in the idea and re-derived in Stage 0) and frozen
        fixture: delta_triv(P) == lambda x_P / y_P for every P on five declared
        curves with zero tolerance; s(P + Q) = s(P) + s(Q) on all ordered pairs
        at one 12-bit curve; (C2) against the a26bde p-adic instrument on 10^3
        points per curve or deferred with the reason recorded.
    observation_collision:
      observable: >-
        At Stage 1: the exact values delta_triv(P), the equality s(P + Q) =
        s(P) + s(Q), recovered scalars with certificates. At Stage 2: the
        DL-spectrum magnitudes |delta^(a)|, a != 0, and the derived statistics.
      distinct_preimage_search: >-
        Carried from the idea: delta and any translate delta(. + T) share
        spectral magnitudes (phases only; harmless). The dangerous collision
        delta_KS versus delta_KS + lambda x/y (a different direction
        normalisation) is excluded by fixing direction (1, 0) and the reference
        convention before any spectrum is read. COORDINATOR ADDITIONS (hand
        derived, labelled): (a) delta(-P) = -delta(P), since ref(-P) = -ref(P)
        and s(-P) = -s(P); delta_KS is an ODD function on the log ordering
        (delta_triv = lambda x/y is odd too), so its DFT is purely imaginary and
        the unconstrained random-function null of the idea is NOT parity
        matched; a parity-matched null (a random odd function) must be added to
        Stage 2 alongside the idea null before any ratio to the null is
        interpreted, otherwise the spike ratio is biased by a factor of the
        order of sqrt(2) (derived from max of chi-square-1 versus
        exponential variables; to be re-derived in the Stage 2 design); (b) the
        x-based members of the sibling census are EVEN functions, with the
        mirror issue for a value-permutation null, which is the sibling
        contract concern and is not decided here.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the construction fixed and vary the forgotten structure, the
          deformation direction across the one-dimensional space: the trivial
          direction gives a bounded-degree function (white by theorem), the
          Kodaira-Spencer direction gives a degree >= p / C_0 function (measured
          at Stage 2).
        predicted_gain: >-
          A built-in exact negative control and a one-parameter family with a
          single genuine member, at zero compute.
      - transform: representation_reduction
        proposed_object: >-
          Replace coordinate invariants of the p-adic torsion lift (KN-OPEN-3417fc)
          by the lift-independent part of the torsion digit, identified by (C2)
          with delta_KS computed in F_p[eps].
        predicted_gain: >-
          One canonical digit replaces an affine family of lift-dependent digits;
          no p-adic arithmetic in the census.
    quantifier_order: >-
      FOR ALL ordinary E/F_p of prime order n != p with a != 0, b != 0, FOR the
      fixed direction (1, 0) and the fixed reference convention, delta_KS: G ->
      F_p is defined and satisfies (B) and (C1) unconditionally (modulo the
      derivation obligations named). The EMPIRICAL Stage 1 claim: FOR the declared
      five curves (exhaustively on their points) and one 12-bit curve (on all
      ordered pairs) and the first 50 admissible anomalous curves in generator
      order (no replacement after a failure) the stated equalities hold. No
      witness may depend on the target: direction, reference, library, seeds and
      the anomalous panel rule are frozen before any value is computed. THE WEAKER
      READING NOT CLAIMED: toy-scale agreement implies agreement at any other
      scale, and white at toy scale implies white at cryptographic scale (H2).
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: for the declared curves, direction, reference and panel rule,
        the instrument reproduces delta_triv = lambda x/y and the homomorphism
        s(P + Q) = s(P) + s(Q) exactly, recovers m with certificates on the
        declared anomalous panel, and (C2) holds or is deferred on the declared
        points. It can NEVER certify that no deformation observable at higher
        precision or over a larger base carries a character, nor anything at
        cryptographic scale, nor anything about adaptive combinations of digits.
      nearby_object_control: >-
        The anomalous curve (n = p) where the same construction is a nonzero
        homomorphism recovering the scalar with certificate; the trivial
        direction where the digit is lambda x/y; and (PROVES-TOO-MUCH) the
        non-homomorphic reference section ref, on which the exhaustive pair
        check MUST report failures. A pipeline that cannot see the anomalous
        object as linear, the trivial direction as x/y, and ref as
        non-homomorphic has not identified the load-bearing structure.
    proof_obligations:
      - claim: >-
          The sequence 0 -> K -> E_eps(R) -> E(F_p) -> 0 splits uniquely for n
          coprime to p; delta(P) = -(n^{-1} mod p) psi([n] ref(P)); delta(P + Q) =
          delta(P) + delta(Q) + c(P, Q).
        responsibility: correctness
      - claim: (C1) delta_triv(P) = lambda x_P / y_P exactly for the direction lambda (4a, 6b).
        responsibility: baseline
      - claim: (C2) the lift-derivative identity between two Z/p^2 lifts and delta_{(a',b')}, exact mod p.
        responsibility: correctness
      - claim: (C3) Sigma is additive for n = p and recovers m; the criterion Sigma != 0 iff a_p == 1 is a derivation obligation (see the trivial-direction qualifier).
        responsibility: baseline
      - claim: (D) delta_KS is not the restriction of a rational function of degree below p / C_0 (non-split Weil restriction plus Bezout / Lang-Weil count).
        responsibility: strictness
      - claim: Every reported statistic names the curve, size, seed, direction, reference convention, precision and post-function, and is paired with the null value.
        responsibility: scope
    not_applicable_reason: null

  derivation_obligations:
    - id: DO-1
      statement: (A), (B), (C1) with every step numbered; a failure at any step halts Stage 1.
    - id: DO-2
      statement: >-
        (C2): derive it (the Phi-homomorphism route above or another) or record
        exactly where it fails. Either outcome passes the Stage 0 gate; it is
        NOT assumed true.
    - id: DO-3
      statement: >-
        (C3) criterion: derive Sigma != 0 iff the stated Hasse-invariant /
        Cartier condition holds for a non-trivial direction, or mark it unproved
        and keep Belding (arXiv math/0703906, abstract level, body unread) as the
        pointer. Resolve the trivial-direction qualifier.
    - id: DO-4
      statement: >-
        (D) with its TWO RECALLED INPUTS named: (i) the first-order deformation
        and Ext^1(E, G_a) = H^1(E, O_E) one-dimensionality facts (Katz LNM 868
        standard facts), giving that the Weil restriction of a non-trivial
        first-order deformation is a non-split G_a-extension of E; (ii) a
        Bezout / Lang-Weil point-count bound for a curve of degree O(d) in E x E.
        Both are provenance recalled until an agent opens a source; (D) may not
        be cited as a proved lemma until then.
    - id: DO-5
      statement: >-
        Freeze the precision-3 definition of delta_2_KS and the full library
        listing (conventions-freeze) before Stage 1 begins; no member may be
        added after Stage 1 begins.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. This is a representation-and-calibration record with a
    pre-registered measurement; no complexity improvement is claimed
    (target_complexity of the idea: no exponent claimed or moved). The idea
    reports delta_KS cost as O(log n) dual-number group operations per point,
    about three F_p multiplications per F_p multiplication, memory O(1) per
    evaluation; the census stores one length-N spectrum per member at toy scale
    (measurement cost, not attack cost). Best known unchanged: parallel Pollard
    rho with negation 0.886 sqrt(n) (KN-TECH-006, KR-RHO-fb88e6).

  heuristic_assumptions:
    - id: HEUR-ECDLP-4d92ee-H1
      formal_statement: >-
        (Random-digit model, idea H1.) For the Kodaira-Spencer direction on a
        non-anomalous prime-order curve, the function e(delta_KS / p): G -> C has
        DL-spectrum magnitudes distributed as those of a uniformly random
        function G -> F_p with the same marginal law: max over a != 0 of
        |delta^(a)| at the Gumbel level sqrt(2 N log N) (1 + o(1)), half-energy
        fraction 1/2 + O(N^(-1/2)). Coordinator caveat (hand derived, labelled):
        delta_KS is odd under P -> -P, so the matched null must be an odd random
        function; with the unconstrained null the Rayleigh comparison is
        mis-specified by the symmetry.
      random_model_justification: >-
        None rigorous for delta_KS itself: by (D) its degree exceeds p / C_0, so
        the Weil-level bound of IDEA-20260905-b6154d (B) does not apply; the only
        rigorous input is the absence of an additive component (Hom(Z/n, F_p) =
