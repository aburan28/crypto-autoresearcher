    - metric: C1_exact_identity_failures_delta_triv_vs_lambda_x_over_y
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO over every point of the five declared curves (3 curves at 16
        bits, 1 at 14 bits, 1 at 12 bits) at each of lambda in {1, 2, p - 1}. Any
        failure voids the instrument (zero tolerance).
    - metric: homomorphism_failures_s_P_plus_s_Q_vs_s_P_plus_Q_all_ordered_pairs_12_bits
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO over all ordered pairs of non-identity points of one 12-bit
        curve (with the P + Q = O pairs checked as s(-P) = -s(P)). Any failure
        voids the instrument.
    - metric: homomorphism_control_failures_of_the_nonhomomorphic_ref_section
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE on the same pairs (the check must be capable of failing;
        a zero count means the check is vacuous and voids the gate).
    - metric: C3_anomalous_panel_recoveries_with_certificates_of_50
      direction: higher
      minimum_effect: '50 of 50 with certificates [m]P = Q re-verified independently; a single failure voids the positive control and no white reading may be reported.'
    - metric: C2_identity_failures_over_1000_points_per_curve_on_three_curves
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO if (C2) is true. A failure does NOT void the instrument; it
