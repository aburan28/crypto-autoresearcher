  distinguishable_outcomes:
    stage0_complete: >-
      Derivation note present with the seven self-checks passing; (C2) and (C3)
      each recorded as derived or as an obligation or failure point; conventions
      frozen. Stage 1 may start.
    stage0_halt: >-
      A step of (A), (B), (C1) or the computation recipe fails to derive: Stage 1
