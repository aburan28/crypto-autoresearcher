  id: H-ECDLP-4d92ee
  question_id: RQ-ECDLP-c1b7b1
  source_idea: IDEA-20260930-8e3b75
  derived_from_idea: IDEA-20260930-8e3b75
  experiment_id: EXP-ECDLP-ff0559
  goal_id: null
