    stage1_pass: >-
      G1, G2 and G3 pass with zero failures and the control ref reports failures;
      G4 is reported separately as PASS, FAIL or DEFERRED. The instrument may
      be used by a later, separately designed Stage 2. Nothing is concluded
      about the spectrum of delta_KS.
    stage1_void: >-
      Any blocking gate fails after a verified-correct implementation: the
      instrument is void; Stage 2 never runs on it; the failure is reported with
      its transcript and is not negative evidence about delta_KS.
    C2_failed: >-
      G4 fails with G1-G3 passing: the identification with the p-adic digit is
      falsified as a derivation outcome; the instrument stands.
