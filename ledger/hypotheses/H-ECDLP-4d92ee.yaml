        reported as a derivation outcome. Deferral with a recorded reason is a
        permitted outcome and is not a failure.
    - metric: FROZEN_Stage2_max_spike_exponent_beta_per_library_member_N_2pow16_2pow20_2pow24
      direction: different
      minimum_effect: >-
        FROZEN, NOT AUTHORIZED. E-WHITE iff beta in [0.45, 0.60] for every library
