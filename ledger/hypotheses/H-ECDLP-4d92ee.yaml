  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-a31a7b
  proposed_by: coordinator
  title: >-
    THE DEFORMATION DEFECT DIGIT. On an ordinary curve E/F_p of prime order n
    (n != p) the unique order-n lift s(P) of a point into the NON-CONSTANT
    first-order deformation E_eps: y^2 = x^3 + (a + eps) x + b over F_p[eps]/eps^2
    differs from the coordinate-defined reference section ref(P) by a canonical
    kernel element psi(s(P) - ref(P)) = delta_KS(P) in F_p, computable by one
    dual-number scalar multiplication; Stage 0 derives (A), (B), (C1), (C2)
    (derived or failure point recorded), (C3) (criterion derived or left as an
    obligation) and (D); Stage 1 gates the instrument on four zero-tolerance
    identities; the DL-spectrum census (Stage 2) is designed after Stage 1.

  statement: >-
    SETTING AND TEST BOUNDARY. E: y^2 = x^3 + a x + b over F_p, p > 3, ordinary,
    #E(F_p) = n prime, n != p, j not in {0, 1728} (that is a != 0 and b != 0),
    G = E(F_p). Fixed deformation direction (a', b') = (1, 0); fixed reference
    convention ref(P) = (x_P, y_P + eps x_P/(2 y_P)) (the unique point above P
    with zero x-displacement). Define delta_KS(P) = psi(s(P) - ref(P)) in F_p,
    where s(P) is the unique point of order n above P in E_eps(F_p[eps]/eps^2)
    and psi: ker(E_eps(R) -> E(F_p)) -> F_p is the isomorphism induced by the
    invariant vector field V = 2y d/dx + (3x^2 + a) d/dy (K_t acts on a point
    above P by (x, y) |-> (x + eps 2 y_P t, y + eps (3 x_P^2 + a) t)).
    The record rests on stated objects and identities, each at the status the
    idea gives it, and carries NO claim about cryptographic parameters:

    (A) The setting and the unique splitting s of
    0 -> K -> E_eps(R) -> E(F_p) -> 0 for n coprime to p.
    (B) delta_KS(P) = -(n^{-1} mod p) psi([n] ref(P)); one-step law
    delta(P + Q) = delta(P) + delta(Q) + c(P, Q).
    (C1) TRIVIAL DIRECTION, EXACT. For (a', b') = lambda (4a, 6b),
    delta_triv(P) = lambda x_P / y_P for every P. Zero tolerance.
    (C2) LIFT-DERIVATIVE IDENTITY (derivation obligation, predicted exact):
    for two lifts of E to Z/p^2 whose coefficients differ by p (a', b'),
    (x(t_2(P)) - x(t_1(P)))/p == 2 y_P delta_{(a',b')}(P) (mod p).
    (C3) ANOMALOUS CASE (n = p, KNOWN: Belding 2007 at abstract level): the
    functional Sigma(P) = psi([p] ref(P)) is additive and recovers the scalar.
    Its Hasse-invariant criterion is a derivation obligation, not a result.
    (D) DEGREE LEMMA (derivation obligation): delta_KS is not the restriction
    to G of a rational function of degree below p / C_0.

    WHAT THIS HYPOTHESIS ASSERTS AT THE STAGE 0-1 SCOPE (the only approved
    scope): (i) the Stage 0 derivation note can be written with every step of
    (A), (B), (C1) numbered and checked, with (C2), (C3) and (D) each resolved as
    derived or as an explicitly recorded obligation or failure point; (ii) the
    instrument (dual-number affine arithmetic on E_eps and scalar multiplication
    by n) returns delta_triv = lambda x/y bit for bit on every point of five
    declared curves; (iii) s(P + Q) = s(P) + s(Q) holds on every ordered pair of
    non-identity points at one 12-bit curve; (iv) on 50 anomalous toy curves the
    scalar m is recovered from Sigma(Q)/Sigma(P) with a certificate [m]P = Q that
    the harness re-verifies independently; (v) (C2) is checked against the
    lane's p-adic torsion-section instrument at 10^3 points on each of three
    curves, or its deferral is recorded with the reason. A failure of (ii), (iii)
    or (iv), or of the Stage 0 self-checks, voids the instrument; Stage 2 never
    runs on a voided instrument, and a void is never negative evidence about
    delta_KS (AGENTS.md rule 3). A failure of (v) does NOT void the instrument:
    it falsifies the identification of delta_KS with the lift-derivative of the
    p-adic torsion digit and is recorded as a derivation outcome.

    FROZEN BUT NOT EXECUTION-AUTHORIZED (Stage 2, designed after Stage 1). The
    idea's pre-registered DL-spectrum prediction is carried here verbatim so it
    cannot be re-read after any spectrum is seen: on non-anomalous prime-order
    toy curves the DL-spectrum statistics of the census of EXP-ECDLP-184fc4
    applied to delta_KS (precision 2), delta_2 (precision 3, direction a + t) and
    their cheap post-functions (additive character e(delta/p); residues mod 2,
    4, 8; Legendre(delta); half-interval) are WHITE: max-spike exponent beta in
    [0.45, 0.60], Gumbel Z in [0.5, 4], half-energy fraction 0.50 +- 0.05,
    slope in log p of (max spike / sqrt N) within +- 0.1 of zero, all matching
    the seeded random-function null with the same marginals. E-WHITE iff beta in
    [0.45, 0.60] for every library member AND the ratio of the member max spike
    to the null max spike lies in [0.5, 2] at every size; E-LEAD iff some member
    has ratio >= 4 at all three sizes with a non-decreasing trend and the null
    does not; INCONCLUSIVE otherwise. Honest prior (the idea label, never tuned):
    0.90 E-WHITE, 0.03 E-LEAD, 0.07 inconclusive. Falsification thresholds are
    fixed in falsification_conditions below.

    NO ATTACK, NO EXPONENT MOVED. The idea claims neither. Any E-LEAD outcome
    would be a candidate first computational handle in a local-torsion cell and,
    under AGENTS.md rule 12, must receive independent review-breakthrough review
    at max effort before any record states it as a result.

