# =============================================================================
# H-CSIDH-4c10a8 — specified from IDEA-20261006-df8024 (bytes copied
# unchanged from origin/design/ssi-2f5c3f-cartier, blob
# 8316f86a1ab5277b5f301b9fc133e9b62fac36fd). Question RQ-CSIDH-64343f.
# The prediction under test is the idea's own: among the five prime
# discriminants -103, -107, -127, -131, and -139, at least one form
# class group has two or more invariant factors strictly greater than
# 1. A finished census in which every certified group has exactly one
# such factor is the concrete negative. This record does not assert
# that any of the five groups is non-cyclic, and it states no security
# level.
# =============================================================================
hypothesis:
  id: H-CSIDH-4c10a8
  question_id: RQ-CSIDH-64343f
  source_idea_ids:
    - IDEA-20261006-df8024
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    At least one of five small CSIDH orders has a non-cyclic class group
  statement: >-
    Let S be the set of primes 103, 107, 127, 131, and 139. Each is
    congruent to 3 mod 4. For each p in S let O_p be the quadratic
    order Z[(1+sqrt(-p))/2] of discriminant -p, and let c(p) be the
    number of invariant factors of the form class group of O_p that
    are strictly greater than 1. A value c(p) is certified only when
    two independent enumerations return the same list. The prediction
    taken from IDEA-20261006-df8024 is that the set {p in S : c(p) >= 2}
    is non-empty. The concrete negative is a finished census in which
    every certified group has c(p) = 1. A p whose two lists disagree
    is unscored and is not counted as cyclic. No comparison of class
    numbers is the claim, and no CSIDH security level is stated.
  mechanism: >-
    The tracked object is the invariant-factor list of the class
    group of O_p, read from the set of reduced positive-definite
    binary quadratic forms of discriminant -p under Gauss composition.
    A second enumeration builds ideal classes in O_p and reduces them
    to the same form list. Agreement of the two lists is the
    certificate. The list is constant on forms, so composition does
    not change it. c(p) >= 2 means the odd part is not cyclic. c(p) = 1
    on every certified p means cyclicity happens to hold on this
    window. The class number, the product of the invariant factors,
    is recorded and then ignored.
  assumptions:
    - >-
      Each discriminant -p for p in S is fundamental, and the form
      class group is the class group of O_p.
    - >-
      Two enumerations that return different lists do not certify
      c(p). That p is unscored, not counted as cyclic, and a census
      that still needs that p in order to decide the set is not a
      finished negative.
    - >-
      No quantum oracle, gate set, or bit level enters the claim.
    - >-
      An even certified group order fails the genus-theory parity
      check and voids that p as an instrument failure. It is not
      scored as c(p) >= 2 and it is not scored as cyclic.
  proof_search_map:
    bottleneck: >-
      Whether any of the five certified invariant-factor lists has
      length at least 2 in the factors that are strictly greater
      than 1.
    baseline_embedding:
      parameter_slice: >-
        The question's structure input is a certified class-group
        shape at small CSIDH-like discriminants. No hidden-shift
        cost is reproduced.
      reproduction_check: >-
        Before any c(p) is scored, confirm each p in S is prime and
        congruent to 3 mod 4, and confirm that the same two
        enumerations on the non-fundamental discriminant -108 either
        disagree or are refused.
    observation_collision:
      observable: the invariant-factor list and the integer c(p)
      distinct_preimage_search: >-
        Many sets of forms share one list. The list is the object.
        Opposite forms (a, b, c) and (a, -b, c) are identified once.
        Counting either form twice changes the set composition sees
        and voids that p.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The invariant-factor list, obtained twice, once from forms
          and once from ideals.
        predicted_gain: >-
          A certified count of p in S with c(p) >= 2, which is either
          at least 1 or exactly 0.
    quantifier_order: >-
      There exists a p in S such that both enumerations return the
      same invariant-factor list and that list has at least two
      factors strictly greater than 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        A count in {0, 1, 2, 3, 4, 5} of certified non-cyclic groups
        inside this five-prime window. Not a Cohen-Lenstra
        probability and not a CSIDH-512 structure.
      nearby_object_control: >-
        Discriminant -108 is not fundamental. The two enumerations
        must disagree or be refused. Silent agreement on a
        fundamental-discriminant code path voids the run.
    proof_obligations:
      - claim: >-
          A non-empty set is a count of lists, not a quantum cost
          and not a class-number ranking.
        responsibility: scope
      - claim: >-
          An empty set closes only these five discriminants.
        responsibility: scope
    not_applicable_reason: >-
      This is a finite count of invariant-factor lengths. It does
      not propose a theorem, a bound on a quantum cost, a
      certificate beyond the two enumerations, a reduction, or a
      closure of Cohen-Lenstra. The map audits that count only.
  rerandomization: >-
    No re-randomizing walk is used. The window is these five named
    primes, every one of them, not a random draw. Nothing pulls a
    hidden shift back to an input instance.
  asymptotic_claim:
    problem: >-
      certified class-group shape for five CSIDH-like orders
    prior_best: >-
      generic discrete log in a prime-order group at exponent 1/2
      (KR-RHO-13bf67). That group is not this class group, and this
      hypothesis does not attack it.
    time_exponent: '1/2, unchanged; no hidden-shift exponent is stated'
    memory_exponent: >-
      unchanged. The output is five short lists of integers.
    hidden_cofactor: >-
      None in an exponent. The gap between these five primes and a
      cryptographic discriminant is not an o(1) term.
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against every published hidden-shift
      exponent is 1. claim_kind is filled so the non-claim is
      explicit. An integer in 0..5 is not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        Imitating Cohen-Lenstra, the odd part of the class group of
        a fundamental discriminant -p is distributed as a random
        finite abelian odd-order group with mass proportional to
        1/|Aut(G)|. Under that measure the probability of a
        non-cyclic group is strictly positive, so a window of five
        primes can contain one. The quantity sampled is c(p) on
        these five primes, a complete window, not a random draw.
      random_model_justification: >-
        The Aut-weight is the recalled Cohen-Lenstra measure on
        odd-order abelian groups. It is not used as a numerical
        prediction of the count. The comparison is the observed
        non-cyclic count against 1. The cyclic mass pi is computed
        from the Aut-weights of all odd-order groups of order at
        most the largest certified class number in the window, and
        the mean 5*(1-pi) is recorded beside the count. Neither
        number changes the success row.
      supporting_results: []
      validation_experiment_ids:
        - EXP-CSIDH-d5b049
      falsification_condition: >-
        All five certified groups have c(p) = 1. That empty set is
        the negative observation for the claim. It does not refute
        the Cohen-Lenstra measure on any larger set of discriminants.
  structural_ingredients:
    - description: >-
        The note estimates how often a prime l fails to divide the
        class number of an imaginary quadratic field, and says that
        estimate matches Cohen-Lenstra in the indivisibility
        direction. It does not compute invariant factors for these
        five discriminants.
      citation: KN-LIT-508
      provenance: kb
      verified_by: >-
        design session opened knowledge/literature/KN-LIT-508.md
        on 2026-10-06. The file relays an arXiv abstract
        (1612.04443) and marks the paper itself as not independently
        verified. Used only as the adjacent indivisibility count,
        not as a source of these five lists.
      role: adjacent statistic, not the invariant-factor claim
    - description: >-
        A random finite abelian odd-order group is weighted
        proportionally to 1 over the order of its automorphism
        group. Not opened as a primary text in this session.
      citation: >-
        Cohen-Lenstra heuristics for the odd part of imaginary
        quadratic class groups
      provenance: recalled
      verified_by: null
      role: random-model pointer for HEUR-1, not support
    - description: >-
        For a prime discriminant -p with p congruent to 3 mod 4,
        the 2-rank is 0, so the class group has odd order. Not
        opened as a primary text. Used only as a certificate check.
      citation: >-
        genus theory for the 2-rank of a prime discriminant -p
      provenance: recalled
      verified_by: null
      role: parity check, not the claim
    - description: >-
        A generic algorithm on a prime-order group needs Omega of
        the square root of the group order. This census is not a
        generic discrete-logarithm algorithm.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
      role: unchanged generic exponent, different problem
    - description: >-
        Precomputation can move an online discrete logarithm to
        about l^{1/3} after an l^{2/3} table. This census builds no
        distinguished-point table.
      citation: KR-RHO-ea34b8
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-ea34b8.yaml
        on 2026-10-06
      role: fence around preprocessing tradeoffs
    - description: >-
        An isogeny walk does not find a weaker curve. This census
        does not walk from a public curve to a secret curve.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
      role: fence around isogeny-path readings
  reduction_chain:
    core_problem: >-
      toy count of non-cyclic class groups on five named discriminants
    corollaries: []
  predictions:
    - metric: number of p in S with c(p) at least 2
      direction: higher
      minimum_effect: at least 1
  test_boundary:
    instances:
      - discriminant -103
      - discriminant -107
      - discriminant -127
      - discriminant -131
      - discriminant -139
    parameters:
      primes: [103, 107, 127, 131, 139]
      nonfundamental_control: -108
      certificate: two enumerations agree
    implementation: >-
      Enumerate reduced positive-definite binary quadratic forms and
      compute invariant factors under Gauss composition. Repeat with
      ideal classes in O_p reduced to the same form list. Score c(p)
      only on agreement. No discrete-log search and no quantum
      circuit.
    budget:
      census: the five named primes
      maximum_runs: 1
  falsification_conditions:
    - >-
      All five certified groups have c(p) = 1. That empty set is the
      negative observation.
    - A certified group has even order.
    - The two enumerations disagree on any p that is then used in the count.
  interpretation_limits:
    - >-
      The count is not a Cohen-Lenstra probability and is not a
      CSIDH-512 structure.
    - >-
      Cyclicity does not decide a Kuperberg cost. The question's
      quantum models are not run.
    - >-
      An empty set closes only these five discriminants.
    - >-
      An unscored p, one whose lists disagree, is not evidence that
      the group is cyclic.
    - >-
      No exponent moves. Five short lists are not a runtime.
