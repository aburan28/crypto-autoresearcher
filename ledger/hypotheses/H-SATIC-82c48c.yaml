    gaps 1 and 1 sum to 2. The written speed cap is 4 and the written
    reproduction tolerance is 2, so their ratio is 2. The base-2
    logarithm of 4 is 2, and 4 exceeds 2 by 2. The base-2 logarithm of
    the tolerance 2 is 1, so the two bit allowances differ by 1.
