hypothesis:
  id: H-INCB-dc5010
  question_id: RQ-INCB-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-490c34
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. The three toy primes of EXP-INCB-001, the same factor-base x-sets and
    the same random x-subset null already implemented there, plus two further
    primes added for the pre-registered sign test. Claim tier toy. NO ATTACK, NO
    EXPONENT, NO COST CLAIM.
    THE CLAIM. The 15 to 35 percent SHORTFALL of EC collinear-triple richness
    below its own uniform-x first-moment prediction - consistent in sign in every
    fittable cell of EV-INCB-001, within about 2 SE per cell, recorded and never
    explained - is MECHANICAL. Specifically, the distribution of x(-P-Q) over
    lifting x-pairs is non-uniform on the x-set in the manner forced by
    quadratic-residuosity fibre-size weighting, and propagating the measured
    distribution into the first-moment triple-count prediction accounts for the
    whole shortfall, leaving no residual that requires a curve-specific account.
    WHY THIS IS WORTH DECIDING AND WHY THE ONE-SIDED GATE MISSED IT.
    EV-INCB-001's predeclared condition asked only whether EC collinear-triple
    richness EXCEEDS the random null (z above 3 at all three sizes), inheriting
    KN-TECH-016's framing of the interesting outcome as a measured curve-specific
    EXCESS. A one-sided gate cannot see a deficit, so a systematic shortfall -
    non-generic in exactly the sense the technique cares about - fell outside the
    decision entirely. This hypothesis takes the deficit as its object.
    THE EXPECTED OUTCOME IS THAT THE CLAIM IS TRUE, which means the deliverable is
    a CORRECTED BASELINE and the uniform-x first moment is superseded. The parent
    proposal's honest prior is 0.7 for that and 0.2 for a surviving residual. A
    residual that survives correction and replicates is a measured non-generic
    property of EC factor-base geometry and must be red-teamed before any use.

  mechanism: >-
    The map (P,Q) -> x(-P-Q) is many-to-one, and the fibre over each x value has a
    size that varies with quadratic residuosity - an x with a rational y lifts to
    two points, one with y equal to 0 lifts to one, and one with no rational y
    lifts to none. So the induced distribution on the x-set is not uniform, and
    its first-order departure from uniform is computable in closed form from the
    residuosity weighting alone, with no reference to any particular curve.
    EV-INCB-001's collinear-triple prediction used a UNIFORM-x first moment. If
    the true induced law is the residuosity-weighted one, the predicted triple
    count is systematically too high, which is a deficit of exactly the sign
    observed. The size of that deficit is not asserted here - it is computed from
    the measured histogram and propagated into the first-moment formula, and
    whether it accounts for 15 to 35 percent is precisely what the run decides.
    The instrument is known to report uniformity when uniformity holds -
    EV-INCB-001's random x-subset null matched the exact finite-field prediction
    to at most 0.69 SE - which is what makes a measured non-uniformity readable
    rather than a property of the test.
    The statistical care that the design requires is dictated by the data. The
    deficit is within about 2 SE per cell; only its CONSISTENCY IN SIGN across
    cells makes it interesting. The analysis is therefore a pre-registered SIGN
    TEST across cells, never a per-cell significance claim, and two further primes
    are added before the sign test is read so that the test has cells to run on.

  assumptions:
  - >-
    EXP-INCB-001's data pipeline exposes the lifting pairs, or the same primes can
    be re-run cheaply. If neither holds, that is an instrumentation cost.
  - >-
    The uniform-x first-moment prediction used in EV-INCB-001 can be recomputed
    exactly for comparison, so that the corrected prediction differs from it only
    by the substituted distribution and not by an unrelated reimplementation.
  - >-
    Fit conditioning is checked before any fit, since fit conditioning caused one
    spurious crossing in the original record.

  proof_search_map:
    not_applicable_reason: >-
      Empirical measurement plus one closed-form first-moment computation. No
      theorem, asymptotic bound, reduction or closure argument is proposed, and no
      cost claim is made. The closed-form residuosity weighting is a forced-value
      control computed from the definition of the lift, not a claimed theorem, and
      its derivation is a declared proof obligation on the executor rather than an
      appeal to authority. If a surviving residual were later proposed as a
      curve-specific structural property with consequences, THAT proposal is
      proof-oriented and requires its own map.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []

  asymptotic_claim: null

  heuristic_assumptions:
  - id: HEUR-INCD-1
    formal_statement: >-
      The sign-consistency of the first-moment deficit across the fittable cells is
      not itself a multiple-testing artifact - i.e. under the null that the
      uniform-x first moment is correct, the probability of observing the same sign
      in every fittable cell is the binomial tail 2^{-c} for c cells, and c is
      large enough for that tail to be small.
    random_model_justification: >-
      Under the null, each cell's deficit is a mean-zero fluctuation whose sign is
      an independent fair coin, so all-same-sign has probability 2^{1-c}. The
      justification is exactly the independence of cells across distinct primes,
      which the design enforces by adding primes rather than adding cells at the
      same prime.
    supporting_results: []
    validation_experiment_ids:
    - EXP-INCB-9c5974
    falsification_condition: >-
      Fewer than 5 independent fittable cells are available, in which case the sign
      test has no power at any threshold and the run reports the deficit as
      unreadable rather than as significant or insignificant. That is why two
      further primes are added BEFORE the sign test is read.

  structural_ingredients:
  - description: >-
      Incidence-geometry bounds on collinear triples in a point set and the
      first-moment count under a stated distribution on the coordinate set.
    citation: KN-TECH-016
    provenance: internal
    verified_by: >-
      In-repo technique entry, read directly. Cited by no ledger or experiment
      record before this one, and its framing of the interesting outcome as a
      curve-specific EXCESS is the source of the one-sided gate this hypothesis
      objects to.
    role: the baseline whose distributional input is corrected
  - description: >-
      The closed-form quadratic-residuosity fibre-size weighting on the x-set of an
      elliptic curve over F_p, giving the first-order non-uniformity of x(-P-Q)
      over lifting pairs.
    citation: null
    provenance: internal
    verified_by: >-
      Elementary and re-derivable from the definition of the lift; it is a declared
      proof obligation for the executor to derive symbolically and check against
      the measured histogram before anything curve-specific is invoked. Not an
      appeal to any citation.
    role: forced-value control and the proposed explanation of the deficit

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: chi-squared statistic of the x(-P-Q) histogram against uniform on the x-set
    direction: higher
    minimum_effect: >-
      A departure large enough to account for a 15 to 35 percent first-moment
      shortfall, computed as an IMPLIED MOMENT CHANGE propagated into the
      triple-count formula rather than asserted from the chi-squared value itself.
  - metric: >-
      residual deficit after substituting the measured distribution into the
      first-moment prediction
    direction: lower
    minimum_effect: >-
      A residual whose magnitude is below the per-cell standard error at every
      prime, and whose sign is no longer consistent across cells under the
      pre-registered sign test.
  - metric: chi-squared of the measured histogram against the closed-form residuosity weighting
    direction: lower
    minimum_effect: >-
      Consistency with the closed-form weighting, which is the FORCED VALUE. A
      measured histogram inconsistent with the closed form means something beyond
      residuosity is present and the closed form is not the whole story.

  test_boundary:
    instances:
    - >-
      The three toy primes of EXP-INCB-001, plus two further primes added for the
      sign test, with the same curve family, the same factor-base x-sets and the
      same random x-subset null.
    parameters:
      primes: 'the three of EXP-INCB-001 plus two further primes, all fixed at Stage 0'
      histogram: 'x(-P-Q) over ALL lifting pairs (P,Q) at each prime, binned on the x-set'
      comparisons: 'against uniform on the x-set, and against the closed-form quadratic-residuosity weighting'
      analysis: 'pre-registered SIGN TEST across cells; never a per-cell significance claim'
    implementation: >-
      The pipeline of experiments/EXP-INCB-001, reusing its random x-subset null
      unchanged, extended to emit the x(-P-Q) histogram over lifting pairs and to
      propagate a supplied distribution into the first-moment triple-count formula.
    budget:
      wall_clock_seconds_per_run: 900
      total_cpu_hours: 1.0
      maximum_memory_gb: 8

  distinguishable_outcomes:
  - outcome: >-
      The corrected first moment, computed by substituting the measured x(-P-Q)
      distribution, accounts for the full 15 to 35 percent shortfall at every
      prime, and the residual's sign is no longer consistent across cells.
    means: >-
      The deficit is MECHANICAL, produced by the lifting map's residuosity
      weighting. The uniform-x baseline is wrong and is superseded by the corrected
      one, and nothing curve-specific remains. This is the expected outcome, it is
      a correction to the program's own baseline rather than a discovery, and it is
      the deliverable.
  - outcome: >-
      A residual shortfall survives the correction, keeps the same sign across all
      cells including the two new primes, and passes the pre-registered sign test.
    means: >-
      A measured non-generic property of EC factor-base geometry at toy scale - the
      curve's collinear-triple richness is below what its own coordinate
      distribution predicts. It is NOT an attack and NOT a cost statement. It must
      be red-teamed and replicated before any use, and much of the program's cost
      accounting rests on the equidistribution assumptions KN-TECH-016 underwrites,
      so it would matter for that reason and no other.
  - outcome: >-
      The random x-subset null also shows the deficit.
    means: >-
      The deficit is an instrument property, not a property of the curve. No
      reading of the signal arm is admissible and the deliverable is the corrected
      understanding of the instrument.
  - outcome: >-
      The measured histogram is inconsistent with the closed-form residuosity
      weighting.
    means: >-
      Something beyond residuosity shapes the induced distribution. The forced
      value did not fire, so the mechanism proposed here is incomplete - the
      corrected baseline may still be right empirically but its explanation is not,
      and that distinction must be preserved in any write-up.
  - outcome: >-
      Fewer than 5 independent fittable cells are obtained.
    means: >-
      The sign test has no power. The deficit is reported as UNREADABLE at this
      budget, which is neither support nor refutation, and the correct next step is
      more primes rather than a stronger claim.

  falsification_conditions:
  - >-
    The corrected first moment accounts for the full 15 to 35 percent shortfall and
    the residual's sign is no longer consistent across cells - the deficit is
    mechanical, the uniform-x baseline is superseded, and the curve-specific
    reading is dead.
  - >-
    The random x-subset null shows the same deficit - it is an instrument property.
  - >-
    The measured x(-P-Q) histogram is statistically indistinguishable from uniform
    at every prime, which would mean the named candidate cause is absent and the
    deficit has no explanation from this direction at all.
  - >-
    Fewer than 5 independent fittable cells are obtained, in which case the sign
    test is unreadable and no conclusion in either direction may be recorded.

  prior_evidence_refs:
  - EV-INCB-001
  - EXP-INCB-001
  - H-INCB-001
  - KN-TECH-016
  - DEC-20260804-1846e9

  interpretation_limits:
  - >-
    Toy scale. Dominated by Pollard rho at exponent 1/2 regardless; nothing here is
    an exponent claim or a cost claim.
  - >-
    A confirmed departure from the uniform-x first moment is a statement about the
    BASELINE, not about attack cost.
  - >-
    The deficit is within about 2 SE per cell. Only its consistency in sign across
    cells is interesting, so no per-cell significance claim may be made from this
    design in either direction.
  - >-
    Small-prime effects dominate at the smallest cell; results are reported per
    prime and never pooled.
  - >-
    This hypothesis does not dispute EV-INCB-001's controlled negative on its
    intended gate. That gate was one-sided; this hypothesis takes the other side.
