      j_invariant UNMODIFIED. No full isogeny-class enumeration is needed
      anywhere in this design (unlike EXP-ICINV-4d33aa): both regimes
      measure single curves of a stated CM type directly, not
      within-class variance, so class_census is not on this contract's
      critical path.
