      New number-field/CM arithmetic module (norm form, unit group, shell
      enumeration, lambda reduction) and a new mpmath-based canonical
      height module (local-height decomposition over Q, at least 12
      significant digits), both genuinely new: harness/toycurve.py provides
      only F_p arithmetic and has no number-field or height code today.
      Reuses harness/isogeny_class.py's trace_of_frobenius,
