  falsification_conditions:
    - >-
      F1 (GLOBAL, kills the partition, not necessarily either mechanism's
      arithmetic). Stage-0 integer search finds alpha in O \ Z with
      N(alpha) < |D_E|/4. Presumptively an implementation defect in the
      search (Lemma 1's proof is three lines and checkable by inspection);
      if independently reproduced via a second, differently-written norm
      computation, escalates to AGENTS.md rule 12 review-breakthrough
      before any record treats it as a genuine refutation.
    - >-
      F2 (C1 instrument). Stage-1 finds hhat(alpha*P) != N(alpha)*hhat(P)
      beyond numerical tolerance on a known-answer case. Instrument
      failure; nothing about C1 is reported.
    - >-
      F3 (C1 slope). The alpha_min-corrected ratio_of_minima does not track
      sqrt(|D_E|) with slope 0.5. Given the STEP 3 correction is already
      applied, this indicates either a remaining height-implementation
      defect (default presumption) or, if replicated with an independently
      verified-correct height implementation, a genuine anomaly in Lemma 2
      requiring review-breakthrough escalation (AGENTS.md rule 12) before
      any record calls it a finding.
    - >-
      F4 (C1 reopen). The reachable-k-count ratio exceeds 1 in the generic
      regime. C1 is refuted; this is the one outcome pre-registered to
      REOPEN the lane, triggers GOAL-ENDO-001 pause condition P3, and
      requires review-breakthrough before any record states the excess.
    - >-
      F5 (C1 null failure). The matched non-CM null reproduces the CM
      ratio's growth, or the small-|D_E| positive control (D_0 in
      {-3,-4,-7,-8,-11}) fails to show the O(1) escape. Instrument cannot
      see what it needs to see; no C1 verdict, positive or negative, may be
      reported (AGENTS.md rule 5).
    - >-
      F6 (C2 shell). |S(C_0)| deviates systematically from
      2*pi*C_0^2/sqrt(|D_E|) beyond the stated tolerance. Implementation
      defect in shell enumeration; part (B) of C2 is withdrawn pending
      repair.
    - >-
      F7 (C2 tautology hard gate). The tautology check fails on any
      sampled point. Instrument failure under AGENTS.md rule 5; nothing in
      C2 is reported until repaired.
    - >-
      F8 (C2 escape absent, safe direction). lambda(alpha) = 0 for every
      tested non-unit shell element, OR reachable_residue_gain < 1 at
      |D_E| = 3. The escape is entirely tautological or illusory even as a
      constant; C2 is refuted in the stronger-negative direction and C1's
      theorem is reported as effectively covering the whole domain.
    - >-
      F9 (C2 escape excessive, dangerous direction). reachable_residue_gain
      grows faster than C_0^2. The counting is wrong in the attacker's
      favour; C2 is superseded, this lane reopens, GOAL-ENDO-001 pause
      condition P3 fires, and review-breakthrough is required before any
      record states the excess.
    - >-
      F10 (C2 threshold insensitivity). The threshold control shows the
      same gain on both sides of |D_E| = 4*C_0^2. The measurement is not
      sensitive to the load-bearing structure; no C2 verdict, positive or
      negative, may be reported from it.
    - >-
      F11 (CTRL, voids everything). Any required arm's covering-fraction
      decay slope falls outside -1.00 +/- 0.15, or any of the five named
      nulls misfires, or planted-positive recovery is below 100%, or
      planted-negative false-positive rate is above 0%. No C1 or C2
      verdict, in either direction, may be read from a run whose
      calibration certificate did not pass (AGENTS.md rule 5; inventor
      protocol section 3).

  interpretation_limits:
    - >-
      claim_tier toy throughout, no downstream citation may raise it. Every
      prime and discriminant is produced by the frozen generation rules in
      test_boundary; nothing here is a statement about any cryptographic
      parameter, including the one deployed CM class (secp256k1, j=0)
      named for scope purposes only.
    - >-
      sota_delta is ZERO. Neither C1's nor C2's best-case predicted outcome
      is competitive with parallel Pollard rho (0.886*sqrt(N),
      KN-TECH-001/KN-TECH-006) or its automorphism-discounted variant on
      exactly the small-|D_E| curves C2's own gain lives on (KN-TECH-018).
      Neither regime's own instance-count formula charges the
      p^{1+o(1)} lift-construction cost (EXP-CANL-108f26) or the
      Theta(N^{2/r}) coordinate size (EXP-CANL-8687b3); both are hidden
      overhead this record discloses rather than absorbs, per this
      program's asymptotic-form-honesty rule.
    - >-
      A CONFIRMED C1 does not certify anything about non-canonical lifts.
      ECFG-P1543-R1 already shows a non-canonical point lift does not exist
      as a homomorphism; C1's negative is strictly stronger than needed on
      that count.
    - >-
      A CONFIRMED C2 is a statement about COEFFICIENT COUNTS, not about
      whether any point actually lifts to a prescribed reduction. Lifting
      itself is owned by IDEA-20260807-6533fd and IDEA-20260807-cfe576; if
      those close, C2's gain is unrealisable regardless of its measured
      size, and "CM helps by Theta(C_0)" must never be quoted without "and
      the instance count is still N^{1-o(1)}, against rho's N^{1/2}".
    - >-
      A passing CTRL certificate does not validate either regime's
      conclusion; it only removes one class of artifact (small-p
      abundance). A failing certificate blocks every conclusion drawn from
      the same run's pipeline, in both directions.
    - >-
      Neither claim is a lower bound on ECDLP, and neither is a closure of
      lifting as a whole. Each closes one specific hope -- that the
      O-module structure of the canonical lift supplies short vectors, in
      the regime it governs -- with a named obstruction (C1) or a named,
      bounded, unrealised-without-lifting gain (C2).

