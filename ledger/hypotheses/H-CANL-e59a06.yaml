  statement: >-
    SCOPE. Toy ordinary prime-field short-Weierstrass curves with
    Serre-Tate canonical lifts; CM curves with small fundamental discriminant
    including j=0 and j=1728; matched random-curve and synthetic-lattice
    null objects; primes generated by a frozen deterministic rule (see
    test_boundary) rather than hand-picked. CLAIM TIER toy throughout. NO
    ATTACK IS MOUNTED and none is claimed at any scale.

    THE DICHOTOMY. RQ-CANL-63098f's decision_target is a single quantity:
    the JKSST canonical-height budget that bounds a Xedni-style relation's
    coefficients to N(alpha) <= C_0^2 for an absolute constant C_0 at fixed
    arity, giving instance count I_Z(r) = N/(2C_0+1)^{r+1} = N^{1-o(1)}. By
    Lemma 1 (proved in mechanism STEP 2, elementary, three lines), every
    alpha in O \ Z has N(alpha) >= |D_E|/4, where O = End(canonical lift) has
    discriminant D_E. That single inequality partitions EVERY ordinary curve
    into exactly two regimes, exhaustive and disjoint by construction:

    C1 (large |D_E|, |D_E| > 4*C_0^2 -- the GENERIC regime, source
    IDEA-20260807-fd5a24). The height window {alpha in O : N(alpha) <= C_0^2}
    equals {a in Z : |a| <= C_0} exactly: CM contributes no reachable
    off-Z coefficient. CM still halves the number of points that must be
    lifted (r_Z+1 -> r_Z/2+1, since Z-dependence needs r_Z+1 points but
    O-dependence needs only r_O+1 = r_Z/2+1), but the reachable-k count
    becomes (2C_0+1)^{r_Z/2+1} < (2C_0+1)^{r_Z+1}: CM makes the instance
    count WORSE by exactly (2C_0+1)^{r_Z/2} relative to the Z-case at
    matched Z-rank. FALSIFIABLE CLAIM C1: at |D_E| > 4*C_0^2, the
    reachable-k-count ratio (CM-generic / Z-case-at-matched-rank) is <= 1,
    and the instance-count exponent stays 1 (excludes 1/2).

    C2 (small |D_E|, |D_E| <= 4*C_0^2 -- the ESCAPE regime, source
    IDEA-20260807-11b93d; contains j=0 [D_0=-3], j=1728 [D_0=-4], and
    secp256k1's own CM class -- NOT a curiosity, the regime a deployed curve
    sits in). The height window genuinely enlarges to
    ~2*pi*C_0^2/sqrt(|D_E|) elements per slot. The norm-1 part of that
    enlargement is exactly the unit group O^* (order 2, 4, or 6) and its
    relations are cyclotomic tautologies reducing to 0=0 mod N -- they carry
    zero information about the discrete log, by construction. What survives
    after removing units is Theta(C_0) non-unit elements per slot, each
    giving a genuinely new, non-tautological reduced coefficient. FALSIFIABLE
    CLAIM C2: after subtracting the forced unit tautology, the surviving
    reachable-residue-count gain (CM-shell / Z-case-at-matched-rank) is a
    genuine constant in [0.5*C_0, 4*C_0], and the instance-count exponent
    STILL stays 1 (excludes 1/2) -- CM helps by a bounded constant factor and
    never touches the exponent.

    C1 and C2 are ONE exhaustive dichotomy, not two competing alternatives:
    IDEA-20260807-11b93d's own text states "neither is complete without the
    other." Carrying only C1 would leave every deployed-curve-adjacent CM
    class (j=0, j=1728, secp256k1's class) untested, which is exactly the
    premature closure docs/inventor-protocol.md forbids; carrying only C2
    would leave the generic case -- the overwhelming majority of ordinary
    curves under the semicircle trace law -- unadjudicated.

    THE PRE-REGISTERED PREDICTED OUTCOME, STATED PLAINLY AND NOT DRESSED UP:
    CM structure on the Serre-Tate canonical lift changes the CONSTANT in
    JKSST's instance-count formula -- hurting by (2C_0+1)^{r_Z/2} at large
    |D_E| (C1) and helping by a bounded Theta(C_0) at small |D_E| (C2) -- but
    in BOTH regimes the N-exponent of the instance count stays exactly 1,
    against Pollard rho's automorphism-discounted exponent 1/2 (KN-TECH-018).
    This is an honest, modest, negative-leaning prediction: even in the best
    case for an attacker (C2, small |D_E|), the mechanism remains
    N^{1-o(1)}, strictly dominated by rho at N^{1/2-o(1)} by a factor
    N^{1/2-o(1)}. scale_relevance.tier is toy and sota_delta is ZERO on
    every tested axis; no run under this hypothesis's paired experiment
    claims or could claim a speedup. dominated_by is NOT null: parallel
    Pollard rho with distinguished points (0.886*sqrt(N), O(1) memory,
    KN-TECH-001/KN-TECH-006) dominates on time in both regimes; the
    automorphism-discounted variant (KN-TECH-018) dominates by the same
    factor times sqrt(|Aut|) on exactly the small-|D_E| curves where C2's
    own gain lives, which is the same irony IDEA-20260807-11b93d's own text
    names.

    THE MANDATORY CONTROL (IDEA-20260807-761a8c). Both regime claims are
    read only after a covering-fraction decay-slope calibration certificate
    passes: at toy p, low-height point coverage is dominated by small-integer
    abundance (predicted ~4.5% at p=101 for a rank-2 curve), which can
    imitate a "CM helps" signal unless the slope of log(covering fraction)
    against log(p) is measured at exactly -1 across >= 3 decades, on CM and
    non-CM arms alike, with five named nulls and a two-directional
    planted-signal check. This record and its paired experiment treat that
    calibration as a blocking gate for BOTH C1 and C2, not an optional
    footnote.

  mechanism: >-
    STEP 0 -- THE DECIDED QUANTITY, RESTATED WITH ITS PROVENANCE. The
    program's own audit ECFG-P1543-R1 (ledger/FINDING-PF-IC-001.md, lines
    2061+) reconstructs "the Xedni C_0/p theorem... under Lang, its
    discriminant-height comparison, and fixed arity 2 <= r <= 9": with r+1
    points lifted onto a global curve of Mordell-Weil rank r, the points are
    automatically Z-dependent, the dependence's coefficients are bounded by
    C_0, and I_Z(r) = N/(2C_0+1)^{r+1} = N^{1-o(1)}. Any CM proposal in this
    lane is judged by what it does to I. This is relayed, not re-derived;
    C_0's exact value and the theorem's conditionality are carried as
    [citation, to be re-verified] throughout, per assumptions below.

    STEP 1 -- WHAT CM GIVES, REGARDLESS OF REGIME (common to C1 and C2).
    Serre-Tate/Deuring: an ordinary E/F_p with O := End_{F_p}(E) has a
    canonical lift E~ with End(E~) = O, over the ring class field H of O.
    E~(H) is an O-module, not merely a Z-module. If E~(H)/tors is a
    projective O-module of O-rank r_O, its Z-rank is r_Z = 2*r_O
    (automatic for maximal O; flagged open for non-maximal O, f_E > 1, see
    assumptions). Consequently m points are O-dependent as soon as
    m >= r_O+1 = r_Z/2+1, half the Z-only threshold r_Z+1. This POINT-COUNT
    halving is unconditional and identical in both regimes; it is NOT where
    the dichotomy lives.

    STEP 2 -- THE DICHOTOMY'S FULCRUM: LEMMA 1 (norm-form gap; elementary,
    complete, zero compute). Let O = Z[w], w = (D_E + sqrt(D_E))/2,
    w^2 - D_E*w + (D_E^2-D_E)/4 = 0. For alpha = a + b*w, a,b in Z, b != 0:
        alpha = (a + b*D_E/2) + (b/2)*sqrt(D_E),
        N(alpha) = (a + b*D_E/2)^2 + (b^2/4)*|D_E| >= (b^2/4)*|D_E| >=
        |D_E|/4,
    with equality iff |b|=1 and a = -b*D_E/2 (D_E even). QED, checkable by
    inspection. This single inequality is the ENTIRE fulcrum: it fixes
    exactly which |D_E| put the height window {N(alpha)<=C_0^2, alpha not in
    Z} at empty (C1) versus non-empty (C2), and it is the object this
    record's proof_search_map treats as the bottleneck.

    STEP 3 -- THE MEASUREMENT, CORRECTED. The quantity that must track
    |D_E| is hhat(alpha_min * P~)/hhat(P~) where alpha_min is the
    Lemma-1-MINIMIZING element (b=1, a* = round(-D_E/2)), NOT the raw
    generator w (a=0, b=1) that IDEA-20260807-fd5a24's own metric literally
    names. N(alpha_min) = |D_E|/4 exactly (D_E even) or (|D_E|+1)/4 (D_E
    odd), matching Lemma 1's equality case; N(w) itself is
    (D_E/2)^2+|D_E|/4 ~ D_E^2/4, a different and much faster-growing
    quantity. Every "ratio_of_minima" / "companion-height ratio" measurement
    in this record and its paired experiment (including the null-object
    controls and CTRL's N3 null, which name the identical quantity under a
    different label) uses alpha_min. With that correction, Lemma 2 (standard,
    functorial quadraticity: hhat(alpha*P) = deg(alpha)*hhat(P) = N(alpha)*
    hhat(P) for alpha in End) gives hhat(alpha_min P~) >= (|D_E|/4)*hhat(P~),
    so ratio_of_minima = sqrt(hhat(alpha_min P~)/hhat(P~)) >= sqrt(|D_E|)/2,
    tracking |D_E| with log-log slope 0.5 -- the prediction now matches what
    is actually being measured.

    STEP 4 -- REGIME C1 (|D_E| > 4*C_0^2). By Lemma 1, {alpha in O :
    N(alpha) <= C_0^2} = {a in Z : |a| <= C_0} exactly, size 2*C_0+1,
    IDENTICAL to the Z-case. The O-relation's coefficient set gains nothing.
    Reachable-k count: (2*C_0+1)^{r_O+1} = (2*C_0+1)^{r_Z/2+1}, strictly
    smaller than the Z-case (2*C_0+1)^{r_Z+1} at the same Z-rank, by exactly
    (2*C_0+1)^{r_Z/2}. I_O(C1) = I_Z(r_Z) * (2*C_0+1)^{r_Z/2}: CM makes the
    generic-regime instance count WORSE by that constant, while making each
    instance cheaper to attempt (half the points to lift). Both facts must
    be reported together.

    STEP 5 -- REGIME C2 (|D_E| <= 4*C_0^2). O is a lattice in C of covolume
    sqrt(|D_E|)/2 (basis-independent geometric fact). The shell
    S(C_0) = {alpha in O : N(alpha) <= C_0^2} has size
    2*pi*C_0^2/sqrt(|D_E|) + O(C_0*|D_E|^{-1/4}+1) (disc-area over
    covolume). The norm-1 sub-shell is exactly O^*, order 2/4/6; its
    relations reduce, via P~ + zeta*P~ + zeta^2*P~ + ... = O (the minimal
    polynomial of the unit) and lambda(zeta) =: mu satisfying the same
    minimal polynomial mod N, to a scalar identity carrying zero
    information about any discrete log, for any P, any curve, any N > the
    unit order. The surviving non-unit shell has size
    Theta(C_0^2) per slot (2*pi*C_0^2/sqrt(|D_E|) - |O^*|), each element
    giving lambda(alpha) = a+b*mu, a genuinely new, non-tautological
    reduced coefficient (verified directly for alpha=1-zeta_3 at D_E=-3:
    lambda(alpha) = 1-mu != 0 mod N for N>3). Reachable-residue count gains
    Theta(C_0) relative to the Z-case at matched Z-rank. I_O(C2) =
    N/Theta(C_0^{r_Z+2}) = N^{1-o(1)}, exponent still 1.

    STEP 6 -- WHY THE EXPONENT NEVER MOVES, IN EITHER REGIME. Every
    reachable-count formula derived in STEP 4 and STEP 5 is a function of
    C_0 and r_Z alone, both O(1) at "fixed arity 2 <= r <= 9"
    (ECFG-P1543-R1). So I is Theta(N) up to a regime-dependent constant in
    both cases: exponent 1 versus rho's automorphism-discounted 1/2
    (KN-TECH-018). "CM changes the constant, not the exponent" is therefore
    the single answer covering the ENTIRE range of |D_E|, not a
    regime-specific footnote -- which is exactly why C1 and C2 must be
    tested together to make this claim at all, rather than only over half
    the domain.

    STEP 7 -- THE CALIBRATION CONTROL AND WHY IT GATES BOTH REGIMES
    (IDEA-20260807-761a8c). At the toy p this program can execute, a naive
    lift's low-height point coverage rho_lift ~ (log p)^{r/2}/(Reg^{1/2}*p)
    falls by seven orders of magnitude between p=101 and p~2^30. A "CM
    helps" signal measured at one small p, without controlling for this,
    cannot be distinguished from pure small-integer abundance. The decay
    law log(rho_lift) has a FORCED slope of exactly -1 against log(p),
    independent of rank, regulator, or CM -- a strong, rank-independent
    calibration test. Both C1's and C2's own verdicts are read only after
    this slope is measured at -1.00 +/- 0.15 on every required arm
    including five named nulls (matched non-CM curve; random lattice with
    matched regulator; synthetic order-2/3 O-action; k-resample invariance;
    rank-0 torsion-only arm) and both directions of a planted-signal check
    (100% recovery of a planted lift; 0% false positive on an unliftable
    target) pass.

    STEP 8 -- WHAT WOULD FALSIFY EACH CLAIM, MAPPED FROM THE CHEAP STAGE-0
    GATES. C1 collapses if the reachable-k-count ratio EXCEEDS 1 in the
    generic regime (CM would then genuinely help even at large |D_E|,
    reopening the lane -- pre-registered as the one outcome that does so).
    C2 collapses in the safe direction if the surviving gain is < 1 at
    |D_E|=3 (the escape is illusory even as a constant) or if
    lambda(alpha)=0 for every tested non-unit shell element (the escape is
    entirely tautological); C2 collapses in the DANGEROUS direction, and
    triggers GOAL-ENDO-001 pause condition P3 plus AGENTS.md rule 12
    review-breakthrough escalation, if the gain grows faster than C_0^2
    (the counting is wrong in the attacker's favour). Both regimes' very
    partition collapses to PREMISE-FAILED-BOUNDARY if Lemma 1's own
    integer-search gate finds a counterexample -- overwhelmingly likely to
    indicate an implementation defect in the search given the proof's
    three-line elementary character, but treated with the same
    refutation-artifact discipline as any other adverse result
    (docs/claims-and-verification.md) rather than dismissed by assertion.

  assumptions:
    - >-
      [fact, standard, recalled not re-derived] Serre-Tate/Deuring: an
      ordinary E/F_p has a canonical lift E~ with End(E~) = End_{F_p}(E) = O,
      defined over the ring class field of O. If false, this lane and both
      EXP-CANL-1064e0's and EXP-CANL-108f26's own scopes have no object;
      this record does not re-litigate that question and cites
      ECFG-P1543-R0/R1's own disposition of it.
    - >-
      [fact, standard] hhat(alpha*P) = deg(alpha)*hhat(P) = N(alpha)*hhat(P)
      for alpha in End(E~) (functorial quadraticity of the canonical height
      under isogeny). A toy-scale numerical check against known-answer
      cases (multiplication-by-m, N(m)=m^2; the CM curves y^2=x^3+k
      [alpha=zeta_3, N=1] and y^2=x^3+a*x [alpha=i, N=1]) is the paired
      experiment's own instrument self-validation stage.
    - >-
      [open] E~(H)/tors is a PROJECTIVE O-module (hence Z-rank exactly
      2*r_O) only guaranteed automatic when O is maximal (f_E=1, Dedekind).
      For non-maximal O the module can fail to be projective. Every
      measurement is stratified by f_E; f_E > 1 cells are reported
      separately and never pooled with f_E=1 cells, and no claim above is
      made for f_E > 1 without that stratification being checked first.
    - >-
      [citation, to be re-verified] The JKSST coefficient bound C_0 and the
      O(1/N) per-instance rate are relayed from KN-LIT-021 (abstract only,
      full paper not read) via the internal reconstruction ECFG-P1543-R1,
      which itself states the theorem holds "under Lang, its
      discriminant-height comparison, and fixed arity 2 <= r <= 9". Growing
      or correlated bases are outside that scoped theorem and neither claim
      here extends to them.
    - >-
      [citation, to be re-verified] Lang's height conjecture is a THEOREM
      for curves with integral j-invariant (hence every CM curve), per
      Hindry-Silverman, Inventiones 93 (1988) 419-450 -- relayed from a web
      search abstract, NOT read in full. HEUR-CANL-N1's validation plan
      includes verifying this citation as a first item; nothing operational
      in either regime's exact-arithmetic measurements depends on it, only
      the strength of the "no accidental short vector" heuristic's rigorous
      half.
    - >-
      [fact, verified constructively not assumed] For j=0 over F_p with
      p = 1 mod 3, End_{F_p}(E) contains Z[zeta_3] and the automorphism
      (x,y) -> (mu_p*x, y), mu_p^3=1 in F_p, is F_p-rational. Constructed
      and checked directly in the paired experiment's Stage-0 hard gate
      using harness/isogeny_class.py:cm_eigenvalues(p, N, -3), which is
      ALREADY COMMITTED, general-purpose code computing exactly this
      eigenvalue mod N (solving lambda^2+lambda+1=0 mod N), reused here
      unmodified rather than reimplemented.
    - >-
      [instrument, corrected by this design, stated explicitly so it is
      never silently re-broken] The "ratio_of_minima" / "companion-height
      ratio" measurement uses alpha_min (the Lemma-1-minimizing element),
      not the raw generator w. See provenance.corrections_made_to_source_material
      for the full derivation of why the literal-w definition would have
      measured a different, quadratically-faster-growing quantity and
      produced a spurious falsification of a true bound.
    - >-
      [scope] Toy scale throughout. Every prime and every |D_E| used by any
      measurement in the paired experiment is produced by a frozen,
      deterministic generation rule (test_boundary.parameters below), never
      hand-picked past the point where this drafting pass could verify
      primality or discriminant validity independently.

  proof_search_map:
    bottleneck: >-
      TWO bottlenecks, stated separately because they gate different
      regimes. (i) GLOBAL: Lemma 1 (the norm-form gap N(alpha) >= |D_E|/4
      for alpha in O \ Z), composed with Lemma 2 (height scales by the
      norm). Removing or weakening either collapses the |D_E| vs 4*C_0^2
      partition itself -- both C1's and C2's claims are stated relative to
      that exact threshold, so a wrong constant in Lemma 1 does not falsify
      either mechanism's internal arithmetic but does invalidate which
      curves each claim currently governs, and the correct response is a
      versioned protocol_amendment recomputing the threshold, not a
      wholesale rejection. (ii) C2-SPECIFIC: the unit/non-unit split of the
      small-|D_E| shell. If every small-norm element were a unit, C2's
      escape would be entirely tautological (the lane would then close
      completely, a STRONGER negative than predicted); if no non-unit
      element gave a fresh residue, likewise. The entire difference between
      "CM helps by Theta(C_0)" and "CM helps by 0" in the escape regime
      lives in whether lambda is non-degenerate on S(C_0) \ O^*.
    baseline_embedding:
      parameter_slice: >-
        The Z-case (non-CM) reachable-k count at matched Z-rank, with CM
        coefficients entirely removed: integer tuples in [-C_0, C_0]^{r_Z+1}
        reduced through a fixed ring map to residues mod N. This is the
        Xedni step with CM subtracted out, common to both regimes, and it
        must reproduce a closed-form combinatorial count exactly before
        either regime's CM arm is trusted.
      reproduction_check: >-
        Frozen fixture: a named toy prime N (from the ladder below), a
        named generator P, r_Z named auxiliary integers with declared,
        non-random values (k_i = i+1 for i=1..r_Z, per test_boundary), the
        exact enumerated tuple set, and the exact resulting distinct-residue
        count, checked against the closed-form upper bound (2*C_0+1)^{r_Z+1}
        with collisions accounted for. Any mismatch is an instrument failure
        under AGENTS.md rule 5 and blocks both C1 and C2.
    observation_collision:
      observable: >-
        (r_Z, height spectrum of the O-submodule generated by the lifted
        points) for C1; (reachable-residue count, unit/non-unit
        decomposition) for C2.
      distinct_preimage_search: >-
        C1: REQUIRED AND SUCCEEDS BY CONSTRUCTION -- two canonical lifts
        whose j-invariants are distinct Galois conjugates over the same
        H_{D_E} have equal rank and equal height spectrum, because Galois
        conjugation is an isometry of the Mordell-Weil lattice. This is not
        a defect: it says one crater has one answer, and a collision that
        DID separate conjugates would falsify the isometry claim and would
        itself be the surprising, reportable outcome. C2: EXPECTED TO
        SUCCEED AND THEREFORE BLOCKING -- a genuine CM shell at |D_E|=3,
        C_0=2 and a Z-coefficient range with C_0' chosen so 2*C_0'+1
        matches the CM count collide on the raw count alone. Attribution to
        CM must therefore come from the unit/non-unit decomposition, never
        from the count in isolation; reporting a C2 reachable-count without
        that decomposition is prohibited.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "r_Z = 2*r_O" (C1) or "reachable-residue
          count" (C2) fixed and vary the forgotten structure: |D_E| for C1,
          unit-versus-non-unit membership for C2. The intrinsic invariant
          separating the fibres is the norm-form minimum off Z (C1) or
          N(alpha)=1 versus N(alpha)>1 (C2). Sweeping |D_E| with r_Z fixed
          (C1) and separating S(C_0) by unit membership (C2) is
          simultaneously the counterexample construction and each regime's
          own experimental discriminator.
        predicted_gain: >-
          C1: identifies |D_E| = O(C_0^2) as the only regime where the
          "CM does not help" conclusion can fail -- precisely the boundary
          C2 owns, making the two constructions each other's nearby-object
          control (method_ceiling below). C2: converts a raw count that
          looks like a CM advantage into a number with a known tautological
          component that must be subtracted before it means anything.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the scalar "Z-rank of E~(H)" by the pair (r_O, minima of
          the norm form) for C1; replace the shell cardinality |S(C_0)| by
          the multiset {lambda(alpha) : alpha in S(C_0)} for C2 (detects
          lambda-collisions the cardinality hides).
        predicted_gain: >-
          C1: exposes a quantity that LOOKS like a factor-2 improvement
          (r_Z doubling) as exactly a factor-2 point-count gain paired with
          a (2*C_0+1)^{r_Z/2} residue-count loss. C2: a sharper, possibly
          smaller and more honest gain estimate than the raw cardinality.
    quantifier_order: >-
      C1: THERE EXISTS an absolute constant C_0 (JKSST at fixed arity) such
      that FOR ALL ordinary E/F_p with |disc End_{F_p}(E)| > 4*C_0^2, FOR
      ALL canonical lifts E~, and FOR ALL alpha in O \ Z,
      hhat(alpha*P~) >= (|D_E|/4)*hhat(P~) -- uniform over O and independent
      of the point, which is what makes it a height-BUDGET statement rather
      than a per-curve existence statement. THE TRAP HUNTED: a witness
      allowed to depend on the curve ("for each curve there is SOME small
      alpha") would be true and useless (alpha=1); that reading is
      explicitly rejected. C2: FOR ALL D_E with |D_E| <= 4*C_0^2, THERE
      EXISTS a subset S(C_0) \ O^* of size Theta(C_0^2) such that FOR ALL
      P~ and FOR ALL alpha in that subset, lambda(alpha) is not forced to 0
      by a cyclotomic identity. THE TRAP HUNTED: the subset is fixed BEFORE
      the point and independent of it -- the same property that makes it
      target-independent and hence, per IDEA-20260807-cfe576's own
      obstruction, not by itself a usable relation without the lifting
      question that record and IDEA-20260807-6533fd separately own.
    method_ceiling:
      strongest_certifiable_claim: >-
        C1 at most certifies: "for canonical lifts with |disc End| >
        4*C_0^2, the O-module structure adds no lattice vector below height
        (|D_E|/4)*hhat_min, so the reachable-k count is (2*C_0+1)^{r_Z/2+1}
        and the instance count is N^{1-o(1)}." C2 at most certifies: "for
        |D_E| <= 4*C_0^2, the CM coefficient shell has Theta(C_0^2)
        non-unit elements per slot yielding a Theta(C_0) reachable-residue
        gain over the matched Z-case, with the unit contribution exactly
        tautological; the instance count remains N^{1-o(1)}." NEITHER
        certifies anything about non-canonical lifts, growing or correlated
        coefficient families (outside ECFG-P1543-R1's scoped theorem),
        whether any lifted point is actually constructible at all (owned by
        EXP-CANL-1064e0/EXP-CANL-108f26/EXP-CANL-8687b3), or any deployed
        curve. Neither is a lower bound on ECDLP.
      nearby_object_control: >-
        Each regime's nearby-object control IS the other regime, which is
        the structural reason this hypothesis states them together rather
        than separately. C1's closest object where its conclusion fails is
        exactly the small-|D_E| crater curve C2 owns (D_0 in
        {-3,-4,-7,-8,-11}, f_E=1); a method returning "no gain" on BOTH the
        generic curve and the D_0=-3 curve has not identified the
        load-bearing structure. C2's closest object where its conclusion
        fails is |D_E| = 4*C_0^2+1, immediately outside its own escape,
        where C1's theorem takes over and the gain is exactly zero; running
        both sides of that threshold with identical code (the C2 threshold
        control, test_boundary below) is the sharpest available check for
        C2 specifically.
    proof_obligations:
      - claim: "alpha in O \\ Z implies N(alpha) >= |D_E|/4 (Lemma 1)."
        responsibility: correctness
      - claim: "hhat(alpha*P) = N(alpha)*hhat(P) for alpha in End (Lemma 2)."
        responsibility: baseline
      - claim: "r_Z = 2*r_O for projective O-modules; open for f_E > 1."
        responsibility: correctness
      - claim: "{alpha in O : N(alpha) <= C_0^2} = {a in Z : |a| <= C_0} when |D_E| > 4*C_0^2 (C1)."
        responsibility: correctness
      - claim: "|S(C_0)| = 2*pi*C_0^2/sqrt(|D_E|) + O(C_0*|D_E|^{-1/4}+1) (C2)."
        responsibility: correctness
      - claim: "Unit relations reduce to 0=0 mod N for every P, every N greater than the unit order (C2)."
        responsibility: correctness
      - claim: "lambda(pi)=1 and lambda is computable, so every reduced O-relation is usable, not vacuous."
        responsibility: interface
      - claim: "The ratio_of_minima / companion-height metric is measured at alpha_min, not the raw generator w."
        responsibility: interface
      - claim: "I_O(C1) = N/(2*C_0+1)^{r_Z/2+1}; I_O(C2) = N/Theta(C_0^{r_Z+2}); exponent 1 in both, versus rho's 1/2."
        responsibility: runtime
      - claim: "Both claims are scoped to |D_E| relative to 4*C_0^2 exactly, at fixed arity, and assert nothing at crypto scale."
        responsibility: scope
    not_applicable_reason: null
    not_applicable_reason_note: >-
      COMPLETE, not excused. All four mandatory audits (KN-TECH-080 /
      docs/inventor-protocol.md section 8) have concrete, checkable content
      above, synthesized from the two source proposals' own already-complete
      individual proof_search_map blocks (each independently satisfied all
      four audits before this synthesis) plus this record's own additions:
      the cross-regime nearby-object identification (each regime IS the
      other's control) and the alpha_min correction discovered while
      reconciling C1's Lemma 1 against its own operational metric. Nothing
      here is missing or deferred.

  rerandomization: null
  rerandomization_note: >-
    No worst-to-average-case device is used or needed. Both regimes measure
    curves of a stated, fixed CM type directly (generic large-|D_E| curves
    for C1; explicitly constructed small-class-number curves for C2); there
    is no instance to re-randomize into and no reduction to pull back
    through. CTRL's prime ladder is a calibration sweep, not a
    rerandomization walk.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NO IMPROVEMENT IS CLAIMED IN EITHER REGIME, so this field is left null
    rather than populated with claim_kind: constant_factor, to avoid
    implying a claim of advantage over the state of the art that the
    predicted outcome explicitly denies. The predicted result -- exponent
    stays 1 in both C1 and C2, against rho's automorphism-discounted 1/2 --
    is instead carried as explicit, falsifiable metrics in `predictions`
    below (the instance-count-exponent entries) and in the paired
    experiment's scale_relevance.justification, exactly matching this
    goal's standing convention (H-ICINV-6c7920 uses the identical null +
    note pattern for a hypothesis making no complexity claim). sota_delta is
    ZERO on every tested axis: parallel Pollard rho with distinguished
    points (0.886*sqrt(N), O(1) memory, KN-TECH-001/KN-TECH-006) dominates
    both regimes on time by a factor N^{1/2-o(1)} even under C2's best-case
    predicted gain, before charging the p^{1+o(1)} lift-construction cost
    (EXP-CANL-108f26) and the N^{2/r} coordinate size (EXP-CANL-8687b3),
    neither of which either regime's own instance-count formula above
    absorbs. dominated_by is NOT null; see statement.

  heuristic_assumptions:
    - id: HEUR-CANL-N1
      formal_statement: >-
        FOR ALL ordinary E/F_p in the toy sweep (C1 regime), the
        Mordell-Weil lattice of the canonical lift over H, restricted to
        the O-submodule generated by one non-torsion point, has successive
        minima (hhat(P~), N(alpha_min)*hhat(P~)) up to a factor bounded by
        the unit index -- i.e. no OTHER generator of the full Mordell-Weil
        lattice happens to sit close to alpha_min*P~ and shorten the second
        minimum.
      random_model_justification: >-
        Lemma 1 and Lemma 2 give the LOWER bound N(alpha) >= |D_E|/4
        unconditionally; the heuristic is only that no accidental
        sublattice coincidence shortens it further. This imitates the
        standard "generic" expectation for small-rank Mordell-Weil
        lattices, the same expectation underlying Lang's height conjecture,
        which is a THEOREM for integral-j (hence every CM) curves per
        Hindry-Silverman 1988 [citation relayed from an abstract, not read
        -- verification is this heuristic's own validation-plan first item].
      supporting_results: []
      supporting_results_note: >-
        The Hindry-Silverman citation is the load-bearing external result
        and is carried with its to-be-re-verified qualifier; nothing else
        is cited.
      validation_experiment_ids: [EXP-CANL-96b0ad]
      falsification_condition: >-
        A measured ratio_of_minima (at alpha_min, per the STEP 3
        correction) whose log-log slope against |D_E| has a 95% CI that
        excludes 0.5, on curves that have already passed the small-|D_E|
        positive control and the null-object control.
    - id: HEUR-CANL-N2
      formal_statement: >-
        The JKSST constant C_0 satisfies C_0 = O(1) uniformly over the toy
        family at fixed arity r_Z <= 9, so |D_E| > 4*C_0^2 holds for all but
        O(1) of the swept curves.
      random_model_justification: >-
        No theorem is offered directly; ECFG-P1543-R1 reconstructs the
        C_0/p result only "under Lang... and fixed arity 2 <= r <= 9".
        Because Lang's bound is unconditional for integral-j curves
        (HEUR-CANL-N1's citation), on the canonical lift specifically the
        conditionality is expected to lift -- the one place CM strictly
        improves the ANALYSIS rather than the attack.
      supporting_results: []
      supporting_results_note: Derived from ECFG-P1543-R1 and HEUR-CANL-N1's citation; no independent external citation.
      validation_experiment_ids: [EXP-CANL-96b0ad]
      falsification_condition: >-
        An empirically measured C_0 (max |a_i| over dependences found among
        low-height points, against the matched non-CM null) that grows with
        p rather than staying bounded, reported prominently rather than
        absorbed.
    - id: HEUR-CANL-S1
      formal_statement: >-
        FOR ALL |D_E| in the class-number-one list and FOR ALL C_0 >= 5,
        lambda restricted to S(C_0) \ O^* is injective up to a factor
        bounded independently of C_0 and N -- the Theta(C_0^2) shell
        elements give Theta(C_0^2) DISTINCT residues mod N.
      random_model_justification: >-
        RIGOROUS FOR N > 4*C_0^2 (every cryptographic N and most toy N):
        lambda is a ring map O -> Z/N with kernel of norm divisible by N,
        so two shell elements with the same image differ by an element of
        norm >= N, impossible inside a shell of norm <= C_0^2 once
        N > 4*C_0^2. Retained as numbered because the toy ladder
        deliberately includes N below that threshold to exercise the
        failure regime.
      supporting_results: []
      supporting_results_note: Derived directly; ring-theoretic, not an external citation.
      validation_experiment_ids: [EXP-CANL-96b0ad]
      falsification_condition: >-
        A collision rate above the pigeonhole prediction C_0^2/N at any N
        exceeding 4*C_0^2 -- would mean the rigorous half of this
        justification is mis-stated or mis-implemented.
    - id: HEUR-CANL-S2
      formal_statement: >-
        The reachable residues produced by shell coefficients are
        equidistributed in Z/N to within a birthday correction, rather than
        concentrated on a small subgroup.
      random_model_justification: >-
        No theorem; imitates the standard expectation that a homomorphic
        image of a "generic" finite set in Z/N is equidistributed, the same
        expectation underlying this program's index-calculus relation
        heuristics. Can fail if mu has small multiplicative order or N
        shares structure with |D_E|.
      supporting_results: []
      supporting_results_note: No external citation.
      validation_experiment_ids: [EXP-CANL-96b0ad]
      falsification_condition: >-
        A chi-squared test rejecting uniformity of the residue multiset, or
        an observed distinct-value count materially below the birthday
        prediction |S|*(1 - |S|/(2N)), reported as a finding rather than
        smoothed over.
    - id: HEUR-CANL-C1
      formal_statement: >-
        FOR ALL fixed global curves and FOR ALL ladder primes of good
        reduction, rho_lift(p) = c(curve, B)/p * (1+o(1)), so the slope of
        log(rho_lift) against log(p) is -1 uniformly, CM or not, any rank,
        any regulator.
      random_model_justification: >-
        Rigorous once p exceeds a computable per-curve injectivity
        threshold (distinct global points of bounded height have distinct
        reductions); the birthday bound for a uniform map into N residues
        covers the remaining small primes.
      supporting_results: []
      supporting_results_note: Derived directly from the covering-fraction definition; no external citation.
      validation_experiment_ids: [EXP-CANL-96b0ad]
      falsification_condition: A fitted slope outside -1.00 +/- 0.15 on any arm, including any null.
    - id: HEUR-CANL-C2
      formal_statement: >-
        The naive-height enumeration box captures a constant fraction of
        the canonical-height ball of the corresponding radius, uniformly
        over the tested curves.
      random_model_justification: >-
        The height comparison |hhat - h_x/2| = O(log|Delta|) gives ball
        inclusions with a curve-dependent shift; uniformity of that
        constant across the tested curve set is the unproven part and is
        measured (empirical max shift per curve is a required metric), not
        assumed.
      supporting_results: []
      supporting_results_note: No external citation.
      validation_experiment_ids: [EXP-CANL-96b0ad]
      falsification_condition: >-
        A measured shift differing by more than a factor 2 across arms,
        which would make cross-arm covering-fraction ratios uninterpretable
        until the arms are re-matched on |Delta|.

  structural_ingredients:
    - description: >-
        Serre-Tate/Deuring canonical lift of an ordinary curve, with
        endomorphism ring equal to the F_p-endomorphism ring of the
        reduction.
      citation: Standard; recalled via ECFG-P1543-R0/R1's own disposition, not re-derived.
      role: establishes the object (E~, O) both regime claims measure.
    - description: >-
        Lang's height conjecture as a THEOREM for curves with integral
        j-invariant.
      citation: >-
        Hindry-Silverman, Inventiones 93 (1988) 419-450 [relayed from a web
        search abstract, NOT read in full; to-be-re-verified per
        HEUR-CANL-N1].
      role: rigorous half of HEUR-CANL-N1's justification.
    - description: JKSST's C_0/p theorem for Xedni-style relations at fixed arity.
      citation: >-
        KN-LIT-021 [abstract only] via the internal reconstruction
        ECFG-P1543-R1 [ledger/FINDING-PF-IC-001.md], "under Lang, its
        discriminant-height comparison, and fixed arity 2 <= r <= 9".
      role: fixes the baseline I_Z(r) both regimes are compared against.
    - description: >-
        Committed CM-eigenvalue computation for D0 in {-3,-4}: solves
        lambda^2+lambda+1=0 or lambda^2+1=0 mod N.
      citation: harness/isogeny_class.py:cm_eigenvalues (already committed code, reused unmodified).
      role: computes lambda(zeta) for C2's tautology and non-unit checks without reimplementation.
    - description: Frobenius discriminant and fundamental-discriminant factorization for a concrete ordinary curve.
      citation: harness/isogeny_class.py:frobenius_discriminant, fundamental_discriminant (committed, reused unmodified).
      role: identifies D_E = D_0*f_E^2 for any curve found on the prime ladder, routing it to C1 or C2.

  reduction_chain:
    core_problem: >-
      Decide, across the FULL range of |D_E|, whether the O-module
      structure of the Serre-Tate canonical lift changes the JKSST
      Xedni-failure quantity (canonical-height budget / reachable-count /
      instance-count exponent), per RQ-CANL-63098f's decision_target.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. Neither regime's claim reduces to another problem
      by a published polynomial-time reduction; each is a direct
      measurement of the named quantity. The only permitted downstream
      consequence is a Coordinator decision on RQ-CANL-63098f's own status,
      not a claim about relation-collection cost, Groebner degree, any
      other exponent, or any curve at cryptographic scale.

  predictions:
    - metric: >-
        P1 (GLOBAL PREMISE GATE) -- minimum N(alpha) over alpha=a+b*w,
        b != 0, |a|,|b| <= 50, per swept D_E (Stage-0 integer search).
      direction: different
      minimum_effect: >-
        FORCED EXACT: minimum equals |D_E|/4 (D_E even) or (|D_E|+1)/4 (D_E
        odd), zero tolerance. A single value below this collapses the
        global |D_E| vs 4*C_0^2 partition; see falsification_conditions.
    - metric: >-
        P2 (C1) -- ratio_of_minima := sqrt(hhat(alpha_min*P~)/hhat(P~)),
        alpha_min the Lemma-1-minimizing element (STEP 3 correction), swept
        over |D_E| drawn from the certified curves on the prime ladder,
        restricted to |D_E| > 4*C_0^2.
      direction: higher
      minimum_effect: >-
        >= sqrt(|D_E|)/2, fitted log-log slope against |D_E| with a 95% CI
        containing 0.5 and excluding both 0 and 1, across at least 5
        distinct |D_E| values.
    - metric: >-
        P3 (C1) -- reachable_k_count ratio: exact CM-generic-regime count
        divided by the exact Z-case count at matched r_Z.
      direction: lower
      minimum_effect: "<= 1, predicted exactly (2*C_0+1)^{-r_Z/2}."
    - metric: >-
        P4 (C1 reopen trigger) -- same ratio, explicit single-sided test
        for exceeding 1.
      direction: different
      minimum_effect: >-
        Any measured value > 1 is the pre-registered outcome that reopens
        this lane; it is not absorbed into a softened verdict.
    - metric: >-
        P5 (C2) -- exact shell count |S(C_0)| versus predicted
        2*pi*C_0^2/sqrt(|D_E|), for every class-number-one |D_E| and
        C_0 in the frozen grid.
      direction: different
      minimum_effect: Relative error below 15% for C_0 >= 5 at every tested |D_E|.
    - metric: >-
        P6 (C2 hard gate) -- tautology check: the group-law sum
        P + zeta*P + zeta^2*P (+ higher unit powers where |O^*| > 3) over
        1000 random points at a j=0 (or j=1728) ladder prime, using
        harness/isogeny_class.py:cm_eigenvalues for mu.
      direction: different
      minimum_effect: "FORCED: identity element, zero exceptions across all 1000 points."
    - metric: >-
        P7 (C2) -- non-unit relation lambda(1-zeta_3) at |D_E|=3.
      direction: different
      minimum_effect: "!= 0 mod N for every tested N > 3."
    - metric: >-
        P8 (C2) -- reachable_residue_gain := exact CM-shell reachable count
        divided by the exact Z-case count at matched r_Z, at |D_E|=3
        primary.
      direction: higher
      minimum_effect: "In [0.5*C_0, 4*C_0] for C_0 >= 5."
    - metric: >-
        P9 (C2 threshold control) -- reachable_residue_gain measured just
        above and just below |D_E| = 4*C_0^2, identical code.
      direction: different
      minimum_effect: >-
        Gain collapses to <= 1 just above the threshold (matching C1) and
        is > 1 just below it. A gain that is flat across the threshold
        falsifies the instrument's sensitivity to the load-bearing
        structure, per the method_ceiling nearby-object control above.
    - metric: >-
        P10 (SHARED) -- instance_count_exponent := fitted slope of
        log(N / reachable_count) against log(N) across the prime ladder,
        computed separately for C1 and for C2.
      direction: different
      minimum_effect: >-
        Both regimes' fitted intervals exclude 0.5 and are consistent with
        1. If either interval includes 0.5 at toy scale, HEUR-CANL-C1's
        calibration certificate (P11) is consulted before anything is
        reported, per the small-p artifact this control exists to catch.
    - metric: >-
        P11 (CTRL, GATING) -- covering-fraction decay slope,
        IDEA-20260807-761a8c.
      direction: different
      minimum_effect: >-
        -1.00 +/- 0.15 on every required arm including all five nulls.
        FAILURE VOIDS P2-P10: no C1 or C2 verdict may be read from a run
        whose calibration certificate did not pass.
    - metric: >-
        P12 (CTRL null N3, SHARED with the null-object controls of both
        regimes) -- companion-height ratio (at alpha_min, STEP 3
        correction) under the genuine O-action versus a random order-2/3
        Z-linear isometry substituted for it.
      direction: higher
      minimum_effect: >-
        Genuine action grows like sqrt(|D_E|)/2; synthetic action stays
        O(1). A synthetic arm that also grows falsifies CM-attribution for
        BOTH C1 and C2 simultaneously, since both regimes' claims rest on
        the same underlying quantity.

  test_boundary:
    instances:
      - >-
        C1 (large |D_E|, generic regime): ordinary curves found directly
        (not via full class enumeration) on the shared prime ladder, using
        harness/isogeny_class.py:trace_of_frobenius, frobenius_discriminant,
        fundamental_discriminant to identify D_E and route curves with
        |D_E| > 4*max(C_0) to this arm.
      - >-
        C2 (small |D_E|, escape regime): explicit class-number-one
        discriminants {-3,-4,-7,-8,-11,-12,-16,-19,-27,-28,-43,-67,-163}
        (11b93d's own list), realized as concrete curves at the ladder
        primes satisfying the needed congruence (p = 1 mod 3 for D_0=-3;
        p = 1 mod 4 for D_0=-4).
      - >-
        CTRL: 6 global curves (3 CM with h(D_E)=1, 3 matched non-CM, same
        exhibited rank and minimal discriminant magnitude within a factor
        2), reduced at every ladder prime, per IDEA-20260807-761a8c.
      - >-
        NULL OBJECTS (shared across C1, C2, CTRL): a matched non-CM curve
        with a synthetic order-2/3 Z-linear automorphism substituted for
        the genuine O-action; a synthetic rank-2 coefficient ring with the
        right shape and no arithmetic; a random-surjection lattice with
        matched regulator; a rank-0 torsion-only CM curve.
      - >-
        OUT OF SCOPE: supersingular curves, extension fields, any p beyond
        the ladder's top rung, any non-canonical lift construction, growing
        or correlated coefficient families, and every statement about any
        deployed curve beyond citing that secp256k1's CM class is C2's
        escape regime (no attack on it is proposed, implied, or implemented).
    parameters:
      prime_ladder_rule: >-
        p_i := smallest prime >= 10^i for i in {2,3,4,5,6}, via
        sympy.nextprime(10**i - 1), each independently re-verified by
        sympy.isprime before use. Deterministic and reproducible; NOT
        hand-picked past i=4 (this drafting pass has no compute to verify
        primality of large numbers itself). i=2,3,4 are expected to yield
        101, 1009, 10007 respectively (1009 mod 3 = 1, checked by hand;
        10007 is already used as EXP-ICINV-4d33aa's primes_stretch_optional
        entry in this same goal). i=5,6 are computed by the rule, not
        asserted.
      c2_congruence_ladder_rule: >-
        q_i := smallest prime >= 10^i with q_i = 1 (mod 3), for
        i in {3,4,5,6}, via the same sympy construction plus a mod-3
        filter, each independently re-verified. q_3 = 1009 (shared with the
        main ladder). Used for the C2 j=0 hard gate and its concrete
        measurements.
