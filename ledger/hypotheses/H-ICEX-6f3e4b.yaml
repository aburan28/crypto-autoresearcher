hypothesis:
  id: H-ICEX-6f3e4b
  question_id: RQ-ICEX-001
  source_idea_id: IDEA-20260830-4ab603
  title: >-
    THE FREE DECOMPOSITION ORACLE IS NOT A BOUNDARY LIFT, IT IS A MEMORY
    PURCHASE PRICED AT B^2- at m = 2 over an unstructured factor base the
    decomposition query is sumset membership against a preprocessed set, so
    query time D and query-time space S are coupled, the D = Theta(1)
    endpoint costs S = Theta(min(B^2, N)), and the attainable m = 2 point is
    (time N^{2/3}, memory N^{2/3}, precompute N^{2/3}) rather than the
    (N^{2/3}, N^{1/3}) a live proposal reports; the comparator therefore
    strengthens from rho alone to rho and BSGS, and every future m = 2 row
    must carry the identifying triple
  statement: >-
    (A) THE COUPLING THE TWO-TERM MODEL LEAVES OUT. In a charge of the form
    T(B) = m! N D / (2^m B^{m-1}) + c_LA B^2, the per-trial decomposition
    cost D and the memory exponent are treated as independent knobs, with
    memory reported as Theta(B) - the factor base plus the relation matrix -
    regardless of D. AT ARITY m = 2 THAT IS FALSE. The m = 2 query is exactly
    'given R, is R in F + F, and with which pair', a sumset-membership query
    against a FIXED preprocessed set, and its cost is governed by a
    preprocessing tradeoff rather than by a free parameter.
    (B) THE DICHOTOMY, WHICH IS THE FALSIFIABLE CORE. For an unstructured
    factor base F of size B with query-time space S, the two realisable
    endpoints are- (B1) S = Theta(B), the stored base only, answering a query
    in D = Theta(B) charged operations by computing the 2B residuals, for
    T = Theta(N) at memory Theta(B); and (B2) S = Theta(min(B^2, N)), the
    precomputed sumset table keyed by target, answering in D = Theta(1), for
    T = Theta(N/B) + c_LA B^2 + Theta(B^2) precompute, optimised at
    B = Theta(N^{1/3}) giving TIME Theta(N^{2/3}), MEMORY Theta(N^{2/3}),
    PRECOMPUTE Theta(N^{2/3}).
    (C) THE CORRECTION, AND EXACTLY WHAT IS BEING CORRECTED. A live committed
    proposal reports its free-oracle point as (N^{2/3}, N^{1/3}), with its
    memory exponent justified VERBATIM as 'Theta(B*) = Theta((N D)^{1/(m+1)}),
    i.e. N^{1/3} at m = 2 with D = 1. The memory is the factor base plus the
    relation matrix and cannot be traded below B'. That is the memory of the
    factor base, NOT of the structure that makes D = Theta(1) possible. With
    the query-time space charged the point is (N^{2/3}, N^{2/3}), an error of
    N^{1/3} - about 2^{85.3} stored elements at N = 2^256.
    (D) THE INTERPOLATION AND ITS CONJECTURE. The endpoints are joined by the
    sub-base construction- table the sumset of a sub-base of size B_0 <= B and
    sweep the remainder, giving D = Theta(B - B_0) at space
    Theta(B_0^2 + B). CLAIMED- along the whole interpolation the product
    T * S never falls below Theta(N) and the time never falls below
    Theta(N^{2/3}). A construction achieving T * S = o(N) at m = 2 over an
    unstructured base falsifies this and IS WORTH FAR MORE THAN THIS RECORD.
    (E) THE COMPARATOR CLAIM, AND THE PLACE WHERE THIS RECORD DEPARTS FROM
    ITS OWN SOURCE. The source proposal states that (N^{2/3}, N^{2/3}) is
    dominated by BSGS at (N^{1/2}, N^{1/2}) on both axes. THAT IS TRUE ONLY
    UNDER THE PROCESSOR-STEPS-AND-STORAGE CONVENTION. KN-TECH-031, read in
    full for this record, states VERBATIM that BSGS costs '2*sqrt(n) group
    operations and sqrt(n) storage (deterministic); full cost n^{2/3+o(1)}
    once memory is charged', and records that Wiener 'states explicitly that
    it is wrong to conclude Shanks's method and rho have the same full cost'.
    UNDER THE FULL-COST CONVENTION BSGS IS ITSELF AT n^{2/3+o(1)}, THE SAME
    EXPONENT AS THE CORRECTED POINT'S TIME, so the two-axis domination claim
    DOES NOT FOLLOW under that convention and must be recomputed rather than
    asserted. This hypothesis therefore claims the domination ONLY under the
    declared processor-steps convention, requires BOTH conventions to be
    reported side by side, and treats the full-cost comparison as an OPEN
    BRANCH that the contract computes and that may overturn the source
    proposal's headline. The source's paraphrase of KN-TECH-031 omits that
    caveat; the verbatim text is quoted here and the omission is flagged
    rather than inherited.
    (F) WHAT THIS DOES NOT DO. It lowers no exponent, proposes no attack, and
    does not decide RQ-ICEX-001. It removes one unattainable point from the
    lane's frontier table, replaces it with an attainable one, and forces
    every future m = 2 row to carry a query-space column.
  mechanism: >-
    THE TRACKED OBJECT AND WHY ITS PROJECTION IS LOSSY IN THE RIGHT WAY. The
    object followed is the ORACLE'S ACCESS FOOTPRINT on one query- the set of
    factor-base-derived words the decomposition routine must read before it
    can answer - projected to its cardinality and to the size of the
    persistent structure it reads from. That discards the arithmetic
    performed, the access order, the field representation, the monomial order
    and the solver, retaining two integers. It is lossy COMPATIBLY because
    those two integers compose under the only operations the pipeline
    performs on the oracle- repetition across targets multiplies the count and
    leaves the structure size fixed, and enlarging the base grows both by a
    rule independent of what was discarded.
    WHY THE COUPLING IS FORCED AT m = 2 AND NOWHERE ELSE. At m = 2 the
    solution set is parameterised by ONE index- given R and a first summand
    P_v, the second is determined as R - P_v. There is no combinatorial
    search left for algebra to shorten; the candidate set has size 2B and the
    question is a pure set intersection between the 2B residuals and F. So
    the Theta(B) sweep is not a weak oracle awaiting improvement but the
    natural cost of the query, and the only way below it is to have READ THE
    ANSWERS EARLIER, i.e. to hold the sumset. At m >= 4 the candidate set has
    size Theta(B^{m-1}) while the answer is one tuple, so an algebraic solve
    genuinely has something to shorten and D can sit far below the candidate
    count with no table. THE COUPLING IS SCOPED TO m = 2 AND IS ASSERTED
    NOWHERE ELSE.
    WHY THE PRODUCT BOUND IS THE RIGHT SHAPE AND IS A WEAK CONJECTURE RATHER
    THAN A REPACKAGING. Time-space products are the standard currency for
    preprocessed search. Both endpoints satisfy T*S = Omega(N) with room to
    spare - endpoint (B1) gives Theta(N)*Theta(B) and endpoint (B2) gives
    Theta(N^{2/3})*Theta(N^{2/3}) = Theta(N^{4/3}) - so the claim
    T*S = Omega(N) over the interpolation is a genuinely testable conjecture
    and not a restatement of the endpoints. The cheapest way to break it is to
    exhibit an intermediate construction, which is what the contract invites.
    WHY A CURVE-FREE NULL IS REQUIRED HERE, AND WHY THE SOURCE PROPOSAL DOES
    NOT CARRY ONE. Every step of the argument above is about SUMSET
    MEMBERSHIP AGAINST A PREPROCESSED SET. Nothing in it reads the group law,
    the curve equation, or any elliptic-curve structure; F could be any
    subset of any abelian group. A non-curve object of the same shape - a
    random size-B subset of (Z/NZ, +) - must therefore reproduce the B^2
    memory scaling and the T*S floor exactly. If it does, as predicted, THE
    DICHOTOMY IS A STATEMENT ABOUT PREPROCESSED SUMSET MEMBERSHIP AND MAY NOT
    BE QUOTED AS A STATEMENT ABOUT ELLIPTIC CURVES OR THE ECDLP. That null is
    added by this hypothesis and is not in the source proposal.
  assumptions:
    - >-
      Prime-order group of order N, arity m = 2, x-coordinate factor base F
      of size B with NO exploitable additive structure. Structured bases are
      OUT OF SCOPE and are the named escape hatch- a base for which F + F has
      a succinct description breaks the dichotomy by construction, and
      finding one is a strictly better outcome than confirming this record.
    - >-
      COST UNIT- one charged operation is one GROUP OPERATION. A table probe
      is charged at a DECLARED RATE FROZEN BEFORE ANY CELL RUNS, with a
      sensitivity row at probe cost 0.1, 1 and 10 group operations. MEMORY
      UNIT- STORED GROUP ELEMENTS, counted by the program, with an
      allocator-level byte probe reported SIDE BY SIDE and never substituted.
      PRECOMPUTE IS A THIRD COLUMN, CHARGED SEPARATELY AND REPORTED, never
      amortised silently into time.
    - >-
      TIME IS NEVER ADDED TO MEMORY. The product T*S carries BOTH unit tags
      (group-operations x stored-elements) and is compared only against N
      under the declared convention.
    - >-
      Precompute is amortised over the targets of a SINGLE DLP instance only.
      A deployment amortising one table across many instances changes the
      accounting entirely; that multi-target row is NOT computed here and
      must not be quoted as computed.
    - >-
      The linear-algebra charge is c_LA * B^2 with memory Theta(B) for a
      sparse representation. The dichotomy's conclusion is unchanged for any
      linear-algebra exponent in [1, 2], because the table term Theta(B^2)
      alone forces the memory.
    - >-
      TWO ACCOUNTING CONVENTIONS ARE REPORTED, NEVER ONE- (i)
      PROCESSOR-STEPS AND STORAGE, under which the domination claim of
      statement (E) is made; and (ii) a FULL-COST convention in which memory
      is charged, under which KN-TECH-031 records BSGS itself at
      n^{2/3+o(1)} and the domination claim DOES NOT FOLLOW and must be
      recomputed. A row quoted without its convention is inadmissible.
  proof_search_map:
    bottleneck: >-
      The decomposition query at m = 2, and specifically the PAIR (query
      time, persistent space read by the query). The exact step whose removal
      changes the theorem is 'decide membership of the target in F + F and
      return the witness'.
    baseline_embedding:
      parameter_slice: >-
        B_0 = 0 (no table) must reproduce the sweep endpoint and
        KN-FIND-8f2c90's committed 2RN/B charge identically. B_0 = B (full
        table) must reproduce the free-oracle TIME exponent N^{2/3} exactly
        while correcting its memory exponent from N^{1/3} to N^{2/3}.
      reproduction_check: >-
        Symbolic- the interpolated charge must collapse to 2RN/B at B_0 = 0
        term by term, to 1e-12. Frozen fixture- at KN-FIND-8f2c90's own cells
        (p = 1009 and p = 4001) the B_0 = 0 arm must reproduce its committed
        yield retentions gamma = 0.86 and 0.75 and the derived 2*gamma
        speedup interval [1.5, 1.7], all read verbatim from that finding. If
        the recomputation misses that committed interval the counting
        convention differs and NOTHING downstream may be read.
    observation_collision:
      observable: >-
        The reported m = 2 time exponent alone.
      distinct_preimage_search: >-
        COLLISION EXHIBITED, AND IT IS THE POINT OF THE RECORD. The value
        alpha = 2/3 at m = 2 is produced by at least three distinct preimages
        with materially different resource profiles- (i) the free oracle as
        its own proposal reports it, at claimed memory N^{1/3}; (ii) the same
        free oracle with its table charged, at memory N^{2/3}; (iii) a
        two-channel partial-relation pipeline at memory N^{2/3} with a
        Theta(B) oracle and NO table at all. A single alpha therefore does
        not identify the pipeline, and THE IDENTIFYING TRIPLE IS (time, query
        space, precompute). Every m = 2 row in this lane must carry all
        three or it is not identifiable.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure T*S for the m = 2 decomposition
          query, realised by the explicit sub-base-table specialisation with
          parameter B_0, with the two channels - table hits and swept
          residuals - charged over provably disjoint parts of the candidate
          set.
        predicted_gain: >-
          Converts an uncharged idealisation into a one-parameter family
          whose whole range can be evaluated and placed on the frontier. NO
          ATTACK EXPONENT IS MOVED IN EITHER DIRECTION.
      - transform: observable_fiber
        proposed_object: >-
          Hold alpha = 2/3 fixed and vary the forgotten structure (query
          space, precompute), exhibiting three preimages with distinct
          intrinsic profiles.
        predicted_gain: >-
          Establishes that the lane's reported observable is not identifying,
          and names the minimal identifying tuple.
    quantifier_order: >-
      CLAIMED AS A CONJECTURE, NOT A THEOREM. FOR ALL prime N, FOR ALL B, FOR
      ALL UNSTRUCTURED factor bases F of size B, FOR ALL query algorithms in
      the declared cost model that read a persistent structure of size S
      built from F alone, EXISTS an absolute constant c such that the
      expected query time D satisfies D * S >= c * B; consequently FOR ALL B
      the end-to-end product T * S >= c' * N. The FOR ALL over geometry is
      genuinely restricted to UNSTRUCTURED bases and is NOT delivered by
      KN-FIND-007, which is about yield and not about query cost - that
      restriction is the honest weak point and it is stated here rather than
      in a footnote. NOT CLAIMED- anything at m >= 4, where the coupling
      argument fails by construction; any cell-probe lower bound, since no
      literature was checked; any multi-instance amortisation of the table.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At m = 2 over an unstructured factor base, in the declared cost
        model and under the declared processor-steps convention, the
        free-oracle configuration is realisable only at query space
        Theta(min(B^2, N)), so its point is (N^{2/3} time, N^{2/3} memory,
        N^{2/3} precompute) and it is dominated by BSGS on both time and
        memory.' It can NEVER certify a lower bound on D for structured
        bases, anything at m >= 4, that no intermediate construction beats
        T*S = Theta(N), or the domination claim under a full-cost convention,
        which KN-TECH-031's own n^{2/3+o(1)} figure for BSGS puts in doubt.
      nearby_object_control: >-
        THE STRUCTURED-BASE CONTROL, AND IT IS THE ONE THAT MATTERS.
        Instantiate the identical accounting on a base with strong additive
        structure - a Bose-Chowla Sidon set and the small-multiples base,
        both characterised in KN-FIND-007's battery, which records the Sidon
        base attaining the coverage ceiling at ratio 1.1071 and the
        small-multiples base collapsing to coverage ratio 0.0021 with a
        concentration statistic of 1224x at 2^18. For a Sidon set every
        pairwise sum is distinct, so F + F has size exactly binom(B+1, 2) and
        admits no compression; for the small-multiples base F + F collapses
        to Theta(B) values and IS succinctly describable, so a Theta(1) query
        at Theta(B) space exists. THE METHOD MUST RETURN DIFFERENT VERDICTS
        ON THOSE TWO BASES. A method returning the same verdict on both has
        not identified the load-bearing structure and is measuring nothing.
    proof_obligations:
      - claim: >-
          The B_0 = 0 slice reproduces the committed 2RN/B charge and the
          1.5-1.7x gamma interval.
        responsibility: baseline
      - claim: >-
          The full-table slice has query time Theta(1) at space
          Theta(min(B^2, N)) and its optimum is B = Theta(N^{1/3}).
        responsibility: memory
      - claim: >-
          The interpolated family has T * S = Omega(N) at every B_0.
        responsibility: strictness
      - claim: >-
          (N^{2/3}, N^{2/3}) is dominated by BSGS on both axes UNDER THE
          PROCESSOR-STEPS CONVENTION, and the full-cost convention is
          computed and reported beside it rather than assumed to agree.
        responsibility: scope
      - claim: >-
          The structured-base control returns a different verdict on the
          Sidon base and on the small-multiples base.
        responsibility: correctness
      - claim: >-
          The curve-free (Z/NZ, +) arm reproduces the dichotomy, so no result
          is read as a curve statement.
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-M2-SUMSET-1
      formal_statement: >-
        For an unstructured factor base F of size B drawn uniformly from the
        rational x-coordinates, the sumset F + F has size
        (1 - o(1)) * binom(B+1, 2) for B = o(sqrt(N)) - essentially no
        additive coincidences occur - so a table supporting Theta(1) queries
        has Theta(B^2) entries and admits no compression below that.
      random_model_justification: >-
        The UPPER bound |F + F| <= binom(B+1, 2) is a trivial count and is
        exact. The LOWER bound is the classical Sidon-set statement- a random
        subset of size B of a group of order N has expected number of
        coincident pairwise sums Theta(B^4 / N), which is o(B^2) precisely
        when B = o(N^{1/2}), so a random base is asymptotically Sidon in the
        relevant range. That is the standard
        random-set-behaves-like-a-Sidon-set imitation. KN-FIND-007 records
        the measured contrast at the two extremes directly- a Bose-Chowla
        Sidon base attains the coverage ceiling with a measured ratio of
        1.1071 while the small-multiples base collapses to 0.0021 with a
        concentration statistic of 1224x.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            VERBATIM- the exact mean yield 'E_r[c_D(r)] =
            binomial(B + m - 1, m) / N for every base of size B,
            independently of how D is chosen'; the measured Bose-Chowla
            coverage ratio 1.1071 and the small-multiples collapse to 0.0021
            with concentration 1224x at 2^18; and its explicit statement that
            it 'says nothing about the cost of finding a decomposition ...
            which is where the index-calculus cost actually sits'. That last
            sentence is exactly why this hypothesis exists and why
            KN-FIND-007 CANNOT deliver its quantifier over geometry.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (finding read in full this
            task, 96 lines; all quoted figures and passages are verbatim)
        - ref: KN-FIND-8f2c90
          provenance: internal
          claim: >-
            VERBATIM- the committed m = 2 proof sketch charging 'Standard:
            B x (R/(B^2/(2N))) = 2RN/B' check operations, i.e. endpoint (B1)
            of the dichotomy, and the BKK variant at 'RN/(gamma x B)' with
            measured gamma about 86 percent at p = 1009 and 75 percent at
            p = 4001, giving 'Net speedup: 2*gamma = 1.5-1.7x in total check
            operations'. Its own front matter records
            proof_status empirical_only and evidence_level toy_measurement.
          verified_by: >-
            coordinator, TASK-20260904-e87737 (finding read in full this
            task, 43 lines)
        - ref: >-
            Classical time-space tradeoffs for preprocessed set and sumset
            membership (Yao-style cell-probe lower bounds; Fiat-Naor function
            inversion)
          provenance: recalled
          claim: >-
            The general shape 'constant-time membership against a
            preprocessed sumset requires space proportional to the sumset,
            absent structure in the set' is standard folklore and a
            substantial cell-probe literature bounds preprocessed search
            problems. NO SOURCE WAS OPENED and no specific theorem is relied
            upon; the claim is stated as a falsifiable conjecture over an
            explicit interpolation precisely because the literature was not
            checked.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-6d52bf
      falsification_condition: >-
        A measured |F + F| / binom(B+1, 2) departing materially from
        1 - Theta(B^2/N) on random bases at the tested p, or a heavy
        multiplicity tail indicating the base is not behaving as
        unstructured. Decisively- a measured peak memory for the D = Theta(1)
        arm scaling as B^1 rather than B^2, which would exhibit a
        constant-time query at linear space and falsify the dichotomy
        outright.
    - id: HEUR-M2-CHANNELS-2
      formal_statement: >-
        Over the interpolation, the sub-base table and the swept remainder
        cover DISJOINT parts of the candidate set, so their costs add without
        a cross-term and T*S is well defined by the two channels alone.
      random_model_justification: >-
        Rigorous by construction for the partition of F into the tabled
        sub-base and its complement- a candidate pair is counted in exactly
        one channel. What is heuristic is only that no third algorithm
        exploits the PAIR of structures jointly to beat both, which is the
        'no clever combination' clause every two-channel cost model carries
        and which the T*S conjecture exists to expose.
      supporting_results:
        - ref: IDEA-20260830-4ab603
          provenance: internal
          claim: >-
            The dichotomy, the interpolation, the T*S = Omega(N) conjecture,
            the five pre-registered predictions with their tolerances, the
            structured-base control, and the stage plan with its memory
            discipline (largest object the sumset table at B = 256, at most
            32896 entries, under 20 MB, no Macaulay matrix and no Groebner
            basis built).
          verified_by: >-
            coordinator, TASK-20260904-e87737 (source proposal read in full
            this task, 622 lines)
      validation_experiment_ids:
        - EXP-ICEX-6d52bf
      falsification_condition: >-
        A measured total falling more than 15 percent BELOW the sum of the
        two channel predictions at any interpolation cell. An unmodelled
        cross-term in the favourable direction is precisely the falsifier of
        the T*S conjecture and those cells are inspected individually.
  structural_ingredients:
    - description: >-
        The committed m = 2 relation-collection charge 2RN/B in check
        operations and the measured yield retentions, used as the blocking
        baseline-reproduction fixture at p = 1009 and p = 4001.
      citation: KN-FIND-8f2c90
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (read in full this task, 43 lines)
      role: blocking baseline reproduction for the B_0 = 0 slice
    - description: >-
        The exact decomposition-yield identity and the measured Sidon versus
        small-multiples contrast that supplies the structured-base control's
        two extremes, together with its own statement that it says nothing
        about the cost of FINDING a decomposition.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (read in full this task, 96 lines)
      role: the nearby-object control's two extremes, and the explicit
        boundary of what it can support
    - description: >-
        The free-oracle row being corrected. VERBATIM from that record's own
        target_complexity block- 'Theta(B*) = Theta((N D)^{1/(m+1)}), i.e.
        N^{1/3} at m = 2 with D = 1. The memory is the factor base plus the
        relation matrix and cannot be traded below B' - and, from its
        constructive_transforms block, the D = Theta(1) substitution labelled
        a boundary_lift whose predicted gain is 'A negative conclusion at m=2
        that is robust to every future improvement of the S_3 solve'. Both
        limbs are what this hypothesis corrects.
      citation: IDEA-20260829-b5a2c8
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 - PARTIAL READ, DECLARED. This
        agent read the record's memory_exponent, boundary_lift,
        target_complexity, assumptions and free-oracle prediction blocks
        directly (a pattern-scoped read with surrounding context, not the
        full 671 lines). The two quoted limbs above were read verbatim in
        that pass. The rest of the record was NOT opened and nothing else
        from it is relied on here.
      role: the record whose memory row and boundary-lift limb are corrected
    - description: >-
        The BSGS comparator. VERBATIM- '2*sqrt(n) group operations and
        sqrt(n) storage (deterministic); full cost n^{2/3+o(1)} once memory
        is charged'; that Wiener 'states explicitly that it is wrong to
        conclude Shanks's method and rho have the same full cost'; and the
        applicability limit that 'storage of sqrt(n) group elements is
        infeasible at cryptographic size'. THE FULL-COST FIGURE IS THE PART
        THE SOURCE PROPOSAL'S PARAPHRASE OMITS, and it is why statement (E)
        scopes the domination claim to one convention and computes the other.
      citation: KN-TECH-031
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (read in full this task, 57 lines;
        all three quoted passages are verbatim)
      role: the comparator promoted to relevance at m = 2, and the source of
        the two-convention requirement
    - description: >-
        The parallel-collision-search baseline and its fully-charged
        requirement, supplying the matched rho arm's target constant.
      citation: KN-TECH-006
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-e87737 (read in full this task, 38 lines)
      role: the matched rho arm's 0.886*sqrt(n) anchor and charging
        discipline
  reduction_chain:
    core_problem: >-
      The coupling between query time and query-time space for m = 2 sumset
      membership against a preprocessed unstructured factor base, and the
      resulting Pareto placement.
    corollaries:
      - problem: >-
          The m = 2 row of the lane's frontier table and the comparator set
          that row is judged against.
        reduction_ref: >-
          Internal- the frontier placement is this lane's own accounting; no
          published reduction is cited.
        asymptotics_preserved: >-
          Not applicable- no attack and no asymptotic improvement is claimed
          in either direction.
  predictions:
    - metric: >-
        P1- peak resident memory of the D = Theta(1) arm, in STORED GROUP
        ELEMENTS, as B is swept over a 16x range at fixed p
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED- must scale as B^2, i.e. each doubling of B multiplies
        peak memory by 4.0 within +/- 20 percent, until the min(B^2, N) cap
        binds. A measured memory scaling of B^1 would mean a constant-time
        query at linear space and would FALSIFY THE DICHOTOMY OUTRIGHT - the
        single most valuable outcome available here.
    - metric: >-
        P2- query time of the D = Theta(1) arm, in CHARGED GROUP OPERATIONS
        PER TARGET
      direction: different
      minimum_effect: >-
        PREDICTED FLAT IN B within a factor 1.2 across a 16x range. With P1
        the pair identifies the endpoint. A query time growing with B in the
        table arm means the table is not being used and the arm is
        mislabelled.
    - metric: >-
        P3- the product (total CHARGED GROUP OPERATIONS) x (peak QUERY SPACE
        in STORED GROUP ELEMENTS) across the interpolation parameter B_0 at
        fixed p and B
      direction: different
      minimum_effect: >-
        PREDICTED NEVER BELOW 0.25*N at any B_0. A measured product below
        0.1*N at any interpolation point FALSIFIES the T*S = Omega(N)
        conjecture at the tested scale.
    - metric: >-
        P4- structured-base control- query space needed for a Theta(1) query
        on the small-multiples base versus a Bose-Chowla Sidon base at
        matched B, in STORED GROUP ELEMENTS
      direction: different
      minimum_effect: >-
        FORCED SEPARATION. The small-multiples base must admit Theta(1)
        queries at O(B) space (its sumset collapses); the Sidon base must
        require Theta(B^2) space (its sumset is maximal and collision-free).
        A measured ratio of query spaces BELOW 4 at B = 128 means the control
        is not discriminating and NO VERDICT MAY BE READ FROM THE MAIN ARMS.
    - metric: >-
        P5- Pareto placement of the corrected point against BSGS, under BOTH
        declared conventions
      direction: different
      minimum_effect: >-
        UNDER THE PROCESSOR-STEPS CONVENTION- FORCED EXACT.
        (N^{2/3}, N^{2/3}) against (N^{1/2}, N^{1/2}), dominated on both axes
        by a factor N^{1/6} each, verified symbolically; any deviation is an
        algebra error and halts. UNDER THE FULL-COST CONVENTION- OPEN AND
        COMPUTED, NOT ASSUMED. KN-TECH-031 puts BSGS at n^{2/3+o(1)} full
        cost, the same exponent as the corrected point's TIME, so the
        two-axis domination may fail there. The contract computes it and
        reports it beside the other; a failure under the full-cost convention
        does not falsify statement (B) but DOES retract statement (E)'s
        comparator strengthening, and that retraction must then be recorded.
    - metric: >-
        P6- curve-free null- the identical dichotomy measured on a random
        size-B subset of (Z/NZ, +) with sumset membership as the
        decomposition predicate
      direction: different
      minimum_effect: >-
        PREDICTED IDENTICAL- B^2 memory scaling within +/- 20 percent and the
        same T*S floor. If it holds, the dichotomy is a statement about
        PREPROCESSED SUMSET MEMBERSHIP and may NOT be quoted as a statement
        about elliptic curves or the ECDLP. A departure IS the curve-specific
        content and is the interesting outcome.
  test_boundary:
    instances:
      - toy prime-order curves at p in {2^12, 2^14, 2^16}, plus the frozen fixture cells p = 1009 and p = 4001
      - Bose-Chowla Sidon base and small-multiples base at matched B, as the structured-base control
      - >-
        CURVE-FREE ARM- a random size-B subset of (Z/NZ, +) with sumset
        membership as the decomposition predicate and no curve arithmetic
    parameters:
      p: '2^12, 2^14, 2^16; fixtures at 1009 and 4001'
      B: 'swept over a 16x range, B <= 256; cells below B = 32 reported but excluded from every fit'
      B_0: '0, B/4, B/2, 3B/4, B'
      probe_cost: '0.1, 1, 10 group operations per table probe, frozen before any cell runs'
      convention: 'processor-steps-and-storage, and full-cost with memory charged - both reported'
    implementation: >-
      Pure Python with an explicit operation counter, an explicit
      stored-group-element counter and an allocator-level memory probe. The
      largest object is the sumset table at B = 256, at most 32896 entries,
      plus a 256 x 256 matrix over Z/N - under 20 MB. NO MACAULAY MATRIX AND
      NO GROEBNER BASIS IS BUILT.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 2.0
      maximum_memory_gb: 8
      maximum_runs: 30
  falsification_conditions:
    - >-
      F1. The D = Theta(1) arm's measured peak memory scales as B^1 rather
      than B^2. THE DICHOTOMY IS FALSE, a constant-time m = 2 query exists at
      linear space, and this hypothesis is withdrawn - and the construction
      achieving it is worth far more than the hypothesis.
    - >-
      F2. The measured T x S product falls below 0.1*N at any interpolation
      point. The T*S = Omega(N) conjecture is falsified at the tested scale.
    - >-
      F3. The B_0 = 0 arm does not reproduce KN-FIND-8f2c90's committed
      charge or its 1.5-1.7x gamma interval. The counting convention differs,
      the correction cannot be made, and the hypothesis is withdrawn rather
      than re-scoped.
    - >-
      F4. The structured-base control does not separate Sidon from
      small-multiples. The method is not measuring the structure it claims
      and NO verdict may be read from the main arms.
    - >-
      F5. The matched rho arm misses 0.886*sqrt(N) outside the seed spread.
      INFRASTRUCTURE FAILURE under AGENTS.md rule 5, never negative
      mathematical evidence; the run is reported unrun.
    - >-
      F6. The curve-free arm fails to reproduce the B^2 memory scaling. Then
      something curve-specific is driving the dichotomy and the whole
      argument must be re-examined before any citation.
    - >-
      F7. The full-cost convention shows the corrected point NOT dominated by
      BSGS on both axes. Statement (E)'s comparator strengthening is RETRACTED
      under that convention and the retraction is recorded; statement (B) is
      unaffected.
    - >-
      F8. Everything holds. Then the free-oracle memory row is corrected from
      N^{1/3} to N^{2/3}, the boundary-lift robustness argument is withdrawn
      as stated, the m = 2 no-go strengthens to domination by BSGS on both
      axes UNDER THE PROCESSOR-STEPS CONVENTION, and this lane acquires a
      reporting rule requiring the identifying triple.
  interpretation_limits:
    - >-
      NOT A LOWER BOUND IN ANY COMPLEXITY-THEORETIC SENSE. The quantified
      statement in quantifier_order is a CONJECTURE with a constructive
      falsification route, not a cell-probe theorem, and no literature was
      checked. Anyone quoting it as a proved bound is overclaiming.
    - >-
      SCOPED TO m = 2 AND TO UNSTRUCTURED BASES. The coupling argument rests
      on the candidate set having size Theta(B) at m = 2, which is false at
      m >= 4 where an algebraic solve genuinely has combinatorial search to
      shorten. NOTHING HERE MAY BE QUOTED ABOUT m >= 4.
    - >-
      NO ATTACK IS PROPOSED AND NO EXPONENT IS IMPROVED. The exponents quoted
      are NEGATIVE and COSTING statements within a declared model. Should any
      future record read them as an asymptotic-complexity claim, the four
      promotion gates of agents/coordinator.md apply and are NOT met by this
      hypothesis or its contract.
    - >-
      THE DOMINATION CLAIM IS CONVENTION-DEPENDENT and this record departs
      from its own source there. Under processor-steps-and-storage it holds
      by N^{1/6} on each axis; under a full-cost convention KN-TECH-031 puts
      BSGS itself at n^{2/3+o(1)} and the claim must be recomputed. Both
      conventions are reported and a row quoted without its convention is
      inadmissible. KN-TECH-031 also records that sqrt(n) storage is
      infeasible at cryptographic size, so BSGS is a COMPARATOR IN A COST
      MODEL and not a deployable attack.
    - >-
      PRECOMPUTE IS CHARGED PER INSTANCE. A multi-instance reading is a
      different row that is NOT computed here and must not be quoted as
      computed.
    - >-
      MEASURED MEMORY IS AN IMPLEMENTATION ARTEFACT AS WELL AS A MATHEMATICAL
      ONE. The metric is STORED GROUP ELEMENTS counted by the program, with
      the allocator probe used only as a cross-check on direction; the two
      figures are reported side by side.
    - >-
      TOY p ONLY. The exponents N^{2/3} and N^{1/3} are DERIVATIONS WITHIN
      THE COST MODEL and are NOT VALIDATED AT CRYPTOGRAPHIC SCALE BY ANY PART
      OF THIS WORK; no correspondence trick is available to reach that scale
      and none is claimed.
    - >-
      IF THE CURVE-FREE ARM REPRODUCES THE DICHOTOMY, as predicted, nothing
      here is a statement about elliptic curves or the ECDLP.
    - >-
      FORWARD GUIDANCE, so this is not read as a closure- structured factor
      bases whose sumset admits a succinct oracle remain open (the
      small-multiples base exhibits the phenomenon at the cost of collapsed
      coverage, and whether any base achieves a succinct F + F WITHOUT
      collapsing coverage is the open question handed forward);
      multi-instance amortisation of the table remains open; and every arity
      m >= 4 remains open.
