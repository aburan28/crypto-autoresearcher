# H-SSI-d4f424
# Finite-witness quotient of IDEA-20261004-edbd24.
# Toy curve-point audit. Not an integer-count contract.
hypothesis:
  id: H-SSI-d4f424
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  source_idea: IDEA-20261004-edbd24
  experiment_id: EXP-SSI-f08a63
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-8219b8
  title: >-
    On y^2 = x^3 + x, decryption that reads only E[2] equality bits
    factors through a quotient strictly smaller than the eight
    endomorphisms generated by iota and Frobenius
  statement: >-
    Fix p in {7, 11, 19}. Let E be y^2 = x^3 + x over F_p, with
    F_{p^2} = F_p[i]/(i^2+1). Let iota be the automorphism
    (x, y) -> (-x, i y) and let pi be the p-power Frobenius.
    The witness set is W = {iota^a ∘ pi^b : a in {0,1,2,3}, b in {0,1}},
    composed as pi^b first. Let E[2] = {O, (0,0), (i,0), (-i,0)}.
    Define Dec_theta(R) = 0 if theta(R) = R and 1 otherwise, for R in E[2].
    Define Q_dec(theta) as those four bits. Then Dec_theta = Dec_theta'
    whenever Q_dec(theta) = Q_dec(theta'). On this witness set the
    design-session derivation, which is not a run, gives exactly two
    Q_dec fibers of size 4:
    fix-all {(0,0),(2,0),(1,1),(3,1)} and swap-Ti-Tmi
    {(1,0),(3,0),(0,1),(2,1)}. The degree-aware table Q_deg splits each
    of those into two fibers of size 2 by degree in {1, p}. No reverse
    reduction from Q_dec to the pair (a, b) is supplied.
  mechanism: >-
    Instrument each witness as a map on E[2]. Record the image of each
    of the four 2-torsion points and the bit theta(R) = R. Replay
    Dec from the bit table alone. A collision of distinct pairs (a, b)
    with the same bits shows that this decryption interface does not
    consume the full endomorphism. The negative query asks for the
    image of (0,0) under a map of degree p+1, which is outside W and
    outside Q_dec. The witness ladder stops at Q_dec; the arrow back
    to a unique (a, b), and from there to plain EndRing, stays missing.
  assumptions:
    - p in {7, 11, 19} and i^2 = -1 in F_{p^2}.
    - Composition order is pi^b first, then iota^a.
    - Decryption reads only equality of points in E[2]. It does not read degree.
    - Two descriptions (a, b) are distinct witnesses even when their actions on E[2] agree.
  proof_search_map:
    bottleneck: >-
      The missing reverse arrow from the E[2] equality-bit table Q_dec
      to the witness pair (a, b).
    baseline_embedding:
      parameter_slice: >-
        The curve y^2 = x^3 + x, the maps iota and pi, the witness
        set W of eight pairs, and E[2], as written in the statement.
        IDEA-20261004-edbd24 supplies the quotient lemma. This slice
        does not instantiate SÉTA Algorithms 1 and 2.
      reproduction_check: >-
        Affine and projective group-law routes must agree on every
        image theta(R) for theta in W and R in E[2]. The design-session
        fiber partition is recomputed by those routes. It is not a run.
    observation_collision:
      observable: >-
        Q_dec, the four equality bits, together with the plaintext
        bits of Dec and the accept/reject status of the degree p+1 query.
      distinct_preimage_search: >-
        Compare all eight witnesses. Pairs that differ by composition
        with iota^2 = [-1] are distinct maps and are predicted to agree
        on E[2], because every point of order dividing 2 is fixed by [-1].
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Q_dec
        predicted_gain: >-
          Replaces the eight-element witness with two equality-bit
          tables. No attack exponent.
    quantifier_order: >-
      For each fixed p in {7, 11, 19}, quantify over all eight witnesses,
      then over all four points of E[2]. No malformed ciphertext is in
      the domain.
    method_ceiling:
      strongest_certifiable_claim: >-
        Program equivalence of Dec through Q_dec on this witness set,
        plus an integer fiber partition. Not hardness, not IND, and not
        an equivalence with EndRing.
      nearby_object_control: >-
        A query for a degree p+1 image of (0,0). The fixed Q_dec table
        must leave that query undefined.
    proof_obligations:
      - claim: Q_dec equality implies identical Dec bits on E[2]
        responsibility: correctness
      - claim: The pre-registered fibers have size 4 and 4
        responsibility: size
      - claim: The reverse arrow from Q_dec to (a, b) is not proved here
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        Exhaustive collisions inside W inform which calls this toy
        decryption uses. They do not inform the hardness of EndRing
        at cryptographic primes.
      random_model_justification: >-
        W is enumerated in full. There is no sampling model and no
        uniformity claim.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-f08a63
      falsification_condition: >-
        A later record that treats a fiber collision in W as evidence
        about cryptographic EndRing hardness. This experiment must not
        emit that reading.
  structural_ingredients:
    - description: >-
        IDEA-20261004-edbd24 states the reachable-transcript quotient
        lemma and names SÉTA, SiGamal, and LIT-SiGamal as adjacent
        constructions. This hypothesis tests a frozen toy interface
        on y^2 = x^3 + x. It does not re-verify those papers.
      citation: ledger/proposals/IDEA-20261004-edbd24.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-05, proposal file read
      role: source claim and scope boundary
  reduction_chain:
    core_problem: >-
      Whether Dec on E[2] factors through Q_dec for the eight witnesses.
    corollaries: []
  predictions:
    - metric: replay_disagreements
      direction: equal
      minimum_effect: exactly 0 on every valid point of E[2]
    - metric: qdec_fiber_sizes
      direction: equal
      minimum_effect: >-
        Two fibers, each of size 4, with membership
        fix-all {(0,0),(2,0),(1,1),(3,1)} and
        swap {(1,0),(3,0),(0,1),(2,1)}
    - metric: unresolved_reverse_arrows
      direction: equal
      minimum_effect: exactly 1, the missing arrow from Q_dec to (a, b)
  test_boundary:
    instances:
      - y^2 = x^3 + x over F_p for p in {7, 11, 19}
    parameters:
      primes: [7, 11, 19]
      witness_exponents_a: [0, 1, 2, 3]
      witness_exponents_b: [0, 1]
      torsion: 2
    implementation: >-
      Two routes, affine and projective, both computing images from
      the group law. No precomputed action table may be imported.
    budget:
      maximum_runs: 6
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Both routes agree and some witness pair with equal Q_dec decrypts
      differently on a point of E[2].
    - >-
      Both routes agree, the point count #E(F_p) = p+1 holds, and the
      measured Q_dec partition differs from the two fibers named above.
    - >-
      A written polynomial reduction, attached to the run, recovers (a, b)
      from Q_dec alone. That would close the reverse arrow this hypothesis
      leaves missing. It is not assumed.
  interpretation_limits:
    - No PKE construction, attack, IND statement, or EndRing algorithm is claimed.
    - No result transfers from this toy interface to SÉTA, SiGamal, LIT-SiGamal, or cryptographic primes.
    - The papers cited inside IDEA-20261004-edbd24 were not reopened in this design session.
    - A timeout, a crash, or a route disagreement is not evidence against the statement.
  dominated_by:
    verdict: not_applicable
    justification: >-
      This is an interface audit of eight explicit endomorphisms.
      It is not a competing isogeny algorithm, and it claims no
      time or memory exponent.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Replaces an undifferentiated EndRing label with two measured
      Q_dec fibers and one counted missing reverse arrow.
  status_note: >-
    Approved with EXP-SSI-f08a63 by DEC-20261005-8219b8 under the
    standing user authorization of 2026-09-06. Approval authorizes
    the six toy runs. It does not assert the fiber partition.
