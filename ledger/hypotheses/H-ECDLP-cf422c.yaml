  title: >-
    On two points of y squared equals x cubed plus x plus 1 the
    identity gap is three times the curve defect
  statement: >-
    Over the integers, with a equal to 1 and b equal to 1, the point
    (2, 1) has curve defect 10 and identity gap 30. The point (4, 2)
    has curve defect 65 and identity gap 195. Each gap equals three
    times the defect. At lambda equal to 2 the first y-component gap
    is 60, and the reference cross is 26, which leaves remainder 1
    on division by 5. At lambda equal to 1 the second y-component
    gap is 195, and the reference cross is 36, which also leaves
    remainder 1. Both x-crosses agree in the integers, 8 and 16.
    Both curve defects leave remainder 0 on division by 5.
  mechanism: >-
    The proposal says the trivial-direction defect equals lambda
    times x over y because 3 y squared minus 2 a x minus 3 b equals
    3 x cubed plus a x on the curve. This contract checks that
    cancellation on two points. It does not build a deformation.
  assumptions: []
  proof_search_map:
    bottleneck: The identity gap 30 at the point (2, 1).
    baseline_embedding:
      parameter_slice: >-
        The identity 3 y squared minus 2 a x minus 3 b equals 3 x
        cubed plus a x, in IDEA-20260930-8e3b75, read 2026-10-02.
        The two points were computed in this design session. That
        computation is not a run.
      reproduction_check: >-
        One route subtracts the two cubic expressions. The other
        multiplies the curve defect by 3. They must agree on both
        gaps.
    observation_collision:
      observable: The gaps 30 and 195, and the reference crosses 26 and 36.
      distinct_preimage_search: >-
        Reporting the gap 30 as 0 drops the defect 10. Reporting
        the reference cross 26 as 0 drops the remainder 1.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The points (2, 1) and (4, 2) modulo 5.
        predicted_gain: Integer comparisons. No deformation.
    quantifier_order: >-
      The curve defects come first, then the identity gaps, then
      the y-component gaps, then the reference crosses.
    method_ceiling:
      strongest_certifiable_claim: >-
        The two gaps and the two reference remainders. Not a
        discrete-log statistic and not an attack cost.
      nearby_object_control: >-
        The gap 30 reported as 0, and the reference cross 26
        reported as 0.
    proof_obligations:
      - claim: The gaps are 30 and 195, each three times the defect.
        responsibility: correctness
      - claim: The reference crosses leave remainder 1 modulo 5.
        responsibility: correctness
      - claim: Both curve defects are 0 modulo 5.
        responsibility: scope
    not_applicable_reason: null
