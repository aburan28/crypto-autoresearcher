hypothesis:
  id: H-MQOM-c1bf10
  question_id: RQ-MQOM-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260805-7d97be
  statement: >-
    An MQOM-shaped fully random multivariate quadratic map is the matched unstructured NULL OBJECT
    for the structured-MQ family, and at the sizes reachable in this container its exact degree-D
    Macaulay rank equals the semi-regular prediction C(nv+D, D) - a_D at every cell with nv >= 6,
    with zero seed-to-seed spread and no saturation at m = nv. A UOV-shaped map built at the
    identical (q, n, m, monomial support) with a hidden oil space of dimension o has a rank DEFICIT
    relative to that prediction which is non-decreasing in o and strictly positive at
    o = floor(n/2) with m <= o. If the deficit curve is flat at every o including o = floor(n/2),
    the instrument has no power at the reachable sizes and no negative statement about any
    structured scheme may be drawn from it.
  mechanism: >-
    MQOM's key generation expands a public seed with an extendable output function to derive the
    quadratic and linear parts; there is no secret linear change of variables, no oil subspace, no
    quotient ring and no matrix lift. UOV and MAYO hide an oil space O with P(O) = 0, QR-UOV embeds
    the map in a quotient ring, and SNOVA works over a matrix ring. Every published structural
    attack on those schemes is an attack on the object MQOM does not have. Consequently the
    quantity that could carry information about a trapdoor is not an algebraic instrument's value
    on the structured map alone, but the RATIO of that value to the same instrument's value on a
    matched random map of identical (q, n, m) and identical monomial support. The instrument is the
    exact degree-D Macaulay rank - rows are products of the quadratics by monomials of degree at
    most D-2, columns are the monomials of degree at most D, with field equations carried over F_2 -
    which is invariant under the linear change of variables that IS the UOV trapdoor's concealment.
    That invariance is why the projection is the right one - the attacker cannot see the trapdoor
    and neither can the instrument, but both see the rank. Sweeping the oil dimension o from 0 (which
    IS the MQOM-shaped random map) upward interpolates between the null and the structured object, so
    the graded deficit curve localises where, if anywhere, structure becomes visible.
  assumptions:
  - >-
    Exact rank over F_2, F_16 and F_256 at the reachable sizes is affordable in pure Python within
    the declared budget. This is an engineering assumption and is TESTED by the first cell rather
    than assumed - the schedule orders cells smallest-first and the run reports what it covered.
  - >-
    The UOV-shaped construction used for the graded arm is a faithful SHAPE, not a reproduction of
    any deployed key generation. The arm is labelled UOV-SHAPED, never UOV, and no statement about
    deployed UOV, MAYO, QR-UOV or SNOVA parameters may be made from it.
  - >-
    Matched means matched in (q, n, m) AND in monomial support and degree histogram. This is written
    into the design as a checked precondition, not an intention, because this corpus has a worked
    failure from comparing arms that were not matched on the parameter that forced the statistic.
  - >-
    NO assumption that structure is visible at toy sizes. The honest expectation is that it may not
    be, and the deliverable is constructed to be worth having either way.
  proof_search_map:
    not_applicable_reason: >-
      Purely empirical control and instrument construction. No theorem is claimed, no asymptotic bound
      is asserted, no certificate family is constructed and no reduction is offered. The one derived
      quantity - that at m = nv the semi-regular series collapses so that a_D is strictly positive for
      every D and no semi-regular solving degree exists - is an exact power-series identity stated in
      the parent proposal and re-evaluated in exact integer arithmetic as part of the frozen
      pre-registration, not a proof architecture. KN-TECH-080's audits are therefore not applicable
      and this field records that rather than nulling the map silently.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-MQOM-NULL-1
    formal_statement: >-
      SEMI-REGULARITY AT SMALL SIZE. FOR ALL q in {2, 16, 256}, FOR ALL nv >= 6, FOR ALL m, FOR ALL D
      below the solving degree, and for a uniformly random choice of coefficients, the degree-D
      Macaulay rank of m quadratics in nv variables equals C(nv+D, D) - a_D with probability 1 - o(1),
      where a_D is the coefficient of the specification's series
      sum_j a_j z^j = (1 - z^2)^m / (1 - z)^(nv + 1). Note the quantifier order - ONE fixed formula is
      required to hold for ALL cells; it is not fitted per cell.
    random_model_justification: >-
      The specification's own appeal to practice on unstructured systems, plus the classical
      semi-regular-sequence framework, WHICH WAS NOT RETRIEVED FOR THIS RECORD. The support is an
      appeal, not a theorem, and there is a specific recorded reason for caution here - semi-regularity
      is exactly the assumption known to fail for summation-polynomial systems, and it is inherited
      unnamed by many records in this corpus.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MQOM-6701c1
    falsification_condition: >-
      A single null-arm cell at nv >= 6 whose exact rank differs from the frozen prediction, replicated
      across at least two seeds. Semi-regularity is then refuted at that size, scoped exactly to the
      tested (q, nv, m, D), and that finding is reported FIRST because it invalidates a baseline many
      contracts in this corpus inherit.
  - id: HEUR-MQOM-NULL-2
    formal_statement: >-
      VISIBILITY. Oil-space structure of dimension o produces a Macaulay rank deficit detectable at the
      sizes reachable in this container.
    random_model_justification: >-
      NONE. This is the proposal's weakest link and is stated as such. It is entirely possible the
      deficit appears only at n far beyond reach, in which case the graded curve is flat and the
      instrument is uninformative at toy scale.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MQOM-6701c1
    falsification_condition: >-
      A flat deficit across the whole oil sweep INCLUDING o = floor(n/2) with m <= o, where a
      linear-algebra solution exists and the deficit is forced. A flat response there includes a broken
      instrument among its explanations and the contract requires that reading first.
  structural_ingredients:
  - description: >-
      The semi-regular Hilbert series for m quadratics in nv variables,
      sum_j a_j z^j = (1 - z^2)^m / (1 - z)^(nv + 1), with rank_D = C(nv+D, D) - a_D below the solving
      degree and C(nv+D, D) at or above it.
    citation: MQOM v2.1 specification, section 4.2, as transcribed in IDEA-20260805-be7738
    provenance: retrieved
    verified_by: >-
      Re-evaluated in exact integer arithmetic in the experiment's frozen pre-registration stage, before
      any linear algebra runs. Taken as a CANDIDATE TO TEST, never as an authority.
    role: the null arm's prediction, and the object whose failure would itself be the finding
  - description: >-
      Degree-D Macaulay matrix construction over a small finite field, with field equations carried
      over F_2 so that columns are squarefree monomials and rows are reduced modulo x_i^2 = x_i.
    citation: null
    provenance: internal
    verified_by: >-
      Standard construction; validated here by the positive control, where a UOV-shaped system with
      m <= o = floor(n/2) has a linear-algebra solution and its Macaulay matrix MUST be rank-deficient.
    role: the instrument
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      null_arm_model_agreement - fraction of measured (q, nv, m, D) cells in the o = 0 arm whose exact
      rank equals the frozen semi-regular prediction
    direction: higher
    minimum_effect: >-
      1.00 at every cell with nv >= 6, predicted before any run. Any single disagreement at nv >= 6
      refutes semi-regularity at that size and is REPORTED FIRST, before anything about structure,
      because it invalidates the baseline other contracts inherit.
  - metric: >-
      undefined_solving_degree_at_m_equals_nv - number of measured cells at m = nv where the rank
      saturates at C(nv+D, D) for some D at or below D_max
    direction: lower
    minimum_effect: >-
      EXACTLY 0, forced by a_D strictly positive for every D at m = nv. A single saturation falsifies
      the identity and would be the most interesting single outcome available.
  - metric: >-
      graded_monotonicity - sign of the change in the rank deficit as the oil dimension o increases
      through at least four interior points at fixed (q, n, m, D)
    direction: higher
    minimum_effect: >-
      NON-NEGATIVE at every step and STRICTLY POSITIVE at at least one. A flat curve at every step means
      the instrument has no power at these sizes and no negative conclusion about any structured scheme
      is admissible.
  - metric: >-
      positive_control_deficit - rank deficit at the maximal oil dimension o = floor(n/2) with m <= o,
      at the largest reachable (q, n, m)
    direction: higher
    minimum_effect: >-
      STRICTLY GREATER THAN ZERO at D = 3. A UOV-shaped system there has a linear-algebra solution, so
      its Macaulay matrix must be rank-deficient relative to the semi-regular prediction. IF THIS IS NOT
      OBSERVED THE INSTRUMENT IS BROKEN AND NO RESULT MAY BE REPORTED FROM ANY ARM.
  - metric: >-
      discrimination_ratio - measured rank in the structured arm divided by measured rank in the matched
      null arm at identical (q, n, m, D, support)
    direction: lower
    minimum_effect: >-
      Below 1.00 at the maximal oil dimension; exactly 1.00 at o = 0 by construction, which is the
      trivial self-consistency check.
  - metric: >-
      seed_to_seed_spread - the spread of measured rank across at least three seeds at each cell
    direction: lower
    minimum_effect: >-
      EXACTLY 0, since semi-regularity asserts the rank depends only on nv and m and not on the
      coefficients. A nonzero spread at any cell is itself a refutation of the assumption at that size and
      must be reported BEFORE any model error is reported.
  - metric: instrument_port_status - whether exact rank over F_16 and F_256 was achieved, or only over F_2
    direction: different
    minimum_effect: >-
      REPORTED, NOT PREDICTED. A partial port is an infrastructure outcome and the F_2-only cells stand on
      their own; it is never negative mathematical evidence (AGENTS.md rule 5).
  test_boundary:
    instances: >-
      MQOM-shaped fully random quadratic systems (the o = 0 null arm) and UOV-shaped systems with a hidden
      oil space of dimension o, both at identical (q, n, m) and identical monomial support and degree
      histogram, at least three seeds per cell.
    parameters:
      q_axis:
      - 2
      - 16
      - 256
      n_equals_m_f2:
      - 4
      - 6
      - 8
      - 10
      - 12
      n_equals_m_larger_fields:
      - 4
      - 6
      - 8
      D_axis:
      - 2
      - 3
      - 4
      oil_dimension_sweep:
      - 0
      - 1
      - 2
      - 3
      - 4
      - floor(n/2)
      seeds_per_cell: 3
    implementation: >-
      Pure Python exact linear algebra over a table-driven finite field of size 2, 16 or 256. The existing
      d_reg tooling in this repository is F_2-by-construction and cannot be imported without Sage, so a
      port is part of the work and is declared as a cost rather than assumed away. If the port to F_16 and
      F_256 does not land inside budget, the honest disposition is an infrastructure report plus the
      F_2-only cells, never a mathematical negative.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 6.0
      maximum_runs: 30
  falsification_conditions:
  - >-
    Any null-arm cell at nv >= 6 whose measured rank differs from the frozen semi-regular prediction,
    replicated across at least two seeds. Semi-regularity is refuted at that size and the finding is
    reported scoped exactly to the tested (q, nv, m, D).
  - >-
    A measured saturation at m = nv, contradicting the derived strict positivity of a_D.
  - >-
    The positive control failing to produce a deficit at o = floor(n/2) with m <= o. Instrument broken;
    nothing negative may be reported.
  - >-
    Seed-to-seed spread comparable to or larger than the deficits being measured. The instrument is
    measuring noise and must be reported as doing so, not as a fit.
  - >-
    A flat graded curve at every o. The instrument has no power at the reachable sizes; that is a measured
    limitation with an exact boundary and it FORBIDS any statement about UOV, MAYO, QR-UOV or SNOVA.
  interpretation_limits:
  - >-
    NO ATTACK, NO EXPONENT, NO COST CLAIM. Claim tier toy, and it may not be raised by any downstream
    citation.
  - >-
    A deficit in a structured arm is not a break of any scheme. It is a measured departure from a model, at
    a toy size, on a hand-built object.
  - >-
    A NULL RESULT IS THE EXPECTED OUTCOME AND IS THE DELIVERABLE. If the null arm agrees with the
    semi-regular prediction everywhere and the graded curve turns on only at large o, the correct report is
    that the instrument works, that MQOM-shaped maps are semi-regular at the tested sizes, and that the
    structured-MQ family now has a matched null to be measured against.
  - >-
    Everything reachable here is toy - n at most about 12 over F_2 and about 8 over the larger fields,
    against MQOM's own n of 48 to 320. No cell may be presented as a statement about deployed parameters.
  - >-
    Nothing here bears on MQOM's forgery bound, its seed-tree machinery, or its implementation.
  distinguishable_outcomes:
  - outcome: >-
      Seed spread exactly 0; null_arm_model_agreement 1.00 at every nv >= 6 cell; no saturation at m = nv;
      positive_control_deficit strictly positive; and the graded curve non-decreasing with at least one
      strictly positive step.
    means: >-
      The instrument works and the matched null is established. The structured-MQ family gains a standing
      null object and a stated rule of inference - a device that fires identically on the MQOM-shaped arm
      has not found structure. This is the expected outcome and IS the deliverable.
  - outcome: >-
      All checks pass but the graded curve is FLAT at every o including o = floor(n/2).
    means: >-
      HEUR-MQOM-NULL-2 is falsified and the instrument has no power at the reachable sizes. This is a
      measured limitation with an exact boundary, reported as such, and it forbids any negative statement
      about UOV, MAYO, QR-UOV or SNOVA from this instrument. It also means a broken instrument cannot be
      excluded, and that reading is required first.
  - outcome: >-
      A null-arm cell at nv >= 6 disagrees with the frozen semi-regular prediction across at least two
      seeds, or the seed-to-seed spread is nonzero.
    means: >-
      Semi-regularity is REFUTED at that size, scoped exactly to the tested (q, nv, m, D). This is the
      single most consequential outcome available, because the model is inherited by many contracts in this
      corpus and by the security analysis of a Round-3 candidate. It is reported first, before anything
      about structure, and it requires independent replication before any downstream record cites it.
  - outcome: >-
      A saturation at m = nv, contradicting the strict positivity of a_D.
    means: >-
      The exact power-series identity underpinning the frozen prediction at MQOM's own shape is false as
      applied. The pre-registration is wrong; the record is superseded rather than edited, and the
      arithmetic is redone before any rank number is interpreted.
  - outcome: >-
      The positive control at o = floor(n/2) produces no deficit.
    means: >-
      INSTRUMENT BROKEN. Infrastructure signal under AGENTS.md rule 5; nothing may be reported from any arm
      and the run returns to the Executor.
  - outcome: >-
      Only F_2 cells complete; the F_16 and F_256 port does not land inside budget.
    means: >-
      A partial instrument. Infrastructure outcome, never a mathematical negative. The F_2 cells stand on
      their own and the port is re-scoped as its own task.
  prior_evidence_refs:
  - IDEA-20260805-7d97be
  - IDEA-20260805-be7738
  - IDEA-20260801-018
  - KN-OPEN-004
  - H-SDEG-0dd021
  status: proposed
  proposed_by: idea-generator
