  title: >-
    The integer 4194303 has 21 doublings and 21 additions
  statement: >-
    The integer 4194303 has bit length 22. Its bits are twenty-two 1s.
    Reaching it by doubling and adding uses 21 doublings and 21
    additions. Twenty-two exceeds twenty-one by 1. Twenty-one equals
    twenty-one, so that gap is 0. The product of 22, 21, and 21 is
    9702. Their sum is 64. Two readings of the addition count are both
    21, so that gap is 0 and their product is 441.
  mechanism: >-
    The proposal writes the counts 22, 21, and 21. This contract
    checks those integers. It does not add a curve point.
