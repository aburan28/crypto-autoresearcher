# =============================================================================
# H-BINSTD-b6eca7 -- Absolute Frobenius x→x^2 is a coordinate-shift symmetry
# of the descended PDP Boolean system when (a,b) are Gal-fixed; cheap only
# in a normal basis. Specified from IDEA-20260922-7ab503 under
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Approved DEC-20261002-b6de45.
#
# ZERO RUNS in this design packet. Representation / heuristic-validation.
# NO break. NO exponent. NO n≥131 transfer. No AUXIN. No Bedrock.
# Unlocks IDEA-20260922-493606 (cheap m=4 Koblitz cell) and fills the
# Frobenius-stabilizer column of the RQ-BINSTD reachability table.
# =============================================================================
hypothesis:
  id: H-BINSTD-b6eca7
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-7ab503
  experiment_id: EXP-BINSTD-cfa7cf
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-b6de45
  status: approved
  proposed_by: coordinator
  title: >-
    Absolute Frobenius x→x^2 is a genuine mu-orbit search symmetry of the
    descended PDP CNF-XOR system on Gal-fixed (a,b) rows; leaf-count
    reduction ≈1/mu in normal basis and ≈1 in polynomial basis; mu=1 null
    is a no-op

  statement: >-
    CLAIM (representation / heuristic-validation at toy scale). Let E:
    y^2+xy=x^3+a x^2+b over F_{2^n}, and let
    mu = |Stab_{Gal(F_{2^n}/F_2)}(a,b)|. (A) UNCONDITIONAL: in a normal
    basis, x→x^2 is the exact cyclic left shift of the n-coordinate vector;
    when a^{2^d}=a and b^{2^d}=b, x→x^{2^d} is a group endomorphism of
    E(F_{2^n}) commuting exactly with addition. (B) CENSUS (zero-compute /
    Stage 0): corrected frobenius_stabilizer_mu matches IDEA-20260922-7ab503
    — mu=n on every FIPS/SECG Koblitz row with a,b∈F_2; mu|k on the five
    composite ANSI c2pnb rows with a,b∈F_{2^16}; mu=1 on every
    pseudorandom row (audit-unaffected evidence). (C) HEURISTIC (toy):
    adding a mu-orbit canonical-representative constraint to the descended
    CNF-XOR PDP system at m∈{2,3}, l∈{4..7}, n∈{13,17} (Koblitz-shaped,
    mu=n) yields normal_basis_leaf_ratio within [0.85,1.15]/mu and
    polynomial_basis_leaf_ratio within [0.8,1.2] of 1, with exact
    certificate-set equality vs the unconstrained arm; on the mu=1 null
    and one-bit-perturbed controls the constraint is a no-op (ratio in
    [0.9,1.1]). CLAIM TIER: toy / structural census. NO break. NO exponent.
    NO transfer of measured leaf ratios to n≥131 as an attack claim.
    Constant-factor only (at most mu).

  mechanism: >-
    OBJECT FRAME. Representation R1: x-coordinate in a fixed F_2-basis
    (normal vs the program's polynomial basis). Operation set Sigma:
    factor-base translation UNION the cyclic Gal-stabilizer of (a,b)
    generated by x→x^{2^d} — PARTIAL-ACTION Class I. Lossy projection:
    P ↦ {mu-orbit under x→x^{2^d}}; Sigma-compatible because Frobenius is
    a ring homomorphism commuting exactly with the group law when it
    fixes (a,b). Solver-layer lever: WDSat-style canonical-representative
    constraint on the unchanged CNF-XOR system (search-order device, not
    RQ-FROB-7d8dd4 invariant-ring rewriting). Basis dependence: sparse
    coordinate relabelling in normal basis vs dense O(n)-literal XOR
    substitution in polynomial basis. OFF-LIMITS: Magma/Sage/cypari2 as
    the success path; AUXIN; deployed attacks; Amazon Bedrock; rewriting
    RQ-FROB ideals. WHAT IS NEW: corrected stabilizer census (parser-bug
    fix in subfield_scan.py hexblob fallback), solver-layer constraint
    distinct from RQ-FROB, and basis-dependence prediction H1/H2 that
    unlocks IDEA-20260922-493606's m=4 affordability arithmetic.

  assumptions:
    - >-
      E ordinary over F_{2^n} in form y^2+xy=x^3+a x^2+b, b≠0, matching
      the standardized population shape.
    - >-
      mu well-defined via smallest d with a^{2^d}=a and b^{2^d}=b; for n
      prime, mu∈{1,n}; for n=16k, mu|k.
    - >-
      No claim that every deployed m admits an affordable Gaussian normal
      basis; normal-basis arm is conditional on constructibility at the
      tested toy n.
    - >-
      IDEA-20260904-3c7a91 leaf-count law N_conf=(1±ε)2^{ml}/|G|, ε≤0.05,
      is the baseline the unconstrained arm must reproduce before the
      mu-constraint is scored.
    - Arithmetic / toy measurement only; nothing here is an attack at n≥131.

  proof_search_map:
    bottleneck: >-
      Whether the mu-fold Frobenius-stabilizer symmetry becomes a CHEAP
      search-tree constraint (WDSat-style) rather than an expensive ideal
      rewrite, and whether that cheapness survives the program's
      no-above-leaf-pruning law in the basis the tooling actually uses.
    baseline_embedding:
      parameter_slice: >-
        Toy Koblitz-shaped curves at n∈{13,17} (prime, mu=n), m∈{2,3},
        l∈{4..7}; unconstrained WDSat/DPLL leaf count must reproduce
        IDEA-20260904-3c7a91's N_conf=(1±ε)2^{ml}/m! before scoring the
        mu-constraint.
      reproduction_check: >-
        (i) x^2 cyclic-shift identity on ≥10^5 random normal-basis field
        elements per toy field; (ii) endomorphism commutation
        σ^d(P+Q)=σ^d(P)+σ^d(Q) on ≥10^5 random point pairs where
        a^{2^d}=a, b^{2^d}=b; (iii) unconstrained leaf count within
        3c7a91's band before constraint addition.
    observation_collision:
      observable: >-
        Pair (mu-orbit-constrained leaf count, certificate multiset) under
        normal-basis vs polynomial-basis encodings of the identical
        constraint.
      distinct_preimage_search: >-
        Leaf-count reduction by ~mu can come from (i) genuine Frobenius
        symmetry, (ii) unsound constraint dropping solutions — broken by
        exact certificate-set equality vs unconstrained arm — or (iii)
        unrelated search-space shrinkage — broken by mu=1 null and
        one-bit-perturbed (a,b) controls where the constraint must be a
        no-op.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          mu-orbit canonical-representative constraint layered on the
          unmodified CNF-XOR system: coordinate relabelling in normal
          basis; dense XOR substitution in polynomial basis.
        predicted_gain: >-
          Leaf count /μ within 3c7a91's band in normal basis; ≈1 in
          polynomial basis; fills reachability-table Frobenius-stabilizer
          column; unlocks IDEA-20260922-493606 m=4 affordability cell.
      - transform: stronger_invariant
        proposed_object: >-
          Corrected per-curve stabilizer census (parser-bug fix) turned
          into per-row reachability-table verdicts.
        predicted_gain: >-
          Zero-compute mu≠1 on every FIPS/SECG Koblitz and composite ANSI
          row; mu=1 STRUCTURALLY EMPTY on every pseudorandom row.
    quantifier_order: >-
      UNCONDITIONAL: FORALL n, FORALL E/F_{2^n} of stated form, mu is
      well-defined and x→x^{2^d} is a group endomorphism commuting with
      addition whenever d|n witnesses it. SEPARATELY, weaker (toy): FOR
      tested cells, normal-basis constraint realises ≈1/mu leaf reduction
      and polynomial-basis does not; null is a no-op. NOT CLAIMED: which
      deployed m admit affordable normal bases; any exponent; any break.
    method_ceiling:
      strongest_certifiable_claim: >-
        (i) Cyclic-shift and endomorphism-commutation identities as proved
        statements; (ii) corrected per-row mu census for the named
        standardized population with parser-bug certificate; (iii)
        measured constant-factor leaf ratios at toy n≤41, m∈{2,3}, both
        bases. NEVER certifies n≥131, never moves an exponent.
      nearby_object_control: >-
        BLOCKING. mu=1 pseudorandom-shaped null at matched (n,l): same
        constraint must be a no-op. Second: (a,b) one-bit-perturbed off
        the fixed subfield forces mu=1; predicted gain must vanish.
    proof_obligations:
      - claim: x→x^2 is the exact cyclic left shift of normal-basis coordinates
        responsibility: correctness
      - claim: >-
          x→x^{2^d} is a group endomorphism of E(F_{2^n}) exactly when
          a^{2^d}=a and b^{2^d}=b, verified on ≥10^5 random point pairs
        responsibility: correctness
      - claim: >-
          Six FIPS/SECG Koblitz A,B values match a fresh independent grep
          of binary-curve-params.txt (regression fixture)
        responsibility: interface
      - claim: Constrained-arm certificate set equals unconstrained arm exactly
        responsibility: correctness
      - claim: Normal-basis leaf-count ratio within [0.85,1.15]/mu
        responsibility: runtime
      - claim: Null-curve (mu=1) constrained run shows no leaf-count change beyond noise
        responsibility: scope
      - claim: No impossibility asserted; verdicts scoped to tested curves and bases
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: ECDLP on standardized binary curves via x-coordinate point decomposition
    prior_best: >-
      Matched rho with negation and Frobenius classes; within the family,
      IDEA-20260904-3c7a91 leaf-count ceiling
    time_exponent: Unchanged (constant factor mu on solver leaf count, normal basis only)
    memory_exponent: Unchanged
    hidden_cofactor: None; normal-basis construction cost charged in budget, not hidden
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BINSTD-7ab503-H1
      formal_statement: >-
        NORMAL-BASIS CONSTRAINT REALIZATION. For a toy curve with mu>1, a
        canonical-representative constraint encoding the mu-orbit in a
        constructed normal basis reduces measured UNSAT leaf count by a
        factor within [0.85,1.15] of mu, uniformly over m∈{2,3} and
        l∈{4..7}, ≥5 seeds per cell.
      random_model_justification: >-
        Rigorous: endomorphism-commutation guarantees exact orbit structure
        in the solution set. Assumed: the search tree realizes the quotient
        as cleanly as WDSat's m! constraint (sparse, coordinate-local
        variables fire early — same strong-backdoor argument as
        IDEA-20260904-3c7a91). Transfer: none beyond tested m,l.
      supporting_results:
        - ref: IDEA-20260904-3c7a91
          provenance: internal
          claim: >-
            No-above-leaf-pruning law N_conf=(1±ε)2^{ml}/|G|; mechanism
            extended here to a second symmetry group.
        - ref: IDEA-20260922-7ab503
          provenance: internal
          claim: Mechanism, census, and H1 prediction stated.
      validation_experiment_ids:
        - EXP-BINSTD-cfa7cf
      falsification_condition: >-
        normal_basis_leaf_ratio outside [0.85,1.15]/mu with a passing
        unconstrained-arm counter (3c7a91 band held); OR certificate-set
        inequality at any brute-forceable cell.
    - id: HEUR-BINSTD-7ab503-H2
      formal_statement: >-
        POLYNOMIAL-BASIS NON-REALIZATION. In the polynomial basis the
        program's tooling uses, the SAME constraint construction realizes
        leaf-count reduction strictly below mu and, at tested toy scale,
        within [0.8,1.2] of 1 (no measurable gain).
      random_model_justification: >-
        Rigorous ingredient: none proved; Frobenius matrix in an arbitrary
        polynomial basis is generically dense. Classical imitation:
        late-propagation of dense substitution clauses under 3c7a91's law.
        A ratio matching or beating the normal-basis result is the
        surprising headline (recorded as O-POLY-REALIZES-MU).
      supporting_results:
        - ref: IDEA-20260904-3c7a91
          provenance: internal
          claim: Late-propagation mechanism for dense F-set-like clauses.
      validation_experiment_ids:
        - EXP-BINSTD-cfa7cf
      falsification_condition: >-
        polynomial_basis_leaf_ratio matches or beats normal_basis_leaf_ratio
        (H2 false in the favourable direction — report as headline, not
        silently absorb).

  structural_ingredients:
    - description: >-
        Absolute Frobenius as cyclic shift in a normal basis of F_{2^n}/F_2.
      citation: >-
        Lidl and Niederreiter, Finite Fields (chapter on normal bases) —
        textbook; one-line derivation in IDEA-20260922-7ab503 is
        self-contained.
      provenance: recalled
      verified_by: null
      role: coordinate representation of x→x^2
    - description: No-above-leaf-pruning / leaf-count law for CNF-XOR PDP cores.
      citation: IDEA-20260904-3c7a91
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-7ab503; design 2026-10-02)
      role: baseline leaf-count law extended by H1/H2
    - description: >-
        BINSTD curve audit parameters and subfield_scan.py (parser-bug
        diagnosis target).
      citation: analysis/binstd-curve-audit/binary-curve-params.txt
      provenance: internal
      verified_by: coordinator (design session 2026-10-02; path present on main)
      role: census substrate / regression fixture
    - description: >-
        q-power Frobenius invariant-ring rewriting (disjoint lever; scope
        excludes standardized curves).
      citation: RQ-FROB-7d8dd4
      provenance: internal
      verified_by: coordinator (cited via IDEA-20260922-7ab503)
      role: nearest known mechanism; distinguished, not re-derived
    - description: RQ-BINSTD reachability-table decision target.
      citation: ledger/questions/RQ-BINSTD-b6f698.yaml
      provenance: internal
      verified_by: coordinator (design session 2026-10-02)
      role: decision target / population

  reduction_chain:
    core_problem: >-
      Corrected Frobenius-stabilizer census + measured basis-dependent
      encodability of the mu-orbit constraint at toy scale.
    corollaries:
      - problem: >-
          IDEA-20260922-493606 cheap m=4 Koblitz cell (arity affordability
          arithmetic that assumes H1's mu-fold gain).
        reduction_ref: >-
          Internal prerequisite named in IDEA-20260922-493606 mechanism —
          not a published reduction.
        asymptotics_preserved: >-
          Constant-factor only; no exponent transferred.

  predictions:
    - metric: frobenius_stabilizer_mu_census
      direction: flat
      minimum_effect: >-
        Matches corrected census: mu=n on FIPS/SECG Koblitz; mu|k on five
        c2pnb; mu=1 on every pseudorandom row (primary-source re-derivation
        preferred; OpenSSL secondary disclosed).
    - metric: normal_basis_leaf_ratio
      direction: lower
      minimum_effect: within [0.85,1.15] of 1/mu on Koblitz-shaped toy cells
    - metric: polynomial_basis_leaf_ratio
      direction: different
      minimum_effect: >-
        Strictly above normal-basis ratio and within [0.8,1.2] of 1
        (pre-registered prior); matching normal-basis is the surprise.
    - metric: null_curve_leaf_ratio
      direction: flat
      minimum_effect: within [0.9,1.1] of 1 in either basis
    - metric: certificate_set_equality
      direction: flat
      minimum_effect: exact multiset equality at every brute-forceable cell
    - metric: cyclic_shift_identity_pass_rate
      direction: flat
      minimum_effect: 1.0 on ≥10^5 samples per toy field
    - metric: endomorphism_commutation_pass_rate
      direction: flat
      minimum_effect: 1.0 on ≥10^5 point pairs per toy curve

  test_boundary:
    instances:
      - koblitz_shaped: 'n∈{13,17}, a,b∈F_2, mu=n'
      - composite_shaped_toy: 'n=16·k for small k (e.g. k=3) with a,b∈F_{2^{16}} analogue'
      - null_mu1: 'matched (n,l) pseudorandom-shaped mu=1'
      - perturbed_ab: 'one-bit perturbation of (a,b) off fixed subfield'
      - census_rows: 'six FIPS/SECG Koblitz + five c2pnb + pseudorandom audit rows'
    parameters:
      m_values: [2, 3]
      l_values: [4, 5, 6, 7]
      n_primary: [13, 17]
      seeds_per_cell: 5
      sample_field_elements: 100000
      sample_point_pairs: 100000
      leaf_ratio_band_normal: [0.85, 1.15]
      leaf_ratio_band_poly_near_one: [0.8, 1.2]
      null_ratio_band: [0.9, 1.1]
    implementation: >-
      experiments/EXP-BINSTD-cfa7cf/implementation/ (stdlib preferred;
      may reuse experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py
      patterns and lane CNF-XOR/WDSat instrumentation cited from
      IDEA-20260904-3c7a91 / b40e6d / 7fd218 lineage; no Magma/Sage/cypari2
      as the success path).
    budget:
      maximum_runs: 24
      total_cpu_hours_advisory: 8
      wall_clock_seconds_advisory: 14400

  falsification_conditions:
    - Cyclic-shift identity fails on any sampled normal-basis element.
    - σ^d(P+Q)≠σ^d(P)+σ^d(Q) on any sampled pair where a^{2^d}=a, b^{2^d}=b.
    - Primary-source re-derivation of Koblitz/composite A,B contradicts the census.
    - Constrained certificate set differs from unconstrained at any brute-forceable cell.
    - normal_basis_leaf_ratio outside [0.85,1.15]/mu with passing unconstrained counter.
    - null_curve (mu=1) control shows leaf-count change beyond [0.9,1.1].
    - Claiming break / exponent / n≥131 attack from this contract.

  interpretation_limits:
    - >-
      Predicted gain is a CONSTANT (mu), never an exponent; matched rho's
      advantage is unaffected.
    - >-
      Normal-basis arm is conditional on constructing an affordable normal
      basis at the tested n; failure to construct is O-IMPEDIMENT-BASIS,
      not negative evidence against mu.
    - >-
      Census for pseudorandom rows rests on audit evidence unaffected by
      the hexblob parser bug; Stage 0 still re-derives Koblitz/composite
      from primary text when reachable without AUXIN.
    - >-
      Timeouts/crashes/budget aborts are failed_infrastructure (AGENTS.md
      rule 5), never refutation of H1/H2 or the endomorphism identity.
    - >-
      Nothing here is a security statement about any deployed curve.

  distinguishable_outcomes:
    - id: O-SUPPORT-H1-H2
      meaning: >-
        Census matches; cyclic-shift + endomorphism pass; normal-basis
        ratio in band; poly-basis near 1; null no-op; certificates equal
        → unlock IDEA-20260922-493606 design; fill Frobenius-stabilizer
        reachability column.
    - id: O-POLY-REALIZES-MU
      meaning: >-
        polynomial_basis_leaf_ratio matches/beats normal-basis — H2 false
        in the favourable direction; headline positive for the existing
        pipeline; still unlocks 493606 if normal (or poly) arm holds.
    - id: O-REFUTE-H1
      meaning: >-
        Normal-basis ratio outside band with sound certificates and
        passing unconstrained counter.
    - id: O-UNSOUND
      meaning: Certificate-set inequality — constraint unsound; withdraw positive reading.
    - id: O-NULL-FAIL
      meaning: mu=1 control not a no-op — constraint doing something other than Frobenius.
    - id: O-CENSUS-CORRECT
      meaning: >-
        Stage-0 census correction alone committed; Stages 1–3 blocked by
        named instrument/basis impediment — still a durable reachability-
        table deliverable.
    - id: O-IMPEDIMENT-BASIS
      meaning: >-
        Normal basis not constructible at tested n within budget;
        measured quantity recorded; not math evidence against mu.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative math evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
