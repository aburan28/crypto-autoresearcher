# =============================================================================
# H-GFPN-256b80 — specified from IDEA-20261006-77b06b (bytes copied
# unchanged from origin/design/hyper-79cb0a-prym, blob
# f3b8032bc975ecd34aaaf3e16bc4df691f56bc90). Question RQ-GFPN-c01af8.
# The prediction under test is the idea's own: M3/M2 on E2 is at most
# 1/4, and M2(E2)/M2(E0) lies in the closed interval [1/2, 2]. The
# concrete negative is that M3/M2 on E2 is greater than 1/4 while the
# cross-curve M2 ratio lies inside that interval. This record does not
# move Gaudry's exponent 8/5 or rho's exponent 5/2, and it does not
# recompute the opened figures 2^142 or 2^130.
# =============================================================================
hypothesis:
  id: H-GFPN-256b80
  question_id: RQ-GFPN-c01af8
  source_idea_ids:
    - IDEA-20261006-77b06b
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Monomial-count ratio of the 2-torsion coordinate against elementary
    symmetric S_5 is at most 1/4 on one toy quintic extension of F_11
  statement: >-
    Let f be the first monic irreducible quintic over F_11 in the
    frozen lexicographic order, and let F = F_11[z]/(f). Let E2 be
    the first nonsingular short-Weierstrass curve over F, in the
    frozen lexicographic order of (A, B), that has an F-rational
    point of order 2, with (A, B) not both zero. Let E0 be the first
    nonsingular curve over F, in the same order, with no F-rational
    point of order 2 and with (A, B) not both zero. Let M2 be the
    number of distinct monomials in the elementary-symmetric form of
    the 5-summand summation polynomial, after descent to F_11, and
    let M3 be the same count after the substitution t = X + b/X
    coming from that order-2 point, in the coordinate that places
    the point at X = 0. The prediction taken from
    IDEA-20261006-77b06b is that M3/M2 on E2 is at most 1/4, and
    that M2(E2)/M2(E0) lies in the closed interval [1/2, 2]. The
    concrete negative is that both M2 counts are at least 1, the
    cross-curve ratio lies inside [1/2, 2], and M3/M2 on E2 is
    strictly greater than 1/4. A ratio equal to 1/4 meets the
    prediction and is not the negative. This cell does not move the
    opened Gaudry exponent q^{8/5} at n = 5, and it does not move
    rho's exponent q^{5/2}.
  mechanism: >-
    The tracked objects are two generator supports of one summation
    polynomial on one curve that has a rational order-2 point, plus
    the elementary-symmetric support on a second curve that does not.
    The operation set is permutation of the five summands, and, on
    E2 only, the involution X |-> b/X. Elementary symmetric
    polynomials discard order. The coordinate t = X + b/X discards
    the pair {X, b/X}. Both discards are lossy. M3 is the support
    after the second discard. M2(E0) is the support with that
    discard unavailable. A ratio M3/M2 strictly greater than 1/4,
    with the two M2 counts within a factor 2, is the negative
    observation that the extra discard did not shrink the generator
    support by the predicted factor. A zero M2 leaves the ratio
    undefined and is not a confirmation.
  assumptions:
    - F_11 has at least one monic irreducible quintic. The first in the frozen order is fixed before any monomial is listed.
    - A rational point of order 2 is an affine F-point T = (r, 0) with 2T = O. Nonsingular means 4 A^3 + 27 B^2 is not 0.
    - After the shift X = x - r, the translation constant is b = 3 r^2 + A. If that constant is 0, the substitution t = X + b/X is undefined and the cell is unmeasured.
    - Grevlex is fixed before the generators are expanded. Monomial count is the number of distinct monomials with nonzero coefficient, before any Gröbner basis.
    - The same summand count, 5, is used on E2 and on E0.
  proof_search_map:
    bottleneck: >-
      The generator-support ratio M3/M2 at five summands on one
      degree-5 extension of F_11, which IDEA-20261006-77b06b isolates
      from any Gröbner degree and from any word-operation estimate.
    baseline_embedding:
      parameter_slice: >-
        p' = 11, extension degree 5, five summands, grevlex, one
        curve with a rational order-2 point and one curve without.
        The threshold 1/4 and the closed interval [1/2, 2] are the
        pre-registered band.
      reproduction_check: >-
        A second expansion, with the resultant variables taken in
        the opposite order and then sorted in the same grevlex, must
        reproduce both monomial sets. Disagreement voids the cell.
    observation_collision:
      observable: the triple (M2(E2), M2(E0), M3(E2))
      distinct_preimage_search: >-
        Record whether two distinct exponent vectors in the
        elementary-symmetric generators collapse to one monomial
        after like terms are summed. If no cancellation of a whole
        monomial occurs, record that each surviving monomial had a
        single source term on this cell.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          the coordinate t = X + b/X on the shifted model of E2
        predicted_gain: >-
          M3/M2 at most 1/4. No change to the Gaudry exponent 8/5.
    quantifier_order: >-
      For this one quintic, this one E2, and this one E0, the ratio
      M3/M2 is at most 1/4 and the cross-curve M2 ratio lies in
      [1/2, 2], when both M2 counts are at least 1. A universal
      quantifier over all quintics and all curves is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        The two ratios on this cell. They do not prove a
        word-operation estimate and do not change an exponent.
      nearby_object_control: >-
        E0, which has no rational order-2 point, so M3 is absent
        there rather than zero. Its M2 count is the instrument that
        checks the two curves are matched. A cross-curve ratio
        outside [1/2, 2] means M3/M2 is not interpreted.
    proof_obligations:
      - claim: Both M2 counts and M3 are reported as integers, or the cell is unmeasured.
        responsibility: size
      - claim: The second expansion agrees on the monomial set.
        responsibility: correctness
      - claim: A ratio M3/M2 strictly greater than 1/4 is a negative for the threshold, not a confirmation.
        responsibility: scope
    not_applicable_reason: >-
      The map applies to this one-cell monomial count. No subfield is
      waived. The cell is not a theorem about Gaudry's exponent.
  rerandomization: >-
    No re-randomizing walk is used. The quintic and both curves are
    the first objects in a frozen order. Nothing pulls a discrete
    logarithm back to an input point.
  asymptotic_claim:
    problem: >-
      generator monomial count of one 5-summand summation polynomial
      on one degree-5 extension of F_11
    prior_best: >-
      Opened KR-IC-46d822 gives the heuristic Gaudry exponent
      2 - 2/n = 8/5 in q at n = 5. Opened KR-IC-e2d81b records a
      designer estimate of at least 2^142 and a figure near 2^130
      whose applicability to ecGFp5 the row calls unexamined. Rho
      remains exponent n/2 = 5/2 in q. This hypothesis moves none of
      those figures.
    time_exponent: '8/5, unchanged'
    memory_exponent: >-
      unchanged. The stored object is the generator support at
      p' = 11. Linear algebra is not run.
    hidden_cofactor: >-
      The n! and summation-degree pieces inside Gaudry's Õ are not
      measured. This cell has no o(1) attack term because no attack
      is run.
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against the opened Gaudry exponent is 1.
      claim_kind is filled so the non-claim is explicit. A ratio of
      monomial counts is not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        On one degree-5 extension of F_11, passing from elementary
        symmetric polynomials in five x-coordinates to the 2-torsion
        coordinate t = X + b/X multiplies the generator monomial
        count by at most 1/4 on the first curve that has a rational
        order-2 point, while the elementary-symmetric count itself
        stays within a factor 2 of the same count on the first curve
        that lacks that point. The factor 1/4 imitates a uniform
        collapse of a (Z/2)-orbit of size at least 4 on the
        monomials. It is not a semi-regular degree prediction.
      random_model_justification: >-
        Translation by a rational order-2 point is an involution on
        the shifted x-coordinate when b is not 0. KR-IC-955fd6,
        opened, states that small-order torsion shrinks decomposition
        systems. It does not state the factor 1/4 at p' = 11.
        KR-IC-e2d81b, opened, records large-field estimates and does
        not give this ratio. The factor is the pre-registered
        minimum effect from IDEA-20261006-77b06b.
      supporting_results: []
      validation_experiment_ids:
        - EXP-GFPN-c84e7d
      falsification_condition: >-
        Both M2 counts are at least 1, M2(E2)/M2(E0) lies in the
        closed interval [1/2, 2], and M3/M2 on E2 is strictly
        greater than 1/4. That observation refutes the factor on
        this cell. It does not refute Gaudry's exponent.
  structural_ingredients:
    - description: >-
        S_m vanishes when points with those x-coordinates sum to the
        identity, up to signs. Degree 2^{m-2} in each variable. The
        count here uses five summands and does not treat the decision
        to use summation polynomials as the result.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
        on 2026-10-06
      role: the summation polynomial whose support is counted
    - description: >-
        S_m symmetry and small-order torsion shrink point-decomposition
        systems. The opened row records an estimate near 2^130 word
        operations and does not state a monomial ratio at p' = 11.
      citation: KR-IC-955fd6
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
        on 2026-10-06
      role: the torsion substitution being counted, not a new symmetrization
    - description: >-
        For fixed n, Gaudry decomposition on E(F_{q^n}) is heuristic
        Õ(q^{2-2/n}). At n = 5 that exponent is 8/5.
      citation: KR-IC-46d822
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
        on 2026-10-06
      role: unchanged time exponent
    - description: >-
        The opened ecGFp5 row records a designer estimate of at least
        2^142, an O(C·p^2) Joux–Vitse figure with p^2 = 2^128, and a
        figure near 2^130 whose applicability to ecGFp5 is unexamined.
      citation: KR-IC-e2d81b
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-e2d81b.yaml
        on 2026-10-06
      role: fence around a word-operation reading of the ratio
    - description: >-
        Odd-characteristic cover attacks are a different construction.
        No covering curve is computed in this cell.
      citation: KR-IC-5ea2f8
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
        on 2026-10-06
      role: fence around a cover-attack reading
  reduction_chain:
    core_problem: >-
      one monomial-count ratio at five summands on a degree-5
      extension of F_11
    corollaries: []
  predictions:
    - metric: monomial_ratio_M3_over_M2_on_E2
      direction: lower
      minimum_effect: The ratio is at most 1/4.
    - metric: monomial_ratio_M2_E2_over_M2_E0
      direction: different
      minimum_effect: The ratio lies in the closed interval [1/2, 2].
  test_boundary:
    instances:
      - the first monic irreducible quintic over F_11 in the frozen order
      - the first qualifying E2 and the first qualifying E0 over that extension
    parameters:
      field_base: 11
      extension_degree: 5
      summand_count: 5
      monomial_order: grevlex
      threshold: '1/4'
      band: '[1/2, 2]'
    implementation: >-
      Freeze f, then E2, then E0, by the lexicographic rules in
      EXP-GFPN-c84e7d. Expand the elementary-symmetric generators on
      both curves and count monomials. On E2 only, expand the
      t = X + b/X generators and count again. Repeat with the
      opposite resultant order. Do not run a Gröbner basis and do
      not build a cover.
    budget:
      cell: one quintic, one E2, and one E0
      maximum_runs: 1
  falsification_conditions:
    - >-
      Both M2 counts are at least 1, M2(E2)/M2(E0) lies in [1/2, 2],
      and M3/M2 on E2 is strictly greater than 1/4. That is the
      concrete negative.
    - >-
      Both M2 counts are at least 1 and M2(E2)/M2(E0) lies outside
      [1/2, 2]. The curves are then not matched, and M3 is not
      attributed to the torsion coordinate.
    - The two expansions disagree. The counts are void.
  interpretation_limits:
    - p' = 11, one quintic, two curves. No transfer to p = 2^64 - 2^32 + 1.
    - A ratio at most 1/4 is not a 128-bit statement and does not move the exponent 8/5.
    - M3 absent on E0 is the definition of that arm, not a measured zero.
    - Cover-attack genus is not computed. No Gröbner basis is computed.
    - This count does not decide whether the symmetries behind the opened ~2^130 figure apply to ecGFp5.
    - If either M2 is 0, the ratio is undefined and the threshold is not confirmed.
    - If b = 3 r^2 + A is 0, or no irreducible quintic exists, or no E2 or E0 exists, the cell is unmeasured. That outcome is not a ratio and not the negative.
