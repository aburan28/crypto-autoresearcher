hypothesis:
  id: H-TTN-806b84
  question_id: RQ-TTN-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-049ed4
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. Semaev summation polynomials S_m for m at most 6 over prime fields at
    three prime sizes, constructed and evaluated two ways - the dense symbolic
    composed resultant currently implemented in the harness, and the explicit
    chi(m)-term rank-1 Sylvester-multiset factorization of the bond tensor
    already extracted and self-checked in EXP-TTN-002. Claim tier toy. NO ATTACK,
    NO ECDLP EXPONENT, NO SOLVING-DEGREE CLAIM.
    THE CLAIM. Counting FIELD OPERATIONS rather than wall time, constructing and
    evaluating S_m through the exact chi(m)-term factorization costs strictly
    less than the dense composed resultant at some m at most 6, at all three
    prime sizes, and the crossover is not reproduced by a random tensor of the
    same shape and the same nominal rank. Equivalently, the fitted
    construction-cost exponent of the factored route is below the dense
    reference exponent of approximately 1.979 recorded in the EV-TTN-002 context.
    WHY THIS IS A LEGITIMATE CLAIM AND WHAT IT IS NOT. The factorization is a
    LOSSLESS re-representation. A lossless change of representation cannot create
    structure and cannot move an exponent by itself, and the parent proposal says
    so plainly. Its only possible value is COST - an exponentially smaller exact
    representation of the same object may be cheaper to build and to feed to the
    solver. That is the only claim made. H-TTN-001 was rejected_scoped on RECALL
    UNDER TRUNCATION, which is a different question from exact construction cost;
    this hypothesis proposes no truncation and asserts no negligible directions.
    A measured non-improvement is a first-class deliverable - it is the
    obstruction argument the closure standard wants, and it closes the lane on a
    measurement rather than on a gate that was never the right question.

  mechanism: >-
    EV-TTN-001 measured exact F_p bond ranks 3, 6, 15 at m equal to 3, 4, 5 where
    full rank would be 3, 25, 81, identical in all 27 cells and field-size
    independent with beta 0.000000. EV-TTN-002 confirmed chi(6) equal to 45 with
    a CONSTRUCTIVE upper bound of 45 explicit rank-1 terms, extraction
    self-checked, plus a certified rank-45 minor in 9 of 9 cells. The closed-form
    law chi(m) equal to C(2^{m-3}+2, 2) grows like d^2/2 in the per-variable
    degree d equal to 2^{m-2}, while the dense coefficient array of the composed
    resultant has (d+1)^m entries. The factored representation is therefore
    exponentially smaller in m BEFORE any evaluation question is asked.
    The open question is whether that smallness survives into two costs that
    nobody has counted. (a) CONSTRUCTION - contracting one bond composes two
    factorizations, the term count multiplies before reduction, and the reduction
    back to chi(m+1) terms is the step whose cost is unmeasured. That reduction is
    exactly where such savings usually die. (b) INTERFACE - the downstream solver
    consumes S_m by specialisation at factor-base coordinates and by
    resultant/Groebner input preparation, and a construction win can be erased
    entirely at that interface if the solver needs the dense form anyway.
    Both are field-operation counts on artifacts EXP-TTN-002 already produced and
    self-checked, which is why the design is a measurement rather than a
    derivation.

  assumptions:
  - >-
    The 45-term extraction in EXP-TTN-002's ttn2_bond_rank_cert.sage is reusable
    as a constructive routine and not only as a certificate. If it is not, that is
    an instrumentation cost and the record's cost arm is void until repaired.
  - >-
    A dense baseline at m equal to 6 can be obtained, or is honestly recorded as
    censored. EV-TTN-002's dense symbolic S_6 probe was censored at 150 seconds,
    so there is currently NO m equal to 6 dense reference at all; a censored cell
    is infrastructure, never a win for the factored route.
  - >-
    Field-operation counting is instrumented at a level that both routes share,
    so the comparison is not a comparison of two different accounting conventions.

  proof_search_map:
    not_applicable_reason: null
    bottleneck: >-
      The per-contraction reduction back to chi(m+1) terms. Everything else is
      already committed - the rank law is measured in EV-TTN-001, the constructive
      45-term decomposition is measured in EV-TTN-002, and the dense reference
      exponent is recorded. What decides whether the exponentially smaller
      representation is a cost lever or a curiosity is the field-operation cost of
      that single reduction step, and it is the one quantity nobody has counted.
    baseline_embedding:
      parameter_slice: >-
        Setting the reduction cost to zero recovers the naive reading in which the
        factored route wins trivially by term count; setting it to the cost of
        redensifying recovers the dense route exactly. The dense composed
        resultant as currently implemented in the harness is therefore an exact
        parameter slice of the same frame, not a separate method.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE. At m equal to 3 the dense object is 3 by 3 and
        the dense route MUST win on field operations. The fixture is computed and
        frozen before any m equal to 5 or 6 number is read. A measurement in which
        the factorization wins at m equal to 3 is broken and nothing is
        reportable. Separately, the factored S_m must agree with the dense S_m
        coefficient for coefficient wherever the dense one is computable.
    observation_collision:
      observable: >-
        The pair (field-operation count to construct S_m, field-operation count to
        evaluate S_m at a factor-base specialisation), per route per m per prime.
      distinct_preimage_search: >-
        Search for a random tensor of the same shape and the same nominal rank
        chi(m) whose factored construction cost matches the genuine Semaev bond's.
        If one exists - and the null arm executes exactly this search at every
        cell - the observed saving is generic low-rank bookkeeping and does not
        identify anything about summation polynomials. Search also for two primes
        of different size with identical field-operation counts but different wall
        time, which would show the counter is measuring implementation constants
        rather than operations.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        S_m represented as a chi(m)-term rank-1 Sylvester-multiset sum rather than
        as a dense coefficient array, carried through the recursive resultant tree
        with a reduction back to chi(m+1) terms after each contraction.
      predicted_gain: >-
        Memory strictly lower by the ratio chi(m) to (d+1)^m, which is
        exponential in m and is predicted rather than measured until the run.
        Construction time predicted below the dense reference exponent of
        approximately 1.979 at some m at most 6. NO ECDLP EXPONENT IS CLAIMED and
        FINDING-PF-IC-001's standing result that the linear-algebra stage
        dominates is not disputed.
    quantifier_order: >-
      FOR the three declared prime sizes and FOR each m in 3, 4, 5, 6, THERE
      EXISTS a route (dense or factored) with the lower measured field-operation
      count, and the claim is that FOR at least one m at most 6 the factored route
      wins at ALL three prime sizes simultaneously. The order matters - a win at
      one prime size only is field-size dependence and is reported as such, not as
      a win. The claim is NOT quantified over all m; chi is a rank bound over the
      tested range only.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale, exactness-gated, field-operation-counted statement for m at
        most 6 at three declared prime sizes - the factored route costs a stated
        number of field operations, the dense route costs a stated number or is
        censored, and the random-tensor null costs a stated number. It cannot
        certify anything for m at least 7, cannot certify chi(m) beyond the tested
        range, cannot certify an end-to-end index-calculus cost, and cannot be
        read as an ECDLP exponent statement of any kind.
      nearby_object_control: >-
        The nearby object on which the desired conclusion should FAIL is a random
        tensor of the same shape and the same nominal rank chi(m), factored by the
        same routine. It has the same low rank and no Semaev structure, so a
        saving there is a saving from low rank per se. A second nearby object is
        m equal to 3, where the dense route must win by construction.
    proof_obligations:
    - claim: >-
        The factored S_m equals the dense S_m coefficient for coefficient wherever
        the dense one is computable
      responsibility: correctness
    - claim: >-
        The 45-term extraction is a constructive routine that produces the
        factorization, not merely a certificate that verifies one
      responsibility: feasibility
    - claim: >-
        The reduction back to chi(m+1) terms after each contraction costs fewer
        field operations than redensifying
      responsibility: runtime
    - claim: >-
        The factored representation occupies chi(m) rank-1 terms rather than
        (d+1)^m dense entries in measured peak memory
      responsibility: memory
    - claim: >-
        The downstream solver can consume the factored S_m without a redensifying
        step that erases the construction win
      responsibility: interface
    - claim: >-
        The measured advantage is strictly greater than the random-tensor null's
        at the same shape and nominal rank
      responsibility: strictness

  asymptotic_claim:
    problem: >-
      Construction and evaluation of the Semaev summation polynomial S_m, an
      internal subroutine of index calculus over prime fields. NOT the ECDLP
      itself, and the distinction is the point.
    prior_best: >-
      Dense symbolic composed resultant as currently implemented in the harness,
      with a construction-cost exponent recorded in the EV-TTN-002 context as
      approximately 1.979.
    time_exponent: >-
      The measured unknown. Predicted below 1.979 for the factored route; the
      contract measures it rather than asserting it.
    memory_exponent: >-
      Predicted strictly lower - chi(m) approximately d^2/2 terms against
      (d+1)^m dense entries. Measured as peak RSS and reconciled against the
      analytic term count.
    hidden_cofactor: >-
      The per-contraction reduction back to chi(m+1) terms, which is exactly the
      unmeasured quantity, plus the solver-interface cost, which can erase a
      construction win entirely. Both are disclosed here rather than hidden in an
      o(1).
    claim_kind: cofactor_improvement

  heuristic_assumptions:
  - id: HEUR-TTNX-1
    formal_statement: >-
      The rank law chi(m) equal to C(2^{m-3}+2, 2), certified for m at most 6,
      continues to hold at m equal to 7 and beyond.
    random_model_justification: >-
      None. This is an extrapolation of a measured closed form, not a
      distributional imitation, and no random model is offered for it.
    supporting_results:
    - >-
      EV-TTN-001 - exact F_p bond ranks 3, 6, 15 at m equal to 3, 4, 5, identical
      in all 27 cells and field-size independent (beta 0.000000).
    - >-
      EV-TTN-002 - chi(6) equal to 45 with a constructive 45-term upper bound and
      a certified rank-45 minor in 9 of 9 cells.
    validation_experiment_ids: []
    falsification_condition: >-
      A certified rank at m equal to 7 different from C(2^4+2, 2) equal to 153.
      NOT TESTED BY THIS EXPERIMENT - the m equal to 7 certificate is out of
      budget here, so this heuristic is UNVALIDATED and caps every claim in this
      lane at m at most 6. Any statement about m at least 7 is forbidden.

  structural_ingredients:
  - description: >-
      Tensor-network and tensor-train contraction of a recursive resultant tree,
      with bond tensors carrying rank-1 decompositions.
    citation: KN-TECH-013
    provenance: internal
    verified_by: >-
      In-repo technique entry, read directly. Cited by no ledger or experiment
      record before this one.
    role: representation and contraction machinery
  - description: >-
      The measured bond-rank law and the constructive 45-term Sylvester-multiset
      extraction at m equal to 6.
    citation: EV-TTN-001 and EV-TTN-002
    provenance: internal
    verified_by: >-
      In-repo committed evidence records with self-checked extraction, read
      directly.
    role: the exact object whose construction cost is measured

  reduction_chain:
    core_problem: >-
      Construction and evaluation of S_m as an index-calculus subroutine.
    corollaries:
    - problem: End-to-end index calculus over prime fields
      reduction_ref: >-
        NONE CLAIMED. FINDING-PF-IC-001 records that the linear-algebra stage
        dominates at the sizes measured, so a construction-stage win does not
        propagate to an end-to-end win and this contract does not assert that it
        does.
      asymptotics_preserved: false

  predictions:
  - metric: >-
      field operations to construct S_m, factored route versus dense route
    direction: lower
    minimum_effect: >-
      A crossover at some m at most 6 with the factored route strictly below the
      dense one, reproduced at all three prime sizes.
  - metric: >-
      fitted construction-cost exponent against the approximately 1.979 dense
      reference
    direction: lower
    minimum_effect: >-
      Any fitted exponent below 1.979 whose confidence interval excludes 1.979
      and that survives the random-tensor null.
  - metric: peak memory, factored route versus dense route
    direction: lower
    minimum_effect: >-
      Measured peak RSS ratio consistent with the analytic ratio chi(m) to
      (d+1)^m to within an order of magnitude at m equal to 5, where both routes
      are computable.

  test_boundary:
    instances:
    - >-
      Semaev summation polynomials S_m for m in 3, 4, 5, 6 over F_p at three
      declared prime sizes, with the genuine bond tensors and with matched random
      tensors of the same shape and nominal rank.
    parameters:
      m_values: '3, 4, 5, 6'
      prime_sizes: 'three, fixed at Stage 0 and spanning the range EV-TTN-001 used for its 27 cells'
      routes: 'dense symbolic composed resultant versus chi(m)-term rank-1 Sylvester-multiset factorization'
      null_draws: 'three random same-shape same-nominal-rank tensors per cell'
    implementation: >-
      The dense route as currently implemented in the harness; the factored route
      built on ttn2_bond_rank_cert.sage from experiments/EXP-TTN-002, promoted
      from certificate to constructive routine.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 6.0
      maximum_memory_gb: 16

  distinguishable_outcomes:
  - outcome: >-
      Factored field-operation count strictly below dense at some m at most 6 at
      all three prime sizes, with the m equal to 3 forced-value gate firing
      correctly, the exactness gate passing, and the random-tensor null NOT
      showing the same saving.
    means: >-
      The measured low rank is a construction-cost lever for S_m and not only a
      structural curiosity. It is a REPRESENTATION and CONSTRUCTION-COST result at
      m at most 6 and toy prime sizes. It is NOT a Groebner solving-degree result,
      NOT an end-to-end index-calculus result, and NOT an ECDLP exponent claim.
  - outcome: >-
      Factored construction plus evaluation costs at least as much as dense at
      every m tested, with all gates passing.
    means: >-
      The low rank buys nothing exact either. This hypothesis is false, and the
      measured field-operation counts and the located reduction-step cost are the
      obstruction the closure standard requires - a quantity with units, measured
      over the declared scope, that closes the lane properly rather than by the
      truncation gate that was never the right question.
  - outcome: >-
      The random-tensor null shows the same saving as the genuine Semaev bond.
    means: >-
      The effect is generic low-rank bookkeeping and carries nothing about
      summation polynomials. No reading of the signal arm is admissible; the
      deliverable is the corrected attribution.
  - outcome: >-
      The factored S_m disagrees with the dense S_m anywhere the dense one is
      computable, or the m equal to 3 forced-value gate reports the factorization
      winning.
    means: >-
      The extraction is not a construction, or the counter is broken. Instrument
      failure - no cost reading of any kind is admissible and the record is void
      until repaired.
  - outcome: >-
      A construction win at m equal to 5 or 6 that is erased by the measured
      solver-interface cost.
    means: >-
      The representation is cheaper to build and useless to the pipeline as
      built. That is a distinct and reportable finding, and it names the interface
      rather than the representation as the thing to attack next.

  falsification_conditions:
  - >-
    Factored construction plus evaluation costs at least as many field operations
    as dense at every m tested, at every prime size.
  - >-
    The random-tensor null shows the same saving as the genuine bond.
  - >-
    The factored S_m disagrees with the dense S_m at any coefficient where the
    dense one is computable.
  - >-
    The m equal to 3 forced-value gate reports the factored route winning, which
    means the field-operation counter is broken.
  - >-
    A measured construction win is fully erased by the measured solver-interface
    cost at the same m, which falsifies the useful form of the claim even though
    the construction number stands.

  prior_evidence_refs:
  - EV-TTN-001
  - EV-TTN-002
  - EXP-TTN-001
  - EXP-TTN-002
  - H-TTN-001
  - DEC-20260718-008
  - DEC-20260722-002
  - KN-OPEN-007
  - KN-TECH-013
  - FINDING-PF-IC-001

  interpretation_limits:
  - >-
    Toy scale, m at most 6, three toy prime sizes. No cryptographic-scale claim.
  - >-
    This is a representation and construction-cost result. It is NOT a Groebner
    solving-degree result and is not by itself an ECDLP exponent claim. Pollard
    rho at exponent 1/2 dominates the underlying problem regardless.
  - >-
    A construction-stage win does not imply an end-to-end index-calculus win.
    FINDING-PF-IC-001 records that the linear-algebra stage dominates and that
    result is not disputed here.
  - >-
    EV-TTN-001 and EV-TTN-002 are not disputed. What is disputed is KN-OPEN-007's
    Current state summary of them, which reads bond ranks near full, no
    sub-exponential chi - the opposite of what both records measured. Correcting
    that entry is a curation task for the Coordinator and is not itself an
    experimental result.
  - >-
    HEUR-TTNX-1 is UNVALIDATED. Every statement is capped at m at most 6 and no
    extrapolation to m at least 7 is licensed.
