# H-SSI-bff8d9
# Orbit-deficit census for IDEA-20261006-c7b357 at p=19.
# Toy measurement. No exponent claim.
hypothesis:
  id: H-SSI-bff8d9
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  source_idea: IDEA-20261006-c7b357
  experiment_id: EXP-SSI-db46fa
  specified_at: '2026-10-07'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261007-254d55
  title: >-
    The Galois-orbit deficit of supersingular j-invariants in F_361
    is at least 1
  statement: >-
    Let p = 19 and F_361 = F_19[z]/(z^2 - 2). Let S be the set of
    j in F_361 for which some nonsingular short-Weierstrass model
    over F_361 has exactly (19-1)^2 or (19+1)^2 points over F_361.
    Let O be the number of Frobenius orbits {j, j^19} with j in S.
    The orbit deficit is D = |S| - O. The prediction, taken from
    IDEA-20261006-c7b357 and fixed before any run, is that D is at
    least 1. The same deficit on F_19 is 0, and the deficit on
    {z, z^19} is 1. No single curve's point count is the predicted
    integer. The rho exponent stays 1/2.
  mechanism: >-
    Build one short-Weierstrass model per j, and the quadratic
    twist of that model, and keep j when either point count is
    (p-1)^2 or (p+1)^2. Collapse S by the equivalence of j with
    j^19. D counts the size-2 orbits. The recalled formula in the
    idea omitted a constant 16 in the denominator. This hypothesis
    uses j = 1728 * (4A)^3 / (16 * (4A^3 + 27 B^2)), the formula
    inverted by k = j/(1728-j). That correction does not change
    the predicted integer D.
  assumptions:
    - z^2 - 2 is irreducible over F_19, and z^19 = -z.
    - Frobenius on F_361 has order 2, so every orbit has size 1 or 2.
    - A j is in S when a nonsingular model or its quadratic twist
      has point count 324 or 400. Singular discriminants are skipped.
    - Two isomorphic models of one j contribute one element of S.
  proof_search_map:
    not_applicable_reason: >-
      This is a census of one Galois-orbit deficit at p = 19, not a
      proof about endomorphism-ring cost or path-finding cost.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  rerandomization: >-
    none: every j in F_361 is visited once. There is no walk to pull
    a solution back along.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        The set of j in F_361 whose model has point count (p-1)^2
        or (p+1)^2 is a union of Galois orbits and is not contained
        in F_19, so D = |S| - O is at least 1.
      random_model_justification: >-
        The idea imitates a random Galois-stable set that is larger
        than the rational points of the same shape. This census does
        not sample. It enumerates the field.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-db46fa
      falsification_condition: >-
        D = 0 at p = 19 while the F_19 deficit is 0 and the
        {z, z^19} deficit is 1. That falsifies HEUR-001 at p = 19
        only.
  structural_ingredients:
    - description: >-
        IDEA-20261006-c7b357 states the deficit prediction and the
        two instrument sets. This hypothesis freezes that prediction.
      citation: ledger/proposals/IDEA-20261006-c7b357.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-07 read the proposal file
      role: source claim and the predicted integer
  reduction_chain:
    core_problem: >-
      Whether D is at least 1 at p = 19 under the stated membership test.
    corollaries: []
  predictions:
    - metric: D
      direction: higher
      minimum_effect: at least 1
  test_boundary:
    instances:
      - every j in F_361 = F_19[z]/(z^2 - 2)
    parameters:
      p: 19
      membership_counts: [324, 400]
    implementation: >-
      experiments/EXP-SSI-db46fa/implementation/run.py enumerates the
      field. check.py recomputes the same integers.
    budget:
      maximum_runs: 1
      maximum_memory_gb: 1
  falsification_conditions:
    - >-
      The instrument deficits are 0 on F_19 and 1 on {z, z^19}, the
      duplicate-model sets agree, and D = 0.
    - >-
      A timeout, a crash, a square-test disagreement, a j round-trip
      failure, or a duplicate-model disagreement is not a
      falsification and not support.
  interpretation_limits:
    - D at least 1 says at least one membership j is not F_19-rational.
    - It does not produce an isogeny, an endomorphism ring, or a cost below p^{1/2}.
    - Negative evidence closes only this deficit at p = 19 under these two point counts.
    - The p = 31 repeat named in the idea is not part of this hypothesis's test.
    - The recalled point-count criterion was not re-proved. A later contradiction of it makes D a count under a stated definition, not a supersingularity theorem.
  dominated_by:
    verdict: not_applicable
    justification: >-
      The census claims no time or memory exponent. KR-RHO-13bf67
      still bounds any generic reading at Omega(sqrt(p)).
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Predicted orbit deficit at least 1 at p = 19, against deficit 0
      on F_19.
  status_note: >-
    Approved with EXP-SSI-db46fa by DEC-20261007-254d55 under the
    standing user authorization of 2026-09-06. Approval does not
    assert that D is at least 1.
