hypothesis:
  id: H-SSIQ-9e2c71
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-004
  statement: >-
    IDENTICAL TO H-SSIQ-18dc91, restated because BATCH-003 could not test it:
    on the supersingular 2-isogeny graphs built in BATCH-003 (p = 1 mod 12,
    the same 12 pre-registered primes, byte-identical construction code),
    greedy local descent on delta_E reaches the F_p-rational locus
    (delta_E = 1) in FEWER steps, as a function of graph size N, than an
    undirected random walk on the same graph: gamma_greedy < gamma_random. A
    DETECTABLE GAP is a computable delta_E-gradient in the sense of lever L4's
    revisit condition; no detectable gap means L4's obstruction stands
    unresolved by this test.
    WHAT IS NEW: delta_E is supplied by a DIRECT IN-SESSION COMPUTATION for
    each graph vertex -- a bounded, meet-in-the-middle smooth-degree isogeny
    search mirroring the archived source's own Algorithm 1-3 -- rather than by
    a WISDE cross-reference. BATCH-003's blocker (WISDE carries no per-vertex
    j-invariant linkage, confirmed by reading WISDE's own generating script)
    is bypassed entirely, not worked around: this hypothesis needs no external
    dataset for its real-label arm at all.
  statement_note: >-
    THIS IS H-SSIQ-18dc91 WITH ITS BLOCKER REMOVED, NOT A NEW HYPOTHESIS. The
    prediction, the decision logic, and the scope are unchanged; only the
    source of the delta_E label changes. A separate hypothesis id is minted
    (rather than reopening H-SSIQ-18dc91) because AGENTS.md immutability
    treats a hypothesis record as append-only once archived, and H-SSIQ-18dc91
    is already archived as analyzed under EV-SSIQ-9a0396 -- this record
    supersedes it for BATCH-004's purposes and says so explicitly rather than
    leaving the relationship implicit.
  supersedes: H-SSIQ-18dc91
  supersedes_note: >-
    H-SSIQ-18dc91 is retained unedited, per AGENTS.md immutability. Its
    real-arm prediction was never computed (analyzed, EV-SSIQ-9a0396); this
    record inherits its statement and scope unchanged and supplies the missing
    label source.
  mechanism: >-
    For each vertex (j-invariant) in the graphs BATCH-003 already built,
    compute delta_E directly: the minimal degree of an isogeny E -> E^{(p)},
    via bidirectional meet-in-the-middle search over B-smooth degrees using a
    SET OF SMALL PRIMES L = {2, 3, 5, 7, 11, 13, ...} (not just l=2), mirroring
    the archived source's Algorithm 1-3 (paper_fulltext.md lines 137-220):
    build a table of B-smooth-degree isogenies from E up to list size X,
    build the same table from E^{(p)}, and find a collision (equal target
    j-invariant) between the two tables; the collision's combined degree is an
    UPPER BOUND on delta_E, exact when the true minimal isogeny's degree
    factors within the searched smoothness bound B and list size X. If E is
    already in the delta_E=1 locus (j in F_p), delta_E=1 by the same
    mathematical identity BATCH-003 already used, requiring no search.
    This is bounded, disclosed, in-session compute -- not the full Deuring
    correspondence BATCH-003 correctly declined (curve-to-ideal reconstruction
    via KLPT-style connecting-ideal search) -- and it is the archived source's
    OWN method for finding such an isogeny, applied here as an instrument to
    LABEL a graph rather than to attack anything.
  assumptions:
    - >-
      A collision is found within the searched smoothness bound B and list
      size X for every (or nearly every) non-F_p-rational vertex in the
      pre-registered graphs, within the run's compute budget. IF THE SEARCH
      DOES NOT TERMINATE (no collision within budget) for a vertex, that
      vertex's delta_E is reported as UNRESOLVED (an upper bound on B and X
      was searched, not the exact minimal degree), not fabricated, and its
      contribution to the confirmatory metric is handled per the frozen
      contract's coverage rule (see EXP-SSIQ-a85692.controls.C-COVERAGE).
    - >-
      The computed value is an UPPER BOUND on delta_E, not a certified exact
      minimum, unless independently cross-checked. Where BATCH-003's WISDE
      fetch DOES cover a prime (which it does, for aggregate correctness
      checks only, not per-vertex labels), the delta_E=1 locus identity and
      any other independently-derivable quantity serve as a partial
      correctness oracle; full exactness is not required for the descent
      experiment, which only needs a LABEL correlated with the true delta_E,
      but any gap between the upper bound and the true value is disclosed as
      a limitation, not silently assumed away.
    - >-
      The smoothness bound B and list size X are chosen small enough that the
      search terminates within budget for graphs up to BATCH-003's pinned
      sizes (203 to 1800 vertices), and this trade-off is reported explicitly:
      a smaller B/X finds fewer exact minima and reports more upper bounds:
      C-COVERAGE reports the fraction resolved exactly (collision found) vs.
      unresolved (search exhausted without a collision) as a function of N,
      the same shape of diagnostic BATCH-003's trapped_fraction(N) used for
      greedy descent.
  proof_search_map:
    not_applicable_reason: >-
      NOT a proof-oriented hypothesis, inherited from H-SSIQ-18dc91 unchanged:
      a direct instrument-level test of whether a computable delta_E-gradient
      exists, not a proposed mechanism for lowering a hard problem's cost.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE, inherited from H-SSIQ-18dc91 unchanged. A
    detected gradient does not itself constitute a complexity claim, and the
    delta_E-computation instrument built here is a LABELLING TOOL for a
    toy-scale gradient-existence screen, not a claimed attack, not a cost
    model, and not evidence about the archived source's own complexity.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None numbered, inherited from H-SSIQ-18dc91 unchanged. The
    meet-in-the-middle search mirrors the archived source's Algorithm 2's
    STRUCTURE but this hypothesis makes no claim about the archived source's
    own success-probability heuristic (Heuristic 1) -- it uses the search only
    to LABEL a fixed, already-enumerated toy-scale graph, never at a scale or
    in a context where Heuristic 1's asymptotic content is invoked or tested.
  status: analyzed
  status_note: >-
    analyzed, set by the Coordinator per AGENTS.md rule 1 (DEC-20260805-a4e04e,
    BATCH-004). Matches the corpus convention set by H-SSIQ-18dc91 in
    BATCH-003: analyzed, not supported and not weakened, because the real-arm
    prediction (gamma_greedy < gamma_random) was never computed -- the
    delta_E-computation instrument this record introduced is independently
    confirmed to work (EV-SSIQ-94de20 O-1), but the mandatory Phase -1
    coverage gate failed before any descent test could run. The blocker is
    now understood to be substantially a CONTRACT-FORMULA defect (GD-7: the
    truncation fallback's budget check was an individual per-prime cap where
    a cumulative-prefix check against the same reserved budget admits 4-6 of
    12 primes using the identical already-committed numbers), not genuine
    infeasibility of the instrument at these toy parameters. H-SSIQ-137200
    restates this hypothesis unchanged for BATCH-005's corrected amendment,
    the same append-only pattern this record itself used against
    H-SSIQ-18dc91.
  superseded_by: H-SSIQ-137200
  superseded_by_note: >-
    H-SSIQ-137200 is IDENTICAL to this record's statement and scope,
    restated because BATCH-004 could not test it (Phase -1 gate failure, not
    a falsification). Minted separately rather than reopening this record,
    per AGENTS.md immutability, exactly as this record was minted against
    H-SSIQ-18dc91.
  scope_ceiling:
    claim_tier: toy
    detail: >-
      Toy scale, inherited from H-SSIQ-18dc91 and BATCH-003's pinned prime set:
      graphs from 203 to 1800 vertices, p up to 21601 (15 bits). The
      delta_E-computation search is itself toy-scale and its own smoothness
      bound/list size are far below anything relevant to the archived source's
      cryptographic-scale claim. No result transfers to cryptographic scale.
  why_this_test_and_not_another: >-
    It reuses BATCH-003's independently-validated infrastructure (C-CAL-GAP,
    the graph-construction pipeline) rather than rebuilding it, and it removes
    the exact and only blocker BATCH-003 found (WISDE's missing per-vertex
    linkage) by computing the needed quantity directly instead of depending on
    a dataset that does not carry it. This was DEC-20260805-cd8bcd's single
    next action and both reviewers' top-ranked BATCH-004 recommendation.
  owner: coordinator
  created_at: '2026-08-05'
