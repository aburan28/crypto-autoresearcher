hypothesis:
  id: H-MONO-572e7e
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260904-a1b81b
  status: consistent_with_s3_on_one_object_rivals_excluded_not_yet_confirmed
  added: '2026-09-04'

  status_note_2026_09_04: >-
    EXP-MONO-bb6fa1 executed, independently reviewed (Validator + Red
    Team), and decided in DEC-20260904-7dabde (evidence: EV-MONO-344589).
    R8 passed exactly. Stage 1's controls were initially reported failed
    under a flawed asymptotic tolerance (a Coordinator specification
    defect, CORR-20260904-8cc20f, independently confirmed by both
    reviewers via entirely separate code) -- corrected, both controls
    pass. Red Team then identified and excluded a previously-unnamed
    rival, G_R=C_2 (intransitive), using the already-collected R3/
    irreducible-density values (which R1 alone cannot use to separate
    S_3 from C_2, per a classical identity linking R1 and R2). With
    trivial, C_2, and A_3 all excluded on this one (curve, R), S_3 is the
    sole surviving named candidate -- consistent with, but not
    confirming, G_R=S_3. A striking exact match (R3=(p+1)/(6p)) was
    noted but not explained or promoted. Next action: a second (curve,R)
    or prime, per Red Team's own recommendation, to move toward
    confirmation.

  statement: >-
    SCOPE: m=4 only, prime fields F_p, p>3, toy scale, ONE ordinary curve
    E/F_p with j not in {0,1728}, ONE point R with T_0=x(R) off the
    declared degenerate set, at p=101 (Stage 0+1 of IDEA-20260904-a1b81b's
    own staged design; full multi-prime/multi-curve scope is named as a
    follow-up, not commissioned here). Claim tier toy for measurement,
    derivation for the reduction (E1) below.

    THE OBJECT AND THE CLAIM. Fix R, T_0=x(R). V_R = the surface of monic
    cubics g(X)=X^3-e1X^2+e2X-e3 whose roots are Galois-stable triples
    with S_4(t1,t2,t3,T_0)=0. A point of V_R(F_p) with g splitting
    completely with all roots in a factor base is exactly a Semaev m=4
    relation for R (E1, a derivation, not tested here). The Galois group
    G_R = Gal(k(W_R)/k(V_R)) <= S_3 governs the density of that event via
    Chebotarev: G_R=S_3 gives Pr[split]=1/6 (the 1/(m-1)! every Semaev
    relation-rate model in this program assumes, and which has never
    been measured); G_R<=A_3 gives Pr[split]=1/3, doubling the per-fibre
    relation rate and eliminating the 1+2 factorization type entirely.

    THE TWO-SIDED PREDICTION, PRE-REGISTERED. (I) On the tested (E,R): the
    discriminant-square rate is 0.5 (not 1.0), the density triple matches
    (1/6, 1/2, 1/3) within 3 standard errors, and BOTH mandatory nearby-
    object controls (a synthetic A_3 object, an unconstrained random-cubic
    object) pass -- i.e. the classifier demonstrably CAN see the
    difference it is being asked to detect. This confirms G_R=S_3 at this
    one (E,R), giving the 1/(m-1)! factor its first empirical footing at
    toy scale in this program. (II) The discriminant-square rate is 1.0:
    G_R<=A_3, the per-fibre relation rate is double the quasirandom model,
    and the 1+2 type is absent -- the single branch in this session's
    proposal backlog with any exponent relevance at all (conditional on
    an explicitly unvalidated transfer assumption, H3, to the F_{q^n}
    setting). (III) Neither S1 (control failure) nor S2 (m=3 baseline
    reproduction failure) may be silently absorbed: either voids the run
    as an instrument result, never mathematical evidence.

  mechanism: >-
    Reuses IDEA-20260904-a1b81b's own STEP 1-4 derivation unmodified: S_4
    restricted to the fixed-T surface descends to a genuine S_3-cover
    W_R -> V_R (STEP 1, restriction can only shrink monodromy, so G_R<=S_3
    unconditionally); G_R<=A_3 iff disc(g) is a square in the function
    field of V_R, a single decidable algebraic condition measurable as an
    empirical rate (STEP 2); V_R(F_p) is enumerable exhaustively without
    ever computing S_4 symmetrically, by iterating (e1,e2,e3) directly,
    factoring g, and evaluating S_4 at its Galois-stable root multiset
    (STEP 3, avoiding the "sample the ordered variety by mistake" trap
    the idea's own confounders section names as the single most likely
    implementation error). This hypothesis's own new content is
    committing to Stage 0 (the discriminant-square rate, the cheapest
    ~100-sigma discriminator) plus Stage 1 (the two mandatory nearby-
    object controls) plus R8 (the free m=3 baseline reproduction check)
    as a first, decisive, properly gated experiment.

  falsification_condition: >-
    Per the idea's own S1/S2/S3/S4: (S1) if the classifier reports the
    SAME density triple on the synthetic A_3 object as on the
    unconstrained random-cubic object, nothing may be reported in either
    direction -- the instrument cannot see the effect. (S2) if the m=3
    baseline slice does not reproduce DEC-20260904-8c2580's own proven
    degeneracy (residual quadratic, forced group) exactly, the pipeline
    is wrong and no m=4 output may be read. (S3) discriminant-square rate
    of 1.0 (with controls passing) falsifies outcome (I) specifically and
    confirms outcome (II). (S4) a measured triple matching NO subgroup of
    S_3's Chebotarev triple, with controls passing, is reported as an
    anomaly requiring further investigation, not forced into either
    outcome.

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-CHEB-1 (from IDEA-20260904-a1b81b's own H1): Frobenius
        classes of the residual cubic are equidistributed over G_R with
        error O(p^{-1/2}) relative, so the measured density triple at
        p=101 identifies G_R to within about 3 standard errors (~0.005),
        against a 0.5-wide S_3-vs-A_3 separation -- a design the idea's
        own text calls "over-powered by two orders of magnitude for the
        qualitative question."
      rigorous_support: >-
        Rigorous half: Lang-Weil/Weil bound for F_p-points of an
        absolutely irreducible surface and its Galois covers. Classical
        analogue already validated once in this program (EV-MONO-a0a89c
        OBS-7, random quintics vs Chebotarev(S_5)).
      validation_plan: >-
        SAMPLE: exhaustive enumeration of V_R(F_p) at p=101 for one
        (E,R), ~10^4 points expected. COMPARE AGAINST: the S_3 Chebotarev
        triple (1/6,1/2,1/3) and the synthetic A_3 control's
        (1/3,0,2/3). TAIL CHECK: the rarest class (complete splitting,
        1/6) must be present, expected count ~1700. TRANSFER ASSUMPTION:
        none at toy scale; a p-ladder decay check (R7) is named as
        follow-up scope, not this experiment's own claim.
      falsification_condition: >-
        A measured triple matching no subgroup of S_3, with controls
        passing.
    - id: H2
      statement: >-
        HEUR-IRR-1 (from IDEA-20260904-a1b81b's own H2, explicitly its
        weakest link, no rigorous support offered): W_R is absolutely
        irreducible of dimension 2 off the declared degenerate set, so
        |V_R(F_p)| = p^2(1+O(p^{-1/2})).
      rigorous_support: >-
        NONE OFFERED, per the idea's own honest disclosure. This is a
        free byproduct check (compare the ONE measured |V_R(F_p)| against
        the Weil envelope), not a separately-run validation.
      validation_plan: >-
        SAMPLE: |V_R(F_p)| itself from the same Stage-0 enumeration.
        COMPARE AGAINST: p^2 with a Weil envelope of 3p^{3/2}.
      falsification_condition: >-
        |V_R(F_p)| outside the Weil envelope on the single tested (E,R).

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE. No algorithm or attack is proposed; a constant
      factor in a relation-rate model is measured (1/6 expected, 1/3
      under the alternative). Moves no exponent at fixed m
      (DEC-20260802-a51c82's own scope wording).
    memory_exponent: O(1) beyond a counter vector; the p^3-point enumeration streams.
    best_known: Pollard rho, O(sqrt(N)) time, O(1) memory (KN-OPEN-001), untouched in either direction at prime-field scale.

  claim_boundary_and_test_boundary: >-
    Tests ONLY Stage 0 (the discriminant-square rate and density triple)
    plus Stage 1 (mandatory nearby-object controls) plus R8 (m=3 baseline
    reproduction), on ONE curve and ONE R at p=101. Does NOT test the
    full multi-prime/multi-curve/multi-R scope (Stage 2), the CM-vs-
    ordinary comparison (Stage 3), the factor-base membership factor
    (the OTHER half of the relation rate), the solve cost, or the
    F_{q^n} transfer (H3, explicitly unvalidated). Does not close
    KN-OPEN-009 or authorize any status change per that record.

