hypothesis:
  id: H-ICEX-652b0d
  question_id: RQ-ECDLP-002
  statement: >-
    For a declared, frozen panel of cheap projections of E(F_p) that contains no
    division polynomial - the identity, the Kummer quotient, the quadratic and
    d-th power residue symbols, top and bottom bit windows, x mod small m, the
    twist-side coordinate map, the r-adding walk partition index and a
    non-algebraic factor-base window - the one-step propagation defect
    D(pi) = H(pi(X + Y) | pi(X), pi(Y)) in BITS equals the closed-form
    random-relabelling null for that projection's fiber-size profile to within
    0.05 bits, at every tested prime and every depth k <= 8, with the sole
    exception of the Kummer quotient, whose defect is exactly 1.000 bit against a
    null of 2.000 bits. No panel member has survival depth above 0.
  mechanism: >-
    IDEA-20260807-df906f's prime-order congruence rigidity theorem forecloses the
    exact regime - on a group of prime order, any v admitting F with
    v(R + R prime) = F(v(R), v(R prime)) is injective or constant - so no lossy
    projection on <P> has defect 0 and the search is not for a defect-0
    projection. The measurable question is where in (0, null] each member sits,
    and the reported observable is the GAP BELOW THE NULL rather than the
    distance above zero. Because the null is computable in closed form from the
    fiber-size profile alone, every arm carries an arithmetic reference value
    rather than a second noisy run.
  assumptions:
  - >-
    n prime, so there is no subgroup structure to confound the group operation
    and the rigidity theorem applies.
  - >-
    Every panel member is computable in O(1) field operations. A projection
    costing more than a group operation cannot help a walk and is excluded rather
    than approximated.
  - >-
    The closed-form null depends only on the fiber-size profile, which is
    computed exactly rather than sampled.
  - >-
    Panel and estimator are frozen before measurement. No member is added and no
    correction is changed after the data is seen.
  - >-
    BAND NON-DEGENERACY FOR THE TWIST-SIDE MEMBER, ADDED BY THIS CONTRACT. The
    source idea declares P7 as the twist-side bit chi(x^3 + a x + b) and predicts
    it must show zero information gain as a lossless trap distinct from the
    identity. Read against the object - for every R in E(F_p) other than
    2-torsion, x(R)^3 + a x(R) + b is a nonzero square, so that bit is CONSTANT
    on <P>. Its defect and its null are then both 0.000 BY CONSTRUCTION, the gate
    has zero width, and no alternative could move it. This contract therefore
    splits the member. P7a is the constant twist-side bit, recorded as a PROOF -
    a constant map on <P> whose defect and null are both identically zero, with
    no discriminating power and no outcome that is an elliptic-curve statement.
    P7b is the P^1 coordinate map R maps to x(R), which on E/{plus minus 1} is a
    bijection onto its image and is therefore informationally the Kummer map, with
    forced value D = 1.000 bit against a null of 2.000 bits, EQUAL to P1 rather
    than 0. The change is stated rather than absorbed.
  - >-
    BAND NON-DEGENERACY FOR THE FACTOR-BASE WINDOW, ADDED BY THIS CONTRACT. For
    the window indicator on [0, B) the closed-form null is the binary entropy
    H_2(B/n) bits. At B = p^{1/2} and n about 2^16 that is about 0.037 bits, so
    the pre-registered rule a member below the null by at least 0.15 bits CANNOT
    FIRE at that B - the statistic has less range than the threshold. The
    contract therefore runs a B ladder and admits the 0.15-bit rule only in cells
    whose closed-form null is at least 0.30 bits; at n about 2^16 that means
    B = n/2 (null 1.000 bits), B = n/4 (null 0.811 bits) and B = n^{3/4} (null
    about 0.337 bits). The cryptographically interesting B = p^{1/2} window is
    reported as UNDERPOWERED at N = 10^7 with its computed power, never as a null
    result; resolving a 50 percent relative deficit there needs about N = 1.1e8,
    roughly eleven times the declared sample budget, and that is stated rather
    than the claim being quietly shrunk.
  proof_search_map:
    bottleneck: >-
      Not computational but evidentiary. df906f settles the EXACT regime by
      theorem. What no record settles is the PROBABILISTIC regime for the
      projections an attack actually uses - the walk partition index and the
      non-algebraic factor-base window. Those two numbers are the bottleneck.
    baseline_embedding:
      parameter_slice: >-
        The binary lossy-projection test is the boundary case D = 0 versus
        D > 0, and the rigidity theorem says the D = 0 side contains only
        injective and constant maps. Every hand verdict the protocol has produced
        must be reproduced by the functional at that boundary.
      reproduction_check: >-
        Frozen fixtures - the identity returns 0.000; the Kummer quotient returns
        exactly 1.000 by the unordered-pair argument on the biquadratic
        differential-addition relation; and on a deliberately COMPOSITE-order
        group the reduction to the large-prime part is lossy AND exactly
        propagating and must return 0.000 against a nonzero closed-form null, the
        slice where rigidity's hypothesis is dropped.
    observation_collision:
      observable: The propagation defect D_k(pi) in bits, reported with the fiber size.
      distinct_preimage_search: >-
        The identity, lossless and useless because nothing is discarded, and a
        hypothetical perfect tracked object, lossy and deterministic, both return
        0. Defect alone does not identify usefulness, so the reported observable
        is the PAIR (D_k, log2 of fiber size). Rigidity sharpens this - a large
        second element forces a positive first element, so a reported pair of
        (0, large) is a proof of implementation error.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold D_k fixed and vary the fiber size; the distinguishing invariant is
        the compression ratio log2|<P>| over log2|S|.
      predicted_gain: >-
        No cost gain. The gain is that a lossless re-coordinatisation cannot be
        mistaken for a tracked object, which is the failure mode P7b is planted
        to catch.
    - transform: stronger_invariant
      proposed_object: >-
        The k-step defect vector (D_1 through D_8) rather than D_1 alone, since a
        projection can be one-step-lossy and still multi-step-usable if the
        ambiguities fail to compound.
      predicted_gain: >-
        Diagnostic only - the difference between propagates and propagates far
        enough to matter.
    quantifier_order: >-
      FOR ALL pi in the declared panel and FOR ALL k <= 8, D_k(pi) equals the
      closed-form null within the declared margin, EXCEPT the Kummer quotient and
      its re-coordinatisation, for which D_1 = 1.000 exactly. The existential this
      record CANNOT settle is THERE EXISTS a projection outside the panel with
      defect below the null; the panel is finite and declared, so a null over it
      refutes nothing about projections in general.
    method_ceiling:
      strongest_certifiable_claim: >-
        A scoped statement - over exactly the declared projections, six primes
        from 2^16 to 2^28 and k <= 8, the measured propagation defect matches the
        closed-form random-relabelling null within the declared margin in the
        cells whose null is at least 0.30 bits. It can NEVER certify that no cheap
        projection of E(F_p) leaks.
      nearby_object_control: >-
        The Kummer quotient, which genuinely propagates at exactly 1 bit, and the
        composite-order group with its large-prime-part projection, where a lossy
        projection propagates EXACTLY. A method that cannot separate either pair
        has not identified the load-bearing structure.
    proof_obligations:
    - claim: On a prime-order group every exactly-propagating projection is injective or constant.
      responsibility: correctness
    - claim: The Kummer defect is 1 bit exactly, from the biquadratic differential-addition relation.
      responsibility: correctness
    - claim: The random-relabelling null defect is a closed form in the fiber-size profile.
      responsibility: baseline
    - claim: Miller-Madow-corrected plug-in entropy has bias below 0.01 bits at N = 1e7 for every panel fiber profile.
      responsibility: correctness
    - claim: D_{k+1} <= D_k + D_1, with the realised gap reported rather than assumed.
      responsibility: strictness
    - claim: The composite-order fixture returns 0, confirming primality is what the theorem uses.
      responsibility: feasibility
    - claim: A null over a finite declared panel establishes nothing about projections outside it.
      responsibility: scope
    - claim: A cell whose closed-form null is below the decision threshold is underpowered, not null.
      responsibility: feasibility
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      ESTIMATOR ADEQUACY. FOR ALL panel members with fiber-size profile f and FOR
      ALL k <= 8, the Miller-Madow-corrected plug-in estimator of D_k over
      N = 1e7 samples has bias below 0.01 bits and bootstrap standard error below
      0.02 bits, at the tested primes.
    random_model_justification: >-
      The rigorous half is the standard plug-in entropy bias bound of order
      (|S| - 1) / (2 N ln 2) with the Miller-Madow correction. The heuristic half
      is that the empirical support size behaves like the nominal one, which fails
      exactly when a member has heavy-tailed fibers.
    supporting_results:
    - >-
      Plug-in entropy bias bound with Miller-Madow correction, standard, used as
      the rigorous half of the estimator claim.
    validation_experiment_ids:
    - EXP-ICEX-7caca4
    falsification_condition: >-
      Measured bias above 0.01 bits or standard error above 0.02 bits for any
      member at N = 1e7, in which case that member reports an interval only and
      is excluded from comparison at the declared margin.
  - id: HEUR-002
    formal_statement: >-
      SAMPLING SUFFICIENCY. FOR ALL panel members at primes above the enumerable
      range, uniform sampling of (X, Y) from <P> yields a defect estimate
      differing from the exhaustive value by below 0.02 bits.
    random_model_justification: >-
      At the small end of the sweep <P> IS enumerable, so sampled and exhaustive
      values are directly comparable; the heuristic is only that the agreement
      observed there persists upward.
    supporting_results:
    - >-
      Direct exhaustive-versus-sampled comparison at the two smallest primes,
      performed inside this experiment.
    validation_experiment_ids:
    - EXP-ICEX-7caca4
    falsification_condition: >-
      An exhaustive-versus-sampled difference above 0.02 bits for any member at
      the small primes, forbidding comparison of sampled values at larger primes.
  - id: HEUR-003
    formal_statement: >-
      TOY-TO-CRYPTO SIGN TRANSFER. FOR ALL panel members, the fitted trend of
      (D_k - null_k) against log p is flat within the measurement interval, so
      the SIGN rather than the magnitude of the gap is stable in log p.
    random_model_justification: >-
      NONE beyond a recalled square-root-cancellation expectation for character
      sums over curve points. This is the weakest assumption in the record. The
      direction of the toy-scale bias is disclosed - at 16 to 24 bits a
      small-codomain projection's image is a far larger fraction of <P> than at
      256 bits, which biases the measurement TOWARD apparent propagation, that is
      toward a FALSE POSITIVE, so a toy-scale null is the conservative outcome.
    supporting_results:
    - >-
      Square-root cancellation for character sums over points of elliptic curves,
      recalled only, and relied on for no quantitative bound.
    validation_experiment_ids:
    - EXP-ICEX-7caca4
    falsification_condition: >-
      Any member whose (D_k - null_k) shows a monotone trend in log p with a
      confidence interval excluding zero, confining its result to the tested
      primes.
  structural_ingredients:
  - description: >-
      PRIME-ORDER CONGRUENCE RIGIDITY, read verbatim from IDEA-20260807-df906f -
      on a group of prime order, if v propagates exactly, that is if there is any
      F, not necessarily computable or associative, with v(R + R prime) =
      F(v(R), v(R prime)), then v is injective or constant. Hence no
      exactly-propagating lossy tracked object exists on <P> and every surviving
      candidate is forced into the probabilistic regime. Priority for the theorem
      and for the propagation-defect instrument concept belongs to that record.
    citation: IDEA-20260807-df906f
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, claim and ladder sections read directly)
    role: forecloses the defect-zero branch and defines the regime
  - description: >-
      The division-polynomial residue ladder v_L(R) = (psi_ell(x(R)))_{ell in L}
      with L = {3, 5, 7, 11, 13} and degrees 4, 12, 24, 60, 84. EXCLUDED from
      this panel by construction so the two records stay disjoint.
    citation: IDEA-20260807-df906f
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, definition read verbatim)
    role: the object family this panel deliberately avoids
  - description: >-
      Character sums over the points of an elliptic curve over F_p are
      square-root cancelling, which is why the character-based members are
      EXPECTED to match the null. Pointer only; no bound relied on
      quantitatively.
    citation: Weil and Bombieri character-sum bounds over curves; Kohel-Shparlinski and Lange-Shparlinski on character sums over points of elliptic curves
    provenance: recalled
    verified_by: null
    role: null-side expectation
  reduction_chain: null
  predictions:
  - metric: forced_value_controls_identity_kummer_p1_coordinate_and_composite_fixture
    direction: different
    minimum_effect: >-
      FORCED, with closed-form magnitudes computed before the run. The identity
      returns 0.000 +/- 0.01 against a null of 0.000. The Kummer quotient returns
      1.000 +/- 0.01 against a closed-form null of 2.000 bits, a gap of exactly
      1.000 bit - this is the planted defect of known size, it is 50 estimator
      standard errors at 0.02 bits, and it is 6.7 times the 0.15-bit decision
      threshold, which is what demonstrates the instrument's dynamic range. The
      P^1 coordinate map returns 1.000 +/- 0.01, equal to the Kummer value. The
      composite-order fixture returns 0.000 +/- 0.01 against a nonzero null of
      about 2 log2(cofactor) bits.
  - metric: propagation_defect_d1_per_panel_member_minus_closed_form_null_in_bits
    direction: different
    minimum_effect: >-
      All members other than the Kummer pair predicted to match the null within
      0.05 bits. A member below the null by at least 0.15 bits, reproducible at
      two primes and surviving the structural tell, is the positive signal - but
      the 0.15-bit rule applies ONLY in cells whose closed-form null is at least
      0.30 bits.
  - metric: survival_depth_per_panel_member
    direction: different
    minimum_effect: >-
      Predicted 0 for every member except the Kummer pair, which is unbounded at
      1 bit per step. Any other member with depth at least 2 is a lead.
  - metric: k_step_defect_gap_below_the_chain_rule_bound
    direction: lower
    minimum_effect: >-
      A member whose D_8 sits at least 0.5 bits below 8 times D_1 has
      non-compounding ambiguities and is a lead even if D_1 matches the null.
  - metric: walk_partition_defect_against_partition_count_r
    direction: higher
    minimum_effect: >-
      The closed-form null is exactly log2(r), that is 4.000, 5.000 and 6.000
      bits at r = 16, 32 and 64, so the measured defect must RISE with r toward
      those values. A defect flat in r is the artifact signature. The 2-bit range
      across the r ladder is the demonstrated dynamic range of this member.
  - metric: closed_form_versus_simulated_null_disagreement
    direction: lower
    minimum_effect: >-
      Below 0.02 bits, reported BEFORE any signal is read. A larger disagreement
      means the fiber-profile arithmetic or the estimator is wrong.
  - metric: factor_base_window_cell_power
    direction: different
    minimum_effect: >-
      Reported per B. Cells whose closed-form null H_2(B/n) is below 0.30 bits
      are reported as UNDERPOWERED with their computed power and are never
      reported as matching the null.
  test_boundary:
    instances:
    - six primes from 2^16 to 2^28 with the curve order prime, three curves per prime
    - N = 1e7 sampled pairs per member per curve
    parameters:
      panel: frozen before measurement, division polynomials excluded
      depths: k from 1 to 8
      partition_counts: [16, 32, 64]
      window_sizes: >-
        B in {n/2, n/4, n^{3/4}, n^{1/2}}
      power_residue_degrees: >-
        d in {3, 5, 7}, restricted to those d dividing p - 1
      bit_window_widths: [1, 2, 4, 8]
      small_moduli: [3, 5, 7, 11]
    implementation: >-
      Vectorised field arithmetic with streaming Miller-Madow-corrected plug-in
      entropy estimation and bootstrap intervals; exact fiber-size profiles
      computed rather than sampled.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 16
      maximum_runs: 60
  falsification_conditions:
  - >-
    The Kummer quotient does not return 1.000 +/- 0.01 bits. The estimator cannot
    detect exact multivalued propagation and the run is void.
  - >-
    The identity returns a nonzero defect, or the P^1 coordinate map does not
    return 1.000. The estimator manufactures signal from a lossless
    re-coordinatisation and the run is void.
  - >-
    The composite-order fixture does not return 0.000. The estimator cannot see
    exact propagation even where it provably exists.
  - >-
    Any LOSSY panel member returns 0.000, which contradicts the rigidity theorem
    and is an implementation error until independently replicated; degenerate
    fiber occupancy is the likeliest cause and the fiber profile is reported at
    every cell so it is caught rather than believed.
  - >-
    The simulated null disagrees with the closed-form null by more than 0.02 bits.
  - >-
    Estimator bias against synthetic known entropy exceeds 0.01 bits for a member,
    demoting it to an interval-only result.
  - >-
    Exhaustive and sampled defects differ by more than 0.02 bits at the small
    primes, forbidding comparison of sampled values against the null.
  - >-
    Every panel member matches the null within 0.05 bits at every depth and every
    prime, in the cells where the null is at least 0.30 bits. THIS IS THE
    EXPECTED OUTCOME and it is a measured obstruction, not a failure.
  - >-
    The walk-partition defect is flat in r, marking the measurement an artifact.
  - >-
    Any member's gap trends monotonically in log p with a confidence interval
    excluding zero, refuting HEUR-003 for that member.
  interpretation_limits:
  - >-
    TOY TIER. Every number is scoped to the six primes, three curves per prime,
    the declared panel members and k <= 8. HEUR-003 is the transfer assumption and
    it is weak by construction.
  - >-
    A null over the panel is NOT a closure over projections in general. What IS
    general is df906f's theorem, which belongs to that record.
  - >-
    THE CLOSED-FORM NULL IS A CURVE-FREE OBJECT - Z/n with a random bijective
    relabelling preserving each member's fiber-size profile, in which no curve
    appears. CONSEQUENCE PRE-STATED - a member matching its null establishes only
    that the projection behaves like a fiber-matched projection of a generic
    cyclic group and is NOT an elliptic-curve statement; and a below-null gap
    reproduced by the Z/n object at matched fiber profile is a fiber-geometry
    artifact and may not be quoted as an elliptic-curve or ECDLP statement.
  - >-
    The constant twist-side bit is recorded as a PROOF rather than as an arm - it
    is identically +1 on <P> away from 2-torsion, so its defect and its null are
    both zero by construction, it has no discriminating power, and no outcome on
    it is an elliptic-curve statement.
  - >-
    The factor-base window at B = p^{1/2}, which is the cryptographically
    interesting one, is UNTESTABLE AT THE DECLARED SAMPLE BUDGET - its closed-form
    null of about 0.037 bits at n about 2^16 is below the estimator's own standard
    error at N = 1e7, and about N = 1.1e8 would be needed. That cell is reported
    as underpowered with its computed power and is never reported as a null result.
  - >-
    Defect zero alone does not mean useful; the (defect, fiber size) pair is the
    reported observable, and the identity is the standing reminder of why.
  - >-
    The Kummer result is a known constant-factor sqrt(2) in rho and is NOT a lead.
    It is the calibration that prices what any other member's defect would be
    worth.
  - >-
    Panel members are not independent - the bit-window and small-modulus members
    all read the integer representative of x - so a shared artifact would appear
    in several members at once and must not be counted as replication.
  status: proposed
  proposed_by: coordinator
