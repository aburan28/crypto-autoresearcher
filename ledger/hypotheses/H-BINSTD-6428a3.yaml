# =============================================================================
# H-BINSTD-6428a3 -- HOLD-R supersession: absolute Frobenius has no
# per-instance symmetry-breaking form; Lemma A2 needs its signed qualifier;
# C1 loss law and A2-prime coincidence census at toy n in {17,23,31}.
# Specified from IDEA-20261001-93e740 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-ff7924.
#
# HOLD-X5 (IDEA-20260926-9c5694 / EXP-CERTBIN-a14350 on PR #1565) designed
# separately without folding this Stage-2 census; DEC-20260929-7257b2 next_gate
# allowed either fold or standalone — this card opens the standalone
# zero-solver EXP-BINSTD contract. Supersedes IDEA-20260922-7ab503 content
# (already designed as EXP-BINSTD-cfa7cf on the withdrawn per-instance reading);
# original 7ab503 not edited. ZERO RUNS in this design packet. No AUXIN.
# No Bedrock. Claim tier: control / toy. No attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-6428a3
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-93e740
  supersedes_idea: IDEA-20260922-7ab503
  experiment_id: EXP-BINSTD-0e0666
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-ff7924
  status: approved
  proposed_by: coordinator
  title: >-
    On Koblitz toys at m=2, n in {17,23,31}, every common x-tuple of Sol(R,V)
    and Sol(sigma^j R,V) is of halving form (Lemma A2-prime); N_coinc matches
    the H1 Poisson mean; setwise Frobenius closure of Sol(R,V) is empty;
    global C1 survival is exactly 1/n; C1 all-lost fraction matches binomial
    thinning — never the withdrawn per-instance symmetry of 7ab503

  statement: >-
    CLAIM (control / toy; HOLD-R supersession; NO ATTACK). Setting: Koblitz
    toys E/F_{2^n} with a,b in F_2 (b=1), n in {17,23,31} (n=41 arithmetic
    only); G a prime-order subgroup with r^2 not dividing #E and G meeting
    E(F_2) only in O; sigma the absolute Frobenius acting as scalar lambda
    of order n on G; V an F_2-subspace of dimension l; m=2; Sol(R,V) the set
    of unordered x-tuples in V^m with S_{m+1}(x_1,...,x_m,x(R))=0 (sign-free
    systems as every solver in this program builds). (A) EQUIVARIANCE.
    Coordinatewise squaring maps Sol(R,V) bijectively onto Sol(sigma R,
    sigma V); on a stable V onto Sol(sigma R, V) — a different instance.
    7ab503's claim that the shift is a per-instance search-tree symmetry is
    withdrawn. (B) NO PER-INSTANCE FROBENIUS SYMMETRY-BREAKING CONSTRAINT.
    Ceiling: IDEA-20260926-9c5694 Proposition Sigma (stabiliser S_m), cited
    not re-proved. A canonical-representative rule C1 on ONE instance is
    unsound. Sound Frobenius symmetry breaking is gauge fixing of the
    n-target orbit system (divisor n cancels; see IDEA-20261001-e740ce (A)).
    (C) LEMMA A2-PRIME. t in Sol(R,V) and Sol(sigma^j R,V) iff a nonempty
    proper signed sub-sum of its legs is a half of (1 - s lambda^j) R.
    At m=2: one leg satisfies 2 P_1 = (1 - s lambda^j) R and the other is
    R - P_1. Such tuples are sporadic, not a group action; they make
    a77711's "no common tuple" false as a prediction. (D) C1 LOSS LAW.
    Global survival of C1 over all (R,t) incidences is exactly 1/n.
    Under equivariance+H2 a target with s solutions loses all of them with
    probability (1-1/n)^s (~0.94 at n=17 for s=1); withdrawn per-instance
    symmetry predicts all-lost fraction 0. (E) STRUCTURAL CELLS. Stable
    dimensions from ord_n(2): n=17 dims {8,9}; n=23 {11,12}; n=31 {5j,5j+1};
    ECC2K-130 and K-163 host no nontrivial index-calculus stable V. CLAIM
    TIER: control / toy. NO Magma/Sage/AUXIN. Pure-Python group arithmetic
    census; missing field/curve build → O-IMPEDIMENT, never evidence.

  mechanism: >-
    OBJECT FRAME. Representation R1: x-coordinate in a fixed F_2-basis and
    the x-tuple of a decomposition. Operation set Sigma_op = <leg
    permutations, negation, sigma> acting on (instance, tuple) pairs, NOT
    on one instance. Trichotomy: partial-action (Class I). sigma acts on the
    family {I(sigma^j R, sigma^j V)} and moves the target, so on one
    instance it is no action. LOSSY-PROJECTION TEST: (R,t) -> C_n-orbit is
    lossy (n to 1) and deterministic under sigma; restricted to fixed R it
    is undefined — algebraic reason C1 is unsound, zero compute. Lemma
    A2-prime is a second projection test: the x-only projection forgets
    signs, and what it forgets is exactly what lets conjugate instances
    share an x-tuple. PRICE: gauge fixing costs O(n) field ops per tuple;
    C1 costs the same and loses the fraction of (D).

  assumptions:
    - >-
      Koblitz toys only (a,b in F_2, b=1), n in {17,23,31} for measurement;
      n=41 arithmetic-only. G admitted at setup: r prime, r^2 not dividing
      #E, r not dividing #E(F_2). If #E/h is not prime, largest prime-order
      subgroup used and cofactor recorded.
    - lambda determined at setup by checking [lambda]P = sigma(P) on a generator of G.
    - m=2 for every measured arm. Lemma A2-prime stated for all m>=2; only m=2 counted.
    - >-
      OFF-LIMITS: F2 (factor-base decomposition) as the family; F6
      (endomorphism orbit) as the named operation set only. No new factor
      base. No run at n>=131; deployed rows enter only via claim-(E) ord_n(2).
    - >-
      HOLD-X5 (IDEA-20260926-9c5694 / EXP-CERTBIN-a14350) measures
      conjugate-ATTEMPT correlation on non-stable bases and proves the
      stabiliser; this card measures same-tuple coincidences and C1 loss —
      shared instruments possible, designed as standalone per next_gate.

  heuristics:
    - id: H1
      statement: >-
        COINCIDENCE COUNT. For a Koblitz toy with no Cayley accident, any V
        of dimension l and m=2, N_coinc (triples (x(R),t,j) with t in both
        Sol(R,V) and Sol(sigma^j R,V)) is approximately Poisson with mean
        mu = (n-1) kappa |F_V|^2 / (2 #E), kappa = Pr_{P in F_V}[2P in G].
      rigorous_support: >-
        RIGOROUS: Lemma A2-prime reduces every coincidence to x(P_2) in V
        with P_2 a fixed nonzero scalar multiple of a factor-base point;
        halving route visits each coincidence exactly four times.
        HEURISTIC: when k not in <-1,lambda>, x([k]P) for P in F_V lands in
        V with probability |F_V|/#E independently across (P,j,s) — random-map
        model for scalar multiplication on x-coordinates.
      falsification_condition: >-
        N_coinc = 0 on every n=17 and n=23 base (design means 4..22); OR
        N_coinc outside its Poisson 99% interval on two or more bases with
        no Cayley accident flagged.
      validation_plan: >-
        SAMPLE all of G at n=17 (five bases) and n=23 (two stable bases);
        all of F_V at n=31 by the halving route plus 200-target sample for
        closure/C1. COMPARE against Poisson 99% intervals of measured mu.
        TAIL: per-(j,s) breakdown. TRANSFER: none beyond tested cells.
    - id: H2
      statement: >-
        INDEPENDENT THINNING. Under equivariance, for each decomposable
        target the C1 rule independently keeps each solution with
        probability 1/n, so the all-lost fraction equals sum_s w_s (1-1/n)^s
        with w_s the measured solution-count distribution.
      rigorous_support: >-
        RIGOROUS: global survival identity of claim (D) is exact (free C_n
        action on incidences). HEURISTIC: per-target independence of which
        orbit representative is canonical under the chosen total order.
      falsification_condition: >-
        C1 all-lost fraction at or below 0.5 at n=17 with fixture F0
        passing; OR all-lost fraction outside 3 binomial SE of the
        thinning prediction on two cells.
      validation_plan: >-
        Measure w_s and all-lost fraction for C1 and for a random-hash
        filter at rate 1/n; compare. Both tuple orders (necklace,
        polynomial-integer) run.

  heuristic_note: >-
    Lemma A2-prime, claim-(D) identity, setwise-closure emptiness under
    Proposition Sigma, and fixture F0 equalities are exact. H1 and H2 are
    the only heuristics. Expected headline is A2-prime + C1 loss ~0.9 at
    n=17, falsifying both a77711's zero-coincidence prediction and
    7ab503's per-instance symmetry.

  predictions:
    - metric: coincidence_halving_form_fraction
      direction: exact
      minimum_effect: >-
        EXACTLY 1.000 on every cell and base. One common tuple not of
        halving form falsifies Lemma A2-prime or the instrument.
    - metric: N_coinc per cell and base
      direction: different
      minimum_effect: >-
        Inside the two-sided 99% Poisson interval of
        mu=(n-1) kappa |F_V|^2/(2 #E) with |F_V|,#E,kappa measured at
        setup. Design figures (|F_V|=2^l, AC-9 orders): n=17 (a=1) mu=4.0
        at l=8 and 16.0 at l=9; n=23 mu=5.5/22.0 at l=11/12; n=31
        mu=7.5/30.0 at l=15/16. Zero summed over n=17+23 (design mean >40)
        falsifies H1 toward a77711's original statement.
    - metric: setwise_closure_count
      direction: exact
      minimum_effect: >-
        EXACTLY 0 on every cell. One nonempty Sol(R,V) closed under some
        sigma^j revives per-instance Frobenius symmetry; headline, replicate.
    - metric: c1_global_survival_fraction
      direction: exact
      minimum_effect: EXACTLY 1/n. Any deviation is instrument defect, not a result.
    - metric: c1_all_lost_fraction
      direction: higher
      minimum_effect: >-
        Within 3 binomial SE of sum_s w_s (1-1/n)^s. About 0.9 at n=17.
        Withdrawn per-instance symmetry predicts exactly 0; any value
        above 0.5 at n=17 refutes it.
    - metric: null_over_koblitz_coincidence_rate
      direction: same
      minimum_effect: >-
        Ratio within the joint Poisson 99% interval of 1. Coincidences are
        sign-pattern events and need no endomorphism.

  test_boundary: >-
    Toy n in {17,23,31}, m=2, pure-Python group-arithmetic census (brute
    Sol + halving route), Koblitz + ordinary-curve null, stable /
    window / random bases. Nothing transfers to m>=3 counts (structural
    statement only), n=41 beyond arithmetic, deployed curves, cost, or
    any IC-vs-rho claim. Stage 0 is zero compute. Stage 2 at n=17 alone
    is the cheapest valid discriminator. Narrows HOLD-R's remaining
    uncertainty; does not re-prove Proposition Sigma.

  falsification_criteria:
    - >-
      A common tuple not of halving form, confirmed by exact group
      arithmetic: Lemma A2-prime false or instrument wrong; nothing else
      read until resolved.
    - >-
      N_coinc = 0 on every n=17 and n=23 base: H1 fails toward a77711's
      original zero; re-examine claim (C).
    - >-
      N_coinc outside Poisson 99% interval on two or more bases with no
      Cayley accident: H1 independence model wrong.
    - >-
      A target whose nonempty Sol(R,V) is closed under some sigma^j:
      per-instance Frobenius symmetry exists; Proposition Sigma contradicted
      at that cell; headline, replicate, then review-adversarial.
    - >-
      C1 all-lost fraction at or below 0.5 at n=17 with fixture passing:
      equivariance plus H2 wrong about the loss of the unsound rule.
    - >-
      Global C1 survival other than 1/n, or fixture F0 failure: instrument
      defect; run void; no evidence either way.

  distinguishable_outcomes:
    - id: O-A2PRIME
      label: lemma_a2_prime_and_c1_loss_confirmed
      when: >-
        Halving-form fraction = 1.0; N_coinc inside H1 bands on n=17/23;
        setwise_closure_count = 0; C1 survival = 1/n; all-lost within
        thinning band; null/Koblitz rate ~1; F0 passes.
    - id: O-ZERO
      label: a77711_original_zero_coincidences
      when: N_coinc = 0 on every n=17 and n=23 base with F0 passing.
    - id: O-SYMMETRY
      label: per_instance_frobenius_symmetry_revived
      when: setwise_closure_count > 0 on a stable base (replicated).
    - id: O-NOLOSS
      label: c1_all_lost_near_zero
      when: >-
        C1 all-lost fraction <= 0.5 at n=17 with F0 passing (withdrawn
        per-instance reading survives on the loss metric).
    - id: O-MODEL
      label: h1_poisson_model_fails
      when: >-
        N_coinc outside 99% bands on >=2 bases, no Cayley accident, F0
        pass, halving-form fraction = 1.0, closure = 0.
    - id: O-ARTIFACT
      label: instrument_or_soundness_defect
      when: Fixture F0 fail, non-halving common tuple, or C1 survival != 1/n.
    - id: O-IMPEDIMENT
      label: infrastructure_stop
      when: >-
        Field/curve build failure, timeout, OOM, or other infrastructure
        failure. Never negative mathematical evidence (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      Whether any Frobenius-derived constraint on ONE fixed-target instance
      is sound (HOLD-R's remaining uncertainty), and whether a77711 Lemma A2
      holds for the sign-free systems this program builds.
    baseline_embedding:
      parameter_slice: >-
        Stable-base slice at n=17, V = F_2 + ker f_i(sigma) (dim 9), where
        Proposition T collapses to the known GGMP statement: decomposing
        sigma R over V is decomposing R over V transported by squaring.
      reproduction_check: >-
        Frozen fixture F0, before any count is read. (i) Squaring maps every
        certified tuple of Sol(R,V) into Sol(sigma R, sigma V) on all of G
        at n=17. (ii) Brute-force coincidence set equals halving-route set
        tuple-by-tuple on all of G at n=17 for every base. (iii) Global C1
        survival fraction equals 1/n exactly on every stable base.
    observation_collision:
      observable: A tuple t in both Sol(R,V) and Sol(sigma^j R,V) for some 0<j<n.
      distinct_preimage_search: >-
        Three preimages. (i) Per-instance symmetry (Sol closed under sigma^j)
        — withdrawn. (ii) Halving coincidence of claim (C). (iii) Instrument
        sign/lift bug. Separated by: every common tuple re-tested for the
        halving identity; set-level closure tested separately; ordinary-curve
        null shows the sign-pattern count with no endomorphism.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The x-tuple held fixed while its sign pattern varies — the fibre
          a77711's signed argument forgot; yields Lemma A2-prime.
        predicted_gain: None in cost. A corrected lemma and a pre-registered count.
      - transform: stronger_invariant
        proposed_object: >-
          The signed point tuple, on which a77711 Lemma A2 is exact. Later
          uses of A2 (Proposition Sigma, check (iii), freeness) read in
          signed form.
        predicted_gain: None in cost. Removes a false zero-count prediction.
    quantifier_order: >-
      Lemma A2-prime: FOR ALL Koblitz E, FOR ALL V, FOR ALL m>=2, FOR ALL R
      in G\{O}, FOR ALL 0<j<n, the characterisation of claim (C) holds
      (exact). Claim (D): FOR ALL stable V and FOR ALL total orders, global
      survival = 1/n (exact). H1/H2 claimed only FOR the tested cells.
      Proposition Sigma cited with 9c5694's own quantifiers, not extended.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the n=17, 23 (and sampled 31) Koblitz toys at m=2, every tuple
        common to Sol(R,V) and Sol(sigma^j R,V) is of halving form, counts
        agree with the H1 Poisson mean, no Sol(R,V) is closed under any
        sigma^j, global C1 survival is exactly 1/n, and the per-target
        all-lost fraction matches binomial thinning." Certifies nothing
        about cost, m>=3 counts (structural only), n=41 beyond arithmetic,
        or any deployed curve.
      nearby_object_control: >-
        Three, all blocking. (i) Ordinary-curve null (RC-1 over n=17 field,
        b not in F_2). (ii) Random-hash filter keeping each tuple at rate
        1/n. (iii) Polynomial window and seeded random V' of same dimension
        (non-stable bases).
    proof_obligations:
      - claim: sigma maps G onto G and acts as a scalar of order exactly n.
        responsibility: correctness
      - claim: Lemma A2-prime, both directions, with D nonempty and proper.
        responsibility: correctness
      - claim: Global 1/n survival identity of claim (D).
        responsibility: correctness
      - claim: Halving route enumerates every coincidence exactly four times.
        responsibility: size
      - claim: >-
          Cayley-accident check — for each (j,s), k_{j,s}=(1+s lambda^j)/(1-s lambda^j)
          mod r tested for membership in <-1,lambda>; members reported
          separately, never folded into H1.
        responsibility: strictness
      - claim: Proposition Sigma is cited, not re-proved.
        responsibility: interface
      - claim: No sentence states a speedup, exponent move, or deployed-curve verdict.
        responsibility: scope
    not_applicable_reason: null

  confounders:
    - >-
      Abscissa density of a structured V may differ from 1/2
      (IDEA-20260926-cafcf1); mu uses measured |F_V|, never 2^l.
    - Cofactor h changes kappa (1 at h=2, 1/2 at h=4); recomputed per curve.
    - >-
      Cayley accidents: if k_{j,s} in <-1,lambda>, every P_1 in F_V on a
      stable V gives a coincidence in that channel — reported separately.
    - Small counts (means 4..30) give wide Poisson intervals; cells pooled only after each passes alone.
    - Tuple order defining C1 (necklace vs polynomial-integer) may correlate with V; both orders run.

  interpretation_limits:
    - Toy tier, m=2, n in {17,23,31}. n=41 arithmetic only. Lemma A2-prime is general; only m=2 count tested.
    - Proposition Sigma cited as ceiling, not re-proved or extended.
    - Pointer for HOLD-X5: 9c5694 reproduction check (iii) would find halving coincidences at its n=17 cell — edits nothing there.
    - Nothing about ECC2K-130, K-163, or any deployed curve beyond claim-(E) ord_n(2).
    - Halving coincidences are not a resource; count per target ~2^{2l-2n} n has no cost reading.
    - Approval does not assert the hypothesis is true.

  claim_tier: control
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
