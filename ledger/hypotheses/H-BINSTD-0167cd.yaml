  statement: >-
    The n list is 17, 23, and 31. The floor of 17 over 8 is 2, and
    the floor of 17 over 4 is 4, so the inclusive window has 3
    integers. The floor of 23 over 8 is 2, and the floor of 23 over
    4 is 5, so the window has 4 integers. The floor of 31 over 8 is
    3, and the floor of 31 over 4 is 7, so the window has 5
    integers. The product of 3, 4, and 5 is 60. Three times 20 is
    60. Sixty minus 60 is 0. Twenty minus 1 is 19. Twenty-three
    minus 17 is 6, and 31 minus 23 is 8. Six times 8 is 48. Sixty
    minus 48 is 12. Four times 5 times 7 is 140. Two times 2 times
    3 is 12. One hundred forty minus 12 is 128. The product of 19,
    128, and 12 is 29184. Seventeen plus 23 plus 31 is 71.
    Seventeen times 23 times 31 is 12121. The remainders of 17, 23,
    and 31 on division by 8 are 1, 7, and 7, and their product is 49.
  mechanism: >-
    The proposal writes n in 17, 23, 31, a pair floor of 20, a
    median threshold of 1, and dimension windows from the floor of
    n over 8 to the floor of n over 4. This contract checks those
    integers. It does not build a basis.
