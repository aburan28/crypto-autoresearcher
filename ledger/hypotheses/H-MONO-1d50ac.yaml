hypothesis:
  id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  status: proposed

  statement: >-
    SCOPE: prime fields F_p, non-singular short-Weierstrass curves, m=4
    exactly, toy scale. Claim tier toy for every measurement; H-MONO-45183a's
    own Part B closed form remains a derivation, cited as such, not
    re-derived here.

    THE HYPOTHESIS. H-MONO-45183a's own
    `proof_search_map.observation_collision.residual_collision_risk` names,
    in its own words, an explicit and unresolved test: "If two curves with
    identical (N, tau) but different endomorphism rings gave different
    measured rates, the derivation would be incomplete." Part B derives an
    EXACT closed form for the m=4 root-multiplicity collision rate --
    6(tau-1)/N -- as a function of (N,tau) ALONE, under HEUR-COIN-1. That
    closed form contains no term for the curve's endomorphism ring, CM
    discriminant, or j-invariant, and this specific prediction -- that a CM
    curve and a generic ordinary curve at the SAME (N,tau) collide at
    EXACTLY the same rate -- has never been tested against a genuine matched
    pair.

    THIS IS THE EXACT QUESTION KN-OPEN-009 ASKS. KN-OPEN-009 names "an
    exceptional family (e.g. CM curves)" with "imprimitive/smaller
    monodromy, giving curve-specific relation-rate deviations" as one live
    resolution. H-MONO-45183a Part A already shows the GROUP is the same
    ((Z/2)^(m-2)) for CM and ordinary curves alike -- an unconditional,
    group-theoretic derivation. What Part A cannot see is whether a curve's
    finer arithmetic (its endomorphism ring, beyond what N and tau already
    encode) enters the DISTRIBUTION of which sign classes collide -- exactly
    the gap between "the group is uniform" (already shown) and "the RATE is
    uniform" (Part B's own untested conditional).

    PRE-REGISTERED, TWO-SIDED PREDICTION. (A) A CM curve and an ordinary
    curve at a matched (N,tau) cell show collision rates agreeing with each
    other and with 6(tau-1)/N within the same statistical tolerance the
    closed form already achieves on ordinary curves alone -- corroborating
    Part B's completeness beyond what its own designed panel tests. (B) The
    CM curve's measured rate differs materially from the ordinary curve's at
    the SAME (N,tau) -- falsifying the (N,tau)-only completeness of Part
    B's closed form and identifying, concretely and for the first time in
    this lane, a curve-specific relation-rate deviation of exactly the kind
    KN-OPEN-009 asks about.

  mechanism: >-
    Reuses H-MONO-45183a's own Part B derivation (B-1 collision criterion,
    B-2 branch probabilities) and HEUR-COIN-1's sampling construction
    unmodified; the only new content is a matched-pair search and a direct
    curve-to-curve comparison design.
    (1) SEARCH: at a declared range of toy primes, find at least one CM
    curve (identified by j in {0,1728} or a small disclosed discriminant --
    deliberately INCLUDED here as the object of study, not excluded as an
    automorphism artifact) and at least one generic-ordinary curve sharing
    the IDENTICAL (N,tau) = (#E(F_p), Z+1) pair. This is a Stage-0,
    near-zero-compute step; whether such a pair exists at all within the
    declared range is itself a reportable, falsifiable fact.
    (2) MEASURE: for each of the two matched curves independently, construct
    a factor base by HEUR-COIN-1's identical declared sampling construction,
    draw >=20,000 admissible m=4 tuples, and measure the empirical
    root-multiplicity collision rate, reproducing that curve's own
    G6/G7-predicted rate before any comparison is read (exactly 0 if tau=1;
    6(tau-1)/N within 3 binomial standard errors otherwise).
    (3) COMPARE: compare the two curves' measured rates directly against
    EACH OTHER (not merely each independently against the shared closed
    form) via a two-sample test at matched sample sizes -- a strictly
    stronger, more direct test than independent agreement with a formula
    that does not depend on endomorphism ring by construction.
    (4) REPLICATE: repeat at a second matched pair if a second prime's
    search succeeds, to check any observed agreement or disagreement is not
    an artifact of the single tested (N,tau) cell.

  proof_search_map:
    bottleneck: >-
      Whether the m=4 collision rate depends on anything beyond (N,tau) --
      the single unresolved conditional H-MONO-45183a's own audit names.
      Part A's group-theoretic uniformity does not decide this; only a
      direct curve-to-curve measurement at a genuinely matched (N,tau) cell
      can.
    baseline_embedding:
      parameter_slice: >-
        H-MONO-45183a's own already-specified predictions G6 (tau=1, rate
        exactly 0) and G7 (tau=2,4, rate 6/N, 18/N) are the exact parameter
        slice this hypothesis's measurement step must reproduce,
        independently, on BOTH matched curves, before the direct comparison
        is interpreted.
      reproduction_check: >-
        Each matched curve must independently reproduce its own
        G6/G7-predicted rate using the SAME sampling code, before the
        curve-to-curve comparison is read.
    observation_collision:
      observable: The measured m=4 root-multiplicity collision rate, as a function of the curve.
      distinct_preimage_search: >-
        Part B's closed form claims (N,tau) is a SUFFICIENT preimage-
        determining pair for this observable -- i.e. it predicts NO
        distinction between a CM curve and an ordinary curve at the same
        (N,tau). This hypothesis searches for exactly the pair that would
        refute that: two curves with identical (N,tau) and DIFFERENT
        endomorphism rings. If found and their rates agree, the prediction
        survives a genuine test it had not yet faced; if their rates
        disagree, the observable is shown to be less lossy than Part B
        claimed.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (N,tau) fixed and vary the forgotten structure
          (endomorphism ring / CM discriminant), directly testing whether an
          intrinsic curve invariant beyond (N,tau) separates the resulting
          collision rates.
        predicted_gain: >-
          If a separation is found, it identifies -- concretely, for the
          first time in this lane -- an exceptional-family effect of
          exactly the kind KN-OPEN-009 asks about, at a locus (m=4
          root-multiplicity, not cycle type) already confirmed
          non-degenerate where H-MONO-45183a Part A's own cycle-type
          observable is already known to be constant (EV-MONO-a0a89c
          OBS-5/OBS-6).
    quantifier_order: >-
      THERE EXISTS a matched pair (E_CM, E_ord) with identical (N,tau) and
      distinct endomorphism rings, at a prime within the declared search
      range, SUCH THAT their measured m=4 collision rates AGREE (or,
      falsifying the closed form, DISAGREE) within the stated statistical
      tolerance. A bounded existential over one matched pair (plus a
      replication pair, if found); it can falsify (N,tau)-only completeness
      outright with a single confirmed disagreement, but a single agreeing
      pair does not prove completeness for every possible pair.
    method_ceiling:
      strongest_certifiable_claim: >-
        Whether ONE matched (N,tau) CM/ordinary pair (and its replication,
        if found) shows agreeing or disagreeing m=4 collision rates, at toy
        scale. Cannot certify the closed form's completeness for every
        curve or CM discriminant; cannot certify anything about m != 4,
        extension fields, or any cost/exponent claim.
      nearby_object_control: >-
        A tau=1 matched pair (predicted rate exactly 0 regardless of
        endomorphism ring) is the built-in nearby-object control: BOTH the
        CM and ordinary members must show exactly 0 collisions -- the
        sharpest possible agreement test (an exact-zero prediction, not a
        statistical band) -- checked before any tau>1 pair's statistical
        agreement is trusted.
    proof_obligations:
      - claim: A matched-(N,tau) CM/ordinary pair is found (or its absence within the search range is reported as a bounded negative).
        responsibility: feasibility
      - claim: Each matched curve independently reproduces its own G6/G7-predicted rate before the curve-to-curve comparison is read.
        responsibility: baseline
      - claim: The two matched curves' measured rates are compared directly, at the same sample size, using a two-sample test.
        responsibility: correctness
      - claim: A tau=1 matched pair (if found) shows exactly 0 collisions on BOTH curves.
        responsibility: strictness
      - claim: Nothing here transfers beyond m=4, this curve family, or toy scale; no ECDLP or cost claim in either direction.
        responsibility: scope

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-COIN-1, inherited unmodified: signed subset sums of
        independently-drawn factor-base points are uniform on E(F_p) to
        within o(1/N) relative error, so P(signed subset sum in E[2]) =
        tau/N at leading order for BOTH matched curves under the identical
        sampling construction.
      rigorous_support: >-
        Exact for independent uniform points on the group; the gap, as
        H-MONO-45183a's own text states, is that the actual construction
        draws x-coordinates and applies a deterministic sign rule rather
        than drawing points uniformly on E(F_p), an expected-but-unproven
        O(1/N)-relative first-order effect.
      validation_plan: >-
        Reused unmodified from H-MONO-45183a's own validation plan for
        HEUR-COIN-1; this hypothesis adds no new test of this heuristic
        beyond running it identically on two curves instead of one.
      falsification_condition: >-
        Inherited unmodified: the fixed-sign and random-sign sampling arms
        disagreeing by more than the forced value's standard error at
        either matched curve.
    - id: H2
      statement: >-
        A matched-(N,tau) CM/ordinary pair exists within a declared search
        range of toy primes, expected (but not guaranteed) by Deuring's
        class-number correspondence between traces and isomorphism classes.
      rigorous_support: >-
        Deuring's theory makes the EXISTENCE of curves with a given trace
        (hence a given N) at a given prime a class-number-governed count,
        growing with p; whether a SPECIFIC small-discriminant CM curve and
        an ordinary curve share the exact same trace at any particular
        small prime is a combinatorial coincidence this record's Stage 0
        search either finds or does not, and is not guaranteed by the
        general theory for any single small prime.
      validation_plan: >-
        Search a declared range of toy primes directly by enumeration for a
        matching (N,tau) cell containing both a j in {0,1728} curve and an
        ordinary curve; report the smallest prime at which a match is
        found, or report exhaustively that none was found in the range.
      falsification_condition: >-
        Not independently falsifiable as a heuristic (it is a search
        outcome); its "failure" is simply the reported absence of a match
        within the declared range, itself the honest, reportable result of
        Stage 0.

  structural_ingredients:
    - description: >-
        H-MONO-45183a Part B's exact closed form for the m=4 root-
        multiplicity collision rate, 6(tau-1)/N, as a function of (N,tau)
        alone, under HEUR-COIN-1.
      citation: >-
        ledger/hypotheses/H-MONO-45183a.yaml Part B (predictions G6, G7),
        internal, read in full this session.
      role: supplies the exact predicted rate each matched curve must independently reproduce (baseline_embedding) before this record's own direct comparison is interpreted
      verified_by: coordinator (read in full during this record's own conversion, 2026-08-31)
    - description: >-
        The chord-and-tangent addition law and signed-sum fibre description
        underlying B-1's collision criterion, unmodified.
      citation: ledger/evidence/EV-MONO-a0a89c.yaml OBS-1, OBS-4, OBS-5 (inherited via H-MONO-45183a, not independently re-verified here).
      role: supplies the collision criterion this record's own measurement code must implement identically to H-MONO-45183a's own
      verified_by: coordinator (read in full during this record's own conversion, 2026-08-31)
    - description: >-
        Deuring's correspondence between trace and isomorphism class,
        governing the EXISTENCE (not the specific matching) of curves at a
        given trace/prime.
      citation: >-
        NOT RETRIEVED, NO SOURCE READ, NO CITATION ASSERTED beyond the
        idea-generator's own recalled statement in IDEA-20260831-d29a71;
        used here only to motivate H2's search, not as a load-bearing
        derivation step this record depends on for its own correctness.
      role: motivates why a matched-(N,tau) pair search is expected to be findable, not merely a hopeful guess
      verified_by: not_independently_verified_motivational_only

  reduction_chain: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    No asymptotic, cost, or exponent claim is made in either direction. Any
    cover-sourced deviation, per H-MONO-45183a's own C3/C4, is bounded and
    cannot change any collection cost by more than a 1+O(1/p) factor even
    if found. This record tests a toy-scale statistical question about a
    single closed form's completeness, not an attack.

  predictions:
    - metric: existence of a matched-(N,tau) CM/ordinary pair within a declared toy-prime search range
      direction: different
      minimum_effect: >-
        At least one pair found within a search range of, e.g., the first
        50-100 primes above a stated floor; non-existence within the
        declared range is reported as an instrument-outcome/negative, not
        as evidence for either direction of the main claim.
    - metric: collision rate on the tau=1 matched pair (if found), both curves
      direction: lower
      minimum_effect: >-
        EXACTLY 0 collisions on BOTH curves, over >=20,000 admissible
        tuples each. A nonzero count on either curve falsifies Part B's own
        G6 prediction independent of this record's own comparison question.
    - metric: collision rate difference between the CM curve and the ordinary curve at a matched tau>1 (N,tau) cell
      direction: different
      minimum_effect: >-
        PRE-REGISTERED, TWO-SIDED. Predicted agreement within 3 combined
        binomial standard errors of each other AND of the shared closed
        form 6(tau-1)/N. A difference exceeding that band, with the tau=1
        nearby-object control passing on both curves, is the single most
        consequential possible outcome: a genuine, curve-specific
        (endomorphism-ring-linked) relation-rate deviation.
    - metric: replication at a second matched pair (if a second prime's search succeeds)
      direction: same
      minimum_effect: >-
        The first pair's qualitative finding (agreement or disagreement)
        reproduces at the second pair; a reversal indicates the effect (if
        any) is not a stable property of "CM vs ordinary" alone and must be
        reported as such rather than averaged away.

  test_boundary: >-
    Prime fields only, m=4 exactly, non-singular short-Weierstrass curves,
    toy-scale primes (search range disclosed before the search runs), CM
    curves identified by j in {0,1728} or a small disclosed discriminant.
    HEUR-COIN-1's sampling construction reused unmodified. No claim beyond
    this exact construction.

  falsification_conditions:
    - No matched-(N,tau) CM/ordinary pair found within the declared search range (reported as a bounded negative/instrument outcome, not evidence for either direction of the main claim).
    - Either matched curve fails to reproduce its own G6/G7-predicted rate independently (halts the comparison; the implementation, not the main claim, is suspect).
    - A tau=1 matched pair (if found) showing any nonzero collision on either curve.
    - The CM and ordinary curves' rates disagreeing beyond the stated statistical tolerance at a matched tau>1 cell, with the tau=1 control (if available) passing -- this is the record's single most consequential possible outcome and must be reported as the headline finding, not absorbed.
    - A reversal of the qualitative finding between two replication pairs (if a second pair is found), reported explicitly rather than averaged.

  interpretation_limits:
    - CLAIM TIER toy for every measurement; H-MONO-45183a Part B's closed form remains a derivation, cited as such.
    - NO ECDLP CLAIM OF ANY KIND, in either direction. Any cover-sourced deviation, per H-MONO-45183a's own C3/C4, is bounded and cannot change any collection cost by more than a 1+O(1/p) factor even if found.
    - m=4 ONLY; nothing here addresses other arities or extension fields.
    - >-
      A found disagreement identifies a curve-specific relation-rate
      deviation at TOY SCALE for ONE tested pair; it does not by itself
      characterize the full exceptional family, its size, or its
      cryptographic relevance -- those would be named forward guidance for
      a successor record, not concluded here.
    - NO STATUS CHANGE to H-MONO-45183a or any other record is proposed or implied (Coordinator authority alone, AGENTS.md rule 1).
    - >-
      MODEL-CORRELATION WARNING, INHERITED AND RESTATED. This lane's prior
      records disclose a model-correlation confound across several producer/
      reviewer chains resolving to the same model family. Any review of this
      record must record its own resolved model rather than assume it.

  status_note: >-
    status is `proposed`; converted from IDEA-20260831-d29a71 by the
    Coordinator this session, condensing that proposal's content into
    hypothesis form with no new claim beyond what the idea-generator's own
    record already specified. The paired experiment contract is
    `review_required` at the time of this conversion; only the Coordinator
    approves (AGENTS.md rule 1).

