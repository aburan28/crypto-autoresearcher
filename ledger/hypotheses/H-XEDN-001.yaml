hypothesis:
  id: H-XEDN-001
  question_id: RQ-XEDN-001
  statement: >-
    In the frozen EXP-XEDN-001 function-field family (surfaces y^2 = x^3 + b(t)
    over F_p with deg b = 6 exactly, sections with x(t) monic of degree 2 and
    y(t) of degree at most 3), the probability that a uniformly random
    (surface, x-slot) pair admits a section decays as P_lift ~ C * p^-alpha with
    alpha < 1/2, i.e. slowly enough that a lifting-based relation source stays
    viable as p grows. This is the promotion side of the EXP-XEDN-001 phase-2
    gate. The competing classical prediction, inherited from the
    Jacobson-Koblitz-Silverman-Stein-Teske analysis of xedni and from the naive
    square-density heuristic recorded in the harness, is alpha = 3.
  mechanism: >-
    A section of the surface is a solution of y(t)^2 = x(t)^3 + b(t) in
    F_p[t]. With x monic of degree 2 the right-hand side is a sextic, so the
    section condition is the condition that a specific sextic is a square in
    F_p[t]. Squares of cubics form a 4-parameter subfamily of the 7-parameter
    space of sextics, so the naive codimension is 3 and the naive density is
    p^-3. The hypothesis that alpha < 1/2 requires the elliptic structure of the
    family to make section existence far more common than that codimension
    count: for example, if the sextics arising as x(t)^3 + b(t) for b in the
    family concentrated on a positive-density stratum of near-square sextics, or
    if the surface family's Mordell-Weil geometry (Shioda-Tate rank at most 8 for
    a rational elliptic surface) forced sections to appear on a much larger
    subfamily than the parameter count suggests. Both are structural claims about
    the family, and both are testable by exact counting.
  assumptions:
    - >-
      The square-detection predicate is the one implemented in
      experiments/EXP-XEDN-001/xedni_sections.py (gcd(f, f') with re-squaring
      verification and a quadratic-residue test on the leading coefficient),
      including its exclusion of f = 0, i.e. of the y = 0 two-torsion section.
    - >-
      The slot space is exactly the one the frozen harness samples: b ranges over
      polynomials of degree exactly 6 (nonzero leading coefficient) and the slot
      coordinate is a monic quadratic x(t) = t^2 + x1 t + x0.
    - >-
      Iso-trivial surfaces are detected and excluded from census counts, per the
      EXP-XEDN-001 contract constraints.
  predictions:
    - metric: >-
        alpha, the exponent in P_lift(p) ~ C * p^-alpha, evaluated at
        the contracted census sizes p in {101, 211, 431, 809}
      direction: lower
      minimum_effect: >-
        alpha < 1/2, with the uncertainty interval excluding the classical
        prediction alpha = 3 fitted at the same sizes, across at least three
        sizes (the EXP-XEDN-001 promotion gate).
    - metric: >-
        exact probability that a surface in the family carries at least s
        sections, for s = 1..9 (the multi-section requirement implied by the
        Shioda-Tate rank bound r <= 8 for a rational elliptic surface, since a
        relation among specialized sections needs s >= r + 1)
      direction: higher
      minimum_effect: >-
        P[at least 9 sections] must be at least p^-1 for a lifting relation
        source to be reachable by search at cost below the birthday bound; a
        measured or derived value far below that closes the multi-section route
        for this family.
  test_boundary:
    instances:
      - exhaustive slot census at p in {5, 7, 11, 13}
      - exact per-surface section-count histogram at p in {5, 7, 11} (13 if memory allows)
      - closed-form evaluation at p in {101, 211, 431, 809}
    parameters:
      surface_family: "y^2 = x^3 + b(t), deg b = 6 exactly, a(t) = 0"
      section_shape: "x(t) = t^2 + x1 t + x0 monic; y(t) of degree <= 3"
      predicate: "experiments/EXP-XEDN-001/xedni_sections.py is_square_poly"
    implementation: experiments/EXP-XEDN-002 (exact census; supersedes the infeasible EXP-XEDN-001 phase-2 sampling design)
    budget:
      wall_clock_seconds: 5400
      maximum_memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
    - >-
      alpha >= 1/2 at the contracted sizes, or the uncertainty interval includes
      the classical prediction: scoped rejection of H-XEDN-001 and closure of the
      function-field xedni census for this family (the ECFG-NR-1518 closure
      branch of the EXP-XEDN-001 contract).
    - >-
      The exact count reproduces the naive codimension-3 density: the family
      carries no structural enhancement of section existence, and the
      representation change buys nothing.
    - >-
      The exact multi-section histogram shows P[at least 9 sections] decaying
      faster than p^-1: the relation-source form of the route is closed even if
      single sections were common.
  interpretation_limits:
    - >-
      Any outcome is scoped to the tested surface family, section degrees, and
      square predicate; it is not a general statement about lifting, about xedni
      over number fields, or about higher-degree section searches.
    - >-
      A closure here does not add to, and must not be presented as, a proof that
      no lifting attack exists; the audited-route inconclusive records
      ECFG-P1543 and ECFG-P1547 in ledger/FINDING-PF-IC-001.md remain as they
      are.
    - >-
      An exact count removes sampling error only. It does not remove model error:
      if the frozen family or predicate is the wrong formalization of the xedni
      idea, the exact answer is exactly right about the wrong question, and that
      risk is a red-team target rather than a resolved issue.
  status: approved   # specified and approved by the Coordinator in TASK-20260724-226; see DEC record in the BATCH-001 ledger archive
  proposed_by: coordinator
