  statement: >-
    For the Thue-Morse character t(x) = (-1)^{s_2(x)} and the
    Rudin-Shapiro character r(x) = (-1)^{u(x)} (s_2 the binary digit sum,
    u the count of 11-blocks, both on the canonical integer lift x in
    [0, p)), the pair (lambda, PGL_2-stability) of the level-set
    statistics v_t = 1_{{t=+1}}/|A_t| and v_r = 1_{{r=+1}}/|A_r| under
    the canonical probability normalisation (DEC-20260921-8e8086) is
    measurable on the census's own primary ladder, with the exact
    identity vhat(k) = that(k)/2 for k != 0 (so the level-set census
    cell IS the character's F_p-additive spectral norm), and the
    measurement decides the first non-set row of the
    synthetic-statistic table with three outcomes: (a) a character
    reads PGL_2-stable AND above the random-set level -- the first
    natural inhabitant of the cell EV-ECDLP-81f4d4 found empty, naming
    the successor construction step (replicate before any use); (b) a
    character reads Moebius-unstable -- the census's instability finding
    extends over the character family; (c) a character reads
    stable-and-flat -- the Gauss-flat finding extends through the
    2-adic digit structure. Independently, the lambda reading of v_t
    against the KN-FIND-ffe1df band [0.36, 0.42] closes
    DEC-20260921-8e8086's open R03-construction question: if v_t
    reproduces the band on the same ladder where the mode-level
    indicator read 0.4191, the 0.39 is attributed to the character
    construction; if both miss or differ, the reproduction question is
    recorded with all constructions measured side by side.

  mechanism: >-
    The characters are 2-adically structured (digit positions), the same
    embedding-sensitive structure that made the popcount mode level
    PGL_2-unstable (EV-ECDLP-81f4d4); the prior is outcome (b). The live
    outcome is (a) via Rudin-Shapiro, whose defining property is bounded
    partial sums of the block-count (growth-free autocorrelation), and
    via Thue-Morse whose integer-sequence spectral mass concentrates at
    powers of two: the two characters bracket the
    concentration-vs-flatness tradeoff, and the level-set/character
    identity (v = (1+t)/2 gives vhat(k) = that(k)/2 for every k != 0
    regardless of balance) makes one measurement read both the set cell
    and the character norm. Tracked-object frame: the fibre statistic of
    the character's level set under the a5757d branching operation --
    BRANCHING class (IDEA-20260806-c5d183 trichotomy), R1
    representation, attack stage COLLISION STRUCTURE; gates are
    necessary, not sufficient; no attack is claimed at any outcome.

  assumptions:
    - Canonical probability normalisation per DEC-20260921-8e8086;
      set rows v = 1_A/|A| with vhat(0) = 1 exactly per cell.
    - The ladder is the census's frozen primary ladder verbatim (same
      ten primes), so the census's R03 bridge reading (0.4191 on the
      mode-level indicator) is directly comparable without re-measuring.
    - Exact additive Bluestein chirp-z over each prime; the identity
      check vhat(k) = that(k)/2 at one prime to 1e-9 is a run control.
    - Toy/medium scale only; no crypto-scale claim; positive outcomes
      are candidates pending replication and the owed independent
      adversarial review.

  proof_search_map:
    not_applicable_reason: >-
      Measurement, not a theorem; the census's audits (reproduction
      anchors C01/C02, PGL_2 battery, naive-DFT and second-chirp-z
      checker spots, vhat(0)=1 invariant) transfer verbatim, plus the
      new identity check.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
