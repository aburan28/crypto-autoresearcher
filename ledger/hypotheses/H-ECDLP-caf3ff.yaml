  reduction_chain: null
  predictions:
    - metric: lambda(v_t) vs the random level
      direction: different
      minimum_effect: >-
        Above lambda(C02A) by more than 2SE would be a live band
        inhabitant candidate (integer Thue-Morse spectral concentration
        at powers of two motivates the prior); at the level within 2SE
        extends the flat finding.
    - metric: lambda(v_r) vs the random level
      direction: lower
      minimum_effect: >-
        At the random level within 2SE (bounded-partial-sums property
        suppresses concentration); the bracket against v_t is the
        discriminating structure.
    - metric: PGL_2 battery on both characters
      direction: different
      minimum_effect: >-
        Deviation beyond 2SE on a character extends the census's
        instability finding over the character family (outcome (b) for
        that character).
    - metric: lambda(v_t) against the ffe1df band [0.36, 0.42]
      direction: different
      minimum_effect: >-
        In-band closes DEC-20260921-8e8086's open construction item
        toward the character construction; out-of-band records the
        reproduction question with both constructions measured.
  test_boundary:
