  title: >-
    The largest fibre raises the bound from 1/8 to 1/4, and a double cover charges 4.
  statement: >-
    The fibre sizes 1, 2, 3 and 6 sum to 12. There are 4 fibres, so the
    average is 3 and the largest is 6. The ratio of the largest to the
    average is 2. Branching 2 is equal to half the fibre count, so it
    meets the stated ceiling. Twice the branching is 4, whose square
    root is 2. The fibre-max lower bound is 6/(12*2) = 1/4. The
    average-fibre bound is 1/(4*2) = 1/8. The first is strictly larger,
    and the second still holds. The doubling ceiling on the largest
    fibre is 2*6 = 12. A t-fold cover multiplies insertion by t and
    the candidate count by t squared. At t = 1 both factors are 1. At
    t = 2 they are 2 and 4. At t = 3 they are 3 and 9. The subgroups
    of a 2-dimensional space over the field of 5 elements have indices
    1, 5 and 25. The index 10 is not among them. The nonzero
    characters of that space number 24.
  mechanism: >-
    The proposal says the branching bound survives unequal fibres and
    that a t-fold cover raises the charge. This contract checks those
    integer comparisons. It does not evaluate a character sum.
