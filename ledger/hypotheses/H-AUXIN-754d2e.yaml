  title: >-
    A 12-bit power sits one past the released interval, and three
    divisors split the 255-bit threshold
  statement: >-
    For k equal to 12, the released upper bound is 4095. The largest
    power of two at most 4095 is 2048. 4096 equals 4095 plus 1, so
    that next power sits outside the interval. At 255 bits the
    coefficient is 117 over 125 and the step factor is 5 over 4. The
    pessimistic product is 3825 over 8. The optimistic product is
    1275 over 32. One route compares 117 squared times d times the
    denominator squared with the numerator squared times 125 squared.
    The other compares d times the cutoff denominator with the cutoff
    numerator 2822265625. At d equal to 262144 the pessimistic excess
    is 1059794199 on the square route and 13083879 on the cutoff
    route. At d equal to 1024 the optimistic shortfall is 11046433761
    on the square route and 1227381529 on the cutoff route. At d
    equal to 16384 the optimistic excess is 204262919199 and the
    pessimistic shortfall is 214249558761. The nearby divisor 131072
    falls short of the pessimistic cutoff by 1404590873. The nearby
    divisor 2048 exceeds the optimistic cutoff by 367502567.
  mechanism: >-
    The proposal prices a three-way cell verdict from a released
    exponent interval and from the ratio of a square root to a step
    cost. This contract checks that integer labelling at one width
    and at 255 bits. It does not pin a curve order and it does not
    read a ceremony transcript.
