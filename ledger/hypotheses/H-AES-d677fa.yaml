hypothesis:
  id: H-AES-d677fa
  question_id: RQ-AES-002
  derived_from_idea: IDEA-20260805-01dfba
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  title: >-
    The campaign's two-implementation certificate gate has fewer independent
    verification layers than it declares: the declared pair is not installed, and the
    obvious substitute shares libcrypto, so its catch rate on shared-layer faults is
    exactly zero while its known-answer pass rate is exactly one
  statement: >-
    SCOPE: the container the dispatched task actually runs in, on its run date; the
    verifier pair the AES campaign's completion criteria and claim-tier ceiling
    declare; and single-bit mutations planted at four declared resident layers. This
    is an INSTRUMENT AUDIT. NOTHING IN IT IS A STATEMENT ABOUT AES AT ANY ROUND
    COUNT, and no outcome weakens or strengthens any committed AES record.
    THE CLAIM, in two separable parts.
    (A1) AVAILABILITY. The declared verifier pair is not both present in the
    dispatched task's interpreter, so the gate as written cannot be satisfied there.
    (A2) INDEPENDENCE. The obvious substitution does not restore independence,
    because independence of two verifiers is a property of their FAULT SETS, not of
    their API surfaces. If two verifiers share a layer L, then for every fault
    resident at L both stacks compute the same wrong answer and agree, so the pair's
    detection probability for that fault is EXACTLY 0 - not small, zero - while its
    known-answer-test pass rate is exactly 1. Consequently the pair's
    independent_layer_count is below the minimum of 2 that the word "independent" in
    the campaign's criteria requires.
    THE HYPOTHESIS ASSERTS BOTH. Either failing is a clean, welcome refutation with a
    different successor, and both are decided by measurements costing minutes.
  mechanism: >-
    Model a verifier as a function from a claimed (key, plaintext, ciphertext) triple
    to an accept/reject verdict, realised by a stack of layers: Python wrapper,
    extension module, dynamically linked crypto library, CPU instruction path, and
    the constant tables baked into each. A pair detects a planted fault only if the
    fault is present in exactly one of the two stacks. Sharing a layer therefore
    forces the catch rate on faults resident at or below that layer to exactly 0, and
    leaves it at exactly 1 for faults resident above it. That two-valued forced
    observable is what makes the audit decisive rather than suggestive: no
    intermediate value is admissible under the layer model, so an intermediate
    reading refutes the model itself rather than being rounded to the nearer endpoint.
    The repair, if the audit confirms the objection, is a third verifier derived from
    the AES SPECIFICATION rather than from any tabulated or vendored implementation,
    sharing no layer below the interpreter - and a definition-level integrity check on
    any verifier's effective S-box is available for free from the algebraic structure
    of the S-box itself.
  assumptions:
    - >-
      The container state the dispatched task sees is what is audited. NOT assumed
      identical to any previously observed state: stage 0 re-measures it under a
      receipt and records the result whether or not it agrees with the parent
      proposal, and a discrepancy is REPORTED rather than reconciled.
    - >-
      "Re-verified by the run wrapper with the attack code excluded from the
      verification path" means the wrapper recomputes the ciphertext itself. That is
      the reading the campaign's claim-tier ceiling states and it is the reading
      audited.
    - >-
      A planted mutation is only admissible in the pair comparison after it has been
      shown to change a SINGLE-verifier run's output. A mutation in dead code produces
      a catch rate of 0 for a reason that has nothing to do with layer sharing, and
      that confound is closed by construction rather than discussed.
  proof_search_map:
    bottleneck: >-
      Whether the two verifiers the campaign would actually use share a layer. It is
      decision-changing because the entire certificate gate - the door through which a
      key-recovery claim would reach the campaign's top claim tier - rests on the pair
      being independent, and a shared layer sets the gate's detection probability for
      every fault resident there to exactly zero while leaving every known-answer test
      green.
    baseline_embedding:
      parameter_slice: >-
        A pair that is KNOWN dependent by construction - the same command-line tool
        invoked twice through two different wrappers - is the exact reference boundary.
        Its shared-layer catch rate is forced to 0 and its known-answer pass rate to 1.
      reproduction_check: >-
        The frozen decision rule is executed on that known-dependent pair FIRST. If it
        emits the same verdict on the known-dependent pair as on the campaign's declared
        pair, the rule discriminates nothing and must be rewritten before the real arm
        is read.
    observation_collision:
      observable: >-
        The single bit "the two verifiers disagree on this input".
      distinct_preimage_search: >-
        On natural inputs that bit has an enormous fibre over "agree", containing every
        pair that is correct AND every pair that is identically wrong - which is exactly
        the failure the audit exists to detect. The raw agreement bit is therefore
        WORTHLESS and is not used. Identifiability is restored by planting mutations
        INDEXED BY RESIDENT LAYER, making the layer an explicit independent variable; the
        repaired observable is forced to 0 or 1 with nothing between, which is the maximum
        comparator spread available.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          A definition-level integrity check on a verifier's effective S-box: the
          univariate interpolation polynomial of the AES S-box over GF(2^8) has exactly 9
          nonzero coefficients, at exponents {0} together with {255 - 2^k : k = 0..7},
          because the S-box is a GF(2)-affine map composed with inversion and an affine
          map is a linearized polynomial plus a constant.
        predicted_gain: >-
          A single-byte alteration of a tabulated S-box cannot satisfy the 9-term
          identity, so the identity detects table corruption WITHOUT trusting any
          implementation - an integrity check obtainable from the definition alone, in
          minutes.
    quantifier_order: >-
      The claim is: FOR the pair the campaign declares, FOR ALL single-bit mutations
      resident in a shared layer, the pair's catch indicator is 0; and FOR ALL mutations
      resident above the shared layer, it is 1. The trap named: "there exists a mutation
      the pair catches" is satisfied trivially by any wrapper-layer mutation and proves
      nothing about independence. The content is the universally quantified statement at
      the SHARED layer, which is why the mutations are stratified by resident layer and
      not pooled.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "the declared verifier pair is or is not layer-disjoint above the
        interpreter, on the tested mutation set, in this container, on this date." It can
        NEVER establish that any verifier is CORRECT - correctness is not testable from
        inside the stack being tested - and the residual risk that a fault sits in the
        interpreter or the CPU beneath all verifiers is DECLARED OUT of the threat model
        on the stated ground that no in-container instrument can address it. That
        declaration must be written into any certificate relying on the instrument.
      nearby_object_control: >-
        The pair (a from-specification pure-Python implementation, the command-line tool),
        which shares no layer below the interpreter. Its catch rate is forced to the
        maximum on mutations resident in EITHER stack. If it is not, the instrument is
        broken and NO negative result may be reported at all.
    proof_obligations:
      - claim: The declared pair's availability in the dispatched interpreter is measured, not recalled.
        responsibility: baseline
      - claim: Layer sharing is established by linkage evidence, not inferred from import paths.
        responsibility: correctness
      - claim: Every planted mutation is shown to change a single-verifier output before entering the matrix.
        responsibility: correctness
      - claim: Catch rates are reported per resident layer, never pooled.
        responsibility: size
      - claim: The out-of-threat-model residual is declared and carried into any dependent certificate.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-AES-d677fa-1
      formal_statement: >-
        LAYER MODEL. A verifier is a stack of deterministic layers, and a fault resident
        in a layer shared by two verifiers produces identical outputs from both, hence a
        catch probability of exactly 0. Quantifiers: for all single-bit mutations resident
        at or below a shared layer, for the declared pair, in this container.
      random_model_justification: >-
        No random model. This is immediate from determinism: identical inputs to an
        identical faulty layer give identical outputs, so the comparison cannot separate
        them. It is numbered because the ENTIRE decisiveness of the audit rests on the
        observable being two-valued, and an unnumbered load-bearing model is exactly what
        this program's rules exist to prevent.
      supporting_results: []
      validation_experiment_ids:
        - EXP-AES-adf624
      falsification_condition: >-
        A catch rate strictly between 0 and the maximum on the shared-layer stratum. The
        two-valued layer model is refuted and the mechanism must be rewritten BEFORE any
        verdict about the pair is issued - the reading must not be rounded to the nearer
        endpoint.
    - id: HEUR-AES-d677fa-2
      formal_statement: >-
        The S-box 9-term identity: the univariate GF(2^8) interpolation polynomial of the
        AES S-box has exactly 9 nonzero coefficients, at exponents {0} union
        {255 - 2^k : k = 0..7}.
      random_model_justification: >-
        Not a distributional claim and not presented as one. It follows from
        S = A o (x -> x^254) with A a GF(2)-affine map, hence a linearized polynomial plus
        a constant, and reducing exponents mod 255. It is PROVED, not assumed, and is
        numbered so a reviewer can check the derivation independently of any measurement.
      supporting_results: []
      validation_experiment_ids:
        - EXP-AES-adf624
      falsification_condition: >-
        A from-specification S-box built independently in the harness whose interpolation
        has a coefficient count other than 9, or whose exponent set differs. The identity
        is then wrong as stated and the integrity check it licenses must be withdrawn.
  structural_ingredients:
    - description: >-
        The AES S-box as the composite of inversion in GF(2^8) with the fixed
        GF(2)-affine map, and the campaign's own certificate gate as stated in its
        completion criteria and claim-tier ceiling.
      citation: null
      provenance: internal
      verified_by: >-
        No primary specification document was read for this record and none is cited. The
        structural statements are either DERIVED here or must be pinned operationally by
        local computation in the paired contract, which is the only grounding the
        question's provenance rules permit.
      role: the definition from which an implementation-independent verifier is built
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: declared_pair_availability
      direction: different
      minimum_effect: >-
        PREDICTED UNAVAILABLE in the dispatched task's interpreter. If it is AVAILABLE,
        part (A1) of this hypothesis is FALSIFIED, the gate as written is satisfiable, and
        the correct record is a short note plus the independence question, which survives
        either way. That refutation costs one import and is the cheapest available.
    - metric: shared_layer_catch_rate
      direction: lower
      minimum_effect: >-
        EXACTLY 0 out of the declared mutation count if the two verifiers share the
        library layer; EXACTLY the full count if they do not. No intermediate value is
        admissible under the layer model, so ANY intermediate reading falsifies the model
        and must be reported as such rather than rounded.
    - metric: wrapper_layer_catch_rate
      direction: higher
      minimum_effect: >-
        EXACTLY the full mutation count. POSITIVE CONTROL AND IT MUST FIRE. If it does
        not, the mutation harness is broken and NO conclusion of any kind, positive or
        negative, may be drawn from the other metrics.
    - metric: sbox_nine_term_identity
      direction: different
      minimum_effect: >-
        EXACTLY 9 nonzero coefficients at the stated exponent set, for every verifier
        implementing the specification. Any verifier whose effective S-box misses this has
        a mutated or non-conforming table, and the identity detects a single altered byte
        with certainty.
    - metric: independent_layer_count
      direction: higher
      minimum_effect: >-
        At least 2 is the minimum consistent with the word "independent" in the campaign's
        criteria. Currently UNKNOWN and possibly 0; establishing which is the audit's
        subject, and the deliverable is the measured number with its residual declared.
  test_boundary:
    instances: >-
      Verifier pairs, not cryptographic instances: the campaign's declared pair, a
      known-dependent pair, and a layer-disjoint pair. Each evaluated over a declared
      mutation set stratified by resident layer.
    parameters:
      mutation_count: at least 32 planted single-bit mutations per resident layer
      resident_layers: >-
        four declared depths - one verifier's own wrapper; a wrapper shared by both; the
        shared library; and the constant tables compiled into the from-specification
        verifier
      admissibility: >-
        a mutation enters the matrix only after it is shown to change a single-verifier
        output; discards are recorded with their reason
    implementation: >-
      Shell measurement plus pure Python. A from-specification AES implementation built
      from the definition, sharing no layer below the interpreter. Exact GF(2^8)
      arithmetic for the interpolation identity.
    budget:
      total_cpu_hours: 1
      maximum_runs: 10
  falsification_conditions:
    - >-
      The declared verifier pair is available in the dispatched task's interpreter. Part
      (A1) is wrong and is withdrawn; the independence question survives and is still
      worth answering, but this record's framing must be superseded rather than edited.
    - >-
      The two candidate verifiers are MEASURED not to share the library layer. Part (A2)
      is wrong at the tested layer and the audit reports a clean pass - a real and welcome
      result, and the one the record most wants to be able to report.
    - >-
      The positive control fails - the layer-disjoint pair does not catch every mutation
      resident in either stack. Nothing negative may be reported; the outcome is an
      instrument defect.
    - >-
      An intermediate shared-layer catch rate, strictly between 0 and the full count. The
      two-valued layer model is falsified and the mechanism must be rewritten before any
      verdict.
    - >-
      The from-specification S-box's interpolation does not have 9 terms at the stated
      exponents. HEUR-AES-d677fa-2 is wrong and the integrity check is withdrawn.
  interpretation_limits:
    - >-
      NOTHING HERE IS A STATEMENT ABOUT AES AT ANY ROUND COUNT. No distinguisher, no key
      recovery, no cost, no barrier. The subject is the campaign's verification instrument.
    - >-
      A clean pass licenses exactly one sentence: "the declared verifier pair is
      layer-disjoint above the interpreter, on the tested mutation set, in this container,
      on this date." It licenses NO claim that either verifier is correct.
    - >-
      A failure is an INFRASTRUCTURE finding (AGENTS.md rule 5). It is never negative
      mathematical evidence and it does not weaken any committed AES record.
    - >-
      The residual - a fault planted beneath all verifiers, in the interpreter or the CPU -
      is DECLARED OUT of the threat model on the stated ground that no in-container
      instrument can address it, and that declaration must be written into any certificate
      relying on the instrument.
    - >-
      If the library layer is read-only in-container and cannot be mutated, the
      shared-layer arm cannot be run at all. That is coverage not achieved, reported as
      such, and never as a catch rate of 0.
  prior_evidence_refs:
    - RQ-AES-002
    - IDEA-20260805-01dfba
  distinguishable_outcomes:
    - outcome: >-
        Declared pair unavailable; positive control fires at full count; known-dependent
        null reads exactly 0; the campaign's substitute pair reads exactly 0 on the shared
        layer with linkage evidence confirming sharing.
      means: >-
        SUPPORTS both parts of the hypothesis. The gate's independent_layer_count is below
        2 and the certificate path is not what the criteria assume. Next decision: file the
        dependency gap as an infrastructure request, adopt the from-specification verifier
        to raise the count, and write the declared residual into the campaign's certificate
        language. NO AES record's status changes.
    - outcome: >-
        Declared pair AVAILABLE, or the candidate verifiers measured not to share the
        library layer.
      means: >-
        FALSIFIES the corresponding part. The gate is satisfiable as written, or the
        independence objection is wrong at the tested layer. Next decision: record the
        clean pass with its scope, supersede this record's framing, and keep the
        from-specification verifier as an optional third layer rather than a required
        repair.
    - outcome: >-
        An intermediate shared-layer catch rate, or the shared library cannot be mutated
        in-container.
      means: >-
        INCONCLUSIVE, for two different and identifiable reasons. An intermediate rate
        refutes the layer model and requires a rewrite; an unmutable library is coverage
        not achieved. Next decision: distinguish the two in the record and re-scope; do not
        report either as a catch rate.
    - outcome: >-
        The positive control does not fire at full count.
      means: >-
        NO EVIDENCE EITHER WAY. The mutation harness is broken (AGENTS.md rule 5). Next
        decision: return to the Executor with the concrete defect.
