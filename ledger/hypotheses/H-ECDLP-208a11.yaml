# H-ECDLP-208a11
# Threshold substitution for IDEA-20260920-a58be0 step 1.
# No Fourier transform of a set. Approval: DEC-20261001-90802d.
hypothesis:
  id: H-ECDLP-208a11
  question_id: RQ-ECDLP-160d89
  source_idea: IDEA-20260920-a58be0
  experiment_id: EXP-ECDLP-911c16
  specified_at: '2026-10-01'
  status: approved
  proposed_by: idea-generator
  approved_by_decision: DEC-20261001-90802d
  title: >-
    The coefficient 1/(4 sqrt b) leaves three quarters of the cross-energy
    lower bound, and 1/(2 sqrt b) leaves none.
  statement: >-
    Let L = M/(2b) be the coefficient of |A|^4 in the nonzero cross-energy
    lower bound, for b > 0 and M > 0. For theta^2 = 1/(16b) the off-spectrum
    coefficient is M/(16b), and its ratio to L is 1/8. Subtracting that
    ratio twice leaves 3/4. For theta^2 = 1/(4b) the ratio is 1/2, and
    subtracting it twice leaves 0. The second threshold does not certify a
    nonempty intersection.
  mechanism: >-
    The proposal chooses theta so each side's off-spectrum mass is one
    eighth of the lower bound. Doubling the theta multiplies that mass by
    four and spends the whole lower bound. This contract checks those
    rational identities. It does not evaluate a character sum.
  assumptions: []
  proof_search_map:
    bottleneck: The two ratios of rational functions of b and M.
    baseline_embedding:
      parameter_slice: >-
        Lines (B1) and (B2) of IDEA-20260920-a58be0, read 2026-10-01.
        The ratios were checked by hand. That check is not a run.
      reproduction_check: >-
        One implementation uses the fractions module. The other cross
        multiplies integers. They must return the same reduced ratios.
    observation_collision:
      observable: good_ratio, bad_ratio, good_remaining, bad_remaining.
      distinct_preimage_search: >-
        Cancel M and b symbolically versus plug in M = 16 and b = 4 and
        reduce. Both must give 1/8 and 1/2.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two theta coefficients.
        predicted_gain: A threshold check. No attack cost.
    quantifier_order: >-
      For every positive integers M and b, the good ratio is 1/8 and the
      bad ratio is 1/2. The numeric point M = 16, b = 4 agrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        These coefficient identities. Not a theorem about fibres of a
        curve coordinate.
      nearby_object_control: >-
        The larger theta. It must be labeled does_not_suffice because the
        remaining coefficient is 0.
    proof_obligations:
      - claim: The good ratio is 1/8 and the remaining coefficient is 3/4.
        responsibility: correctness
      - claim: The bad ratio is 1/2 and the remaining coefficient is 0.
        responsibility: scope
      - claim: The numeric point M = 16, b = 4 matches.
        responsibility: correctness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Off-spectrum mass coefficient theta^2 * M compared with lower-bound
        coefficient M/(2b). No external paper was opened.
      citation: ledger/proposals/IDEA-20260920-a58be0.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-01 (claims B1 and B2 read; ratios reduced by hand)
      role: the threshold substitution
  reduction_chain:
    core_problem: Check which theta coefficient leaves a positive remainder.
    corollaries: []
  predictions:
    - metric: good_ratio
      direction: different
      minimum_effect: The rational 1/8.
    - metric: bad_remaining
      direction: lower
      minimum_effect: The rational 0.
  test_boundary:
    instances: [symbolic b and M, numeric M=16 and b=4]
    parameters:
      good_theta_squared_numerator: 1
      good_theta_squared_denominator_factor: 16
    implementation: Fractions and integer cross-multiplication, written apart.
    budget:
      maximum_runs: 2
      maximum_memory_gb: 1
      maximum_workers: 1
  falsification_conditions:
    - Both implementations agree and the good ratio is not 1/8, or the bad remaining coefficient is not 0.
  interpretation_limits:
    - This does not prove the fibre theorem. It checks the written constants.
    - A positive remainder is not a frequency on a curve.
  dominated_by: No attack is claimed.
  sota_delta:
    time: No attack cost.
    memory: Not measured.
    data_queries: Not applicable.
