  title: >
    On one frozen 9-bit 3-block ANF, brute-force
    projection to the first two blocks has no
    affine-linear vanishing form, while the known-false
    object that forces the first two blocks equal has
    D_elim(2,1)=1
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260908-9c3bb0
