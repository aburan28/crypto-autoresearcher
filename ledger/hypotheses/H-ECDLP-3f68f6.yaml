  statement: >
    Fix one synthetic 3-block ANF over F2 with
    blocks A,B,C of 3 bits each, frozen before any
    projection is read. Stage 0 asserts only the
    instrument prediction of IDEA-20260905-3de445
    on this family: (i) REAL3 has 32 solutions and
    32 projected (A,B) pairs and no affine-linear
    form in A,B vanishes on that projection;
    (ii) KF3, REAL3 plus a_j=b_j, has D_elim(2,1)=1
    because a_j+b_j vanish on the projection;
    (iii) NULL3 (C fixed, A and B free) has all 64
    pairs and no linear form, recorded and not a
    rigidity gate; (iv) an empty or two-block map
    is rejected before D_elim is read as a fiber.
    This is not the Trimoska pdp encoder, not a
    cadical run, and not Stage 1. Neither reading
    is a decoder or an ECDLP advantage.
  mechanism: >
    Block support of a derived relation is the
    union of the blocks it mentions. A linear form
    supported on blocks 1..2 is an element of the
    elimination ideal I intersect F2[A,B]. Stage 0
    evaluates that distinction by brute force on
    one frozen 9-bit family: the real system has
    no such affine-linear element, the known-false
    equal-block system must, and the matched null
    that leaves A,B free has vanishing ideal 0.
    This is a new RQ-ECDLP-002 object after
    Stage 0 of EXP-ECDLP-9e9536 held as P-S0-GLUE
    (DEC-20260908-1b988b). It is not Stage 1 of
    EXP-ECDLP-9e9536, not Stage 1 of
    EXP-ECDLP-90f602, and not Stage 2 of
    EXP-ECDLP-4be480.
  predictions:
    - id: P-S0-DELIM
      metric: well-defined brute-force D_elim(2,1) on the frozen family
      direction: different
      minimum_effect: >
        After fixture_pass, REAL3 has 32 solutions,
        32 projected pairs, and 0 affine-linear
        forms in A,B. KF3 has D_elim(2,1)=1 and
        a_j+b_j vanish. Empty and two-block objects
        are rejected. One certified miss after
        fixture_pass is a scoped falsification of
        this instrument on the frozen family.
      claim_tier: observational
    - id: P-S1-TRACE
      metric: cadical/kissat learned-clause histogram
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0 does
        not parse a solver proof and does not
        claim a pdp encoder.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFLINEAR
      statement: >
        After fixture_pass, KF3 fails to have
        D_elim(2,1)=1 or a_j+b_j do not vanish.
        An encoding bug is failed_infrastructure.
    - id: F-S0-REALLEAK
      statement: >
        After fixture_pass, REAL3 has a nonzero
        affine-linear form in A,B. That falsifies
        only P-S0-DELIM on this family.
    - id: F-S1-NARROW
      statement: >
        After an authorized later stage, a claimed
        narrow learned clause is not in the
        elimination ideal. Unauthorized here.
  test_boundary:
    instances:
      - frozen Stage 0 REAL3 / KF3 / NULL3 panel
    parameters:
      m: 3
      l: 3
      n_bits: 9
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-628891 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is a brute-force D_elim
      instrument on one 9-bit 3-block ANF. It is
      not a decoder, not a SAT run, not the
      Trimoska pdp encoder, not Stage 1 of
      EXP-ECDLP-9e9536, not Stage 1 of
      EXP-ECDLP-90f602, and not Stage 2 of
      EXP-ECDLP-4be480. No cryptographic transfer.
      Do not hunt a new ANF after this freeze.
  assumptions:
    - id: A1
      statement: >
        Forcing A=B on a 3-block system puts
        a_j+b_j in the elimination ideal. An
        argument that assigns KF3 D_elim(2,1)>1
        proves too much.
      status: explicit
    - id: A2
      statement: >
        The whole space F2^6 has vanishing ideal 0.
        NULL3 leaving A,B free must record 0 linear
        forms.
      status: explicit
    - id: A3
