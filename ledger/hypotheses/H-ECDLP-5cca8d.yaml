    forty-four by 262144. The product of the two table sizes is
    137438953472. Their sum is 786432. Two width-19 tables each store
    262144, so that gap is 0 and their product is 68719476736.
  mechanism: >-
    The proposal writes the widths 20 and 19 and the sizes 524288 and
    262144. This contract checks those integers. It does not add a
    curve point.
