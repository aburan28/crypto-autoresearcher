hypothesis:
  id: H-PFDR-a2258e
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260731-014
  batch_id: BATCH-2c45e2
  statement: >-
    THE SEMAEV MEMBERSHIP SYSTEM HAS A STRUCTURALLY CHEAPER LEFT TAIL UNDER
    PRESENTATION RE-RANDOMIZATION THAN A RANDOM SYSTEM OF THE SAME SHAPE DOES,
    AND THE EXCESS IS A SHAPE STATISTIC RATHER THAN A GAIN STATISTIC. Fix a
    Semaev membership system (target R, factor base F, arity m) and a frozen
    distribution over presentations of that system - monomial order, variable
    permutation, ideal-preserving unimodular recombination of the generator set,
    scalar rescaling - all of which preserve the ideal and its zero set. Let C be
    the Groebner solve cost of one presentation draw, charged in engine reduction
    operations. Define the standardized left-tail index
    L = (median(log C) - q_{1/8}(log C)) / sd(log C), a dimensionless shape
    statistic of the log-cost distribution that is invariant under any change of
    location or scale of log C.
    (S1) L is strictly larger on Semaev membership systems than on random
    same-shape multihomogeneous systems at matched arity and matched degree
    vector, by at least 0.25, at m in {3, 4} and at two or more toy bit sizes.
    (S2) The excess in S1 survives per-knob decomposition - at least one knob
    family alone reproduces an excess of at least 0.15 - so it is not carried by
    one exotic knob.
    (S3) NOTHING ABOUT AN EXPONENT. Any confirmed excess is a statement about the
    constant and the tail of the per-query membership solve cost. It moves no
    ECDLP exponent, and no assembled attack cost is claimed here or derivable
    from here.
  mechanism: >-
    Groebner computation is presentation-dependent in general - the generating
    set and the monomial order fix the Buchberger or F4 trajectory even though
    they do not change the ideal - so the solve cost of ONE fixed system is a
    random variable over presentations, with strictly positive variance for any
    non-degenerate knob distribution. That much is not the hypothesis; it is the
    precondition. The hypothesis is about the SHAPE of that distribution on the
    left. A randomized-retry strategy pays for the mean and collects the minimum,
    so its saving is governed by how much probability mass sits below the median
    relative to the spread. The claim is that the Semaev system, whose generators
    carry the curve group law through the recursive resultant construction and
    whose indicator factors break the symmetry between variables, admits
    presentations in which large parts of that structure cancel early, producing
    a heavier cheap tail than the semi-regular random model of the same degree
    vector predicts. The measurement object is therefore the standardized tail
    index, not the raw min-of-k ratio, for a reason recorded under
    band_non_degeneracy below.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE SOURCE IDEA''S PRE-REGISTERED BAND CANNOT FIRE AND WAS REPLACED. The
      idea asks for R_rerand(8) = E[min of 8]/E[single] below 0.90 on Semaev
      systems while the identical statistic on the random same-shape null sits at
      or above 0.95, and separately requires, as a power gate, that the variance
      of cost over presentations be at least twice the variance over solver seeds
      at fixed presentation. Those two requirements are in direct arithmetic
      tension. For any location-scale family of log-costs with log-scale spread
      s, E[min of 8]/E[single] is approximately exp(-1.42 s) for a lognormal
      cost, so a null with even a modest s = 0.30 lands near 0.65 and a null with
      s = 0.04 - small enough to reach 0.95 - has essentially no presentation
      variance and therefore fails the power gate. The idea''s own second
      falsifier then fires automatically: R_null(8) below 0.90 whenever
      R_semaev(8) is below 0.90, voiding the structural reading in every cell
      where the run has power at all. The band is unreachable in the intended
      direction by construction, not by any fact about Semaev systems.
    change_made: >-
      The discriminating quantity is now the SHAPE of the log-cost distribution,
      standardized by its own spread, rather than the size of the gain. L is
      invariant under any rescaling of log C, so a null with a large spread no
      longer wins the comparison automatically and the power gate no longer
      fights the discriminator. Under a matched location-scale null, L takes the
      value determined by the null family alone, so the band is centred at zero
      excess with a dynamic range set by the measured bootstrap width; the
      planted-cheap-presentation control fixes the scale of a detectable excess
      before any Semaev arm is interpreted.
    alternative_hypothesis_range: >-
      Under H_generic - the presentation-cost distribution of a Semaev system is
      the same location-scale family as the random same-shape null - the expected
      excess in L is exactly 0 and its sampling distribution is the bootstrap
      distribution of a difference of two tail indices, whose width the
      pre-registered sample sizes must place below 0.25. Under H_structure the
      excess is at least 0.25. The two are separated, both are reachable, and the
      planted control demonstrates that an excess of a known size is detected.
  assumptions:
  - >-
    The Semaev membership system is built exactly as the committed harness builds
    it - S_{m+1}(x_1..x_m; x_R) together with the factor-base indicator
    polynomials - and the engine, its version, and the cost unit are pinned in
    the run record before any solve.
  - >-
    The knob distribution over presentations is frozen and seeded before
    execution and a presentation sample is reproducible from its seed alone.
  - >-
    A solve that reaches the pre-registered timeout is charged the timeout and
    counted as a right-censored observation. Censoring is handled by the declared
    rule on both arms identically, and no outcome-selected exclusion is
    permitted.
  - >-
    Toy scale only, m in {3, 4}. No crypto-scale Groebner call occurs anywhere in
    this hypothesis or its experiment.
  proof_search_map:
    bottleneck: >-
      The per-query membership solve cost inside the amortized query-cost
      constant. Nothing about the degree of regularity, the yield, or the
      relation count changes; only the price of one membership decision does.
    baseline_embedding:
      parameter_slice: >-
        k = 1, the single fixed canonical presentation in degrevlex with the
        harness variable order, which is exactly the committed backend. The
        measurement must reproduce the harness cost at that slice.
      reproduction_check: >-
        A frozen regression fixture of at least 20 systems solved in the
        canonical presentation, whose recorded cost must be reproduced by the
        presentation-sampling harness at k = 1 to within the measured
        deterministic-replay tolerance, before any re-randomized draw is taken.
    observation_collision:
      observable: >-
        The standardized left-tail index L of the log solve-cost distribution
        over presentations.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. L is a two-moment-plus-one-quantile
        summary of a whole distribution, so infinitely many distinct cost
        distributions share an L. The consequence is stated rather than hidden -
        L can support a claim that the tails differ and can never support a claim
        about WHY they differ or about which presentations are the cheap ones.
        The per-knob decomposition is what carries any mechanistic reading, and
        it is reported per knob and never pooled.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The presentation of a fixed ideal as a charged random variable, so that a
        membership query becomes a randomized-retry strategy over a frozen knob
        distribution rather than a single deterministic solve.
      predicted_gain: >-
        A constant-factor reduction in the expected per-query membership cost.
        NO EXPONENT. The strategy is latency-heavy by construction and that cost
        is charged identically on both arms.
    quantifier_order: >-
      CLAIMED - FOR the tested toy bit sizes and FOR m in {3, 4}, THERE EXISTS a
      frozen knob distribution under which the expected value of L on Semaev
      membership systems exceeds the expected value of L on random same-shape
      systems by at least 0.25. THE STRONGER READING EXPLICITLY NOT CLAIMED - FOR
      ALL knob distributions, or FOR ALL arities, or at any untested size. The
      knob distribution is a witness this hypothesis chooses and freezes, and a
      negative result closes only the frozen distribution.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at the tested toy sizes and arities the log solve-cost distribution
        of a Semaev membership system over the frozen presentation distribution
        has a heavier standardized left tail than that of a random system of the
        same shape, with the excess decomposed per knob family. It can NEVER
        certify an exponent, an attack, a statement about another solver, or a
        statement about crypto-scale systems.
      nearby_object_control: >-
        THE RANDOM SAME-SHAPE MULTIHOMOGENEOUS SYSTEM, which has the identical
        variable count and degree vector and NO curve anywhere in it. The
        hoped-for conclusion must FAIL there. A version of this measurement that
        reported the same excess on the curve-free null would be measuring the
        knob distribution rather than the Semaev system.
    proof_obligations:
    - claim: >-
        Every knob is ideal-preserving, so all presentation draws solve the same
        membership question.
      responsibility: correctness
    - claim: >-
        The cost unit is identical on the Semaev arm and on the null arm.
      responsibility: interface
    - claim: >-
        L has enough power at the declared sample sizes to resolve an excess of
        0.25.
      responsibility: success_probability
    - claim: >-
        The planted cheap presentation is found by the min-over-presentations
        procedure at the predicted quantile.
      responsibility: baseline
    - claim: >-
        No exponent statement is derivable from any outcome.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: >-
    This hypothesis IS a re-randomization device, but of the PRESENTATION and not
    of the instance. It is not a worst-to-average-case reduction - the instance,
    the target R and the factor base are held fixed and only the syntactic
    presentation of the same ideal varies - so no mixing-time argument is
    required and none is claimed. The solution is pulled back trivially because
    every draw solves the identical ideal.
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. The quantity under test is a constant and a tail
    shape inside a per-query cost, not an exponent. Recording an asymptotic_claim
    here would misstate the record at its most load-bearing point.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR Semaev membership systems at arity m in {3, 4} over prime fields of 12
      to 20 bits, with factor base size B = ceil(N^{1/m}), the log solve-cost
      distribution over the frozen presentation distribution has standardized
      left-tail index L exceeding that of the random same-shape multihomogeneous
      model by at least 0.25, uniformly over the tested cells.
    random_model_justification: >-
      The comparison distribution is the semi-regular random model for systems of
      the same degree vector, which is the standard null for Groebner complexity
      of a random system of given shape. The rigorous half is that presentation
      variance is strictly positive for any non-degenerate knob distribution,
      since monomial order alone changes the reduced basis; what is heuristic is
      the DIRECTION and MAGNITUDE of the tail-shape difference for the Semaev
      shape specifically.
    supporting_results: []
    supporting_results_note: >-
      EMPTY AND HONESTLY SO. No rigorous bound in this program''s corpus predicts
      a tail-shape difference for this family, and no recalled external result
      may discharge this field under AGENTS.md rule 9. The heuristic is carried
      as unsupported and is exactly what EXP-PFDR-acf64c measures.
    validation_experiment_ids:
    - EXP-PFDR-acf64c
    falsification_condition: >-
      The measured excess in L has a bootstrap confidence interval containing 0
      at every tested cell, or the interval lies below 0.25 at every cell.
  structural_ingredients:
  - description: >-
      Presentation dependence of Groebner basis computation - the reduced basis
      and the computation trajectory depend on the monomial order and on the
      generating set even though the ideal does not.
    citation: >-
      Classical computer-algebra fact, textbook level. Named as a pointer for the
      reviewer, not as support.
    provenance: recalled
    verified_by: null
    role: guarantees that presentation variance is nonzero, which is the
      precondition rather than the claim
  - description: >-
      The random same-shape multihomogeneous null object and its shape catalog,
      as used by this program''s prior ideation records.
    citation: IDEA-20260731-009, IDEA-20260727-006, IDEA-20260731-011
    provenance: internal
    verified_by: >-
      Relayed from IDEA-20260731-014 source_refs; the three cited proposals were
      NOT opened by TASK-20260904-5423ad and this entry is marked relayed for
      that reason.
    role: supplies the curve-free null object of matched shape
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      excess standardized left-tail index, dimensionless, Semaev arm minus
      curve-free same-shape arm
    direction: higher
    minimum_effect: >-
      At least 0.25 at m in {3, 4} and at two or more toy bit sizes, with the
      bootstrap confidence interval excluding 0.
  - metric: >-
      per-knob excess standardized left-tail index, dimensionless, per knob
      family
    direction: higher
    minimum_effect: >-
      At least one knob family alone reaching 0.15, reported per knob and never
      pooled.
  - metric: >-
      planted-cheap-presentation detection rate, fraction of planted systems in
      which the min-over-8-presentations procedure returns the planted cheap
      presentation
    direction: higher
    minimum_effect: >-
      At least 0.90 on systems carrying a planted presentation whose cost is a
      known factor 8 below the family median. Below that the harness lacks
      dynamic range and no arm is interpretable.
  - metric: >-
      presentation-variance to solver-noise ratio, dimensionless, per cell
    direction: higher
    minimum_effect: >-
      At least 2. A cell below 1 is reported as under-powered and is not pooled;
      it is an instrument statement, never a negative result.
  test_boundary:
    instances:
    - >-
      Toy prime-field short-Weierstrass curves with prime-order subgroups at 12,
      16 and 20 bits, at least 30 targets per (curve, m) cell.
    - >-
      At least 100 random same-shape multihomogeneous systems per Semaev cell,
      matched on variable count and degree vector, containing no elliptic curve.
    - >-
      A planted-cheap-presentation family with a known cheap presentation at a
      known cost quantile.
    parameters:
      arities: '3, 4'
      factor_base_size: 'B = ceil(N^{1/m})'
      presentation_draws_per_system: 8
      tail_index_quantile: 'q_{1/8} of log cost'
      knob_families: >-
        monomial order; variable permutation; ideal-preserving unimodular
        recombination with a pre-registered coefficient-growth bound; scalar
        rescaling as a declared no-op knob
    implementation: >-
      One pinned computer-algebra engine at a pinned version, invoked through
      harness/runner.py, with cost charged in engine reduction operations and
      wall time recorded as infrastructure only.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 24
      maximum_memory_gb: 8
      maximum_runs: 8
  falsification_conditions:
  - >-
    The excess standardized left-tail index has a bootstrap interval containing 0
    at every tested cell - S1 is false at tested scope and the presentation
    re-randomization lane closes for this frozen knob distribution at toy scale.
  - >-
    The excess is carried entirely by one knob family and no other family reaches
    0.15 - S2 is false and the effect is a property of one knob rather than of
    the system.
  - >-
    The planted-cheap-presentation control is detected below 0.90 - the harness
    lacks dynamic range, the run is INVALID, and no arm is read in either
    direction.
  - >-
    The curve-free same-shape null reproduces the Semaev excess within the
    bootstrap width - the effect is a property of the shape and the knob
    distribution, NOT of elliptic curves, and no statement about elliptic curves
    or the ECDLP may be quoted from any outcome.
  interpretation_limits:
  - >-
    A confirmed excess is a toy-scale constant-level statement about membership
    solve-cost distributions. It moves no exponent and is not an attack.
  - >-
    The scale-invariance of L is what makes the comparison fair and is also what
    it costs - L says the tails differ in shape and says nothing about the size
    of any realized saving. The realized randomized-retry cost is reported
    separately, in the same cost unit as the single-presentation cost, and is the
    only figure that may be quoted as a saving.
  - >-
    Scoped to one pinned engine at one pinned version. A different solver is a
    different measurement and nothing here transfers to it.
  - >-
    Timeout censoring biases any expectation-based statistic and is the reason
    the primary statistic is quantile-based. The censoring fraction is reported
    per cell and a cell above 20 percent censoring is reported as such.
  - >-
    THE SOURCE IDEA CITES DEC-20260730-001 AS THE DECISION THAT BLOCKED THE
    STR / phi_alpha displacement-rank instrument. THAT ATTRIBUTION IS WRONG.
    TASK-20260904-5423ad read DEC-20260730-001 and it is a support_scoped
    decision whose target_ids are H-XEDN-005, EXP-XEDN-006, EV-XEDN-005 and
    DEC-20260725-004, concerning GOAL-XEDN-003 and EXP-XEDN-006, with no STR or
    phi_alpha content. The substantive point survives independently and is
    checkable from the design itself - this hypothesis and EXP-PFDR-acf64c
    contain no displacement rank, no phi_alpha and no STR instrument of any kind.
    The identity of the decision that actually blocks that instrument is
    UNRESOLVED and must be located before any record relies on the exclusion.
  status: proposed
  proposed_by: coordinator
  owner: coordinator
  prior_evidence_refs:
  - RQ-ECDLP-002
  - IDEA-20260731-014
  - DEC-20260730-001
