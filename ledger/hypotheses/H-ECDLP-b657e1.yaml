  updated: '2026-09-13'
  depends_on:
    - IDEA-20260806-20f6ab
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the closed-form
    representation-multiplicity
    identities of IDEA-20260806-20f6ab
    before any factor base is built, any
    half-list is stored, or any discrete
    logarithm is solved. Stage 0 asserts
    only that on the frozen even-arity
    grid {2,4,6,8,10,32} the binomial
    C(m,m/2) equals the exact integers
    2, 6, 20, 70, 252, 601080390, and
    that the MITM exponent 1/2+1/m is
    independent of those integers. A
    nearby claim that C(32,16) moves the
    MITM exponent is rejected. A dummy
    constant multiplicity 1 is rejected
    as a representation gain. This is
    not a representation attack and not
    a rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260806-20f6ab tracks
    rho_rep(m)=C(m,m/2) as the exact
    price of a large-prime /
    windowed-half-sum escape. Stage 0
    freezes the binomial table and the
    exponent-independence identity so a
    later join cannot be read from an
    instrument that silently moves
    1/2+1/m. No list is built. No Semaev
    S_m. No Coppersmith. No DLP solve.
  predictions:
    - id: P-S0-REPMULT
      metric: closed-form identities on the frozen REAL / KF / NULL panel
      direction: different
      minimum_effect: >
        After fixture_pass, REAL reports
        C(2,1)=2, C(4,2)=6, C(6,3)=20,
        C(8,4)=70, C(10,5)=252,
        C(32,16)=601080390, and
        mitm_exponent(m)=1/2+1/m on
        {2,4,8,32}. KF
        C(32,16)-moves-exponent is rejected.
        NULL constant-multiplicity-1 is
        rejected.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, the KF
        claim is accepted. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, REAL misses
        a frozen identity. That
        falsifies only P-S0-REPMULT
        at the frozen arithmetic.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL arithmetic panel
    parameters:
      real_grid:
        m: [2, 4, 6, 8, 10, 32]
        C_m_half: [2, 6, 20, 70, 252, 601080390]
        mitm_exponent_m: ['1', '3/4', '5/8', '17/32']
        mitm_exponent_m_grid: [2, 4, 8, 32]
        must_binomial_table: true
        must_exponent_independent_of_C: true
      known_false:
        kind: C32_moves_mitm_exponent
        must_reject: true
      matched_null:
        kind: constant_multiplicity_one
        must_reject: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-bd5ea1 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy / closed-form arithmetic
      only. No curve construction.
      No Semaev S_m evaluation. No
      Coppersmith. No DLP. No rho
      beat. The frozen numbers are
      the proposal's own identities,
      not a fitted result.
  assumptions:
    - id: A1
      statement: >
        Stage 0 evaluates only the
        frozen closed-form identities.
        It does not execute an attack
        and does not solve a DLP.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether C(m,m/2) equals the frozen
      integers and whether 1/2+1/m is
      independent of C.
    baseline_embedding:
      parameter_slice: >
        The REAL grid, the KF claim,
        and the NULL dummy. Disclosed
        tightening: arithmetic
        calibrator only, not later
        stages of the proposal.
      reproduction_check: >
        REAL identities hold. KF
        rejected. NULL rejected.
    observation_collision:
      observable: representation multiplicity C(m,m/2) versus MITM exponent 1/2+1/m
      distinct_preimage_search: >
        Hold m=32 and claim C moves the
        exponent (KF). Hold the method and
        set C=1 (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen Stage 0 identity table.
        predicted_gain: >
          Exact known-false reject on
          KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze the formula and grid
      before reading the table.
      Existential equality at one
      grid does not imply an attack.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        the declared frozen
        arithmetic. Never an attack.
        Never a DLP solve. Never a
        rho beat. Never an ECDLP
        exponent.
      nearby_object_control: >
        NULL is a constant multiplicity 1.
        An argument that still calls it a
        representation gain is
        proves-too-much.
  knowledge_promotion:
