  proposal_id: IDEA-20260806-20f6ab
  title: >
    Stage 0 closed-form
    representation-multiplicity
    identities — C(m,m/2) on the frozen
    arity grid — before any half-list is
    built
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-524f94
  specified_by: DEC-20260913-aaa379
  specified_at: '2026-09-13'
