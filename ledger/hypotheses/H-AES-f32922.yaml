hypothesis:
  id: H-AES-f32922
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  source_idea_ids:
    - IDEA-20260910-321d6a
  proposal_id: IDEA-20260910-321d6a

  statement: >-
    TRACKED CLAIM (adjudicable only against REF-A / REF-B / REF-C under
    RQ-AES-003 R1–R3). There exists a secret-key distinguisher OBJECT for
    AES-128 reduced to r=5 whose ACCEPT predicate is the conjunction of
    (a) a PROGRAM-LOCAL related-differential / zero-difference pairing
    predicate P_RD on named byte sets after r rounds and (b) a PROGRAM-LOCAL
    friend-pair certificate filter F_fp (bounded inverse-diagonal exchange
    search), such that at matched data/kind/query budget: measured ACCEPT
    rate on AES-128 at r=5 is strictly above the matched 10-round AES control
    rate; control FPR of the joint rule is quantified at pre-registered N;
    and end-to-end adaptive query cost under frozen CM-3 is recorded as a
    PROGRAM BASELINE for this object. NO claim that the object beats any
    published ACP/ACC figure (R3). A Stage-1 negative that F_fp does not
    preferentially suppress the random side for this P_RD is first-class
    scoped evidence.

  mechanism: >-
    Fix one program-local related-differential / zero-difference ACCEPT
    predicate P_RD at r=5, independently re-derived or reused from this
    program's exchange / related-differential harness lineage
    (IDEA-20260807-4ee607 / IDEA-20260828-82676b), never copied from unread
    PDF internals of Yan/Tan/Qi (KN-LIT-1848 POINTER) or Shin (KN-LIT-1424
    POINTER). Define F_fp as a bounded search over a fixed number of
    inverse-diagonal exchanges for auxiliary texts satisfying a PROGRAM-LOCAL
    friend-certificate shape (Shin-inspired amplifier; Stage 0 may smoke-check
    control-side fully-active pattern motion without asserting Shin's published
    ACC). The distinguisher ACCEPTS iff P_RD AND F_fp both hold. Cost:
    per-attempt = cost(P_RD query) + expected friend-search cost; success
    probability MEASURED; CM-3 charges cost/p. Discrimination: if F_fp
    suppresses 10-round control acceptance more than AES-side acceptance while
    preserving AES-side P_RD mass, the composition improves the adjudicable
    likelihood ratio; if suppression factors are statistically
    indistinguishable, the friend filter is non-discriminating for this P_RD
    and the composition path is falsified as an improvement.

  assumptions:
    - >-
      P_RD is a fixed, code-declared byte-set related-difference /
      zero-difference predicate frozen before Stage 1 AES arms are read;
      adaptive query schedule is frozen before AES arms (verdict-on-null-first).
    - >-
      F_fp is PROGRAM-LOCAL operationalisation of friend-pair + inverse-diagonal
      exchange suppression, labelled as such — not a paper reproduction of Shin
      ePrint 2025/248.
    - >-
      Ground truth cipher is the pinned GOAL-AES-001 FIPS-197 harness
      (aes_reduced.py, MODULE_SHA256
      2c76f3e5db83ec2500ce1010a392a135869d8b9dd1a534af817e06f15babb447), reused
      with its declared defect set; any second engine must re-pin against the
      same FIPS-197 KATs before charging measurements.
    - >-
      Adjudication is only vs REF-A (definitional 2^127 r-round evaluations),
      REF-B (same P_RD without F_fp, measured here), and REF-C (campaign
      measured death rounds: full-diagonal integral dead at r=5; yoyo fixtures
      alive@5 / dead@6). Published ACP/ACC figures are POINTERS only (R3).
    - >-
      Toy / reduced-round claim ceiling only. Related-key / known-key variants
      never complete under RQ-AES-003. Extension to r=6 is out of scope for this
      hypothesis (see IDEA-20260910-4b25eb).

  proof_search_map:
    not_applicable_reason: >-
      Empirical distinguisher-object measurement with pre-registered FPR and
      CM-3 cost accounting. No asymptotic theorem, certificate family, or
      proof-oriented claim is asserted; inventor-protocol §8 audits are not
      the load-bearing content. Lossy-projection audit for ACCEPT is recorded
      on IDEA-20260910-321d6a and inherited.

  rerandomization: null
  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-FP1
      formal_statement: >-
        On a matched 10-round AES-128 control at identical data/kind/query
        budget, the friend-pair certificate F_fp behaves like an approximately
        independent rare event whose rate is governed by the exchange pattern's
        random-permutation active-diagonal occupancy model, so
        rate(P_RD AND F_fp) ≈ rate(P_RD) × rate(F_fp) up to small dependence
        within a pre-registered relative-error band.
      random_model_justification: >-
        Classical random-permutation heuristic for active/inactive diagonal
        occupancy under inverse-diagonal exchanges (POINTER KN-LIT-6976);
        independence is heuristic, not a theorem for AES.
      supporting_results: []
      validation_experiment_ids:
        - EXP-AES-14352a
      falsification_condition: >-
        On >=16 control keys at the frozen Stage-1 budget, control joint rate
        differs from the product rate(P_RD)×rate(F_fp) by >3× beyond sampling
        error — dependence model fails; joint thresholds void for HEUR-FP1.
    - id: HEUR-FP2
      formal_statement: >-
        On AES-128 at r=5, F_fp is positively associated with P_RD relative to
        the control association (friend witnesses more frequent when the
        related-differential structure is present), measurable as an odds-ratio
        AES > control within sampling error at Stage 1.
      random_model_justification: >-
        Structural analogy to Shin's reported friend-pair suppression on
        exchanged-boomerang patterns (POINTER KN-LIT-1424); transfer to
        related-differential pairings is exactly the hypothesis under test.
      supporting_results: []
      validation_experiment_ids:
        - EXP-AES-14352a
      falsification_condition: >-
        Odds ratio AES ≤ control within error at Stage 1 — HEUR-FP2 dead;
        composition path closed for this P_RD.

  structural_ingredients:
    - description: >-
        Friend-pair + inverse-diagonal exchange random-suppression amplifier
        (Shin et al., ePrint 2025/248) — POINTER only; program-local filter.
      citation: KN-LIT-1424
      provenance: kb
      verified_by: null
      role: amplifier ingredient for F_fp
    - description: >-
        Related-differential / zero-difference pairing ingredients
        (Yan/Tan/Qi, ePrint 2026/1039) — POINTER only; P_RD re-derived locally.
      citation: KN-LIT-1848
      provenance: kb
      verified_by: null
      role: pairing ingredient for P_RD
    - description: >-
        Prior related-differential / exchange congruence gate WITHOUT friend
        pairs — nearest internal prior; this hypothesis adds the friend-pair axis.
      citation: IDEA-20260828-82676b
      provenance: internal
      verified_by: coordinator (read IDEA-20260910-321d6a and IDEA-20260828-82676b this session)
      role: nearest internal baseline object (different predicate; no F_fp)

  reduction_chain:
    core_problem: >-
      Program-adjudicable secret-key distinguisher object for reduced-round
      AES-128 under RQ-AES-003 REF-A/B/C only.
    corollaries: []

  predictions:
    - metric: >-
        Measured AES-r=5 ACCEPT rate of (P_RD AND F_fp) minus measured
        10-round-AES control ACCEPT rate, at matched data/kind and N>=16 keys
      direction: higher
      minimum_effect: >-
        AES rate exceeds control rate with one-sided p < 0.01 under the
        pre-registered binomial / Poisson model, AND control FPR stated with
        resolution in bits in the same sentence (RQ-AES-003 R4(1)).
    - metric: >-
        Friend-filter ablation ratio rate(P_RD AND F_fp)/rate(P_RD) on control
        versus the same ratio on AES
      direction: lower
      minimum_effect: >-
        Control ablation ratio strictly below AES ablation ratio (friend filter
        preferentially suppresses random).
    - metric: Measured end-to-end CM-3 cost of one ACCEPT decision (AES-r=5)
      direction: lower
      minimum_effect: >-
        Recorded as PROGRAM BASELINE; comparison only to REF-A / REF-B / REF-C.
        No published ACP/ACC margin.

  test_boundary:
    instances:
      - AES-128 single-key adaptive chosen-plaintext / chosen-ciphertext at r=5
      - matched 10-round AES-128 null control at identical data/kind/budget
    parameters:
      cipher: AES-128
      rounds_primary: 5
      rounds_graded: [4, 5, 6]
      rounds_null: 10
      keys_stage1: 16
      claim_adjudication: [REF-A, REF-B, REF-C]
      threat_model: single-key
    implementation: >-
      Pinned FIPS-197 harness
      coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-602/aes_reduced.py
      (sha256 2c76f3e5db83ec2500ce1010a392a135869d8b9dd1a534af817e06f15babb447);
      Stage-1 implementation under experiments/EXP-AES-14352a/implementation/.
    budget:
      stage: Stage 1 decisive ablation (Stage 0 optional; Stage 2 gated)
      independent_keys: '>=16'
      enforcement: advisory
      maximum_memory_gb: 8

  falsification_conditions:
    - >-
      Friend filter suppresses AES and control ACCEPT rates by statistically
      indistinguishable factors at Stage 1 — composition adds no adjudicable
      discrimination for this P_RD.
    - >-
      Control FPR of (P_RD AND F_fp) not below control FPR of P_RD alone at the
      pre-registered budget — friend filter fails to suppress random.
    - >-
      Excess that does not decay from r=5 to r=6 to 10-round control — artifact
      tell; void the reading.
    - >-
      Any citation of recalled published ACC/ACP as a completion margin —
      claim-tier / R3 violation; invalid as evidence.

  interpretation_limits:
    - Toy tier, reduced-round only (RQ-AES-003 R6/R7). No full-round claim.
    - Published-frontier comparisons UNADJUDICABLE in both directions (R3).
    - Related-key / known-key variants never complete under this RQ.
    - Protocol approval does not assert the scientific statement is true.
    - Stage 2 CM-3 baseline vs REF-B is gated on Stage 1 preferential suppression.

