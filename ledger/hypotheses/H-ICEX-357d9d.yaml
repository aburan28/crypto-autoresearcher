hypothesis:
  id: H-ICEX-357d9d
  question_id: RQ-SDEG-001
  statement: >-
    The scaling exponent fitted to Semaev decomposition cost on the lane's frozen
    instance set is stable across monomial orders - the exponents fitted under
    degrevlex, a block order and lex agree within their 95 percent confidence
    intervals - even though the solving degree and the raw operation count differ
    materially between orders. If the exponents do NOT agree, the lane's cost
    model is order-specific and every downstream use of it must name the order it
    belongs to.
  mechanism: >-
    The ideal and its variety are order-independent, so the underlying problem
    does not change with the order. Solving degree and solver cost are properties
    of the ALGORITHM and the PRESENTATION, not of the ideal, and the classical
    worst-case gap between lex and degrevlex cost is enormous. Exponent stability
    is therefore a genuinely open empirical question rather than a consequence,
    and it is the only part of the order question the lane's cost model actually
    consumes.
  assumptions:
  - >-
    Several monomial orders complete on the frozen instances within budget. This
    is uncertain for lex specifically, and a lex cell that does not complete is
    recorded as UNMEASURED, never as evidence that the system is hard under lex
    (AGENTS.md rule 5).
  - >-
    Solving degree under different orders is not the same quantity. The spread is
    therefore interpreted alongside operation counts and wall clock, never alone,
    and the record never presents cross-order degree differences as differences
    in the difficulty of the ideal.
  - >-
    BAND NON-DEGENERACY, ADDED BY THIS CONTRACT AND NOT PRESENT IN THE SOURCE
    IDEA. The source idea proposes bounding solver variance by running the SAME
    ORDER TWICE. For a deterministic Groebner engine on a fixed instance the
    solving degree and the operation count are deterministic, so that null has
    variance ZERO BY CONSTRUCTION and can bound nothing; a cross-order difference
    of any size would clear a zero-width band and the discriminator would be
    vacuous. This contract therefore replaces it with two controls - a
    bit-identical re-run as a FORCED-VALUE determinism check requiring exactly
    equal degree and operation count, and the INSTANCE-TO-INSTANCE spread within
    one order as the comparison band against which cross-order differences are
    read. The change is stated rather than absorbed.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
    - transform: null
      proposed_object: null
      predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
    - claim: null
      responsibility: null
    not_applicable_reason: >-
      An instrument-convention measurement. Order-dependence of Groebner cost is
      classical and is used, not improved; no theorem is sought.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR ALL monomial orders that complete on the frozen instance set within
      budget, the fitted scaling exponent of Semaev decomposition cost against
      the size parameter agrees across orders within the union of their 95
      percent confidence intervals.
    random_model_justification: >-
      The rigorous ingredient is that the ideal and its variety are
      order-independent, so the problem being solved does not change. THE GAP,
      STATED - solving degree and solver cost are properties of the algorithm and
      the presentation, and the classical worst-case gap between lex and
      degrevlex cost is enormous, so exponent stability is an empirical question
      rather than a consequence of order-independence of the ideal.
    supporting_results:
    - >-
      Order-independence of the ideal and its variety, classical, used only to
      state what does NOT change with the order.
    validation_experiment_ids:
    - EXP-ICEX-492993
    falsification_condition: >-
      Fitted exponents differing across completing orders beyond the union of
      their confidence intervals.
  structural_ingredients:
  - description: >-
      RQ-SDEG-001 constraint, read verbatim - matched rho/BSGS controls and
      certificates are mandatory, and no implementation or experiment until the
      protocol passes independent review. This contract is drafted, not approved,
      and carries the matched-control obligation into its own artifact list.
    citation: RQ-SDEG-001
    provenance: internal
    verified_by: coordinator (TASK-20260904-074465, file read in full)
    role: lane constraint inherited by this contract
  reduction_chain: null
  predictions:
  - metric: bit_identical_rerun_determinism_check
    direction: different
    minimum_effect: >-
      FORCED exact - identical solving degree and identical operation count on a
      repeated run with identical inputs, order, engine version and seed. A
      departure means the engine is nondeterministic and every cross-order
      comparison in the run is inadmissible until the nondeterminism is
      characterised.
  - metric: variable_permutation_planted_defect
    direction: different
    minimum_effect: >-
      Under a permutation of variables that the Semaev system is symmetric in,
      the solving degree and operation count must be UNCHANGED, exactly. Under a
      declared NON-symmetric variable ordering with lex, the operation count must
      change by at least a factor 2. The pair is the defect of known direction
      with a demonstrated dynamic range - an instrument that moves on the first
      or fails to move on the second cannot see presentation at all.
  - metric: solving_degree_and_operation_count_spread_across_orders
    direction: different
    minimum_effect: >-
      Read against the WITHIN-ORDER instance-to-instance interquartile range, not
      against a repeated run. A cross-order median difference of at least one
      degree, or of at least a factor 2 in operations, is a real spread.
  - metric: fitted_scaling_exponent_under_each_order
    direction: different
    minimum_effect: >-
      The decision-relevant comparison. Agreement within the union of the 95
      percent intervals means the lane's convention is immaterial at this scope;
      disagreement means the cost model is order-specific.
  - metric: order_instance_cells_that_did_not_complete
    direction: different
    minimum_effect: >-
      Reported as UNMEASURED with the censoring fraction per order. Never
      reported as evidence that the system is hard under that order.
  test_boundary:
    instances:
    - the lane's smallest frozen Semaev instance set
    - at least 5 instances per order and at least 5 repetitions for the timing channel
    parameters:
      orders: [degrevlex, block, lex]
      per_cell_time_cap: frozen and identical across orders
      engine_version: frozen and recorded in every manifest
    implementation: >-
      One Groebner engine with the monomial order as a declared flag, so the only
      difference between arms is the order.
    budget:
      wall_clock_seconds_per_run: 7200
      maximum_memory_gb: 24
      maximum_runs: 200
  falsification_conditions:
  - >-
    The bit-identical re-run does not reproduce degree and operation count
    exactly. The engine is nondeterministic and no cross-order comparison is
    admissible.
  - >-
    The symmetric-permutation control changes the solving degree, or the
    non-symmetric lex control does not change operations by at least a factor 2.
    The instrument cannot see presentation and no spread it reports is
    admissible.
  - >-
    The fitted exponents differ across completing orders beyond the union of
    their intervals. HEUR-001 is falsified within the tested scope and the lane's
    cost model is order-specific.
  - >-
    Only one order completes. The comparison cannot be made; the lane's
    convention is FORCED rather than chosen, which is reported as such and is not
    a result about order-dependence.
  interpretation_limits:
  - >-
    Measures an instrument convention. Produces no cost model, no exponent claim
    of its own, and no evidence about index calculus versus rho.
  - >-
    Scoped to the tested orders, the frozen instance set and the frozen solver
    implementation and version.
  - >-
    A stable exponent across orders supports the lane's convention at THIS scope
    only, and specifically over the orders that completed. It says nothing about
    an order that timed out.
  - >-
    TIMEOUT ASYMMETRY IS A CENSORING PROBLEM, NOT A RESULT. Lex commonly times
    out where degrevlex completes. A censored lex arm biases any spread estimate
    toward agreement, which is the direction that would let the lane keep its
    convention unexamined; the censoring fraction is therefore reported beside
    every spread.
  - >-
    The random dense matched-shape null is a curve-free object. If it reproduces
    the cross-order spread, the spread is a property of system shape, not of
    Semaev or of elliptic curves, and nothing here may be quoted as an
    elliptic-curve statement.
  status: proposed
  proposed_by: coordinator
