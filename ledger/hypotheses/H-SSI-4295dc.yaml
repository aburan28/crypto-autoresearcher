hypothesis:
  id: H-SSI-4295dc
  question_id: RQ-SSI-001
  title: >-
    Structured-target covering: a streamed smooth-degree codomain list from a random supersingular E
    hits the radius-r ball around the F_p-rational locus at the rate a uniformly random target set of
    the same cardinality would give, which is the sole heuristic the batch preprocessing frontier
    (per-instance time) x (storage) = p rests on
  statement: >-
    Let V be the supersingular vertex set over F_{p^2}, let V_p be the F_p-rational locus with
    |V_p| = Theta(p^{1/2}), and let W_s be the radius-r non-backtracking ball around V_p in the
    2-isogeny graph with 2^r = p^s and 0 <= s < 1/2. Let C_N(E) be the set of the first N distinct
    codomains of smooth-degree cyclic isogenies from a uniformly random supersingular E. THE
    HYPOTHESIS ASSERTS THREE SEPARABLE THINGS. (H-A, arithmetic, no compute) The cost frontier
    (per-instance time, shared storage) = (p^{1/2-s+o(1)}, p^{1/2+s+o(1)}) has forced calibration
    points at s = 0 (Delfs-Galbraith, p^{1/2} at polynomial memory), s = 1/2 (whole-graph
    tabulation) and s = 1/6 (p^{1/3} time at p^{2/3} storage), and the single-instance total with
    precomputation charged is at least p^{1/2+o(1)} at EVERY s, hence dominated by the incumbent
    p^{1/3+o(1)}. (H-B, heuristic H3, the measured part) The hit rate of C_N(E) against W_s equals
    the covering prediction N|W_s|/|V| within a factor in [0.8, 1.25] at the tested toy primes and
    radii, stratified by ball radius. (H-C, heuristic H4) |W_r| = Theta(p^{1/2} 2^r) while
    2^r <= p^{1/2-eps}, i.e. balls around distinct anchors are essentially disjoint up to
    saturation. NOTHING HERE ASSERTS AN EXPONENT IMPROVEMENT. The per-instance figure p^{1/2-s} is
    amortised in a batch model and may never be quoted without its storage exponent 1/2+s and its
    break-even target count of order p^{1/6+s}.
  mechanism: >-
    A stored vertex is useful only if it carries a witness, and witnesses are structurally free
    exactly on V_p, where the Frobenius endomorphism pi with pi^2 = -p is non-scalar and of size
    O(1). Ball expansion propagates witnesses at O(1) storage per vertex because a PATH is what is
    stored: an ell-step multiplies the witness degree by ell^2, and conjugating the stored witness by
    the recorded path yields rho o pi o dual(rho) in End(F), which is non-scalar because its degree
    2^{2r} p is (square) x p and p is not a square. Given a target E, streaming smooth-degree
    codomains and testing membership in the stored table yields, on a hit at F with connecting
    isogeny sigma, the non-scalar endomorphism dual(sigma) o rho o pi o dual(rho) o sigma of E. The
    exponent then comes from a COVERING condition N|W| = Theta(p), not from chain structure, which is
    why the product is time x storage = p and not a Hellman-type time x storage^2. THE ENTIRE
    FRONTIER RESTS ON H3, and H3 is a live question rather than a formality precisely because W_s is
    built around the fixed-point set of the Frobenius involution, the most structured subset of this
    graph. A named mechanism by which H3 could fail is correlation of the indicator 1_{V_p} with a
    low-lying eigenvector of the Brandt/Hecke operators, which would produce a deficit or a surplus
    in the hit rate. A deficit means the frontier is WORSE than derived and every published analysis
    that walks to the subfield locus carries an uncharged correction; a surplus means smooth-reachable
    sets are biased toward the subfield locus, a structural fact new to this corpus. Both are
    findings and they point at opposite corrections.
  assumptions:
    - >-
      Witnesses propagate along the ball at O(1) storage per vertex: storing a j-invariant and a path
      index suffices and no endomorphism is expanded until a hit occurs.
    - >-
      Streaming the list from E costs Theta(1) per codomain tested and polylog memory beyond the
      shared table, with the Theta(log X) per-element cost of producing list elements WITHOUT a local
      table disclosed as a (log p)-cofactor rather than hidden.
    - >-
      The shared table's access cost is charged rather than assumed free; under the Wiener 3D wiring
      model a table of p^{1/2+s} entries pays a wiring factor p^{(1/2+s)/3}.
    - >-
      The k batched targets are independent instances over the SAME p. A batch over different
      characteristics shares nothing, and that is the boundary of the whole model.
    - >-
      Vertices are assigned to their MINIMAL ball radius, so overlapping balls around nearby anchors
      do not double-count storage.
  proof_search_map:
    bottleneck: >-
      The covering condition N|W| = Theta(p): how many streamed codomains must be produced before
      meeting a stored witness. Everything else in the frontier is bookkeeping around it.
    baseline_embedding:
      parameter_slice: >-
        s = 0 must reproduce Delfs-Galbraith's p^{1/2+o(1)} exactly, with the subfield locus stored
        rather than walked to; s = 1/2 must reproduce trivial whole-graph tabulation (p^{o(1)} time
        at storage p); s = 1/6 must land at (p^{1/3}, p^{2/3}).
      reproduction_check: >-
        SYMBOLIC AND FROZEN. Substitute s = 0 into (p^{1/2-s}, p^{1/2+s}) and require
        (p^{1/2}, p^{1/2}); substitute s = 1/2 and require (p^{o(1)}, p); check the s = 1/6 crossing.
        A frozen fixture asserts all three plus the single-instance domination statement. If the
        s = 0 slice does not reproduce Delfs-Galbraith, the model is wrong and nothing else is
        recorded.
    observation_collision:
      observable: >-
        "The streamed codomain lies in W_s" -- a table hit.
      distinct_preimage_search: >-
        TWO DISTINCT GROUND-TRUTH SITUATIONS PRODUCE THE SAME OBSERVABLE and must be separated: a hit
        because the codomain is in the ball proper, and a hit because it is in V_p itself (radius 0),
        which is a much denser event at small r and would inflate the measured rate at exactly the toy
        parameters where r is forced to be small. SEPARATING CONDITION: record each hit's ball-radius
        stratum and report the rate PER STRATUM, never pooled.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A problem-specific resource measure, "stored witnesses", realised by the F_p-locus
          specialisation, with the ball's charges added over radius strata that are disjoint by
          construction.
        predicted_gain: >-
          The frontier time x storage = p, which is the first charged preprocessing axis on this
          question.
      - transform: boundary_lift
        proposed_object: >-
          Delfs-Galbraith as the s = 0 boundary of a family, lifted by enlarging the stored set rather
          than by improving the search.
        predicted_gain: >-
          A strict inward improvement in PER-INSTANCE time at a stated storage cost, and -- honestly
          -- no improvement at all once precomputation is charged to a single instance.
    quantifier_order: >-
      There EXISTS a table W_s, computable from p ALONE and independent of every instance, such that
      FOR ALL supersingular E the per-instance cost is p^{1/2-s+o(1)}. THE INSTANCE-INDEPENDENCE OF
      THE TABLE IS THE ENTIRE CLAIM: a table allowed to depend on E would be a single-instance
      algorithm with its preprocessing mislabelled, which is the standard way precomputation results
      are overstated, and this quantifier order is where that would be caught.
    method_ceiling:
      strongest_certifiable_claim: >-
        "With an instance-independent table of p^{1/2+s} stored witnesses anchored at the F_p locus,
        per-instance cost is p^{1/2-s+o(1)}." It certifies nothing about tables anchored elsewhere,
        nothing about single-instance cost, and nothing below p^{1/2} total for one instance.
      nearby_object_control: >-
        THE INCUMBENT ITSELF, where the hoped-for conclusion "precomputation helps" is KNOWN FALSE:
        the p^{1/3+o(1)} algorithm needs no shared table and beats every point of this frontier in the
        single-instance model. A precomputation analysis that cannot see that it loses to a no-table
        algorithm has mis-charged its own preprocessing.
    proof_obligations:
      - claim: "|W_s| = Theta(p^{1/2} 2^r) for 2^r <= p^{1/2-eps}."
        responsibility: size
      - claim: Precomputation cost is Theta(|W_s|) modular-polynomial steps.
        responsibility: runtime
      - claim: >-
          Each stored witness is non-scalar, and so is every pullback, because the degree is
          (square) x p.
        responsibility: correctness
      - claim: A hit occurs within N = Theta(p/|W_s|) streamed codomains.
        responsibility: success_probability
      - claim: The s = 0 slice reproduces Delfs-Galbraith.
        responsibility: baseline
      - claim: >-
          Single-instance total is at least p^{1/2+o(1)} at every s, hence dominated by the incumbent.
        responsibility: scope
    not_applicable_reason: null
  asymptotic_claim:
    problem: >-
      The supersingular endomorphism-ring / OneEnd problem over F_{p^2}, in a BATCH model with
      instance-independent precomputation.
    prior_best: >-
      p^{1/3+o(1)} time and memory conditional on Heuristic 1 (Wesolowski 2026); p^{1/2}(log p)^{O(1)}
      time at polynomial memory unconditionally (Delfs-Galbraith); van Oorschot-Wiener
      p^{1/2+o(1)}/w^{1/2} at memory w, defined for w <= p^{1/3+o(1)}.
    time_exponent: >-
      PER-INSTANCE, AMORTISED IN A BATCH MODEL: p^{1/2-s+o(1)}. SINGLE-INSTANCE, PRECOMPUTATION
      CHARGED: at least p^{1/2+o(1)} at every s, WORSE than the incumbent. No exponent improvement is
      claimed on any axis.
    memory_exponent: >-
      Shared storage p^{1/2+s+o(1)}; per-instance working memory polylog beyond the shared table.
      Under the Wiener full-cost model the shared table additionally pays p^{(1/2+s)/3}, giving a
      full-cost per-instance figure p^{2/3-2s/3+o(1)}.
    hidden_cofactor: >-
      (log p)^{O(1)} from the BFS, the list build and the table lookups, plus Theta(log X) per element
      for producing list elements without a local table. It is NOT claimed that this o(1) is smaller
      than the incumbent's superpolynomial one; it is a different quantity and the comparison is made
      at the exponent level only.
    claim_kind: constant_factor
  heuristic_assumptions:
    - id: H3
      formal_statement: >-
        STRUCTURED-TARGET COVERING. Let E be a uniformly random supersingular curve over F_{p^2}, let
        C_N(E) be the set of the first N distinct codomains of smooth-degree cyclic isogenies from E,
        and let W be the radius-r ball around the F_p-rational locus with |W| = p^{1/2+s}, s < 1/2.
        Then Pr[C_N(E) intersect W is non-empty] = 1 - exp(-Theta(N |W| / |V|)), i.e. the structured
        set W is hit at the rate a uniformly random set of the same cardinality would be, uniformly
        for N|W| between p^{1-eps} and p^{1+eps}.
      random_model_justification: >-
        The supersingular ell-isogeny graph is Ramanujan (Pizer, RECALLED and unverified in this
        program), so a non-backtracking walk of length Theta(log p) is within o(1) of stationary in
        total variation, and the expander mixing lemma bounds the deviation of |C_N intersect W| from
        N|W|/|V| by the second eigenvalue times sqrt(N|W|). The classical distribution statement it
        imitates is quasirandomness: two balls in an expander meet in the product of their densities.
        THE GAP, PLAINLY: the mixing lemma controls the deviation only when N|W| is comfortably large,
        and W is the fixed-point set of the Frobenius involution enlarged by a ball, so a correlation
        of 1_{V_p} with a low-lying Brandt/Hecke eigenvector is a NAMED mechanism by which H3 could
        fail. That mechanism is why this is measured rather than assumed.
      supporting_results:
        - >-
          Pizer, Ramanujan graphs and Hecke operators. RECALLED and unverified in this program;
          IDEA-20260815-1cc763 owns the spectral-gap question and this record defers to it rather than
          assuming a numerical gap.
        - >-
          The O(log p) mixing statement quoted internally at line 193 of
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, read directly by the proposing session.
      validation_experiment_ids:
        - EXP-SSI-dd6944
      falsification_condition: >-
        A measured hit-rate ratio outside [0.5, 2.0] at two or more primes, with the shuffled-list
        control returning 1.00 (so the deviation is in the target set, not the instrument) and the
        deviation decaying in the list radius X.
    - id: H4
      formal_statement: >-
        BALL GROWTH. For 2^r <= p^{1/2-eps}, the radius-r non-backtracking ball around the
        F_p-rational locus has cardinality Theta(p^{1/2} 2^r), i.e. balls around distinct anchors are
        essentially disjoint up to saturation.
      random_model_justification: >-
        Non-backtracking walks in an (ell+1)-regular graph give exactly ell^r (ell+1) endpoints with
        multiplicity; disjointness up to saturation follows from expansion. The named failure mode is
        that V_p is itself a union of class-group orbits and therefore clustered, so its ball could
        self-overlap earlier than a random anchor set of the same size.
      supporting_results:
        - >-
          Pizer expansion, RECALLED; the same unverified ingredient as H3.
      validation_experiment_ids:
        - EXP-SSI-dd6944
      falsification_condition: >-
        Measured ball growth below 0.8 of prediction at a radius materially smaller than that of a
        MATCHED RANDOM ANCHOR SET of the same cardinality, replicated at two primes.
  structural_ingredients:
    - description: >-
        Delfs-Galbraith as a memory-free algorithm of complexity p^{1/2}(log p)^{O(1)}, used as the
        forced s = 0 calibration point.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 51
      provenance: internal
      verified_by: idea-generator session 2026-08-21, lines 1-240 read directly
      role: baseline calibration point
    - description: >-
        The non-scalarity argument via the inseparable degree p not being a square, reused verbatim
        for the stored witness and every pullback.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 220
      provenance: internal
      verified_by: idea-generator session 2026-08-21
      role: correctness of the witness construction
    - description: >-
        The van Oorschot-Wiener interpolation sqrt(N^3/w), valid for w <= N = p^{1/3+o(1)} and
        returning the incumbent at w = N, which is why no published method converts storage above
        p^{1/3} into time below p^{1/3}.
      citation: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md line 39; KN-TECH-058
      provenance: internal
      verified_by: idea-generator session 2026-08-21
      role: frontier comparison
    - description: >-
        Wiener 3D wiring full-cost model, charging a shared table of S entries a clock-cycle penalty
        S^{1/3}.
      citation: KN-TECH-057
      provenance: internal
      verified_by: idea-generator session 2026-08-21
      role: full-cost charging of the shared table
  reduction_chain:
    core_problem: >-
      Producing a non-scalar endomorphism of a given supersingular E (OneEnd) in a batch model with
      shared instance-independent precomputation.
    corollaries: []
  predictions:
    - metric: hit_rate_over_covering_prediction
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00. Accept H3 at the tested scope if the ratio lies in [0.8, 1.25] at three toy
        primes and three radii. A ratio outside [0.5, 2.0], replicated and decaying in X, is the
        finding.
    - metric: ball_growth_ratio
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00 while 2^r <= p^{1/2-eps}, falling below as the ball saturates. The radius at
        which it first drops below 0.8 is the measured boundary of the frontier's validity and must be
        reported.
    - metric: nonscalar_pullback_fraction
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00 exactly, since the degree is (square) x p. Any deviation is an
        implementation bug: a correctness control, not a statistic.
    - metric: measured_time_times_storage_over_p
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00 up to p^{o(1)}, across at least three values of s. A drift with s means the
        frontier's exponent is wrong.
    - metric: single_instance_total_over_p_half
      direction: higher
      minimum_effect: >-
        FORCED to be at least 1.0 for every s. This is the negative headline and it must be MEASURED
        at toy scale, not merely derived.
  test_boundary:
    instances:
      - Three primes with log2 p in [20, 40], with the full supersingular vertex set enumerated
      - At least 200 uniformly random target curves E per prime
      - >-
        A matched random target set of the same cardinality as W_s, as the primary null
      - A matched random anchor set of the same cardinality as V_p, for the ball-growth control
    parameters:
      primes: three, with log2 p in [20, 40], declared before any run
      targets_per_prime: 200
      ball_radii: stratified BFS to radius R, with per-stratum reporting
      list_radii_X: three declared values, for the decay control
      storage_exponents_s: at least three values, for the time x storage arm
    implementation: >-
      Exact enumeration of the supersingular vertex set at toy primes, identification of V_p,
      stratified BFS from V_p, streamed smooth-degree isogeny lists from each target, and expansion of
      every pullback with a non-scalarity check on a random torsion basis.
    budget:
      wall_clock_seconds: 10800
      cpu_hours: 8.0
      maximum_memory_gb: 16
      maximum_runs: 24
  falsification_conditions:
    - >-
      The s = 0 slice fails to reproduce Delfs-Galbraith's p^{1/2}. The cost model is wrong and
      nothing else is recorded.
    - >-
      The measured hit rate deviates from the covering prediction by more than a factor 2, replicated
      at three primes and decaying in X. H3 IS FALSE AT THE TESTED SCOPE. A DEFICIT means the frontier
      is worse than derived and every published analysis that walks to the F_p locus inherits an
      uncharged correction, which is a result about Delfs-Galbraith and not about this construction.
      A SURPLUS means smooth-reachable sets are biased toward the subfield locus.
    - >-
      Ball growth departs from |V_p| 2^r well below the predicted saturation radius, and earlier than
      for a matched random anchor set. H4 is false at the tested scope, V_p is clustered, and the
      storage exponent is optimistic.
    - >-
      Any expanded pullback is scalar. The construction is broken and the degree argument is
      misstated.
    - >-
      A reader exhibits an instance-independent witness family of density above p^{-1/2+o(1)}
      constructible in time proportional to its size. The anchor is not optimal, the frontier shifts,
      and this hypothesis is superseded rather than patched.
  distinguishable_outcomes:
    A_mixing_dominates: >-
      The hit-rate ratio lies in [0.8, 1.25] at three primes and three radii, per stratum, with the
      shuffled-list control at exactly the covering bound. MEANING: H3 holds at the tested scope, the
      frontier is exactly as derived, and Delfs-Galbraith's own walk-to-the-subfield-locus step
      inherits the same validation. The negative headline (single-instance domination) stands.
    B_clustered_deficit: >-
      The ratio is materially below 1, replicated at two or more primes, decaying in X, with the
      shuffled control at 1.00. MEANING: the F_p locus is CLUSTERED relative to short smooth-reachable
      sets, the frontier is WORSE than derived, and every published analysis that walks to the
      subfield locus carries an uncharged correction. This is a result about a published algorithm,
      not about this construction.
    C_biased_surplus: >-
      The ratio is materially above 1 under the same replication and decay conditions. MEANING:
      smooth-reachable sets are biased TOWARD the subfield locus, a structural fact new to this
      corpus, bearing directly on the recogniser question of IDEA-20260821-167fd9.
    D_ball_clustering: >-
      Ball growth falls below 0.8 of prediction materially earlier than for a matched random anchor
      set. MEANING: H4 fails, V_p is clustered as an anchor set, and the storage exponent p^{1/2+s} is
      optimistic.
    E_instrument_broken: >-
      Any pullback is scalar, or the s = 0 fixture fails, or the shuffled-list control does not return
      the covering bound. MEANING: INVALID. No mathematical conclusion may be drawn in any direction
      and the failure is an instrument finding.
    F_toy_scale_exhausted: >-
      The ball saturates after two or three steps at every tested prime, leaving no dynamic range.
      MEANING: a SCOPE limit reported with the largest prime reached, never evidence that H3 holds or
      fails.
  interpretation_limits:
    - >-
      THIS IS NOT A SINGLE-INSTANCE ALGORITHM AND NOT AN EXPONENT IMPROVEMENT. Every point costs at
      least p^{1/2+o(1)} for one instance with precomputation charged, i.e. it is dominated by the
      incumbent p^{1/3+o(1)}. The per-instance figure p^{1/2-s} is amortised and may never be quoted
      without its storage exponent and its break-even target count. Nothing here suggests a p^{1/4}
      algorithm over F_{p^2} exists, is likely, or is nearly obtained.
    - >-
      Illustrative NIST-I figures are exponent arithmetic, NOT concrete security predictions. The
      incumbent's own concrete numbers sit above a disclosed superpolynomial o(1) and no conclusion may
      be computed there.
    - >-
      TOY SCALE IS TOY SCALE. A hit-rate ratio measured at 2^40 is evidence about 2^40. H3 has NO
      known route to cryptographic-scale validation, because the measurement needs the graph's global
      geometry rather than one curve's lattice, and that is the honest ceiling of this evidence.
    - >-
      SCOPE IS ONE CHARACTERISTIC. A batch shares a table only across instances with the same p.
    - >-
      Academic and defensive only, per RQ-SSI-001's first constraint. No operational key recovery
      against any live system is proposed or implied.
  prior_evidence_refs:
    - RQ-SSI-001
    - KN-TECH-057
    - KN-TECH-058
    - IDEA-20260821-e99afd
    - IDEA-20260821-167fd9
