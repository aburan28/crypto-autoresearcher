hypothesis:
  id: H-ECDLP-4ce467
  question_id: RQ-ICEX-001
  goal_id: null
  source_proposal: IDEA-20260830-3c0861
  status: proposed
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce
  design_note: >-
    DESIGN ONLY, AND THIS ONE IS AN AUDIT RATHER THAN AN EXPERIMENT. The
    source idea proposes a known-answer GATE on a cost model, whose entire
    cost is bibliographic transcription plus exact rational arithmetic. It is
    therefore specified as a VERIFICATION PROTOCOL - what artifact is
    checked, against what reference, and what result fails it - and not
    forced into the shape of a measurement it is not. The Coordinator's own
    contribution is the decoy-row control that gives the transcription
    procedure demonstrated dynamic range, and the explicit demonstration
    that the incumbent sign-valued gate is DEGENERATE at the decision arity.
    No status of any record is changed and nothing here is evidence.

  statement: >-
    THE ARTIFACT UNDER AUDIT is the two-term point-decomposition cost model
    used by three committed proposals in this lane, instantiated at the
    extension-field known-answer point: N = q^n, arity m = n, factor base the
    subfield line of size Theta(q), decomposition oracle of cost q^{o(1)},
    linear algebra c_LA*B^2. That instantiation predicts the exponent
    2n/(n+1), which at n = 2 is q^{4/3} = N^{2/3}.

    THE REFERENCE against which it is checked is a TRANSCRIBED PRIMARY-SOURCE
    exponent for index calculus on the Weil restriction of E/F_{q^n} at fixed
    n, quoted verbatim, hashed, and recorded WITH ITS VALIDITY RANGE IN n and
    WITH THE OBJECT IT DESCRIBES IDENTIFIED (genus-g class group, versus
    Weil-restriction extension degree n, versus a double-large-prime
    variant). An exponent recorded without its unit, its validity range, and
    its object label is NOT an admissible reference and the audit says so
    rather than scoring it.

    THE INTERNAL IDENTITY, checkable with zero external input and blocking:
    2n/(n+1) - (2 - 2/n) = 2/(n(n+1)), which at n = 2 equals exactly 1/3 in
    units of q and exactly 1/6 in units of N.

    THE THREE DECLARED OUTCOMES, EACH COMPLETE AND EACH REPORTABLE.
    OUTCOME A - a transcribed source valid at n = 2 gives Otilde(q) =
    Otilde(N^{1/2}). Then the two-term full-relation-only charge OVERCHARGES
    the known case by exactly q^{1/3} = N^{1/6} AT ARITY 2, and no m = 2
    prime-field no-go derived from that model may be quoted as a no-go until
    the model is repaired, because the model is measurably wrong at that
    arity by the same amount as the gap it asserts.
    OUTCOME B - a transcribed source restricts its exponent to n >= 3 and
    reports nothing at n = 2 better than q^{4/3}. Then the model receives its
    first known-answer corroboration at arity 2 and the lane's m = 2 negative
    acquires external support rather than resting on internal arithmetic.
    OUTCOME C - no admissible source covers n = 2. GATE UNRUN AT THE DECISION
    ARITY. This is a complete and honest outcome, it is decision-relevant
    because it establishes that this lane has never had a known-answer check
    at the arity its decision target lives at, and it is an INFRASTRUCTURE
    outcome about retrieval, never a negative result about the mathematics.

    WHAT IS CLAIMED. Not that the model is wrong, and not that it is right.
    Claimed: that the gate is decidable at bibliographic cost, that it has
    never been evaluated at n = 2, that all three of its outcomes change what
    this question may conclude, and - as a matter of arithmetic checkable
    here - that the incumbent SIGN-valued form of this gate cannot fire at
    n = 2 under either candidate reading and is therefore degenerate at the
    arity it is supposed to decide.

    WHAT IS NOT CLAIMED. Nothing about prime fields. The gate tests a shared
    FORMULA at a point where the answer is known; it does not test whether
    the formula applies where the answer is unknown. No status change to any
    record is proposed or implied.

  mechanism: >-
    THE TRACKED OBJECT is the SIGNED EXPONENT DISCREPANCY between the model
    prediction and a transcribed external exponent, as a function of the one
    externally controllable knob the comparison has - the extension degree n.
    It is a genuinely lossy projection of the pair (model, algorithm): it
    discards the algorithms, the field representation, the solver and every
    constant, keeping one rational number per n. It is lossy COMPATIBLY
    because the retained quantity propagates deterministically under the only
    operation applied to it, varying n, with a predicted trajectory
    2/(n(n+1)) that falls from 0.3333 at n = 2 to 0.0476 at n = 6. That
    predicted trajectory is what makes it a measurement rather than a single
    anecdote: an instrument that does not track its own predicted response to
    the knob it claims to model is not measuring.

    WHY THE INCUMBENT GATE IS DEGENERATE, AND THIS IS THE LOAD-BEARING
    OBSERVATION. The incumbent form of this gate, recorded in a sibling
    proposal, is SIGN-VALUED: it asks only whether the accounting returns
    worse-than-rho at every n. At n = 2 the two candidate readings are
    N^{2/3} (model) and N^{1/2} (the recalled literature value), and rho is
    N^{1/2}. Neither reading beats rho at n = 2 - one ties and one loses - so
    BOTH PASS the sign gate identically. Its acceptance band at the decision
    arity is width zero by construction and it cannot fire, which is exactly
    why three consecutive records could defer it without cost. Replacing the
    sign with the rational-valued signed discrepancy, whose predicted
    trajectory is itself falsifiable, is the whole content of this record.

    WHY n = 2 IS THE SPECIAL CELL. At n = 2 the Weil restriction is an
    abelian surface and the decomposition is into two subfield-line points -
    structurally the same two-summand problem as prime-field m = 2, with the
    single difference that the extension case has an algebraic solve of
    polylog cost while the prime-field case has only the Theta(B) sweep. That
    difference is the entire content of the prime-field question, and the
    n = 2 cell isolates it. So the one arity at which this lane can check its
    model against an answer it did not choose is precisely the arity its
    decision target lives at.

  assumptions:
    - >-
      The model's extension-field instantiation is N = q^n, m = n, factor
      base the subfield line of size Theta(q), decomposition oracle of cost
      q^{o(1)}, linear algebra c_LA*B^2. This is the lane's own
      instantiation, adopted unchanged so the gate tests the model actually
      in use.
    - >-
      Exponents on both sides are compared in the SAME UNIT, stated
      explicitly on every row, with the deliverable table carrying BOTH the
      exponent-of-q and the exponent-of-N columns. A row with one column is
      inadmissible.
    - >-
      The comparison is at FIXED n with q growing. A source whose exponent is
      stated for n growing with q, or with an o(1) uniform in only one
      variable, is NOT a valid reference and is reported as inadmissible
      rather than forced into the table.
    - >-
      No claim is made that the extension-field setting models the
      prime-field setting. This is a known-answer test of a shared formula.

  proof_search_map:
    bottleneck: >-
      The transcription itself. The exact step whose absence changes every
      downstream verdict is: read, from a primary source, the exponent
      claimed for index calculus on the Weil restriction of E/F_{q^n} at
      fixed n, with its stated validity range in n, and quote it with a hash.
    baseline_embedding:
      parameter_slice: >-
        n = 2, m = 2, B = Theta(q), D = q^{o(1)}. Simultaneously the
        extension-field known-answer slice and the arity of this question's
        decision target, which is why the gate is placed here rather than at
        n = 3.
      reproduction_check: >-
        Two checks requiring no external source, both blocking and both run
        before any bibliographic effort. (i) KN-FIND-007's conservation
        identity at B = q, N = q^n, m = n must return exactly 1/n! for
        n = 2..8. (ii) The discrepancy identity 2n/(n+1) - (2 - 2/n) =
        2/(n(n+1)) verified symbolically and numerically to 1e-12 at
        n = 2..8, with the n = 2 value exactly 1/3 in q and 1/6 in N. A
        failure of either is an internal algebra error and halts the gate.
    observation_collision:
      observable: >-
        The single number "the extension-field exponent", quoted without its
        unit and without its validity range in n.
      distinct_preimage_search: >-
        COLLISION EXHIBITED, AND IT IS WHY THIS GATE KEEPS FAILING TO BE RUN.
        The string 2 - 2/n has at least three distinct preimages in the
        adjacent literature that a search summary does not separate: the
        fixed-genus class-group complexity Otilde(q^{2-2/g}); the
        abelian-variety / Weil-restriction exponent for the decomposition
        attack at extension degree n; and a double-large-prime variant's
        exponent. They agree symbolically and differ in what the index means,
        in the validity range, and in whether large primes are used. A
        transcription that does not record WHICH object and WHICH range is
        not a reference, and the decoy-row control of the paired protocol
        enforces that mechanically rather than by intention.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the reported exponent expression fixed and vary the forgotten
          structure - the object it describes, the validity range in n, and
          whether partial relations are used - to see which preimage the
          primary source actually asserts.
        predicted_gain: >-
          Converts an unusable recollection into an admissible reference, or
          establishes that no admissible reference exists at n = 2, which is
          itself a complete and reportable answer.
      - transform: boundary_lift
        proposed_object: >-
          Replace the sign-valued gate by the rational-valued signed
          discrepancy as a function of n, whose predicted trajectory
          2/(n(n+1)) is itself falsifiable.
        predicted_gain: >-
          A gate that a model wrong by N^{1/6} at n = 2 can actually fail,
          which the incumbent sign gate demonstrably cannot.
    quantifier_order: >-
      CLAIMED. FOR the specific instantiation (N = q^n, m = n, subfield-line
      base, polylog oracle), FOR EACH n in the transcribed validity range,
      THERE EXISTS a signed rational discrepancy between the model exponent
      and the transcribed exponent, and the model PREDICTS that discrepancy
      to equal 2/(n(n+1)) exactly. The quantifier that matters, and that a
      search summary destroys, is the RANGE OF n over which the transcribed
      exponent is asserted: a result stated for all n >= 3 says nothing at
      n = 2, and reading it as if it did is the single most likely way this
      gate is mis-evaluated. NOT CLAIMED: anything about prime fields.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The two-term charge, instantiated at the extension-field
        known-answer point, differs from the transcribed primary-source
        exponent by the signed amount X(n) at each n in the transcribed
        range." It can NEVER certify that the model is correct for prime
        fields, that any prime-field exponent is achievable, or that the two
        settings are equivalent.
      nearby_object_control: >-
        THE BINARY-FIELD SLICE. Over F_{2^n} the same decomposition attack
        has different and better-studied solving-degree behaviour. If a
        transcribable binary-field exponent is fed through the same model and
        the discrepancy does NOT follow the same 2/(n(n+1)) trajectory, then
        the discrepancy is not a property of the two-term charge at all but
        of the field, and the gate's diagnostic value collapses. That is a
        real way for this record to fail and it is stated here.
    proof_obligations:
      - claim: "The conservation cross-check returns exactly 1/n! at n = 2..8."
        responsibility: baseline
      - claim: "The discrepancy identity equals 2/(n(n+1)), with 1/3 in q at n = 2."
        responsibility: correctness
      - claim: >-
          The incumbent sign-valued gate returns PASS on both candidate n = 2
          readings, hence has a width-zero acceptance band at the decision
          arity and cannot fire.
        responsibility: strictness
      - claim: >-
          A primary source is obtained, quoted, hashed, and its validity
          range in n recorded, OR the gate is reported UNRUN.
        responsibility: interface
      - claim: >-
          The transcribed object is identified as class-group genus,
          Weil-restriction degree, or large-prime variant, and not conflated.
        responsibility: scope
      - claim: "The n = 2 cell is evaluated explicitly, or its absence from the source's validity range is recorded explicitly."
        responsibility: strictness

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ALGORITHM IS PROPOSED AND NO ATTACK EXPONENT IS
    CLAIMED IN EITHER DIRECTION. The object produced is a signed rational
    discrepancy per n between a model exponent 2n/(n+1) and a transcribed
    exponent, with the n = 2 cell as the deliverable. In units of N the two
    candidate values at n = 2 are N^{2/3} (model) and N^{1/2} (recalled),
    against rho's N^{1/2}. Memory is not applicable to the gate; the table
    nevertheless carries the model's memory column per row so that a row
    emitted here is never quoted as a memory statement.

  heuristic_assumptions:
    - id: HEUR-GATE-1
      formal_statement: >-
        The two-term charge's extension-field instantiation with a polylog
        oracle is the correct reading of the algorithm the transcribed source
        analyses - that is, the source's algorithm uses a subfield-line
        factor base of size Theta(q), an arity equal to the extension degree,
        and a decomposition solve of cost q^{o(1)} at fixed n.
      random_model_justification: >-
        Not a distributional assumption at all, which is why it is
        discharged by reading rather than by sampling. The internal
        cross-check is exact and needs no source: the conservation identity
        at B = q, N = q^n, m = n returns exactly the 1/n! decomposition
        probability the extension-field literature uses, confirming the YIELD
        limb of the instantiation. What is assumed is only that the source's
        algorithm matches this instantiation in factor-base size and arity,
        which is a transcription obligation and not a permanent assumption.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-037fe3]
      falsification_condition: >-
        The source's factor base is a REDUCED subfield line of size
        q^{1-1/n} rather than Theta(q), or its arity differs from n. Then the
        instantiation is different, the model's relation term dominates at
        that base, and THAT must be recorded as the resolution rather than
        treated as a model failure.
    - id: HEUR-GATE-2
      formal_statement: >-
        The signed discrepancy is a stable function of n over the transcribed
        range - that is, the two exponent expressions being compared refer to
        the same algorithmic object at every n in that range, so the
        trajectory 2/(n(n+1)) is a meaningful prediction rather than a
        comparison of different algorithms at different n.
      random_model_justification: >-
        Rigorous for the arithmetic - the identity is exact. Heuristic only
        in the object-stability clause, which the observation collision above
        shows is exactly where this comparison has failed repeatedly. The
        classical practice imitated is the ordinary convention that a
        complexity stated at fixed n for a named algorithm describes one
        algorithm family across n.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-037fe3]
      falsification_condition: >-
        The object label recorded per row is not identical across the
        transcribed range. A range spanning two object labels is split into
        two tables and NEVER fitted jointly.

  structural_ingredients:
    - description: >-
        The conservation identity applied at B = q, N = q^n, m = n returns
        exactly the 1/n! decomposition probability used in the
        extension-field setting, so the yield limb of the model's
        instantiation matches the literature convention. This is the one limb
        that survives a total failure of retrieval.
      citation: KN-FIND-007
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-3c0861, which records reading
        knowledge/findings/KN-FIND-007.md in full on 2026-08-29. RELAYED, NOT
        RE-READ by coordinator TASK-20260904-ae82ce; the paired protocol
        re-derives the 1/n! values arithmetically rather than relying on the
        relay.
    - description: >-
        The incumbent form of this gate in the sibling proposal is a SIGN
        check - its nearby-object control requires only that the accounting
        must not return worse than rho at every n - placed as a zero-compute
        Stage 0 hard gate; and that proposal's own m = 2 headline is a
        shortfall of N^{1/6} against rho under the free oracle, numerically
        identical to the n = 2 discrepancy this sharpened gate would measure.
      citation: IDEA-20260829-b5a2c8
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-3c0861, which records reading
        ledger/proposals/IDEA-20260829-b5a2c8.yaml in full (671 lines) on
        2026-08-29, including its method_ceiling.nearby_object_control and
        sota_delta blocks. RELAYED, NOT RE-READ by coordinator
        TASK-20260904-ae82ce. Because the degeneracy demonstration is the
        load-bearing control of the paired protocol, that protocol makes
        re-reading and quoting the incumbent gate's exact wording a BLOCKING
        Stage 0 obligation rather than accepting this relay.
      role: >-
        supplies the incumbent gate whose acceptance band this record shows
        is width zero at the decision arity
    - description: >-
        The lane's original record declares the primary-source transcription
        a BLOCKING subtask of its minimal test, with the instruction that if
        no primary source can be obtained the gate is reported UNRUN and no
        prime-field corollary may be cited; a second record inherits the gate
        unweakened and does not evaluate it.
      citation: IDEA-20260803-fa9839 and IDEA-20260808-2ef5c8
      provenance: internal
      verified_by: >-
        idea-generator of IDEA-20260830-3c0861, which records reading both
        files in full (493 and 233 lines) on 2026-08-29. RELAYED, NOT RE-READ
        by coordinator TASK-20260904-ae82ce.
      role: establishes that the gate is inherited and has never been run
    - description: >-
        Recalled complexity-bounds and index-calculus references surfaced by
        web search in the source session, including a published paper whose
        summary asserts that the naive Semaev index calculus cannot be more
        efficient than the rho method over an arbitrary finite field. THE
        PAPERS WERE NOT OPENED - the publisher page returned HTTP 405 and
        ScienceDirect returned HTTP 403 to the source session, and no agent
        in this program has read either.
      citation: >-
        DOI 10.1515/jmc-2019-0029; Gaudry, index calculus for abelian
        varieties of small dimension, J. Symbolic Computation
      provenance: recalled
      verified_by: null
      role: >-
        pointers naming where a referee should look; they support nothing and
        may not discharge any obligation of this record

  reduction_chain:
    core_problem: >-
      Whether the lane's shared two-term cost model may be quoted at arity 2,
      decided against a transcribed external exponent at the extension-field
      known-answer point.
    corollaries: []
  reduction_chain_note: >-
    Deliberately empty. The gate reaches no downstream problem by reduction;
    its consequences for sibling records are proposals to the Coordinator,
    written one line each, and never status changes.

  predictions:
    - metric: >-
        signed discrepancy = (model exponent in q) - (transcribed exponent in
        q), at each n in the transcribed validity range; dimensionless
        rational
      direction: different
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION: equal to 2/(n(n+1)) to within 1e-12
        at every transcribed n, i.e. 0.3333 at n = 2, 0.1667 at n = 3, 0.1000
        at n = 4, 0.0667 at n = 5, 0.0476 at n = 6. A discrepancy that does
        not track that curve means the model is not responding to the one
        knob it claims to model, and its prime-field readings are unusable.
    - metric: "the n = 2 cell specifically, in units of N; dimensionless rational"
      direction: different
      minimum_effect: >-
        THREE-WAY PRE-REGISTERED OUTCOME. N^{1/2} at n = 2 gives OUTCOME A
        (model overcharges by N^{1/6} at arity 2). N^{2/3} or worse gives
        OUTCOME B (corroborated at arity 2). No admissible source covering
        n = 2 gives OUTCOME C, GATE UNRUN AT THE DECISION ARITY, which is a
        complete answer and is itself decision-relevant.
    - metric: >-
        conservation cross-check, decomposition probability at B = q,
        N = q^n, m = n; dimensionless probability
      direction: different
      minimum_effect: >-
        FORCED EXACT: 1/n! for n = 2..8, requiring no external source. This
        is the only limb that survives a total failure of retrieval, and a
        failure here routes to a correction record rather than being absorbed.
    - metric: >-
        verdict of the INCUMBENT sign-valued gate on each of the two
        candidate n = 2 readings; binary PASS/FAIL
      direction: same
      minimum_effect: >-
        FORCED PASS ON BOTH. This is a zero-compute arithmetic fact, not a
        measurement, and it is the record's demonstration that the incumbent
        gate's acceptance band at the decision arity is WIDTH ZERO. If the
        incumbent gate returns FAIL on either reading, the degeneracy claim
        is wrong and this record is re-scoped downward - which would be a
        better and cheaper outcome.
    - metric: >-
        object-identification of each transcribed exponent; categorical label
        in {class-group genus g, Weil-restriction degree n, large-prime
        variant, unlabelled}
      direction: different
      minimum_effect: >-
        Every row labelled from the source's own wording, quoted. An
        unlabelled exponent is inadmissible, and recording that no admissible
        reference was obtained is a complete answer.

  test_boundary:
    instances:
      - "Zero compute for the mathematics: two exact rational-arithmetic identity checks at n = 2..8."
      - "Retrieval attempts in the declared order, with every failure recorded by URL and HTTP status code."
      - "Three planted decoy rows with known correct verdicts, scored BEFORE any real transcription is scored."
      - "One deliberately degenerate incumbent-gate evaluation, computed rather than argued."
    parameters:
      n_range: "2..8 for the identity checks; the transcribed validity range for the gate table"
      units: "every row carries BOTH exponent-of-q and exponent-of-N"
      tolerance: "1e-12 on the identity checks; exact rational comparison elsewhere"
    implementation: >-
      Exact rational arithmetic (Python fractions or equivalent) for the
      identity checks and the gate table; retrieval by whatever fetch tooling
      is available to the executing session. NO CURVE, NO GROUP, AND NO
      POLYNOMIAL SYSTEM IS CONSTRUCTED ANYWHERE IN THIS PROTOCOL.
    budget: >-
      See EXP-ECDLP-037fe3. The mathematics is seconds; the whole cost is
      retrieval and careful transcription.

  falsification_conditions:
    - >-
      The internal discrepancy identity or the 1/n! cross-check fails.
      Internal algebra error; the gate is not run and the failure routes to a
      correction record.
    - >-
      A transcribed source ADMISSIBLE at n = 2 gives N^{1/2}. OUTCOME A: the
      two-term full-relation-only model is falsified at the decision arity by
      exactly N^{1/6}, and the lane's m = 2 floor may not be cited as a
      no-go. This record predicts nothing about which way this falls and
      gains nothing from either.
    - >-
      A transcribed source admissible at n = 2 gives N^{2/3} or worse.
      OUTCOME B: the model is corroborated at the decision arity, and any
      competing internal derivation claiming exactly the excluded amount is
      placed under immediate suspicion.
    - >-
      No admissible source covers n = 2. OUTCOME C, GATE UNRUN AT THE
      DECISION ARITY. Complete, honest, reportable, and an INFRASTRUCTURE
      outcome under AGENTS.md rule 5 rather than a negative mathematical
      result.
    - >-
      The discrepancy across n >= 3 does not track 2/(n(n+1)). The model does
      not respond to its own knob and nothing may be read from its n = 2 cell
      either.
    - >-
      The incumbent sign-valued gate returns FAIL on either n = 2 reading.
      The degeneracy claim is wrong; the record is re-scoped downward.
    - >-
      Any decoy row is mis-scored. The transcription procedure has no
      discriminating power and NO real transcription may be scored by it.

  interpretation_limits:
    - >-
      THIS DECIDES NOTHING ABOUT PRIME-FIELD ECDLP DIRECTLY. It decides
      whether this lane's shared cost model may be quoted at arity 2. That is
      a statement about the instrument, not about the problem.
    - >-
      A PASSED GATE IS NOT A VALIDATED MODEL. Reproducing one external
      exponent validates the SHAPE of the charge at one instantiation. The
      prime-field factor base has no subfield description at all, which the
      lane's own original record already names as the largest interpretive
      gap in the whole two-term programme.
    - >-
      AN UNRUN GATE IS A REPORTABLE RESULT AND MUST NOT BE PRESENTED AS A
      NEGATIVE RESULT ABOUT THE MATHEMATICS. Retrieval failures are
      infrastructure outcomes.
    - >-
      NOTHING IN THIS PROTOCOL IS A STATEMENT ABOUT ELLIPTIC CURVES. It
      constructs no curve, no group and no polynomial system; every outcome
      is a statement about a cost model's arithmetic and about what the
      literature contains. The paired contract makes this a binding
      pre-declared consequence rather than a caveat.
    - >-
      Every external number reaching this record is RECALLED from a search
      summary that no agent in this program has verified against a source.
      That is why novelty is unverified and why the gate is a proposal to
      OBTAIN sources rather than a result derived from them.
    - >-
      NO STATUS CHANGE to any record is proposed or implied. Consequences for
      sibling records are written as one-line proposals to the Coordinator.

