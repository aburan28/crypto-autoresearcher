hypothesis:
  id: H-BINSTD-39a59f
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-adb7bb
  experiment_id: EXP-BINSTD-ffc4f4
  goal_id: GOAL-ECDLP2M-001
  predecessor_hypothesis_id: H-BINSTD-5c4afb
  predecessor_experiment_id: EXP-BINSTD-6c199f
  predecessor_evidence_id: EV-BINSTD-78ca0d
  predecessor_decision_id: DEC-20261003-9575fd
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-d4ae67
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-d4ae67
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-d4ae67
  proposed_by: coordinator
  title: >-
    After EV-BINSTD-78ca0d O-FAIL-BAND, an independent (17,3) matched-pair
    median N_var(GP)/N_var(rand) panel under a disjoint catalog still meets
    ≤1−δ, or the weaken reading replicates

  statement: >-
    CLAIM (heuristic_validation / construction-family instrument; NO ATTACK;
    NO EXPONENT). Successor to H-BINSTD-5c4afb after EV-BINSTD-78ca0d
    (O-FAIL-BAND at n=17 ℓ=3, median_ratio=1.0 vs band≤0.90, catalog_seed
    2026100327). Using a NEW disjoint catalog (seed 2026100331; GP seeds
    {35,37,39,41,43,45,49,51,53,57,59,65}; not the EXP-BINSTD-6c199f roster),
    FORALL Stage-1 cells (n,ℓ)∈{(17,3)}, across ≥8 matched GP/random pairs
    with |Δ dim(V·V)|≤1, median N_var(GP)/N_var(rand) ≤ 1−δ with δ=0.10
    frozen at Stage 0 — OR the band fails again (O-FAIL-BAND; weaken
    replicates). Stage-2 n∈{19,23} GP/random δ-band + random-vs-random null
    with ε=0.15 is specified in EXP-BINSTD-ffc4f4 but NOT authorized on
    trial-plan-v1. NO break. NO n≥131 transfer. Do NOT re-run frozen
    EXP-BINSTD-6c199f.

  mechanism: >-
    OBJECT FRAME as IDEA-20261002-adb7bb / H-BINSTD-5c4afb. Operation set
    CHANGE: disjoint catalog_seed and GP-seed roster so the replication is
    not a re-score of EV-BINSTD-78ca0d pairs. Twin dimVV + twin N_var meters
    unchanged (admitted 6c199f / 5b2fd0 pin). WHAT IS NEW: independent
    (17,3) panel after weaken; Stage-2 null specified in the same contract
    for a later trial-plan-v2 without minting a third EXP.

  predictions:
    - metric: median_Nvar_ratio_GP_over_random
      direction: upper_bounded
      minimum_effect: '≤ 1−δ = 0.90 at Stage-1 cell (17,3) under the new catalog'
    - metric: matched_pair_count
      direction: lower_bounded
      minimum_effect: '≥ 8 matched pairs on (17,3)'
    - metric: twin_agreement
      direction: same
      minimum_effect: 'dimVV and N_var path A = path B on every measured V'
    - metric: catalog_disjointness
      direction: same
      minimum_effect: 'catalog_seed ≠ 2026100327; GP seeds disjoint from parent roster'

  test_boundary:
    instances:
      - 'Stage 0: freeze δ=0.10, ε=0.15, disjoint GP seeds, catalog_seed 2026100331, encoder pin; twin check'
      - 'Stage 1 authorized: (n,ℓ)∈{(17,3)} matched-pair median-ratio replication panel'
      - 'Stage 2 specified not on trial-plan-v1: n∈{19,23} GP/random + random-vs-random null ε=0.15'
    parameters:
      delta: 0.10
      epsilon_null: 0.15
      catalog_seed: 2026100331
      parent_catalog_seed_forbidden: 2026100327
      moduli:
        17: t^17+t^3+1
        19: t^19+t^5+t^2+t+1
        23: t^23+t^5+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-ffc4f4/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Twin meters copied from EXP-BINSTD-6c199f (gf2n/product_space/encode_s3).
      No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin meters disagree on any measured V (O-ARTIFACT; table void).
    - Re-using EXP-BINSTD-6c199f catalog_seed 2026100327 or parent GP roster.
    - Editing δ after Stage-0 freeze (protocol invalid).
    - Claiming practical binary IC or an exponent move from a toy GP/random
      N_var band (KR-IC-1fcdbc).
    - Matching only on dim(V) without the |Δ dim(V·V)| ≤ 1 control on GP/random.
    - Transferring the band to n≥131 without a new contract.
    - Re-running frozen EXP-BINSTD-6c199f under this card.
    - Fewer than 8 matchable pairs after the budgeted catalog (O-INCONCLUSIVE).

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twin OK; ≥8 matched pairs; median ratio ≤ 0.90 on (17,3) under the
        disjoint catalog. Parent O-FAIL-BAND did not replicate. No attack claim.
    - id: O-FAIL-BAND
      meaning: >-
        Twin OK; enough pairs; median ratio > 0.90 on (17,3). Weaken reading
        of EV-BINSTD-78ca0d independently replicates at this toy cell.
    - id: O-INCONCLUSIVE
      meaning: >-
        Fewer than 8 matchable pairs on (17,3) after the budgeted random attempts.
    - id: O-ARTIFACT
      meaning: Twin disagreement, parent-seed reuse, or freeze/regression failure.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-BINSTD-39a59f or H-BINSTD-5c4afb.

  interpretation_limits:
    - Construction-family instrument only; does not predict yield or beat rho.
    - Does not rewrite EV-BINSTD-78ca0d; this is an independent panel.
    - Stage-2 (n∈{19,23} + random-vs-random null) specified but not authorized
      on trial-plan-v1.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.
    - Shared encoder pin; a different pin needs a new idea/contract.

  heuristic_assumptions:
    - id: HEUR-BINSTD-adb7bb-H1
      formal_statement: >-
        FORALL Stage-1 cells (17,3) under catalog_seed 2026100331: across ≥8
        matched GP/random pairs with |dim(V·V)_GP − dim(V·V)_rand| ≤ 1, median
        N_var(GP)/N_var(rand) ≤ 1−δ with δ=0.10 frozen at Stage 0.
      random_model_justification: >-
        Same as IDEA-20261002-adb7bb / H-BINSTD-5c4afb. Independent catalog
        tests whether EV-BINSTD-78ca0d O-FAIL-BAND was catalog-specific.
        Rigorous: KR-IC-73db3f. Classical: if leftover GP structure after
        dimVV matching drives encode size, the δ-band should hold on a
        disjoint roster; if it fails again, the weaken reading replicates.
      supporting_results:
        - EV-BINSTD-78ca0d
        - IDEA-20261002-adb7bb
        - KR-IC-73db3f
        - KR-IC-5765d2
        - KR-IC-1fcdbc
      validation_experiment_ids:
        - EXP-BINSTD-ffc4f4
      falsification_condition: >-
        Median ratio > 1−δ at completed Stage-1 (17,3) (O-FAIL-BAND), OR twin
        failure (O-ARTIFACT), OR fewer than 8 matchable pairs
        (O-INCONCLUSIVE), OR parent seed reuse (O-ARTIFACT).
    - id: HEUR-BINSTD-adb7bb-H2
      formal_statement: >-
        FORALL specified Stage-2 cells (n,ℓ)∈{(19,3),(23,3)}: random-vs-random
        encode N_var pairs matched only on dim(V)=ℓ have median |ratio−1| ≤ ε
        with ε=0.15 frozen at Stage 0. NOT TESTED on trial-plan-v1.
      random_model_justification: >-
        IDEA-20261002-adb7bb null: independently drawn random subspaces of
        equal dimension should not reproduce a GP vs random δ-advantage;
        encoder artifacts would appear as |ratio−1| exceeding ε.
      supporting_results:
        - IDEA-20261002-adb7bb
        - EV-BINSTD-78ca0d
      validation_experiment_ids:
        - EXP-BINSTD-ffc4f4
      falsification_condition: >-
        Not evaluated on trial-plan-v1. When Stage-2 is later admitted:
        median |ratio−1| > ε on a completed null cell, or twin failure.

  asymptotic_claim:
    problem: >-
      Independent replication of geometric-progression vs random encode N_var
      at matched dim(V·V) on toy binary IC cell (17,3)
    prior_best: >-
      EV-BINSTD-78ca0d (O-FAIL-BAND, median=1.0, catalog_seed 2026100327);
      KR-IC-73db3f; KR-IC-1fcdbc
    time_exponent: >-
      NO EXPONENT MOVED. Construction-family instrument only.
    memory_exponent: Negligible — store per-pair dim(V·V) and N_var.
    hidden_cofactor: Encoder constants independent of V family.
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether the EV-BINSTD-78ca0d O-FAIL-BAND at (17,3) replicates under a
      disjoint catalog, or was catalog-specific.
    baseline_embedding:
      parameter_slice: >-
        n=17, ℓ=3, first frozen GP in the NEW roster; twin dimVV and N_var
        must agree before any median-ratio panel is read; catalog_seed must
        not be 2026100327.
      reproduction_check: >-
        Independent check.py recomputes twin dimVV/N_var, re-checks the
        |Δ dimVV|≤1 match rule, δ polarity, and refuses parent seed/GP roster.
    observation_collision:
      observable: 'median N_var(GP)/N_var(rand) vs 1−δ on (17,3) under new catalog'
      distinct_preimage_search: >-
        A held or failed band could arise from leftover GP structure, unmatched
        catalog (ruled out by ≥8 else O-INCONCLUSIVE), twin-encode artifact,
        or parent-catalog reuse (refused). Stage-2 random-vs-random null is
        specified to separate encoder artifacts; not run on trial-plan-v1.
    constructive_transforms:
      - transform: measurement_instrument
        proposed_object: >-
          Disjoint δ=0.10 catalog + twin meters + matched-pair GP/random
          panel; Stage-2 null specified in-contract.
        predicted_gain: >-
          A decidable replicate-or-not label for EV-BINSTD-78ca0d without
          re-running EXP-BINSTD-6c199f.
    quantifier_order: >-
      FORALL Stage-1 cells (17,3): median ratio ≤ 0.90 is PREDICTED.
      NOT CLAIMED on trial-plan-v1: n∈{19,23}; n≥131; any attack.
    method_ceiling:
      strongest_certifiable_claim: >-
        On (17,3) under the disjoint catalog, measured median ratio lies ≤ or
        > the frozen 1−δ band, with twin agreement and ≥8 matched pairs.
      nearby_object_control: >-
        Twin disagreement (artifact); insufficient matches (inconclusive);
        parent seed reuse (artifact). Stage-2 null not on v1 plan.
    proof_obligations:
      - claim: Twin dimVV and N_var paths agree on every measured V.
        responsibility: baseline
      - claim: Catalog seed and GP roster are disjoint from EXP-BINSTD-6c199f.
        responsibility: baseline
      - claim: Pairs satisfy |Δ dim(V·V)| ≤ 1.
        responsibility: baseline
      - claim: Median ratio vs 1−δ decides O-SUPPORT vs O-FAIL-BAND.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131; parent EXP is not re-run.
        responsibility: scope

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
