        rungs at m = 3 carry no discovery weight for kappa_TT; the ALIVE test
        reads the two largest rungs (30 and 32 bits), which the scratch did not
        observe, on the census curves, which the scratch did not use.
      - >-
        Not observed by the scratch, and therefore discovery-grade: kappa_TT at
        m = 4, 5; every kappa_TB and kappa_SS; every dickson arm; every rung
        other than 20/24/28 at m = 3; every informative-rank and harvest-gain
        figure.

  # ---------------------------------------------------------------------------
  statement: >-
    On prime-order ordinary curves E/F_p with log2 p in 12..32 (census curves
    drawn by subgroup_prime_filter([3,4,5], 0.15), five per rung), with the
    crypto_autoresearcher.index_calculus mitm engine at m = 3, 4, 5, default
    table arity, default |F| matched to the subgroup base and min_fill
    elimination: (A, generic) harvesting the three coincidence classes the
    engine already computes and discards -- TT (two stored tails with one
    x-key), TB (a stored tail whose x-key is a base element's) and SS (two
    search encodings, same or different targets, with one x-key) -- as
    certified relation rows lowers the S_3 count to solution by a factor of at
    least 1.3 on every base at every rung >= 24 bits at m = 3 and 5 with the
    fitted exponent unchanged within +-0.03, and lowers the m = 4 exponent to
    at most 0.66; and (B, structural, the NULL) for the coset (subgroup),
    Dickson and small_x bases, the formal-subtracted coincidence excess
    kappa_c = count_c(F) / count_c(F_random) over a random base matched in
    |F|, curve, targets and target seeds lies inside the random 3-SD band at
    every rung for c in {TT, SS}, with informative rank at least 0.95 of the
    harvested rows (to saturation), while the known-log small-multiples base
    shows large kappa_TT with informative rank at most 0.05 and the j = 0,
    3 | d coset base shows kappa_TB >= 5 before formal subtraction and inside
    the random band after it.

  mechanism: >-
    Restated from IDEA-20260928-4e2be7 (claim and mechanism). Representation R1
    (x-key with a stored y-bit); operation set Sigma = translation by +-F_a;
    partial-action class (Class I). The mitm table is the x-keyed h-fold
    signed sumset of the base; the search computes x(R_t - H - s F_j) for every
    charged S_3 solve. A coincidence of two such computed x-keys is a valid
    group identity: TT and TB give homogeneous base-only rows (kcoef = rhs = 0),
    SS gives R_t -+ R_u = (sum of base points), a two-target row. The engine
    today keeps only table-vs-search matches that respect its ordering rule
    (TS) and discards TT, TB and SS. GENERIC PART: under the collision model
    (H-PFDR-0cc7e8) the harvested classes add about 0.375|F| TT and about
    3|F| SS rows at m = 3 (model counts from README medians, not measured),
    which moves the constant at odd m and removes the table/search imbalance at
    even m, taking m = 4 from N^0.75 toward N^0.625. STRUCTURAL PART: the only
    way an x-structured base can beat the generic floor is a non-generic excess
    of coincidences, kappa_c > 1, that carries informative (non-formal) rank.
    If kappa ~ N^delta the floor becomes (1/2)*sqrt(r*N/kappa) and the total
    exponent (1+beta-delta)/2. Energy is the second moment of the sum
    distribution, which KN-FIND-007's conservation of the first moment does not
    fix, so the test is not vacuous. The generator expects the null: for
    multiplicatively structured x-sets complete character sums of x(P), x(Q),
    x(P+Q) over E x E cancel because Hom(E, G_m) = 0 (recalled), but the
    index-calculus regime |F| ~ N^{1/m} << sqrt(p) is incomplete-sum territory
    where no retrieved theorem applies (Shparlinski 2008 abstract: nontrivial
    only for #U > q^{1/2+eps}), so the null is heuristic and is measured.
    Formal coincidences (automorphism orbits on j = 0 curves; known logs; exact
    cancellations F - F inside a tail) are identified by a formal relation
    basis per arm and subtracted before kappa is read.

  assumptions:
    - 'Verbatim from IDEA-20260928-4e2be7: The engine''s per-class relations are valid group identities. Every harvested row is re-verified by scalar multiplication through decompose.verify, following the existing certificate discipline.'
    - 'Verbatim: The Dickson base is a new builder in factor_base.py - F = {P : x(P) = u + c/u, u in g*mu_d} (c not in g^2*mu_d), sharing the subgroup prime filter. It is a base builder, not a solver.'
    - 'Verbatim: The j=0 control curve y^2 = x^3 + b with p = 1 (mod 3), prime order, and 3 | d supplies formal automorphism coincidences. This uses automorphism folding (off-limits as a lens) ONLY as a positive control for discounting formal excess.'
    - 'Verbatim: Toy scale, 12..32 bits.'
    - >-
      Specification note on the first assumption: decompose.verify checks a
      decomposition of one target; harvested rows are not decompositions, so
      EXP-PFDR-1b78f7 re-verifies each harvested row as the group identity
      sum_i c_i F_i + kcoef*Q = rhs*P on an independent curve instance
      (curve.py scalar arithmetic, separate operation counter). Same
      discipline, the row's own statement.

  proof_search_map:
    bottleneck: 'Verbatim: relations per computed encoding. The generic value is fixed by IDEA-20260928-ce3ab0, so only kappa > 1 moves it.'
    baseline_embedding:
      parameter_slice: 'Verbatim: harvest classes TT, TB and SS switched off.'
      reproduction_check: >-
        Verbatim intent, with the handoff's column list: must reproduce the
        committed rows EXACTLY (attempts, relations, rank, s3_solves,
        table_s3_solves, target_ops, la_ops under the recorded la_pivot). This
        is a frozen regression fixture. Specification: EXP-PFDR-1b78f7 extends
        it to every committed row of all six results/sweep-*.jsonl.gz files and
        every non-timing column, and adds a second fixture: harvest in passive
        census mode reproduces the same columns on the two min_fill files.
    observation_collision:
      observable: kappa_c per class, and informative rank per class
      distinct_preimage_search: >-
        Verbatim: The H017 small-multiples base and a hypothetical informative
        high-energy base would share a large kappa and differ entirely in
        usefulness. So kappa is NEVER reported without two companions: the
        informative rank (rank modulo the formal relation lattice, which is
        computable for the controls) and the S_3-to-solution. The j=0 arm gives
        formal TB coincidences, which must be subtracted before kappa is read.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: per-class collision counts (TT, TB, SS, TS) with independent Poisson nulls, packed into one S_3-to-solution figure
        predicted_gain: generic 1.3-2.5x at odd m; exponent 0.75 -> 0.625 at m=4; structural delta/2 exponent if kappa ~ N^delta
      - transform: observable_fiber
        proposed_object: fixed |F| and fixed mean yield, varying base geometry; the fibre invariant is E_h(F)
        predicted_gain: separates second-moment structure from conservation-fixed first moment
    quantifier_order: >-
      Verbatim: THERE EXISTS an x-defined, target-independent base family
      {F_N}, with membership testable in polylog(p), such that FOR ALL N in
      2^20..2^32: kappa_TT(F_N) >= 1 + c*N^delta (delta > 0), AND informative
      rank >= 0.9*harvested rows. The family may depend on N (d must divide
      p-1), which the ordering allows. A positive at toy scale is a lever
      candidate, not a lever.
    method_ceiling:
      strongest_certifiable_claim: >-
        Verbatim: Measured kappa per class, arm and rung, with a fitted slope
        and interval, plus a measured generic harvest gain. It cannot certify
        asymptotic delta or cover bases outside the panel.
      nearby_object_control: >-
        Verbatim: Two controls. (i) The H017 small-multiples base: kappa huge,
        informative rank about 0, S_3-to-solution collapses via coverage. An
        instrument that cannot show that has no dynamic range. (ii) The matched
        random base, kappa = 1 by definition, with the seed band as the null.
    proof_obligations:
      - claim: every harvested row is a valid relation (certificate re-verified)
        responsibility: correctness
      - claim: harvest-off reproduces committed rows exactly
        responsibility: baseline
      - claim: random-base class counts match Poisson means from the encoding counts
        responsibility: success_probability
      - claim: formal (automorphism / known-log) coincidences are identified and subtracted
        responsibility: scope
      - claim: memory of the search-encoding store is reported (it grows to N^{(1+beta)/2})
        responsibility: memory
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim:
    problem: >-
      Relation-collection cost of the mitm index-calculus engine on E(F_p),
      in S_3 units. Not a claim about the best known ECDLP cost.
    prior_best: >-
      This engine: N^{max(h, m-h+1)/m} measured (README sections 3 and 5;
      0.75 at m = 4). ECDLP: Pollard rho 0.886*sqrt(N), O(1) memory.
    time_exponent: 'Verbatim target_complexity: Generic harvest: (m+1)/(2m) at every m (odd m unchanged; m=4 0.625, m=6 0.583). Structural branch: (1+beta-delta)/2 if kappa ~ N^delta.'
    memory_exponent: 'Verbatim: N^{(1+beta)/2} for the SS store (= N^{(m+1)/(2m)}); the mitm table N^{h/m} is unchanged.'
    hidden_cofactor: 'Verbatim: The ordering constant (about 0.46 at m=3) and formal subtraction; toy-range exponents include lower-order terms.'
    claim_kind: >-
      constant_factor at odd m; an exponent change of THIS ENGINE at even m
      that stays above rho's 1/2 (generic, not structural); exponent_improvement
      only on the structural branch, conditional on kappa ~ N^delta.
    promotion_gates_note: >-
      No part of this may move toward supported without the four promotion
      gates. EXP-PFDR-1b78f7 is a toy-scale measurement and heuristic
      validation (part of gate 2); gates 1, 3 and 4 are not in its scope. The
      hypothesis can reach analyzed on it, never supported.

  heuristic_assumptions:
    - id: HEUR-4765e4-H1
      source_label: IDEA-20260928-4e2be7 H1
      formal_statement: 'Verbatim: For a uniformly random x-set base, per-class coincidence counts are Poisson with means 4S_t^2/N (TT), 8S_t*S_s/N (TS), 4S_s^2/N (SS), and about 2|F|*T_t/N (TB), times the class ordering constant.'
      specification_of_means: >-
        Operational form fixed before any run (EXP-PFDR-1b78f7
        analysis.poisson_means): each harvested class is harvested WITHOUT an
        ordering rule, so its ordering constant is 1 by construction. Means are
        computed from logged counts of formally distinct elements:
        mu_TT = C(E'_t, 2) * 2/N; mu_TB = E'_t * |F| * 2/N; mu_SS = C(X'_s, 2) *
        2/N at the fixed attempt budget; E'_t = formally distinct stored tails,
        X'_s = formally distinct search encodings. With E'_t ~ 2 S_t these equal
        the generator's 4 S_t^2 / N and 2|F| T_t / N. TS is not harvested and is
        not tested.
      random_model_justification: 'Verbatim rigorous_support: GGM pairwise collision probability <= 2/N (see IDEA-20260928-ce3ab0). Imitated: the birthday/Poisson law.'
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-1b78f7]
      falsification_condition: >-
        Verbatim validation plan: Random arm, 15 instances per rung, 12..32
        bits: KS per class at 1%; max-count tail vs Poisson order statistic.
        Rejection at 1% in a class refutes H1 for that class at the tested scale.
    - id: HEUR-4765e4-H2
      source_label: IDEA-20260928-4e2be7 H2
      formal_statement: 'Verbatim: For subgroup, dickson and small_x bases in the regime |F| ~ N^{1/m} << sqrt(p), kappa_c = 1 + O(N^{-1/2+eps}).'
      random_model_justification: >-
        Verbatim rigorous_support: Proven (complete sums only): Hom(E, G_m) = 0,
        so the mixed multiplicative character sums of x(P), x(Q), x(P+Q) over
        E x E have square-root cancellation (Deligne-type, recalled). Imitated:
        Weil square-root cancellation. Gap: the IC regime is an incomplete sum
        over a subgroup-defined set, which is below the recalled
        Kohel-Shparlinski threshold p^{1/2}*log p and below the q^{1/2+eps}
        range of Shparlinski 2008 (additive characters).
      supporting_results: []
      supporting_results_note: >-
        Empty on purpose: the Deligne-type bound and Kohel-Shparlinski are
        recalled; Shparlinski 2008 was read at abstract only and is cited only
        for the negative scope statement (outside the proven range), which is
        what an abstract can support.
      validation_experiment_ids: [EXP-PFDR-1b78f7]
      falsification_condition: >-
        Verbatim validation plan: Fit log(max(kappa-1, SD_null)) vs log N per
        arm; compare to -1/2 and 0; Holm across arms; tails: most deviant cell
        vs the max-of-k Gaussian. H2 is refuted for an (arm, class, m) by the
        ALIVE reading of EXP-PFDR-1b78f7 (success_criterion S-ALIVE).
    - id: HEUR-4765e4-H3
      source_label: IDEA-20260928-4e2be7 H3
      formal_statement: 'Verbatim: Harvested rows from random and x-defined bases reach full rank within 1.05x the row count (the f89eaf H1 analogue).'
      random_model_justification: 'Verbatim rigorous_support: counting bound; random sparse-matrix rank heuristics.'
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-1b78f7]
      falsification_condition: >-
        Verbatim validation plan: rank staircase per run; permutation of row
        order must change the saturation point by < 0.02. Operational form in
        EXP-PFDR-1b78f7 analysis.informative_rank.

  structural_ingredients:
    - description: Bilinear additive-character sums over elliptic curves are nontrivially bounded only when #U > q^{1/2+eps}
      citation: 'doi:10.1016/j.ffa.2006.12.005 (Shparlinski, Finite Fields Appl. 14(1):132-141, 2008)'
      provenance: retrieved
      verified_by: TASK-20260928-9c44f2 (idea-generator) read the abstract on 2026-09-28; full text not read
      role: scope statement only -- the index-calculus regime lies outside the proven range
    - description: Upper bounds on solutions of F(x,y)=0 with x,y in small intervals or subgroups
      citation: arXiv:1803.02165 (Merai, Shparlinski 2018)
      provenance: retrieved
      verified_by: TASK-20260928-9c44f2 (idea-generator) read the arXiv abstract on 2026-09-28; the abstract gives no exponents
      role: nearest external ingredient for incomplete-regime counts; not relied on
    - description: Hom(E, G_m) = 0 implies square-root cancellation of complete mixed multiplicative character sums of x(P), x(Q), x(P+Q)
      citation: none retrieved (Deligne-type bound)
      provenance: recalled
      verified_by: null
      role: pointer for a reviewer; supports nothing
    - description: Conservation of mean decomposition yield across bases of equal size (first moment fixed)
      citation: KN-FIND-007
      provenance: internal
      verified_by: TASK-20260928-9c44f2 (idea-generator) read the finding in full
      role: shows the second-moment test is not vacuous
  reduction_chain:
    core_problem: none (a measurement of a relation source)
    corollaries: []

