    specification chose it and says so there.

  test_boundary:
    instances:
      - 'census curves: generate_prime_order_curve(bits, c, p_filter=subgroup_prime_filter([3,4,5], 0.15)), c = 0..4 for index calculus, c = 0..9 for rho; bits 12, 14, ..., 32'
      - 'j = 0 control curves: generate_prime_order_curve_j0(bits, c, p_filter=j0 filter), c = 0..4, bits 12..24 step 2'
      - committed curves of all six results/sweep-*.jsonl.gz files (regression and census-mode replication only)
    parameters:
      m: [3, 4, 5]
      table_arity: default (m+1)//2 (2, 2, 3)
      fb_size: len(subgroup base at default_fb_size(N, m)); the Dickson arm keeps its own size with its own matched randoms
      arms:
        - small_x
        - subgroup (coset)
        - dickson
        - random, three seeds, matched to subgroup and small_x
        - random, three seeds, matched to dickson
        - known_log (H017 small multiples; m = 3, <= 24 bits)
        - j0 coset with 3 | d, and j0 random with three seeds (m = 3, <= 24 bits)
      harvest_modes: [census (passive; solver columns identical to harvest off), on]
      la_pivot: min_fill
      target_label: census (all arms on a curve share one target stream)
    implementation: >-
      crypto_autoresearcher.index_calculus extended per EXP-PFDR-1b78f7
      implementation_contract: harvest.py (new), tails.py, decompose.py,
      solver.py, factor_base.py, curve.py, __main__.py. No new solver.
    budget:
      enforcement: advisory (docs/research-budget-policy.md); machine protection binding
      maximum_memory_gb: 14
      maximum_workers: 4
      per_process_rss_cap_gb: 3.5
      per_instance_watchdog_seconds: 7200
    scale: toy (fields <= 32 bits)
    transfer_assumptions: >-
      None. No statement about deployed curves. Any slope is a fit over
      20..32 bits and is not extrapolated as a bound.

  falsification_conditions:
    - 'Verbatim: Harvest-off fails to reproduce any committed row, so the build is broken and nothing is read.'
    - 'Verbatim: A harvested row fails certificate re-verification, which is an implementation error.'
    - "Verbatim: Random-base class counts outside the Poisson band mean the collision model (and IDEA-20260928-ce3ab0's H1) is wrong."
    - 'Verbatim: m=4 harvest exponent interval excluding values <= 0.66 means the floor is not attainable as claimed and IDEA-20260928-ce3ab0 (B) is weakened.'
    - "Verbatim: Every x-defined arm's kappa sits inside the random band at every rung. Lead 2 is then CLOSED for the tested arms, range and m, with the measured band as the obstruction record. This is the expected outcome."
    - "Verbatim: Any x-defined arm has kappa above 3 SD with a positive slope AND informative rank >= 0.95. That is a live non-generic relation source and the headline."
  falsification_conditions_note: >-
    Conditions 1 and 2 are instrument failures (invalid run, never evidence
    against the hypothesis). Condition 5 is the pre-committed null; it is a
    scoped closure of the tested arms only and, per AGENTS.md, a closure
    reading needs the obstruction block and independent review before any
    reject_scoped decision. Condition 6 is a lever candidate and is routed to
    review-breakthrough at max and independent replication before any
    interpretation (tripwire TW-ALIVE in EXP-PFDR-1b78f7).

  confounders:
    - 'Verbatim: Formal coincidences from automorphisms or from p-dependent coincidences in d (e.g. -1 or zeta_3 in mu_d). The j=0 arm and the formal-subtraction step exist for this.'
    - 'Verbatim: Ordering/reachability rules suppress some TS matches, and the effect differs by class. kappa is always computed per class against the matched random base, never against the raw Poisson model.'
    - 'Verbatim: The early stop shortens harvest-on runs, so class counts are reported both at stop and at a fixed encoding budget.'
    - 'Verbatim: Memory: the SS store grows to N^{(1+beta)/2}. It is reported, and cells that exceed the host limit are infrastructure stops, not evidence.'
  confounders_note: >-
    EXP-PFDR-1b78f7 reads the fixed budget as a fixed ATTEMPT budget over a
    shared target stream (A_fix = |F_sub| attempts), with the encoding count
    at A_fix logged. With all arms on a curve drawing identical targets, the
    fixed attempt budget equalises the search work to within per-target early
    stopping, which is the comparability the generator asked for.

  interpretation_limits:
    - 'Verbatim: The generic harvest gain is engineering, not an advance. It leaves every odd-m exponent unchanged and stays above rho.'
    - 'Verbatim: A kappa null closes only the tested arms (subgroup, dickson, small_x), m <= 5 and 12..32 bits.'
    - 'Verbatim: KN-OPEN-020 class - implicit-membership/high-degree (coset, Dickson). No target-dependent base is tested here.'
    - 'Verbatim: Toy scale. No claim about deployed curves.'
    - >-
      A kappa-positive outcome is a lever candidate for independent review, not
      a result (TASK-20260928-102217 claim tier). No existing hypothesis changes
      status on this experiment.
    - >-
      Only TT, TB and SS are harvested. Search-vs-base coincidences and
      order-suppressed table-vs-search matches are not harvested and not
      tested.
