  # ---------------------------------------------------------------------------
  pre_protocol_observation_disclosure:
    source: TASK-20260928-102217 constraints, "DISCLOSURE OF A PRE-PROTOCOL OBSERVATION" (quoted verbatim below)
    text: >-
      Before this design, the top-level session made an unrecorded scratch
      count (no run record, not evidence): for m=3 default |F|, h=2 tables at
      20/24/28 bits, 4 curves each, the number of extra tails sharing an x-key
      divided by E^2/N was 1.00/1.07/1.01 (small_x), 0.71/0.91/0.98 (random),
      0.68/0.97/1.05 (subgroup). The generator's null (kappa_TT = 1) was
      pre-committed independently.
    values:
      statistic: (table entries sharing an x-key with an earlier entry) / (E^2 / N), E = table entries, m = 3, h = 2, default |F|
      bits: [20, 24, 28]
      curves_per_rung: 4 (which four was not recorded)
      small_x: [1.00, 1.07, 1.01]
      random: [0.71, 0.91, 0.98]
      subgroup: [0.68, 0.97, 1.05]
    status: >-
      Not evidence. No run record, no command, no curve list, no seed record.
      Nothing in this hypothesis or in EXP-PFDR-1b78f7 cites it as support.
    handling:
      - >-
        The prediction on kappa_TT below is the generator's, written in
        IDEA-20260928-4e2be7 before this design and not adjusted in the light of
        the scratch values.
      - >-
        REPLICATION, NOT DISCOVERY. At m = 3 and 20, 24, 28 bits the TT census
        is labelled a replication of the scratch count. EXP-PFDR-1b78f7 recomputes
        the scratch statistic exactly, on the committed curves of
        sweep-minfill-20260926 (curves 0-4, and the subset 0-3), and reports it
