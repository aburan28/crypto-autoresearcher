      minimum_effect: '>= 0.95 for random and x-defined arms; <= 0.05 for the H017 control'
      source: IDEA-20260928-4e2be7 predictions[3], verbatim
    - metric: kappa_TB on the j=0, 3|d coset arm before and after formal subtraction
      direction: higher
      minimum_effect: 'before: >= 5; after: inside the random band (instrument check)'
      source: IDEA-20260928-4e2be7 predictions[4], verbatim
  prediction_operationalization_note: >-
    Every metric above is computed exactly as EXP-PFDR-1b78f7 section
    `analysis` defines it (kappa pooling, band, slope fit, rank ratio
    denominator, fixed attempt budget, resolution floor, Holm family). Those
    definitions were written before any run and do not change the generator's
