  title: >-
    The integer 2097151 has 20 doublings and 20 additions
  statement: >-
    The integer 2097151 has bit length 21. Its bits are twenty-one 1s.
    Reaching it by doubling and adding uses 20 doublings and 20
    additions. Twenty-one exceeds twenty by 1. Twenty equals twenty, so
    that gap is 0. The product of 21, 20, and 20 is 8400. Their sum is
    61. Two readings of the addition count are both 20, so that gap is
    0 and their product is 400.
  mechanism: >-
    The proposal writes the counts 21, 20, and 20. This contract
    checks those integers. It does not add a curve point.
  assumptions: []
  proof_search_map:
    bottleneck: The gap between bit length 21 and addition count 20.
    baseline_embedding:
      parameter_slice: >-
        The counts 21, 20, and 20 in IDEA-20261004-30a53f, read
        2026-10-04. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 2097151. The other counts the
        doublings and additions. They must agree that the counts
        are 21, 20, and 20.
    observation_collision:
      observable: The addition count 20 and the product 8400.
      distinct_preimage_search: >-
        Reporting the addition count as 21 drops the gap against
        the bit length. Two readings of the addition count make
        that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The counts 21, 20, and 20.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The bit length 21 comes first, then the doubling count 20,
      then the addition count 20, then the nearby gap 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 21, 20, and 20. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both are 20, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 2097151 is 21.
        responsibility: correctness
      - claim: The doubling count is 20 and the addition count is 20.
        responsibility: correctness
      - claim: The nearby gap is 0 and the nearby product is 400.
        responsibility: scope
    not_applicable_reason: null
