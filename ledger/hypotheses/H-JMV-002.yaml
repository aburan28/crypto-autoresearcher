hypothesis:
  id: H-JMV-002
  question_id: RQ-JMV-001
  statement: >-
    Under the PROVEN (GRH-conditional, explicitly constant-tracked) form of the
    Jao-Miller-Venkatesan Lemma 4.1 eigenvalue bound, the separation log(k/c) required by
    Proposition 3.1 - with k the degree of the class-group Cayley graph generated by prime
    ideals of norm <= m = (log q)^(2+delta) and c = C * m^(1/2) * log|mD| - is non-positive
    at q = 2^256 for small delta. Corollary 1.2's walk-length guarantee is therefore
    concretely vacuous at deployed field sizes even though it is valid asymptotically; and
    at the delta large enough to restore the separation, the reduction's cost in field
    operations (walk length r times a per-step modular-polynomial cost at typical l ~ m)
    exceeds the sqrt(n) cost of solving the instance directly under the same cost model.
  mechanism: >-
    The graph degree k grows nearly linearly in m (k ~ pi(m) ~ m / log m) while the proven
    eigenvalue bound c grows like C * sqrt(m) * log|mD| ~ C * sqrt(m) * log q. Hence
    k / c ~ sqrt(m) / (log m * log q), which exceeds 1 only once m is roughly
    (log q * log m)^2. With m = (log q)^(2+delta) this needs delta bounded away from 0 at
    any fixed q, and the required delta grows with q only logarithmically - so the bound is
    non-vacuous asymptotically for every delta > 0 while failing at fixed cryptographic q
    for small delta. The same enlargement of m that restores the separation raises the
    typical isogeny degree l <= m, and per-step cost is polynomial in l (modular polynomial
    Phi_l), so the two effects push in opposite directions and the cost model has a
    computable crossover rather than a uniformly negligible overhead.
  assumptions:
    - "LOAD-BEARING AND UNVERIFIED: the transcriptions of Theorem 1.1, Corollary 1.2, Proposition 3.1 and Lemma 4.1 (including their normalization of degree and of the eigenvalue) are faithful to arXiv:math/0411378v3. The paper is not in the corpus."
    - Every implied constant is traceable to a cited source (Bach-Sorenson-type explicit GRH bounds, JMV ref [2]); no constant is invented or silently set to 1.
    - "A single stated convention for the Cayley-graph degree (whether a split prime contributes one generator or two; the meaning of the 1/e normalization) is fixed and reconciled in writing to the paper's own statements. A factor of 2 here moves log(k/c) across zero."
    - The per-step cost model states explicitly whether Phi_l is assumed precomputed and available; at m ~ 2^18 and above Phi_l is not storable, so a cost that silently assumes free precomputation is not a cost.
  predictions:
    - metric: "sign of log(k/c) under the proven bound at q = 2^256, delta in {0.25, 0.5, 1.0}"
      direction: lower
      minimum_effect: "at least one (q >= 2^128, delta <= 1) cell has log(k/c) <= 0 under BOTH logarithm conventions"
    - metric: "ratio of modelled reduction overhead to sqrt(n), typical-l per-step variant"
      direction: higher
      minimum_effect: "ratio >= 1 at some tested q >= 128 bits, i.e. a crossover exists inside the tested grid"
    - metric: "delta required for log(k/c) > 0 at q = 2^256"
      direction: higher
      minimum_effect: "strictly greater than the smallest tested delta (0.25), reported with its induced m and typical l"
  test_boundary:
    instances:
      - "No curve is instantiated and nothing is measured. q in {64, 96, 128, 160, 192, 224, 256, 320, 384, 512} bits enters only as a parameter of a deterministic cost model."
    parameters:
      delta_values: [0.25, 0.5, 1.0, 2.0]
      lambda_2_source: "branch (a) proven explicit-constant bound ONLY; branch (b) (measured constant from EXP-JMV-003) is not approved and is blocked"
      log_conventions: "both base-2 and natural, reported side by side"
      per_step_variants: "typical l ~ m and best-case l = 2, both reported"
    implementation: experiments/EXP-JMV-004 at spec version 2, branch (a) only
    budget: {total_cpu_hours: 1, maximum_runs: 5, maximum_memory_gb: 2}
  falsification_conditions:
    - "log(k/c) > 0 at every tested (q >= 2^128, delta >= 0.25) cell under both logarithm conventions and the cited constants, AND modelled reduction overhead < 2^-20 * sqrt(n) at every size >= 128 bits. The paper's practical reading is then vindicated under the stated model and this line closes."
    - The conclusion flips between the two logarithm conventions or between the two degree conventions; the result is then reported as convention-dependent and is not a finding.
    - Any implied constant used is not traceable to a cited, independently checked source; the run is invalid, not negative.
  interpretation_limits:
    - "A claim about THE STATED COST MODEL (Prop 3.1 walk length, per-step modular-polynomial cost) and nothing else. Zero instances are tested at any size; the tier discipline in docs/claims-and-verification.md derives tier from instances actually tested, and this experiment tests none."
    - "A vacuous PROVEN separation means Corollary 1.2 is concretely UNPROVEN at deployed sizes. It never means the corollary is false, and it says nothing about whether the reduction works in practice."
    - Nothing here confirms or disconfirms GRH.
    - "This is a reduction cost audit. It is not an attack, produces no attack-cost improvement, and must not be written up as evading the D1 data-movement or BAR-AMORT-D2 exponent-neutrality barriers, which concern attacks."
    - "A high modelled reduction cost is not a security claim: a self-reduction being expensive does not make any dlog instance easier or harder."
  status: approved
  proposed_by: session
