hypothesis:
  id: H-ISOU-5748b6
  question_id: RQ-ECDLP-002
  sub_goal_id: SG-ECDLP-002
  goal_id: GOAL-ECDLP-001
  idea_id: IDEA-20260812-68e87f
  supersedes: H-ISOU-c5bfea
  supersession_decision: DEC-20260813-61e8a3
  supersession_reason: >-
    VAL-DEF-02 of the independent Validator report VAL-20260814-e183e6:
    HEUR-ISOU-1's formal_statement in H-ISOU-c5bfea asserts the constant
    0.886*sqrt(N) as a MEAN over seeds. That constant is sqrt(pi*N/4), the
    expectation for rho running in the quotient by inversion -- the NEGATION-MAP
    constant -- while the protocol this hypothesis is tested by mandates plain
    rho with NO negation map, and every executed manifest records
    negation_map_used false. Two errors are stacked: the wrong constant, and a
    MEAN asserted where the protocol compares a MEDIAN. An experiment
    amendment cannot reach a hypothesis field, so a superseding HYPOTHESIS is
    the only route -- this supersession is required, not optional. Records are
    immutable: H-ISOU-c5bfea's text stands unedited and only its status moves.

  changes_from_predecessor:
    substantive:
      - >-
        heuristic_assumptions[HEUR-ISOU-1].formal_statement is restated with
        the constant DERIVED in the record rather than asserted, and with the
        statistic it applies to NAMED, because failing to name the statistic
        was half of VAL-DEF-02.
    consequential_consistency_edits:
      - >-
        mechanism: the sentence citing 0.886*sqrt(N) as rho's expected step
        count is corrected to the plain-rho ideal median and mean, since it is
        the same defect propagated into prose and carrying it forward would
        leave the record internally inconsistent with its own corrected
        heuristic.
      - >-
        proof_search_map.baseline_embedding.reproduction_check is restated on
        the corrected MEDIAN constant, named as a median, for plain rho with no
        negation map. This is the field the frozen contract's reproduction
        clause is built from.
    verbatim_carry_forward: >-
      statement, assumptions, the rest of proof_search_map (bottleneck,
      observation_collision, constructive_transforms, quantifier_order,
      method_ceiling, proof_obligations), rerandomization, asymptotic_claim,
      HEUR-ISOU-1's random_model_justification, supporting_results and
      falsification_condition, structural_ingredients, reduction_chain,
      predictions, test_boundary, falsification_conditions and
      interpretation_limits are carried forward from H-ISOU-c5bfea unchanged in
      substance. NO PREDICTION, FALSIFICATION CONDITION OR SUCCESS BOUNDARY IS
      LOOSENED BY THIS SUPERSESSION, and none is tuned to any observed outcome.

  statement: >-
    In the complete F_p-isogeny class of a P-256-shaped toy curve (ordinary,
    prime order N, conductor f = 1, a = -3 model), the number of group
    operations required to solve a fixed transferred DLP instance is invariant
    across every class member up to the seed-induced control band, while the
    field cost PER group operation varies across members by a bounded constant
    factor determined by reachability of the a = -3 Jacobian model; and no
    member is cheaper end-to-end than the base curve once the isogeny walk that
    reaches it is charged.

  mechanism: >-
    By Tate/Honda-Tate, F_p-isogenous curves share the Frobenius trace and hence
    the group order N, so the step count of plain Pollard rho -- whose ideal
    median is sqrt(2*N*ln 2) and whose ideal mean is sqrt(pi*N/2) -- is fixed
    across the class: the FIRST leg is predicted invariant for a theorem-backed
    reason and functions as a positive control on the meter. (The constant is
    stated here with its statistic named. The negation-map figure sqrt(pi*N/4),
    about 0.886*sqrt(N), applies to rho run in the quotient by inversion and is
    NOT the constant for the solver this hypothesis is tested by; asserting it
    was VAL-DEF-02.)

    What is NOT fixed by the trace is the Weierstrass model. A curve
    y^2 = x^3 + a*x + b admits an isomorphic model with a = -3, whose Jacobian
    doubling saves field multiplications, exactly when a/(-3) is a fourth power
    in F_p. That criterion depends on the individual member, not on the class,
    so the SECOND leg is predicted to vary -- by a small constant factor, and
    only through this criterion. Because N is prime and odd, no member has
    rational 2-torsion, so no member admits a Montgomery or Edwards model; the
    constant-factor lever available inside the class is therefore bounded by the
    a = -3 saving alone.

    The THIRD leg charges the walk. Reaching a member costs explicit Velu
    isogeny evaluations, and the end-to-end comparison is (walk + solve) against
    the base curve's solve alone. A cheap bridge is not a free bridge.

  assumptions:
    - Velu isogeny computation over the toy field is exact and every edge is
      certificate-checked rather than trusted.
    - Rho step counts are random variables compared as distributions over seeds,
      never as single-run point estimates.
    - Per-operation cost is measured by instrumented field-multiplication counts;
      wall-clock is secondary and never carries a cost claim.
    - The class is enumerated completely up to F_p-isomorphism, so "no member is
      cheaper" is a statement about all of it, not about a sample of it.

  proof_search_map:
    bottleneck: >-
      Obstruction 4 of EV-ECDLP-b3e847 ("within-class uniformity"), the one leg
      of the SG-ECDLP-002 closure that the red team recorded as empirical rather
      than proven. Removing it would reopen the isogeny-transfer direction.
    baseline_embedding:
      parameter_slice: >-
        Ordinary prime-field curves, prime order N, conductor f = 1 -- the slice
        P-256 occupies (ISO-EXP-001 established P-256's flat volcano).
      reproduction_check: >-
        THE FIXTURE IS A MEDIAN AND IS NAMED AS ONE. The base curve's MEDIAN
        over the declared seeds of the plain-rho group-operation count must
        reproduce the ideal median sqrt(2*N*ln 2), about 1.1774*sqrt(N), within
        the declared tolerance of the governing contract, recorded as a frozen
        fixture before any between-member comparison is read. The statistic
        compared, the constant, and the tolerance are all fixed in the contract
        BEFORE data; leaving any of the three to the producer is what
        VAL-DEF-01 and VAL-DEF-02 were.
      reproduction_check_note: >-
        The ideal is a LOWER reference, not a two-sided prediction: a
        finite-branch r-adding walk plus distinguished-point detection costs
        strictly more than the random-function ideal, so the governing contract
        declares a one-sided tolerance above it and states its size and
        provenance. See EXP-ISOU-bfba73.
    observation_collision:
      observable: >-
        The pair (group operations to solve, field multiplications per group
        operation) indexed by class member.
      distinct_preimage_search: >-
        Look for two members of the same class whose first coordinate differs
        beyond the control band. Tate predicts none exists. A difference in the
        second coordinate alone is a group-law constant, reported as such and
        never as a DLP weakness.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of the measured cost observable over the isogeny class.
        predicted_gain: >-
          None. The predicted fiber is the entire class on the group-operation
          coordinate. Naming it converts "uniform" from an assertion into a
          measured quantity with a stated band.
    quantifier_order: >-
      FOR ALL members E' of the fixed F_p-isogeny class of E_0, DOES THERE EXIST
      a charged solve on E' cheaper than the solve on E_0? Predicted: NO for
      every member. The class is fixed FIRST by the base curve, mirroring an
      attacker who is handed P-256 and cannot choose its class.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale, certificate-carrying, complete-class statement: no member
        solves cheaper in group operations, and the per-operation spread is
        bounded by the measured best-to-worst ratio. It does not promote to a
        theorem about P-256 and is not evidence about P-256's own security.
      nearby_object_control: >-
        Random curves of materially different order over a declared smaller
        prime p': the nearest objects that SHOULD differ in cost. A census blind
        to their difference has not earned a null. THE RATIO N/N' IS NOT
        ASSERTED HERE AND IS NOT A ROUND NUMBER CHOSEN FOR CONVENIENCE: the
        governing contract derives it from a stated separation-power
        calculation under the designated resolution statistic, because the
        predecessor's asserted N' <= N/16 made its own gate a coin toss at its
        own boundary (VAL-DEF-01, band_determination). Same-p different-trace
        curves cannot play this role -- Hasse holds their orders within a
        relative width O(1/sqrt(p)), far below the rho seed noise -- and serve
        only as a STRUCTURAL null object (they must not appear in the class
        walk).
    proof_obligations:
      - claim: Group-operation count is invariant across the class
        responsibility: baseline
      - claim: Per-operation field cost varies only via the a = -3 criterion
        responsibility: correctness
      - claim: The isogeny walk is charged, not treated as free preprocessing
        responsibility: runtime
      - claim: Every reported solve carries an independently re-verified certificate
        responsibility: correctness
      - claim: The instrument detects a genuine cost difference when one exists
        responsibility: feasibility

  rerandomization: null
  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-ISOU-1
      formal_statement: >-
        Let E/F_p have prime group order N and let (P, Q = [k]P) be an instance
        in that group. Run PLAIN Pollard rho -- an r-adding pseudorandom walk
        with NO negation map and no other automorphism quotient -- from
        independent seeds, counting group operations to the collision that
        recovers k. Modelling the walk as a uniform random function on the
        group of order N, the step count T satisfies the birthday survival law
        P(T > t) = exp(-t^2/(2*N)), and therefore:
        THE MEDIAN OF T IS sqrt(2*N*ln 2), about 1.17741*sqrt(N);
        THE MEAN OF T IS sqrt(pi*N/2), about 1.25331*sqrt(N);
        and the coefficient of variation is sqrt(4/pi - 1), about 0.5227.
        THE STATISTIC ASSERTED BY THIS HEURISTIC IS THE MEDIAN OVER SEEDS,
        sqrt(2*N*ln 2)*(1 + o(1)), because the median is the statistic every
        between-curve comparison in the governing protocol is evaluated on.
        This holds uniformly over curves of equal order N regardless of
        j-invariant or Weierstrass model.
      constant_derivation: >-
        DERIVED HERE RATHER THAN ASSERTED, BECAUSE ASSERTING IT IS WHAT FAILED.
        From the survival function P(T > t) = exp(-t^2/(2*N)):
        (1) MEDIAN. Solve exp(-t^2/(2*N)) = 1/2, giving t^2 = 2*N*ln 2 and
        median = sqrt(2*N*ln 2) = 1.177410*sqrt(N).
        (2) MEAN. E[T] equals the integral of the survival function over
        t >= 0, which is sqrt(pi*N/2) = 1.253314*sqrt(N).
        (3) THE NEGATION-MAP CONSTANT AND WHY THE OLD FIXTURE WAS WRONG. With
        the negation map, rho walks in the quotient by inversion, an effective
        group of order N/2, so its MEAN is sqrt(pi*(N/2)/2) = sqrt(pi*N/4) =
        0.886227*sqrt(N). That is the constant H-ISOU-c5bfea asserted. The
        ratio sqrt(pi*N/2) / sqrt(pi*N/4) = sqrt(2) = 1.41421 is exactly the
        factor by which the old fixture was wrong for the solver the protocol
        mandates.
        (4) DISPERSION. E[T^2] = 2*N, so Var(T) = 2*N - pi*N/2 and the
        coefficient of variation is sqrt(4/pi - 1) = 0.5227, independent of N.
        (5) RESOLUTION OF A MEDIAN OVER n SEEDS. The density of T/sqrt(N) is
        f(x) = x*exp(-x^2/2), so f at the median 1.17741 equals 1.17741*0.5 =
        0.58871, and the asymptotic standard error of the sample median of n
        draws is 1/(2*f*sqrt(n)). At n = 16 that is 0.21233*sqrt(N), i.e. about
        18.0 percent of the median. This number is what any resolution band or
        null-object sizing must be computed from; the governing contract does
        so explicitly.
      random_model_justification: >-
        The birthday law is the idealization that the rho walk behaves as a
        random function on the group. This is an assumption about the WALK, not
        about the curve; the uniformity clause is precisely the part this
        experiment tests rather than assumes. A REAL walk costs strictly MORE
        than the ideal -- a finite-branch r-adding walk is not a uniform random
        function, and distinguished-point detection adds an expected 1/theta
        steps after the collision -- so the ideal constants above are a lower
        reference and the governing contract carries the tolerance, one-sided
        above the ideal, with its size and provenance declared before data.
      supporting_results:
        - description: Birthday-bound step count for Pollard rho on a cyclic group of order N
          citation: Pollard 1978, Monte Carlo methods for index computation (mod p)
          role: expected step count
        - description: >-
            Limiting distribution of the birthday/rho collision time, giving the
            survival law exp(-t^2/(2N)) from which the mean sqrt(pi*N/2) and the
            median sqrt(2*N*ln 2) follow
          citation: >-
            Harris 1960 / Knuth, The Art of Computer Programming vol. 2,
            birthday-problem asymptotics (standard result)
          role: fixes which constant belongs to which statistic
        - description: >-
            Negation-map speedup for rho on elliptic curves, working in the
            quotient by inversion and giving the factor sqrt(2)
          citation: Wiener-Zuccherato 1998, Faster attacks on elliptic curve cryptosystems
          role: identifies 0.886*sqrt(N) as the constant this protocol must NOT use
        - description: >-
            Performance of r-adding pseudorandom walks against the ideal random
            function, and the finite-r penalty
          citation: Teske 1998/2001, on random walks for Pollard's rho method
          role: >-
            justifies a one-sided tolerance above the ideal rather than a
            two-sided prediction; the numeric penalty is declared in the
            governing contract, not asserted here
        - description: F_p-isogenous curves have equal group order (equal Frobenius trace)
          citation: Tate 1966, Endomorphisms of abelian varieties over finite fields
          role: class invariance of N
      validation_experiment_ids: [EXP-ISOU-bfba73]
      validation_experiment_note: >-
        EXP-ISOU-2ac81f is NOT listed as a validation experiment of this
        heuristic. It tested a mis-specified form of it, its four runs are
        valid artifacts of the contract they ran under, and they are never
        re-scored against the corrected constant -- re-scoring after seeing the
        outcome is the post-hoc adjustment pre-registration exists to prevent.
      falsification_condition: >-
        Class members and the different-ORDER controls show materially
        different relative dispersion in step count under matched seed
        schedules, which would mean the walk is not acting as a random function
        on some curve and the meter, not the mathematics, is the finding. THE
        COMPARISON IS THE COEFFICIENT OF VARIATION OF POOLED SOLVED COUNTS,
        MEMBERS AGAINST NULLS, and it must be computed in the run and reported
        whether or not it fires; the predecessor's runs did not compute it and
        the Validator had to.

  structural_ingredients:
    - description: >-
        Tate's theorem: two elliptic curves over F_p are F_p-isogenous iff they
        have the same number of points, so group order is a class invariant.
      citation: Tate 1966, Endomorphisms of abelian varieties over finite fields
      role: fixes the predicted invariance of the group-operation count
    - description: >-
        Velu's formulas for the explicit quotient of an elliptic curve by a
        finite subgroup, giving the isogeny and its codomain.
      citation: Velu 1971, Isogenies entre courbes elliptiques
      role: constructs every edge of the walk explicitly and checkably
    - description: >-
        Kohel's isogeny-volcano structure for ordinary curves; conductor f = 1
        gives a flat (single-level) volcano.
      citation: Kohel 1996, Endomorphism rings of elliptic curves over finite fields
      role: justifies choosing an f = 1 base curve to imitate P-256's shape
    - description: >-
        The a = -3 Jacobian-coordinate doubling saving, available exactly when
        a/(-3) is a fourth power in F_p.
      citation: IEEE P1363 / standard Jacobian-coordinate arithmetic
      role: the only within-class constant-factor lever predicted to exist

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
    - metric: group_operations_to_solve, spread across class members
      direction: different
      minimum_effect: >-
        Zero. No member's median differs from the class median by more than the
        seed-induced control band established on the base curve. A member
        outside the band is triaged as an instrument defect before it is read as
        a result, and a flag count is uninterpretable without its nominal
        false-flag expectation reported beside it.
    - metric: field_multiplications_per_group_operation, best-to-worst ratio
      direction: different
      minimum_effect: >-
        Strictly greater than 1.0 (some spread exists) and strictly below 1.5,
        with the split explained by a = -3 model reachability.
    - metric: charged_end_to_end_cost (walk + solve) versus base-curve solve
      direction: different
      minimum_effect: >-
        Zero improvement. No member is cheaper than the base curve once the walk
        that reaches it is charged. THE BASIS ON WHICH THE WALK IS CHARGED MUST
        BE DESIGNATED BY THE GOVERNING CONTRACT AND BOTH BASES REPORTED: the
        measured-evaluation and modelled-construction bases gave OPPOSITE
        headline answers under the predecessor contract, so an undesignated
        basis makes this prediction untestable rather than merely ambiguous.
    - metric: montgomery_or_edwards_model_reachable, count over class members
      direction: different
      minimum_effect: >-
        Exactly zero members, because N is prime and odd so no member carries
        rational 2-torsion.

  test_boundary:
    instances:
      - one P-256-shaped toy base curve E_0 (ordinary, prime N, f = 1, a = -3)
      - the complete F_p-isogeny class of E_0 up to F_p-isomorphism
      - >-
        at least 8 random curves of materially different order over a declared
        smaller prime p', as cost-resolution null objects, with the order ratio
        set by the governing contract's stated separation-power calculation
        rather than asserted
    parameters:
      isogeny_degrees: [2, 3, 5, 7, 11, 13]
      prime_bits: [20, 24]
      seeds_per_curve: 16
      solver: >-
        Pollard rho with distinguished points, NO negation map, matched
        implementation across curves, distinguished-point density declared as a
        function of each curve's own order
      secondary_solver: BSGS as an independent cross-check, run unconditionally
    implementation: experiments/EXP-ISOU-bfba73/ (written by the Executor on approval)
    budget:
      maximum_runs: 4
      wall_clock_seconds_per_run: 600

  falsification_conditions:
    - >-
      A class member solves in materially fewer group operations than the class
      median, outside the control band, with a verified certificate, reproduced
      under fresh seeds. This contradicts order-invariance and would reopen the
      closed direction. The instrument is suspected first.
    - >-
      The per-operation field-cost ratio exceeds 1.5x best-to-worst, or the
      spread fails to track a = -3 model reachability. This refutes the specific
      constant-factor model stated here without touching any exponent.
    - >-
      Any class member admits a Montgomery or Edwards model, refuting the
      prime-order / no-2-torsion argument this hypothesis relies on.
    - >-
      The different-ORDER null objects show no detectable cost difference from
      the class members at the designated resolution statistic, which would mean
      the meter cannot see a real difference and NO null result from the
      experiment may be believed. Same-p different-trace curves are excluded
      from this condition: Hasse confines their orders to a relative width
      O(1/sqrt(p)), so their non-separation is a statistical certainty and
      falsifies nothing.

  interpretation_limits:
    - >-
      Toy scale; claim_tier toy. P-256 is the SHAPE imitated, not the object
      measured. Nothing here is evidence about the security of P-256 itself.
    - >-
      A null result does not prove within-class uniformity. It upgrades
      obstruction 4 of EV-ECDLP-b3e847 from asserted to measured-at-toy-scale --
      exactly the evidentiary step the red team requested, and no more.
    - >-
      The constant-factor leg is a constant factor. It moves no exponent and is
      not a speedup claim against ECDLP. dominated_by is Pollard rho at
      exponent 1/2, with sota_delta not_applicable on every axis.
    - >-
      Timeouts, crashes, and infrastructure failures are never negative
      mathematical evidence (AGENTS.md rule 5).
    - >-
      NOTHING MEASURED UNDER THE PREDECESSOR CONTRACT SUPPORTS THIS HYPOTHESIS.
      EV-ISOU-7c6405 records what those runs admit, at strength `preliminary`,
      against a contract with two defects that were blocking at approval. This
      record enters unsupported and must earn support from runs under
      EXP-ISOU-bfba73.

  status: proposed
  status_history:
    - status: proposed
      decision_id: DEC-20260813-61e8a3
      decided_at: '2026-08-14'
      reason: >-
        Authored as the superseding hypothesis for H-ISOU-c5bfea under the
        BATCH-009b1b disposition, curing VAL-DEF-02. It enters at `proposed`
        and NOT at its predecessor's `specified`: `specified` was granted to
        H-ISOU-c5bfea on the strength of an APPROVED, frozen contract, and this
        record's designated validation experiment EXP-ISOU-bfba73 stands at
        `review_required` with approved_by null. It advances to `specified`
        only on a Coordinator decision approving that contract after
        independent review. This transition asserts NO experimental support,
        NO result about within-class uniformity, and nothing whatever about
        P-256; obstruction 4 of EV-ECDLP-b3e847 remains exactly as the red team
        recorded it -- empirical, not proven.
  proposed_by: coordinator under DEC-20260813-61e8a3, superseding H-ISOU-c5bfea
