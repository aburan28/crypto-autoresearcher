  statement: >
    Fix one synthetic free-target CNF on five
    variables a, b, c, r0, r1, frozen before
    any count is read. Stage 0 asserts only
    the exact-count calibrator of
    IDEA-20260905-3993c3 on this family:
    (i) REAL3 encodes r0 = a XOR b and
    r1 = a XOR c and has unprojected count
    U=8 and projected count P=4; (ii) KF3,
    the unconstrained 5-bit cube, has U=32
    and P=4; (iii) NULL3 is (a) and (not a)
    and has U=0 and P=0; (iv) an empty
    variable list or a core-only variable
    map is rejected before U or P is read
    as a free-target census. This is not
    ApproxMC, not XOR hashing, not cadical,
    not a PAC counter, and not Stage 1.
    Neither reading is a decoder or an
    ECDLP advantage.
  mechanism: >
    The unprojected count is the number of
    satisfying assignments. The projected
    count is the number of distinct target
    assignments that appear. Stage 0
    evaluates that distinction by brute-force
    enumeration on one frozen 5-variable
    family: the real XOR-determined system
    has U=8 and P=4, the unconstrained cube
    has U=32, and the unsat null has U=0.
    This is a new RQ-ECDLP-002 object after
    Stage 0 of EXP-ECDLP-79f8c4 held as
    P-S0-AUT (DEC-20260908-35b930). It is
    not Stage 1 of EXP-ECDLP-79f8c4, not
    Stage 1 of EXP-ECDLP-628891, not Stage 1
    of EXP-ECDLP-9e9536, not Stage 1 of
    EXP-ECDLP-90f602, and not Stage 2 of
    EXP-ECDLP-4be480.
  predictions:
    - id: P-S0-COUNT
      metric: well-defined exact U and P on the frozen family
      direction: different
      minimum_effect: >
        After fixture_pass, REAL3 has U=8 and
        P=4. KF3 has U=32 and P=4. NULL3 has
        U=0 and P=0. Empty and core-only
        objects are rejected. One certified
        miss after fixture_pass is a scoped
        falsification of this instrument on
        the frozen family.
      claim_tier: observational
    - id: P-S1-APPROXMC
      metric: PAC projected counter versus exact U
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0
        does not run ApproxMC, does not XOR
        hash, and does not claim a pdp encoder.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFEXTRA
      statement: >
        After fixture_pass, KF3 fails to have
        U=32 and P=4. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALCOUNTS
      statement: >
        After fixture_pass, REAL3 has U other
        than 8 or P other than 4. That
        falsifies only P-S0-COUNT on this
        family.
    - id: F-S1-APPROXMC
      statement: >
        After an authorized later stage, a
        claimed PAC estimate misses the
        exact calibrator. Unauthorized here.
