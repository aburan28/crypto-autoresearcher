    prose: >
      Toy scale. Stage 0 is brute-force
      exact enumeration on one 5-variable
      free-target CNF. It is not ApproxMC,
      not XOR hashing, not cadical, not a
      PAC counter, not the Trimoska pdp
      encoder, not Stage 1 of
      EXP-ECDLP-79f8c4, not Stage 1 of
      EXP-ECDLP-628891, not Stage 1 of
      EXP-ECDLP-9e9536, not Stage 1 of
      EXP-ECDLP-90f602, and not Stage 2 of
      EXP-ECDLP-4be480. No cryptographic
      transfer. Do not hunt a new CNF after
      this freeze.
  assumptions:
