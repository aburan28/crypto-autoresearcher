hypothesis:
  id: H-XEDN-4f2172
  question_id: RQ-XEDN-001
  derived_from_idea: IDEA-20260815-8f5ae8
  added: '2026-08-25'

  statement: >-
    SCOPE: the retained raw census data of the three completed XEDN goals
    GOAL-XEDN-001, -002 and -003, reachable from their committed goal records
    and their experiments' committed run artifacts. CLAIM TIER toy. NO ATTACK,
    NO EXPONENT, NO NEW CENSUS RUNS unless poolability fails.

    THE HYPOTHESIS, IN THREE ORDERED PARTS. Each is decided before the next is
    attempted, and a negative at any stage is a legitimate result rather than a
    reason to spend on a fourth control.

    R (RETENTION). The raw per-surface census data of all three completed goals
    is retained and reachable, at sufficient granularity to recompute a lift
    probability per (goal, size) cell. If it is not, the fit is IMPOSSIBLE from
    existing data and a fourth control is genuinely required -- that is a
    documented state of the archive, not evidence about the exponent.

    P (POOLABILITY). The three controls' census designs estimate the SAME
    lift-probability quantity, so their per-control fitted exponents agree
    within their confidence intervals and a homogeneity test does not reject.
    THE PARENT PROPOSAL'S OWN HONEST PRIOR PUTS THIS BELOW EVEN ODDS, because
    each control deliberately varies a different coefficient window; if the
    exponent depends on the window, the three estimate DIFFERENT quantities and
    pooling is simply invalid. A rejection is a finding about the lane, not a
    failure of the experiment.

    F (THE FIT). Conditional on R and P, the pooled fit of the
    lift-probability exponent spans at least THREE distinct sizes and its
    confidence interval either excludes or contains the threshold RQ-XEDN-001
    declares for its phase-two gate. A fit spanning fewer than three distinct
    sizes IS NOT A FIT and does not meet the gate however tight its interval.

    THE ONE FAILURE THIS DESIGN IS BUILT TO PREVENT. A homogeneity test that
    cannot reject is not a homogeneity test. A SYNTHETIC INJECTION CONTROL --
    two deliberately different exponents fed through the identical agreement
    machinery -- must be REJECTED by it, or the pooling verdict carries no
    information and part P is undecidable.

  mechanism: >-
    DERIVED FROM THE PARENT PROPOSAL, which is deliberately thin and whose
    contribution is the observation that the lane's declared phase-two gate may
    already be answerable from data already paid for.

    (1) WHY THE ORDER MATTERS. Retention is a fact about the archive and costs
    minutes to establish. Poolability is a fact about three designs and costs
    one fit per control. Only the third stage spends anything on the gate
    itself. Reversing the order -- pooling first and checking compatibility
    afterwards -- would produce a confident fit of nothing, which is the
    parent proposal's own named primary confounder.

    (2) WHAT "SAME QUANTITY" MEANS OPERATIONALLY. All three controls sample
    sections on rational elliptic surfaces under the same lifting definition,
    which is the rigorous ingredient. THE GAP is that each deliberately varies
    a different coefficient window, and the exponent may depend on the window.
    Operationally, therefore, poolability is tested as HOMOGENEITY OF THE
    PER-CONTROL EXPONENTS -- fit each control separately, then apply a
    pre-declared heterogeneity statistic across the three point estimates with
    their standard errors, at a pre-declared significance level.

    (3) WHY AN INJECTION CONTROL IS BLOCKING. A heterogeneity test on three
    point estimates has low power by construction. Without demonstrating that
    the specific test, at the specific standard errors of the specific data,
    DOES reject a known-heterogeneous input, "the exponents agree" is
    indistinguishable from "the test cannot tell". The injection control makes
    part P two-sided.

    (4) WHY THE SIZE COUNT IS A SEPARATE, EQUALLY BLOCKING GATE. A fitted
    exponent from two distinct sizes is a line through two points and its
    confidence interval is a statement about noise, not about a power law. The
    number of DISTINCT sizes the pooled data actually spans is reported as a
    primary metric in its own right, and a fit over fewer than three of them is
    reported as not meeting the gate regardless of what the interval does.

    (5) SURVIVORSHIP IS NAMED, NOT SOLVED. The three goals may have been
    completed precisely because their windows behaved. This design cannot
    correct for that; it reports the selection explicitly with every fit, and
    the interpretation limits forbid reading the pooled fit as a statement
    about the family rather than about the three completed windows.

  assumptions:
    - >-
      The three goals' raw census data is retained at per-surface granularity,
      not only as summary statistics. A summary-only archive supports no fit
      and the honest output is that the data does not exist in usable form.
    - >-
      The lifting definition is identical across the three controls, so that
      "lift probability" names one quantity even if its VALUE differs by
      window. If the definitions differ, the exponents are not comparable at
      all and part P fails for a stronger reason than heterogeneity.
    - >-
      The heterogeneity statistic, its significance level, the fit's functional
      form, and the size variable are all declared BEFORE any per-control
      exponent is computed. A test selected after seeing three point estimates
      is not a test.
    - >-
      Reading committed run artifacts is not running an experiment, but every
      number re-extracted from them must be re-extracted IN HARNESS before it
      may be cited.
    - >-
      RQ-XEDN-001's declared phase-two threshold is read verbatim from that
      record at run time and is not restated here from memory.

  proof_search_map:
    bottleneck: >-
      NOT the fit, which is arithmetic, but the poolability decision. Every
      downstream number inherits it -- a pooled exponent computed across three
      designs that estimate different quantities is a precise answer to no
      question, and it would then be cited as the lane's phase-two resolution.
    baseline_embedding:
      parameter_slice: >-
        Each completed control's own reported per-cell lift counts, refit in
        isolation.
      reproduction_check: >-
        Before any pooled number is produced, each control's per-cell lift
        counts and totals re-extracted from its committed run artifacts must
        reproduce the summary values recorded in that goal's own evidence
        records, EXACTLY as integers. A refit that cannot reproduce the
        counts it is built from is measuring a different archive.
    observation_collision:
      observable: >-
        A single fitted exponent with a confidence interval.
      distinct_preimage_search: >-
        The falsifier to hunt is TWO MATERIALLY DIFFERENT per-control exponent
        vectors producing the SAME pooled estimate with a similar interval. If
        pooling maps a heterogeneous input and a homogeneous input to
        indistinguishable outputs, the pooled number does not identify the
        underlying quantity and may not be reported as the lane's answer. This
        is exactly what the synthetic injection control constructs, which is
        why that control is blocking rather than advisory.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "commission a fourth control" with "decide whether the three
          existing controls estimate one quantity", turning a compute decision
          into a homogeneity test on data already paid for.
        predicted_gain: >-
          If homogeneous, the lane's declared phase-two gate resolves at the
          cost of a fit. If heterogeneous, the lane learns that its three
          controls measured three things, which is more useful than a fourth
          control measuring a fourth.
    quantifier_order: >-
      THE CLAIM IS -- FOR the three completed controls, THERE EXISTS a single
      exponent beta such that each control's lift probability follows the
      declared functional form with that beta. The dangerous weaker reading,
      NOT claimed -- FOR EACH control THERE EXISTS an exponent, which is
      trivially true and is what a pooled fit would silently degrade into if
      homogeneity were assumed rather than tested.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most -- "across the three completed controls' retained census data,
        spanning [k] distinct sizes, the per-control exponents [did / did not]
        pass a pre-declared homogeneity test, and the pooled exponent is
        [value] with interval [interval], which [excludes / contains]
        RQ-XEDN-001's declared threshold, over those coefficient windows only."
        It can NEVER certify a lift-probability exponent for the surface family
        at large, at any size not present in the retained data, or at any
        cryptographic scale, and it produces no new evidence -- only a fit over
        existing evidence.
      nearby_object_control: >-
        The planted-section control already recorded in the lane, which must be
        RECOVERED in the pooled data. A pipeline that cannot recover a planted
        lift it knows is present cannot be trusted to measure the rate of ones
        it does not know about.
    proof_obligations:
      - claim: >-
          The retained per-cell lift counts reproduce the summary values in the
          three goals' own evidence records exactly.
        responsibility: baseline
      - claim: >-
          The heterogeneity test rejects a synthetically injected known
          heterogeneity at the declared significance level.
        responsibility: interface
      - claim: >-
          The planted-section control is recovered in the pooled data.
        responsibility: interface
      - claim: >-
          The number of distinct sizes spanned is reported and gates the fit
          independently of the interval.
        responsibility: strictness
      - claim: >-
          Nothing transfers beyond the three tested coefficient windows and the
          sizes actually present.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. No algorithm is proposed and no attack exponent is
    claimed. The "exponent" here is the decay exponent of a lift probability
    inside a toy census, not a complexity exponent, and conflating the two
    would be a category error. The incumbent for lifting-based attacks remains
    the classical xedni collapse result, which this record compares against and
    does not challenge.

  heuristic_assumptions:
    - id: HEUR-XEDN-POOL-1
      formal_statement: >-
        The census designs of GOAL-XEDN-001, -002 and -003 estimate the same
        lift-probability quantity as a function of size, so their per-control
        exponents are estimates of one parameter and may be pooled.
      random_model_justification: >-
        The rigorous ingredient is that all three sample sections on rational
        elliptic surfaces under the same lifting definition. THE GAP, STATED --
        each deliberately varies a different coefficient window, and if the
        exponent depends on the window the three estimate different quantities
        and pooling is invalid. This is a genuine heuristic and is the record's
        principal risk.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-31e76e]
      falsification_condition: >-
        The pre-declared heterogeneity statistic rejects homogeneity at the
        declared level, on a test shown by the injection control to be capable
        of rejecting.
    - id: HEUR-XEDN-POOL-2
      formal_statement: >-
        The declared functional form for the lift probability as a function of
        size is the form the three controls' data were generated under, so a
        fitted exponent is a parameter of that form rather than a local slope.
      random_model_justification: >-
        NOT ESTABLISHED and recorded as a weakness rather than papered over. A
        power-law fit over three sizes cannot distinguish a power law from
        several other decaying forms, and the fitted exponent's meaning is
        conditional on the form being right.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-31e76e]
      falsification_condition: >-
        The residuals of the pooled fit show systematic structure in size at
        the declared tolerance, indicating the form is wrong; the exponent is
        then not interpretable and only the per-cell rates may be reported.

  predictions:
    - metric: >-
        R1 -- retention_verdict -- whether per-surface raw census data for each
        of the three completed goals is retained and reachable, with the exact
        paths recorded
      direction: different
      minimum_effect: >-
        Reported per goal as reachable-at-per-surface-granularity,
        reachable-summary-only, or unreachable, with paths. Anything other than
        all three reachable at per-surface granularity means the fit cannot
        proceed as designed and the deliverable is the retention audit.
    - metric: >-
        R2 -- count_reproduction -- exact integer agreement between per-cell
        lift counts re-extracted in harness and the summary values recorded in
        the three goals' evidence records
      direction: different
      minimum_effect: >-
        EXACT agreement on every cell. A single disagreement means the refit is
        reading a different archive from the one the lane's conclusions rest
        on, and blocks everything downstream until located.
    - metric: >-
        P1 -- per_control_exponents -- three fitted exponents with 95 percent
        confidence intervals and standard errors, one per completed control
      direction: different
      minimum_effect: >-
        Reported with intervals. The parent proposal's own prior is that these
        may well DISAGREE, and a disagreement is a finding about what the three
        controls measured.
    - metric: >-
        P2 -- heterogeneity_statistic -- the pre-declared heterogeneity
        statistic across the three per-control exponents, with its p-value at
        the pre-declared level
      direction: lower
      minimum_effect: >-
        Fails to reject homogeneity, ON A TEST THAT P3 SHOWS CAN REJECT.
        Rejection means pooling is invalid; the pooled fit is not computed and
        the lane learns its three controls measured three things.
    - metric: >-
        P3 -- injection_control_rejection -- whether the identical
        heterogeneity machinery REJECTS a synthetic input in which two of the
        three exponents are deliberately displaced by a declared amount, at the
        declared standard errors
      direction: higher
      minimum_effect: >-
        MUST REJECT. If it does not, the heterogeneity test has no power at
        this data's precision, "the exponents agree" is uninformative, and part
        P is UNDECIDABLE from this data. This control is blocking.
    - metric: >-
        P4 -- planted_recovery -- whether the lane's already-recorded
        planted-section control is recovered in the pooled data
      direction: higher
      minimum_effect: >-
        RECOVERED. Failure means the pooling pipeline loses a signal it was
        given, and no rate it reports is admissible.
    - metric: >-
        F1 -- distinct_size_count -- the number of DISTINCT sizes the pooled
        data actually spans
      direction: higher
      minimum_effect: >-
        AT LEAST 3. Fewer than 3 means the lane's phase-two gate is NOT met on
        this data however tight the interval, and this is reported
        independently of F2.
    - metric: >-
        F2 -- pooled_exponent -- the pooled fitted exponent with its 95 percent
        confidence interval, and whether that interval excludes RQ-XEDN-001's
        declared phase-two threshold read verbatim from that record
      direction: different
      minimum_effect: >-
        Reported with its interval, its distinct-size count, and the selection
        statement. Exclusion or containment of the threshold are BOTH complete
        answers; neither is the hoped-for one.

  test_boundary:
    instances:
      - >-
        The retained raw census data of GOAL-XEDN-001, GOAL-XEDN-002 and
        GOAL-XEDN-003, at per-surface granularity, reached through their
        committed goal records and experiment run artifacts.
      - >-
        The planted-section control already recorded in the lane.
      - >-
        A synthetic injection dataset with two exponents deliberately displaced
        by a declared amount at the measured standard errors.
      - >-
        OUT OF SCOPE -- any new census run, any surface family or coefficient
        window not present in the three completed goals, any prime not already
        censused, and anything at cryptographic scale.
    parameters:
      goals: [GOAL-XEDN-001, GOAL-XEDN-002, GOAL-XEDN-003]
      fit_form: declared before any per-control exponent is computed
      heterogeneity_level: declared before any per-control exponent is computed
      minimum_distinct_sizes: 3
      injection_displacement: declared before the run
    implementation: experiments/EXP-XEDN-31e76e
    budget:
      stage0_wall_clock_seconds: 600
      stage1_wall_clock_seconds: 900
      stage2_wall_clock_seconds: 900
      maximum_memory_gb: 2
      maximum_runs: 4

  distinguishable_outcomes:
    - outcome: >-
        R1 all reachable, R2 exact, P3 rejects the injection, P4 recovers the
        planted control, P2 fails to reject, F1 >= 3, and F2's interval
        EXCLUDES the declared threshold.
      means: >-
        The lane's declared phase-two gate resolves on data already paid for,
        and the exponent is inconsistent with the threshold over the three
        tested coefficient windows. No fourth control is needed for this
        question. The result is scoped to those windows and to the sizes
        actually present, and the survivorship selection is reported with it.
    - outcome: >-
        Same as above except F2's interval CONTAINS the declared threshold.
      means: >-
        The gate resolves in the other direction -- the pooled exponent is
        consistent with the threshold over the tested windows. Equally a
        complete answer, and it is the answer the design must be equally
        willing to report.
    - outcome: >-
        P2 rejects homogeneity, on a test P3 shows can reject.
      means: >-
        POOLING IS INVALID. The pooled fit is NOT computed. The finding is that
        the three completed controls did not measure one quantity, which
        changes what their individual conclusions can be read as supporting and
        is more valuable than a fourth control.
    - outcome: >-
        P3 fails to reject the injected heterogeneity.
      means: >-
        The heterogeneity test has no power at this data's precision. Part P is
        UNDECIDABLE from this data; a "pass" of P2 would have been
        uninformative and must not be reported as agreement. The deliverable is
        the power analysis.
    - outcome: >-
        F1 < 3 distinct sizes.
      means: >-
        The lane's phase-two gate is NOT met on this data, whatever the
        interval. A fit over two sizes is a line through two points. A fourth
        control at a NEW size is then genuinely required and the deliverable
        names the sizes it would have to add.
    - outcome: >-
        R1 shows summary-only or unreachable data for any goal, or R2
        disagrees.
      means: >-
        The fit is impossible from existing data, or the archive being read is
        not the archive the lane's conclusions rest on. Either is a documented
        state of the archive and is NOT evidence about the exponent in any
        direction.

  falsification_conditions:
    - >-
      F-A -- the per-control exponents disagree beyond their intervals and the
      pre-declared heterogeneity statistic rejects, on a test P3 shows can
      reject. Part P of the hypothesis is FALSE; pooling is invalid and no
      pooled number is produced.
    - >-
      F-B -- raw census data is not retained at per-surface granularity for one
      or more goals. Part R is FALSE; the fit is impossible from existing data
      and a fourth control is genuinely required.
    - >-
      F-C -- the pooled fit spans fewer than three distinct sizes. Part F is
      FALSE; the gate is not met on this data.
    - >-
      F-D -- the injection control fails to reject. The homogeneity verdict is
      uninformative and part P is undecidable; no agreement may be claimed.
    - >-
      F-E -- the planted-section control is not recovered in the pooled data.
      No rate the pipeline reports is admissible.
    - >-
      F-F -- the count reproduction disagrees with the goals' own evidence
      records on any cell. Everything downstream is blocked until located.
    - >-
      F-G -- the pooled fit's residuals show systematic structure in size at
      the declared tolerance. HEUR-XEDN-POOL-2 fails, the exponent is not
      interpretable, and only per-cell rates may be reported.

  interpretation_limits:
    - >-
      This is a FIT OVER EXISTING DATA. No new evidence is generated, and the
      resulting number inherits every limitation of the three completed goals
      that produced it.
    - >-
      Scoped to the three controls' coefficient windows and to the sizes
      actually present in their retained data. A fit meeting the gate resolves
      the lane's phase-two question ONLY within those windows.
    - >-
      SURVIVORSHIP IS NOT CORRECTED FOR. The three goals may have completed
      precisely because their windows behaved. The selection is reported with
      every fit and no pooled number may be read as a statement about the
      surface family at large.
    - >-
      CLAIM TIER toy and no downstream citation may raise it. No attack, no
      exponent in the complexity sense, and no cryptographic-scale statement is
      available from any outcome.
    - >-
      A retention failure or a heterogeneity rejection is a fact about the
      archive or about the three designs. Neither is evidence about the value
      of the lift-probability exponent in any direction.

  prior_evidence_refs:
    - ledger/proposals/IDEA-20260815-8f5ae8.yaml
    - ledger/questions/RQ-XEDN-001.yaml
    - ledger/goals/GOAL-XEDN-001.yaml
    - ledger/goals/GOAL-XEDN-002.yaml
    - ledger/goals/GOAL-XEDN-003.yaml
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md

  status: proposed
  proposed_by: coordinator
