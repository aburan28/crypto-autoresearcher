      nearby_object_control: >-
        Equal degrees at p = 13, and an integer genus at ell = 2.
    proof_obligations:
      - claim: The cubes in F_13 are 1, 5, 8 and 12, in three cosets of size 4.
        responsibility: correctness
      - claim: The membership degree is 4 and the cover degree is 3.
