  title: >-
    At p = 13 and ell = 3 the membership degree is 4 and the cover
    degree is 3.
  statement: >-
    In F_13 the cubes are 1, 5, 8 and 12. There are three cosets,
    each of size 4. The membership degree (13-1)/3 is 4 and the
    cover degree is 3, so the two degrees are unequal. At p = 17
    and ell = 4 there are four cosets of size 4, and the two
    degrees are both 4. The genus numerator 3 ell - 1 is 8, 14
    and 20 at ell = 3, 5 and 7, and 5 at ell = 2, which is not
    even. The ceiling 8/1024 is strictly below 0.01 and strictly
    above 0.0078. The ceiling 20/128 is strictly below 0.16 and
    strictly above 0.156.
  mechanism: >-
    The proposal separates a high-degree membership predicate from
    a degree-ell cover. This contract counts the cosets and the
    genus numerators. It does not solve a summation system.
