  falsification_conditions:
    - informative_gain nonzero at any cell whose three per-instance checks all pass.
    - raw_gain near zero, meaning the appended rows are duplicates rather than shifts.
    - The planted positive reports informative_gain equal to 0; the instrument cannot detect new information.
    - The wrong-weight null shows no decay in the correct-fold fraction.
    - The size-27 fixture does not reproduce the committed integers.
    - >-
      The relations-needed ratio against the size-matched generic base exceeds 0.5, refuting
      HEUR-L5-2 and the predicted factor-three saving.
  interpretation_limits:
    - >-
      THE LINEAR-ALGEBRA STAGE IS NOT THE DOMINANT COST OF PRIME-FIELD INDEX CALCULUS - RELATION
      COLLECTION IS. This program's own prior measurements put the linear-algebra share at a small
      percentage of the charged total at every tested size, so a factor-nine improvement there is a
      sub-percent improvement on the total. Every number here must be read against that ceiling, and
      no reading of it may present a linear-algebra result as an attack improvement.
    - >-
      Toy tier only. Claim tier is capped at toy and nothing extends to a standardized parameter set.
    - >-
      A confirmed informative_gain of 0 is a SCOPE CORRECTION on how this lane measures progress. It
      does not reject the lane's prior hypothesis, does not restore it, and moves no hypothesis
      status - only the Coordinator does that, on a committed decision.
    - >-
      Nothing here interacts with the generic-group lower bound. That bounds generic algorithms; this
      is an exact rank identity about a specific matrix. Neither implies the other.
    - >-
      The matched random null showing the SAME collapse is a calibration, not a disappointment, and
      it fixes exactly what may be concluded from a zero - that the operator forces it, not that the
      curve does.
