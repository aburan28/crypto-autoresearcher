hypothesis:
  id: H-EQLA-37b3e2
  question_id: RQ-EQLA-0d3f40
  derived_from_idea: IDEA-20260807-0e4d83
  added: '2026-08-25'
  statement: >-
    On a prime-field curve with j-invariant 0 carrying the order-3 automorphism phi, with G of prime
    order N generated by P and a factor base that is a union of COMPLETE phi-orbits, let sigma be the
    index permutation induced by phi and let lambda be the root of the quadratic L^2 + L + 1 modulo N
    that matches phi's action on G. Then the unknown logarithm vector lies in the subspace V_lambda
    of vectors satisfying v at sigma(i) equals lambda times v at i, whose dimension is exactly one
    third of the factor-base size; and for EVERY relation row r, the phi-shifted row r-sigma acts on
    V_lambda as exactly lambda times r. CONSEQUENTLY the shifted rows raise the ordinary rank of the
    relation matrix but raise the rank RESTRICTED TO V_lambda by exactly zero, always, for every row,
    every curve, every factor base and every arity.
    THREE MEASURABLE CLAIMS FOLLOW, and the record stands or falls on them jointly.
    (1) informative_gain, the rank of the folded closed matrix minus the rank of the folded base
    matrix, is EXACTLY 0 at every cell - not small, zero.
    (2) raw_gain, the same difference on the UNFOLDED matrices, is approximately twice the number of
    base rows, which is the exact size of the rank illusion that unfolded progress metrics report.
    (3) The number of base relations needed for the folded matrix to reach full rank is about one
    third of the number a size-matched generic factor base needs, which is the only one of the three
    that depends on a heuristic and the only one whose failure would be a finding about relation
    COLLECTION rather than about the linear algebra.
    THE CEILING IS PART OF THE CLAIM. The linear-algebra stage is a small percentage of the charged
    total cost of prime-field index calculus in this program's own measurements, so a factor-nine
    improvement there is a sub-percent improvement on the total. No attack claim, no exponent claim,
    and no cost claim beyond that ceiling is made or licensed.
  mechanism: >-
    phi acts on the prime-order group G as multiplication by a scalar lambda satisfying
    lambda^2 + lambda + 1 = 0 modulo N, so the logarithm of phi of a factor-base element is lambda
    times the logarithm of that element. That constrains the unknown vector to V_lambda, whose
    dimension is one third of the factor-base size because sigma has order 3 with all orbits of
    length 3. Now take any relation row r and its shift. Pairing the shifted row with any v in
    V_lambda gives the sum over i of r_i times v at sigma(i), which by the constraint equals lambda
    times the sum of r_i times v_i. So on V_lambda the shifted row is a scalar multiple of the
    original - a different vector in the ambient space, generically raising the ambient rank by one,
    but contributing nothing to the rank of the system that actually determines the unknowns.
    The folded row, defined as the alternating-weight sum of the row's values along each sigma-orbit
    with weights the powers of lambda, is precisely the coordinate expression of restriction to
    V_lambda; folding therefore commutes with shifting up to the scalar lambda, which is the identity
    the whole record rests on. Because the argument quantifies over ALL rows, it applies equally to a
    matched random sigma-closed matrix, which is why the matched random null must show the same
    collapse and why a collapse observed without that null could not be attributed to the curve.
    The load-bearing null is instead the FOLDING WEIGHT - folding with a weight mu whose cube is not
    1 projects onto the wrong eigenspace and destroys the redundancy, so informative_gain must climb
    back toward its unfolded value as the fraction of correctly folded orbits falls.
  assumptions:
    - >-
      N is prime, greater than 3, and lambda has multiplicative order exactly 3 modulo N. Both are
      checked per instance rather than assumed; lambda's order forces 3 to divide N - 1, which is
      what makes the isotypic split total over the field of N elements. A failing instance is
      excluded and the exclusion is recorded.
    - >-
      The factor base is a union of COMPLETE phi-orbits with no truncation, so its size is divisible
      by 3 by construction. Complete-orbit membership is ASSERTED per instance rather than assumed,
      because a truncating slice in the committed harness is a documented source of exactly this
      failure.
    - >-
      The chosen lift of each x-coordinate is consistent with phi. For j-invariant 0, phi preserves
      the y-coordinate, so the natural lift convention is automatically consistent and sigma is an
      unsigned permutation. This is a fact about j-invariant 0 only and must NOT be carried to
      j-invariant 1728, where the sign is forced to be negative around each orbit.
    - >-
      Relation rows carry a RIGHT-HAND SIDE - the target's coefficient. The committed harness is
      recorded as building bare incidence vectors with no right-hand side and assembling no linear
      system, so this experiment requires a driver change, declared here rather than discovered
      later. Without it, "rank" is the rank of an incidence matrix and not of a linear system.
    - id: HEUR-L5-2
      formal_statement: >-
        The number of base relations required for the folded matrix to reach full rank, namely one
        third of the factor-base size, exceeds that dimension by only a constant - i.e. harvested
        relations behave, after folding, like uniformly random vectors of their weight in the folded
        space.
      rigorous_support: >-
        This IMITATES the classical statement that a random sparse matrix over a finite field with
        row weight at least 3 attains full rank after n plus a constant rows with probability bounded
        away from zero, the rank-defect distribution having its mass at zero given by the standard
        infinite product. It is NOT a theorem here, because relation rows are supports of
        decompositions and are not uniform.
      validation_experiment_ids: [EXP-EQLA-2f2cca]
      falsification_condition: >-
        The measured ratio of relations needed by the phi-stable base to relations needed by the
        size-matched generic base exceeds 0.5. The folded rows are then not behaving like independent
        relations and the predicted factor-three saving is not realised.
  test_boundary:
    instances: >-
      Toy prime-field curves with j-invariant 0 at roughly 12 to 32 field bits, with N at most about
      20 bits, generated by the committed instance generator; plus the frozen regression fixture at
      factor-base size 27 from the lane's committed prior experiment.
    parameters: >-
      At least three factor-base sizes spanning an order of magnitude, each divisible by 3; the
      correct-fold fraction swept over at least five values from 0 to 1; a size-matched generic
      (non-phi-stable) factor base of the same size on the same curve with the same arity and harvest
      budget; matched Pollard rho with negation and matched baseline group-operation counts on the
      same instances for the Pareto row.
    implementation: >-
      Rank computations over the field of N elements on both the ambient and the folded matrices,
      with the fold applied ONCE before any solve; the factor base and the final row list content-
      hashed per cell.
    out_of_scope: >-
      Relation-collection cost and density, arity effects on supply, curves with j-invariant other
      than 0, any crypto-scale statement, and any claim about the ECDLP's cost.
  distinguishable_outcomes:
    - outcome: >-
        The size-27 fixture reproduces the committed integers exactly; informative_gain is exactly 0
        at every cell on both the curve arm and the matched random null; the wrong-weight null shows
        a MONOTONE decay in the correct-fold fraction from roughly twice the base-row count down to
        exactly 0; the planted positive shows informative_gain strictly greater than 0; and raw_gain
        is at least one and a half times the base-row count.
      means: >-
        The rank identity is confirmed operationally with a calibrated instrument. The lane's
        unfolded progress metrics are measuring an object with no bearing on the unknowns, and the
        correct progress meter is the folded rank. This is a SCOPE CORRECTION on how the lane
        measures progress. It moves no hypothesis status by itself and it is not an attack result.
    - outcome: >-
        All of the above holds, but the measured ratio of relations needed by the phi-stable base to
        the size-matched generic base EXCEEDS 0.5.
      means: >-
        HEUR-L5-2 has FAILED. The folded rows do not behave like independent relations, the predicted
        factor-three saving in relations is not realised, and the finding is about relation
        COLLECTION rather than about the rank identity. The first two claims survive; the third does
        not, and it is reported as refuted.
    - outcome: >-
        informative_gain is nonzero at some cell where lambda's order is verified 3, the factor base
        is verified to be a union of complete orbits, and sigma cubed is verified to be the identity.
      means: >-
        The identity is FALSE AS IMPLEMENTED. This is a bug locator, not a discovery, and the three
        named causes are checked in order - factor-base truncation, the wrong root of the quadratic,
        and a lift convention inconsistent with phi. The record is superseded rather than amended if
        no implementation cause is found.
    - outcome: >-
        raw_gain is also near zero.
      means: >-
        The appended rows are duplicates rather than genuine shifts, so the collection rule is what is
        being measured and nothing about phi is established in either direction. The comparison the
        experiment exists to make was not made.
    - outcome: >-
        The planted positive reports informative_gain equal to 0.
      means: >-
        The instrument cannot detect new information. Every zero it produced is void and the run set
        is INVALID, not negative.
    - outcome: >-
        The wrong-weight null shows no decay as the correct-fold fraction rises.
      means: >-
        Canonical artifact tell - the statistic does not respond to the parameter that must change
        it. The measurement is void.
    - outcome: >-
        The size-27 fixture does not reproduce the committed integers.
      means: >-
        Instrument incomparability. Halt and report as an INFRASTRUCTURE outcome under AGENTS.md
        rule 5, never as mathematical evidence.
