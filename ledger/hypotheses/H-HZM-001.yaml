hypothesis:
  id: H-HZM-001
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260723-002
  statement: >-
    The published defect-scaled hyperplane-signature zero-minor ECDLP route
    survives the GOAL-CRYPTO-001 sub-rho cost gate: under its own pinned
    published formulas (success law q(N,L,d) = 1-(1-1/N)^M, candidate
    completions M = binom(L+d, d), explicit signature enumeration
    H = binom(L+d, d-1) = M*d/(L+1)), its fully charged expected work per
    solved target is strictly below the frozen Pollard-rho comparison bound
    ceil(N^(1/2)), and its toy-scale defect-signature enumeration realizes
    the pinned candidate/signature counts within a pre-declared factor of 2
    at every tested (L, d) size. The prior static audit
    (TASK-20260723-301, independently red-teamed in TASK-20260723-303)
    conditionally expects the opposite -- H/q >= N*d/(L+1) = N^(1-o(1)) for
    every d >= 1 -- so the expected experimental outcome is falsification
    of gate survival; both outcomes remain decidable from the frozen
    metrics.
  mechanism: >-
    External mechanism (published prior art, not a mechanism of this
    program): from O(log N) public sampled curve points, form the
    Riemann-Roch evaluation matrix and its left kernel; after one
    dimension-halving restriction, a defect-d choice determines a
    d-dimensional intersection space; remaining columns induce d-coordinate
    hyperplane signatures; duplicate normalized penultimate-intersection
    signatures certify a central subarrangement, hence a zero minor and a
    directly verifiable scalar relation. This is the zero-minor line of
    Mahalanobis-Mallick-Abdullah, "A Las Vegas algorithm to solve the
    elliptic curve discrete logarithm problem", INDOCRYPT 2018, IACR ePrint
    2018/134, and Abdullah-Mahalanobis, "Minors solve the elliptic curve
    discrete logarithm problem", arXiv:2310.04132 (cited in the 2026
    manuscript as the Experimental Mathematics 2025 publication "A zero
    minor solves the elliptic curve discrete logarithm problem"); the
    defect-scaled formulation and the displayed q/M/H formulas are pinned
    to Mahalanobis, "A Guess and Determine Attack on the Elliptic Curve
    Discrete Logarithm Problem", arXiv:2607.09814v1 (2026), as quoted in
    the immutable snapshot
    coordination/goals/GOAL-CRYPTO-001/batches/BATCH-003/tasks/TASK-20260723-301/candidate_report.yaml.
    The external publications present the route as an ECDLP algorithm; that
    external claim is recorded here and is NOT adopted as an asymptotic
    claim of this program (asymptotic_claim is null). The route is
    representation-distinct from the failed compact z_R interface (internal
    route OBL-ZR-COMPACT-CONSTRUCTOR-001 per the TASK-20260723-301
    deduplication record) but retains the relation-locator burden: its
    explicit signature enumeration is the charged bottleneck this
    hypothesis measures.
  assumptions:
    - N is the order of an abstract prime-order ordinary prime-field elliptic-curve family and L = Theta(log N); no standardized curve is instantiated.
    - The pinned q/M/H formulas are treated as a hypothesis to audit, not as an established asymptotic theorem; the alignment stage records exact manuscript equation anchors or classifies the outcome inconclusive_misalignment (RT303-O3).
    - Constructing or examining one distinct normalized signature costs at least one field operation or memory access; Gray-code and rank-one updates may reduce polylogarithmic factors but do not erase entries.
    - Base-field and elliptic-curve group operations have poly(log N) bit cost, so polylogarithmic conversion factors do not change the compared N-exponents.
    - The zero-minor-to-scalar certificate and all rank/general-position premises are reverified exactly, never inferred from a hash collision.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For one outer trial exposing M candidate completions, the
        probability that at least one zero minor occurs is
        q(N,L,d) = 1-(1-1/N)^M <= min(1, M/N): the M completions behave,
        for zero-minor occupancy, like M independent uniform draws into N
        bins.
      random_model_justification: >-
        Absent a proved elliptic central-subarrangement bias, the
        arrangement induced by a generic evaluation matrix is modeled as
        random; this is the pinned manuscript's displayed occupancy model,
        audited here rather than assumed.
      supporting_results:
        - >-
          Displayed success law of the pinned manuscript (Mahalanobis,
          arXiv:2607.09814v1, 2026), as quoted in the immutable
          TASK-20260723-301 candidate_report.yaml.
      validation_experiment_ids: [EXP-HZM-001]
      falsification_condition: >-
        Measured per-trial zero-minor hit counts deviate systematically
        from the pinned occupancy law beyond the declared factor across the
        tested grid, or a proved superuniform elliptic bias ratio qN/M is
        exhibited; the first misaligns the audit premise, the second would
        reopen the gate and is recorded, not silently discarded.
  predictions:
    - metric: candidate_completion_count_ratio
      direction: different
      minimum_effect: measured completions divided by binom(L+d,d) within [1/2, 2] at every tested (L,d) config
    - metric: signature_enumeration_count_ratio
      direction: different
      minimum_effect: measured signatures processed divided by binom(L+d,d-1) within [1/2, 2] at every tested (L,d) config (9 configs across 3 L sizes)
    - metric: charged_expected_work_vs_rho_bound
      direction: lower
      minimum_effect: >-
        charged expected per-target work strictly below ceil(N^(1/2))
        group-operation-equivalents at BOTH primary gate sizes (L,d) in
        {(12,1), (16,1)} for gate survival; the prior audit expects >= at
        both, which is the falsification branch
    - metric: zero_minor_certificate_reverification_failures
      direction: lower
      minimum_effect: exactly 0 (every accepted duplicate reconstructs an exact zero minor and the final public group equality verifies)
    - metric: brute_force_control_zero_minor_discrepancies
      direction: lower
      minimum_effect: exactly 0 discrepancies between signature-search counts and direct brute-force minor evaluation on the control subset
  test_boundary:
    instances:
      - toy prime-field curves with 8-16 bit subgroup orders N, generated via harness/toycurve.py with recorded seeds
      - "(L,d) grid: L in {8, 12, 16} matched to instance bits, d in {1, 2, 3} (9 configs); primary cost gate at (12,1) and (16,1), the RT303-C2 d=1 boundary mutation"
      - "brute-force control subset: all d at L=8 plus d in {1,2} at L=12"
      - one fully parameterized published worked example from the pinned publications, exact source anchor recorded at execution
    parameters:
      formula_factor_tolerance: 2
      primary_gate_sizes: [[12, 1], [16, 1]]
      frozen_rho_bound: ceil(N^(1/2)) group-operation-equivalents per solved target
      seeds: [1, 2, 3]
    implementation: >-
      New module under experiments/EXP-HZM-001/ implementing the
      defect-scaled signature enumeration core (evaluation matrix, left
      kernel, defect-d restriction, signature construction, normalized
      duplicate search, zero-minor reconstruction, certificate
      reverification) on toy instances, plus a static-audit charged-cost
      ledger script; toy curves via harness/toycurve.py.
    budget:
      wall_clock_seconds_per_run: 1800
      total_wall_clock_seconds: 6300
      total_cpu_hours: 1.75
  falsification_conditions:
    - >-
      Charged expected operation-level work at either primary gate size
      (12,1) or (16,1) meets or exceeds the frozen Pollard-rho comparison
      bound ceil(N^(1/2)): the route is closed as non-sub-rho under its own
      published model (the prior audit's expected outcome).
    - >-
      Measured completion or signature counts deviate from the pinned
      formulas beyond the factor of 2 at any tested (L,d) config: the
      manuscript-alignment premise fails and the cost claim is recorded
      inconclusive_misalignment (per RT-20260723-303), not positive.
    - >-
      Any accepted duplicate signature fails exact zero-minor
      reconstruction or final group-equality reverification: a semantic
      failure of the route, independent of cost.
    - >-
      Any apparent gate survival is attained only through uncharged
      processors, target-dependent preprocessing, a supplied zero minor, a
      secret scalar in the search path, or an implicit zero-minor locator
      (RT303-O1): such a survival is void by construction.
  interpretation_limits:
    - Known external mechanism (novelty_status: known); no novelty, advantage, or breakthrough claim is made or implied by this record.
    - Toy-scale formula tracking validates only the count/cost correspondence at the tested sizes; it is not asymptotic validation and never crypto-tier evidence (AGENTS.md rule 7).
    - A gate survival at toy sizes triggers only independent theorem review of the pinned manuscript; it does not authorize implementation beyond toy scale, standardized-curve execution, or any solve claim.
    - A gate failure closes only this defect/signature interface, not all nonlinear zero-minor locators or all non-generic ECDLP representations (AGENTS.md rule 6).
    - The static audit conclusion is conditional on manuscript alignment; if the displayed formulas cannot be aligned to one trial/defect/stopping rule, the outcome is inconclusive_misalignment, neither a positive nor a negative cost result.
  status: approved
  proposed_by: coordinator
