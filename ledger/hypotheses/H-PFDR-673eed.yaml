hypothesis:
  id: H-PFDR-673eed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260808-24c61b
  batch_id: BATCH-2c45e2
  statement: >-
    THE REPRESENTATION TECHNIQUE FAILS FOR ECDLP AT THE FILTER AND NOT AT THE
    COUNTING, AND THAT LOCALISATION IS MEASURABLE. Write k in base B with
    m = log_B N digits, so that Q = sum_j [d_j B^{j-1}] P is a subset-sum instance
    over the group with a known structured generator set and unknown digits. The
    Howgrave-Graham-Joux and Becker-Coron-Joux family beats meet-in-the-middle for
    integer knapsacks by enumerating only the elements congruent to a chosen
    residue on each side, which requires the TARGET RESIDUE. Three claims that can
    each fail independently.
    (S1 COUNTING IS INTACT) With an enlarged digit alphabet the representation
    multiplicity R - the number of ordered pairs (u, v) of alphabet-valid digit
    vectors with u + v congruent to k - matches the integer subset-sum
    representation count for the same alphabet enlargement, to within the exact
    finite combinatorial identity for digit carries. The representations exist and
    are plentiful.
    (S2 THE FILTER IS THE WHOLE LOSS) If the residue k mod M is SUPPLIED FREE by
    an oracle, the fitted cost exponent of a guessed-residue HGJ implementation
    falls strictly below 1/2 as the filter modulus grows as M = N^mu; if the
    residue is CHARGED at its true cost of a factor M, the fitted exponent does
    not fall below 1/2 at any mu. The gap between those two fitted exponents is
    the exact price of the missing ingredient, measured rather than asserted.
    (S3 SCOPE) This closes one named algorithm family under one named obstruction.
    It is NOT a lower bound on ECDLP, NOT a statement about other non-generic
    methods, and NOT a generic-group argument - the representation technique is
    generic in the group and non-generic in the integer encoding, so the generic
    lower bound does not cover it and a separate reason is required, which is what
    S2 measures.
  mechanism: >-
    In integer subset-sum the target is a known integer, so the search space
    splits into M congruence classes whose sum must hit a known value; each side
    is enumerated at 1/M cost while the number of representations of the target
    grows combinatorially, and a sub-birthday exponent survives. In ECDLP the
    target is a known GROUP ELEMENT and an unknown integer. The class of an
    enumerated u is known because u is enumerated, but the required class of v is
    determined by k mod M, which is precisely the unknown, and N is prime so the
    group has no proper quotient in which to filter. The two halves therefore
    cannot be paired without paying the full birthday cost, and the family
    collapses to plain meet-in-the-middle. The discriminating measurement is that
    R is unaffected - the fibre over the target is nonempty and large and simply
    unaddressable - so the loss localises in the filter and not in the count.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE SOURCE IDEA'S MINIMAL TEST HAS A BAND OF WIDTH ZERO AND WAS WIDENED.
      The idea proposes a toy instance at N about 2^24 with guessed k mod M for M
      in {3, 5, 7}, and asks whether guessed-residue HGJ beats BSGS by the
      predicted factor divided by M. At N = 2^24 the BSGS baseline is about 2^12
      charged group operations, and a filter modulus of at most 7 can remove at
      most log2(7) = 2.8 bits from a 12-bit budget while the guess multiplies the
      work by exactly the same factor M. The predicted net movement is therefore
      1.00 by construction, and the measurement cannot separate a working filter
      from a broken one. That is the same failure as a factor-4 discriminator
      against a hypothesis that moves a statistic by a factor of 4.
    change_made: >-
      Two changes. First, the measured quantity is an EXPONENT fitted across
      instance sizes rather than a ratio at one size - e(mu) = log2(charged
      operations) / log2(N), fitted over N in {2^16, 2^20, 2^24, 2^28}, so a
      structural difference appears as a slope and not as a factor. Second, the
      filter modulus is swept as M = N^mu for mu in {0, 0.1, 0.2, 0.3}, reaching
      M of order 2^8 at N = 2^28, and the residue is run BOTH free and charged in
      the same run so the pair of exponents is measured under one implementation.
    alternative_hypothesis_range: >-
      Under H_filter - the filter is the sole obstruction - the free-residue
      exponent falls with mu and reaches at most 0.45 at mu = 0.3, while the
      charged exponent stays at or above 0.50 minus 0.02 for every mu, so the two
      curves separate by at least 0.05 in exponent, which at N = 2^28 is 1.4 bits
      and is resolvable against the measured run-to-run spread. Under H_count -
      the loss is in the representation count rather than the filter - the
      free-residue exponent does NOT fall, because supplying the residue buys
      nothing when there are no usable representations to filter. The two
      alternatives predict opposite behaviour of the same measured curve over a
      declared and reachable range.
  assumptions:
  - >-
    N is prime, the digit base B and arity m = log_B N are declared per cell, and
    the generator set of the powers of B times P is public.
  - >-
    Digit carries in the enlarged alphabet are handled exactly by the declared
    combinatorial identity. An implementation that ignores carries overcounts R
    and the overcount is the most likely way to get a wrong S1.
  - >-
    The oracle that supplies k mod M in the free-residue arm is an EXPERIMENTAL
    DEVICE with no counterpart in any attack. Its cost is zero by declaration in
    that arm and exactly M in the charged arm, and both arms are reported.
  - >-
    THE PROPAGATION-RIGIDITY THEOREM cited by the source idea as
    IDEA-20260806-c5d183 was NOT opened by TASK-20260904-5423ad. It is carried as
    a relayed pointer and is NOT load-bearing for any prediction below - every
    prediction is decided by measurement of R and of the fitted exponents, neither
    of which uses rigidity.
  proof_search_map:
    bottleneck: >-
      The modular filter that lets the representation technique enumerate a 1/M
      fraction of each half. Its removal is what would change the exponent, and
      its unavailability is what the record claims closes the family.
    baseline_embedding:
      parameter_slice: >-
        M = 1, no filter. The construction must reduce exactly to meet-in-the-
        middle with list size B^{m/2} = N^{1/2}, i.e. BSGS.
      reproduction_check: >-
        Symbolic reduction of the cost expression at M = 1 to N^{1/2}, PLUS a
        frozen regression fixture in which the implementation at M = 1 reproduces
        the harness BSGS charged operation count on the same instances to within
        the declared implementation overhead, recorded as a ratio.
    observation_collision:
      observable: >-
        The representation multiplicity R together with filter feasibility.
      distinct_preimage_search: >-
        PERFORMED BY DESIGN AND EXPECTED TO SUCCEED - the integer knapsack arm and
        the ECDLP arm are constructed to have the SAME R and different
        feasibility. That collision is not a defect; it is the instrument. It is
        what localises the obstruction in the filter rather than in the counting,
        and it is why the integer arm is a positive control rather than a
        curiosity.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The digit-representation encoding of k with an enlarged alphabet, turning
        ECDLP into a structured subset-sum instance over the group.
      predicted_gain: >-
        Would be a sub-birthday exponent if a compatible filter existed. The
        record predicts none exists and measures the price of its absence. NO
        GAIN IS CLAIMED.
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the addition map over the unknown target.
      predicted_gain: >-
        Shows the fibre is nonempty and large but unaddressable, which is exactly
        the S1-versus-S2 separation.
    quantifier_order: >-
      CLAIMED - FOR ALL M greater than 1 and FOR ALL filters computable from an
      enumerated integer alone, the pairing condition of the representation
      technique requires knowledge of k mod M. NEGATION SOUGHT AND PRE-REGISTERED
      - THERE EXISTS a filter computable from the group element alone that is
      additively compatible. Exhibiting one falsifies S2 and would require the
      exponent analysis to be redone for ECDLP, which the record states would be
      a major positive result rather than an inconvenience.
    method_ceiling:
      strongest_certifiable_claim: >-
        Closure of the HGJ and BCJ family for ECDLP under the stated obstruction,
        with the obstruction PRICED as the measured gap between the free-residue
        and charged-residue fitted exponents at the tested sizes. It can NEVER
        certify a lower bound on ECDLP, exclude an unmodelled algorithm, or say
        anything about deployed curves.
      nearby_object_control: >-
        DISCRETE LOGARITHM IN THE MULTIPLICATIVE GROUP OF A PRIME FIELD, where
        index calculus supplies exactly the missing filter - the smoothness of the
        integer lift - and the family does help. THE ARGUMENT MUST CORRECTLY
        SEPARATE THE TWO SETTINGS. An argument that closes the family in both has
        proved too much and is wrong somewhere unexamined.
    proof_obligations:
    - claim: The pairing condition requires the target residue.
      responsibility: correctness
    - claim: A prime-order group has no usable proper quotient.
      responsibility: scope
    - claim: The representation count R is unaffected by the group setting.
      responsibility: size
    - claim: The M = 1 slice reproduces the BSGS operation count.
      responsibility: baseline
    - claim: The free-residue and charged-residue exponents separate by at least 0.05.
      responsibility: strictness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      Prime-field ECDLP in a group of prime order N, as the target whose cost this
      family would improve if the missing ingredient existed.
    prior_best: 'N^{1/2} with a constant near 0.886 for parallel rho, memory O(1)'
    time_exponent: >-
      1/2, UNCHANGED. This record claims NO improvement. The exponent is recorded
      because the record's content is precisely that the family does not move it,
      and a null field here would hide that.
    memory_exponent: >-
      The family is memory-heavy by construction. Any variant claiming a time
      exponent below 1/2 must charge memory of order N^{0.29} to N^{0.5}, and the
      record predicts no such variant exists for ECDLP.
    hidden_cofactor: >-
      No o(1) claim. The residue-guess factor M is explicit and is charged in the
      charged arm; the free arm's zero charge is an experimental device and is
      labelled as one everywhere it appears.
    claim_kind: exponent_improvement
    claim_kind_note: >-
      The FAMILY under examination is of kind exponent_improvement in the integer
      setting. This record claims no improvement in the group setting and the
      predicted time_exponent is unchanged at 1/2.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR digit base B and arity m in the tested range, with the enlarged alphabet
      from -B to 2B exclusive, the number R of ordered pairs (u, v) of
      alphabet-valid digit vectors representing a fixed k is concentrated about
      its mean, and that mean matches the integer subset-sum representation count
      for the same alphabet enlargement once digit carries are accounted for
      exactly.
    random_model_justification: >-
      The rigorous ingredient is an exact finite combinatorial identity - the
      count of digit representations with carries - so the MEAN is not heuristic.
      What is heuristic is concentration about that mean across choices of k, for
      which the imitated model is the representation-count analysis for random
      knapsacks.
    supporting_results: []
    supporting_results_note: >-
      EMPTY. The source idea names Howgrave-Graham and Joux 2010 and Becker, Coron
      and Joux 2011 explicitly as recalled from memory and unread by this program.
      A recalled citation may not discharge this field under AGENTS.md rule 9, so
      it is left empty and the exact count is measured by enumeration instead.
    validation_experiment_ids:
    - EXP-PFDR-2ffdfa
    falsification_condition: >-
      Exact enumeration at m at most 12 and B at most 2^4 gives an R distribution
      whose minimum over sampled k is 0, or whose mean departs from the closed
      form by more than the exact carry correction. Either would break the family
      for a different reason than the filter and must be reported separately.
  structural_ingredients:
  - description: >-
      The representation technique for integer subset-sum, which attains an
      exponent near 0.291 rather than 0.5 by enumerating congruence classes on
      each side against a known target residue.
    citation: >-
      Howgrave-Graham and Joux, Eurocrypt 2010; Becker, Coron and Joux, Eurocrypt
      2011. NAMED FROM MEMORY BY THE SOURCE IDEA AND NOT OPENED BY THIS PROGRAM.
    provenance: recalled
    verified_by: null
    role: >-
      the family whose transport to the group setting is under examination; the
      exponent 0.291 is a pointer for the reviewer and is NOT relied on - the
      integer control arm measures the family's behaviour directly instead
  - description: >-
      The generic lower bound of order square root of the group order for generic
      algorithms, and the automorphism-quotient constants for rho.
    citation: KN-TECH-005, KN-TECH-018
    provenance: internal
    verified_by: >-
      Relayed from IDEA-20260808-24c61b source_refs; the two technique records
      were NOT opened by TASK-20260904-5423ad and this entry is marked relayed.
    role: >-
      records why the generic bound does not by itself cover this family, since
      the technique is non-generic in the integer encoding
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      representation multiplicity R, a count, on the ECDLP arm minus R on the
      matched integer subset-sum arm at identical (B, m, alphabet)
    direction: different
    minimum_effect: >-
      EXACTLY ZERO on every sampled instance. A nonzero difference means the two
      arms are not counting the same object and the localisation argument fails
      before it starts.
  - metric: >-
      fitted cost exponent e(mu) with the residue supplied free, dimensionless,
      equal to log2(charged group operations) divided by log2(N)
    direction: lower
    minimum_effect: >-
      At most 0.45 at mu = 0.3, with the fitted slope in mu strictly negative and
      its confidence interval excluding 0.
  - metric: >-
      fitted cost exponent e(mu) with the residue charged at its true cost factor
      M, dimensionless
    direction: different
    minimum_effect: >-
      At least 0.48 for every mu in the swept range. A charged exponent below 0.45
      at any mu falsifies S2 and is a pre-registered escalation, not a footnote.
  - metric: >-
      integer subset-sum positive control, fitted exponent at mu = 0.3 with a
      known target
    direction: lower
    minimum_effect: >-
      Materially below the ECDLP charged arm and consistent with the family
      helping in the integer setting. If the integer arm does NOT beat its own
      meet-in-the-middle baseline, the implementation does not reproduce the
      published family behaviour and NO ECDLP conclusion is admissible.
  test_boundary:
    instances:
    - >-
      Toy prime-order curve groups at N about 2^16, 2^20, 2^24 and 2^28, at least
      20 instances per size, each with a known scalar so that correctness is
      checkable.
    - >-
      Matched integer subset-sum instances with a KNOWN target at the identical
      (B, m, alphabet) - the curve-free positive control.
    - >-
      A matched discrete-logarithm instance in the multiplicative group of a prime
      field, as the proves-too-much nearby object.
    parameters:
      digit_bases: 'B declared per size so that m = log_B N lies in {8, 10, 12}'
      alphabet: 'enlarged from -B to 2B exclusive, with exact carry handling'
      filter_exponents: 'mu in {0, 0.1, 0.2, 0.3}, so M = ceil(N^mu)'
      residue_arms: 'free-oracle and charged, both run under one implementation'
    implementation: >-
      One implementation of the HGJ split used for BOTH the integer arm and the
      group arm, so that a difference between them cannot be an implementation
      difference. Group arithmetic charged in group-operation equivalents; integer
      arithmetic charged in the declared matched unit with the conversion recorded.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 12
      maximum_memory_gb: 16
      maximum_runs: 8
  falsification_conditions:
  - >-
    R differs between the ECDLP arm and the matched integer arm - the two arms are
    not counting the same object; the localisation instrument is broken and no
    conclusion follows.
  - >-
    The free-residue exponent does NOT fall below 0.48 at mu = 0.3 - the stated
    mechanism is wrong and the loss is somewhere other than the filter, most
    likely in the representation count; S2 is falsified.
  - >-
    The charged-residue exponent falls below 0.45 at some mu - a genuine
    sub-birthday exponent has been measured for a group instance and S2 is
    falsified in the direction that matters. PRE-REGISTERED HANDLING - work stops
    for an independent review-adversarial session before any record states the
    excess, and for review-breakthrough at maximum effort before any record calls
    it a break.
  - >-
    A filter computable from the group element alone and additively compatible is
    exhibited - S2 is falsified constructively and the exponent analysis must be
    redone for ECDLP.
  - >-
    The integer positive control fails to beat its own meet-in-the-middle
    baseline - the implementation does not reproduce the family and the run is
    INVALID in both arms.
  interpretation_limits:
  - >-
    A confirmed closure is a closure of ONE named algorithm family under ONE named
    obstruction at the tested toy sizes. It is not a lower bound and it does not
    speak to any other non-generic method.
  - >-
    The free-residue arm is an experimental device. Its exponent is NOT an attack
    cost and may never be quoted as one; it exists solely to price the missing
    ingredient by difference.
  - >-
    UNTESTABLE AT REACHABLE SCALE AND SAID PLAINLY. Claim B(iii) of the source
    idea - a bias in the base-B digit distribution of deployed ECDSA and ECDH
    scalars - IS NOT TESTABLE AT ANY SCALE BY ANY EXPERIMENT. Histogramming the
    digits of k requires knowing k, and k is exactly the secret that the public
    key hides; obtaining it for deployed keys is forbidden by RQ-ECDLP-002 and is
    the ECDLP itself. The nearest testable statement is an audit of scalars
    emitted by a NAMED PUBLIC RNG IMPLEMENTATION run locally, which is an
    implementation-quality finding about that implementation and carries no
    information about deployed keys. The contract tests only that narrower
    statement and the record does not shrink the original silently.
  - >-
    Toy sizes only. No statement about crypto-scale ECDLP is claimed and the
    fitted exponents are fitted over four sizes spanning 12 bits, which bounds
    their precision and is reported with them.
