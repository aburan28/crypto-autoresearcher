    which is 3 above 46. Seven squared is 13 below 62, and eight
    squared is 64, which is 2 above 62. The product of 9, 10, and 13
    is 1170. The product of 2, 3, and 2 is 12. Twenty minus 17 is 3,
    and 23 minus 20 is 3. Three times 20 minus 2 times 23 is 14.
    Twenty-three minus 17 is 6.
  mechanism: >-
