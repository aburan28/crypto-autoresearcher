    - Any gate G1', G2', G3', G4, G4-D, G4-R, G5, G6, G7, G-FIX, G-TAB, G-SRCH, G-CURVE, G-REL or P0X fails, so the build or the run is broken and nothing is read (never evidence against this hypothesis).
