  # ---------------------------------------------------------------------------
  statement: >-
    On prime-order ordinary curves E/F_p with log2 p in 20..32, generated by
    generate_prime_order_curve(bits, c, p_filter=subgroup_prime_filter([3, 4,
    5], 0.15)) with FRESH curve seeds c >= 10, with the
    crypto_autoresearcher.index_calculus mitm engine at m = 3, 4, 5, default
    table arity (m+1)//2, default |F| matched to the subgroup base and min_fill
    elimination: (B-rel, the NULL) for the coset (subgroup), Dickson and
    small_x bases, the relation-level structural excess
    kappa_rel(A, c, m) = C_A / C_R,
    where C_X is the number of DISTINCT, PROJECTIVELY NORMALISED, NONFORMAL
    relations of class c in {TT, TB, SS} summed over the curves of the 30-32
    bit band (TT and TB over the full table; SS among the first X_fix =
    20*isqrt(N) formally distinct search encodings), and C_R is the mean of
    the same count over three random bases matched in |F|, curve, targets and
    target seeds, does not exceed the threshold t* calibrated on the random
    arms' measured relation-level dispersion (family-wise one-sided 0.05 over
    the 21 declared family cells), with an in-design known-null arm (a fourth
    random base per family scored by the identical statistic and df) behaving
    as the calibrated null predicts, and a planted-relation arm being
    detected. Informative rank travels with every kappa_rel as a companion.
    The non-null alternative (a live non-generic relation source) is
    kappa_rel > 1 at a calibrated, replicated excursion with informative rank,
    which would be a lever CANDIDATE for review-breakthrough, never a result.
  statement_units_note: >-
    "Relation" means the class of the integer relation vector
    (c_1..c_|F|, kcoef, rhs) reduced mod N and scaled to be monic (first
    nonzero coordinate equal to 1, coordinates ordered base indices
    ascending, then kcoef, then rhs). The exact counting conventions CC-1 to
    CC-10 are in experiments/EXP-PFDR-011cd0/specification.yaml and were
    fixed before any data of that experiment existed.

  mechanism: >-
    Unchanged from H-PFDR-4765e4 (from IDEA-20260928-4e2be7): the mitm engine's
    table is the x-keyed signed h-fold sumset of the base and its search
    computes x(R_t - H - s F_j); every coincidence of two computed x-keys is a
    group identity (TT and TB homogeneous base-only rows; SS two-target rows).
    The structural question is whether an x-structured base produces a
    NON-GENERIC EXCESS OF DISTINCT RELATIONS. What changes is the unit. One
    distinct relation appears as M_r dependent pair coincidences (its
    splittings), with M_r = 3 for a generic TT relation at arity 2, 10 at
    arity 3, 3 for TB at arity 2, 4 at arity 3 (Lemma L2), and up to several
    hundred for SS two-target relations at m = 4, 5 (EV-PFDR-1faf10 OBS-3).
    A pair count is therefore a compound of the relation count (Lemma L1), and
    a pair-unit band with a pair-unit Poisson floor manufactures excursions
    on known-null arms (EV-PFDR-1faf10 OBS-6, CMP-3, CMP-4). The quantity
    that bears on the mechanism, the number of informative relations, is
    counted once per relation here.

  assumptions:
    - Every harvested row is a valid group identity, re-verified in process on an independent curve instance (as EXP-PFDR-1b78f7 IC-5), with a disjoint-code re-verification on a declared sample (EXP-PFDR-011cd0 G4-R).
    - The OBJ-5/F-J3-1 SS pair-counter defect is repaired in the build under test (DEC-20260929-bbb3a9 NA-7; EXP-PFDR-011cd0 EC-1) and the repair is gated by a regression that reproduces the defect on the old code.
    - Toy scale, 20..32 bits, generated curves, one engine.
    - >-
      Uniform model U (used by the lemmas): the base logs L_1..L_s are
      independent and uniform on Z/N, N prime. FactorBase.random draws x
      uniformly without repetition among x-coordinates of curve points; that
      it behaves like U for these counts is HEUR-2765d2-H4, not an assumption
      silently made.

  # ---------------------------------------------------------------------------
  # NA-6 folded in: the derivation that pair counts are not Poisson under the
  # uniform model itself.
  # ---------------------------------------------------------------------------
  lemmas:
    - id: L1
      title: Two moments of pair and relation counts for a FIXED stored set (TT, TB)
      status: proved
      status_note: >-
        Proved within the uniform model U, by the argument below (linearity
        and pairwise independence). Not yet checked by an independent reader;
        that check is a joint of EXP-PFDR-011cd0's post-run review. Until it
        is checked, this lemma is NOT relied on for any adverse transition,
        and it does not by itself change EV-PFDR-1faf10's proof_status
        (docs/claims-and-verification.md "Refutation artifacts": a derivation
        is labelled derivation, never "proved" in a decision, until checked).
      setting: >-
        N prime. Base F_1..F_s with logs L in (Z/N)^s, L uniform. V is a
        FIXED finite set of nonzero integer vectors (the formally distinct
        stored elements of one class: for TT the stored tails; for TB the
        stored tails together with the unit vectors e_b). For two elements
        u, w in V that are linearly independent mod N, their points coincide
        in x iff (u - w).L = 0 or (u + w).L = 0 (mod N); both hold only if
        u.L = w.L = 0, i.e. both points are the identity (the "null event",
        probability <= |V|/N; the engine stores no point at infinity). Map
        every signed pair (u, w, sigma) to the projective class r = [u - sigma
        w] in P((Z/N)^s); let RR be the set of classes hit and M_r the number
        of signed pairs mapped to r. Pairs with u, w dependent mod N coincide
        only on the null event and are excluded.
      claim: >-
        Outside the null event, the pair count is n_P = sum_{r in RR} M_r I_r
        and the distinct-relation count is R = sum_{r in RR} I_r, with I_r =
        1[v_r . L = 0]. Then E[n_P] = (1/N) sum_r M_r; Var[n_P] = (1/N)(1 -
        1/N) sum_r M_r^2; E[R] = |RR|/N; Var[R] = (1/N)(1 - 1/N)|RR|. Hence
        the index of dispersion of the pair count is D_P = (1 - 1/N) sum_r
        M_r^2 / sum_r M_r, and of the relation count D_R = 1 - 1/N exactly.
      proof: >-
        (1) For v nonzero mod N, v.L is uniform on Z/N, because some v_i is
        nonzero and L_i is uniform and independent of the other coordinates;
        so P(I_r = 1) = 1/N. (2) Distinct projective classes r != r' have
        representatives v_r, v_r' that are not scalar multiples, hence
        linearly independent; the linear map L -> (v_r.L, v_r'.L) is onto
        (Z/N)^2, so the pushforward of the uniform law is uniform and I_r,
        I_r' are independent. (3) The moments follow from linearity of
        expectation and the vanishing of every covariance under pairwise
        independence. (4) Every x-coincident signed pair lies in exactly one
        class, by construction of the map, which gives the two sums.
      corollary_C1: >-
        Pair counts are not Poisson whenever some M_r >= 2 carries weight.
        D_P = (1 - 1/N) Mbar_w with Mbar_w = sum M_r^2 / sum M_r >= sum M_r /
        |RR| >= 1 (Cauchy-Schwarz), with equality iff every M_r = 1. A Poisson
        law needs D = 1. Lattice form: if every M_r equals one M >= 2, then
        n_P is a.s. a multiple of M outside the null event, so P(n_P = 1) = 0,
        while every Poisson law with positive mean gives it positive mass. For
        TT at arity 2 (generic relations only) D_P = 3(1 - 1/N); at arity 3,
        10(1 - 1/N). This is the derivation-tier reason that HEUR-4765e4-H1
        and HEUR-0cc7e8-H1, AS STATED for pair counts, fail on uniformly
        random bases by construction; consistent with the measured pair
        dispersions 2-6 (TT m 3) and 10-51 (TT m 5) in EV-PFDR-1faf10 OBS-3,
        which are cited as consistency, not as new evidence.
      corollary_C2: >-
        The relation count of a table class has D_R = 1 - 1/N under U, so a
        Poisson floor V >= C_R IN RELATION UNITS is model-consistent for TT
        and TB. Higher moments are not covered: distinct classes are pairwise
        but not mutually independent (the three relations of one size-3
        x-group are dependent), so L1 does not prove that R is Poisson. That
        shape statement is HEUR-2765d2-H1c.
    - id: L2
      title: Splitting multiplicity of a generic relation
      status: proved_under_stated_assumption
      status_note: >-
        Elementary counting. The assumption is about the engine's stored set
        (tails.py) and is validated, not assumed: EXP-PFDR-011cd0 reports the
        multiplicity histogram of every class (A6R), and EXP-PFDR-1b78f7's
        recount (red team 02_bundles; EV-PFDR-1faf10 OBS-3) showed TT m 3 max
        3 and TT m 5 multiplicity 10, consistent with the claim.
      assumption: >-
        The table stores exactly one representative of each +- pair of signed
        h-term sums over h distinct base indices (the stored-orientation rule
        s_1 = +1).
      claim: >-
        TT at arity h: a relation with exactly 2h nonzero coefficients, all
        +-1, on distinct indices, has M_r = C(2h, h)/2 (3 at h = 2, 10 at h =
        3): its signed pairs correspond to the unordered splits of its support
        into two h-subsets. TB at arity h: a relation with h + 1 such terms has
        M_r = h + 1 (3 at h = 2, 4 at h = 3): choose which term is the base
        element. Non-generic relations (repeated indices, coefficients +-2,
        partial cancellations) have other M_r, which the analysis computes per
        relation and never assumes.
    - id: L3
      title: The SS class
      status: sketch
      status_note: >-
        A sketch, not a proof. L1's computation applies verbatim to a FIXED
        recorded set of encodings R_t - A_e, with vectors over base and
        target coordinates. But the recorded set depends on L through the
        scan's early returns and through the X_fix truncation, so the fixed-set
        hypothesis fails. The sketch argues the dependence is weak because an
        early return is a decomposition event, rare per encoding. It is not
        relied on: the SS null is calibrated empirically (HEUR-2765d2-H5 and
        the known-null arm).

  # ---------------------------------------------------------------------------
  proof_search_map:
    bottleneck: >-
      The number of DISTINCT informative relations a fixed exposure yields
      (table classes: the full table; SS: X_fix formally distinct encodings).
      Under U its mean is fixed by L1 and its dispersion by L1/C2, so only a
      non-generic excess kappa_rel > 1 carrying informative rank moves it.
    baseline_embedding:
      parameter_slice: >-
        (i) harvest off: the engine without any harvest is the committed
        baseline; (ii) the matched random arms, for which kappa_rel = 1 by
        definition; (iii) the uniform model's first moment for the random
        arms.
      reproduction_check: >-
        Frozen fixtures, run before any census data (EXP-PFDR-011cd0): G1'
        reproduces every committed row of the six results/sweep-*.jsonl.gz
        files exactly with harvest off; G2' reproduces every solver column of
        the two min_fill files in passive census mode; P0X reproduces, with
        the new relation-recount code, the reviewed relation counts of
        EXP-PFDR-1b78f7's random arms (red team 02_bundles.jsonl, sign-only
        convention CC-1b) on every complete instance; G-FIX reproduces
        EXP-PFDR-1b78f7 census jobs with only the OBJ-5-attributable SS pair
        counts changed.
    observation_collision:
      observable: kappa_rel per (arm, class, m, band), with informative rank and R_star (distinct star-row relations) as mandatory companions
      distinct_preimage_search: >-
        Collisions searched and how each is separated. (1) Multiplicity vs
        relations: in pair units, more relations and more splittings per
        relation give the same excess (EV-PFDR-1faf10 CMP-4); the relation
        unit removes it. (2) Exposure vs structure: more encodings at a fixed
        attempt budget give more SS pairs (OBJ-4); a fixed X_fix of formally
        distinct encodings removes it. (3) Formal vs informative: known_log
        gives a huge raw relation count with zero information; formal
        subtraction and informative rank separate it (PC-1). (4) Dependent
        relations: a size-k x-group yields C(k, 2) distinct relations of rank
        k - 1; R_star and informative rank separate it (H3'). (5) A real excess
        of known size: the planted arm (PC-R) must be recovered relation by
        relation. Remaining collision, stated: an informative excess among
        homogeneous base-only relations (TT, TB) that does not help a solve
        would read as kappa_rel > 1 with rank; any candidate therefore goes to
        review-breakthrough with S_3-to-solution measured there, never read
        here as a speedup.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: pair counts -> projective relation classes (L1), where the null becomes an exact two-moment statement
        predicted_gain: removes the pair-unit miscalibration; D_R = 1 - 1/N for table classes
      - transform: observable_fiber
        proposed_object: fixed |F|, fixed exposure, varying base geometry, observable kappa_rel with rank
        predicted_gain: separates structure from multiplicity and exposure
    quantifier_order: >-
      Target (unchanged): THERE EXISTS an x-defined, target-independent base
      family {F_N}, membership testable in polylog(p), such that FOR ALL N in
      the range, kappa_rel_c(F_N) >= 1 + c N^delta (delta > 0) with
      informative rank >= 0.9 R_star. What this design can test: FOR EACH of
      the three named families and each declared (class, m), AT the 30-32 bit
      band, whether kappa_rel exceeds a calibrated threshold, and a calibrated
      upper bound when it does not. A non-detection is "no excess above X_rel
      at these N", never "for all N". Allowed dependencies: the base may
      depend on N through d | p - 1; t* depends on the design and the random
      arms only, never on a structured arm; X_fix depends on N only.
    method_ceiling:
      strongest_certifiable_claim: >-
        Per declared cell, a calibrated relation-level kappa estimate, a
        calibrated one-sided upper bound and the achieved detection limit
        X_rel at 30-32 bits, under a calibrated family-wise false-alarm rate,
        on these arms, this engine and these curves. It cannot certify delta,
        any asymptotic statement, any other base, or any N above 32 bits.
      nearby_object_control: >-
        Two-sided. (i) The known-null arm: a fourth random base per family,
        the closest object on which "excess" is FALSE, scored with the
        identical statistic and df; it must excurse only at the calibrated
        rate (PC-NULL). (ii) The planted arm: a random base with a declared
        number of planted relations, the closest object on which "excess" is
        TRUE with known size; it must be detected and its planted relations
        recovered exactly (PC-R). (iii) known_log (formal excess, zero
        information; PC-1).
    proof_obligations:
      - claim: L1 two-moment formula for fixed stored sets
        responsibility: success_probability
      - claim: L2 multiplicity of generic relations, under the stored-orientation assumption
        responsibility: size
      - claim: harvest-off reproduces every committed sweep row (G1')
        responsibility: baseline
      - claim: the repaired SS counter equals C(k', 2) on straddling groups and the old code does not (EC-1 test)
        responsibility: correctness
      - claim: in-process relation counts equal the analysis recount from retained rows (G-REL)
        responsibility: correctness
      - claim: every solve's (P, Q, k) re-verifies with code sharing nothing with the solver (G4-D)
        responsibility: correctness
      - claim: exposure is matched for SS (X_fix) and by |F| for TT/TB
        responsibility: scope
      - claim: TB at m = 4, 5 is excluded with a stated reason and screened for gross tails only
        responsibility: scope
      - claim: SS store and table memory reported per instance
        responsibility: memory
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim:
    problem: >-
      Relation-collection cost of the mitm index-calculus engine on E(F_p), in
      S_3 units. Not a claim about the best known ECDLP cost. Unchanged from
      H-PFDR-4765e4.
    prior_best: 'This engine: N^{max(h, m-h+1)/m} measured (0.75 at m = 4). ECDLP: Pollard rho 0.886 sqrt(N), O(1) memory.'
    time_exponent: >-
      Carried from H-PFDR-4765e4 as the motivating conditional only: a
      structural branch with kappa_rel ~ N^delta would move the exponent by
      delta/2. The exact form of that statement in H-PFDR-4765e4 is written
      against the IDEA-20260928-ce3ab0 floor, which is floor-relative; it is
      not restated, read or relied on here and waits on the TW-FLOOR round
      (DEC-20261001-709f0d).
    memory_exponent: 'Unchanged: N^{(1+beta)/2} for an SS store (not exercised at the fixed X_fix here); the mitm table N^{h/m}.'
    hidden_cofactor: Unchanged; toy-range fits include lower-order terms.
    claim_kind: exponent_improvement only on the structural branch, conditional on kappa_rel ~ N^delta; no generic claim is made by this record
    promotion_gates_note: >-
      No part of this may move toward supported without the four promotion
      gates. EXP-PFDR-011cd0 is a toy-scale heuristic validation and
      measurement (part of gate 2). Ceiling: analyzed.

  heuristic_assumptions:
    - id: HEUR-2765d2-H1a
      supersedes_part_of: HEUR-4765e4-H1 (its means)
      formal_statement: >-
        FIRST MOMENT. For a random base (FactorBase.random) of size s on a
        curve of order N, the expected PAIR count of each class equals the
        uniform-model mean within 10%: mu_TT = C(E', 2) 2/N, mu_TB = E' s 2/N
        (E' = formally distinct stored tails), mu_SS = C(X_fix, 2) 2/N among
        the first X_fix formally distinct encodings.
      random_model_justification: >-
        L1's first moment, exact under U by linearity for a fixed stored set;
        for SS, the fixed-set computation with the truncation dependence of
        L3 neglected.
      supporting_results: []
      supporting_results_note: L1 is internal and not yet independently checked, so it is not listed as a supporting result.
      validation_experiment_ids: [EXP-PFDR-011cd0]
      falsification_condition: >-
        For a (class, m), the ratio sum n_P / sum mu over the random arms
        r0..r2 of the 30-32 band has a 99% curve-cluster interval lying
        entirely outside [0.90, 1.10]. Refutes H1a for that (class, m) at the
        tested scale. (EV-PFDR-1faf10 OBS-12 recorded 0.80 for TB|3 and 0.91
        for TT|4 at A_fix in EXP-PFDR-1b78f7; this is a fresh test.)
    - id: HEUR-2765d2-H1b
      supersedes_part_of: HEUR-4765e4-H1 (its Poisson shape)
      formal_statement: >-
        COMPOUND LAW. On random bases the pair count is the compound of the
        relation count with the measured multiplicities: its dispersion
        equals L1's D_P computed with the observed multiplicity distribution
        M(class, m), within [0.8, 1.25].
      random_model_justification: L1 (exact for TT and TB under U); L3 sketch for SS.
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-011cd0]
      falsification_condition: >-
        For a (class, m), the 99% curve-cluster interval (>= 20000 bootstrap
        replicates, n/(n-1)-corrected) of D_P_hat / D_P_pred lies entirely
        outside [0.8, 1.25]. For TT and TB, where L1 is proved under U, a
        refutation implicates HEUR-2765d2-H4 or the instrument and is routed
        to the validity review before any reading.
    - id: HEUR-2765d2-H1c
      formal_statement: >-
        RELATION SHAPE. Random-base distinct-relation counts per instance
        have index of dispersion within [0.8, 1.25] for TT and TB (L1/C2
        predicts 1 - 1/N), and are approximately Poisson.
      random_model_justification: >-
        L1/C2 gives the second moment exactly under U; approximate Poisson
        shape is the rare-event limit, with the pairwise-but-not-mutual
        independence of C2 as the known gap.
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-011cd0]
      falsification_condition: >-
        For TT or TB at some m, the 99% interval of the pooled within-curve
        relation dispersion of r0..r2 lies outside [0.8, 1.25]; or the
        randomized-PIT KS of relation counts against Poisson(per-instance
        mean) rejects at 1% over the 30-32 band.
    - id: HEUR-2765d2-H2
      supersedes_part_of: HEUR-4765e4-H2 (restated in relation units)
      formal_statement: >-
        STRUCTURAL NULL. For subgroup, dickson and small_x bases with |F| ~
        N^{1/m} << sqrt(p), kappa_rel_c = 1 + O(N^{-1/2+eps}) for c in {TT,
        TB, SS}.
      random_model_justification: >-
        Unchanged from HEUR-4765e4-H2: complete mixed character sums of x(P),
        x(Q), x(P+Q) cancel because Hom(E, G_m) = 0 (recalled; supports
        nothing); the index-calculus regime is incomplete-sum territory
        outside the proven range (Shparlinski 2008, abstract retrieved).
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-011cd0]
      falsification_condition: >-
        A replicated calibrated excursion: some family cell with z > t* whose
        Stage R' replication on fresh curves has z_R > t_R, with informative
        rank (O-ALIVE-CANDIDATE of EXP-PFDR-011cd0), confirmed by
        review-breakthrough. A non-detection does not confirm H2; it bounds
        the excess per cell by X_rel.
    - id: HEUR-2765d2-H3
      supersedes_part_of: HEUR-4765e4-H3 (restated in relation units)
      formal_statement: >-
        RANK IN RELATION UNITS. On random and x-defined bases the informative
        rank of a class's rows before saturation is at least R_star / 1.05,
        where R_star is the number of distinct normalised star-row relations
        (CC-1 applied to star rows only).
      random_model_justification: >-
        Star rows of one x-group are linearly independent and span its pair
        relations; distinct generic relations are independent unless a
        small-rank coincidence occurs, which is rare under U when R_star <<
        U.
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-011cd0]
      falsification_condition: >-
        For a random arm and a (class, m) with >= 20 qualifying instances
        (R_star >= 10), the median of informative_rank / min(R_star, U) is
        below 0.95.
    - id: HEUR-2765d2-H4
      formal_statement: >-
        RANDOM BASE ~ U. FactorBase.random (uniform x without repetition among
        x-coordinates of curve points with y != 0) behaves as the uniform
        model U for the first two moments of the relation counts, and a
        fourth random base scored as structured (the known-null arm) is
        distributed as the calibrated null.
      random_model_justification: >-
        Sampling without repetition from N/2 x-values at s << sqrt(N) differs
        from iid sampling by O(s^2/N); the x-to-point lift is two-to-one and
        the stored orientation absorbs the sign.
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-011cd0]
      falsification_condition: PC-NULL fails (known-null excursions or the known-null z distribution inconsistent with the calibrated null at 1%), or H1c's TT/TB dispersion clause fails.
    - id: HEUR-2765d2-H5
      formal_statement: >-
        EXPOSURE EQUIVALENCE (SS). At a fixed number X_fix of formally
        distinct encodings, the null distribution of the SS relation count
        depends on the base only through |F| and m, not on the base's
        early-return behaviour; in particular the SS m = 4 relation dispersion
        of 13.2 at A_fix (EV-PFDR-1faf10 OBS-3) was exposure-driven.
      random_model_justification: L3 (sketch) plus OBJ-4's measured exposure spread (up to about 10%).
      supporting_results: []
      validation_experiment_ids: [EXP-PFDR-011cd0]
      falsification_condition: >-
        The random-arm SS relation dispersion at X_fix has a 99% interval
        with lower end > 4 for some m; or the known-null SS pseudo-cells fail
        PC-NULL.

