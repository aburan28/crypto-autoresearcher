  confounders:
    - Counting unit (removed by CC-1; EV-PFDR-1faf10 OBJ-3).
    - Exposure (removed for SS by X_fix; table classes are exposure-matched by |F|).
    - Variance floor in the wrong unit (removed. The floor is in relation units, t* is calibrated on the random arms and checked on a known-null arm).
    - Data-dependent family (removed. The family and its resolvability are declared before data from design quantities only, CC-9).
    - SS counter undercount (repaired, EC-1; gated by the regression test and G-FIX).
    - Interval undercoverage at small n (removed. Bootstraps use >= 20000 replicates or are seed-averaged, intervals are n/(n-1)-corrected or t-based, and coverage is simulated at the design's n).
    - Solve certificates (every solve archives (P, Q, k), re-verified by disjoint code).

  interpretation_limits:
    - A kappa_rel null closes nothing by itself; it bounds the excess per declared cell at 30-32 bits on the tested arms, this engine and these curves.
    - A kappa_rel-positive outcome is a lever candidate for review-breakthrough and independent replication, not a result.
    - Only TT, TB and SS are harvested; search-vs-base coincidences and order-suppressed table-vs-search matches are not.
    - TB at m = 4 and 5 is outside the family (expected null counts below 0.01 relations per instance at 30-32 bits); only gross tails are screened.
    - Toy scale. No deployed-curve statement, no universal impossibility, no exponent below rho's, and no floor-relative reading (TW-SCOPE; DEC-20261001-709f0d pending).
