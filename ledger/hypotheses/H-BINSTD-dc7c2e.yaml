# =============================================================================
# H-BINSTD-dc7c2e -- Stdlib-only toy Koblitz / Part-2 curve builder enabling
# EXP-BINSTD-178742 Part 2 at n≤41 without Magma/Sage. Clears
# IMP-PART2-CURVE-LIBS-1. Specified from IDEA-20261001-3f3b26 under
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Approved DEC-20261002-633f5b.
#
# ZERO RUNS in this design packet. Instrument / observational only.
# NO break. NO exponent. NO n≥131 transfer. No AUXIN. No Bedrock.
# =============================================================================
hypothesis:
  id: H-BINSTD-dc7c2e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-3f3b26
  experiment_id: EXP-BINSTD-835841
  goal_id: GOAL-ECDLP2M-001
  parent_hypothesis_id: H-BINSTD-ce4f38
  parent_experiment_id: EXP-BINSTD-178742
  impediment_targeted: IMP-PART2-CURVE-LIBS-1
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-633f5b
  status: approved
  proposed_by: coordinator
  title: >-
    A stdlib-only builder admits complete E1 toy Koblitz cells
    (n,a)∈{17,23,31,41}×{0,1} and runs the frozen Part-2 meter
    (G0–G4, CERT-LABEL/QUOT/BIND, ≥100 relations/cell) without Magma/Sage

  statement: >-
    CLAIM (instrument / observational). There exists an implementation using
    only Python's standard library plus the existing typed/gf2n.py surface
    under experiments/EXP-BINSTD-178742/implementation/typed/ that, for every
    positive toy cell (n,a)∈{17,23,31,41}×{0,1}: (A) builds the affine
    Weierstrass model E: Y^2+XY=X^3+a X^2+1 over F_{2^n}, computes group
    order, largest prime factor r, and Frobenius scalar λ of order n on ⟨G⟩,
    and admits the cell under EXP-BINSTD-178742 rule E1 (clauses E1-a..E1-d)
    with values matching the frozen e1_admissibility_table design figures;
    (B) passes gates G0 (planted rank), G1 (n=17 fixture), G2 (forced-negative
    n∈{19,29,37}), G3 (admission self-test), and G4 (instrument self-test /
    mutants M1–M3 + PTM-F) as defined in EXP-BINSTD-178742; (C) emits ≥100
    CERT-LABEL/CERT-QUOT/CERT-BIND-sealed admitted relations per cell whose
    orbit-quotient RANK-A = RANK-B = 1 and whose raw class/point/ker-g ranks
    match EVAL under lemmas L3/L4 of that contract — OR exports a
    counterexample_certificate before any O-SUPPORT reading of H-BINSTD-ce4f38.
    CLAIM TIER: instrument / observational. This hypothesis does NOT assert
    O-SUPPORT for H-BINSTD-ce4f38, does NOT claim an ECDLP break or exponent
    move, and does NOT transfer any n≤41 observation to n≥131.

  mechanism: >-
    OBJECT FRAME. Representation R1: affine Weierstrass points over F_{2^n}
    with schoolbook GF(2^n) arithmetic (typed/gf2n.py). Operation set Sigma:
    point add/double, Frobenius τ:(x,y)↦(x^2,y^2), discrete log of τ on ⟨G⟩
    as λ, baby-step/giant-step or equivalent order factorization at n≤41,
    and the Part-2 certificate/rank pipelines already frozen in
    EXP-BINSTD-178742. Trichotomy: Class I instrument enabling the already-
    frozen Part-2 protocol. Lossy-projection test: null object k=1 (ordinary
    E_b with b∉F_2) must refuse conjugate-family / ker-g rank readings that
    assume k=n (IR-5/IR-19). OFF-LIMITS: Magma/Sage/cypari2 provisioning as
    the success path; deployed n≥131 attacks; Semaev PDP; AUXIN tool install.
    WHAT IS NEW: removes the exact dependency impediment IMP-PART2-CURVE-LIBS-1
    that halted O-SUPPORT after Part-1 succeeded (EV-BINSTD-fba851 /
    DEC-20261001-f6d38c on portfolio branch; EXP-BINSTD-178742 Part-2 surface
    remains a stub on main).

  assumptions:
    - Toy n≤41 only; no deployed-curve Part-2 claim without a later amendment.
    - AST import audit remains stdlib-only (no cypari2/sage/magma/numpy smuggling
      into the Part-2 builder tree).
    - certificate.kind vocabulary closed; relation certs use decomposition only
      when a DLP relation is actually claimed and re-verified.
    - Frozen e1_admissibility_table and fixture_n17 values in EXP-BINSTD-178742
      are DESIGN FIGURES the builder must reproduce; disagreement is
      e1_table_disagree / instrument defect, never math evidence against
      H-BINSTD-ce4f38 lemmas.
    - Parent Part-1 evidence (EV-BINSTD-fba851) is cited as the impediment
      origin; this hypothesis does not re-litigate Part-1.

  proof_search_map:
    bottleneck: >-
      Curve/order construction and Frobenius-λ recovery at toy n≤41 under a
      stdlib-only import surface — the exact step blocked by
      IMP-PART2-CURVE-LIBS-1 before any Part-2 rank identity can be read.
    baseline_embedding:
      parameter_slice: >-
        EXP-BINSTD-178742 Part-2 packaging surface
        (implementation/typed/part2_surface.py) with scientific_scoring=false
        and no curve builds.
      reproduction_check: >-
        Reproduce frozen e1_admissibility_table eight cells and fixture_n17
        gate_checks byte-for-byte against design figures before any rank
        readout; G0–G4 must pass under the same definitions as
        EXP-BINSTD-178742.
    observation_collision:
      observable: >-
        "IMP-PART2-CURVE-LIBS-1 cleared" / "Part-2 instrument ready"
      distinct_preimage_search: >-
        Distinguish (i) Magma/Sage smuggling past the import audit,
        (ii) hard-coded table playback without arithmetic, (iii) genuine
        stdlib builder matching E1 + certificates. Audit + planted/forced-
        negative + G4 mutants separate these.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Schoolbook GF(2^n) + Weierstrass point arithmetic + BSGS order
          checks, stdlib-only, feeding the frozen Part-2 meter.
        predicted_gain: >-
          Removes external-CAS dependency so Part-2 ranks become runnable
          under the typed import rule.
    quantifier_order: >-
      FORALL (n,a) in positive arm: EXISTS complete E1 pair AND ≥100
      triple-certified relations with quotient rank 1 matching EVAL.
      FORALL forced-negative n in {19,29,37}: usable stable subspace empty.
      NOT claimed: O-SUPPORT of H-BINSTD-ce4f38; any n≥131 statement; any
      exponent.
    method_ceiling:
      strongest_certifiable_claim: >-
        Instrument readiness: stdlib builder + G0–G4 + CERT-* + quotient-rank-1
        at all eight positive cells, clearing IMP-PART2-CURVE-LIBS-1 for a
        successor Part-2 reading under EXP-BINSTD-178742 / H-BINSTD-ce4f38.
      nearby_object_control: >-
        Null object k=1 (E_b, b∉F_2) and non-stable W' must refuse conjugate-
        family ranks; G4 mutants M1–M3/PTM-F must fail certificates while the
        correct build passes.
    proof_obligations:
      - claim: E1 table match on 8/8 positive cells
        responsibility: baseline
      - claim: G0–G4 all pass under AST stdlib audit
        responsibility: feasibility
      - claim: ≥100 CERT-* relations/cell with quotient rank 1 = EVAL
        responsibility: correctness
      - claim: no Magma/Sage/cypari2 import in builder tree
        responsibility: interface
      - claim: scope limited to n≤41; no O-SUPPORT / break / exponent
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-BINSTD-3f3b26-H1
      formal_statement: >-
        FORALL positive toy cells (n,a)∈{17,23,31,41}×{0,1} admitted by E1:
        among ≥100 CERT-LABEL/QUOT/BIND-passing relations, orbit-quotient
        RANK-A = RANK-B = 1, and raw class/point/ker-g ranks match EVAL
        (EXP-BINSTD-178742 success_criterion_v3 limb 5) OR a
        counterexample_certificate is exported before any O-SUPPORT reading.
      random_model_justification: >-
        Rigorous: lemmas L3/L4 rank identities under the contract's bases
        (EXP-BINSTD-178742 design figures). Classical: Frobenius orbit algebra
        on a cyclic subgroup. Transfer from design lemmas to the stdlib
        builder is the instrument hypothesis under test.
      supporting_results: []
      validation_experiment_ids:
        - EXP-BINSTD-835841
      falsification_condition: >-
        Quotient rank ≠1 on a triple-certified relation (O-REFUTE-Q), OR
        raw ranks ≠ EVAL on such a relation (O-REFUTE-L3), OR G4 fails
        (IR-18) while ranks are still read.

  structural_ingredients:
    - description: >-
        Frozen Part-2 cell admission table, fixture, gates G0–G4, and
        CERT-LABEL/QUOT/BIND definitions.
      citation: EXP-BINSTD-178742
      provenance: internal
      verified_by: coordinator (design session 2026-10-02; read specification.yaml)
      role: meter definition / design figures
    - description: >-
        Schoolbook GF(2^n) arithmetic already admitted under the typed
        stdlib-only import rule.
      citation: experiments/EXP-BINSTD-178742/implementation/typed/gf2n.py
      provenance: internal
      verified_by: coordinator (design session 2026-10-02)
      role: field arithmetic substrate
    - description: >-
        Part-1 refine left Part-2 blocked by missing curve libraries
        (IMP-PART2-CURVE-LIBS-1).
      citation: IDEA-20261001-3f3b26
      provenance: internal
      verified_by: coordinator (design session 2026-10-02; read proposal)
      role: impediment origin / successor mandate

  reduction_chain:
    core_problem: >-
      Stdlib-only construction of admitted toy Koblitz cells and sealed
      Part-2 relations at n≤41.
    corollaries:
      - problem: >-
          Successor reading of H-BINSTD-ce4f38 Part-2 rank identities under
          EXP-BINSTD-178742 once IMP-PART2-CURVE-LIBS-1 is cleared.
        reduction_ref: >-
          Internal: clearing the named impediment restores the already-frozen
          Part-2 execution path (no published reduction).
        asymptotics_preserved: >-
          n/a — instrument; no asymptotic claim transferred.

  predictions:
    - metric: e1_complete_pair_count
      direction: higher
      minimum_effect: '8/8 positive (n,a) cells admit a complete pair matching table'
    - metric: quotient_rank_one_rate
      direction: higher
      minimum_effect: '=1.0 on ≥100 certified relations per cell under H1'
    - metric: g0_g4_pass
      direction: higher
      minimum_effect: 'all five gates pass; AST stdlib audit clean'

  test_boundary:
    instances:
      - positive_arm: '(n,a) in {17,23,31,41} x {0,1}'
      - forced_negative: 'n in {19,29,37}'
      - null_object: 'E_b with b not in F_2; k=1'
      - fixture: 'n=17 a=1 frozen fixture_n17'
    parameters:
      n_max: 41
      stdlib_only: true
      min_relations_per_cell: 100
      bases: [raw_class, raw_point, orbit_quotient, ker_g]
    implementation: >-
      experiments/EXP-BINSTD-835841/implementation/ (stdlib + local typed
      modules; may reuse gf2n pattern from EXP-BINSTD-178742/typed/gf2n.py
      without importing Magma/Sage/cypari2/numpy).
    budget:
      maximum_runs: 20
      total_cpu_hours_advisory: 4
      wall_clock_seconds_advisory: 14400

  falsification_conditions:
    - Reading ranks after G4 failure.
    - Smuggling non-stdlib curve libraries past the import audit.
    - Claiming O-SUPPORT / break / exponent from a partial cell set.
    - Transferring n≤41 ranks to n≥131 without a new contract.
    - E1 table disagreement treated as negative math evidence against L3/L4.

  interpretation_limits:
    - >-
      Success clears IMP-PART2-CURVE-LIBS-1 as an infrastructure impediment; it
      does not by itself promote H-BINSTD-ce4f38 to supported.
    - >-
      Failures that are timeouts/crashes/order-factorization budget exhaustion
      are failed_infrastructure (AGENTS.md rule 5), never refutation of L3/L4.
    - >-
      Hard-coded playback of the e1 table without reproducing arithmetic fails
      G1/G4 and does not clear the impediment.

  distinguishable_outcomes:
    - id: O-CLEAR-IMP
      meaning: >-
        8/8 E1 cells match table; G0–G4 pass; AST clean; ≥100 certified
        relations/cell with quotient rank 1 = EVAL → IMP-PART2-CURVE-LIBS-1
        cleared for successor Part-2 reading.
    - id: O-REFUTE-Q
      meaning: Quotient rank ≠1 on a triple-certified relation (counterexample exported).
    - id: O-REFUTE-L3
      meaning: Raw ranks ≠ EVAL on a triple-certified relation (counterexample exported).
    - id: O-IMPEDIMENT-ARITH
      meaning: >-
        Concrete arithmetic obstruction named with a measured quantity
        (e.g. order factorization at n=41 infeasible in budget) — impediment,
        not negative math evidence against L3/L4.
    - id: O-AUDIT-FAIL
      meaning: Non-stdlib import or G4 mutant pass → instrument defect; ranks unread.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
