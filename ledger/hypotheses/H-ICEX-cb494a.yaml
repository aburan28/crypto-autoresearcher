hypothesis:
  id: H-ICEX-cb494a
  question_id: RQ-ROS-595c15
  source_idea_id: IDEA-20260809-5797e8
  title: >-
    MAKE THE ASSUMPTION VISIBLE- a table of which two-round protocol proof needs
    the algebraic group model or a one-more assumption and how loose its reduction
    is, designed as a VERIFICATION PROTOCOL with a planted-proof control of KNOWN
    loss exponent that a blinded extractor must recover, because a document audit
    with no planted defect can only ever return a number
  statement: >-
    (A) THE OBJECT, AND WHAT MAKES IT AUDITABLE RATHER THAN AN OPINION. The claim
    is entirely about DOCUMENTS. For each filed security proof of a deployed
    two-round Schnorr-type protocol, three fields are extracted- the ASSUMPTION
    CLASS the reduction rests on (plain discrete log, a one-more variant, an
    algebraic-group-model argument, or another named class); the EXPONENT OF THE
    LOSS IN THE NUMBER OF CONCURRENT SESSIONS; and the EXPONENT OF THE LOSS IN THE
    NUMBER OF SIGNING QUERIES. Each extracted value cites the SPECIFIC PASSAGE it
    came from. AN UNCITED CELL IS undetermined BY DEFINITION, because this record
    is a claim about documents and nothing else.
    (B) THE CLAIM. Instantiating the extracted loss functions at a declared group
    size yields, for at least one deployed protocol, an EFFECTIVE-BITS-VERSUS-
    CONCURRENCY curve that degrades materially with the session count in a way its
    quoted bit level does not show. NO DEGRADATION ANYWHERE would be a clean and
    reassuring result and is recorded plainly as one.
    (C) THE CONTROL THIS RECORD ADDS AND THE SOURCE DOES NOT HAVE. A document audit
    whose only checks are -cite the passage- and -extract twice- can return a
    number without ever demonstrating that it can tell a tight proof from a loose
    one. THE PLANTED-PROOF CONTROL FIXES THAT- two SYNTHETIC proof texts are
    inserted into the extraction corpus, one with a reduction that is TIGHT (loss
    exponent 0 in the session count) and one with a KNOWN QUADRATIC session loss
    (loss exponent 2), written in the same register and of comparable length. The
    extractor, blind to which is which, MUST RETURN EXPONENT 0 ON THE FIRST AND
    EXPONENT 2 ON THE SECOND. THAT IS A DEMONSTRATED DYNAMIC RANGE OF TWO EXPONENT
    UNITS. An extractor that returns the same exponent on both is VOID and no cell
    it produced may be quoted.
    (D) THE BLOCKING PRECONDITION. RQ-ROS-595c15 states VERBATIM that no
    certificate is recorded before the ROS reference and the specification of each
    protocol under test are filed as KN-LIT entries. The source proposal
    source_refs read -Security proofs of the deployed two-round protocols,
    RECALLED, REQUIRED READS- and no such entry has been filed by any agent in this
    program. UNTIL THEY ARE, EVERY CELL OF THE TABLE IS undetermined BY THE
    QUESTION OWN RULE, and a table of undetermined cells with the missing sources
    named is the honest deliverable rather than a failure.
    (E) THE CURVE-FREE STATUS, RECORDED AS A PROOF RATHER THAN AN ARM. The object
    of this record is a set of text documents and an arithmetic evaluation of
    functions extracted from them. NO CURVE, NO GROUP ELEMENT AND NO GROUP
    OPERATION IS COMPUTED ANYWHERE. The only elliptic content is the GROUP SIZE at
    which an extracted loss function is instantiated, which is a single integer
    parameter. PRE-DECLARED- NO OUTCOME OF THIS RECORD IS AN ELLIPTIC-CURVE
    STATEMENT, AND NO OUTCOME IS A STATEMENT ABOUT WHAT ANY ADVERSARY CAN DO.
    (F) WHAT THIS DOES NOT DO. A loose reduction is NOT an attack and no record may
    imply one. The table describes what each proof GUARANTEES, not what an
    adversary can achieve. No ROS solver is implemented, run or timed under this
    hypothesis, and no claim that a standardized protocol is broken may be
    recorded under RQ-ROS-595c15.
  mechanism: >-
    THE PROJECTION AND ITS LOSS, STATED. Each proof is projected onto four
    numbers- an assumption class code, a session-count loss exponent, a
    signing-query loss exponent, and the passage identifier each was read from. What
    is discarded is the entire argument. The projection is compatible with the only
    operation performed on it - instantiating the loss at a group size and reading
    off effective bits - because that operation is a function of the exponents
    alone. IT IS NOT COMPATIBLE WITH ANY OPERATION THAT WOULD JUDGE THE PROOF, and
    the record makes no such judgement.
    WHY A PLANTED PROOF IS THE RIGHT DEFECT. The extraction procedure is the
    instrument. Its failure mode is returning a plausible exponent from a proof it
    did not actually parse, and no amount of passage citation detects that, because
    a citation to a real passage can accompany a wrong reading of it. A synthetic
    proof with a KNOWN loss exponent is the only object for which the correct
    answer is available in advance, so it is the only object on which the
    instrument can be shown to work.
    WHY INDEPENDENT DOUBLE EXTRACTION IS ABOUT RELIABILITY AND NOT ABOUT TRUTH. Two
    independent extractions of the same proof measure whether the READING PROCEDURE
    is reproducible. They cannot establish that either reading is correct - two
    readers can share the same misunderstanding - which is why the planted control
    is the validity argument and the double extraction is only the reliability
    argument. Both are reported and neither substitutes for the other.
    WHY THE OUTPUT IS A CURVE AND NOT A NUMBER. A tightness loss that depends on
    the session count is not summarised by a single bit level; the deliverable is
    effective bits AS A FUNCTION OF CONCURRENCY at a declared group size, per
    protocol, with the loss function printed beside it so a reader can recompute it.
  assumptions:
    - >-
      The filed proofs state their reduction in enough detail to extract an
      assumption class and two loss exponents. WHERE THEY DO NOT, THE CELL IS
      undetermined AND IS REPORTED AS undetermined- an estimate in place of an
      extraction is forbidden.
    - >-
      The synthetic planted proofs are written by an agent that does NOT perform the
      extraction, are inserted into the corpus indistinguishably in register and
      length, and their true loss exponents are sealed until after extraction.
    - >-
      UNITS. LOSS EXPONENTS ARE DIMENSIONLESS. EFFECTIVE BITS IS THE BASE-2
      LOGARITHM OF A DIMENSIONLESS SECURITY RATIO at a declared group size, and the
      instantiation that produced it is printed on every row. NO WALL-CLOCK OR
      OPERATION-COUNT QUANTITY APPEARS ANYWHERE IN THIS RECORD.
    - >-
      No third-party wallet, service, node, chain or repository is probed or
      analysed. Only published documents are read, per the RQ constraint.
  proof_search_map:
    not_applicable_reason: >-
      A document-extraction audit. No theorem, bound, certificate family, reduction
      or closure argument is PROPOSED- the record extracts reductions that already
      exist in published proofs and instantiates them. It proves nothing and claims
      nothing about the correctness of any proof it reads. Recorded rather than
      omitted per docs/inventor-protocol.md section 8.
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms:
      - transform: null
        proposed_object: null
        predicted_gain: null
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations:
      - claim: null
        responsibility: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-TIGHT-1
      formal_statement: >-
        A reduction stated in a published security proof determines an assumption
        class and two loss exponents that two independent readers, following the
        declared extraction procedure, recover identically; and an extractor that
        recovers the KNOWN exponents of two planted proofs recovers the exponents of
        a real proof with the same reliability.
      random_model_justification: >-
        NONE, AND NONE IS APPROPRIATE- there is no distribution here. This is a
        RELIABILITY ASSUMPTION about a reading procedure, and it is stated as an
        assumption precisely because the second half of it - that performance on
        planted proofs transfers to real ones - is exactly the kind of transfer that
        can fail. The planted control bounds it from below; nothing bounds it from
        above and the record says so.
      supporting_results:
        - ref: RQ-ROS-595c15
          provenance: internal
          claim: >-
            VERBATIM- the target of a table of which of the replacements proofs
            rest on an algebraic-group-model or one-more-discrete-log assumption,
            stated so the assumption being relied on is visible rather than folded
            into -proven secure-; the constraint that no certificate is recorded
            before the ROS reference and the specification of each protocol under
            test are filed as KN-LIT entries; the claim ceiling that a result is a
            statement about an instantiation and never about the protocol or any
            deployed system; and that a failed forgery search is a budget outcome
            about a solver and never evidence of security.
          verified_by: >-
            coordinator, TASK-20260904-65b023 - RQ-ROS-595c15 read in full this
            task, 84 lines; every quoted clause is verbatim.
        - ref: >-
            The ROS insecurity result and the specifications and security proofs of
            the deployed two-round Schnorr-type protocols
          provenance: recalled
          claim: >-
            The polynomial-time ROS solver and the replacement protocols whose
            proofs this record would extract. NO SOURCE WAS OPENED BY THIS AGENT,
            and RQ-ROS-595c15 own provenance block already records every one of
            them as RECALLED, NOT WEB-SEARCHED, NOT PRIMARY-READ and NOT FILED AS
            KN-LIT. Under AGENTS.md rule 9 this discharges nothing, and under the
            RQ own constraint no cell may be filled until they are filed by an
            agent that reads them.
          verified_by: null
      validation_experiment_ids:
        - EXP-ICEX-502d4c
      falsification_condition: >-
        The extractor returns the same loss exponent for the tight planted proof and
        for the quadratic-loss planted proof. The reading procedure cannot
        distinguish a tight reduction from a loose one, EVERY CELL IT PRODUCED IS
        VOID, and the table may not be published in any form.
  structural_ingredients:
    - description: >-
        The research question that names the assumption-surface table as a target,
        imposes the KN-LIT filing precondition, and sets the claim ceiling that
        forbids any statement about a deployed system.
      citation: RQ-ROS-595c15
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-65b023 - read in full this task, 84 lines.
      role: the source of every blocking precondition and of the claim ceiling
    - description: >-
        The ROS insecurity result, the generalized-birthday prior solver, and the
        specifications and security proofs of the deployed two-round protocols.
        RELAYED AND UNREAD- no source was opened by this agent, and the RQ own
        provenance block records all of them as RECALLED and UNVERIFIED. Marked
        recalled rather than internal for that reason.
      citation: >-
        The ROS reference and the protocol specifications and proofs named in
        RQ-ROS-595c15 - all REQUIRED READS, none filed as KN-LIT
      provenance: recalled
      verified_by: null
      role: >-
        the documents this record would extract from; until filed as KN-LIT
        entries every cell is undetermined
  reduction_chain:
    core_problem: >-
      What assumption each deployed two-round protocol proof rests on, and how its
      security loss depends on the number of concurrent sessions, extracted from the
      filed proofs with passage citations.
    corollaries:
      - problem: >-
          The effective-bits-versus-concurrency curve at a declared group size, per
          protocol.
        reduction_ref: >-
          Internal- the curve is an instantiation of the extracted loss function and
          no published reduction is cited beyond the proofs themselves, which are
          unread.
        asymptotics_preserved: >-
          Not applicable. A loose reduction is not an attack and no asymptotic claim
          about any adversary is made.
  predictions:
    - metric: >-
        P1- planted-proof control- extracted session-count loss exponent on the
        tight synthetic proof and on the quadratic-loss synthetic proof, extractor
        blind to which is which (dimensionless)
      direction: different
      minimum_effect: >-
        EXACTLY 0 ON THE TIGHT PROOF AND EXACTLY 2 ON THE QUADRATIC ONE. A
        DEMONSTRATED DYNAMIC RANGE OF TWO EXPONENT UNITS. An extractor returning the
        same value on both, or missing either by more than 0, is VOID and NO CELL IT
        PRODUCED MAY BE QUOTED. This is the entire validity argument of the record.
    - metric: >-
        P2- independent double extraction- agreement on all three fields (assumption
        class, session-count loss exponent, signing-query loss exponent) for at
        least one real proof
      direction: different
      minimum_effect: >-
        AGREEMENT ON ALL THREE FIELDS. A disagreement is resolved by a THIRD
        independent read before recording, and the DISAGREEMENT RATE is reported
        rather than hidden. Systematic disagreement means the reading procedure is
        unreliable and the table is withdrawn.
    - metric: >-
        P3- count of protocols whose proof rests on an idealized model, with the
        citing passage for each (count)
      direction: higher
      minimum_effect: >-
        MORE THAN ONE, PREDICTED. The point is to make the reliance VISIBLE rather
        than to criticise the practice, and a count of zero would be equally
        reportable and equally interesting.
    - metric: >-
        P4- effective bits versus concurrent session count, per protocol, at a
        declared group size (bits against a count)
      direction: different
      minimum_effect: >-
        AT LEAST ONE PROTOCOL SHOWING A MATERIAL DEGRADATION, defined before the run
        as at least 10 BITS lost between 1 session and 2^20 concurrent sessions. NO
        DEGRADATION ANYWHERE is a clean result and is recorded plainly as one, not
        as a null.
    - metric: >-
        P5- undetermined-cell count and the reason for each (count)
      direction: different
      minimum_effect: >-
        REPORTED IN FULL. An uncited cell is undetermined BY DEFINITION. A table
        with a high undetermined count is an honest table; a table with no
        undetermined cells and no planted control passing is a fabricated one.
    - metric: >-
        P6- acquisition gate- whether the ROS reference and every protocol
        specification under test are filed as KN-LIT entries
      direction: different
      minimum_effect: >-
        A YES OR NO WITH THE ENTRIES NAMED. IF NO, EVERY CELL IS undetermined BY
        RQ-ROS-595c15 OWN RULE and the deliverable is the undetermined table with
        the missing sources named. THAT IS A LEGITIMATE RESULT AND NOT A FAILURE.
  test_boundary:
    instances:
      - >-
        At least three filed security proofs of deployed two-round Schnorr-type
        protocols, each filed as a KN-LIT entry by an agent that read it.
      - >-
        PLANTED CONTROL- two synthetic proof texts of KNOWN loss exponent, one
        tight and one with a quadratic session loss, written by an agent that does
        not perform the extraction and sealed until after extraction.
      - >-
        NO CURVE, NO GROUP AND NO PROTOCOL IS IMPLEMENTED, EXECUTED OR PROBED. The
        entire instance set is documents.
    parameters:
      protocols: 'at least three, named in the contract before extraction begins'
      group_size: 'one declared group size, named on every effective-bits row'
      concurrency_range: '1 to 2^20 concurrent sessions, declared before the run'
      materiality_threshold: '10 bits lost across the concurrency range'
      extraction_fields: 'assumption class, session-count loss exponent, signing-query loss exponent, citing passage'
    implementation: >-
      A structured extraction form filled per proof per extractor, plus an
      arithmetic evaluator that instantiates the extracted loss function at the
      declared group size over the concurrency range and emits the curve. The
      evaluator prints the loss function beside the curve so a reader can recompute
      it. NO CRYPTOGRAPHIC CODE IS EXECUTED.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 0.5
      maximum_memory_gb: 8
      maximum_runs: 10
  falsification_conditions:
    - >-
      F1. The planted-proof control does not separate the tight proof from the
      quadratic-loss one. THE EXTRACTOR IS VOID, every cell it produced is void, and
      the table may not be published in any form. This is the record whole validity
      argument and it can fail.
    - >-
      F2. Independent extractions disagree systematically. The reading procedure is
      unreliable, the disagreement rate is reported, and the table is withdrawn
      rather than averaged.
    - >-
      F3. Reductions cannot be extracted in enough detail to instantiate. The table
      reports undetermined cells with their reasons RATHER THAN ESTIMATES. That is
      the correct behaviour and not a failure.
    - >-
      F4. No protocol shows material degradation with concurrency. A clean and
      reassuring result, recorded plainly, with the detectable effect size stated
      so it is not mistaken for a proof of tightness.
    - >-
      F5. The KN-LIT acquisition gate is not discharged. Every cell is undetermined
      by RQ-ROS-595c15 own rule and the deliverable is the undetermined table with
      the missing sources named.
  interpretation_limits:
    - >-
      A LOOSE REDUCTION IS NOT AN ATTACK AND NO RECORD MAY IMPLY ONE. The table
      describes what each proof GUARANTEES, not what an adversary can do. Under
      RQ-ROS-595c15 no claim that a standardized protocol is broken may be recorded.
    - >-
      NO CERTIFICATE IS RECORDED BEFORE THE ROS REFERENCE AND EACH PROTOCOL
      SPECIFICATION ARE FILED AS KN-LIT ENTRIES. That is the RQ verbatim constraint
      and it binds this hypothesis absolutely. The sources are currently RECALLED
      and unread by any agent in this program.
    - >-
      THE OBJECT IS DOCUMENTS. NO CURVE, GROUP ELEMENT OR GROUP OPERATION IS
      COMPUTED. That is recorded here as a PROOF rather than discharged by a
      curve-free arm, because a curve-free version of this record would be the
      identical record. PRE-DECLARED- NO OUTCOME IS AN ELLIPTIC-CURVE STATEMENT AND
      NO OUTCOME IS A STATEMENT ABOUT ANY ADVERSARY CAPABILITY.
    - >-
      THE PLANTED CONTROL BOUNDS THE EXTRACTOR RELIABILITY FROM BELOW ONLY. Success
      on two synthetic proofs does not establish that a reading of a real proof is
      correct; two readers can share a misunderstanding that no control detects.
      That gap is stated rather than papered over.
    - >-
      AN UNCITED CELL IS undetermined BY DEFINITION. An estimate in place of an
      extraction is forbidden, and a table with no undetermined cells and no passing
      planted control is not credible.
    - >-
      THE EFFECTIVE-BITS CURVE IS AN EVALUATION OF AN EXTRACTED LOSS FUNCTION, NOT A
      MEASURED COST. NO ROS SOLVER IS IMPLEMENTED, RUN OR TIMED HERE, and the
      measured cost curve RQ-ROS-595c15 also asks for is a DIFFERENT deliverable
      that this record does not supply and must not be read as supplying.
    - >-
      claim_tier is bounded by RQ-ROS-595c15 claim_tier_ceiling. No attack, no
      exponent moved, sota_delta zero. Comparative tightness analysis is standard
      practice and no methodological novelty is claimed.
