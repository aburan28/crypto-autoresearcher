hypothesis:
  id: H-PFDR-14ca22
  question_id: RQ-PAIR-21313f
  source_idea_id: IDEA-20260901-2d3f07
  batch_id: BATCH-c64bee
  title: >-
    On a cyclic group of prime order N every bilinear map into H is determined
    by the single element h = b(P, P) in H[N], so the space of self-pairings is
    ONE-dimensional and the three residual cells H-PAIR-713241 leaves open are
    one cell, which is the goal itself -- a computable non-degenerate
    self-pairing into an easy-DLP group IS an ECDLP solver and one into G IS a
    CDH oracle. The dimension count is a fact about CYCLIC GROUPS with no curve
    in it, so the closure is curve-free by construction and its edge is
    exhibited where the count fails: full rational N-torsion, where the rank is
    4 and the families genuinely separate.
  statement: >-
    Let E over F_p be ordinary, P a point of PRIME order N, G the group generated
    by P, and H any abelian group. Five statements, decreasing in certainty, each
    separately falsifiable.
    (C1) DIMENSION COUNT, ELEMENTARY. A map b on G x G is bilinear if and only if
    b([x]P, [y]P) = [xy] h for the single element h = b(P, P) in H[N]. Hence the
    space of bilinear maps on G x G into H is isomorphic to H[N] as a group, and
    when H[N] is cyclic -- the N-th roots of unity in any field, G itself, any
    group of prime order N -- the space of self-pairings is ONE-DIMENSIONAL over
    the integers modulo N: every self-pairing is a fixed power of every other.
    The proof uses bilinearity in each argument plus the fact that G is generated
    by one element; nothing about divisors, orientations or fields is used.
    CONSEQUENCE: the phrase "self-pairings outside the Weil, Tate and
    Castryck-Houben-Merz families" names an EMPTY distinction on G x G. VERIFIED
    VERBATIM: H-PAIR-713241 interpretation_limits state that self-pairings
    incompatible with oriented isogenies, pairings into groups other than the
    N-th roots of unity, and non-divisorial bilinear maps "remain open and must
    be carried into every summary". Those are the three cells.
    (C2) A COMPUTABLE NON-DEGENERATE SELF-PAIRING INTO AN EASY GROUP IS AN ECDLP
    SOLVER. If b is computable from point representations and h is nonzero, then
    from (P, Q = [x]P) one computes b(Q, P) = [x] h and solves one discrete
    logarithm in the group generated by h. If that discrete logarithm is easy the
    ECDLP is easy. So "does a computable non-degenerate self-pairing into an
    easy-DLP group exist" is LITERALLY "is the ECDLP easy" and cannot be a route
    to it.
    (C3) A SELF-PAIRING INTO G ITSELF IS A CDH ORACLE, AND CDH LIFTS TO DLP. With
    H = G and h = [c]P for nonzero c, b([x]P, [y]P) = [cxy]P, so multiplying by
    the inverse of c solves computational Diffie-Hellman in G. The lift from a
    CDH oracle to a discrete-logarithm algorithm requires an auxiliary group over
    the field of N elements of smooth order, which is HEUR-001 and is the record
    single heuristic; the underlying reduction is RECALLED and no agent in this
    program has opened it, so the lift is STATED and not relied on. (C2) needs
    neither.
    (C4) WHAT DOES NOT COLLAPSE, SO THE CLOSURE HAS FORWARD GUIDANCE. The
    dimension count is about G x G. Pairings on G x G-prime with G-prime a
    DIFFERENT group -- the second Frobenius eigenline, its twist-rational image,
    a point outside G -- are NOT covered, and those are exactly the classical
    transfer: they need a second argument that is not a function of P, and the
    whole cost question is the cost of writing that argument down. Likewise
    "pairings into groups other than the N-th roots of unity" is not a fourth
    family but a question about which groups of order N admit an efficiently
    computable nontrivial homomorphism from G, which is an existing
    one-point-map taxonomy in this corpus. The forward guidance is that the
    second half of this question should be RETIRED INTO that taxonomy rather than
    left open beside it.
    (C5) THE NEARBY OBJECT WHERE (C1) FAILS. If the full N-torsion is rational,
    the space of bilinear forms on the N-torsion has rank FOUR, the Weil pairing
    is alternating so a point pairs trivially with itself while the Tate pairing
    does not, and the two are NOT proportional, so "which family" is a real
    question there. PRIME CYCLIC ORDER OF THE DOMAIN IS THEREFORE THE EXACT
    HYPOTHESIS that makes the family distinction vanish, and an argument that
    also collapsed the families on full rational torsion would prove too much.
    (C6) THE ATTRIBUTION STATEMENT, ADDED BY THIS RECORD. (C1), (C2) and (C3)
    contain NO ELLIPTIC CURVE. They are facts about cyclic groups of prime order
    and about any abelian target group, and an abstract-group instantiation --
    the integers modulo N with a synthetic representation -- reproduces every one
    of them exactly. The curve enters at exactly one place, COMPUTABILITY: whether
    a given h is reachable from point representations. The deliverable must
    therefore be written as a statement about prime-order cyclic groups with a
    named computability caveat, and any artifact describing the collapse as a
    property of elliptic curves is overclaiming on a curve-free argument.
  mechanism: >-
    THE TRACKED OBJECT is the single group element h = b(P, P) in H[N] that a
    self-pairing reduces to once the domain is cyclic of prime order. The
    projection from a self-pairing to h discards the entire construction -- Miller
    functions, divisors, orientation, elliptic-net recurrence, final
    exponentiation -- and retains one element. It is exactly compatible with the
    only operation that acts on self-pairings, composition with scalar
    multiplication on the arguments, under which h propagates as h maps to
    [xy] h. It is genuinely lossy and is not a change of coordinates, because two
    different constructions with the same h are the same map and no construction
    is recoverable from h.
    WHY THIS IS A CLOSURE AND NOT A FATIGUE REPORT. The lane prior closures argue
    family by family -- the Weil pairing via an endomorphism, the Tate pairing via
    Galois equivariance, the oriented family via a divisibility constraint -- and
    each leaves the others complement open. (C1) says the complement is EMPTY by
    linear algebra, and (C2) and (C3) say that whatever inhabits the one remaining
    dimension is by definition an ECDLP solver or a CDH oracle. The obstruction is
    named (the rank is 1), the argument is four lines, and the redirection is
    explicit.
    WHY THE EDGE MUST BE EXHIBITED. An argument that collapses a space to rank 1
    is only credible if the instrument that measures rank can also see rank 4.
    (C5) supplies an object where the rank is provably larger, and measuring rank
    1 on cyclic cells and rank 4 there in the same run, with the same code, is the
    dynamic-range demonstration. Without it, "the rank is 1" is an unfalsifiable
    constant.
  assumptions:
    - >-
      N is prime and G is cyclic of order N. LOAD-BEARING: (C1) is false for
      non-cyclic domains, which is the content of (C5).
    - >-
      "Computable" means computable from the point representations without the
      discrete logarithm; a map that needs the logarithm to evaluate is excluded.
    - >-
      Ordinary prime-field curves only. On supersingular curves the domain of
      interest is the full N-torsion with a distortion map, and (C5) rather than
      (C1) is the relevant regime.
    - >-
      Toy scale for every measured number: p up to about 32 bits, small
      constructed embedding degrees, and N up to about 2^28 for the
      reduction demonstration. Nothing extrapolates.
    - >-
      [DISCLOSED CHEAT] The CDH oracle used in the reduction demonstration is
      GIVEN the discrete logarithms of its inputs by the harness. It is
      soundness-losing by construction, the demonstration attacks nothing, and
      EVERY artifact from that stage must carry the sentence that the oracle was
      given the logs. A reader who takes it as an attack has misread it.
    - >-
      [verified verbatim] H-PAIR-713241 is a PROPOSED hypothesis, not a supported
      one; its statement covers the Weil, Tate and oriented families and its
      interpretation_limits explicitly leave open self-pairings outside those
      families, pairings into groups other than the N-th roots of unity, and
      non-divisorial bilinear maps. Read in full by this coordinator on
      2026-09-04. This record therefore neither contradicts nor supersedes it; it
      addresses the complement that record declares open.
  proof_search_map:
    bottleneck: >-
      The identification of the space of bilinear maps on G x G into H with
      H[N]. Everything else is substitution. Remove prime cyclic order and the
      bottleneck reappears as a rank-4 space with genuinely different families.
    baseline_embedding:
      parameter_slice: >-
        H the N-th roots of unity inside the field of p^k elements with b the
        Tate self-pairing. (C1) then reads "the Tate self-pairing is a fixed
        multiple of one element", and (C2) reads "a nontrivial self-pairing at
        embedding degree 1 reduces the ECDLP to a discrete logarithm in the base
        field", which is the known positive at embedding degree 1 and the known
        null above it.
      reproduction_check: >-
        Symbolic, plus a frozen fixture: one curve at embedding degree 1 on which
        the Tate self-pairing has exact order N and the base-field discrete
        logarithm recovers the scalar, certified by an on-curve check performed
        by code sharing no state with the solver.
    observation_collision:
      observable: >-
        The element h = b(P, P) together with the rank of the space of bilinear
        forms on G x G.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and the collision IS the content: the
        Tate pairing, the eta and ate pairings, the elliptic-net pairing and any
        oriented self-pairing all project to a scalar multiple of one h. Two
        structurally different constructions with the same h are the SAME MAP.
        The separating condition that would make them different objects is rank
        above 1, which requires a non-cyclic domain -- which is (C5) and is run.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "search over self-pairing families" by "one element of H[N] and
          one encoding of H". Encoding exact; completeness exact by (C1);
          soundness is where the content moves, onto computability, and
          (C2)/(C3) say it moves onto the goal itself.
        predicted_gain: >-
          Retires three declared-open cells of the lane at zero compute and names
          the one that remains.
      - transform: observable_fiber
        proposed_object: >-
          Hold the rank fixed at 1 and vary the construction; then hold the
          construction fixed and vary the domain to full rational torsion, where
          the rank jumps to 4.
        predicted_gain: >-
          Exhibits the edge of the closure constructively, so the closure is a
          boundary rather than a fatigue report.
    quantifier_order: >-
      (C1): FOR ALL primes N, FOR ALL cyclic G of order N, FOR ALL abelian H, FOR
      ALL bilinear b on G x G, THERE EXISTS h in H[N] with b([x]P, [y]P) = [xy] h
      for all x and y. (C2): FOR ALL computable b with nonzero h and easy discrete
      logarithm in the group generated by h, the ECDLP in G is easy. (C3): FOR
      ALL computable b into G with nonzero h, CDH in G is easy; and, conditional
      on HEUR-001, the discrete logarithm in G is easy.
      NOT CLAIMED: anything about b whose second argument ranges over a group
      other than G.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On a prime-order cyclic subgroup there is exactly one self-pairing up to
        scalar, and any efficiently computable non-degenerate one is an ECDLP
        solver or a CDH oracle." It certifies nothing about pairings whose second
        argument leaves G, nothing about the cost of the classical transfer, and
        nothing about ECDLP hardness.
      nearby_object_control: >-
        The full-rational-N-torsion curve: rank 4, the Weil and Tate pairings not
        proportional, the discrete logarithm already broken there by the classical
        transfer at embedding degree 1. The argument MUST SEE the rank jump; if
        the instrument reports proportionality there, it is measuring itself.
    proof_obligations:
      - claim: 'The space of bilinear maps on G x G into H is isomorphic to H[N] for G cyclic of prime order N.'
        responsibility: correctness
      - claim: 'A computable self-pairing with nonzero h into an easy-DLP group solves the ECDLP.'
        responsibility: correctness
      - claim: 'A computable self-pairing into G with nonzero h is a CDH oracle.'
        responsibility: correctness
      - claim: >-
          The CDH-to-DLP reduction runs at toy N given a smooth auxiliary group,
          with the recovered scalar certified on the curve by an independent
          verifier, and with the harness cheat disclosed on every artifact.
        responsibility: feasibility
      - claim: 'On full rational N-torsion the rank is 4 and the Weil and Tate pairings are not proportional.'
        responsibility: baseline
      - claim: >-
          The abstract-group instantiation reproduces (C1) exactly, so the
          collapse is reported as a fact about prime-order cyclic groups with a
          computability caveat and not as a fact about elliptic curves.
        responsibility: scope
      - claim: 'Every reported pairing value carries its root-of-unity membership check and the auxiliary point used.'
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        SMOOTH AUXILIARY GROUP. For prime N in the toy range and a smoothness
        bound B = N^{1/4}, the order of a uniformly random elliptic curve over
        the field of N elements is B-smooth with probability (1 + o(1)) rho(u)
        where u = log N / log B, uniformly for u between 2 and 6.
      random_model_justification: >-
        The rigorous ingredients are the Hasse bound, which places the order in
        an interval of length about 4 sqrt(N) around N + 1, and the theorem that
        every integer in that interval is attained. The distributional statement
        imitated is Dickman-de Bruijn smoothness for a uniformly random integer
        of that size -- the same heuristic the elliptic-curve factoring analysis
        makes -- and it is exactly the auxiliary-group condition the recalled
        CDH-to-DLP reduction requires.
      supporting_results:
        - ref: H-PAIR-713241
          provenance: internal
          claim: >-
            The three residual cells this record addresses, quoted verbatim from
            its interpretation_limits, and its own status of proposed.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-ef6b61
      falsification_condition: >-
        The measured B-smooth fraction is inconsistent with the Dickman
        prediction at all three tested N. HEUR-001 fails at toy scale and (C3)
        becomes conditional on an unvalidated assumption, reported as such.
  structural_ingredients:
    - description: >-
        The observation that an efficiently computable self-bilinear map on a
        group of known order makes computational Diffie-Hellman easy.
      citation: 'Cheon and Lee, A note on self-bilinear maps, Bull. Korean Math. Soc. 46 (2009)'
      provenance: retrieved
      verified_by: >-
        RELAYED. IDEA-20260901-2d3f07 records that its author fetched and read
        the ABSTRACT PAGE ONLY on 2026-09-01 and did NOT read the theorem
        statements. THIS COORDINATOR OPENED NOTHING. (C3) re-derives the needed
        direction in four lines and does not rely on the paper formulation.
      role: prior art for (C3), which is not claimed as new
    - description: >-
        The reduction converting a CDH oracle for a prime-order cyclic group into
        a discrete-logarithm algorithm, given an auxiliary group of smooth order.
      citation: 'Maurer and Wolf, The relationship between breaking the Diffie-Hellman protocol and computing discrete logarithms'
      provenance: recalled
      verified_by: null
      role: >-
        the lift in (C3). NOT OPENED by any agent in this program. The exact
        smoothness parameterisation must be checked by a reviewer with
        retrieval before the lift is relied on.
    - description: >-
        The declared-open complement this record addresses, and the fact that the
        record declaring it is itself only proposed.
      citation: 'ledger/hypotheses/H-PAIR-713241.yaml'
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: the target of the reduction of three cells to one
  reduction_chain:
    core_problem: >-
      A computable non-degenerate self-pairing on a prime-order cyclic group.
    corollaries:
      - problem: 'computational Diffie-Hellman in the same group'
        reduction_ref: '(C3), four lines, self-contained'
        asymptotics_preserved: 'yes, one group operation and one scalar inversion'
      - problem: 'the discrete logarithm in the same group'
        reduction_ref: >-
          the recalled CDH-to-DLP reduction, conditional on HEUR-001 and NOT
          verified by any agent here
        asymptotics_preserved: 'polynomial given a smooth auxiliary group; unverified'
  predictions:
    - metric: >-
        P1 -- fraction of (curve, point-pair) cells at small constructed
        embedding degrees on which the Weil, reduced Tate and ate-type values are
        related by a single per-curve exponent. UNITS: fraction of cells
      direction: higher
      minimum_effect: >-
        100 percent, with the exponent CONSTANT across at least 200 point pairs
        per curve and ZERO variance. A pair-dependent exponent is an instrument
        failure -- final exponentiation first, auxiliary divisor second -- and no
        number is reported. The decay parameter is the number of sampled point
        pairs: an exponent that CONVERGES rather than sitting at one value is an
        artifact, not a measurement.
    - metric: >-
        P2 -- the rank over the integers modulo N of the span of the Weil
        pairing, the Tate pairing, the Tate pairing with arguments swapped, and
        the Tate pairing composed with an automorphism, as bilinear forms.
        UNITS: integer rank
      direction: different
      minimum_effect: >-
        FORCED EXACTLY 1 on every cyclic-G cell and EXACTLY 4 on the
        full-rational-N-torsion curve. THIS IS THE DYNAMIC-RANGE DEMONSTRATION
        AND THE CHEAPEST DECISIVE STEP: rank 1 against rank 4 on two curves at
        the same p, computable in minutes. Failure of either half means the
        argument does not separate prime cyclic order from full rational torsion
        and the record stops.
    - metric: >-
        P3 -- reduction demonstrations that end with an on-curve certificate
        verified independently of the solver, out of runs in which a smooth
        auxiliary group was found. UNITS: fraction of runs
      direction: higher
      minimum_effect: >-
        100 percent, with the RANDOM-OUTPUT ORACLE CONTROL certifying 0 percent.
        Runs where no smooth auxiliary group is found within budget are reported
        as UNEXHIBITED at that N and NEVER as failures of (C3). A pipeline that
        recovers the scalar from a random-output oracle is reading the harness
        cheat rather than running the reduction.
    - metric: >-
        P4 -- fraction of random curves over the field of N elements with
        B-smooth order at B = N^{1/4}, over at least 10^4 samples per N. UNITS:
        fraction
      direction: different
      minimum_effect: >-
        Within the Dickman prediction rho(4), about 0.0049, by a two-sided
        binomial test at the 5 percent level. At 10^4 samples that is about 49
        expected successes with a standard deviation near 7, so the test resolves
        a relative shift of roughly 30 percent -- adequate to detect a gross
        failure of HEUR-001 and explicitly NOT adequate to confirm the constant,
        which is stated rather than left to be inferred.
    - metric: >-
        P5 -- ABSTRACT-GROUP (CURVE-FREE) INSTANTIATION: (C1), (C2) and (C3)
        re-derived and re-executed on the integers modulo N with a synthetic
        representation, no curve anywhere. UNITS: categorical
      direction: different
      minimum_effect: >-
        FORCED to reproduce the rank-1 collapse and both reductions EXACTLY,
        because the arguments contain no curve. BLOCKING FOR ATTRIBUTION: since
        the null is expected to reproduce the result in full, the deliverable
        must be written as a statement about prime-order cyclic groups with a
        named computability caveat, and no artifact may describe the collapse as
        a property of elliptic curves.
    - metric: >-
        P6 -- NULL-1: pairing values on random points of the extension-field
        group that are NOT in the N-torsion. UNITS: pass or fail per value
      direction: different
      minimum_effect: >-
        FORCED: every emitted value must FAIL the N-th-root-of-unity membership
        test. This proves the proportionality check has resolving power rather
        than passing vacuously.
    - metric: >-
        P7 -- NULL-2: a deliberately broken instrument copy with the final
        exponentiation removed. UNITS: categorical
      direction: different
      minimum_effect: >-
        FORCED to BREAK the proportionality check. An instrument that reports
        proportionality with the final exponentiation removed is not measuring
        the reduced pairing at all.
  test_boundary:
    instances:
      - 'at least 20 constructed toy curves with small embedding degrees, p in 16 to 28 bits'
      - 'one constructed full-rational-N-torsion curve, and three cyclic-G controls at the same p'
      - 'CURVE-FREE: the integers modulo N with a synthetic representation'
      - 'random curves over the field of N elements for the smoothness census'
    parameters:
      p: '16 to 28 bits'
      embedding_degrees: 'constructed small values so the extension arithmetic stays feasible'
      point_pairs_per_curve: 'at least 200, swept so the exponent variance can be checked'
      N_for_reduction: '{2^20, 2^24, 2^28}'
      smoothness_bound: 'B = N^{1/4}, u = 4'
      smoothness_samples: 'at least 10^4 curves per N, orders computed exactly'
    implementation: >-
      A pairing instrument with explicit final exponentiation, plus an
      independent on-curve certificate verifier sharing no state with the solver.
      NO ATTACK IS RUN: the only scalar recovered is in the toy calibration and
      by a disclosed harness cheat. Mandatory matched baselines are Pollard rho
      with distinguished points and BSGS on every toy instance, with the
      automorphism-discounted variant on special-j instances, per this question
      own constraints; anomalous and smooth-order instances are excluded.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 8
      maximum_memory_gb: 8
      maximum_runs: 120
  falsification_conditions:
    - >-
      F1 ELEMENTARY ALGEBRA CONTRADICTED. A bilinear map on G x G with G cyclic
      of prime order that is not of the form [xy] h. (C1) is false; this would be
      an instrument or definition error and is reported as such.
    - >-
      F2 PROVES TOO MUCH. Proportionality holds on the full-rational-torsion
      curve, where rank 4 is predicted. The argument proves too much and the
      record is void.
    - >-
      F3 REDUCTION FAILS. A demonstration with a found smooth auxiliary group and
      a genuine CDH oracle that fails to certify the scalar. Either the reduction
      is misapplied or the recalled statement is wrong; the record is superseded
      after the source is opened.
    - >-
      F4 HEURISTIC FAILS. The B-smooth fraction is inconsistent with the Dickman
      prediction at all three N. (C3) becomes conditional on an unvalidated
      assumption and is reported as such. (C2) is unaffected.
    - >-
      F5 UNEXHIBITED, NOT FAILED. No smooth auxiliary group is found within
      budget at some N, or the full-rational-torsion construction does not
      produce a curve in budget. INFRASTRUCTURE outcomes, reported as
      UNEXHIBITED, never as evidence about (C1) to (C5).
    - >-
      F6 ATTRIBUTION. The abstract-group instantiation reproduces everything,
      which is the PREDICTED outcome. The deliverable is a statement about
      prime-order cyclic groups with a computability caveat, and no
      elliptic-curve language may be used for the collapse itself.
    - >-
      F7 EVERYTHING HOLDS. The three residual cells of H-PAIR-713241 are shown to
      be one cell and that cell is the goal; the forward guidance retires the
      second half of this question into the existing one-point-map taxonomy; and
      the closure carries an exhibited edge at rank 4. NOTHING in this outcome
      changes the status of H-PAIR-713241, which only a Coordinator decision may
      do.
  interpretation_limits:
    - >-
      A CLOSURE BY DIMENSION COUNT, NOT A HARDNESS RESULT. It moves no exponent,
      mounts no attack, and makes no curve safer than an embedding-degree screen
      already does. What it changes is which questions remain open in the lane.
    - >-
      Scoped to ordinary prime-field curves and prime cyclic G. On supersingular
      curves and on full rational torsion the rank is larger and the families are
      genuinely different, which (C5) records and measures.
    - >-
      The lift from CDH to the discrete logarithm rests on a RECALLED reduction
      that no agent in this program has opened, plus HEUR-001. Until the source is
      read the lift is STATED and not relied on; (C2) needs neither.
    - >-
      THE ARGUMENT IS CURVE-FREE. (C1), (C2) and (C3) are facts about cyclic
      groups of prime order and are reproduced exactly by an abstract-group null.
      Describing the collapse as a property of elliptic curves would attribute a
      group-theoretic fact to a curve, which is the failure mode this batch
      exists to prevent.
    - >-
      The reduction demonstration uses an oracle that was GIVEN the discrete
      logarithms. It is soundness-losing by construction, it attacks nothing, and
      every artifact carries that sentence.
    - >-
      Every measured number is toy tier, scoped to the tested curves, embedding
      degrees, N, smoothness bound and budget. No transfer to cryptographic size
      is claimed or licensed.
    - >-
      NOVELTY IS NOT ADJUDICATED. The core observation of (C3) is external and
      only its abstract was read, by another agent, in another session; what is
      new to this corpus is the PLACEMENT -- that the lane three residual cells
      are one cell and that cell is the goal.
