hypothesis:
  id: H-ICINV-b81659
  question_id: RQ-ICINV-475b5e
  title: >-
    The number r of F_p-roots of x^3 + a x + b is a gauge-invariant, class-varying, locally computable
    invariant that stratifies the Semaev solving-degree proxy within a single F_p-isogeny class, and
    the cause is non-transversality of the Semaev ideal at 2-torsion x-coordinates -- so the effect
    amplifies at a 2-torsion-loaded factor base and vanishes at an excluded one
  statement: >-
    Let E/F_p be ordinary with 4 dividing #E(F_p) and a non-trivial 2-volcano, and let
    r = #{x in F_p : x^3 + a x + b = 0}, so #E[2](F_p) = 1 + r and r lies in {0, 1, 3}. Whether r = 0
    is fixed by the isogeny class (it holds exactly when #E(F_p) is odd, a Tate invariant), but the
    split between r = 1 and r = 3 is NOT: r = 3 holds exactly when (pi - 1)/2 lies in End(E), a
    condition on the 2-volcano level, which varies within a class. r is also GAUGE-INVARIANT, since
    (a,b) -> (u^4 a, u^6 b) scales the roots by u^2 without changing their number, and TWIST-INVARIANT.
    THE HYPOTHESIS ASSERTS (i) that both strata occur inside at least one reachable toy class; (ii)
    that the Groebner solving-degree PROXY differs between the r = 3 and r = 1 strata of the SAME class
    by at least one full degree, outside the gauge interval, in at least 2 of 3 independent classes,
    AT A DELIBERATELY 2-TORSION-LOADED FACTOR BASE; (iii) that the contrast FALLS inside the gauge
    interval at a factor base EXCLUDING 2-torsion x-coordinates, which is what attributes it to
    non-transversality rather than to volcano level; and (iv) that the effect DECAYS at least as fast
    as 1/B in factor-base size. NOTHING HERE BEARS ON THE ECDLP IN G: r is a 2-part invariant and N is
    a large prime, so by Pohlig-Hellman hygiene the 2-part is irrelevant to the discrete logarithm. The
    claim is about a RELATION-COLLECTION cost proxy only.
  mechanism: >-
    Two independent routes connect r to algebraic attack cost. (C1) RAMIFICATION OF THE x-MAP: the
    degree-2 map x : E -> P^1 ramifies exactly over the roots of f and over infinity, so a factor base
    V of x-coordinates contains r points with a SINGLE preimage (y = 0) and |V| - r points with two;
    relation counting, sign handling and the negation symmetry treat those differently. (C2)
    NON-TRANSVERSALITY OF THE SEMAEV IDEAL: the relation locus S_3(x1, x2, x(R)) = 0 meets the vertical
    line x1 = v non-transversally exactly when the quadratic in x2 has a double root, i.e. when its
    discriminant vanishes; by the classical identity disc_{x3} S_3 = 16 f(x1) f(x2) together with the
    symmetry of S_3, that happens exactly when f(v) = 0. So the ideal generated by S_3 together with
    the factor-base equations FAILS TO BE RADICAL precisely at factor-base elements that are 2-torsion
    x-coordinates, and the number of such elements is a draw from a population of size r.
    Non-radicality inflates the Groebner staircase, which is what a solving-degree proxy measures. BOTH
    ROUTES PREDICT THE SAME STRATIFICATION and predict it to be TWO-LEVEL (r = 1 versus r = 3), not a
    continuum, which is a strong falsifiable shape prediction that noise does not produce. The
    quantitative consequence that makes the design honest: under (C2) with a uniformly random factor
    base, the expected number of 2-torsion elements in V is rB/p, which is BELOW 1 for every B and p in
    the toy range -- so (C2) predicts a SMALL effect at a random factor base, and a LARGE observed
    effect at a random V would be EVIDENCE AGAINST (C2) rather than for it.
  assumptions:
    - >-
      Lenstra's structure theorem E(F_q) isomorphic to O/(pi - 1) for ordinary E with End = O. Cited as
      the EXPLANATION of why the group structure varies within a class; the executor must re-verify the
      citation before it appears in a write-up. The measurement does NOT depend on it operationally,
      since r is obtained by factoring the cubic.
    - >-
      r lies in {0, 1, 3} for non-singular f, #E[2](F_p) = 1 + r, and r = 0 exactly when #E(F_p) is odd,
      which is a class invariant. Elementary.
    - >-
      r is gauge-invariant and twist-invariant. Verified by direct substitution and re-verified
      computationally.
    - >-
      disc_{x3} S_3(x1, x2, x3) = 16 f(x1) f(x2), together with the symmetry of S_3 in its three
      variables. CLASSICAL and marked for symbolic re-derivation before mechanism (C2) is used; if it
      fails, (C2) is WITHDRAWN and the hypothesis stands or falls on (C1) alone.
    - >-
      The Groebner outputs are implementation-bound proxies. They are never reported as degrees of
      regularity, and any stratification found in them is a statement about this solver at this scale.
    - >-
      Toy scale, p at most 2^14, claim tier toy.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is an EMPIRICAL stratified measurement; it proves no theorem and constructs no
      bound. Its two mechanistic claims are proof-oriented and are owned elsewhere with their own maps:
      the transversality derivation belongs to IDEA-20260807-427cf3 and the relation-count derivation to
      IDEA-20260807-0ff796. What this hypothesis adds is the contrast, the stratification variable and
      the mechanism-discriminating arm. Its one derived quantity -- the forced value rB/p for the
      expected number of 2-torsion elements in a random factor base -- is stated before the run as
      pre-registration arithmetic rather than as a proof obligation.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        STRATUM OCCUPANCY. Within a fixed F_p-isogeny class whose 2-volcano has height at least 1, both
        values r = 1 and r = 3 occur, and the fraction of members with r = 3 is bounded away from 0 and
        1 as p grows.
      random_model_justification: >-
        The rigorous ingredient is the volcano structure: E[2] contained in E(F_p) holds exactly at the
        levels where (pi - 1)/2 lies in End(E), so the strata are unions of volcano levels, and levels
        are non-empty by the standard structure of the ell-isogeny graph for ordinary curves. The
        HEURISTIC part is the FRACTION, which imitates the classical expectation that class-group
        elements distribute evenly over the levels weighted by the class numbers h(D_0 f'^2).
      supporting_results:
        - >-
          Standard 2-volcano structure for ordinary curves; the level condition (pi - 1)/2 in End(E) is
          elementary given the order.
      validation_experiment_ids:
        - EXP-ICINV-c8f2ae
      falsification_condition: >-
        No class at reachable p contains both strata with at least 8 members each. Then the hypothesis's
        PRECONDITION fails at toy scale; that is reported as a SCOPE limit with the largest p reached,
        never as evidence that r has no effect.
    - id: H2
      formal_statement: >-
        RANDOM FACTOR-BASE 2-TORSION COUNT. The number of 2-torsion x-coordinates in a uniformly random
        factor base of size B is Binomial(B, r/p) with mean rB/p, so mechanism (C2)'s effect on a random
        factor base scales as rB/p and is below one element for every (B, p) in the toy range.
      random_model_justification: >-
        EXACT, not heuristic, for a uniformly random V: the r roots are a fixed set of size at most 3
        inside F_p. The heuristic element is only that the program's factor bases, built from hashed
        seeds, are close enough to uniform for this to hold.
      supporting_results:
        - >-
          Elementary counting; the only assumption is uniformity of the harness's factor-base generator.
      validation_experiment_ids:
        - EXP-ICINV-c8f2ae
      falsification_condition: >-
        The empirical count of 2-torsion elements over at least 1000 generated factor bases per (p, B)
        departs from Binomial(B, r/p) by exact chi-square. That means the harness's factor-base
        generator is not uniform, which is an instrument finding of independent value.
  structural_ingredients:
    - description: >-
        Lenstra's complex-multiplication structure theorem, which explains why the group decomposition
        varies within a class while the order does not.
      citation: >-
        H. W. Lenstra Jr., "Complex multiplication structure of elliptic curves", J. Number Theory 56
        (1996)
      provenance: recalled
      verified_by: null
      role: explanation of within-class variation; the measurement does not depend on it
    - description: >-
        The classical identity disc_{x3} S_3 = 16 f(x1) f(x2), which localises non-transversality of the
        Semaev ideal at 2-torsion x-coordinates.
      citation: >-
        Classical; marked for symbolic re-derivation in this program rather than quotation.
      provenance: recalled
      verified_by: null
      role: mechanism (C2); withdrawn if the re-derivation fails
    - description: >-
        Pohlig-Hellman and prime-order-subgroup hygiene, which is why the 2-part is irrelevant to the
        ECDLP in the prime-order subgroup G.
      citation: KN-TECH-030
      provenance: internal
      verified_by: idea-generator novelty screen 2026-08-07
      role: scope boundary; the reason no ECDLP claim follows
    - description: >-
        The implementation-bound nature of the program's Groebner proxies, stated by the measuring module
        itself.
      citation: harness/semaev.py, measure_s3_decomposition and its docstring
      provenance: internal
      verified_by: idea-generator novelty screen 2026-08-07, module read in full
      role: the measurement instrument and its own disclaimer
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: groebner_max_degree_contrast_r3_minus_r1_loaded
      direction: higher
      minimum_effect: >-
        At least 1 full degree, outside the at-least-8-draw gauge interval, in at least 2 of 3
        independent classes, at a DELIBERATELY 2-torsion-loaded factor base. Anything smaller is not
        resolvable against solver noise at this scale and is declared INCONCLUSIVE IN ADVANCE, so
        neither branch can be reached by rounding.
    - metric: groebner_max_degree_contrast_r3_minus_r1_excluded
      direction: different
      minimum_effect: >-
        PRE-REGISTERED: the contrast must FALL to inside the gauge interval at a factor base excluding
        2-torsion x-coordinates. If it does not, mechanism (C2) is REFUTED and the hypothesis must either
        attribute the effect to (C1) with a new discriminating arm or report an unexplained correlation
        and say so.
    - metric: effect_size_versus_factor_base_size_B
      direction: lower
      minimum_effect: >-
        Must decay at least as fast as 1/B over at least 4 values of B. A flat or growing effect in B is
        the artifact tell and forces the line to halt for instrument review rather than to report.
    - metric: single_stratum_null_class_contrast
      direction: different
      minimum_effect: >-
        Must return NO effect on a single-stratum class split arbitrarily into two groups of the same
        sizes as the real strata. This verdict is computed and reported BEFORE the real arm's verdict is
        looked at.
    - metric: gauge_invariance_of_r
      direction: different
      minimum_effect: >-
        r is unchanged across at least 8 gauge draws per member and across the quadratic twist, verified
        on at least 100 curves. Any variation means r is not the invariant claimed and the whole design
        is void.
    - metric: random_factor_base_2torsion_count
      direction: different
      minimum_effect: >-
        Binomial(B, r/p) with mean rB/p, checked by exact chi-square over at least 1000 generated factor
        bases per (p, B). A departure is an instrument finding about the harness's generator.
  test_boundary:
    instances:
      - >-
        Complete F_p-isogeny classes at p in [2^12, 2^14], with r computed for every member; retained
        only if BOTH strata occur with at least 8 members each
      - >-
        Single-stratum classes (trivial 2-volcano, or odd order where r = 0 throughout) as the matched
        null, split arbitrarily into two groups of the same sizes as the real strata
      - >-
        Per member, at least 8 gauge representatives, since r is gauge-invariant by construction
    parameters:
      prime_range: p in [2^12, 2^14], with p ~ 2^13 for the enumeration stage
      classes_retained: at least 3 independent classes containing both strata
      minimum_stratum_size: 8 members
      factor_base_types: random, 2-torsion-EXCLUDED, 2-torsion-LOADED
      factor_base_sizes_B: at least 4 values, for the decay fit
      seeds_per_vertex: at least 5, so within-vertex variance is known before any between-vertex contrast
      gauge_draws_per_member: at least 8, reported as an interval with the derived 2/n false-positive rate
    implementation: >-
      Class enumeration and r computation by cubic factorisation; harness/semaev.py's
      measure_s3_decomposition for the cost proxies, at a COMMON factor base and a TRANSPORTED target
      with a re-verified certificate. Class selection is on r ALONE and never on the cost proxy, which
      would be circular.
    budget:
      wall_clock_seconds: 14400
      cpu_hours: 12.0
      maximum_memory_gb: 16
      maximum_runs: 30
  falsification_conditions:
    - >-
      No class at reachable p contains both strata with at least 8 members each. The PRECONDITION fails
      at toy scale; reported as a SCOPE limit with the largest p reached, never as evidence that r has
      no effect.
    - >-
      The symbolic identity disc_{x3} S_3 = 16 f(x1) f(x2) fails, or S_3 is not symmetric as assumed.
      Mechanism (C2) is WITHDRAWN and the mechanism-discriminating arms lose their interpretation.
    - >-
      The single-stratum null class shows an effect. The rule fires on its own null; nothing is reported
      and measurement halts.
    - >-
      The effect does not decay in B. Not (C2), probably apparatus; halt for instrument review.
    - >-
      The contrast SURVIVES the 2-torsion-EXCLUDED factor base at full size. The named mechanism is wrong
      even if the correlation is real, and the honest report is "an unexplained within-class
      stratification by r", which is weaker but still reportable and must NOT be dressed as mechanism
      (C2).
    - >-
      OUTCOME F: no stratification at any factor-base loading. The lane's one named, gauge-invariant,
      class-varying mechanistic cause does not move the cost proxy. This is the EXPECTED outcome and it
      is a NEGATIVE WITH A NAMED MECHANISM, which is the deliverable the closure standard asks for.
  distinguishable_outcomes:
    OUTCOME_S_stratified_and_mechanistic: >-
      The proxy differs between strata by at least one full degree at a loaded factor base, outside the
      gauge interval, in at least 2 of 3 classes, AND the contrast falls inside the gauge interval at an
      excluded factor base, AND the effect decays at least as 1/B. MEANING: a genuine within-class cost
      difference exists whose cause is named and mechanistic; and it is LOCALLY DETECTABLE, since an
      attacker computes r in O(log^2 p) by factoring a cubic and hill-climbs along the 2-volcano in
      O(log p) steps. The remaining question is whether the prize is a constant or an exponent, and the
      pre-registered expectation is a constant.
    OUTCOME_S_prime_unexplained_correlation: >-
      The contrast is real at a loaded factor base but SURVIVES the excluded one. MEANING: mechanism
      (C2) is refuted; the honest report is an unexplained within-class stratification by r, which is
      weaker and must not be dressed as (C2). A new discriminating arm would be needed to attribute it to
      (C1).
    OUTCOME_F_flat: >-
      The proxy is indistinguishable across strata at every factor-base loading. MEANING: the lane's one
      class-varying, gauge-invariant, mechanistically motivated cause does not move the cost. This is a
      much stronger negative than "we measured variance and found none" -- it is a negative against a
      NAMED mechanism, which is the closure standard, and it is the expected outcome.
    apparatus_artifact: >-
      The effect does not decay in B, or the single-stratum null class shows an effect. MEANING: the rule
      fires on its own null or shows the artifact tell; nothing is reported and the line halts for
      instrument review.
    mechanism_withdrawn: >-
      The disc identity fails to re-derive symbolically. MEANING: (C2) is withdrawn before any Groebner
      run, at a cost of minutes; the design either proceeds on (C1) alone with a new discriminating arm
      or is superseded.
    precondition_unreachable: >-
      No reachable class contains both strata with at least 8 members each. MEANING: a SCOPE limit, with
      the largest p reached reported; never a negative about r.
    solver_artifact: >-
      A proxy difference appears with NO corresponding difference in a support- or ideal-level quantity.
      MEANING: evidence about sympy at this scale, reported in those words and never as a
      degree-of-regularity result.
  interpretation_limits:
    - >-
      Nothing here bears on the ECDLP in G. r is a 2-part invariant and N is a large prime; by
      Pohlig-Hellman hygiene the 2-part is irrelevant to the discrete logarithm. The claim is about a
      RELATION-COLLECTION proxy only, and confusing the two would be exactly the error the lane's
      admissibility filter exists to prevent.
    - >-
      A positive OUTCOME S at toy scale is a statement about this solver, this encoding, this p range and
      these classes. It is NOT a degree-of-regularity result and must never be summarised as one.
    - >-
      Passing the reachability gate (r is locally computable in O(log^2 p)) establishes REACHABILITY, not
      benefit. A reachable minimiser of a functional that differs by a constant is baseline calibration,
      not an attack.
    - >-
      The Lenstra citation supports the EXPLANATION of why r varies; the measurement of r does not depend
      on it, so a citation failure weakens the explanation and not the measurement.
    - >-
      The hidden cost of any positive outcome is that it lives entirely inside "at a factor base loaded
      with 2-torsion x-coordinates". A random factor base contains rB/p < 1 such elements at every toy
      parameter, so a real attacker would see nothing without deliberately loading -- and deliberate
      loading SHRINKS the usable factor base, a cost that must be charged.
    - >-
      r correlates with volcano level, which correlates with the class number and the number of rational
      ell-isogenies. Any effect attributed to r could be an effect of level; only the
      exclusion/inclusion arms separate them, because level does not change when the factor base is
      re-loaded but the (C2) mechanism does.
