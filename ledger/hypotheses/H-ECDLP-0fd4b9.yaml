# No Magma/Sage success path. No inverse solving. No exponent claim.
# =============================================================================
hypothesis:
  id: H-ECDLP-0fd4b9
  question_id: RQ-ECDLP-002
  source_idea: IDEA-20261001-e1fcbf
  experiment_id: EXP-ECDLP-065bf1
  goal_id: GOAL-ECDLP-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-c6641c
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-c6641c
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-c6641c
  proposed_by: coordinator

  title: >-
    Toy F_17 known-scalar forward presentations: affine vs projective encodings
    differ in size/auxiliaries, and incidence-matched random coefficients can
    change Jacobian rank, with twin width/rank meters

  statement: >-
    CLAIM (measurement / public known-scalar forward presentations only;
    NO ATTACK; NO SOLVE; NO EXPONENT). Fix y^2 = x^3 + x + 1 over F_17 with
    public generator G=(0,1) and public scalars k∈{2,3}. Build two documented
    equation presentations of the forward computation [k]G: (i) affine
    Weierstrass successive +G, (ii) the same chain with extra homogeneous
    Z=1 auxiliaries. Twin greedy min-fill width and twin Gaussian Jacobian
    rank must agree. FOR these two frozen cells: either (a) a representation
    diagnostic |Δ|≥1 in {n_vars, width, max_degree, n_aux} between affine
    and projective AND the variable-permutation control preserves graph
    invariants (O-REP-SENSITIVE), OR (b) the incidence-matched random-coeff
    Jacobian rank differs by ≥1 at identical dimensions (O-INCIDENCE-INSUFFICIENT),
    OR (c) both (O-MIXED), OR (d) neither (O-NO-DIFF). NO discrete-log
    recovery. NO ECDLP exponent. Infra failure is O-IMPEDIMENT, never a
    mathematical negative.

  mechanism: >-
    OBJECT: a coordinate-dependent polynomial presentation of a public
    known-scalar forward computation, not a new group object. OPERATION:
    record constraints, evaluate at the public witness, form the primal
    graph (variables as vertices; co-occurrence edges), report a greedy
    min-fill width upper bound, and report Jacobian rank over F_p at the
    witness. Twin meters: independent min-fill scans and independent
    Gaussian elimination. Nearby-object control: reverse variable names
    must preserve n_vars, n_edges, width, and rank. Null-object control:
    same incidence, random nonzero coefficients. Dual arithmetic routes
    (slope vs chord cubic) must agree on [k]G.

  assumptions:
    - All scalars, points, and intermediate values are public and synthetic.
    - Exceptional infinity is excluded; k=2 doubling and k=3 mixed add stay affine-nonsingular on this cell.
    - Width is a greedy upper bound, not certified treewidth, unless matching lower bound equals it.
    - No mathematical speedup is assumed.

  predictions:
    - metric: n_vars_delta
      direction: different
      minimum_effect: '≥1 between affine and projective for O-REP-SENSITIVE (with perm_iso)'
    - metric: jacobian_rank_delta_incidence
      direction: different
      minimum_effect: '≥1 vs random-coeff clone at fixed dimensions for O-INCIDENCE-INSUFFICIENT'
    - metric: twin_agreement
      direction: same
      minimum_effect: width_a=width_b and rank_a=rank_b and dual [k]G agree

  test_boundary:
    instances:
      - 'Stage 0: freeze p=17,A=1,B=1,G,k∈{2,3}, formula, delta_min, k=1 nearby width, dual-route probe'
      - 'Stage 1 authorized: affine vs projective vs perm vs random-coeff on both cells'
    parameters:
      p: 17
      A: 1
      B: 1
      k2: 2
      k3: 3
      G: [0, 1]
      delta_min: 1
      null_seed: 2026100303
    implementation: >-
      Pure Python under experiments/EXP-ECDLP-065bf1/implementation/;
      command surface implementation/run.py driven by trial-plan.json.
      Twin meters in meters.py; dual addition in elliptic.py. No
      Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 1800
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin width or rank meters disagree (O-ARTIFACT).
    - Dual addition routes disagree on [k]G (O-ARTIFACT).
    - Variable-permutation control changes graph invariants or rank (O-ARTIFACT).
    - A width value is labelled exact treewidth without a matching certificate.
    - Rank comparison changes field or matrix definition without disclosure.
    - Claiming an ECDLP solve, inversion, or exponent from these diagnostics.
    - Using Magma/Sage/AUXIN/Bedrock as the success path.

  distinguishable_outcomes:
    - id: O-REP-SENSITIVE
      meaning: >-
        Twin OK; perm_iso; ≥1 cell with representation Δ≥1; no incidence
        rank Δ on any cell. Representation sensitivity documented. No exponent.
    - id: O-INCIDENCE-INSUFFICIENT
      meaning: >-
        Twin OK; perm_iso; ≥1 cell with incidence rank Δ≥1; no representation
        Δ. Incidence does not determine rank. No exponent.
    - id: O-MIXED
      meaning: Twin OK; perm_iso; both representation Δ and incidence rank Δ fire.
    - id: O-NO-DIFF
      meaning: Twin OK; perm_iso; neither diagnostic Δ fires on any cell.
    - id: O-INCONCLUSIVE
      meaning: Underpowered or censored measurement without instrument failure.
    - id: O-ARTIFACT
      meaning: Twin fail, perm_iso fail, witness fail, or post-hoc freeze edit.
    - id: O-IMPEDIMENT
      meaning: Missing Stage-0 freeze, timeout, or crash. Never negative evidence.
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze dual-route OK; not a scientific Stage-1 verdict.

  interpretation_limits:
    - Diagnostic presentation complexity is not ECDLP complexity.
    - Finite width bounds and ranks establish no asymptotic law.
    - No exact treewidth claim without matching certificates.
    - Known public witnesses remove uncertainty absent in inversion.
    - Toy F_17 evidence does not transfer to cryptographic curves.

  heuristic_assumptions:
    - id: HEUR-ECDLP-e1fcbf-H1
      formal_statement: >-
        A prespecified two-cell toy ladder can exhibit representation
        sensitivity (nonzero Δ in size/width/degree/aux) worth documenting.
      random_model_justification: >-
        No representativeness of cryptographic curves is assumed; H1 is a
        finite-sample documentation claim only.
      supporting_results:
        - IDEA-20261001-e1fcbf
      validation_experiment_ids:
        - EXP-ECDLP-065bf1
      falsification_condition: >-
        Twin OK and perm_iso and every cell has all representation Δ=0
        (read as O-NO-DIFF or O-INCIDENCE-INSUFFICIENT, not protocol fail).
    - id: HEUR-ECDLP-e1fcbf-H2
      formal_statement: >-
        Jacobian rank at a public witness can differ from the rank of an
        incidence-matched random-coefficient matrix of the same dimensions.
      random_model_justification: >-
        Equal incidence graphs can encode different linearizations; random
        nonzero coefficients are the null object of the same shape.
      supporting_results:
        - IDEA-20261001-e1fcbf
      validation_experiment_ids:
        - EXP-ECDLP-065bf1
      falsification_condition: >-
        Twin OK and every cell has incidence rank Δ=0 (does not by itself
        void a representation finding).

  asymptotic_claim:
    problem: Prime-field ECDLP (RQ-ECDLP-002) — diagnostics only
    prior_best: Generic rho square-root; this hypothesis asserts no algorithm
    time_exponent: NO EXPONENT MOVED. Measurement of presentation statistics.
    memory_exponent: NO EXPONENT MOVED.
    hidden_cofactor: Construction, graph, rank, replay, and storage costs charged in the run, not in an ECDLP exponent.
    claim_kind: diagnostic_measurement

  proof_search_map:
    bottleneck: Distinguishing intrinsic arithmetic information from presentation-induced sparsity.
    baseline_embedding:
      parameter_slice: Toy F_17 forward computations with public known scalars k=2,3 only.
      reproduction_check: Dual addition routes agree on [k]G; each constraint vanishes at the public witness; check.py replays [2]G dual routes.
    observation_collision:
      observable: Size, degree, greedy width, and Jacobian rank of named presentations.
      distinct_preimage_search: >-
        Permutation isomorphism and incidence-matched random coefficients.
        Equal graphs need not imply equal ranks. Not a group-preimage search.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Affine vs homogeneous Z=1 encodings of the same forward chain.
        predicted_gain: No gain assumed; quantify diagnostic Δ and costs.
    quantifier_order: >-
      FORALL frozen cells {k=2,k=3} on this curve: report diagnostics before
      any interpretation. NOT CLAIMED: all curves, all encodings, any inversion.
    method_ceiling:
      strongest_certifiable_claim: Reproducible finite presentation statistics and greedy width upper bounds on the sampled public computations.
      nearby_object_control: >-
        k=1 dummy (width ≤1); variable permutation (invariants preserved).
        A method reporting huge width on k=1 or broken perm_iso proves too much.
    proof_obligations:
      - claim: Dual addition routes agree on public [k]G.
        responsibility: correctness
      - claim: Twin width and rank meters agree.
        responsibility: baseline
      - claim: Constraints vanish at the recorded public witness.
        responsibility: correctness
      - claim: Nothing asserted at an ECDLP exponent; no inverse solving.
        responsibility: scope
    not_applicable_reason: No ECDLP improvement or new group-object construction is claimed; this map governs diagnostic validity only.

  proves_too_much:
    objects:
      - id: PTM-K1
        object: k=1 dummy presentation with a single affine coordinate constraint
        known_false_conclusion: greedy width > 1
        failure_signature: Stage-0 k1_nearby.width > ptm_k1_max_width
      - id: PTM-PERM
        object: reverse-variable clone of the affine presentation
        known_false_conclusion: changed n_vars, n_edges, width, or rank
        failure_signature: perm_iso false while twin otherwise OK

