hypothesis:
  id: H-PAIR-79f258
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  source_idea_ids:
    - IDEA-20261006-2cd127
  added: '2026-10-07'
  status: specified
  proposed_by: coordinator
  title: >-
    Image of x(P+T) times x(Q) on y^2 = x^3 - x over F_17, against the
    field shift and against y^2 = x^3 + x
  statement: >-
    Let E be y^2 = x^3 - x over F_17 and let T = (1, 0). Let S be the
    set of ordered pairs of affine points (P, Q) on E with P not equal
    to T. Let I_ell be the number of distinct values of x(P+T) times
    x(Q), and let I_shift be the number of distinct values of
    (x(P)+1) times x(Q), both products in F_17. Let b be the maximum,
    over field elements m that occur as x(P) times x(Q), of the number
    of distinct values x(P+T) times x(Q) on the pairs with that
    product equal to m. The prediction taken from IDEA-20261006-2cd127
    is that I_shift minus I_ell is at least 2 and that b is at least 2.
    On E_0 given by y^2 = x^3 + x with T_0 = (0, 0), the same image
    gap is at most 1. The concrete negative is that the instrument
    checks pass and at least one of those three comparisons fails:
    the gap on E is less than 2, or b is 0 or 1, or the gap on E_0 is
    at least 2. The rho exponent stays 1/2. No discrete logarithm is
    predicted.
  mechanism: >-
    The representation is the product of the two Weierstrass
    x-coordinates on E times E. The operation is translation by T on
    the first factor only. The class is branching: the chord-and-tangent
    sum reads y(P), which the product discards, so one product can have
    several images under the translation. The field shift that sends x
    to x+1, on the same pairs, is the null operation. E_0 with its own
    order-2 point is the second curve of the same shape. The open
    numbers are the image gap and b. No walk is run and no summation
    polynomial is built.
  assumptions:
    - >-
      T = (1, 0) lies on y^2 = x^3 - x and has order 2. The driver
      recomputes both and treats a failure as an instrument failure.
    - >-
      T_0 = (0, 0) lies on y^2 = x^3 + x and has order 2. The driver
      recomputes both.
    - >-
      Both cubics are of the form x^3 + A x with A not 0, in
      characteristic not 2. The driver checks that 17 is odd and that
      both A coefficients are nonzero in F_17.
    - >-
      Addition is the chord-and-tangent law. A pre-simplified rational
      function for translation by T is not substituted.
  proof_search_map:
    not_applicable_reason: >-
      This is a branching measurement of one product on one prime
      field, not a proof that a collision-structure exponent changes.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: I_shift minus I_ell on E with T = (1, 0)
      direction: higher
      minimum_effect: at least 2
    - metric: branching b on E
      direction: higher
      minimum_effect: at least 2
    - metric: image gap on E_0 with T_0 = (0, 0)
      direction: different
      minimum_effect: at most 1, while E's gap is at least 2
  test_boundary:
    instances:
      - y^2 = x^3 - x over F_17, T = (1, 0), pairs with P not equal to T
      - y^2 = x^3 + x over F_17, T_0 = (0, 0), pairs with P not equal to T_0
    parameters:
      p: 17
      minimum_gap: 2
      minimum_branching: 2
      control_gap_maximum: 1
    implementation: experiments/EXP-PAIR-26acd8/implementation/run.py
    budget:
      maximum_runs: 1
  falsification_conditions:
    - >-
      The instrument checks pass and I_shift minus I_ell is less than 2.
    - >-
      The instrument checks pass and b is 0 or 1.
    - >-
      The instrument checks pass and the image gap on E_0 is at least 2.
      The field shift then produces a gap of that size on both curves,
      and the claim that E is special fails.
    - >-
      T is not order 2, or P+T is the point at infinity for some P not
      equal to T, or the same happens on E_0. That is an invalid
      instrument, not this falsification.
  interpretation_limits:
    - >-
      A confirmed gap is a counted image difference at p = 17. It is
      not an exponent improvement over rho.
    - >-
      A negative closes only these two equations at p = 17 under this
      translation and this field shift. The source idea's F_29 repeat
      is outside this contract.
    - >-
      If b is 1 the branching label is wrong for this instance. That
      is a negative, not a license to reclassify after seeing the data.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        On E(F_17) given by y^2 = x^3 - x, the image of x(P+T) times
        x(Q) is at least 2 smaller than the image of (x(P)+1) times
        x(Q) on the same pairs, and the branching b is at least 2,
        while the same image comparison on y^2 = x^3 + x with
        T = (0, 0) shrinks the image by at most 1.
      random_model_justification: >-
        The chord-and-tangent law is a rational function of x and y.
        No theorem opened in this session bounds the image of the
        product. The size gap imitates a uniformity statement that was
        not proved here.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PAIR-26acd8
      falsification_condition: >-
        The instrument checks pass and the gap on E is less than 2, or
        b is at most 1, or the gap on E_0 is at least 2. The source
        idea's F_29 repeat is outside this contract. A gap that appears
        only at p = 17 would speak to stability, and this contract does
        not score that repeat.
  structural_ingredients:
    - description: >-
        A generic-group discrete logarithm on a prime-order group needs
        Omega(sqrt(p)) group operations. This hypothesis claims
        exponent difference 0 against that bound.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-07 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent ceiling this image gap does not move
    - description: >-
        Semaev summation polynomials vanish on x-coordinates of points
        that sum to infinity. This hypothesis does not form S_m.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-07 opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: adjacent decomposition object, not the measured product
  status_note: >-
    Specified and paired with EXP-PAIR-26acd8, whose status is
    review_required. No run has been launched. The pairs were not
    enumerated in this session.
