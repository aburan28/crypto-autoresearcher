# =============================================================================
# H-CERTBIN-6e6287 -- HOLD-X1 theta(m) ladder at the per-target cap locus.
# Specified from IDEA-20260926-4b65e3 under RQ-CERTBIN-836ce2 /
# GOAL-ECDLP2M-001. Approved DEC-20261002-08c3f8.
#
# Certificate shortlist HOLD-X1 (DEC-20260928-63addc rank 3). Stage 0
# content (corrected oracle-budget column + (1/2-1/m) line) was absorbed
# into S1 (EXP-BINSTD-a222b4 / H-BINSTD-14f77e); this hypothesis owns
# Stages 1-3: cap-locus cells, loop+closure+null measurement, theta fit.
# ZERO RUNS in this design packet. No AUXIN. No Bedrock. No curve attack /
# exponent claim. Claim tier: cost-model measurement. Stages 0-3 authorized
# (Stage 0 = re-verify absorbed column as blocking gate).
# =============================================================================
hypothesis:
  id: H-CERTBIN-6e6287
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-4b65e3
  experiment_id: EXP-CERTBIN-fad576
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-08c3f8
  status: approved
  proposed_by: coordinator
  title: >-
    At the per-target cap locus, fitted theta(m) of the pure-Python
    degree-D closure oracle on n in {17,19,23,29,31}, m in {2,3,4}, sits
    at or above the line 1/2 - 1/m (or below it with a non-growing degree
    profile), with the (m-1)-fold loop calibrating at 1 - 1/m and the
    same-support null reading the generic MQ side

  statement: >-
    CLAIM (cost-model measurement; HOLD-X1; NO ATTACK). Setting: binary
    fields F_{2^n}, n in {17,19,23,29,31}; CERTBIN ordinary and Koblitz
    curves with prime-cofactor odd-order subgroups; m in {2,3,4};
    V = {deg < d_cap} with d_cap = ceil((n + log2 m!)/m). HYPOTHESIS:
    (S0) the absorbed Stage-0 corrected oracle-budget column of
    IDEA-20260926-4b65e3 claims (A)-(C) and the (1/2 - 1/m) line
    recompute within 0.5 bit of the S1-absorbed figures (blocking).
    (S1) Cap-locus cells have sat_fraction in [0.5, 0.75] under the exact
    (m-1)-fold loop over 200 subgroup targets (or after one d_cap re-tune).
    (S2/S3) Fitted theta_loop = 1 - 1/m within 0.05 (instrument
    calibration); theta_closure vs line 1/2 - 1/m is either LEAD (interval
    entirely below the line at m in {3,4} over >=4 n, non-growing degree
    profile, theta_null above the line) or NEGATIVE (at/above the line or
    growing profile). CLAIM TIER: measurement. NO exponent at n=131. NO
    ECC2K-130 break. NO Magma/Sage/AUXIN. WDSat/CaDiCaL/msolve declared
    missing (pure-Python closure only). Semaev 2015 is named as the kind
    of claim SEMBIN adjudicates, not adjudicated here.

  mechanism: >-
    OBJECT FRAME. Representation R1 (Boolean coordinates of the m
    factor-base abscissae in a basis of V). Operation set Sigma =
    {Frobenius, negation} plus Class-I partial-action translation by
    factor-base elements. Tracked object: per-attempt decomposition cost
    C at d = d_cap(n,m), fitted as C = 2^{theta(m) n + o(n)}, against the
    line 1/2 - 1/m from the per-target-cap cost model. Trichotomy: Class I
    for the relation vector; the cost-model correction is coordinate-
    free arithmetic under the finding's model. Lossy projection: degree-D
    truncated mutant closure W_D discards consequences above D;
    Sigma-compatible by definition of W_D. WHAT IS NEW relative to
    KN-FIND-aa2efc (linear oracle-budget column) and the absorbed Stage 0
    (corrected column as arithmetic): the first measured theta(m) at
    m in {3,4} on the cap locus with loop calibration, same-support null,
    and degree profiles. Charged stages: decomposition oracle cost at toy
    n — not an ECDLP solve at n=131.

  assumptions:
    - >-
      Stage 0 content of IDEA-20260926-4b65e3 claims (A)-(C) was absorbed
      into S1 (EXP-BINSTD-a222b4 / H-BINSTD-14f77e under DEC-20260928-63addc);
      this contract re-verifies those figures as a blocking gate and does
      not re-author the S1 goal head.
    - >-
      The finding's model (relations = B, LA = m B^2 sparse, group order
      2^131 for the decomposition count) is the one corrected; negation and
      the Z/4 class move constants by at most 2 bits and are disclosed, not
      applied.
    - >-
      OFF-LIMITS: F2 family only; KN-OPEN-020 subspace-base class inherited.
    - >-
      Executable work is toy-tier n <= 31, m in {2,3,4} only; n=131 figures
      are arithmetic + H1/H2 only.
    - >-
      WDSat/CaDiCaL/msolve are declared missing; Stage 2 (ii) is the
      pure-Python closure only and says so. S_4 and S_5 builders are NEW
      (~200 lines) under this experiment's write_scope.
    - >-
      Amazon Bedrock is prohibited. No AUXIN provisioning.

  proof_search_map:
    bottleneck: >-
      The cost exponent theta(m) of the decomposition oracle at the cap
      locus against the line 1/2 - 1/m; the (m-1)-fold loop sits at
      theta = 1 - 1/m exactly and is the baseline every measured oracle
      must beat by 2^{n/2} to matter.
    baseline_embedding:
      parameter_slice: >-
        C = 1 reproduces the finding's floors (A); m = 2 at n = 17 and 19
        reproduces RC-1 and the n = 19 cell as cap-locus cells with sat
        fraction near 1 - 1/e (D); the (m-1)-fold loop reproduces
        IDEA-20260904-96c4f3's closed form on every cell.
      reproduction_check: >-
        Stage 0 re-verifies the four floors at m = 2..5 to two decimals and
        the corrected budgets within 0.5 bit of the absorbed S1 figures;
        Stage 2 (i) loop operation counter within [0.95, 1.1] of
        2^{(m-1)d}/(m-1)!; Stage 1 sat fraction against 1 - exp(-mu) under
        the cell's conventions.
    observation_collision:
      observable: >-
        The pair (measured oracle cost at d_cap(n, m), fitted theta(m))
        per solver, with degree profile.
      distinct_preimage_search: >-
        A low fitted theta could come from (i) a genuine structural
        speed-up of the descended system, or (ii) a solver whose cost is
        polynomial at toy degrees only because the solving degree has not
        yet started to grow (KN-OPEN-3c8f51 item B). Separated by the
        degree profile per cell and by whether theta falls as n grows
        (signature of ii).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Total group-op equivalents at the cap locus =
          B_cap * attempts * C + m B_cap^2 with attempts = 1/(1-e^{-mu}),
          specialised per m.
        predicted_gain: >-
          The corrected column of (B) and the line of (C); Stage 0 is
          zero-compute re-verification.
      - transform: boundary_lift
        proposed_object: >-
          Extend measured (m, d) cells from m = 2 to m in {3, 4} along the
          cap locus so the quantity measured is theta(m) directly.
        predicted_gain: >-
          A measured exponent per m against the line — RQ-CERTBIN-836ce2
          decision target (1).
    quantifier_order: >-
      (B) FOR ALL m >= 4 THERE EXISTS B (near B_cap for m >= 5) such that
      an oracle with per-attempt cost at most C_max(m) ties matched rho
      under the finding's model. (C) FOR FIXED m, the tie condition in n
      is log2 C <= (1/2 - 1/m) n + const. NOT CLAIMED: that any oracle
      attains these budgets; the record measures theta at toy n for named
      solvers only. EXISTS ladder cells (n in {17..31}, m in {2,3,4}) at
      which theta is fitted.
    method_ceiling:
      strongest_certifiable_claim: >-
        Under the finding's model the oracle budgets are [column]; at the
        cap locus on n in {17,19,23,29,31}, m in {2,3,4}, the named solvers
        have fitted theta(m) = [values] with intervals against the line
        1/2 - 1/m, with degree profiles [values]. It can NEVER certify
        theta at n = 131, nor anything about unnamed solvers
        (WDSat/CaDiCaL/msolve missing).
      nearby_object_control: >-
        The (m-1)-fold loop (theta = 1 - 1/m exactly, the object where the
        lever fails by construction); the same-support random-bilinear
        null of KN-FIND-5a8d3e (semi-regular degree of regularity;
        theta must read the generic MQ value); size-matched random
        subspace base on two cells; ordinary vs Koblitz arms; relabelled
        Z/lZ generic control (loop only).
    proof_obligations:
      - claim: The four floors of the finding are reproduced by the stated model (Stage 0 re-verify).
        responsibility: baseline
      - claim: The corrected budgets at m in {4,5,6,8,10,12,16} with the cap recompute within 0.5 bit of the absorbed S1 figures.
        responsibility: correctness
      - claim: The line (C) with its constants for cofactor-4 Koblitz curves.
        responsibility: correctness
      - claim: d_cap(n, m) cells are built and their measured sat fraction matches 1 - exp(-mu) under the cell's conventions (or after one re-tune).
        responsibility: feasibility
      - claim: theta(m) is fitted from at least four n per m with intervals and a degree profile.
        responsibility: runtime
      - claim: Nothing here asserts theta at n = 131 or adjudicates Semaev 2015.
        responsibility: scope
      - claim: Loop operation counter within [0.95, 1.1] of 2^{(m-1)d}/(m-1)! on every counted cell.
        responsibility: baseline
      - claim: Every counted solve/refutation carries a certificate; planted and random arms reported separately.
        responsibility: correctness
    not_applicable_reason: null

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For a uniformly random target, the number of m-multisets from a
        subspace base of size B summing to it is Poisson with mean
        mu = B^m / (m! |G_ambient|), so the satisfiable fraction is
        1 - e^{-mu} and attempts per relation is 1/(1 - e^{-mu}).
        At deployed parameters |G_ambient| = 2^131 under the finding's
        model; at toy cells mu is recomputed under the cell's own order
        and sign convention.
      random_model_justification: >-
        The mean is exact (KN-FIND-007); the Poisson shape imitates the
        occupancy law; failure mode is additive concentration of a
        subspace base.
      supporting_results:
        - KN-FIND-007; IDEA-20260926-4b65e3 H1; KN-FIND-aa2efc model.
      validation_experiment_ids: [EXP-CERTBIN-fad576]
      falsification_condition: >-
        Exact-loop sat fraction outside [0.5, 0.75] after one d_cap re-tune
        on a cell, or chi-squared of the count histogram against
        Poisson(mu) rejecting at the cell's pre-registered alpha → cell
        excluded / H1 shape failure reported (not an instrument defect
        unless the mean itself is wrong).
    - id: H2
      formal_statement: >-
        A solver's fitted theta(m) over n in {17,...,31} at the cap locus,
        together with its degree profile, indicates the sign of
        theta(m) - (1/2 - 1/m) at larger n for that solver. Only the sign
        transfers; no magnitude transfer is claimed.
      random_model_justification: >-
        None rigorous. The loop's exponent is exact and calibrates the fit;
        the closure's exponent depends on solving-degree growth in n
        (KN-OPEN-3c8f51 item B), which is measured, not assumed.
      supporting_results:
        - IDEA-20260926-4b65e3 H2; KN-OPEN-3c8f51 item (B).
      validation_experiment_ids: [EXP-CERTBIN-fad576]
      falsification_condition: >-
        theta_loop off 1 - 1/m by more than 0.05 → instrument defect
        (O-ARTIFACT). A growing degree profile with falling theta is the
        toy-only signature (ii) and blocks any LEAD reading.

  predictions:
    - metric: corrected_oracle_budget_column (log2 group-op equivalents)
      direction: higher
      minimum_effect: >-
        Stage 0 re-verify within 0.5 bit of absorbed S1 figures
        (~11.0, 32.4-32.6, 36.7-37.0, 42.2, 49.7 at m = 4,5,6,8,16).
    - metric: sat_fraction_at_the_cap_locus
      direction: flat
      minimum_effect: within [0.5, 0.75] on every gated cell.
    - metric: theta_loop
      direction: flat
      minimum_effect: 1 - 1/m within 0.05 (exact baseline).
    - metric: theta_closure
      direction: different
      minimum_effect: >-
        LEAD iff 95% interval entirely below 1/2 - 1/m at m = 3 or 4 over
        >=4 n, non-growing degree-profile max, theta_null above the line;
        otherwise NEGATIVE at toy scale for the pure-Python closure.
    - metric: theta_null
      direction: higher
      minimum_effect: at or above the generic MQ value for square systems.

  test_boundary:
    instances:
      - stage0_reverify: >-
          Recompute (A)-(C) in Python; compare to absorbed S1 Stage-0
          figures within 0.5 bit; freeze
          stage0/preregistered-predictions.json (column, line, bands,
          d_cap table, falsification thresholds).
      - stage1_cells: >-
          Cap-locus cells for n in {17,19,23,29,31}, m in {2,3,4};
          V = {deg < d_cap}; sat_fraction gate over 200 subgroup targets
          by exact (m-1)-fold loop; one d_cap re-tune allowed.
      - stage2_measure: >-
          Per cell: (i) loop with op counter; (ii) degree-D closure on
          Weil-descended S_{m+1} (S_3 exists; S_4/S_5 NEW); (iii)
          same-support random-bilinear null; 40 targets (20 planted, 20
          random); certificates on every decide.
      - stage3_fit: >-
          theta per solver per m across n with intervals; degree
          profiles; RESULTS.md with exactly one O-* label.
      - cells_ordinary: >-
          RC-1 n=17; n=19 cell A=46693,B=306147; NEW ordinary curves at
          n in {23,29,31} with prime-cofactor orders found at setup.
      - cells_koblitz: >-
          a=0 Koblitz at n=19 (#E/4 = 130873, re-count) and at
          n in {23,29,31} where #E/4 is prime (failing cells dropped and
          listed).
      - generic_control: >-
          Relabelled Z/lZ with random subset base of size 2^{d_cap}
          (loop only).
    parameters:
      m: [2, 3, 4]
      n_cells: [17, 19, 23, 29, 31]
      d_cap_rule: ceil((n + log2(m!))/m)
      targets_sat_gate: 200
      targets_cost: 40
      planted_per_cell: 20
      random_per_cell: 20
      theta_loop_tol: 0.05
      sat_band: [0.5, 0.75]
      budget_reverify_tol_bits: 0.5
    implementation: >-
      experiments/EXP-CERTBIN-fad576/implementation/ reading
      experiments/EXP-CERTBIN-e94b27/impl/{gf2n,curve,macaulay,closure,oracles_rc1,elim}.py
      (copy/wrap under write_scope; general-n field module NEW ~150 lines;
      S_4/S_5 builders NEW ~200 lines; (m-1)-fold loop ~60 lines; random
      ordinary-curve search with BSGS order counting ~150 lines). Cite
      absorbed S1 Stage-0 figures from EXP-BINSTD-a222b4 / stage0.py as
      the re-verify baseline. No Magma/Sage/cypari2; no AUXIN; no Bedrock;
      no WDSat/CaDiCaL/msolve as success path.
    budget:
      maximum_runs: 12
      total_cpu_hours_advisory: 48.0
      wall_clock_seconds_advisory: 172800

  falsification_conditions:
    - Stage 0 re-verify fails floors or >0.5 bit vs absorbed S1 → O-ARTIFACT.
    - Cap-locus sat fraction outside [0.5, 0.75] after one re-tune → cell excluded / O-ARTIFACT if systematic.
    - theta_loop off 1 - 1/m by >0.05 → O-ARTIFACT.
    - >-
      LEAD reading requires theta_closure 95% interval entirely below
      1/2 - 1/m at m=3 or 4 over >=4 n, non-growing degree-profile max,
      theta_null above the line; anything else with gates passing is
      O-NEGATIVE (valid scientific negative at toy scale).
    - Null reading below the curve arm → O-ARTIFACT.
    - Claiming any ECDLP speedup, exponent move, or ECC2K-130 break under this card.
    - Treating infra timeout/crash as negative evidence against H1/H2.

  interpretation_limits:
    - Toy tier; m in {2,3,4}; n <= 31; nothing about theta at n=131.
    - Pure-Python closure only; missing engines named; no cross-solver extrapolation.
    - Corrected budgets are model-relative; relative correction (~17-20 bits at m>=5) is the robust content.
    - Semaev 2015 is SEMBIN's to adjudicate; named only as the kind of claim the line calls for.
    - KN-OPEN-020 subspace-base class inherited; not escaped.
    - Five n over 14 bits is a short lever; only the sign of theta - (1/2-1/m) transfers under H2.

  distinguishable_outcomes:
    - id: O-LEAD
      meaning: >-
        Stage 0 pass; sat gates pass; theta_loop calibration pass; LEAD
        falsification threshold met at m=3 or 4: the descended system at
        the cap locus has structure the line rewards at toy scale; route
        to SEMBIN/SDEG review before any interpretation; n=131 remains
        unmeasured; no exponent claimed.
    - id: O-NEGATIVE
      meaning: >-
        Gates pass and theta_closure at/above the line at every m, or
        degree profile grows with n: the pure-Python closure does not
        reach the line at toy scale; the corrected column stands as the
        honest target; the lane's question becomes which solver at which
        m reaches theta(m) < 1/2 - 1/m, stated with numbers.
    - id: O-ARTIFACT
      meaning: >-
        Stage 0 mismatch, sat-gate systematic failure, theta_loop
        miscalibration, null below curve arm, certificate failure, or
        planted/random pooling: nothing else read.
    - id: O-IMPEDIMENT
      meaning: >-
        Budget/infra stop (including top loop cell sampling with disclosed
        lower bound) with measured quantity; never negative evidence.

  dominated_by: >-
    n/a (no result claimed on any cost axis) at design time. Matched rho
    2^60.81 dominates every free-oracle m<=3 row; the exact loop is
    dominated by rho by 2^{n/2} at every m; the corrected budgets are
    conditions, not costs. Within CERTBIN: this is the decision-target (1)
    ladder that every other oracle-cost row prices against.
  sota_delta:
    time: >-
      Zero exponent. Contribution: first measured theta(m) at m in {3,4}
      on the cap locus with loop calibration and degree profiles, against
      the absorbed corrected column (~+17-20 bits at m>=5 vs the finding's
      linear reading).
    memory: Zero until measured; B_cap-sized sparse matrix disclosed at deployed parameters as model arithmetic only.
    data_queries: >-
      Against prior state: RQ-CERTBIN-836ce2 decision target (1) gains its
      first executable ladder contract.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
