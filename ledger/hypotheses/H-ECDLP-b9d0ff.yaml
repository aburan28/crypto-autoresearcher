    doublings and 0 additions. Four exceeds three by 1. The product
    of the bit length and the doubling count is 12. The sum of the
    bit length, the doubling count, and the addition count is 7.
    Two readings of 8 each have 3 doublings, so that gap is 0 and
    their product is 9.
  mechanism: >-
    The proposal writes the integer 8, the length 4, and the
    doubling count 3. This contract checks those integers. It does
    not double a curve point.
