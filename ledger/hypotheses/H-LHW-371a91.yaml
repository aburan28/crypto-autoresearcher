# =============================================================================
# H-LHW-371a91 -- The residue-guess price of a modular (congruence) filter on
# the low-Hamming-weight discrete logarithm in a prime-order group:
# Lemmas 1-2, Theorem 3 (Mersenne / Fermat folds dominated), Conjecture 4
# (every other odd modulus), measured exhaustively on eight toy cells.
#
# Specified and approved (Stages 0-1 only) by DEC-20261002-33bacf from
# IDEA-20260930-750de2 under RQ-LHW-1877bb (no goal owns the question: goal_id
# null). Design finding AB-1: the idea's positive control M5 was arithmetically
# unattainable at its stated object; resolved at design time, before any run, by
# keeping M5's threshold verbatim and repairing the control object to a
# residue-planted set (the original positional W_clu is kept as a non-blocking
# descriptive row); see experiments/EXP-LHW-9adf78/specification.yaml
# approval_blockers.
#
# ZERO RUNS in this design packet. The IDEA claim text is not edited (proposals
# are immutable); this hypothesis cites it and freezes its thresholds verbatim.
#
# Relation to H-LHW-8e8cff / EXP-LHW-22aefa (same question, approved-unrun):
# DIFFERENT OBJECT. That record measures exact normalized carry-mixture SOURCE
# SUPPLY (strata of ordered summand pairs, a target-blind sampler, lower-tail
# probability per charged draw, nine cells with m at most 20). This record
# measures the residue-guess PRICE of a congruence filter (class sizes of W(m,w)
# modulo odd M, the multiplier G_M, concentration D_M, eight cells with m in
# {24,28,32}). Shared: only the question and the promise class W(m,w). No
# input, output, instrument, seed, run id or threshold is shared; this packet
# neither edits nor depends on either record.
# =============================================================================
hypothesis:
  id: H-LHW-371a91
  question_id: RQ-LHW-1877bb
  source_idea: IDEA-20260930-750de2
  derived_from_idea: IDEA-20260930-750de2
  experiment_id: EXP-LHW-9adf78
  goal_id: null
  goal_id_note: >-
    RQ-LHW-1877bb carries goal_ids [] and no GOAL-* record owns it. Left null by
    the idea and by this design; binding a goal is a separate Coordinator
    decision.
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-33bacf
  proposed_by: coordinator
  execution_authorized: true
  execution_authorized_note: Stages 0-1 only (zero group operations); Stage 2 is not designed and not approved.
  title: >-
    Residue-guess price of a modular filter on W(m, w) in a prime-order group:
    every algorithm of class F_M pays a multiplier G_M = |rho_M(W)|; the
    guess-and-kangaroo family built on Mersenne and Fermat moduli is dominated by
    min(kangaroo, brute force) at leading exponent (Theorem 3), and the
    concentration ratio D_M is measured exhaustively as the single quantity that
    could reverse the verdict for every other odd modulus (Conjecture 4)

  statement: >-
    SETTING (verbatim from IDEA-20260930-750de2 claim). Generic group G of prime
    order n with generator P; target Q = [x]P with x in W(m, w) = {0 <= x < 2^m :
    popcount(x) = w}, 2^m < n, alpha = w/m. Realised at toy scale as (Z/l, +)
    and as prime-order subgroups of toy curves; THIS experiment (Stages 0-1)
    performs zero group operations and works on the integer exponent set only.
    Cost unit for any group-side statement: group additions.

    DEFINITIONS. For odd M let rho_M(x) = x mod M (a ring homomorphism of the
    INTEGER exponent, not a map on G), W_sigma = {x in W : x = sigma mod M},
    n_sigma = |W_sigma|, G_M = number of sigma with n_sigma > 0, n_max = max_sigma
    n_sigma, D_M = M n_max / |W| (concentration ratio). Baseline B(m, w) =
    min(2 * 2^{m/2}, |W|).

    LEMMA 1 (TRANSFER PRICE; rigorous bookkeeping, to be re-checked by hand in
    Stage 0). F_M is the class of algorithms that compute only [a]P and Q - [b]P
    with a, b known and keep a b-side candidate only if b = tau (mod M) for a
    supplied residue tau. In a group of prime order n there is no nontrivial
    homomorphism G -> Z/M and no exactly sum-compatible bucket function
    (KN-FIND-ffe1df Theorem C, exact case, as cited by the idea; not re-read by
    this design), so an algorithm in F_M must enumerate tau over rho_M(W) - a:
    worst-case multiplier G_M, average multiplier the guessing work of the
    residue distribution.

    LEMMA 2 (GUESS-AND-KANGAROO COST; rigorous given the kangaroo law
    KR-RHO-898783). For each sigma in rho_M(W) solve the interval DLP for
    c = (x - sigma)/M in [0, ceil(2^m/M)) by kangaroo. Worst-case cost C_M =
    G_M * K(2^m/M) with K(L) = (2 + o(1)) sqrt(L). Since G_M >= M / D_M,
    C_M >= 2 sqrt(M) 2^{m/2} / D_M, so C_M < 2 * 2^{m/2} REQUIRES D_M > sqrt(M).
    FROZEN READING FOR THE STAGE-1 TABLES: per-guess cost kappa_M = 2 sqrt(2^m/M)
    (real), C_M^worst = G_M kappa_M, C_M^avg = A_M kappa_M with A_M the exact
    expected guess rank under uniform x on W and the best (decreasing class mass)
    order. This is a MODELED cost; its toy-scale constant is confirmed only by the
    deferred Stage 2.

    THEOREM 3 (MERSENNE AND FERMAT FOLDS ARE DOMINATED; rigorous per the idea
    for 1.124 w <= k <= m, w <= m/2; counting step falsified by any fold modulus
    with G_M < C(k, w)). For M = 2^k - 1 or 2^k + 1, every k-bit integer r of
    weight w lies in W and distinct such r are distinct residues, so G_M >=
    C(k, w); hence log2 C_M >= log2 C(k, w) + (m - k)/2 - O(1). With kappa = k/m,
    L(kappa) = kappa H(alpha/kappa) + (1 - kappa)/2 is concave on [alpha, 1]
    (L'(kappa) = -log2(1 - alpha/kappa) - 1/2, decreasing), so on [1.124 alpha, 1]
    its minimum is at an endpoint and log2 C_M >= min(m/2, log2 |W|) - O(log m).
    For k < 1.124 w the same conclusion needs proof obligation P-FOLD-2 (residue
    inflation) and is checked exhaustively on the ladder.

    CONJECTURE 4 (EVERY OTHER MODULUS; conditional on H1 and H1'). For odd M with
    ord_M(2) >= m, and for proper divisors M of 2^k -+ 1, G_M >= min(M, |W|,
    C(k, w)) / (1 + eps), whence C_M >= B / (1 + eps).

    THE TWO EXPLANATIONS DISCRIMINATED. E1 (EQUIDISTRIBUTION / FOLD LAW): no
    modulus concentrates W(m, w) beyond the fold bound; the guess-and-kangaroo
    family satisfies min_M C_M >= B / 2 on every ladder cell; congruence
    filtering is closed as a route to the RQ target for class F_M. E2 (HIDDEN
    CONCENTRATION): some modulus family M(m) has D_M > sqrt(M) by a margin that
    grows with m, giving a guess-and-kangaroo algorithm below min(kangaroo, brute
    force) with polylog memory, or a profitable filter transfer.

    TEST BOUNDARY OF THIS HYPOTHESIS (Stages 0-1). Eight cells (m, w) in
    {(24,3), (24,4), (24,6), (28,4), (28,7), (32,4), (32,6), (32,8)}; every odd
    modulus M with 3 <= M <= 4095; every modulus 2^k - 1 and 2^k + 1 for
    2 <= k <= 32 and every divisor of these; exact residue class sizes by an
    exhaustive DP and an independent exhaustive enumeration; against the
    random-set null (five seeds), the interval null, the planted clustered
    positive control and the decay ladder. Cost law modeled, not measured.

  statement_note: >-
    The idea's prose claim that L(kappa) >= 1/2 "for kappa >= alpha/0.89" holds
    only on [alpha/0.89, alpha/0.11] (H(p) >= 1/2 iff p in [0.1100, 0.8900]);
    Theorem 3 uses only concavity and the two endpoint values, so its conclusion
    is unaffected. P-FOLD-2 as written (split 2^a = 2^{a-1} + 2^{a-1+k}) is a
    residue identity modulo 2^k - 1 only; modulo 2^k + 1 the two terms sum to 0.
    Both observations are Coordinator-noted design checks that Stage 0 must
    confirm or refute; neither changes any threshold (spec design_notes_for_stage0).

  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md; inventor protocol sections 1-2,
    verbatim from the idea). Tracked object: the residue rho_M(e) of a KNOWN
    partial exponent e and, on the unknown side, the guessed residue of x.
    Representation: the coefficient side of the computation, not a point
    representation of G. Operation set Sigma = {integer addition of known partial
    exponents; enumeration of a guess}. rho_M discards everything but the class
    mod M and propagates deterministically because rho_M(a1 + a2) = rho_M(a1) +
    rho_M(a2) on integers; it is NOT a projection of G (no homomorphism G -> Z/M
    in prime order), so the unknown side's residue is a BRANCHING object priced by
    the (L, b) meter with loss 0 and branching b = G_M. Low weight matters because
    x mod (2^k - 1) depends only on the fold vector c(x) in Z_{>=0}^k; for k much
    larger than w most folds are 0/1 vectors and G_M is about C(k, w) far below M.
    It still loses because a cheap guess needs a large k, a large k leaves an
    interval of length 2^{m-k}, and C(k, w) 2^{(m-k)/2} is concave in k, so the
    endpoints (kangaroo, k = 0; brute force, k = m) win. The quantity that could
    break this is D_M for moduli not of fold type.

  assumptions:
    - n prime with 2^m < n; the exponent is the integer x < 2^m and no wrap modulo n enters the residue tables.
    - Moduli M are odd (x mod 2^j is a positional split already covered by Coppersmith splitting and is excluded).
    - The guess list rho_M(W) is enumerated by unranking in any solver; Stage 1 tables are analysis cost, never solver memory; a stored residue table of M words is NOT polynomial memory.
    - Worst-case statements are over x in W; average-case statements use the uniform distribution on W and the best guessing order.
    - K(L) = 2 sqrt(L) is the asymptotic kangaroo law, used as a MODELED per-guess cost; toy constants differ and are measured only in the deferred Stage 2.
    - >-
      Moduli above 2^m give injective residues on [0, 2^m), so G_M = |W| and
      n_max = 1; they are tabulated in closed form and excluded from every
      minimum because 2 sqrt(2^m / M) falls below one group addition per guess
      there (a guess costs at least 1).

  proof_search_map:
    bottleneck: >-
      Whether any odd modulus M concentrates W(m, w) on few residue classes
      relative to sqrt(M) (D_M > sqrt(M)) outside the trivial brute-force regime,
      the single step whose positive answer would turn a congruence filter into a
      usable constraint on the unknown side.
    baseline_embedding:
      parameter_slice: >-
        M = 1 reproduces plain kangaroo (C_1 = 2 * 2^{m/2}); M = 2^m - 1 (k = m)
        reproduces brute force (G_M = |W|, quotient interval of length 1); the
        interval nearby object W_I = [0, |W|) has D_M near 1 for every M <= |W|
        and returns kangaroo on W_I exactly.
      reproduction_check: >-
        Frozen fixtures (spec stage1 identity_fixtures): sum over sigma of
        n_sigma = C(m, w) exactly at every cell and modulus; the first-moment
        checksum sum_{x in W} x = (2^m - 1) C(m-1, w-1); G_M = |W| at M = 2^m - 1;
        G_M = M at M in {3, 5, 7} at every cell (against direct enumeration); and
        for the interval null G_M = min(M, |W|), n_max = ceil(|W| / M). The
        Stage-2 planted-kangaroo reproduction (mean within a factor 1.5 of
        2 sqrt(L)) is deferred; until it exists every C_M here is labeled
        modeled.
    observation_collision:
      observable: The pair (G_M, D_M) per modulus and the ratio C_M / B per cell.
      distinct_preimage_search: >-
        REQUIRED before D_M is used as a flag: exhibit, at one or more cells, a
        pair of classes (W and W') and moduli with equal D_M / sqrt(M) within the
        spec tolerance and R differing by at least the spec factor, or record
        that none exists (spec stage1 observation_collision_search). The decisive
        observable is C_M / B, never D_M alone.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Congruence filter in a prime-order group -> residue guess -> interval DLP on the quotient (x - sigma)/M.
        predicted_gain: None at leading exponent for fold moduli (Theorem 3); the value is the closure and the price G_M.
      - transform: observable_fiber
        proposed_object: The fold vector c(x) as the fibre variable through which x mod (2^k -+ 1) factors.
        predicted_gain: Turns G_M for fold moduli into a composition count, the rigorous bound G_M >= C(k, w).
      - transform: specialization_pack
        proposed_object: The exponent function L(kappa) = kappa H(alpha/kappa) + (1 - kappa)/2 and its concavity.
        predicted_gain: Reduces the whole fold family to two endpoints.
    quantifier_order: >-
      THEOREM 3: FOR ALL m, FOR ALL w <= m/2, FOR ALL k with 1.124 w <= k <= m,
      FOR M in {2^k - 1, 2^k + 1}: worst-case C_M >= C(k, w) 2 sqrt(2^m /
      (2^k + 1)). CONJECTURE 4: FOR ALL odd M not of fold type (and proper fold
      divisors), under H1 / H1', C_M >= B / (1 + eps). EMPIRICAL CLAIM: FOR the
      declared ladder cells and the declared moduli set, min over M of C_M / B is
      as measured (exact integers, no sampling). No forall-x / exists-M swap: the
      modulus is chosen before the target.
    method_ceiling:
      strongest_certifiable_claim: >-
        Every algorithm in F_M pays a factor G_M; for Mersenne and Fermat moduli
        the guess-and-kangaroo family is no better than min(kangaroo, brute
        force) at leading exponent; on the ladder no tested modulus gives
        C_M < B/4. It certifies nothing about hash-iterated walks
        (IDEA-20260906-ab08cb), nested collisions (Esser-May), or APPROXIMATE
        group-side filters (Theorem C covers the exact case only), and nothing
        about any ECDLP without the promise.
      nearby_object_control: >-
        A planted class where the conclusion FAILS: x mod (2^{k0} - 1) takes a
        handful of values, D_M is far above sqrt(M), and guess-and-kangaroo beats
        kangaroo on that class. A method that cannot see that gain cannot certify
        its absence on W. The idea names the positional class W_clu (support
        restricted to positions i with i mod k0 in S0, k0 = 8, S0 = {0,1,2}); its
        residue count (9 to 13) makes the idea's numeric criterion C_M / B <= 0.25
        unattainable (AB-1). Resolved at design time: the BLOCKING control is the
        residue-planted set (max(|W|, 2^{m/2 + 1}) integers below 2^m with x mod 255
        in a frozen 3-element residue set, so that the idea's own B(m, n) is the
        kangaroo cost; G_255 = 3, ratio 3 / sqrt(255) = 0.188), the
        positional W_clu is a non-blocking descriptive row, and the threshold 0.25
        is unchanged.
    proof_obligations:
      - claim: Lemma 1 -- no homomorphism G -> Z/M for prime n and odd M > 1; F_M must enumerate the b-side residue.
        responsibility: correctness
      - claim: Lemma 2 -- C_M = G_M K(2^m/M) worst case and G_M >= M / D_M.
        responsibility: runtime
      - claim: Theorem 3 -- G_M >= C(k, w) for M = 2^k -+ 1 and w <= k <= m; concavity of L on [alpha, 1]; the crossing kappa = alpha/0.89 (valid range [alpha/0.89, alpha/0.11] for the L >= 1/2 clause).
        responsibility: size
      - claim: P-FOLD-2 -- for k < 1.124 w and alpha <= 1/4, every k-bit residue of weight floor(k/2) is attained by some x in W via splits, so G_M >= C(k, floor(k/2)); the split identity holds modulo 2^k - 1 only and needs a Fermat variant or a stated restriction.
        responsibility: feasibility
      - claim: The M = 1 and M = 2^m - 1 slices reproduce kangaroo and brute force exactly.
        responsibility: baseline
      - claim: The guess list is produced in polynomial memory by unranking, with its integer work charged.
        responsibility: memory
      - claim: Every Stage-2 solve carries a certificate re-verified by an independent scalar multiplication and a popcount check (Stage 2 deferred).
        responsibility: interface
      - claim: Nothing is claimed beyond class F_M, odd moduli, toy ladder, cost unit additions.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NO ALGORITHMIC OR COMPLEXITY IMPROVEMENT IS CLAIMED. Theorem 3 is a
    derivation-level dominance statement (the fold family never beats
    min(kangaroo, brute force) at leading exponent) and the experiment is a
    closure-or-lead discriminator, not an exponent-moving mechanism. The four
    asymptotic promotion gates are therefore not engaged by this hypothesis; any
    closure it supports is a scoped obstruction record under the Coordinator
    closure gate (obstruction block: quantity G_M, measured value per cell, scope
    the ladder, resource_check) and requires independent review.

  heuristic_assumptions:
    - id: HEUR-LHW-371a91-H1
      formal_statement: >-
        (Equidistribution of fixed-weight integers for moduli of large 2-order.)
        For odd M with ord_M(2) >= m and M <= |W|, max_sigma |W_sigma| <= (1 + eps)
        |W| / M + O(log M), i.e. D_M <= 1 + eps up to the Poisson fluctuation of M
        classes of mean |W| / M.
      random_model_justification: >-
        Gelfond 1968 and Erdos-Mauduit-Sarkozy 1986 (as quoted in
        arXiv:2411.07418, secondary quotation) for digit- and sum-of-digit-
        restricted integers in residue classes of moduli coprime to g(g - 1) with
        error exp(-c log N / log M); Mauduit-Sarkozy (recalled pointer only, not
        opened, not relied on) for fixed digit sum. These cover M = N^{o(1)}; H1
        extrapolates to M up to |W|.
      supporting_results:
        - arXiv:2411.07418 introduction quotation (secondary, per the idea)
      validation_experiment_ids:
        - EXP-LHW-9adf78
      falsification_condition: >-
        M4 (max over non-fold odd moduli M <= min(4095, |W|) of D_M / sqrt(M)) above 2
        at two or more cells is the E2 flag, followed by the C_M check before
        anything is believed (idea predictions M4). M4 at or above 1 at any cell
        removes the E1 label (INCONCLUSIVE, sub-label E1_R_ONLY).
    - id: HEUR-LHW-371a91-H1P
      formal_statement: >-
        (Fold residues equidistribute modulo proper divisors.) For M a proper
        divisor of 2^k -+ 1 with k >= w, G_M >= min(M, G_{2^k -+ 1}) / (1 + eps).
      random_model_justification: >-
        Pigeonhole gives only G_M >= G_{2^k -+ 1} M / (2^k -+ 1); H1' imitates the
        equidistribution of a structured set under a coarser modulus.
      supporting_results:
        - Pigeonhole bound (exact)
      validation_experiment_ids:
        - EXP-LHW-9adf78
      falsification_condition: >-
        Reported, not gated: eps_M = min(M, G_N) / G_M - 1 for every divisor pair
        (M | N, N = 2^k -+ 1, k <= 32); the largest shortfall per k is listed.
        A large eps_M that also gives R <= 0.25 enters the E2 rule through R.
    - id: HEUR-LHW-371a91-H0
      formal_statement: >-
        (Kangaroo cost law at the quotient interval.) The cost of one guess is
        kappa_M = 2 sqrt(2^m / M) group additions for 2^m / M at least 1.
      random_model_justification: >-
        K(L) = (2 + o(1)) sqrt(L) is proven asymptotically (KR-RHO-898783,
        Montenegro-Tetali); at toy L the constant differs and every wrong guess is
        charged the full K(L). Optimistic for the attacker in the constant, and
        silent on the integer work of the guess enumeration.
      supporting_results:
        - KR-RHO-898783
      validation_experiment_ids: []
      falsification_condition: >-
        Deferred to Stage 2 (M6 / F5): measured mean within a factor 1.5 of the
        law. Not tested in Stages 0-1; every C_M and R there is labeled modeled.

  structural_ingredients:
    - description: Kangaroo interval-DLP constants (proven asymptotics)
      citation: KR-RHO-898783
      provenance: internal
      verified_by: coordinator (frontier row read this session)
      role: per-guess cost law K(L)
    - description: Generic-group lower bound for DLP
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: coordinator (frontier row read this session)
      role: the class sits above the generic floor; nothing contradicts it
    - description: Esser-May polynomial-memory low-weight DLP (reported)
      citation: KN-LIT-4794
      provenance: internal
      verified_by: coordinator (corpus note read this session; body not read by this program)
      role: lane context; not reproduced or bounded here
    - description: Kim-Cheon parameterized splitting systems (reported)
      citation: KN-LIT-2177
      provenance: internal
      verified_by: coordinator (corpus note read this session)
      role: memory-heavy positional baseline; orthogonal to odd-modulus filtering
    - description: Theorem C, no exactly sum-compatible bucket function in prime order
      citation: KN-FIND-ffe1df
      provenance: internal
      verified_by: idea-generator, TASK-20260930-5c3258 (lines 1-60 and 139-258 per the idea); not re-read by this design
      role: source of Lemma 1
    - description: Digit-restricted integers in residue classes, quotation of Gelfond 1968 and Erdos-Mauduit-Sarkozy 1986 (Saavedra-Araya, introduction)
      citation: arXiv:2411.07418
      provenance: retrieved
      verified_by: idea-generator, TASK-20260930-5c3258, WebFetch of the HTML version (secondary quotation, per the idea); not opened by this design
      role: the classical statement H1 imitates; not support for the extrapolated range
    - description: Fixed sum of digits in residue classes (Mauduit and Sarkozy, Acta Arith. 1997, as recalled)
      citation: Mauduit-Sarkozy 1997
      provenance: recalled
      verified_by: null
      role: pointer only; a recalled citation supports nothing

  reduction_chain:
    core_problem: >-
      Exact residue-class census of W(m, w) modulo odd M on eight toy cells, priced
      as the multiplier G_M of any congruence filter in class F_M
    corollaries:
      - A zero-compute Stage 0 closes or repairs the closed-form bounds (Lemmas 1-2, Theorem 3, P-FOLD-2) before any count runs.

  predictions:
    - metric: M1 exact identities (sum of class sizes, first-moment checksum, M = 1 and M = 2^m - 1 slices, G_M = M at M in {3, 5, 7})
      direction: different
      minimum_effect: FORCED exact equality; any mismatch is an instrument defect and nothing else is read.
    - metric: M2 G_M against the rigorous bound C(k, w) for M = 2^k -+ 1, every k in [w, m], every cell
      direction: higher
      minimum_effect: G_M >= C(k, w) at every (cell, k); a violation falsifies Theorem 3's counting step outright.
    - metric: M3 R = min over the declared moduli of C_M / B per cell (worst case) and its average-case analogue
      direction: higher
      minimum_effect: >-
        E1 iff R >= 0.5 at every cell; E2 iff R <= 0.25 at two or more cells AND
        the minimising moduli form a family whose R decreases with m across the
        three m values. Between, INCONCLUSIVE at this ladder.
    - metric: M4 max over non-fold moduli of D_M / sqrt(M), restricted to M <= |W|
      direction: lower
      minimum_effect: Predicted below 1 at every cell (H1); a value above 2 at two cells is the E2 flag and is followed by the C_M check before anything is believed.
    - metric: M5 positive control (residue-planted set; positional W_clu as non-blocking row)
      direction: lower
      minimum_effect: >-
        C_M / B <= 0.25 for M = 2^{k0} - 1; failure means the instrument cannot
        detect concentration and the run is void. [THRESHOLD CARRIED VERBATIM FROM
        THE IDEA. The idea's object (positional W_clu, k0 = 8, S0 = {0,1,2}) cannot
        reach it (needs at most 3 residues; the object has 9 to 13), so the blocking
        object was repaired at design time to a residue-planted set with G_255 = 3
        and a set size max(|W|, 2^{m/2 + 1}) that makes the idea's own B(m, n) =
        min(2 * 2^{m/2}, n) the kangaroo cost, so the 0.25 and the B formula are both
        literal; see EXP-LHW-9adf78 approval_blockers AB-1.]
    - metric: M6 Stage-2 planted guess-and-kangaroo cost versus G_M * 2 sqrt(2^m/M) (DEFERRED, not approved, not designed here)
      direction: different
      minimum_effect: Measured mean within a factor 1.5 of the law; outside it the law (not the theorem) is re-fitted and the deviation reported.

  test_boundary:
    instances:
      - >-
        Stage 0 (zero compute, hand derivation plus closed-form arithmetic):
        Lemmas 1-2, Theorem 3, P-FOLD-2, the closed-form table, the frozen moduli
        set, the closed-form planted-control tables; hashed before any count runs.
      - >-
        Stage 1 (exact integer arithmetic, zero group operations): cells (m, w)
        in {(24,3), (24,4), (24,6), (28,4), (28,7), (32,4), (32,6), (32,8)}.
    parameters:
      cells: [[24, 3], [24, 4], [24, 6], [28, 4], [28, 7], [32, 4], [32, 6], [32, 8]]
      moduli: odd M with 3 <= M <= 4095; M = 2^k - 1 and 2^k + 1 for 2 <= k <= 32; every divisor of these
      null_random_set_seeds: 5
      positive_control: >-
        BLOCKING residue-planted set (max(|W|, 2^{m/2 + 1}) integers below 2^m with
        x mod 255 in {17, 18, 19}); non-blocking descriptive row, the idea's positional W_clu with
        k0 = 8 and S0 = {0, 1, 2}
      decay_q: [0, 0.25, 0.5, 0.75, 1]
      seeds: one PCG64 stream per (arm, cell, replicate), SeedSequence entropy 20261002
    implementation: >-
      Exact integer DP over positions with state (weight used, residue); an
      independent exhaustive enumeration of W (at most C(32, 8) = 10518300
      elements) with distinct-residue counting; numpy; no group operations.
    budget:
      wall_clock_seconds: 28800
      maximum_memory_gb: 4
      maximum_runs: 12
    excluded:
      - Stage 2 and anything that performs group operations (designed only if Stage 1 returns E2 or the cost law must be confirmed for the closure record)
      - hash-iterated walks, nested collision search, approximate group-side filters (not in class F_M)
      - any edit of, or dependence on, H-LHW-8e8cff / EXP-LHW-22aefa

  falsification_conditions:
    - 'F1. Any fold modulus with G_M < C(k, w): Theorem 3 is wrong as stated; record superseded.'
    - 'F2. R <= 0.25 at two or more cells with R decreasing in m, controls passing: E1 is falsified and the minimising moduli are reported as a lead (favourable branch).'
    - 'F3. NULL-1 concentration equal to W at the same moduli: the effect is set size, not weight structure; the arm is void.'
    - 'F4. Positive control not detected or decay flat in q: instrument void; nothing about W is read.'
    - 'F5. Stage-2 measured cost outside a factor 1.5 of G_M * 2 sqrt(2^m/M): the cost law (not Lemma 1 or Theorem 3) is re-fitted and reported. (Deferred with Stage 2.)'
    - 'F6. Budget exhaustion or crash: infrastructure outcome under AGENTS.md rule 3, never evidence.'
    - 'E2 is falsified by R >= 0.5 at every cell (idea falsification thresholds, fixed now).'

  interpretation_limits:
    - Claim tier toy; Theorem 3 is a derivation-level claim scoped to class F_M, odd moduli, M of fold type, w <= m/2.
    - E1 closes congruence filtering by guessed residues as a route to the RQ target for this class only; it does not close hash-iterated walks, nested collision search, approximate group-side filters, or the RQ.
    - E2 would be a lead for a conditional algorithm at toy scale, not a result at any cryptographic size.
    - Every C_M and R in Stages 0-1 is MODELED from the kangaroo law; a closure record at the Closure-gate standard needs Stage 2 confirmation of the cost law or an explicit statement that the law is modeled.
    - A worst-case E1 closes the worst-case guess-and-kangaroo family; the average-case reading is reported beside it and a divergence between the two is stated in any closure.
    - Restricting general moduli to M <= 4095 leaves large non-fold moduli untested except by H1.
    - Toy m (24 to 32) puts poly(m) factors at the scale of the exponents; the ladder tests the finite statement C_M >= B/2, not the exponent.
    - No experiment approval, hypothesis status change or knowledge promotion is asserted by this record.

  dominated_by: >-
    CHECKED against the idea (rows KR-RHO-13bf67, KR-RHO-898783, KR-RHO-6239aa,
    KR-RHO-7d93f6, KR-RHO-5b1c0a, KR-RHO-93979e, KR-RHO-ea34b8, KR-RHO-46c2c6,
    KR-RHO-fbd7b1). KR-RHO-13bf67 (generic floor sqrt|W|): not contradicted.
    KR-RHO-898783 (kangaroo): dominates the family for alpha above about 0.11 by
    Theorem 3. Brute force over W: dominates for alpha below about 0.11. vOW and
    the half-split law of IDEA-20260906-ab08cb dominate where |W|^{3/4} 2^{-w/4} <
    min(2^{m/2}, |W|). Esser-May (KN-LIT-4794): reported to dominate at every
    weight it covers. As an obstruction: not applicable (no attack claimed).
  sota_delta:
    time: >-
      0 (no attack). Model delta only, namely the transfer price G_M of a
      congruence filter, a proved dominance of the fold family at leading
      exponent, and the measured reversal quantity D_M with exact tables on
      eight cells.
    memory: 0
    data_queries: 0

  distinguishable_outcomes:
    E1: >-
      R >= 0.5 at all eight cells (worst case), M4 below 1 at every cell, all
      hard gates and controls pass -> record the closure of class F_M at the
      Closure-gate standard (obstruction quantity G_M, value per cell, scope the
      ladder; cost law labeled modeled unless Stage 2 exists) and forward guidance
      to hash-walk and nested classes.
    E2: >-
      R <= 0.25 at two or more cells AND the minimising moduli form a family whose
      R decreases with m across the three m values, controls pass -> the
      minimising moduli are a lead; a hypothesis is designed for the corresponding
      algorithm at larger m (Stage 2 designed only then).
    INCONCLUSIVE: >-
      Any valid outcome not meeting the E1 or E2 rule (sub-labels in the spec
      decision rule). Stated plainly; the evidence then does not discriminate.
    ARTIFACT_VOID: >-
      Positive control fails, decay flat, NULL-1 shows the same concentration, or
      M1 mismatch -> void; nothing about W is read.
    infrastructure: >-
      Crash, timeout, memory abort -> failed_infrastructure, never a mathematical
      miss (AGENTS.md rule 3).

