# =============================================================================
# H-ICPERF-c9380d -- Residual Groebner-column measurability after C1
# discharge: Boolean-native engine (BRiAl) + hardware-independent Groebner
# unit + SAT-over-Groebner structural-vs-availability discrimination.
# Specified from IDEA-20260915-3476de under RQ-ICPERF-94c86e /
# GOAL-ICPERF-e6b6a4. Approved DEC-20261002-dc4cbc.
#
# C1 (RLIMIT_AS vs RSS watchdog) is PRE-EMPTED by EV-ICPERF-390707 joint V2
# and the accepted instrument EXP-ICPERF-e21835 (DEC-20260915-927eaa closed
# BATCH-a33cda; revisit_condition of DEC-20260916-3c0cf5 rank-5 met).
# This hypothesis owns residual Stages 2-4 of the idea (C2/C3/C4), with a
# Stage-0/1 regression that re-binds the discharged C1 evidence. ZERO RUNS
# in this design packet. No AUXIN. No Bedrock. Claim tier: measurement /
# tooling. No attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-ICPERF-c9380d
  question_id: RQ-ICPERF-94c86e
  source_idea: IDEA-20260915-3476de
  experiment_id: EXP-ICPERF-a55313
  goal_id: GOAL-ICPERF-e6b6a4
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-dc4cbc
  status: approved
  proposed_by: coordinator
  related_hypothesis_ids:
    - H-ICPERF-cc4847
    - H-ICPERF-2c57cc
  related_experiment_ids:
    - EXP-ICPERF-66fd51
    - EXP-ICPERF-e21835
    - EXP-ICPERF-13f001
  title: >-
    With C1 discharged, a Boolean-native Groebner column (BRiAl) plus
    parseable d_solv decides whether the SAT-over-Groebner gap at l in
    {5,6} is structural (>=10x on every cell) or an engine-availability
    artifact (any l=6 cell below 10x)

  statement: >-
    CLAIM (measurement / tooling; NO ATTACK). Setting: the ICPERF PDP
    boundary cells (15,5), (17,6), (19,6) on the repaired harness of
    EXP-ICPERF-e21835 (RSS watchdog, RLIMIT_AS unset), with WDSat as the
    SAT baseline from RUN-ICPERF-305ca3 / successor rows. (C1, DISCHARGED)
    EV-ICPERF-390707 joint V2 and EXP-ICPERF-e21835 already replace
    RLIMIT_AS with an RSS watchdog; Stage 0 of this contract freezes that
    discharge and Stage 1 re-runs n15l5-1-S as a regression only. (C2)
    Installing and freezing BRiAl (PolyBoRi successor over GF(2)) makes the
    l=6 S instances reachable: at least 8 of 10 S instances per (17,6) and
    (19,6) complete within 900 s at peak RSS below 4 GB (failure below 5 of
    10 is O-C2-FAIL). Singular slimgb inside a Boolean quotient is the
    secondary Boolean-aware arm. (C3) With finishing Groebner rows, the
    best-Groebner / WDSat median wall ratio is DECIDED: >=10 on every cell
    supports a structural reading of H-ICPERF-cc4847 P2; any l=6 cell below
    10 falsifies P2 as worded and reattributes the gap to engine
    availability. (C4) Every finishing Groebner row records d_solv and
    per-degree Macaulay matrix dimensions (hardware-independent unit).
    CLAIM TIER: measurement / tooling. Magma F4 absent and not substituted.
    Missing BRiAl install is O-C2-FAIL / O-IMPEDIMENT, never evidence that
    P2 is structural.

  mechanism: >-
    OBJECT FRAME. No new tracked mathematical object. The instrument
    changes what the boundary table can measure: exit status, peak RSS,
    wall time, d_solv, and the best-Groebner/WDSat median ratio. LOSSY-
    PROJECTION: "empty Groebner column" has multiple preimages (address-
    space artifact, genuine memory need, wrong algorithm for Boolean
    systems, engine absence); C1 separates the first; C2/C3 separate
    engine absence from structural cost. Trichotomy: not applicable
    (tooling). Why this is not a restatement of EXP-ICPERF-e21835: that
    contract accepts the repaired harness and deliberately does NOT add
    BRiAl; why not EXP-ICPERF-13f001: that draft row re-runs the full
    phase structure and still lists BRiAl among engines_not_added; this
    contract is the Boolean-native column and C3 discrimination that
    DEC-20260916-3c0cf5 ranked as the residual of IDEA-20260915-3476de
    after BATCH-a33cda closed.

  assumptions:
    - >-
      C1 DISCHARGE (exact, archived). EV-ICPERF-390707 joint V2:
      RLIMIT_AS 6 GB aborted Macaulay2 rows at ~2.575 GiB resident;
      unconstrained peak RSS ~6.71-6.82 GiB. EXP-ICPERF-e21835 code tree
      runs with RLIMIT_AS unset and an RSS watchdog; DEC-20260915-927eaa
      closed BATCH-a33cda. Stage 1 re-binds this on n15l5-1-S only.
    - >-
      BRiAl can be installed without Sage (pip wheel or cmake against
      m4ri) OR C2 fails explicitly as O-C2-FAIL with the untested status
      recorded — never silently transferred to Singular alone.
    - >-
      Engines' protocol output exposes d_solv and matrix sizes in a
      parseable form, or C4 partially discharges naming which engine
      failed.
    - >-
      Removing RLIMIT_AS is safe only with the RSS watchdog and wall
      timeout both active (inherited from e21835).
    - >-
      OFF-LIMITS: Magma F4 as success path; Amazon Bedrock; AUXIN
      provisioning; any ECDLP attack / exponent claim; editing
      IDEA-20260915-3476de claim text; editing shared GOAL-ICPERF-e6b6a4
      goal.yaml under this design packet.

  heuristics:
    - id: H-C3
      statement: >-
        STRUCTURAL SAT-OVER-GROEBNER GAP. On cells (15,5), (17,6), (19,6),
        with finishing rows from the best installed Groebner engine
        (BRiAl preferred; else Macaulay2 F4 / Singular slimgb under the
        repaired watchdog) and WDSat default, the median wall-time ratio
        Groebner/WDSat is at least 10 on every cell.
      rigorous_support: >-
        RIGOROUS: none (host- and engine-dependent measurement).
        HEURISTIC: H-ICPERF-cc4847 P2 as restated after the instrument
        repair; Boolean-native engines are predicted not to close the
        gap below 10x at l=6.
      falsification_condition: >-
        Any l=6 cell with best-Groebner/WDSat median wall ratio below 10
        (O-ENGINE), with certificates and null controls intact.
      validation_plan: >-
        SAMPLE 10 S + 10 U per cell under BRiAl (and slimgb secondary);
        COMPARE medians over finishing rows only, non-finishing counts
        reported beside every median; CONTROL matched random Boolean
        nulls from RUN-ICPERF-305ca3 / e21835 generation; TAIL per-
        instance maxima and d_solv profiles.

  heuristic_note: >-
    C1 is archived discharge, not a heuristic. C2 is an install/reachability
    gate. H-C3 is the only directional heuristic; both directions are
    reportable results.

  predictions:
    - metric: stage0_c1_discharge_bound
      direction: exact
      minimum_effect: >-
        Stage 0 worksheet cites EV-ICPERF-390707 joint V2 RSS figures and
        EXP-ICPERF-e21835 watchdog contract bytes before any Stage-2 run.
    - metric: stage1_n15l5_1_S_regression
      direction: different
      minimum_effect: >-
        Under repaired harness (no RLIMIT_AS, RSS watchdog), n15l5-1-S
        either finishes or is killed by RSS/wall with recorded peak RSS;
        the RLIMIT_AS control arm reproduces the historical abort
        signature (exit -6 / bad_alloc, wall under 20 s, RSS ~2.65 GB) or
        Stage 1 is O-ARTIFACT.
    - metric: brial_S_completion_rate at (17,6) and (19,6)
      direction: higher
      minimum_effect: ">=8/10 within 900 s at peak RSS <4 GB; <5/10 is O-C2-FAIL."
    - metric: best_groebner_over_wdsat_median_wall_ratio per cell
      direction: higher
      minimum_effect: >-
        C3 decided either way — >=10 on every cell => O-STRUCTURAL;
        any l=6 cell <10 => O-ENGINE.
    - metric: d_solv_recorded_fraction on finishing Groebner rows
      direction: exact
      minimum_effect: 1.0, or named engine failure under C4 partial discharge.

  test_boundary: >-
    Toy PDP cells (15,5), (17,6), (19,6) on this host's installed engines
    under the e21835 repaired harness. Nothing transfers to deployed
    curves, IC-vs-rho claims, or any exponent. BRiAl absence is an
    impediment/outcome label, not a mathematical falsification of P2.
    Narrows RQ-ICPERF-94c86e's empty Groebner column; does not approve
    EXP-ICPERF-13f001 (separate AP-* gate).

  falsification_criteria:
    - >-
      O-ENGINE: any l=6 cell best-Groebner/WDSat median wall ratio <10 with
      finishing rows and intact certificates/nulls — P2 as worded false on
      this host; gap reattributed to engine availability.
    - >-
      O-C2-FAIL: BRiAl not installable, or <5/10 S completions per l=6 cell
      within 900 s — Boolean-native column absent; H-C3 untested, not
      supported.
    - >-
      O-C1-REGRESS / O-ARTIFACT: Stage 1 fails to reproduce the RLIMIT_AS
      abort signature on the control arm, or repaired arm aborts identically
      with no RLIMIT_AS at RSS <3.5 GB without a recorded watchdog kill —
      instrument regression; no C3 read.
    - >-
      C4 fail: finishing rows lack d_solv with no named engine failure —
      hardware-independent unit missing; ratio remains incommensurable for
      promotion.

  distinguishable_outcomes:
    - id: O-STRUCTURAL
      label: sat_over_groebner_gap_structural
      when: >-
        C2 met; C4 recorded; every cell best-Groebner/WDSat median wall
        ratio >=10; nulls do not collapse the gap.
    - id: O-ENGINE
      label: gap_is_engine_availability_artifact
      when: C2 met; any l=6 cell ratio <10 with finishing rows.
    - id: O-C2-FAIL
      label: boolean_native_column_unreachable
      when: BRiAl install fails or completion <5/10 on an l=6 S cell.
    - id: O-C1-REGRESS
      label: repaired_harness_regression
      when: Stage 1 control or repaired arm fails its preregistered signature.
    - id: O-ARTIFACT
      label: instrument_or_parse_defect
      when: certificate/null/parse failure voids the comparative read.
    - id: O-IMPEDIMENT
      label: infrastructure_stop
      when: >-
        Timeout/OOM/crash/missing binary outside the named C2 path.
        Never negative mathematical evidence (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      Whether the SAT-over-Groebner gap reported on this host survives a
      Boolean-native Groebner engine once the address-space artifact is
      removed.
    baseline_embedding:
      parameter_slice: >-
        n15l5-1-S under Macaulay2 F4 with field equations — the abort row
        of RUN-ICPERF-305ca3 — plus WDSat default medians on the same
        cells as the SAT baseline.
      reproduction_check: >-
        Stage 1 RLIMIT_AS arm must reproduce the historical abort before
        the no-rlimit arm is believed; Stage 0 freezes EV-ICPERF-390707
        joint V2 and e21835 watchdog citations before Stage 2.
    observation_collision:
      observable: best-Groebner/WDSat median wall ratio and completion rates.
      distinct_preimage_search: >-
        Ratio >=10 could be structural cost or a still-wrong Groebner
        encoding (separated by d_solv profiles and null-object arms).
        Ratio <10 could be true engine catch-up or a SAT baseline
        mis-measurement (separated by reproducing WDSat medians from
        archived rows before the ratio is read).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Boolean ring (x^2=x) via BRiAl ZDD, removing appended field equations.
        predicted_gain: Reachability of l=6 cells; not an asymptotic ECDLP claim.
      - transform: observable_fiber
        proposed_object: Fix cells and instances; vary only Groebner engine family.
        predicted_gain: Separates engine availability from structural gap.
    quantifier_order: >-
      C1 discharge: EXISTS archived evidence (EV-ICPERF-390707 / e21835)
      that RLIMIT_AS aborted below true RSS need — exact, Stage 0.
      C2: EXISTS Boolean-native install on this host reaching >=8/10 S at
      l=6 — contingent. C3: FORALL tested cells, ratio >=10 — heuristic
      H-C3. No transfer beyond the named cells.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On cells (15,5)/(17,6)/(19,6) under the repaired harness, best
        finishing Groebner engine median wall is [measured] vs WDSat
        [measured], ratio [measured], with d_solv recorded on finishing
        rows." Certifies nothing about Magma, deployed curves, or IC-vs-rho.
      nearby_object_control: >-
        Matched random Boolean nulls; Singular slimgb secondary arm;
        RLIMIT_AS control arm at Stage 1.
    proof_obligations:
      - claim: Stage 0 binds C1 discharge to EV-ICPERF-390707 and e21835 without re-deriving numbers from memory.
        responsibility: correctness
      - claim: Stage 1 RLIMIT_AS control reproduces abort signature before repaired arm is read.
        responsibility: correctness
      - claim: BRiAl install/version/build hash recorded, or O-C2-FAIL named.
        responsibility: interface
      - claim: Every finishing Groebner row has d_solv or a named C4 failure.
        responsibility: correctness
      - claim: Exactly one O-* label; no attack/exponent/Magma/Bedrock/AUXIN success path.
        responsibility: scope
    not_applicable_reason: null

  confounders:
    - Host package availability for BRiAl dominates C2; recorded as install provenance, never inferred.
    - Wall-time ratios mix algorithm and implementation; d_solv is the hardware-independent companion metric.
    - Non-finishing rows censor medians; counts reported beside every median.
    - Null objects that match structured instances on wall and d_solv void a "structure" reading of Groebner cost.

  interpretation_limits:
    - Toy cells only; no deployed-curve or IC-vs-rho claim.
    - Does not approve or amend EXP-ICPERF-13f001; may supply AP-2/AP-4 inputs by citation after RESULTS.
    - Approval does not assert H-C3 is true.
    - C1 is not re-litigated as a discovery; Stage 1 is regression only.

  claim_tier: measurement
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
