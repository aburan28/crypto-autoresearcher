  title: >-
    The mean ratio is 8, and the variance at the large probability is 56
  statement: >-
    The reciprocal of 1 over 8 is 8, and the reciprocal of 1 over 64
    is 64. Sixty-four divided by 8 is 8, and 64 minus 8 is 56. The
    variance at probability 1 over 8 is 56, and 56 divided by 8 is 7.
    The variance at probability 1 over 64 is 4032, and 4032 divided
    by 64 is 63. Eight times 7 is 56, so the mean gap equals that
    variance. Seven over 5 is twice 7 over 10. Three over 2 exceeds
    7 over 5 by the cross gap 1. Two hundred minus 96 is 104.
  mechanism: >-
    The proposal writes a geometric mean of 1 over p on the interval
    from 2 to the minus 6 through 2 to the minus 3, and a mean-ratio
    band from 7 over 10 to 7 over 5. This contract checks those
    integers. It does not run a walk.
  assumptions: []
  proof_search_map:
    bottleneck: The cross gap 1 of 3 over 2 against 7 over 5.
    baseline_embedding:
      parameter_slice: >-
        The probability interval, the band 0.7 to 1.4, the artifact
        factor 1.5, and the counts 200 and 96 in
        IDEA-20261001-6d1b48, read 2026-10-03. The products were
        recomputed in this design session. That computation is not
        a run.
      reproduction_check: >-
        One route divides 64 by 8 and subtracts 8 from 64. The other
        computes the variance 56 and multiplies 8 by 7. They must
        agree that both results are 56.
    observation_collision:
      observable: The shared value 56 and the cross gap 1.
      distinct_preimage_search: >-
        Reporting the two means as equal drops the gap 56. Reporting
        3 over 2 as inside the upper band drops the cross gap 1.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two probabilities, the band, and the sample counts.
        predicted_gain: Integer comparisons. No walk.
    quantifier_order: >-
      The mean ratio 8 comes first, then the shared value 56, then
      the cross gap 1, then the sample gap 104.
    method_ceiling:
      strongest_certifiable_claim: >-
        The shared value 56 and the cross gap 1. Not a measured
        waiting time.
      nearby_object_control: >-
        The two means reported as equal, and 3 over 2 reported as
        inside 7 over 5.
    proof_obligations:
      - claim: Sixty-four minus 8 is 56, and 8 times 7 is 56.
        responsibility: correctness
      - claim: Three times 5 minus 2 times 7 is 1.
