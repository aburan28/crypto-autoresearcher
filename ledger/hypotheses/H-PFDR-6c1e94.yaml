  heuristic_assumptions:
    - id: HEUR-PFDR-COVERSIGN
      formal_statement: >-
        FOR each tested (p, curve, m, coset base X) with delta(X) nonzero, IF
        the coset base's per-target yield distribution deviates from the
        matched random null in any of the eight pre-registered statistics,
        THEN the sign of (statistic(X) - null mean) equals sign(delta(X)),
        where delta(X) = |D(X)| - B_nom with B_nom = (p-1)/ell in regime (a)
        and d in regime (b).
      random_model_justification: >-
        The source idea's H1, restated after KN-FIND-007: the only rigorous
        handle on the cover is its point count (Hasse-Weil on C_g, exact and
        computable), and the heuristic is that its excess carries over from
        the single-point count to the m-fold distribution. No random-model
        derivation supports a sign transfer to coverage or dispersion; it is
        tested, not assumed.
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND HONESTLY SO: no committed result supports a sign transfer
        from delta to distributional statistics.
      validation_experiment_ids: [EXP-PFDR-b83f17]
      falsification_condition: >-
        A family with pooled undirected deviation significant at the
        family-Bonferroni level whose delta-signed Stouffer statistic is
        below 3.0 or of opposite sign.
    - id: HEUR-PFDR-SUBGROUPRANDOM
      formal_statement: >-
        FOR prime-order ordinary E/F_p with p in the tested range, m in {2, 3},
        and d | p-1 with d/p^(1/m) in the declared window, the counts
        {c(R)} for D = D(g*mu_d) are distributed, in coverage, dispersion and
        maximal Fourier coefficient, as for a uniformly random
        negation-symmetric subset of Z/NZ minus 0 of the same size, within the
        random null's measured spread.
      random_model_justification: >-
        The standard random-subset model that every factor-base cost model in
        the lane assumes; H-PFDR-8a4f44 shows Weil-Deligne cannot certify it
        at beta about 1/m (its deficit equals the whole square-root exponent),
        so at the operating point it is a heuristic with no rigorous
        interpolant, which is why it is measured here.
      supporting_results: []
      supporting_results_note: >-
        EMPTY: H-PFDR-8a4f44's coverage arm (EXP-PFDR-1c5939) is a draft and
        has not run; no committed measurement of a subgroup base at this size
        exists (EV-FB-001 excluded it as too small).
      validation_experiment_ids: [EXP-PFDR-b83f17]
      falsification_condition: >-
        The regime-(b) coverage or dispersion family reaches |pooled Z| >= 3.0,
        or coverage of the subgroup (g = 1) base falls at least 0.05 below the
        random mean at two or more of three curves at a level (H-PFDR-8a4f44's
        additive-degeneracy reading).
    - id: HEUR-PFDR-SOLVEPOLY
      formal_statement: >-
        The msolve 0.6.5 solve time of the regime-(b) membership-constrained
        system grows at most polynomially in d, and at least linearly (the
        system has a degree-d input).
      random_model_justification: >-
        The source idea's H2 (charged-solve dominance), restricted to the
        zero-dimensional regime-(b) system that msolve accepts; the regime-(a)
        lifted system is positive-dimensional and is not measured.
      supporting_results: []
      supporting_results_note: EMPTY; measured here only.
      validation_experiment_ids: [EXP-PFDR-b83f17]
      falsification_condition: >-
        A fitted solve-time exponent in d below 1 on uncensored levels (a
        sublinear solve would be an unexpected observation), or a
        superpolynomial trend by the declared fit test.

