  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
    - metric: sum over all R in G of c(R), per base
      direction: different
      minimum_effect: >-
        EXACTLY binomial(B+m-1, m) for every base (instrument gate; any
        deviation is a bug).
    - metric: mean-yield ratio, coset base versus matched random-K base
      direction: different
      minimum_effect: >-
        EXACTLY 1 (population mean over G). The idea's mean-yield H1 is
        refuted a priori.
    - metric: >-
        nominal-size ratio rho_nom = binomial(B+m-1,m)/binomial(B_nom+m-1,m)
      direction: different
      minimum_effect: >-
        Equal to the formula exactly, sign(rho_nom - 1) = sign(delta); in
        regime (a) |delta| within the Hasse-Weil sanity bound. This is the
        cover-heuristic prediction and it is entirely a size effect.
    - metric: >-
        per-cell z-scores of coverage, dispersion index and residue-label F
        statistic against 100 matched random-K draws; delta-signed Stouffer
