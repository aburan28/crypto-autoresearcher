hypothesis:
  id: H-PFDR-6c1e94
  question_id: RQ-PFDR-ae2fba
  related_question_ids: [RQ-CRYPTO-001, RQ-ECDLP-002]
  goal_id: GOAL-CRYPTO-001
  derived_from_idea: IDEA-20260921-ffd330
  instrumented_by_idea: IDEA-20260921-da1896
  added: '2026-09-24'
  recorded_at: '2026-09-24'
  experiment_ids: [EXP-PFDR-b83f17]
  id_allocation_provenance: >-
    Token drawn by the Coordinator subagent as a random 6-hex value WITHOUT
    scanning state (the subagent has no shell and could not run
    tools/allocate_id.py). Before authoring, a filename glob over the whole
    repository and a content search of ledger/ and coordination/ for the
    identifier pattern found no occurrence. This is NOT the tool's --check;
    the dispatching session runs `python3 tools/allocate_id.py --check
    H-PFDR-6c1e94` before the archive commit, and on a collision the record is
    re-issued under a new id before anything binds it.

  statement: >-
    DISTRIBUTIONAL COSET ANOMALY, SCOPED TO TOY PRIME FIELDS. Let E/F_p be an
    ordinary prime-order short-Weierstrass curve (j not 0 or 1728) and, for a
    set X of field elements, let D(X) be the points other than O whose
    x-coordinate lies in X, with B = |D(X)|. Consider two coset classes:
    (a) X = g*H_ell, a coset of the ell-th powers for ell in {3, 5, 7}
    (membership predicate x^((p-1)/ell) = g^((p-1)/ell), degree (p-1)/ell);
    (b) X = g*mu_d, a coset of the multiplicative subgroup of ORDER d, d
    dividing p-1 and d about p^(1/m) (membership x^d = g^d, degree d, so
    |D| is the index-calculus-relevant size p^(1/m)). Let c(R) be the number
    of size-m multisets from D summing to R, m in {2, 3}.
    PART 0 (NOT HYPOTHESIZED; A PRE-REGISTERED IDENTITY): the mean of c over
    the group equals binomial(B+m-1, m)/N for every base of size B
    (KN-FIND-007), so the mean-yield ratio against a size-matched random base
    is EXACTLY 1, and the source idea's H1 read as a mean-yield anomaly at
    matched |FB| is refuted by arithmetic before any run. The cover point count
    acts on the mean only through B itself.
    CLAIM (what is tested): the per-target distribution of c -- coverage (the
    fraction of targets with at least one decomposition), the dispersion index
    Var(c)/Mean(c), and in regime (a) the profile of mean c conditional on the
    ell-th power-residue label of x(R) -- deviates from the matched
    random-subset null beyond that null's measured spread, with the sign of
    the deviation equal to the sign of the cover point-count excess delta
    (the number of base points minus the uniform-density prediction). The
    alternative the Coordinator expects (recorded prior): no such deviation at
    the tested scope, i.e. these high-degree classes behave like random bases
    of equal size, extending EV-FB-001's structure invariance from the mean to
    the distribution.
  mechanism: >-
    PAIR AND OPERATION SET: the tracked object is the relation vector over
    D(X), index-calculus Class I, PARTIAL-ACTION (it propagates under
    translation by factor-base elements only, never under the full translation
    action, which KN-FIND-ffe1df Theorem C closes for lossy objects). The
    representation is class R1 of RQ-ECDLP-623a32 (the affine x-coordinate in
    F_p), factored through the multiplicative partition of F_p^*; the attack
    stage whose charged cost is examined is RELATION DECOMPOSITION SUPPLY and,
    in regime (b), the per-relation SOLVE cost. What the projection discards is
    the point's y-sign and everything about x except its coset label.
    WHY THE MEAN IS DEAD AND THE DISTRIBUTION IS NOT. Every size-m multiset of
    D sums to exactly one group element, so the total count is fixed by B
    alone; structure can only move decompositions between targets. Coverage
    obeys coverage <= min(1, mean), with the gap set by repeated sums, so a
    base whose additive structure differs from random shows up in coverage,
    dispersion and the Fourier bias along the discrete-log coordinate, and
    nowhere else. The coset condition x = g*u^ell (a degree-ell cover C_g of
    the x-line, genus (3*ell-1)/2 after the square root) is an exact algebraic
    reformulation of membership; whether it induces additive structure in D
    along the group law is the open question. In regime (b) the same question
    is H-PFDR-8a4f44's coverage arm at its operating point beta = log_p B about
    1/m, where that record's bookkeeping says Weil-Deligne cannot certify the
    count and only measurement can speak.
    WHY REGIME (b) MATTERS FOR COST. A subgroup base has polylog membership and
    size p^(1/m); if its distribution is random, relation supply per target is
    Poisson with mean near 1 and the whole index-calculus cost sits in the
    per-target decomposition solve, which this experiment charges with two
    engines (exact root-finding enumeration with counted field operations,
    and msolve on the binomial-membership system).
  assumptions:
    - >-
      Prime-order curves, so the whole curve is the target subgroup
      (KN-OPEN-5b3a08 Q2's cofactor confound cannot arise) and there is no
      2-torsion (no point has y = 0, so every liftable x gives exactly two
      points).
    - >-
      j = 0 and j = 1728 are excluded because their automorphisms x -> zeta*x
      and x -> -x preserve cosets of mu_d when 3 | d or 4 | d respectively,
      which would impose a known symmetry on D; that symmetry is a known
      structure, not the one under test.
    - >-
      The Semaev polynomials are derived independently and validated in-run by
      exact identity checks; harness/semaev.py's s4_expr is not used
      (KN-OPEN-5b3a08 Q1).
    - >-
      Size matching is exact in liftable x-values (K), hence in B = 2K; the
      random null is a uniformly random K-subset of all liftable x-values of
      the same curve, which in discrete-log coordinates is a uniformly random
      negation-symmetric subset of Z/NZ minus 0 with B/2 pairs.
    - >-
      Target-dependent bases are NOT tested: g and d are fixed per curve by a
      deterministic rule before any target is drawn.
  dominated_by: >-
    Pollard rho (about sqrt(pi*N/2) group operations, memory O(1)) on time and
    memory at every tested size, PREDICTED: the projected charged
    index-calculus cost with these bases scales as about p^1 (slope 0.9 to 1.3
    in log2 p) against rho's p^(1/2). Checked row of the frontier: generic rho
    only; no representation in the ledger's F2 frame currently beats it at
    any tested size. Set from the cost model before measurement, and the
    experiment re-measures both on the same curves.
  sota_delta: >-
    None claimed. The predicted projected-cost slope exceeds rho's by at least
    0.3 in log2 p at both m. A measured slope at or below rho's would be an
    unexpected observation requiring review-breakthrough before any reading.

  proof_search_map:
    bottleneck: >-
      Relation supply and its charged cost for bases with polylog membership.
      KN-FIND-007 fixes the MEAN yield for every base of a given size, so the
      only supply quantities a base definition can move are the distribution
      of decompositions over targets (coverage, dispersion, Fourier bias) and
      the cost of finding them. Every index-calculus cost model in the lane
      multiplies relations-needed by cost-per-trial divided by the
      per-trial hit rate; the hit rate is coverage (one relation per target)
      or the mean (harvest-all), and the trial cost is the solve.
    baseline_embedding:
      parameter_slice: >-
        (i) ell = 1, X = F_p^*: the base is the whole group minus at most the
        two points with x = 0, and c(R) is known in closed form:
        (N-1)/2 for m = 2 and (N^2-1)/6 for m = 3 for every R when b is a
        non-square, and within [(N-1)/2 - 2, (N-1)/2] and
        [(N^2-1)/6 - (N-1), (N^2-1)/6] otherwise. (ii) The EV-FB-001 slice:
        p = 16411, m = 3, B in {6, 8, 10, 12} points, random and interval
        bases, whose recorded random-row yields 0.00330, 0.00716, 0.01318,
        0.02001 are reproduced by the conservation means binomial(B+2,3)/N,
        which at N = 16411 are 0.00341, 0.00731, 0.01341, 0.02218 (ratios
        1.03, 1.02, 1.02, 1.11; EV-FB-001's rows are sampled estimates of
        unrecorded sample size).
      reproduction_check: >-
        Frozen fixtures, computed in-run on every curve before any structured
        base is read: the identity and ell = 1 closed forms at every target,
        the conservation identity for every base, and the EV-FB-001 anchor
        rows at p = 16411 with the ratio to the recorded yields inside
        [0.8, 1.25] (outside triggers an instrument investigation).
    observation_collision:
      observable: >-
        Per base: mean c (collides for ALL bases of equal size, so it carries
        no structural information and is used only as an instrument gate),
        coverage, dispersion index Var(c)/Mean(c), regime-(a) residue-label
        profile (one-way F statistic of c across labels of x(R)), and the
        maximal nontrivial Fourier coefficient of D along the discrete-log
        coordinate.
      distinct_preimage_search: >-
        PERFORMED ANALYTICALLY BEFORE COMPUTE. (1) Mean yield: every pair of
        equal-size bases collides (KN-FIND-007); dropped as a discriminator.
        (2) Size versus structure: a coset base and a random base differ in B
        by delta, which moves every statistic; removed by matching K exactly,
        and delta is reported separately. (3) Group automorphisms: D and u*D
        (u a unit mod N) have identical count multisets, so any coset base
        preserved by a curve automorphism collides with a structured
        signature; removed by excluding j = 0, 1728. (4) Coverage at mean near
        1 cannot separate a Sidon-like base from a random one when both sit
        near the Poisson value; the Fourier-bias column is recorded beside it
        so that 'same coverage, different additive structure' is a separable
        row. (5) Engine artifacts that mimic an anomaly are separated by the
        interval-K control run through byte-identical routines, and by
        E0/E1 exact agreement.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Regime (a): the coset-restricted decomposition count as the
          F_p-point count of the summation system pulled back along
          x_i = g*u_i^ell (a degree-ell cover of each x-line). Regime (b): the
          zero-dimensional system S_{m+1}(x_1..x_m, x_R) = 0, x_i^d = g^d, whose
          sparse binomial membership equations keep the description size
          O(log d) while the degree is d.
        predicted_gain: >-
          None claimed for the mean (identity). For the distribution: an
          anomaly factor on coverage or dispersion, sign pre-registered from
          delta, measured only. For cost: none predicted; the projected
          charged index-calculus slope is predicted near 1 in log2 p.
    quantifier_order: >-
      CLAIMED FORM: THERE EXISTS a pre-registered statistic family F (one of
      eight: coverage in regime (b) at m = 2, 3; dispersion in regimes (a) and
      (b) at m = 2, 3; residue-label profile in regime (a) at m = 2, 3) such
      that, POOLED OVER the tested curves and bases of that family, the
      delta-signed Stouffer statistic of per-cell z-scores against the
      matched random null is at least 3.0 and the effect is present at no
      fewer than 2 of the 4 prime levels. NEGATIVE FORM: FOR ALL eight
      families, the pooled statistics are below 2.0 in absolute value, no
      cell exceeds the per-cell Bonferroni threshold, and the family's
      detectable effect at power 0.8 is at or below its declared reference
      effect. DEPENDENCIES: curves, primes, d, g, and coset representatives
      are fixed by deterministic SHA-256 rules before any target or random
      base is drawn; random bases depend on (p, curve, base label, draw
      index) only; targets never influence the base.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested toy primes (log2 p in 14..20 plus the p = 16411 anchor),
        curves, arities and bases: 'coset / subgroup bases do or do not
        deviate from matched random bases in the distribution of
        decomposition yield', with deviation size, sign, and minimal
        detectable effect on record; and measured projected-cost slopes over
        log2 p in [14, 20] for two named engines against measured Pollard rho.
        It certifies NO attack, NO exponent, and nothing at medium or
        cryptographic size; a negative closes only the tested scope.
      nearby_object_control: >-
        Three nearby objects run through byte-identical routines: the
        interval-K base (degree-1 structure, known mean-invariant); the
        uniformly random K-subset (the null, 100 draws per cell) and its
        curve-free twin GENERIC-ZN (random negation-symmetric subsets of Z/NZ
        drawn by integer RNG, equal in law); and a KNOWN-POSITIVE object, the
        small-multiples base {+-P0, ..., +-(B/2)P0}, whose coverage collapse
        (KN-FIND-007 consequence 3) the meter must detect or the run is void.
    proof_obligations:
      - claim: >-
          x lies in g*H_ell iff x = g*u^ell has a solution u in F_p^*; x lies in
          g*mu_d iff x^d = g^d (d | p-1)
        responsibility: feasibility
      - claim: >-
          E0 (discrete-log convolution census) counts exactly the size-m
          multisets of D summing to each R, via the Polya formulas
          c2 = (f*f + f(R/2))/2 and c3 = (f*f*f + 3 f2*f + 2 f(R/3))/6
        responsibility: correctness
      - claim: >-
          E1 (per-target Semaev root-finding) returns exactly the
          decompositions E0 counts, each certified by point arithmetic
        responsibility: correctness
      - claim: sum over R of c(R) equals binomial(B+m-1, m) for every base
        responsibility: baseline
      - claim: >-
          the membership predicates have degree (p-1)/ell and d, outside
          KN-OPEN-020's scoped-out bounded-degree class
        responsibility: scope
      - claim: >-
          membership (one exponentiation), the E1 trial, the msolve solve, and
          modeled linear algebra are all charged in the projected cost
        responsibility: runtime
      - claim: >-
          the random-draw count and cell count give a pooled minimal
          detectable effect at or below each family's reference effect
        responsibility: success_probability
      - claim: >-
          a negative closes only the tested (p, curve, m, ell or d, g) scope
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL. No complexity improvement is claimed. The cost arm measures slopes
