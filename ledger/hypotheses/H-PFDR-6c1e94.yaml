  test_boundary:
    instances:
      - >-
        Prime-order ordinary short-Weierstrass curves y^2 = x^3 + a*x + b over
        F_p, a and b nonzero, N = #E prime, N != p, N != p+1; three curves per
        prime; primes: p = 16411 (the EV-FB-001 anchor) and, for
        k in {14, 16, 18, 20}, the smallest prime p >= 2^k + 1 with
        p = 1 mod 210 and divisors of p-1 in both regime-(b) windows.
      - >-
        Regime (a): X = g*H_ell for ell in {3, 5, 7} dividing p-1 (ell in
        {3, 5} at p = 16411), three cosets per ell (g = 1 and the two smallest
        integers in distinct nontrivial cosets); ell = 1 (X = F_p^*) as the
        trivial control.
      - >-
        Regime (b): X = g*mu_d with d | p-1 chosen closest in log to
        d2* = sqrt(2p) (m = 2) or d3* = (6p)^(1/3) (m = 3) within the ratio
        window [0.5, 2]; three cosets (g = 1 and two nontrivial). At
        p = 16411 only m = 3 (d = 30) exists; m = 2 is not constructible
        there (16410 = 2*3*5*547 has no divisor in [90.6, 362.3]).
    parameters:
      arities: [2, 3]
      prime_levels: 'p = 16411 anchor; log2 p in {14, 16, 18, 20}'
      curves_per_prime: 3
      random_null_draws_per_cell: 100
      engines: 'E0 exact discrete-log convolution census (all targets); E1 exact per-target Semaev root-finding with counted field operations; E2 msolve 0.6.5 (regime (b) only)'
    implementation: >-
      python3 with python-flint 0.9, numpy, sympy, galois, and msolve 0.6.5
      (/usr/bin/msolve). No Sage, Singular, Macaulay2 or Magma. Full
      protocol in experiments/EXP-PFDR-b83f17/specification.yaml.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      total_cpu_hours: null
      maximum_memory_gb: 8
      maximum_runs: 14

  falsification_conditions:
    - >-
      NEGATIVE (the Coordinator's prior): every one of the eight families has
      |delta-signed Stouffer Z| < 2.0 and family-Bonferroni undirected
      p > 0.05/8, no cell exceeds the per-cell Bonferroni threshold, and each
      family's pooled minimal detectable effect meets its reference effect.
      Structure invariance then extends from the mean to the distribution for
      power-residue cosets and multiplicative subgroups at the tested scope.
      Per AGENTS.md, a single unreplicated empirical-only run supports weaken
      plus replication, never reject_scoped.
    - >-
      MECHANISM FAILURE: a family deviates (undirected, family-Bonferroni)
      but the delta-signed statistic is below 3.0 or of opposite sign. The
      anomaly is recorded as an unexpected observation; the cover-sign
      mechanism is not supported.
    - >-
      ADDITIVE DEGENERACY (H-PFDR-8a4f44 reading): subgroup-base coverage at
      least 0.05 below the random mean at two or more of three curves in a
      level; recorded for H-PFDR-8a4f44 as well.
    - >-
      COST DOMINANCE: projected index-calculus slopes exceed rho's by at least
      0.3; dominated_by stays Pollard rho with the measured slopes on record.

  interpretation_limits:
    - >-
      KN-OPEN-020 CLASS, DECLARED: high-degree membership (degree (p-1)/ell and
      d; both sparse binomials, so description size is O(log p)), fixed per
      curve. The target-dependent and implicit-membership classes are not
      touched.
    - >-
      Toy tier only. Levels log2 p in [14, 20]; any slope is descriptive over
      that range and is not extrapolated. A positive distributional anomaly
      authorizes exactly a replication on fresh curves and a growth-with-p
      design; it claims no advantage.
    - >-
      Even a real distributional anomaly moves at most coverage toward
      min(1, mean); by KN-FIND-007 the one-relation-per-target gain is at most
      1.582 and the harvest-all gain is zero. Only the solve-cost column can
      move an exponent, and it is predicted not to.
    - >-
      Regime-(a) bases have |FB| about p/ell and are not index-calculus-sized;
      they test the structure question only. Regime (b) is the
      index-calculus-relevant regime.
    - >-
      The source idea's lifted-system solving-degree prediction is NOT tested
      in regime (a): the pulled-back system is positive-dimensional and msolve
      accepts zero-dimensional systems only. Regime (b) records msolve's
      reported parametrization degree and solve time instead.
    - >-
      Statements are scoped to the named curves, primes, m, bases, engines
      (python-flint 0.9, msolve 0.6.5) and budgets. Nothing transfers to
      extension fields, to other curve families, or to cryptographic sizes.

