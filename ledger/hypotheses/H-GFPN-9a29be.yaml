  title: >-
    Symmetrization-aware Gaudry cost audit of EcGFp5 (n=5, m=5 PDP ladder)
  status: approved
  status_note: >-
    Pre-run approval paired to EXP-GFPN-05ff43 under DEC-20260920-fe73de.
    Not supported. Transfer to p=2^64 is conditional on HEUR-GFPN-DFLAT as
    validated (or falsified) by the toy ladder. No break is claimed.

  statement: >-
    The EcGFp5 design note's "≥ 2^142" Gaudry floor is computed for the RAW
    descended n=5, m=5 system (ideal degree D ~ 2^20, per-system floor D^2 ~
    2^40). EcGFp5's rational 2-torsion enables the (Z/2)^4 ⋊ S_5
    symmetrization of FGHR/FHJRV, under which solutions form orbits of size
    |G| ≈ 1920 and the symmetrized ideal degree is predicted ~2^9. Measuring
    D and F_p operation counts per PDP arm — (i) raw, (ii) S_5, (iii)
    2-torsion+S_5 — on a toy-p' ladder (≥3 primes spanning ≥12 bits) on
    EcGFp5-shaped curves, verifying D flatness (HEUR-GFPN-DFLAT), and
    projecting an arithmetic-only cost band at p = 2^64 − 2^32 + 1, yields a
    concrete band next to the design note's floor. Predicted band under free
    orbits: ~2^121 (D^2) to ~2^132 (nominal 5·D^3). "128 still holds; floor
    was loose by ≥8 bits" is an admissible outcome. No asymptotic exponent
    claim; no statement about EcMasFp5 in this hypothesis (prime-order S_5
    arm is a secondary control shape only where the protocol permits).

  mechanism: >-
    Gaudry: factor base F = {P ∈ E(F_{p'^5}) : x(P) ∈ F_{p'}}; decompose R as
    a sum of 5 factor-base points by solving S_6(x(R), x_1..x_5) = 0 after
    Weil restriction to F_{p'}. Arm (i) solves the raw descended system. Arm
    (ii) rewrites in elementary symmetric functions of x_1..x_5 (S_5). Arm
    (iii): translation by the rational 2-torsion (0,0) on the double-odd model
    is x ↦ b/x; systems in t_i = x_i + b/x_i then elementary-symmetric,
    giving (Z/2)^4 ⋊ S_5. Ideal degree measured by FGLM (msolve / Macaulay2);
    per-PDP cost charged as F_p operations including symmetrized-polynomial
    construction and orbit lifting. D is predicted p-independent
    (HEUR-GFPN-DFLAT); transfer to p = 2^64 counts systems and LA size, never
    wall time. Timeout at m=5 ⇒ "not measured"; m=4 Joux–Vitse fallback is the
    observable (KN-LIT-673219).

  assumptions:
    - Public parameters; every DLP instance has a known scalar and is verified.
    - Same targets and same solver across arms on each cell.
    - Orbit non-freeness is measured: report D_sym · |G| / D_raw per arm/cell.
    - Number of systems / LA size at p=2^64 follow Gaudry double-large-prime
      balancing as in the EcGFp5 note unless a separate arm is declared.
    - Timeouts and memory exhaustion are not negative mathematical evidence.

