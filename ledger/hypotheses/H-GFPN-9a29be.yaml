  proof_search_map:
    bottleneck: >-
      Whether the symmetrized ideal degree falls by ~|G| at m=5 and what the
      actual FGLM exponent (2 vs 3) is on these systems.
    baseline_embedding:
      parameter_slice: >-
        n=4 cells reproducing a published Joux–Vitse / FHJRV timing within 2×
        before trusting n=5 numbers.
      reproduction_check: >-
        One published n=4 decomposition timing reproduced within 2× on the
        same solver family.
    observation_collision:
      observable: >-
        D per arm (FGLM), F_p ops per PDP, success rate vs 1/|G|-corrected
        expectation, projected cost band at p=2^64.
      distinct_preimage_search: >-
        Matched random curves with and without rational 2-torsion at the same
        p' separate "EcGFp5 shape" from "any curve of this torsion type".
    constructive_transforms:
      - transform: torsion_symmetrization
        proposed_object: S_6 in t_i = x_i + b/x_i then elementary symmetric in t_i
        predicted_gain: D drops by ~2^10.9 on EcGFp5 arm (iii)
      - transform: permutation_symmetrization
        proposed_object: S_6 in elementary symmetric functions of x_1..x_5
        predicted_gain: D drops by ~2^6.9 (S_5-only)
    quantifier_order: >-
      There exists a preregistered toy-p' ladder at n=5 on which each arm's D
      and per-PDP cost are measured end-to-end on fresh known-scalar targets.
    method_ceiling:
      strongest_certifiable_claim: >-
        A concrete cost band at p=2^64 under HEUR-GFPN-DFLAT with measured
        constants; no asymptotic statement.
      nearby_object_control: >-
        Random curves of both torsion types; n=4 published-timing anchor.
    proof_obligations:
      - claim: Every accepted decomposition lifts to 5 verified factor-base points summing to R.
        responsibility: correctness
      - claim: D is flat along the toy ladder for each arm (or HEUR-GFPN-DFLAT is falsified).
        responsibility: scope
      - claim: Symmetrized-polynomial construction and orbit lifting are charged.
        responsibility: runtime
      - claim: Systems/LA at p=2^64 use measured success rate, not 1/m!.
        responsibility: cost-model

  heuristic_assumptions:
    - id: HEUR-GFPN-DFLAT
      formal_statement: >-
        For fixed n=5, fixed symmetrization arm A ∈ {raw, S_5, 2-torsion⋊S_5},
        and for all primes p' above a small absolute bound (operationally: every
        p' on the frozen toy ladder), the FGLM ideal degree D_A of the descended
        m=5 PDP system over F_{p'} is independent of p' up to relative variation
        < 10% across any three ladder primes spanning ≥ 12 bits.
      random_model_justification: >-
        The descended ideal is cut out by polynomials whose degrees and
        monomial structure are determined by n and the symmetrization group,
        not by the characteristic; for large p' the Gröbner geometry is that of
        a generic complete intersection of those degrees (classical
        Macaulay/FGLM degree formulae), so D_A is a combinatorial invariant of
        (n, arm) rather than of p'.
      supporting_results:
        - ref: KN-LIT-8aff72
          provenance: retrieved
          claim: Design-note degree model D ~ 2^{k(k−1)} depends on k=n only.
        - ref: KN-LIT-673219
          provenance: retrieved
          claim: Relation-search complexity stated in terms of n and q, with
            Gröbner degree governed by system shape.
      validation_experiment_ids:
        - EXP-GFPN-05ff43
      falsification_condition: >-
        On any completed arm, measured D varies by more than 10% across three
        toy primes spanning ≥ 12 bits. Extrapolation of that arm to p=2^64 is
        then void (report "not transferable"); the timeout/infra case does not
        falsify the heuristic.

  asymptotic_claim:
    problem: ECDLP on E(F_{p^5}) via Gaudry index calculus (concrete floor)
    prior_best: EcGFp5 design-note raw-system floor ≥ 2^142 (theoretical)
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: >-
      Symmetrized-polynomial construction, orbit lifting, sparse LA at
      ~p^{2−2/5} rows; FGLM exponent between 2 and 3.
    claim_kind: constant_factor

  predictions:
    - metric: ideal_degree_ratio_D_raw_over_D_sym
      direction: higher
      minimum_effect: ≥ 2^9 on EcGFp5 arm (iii) and ≥ 2^6 on S_5-only arm, every completed toy cell.
    - metric: full_ecdlp_cost_band_bits_at_p_2_64
      direction: lower
      minimum_effect: >-
        Upper edge of EcGFp5 arm-(iii) band below 2^135 when HEUR-GFPN-DFLAT
        holds; design-note 2^142 shown loose by ≥ 8 bits (or band containing
        128 reported as "claim inside band").
    - metric: D_flatness_across_toy_ladder
      direction: different
      minimum_effect: D varies by < 10% across ≥3 primes spanning ≥12 bits per arm.

  test_boundary:
    instances:
      - EcGFp5-shaped double-odd curves over F_{p'^5} on the toy ladder
      - Matched random curves with/without rational 2-torsion
      - Known-scalar PDP targets (verified)
    parameters:
      n: 5
      m_primary: 5
      m_fallback: 4
      p_crypto: '18446744069414584321'
      toy_ladder: ≥3 primes spanning ≥12 bits
      arms: [raw, S_5, torsion_S_5]
    implementation: EXP-GFPN-05ff43
    budget:
      wall_clock_seconds: null
      memory_gb: 32

  falsification_conditions:
    - D_sym on arm (iii) is not ≥ 2^9 below D_raw on every completed toy p'.
    - HEUR-GFPN-DFLAT fails (D varies >10% across the ladder) — extrapolation void.
    - Per-PDP F_p ops on arm (iii) stay above 2^36 on completed cells, leaving the design-note floor essentially intact.
    - Named EcGFp5-shaped curves differ measurably from random same-torsion controls (mechanism not generic; re-scope).

  interpretation_limits:
    - Band containing 128 is not a break; report "claim inside band".
    - Nothing about curves over other primes or other extension degrees.
    - Arithmetic-only transfer at p=2^64; wall time is never extrapolated.
    - m=5 timeout ⇒ not measured (rule 3); m=4 fallback does not substitute for m=5 D.

  related_experiments:
    - EXP-GFPN-05ff43
