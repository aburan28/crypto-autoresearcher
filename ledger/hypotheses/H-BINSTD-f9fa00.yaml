    The n list is 17, 19, and 23. Their sum is 59 and their product
    is 7429. The gaps are 2 and 4. Their product is 8, and 23 minus
    17 is 6. The dimensions are 3 and 4. Their product is 12, equal
    to the catalog floor. Three n values times two dimensions is 6
    cells. Six times 12 is 72, and 72 divided by 12 is 6, equal to
    the hour cap. The bound is 70 hundredths. Seventy exceeds 50 by
    20. Twelve divided by the distinct-value floor 3 is 4. The
    product of 20 and 4 is 80. Seven times 3 exceeds 10 times 2 by
    1, so 7 over 10 exceeds 2 over 3. Seven times 5 exceeds 10 times
    3 by 5, so 7 over 10 exceeds 3 over 5.
  mechanism: >-
    The proposal writes the n list, the dimensions 3 and 4, the
    catalog floor 12, the bound 0.70, the distinct-value floor 3,
    and the hour cap 6. This contract checks those integers. It
    does not run an encoding.
