hypothesis:
  id: H-PFDR-152561
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  added: '2026-09-04'
  derived_from_idea: IDEA-20260808-d21021
  batch_id: BATCH-2c45e2
  statement: >-
    THE MEAN OF THE HQC ERROR WEIGHT IS PINNED BY A CONSERVATION LAW AND THE
    VARIANCE IS NOT, AND THE SECOND FACT IS MEASURABLE AT DEPLOYED PARAMETERS
    WHILE THE THIRD - THAT IT MATTERS - IS NOT. Let the error vector be
    e = x r2 - r1 y + e0 in the cyclic ring of length n, with secret supports of
    size omega and attacker-derived supports of sizes omega_r and omega_e. For a
    support S write r_S(d) for the number of ordered pairs of its elements with
    difference d, and define the additive energy Psi(S) as the sum of the squares
    of r_S(d) over nonzero d.
    (S1 MEAN CONSERVATION, EXACT) For every fixed ciphertext support triple and
    uniformly random secret supports, the probability that a given coordinate of e
    is one is the SAME number for every coordinate and depends on the ciphertext
    supports only through their cardinalities, because the relevant intersection
    count is hypergeometric for every coordinate and every attacker-chosen support.
    The regression slope of the mean weight against Psi is therefore EXACTLY ZERO.
    This is a theorem and it is used as the null, not as a finding.
    (S2 COVARIANCE STRUCTURE, EXACT AND MEASURABLE) The covariance of two
    coordinates of e is a function of the difference multiplicities of the three
    attacker-derived supports alone, so the variance of the weight of e is the
    binomial variance plus a term that is an explicit increasing function of those
    multiplicities. Because the total multiplicity mass is fixed by the weight
    budget, the variance is maximised by ciphertexts whose difference spectra are
    maximally concentrated, that is by maximal Psi. The regression slope of the
    variance against Psi is therefore STRICTLY POSITIVE and equal to the
    closed-form prediction.
    (S3 SECURITY CONSEQUENCE, BLOCKED AND NOT CLAIMED) Any step from S2 to a
    decoding-failure-rate consequence, a grinding gain, or a gap between an average
    and a maximum in a correctness definition is BLOCKED under RQ-HQC-001
    constraint 1 until the relevant primary sources are filed as knowledge-corpus
    entries, and is not claimed by this hypothesis in any form.
  mechanism: >-
    The HQC decoding-failure analysis models the error vector as a binary symmetric
    channel and justifies that by proving the marginal is exactly the channel
    parameter. The marginal being exact is why the model looks safe and is also why
    it cannot see a second-moment effect - a marginal is a first moment and a
    decoding failure is a tail event. The exact computation shows the first moment
    is invariant under everything the attacker controls while the second moment is
    a linear functional of attacker-controlled difference spectra. With the mean
    pinned, any redistribution of mass moves probability into the tails of a convex
    increasing functional. That is the mechanism, and it is a redistribution-under-
    conservation shape rather than a change in any average.
  band_non_degeneracy:
    checked_by: TASK-20260904-5423ad
    finding: >-
      THE MEAN-SLOPE PREDICTION IS A NULL OF WIDTH ZERO BY CONSTRUCTION AND IS
      CORRECTLY USED AS ONE, but the VARIANCE-SLOPE band as the source idea states
      it - strictly positive at 3 jackknife standard errors - has no declared
      minimum detectable slope, so the design as written could not distinguish
      "no effect" from "no power". The direction of the failure is the one the
      source idea itself names as the informative negative, which makes an
      under-powered null especially dangerous here.
    change_made: >-
      Two changes. First, the minimum detectable variance slope at the declared
      sample sizes is COMPUTED AND FROZEN BEFORE ANY MEASUREMENT, from the spread
      of Psi across sampled ciphertext triples and the jackknife error of a
      variance estimate at the declared inner sample size, and the run reports it
      alongside the measured slope so that a null reads as "no effect above X"
      rather than "no effect". Second, a PLANTED-Psi arm is added - supports built
      to a deliberately concentrated difference spectrum of KNOWN Psi, well outside
      the natural range - so that the instrument is shown to move by the
      closed-form predicted amount before any natural-range null is interpreted.
    alternative_hypothesis_range: >-
      Under H_BSC-robust the variance slope is exactly 0 and the measurement must
      be able to exclude the closed-form predicted slope; under S2 the slope equals
      the closed form. The planted arm fixes the scale by construction - a support
      with Psi several natural standard deviations above the ensemble mean must
      move the measured variance by the closed-form amount, which is a difference
      the design can resolve or the design is reported as under-powered rather
      than as negative. The confounding alternative - that any measured slope
      tracks a correlated support statistic rather than Psi - is separated by
      partialling out the third-moment statistic and the maximum multiplicity
      before any attribution to Psi is made, and by the flattened-spectrum decay
      sweep.
  assumptions:
  - >-
    The parameters used are read from the filed corpus record of the HQC
    specification rather than recalled. TASK-20260904-5423ad read
    knowledge/literature/KN-LIT-b9e1a8.md and confirms it records n = 17669 with
    omega = 66 and omega_r = omega_e = 75 for the first parameter set, n = 35851
    with omega = 100 and omega_r = omega_e = 114 for the second, and n = 57637 with
    omega = 131 and omega_r = omega_e = 149 for the third, with n stated to be the
    smallest primitive prime greater than the product of the two inner lengths.
    The executor re-reads them and does not transcribe from this record.
  - >-
    S1 and S2 are exact statements about a specific probability space - fixed
    ciphertext supports, uniformly random secret supports - and are not claims
    about the security of anything.
  - >-
    THE FUJISAKI-OKAMOTO CORRECTNESS FRAMEWORK CITED BY THE SOURCE IDEA AS
    DEFINING ITS ERROR WITH A MAXIMUM OVER MESSAGES IS EXPLICITLY RECALLED AND
    UNVERIFIED IN THAT IDEA. It is NOT assumed here and no claim below depends on
    it. Any statement requiring it is inside S3, which is blocked.
  - >-
    The published decryption-failure attack line that the corpus record names as
    absent from the specification's reference list HAS NOT BEEN READ BY THIS
    PROGRAM. Whether the mechanism below is already published is UNRESOLVED, and
    resolving it is a precondition of any novelty statement.
  proof_search_map:
    bottleneck: >-
      The second moment of the error weight as a function of attacker-controlled
      ciphertext supports. The first moment is pinned by S1 and the failure event
      is a tail event, so the second moment is the only attacker-movable quantity
      in the analysis chain before the decoder.
    baseline_embedding:
      parameter_slice: >-
        Ciphertext supports drawn uniformly at random, i.e. the ensemble the
        specification's own analysis assumes. There the measured mean weight must
        reproduce the specification's channel parameter and the measured variance
        must reproduce the binomial variance plus the ensemble-average correction.
      reproduction_check: >-
        A frozen fixture at the deployed first parameter set in which the empirical
        mean weight over at least 10^6 samples matches the specification's stated
        channel parameter to within the sampling error, recorded as a numeric
        comparison rather than a plot.
    observation_collision:
      observable: >-
        The additive energy Psi of a support, a single integer.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, AND IT IS THE PRINCIPAL CONFOUND. Psi is a
        degree-four summary of a support and is strongly correlated with the
        maximum difference multiplicity and with the third-moment statistic. Many
        distinct supports share a Psi and many distinct statistics move with it, so
        attribution to Psi rather than to a correlate is NOT automatic and is
        established by partialling out and by the flattened-spectrum sweep, or it
        is not established at all.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        The full difference-multiplicity spectrum of the attacker-derived supports,
        rather than the scalar additive energy, as the object the covariance is a
        function of.
      predicted_gain: >-
        An exact closed form for the variance rather than a fitted slope, and a
        partial-correlation design that can separate the energy from its
        correlates.
    quantifier_order: >-
      CLAIMED - FOR ALL fixed ciphertext support triples and FOR uniformly random
      secret supports, the coordinate marginal is constant across coordinates and
      the covariance is the stated function of difference multiplicities. THE
      READING EXPLICITLY NOT CLAIMED - that there EXISTS an attacker strategy whose
      gain follows from this. That existential is S3 and it is blocked.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at the deployed parameter set the mean error weight is invariant under
        attacker-controlled ciphertext support structure while the variance is an
        increasing function of the additive energy, with a measured slope matching
        a closed form and with the effect attributed to the energy rather than to
        its correlates. IT CAN NEVER CERTIFY a decoding-failure rate, a grinding
        gain, a query-budget consequence, or anything about the security of any
        parameter set.
      nearby_object_control: >-
        SUPPORTS WITH A DELIBERATELY FLATTENED DIFFERENCE SPECTRUM at the same
        cardinality. The variance effect must DECAY toward the flat-spectrum value
        as the flattening increases. A quantity that fails to decay when the
        parameter meant to destroy it increases is the canonical artifact tell and
        the effect is not real.
    proof_obligations:
    - claim: The coordinate marginal is constant across coordinates and depends only on cardinalities.
      responsibility: correctness
    - claim: The covariance is the stated function of difference multiplicities.
      responsibility: correctness
    - claim: The measured variance slope matches the closed form within jackknife error.
      responsibility: size
    - claim: The effect survives partialling out the third moment and the maximum multiplicity.
      responsibility: scope
    - claim: The planted-energy arm moves the variance by the predicted amount.
      responsibility: baseline
    - claim: No security consequence is derived anywhere.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. The source idea frames a query-budget exponent
    consequence. That consequence lives entirely in S3, which is blocked under
    RQ-HQC-001 constraint 1, so recording an asymptotic_claim here would assert
    exactly what this hypothesis declines to assert.
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: >-
      FOR supports drawn by the specification's fixed-weight sampler from a
      uniform seed, the upper tail of the additive energy behaves like that of a
      uniformly random subset of the same cardinality of the cyclic index set, in
      the sense that the standardised energy has a Gaussian upper tail over the
      range reachable by direct sampling.
    random_model_justification: >-
      The mean and variance of the additive energy of a uniform subset of given
      size are exactly computable, because the energy is a bounded-degree
      U-statistic of the indicator vector, which supplies the centering and scaling
      with no assumption. The heuristic is only the Gaussian shape of the upper
      tail, imitating the classical limit behaviour of bounded-degree U-statistics.
    supporting_results: []
    supporting_results_note: >-
      EMPTY. The classical U-statistic limit theorem is recalled and unread by this
      program and may not discharge this field under AGENTS.md rule 9. The exact
      mean and variance are computed directly instead, and the tail shape is
      measured rather than assumed.
    validation_experiment_ids:
    - EXP-PFDR-4af863
    falsification_condition: >-
      The empirical distribution of the standardised additive energy over at least
      10^6 sampled supports departs from the Gaussian prediction by more than the
      declared tolerance in the upper tail, or the specification's own sampler
      differs materially from uniform sampling on this statistic beyond the
      discrepancy the specification itself bounds.
  - id: HEUR-002
    formal_statement: >-
      FOR the two-stage decoder at its true inner block length, the conditional
      failure probability as a function of the error weight is convex and strictly
      increasing over the operating interval around the mean weight.
    random_model_justification: >-
      The imitated model is the large-deviation convexity of binomial tails - the
      rate-function shape that makes Chernoff exponents convex - transported to the
      decoder's failure region. The rigorous half is that the failure event
      contains an explicit event whose probability under a fixed-weight ensemble is
      a ratio of binomial coefficients.
    supporting_results: []
    supporting_results_note: >-
      EMPTY. The propositions of the specification that would sandwich this are in
      the filed corpus record, but this program has not verified that they sandwich
      it, and the maximum-likelihood inner decoder means failure is not a monotone
      function of block weight in general. The convexity is measured directly.
    validation_experiment_ids:
    - EXP-PFDR-4af863
    falsification_condition: >-
      Second differences of the fitted conditional failure probability against
      weight are negative beyond the jackknife error at two or more grid points in
      the operating interval, or the fitted value at the ensemble-typical weight
      disagrees with the specification's own stated value by more than the
      declared tolerance, which indicates an instrument fault rather than a
      discovery.
  structural_ingredients:
  - description: >-
      The HQC specification of 2025-08-22, its parameter sets, its statement that
      each coordinate of the error vector is exactly Bernoulli with the stated
      channel parameter, and its decoding-failure-rate theorem.
    citation: KN-LIT-b9e1a8
    provenance: kb
    verified_by: >-
      TASK-20260904-5423ad read knowledge/literature/KN-LIT-b9e1a8.md and confirmed
      the three parameter triples and the primitive-prime design statement quoted
      in the assumptions above. The propositions and the theorem are named in that
      record; their statements were NOT independently checked against the
      specification PDF by this task.
    role: >-
      supplies the parameters and the model whose second moment this hypothesis
      measures
  - description: >-
      The published decryption-failure attack line against this scheme, named in the
      corpus record as absent from the specification's reference list.
    citation: 'Guo and Johansson, Asiacrypt 2020. NAMED IN THE CORPUS RECORD, NOT READ BY THIS PROGRAM.'
    provenance: recalled
    verified_by: null
    role: >-
      the work that may already contain this statistic; obtaining and reading it is
      a precondition of any novelty claim and of S3
  - description: >-
      This program's own conservation-of-mean pattern, in which geometry cannot
      change a mean yield and can only redistribute it.
    citation: KN-FIND-007
    provenance: internal
    verified_by: >-
      Relayed from IDEA-20260808-d21021 source_refs. NOT opened by
      TASK-20260904-5423ad and marked relayed for that reason.
    role: the structural analogue that suggested the redistribution-under-conservation reading
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      regression slope of the mean error weight against the additive energy, in
      coordinates per unit energy
    direction: different
    minimum_effect: >-
      EXACTLY ZERO within sampling error. THIS IS THE NULL AND IT IS A THEOREM. A
      nonzero slope means the sampler or the estimator is broken and INVALIDATES the
      run; it never means the mechanism is stronger.
  - metric: >-
      regression slope of the variance of the error weight against the additive
      energy, in squared coordinates per unit energy
    direction: higher
    minimum_effect: >-
      Strictly positive and equal to the closed-form prediction within jackknife
      error, AND at least the frozen minimum detectable slope computed before any
      measurement. A slope below the minimum detectable value is reported as
      under-powered, not as zero.
  - metric: >-
      planted-energy response, the measured change in variance on supports built to
      a known concentrated spectrum, in squared coordinates
    direction: higher
    minimum_effect: >-
      Equal to the closed-form predicted change within jackknife error. Failure to
      move at a planted energy several natural standard deviations above the
      ensemble mean means the instrument lacks dynamic range and no null is
      interpretable.
  - metric: >-
      flattened-spectrum decay, the variance excess as a function of the flattening
      parameter, in squared coordinates
    direction: lower
    minimum_effect: >-
      Monotone decay toward the flat-spectrum value. A variance excess that does
      NOT decay as the parameter meant to destroy it increases is the canonical
      artifact tell and voids the effect.
  - metric: >-
      partial variance slope against energy after partialling out the third-moment
      statistic and the maximum difference multiplicity, in squared coordinates per
      unit energy
    direction: higher
    minimum_effect: >-
      Retaining at least half the unpartialled slope with an interval excluding
      zero. Below that, the effect is attributed to a correlate of the energy and
      not to the energy, and the record must say so.
  test_boundary:
    instances:
    - >-
      The first deployed parameter set, at its true n, omega, omega_r and omega_e
      as read from the filed corpus record. At least 10^4 ciphertext support
      triples, each evaluated against at least 10^3 random secret supports.
    - >-
      A planted-energy arm of supports built to a known concentrated difference
      spectrum, at the same cardinalities.
    - >-
      A flattened-spectrum arm with the flattening parameter swept over at least
      five levels.
    - >-
      An inner-decoder arm at the true inner block length for the conditional
      failure probability as a function of weight.
    parameters:
      psi_definition: 'sum over nonzero differences of the squared difference multiplicity'
      inner_samples_per_triple: 1000
      triples: 10000
      partialled_covariates: 'third-moment difference statistic; maximum difference multiplicity'
    implementation: >-
      Sparse cyclic convolution over the binary field, an exact U-statistic
      computation for the additive energy, and a jackknife variance estimator. The
      specification's own fixed-weight sampler and a uniform fixed-weight sampler
      are both implemented and both run.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 8
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
  - >-
    The variance slope is consistent with zero at three jackknife standard errors
    AND the frozen minimum detectable slope is below the closed-form prediction -
    S2 is FALSIFIED and the channel model is more robust than its stated
    justification, which is a genuinely informative negative.
  - >-
    The variance slope is consistent with zero but the minimum detectable slope
    exceeds the closed-form prediction - the run is UNDER-POWERED and is reported
    as such. This is not a negative result.
  - >-
    The mean slope is nonzero beyond sampling error - the instrument is broken and
    the run is INVALID in both arms.
  - >-
    The planted-energy arm fails to move the variance by the predicted amount - the
    instrument lacks dynamic range and no null may be interpreted.
  - >-
    The variance excess does not decay under the flattening sweep - artifact.
  - >-
    The partialled slope falls below half the unpartialled slope - the effect
    belongs to a correlate of the additive energy rather than to the energy.
  - >-
    The published decryption-failure attack line, once read, already uses the same
    statistic - novelty collapses even if the mechanism holds, and the record is
    downgraded to a re-derivation.
  interpretation_limits:
  - >-
    NO OUTCOME OF THIS HYPOTHESIS IS A BREAK AND NO OUTCOME MAY BE REPORTED AS ONE.
    S1 and S2 are exact statements about a probability space and carry no security
    content whatsoever.
  - >-
    S3 IS BLOCKED, NOT MERELY UNPROVEN. RQ-HQC-001 constraint 1, which
    TASK-20260904-5423ad read verbatim, forbids designing an experiment before the
    relevant primary sources are filed as knowledge-corpus entries. The
    specification IS filed, which is what makes S1 and S2 designable; the
    correctness framework and the published failure-attack line are NOT, which is
    what blocks S3. Any statement about a decoding-failure rate, a grinding gain,
    an average-versus-maximum gap, or a query-budget consequence is outside this
    record.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. A decoding-failure
    rate below two to the minus one hundred twenty-eight is NOT MEASURABLE BY ANY
    EXPERIMENT AT ANY SCALE, now or ever, by direct sampling - it would require
    more trials than there are operations in the security budget it defends.
    Nothing in this hypothesis measures the deployed failure rate, and any
    grinding-gain figure extrapolated from a sampling range of at most about
    twenty bits to a budget of one hundred twenty-eight bits is an extrapolation
    across roughly a hundred orders of magnitude and must be labelled as one
    wherever it appears.
  - >-
    The additive energy is correlated with other support statistics. Attribution to
    the energy specifically is established by partialling out and by the decay
    sweep, or it is not established, and the record reports which.
  - >-
    The inner decoder is maximum-likelihood, so failure is not a monotone function
    of block weight in general. Where non-monotonicity is material the convexity
    step of the source idea is not licensed, and HEUR-002 measures it directly.
  - >-
    Whether this statistic is already published is UNRESOLVED. The dominated_by
    position of the source idea rests on a work this program has not read, and
    setting it to null would be an unchecked null.
