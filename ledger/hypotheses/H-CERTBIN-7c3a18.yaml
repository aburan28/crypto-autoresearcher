# =============================================================================
hypothesis:
  id: H-CERTBIN-7c3a18
  question_id: RQ-CERTBIN-836ce2
  question_ids: [RQ-CERTBIN-836ce2, RQ-ICPERF-94c86e]
  proposal_id: IDEA-20260923-5d0b8e
  supersedes_nothing: >-
    It does not supersede H-CERTBIN-a73f1c, which stays weakened and is the
    primary hypothesis of the replication EXP-CERTBIN-3f06d1. It restates the
    MECHANISM that EV-CERTBIN-6c3e0a found in place of TS1.
  source_decision: DEC-20260923-f25b97 (RC-2, RC-3, NA-4)
  goal_ids: []
  goal_ids_note: No goal head is attached or edited (DEC-20260922-61cdc1 NA-2 pending).
  designed_by: coordinator
  proposed_by: coordinator
  recorded_at: '2026-09-24'

  statement: >-
    CEILING FIRST: constant factor at most for the downstream P-GPU premise,
    and for regime-A replay the ceiling is already zero at the Stage-1 cell.
    Parallel Pollard rho dominates; oracle A dominates per attempt at m = 2.
    No ECDLP cost claim.

    Setting: regime A (Weil descent to F_2 with field equations) of the m = 2
    direct S_3 system over F_{2^n}, with the declared fixed-shape multilinear
    Macaulay elimination at D in {3, 4} (EXP-CERTBIN-4e92d7 conventions,
    generalized to (n, l, modulus, V)). For a reference with op log
    (p_k, c_k, X_k), the replayed pivot entry is e_k(r) = a_{k,0} + <a_k, r>
    (Lemma 1). Let T be a family's non-degenerate test targets, H = h_0 + W
    their affine hull, and W^perp the annihilator of W.

    Claim, in three parts, at every regime-A cell tested by
    EXP-CERTBIN-3f06d1 or EXP-CERTBIN-a58c63:
    (P-C1, HEUR-CERTBIN-KR1: full hull rank.) For every reference, the rank of
    {a_k restricted to W} equals dim W. By Lemma 2 applied on the hull, the
    fixed-schedule survival set on H is then the single point r_ref, and
    fixed-schedule (T_ops) retention on non-reference targets is 0 EXACTLY.
    (P-C2, HEUR-CERTBIN-TS1R: balanced hull-rank-increasing pivots.) On the
    pivots whose a_k is independent modulo span{a_j : j < k} + W^perp and
    whose survivor set has at least 100 targets, the conditional hazard lies
    inside its exact 99.9% binomial band around 1/2. Pivots dependent modulo
    that span have hazard exactly 0 (Lemma 3: an instrument identity, not a
    heuristic).
    (P-C3, empirical.) Whole-trace T_strict retention of unsatisfiable
    targets against every unsatisfiable and modal reference is below 0.5 at
    D = 4 (T_strict equality does not imply T_ops equality, so P-C1 does not
    decide it).

  mechanism: >-
    Lemmas 1-3 of EXP-CERTBIN-4e92d7/derivation-note-replay-forms.md (status
    derivation, checked against three independent codes at the Stage-1 cell),
    restated on the hull:
    - Lemma 1: e_k is exactly affine in r, because x_R enters S_3 only through
      x_R and x_R^2 (both F_2-linear) and elimination is a fixed linear map.
    - Lemma 2 (on H): Sigma_H = {r in H : e_k(r) = 1 for all k} is r_ref plus
      the kernel of the linear parts restricted to W, so
      dim Sigma_H = dim W - rank(A|_W).
    - Lemma 3: a pivot whose form is dependent modulo span{a_j : j < k} +
      W^perp is constant on the survivors, hence hazard exactly 0; a
      hull-rank-increasing form vanishes on exactly half of the survivor
      subspace.
    TARGET HULL (OBJ-3). Subgroup targets are x-coordinates of points of odd
    order, hence of 2E, and x(2E) = {x : Tr(x) = Tr(A)} (to be CHECKED per
    curve by counting, not assumed). In the Stage-1 field Tr(x) = r_0; in
    general Tr(x) = <tau, r> with tau_j = Tr(t^j), computed per modulus. So
    subgroup targets lie in an affine hyperplane: linear through 0 when
    Tr(A) = 0 (h = 4 curves), NOT through 0 when Tr(A) = 1 (h = 2 curves).
    Uniform-x targets (F-RANDX) span all of F_2^n. K_rank is therefore
    reported twice: over F_2^n (uniform) and restricted to W (curve targets),
    and predictions are stated on the hull.
    RC-2 COUNTING. The evaluation set counts DISTINCT measurements, keyed by
    (a_k + W^perp, survivor set as a set of target ids). The 15 Stage-1
    in-band pairs were 8 distinct measurements (OBJ-4).

  assumptions:
    - >-
      Everything in regime A is exact linear algebra over F_2 on archived op
      logs; the only statistical content is TS1R's equidistribution of curve
      x-coordinates on the hull with respect to these affine conditions.
    - >-
      Regime B is outside this record. There pivot entries are not F_2-affine
      in the target and Lemma 2 does not apply (see H-CERTBIN-b20d4e, Lemma 2B).

  proof_search_map:
    bottleneck: >-
      Whether regime-A replay has any route left for P-GPU. DEC-20260923-f25b97
      NA-6 reopens regime-A replay iff some reference has K_rank < n at some
      tested cell. P-C1 is that condition, stated on the hull.
    baseline_embedding:
      parameter_slice: >-
        The Stage-1 cell (n = 17, l = 9, curve A = 97044, B = 126251,
        polynomial V) with its archived op logs: K_rank = 17 over F_2^n and 16
        on the hull, survival set {x_R(ref)}, 11 repeated-form zeros and 8
        distinct in-band measurements. The replication's C-PROV re-runs the
        reviewed Stage-1 code, so the replication is a parameter slice away
        from the reproduced baseline.
      reproduction_check: >-
        EXP-CERTBIN-3f06d1 C-FORMS and C-SURV at every cell; the Stage-1
        numbers themselves were reproduced by J3, J4 and J6/J7 of
        REVIEW-CERTBIN-20260923-c51f07.
    observation_collision:
      observable: The affine pivot forms a_k and the survivor sets.
      distinct_preimage_search: >-
        Built in: repeated forms are detected exactly, and distinct
        measurements are counted by (form mod W^perp, survivor set).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The pivot forms restricted to the target hull W.
        predicted_gain: The exact survival-set dimension dim W - rank(A|_W), in place of 2^{-K}.
    quantifier_order: >-
      FOR each tested cell (n, l, curve, V fixed from frozen seeds before any
      target), FOR each reference (drawn before any test target), rank(A|_W)
      = dim W or not (exact). TS1R: FOR the evaluation set fixed by the rule
      above, the count of out-of-band measurements is or is not consistent
      with Binomial(m, 0.001).
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested regime-A cells, with the declared orders and pivot rule:
        the exact survival-set dimension per reference, the distinct-measurement
        hazard table, and whole-trace T_strict retention. Nothing about regime
        B, F4 pair-list traces, other pivot rules, or n outside {17, 19}.
      nearby_object_control: >-
        Uniform-x targets (F-RANDX) span F_2^n, so the same references must
        show rank over F_2^n = n there iff rank on the hull = dim W on curve
        targets plus the Tr direction; the same-support affine null (F-AFF)
        shows whether full rank is S_3-specific.
    proof_obligations:
      - claim: Lemmas 1-3 restated on an affine hull H = h_0 + W (including the non-linear hull of h = 2 curves).
        responsibility: correctness
      - claim: 'x(2E) = {x | Tr(x) = Tr(A)} on the tested curves, checked by enumeration per curve.'
        responsibility: scope
    not_applicable_reason: >-
      Measurement hypothesis with exact lemmas. The map is filled because the
      lemmas carry the claim.

  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: No complexity claim. The promotion gates do not apply.

  heuristic_assumptions:
    - id: HEUR-CERTBIN-KR1
      formal_statement: >-
        (Full hull rank.) At every tested regime-A cell and D in {3, 4}, for
        every reference trace of the declared elimination, rank_F2({a_k|_W :
        a_k != 0}) = dim W, where W is the direction space of the affine hull
        of the family's non-degenerate test targets.
      random_model_justification: >-
        The number of nonzero forms K is in the hundreds to thousands, far
        above dim W <= n. If the forms behaved like independent uniform
        vectors of F_2^n, the probability that K of them fail to span a
        d-dimensional space is at most 2^d * 2^{-K}. The heuristic part is
        treating the elimination's forms as generic.
      supporting_results:
        - EV-CERTBIN-6c3e0a O-2 (K_rank = 17 = n for all 6 references at D = 3 and 4; Stage-1 cell only)
      validation_experiment_ids: [EXP-CERTBIN-3f06d1, EXP-CERTBIN-a58c63]
      falsification_condition: >-
        Any reference at any tested cell and D with rank(A|_W) < dim W. That
        also fires DEC-20260923-f25b97 NA-6's revisit condition for regime-A
        replay at that cell. The small cells (l = 5, 10 Boolean variables,
        D = 3: 176 columns) are where this is most likely to fail.
    - id: HEUR-CERTBIN-TS1R
      formal_statement: >-
        (Balanced hull-rank-increasing pivots; restated successor of TS1.) Fix
        a tested regime-A cell, D = 4 (D = 3 secondary), a family, and its
        non-degenerate test targets T with affine hull H = h_0 + W. For a
        reference and pivot k, let S_k be the targets surviving pivots j < k of
        the fixed-schedule replay. The EVALUATION SET E consists of the pivots
        whose a_k is NOT in span{a_j : j < k} + W^perp and with |S_k| >= 100,
        taken over the family's references and DEDUPLICATED by the key
        (a_k + W^perp, S_k as a set of target ids); m = |E|. For each
        measurement, h_k = #{t in S_k : e_k(t) = 0} / |S_k|, and its exact
        two-sided 99.9% acceptance band at p = 1/2 is the integer interval
        [lo, hi] with P[Bin(|S_k|, 1/2) < lo] <= 0.0005 and
        P[Bin(|S_k|, 1/2) > hi] <= 0.0005, computed in exact integer
        arithmetic. Let o = the number of measurements outside their band.
        TS1R asserts that o is consistent with Binomial(m, 0.001): P[Bin(m,
        0.001) >= o] >= 0.001, computed exactly.
      random_model_justification: >-
        Lemma 3: a hull-rank-increasing affine form vanishes on exactly half of
        the survivor SUBSPACE. The heuristic content is that subgroup
        x-coordinates (a structured subset of the hull, about 2^{n-2} or
        2^{n-1} points) sample that subspace like uniform points with respect
        to these forms.
      supporting_results:
        - Derivation note Lemma 3 (derivation; EXP-CERTBIN-4e92d7)
        - EV-CERTBIN-6c3e0a restricted_P2_reading (15 of 15 in band, 8 distinct; a reading, not a verdict)
      validation_experiment_ids: [EXP-CERTBIN-3f06d1, EXP-CERTBIN-a58c63]
      falsification_condition: >-
        At a cell with m >= 5: P[Bin(m, 0.001) >= o] < 0.001 (exact). Not
        evaluable at a cell with m < 5 (reported, and pooled across cells as a
        secondary reading only).
      instrument_identity: >-
        A pivot dependent modulo span{a_j : j < k} + W^perp with h_k != 0 is
        an INSTRUMENT failure (it contradicts Lemma 3), never evidence about
        TS1R.

  structural_ingredients:
    - description: Lemmas 1-3 (exact replay-form algebra), derivation note of EXP-CERTBIN-4e92d7
      citation: experiments/EXP-CERTBIN-4e92d7/derivation-note-replay-forms.md
      provenance: internal
