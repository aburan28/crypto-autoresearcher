      role: exact survival-set and hazard laws
    - description: x-coordinates of 2E(F_{2^n}) on Y^2 + XY = X^3 + AX^2 + B satisfy Tr(x) = Tr(A)
      citation: null
      provenance: recalled
      verified_by: null
      role: >-
        Hull prediction only. Not relied on: every contract measures the hull
        of its actual targets and checks the trace relation by enumeration.

  reduction_chain:
    core_problem: Trace replay of the per-attempt regime-A Macaulay elimination.
    corollaries: []

  predictions:
    - id: PC-1
      metric: rank(A|_W) versus dim W, per reference, D and cell
      direction: different
      minimum_effect: Equal for every reference (P-C1). Any shortfall is reported with its survival-coset size.
    - id: PC-2
      metric: TS1R out-of-band count o over the distinct evaluation set, per cell
      direction: lower
      minimum_effect: P[Bin(m, 0.001) >= o] >= 0.001 at every cell with m >= 5.
    - id: PC-3
      metric: T_strict unsat retention_family at D = 4, per cell
      direction: lower
      minimum_effect: < 0.5 at every cell; predicted <= 0.01.
    - id: PC-4
      metric: Hazard on hull-dependent pivots
      direction: lower
      minimum_effect: Exactly 0 (instrument identity).
  predictions_source: >-
    Fixed by this record before any run of EXP-CERTBIN-3f06d1 or
    EXP-CERTBIN-a58c63. The Stage-1 values are the only prior data.

  test_boundary:
    instances:
      - EXP-CERTBIN-3f06d1 cells R1 (new h = 2 curve), R2 (new h = 4 curve), R3 (random V, Stage-1 curve); n = 17, l = 9; D in {3, 4}
      - EXP-CERTBIN-a58c63 regime-A arm; (n, l) in {17, 19} x {5, 6}; D in {3, 4}
    parameters:
      references_per_family: 3 unsatisfiable + 2 satisfiable + modal
      evaluation_cut: '|S_k| >= 100'
    implementation: the two contracts' impl/ directories
    budget:
      enforcement: advisory
    excluded_from_boundary:
      - regime B; F4 traces; m = 3; any other pivot rule or order

  falsification_conditions:
    - P-C1 is falsified at a cell by any reference with rank(A|_W) < dim W.
    - TS1R is falsified at a cell per its falsification_condition.
    - P-C3 is falsified at a cell if unsat T_strict retention_family >= 0.5 at D = 4.
    - A nonzero hazard on a hull-dependent pivot, or a C-FORMS / C-SURV mismatch, falsifies the INSTRUMENT, not the hypothesis.

  interpretation_limits:
    - >-
      CLAIM TIER: toy. Scope is the tested regime-A cells, orders and pivot
      rule. A P-C1 success strengthens the Stage-1 obstruction (K_rank at the
      hull dimension) across curves, V and (n, l); it does not by itself close
      regime-A replay for P-GPU, which needs the review-breakthrough round of
      DEC-20260923-f25b97 NA-6.
    - >-
      dominated_by: oracle A per attempt (2^l root-findings) and parallel
      Pollard rho; sota_delta zero.

