  goal_id: GOAL-ECDLP-001
  source_proposal: IDEA-20260814-92f825
  proposal_id: IDEA-20260814-92f825
  title: >
    Stage 0 overlap-fingerprint fiber
    identity on C_7 — injectivity is
    false — before any decoder
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260913-2d2867
  specified_by: DEC-20260913-e90956
  specified_at: '2026-09-13'
  created: '2026-09-13'
  updated: '2026-09-13'
  depends_on:
    - IDEA-20260814-92f825
    - RQ-ECDLP-002
  related_hypotheses: []
  statement: >
    Fix the exact overlap-vector fiber
    on one frozen cyclic group of order
    7 before any decoder, any
    cryptographic-size factor base, or
    any entropy-versus-null comparison
    is claimed. Stage 0 asserts only
    that on C_7, F={0,1}, A={0}, the
    overlap count A(R)=|F intersect
    (F+R)| takes more than one scalar
    preimage for at least one realized
    value, so the nearby injectivity
    claim (distinct scalars always have
    distinct fingerprints) is false.
    A same-size random label set that
    is not a translate of F is the
    matched null and must not be
    treated as the factor-base fiber.
    This is not a decoder and not a
    rho beat. Stages 1+ stay
    unauthorized.
  mechanism: >
    IDEA-20260814-92f825 tracks the
    public overlap fingerprint and its
    exhaustive toy fiber. Stage 0
    freezes a 7-element additive group
    where every intersection can be
    enumerated by hand. No decoder.
    No N^{1/2} search. No ECDLP.
  predictions:
    - id: P-S0-OVFIB
      metric: exact overlap fiber on C_7
      direction: different
      minimum_effect: >
        After fixture_pass, REAL has
        at least one overlap value
        with fiber size >=2. KF
        injectivity is rejected.
        NULL non-translate set is
        not treated as the F-fiber.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KF
      statement: >
        After fixture_pass, KF
        injectivity is accepted.
    - id: F-S0-REAL
      statement: >
        After fixture_pass, every
        realized overlap value has
        fiber size 1.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL C_7 panel
    parameters:
      real_group:
        n: 7
        F: [0, 1]
        A: [0]
        must_some_fiber_ge_2: true
      known_false:
        kind: fingerprint_injective
        must_reject: true
      matched_null:
        kind: non_translate_same_size_set
        set: [0, 3]
        must_not_equal_F_fiber: true
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-214294 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Exhaustive enumeration of C_7.
      Stage 0 is exact integer
      intersection counts. Not a
      decoder. Not a factor-base
      attack. Not a rho beat.
  assumptions:
    - id: A1
      statement: >
        The group is (Z/7Z,+). F={0,1}.
        A={0}. Stage 0 does not decode
        a scalar.
      status: explicit
    - id: A2
      statement: >
        Standing user authorization
        2026-09-06 covers protocol
        approval once the contract is
        complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether some overlap value on
      C_7 has fiber size at least 2.
    baseline_embedding:
      parameter_slice: >
        REAL C_7 F={0,1}, KF
        injectivity, NULL {0,3}.
      reproduction_check: >
        Some fiber >=2. KF rejected.
        NULL not treated as F-fiber.
    observation_collision:
      observable: overlap count versus scalar fiber
      distinct_preimage_search: >
        Hold n and claim injectivity
        (KF). Hold n and replace F by
        a non-translate (NULL).
    constructive_transforms:
      - transform: observation_collision
        proposed_object: Frozen C_7 overlap table.
        predicted_gain: >
          Exact known-false reject on
          injectivity. Zero decoder
          credit.
    quantifier_order: >
      Freeze n, F, A before reading
      the table. A collision on C_7
      does not imply a below-rho
      decoder.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on
        C_7. Never a decoder. Never
        an ECDLP exponent.
      nearby_object_control: >
        NULL is {0,3}. An argument
        that still reports it as the
        F-fiber is proves-too-much.
  knowledge_promotion:
    promoted: []
    not_warranted: Stage 0 design only. Nothing to promote.
  scientific_boundary: >
    Stage 0 P-S0-OVFIB only. Not a
