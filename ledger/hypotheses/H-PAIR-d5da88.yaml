# =============================================================================
# H-PAIR-d5da88 — specified from IDEA-20261006-bf2f6a (bytes copied
# unchanged from origin/design/ssi-2f5c3f-cartier, blob
# efc12c8cab615784842c74a2b58b32267736919c). Question RQ-PAIR-21313f.
# The prediction under test is the idea's own: k(E0) = k(E1) and
# d(E0) < d(E1) at the least eligible prime. The concrete negative is
# that the instance exists and d(E0) >= d(E1). This record does not
# transfer a discrete logarithm and states no security level.
# =============================================================================
hypothesis:
  id: H-PAIR-d5da88
  question_id: RQ-PAIR-21313f
  source_idea_ids:
    - IDEA-20261006-bf2f6a
  added: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: >-
    Equal embedding degrees and a strictly smaller torsion field on
    the first shared odd prime factor
  statement: >-
    Let E0 be y^2 = x^3 + 1 and E1 be y^2 = x^3 + x + 1. Let p be
    the smallest prime with p > 30, p congruent to 1 mod 3, p < 256,
    both curves ordinary and nonsingular over F_p, and
    gcd(#E0(F_p), #E1(F_p)) divisible by an odd prime r that does
    not divide p - 1. Let k(E) be the multiplicative order of p
    modulo r. Let d(E) be the degree of the splitting field over
    F_p of the r-division polynomial of E. The prediction taken
    from IDEA-20261006-bf2f6a is k(E0) = k(E1) and d(E0) < d(E1).
    The concrete negative is that this p exists and d(E0) >= d(E1).
    If no such p exists below 256, the comparison is not scored.
    No discrete logarithm is transferred.
  mechanism: >-
    The tracked object is the pair of integers (k, d) for one prime
    r. k is the order of p modulo r, computed once for the shared r.
    d is the degree of the splitting field of the r-division
    polynomial. The same r is used for both curves. k equal and d
    strictly smaller on E0 means the j = 0 curve shows up in the
    torsion field and not in the embedding degree. d(E0) at least
    d(E1) is the negative observation. k(E0) unequal to k(E1) voids
    the comparison because the two curves were not using the same r.
  assumptions:
    - >-
      Both curves are nonsingular and ordinary at the chosen p, and
      r does not equal the characteristic.
    - >-
      k is the order of p modulo r, and d is the degree of the
      splitting field of the r-division polynomial over F_p.
    - >-
      The same r is used for both curves. A run that picks different
      prime factors is not the instance.
    - >-
      If no prime below 256 meets the gcd condition, the run is an
      empty search and is not a negative on d.
  proof_search_map:
    bottleneck: >-
      Whether the least eligible prime has k(E0) = k(E1) and
      d(E0) < d(E1).
    baseline_embedding:
      parameter_slice: >-
        One prime p < 256 and one odd prime r shared by the two
        group orders. No MOV transfer is reproduced.
      reproduction_check: >-
        Before scoring, the self-check d(E0) - d(E0) = 0 must hold,
        and if the full 2-torsion of E0 is already rational the same
        degree procedure at ell = 2 must return d = 1.
    observation_collision:
      observable: the four integers k(E0), k(E1), d(E0), d(E1)
      distinct_preimage_search: >-
        Many bases of E[r] share one degree. The degree is the
        object. Reporting a single kernel field instead of the
        splitting field of the full r-division polynomial voids
        the run.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The pair (k, d) on each curve, with k computed as the
          order of p modulo r and d the splitting-field degree.
        predicted_gain: >-
          Either d(E0) - d(E1) is at most -1 with k difference 0,
          or the instance exists and d(E0) >= d(E1).
    quantifier_order: >-
      There exists a least eligible prime p < 256 and one odd prime
      r, shared by both group orders and not dividing p - 1, such
      that k(E0) = k(E1) and d(E0) < d(E1).
    method_ceiling:
      strongest_certifiable_claim: >-
        Four integers at one prime below 256. Not a theorem that
        every j = 0 curve has a smaller division field, and not a
        discrete logarithm.
      nearby_object_control: >-
        The same degree procedure on E0 against itself must return
        difference 0. A nonzero self-difference voids the code.
    proof_obligations:
      - claim: >-
          Equal k and a smaller d do not yield a discrete logarithm
          and do not change the MOV field.
        responsibility: scope
      - claim: >-
          An empty search below 256 closes nothing about d.
        responsibility: scope
    not_applicable_reason: >-
      This is a four-integer comparison at one prime. It does not
      propose a theorem on division fields, a complexity bound, a
      pairing-transfer reduction, or a closure of CM torsion fields.
      The map audits that comparison only.
  rerandomization: >-
    No re-randomizing walk is used. The instance is the least
    eligible prime, not a random draw. Nothing pulls a discrete
    logarithm back to an input point.
  asymptotic_claim:
    problem: >-
      embedding degree and r-torsion field degree on one toy curve
      pair
    prior_best: >-
      generic discrete log in a prime-order group at exponent 1/2
      (KR-RHO-13bf67). Equal embedding degrees mean the MOV field
      has the same size on both curves. This hypothesis does not
      attack that group.
    time_exponent: '1/2, unchanged'
    memory_exponent: >-
      unchanged. The test stores one division polynomial of degree
      (r^2 - 1)/2 for an r that divides a group of size about p.
    hidden_cofactor: >-
      None in an exponent. The gap between this prime and a
      cryptographic pairing-friendly prime is not an o(1) term.
    claim_kind: constant_factor
    claim_kind_note: >-
      The constant factor against the generic exponent is 1.
      claim_kind is filled so the non-claim is explicit. Four
      integers are not a runtime.
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For an ordinary curve with complex multiplication by an
        order in Q(sqrt(-3)), the Galois image on E[r] is predicted
        to land in a Cartan subgroup, so d(E0) is strictly smaller
        than d(E1), while k remains the order of p modulo r on both
        curves. The non-CM curve E1 is the control predicted to
        realise the larger degree. The quantity sampled is the pair
        (d, k) at the single prime the search returns.
      random_model_justification: >-
        The Cartan description is recalled and is not a numerical
        distribution. The comparison is d(E0) against d(E1) and
        k(E0) against k(E1) at one prime. No tail probability is
        sampled. The ratio d/k is recorded on each curve and does
        not change the reading row.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PAIR-1c9947
      falsification_condition: >-
        The instance exists and d(E0) >= d(E1). That inequality is
        the negative observation. It does not refute a Cartan image
        on any larger set of primes.
  structural_ingredients:
    - description: >-
        MOV and Frey-Rück apply when the embedding degree is small,
        and they are curve checks rather than generic algorithms.
        Equal k means the same check. This record does not run it.
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
        on 2026-10-06
      role: scope of an embedding-degree check
    - description: >-
        Automorphisms of order m give a factor sqrt(m) in rho and
        do not change the exponent 1/2. A smaller division field is
        not that factor.
      citation: KR-RHO-0528e7
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
        on 2026-10-06
      role: fence around the sqrt(6) constant
    - description: >-
        Isogenous curves share the group order. This record compares
        two curves that share a prime factor r of the group order,
        not two isogenous curves.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
      role: fence around an isogeny-path reading
    - description: >-
        The Weil descent to F_2 of S_3 has first fall degree 2
        because the trace of x is a group morphism to F_2. This
        record builds no summation polynomial.
      citation: KR-IC-f5c584
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        on 2026-10-06
      role: fence around a descent reading
    - description: >-
        A generic algorithm on a prime-order group needs Omega of
        the square root of the group order. This comparison is not
        a generic discrete-logarithm algorithm.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
      role: unchanged generic exponent
    - description: >-
        For ordinary CM by an order in Q(sqrt(-3)), the Galois
        image on prime-to-p torsion is often described as landing
        in a Cartan subgroup. Not opened as a primary text.
      citation: >-
        Cartan image of the Galois representation on E[r] for
        ordinary j = 0
      provenance: recalled
      verified_by: null
      role: random-model pointer for HEUR-1, not support
  reduction_chain:
    core_problem: >-
      toy comparison of two embedding degrees and two torsion-field
      degrees at one prime
    corollaries: []
  predictions:
    - metric: d(E0) - d(E1)
      direction: lower
      minimum_effect: at most -1
    - metric: k(E0) - k(E1)
      direction: lower
      minimum_effect: exactly 0
  test_boundary:
    instances:
      - E0 y^2 = x^3 + 1
      - E1 y^2 = x^3 + x + 1
    parameters:
      prime_window: p from 31 through 255, p congruent to 1 mod 3
      selection: least eligible p
      r_rule: least odd prime factor of the gcd that does not divide p - 1
    implementation: >-
      Point-count both curves. Take the least eligible p and its
      least eligible r. Compute k as the order of p modulo r.
      Compute d as the degree of the splitting field of the
      r-division polynomial. No pairing is evaluated and no discrete
      logarithm is searched.
    budget:
      search: one pass over the primes below 256
      maximum_runs: 1
  falsification_conditions:
    - >-
      The instance exists and d(E0) >= d(E1). That inequality is the
      negative observation.
    - The instance exists and k(E0) != k(E1).
    - The self-check on E0 returns a nonzero degree difference.
  interpretation_limits:
    - >-
      d(E0) < d(E1) with equal k does not yield a discrete logarithm
      and does not change the field in which a MOV transfer would land.
    - >-
      The result is one prime p < 256. It does not say that every
      j = 0 curve has a smaller division field.
    - >-
      The rho exponent stays 1/2. The automorphism factor sqrt(6)
      on j = 0 is a different constant and is not measured here.
    - >-
      An empty search is not a negative on d.
