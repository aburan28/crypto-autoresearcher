  title: >
    On one frozen three-chart atlas family, a cycle
    obstruction is zero on a composite-group coset
    atlas, nonzero on a pairwise-consistent plant,
    and recorded (not gated) on a matched-size null
  status: specified
  proposed_by: idea-generator
  designed_by: coordinator
  designed_under_task: TASK-20260908-b97365
  specified_by: DEC-20260908-9e18aa
  specified_at: '2026-09-08'
