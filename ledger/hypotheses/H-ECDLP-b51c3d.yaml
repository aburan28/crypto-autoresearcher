  statement: >
    Fix one composite group Z/15 and one prime-order
    group Z/11. Stage 0 asserts only the instrument
    prediction of IDEA-20260905-970b2f on one frozen
    family: (i) the frozen 5-coset feature on Z/15
    intertwines +1 exactly and has cycle obstruction
    0; (ii) the frozen three-chart plant on Z/11 is
    pairwise satisfiable and globally unsatisfiable,
    so a global certificate is refused; (iii) the
    matched-size null on the same Z/11 charts has a
    recorded obstruction that is not a rigidity
    gate; (iv) an empty or two-chart object is
    rejected before any obstruction is read as a
    fiber. A later unauthorized stage may price
    overlap width. Neither reading is a decoder or
    an ECDLP advantage.
  mechanism: >
    Local charts retain a small feature. Overlaps
    carry pairwise constraints. Pairwise agreement
    need not imply a global section; a cycle can
    carry odd holonomy. Stage 0 evaluates that
    distinction on one frozen coset atlas, one
    frozen cycle plant, and one frozen same-shape
    null. This is a new RQ-ECDLP-002 object after
    Stage 0 of EXP-ECDLP-90f602 held as
    P-S0-TRIPLECORR (DEC-20260908-6f9ac8). It is
    not Stage 1 of EXP-ECDLP-90f602 and not Stage 2
    of EXP-ECDLP-4be480. IDEA-20260905-7720ef is
    the superseded predecessor of 970b2f and is not
    designed as a second object.
  predictions:
    - id: P-S0-GLUE
      metric: well-defined atlas, obstruction, and refuse-on-plant
      direction: different
      minimum_effect: >
        After fixture_pass, COS15 has obstruction 0
        and exact +1 intertwining. PLANT11 is pairwise
        SAT and globally UNSAT and is refused. Empty
        and two-chart objects are rejected. One
        certified miss after fixture_pass is a scoped
        falsification of this instrument on the
        frozen family.
      claim_tier: observational
    - id: P-S1-WIDTH
      metric: priced overlap-width certificate
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0 does not
        search a cheaper atlas and does not claim a
        compact global section.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-COSETLEAK
      statement: >
        After fixture_pass, COS15 fails exact +1
        intertwining or has nonzero obstruction. If
        the mismatch is an encoding bug, classify
        failed_infrastructure.
    - id: F-S0-PLANTACCEPT
      statement: >
        After fixture_pass, PLANT11 is accepted as a
        global certificate. That falsifies only
        P-S0-GLUE on this family.
    - id: F-S1-FULLTABLE
      statement: >
        After an authorized later stage, a claimed
        compact atlas retains the complete state
        table. Unauthorized here.
  test_boundary:
    instances:
      - frozen Stage 0 COS15 / PLANT11 / NULL11 panel
    parameters:
      n15: 15
      n11: 11
      n_charts: 3
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-9e9536 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is a gluing-obstruction
      instrument on one composite group and one
      prime-order group. It is not a decoder, not
      Stage 1 of EXP-ECDLP-90f602, not Stage 2 of
      EXP-ECDLP-4be480, not Stage 2 of
      EXP-ECDLP-6a97f4, and not Stage 17 of
      EXP-ECDLP-420e73. No cryptographic transfer.
      Do not hunt a new atlas after this freeze.
  assumptions:
    - id: A1
      statement: >
        A genuine coset feature of a composite group
        intertwines translation. An argument that
        assigns COS15 a nonzero obstruction proves
        too much.
      status: explicit
    - id: A2
      statement: >
        Pairwise SAT plus odd cycle holonomy is
        globally UNSAT. An argument that accepts
        PLANT11 as a global section proves too much.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06 covers
        protocol approval once the contract is complete.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Compact, complete certification of a local
      feature atlas with a global compatibility
      complex. Stage 0 only checks that obstruction
      and refuse are well-defined on the frozen
      family.
    baseline_embedding:
      parameter_slice: >
        The COS15, PLANT11, and NULL11 fixtures.
      reproduction_check: >
        Exact +1 intertwining and obstruction 0 on
        COS15. Pairwise SAT and global refuse on
        PLANT11.
    observation_collision:
      observable: >
        Cycle obstruction and pairwise SAT/UNSAT.
      distinct_preimage_search: >
        Hold chart sizes fixed and vary the constraint
        parity. Hold the coset feature fixed and
        vary the group.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: Frozen three-chart compatibility complex.
        predicted_gain: >
          Exact coset-zero / plant-refuse on the
          frozen family. Zero claimed solver
          improvement.
    quantifier_order: >
      Freeze the groups, charts, and constraints
      before reading obstruction. Existential refuse
      on this plant does not imply a priced width
      bound and does not imply a decoder.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the declared
        finite family. Never a scalar extraction
        result. Never an ECDLP exponent.
      nearby_object_control: >
        COS15 is the known-false object for a
        "prime-order groups admit no exact quotient"
        reading. An argument that still assigns it
        a nonzero obstruction is wrong.
    proof_obligations:
      - claim: well-defined obstruction under the declared charts
        responsibility: correctness
      - claim: exact COS15 intertwining and zero obstruction
        responsibility: baseline
      - claim: PLANT11 pairwise SAT and global refuse
        responsibility: baseline
      - claim: no decoder, no Stage 1 of 90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
  novelty_status: unverified
  novelty_claim: >
    Gluing-obstruction instrument on one frozen
