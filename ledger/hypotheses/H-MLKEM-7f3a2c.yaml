hypothesis:
  id: H-MLKEM-7f3a2c
  question_id: RQ-MLKEM-001

  statement: >-
    CONDITIONAL REACH CLAIM ONLY. GRANTING KN-OPEN-8a5965's Q1 (Simon 2026,
    KN-LIT-e204ab, is correct) WITHOUT ADJUDICATING IT -- Q1 is explicitly OUT
    OF SCOPE for this record -- does the published reduction chain
    DCP -> Regev 2004 (KN-LIT-21383c) -> BKSW (KN-LIT-4706) -> IP-M-EDCP
    (KN-LIT-1744) actually reach rank-k Module-LWE at FIPS 203's deployed
    ML-KEM-512/768/1024 parameters (k=2,3,4; n=256; q=3329), and under which of
    the two normalisation conventions for alpha (alpha as a noise-to-modulus
    RATIO in (0,1), vs. alpha as an ABSOLUTE noise magnitude ~ sqrt(n)
    polylog(n) as literally stated in the claim)? The hypothesis is a REACH
    MAP, not a verdict on the preprint: for each of the two conventions,
    independently, and for each of k in {2,3,4}, state whether the composed
    chain's delivered LWE regime is a superset of (contains, in dimension,
    modulus, and noise-ratio terms) FIPS 203's actual instantiation at that k,
    with every parameter transformation traced to a specific theorem/page in
    KN-LIT-21383c, KN-LIT-4706, or KN-LIT-1744.

    THE HYPOTHESIS IS THREEFOLD, mirroring the idea's own null-object controls,
    which are carried forward here as load-bearing test-boundary content, not
    as optional extras:

    (A) BOTH-CONVENTIONS SWEEP. The reach verdict is computed independently
    under BOTH normalisation conventions for alpha at every tested k. If the
    two conventions agree on reach/no-reach at every k, the verdict is robust
    and may be quoted without further qualification (still scoped to this
    chain and this claim). If they disagree at any k, the DISAGREEMENT ITSELF
    is the finding -- KN-OPEN-8a5965's flagged parsing ambiguity is
    load-bearing -- and no single reach verdict may be quoted without naming
    its convention.

    (B) THE k=1 DEGENERACY GATE. At rank k=1 the module structure IP-M-EDCP
    depends on must collapse identically to plain unstructured LWE (the object
    KN-LIT-4706's eDCP equivalence addresses directly, with no ring degree
    contribution beyond the base EDCP extrapolation). Any parameter-mapping
    procedure that, substituted at k=1, fails to reproduce the unstructured
    LWE regime exactly is WRONG BY CONSTRUCTION and invalidates every k in
    {2,3,4} computed by the same procedure -- this is a forced check run
    before any k>=2 number is trusted, not a courtesy check run after.

    (C) SOURCE-BLOCKED DISCIPLINE. Any parameter transformation in the chain
    that cannot be traced to a specific theorem/page in KN-LIT-21383c,
    KN-LIT-4706, or KN-LIT-1744 is marked SOURCE-BLOCKED explicitly in the
    reach-map output. A SOURCE-BLOCKED entry is never filled in from a
    secondary summary (including KN-OPEN-8a5965's own paraphrase, KN-TECH-d1bc4f,
    or this hypothesis's own prose above) and never silently dropped from the
    table.

    THE DELIVERABLE ON THE PREDICTED OUTCOME IS A REACH-MAP TABLE (convention x
    k -> Q, alpha, reach verdict) WITH CITATIONS, NOT A CLOSURE OF KN-OPEN-8a5965
    AND NOT A STATEMENT ABOUT WHETHER SIMON'S PROOF IS CORRECT.

  mechanism: >-
    Pin down, from Regev 2004 (KN-LIT-21383c), BKSW (KN-LIT-4706), and
    IP-M-EDCP (KN-LIT-1744) DIRECTLY -- never from KN-OPEN-8a5965's or
    KN-TECH-d1bc4f's paraphrase, which are pointers only -- the parameter
    transformation each reduction link applies, then compose the chain and
    substitute FIPS 203's own published (k, n, q) triples for ML-KEM-512/768/
    1024. Concretely:

    STEP 1 (DCP -> uniqueSVP/LWE, unstructured). Read KN-LIT-21383c's exact
    statement of the DCP-to-lattice reduction: the group size N (as a function
    of the lattice dimension n), the faulty-sample rate 1/a(n) the reduction
    consumes, and the resulting SVP approximation factor a(n) it delivers.
    Apply BKSW's (KN-LIT-4706) removal of the quadratic dimension blow-up
    (N ~ 2^{n^2} in Regev's original, corrected in BKSW) to get the dimension
    relation actually usable at concrete n. Record Simon's claimed noise
    tolerance 1/O(log n) (KN-TECH-d1bc4f's table; verify the number against
    KN-LIT-e204ab directly, not the technique note, before use) and substitute
    it into the a(n) formula to get the delivered SVP approximation factor,
    UNDER EACH OF THE TWO CONVENTIONS FOR HOW alpha RELATES TO a(n): (i) as a
    ratio in (0,1) -- the standard LWE convention -- and (ii) as the literal
    "sqrt(n) polylog(n)" absolute magnitude as KN-OPEN-8a5965 quotes the claim.

    STEP 2 (unstructured LWE -> Module-LWE via IP-M-EDCP). Read KN-LIT-1744's
    exact statement of the MLWE <-> IP-M-EDCP equivalence: does it require
    power-of-two cyclotomic rings (FIPS 203 uses n=256=2^8, a power of two --
    check this explicitly rather than assuming compatibility), constant module
    rank (k=2,3,4 are all small constants -- check the paper's stated range of
    "constant" is met), and how the extrapolation degree depends on the ring
    degree n in addition to the noise rate (KN-LIT-1744's own stated
    dependency). Substitute FIPS 203's n=256 and each of k in {2,3,4} into
    IP-M-EDCP's own formula for the resulting state-superposition size /
    query count, tracing the c>=12 exponent KN-OPEN-8a5965 flags (Q = k*n^{c+1})
    back to its source in the chain -- this record must determine whether that
    exponent lives in KN-LIT-21383c, KN-LIT-4706, or KN-LIT-1744, and cite the
    exact theorem/page.

    STEP 3 (compose and compare against FIPS 203). For each convention and
    each k in {2,3,4}, state: the composed (dimension, modulus, noise-ratio)
    triple the chain delivers; FIPS 203's actual triple at that k
    (n=256, q=3329, and the actual eta/noise distribution parameter --
    cited to FIPS 203 itself); and a reach/no-reach verdict, defined as
    "the delivered regime's noise tolerance and dimension cover FIPS 203's
    instantiation" vs. "it does not."

    STEP 4 (k=1 gate). Repeat step 2-3 at k=1 and confirm the IP-M-EDCP
    formula degenerates to KN-LIT-4706's plain eDCP-LWE equivalence with no
    residual ring-degree term beyond what unstructured LWE already carries.
    A discrepancy here invalidates steps 2-3's parameter map at every k and
    is reported as a STOP, not smoothed over.

  assumptions:
  - >-
    Q1 IS GRANTED, NOT ADJUDICATED. This hypothesis assumes, for the sole
    purpose of computing a reach map, that Simon 2026's claimed noise tolerance
    1/O(log n) and delivered SVP factor sqrt(n) polylog(n) are as stated in
    KN-LIT-e204ab. If Q1 is later refuted, this record's reach map still holds
    as a conditional statement ("IF the claim's stated parameters are correct,
    THEN the chain reaches/does not reach X") and is not thereby invalidated --
    but its practical relevance would be. This distinction is recorded here so
    a later reader does not confuse "hypothesis withdrawn" with "premise later
    falsified."
  - >-
    THE THREE SOURCES ARE RETRIEVABLE AND READABLE IN FULL by the executor.
    KN-LIT-21383c, KN-LIT-4706, and KN-LIT-1744's knowledge-corpus entries are
    currently marked "Not verified here" / relayed from abstracts or secondary
    parsing (KN-LIT-4706 and KN-LIT-1744 both note "generated during the
    2026-07-24 bulk seeding pass... claims are relayed from the paper's
    abstract without independent verification") -- despite KN-LIT-4706's own
    frontmatter setting `citation_verified: read`, which contradicts its body
    text; this contradiction is itself an instance of the pattern
    KN-OPEN-3f7a21 records across 7457 corpus entries and is noted here rather
    than silently trusted either way. This experiment REQUIRES reading the
    primary sources directly.
    CORRECTED PATH (the design pass for this record found the path below
    stated as `downloads/...` in earlier drafts; that directory does not
    exist anywhere in this repository -- confirmed via
    `git ls-tree -r --name-only HEAD | grep -c '^downloads/'` = 0 -- which is
    exactly KN-OPEN-3f7a21's finding applied to this record's own draft. The
    files themselves are real and were located at, and MUST be read from:
    /Volumes/SSD990/research/10770194.pdf (KN-LIT-4706, confirmed valid PDF,
    463170 bytes) and /Volumes/SSD990/research/2026-155.pdf (KN-LIT-1744,
    confirmed valid PDF, 1229350 bytes) -- both OUTSIDE this repository, in
    the parent research directory, not under any `downloads/` path. KN-LIT-
    21383c (Regev 2004) is reachable via its DOI/arXiv cs/0304005 and needs no
    local file. The executor must verify these two local paths still resolve
    before relying on them, and report immediately (as a STOP, per the
    experiment contract) if either has moved or is not the paper it claims to
    be -- do not assume the path is stable without a fresh check at execution
    time.
  - >-
    FIPS 203's own published (k, n, q) values for ML-KEM-512/768/1024 are
    taken as ground truth and must be cited to the standard itself (FIPS 203,
    NIST, August 2023, Table 1 or equivalent), not inferred from a secondary
    description.

  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is not a theorem, asymptotic bound, certificate family,
      reduction, or closure argument of this program's own authorship -- it is
      a literature-arithmetic REACH computation over already-published
      reductions (KN-TECH-080's proof_search_map governs proof-oriented
      proposals; this is a parameter-substitution audit of an external claim
      chain, class cost-model, and produces no new mathematics). The four
      audits (baseline reproduction, observation-collision, quantifier order,
      method ceiling) do not apply to a table lookup and composition
      exercise; the equivalent discipline here is SOURCE-BLOCKED marking
      (item C above) and the k=1 degeneracy gate (item B above), which serve
      the same falsification-before-belief purpose as the proof_search_map's
      audits and are stated as explicit test-boundary controls instead.

  heuristic_assumptions:
  - id: HEUR-DCP-1
    formal_statement: >-
      The published reduction chain composes without hidden conditions at the
      ranks and modulus of FIPS 203.
    random_model_justification: >-
      Not applicable -- this is not a distributional claim about a random
      object; it is a claim that no reduction link's stated hypotheses
      (ring form, rank bound, noise-rate regime, dimension regime) are
      violated when FIPS 203's concrete numbers are substituted. No random
      model is invoked or needed.
    supporting_results: []
    validation_experiment_ids: [EXP-MLKEM-9d41b6]
    validation_plan: >-
      List each link's stated conditions explicitly (from KN-LIT-21383c,
      KN-LIT-4706, KN-LIT-1744 directly) and mark any that FIPS 203's
      (k=2,3,4; n=256; q=3329) parameters violate. A violated condition does
      not by itself refute the chain's mathematics -- it means the composed
      reach map is invalid at that k until the violated step is re-derived
      under the concrete regime, and the reach map reports it as
      CONDITION-VIOLATED rather than silently applying the formula anyway.
    falsification_condition: >-
      Any single stated condition in any of the three sources, substituted
      with FIPS 203's concrete (k, n, q), is violated. This does not
      falsify HEUR-DCP-1's role as a working assumption for THIS record
      (it is falsifiable by construction and IS being tested), but a
      violation means the "reaches" half of the reach map cannot be asserted
      at the affected k without further derivation, and must be reported as
      CONDITION-VIOLATED, not smoothed into a reach verdict.

  structural_ingredients:
  - description: >-
      The DCP-to-uniqueSVP quantum reduction and the noise-free DSP
      quantum algorithm conditional on a modular subset-sum oracle.
    citation: >-
      Regev, "Quantum Computation and Lattice Problems," SIAM J. Comput.
      33(3):738-760, 2004 (KN-LIT-21383c; DOI 10.1137/S0097539703440678,
      arXiv cs/0304005). READ IN FULL, primary source, not the corpus
      summary, which is itself flagged "Paper not read... relayed from
      Simon 2026's description."
    role: >-
      supplies the base DCP -> lattice-problem parameter relation (dimension,
      faulty-sample rate, SVP approximation factor) that the rest of the
      chain composes with
  - description: >-
      Removal of the quadratic dimension blow-up in Regev's DCP group size,
      and the LWE <-> extrapolated DCP (eDCP) equivalence under quantum
      polynomial-time reductions.
    citation: >-
      Brakerski, Kirshanova, Stehlé, Wen, "Learning With Errors and
      Extrapolated Dihedral Cosets" (KN-LIT-4706; local copy
      /Volumes/SSD990/research/10770194.pdf, OUTSIDE this repository --
      NOT under downloads/, which does not exist here; see the
      corrected-path note under `assumptions` above). READ IN FULL, primary
      source.
    role: >-
      supplies the concrete-dimension DCP group size and the LWE-eDCP
      equivalence used as the k=1 degeneracy target
  - description: >-
      Module-LWE <-> Integer Polynomial Module EDCP (IP-M-EDCP) equivalence,
      for power-of-two cyclotomic rings and constant module rank, with
      extrapolation depending on both noise rate and ring degree.
    citation: >-
      "Module Learning With Errors and Structured Extrapolated Dihedral
      Cosets," IACR ePrint 2026/155 (KN-LIT-1744; local copy
      /Volumes/SSD990/research/2026-155.pdf, OUTSIDE this repository --
      NOT under downloads/, which does not exist here; see the
      corrected-path note under `assumptions` above). READ IN FULL, primary
      source.
    role: >-
      supplies the module-structure bridge from unstructured to Module-LWE,
      the step KN-OPEN-8a5965 flags as "unaddressed"
  - description: >-
      Simon 2026's claimed noise tolerance (1/O(log n)) and resulting SVP
      approximation factor (sqrt(n) polylog(n)), and the flagged
      Q = k*n^{c+1}, c>=12 sample-count example.
    citation: >-
      KN-LIT-e204ab (ePrint 2026/1591, frozen as SRC-DCP-SIMON-2026), via
      KN-OPEN-8a5965's summary and KN-TECH-d1bc4f's table -- GRANTED, NOT
      ADJUDICATED, per the assumptions above. Q1 correctness is explicitly
      out of scope.
    role: >-
      supplies the input noise-tolerance parameter substituted into steps 1-2
      above; this is the one ingredient this record treats conditionally
      rather than reading as settled mathematics

  reduction_chain:
    core_problem: >-
      DCP with faulty-sample rate 1/a(n), granted polynomial-time solvable
      under Simon 2026's claim (Q1, not adjudicated here).
    corollaries:
    - problem: >-
        a(n)-approximate uniqueSVP / unstructured LWE at the dimension n and
        noise regime the composed chain delivers.
      reduction_ref: >-
        Regev 2004 (KN-LIT-21383c) as corrected by BKSW (KN-LIT-4706).
      asymptotics_preserved: >-
        Conditional on HEUR-DCP-1 and on Q1; to be determined by this
        experiment whether the composed regime is polynomial-in-practice or
        merely polynomial-in-the-exponent (the Q = k*n^{c+1}, c>=12 concern).
    - problem: >-
        rank-k Module-LWE at FIPS 203's concrete (k, n, q) for
        ML-KEM-512/768/1024.
      reduction_ref: >-
        IP-M-EDCP bridge, KN-LIT-1744.
      asymptotics_preserved: >-
        UNKNOWN -- this is exactly what this hypothesis's reach map
        determines, not an input to it.

  predictions:
  - metric: reach verdict at (k, q) = (2, 3329), (3, 3329), (4, 3329), each under both alpha conventions
    direction: different
    minimum_effect: >-
      A stated reaches/does-not-reach per rank per convention, each cited to a
      specific theorem/page. Currently there is no statement at all
      (KN-OPEN-8a5965's Q2 is open and unaddressed by any ledger record).
  - metric: k=1 degeneracy gate outcome (reproduces plain LWE exactly, yes/no)
    direction: different
    minimum_effect: >-
      MUST BE YES for the k>=2 numbers to be trusted; a NO invalidates the
      rest of the computation and is reported as a stop, not smoothed over.
  - metric: reproduction of the flagged Q = k*n^{c+1}, c>=12 example from primary sources
    direction: different
    minimum_effect: >-
      Either exact reproduction with a cited derivation, or an explicit
      reported discrepancy (value, sign, and source of the disagreement) --
      never a silent drop of the number.

  test_boundary:
    instances:
    - >-
      ML-KEM-512 (k=2), ML-KEM-768 (k=3), ML-KEM-1024 (k=4), all with n=256,
      q=3329, per FIPS 203's own published parameter table.
    - >-
      k=1 as the forced degeneracy-gate instance (not a deployed ML-KEM
      parameter set; a validity check on the parameter-mapping procedure
      itself).
    - >-
      OUT OF SCOPE, named rather than left implicit: Q1 (whether Simon 2026's
      proof is correct); any statement about ML-DSA's distinct parameter sets
      beyond noting they share the same MLWE hardness assumption per
      KN-OPEN-8a5965's "Why it matters"; any concrete classical or quantum
      attack cost table (that is a separate, unconditional line of work);
      any security-level (bits of security) claim.
    parameters:
      ranks_tested: [1, 2, 3, 4]
      ml_kem_variants: [ML-KEM-512, ML-KEM-768, ML-KEM-1024]
      ring_degree_n: 256
      modulus_q: 3329
      alpha_conventions: [ratio_in_0_1, absolute_sqrt_n_polylog_n]
    implementation: >-
      Literature arithmetic and citation tracing only; no code, no numerical
      simulation, no lattice computation of any kind. Executed by reading the
      three primary sources plus FIPS 203 and producing the reach-map table
      and citation ledger specified in the experiment contract.
    budget:
      wall_clock_seconds: not_applicable -- see experiment contract; this is a
        reading and composition task, not a timed computational run

  falsification_conditions:
  - >-
    F1 -- the chain provably CANNOT touch rank-k MLWE at FIPS 203's deployed q
    under EITHER convention, at any tested k: a durable negative that retires
    Q2 for this program's active goals regardless of whether Simon's proof
    (Q1) is ever settled.
  - >-
    F2 -- the chain CAN touch rank-k MLWE at deployed parameters (under either
    or both conventions): a major finding, and if reached, every one of
    GOAL-MLKEM-001..005 and GOAL-MLDSA-001..002's threat models changes and
    this becomes the program's highest-priority open item.
  - >-
    F3 -- the two conventions give OPPOSITE reach verdicts at any tested k:
    the finding becomes the parsing ambiguity KN-OPEN-8a5965 flags, not a
    reach verdict, and resolving which convention Simon 2026 actually intends
    becomes the next question, routed back to Q1's proof-reading track.

  interpretation_limits:
  - >-
    THIS PRICES A REACH, NOT AN ATTACK. A "reaches" verdict states only that
    the chain's delivered parameter regime is a superset of FIPS 203's
    instantiation in the tested dimensions; it is not a distinguisher, not a
    key-recovery method, and not a runtime or cost estimate against ML-KEM or
    ML-DSA.
  - >-
    CONDITIONAL ON A CLAIM THIS RECORD DOES NOT ADJUDICATE. Every reach
    verdict here is of the form "IF Simon 2026's stated parameters (noise
    tolerance 1/O(log n), delivered factor sqrt(n) polylog(n)) are correct,
    THEN the composed chain reaches/does not reach X." Q1 -- whether Simon's
    proof is actually correct -- is untouched by this hypothesis and remains
    KN-OPEN-8a5965's open question. Nothing here should be read, cited, or
    summarized as bearing on Q1.
  - >-
    A REACH VERDICT IS NOT A SECURITY ESTIMATE. Even a "reaches" verdict under
    both conventions says nothing about concrete bit-security, attack runtime,
    or near-term risk -- see the Q = k*n^{c+1}, c>=12 hidden-overhead concern,
    which this record must report explicitly rather than let a bare
    "polynomial time" headline absorb it.
  - >-
    SCOPED TO THIS CHAIN ONLY. A "does not reach" verdict closes only the
    tested reduction chain (Regev -> BKSW -> IP-M-EDCP) at the tested
    parameters; it says nothing about whether some other quantum route to
    MLWE exists, and no other reduction chain is examined by this record.

