  heuristic_assumptions:
    - id: HEUR-cf8ca6-H1
      source_label: restated from HEUR-0cc7e8-H1 (IDEA-20260928-ce3ab0 H1) per R3
      formal_statement: >-
        FIRST MOMENT: for the mitm engine on prime-order E/F_p with an
        x-defined base, the expected number of x-key coincidences among
        computed encodings is X'(X'-1)/N times the engine's deterministic
        ordering constant, matching the round's replica measurement (SS pair
        first moment 1.005-1.051 of C(X',2)*2/N on the exactly generic
        replica, 12..24 bits; EV-PFDR-d90ccd). COMPOUND LAW: the coincidences
        within one relation and across one engine's bundles are NOT
        independent; the pair count r_frozen is compound and overdispersed
        (measured jump-law dispersion 2.2-18.6, red team HC-1, quoted from
        its report), so its law is stated as a first moment plus a measured
        multiplicity (r_frozen/r_rank), never as a Poisson shape. The
        Poisson-shape clause of HEUR-0cc7e8-H1 is dropped (refuted for pair
        counts at the tested scale, EV-PFDR-1faf10 INF-4).
      random_model_justification: >-
        Rigorous support carried: in the GGM, distinct adaptive linear forms
        in independent uniform logs collide with probability <= 1/N per pair
        (Schwartz-Zippel on degree 1), doubled by the x-key; the first moment
        follows by non-adaptive linearity of expectation (DN-575e80-F6 D1).
        The compound law is measured, not derived: its random model is the
        bundle dependence of pairs within one relation.
      supporting_results: [EV-PFDR-1faf10 INF-4, EV-PFDR-d90ccd replica first-moment result]
      validation_experiment_ids: [EXP-PFDR-7c8bf2, EXP-PFDR-1b78f7]
      validation_note: >-
        Carried: EXP-PFDR-1b78f7 validates the first moment cleanly on its
        random-base arms, per class, at a fixed attempt budget (TT|3 and TT|5
        and SS|3-5 within 2%; TB|3 and TT|4 9-20% low, EV-PFDR-1faf10 INF-4;
        replica SS first moment 1.005-1.051, EV-PFDR-d90ccd). The compound law
        is validated by the measured multiplicities, reported per convention
        (C-3 of AMD-20261002-2bc8cf).
      falsification_condition: >-
        The SS pair first moment on an exactly generic replica at matched
        (N, B, attempt budget) departs from C(X',2)*2/N by more than the
        replica's calibrated interval; or the measured multiplicity
        r_frozen/r_rank departs from the compound law's stated form on
        premise-holding arms beyond calibrated error.
    - id: HEUR-cf8ca6-H2
      source_label: carried unchanged from HEUR-0cc7e8-H2 (IDEA-20260928-ce3ab0 H2)
      formal_statement: 'Carried verbatim: The relation count needed to fix k is r = c_m*|F|*(1+o(1)), with c_m stable across 20..32 bits at each m.'
      random_model_justification: 'Carried verbatim: Counting bound: r >= rank needed. Imitated: the random sparse-matrix rank heuristic (812554 HA-1; f89eaf H1).'
      supporting_results: [EV-PFDR-cf6ee5 OBS-9]
      validation_experiment_ids: [EXP-PFDR-7c8bf2]
      validation_note: >-
        Held at the tested scale (EV-PFDR-cf6ee5 OBS-9: all eight r/|F|
        slopes over 20..32 in [-0.007, -0.001]; EV-PFDR-d90ccd OBS-8: at
        m = 4 small_x harvest-on, r_rank/|F| slope +0.0030 [+0.0001,
        +0.0061] over 12..32; the r_frozen version rises at +0.041, but that
        is a pair count, not H2's object).
      falsification_condition: >-
        Carried verbatim: a slope in log N of r/|F| outside +-0.03 on
        20..32 bits at any m refutes H2 at the tested scale.
    - id: HEUR-cf8ca6-H3
      source_label: NEW per R2 (DEC-20261001-3fbaff refinement_content; DEC-20261001-494663 NA-4 commissions its derivation note)
      formal_statement: >-
        For the mitm engine (ADAPTIVE: truncates at the first hit, stops at a
        data-dependent time), the expected number of colliding compared pairs
        after S units is at most (2S)^2/N (1 + o(1)), so the aggregate T of
        clause (i) is at least 1 in expectation, and empirically T >= 1
        beyond its calibrated interval on premise-holding arms.
      random_model_justification: >-
        Rigorous support: for NON-ADAPTIVE engines the bound is linearity of
        expectation over pairs (DN-575e80-F6 D1, derivation tier). The
        ADAPTIVE step (truncation at the first hit; a data-dependent stop) is
        OPEN: DN D2 shows Markov's t^2 tail survives a stopping time only for
        the STOPPING count, and D5 shows no per-instance bound exists for
        r_frozen; whether the expectation form itself survives adaptivity is
        DN D3, NOT derived by the source record (IDEA-20260928-ce3ab0) or by
        the round. Numerical support only, on this engine: aggregate T >= 1
        on every premise-holding cell (lowest calibrated 99% lower end
        1.373); per-rung r_frozen lower ends >= 1.070 at m = 4; replica T >=
        1.30 at every rung over 12..24 bits (EV-PFDR-d90ccd OBS-5,
        cross_joint_reading).
      supporting_results: [EV-PFDR-d90ccd OBS-5, EV-PFDR-d90ccd cross_joint_reading]
      validation_experiment_ids: [DEC-20261001-494663 NA-3 (the F7/D3 follow-up, commissioned)]
      validation_note: >-
        The validation route is the F7/D3 follow-up of DEC-20261001-494663
        NA-3: (a) the zero-run analysis of the archived PTM-5 outputs for the
        r_rank ratio slope and per-rung T at m = 4, 5, with MC-5 calibration,
        testing whether the exactly generic replica reproduces F7's slope and
        the identity's decomposition; (b) an exactly generic replica beyond
        24 bits sized by a pre-registered power rule for T at 26..32 bits
        and beyond; (c) only if (a)-(b) leave it open, harvest-on m = 4 rows
        above 32 bits with certified solves. The derivation note
        (DEC-20261001-494663 NA-4) independently derives the form or
        produces a counterexample, and checks DN-575e80-F6 D0-D7.
      falsification_condition: >-
        Aggregate T below 1 beyond its calibrated interval on premise-holding
        arms at any tested N (decision rule fixed before data,
        DEC-20261001-494663 NA-3: such a result routes to TW-BREAK-style
        review-breakthrough with replication; T flattening at >= 1 supports
        the attainability framing).

