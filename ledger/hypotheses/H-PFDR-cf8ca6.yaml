  statement: >-
    On the crypto_autoresearcher.index_calculus mitm engine, prime-order
    ordinary curves E/F_p with log2 p in 12..32, default |F| per arity, with
    the per-arm premise audit applied first (formal_basis_kind,
    formal_basis_rank and formal rows fed per arm; known_log and j0-type
    automorphism bases are positive controls, never test rows), the floor
    reading is: (i) on premise-holding arms, per (panel, m, mode, arm class)
    cell, the aggregate ratio of sums T = (sum_i w_i S_{3,i}^2) / (sum_i w_i
    r_i N_i / 4), with deterministic weights w_i = 1/(N_i B_i), both r
    conventions reported (r_frozen, the lemma's step-ii pair count, and
    r_rank, its step-iii independent-relation count), is at least 1.0, with a
    violation being T below 1 beyond its calibrated 99% curve-bootstrap
    interval (five curves per rung, at least 20000 replicates; the round's
    calibration showed coverage 0.946-0.984 at nominal 99%, so the 99%
    interval is the calibrated one), and no per-instance predicate is adopted
    except against a null calibrated on an exactly generic engine at the
    instance's own count structure; (ii) flat in N at odd m = 3, 5, 7
    (fitted log2-slope within [-0.03, +0.03]); (iii) rising as N^{1/(2m)} at
    even m = 4, 6 (slope 0.125 +- 0.03 and 0.083 +- 0.03); with (iv)
    overlapping bootstrap intervals for the random, small_x and subgroup bases
    at m = 3 on matched |F|. That is: the measured odd-m mitm exponents
    (m+1)/(2m) are the generic x-key collision floor for r relations, the
    even-m engine sits a factor N^{1/(2m)} above it, and the floor binds
    through the aggregate the lemma bounds, not through any per-instance
    ratio. Test boundary: the committed harvest-off sweep rows
    (results/sweep-minfill-20260926, sweep-arity-minfill-20260926,
    sweep-arity67-20260928, with the min_index twins as consistency check),
    and, read explicitly under this record's own premise-audit discipline,
    the committed harvest-on rows of EXP-PFDR-1b78f7 (R4: no reading of this
    record depends on an implicit transfer).

  mechanism: >-
    Carried unchanged from H-PFDR-0cc7e8 (verbatim): G has prime order N; P,
    Q and the base elements F_1..F_B are independent encodings with uniform
    unknown logs (the base is sampled by an x-predicate, not generated from P
    and Q). Each pair of distinct computed linear forms collides under the
    x-key (equal or negated) with probability <= 2/N, so X computed encodings
    give at most X^2/N expected collisions. Each independent relation needs
    its own collision. One S_3 unit yields two encodings (README section "How
    cost is counted": F+S and F-S from one inversion). Therefore E[r] <= 4
    S^2 / N, i.e. S >= (1/2)*sqrt(r*N). With r ~ c_m*|F| and |F| = N^beta the
    floor is N^{((1+beta)/2)}; at beta = 1/m it is (m+1)/(2m), which equals
    the README model max(h, m-h+1)/m exactly at odd m and sits N^{1/(2m)}
    below it at even m. The engine uses S_3 only to add two points, so every
    relation it finds is an x-key collision between two encodings it
    computed. Refinement note (R2): the expectation step for an ADAPTIVE
    engine that truncates at the first hit and stops at a data-dependent time
    is NOT derived by this mechanism as written; it is carried as the
    explicit numbered heuristic HEUR-cf8ca6-H3 below, with its derivation-note
    commission (DEC-20261001-494663 NA-4) and validation route
    (DEC-20261001-494663 NA-3) open. The non-adaptive linearity step is
    DN-575e80-F6 D1 (derivation tier, one reviewer, Coordinator-checked on
    two steps).

