  proof_search_map:
    bottleneck: >-
      Carried: relations obtained per computed encoding (the collision rate),
      not the S_3 solve itself. Refined: the decision-bearing observable is the
      AGGREGATE ratio of sums T (DN-575e80-F6 D6), not any per-instance ratio.
    baseline_embedding:
      parameter_slice: >-
        Carried verbatim: r = 1 gives S >= (1/2)*sqrt(N), Pollard rho's
        birthday floor (KR-RHO-13bf67, x-key, negation folded); m odd with
        beta = 1/m reproduces the README model's exponent exactly; in the
        preprocessing model, S = N^{1/m} with T = N^{((h-1)/m)} is the
        Bernstein-Lange point (KR-RHO-ea34b8) that dominates mitm at the same
        T.
      reproduction_check: >-
        Carried: symbolic, (m+1)/(2m) = max(h, m-h+1)/m at h = (m+1)/2 for
        m = 3, 5, 7; numeric, the EXP-PFDR-7c8bf2 re-analysis of the committed
        JSONL rows, frozen as a regression. Added by the round: the frozen
        per-instance predicate fires on rho at the generic rate (38 of 145
        against a design expectation of 38.2; EV-PFDR-d90ccd OBS-6, PTM-1), so
        the per-instance form is NOT a test that discriminates generic from
        non-generic; the aggregate form is.
    observation_collision:
      observable: >-
        Refined (R1): the aggregate T per (panel, m, mode, arm class) cell on
        premise-holding arms, both r conventions, with calibrated 99%
        curve-bootstrap intervals.
      distinct_preimage_search: >-
        Carried verbatim: two engines can share the ratio and differ in memory
        or advice (the h-table vs a harvest-all engine at the same S, and
        mitm vs BL at the same online T), so the ratio certifies time only,
        and memory and advice are reported separately; two bases can share the
        ratio and differ in coverage (random vs small_x at matched |F| within
        7%), consistent with KN-FIND-007 (the ratio is blind to yield
        redistribution).
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Carried verbatim: the birthday collision count, lifted from one
          relation (rho, KR-RHO-13bf67) to r relations (index calculus); the
          multi-instance form behind KR-RHO-46c2c6.
        predicted_gain: >-
          Carried verbatim: none as an attack. As a screen, every structured
          proposal must exhibit collision excess kappa ~ N^delta
          (single-instance model) or beat S*T^2 = N (preprocessing model);
          the exponent gain is exactly delta/2. Refined: the screen is the
          AGGREGATE test of clause (i), applied only after the premise audit,
          with the exactly-generic-replica null for any per-instance claim.
    quantifier_order: >-
      Carried (i) verbatim: FOR ALL generic engines A (access = group
      operations plus x-key equality tests; base points are independent
      uniform unknowns), FOR ALL m, beta, h and FOR ALL N: E[#independent
      relations after S S_3-units] <= 4S^2/N * (1+o(1)). THEREFORE there
      exists NO generic A with total S_3 < (1/2)*sqrt(r*N)*(1-o(1)). The
      constant depends on two declared conventions: 2 points per x-key, and 2
      encodings per S_3-unit. Clause (ii) (preprocessing, CGK) is not tested
      here. Refined reading (R2): the EXPECTATION step for an adaptive,
      truncating, data-dependent-stop engine is carried as HEUR-cf8ca6-H3
      and is open (DN D3); the aggregate test supports it numerically on
      this engine only.
    method_ceiling:
      strongest_certifiable_claim: >-
        Carried and refined: a GGM derivation (with the adaptive-engine step
        now an explicit open heuristic, HEUR-cf8ca6-H3) plus a toy-scale
        check. The check shows the implemented engine at a constant multiple
        of the floor at odd m and at N^{1/(2m)} times the floor at even m on
        its aggregate; the aggregate held on every premise-holding cell
        tested (lowest calibrated 99% lower end 1.373). It says nothing about
        non-generic engines. EXP-PFDR-7c8bf2 checks the numerics only; the
        TW-FLOOR round (review-breakthrough, max) reviewed the per-instance
        reading; NO review of the derivation itself exists yet
        (DEC-20261001-494663 NA-4 commissions the independent check).
      nearby_object_control: >-
        Carried verbatim: Gaudry over F_{q^n} (KR-IC-46d822), where the floor
        is beaten because relations come from polynomial-system solving. A
        structured base whose measured aggregate T falls below 1 beyond its
        calibrated interval is a detected non-generic effect or an accounting
        error; either outcome is a headline and routes to review-breakthrough
