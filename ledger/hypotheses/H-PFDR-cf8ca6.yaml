        r = 1 slice (walk/(0.886*sqrt(N))), the random base as the generic
        null at m = 3, the exactly generic replica (PTM-5) as the null for
        any per-instance predicate, and the harvest-off rows, known_log and
        j0_coset as positive controls (EV-PFDR-d90ccd OBS-2, OBS-4, OBS-6).
    proof_obligations:
      - claim: pairwise collision probability of distinct adaptive linear forms is <= 2/N under the x-key
        responsibility: correctness
      - claim: each independent relation consumes a distinct collision
        responsibility: size
      - claim: one S_3-unit = two encodings in the engine's charging
        responsibility: interface
      - claim: odd-m mitm exponent equals the floor exponent
        responsibility: baseline
      - claim: the lemma does not apply to Groebner or structured-predicate engines
        responsibility: scope
      - claim: 'NEW (R2): the expectation form E[#colliding compared pairs] <= (2S)^2/N (1+o(1)) for an ADAPTIVE engine that truncates at the first hit and stops at a data-dependent time — open, carried as HEUR-cf8ca6-H3'
        responsibility: correctness
    proof_obligations_note: >-
      Carried: none of the first five is discharged by EXP-PFDR-7c8bf2; the
      TW-FLOOR round discharged none either (it tested the reading, not the
      derivation). The sixth is the refinement's explicit open obligation,
      commissioned to a derivation note (DEC-20261001-494663 NA-4). The BL
      Pareto obligation of the source record is clause (C2) and is out of
      this hypothesis's scope.
    not_applicable_reason: null

