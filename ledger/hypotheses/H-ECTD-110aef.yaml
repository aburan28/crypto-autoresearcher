hypothesis:
  id: H-ECTD-110aef
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_proposal: IDEA-20260805-4f9881

  statement: >-
    SCOPE: the three yield-shaped meters of the frozen contract EXP-ECTD-001 --
    semaev_m3_relation_density, semaev_m4_relation_density,
    fb_decomposition_probability -- evaluated across the curves of a single
    ordinary F_p isogeny class under that contract's own frozen factor-base
    convention. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO CLAIM ABOUT WHETHER
    RARE TRAPDOOR ENDPOINTS EXIST. THIS IS AN INSTRUMENT AUDIT, NOT A MECHANISM
    FINDING.
    THE CLAIM. Let G be the order-N group of a curve in the class, D the factor
    base with |D| = B, and c_D(r) the number of size-m multisets from D summing
    to r. KN-FIND-007 establishes, by exact counting, sum_r c_D(r) =
    binomial(B+m-1, m), hence lambda := E_r[c_D(r)] = binomial(B+m-1, m)/N for
    EVERY base of size B, and coverage := P_r[c_D(r) >= 1] <= min(1, lambda).
    Tate's isogeny theorem fixes N across the class and EXP-ECTD-001's own
    invalidation rule fixes B across the class. Four forced values follow, all
    derivable before any run:
    (V1) the class-internal max/median of the TRUE mean yield is EXACTLY 1.000000
    on every class, every m, every base convention;
    (V2) for the coverage-shaped meter, max/median <= min(1, lambda)/median, and
    when the median curve sits at the structureless value 1 - exp(-lambda) this
    is cap(lambda) = min(1, lambda)/(1 - exp(-lambda)), which is MAXIMISED AT
    lambda = 1 WITH THE VALUE 1/(1 - 1/e) = 1.58198 and is BELOW 1.5820 FOR EVERY
    lambda whatsoever -- so the contract's frozen >=100x threshold exceeds the
    arithmetic ceiling by a factor of at least 63.2;
    (V3) because coverage <= min(1, lambda) is a hard per-curve ceiling, the
    event "max/median >= 100" is EXACTLY the event "median <= min(1,lambda)/100",
    i.e. an assertion that the TYPICAL curve is degenerate rather than that the
    outlier is exceptional -- two distinct ground truths with one observable,
    which the frozen decision table maps to heavy_tail_hit either way;
    (V4) consequently the contract's MANDATORY CTRL-PLANTED-OUTLIER, which
    demands a planted >=100x decomposition-probability outlier at fixed (B, m, N)
    and voids the run if it is not recovered, is NOT CONSTRUCTIBLE on any of the
    three meters.
    THE HYPOTHESIS IS FALSIFIED, cleanly and cheaply, by an executor who
    constructs such an outlier at fixed (B, m, N) -- in which case the frozen
    contract is sound as written and this record is withdrawn by a superseding
    correction.

  mechanism: >-
    DERIVED IN THIS RECORD from an in-corpus result whose figures are cited, not
    re-asserted.

    THE IDENTITY. knowledge/findings/KN-FIND-007.md ("Decomposition-yield
    conservation", claim_tier toy, proof_status derivation, confidence
    established) states: for a finite abelian group G of order N and D contained
    in G \ {0} with |D| = B, and for m >= 1, every size-m multiset from D sums to
    exactly one target, so sum over r in G of c_D(r) = binomial(B+m-1, m)
    exactly, hence E_r[c_D(r)] = binomial(B+m-1, m)/N for EVERY base of size B
    independently of how D is chosen. That entry records the identity as
    confirmed over 144 measured cells at N ~ 2^14 / 2^16 / 2^18 with the maximum
    absolute deviation of the exact cell mean from the formula EXACTLY ZERO, and
    records the further consequence coverage <= min(1, lambda) with equality iff
    no target has two decompositions.

    THE QUANTIFIER THAT MAKES IT BITE, WHICH NO ECTD RECORD HAS APPLIED. By
    Tate's isogeny theorem every curve in an F_p-isogeny class has the same
    #E(F_p) = N. EXP-ECTD-001's inputs block freezes a "deterministic FB
    convention ... identical convention across all curves in a class and all null
    arms", and its invalidation rules void the run if "factor-base convention
    differs across curves in a class". So B and N are BOTH class-constant, hence
    lambda is class-constant: THE MEAN YIELD IS LITERALLY THE SAME NUMBER ON
    EVERY CURVE BEING COMPARED, exactly, before any measurement.

    V1. The contract's primary metric class_max_over_median_per_meter, evaluated
    on the true mean yield, is max(lambda, ..., lambda)/median(lambda, ...,
    lambda) = 1.000000. Any observed departure is estimator noise or
    higher-moment variation, and the frozen contract nowhere separates them.

    V2. Every curve obeys coverage <= min(1, lambda). Therefore max_coverage /
    median_coverage <= min(1, lambda)/median_coverage. Taking the median curve at
    the structureless value 1 - exp(-lambda) gives
        cap(lambda) = min(1, lambda) / (1 - exp(-lambda)).
    For lambda -> 0 this tends to 1 (both numerator and denominator ~ lambda).
    At lambda = 1 it is 1/(1 - 1/e) = 1.581977. For lambda > 1 the numerator
    saturates at 1 while the denominator rises, so cap decreases back toward 1.
    The function is therefore maximised at lambda = 1 and cap(lambda) <= 1.5820
    FOR EVERY lambda. Worked points a reviewer can check by hand:
    cap(0.167) = 0.167/0.1538 = 1.0836; cap(0.3) = 0.3/0.2592 = 1.1574;
    cap(1) = 1.58198; cap(2) = 1/0.8647 = 1.1565; cap(3) = 1/0.9502 = 1.0524.
    The frozen threshold is 100.

    V3. Since coverage <= min(1, lambda) holds for EVERY curve including the
    maximiser, "max/median >= 100" holds iff median <= max/100 <=
    min(1,lambda)/100. The observable does not distinguish an exceptional
    maximiser from a degenerate median; the frozen decision table reads it only
    the first way. This is an identifiability failure of the primary metric in
    the inventor-protocol section 8 audit-2 sense, found at zero compute.

    V4. CTRL-PLANTED-OUTLIER is frozen as "artificially easy Semaev instance on
    one curve ... planted >=100x decomp probability or d_reg-2 relative to class
    median under the frozen meters", with pass_condition "planted curve recovered
    as outlier; else instrument_void" and the invalidation rule "planted control
    not recovered -> void for mathematical claims". By V1-V3 the >=100x
    decomposition-probability limb is not constructible at fixed (B, m, N). The
    d_reg-2 limb is NOT covered by this hypothesis and remains fully available;
    that is why V4 is a statement about one of the two limbs and says so.

    WHAT CAN BE PLANTED, ALREADY IN THE CORPUS. KN-FIND-007 records that
    structure LOWERS coverage at matched size (structure creating repeated sums
    reduces the number of distinct covered targets) and cites the H017
    small-multiples base collapsing to a coverage ratio of 0.0021 at 2^18 while
    its concentration statistic reaches 1224x. So the plantable effects are a
    coverage COLLAPSE and a CONCENTRATION spike, never a mean or coverage
    increase. That is the repair, and it is the positive control this hypothesis
    requires.

    THE CONSTRUCTIVE REPLACEMENT. Because lambda is known exactly in closed form,
    the correct statistic needs no median in a denominator at all:
        z_E = (lambda_hat_E - lambda) / sqrt(Var_hat / S),
    reported per curve with a multiple-comparison correction for the class size,
    together with the two functionals KN-FIND-007 leaves free -- coverage, which
    is bounded above and is therefore tested ONE-SIDED against 1 - exp(-lambda),
    and concentration max_r c_D(r), which is unbounded above and is the only one
    of the three where a large ratio is even possible and which the frozen
    contract does not measure at all. A test against an exactly known null mean
    is strictly more powerful than a ratio against an estimated median and cannot
    be satisfied by a degenerate denominator. THE COORDINATOR ALONE MAY ADOPT IT
    (AGENTS.md rule 1); this record proposes and does not amend.

  assumptions:
    - >-
      THE LARGEST EXPOSURE, NAMED FIRST. The frozen contract lists meter NAMES,
      not formulas. This hypothesis assumes semaev_m3_relation_density,
      semaev_m4_relation_density and fb_decomposition_probability are
      yield-shaped in KN-FIND-007's sense (a mean per-target decomposition count,
      or the coverage functional). IF ANY IS NOT -- for instance if
      fb_decomposition_probability is a per-attempt success rate over a different
      denominator, or a concentration statistic -- the identity does not bind it
      and the covered set shrinks. Stage 1 of EXP-ECTD-d971bc reads the run
      driver and reports which of the three the identity actually covers, BEFORE
      any conclusion is drawn. No conclusion may be drawn past a failed Stage 1.
    - >-
      The relevant subgroup has prime order N, so every curve in the class has
      the same cyclic group up to isomorphism. With a cofactor the identity holds
      with N the full group order; the numbers change, V1-V4 do not.
    - >-
      V2's cap uses median_coverage = 1 - exp(-lambda), the value a structureless
      base of size B gives when decompositions are approximately Poisson. If the
      median curve's coverage is genuinely far below that, the ratio can exceed
      1.582 -- and V3 is precisely the statement that in that case the finding is
      about the median rather than the max. BOTH READINGS ARE CARRIED AND NEITHER
      IS PICKED (AGENTS.md retrieval policy item 7 applied to internal records).
    - >-
      Arithmetic is exact: binomial coefficients as Python integers, no floats in
      lambda; floats appear only in cap(lambda) and are reported to 6 significant
      figures with the exact rational available.

  proof_search_map:
    bottleneck: >-
      EXP-ECTD-001's primary metric class_max_over_median_per_meter with its
      frozen >=100x threshold, and the mandatory planted control that gates the
      whole run. GOAL-ECTD-001's next_action queues BATCH-003 to execute exactly
      this contract at 40 CPU-hours with six of eight campaign batches
      remaining. Whether that metric CAN fire is upstream of everything the batch
      would produce and costs minutes to settle.
    baseline_embedding:
      parameter_slice: >-
        KN-FIND-007's own 144 cells at N ~ 2^14 / 2^16 / 2^18, where the exact
        cell mean matched binomial(B+2,3)/N with maximum absolute deviation
        exactly 0. That is the frozen fixture: the slice m = 3 at those three N,
        with the same base sizes, must reproduce lambda exactly.
      reproduction_check: >-
        SYMBOLIC PLUS FROZEN FIXTURE. The implementation computes lambda in
        closed form and, on a directly enumerated toy group, measures the exact
        mean; the two must agree as exact rationals. A plot that resembles the
        prediction is not a reproduction -- KN-FIND-007's recorded deviation is
        EXACTLY ZERO and the check inherits that standard.
    observation_collision:
      observable: >-
        The single ratio class_max_over_median_per_meter, per meter per class.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS DERIVED RATHER THAN SEARCHED FOR, AND IS THE WHOLE
        POINT (V3). Because coverage <= min(1, lambda) binds every curve, the
        observable "max/median >= 100" is produced by TWO distinct ground truths:
        (a) a genuinely exceptional maximiser near the ceiling with a typical
        median -- which V2 shows is IMPOSSIBLE, since the ratio would then be at
        most 1.582; and (b) a degenerate median at or below min(1,lambda)/100
        with an ordinary maximiser -- which is the only way the observable can
        occur. The frozen decision table maps the observable to heavy_tail_hit
        and thereby reports (b) as if it were (a). No additional condition in the
        contract separates them, so this is a direct falsifier of the metric's
        identifiability. THE SEPARATING CONDITION EXISTS AND IS PROPOSED: report
        max and median SEPARATELY against the exactly known ceiling min(1,lambda)
        and the exactly known structureless value 1 - exp(-lambda), never their
        ratio.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the ratio statistic max/median by the standardised deviation
          z_E = (lambda_hat_E - lambda)/sqrt(Var_hat/S) against the exactly known
          null mean lambda = binomial(B+m-1,m)/N, moving the hypothesis into a
          model where the null is an EXACT EQUALITY rather than an estimated
          quantity.
        predicted_gain: >-
          Strictly greater power at the same sample size, no degenerate
          denominator, and a decision rule that cannot be satisfied by a
          pathological median. Encoding, completeness and soundness obligations
          are listed under proof_obligations; the transfer obligation to the two
          Groebner/Macaulay meters is DECLARED UNMET, not deferred.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (max/median) fixed and vary the forgotten structure
          (which of max or median is anomalous). The intrinsic invariant proposed
          to distinguish the resulting configurations is the pair (max/ceiling,
          median/structureless-value), which is computable from the same data at
          no extra cost.
        predicted_gain: >-
          If the pair does not distinguish the configurations, the metric has not
          identified the load-bearing structure and the audit fires at zero
          compute -- which is the outcome the derivation predicts.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR ALL ordinary F_p isogeny classes with
      prime-order N, FOR ALL m >= 1, FOR ALL factor-base conventions of a FIXED
      size B applied identically to every curve of the class, FOR ALL curves E in
      the class: lambda_E = binomial(B+m-1, m)/N. The witness (the value lambda)
      may NOT depend on E, and that independence is the entire content. The
      weaker order -- FOR ALL E EXISTS lambda_E -- is vacuous and is explicitly
      NOT claimed.
      THE QUANTIFIER TRAP BEING HUNTED, stated so a reviewer can check it: the
      identity is a statement about the MEAN over targets, quantified over
      targets, for a FIXED curve. The contract's statistic is a max over CURVES.
      Conflating "the mean over targets is class-constant" with "the measured
      meter is class-constant" would be exactly the quantifier error this audit
      exists to avoid, and V1/V2 are therefore stated about the TRUE mean while
      the estimator's behaviour is handled separately under HEUR-ECTD-YIELD-2.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that on the three yield-shaped meters of one frozen contract,
        at fixed (B, m, N), the max/median statistic has true value 1, is capped
        at 1.582 in its coverage form under a stated median condition, is
        identifiability-degenerate at the >=100x threshold, and admits no
        constructible >=100x planted positive control. IT CANNOT certify that no
        class-internal heterogeneity exists, cannot touch
        groebner_solving_degree_d_reg or macaulay_rank_defect_at_first_fall,
        cannot bear on H-ECTD-001's mechanism question, and cannot be cited as
        evidence that the trapdoor lane is closed. Writing it up as any of those
        would be the premature-closure failure mode.
      nearby_object_control: >-
        THE STRUCTURED BASE WHERE THE HOPED-FOR CONCLUSION FAILS: the H017
        small-multiples base, D = {small multiples of a generator}. It is the
        closest object to a random base -- same G, same B, same m -- and on it
        the meters DO move dramatically, but in the direction the identity
        permits: KN-FIND-007 records coverage collapsing to a ratio of 0.0021 at
        2^18 while concentration reaches 1224x. A method that cannot separate a
        random base from the small-multiples base has not identified the
        load-bearing structure and no negative from any arm may be reported. Note
        what the pair demonstrates: a 1224x effect IS available in this system --
        just not in the mean, and not upward in coverage.
    proof_obligations:
      - claim: lambda = binomial(B+m-1, m)/N for every base of size B in any group of order N.
        responsibility: correctness
      - claim: N is class-constant (Tate) and B is class-constant (the contract's own rule).
        responsibility: interface
      - claim: cap(lambda) = min(1,lambda)/(1-exp(-lambda)) <= 1.5820 for all lambda > 0.
        responsibility: strictness
      - claim: >-
          The audit covers exactly 3 of 5 meters and every downstream citation
          says which 2 it does not cover.
        responsibility: scope
      - claim: >-
          The estimator argument (V1 -> observed ratio) is separated from the
          true-mean argument and is flagged as the only modelled step.
        responsibility: success_probability
      - claim: >-
          No statement is made about whether rare trapdoor endpoints exist; the
          audit is about an instrument.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL. There is no complexity claim of any kind. This is an audit
    of a measurement contract. It makes no system easier to solve, moves no
    exponent, and adds no attack; Pollard rho remains the ECDLP baseline and
    sota_delta is zero on every attack axis (time, memory, data, queries,
    advice). dominated_by is not applicable because no Pareto point is claimed.

  heuristic_assumptions:
    - id: HEUR-ECTD-YIELD-1
      formal_statement: >-
        NONE LOAD-BEARING FOR V1, V2, V3 OR V4. Those rest on
        sum_r c_D(r) = binomial(B+m-1,m) and coverage <= min(1, lambda), both
        exact counting facts recorded in KN-FIND-007 with proof_status
        derivation, plus Tate's isogeny theorem and the contract's own frozen
        rule. This entry exists to record that the audit's headline is
        UNCONDITIONAL, where every prior ECTD heuristic (HEUR-ECTD-TAIL-1,
        HEUR-ECTD-VERT-1, HEUR-ECTD-DDH-1) is recorded in its own source record
        as supported by no theorem.
      random_model_justification: >-
        Not applicable; no random model is invoked for V1-V4.
      supporting_results:
        - knowledge/findings/KN-FIND-007.md (in-corpus derivation, 144 cells, deviation exactly 0)
        - Tate's isogeny theorem (RECALLED, standard; no theorem number asserted)
      validation_experiment_ids: [EXP-ECTD-d971bc]
      falsification_condition: >-
        An executor constructs, at fixed (B, m, N), a curve whose mean yield or
        coverage exceeds the class median by >=100x under the frozen convention.
        Zero-compute-cheap to attempt, and it kills the audit outright.
    - id: HEUR-ECTD-YIELD-2
      formal_statement: >-
        THE ONLY MODELLED STEP, AND IT SUPPORTS V1's OBSERVABLE FORM ONLY. A
        per-curve meter estimated from S sampled targets behaves like a mean of S
        weakly dependent draws, so its relative standard deviation is
        approximately 1/sqrt(S*lambda); over a class of 64 curves the maximum
        sits about 2.24 standard deviations above the median, giving
        max/median ~ 1 + 2.24/sqrt(S*lambda), so a ratio of 100 requires
        S*lambda <= 0.0005.
      random_model_justification: >-
        A normal approximation with the 1 - 1/64 quantile of the standard normal
        (2.2414). This IS a modelling assumption and is flagged as one. It affects
        only the quantitative form of V1's observable consequence; V1's exact
        statement about the TRUE mean, and V2, V3, V4, all stand without it.
      supporting_results: []
      validation_experiment_ids: [EXP-ECTD-d971bc]
      falsification_condition: >-
        Stage 3 measures the empirical max/median over 64 independent random
        B-subsets at matched (N, B, m, S) and it departs materially from
        1 + 2.24/sqrt(S*lambda). This heuristic is then refuted and nothing else
        in the record is.

  structural_ingredients:
    - description: >-
        Decomposition-yield conservation: sum_r c_D(r) = binomial(B+m-1,m), hence
        lambda = binomial(B+m-1,m)/N for every base of size B, and
        coverage <= min(1, lambda).
      citation: >-
        knowledge/findings/KN-FIND-007.md (in-corpus internal finding, confidence
        established, proof_status derivation, claim_tier toy, added 2026-07-24,
        superseded_by null; proof_refs include experiments/EXP-FB3-001/
        conservation.md and analysis.md). Its recorded measurements -- 144 cells,
        maximum absolute deviation exactly 0, H017 coverage ratio 0.0021 at 2^18
        with concentration 1224x, typed-decomposition penalty 4.817x -- are cited
        as corpus figures and are NOT re-asserted as this record's measurements.
      role: the exact identity that pins the first moment
    - description: >-
        Tate's isogeny theorem over finite fields, supplying class-constancy of N.
      citation: RECALLED, standard; no theorem number, page, or venue asserted.
      role: makes the identity's (B, N) both class-constant
    - description: >-
        EXP-ECTD-001's frozen factor-base rule and its matching invalidation rule.
      citation: experiments/EXP-ECTD-001/specification.yaml (inputs.factor_base_rule; invalidation_rules)
      role: supplies the second half of class-constancy, from the contract itself

  reduction_chain:
    core_problem: >-
      Determine, before execution, whether EXP-ECTD-001's primary metric can
      produce the observation its decision table is written to detect, on the
      three yield-shaped meters.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is NO reduction from this audit to any statement
      about (i) the two Groebner/Macaulay meters, (ii) whether rare endpoint
      weaknesses exist, (iii) any other goal's yield instrument, or (iv) the
      trapdoor question itself. An instrument audit is not a mechanism finding
      and every citation must carry that gap. This program's own EV-STR-003 and
      EV-DS-004 are the precedents for keeping the distinction.

  predictions:
    - metric: >-
        V1 -- TRUE-MEAN RATIO: max over class curves of lambda divided by median
        over class curves of lambda, with lambda = binomial(B+m-1,m)/N computed
        in closed form for the frozen B, m and the class N
      direction: different
      minimum_effect: >-
        EXACTLY 1.000000, on every class, every m in {3,4}, every N in the frozen
        40-56 bit range. Zero fitted parameters. If two curves of one class yield
        different lambda, either B differs (a frozen invalidation condition) or
        they are not isogenous; the run reports an INSTRUMENT FAILURE with no
        mathematical content.
    - metric: >-
        V2 -- COVERAGE CAP: cap(lambda) = min(1, lambda)/(1 - exp(-lambda))
        tabulated over the frozen (B, m, N) grid, plus its global maximum
      direction: lower
      minimum_effect: >-
        <= 1.5820 at EVERY grid cell, with the global maximum exactly
        1/(1 - 1/e) = 1.581977 attained at lambda = 1. Hand-checkable points:
        cap(0.167) = 1.0836, cap(0.3) = 1.1574, cap(1) = 1.58198,
        cap(2) = 1.1565. The frozen threshold 100 is therefore unreachable by a
        factor of at least 63.2. FALSIFIED if any cell yields cap > 1.5820,
        which would mean the calculus above is wrong.
    - metric: >-
        V3 -- MEDIAN-DEGENERACY EQUIVALENCE: the fraction of the frozen grid at
        which "max/median >= 100" is logically equivalent to
        "median <= min(1,lambda)/100"
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000 -- the equivalence holds wherever coverage <= min(1,lambda)
        binds, i.e. at every cell. Reported as the identifiability finding, with
        both readings of any future hit carried forward and neither picked.
    - metric: >-
        V4 -- PLANTED-CONTROL CONSTRUCTIBILITY: the number of the three
        yield-shaped meters on which a >=100x planted positive outlier can be
        built at fixed (B, m, N)
      direction: lower
      minimum_effect: >-
        EXACTLY 0. THIS IS THE DECISIVE PRE-RUN PREDICTION. If an executor CAN
        build one, the derivation is wrong, this record is falsified, and
        EXP-ECTD-001 is sound as frozen -- which is a fully acceptable and
        pre-registered outcome.
    - metric: >-
        V5 -- ESTIMATOR CEILING: the value of S*lambda at which
        1 + 2.24/sqrt(S*lambda) reaches 100, compared against the run driver's
        actual S*lambda
      direction: lower
      minimum_effect: >-
        S*lambda <= 0.0005 is required for the ratio to reach 100. The driver's
        S*lambda must exceed this by orders of magnitude for the meter to be
        estimable at all; the run reports both numbers side by side.
    - metric: >-
        V6 -- SCOPE: the number of EXP-ECTD-001's five primary meters that
        KN-FIND-007 does NOT constrain
      direction: different
      minimum_effect: >-
        EXACTLY 2 -- groebner_solving_degree_d_reg and
        macaulay_rank_defect_at_first_fall. The delta_d_reg >= 2 route to
        heavy_tail_hit remains fully live and is arguably now the ONLY live
        route, which makes it more important rather than less. Any downstream
        reading of this record as "the screen is dead" misrepresents it.
    - metric: >-
        V7 -- GRADED-PATH INVARIANCE: measured lambda_hat along the interpolation
        from a uniformly random base to the small-multiples base, at fractions
        f in {0, 0.25, 0.5, 0.75, 1.0}, at fixed B
      direction: different
      minimum_effect: >-
        lambda_hat must be STATISTICALLY FLAT along the entire path (it depends
        only on B, m, N), while coverage must fall MONOTONICALLY and
        concentration must rise MONOTONICALLY. A lambda that moves with f is an
        implementation error; a coverage that fails to fall is the canonical
        artifact tell -- a quantity that does not respond to the parameter meant
        to move it. This arm carries one quantity that must move and one that
        must not, which is a stronger joint test than either alone.

  test_boundary:
    instances:
      - >-
        Closed-form arithmetic over the frozen contract grid: N bit sizes
        {40, 44, 48, 52, 56}, m in {3, 4}, B on a declared ladder spanning
        N^{1/m} by factors of 2. NO CURVE IS CONSTRUCTED for this arm.
      - >-
        Direct simulation in Z/N at N = 2^14, 2^16, 2^18 -- exactly the sizes
        KN-FIND-007 used -- for the null, positive-control and graded arms.
      - >-
        The run driver of EXP-ECTD-001, read (not executed, not modified) to
        extract the five meter definitions.
    parameters:
      n_bits_closed_form: [40, 44, 48, 52, 56]
      n_sim: [16384, 65536, 262144]
      m_values: [3, 4]
      class_size_assumed: 64
      graded_fractions: [0.0, 0.25, 0.5, 0.75, 1.0]
      arithmetic: exact integers for binomials and lambda; floats only in cap(lambda)
      null_arm: 64 independent uniformly random B-subsets of Z/N at matched (N, B, m, S)
      positive_control_arm: H017 small-multiples base at matched B
    implementation: >-
      Pure Python 3.11 plus numpy 2.4.6 (present). NO Sage, NO sympy, NO PARI/GP,
      NO gmpy2 -- all verified absent in this container by import on 2026-08-05,
      and the design uses none of them. Multiset enumeration at m = 3 over B ~
      few hundred is C(B+2,3) ~ 10^6-10^7 additions in the simulation arm, which
      is the dominant cost and is what the budget below is sized for.
    budget:
      stage1_wall_clock_seconds: 1800
      stage2_wall_clock_seconds: 900
      stage3_wall_clock_seconds: 5400
      total_wall_clock_seconds_ceiling: 8100
      maximum_memory_gb: 2
