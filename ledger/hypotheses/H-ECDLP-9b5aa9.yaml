  statement: >
    Fix the closed-form
    obstruction-predicate identities of
    IDEA-20260808-7c4e9d before any
    Semaev arm is rerun, any MITM join
    is executed, or any discrete
    logarithm is solved. Stage 0 asserts
    only that on the frozen fixture
    table Y_A=1, Y_B=1, Y_C=1/20 the
    three predicates Y_A=Y_B,
    Y_C/Y_A<1/10, and Y_B-Y_C>0 all
    hold, so obstruction_holds is true.
    A nearby claim that Y_C=Y_A (MITM
    itself yields) is rejected. A dummy
    that sets all three yields equal is
    rejected as an obstruction. This is
    not a Semaev rerun and not a rho
    beat. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260808-7c4e9d tracks the
    conjunction of three yield
    predicates as the named x-oracle
    obstruction. Stage 0 freezes those
    predicates on an exact rational
    fixture so a later re-analysis
    cannot move the gate. The fixture is
    not EXP-SEMAEV-f48dd1 data. No S_m.
    No Coppersmith. No DLP solve.
