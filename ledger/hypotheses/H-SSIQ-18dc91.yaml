hypothesis:
  id: H-SSIQ-18dc91
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-003
  statement: >-
    On supersingular 2-isogeny graphs built directly (not from the WISDE
    counting data) for a set of small primes, greedy local descent on delta_E
    reaches the F_p-rational locus (delta_E = 1) in FEWER steps, as a function
    of graph size N, than an undirected random walk on the same graph: writing
    the median hitting time as h(N) ~ N^{gamma}, gamma_greedy < gamma_random.
    A DETECTABLE GAP (gamma_random - gamma_greedy > 0, outside the two
    estimators' joint confidence interval) is a computable delta_E-gradient in
    the sense of GOAL-SSIQ-001 lever L4's revisit condition. NO gap (gamma
    values statistically indistinguishable) means delta_E behaves, for descent
    purposes, like an unstructured labelling of the graph, and L4's obstruction
    stands unresolved by this test.
  statement_note: >-
    THIS IS THE DIRECT TEST OF LEVER L4, the only lever whose ceiling meets
    this goal's p^{1/4} target (DEC-20260805-be2f87 D-3, D-4). It answers the
    M-GRAD question BATCH-002 could not measure (REC-1b), because the WISDE
    release carries no isogeny adjacency -- this experiment BUILDS the
    adjacency itself, independently of the counting-function fit that failed in
    BATCH-002, and reports a DIFFERENCE of two exponents measured through the
    SAME instrument on the SAME graphs so that any shared estimator bias
    (EV-SSIQ-29fcbb O-4/O-5) cancels rather than propagates.
  scope_note_pf5: >-
    NARROWED AT FREEZE TIME by EXP-SSIQ-58b642's pre-freeze review (PF-5): the
    tested prime set is restricted to p = 1 (mod 12), where neither j=0 nor
    j=1728 is supersingular, so the graph is a genuine simple 3-regular graph
    with no degenerate-vertex multiplicity question. The original mechanism
    text below (written before that review) still describes j=0/1728 as
    "near-3-regular" in the general case; that description is retained for the
    record but does not apply to the actual tested prime set, per
    experiments/EXP-SSIQ-58b642/specification.yaml inputs.primes.pf5_resolution.
    Testing p != 1 (mod 12) is a deferred successor, not covered by this
    hypothesis as tested.
  mechanism: >-
    The supersingular 2-isogeny graph (Pizer graph) on the j-invariants over
    F_bar_p is a connected 3-regular (or near-3-regular at j=0,1728, in the
    GENERAL case not tested here -- see scope_note_pf5) graph on ~p/12
    vertices. Greedy descent from a start vertex v0 repeatedly moves to
    the 2-isogenous neighbour of strictly smaller delta_E (ties broken by a
    fixed deterministic rule; if no neighbour is strictly smaller, descent
    halts at a local minimum, which is reported as a separate outcome, not
    silently extended). If delta_E behaves as a graph distance to the
    F_p-rational locus plus bounded noise, greedy descent should reach that
    locus in O(diam) steps with a smaller exponent than the O(N) mixing-time
    scaling of a random walk. If delta_E is uncorrelated with 2-isogeny
    adjacency, greedy descent degrades to a random search over its immediate
    neighbourhood at every step and the two exponents coincide.
  assumptions:
    - >-
      The 2-isogeny graph, built independently via Velu's formulas over F_{p^2}
      and modular-polynomial (Phi_2) neighbour-finding, is connected for every
      tested prime, so that BFS from one known supersingular j-invariant
      enumerates the full vertex set. IF A PRIME'S GRAPH IS DISCONNECTED OR THE
      BFS DOES NOT REACH THE EXPECTED ~p/12 COUNT, that prime's run is
      completed_invalid, not evidence in either direction.
    - >-
      delta_E for each enumerated j-invariant can be cross-referenced against
      the WISDE released data (used here ONLY as ground truth for identifying
      the delta_E = 1 locus and for a correctness check on the graph
      construction, per REC-3 -- never as a source of adjacency or as an
      estimator input). A mismatch in vertex COUNT between the built graph and
      the WISDE record for the same prime is an invalidation trigger.
    - >-
      Small primes (graph size up to ~2000 vertices) are large enough to fit
      two exponents with separable confidence intervals, but this is NOT
      assumed uncritically: M-RANGE-2 (below) reports the achieved separating
      power, and BATCH-002's estimator-bias lesson governs the pre-freeze
      obligation on this contract (see experiment scale_relevance).
  proof_search_map:
    not_applicable_reason: >-
      NOT a proof-oriented hypothesis. This is a direct instrument-level test of
      whether a computable delta_E-gradient exists, which is L4's own revisit
      condition, not a proposed mechanism for lowering an algorithm's cost.
      docs/inventor-protocol.md section 8 governs proposals to reduce a
      complexity, not gradient-existence tests that feed a later proposal.
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. A detected gradient does not itself constitute a
    complexity claim: L4's own obstruction is a HITTING-TIME BOUND for a
    density-p^{-1/2} set in an expander, and a gradient existing is necessary
    but nowhere near sufficient for a p^{1/4}-time descent. This hypothesis
    establishes existence of a signal, not a cost.
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None numbered. The connectivity and correctness-check assumptions above are
    invalidation conditions on the RUN, not heuristics the CONCLUSION rests on.
  status: analyzed
  status_note: >-
    MOVED proposed -> analyzed by DEC-20260805-cd8bcd on EV-SSIQ-9a0396.
    analyzed, NOT supported and NOT weakened: RUN-SSIQ-58b642-a's real-label
    descent arm was never computed, because WISDE's released data carries no
    per-vertex j-invariant linkage to the abstract quaternion-order rows it
    does carry (independently confirmed by reading WISDE's own generating
    script). The instrument that would test this hypothesis is NOT the
    problem -- Phase 0 calibration and graph construction both passed,
    independently re-derived and re-verified beyond the run's own claims -- so
    this is UNTESTED, not inconclusive-by-instrument-defect (contrast
    H-SSIQ-6e0748's BATCH-002 status, which shares this label for a different
    reason). Revisit when a cheaper route than full Deuring correspondence
    (e.g. direct in-session smooth-degree isogeny computation of delta_E)
    supplies the missing per-vertex labels; do not re-run the same WISDE-linked
    instrument expecting a different outcome.
    Only the Coordinator changes hypothesis status (AGENTS.md rule 1).
  scope_ceiling:
    claim_tier: toy
    detail: >-
      Toy scale, graph sizes up to ~2000 vertices (p up to roughly the low tens
      of thousands, bounded by the executor's actual compute budget, NOT
      pre-committed to a specific p in this record -- the frozen contract states
      the exact prime set). No result transfers to cryptographic scale.
  why_this_test_and_not_another: >-
    The Red Team named it directly (RT-BATCH-002 recommendation, adopted in
    DEC-20260805-be2f87 next_actions): repairing BATCH-002's estimator was
    declined because a perfect fit at log2 p <= 18 still cannot validate an
    asymptotic on the counting function, but L4's own question -- does a
    computable gradient exist -- is answerable directly by building the graph
    the counting function never had access to.
  owner: coordinator
  created_at: '2026-08-05'
