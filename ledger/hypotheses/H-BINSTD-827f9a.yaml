    The n-span 23 minus 17 is 6, and 6 minus 2 is 4, so the span is
    not the delta. The integers from 2 through 4 number 3. Three n
    values times two dimensions is 6 cells. Six times 3 is 18. The
    product of the ceiling gap 2, the excess 1, and the span excess
    4 is 8.
