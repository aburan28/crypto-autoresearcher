hypothesis:
  id: H-XEDN-40037f
  question_id: RQ-XEDN-002
  derived_from_idea: IDEA-20260805-887d67
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  title: >-
    The only exponent-carrying quantity in the fibre-specific relation class,
    measured on its own: the specialisation image M_{t_0} is generically FULL, so
    M/N concentrates at 1 and no reachable subfamily has M ~ p^theta with theta < 1
  relation_to_existing_records: >-
    H-XEDN-2945b2 (committed, same question, same parent proposal) states the lattice
    geometry of the fibre-specific class - the Minkowski slope 1/n (T1), the
    n-independent box volume and the Theta(M^{1/2}) cost identity (T2), and the
    identification of M as the exponent carrier (T3). THIS RECORD DOES NOT RESTATE
    THOSE AND MUST NOT BE READ AS A DUPLICATE. It takes T3 as given and asks the ONE
    question that record leaves open and that the parent proposal itself calls "the
    quantity the whole proposal turns on ... never measured": what is the actual
    distribution of M_{t_0}/N_{t_0}, and does any identifiable subfamily depress it?
    That question is the only outcome in this lane that could move an exponent, and
    it is separable from the lattice geometry entirely. No status of H-XEDN-2945b2 or
    of any completed XEDN record is proposed, implied, or permitted to change here.
  statement: >-
    SCOPE: the frozen surface family already censused in this lane, prime fields with
    p at most about 10^5, all good fibres t_0 with Delta(t_0) != 0, n free-x sections
    with n <= 8, discrete logarithms computed by exhaustive search or baby-step
    giant-step purely as an INSTRUMENT. CLAIM TIER toy for every measured number. NO
    ATTACK IS CLAIMED, NO EXPONENT IS MOVED BY THIS RECORD, AND NOTHING HERE BEARS ON
    ANY DEPLOYED CURVE.
    THE CLAIM. Let sigma_{t_0} be specialisation at a good fibre and
    M_{t_0} = |<sigma_{t_0}(P_1), ..., sigma_{t_0}(P_n)>|, N_{t_0} = #E_{t_0}(F_p).
    Then:
    (C1) CONCENTRATION. Over good fibres t_0 in F_p, the distribution of M/N has
    median exactly 1 for every surface in the family, with mass below 1 confined to
    the arithmetically forced cases - non-cyclic E_{t_0}(F_p), and divisible sections -
    and no other depression.
    (C2) NO SECTION SIGNAL. The M/N distribution for SPECIALISED SECTIONS is
    indistinguishable from that of n UNIFORMLY RANDOM points of the same group at the
    same fibre. The surface contributes nothing beyond n group elements once
    specialised.
    (C3) NO SMALL-M SUBFAMILY. No identifiable subfamily of (surface, fibre) pairs has
    a systematically depressed median M/N, hence none realises M ~ p^theta with
    theta < 1, hence the per-relation cost Theta(M^{1/2}) does not fall below p^{1/2}
    anywhere in the family.
    THE HYPOTHESIS ASSERTS ALL THREE, AND ITS MOST VALUABLE OUTCOME IS ITS OWN
    REFUTATION: a subfamily with theta < 1 is the only result in this lane that would
    move an exponent, and it is what the experiment is worth running for.
  mechanism: >-
    Specialisation is a group homomorphism from a Mordell-Weil lattice of rank at most
    8 into a group of order about p, so the kernel is a full-rank sublattice of Z^n of
    determinant exactly M, and the whole cost of finding a fibre-specific relation
    without prior discrete logarithms is governed by the volume of the search box,
    which is M regardless of n. M is therefore the single free parameter of the entire
    construction. Two or more uniform elements of a finite abelian group generate it
    with probability bounded below by a constant, so the generic expectation is M = N
    and the mechanism predicts concentration at 1 with forced mass at 1/k coming from
    the two arithmetic causes named above. Sections are NOT uniform points - they come
    from a rank-at-most-8 lattice on surfaces selected by a two-section construction -
    which is exactly why (C2) is a measurement rather than a theorem, and exactly where
    a depression could hide. The matched-random null is what separates "sections behave
    like group elements" from "sections are in special position", and it is the arm
    that decides whether this lane has anything exponent-relevant left in it.
  assumptions:
    - >-
      Specialisation is a group homomorphism on smooth fibres. Standard, but stated
      because everything rests on it; a fibre with Delta(t_0) = 0 is excluded and its
      exclusion is recorded rather than dropped.
    - >-
      Computing discrete logarithms at toy p to determine M is methodologically
      acceptable AS AN INSTRUMENT for measuring a group invariant. It is NOT part of any
      proposed attack and no cost statement may be derived from the instrument's own
      runtime. Conflating the two would be exactly the partial-cost error this program's
      rules forbid.
    - >-
      Independence of the sections in the Mordell-Weil lattice can be certified. If the
      sections are dependent, a generic relation exists, the fibre-specific class
      collapses onto the generic one, and the cell measures nothing. Cells failing
      certification are reported SEPARATELY, never dropped silently.
    - >-
      The surfaces are a SELECTED population - conditioned on carrying two prescribed
      sections - so no absolute statement about "the family of rational elliptic
      surfaces" is licensed. The matched-random null controls for this in the ratio and
      NOT in any absolute statement, and that boundary is stated rather than assumed away.
  proof_search_map:
    bottleneck: >-
      The distribution of M_{t_0}/N_{t_0}, and specifically whether any identifiable
      subfamily depresses it. It is decision-changing because the per-relation cost is
      Theta(M^{1/2}) with no dependence on n, on the degree window or on the coefficient
      bound; M is the only parameter left, and a subfamily with M ~ p^{2/3} would give
      p^{1/3} where every incumbent gives p^{1/2}.
    baseline_embedding:
      parameter_slice: >-
        Pollard rho and BSGS at p^{1/2} on the same fibre, measured in the same units,
        are the exact old-method boundary. A relation source not compared against rho on
        the same instance has not been costed, and the comparison is a required arm
        rather than a discussion.
      reproduction_check: >-
        A frozen regression fixture: on a fibre with a KNOWN group order and known
        generators, the instrument must return M equal to the known subgroup order
        exactly, integer for integer. A failure means the subgroup-order instrument is
        broken and no M distribution from it may be reported.
    observation_collision:
      observable: >-
        The ratio M_{t_0}/N_{t_0}.
      distinct_preimage_search: >-
        A depressed M/N has at least three distinct preimages the contract must separate
        or it measures nothing: (a) a genuine surface-specific effect - the finding;
        (b) a non-cyclic E_{t_0}(F_p), where the sections land in one cyclic factor for
        purely arithmetic reasons available to random points too; (c) divisible sections,
        where every image lies in k*E_{t_0}(F_p) for an evident k. Separation is by
        construction: the group STRUCTURE is reported per fibre rather than only the
        order, the divisibility of each specialised section is computed explicitly, and
        the matched-random null absorbs (b) and (c) by sharing them. Only the residue is
        admissible as (a).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The full per-fibre distribution of (M, N, group structure, section
          divisibility) over ALL good fibres of each surface, rather than a single
          summary statistic - so that a depression confined to an identifiable subfamily
          is visible as structure rather than averaged into the median.
        predicted_gain: >-
          No speed gain. It converts "M is the exponent carrier" from a statement into a
          measured distribution, and it is the only place in this lane where an exponent
          could still move.
    quantifier_order: >-
      The claim is: FOR ALL surfaces in the frozen family and FOR ALL good fibres t_0,
      M_{t_0} = N_{t_0} except on the arithmetically forced set. The refutation that
      matters has the opposite shape: THERE EXISTS an identifiable subfamily on which
      the median M/N is depressed. The trap named: "there exists a fibre with small M"
      is satisfied trivially by any non-cyclic fibre and proves nothing; the content is
      an IDENTIFIABLE subfamily - one specified by a public property of the surface or
      the fibre, not by having been observed to have small M. That distinction is frozen
      before the run, because a subfamily defined post hoc by its own measurement is not
      a subfamily.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "over the tested surfaces and all their good fibres at the tested
        primes, the M/N distribution had this shape, the matched-random null gave this
        ratio, and no identifiable subfamily with depressed median was found within the
        declared search." It can NEVER certify that no such subfamily exists - absence
        within a bounded search is not absence - and it certifies nothing at
        cryptographic scale.
      nearby_object_control: >-
        n uniformly random points of the same group at the same fibre, generating a
        subgroup of the same order where required, run through the identical pipeline.
        The surface's contribution is precisely the difference between the two, and if
        there is none the pipeline is measuring group theory rather than geometry.
    proof_obligations:
      - claim: M is computed exactly by a certified subgroup-order instrument.
        responsibility: correctness
      - claim: The group structure and section divisibility are reported per fibre, not only the order.
        responsibility: correctness
      - claim: Section independence is certified per cell, with failures reported separately.
        responsibility: baseline
      - claim: Any candidate subfamily is defined by a public property fixed before the run.
        responsibility: scope
      - claim: The cost comparison against rho is measured on the same fibre in the same units.
        responsibility: runtime
      - claim: The instrument's own runtime is never used as a cost model.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: ECDLP over prime fields, only CONDITIONALLY and via a route this record does not claim works.
    prior_best: >-
      Pollard rho at p^{1/2} time and O(1) memory; BSGS at p^{1/2} time and memory. No
      subexponential algorithm is known for prime-field ECDLP.
    time_exponent: >-
      NOT CLAIMED. The record's expected outcome is per-relation cost Theta(M^{1/2}) =
      p^{1/2} at M ~ p, identical to rho and strictly worse once the lift is charged.
      The conditional statement, stated as conditional: if a subfamily with M ~ p^theta,
      theta < 1, exists, the per-relation cost is p^{theta/2}.
    memory_exponent: >-
      M^{1/2} in meet-in-the-middle form, or O(1) at the same time exponent in the rho
      form. Both are reported, as the claims-and-verification rules require memory be
      stated beside time.
    hidden_cofactor: >-
      THE LIFT. Connecting relations among sections to an externally specified target
      point requires lifting that point into the surface, at a probability this lane has
      already measured as order p^{-3}. That factor dominates everything else here and is
      stated so no reader can mistake the cost identity for an attack cost.
    claim_kind: constant_factor
    claim_kind_note: >-
      Deliberately the weakest label. No improvement of any kind is claimed by this
      record; the block is filled only to state what the measured quantity would bear on
      if it moved, and to keep the lift's p^3 factor on the record beside it.
  heuristic_assumptions:
    - id: HEUR-XEDN-40037f-1
      formal_statement: >-
        For surfaces in the frozen family, the median over good fibres t_0 of
        M_{t_0}/N_{t_0} equals 1 - i.e. n >= 2 specialised sections generically generate
        the full group. Quantifiers: for all surfaces in the frozen family, over the
        uniform choice of good t_0 in F_p, for n >= 2.
      random_model_justification: >-
        Two or more uniform elements of a finite abelian group generate it with
        probability bounded below by a constant depending on the group's rank; for a
        cyclic group the failure probability is controlled by its smallest prime factor.
        SECTIONS ARE NOT UNIFORM - they come from a rank-at-most-8 lattice on selected
        surfaces - which is precisely why this is a heuristic and not a theorem, and why
        the matched-random null exists.
      supporting_results:
        - >-
          Elementary counting for cyclic groups; the structure theorem for E(F_p) as a
          product of at most two cyclic factors. RECALLED, standard, not cited to a read
          source here and not relied on as authority.
      validation_experiment_ids:
        - EXP-XEDN-78f1e9
      falsification_condition: >-
        Median M/N below 1 on any IDENTIFIABLE subfamily - identifiable meaning specified
        by a public property fixed before the run. This is the falsification the record
        MOST WANTS to see, because it is the only one that would move an exponent, and
        saying so explicitly is the guard against the hypothesis being written to survive.
    - id: HEUR-XEDN-40037f-2
      formal_statement: >-
        The specialised sections behave, with respect to the order of the subgroup they
        generate, like n uniformly random points of E_{t_0}(F_p): the section-derived and
        random-derived M/N distributions coincide at every fibre, matched on n and on the
        group.
      random_model_justification: >-
        None beyond the homomorphism argument - the image of a small independent set has
        no obvious reason to be in special position. This is the assumption whose failure
        would reopen the relation-source question with a measured effect size, and it is
        measured directly rather than argued.
      supporting_results: []
      validation_experiment_ids:
        - EXP-XEDN-78f1e9
      falsification_condition: >-
        The section-to-random ratio of median M/N is systematically below the declared
        threshold over the declared number of matched pairs. The surface contributes real
        structure beyond n group elements and the lane reopens.
  structural_ingredients:
    - description: >-
        Specialisation as a group homomorphism on smooth fibres, and the structure of
        E(F_p) as a product of at most two cyclic factors.
      citation: null
      provenance: recalled
      verified_by: >-
        NOT VERIFIED against any read source. Both are standard and both are exercised
        directly by the instrument at toy p, which is the only status they are given here.
        In particular, the number-field specialisation intuition DOES NOT APPLY over a
        finite constant field - sigma maps a free group of rank up to 8 into a group of
        order about p and cannot be injective - and getting that backwards would invert
        the record, so it is stated explicitly.
      role: the map whose image order is the measured quantity
    - description: >-
        The lift probability of order p^{-3} for this lane, already measured internally.
      citation: null
      provenance: internal
      verified_by: >-
        Cited only as the ceiling this record charges against; not re-derived here and not
        used to support anything.
      role: the dominating cost factor stated so the identity is not mistaken for an attack
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        median M_over_N per surface, over all good fibres
      direction: different
      minimum_effect: >-
        FORCED VALUE 1, pre-registered. Mass below 1 is expected only at 1/k for small k,
        traceable to a non-cyclic group or to divisible sections, both of which the
        matched-random null shares. A median below 1 on an identifiable subfamily is the
        primary falsifier and the only exponent-relevant outcome available.
    - metric: >-
        section_to_random_ratio - median M/N for specialised sections divided by median
        M/N for n uniformly random points at the same fibre, matched on n and on the group
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.0 within sampling noise, predicted before the run. Declared
        decision rule: a mean ratio below 0.8 over at least 50 matched pairs is a genuine
        surface-specific signal and reopens the relation-source question with a measured
        effect size.
    - metric: >-
        subgroup_order_fixture - M returned on a fibre with known group order and known
        generators
      direction: different
      minimum_effect: >-
        EXACT equality with the known subgroup order, integer for integer. POSITIVE
        CONTROL with a forced value; a failure means no M distribution is reportable.
    - metric: >-
        divisibility_control - measured M after replacing each specialised section by k
        times itself, for k in a declared set
      direction: lower
      minimum_effect: >-
        M must fall by a factor of at least k, exactly and by construction. SECOND
        POSITIVE CONTROL: if M does not move when the image is deliberately pushed into a
        known subgroup, the instrument is not measuring a subgroup order and NO negative
        result may be reported from any arm.
    - metric: >-
        group_structure_share - fraction of good fibres with non-cyclic E_{t_0}(F_p), and
        the distribution of the smaller invariant factor
      direction: different
      minimum_effect: >-
        No pre-registered value; this is the arithmetic explanation channel for depressed
        M/N and is measured so that (b) can be separated from (a). It must be reported
        per fibre rather than aggregated.
    - metric: >-
        rho_baseline_comparison - measured meet-in-the-middle cost of finding a K-vector
        without discrete logarithms, beside sqrt(N) on the same fibre, same units
      direction: different
      minimum_effect: >-
        Expected no better than the rho baseline at M ~ N. A relation source not compared
        against rho on the same instance has not been costed, and the comparison is
        required rather than optional.
  test_boundary:
    instances: >-
      Every good fibre t_0 of every surface in the frozen censused family, at each prime
      in the declared ladder; plus matched sets of uniformly random points at the same
      fibres.
    parameters:
      primes: >-
        A ladder from p <= 1009 (exhaustive discrete logarithm) up to about p ~ 10^5
        (baby-step giant-step), with the upper end set by termination inside the per-run
        budget.
      n: 2 through 8, with independence certified per cell
      matched_pairs: at least 50 per (surface, fibre, n) cell for the random-points null
      divisibility_k: a declared set of k values for the second positive control
    implementation: >-
      Pure Python with numpy; no SageMath, which is absent from this container. Short
      Weierstrass arithmetic over F_p, baby-step giant-step discrete logarithm, exact
      integer subgroup-order computation. The frozen section enumerator already committed
      in this lane is reused unchanged.
    budget:
      total_cpu_hours: 10
      maximum_runs: 30
  falsification_conditions:
    - >-
      Median M/N is systematically below 1 on an identifiable subfamily - identifiable by
      a public property fixed before the run. C1 and C3 are FALSIFIED, the per-relation
      cost falls below p^{1/2} there, and that subfamily is the successor object. This is
      the outcome worth running the experiment for and it is the one the hypothesis does
      not expect.
    - >-
      The section-to-random ratio is systematically below the declared threshold. C2 is
      FALSIFIED: the surface contributes structure beyond n group elements. Routed to
      independent adversarial review before any promotion, and NOT written as a
      breakthrough at toy scale.
    - >-
      Either positive control fails - the subgroup-order fixture, or M failing to fall
      when the image is deliberately pushed into a known subgroup. Nothing may be reported
      from any arm.
    - >-
      A depression is found but is fully explained by non-cyclic groups or divisible
      sections, i.e. the matched-random null shows the same depression. C1 is confirmed
      rather than refuted, and the apparent signal is arithmetic rather than geometric.
    - >-
      Cells cannot be certified independent in sufficient number. The fibre-specific class
      collapses onto the generic one and the experiment measures the wrong object; the
      shortfall is reported rather than absorbed.
  interpretation_limits:
    - >-
      Toy scale. p at most about 10^5 is not cryptographic scale and no outcome supports,
      weakens or bears on any claim about a deployed curve (AGENTS.md rule 4).
    - >-
      A confirming outcome does NOT close the lifting relation-source route. It supplies a
      named obstruction - the search box has volume M independent of dimension - with
      forward guidance, namely families with small M, and it specifically does not license
      any blanket closure sentence.
    - >-
      A confirming outcome does NOT retract, weaken or contradict any completed XEDN
      record. Those measured a different object correctly. Narrowing their claim boundary,
      if warranted, travels as a superseding record under a new id and only by the
      Coordinator.
    - >-
      Toy-scale discrete logarithms are an INSTRUMENT. No cost statement may be derived
      from the instrument's own runtime; cost statements come from the box volume alone.
    - >-
      The surfaces are a selected population. The matched-random null controls for that in
      the RATIO and not in any absolute statement, and no absolute statement about
      rational elliptic surfaces is licensed.
    - >-
      No status change to any existing record is proposed or implied.
  prior_evidence_refs:
    - RQ-XEDN-002
    - IDEA-20260805-887d67
    - H-XEDN-2945b2
  distinguishable_outcomes:
    - outcome: >-
        Both positive controls pass; median M/N is 1 on every surface; the
        section-to-random ratio is 1 within noise over at least 50 matched pairs per cell;
        every sub-unit mass is explained by non-cyclic groups or divisible sections shared
        with the null.
      means: >-
        SUPPORTS the hypothesis. M is generically full, the per-relation cost is p^{1/2}
        at best, and the lane has no exponent left in it by this route. Next decision:
        record the obstruction with its measured quantity, units and scope, file the
        successor question (the distribution of group orders and subgroup structure along
        a fibration) as an ordinary proposal, and do NOT write any blanket closure sentence.
    - outcome: >-
        Controls pass and an identifiable subfamily has median M/N below 1 by the declared
        margin, not shared by the matched-random null.
      means: >-
        FALSIFIES C1 and C3. This is the only exponent-relevant outcome in the lane. Next
        decision: replicate on a second prime and a disjoint surface set, route to
        adversarial review with a full cost accounting INCLUDING the p^3 lift, and claim
        nothing beyond the measured theta at toy scale.
    - outcome: >-
        Controls pass and the section-to-random ratio is below the declared threshold while
        median M/N is 1.
      means: >-
        FALSIFIES C2 specifically. Sections are in special position in a way that does not
        depress the median order - a real structural signal whose consequence is unclear.
        Next decision: characterise the effect before costing it; do not convert it into a
        cost claim.
    - outcome: >-
        A positive control fails, or independence cannot be certified, or the larger primes
        time out.
      means: >-
        NO EVIDENCE EITHER WAY. Instrument or infrastructure outcome (AGENTS.md rule 5).
        Next decision: return to the Executor with the concrete defect; a censored prime is
        recorded as censored, never as a measured distribution.
