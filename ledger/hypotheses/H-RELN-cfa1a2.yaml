    "statement": "Test every source M1–M6 on the full declared toy ladder, retaining both repeated-point conventions and distinguishing the source fixed-size Janson assertion from a justified Bernoulli comparison.",
    "mechanism": "DERIVED IN-RECORD; every step is elementary and checkable by hand. (1) Prime order forces the x-fibres to be exactly {P, -P} and R/2 to exist. (2) Writing every point as [j] R' turns the sign-free condition P_1 + P_2 = R into e_1 j_1 + e_2 j_2 = 2 mod N, a linear condition on labels, so the incidence structure is a Cayley-type graph on Z/N modulo negation: the quotient of the N-cycle Cay(Z/N, {+-2}) by the reflection j -> -j, with the vertex 0 (the point O) deleted. The quotient of a cycle by a reflection through a vertex is a path; deleting the reflected vertex 0 leaves a path whose ends are the fixed class 1 (loop: 2 = 1 + 1) and the class 2 (its other neighbour was 0). (3) Counting independent sets of a path is the Fibonacci-type identity C(n' - B + 1, B). (4) Uniformity of V over B-subsets of x-classes is the protocol's own sampler model; nothing about the curve enters after (1). The theorem is therefore a statement about the additive group Z/N seen through the 2-to-1 map to x-classes, and IDEA-20260807-0ff796's isomorphism E -> C_R is its geometric form; here it is used for the minimum (does any decomposition exist), which the mean of 0ff796 and KN-FIND-007 does not determine.",
