# =============================================================================
# H-CERTBIN-151be9 -- HOLD-X11 / U-LABEL constructive arm: Z/4 leg-label
# filter (pi_4) on cofactor-4 Koblitz toys. Specified from
# IDEA-20260926-ae8f0a under RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-c9afe0.
#
# HOLD-X11 (DEC-20260928-63addc; DEC-20260929-7257b2 U-LABEL arm after
# IDEA-20261001-39014f / EXP-BINSTD-f58be3). Shares H1 metric pointer with
# IDEA-20261001-5628bc; inherits U-LABEL design conditions, not a proof.
# ZERO RUNS in this design packet. No AUXIN. No Bedrock. No curve attack /
# exponent claim. Claim tier: measurement / attempt-mix instrument.
# =============================================================================
hypothesis:
  id: H-CERTBIN-151be9
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-ae8f0a
  experiment_id: EXP-CERTBIN-ef3911
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-c9afe0
  status: approved
  proposed_by: coordinator
  title: >-
    On a cofactor-4 Koblitz toy the Z/4 leg label pi_4 removes a by-coset
    unsatisfiable share beyond pi_2 (E-COSET) or is subsumed by pi_2
    (E-SUBSUMED); both are no-ops on a cofactor-1 null and under a random
    two-bit label; at most 2 bits, no ECDLP exponent

  statement: >-
    CLAIM (measurement / attempt-mix instrument; HOLD-X11; NO ATTACK).
    Setting: binary Koblitz-shaped curves over F_{2^n}, n odd prime in
    [17,41]; primary cell RC-1 (n=17, h=4, #E=4*32603, cyclic Z/4 2-Sylow
    verified in-run); m=2, l=9, V={deg<9}; cofactor-1 null over the same
    field. Let pi_2 : E -> E/2E = Z/2 be Tr(x)+Tr(a) and pi_4 : E -> E/4E
    = Z/4 refine it by one point-halving step. HYPOTHESIS: (A) pi_4 is a
    group homomorphism with pi_4 mod 2 = pi_2 (exact; verified on sampled
    points). (B) For every relation R = P_1+...+P_m with R in the odd-order
    subgroup C, sum_i pi_4(P_i) = 0 in Z/4 (exact; completeness). (C)
    Precomputing pi_4 on V and rejecting attempts whose fixed legs cannot
    complete the Z/4 sum removes a by-coset unsatisfiable share phi_4 on
    the h=4 cell; pi_2 alone removes phi_2; E-COSET iff CP95(phi_4) sits
    strictly above CP95(phi_2), else E-SUBSUMED. (D) On the cofactor-1 null
    both shares are exactly 0; under a random two-bit label of matched
    marginal the share is within CP95 of 0; a relabelled Z/4 x Z/l
    generic-group control matches the curve's share within CP95. (E)
    Point-halving cost per leg (field ops, success rate) is MEASURED, not
    assumed from the recalled O(1). CLAIM TIER: measurement. At most 2 bits
    of attempt-mix constant. NO exponent. NO ECC2K-130 break. NO Magma/
    Sage/AUXIN. Product-law ceiling: m=3 free-oracle floor stays above rho
    (KN-FIND-aa2efc, unreviewed, stated as such).

  mechanism: >-
    OBJECT FRAME. Representation R1 (curve point and its Z/4 coset in the
    cyclic 2-Sylow). Operation set Sigma: translation by factor-base
    elements (Class I) refined by the homomorphism pi_4. Tracked object:
    the Z/4 coset label of a leg — a lossy projection of the full group
    element onto S=Z/4. TRICHOTOMY: PARTIAL-ACTION (coset partition of the
    composite-order group; trivial on prime-order targets by Lagrange,
    IDEA-20260922-153a90). LOSSY-PROJECTION TEST: P |-> pi_4(P) discards
    |C|=l elements per coset, is Sigma-compatible (homomorphism), and is
    not a change of coordinates. WHAT IS NEW versus cedd2f/1b16d7/39014f:
    the level-2 bit, the Z/4 sum constraint on legs, the E-SUBSUMED
    question, and the cofactor-1 + random-label + generic-group controls.
    Charged stage: relation collection / per-attempt mix, not the solve
    exponent.

  assumptions:
    - >-
      Primary: RC-1 curve (n=17, f as in EXP-CERTBIN-e94b27, A=97044,
      B=126251, #E=4*32603); m=2, l=9, V={deg<9}. 2-Sylow cyclic Z/4
      verified in-run (exactly one rational order-2 point). Null: a
      cofactor-1 Koblitz-shaped curve over the same field, order-verified
      in-run.
    - >-
      pi_4 = pi_2 plus one point-halving step per leg; failed halvings are
      their own stratum, never counted as refutations
      (IDEA-20260922-153a90 confounder).
    - Satisfiability decided by the enumeration/root-finding oracle, never by a closure.
    - >-
      OFF-LIMITS: F2 family; F6 only as the named quotient pi_4; V inside
      KN-OPEN-020's implicit-membership class; not escaped.
    - >-
      U-LABEL (EXP-BINSTD-f58be3 / IDEA-20261001-39014f) design conditions
      are inherited as pointers, not proofs; 5628bc H1 is a shared metric
      pointer only.

  heuristics:
    - id: H1
      statement: >-
        (Coset equidistribution.) Factor-base legs are equidistributed over
        the four Z/4 cosets up to o(1), so a fixed (m-1)-tuple completes the
        Z/4 sum for a 1/4 fraction of single legs (predicted by-coset share
        ~3/4 at pi_4, ~1/2 at pi_2 among coset-relevant attempts).
      rigorous_support: >-
        pi_4 is a surjective homomorphism onto Z/4, so fibres in the full
        group have equal size l; the heuristic is only that subspace V
        samples cosets near-equally (checkable by labelling V with no
        targets).
      falsification_condition: >-
        Largest absolute deviation of any coset count from |V|/4 exceeds
        the Stage-0 disclosed band (default: > |V|/16) on the primary cell.
      validation_plan: >-
        SAMPLE pi_4 labels of all of V for l in {6,7,8,9} on RC-1; COMPARE
        four coset counts to |V|/4; TAIL = largest deviation. TRANSFER: none
        to n=131.

  heuristic_note: >-
    Homomorphism and Z/4 sum constraint are exact. Point-halving cost is
    measured. H1 concerns only coset balance of V.

  predictions:
    - metric: by-coset unsatisfiable share removed by pi_4 vs pi_2 on h=4 cell (fractions, CP95)
      direction: different_or_same
      minimum_effect: >-
        E-COSET iff CP95 lower(phi_4) > CP95 upper(phi_2); E-SUBSUMED iff the
        two intervals overlap.
    - metric: by-coset share on cofactor-1 null and under random two-bit label
      direction: same
      minimum_effect: exactly 0 on the null; within CP95 of 0 for the random label.
    - metric: point-halving cost per leg (field operations; success rate)
      direction: report
      minimum_effect: >-
        Measured; recalled O(1) confirmed only if cost scales with field ops
        alone and success rate is near 1/2 per level among attempted halvings.
    - metric: on-curve relations lost by the pi_4 filter (count)
      direction: same
      minimum_effect: exactly 0 (completeness); any loss falsifies the filter.
    - metric: generic-group Z/4 x Z/l control share vs curve share
      direction: same
      minimum_effect: agree within CP95 (group-structure claim).

  test_boundary:
    curves: >-
      RC-1 (h=4, n=17) primary; one cofactor-1 null over F_{2^17}; optional
      second cofactor-4 curve with S=Z/2xZ/2 if constructible (tests |S|-only
      prediction of IDEA-20260922-e3048d). No deployed curve. No n=131 solve.
    arity: m=2 only under this card.
    factor_base: V={deg<9} on primary; matching dimension on null.
    targets: 200 odd-order subgroup targets from a fresh recorded seed.
    instruments: >-
      experiments/EXP-CERTBIN-e94b27/impl/curve.py (group law, x-lift)
      extended with pi_2/pi_4; oracles_rc1.py for satisfiability; by-coset
      classifier; direct curve-arithmetic verification. No closure engine.
    transfer: >-
      No transfer to ECC2K-130 beyond the product-law ceiling statement
      (at most 2 bits against a ~60-bit gap). No m>=3 claim.
    claim_tier: measurement

  falsification_conditions:
    - >-
      E-COSET falsified iff pi_4's by-coset removed share does not exceed
      pi_2's by more than CP95 width.
    - >-
      E-SUBSUMED falsified iff pi_4 removes a share strictly above pi_2
      (CP95-separated).
    - >-
      Homomorphism falsified iff pi_4(P+Q) != pi_4(P)+pi_4(Q) on any sampled
      pair, or pi_4 mod 2 != pi_2.
    - >-
      Filter falsified iff any on-curve relation is lost, or the cofactor-1
      null shows a nonzero by-coset share.
    - >-
      Group-structure reading falsified iff the relabelled Z/4 x Z/l control
      share disagrees with the curve beyond CP95.
    - >-
      H1 falsified iff coset imbalance of V exceeds the Stage-0 band on the
      primary cell.

  distinguishable_outcomes:
    - id: O-ECOSET
      label: E-COSET
      when: >-
        phi_4 CP95-separated above phi_2; null and random-label shares 0;
        generic-group control matches; completeness 0 lost; homomorphism holds.
      means: >-
        Level-2 bit is a real attempt-mix filter; corrected HOLD-O chain
        enumerated with measured level-2 contribution; hand corrected cost
        law forward. Still at most 2 bits; no ECDLP claim.
    - id: O-ESUBSUMED
      label: E-SUBSUMED
      when: >-
        phi_4 not CP95-above phi_2; null/random-label/completeness/homomorphism
        controls pass.
      means: >-
        Level-1 bit already captures removable coset structure; point-halving
        cost of the second bit is not repaid; measured obstruction to
        deepening past pi_2 at depth 2, cofactor 4 (answers 153a90 part C).
    - id: O-ARTIFACT
      label: O-ARTIFACT
      when: >-
        Null nonzero, generic-group control disagrees, any on-curve relation
        lost, or pi_4 not a homomorphism.
      means: Instrument or derivation broken; void the reading.
    - id: O-IMPEDIMENT
      label: O-IMPEDIMENT
      when: >-
        Infrastructure / dependency / budget abort (missing field lib,
        timeout, crash) before a decidable label.
      means: >-
        Never negative mathematical evidence (AGENTS.md rule 3); report and
        stop.

  proof_search_map:
    bottleneck: >-
      Whether level-2 refinement pi_4 removes a by-coset unsatisfiable share
      beyond pi_2 on a cofactor-4 curve, with a cofactor-1 null showing the
      filter is a no-op there.
    baseline_embedding:
      parameter_slice: >-
        RC-1 (h=4) is the exact primary cell; archived pi_2 = Tr(x)+Tr(a)
        is the baseline the pi_4 refinement is measured against.
      reproduction_check: >-
        Reproduce pi_2 coset assignment on archived RC-1 targets/legs; verify
        pi_4 refines it (pi_4 mod 2 = pi_2) on 10^3 sampled points by direct
        group arithmetic before any share is read.
    observation_collision:
      observable: >-
        Pair (pi_2, pi_4) per leg/target; by-coset unsat-reason class per
        attempt.
      distinct_preimage_search: >-
        Removed share under pi_4 could be (i) genuine Z/4 sum, (ii) pi_2
        alone, or (iii) size effect — separated by pi_2-only / pi_4 / random
        two-bit arms plus cofactor-1 null.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Z/4 coset label pi_4(P) as a two-bit precomputed leg attribute;
          per-attempt filter rejects fixed (m-1)-tuples that cannot complete
          sum to 0; completeness and soundness exact.
        predicted_gain: >-
          Up to 3/4 by-coset share at pi_4 / 1/2 at pi_2 on h=4; 0 on
          cofactor-1 null; at most 2 bits, immaterial against rho.
      - transform: observable_fiber
        proposed_object: pi_4 / pi_2 / random two-bit filters on h=4 and null.
        predicted_gain: Separates level-2 from level-1 and from size artifact.
    quantifier_order: >-
      Homomorphism FORALL P,Q exact; Z/4 sum on relations with target in C
      FORALL exact; empirical shares FOR the named cells with CP95.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the h=4 cell, pi_4 removes phi_4 of which pi_2 removes phi_2, at
        measured halving cost c per leg; on cofactor-1 null both are 0;
        removal <= 2 bits and does not move rho. Nothing about m>=3, F4, or
        ECC2K-130 cost beyond the product-law statement.
      nearby_object_control: >-
        Cofactor-1 null (must be no-op) and random two-bit label (same
        marginal, no group meaning); plus relabelled Z/4 x Z/l generic-group
        control.
    proof_obligations:
      - claim: pi_4 homomorphism and pi_4 mod 2 = pi_2 on sampled points
        responsibility: correctness
      - claim: leg Z/4 labels sum to 0 for every relation with target in C
        responsibility: correctness
      - claim: primary 2-Sylow is cyclic Z/4 (one rational 2-torsion)
        responsibility: baseline
      - claim: by-coset classifier is exact (not inferred)
        responsibility: correctness
      - claim: cofactor-1 null shows by-coset share exactly 0
        responsibility: scope
      - claim: point-halving cost per leg measured
        responsibility: runtime
    not_applicable_reason: null

  dominated_by: >-
    At the cell: oracle A and rho dominate; pi_4 changes a <=2-bit
    attempt-mix constant. At ECC2K-130: rho already reduces to the order-l
    subgroup; m<=3 rows closed by the product law. n/a (no attack claimed).

  sota_delta:
    time: >-
      Zero on ECDLP axes. Program-internal: HOLD-O chain enumerated with a
      measured level-2 contribution; 153a90 part C depth-2 open number
      answered at cofactor 4.
    memory: Zero.
    data_queries: Not applicable.

  claim_tier: measurement
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
