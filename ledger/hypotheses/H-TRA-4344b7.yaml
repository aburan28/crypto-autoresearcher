hypothesis:
  id: H-TRA-4344b7
  question_id: RQ-TRA-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-018769
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE. The exact coarse-grained transfer operator of the translation-by-P
    walk on E(F_p) at the same toy group orders n that EXP-TRA-001 used, built by
    exact enumeration of the group with no sampling, on cells indexed by
    (x-interval, sign of y) and on one deliberately non-symmetric interval
    family, compared against the x-interval cells of the committed run. Claim
    tier toy. NO ATTACK, NO EXPONENT, NO CRYPTOGRAPHIC-SCALE STATEMENT.
    THE CLAIM, IN TWO SEPARABLE PARTS.
    PART A, the load-bearing one. The exact reversibility recorded in EV-TRA-001
    - detailed-balance residual 2.5e-17 and max |Im lambda| 3.7e-16 across all 54
    operators - is a property of the PARTITION and not of the walk. On cells that
    distinguish P from -P the detailed-balance residual leaves the 1e-17
    numerical-zero floor by many orders of magnitude and max |Im lambda| leaves
    the 1e-16 floor, so the eigenvalue phases that DEC-20260718-007 describes as
    structurally destroyed are present.
    PART B, conditional on A and expected to fail. If phases appear, the
    localisation L(S,C) grows with n on the non-symmetric family at a fitted
    exponent above the 0.0195 measured for x-cells.
    A IS THE HYPOTHESIS'S CONTENT AND B IS ITS LONG SHOT. The honest prior
    carried by the parent proposal is 0.80 for reversibility loss, 0.65 for max
    |Im lambda| leaving the floor, and 0.10 for L growing - and the design is
    worth running because A is cheap and decides whether the committed barrier
    statement is general or partition-specific, not because B is likely.

  mechanism: >-
    The coarse transfer operator is built by pushing the translation-by-P walk
    forward onto a cell partition of the group. When the cells are unions of
    {Q, -Q} orbits, which an x-interval partition is by construction because x(Q)
    equals x(-Q), the coarse walk inherits a reversibility the walk itself does
    not have - the fold identifies the forward step with the backward step, so
    detailed balance holds for the coarse chain. Reversible operators have real
    spectra, so no eigenvalue carries a phase and the phase channel cannot
    localise k. That is the exact mechanism DEC-20260718-007 attributes the
    barrier to, and it is a statement about the cells.
    Cells indexed by (x-interval, sign of y), with y-sign well defined for short
    Weierstrass over F_p with p odd by taking the representative in
    [0,(p-1)/2), break the fold - the forward and backward steps land in
    different cells, so detailed balance need not hold and the spectrum may leave
    the real axis. Adding one deliberately non-symmetric interval family tests
    whether it is the sign coordinate specifically or fold-breaking generally
    that matters.
    The honest caveat, carried from the parent proposal rather than discovered
    later - this projection is only ONE BIT less lossy than the x-interval
    projection already tested. If character orthogonality rather than
    reversibility is what forces L to be O(1), the extra bit will not save
    localisation, phases will appear and L will stay flat. That outcome is a
    STRONGER and more general barrier statement than the one currently committed,
    which is why it is a first-class deliverable rather than a disappointment.
    The decisive step needs no sampling at all - it is exact linear algebra on a
    C by C matrix at toy n.

  assumptions:
  - >-
    The exact coarse operator is constructible at the toy n that EXP-TRA-001 used,
    since it already was for 54 cells there.
  - >-
    y-sign is well defined on the curve model used - it is, for short Weierstrass
    over F_p with p odd, taking the representative in [0,(p-1)/2). The convention
    is a choice and a different representative set is a different partition, which
    must be recorded as such.
  - >-
    High-precision or exact arithmetic is available for the eigenvalue
    computation, so that a measured imaginary part is not manufactured by
    conditioning. If it is not, that is instrumentation, not a result.

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical measurement of an exactly constructed finite matrix. No
      theorem, asymptotic bound, reduction or closure argument is proposed here.
      NOTE, and this is the reason the field is not simply omitted - the OUTCOME
      in which phases appear and L stays flat is a proof-oriented conclusion (a
      partition-independent barrier), and any attempt to promote that measurement
      into a general barrier statement is a new proof-oriented proposal requiring
      its own KN-TECH-080 map before approval. This experiment may supply the
      measurement; it may not supply the theorem.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []

  asymptotic_claim: null

  heuristic_assumptions:
  - id: HEUR-TRAP-1
    formal_statement: >-
      The spectral behaviour of the exact coarse operator at toy n is
      directionally representative of larger n at matched ratio C/n, in the sense
      that the sign of the detailed-balance residual's departure from the
      numerical-zero floor and the sign of max |Im lambda|'s departure do not
      reverse as n grows at fixed C/n.
    random_model_justification: >-
      None offered. The same assumption underwrites EV-TRA-001's fitted growth
      exponent delta of 0.0195, so it is recorded here rather than left implicit.
    supporting_results: []
    validation_experiment_ids:
    - EXP-TRA-b39f46
    falsification_condition: >-
      The residual or max |Im lambda| is above the floor at the smallest n and at
      the floor at the largest n, at matched C/n. The trend then reverses within
      the tested range and no toy-n spectral reading may be extrapolated at all.

  structural_ingredients:
  - description: >-
      Coarse-graining a group walk onto a cell partition and the resulting
      Perron-Frobenius / transfer operator, with detailed balance as a checkable
      property of the constructed matrix.
    citation: KN-TECH-017
    provenance: internal
    verified_by: In-repo technique entry, read directly.
    role: construction and diagnostic
  - description: >-
      The fold argument recorded in DEC-20260718-007 - for negation-symmetric
      x-interval partitions there are no eigenvalue phases at any budget.
    citation: DEC-20260718-007
    provenance: internal
    verified_by: >-
      In-repo committed decision record, read directly. It is the statement under
      test, not an authority relied on.
    role: the prediction this hypothesis contradicts on non-symmetric cells

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: >-
      detailed-balance residual of the exact coarse operator on
      (x-interval, sign of y) cells
    direction: higher
    minimum_effect: >-
      Any value many orders of magnitude above the 2.5e-17 floor measured on
      x-cells. The contract fixes the threshold at 1e-10 before any run.
  - metric: max |Im lambda| of the exact coarse operator
    direction: higher
    minimum_effect: >-
      Leaving the 3.7e-16 numerical-zero floor at all. The contract fixes the
      threshold at 1e-10 before any run. That is the phase channel
      DEC-20260718-007 says is structurally destroyed.
  - metric: localisation L(S,C) on the non-symmetric family
    direction: different
    minimum_effect: >-
      L growing with n at any fitted exponent above the 0.0195 measured for
      x-cells would reopen the channel; L flat upgrades the barrier from
      partition-specific to general.

  test_boundary:
    instances:
    - >-
      The translation-by-P walk on E(F_p) for the same toy curves and group
      orders n used by EXP-TRA-001, at three values of n so a trend in the
      residual and in max |Im lambda| can be reported.
    parameters:
      cells: '(x-interval, sign of y), plus one deliberately non-symmetric interval family, plus the original x-interval family as regression'
      cell_count: 'compared at MATCHED C, not at matched interval count, since the sign coordinate doubles the cells for the same interval family'
      arithmetic: 'exact or high-precision; conditioning number reported per operator'
      n_values: 'three, spanning the range EXP-TRA-001 used'
    implementation: >-
      tra1_koopman.sage from experiments/EXP-TRA-001, extended to a
      (x-interval, sign) cell index and to one non-symmetric interval family.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 1.5
      maximum_memory_gb: 8

  distinguishable_outcomes:
  - outcome: >-
      Detailed-balance residual above 1e-10 and max |Im lambda| above 1e-10 on
      the non-symmetric cells, while the x-interval regression reproduces
      2.5e-17 and 3.7e-16 and the random-permutation null stays at its floor.
    means: >-
      The committed reversibility is an artifact of the cell choice, the phase
      channel exists on partitions that break the fold, and DEC-20260718-007's
      structural claim is scoped to negation-symmetric partitions rather than
      general. It is NOT an attack and NOT a localisation result - it is only the
      precondition KN-OPEN-010 asks about.
  - outcome: >-
      The operator stays reversible and the spectrum stays real on the
      non-symmetric cells, with the regression and positive control passing.
    means: >-
      The barrier is general rather than partition-specific. This hypothesis is
      wrong and the outcome is the PROVED-NEGATIVE direction KN-OPEN-010 says
      would be valuable - the committed scoped rejection strengthens rather than
      narrows, and the measured residual over both partition families is the
      recorded obstruction.
  - outcome: >-
      Phases appear but L(S,C) stays O(1) with a fitted exponent
      indistinguishable from 0.0195.
    means: >-
      Character orthogonality forces localisation regardless of the phase
      channel. This is a STRONGER and more general barrier statement than the one
      currently committed, and it says the phase channel is present but useless -
      which reallocates the whole lane's remaining budget away from partition
      engineering.
  - outcome: >-
      The random-permutation null gains phases at the same rate as the genuine
      translation walk.
    means: >-
      The effect is fold-breaking bookkeeping, not the walk. No reading of the
      signal arm is admissible and the deliverable is a corrected understanding
      of the diagnostic.

  falsification_conditions:
  - >-
    The detailed-balance residual stays below 1e-10 and max |Im lambda| stays
    below 1e-10 on the non-symmetric cells at all three n, with the x-interval
    regression reproducing the committed values.
  - >-
    Phases appear but the fitted growth exponent of L(S,C) on the non-symmetric
    family is not above 0.0195 at matched C, which falsifies Part B while leaving
    Part A intact.
  - >-
    The random-permutation null shows the same loss of reversibility and the same
    max |Im lambda| as the genuine walk.

  prior_evidence_refs:
  - EV-TRA-001
  - EXP-TRA-001
  - H-TRA-001
  - DEC-20260718-007
  - KN-OPEN-010
  - KN-TECH-017

  interpretation_limits:
  - >-
    Toy scale only. No cryptographic-scale claim, and no cost claim of any kind -
    EV-TRA-001's charged costs are 11,358 to 51,135 times sqrt(n), far worse than
    Pollard rho, and nothing here improves that.
  - >-
    A complex spectrum is not an attack. It is the precondition for the phase
    channel KN-OPEN-010 asks about and nothing more.
  - >-
    Any result is scoped to the two partition families actually built and to the
    y-sign convention actually used. A different representative set for y is a
    different partition.
  - >-
    This hypothesis does not dispute EV-TRA-001 inside that record's declared
    test boundary, which explicitly names non-negation-symmetric partitions as
    untested.
