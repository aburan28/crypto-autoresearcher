  title: >-
    The integer 127 has 6 doublings and 6 additions
  statement: >-
    The integer 127 has bit length 7. Its bits are 1, 1, 1, 1, 1, 1,
    and 1. Reaching it by doubling and adding uses 6 doublings and 6
    additions. Seven exceeds six by 1. Six equals six, so that gap
    is 0. The product of 7, 6, and 6 is 252. Their sum is 19. Two
    readings of the addition count are both 6, so that gap is 0 and
    their product is 36.
  mechanism: >-
    The proposal writes the counts 7, 6, and 6. This contract
    checks those integers. It does not add a curve point.
  assumptions: []
  proof_search_map:
    bottleneck: The gap between bit length 7 and addition count 6.
    baseline_embedding:
      parameter_slice: >-
        The counts 7, 6, and 6 in IDEA-20261003-ac4b14, read
        2026-10-04. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 127. The other counts the
        doublings and additions. They must agree that the counts
        are 7, 6, and 6.
    observation_collision:
      observable: The addition count 6 and the product 252.
      distinct_preimage_search: >-
        Reporting the addition count as 7 drops the gap against
        the bit length. Two readings of the addition count make
        that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The counts 7, 6, and 6.
        predicted_gain: Integer counts. No curve addition.
    quantifier_order: >-
      The bit length 7 comes first, then the doubling count 6,
      then the addition count 6, then the nearby gap 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The counts 7, 6, and 6. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the addition count. Both are 6, and the gap is 0.
    proof_obligations:
      - claim: The bit length of 127 is 7.
        responsibility: correctness
      - claim: The doubling count is 6 and the addition count is 6.
        responsibility: correctness
      - claim: The nearby gap is 0 and the nearby product is 36.
        responsibility: scope
    not_applicable_reason: null
