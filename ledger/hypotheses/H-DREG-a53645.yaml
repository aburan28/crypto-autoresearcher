hypothesis:
  id: H-DREG-a53645
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  derived_from_idea: IDEA-20260805-2dc8de
  status: proposed
  added: '2026-09-04'

  statement: >-
    SCOPE. The FIVE COMMITTED D = 5 deficit cells of GOAL-DREG-001 on the boolean
    chained Semaev system at m = 3, t = 3, ti = 0 over GF(2), at n in
    {12, 15, 17, 18, 21}, together with the reference quantities sr_pred(n,5),
    ncols(n,5), sum_{k<=5} h_k(n) and h_5(n) reconstructed from the lane's own
    frozen definitions. CLAIM TIER toy. NO NEW RANK IS COMPUTED, NO ATTACK, NO
    EXPONENT, NO PRIME-FIELD TRANSFER, NO ECDLP HARDNESS STATEMENT, AND NO STATUS
    CHANGE FOR H-DREG-001, H-SIG-001 OR GOAL-DREG-001 IS PROPOSED OR IMPLIED.

    THE HYPOTHESIS, IN FIVE CHECKABLE PARTS. Each is independently falsifiable and
    each can come out the other way.

    (V0) THE REFERENCE MODEL IS THE LANE'S OWN. sr_pred(n,D) = N(nb,D) -
      sum_{k<=D} h_k^+, with h_k the coefficients of
      H_n(z) = (1+z)^{nb} (1+z^2)^{-n} (1+z^3)^{-n} and nb = n + 3*ceil(n/3),
      reproduces EVERY committed reference integer this lane has recorded. This is
      the precondition for everything below: a normalisation computed against a
      reconstruction that is NOT the lane's convention is arithmetic about a
      different object.

    (V1) THE SEQUENCE IS A SEQUENCE, OR IT IS NOT. Each of the five committed
      deficits resolves to a committed rank, a seed, a degree D, an instrument
      version and an artifact path, under ONE comparable convention. This is the
      most likely single failure in the whole design and its failure is itself the
      deliverable: two or more unresolved, or resolving to different D, different
      instruments or incomparable conventions, means no monotonicity statement of
      any kind may be made from these numbers - INCLUDING THIS HYPOTHESIS'S OWN.

    (V2) THE RAW DECISION VARIABLE IS NOT MONOTONE. Over the five resolved rungs
      the raw deficit sequence does not increase at every step; specifically
      deficit(15) > deficit(17). RQ-DREG-001's departure criterion, "a deficit that
      grows with n", is therefore not satisfied as literally stated by the data
      already committed.

    (V3) EVERY SCALE-FREE VERSION SAYS THE OPPOSITE. deficit/sr_pred(n,5),
      deficit/ncols(n,5), deficit/sum_{k<=5} h_k(n) and deficit/h_5(n) are STRICTLY
      DECREASING at every resolved rung, including the off-lattice rung n = 17.
      Four independent denominators agree with each other and disagree with the raw
      criterion.

    (V4) THE CRITERION'S BLIND SPOT IS LOCATABLE, NOT MERELY ASSERTABLE. On the
      graded synthetic family deficit_D(n) = c * h_D(n)^beta, beta in
      {0, 0.25, 0.5, 0.75, 1.0}, each candidate decision variable has a beta at
      which its verdict flips from "tracks the null" to "departure". Those flip
      points are measurable, and reporting them converts "the criterion is wrong"
      into "this criterion's detection threshold sits at beta = X".

    (V5) NO COMMITTED CELL MEETS THE CRITERION'S OWN DEGREE CLAUSE. Every committed
      cell of this goal sits at D in {5, 6}, while the semi-regular freeze degree
      phi_full(n) of the same systems is strictly larger at every one of those n.
      The clause "evaluated at D up to and including d_reg where reachable" has
      therefore been met at no rung, and the honest name for what the ladder
      currently contains is LOW-DEGREE RANK EXCESS, not d_reg.

    PRE-REGISTERED READING, AND WHAT IS DELIBERATELY NOT CLAIMED. The hypothesis
    that survives is about the DECISION VARIABLE, not about the answer. A
    collapsing share is NOT proof that the deficit is an artifact, is not evidence
    that the goal should close, and is not a null verdict on RQ-DREG-001: a
    subleading effect at D = 5 can be leading at D near d_reg, which is precisely
    the regime a degree-of-regularity question is about. What is claimed is
    narrower and harder: that the sentence "a deficit that grows with n" cannot
    carry a decision, because on the committed data it is false as literally stated
    and, in the only reading under which it is true (endpoints only), it is true of
    a quantity whose share of the thing it exceeds is collapsing.

  mechanism: >-
    WHAT A DEFICIT IS, AND WHY THAT SETTLES WHAT IT MUST BE DIVIDED BY.
    rank_sem(n,D) = sr_pred(n,D) - deficit_D(n), and the cumulative Hilbert
    function of the quotient is N(nb,D) - rank, so
    sum_{k<=D} HF_sem(k) = sum_{k<=D} h_k^+ + deficit_D(n). A deficit is therefore
    not a free-standing integer: it is an EXCESS of the system's cumulative Hilbert
    function over the semi-regular one. The only well-posed question about an
    excess compared across a family is what FRACTION of the exceeded quantity it
    is, and that fraction is what no record in this goal has computed - every
    deficit in every checkpoint, every evidence record, and the goal's own
    criterion is a raw integer.

    WHY THE COMPARISON IS INCOMPARABLE AS CURRENTLY POSED. The ambient objects grow
    like C(nb,D), faster than n^D, while any departure grows at best like a low
    power of n. Two rungs whose reference quantities differ by an order of
    magnitude cannot be compared by their raw excesses: the same integer deficit
    means a far smaller departure at the later rung. This is not a preference among
    denominators; it is the observation that the projection
    (whole measurement record) -> (one integer) -> (an order relation on five
    integers) discards exactly the information needed for the comparison it is then
    used to make.

    WHY THIS IS THE CANONICAL ARTIFACT TEST RUN IN REVERSE. The inventor protocol
    asks what a measured quantity should do as the parameter meant to destroy it
    increases, and treats failure to decay as the artifact tell. Here the parameter
    is n. A departure that is real and structural should hold a roughly constant
    SHARE of its reference; a finite-size effect should have a vanishing share. The
    raw criterion is blind to that distinction by construction, because it never
    forms the share. Making the share the observable is what makes the artifact
    test applicable at all.

    WHY NO COMPUTE IS NEEDED, AND WHERE THE REAL COST SITS. Every quantity above is
    a division of committed integers by integers reproduced from frozen
    definitions. The cost of this design is not arithmetic; it is PROVENANCE - two
    of the five deficits are, on the parent proposal's own account, read from a
    single summary line and not independently reproduced. The design therefore puts
    provenance resolution first and lets it end the line.

  assumptions:
    - >-
      NUMBERS INHERITED, NOT VERIFIED HERE. The specific integers asserted by
      IDEA-20260805-2dc8de - the five deficits, the sr_pred / ncols / sum-h / h_5
      columns, the four ratio columns, and the phi_full sequence - are recorded in
      this hypothesis as CLAIMS OF THE PARENT PROPOSAL. This Coordinator has NOT
      independently re-derived any of them. They are the experiment's Stage 2
      output, listed beside the reproduced value, and no decision may rest on them
      until that stage runs.
    - >-
      That the five deficits are the sem-versus-sr_pred quantity at D = 5 for
      t = 3, ti = 0, and that they are mutually comparable. This is (V1) and it is
      tested, not assumed.
    - >-
      That the reconstructed sr_pred is the reference the deficits were actually
      taken against. This is (V0) and it is tested against committed integers as a
      frozen regression fixture, not assumed.
    - >-
      That a monotonicity or trend statement over five points is worth making at
      all. Five points is thin, single-seed at most rungs, and the design's answer
      is to report the seed structure honestly and to refuse a quantitative growth
      claim rather than to manufacture one.

  proof_search_map:
    bottleneck: >-
      Whether the reconstructed reference model (sr_pred, ncols, sum h, h_D) IS the
      convention the committed deficits were taken against. If it is not, every
      ratio column is a ratio to a quantity this lane never used, and the whole
      finding evaporates without anyone being able to see it from the numbers - the
      one way this design fails silently. That is why (V0) is a blocking stage and
      not a robustness extra.
    baseline_embedding:
      parameter_slice: >-
        The committed integers this lane has already recorded for the SAME
        construction - the sr_pred values at small n and D, the nrows values, and
        any committed rank from which a deficit was formed - are the exact boundary
        at which the reconstruction and the incumbent convention must agree.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE. The reconstruction must reproduce, exactly and
        without tuning, every committed reference integer named in the Stage 0
        declaration of EXP-DREG-1db92b. A single mismatch halts the contract before
        any ratio is emitted.
    observation_collision:
      observable: 'the integer deficit_D(n) attached to a rung'
      distinct_preimage_search: >-
        THE COLLISION IS NAMED AND IT IS THE REASON (V1) COMES FIRST. The same
        integer can arise as (a) sr_pred(n,D) minus a full-column sem rank at that
        D under this instrument, (b) the same difference at a DIFFERENT D, (c) the
        same difference under a different support convention or instrument version,
        or (d) a support-confounded difference of the kind this lane already
        quarantined at n = 12, D = 6. Four preimages, one observable. The
        separating conditions are the resolved (rank, seed, D, instrument, path)
        tuple per cell and the admitted/quarantined status of that cell; a
        normalisation applied without all of them normalises an unidentified
        quantity.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the raw integer deficit_D(n) with the scale-free share
          deficit_D(n) / R(n), for R in {sr_pred(n,5), ncols(n,5),
          sum_{k<=5} h_k(n), h_5(n)}, as the decision variable of RQ-DREG-001.
        predicted_gain: >-
          A quantity that is comparable across an n-indexed family of growing
          ambient dimension, and to which the standard decay-versus-persistence
          artifact test can be applied at all. No exponent, no attack, no algorithm.
      - transform: observable_fiber
        proposed_object: >-
          Hold the verdict fixed and vary the decision variable across the raw
          integer and the four shares, over the graded synthetic family
          deficit = c * h_D^beta, exhibiting which variables flip where.
        predicted_gain: >-
          The detection threshold of each candidate variable, located as a beta
          rather than asserted as a defect.
    quantifier_order: >-
      CLAIMED. FOR EACH of the five committed D = 5 cells that RESOLVES under (V1),
      THERE EXIST the four reference quantities computed from the frozen
      definitions, and the resulting four ratio columns are strictly decreasing
      across the resolved rungs in increasing n. NOT CLAIMED, and it is the
      dangerous stronger reading: that the share continues to decrease at n beyond
      21, that it decreases at D other than 5, or that a decreasing share implies
      the deficit is an artifact. None of those follows and each is refused
      explicitly.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the boolean chained Semaev system at m = 3, t = 3, ti = 0, at the
        committed D = 5 cells that resolve to a rank, a seed and an artifact path,
        the raw deficit sequence has the reported monotonicity and the four named
        shares have the reported monotonicity; and the candidate decision variables
        have the reported verdicts on the all-zero null, the constant-share positive
        control and the graded family." It certifies NOTHING about the truth of
        RQ-DREG-001's decision target, nothing at unresolved cells, nothing at
        D other than 5, and nothing at n beyond 21.
      nearby_object_control: >-
        The ALL-ZERO NULL SEQUENCE - the full-support random null whose deficit is
        forced to 0 at every rung - is the nearby object on which every candidate
        decision variable's verdict is known in advance. A candidate that calls the
        all-zero sequence a departure is disqualified on the spot, and a badly
        formed ratio with the deficit in the denominator is eliminated by division
        by zero. The control can fail, which is the point of it.
    proof_obligations:
      - claim: The reconstruction reproduces every committed reference integer exactly.
        responsibility: baseline
      - claim: Each cited deficit resolves to a rank, a seed, a D, an instrument version and a path, or is dropped.
        responsibility: interface
      - claim: The four ratio columns are computed only for resolved cells, from reproduced references.
        responsibility: correctness
      - claim: Control verdicts are committed before the real deficits pass through the same code.
        responsibility: strictness
      - claim: No conclusion is extended beyond the resolved cells, D = 5, or n <= 21.
        responsibility: scope

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. This hypothesis proposes no algorithm, moves no exponent,
    approaches no point on the ECDLP frontier and compares against no baseline. It
    is an audit of a decision variable. What it bears on is whether a future
    exponent-facing claim out of GOAL-DREG-001 would rest on a comparison that
    survives normalisation.

  heuristic_assumptions:
    - id: HEUR-DREG-NORM-1
      formal_statement: >-
        FOR an n-indexed family of polynomial systems whose ambient Macaulay
        dimension at fixed degree D grows without bound in n, a departure from
        semi-regularity that is STRUCTURAL - as opposed to a finite-size effect -
        holds a non-vanishing share of the reference quantity it exceeds; that is,
        limsup_n deficit_D(n) / R(n) > 0 for R the semi-regular reference at the
        same (n, D).
      random_model_justification: >-
        NOT DISTRIBUTIONAL AND NOT A THEOREM, and it is recorded as a numbered
        heuristic precisely so that it cannot be used as one. It is the standard
        reading of a finite-size effect versus a structural one, and it is what the
        inventor protocol's decay test asks of any reported signal. IT COULD BE
        FALSE FOR A THRESHOLD PHENOMENON that switches on only at D near d_reg -
        which is exactly the case RQ-DREG-001 cares about - and that possibility is
        carried forward in interpretation_limits rather than argued away.
      supporting_results: []
      supporting_results_note: >-
        No citation is asserted. No source has been read for this statement by any
        agent in this program, so the honest support is empty and the graded
        synthetic control, not a citation, is what quantifies the heuristic's
        consequences.
      validation_experiment_ids: [EXP-DREG-1db92b]
      falsification_condition: >-
        A candidate decision variable built on the share classifies the
        constant-share positive control (beta = 1) as TRACKING, or classifies the
        all-zero null as DEPARTURE. Either shows the share is not the quantity that
        detects the phenomenon the goal exists to detect, and the heuristic's
        operational content fails.
    - id: HEUR-DREG-NORM-2
      formal_statement: >-
        FOR the five committed D = 5 cells, the reconstructed reference model
        (sr_pred, ncols, sum_{k<=5} h_k, h_5 from the frozen definitions) equals the
        reference model under which the committed deficits were formed.
      random_model_justification: >-
        Not distributional. It is an identification claim about this lane's own
        convention, and it is checkable exactly against committed integers rather
        than justified by a model.
      supporting_results: []
      supporting_results_note: >-
        The parent proposal reports recovering several committed integers this way.
        This Coordinator has re-derived none of them, so the entry is empty and the
        experiment's blocking Stage 1 is the support.
      validation_experiment_ids: [EXP-DREG-1db92b]
      falsification_condition: >-
        The reconstruction fails to reproduce any single committed reference integer
        named in the Stage 0 declaration. The model is then not the lane's
        convention and no ratio column may be emitted.

  structural_ingredients: []
  structural_ingredients_note: >-
    None. Every quantity is defined inside this program's own frozen definitions
    and committed records; no external theorem is imported, so there is no citation
    to provenance-mark and none is asserted.

  reduction_chain: null

  rerandomization: null

  predictions:
    - metric: >-
        provenance resolution status of each of the five committed D = 5 deficits -
        the count resolving to a (rank, seed, D, instrument version, artifact path)
        tuple
      direction: different
      minimum_effect: >-
        REPORTED, NOT PREDICTED, AND THE LINE CAN END HERE. Fewer than three
        resolved means the sequence is not a sequence and no monotonicity claim of
        any kind - including (V2) and (V3) - may be made. That outcome is the
        deliverable and is not a failure of the experiment.
    - metric: monotonicity of the raw deficit sequence over the resolved D = 5 rungs
      direction: different
      minimum_effect: >-
        NOT MONOTONE, specifically deficit(15) > deficit(17). Falsified if those two
        values resolve to different seeds, different D, or different instrument
        conventions, in which case they are not comparable and the claim is
        withdrawn rather than defended.
    - metric: >-
        monotonicity of deficit/sr_pred, deficit/ncols, deficit/sum_{k<=5} h_k and
        deficit/h_5 over the resolved rungs
      direction: lower
      minimum_effect: >-
        STRICTLY DECREASING in all four, at every resolved rung including the
        off-lattice n = 17. ANY ONE of the four failing to decrease falsifies the
        finding as stated and the analysis must then report all four without
        picking a denominator.
    - metric: verdict of each candidate decision variable on the all-zero null sequence
      direction: different
      minimum_effect: >-
        FORCED. Every candidate must return TRACKING on a sequence of exact zeros.
        Any candidate returning DEPARTURE is disqualified and is reported as
        disqualified rather than repaired.
    - metric: verdict of each candidate decision variable on the constant-share positive control
      direction: different
      minimum_effect: >-
        FORCED IN THE OTHER DIRECTION. At least one candidate must return DEPARTURE
        on deficit_D(n) = c * h_D(n). If NO candidate fires, the analysis is blind
        to the phenomenon the goal exists to detect and NOTHING is reported.
    - metric: >-
        beta at which each candidate variable flips its verdict on the graded family
        deficit_D(n) = c * h_D(n)^beta, beta in {0, 0.25, 0.5, 0.75, 1.0}
      direction: different
      minimum_effect: >-
        A located flip point per candidate, reported as an interval between adjacent
        beta values. A candidate with no flip point in [0,1] is either always-on or
        always-off across the whole family and is reported as such.
    - metric: >-
        degree shortfall phi_full(n) - D_measured at every committed cell of this goal
      direction: higher
      minimum_effect: >-
        STRICTLY POSITIVE AT EVERY COMMITTED CELL. Falsified by exhibiting a single
        committed cell at D >= phi_full(n), which would make (V5) wrong as stated.
    - metric: >-
        forced out-of-sample values of the four shares at n = 24 and n = 27, emitted
        before any rank at those n exists
      direction: lower
      minimum_effect: >-
        A number per denominator per n, frozen in the contract. These are the
        pre-registered out-of-sample tests and they are the ones that matter: a
        future measured share AT OR ABOVE the n = 21 value would break the decay and
        would be genuine evidence of departure under the corrected variable.

  test_boundary:
    instances: >-
      COMMITTED RECORDS ONLY. The five D = 5 deficit cells of GOAL-DREG-001 at
      n in {12, 15, 17, 18, 21} and the artifacts they were read from; plus
      SYNTHETIC control sequences constructed inside the contract (the all-zero
      null, the constant-share positive control, and the graded beta family). NO
      polynomial system is built and NO Macaulay rank is computed.
    parameters:
      m: 3
      t: 3
      ti: 0
      D: 5
      n_cells: [12, 15, 17, 18, 21]
      denominators: ['sr_pred(n,5)', 'ncols(n,5)', 'sum_{k<=5} h_k(n)', 'h_5(n)']
      graded_control_beta: [0.0, 0.25, 0.5, 0.75, 1.0]
      out_of_sample_n: [24, 27]
      new_ranks_computed: 0
    implementation: >-
      Python 3.11 with exact integer arithmetic only (no floating point in any
      decision path; ratios reported as exact rationals and as decimals to a
      declared precision). Reference quantities computed from the frozen
      definitions of H_n(z), nb and N(nb,D). Recorded through harness/runner.py.
    budget:
      wall_clock_seconds: 600
      total_cpu_hours: 0.5
      memory_gb: 8
      maximum_runs: 6

  distinguishable_outcomes:
    - outcome: >-
        PROVENANCE FAILS. Fewer than three of the five deficits resolve to a
        comparable (rank, seed, D, instrument, path) tuple.
      what_observing_it_would_mean: >-
        (V1) is FALSE and everything downstream is withdrawn, including this
        hypothesis's own (V2) and (V3). The deliverable is the resolution table
        naming exactly which cells are unresolvable and why, which is a genuine and
        useful result about the lane's evidence base, and it is CHEAPER to obtain
        than any of the alternatives.
    - outcome: >-
        RECONSTRUCTION FAILS. The reference model does not reproduce a committed
        reference integer.
      what_observing_it_would_mean: >-
        (V0) is FALSE. The denominators are not this lane's convention, no ratio may
        be emitted, and the deliverable is the exact mismatch at the named integer.
    - outcome: >-
        THE FINDING STANDS. Provenance resolves, the reconstruction reproduces, the
        raw sequence is non-monotone and all four shares strictly decrease.
      what_observing_it_would_mean: >-
        The decision variable currently on the record admits both verdicts on the
        same committed data, and four independent scale-free versions of it agree on
        the opposite verdict. THIS IS NOT A NULL VERDICT ON RQ-DREG-001. It is a
        finding that the criterion cannot carry a decision as stated, and its
        forward consequence is a Coordinator protocol_amendment choosing a decision
        variable BEFORE the ladder produces a verdict - not a status change.
    - outcome: >-
        THE SHARES DISAGREE. One or more of the four fails to decrease.
      what_observing_it_would_mean: >-
        (V3) is FALSE as stated. The choice of denominator is then itself
        load-bearing, all four are reported without picking one, and the honest
        conclusion is that the corrected variable is under-determined - which is a
        weaker but still decision-relevant finding.
    - outcome: >-
        THE CRITERION SURVIVES ON A RESTRICTED SEQUENCE. The on-lattice-only
        subsequence is monotone while the full five-point sequence is not.
      what_observing_it_would_mean: >-
        The raw criterion is salvageable if and only if it is restricted to
        on-lattice n, which RQ-DREG-001's text does not say. Both readings are
        reported side by side; neither is presented as the lane's convention without
        a Coordinator amendment saying so.
    - outcome: >-
        A COMMITTED CELL AT D >= phi_full(n) IS FOUND.
      what_observing_it_would_mean: >-
        (V5) is FALSE. The ladder has met the criterion's degree clause at that rung
        and that cell becomes the most valuable point in the goal, since it is the
        only place where the normalised question can be asked AT d_reg rather than
        below it.
    - outcome: >-
        NO CANDIDATE FIRES ON THE CONSTANT-SHARE CONTROL.
      what_observing_it_would_mean: >-
        The analysis is blind to the very phenomenon it claims to be measuring
        better. NOTHING IS REPORTED about the real deficits and the deliverable is
        the failed control - the ordering control exists so that this is discovered
        before the real numbers are seen, not after.

  falsification_conditions:
    - >-
      Two or more of the five deficits fail provenance resolution, or resolve to
      different D, different instruments, or incomparable conventions.
    - >-
      The reconstructed reference model fails to reproduce any committed reference
      integer named in the contract's Stage 0 declaration.
    - >-
      Any of the four normalisations fails to decrease across the resolved rungs.
    - >-
      A candidate replacement decision variable classifies the all-zero null as a
      departure, or fails to classify the constant-share control as one.
    - >-
      Some committed cell of this goal is at D >= phi_full(n).
    - >-
      The raw sequence turns out to be monotone across all five resolved rungs under
      one comparable convention, which falsifies (V2) directly.

  interpretation_limits:
    - >-
      NO STATUS CHANGE is proposed or implied for H-DREG-001, H-SIG-001 or
      GOAL-DREG-001, and NO completion criterion is edited by this hypothesis or by
      its experiment. Changing a criterion is a Coordinator protocol_amendment and
      is a separate, committed act (AGENTS.md rule 1). This record supplies the
      arithmetic such an amendment would need.
    - >-
      A COLLAPSING SHARE IS NOT PROOF THAT THE DEFICIT IS AN ARTIFACT. It is
      consistent with a real subleading structure, and a degree-of-regularity effect
      can be subleading at D = 5 and leading at D near d_reg. The forward guidance
      is explicit and is the opposite of closure: what would settle it is ONE cell
      at D >= phi_full(n) at any n, however small.
    - >-
      DEPRIORITISING OR CLOSING GOAL-DREG-001 ON THE STRENGTH OF THIS RECORD ALONE
      WOULD BE PREMATURE CLOSURE and is forbidden by docs/inventor-protocol.md. The
      design is built so that this cannot be read as closure: the corrected variable
      has a pre-registered out-of-sample value at n = 24 that CAN come out on the
      departure side, and the positive control exists precisely so a real departure
      remains detectable.
    - >-
      Toy scale, boolean, m = 3, t = 3, ti = 0, D = 5, n <= 21. Nothing here bears
      on prime-field ECDLP, moves any exponent, or touches the Pollard rho baseline.
    - >-
      Five points, mostly single-seed. No quantitative growth-rate or exponent
      estimate is licensed by this design, and the contract forbids emitting one.

  overlap_with_sibling_contracts:
    - >-
      WITH EXP-DREG-c208ae (H-DREG-9cd42c). Both read committed GOAL-DREG-001
      deficit-cell records, and they would otherwise duplicate the same provenance
      work. DIVISION OF LABOUR, DECLARED HERE SO NEITHER RE-ADJUDICATES THE OTHER:
      EXP-DREG-1db92b Stage 1 owns the provenance table for the D = 5 cells;
      EXP-DREG-c208ae owns the verbatim admitted-criterion extraction for the D = 6
      CTRL-B cell. Each consumes the other's artifact rather than recomputing it.
      THE CROSS-CHECK THAT CAN FAIL: both must agree on the identity of the
      n = 12, seed 2026 cell; a disagreement means one of the two is wrong and both
      results are held until it is resolved.
    - >-
      WITH EXP-DREG-620b15 (H-DREG-91be14, already drafted for IDEA-20260801-002).
      That contract MEASURES d_reg and gap(n); this one measures nothing and only
      normalises numbers already committed. They do not overlap in what they
      compute, but they do overlap in what they decide: if both are approved, the
      departure rule frozen in EXP-DREG-620b15 Stage 0 is a candidate decision
      variable that EXP-DREG-1db92b must include in its candidate set and put
      through the same null, positive and graded controls. That makes this contract
      a CONTROL ON THE OTHER'S DECISION RULE, and it must not be run in a way that
      re-scores EXP-DREG-620b15's data after the fact.

  prior_evidence_refs:
    - RQ-DREG-001
    - GOAL-DREG-001
    - IDEA-20260805-2dc8de
    - EV-DREG-004
    - EV-DREG-008
