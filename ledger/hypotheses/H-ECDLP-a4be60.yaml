hypothesis:
  id: H-ECDLP-a4be60
  question_id: RQ-ECDLP-002
  source_proposal: IDEA-20260902-c17bf6
  added: '2026-09-03'
  proposed_by: coordinator
  statement: >-
    SETTING. E/F_p, P of prime order n, G = <P>, and for R in G write x(R)
    for its x-coordinate lifted to the canonical integer interval [0, p).
    Define the THUE-MORSE statistic t(R) = (-1)^{s_2(x(R))}, s_2 the binary
    digit sum, and the RUDIN-SHAPIRO statistic r(R) = (-1)^{u(x(R))}, u the
    number of occurrences of the block 11 in the binary expansion. Both cost
    O(log p) bit operations, far less than one group operation. The
    observable is the one IDEA-20260815-f558e4 defines: the MAJORITY
    ADVANTAGE q_maj - 1/2 of the statistic under the group law on
    prime-order subgroups, together with its Fourier form, the largest
    coefficient A(v) = max over a in Z/n of |SUM_k v([k]P) e(ak/n)| / n of
    the statistic along the discrete-log coordinate. THE GAP: f558e4
    sub-result (E) pins every efficiently computable coordinate-derived
    statistic at the 1/s baseline within O(n^{-1/2}) up to the degree of the
    defining conditions; the triangle-inequality argument behind that phrase
    reaches exactly the statistics whose F_p spectral norm ||v_hat||_1 is
    polylog. For the digit family the composition is provably vacuous:
    Rudin-Shapiro's root-N property (RECALLED) forces a flat spectrum of
    order sqrt(p), and Gelfond's bound (RECALLED, exponent log 3 / log 4
    ~= 0.79) gives Thue-Morse norms up to p^{0.79}, so the pinning bound
    reads O(log p) -- vacuous. THE DIGIT FAMILY IS THE ONE CHEAP FAMILY FOR
    WHICH THE PROGRAM'S PROBABILISTIC-REGIME CLOSURE HAS NO PROOF AT ALL.
    THE CLAIM (H1, the heuristic under test). For the statistics t and r on
    prime-order subgroups of toy curves with n spanning at least a 6x range
    (the frozen ladder: six prime orders, 17-27 bits, span 1024x), the
    advantage A(v) and q_maj - 1/2 decay like n^{-1/2} and match the
    keyed-random null and the x-top-bit comparator within the pre-registered
    band of EXP-ECDLP-56ee42. CLOSURE READING: the Weil-scale ceiling of the
    probabilistic regime holds empirically for a family provably outside its
    proof reach. LEAD READING: an advantage flat in n, surviving the shuffle
    and the null, on either statistic, is an efficiently computable
    approximate-AP statistic in the sense of f558e4 (F). THE INSTRUMENT
    READING: the planted positives fail to separate, and nothing is read.
  mechanism: >-
    THE TRACKED OBJECT is the digit sign of the coordinate's integer lift, a
    one-bit lossy projection of the point, followed through the group law in
    the PROBABILISTIC regime: it cannot propagate exactly (df906f), and the
    question is the size of its majority advantage and of its Fourier
    coefficient along the discrete-log coordinate. The lossy-projection test
    is passed non-vacuously (one bit retained of log2 n, and the discard is
    the whole point), and it is applied in the modified probabilistic form
    that f558e4 and IDEA-20260901-b4e6eb use, with the same estimator so the
    numbers are comparable across the three records. WHY THIS IS NOT b4e6eb
    OR 84755b OR THE o2 LANE IN NEW NOTATION: b4e6eb measures p-adic digits
    of the canonical lift, whose degree gap is an UNKNOWN; this record's
    statistics are BINARY digits of the plain integer representative, for
    which the failure of the pinning is a THEOREM (spectral norm p^{0.39}
    measured in the o2 lane, sqrt(p) forced for Rudin-Shapiro). 84755b's
    panel has top bits, bottom bits and x mod m -- all bounded-spectral-norm,
    all inside the pinning -- and deliberately excludes digit sums. The o2
    lane measured digit statistics on the sum-compatibility observable with
    UNBALANCED statistics and got a marginal artifact (RT-EXP-1); this
    record measures the discrete-log observable with BALANCED statistics
    (the balance removing the artifact by construction, verified at design
    time: the Thue-Morse and Rudin-Shapiro partial sums over [0, p) are
    exactly +-1 at every frozen ladder prime) and carries the o2 lane's
    shuffle control forward as a blocking arm. STAGES (full detail in the
    contract): Stage 0 vacuity derivation plus computed spectral norms (hard
    gate); Stage 1 the exact estimator of f558e4 with the 284/529 frozen
    fixture gate; Stage 2 the blocking controls including the two planted
    positives -- the discrete-log parity (A(v) = 2/pi exactly, flat) and the
    Thue-Morse sign of the discrete log itself at the n^{-0.21} scale -- and
    the popcount-mod-4 diagnostic reproducing the o2 artifact; Stage 3 the
    measurement (P1, P2, P5 per arm and rung, before and after the
    matched-marginal shuffle, against 256 keyed-random replicates); Stage 4
    only if the LEAD branch fires, then stop and route to independent
    review.
  assumptions:
    - >-
      n prime and the subgroup completely enumerable, so q_maj and A(v) are
      computed EXACTLY and no estimator variance competes with the n^{-1/2}
      effect; this caps the ladder near 30 bits by design (the frozen ladder
      top is 27 bits for budget; the exact O(n log n) evaluation method keeps
      the top rung feasible).
    - >-
      The integer lift is the canonical representative in [0, p); a
      different lift (balanced representatives in (-p/2, p/2)) changes the
      statistic and is a separate arm if run.
    - >-
      The scalar k is known to the harness for enumeration and for the
      planted t(k) positive, and is structurally withheld from every
      statistic code path; the static provenance check is blocking.
    - >-
      Toy tier throughout, p in the 16 to 30 bit band (frozen ladder 17-27
      bits); nothing is claimed at cryptographic n.
  proof_search_map:
    bottleneck: >-
      Not the instrument, which exists in two prior records, but the absence
      of ANY bound for the digit family: the record's whole reason to exist
      is that the Weil composition is vacuous here and no replacement
      argument is known. A reviewer who supplies a bound on SUM_k t(x([k]P))
      e(ak/n) of the Weil scale converts this record from a measurement into
      a confirmation and should say so.
    baseline_embedding:
      parameter_slice: >-
        The COMPARATOR arm, the top bit of x, is an interval statistic with
        spectral norm O(log p) and is exactly the object f558e4 already
        measures (its committed x-bucket values for p = 101, 103, 107 and
        the frozen Z/23 fixture) and b4e6eb adopts as its r = 1 shadow.
      reproduction_check: >-
        FROZEN FIXTURE, re-verified at design time (2026-09-03) by exact
        rational arithmetic over all 529 pairs of Z/23Z: at N = 23, s = 3,
        the interval partition of Z/N must give q_strict = 0 and
        q_maj = 284/529 (= 0.536862...), both by exact rational arithmetic;
        the frozen run must reproduce them EXACTLY or the discrepancy is an
        implementation bug and blocks the record. The ladder primes do not
        overlap f558e4's N ~ 100 cells, so the gate runs on f558e4's own
        small instance; additionally the comparator's fitted decay beta over
        the ladder must be consistent with 1/2. If the comparator misses,
        the estimator disagrees with the prior lane and no digit-arm number
        is reported.
    observation_collision:
      observable: >-
        The pair (A(v), q_maj - 1/2) at given n for a statistic v.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: the Thue-Morse arm and the
        comparator are predicted to give the SAME observable within the band
        although one is inside the pinning's proof and the other provably
        outside it. That collision is the closure reading, not a failure: it
        says the observable does not see the spectral norm. The collision
        that would be a FAILURE is the popcount-mod-4 arm matching the
        Thue-Morse arm BEFORE the shuffle, since the former carries a known
        marginal artifact and the latter is balanced; if they agree
        pre-shuffle the balance argument of claim (C) is not doing what it
        claims and the marginal must be measured directly.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the DL-coordinate advantage) fixed and vary
          the forgotten structure (the F_p spectral norm of the statistic,
          from O(log p) for the comparator through p^{0.39}-type for
          Thue-Morse to sqrt(p) for Rudin-Shapiro). If the advantage is
          independent of the spectral norm the pinning's proof hypothesis is
          not the load-bearing one; if it grows with the norm the hypothesis
          is real.
        predicted_gain: >-
          Turns 'does the degree gap matter' into a one-dimensional curve in
          the spectral norm with a predicted flat shape.
      - transform: representation_reduction
        proposed_object: >-
          Move the o2 lane's question from the sum-compatibility observable,
          where the marginal artifact lives, to the DL-coordinate observable,
          where f558e4 (F) says the exponent-relevant content lives.
          Encoding exact; the loss is that a sum-compatibility gain and a DL
          advantage are different quantities and neither implies the other,
          which is stated rather than assumed.
        predicted_gain: >-
          Closes, or opens, the cell the o2 lane left uncovered on the
          observable that would matter.
    quantifier_order: >-
      MEASUREMENT CLAIM: FOR ALL statistics in the DECLARED arm set {t of x,
      t of y, r of x}, FOR ALL tested prime orders n in the ladder, the
      advantage A(v) is at most the comparator's advantage plus the
      pre-registered band and its fitted decay exponent beta lies in
      [0.4, 0.6]. The quantifier is over the declared arms and the tested
      ladder only. THE STRONGER READING NOT CLAIMED: that every digit
      statistic, or every statistic of unbounded spectral norm, is pinned;
      the record measures three members and says so.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'on the tested toy family the declared digit statistics show
        no DL-coordinate advantage beyond the interval comparator, decaying
        like n^{-1/2}, with the marginal artifact of the o2 lane absent by
        balance and confirmed absent by shuffle'. It can NEVER certify that
        no unbounded-spectral-norm statistic helps, it certifies nothing at
        cryptographic n, and it proves no bound: the digit family remains
        without a theorem whatever the numbers say.
      nearby_object_control: >-
        The object where the hoped-for conclusion FAILS is the Thue-Morse
        sign of the DISCRETE LOG, t(k): computable only with k, provably
        carrying a Fourier coefficient along k of order n^{-0.21} that does
        NOT decay like n^{-1/2}. A pipeline that cannot see this planted
        signal at its known intermediate scale, while seeing the interval
        positive at its known flat scale, has not shown that it resolves the
        boundary where the closure is decided -- which is the o2 red team's
        own objection to its lane's P2 control, carried here as a design
        requirement. Design-time sanity values: A(t(k)) = 0.054186 at
        n = 131113 and 0.040388 at n = 525361 (ratio 1.34, matching
        (n2/n1)^{0.21} = 1.33).
    proof_obligations:
      - claim: >-
          The pinning bound is a triangle inequality over the F_p spectrum
          composed with a hybrid character-sum bound, and is vacuous when the
          spectral norm exceeds n / (sqrt(p) log p).
        responsibility: correctness
      - claim: >-
          The F_p spectral norms of t and r over [0, p) are powers of p and
          the comparator's is polylog, at every ladder prime, by direct
          computation.
        responsibility: size
      - claim: >-
          The Thue-Morse marginal over [0, p) is at most 1/p.
        responsibility: correctness
      - claim: >-
          The comparator reproduces f558e4's fixture (284/529 at N = 23,
          s = 3, exact rationals).
        responsibility: baseline
      - claim: >-
          No statistic code path reads k.
        responsibility: interface
      - claim: >-
          Every reported number names n, the statistic, the lift convention
          and the estimator.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For a prime-order subgroup <P> of a toy curve and v in {t, r}
        applied to x([k]P), the sequence (v([k]P))_{k in Z/n} behaves, with
        respect to its largest Fourier coefficient along k, like a uniformly
        random +-1 sequence: A(v) = O(sqrt(log n / n)), uniformly over the
        ladder.
      random_model_justification: >-
        The classical distribution statement imitated is the extreme value
        of the DFT of a Rademacher sequence, max over n frequencies of a sum
        of n independent signs, which is O(sqrt(n log n)) with high
        probability (RECALLED: standard extreme-value statement for
        subgaussian chaos; not opened as a source by this program).
      supporting_results:
        - >-
          THE RIGOROUS INGREDIENT THAT WOULD NORMALLY PAIR WITH IT --
          square-root cancellation in hybrid sums over elliptic-curve
          points, composed over the statistic's F_p spectrum -- DOES NOT
          REACH THIS FAMILY, because the spectral norm of t and r is a power
          of p (KN-FIND-ffe1df's measurement for the digit-sum family,
          L1 ~ p^{0.39}; the recalled Gelfond and root-N facts). H1 is
          therefore a genuine heuristic with NO rigorous half, stated as
          such, and the record exists because of that.
      validation_experiment_ids:
        - EXP-ECDLP-56ee42
      falsification_condition: >-
        A digit arm showing an advantage at or above 0.05 over the
        comparator, reproduced at three or more prime orders, surviving
        NULL-1 and NULL-2, and not decaying in n (falsification condition
        F4 of the proposal): H1 is refuted at the tested scale and the
        result is the LEAD, routed to independent review before any
        interpretation.
    - id: H2
      formal_statement: >-
        The marginal of v over the coordinates of G, (1/n) SUM_{R in G}
        v(x(R)), is O(n^{-1/2} log n); equivalently the mixed sum SUM_x
        v(x) chi(x^3 + ax + b) over F_p exhibits square-root cancellation.
      random_model_justification: >-
        NONE KNOWN TO THIS RECORD. The statement imitates the
        equidistribution of a digit sign against a multiplicative
        character, the shape of the Mauduit-Rivat results on digit sums
        along primes and squares (RECALLED), but no result for a Legendre
        symbol of a cubic is known to the author.
      supporting_results:
        - >-
          NONE. H2 is measured directly (P5 of the contract) and, whatever
          its value, NULL-2 removes its effect from the DL question by
          construction, so the record does not depend on it; it is stated
          because a flat marginal would be an independent finding worth its
          own record. Design-time facts (2026-09-03, artifact
          experiments/EXP-ECDLP-56ee42/design/): the Thue-Morse and
          Rudin-Shapiro partial sums over [0, p) are exactly +-1 at all six
          frozen ladder primes, i.e. the [0, p) marginal bias is at most
          1/p there.
      validation_experiment_ids:
        - EXP-ECDLP-56ee42
      falsification_condition: >-
        A marginal flat in n over the ladder is reported separately as a
        finding about the mixed sum SUM_x t(x) chi(x^3 + ax + b),
        independent of the DL question; it does NOT by itself falsify the
        main claim or constitute a lead (P5 of the contract).
  structural_ingredients:
    - description: >-
        The pinning: coordinate-derived statistics of bounded F_p spectral
        norm are pinned at the 1/s baseline within O(n^{-1/2}) via
        Fourier coefficients along the discrete-log coordinate (sub-result
        (E)), and a non-decaying advantage is an approximate-AP
        distinguisher (sub-result (F)); the majority-advantage estimator
        q_maj = max over F: SxS -> S of Pr[v(R+R') = F(v(R), v(R'))].
      citation: IDEA-20260815-f558e4
      provenance: internal
      verified_by: TASK-20260902-51b6ce lane A, lines 1-170 read 2026-09-02
      role: instrument + pinning + planted-positive model
    - description: >-
        Family I (popcount, digit sums) NOT closed: not O(1) intervals and
        not an AP, measured L1 grows ~p^{0.39}; family J refuted as stated
        with popcount having 9438 intervals per level and max|T_t| = 0.395,
        101 times the sqrt(p) scale, entirely the xi = 0 marginal term; and
        RT-EXP-1's outcome that popcount and digitsum tripped the
        refutation criterion and were false positives reproduced by the
        matched-marginal shuffle.
      citation: KN-FIND-ffe1df
      provenance: internal
      verified_by: TASK-20260902-51b6ce lane A, read in full 2026-09-02
      role: the measured spectral-norm escape of the digit family
    - description: >-
        The RT-EXP-1 table rows for popcount and digitsum with their
        shuffled counterparts (alpha +0.125 vs +0.135; +0.495 vs +0.537),
        and the red-team RT-3 finding that family J is outside the
        additive completion's class; source of the matched-marginal
        shuffle control carried forward unchanged.
      citation: analysis/o2-sum-compatible-filters/reviews/RT-EXP-1-RESULT.md and REDTEAM.md
      provenance: internal
      verified_by: >-
        TASK-20260902-51b6ce lane A, 2026-09-02, opened via grep excerpts
        only (lines 17-87 of RT-EXP-1-RESULT.md and lines 41-45, 192-210 of
        REDTEAM.md); the documents were NOT read end to end, and the
        surrounding derivation files were not opened.
      role: the diagnostic artifact pattern + NULL-2 control
    - description: >-
        sup over theta of |SUM_{m<N} (-1)^{s_2(m)} e(m theta)| << N^{lambda}
        with lambda = log 3 / log 4, approximately 0.79; used only to say
        the Thue-Morse spectral norm is a power of p. Hedged: the exact
        constant and normalisation were not checked; the contract's Stage 0
        COMPUTES the norm rather than relying on this.
      citation: >-
        Gelfond, 'Sur les nombres qui ont des proprietes additives et
        multiplicatives donnees', Acta Arith. 13 (1968); and the
        Mauduit-Rivat line on sums of digits along primes and squares
      provenance: recalled
      verified_by: null
      role: the Thue-Morse norm scale (order-level, computed at Stage 0)
    - description: >-
        The Rudin-Shapiro sequence satisfies sup_theta |SUM_{m<N} r(m)
        e(m theta)| <= C sqrt(N). A WebSearch snippet on 2026-09-02
        corroborated this statement; the source itself was not read (the
        fetched PDF could not be parsed), so provenance stays recalled.
      citation: >-
        Rudin (1959) and Shapiro (1951) on Salem's question; Mauduit and
        Rivat, 'Prime numbers along Rudin-Shapiro sequences', J. Eur. Math.
        Soc. 17 (2015)
      provenance: recalled
      verified_by: null
      role: the Rudin-Shapiro norm scale (order-level, computed at Stage 0)
    - description: >-
        Square-root cancellation for hybrid sums SUM_k e_p(xi x([k]P))
        e(ak/n), and bit-extraction results that live inside the
        bounded-spectral-norm class.
      citation: >-
        Kohel and Shparlinski; Lange and Winterhof, on character sums over
        the points of an elliptic curve, and the pseudorandom-bits-from-
        elliptic-curve-points literature (Farashahi-Shparlinski lineage;
        arXiv 1005.4771 surfaced by search and not opened)
      provenance: recalled
      verified_by: null
      role: the rigorous half of the pinning that does NOT reach the digit family
    - description: >-
        The toy-curve exclusion rule (anomalous #E = p and smooth order
        excluded before a curve enters a run set), as IDEA-20260901-863e36
        and IDEA-20260901-b4e6eb state it. This record has NOT opened
        KN-TECH-034; the rule is applied as those records state it, and
        nothing load-bearing rests on its exact text. The frozen ladder
        satisfies it by construction (N prime hence not smooth, N != p
        hence not anomalous; j != 1728 to stay off the CM-by-i family),
        archived in experiments/EXP-ECDLP-56ee42/design/ladder.json.
      citation: KN-TECH-034
      provenance: recalled
      verified_by: null
      role: curve exclusion
    - description: >-
        The parallel rho baseline at about 0.886 sqrt(n) with small memory
        and the fully-charged comparison rule; the sqrt(|Aut|) constant-
        factor discount and the fact that the 0.886 convention includes
        negation; the obligation to charge against the prime subgroup order
        and to factor every toy curve order.
      citation: KN-TECH-006, KN-TECH-018, KN-TECH-030
      provenance: internal
      verified_by: TASK-20260902-51b6ce lane A, all three read in full 2026-09-02
      role: best-known baselines for the interpretation
    - description: >-
        Exact propagation of a lossy projection is impossible on a
        prime-order group; escape E1 is the probabilistic regime.
      citation: IDEA-20260807-df906f
      provenance: internal
      verified_by: TASK-20260902-51b6ce lane A, lines 1-160 read 2026-09-02
      role: why the test is applied in probabilistic form
  reduction_chain: null
  predictions:
    - metric: >-
        P1 -- A(v) and q_maj - 1/2 for T1, T2, T3 minus the same quantities
        for the comparator, at matched n, before and after NULL-2
      direction: different
      minimum_effect: >-
        PRE-REGISTERED TWO-BRANCH RULE. Absolute difference at or below 0.01
        at every tested n, before and after shuffle, records the CLOSURE
        branch. A difference at or above 0.05, reproduced at three or more
        prime orders, NOT reproduced by NULL-2, and NOT decaying with n,
        records the LEAD branch and triggers independent review before any
        interpretation. Between is INCONCLUSIVE in advance. BASIS: the
        n^{-1/2} scale at the tested sizes and the bands b4e6eb uses, so the
        three panels remain comparable; untested expectations.
    - metric: >-
        P2 -- fitted decay exponent beta per arm in A(v) ~ n^{-beta} over at
        least six prime orders spanning 6x
      direction: lower
      minimum_effect: >-
        beta in [0.4, 0.6] for T1-T3 records closure; beta at or below 0.25
        surviving NULL-1 and NULL-2 records the lead. POSITIVE CONTROL B
        must return beta consistent with 0.21, and POSITIVE CONTROL A beta
        near 0.
    - metric: >-
        P3 -- the exact F_p spectral norms of t, r and the comparator at each
        ladder prime (Stage 0)
      direction: different
      minimum_effect: >-
        Digit norms growing as a power of p with fitted exponent at or above
        0.3 (Thue-Morse) and near 0.5 (Rudin-Shapiro); comparator norm
        growing at most like (log p)^2. If a digit norm is polylog the
        record's premise fails for that arm and the arm is dropped with the
        computed norm archived.
    - metric: >-
        P4 -- CONTROL C's pre-shuffle excess and post-shuffle residual
      direction: different
      minimum_effect: >-
        A pre-shuffle excess that the shuffle removes, reproducing the o2
        lane's artifact pattern. Known-answer calibration of NULL-2; if the
        shuffle does not remove it the control is not doing what the o2 lane
        reported and every digit number is void.
    - metric: >-
        P5 -- each arm's own marginal over x(G), i.e. the mixed sum of the
        digit sign against the curve's Legendre indicator, normalised
      direction: lower
      minimum_effect: >-
        At the n^{-1/2} scale and decaying (heuristic H2). A marginal flat in
        n is reported separately as a finding about the mixed sum SUM_x t(x)
        chi(x^3 + ax + b), independent of the DL question, and does NOT by
        itself constitute a lead.
  test_boundary:
    instances: >-
      The frozen ladder of six prime-order subgroups (cofactor 1: the whole
      group is prime order), model y^2 = x^3 + x + b over F_p, selected by
      the deterministic selector archived at
      experiments/EXP-ECDLP-56ee42/design/select_ladder.py with output
      experiments/EXP-ECDLP-56ee42/design/ladder.json: (p, b, N) =
      (131101, 27, 131113), (524309, 80, 525361), (2097169, 1, 2098321),
      (8388617, 21, 8391797), (33554473, 49, 33557891), (134217757, 70,
      134234689). All self-generated, toy, no key involved.
    parameters:
      n_bits_band: '16 to 30 (frozen ladder 17-27, span n_max/n_min = 1023.8)'
      lift_convention: 'canonical integer representative in [0, p)'
      arm_set: 'T1 Thue-Morse of x; T2 Thue-Morse of y; T3 Rudin-Shapiro of x; T4 popcount of x mod 4 (diagnostic CONTROL C); COMPARATOR top bit of x; POS-A (-1)^k; POS-B Thue-Morse of k'
      nulls: 'NULL-1 keyed random sign (256 replicates); NULL-2 matched-marginal shuffle (8 seeds, max over shuffles)'
      cm_exclusion: 'j != 1728 (mod p) at every frozen prime; j values archived in ladder.json'
    implementation: >-
      The estimator of f558e4: q_maj = max over F: SxS -> S of the EXACT
      fraction of (R,R') pairs, evaluated exactly via integer cyclic
      convolutions c_{ijm} = SUM_x (f_i * f_j)(x) f_m(x) with the
      integer-recovery check |g - round(g)| < 0.25 (exact value of the
      n^2-pair sum in O(n log n); direct n^2 enumeration is infeasible at
      the top rung); A(v) = max over a in Z/n of |SUM_k v([k]P) e(ak/n)| / n
      by one length-n DFT. The RQ-PROP-24458b instrument of H-PROP-c95932
      does not exist (experiments/EXP-PROP-ba2e44 is specification-only), so
      the estimator is implemented per this definition.
    budget: >-
      See the contract: total wall-clock cap 24h (implementation 2 days
      excluded from the run budget), peak RAM 16 GB at the top rung,
      maximum_runs 12 stage invocations.
  falsification_conditions:
    - >-
      F1. Stage 0 finds a digit norm that is polylog in p. Claim (A) is wrong
      for that statistic; the arm is dropped and the computed norm archived.
    - >-
      F2. The comparator fails to reproduce f558e4's fixture (284/529 at
      N = 23, s = 3, exact rationals), or POSITIVE CONTROL A or B fails to
      separate at its predicted scale. Instrument failure; nothing is
      reported.
    - >-
      F3. CONTROL C's excess survives the shuffle. NULL-2 is not the control
      the o2 lane reported; every digit number is void until resolved.
    - >-
      F4. A digit arm shows an advantage at or above 0.05 over the
      comparator, reproduced at three primes, surviving NULL-1 and NULL-2,
      not decaying in n. THE LEAD: an efficiently computable statistic
      outside the Weil class with a non-decaying DL-coordinate correlation,
      i.e. an approximate-AP primitive in the sense of f558e4 (F). Still no
      attack; conversion to key recovery needs its own proposal with
      exponents and a cost table.
    - >-
      F5. Every digit arm matches the comparator within 0.01 with beta in
      [0.4, 0.6]. The predicted outcome: the probabilistic-regime ceiling
      holds empirically for a family provably outside its proof, in the
      tested scope, and the honest headline is 'a measured extension of the
      Weil ceiling past its own reach, on three statistics, at toy scale,
      with the o2 artifact removed by balance and confirmed by shuffle'. It
      closes three arms, not the family, and proves no bound.
    - >-
      F6. Budget exhaustion before the ladder resolves. INFRASTRUCTURE
      outcome under AGENTS.md rule 5, never evidence about the statistics.
  interpretation_limits:
    - >-
      No bound is proved in either branch. The closure branch is an
      empirical extension of a prediction beyond its proof, scoped to three
      statistics, six primes and one lift convention.
    - >-
      The lead branch is a distinguisher-scale statement and NOT an attack;
      the conversion to a solver is f558e4 (F)'s separate question.
    - >-
      Nothing here bears on the o2 lane's Lemma 5 hole or on any k-tree
      configuration; a DL-coordinate advantage and a sum-compatibility gain
      are different quantities.
    - >-
      Toy tier throughout; no transfer to cryptographic n is licensed.
