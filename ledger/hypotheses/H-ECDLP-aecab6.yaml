  statement: >
    Fix n=7 before any elliptic M_S
    or (L,b) meter is read. Stage 0
    asserts only the additive-group
    Kummer-fold dichotomy as exact
    boolean arithmetic. toy_x(t) is
    min(t mod n, (n-t) mod n).
    symmetric(S, n) is true iff some
    c satisfies S = {(c-s) mod n :
    s in S}. M_S(x) is the frozenset
    of toy_x((x+s) mod n) for s in S.
    collision(S, n) is true iff some
    distinct x, y have M_S(x) =
    M_S(y). The Stage 0 iff is
    symmetric == collision. REAL is
    S={1,6}, which is symmetric at
    c=0 and colliding (1 with 6,
    2 with 5, 3 with 4). KF is
    S={1,2,4}, which is not
    symmetric and injective (all
    seven M_S values distinct).
    Do not use S={1,2} as KF:
    every 2-set of Z/7 is centrally
    symmetric. NULL empty or |S|<2
    is rejected. n=0 is rejected.
    This is not elliptic M_S on a
    curve, not an (L,b) meter, not
    an Aut census, not an orbit
    cost, and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260905-579fcc (M1) says a
    shift multiset of x is injective
    unless S is centrally symmetric,
    in which case it is the Kummer
    fold. Stage 0 freezes that
    dichotomy on the additive group
    Z/7 with toy_x in place of
    elliptic x. The producer
    evaluates symmetric(S, n) and
    collision(S, n) by exact integer
    arithmetic and reports whether
    they agree. The KF asymmetric
    3-set and the NULL empty set
    are the proves-too-much and
    nearby-object controls. No
    curve is touched. No Aut is
    enumerated. This is a new
    RQ-ECDLP-002 object after
    Stage 0 of EXP-ECDLP-6ffef4
    held as P-S0-BLOCK
    (DEC-20260908-6dc888). It is
    not Stage 1 of EXP-ECDLP-6ffef4
    and not Stage 1 of this
    experiment. IDEA-20260902-2327a5
    shares the W_n law already
    calibrated as P-S0-WTLAW and
    is not selected.
  predictions:
    - id: P-S0-SHIFT
      metric: well-defined exact additive-group Kummer-fold iff on frozen n=7
      direction: different
      minimum_effect: >
        After fixture_pass, REAL is
        symmetric and colliding so
        the iff is true. KF is not
        symmetric and not colliding
        so the iff is true. NULL
        empty or |S|<2 is rejected.
        n=0 is rejected. One
        certified miss after
        fixture_pass is a scoped
        falsification of this
        instrument at n=7.
      claim_tier: observational
    - id: P-S1-METER
      metric: (L, b) meter on elliptic M_S
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here.
        Stage 0 does not run a meter,
        does not form elliptic M_S,
        and does not touch a curve.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFCOUNT
      statement: >
        After fixture_pass, KF reports
        symmetric or colliding equal
        to REAL. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALCNT
      statement: >
        After fixture_pass, REAL fails
        to be both symmetric and
        colliding. That falsifies
        only P-S0-SHIFT at frozen n=7.
    - id: F-S1-METER
      statement: >
        After an authorized later
        stage, a claimed (L, b) that
        misses the predicted (0, 1)
        or (1, 2). Unauthorized here.
