  proof_search_map:
    bottleneck: >
      Whether the additive-group
      Kummer-fold iff holds as exact
      boolean arithmetic on frozen n=7.
      Stage 0 only checks that identity,
      the asymmetric known-false, and
      the empty nearby object.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: additive-
        group Kummer-fold iff at frozen
        n=7 only, not the proposal's
        elliptic M_S, not the (L,b)
        meter, not an Aut census.
      reproduction_check: >
        REAL symmetric and colliding,
        iff true. KF not symmetric and
        not colliding, iff true. NULL
        empty or |S|<2 rejected. n=0
        rejected.
    observation_collision:
      observable: >
        symmetric versus collision
        versus the iff.
      distinct_preimage_search: >
        Hold n=7 and replace S={1,6}
        by S={1,2,4} (KF). Hold n and
        replace S by empty (NULL).
        Do not use a 2-set as KF.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact additive-group Kummer-fold iff.
        predicted_gain: >
          Exact known-false asymmetric
          gap on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze n=7 before reading the
      iff. Existential equality at
      one toy does not imply elliptic
      M_S and does not imply a rho
      beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen n=7.
        Never elliptic M_S.
        Never an (L,b) meter.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is the empty or |S|<2
        set. An argument that still
        assigns it a true iff is
        wrong. KF is the asymmetric
        object; an argument that
        assigns every S symmetric
        is wrong. A 2-set KF would
        be a void control.
    proof_obligations:
      - claim: well-defined exact additive-group Kummer-fold iff
        responsibility: correctness
      - claim: exact REAL symmetric-and-colliding at n=7
        responsibility: baseline
      - claim: exact KF asymmetric injective gap
        responsibility: baseline
      - claim: no elliptic M_S, no (L,b) meter, no Stage 1 of 5f3822/6ffef4/11c247/114eb2/821bc5/735974/fdae20/089e80/b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
