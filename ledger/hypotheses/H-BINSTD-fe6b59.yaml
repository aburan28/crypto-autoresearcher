        Free-leg / (m-1)-fixed residual L = -(sum of m-1 factor-base
        points) by group additions
      citation: IDEA-20260922-6cf862 (recalled Joux-Vitse attribution)
      provenance: recalled
      verified_by: null
      role: construction (A); attribution unverified
    - description: >-
        Free-leg roots as x(+-P_1 +- ... +- P_{m-1}) via group additions
      citation: IDEA-20260806-9d47e2
      provenance: recalled
      verified_by: null
      role: >-
        pointer only this session (title/summary previously; arithmetic
