      direction: flat
      minimum_effect: 100 percent under correct canonicalisation
    - metric: combined_relation_count_vs_T_squared_over_2S
      direction: different
      minimum_effect: agreement within factor 2 for T <= sqrt(S)
    - metric: residual_collision_rate_ratio_vs_uniform_N
      direction: flat
      minimum_effect: about 1 if S≈N; report fitted S if not
    - metric: curve_over_generic_collision_ratio
      direction: flat
      minimum_effect: within [0.5, 2] at matched T (HOLD-Q blocking control)
    - metric: adversarial_truncated_key_certificate_failure_rate
      direction: higher
      minimum_effect: measurably nonzero
    - metric: merge_wall_clock_fraction_of_collection
      direction: lower
      minimum_effect: under 10 percent at toy T
    - metric: attempts_to_B_relations_log2
      direction: different
      minimum_effect: tracks log2 sqrt(2 N B) not log2 N on the growth curve

