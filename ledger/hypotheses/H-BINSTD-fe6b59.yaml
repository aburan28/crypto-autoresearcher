  falsification_conditions:
    - >-
      Any combined relation failing full-leg sum-to-O under correct
      canonicalisation (hard instrument defect).
    - >-
      Combined count off T^2/(2S) by >factor 2 at T<=sqrt(S) with no
      structural histogram explanation.
    - >-
      Zero certificate failures under truncated-key adversarial control.
    - >-
      Curve/generic collision-rate ratio outside [0.5, 2] at matched T
      without a reported structural finding and Stage-5 follow-up plan.
    - >-
      Merge wall-clock >10% of collection at tested toy T without restating
      the "cheap pre-processing" framing.
    - >-
      Any artefact from the hash table shown to transfer usefully to a
      target outside the sweep without re-derivation (would be F7).
    - >-
      Any claim that the mechanism beats matched rho on a deployed row
      (protocol violation; dominated_by forbids it).

