# =============================================================================
# H-BINSTD-fe6b59 -- HOLD-Q-corrected free-leg elliptic large-prime
# accumulator as a TOY relation-collection instrument (n <= 41).
# Specified and approved under DEC-20261001-ada211 from
# IDEA-20260922-c2bbe6 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001,
# absorbing 2026-09-26 HOLD-Q review defects
# (analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c2bbe6.yaml;
# verdict dominated; agreement: honest toy-tier revision with dominated_by
# filled). GTTD double-large-prime conversion is OUT OF SCOPE here
# (successor seam / G1 lane per review); IDEA-20260926-1db0e8 supplies
# the sharpened ECC2K-130 closure numbers used in dominated_by.
#
# ZERO RUNS in this design packet. IDEA-20260922-c2bbe6 claim text is not
# edited (proposals immutable). Class: composition / instrument.
# No exponent. No break. Zero deployed bearing.
# =============================================================================
hypothesis:
  id: H-BINSTD-fe6b59
  question_id: RQ-BINSTD-b6f698
  related_question_ids:
    - RQ-CERTBIN-836ce2
  source_idea: IDEA-20260922-c2bbe6
  experiment_id: EXP-BINSTD-cedae5
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-ada211
  review_cited: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c2bbe6.yaml
  hold_id: HOLD-Q
  proposed_by: coordinator
  title: >-
    HOLD-Q: free-leg residual hash/union-find large-prime accumulator as a
    toy (n<=41) relation-collection instrument; dominated_by filled with
    sqrt(2 N B) vs matched rho; Z/(4l) generic control — no deployed bearing

  statement: >-
    SETTING. Binary curve E/F_{2^n} from RQ-BINSTD-b6f698's population at
    toy n<=41. Factor base V of size B small enough that V^{m-1} is
    directly enumerable. Relation = size-m multiset from V summing to O.
    Free-leg construction: fix m-1 legs from V, compute
    L = -(P_1+...+P_{m-1}) by m-2 additions, test L in V. HOLD-Q
    CORRECTED CLAIM: bank every residual under canonical key c(L); when a
    second attempt shares c(L), subtract tuples to a certificate-bearing
    weight-<=2(m-1) relation among factor-base elements at hash/lookup
    cost, with a union-find merge pass as the structured-Gaussian-
    elimination analogue. Target-FREE relation collection (target = O).

    HOLD-Q CORRECTED PART (A) — DOMINATED_BY FILLED BEFORE ANY RUN.
    Under uniform residual support S ≈ N = |E|, expected combined
    relations after T attempts ≈ T^2/(2S). To collect B usable combined
    relations needs T ≈ sqrt(2 S B) ≈ sqrt(2 N B). On ECC2K-130
    (N = 2^131, matched rho ≈ 2^60.809 per KN-FIND-aa2efc / HOLD-Q
    arithmetic): T >= 2^66.0 at B=1, 2^71.0 at B=2^10, 2^76.0 at B=2^20,
    2^81.0 at B=2^30 — above rho for every B>=1 before linear algebra.
    Plain free-leg (recombination OFF) needs T of order N to collect B
    full relations (Θ(N) brute force). IDEA-20260926-1db0e8 sharpens the
    free-leg j=1 form further (whole-group large base → birthday search
    ~2^59 sqrt(B) time / 2^58 sqrt(B) memory; still above rho at feasible
    cells). Therefore this mechanism has ZERO DEPLOYED BEARING as a
    primary relation collector; the frozen claim is the TOY instrument
    only (review agreement_note).

    HOLD-Q CORRECTED PART (B) — GTTD FORM NOT ADOPTED HERE.
    HOLD-Q named adopting Gaudry–Thomé–Thériault–Diem (GTTD) double-
    large-prime as a revision route. Independent review states that is a
    NEW proposal needing a decomposition oracle and oracle-cost model
    (G1 lane / successor_seam), not a revision of THIS record. This
    hypothesis cites KN-LIT-164 / KN-LIT-92caf4 (corpus) as literature
    context and keeps GTTD OUT OF SCOPE. IDEA-20260926-1db0e8 prices the
    GTTD form separately.

    HOLD-Q CORRECTED PART (C) — GENERIC-GROUP CONTROL.
    Residual uniformity H-c2bbe6-0 is tied to a relabelled Z/(4l) replica
    with a random matched-size window: collision statistics must coincide
    or the excess is curve structure (blocking control).

    HOLD-Q CORRECTED PART (D) — CITATION PROVENANCE.
    "Joux-Vitse free-leg" attribution remains recalled via
    IDEA-20260922-6cf862 (not independently verified). Classical sieve
    large-prime variation remains recalled. KN-LIT-164 / KN-LIT-92caf4
    are kb (corpus entries read this design session; primary PDF not
    opened here). IDEA-20260806-9d47e2 treated as internal pointer;
    free-leg arithmetic is re-derived from first principles in Stage 0.

    CLAIM TIER: toy / instrument. NO exponent move. NO break. NO rho
    competitiveness. NO attack claim on any deployed curve.

  statement_note: >-
    IDEA-20260922-c2bbe6 claim text is immutable and left at status
    proposed. Review verdict dominated (HOLD-Q / return_for_revision).
    Defects absorbed into this hypothesis and EXP-BINSTD-cedae5:
    dominated_by filled; toy-tier scope forced; Z/(4l) control added;
    KN-LIT-164/92caf4 cited as kb without claiming GTTD adoption;
    recalled free-leg attribution flagged. Source "not applicable as an
    attack claim" dominated_by wording is REJECTED as the frozen claim.

  mechanism: >-
    OBJECT FRAME (from source IDEA, retained). Representation: an
    (m-1)-tuple of factor-base points paired with residual L.
    Operation set Sigma: pairwise SUBTRACTION of two tuples sharing
    canonicalised residual c(L), plus underlying translation-by-V.
    Trichotomy: PARTIAL-ACTION (Class I). Lossy projection:
    pi:(tuple,L)->c(L); compatible with Sigma because subtraction is
    defined precisely on equal projections. WHAT THIS PACKET ADDS is the
    HOLD-Q-corrected scope (toy only), filled Pareto honesty
    (dominated_by = matched rho via sqrt(2 N B)), the Z/(4l) generic
    control, and an explicit refusal to treat the construction as a
    deployed primary collector. Declared component: F2 (factor-base
    decomposition / relation collection), explicitly not F7.

  assumptions:
    - >-
      |V| small enough that a designed subset of V^{m-1} is directly
      enumerable (toy regime); disclosed scope restriction.
    - >-
      Residual points approximately uniform over support S (measured, not
      assumed equal to N); heuristic H-c2bbe6-0 / HEUR-BINSTD-fe6b59-H0.
    - >-
      Canonicalisation c(L) correctly identifies +-L (and Frobenius
      conjugates when applicable); bugs caught by certificate re-sum.
    - >-
      Arithmetic only at toy n<=41 (RC-1 n=17 primary; optional n=19).
    - >-
      No claim that T=sqrt(2 N B) beats matched rho on any deployed row —
      the opposite is asserted in dominated_by.
    - Uses F2; explicitly not F7.

  proof_search_map:
    bottleneck: >-
      Whether free-leg residuals, banked and matched, produce certificate-
      verified combined relations at a rate matching the birthday model
      at toy scale — and whether that rate is group-free (matches Z/(4l))
      or curve-structured — while the deployed cost floor sqrt(2 N B)
      remains above matched rho (already priced; not under test as a hope).
    baseline_embedding:
      parameter_slice: >-
        Plain free-leg (recombination OFF) at the same RC-1 cell: full-
        relation yield must match balance heuristic B^m/(m! N) within
        this lane's tolerance; zero phantom combined relations.
      reproduction_check: >-
        Stage 1 recombination-off arm; Stage 0 hand check that
        c(L)=c(-L) on a tiny toy point; independent recomputation of
        sqrt(2 N B) ECC2K-130 floor numbers before any Stage 1 run.
    observation_collision:
      observable: >-
        Combined-relation count per T; residual multiplicity histogram;
        curve/generic collision-rate ratio.
      distinct_preimage_search: >-
        Excess collisions could be (i) genuine birthday matches or
        (ii) over-matching canonicalisation. Distinguisher: every
        combined relation re-sums to O on a fresh curve object (hard
        fail on any miss under correct c). Separately, excess on the
        curve but not the Z/(4l) replica is curve structure, not a
        generic birthday gain.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          (tuple, c(L)) as the unit of relation collection with
          union-find merge, scoped to toy enumeration.
        predicted_gain: >-
          Toy: quadratic-in-T combined supply vs linear full-relation
          supply. Deployed: none claimed (dominated by rho).
      - transform: observable_fiber
        proposed_object: >-
          Large-prime graph (vertices = c(L), hyperedges = attempts)
          whose spanning-tree components yield |C|-1 relations.
        predicted_gain: >-
          Merge at O(alpha(T)) amortised; cheap at toy T; disclosed.
    quantifier_order: >-
      FOR EVERY pair of (m-1)-tuples with equal c(L) THERE EXISTS a
      weight-<=2(m-1) factor-base relation exhibited by subtraction and
      re-verified by summing to O (constructive, certificate-bearing).
      The HEURISTIC content is how many such pairs occur after T attempts.
    method_ceiling:
      strongest_certifiable_claim: >-
        On RC-1 (n=17) and optionally n=19 at m=3 with the named windows,
        free-leg residuals yield certificate-verified combined relations
        whose count tracks T^2/(2S) within factor 2 when S is measured
        from the histogram, and the curve/generic ratio lies in [0.5,2]
        under correct canonicalisation; adversarial truncated keys fail
        certificates at a measurable rate. Certifies NOTHING about beating
        rho, nothing about SAT/Groebner regimes, nothing about deployed
        curves, and nothing about GTTD double-large-prime oracles.
      nearby_object_control: >-
        (i) Recombination-off null. (ii) Adversarial truncated hash key.
        (iii) Z/(4l) generic replica with matched |V|. (iv) Aligned-half
        window V'_0 predicting ~2x collision rate via coset confinement.
    proof_obligations:
      - claim: L = -(P_1+...+P_{m-1}) computed correctly
        responsibility: correctness
      - claim: c(L1)=c(L2) implies L1=L2 up to recorded sign/orbit
        responsibility: correctness
      - claim: Every combined relation re-sums to O
        responsibility: correctness
      - claim: Recombination-off yield matches balance heuristic
        responsibility: baseline
      - claim: ECC2K-130 sqrt(2 N B) floor numbers recomputed in Stage 0
        responsibility: baseline
      - claim: Mechanism dominated by matched rho for every B>=1 at deployed N
        responsibility: scope
      - claim: Construction is F2 not F7
        responsibility: scope
      - claim: GTTD double-large-prime not claimed by this packet
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim:
    problem: >-
      Relation-collection yield per attempt budget T for enumerable
      factor bases on toy binary curves (instrument), NOT overall ECDLP
    prior_best: >-
      Plain free-leg discarding residuals; yield linear in T at
      p_full ~ B^m/(m! N). Deployed attack prior_best remains matched rho.
    time_exponent: >-
      unchanged for ECDLP; toy instrument only. Deployed free-leg
      large-prime cost floor ~sqrt(2 N B) group ops (above rho).
    memory_exponent: O(T) hash/union-find storage, disclosed
    hidden_cofactor: >-
      Residual support S (measured); merge wall-clock vs collection;
      canonicalisation cost
    claim_kind: relation_collection_instrument

  heuristic_assumptions:
    - id: HEUR-BINSTD-fe6b59-H0
      formal_statement: >-
        BIRTHDAY / UNIFORM-RESIDUAL HEURISTIC (source H-c2bbe6-0). As
        (m-1)-tuples range over V^{m-1}, residuals L are approximately
        uniform over a support of size S (S <= N, measured), so after T
        attempts the expected number of matched residual pairs is
        ≈ T^2/(2S).
      random_model_justification: >-
        Classical birthday bound for uniform draws; elliptic analogue as
        used in van Oorschot–Wiener collision counting (recalled pointer).
        Structured V may concentrate the (m-1)-fold sumset — measured via
        residual histogram and Z/(4l) replica.
      supporting_results:
        - ref: IDEA-20260922-c2bbe6
          provenance: internal
          claim: H-c2bbe6-0 statement and validation_plan
          verified_by: coordinator (proposal read in full this design session)
        - ref: classical birthday / large-prime variation in sieves
          provenance: recalled
          claim: T^2/(2S) pair count under uniform residual draws
          verified_by: null
      validation_experiment_ids:
        - EXP-BINSTD-cedae5
      falsification_condition: >-
        Combined-relation count differs from T^2/(2S) by more than factor
        2 at T <= sqrt(S) with no structural residual-histogram explanation;
        OR curve/generic collision-rate ratio outside [0.5, 2] at matched T.
    - id: HEUR-BINSTD-fe6b59-H1
      formal_statement: >-
        MERGE-COST HEURISTIC (source H-c2bbe6-1). Union-find over
        canonicalised residuals costs O(alpha(T)) amortised per insertion;
        merge wall-clock < 10% of relation-collection wall-clock at tested
        toy T.
      random_model_justification: >-
        Standard union-find with path compression and union-by-rank
        (data-structure fact). Gap is whether canonicalisation dominates.
      supporting_results:
        - ref: IDEA-20260922-c2bbe6
          provenance: internal
          claim: H-c2bbe6-1 statement
          verified_by: coordinator (proposal read in full this design session)
      validation_experiment_ids:
        - EXP-BINSTD-cedae5
      falsification_condition: >-
        Merge wall-clock exceeds 10% of collection wall-clock at any
        tested toy T without a disclosed scale restatement.

  structural_ingredients:
