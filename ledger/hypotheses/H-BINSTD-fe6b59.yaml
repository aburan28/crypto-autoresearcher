    - description: >-
        ECC2K-130 single-large-prime free-leg closure arithmetic
        (~2^59 sqrt(B) / memory 2^58 sqrt(B); above rho)
      citation: IDEA-20260926-1db0e8
      provenance: internal
      verified_by: coordinator (proposal claim (A) read this design session;
        arithmetic not independently re-derived beyond HOLD-Q's sqrt(2 N B))
