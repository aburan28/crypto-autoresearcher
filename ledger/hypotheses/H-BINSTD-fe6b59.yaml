  distinguishable_outcomes:
    - id: DO-1-birthday-confirmed-toy
      description: >-
        Collision-rate ratio in [0.5,2] on curve and replica; combined
        count tracks T^2/(2S); certificates 100% under correct c;
        adversarial fails measurably — toy instrument validated and
        dominated_by pricing confirmed at toy scale.
      next_decision: support_scoped_instrument; do not promote to deployed
    - id: DO-2-curve-concentration
      description: >-
        Curve excess vs replica >factor 4 — structural residual
        concentration; report histogram; optional Stage 5 n=19; re-price S.
      next_decision: refine + report structural finding; not reject of existence
    - id: DO-3-certificate-power-absent
      description: >-
        Truncated-key control passes 100% — re-verification has no power;
        void interpretation of all passes.
      next_decision: weaken / repair instrument; no support
    - id: DO-4-baseline-mismatch
      description: >-
        Recombination-off full-relation yield disagrees with balance
        heuristic beyond tolerance — harness bug, not mechanism evidence.
      next_decision: repair infrastructure; AGENTS.md rule 3
    - id: DO-5-infra
      description: >-
        Timeout/crash/missing numpy without lift — failed_infrastructure.
      next_decision: checkpoint; never reject_scoped from infra

  dominated_by: >-
    CHECKED (HOLD-Q defect fix). Matched Pollard rho on every standardized
    binary row, including ECC2K-130 at ≈2^60.809 (KN-FIND-aa2efc). Under
    S≈N the free-leg large-prime accumulator needs T≈sqrt(2 N B) attempts
    (≥2^66.0 at B=1 on ECC2K-130; grows as sqrt(B)), above rho for every
    B≥1 before linear algebra (HOLD-Q / A13). Plain free-leg without
    recombination is Θ(N). IDEA-20260926-1db0e8 sharpens j=1 further
    (~2^59 sqrt(B) time / 2^58 sqrt(B) memory at whole-group large base;
    still above rho at feasible cells). This packet is a toy relation-
    collection INSTRUMENT (n≤41), not a competing attack. Frontier rows
    checked and not addressed as claims: GTTD double-large-prime with
    oracle-cost model (KN-LIT-92caf4 / successor_seam / G1), Gaudry AV,
    Joux-Vitse SAT descent, QSP census. Dominated on attack-time by
    matched rho; Pareto-incomparable as a toy instrument design.
  sota_delta:
    time: >-
      Zero attack-time movement. Toy: converts linear full-relation
      supply into a quadratic combined-relation supplement within an
      enumerable V^{m-1} census — measured, not asserted as deployed gain.
    memory: O(T) hash/union-find at toy T; disclosed. Deployed memory
      floor from 1db0e8 (~2^58 sqrt(B)) not claimed as achievable here.
    data_queries: N/A (F2 sweep, not F7 advice).

