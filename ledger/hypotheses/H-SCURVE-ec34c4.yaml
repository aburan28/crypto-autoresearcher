hypothesis:
  id: H-SCURVE-ec34c4
  question_id: RQ-SCURVE-42f1a3
  source_idea: IDEA-20261006-767793
  experiment_id: EXP-SCURVE-1a8daf
  specified_at: '2026-10-06'
  status: approved
  proposed_by: coordinator
  title: A smooth principal CM loop may beat blind navigation, but only a fully charged loop can indicate weakness
  statement: >-
    Within the three frozen centered P-192 boxes, the smooth/semismooth norm
    sieve and exact relation recombination may produce at least one non-scalar
    principal loop over the mappable factor base whose fully charged HOT and
    COLD end-to-end planted-key recovery costs are lower than the matched generic
    baseline.  Absence or solver exhaustion is scoped strictly to this finite
    protocol.
  mechanism: >-
    The norm equation directly samples principal ideals near the minimum
    non-scalar norm instead of expanding a graph neighborhood.  A broader
    algebraic factor base and two-large-prime partials improve relation yield;
    exact cancellation and weighted lattice reduction can remove expensive
    primes before maps are built.  The resulting endomorphism eigenvalue may
    supply a useful orbit or decomposition only if its construction and action
    on the actual order-n subgroup are explicit and cheaper than the baseline.
  assumptions:
    - p and n are prime, #E(F_p)=n, and End(E)=Z[pi]=O_D with conductor one.
    - The centered enumeration is exhaustive in its frozen shells and its serialization digest is stable.
    - Principal-ideal factorizations and partial cancellation are independently replayable with exact integer arithmetic.
    - HOT and COLD tuples count every applicable field, polynomial, storage, construction, and endpoint operation.
  proof_search_map:
    bottleneck: Convert a sparse principal ideal identity into a subgroup-preserving explicit loop with a net end-to-end payoff.
    baseline_embedding:
      parameter_slice: The prior generator-word L<=2^48 census and a blind bounded isogeny walk, used only as comparisons and not reused as this experiment.
      reproduction_check: Replay their published certificates when used; never import their run status or remaining budget.
    observation_collision:
      observable: Exact alpha, oriented ideal vector, independent factorization/kernel replay, explicit composite map, terminal isomorphism, subgroup action, and matched cost tuple.
      distinct_preimage_search: Remove scalar ideals, conjugate/global-sign duplicates, inverse pairs, dual backtracks, duplicate rows, and large-prime boundaries that do not cancel exactly.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Primitive centered norm representatives and a sparse oriented relation lattice.
        predicted_gain: Targets principal loops without enumerating every intermediate graph vertex.
      - transform: telescoping_potential
        proposed_object: Exact cancellation of one-/two-large-prime partial boundaries.
        predicted_gain: Converts semismooth norms into complete factor-base relations without charging nonexistent large-prime maps.
      - transform: stronger_invariant
        proposed_object: Composite-map certificate binding alpha, lambda, endpoints, subgroup generator, planted public point, and raw costs.
        predicted_gain: Prevents an abstract class relation from being promoted as a weakness.
    quantifier_order: >-
      Freeze identities, boxes, bases, encoding, controls, and budgets first;
      then enumerate every candidate in each admitted shell; then verify and
      recombine; then optimize without altering membership; then build maps;
      only afterward evaluate planted keys and compare costs.
    method_ceiling:
      strongest_certifiable_claim: A scoped end-to-end advantage or NO_WEAKNESS_FOUND_WITHIN_SCOPE for exactly the completed frozen family.
      nearby_object_control: D=-23 verifies relation recovery; the P-192 sqrt(D) relation verifies algebra while remaining scalar on E(F_p)[n] and unevaluable at its large ramified degree.
    proof_obligations:
      - claim: The exact P-192 order, discriminant, factorization, and conductor-one conclusion are valid.
        responsibility: correctness
      - claim: Each box is exhaustively and uniquely enumerated under the frozen equivalences.
        responsibility: size
      - claim: Smoothness and large-prime classifications are exact.
        responsibility: correctness
      - claim: Recombined rows cancel every large-prime ideal with its orientation.
        responsibility: correctness
      - claim: Every mapped loop preserves the order-n subgroup and has a terminal isomorphism.
        responsibility: interface
      - claim: A weakness label includes all HOT/COLD and end-to-end baseline costs with uncertainty.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-SMOOTH-1
      formal_statement: >-
        Smooth and semismooth norms in a fixed bit-length stratum behave
        approximately like comparably sized random integers only for planning
        expected yield; the deterministic census itself does not rely on this.
      random_model_justification: Norm values vary over a two-dimensional quadratic form, so random-integer smoothness is only an exploratory planning model.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SCURVE-1a8daf
      falsification_condition: Strong stratum-wise deviation with passed controls; report the deviation without altering the frozen search.
  structural_ingredients: []
  reduction_chain:
    core_problem: Find and evaluate cheap principal endomorphism loops in the exact P-192 CM order.
    corollaries: []
  predictions:
    - metric: exact_recombined_relation_count
      direction: higher
      minimum_effect: One non-scalar verified row is required to enter map construction; no positive count is promised.
    - metric: mappable_pareto_candidate_count
      direction: higher
      minimum_effect: One explicit map-complete loop is required to enter the end-to-end panel.
    - metric: paired_end_to_end_cost_ratio
      direction: lower
      minimum_effect: 95% paired interval upper endpoint below 1.00 for a scoped advantage; below 0.80 for a material weakness candidate.
  test_boundary:
    instances:
      - Exact NIST P-192 / secp192r1 tuple and certified F_p-isogenous endpoints
      - D=-23 positive control
      - P-192 scalar, symbolic, and mutation controls
    parameters:
      centered_boxes:
        - [8, 65536]
        - [64, 1048576]
        - [256, 4194304]
      sieve_prime_bound: 65521
      mappable_prime_bound: 4093
      large_prime_bound: 2147483647
      maximum_large_primes: 2
      planned_runs: 8
    implementation: >-
      Native Rust certificate core from crypto PR #1507 plus admitted segmented
      sieve, exact partial recombination, deterministic lattice optimizers,
      explicit maps, and independent replay.  None of those runs has occurred.
    budget:
      wall_clock_seconds_per_run: 259200
      total_cpu_hours: 4096
      maximum_memory_gb: 128
      maximum_workers: 32
  falsification_conditions:
    - Any frozen identity, order, norm, orientation, count, or control fails.
    - No relation survives exact independent replay in all fully completed shells.
    - No surviving relation can be mapped and evaluated on the order-n subgroup.
    - Every mapped candidate is cost-neutral or slower after full HOT/COLD accounting.
  interpretation_limits:
    - The hypothesis is proposed and untested; prediction thresholds are decision rules, not findings.
    - Failure to finish a shell, map, solver, or matched baseline is incomplete, not falsification.
    - Deterministic-box counts are finite-census facts and do not carry sampling confidence intervals.
    - Any speed claim is implementation- and hardware-scoped unless reproduced independently.
