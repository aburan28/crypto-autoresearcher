# =============================================================================
# H-BINSTD-d09592 -- Unique-orbit relation retention after Frobenius×negation
# collapse on toy Koblitz cells. Specified from IDEA-20261002-9ff676 under
# RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001. Distinct from 0fcbe2 / cb6a72 /
# 833e78 / 9d8520. Approved DEC-20261003-be1d8e. ZERO RUNS in this design
# packet. No Magma/Sage/AUXIN. No Bedrock. No curve attack / exponent claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-d09592
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261002-9ff676
  experiment_id: EXP-BINSTD-cec99c
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-be1d8e
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-be1d8e
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-be1d8e
  proposed_by: coordinator

  title: >-
    After collapsing collected relations under ⟨Frobenius, negation⟩, unique-orbit
    yield stays ≥ 1/2 of raw yield on n=17 toy Koblitz under twin in-Python meters

  statement: >-
    CLAIM (heuristic_validation / uniqueness-retention instrument; NO ATTACK;
    NO EXPONENT). For the frozen toy Koblitz cell n=17, A=B=1, V = F_2-span
    of {1,t,t^2}, surplus s∈{1, 3/2, 2}×|#FB|: collect raw S_3 / short-walk
    relations in Python, collapse each under ⟨Frob,neg⟩, and let
    R := |orbit_unique| / |raw|. FORALL Stage-1 surplus cells, twin meters
    (orbit_a product enumeration vs orbit_b generator BFS) agree and R ≥ 1/2
    (O-SUPPORT) OR some cell has R < 1/2 (O-FAIL-BAND; orbit-collapse-destroys-yield
    at this scale). Identity-action null on the same bag has R = 1 exactly.
    Surplus floor unmet → O-INCONCLUSIVE. Twin mismatch → O-ARTIFACT.
    NO break. NO n≥131 transfer. Distinct from IDEA-20261001-0fcbe2,
    cb6a72, 833e78, 9d8520.

  mechanism: >-
    OBJECT FRAME as IDEA-20261002-9ff676. Representation: relation bags over
    the toy factor base {P : x(P)∈V} on Koblitz y^2+xy=x^3+x^2+1 / F_{2^n}.
    Operation: collect raw relations to frozen surplus, then canonicalise
    each bag under ⟨Frobenius, negation⟩. Observable: retention R.
    Dual meters: orbit_a enumerates (k,s)∈Z/n × {0,1}; orbit_b BFS-closes
    the same group from generators. Null: identity action (R≡1).
    WHAT IS NEW vs integer-only BINSTD design cards: a real in-Python
    orbit-census arithmetic trial, not a Magma-missing detector.

  assumptions:
    - Frozen V (poly span dim 3), ρ=1/2, surplus schedule, seeds, group ⟨Frob,neg⟩.
    - Collector is the in-Python S_3 + short-walk bag on the frozen FB.
    - R ≠ τ-closed FB yield (0fcbe2) ≠ orbit-attempt counts (cb6a72).
    - R ≥ 1/2 ≠ practical binary IC (KR-IC-1fcdbc).

  predictions:
    - metric: unique_orbit_retention_R
      direction: lower_bounded
      minimum_effect: '≥ 1/2 at each Stage-1 surplus cell under twin agreement'
    - metric: raw_relation_count
      direction: lower_bounded
      minimum_effect: '≥ s·|#FB| raw relations per surplus cell'
    - metric: null_identity_orbit_R
      direction: same
      minimum_effect: 'null R = 1 exactly'
    - metric: twin_orbit_agreement
      direction: same
      minimum_effect: 'orbit_a unique count = orbit_b unique count on every bag'

  test_boundary:
    instances:
      - 'Stage 0: freeze V/ρ/surplus/seeds/group; twin conjugate probe; identity null'
      - 'Stage 1 authorized: n=17 surplus cells s∈{1, 3/2, 2}×|#FB|'
    parameters:
      rho_numer: 1
      rho_den: 2
      ell: 3
      catalog_seed: 2026100311
      collect_seed: 2026100312
      moduli:
        listed_as_rows: true
        n_17: t^17+t^3+1
        n_23: t^23+t^5+1
        n_31: t^31+t^3+1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-cec99c/implementation/;
      command surface implementation/run.py driven by trial-plan-v1.json.
      Dual meters orbit_a.py and orbit_b.py (must not import each other).
      No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Twin meters disagree on any bag (O-ARTIFACT; table void).
    - Reading O-SUPPORT/O-FAIL-BAND without surplus floor.
    - Editing ρ after seeing retentions.
    - Claiming practical binary IC or an exponent move from a toy R band.
    - Transferring the band to n≥131 without a new contract.
    - Equating this meter with τ-closed yield (0fcbe2) or walk √(2n) (833e78).
    - Using Magma/Sage absence as the scientific outcome.

  distinguishable_outcomes:
    - id: O-SUPPORT
      meaning: >-
        Twins agree; surplus floors met; identity null R=1; R ≥ 1/2 on every
        Stage-1 surplus cell. Uniqueness retention holds at this toy. No attack.
    - id: O-FAIL-BAND
      meaning: >-
        Twins agree; floors met; some cell R < 1/2. Recorded as
        orbit-collapse-destroys-yield at this scale.
    - id: O-INCONCLUSIVE
      meaning: Raw count below the surplus floor after the budgeted catalog.
    - id: O-ARTIFACT
      meaning: Twin disagreement, null R≠1, or freeze/regression failure.
    - id: O-IMPEDIMENT
      meaning: Timeout/crash/missing Stage-0 freeze. Never negative evidence.
    - id: O-STAGE0-OK
      meaning: Stage-0 freeze + twin probe passed; not a hypothesis verdict.

  interpretation_limits:
    - Uniqueness retention only; does not claim LA rank or solve-time win.
    - Orbit group is ⟨Frob, negation⟩ only.
    - Stage-2 n∈{23,31} not authorized under this card.
    - No attack at field degree ≥ 131. ECC2K-130 is not an instance.

  heuristic_assumptions:
    - id: HEUR-BINSTD-9ff676-H1
      formal_statement: >-
        FORALL Stage-1 surplus cells on n=17 with frozen V:
        R := |orbit_unique|/|raw| ≥ 1/2 with ρ frozen at Stage 0.
      random_model_justification: >-
        KR-IC-b0fcda argues Frobenius identifies equivalent relations on
        Koblitz curves. If the collector does not dump full 2n-orbits,
        retention stays bounded below by a positive ρ; ρ=1/2 is the
        pre-registered toy band, not 1/(2n) (the full-orbit dump control).
      supporting_results:
        - KR-IC-b0fcda
        - KR-IC-1fcdbc
        - IDEA-20261002-9ff676
      validation_experiment_ids:
        - EXP-BINSTD-cec99c
      falsification_condition: >-
        R < 1/2 at a completed surplus cell (O-FAIL-BAND), OR twin failure
        (O-ARTIFACT), OR raw count below surplus (O-INCONCLUSIVE).

  structural_ingredients:
    - description: >-
        Binary Koblitz group law y^2+xy=x^3+Ax^2+B and the Frobenius
        (x,y)↦(x^2,y^2) with negation (x,y)↦(x,x+y).
      citation: ledger/proposals/IDEA-20261002-9ff676.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-03 (in-Python curve.py)
      role: the group action whose orbits the meters count
    - description: >-
        KR-IC-b0fcda Frobenius-invariant FB / systems/n guidance, as the
        nearest frontier row named by the idea (not a retention band).
      citation: KR-IC-b0fcda
      provenance: internal
      verified_by: IDEA-20261002-9ff676 prior_art block
      role: adjacent prior art; this H only adds the ρ retention meter

  reduction_chain:
    core_problem: Unique-orbit retention R vs frozen ρ=1/2 on n=17 toys
    corollaries: []

  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity improvement is claimed. Uniqueness-retention instrument only.

  proof_search_map:
    bottleneck: >-
      Whether collapsing collected relations under ⟨Frob,neg⟩ retains ≥1/2
      of raw yield on the n=17 toy, as measured by two independent orbit
      census routes.
    baseline_embedding:
      parameter_slice: >-
        n=17, A=B=1, V=span{1,t,t^2}, first S_3/walk bag; orbit_a and
        orbit_b must agree on unique count before any ρ reading.
      reproduction_check: >-
        Independent check.py recomputes both meters on the Stage-0 probe
        and Stage-1 panels; refuses n-as-object-key JSON; refuses band
        outcomes without surplus floors; refuses Magma-missing as a verdict.
    observation_collision:
      observable: the pair (|orbit_unique|, |raw|) per surplus cell
      distinct_preimage_search: >-
        Identity-action null must keep R=1; a bag of four Frobenius
        conjugates of one relation must unique-count as 1.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: canonical representatives under ⟨Frob,neg⟩
        predicted_gain: >-
          A decidable O-SUPPORT/O-FAIL-BAND (or honest O-INCONCLUSIVE)
          without Magma and without an exponent claim.
    quantifier_order: >-
      FORALL Stage-1 surplus cells on n=17: twins THEN surplus floor THEN
      R ≥ 1/2 predicted. NOT CLAIMED: n∈{23,31} under this card; n≥131;
      any attack; τ-closed yield.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the named n=17 toy, either surplus fails (O-INCONCLUSIVE) or
        R vs 1/2 decides support/fail with twins and a passing identity null.
      nearby_object_control: >-
        Identity-action null (R=1); full-orbit dump would sit near 1/(2n)
        which is below 1/2 and would read O-FAIL-BAND if it occurred.
    proof_obligations:
      - claim: Twin orbit meters agree on every measured bag.
        responsibility: baseline
      - claim: Identity-action null has R=1.
        responsibility: baseline
      - claim: Surplus floors gate any band verdict.
        responsibility: success_probability
      - claim: Nothing asserted at n≥131.
        responsibility: scope

  dominated_by: >-
    CHECKED KR-IC-b0fcda dominates as the Frobenius-invariant FB /
    systems/n guidance; this record only adds a frozen unique-orbit
    retention band after collapsing collected relations. Not dominated
    by 0fcbe2/cb6a72 (different observables).

  sota_delta:
    time: n/a — no attack
    memory: n/a
    data_queries: >-
      First pre-registered ρ=1/2 unique-orbit retention trial with in-Python
      dual orbit census on RQ-BINSTD toys, separated from τ-closed yield,
      attempt counting, and rho walk constants.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
