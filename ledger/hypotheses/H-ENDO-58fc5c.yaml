hypothesis:
  id: H-ENDO-58fc5c
  question_id: RQ-MODEL-e61cb2
  idea_id: IDEA-20260905-3c4579
  statement: >-
    Over Q with the standard grading and window D = 4, the denominator-torsion
    module T = (I : d^infinity) / I has truncated dimensions h_j = dim T_j as
    follows. For I = (0) and d = 1, every h_j is 0. For R = Q[x], I = (x^2)
    and d = x, the dimensions are 1, 1, 0, 0, 0 and the module has finite
    length. For R = Q[x,y], I = (x^2) and d = x, the dimensions are 1, 2, 2,
    2, 2 and the module is not finite length. A two-point fixture that drops
    the point on the denominator locus preserves one point rather than two.
    No solving-degree comparison is claimed.
  mechanism: >-
    Compute a monomial basis of (I : d^infinity) / I in degrees 0 through 4.
    The null uses d = 1. The finite-length cell is Q[x]/(x^2) with d = x.
    The unbounded cell is Q[x,y]/(x^2) with d = x, whose classes are spanned
    by 1 in degree 0 and by y^j and x y^{j-1} in degree j >= 1. The
    known-false fixture lists two affine points and deletes the one with
    x = 0.
  assumptions:
    - The coefficient field is Q and the grading is the standard total degree.
    - The window stops at degree 4. Dimensions past that window are not called zero.
    - Equal annihilation exponent does not imply equal truncated profiles.
  proof_search_map:
    bottleneck: >-
      Separating a finite-length denominator-torsion module from one with
      unbounded support inside one frozen degree window.
    baseline_embedding:
      parameter_slice: >-
        I = (0) and d = 1 in Q[x], window degrees 0 through 4.
      reproduction_check: >-
        Every truncated dimension is 0.
    observation_collision:
      observable: the tuple (h_0, h_1, h_2, h_3, h_4) and the finite-length flag
      distinct_preimage_search: >-
        The two modules Q[x]/(x^2) and Q[x,y]/(x^2), both with d = x and
        annihilation exponent 2, must not share that tuple.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: the truncated dimensions of (I : d^infinity) / I
        predicted_gain: >-
          Distinguishes the finite-length cell from the unbounded cell
          inside the window.
    quantifier_order: >-
      For these three rings and this window, quantify over degrees 0
      through 4. One mismatched dimension refutes the stated profile.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact dimensions and the finite-length flag for these three modules,
        plus a two-point completeness failure.
      nearby_object_control: >-
        The d = 1 module is the zero profile. Dropping the boundary point
        must fail the two-point count.
    proof_obligations:
      - claim: the null profile is identically zero
        responsibility: baseline
      - claim: the two d = x profiles differ inside the window
        responsibility: correctness
      - claim: dropping x = 0 changes the preserved point count from 2 to 1
        responsibility: interface
      - claim: no solving degree is inferred
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        Solving degree, first and last fall degree, and regularity are
        different invariants. This hypothesis does not identify the torsion
        profile with any of them.
      citation: IDEA-20260905-3c4579
      provenance: internal
      verified_by: >-
        TASK-20260905-551da2, citation block of IDEA-20260905-3c4579, which
        records Caminata and Gorla, arXiv:2112.05579v2, as retrieved
      role: separation of degree invariants
  reduction_chain:
    core_problem: >-
      The truncated dimensions of three explicit denominator-torsion modules.
    corollaries: []
  predictions:
    - metric: null_profile
      direction: lower
      minimum_effect: all five dimensions are 0
    - metric: finite_profile
      direction: different
      minimum_effect: dimensions 1, 1, 0, 0, 0 and finite length
    - metric: unbounded_profile
      direction: different
      minimum_effect: dimensions 1, 2, 2, 2, 2 and not finite length
    - metric: preserved_points_after_drop
      direction: lower
      minimum_effect: 1, against a fixture of 2 points
  test_boundary:
    instances:
      - Q[x] with I = (0) and d = 1
      - Q[x] with I = (x^2) and d = x
      - Q[x,y] with I = (x^2) and d = x
      - affine points (0, 0) and (1, 0), dropping x = 0
    parameters:
      degree_window: 4
      coefficient_field: Q
    implementation: >-
      Exact monomial linear algebra for these three modules. No curve
      search and no Groebner run on a cubic model.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 2
      maximum_runs: 1
  falsification_conditions:
    - >-
      Any stated dimension differs from the value computed in the window.
    - >-
      The finite-length and unbounded profiles are equal on degrees 0
      through 4.
    - >-
      The null profile has a positive dimension. That invalidates the
      baseline.
  interpretation_limits:
    - These profiles do not imply a solving-degree bound.
    - The result is only for these rings, this grading, and degrees 0 through 4.
    - GOAL-ENDO-001 next_action still names EXP-JINV-bd141d. This hypothesis does not replace that task.
  status: specified
  proposed_by: coordinator
