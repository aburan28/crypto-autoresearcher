# =============================================================================
# H-VOLC-5f03b6 -- Problem B toy cost map (direct descent governed by the
# N-torsion field degree k; blind guessing governed by the floor-class count).
# Specified from IDEA-20261003-e3ce5b; approved for experiment by
# DEC-20261003-d35016 under the AGENTS.md standing authorization. Approval is
# not evidence. No asymptotic-complexity claim is made by this record.
# =============================================================================
hypothesis:
  id: H-VOLC-5f03b6
  question_id: RQ-VOLC-f6253b
  proposal_id: IDEA-20261003-e3ce5b
  goal_id: GOAL-ENDO-001
  added: '2026-10-03'
  title: >-
    Problem B at toy scale follows two separable cost laws: direct descent in
    Theta(k log2 p + N) F_{p^k}-multiplications with k = ord_N(t/2), and blind
    guessing in p^2/((p-1) #S2) draws independent of N and k; hard direct
    instances are exactly the large-k ones.
  statement: >-
    SCOPE: ordinary E0/F_p with End(E0) = O_K, h(D0) = 1, D0 in {-7, -43}
    (primary) and D0 = -3 (secondary, descriptive), t^2 - 4p = f^2 D0,
    f = N v, N an odd prime with gcd(N, v D0) = 1, p <= 2^40, instances from
    the frozen CM generator of EXP-VOLC-3fee23, classic Velu, python-flint
    F_{p^k} arithmetic. Let a = t * 2^{-1} mod N, k = ord_N(a),
    chi = (D0 / .), and #S2 = (N - chi(N)) * sum_{d | v} h(O_d) the number of
    F_p-isomorphism classes of trace-t curves whose endomorphism ring has
    conductor divisible by N (the N-floor).
    (L1, DIRECT) The direct construction of a descending N-isogeny from E0
    (order-N point in E0(F_{p^k}) plus classic Velu) uses
    M_mult = c1 * k * log2 p + c2 * N (1 + o(1)) instrumented
    F_{p^k}-multiplications, with c1, c2 constants fixed on a separate
    calibration set; the cost is governed by k and N separately, and the ~N^2
    of Galbraith 2024 Sec. 10 is its k ~ N slice.
    (L2, BLIND GUESSING) The number of uniform (a, b) in F_p^2 drawn, with the
    twist trick, until the first certified N-floor curve is geometric with mean
    p^2 / ((p-1) #S2), hence ~ p/f ~ q^{1/2}, and does not depend on N or k
    beyond #S2.
    (L3, BIASED GUESSING, secondary) Drawing from the X_1(m) family, one-sided,
    divides the one-sided uniform draw count by the target-set average of
    r_m(E) = number of points of exact order m in E(F_p), when m divides
    p + 1 - t; when gcd(m, f) = 1 that average is r_m(E0) = phi(m). (For
    h(D0) = 1, D0 < -4 and 2 not dividing f, #E(F_p) is odd or 2 mod 4, so
    the even m are tested at D0 = -7 where 2 divides f.)
    (L4, METHOD CEILING, heuristic HEUR-5f03b6-K) For unsteered instances k is
    distributed as the order of a uniform element of F_N^*, so k = Theta(N)
    typically and the cheap direct case is a thin subfamily.
    No asymptotic improvement of Problem B is claimed. Claim tier toy.
  mechanism: >-
    DERIVATION (checkable, single-responsibility; proof_status derivation).
    LEMMA 1 (Frobenius is scalar on E0[N]). In O_K, pi = (t + f sqrt(D0))/2.
    Put a in Z with 2a = t mod N. Then 2(pi - a) = (t - 2a) + N (f/N) sqrt(D0)
    lies in N O_K, and since N is odd, pi - a lies in N O_K = N End(E0). An
    endomorphism that is N times an endomorphism kills E0[N], so pi acts on
    E0[N] as the scalar a. Since pi pi-bar = p and both reduce to a, a^2 = p
    mod N. LEMMA 2 (rationality and counts). Every line of E0[N] is pi-stable,
    so all N + 1 cyclic N-subgroups are F_p-rational and Velu returns F_p
    codomains. Exactly 1 + chi(N) of them are horizontal; h(D0) = 1 puts their
    codomains at j = j0; the remaining N - chi(N) descend to conductor N.
    LEMMA 3 (field of definition). E0[N] is contained in E0(F_{p^j}) iff pi^j
    acts trivially on E0[N] iff a^j = 1 mod N; the least such j is k.
    LEMMA 4 (direct cost). A point of order N in E0(F_{p^k}) costs one random
    point (Euler test plus square root, O(k log2 p) mults by square-and-
    multiply) and one cofactor multiplication by #E0(F_{p^k})/N^e
    (O(k log2 p) mults); a uniformly random line of E0[N] needs a basis, whose
    independence check is a BSGS discrete log in a cyclic group of order N
    (O(sqrt N)); Velu needs the (N-1)/2 multiples of the kernel generator and
    two Galois-invariant sums (O(N)). Total O(k log2 p + N) F_{p^k}-mults.
    LEMMA 5 (floor certificate). If v_N(f) = 1 and N divides the conductor of
    End(E1), then (pi - a)/N is not in End(E1), so pi acts on E1[N] as a
    non-scalar with characteristic polynomial (x - a)^2, i.e. a Jordan block;
    pi^k then acts as [[1, k a^{-1}], [0, 1]], which is not the identity
    because 0 < k < N. So E1(F_{p^k})[N] is a single line and the N-Sylow
    subgroup of E1(F_{p^k}) is cyclic, of order N^e with N^e exactly dividing
    #E1(F_{p^k}) = p^k + 1 - V_k (V Lucas sequence of t, p). On the crater
    E(F_{p^k})[N] has rank 2, so no point of order N^e exists. A point of
    order N^e is therefore a one-sided certificate of the floor.
    LEMMA 6 (guessing law). For D0 < -4 every curve in the class has
    Aut = {+-1}, so each F_p-isomorphism class has exactly (p-1)/2
    representatives (a, b) under (a, b) -> (u^4 a, u^6 b). The trace-t floor
    has #S2 classes and the trace-(-t) floor (twists) another #S2; with the
    twist trick a uniform draw succeeds with probability (p-1) #S2 / p^2. With
    h(O_d) = d prod_{l | d} (1 - chi(l)/l) (unit index 1),
    sum_{d | N v} h(O_d) = H and the floor count is
    #S2 = (N - chi(N)) sum_{d | v} h(O_d), equal to v (N - chi(N)) when every
    prime of v splits in K. LEMMA 7 (X_1(m) weights, for L3). A uniform
    parameter of the m-torsion family hits class E in proportion to the number
    of (E, +-P) pairs, giving probability r_m(E)/(2p) per draw against 1/(2p)
    uniform; when gcd(m, f) = 1 all curves of the class share r_m. ASSEMBLY.
    L1 = Lemmas 1-4 with instrumented constants; L2 = Lemma 6; L3 = Lemma 7;
    certificates = Lemma 5.
  assumptions:
    - The class-number formula for orders and the Kohel volcano structure (levels by v_N of the conductor) as standard; the implementation cross-checks them through Lemma 5 certificates and codomain trace checks, so a misremembered statement fails visibly.
    - Velu's formulas as standard; every codomain is checked for trace t and every evaluation map for additivity, so a wrong formula cannot pass silently.
    - Python random.Random seeded per the frozen derivation is an adequate uniform source at these sizes; C3 tests it.
  proof_search_map:
    bottleneck: >-
      Producing an F_p-rational N-floor curve with an evaluable descending map
      from E0; in the direct method the expensive input is a generator of an
      order-N subgroup, which lives in E0(F_{p^k}).
    baseline_embedding:
      parameter_slice: >-
        A1 at k = N - 1 (S1, N = 241, k = 240) is Galbraith's construct-the-
        isogeny baseline; A2 at every S3 cell is Galbraith's guess-a-floor-
        curve baseline.
      reproduction_check: >-
        Frozen regression fixtures are the S1 k = 240 cell and the S3 cells,
        run and verified before any small-k cell is interpreted.
    observation_collision:
      observable: >-
        Floor certificate of Lemma 5 plus #E1(F_p) = p + 1 - t; for v = 1 also
        j(E1) != j0.
      distinct_preimage_search: >-
        Collisions identified before compute: same group order across the whole
        class; for k != 1 no F_p group-structure invariant sees N at all; for
        v > 1 the crater has v curves, so j(E1) != j0 is not a floor test. The
        Lemma-5 certificate separates crater from floor in every case; the
        nearby objects C1 and C1b test that it does. Literature collision: small
        k is the condition that N divides p^j - 1 for small j, an embedding-
        degree-like condition on N; whether Galbraith 1999 or 2024 state the
        k-dependence is NOT VERIFIED (KN-LIT-7630 PDF not read this session;
        ePrint 2024/924 not vendored).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: instances with fixed (p bits, N = 241) and k ranging over divisors of N - 1
        predicted_gain: Separates the k-term from the N-term of the direct cost. No exponent gain.
    quantifier_order: >-
      FOR EACH generated instance (E0, N): M_mult(A1) <= c1 k log2 p + c2 N
      times (1 + o(1)), where k depends on (p, t, N) and is not chosen by the
      algorithm; FOR EACH instance, E[draws(A2)] = p^2/((p-1) #S2). No
      statement FOR ALL (E0, N) that Problem B is O~(N): the cheap set is
      {k <= K}, whose density is sum over d | N-1, d <= K of phi(d)/(N-1)
      under HEUR-5f03b6-K.
    method_ceiling:
      strongest_certifiable_claim: >-
        A certified toy cost law for A1, A2, A3 on the frozen distribution.
        Classic Velu keeps A1 at Omega(N) even at k = 1, and k ~ N on typical
        instances keeps A1 near N^2 polylog F_p-ops, so min(N^2, q^{1/2}) is
        untouched in the worst case.
      nearby_object_control: >-
        C1 floor-start null (same class, no descending N-isogeny exists), C1b
        a curve whose conductor is not divisible by N, C2 smooth-conductor
        class with no large prime under the same sampler and metric.
    proof_obligations:
      - claim: Lemma 1 to Lemma 3 (scalar Frobenius, rationality, field of definition).
        responsibility: correctness
      - claim: Lemma 5 (floor certificate is one-sided and sound).
        responsibility: correctness
      - claim: Lemma 4 bookkeeping matches the instrumented counter.
        responsibility: runtime
      - claim: Lemma 6 per-draw probability; Lemma 7 family weights.
        responsibility: success_probability
      - claim: Verifier shares no Velu, scalar-multiplication, or point-counting routine with the solver.
        responsibility: interface
      - claim: Every conclusion carries p <= 2^40, the D0 set, classic Velu, and python-flint.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. L1-L4 are toy-scale cost laws with fitted constants,
    not an asymptotic-complexity claim about Problem B. Any later restatement
    as an asymptotic claim (for example O~(N) on a small-k family) must pass
    the four promotion gates of agents/coordinator.md before moving toward
    supported.
  heuristic_assumptions:
    - id: HEUR-5f03b6-K
      formal_statement: >-
        For the EXP-VOLC-3fee23 generator with t unsteered (t uniform on its
        admissible range given (N, v, parity) and conditioned on p prime), the
        residue a = t/2 mod N satisfies |Pr[a = x] - 1/(N-1)| = o(1/N)
        uniformly in x in F_N^*, hence Pr[k = d] = phi(d)/(N-1) for d | N-1.
      random_model_justification: >-
        Model: a uniform element of the cyclic group F_N^*. The admissible t
        range has length >> N for alpha < 1/2 and about 2 sqrt(|D0|) N at
        alpha = 1/2, so t mod N is near-uniform before conditioning; the
        conditioning on p = (t^2 + |D0| f^2)/4 prime is assumed independent of
        t mod N.
      supporting_results: []
      supporting_results_note: >-
        Empty on purpose. The rigorous half (equidistribution of intervals mod
        N) is elementary; the independence from primality is the heuristic half
        and its classical analogue (prime values of quadratic polynomials in
        residue classes) is only a recalled pointer, which may not discharge
        this field (AGENTS.md rule 9).
      validation_experiment_ids:
        - EXP-VOLC-3fee23
      falsification_condition: >-
        In the K-census, |z| > 6 for the count of instances with
        k <= floor(sqrt N) against its instance-wise prediction, or the mean
        of k/(N-1) differing from its prediction by more than 0.05 with the
        bootstrap CI excluding the prediction.
    - id: HEUR-5f03b6-X1
      formal_statement: >-
        For m in {2, 3, 4, 5, 7} and the frozen family models (m = 2:
        y^2 = x^3 + A x^2 + B x; m = 3: y^2 + a1 x y + a3 y = x^3; m = 4, 5, 7:
        Tate normal form with c = 0, b = c, and b = d^3 - d^2, c = d^2 - d),
        a uniform parameter yields a curve F_p-isomorphic to a fixed E with
        Aut = {+-1} with probability r_m(E)/(2p) (1 + O(p^{-1/2})).
      random_model_justification: >-
        Derived counting, not a random model: each (E, +-P) pair with P of
        exact order m corresponds to the same number of parameter values
        (one for the one-parameter Tate forms, (p-1)/2 or p-1 for the scaled
        two-parameter models), and the parameter space has about p (or p^2)
        points. Status: derived in this record, not read in a source.
      supporting_results: []
      validation_experiment_ids:
        - EXP-VOLC-3fee23
      falsification_condition: >-
        In C3b, a chi-square p-value below 1e-6 for the full class-frequency
        distribution at p = 4093 for any m, or |z| > 6 for a 20-bit class-hit
        count (m in {3, 5, 7}); or an S4 cell speedup outside [0.25, 4] times
        its frozen prediction with the CI disjoint from [0.5, 2].
