    - description: Velu 1971 isogeny formulas; class-number formula for imaginary quadratic orders; Kohel volcano structure.
      citation: Velu 1971 (C. R. Acad. Sci.); Cox, Primes of the form x^2 + n y^2; Kohel 1996 thesis
      provenance: recalled
      verified_by: null
      role: >-
        POINTER ONLY; standard facts the implementation re-checks through trace
