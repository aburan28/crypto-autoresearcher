  reduction_chain: null
  predictions:
    - metric: S1 OLS slope of log M_mult vs log k on k-dominated cells
      direction: different
      minimum_effect: point estimate in [0.8, 1.2]
    - metric: S1 per-cell mean M_mult / (c1 k log2 p + c2 N)
      direction: different
      minimum_effect: in [0.5, 2] for every k-cell
    - metric: S2 OLS slope of log M_mult vs log N (k fixed effects)
      direction: different
      minimum_effect: point estimate in [0.8, 1.2]
    - metric: S3 per-cell mean draws / mean exact prediction
      direction: different
      minimum_effect: in [1/1.5, 1.5] for every cell
    - metric: S3 OLS slope of log mean draws vs log p per (alpha, D0) series
      direction: different
      minimum_effect: point estimate in [0.4, 0.6]
    - metric: S3 partial slope of log draws on log N controlling for log prediction
      direction: different
      minimum_effect: point estimate in [-0.1, 0.1]
    - metric: S4 speedup (one-sided A2 mean / A3 mean) / target-set mean of r_m
      direction: different
      minimum_effect: in [0.5, 2] for every cell
  test_boundary:
    instances:
      - CM instances with D0 in {-7, -43} (primary) and -3 (secondary), h(D0) = 1, generated by the EXP-VOLC-3fee23 generator
      - p in [2^19, 2^40); N from 23 to about 4e5
    parameters:
      master_seed: 20261003
      bootstrap_seed: 20261004
      bootstrap_resamples: 10000
      S1_N: 241
      S1_k: [1, 2, 4, 8, 16, 24, 48, 80, 120, 240]
      S2_alpha: [0.25, 0.33, 0.40, 0.50]
      S3_p_bits: [20, 24, 28, 32, 36]
      S4_m: [2, 3, 4, 5, 7]
    implementation: experiments/EXP-VOLC-3fee23/specification.yaml
    budget:
      enforcement: advisory
      maximum_memory_gb: 8
  falsification_conditions:
    - S1 slope point estimate below 0.5 or above 1.5 with its 95% bootstrap CI disjoint from [0.8, 1.2] (the direct cost is not k-governed).
    - S2 slope point estimate above 1.5 at k <= 2 with its 95% bootstrap CI disjoint from [0.8, 1.2].
    - Any S3 cell with mean draws / prediction outside [0.5, 2] and its 95% CI disjoint from [1/1.5, 1.5]; or the S3 partial slope on log N with absolute value above 0.2 and its CI disjoint from [-0.1, 0.1]; or an S3 p-slope outside [0.3, 0.7] with its CI disjoint from [0.4, 0.6].
    - A failed certificate, a failed blocking control, or a Stage-0 verification failure makes the affected run invalid or the instrument inconclusive; it never falsifies this hypothesis (AGENTS.md rule 5).
  interpretation_limits:
    - Toy scale, p <= 2^40, classic Velu, python-flint arithmetic. No transfer to cryptographic p is asserted; any extrapolation must be argued separately.
    - Does not answer KN-OPEN-f2f6dc (b) and claims no o(q^{1/2}) Problem-B algorithm.
    - A2 measures Problem B in Galbraith's form (some floor curve). The strict form (the image of an N-isogeny from E0) is reached by the ascent only with rate about 1/v; strict-form guessing cost is reported as MODELED only.
    - The k-dependence is plausibly folklore; nothing here is a novelty claim.
    - D0 = -3 results are descriptive and enter no criterion.
