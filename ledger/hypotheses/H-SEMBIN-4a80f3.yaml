  what_this_hypothesis_does_not_claim:
    - Any statement about the security of B-163, B-233, B-283, B-409, B-571 or any other curve.
    - >-
      That Nagao's Theorem 1 is wrong. C2 and C3 concern applicability at deployed
      parameters; only C1 bears on the theorem itself, and it does so by attacking the
      parameter choice in the theorem's own hypothesis.
    - >-
      That Proposition 5 holds or fails. Granted throughout, tested by
      IDEA-20260913-352163 instead.
    - >-
      Any number attributable to Nagao. Every figure this produces is this program's
      arithmetic under this program's enumeration of the absorbed terms.
