hypothesis:
  id: H-SEMBIN-4a80f3
  question_id: RQ-SEMBIN-9e8f82
  proposal_id: IDEA-20260913-41c4f0
  goal_ids: [GOAL-SEMBIN-5078bc]
  statement: >-
    Nagao 2015/984's Theorem 1 -- ECDLP over F_{2^n} in O(n^{8w+1}) under the first
    fall degree assumption -- has no concrete consequence for any standardised binary
    curve, and its polynomiality does not survive its own parameter constraint. Three
    falsifiable claims.

    C1 (THE PARAMETER IS NOT A CONSTANT). Theorem 1 requires k = C_0 fixed
    independently of n. Nagao's own correctness condition -- that no coset factor base
    Fb_i is empty, so that prod_i #Fb_i ~ p^n -- is a coupon-collector condition over
    m ~ n/C_0 cosets of expected size p^{C_0}. It forces C_0 to grow with n. If
    C_0 = Omega(log log n) at minimum, then k is not constant, m ~ n/C_0 is not
    Theta(n), and #Fb = m p^{C_0}/1 is not O(n); Theorem 1's exponent is not the stated
    one. This is decidable in closed form from the paper's own parenthesis.

    C2 (MEMORY IS WHERE IT DIES). The paper never mentions memory. The degree-4
    Macaulay block on N = n(m-1) ~ n^2/C_0 Boolean variables is the entire cost, and
    charged as memory -- C(N+4,4) columns -- the time x memory product exceeds van
    Oorschot-Wiener parallel rho at its OWN Pareto minimum at every FIPS binary label
    n in {163, 233, 283, 409, 571}, for every omega in {2.376, 2.807, 3.0}. Under
    time-only charging a crossover may exist below n = 571; under any metric charging
    memory it does not.

    C3 (C_0 DOMINATES OMEGA). Across the defensible range of C_0 -- bounded below by
    C1's constraint -- the spread in charged cost at n = 571 exceeds the spread across
    the committed omega set, which is 46 bits. A single-C_0 crossover number is
    therefore not a well-defined deliverable and the honest answer is a surface. This
    is EXP-SEMBIN-f4a17b's own framing-failure condition (EV-SEMBIN-71e5cd O-9)
    applied in advance rather than discovered again.
  mechanism: >-
    Theorem 1 is arithmetic once its inputs are fixed, so the whole distance between
    "polynomial time algorithm" (the author's own ePrint keyword) and "no consequence
    at any deployed parameter" lives in the terms the O(.) and the o(1) absorb. Nagao
    says so himself, in capitals, in Section 6: "Many complicated terms are included
    into the o(1) term and so for normal size input n, o(1) has HUGE value although
    lim_{n->infinity} o(1) = 0."

    Five absorbed terms carry it, and each becomes a named column:

      T1  monomial count. Lemma 2 charges O(N^{d_F}); the honest count at d_F = 4 is
          C(N+4,4) ~ N^4/24, and the linear algebra costs its square in the accounting
          family the SEMBIN validator reconciled against the frozen Semaev source's own
          Tables 1-2. Both readings are reported.
      T2  the linear-algebra constant. w ~ 2.7 is asserted; the committed set is
          omega in {2.376, 2.807, 3.0}, over which n^{8w+1} spans n^{20.0} to n^{25.0}
          -- 46 bits at n = 571.
      T3  the coset constant p^{C_0}/C_0, which multiplies the relation count, and
          C_0 inside the base as (n^2/C_0)^{4w}. It pulls both ways, which is why C3
          is a claim rather than an aside.
      T4  yield. "Probability that decomposition success is O(1)" is not 1: expected
          solution count ~1 gives ~1 - 1/e ~ 0.632 under a Poisson heuristic, and the
          inverse enters multiplicatively.
      T5  memory, absent from the source entirely, and by C2 decisive.

    The comparison is against vOW charged at the Pareto minimum of its own
    time-memory curve T = W(1/M + 1/w), Mem = 3n max(w, M), NOT at a single operating
    point. That is not a refinement: O-6 of EV-SEMBIN-71e5cd measured that charging vOW
    the memory of a 2^30-point store and the time of one processor -- two different
    points on one curve -- overcharges it by exactly 29.0 bits at n = 283, 310, 409 and
    571 alike, and O-7 measured that correcting it moves the Semaev crossover 85 in n.
    Reusing the uncorrected baseline call would silently reproduce the largest single
    defect the review round found.
  assumptions:
    - >-
      PROPOSITION 5 AND THE FIRST FALL DEGREE ASSUMPTION ARE GRANTED, NOT TESTED. This
      hypothesis costs Theorem 1 as stated. Proposition 5 -- which Nagao states with
      the proof omitted -- is the subject of IDEA-20260913-352163 and is not tested
      here. Every cost produced is therefore CONDITIONAL and is labelled so.
    - >-
      d_F = 4 for the characteristic-2 branch and 3p+1 for the odd branch, as Nagao's
      Propositions 2 and 5 state. The known-false control varies d_F to 5 precisely
      because this is an assumption.
    - >-
      C(N+d,d) is the honest monomial count and its square the honest linear-algebra
      width in the accounting family already reconciled against measurements. Nagao's
      N^{d_F} is the loose form; both are carried and neither is privileged.
    - >-
      The Poisson heuristic converting an expected solution count of ~1 into a success
      probability of ~1 - 1/e is a heuristic. It is HEUR-2 and is numbered rather than
      assumed silently.
    - >-
      x-coordinates of E(F_{p^n}) points are equidistributed over F_{p^n} well enough
      that the count of points with x in a fixed coset of a k-dimensional F_p-subspace
      behaves binomially with mean ~ p^k. This is what makes C1's coupon-collector
      argument go through, and it is HEUR-1.
  proof_search_map:
    bottleneck: >-
      Which terms Theorem 1's O(.) and o(1) absorb. Not an algorithmic step: the
      theorem's arithmetic is mechanical given its inputs, and nobody has written the
      inputs down.
    baseline_embedding:
      parameter_slice: >-
        C_0 = k with m = n/k and the m! yield restored. At that slice Nagao's Section 7
        accounting IS Semaev's Section 4.3 accounting, since disjointness of the cosets
        is the only structural difference between them, and the already-costed Semaev
        bound is an exact boundary case rather than a separate object.
      reproduction_check: >-
        COST-SEMBIN-8d123b's Semaev figures as corrected by CORR-20260913-53739b,
        reproduced cell for cell as a frozen gate before any Nagao cell is reported,
        and the degenerate slice above returning them. A pipeline that cannot reproduce
        the number it was built for has not been shown to compute anything.
    observation_collision:
      observable: >-
        the signed margin in bits between charged Nagao cost and charged vOW cost at a
        given (n, omega, C_0, metric, monomial-count reading).
      distinct_preimage_search: >-
        Two defensible (C_0, omega) pairs giving the SAME margin at n = 283 but
        OPPOSITE orderings at n = 571. If such a pair exists, a single crossover number
        is not well defined and C3 is established by construction rather than by
        measurement.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          the cost as a log2-domain sum of separately reportable named terms T1-T5
          rather than one closed form
        predicted_gain: >-
          each absorbed factor becomes a column a reviewer can attack alone, and the
          C_0 and omega sensitivities are readable off the table
      - transform: boundary_lift
        proposed_object: >-
          the coupon-collector lower bound on C_0, lifted from Nagao's qualitative
          parenthesis to a quantitative constraint
        predicted_gain: >-
          if it forces C_0 = Omega(log n), Theorem 1 is not polynomial as stated -- a
          refutation from the paper's own footnote with no computation, which is why
          ARM C runs first
    quantifier_order: >-
      Theorem 1 asserts: THERE EXISTS C and n_0 such that FOR ALL n > n_0 the cost is
      <= C n^{8w+1}. Both C and n_0 are unstated and Section 6 says C is HUGE. A table
      at n in {163,...,571} may lie entirely BELOW n_0, so it can never contradict the
      theorem; it can only establish that the theorem has no content at deployed
      parameters. Getting this order right is what keeps C2 honest -- C2 is a claim
      about applicability, not about whether Nagao is wrong. C1 is different in kind:
      it attacks the parameter choice inside the theorem's own hypothesis, so it CAN
      contradict the theorem, which is why C1 alone would need independent review
      before assertion.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Granting Proposition 5 and the first fall degree assumption, and with T1-T5
        made explicit as follows, the charged cost of Nagao Theorem 1 at
        n in {163, 233, 283, 409, 571} is [table] against vOW at its own Pareto
        minimum, giving [margins]; and Nagao's no-empty-coset condition forces
        C_0 >= [bound]." Conditional, convention-explicit, silent on the theorem's
        truth, and asserting nothing about any curve.
      nearby_object_control: >-
        Nagao's own p >= 3 branch, exponent (6p+2)w+1 from the same Proposition 2:
        n^{54.5} at p = 3, omega = 2.807. Both branches come from one formula, so a
        pipeline that gets 8w+1 right and (6p+2)w+1 wrong has hardcoded the
        characteristic-2 case and every cell it produced is void.
    proof_obligations:
      - claim: the pipeline reproduces the corrected Semaev figures cell for cell
        responsibility: baseline
      - claim: vOW is charged at the Pareto minimum of its own time-memory curve
        responsibility: baseline
      - claim: T1-T5 are named, separately reported columns, none absorbed
        responsibility: runtime
      - claim: memory is charged beside time at every cell
        responsibility: memory
      - claim: the C_0 lower bound is derived, not chosen
        responsibility: feasibility
      - claim: >-
          the deliverable states that it concerns applicability at deployed n and
          cannot contradict an asymptotic theorem whose n_0 is unstated
        responsibility: scope
      - claim: no conclusion about any curve's security
        responsibility: scope
    not_applicable_reason: null
  asymptotic_claim:
    problem: ECDLP over F_{2^n}
    prior_best: >-
      0.886 * 2^{n/2} (van Oorschot-Wiener parallel rho, charged at its own Pareto
      minimum per EV-SEMBIN-71e5cd O-6/O-7)
    claimed_by_source: O(n^{8w+1}) with w ~ 2.7 (Nagao 2015/984 Theorem 1)
    time_exponent: >-
      NOT CLAIMED BY THIS HYPOTHESIS. This hypothesis makes no complexity claim of its
      own; it audits another paper's. C1 asserts that the source's stated exponent does
      not follow from the source's own parameter constraint, which is a claim ABOUT an
      exponent rather than a new one.
    memory_exponent: >-
      Charged for the audited algorithm at C(N+4,4) with N ~ n^2/C_0, a quantity the
      source omits entirely. Reported, not claimed.
    hidden_cofactor: >-
      The five terms T1-T5 above, which is the whole subject. The source's own
      description of them is "o(1) has HUGE value".
    claim_kind: audit
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For E/F_{p^n} and a k-dimensional F_p-subspace V of F_{p^n}, the number of
        points P in E(F_{p^n}) with x(P) in a fixed coset V + v is distributed as a
        binomial count with mean ~ p^k. Consequently, for m pairwise disjoint cosets
        with k m ~ n, Pr[every Fb_i nonempty] -> 1 requires p^k = Omega(log m), i.e.
        k = Omega(log log n / log p); and the stronger condition
        prod_i #Fb_i ~ p^n that Nagao's yield argument uses requires
        k = Omega(log n / log p).
      random_model_justification: >-
        Rigorous input: Hasse's bound puts #E(F_{p^n}) within 2 p^{n/2} of p^n + 1, so
        the x-coordinate map is 2-to-1 onto a set of density ~ 1/2 in F_{p^n} up to a
        p^{-n/2} correction. Classical distribution input: the coset V + v is an
        F_p-affine subspace, and equidistribution of curve-point x-coordinates over
        such subspaces at this density is the standard index-calculus heuristic that
        Semaev's own eq. (11) and Nagao's own Section 3 probability 1/m! both already
        assume. Given that, m independent binomial counts of mean p^k all being
        nonzero is a coupon-collector condition and the bound follows.
      supporting_results:
        - >-
          Nagao 2015/984 Section 7's own parenthesis is the qualitative form of exactly
          this: "if one takes k = 1, it sometimes happens #Fb_i = empty for some i. To
          avoid such case and confirm the relation prod_i #Fb_i ~ p^n, we choose
          suitable constant C_0." Provenance retrieved, read in full this session. He
          states the problem and does not quantify it, and Theorem 1 needs it
          quantified.
        - >-
          Semaev 2015/310 Section 4.3 eq. (11) uses the same equidistribution
          heuristic for the unshifted factor base; provenance internal, read by
          TASK-20260913-da3982 and TASK-20260913-cf9d98 for
          REVIEW-SEMBIN-20260913-9d649f.
      validation_experiment_ids: [EXP-SEMBIN-db9bc3]
      falsification_condition: >-
        A derivation showing Pr[all nonempty] -> 1 at constant C_0, or an exact
        enumeration at small (n, k, m) finding no empty coset where the bound predicts
        one with probability bounded away from zero.
    - id: HEUR-2
      formal_statement: >-
        When the expected number of decompositions of a random R into one point from
        each of m disjoint cosets is lambda, the probability that at least one exists
        is 1 - exp(-lambda). At Nagao's operating point prod_i #Fb_i ~ #E gives
        lambda ~ 1 and hence success probability ~ 1 - 1/e ~ 0.632, so the inverse
        yield charged is ~0.663 bits and not 0.
      random_model_justification: >-
        The count of decompositions is a sum of weakly dependent indicators over the
        product of the m cosets; Poisson approximation is the standard model and is the
        same one Semaev's eq. (11) uses, where this program has already implemented and
        independently re-derived it (EXP-SEMBIN-f4a17b, EXP-SEMBIN-354a75).
      supporting_results:
        - >-
          Nagao 2015/984 Section 7: "the probability that decomposition success, is
          O(1)" -- which is the qualitative statement this makes quantitative, and
          O(1) is not 1. Provenance retrieved.
        - >-
          Semaev 2015/310 eq. (11), P = 1 - exp(-2^{tk-n}/t!), the same Poisson form on
          the unshifted construction; provenance internal, verified by the SEMBIN
          review round.
      validation_experiment_ids: [EXP-SEMBIN-db9bc3, EXP-SEMBIN-354a75]
      falsification_condition: >-
        Exhaustive enumeration at small (n, k, m) giving a success rate outside the
        Poisson prediction's interval, which EXP-SEMBIN-354a75 already measures for the
        unshifted case.
  predictions:
    - >-
      P1 (C1). The no-empty-coset condition forces C_0 = Omega(log log n) at minimum
      and C_0 = Omega(log n / log p) for the yield condition Nagao actually uses. At
      p = 2, n = 571 the latter gives C_0 >= ~9.2, against the "small natural number"
      the source describes, and m ~ n/C_0 ~ 62 rather than Theta(n).
    - >-
      P2 (C2, time-only). A time-only crossover EXISTS below n = 571 at omega = 2.807.
      Predicted range n in [250, 450]. This is the prediction most likely to be wrong
      and the arithmetic that decides it is the point.
    - >-
      P3 (C2, memory-charged). Under time x memory and under area-time, the charged
      Nagao cost exceeds vOW's Pareto minimum at ALL FIVE labels for ALL THREE omega,
      and no crossover exists below n = 571. Memory is where this bound dies.
    - >-
      P4 (C3). The spread in charged cost at n = 571 across defensible C_0 exceeds 46
      bits, the spread across the committed omega set.
    - >-
      P5. The reproduction gate passes: the pipeline reproduces
      COST-SEMBIN-8d123b-as-corrected to within 1e-3 bits at every cell. If it does
      not, every Nagao cell is void and the run reports an implementation failure.
    - >-
      P6. The odd-characteristic nearby object returns exponent (6p+2)w+1 -- 54.5 at
      p = 3, omega = 2.807 -- from the same code path, without a characteristic-2
      hardcode.
  test_boundary: >-
    Arithmetic in the log2 domain over n in {163, 233, 283, 409, 571}, omega in
    {2.376, 2.807, 3.0}, C_0 over a declared range, four metrics, two monomial-count
    readings, p in {2, 3, 5}. NO ELLIPTIC CURVE IS TOUCHED, no system is solved, no
    algebra engine is used, and nothing is executed against any curve. Conditional on
    Proposition 5 and the first fall degree assumption throughout. The conclusion is
    about APPLICABILITY AT DEPLOYED PARAMETERS and, by the quantifier_order above,
    cannot contradict the asymptotic theorem except through C1, which attacks the
    parameter choice inside the theorem's own hypothesis rather than its arithmetic.
  falsification_criteria:
    - >-
      C1 falsified by a derivation showing Pr[all cosets nonempty] -> 1 at constant
      C_0, or by exact enumeration contradicting HEUR-1 at small parameters.
    - >-
      C2 falsified by any memory-charging metric in the committed set giving a
      crossover below n = 571 for any omega in the committed set at any defensible
      C_0. That outcome is a claim about a standardised curve family and requires
      independent review-breakthrough at max effort under core rule 12 before it is
      asserted anywhere; it may not be degraded.
    - >-
      C3 falsified by the C_0 spread at n = 571 falling below the omega spread, in
      which case a single-C_0 crossover IS well defined and should be reported as one.
    - >-
      The whole hypothesis is void, rather than falsified, if the reproduction gate
      fails. An implementation failure is not evidence about Nagao (core rule 5).
