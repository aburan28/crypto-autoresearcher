hypothesis:
  id: H-MONO-dd666a
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260904-4f614a
  status: provably_unanswerable_on_z3_stratum_interaction_term_permanently_untestable_additive_form_not_falsified
  added: '2026-09-04'

  status_note_2026_09_04: >-
    EXP-MONO-8ec0e5 executed twice (RUN-MONO-8ec0e5-1 under the original
    O(p)-per-pair Z-determination, RUN-MONO-8ec0e5-2 under
    protocol_amendment v1_to_v2's verified-correct fast O(log p)
    splitting test) and resource-exhausted BOTH times, per
    DEC-20260904-826703 (no evidence record filed -- infrastructure
    outcomes carry no evidentiary content, AGENTS.md rule 3). The fast
    test gave a real, SR-A1-confirmed 1.55x throughput speedup but fell
    far short of completing the declared [101,2000] range within the
    900s budget; a precise extrapolation puts full-range completion at
    ~14,233s (~3.95 hours) at the measured rate. This hypothesis's own
    falsification condition remains untested, not falsified and not
    confirmed. Next action (DEC-20260904-826703): a future experiment
    generating Z=3 candidates DIRECTLY by root-pair choice (eliminating
    the ~83% of non-singular (A,B) pairs that never split at all), under
    its own newly-declared search order and its own review. This is
    recorded as an impediment on GOAL-MONO-001, not a pause (AGENTS.md
    rule 10) -- the goal and RQ-MONO-001's other open threads remain
    active.

  status_note_2026_09_05: >-
    EXP-MONO-d4840b (a third search attempt, structurally O(p^2) via
    direct root-pair enumeration) also resource-exhausted. Investigating
    why led to a major finding, confirmed by independent Validator+Red-
    Team review (TASK-20260905-495a4c) via entirely independent blind
    derivation AND exhaustive multi-prime scans (zero counterexamples
    across 18 primes): the qualifying filter (h_+>=1 AND h_->=1 AND
    max(h_+,h_-)>=2) is MATHEMATICALLY UNSATISFIABLE for every prime --
    the achievable (h_+,h_-) pairs are strictly {(0,1),(0,3),(1,0),(3,0)}
    at p=1mod4 and {(0,0),(1,1)} at p=3mod4, so h_+ and h_- can never
    both be >=1 while either exceeds 1. This fully explains all three
    resource_exhaustions: not rarity, impossibility. D_prod-D_sum is
    symbolically confirmed (by hand and sympy) to vanish identically at
    the only joint-nonzero point (1,1), for every curve. Per
    DEC-20260905-021e6e (evidence: CORR-20260905-191da0,
    KN-FIND-19f5ea): status corrected to reflect provable
    unanswerability, NOT search infeasibility -- no further search of
    any kind should be attempted on this stratum. The additive form
    itself is NOT falsified; its univariate slice (KN-FIND-edd62c)
    stands independently. The only remaining, wholly unexplored avenue
    is the non-split (Z<3) strata, named but not pursued.

  statement: >-
    SCOPE: m=4 only, symmetric-base Semaev cover, prime fields F_p, p>3,
    toy range, ordinary curves with the distinct-split (Z=3) residual
    stratum, on a curve with max(h_+, h_-) >= 2 AND both h_+ >= 1 and
    h_- >= 1 simultaneously -- the corrected joint-regime filter, proven
    by two independent reviewers to exclude the ONLY point (h_+=h_-=1)
    where the additive closed form and the named multiplicative rival
    coincide. Claim tier toy for measurement, derivation tier for the
    closed form under test.

    THE HYPOTHESIS. H-MONO-1297d7's own attempt to test the full
    bivariate closed form (D_sum = h_+ n_- + h_- n_+, both terms nonzero)
    against a named multiplicative rival (D_prod = h_+ h_- (n_++n_-))
    landed, by the fixed declared search order, on p=103, A=1, B=11 --
    the UNIQUE point in {h_+>=1, h_->=1} where D_sum = D_prod exactly
    (proven: D_prod - D_sum = h_-(h_+-1)n_+ + h_+(h_--1)n_-, zero iff
    h_+=h_-=1; see CORR-20260904-b9f9c1). This hypothesis repeats that
    exact test with a corrected Stage-0 filter -- max(h_+,h_-) >= 2 -- that
    is PROVEN (not merely hoped) to guarantee D_sum != D_prod on whatever
    curve the same fixed search order finds.

    PRE-REGISTERED, TWO-SIDED, GENUINELY DISCRIMINATING THIS TIME. (I) On
    a found curve with Z=3, h_+>=1, h_->=1, and max(h_+,h_-)>=2, the
    census matches D_sum exactly and does NOT match D_prod -- this
    completes, for the first time with actual discriminating power, the
    bivariate test H-MONO-1297d7 could not finish. (II) The census
    matches D_prod instead, or matches neither -- falsifying the simple
    additive, non-interacting form for the joint regime specifically.

  mechanism: >-
    Identical to H-MONO-1297d7's own mechanism and to
    EXP-MONO-98abb2's own already-independently-verified pipeline
    (search/census/dual-prediction structure), with ONE change: the
    Stage-0 filter is max(h_+,h_-) >= 2 (equivalently: h_+>=1 AND h_->=1
    AND NOT (h_+=1 AND h_-=1)) instead of the bare "h_+>=1 AND h_->=1"
    that admitted the coincidence point. This is a proven, not merely
    empirical, fix: the closed-form identity for D_prod-D_sum given above
    is verified algebra, checked independently by both reviewers of the
    prior round, not a new derivation risked here.

  falsification_condition: >-
    Any exact mismatch between the observed census and D_sum's own
    prediction on a found qualifying curve falsifies the additive form
    for the joint regime. Because the corrected filter provably excludes
    the only coincidence point, ANY outcome here is genuinely
    discriminating -- there is no non-informative degenerate case left in
    the admissible domain to land on. If no such curve exists within the
    declared toy prime range (very unlikely; EXP-MONO-98abb2's own search
    already passed through 10,316 (A,B) pairs including many with
    max(h_+,h_-)>=2 before even reaching the joint filter, per its own
    execution_report.yaml), that is a reportable, non-evidentiary
    occupancy fact.

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-CELL-4: a curve with Z=3, h_+>=1, h_->=1, and max(h_+,h_-)>=2
        exists within the declared toy prime search range. Very likely,
        given h_->=2 alone was found after only 135 pairs
        (EXP-MONO-ee06e2) and h_+>=1/h_->=1 jointly was found after 10,316
        pairs (EXP-MONO-98abb2, though at exactly the excluded coincidence
        point) -- but not assumed; independently re-verified by this
        experiment's own Stage 0.
      rigorous_support: >-
        Not distributional; an existence claim with strong prior support
        from two adjacent, already-executed searches.
      validation_plan: >-
        SAMPLE: scan ordinary curves at toy primes in [101,2000], same
        fixed ascending order as all three prior experiments in this
        sub-thread, requiring Z=3 AND h_+>=1 AND h_->=1 AND max(h_+,h_-)>=2
        this time, first hit taken. COMPARE AGAINST: both D_sum's and
        D_prod's exact predictions. TAIL CHECK: not applicable, exact-
        integer test. TRANSFER ASSUMPTION, STATED: a confirmed match on
        ONE genuinely discriminating joint curve supports but does not
        prove the additive form for every (h_+,h_-) combination.
      falsification_condition: >-
        Any exact mismatch on a found qualifying curve; or exhaustion of
        the declared range with none found (unlikely).

  target_complexity:
    time_exponent: O(p) per curve tested.
    memory_exponent: O(1).
    best_known: Not applicable; no ECDLP complexity claim. Pollard rho (KN-OPEN-001) untouched.

  claim_boundary_and_test_boundary: >-
    Tests ONLY whether the additive form D_sum survives, WITH ACTUAL
    DISCRIMINATING POWER this time, when both h_+ and h_- are nonzero and
    at least one is >= 2. Does NOT test the non-split strata. Does NOT
    make any relation-rate, cost, or exponent claim. A confirmed match
    would warrant extending KN-FIND-edd62c's own knowledge-corpus
    promotion to the full bivariate form; a mismatch would require a
    corrected closed form. Does not re-scope H-MONO-93bc4d.

