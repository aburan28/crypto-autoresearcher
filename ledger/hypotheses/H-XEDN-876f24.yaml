# H-XEDN-876f24 — specified from IDEA-20261005-e6a067.
# Protocol approval is DEC-20261006-c4570b. This record asserts no
# xedni revival, no lift to characteristic zero, and no ECDLP algorithm.
# The design session did not enumerate the 2500 or 62500 census slots
# and does not know the gap. It did evaluate the frozen predicate on
# four named plant objects, recorded below as controls.
hypothesis:
  id: H-XEDN-876f24
  question_id: RQ-XEDN-001
  source_proposal: IDEA-20261005-e6a067
  goal_id: GOAL-ICLIFT-001
  goal_id_note: >-
    ledger/goals/GOAL-ICLIFT-001.yaml lists RQ-XEDN-001 and has status
    completed. This design cites that goal and does not edit the goal
    file, does not open a lane, and does not change goal status.
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-XEDN-db173f is
    approved for a later executor. It does not mean the absolute gap
    is at least 0.05. Status moves only by DEC-20261006-c4570b under
    the standing user authorization of 2026-09-06. This design session
    wrote no run artifact and did not enumerate the census.
  proposed_by: coordinator
  conversion_note: >-
    The two families, the threshold 0.05, the slot counts 2500 and
    62500, the exclusion of y=0, and the rule that a finished absolute
    gap strictly less than 0.05 is a negative are carried from
    IDEA-20261005-e6a067. The Coordinator pinned the predicate to
    experiments/EXP-XEDN-001/xedni_sections.py is_square_poly, pinned
    a section as one monic quadratic whose image the predicate accepts,
    and named four plant objects.

  statement: >-
    TEST BOUNDARY. Prime p=5. Curve family y^2 = x^3 + b(t) with
    a(t)=0. Two slot spaces: coefficient vectors of b of exact degree
    4, and coefficient vectors of b of exact degree 6, leading
    coefficient nonzero. One predicate, is_square_poly from
    experiments/EXP-XEDN-001/xedni_sections.py, applied unchanged to
    both families, including its exclusion of the zero polynomial
    (the y=0 section). A detected section on a slot is one monic
    quadratic x(t) = t^2 + x1 t + x0 such that the predicate accepts
    x(t)^3 + b(t). The fraction is the number of slots with at least
    one detected section, divided by the slot count. No slot is lifted
    to characteristic zero. The comparison is not a lift-probability
    exponent, not a statement at p=101 or p=809, and not an ECDLP
    algorithm.

    PRE-REGISTERED PREDICTION, fixed before any executor run. The
    absolute difference of the two fractions is at least 0.05. The
    sign of the gap is not predicted. Agreement within 0.05, meaning
    a finished absolute gap strictly less than 0.05, is a negative:
    this predicate does not separate the two degrees at p=5. Exact
    integer form, equivalent over the census sizes 2500 and 62500:
    if n4 and n6 are the positive-slot counts, the prediction holds
    when the absolute value of 25*n4 - n6 is at least 3125, and it
    fails when that absolute value is at most 3124.

    DISTINGUISHABLE OUTCOMES. (1) Plants pass, both slot counts match
    2500 and 62500 before the predicate runs, lifts to Q are 0, the
    degree-6 count agrees with a replay of itself, and the absolute
    gap is at least 0.05: the branch claim holds at p=5. (2) The same
    checks pass and the absolute gap is strictly less than 0.05: the
    branch claim fails. (3) A plant fails, a slot count is wrong, a
    lift to Q occurs, or the replay disagrees: the measurement is
    unsigned. (4) A timeout or crash: infrastructure, not a branch
    result.

  mechanism: >-
    The frozen family in RQ-XEDN-001 is deg b = 6. The nearby object
    is the same equation with deg b = 4, same prime, same predicate.
    A gap of at least 0.05 means the zero-or-nonzero section event at
    p=5 depends on that degree. A gap below 0.05 means the two
    families agree at the resolution this test can see, so a later
    claim that emptiness is special to degree 6 is not supported by
    p=5. Either outcome is a slot fraction in characteristic 5.
    Neither outcome is a rank-deficient lift to characteristic zero.
    LOSSY-PROJECTION TEST. The object is a coefficient vector of b.
    The operation is the existence of one monic quadratic section
    under the pinned predicate. The projection keeps only whether at
    least one section was detected and discards which quadratic and
    which square root. Compatible with the operation: existence is
    exactly the bit being counted. Lossy: many slots can share the
    bit, so the fraction is not a list of sections and is not a rank.

  assumptions:
    - Both families use is_square_poly from experiments/EXP-XEDN-001/xedni_sections.py, including the exclusion of the zero polynomial. A predicate that is not executable is an infrastructure stop, not a gap of 0.
    - Slots are coefficient vectors of b of exact degree 4 or exact degree 6 over F_5. Leading coefficient nonzero. Coefficient index i is the coefficient of t^i, matching that module.
    - A detected section is one monic quadratic x of degree exactly 2. Constant sections and non-monic x are outside the count.
    - p=5 does not transfer to the contracted census primes 101, 211, 431, and 809. The p=7 sign check is not a transfer.
    - No slot is lifted to Q. The predicate stays in characteristic 5.
    - This session did not enumerate the 2500 or 62500 slots. The prediction is the proposal's prediction. It is not a recorded gap.

  proof_search_map:
    bottleneck: >-
      Whether the nonzero-section bit at p=5 depends on deg b being 4
      or 6 under one pinned predicate. Removing the degree distinction
      and comparing a family with a replay of itself is what drops the
      gap from the predicted value to 0. Lifts to Q and the exponent
      alpha are outside this measurement. This session did not
      enumerate the census.
    baseline_embedding:
      parameter_slice: >-
        The degree-6 census compared with a second pass of the same
        degree-6 enumeration. The absolute gap of a family with itself
        is 0, which is strictly less than 0.05.
      reproduction_check: >-
        The two degree-6 positive-slot counts must be equal. The slot
        counts before the predicate must be 2500 and 62500.
    observation_collision:
      observable: >-
        The absolute gap of the two exact fractions, together with the
        self-gap of the degree-6 replay, which must be 0.
      distinct_preimage_search: >-
        Two different coefficient vectors can share the nonzero-section
        bit. That collision is expected and is not a witness. A witness
        for the negative is a finished pair of fractions whose absolute
        gap is strictly less than 0.05.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Exact degree 4 against exact degree 6 at p=5, then the
          degree-6 family against a replay of itself.
        predicted_gain: >-
          An absolute fraction gap of at least 0.05 on the first pair,
          and a gap of 0 on the replay. No asymptotic gain.
    quantifier_order: >-
      The claim is one comparison of two exhaustive fractions at p=5.
      It does not say that every degree differs, and it does not say
      that a gap exists at p=7, p=101, or p=809. Swapping it for a
      statement about alpha would not be this hypothesis.
    method_ceiling:
      strongest_certifiable_claim: >-
        The absolute gap of these two section fractions at p=5 under
        this predicate. Nothing about a lift to characteristic zero
        and nothing about an ECDLP exponent.
      nearby_object_control: >-
        The degree-6 fraction against a replay of the same census.
        The conclusion "absolute gap at least 0.05" is predicted false
        there. The gap must be 0.
    proof_obligations:
      - claim: The absolute gap at p=5 is at least 0.05.
        responsibility: baseline
      - claim: A replay of the degree-6 census has gap 0.
        responsibility: correctness
      - claim: No xedni lift and no ECDLP exponent is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits an exhaustive slot-fraction comparison. It
      is not a closed form and not a complexity proof.

  rerandomization: >-
    This hypothesis does not use a re-randomizing walk. Both families
    are exhaustive censuses. No discrete log is pulled back to an
    input point.

  asymptotic_claim:
    problem: >-
      Whether the absolute gap of two section fractions at p=5 is at
      least 0.05. ECDLP is not claimed to be faster.
    prior_best: >-
      No attack is improved. KR-IC-cd159a states that xedni lifting to
      characteristic zero succeeds with negligible probability. Generic
      Pollard rho remains exponent 1/2. KR-RHO-898783 states the
      interval kangaroo bound (2+o(1)) times the square root of the
      interval width, which is a different problem.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. The census is 2500 + 62500
      slots, 25 monic quadratics on each slot, plus one replay of the
      62500 degree-6 slots, plus 2000 slots of each degree at p=7.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement is claimed, so none of those three labels is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        If the nonzero-section indicator were an independent Bernoulli
        trial with the same success probability on both degrees, the
        absolute gap at these census sizes would fall below 0.05 with
        high probability whenever that shared probability is in
        [0.05, 0.95]. A completed gap of at least 0.05 rejects equal
        probabilities in that range. It does not identify the
        probability and it does not identify a lift success probability
        over Q.
      random_model_justification: >-
        The slots are an exhaustive census, so the fractions are exact
        once the predicate is fixed. The Bernoulli model is the null
        being rejected, not a theorem about sections. Hoeffding's
        inequality on the difference of two sample means is the
        comparison model named by the proposal. That inequality was
        not opened as a source in this session.
      supporting_results:
        - ref: IDEA-20261005-e6a067
          provenance: internal
          claim: >-
            The proposal states this Bernoulli null, names Hoeffding
            as the comparison model, and states that the census
            fractions are exact once the predicate is fixed.
          verified_by: ledger/proposals/IDEA-20261005-e6a067.yaml
      validation_experiment_ids:
        - EXP-XEDN-db173f
      falsification_condition: >-
        Both exact fractions lie in [0.05, 0.95] and the absolute gap
        is strictly less than 0.05. That fails to reject equal
        probabilities at this resolution. It is the same numerical
        event as the branch negative, and it is not a statement about
        lifts to Q.

  structural_ingredients:
    - description: >-
        Xedni calculus, lifting points to Q and looking for
        rank-deficient lifts, succeeds with negligible probability.
        Lifting-based ECDLP approaches inherit that obstruction. This
        census performs 0 such lifts.
      citation: KR-IC-cd159a
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
      role: known-negative this fraction gap does not revive
    - description: >-
        MOV, Frey-Rück, and the anomalous trace-one solver are curve
        checks. This census does not run those reductions.
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
      role: frontier row positioned against, and not used
    - description: >-
        Semaev summation polynomials are the index-calculus
        decomposition framework. This census does not evaluate them.
      citation: KR-IC-5a43e5
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
      role: frontier row positioned against, and not used
    - description: >-
        Kangaroo methods solve an interval discrete log of width N in
        (2+o(1)) times the square root of N. This census performs 0
        kangaroo steps.
      citation: KR-RHO-898783
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-898783.yaml
      role: frontier row positioned against, and not used
    - description: >-
        Curves over a finite field are isogenous exactly when they
        have the same number of points, and walking an isogeny class
        does not reach a different weakness class. This census walks
        0 isogenies.
      citation: KR-RHO-755e35
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      role: frontier row positioned against, and not used
    - description: >-
        The opening of IDEA-20260805-64aef4 says a decision recorded a
        first-moment identity for the frozen degree-6 family. This
        hypothesis does not use that identity and does not treat it as
        re-derived. Only the opening was read.
      citation: IDEA-20260805-64aef4
      provenance: internal
      verified_by: ledger/proposals/IDEA-20260805-64aef4.yaml
      role: adjacent record not used as a formula
    - description: >-
        Recalled pointer, not opened, for the classical height argument
        that lifted xedni points have large canonical height. Not
        support. The known-negative used here is KR-IC-cd159a.
      citation: Jacobson-Koblitz-Silverman-Stein-Teske xedni height argument
      provenance: recalled
      verified_by: null
      role: pointer only

  reduction_chain:
    core_problem: >-
      Whether the absolute gap of the degree-4 and degree-6
      nonzero-section fractions at p=5 is at least 0.05.
    corollaries: []
    corollaries_note: >-
      No published reduction is invoked. One fraction gap does not
      cascade to a discrete logarithm or a lift to characteristic zero.

  predictions:
    - metric: absolute_gap_of_nonzero_section_fractions
      direction: different
      minimum_effect: >-
        Absolute difference at least 0.05 between the deg-b=4 fraction
        and the deg-b=6 fraction at p=5. Equivalently, the absolute
        value of 25*n4 - n6 is at least 3125.

  test_boundary:
    instances:
      - every exact-degree-4 coefficient vector over F_5 (2500 slots)
      - every exact-degree-6 coefficient vector over F_5 (62500 slots)
      - a replay of the degree-6 census
      - four named plant objects
      - a prefixed 2000-slot subset of each degree at p=7, sign check only
    parameters:
      prime: 5
      sign_check_prime: 7
      degree_a: 4
      degree_b: 6
      slot_count_degree_4: 2500
      slot_count_degree_6: 62500
      monic_quadratics: 25
      threshold: 0.05
      integer_threshold: 3125
      a_of_t: 0
    implementation: >-
      Import is_square_poly from experiments/EXP-XEDN-001/xedni_sections.py
      and do not edit that file. Enumerate both degrees. Score the
      plants and the replay before assigning the gap. Do not lift any
      slot to characteristic zero.
    budget:
      enforcement: advisory
      maximum_runs: 1
      note: >-
        One exhaustive census at p=5, one replay of degree 6, and one
        prefixed sign check at p=7. Time and memory watches live on
        the experiment contract. They are advisory.

  falsification_conditions:
    - Both censuses finish, the plants pass, the replay agrees, lifts to Q are 0, and the absolute gap is strictly less than 0.05.
    - The absolute value of 25*n4 - n6 is at most 3124 under those same checks.
    - The writeup treats the gap as a successful xedni lift or as an ECDLP exponent.

  interpretation_limits:
    - A gap at p=5 says nothing about alpha at p=101 or p=809.
    - Closing or supporting H-XEDN-001 is outside this claim.
    - The census is not a discrete-logarithm algorithm and does not move the generic exponent 1/2.
    - KR-IC-cd159a remains in force. A fraction gap of 0.05 or larger at p=5 is not a successful xedni lift and is not evidence against that known-negative.
    - The p=7 sign check does not enlarge the claim. Opposite signs with both absolute gaps at least 0.05 mean the direction is unstable and the p=5 result stays scoped to p=5.
    - The design session evaluated the predicate on four plant objects only. There is no recorded census gap yet.

