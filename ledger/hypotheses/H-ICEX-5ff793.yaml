hypothesis:
  id: H-ICEX-5ff793
  question_id: RQ-ICEX-001
  source_idea_id: IDEA-20260808-bfa0b9
  title: >-
    Batching T decomposition targets into one ideal by adjoining a variable y
    with the degree-T target polynomial g_T discriminates two cost models this
    corpus uses interchangeably- but the source idea's discriminator, a fitted
    exponent of d_solve in T, is computed here to be DEGENERATE because the
    competing model is affine in T with a large offset whose effective log-log
    slope at m = 2 is about 0.26 against the rival's 0.333; the discriminator is
    replaced by a finite-difference statistic with three forced, separated values
    and a computed admissibility gate on d_solve(1), and the declared parameter
    grid is replaced because at p in {1009, 4099} with T at most 16 the batched
    system has fewer than two expected solutions at every cell
  statement: >-
    SCOPE FIELD. Prime-field ECDLP by Semaev point-decomposition index calculus,
    specifically the ALGEBRAIC SOLVE stage. The handoff label is correct for this
    record.

    (A) THE OBJECT. Define the batched ideal
    I_T = < S_{m+1}(x_1..x_m, y), g_T(y), f_V(x_1), ..., f_V(x_m) > in
    F_p[x_1..x_m, y], where g_T(y) is the product over j = 1..T of
    (y - x(R_j)) for T distinct random targets R_j and f_V is the membership
    equation of the factor base V. Its solution set is the union over the T
    targets of their decomposition sets. The question is how the solving degree
    d_solve responds to T.

    (B) THE TWO COMPETING COST MODELS, RESTATED. (M1) Cost is governed by the
    degree at which the Macaulay corank reaches the solution count, giving
    d_solve = Theta((solution count)^{1/(m+1)}) and hence
    d_solve(T)/d_solve(1) = T^{1/(m+1)}. (M2) Cost is governed by the generator
    degrees, and adjoining a degree-T generator in ONE variable shifts the first
    non-positive Hilbert-series coefficient by about T/2, giving
    d_solve(T) = about (m(B-1) + (T-1) + D_S)/2, which is AFFINE in T with slope
    exactly 1/2 per unit T.

    (C) THE SOURCE IDEA'S DISCRIMINATOR IS DEGENERATE, AND THE COMPUTATION IS
    HERE. IDEA-20260808-bfa0b9 pre-registers 'fitted exponent in T' and asserts
    'M1 predicts slope 1/(m+1) (0.33 at m=2); M2 predicts slope 1' and 'an
    exponent gap of at least a factor 3 at m = 2'. M2 DOES NOT PREDICT LOG-LOG
    SLOPE 1. It is affine with a large additive offset, so its effective log-log
    slope over a bounded T range is far below 1. At the source's own cell
    m = 2, B = 6, with the Semaev generator's total degree D_S taken as 4, M2
    gives d_solve(1) = (10 + 0 + 4)/2 = 7 and d_solve(16) = (10 + 15 + 4)/2 =
    14.5, so the fitted log-log slope over T in [1, 16] is
    ln(14.5/7)/ln(16) = 0.7275/2.7726 = 0.262. M1 predicts 1/(m+1) = 0.333. THE
    TWO BANDS OVERLAP AT ANY REALISTIC MEASUREMENT PRECISION AND THE
    DISCRIMINATOR CANNOT FIRE. This is not a parameter problem; it is forced by
    M2 being affine rather than a power law.

    (D) THE COMPUTED REPLACEMENT, NOT A LOOSENED THRESHOLD. Use the finite
    difference
      Delta := [d_solve(T_max) - d_solve(1)] - (T_max - 1)/2.
    Its three forced values are well separated and none is fitted-
      M2 forces Delta = 0, up to plus or minus 1 from integer rounding of the
      degree, because M2's difference is exactly (T_max - 1)/2 REGARDLESS of m,
      B, D_S or the solution count;
      M1 forces Delta = d_solve(1) * (T_max^{1/(m+1)} - 1) - (T_max - 1)/2,
      evaluated with the MEASURED d_solve(1);
      the amortising outcome, d_solve flat in T, forces
      Delta = -(T_max - 1)/2, which at T_max = 32 is -15.5.
    ADMISSIBILITY GATE, COMPUTED. A cell can discriminate M1 from M2 only if the
    two forced values differ by at least 3 degrees, i.e. only if
    d_solve(1) is at least 18.5 / (T_max^{1/(m+1)} - 1). At T_max = 32 that is
    d_solve(1) at least 8.51 at m = 2 and at least 13.42 at m = 3, so the gate
    is d_solve(1) at least 9 and at least 14 respectively. d_solve(1) is measured
    FIRST in every cell, so the gate is checkable before the cell is
    interpreted, and a cell failing it is declared UNDERPOWERED with the required
    d_solve(1) stated rather than reported with a shrunken claim.

    (E) THE DECLARED PARAMETER GRID CANNOT POPULATE M1's CRITERION, AND THE
    REPLACEMENT IS COMPUTED. M1's threshold is the degree at which the corank
    reaches the SOLUTION COUNT, so a cell with fewer than about 8 expected
    solutions cannot exercise it. Under this batch's frozen convention the
    expected decompositions per target is binomial(B+m-1,m)/p, so the batched
    system has about T * binomial(B+m-1,m)/p solutions. At the source's declared
    grid- m in {2,3}, B in {6,8}, p in {1009, 4099}, T at most 16 - the largest
    value is at m = 3, B = 8, p = 1009 with binomial(10,3)/1009 = 0.119, giving
    1.90 expected solutions at T = 16; every other declared cell is below that,
    and the m = 2, B = 6, p = 4099 cell gives 0.082. EVERY DECLARED CELL IS
    UNDERPOWERED FOR M1. The replacement grid is p in {101, 211} with T up to 32,
    computed to give at least 8 expected solutions at
    (m=3, B=8, p=101, T at least 8), (m=3, B=6, p=101, T at least 16),
    (m=3, B=8, p=211, T at least 16) and (m=2, B=8, p=101, T at least 23); cells
    below 8 are declared UNDERPOWERED with their required T stated. The original
    p in {1009, 4099} is retained ONLY as a secondary arm for the M2 and
    semi-regularity limbs, which do not depend on the solution count.

    (F) THE CONVENTION DISAGREEMENT IS MADE DECIDABLE RATHER THAN LEFT OPEN. The
    source idea writes the solution count as 'about T B^m / p'. Its sibling
    IDEA-20260808-2ef5c8, and knowledge/findings/KN-FIND-007.md which this task
    read in full, use binomial(B+m-1,m)/N. These are NOT interchangeable- at
    B = 8, m = 3 they give 512 and 120, a factor 4.27, and at B = 6, m = 2 they
    give 36 and 21, a factor 1.71. THIS BATCH FREEZES binomial(B+m-1,m)/N, and
    every contract in it reports its counts under that convention against a
    recorded instance-set hash, so that a disagreement between two contracts is
    a disagreement about a number and not about a description.

    (G) THE M2 DERIVATION IS RE-ANCHORED BECAUSE ITS CITED SOURCE DOES NOT EXIST.
    IDEA-20260808-bfa0b9 attributes the 'adds about T/2 to the semi-regular
    degree' step to 'E2-01's convolution argument'. This task grepped the whole
    repository- E2-01 and E2-02 occur ONLY inside IDEA-20260808-prefixed
    proposals and inside two records that flag them as unresolvable;
    experiments/EXP-ICEX-c93308/specification.yaml states verbatim that E2-02 is
    'a label occurring only inside seven IDEA-20260808-prefixed proposals and in
    NO committed record'. E2-01 IS DROPPED AS A SOURCE. M2 is instead anchored on
    the source idea's OWN HA-1, which is self-contained- the membership
    generators and the target generator are univariate in DISTINCT variables and
    hence form a regular sequence, so the box-convolution factor
    (1 + z + ... + z^{T-1}) is exact and only the Semaev generator's genericity
    is heuristic. That re-anchoring is why Delta's M2 branch has a forced value
    with no free constant.
  mechanism: >-
    Multi-target is the one regime where index calculus classically wins even
    when it loses per target, because the factor-base logarithms are computed
    once. This corpus charges a per-target oracle and a one-off linear algebra
    but has never asked whether the ORACLE amortises. The batched ideal is the
    natural object- the target enters the summation polynomial as an ordinary
    variable, so batching costs exactly one more variable and one more generator,
    and the whole question is how the solving degree responds. g_T is univariate
    in y, so it contributes a single box factor to the Hilbert series, which by
    the regular-sequence argument shifts the first non-positive coefficient by
    about T/2 rather than by T. The experiment decides which of the two
    incompatible responses the corpus's two cost models predict is real, and
    whether any third, flat response exists over the tested range.
  assumptions:
  - Targets distinct, drawn uniformly, and checked for distinctness before g_T is formed.
  - Exact arithmetic throughout; solution counts obtained INDEPENDENTLY by enumeration over V^m and the T targets, never read off the solve.
  - >-
    d_solve is obtained by exact graded rank, not by a solver's self-reported
    degree, so that the two arms and the two nulls are measured by one
    instrument.
  - >-
    The Semaev generator's total degree D_S is a MEASURED input read off the
    constructed polynomial and recorded per cell; it is not assumed.
  - >-
    The ratio T/p is a reported covariate and is constrained to at most 0.35, so
    that batching a substantial fraction of the group is visible rather than
    hidden.
  proof_search_map:
    bottleneck: >-
      The response of d_solve to T. Every cost statement about batched descent is
      a function of that single response, and the two incumbent models disagree
      about it by a factor that no record in this corpus has measured.
    baseline_embedding:
      parameter_slice: >-
        T = 1 recovers the unbatched decomposition ideal in m variables plus one
        inert variable, and must reproduce the unbatched solve exactly on
        solution count and recovered decompositions.
      reproduction_check: >-
        T = 1 CALIBRATION, BLOCKING. Batched and unbatched must agree exactly on
        the recovered decomposition set and on the solution count. Operation
        counts may differ by the inert extra variable and that difference is
        reported as the batching overhead paid before any benefit.
    observation_collision:
      observable: >-
        The fitted log-log slope of d_solve against T over a bounded T range.
      distinct_preimage_search: >-
        COLLISION EXHIBITED BY COMPUTATION, NOT SEARCHED FOR. At m = 2, B = 6,
        D_S = 4, T in [1,16], M2 yields an effective log-log slope of 0.262 while
        M1 predicts 0.333. Two structurally different models land inside one
        band, so the fitted slope does NOT identify the model and no conclusion
        may rest on it. The separator is the finite difference Delta, whose three
        branch values are separated by construction and are checked for
        separation before the cell is interpreted.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace the fitted exponent by Delta = [d_solve(T_max) - d_solve(1)] -
        (T_max - 1)/2, whose M2 value is 0 independent of every nuisance
        parameter.
      predicted_gain: >-
        Three forced, separated branch values in place of two overlapping bands,
        with a computable admissibility gate on the measured d_solve(1).
    - transform: observable_fiber
      proposed_object: >-
        Report the whole per-degree rank profile, not only d_solve, so that a
        T-dependent departure from semi-regularity is visible as a residual
        rather than inferred from a single integer.
      predicted_gain: >-
        A T-growing per-degree residual is itself the amortisation signal and is
        not recoverable from d_solve alone.
    quantifier_order: >-
      FOR ALL tested (m, B, p) cells and FOR ALL T in the declared ladder, THERE
      EXISTS a single response class - M1, M2 or flat - consistent with the
      measured Delta at the declared separation. The quantifier is not inverted-
      this does not claim that one class governs all parameters, and a cell whose
      Delta lies between branches is reported as inconsistent with both rather
      than assigned to the nearer one.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the tested arities, factor-base sizes, primes, batch sizes and the
        named solve instrument, the measured Delta was these values and was
        consistent with this branch. It cannot establish an amortisation
        exponent, cannot establish a multi-target cost, and says nothing about
        descent, which is a separate stage.
      nearby_object_control: >-
        The identical ideal with the Semaev generator replaced by a random dense
        polynomial of the same multidegree in the same m+1 variables. The
        Hilbert-series argument behind M2 mentions no curve, so this curve-free
        object should reproduce M2's Delta exactly; if it also reproduces the
        Semaev arm's Delta, the measurement has no elliptic-curve content.
    proof_obligations:
    - claim: 'M2 forces d_solve(T_max) - d_solve(1) = (T_max - 1)/2 exactly, so Delta = 0.'
      responsibility: baseline
    - claim: 'M1 forces d_solve(T_max)/d_solve(1) = T_max^{1/(m+1)}.'
      responsibility: baseline
    - claim: >-
        The cell is admissible only if d_solve(1) is at least
        18.5/(T_max^{1/(m+1)} - 1).
      responsibility: strictness
    - claim: >-
        The batched solution count equals the sum over targets of the
        individually enumerated counts.
      responsibility: correctness
    - claim: 'Column counts binomial(d_solve + m + 1, m + 1) fit the memory cap at every cell.'
      responsibility: memory
    - claim: 'The T = 1 slice reproduces the unbatched solve exactly.'
      responsibility: baseline
    - claim: Every conclusion is scoped to the tested cells and to the named solve instrument.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HA-1
    formal_statement: >-
      FOR the tested cells, the batched generator sequence is semi-regular, so
      its Hilbert series is the positive truncation of
      (1 + z + ... + z^{B-1})^m * (1 + z + ... + z^{T-1}) * (1 - z^{D_S}) in
      m + 1 variables, and the first non-positive coefficient sits at about
      (m(B-1) + (T-1) + D_S)/2.
    random_model_justification: >-
      RIGOROUS PART- the membership generators and the target generator are
      univariate in DISTINCT variables and hence form a regular sequence, so the
      box-convolution factors are exact. This is self-contained and does not
      depend on the unresolvable E2-01 label the source idea cites for it.
      HEURISTIC PART- only the Semaev generator's genericity, imitating
      Froberg and Bardet-Faugere-Salvy semi-regularity.
    supporting_results:
    - >-
      The regular-sequence half is elementary and is discharged inside this
      record; no external citation is relied on for it.
    - >-
      NO citation is carried for the semi-regularity half. The source idea's
      pointer 'E2-01' resolves to no committed record anywhere in this
      repository, verified by repository-wide grep for this task, and is NOT
      recorded as support.
    validation_experiment_ids:
    - EXP-ICEX-64e821
    falsification_condition: >-
      The measured per-degree rank profile departs from the predicted
      coefficients at any degree by more than the declared tolerance at three or
      more cells, or the largest per-degree residual GROWS with T. A residual
      growing with T means the batched system departs from semi-regularity in a
      T-dependent way, which is itself the amortisation signal and must be
      reported as such rather than as a failure.
  - id: HA-2
    formal_statement: >-
      FOR the tested cells, the corank threshold that defines d_solve under M1 is
      the INDEPENDENTLY ENUMERATED solution count of I_T, and that count equals
      the sum over the T targets of their individually enumerated decomposition
      counts.
    random_model_justification: >-
      This is a counting identity, not a distributional assumption; it is
      heuristic only in that repeated roots of g_T, or coincident decompositions
      shared between two targets, would break it, and both are checkable.
    supporting_results:
    - >-
      knowledge/findings/KN-FIND-007.md (internal; read in full by
      TASK-20260904-f2b3db) supplies the per-target mean binomial(B+m-1,m)/N used
      to size the grid, though not the per-instance count, which is enumerated.
    validation_experiment_ids:
    - EXP-ICEX-64e821
    falsification_condition: >-
      The batched enumerated count differs from the sum of the per-target counts
      at any cell. That is an implementation error, not a phenomenon, and it
      invalidates the cell.
  structural_ingredients:
  - description: >-
      The exact mean-yield conservation identity used to size the parameter grid
      and to fix this batch's frozen counting convention.
    citation: knowledge/findings/KN-FIND-007.md
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- opened and read in full on 2026-09-04.
    role: distribution law fixing expected solution counts
  - description: >-
      Froberg-type semi-regularity and the Bardet-Faugere-Salvy degree-of-
      regularity analysis, imitated by HA-1's Hilbert-series form.
    citation: 'Froberg; Bardet, Faugere and Salvy on semi-regular sequences'
    provenance: recalled
    verified_by: null
    role: >-
      The classical distribution statement HA-1 imitates. RECALLED, NOT OPENED-
      a pointer for the reviewer and not support.
  - description: >-
      The sibling cost-model record whose theta above 2 regime the source idea
      invokes under the unresolvable label E2-02.
    citation: ledger/proposals/IDEA-20260808-2ef5c8.yaml
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- opened and read in full on 2026-09-04.
      RECORDED AS A READING, NOT A RESOLUTION- the content attributed to 'E2-02'
      matches this record's regime (ii), so E2-02 most plausibly denotes
      IDEA-20260808-2ef5c8, but that is an inference from content agreement and
      nothing here rests on it.
    role: context for why the oracle stage is the one worth batching
  reduction_chain:
    core_problem: >-
      The response of the batched decomposition ideal's solving degree to the
      batch size T, at toy scale, measured by exact graded rank.
    corollaries: []
  predictions:
  - metric: delta_finite_difference
    direction: different
    minimum_effect: >-
      'Delta := [d_solve(T_max) - d_solve(1)] - (T_max - 1)/2. FORCED BRANCH
      VALUES at T_max = 32- M2 gives 0 plus or minus 1; the amortising branch
      gives -15.5; M1 gives d_solve(1) * (32^{1/(m+1)} - 1) - 15.5, i.e.
      2.1748 * d_solve(1) - 15.5 at m = 2 and 1.3784 * d_solve(1) - 15.5 at
      m = 3, evaluated with the measured d_solve(1).'
  - metric: cell_admissibility_gate
    direction: higher
    minimum_effect: >-
      'A cell discriminates only if the M1 and M2 forced values differ by at
      least 3 degrees, i.e. only if the measured d_solve(1) is at least
      18.5/(T_max^{1/(m+1)} - 1)- at T_max = 32 that is d_solve(1) at least 9 at
      m = 2 and at least 14 at m = 3. A cell below the gate is reported
      UNDERPOWERED with its required d_solve(1), never with a shrunken claim.'
  - metric: expected_solution_count
    direction: higher
    minimum_effect: >-
      'At least 8 expected solutions, T * binomial(B+m-1,m)/p at least 8, before
      an M1 reading is admissible. Cells below it are declared UNDERPOWERED with
      the T required to reach 8 stated. At the source idea's declared grid the
      maximum over all cells is 1.90, so every one of them is underpowered for
      M1.'
  - metric: batched_versus_separate_operation_ratio
    direction: different
    minimum_effect: >-
      'Counted field operations for the batched solve divided by the sum over T
      separate solves, at matched accounting. At T = 1 the two must agree to
      within implementation noise, which is a free calibration. A ratio below 1
      at any admissible cell is the amortisation outcome and its crossover T is
      the deliverable.'
  - metric: solution_count_reconciliation
    direction: different
    minimum_effect: >-
      'Exact equality between the batched enumerated count and the sum of the
      per-target enumerated counts at every cell. Any discrepancy is an
      implementation error, not a phenomenon.'
  test_boundary:
    instances:
    - >-
      Generated ordinary prime-field short-Weierstrass curves over F_p with
      p in {101, 211} primary and p in {1009, 4099} secondary, at least 3 curves
      per p, anomalous and smooth-order curves excluded.
    - >-
      Curve-free arm- the identical ideal with the Semaev generator replaced by a
      random dense polynomial of the same multidegree in the same m+1 variables.
    - >-
      Dummy-variable null- y adjoined with a random squarefree degree-T generator
      unrelated to the targets.
    parameters:
      arity_m: [2, 3]
      factor_base_B: [6, 8]
      prime_p_primary: [101, 211]
      prime_p_secondary: [1009, 4099]
      batch_T: [1, 2, 4, 8, 16, 32]
      T_max: 32
      max_T_over_p: 0.35
      target_set_arms: [random, structured_arithmetic_progression]
    implementation: >-
      Exact graded rank over F_p for d_solve; independent enumeration over V^m
      and the T targets for the solution count; one shared ideal builder
      parameterised by the generator so that the Semaev, random-dense and
      dummy-variable arms differ only in one polynomial.
    budget:
      wall_clock_seconds_per_run: 900
      maximum_memory_gb: 8
      maximum_runs: 300
  falsification_conditions:
  - >-
    B1 CALIBRATION, BLOCKING. The T = 1 batched and unbatched solves disagree on
    the recovered decomposition set or the solution count. The plumbing is wrong
    and no cell is interpreted.
  - >-
    B2 RECONCILIATION, BLOCKING. The batched solution count differs from the sum
    of the per-target counts at any cell. Implementation error; that cell is
    void.
  - >-
    B3 M1 BRANCH. Delta lands within the declared resolution of the M1 forced
    value at all admissible cells. M1 holds, batching loses superlinearly, and
    the multi-target lane is closed AT THIS INTERFACE and at the tested scope
    only.
  - >-
    B4 M2 BRANCH. Delta lands within plus or minus 1 of 0 at all admissible
    cells. M2 holds; also a loss, and it independently confirms that a univariate
    high-degree generator adds about degree/2 - a result about semi-regularity,
    not about elliptic curves.
  - >-
    B5 AMORTISATION BRANCH, THE OUTCOME WORTH HUNTING. Delta lands within the
    declared resolution of -(T_max - 1)/2 at admissible cells, i.e. d_solve is
    flat in T. This would justify a larger battery and an explicit multi-target
    comparison against the sqrt(T N) generic bound. It is not a result on its own
    and must be replicated before any interpretation.
  - >-
    B6 INCONSISTENT. Delta lands outside the resolution of ALL THREE forced
    values. Report the measured Delta and diagnose; do not assign the cell to the
    nearest branch.
  - >-
    B7 DUMMY-VARIABLE NULL. The dummy-variable arm shows the same Delta as the
    Semaev arm. The degree response is generator-degree-driven and not
    target-driven, and NO multi-target conclusion may be drawn.
  - >-
    B8 CURVE-FREE NULL, REQUIRED, CONSEQUENCE PRE-STATED. HA-1's Hilbert-series
    argument mentions no curve, so a curve-free object can reproduce the whole
    signature. If the random-dense-generator arm reproduces the Semaev arm's
    Delta within the declared resolution, then the measured d_solve(T) response
    is a generic fact about adjoining a univariate degree-T generator to a
    semi-regular system, carries NO statement about Semaev polynomials, point
    decomposition or elliptic curves, and may not be reported under an ECDLP
    heading.
  - >-
    B9 STRUCTURED-TARGET ARTIFACT. The structured-target arm shows an
    amortisation that the random-target arm does not. The effect is an artifact
    of the target set's structure and the random-target arm is the only
    reportable one.
  interpretation_limits:
  - >-
    Toy tier throughout, and unusually so- the primary grid uses p in {101, 211},
    which is far smaller than the source idea's declared grid. That change is
    forced by the solution-count computation in statement (E) and is disclosed
    rather than absorbed. At p = 101 and T = 32 the batch covers about 32 percent
    of the group, and T/p is a required reported covariate for exactly that
    reason.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED PLAINLY. T at most 32 is far from the
    batch sizes at which multi-target arguments bite, and the batched Macaulay
    matrix has binomial(d_solve + m + 1, m + 1) columns, which grows past any
    reachable memory well before T reaches a cryptographically interesting size.
    This contract can EXCLUDE two hostile responses or motivate a larger battery;
    it cannot establish an amortisation exponent and no such exponent may be
    quoted from it.
  - >-
    It says nothing about descent, which is a separate stage with its own cost,
    and nothing about relation collection.
  - >-
    The batched system has m+1 variables against m, so column counts jump
    discontinuously between T = 1 and T = 2. That overhead is paid before any
    batching benefit and is reported separately, never netted out.
  - >-
    Larger T raises the solution count, which raises the corank threshold, while
    also adding a generator, which raises the degree. The two effects push
    d_solve in opposite directions and must be reported separately.
  - >-
    No exponent moves and nothing here bears on the security of any deployed
    curve. The multi-target comparator is the generic sqrt(T N) bound and this
    record does not approach it.
  status: proposed
  proposed_by: idea-generator
