  title: >-
    The only integer with prime halves 2 and 3 is 5
  statement: >-
    For an odd integer n the two halves (n-1)/2 and (n+1)/2 differ by 1.
    The only primes that differ by 1 are 2 and 3. That pair builds the
    integer 5. Two to the power 16 is 65536. Five does not exceed 65536.
    The product of 2 and 3 is 6. Their sum is 5. Two readings of the
    half-gap are both 1, so that gap is 0 and their product is 1.
  mechanism: >-
    The proposal asks for a prime larger than 2 to the power 16 whose
    two halves are both prime. This contract checks that integer
    condition. It does not count a curve point.
  assumptions: []
  proof_search_map:
    bottleneck: The half-gap 1.
    baseline_embedding:
