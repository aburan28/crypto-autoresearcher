        The halves 2 and 3 and the power 65536 in IDEA-20261005-447d82,
        read 2026-10-07. The gap, the product, and the sum were
        recomputed in this design session. That computation is not a run.
      reproduction_check: >-
        One route subtracts (n-1)/2 from (n+1)/2. The other checks
        that 2 and 3 are the only primes differing by 1. They must
        agree that the built integer is 5.
    observation_collision:
