# =============================================================================
# H-BINSTD-ceae35 -- Clear IMP-X962: five c2pnb rows leave NOT COMPUTED under
# TIER-P retrieval + Part-1 k|r-1 census (same instrument as EXP-BINSTD-178742).
# Source IDEA-20261001-262544 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261004-173be8. ZERO RUNS in this design packet.
# Stages 0-2 authorized. No AUXIN. No Bedrock. No Part-2 / break / exponent.
# =============================================================================
hypothesis:
  id: H-BINSTD-ceae35
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-262544
  experiment_id: EXP-BINSTD-6a150a
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-04'
  approved_at: '2026-10-04'
  authorised_by: DEC-20261004-173be8
  status: approved
  proposed_by: coordinator
  title: >-
    Five c2pnb rows leave NOT COMPUTED under TIER-P ANSI X9.62 retrieval and
    the Part-1 k|r-1 instrument, or stay NOT COMPUTED with logged impediment

  statement: >-
    CLAIM (measurement / provenance; NO ATTACK; NO EXPONENT). EXP-BINSTD-178742
    Part-1 left five standardized rows — c2pnb176v1, c2pnb208w1, c2pnb272w1,
    c2pnb304w1, c2pnb368w1 — at verdict NOT COMPUTED under IMP-X962 (ANSI X9.62
    unreachable; EV-BINSTD-fba851). CLAIM: there exists a primary-source
    retrieval path (ANSI X9.62 purchase/archive, or a TIER-P transcription with
    SR-SRC provenance) such that EACH of the five rows becomes either TRUE with
    primary provenance or FALSE with a logged counterexample under the same
    Part-1 k|r-1 scorer — never a silent design-figure / secondary-dump /
    recalled TRUE. If retrieval fails, every undecided row remains NOT COMPUTED
    with a logged impediment (O-IMPEDIMENT-X962), never fabricated TRUE.
    CLAIM TIER: observational / provenance. Does not execute Part-2 ranks.

  mechanism: >-
    OBJECT FRAME. Representation R1: published curve-order parameters (k=m or
    k=m/d_min, r) for binary X9.62 c2pnb curves. Operation set: modular check
    k | (r−1) identical to EXP-BINSTD-178742 Part-1 (score_k_divides_row /
    k_divides_r_minus_1). Trichotomy: Class I (parameter census, not a new
    attack object). Lossy-projection test: replacing a primary source with a
    secondary dump (OpenSSL named-curve tables, recall, unnamed reproduction)
    must be rejected by SR-SRC-2 / IR-10. OFF-LIMITS: Part-2 rank identities;
    Semaev/PDP; n≥131 attacks; O-SUPPORT from parameter retrieval alone.
    WHAT IS NEW: closes the exact IMP-X962 gap left by EV-BINSTD-fba851 without
    inventing r strings.

  predictions:
    - metric: c2pnb_decidable_count
      direction: higher
      minimum_effect: '≥1 of 5 rows leaves NOT COMPUTED for TRUE or FALSE under TIER-P'
    - metric: fabricated_true_count
      direction: lower
      minimum_effect: '=0 (hard gate)'
    - metric: twin_kdiv_agreement
      direction: same
      minimum_effect: 'route A and route B agree on every decidable row'

  test_boundary:
    instances:
      - 'Stage 0: freeze retrieval protocol + document-class allow-list BEFORE any download'
      - 'Stage 1: attempt TIER-P retrieval; write admission_receipt (or logged IMP-X962)'
      - 'Stage 2: recompute five k|r-1 rows with Part-1 scorer; write part1_rows + RESULTS.md'
    parameters:
      rows:
        - {name: c2pnb176v1, m: 176, label_derived_k_if_dmin_16: 11}
        - {name: c2pnb208w1, m: 208, label_derived_k_if_dmin_16: 13}
        - {name: c2pnb272w1, m: 272, label_derived_k_if_dmin_16: 17}
        - {name: c2pnb304w1, m: 304, label_derived_k_if_dmin_16: 19}
        - {name: c2pnb368w1, m: 368, label_derived_k_if_dmin_16: 23}
      certificate_kind: none
      prior_not_computed_reason: IMP-X962
      prior_evidence: EV-BINSTD-fba851
      prior_instrument: EXP-BINSTD-178742 Part-1
    implementation: >-
      Pure Python under experiments/EXP-BINSTD-6a150a/implementation/;
      reuses the Part-1 modular predicate from EXP-BINSTD-178742
      (k_divides_r_minus_1). Command surface implementation/run.py driven by
      trial-plan-v1.json. Twin modular routes for decidable rows. No Magma/
      Sage/AUXIN/Bedrock. No invented r strings.
    budget:
      wall_clock_seconds: 14400
      memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - Marking any c2pnb TRUE from recalled or secondary parameters (IR-10 / SR-SRC-2).
    - Claiming Part-2 O-SUPPORT from parameter retrieval alone.
    - Claiming a break / exponent from k|r-1.
    - Editing the retrieval allow-list after Stage-0 freeze to admit a secondary dump.
    - Silently dropping a primary-sourced FALSE.

  distinguishable_outcomes:
    - id: O-CLEAR-X962
      meaning: >-
        ≥1 of 5 rows leaves NOT COMPUTED for TRUE or FALSE under TIER-P with
        verified provenance; fabricated_true_count=0; twin routes agree on
        every decidable row. Remaining undecided rows may stay NOT COMPUTED
        with logged impediment.
    - id: O-ALL-DECIDED
      meaning: >-
        All five rows are TRUE or FALSE under TIER-P; fabricated_true_count=0;
        twin agree. Stronger clearance of IMP-X962.
    - id: O-STILL-IMP-X962
      meaning: >-
        Retrieval failed for all five rows; every row remains NOT COMPUTED with
        logged impediment; fabricated_true_count=0. Impediment, not negative
        mathematics.
    - id: O-ARTIFACT
      meaning: >-
        IR-10 / SR-SRC violation, twin disagreement, or post-freeze allow-list
        edit. No TRUE/FALSE claim kept.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-BINSTD-ceae35.

  interpretation_limits:
    - Provenance / parameter census only; does not move any ECDLP exponent.
    - Does not authorize Part-2 ranks or Semaev/PDP work.
    - Label-derived k (m/16) is never a TIER-P substitute for primary k.
    - TIER-D drafts are information-only and never yield counted verdicts.
    - Clearing IMP-X962 does not unblock EXP-BINSTD-178742 Part-2 (IMP-PART2-CURVE-LIBS-1).

  heuristic_assumptions:
    - id: HEUR-BINSTD-262544-H1
      formal_statement: >-
        FORALL five c2pnb rows: IF a TIER-P source supplies (k,r) with verified
        provenance, THEN the Part-1 instrument returns TRUE iff r ≡ 1 (mod k),
        else FALSE; ELSE the row remains NOT COMPUTED with a logged impediment
        (never a recalled TRUE).
      random_model_justification: >-
        Rigorous: modular arithmetic. Classical: published curve orders. No
        random model beyond provenance correctness of the retrieved
        transcription.
      supporting_results:
        - EV-BINSTD-fba851
        - EXP-BINSTD-178742
      validation_experiment_ids:
        - EXP-BINSTD-6a150a
      falsification_condition: >-
        Any row marked TRUE from a secondary dump / recall without verified_by;
        OR a primary-sourced FALSE silently dropped; OR twin modular routes
        disagree on a decidable row.

  asymptotic_claim:
    problem: >-
      Provenance clearance of five ANSI X9.62 c2pnb k|r-1 rows left NOT COMPUTED
      under IMP-X962
    prior_best: >-
      EXP-BINSTD-178742 Part-1: six FIPS/ECC2K rows TRUE; five c2pnb NOT COMPUTED
      (EV-BINSTD-fba851 / IMP-X962)
    time_exponent: >-
      NO EXPONENT MOVED. Observational / provenance measurement only.
    memory_exponent: O(1) — store five (k,r) transcripts and modular residues.
    hidden_cofactor: Document purchase / archive access latency.
    claim_kind: measurement

  proof_search_map:
    bottleneck: >-
      Whether a TIER-P (k,r) transcript exists and is retrievable for each of
      the five c2pnb rows so Part-1 k|r-1 becomes decidable without secondary
      substitution.
    baseline_embedding:
      parameter_slice: >-
        Five program labels c2pnb{176v1,208w1,272w1,304w1,368w1}; m from label;
        prior Part-1 instrument and IMP-X962 from EV-BINSTD-fba851 /
        EXP-BINSTD-178742 part1_rows.json.
      reproduction_check: >-
        Independent check.py recomputes (r-1) mod k for every decidable row
        and refuses any TRUE lacking TIER-P provenance fields.
    observation_collision:
      observable: per-row verdict in {TRUE, FALSE, NOT COMPUTED}
      distinct_preimage_search: >-
        Secondary OpenSSL dumps or recalled r strings can manufacture TRUE;
        IR-10 / SR-SRC-2 must reject them. Label-derived k alone must not
        decide a row without primary r.
    constructive_transforms:
      - transform: primary_source_retrieval
        proposed_object: ANSI X9.62 TIER-P (k,r) transcripts for five c2pnb rows
        predicted_gain: Decidable Part-1 census rows without inventing parameters
    quantifier_order: >-
      Freeze allow-list first; then retrieve; then score. No scoring before
      Stage-0 freeze; no TRUE from non-TIER-P sources.
    method_ceiling:
      strongest_certifiable_claim: >-
        Five decidable TIER-P k|r-1 verdicts with provenance digests. Not an
        attack and not a Part-2 rank identity.
      nearby_object_control: >-
        OpenSSL named-curve secondary dump (cross-check only); TIER-D draft
        (information-only column); recalled r (forbidden).
    proof_obligations:
      - claim: fabricated_true_count = 0
        responsibility: correctness
      - claim: decidable rows use TIER-P (k,r) with sha256 provenance
        responsibility: scope
      - claim: modular predicate matches EXP-BINSTD-178742 Part-1
        responsibility: correctness
    not_applicable_reason: null

  dominated_by: >-
    CHECKED KR-IC-ae532f / KR-IC-1fcdbc dominate any attack reading; this
    record claims none. As an IMP-X962 clearance meter it is not dominated
    by walk/DP ideas.
  sota_delta:
    time: n/a — no attack
    memory: n/a
    data_queries: >-
      First dedicated primary-source clearance attempt for the five c2pnb rows
      under the frozen Part-1 instrument after EV-BINSTD-fba851.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
