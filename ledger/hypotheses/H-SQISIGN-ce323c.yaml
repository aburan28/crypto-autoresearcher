hypothesis:
  id: H-SQISIGN-ce323c
  question_id: RQ-SQISIGN-001
  statement: >-
    SCOPE, BINDING. Object: the coincidence partition of published curve
    symbols across a batch of q SQIsign signatures under one key, applied
    separately to the E_aux stream and to the response-codomain stream.
    CLAIM TIER: toy. NO ATTACK, NO EXPONENT, NO HARDNESS CLAIM. THE
    HYPOTHESIS: IDEA-20260805-18a4d4 proves I*conj(I)=n(I)*O and triviality
    of scalars on ideal classes, making [conj(J_i)*J_j] secret-independent
    for the RESPONSE-CODOMAIN stream at every parameter, with no heuristic --
    that arm is DEAD BY THEOREM and serves as an exact negative control. The
    open question is whether the identity extends to the SECOND published
    curve symbol, E_aux, whose degree depends on deg(phi_rsp) and the
    signer's representative choice rather than on the ideal class alone, and
    which the cancellation argument as written does not cover. Under a batch
    of q signatures on a graph with n ~ p/12 vertices, the coincidence count
    in each stream is predicted Poisson(C(q,2)/n); the response arm's
    Poisson-and-key-independence is the theorem-backed control, and the
    E_aux arm either matches it (cancellation extends empirically) or shows
    across-key dependence absent in the control (it does not).

  mechanism: >-
    A toy signer emits both curve symbols in each of S3-2's two arms
    (translation-shaped, simulator-shaped), using IDEA-20260805-bb4bf8's
    TV-derived commitment-walk length so the commitment is demonstrably
    mixed. Batches of q in {100,200,400} under K=8 keys, 3 replicates each,
    are tested with a pre-registered Poisson goodness-of-fit and an
    across-key dispersion test at alpha=0.01, applied identically to both
    streams by the same code on the same batch. Before any run, an
    algebraic kill-early is attempted: write J_i^aux explicitly and check
    whether conj(I_tau) pairs with I_tau there too; if the identity extends
    by algebra alone, the deliverable is a one-page proof rather than a
    3-CPU-hour experiment.

  assumptions:
    - >-
      That the toy signer faithfully implements the ideal-composition
      semantics 18a4d4's cancellation theorem is about; tested, not assumed,
      by the response-arm known-answer gate that must pass before any E_aux
      number is trusted.
    - >-
      That the Poisson(C(q,2)/n) null is correct for a relabelling-invariant
      coincidence statistic given a mixed commitment walk of the
      bb4bf8-derived length; not correct if the walk is unmixed, which the
      Poisson-fit gate itself would detect (F7c).
    - >-
      That E_aux's degree dependence on the signer's representative choice
      does not trivially collapse to the same cancellation identity by an
      argument this hypothesis has not yet attempted symbolically; the
      kill-early stage exists to close this before any compute is spent.

  proof_search_map:
    bottleneck: >-
      Whether the ideal J_i^aux, whose norm is set by the signer's
      representative choice of phi_rsp rather than by the connecting ideal
      alone, admits the same conj(I_tau)*I_tau=scalar cancellation 18a4d4
      proves for response codomains. If it does, by algebra, the entry
      closes with a proof and no measurement is needed; if it does not, the
      measurement is the only route to a scoped empirical statement.
    baseline_embedding:
      parameter_slice: >-
        The response-codomain stream itself, where the cancellation is
        proven, is the baseline the E_aux stream is compared against; both
        are measured by identical code on the identical batch so that any
        difference is attributable to the object, not the instrument.
      reproduction_check: >-
        Symbolic: the response arm must reproduce Poisson(C(q,2)/n) with
        key-independence within the pre-registered band before any E_aux
        number is read. Failure here voids the instrument, not the theorem.
    observation_collision:
      observable: >-
        The coincidence partition of the multiset of published curve
        symbols in each stream -- invariant under every relabelling of the
        vertex set, retaining only the block-size profile.
      distinct_preimage_search: not_applicable_reason -- purely empirical statistic, no preimage-search claim made.
    constructive_transforms: []
    quantifier_order: >-
      FOR the response-codomain stream, FOR ALL keys, the coincidence law is
      Poisson(C(q,2)/n) and key-independent (proven by 18a4d4, not tested).
      FOR the E_aux stream, THE MEASURED QUESTION IS whether the same holds;
      no universal quantifier is claimed for E_aux in advance.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: at the tested toy primes and batch sizes, the E_aux
        coincidence law does or does not match the theorem-derived Poisson
        law with key-independence, given a validated instrument (the
        response arm passing its own gate first). Cannot certify anything
        about the cancellation identity at crypto scale or about any other
        pairwise statistic family.
      nearby_object_control: >-
        The response-codomain stream itself, dead by theorem, run alongside
        as the object where the conclusion (key-independence) is known to
        hold for a proven reason, so the instrument's ability to detect a
        deviation is exercised on a stream it must never flag.
    proof_obligations:
      - claim: >-
          The algebraic kill-early (writing J_i^aux explicitly and checking
          conj(I_tau) pairing) is attempted before any measurement is
          approved for execution.
        responsibility: baseline
      - claim: >-
          The response-arm known-answer gate (Poisson fit, key-independence
          within the pre-registered band) passes before any E_aux number is
          reported.
        responsibility: correctness
      - claim: >-
          The commitment-walk length is taken from bb4bf8's TV computation
          and not guessed; absence of that number defers the entry rather
          than running at a guessed length.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null

  heuristic_assumptions:
    - id: HEUR-SQ-ce323c-1
      formal_statement: >-
        FOR the E_aux stream, at the tested toy primes p in {2^13, 2^15} and
        batch sizes q in {100,200,400} under K=8 keys, the coincidence count
        is Poisson(C(q,2)/n) and key-independent at alpha=0.01, matching the
        response-codomain stream's theorem-backed law.
      random_model_justification: >-
        Not a rigorous claim; the theorem covers only the response-codomain
        stream. This heuristic states the EMPIRICAL EXTENSION under test,
        motivated by the response arm's proof but not derived from it, since
        E_aux's ideal is not of the proven form.
      supporting_results: []
      validation_experiment_ids: [EXP-SQISIGN-ce985f]
      falsification_condition: >-
        (F7a) response arm itself shows across-key dispersion above the
        band in >=1 of 3 replicates: instrument void, no E_aux number
        reportable. (F7b) E_aux arm matches the response arm within band at
        both primes and all q: heuristic supported, cancellation extends
        empirically. (F7c) both arms deviate from Poisson: scale-bound,
        uninformative, heuristic neither supported nor refuted.

  structural_ingredients:
    - description: >-
        I*conj(I)=n(I)*O and triviality of scalars on ideal classes, giving
        [conj(J_i)*J_j] independent of the secret for response codomains.
      citation: ledger/proposals/IDEA-20260805-18a4d4.yaml (in-corpus, cited not re-derived here)
      role: supplies the theorem-backed negative control (response-codomain stream)
    - description: >-
        Toy signer arms (translation-shaped, simulator-shaped) emitting both
        curve symbols.
      citation: S3-2 catalogue entry (in-corpus dependency, DEDUP.md records S3-2 before S3-7)
      role: supplies the measurement instrument, reused without modification
    - description: TV curve computation fixing a demonstrably-mixed commitment-walk length.
      citation: ledger/proposals/IDEA-20260805-bb4bf8.yaml (in-corpus dependency)
      role: prevents a short-walk-clustering confound

  reduction_chain:
    core_problem: >-
      Determine whether IDEA-20260805-18a4d4's response-codomain cancellation
      identity extends, empirically at toy scale, to the second published
      curve symbol E_aux.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. No reduction to EUF-CMA, key recovery, or any
      hardness statement about the endomorphism-ring problem is claimed;
      this hypothesis costs none of GOAL-SSI-001's budget.

  predictions:
    - metric: response-arm coincident-pair count per (p,q,K,replicate)
      direction: different
      minimum_effect: >-
        Poisson(C(q,2)/n) exactly, key-independent at alpha=0.01; at
        p=2^15, n~2730, q=200, mean ~7.29 (theorem-derived).
    - metric: E_aux-arm coincident-pair count per (p,q,K,replicate)
      direction: different
      minimum_effect: >-
        Same Poisson law and key-independence if cancellation extends; a
        key-dependent deviation absent in the response arm otherwise.

  test_boundary:
    instances:
      - >-
        Toy SQIsign-shaped signer over F_{p^2} 2-isogeny graphs at
        p in {2^13, 2^15}, in both S3-2 arms, K=8 keys, batches
        q in {100,200,400}, 3 replicates.
    parameters:
      primes: [8192, 32768]
      batch_sizes: [100, 200, 400]
      keys: 8
      replicates: 3
      alpha: 0.01
    implementation: >-
      Reuses S3-2's toy signer unmodified; adds the coincidence-partition
      counter and the Poisson/dispersion test harness.
    budget:
      total_cpu_hours: 3

  falsification_conditions:
    - >-
      F7a: response arm shows across-key dispersion above the band in >=1 of
      3 replicates -- instrument void, the theorem cannot be wrong, the toy
      signer can be; no E_aux number reportable.
    - >-
      F7b: E_aux arm matches the response arm within the band at both primes
      and all q -- cancellation extends empirically, closing a second family
      of pair statistics (expected outcome).
    - >-
      F7c: both arms deviate from Poisson -- graph too small or walk
      unmixed, measurement scale-bound and uninformative.

  interpretation_limits:
    - >-
      Ceiling: toy, per CEILING-S3(ii). The response arm's key-independence
      is a theorem and is not being tested; the E_aux arm's result, whatever
      it is, is a toy-scale statement about a toy signer.
    - >-
      Risk band: high_risk. The algebraic kill-early may close the entry in
      an hour with a one-page proof, and the most likely measured outcome
      (per this catalogue entry's own assessment) is a second negative
      (F7b, "cancellation extends").
    - >-
      Higher-dimensional structure (OL-9) is invoked only as an analysis
      instrument explaining why E_aux is representative-dependent; no
      dimension-2-or-above computation is performed.
    - >-
      No statement about EUF-CMA, key recovery, or endomorphism-ring
      hardness follows from any outcome of this hypothesis.
    - >-
      GOAL-SQISIGN-001, under which this hypothesis is filed, is currently
      status draft with dispatch_queue_path null: no execution can be
      authorized under it until it is activated by the Coordinator.

  status: proposed
  proposed_by: idea-generator
