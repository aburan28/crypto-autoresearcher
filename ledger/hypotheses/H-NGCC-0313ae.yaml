hypothesis:
  id: H-NGCC-0313ae
  question_id: RQ-NGCC-f52138
  idea_id: IDEA-20261001-f38ddd
  statement: >-
    On the official NGCC round-1 Facto-DSA submission (sign-10), the
    parameter set Facto-DSA-128 has the property that the public key alone
    determines a signing trapdoor from which a fresh message can be signed
    so that a separately compiled official verifier accepts it.
  mechanism: >-
    The mechanism under test is the published sign-10-2 argument, as
    reported by Saarinen, ePrint 2026/2266. This hypothesis does not
    restate that argument's internal equations. The executor reads them
    from the finding and the specification before any recovery run. No
    signature is an input to recovery. A trapdoor is accepted only through
    the scheme's verification API.
  assumptions:
    - The official package's reference implementation matches the specification on honest key generation, signing, and verification for Facto-DSA-128.
    - The package contains a parameter set identifiable as Facto-DSA-128 before recovery begins. If it does not, the run is invalid rather than a falsification.
  proof_search_map:
    not_applicable_reason: >-
      This hypothesis is an empirical reproduction of a published concrete
      claim. It asserts no theorem, asymptotic bound, or reduction.
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
  predictions:
    - metric: fresh_message_signatures_accepted_by_separate_verifier
      direction: higher
      minimum_effect: >-
        At least one accepted fresh-message signature on each of two
        independent Facto-DSA-128 keys, using only the public key as
        recovery input.
  test_boundary:
    instances:
      - sign-10 Facto-DSA, official round-1 zip named in inputs/ngcc-round1-20260920/candidates.yaml
    parameters:
      parameter_set: Facto-DSA-128
      keys: 2
      keygen_seeds: [0, 1]
    implementation: >-
      Reference C compiled by this program from submission sources.
      Nothing shipped as a binary, object file, or submission build script
      is executed.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: null
      maximum_memory_gb: 8
  falsification_conditions:
    - >-
      Both seeds finish a recovery attempt on Facto-DSA-128 without an
      accepted fresh-message signature, and the run manifest records a
      completed attempt rather than a build failure, timeout, or crash.
  interpretation_limits:
    - A success is scoped to Facto-DSA-128 on the tested package and seeds. It does not transfer to other parameter sets or a later revision.
    - The published 6.4 second timing is a comparison, not a pass-fail bound. A slower successful forgery still meets the statement.
    - A failure of this reproduction does not clear Facto-DSA. It refutes only this published argument on the tested instances.
  status: specified
  proposed_by: coordinator
