hypothesis:
  id: H-RSA-0f37d4
  question_id: RQ-RSA-afe33c
  derived_from_idea: IDEA-20260805-1775f2
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  statement: >-
    The corpus's unreconciled disagreement between core-year extrapolations and area-time costings
    of the number field sieve is a SINGLE FREE PARAMETER, not a disagreement about facts. Charging
    the shared linear-algebra memory S as S^theta, holding relation collection storage-free, and
    re-optimizing the GNFS parameters yields the one-parameter family c(theta)^3 = 4 (2 + theta)^4 /
    (9 (1 + theta)^2), with beta(theta)^3 = 4 (2 + theta) / (9 (1 + theta)^2) and delta(theta)^3 =
    12 (1 + theta) / (2 + theta)^2. The family reproduces the classical exponent exactly at theta =
    0 (c^3 = 64/9), supplies the value this program's own declared three-dimensional wiring
    convention forces at theta = 1/3 (c^3 = 2401/324, a number that appears nowhere in this corpus),
    and lands at theta = 1/2 on c^3 = 625/81 (c = 1.976052). A second, independent consequence is
    that beta(theta) is STRICTLY DECREASING - charging memory does not merely raise the cost, it
    moves the optimal parameters toward a smaller factor base and more sieving.
  mechanism: >-
    With l = log n and L[c] = exp((c + o(1)) l^(1/3) (log l)^(2/3)), let B = L[beta] be the
    smoothness bound, A = L[alpha] the number of candidate pairs, and the polynomial degree
    parameter delta. The norm product for a pair has logarithm (alpha delta / 2 + 2 / delta) l^(2/3)
    (log l)^(1/3); smoothness under the Canfield-Erdos-Pomerance estimate gives u^(-u) = L[-(alpha
    delta / 2 + 2/delta) / (3 beta)]; and needing about B relations gives the relation condition
    alpha - (alpha delta / 2 + 2 / delta) / (3 beta) = beta. Relation collection has O(1) live state
    per processor so its full cost equals its step count L[alpha] for every theta; block Wiedemann
    on a sparse N x N matrix has step count L[2 beta] and holds a SHARED object of size S = L[beta],
    so its full cost is L[(2 + theta) beta]. Balancing the two stages gives alpha = (2 + theta)
    beta; substituting into the relation condition and minimizing over delta collapses the surd
    exactly and removes every radical, yielding the three closed forms. The stationarity condition
    and the relation condition close on each other, which a wrong derivation would have to arrange.
  assumptions:
  - >-
    Every value is an exponent in L-notation with an uncontrolled o(1). At sizes of cryptographic
    interest the o(1) is not small, and NOTHING here licenses a concrete statement about any RSA
    modulus size.
  - >-
    The family covers SINGLE-KEY GNFS only. Batch NFS with early aborts amortizes across keys and is
    a different optimization that c(theta) does not cover; comparing the two would be a category
    error.
  - >-
    theta is a property of the COST CONVENTION, not of the world. Whether real machines behave like
    theta = 0, 1/3 or 1/2 is an empirical question about interconnects that this hypothesis
    deliberately leaves open, and 'the record data does not determine theta' is a pre-authorized
    outcome.
  - >-
    Filtering, merge and polynomial selection are charged nowhere in the model. They are argued not
    to change the exponent under the stated assumptions, and that argument is FLAGGED rather than
    defended.
  proof_search_map:
    bottleneck: >-
      The step that carries the whole result is the ASYMMETRIC charging: memory charged S^theta on
      the linear algebra and not on relation collection. If both stages are charged, the balance
      reverts to alpha = 2 beta, beta returns to the classical value and the full cost becomes (2 +
      theta) times the classical beta - which matches no published endpoint. That the asymmetric
      charging is the one reproducing a published endpoint is itself information and is reported as
      such, not assumed.
    baseline_embedding:
      parameter_slice: >-
        theta = 0 is the exact old-method boundary: memory free, which must return the classical
        GNFS exponent.
      reproduction_check: >-
        SYMBOLIC, in exact rational arithmetic - c(0)^3 exactly 64/9, beta(0)^3 exactly 8/9,
        delta(0)^3 exactly 3. Not a curve that resembles a plot; exact rationals compared as
        Fractions.
    observation_collision:
      observable: 'The single real number theta, the exponent with which shared linear-algebra memory is charged.'
      distinct_preimage_search: >-
        The collision risk here is MODEL-FITTING BY CHOICE OF theta: given any target exponent one
        can solve c(theta) = target for theta, which would make the family unfalsifiable IF theta
        were free. It is not - theta = 1/3 is forced by this program's own declared convention
        before any data is seen, and the theta = 0 and theta = 1/2 endpoints are fixed by exact
        identities. The contract pre-registers theta = 1/3 as the treatment.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        A one-parameter family of GNFS full-cost exponents indexed by the memory-access exponent
        theta, with closed forms for c, beta and delta.
      predicted_gain: >-
        Two costings currently held as conflicting authorities become two members of one family, and
        the program can state which convention it is quoting and what that convention costs.
    quantifier_order: >-
      FOR ALL theta in [0, 1], THERE EXISTS a unique optimal triple (alpha, beta, delta) given by
      the three closed forms, and the full-cost exponent is c(theta). The uniqueness matters: the
      optimization is a smooth minimax and the closed forms leave no residual freedom, which is what
      makes theta an object rather than a summary statistic.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim a run may support is that a family of COST-MODEL exponents has these
        exact rational values at these theta, and that the classical exponent is reproduced at theta
        = 0. It moves no exponent of the FACTORING PROBLEM. It does not make factoring easier or
        harder; it makes the program able to say which number it is quoting.
      nearby_object_control: >-
        Shanks baby-step giant-step under the identical S^theta rule, which must return the
        classical square-root exponent at theta = 0 and the two-thirds exponent at theta = 1/3, the
        second being a result this program's own technique entries state independently. If the
        machinery cannot reproduce the program's own established full-cost result on the simplest
        possible algorithm, the instrument is broken and NO conclusion about NFS may be reported.
    proof_obligations:
    - claim: 'The relation condition and the stage-balance condition are as stated.'
      responsibility: correctness
    - claim: 'The stationarity condition in delta collapses the surd exactly.'
      responsibility: correctness
    - claim: 'The family reproduces the classical exponent at theta = 0.'
      responsibility: baseline
    - claim: 'Relation collection has full cost equal to its step count for every theta.'
      responsibility: runtime
    - claim: 'The shared matrix has size L[beta] and is charged once.'
      responsibility: memory
    - claim: 'No concrete-size statement follows from an L-notation exponent with an uncontrolled o(1).'
      responsibility: scope
    not_applicable_reason: null
  asymptotic_claim:
    problem: Integer factorization by the general number field sieve, single key
    prior_best: 'L[1/3, (64/9)^(1/3)] heuristic time with memory uncharged'
    time_exponent: 'c(theta) = ((2 + theta)^4 * 4 / (9 (1 + theta)^2))^(1/3); c(1/3) = (2401/324)^(1/3) = 1.949616'
    memory_exponent: 'beta(theta) = (4 (2 + theta) / (9 (1 + theta)^2))^(1/3); beta(1/3) = 0.835550'
    hidden_cofactor: >-
      The entire o(1) in L-notation, which is not small at any reachable size; the filtering and
      merge stage, charged nowhere; polynomial selection, charged nowhere; the post-merge matrix
      density treated as L[o(1)] though it is a factor of a few hundred at reachable sizes; and the
      constant in the wiring model, which the program's own technique entry says is asymptotic with
      unextracted constants.
    claim_kind: cofactor_improvement
  heuristic_assumptions:
  - id: HEUR-NFS-1
    formal_statement: >-
      (Canfield-Erdos-Pomerance / Dickman.) For the pairs enumerated by the sieve, the probability
      that the product of the two norms - an integer of size exp(u log B) - is B-smooth is
      u^(-u(1+o(1))), the same as for a uniformly random integer of that size. Formally: for all
      fixed epsilon greater than 0 there is n_0 such that for all n greater than n_0 and all (alpha,
      beta, delta) in the compact parameter region considered, the relation yield differs from A
      times u^(-u) by a factor L[o(1)].
    random_model_justification: >-
      The CEP theorem is rigorous for UNIFORMLY RANDOM integers. The norms are not uniformly random:
      they are values of two homogeneous forms on a lattice region with systematic divisibility
      biases. The standard NFS response is that these biases contribute only to the o(1). NO
      RIGOROUS SUPPORT FOR THAT RESPONSE IS OFFERED HERE and none is claimed. This is the single
      load-bearing heuristic of the entire NFS complexity analysis and it is stated rather than
      hidden.
    supporting_results:
    - 'Canfield-Erdos-Pomerance smoothness density theorem - classical, recalled, not read by this program'
    validation_experiment_ids: []
    falsification_condition: >-
      Measured smoothness yield on real NFS norms departs from the Dickman prediction by more than a
      factor L[o(1)]. NOT validated by this hypothesis and it does not need to be, because the
      DIFFERENCE between c(theta) and c(0) does not depend on it - the heuristic enters both
      identically and cancels in any comparison across theta. That cancellation is itself a
      checkable claim and is a required check.
  - id: HEUR-NFS-2
    formal_statement: >-
      (Storage asymmetry.) There exists a scheduling of relation collection such that for all theta
      in [0, 1] its full-cost exponent equals alpha; and for all schedulings of block Wiedemann the
      linear-algebra full-cost exponent is at least 2 beta + theta beta, because the iterates are
      global and the matrix is a single shared object of size L[beta].
    random_model_justification: >-
      Architectural rather than proved. Lattice sieving processes a bounded region per special-q and
      ECM-based cofactorization carries O(1) state per candidate, so neither needs a working set
      growing with B. THE SPECIFIC HOLE IS NAMED: the factor base must be reachable, and if it must
      be REPLICATED across P processors the area becomes P times B and the argument fails.
    supporting_results: []
    validation_experiment_ids:
    - EXP-RSA-b101ed
    falsification_condition: >-
      Reported sieving deployments in the record computations carried per-node working sets that
      scale with the factor base. HEUR-NFS-2 is then wrong at real scale, the family covers no real
      machine, and it must be re-derived with theta charged on both stages - which gives a
      materially different and much larger exponent that matches no published endpoint.
  - id: HEUR-NFS-3
    formal_statement: >-
      (Density and matrix dimension.) After filtering and merge, the matrix dimension N and the
      factor-base size B satisfy N = B^(1+o(1)), and the average row density is L[o(1)].
    random_model_justification: >-
      Structurally forced for the dimension - the matrix has one column per factor-base element and
      filtering only removes rows and columns. The DENSITY claim is the weak half: post-merge
      densities at record sizes are in the hundreds, and treating that as L[o(1)] is an asymptotic
      convenience hiding a large concrete factor.
    supporting_results: []
    validation_experiment_ids:
    - EXP-RSA-b101ed
    falsification_condition: >-
      The actual N, B and row density read from primary text of a record computation are
      inconsistent with N = B^(1+o(1)), or the concrete density factor being hidden is large enough
      that no o(1) reading is defensible. The deliverable states the concrete factor rather than
      asserting it is negligible.
  structural_ingredients:
  - description: >-
      The three-dimensional wiring full-cost model, in which a search needing n^(1/2) processor
      steps has full cost n^(2/3+o(1)), and its application to meet-in-the-middle and collision
      search.
    citation: KN-TECH-035 and KN-TECH-057
    provenance: internal
    verified_by: 'read in-corpus; both are technique entries of this program'
    role: >-
      Supplies the exponent 1/3 in S^(1/3) and commits this program to theta = 1/3 rather than theta
      = 0 before any data is seen. The primary Wiener source is NOT read; the exponent is taken from
      these technique entries' own statements.
  - description: >-
      The reported single-key area-time figure for NFS, used only as the comparison target the
      derivation is checked against.
    citation: KN-LIT-2663
    provenance: recalled
    verified_by: null
    role: >-
      COMPARISON TARGET, NEVER AN AUTHORITY. The corpus entry is bulk-seeded, its own text says its
      claims are relayed from an abstract without independent verification, its year, venue and
      identifier fields are null, and its relevance paragraph is unrelated boilerplate. Whether
      c(1/2) agreeing with it is corroboration or coincidence is a reading task, not an assertion.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: c_at_theta_0_cubed
    direction: different
    minimum_effect: >-
      EXACTLY 64/9 as an exact rational. Not approximately 7.11, not within one per cent. If an
      independent re-derivation returns anything else, the classical GNFS exponent is not reproduced,
      the family is wrong, and the line terminates at zero compute. This is the cheapest falsifier
      available.
  - metric: c_at_theta_half_cubed
    direction: different
    minimum_effect: >-
      EXACTLY 625/81, i.e. c = 1.976052. The pre-registered comparison target is the relayed
      single-key area-time figure. A match to the digits that figure carries is a PASS; a mismatch is
      a FAIL and must be reported as either a derivation error or a transcription error in the corpus
      entry, with the two distinguished by reading primary text.
  - metric: c_at_theta_third_cubed
    direction: different
    minimum_effect: >-
      EXACTLY 2401/324, i.e. c = 1.949616. There is no published comparison target for this value in
      this corpus; its only pre-run check is internal consistency with the closed form and with the
      monotone ladder.
  - metric: beta_ladder_monotonicity
    direction: lower
    minimum_effect: >-
      STRICTLY DECREASING across theta in {0, 1/6, 1/4, 1/3, 5/12, 1/2}, with exact cubes 8/9,
      104/147, 16/25, 7/12, 464/867, 40/81. A non-monotone ladder falsifies the closed form and the
      failing interval localises the error.
  - metric: bsgs_positive_control_exponent
    direction: different
    minimum_effect: >-
      EXACTLY n^(2/3) at theta = 1/3 for Shanks baby-step giant-step under the identical charging
      rule. IF THE MACHINERY DOES NOT RETURN n^(2/3) HERE, THE INSTRUMENT IS BROKEN AND NO CONCLUSION
      ABOUT NFS MAY BE REPORTED AT ALL.
  - metric: null_object_theta_independence
    direction: different
    minimum_effect: >-
      EXACTLY (64/9)^(1/3) FOR EVERY theta, for a hypothetical NFS variant whose linear-algebra stage
      holds O(1) shared state. This null CAN FAIL - if the algebra leaks a theta-dependence into a
      stage that stores nothing, the optimization is mis-set-up and every treatment number is
      uninterpretable.
  test_boundary:
    instances:
    - 'The GNFS cost model itself, at six ladder points theta in {0, 1/6, 1/4, 1/3, 5/12, 1/2}'
    - 'A null NFS variant with O(1) shared linear-algebra state'
    - 'Shanks baby-step giant-step, as the positive control'
    parameters:
      arithmetic: exact rational (Fraction), no floating point in any gate
      theta_ladder: '0, 1/6, 1/4, 1/3, 5/12, 1/2'
      treatment: theta = 1/3, pre-registered
    implementation: >-
      Symbolic re-derivation plus exact rational evaluation in Python. No network beyond a reading
      stage, no solver, no seeds, no randomness, no floating point in any comparison.
    budget:
      wall_clock_seconds_per_run: 300
      maximum_memory_gb: 2
  falsification_conditions:
  - 'c(0)^3 is not exactly 64/9. The family does not reproduce the classical GNFS exponent and is withdrawn.'
  - 'beta(0)^3 is not exactly 8/9, or delta(0)^3 is not exactly 3.'
  - >-
    The BSGS positive control does not return n^(2/3) at theta = 1/3. No negative about NFS may then
    be reported at all; the finding is that the instrument is broken.
  - >-
    The null object returns a theta-dependent exponent. The optimization is mis-specified and every
    treatment number is uninterpretable.
  - 'The ladder is non-monotone in c or in beta.'
  - >-
    Primary text shows the relayed single-key area-time exponent is not 1.976. The theta = 1/2
    endpoint agreement is then not corroboration, and the record must say which of the two numbers
    moved.
  - >-
    HEUR-NFS-2 is shown wrong at the sizes that matter - the sieve's per-processor working set grows
    like a positive power of B. The family then covers no real machine and must be re-derived with
    theta charged on both stages.
  interpretation_limits:
  - >-
    This is a statement about a COST MODEL and nothing else. Not a factorization, not an attack, not
    an improvement to NFS, and not a statement about the security of any deployed RSA key.
  - >-
    SINGLE-KEY ONLY. c(theta) does not cover batch NFS, early-abort smoothness detection, or any
    amortized-across-keys regime. Comparing a per-key batch figure to a point on this curve is a
    category error.
  - >-
    A theta = 1/3 exponent of 1.9496 against theta = 0's 1.9230 is a 1.4 per cent change in an
    exponent that sits inside a triple exponential. It is NOT a security-relevant re-costing on its
    own and must never be presented as one. Its value is that the program can state which convention
    it uses and what that convention costs.
  - >-
    Nothing here resolves whether real machines behave like theta = 0, 1/3 or 1/2. That is an
    empirical question about interconnects, deliberately left open, and 'the record data does not
    determine theta' is a pre-authorized reportable result.
  - >-
    No concrete-cost table at any modulus size may be built from this record before the record-
    reproduction gate this goal declares has passed. The o(1) is not small at reachable sizes.
  prior_evidence_refs: []
