  added: '2026-09-06'
  specified_at: '2026-09-06'
  specified_by: coordinator
  proposed_by: idea-generator
  status: specified

  title: >-
    THE BASIN-PARTITION COVERAGE INSTRUMENT: the coverage of a
    Bernstein-Lange distinguished-point table is a sum of disjoint exact
    basin sizes; the basin-size law is Borel(1 - theta); the unselected
    coverage, the oracle ceiling C_max(a) and the oracle online constant
    follow in closed form; the published weight's coverage sits below the
    ceiling by an estimation loss that shrinks with N/T; every constant is
    N-independent on 2^20..2^30 and identical between a keyed random
    function and an r-adding curve walk -- with Bernstein-Lange's Section 4
    case study and Table 4.1 as the primary-source fixture the instrument
    must reproduce before any other arm is reported.

  statement: >-
    (A) THE OBJECT. For a deterministic walk f on a set of size N that is a
    function of the current point only, and a distinguishing predicate of
    density theta = 1/W, the basin B(d) of a distinguished point d is the
    set of x whose forward orbit reaches d before any other DP. Basins of
    distinct DPs are DISJOINT; their union is everything but the DP-free
    cycles. A uniform-start walk hits a stored set X exactly when its start
    lies in the union of X's basins, so the single-walk coverage of ANY
    table X is exactly C(X) = sum_{d in X} |B(d)| / N (minus cycle mass);
    the value of a stored entry is one number, its basin size. This is
    Bernstein-Lange's own "number of ancestors" (primary text lines
    469-472).
    (B) THE PREDICTED LAWS (derived in IDEA-20260906-aed829, UNVERIFIED by
    any validator; written here verbatim as pre-registered predictions).
    Under HEUR-BLT-1 and HEUR-BLT-2, for a uniformly random DP, |B(d)| is
    Borel(1 - theta): P(n) = e^{-(1-theta) n} ((1-theta) n)^{n-1} / n!,
    asymptotically (2 pi)^{-1/2} n^{-3/2} exp(-n theta^2 / 2). With
    x = n / W^2 and a = T W^2 / N:
      (B1) UNSELECTED LAW: the deduplicated union of the basins reached by m
           independent uniform-start walks covers C_rand(a_m) =
           1 - (1 + 2 a_m)^{-1/2}, a_m = m W^2 / N; 0.423 at a_m = 1.
      (B2) ORACLE CEILING: the T largest basins cover C_max(a) =
           erfc( sqrt(x*/2) ), x* solving
           2 x*^{-1/2} e^{-x*/2} - sqrt(2 pi) erfc( sqrt(x*/2) ) = a sqrt(2 pi);
           a = 1: x* = 0.19, C_max = 0.66; a = 1/2: 0.40, 0.52;
           a = 1/4: 0.74, 0.39; a = 1/8: 1.2, 0.27. No selection rule can
           exceed C_max at fixed (T, W), by disjointness.
      (B3) ORACLE ONLINE COST at T = N^{1/3}: L sqrt(T/N) = sqrt(a)/C_max(a)
           = 1.51 (a = 1), 1.35 (1/2), 1.28 (1/4), 1.30 (1/8); at fixed L
           the minimum table is T_oracle = 1.64 N / L^2.
      (B4) PRECOMPUTATION of a pool of r T DISTINCT DPs (the paper's
           procedure): walks needed m = (r + r^2 a / 2) T, so
           P / sqrt(N T) = alpha r (1 + r a / 2) with alpha = sqrt(a);
           1.25 at (a, r) = (1/4, 2) against the published 1.17-1.24;
           2.12 at (1/2, 2) against 1.90; this form follows from (B1) and is
           this record's arithmetic, added at design time.
    (C) THE FIXTURE AND THE CLAIM. Bernstein-Lange's Section 4 case study
    (alpha = 1/2, N = 2T) reports 1.79 (l/T)^{1/2} per logarithm after
    1.24 (lT)^{1/2} (T = 64 and T = 1024; 1.77 at T = 65536), and Table 4.1
    (l about 2^48, W = 2^19, 2^20 experiments per cell, error below 0.02)
    reports at alpha = 0.707 (a = 1/2) / alpha = 1 (a = 1): N/T = 1: 2.14 /
    2.01; N/T = 2: 1.62 / 1.62; N/T = 8: 1.38 / 1.50. Against (B3) the
    published rule at N/T = 8 sits within 2% of the model ceiling (1.38 vs
    1.35; 1.50 vs 1.51) and at N/T = 2 sits 1.20x / 1.07x above it, and at
    the headline a = 1/4 point 1.40x above (1.79 vs 1.28). THE CLAIM: (i)
    the basin-size survival function has log-log slope -1/2 (n^{-3/2}
    density) on 10 <= n <= W^2/4 and an exponential cutoff at n theta^2/2 =
    1, i.e. n = 2 W^2; (ii) unselected coverage follows (B1) within 10% at
    N >= 2^24; (iii) the top-T share follows (B2) within [0.90, 1.05] at
    a in {1/8, 1/4, 1/2, 1}; (iv) the published weight, reproduced with the
    paper's procedure, matches the case-study 1.79 and the Table 4.1 rows
    within 0.10 in scaled cost and its coverage divided by the generated-set
    oracle rises monotonically with N/T to above 0.97 at N/T = 8; (v) every
    constant is N-independent across 2^20..2^30 within CI after O(theta)
    corrections are reported; (vi) the r-adding curve walk with r >= 16
    gives the same constants as the keyed random function within CI, with
    every curve-arm solve certified.
    (D) WHAT IS NOT CLAIMED. No attack; a measurement. The exponent 1/3 does
    not move (KN-LIT-013); the instrument bounds the SELECTION axis at fixed
    (T, W, walk) and names no non-generic structure. Every number is
    claim_tier toy.

  mechanism: >-
    Coverage is additive over disjoint basins, so the only quantity a
    selection rule can act on is the multiset of basin sizes, and the only
    information the rule has is the size-biased sample of that multiset
    delivered by generation walks. The Borel law fixes the multiset's shape
    (a heavy n^{-3/2} body cut off at 2 W^2), size-biased sampling fixes
    what the generator sees (Poisson(r a x) hits on a basin of scaled size
    x), and the oracle top-T share fixes what the best possible T entries
    can cover. The published weight's shortfall from the oracle is therefore
    an ESTIMATION loss that must close as the pool ratio grows -- which is
    what Table 4.1's approach to the model ceiling at N/T = 8 shows. The
    instrument makes each of these steps a separate measurable with an
    exact (enumerated) value at small N and a sampled value at larger N,
    and refuses to report any downstream arm until the published numbers
    are reproduced.

  assumptions:
    - >-
      The closed forms (B1)-(B4) are derivations of this batch
      (IDEA-20260906-aed829 for (B1)-(B3), this record for (B4)) from the
      Borel asymptotic and carry O(theta) and finite-N corrections; they are
      predictions to be tested, not results to be cited, until a validator
      re-derives them (the derivation is carried as a proof-shaped claim in
      IDEA-20260906-ac100b).
    - >-
      Bernstein-Lange's procedure, weight, cap, parameters, Section 4
      figures and Table 4.1 are taken from the coordinator's full read of
      the primary text (scratchpad bl2012.txt, 2026-09-06). Their pool "N"
      counts DISTINCT distinguished points with every generating walk
      charged; the N = T cell discards duplicates and continues (their own
      remark that this biases toward short walks) and must be reproduced
      literally.
    - >-
      Online cost is charged as counted walk steps per successful logarithm
      (total steps over single-walk trials divided by hits), walks capped at
      8W, excluding restart and double-check multiplications, exactly as the
      paper's metric; precomputation is the sum of all generation walk
      lengths with capped walks charged at the cap.
    - >-
      Two references carrying the size-biased-Borel step (Flajolet-Odlyzko
      random mapping statistics; Aldous-Pitman size-biased Galton-Watson)
      are RECALLED and unopened; the record does not rely on them for any
      number, only names them for the reviewer, and its novelty label stays
      unverified until a validator opens them.
    - >-
      Toy scale only; N-independence across 2^20..2^30 is the only transfer
      evidence and extrapolation to 2^256 is an assumption named in
      interpretation_limits.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: >-
        The published-weight arm at (a, N/T) in {(1/4, 2), (1/2, 1),
        (1/2, 2), (1/2, 8), (1, 1), (1, 2), (1, 8)} with the paper's
        procedure is the exact old-method boundary.
      reproduction_check: >-
        Frozen regression fixture: scaled main-computation cost within 0.10
        of 1.79 / 2.14 / 1.62 / 1.38 / 2.01 / 1.62 / 1.50 and scaled
        precomputation within 12% of 1.24 / 0.85 / 1.90 / 15.7 / 1.34 /
        3.66 / 36.9 at N >= 2^24 (tolerance set by the theta gap between
        the paper's l about 2^48 and the toy N).
    observation_collision:
      observable: >-
        The single number C(X) for a table X; two tables with the same basin
        multiset are indistinguishable by coverage, which is the point --
        coverage is the quotient the instrument measures.
      distinct_preimage_search: >-
        Not applicable as a search; the identity C(X) = sum of basins is
        exact by disjointness and is audited by the exact-versus-empirical
        coverage comparison at every cell.
    constructive_transforms: []
    quantifier_order: >-
      For every N in the tested set, every a in the grid and every seed:
      for every stored set X of size T, C(X) <= top-T share (global oracle).
      The ceiling depends on (T, W, f) and not on the selection rule.
    method_ceiling:
      strongest_certifiable_claim: >-
        Measured constants (slope, cutoff, C_rand, C_max, estimation-loss
        ratios) with CIs on the tested grid, claim_tier toy; the model's
        closed forms either reproduce them within the stated bands or are
        withdrawn as predictions. The exact top-T share is a MEASUREMENT and
        stands regardless of the Borel model.
      nearby_object_control: >-
        Uniform-random selection of T DPs from the generated set
        (unselected), count-only selection (c -> infinity limit), and the
        curve walk versus the random function.
    proof_obligations: []
    not_applicable_reason: >-
      Measurement-class hypothesis; the proof-shaped content (derivation of
      (B1)-(B3)) is IDEA-20260906-ac100b's and fills its own map there. The
      fields above that are filled are the cheap audits the instrument
      enforces as gates.

  rerandomization: >-
    Online walks start at Q + [c]P for independent uniform c (the paper's
    h g^y), so each online walk is a uniform-start walk and the coverage
    C(X) is target-independent; on the curve arm a hit at d with
    accumulated scalar s yields log Q = log d - c - s, certified by
    [k]P == Q. No mixing-time claim beyond Teske's r-adding-walk heuristic
    (KN-LIT-012); the generic-versus-curve two-sample comparison of exact
    basin multisets is the instrument's own measurement of walk randomness.

  asymptotic_claim:
    problem: >-
      Discrete logarithm in a prime-order group with group-specific
      precomputed advice (Bernstein-Lange / Corrigan-Gibbs-Kogan model).
    prior_best: >-
      Bernstein-Lange published weight: 1.79 (l/T)^{1/2} at alpha = 1/2,
      N/T = 2 after 1.24 (lT)^{1/2}; 1.38 at alpha = 0.707, N/T = 8 after
      15.7 (Table 4.1); 2.58 unselected. S T^2 = Omega~(eps N), tight
      (KN-LIT-013).
    time_exponent: >-
      1/3 in N online, UNCHANGED; the instrument targets the CONSTANT: the
      model oracle 1.28 (a = 1/4) against the published 1.79 at N/T = 2.
      Precomputation 2/3, UNCHANGED.
    memory_exponent: >-
      1/3 in N, UNCHANGED; at fixed L the model floor T = 1.64 N/L^2 against
      the headline 3.20 N/L^2, a factor 1.95 reachable only as P grows,
      and 1.16 against the N/T = 8 row; measured, not claimed reached.
    hidden_cofactor: >-
      O(theta) Borel corrections and cap/cycle losses hidden in the closed
      forms; restart scalar multiplications and lookups excluded from L as
      in the paper; bits per entry frozen and reported separately.
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BLT-1
      formal_statement: >-
        RANDOM-FUNCTION HEURISTIC. For an r-adding walk with r >= 16 on a
        prime-order group and a DP predicate of density theta = 1/W with
        W <= N^{1/3}, the DP-truncated functional graph has the same law as
        that of a uniformly random function on N points truncated at an
        independent Bernoulli(theta) marking, up to o(1) relative error in
        every statistic used here (basin-size CDF, largest basin, depth
        profile, coverage), uniformly for N in [2^20, 2^30].
      random_model_justification: >-
        Random-mapping statistics (tree and component sizes of a uniformly
        random function; Flajolet-Odlyzko, RECALLED) composed with
        Bernoulli thinning give the rigorous half; the heuristic half is
        that r-adding walks behave as random mappings, supported
        empirically by Teske for r >= 20 at the level of the rho constant
        (via KN-LIT-012).
      supporting_results:
        - >-
          Teske 2001 (cited in KN-LIT-012, kb): well-chosen r-adding walks
          reach the ideal random-walk constant.
        - >-
          Flajolet-Odlyzko, Random mapping statistics, EUROCRYPT 1989
          (RECALLED, unopened; a pointer, not support).
      validation_experiment_ids: [EXP-ECDLP-869870]
      falsification_condition: >-
        Two-sample Kolmogorov-Smirnov statistic between the exact basin
        multisets of the keyed random function and the curve walk rejects
        at alpha = 0.01 in 3 or more of 3 seeds at N = 2^24, or the body
        slope lies outside [-1.6, -1.4] at N >= 2^24, or the largest basin
        per seed falls outside the Borel(1-theta) N/W-sample 99% band in
        more than one seed in five.
    - id: HEUR-BLT-2
      formal_statement: >-
        SIZE-BIASED SAMPLING. A generation walk from a uniformly random
        start lands in the basin of DP d with probability |B(d)|/N,
        independently across walks; the number of walks landing in a basin
        of size n out of T_gen is Binomial(T_gen, n/N), approximately
        Poisson(r a x) with x = n/W^2, r = T_gen/T, a = T W^2/N.
      random_model_justification: >-
        Exact given the basin partition (a start point is uniform in G);
        the paper states the same fact. The imitated classical statement is
        the size-biased Borel law of the component containing a uniform
        vertex (Aldous-Pitman, RECALLED).
      supporting_results:
        - >-
          Bernstein-Lange, primary text lines 469-472 (retrieved): "the
          chance of a uniform random group element walking to this point is
          exactly the number of ancestors divided by l".
      validation_experiment_ids: [EXP-ECDLP-869870]
      falsification_condition: >-
        At N = 2^24 with T_gen = 16 T, the regression of observed hit count
        on exact basin size has slope outside 0.9-1.1 times T_gen/N or
        intercept CI excluding 0, or variance/mean of hit counts outside
        [0.9, 1.1], in 3 or more of 5 seeds; or the most-hit DP's basin is
        outside the top 1% of basins in more than 5% of seeds-cells.

  structural_ingredients:
    - description: >-
        Definition of "most useful" as most ancestors; the published weight;
        the precomputation procedure; the Section 4 case study and Table
        4.1; the "crude approximation" 1 - exp(-alpha^2) and the Lee-Cheon-
        Hong T = M(sqrt(1+2a)-1)/a heuristic quoted on the paper's page 10.
      citation: >-
        Bernstein-Lange, Computing small discrete logarithms faster,
        INDOCRYPT 2012; cr.yp.to/dlog/cuberoot-20120919.pdf; eprint 2012/458
        (KN-LIT-3060)
      provenance: retrieved
      verified_by: coordinator full read 2026-09-06 (scratchpad bl2012.txt)
      role: object definition, baseline rule, regression fixture
    - description: Borel distribution of the total progeny of a Poisson Galton-Watson process.
      citation: "Borel (1942) / Otter; formula P(k) = e^{-mu k} (mu k)^{k-1} / k! for Poisson(mu) offspring"
      provenance: retrieved
      verified_by: idea-generator WebSearch snippet 2026-09-06 (formula confirmed; primary source not opened)
      role: distribution law of basin sizes
    - description: Generic preprocessing bound S T^2 = Omega~(eps N), tight.
      citation: KN-LIT-013 (Corrigan-Gibbs and Kogan, EUROCRYPT 2018)
      provenance: kb
      verified_by: KN-LIT-013 record read 2026-09-06; Theorem 8 read by the coordinator in scratchpad cgk.txt
      role: ceiling; constant-factor scope
    - description: Distinguished-point method and Teske r-adding walks.
      citation: KN-LIT-012
      provenance: kb
      verified_by: KN-LIT-012 record read 2026-09-06
      role: walk construction and randomness heuristic
    - description: Random-mapping statistics (tree and component sizes).
      citation: "Flajolet-Odlyzko, Random mapping statistics, EUROCRYPT 1989"
      provenance: recalled
      verified_by: null
      role: pointer for the reviewer; rigorous half of HEUR-BLT-1 if confirmed
    - description: Size-biased Borel law of the component of a uniform vertex.
      citation: "Aldous-Pitman, Tree-valued Markov chains derived from Galton-Watson processes, 1998"
      provenance: recalled
      verified_by: null
      role: pointer for the reviewer; classical statement imitated by HEUR-BLT-2

  reduction_chain:
    core_problem: >-
      Coverage of a stored distinguished-point set under a deterministic
      walk (a property of the functional graph, independent of the group
      law).
    corollaries: []

  predictions:
    - metric: log-log slope of the basin-size survival function on 10 <= n <= W^2/4
      direction: different
      minimum_effect: >-
        Within 0.10 of -1/2 at N >= 2^24 and every seed (within 0.15 at
        2^20 where theta = 1/64); outside [-0.6, -0.4] at N >= 2^24 the
        Borel model is wrong for this walk.
    - metric: position of the exponential cutoff of the basin-size density
      direction: different
      minimum_effect: >-
        Fitted cutoff n_c with n_c theta^2 / 2 in [0.5, 2] (i.e. n_c within
        a factor 2 of 2 W^2) at N >= 2^24.
    - metric: deduplicated coverage of m uniform-start walks divided by 1 - (1 + 2 m W^2/N)^{-1/2}
      direction: different
      minimum_effect: >-
        In [0.90, 1.10] at every m in T*{1/4, 1/2, 1, 2, 4, 8, 16} and every
        N >= 2^24, with no monotone drift across N beyond CI.
    - metric: exact top-T basin share divided by C_max(a)
      direction: different
      minimum_effect: >-
        In [0.90, 1.05] at a in {1/8, 1/4, 1/2, 1} and N in {2^22, 2^24};
        the residual attributable to reported cap and cycle mass.
    - metric: scaled main-computation cost of the published-weight arm beside the primary source
      direction: different
      minimum_effect: >-
        Within 0.10 of 1.79 at (a, N/T) = (1/4, 2) and of 2.14 / 1.62 /
        1.38 (a = 1/2) and 2.01 / 1.62 / 1.50 (a = 1) at N/T in {1, 2, 8},
        at N >= 2^24 (report-only at 2^20); the N/T = 8 cells within 0.05
        of the model oracle 1.35 / 1.51. Failure of the first is an
        instrument mismatch (invalid); failure of the second alone is a
        model failure and the more interesting outcome.
    - metric: scaled precomputation P / sqrt(N T) of the published procedure
      direction: different
      minimum_effect: >-
        Within 12% of the published 1.24 / 0.85 / 1.90 / 15.7 / 1.34 / 3.66
        / 36.9 at the corresponding cells; the (B4) form alpha r (1 + r a/2)
        reported beside it (expected 1-12% above the published values:
        1.25/1.24, 0.88/0.85, 2.12/1.90, 17.0/15.7, 1.50/1.34, 4.00/3.66,
        40.0/36.9).
    - metric: coverage of the published weight divided by the generated-set oracle, as a function of N/T
      direction: higher
      minimum_effect: >-
        Monotone increasing in N/T in {1, 2, 4, 8, 16} with CI-separated
        steps between 2 and 8; above 0.97 at N/T = 8.
    - metric: coverage under the relabelling null minus the unselected control
      direction: different
      minimum_effect: Zero within the Wilson interval at every cell (M = 40000 gives half-width about 0.005); exact at N <= 2^24.
    - metric: coverage as a function of sigma-noise in the ranking statistic, sigma in {0, 0.5, 1, 2, 4, 8}
      direction: lower
      minimum_effect: Monotone non-increasing from the rule value to the unselected value; a flat curve voids the cell.
    - metric: generic-instrument constant minus curve-walk constant at matched (N, a, N/T)
      direction: different
      minimum_effect: >-
        Zero within CI for r in {16, 32}; two-sample KS on exact basin
        multisets not rejecting at alpha = 0.01; a systematic difference is
        a walk-quality finding reported separately.
    - metric: N-drift of every constant across 2^20, 2^22, 2^24, 2^30
      direction: different
      minimum_effect: >-
        After subtracting the reported O(theta) trend, no constant differs
        between 2^24 and 2^30 beyond CI; drift is the artifact signature.

  test_boundary:
    instances: >-
      Generic instrument: keyed random function on [0, N) at N in
      {2^20, 2^22, 2^24} (exact basins by enumeration) and 2^30 (sampled
      walks only). Transfer arm: one toy prime-order short-Weierstrass curve
      over F_p with N about 2^24, r-adding walks with r in {16, 32}, exact
      basins by enumeration of the group, every online solve certified.
    parameters: >-
      T = N^{1/3} rounded to {64, 128, 256, 1024}; a in {1/8, 1/4, 1/2, 1}
      via W = sqrt(a N / T); N/T = r in {1, 2, 4, 8, 16} DISTINCT-DP pool
      ratio with the paper's N = T procedure at r = 1; caps 8W (paper) and
      20W (cap-loss arm); m in T*{1/4..16} for the unselected law; M = 40000
      online walks per cell where coverage is sampled; sigma in
      {0, 0.5, 1, 2, 4, 8}; 5 generic seeds, 3 curve seeds, 3 seeds at
      2^30.
    implementation: >-
      One implementation for all rules with the rule selected by
      configuration; exact coverage computed from the enumerated basins and
      cross-checked against the sampled coverage at every exact cell; the
      global oracle over ALL DPs (including in-degree-0 basins of size 1),
      the generated-set oracle over reached DPs, never confused; group
      operations counted, never timed.
    budget:
      total_cpu_hours: 16
      maximum_runs: 40
      maximum_memory_gb: 8
      wall_clock_seconds_per_run: 3600
    out_of_scope: >-
      Cryptographic sizes (2^34 and 2^40 named in the idea record are
      deferred to a successor contract); walk-history-dependent rules
      (IDEA-20260906-cf3b76); modified selection statistics
      (IDEA-20260906-05ffb8 is scored by this instrument but designed
      separately); any attack claim.

  distinguishable_outcomes:
    - outcome: >-
        Slope, cutoff, (B1) and (B2) within bands; the published-weight arm
        reproduces the case study and Table 4.1 within 0.10; the gap to the
        oracle closes monotonically with N/T; nulls at zero and decay
        monotone; constants N-independent; curve equals generic.
      means: >-
        INSTRUMENT VALIDATED and the model laws supported at toy scale: the
        program acquires the coverage constant it lacked -- C_max(a), the
        estimation-loss ratios C_rule/C_oracle as a function of N/T, and the
        oracle online constant -- as citable toy-tier measurements, and
        every selection-rule or batch-table record in this lane is scored
        against them. Nothing about exponents.
    - outcome: >-
        The published-weight arm fails to reproduce the primary-source
        figures within 0.10 at N >= 2^24.
      means: >-
        The instrument is not comparable to the paper. The run set is
        INVALID, not negative; nothing downstream is reported; the defect
        (cap, procedure, weight, DP definition) is located before any
        re-run.
    - outcome: >-
        The fixture reproduces but the basin-size slope or cutoff is
        outside its band, or (B1)/(B2) miss by more than 10%.
      means: >-
        The Borel closed forms are withdrawn as predictions and the
        instrument reports the empirical laws instead. The EXACT top-T share
        and the exact estimation-loss ratios remain valid measurements
        (they do not depend on the model); only the model's extrapolation
        is lost.
    - outcome: >-
        The fixture and the laws hold, but the N/T = 8 cells sit more than
        0.05 from the model oracle 1.35 / 1.51.
      means: >-
        A model failure with the instrument intact -- the more interesting
        outcome; the discrepancy is the measured quantity and is routed to
        the derivation record IDEA-20260906-ac100b for revision.
    - outcome: >-
        The published rule's coverage divided by the generated-set oracle
        does not rise with N/T.
      means: >-
        Contradicts size-biased Poisson hits and Table 4.1 itself; routed
        to review as a contradiction before any interpretation.
    - outcome: >-
        Curve constants differ from generic constants beyond CI (KS rejects
        or coverage differs).
      means: >-
        A Teske-type walk non-randomness finding at r in {16, 32}, reported
        separately and never folded into any rule's gain; the generic
        instrument's numbers stand for random functions only.
    - outcome: >-
        Constants drift with N beyond the reported O(theta) trend.
      means: >-
        The quantity measured is not the asymptotic constant; no
        extrapolation is licensed and every downstream record inherits that
        limit.
    - outcome: >-
        Any rule's exact coverage exceeds the global oracle share, or the
        relabelling null differs from the unselected control beyond CI.
      means: >-
        Implementation error (the first is impossible by disjointness);
        invalid run set.
    - outcome: Any run ends by timeout, crash or resource exhaustion.
      means: Infrastructure signal only (AGENTS.md rule 5); never evidence.

  falsification_conditions:
    - >-
      Basin-size body slope outside [-1.6, -1.4] (density) at N >= 2^24, or
      cutoff more than a factor 2 from 2 W^2: Borel model wrong for this
      walk; (B1)-(B3) withdrawn as predictions.
    - >-
      Unselected coverage deviates from (B1) by more than 10% at N >= 2^24
      with cap and cycle mass reported and insufficient to explain it:
      HEUR-BLT-2 fails.
    - >-
      Published-weight arm outside 0.10 of the primary-source figures at
      N >= 2^24: instrument not comparable; INVALID, not negative.
    - >-
      Any exact coverage above the global oracle share: implementation
      error; invalid.
    - >-
      Relabelling null differs from unselected beyond CI: instrument
      broken; nothing reported.
    - >-
      Constants drift with N beyond CI after the O(theta) trend: no
      asymptotic constant is measured; no extrapolation.

  interpretation_limits:
    - >-
      claim_tier toy. N-independence within 2^20..2^30 is the only transfer
      evidence; constants at 2^256 are an assumption.
    - >-
      The instrument bounds the SELECTION axis at fixed (T, W, walk); it
      says nothing about non-generic structure and does not move the
      exponent (KN-LIT-013, KN-TECH-005).
    - >-
      The choice of W (alpha) is part of the optimisation and is reported as
      a point on the (P, S, L, epsilon, U) frontier, never as a T reduction
      by itself; the paper's Figure 4.3 conclusion that extra precomputation
      beats alpha-tuning is not contested.
    - >-
      Precomputation memory is not charged in the RQ's model (the paper's
      own distinction) and this is stated, not hidden.
    - >-
      The generic arm certifies nothing (kind: none); only curve-arm cells
      carry discrete_log certificates.

