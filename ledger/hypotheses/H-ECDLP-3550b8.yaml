  id: H-ECDLP-3550b8
  id_allocation_provenance: >-
    Minted by the top-level session with `python3 tools/allocate_id.py
    --next hypothesis --area ECDLP`, confirmed free with `--check`, and
    relayed to the coordinator in the in-session design handoff for
    RQ-ECDLP-78dbc5 on 2026-09-06. Not derived by scanning state.
  question_id: RQ-ECDLP-78dbc5
  proposal_id: IDEA-20260906-aed829
  derived_from_idea: IDEA-20260906-aed829
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record; RQ-ECDLP-78dbc5 is itself unbound and the
