    quantifier_order: >-
      For every listed prime k, after N = 16k is formed, every positive
      divisor appears in the preregistered set and every preregistered
      integer divides N. For k = 15 the two sets differ.
    method_ceiling:
      strongest_certifiable_claim: >-
        The divisor partition. Not a structurally empty GHS cell and not a
        genus.
      nearby_object_control: >-
        k = 15. Reporting that the divisors of 240 equal the ten-element
        prime-k formula invalidates the run.
    proof_obligations:
      - claim: The five prime-k divisor sets match the preregistered lists.
        responsibility: correctness
