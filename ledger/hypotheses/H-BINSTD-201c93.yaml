  title: >-
    For each odd prime k in {11, 13, 17, 19, 23} the positive divisors of 16k
    are exactly ten integers, five of which divide 16.
  statement: >-
    Let k be 11, 13, 17, 19, or 23. The positive divisors of N = 16k are
    exactly {1, 2, 4, 8, 16, k, 2k, 4k, 8k, 16k}. The five divisors of 16 are
    the collapse candidates. The four divisors k, 2k, 4k, 8k are the live-lane
    candidates. 16k is the ambient degree. For k = 15 the same ten-element
    formula is not the full divisor set of 240. A collapse cell is labeled
    conditional on EXP-BINSTD-de887b, not unconditionally empty.
  mechanism: >-
    k is an odd prime that does not divide 16, so the divisor lattice of 16k
    is the product of the divisor lattice of 16 and {1, k}. GHS base fields
    whose degree divides 16 are the candidates the proposal calls collapsed.
    That collapse uses the eigenvalue relation certified only by
    EXP-BINSTD-de887b, which has not been run, so this contract stops at the
    integer lattice.
  assumptions: []
