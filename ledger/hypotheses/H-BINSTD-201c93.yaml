    bottleneck: Enumerating the positive divisors of 16k and of 240.
    baseline_embedding:
      parameter_slice: >-
        The five extension degrees 176, 208, 272, 304, 368 from the audit
        table m = 16k.
      reproduction_check: >-
        Two independent divisor loops. One trials upward from 1. The other
        trials downward from N. Their sets must match.
    observation_collision:
      observable: The sorted divisor set and the class of each divisor.
      distinct_preimage_search: >-
        Classifying by "divides 16" versus by membership in the preregistered
