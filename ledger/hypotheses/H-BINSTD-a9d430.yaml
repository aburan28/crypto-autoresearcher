# =============================================================================
# H-BINSTD-a9d430 -- Same-unit rho-tying exchange rate (gamma* / budget_bits)
# instrument for RQ-BINSTD-b6f698 reachability cells.
# Specified from IDEA-20260922-818b73 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
# Approved DEC-20261002-fc1d84.
#
# ZERO RUNS in this design packet. Incorporates HOLD-F / review corrections
# from analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-818b73.yaml:
# same-cell QSP restatement; cite KN-FIND-aa2efc / EV-ICPERF-10c5fc floor;
# unit field + mults-per-group-op exchange row; R = 60.81 under KN-LIT-661e97
# convention. No AUXIN. No Bedrock. Unlocks the gamma*/budget_bits column for
# the reachability-table carrier (IDEA-20260922-6028ed / EXP-BINSTD-1efa8e).
# =============================================================================
hypothesis:
  id: H-BINSTD-a9d430
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-818b73
  experiment_id: EXP-BINSTD-b2f621
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-fc1d84
  status: approved
  proposed_by: coordinator
  title: >-
    A same-unit budget_bits = R - floor_bits column (R = 60.81) with a measured
    mults-per-group-op exchange rate on RC-1 yields a well-defined gamma*
    / gamma_meas instrument for RQ-BINSTD reachability cells, reproducing the
    same-cell QSP >=49-bit gap from cited numbers alone

  statement: >-
    CLAIM (measurement instrument). RQ-BINSTD-b6f698's decision target asks
    what quantity an index-calculus line must achieve to tie matched rho.
    HYPOTHESIS: defining budget_bits(cell,m) = R - floor_bits(m) with
    R = 60.81 under the KN-LIT-661e97 / KN-FIND-aa2efc convention
    sqrt(pi*ell/(4*131)), floor_bits(m) = min_l [m! * 2^(N-(m-1)l) + m * 2^(2l)]
    (N = 2^131 for ECC2K-130; toy N for RC-1), plus a measured
    mults_per_group_op exchange rate on the frozen RC-1 cell, jointly make
    gamma*(cell) = 2^budget_bits and gamma_meas = oracle_cost_per_attempt /
    toy_floor_per_attempt WELL DEFINED in one unit. CORRECTED QSP control:
    at the SAME cell (n'=33, m=4), resultant floor 60.6 sits ~0.2 bit under
    R while IDEA-20260916-3f7a1c's certified attempts column (>=110 bits at
    d=3) yields a >=49.19-bit same-cell gap; the 133-bit "every constant
    kept" figure is the DIFFERENT cell (n'=66, m=2) and is cited only as
    cross-cell context, never as the (33,4) obstruction. CLAIM TIER:
    measurement instrument + arithmetic reproduction + RC-1 same-unit
    calibration. NO attack. NO exponent. NO break.

  mechanism: >-
    NO NEW TRACKED OBJECT. Second-order measurement over objects already
    declared by owning lines (QSP / CERTBIN / decomposition family). What is
    NEW relative to the idea's raw claim, after HOLD-F: (i) adopt
    KN-FIND-aa2efc / EV-ICPERF-10c5fc's family-level oracle-budget column as
    the ECC2K-130 row definition (dominated_by corrected); (ii) require a
    unit field and a measured mults_per_group_op row before any gamma* is
    quoted as a comparable number across engines; (iii) restate the QSP
    worked example same-cell so the table never inherits a cross-cell 72-bit
    figure. The charged stage is the DECISION whether a measured
    decomposition-attempt cost can tie rho — upstream of any single phase.

  assumptions:
    - >-
      Floor_bits for ECC2K-130 rows are read from KN-FIND-aa2efc /
      EV-ICPERF-10c5fc (or independently re-derived from the stated product-law
      formula); this contract does not invent a new floor.
    - >-
      R = 60.81 replaces the idea's rounded 60.9; convention cited from
      KN-LIT-661e97 / KN-FIND-aa2efc.
    - >-
      Until mults_per_group_op is measured on one host, gamma* across
      heterogeneous operation counts remains a per-model quantity and must be
      labeled as such.
    - >-
      Stage-2 gamma_meas on RC-1 uses archived RC-1 instances only
      (DEC-20260926-cb4487 / EXP-CERTBIN-e94b27 artifacts); no new curve
      construction; no Magma/Sage/AUXIN/Bedrock required for Stages 0-1;
      Stage 2 may use existing Python field/group instrumentation in
      EXP-CERTBIN-e94b27/impl when present, else report O-INSTRUMENT with
      the missing dependency named.
    - >-
      A shrinking budget_bits caused by a growing floor is never read as
      progress (control frozen from the idea and the review).

  proof_search_map:
    bottleneck: >-
      Whether gamma* can be stated in ONE unit that makes a toy-measured
      oracle cost comparable to the ECC2K-130 oracle-budget column, without
      conflating cross-cell QSP numbers or omitting the already-filed
      KN-FIND-aa2efc budget. Decidable by: (a) arithmetic reproduction of
      same-cell QSP gap + family budget_bits table; (b) one measured
      mults_per_group_op + oracle_cost_per_attempt distribution on RC-1.
    baseline_embedding:
      parameter_slice: >-
        Incumbent = KN-FIND-aa2efc / EV-ICPERF-10c5fc family-level oracle
        budget column (no measured same-unit conversion; no QSP same-cell
        restatement in a reusable instrument spec). Degenerate case of this
        proposal: quote 2^(60.9 - F) without unit or same-cell discipline.
      reproduction_check: >-
        Zero-compute: reproduce budget_bits(m) for m in {2,3,4,5,6,8} from
        the product-law floors (89.25, 68.58, 56.40, 48.44, 42.85, 35.61) and
        R=60.81; reproduce same-cell QSP gap >=49.19 bits from
        IDEA-20260916-3f7a1c's >=110-bit attempts column. Any mismatch is
        O-TRANSCRIPTION, not a new finding.
    observation_collision:
      observable: >-
        "gamma_meas / gamma* says line L is within factor X of tying rho."
      distinct_preimage_search: >-
        Colliding preimages without this contract: (i) unit mismatch
        (field ops vs rho iterations); (ii) cross-cell floor borrowed as
        same-cell; (iii) budget_bits shrinking because floor grew, not
        because measured cost improved; (iv) genuine approach of measured
        cost to budget. Identifying tuple after this contract:
        (budget_bits, unit, floor_citation, mults_per_group_op_host,
        gamma_meas_distribution).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          One derived column (budget_bits / gamma* / gamma_meas / ratio)
          with mandatory unit and floor citation, seeded on ECC2K-130
          family rows and calibrated on RC-1.
        predicted_gain: >-
          Converts bespoke "beats rho?" arguments into one comparable
          scalar for the reachability table (unlocks IDEA-20260922-6028ed
          column content).
    quantifier_order: >-
      FOR the ECC2K-130 family rows m in {2,3,4,5,6,8}: EXISTS an arithmetic
      budget_bits table from cited floors (Stage 0). FOR the QSP (n'=33,m=4)
      cell: EXISTS a same-cell >=49.19-bit gap from cited numbers (Stage 0
      control). FOR RC-1: EXISTS a measured mults_per_group_op and a
      gamma_meas distribution over the 144 archived targets (Stages 1-2),
      OR an O-INSTRUMENT naming the missing dependency. NOT CLAIMED: any
      ECC2K-130 break; that gamma_meas approaches gamma* at crypto scale;
      correctness of floors beyond cited sources.
    method_ceiling:
      strongest_certifiable_claim: >-
        Same-cell QSP gap and family budget_bits table reproduce from cited
        numbers; RC-1 yields a same-unit gamma_meas distribution; the
        instrument spec is ready to attach as a reporting column beside
        reachability cells.
      nearby_object_control: >-
        Brute-force pair enumeration on the same RC-1 instances as the
        structureless-oracle null (KN-FIND-aa2efc); the cross-cell 133-bit
        QSP figure must NOT appear as the (33,4) obstruction.
    proof_obligations:
      - claim: >-
          budget_bits(m) = 60.81 - floor_bits(m) reproduces the review's
          family numbers (none / none / 4.41 / 12.37 / 17.96 / 25.20 at
          m=2,3,4,5,6,8).
        responsibility: correctness
      - claim: >-
          Same-cell QSP gap at (n'=33,m=4) is >=49.19 bits from 3f7a1c's
          >=110 attempts column vs R=60.81; 133-bit figure labeled
          cross-cell (n'=66,m=2) only.
        responsibility: correctness
      - claim: >-
          Every quoted gamma* carries unit and floor_citation; without
          mults_per_group_op, cross-engine comparison is labeled per-model.
        responsibility: interface
      - claim: >-
          Instrument adds no attack claim; cites KN-FIND-aa2efc as prior
          family-level exchange-rate origin.
        responsibility: scope

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Measurement instrument only; no complexity claim on ECDLP.

  heuristic_assumptions:
    - id: HEUR-BINSTD-818b73-H1
      formal_statement: >-
        A line's real per-attempt solver cost, once measured at toy scale on
        a ladder of cells, is sufficiently smooth that a gamma_meas trend
        toward or away from gamma* is a meaningful reading rather than pure
        noise (inherited transitively from IDEA-20260916-b84e2d-style
        ladders; this contract's live Stage-2 reading is a SINGLE RC-1 cell
        distribution, not a multi-m trend).
      random_model_justification: >-
        No rigorous bound. Stated because any gamma_meas/gamma* comparison
        inherits the smoothness assumption of the owning measurement ladder.
        Stage 2 reports the empirical distribution and CV; non-stability
        (>4x host/instance swing) is O-UNIT-UNSTABLE, not smoothed.
      supporting_results:
        - KN-FIND-aa2efc (internal; family oracle-budget column)
        - EV-ICPERF-10c5fc (internal; per-m free-oracle floor)
        - IDEA-20260916-3f7a1c (internal; certified |F|<=2401 attempts column)
      validation_experiment_ids:
        - EXP-BINSTD-b2f621
      falsification_condition: >-
        Same-cell QSP reproduction fails (<29.7 bits from cited d=7 bound,
        or arithmetic mismatch); OR RC-1 exchange rate varies by >4x across
        instances/hosts so the unit is not stable.

  structural_ingredients:
    - description: Family-level oracle budget / floor column (prior exchange rate).
      citation: KN-FIND-aa2efc
      provenance: internal
      verified_by: coordinator (path exists; cited via HOLD-F review 2026-10-02)
      role: ECC2K-130 budget_bits origin
    - description: Per-m free-oracle floor evidence supporting aa2efc.
      citation: EV-ICPERF-10c5fc
      provenance: internal
      verified_by: coordinator (path exists ledger/evidence/EV-ICPERF-10c5fc.yaml)
      role: floor evidence
    - description: Certified |F|<=2401 and attempts-column gap at QSP (n'=33).
      citation: IDEA-20260916-3f7a1c
      provenance: internal
      verified_by: coordinator (cited via review; same-cell control source)
      role: QSP same-cell obstruction numbers
    - description: ECC2K-130 rho convention / parameters.
      citation: KN-LIT-661e97
      provenance: internal
      verified_by: coordinator (path exists knowledge/literature/KN-LIT-661e97.md)
      role: R = 60.81 convention
    - description: HOLD-F review corrections and concrete RC-1 experiment.
      citation: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-818b73.yaml
      provenance: internal
      verified_by: coordinator (read in full 2026-10-02)
      role: defect list baked into this contract
    - description: RC-1 archived instances / CERTBIN instrumentation target.
      citation: EXP-CERTBIN-e94b27
      provenance: internal
      verified_by: coordinator (directory exists experiments/EXP-CERTBIN-e94b27/)
      role: Stage 1-2 measurement host cell

  reduction_chain:
    core_problem: >-
      Give RQ-BINSTD's "what would it take to tie rho" decision target a
      named, same-unit, computable scalar per cell.
    corollaries:
      - problem: >-
          Reachability-table carrier (EXP-BINSTD-1efa8e) can file budget_bits
          / gamma* beside DEFINED-WITH-COMPUTED-COST cells without inventing
          a fourth ad hoc cost argument.
        reduction_ref: IDEA-20260922-818b73 + HOLD-F consolidation note into 6028ed
        asymptotics_preserved: n/a (instrument)

  predictions:
    - metric: qsp_same_cell_gap_bits
      direction: higher
      minimum_effect: >-
        FORCED >=49.19 from cited 110 vs 60.81 (d=3); floor control >=29.7
        from d=7 bound; any lower from cited numbers is O-TRANSCRIPTION
    - metric: family_budget_bits_table
      direction: different
      minimum_effect: >-
        Exact reproduction of (none, none, 4.41, 12.37, 17.96, 25.20) at
        m=2,3,4,5,6,8 within 0.01 bit of review arithmetic
    - metric: mults_per_group_op
      direction: different
      minimum_effect: >-
        Positive finite measured value on RC-1 host; missing impl → O-INSTRUMENT
    - metric: gamma_meas_rc1_cv
      direction: lower
      minimum_effect: >-
        Report CV over 144 targets; CV implying >4x swing → O-UNIT-UNSTABLE

  test_boundary:
    instances:
      - arithmetic_arm: >-
          ECC2K-130 family budget_bits table + same-cell QSP restatement
          (Stage 0; zero curve arithmetic)
      - calibration_arm: >-
          RC-1 cell n=17, m=2, l=9, V={deg<9}, 144 archived x(2E) targets
          (Stages 1-2)
      - unit_arm: 'field multiplications per group op on one host'
    parameters:
      R_bits: 60.81
      R_convention: 'KN-LIT-661e97 / KN-FIND-aa2efc sqrt(pi*ell/(4*131))'
      ecc2k130_floors_bits: [89.25, 68.58, 56.40, 48.44, 42.85, 35.61]
      ecc2k130_m: [2, 3, 4, 5, 6, 8]
      qsp_cell: {n_prime: 33, m: 4, resultant_floor_bits: 60.6, attempts_bits_d3: 110}
      qsp_cross_cell_context_only: {n_prime: 66, m: 2, la_bound_bits: 133}
      rc1_curve: 'n=17, F_2[t]/(t^17+t^3+1), m=2, l=9'
      rc1_targets: 144
      fidelity_tol_bits: 0.01
      unit_stability_factor_max: 4
    implementation: >-
      experiments/EXP-BINSTD-b2f621/implementation/; may read
      experiments/EXP-CERTBIN-e94b27/impl/ as input (read-only). Stdlib +
      existing project Python only; no Magma/Sage/cypari2; no AUXIN; no Bedrock.
    budget:
      maximum_runs: 5
      total_cpu_hours_advisory: 1.0
      wall_clock_seconds_advisory: 3600

  falsification_conditions:
    - >-
      Same-cell QSP reproduction fails to recover >=29.7 bits from cited
      numbers → O-TRANSCRIPTION; withdraw uncorrected instrument before
      seeding any reachability cell.
    - >-
      Family budget_bits table differs from review arithmetic by >0.01 bit
      without a named transcription correction → O-TRANSCRIPTION.
    - >-
      RC-1 exchange rate varies by >4x across instances/hosts → O-UNIT-UNSTABLE;
      gamma* remains per-model only.
    - >-
      Claiming any ECDLP cost bound / break / exponent from this contract.

  interpretation_limits:
    - >-
      DEFINITIONAL / measurement contribution only. Moves no reachability
      cell from OPEN to DEFINED on its own; supplies the column definition
      and one calibrated instance.
    - >-
      Does not re-close the QSP cell (already closed by stronger routes);
      reframes that closure as an instance of a reusable instrument.
    - >-
      IDEA-20260916-b84e2d Stage-1 live ladder application remains a
      SEPARATE next_gate after that idea is designed; not authorized here.
    - >-
      Timeouts/crashes are failed_infrastructure (AGENTS.md rule 5), never
      refutation of HEUR-BINSTD-818b73-H1.

  distinguishable_outcomes:
    - id: O-INSTRUMENT-READY
      meaning: >-
        Stage-0 arithmetic passes; Stages 1-2 deliver same-unit
        mults_per_group_op + gamma_meas distribution with CV within
        stability bound; instrument spec ready for reachability-table column.
    - id: O-TRANSCRIPTION
      meaning: >-
        Stage-0 QSP or family table fails reproduction from cited numbers;
        fix citations/arithmetic before any measured Stage.
    - id: O-UNIT-UNSTABLE
      meaning: >-
        Measured exchange rate swings >4x; report as per-model only; do not
        promote a cross-engine gamma* number.
    - id: O-INSTRUMENT
      meaning: >-
        Implementation incomplete / dependency missing (e.g. CERTBIN impl
        numpy/host tools) with declared stop; do not read partial results
        as math success.
    - id: O-IMPEDIMENT
      meaning: Budget/infra stop with measured quantity; never negative evidence.

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
