    The n list is 17, 19, 23, 29, and 31. Their sum is 119 and their
    product is 6678671. The consecutive gaps are 2, 4, 6, and 2.
    Those gaps sum to 14, which equals 31 minus 17, and their product
    is 96. The sample count is 200 and the floor is 1 over 20, so
    200 divided by 20 is 10. Five times 10 is 50, and five times 200
    is 1000. Three fourths of 200 is 150, and 150 minus 10 is 140.
    The hundredths gap of 5 and 2 is 3. The product of 140 and 3 is
    420. Three times 20 minus 4 is 56, so 3 over 4 exceeds 1 over 20
    by 14 over 20, which is 7 over 10. One over 20 exceeds 1 over 50
    by 30 on the denominator 1000, which is 3 over 100. The stage
    counts are 2 and 3. Their product is 6, equal to the written
    hour cap, and their sum is 5.
