# =============================================================================
# H-CERTBIN-ec0945 -- Hamming-ball Frobenius-stable factor base (B_w) vs
# size-matched subspace and random-set arms on CERTBIN toy cells.
# Specified from IDEA-20260926-b6cc43 under RQ-CERTBIN-836ce2 /
# GOAL-ECDLP2M-001. Approved DEC-20261002-661a2c.
#
# Seam G3 (BRIEF): representation / relation-collection object that exists
# at n=131 without shift variables (answers KN-FIND-47da4e open direction).
# ZERO RUNS in this design packet. No AUXIN. No Bedrock. No curve attack /
# exponent claim. Claim tier: measurement / factor-base-choice instrument.
# =============================================================================
hypothesis:
  id: H-CERTBIN-ec0945
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-b6cc43
  experiment_id: EXP-CERTBIN-5af487
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-02'
  approved_at: '2026-10-02'
  authorised_by: DEC-20261002-661a2c
  status: approved
  proposed_by: coordinator
  title: >-
    At matched |F| on RC-1 (n=17) and a Koblitz n=19 cell, a Hamming-ball
    factor base B_w in a normal basis costs within [0.5,2] of the subspace
    arm in D<=5 closure work with equal refutation rate (H_cheap) or is
    materially dearer / weaker (H_dear); random-set and ordinary-curve
    controls decide artifact vs genuine cardinality penalty; no ECDLP
    exponent

  statement: >-
    CLAIM (measurement / factor-base-choice instrument; seam G3; NO ATTACK).
    Setting: binary field F_{2^n} with a constructed normal basis (rotation
    check recorded); Cell A = RC-1 ordinary curve (n=17, A=97044, B=126251,
    m=2, V={deg<9}, |V|=512); Cell B = Koblitz E_0 over F_{2^19} plus the
    BRIEF ordinary n=19 cell as no-Frobenius control. Arms at matched |F|
    within factor 2: (i) subspace, (ii) Hamming ball B_w = {x : HW(x)<=w}
    in the normal basis (Cell A: B_3 size 834 and optional B_2=154; Cell B:
    B_3 size 1160 vs random dim-10 subspace), (iii) random abscissa set of
    matched cardinality (table membership), (iv) support-guess / ISD-style
    arm enumerating weight-w supports. HYPOTHESIS: (A) HW is rotation-
    invariant in any normal basis, so B_w is a Frobenius-orbit union
    (exact; Stage-0/1 check). (B) In a normal basis Tr(x)=HW(x) mod 2
    (exact; even-weight fact). (C) H_cheap iff ball/subspace closure-work
    ratio at D<=5 on unsatisfiable targets lies in [0.5, 2] AND ball
    refutation rate equals the subspace arm's within sampling error;
    H_dear iff ratio > 2 OR ball refutation rate is strictly below the
    subspace arm's (bands fixed before any run; non-overlapping). (D)
    Exhaustive-oracle decomposition rates agree across arms within
    sampling error (H1 yield); a >2x ball-vs-random deviation is a
    surprise to be replicated, not read as H_cheap. (E) On the Koblitz
    cell, orbit reduction yields exactly n=19 conjugates per distinct
    orbit hit; Koblitz vs ordinary ball per-attempt cost agree within
    1.5x (field-level constraint). CLAIM TIER: measurement. Constant-
    factor lever at best (GGMP n / n^2 on a base that exists at n=131
    without shift encoding). NO exponent. NO ECC2K-130 break. NO Magma/
    Sage/AUXIN. Native-cardinality SAT arm is OUT OF SCOPE (engine not
    installed; follow-up only).

  mechanism: >-
    OBJECT FRAME. Representation R1: normal-basis coordinate vector of x
    (Bailey type-2 ONB at n=131; general normal basis at toy n without
    ONB). Operation set Sigma = {sigma=rotation, negation} with Class I
    translation by factor-base elements inside decomposition. Tracked
    object: relation vector over B_w / <sigma,-1> (partial-action).
    LOSSY-PROJECTION TEST: x |-> necklace of its normal-basis vector
    discards rotation index and sign; Sigma-compatible; lossy. WHAT IS
    NEW vs KN-FIND-47da4e / frobenius-orbit-ecc2k130: an orbit-union
    factor base with O(1) description and NO shift-index encoding —
    the open direction 47da4e names. Charged stages: factor-base
    membership (weight count) and relation decomposition (cardinality-
    constrained descended system of degree w+1 vs affine subspace).

  assumptions:
    - >-
      Cell A uses archived RC-1 parameters of EXP-CERTBIN-e94b27 /
      DEC-20260926-cb4487; Cell B Koblitz order 4*130873 is re-derived
      in Stage 0 and must match before any Cell-B metric is read.
    - >-
      A normal basis is constructed per cell; Frobenius-as-rotation is
      verified before any ball arm runs.
    - >-
      Closure instrument is experiments/EXP-CERTBIN-e94b27/impl/
      (gf2n/curve/macaulay/closure/oracles_rc1) extended under this
      experiment's write_scope with basis-general descent and
      cardinality rows; separate-process certificate verification.
    - >-
      OFF-LIMITS: F2 family; GGMP orbit reduction as a component; F1
      only as the source of the DP predicate (never as lens); KN-OPEN-020
      high-degree implicit-membership class declared, not escaped.
    - >-
      Native WDSat/CaDiCaL cardinality arm is NOT authorized under this
      card (missing engine → follow-up, never O-ARTIFACT for H_dear).
    - >-
      n=131 / m=4 / w=6 sizing in the source idea is arithmetic only;
      this hypothesis asserts nothing at that scale.

  heuristics:
    - id: H1
      statement: >-
        (Yield.) The number of m-fold decompositions of a uniform target
        over F = B_w-abscissae is |F|^m / (m! N) (1+o(1)), as for a
        subspace base of the same size.
      rigorous_support: >-
        No rigorous bound; imitates the standard index-calculus yield
        heuristic. Risk: additive structure in low-weight abscissae.
      falsification_condition: >-
        Ball-arm exhaustive-oracle rate differs from the random-set arm
        by more than 2x at either cell after 200 targets (surprise; do
        not read as H_cheap until replicated).
      validation_plan: >-
        SAMPLE: exhaustive oracle n in {17,19}, m=2, 200 targets/arm.
        COMPARE: empirical rate vs |F|^2/(2N) and vs random-set arm.
        TAIL: largest per-target multiplicity. TRANSFER: none beyond the
        same heuristic every m=4 row already uses.
    - id: H2
      statement: >-
        (Half are abscissae.) |B_w ∩ x(E)| = |B_w|/2 (1+o(1)) for w>=2
        at the toy cells; at n=131 this remains an assumption.
      rigorous_support: >-
        x is an abscissa of E_0 iff Tr(x)=Tr(1/x); density-1/2 imitates
        equidistribution of that indicator over the ball.
      falsification_condition: >-
        Exact abscissa count in B_w at n in {17,19} for w<=4 differs from
        |B_w|/2 by more than the Stage-0 disclosed band (default: relative
        deviation > 0.25).
      validation_plan: >-
        SAMPLE: exact count of abscissae in B_w at n in {17,19} for w<=4.
        COMPARE: |B_w|/2. TAIL: largest deviation over w. TRANSFER:
        assumption at n=131, stated.

  heuristic_note: >-
    Rotation invariance and Tr=HW mod 2 are exact in a normal basis.
    H_cheap/H_dear bands are fixed pre-run. H1/H2 are the only empirical
    heuristics; neither moves an ECDLP exponent.

  predictions:
    - metric: >-
        exhaustive-oracle decomposition rate (fraction of targets with
        >=1 m=2 decomposition), per arm, Cell A
      direction: same
      minimum_effect: >-
        Within sampling error across subspace / ball / random-set; a
        ball-vs-random deviation >2x is a surprise, not H_cheap evidence.
    - metric: >-
        closure work (rows eliminated to certificate at D<=5), ball /
        subspace, unsatisfiable targets, Cell A (and Cell B)
      direction: higher_or_same
      minimum_effect: >-
        H_dear: ratio > 2 with ball refutation rate below subspace;
        H_cheap: ratio in [0.5, 2] and equal refutation rate. Bands do
        not overlap; fixed before any run.
    - metric: >-
        support-guess arm refutation rate relative to subspace, same cell
      direction: same
      minimum_effect: >-
        Within [0.5, 2] per support guess; separates constraint degree
        from block size; no directional claim beyond that.
    - metric: Koblitz orbit count per distinct orbit hit (Cell B)
      direction: same
      minimum_effect: exactly 19.
    - metric: Koblitz vs ordinary ball per-attempt closure work (Cell B)
      direction: same
      minimum_effect: agree within 1.5x (field-level constraint).

  test_boundary:
    curves: >-
      Cell A: RC-1 ordinary (n=17, f=t^17+t^3+1, A=97044, B=126251).
      Cell B: Koblitz E_0 over F_{2^19} (order re-derived Stage 0) plus
      BRIEF ordinary n=19 cell (A=46693, B=306147) as no-Frobenius
      control. No deployed curve. No n=131 solve.
    arity: m=2 only under this card.
    factor_base: >-
      Subspace V={deg<9} (Cell A) / random dim-10 (Cell B); Hamming balls
      B_3 (primary) and optional B_2; random abscissa set of matched
      cardinality; support-guess encoding of B_3.
    targets: >-
      200 per arm per cell; seeds 2026092651.. (frozen in Stage 0);
      Cell A targets in x(2E) subgroup as in EXP-CERTBIN-e94b27.
    instruments: >-
      experiments/EXP-CERTBIN-e94b27/impl/ (gf2n.py, curve.py, macaulay.py,
      closure.py, oracles_rc1.py) generalised under write_scope to n=19,
      supplied normal basis, and cardinality equations as extra rows;
      separate-process certificate verifier. No native-cardinality SAT.
    transfer: >-
      No transfer to n=131 / m=4 / w=6 beyond arithmetic sizing stated as
      such. Toy radius w=3 (constraint degree 4) is inside D<=5 reach;
      target-radius degree 7 is an extrapolation assumption, disclosed.
    claim_tier: measurement

  falsification_conditions:
    - >-
      H_cheap falsified iff ball/subspace closure-work ratio > 2 OR ball
      refutation rate is strictly below the subspace arm at D<=5,
      replicated at both cells (then H_dear wins).
    - >-
      H_dear falsified iff ratio stays in [0.5, 2] AND refutation rates
      agree (then H_cheap wins).
    - >-
      Instrument falsified (O-ARTIFACT) iff Stage 1 fails to reproduce
      RC-1 on RC-1's own V, OR oracle and closure disagree on any
      instance, OR Koblitz vs ordinary ball per-attempt cost differs by
      more than 1.5x.
    - >-
      Rotation/even-weight falsified iff normal-basis constructor fails
      the rotation check or Tr(x) != HW(x) mod 2 on sampled elements.
    - >-
      H1 falsified (surprise, not H_cheap) iff ball-vs-random oracle rate
      differs by more than 2x.
    - >-
      Orbit reduction falsified iff Koblitz Cell B orbit count != 19 on
      any counted relation.

  distinguishable_outcomes:
    - id: O-HCHEAP
      label: H_cheap
      when: >-
        Ball/subspace closure-work ratio in [0.5, 2]; equal D<=5
        refutation rates; Stage-1 RC-1 reproduction passes; oracle and
        closure agree; Koblitz orbit count exactly 19; Koblitz vs
        ordinary ball cost within 1.5x; oracle rates equal across arms
        within sampling error.
      means: >-
        Ball entered in the CERTBIN factor-base-choice column as a
        Frobenius-stable base with no shift overhead at the toy cells;
        n=131 m=4 solve question may be opened later as a SEPARATE
        design. Still constant-factor only; no ECDLP claim.
    - id: O-HDEAR
      label: H_dear
      when: >-
        Ratio > 2 OR ball refutation rate below subspace at D<=5;
        instrument controls pass.
      means: >-
        Ball dominated by subspace at matched size; measured cardinality
        penalty is the named obstruction for the reachability table.
    - id: O-ARTIFACT
      label: O-ARTIFACT
      when: >-
        Stage-1 RC-1 miss, oracle/closure disagreement, rotation check
        failure, or Koblitz/ordinary ball cost gap >1.5x.
      means: Instrument or derivation broken; void the reading.
    - id: O-IMPEDIMENT
      label: O-IMPEDIMENT
      when: >-
        Infrastructure / dependency / budget abort before a decidable
        label.
      means: >-
        Never negative mathematical evidence (AGENTS.md rule 3); report
        and stop.

  proof_search_map:
    bottleneck: >-
      Per-attempt decomposition cost under a cardinality constraint of
      degree w+1 on each n-bit block, against the affine constraint of a
      subspace base of the same size.
    baseline_embedding:
      parameter_slice: >-
        RC-1 subspace cell (n=17, l=9, V={deg<9}) is the affine slice the
        ball cell is compared against at matched |F|; w=n (whole field)
        and w=1 are trivial / tiny extremes not used as primary arms.
      reproduction_check: >-
        Reproduce RC-1 closure statistics (KN-FIND-5a8d3e /
        DEC-20260926-cb4487) on RC-1's own V before any ball cell is
        read; exhaustive oracle must agree with closure verdict on every
        ball instance.
    observation_collision:
      observable: >-
        Per-attempt closure work (rows eliminated to certificate) and
        refutation rate at D<=5, per factor-base arm, at matched |F|.
      distinct_preimage_search: >-
        A dearer ball arm could be (i) genuine H_dear (constraint degree)
        or (ii) larger free-bit / Macaulay block — separated by the
        support-guess arm (same free-bit count as subspace per guess).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "x_i in V" (l affine bits) by "x_i in B_w" (n bits plus
          e_{w+1}(b)=...=0, or enumerated support); completeness: every
          B_w decomposition is a solution; soundness: curve-arithmetic
          re-verification.
        predicted_gain: >-
          Removal of one-hot shift blocks (KN-FIND-47da4e 1.0-1.5x) and
          GGMP constants on a base that exists at n=131; no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold |F| fixed; vary description: subspace / ball / random set.
          Random set has no algebraic description (enumeration floor).
        predicted_gain: >-
          Separates "usable algebraic description" from "opaque as a
          random set".
    quantifier_order: >-
      EXISTS toy cells (n=17,19; m=2; |B_w| within factor 2 of 2^l) at
      which ball vs subspace vs random-set per-attempt cost and
      refutation rate are measured. NO forall claim; H_cheap/H_dear are
      readings of the measured ratio; n=131 sizing is arithmetic only.
    method_ceiling:
      strongest_certifiable_claim: >-
        At n in {17,19}, m=2, matched |F|, the cardinality-constrained
        system costs [ratio] of the subspace system in D<=5 closure work,
        refutes [rate] vs subspace [rate], and the random-set arm is
        decomposable only by enumeration. Certifies nothing about m=4,
        w=6, n=131, or a native-cardinality SAT engine.
      nearby_object_control: >-
        BLOCKING. Ordinary curve of the same n has the ball as a set but
        no Frobenius endomorphism / orbit reduction; ball arm on ordinary
        vs Koblitz must show the same per-attempt cost (field-level
        constraint). Random-set arm fixes the enumeration floor.
    proof_obligations:
      - claim: HW is rotation-invariant in any normal basis (B_w orbit union)
        responsibility: correctness
      - claim: Tr(x)=HW(x) mod 2 in a normal basis (even-weight on G)
        responsibility: baseline
      - claim: Ball sizes at n=131 and toy n re-derived exactly in Stage 0
        responsibility: size
      - claim: Instrument reproduces RC-1 on RC-1's own V before ball cells
        responsibility: baseline
      - claim: Every decomposition carries a curve-arithmetic certificate; every refutation a separately verified closure certificate
        responsibility: correctness
      - claim: Three arms at matched |F| within factor 2; random-set matched exactly
        responsibility: interface
      - claim: No exponent claimed; n=131 row is arithmetic
        responsibility: scope
    not_applicable_reason: null

  dominated_by: >-
    CHECKED. Matched rho at ~2^60.8 dominates every m=4 row until a
    per-attempt solve under ~2^31 (orbit-reduced) is demonstrated at
    n=131 (unmeasured). Within factor-base-choice: orbit-union subspace
    base (KN-FIND-47da4e) is the sibling this object must beat on
    per-attempt cost by more than its 1.0-1.5x shift overhead. This
    hypothesis claims no frontier row until measured.

  sota_delta:
    time: >-
      Zero exponent. Program-internal: first Frobenius-stable
      index-calculus-sized factor-base object at n=131 with O(1)
      description and no shift encoding, priced at toy scale, answering
      KN-FIND-47da4e's open direction.
    memory: Zero.
    data_queries: Not applicable.

  claim_tier: measurement
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
