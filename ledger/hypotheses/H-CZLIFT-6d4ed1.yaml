hypothesis:
  id: H-CZLIFT-6d4ed1
  question_id: RQ-CZLIFT-b9f765
  goal_id: GOAL-CZLIFT-1516d5
  added: '2026-10-09'
  proposed_by: user
  designed_by: coordinator
  approval_decision: DEC-20261009-a3797d
  title: >-
    The canonical point section of E(Q_p) -> E(F_p) on a non-anomalous curve
    exists, is the prime-to-p torsion section, is computable in O(log n + k
    log p) curve additions, and yields nothing to the formal logarithm
  source_statement: >-
    User hypothesis H2, 2026-10-09 (verbatim fragment): "Serre-Tate gives a
    canonical lift of the curve for ordinary E, but no canonical lift of
    points. Satoh's point counting uses exactly that asymmetry. A computable
    canonical section of E(Q_p) -> E(F_p), perhaps from CM or special j, would
    be a full break."
  statement: >-
    Let E/F_p be ordinary with a subgroup <P> of prime order n != p, and E^/Z_p
    ANY lift of E (the Serre-Tate canonical CM model or an arbitrary integer
    lift). Reduction E^(Q_p)[n] -> E(F_p)[n] is a group isomorphism, so
    s_tor(R) = the unique n-torsion lift of R is a canonical section on <P>;
    it is computable as P^ - [n^{-1} mod p^k]([n]P^) from any Hensel lift P^,
    costing at most 2(bits(n) + bits(p^k)) + 1 complete additions. It is a
    homomorphism, it does not depend on the Hensel start, and [n] s_tor(R) = O
    at every precision, so the Smart functional z([n] s(R)) VANISHES on it.
    For every other section s, z([n]s(Q))/z([n]s(P)) equals z(tau_Q)/z(tau_P)
    with tau_R = s(R) - s_tor(R) in E^(pZ_p): the attack output depends only on
    the non-canonical part of the section, and for the Hensel, naive-integer
    and Teichmuller sections it equals d mod p at the random rate 1/p, on the
    canonical curve lift and on an arbitrary lift alike. Hence the asked-for
    "computable canonical section" exists and is not a break: the user's
    claim that it "would be a full break" is predicted FALSE as stated.
  mechanism: >-
    Hom(Z/n, Z_p) = 0 for n prime to p: a section whose composite with the
    formal logarithm is additive must have that composite identically zero,
    i.e. must land in the torsion. The torsion section is that section, and
    every section differs from it by a function tau into the formal group; [n]
    is an automorphism of E^(pZ_p)/E^(p^k Z_p), so z([n]s(R)) = z([n]tau_R)
    and the Smart ratio is the tau-ratio. A section recovering d would need
    tau(dP)/tau(P) = d for all d, i.e. tau would have to encode the discrete
    logarithm itself. The canonical curve lift changes End(E^) but not this
    exact sequence, so it contributes nothing.
  assumptions:
    - E/F_p ordinary, #E(F_p) odd with a prime factor n >= 11, n != p (the complete addition formula is exception-free on odd-order subgroups).
    - Precision k = 4; identities are checked at that precision.
    - d sampled in [2, n-2] and compared mod p.
  proof_search_map:
    not_applicable_reason: >-
      The statement is an elementary consequence of the Hom vanishing above;
      the experiment checks the implemented instruments against it and
      measures the random rate the non-canonical sections reach.
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: reduction restricted to prime-to-p torsion is injective (formal group kernel is pro-p) and surjective (good reduction)
      citation: knowledge/techniques/KN-TECH-73630e.md
      provenance: internal
      verified_by: DEC-20260901-255ebd (independent re-derivation recorded there)
      role: existence and uniqueness of the torsion section
    - description: Serre-Tate canonical lift of an ordinary curve; CM curves with class number one lift as their integral model
      citation: 'N. Katz, Serre-Tate local moduli, LNM 868 (1981)'
      provenance: recalled
      verified_by: null
      role: the canonical curve lift arm
  reduction_chain:
    core_problem: whether a canonical point section turns the non-anomalous formal-logarithm attack into a working attack
    corollaries: []
  predictions:
    - metric: canonicity_rate, homomorphism_rate_torsion, degeneracy_rate_torsion, torsion_reduces_rate, scalar_mult_equivariance_rate
      direction: different
      minimum_effect: 'each exactly 1.0'
    - metric: identity_rate per non-torsion section (Smart ratio equals the tau-ratio)
      direction: different
      minimum_effect: 'exactly 1.0'
    - metric: success_rate per non-torsion section and arm, against the mean of 1/p
      direction: different
      minimum_effect: 'within 4 standard errors of 1/p on both arms; arm difference within 3 standard errors'
    - metric: torsion_cost_within_bound
      direction: different
      minimum_effect: 'true (mean additions at most 2(bits(n)+bits(p^k))+1)'
  test_boundary:
    instances:
      - 'up to 24 class-number-one CM reductions with 50 <= p <= 600 lifted by their CM model'
      - 'random curves at 12 primes in [53, 557] lifted by their integer coefficients'
    parameters: {precision: 4, sections: [torsion, hensel_random, naive, teichmuller], samples_per_curve: 16}
    implementation: experiments/EXP-CZLIFT-ae0a13/implementation/run.py over harness/czlift.py
    budget: {wall_clock_seconds_per_run: 600}
  falsification_conditions:
    - any pair where the torsion section fails canonicity, the homomorphism identity, degeneracy, or scalar-multiplication equivariance
    - any pair where a non-torsion section's Smart ratio differs from its tau-ratio
    - a section whose success rate exceeds 1/p by more than 4 standard errors on both seeds, or whose cm_canonical and random_naive rates differ by more than 3 standard errors on both seeds
  interpretation_limits:
    - Toy primes; subgroup orders below 600.
    - 'Only four structurally defined sections are tested; a section that encodes the discrete logarithm trivially succeeds and is excluded by construction.'
    - Nothing about anomalous curves (H-CZLIFT-889c9d) or about global lifts (H-CZLIFT-9a32e9).
  status: approved
  status_note: >-
    Pre-run approval paired to EXP-CZLIFT-ae0a13 under DEC-20261009-a3797d.
    Approval asserts nothing about truth; in particular the predicted falsity
    of the user's "full break" clause is a prediction, not a finding.
