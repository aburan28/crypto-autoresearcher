hypothesis:
  id: H-RELN-96e3ba
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  idea_id: IDEA-20260805-5ac0a2

  statement: >-
    SCOPE: the reference curve RULE-HEUR-TRACK pins in the frozen GOAL-RELN-001
    protocol (coordination/goals/GOAL-RELN-001/batches/BATCH-001/tasks/
    TASK-20260725-661/decomp_probability_protocol.yaml), evaluated on that
    protocol's own default B-ladder at field_bits in {8, 10, 12, 16} and m in
    {2, 3}. CLAIM TIER toy. NO ATTACK, NO EXPONENT MOVED, NO CLAIM ABOUT
    KN-LIT-009 ITSELF UNTIL ITS TEXT IS READ.
    Claim: for a prime-field Semaev factor base given as a set V of B distinct
    non-2-torsion x-coordinates on E(F_p) with N = #E(F_p), the exact mean number
    of size-m decompositions of a uniformly random target is
    mu(B,m) = C(2B+m-1, m)/N, because the decomposition search ranges over the
    +/- symmetric point set W = V-lifts union their negatives with |W| = 2B and
    every size-m multiset from W sums to exactly one group element. The protocol's
    reference exponent K/q = B^m/(m! p) therefore stands to the exact mean in the
    ratio (p/N) * 2^m * prod_{j=0}^{m-1}(1 + j/(2B)), which tends to 2^m and never
    to 1. The missing 2^m is the number of targets one factor-base multiset
    covers: deg S_{m+1} in its last variable is 2^{m-1} (KN-TECH-002), and each
    root lifts to two points. CONSEQUENCE, which is the falsifiable content: the
    verdict of RULE-HEUR-TRACK (absolute tolerance 0.05) is determined at all 20
    default ladder cells before any trial is run -- 16 forced past tolerance, with
    forced residuals up to 0.66, and 4 forced inside it only because both curves
    are near zero there, so the rule returns TRACK on a reference wrong by a
    factor of about 4 in the mean. If instead any enumerated multiset total differs
    from C(2B+m-1, m), or the measured exponent ratio is near 1 rather than near
    2^m, this hypothesis is refuted outright.

  mechanism: >-
    DERIVED IN-REPO. Both load-bearing steps are counting arguments; neither is a
    distributional assumption. Sources not read are labelled at every use.

    STEP 1 -- THE SEARCHED SET. The protocol's factor_base_rule states that V is
    "a deterministic set of |V| = B distinct on-curve x-coordinates" and that
    "Points of the factor base are the lifts (+/-y) of those x-coordinates". A
    non-2-torsion x has exactly two lifts P and -P, so the point set searched is
    W = union over x in V of {P_x, -P_x}, |W| = 2B, and W = -W. The factor 2 per
    slot is the entire origin of the discrepancy and it is a property of the
    encoding, not of the mathematics of decomposition.

    STEP 2 -- WHAT ONE MULTISET COVERS, DERIVED TWICE.
      (a) Degree. KN-TECH-002 gives deg S_n in each variable = 2^{n-2}, with the
      explicit S_3 for y^2 = x^3 + ax + b visibly quadratic in each variable. So
      for a fixed x-multiset, S_{m+1}(x_1,...,x_m, X) is univariate of degree at
      most 2^{m-1} in X, hence has at most 2^{m-1} roots, i.e. covers at most
      2^{m-1} x-values.
      (b) Signs. The decomposition condition is R = sum eps_i P_i for some
      eps in {+/-1}^m (KN-TECH-002: "R equals a sum of m factor-base points (up to
      signs)"). There are 2^m sign vectors; the set of sums is closed under global
      negation, so generically 2^{m-1} distinct +/- pairs, i.e. 2^{m-1} x-values.
      (a) and (b) agree. Their agreement is the cheapest available check on this
      step and a disagreement would stop the whole line.

    STEP 3 -- CONSERVATION, EXACT. KN-FIND-007 (internal, confidence established,
    proof_status derivation) records the double count: for a set D of size B in a
    finite abelian group of order N, sum over targets r of c_D(r) = C(B+m-1, m)
    exactly, because every size-m multiset sums to exactly one target. Applying it
    to W rather than to V -- the only step this hypothesis adds -- gives
        sum over g in E(F_p) of c_W(g) = C(2B+m-1, m),   mu(B,m) = C(2B+m-1,m)/N.
    Two structural corollaries, both used as instrument checks because both are
    integer-exact and both can fail: c_W(g) = c_W(-g) for every g (negation is an
    involution on multisets and W = -W); and at m = 2 exactly B multisets are of
    the form {P_i, -P_i} and sum to the identity, so c_W(O) >= B with equality
    when V carries no other 2-term relation.

    STEP 4 -- THE COLLISION. mu = prod_{j=0}^{m-1}(2B+j) / (m! N). The protocol's
    exponent is K/q = B^m/(m! p). Dividing:
        mu / (K/q) = (p/N) * 2^m * prod_{j=0}^{m-1} (1 + j/(2B)),
    exactly, with p/N inside 1 +/- 2/sqrt(p) by Hasse. The multiset correction
    prod(1 + j/(2B)) decreases monotonically in B, which supplies a graded forced
    prediction with more than three interior points at no cost.

    STEP 5 -- WHAT IT DOES TO THE FROZEN RULE. Substituting mu into the Poisson
    coverage 1 - exp(-mu) and comparing against P_reported = 1 - (1-1/p)^{K} cell
    by cell on the protocol's default ladder gives the forced residual table in
    predictions. The two failure directions are different and the second is worse:
    at the 16 large-residual cells the rule fires H-HEURISTIC-MISSES for a reason
    unrelated to Semaev, and at the 4 small-mu cells it fires H-HEURISTIC-TRACKS
    on a reference wrong by 4x in the mean, because 0.05 ABSOLUTE is not a
    scale-free criterion when both quantities are near 0.01.

    STEP 6 -- THE CONSTRUCTIVE OUTPUT. Replace the reference with REF-EXACT-MEAN,
    mu(B,m) = C(2B+m-1,m)/N, which has no free parameters and is exact, and report
    the residual as a RATIO to it rather than an absolute difference. Under that
    replacement the reported quantity becomes the collision deficit mu - coverage,
    which is the only part of p_exist not determined by (B, m, N) -- the subject of
    H-RELN-66c079 and deliberately not claimed here.

    WHAT THIS MECHANISM DOES NOT DO. It does not evaluate KN-LIT-009. That paper
    has not been read; its corpus entry says so in its own words ("Full paper not
    read"); the formula under audit is quoted at second hand inside this program's
    own protocol artifact. Whether the discrepancy is Semaev's, a difference of
    setting (the model may be stated for a binary-field zero-finding regime where
    the counting convention differs), or this program's transcription is EXACTLY
    what stage 0 of EXP-RELN-475c87 exists to decide, and all three outcomes are
    pre-registered.

  assumptions:
    - >-
      That V is a set of x-coordinates and the search ranges over both lifts. This
      is quoted from the protocol's factor_base_rule. If the intended reading is
      that V is already a set of points, |W| = B, the 2^m vanishes and the
      hypothesis is refuted; the paired experiment tests the convention before
      using it.
    - >-
      That V contains no 2-torsion x-coordinate, so |W| = 2B exactly. Bases seeded
      with 2-torsion are run as an explicit null arm with the different forced
      total C(2B-t+m-1, m).
    - >-
      That p_exist means per-target coverage (at least one decomposition), which is
      what the protocol's Y_exist definition says.
    - >-
      That 1 - exp(-mu) is an acceptable stand-in for coverage when evaluating the
      protocol's own rule. It is a heuristic (HEUR-RELN-A2) and is used only to put
      two reference curves on one footing; the exact statements are mu and the
      ceiling coverage <= min(1, mu).

  proof_search_map:
    bottleneck: >-
      The single step where the counting convention enters: how many targets one
      factor-base multiset can decompose. Every downstream quantity in the frozen
      protocol -- P_reported, residual_vs_reported_heuristic, RULE-HEUR-TRACK's
      verdict, the ICEX heuristic-residual metadata -- is a function of that number
      and of nothing else that varies. Get it wrong by 2^m and every one of them is
      wrong by 2^m.
    baseline_embedding:
      parameter_slice: >-
        m = 1. Then C(2B+0, 1)/N = 2B/N, and the exact statement is trivially
        checkable: a target decomposes as a single factor-base point iff it is one
        of the 2B points of W, so coverage = 2B/N EXACTLY, with no approximation
        and no collision deficit at all. The protocol's reference gives B/p at
        m = 1 -- off by the same factor 2 = 2^m. The m = 1 slice is the exact
        boundary at which the two formulas can be compared with zero uncertainty,
        and it reproduces the claimed discrepancy in its simplest possible form.
      reproduction_check: >-
        Symbolic (one line) plus a frozen fixture: enumerate W on a toy curve and
        confirm that the set of decomposable targets at m = 1 is exactly W, of size
        2B, for every tested base. If this fails, nothing else may be read.
    observation_collision:
      observable: >-
        The pair (mu, coverage) reported per stratum, and the residual computed
        from it.
      distinct_preimage_search: >-
        DECISIVE AND CHEAP, and it is the reason the mean cannot be the
        discriminator: exhibit two factor bases of identical size B on the same
        curve whose observables collide in the first coordinate by construction --
        a uniformly drawn base and the small-multiples base V = {x(iG)}. Their mu
        is identically equal (conservation), and KN-FIND-007 records their coverage
        differing by three orders of magnitude at N ~ 2^18. So the first coordinate
        has a full-space fibre and the second does not. Any rule that reads only the
        first coordinate cannot distinguish the two, and RULE-HEUR-TRACK reads only
        the first.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold mu fixed (it is forced by (B, m, N)) and vary everything else. The
          intrinsic invariant that remains is the multiplicity histogram of c_W;
          its first moment is constant, its second is not. That is the object
          H-RELN-66c079 tracks.
        predicted_gain: >-
          None to any attacker. The gain is a correctly typed metric: a reference
          curve that is constant by construction, and a discriminator that is not.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the absolute tolerance 0.05 with a ratio test against
          REF-EXACT-MEAN, plus the exact ceiling coverage <= min(1, mu) as a hard
          validity check that any measurement must satisfy.
        predicted_gain: >-
          Scale-free at every cell of the ladder, which the absolute rule is not:
          it is what lets bits = 16, B = 12 (mu ~ 0.009) and bits = 8, B = 12
          (mu ~ 2.3) be judged by one criterion.
    quantifier_order: >-
      The frozen rule's implicit statement: THERE EXISTS a reference curve P such
      that FOR ALL cells (bits, m, B) of the ladder, |hat_p_exist - P| <= 0.05
      certifies that the reported heuristic is a usable calibration reference. The
      counter-statement: FOR ALL cells, mu is a function of (B, m, N) ALONE, so the
      quantity being compared does not depend on the instance at all within a
      stratum; hence the rule's verdict is a function of the design and the
      existential quantifier over reference curves is vacuous -- ANY curve, correct
      or not, is either accepted or rejected uniformly within a stratum. The
      quantifier trap being hunted is the usual one: a certificate whose witness
      must depend on the instance cannot be produced by a test whose input does
      not.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that RULE-HEUR-TRACK AS FROZEN, evaluated against the exact mean,
        has a verdict determined before measurement at every default ladder cell,
        and that the reference exponent differs from the exact mean by the stated
        closed-form factor. It CANNOT certify anything about KN-LIT-009's own
        statement (unread), about the PKM arm (unmaterialised), about crypto-scale
        decomposition probability, or about whether index calculus works over prime
        fields. Writing any of those would be the premature-closure failure mode
        and is forbidden by this record.
      nearby_object_control: >-
        The nearby object where the protocol's reference IS correct: a factor base
        of POINTS rather than x-coordinates, with no negation symmetry -- for
        example a base built as a set of points closed under nothing, searched
        without sign freedom. There the searched set has size B, the 2^m is absent,
        and the reference exponent B^m/(m! N) is right up to Hasse. Running the
        instrument on both objects and getting the same answer would mean the
        instrument is not reading the symmetry, which is the load-bearing structure;
        this pair is a required arm.
    proof_obligations:
      - claim: "sum over g of c_W(g) = C(2B+m-1, m) exactly, for |W| = 2B."
        responsibility: correctness
      - claim: "One x-multiset covers at most 2^{m-1} x-values (degree and sign counts agree)."
        responsibility: correctness
      - claim: "m = 1 slice: decomposable set is exactly W, size 2B."
        responsibility: baseline
      - claim: "Ratio (p/N) 2^m prod(1 + j/(2B)) exceeds 4 at every m=2 cell and 8 at every m=3 cell of the ladder."
        responsibility: strictness
      - claim: "16 of 20 default cells forced past the 0.05 tolerance; the other 4 forced inside it."
        responsibility: scope
      - claim: "No conclusion about KN-LIT-009's own text without reading it."
        responsibility: scope

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null and stated plainly rather than dressed up: this hypothesis
    moves no exponent. Its quantitative consequence is a factor 2^m in a mean, and
    the reason it is worth a contract anyway is that the factor propagates into
    GOAL-ICEX-001's relation-supply budget, where at m = 3 it is a factor of 8.
    docs/target-result-profile.md's exponent-first bias is acknowledged and this
    record does not meet it; it is a measurement-integrity audit and is labelled
    one.

  heuristic_assumptions:
    - id: HEUR-RELN-A1
      formal_statement: >-
        No heuristic is load-bearing for the headline. The two steps are a double
        count (conservation over W) and a degree bound (deg S_{m+1} in its last
        variable is 2^{m-1}), both unconditional.
      random_model_justification: not applicable
      supporting_results:
        - "KN-FIND-007, internal finding, confidence established, proof_status derivation: sum_r c_D(r) = C(B+m-1,m)."
        - "KN-TECH-002, internal technique, confidence established: deg S_n in each variable is 2^{n-2}, with explicit S_3."
      validation_experiment_ids: [EXP-RELN-475c87]
      falsification_condition: >-
        An enumerated multiset total differing from C(2B+m-1,m), or an x-multiset
        covering more than 2^{m-1} distinct x-values.
    - id: HEUR-RELN-A2
      formal_statement: >-
        Coverage is approximated by 1 - exp(-mu) when evaluating the frozen rule.
      random_model_justification: >-
        Balls-in-bins, valid absent additive structure; used only to place the two
        reference curves on one footing. Its error is bounded above without
        heuristic by coverage <= min(1, mu).
      supporting_results:
        - "KN-FIND-007 consequence 3: coverage <= min(1, mu), exact."
      validation_experiment_ids: [EXP-RELN-475c87]
      falsification_condition: >-
        Measured coverage on a uniformly drawn base outside the Clopper-Pearson
        interval of 1 - exp(-mu) at three or more cells.

  structural_ingredients:
    - description: >-
        Degree of the n-th summation polynomial in each variable, 2^{n-2}, and the
        explicit S_3 for short Weierstrass form.
      citation: "KN-TECH-002 (internal technique record, read in this repository)"
      role: degree bound supplying the 2^{m-1} target-coverage count
    - description: >-
        Multiset conservation for decomposition yield in a finite abelian group.
      citation: "KN-FIND-007 (internal finding record, read in this repository)"
      role: exact mean and the coverage ceiling
    - description: >-
        Hasse bound |p + 1 - N| <= 2 sqrt(p), used only to bound the p/N factor.
      citation: "Standard; RECALLED, UNVERIFIED as to any specific source. Used only qualitatively and re-derived numerically per curve in the experiment."
      role: bounding the denominator substitution error
    - description: >-
        The decomposition-probability model attributed to KN-LIT-009 section 4.3.
      citation: "NOT READ -- relayed claim, quoted at second hand from this goal's own frozen protocol artifact. Reading it is stage 0 of EXP-RELN-475c87."
      role: the object under audit

  reduction_chain:
    core_problem: >-
      Correctness of the reference curve used to interpret P(decomp) measurements
      for prime-field Semaev constructions.
    corollaries:
      - problem: >-
          The relation-supply pin GOAL-RELN-001 owes GOAL-ICEX-001.
        reduction_ref: >-
          Direct: the protocol's icex_feed block names
          residual_vs_HEUR-SEMAEV-2015-4.3 as required package content, so a
          corrected reference changes the package. No published reduction is
          cited or needed.
        asymptotics_preserved: >-
          n/a -- no asymptotic statement is transported.

  predictions:
    - metric: enumerated size-m multiset total from W, summed over all targets
      direction: different
      minimum_effect: >-
        EXACTLY C(2B+m-1, m), zero deviation, on every tested (curve, base, m).
    - metric: "m = 1 baseline: size of the decomposable target set"
      direction: different
      minimum_effect: EXACTLY 2B, zero deviation.
    - metric: "c_W(O) at m = 2 on a 2-torsion-free base"
      direction: different
      minimum_effect: EXACTLY B when V carries no other 2-term relation; never below B.
    - metric: "fraction of targets with c_W(g) = c_W(-g)"
      direction: different
      minimum_effect: EXACTLY 1.000.
    - metric: "exponent ratio mu / (B^m/(m! p)) per cell"
      direction: higher
      minimum_effect: >-
        > 4 at every m = 2 cell and > 8 at every m = 3 cell, strictly decreasing in
        B within each cell family. Forced values with N set to p: 4.500, 4.333,
        4.250, 4.167 (bits 8); 4.333, 4.200, 4.143, 4.100 (bits 10); 4.250, 4.143,
        4.100, 4.071 (bits 12, m = 2); 9.563, 8.878, 8.610, 8.434 (bits 12, m = 3);
        4.167, 4.100, 4.062, 4.042 (bits 16).
    - metric: "forced residual |1 - exp(-mu) - P_reported| against the 0.05 tolerance"
      direction: higher
      minimum_effect: >-
        At least 16 of 20 default cells above 0.05. Forced values: bits 8 m 2 --
        0.181, 0.320, 0.428, 0.475; bits 10 m 2 -- 0.105, 0.240, 0.370, 0.474;
        bits 12 m 2 -- 0.049, 0.133, 0.236, 0.367; bits 12 m 3 -- 0.287, 0.662,
        0.519, 0.168; bits 16 m 2 -- 0.007, 0.019, 0.046, 0.098.
    - metric: "source fidelity of the transcribed formula"
      direction: different
      minimum_effect: >-
        NO PREDICTION. Pre-registered as UNKNOWN because the paper has not been
        read. Both outcomes are recorded and neither is treated as confirmation.

  test_boundary:
    instances: >-
      Deterministically generated ordinary short-Weierstrass curves over prime
      fields at field_bits in {8, 10, 12, 16}, plus a Z/N control group with the
      curve removed, plus a points-without-negation nearby object.
    parameters:
      field_bits: [8, 10, 12, 16]
      arity_m: [1, 2, 3]
      factor_base_sizes: "the protocol's own default ladder, unmodified"
      base_families: [uniform_random, two_torsion_seeded_null, small_multiples_positive_control]
    implementation: >-
      Pure Python standard library only. No sympy (verified absent), no Sage
      (verified absent), no Groebner basis, no numpy required.
    budget:
      wall_clock_seconds_total: 3600
      maximum_memory_gb: 2
      note: >-
        Exhaustive enumeration of C(2B+m-1,m) multisets is bounded by ~2.6e3 at the
        largest tested m = 3 cell used for the exactness checks; the ladder's
        largest m = 2 cell is C(97,2) = 4656. Nothing here is compute-bound.

  falsification_conditions:
    - Any enumerated multiset total differing from C(2B+m-1, m). Hypothesis refuted in full.
    - The m = 1 baseline returning a decomposable set of size other than 2B.
    - A measured exponent ratio near 1 rather than near 2^m.
    - c_W(O) below B at m = 2 on a 2-torsion-free base, or any c_W(g) != c_W(-g).
    - >-
      The primary source, once read, stating the model with the 2^m already present
      in its own notation. The hypothesis is then re-scoped in writing from "the
      reference curve is wrong" to "this program's transcription of it is", which
      is a weaker claim about the literature and the same claim about the protocol.
    - >-
      The positive control (small-multiples base) failing to show a coverage
      collapse. Instrument insensitive; no negative may be reported from any arm.

  interpretation_limits:
    - >-
      Closes the frozen RULE-HEUR-TRACK metric only. Does not close GOAL-RELN-001,
      does not refute KN-LIT-009, does not establish any decomposition probability,
      does not touch ARM-PKM-PRIME, and does not license any statement about
      crypto-scale relation supply. The protocol's prohibited_claims list is
      inherited verbatim.
    - >-
      Toy tier. The counting identity holds at every scale, so the enumeration is a
      check of a derivation rather than an extrapolation; that does not upgrade the
      tier of any conclusion about decomposition probability.
    - >-
      No status change to the frozen protocol, to EV-RELN-001, to the goal's
      next_action, or to any knowledge record is proposed or implied. Those are
      Coordinator decisions (AGENTS.md rule 1).
    - >-
      The forced residual table is computed with N set to p as a placeholder. The
      contract fixes real curves and real N; the p/N factor is reported separately
      so that the 2^m and the Hasse effect are never conflated.

