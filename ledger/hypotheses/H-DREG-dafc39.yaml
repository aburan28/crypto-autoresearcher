hypothesis:
  id: H-DREG-dafc39
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  derived_from_idea: IDEA-20260808-6a2b50
  status: proposed
  added: '2026-09-04'

  statement: >-
    SCOPE. The boolean chained Semaev system at m = 3, t = 3, ti = 0 built by
    src/semaev_tree.py and Weil-descended to GF(2), at n = 9 with n = 12 as a
    conditional stretch rung; and the prime-field decomposition ideal I_R at
    p = 1009, B = 6, m = 2, with (B, m) = (8, 3) as a conditional stretch cell.
    CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO CRYPTO-SCALE CLAIM, NO ECDLP HARDNESS
    STATEMENT, AND NO STATUS CHANGE FOR H-DREG-001 OR H-SIG-001 IS PROPOSED.

    THE HYPOTHESIS, AS A GATE FOLLOWED BY TWO CLAIMS. The gate comes first because a
    committed correction says the claims are vacuous without it.

    (G0) THE APPLICABILITY GATE, AND IT CAN KILL THE WHOLE DESIGN BEFORE ANY COMPUTE.
      The graded rank profile this lane actually measures is computed on an
      INHOMOGENEOUS object - an affine, degree-truncated Macaulay matrix augmented
      with the field equations - and not on a homogeneous ideal. CORR-20260808-f4d780
      records the countervailing fact directly: "graded Macaulay rank is
      frame-invariant for homogeneous systems, making the claim a no-op". If the
      measured profile is homogeneous in the relevant sense, then a uniformly random
      linear change of variables CANNOT move it, every difference this design would
      report would be an implementation defect, and the correct outcome is to stop at
      Stage 0 and record the no-op. (G0) is therefore stated as a claim that can come
      out false, and its falsity is a legitimate and cheap deliverable.

    (P1) STRUCTURAL, CONDITIONAL ON (G0). The chained boolean Semaev system and the
      prime-field decomposition ideal I_R are NOT in generic coordinates, in the
      precise operational sense that a uniformly random invertible linear change of
      variables changes the graded rank profile at some degree. This is an
      operational definition and is deliberately not the Zariski one: it is what a
      finite battery of frames can actually decide.

    (P2) OPERATIONAL, CONDITIONAL ON (G0), AND THREE-WAY. Under a random linear
      change of coordinates the measured solving degree d_solve either
      (a) DROPS - in which case a measured deficit in this lane is partly a
      coordinate artifact and the intrinsic invariant to chase is reg(I^hom);
      (b) does NOT change - in which case the low solving degree, where it exists, is
      frame-robust here and a rigorous upper bound via Castelnuovo-Mumford regularity
      becomes the candidate route to replace the heuristic first-fall proxy; or
      (c) RISES - in which case the NATIVE Semaev frame is BETTER than generic, which
      is the most interesting outcome of the three, because it says the Semaev
      structure is a favourable coordinate choice and quantifies by how much.
      ALL THREE ARE DELIVERABLES. The lane currently has none of them.

    WHAT IS DELIBERATELY NOT CLAIMED. That a degree DROP would make these systems
    easier - the randomised system is strictly more expensive to reduce, and the
    contract reports degree and cost as two separate columns precisely so the two
    effects cannot be conflated. That the Castelnuovo-Mumford bound holds as stated -
    it is an UNVERIFIED EXTERNAL RESULT here, is a MOTIVATION for the experiment, and
    may not be used as an ingredient of any claim until an agent in this program has
    read a primary source and said so in a new record. And that anything follows for
    crypto-scale systems, for other m or t, or for ECDLP hardness.

  mechanism: >-
    THE PROGRAM MEASURES d_solve AND DEFICITS AGAINST A SEMI-REGULAR NULL AND TREATS
    THE RESULT AS A PROPERTY OF THE SYSTEM. Solving degree is not in general a
    coordinate invariant: it depends on the monomial order and on the linear
    coordinate frame. The last fall degree is order-independent, and
    Castelnuovo-Mumford regularity is a genuine ideal invariant; a system that is not
    in generic coordinates can have solving degree far above reg(I^hom), and the
    classical repair is randomisation of the frame. So the question "is the measured
    deficit a property of the ideal or of the frame we wrote it in" is answerable by
    a battery of random frames, and it has never been asked in this lane.

    WHY THE GATE IS FIRST AND IS NOT A FORMALITY. For a HOMOGENEOUS system the graded
    Macaulay rank at each degree is invariant under GL acting on the variables,
    because a linear change of variables is a graded isomorphism of the polynomial
    ring: it maps the degree-D component onto itself bijectively and therefore
    preserves the rank of the degree-D Macaulay map. The frame battery can only see
    anything if the measured object is affine / degree-truncated / field-equation
    augmented, where the truncation and the field equations break the grading. The
    gate is a written derivation about which object the lane's instrument actually
    builds, and it costs nothing to run.

    WHY A NULL ARM IS REQUIRED BEFORE ANY DIFFERENCE MAY BE READ. If the
    support-matched semi-regular null - which is frame-insensitive by construction in
    the homogeneous part - shows a frame-dependent degree, the instrument is
    measuring the frame rather than the system and nothing else in the run may be
    read. This is controls-before-belief applied to a transformation rather than to a
    parameter.

    WHY CORANK INVARIANCE IS A FREE CORRECTNESS GATE. The number of solutions of the
    system is invariant under an invertible linear change of variables. So the corank
    at d_solve must be IDENTICAL in the native and every random frame. A run in which
    it differs has a bug, and the run is discarded rather than interpreted - which is
    a per-run check that costs nothing and catches the most likely implementation
    error.

    WHY THE COST COLUMN IS REPORTED SEPARATELY AND WHY THIS IS A MEASUREMENT AND NOT
    A PROPOSED SPEEDUP. A random linear change of variables DESTROYS sparsity and
    destroys the S_m symmetry, so the practical cost rises in the random frame even
    where the degree falls. Wall time in the two frames is not comparable at all;
    only degrees and operation counts are. The deliverable is a table with degree and
    cost as separate columns, never a single figure of merit that would hide one
    inside the other.

  assumptions:
    - >-
      Exact linear algebra over the base field throughout. No floating point anywhere
      in a decision path.
    - >-
      The SAME solver and the SAME degree-graded termination criterion in both frames.
      Comparing a symmetry-exploiting solver in the native frame against a general
      solver in the random frame would measure the solver, not the frame.
    - >-
      Over GF(2) the field equations must be RE-DERIVED in the new frame; the
      implementation records that it did so. An implementation that transports the
      original field equations unchanged is measuring a different system.
    - >-
      Solution counts are obtained independently by enumeration where feasible, so
      the corank-invariance gate has an independent reference rather than being
      self-consistent.
    - >-
      Small n or small B may leave d_solve pinned at the Semaev degree, where no frame
      effect can appear. A cell in that regime is reported as UNINFORMATIVE rather
      than as evidence that frames do not matter.
    - >-
      Genericity over GF(2) is weak: the Zariski argument that a random frame is
      generic with probability 1 - o(1) needs a large field. Over GF(2) the design
      compensates with >= 8 independent frames and reports the DISTRIBUTION over
      frames rather than a mean, and this is an acknowledged weakness rather than a
      solved problem.

  proof_search_map:
    bottleneck: >-
      Whether the quantity this lane calls a deficit is coordinate-free. Every
      deficit GOAL-DREG-001 and GOAL-SIG-001 have measured is stated as a property of
      the system; if the graded profile is frame-dependent, each of those numbers
      carries an unstated dependence on the frame it was written in and must be
      re-stated before it can support any claim. That re-statement obligation - or its
      explicit discharge - is the decision-changing output.
    baseline_embedding:
      parameter_slice: >-
        The IDENTITY FRAME is the exact boundary: applying the identity matrix must
        reproduce the native-frame arm bit for bit. The native measurement is
        therefore contained in the claimed family as a slice, not as an analogy, and
        the committed n = 9 and n = 12 cells of this lane are the values it must
        agree with.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE. Arm A must reproduce, exactly, the committed graded
        rank values this lane has recorded for the same cells, each printed beside its
        committed value with source path and sha256; and the identity-frame run must
        reproduce Arm A byte-identically in its rank vector. A mismatch in either
        halts the contract before any random frame is drawn.
    observation_collision:
      observable: 'the integer d_solve read off the graded profile in a given frame'
      distinct_preimage_search: >-
        THE COLLISION IS NAMED. The same integer difference d_solve(random) -
        d_solve(native) can arise from (a) a genuine failure of generic coordinates,
        (b) a change in the effective system because the field equations were not
        re-derived in the new frame, (c) a degree-truncation boundary reached in one
        frame and not the other because the truncation degree was held fixed while the
        profile moved, or (d) a solver whose termination criterion differs between the
        sparse and dense regimes. Four preimages, one observable. The separating
        conditions are the recorded field-equation re-derivation, a truncation degree
        set relative to the observed stable degree rather than absolutely, the
        corank-invariance gate, and the identical-solver requirement - and a
        frame-difference reported without all four is a difference in an unidentified
        quantity.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the frame-dependent d_solve with reg(I^hom), the Castelnuovo-Mumford
          regularity of the homogenised ideal, as the quantity the lane reports - IF
          the frame battery shows d_solve is frame-dependent, and ONLY after the
          governing inequality has been transcribed from a primary source into
          knowledge/literature/ by an agent that read it.
        predicted_gain: >-
          A coordinate-free quantity and, conditionally, a RIGOROUS upper bound where
          the lane currently has a heuristic first-fall proxy. No exponent and no
          attack; a bound is not a cost model and may be astronomically loose.
      - transform: observable_fiber
        proposed_object: >-
          Hold the cell fixed and vary only the frame across >= 8 draws, exhibiting
          the full distribution of d_solve and, separately, of the Macaulay nonzero
          count.
        predicted_gain: >-
          A measured sensitivity of the lane's headline observable to a group action
          nobody has applied to it, plus a tail check for rare good frames.
    quantifier_order: >-
      CLAIMED. FOR EACH tested cell, and CONDITIONAL ON (G0) resolving to
      inhomogeneous, THERE EXISTS at least one frame among >= 8 uniformly random
      invertible frames whose graded rank profile differs from the native profile at
      some degree. NOT CLAIMED, and each is the dangerous stronger reading: that the
      difference is in a particular direction; that it holds for ALL frames; that it
      persists at cells not tested; that a Zariski-generic statement over GF(2)
      follows from a finite battery; or that reg(I^hom) bounds d_solve, which is an
      unverified external result and is not claimed here at all.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the boolean chained Semaev system at m = 3, t = 3, ti = 0 at the cells
        actually reached, and for I_R at p = 1009 at the (B, m) cells actually
        reached, under one declared solver and one declared truncation rule: the
        measured graded rank profiles and d_solve values in the native frame and in
        each of the >= 8 recorded random frames, their differences, and the measured
        Macaulay nonzero counts." It certifies NOTHING about genericity in the Zariski
        sense, nothing about untested cells, nothing at crypto scale, nothing about
        reg(I^hom), and nothing about ECDLP hardness.
      nearby_object_control: >-
        TWO, and both can fail. First, the IDENTITY FRAME - the null object of the
        transformation itself, which must reproduce the native arm bit for bit; a
        difference there is an implementation defect and voids the battery. Second,
        the SUPPORT-MATCHED SEMI-REGULAR NULL run in both frames, which must show no
        frame-dependent degree; if the null moves under a change of frame, the
        instrument is measuring the frame and nothing else may be read.
    proof_obligations:
      - claim: The measured object is inhomogeneous in the sense that makes a frame battery non-vacuous.
        responsibility: baseline
      - claim: The identity frame reproduces the native arm bit for bit.
        responsibility: correctness
      - claim: Corank at d_solve is identical across frames in every retained run.
        responsibility: correctness
      - claim: Field equations are re-derived in each new frame and the re-derivation is recorded.
        responsibility: interface
      - claim: The same solver and termination criterion are used in every frame.
        responsibility: strictness
      - claim: Degree and cost are reported as separate columns and never combined.
        responsibility: scope
      - claim: The regularity bound is not used as an ingredient of any claim until transcribed from a primary source.
        responsibility: interface

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. No attack exponent is proposed and no algorithm is offered. The
    only exponent this record could ever touch is the value of the algebraic-oracle
    exponent that a downstream index-calculus costing consumes, and it could touch it
    only through a future, separate claim: a constant drop in d_solve changes nothing
    asymptotically, and only a drop from Theta(B) to O(B^gamma) would move anything -
    which this design neither claims nor could detect at the cells it can reach.

  heuristic_assumptions:
    - id: HEUR-DREG-FRAME-1
      formal_statement: >-
        FOR a polynomial system in generic coordinates, the solving degree is bounded
        above by the Castelnuovo-Mumford regularity of the homogenised ideal; AND a
        uniformly random invertible linear change of variables places a system in
        generic coordinates with probability 1 - o(1) over a sufficiently large field.
      random_model_justification: >-
        Genericity in the Zariski sense - the property holds off a proper closed subset
        of GL_n, so a random frame avoids that subset with high probability over a
        large field. OVER GF(2) THAT PROBABILITY ARGUMENT IS WEAK and this is the
        weakest link in the whole design; the experiment compensates by drawing >= 8
        independent frames per cell and reporting how many agree, rather than
        reporting a mean as if the argument held.
      supporting_results: []
      supporting_results_note: >-
        DELIBERATELY EMPTY. The inequality is an UNVERIFIED EXTERNAL RESULT: the
        parent proposal attributes it to the Caminata-Gorla line of work and records
        that no primary source could be opened. No agent in this program has read one.
        Under AGENTS.md rule 9 a recalled citation may not discharge this field, so it
        stays empty and the bound is a MOTIVATION for the experiment rather than an
        ingredient of any claim. The conversion route is Stage 0b of EXP-DREG-c92f56.
      validation_experiment_ids: [EXP-DREG-c92f56]
      falsification_condition: >-
        The support-matched semi-regular null arm shows a frame-dependent degree, which
        would mean the frame battery measures the instrument rather than genericity;
        or d_solve is identical in the native frame and in all >= 8 random frames at
        every reached cell, which falsifies the operational reading of the heuristic
        for these systems at these parameters.
    - id: HEUR-DREG-FRAME-2
      formal_statement: >-
        FOR the graded rank profile as this lane's instrument actually computes it -
        affine, degree-truncated, augmented with the field equations - a uniformly
        random invertible linear change of variables can change the profile; that is,
        the measured object is not homogeneous in the sense that would force
        invariance.
      random_model_justification: >-
        Not distributional. It is a structural statement about which object the
        instrument builds, and it is decided by a written derivation over the
        instrument's own construction rather than by sampling.
      supporting_results: []
      supporting_results_note: >-
        The countervailing fact is INTERNAL and committed: CORR-20260808-f4d780 records
        that graded Macaulay rank is frame-invariant for homogeneous systems, making
        the frame claim a no-op in that case. That correction is the reason this
        heuristic exists as a gate rather than as an assumption.
      validation_experiment_ids: [EXP-DREG-c92f56]
      falsification_condition: >-
        The Stage 0 derivation concludes that the measured profile is homogeneous in
        the relevant sense. The frame battery is then a no-op, (P1) and (P2) are
        unanswerable by this design, and the contract stops at Stage 0 with that as
        its deliverable.

  structural_ingredients:
    - description: >-
        The solving-degree <= Castelnuovo-Mumford-regularity bound for systems in
        generic coordinates, together with the notion of a system failing to be in
        generic coordinates.
      citation: >-
        Attributed by the parent proposal to the Caminata-Gorla line of work on
        solving degree, regularity and last fall degree. NO PRIMARY SOURCE HAS BEEN
        OPENED BY ANY AGENT IN THIS PROGRAM, and the exact hypotheses (which grading,
        which field-size requirement, affine versus homogeneous) are consequently
        UNKNOWN here.
      provenance: recalled
      verified_by: null
      role: >-
        MOTIVATION ONLY. This ingredient may not back a coordinator decision, may not
        discharge HEUR-DREG-FRAME-1's supporting_results, and may not be quoted as a
        bound anywhere. Its conversion route is Stage 0b of EXP-DREG-c92f56:
        transcribe the exact hypothesis and inequality and record them in a NEW
        knowledge/literature entry naming the agent that read the source.
    - description: >-
        In-corpus pointers named by the parent proposal - an algebraic modelling
        reported as "not in generic coordinates" for a neighbouring problem, and the
        order-independence of the last fall degree.
      citation: knowledge/literature/KN-LIT-1540.md and knowledge/literature/KN-LIT-7607.md
      provenance: recalled
      verified_by: null
      role: >-
        POINTERS ONLY, AND MARKED CONSERVATIVELY ON PURPOSE. Both paths were confirmed
        to EXIST in this repository, but this Coordinator did NOT open either file, so
        nothing about their CONTENT is asserted here and the entry is marked `recalled`
        rather than `internal` so that it cannot support anything. Reading them is a
        zero-compute Stage 0b deliverable. KN-LIT-7607's last fall degree is the
        stronger, order-independent invariant and PARTIALLY DOMINATES this record's
        motivation; the honest response, stated in the parent proposal and adopted
        here, is to run both rather than to claim priority for this one.

  reduction_chain: null
  rerandomization: null

  predictions:
    - metric: >-
        Stage 0 homogeneity determination for the measured graded rank profile
      direction: different
      minimum_effect: >-
        A written derivation returning INHOMOGENEOUS or HOMOGENEOUS, with the reason
        stated over the instrument's own construction. HOMOGENEOUS stops the contract
        and is a complete, cheap deliverable that discharges CORR-20260808-f4d780's
        objection either way.
    - metric: graded rank profile, native frame versus >= 8 random frames, per degree
      direction: different
      minimum_effect: >-
        If (P1) holds, the profiles differ at some degree in at least one frame.
        FORCED CHECK ATTACHED: the corank at d_solve must be IDENTICAL in every frame,
        because the solution count is frame-invariant; a run where it differs has a
        bug and is discarded, not interpreted.
    - metric: d_solve(random frame) - d_solve(native frame), integer, >= 8 frames per cell
      direction: different
      minimum_effect: >-
        THE DISTRIBUTION OVER FRAMES IS REPORTED, NOT ITS MEAN, and all three signs are
        reportable outcomes. NEGATIVE - the native frame is pathological and measured
        deficits are partly coordinate artifacts, creating a re-statement obligation
        for every deficit in GOAL-DREG-001 and GOAL-SIG-001. ZERO across all frames and
        all cells - the operational form of (P1) is false, the artifact hypothesis
        dies, and reg(I^hom) becomes the recommended rigorous-bound route. POSITIVE -
        the native Semaev frame is BETTER than generic, and the integer says by how
        much.
    - metric: >-
        frame-sensitivity of the support-matched semi-regular null arm
      direction: different
      minimum_effect: >-
        FORCED TO ZERO. Any frame-dependent degree in the null arm voids the instrument
        and nothing else in the run may be read.
    - metric: identity-frame reproduction of the native arm
      direction: different
      minimum_effect: >-
        FORCED TO BIT-FOR-BIT EQUALITY of the rank vector. Any difference is an
        implementation defect and separates a defect from genuine drift.
    - metric: Macaulay matrix nonzero count, native versus random frame
      direction: higher
      minimum_effect: >-
        RISES BY A LARGE FACTOR in the random frame at every cell. This is expected,
        is NOT evidence against any degree finding, and is reported in its own column
        precisely so the two effects cannot be conflated.
    - metric: minimum d_solve over all frames at a cell
      direction: lower
      minimum_effect: >-
        REPORTED SEPARATELY. If a single frame achieves a materially lower degree than
        the rest, that is a rare-good-frame phenomenon, is a separate and potentially
        exploitable finding, and MUST NOT be averaged away.

  test_boundary:
    instances: >-
      Boolean chained Semaev at m = 3, t = 3, ti = 0 built by src/semaev_tree.py and
      Weil-descended to GF(2), at n = 9 (primary) and n = 12 (conditional stretch);
      the prime-field decomposition ideal I_R at p = 1009 with (B, m) = (6, 2)
      (primary) and (8, 3) (conditional stretch); and the support-matched semi-regular
      null at every reached cell, in both frames.
    parameters:
      m: 3
      t: 3
      ti: 0
      boolean_n_primary: 9
      boolean_n_stretch: 12
      prime_field_p: 1009
      prime_field_cells_primary: 'B = 6, m = 2'
      prime_field_cells_stretch: 'B = 8, m = 3'
      frames_per_cell: '>= 8 uniformly random invertible frames, plus the identity frame, plus the native frame'
      arms: 'A native, B random, C prime-field native and random, D support-matched null in both frames'
    implementation: >-
      Python 3.11 with exact GF(2) and exact GF(p) linear algebra; a change-of-frame
      wrapper around this lane's existing exact-rank engine; field equations
      re-derived in every frame with the re-derivation recorded; identical solver and
      identical degree-graded termination criterion in every frame; solution counts
      obtained by independent enumeration where feasible; peak RSS measured per cell.
      Recorded through harness/runner.py.
    budget:
      wall_clock_seconds: 3600
      total_cpu_hours: 6.0
      memory_gb: 8
      maximum_runs: 60

  distinguishable_outcomes:
    - outcome: >-
        STAGE 0 RETURNS HOMOGENEOUS. The measured graded profile is invariant under GL
        by construction.
      what_observing_it_would_mean: >-
        (G0) is FALSE, HEUR-DREG-FRAME-2 is falsified, and the frame battery is a
        no-op exactly as CORR-20260808-f4d780 warned. The contract STOPS with zero
        compute spent and the derivation as its deliverable. This is a cheap, honest
        and genuinely useful outcome: it closes a proposed lane on a named structural
        obstruction rather than on fatigue, and it tells GOAL-SIG-001 the same thing.
    - outcome: >-
        INSTRUMENT VOID. The support-matched null shows a frame-dependent degree.
      what_observing_it_would_mean: >-
        The measurement is reading the frame rather than the system. NOTHING else in
        the run may be read, no (P1) or (P2) verdict is emitted, and the deliverable
        is the null arm's own frame-dependence, which is a defect report about the
        instrument.
    - outcome: >-
        d_solve DROPS in random frames at a measurable cell.
      what_observing_it_would_mean: >-
        (P2)(a). Every deficit this program has measured in the native frame carries an
        unstated frame dependence and must be RE-STATED before it can support any
        claim - a re-statement obligation for GOAL-DREG-001 and GOAL-SIG-001, not an
        invalidation of their runs. IT DOES NOT MEAN THE SYSTEMS ARE EASIER: the
        randomised system is more expensive to reduce, which the cost column shows.
        Independent replication is required before any status change, because this
        outcome would be surprising and is sensitive to exactly the implementation
        choices the controls exist to pin.
    - outcome: >-
        d_solve UNCHANGED across native and all >= 8 frames at every reached cell.
      what_observing_it_would_mean: >-
        The operational form of (P1) is FALSE for these systems at these parameters,
        the coordinate-artifact hypothesis dies within the tested scope, and the
        lane's measured degrees are frame-robust there. The forward guidance is
        concrete: reg(I^hom) becomes the recommended rigorous-upper-bound route, and
        its first step is transcribing the governing inequality from a primary source,
        which this contract does not do.
    - outcome: >-
        d_solve RISES in random frames.
      what_observing_it_would_mean: >-
        (P2)(c), and the most informative of the three. The native Semaev frame is a
        FAVOURABLE coordinate choice and the integer difference quantifies the
        advantage the structure confers - a measurement about the value of the
        structure itself, which no record in this lane contains.
    - outcome: >-
        UNINFORMATIVE CELL. d_solve is pinned at the Semaev degree in every frame
        because n or B is too small for any frame effect to appear.
      what_observing_it_would_mean: >-
        The cell cannot discriminate and is reported as UNINFORMATIVE, not as evidence
        that frames do not matter. The forward action is a larger cell, which is a
        budget question, not a scientific verdict.
    - outcome: >-
        INFRASTRUCTURE. A cell exceeds the memory or time budget.
      what_observing_it_would_mean: >-
        NOTHING about coordinates or about d_reg (AGENTS.md rule 5).
        failed_infrastructure; the reached cells and the measured peak RSS are the
        deliverable and the verdict is deferred, never answered negatively.

  falsification_conditions:
    - >-
      The Stage 0 derivation finds the measured graded profile homogeneous in the
      sense that forces GL-invariance. (G0) fails and the design is a no-op.
    - >-
      The support-matched semi-regular null arm shows a frame-dependent degree.
      Instrument void; nothing else may be read.
    - >-
      The corank at d_solve differs between frames in any run. Implementation bug; the
      run is DISCARDED, not interpreted.
    - >-
      The identity-frame arm fails to reproduce the native arm bit for bit. Defect in
      the change-of-frame wrapper; the battery is void until repaired.
    - >-
      d_solve is identical in the native frame and in all >= 8 random frames across
      every reached cell. (P1) is false as an operational statement.
    - >-
      Arm A fails to reproduce the committed graded rank values for the same cells.
      The instrument is not the lane's instrument and no comparison is meaningful.

  interpretation_limits:
    - >-
      TOY TIER. Establishes nothing about crypto-scale systems, nothing at other m or
      t, nothing at n or (B, m) beyond the cells actually reached.
    - >-
      A DROP IN d_solve UNDER RANDOMISATION DOES NOT MEAN THE SYSTEMS ARE EASIER. The
      randomised system is more expensive to reduce. It means the measured deficit is
      not a coordinate-free quantity and must be re-stated before it can support any
      claim.
    - >-
      The Castelnuovo-Mumford bound is invoked ONLY as an upper bound under a
      genericity hypothesis that this design TESTS rather than assumes, and it is an
      unverified external result that may not be quoted until transcribed from a
      primary source by an agent that read it. A bound is also not a cost model and
      can be astronomically loose.
    - >-
      A finite battery of >= 8 frames over GF(2) cannot establish a Zariski-generic
      statement. What it can establish is an operational difference or its absence at
      the tested cells, and the record must never be read as more.
    - >-
      The last fall degree (order-independent by construction) is a STRONGER invariant
      than anything measured here and partially dominates this record's motivation.
      This hypothesis does not compete with it and recommends running both.
    - >-
      No status change for H-DREG-001, H-SIG-001 or GOAL-DREG-001 follows from any
      outcome. A re-statement obligation is not an invalidation, and neither is a
      status transition.

