hypothesis:
  id: H-MONO-5b6617
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  derived_from_idea: IDEA-20260904-ad63fe
  status: instrument_no_go_zero_discriminating_power_proven_by_null_object_control
  status_note_2026_09_04: >-
    Per DEC-20260904-858cdc (evidence EV-MONO-661ee4), following
    independent Validator + Red Team review (TASK-20260904-44e988):
    the S_4 construction and the projective (root-at-infinity) reading of
    the 0.98% affine-reading "deviations" are both independently proven
    correct, by THREE fully disjoint methods across both reviewers,
    including an exact algebraic identity (c_4=S_3^2) and direct
    F_{p^3}/F_{p^6} point-arithmetic verification of ALL 6,762 disclosed
    instances (not a sample). BUT the diagnostic itself is proven, via an
    explicit null-object control, to have ZERO DISCRIMINATING POWER: the
    Red Team constructed NULL(T)=(T-e1)*g(T), whose monodromy is the
    intransitive point-stabilizer S_3 (not even transitive on the four
    roots), and showed it reproduces the census's exact results,
    instance-for-instance, at every prime. The reason: AGL(2,2)=S_4's own
    8 order-3-linear-part elements are ALL 3-cycles for EVERY translation,
    so "g irreducible" forces the observed cycle type by pure group
    theory, independent of the actual curve-specific data. This is a
    THIRD instance of this lane's own conditioning-trap failure class
    (after OBS-5 and EXP-MONO-12ce1c's ordered-generic-locus trap). This
    hypothesis's own claimed "two-sided" pre-registration was not actually
    two-sided (the falsification branch was empty before the run, per
    group theory alone) -- a design gap this Coordinator did not catch
    before dispatch, self-disclosed in the same decision. The Red Team
    identified and informally piloted the CORRECT alternative design (an
    unconditioned five-class census, genuinely discriminating since every
    proper S_4 subgroup predicts probability zero for some commonly-
    observed class) -- suggestive of full S_4 (chi-square ~4.5-4.9) but
    not evidence-eligible; a properly pre-registered version is the named
    next action.
  added: '2026-09-04'

  statement: >-
    SCOPE: m=4 only. Prime fields F_p, p > 3, toy range. E: y^2=x^3+Ax+B
    non-singular. Claim tier toy for every measurement; derivation tier for
    the group-theoretic setup this hypothesis reuses unmodified. No ECDLP,
    relation-rate, cost, or exponent claim.

    THE HYPOTHESIS. IDEA-20260904-ad63fe claims the m=4 Semaev summation
    cover, descended to the SYMMETRIC base B_sym=Spec k[e1,e2,e3] (e_i the
    elementary symmetric functions of the three base points' x-coordinates),
    has monodromy exactly AGL(2,2)=S_4 -- the FULL symmetric group on the
    quartic's four roots -- via a claimed descent argument (D3, from the
    companion record H-MONO-93bc4d) requiring the symmetric-base splitting
    field to surject onto S_3 (the Galois group of the base cubic
    g(X)=X^3-e1X^2+e2X-e3). DEC-20260904-4eb323 (evidence EV-MONO-95b9b1)
    independently REFUTED that general D3 formula at its OWN m=3 baseline
    (the true m=3 symmetric-base group is S_2, order 2, not the order-4
    group D3 predicts, because the needed surjection does NOT hold at
    m=3). Whether the analogous surjection DOES hold at m=4 specifically is
    genuinely open and untested -- Red Team's own independent review of
    H-MONO-93bc4d confirmed S_3 -> Aut(V) is an ISOMORPHISM at m=4 (both
    groups have order 6), which is necessary but not sufficient for the
    full descent to hold, since it says nothing about whether the
    TRANSLATION part (sigma) is also realized compatibly.

    THE CONCRETE, CHEAP TEST (named independently and identically by both
    H-MONO-93bc4d's Red Team review and IDEA-20260904-ad63fe's own
    Stage-1 recipe): if g(X) is IRREDUCIBLE over F_p (so Frobenius acts on
    its 3 roots as a 3-cycle), IDEA-20260904-ad63fe's own (C3)(c) predicts
    the quartic Q_e(T)=S_4^sym(e1,e2,e3,T) is FORCED to factor as
    (linear)*(irreducible cubic) over F_p -- cycle type "3+1" -- ALWAYS,
    under the assumed full-S_4 monodromy. Finding even ONE base point with
    g irreducible where Q_e(T) does NOT show this exact factorization
    pattern falsifies the full-S_4 claim at m=4; finding it CONSISTENTLY
    (across many independent base points and curves) supports it.

    PRE-REGISTERED, TWO-SIDED. (I) Every tested base point with g
    irreducible shows Q_e(T) factoring as exactly (linear)(irreducible
    cubic): the m=4 symmetric-base monodromy is consistent with full S_4 on
    this specific diagnostic, and IDEA-20260904-ad63fe's own claim survives
    its own named cheapest test. (II) Any tested base point with g
    irreducible shows Q_e(T) factoring some OTHER way (e.g. splitting
    completely, or as two irreducible quadratics, or as an irreducible
    quartic): the full-S_4 claim is falsified at m=4, exactly as
    H-MONO-93bc4d's D3 was falsified at m=3, and the symmetric-base
    monodromy at m=4 is a proper subgroup of S_4 not yet identified.

  mechanism: >-
    Reuses IDEA-20260904-ad63fe's own (C1)-(C3) setup unmodified (the
    descent to the symmetric base; the sign-torsor/S_3 semidirect-product
    structure of the claimed group; the per-instance Frobenius recipe).
    This hypothesis narrows that idea's own full four-arm Stage-1 design to
    ONLY the single cheapest, most targeted diagnostic named convergently
    by both reviews of H-MONO-93bc4d and by the idea's own (C3)(c): the
    g-irreducible case's forced cycle-type prediction.
    CONSTRUCTION REQUIRED (not yet performed by this program): the explicit
    quartic Q_e(T) = S_4^sym(e1,e2,e3,T), i.e. the m=4 Semaev summation
    polynomial descended to symmetric coordinates. This must be derived
    from the curve's group law (via the same resultant-elimination method
    already used and verified this session for S_3, extended to 4 points),
    NOT assumed or copied from any external source (matching this lane's
    own "derive, don't cite unread sources" discipline). Once Q_e(T) is
    available as an explicit polynomial in (A,B,e1,e2,e3,T), the test
    procedure is: (1) draw a random cubic g over F_p (equivalently random
    e1,e2,e3), (2) check g is irreducible over F_p (reject and redraw if
    not -- this is a SELECTION on the base point, not a rejection of a
    curve), (3) evaluate Q_e(T) at the resulting (e1,e2,e3) to get an
    explicit quartic in T with coefficients in F_p, (4) factor that quartic
    over F_p (squarefree + distinct-degree factorization, no CAS required)
    and record its exact factorization-degree pattern, (5) repeat for many
    independent base points and at least two independent curves.

  falsification_condition: >-
    Any tested (curve, base point) pair with g irreducible over F_p whose
    resulting quartic Q_e(T) does NOT factor as (linear)(irreducible
    cubic). A single such instance, correctly constructed and verified,
    falsifies the full-S_4 claim at m=4 -- matching the record's own
    quantifier order (a universal claim falls to one counterexample).

  heuristic_assumptions:
    - id: H1
      statement: >-
        None load-bearing for the FALSIFICATION direction (a single
        counterexample suffices under correct construction, no
        distributional assumption needed). For the CORROBORATION direction
        (repeated agreement supporting, not proving, full S_4), the
        implicit assumption is that base points are drawn independently
        and that agreement across many independent draws is informative
        evidence rather than a systematic artifact of the construction --
        exactly the kind of assumption this lane's own prior cycle
        (H-MONO-1d50ac) learned to scrutinize carefully via exact
        combinatorial verification rather than resting on sample size
        alone.
      rigorous_support: >-
        Not a random-model heuristic in the usual sense; the underlying
        question (is the Galois group S_4 or a proper subgroup) is a fixed
        fact about the polynomial Q_e(T) over the function field, not a
        distributional claim. Repeated sampling is used only to search for
        a falsifying instance and to build confidence in the absence of
        one, per Chebotarev-style reasoning already established as valid
        methodology in this lane (IDEA-20260904-ad63fe's own mechanism).
      validation_plan: >-
        SAMPLE: at least 50 independent base points with g irreducible, on
        at least 2 independent curves. COMPARE AGAINST: the exact predicted
        factorization pattern (linear)(irreducible cubic), zero-tolerance.
        TAIL CHECK: not applicable to an exact per-instance prediction.
        TRANSFER ASSUMPTION, STATED: agreement at these specific curves and
        primes does not establish the claim for every curve; it is toy-scale
        evidence only, per this record's own claim tier.
      falsification_condition: >-
        Any single disagreement, as stated above.

  target_complexity:
    time_exponent: >-
      O(1) per base point (a constant number of field operations and one
      quartic factorization); not an ECDLP-relevant complexity.
    memory_exponent: O(1).
    best_known: Not applicable; no ECDLP complexity claim. Pollard rho (KN-OPEN-001) untouched.

  claim_boundary_and_test_boundary: >-
    Tests ONLY the g-irreducible diagnostic's own forced prediction at
    m=4, on a toy-scale sample of curves and base points. Does NOT test
    the other three arms of IDEA-20260904-ad63fe's own full calibration
    ladder (V4/D4/A4 controls), the exact matched-(t,Z) integer comparison,
    or any m other than 4. A pass here is consistent with, but does not by
    itself prove, full S_4 monodromy (other tests could still find a
    counterexample elsewhere); a single failure is a complete
    falsification regardless of sample size. Does not close KN-OPEN-009.
    Does not make any relation-rate, cost, or exponent claim.

