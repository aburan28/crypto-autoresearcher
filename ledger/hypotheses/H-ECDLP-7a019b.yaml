hypothesis:
  id: H-ECDLP-7a019b
  question_id: RQ-ECDLP-002
  title: >-
    The universal shape of the degree-4 syzygy among the X-coefficients of S_4 (its 27-position
    zero mask and its four dyadic entries) is an invariant of the (2,2)-resultant-composition
    class, not of elliptic-specific data
  statement: >-
    Let a_0..a_4 be the X-coefficients of S_4 = Res_Z(S_3(x1,x2,Z), S_3(Z,x3,X)) under the pinned
    formal-degree convention of experiments/EXP-TTN-002/ttn2_bond_rank_cert.sage, and let the
    degree-4 relation space be the kernel of the evaluation matrix on the 70 size-4 monomial
    products. The hypothesis asserts TWO separable parts. PART A (shape invariance, a claim about
    committed data): across all 9 committed cells of RUN-TTN-002-c the normalized degree-4 witness
    has an identical 27-position zero mask and identical values at exactly the four indices
    {4, 9, 16, 35}, being the reductions of 1, -1/4, 1/8, -1/64, while the remaining 39
    coefficients vary with the curve (a,b). PART B (attribution, the falsifiable mechanism): that
    invariant shape is a property of the (2,2)-resultant composition alone, so replacing s3_coeffs
    by a generic fully-symmetric tridegree-at-most-(2,2,2) surrogate on the same Newton polytope
    yields relation_dim_deg4 = 1 with the SAME 27-zero mask in at least 9 of 10 samples, while
    degree-matched non-composed controls yield relation_dim_deg4 = 0 in at least 9 of 10 samples.
    The hypothesis explicitly does NOT assert that the number 4 (the degree of the swept image
    hypersurface) is derived by this mechanism; that degree is a measured quantity.
  mechanism: >-
    s3_coeffs returns the Z-coefficients of S_3(x1,x2,Z) as three symmetric bidegree-(2,2) forms
    c2 = (x1-x2)^2, c1 = -2[(x1+x2)(x1 x2 + a) + 2b], c0 = (x1 x2 - a)^2 - 4 b (x1+x2). S4Xcoeffs
    evaluates a 4x4 Sylvester determinant with two d-rows and two e-rows at X = 0..4 and
    Vandermonde-inverts, so each a_i is bi-quadratic in the two Z-coefficient triples and the
    a-map factors through nu_2(d) x nu_2(e) followed by one fixed linear map. Two consequences
    follow. First, which quartic monomials can carry a coefficient forced by the bilinear pattern
    alone is determined by the composition and not by the curve, so the support mask and a
    distinguished sub-vector are composition-class invariants. Second, the curve (a,b) enters only
    through d and e, so the remaining coefficients must move with the curve. A competing structural
    reading is live because the four invariant values are dyadic: after the binomial rescaling
    a_i -> C(4,i) a_i-prime they become 1, -9, 12, -4, i.e. a_0^3 a_4 - (2 a_1^2 - 3 a_0 a_2)^2,
    which would point at a classical binary-quartic covariant origin instead. That reading is a
    hand-derived conjecture of the source proposal, conditional on the assumed AKEYS ordering, and
    the design separates it from the composition reading by a symbolic identity check rather than
    by an appeal to geometry.
  assumptions:
    - >-
      AKEYS is the sorted list of size-4 multisets from {a_0..a_4}. Every index-to-monomial
      statement here, including the dyadic sub-vector, is conditional on that ordering and must be
      re-derived from the pinned code before use.
    - >-
      The recorded witnesses are right-kernel basis vectors of the 70-column evaluation matrix,
      normalized with the first nonzero at index 4 in every cell; cross-cell comparison is only
      meaningful if that normalization is common.
    - >-
      Evaluation rank 69 at 96 points bounds the true polynomial span from above only. Only exact
      computation over Q(a,b) settles the true relation dimension.
    - >-
      CRT over {101, 431, 1009} gives modulus 43,922,779, so rational reconstruction is valid only
      up to height about 4,686. This is why the symbolic arm is primary and CRT is a cross-check.
    - >-
      Five of the nine committed cells were checked by hand by the proposer; the other four are
      unchecked and must be checked before any cross-cell claim is made.
  proof_search_map:
    bottleneck: >-
      The exact kernel of the 70-column degree-4 monomial-product system over Q(a,b). Everything
      else in the claim is bookkeeping around whether that kernel has dimension 1 and what its
      support is.
    baseline_embedding:
      parameter_slice: >-
        The generic-(a,b) evaluation arm at p = 101 seed 20260717, which must reproduce the
        committed anchors rank_AM = rank_BM = 69, rank_E = 68, rank_form = 68, rank_S_mod_p = 70,
        child_S_rank_QQ = 70, root rank 45.
      reproduction_check: >-
        Frozen fixture asserting exact integer equality of those committed anchors before any new
        claim is made. A mismatch halts the line.
    observation_collision:
      observable: >-
        The 27-position zero mask of the normalized degree-4 kernel witness.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO PRODUCE HITS. Three ground-truth generators can produce the same
        mask: the true Semaev composition, a fully-symmetric (2,2,2) surrogate, and a generic
        non-symmetric (2,2,2) surrogate on the same polytope. The ablation is precisely the search
        for those collisions, and which of the three reproduce the mask is what selects M1, M3 or
        M2. A fourth preimage, the non-composed type-(C) family, must NOT reproduce it; if it does,
        the detector manufactures relations and no conclusion in either direction is admissible.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (the 27-zero mask plus the four dyadic entries) fixed and vary the
          forgotten structure (which polynomial family generated it) across the four surrogate
          types A, A-prime, B and C.
        predicted_gain: >-
          A decision among M1, M2, M3, M4 obtained from a fixed interpretation map written before
          execution, rather than from an appeal to geometry.
    quantifier_order: >-
      FOR ALL samples from the fully-symmetric tridegree-at-most-(2,2,2) family on the pinned
      Newton polytope, at both declared primes, THERE EXISTS a degree-4 kernel of dimension exactly
      1 whose normalized witness has the pinned 27-position zero mask. The witness is allowed to
      depend on the sample; the MASK is not, and it is that uniformity which the ablation tests.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the declared primes and sample counts, and over Q(a,b) for the true system, the degree-4
        relation space of the S_4 X-coefficient map has dimension d and support mask M, and the
        symmetric surrogate family does or does not reproduce M." It certifies nothing about
        arities beyond m = 3, nothing about attack cost, nothing about bond-rank laws, and nothing
        about ECDLP hardness.
      nearby_object_control: >-
        The non-composed type-(C) family, where the hoped-for conclusion is KNOWN FALSE: five random
        polynomials with matched per-variable degrees that arise from no composition must yield
        relation_dim_deg4 = 0. A detector that fires there has not identified the load-bearing
        structure and voids the comparison in both directions.
    proof_obligations:
      - claim: The 27-zero mask agrees across all 9 committed cells.
        responsibility: correctness
      - claim: The universal index set is exactly {4, 9, 16, 35} with values 1, -1/4, 1/8, -1/64.
        responsibility: correctness
      - claim: relation_dim_deg2 and relation_dim_deg3 over Q(a,b) are both 0.
        responsibility: size
      - claim: relation_dim_deg4 over Q(a,b) is exactly 1.
        responsibility: size
      - claim: The symmetric (2,2,2) surrogate reproduces dimension 1 and the mask.
        responsibility: strictness
      - claim: The type-(C) non-composed control produces no relation.
        responsibility: baseline
      - claim: Toy tier, p at most 2^10 for the certified cells and 10007 for the ablation arm.
        responsibility: scope
    not_applicable_reason: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The bi-quadratic structure of a 4x4 Sylvester determinant in two coefficient triples, which
        is what makes the a-map factor through a pair of quadratic Veronese maps.
      citation: >-
        experiments/EXP-TTN-002/ttn2_bond_rank_cert.sage, functions s3_coeffs, sylv_mat, S4Xcoeffs
      provenance: internal
      verified_by: >-
        Source proposal IDEA-20260725-006, which cites the pinned line ranges; the executor must
        re-read the pinned code rather than inherit the line numbers.
      role: support-mask determination
    - description: >-
        Classical binary-quartic covariant theory, as the competing explanation M5 for the four
        dyadic entries after binomial rescaling.
      citation: >-
        Standard classical invariant theory of the binary quartic; no specific source is asserted
        by this program.
      provenance: recalled
      verified_by: null
      role: competing explanation, tested by symbolic identity rather than cited as support
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: mask_agreement
      direction: higher
      minimum_effect: >-
        9 of 9 committed cells share the identical 27-position zero mask. At most 8 falsifies
        support universality.
    - metric: universal_entry_index_set
      direction: different
      minimum_effect: >-
        Exactly {4, 9, 16, 35} with values 1, -1/4, 1/8, -1/64. A different index set, or a fifth
        universal index, falsifies the stated shape.
    - metric: relation_dim_deg4_over_Q_ab
      direction: different
      minimum_effect: >-
        Exactly 1. A value of 0 means the sampled relation is an evaluation artifact; a value of at
        least 2 means factor span 69 understated the relation count.
    - metric: surrogate_relation_dim_deg4_symmetric
      direction: different
      minimum_effect: >-
        Exactly 1 in at least 9 of 10 samples, against 0 in at least 9 of 10 degree-matched
        non-composed type-(C) controls.
    - metric: surrogate_mask_match_fraction_symmetric
      direction: higher
      minimum_effect: >-
        At least 0.9 selects M1. At most 0.1 with dimension 1 selects the reading that the
        dimension is compositional while the shape is S_3-specific, which falsifies Part B as
        stated.
  test_boundary:
    instances:
      - >-
        The 9 committed cells of experiments/EXP-TTN-002/runs/RUN-TTN-002-c/raw.json at
        p in {101, 431, 1009}
      - >-
        Symbolic S_4 over Q(a,b)[x1,x2,x3] built with the pinned formal-degree convention
      - >-
        Four surrogate families A (fully-symmetric (2,2,2)), A-prime (symmetric bidegree-(2,2)
        triples), B (generic non-symmetric (2,2,2)), C (non-composed degree-matched controls)
    parameters:
      primes_committed: [101, 431, 1009]
      primes_ablation: [101, 10007]
      samples_per_surrogate_family_per_prime: 10
      point_streams_per_sample: [96, 128]
      monomial_products: {degree_2: 15, degree_3: 35, degree_4: 70}
      symbolic_hard_kill_seconds: 900
    implementation: >-
      Sage only, reusing S4Xcoeffs, monomial_products and kernel_witness from
      experiments/EXP-TTN-002/ttn2_bond_rank_cert.sage verbatim with s3_coeffs swapped per
      surrogate family. Formal-degree padding applied at every nesting level.
    budget:
      wall_clock_seconds: 7200
      cpu_hours: 6.0
      maximum_memory_gb: 4
      maximum_runs: 20
  falsification_conditions:
    - >-
      mask_agreement below 9 of 9. Support universality is FALSE and the syzygy is
      instance-dependent in shape as well as in coefficients.
    - >-
      universal_entry_index_set differs from {4, 9, 16, 35}, or the values are not 1, -1/4, 1/8,
      -1/64, in any of the four not-yet-checked cells. The dyadic sub-vector claim is FALSE and M5
      is void.
    - >-
      relation_dim_deg2 or relation_dim_deg3 over Q(a,b) is nonzero. The reading of factor span 69
      as one irreducible quartic relation is wrong.
    - >-
      relation_dim_deg4 over Q(a,b) is 0. The recorded phenomenon is an evaluation artifact.
    - >-
      The fully-symmetric (2,2,2) surrogate gives relation_dim_deg4 = 0 in at least 9 of 10
      samples. PART B IS FALSIFIED and M2 (Semaev/elliptic-specific) is promoted.
    - >-
      The type-(C) non-composed control gives relation_dim_deg4 at least 1 in at least 2 of 10
      samples. The apparatus manufactures relations and the whole ablation comparison is VOID in
      both directions.
    - >-
      NOT a falsification, and recorded so it cannot be misread as one: a symbolic timeout, a
      rational-reconstruction height failure, or a Sage kill. Each is infrastructure under AGENTS.md
      rule 5 and forces the inconclusive branch.
  distinguishable_outcomes:
    M1_composition_class: >-
      The symmetric (2,2,2) surrogate returns dimension 1 WITH the 27-zero mask in at least 9 of 10
      samples and the type-(C) control returns 0. MEANING: the universal shape is a property of the
      (2,2)-resultant composition; Part B is supported at the tested scope, and nothing about
      elliptic curves is load-bearing in it.
    M2_semaev_specific: >-
      The symmetric surrogate returns dimension 0 in at least 9 of 10 samples. MEANING: Part B is
      FALSIFIED; the relation is specific to S_3 and the open sub-question becomes which feature of
      S_3 produces it.
    M1b_dimension_compositional_shape_specific: >-
      The symmetric surrogate returns dimension 1 but with a DIFFERENT mask in at least 9 of 10
      samples. MEANING: the relation DIMENSION is compositional while the SHAPE is S_3-specific.
      Part B as stated is falsified and the sharper question is which feature of S_3 fixes the mask.
    M3_newton_polytope: >-
      The generic non-symmetric (2,2,2) surrogate ALSO reproduces the mask at fraction at least 0.9
      while the symmetric arm does. MEANING: the Newton polytope, not the symmetry, is operative.
    M4_detector_artifact: >-
      The non-composed type-(C) control produces relations in at least 2 of 10 samples. MEANING:
      the apparatus manufactures relations; NO conclusion may be drawn in either direction and the
      run is invalid for the comparison it was built to make.
    M5_classical_covariant: >-
      The symbolic identity check confirms that the universal sub-vector equals
      a_0^3 a_4 - (2 a_1^2 - 3 a_0 a_2)^2 after binomial rescaling. MEANING: a classical
      binary-quartic covariant origin is live. M1 and M5 are NOT mutually exclusive; if both fire,
      the record must state that the two explanations are not separated rather than pick one.
    censored_infrastructure: >-
      The symbolic kernel exceeds the 900 s hard kill and the fallback ladder also fails. MEANING:
      INCONCLUSIVE. Under AGENTS.md rule 5 this may never be reported as "the syzygy is
      instance-dependent".
  interpretation_limits:
    - >-
      claim_tier toy. p at most 2^10 for the committed cells, m = 6 only, ordinary short-Weierstrass
      prime-field curves. The p = 10007 arm extends only the surrogate ablation, not the certified
      bond ranks.
    - >-
      EXP-TTN-002 is negative-theory work and H-TTN-001 is rejected_scoped. Identifying this syzygy
      changes no attack cost and no bond-rank law, and this hypothesis does not reopen H-TTN-001.
    - >-
      A composition-class syzygy is a statement about the formal resultant tower, not about the
      elliptic curve group law and not about ECDLP hardness.
    - >-
      The observation that the image lies on a single quartic hypersurface is prior internal art in
      experiments/EXP-TTN-002/analysis.md; only the shape-invariance result and the composition-class
      attribution would be new.
    - >-
      This experiment performs no solve, produces no factor-base relation, and asserts no attack-cost
      quantity. The run carries certificate kind none, which docs/claims-and-verification.md
      designates for pure measurement runs.
  prior_evidence_refs:
    - EV-TTN-002
    - DEC-20260722-002
    - experiments/EXP-TTN-002/runs/RUN-TTN-002-c/raw.json
    - experiments/EXP-TTN-002/analysis.md
  derived_from_idea: IDEA-20260725-006
  status: proposed
  added: '2026-08-25'
  proposed_by: coordinator
