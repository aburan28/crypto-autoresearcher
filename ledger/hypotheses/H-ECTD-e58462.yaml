hypothesis:
  id: H-ECTD-e58462
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  source_idea_ids:
    - IDEA-20261006-783062
  added: '2026-10-10'
  status: approved
  proposed_by: coordinator
  title: A rational degree-2 Velu edge preserves point count and changes j
  statement: >-
    Let E be y^2=x^3-2x+1. Among primes p with 5<p<256, choose the
    least for which E is nonsingular over F_p and its defining cubic
    has exactly one distinct root r in F_p. Let T=(r,0), and let E2
    be the separable degree-2 quotient by {O,T}. The prediction is
    #E2(F_p)=#E(F_p) and j(E2) differs from j(E). Exhaustive failure
    to find an eligible prime in the stated interval is a negative
    for this finite prediction.
  mechanism: >-
    A rational kernel defines a rational isogeny, so the source and
    codomain form an explicit isogeny-class control. Equal point
    counts are the established class invariant; the discriminating
    finite observation is whether this selected edge moves j. A
    coordinate translation of E is a null: its j and point count
    must remain unchanged. The test studies one edge and claims no
    secret path, endpoint weakness, or ECDLP advantage.
  assumptions:
    - >-
      Distinct cubic roots are counted in F_p, with p proven prime
      and the source discriminant checked nonzero. The first
      eligible p is selected before any codomain comparison.
    - >-
      T=(r,0) is the unique nonidentity rational 2-torsion point;
      the quotient kernel is exactly {O,T}.
    - >-
      The original source, its translated model, and the quotient
      codomain are compared over the same F_p with exact arithmetic.
  proof_search_map:
    not_applicable_reason: >-
      This is one finite control edge. It proposes no theorem about
      hidden paths, no rank or ECDLP-cost bound, and no closure of a
      direction.
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For the least p in the frozen interval satisfying the
        eligibility rule, the rational degree-2 quotient of the
        specified E by its unique nonidentity rational 2-torsion
        point has a j-invariant different from that of E.
      random_model_justification: >-
        This is a deterministic edge prediction, not a random-model
        assumption or a premise in an asymptotic algorithm. No
        cited theorem forces the chosen edge to have distinct j.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECTD-cb23c5
      falsification_condition: >-
        After the exact least eligible prime and degree-2 map are
        verified, j(E2)=j(E); exhaustive absence of an eligible p
        also defeats the source idea's finite prediction.
  structural_ingredients:
    - description: >-
        Finite-field isogenous elliptic curves have equal point
        counts; this is the class-invariant expectation for a
        verified rational degree-2 quotient.
      citation: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
      provenance: internal
      verified_by: >-
        coordinator design session 2026-10-10 opened the KR-RHO-755e35
        record and checked its stated finite-field scope
      role: independent order-equality control
  predictions:
    - metric: source_minus_codomain_order
      direction: lower
      minimum_effect: exactly zero after independent point counts
    - metric: source_codomain_j_difference_indicator
      direction: higher
      minimum_effect: exactly one at the least eligible prime
  test_boundary:
    instances:
      - E:y^2=x^3-2x+1 over the least eligible F_p with 5<p<256
      - its translated source model under X=x-r as a null
      - its quotient by the rational order-2 kernel {O,(r,0)}
    parameters:
      prime_lower_exclusive: 5
      prime_upper_exclusive: 256
      isogeny_degree: 2
      prime_selection: ascending, first eligible only
    implementation: >-
      Use exact F_p arithmetic, exhibit the kernel and explicit
      degree-2 quotient map, independently enumerate source and
      codomain point counts, and recompute j from the coefficients.
      A separate checker validates the prime choice, controls, and
      scored comparison from the archived raw result.
    budget:
      enforcement: advisory
      maximum_runs: 1
      maximum_workers: 1
  falsification_conditions:
    - >-
      At the verified selected prime, source and codomain j are
      equal; or the complete frozen interval has no eligible prime.
    - >-
      If independent counts differ despite a purported valid
      rational degree-2 map, retain the anomaly for independent
      breakthrough-tier review before interpreting a contradiction.
  interpretation_limits:
    - >-
      A positive observation establishes one small-prime edge with
      equal order and different j. It does not identify a weak
      endpoint or any private advantage.
    - >-
      Equal j on this edge says nothing about other primes, kernels,
      or isogeny paths.
    - >-
      A timeout, invalid quotient map, failed kernel check, or
      incomplete prime search is infrastructure or instrument
      failure, not a mathematical negative.
