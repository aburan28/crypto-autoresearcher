hypothesis:
  id: H-ECTD-19c623
  question_id: RQ-ECTD-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260731-016
  statement: >-
    Within a single ordinary F_p isogeny class at toy scale, the per-curve algebraic
    meters that govern point-decomposition index calculus are HEAVY-TAILED rather than
    homogeneous. Concretely, across at least five enumerated ordinary classes with
    prime subgroup order N of 40 to 56 bits and class size at least 64, at least one
    class contains a curve E_s whose Semaev decomposition probability at arity m in
    {3, 4} exceeds the class median by a factor of at least 100, or whose solving
    degree is at least 2 below the class median, while sharing the class's group order
    N exactly.
    The hypothesis is FALSE - and this is the outcome the parent proposal itself names
    as most likely - if across all five or more classes every curve lies within a
    factor-10 band of its class median on every primary meter and no solving degree is
    more than 1 below the class median. That homogeneity, at the tested scale, would
    extend H-ISO-001's short-neighbour negative to full-class scale and close the
    equation-dependent limb of the Teske-shaped trapdoor question at toy N.
    The hypothesis is UNTESTED rather than false if the planted positive control - an
    artificially easy Semaev instance placed on one curve of a class - is not recovered
    as an outlier, or if the censoring rate of the fixed solver budget exceeds the
    pre-registered bound.
  mechanism: >-
    Over F_p, the order-based weaknesses that a Teske-style construction would hide
    behind an isogeny are CLASS INVARIANTS - every curve in an F_p-isogeny class has
    the same number of points, so anything computable from the group order alone is
    constant across the class and cannot be a hidden endpoint. The only remaining place
    a hidden weak endpoint could live is in structure that depends on the curve
    EQUATION rather than on its order: the geometry of the Semaev summation ideal, the
    factor base's position relative to it, and the syzygy structure of the resulting
    Macaulay matrices.
    That structure does vary inside a class, because the curves have different
    equations. The question is whether it varies enough, and with a heavy enough tail,
    to hide a genuinely easier endpoint. The expander-mixing behaviour of horizontal
    isogeny neighbours suggests near-uniformity and therefore rarity, which is why the
    hypothesis asks for a rare extreme rather than a distributional shift, and why the
    criterion is orders of magnitude rather than a percentage.
    The measurement is a screen and not an attack. Finding an outlier meter is not
    finding a trapdoor: path-hiding and public undetectability are separate questions
    with their own records. Finding NO outlier at this scale is the more probable and
    still decision-relevant outcome, because it says where the barrier wording for this
    family should be placed.
  assumptions:
    - >-
      Ordinary F_p isogeny classes at the chosen toy sizes are fully enumerable via
      isogenies of degree ell in {2, 3, 5, 7}, and a class of size at least 64 can be
      exhibited. If enumeration is incomplete, the class median and the max-over-median
      ratio are computed over a SUBSET and the claim is scoped to that subset explicitly.
    - >-
      Every measured isogeny edge has degree coprime to N, so the discrete logarithm
      transports and every curve in the enumerated class carries a comparable instance.
    - >-
      All meters are computed under one FIXED factor-base convention and one FIXED
      solver budget, declared before any measurement. A convention that leaks curve
      equation structure into the factor base would manufacture exactly the variation
      being measured.
    - >-
      A solving-degree measurement whose Groebner computation hits the declared budget
      is a RIGHT-CENSORED observation. It is not a large solving degree and it is not a
      hardness result; it is recorded as censored and excluded from any outlier claim,
      per AGENTS.md rule 5.
    - >-
      Toy N of 40 to 56 bits only. A null at this scale is not a statement about
      crypto-scale homogeneity, and no transfer is asserted.
  proof_search_map:
    bottleneck: >-
      Whether the per-curve meter distribution inside a class has a tail at all. Every
      downstream question - path hiding, public detectability, exploitability - is moot
      if the distribution is homogeneous, so measuring the tail is the step whose result
      changes what is worth funding.
    baseline_embedding:
      parameter_slice: >-
        H-ISO-001's short-neighbour arm, which measured degree-of-regularity and yield
        on ell-neighbours only and recorded a negative. This experiment must reproduce
        that arm's meter values on the same neighbours before extending to the full
        class.
      reproduction_check: >-
        On the curves H-ISO-001 measured, the meters computed here must agree with the
        committed values within the tolerance those values were reported at. A
        disagreement means the meter definition has drifted and the full-class numbers
        are not comparable to the committed negative.
    observation_collision:
      observable: >-
        The per-curve meter vector - Semaev relation density, factor-base decomposition
        probability, solving degree or first fall, and Macaulay rank defect.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED IN PART. A low solving degree can arise from a
        genuinely easier ideal OR from a degenerate factor base, a censoring artifact,
        or a system whose multi-homogeneous degree profile happens to be favourable
        independently of the curve. The degree-profile null exists to supply that second
        preimage explicitly: random systems with the same degree profile and a planted
        solution. An outlier that does not exceed the degree-profile null is not
        attributable to the curve.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Report the full per-curve meter VECTOR and the class distribution's quantiles
          rather than a single scalar score, so a tail in one meter that is absent in
          the others is visible rather than averaged away.
        predicted_gain: >-
          Distinguishes a genuine algebraic outlier, which should move several coupled
          meters together, from a single-meter artifact.
      - transform: specialization_pack
        proposed_object: >-
          Charge the outlier's advantage as a cost ratio against matched Pollard rho and
          BSGS on the SAME N, rather than reporting the meter ratio alone.
        predicted_gain: >-
          Prevents a 100-fold meter ratio from being read as a 100-fold attack
          advantage, which it is not.
    quantifier_order: >-
      CLAIMED. THERE EXISTS at least one enumerated class and THERE EXISTS at least one
      curve in it whose meter exceeds the class median by the stated factor, with the
      class median taken over the enumerated members. NOT CLAIMED. That such a curve
      exists in every class, that it can be FOUND without enumerating the class, or that
      its existence transfers to any larger N. The existence-without-search question is
      exactly what a trapdoor would need and is untouched here.
    method_ceiling:
      strongest_certifiable_claim: >-
        On the enumerated classes at the executed sizes, under the declared factor-base
        convention and solver budget, the within-class meter distribution does or does
        not contain an outlier at the stated factor. It can never certify that a
        trapdoor exists, that an outlier is exploitable, that an outlier is publicly
        undetectable, or that homogeneity persists at cryptographic N.
      nearby_object_control: >-
        Random same-p curves OUTSIDE the class with matched N where possible and matched
        bit size otherwise. If those show the same meter spread and the same extremes as
        the class, the within-class measurement is measuring the meter's own variance
        rather than anything about the class.
    proof_obligations:
      - claim: Order-based weaknesses are class invariants over F_p, so only equation-dependent structure can vary.
        responsibility: correctness
      - claim: Measured edges have degree coprime to N, so instances transport.
        responsibility: interface
      - claim: A budget-exhausted Groebner run is censored, not a hardness measurement.
        responsibility: scope
      - claim: The planted positive control is recovered as an outlier by the screen.
        responsibility: feasibility
      - claim: The outlier's advantage exceeds the degree-profile null.
        responsibility: strictness
      - claim: Class enumeration is complete, or the claim is scoped to the enumerated subset.
        responsibility: baseline
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-ECTD-TAIL-1
      formal_statement: >-
        Conditional on the endomorphism ring and the group order N, the per-curve
        Semaev and Macaulay meters within one F_p-isogeny class behave like nearly
        exchangeable draws from a common distribution, EXCEPT on a sparse endpoint set
        whose relative density is o(1 over the square root of the class size).
      random_model_justification: >-
        Horizontal isogeny neighbours mix rapidly on each level of the volcano, which is
        the standard expander heuristic for such graphs; near-uniformity of a
        curve-equation-dependent statistic across a rapidly mixing family is the
        distributional analogue. No theorem forces meter constancy, so this is stated as
        a heuristic and is what the experiment measures rather than assumes.
      supporting_results:
        - 'knowledge/literature/KN-LIT-237, expander mixing for isogeny graphs, as this program records it.'
        - 'knowledge/literature/KN-LIT-7630, cited from the parent proposal IDEA-20260731-016.'
      validation_experiment_ids:
        - EXP-ECTD-abb8be
      falsification_condition: >-
        An empirical within-class meter CDF whose extreme exceedances are consistent
        with a fitted light-tailed null at the 1 percent level in every class, together
        with a passing planted positive control, refutes the sparse-exceptional-set part
        of the heuristic in the direction of full homogeneity. Conversely, exceedances
        far above the fitted null in more than a sparse set of curves refutes the
        near-exchangeability part.
  structural_ingredients:
    - description: >-
        The Semaev summation-polynomial construction and its use as a decomposition
        model for index calculus at fixed arity.
      citation: 'As recorded in this program via knowledge/findings/KN-FIND-007 and the ICEX lane records.'
      provenance: internal
      verified_by: >-
        The program's committed records, cited as their claims. No external source is
        opened for this record.
      role: definition of the decomposition system whose meters are measured
    - description: >-
        Expander mixing for horizontal isogeny neighbours, motivating near-uniformity
        within a class.
      citation: 'knowledge/literature/KN-LIT-237 as this program records it.'
      provenance: internal
      verified_by: 'The committed literature entry, cited as that record''s claim.'
      role: justification of the rarity, rather than absence, of an outlier
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: class_max_over_median_decomposition_probability
      direction: higher
      minimum_effect: >-
        At least 100 on at least one of at least five classes, or a class maximum
        solving degree at least 2 below the class median on at least one class. Below
        both thresholds on every class, with all controls passing, is the negative.
    - metric: planted_positive_control_recovery
      direction: higher
      minimum_effect: >-
        The planted artificially easy instance is ranked as the class extreme on the
        meter it was planted in. A failure makes the instrument VOID and no negative may
        be reported from any class.
    - metric: outlier_advantage_over_degree_profile_null
      direction: higher
      minimum_effect: >-
        Any claimed outlier's meter advantage must exceed the maximum observed on random
        systems with the same multi-homogeneous degree profile and a planted solution. An
        advantage inside the null's range is attributed to the system shape, not to the
        curve.
    - metric: out_of_class_control_spread
      direction: different
      minimum_effect: >-
        The interquartile spread of meters on random same-p curves outside the class is
        reported beside the within-class spread. If they coincide and the extremes
        coincide, the within-class measurement carries no class-specific information.
    - metric: censoring_rate
      direction: lower
      minimum_effect: >-
        At most 0.20 of solving-degree cells censored by the declared solver budget. Above
        that, the solving-degree meter is uninterpretable at this budget and its arm is
        reported as unrun rather than negative.
  test_boundary:
    instances:
      - >-
        At least five ordinary F_p isogeny classes with prime subgroup order N of 40 to
        56 bits and enumerated class size at least 64, preferring conductor structures
        with a moderate prime factor.
      - >-
        For each class, random same-p curves OUTSIDE the class with matched N where
        possible and matched bit size otherwise.
      - >-
        Random algebraic systems with the multi-homogeneous degree profile of the Semaev
        systems and a planted solution.
      - >-
        One planted artificially easy Semaev instance per class, placed on a known curve.
    parameters:
      N_bits: '40 to 56'
      class_size_minimum: '64'
      enumeration_degrees: 'ell in {2, 3, 5, 7}'
      semaev_arity: 'm = 3 and m = 4'
      factor_base_convention: fixed and declared before any measurement
      solver_budget: fixed per cell and declared before any measurement
    implementation: >-
      A new standalone driver under experiments/EXP-ECTD-abb8be/driver/ performing class
      enumeration, factor-base construction, Semaev system assembly, a bounded Groebner
      or F4-style solve, and Macaulay rank measurement, with every censored cell recorded
      as censored. Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_total: 86400
      maximum_memory_gb: 64
      maximum_runs: 60
  falsification_conditions:
    - >-
      All five or more classes are factor-10 homogeneous on every primary meter, with no
      solving degree more than 1 below its class median, and the planted positive control
      passes. NO trapdoor-endpoint signal at the tested scale; the barrier wording for
      this family is placed at 40 to 56 bits and the equation-dependent limb is closed at
      toy N.
    - >-
      The planted artificially easy instance is NOT recovered as an outlier. The
      instrument is VOID; no negative and no positive may be reported from any class.
    - >-
      A claimed outlier's advantage does not exceed the degree-profile null. The apparent
      outlier is a property of the system's degree shape rather than of the curve, and
      the claim is withdrawn.
    - >-
      The out-of-class control shows the same spread and the same extremes as the class.
      The measurement is not class-specific and no within-class conclusion is available.
    - >-
      Censoring exceeds 20 percent of solving-degree cells. That meter's arm is reported
      UNRUN at this budget, under AGENTS.md rule 5, and the remaining meters are reported
      on their own.
    - >-
      Class enumeration cannot reach size 64 in at least five classes. The scope shrinks
      to what was enumerated and the claim is restated over that subset; it is not
      reported as a full-class result.
  interpretation_limits:
    - >-
      Toy N only. A null at 56 bits does not prove crypto-scale homogeneity and no
      transfer is offered.
    - >-
      An outlier meter is NOT a trapdoor. Path hiding and public detectability are
      separate questions with separate records, and neither is addressed here.
    - >-
      Solver timeouts are censored observations and never hardness measurements, under
      AGENTS.md rule 5.
    - >-
      Small classes overstate rarity. Every max-over-median ratio is reported with its
      class size, and a ratio from a class near the size floor carries less information
      than one from a large class.
    - >-
      Nothing here is an attack and no discrete logarithm is claimed solved by any
      mechanism other than the matched rho and BSGS baselines run for comparison.
  status: proposed
  proposed_by: idea-generator
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-ECTD-001
    - IDEA-20260731-016
    - H-ISO-001
    - IDEA-20260731-008
    - KN-LIT-237
    - KN-LIT-7630
    - KN-FIND-007
  distinguishable_outcomes:
    - outcome: >-
        At least one class contains a curve whose decomposition probability exceeds the
        class median by 100 or more, or whose solving degree is at least 2 below the
        class median; the planted control passes; the outlier exceeds the degree-profile
        null; and the out-of-class control does not reproduce it.
      meaning: >-
        The heavy-tail hypothesis is SUPPORTED at the tested scale. A rare
        equation-dependent endpoint exists inside an isogeny class sharing the same N.
        This is a presence measurement only - it says the object exists at 40 to 56 bits,
        not that it is exploitable, findable without enumeration, or present at larger N.
        Path-hiding and detectability become the named successor questions.
    - outcome: >-
        Every class is factor-10 homogeneous on every primary meter, the planted control
        passes, and censoring is under 20 percent.
      meaning: >-
        The hypothesis is FALSE at the tested scale. H-ISO-001's short-neighbour negative
        extends to full-class scale, and the equation-dependent limb of the Teske-shaped
        trapdoor question is closed at toy N with a measured obstruction - the class
        max-over-median ratio and its distribution, with units and error bars, over the
        enumerated classes. Barrier wording for this family is written at that scope and
        no wider.
    - outcome: >-
        An apparent outlier appears but does not exceed the degree-profile null, or the
        out-of-class control shows the same extremes.
      meaning: >-
        INCONCLUSIVE for the curve-specific claim. The signal is attributable to the
        system's degree profile or to the meter's own variance rather than to position in
        the class, and no class-internal conclusion is available. The named next step is a
        meter definition that is invariant to the degree profile.
    - outcome: >-
        The planted artificially easy instance is not recovered as an outlier.
      meaning: >-
        INSTRUMENT VOID. The screen cannot see a signal it was told is there, so it
        cannot support a negative either. The run set is returned to the executor with the
        planted instance and the failing meter named; nothing about any class is reported.
    - outcome: >-
        More than 20 percent of solving-degree cells are censored by the solver budget,
        or fewer than five classes reach size 64.
      meaning: >-
        UNRESOLVED on infrastructure and enumeration grounds under AGENTS.md rule 5. The
        censored meter's arm is reported unrun and the scope shrinks to the classes
        actually enumerated; neither is a mathematical result about homogeneity.
