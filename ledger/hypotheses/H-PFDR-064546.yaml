hypothesis:
  id: H-PFDR-064546
  question_id: RQ-ECDLP-001
  source_idea_id: IDEA-20260829-b5a2c8
  batch_id: BATCH-c64bee
  title: >-
    Within the two-term cost model at arity m = 2, prime-field Semaev index
    calculus has a free-oracle floor of Theta(N^{2/3}) time at Theta(N^{1/3})
    memory and costs Theta(N) with the achievable signed-sum sweep -- and the
    committed subexponential label of KN-FIND-f8c290 rests on ONE solve at
    p = 1009, which cannot discriminate any complexity form, so the
    load-bearing deliverable is a zero-compute derivation and a kill check, not
    a four-point ladder whose separating power must itself be computed before
    it is believed.
  statement: >-
    (A) THE ACCOUNTING. Let G have prime order N, the factor base have size B,
    D be the cost in group operations of one m-decomposition attempt against one
    target, and c_LA * B^2 be the linear-algebra charge. Using the conservation
    mean of KN-FIND-007 -- mean per-target yield binomial(B+m-1, m)/N for EVERY
    base of size B -- with the signed-multiset factor 2^m, the two-term total is
    T(B) = m! N D / (2^m B^{m-1}) + c_LA B^2, minimised at
    B* = Theta((N D)^{1/(m+1)}) with T* = Theta((N D)^{2/(m+1)}) and memory
    Theta(B*).
    (B) THE m = 2 SPECIALISATION. (B1) FREE-ORACLE FLOOR: with D = Theta(1),
    T = Omega(N^{2/3}) at memory Omega(N^{1/3}), which is Pareto-dominated by
    Pollard rho on BOTH axes. (B2) AS ACTUALLY BUILT: with the achievable sweep
    charge D = Theta(B), the first term becomes Theta(N) independent of B, so
    the optimum is B as small as the linear algebra permits and the total is
    Theta(N).
    (C) THE AUDIT TARGET, VERIFIED VERBATIM BY THIS COORDINATOR.
    KN-FIND-f8c290 states that the Semaev m = 2 index calculus complexity
    exp(c sqrt(log N log log N)) is ACHIEVABLE at toy scale on the evidence of
    one complete DLP solve at p = 1009, and concludes that the complexity of
    prime-field ECDLP via Semaev-style index calculus is
    Theta(exp(c sqrt(log N log log N))). ITS OWN HEADER RECORDS
    confidence preliminary_empirical, evidence_level toy_demonstration,
    proof_status empirical_only and proof_refs empty. This is a knowledge
    finding at the weakest committed tier, not a supported hypothesis, and this
    record proposes an AUDIT of its label and its achievability limb only. It
    takes no position on the H-PSEUDO upper-bound limb.
    (D) THE SEPARATING-POWER OBLIGATION, WHICH IS THIS RECORD ADDITION AND IS
    BLOCKING. IDEA-20260829-b5a2c8 pre-registers that the measured ratio
    ops/N stays inside a factor 4 across p = 2^10..2^16, and that the competing
    subexponential reading requires ops/N to FALL by at least 3.8x over the same
    range. THAT SEPARATION IS NOT A PROPERTY OF THE LADDER, IT IS A FUNCTION OF
    THE UNFIXED CONSTANT c. Computing it: sqrt(ln N ln ln N) is about 3.66 at
    N = 2^10 and about 5.17 at N = 2^16, so L(2^16)/L(2^10) = exp(1.51 c) while
    N grows by 64. The subexponential prediction for ops/N therefore falls by
    64/exp(1.51 c), which is a fall of at least 3.8x only when c is at most
    about 1.87, and for c around 2.5 the fall is only about 1.5x -- INSIDE the
    factor-4 band the power-law reading also occupies. WITH c FREE THE
    PRE-REGISTERED DISCRIMINATOR CANNOT FIRE. This record therefore requires c
    to be PINNED, before any cell runs, by calibrating the L-form at the single
    committed cell KN-FIND-f8c290 actually rests on (p = 1009), making the
    L-curve parameter-free at every larger p; and it requires the resulting
    predicted separation to be COMPUTED and compared against the measured seed
    spread. If the computed separation is below 2x, the ladder is declared
    UNDERPOWERED in the contract before it runs and the measurement is reported
    as an achievability and constant check only.
    (E) THE LOAD-BEARING DELIVERABLE IS THEREFORE ZERO-COMPUTE. It is the
    stationarity derivation, the extension-field kill check, and the
    smoothness-parameter search: the m = 2 construction contains no smoothness
    parameter, no size order on group elements and no multiplicative hierarchy,
    and its success probability is the ALGEBRAIC mean, a fixed power of B. A
    fixed power cannot produce a subexponential balance. The single cheapest
    falsifier of this record costs nothing: NAME the quantity in the m = 2
    construction whose smoothness probability produces the L-form.
    (F) NOT CLAIMED. Not an ECDLP hardness result, not a lower bound on any
    algorithm outside the two-term family, and nothing about m >= 4 where
    (N D)^{2/(m+1)} first drops below N^{1/2}. This record may never be quoted
    as closing point-decomposition index calculus.
  mechanism: >-
    THE TRACKED OBJECT is the two-term cost functional T(B) and the pair
    (time exponent, memory exponent) it projects to. It discards the curve, the
    field, the factor-base geometry, the monomial order and the solver, keeping
    two rational numbers. It is lossy COMPATIBLY because the discarded families
    cannot re-enter: KN-FIND-007 makes the relation charge geometry-invariant by
    an exact double count rather than by assumption, and the linear-algebra
    charge is a function of B alone.
    WHY THE INTERNAL CONTRADICTION IS DECIDABLE AND WHY IT MUST BE DECIDED
    AGAINST A SIBLING IN THIS SAME BATCH. H-PFDR-cb9606 (source idea
    IDEA-20260830-f2e5b7, same dispatch batch) asserts that (B2) mis-credits the
    sweep: every residual that misses the factor base is a partial relation, and
    keeping them gives alpha(beta) = max((1+beta)/2, lambda beta), reaching
    N^{2/3} with the achievable oracle and falling below it for beta < 1/3, which
    would falsify (B1) as a floor. THE TWO RECORDS DISAGREE ABOUT A NUMBER, NOT
    ABOUT A JUDGEMENT, and the disagreement is decidable only if both are
    measured under ONE frozen operation-counting convention on ONE frozen
    instance set. That shared convention is a blocking precondition of both
    contracts and is declared in each.
    WHERE THE ARGUMENT STOPS. It stops at m >= 4. It stops at any linear-algebra
    exponent below 1, which is below the rank floor and therefore not reachable.
    It stops outside the two-term family entirely: the model is known by its own
    authors not to be tight, and "dominated within the stated cost model" is not
    domination in fact.
  assumptions:
    - >-
      The group is of prime order N, the factor base consists of points with
      distinct x-coordinates, and the target is uniform in the group via the
      rerandomisation R = [a]P + [b]Q, which is exact at prime order.
    - >-
      The linear-algebra charge is c_LA * B^2. The conclusion is stated
      PARAMETERISED in the linear-algebra exponent: at m = 2 the free-oracle
      floor moves from N^{2/3} to N^{3/5} at exponent 3/2, which is still above
      N^{1/2}, so the m = 2 conclusion survives every exponent in [3/2, 2].
    - >-
      Relations needed is taken as B. The coupon-collector factor is omitted; it
      multiplies the first term, so its omission is UNfavourable to this record
      negative conclusion, which is the safe direction. No positive reading may
      be taken from this record for that reason.
    - >-
      [scope correction] RQ-ECDLP-001 declares bit_sizes [8, 10, 12] and a
      toy-scale constraint of at most 32 field bits. The source idea ladder
      p in {2^10, 2^12, 2^14, 2^16} exceeds the declared bit sizes while staying
      inside the constraint. Cells above 12 bits are therefore run and reported
      as OUT-OF-DECLARED-SCOPE CALIBRATION, labelled as such on every row, and
      never as measurements of the question declared scope.
    - >-
      [reproduction band correction] KN-FIND-8f2c90 reports yield retention
      gamma of about 0.86 at p = 1009 and about 0.75 at p = 4001, and states the
      net speedup 2*gamma as 1.5-1.7x. 2 * 0.86 = 1.72 lies OUTSIDE the interval
      [1.5, 1.7] that IDEA-20260829-b5a2c8 asks the reproduction check to land
      in. The reproduction band is therefore set here to [1.45, 1.75], which
      contains both endpoints implied by the record own gamma values. A
      reproduction check that fails on the source record own numbers would have
      halted the line for a rounding convention.
  proof_search_map:
    bottleneck: >-
      The per-trial decomposition cost D. It is the only free quantity in the
      two-term model at fixed m, and the entire value of the summation-polynomial
      route is the claim that algebra makes D smaller than enumeration. The exact
      step whose removal changes the theorem is "compute one m-decomposition of
      one target over the factor base".
    baseline_embedding:
      parameter_slice: >-
        m = 2, D = Theta(B), c_LA * B^2. This slice must reproduce
        KN-FIND-8f2c90 committed total-check-operation formula 2RN/B exactly,
        symbol for symbol, with R = B giving Theta(N).
      reproduction_check: >-
        Symbolic identity check plus a frozen regression fixture at
        KN-FIND-8f2c90 own cells (p = 1009 and p = 4001 with gamma 0.86 and
        0.75), requiring the recomputed speedup 2*gamma to land in [1.45, 1.75].
        A mismatch means the counting convention differs and everything
        downstream is void.
    observation_collision:
      observable: >-
        The pair (measured total group operations, N) for a complete m = 2
        solve.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED AT ONE POINT, which is exactly the
        indictment. At the single committed cell p = 1009 the power law Theta(N)
        and the subexponential L(1/2, c) can be made to agree to any accuracy by
        choosing c; a single cell is a collision of the observable across the two
        competing conclusions. THE SECOND COLLISION, ADDED HERE, IS THE ONE THAT
        MATTERS: after c is pinned at that cell, the two curves may STILL
        collide across the whole feasible ladder, and whether they do is a
        computation to be performed before the ladder is run, not a hope.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "how expensive is prime-field S_3 index calculus" out of the
          solver and into a two-term cost functional whose first term is an
          exact double count and whose second is a rank floor, so the question
          becomes one stationarity computation in B.
        predicted_gain: >-
          Converts an open empirical scaling question into an exponent identity
          decided with zero compute at m = 2. NO ATTACK EXPONENT IS MOVED IN
          EITHER DIRECTION.
      - transform: boundary_lift
        proposed_object: >-
          Set D = Theta(1), an oracle better than any known or conjectured
          algebraic solve, and re-run the stationarity. The resulting N^{2/3}
          bounds the whole family from inside.
        predicted_gain: >-
          A negative conclusion robust to every future improvement of the S_3
          solve, which a measurement of the current solver could never deliver.
    quantifier_order: >-
      CLAIMED: FOR ALL prime N, FOR ALL factor-base sizes B in [1, N], FOR ALL
      per-trial decomposition costs D >= 1, FOR ALL factor-base geometries of
      size B, the two-term total satisfies T >= c N^{2/3} for an absolute
      constant depending only on c_LA. The FOR ALL over geometry is DELIVERED by
      the conservation identity rather than assumed, which is the one place a
      weaker "there exists a geometry" reading would gut the claim.
      NOT CLAIMED: FOR ALL algorithms. This bounds the two-term
      point-decomposition family only, at m = 2, and says nothing about any
      algorithm outside it -- including the partial-relation family of
      H-PFDR-cb9606, which lies outside the stated crediting rule and is the
      reason the two records are dispatched together.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within the two-term cost model, for point-decomposition index calculus
        at arity m = 2 over a prime-order group, no factor-base size and no
        decomposition cost D >= 1 gives a total below Theta(N^{2/3}), hence none
        reaches Pollard rho." Any summary dropping "within the two-term model"
        or "at m = 2" is overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        THE EXTENSION-FIELD GATE, blocking and run first. Re-run the identical
        accounting over F_{q^n} with the subfield factor base B = q, m = n. It
        must NOT return "worse than rho at every n", because index calculus
        demonstrably works there. An accounting that produces a no-go in the
        setting where the method works is wrong, not conclusive.
    proof_obligations:
      - claim: 'The two-term model reproduces the committed 2RN/B charge.'
        responsibility: baseline
      - claim: 'The stationarity gives B* = ((m-1) m! N D / (2 c_LA))^{1/(m+1)}.'
        responsibility: correctness
      - claim: 'T* = Theta((N D)^{2/(m+1)}), which at m = 2 is Theta((N D)^{2/3}).'
        responsibility: size
      - claim: 'Substituting D = Theta(B) at m = 2 removes B from the first term.'
        responsibility: correctness
      - claim: 'The extension-field instantiation does NOT return a no-go.'
        responsibility: scope
      - claim: >-
          The separating power of the ladder is COMPUTED at the c pinned from
          p = 1009 and compared against the measured seed spread BEFORE any cell
          is interpreted.
        responsibility: strictness
      - claim: >-
          No smoothness parameter exists in the m = 2 construction, so no
          L(1/2, c) balance can be formed; the search is enumerated rather than
          asserted.
        responsibility: strictness
      - claim: >-
          The curve-free null -- the same accounting and the same measurement
          pipeline on an abstract prime-order group with a synthetic oracle of
          matched yield -- is run, and any Theta(N) reading it reproduces is a
          statement about the accounting and not about elliptic curves.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: >-
    R_j = [a_j]P + [b_j]Q. At prime order the map (a, b) -> [a]P + [b]Q is a
    surjective homomorphism with uniform fibres, so uniformity of the target is
    exact rather than heuristic. What is heuristic is independence ACROSS trials
    at a fixed factor base, since successive targets share one base; that is
    HEUR-002 and it is measured, not assumed.
  asymptotic_claim:
    problem: 'prime-field ECDLP by two-term point-decomposition index calculus at arity m = 2'
    prior_best: 'Pollard rho at 0.886 sqrt(N) group operations with O(1) memory'
    time_exponent: >-
      2/3 with a free decomposition oracle and 1 with the achievable signed-sum
      sweep. THIS IS A FLOOR IN THE UNFAVOURABLE DIRECTION, not an improvement;
      no exponent is claimed as an advance.
    memory_exponent: '1/3 at the free-oracle optimum, being Theta(B*)'
    hidden_cofactor: >-
      The omitted coupon-collector factor on relations needed; the unpinned
      constants c_LA and c_rho; and the whole of "within the two-term model",
      which its own authors record as not tight.
    claim_kind: exponent_improvement
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        DECOMPOSITION-COUNT DISTRIBUTION. For a factor base V of size B drawn
        from the x-coordinates of E(F_p) and a target R uniform in the group,
        the number of m = 2 decompositions of R over V is distributed as
        Binomial(2B, 2B/|X|) up to o(1), where X is the set of x-coordinates of
        rational points and |X| = (p - t - r)/2. The mean is
        2^2 binomial(B+1, 2)/N up to a term of order B sqrt(p)/p, and the trial
        count is concentrated within a constant factor.
      random_model_justification: >-
        The MEAN is not a heuristic: it is the exact double count of
        KN-FIND-007, verified by this coordinator verbatim, which holds for every
        base of every geometry with measured maximum absolute deviation exactly 0
        over 144 cells. What is assumed is only that the 2B algebraically
        determined candidate values behave like uniform draws from X with respect
        to membership in V -- the classical independent-uniform imitation, the
        same move by which the Gaudry-Diem decomposition probability is obtained
        and which KN-FIND-007 records as being exactly this conservation mean.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            Mean per-target decomposition yield equals binomial(B+m-1, m)/N
            exactly for every base of size B, measured maximum absolute
            deviation exactly 0 over 144 cells; coverage bounded by
            min(1, mean); and the explicit statement that the identity says
            nothing about the cost of FINDING a decomposition or about the
            linear-algebra stage, which is where the index-calculus cost
            actually sits.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-2524f4
      falsification_condition: >-
        Measured mean yield per target differs from 2^m binomial(B+m-1, m)/N by
        more than the sampling error at any cell. The harvester is not sampling
        targets uniformly and every operation count from that cell is void.
    - id: HEUR-002
      formal_statement: >-
        TRIAL INDEPENDENCE. At a fixed factor base, successive rerandomised
        targets behave independently for the purpose of the trial-count
        accounting, so trials-to-first-relation is Geometric with the
        conservation mean and a failed trial carries nothing over.
      random_model_justification: >-
        Uniformity of each target is exact at prime order. INDEPENDENCE across
        trials is not: successive targets share one factor base, so the events
        are dependent, and the classical statement imitated is the independent
        geometric waiting time. The gap is measured directly rather than
        assumed.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-2524f4
      falsification_condition: >-
        Over-dispersion beyond a factor 2 in the variance of the total trial
        count against the independent prediction. The shared factor base induces
        correlation strong enough to move the constant and it must be reported
        with every operation count.
    - id: HEUR-003
      formal_statement: >-
        LADDER IDENTIFIABILITY. With the subexponential constant c pinned by
        calibration at p = 1009, the predicted ratio between the power-law and
        subexponential readings of ops/N across the feasible ladder exceeds the
        measured seed spread by at least a factor 2.
      random_model_justification: >-
        No rigorous ingredient; this is a claim about the resolving power of a
        four-point ladder and it is decided by arithmetic on the two closed
        forms once c is pinned. It is numbered because its failure makes the
        ladder uninformative rather than negative, and a ladder reported as a
        negative when it could not have produced a positive is the exact failure
        mode this record exists to avoid.
      supporting_results:
        - ref: KN-FIND-f8c290
          provenance: internal
          claim: >-
            The subexponential label, its basis in one complete solve at
            p = 1009, and its own header fields confidence
            preliminary_empirical, evidence_level toy_demonstration,
            proof_status empirical_only, proof_refs empty.
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-2524f4
      falsification_condition: >-
        The computed separation is below a factor 2. The ladder is declared
        UNDERPOWERED in the contract before it runs, and the measurement is
        reported as an achievability and constant check with no complexity-form
        conclusion drawn from it in either direction.
  structural_ingredients:
    - description: >-
        The conservation double count fixing mean per-target decomposition yield
        for every factor base of a given size.
      citation: KN-FIND-007
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: makes the relation charge geometry-invariant by a double count
    - description: >-
        The committed m = 2 per-trial charge, total check operations 2RN/B, and
        the 1.5-1.7x BKK constant explicitly labelled not exponent-moving.
      citation: KN-FIND-8f2c90
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: the baseline reproduction target
    - description: >-
        The committed subexponential complexity label under audit, with its
        single supporting solve at p = 1009.
      citation: KN-FIND-f8c290
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
      role: the label whose identifiability this record tests
    - description: >-
        A published complexity-bounds analysis of Semaev naive index calculus
        which, if the recalled summary is accurate, may already subsume the
        mathematical content of part (B).
      citation: >-
        Kudo, Yokoyama et al., Complexity bounds on Semaev naive index calculus
        method for ECDLP, J. Math. Cryptol., DOI 10.1515/jmc-2019-0029; and
        eprint.iacr.org/2017/609
      provenance: recalled
      verified_by: null
      role: >-
        possible prior art for part (B). NOT OPENED by any agent in this
        program: the source idea records HTTP 405 from the publisher and an
        unparseable PDF. A referee should chase this first.
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. The core statement is a cost floor for one
      algorithm family at one arity under one model, plus an audit of one
      committed complexity label.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- the extension-field nearby-object gate: the identical accounting
        instantiated at N = q^n, B = q, m = n. UNITS: categorical
      direction: different
      minimum_effect: >-
        FORCED: must NOT return "worse than rho at every n". If it does, the
        accounting is wrong and NOTHING in this record may be reported. Runs
        first, blocking, zero compute.
    - metric: >-
        P2 -- baseline reproduction of the committed 2RN/B charge and the
        recomputed 2*gamma at the committed gamma values. UNITS: dimensionless
      direction: different
      minimum_effect: >-
        Symbolic identity exact, and 2*gamma in [1.45, 1.75] at both committed
        cells. The band is widened from the source idea [1.5, 1.7] because
        2 * 0.86 = 1.72 lies outside it.
    - metric: >-
        P3 -- symbolic value of the two-term optimum at m = 2 with D = 1.
        UNITS: exponent
      direction: different
      minimum_effect: >-
        FORCED EXACT: 2/3 for time and 1/3 for memory, verified numerically to
        1e-12 at m = 2..12 against the closed form. Any deviation is an algebra
        error and halts the record.
    - metric: >-
        P4 -- the COMPUTED separating power of the ladder: the predicted ratio
        between the Theta(N) and L(1/2, c) readings of ops/N across
        p = 2^10..2^16 at the c pinned by calibration at p = 1009, divided by
        the measured seed spread. UNITS: dimensionless ratio
      direction: different
      minimum_effect: >-
        BLOCKING AND COMPUTED BEFORE INTERPRETATION. At least 2. Below 2 the
        ladder is UNDERPOWERED and no complexity-form conclusion is drawn from
        it in either direction. This prediction exists because the source idea
        factor-4 band is not a property of the ladder: at c around 2.5 the
        subexponential reading falls only about 1.5x across the same range and
        sits inside the band the power-law reading occupies.
    - metric: >-
        P5 -- measured ops/N at p in {2^10, 2^12, 2^14, 2^16}, 5 seeds each.
        UNITS: dimensionless (group operations per group element)
      direction: different
      minimum_effect: >-
        Interpreted ONLY if P4 passes. Then: flat within the computed
        identifiability band supports the Theta(N) reading; a monotone fall
        matching the pinned L-curve supports KN-FIND-f8c290. Cells above 12 bits
        are labelled OUT-OF-DECLARED-SCOPE CALIBRATION on every row.
    - metric: >-
        P6 -- measured relation-collection operations as a function of B at
        fixed p, over at least a 16x range of B. UNITS: group operations
      direction: different
      minimum_effect: >-
        PREDICTED FLAT IN B to within a factor 2 under the D = Theta(B) sweep
        charge. A measured relation-collection cost that FALLS with B by more
        than a factor 2 over that range falsifies the sweep charge and with it
        part (B2). NOTE: this is the same measurement H-PFDR-cb9606 predicts
        will RISE as sqrt(B) on its own arm, and the two predictions are
        deliberately made on one instance set under one convention.
    - metric: >-
        P7 -- existence of a named smoothness parameter in the m = 2
        construction whose probability could produce an L(1/2, c) balance.
        UNITS: categorical, with the enumerated search attached
      direction: different
      minimum_effect: >-
        PREDICTED: none exists. Exhibiting one is a complete falsification of
        this record and a repair rather than a contradiction of KN-FIND-f8c290,
        and it is the cheapest outcome in the whole design.
    - metric: >-
        P8 -- the CURVE-FREE NULL: the identical measurement pipeline on an
        abstract prime-order group with a synthetic decomposition oracle of
        matched yield and matched per-trial charge. UNITS: dimensionless
      direction: different
      minimum_effect: >-
        MEASURED AND REPORTED beside every curve arm, with no predicted value.
        BLOCKING FOR ATTRIBUTION: the Theta(N) reading is a consequence of the
        crediting rule and the conservation mean, both of which are
        group-theoretic. If the curve-free null reproduces it, the finding is
        about the two-term accounting and NOT about elliptic curves, and no
        artifact may describe it as a statement about the ECDLP.
    - metric: >-
        P9 -- matched Pollard rho group operations on the identical instances
        under the identical frozen convention. UNITS: group operations
      direction: different
      minimum_effect: >-
        FORCED to land at 0.886 sqrt(N) within the seed spread. A comparison
        whose baseline arm does not reproduce the textbook constant is not
        measuring a ratio and blocks the report.
  test_boundary:
    instances:
      - 'generic prime-field short-Weierstrass curves of prime order, 12 generated curves'
      - 'an abstract prime-order group with a synthetic matched-yield oracle (CURVE-FREE null)'
      - 'the extension-field instantiation N = q^n, B = q, m = n (symbolic only)'
    parameters:
      p: '{2^10, 2^12, 2^14, 2^16}; cells above 12 bits labelled out-of-declared-scope calibration'
      B: 'swept over at least a 16x range at each p'
      seeds: '5 per cell'
      m: '2 for the measurement; 2..12 for the symbolic exponent table'
      D_models: '{1, B, B^{ceil(m/2)}} for the symbolic table'
      yield_screen: 'cells with mean yield outside [0.1, 2] excluded BEFORE the run'
    implementation: >-
      Pure Python, complete m = 2 index-calculus solve: relation collection by
      the signed-sum sweep, Gaussian elimination mod N, target recovery. GROUP
      OPERATIONS are the metric, never wall clock. Every recovered logarithm
      carries a certificate re-verified independently of the solver. No Macaulay
      matrix and no Groebner basis is built; the largest object is a hash set of
      at most 256 field elements and a B by B matrix over Z/N.
