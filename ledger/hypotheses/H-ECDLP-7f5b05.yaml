  statement: >
    Fix E: y^2 = x^3 - x over F_11 before
    any fibre is read. Stage 0 asserts
    only the C1 double-count identity of
    IDEA-20260905-d0fee4 on this family:
    summing rational fibre sizes of a
    non-constant F_p-rational coordinate
    f: E -> P^1 over P^1(F_p) equals
    #E(F_p). (i) REAL enumerates affine
    points plus O; both the x-partition
    and the y-partition sum to 12;
    (ii) KF is the adaptive window W={0}
    for f=y, whose fibre has size 3, so
    |F_W|/|W| = 3 and not 1; (iii) NULL
    is a constant map and is rejected;
    (iv) p=0 or the singular cubic
    y^2=x^3 is rejected before a census
    is read. This is not a window factor
    base, not S_3^y, not an (L, b) meter,
    not C2, and not Stage 1. The identity
    is not a decoder or an ECDLP
    advantage.
  mechanism: >
    Every F_p-point of E maps to exactly
    one value in P^1(F_p) under a
    well-defined coordinate, including
    O at infinity. Partitioning the
    finite set E(F_p) by that value is
    a double count. Average fibre size
    is therefore #E(F_p)/(p+1) for every
    degree. An adaptive window that
    keeps only full y-fibres of size 3
    is the known-false object for
    "every window has ratio 1". A
    constant map is not a coordinate of
    degree n >= 2 and is rejected.
    Stage 0 evaluates that instrument
    on one frozen family. This is a new
    RQ-ECDLP-002 object after Stage 0
    of EXP-ECDLP-b3f975 held as P-S0-BOX
    (DEC-20260908-546f37). It is not
    Stage 1 of EXP-ECDLP-b3f975 and not
    a p~2^12 window census.
  predictions:
    - id: P-S0-C1
      metric: well-defined exact C1 fibre-partition identity on the frozen family
      direction: different
      minimum_effect: >
        After fixture_pass, REAL x- and
        y-partitions both sum to #E.
        KF adaptive y-window has ratio 3.
        NULL constant map is rejected.
        Zero p and the singular cubic
        are rejected. One certified miss
        after fixture_pass is a scoped
        falsification of this instrument
        on the frozen family.
      claim_tier: observational
    - id: P-S1-WINDOW
      metric: random-window size ratio or S_3^y degree
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here. Stage 0
        does not sample windows, does not
        form S_m^f, and does not run an
        (L, b) meter.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFADAPT
      statement: >
        After fixture_pass, KF reports
        ratio 1. An encoding bug is
        failed_infrastructure.
    - id: F-S0-REALC1
      statement: >
        After fixture_pass, REAL x- or
        y-partition fails to sum to #E.
        That falsifies only P-S0-C1 on
        this family.
    - id: F-S1-WINDOW
      statement: >
        After an authorized later stage, a
        claimed random-window ratio for y
        sits materially above 1. Unauthorized
        here.
  test_boundary:
    instances:
      - frozen Stage 0 REAL / KF / NULL panel
    parameters:
      curve: {p: 11, A: -1, B: 0}
      real: {must_count: 12}
      known_false: {f: y, W: [0], must_ratio: 3}
      matched_null: {kind: constant}
      stage0_only_at_specify: true
    implementation: EXP-ECDLP-089e80 Stage 0 runner
    budget:
      wall_clock_seconds: 120
    prose: >
      Toy scale. Stage 0 is exact fibre
      partition on one frozen (p, A, B)
      Weierstrass model. It is not a
      window factor base, not S_3^y, not
      an (L, b) meter, not Stage 1 of
      EXP-ECDLP-b3f975, not Stage 1 of
      EXP-ECDLP-daf1bb, not Stage 1 of
      EXP-ECDLP-0d1336, not Stage 1 of
      EXP-ECDLP-1aa0f8, not Stage 1 of
      EXP-ECDLP-79f8c4, not Stage 1 of
      EXP-ECDLP-628891, not Stage 1 of
      EXP-ECDLP-9e9536, not Stage 1 of
      EXP-ECDLP-90f602, and not Stage 2
      of EXP-ECDLP-4be480. No
      cryptographic transfer. Do not hunt
      a new curve after this freeze.
  assumptions:
    - id: A1
      statement: >
        The KF adaptive window W={0} for
        f=y on this curve has fibre size
        3. An argument that assigns every
        window ratio 1 proves too much.
      status: explicit
    - id: A2
      statement: >
        A constant map is not a coordinate
        of degree n >= 2.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06
        covers protocol approval once the
        contract is complete.
      status: explicit
    - id: A4
      statement: >
        The frozen model has j=1728. C1 is
        a double count and is claimed on
        this model. Generic-j, prime-order,
        p~2^12, and C2 are Stage 1+ and
        are not this instrument.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether a degree-n coordinate window
      buys n B points. Stage 0 only checks
      that the C1 partition identity is
      well-defined on the frozen model,
      and that an adaptive full-fibre
      window is visible as ratio n.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: one frozen
        (p, A, B) at p=11, C1 identity
        arm only, not the proposal's
        p~2^12 window census, S_3^y
        distinct-value count, (L, b)
        meter, or C2 degree bound.
      reproduction_check: >
        REAL x- and y-partitions both sum
        to 12. KF adaptive y-window ratio
        3. NULL constant map rejected.
    observation_collision:
      observable: >
        Sum of rational fibre sizes versus
        |F_W|/|W| on an adaptive full-fibre
        window.
      distinct_preimage_search: >
        Hold the curve and change f from
        x-partition to y-partition. Hold
        f=y and change W from all of P^1
        to {0}.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact C1 partition.
        predicted_gain: >
          Exact known-false adaptive
          full-fibre ratio on KF. Zero
          claimed attack improvement.
    quantifier_order: >
      Freeze the model before reading
      fibres. Existential double count
      on REAL does not imply a random-
      window law and does not imply C2.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the declared
        finite family. Never a window-base
        result. Never an ECDLP exponent.
      nearby_object_control: >
        KF is the known-false object. An
        argument that still assigns it
        ratio 1 is wrong.
    proof_obligations:
      - claim: well-defined exact C1 partition
        responsibility: correctness
      - claim: exact REAL double count
        responsibility: baseline
      - claim: exact KF adaptive ratio 3
        responsibility: baseline
      - claim: no window census, no Stage 1 of b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
