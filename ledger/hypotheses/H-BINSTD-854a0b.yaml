  title: >-
    The Koblitz recurrence for y^2 + xy = x^3 + 1 over F_2^131 produces a
    group order N = 4l with gcd(4, l) = 1 and floor(log2(l)) = 129.
  statement: >-
    Counting points of y^2 + xy = x^3 + 1 over F_2 gives order 4 and trace
    t1 = -1. The recurrence t_n = t1*t_{n-1} - 2*t_{n-2}, started at
    t_0 = 2, t_1 = -1, yields t_131 = -22283658519494248867 and
    N = 2^131 + 1 - t_131 = 2722258935367507707729280517973639940516.
    Then N = 4l with l = 680564733841876926932320129493409985129,
    gcd(4, l) = 1, l.bit_length() = 130, and floor(log2(l)) = 129.
    Miller-Rabin at the frozen witnesses does not declare l composite.
    The integer 2l is not of the form 4 times an integer with the same
    certificate shape.
  mechanism: >-
    gcd(4, l) = 1 is the arithmetic hypothesis of the proposal's Sylow
    splitting. This contract recomputes the order and the gcd. It does not
    identify quotients of the elliptic-curve group and it does not read
    builder source.
