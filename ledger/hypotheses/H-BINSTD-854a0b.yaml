      reproduction_check: >-
        Two recurrences. One iterates n from 2 to 131. The other iterates
        the same relation from a reversed index accumulation that must meet
        the same t_131. Point count over F_2 is repeated by enumeration.
    observation_collision:
      observable: N, l, gcd(4, l), and the Miller-Rabin label.
      distinct_preimage_search: >-
        l from N//4 versus checking 4*l == N. The synthetic input 2l must
        fail the cofactor-4 test.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: One Koblitz order and one synthetic even integer.
        predicted_gain: A gcd. No decomposition speedup.
    quantifier_order: >-
      After the F_2 point count, the recurrence determines t_131, then N,
      then l = N/4. The predicates gcd(4, l) = 1 and floor(log2(l)) = 129
      are read off l. The synthetic integer is tested after l exists.
    method_ceiling:
      strongest_certifiable_claim: >-
        The integers and a probable-prime label. Not a theorem that every
        homomorphism quotient ignores the cofactor, and not a code-read of
        any builder.
      nearby_object_control: >-
        The integer 2l. Reporting that it equals 4 times a prime with the
        same bit length as l invalidates the run.
    proof_obligations:
      - claim: F_2 order is 4 and t_131 matches the preregistered integer.
        responsibility: baseline
      - claim: N = 4l and gcd(4, l) = 1.
        responsibility: correctness
      - claim: 2l fails the cofactor-4 predicate.
        responsibility: scope
      - claim: Primality is labeled probable, not proven.
