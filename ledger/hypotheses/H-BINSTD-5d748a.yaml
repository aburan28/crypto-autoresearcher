  title: >-
    tau(16) is 5, tau(16k) is 10 for five odd primes, and the three
    composite samples have 15, 20 and 20 divisors.
  statement: >-
    The divisors of 16 are 1, 2, 4, 8 and 16. For each prime k in
    {11, 13, 17, 19, 23}, gcd(k, 16) is 1 and the divisors of 16k are
    exactly the ten numbers j and j*k for j in that list. tau(9) is 3
    and tau(144) is 15. tau(15) is 4 and tau(240) is 20. tau(21) is 4
    and tau(336) is 20. On N = 240 the divisors with conjugate period
    16/gcd(c, 16) equal to 4 are 4, 12, 20 and 60.
  mechanism: >-
    When k is an odd prime, every divisor of 16k is either a divisor of
    16 or k times one. A composite multiplier adds further divisors, and
    two of them can share the same gcd with 16 and therefore the same
    period. This contract counts those divisors. It does not price an
    attack.
