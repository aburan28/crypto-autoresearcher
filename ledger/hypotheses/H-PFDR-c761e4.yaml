hypothesis:
  id: H-PFDR-c761e4
  question_id: RQ-ECDLP-001
  source_idea_id: IDEA-20260829-bdca13
  batch_id: BATCH-c64bee
  title: >-
    The toy S_3 Groebner instrument is not measuring a Semaev solving degree:
    because the factor-base membership polynomial is squarefree and splits
    completely, the ideal is the RADICAL vanishing ideal of a point set Z inside
    the grid V x V, so every reported Groebner observable is a function of the
    incidence pattern of Z alone -- and the decisive test is the CURVE-FREE
    NULL, a random bidegree-(2,2) system with the same grid vanishing pattern
    and no curve, no group law and no summation polynomial, which is PREDICTED
    to reproduce the observables byte for byte.
  statement: >-
    (A) THE STRUCTURE THEOREM. Let E be y^2 = f(x) = x^3 + a x + b over F_p with
    p > 3, V = {v_1..v_B} distinct x-coordinates of F_p-rational points,
    fV(x) = product over i of (x - v_i), R an affine target with x-coordinate
    xR, and s(x1, x2) = S_3(x1, x2, xR). The measured system is
    I = (s, fV(x1), fV(x2)) inside F_p[x1, x2]. Then (i) fV is squarefree and
    splits completely over F_p, so A = F_p[x1, x2]/(fV(x1), fV(x2)) is the
    product ring F_p^{V x V} of dimension B^2 by the Chinese Remainder Theorem;
    (ii) the image of s in A is the evaluation vector, so F_p[x1, x2]/I is
    F_p^{Z} with Z = {(v_i, v_j) : s(v_i, v_j) = 0}; (iii) I is therefore
    RADICAL, zero-dimensional and equal to the full vanishing ideal I(Z); and
    (iv) the reduced Groebner basis in ANY monomial order, its cardinality, its
    maximum total degree and the trivial-ideal flag are ALL determined by Z as a
    point set, with the standard-monomial count equal to |Z| exactly, and depend
    on the curve, on p and on the coefficients of S_3 ONLY through Z.
    (B) WHAT Z IS. Via the discriminant identity disc_{x2} s = 16 f(v) f(xR) and
    the totally-split property of the factor-base locus, the fibre of Z over
    each v in V is the two-element set {x(R + P_v), x(R - P_v)} intersected with
    V, degenerating to one element exactly on the branch locus
    f(v) f(xR) = 0 union {v = xR}. By the conservation identity the mean |Z| is
    about 4 B^2 / p.
    (C) THE CONSEQUENCE FOR THE QUESTION DECISION TARGET. RQ-ECDLP-001 declares
    bit_sizes [8, 10, 12], so p is at most 4096, and with a factor base of a few
    dozen elements the mean |Z| is O(1) and most often 0. The committed metric
    groebner_basis_max_degree is then not a solving-degree proxy for the Semaev
    system at all; it is a staircase statistic of a zero-or-one-point set. The
    quantity that DOES grow is deg fV = B, an artifact of the membership
    encoding forced by Bezout, not a property of the summation polynomial.
    (D) THE ATTRIBUTION TEST IS THE WHOLE OF THE DESIGN, AND IT IS A CURVE-FREE
    NULL. Part (A)(iv) says explicitly that a NON-CURVE object reproduces the
    signature: a random bidegree-(2,2) polynomial r(x1, x2), containing no
    curve, no group law and no summation polynomial, together with the same
    fV(x1), fV(x2) and chosen so its grid vanishing set equals the same Z, must
    give byte-identical reduced Groebner observables. THIS RECORD PRE-STATES
    THAT IF THE CURVE-FREE NULL REPRODUCES THE OBSERVABLES, NOTHING FROM THIS
    INSTRUMENT MAY BE QUOTED AS A STATEMENT ABOUT SUMMATION POLYNOMIALS,
    ELLIPTIC CURVES, OR THE ECDLP -- and that this is the PREDICTED outcome, so
    the null is a confirmed controlled null rather than a disappointment. Only a
    surviving DIFFERENCE between the curve system and the matched-Z null could
    be a genuine summation-polynomial signal, and it is the most valuable
    possible outcome of the design.
    (E) BOTH OUTCOMES ARE DELIVERABLES. If the predicted staircase matches, the
    instrument is closed as a Semaev meter with a named obstruction (radicality
    via CRT), an argument (i)-(iv) and forward guidance (measure the graded
    Hilbert function of a system whose quotient is NOT a product of fields, or
    measure the sweep cost instead). If it does not match, then either the
    implementation is not computing what its docstring says or the theorem is
    false, and either is worth more than a scaling study.
  mechanism: >-
    THE TRACKED OBJECT is Z, the incidence pattern of the summation
    correspondence on the grid -- which cells vanish and nothing else. It is
    genuinely lossy: from Z one cannot recover S_3, the curve, its coefficients,
    the field, or the target beyond the constraints Z imposes; a bivariate
    polynomial with explicit coefficients collapses to a subset of a B by B
    boolean matrix. The discard is COMPATIBLE with the operations of the target,
    which is the load-bearing half: the ring operations of F_p[x1, x2]/I factor
    through the CRT idempotent decomposition indexed by Z, so normal-form
    reduction, S-polynomial reduction and the whole Groebner computation act
    coordinatewise on F_p^{Z} and are determined by Z.
    WHY THE THEOREM IS FORCED RATHER THAN PLAUSIBLE. Every step is
    finite-dimensional linear algebra over F_p. fV is squarefree because V
    consists of distinct values; it splits completely because its roots are by
    definition in F_p; so (fV(x1), fV(x2)) is the vanishing ideal of the reduced
    grid and A is a product of B^2 copies of F_p with no nilpotents anywhere.
    Adding any further polynomial to a product of fields kills a subset of
    coordinates and can do nothing else: there is no room for a non-radical
    quotient, no room for embedded components, and no room for a solving degree
    that is not a staircase statistic.
    WHERE THE ARGUMENT STOPS, AND WHY THAT BOUNDARY IS ITSELF A CONTROL. It
    stops the moment the membership condition is not a product of distinct
    linear factors over F_p -- an irreducible predicate, a higher-degree curve,
    or an extension field where Weil restriction makes membership free. It also
    stops at m >= 3, where the grid is V^m and the added summation equations no
    longer form a single evaluation vector. The m = 3 (S_4) instance is
    therefore the blocking nearby object: if the degeneracy argument reproduces
    unchanged there, the method has identified the membership ENCODING and not
    the arity, and every conclusion narrows accordingly.
  assumptions:
    - >-
      p > 3 and the curve is in short Weierstrass form, matching RQ-ECDLP-001
      declared scope of short_weierstrass over prime fields.
    - >-
      The factor base consists of DISTINCT x-coordinates of F_p-rational points.
      A repeated value would make fV non-squarefree and is the one input that
      breaks radicality, so distinctness is checked as a per-cell precondition
      and never assumed.
    - >-
      The target is affine and s is not identically zero on the grid, which
      fails only in the degenerate case V = {xR}.
    - >-
      The computer-algebra Groebner routine with a prime modulus genuinely
      computes the reduced Groebner basis over F_p. If it instead lifts to Z or
      applies the modulus only at output, every committed observable in this
      lane is of a different ideal -- which is one of the outcomes this design
      separates rather than an assumption it makes.
    - >-
      [relayed, not verified here] The discriminant identity
      disc_T S_3 = 16 f(x1) f(x2), its exactness in the integer polynomial ring,
      the totally-split property of the factor-base locus, and the complete
      m = 3 branch locus are taken from IDEA-20260829-bdca13 characterisation of
      KN-FIND-a8990a. THIS COORDINATOR DID NOT OPEN KN-FIND-a8990a. Part (B) is
      therefore a Stage 0 blocking re-derivation, not an adopted premise; part
      (A), which is the load-bearing half, needs none of it.
    - >-
      [relayed, not verified here] That the harness function builds exactly the
      system described, with distinct on-curve x-coordinates and a grevlex
      order, is taken from the source idea reading of harness/semaev.py. It is a
      Stage 0 source-verification gate, not an assumption.
  proof_search_map:
    bottleneck: >-
      The step "solve the decomposition system by Groebner basis". At m = 2 with
      a split squarefree membership polynomial that step has no algebraic
      content beyond evaluating s on the grid, so its removal changes the
      reported cost model completely while changing no mathematics.
    baseline_embedding:
      parameter_slice: >-
        B = 1 and B = 2 with a planted decomposition. At B = 1 the grid is one
        point and the ideal is either the maximal ideal or the unit ideal; at
        B = 2 with exactly one vanishing cell the reduced Groebner basis must be
        exactly {x1 - v_i, x2 - v_j}. Both are hand-checkable.
      reproduction_check: >-
        A frozen regression fixture: the exact instance, seed, factor base and
        target of an existing committed run of this question, re-run through the
        harness AND through an independent Buchberger-Moeller computation of
        I(Z) built from Z alone with NO summation polynomial on that path. Exact
        equality of the two reduced bases, polynomial by polynomial, is the
        check. Any inequality halts the line and is reported as an instrument
        finding.
    observation_collision:
      observable: >-
        The triple (groebner_basis_size, groebner_basis_max_degree,
        is_trivial_ideal).
      distinct_preimage_search: >-
        REQUIRED, EXPECTED TO SUCCEED, AND ITS SUCCESS IS THE RESULT. Two
        systems with the same observable and different ground truth are
        constructed: a genuine Semaev instance whose Z is a single cell, and a
        CURVE-FREE random bidegree-(2,2) system whose grid vanishing set is the
        same single cell. Prediction: byte-identical observables. A collision
        here does not falsify the measurement, it CALIBRATES it -- it
        establishes that the observable carries no summation-polynomial
        information and bounds every conclusion drawn from it. Reporting a
        Semaev solving-degree number without having run this search is
        prohibited by this record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the question "what does the toy S_3 Groebner cost measure" into
          the CRT decomposition of the quotient ring, where it becomes the exact
          equality F_p[x1, x2]/I = F_p^{Z}. Encoding exact (fV squarefree and
          split); completeness exact (Z is the whole variety); soundness exact
          (no nilpotents, so nothing embedded is lost); transfer fails at m >= 3
          and for non-split membership, stated; cost loss none.
        predicted_gain: >-
          Replaces a per-cell empirical scaling curve with one integer |Z| plus
          a combinatorial staircase, at zero compute. NO ATTACK EXPONENT IS
          MOVED.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed and vary the forgotten structure -- the
          curve, p, the coefficients of s -- and look for an intrinsic invariant
          separating the resulting systems.
        predicted_gain: >-
          The prediction is that NONE exists at m = 2, because the fibre of the
          observable over Z is the whole space of bidegree-(2,2) polynomials
          with that vanishing pattern. That is the content of the redesign
          recommendation.
    quantifier_order: >-
      CLAIMED: FOR ALL primes p > 3, FOR ALL short-Weierstrass E over F_p, FOR
      ALL finite sets V of DISTINCT x-coordinates of rational points, FOR ALL
      affine targets R, THERE EXISTS a finite reduced set Z inside V x V such
      that FOR ALL monomial orders the reduced Groebner basis of
      (s, fV(x1), fV(x2)) equals the reduced Groebner basis of I(Z) in that
      order.
      THE WEAKER READING NOT CLAIMED, because it is vacuous: for every instance
      there exists SOME point set with agreeing bases, which is true of every
      zero-dimensional radical ideal by definition. The content is that Z is
      given EXPLICITLY IN ADVANCE by the group law, before any Groebner
      computation, as the grid restriction of v -> {x(R + P_v), x(R - P_v)}.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At m = 2 with a factor base imposed by a squarefree completely split
        membership polynomial over F_p, the Groebner observables of the Semaev
        decomposition system carry exactly the information in Z and no more."
        It can NEVER certify anything about m >= 3, about factor bases defined
        by irreducible or higher-degree predicates, about extension fields, or
        about the difficulty of the ECDLP; and it does NOT certify that the
        boolean chained systems of another goal are similarly degenerate, since
        those use a different encoding and are explicitly out of scope.
      nearby_object_control: >-
        THE m = 3 (S_4) INSTANCE, blocking. Build (S_4(x1, x2, x3, xR), fV(x1),
        fV(x2), fV(x3)) at the same p and B. The quotient is still a product of
        fields by the same CRT argument, but the search is over a
        three-dimensional grid and the added structure is a hypersurface rather
        than an evaluation vector, so the degeneracy argument must NOT extend
        unchanged. If the method concludes the same thing at m = 3 as at m = 2
        with no distinction, it has not identified the load-bearing structure
        and is measuring the membership encoding only.
    proof_obligations:
      - claim: 'fV squarefree and completely split implies A is a product of fields.'
        responsibility: correctness
      - claim: 'Adding s to A kills exactly the coordinates where s is nonzero.'
        responsibility: correctness
      - claim: 'I is radical and equals I(Z).'
        responsibility: strictness
      - claim: 'The fibre of Z over v is {x(R + P_v), x(R - P_v)} intersected with V.'
        responsibility: correctness
      - claim: 'The expected size of Z is about 4 B^2 / p at a uniform random factor base.'
        responsibility: size
      - claim: >-
          Harness observables equal the independently computed I(Z) observables
          on the frozen fixture, with the I(Z) path touching no summation
          polynomial.
        responsibility: baseline
      - claim: >-
          The CURVE-FREE random bidegree-(2,2) null reproduces identical
          observables at matched Z, and the prohibition on Semaev language when
          it does is pre-stated rather than added afterwards.
        responsibility: scope
      - claim: 'The m = 3 nearby-object control is NOT concluded degenerate.'
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        SIZE OF Z. For a factor base V of size B drawn uniformly from the
        x-coordinates of E(F_p) and a uniform target R, |Z| is distributed as
        Binomial(2B, (B - O(1))/|X|) with |X| the number of x in F_p for which
        f(x) is a square, equal to (p - t - r)/2, so the expected size of Z is
        about 4 B^2 / p and the probability that Z is empty is about
        exp(-4 B^2 / p).
      random_model_justification: >-
        Two rigorous ingredients, both already committed in this repository: the
        exact conservation double count fixes the mean with measured deviation
        exactly 0 over 144 cells, and the exact discriminant identity with the
        totally-split property fixes the fibre size at exactly 2 off the branch
        locus, so there are exactly 2B candidates rather than an estimated
        number. The classical distribution imitated is the
        independent-uniform occupancy model: the 2B algebraically determined
        candidate x-coordinates are assumed to behave, with respect to
        membership in V, like independent uniform draws from X.
      supporting_results:
        - ref: KN-FIND-007
          provenance: internal
          claim: >-
            Mean per-target decomposition yield binomial(B+m-1, m)/N exactly for
            every base of size B, measured deviation exactly 0 over 144 cells;
            coverage bounded by min(1, mean).
          verified_by: coordinator, TASK-20260904-9c61a9 (record read in full)
        - ref: KN-FIND-a8990a
          provenance: internal
          claim: >-
            The exact discriminant identity and the totally-split property of
            the factor-base locus, which fix the fibre size at exactly 2 off the
            branch locus.
          verified_by: >-
            RELAYED from IDEA-20260829-bdca13, whose author states a full read on
            2026-08-29. NOT OPENED by this coordinator; it is a Stage 0
            re-derivation gate in the contract.
      validation_experiment_ids:
        - EXP-PFDR-15ff2b
      falsification_condition: >-
        A fibre of Z over some v has two coincident candidates OFF the branch
        locus, or two distinct candidates ON it. The discriminant identity as
        applied here is wrong and part (B) collapses.
    - id: HEUR-002
      formal_statement: >-
        SOLVER ADEQUACY. The Groebner routine with a prime modulus returns the
        REDUCED Groebner basis of the ideal generated by its inputs over F_p, so
        the reported basis size and maximum total degree are properties of the
        ideal and not of the routine internal strategy.
      random_model_justification: >-
        An implementation property, not a mathematical one. The rigorous anchor
        is that the reduced Groebner basis in a fixed monomial order is UNIQUE,
        so two correct implementations must agree exactly -- which converts the
        assumption into a testable equality rather than a matter of trust.
      supporting_results: []
      validation_experiment_ids:
        - EXP-PFDR-15ff2b
      falsification_condition: >-
        Disagreement between the harness basis and an independent
        Buchberger-Moeller computation of I(Z) on the frozen fixture. An
        INSTRUMENT FAILURE, reported as such and never as a finding about
        solving degree.
  structural_ingredients:
    - description: >-
        The Chinese Remainder Theorem for a quotient by a squarefree completely
        split univariate polynomial in each variable, giving a product of fields
        with no nilpotents.
      citation: 'elementary commutative algebra; the argument is reproduced in full in the statement'
      provenance: internal
      verified_by: coordinator, TASK-20260904-9c61a9 (the argument is four lines and is checked here)
      role: the load-bearing structure theorem
    - description: >-
        Buchberger-Moeller for the vanishing ideal of a finite point set, and
        the Cerlienco-Mureddu correspondence for the lexicographic staircase.
      citation: 'Buchberger-Moeller algorithm; Cerlienco-Mureddu correspondence'
      provenance: recalled
      verified_by: null
      role: >-
        the classical machinery that makes the staircase prediction explicit.
        NOT used as support -- part (A)(iv) is proved from CRT alone -- and
        recorded so a referee can identify it.
    - description: >-
        The Bezout constraint that over F_p membership must be imposed as extra
        equations and any plane predicate cutting out B points has degree at
        least B/3, with no extension-field counterpart.
      citation: 'ideas/catalogue-20260805/A1-index-calculus.md entry A1-11'
      provenance: internal
      verified_by: >-
        RELAYED from IDEA-20260829-bdca13; not opened by this coordinator
      role: source of the claim that the growing quantity is deg fV = B
  reduction_chain:
    core_problem: >-
      No attack problem is reduced. This is an INSTRUMENT result: what one
      measurement can and cannot see.
    corollaries: []
  predictions:
    - metric: >-
        P1 -- agreement between harness-reported (basis size, max degree,
        trivial flag) and the same three quantities computed independently from
        Z by Buchberger-Moeller. UNITS: categorical, per cell
      direction: different
      minimum_effect: >-
        FORCED EXACT on every cell of the stratified grid. A single disagreement
        is either a harness defect or a refutation of the structure theorem, and
        the record commits IN ADVANCE to hand-deriving the disagreeing cell and
        reporting which.
    - metric: >-
        P2 -- standard-monomial count of the computed reduced Groebner basis
        versus |Z|. UNITS: integer
      direction: different
      minimum_effect: >-
        FORCED EQUAL exactly in every non-degenerate cell. This is the sharpest
        single number in the design: dim F_p[x1, x2]/I equals |Z| is an integer
        identity that can fail.
    - metric: >-
        P3 -- CURVE-FREE NULL: observables of a random bidegree-(2,2) system
        with the same fV and the same grid vanishing pattern. UNITS:
        categorical, per cell
      direction: different
      minimum_effect: >-
        PREDICTED IDENTICAL, recorded in advance so a match is a CONFIRMED
        CONTROLLED NULL rather than a disappointment. BLOCKING FOR ATTRIBUTION:
        a match forbids describing any observable of this instrument as a
        statement about summation polynomials, elliptic curves or the ECDLP. Any
        difference at all in the reduced basis beyond relabelling of coordinate
        values falsifies part (A)(iv) and is the most valuable outcome here.
    - metric: >-
        P4 -- fitted exponents of Groebner wall time and reported max degree as
        functions of B at fixed p, and of p at fixed B and fixed |Z|. UNITS:
        dimensionless exponents
      direction: different
      minimum_effect: >-
        PREDICTED: a clean power law in B with exponent at least 2, and a fitted
        p-exponent whose magnitude is below 0.2 across the tested range. The
        band is non-degenerate because coefficient arithmetic alone contributes
        an apparent p-exponent of order 1/log p, about 0.06 to 0.09 on this
        range, well inside 0.2, while a genuine algebraic response to p would
        be a power law. A fitted p-exponent above 0.5 means the instrument sees
        something the theorem forbids and is the most interesting negative.
    - metric: >-
        P5 -- fibre size of Z over a factor-base element against the branch
        locus f(v) f(xR) = 0 union v = xR. UNITS: integer, per element
      direction: different
      minimum_effect: >-
        FORCED: the two candidate partners coincide EXACTLY on the branch locus
        and are distinct otherwise, over the complete enumeration of V at every
        tested cell. One counterexample refutes the identity as applied here.
    - metric: >-
        P6 -- the m = 3 (S_4) NEARBY-OBJECT CONTROL. UNITS: categorical
      direction: different
      minimum_effect: >-
        FORCED NEGATIVE: the degeneracy argument must NOT reproduce at m = 3. If
        the S_4 observables are also a pure function of a grid incidence set with
        no additional structure, the method is measuring the membership encoding
        and not the arity, and the scope of every conclusion narrows to that.
    - metric: >-
        P7 -- certificate arm: every cell with |Z| >= 1 emits a decomposition
        certificate re-checked by independent point addition, and every cell
        with |Z| = 0 emits the sorted 2B-element candidate list as a CHECKABLE
        NEGATIVE CERTIFICATE recomputable in O(B log B). UNITS: pass or fail
      direction: higher
      minimum_effect: >-
        100 percent verification on both arms. This is required by
        RQ-ECDLP-001 own constraint that every solve or relation carries an
        independently verified certificate, and it converts today solver
        self-report negative into an independently checkable one.
  test_boundary:
    instances:
      - 'generic prime-field short-Weierstrass curves at p in {2^8, 2^10, 2^12}, in declared scope'
      - 'two out-of-declared-scope calibration primes 2^14 and 2^16, flagged as such on every row'
      - 'CURVE-FREE: random bidegree-(2,2) systems at matched grid vanishing pattern'
      - 'the m = 3 (S_4) nearby object at the same p and B'
      - 'boundary cases B = 1 and B = 2, computed by hand before any battery runs'
    parameters:
      B: '{4, 8, 16, 32}'
      seeds: '5 per cell'
      stratification: >-
        targets stratified so |Z| takes each of 0, 1, 2, 3 at least 20 times;
        stratification is a sampling design and NO yield or coverage statement
        may be read off this battery
      order: 'grevlex, frozen before any cell runs; comparisons only between REDUCED bases in the SAME order'
      preconditions: 'factor-base distinctness checked per cell; degenerate targets with xR in V or f(xR) = 0 enumerated and reported separately'
    implementation: >-
      Two independent paths that must agree: the harness Groebner path, and a
      path that computes Z directly from the group law (for each v, the
      x-coordinates of R + P_v and R - P_v, intersected with V) and then I(Z) by
      Buchberger-Moeller, with NO summation polynomial used anywhere. The
      largest object is a bivariate polynomial of degree at most 32 in each
      variable, at most 1089 monomials.
    budget:
      wall_clock_seconds_per_run: 600
      total_cpu_hours: 4
      maximum_memory_gb: 8
      maximum_runs: 240
  falsification_conditions:
    - >-
      F1 THEOREM OR HARNESS WRONG. Any cell where the harness observables differ
      from the independently computed I(Z) observables. The record commits in
      advance to hand-deriving the disagreeing cell and reporting which, and
      NOT to editing any prior record.
    - >-
      F2 RADICALITY REFUTED. Standard-monomial count differs from |Z| in any
      non-degenerate cell. Part (A)(iii) falls.
    - >-
      F3 A GENUINE SIGNAL. The CURVE-FREE random bidegree-(2,2) null gives
      DIFFERENT observables at matched Z. Part (A)(iv) is refuted and the
      surviving difference is a genuine summation-polynomial signal in the
      Groebner data -- the most valuable possible outcome and the reason the
      null is run rather than assumed.
    - >-
      F4 DISCRIMINANT APPLICATION WRONG. A fibre of Z has two coincident
      candidates off the branch locus or two distinct candidates on it. Part (B)
      collapses; part (A) survives independently.
    - >-
      F5 UNEXPLAINED p-RESPONSE. The fitted p-exponent at fixed B and fixed |Z|
      exceeds 0.5. The instrument responds to p in a way the theorem forbids.
    - >-
      F6 SCOPE WIDENS. The S_4 control reproduces the degeneracy unchanged. The
      conclusion is re-scoped from "m = 2 is degenerate" to "the membership
      encoding is degenerate at every arity", a broader and more consequential
      finding requiring its own record.
    - >-
      F7 EVERYTHING MATCHES, WHICH IS THE PREDICTED OUTCOME. The instrument is
      closed as a Semaev meter with a named obstruction, an argument and forward
      guidance; RQ-ECDLP-001 decision target is answered REDESIGN with a
      derivation attached; and because the curve-free null reproduced the
      observables, no statement about elliptic curves may be made from any of
      it.
  interpretation_limits:
    - >-
      An INSTRUMENT result, not a mathematical result about the ECDLP or about
      summation polynomials. No attack, no exponent, no hardness claim.
    - >-
      Scoped to m = 2, prime fields, short Weierstrass, squarefree completely
      split membership polynomials, and p at most 2^16. It does not transfer to
      extension fields, to irreducible membership predicates, or to m >= 3.
    - >-
      A closure of this instrument is NOT a closure of the underlying open
      problem. The growth of the solving degree for prime-field
      summation-polynomial systems remains open; what this would establish is
      that the current toy instrument cannot answer it.
    - >-
      The boolean chained Semaev systems of the DREG lane use a DIFFERENT
      encoding and this theorem says nothing about them. Any reader concluding
      that those measurements are also degenerate is reading beyond the record.
    - >-
      Because the predicted outcome is that a curve-free object reproduces the
      signature, the honest headline of a confirming run contains no elliptic
      curve at all. That is stated here so it cannot be softened later.
    - >-
      NOVELTY IS NOT ADJUDICATED. The mathematics is elementary and may well be
      folklore; the external literature was not searched for this statement and
      the classical machinery is cited from memory only.
