hypothesis:
  id: H-ECDLP-b093c1
  question_id: RQ-ECDLP-bc7a54
  source_idea: IDEA-20261007-1a61b9
  derived_from_idea: IDEA-20261007-1a61b9
  experiment_id: EXP-ECDLP-daee4d
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-ECDLP-bc7a54 is not bound to a goal head in this design. GOAL-ECDLP2M-001.yaml
    is out of write-scope and is not edited.
  specified_at: '2026-10-07'
  approved_at: '2026-10-07'
  authorised_by: DEC-20261007-38e082
  proposed_by: coordinator
  status: approved
  title: >-
    On two ordinary prime-order toys with N in (2^10, 2^12), the x-rank
    overlap excess of the low-Hamming set W is at most 0.02 (O-FLOOR), or
    exceeds 0.05 on both curves (O-EXCESS), after scalar-ranking recovers 1

  statement: >-
    SETTING (IDEA-20261007-1a61b9). For an ordinary short-Weierstrass curve
    over F_p with a prime-order subgroup of size N in (2^10, 2^12), skipping
    y^2=x^3+x+1, let t=floor(log2(N)/4) and let W be the negation-quotiented
    scalars of Hamming weight at most t. Let B be the |W| subgroup points of
    smallest integer x-coordinate (negation quotiented). Let excess =
    |{k in W : [k]G in B}|/|W| - |W|/N.

    CLAIMS UNDER TEST:
    (S0) Zero-compute freeze of the N-window, weight rule, excluded curve,
    null seed, claim/falsify thresholds, and O-* vocabulary.
    (FLOOR) O-FLOOR: excess <= 0.02 on both ordinary curves and the
    scalar-ranking control recovers overlap 1.
    (EXCESS) O-EXCESS: excess > 0.05 on both ordinary curves and the
    scalar-ranking control recovers overlap 1.
    (MIXED) O-MIXED: otherwise, with scalar control recovering 1 (including
    excess in (0.02, 0.05] or disagreeing curves).
    (CTRL) O-CONTROL-FAIL: scalar-ranking does not recover overlap 1.
    (IMP) O-IMPEDIMENT: timeout/crash/missing freeze; never mathematical negative.

    This prices one coordinate test for W. It does not interpolate a discrete
    log and does not move the generic-group exponent.

  mechanism: >-
    PAIR from IDEA-20261007-1a61b9. Representation R1 (integer digits of x).
    Sigma = negation (preserves x). Partial-action: the order statistic of x
    is invariant under negation and is not a function of a generic translate.
    Lossy projection keeps only membership in B. Positive control ranks by
    the tabulated scalar and must recover W exactly. Null is a random subset
    of size |W|.

  assumptions:
    - The scalar table is the instrument, not an algorithm of cost N^{1/3}.
    - Negation is quotiented before |W| and |B| are counted.
    - y^2 = x^3 + x + 1 is excluded.
    - Timeouts/crashes are O-IMPEDIMENT, never negative evidence.

  proof_search_map:
    not_applicable_reason: >-
      Measurement of one overlap excess on toy ordinary curves, not a proof
      of a coordinate test that decides W without listing W. The four cheap
      audits still run as falsification aids.
    bottleneck: >-
      Membership of [k]G in the |W| smallest-x classes. If that membership
      agrees with k in W above the random rate, the x-rank is informative;
      otherwise it prices as a null.
    baseline_embedding:
      parameter_slice: 'N in (2^10, 2^12), two ordinary curves, exclude y^2=x^3+x+1.'
      reproduction_check: >-
        Scalar-ranking control recovers overlap 1 with W on each curve before
        any x-rank excess is read as evidence.
    observation_collision:
      observable: the overlap excess of B with W
      distinct_preimage_search: >-
        Any labelling of the same points by a random injection of size |W|
        is the null. Distinct curves that share N are still independent trials.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the pair (W, B) on two ordinary toys
        predicted_gain: A decidable O-* label pricing this x-rank against a random subset.
    quantifier_order: >-
      FORALL two ordinary curves found in the search with N in (2^10, 2^12),
      EXISTS the measured excesses such that either both are <= 0.02
      (O-FLOOR) or both are > 0.05 (O-EXCESS), conditional on scalar control
      recovering 1. A single control failure is O-CONTROL-FAIL.
    method_ceiling:
      strongest_certifiable_claim: >-
        At these toy N, the x-rank overlap excess of W is at most 0.02 on
        both curves, or exceeds 0.05 on both, after the scalar control
        recovers 1. Neither outcome is an N^{1/3} algorithm.
      nearby_object_control: >-
        The random subset of size |W| is the null. The scalar-ranking
        recoverer is the positive control. An implementation that fails the
        positive control is void.
    proof_obligations:
      - claim: Scalar-ranking recovers overlap 1 before excess is interpreted.
        responsibility: correctness
      - claim: Negation quotient is applied before |W| and |B| counts.
        responsibility: correctness

  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        At N in (2^10, 2^12), the integer x-coordinates of a prime-order
        subgroup are independent of the Hamming weight of the scalar up to
        an overlap excess of 0.02 against a random subset of the same size.
      random_model_justification: >-
        The hypergeometric overlap of a fixed W with a random subset of size
        |W| has expectation |W|/N. H1 says the x-rank subset meets that
        expectation at the toy size. It is checked, not assumed at N=2^256.
      supporting_results:
        - KR-RHO-13bf67 (internal; Omega(N^{1/2}) generic)
        - KR-RHO-ea34b8 (internal; N^{1/3} online after N^{2/3} precomputation)
      validation_experiment_ids:
        - EXP-ECDLP-daee4d
      falsification_condition: >-
        Excess > 0.05 on both ordinary curves while scalar-ranking recovers 1.

  structural_ingredients:
    - description: Sub-square-root algorithms must exploit the representation.
      citation: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: baseline; exponent stays 1/2
    - description: About N^{1/3} online needs about N^{2/3} precomputation.
      citation: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-ea34b8.yaml
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-ea34b8.yaml
      role: listing W is that precomputation; this idea prices a coordinate test instead

  reduction_chain:
    core_problem: toy x-rank overlap excess for the low-Hamming scalar set
    corollaries: []

  predictions:
    - metric: excess = overlap_frac - |W|/N
      direction: lower
      minimum_effect: '<= 0.02'

  test_boundary:
    instances:
      - two ordinary prime-order subgroups with N in (2^10, 2^12)
    parameters:
      n_lo: 1024
      n_hi: 4096
      null_seed: 20261007
      claim_excess: 0.02
      falsify_excess: 0.05
      excluded_curve: 'y^2 = x^3 + x + 1'
    implementation: experiments/EXP-ECDLP-daee4d/implementation/run.py
    budget:
      wall_clock_seconds: 3600
      memory_gb: 1
      maximum_runs: 3

  falsification_conditions:
    - Excess > 0.05 on both ordinary curves with scalar-ranking recovering 1 (O-EXCESS).
    - Scalar-ranking does not recover overlap 1 (O-CONTROL-FAIL); the counter is void.

  interpretation_limits:
    - An excess at most 0.02 does not prove that no coordinate test for W exists.
    - An excess above 0.05 falsifies H1 at this toy scale and is not yet an N^{1/3} algorithm.
    - Exponent delta is 0 relative to KR-RHO-13bf67.

  novelty_status: unverified
  dominated_by: >-
    KR-RHO-13bf67 dominates any algorithm that does not exploit a
    representation beyond a generic labelling. KR-RHO-ea34b8 dominates the
    route that lists W and stores it. This proposal prices one x-rank and
    does not close the coordinate-test gap.
  sota_delta: >-
    Zero change to the exponent 1/2. The integer measured is an overlap
    excess with claim at most 0.02.
  cited_evidence: []
  amazon_bedrock: NOT SELECTED
