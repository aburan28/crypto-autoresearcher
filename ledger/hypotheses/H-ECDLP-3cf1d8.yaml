  interpretation_limits:
  - >-
    Toy scale, claim tier toy. Nothing here is evidence about P-256 or P-224, neither
    of which has D_K in {-3, -4}; both are explicitly outside the covered family.
  - >-
    THE COST ARM IS EXCLUDED. No rho step count, no charged ascent cost and no
    end-to-end saving is measured or claimed by this hypothesis. H-AUT-2 is recorded
    and is UNVALIDATED here.
  - >-
    Even if the excluded cost arm were run and succeeded, the saving would be a
    CONSTANT FACTOR of at most 1.733 on a subfamily of density about 1/sqrt(p),
    thinned further by the smoothness of f. It moves no exponent. Its role is to make
    obstruction 4 of EV-ECDLP-b3e847 precise - no member is cheaper BY AN EXPONENT
    survives, no member is cheaper does not.
  - >-
    Classes with D_K in {-3, -4} are rare and a sample selected by searching for them
    is NOT a random sample. No density claim about curves may be read off Arm S.
  - >-
    Arm H establishes CONSISTENCY WITH a density law over a finite enumerated range,
    never the law itself, and its range [2^16, 2^28] is far below cryptographic size.
  - >-
    Arm H's prime range exceeds RQ-ECDLP-912694's declared bit sizes of 7 to 9 even
    though it performs no curve arithmetic and no DLP. That is a scope question for
    the approver and is raised in the paired contract's approval gate rather than
    assumed either way.
  - >-
    Timeouts, crashes and infrastructure failures are never negative mathematical
    evidence (AGENTS.md rule 5).
