hypothesis:
  id: H-ECDLP-3cf1d8
  question_id: RQ-ECDLP-912694
  added: '2026-08-25'
  derived_from_idea: IDEA-20260812-c49409
  status: proposed
  proposed_by: coordinator

  statement: >-
    SCOPE, AND IT IS DELIBERATELY NARROWER THAN THE PARENT PROPOSAL. This
    hypothesis covers ARM S (structural) at RQ-ECDLP-912694's declared bit sizes 7,
    8 and 9 with odd isogeny degrees ell in 3, 5, 7, 11, 13, and ARM H (heuristic
    validation) which is a pure integer enumeration carrying no curve arithmetic
    and no DLP. IT EXCLUDES ARM C, the cost arm, which needs 20 to 28 bit primes
    and therefore exceeds the question's declared bit sizes; no statement about
    Pollard rho step counts, charged ascent cost or end-to-end saving is made or
    tested here, and any such measurement requires a separate contract and an
    explicit scope decision. Claim tier toy. NO ATTACK AND NO EXPONENT - the
    quantity at stake is a constant factor of at most sqrt(3) equal to 1.733 on a
    subfamily of density about 1/sqrt(p), and it is not claimed even for that here.
    D1, LOCUS SIZE. For an ordinary E/F_p with prime N equal to #E(F_p) and
    Delta equal to t^2 - 4p equal to f^2 D_K, the F_p-isogeny class contains a
    vertex with extra F_p-rational automorphisms if and only if D_K is -3 or -4,
    and in that case it contains EXACTLY ONE such vertex - the unique crater vertex
    - because h(-3) equals h(-4) equals 1. Measured prediction - exactly 1, on every
    sampled class, with zero exceptions.
    D2, LEAVING THE LOCUS. From the j equal to 0 crater vertex with D_K equal to -3
    and p congruent to 1 mod 3, every F_p-rational isogeny of odd prime degree ell
    leaves the automorphism locus - the codomain has |Aut| equal to 2 - EXCEPT the
    isogeny whose kernel is the ramified prime ideal above 3, which is principal and
    returns to j equal to 0. So the predicted exceptional odd degree is ell equal to
    3 and nothing else; for j equal to 1728 the analogous ramified prime is 2, which
    is even and hence outside the declared odd-degree scope, so NO odd exceptional
    degree is predicted there. This is RQ-ECDLP-912694's decision target stated as a
    finite, exactly checkable prediction.
    H-AUT-1, THE HEURISTIC. The conductor f equal to sqrt((4p - t^2)/|D_K|) behaves
    like a uniformly random integer of its size with respect to smoothness, so the
    probability that f is B-smooth is the Dickman-de Bruijn rho(u) with u equal to
    log f / log B. THE TRANSFER ASSUMPTION IS STATED AND IS THE MOST LIKELY SOURCE
    OF DEVIATION - f is constrained by the quadratic form 4p equal to t^2 + |D_K|
    f^2 and is therefore NOT a uniformly random integer. A measured deviation from
    rho is a FINDING, not a defect.

  mechanism: >-
    Two independent facts collide. First, the class number of the two special
    discriminants is one, so the automorphism locus cannot be spread across the
    crater - it is a single vertex. Second, the only within-class quantity that is
    not fixed by the Frobenius trace and that has a direct effect on Pollard rho's
    step count is |Aut|, because every other cheap-map source - the group order, the
    embedding degree, the CM field - is class-invariant by Tate. Putting the two
    together, the one non-invariant cost quantity sits at exactly one vertex.
    The projection under test is E' mapped to (|Aut(E')|, volcano level), which
    keeps about four bits per vertex out of a full curve equation and is violently
    lossy. What it discards is discarded COMPATIBLY with the operation the target
    performs - an ell-isogeny step changes the volcano level by an amount determined
    by Kohel's criterion on the kernel, and |Aut| is determined by whether the
    resulting level is the crater AND D_K is -3 or -4. The retained part therefore
    propagates deterministically under isogeny steps, which is what makes it a
    tracked object rather than a label.
    ARM S measures the projection directly by complete enumeration of small classes.
    ARM H measures the availability law that the excluded cost arm would depend on -
    the reach cost is governed by the smoothness of f rather than by class size, so
    the availability of any saving is a smoothness probability. Arm H is included
    HERE, without the cost arm, precisely because a conditional result must be paired
    with validation of the distribution it is conditional on, and because the
    enumeration is cheap, exact and carries no DLP.

  assumptions:
  - >-
    E/F_p ordinary with prime N equal to #E(F_p), so the DLP instance would
    transport injectively along every ell-isogeny with ell dividing f. Composite N
    is out of scope. This assumption is carried for completeness; the cost arm that
    would use it is excluded.
  - >-
    p congruent to 1 mod 3 for the D_K equal to -3 arm and p congruent to 1 mod 4
    for the D_K equal to -4 arm, so the extra automorphisms are F_p-RATIONAL. An
    automorphism defined only over an extension gives no rho discount over F_p, and
    the extension-field control named in RQ-ECDLP-912694's scope exists to
    demonstrate exactly that.
  - >-
    Kohel's criterion for identifying the ascending ell-isogeny at a vertex is
    implemented and independently checked against the computed endomorphism ring at
    each level, rather than trusted.
  - >-
    Twists share a j-invariant and have different traces. Class vertices are
    deduplicated up to F_p-ISOMORPHISM and never by j alone, since deduplicating by
    j would both merge distinct vertices and drag in curves from other classes,
    corrupting D1 in both directions.
  - >-
    Lawful defensive cryptanalysis on public constructions and toy benchmarks. Every
    kernel, quotient and claimed solve carries an independently re-verified
    certificate.

  proof_search_map:
    not_applicable_reason: null
    bottleneck: >-
      For the parent proposal as a whole, the REACH COST - whether the special
      vertex can be reached for less than the discount is worth, which is a
      smoothness question about f that nobody has charged. FOR THIS HYPOTHESIS THE
      BOTTLENECK IS RESTATED, because the cost arm is excluded - it is the
      AVAILABILITY LAW, i.e. whether the conductor of a quadratic-form-constrained
      family obeys Dickman. That is what decides whether any future cost arm is
      worth commissioning, and it is measurable without any DLP.
    baseline_embedding:
      parameter_slice: >-
        Setting D_K outside {-3, -4} empties the locus and the whole frame collapses
        to no within-class difference, which is exactly the standing claim of
        EV-ECDLP-b3e847 obstruction 4. The standing closure is recovered as an exact
        parameter slice of this frame rather than contradicted by it.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, computed and frozen before the special-j arm is
        read - on a class with D_K outside {-3, -4} the measured |Aut| must be
        exactly 2 at every vertex. This is the same prediction EXP-ISOU-2ac81f makes
        for its generic band, so the two instruments cross-check.
    observation_collision:
      observable: >-
        The pair (|Aut| at a vertex, volcano level of that vertex) within a complete
        F_p-isogeny class.
      distinct_preimage_search: >-
        Search for two vertices in the same class with the same observable but
        different F_p-isomorphism classes of curve, which would mean the observable
        does not identify the vertex and any statement phrased in terms of it is
        ambiguous. Search also for two classes with the same D_K and different
        conductor factorisation whose locus structure coincides, which would mean
        the conductor is not the operative variable. Both searches are EXECUTED on
        the enumerated classes, not argued.
    constructive_transforms:
    - transform: boundary_lift
      proposed_object: >-
        The exceptional-prime boundary for the j equal to 0 locus, lifted from the
        isogeny may or may not leave the locus to the isogeny leaves the locus
        unless its kernel is the ramified prime above 3.
      predicted_gain: >-
        It answers RQ-ECDLP-912694's decision target - the split/non-split and
        exceptional-prime boundary - with a finite check rather than a survey. No
        cost gain of any kind.
    - transform: specialization_pack
      proposed_object: >-
        The subfamily D_K in {-3, -4} with smooth f, specialised out of the general
        ordinary family and packed back as a stated exception to the within-class
        uniformity claim.
      predicted_gain: >-
        A constant factor of at most sqrt(3) equal to 1.733 on rho, on a subfamily
        of density about 1/sqrt(p) thinned further by the smoothness of f. NOT AN
        EXPONENT, and NOT MEASURED HERE - the cost arm is excluded from this
        hypothesis and this transform is recorded as the thing a future contract
        would have to establish.
    quantifier_order: >-
      FOR ALL ordinary classes with D_K in {-3, -4} at the sampled parameters, FOR
      ALL class members E', THERE EXISTS exactly one vertex with |Aut| greater than
      2; and FOR ALL odd primes ell in the declared set and ALL F_p-rational
      ell-isogenies from that vertex, the codomain has |Aut| equal to 2 UNLESS ell
      equals 3 and the kernel is the ramified ideal. The order matters - the class
      is fixed first by the given curve, and the exceptional degree is quantified
      over ALL odd primes in the declared set rather than exhibited for a convenient
      one. Note the honest limit - the declared set is finite, so ALL odd primes is
      tested only over 3, 5, 7, 11, 13.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale, certificate-carrying, COMPLETE-CLASS statement for the sampled
        classes at 7 to 9 bits - the locus has one vertex, and the exceptional odd
        degree over the declared set is exactly 3 for j equal to 0 - plus a
        consistency-or-deviation statement for the conductor smoothness law over the
        enumerated (p,t) family. It cannot certify anything about cryptographic p,
        cannot certify a density law from a finite sample (only consistency with
        one), cannot say anything about rho step counts because the cost arm is
        excluded, and cannot be read as evidence about P-256 or P-224, neither of
        which is in the covered family.
      nearby_object_control: >-
        Crater curves with D_K in {-7, -8, -11}, which possess a SMALL-DEGREE
        endomorphism of norm 2 or 3 but have |Aut| equal to 2. They are the sharpest
        possible control - a cheap endomorphism is present and no automorphism
        structure is predicted, because the discount needs an INVERTIBLE map and not
        merely a cheap one. Within Arm S the check is that the measured |Aut| there
        is exactly 2. A second nearby object is special-j curves over an extension
        field where the named automorphism is NOT F_p-rational, which
        RQ-ECDLP-912694's own scope already names.
    proof_obligations:
    - claim: 'h(-3) equal to h(-4) equal to 1, hence the locus is a single crater vertex'
      responsibility: size
    - claim: >-
        Every odd-degree F_p-rational isogeny from j equal to 0 leaves the locus
        except the one whose kernel is the ramified prime above 3
      responsibility: strictness
    - claim: >-
        Class vertices are enumerated up to F_p-isomorphism, not up to j-invariant,
        so twists are neither merged nor imported from other classes
      responsibility: correctness
    - claim: >-
        The instrument measures |Aut| equal to 2 at the D_K in {-7, -8, -11} nearby
        objects
      responsibility: feasibility
    - claim: >-
        The empirical CDF of u equal to log f / log B over the enumerated family is
        or is not consistent with Dickman rho at the declared B grid
      responsibility: success_probability
    - claim: >-
        Nothing in this hypothesis establishes reach cost, rho step count, or any
        end-to-end saving; the cost arm is excluded and its obligations are not
        discharged here
      responsibility: scope

  asymptotic_claim:
    problem: >-
      ECDLP on ordinary curves over prime fields. NO IMPROVEMENT IS CLAIMED BY THIS
      HYPOTHESIS - the field is filled rather than nulled so that the ceiling is
      explicit.
    prior_best: >-
      Pollard rho with negation at 0.886*sqrt(N)/sqrt(2) group operations and O(1)
      memory (KN-TECH-001, KN-TECH-006); on a crater vertex with extra automorphisms
      the incumbent is already the automorphism-discounted variant (KN-TECH-018).
    time_exponent: '1/2, UNCHANGED.'
    memory_exponent: 'O(1) for rho, UNCHANGED.'
    hidden_cofactor: >-
      For the excluded cost arm - extracting f requires factoring an integer of size
      about sqrt(p), free at toy scale and subexponential at cryptographic scale;
      the ascent cost per step scales like a modular-polynomial evaluation at the
      step's degree, so one large prime factor of f can dominate everything. Both
      are disclosed here because they are the reason the cost arm is excluded rather
      than cheap.
    claim_kind: constant_factor

  heuristic_assumptions:
  - id: H-AUT-1
    formal_statement: >-
      FOR ordinary curves with D_K in {-3, -4}, the conductor f equal to
      sqrt((4p - t^2)/|D_K|) behaves like a uniformly random integer of its size
      with respect to smoothness - i.e. for B in the declared grid, the proportion of
      the family with f B-smooth equals rho(u) with u equal to log f / log B and rho
      the Dickman-de Bruijn function, up to sampling error.
    random_model_justification: >-
      RIGOROUS INGREDIENTS - f is determined exactly by (p,t) through 4p - t^2 equal
      to |D_K| f^2, so f is an explicitly computable integer of size about
      sqrt(4p/|D_K|). DISTRIBUTION IMITATED - the Canfield-Erdos-Pomerance /
      Dickman-de Bruijn smoothness law for uniformly random integers of a given size,
      which is the same imitation the target-result exemplar makes for its degree
      splitting. TRANSFER ASSUMPTION STATED - f is constrained by the quadratic form
      4p equal to t^2 + |D_K| f^2 and is therefore NOT a uniformly random integer;
      this is flagged as the most likely source of deviation and a measured deviation
      is a finding rather than a defect.
    supporting_results:
    - >-
      Dickman-de Bruijn rho as the smoothness density for uniform integers, and the
      Canfield-Erdos-Pomerance estimate. RECALLED, standard, and used as the
      PREDICTION UNDER TEST rather than as an authority - the run measures agreement
      with it and a disagreement is the interesting outcome.
    - >-
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, read in-repo, as the exemplar of
      a conditional result whose heuristic is validated by sampling the relevant
      distribution and comparing against the predicted one.
    validation_experiment_ids:
    - EXP-ECDLP-6ecca1
    falsification_condition: >-
      The empirical CDF of u over the completely enumerated family departs from
      rho(u) by more than the declared Kolmogorov-Smirnov threshold at any B in the
      grid where the expected smooth count exceeds the declared minimum. That is a
      measured deviation of a quadratic-form-constrained conductor from the uniform
      smoothness law, and it would invalidate the availability estimate any future
      cost arm depends on.
  - id: H-AUT-2
    formal_statement: >-
      Pollard rho on the crater vertex quotiented by the full automorphism group of
      order 2m has expected step count 0.886*sqrt(N/m)*(1 + o(1)), so the discount
      relative to the negation-only baseline is exactly sqrt(m) - sqrt(3) for j
      equal to 0 and sqrt(2) for j equal to 1728 - once fruitless cycles are handled.
    random_model_justification: >-
      RIGOROUS INGREDIENT - the automorphism group acts freely on the nonzero points
      of a prime-order group, so the quotient has exactly (N-1)/(2m) elements.
      DISTRIBUTION IMITATED - the birthday bound under the idealisation that the
      quotient walk is a random function, relayed by KN-TECH-018 with attributions
      NOT re-verified.
    supporting_results:
    - >-
      KN-TECH-018, read in-repo, which records the sqrt(|Aut|) discount as classical
      and applicable only to special CM curves. That is the ingredient, not the
      claim.
    validation_experiment_ids: []
    falsification_condition: >-
      A measured rho ratio at the crater vertex of 1.00 while a same-curve
      quotient-on-versus-off positive control shows the discount. NOT TESTED HERE -
      H-AUT-2 belongs to the EXCLUDED cost arm and is UNVALIDATED by this hypothesis.
      It is recorded so that no reader takes the sqrt(3) figure as established by
      anything in this record.

  structural_ingredients:
  - description: >-
      Kohel's volcano structure of ordinary F_p-isogeny graphs and the criterion
      identifying ascending, horizontal and descending ell-isogenies at a vertex.
    citation: null
    provenance: recalled
    verified_by: >-
      RECALLED and re-derivable. It is a declared proof obligation for the executor
      to check the criterion against an independently computed endomorphism ring at
      each level rather than trust it. A recalled ingredient is a pointer for the
      reviewer, not support.
    role: navigation of the class and identification of the crater
  - description: >-
      The class-number facts h(-3) equal to h(-4) equal to 1 and the principality of
      the ramified prime above 3 in the order of discriminant -3.
    citation: null
    provenance: recalled
    verified_by: >-
      RECALLED and elementary. The run verifies the CONSEQUENCE directly by complete
      enumeration - exactly one vertex with extra automorphisms - so the fact is
      tested rather than assumed.
    role: the reason D1 predicts exactly one vertex
  - description: >-
      The sqrt(|Aut|) Pollard rho discount on special CM curves.
    citation: KN-TECH-018
    provenance: internal
    verified_by: >-
      In-repo technique entry, read directly; its external attributions were not
      re-verified. NOT USED by this hypothesis, whose cost arm is excluded.
    role: ingredient of the excluded cost arm, recorded for completeness

  reduction_chain:
    core_problem: null
    corollaries: []

  predictions:
  - metric: >-
      number of vertices with |Aut| greater than 2 in a complete F_p-isogeny class
      with D_K in {-3, -4}
    direction: same
    minimum_effect: >-
      Exactly 1, on every sampled class, with zero exceptions. Two or more falsifies
      D1 and indicts either the class-number reasoning or the F_p-isomorphism
      deduplication.
  - metric: >-
      fraction of F_p-rational odd-degree ell-isogenies from the j equal to 0 vertex,
      over ell in 3, 5, 7, 11, 13, whose codomain still has |Aut| equal to 6
    direction: same
    minimum_effect: >-
      Exactly the ell equal to 3 isogenies whose kernel is the ramified ideal, and no
      others. Any ell greater than 3 producing a codomain with |Aut| equal to 6
      falsifies D2 and is the interesting outcome for RQ-ECDLP-912694.
  - metric: >-
      measured |Aut| at the D_K in {-7, -8, -11} nearby-object vertices and at every
      vertex of a class with D_K outside {-3, -4}
    direction: same
    minimum_effect: >-
      Exactly 2 everywhere. Anything else means the |Aut| computation is wrong and
      every other reading is void.
  - metric: >-
      Kolmogorov-Smirnov statistic between the empirical CDF of u equal to
      log f / log B over the enumerated (p,t) family and the Dickman-de Bruijn rho(u)
    direction: different
    minimum_effect: >-
      Consistency with rho at every B in the declared grid where the expected smooth
      count exceeds the declared minimum, OR a departure exceeding the declared
      threshold - which is the finding, since f is quadratic-form-constrained rather
      than uniform.

  test_boundary:
    instances:
    - >-
      ARM S - ordinary curves over primes of 7, 8 and 9 bits with D_K in {-3, -4},
      with complete F_p-isogeny classes enumerated up to F_p-isomorphism by exact
      point enumeration and odd-degree Velu quotients.
    - >-
      ARM S controls - classes with D_K outside {-3, -4}; crater curves with D_K in
      {-7, -8, -11}; special-j curves over an extension field where the automorphism
      is not F_p-rational.
    - >-
      ARM H - the complete enumeration of (p, t) with D_K in {-3, -4} over primes in
      [2^16, 2^28], parametrised by 4p equal to t^2 + |D_K| f^2, each f factored
      completely. NO CURVE ARITHMETIC AND NO DLP OCCURS IN THIS ARM.
    parameters:
      arm_s_bit_sizes: '7, 8, 9 - exactly RQ-ECDLP-912694 declared sizes'
      arm_s_degrees: 'ell in 3, 5, 7, 11, 13'
      arm_h_range: 'primes in [2^16, 2^28], complete enumeration of the thin family'
      arm_h_B_grid: 'declared at Stage 0; cells with expected smooth count below the declared minimum are refused, not reported'
      excluded_arm: 'ARM C, the cost arm at 20 to 28 bits, is EXCLUDED and requires its own contract and an explicit scope decision'
    implementation: >-
      Exact point enumeration and odd-degree Velu quotients for Arm S, with every
      kernel and quotient carrying an independent curve-membership certificate as
      RQ-ECDLP-912694 requires. A bounded sieve plus complete factorisation of
      sqrt(p)-sized integers for Arm H.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 2.0
      maximum_memory_gb: 8

  distinguishable_outcomes:
  - outcome: >-
      Exactly one vertex with |Aut| greater than 2 in every sampled D_K in {-3, -4}
      class, and the only odd-degree isogenies from j equal to 0 preserving |Aut|
      equal to 6 are the ell equal to 3 ones with ramified kernel - with the
      D_K outside {-3,-4} fixture and the {-7,-8,-11} nearby object both returning
      |Aut| equal to 2 everywhere.
    means: >-
      D1 and D2 hold at the declared sizes. RQ-ECDLP-912694's exceptional-prime
      boundary is exactly where predicted, answered by a finite certificate-carrying
      check rather than a survey. It is NOT a cost result and NOT an attack; the
      end-to-end saving remains entirely unmeasured because the cost arm is excluded.
  - outcome: >-
      A class with D_K in {-3, -4} containing two or more vertices with |Aut| greater
      than 2.
    means: >-
      D1 is FALSE at the tested sizes. Either the class-number reasoning is
      misapplied or the F_p-isomorphism deduplication is wrong - and since twists
      share a j-invariant, the deduplication is the first suspect. Either way the
      whole frame's premise fails and the record must be superseded.
  - outcome: >-
      An F_p-rational isogeny of odd degree ell greater than 3 from the j equal to 0
      vertex whose codomain still has |Aut| equal to 6.
    means: >-
      D2 is FALSE and RQ-ECDLP-912694's exceptional-prime boundary is NOT where
      predicted. This is a direct and useful answer to that question in the
      unexpected direction, and it is more informative than the predicted outcome.
  - outcome: >-
      The nearby object D_K in {-7, -8, -11}, or the D_K outside {-3,-4} fixture,
      returns |Aut| other than 2 anywhere.
    means: >-
      The |Aut| computation is measuring something other than the F_p-rational
      automorphism group. Every reading is VOID - instrument failure, not evidence.
  - outcome: >-
      The empirical CDF of u over the completely enumerated family agrees with
      Dickman rho within the declared KS threshold at every admissible B.
    means: >-
      H-AUT-1 is validated over the enumerated range. The availability law that a
      future cost arm would depend on is consistent with the uniform-integer
      smoothness law despite the quadratic-form constraint, which is the condition
      under which commissioning that cost arm is justified.
  - outcome: >-
      The empirical CDF departs from rho beyond the declared KS threshold at some
      admissible B, or the smoothest observed f is far more or less smooth than the
      tail prediction.
    means: >-
      H-AUT-1 is FALSIFIED over the enumerated range. The quadratic-form constraint
      does bias the conductor's smoothness, the Dickman availability estimate for
      any future saving is wrong, and the direction of the deviation says whether the
      saving would be more or less available than predicted. This is a finding and
      is the more interesting of the two Arm H outcomes.

  falsification_conditions:
  - >-
    A class with D_K in {-3, -4} containing two or more vertices with |Aut| greater
    than 2. D1 is false.
  - >-
    An F_p-rational isogeny of odd degree ell greater than 3 from the j equal to 0
    vertex whose codomain still has |Aut| equal to 6. D2 is false.
  - >-
    Any vertex of a D_K outside {-3,-4} class, or any D_K in {-7, -8, -11} crater
    vertex, measured with |Aut| other than 2. The meter is void and every reading
    with it.
  - >-
    The Arm H empirical CDF of u departs from Dickman rho beyond the declared KS
    threshold at any admissible B. H-AUT-1 is falsified over the enumerated range.
  - >-
    Certificate verification fraction below 1.0 on any kernel, quotient or claimed
    membership. Nothing is reportable.

