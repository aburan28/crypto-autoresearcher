hypothesis:
  id: H-CRYPTO-37bda6
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260805-6253cf
  derived_from_idea: IDEA-20260805-6253cf

  statement: >-
    SCOPE. A pen-and-paper derivation over cost exponents, plus a grep audit of
    this repository's own committed records. NO CURVE IS INSTANTIATED, NO
    ALGORITHM IS RUN, NO ATTACK IS PROPOSED, AND NO EXPONENT IS MOVED. The
    hypothesis has four conjuncts and each is separately falsifiable.
    (C1, TWO HALF-PLANES) Writing a candidate ECDLP pipeline's cost as time
    N^{a + o(1)} and memory N^{b + o(1)} in the group order N, and matched
    Pollard rho in distinguished-point form as time N^{1/2 + o(1)} at memory
    N^{o(1)}, the candidate beats rho under an OPERATION-COUNT charge iff
    a < 1/2, and under a WIENER AT^2 charge (cost = memory times time squared)
    iff 2a + b < 1. The two admissible regions are DIFFERENT, and the wedge
    {a < 1/2 and b > 1 - 2a} is non-empty for every a < 1/2. Every point in that
    wedge is a mechanism GOAL-CRYPTO-001's completion criterion admits under one
    of its two named clauses and refuses under the other.
    (C2, BASELINE REPRODUCTION) Specialising to a balanced factor base of size
    N^{beta} with arity-m decomposition and sparse linear algebra of exponent
    pair (2 beta, beta), the balance point is beta = 1/(m+1), a = 2/(m+1),
    b = 1/(m+1), and the operation-count clause recovers the CLASSICAL threshold
    m >= 4 EXACTLY. This conjunct is a check on the instrument, not a discovery.
    (C3, THE INCREMENT) Under the AT^2 clause the same specialisation gives
    2a + b = 5/(m+1) < 1 iff m >= 5, so charging memory raises the minimum
    admissible arity by EXACTLY ONE. The forced coefficient is 5 = 4 + 1 and it
    is forced by the linear-algebra stage contributing 2 beta to time and 1 beta
    to memory. A different linear-algebra exponent pair changes the coefficient
    and therefore the increment; the sensitivity control measures how far.
    (C4, EVALUABILITY) The number of GOAL-CRYPTO-001 evidence records that state
    enough of (a, b) to be tested against the gate at all is a countable
    quantity, and it is counted rather than asserted. NO VALUE IS
    PRE-REGISTERED for C4 and that absence is deliberate.
    IF ANY CONJUNCT FAILS, the failure is reported at the conjunct that produced
    it. C1 and C2 are unconditional algebra. C3 is conditional on HEUR-GATE-2
    below and on the AT^2 functional form, which is RECALLED and must be
    verified against this corpus before C3 is reportable at all.

  mechanism: >-
    EVERY RECALLED STEP IS LABELLED, AND EVERY LABELLED STEP IS A CHECK IN THE
    EXPERIMENT RATHER THAN AN AUTHORITY.

    THE TWO CHARGES, WRITTEN OUT. Let a candidate solve ECDLP in a group of
    prime order N in time T = N^{a + o(1)} using memory M = N^{b + o(1)},
    b >= 0. Matched Pollard rho in its distinguished-point parallel form costs
    T_rho = sqrt(pi N / 4) = N^{1/2 + o(1)} group operations with
    M_rho = N^{o(1)}, since a distinguished-point table of polylogarithmic size
    suffices and the memory-heavy variants are optional rather than required.
    OPERATION-COUNT CHARGE. Candidate wins iff a < 1/2. This half-plane does not
    mention b at all.
    WIENER AT^2 CHARGE. Cost is M times T^2. Rho costs
    N^{o(1)} times N^{1} = N^{1 + o(1)}; the candidate costs N^{2a + b + o(1)}.
    Candidate wins iff 2a + b < 1. This half-plane has slope -2 in the (a, b)
    plane.
    THE WEDGE. {a < 1/2} minus {2a + b < 1} equals {a < 1/2 and b > 1 - 2a},
    which is non-empty for every a < 1/2. Concrete instance, checkable in one
    line: (a, b) = (0.45, 0.30) gives operation count 0.45 < 0.5 (WIN) and AT^2
    exponent 1.20 > 1 (LOSS). Nothing in the goal record says which of those two
    answers is the goal's answer.

    SPECIALISING TO THE ARCHITECTURE THE GOAL ACTUALLY CONTEMPLATES. Take a
    factor base of size B = N^{beta}, relations collected by testing whether a
    random group element decomposes as a sum of m factor-base elements, and a
    sparse linear-algebra stage over the resulting B by B matrix with O(m)
    entries per row.
    LINEAR ALGEBRA. Wiedemann/Lanczos-class iterative methods cost O(B^2) row
    operations at O(B) storage for the matrix and the iterates, giving time
    exponent 2 beta and memory exponent beta.
    RELATION COLLECTION. Under HEUR-GATE-1 below, a random point decomposes into
    an ordered m-tuple of factor-base elements with probability about
    B^m / (m! N) = N^{m beta - 1} / m!, so collecting about B relations needs
    about m! times N^{beta} times N^{1 - m beta} = m! times N^{1 - (m-1) beta}
    decomposition tests, each costing C_dec. Time exponent
    1 - (m-1) beta plus log_N C_dec; memory to hold the relations, exponent
    beta.
    BALANCE. Setting the two time exponents equal and holding C_dec aside for
    the moment gives 1 - (m-1) beta = 2 beta, hence
    beta = 1/(m+1), a = 2/(m+1), b = 1/(m+1).

    BASELINE REPRODUCTION, AND IT MUST PASS BEFORE ANYTHING ELSE IS REPORTED.
    Substituting into the operation-count clause, a < 1/2 iff 2/(m+1) < 1/2 iff
    m >= 4. That is the classical statement, and recovering it EXACTLY is the
    check that the derivation is embedded in the known baseline rather than
    merely resembling it. A derivation that does not recover 4 is wrong and
    nothing downstream of it may be reported.

    THE NEW LINE. Substituting into the AT^2 clause,
    2a + b = 4/(m+1) + 1/(m+1) = 5/(m+1) < 1 iff m >= 5. The memory charge moves
    the admissible-arity threshold from 4 to 5. THE FORCED INCREMENT IS EXACTLY
    ONE, forced by the coefficient 5 = 4 + 1, which is itself forced by the
    linear-algebra stage contributing 2 beta to time and 1 beta to memory. A
    reviewer falsifies this in one line by exhibiting a linear-algebra stage
    with a different (time, memory) exponent pair, which is precisely the
    intended attack surface and is listed as a proof obligation.

    WHY THE INCREMENT IS NOT A DETAIL. C_dec, the cost of deciding whether a
    point decomposes into m factor-base elements, is the cost of solving the
    m-th summation-polynomial system. Its growth in m is the central open
    quantity of this program's F1 lane (KN-OPEN-002 asks for exactly that growth
    law), and every recorded estimate is at least exponential and generally
    understood to be doubly exponential in m. Raising the required m by one
    therefore multiplies the dominant, least-understood term. A cost-model
    choice that looks like bookkeeping relocates the hard problem, and that
    relocation is the result.

    WHERE C_dec RE-ENTERS, STATED TWICE ON PURPOSE. Nothing above charged C_dec.
    Reinstating it, the relation-collection time exponent is
    1 - (m-1) beta + log_N C_dec, so a subexponential-but-superpolynomial C_dec
    eats the advantage at every m and the balance point shifts. THIS HYPOTHESIS
    DOES NOT CLAIM TO KNOW C_dec AND DOES NOT ASSUME IT IS POLYNOMIAL. What the
    gate delivers is a NECESSARY CONDITION: any candidate must satisfy
    2a + b < 1 with its OWN measured or derived a, and log_N C_dec is part of
    that a.

    THE THIRD CHARGE THE GOAL ALSO NAMES. Wall clock is neither of the above.
    Under distinguished-point parallelisation rho achieves near-linear speedup
    in the processor count w at per-processor memory still polylogarithmic,
    giving wall clock sqrt(pi N / 4) / w. A candidate holding N^b memory must
    hold it somewhere, so its wall-clock parallelisation is bounded by the
    memory it can distribute and the communication it then pays. Wall clock
    therefore favours rho more than operation count does and less than AT^2
    does, and it is the only one of the three whose evaluation requires a
    machine. This hypothesis reports the comparison needed to choose among the
    three; it does not choose, because resolving the goal record's disjunction
    is a Coordinator act (AGENTS.md rule 1).

    WHAT IS NOT DERIVED, AND IS THE WEAKEST LINK. The AT^2 functional form
    (cost = memory times time squared) is RECALLED from the Wiener lineage and
    is carried in this corpus by KN-TECH-035, KN-TECH-044 and KN-TECH-050/057,
    NONE OF WHICH WAS OPENED when the parent proposal was written. If the
    corpus's form differs from the recalled one, the coefficient 5 and therefore
    the increment of exactly one DO NOT FOLLOW, and C3 is withdrawn pending
    re-derivation rather than retained. Verifying that form is Stage 0 of
    EXP-CRYPTO-b452e1 and it can terminate the line.

  assumptions:
    - >-
      That a pipeline's cost is summarised by leading exponents. FALSE at any
      fixed curve. The gate is an ASYMPTOTIC admission test, is labelled one
      throughout, and must never be quoted at a fixed curve or in a
      concrete-cost table.
    - >-
      That sparse linear algebra over the relation matrix has (time, memory)
      exponents (2 beta, beta). This is the load-bearing structural input to the
      increment-of-exactly-one result. It is a PROOF OBLIGATION, not an
      assumption to be waved through: a stage with different exponents changes
      the coefficient 5 and hence the threshold.
    - >-
      That rho's memory is N^{o(1)}. True for the distinguished-point form and
      FALSE for memory-heavy variants. If the MATCHED baseline is chosen
      memory-heavy, the AT^2 comparison changes. The word matched is doing real
      work in the goal's own sentence, and fixing its meaning is Stage 0.
    - >-
      That the AT^2 functional form is cost = memory times time squared. RECALLED,
      NOT READ. Stage 0 verifies it against KN-TECH-035/044/050/057 and, if
      reachable, a primary source. A different form invalidates C3 only; C1's
      qualitative statement that the two clauses define different regions
      survives any charge that depends on memory at all.
    - >-
      That the corpus counts relayed into the parent proposal (131 of 229
      evidence records making a cost claim, 75 charging wall clock only, 82 never
      mentioning memory, dominated_by absent from 95 of the 131) are RELAYED from
      a scouting brief and are NOT evidence. The experiment re-derives every one
      of them by grep and reports its own numbers.

  proof_search_map:
    bottleneck: >-
      The single step at which GOAL-CRYPTO-001 decides whether a candidate
      mechanism is admitted. Thirteen batches have executed that step against a
      two-clause English disjunction with zero derived thresholds, so the step is
      currently a judgement rather than a computation. Converting it into two
      inequalities over (a, b) is decision-changing because it changes which
      candidates are fundable and, through the arity threshold, which exponent a
      successful mechanism must move.
    baseline_embedding:
      parameter_slice: >-
        The operation-count clause at the balanced factor-base optimum. There the
        classical answer is known independently of this hypothesis: an arity-4
        decomposition over a prime field would beat rho if the decomposition test
        were free. That is the exact old-method boundary the derivation must
        reproduce.
      reproduction_check: >-
        SYMBOLIC AND EXACT. Substituting beta = 1/(m+1) into a < 1/2 must yield
        m >= 4 with no rounding and no tuning. This is an integer identity
        against a known value, not a curve resembling a baseline. It is checked
        BEFORE the AT^2 clause is evaluated, and a miss terminates the package.
    observation_collision:
      observable: >-
        The pair (a, b) of leading cost exponents, and the derived scalar
        2a + b.
      distinct_preimage_search: >-
        A COLLISION EXISTS BY CONSTRUCTION, IS EXPECTED, AND IS HANDLED RATHER
        THAN HIDDEN. The map (a, b) -> 2a + b is not injective, so pipelines with
        different Pareto positions share a gate value: (0.5, 0.0) and (0.0, 1.0)
        both give exactly 1. That is not a defect of the gate but its content --
        it is what turns an incomparable Pareto pair into a total order, and the
        second null control below exhibits the collision deliberately. The
        SEPARATE and live identifiability risk is the mirror one: if every
        candidate architecture in scope had the SAME (a, b), the gate would have
        zero comparator spread and decide nothing. That risk is measured, not
        assumed away: the specialisation gives (a, b) = (2/(m+1), 1/(m+1)), which
        varies with m -- (0.50, 0.25) at m = 3, (0.40, 0.20) at m = 4,
        (0.33, 0.167) at m = 5 -- and 2a + b = 5/(m+1) = 1.25, 1.00, 0.833. The
        spread straddles the decision boundary exactly at m = 4, so the gate is
        non-degenerate on the one architecture family in scope. A gate that turns
        out constant on its intended domain must NOT be used, and that check can
        fail.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace a candidate pipeline's full cost profile by the pair (a, b) and
          replace the goal's English admission sentence by two explicit
          inequalities. Encoding obligation: exponents compose correctly under
          sequential composition (max on the time exponent, max on the peak
          memory exponent) and 2a + b is additive in the right way on the log
          scale, so the retained part propagates deterministically through a
          stage decomposition. Completeness: every pipeline with a stated stage
          decomposition has a well-defined pair. Soundness: a candidate that
          fails the inequality fails the goal's own criterion under that charge,
          which is a necessary condition and never a sufficient one. Cost loss:
          all constants, all polylogarithmic factors, all per-stage structure and
          the whole o(1).
        predicted_gain: >-
          For the attacker: nothing. For the program: a numeric admission
          constraint replacing six categorical yes/no boxes, plus the first
          statement in this corpus of which exponent a successful CRYPTO
          candidate must move and by how much, in which charge.
      - transform: observable_fiber
        proposed_object: >-
          Hold the gate value 2a + b fixed at exactly 1 and vary the forgotten
          structure: matched Pollard rho at (1/2, 0) versus a degenerate
          store-the-whole-group table at (0, 1). Both sit exactly on the AT^2
          boundary while the operation-count clause separates them (0.5 versus
          0). The intrinsic invariant proposed to distinguish them is the
          operation-count coordinate a itself.
        predicted_gain: >-
          If the gate does NOT place both objects exactly on the AT^2 boundary
          while separating them under operation count, it is not implementing the
          criterion as written and every number computed with it is void.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER, AND THE WEAK FORMS ARE EXPLICITLY NOT CLAIMED.
      C1: FOR ALL (a, b) with a < 1/2 THERE EXISTS b with b > 1 - 2a, i.e. the
      wedge is non-empty at every a below one half; the quantifier is over the
      exponent pair and not over pipelines, and no claim is made that any
      pipeline realises a given pair.
      C2 and C3: FOR ALL m >= 3, under ONE fixed linear-algebra exponent pair and
      ONE fixed charge, the threshold is the stated integer. The exponent pair may
      NOT be chosen per m, and a threshold obtained by varying the pair across m
      is inadmissible.
      C3's increment: THERE EXISTS exactly one integer d such that the AT^2
      threshold equals the operation-count threshold plus d, under the FIXED pair
      (2 beta, beta) -- and the trap being avoided is substituting the vacuous
      form (for each pair, some increment) for the claim (for the one declared
      pair, the increment is 1).
      C4: FOR ALL EV-CRYPTO records, a decidable verdict evaluable or not
      evaluable, produced by one frozen extraction rule that may not depend on the
      record.
    method_ceiling:
      strongest_certifiable_claim: >-
        AT MOST: two asymptotic admission inequalities, an arity threshold under
        each for ONE named architecture family with ONE named linear-algebra
        exponent pair, a sensitivity table over two alternative pairs, and a count
        of this goal's evidence records that carry enough exponents to be tested.
        IT CANNOT establish that any candidate exists in the wedge, cannot
        establish that any mechanism beats rho, cannot say anything about a
        pipeline's real exponents (which must be measured or derived from its own
        construction), cannot be quoted at any fixed curve or bit size, and cannot
        satisfy GOAL-CRYPTO-001's completion criterion, which requires an
        executed certificate-verified solve.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION MUST FAIL IS MATCHED
        POLLARD RHO ITSELF, at (a, b) = (1/2, 0). It must land EXACTLY on the
        boundary under both charges -- operation-count exponent 0.500 and AT^2
        exponent 2(0.5) + 0 = 1.000 -- because it IS the baseline. A gate that
        places rho strictly inside or strictly outside its own boundary is
        miscalibrated by a sign error or a factor of two, and everything computed
        with it is void. A SECOND nearby object at the other extreme: the
        degenerate table-lookup mechanism at (0, 1), which the operation-count
        clause ADMITS (0 < 1/2) and the AT^2 clause refuses (2(0) + 1 = 1). If the
        gate does not produce that embarrassment it is not implementing the
        criterion as written.
    proof_obligations:
      - claim: >-
          Under the operation-count charge a candidate at (a, b) beats rho iff
          a < 1/2, and under the AT^2 charge iff 2a + b < 1, with rho at
          (1/2, 0).
        responsibility: baseline
      - claim: >-
          The wedge {a < 1/2 and b > 1 - 2a} is non-empty for every a < 1/2.
        responsibility: correctness
      - claim: >-
          The balanced factor-base optimum is beta = 1/(m+1), a = 2/(m+1),
          b = 1/(m+1), given the relation-collection and linear-algebra exponents
          stated in the mechanism.
        responsibility: size
      - claim: >-
          The operation-count clause recovers m >= 4 exactly at that optimum.
        responsibility: baseline
      - claim: >-
          The AT^2 clause gives 5/(m+1) < 1, hence m >= 5, at that optimum, and
          the increment over the operation-count threshold is exactly 1.
        responsibility: strictness
      - claim: >-
          Sparse linear algebra over the B by B relation matrix with O(m) entries
          per row costs N^{2 beta + o(1)} time at N^{beta + o(1)} memory. This is
          the single input producing the coefficient 5 and is stated as its own
          obligation rather than absorbed into the runtime lemma.
        responsibility: memory
      - claim: >-
          C_dec is NOT charged in the clean balance, its growth in m is unknown to
          this program (KN-OPEN-002), and the gate is therefore a NECESSARY
          condition only.
        responsibility: scope
      - claim: >-
          The AT^2 functional form used is the one this corpus carries, verified
          against KN-TECH-035/044/050/057, or the cost half is reported UNDERIVED.
        responsibility: interface
      - claim: >-
          No statement is made about any concrete curve, bit size, or deployed
          system, and no candidate mechanism is asserted to exist in the wedge.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL, AND THE NULL IS THE HONEST ENTRY. This hypothesis improves
    no time exponent and no memory exponent, proposes no algorithm, and claims no
    complexity result. Filling asymptotic_claim would require a claim_kind from
    the set exponent_improvement, cofactor_improvement or constant_factor, and
    every one of the three would be false here. What the hypothesis produces is a
    CONSTRAINT SURFACE on the exponents of a future candidate, recorded below
    under derived_admission_gate, and the parent proposal's own target_complexity
    block is carried verbatim under source_target_complexity so that no
    conditioning field is softened or dropped in conversion.

  derived_admission_gate:
    operation_count_clause: >-
      Candidate at (a, b) beats matched rho iff a < 1/2. Independent of b.
    at2_clause: >-
      Candidate at (a, b) beats matched rho iff 2a + b < 1, with rho at
      (1/2, 0) landing exactly on the boundary value 1.000.
    wedge: >-
      {a < 1/2 and b > 1 - 2a}. Non-empty for every a < 1/2. Worked point
      (0.45, 0.30): operation count 0.45 (WIN), AT^2 exponent 1.20 (LOSS).
    balanced_architecture_optimum: >-
      beta = 1/(m+1), a = 2/(m+1), b = 1/(m+1) for a factor base of size
      N^{beta}, arity m, sparse linear algebra at (2 beta, beta).
    operation_count_threshold: >-
      m >= 4. This is the classical value and is the baseline-reproduction
      target, not a discovery.
    at2_threshold: >-
      m >= 5, from 5/(m+1) < 1.
    increment: >-
      EXACTLY 1, forced by the coefficient 5 = 4 + 1, which is forced by the
      linear-algebra exponent pair (2 beta, beta).
    graded_table_2a_plus_b: >-
      5/(m+1) at m = 3..8 equals 1.25, 1.00, 0.833, 0.714, 0.625, 0.556.
      Monotone decreasing, boundary crossed between m = 4 and m = 5.
    scope: >-
      Asymptotic only. Never to be quoted at a fixed curve or bit size, and never
      to be entered in a concrete-cost table.

  source_target_complexity:
    note: >-
      Carried VERBATIM from IDEA-20260805-6253cf so that the proposal's
      claim-conditioning fields survive conversion intact. Not restated, not
      softened, not summarised.
    time_exponent: >-
      No time exponent is improved and none is claimed. What this proposal
      produces is the CONSTRAINT SURFACE on the exponents of a future candidate:
      2a + b < 1 under AT^2 versus a < 1/2 under operation count, and the
      derived arity thresholds m >= 5 and m >= 4 for the balanced factor-base
      architecture. Stating the exponent that would have to move -- and by how
      much, in which model -- is the exponent-first content the target-result
      profile asks for, delivered as a gate rather than as an algorithm.
    memory_exponent: >-
      The whole point: b enters the AT^2 clause with coefficient 1 and is absent
      from the operation-count clause. At the balanced optimum b = 1/(m+1),
      i.e. 0.25 at m = 3, 0.20 at m = 4, 0.167 at m = 5.
    best_known: >-
      Pollard rho: (a, b) = (1/2, 0), operation-count exponent 0.5, AT^2 exponent
      exactly 1. No known prime-field ECDLP algorithm improves on either.
    hidden_overhead: >-
      C_dec, the summation-polynomial decomposition cost, whose growth in m is
      KN-OPEN-002 and is not known to this program. It sits inside a, is not
      charged in the clean balance, and is flagged twice above. Also: the o(1) in
      every exponent, and all communication cost, which AT^2 charges only
      implicitly through area.
    tradeoff_note: >-
      The proposal IS a time-memory tradeoff statement. Its content is that the
      goal's own admission criterion contains two clauses that disagree about
      the tradeoff, and that on the one architecture family in scope the
      disagreement is worth exactly one unit of arity.

  heuristic_assumptions:
    - id: HEUR-GATE-1
      source_id_in_proposal: H1
      formal_statement: >-
        DECOMPOSITION HEURISTIC. For a factor base of size B in a group of order
        N and arity m, a uniformly random group element admits an ordered
        decomposition into m factor-base elements with probability
        (1 + o(1)) B^m / (m! N), uniformly over the choice of factor base within
        the declared family, for B = N^{beta} with beta < 1/m.
      random_model_justification: >-
        The count of ordered m-tuples is B^m; if the sum map were a uniformly
        random function to the group, each tuple hits a fixed target with
        probability 1/N and the m! is the unordered/ordered correction. This is a
        balls-in-bins calculation under a uniform model, and it is exactly the
        assumption this program's own KN-FIND-007 sharpens (mean yield
        C(B+m-1,m)/N independent of how the factor base is chosen at fixed B) --
        so the corpus contains an internal result pointing the same way, which is
        stated here as corroboration and not as proof.
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND CORRECT. KN-FIND-007 is named in the justification as
        corroboration, and it is an internal record rather than a rigorous bound
        plus a classical distribution theorem. Listing it here would present
        corroboration as discharge. The entry is discharged only by a new record
        in which an agent that read KN-FIND-007 says what it establishes.
      validation_experiment_ids: [EXP-CRYPTO-b452e1]
      falsification_condition: >-
        A measured yield differing from B^m/(m! N) by a factor growing with N at
        fixed beta. NOTE THE ASYMMETRY, AND IT MATTERS: the gate is a NECESSARY
        condition derived from a balance point, so a yield WORSE than heuristic
        only tightens it. A yield BETTER than heuristic by a growing factor would
        loosen it and is the observation that would matter.
    - id: HEUR-GATE-2
      source_id_in_proposal: H2
      formal_statement: >-
        Sparse linear algebra over the B x B relation matrix with O(m) entries
        per row costs N^{2 beta + o(1)} operations and N^{beta + o(1)} memory.
      random_model_justification: >-
        Standard for Wiedemann/Lanczos-class methods: O(B) matrix-vector products
        at O(mB) each, storage O(mB). RECALLED, NOT READ. This is the input that
        produces the coefficient 5 and therefore the increment of exactly one, so
        it is the most load-bearing heuristic in the record.
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND CORRECT. The Wiedemann/Lanczos costs are RECALLED and no agent
        in this program has opened the source. Under AGENTS.md rule 9 a recalled
        reference may not discharge this field.
      validation_experiment_ids: [EXP-CRYPTO-b452e1]
      falsification_condition: >-
        An algorithm with a strictly better (time, memory) exponent pair for this
        matrix family. The sensitivity control anticipates this by recomputing
        the threshold under two alternatives.
    - id: HEUR-GATE-3
      source_id_in_proposal: H3
      formal_statement: >-
        Matched Pollard rho costs N^{1/2 + o(1)} time at N^{o(1)} memory.
      random_model_justification: >-
        The birthday bound with distinguished points; the memory claim is a
        property of the DP variant, not of rho in general.
      supporting_results: []
      supporting_results_note: >-
        EMPTY AND CORRECT. The van Oorschot-Wiener distinguished-point result is
        RECALLED and unread in this program; it may not discharge this field.
      validation_experiment_ids: [EXP-CRYPTO-b452e1]
      falsification_condition: >-
        A matched baseline definition that requires N^{c} memory for c > 0, which
        would move rho off its own boundary and change every comparison. This is
        a definitional risk, not an empirical one, and it is why fixing "matched"
        is Stage 0.

  structural_ingredients:
    - description: >-
        The Wiener area-time cost model for cryptanalytic hardware, in the form
        cost = memory times time squared, used to define the AT^2 clause.
      citation: 'KN-TECH-035, KN-TECH-044, KN-TECH-050, KN-TECH-057'
      provenance: recalled
      verified_by: null
      role: the memory-charging cost model that produces the coefficient 5
    - description: >-
        Parallel collision search with distinguished points, for the claim that
        rho parallelises with near-linear speedup at polylogarithmic
        per-processor memory.
      citation: 'van Oorschot and Wiener, parallel collision search'
      provenance: recalled
      verified_by: null
      role: the memory model that places rho at (1/2, 0)
    - description: >-
        The index-calculus balance beta = 1/(m+1) and the arity-4 threshold for
        prime-field ECDLP, used here as the BASELINE REPRODUCTION TARGET rather
        than as support -- something the derivation must recover, which is the
        correct use of a recalled result.
      citation: 'Semaev, Gaudry, Diem line; standard folklore'
      provenance: recalled
      verified_by: null
      role: known value the derivation must reproduce exactly
    - description: >-
        Wiedemann and Lanczos sparse linear algebra at O(B) matrix-vector
        products of O(mB) each with O(mB) storage.
      citation: 'Wiedemann; Lanczos; standard sparse linear algebra'
      provenance: recalled
      verified_by: null
      role: the exponent pair (2 beta, beta) on which the increment depends
    - description: >-
        The open growth law of the summation-polynomial decomposition cost C_dec
        in the arity m, which this program has recorded as open.
      citation: KN-OPEN-002
      provenance: internal
      verified_by: TASK-20260904-e1420d
      role: the uncharged dominant term that makes the increment consequential

  reduction_chain:
    core_problem: >-
      Decide, for a candidate ECDLP pipeline described by its leading cost
      exponents (a, b), whether it is admitted by GOAL-CRYPTO-001's completion
      criterion under an operation-count charge and under a Wiener AT^2 charge,
      and derive the minimum admissible arity of the balanced factor-base
      architecture under each.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is NO reduction from this gate to any statement
      about any concrete curve, any deployed system, any bit size, or the
      existence of any candidate mechanism. In particular nothing here bears on
      whether an arity-5 decomposition is achievable, on C_dec's growth law, or
      on the security of any curve. The gate is a NECESSARY condition on a future
      candidate and is never sufficient for anything.

  predictions:
    - metric: >-
        G1 -- baseline reproduction: the operation-count arity threshold recovered
        from the derivation at the balanced optimum
      direction: different
      minimum_effect: >-
        EXACTLY m >= 4. Integer equality, no tolerance. This is the
        baseline-reproduction target; a derivation that does not recover 4 is
        wrong and nothing downstream of it may be reported.
    - metric: >-
        G2 -- rho self-consistency: the gate value of matched Pollard rho at
        (a, b) = (1/2, 0) under both charges
      direction: different
      minimum_effect: >-
        EXACTLY 0.500 under operation count and EXACTLY 1.000 under AT^2, both on
        the boundary. Exact-equality check to three decimal places. A sign error
        or a factor-of-two error cannot survive it. If rho lands strictly inside
        or strictly outside its own boundary the gate is miscalibrated and every
        number computed with it is void.
    - metric: >-
        G3 -- the AT^2 arity threshold and its increment over G1
      direction: different
      minimum_effect: >-
        EXACTLY m >= 5, i.e. an increment of EXACTLY 1, arising from the
        coefficient 5/(m+1). Any other increment means the linear-algebra exponent
        pair used was different from (2 beta, beta), and the derivation must
        report which pair it used rather than reporting a different increment as
        the result.
    - metric: >-
        G4 -- graded spread: the six values of 2a + b = 5/(m+1) at m = 3..8, and
        whether the boundary 2a + b = 1 separates them
      direction: different
      minimum_effect: >-
        SIX distinct values, monotone decreasing, with at least one strictly on
        each side of 1. Forced values 1.25, 1.00, 0.833, 0.714, 0.625, 0.556. If
        the boundary does not separate the family, the gate is CONSTANT on its
        intended domain and must not be used as an admission test. This is the
        zero-spread self-check and it CAN fail.
    - metric: >-
        G5 -- degenerate-architecture null: the gate verdict on a mechanism that
        stores the entire group, (a, b) = (0, 1)
      direction: different
      minimum_effect: >-
        ADMITTED by the operation-count clause (0 < 1/2) and REFUSED by the AT^2
        clause (2(0) + 1 = 1, not less than 1). The forced value is precisely that
        exhaustive table lookup is admitted by one clause of the goal's own
        criterion. If the gate does not produce that embarrassment it is not
        implementing the criterion as written.
    - metric: >-
        G6 -- sensitivity: the AT^2 arity threshold recomputed with the
        linear-algebra exponent pair replaced by (3 beta, beta) and by
        (2 beta, beta/2)
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED, DELIBERATELY -- pre-registering a guess for a
        substitution not yet performed would manufacture a confirmation. What IS
        pre-registered is the reporting rule: all three pairs are reported in a
        fixed order with the declared pair first, and the record states plainly
        whether the increment is stable across them. A result stable under all
        three is far stronger than one that is not; a result that is not stable is
        reported with its dependence explicit rather than quoted without it.
    - metric: >-
        G7 -- evaluability: the count of GOAL-CRYPTO-001 evidence records
        (EV-CRYPTO series) stating enough of (a, b) to be tested against the gate
      direction: different
      minimum_effect: >-
        NO VALUE IS PRE-REGISTERED. The parent proposal's relayed corpus counts
        were taken from a scouting brief and are not evidence; guessing this
        number would be fabrication under AGENTS.md rule 9. The metric is included
        because the gate is useless if the goal's own records cannot be evaluated
        against it, and the count says whether they can. Both a high and a low
        count change what the gate is for.

  test_boundary:
    instances:
      - >-
        The two charge functions themselves, evaluated symbolically on exponent
        pairs. No curve, no group, no instance of the ECDLP is involved at any
        point.
      - >-
        Fixed control objects: matched Pollard rho at (1/2, 0); the degenerate
        whole-group table at (0, 1); the worked wedge point (0.45, 0.30).
      - >-
        The balanced factor-base family at m in {3, 4, 5, 6, 7, 8} under three
        linear-algebra exponent pairs.
      - >-
        The committed EV-CRYPTO evidence series and the committed
        GOAL-CRYPTO-001 record, read as files for the evaluability count and for
        the disjunction check.
    parameters:
      arity_range: '3 to 8 inclusive'
      linear_algebra_pairs: ['(2 beta, beta)', '(3 beta, beta)', '(2 beta, beta/2)']
      declared_pair: '(2 beta, beta)'
      rho_position: '(a, b) = (1/2, 0)'
      at2_form: 'cost = memory times time squared; RECALLED, verified in Stage 0'
      charge_report_order: 'operation count first, then AT^2, then wall clock, fixed'
      arithmetic: 'exact rational arithmetic; decimals reported to three places only for display'
    implementation: >-
      Pen-and-paper derivation transcribed into a checked script. Python 3
      standard library with fractions.Fraction for the exponent arithmetic so
      that the exact-equality checks at G1, G2, G3 and G5 are exact rather than
      floating point. NO EXTERNAL DEPENDENCY IS REQUIRED and none may be
      introduced. The corpus audit is grep and YAML reading only.
    budget:
      stage0_wall_clock_seconds: 3600
      stage1_wall_clock_seconds: 600
      stage2_wall_clock_seconds: 1800
      total_wall_clock_seconds: 6000
      maximum_memory_gb: 8
      note: >-
        The dominant cost of this hypothesis is READING -- verifying the AT^2
        form against the corpus technique entries -- not compute. The derivation
        itself is a few dozen exact rational operations.

  falsification_conditions:
    - >-
      F1 (INSTRUMENT) -- the derivation does not recover m >= 4 under the
      operation-count charge. The specialisation is wrong and NOTHING downstream
      of it is reportable. Checked before the AT^2 clause is evaluated.
    - >-
      F2 (CALIBRATION) -- matched rho at (1/2, 0) does not land exactly on its own
      boundary under both charges. The gate is miscalibrated and every value
      computed with it is void.
    - >-
      F3 (SOURCE) -- the corpus's AT^2 form is not cost = memory times time
      squared. The coefficient 5, and therefore the increment of exactly one, do
      not follow. C3 is WITHDRAWN pending re-derivation with the corpus's form;
      C1's qualitative statement survives and is reported alone.
    - >-
      F4 (ZERO SPREAD) -- the graded table 5/(m+1) is constant or non-monotone in
      m, or the boundary fails to separate the family. The gate has no comparator
      spread on its intended domain and MUST NOT be used as an admission test.
    - >-
      F5 (ARCHITECTURE DEPENDENCE) -- a linear-algebra exponent pair is exhibited
      that makes the coefficient equal 4, so the AT^2 threshold coincides with the
      operation-count threshold. The increment-of-exactly-one result is then
      architecture-dependent and must be RESTATED with its dependence rather than
      quoted as a bare number.
    - >-
      F6 (DISJUNCTION ALREADY RESOLVED) -- a committed GOAL-CRYPTO-001 decision is
      found that resolves the wall-clock-or-operation-count disjunction to one
      named charge. This hypothesis's central complaint is answered; the record
      reports and cites that decision instead of claiming the gap.
    - >-
      F7 (THE PLANNED NEGATIVE, AND IT IS A DELIVERABLE) -- every EV-CRYPTO record
      turns out to state enough exponents to be evaluated, so the gate adds no
      information the goal did not already have. That is a clean negative for the
      proposal's motivating complaint and it MUST be reported with its exact
      boundary and with forward guidance, not buried.
    - >-
      F8 (SCOPE OVERREACH, A FAILURE OF THE REPORT RATHER THAN OF THE
      MATHEMATICS) -- any output of this hypothesis quoting a gate value at a
      fixed curve or bit size, entering it in a concrete-cost table, asserting
      that a candidate exists in the wedge, or asserting that any goal record
      should be amended. Amending a goal is a Coordinator act and this hypothesis
      neither performs nor requests one.

  interpretation_limits:
    - >-
      NO ATTACK, NO SOLVE, NO EXPONENT IMPROVEMENT IS CLAIMED. Pollard rho remains
      the ECDLP baseline and the delta on every attack axis is exactly zero and is
      stated as zero. What moves is the ADMISSION THRESHOLD a future mechanism must
      clear, which is a statement about this program's own criterion and about
      nothing in the world.
    - >-
      The increment-of-exactly-one result is SCOPED to the balanced factor-base
      architecture with sparse linear algebra of exponent pair (2 beta, beta),
      under the AT^2 form as carried in this corpus. Outside that architecture it
      is not claimed, and the sensitivity control measures how far it travels.
    - >-
      Every exponent statement here suppresses subexponential and polylogarithmic
      factors, and at any realisable curve size those factors can exceed the gap
      between the half-planes. The gate is an ASYMPTOTIC admission test and must
      never be quoted at a fixed curve.
    - >-
      C_dec is NOT charged in the clean balance. The gate is a NECESSARY condition
      only. A candidate satisfying it has not been shown to beat rho; a candidate
      failing it has been shown not to, under the named charge and the named
      architecture.
    - >-
      A DERIVED GATE IS NOT A MEASUREMENT. Nothing here observes any pipeline. A
      candidate's real (a, b) must be measured or derived from its own
      construction.
    - >-
      Claim tier: theory and derivation, plus a repository audit. No run, no
      curve, no certificate, and NOT toy, medium or crypto evidence about the
      ECDLP. It may never be cited in a cost or complexity statement about any
      concrete system.
    - >-
      Resolving GOAL-CRYPTO-001's wall-clock-or-operation-count disjunction into
      one named charge is a COORDINATOR ACT (AGENTS.md rule 1). This hypothesis
      supplies the comparison needed to choose and proposes no change to the
      goal's objective, completion criteria, next_action or status.

