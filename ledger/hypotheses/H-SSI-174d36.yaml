hypothesis:
  id: H-SSI-174d36
  question_id: RQ-SSI-3e3f54
  idea_ids:
  - IDEA-20261014-6e60f1
  statement: In the supplied maximal Hurwitz order of B(-1,-1)=B_(2,infinity), full-rank
    trace Gram determinant equals 4 times squared lattice index; determinant, integrality
    and ring closure must be checked separately.
  mechanism: Exact quaternion products/conjugation in basis (1,i,j,(1+i+j+k)/2), determinant
    of reduced-trace pairing and containment index; compare fixed noncommuting and
    short/commuting candidate selections.
  assumptions:
  - Input order/lattice is supplied and certified inside exact arithmetic, not inferred
    from a curve.
  proof_search_map:
    bottleneck: Certify explicit maximal orders and embeddings at another characteristic,
      then realize supersingular maps and independently verify torsion action.
    baseline_embedding:
      parameter_slice: Full Hurwitz basis has determinant 4 and multiplication closure
      reproduction_check: Frozen independent exact oracle and regression fixture in
        the bound driver/test source.
    observation_collision:
      observable: Exact reduced-trace Gram determinant; Integral full-rank lattice
        index and volume relation; Multiplicative closure and rank; Commutators and
        complete candidate selection operation counts
      distinct_preimage_search: Equal rank/determinant can describe lattices with
        different closure; nonzero commutator alone does not establish maximality.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: Equal rank/determinant can describe lattices with different
        closure; nonzero commutator alone does not establish maximality.
      predicted_gain: Discriminate necessary assumptions; no performance gain asserted.
    quantifier_order: For every explicitly enumerated supplied order and permitted
      basis in frozen parameters, compute a witness depending on that instance; no
      uniform finite-field map or unknown-order discovery algorithm is asserted.
    method_ceiling:
      strongest_certifiable_claim: One explicitly supplied maximal quaternion order
        at p=2, without correspondence to curve endomorphism maps or arbitrary p.
      nearby_object_control: Characteristic prime ell=2 excluded from etale torsion
        certification
    proof_obligations:
    - claim: Correct exact algebra and independent oracle agree within supplied-order
        scope.
      responsibility: correctness
    - claim: Output distinguishes hypotheses failing assumptions from a mathematical
        counterexample within valid assumptions.
      responsibility: scope
    - claim: Certify explicit maximal orders and embeddings at another characteristic,
        then realize supersingular maps and independently verify torsion action.
      responsibility: interface
