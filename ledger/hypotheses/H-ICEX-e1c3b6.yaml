  distinguishable_outcomes:
    - outcome: >-
        Universality holds with zero exceptions, S1 and S2 hold on every conductor-one class, and the
        smooth-part difference matches the pre-registered constrained-model prediction, tracking the
        smallest excluded prime rather than |D_0|.
      meaning: >-
        The lane's recurring intuition is refuted in the form it is usually stated, by an identity plus a
        density argument, and the measurement locates the only real effect at the smallest excluded
        prime. The result is exact over its range and asserts nothing about any instance.
    - outcome: >-
        The smooth part is systematically LARGER on special-j classes and survives every control.
      meaning: >-
        Special-j generation produces weak orders at a higher rate. Work stops for independent review;
        the finding, if it survives, is a population statement about curve generation and never an
        exponent.
    - outcome: >-
        The effect appears only at D_0 = -3 and -4 and not at the large class-number-one discriminant.
      meaning: >-
        The measurement is tracking the automorphism group, not the arithmetic. The arithmetic reading is
        void and the result folds back into the existing automorphism-discount null.
    - outcome: >-
        The curve-free constrained-integer null reproduces the difference.
      meaning: >-
        The smooth-part shift belongs to congruence-restricted integers. The curve framing is withdrawn
        and the finding is restated at that scope.
    - outcome: >-
        A prime divides the order that does not split and does not divide 2D.
