hypothesis:
  id: H-ICEX-e1c3b6
  question_id: RQ-JINV-8fc13a
  added: '2026-09-04'
  derived_from_idea: IDEA-20260901-c4730d
  statement: >-
    THE GROUP ORDER OF EVERY ORDINARY CURVE IS A VALUE OF ITS OWN CM NORM FORM, AND THE CONSTRAINT
    THAT FACT IMPOSES IS THE SAME STRENGTH ON EVERY CURVE. Five separable statements.
    (U) UNIVERSALITY, A DERIVATION AT ZERO COMPUTE. For an ordinary curve over a prime field with
    trace t, Frobenius discriminant D = t^2 - 4p = D_0 f^2 < 0 and group order #E = p + 1 - t, one
    has 4 #E = (t-2)^2 + |D_0| f^2. Hence for every prime q dividing #E with q not dividing 2D, D is
    congruent to a square modulo q, so q SPLITS in the imaginary quadratic field of discriminant
    D_0. The set of split primes has natural density exactly one half for every non-square D_0.
    THEREFORE THE EXISTENCE AND THE STRENGTH OF THE CONSTRAINT ARE |D_0|-INDEPENDENT, and the lane's
    recurring intuition that a small discriminant makes the group order arithmetically special is
    wrong in the form it is usually stated. What small |D_0| changes is only WHICH half is excluded.
    (S1) THE j = 0 CONSEQUENCE, EXACT. At D_0 = -3 with conductor one, 4 #E = (t-2)^2 + 3, so t-2 is
    odd, an odd square is one modulo eight, and #E is 4 modulo 8 over 4 - hence ODD. A conductor-one
    j = 0 class has no rational two-torsion.
    (S2) THE j = 1728 CONSEQUENCE, EXACT. At D_0 = -4 with conductor one, t is even and
    #E = m^2 + 1 with m = (t-2)/2, so every odd prime divisor of #E is one modulo four and the
    two-adic valuation of #E is at most one.
    (M) THE MEASUREMENT. Compare the B-smooth part and the small-factor count of #E for special-j
    classes against a matched generic-D_0 null at the same prime and the same bit length, and
    against a matched-automorphism control at small |D_0| with automorphism group of order two. The
    pre-registered expectation is that special-j classes are systematically ROUGHER, because the
    exclusion of the single largest contributor to the smooth part of a random integer is not
    compensated by the doubled divisibility on the allowed odd primes - i.e. special j would be
    SAFER on this axis. The direction that would matter, and that halts the record, is the opposite
    one.
    (X) THE SCOPE LIMIT, STATED BEFORE THE MEASUREMENT. On a prime-order subgroup the entire content
    of the tracked profile is the single statement that the group order is a split prime, which is
    equivalent to the existence of the efficiently computable endomorphism eigenvalue and is
    therefore the automorphism-discount NULL restated. The only axis this hypothesis can move is the
    DENSITY OF WEAK INSTANCES IN CURVE GENERATION - a data-axis statement about a population, never
    a time-axis statement about an instance. No exponent moves.
  mechanism: >-
    Frobenius satisfies its characteristic equation and the group order is the norm of Frobenius
    minus one, so #E is the value of the norm form of the CM order at a specific element. That is
    why the identity is an identity and not a coincidence, and it is why the arithmetic of #E is
    governed by the splitting behaviour of the imaginary quadratic field: an integer represented by a
    binary quadratic form of a given discriminant can only have prime divisors at which the
    discriminant is a square. The inferential mistake the lane is at risk of making - and the one
    this hypothesis removes - is to infer from "small |D_0| gives a strong constraint" that special j
    is arithmetically distinguished. Every ordinary curve carries the same strength of constraint,
    because the density of the split primes is one half for every non-square discriminant. What small
    |D_0| changes is that the excluded half is a SHORT, FIXED, SMALL-MODULUS congruence condition
    rather than an unstructured one, and the only place a fixed condition carries arithmetic weight is
    at the very smallest primes, where individual primes hold non-negligible mass. Hence S1 and S2,
    which are exactly the statements at the prime two, and hence a measurement targeted at the
    small-prime END of the profile rather than at its density.
    WHY TWO CURVE-FREE NULLS ARE MANDATORY AND WHAT EACH ONE SEPARATES. First, the profile depends on
    the class only through the prime and the trace, so it can be computed by enumerating trace values
    arithmetically WITHOUT CONSTRUCTING ANY CURVE - which both extends the reachable range by orders
    of magnitude and shows that no coordinate, no point and no group law is involved in the
    measurement. Second, and more sharply, the predicted signature is a smooth-part shift induced by a
    congruence restriction on the allowed prime divisors, and that signature is reproduced by RANDOM
    INTEGERS drawn from the same interval and restricted to the same split-prime set. If the
    constrained random-integer null reproduces the special-versus-generic difference, the effect is a
    statement about congruence-restricted integers, not about elliptic curves - which is exactly the
    reading the standing scope constraint of the pfdr-battery lane exists to force.
  assumptions:
    - >-
      The curve is ordinary over a prime field with p greater than three, the discriminant is negative,
      and the identity is re-verified numerically for every class before use.
    - >-
      The cases where q divides 2D are enumerated and reported separately rather than assumed away.
    - >-
      The density-one-half statement for split primes is standard and is used, not re-derived; it is
      asymptotic in q, so the effective density inside any tested window can deviate and the window is
      reported.
    - >-
      THE UNIT OF ANALYSIS IS THE ISOGENY CLASS, NOT THE CURVE. The profile is a class invariant by
      Tate's theorem, so treating the curves of a class as independent observations would inflate every
      sample size by the class size and manufacture significance from nothing. Per-curve pooling is
      FORBIDDEN by this hypothesis.
    - >-
      Conductor one is part of the quantifier for S1 and S2. At larger conductor the congruence
      computations change and NO claim is made; the conductor arm is measured and reported separately,
      never pooled.
    - >-
      Toy scale, with #E factored outright so that every valuation is exact rather than estimated. No
      statement is made about any cryptographic parameter.
  proof_search_map:
    bottleneck: >-
      Not an algorithmic bottleneck but an inferential one. The lane repeatedly reasons from "small
      |D_0| constrains the arithmetic" to "special j is arithmetically distinguished", and no record
      has stated the constraint precisely enough to see that its strength is |D_0|-independent. The
      bottleneck removed is the missing precise statement, and removing it costs one identity.
    baseline_embedding:
      parameter_slice: >-
        Generic |D_0|, of the order of the prime. There the universality statement still holds with the
        same density, and the measured smooth-part distribution must reproduce the standard
        random-integer-in-the-Hasse-interval behaviour the campaign already assumes. A record finding
        special behaviour in this slice would be measuring its own instrument.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, BLOCKING. Over ALL classes at the committed toy primes, the measured
        probability that a small prime divides the group order, pooled over all classes, must agree
        with the standard unconditional heuristic to within the exact binomial interval, for each of
        the smallest primes. This checks the enumeration and the divisibility accounting before any
        special-j cell is compared, and it is a quantity no arm of this hypothesis disputes.
    observation_collision:
      observable: >-
        The splitting-and-valuation profile of the group order, and the derived scalars - the logarithm
        of the B-smooth part and the small-factor count.
      distinct_preimage_search: >-
        TWO COLLISIONS ARE IDENTIFIED IN ADVANCE. (i) EXPECTED AND INFORMATIVE: every curve in an
        isogeny class has the SAME profile, so the observable identifies a CLASS and never a curve; any
        per-curve claim from it would be wrong by construction, and the design reports per class.
        (ii) THE DANGEROUS ONE, WHICH IS THE HYPOTHESIS'S OWN CLAIM: a special-j class and a generic
        class at the same prime can have the same small-factor count and the same smooth part for
        entirely different reasons - one because the prime two is excluded and the odd primes are
        doubled, the other because every prime is at its unconditional rate. EXHIBITING THAT COLLISION
        AT A RATE CONSISTENT WITH UNIVERSALITY IS THE DELIVERABLE, and a record reporting a special-j
        smooth-part effect without running this search would be reporting the constraint and calling it
        a bias.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The matched-prime family: at each toy prime, the set of ALL ordinary isogeny classes, labelled
          by discriminant and by automorphism order, so that special j, small |D_0| with automorphism
          order two, and generic discriminant are three cells of one exhaustive enumeration rather than
          three separately drawn samples.
        predicted_gain: >-
          Encoding is exact, since the enumeration is complete at each prime and no sampling is
          involved; the negative is therefore exact over its range rather than statistical. Transfer
          beyond the tested prime range is DECLARED UNMET.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "the group order is constrained to a density-one-half prime set" fixed and
          vary the forgotten structure, namely |D_0|. The intrinsic invariant distinguishing the
          resulting objects is the SIZE OF THE SMALLEST EXCLUDED PRIME, which is two for D_0 = -3 and
          is typically large and unpredictable for a generic discriminant.
        predicted_gain: >-
          Relocates the question from the density of the constraint, where there is nothing to find, to
          the smallest excluded prime, where there is an exact and checkable statement - and gives the
          design a decay parameter whose failure to move the signal is the canonical artifact tell.
    quantifier_order: >-
      FOR U: FOR ALL primes greater than three, FOR ALL ordinary curves over that prime, FOR ALL primes
      q dividing the group order with q not dividing 2D, q splits. The universal quantifier over q
      comes last and is the content.
      FOR S1: FOR ALL primes greater than three in the relevant residue class, FOR ALL ordinary curves
      with D_0 = -3 AND conductor one, the group order is odd. The conductor hypothesis is part of the
      quantifier and dropping it makes the statement false, which is why the conductor arm is separate.
      EXPLICITLY NOT CLAIMED, WEAKER: "for every special-j curve there exists a small prime not
      dividing the order", which is vacuous. EXPLICITLY NOT CLAIMED, STRONGER: any statement that the
      smooth-part distributions differ. That is measured, and universality is the pre-registered
      expectation.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the tested primes, over the complete enumeration of ordinary isogeny classes, the group
        orders of special-j classes do or do not differ from matched generic classes in B-smooth part
        and small-factor count, with any difference attributable to the smallest excluded prime rather
        than to the density of the constraint; and every conductor-one D_0 = -3 class has odd order. IT
        CAN NEVER CERTIFY anything about a fixed prime-order instance, anything about the exponent,
        anything about relation collection or the automorphism discount, anything at cryptographic
        scale, and nothing about the hardness of the ECDLP.
      nearby_object_control: >-
        THE OBJECT WHERE THE HOPED-FOR CONCLUSION MUST FAIL: a large class-number-one discriminant that
        is "small" in the sense the lane usually means but for which the excluded prime set is not a
        short congruence condition - chosen so that the prime two is inert there as it is at D_0 = -3
        while the automorphism group has order two. A method reporting a special-j effect at D_0 = -3
        but not there is detecting the AUTOMORPHISM; a method reporting it at both is detecting the
        EXCLUDED PRIME. The pair separates the two hypotheses and it costs nothing.
    proof_obligations:
      - claim: The identity holds for every ordinary class in the enumeration.
        responsibility: correctness
      - claim: q dividing the order with q not dividing 2D implies q splits.
        responsibility: correctness
      - claim: The split-prime set has density exactly one half for every non-square discriminant.
        responsibility: baseline
      - claim: Conductor-one D_0 = -3 forces an odd order.
        responsibility: strictness
      - claim: Conductor-one D_0 = -4 forces the stated square form and a two-adic valuation of at most one.
        responsibility: strictness
      - claim: The profile is constant on an isogeny class, so the unit of analysis is the class.
        responsibility: interface
      - claim: On a prime-order subgroup the whole profile reduces to the automorphism-discount null restated.
        responsibility: scope
      - claim: Any measured effect is on the density of weak instances in curve GENERATION, not on the cost of a fixed instance.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-SPL-1
      formal_statement: >-
        CONSTRAINED DIVISIBILITY. For a small prime q and an ordinary isogeny class drawn uniformly at a
        fixed prime, conditional on the fundamental discriminant: the probability that q divides the
        group order is zero up to an explicitly enumerable exceptional set if q is inert, and is twice
        the unconditional rate if q splits, the two averaging to the unconditional rate; and conditional
        on the discriminant the events for distinct q are asymptotically independent, so the logarithm
        of the smooth part has the sum-of-independent-terms law the pre-registered prediction uses.
      random_model_justification: >-
        THE VANISHING HALF IS NOT HEURISTIC AT ALL: inertness together with the identity FORCES q not to
        divide the order unless q divides 2D, so the first line is a theorem with an explicitly
        enumerable exceptional set. WHAT IS HEURISTIC is the DOUBLING on the split half and the
        independence across q. The classical statement imitated is the standard heuristic that group
        orders behave like random integers in the Hasse interval with a class-number weighting,
        restricted to the residue classes the discriminant permits - the same move by which the smooth
        number density function is applied to algebraically produced integers. WHY IT COULD FAIL,
        STATED HONESTLY: the order is a value of a quadratic form, not a random integer, and values of
        quadratic forms have genuine biases in their divisor counts driven by the class group of the
        form; at small |D_0| with class number one every split prime is the norm of a principal ideal
        while at larger class number only a fraction of them are. That is a real discriminant-dependent
        effect on the DIVISOR STRUCTURE that this heuristic does not model and that the measurement may
        see.
      supporting_results:
        - >-
          The standard heuristic for the probability that a small prime divides the order of a random
          curve, and the smooth-number density function with its uniformity range. RECALLED ONLY; no
          agent in this program has opened either source, so both are pointers for the reviewer and
          support nothing. The unconditional rate is MEASURED directly as a blocking fixture rather
          than assumed from them.
      validation_experiment_ids:
        - EXP-ICEX-e18b45
      falsification_condition: >-
        The measured divisibility probability on the split half differs from twice the unconditional
        rate by more than three binomial standard errors, pooled over the complete enumeration, for any
        of the declared small primes. The heuristic is refuted, the pre-registered predictions are void,
        and the distributional arm reports raw comparisons only.
    - id: HEUR-SPL-2
      formal_statement: >-
        CLASS-NUMBER NEUTRALITY OF THE DIVISOR STRUCTURE. Conditional on the splitting profile, the
        number of prime divisors of the group order below the bound does not depend on the class number
        of the discriminant.
      random_model_justification: >-
        RIGOROUS PART: none, and this is the hypothesis's weakest assumption, stated as such. It is the
        one place where the class number, and therefore genuinely discriminant-dependent class-group
        structure, could enter the arithmetic of the group order. DISTRIBUTION IMITATED: none. It is a
        null hypothesis offered so that its failure is a finding rather than a surprise.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ICEX-e18b45
      falsification_condition: >-
        A monotone association between the small-factor count and the class number at matched splitting
        profile. The heuristic is refuted and the finding is that class-group SIZE, not discriminant
        size, is the operative variable on this axis - a genuine result for the lane which must be
        routed to the records that measure class-group structure on other functionals.
  structural_ingredients:
    - description: >-
        The parent proposal's derivation of the universality identity and its two exact special-j
        consequences, its matched-prime design, its matched-automorphism control and its
        smallest-excluded-prime decay parameter.
      citation: ledger/proposals/IDEA-20260901-c4730d.yaml
      provenance: internal
      verified_by: >-
        TASK-20260904-8f2f95, coordinator design session, full read of the record on 2026-09-04.
    - description: >-
        The same identity in rearranged form, used elsewhere in this lane as the design device that
        annihilates the group-order confound in a matched-order family. NO NOVELTY IS CLAIMED FOR THE
        IDENTITY; only for the arithmetic consequence, which that record does not draw.
      citation: H-JINV-5a0b9e
      provenance: internal
      verified_by: >-
        IDEA-20260901-c4730d records a full read of that hypothesis on 2026-09-01 and quotes its step
        zero. TASK-20260904-8f2f95 read the proposal and did NOT open the hypothesis record; the
        quotation is second-hand and the contract re-reads it in its zero-compute stage.
    - description: >-
        The record establishing that small |D_0| with automorphism order two confers exactly zero
        automorphism discount, which reaches the same conclusion as universality by a disjoint route
        and therefore serves as a check on it rather than as a restatement.
      citation: H-JINV-db2776
      provenance: internal
      verified_by: >-
        IDEA-20260901-c4730d records a full read of that hypothesis on 2026-09-01.
        TASK-20260904-8f2f95 did not open it and relies on it for positioning only.
    - description: >-
        Tate's isogeny theorem, which makes the tracked profile an isogeny-class invariant and therefore
        fixes the unit of analysis.
      citation: 'J. Tate, Endomorphisms of abelian varieties over finite fields'
      provenance: recalled
      verified_by: null
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        fraction of prime divisors q of the group order, over the complete class enumeration at each
        tested prime, that split, excluding q dividing 2D
      direction: different
      minimum_effect: >-
        EXACTLY 1.000 on every class, with zero exceptions. Any exception falsifies the universality
        derivation and first indicts the implementation, since the statement is an identity plus one
        congruence.
    - metric: >-
        two-adic valuation of the group order over conductor-one D_0 = -3 classes
      direction: lower
      minimum_effect: >-
        EXACTLY 0 on every such class. A single even order among them falsifies S1.
    - metric: >-
        two-adic valuation over conductor-one D_0 = -4 classes, and the indicator that the order minus
        one is a perfect square
      direction: lower
      minimum_effect: >-
        Valuation at most one on every such class, and the order minus one a perfect square on every
        such class. A single violation falsifies S2.
    - metric: >-
        mean of the logarithm of the B-smooth part over special-j classes minus the same over matched
        generic classes at the same prime, in nats, with an exact permutation distribution over class
        labels
      direction: lower
      minimum_effect: >-
        The PRE-REGISTERED EXPECTATION IS A NEGATIVE DIFFERENCE of the order of the expected two-part of
        a random integer, attenuated by the doubling on the allowed odd primes; the exact predicted
        value is computed in the zero-compute stage from the constrained model BEFORE any data is read,
        and no sharper number is invented here. A difference of the OPPOSITE sign - special-j classes
        smoother - is the outcome that matters and halts the record for independent review.
    - metric: >-
        the same difference computed for the matched-automorphism control at small |D_0| with
        automorphism order two, including the large class-number-one discriminant where the prime two is
        also inert
      direction: different
      minimum_effect: >-
        If the D_0 = -3 effect is ARITHMETIC it must ALSO appear wherever the smallest excluded prime is
        two, in particular at the large class-number-one discriminant; if it appears only at D_0 = -3 and
        -4 it is tracking the AUTOMORPHISM group and the arithmetic reading is void. This is the single
        most informative cell in the design and it is free.
    - metric: >-
        the small-factor count, split by whether the smallest excluded prime is two
      direction: different
      minimum_effect: >-
        A STEP on the smallest-excluded-prime axis, not a smooth trend in |D_0|. The predicted SHAPE is
        stated in advance: a quantity that instead decays smoothly with |D_0| is measuring class-number
        or conductor effects rather than exclusion, and the interpretation must change accordingly.
    - metric: >-
        the same smooth-part difference computed on a CURVE-FREE constrained-integer null - integers
        drawn from the same interval and restricted to the same split-prime set, with no curve, no trace
        and no isogeny class
      direction: different
      minimum_effect: >-
        Within the declared tolerance of the class arms. Agreement means the smooth-part shift is a
        property of congruence-restricted integers and MUST NOT be restated as a statement about
        elliptic curves.
  test_boundary:
    instances:
      - >-
        Complete enumeration of ordinary isogeny classes at a declared set of toy primes, with the group
        order factored outright so every valuation is exact.
      - >-
        A CURVE-FREE trace-enumeration arm: the profile computed arithmetically from the prime and the
        trace with no curve constructed, extending the prime range by orders of magnitude.
      - >-
        A CURVE-FREE constrained-integer arm: uniform integers from the same interval, restricted to the
        same split-prime set, with no curve and no trace.
      - >-
        A matched-automorphism control at several small discriminants with automorphism order two,
        including one large class-number-one discriminant where the prime two is inert.
      - >-
        A conductor arm at conductor greater than one, reported separately and never pooled.
    parameters:
      primes: 'declared before any measurement; the full set in the range is pre-registered so that the special-j arm has one class per prime and its power comes from sweeping primes'
      smoothness_bound: 'declared in advance, with the whole analysis repeated at one order of magnitude below and above it as a robustness sweep, all three reported'
      unit_of_analysis: 'the isogeny class; per-curve pooling is forbidden'
      matching: 'same prime and same order bit length for the generic null; automorphism order and smallest excluded prime as the two control axes'
    implementation: >-
      Exact integer arithmetic and outright factorisation under experiments/EXP-ICEX-e18b45/driver/,
      with class certification against the mass formula and the Deuring weighting honoured at the two
      special j-invariants. The trace-enumeration arm constructs no curve at all.
    budget:
      wall_clock_seconds_total: 21600
      maximum_memory_gb: 8
      maximum_runs: 10
  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY). A prime dividing the group order that does not divide 2D and does not
      split. Universality is false, which contradicts an identity plus one congruence, so the
      implementation is indicted first and independent review is required.
    - >-
      F2. An even order on a conductor-one D_0 = -3 class, or an order minus one that is not a perfect
      square on a conductor-one D_0 = -4 class. S1 or S2 is false as stated and is withdrawn by a
      superseding record.
    - >-
      F3 (THE INTERESTING FALSIFIER, AND THE ONLY OUTCOME THAT COULD MATTER). The smooth part
      systematically LARGER on special-j classes than on matched generic classes at the same prime,
      surviving the permutation test and the matched-automorphism control. Special-j curve generation
      would then produce weak orders at a higher rate - an advantage on the data axis. WORK STOPS for
      independent review before any record states it.
    - >-
      F4 (THE MAIN NEGATIVE AND THE INTENDED DELIVERABLE). No difference beyond the pre-registered
      constrained-model prediction, and any difference that does appear tracking the SMALLEST EXCLUDED
      PRIME rather than |D_0| and appearing equally at the large class-number-one discriminant where the
      automorphism group has order two. The lane's "small discriminant means arithmetically special"
      intuition closes with a named obstruction - the split-prime constraint has density one half for
      every non-square discriminant - and the record must name its successors or it has not finished.
    - >-
      F5. The twist control fails, i.e. the profile is equal for a class and its twist. The instrument is
      reading the j-invariant or the discriminant rather than the group order and every number is void.
    - >-
      F6. The blocking fixture fails, i.e. pooled small-prime divisibility does not match the
      unconditional heuristic. The enumeration or the factorisation is wrong; the line halts before any
      special-j cell is compared.
    - >-
      F7. The CURVE-FREE constrained-integer null reproduces the special-versus-generic difference. The
      effect is a statement about congruence-restricted integers and not about elliptic curves; the
      curve reading is withdrawn.
    - >-
      NOT A FALSIFICATION. Factorisation timing out at the largest prime. That is an infrastructure
      outcome, reported with the largest prime reached, and never evidence about smooth parts.
  interpretation_limits:
    - >-
      Claim tier toy. Complete enumeration over a declared prime range and nothing beyond; no statement
      about any cryptographic parameter. The universality identity and the two consequences are
      DERIVATIONS, and the enumeration verifies the implementation over a finite range, not the
      statements.
    - >-
      NO ECDLP SPEEDUP OF ANY KIND, AND THE HONEST CEILING IS STATED PLAINLY. On a prime-order subgroup
      the entire content of the tracked object is the single statement that the order splits, which is
      the automorphism-discount NULL restated. The only axis this hypothesis can move is the density of
      weak instances in curve GENERATION.
    - >-
      NO ATTACK-COST STATEMENT MAY BE MADE FROM THIS HYPOTHESIS. Converting a smooth-part distribution
      into an expected attack cost requires a Pollard rho constant measured in this program on
      comparable instances, and no such measurement exists. The deliverable is the distribution of
      smooth parts and the density of weak orders, not a cost.
    - >-
      Scoped to ordinary prime-field curves, conductor one for S1 and S2, and the tested prime range.
      Supersingular curves are out of scope and extension fields carry more structure.
    - >-
      Special-j classes are FEW: at most one per prime per special discriminant, so the special arm has
      a single class per prime and its power comes only from sweeping primes. The full prime set is
      pre-registered and the distribution over primes is reported, never a single cell.
    - >-
      If the curve-free constrained-integer null reproduces the difference, the supported statement is
      about integers restricted to a congruence class set and may NOT be restated as a statement about
      elliptic curves or the ECDLP.
