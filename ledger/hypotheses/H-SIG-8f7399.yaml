    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BOOL-1
      formal_statement: >-
        None load-bearing for the containment. FOR ALL boolean systems and FOR
        ALL admissible triples, the enumerated vector lies in the kernel of the
        Macaulay matrix; this is an identity, not a distributional assumption.
      random_model_justification: >-
        Not applicable -- the statement is algebraic. Recorded explicitly to note
        that this hypothesis's core is unconditional, unlike the semi-regularity
        assumptions the rest of the lane carries.
      supporting_results:
        - >-
          f_j (mu f_i) + f_i (mu f_j) = 0 in any commutative ring; f^2 = f for
          every element of F_2[x]/(x_i^2 + x_i), which is isomorphic to
          F_2^{2^N}.
      validation_experiment_ids: [EXP-SIG-4fe529]
      falsification_condition: >-
        Any element of the computed U_D failing to lie in the measured kernel.
    - id: HEUR-BOOL-2
      formal_statement: >-
        FOR systems with fixed (n, D, degree histogram), |U_D| and the rank
        correction increase with support concentration (the number of variable
        blocks the supports occupy, decreasing).
      random_model_justification: >-
        Under a uniform random support of size s over 2n variables, the
        hitting-set condition "mu meets every support monomial" has probability
        decaying in s and in 2n; under a support confined to b blocks it does
        not decay in the same way. A plausibility argument, NOT a derivation, and
        the load-bearing heuristic of the support-geometry reading.
      supporting_results:
        - >-
          EV-SIG-006: extra_6 at n = 9 is 4986 (N0, spread) < 7226 (N1, matched)
          < 8897 (sem) -- monotone in concentration, but this is three points and
          is consistency, not confirmation.
      validation_experiment_ids: [EXP-SIG-4fe529]
      falsification_condition: >-
        A flat or non-monotone |U_D| across a graded concentration sweep at fixed
        histogram, or equal corrections across N0, N1 and the sem at n = 9 D6.

  structural_ingredients:
    - description: >-
        The boolean quotient ring's idempotency, giving the principal Frobenius
        trivial family that the enumerator builds and that has no analogue over
        a prime field.
      citation: >-
        experiments/EXP-SIG-006/src/h013_f5_signatures.sage lines 186-203
        (internal, READ, comment "principal Frobenius/annihilator (1+f_i) mu e_i").
      role: >-
        Identifies which half of the trivial module is field-dependent, and
        supplies the 9 / 171 numerical coincidence with the two candidate
        baselines.
    - description: >-
        The frozen equation supports of the chained Semaev system and its
        column-matched nulls, with their recorded support histograms
        (n = 12: 12 cubics with support sizes 13-105, 12 quadratics with support
