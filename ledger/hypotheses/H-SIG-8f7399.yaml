hypothesis:
  id: H-SIG-8f7399
  question_id: RQ-SIG-001
  source_idea_id: IDEA-20260805-bbfca9
  goal_id: GOAL-SIG-001

  statement: >-
    The model/rewritable syzygy family K_D that GOAL-SIG-001 subtracts to obtain
    extra_D is a STRICT SUBSET of the boolean trivial syzygy module in degree
    <= D whenever equation supports overlap the multiplier monomial. The
    enumerator koszul_principal_vectors in
    experiments/EXP-SIG-006/src/h013_f5_signatures.sage admits multipliers under
    polynomial-ring degree arithmetic (`md in range(0, D - di - dj + 1)` for
    pairwise Koszul; `md in range(0, D - 2*di + 1)` for the principal Frobenius
    family), whereas in the boolean quotient the multiplication is set union and
    the correct admissibility condition is
    max_{c in supp(f_j)} |mu UNION c| <= D - d_i together with
    max_{c in supp(f_i)} |mu UNION c| <= D - d_j. The additive bound implies the
    union bound but not conversely, so multipliers with |mu| > D - d_i - d_j can
    still yield genuine degree-<= D trivial syzygies that K_D never enumerates.
    Therefore rank(K_D) is an undercount and extra_D = kernel_D - rank(K_D) is a
    corresponding overcount, by an amount that grows with support concentration.
    The consequence this hypothesis is built to test: at least half of the
    below-freeze null defect recorded at (n = 12, seed 2, D = 6) --
    extra_6 = 7110 against a semi-regular prediction of 0 -- is accounted for by
    the omitted multipliers, in which case the "no D6 null baseline can validate"
    blocker on GOAL-SIG-001 is an enumeration artifact rather than a property of
    the systems. THIS IS A HYPOTHESIS. Nothing is claimed. No run has happened.

  mechanism: >-
    ROWS AND TAGS. The degree-D boolean Macaulay matrix has rows tagged (i, u),
    u squarefree with |u| <= D - d_i, representing u * f_i whose support is
    { u UNION c : c in supp(f_i) }. Row counts reproduce exactly:
    nrows(12, 6) = 12 * sum_{k<=4} C(24,k) + 12 * sum_{k<=3} C(24,k)
    = 155412 + 27900 = 183312, the value EV-SIG-008 records (SESSION-COMPUTED).
    THE TWO TRIVIAL FAMILIES. Pairwise Koszul: for i < j and multiplier monomial
    mu, the vector XOR_{c in supp(f_j)} e_{(i, mu UNION c)} XOR
    XOR_{c in supp(f_i)} e_{(j, mu UNION c)} lies in the kernel, provided every
    tag it names is a real row. Principal Frobenius: because
    F_2[x_1..x_N]/(x_i^2 + x_i) is isomorphic to F_2^{2^N} as a ring, every
    element is idempotent, so (1 + f_i) mu f_i = 0 gives
    e_{(i, mu)} XOR XOR_{c in supp(f_i)} e_{(i, mu UNION c)}.
    THE OMISSION, EXACTLY. The enumerator's bound |mu| <= D - d_i - d_j is
    sufficient for row existence (|mu UNION c| <= |mu| + d_j <= D - d_i) but not
    necessary, because |mu UNION c| < |mu| + |c| whenever mu and c intersect.
    Define U_D as the set of triples (i, j, mu) satisfying the two max-union
    conditions with |mu| > D - d_i - d_j, and symmetrically for the Frobenius
    family. Every element of U_D is a genuine trivial syzygy the subtraction
    misses.
    WHEN U_D IS LARGE. For |mu| = D - d_i - d_j + 1 the condition
    |mu UNION c| <= D - d_i for every c in supp(f_j) forces mu to MEET every
    support monomial of f_j -- a hitting-set condition. Rare for supports spread
    over 2n variables; common for supports confined to few blocks, which is what
    the chained Semaev construction produces and what the column-matched null
    construction was built to imitate. THE MECHANISM THEREFORE PREDICTS THE
    ORDERING THE PROGRAM ALREADY MEASURED WITHOUT EXPLAINING: at n = 9 D6,
    extra_6 = 4986 (N0, spread supports, full 31180-column coverage), 7226 (N1,
    column-matched to the sem), 8897 (sem) -- monotone in support concentration.
    THE SECOND OMISSION. Both families are enumerated with MONOMIAL multipliers
    only. The mixed relation mu * f_j * (1 + f_i) * e_i is a trivial syzygy the
    enumerator never builds; its degree-admissible count under the conservative
    additive bound 2 d_i + d_j + |mu| <= D is 132 at (n = 12, D = 6) and 72 at
    (n = 9, D = 6) (SESSION-COMPUTED, quad-quad ordered pairs at |mu| = 0). Small,
    but a whole family omitted by construction and subject to the same undercount.
    CORROBORATING NUMERICAL COINCIDENCE, EXACT AND UNEXPLAINED IN THE CORPUS.
    EV-SIG-006 records the pinned baseline as sr_pred = 1674 / 9504 / 28068 at
    n = 9 D4/D5/D6 and states that "the textbook Bardet series
    (1,683/9,675/28,239) does NOT match the measured nulls". The differences are
    9, 171 and 171 (the last repeated only because both cumulative sums freeze at
    the freeze degree). The principal Frobenius count under the instrument's own
    bound, sum_i sum_{k <= D - 2 d_i} C(2n, k), evaluates at n = 9 to EXACTLY 9
    at D = 4 and EXACTLY 171 at D = 5 (SESSION-COMPUTED). So the two candidate
    baselines in this goal's own record differ by precisely the field-dependent
    trivial family, and the program kept the matching one and recorded the
    discrepancy as unexplained. That is a match of two numbers against two
    numbers; it is MOTIVATION, NOT EVIDENCE, and identifying the second formula
    is an explicit step of the paired experiment.
    WHY THIS ROUTES AROUND THE BLOCKER. Three null constructions have failed at
    D6 (N0 old, N2 forced-consistent, N1 exact-column-matched) and the goal's
    next_action defers a fourth. This hypothesis does not build a null. It
    computes a correction to the SUBTRACTION from the frozen supports by set
    arithmetic, with no echelon, no null and no new instance.

  assumptions:
    - >-
      The pinned instrument recovered under experiments/EXP-SIG-006/src/ is the
      one that produced the committed numbers. EV-SIG-008 records a
      reimplementation drift caught by the anchor gate (A4_5 = 242 against the
      recorded 444), so anchor reproduction is mandatory and ordered first.
    - >-
      extra_D is computed as kernel_D - rank(K_D) with K_D exactly the output of
      koszul_principal_vectors plus the caller's zero-row unit vectors. Reading
      the caller to confirm this is stage 0; if the caller appends further
      families the undercount may already be partly repaired.
    - >-
      This container has numpy 2.4.6 and NO Sage, Singular, msolve or sympy
      (SESSION-VERIFIED: `import sage` raises ModuleNotFoundError). Stages 0-2
      need none of them; stage 3 needs a GF(2) rank, which is a bitmask task and
      a bounded port. A port failure is infrastructure signal, never negative
      mathematical evidence.

  proof_search_map:
    bottleneck: >-
      The admissibility predicate inside the multiplier loop. Changing it from an
      additive degree bound to a union degree bound changes rank(K_D), hence
      extra_D, hence residual_D, hence every downstream cascade quantity and the
      validity verdict on every null. No other step in the pipeline has that
      blast radius for that little work.
    baseline_embedding:
      parameter_slice: >-
        Disjoint supports. When every multiplier is disjoint from every support
        monomial in range, |mu UNION c| = |mu| + |c| exactly and the union bound
        collapses to the additive bound, so U_D is empty and the corrected
        pipeline reduces EXACTLY to the current one. That is the precise boundary
        at which the old method is reproduced.
      reproduction_check: >-
        A synthetic system with pairwise disjoint supports, on which the
        corrected enumeration must return |U_D| = 0 and rank(K_D^bool) =
        rank(K_D^poly), plus reproduction of the committed anchors
        (sr_pred(12,6) = 156520, nrows(12,6) = 183312, nrows(12,5) = 31512,
        A4_5 = 444, residual_5(n=12) = 878). Failure of either is a stop.
    observation_collision:
      observable: extra_D, and the derived validity verdict (extra_D == 0 or not).
      distinct_preimage_search: >-
        The collision is the whole point and it is already on the record. Two
        genuinely different ground truths -- (A) a system that IS semi-regular but
        whose trivial module is undercounted, and (B) a system that is NOT
        semi-regular -- produce the SAME observation extra_D > 0 under the current
        enumeration. The goal has been treating every instance of that observable
        as evidence for (B). EV-SIG-006's own rule-8 note that "the
        column-matching safety constraint itself induces syzygies (N1's D5
        extra = 369)" is a recorded instance of the collision being noticed and
        not resolved. Separating the preimages is a rank computation on a family
        whose membership is decided by set arithmetic.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace extra_D = kernel_D - rank(K_D^poly) by
          extra_D^bool = kernel_D - rank(K_D^bool), the subtraction against the
          full boolean trivial module.
        predicted_gain: >-
          A validity verdict that cannot be triggered by support geometry alone.
          If the corrected null validates at (n = 12, D = 6), the goal's D >= 6
          axis reopens and the deferred calibration executor is unnecessary.
      - transform: representation_reduction
        proposed_object: >-
          Decide membership in U_D by the hitting-set predicate on supports
          instead of by constructing and testing candidate syzygy vectors.
        predicted_gain: >-
          Turns the decisive stage from linear algebra into set arithmetic,
          which is what makes the audit affordable in an environment with no
          solver.
    quantifier_order: >-
      Written out. THE CONTAINMENT: FOR ALL boolean systems, FOR ALL D, FOR ALL
      admissible (i, j, mu), the Koszul vector lies in the kernel -- unconditional
      and provable by substitution. THE UNDERCOUNT: THERE EXIST systems and
      degrees for which K_D^poly is a PROPER subset of K_D^bool -- existential,
      and demonstrated by exhibiting one triple. THE EXPLANATORY CLAIM, which is
      the only quantifier that can fail in an interesting way: FOR THE SPECIFIC
      CELL (n = 12, seed 2, D = 6), rank(K_6^bool) - rank(K_6^poly) >= 3555
      (half of 7110). That is a single-cell existential and must NEVER be written
      as a universal statement about below-freeze null defects. The trap being
      hunted: a correction that exists for every system (so the containment
      holds) but is large for none (so the explanation fails) -- containment and
      explanation are different quantifiers and the experiment reports them
      separately.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: at the audited cells, the boolean trivial syzygy module is
        larger than the enumerated family by a measured rank, and the corrected
        extra_D is a stated number. It CANNOT certify that the corrected null is
        semi-regular (that requires the corrected extra to be zero AND the
        corrected family to be complete, and completeness of a trivial module is
        not established by adding one family). It CANNOT certify anything about
        the sem's cascade. It CANNOT close the below-freeze collapse question if
        the correction is small -- it eliminates one candidate mechanism, which
        is a fatigue report unless the residue is quantified, so the residue must
        be quantified.
      nearby_object_control: >-
        The nearby object where the desired conclusion is KNOWN FALSE is the
        (n = 12, D = 5) null cell, whose measured extra_5 = 0 forces the
        correction there to be exactly zero. A pipeline that reports a positive
        correction there is producing syzygies that are not in the kernel and is
        broken. Second nearby object: the disjoint-support synthetic system,
        where |U_D| = 0 is forced by the degree arithmetic itself.
    proof_obligations:
      - claim: K_D^poly subset-of K_D^bool subset-of kernel(M_D).
        responsibility: correctness
      - claim: >-
          The union-degree admissibility conditions are exactly the conditions
          for every named tag to be a real row.
        responsibility: correctness
      - claim: >-
          |U_D| is computable from the frozen supports by set arithmetic, without
          linear algebra.
        responsibility: feasibility
      - claim: >-
          rank(K_D^bool) - rank(K_D^poly) <= extra_D at every cell (a consistency
          bound that must hold or the computation is wrong).
        responsibility: strictness
      - claim: >-
          The correction is zero at the (n = 12, D = 5) null cell.
        responsibility: baseline
      - claim: >-
          A correction that fails to explain the defect eliminates one mechanism
          and must report the residue, not a closure.
        responsibility: scope

  rerandomization: null

  asymptotic_claim:
