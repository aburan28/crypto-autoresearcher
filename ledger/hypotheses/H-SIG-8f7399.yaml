      The frozen boolean chained Semaev systems and their nulls at
      (n = 9, seed 1) and (n = 12, seed 2), plus synthetic disjoint-support and
      graded-concentration systems built for the controls.
    parameters:
      n: [9, 12]
      D: [4, 5, 6]
      arms: [sem, N0 spread null, N1 column-matched null, synthetic disjoint, synthetic graded]
      field: GF(2) boolean quotient
    implementation: >-
      Set arithmetic over the frozen supports (pure Python, no solver) for stages
      0-2; a GF(2) bitmask rank for stage 3. INFRASTRUCTURE PRECONDITION: no Sage
      in this container (SESSION-VERIFIED), so stage 3 requires a bounded port or
      a Sage-bearing environment; stages 0-2 do not.
    budget:
      wall_clock_seconds_per_run: 1800
      maximum_memory_gb: 16
      maximum_runs: 30

  falsification_conditions:
    - The enumerator already uses a boolean union bound. The hypothesis is void.
    - >-
      A positive rank correction at the (n = 12, D = 5) null cell where
      extra_5 = 0. The computation is wrong; nothing may be reported.
    - "|U_D| > 0 on the disjoint-support synthetic null. Same disposition."
    - >-
      The hand-built single-omitted-syzygy positive control not recovered. The
      instrument is blind and no negative may be reported.
    - >-
      Equal corrections across N0, N1 and sem at n = 9 D6 -- a constant of the
      apparatus.
    - A rank correction exceeding extra_D at any cell, contradicting containment.

  interpretation_limits:
    - >-
      Toy scale (AGENTS.md rule 7). Boolean chained Semaev, n <= 12, seed-scoped
      (n = 12 D6 is seed 2 only).
    - >-
      A large correction does NOT establish that the null is semi-regular, does
      NOT change H-SIG-001's status, and does NOT by itself make any D >= 6
      quantity admissible. It removes one named obstruction; admission is a
      Coordinator decision on a validated null.
    - >-
      A small correction does NOT close the below-freeze collapse question. It
      eliminates one candidate mechanism and MUST report the residue.
      FORWARD GUIDANCE, supplied now: the remaining candidates in priority order
      are (i) polynomial-multiplier trivial families -- the mixed Frobenius-Koszul
      relations, 132 degree-admissible at n = 12 D6, never enumerated; (ii) the
      top-slice relation conjecture EV-SIG-006 states and leaves unchecked for
      the 1875 residue at n = 9; (iii) an instance-dependent baseline built from
      the measured variety rather than the degree histogram, which EV-SIG-006
      shows is the only kind that could work at or above the freeze degree and
      which nobody has attempted.
    - >-
      Every n = 12 D6 target number is quoted from EV-SIG-008, whose own
      artifact_absence_statement records that its run manifests do not register
      and its experiment specification is Markdown with a .yaml extension. The
      contract re-measures rather than assuming when a result lands near a band
