    - metric: "|U_D| on a disjoint-support synthetic system"
      direction: different
      minimum_effect: EXACTLY 0, forced by the degree arithmetic. A positive value invalidates the enumeration.
    - metric: rank correction at (n = 9, D = 5) N1 column-matched null
      direction: higher
      minimum_effect: >-
        Between 1 and 369 inclusive. Zero means overlap admits no extra
