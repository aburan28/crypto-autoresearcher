  title: >-
    The schoolbook extension count exceeds 79 by 3/16.
  statement: >-
    At batch size 16 the norm count is 2M + 26. For M = 25 that count is 76.
    The extension numerator is 3M times 16 plus 2M + 17, which is 1267, so
    the extension count is 1267/16. That exceeds 79 by 3/16, and it exceeds
    76 by 51/16. For M = 15 the norm count is 56 and the extension numerator
    is 767. That is 1/16 below 48, and 56 exceeds it by 129/16. The ratio
    129/767 exceeds 15/100, and the cross excess is 1395. The in-place
    scratch is 1 word and the extension scratch is 5 words.
  mechanism: >-
    The proposal prices a norm inversion against an extension-level batch
    inversion. This contract checks those two integer formulas at batch
    size 16. It does not time a kernel.
