# =============================================================================
# H-ECDLP-bd1572 -- "H3": the only special-prime sieve that touches an
# elliptic curve is the multiplicative-group one reached by pairing transfer.
# Filed 2026-10-09 from a user-supplied hypothesis statement, verbatim in
# `source_statement`, restated below in testable form with numbered heuristics
# each bound to a toy-scale discriminating experiment. Status `proposed`;
# nothing here asserts an outcome. No attack on any deployed curve is claimed
# or attempted; every instance is a public toy prime or a public parameter set
# with no secret scalar.
# =============================================================================
hypothesis:
  id: H-ECDLP-bd1572
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-10-09'
  source_statement: >-
    H3: The one that actually exists. The only SNFS for ECDLP is MOV/Frey-Ruck
    transfer into F_{p^k}^* for small embedding degree k, where p = P(u)
    enables Joux-Pierrot SNFS and Kim-Barbulescu exTNFS/STNFS. That's what
    dropped BN254 from ~128 to ~100 bits. Notice that 2^255 - 19 is already
    P(u) = u^5 - 19 at u = 2^51, so Diffie-Hellman in F_p^* for that field
    would be SNFS-vulnerable. Curve25519 is fine because its embedding degree
    is ~l. Reduction-friendly bit patterns and SNFS-friendly polynomial form
    are the same kind of special, but only the multiplicative group ever sees
    it. Why covers don't rescue it: Weil descent works because the base field
    shrinks. A cover C -> E of genus g over F_p itself gives index calculus at
    O~(p^{2-2/g}) >= p, worse than rho's p^{1/2}. So the honest hypothesis: a
    special-p ECDLP sieve requires either an algebraic second structure on
    E(F_p) (none known), a point-level canonical lift, or a lift with
    unbounded rank. Each contradicts a heuristic, not a theorem, which is why
    the problem isn't closed.
  statement: >-
    For a prime p of special polynomial form p = P(m) with deg P = d small and
    P of small coefficients (the SNFS-friendly form that every
    reduction-friendly prime such as 2^255 - 19 = (2^51)^5 - 19 has), the
    specialness is observable by a sieve ONLY through the multiplicative
    groups F_{p^k}^*, and reaches an elliptic curve E/F_p only through a
    pairing transfer at small embedding degree k. Concretely, four limbs:
    (L0, positive control) on the same primes, an NFS-style relation search
    sees the special form as a counted smoothness advantage of the SNFS
    polynomial over a matched base-m polynomial; (L1, transfer is the only
    door) the embedding degree k of a random curve over a special p has the
    same distribution as over a matched random p, and for every deployed
    special-prime curve the actual k exceeds the transfer threshold k* at
    which SNFS or exTNFS in F_{p^k} would undercut Pollard rho; (L2, covers
    over F_p itself do not rescue it) index calculus on the Jacobian of a
    genus-g cover C -> E defined over F_p itself has cost exponent at least
    1 in p, against rho's 1/2, and the exponent does not depend on the form
    of p; (L3, the three escape routes are each blocked by a heuristic that
    special p does not disturb) a point-level canonical lift, an algebraic
    second structure on E(F_p), and a lift of unbounded rank each fail a
    toy-scale discriminating test with p special exactly as they do with p
    random. The hypothesis is FALSE in the specific sense that any one limb
    is falsified by its own named observation; it is NOT a claim that a
    special-p ECDLP sieve is impossible, since each L3 route contradicts a
    heuristic (HEUR-001..003 below), not a theorem.
  mechanism: >-
    NFS exploits two maps Z -> F_p and Z[alpha] -> F_p (alpha -> m) that
    agree on a + b*alpha, plus unique factorisation on both sides, so a small
    (a, b) gives two factorable integers; p = P(m) with small P makes the
    algebraic norm smaller by about m^{d-1}, which is the whole SNFS
    advantage. E(F_p) has no factorisation structure and no second
    homomorphic image in a ring with one; the Weil/Tate pairing is the only
    known homomorphic map out of the l-subgroup into a multiplicative group,
    and it lands in F_{p^k}^* with k the embedding degree, which for a random
    curve is of size comparable to l (Balasubramanian-Koblitz). So the only
    way the polynomial form of p can be sieved is after transfer, where
    Joux-Pierrot SNFS and Kim-Barbulescu exTNFS/STNFS exploit p = P(u)
    together with the extension degree. Covers over F_p itself change the
    ambient group to an abelian variety of dimension g over the SAME field,
    whose index calculus (Gaudry; Diem) costs O~(p^{2-2/g}) >= p; Weil
    descent helps only when the base field shrinks. The three candidate
    escapes each need a structure that a heuristic says is absent: Serre-Tate
    lifts the curve, never the point (HEUR-001); no algebraic structure on
    E(F_p) beyond the group law and its endomorphisms is known that depends
    on the form of p (HEUR-002); a global lift has finite Mordell-Weil rank
    with generators of height that grows with the model, so the residues
    covered by bounded-height points are polylogarithmic in the search box
    (HEUR-003, the Jacobson-Koblitz-Silverman-Stein-Teske xedni bound).
  assumptions:
    - >-
      Toy primes of the form m^d - c with |c| small and d in {2,...,6} are a
      faithful model of the special form of 2^255 - 19, 2^256 - 2^32 - 977,
      2^521 - 1 and 2^448 - 2^224 - 1 for every quantity measured here (norm
      size, embedding degree, lift coefficient size, formal-group defect).
      The one quantity this assumption does NOT transfer is absolute cost,
      which is never extrapolated.
    - >-
      A matched random prime of the same bit length with a monic base-m
      polynomial of the same degree is the correct null object: it has the
      same degree, the same base and the same reduction map, and differs
      only in coefficient magnitude (the null object of EXP-SNFS-465979).
    - >-
      The Balasubramanian-Koblitz random model for the embedding degree of a
      prime-order subgroup is the right null for L1 and is not itself
      disturbed by the form of p (this is part of what L1 tests).
    - >-
      The recalled complexity constants for SNFS, Joux-Pierrot SNFS and
      exTNFS are used only to locate a threshold k*, flagged optimistic, and
      every conclusion is robust to replacing them by the GNFS constant.
  proof_search_map:
    bottleneck: >-
      The absence of a second homomorphic image of the l-subgroup of E(F_p)
      in a ring with unique factorisation, other than the pairing image in
      F_{p^k}^*. Removing it is the whole problem; the map lists what each
      candidate removal would have to look like.
    baseline_embedding:
      parameter_slice: >-
        Supersingular or small-k curves (k <= 6), where MOV/Frey-Ruck plus
        (S)NFS in F_{p^k} is the published subexponential attack and where
        p = P(u) is exactly what Joux-Pierrot and Kim-Barbulescu exploit.
      reproduction_check: >-
        EXP-ECDLP-6dacdb part B recomputes the k* threshold table from the
        stated L-formulas; the frozen fixture is that for every deployed
        special-prime curve the exact modular order of p modulo l exceeds
        10^6, checked by direct exponentiation.
    observation_collision:
      observable: >-
        For L3: the covering exponent gamma of distinct E(F_p) residues hit
        by bounded-height points on small-coefficient lifts, as a function of
        enumeration work, and the empirical distribution of the formal-group
        defect delta modulo p.
      distinct_preimage_search: >-
        A gamma near 0 can also come from a box too small to contain any
        point; EXP-ECDLP-3e8403 therefore reports the first non-empty rung
        and fits only above it, and the Q-lift arm (d = 1) is the preimage
        that must show the same gamma.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          The SNFS number field K_d = Q(c^{1/d}) attached to p = m^d - c,
          with the prime ideal (alpha - m) of norm p, as the ring in which a
          lifted curve E_K lives; for 2^255 - 19 there is one such field for
          every divisor d of 255.
        predicted_gain: >-
          None in the exponent (HEUR-003); a constant-level gain in the raw
          count of bounded-height points because the lifted model has smaller
          coefficients, which EXP-ECDLP-3e8403 records as a secondary metric
          and does not report as an attack.
      - transform: stronger_invariant
        proposed_object: >-
          The Teichmuller-coordinate point lift (x lifted to its Teichmuller
          representative, y by Hensel), the only coordinate-level
          Frobenius-equivariant lift available over Z_p.
        predicted_gain: >-
          None: the lifted points are not closed under addition, so the
          formal-group defect stays uniform (HEUR-001); EXP-ECDLP-15534c is
          the test.
    quantifier_order: >-
      For all special primes p = P(m) in the tested family and all curves
      E/F_p sampled under the declared seeds, there exists NO measured
      quantity among (smooth-yield ratio, embedding-degree distribution,
      cover-cost exponent, covering exponent gamma, defect uniformity) that
      differs between the special arm and the matched random arm beyond its
      pre-registered tolerance, EXCEPT the multiplicative-group smooth-yield
      ratio of L0, which must differ. The exception is the control that
      proves the specialness is real where the hypothesis says it lives.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale and in the exact tested scope: the polynomial form of p
        is visible to the F_p^* sieve and invisible to every curve-side
        observable in the battery. No closure of the problem is certifiable
        from this, because each L3 heuristic is refuted only by its own
        falsification condition and a bounded search failure proves no
        nonexistence (AGENTS.md rule 6).
      nearby_object_control: >-
        Supersingular toy curves (k = 2) with p special, where the transfer
        DOES expose the special form: the battery must flag these as
        transferable (small k) so that a null result elsewhere is not an
        instrument that cannot see anything.
    proof_obligations:
      - claim: >-
          The counted smooth-yield ratio special/null in F_p^* exceeds 1 on
          the shared toy prime set.
        responsibility: baseline
      - claim: >-
          The embedding-degree distributions of the two prime arms are
          indistinguishable at the declared sample size.
        responsibility: scope
      - claim: >-
          The genus-2 cover index-calculus exponent at toy p is at least 1
          and is the same on both prime arms.
        responsibility: runtime
      - claim: >-
          The lift covering yield index Y_max is below 0.1 on every lift arm
          and the special-minus-null residue-count difference is within 3.
        responsibility: success_probability
      - claim: >-
          The formal-group defect delta is uniform modulo p on every lift arm
          and both prime arms, while the anomalous positive control gives
          delta = 0.
        responsibility: correctness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        (No point-level canonical lift.) For an ordinary E/F_p with a point P
        of odd prime order l and any lift rule L assigning to each point of
        E(F_p) a point of E(Z_p) on the canonical or any fixed lifted model,
        the map P -> L(P) is not a group homomorphism on the l-subgroup, and
        for Q = [k]P the defect delta(L) = (log_F([l]L(Q)) / log_F([l]L(P))
        - k) mod p is equidistributed on F_p as (P, k) vary, for the three
        rules tested: integer-representative Hensel lift, Teichmuller-x
        Hensel lift, and random-lift.
      random_model_justification: >-
        The formal kernel is pro-p and carries no l-torsion, so any
        homomorphism from the order-l group into it is zero; a non-homomorphic
        section leaves a lift discrepancy T = L(Q) - [k]L(P) in the formal
        group whose leading unit is, absent structure, a uniform unit.
      supporting_results:
        - >-
          Smart 1999 (anomalous case, delta = 0 identically): the positive
          control. EXP-CANL-1064e0's enumeration of point-lifting routes L1-L5
          (internal, draft).
      validation_experiment_ids: [EXP-ECDLP-15534c]
      falsification_condition: >-
        A lift rule and prime arm for which the pre-registered uniformity
        test on delta rejects at alpha = 0.001 (Bonferroni over arms) on a
        non-anomalous curve, with the anomalous control still returning
        delta = 0 and the same-seed replay byte-identical.
    - id: HEUR-002
      formal_statement: >-
        (No second structure that sees the form of p.) For the family of
        curves and observables in this battery, no curve-side statistic
        (embedding-degree distribution, cover index-calculus exponent,
        covering exponent gamma, defect distribution) has a special-arm minus
        random-arm difference beyond its stated tolerance; the form of p is
        invisible to E(F_p) except through the pairing image.
      random_model_justification: >-
        E(F_p) is determined by (a, b, p) through point counting; the
        polynomial form of p enters the group only via p itself, and the
        pairing is the sole known homomorphism into a ring with a
        factorisation structure (Menezes-Okamoto-Vanstone; Frey-Ruck).
      supporting_results:
        - >-
          Balasubramanian-Koblitz 1998: for random prime-order curves the
          probability of small embedding degree is negligible.
      validation_experiment_ids: [EXP-ECDLP-6dacdb, EXP-ECDLP-28ad87, EXP-ECDLP-3e8403]
      falsification_condition: >-
        Any battery statistic whose special-minus-random difference exceeds
        its pre-registered tolerance with the matched controls passing, on a
        prime set on which EXP-ECDLP-2535ec confirms the F_p^* sieve DOES
        see the special form.
    - id: HEUR-003
      formal_statement: >-
        (Bounded rank, growing height.) For small-coefficient lifts of E/F_p
        to a number field K_d of degree d, the number of distinct residues of
        E(F_p) hit by K_d-points whose x-coordinate has coefficient vector in
        the box [-X, X]^d grows at most like (d log X)^{r_K/2} with r_K the
        rank of the lifted model over K_d, so the covering exponent
        gamma = dlog(D)/dlog(W), W = (2X+1)^d, tends to 0, and raising d does
        not raise gamma.
      random_model_justification: >-
        Points of bounded Neron-Tate height on an elliptic curve over a number
        field number c * T^{r/2} (Neron); the box of coefficient size X has
        height about d log X; a sieve needs gamma near 1.
      supporting_results:
        - >-
          Jacobson-Koblitz-Silverman-Stein-Teske 2000 (xedni fails
          asymptotically; absolute coefficient bound). GOAL-XEDN-001..003 and
          GOAL-ICLIFT-001 coefficient-bound closures (internal).
      validation_experiment_ids: [EXP-ECDLP-3e8403]
      falsification_condition: >-
        A lift arm with yield index Y(W) = D(W)/sqrt(W) >= 1 on three
        consecutive rungs, or a fitted gamma >= 0.5 over at least three
        non-empty rungs with the special-minus-null gamma difference above
        0.2, or a d-ladder on one prime in which Y_max increases
        monotonically with d.
  structural_ingredients:
    - description: >-
        Hidden-SNFS trapdoor and the SNFS/GNFS constant gap in F_p^*.
      citation: KN-LIT-7635
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-7635.md
      role: positive control (L0) and the definition of special form
    - description: >-
        Embedding-degree rarity for random prime-order curves.
      citation: KN-LIT-086
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-086.md
      role: null model for L1
    - description: MOV reduction and Frey-Ruck Tate-pairing transfer.
      citation: KN-LIT-084, KN-LIT-085
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-084.md; knowledge/literature/KN-LIT-085.md
      role: the only door (L1)
    - description: exTNFS complexity in F_{p^n}, composite n.
      citation: KN-LIT-3743
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-3743.md
      role: post-transfer sieve cost model for k* (L1)
    - description: >-
        Joux-Pierrot special NFS in F_{p^n} for p = P(u); Barbulescu-Duquesne
        updated pairing key sizes (BN254 to about 100 bits).
      citation: >-
        Joux, Pierrot, "The special number field sieve in F_{p^n}" (Pairing
        2013); Barbulescu, Duquesne, "Updating key size estimations for
        pairings" (J. Cryptology 2019)
      provenance: recalled
      verified_by: null
      role: >-
        the BN254 drop quoted in the source statement; a pointer, not
        support, until read (AGENTS.md rule 9)
    - description: Index calculus on small-dimension abelian varieties; Diem.
      citation: KN-LIT-002, KN-LIT-003, KN-LIT-007
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-002.md; knowledge/literature/KN-LIT-003.md; knowledge/literature/KN-LIT-007.md
      role: cover-cost floor (L2)
    - description: Xedni fails asymptotically (absolute coefficient bound).
      citation: KN-LIT-021
      provenance: kb
      verified_by: knowledge/literature/KN-LIT-021.md
      role: HEUR-003
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: counted_smooth_yield_ratio_special_over_null_Fp_star
      direction: higher
      minimum_effect: >-
        ratio > 1 with a bootstrap 95% interval excluding 1 against both
        nulls at every d >= 3 cell, and >= 1.5 against the random-prime null
        wherever m >= 2^8 (L0; EXP-ECDLP-2535ec)
    - metric: embedding_degree_small_k_fraction_difference_special_minus_random
      direction: different
      minimum_effect: >-
        |difference| <= 2 standard errors AND permutation p-value > 0.01 on
        the log-cofactor statistic; prediction is NO difference (L1 part A;
        EXP-ECDLP-6dacdb)
    - metric: deployed_curve_embedding_degree_minus_transfer_threshold
      direction: higher
      minimum_effect: >-
        k_actual > 10^6 > k* for every deployed special-prime curve, with
        k* <= 50 under the optimistic constants (L1 part B)
    - metric: cover_index_calculus_cost_exponent
      direction: higher
      minimum_effect: >-
        fitted exponent in p >= 0.9 on both prime arms, against the rho
        exponent 0.5 measured on the same instances, with |special - random|
        <= 0.1 (L2; EXP-ECDLP-28ad87)
    - metric: lift_covering_yield_index_Y_max_and_gamma
      direction: lower
      minimum_effect: >-
        Y_max <= 0.1 and D(W_max) <= 3 on every lift arm, gamma <= 0.3
        wherever fitted, |D_special - D_null| <= 3 at matched d, Y_max not
        increasing along the d-ladder (L3/HEUR-003; EXP-ECDLP-3e8403)
    - metric: formal_group_defect_uniformity_rejections
      direction: lower
      minimum_effect: >-
        zero rejections at alpha = 0.001 across all lift rules and prime arms,
        anomalous control delta = 0 on every sample (L3/HEUR-001;
        EXP-ECDLP-15534c)
  test_boundary:
    instances:
      - >-
        Shared toy prime set S: special p = m^d - c prime, d in {2,3,4,5},
        |c| <= 31 squarefree, bit lengths 24..40 (per experiment), one matched
        random prime per special prime at the same bit length, seeded.
      - >-
        One composite-exponent toy prime p = m^12 - c (m = 2^3) with the
        d-ladder d in {2,3,4,6,12}, the toy analogue of 2^255 - 19 = u^d - 19
        for every d | 255.
      - >-
        Deployed public parameter sets, exact-arithmetic only, no secret
        scalar: Curve25519, P-256, secp256k1, P-521, Ed448 (special p) and
        brainpoolP256r1 (random-p control).
    parameters:
      claim_tier: toy
      curve_sampling: seeded random (a, b) with nonzero discriminant
      lift_rules: [integer_representative_hensel, teichmuller_x_hensel, random_hensel]
      lift_fields: [Q, K_d_snfs, K_d_monic_base_m_null]
    implementation: >-
      Pure Python 3 standard library under experiments/EXP-ECDLP-*/
      implementation/ (no sympy, numpy, gmpy2 or Sage present in the design
      session); nearest Rust instruments for cross-checking are
      aburan28/crypto src/cryptanalysis/fght_snfs.rs (SNFS toy),
      nonanom_formal_log.rs (formal-group defect) and eds_mov.rs (MOV on
      supersingular toys).
    budget:
      enforcement: advisory
      total_cpu_hours: 12
      maximum_memory_gb: 4
  falsification_conditions:
    - >-
      L0 fails: the counted smooth-yield ratio special/null is not above 1
      with its interval excluding 1 at d >= 3 on the shared prime set. Then
      the shared primes are not special in the sense the hypothesis uses and
      every other limb is UNTESTED on them, not supported.
    - >-
      L1 fails: a special-arm minus random-arm shift in the embedding-degree
      distribution beyond tolerance, or a deployed special-prime curve whose
      exact embedding degree is at most k*.
    - >-
      L2 fails: a genus-2 cover index-calculus exponent measured below 0.9 at
      toy scale with the rho control at 0.5, or a |special - random| exponent
      gap above 0.1.
    - >-
      HEUR-003 fails: a lift arm with yield index Y >= 1 on three consecutive
      rungs, or a fitted covering exponent gamma >= 0.5 with the
      special-minus-null gap above 0.2, or Y_max rising monotonically along
      the d-ladder.
    - >-
      HEUR-001 fails: a lift rule whose defect delta is non-uniform at
      alpha = 0.001 on a non-anomalous curve with the anomalous control
      passing.
  interpretation_limits:
    - Toy primes and toy curves only; no crypto-scale cost is measured or extrapolated.
    - >-
      A null result on every curve-side limb supports the hypothesis in the
      exact tested scope and closes nothing: each heuristic is refuted only
      by its own falsification condition, and a bounded search finding no
      structure proves no nonexistence (AGENTS.md rules 5 and 6).
    - >-
      The k* threshold uses recalled complexity constants with the o(1)
      dropped; it is an optimistic bound used only to show a gap of many
      orders of magnitude, never a key-size recommendation.
    - >-
      A constant-level difference in raw bounded-height point counts between
      lift arms is expected from model height and is reported, not claimed
      as an attack.
    - >-
      No statement about any deployed parameter set being trapdoored is made
      or implied (GOAL-SNFS-001 scope rule applies).
