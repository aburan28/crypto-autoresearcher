  title: >-
    The order of 2 modulo 31 is 5, and the subspace count is 128.
  statement: >-
    The order of 2 is 8 modulo 17, 11 modulo 23, 5 modulo 31, 20
    modulo 41, 130 modulo 131, and 162 modulo 163. The stable
    subspace counts are 8, 8, 128, 8, 4 and 4. Dimension 9 occurs
    at degree 17 and not at degree 131.     The one-solution loss at
    degree 17 is 16/17, strictly above 0.94 and strictly below
    0.95. The order modulo 17 is not 4, and the order modulo 31
    is not 10.
  mechanism: >-
    The proposal lists the orders of 2 and the stable-subspace
    counts. This contract recomputes them. It does not census
    solution tuples.
  assumptions: []
  proof_search_map:
    bottleneck: The order modulo 31 and the count 128.
    baseline_embedding:
      parameter_slice: >-
        The degree table in IDEA-20261001-93e740, read 2026-10-02.
        The orders were computed in this design session. That
        computation is not a run.
      reproduction_check: >-
        One route multiplies by 2 until it returns to 1. The other
        checks the order divides and no proper prime-power divisor
        works, in a separate module. They must agree.
    observation_collision:
      observable: The order modulo 31 and the presence of dimension 9.
      distinct_preimage_search: >-
        An order of 10 modulo 31 is twice the true order. Reporting
        10 invalidates the run. Dimension 9 at degree 131 is the
        degree-17 value.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Six prime degrees.
        predicted_gain: Integer comparisons. No attack cost.
    quantifier_order: >-
      The orders are computed first, then the subspace counts,
      then the loss fraction.
    method_ceiling:
      strongest_certifiable_claim: >-
        The orders, the subspace counts, and the fraction 16/17.
        Not a symmetry of a decomposition system.
      nearby_object_control: >-
        Order 4 modulo 17, order 10 modulo 31, and dimension 9 at
        degree 131.
    proof_obligations:
      - claim: The order of 2 modulo 31 is 5, and the subspace count is 128.
        responsibility: correctness
      - claim: Dimension 9 is in the degree-17 list and not in the degree-131 list.
        responsibility: correctness
      - claim: 16/17 is strictly above 0.94 and strictly below 0.95.
        responsibility: correctness
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions: []
  structural_ingredients:
    - description: >-
        The order is the least positive k with 2^k congruent to 1.
        The subspace count is 2 to the power 1 plus (n-1)/k. The
        fraction 16/17 was compared by cross-multiplication. That
        comparison is not a run.
