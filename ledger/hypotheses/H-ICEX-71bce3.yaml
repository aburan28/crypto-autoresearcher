hypothesis:
  id: H-ICEX-71bce3
  question_id: RQ-ICEX-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260803-fa9839
  statement: >-
    The comparison this question exists to decide - when point-decomposition index calculus beats
    Pollard rho - can be written in closed form with zero compute, and the resulting model is
    FALSIFIABLE against an exponent that is already known in the extension-field setting. Four limbs
    are asserted.
    (T1) THE TWO-TERM MODEL IS ALGEBRAICALLY CORRECT. Charging index calculus over a group of prime
    order with a factor base of a given size, a fixed arity, a per-trial decomposition-decision cost,
    and sparse linear algebra quadratic in the base size, the total cost is the sum of a relation-search
    term forced by this program's own exact conservation identity and a linear-algebra term. Its
    optimizer and optimal value verify symbolically and numerically at every arity from 2 to 8.
    (T2) THE INTERNAL CROSS-CHECK HOLDS. Instantiating the conservation identity at the subfield-line
    factor base of the extension-field setting returns the reciprocal of the arity factorial EXACTLY at
    every arity from 2 to 8. This gate requires no external source and survives a total failure to obtain
    one.
    (T3) THE MODEL IS NOT TIGHT, AND THE GAP IS AN EXACT ARITHMETIC IDENTITY. Against the exponent
    reported for the extension-field family, the model's prediction differs by an exact expression in the
    arity, at every arity in the transcribed range. Either the identity holds - which localizes the
    missing ingredient to one identified term of the charge - or it does not, in which case the two-term
    charge itself is wrong and NO prime-field corollary may be drawn from it.
    (T4) THE THRESHOLD IS EMITTABLE AND SIGN-ROBUST. Conditional on T1, T2 and T3, a machine-readable
    table of the maximum admissible decomposition-oracle cost exponent per arity is emitted with its
    constants pinned, and every row's SIGN survives a declared sweep of those constants. Rows whose sign
    is not robust are marked indeterminate and may not be cited.
    The hypothesis is FALSE if the optimizer fails to verify symbolically (T1, and everything downstream
    is void), if the conservation cross-check does not return the reciprocal factorial exactly (T2, and
    the failure is routed to a correction record rather than absorbed), if the transcribed exponent
    differs from the recollection (T3's identity is WITHDRAWN, which does not by itself void the model),
    or if the model cannot be reconciled with the transcribed exponent by ANY named ingredient of the
    relation-search term (the charge is wrong and the failure is the reported result).
  mechanism: >-
    Six goal records in this program defer a measurement chain in a way that composes into a deadlock even
    though each individual deferral is defensible, and the comparison they defer has never been written
    down. The exit does not require a measurement. The first term of the two-term charge is FULLY
    DETERMINED by a conservation identity this program already owns - exact, geometry-independent, and
    recomputed with maximum absolute deviation zero across its measurement grid - so the only free
    parameter in the whole comparison is the per-trial decomposition cost. The ordering of the research
    programme therefore inverts: write the threshold FIRST and read off whether any measurable solving
    degree could land inside it.
    That converts each deferred measurement from a datum into a VERDICT. A measured per-trial cost at or
    above the threshold closes that arity within the model; one below it would be the first positive
    prime-field signal this programme has had. Neither reading is currently available because the threshold
    does not exist in the corpus.
    The baseline gate is the whole experiment rather than a formality, because the extension-field exponent
    is externally known and the model can be checked against an answer it did not choose. If the model's
    prediction and the reported exponent differ by the exact arithmetic expression the model implies, the
    discrepancy has a forced interpretation: the reported algorithm attains its linear algebra at a SMALLER
    factor base than the model's optimum, at which the model's own relation-search term would dominate. So
    the reported exponent cannot be reached by rebalancing the base alone - it requires the relation-search
    term itself to be cheaper than the model's trial count, which under an exact conservation mean can only
    come from harvesting more than one usable relation per trial. NAMING THAT TERM IS THE RESULT, and
    whether it is portable to prime fields becomes a well-posed question rather than a hope.
  assumptions:
    - >-
      Sparse linear algebra on a square matrix with a bounded number of nonzeros per row is charged as
      quadratic in the base size. The constant and the field-operation to group-operation conversion are
      PINNED IN THE CONTRACT before any threshold number is computed. A threshold whose sign depends on the
      constant is reported as sign-indeterminate.
    - >-
      Approximately one relation per factor-base element is required. Relation RANK is not modelled; the
      conservation identity explicitly scores a rank-deficient base as tied with a random base of the same
      size. Rank deficiency can only raise the real cost, so the model is a LOWER BOUND on cost - its no-go
      readings are conservative and its positive readings are NOT.
    - >-
      The rho baseline is charged with its constant pinned in the contract, and both the plain and the
      negation-map variants are emitted, so no threshold is quoted under an unstated baseline.
    - >-
      The per-trial decomposition cost is the charged cost of deciding ONE candidate target, including
      forming the target, running the solver, and verifying the output. Amortized precomputation is charged
      separately and stated, never folded in.
    - >-
      The model OMITS DESCENT. A full index calculus must also express the target in terms of the factor base
      after collecting relations, and that stage is not charged. This is why the model is a lower bound and
      why every positive reading carries the caveat.
  proof_search_map:
    bottleneck: >-
      The two-term balance between relation search and linear algebra. The exact bottleneck claim is that the
      first term is FULLY determined by the conservation identity and the only free parameter is the per-trial
      decomposition cost; every other quantity is either exact or a pinned constant.
    baseline_embedding:
      parameter_slice: >-
        The extension-field setting at arity equal to the extension degree, with the subfield-line factor base,
        and a per-trial cost subexponential in the group order - the one setting where the answer is externally
        known.
      reproduction_check: >-
        The model must reproduce, or state its exact SIGNED discrepancy against, the TRANSCRIBED primary-source
        exponent at every extension degree in the transcribed range, to machine precision. Additionally the
        model must reproduce the reciprocal-factorial decomposition probability from the conservation identity,
        which is checkable with no external source and is the only gate that survives a total failure to obtain
        primary sources.
    observation_collision:
      observable: >-
        The pair consisting of the cost exponent and the optimizing factor-base size.
      distinct_preimage_search: >-
        SUCCEEDS AND IS THE CONTENT. The model predicts one such pair; the reported exponent corresponds to a
        DIFFERENT and smaller optimizing base at which the model's own relation-search term dominates. Two
        distinct preimages reach different exponents through the same observable, which LOCALIZES the missing
        ingredient to the relation-search term rather than to the linear-algebra charge. The search for further
        preimages must cover harvest-all multi-relation yield, large-prime and double-large-prime partial
        relations, descent reuse across targets, and any structure making successive trials dependent.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Emit the threshold under a PARAMETERIZED linear-algebra exponent rather than a fixed quadratic one, so
          any future structured-solve result reads off its own consequence rather than invalidating the table.
        predicted_gain: >-
          The headline row remains the quadratic case and every other row is explicitly conditional, which is
          what makes the table survive a change in the linear-algebra state of the art.
      - transform: specialization_pack
        proposed_object: >-
          For each deferred measurement goal, state what measured value of its own primary metric would place the
          per-trial cost inside each arity window, or state that its metric does not convert.
        predicted_gain: >-
          Converts three deferred measurements from data into verdicts without consuming any of their budget.
    quantifier_order: >-
      CLAIMED. FOR EVERY fixed arity and EVERY family of factor bases of the given size, IF the charged per-trial
      decomposition cost is below the threshold exponent, THEN the two-term model's optimum is asymptotically
      below the rho baseline. THE ORDER MUST NOT BE INVERTED: this is NOT there exists a factor base, and it
      asserts NOTHING about whether such a per-trial cost is achievable. The existence question is a separate open
      problem and is untouched.
    method_ceiling:
      strongest_certifiable_claim: >-
        A threshold with the per-trial cost left free, plus a set of no-go readings conditional on the model. It can
        NEVER establish a prime-field advantage, because it takes no position on achievability; its ceiling as a
        positive instrument is zero by construction and that must be stated in every deliverable.
      nearby_object_control: >-
        The SAME model with the exact conservation mean replaced by an independently estimated yield. If the
        threshold's numerical value moves materially under that substitution, the model is being carried by the
        estimate rather than by the identity, and the identity's exactness is not doing the work claimed for it.
    proof_obligations:
      - claim: The optimizer and optimal value of the two-term charge verify symbolically and numerically.
        responsibility: correctness
      - claim: The conservation identity returns the reciprocal factorial at the subfield-line instantiation.
        responsibility: baseline
      - claim: The signed discrepancy against the transcribed exponent equals the model's implied expression.
        responsibility: strictness
      - claim: The threshold rows' signs survive the declared constant sweep.
        responsibility: feasibility
      - claim: Omitting relation rank and descent can only lower the modelled cost.
        responsibility: scope
      - claim: The model establishes no advantage and narrows no existence question.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      The elliptic curve discrete logarithm problem over prime fields, approached by point-decomposition index
      calculus.
    prior_best: >-
      Pollard rho at a pinned constant times the square root of the group order; prime-field index calculus has no
      known advantage in this program's records.
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. The object produced is a FUNCTION relating a free parameter - the charged
      per-trial decomposition cost - to the crossover against rho.
    memory_exponent: >-
      The optimizing factor-base size, emitted alongside every time row so that no threshold is ever quoted without
      its memory, since at the larger arities the stored element count is itself a feasibility constraint.
    hidden_cofactor: >-
      Descent is omitted; relation rank is omitted; the per-trial cost's tail behaviour is omitted. All three push
      the real cost UP relative to the model, which is why no-go readings are conservative and positive readings are
      not.
    claim_kind: cofactor_improvement
    claim_kind_note: >-
      Filled with the nearest permitted value because the schema has no term for a THRESHOLD FUNCTION with a free
      parameter, which is what this hypothesis produces. No exponent moves and no advantage is claimed. The four
      promotion gates have no target here, because nothing may transition toward supported as a complexity
      improvement from a model that leaves its decisive parameter free.
  heuristic_assumptions:
    - id: HEUR-AT-1
      formal_statement: >-
        Expected relations per trial equals the conservation mean, i.e. trials are independent and the per-target
        relation count concentrates well enough that an expectation-level charge predicts the total.
      random_model_justification: >-
        The MEAN is EXACT and geometry-independent - that is the theorem content of this program's conservation
        finding, recomputed at maximum absolute deviation zero across its grid. INDEPENDENCE AND CONCENTRATION ARE
        NOT PROVED. The finding itself bounds the one-relation-per-target correction by a small constant, so the
        constant-factor exposure is bounded; the tail exposure is not.
      supporting_results:
        - 'knowledge/findings/KN-FIND-007, the conservation identity, as this program records it.'
      validation_experiment_ids:
        - EXP-ICEX-349205
      falsification_condition: >-
        The threshold EXPONENT differs between the harvest-all and the one-relation-per-target conventions. Only the
        constant should move; a convention under which the exponent moves indicates the charge is wrong.
    - id: HEUR-AT-2
      formal_statement: >-
        Sparse linear algebra on a square matrix with a bounded number of nonzeros per row costs quadratic time in
        the base size, and no structured-solve improvement changes that exponent.
      random_model_justification: >-
        Standard for iterative sparse solvers, but NOT UNIVERSAL in this corpus: one internal evidence record
        measured a structured solve beating the iterative baseline substantially on endomorphism-invariant bases, and
        a later record withdrew the comparative limb of that claim while leaving its metric unadjudicated. A
        displacement-rank improvement is therefore neither established nor excluded here.
      supporting_results:
        - 'ledger/evidence/EV-STR-002 and EV-STR-003, cited as those records'' claims and their withdrawal.'
      validation_experiment_ids:
        - EXP-ICEX-349205
      falsification_condition: >-
        The threshold table is not emittable under a parameterized linear-algebra exponent, or a structured-solve
        exponent inside the declared range flips a threshold row's sign without that row being marked conditional.
    - id: HEUR-AT-3
      formal_statement: >-
        The reported extension-field exponent is attained by an algorithm whose relation-search term is cheaper than
        the model's trial count, and the responsible ingredient is partial-relation harvesting rather than a different
        linear-algebra charge.
      random_model_justification: >-
        DERIVED WITHIN THE PARENT PROPOSAL AND NOT VERIFIED. It follows from the observation collision - at the
        smaller optimizing base the model's relation-search term dominates - so rebalancing the base alone cannot
        reach the reported exponent. The specific attribution is an INFERENCE FROM ELIMINATION and is the weakest link.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ICEX-349205
      falsification_condition: >-
        The transcribed primary source identifies a different responsible ingredient, or identifies none - in which
        case the attribution is recorded UNVERIFIED and the portability question is deferred rather than answered. The
        ingredient may NEVER be asserted from elimination alone in a deliverable.
  structural_ingredients:
    - description: >-
        The exact, geometry-independent conservation identity for expected relations per decomposition trial.
      citation: 'knowledge/findings/KN-FIND-007, as this program records it.'
      provenance: internal
      verified_by: >-
        The committed finding, which this program independently recomputed; cited as that record's claim.
      role: fully determines the relation-search term of the charge
    - description: >-
        The reported cost exponent for index calculus over the extension-field family at fixed extension degree.
      citation: >-
        UNVERIFIED RECOLLECTION. Primary sources are unreachable from the parent proposal's environment. THE
        RECOLLECTION MAY NOT BE USED AS EVIDENCE; transcribing it from a primary source is a BLOCKING subtask, and if
        no source can be obtained the baseline gate is reported UNRUN and no prime-field corollary may be cited.
      provenance: recalled
      verified_by: null
      role: the externally known answer the model is checked against
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: model_optimizer_symbolic_verification
      direction: different
      minimum_effect: >-
        The optimizer and optimal value verify against the stationarity condition symbolically, and numerically to
        machine precision at every arity from 2 to 8. A mismatch is an algebra error and blocks everything downstream.
    - metric: conservation_cross_check
      direction: different
      minimum_effect: >-
        The identity at the subfield-line instantiation returns the reciprocal of the arity factorial EXACTLY at every
        degree from 2 to 8. Requires no external source and must hold exactly.
    - metric: baseline_reproduction_discrepancy
      direction: different
      minimum_effect: >-
        The signed difference between the model exponent and the TRANSCRIBED exponent equals the model's implied exact
        expression in the extension degree, to machine precision, at every degree in the transcribed range. A POINT
        PREDICTION THAT CAN FAIL - it fails if the transcribed exponent is not what was recalled.
    - metric: arity_threshold_table_sign_robustness
      direction: different
      minimum_effect: >-
        No threshold row changes sign under the declared sweep of the pinned constants. Rows whose sign is not robust
        are marked indeterminate and may not be cited as no-gos.
    - metric: null_control_threshold_invariance
      direction: different
      minimum_effect: >-
        Replacing the exact conservation mean by a naive independent-uniform yield estimate leaves the threshold
        EXPONENT unchanged. If it moves, the claimed role of the identity's exactness is overstated and must be
        re-described.
    - metric: deferred_measurement_convertibility
      direction: different
      minimum_effect: >-
        For each of the three deferred measurement goals, an explicit statement of what measured value of its own
        primary metric would place the per-trial cost inside each arity window, or a statement that its metric does not
        convert and why. A goal for which neither can be written is reported as not convertible, which is itself
        decision-relevant.
  test_boundary:
    instances:
      - The two-term charge evaluated symbolically and numerically at arities 2 through 8.
      - The conservation identity instantiated at the subfield-line factor base at extension degrees 2 through 8.
      - The transcribed extension-field exponent at every degree in the transcribed range, or a recorded failure to obtain it.
      - Standardized group orders at which the absolute threshold budget table is emitted.
    parameters:
      arities: '2 through 8'
      standardized_orders: 'group orders of 160, 224, 256 and 384 bits'
      pinned_constants: 'the linear-algebra constant, the rho constant, and the field-operation to group-operation conversion, all fixed before any number is computed'
      constant_sweep_range: declared in the contract before any threshold is emitted
      linear_algebra_exponent: 'quadratic as the headline row, with a parameterized deficit as explicitly conditional rows'
    implementation: >-
      Exact arithmetic and symbolic differentiation in pure Python under experiments/EXP-ICEX-349205/driver/. No
      algorithm is run and no instance is solved. Nothing under harness/ is modified.
    budget:
      wall_clock_seconds_total: 600
      maximum_memory_gb: 2
      maximum_runs: 6
  falsification_conditions:
    - >-
      The transcribed extension-field exponent is not what was recalled. The recollection was wrong; the gate is
      re-evaluated against the transcribed value and the discrepancy identity is WITHDRAWN. This does not by itself void
      the model.
    - >-
      The model cannot be reconciled with the transcribed exponent by ANY named ingredient in the relation-search term.
      THE TWO-TERM CHARGE IS WRONG. No prime-field corollary may be drawn, the threshold table is NOT emitted, and the
      failure is the reported result.
    - >-
      The optimizer or optimal value does not verify symbolically. Algebra error; everything downstream is void.
    - >-
      The conservation cross-check does not return the reciprocal factorial exactly. Either the conservation finding or
      this instantiation is wrong, and the discrepancy is routed to a correction record rather than absorbed.
    - >-
      A threshold row's sign is not robust to the declared constant ranges at the decision-relevant arities. Those rows
      are unusable and are reported as indeterminate rather than quoted.
    - >-
      No primary source for the extension-field exponent can be obtained. The baseline gate is reported UNRUN under
      AGENTS.md rule 5; ONLY the internal cross-check and the symbolic verification may be reported, and no threshold
      table is emitted.
  interpretation_limits:
    - >-
      THIS CANNOT ESTABLISH THAT PRIME-FIELD INDEX CALCULUS FAILS AND CANNOT ESTABLISH THAT IT SUCCEEDS. It fixes a
      threshold with the decisive parameter free. The underlying open problem remains open in both directions and this
      hypothesis does not narrow it.
    - >-
      The low-arity reading is WITHIN-MODEL ONLY, and the model is known not to be tight - the recalled extension-field
      exponent beats it at one of the arities in question. No admissible cost within this model must NEVER be written as
      that arity is impossible. The discrepancy is the hypothesis's own headline and forbids that reading.
    - >-
      No claim tier above toy is available for any threshold number until the pinned constants are themselves validated
      against a measured implementation, which this hypothesis does not do.
    - >-
      The extension-field baseline is a DIFFERENT PROBLEM. Reproducing its exponent validates the SHAPE of the charge,
      not the applicability of the model to prime fields, where the factor base has no subfield description at all. This
      is the largest interpretive gap and must be stated in every deliverable.
    - >-
      The per-trial cost is not a single number for a real solver; the model uses an expectation, and a measured
      per-trial cost with an unbounded second moment does not satisfy the threshold even if its mean does.
    - >-
      Nothing here bears on the security of any deployed curve or scheme.
  status: proposed
  proposed_by: analysis-session
  specified_by: coordinator
  prior_evidence_refs:
    - RQ-ICEX-001
    - IDEA-20260803-fa9839
    - KN-FIND-007
    - KN-OPEN-001
    - KN-OPEN-020
    - GOAL-ICEX-001
    - EV-ICEX-001
    - EV-IC-002
    - EV-STR-002
    - EV-STR-003
  distinguishable_outcomes:
    - outcome: >-
        The optimizer verifies symbolically, the conservation cross-check returns the reciprocal factorial exactly, a
        primary source is transcribed and the signed discrepancy matches the model's implied expression at every degree,
        and every threshold row's sign is robust.
      meaning: >-
        T1 through T4 all hold. The question owns a machine-readable arity threshold table with pinned constants, plus a
        per-goal statement of what each deferred measurement would have to read to change a verdict, plus a NAMED missing
        ingredient in the relation-search term. The model is explicitly NOT TIGHT and every no-go reading is within-model
        and conservative; no advantage is claimed anywhere.
    - outcome: >-
        The transcribed exponent differs from the recollection.
      meaning: >-
        T3's discrepancy identity is WITHDRAWN and the gate is re-evaluated against the transcribed value. The model is
        not thereby void, but the specific localization of the missing ingredient is unsupported until the gate is
        re-passed, and the record must say which parts survive.
    - outcome: >-
        The model cannot be reconciled with the transcribed exponent by any named ingredient of the relation-search term.
      meaning: >-
        The two-term charge is WRONG. This is a clean negative: no threshold table is emitted, no prime-field corollary is
        available, and the failure is the reported result. It is more informative than a table would have been, because it
        says the deferral chain was not resting on a writable comparison after all.
    - outcome: >-
        The conservation cross-check does not return the reciprocal factorial exactly, or the optimizer fails symbolic
        verification.
      meaning: >-
        INSTRUMENT OR SOURCE-RECORD FAILURE. In the first case either the committed conservation finding or this
        instantiation is wrong and the discrepancy is routed to a CORRECTION record rather than absorbed; in the second it
        is an algebra error. Either way nothing downstream is reportable.
    - outcome: >-
        No primary source for the extension-field exponent can be obtained.
      meaning: >-
        The baseline gate is UNRUN under AGENTS.md rule 5. Only the symbolic verification and the internal cross-check are
        reportable, no threshold table is emitted, and no prime-field corollary may be cited. This is an infrastructure and
        retrieval outcome, not a mathematical one, and it is the outcome the parent proposal itself flags as the programme's
        systematic failure mode.
    - outcome: >-
        The null control moves the threshold exponent when the exact mean is replaced by a naive yield estimate.
      meaning: >-
        The claimed role of the conservation identity's EXACTNESS is overstated - the model is being carried by an estimate.
        The threshold may still be emittable but its provenance must be re-described, and the record's central mechanistic
        argument weakens accordingly.
