    claim_kind: structural_certificate

  heuristic_assumptions:
    - id: HEUR-BINSTD-770ec3-H1
      formal_statement: >-
        SPURIOUS-COUNT HEURISTIC. The symmetrised descended equation with
        e_k free in V^{(k)} has about 2^{sum_k dim V^{(k)} - n} solutions
        over F_2 (behaves as one uniformly random Boolean equation set of
        n equations on that many unknowns). Combined with genuine count
        ≈ 2^{ml - n}/m! (conservation), the spurious factor is
        ≈ m! 2^{sum_k dim V^{(k)} - ml}.
      random_model_justification: >-
        Uniform-fibre model for a polynomial map F_2^N → F_2^n with N>n
        having fibres of size about 2^{N-n}. Genuine-count side cites
        KN-FIND-007 conservation / balance form as used in the source IDEA.
      supporting_results:
        - ref: IDEA-20260926-120d6a
          provenance: internal
          claim: H1 spurious-count statement and RC-1 predicted factors
          verified_by: coordinator (proposal read in full this design session)
        - ref: KN-FIND-007
          provenance: kb
          claim: Mean decomposition yield conservation for every base of size B
          verified_by: coordinator (finding entry read this design session)
        - ref: KN-FIND-aa2efc
          provenance: kb
          claim: Free-oracle floors / rho 2^60.809 context for ECC2K-130
          verified_by: coordinator (finding entry read this design session)
      validation_experiment_ids:
        - EXP-BINSTD-ef7fa4
      falsification_condition: >-
        Measured spurious factor outside [1/4, 4] of
        m! 2^{sum dim V^{(k)} - ml} at two of three RC-1 cells l in {4,5,6}
        with lift_agreement=1.0; OR measured factor within 8 of 1 at l=6
        with lift_agreement=1.0 (surprise: equation enforces Vieta lift).

