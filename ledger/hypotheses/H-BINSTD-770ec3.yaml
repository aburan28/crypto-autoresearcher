# =============================================================================
# H-BINSTD-770ec3 -- S_m product-space saturation + spurious-lift certificate
# for symmetrised S_{m+1} on polynomial-basis subspace factor bases at
# ECC2K-130 balanced l (m >= 5), with RC-1 toy validation of the
# spurious-lift heuristic and a preregistered Frobenius-arm null (a77711).
# Specified and approved under DEC-20261001-dba19e from
# IDEA-20260926-120d6a under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. IDEA-20260926-120d6a claim text is not
# edited (proposals immutable). Class: structural_certificate / control.
# No exponent. No break. Zero deployed bearing as an attack claim.
# =============================================================================
hypothesis:
  id: H-BINSTD-770ec3
  question_id: RQ-BINSTD-b6f698
  related_question_ids:
    - RQ-FROB-7d8dd4
    - RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-120d6a
  experiment_id: EXP-BINSTD-ef7fa4
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-01'
  approved_at: '2026-10-01'
  authorised_by: DEC-20261001-dba19e
  proposed_by: coordinator
  title: >-
    S_m-symmetrised descent on polynomial-basis subspace bases saturates
    product spaces at ECC2K-130 balanced l (m>=5); spurious-lift factor at
    RC-1 tracks m! 2^{sum dim V^{(k)} - ml}; Frobenius arm preregistered null

  statement: >-
    SETTING. Binary curves E/F_{2^n} with polynomial-basis coordinate
    subspace factor base V = span{1, z, ..., z^{l-1}} of dimension l.
    Symmetrised summation-polynomial descent rewrites S_{m+1}(x_1,...,x_m,x_R)
    in elementary symmetric coordinates e_k = e_k(x_1,...,x_m) with each e_k
    ranging in the product space V^{(k)} of dimension
    dim V^{(k)} = min(k(l-1)+1, n) before reduction modulo the field
    polynomial (reduction cannot raise the dimension).

    CLAIM (A) — S_m PRODUCT-SPACE SATURATION (structural, arithmetic).
    At n = 131 (ECC2K-130) and every balanced free-oracle-optimal /
    cap-locus l for m >= 5, sum_k dim V^{(k)} strictly exceeds the plain
    unknown count m l. Concrete Stage-0 table cells (preregistered):
    (m,l)=(5,23): dims 23,45,67,89,111 sum 335 vs ml=115;
    (5,28): 28,55,82,109,131 sum 405 vs 140;
    (6,22)/(6,24): e_6 saturates or nearly saturates;
    (8,*): every e_k with k>=5 saturates. Therefore S_m symmetrisation on a
    SUBSPACE base does not shrink Boolean unknowns; it relocates the m!
    into the Vieta-lift constraint (that (e_1,...,e_m) arise from some
    tuple in V^m). This is the structural certificate; it moves neither
    attack-cost column.

    CLAIM (B) — FROBENIUS EXTENSION (preregistered null from a77711).
    Extending the symmetry group by <sigma> (order 131) acts as an
    equivariance across conjugate targets, not a symmetry of one instance
    (IDEA-20260906-a77711 Lemmas A1–A2). On the union of conjugate systems
    it acts freely; the invariant ring needs a degree-131 generator
    (Consequence A3). Predicted: no solving-degree / W_4-work drop vs one
    instance beyond the GGMP 1/131 constant on orbit-union bases. This
    packet cites a77711 and does not re-litigate it; P4 is a shape check
    at the n=17 Koblitz sibling.

    CLAIM (C) — SPURIOUS-LIFT RATE (the measurable).
    Drop the Vieta lift and solve the symmetrised descent with e_k free in
    V^{(k)}. Heuristic HEUR-BINSTD-770ec3-H1: solution count ≈
    2^{sum_k dim V^{(k)} - n}, genuine count ≈ 2^{ml - n}/m!, so the
    spurious factor ≈ m! 2^{sum dim V^{(k)} - ml}. At RC-1 (n=17, m=3,
    l in {4,5,6}) predicted factors are 2^{9.6}, 2^{13.6}, 2^{17.6}.
    Measured ratio within factor 4 of the formula supports (A); a ratio
    near 1 with exact lift checks would mean the symmetrised equation
    enforces the Vieta lift and would overturn (A).

    CLAIM TIER: structural_certificate + toy heuristic validation.
    NO exponent move. NO break. NO rho competitiveness. NO attack claim
    on any deployed curve. Subfield-base symmetrisation (Oakley /
    IDEA-20260922-70a67c) remains the proves-too-much baseline where
    V^{(k)}=V and symmetrisation works.

  statement_note: >-
    IDEA-20260926-120d6a claim text is immutable and left at status
    proposed. This hypothesis restates the mechanism with explicit
    Stage-0 table cells, HEUR id, certificate.kind vocabulary, and
    citation provenance suitable for a frozen EXP. Huang–Petit–
    Shinohara–Takagi 2013 remains recalled (m<=4 published form);
    the m>=5 saturation table at n=131 is hand arithmetic of this packet.

  mechanism: >-
    OBJECT FRAME (from source IDEA, retained). Representation R1:
    elementary symmetric coordinates (e_1,...,e_m) in product spaces
    V^{(k)} of a polynomial-basis subspace. Operation set Sigma: S_m
    action on tuples, negation, and (for part B) diagonal Frobenius on
    (tuple, target). Trichotomy: tuple→e-vector is Class I partial-action
    under S_m (block system on ordered tuples); does NOT propagate under
    translation by a factor-base element. Lossy projection: discards
    ordering (m!→1); Sigma-compatible because e_k is S_m-invariant;
    lossy in the representation because the e-vector does not determine
    the ordered tuple. The retained part needs MORE Boolean coordinates
    than the discarded ordering saved, because V is a subspace not a
    subfield: V^{(k)} grows with k while F_q^{(k)}=F_q. Declared
    off-limits components: F2 (family); FGHR/JV symmetrisation; a77711
    for the Frobenius part. What this packet freezes: Stage-0 saturation
    table, RC-1 spurious-lift protocol, random-subspace null, Frobenius
    null arm.

  assumptions:
    - >-
      V is the polynomial-basis coordinate subspace; a random subspace of
      the same dimension saturates product spaces at least as fast, so the
      polynomial basis is the BEST case for symmetrisation and the
      certificate is stated at that best case.
    - >-
      dim V^{(k)} = min(k(l-1)+1, n) before reduction; reduction cannot
      raise it (checked as P2 at RC-1).
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2, FGHR/JV symmetrisation, a77711.
    - >-
      Arithmetic at n=131 is Stage-0 analysis; executable cells at n=17.
    - >-
      Huang–Petit–Shinohara–Takagi 2013 product-space observation for
      m<=4 is RECALLED only; m>=5 saturation at n=131 does not depend on
      that paper's unread details.

  proof_search_map:
    bottleneck: >-
      Whether S_m-symmetrisation reduces the Boolean unknown count of the
      descended decomposition on a subspace base as it does on a subfield
      base; the answer is a dimension count plus a spurious-lift
      measurement when the lift is dropped.
    baseline_embedding:
      parameter_slice: >-
        Subfield case V=F_q in F_{q^n} (IDEA-20260922-70a67c Oakley slice):
        V^{(k)}=F_q for all k, unknowns m log2 q; symmetrisation works
        (JV 2010 form as frozen there). Same formula with V^{(k)}=V must
        reproduce "no saturation".
      reproduction_check: >-
        Symbolic Stage 0: at RC-1 (n=17, l=6, m=3) dims 6,11,16 computed
        by explicit span must match k(l-1)+1. Subfield symbolic row
        recorded as proves-too-much control.
    observation_collision:
      observable: dim V^{(k)} per (l,k) and spurious-lift factor per cell
      distinct_preimage_search: >-
        A large spurious factor could be (i) missing Vieta lift (claim)
        or (ii) e-space solver overcount. Separated by lifting each
        e-solution: factor X^m + e_1 X^{m-1} + ... + e_m over F_{2^n}
        and test whether all roots lie in V (exact per solution).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the symmetrised equation fixed; vary the constraint set:
          (a) e_k free in V^{(k)}; (b) e_k constrained by the Vieta lift
          (exact, equivalent to the plain system). The fibre of (a) over
          (b) is the spurious set.
        predicted_gain: none; certificate predicts the fibre is huge
    quantifier_order: >-
      FOR ALL l>=27 and m>=5 at n=131: dim V^{(m)}=131 for the
      polynomial-basis subspace (unconditional counting). FOR ALL
      subspace bases the symmetrised unknown count exceeds ml once
      k(l-1)+1 > l for some k (always for m>=2). PREDICTED at RC-1:
      spurious factor within 4x of m! 2^{sum dim V^{(k)} - ml}.
      Frobenius part is a77711's forall statement, preregistered null.
    method_ceiling:
      strongest_certifiable_claim: >-
        On ECC2K-130 at every balanced l, the S_m-symmetrised descent of
        S_{m+1} over a polynomial-basis subspace has
        sum_k min(k(l-1)+1, 131) Boolean unknowns (at least 335 at m=5
        against 115 plain), and without the Vieta lift its RC-1 solution
        count exceeds the genuine count by [measured factor]. Certifies
        NOTHING about solving cost WITH the lift imposed (that is the
        plain system), nothing about SAT/Groebner exponents, and nothing
        about a deployed attack.
      nearby_object_control: >-
        Subfield slice (symmetrisation works; V^{(k)}=V) as proves-too-much;
        size-matched random subspace at RC-1 (faster saturation, larger
        spurious factor); ordinary RC-1 unrelated targets as Frobenius-arm
        null.
    proof_obligations:
      - claim: dim V^{(k)} = min(k(l-1)+1, n) for the coordinate subspace before reduction
        responsibility: size
      - claim: n=131 dimension table at (m,l) in {(5,23),(5,28),(6,22),(6,24),(8,20)}
        responsibility: correctness
      - claim: Every e-solution is lifted or refuted exactly by factoring the degree-m polynomial
        responsibility: correctness
      - claim: Frobenius part adds nothing beyond a77711 (preregistered null)
        responsibility: scope
      - claim: No exponent / break / rho-beating claim from this certificate
        responsibility: scope
    not_applicable_reason: null

