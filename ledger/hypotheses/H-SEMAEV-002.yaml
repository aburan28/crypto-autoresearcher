hypothesis:
  id: H-SEMAEV-002
  question_id: RQ-ECDLP-001
  statement: Over toy prime fields (12-16 bits), at matched factor-base size, no structured
    m=2 factor base (consecutive interval or arithmetic progression) achieves an S_3
    decomposition yield exceeding 1.5x a matched random base.
  mechanism: m=2 decomposition yield is governed by how many factor-base x-coordinate
    pairs land on the decomposition surface of a random target; a low-complexity x-coordinate
    structure (interval, AP) does not densify that surface enough to change the yield
    by more than a constant factor at toy scale.
  assumptions:
  - enumeration over the small factor base counts all m=2 decompositions exactly
  - random on-curve targets are representative of the decomposition question
  predictions:
  - metric: ratio_interval_over_random
    direction: different
    minimum_effect: <= 1.5x (no material structured advantage)
  - metric: ratio_ap_over_random
    direction: different
    minimum_effect: <= 1.5x (no material structured advantage)
  test_boundary:
    instances:
    - seeds 1-3 x bits 12/14/16
    - 9 curves
    parameters:
      factor_base_size: 20
      decomposition_length: 2
      target_count: 300
    implementation: harness/semaev.py yield measurement at the recorded commit
    budget:
      wall_clock_seconds_per_run: 60
  falsification_conditions:
  - any tested instance shows a structured/random yield ratio > 1.5x
  interpretation_limits:
  - independent m=2 replication complements, does not restate, the campaign's m=3
    EXP-FB-001 (rejected_scoped); m may change the conclusion
  - toy prime fields only; yields saturate at very small group order (low bits)
  status: analyzed
  proposed_by: idea-generator
