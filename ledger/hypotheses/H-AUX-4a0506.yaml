hypothesis:
  id: H-AUX-4a0506
  question_id: RQ-SSI-001
  proposal_id: IDEA-20260806-7955a5
  added: '2026-08-06'
  statement: >-
    The input requirement of the higher-dimensional (Kani) embedding is
    expressible as an auxiliary triple tau(A) = (r, rho, delta) -- torsion-image
    rank, published torsion order divided by the secret map's degree, and whether
    that degree is public -- and on that axis: SIDH is (2, >1, 1) and broken; the
    plain prime-field ECDLP is (1, <1, 0) and is blocked by THREE independently
    sufficient obstructions; and no surviving assumption in RQ-SSI-001 scope is
    IN_KANI_REGIME on its currently published data. The three ECDLP obstructions
    are: the rank cannot be raised, because E(F_p)[N] is a single Frobenius
    eigenspace so every endomorphism acts on it as a scalar and psi(P) lies in
    <P>; the extension route that would supply rank 2 makes [k] act as the scalar
    matrix k*I, so knowing its action IS knowing k; and rho < 1, since k^2 > N
    for all but sqrt(N) of the possible scalars.
  mechanism: >-
    Kani's construction consumes a secret isogeny of KNOWN degree together with
    its images on a RANK-2 torsion group whose order EXCEEDS that degree. SIDH
    published exactly that and fell. The ECDLP's secret map is the endomorphism
    [k]: its degree k^2 is secret (delta = 0), its published action is on the
    single cyclic group <P> (r = 1), and the available rational torsion is
    smaller than the degree (rho < 1). Each of the three is on its own sufficient
    to block the construction, which is what makes the ECDLP row a closure at the
    docs/inventor-protocol.md section 4 standard rather than an observation.
    THE FIRST OBSTRUCTION IS THIS PROGRAM'S OWN RESULT, READ IN A NEW MODEL.
    IDEA-20260726-006's Frobenius collapse and the simulability closures
    KN-FIND-002 / KN-FIND-b7e091 record that endomorphisms give no generic
    advantage. The same eigenspace fact says something the GGM statement does
    not: no endomorphism can RAISE THE PUBLISHED RANK, which is precisely what
    the embedding machinery needs. The novelty is the re-reading, not a theorem.
    The screen is monotone in the direction schemes actually move -- publishing
    more data can only raise r and delta, never lower them -- which is what makes
    it usable as a design-time gate.
  assumptions:
    - >-
      Kani's requirement is expressible as the stated triple. Checked at Stage 0
      against primary text; if it is not, the index is the wrong shape and the
      hypothesis is void.
    - >-
      N = ord(P) is prime and the instance is on a prime-field curve with
      Pohlig-Hellman hygiene applied (KN-TECH-030). Composite-order and
      small-subgroup settings are out of scope and named as successor work.
    - >-
      The eigenspace argument applies to ALL endomorphisms, not only efficiently
      computable ones. The efficiency qualifier bounds the practical statement,
      never the mathematical one, and the write-up must keep the strong form.
    - >-
      tau is not claimed to be a complete invariant. An assumption can be broken
      outside it, and the census carries a mandatory non-empty "other known
      attack surfaces" column for that reason.
  proof_search_map:
    bottleneck: >-
      The exact torsion-rank requirement of the embedding construction. Every
      claim here is downstream of it: if the machinery can be made to work at
      rank 1 with additional structure, the ECDLP row changes and so does every
      conclusion.
    baseline_embedding:
      parameter_slice: SIDH/SIKE at its published parameters
      reproduction_check: >-
        Symbolic: instantiate the triple from the SIKE specification's published
        values and verify (r = 2, rho > 1, delta = 1) MECHANICALLY FROM THE
        SPECIFICATION, not from memory of the attack.
    observation_collision:
      observable: the triple tau(A)
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: two assumptions with the same triple
        and different security. This does NOT falsify the screen -- the screen
        claims only that the triple decides whether ONE machinery applies -- but
        it bounds every conclusion and is why the census's "other known attack
        surfaces" column may not be left blank. If no collision can be found,
        that is worth reporting as unexpectedly strong.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the triple at (r = 2, delta = 0) -- rank-2 images with a masked
          degree -- and vary the masking mechanism, seeking an intrinsic
          invariant separating maskings the machinery can still consume from
          those it cannot.
        predicted_gain: >-
          This is the only cell whose answer is unknown and where a real result
          would come from: a criterion sharper than "hide the degree", or a
          demonstration that hiding it is insufficient.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the requirement family from (2, >1, 1) to the largest triple
          set on which the embedding provably still applies.
        predicted_gain: >-
          Moves the safe/unsafe boundary to where it actually is rather than
          where SIDH happened to sit, which is what a design-time screen needs.
    quantifier_order: >-
      The load-bearing statement, with quantifiers explicit: FORALL prime-field
      curves E/F_p, FORALL points P of prime order N in E(F_p), FORALL psi in
      End(E), EXISTS a scalar c mod N with psi(P) = cP. The witness c may depend
      on (E, N, psi) and that dependence is harmless; what matters is that NO psi
      is exempt, which is why "the published rank cannot be raised by an
      endomorphism" is uniform. The failure mode to guard against is a reader
      silently weakening this to "for all efficiently computable psi", which
      would leave the general case open.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Assumption A is / is not in the regime where the higher-dimensional
        embedding machinery applies, given its currently published data." NEVER
        "A is secure". The distance between those two sentences is the entire
        interpretive risk of this hypothesis.
      nearby_object_control: >-
        A scheme with tau just outside the regime: rank 2, degree masked. If the
        screen cannot distinguish it from SIDH by anything except the delta bit,
        it has not identified the load-bearing structure and its verdicts on
        masked schemes are worthless.
    proof_obligations:
      - claim: Kani's requirement is exactly the stated triple.
        responsibility: baseline
      - claim: Every endomorphism acts as a scalar on E(F_p)[N].
        responsibility: correctness
      - claim: The extension route makes rank-2 data equivalent to knowing k.
        responsibility: correctness
      - claim: rho < 1 for all but sqrt(N) of the possible scalars.
        responsibility: size
      - claim: SIDH is classified IN_KANI_REGIME mechanically from its specification.
        responsibility: baseline
      - claim: A NOT_IN_KANI_REGIME verdict is never reported as a safety claim.
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-AUX-1
      formal_statement: >-
        For k drawn uniformly from [1, N-1] on a prime-field curve with N ~ p,
        rho = N / k^2 < 1 with probability 1 - O(N^{-1/2}).
      random_model_justification: >-
        The rigorous half is an elementary count: k^2 >= N exactly when
        k >= sqrt(N), which holds for all but sqrt(N) of the N-1 scalars, with no
        heuristic content whatever. The heuristic half is ONLY the uniformity of
        k, which is a statement about key generation rather than about
        mathematics -- and is therefore something to check per scheme rather than
        assume.
      supporting_results:
        - Elementary counting; no external result is required or cited.
      validation_experiment_ids: [EXP-AUX-8f5b2e]
      falsification_condition: >-
        A scheme in the census whose key generation demonstrably does not draw k
        uniformly, in which case rho must be recomputed for its actual
        distribution and that row's obstruction count may drop from three to two.
  structural_ingredients:
    - description: >-
        The higher-dimensional (Kani) embedding and its glue-and-split criterion.
      citation: KN-TECH-026. Primary text obtained at Stage 0; NOT read in this session.
      role: supplies the input requirement the triple encodes
    - description: >-
        SIDH's published torsion-image structure, the data that made the break
        possible.
      citation: KN-TECH-025
      role: supplies the positive control and calibrates the triple
    - description: >-
        Frobenius collapse: E(F_p)[N] is a single eigenspace, so every
        endomorphism restricts to a scalar on it.
      citation: IDEA-20260726-006, KN-FIND-002, KN-FIND-b7e091
      role: supplies the ECDLP row's first and strongest obstruction
  reduction_chain:
    core_problem: >-
      When does publishing auxiliary structure collapse an isogeny or DL
      assumption (KN-OPEN-015).
    corollaries: []
  predictions:
    - metric: classification of SIDH/SIKE by the mechanically applied screen
      direction: different
      minimum_effect: >-
        IN_KANI_REGIME with all three components derived from the specification.
        Any other outcome voids the entire census.
    - metric: independent obstructions blocking the ECDLP row
      direction: different
      minimum_effect: >-
        Exactly 3, each independently sufficient. Fewer surviving the audit
        weakens the closure and must be reported as such rather than rounded up.
    - metric: assumptions in scope with verdict UNDETERMINED
      direction: different
      minimum_effect: >-
        Each must name the exact missing fact. An UNDETERMINED without one is a
        census defect, not a research finding.
  test_boundary:
    instances: >-
      Specification documents and published-data inventories for SIDH/SIKE,
      plain ECDH/ECDSA on standardised prime-field curves, GLV/GLS curves, CSIDH,
      CGL, SQIsign, plus any masked-torsion variants recorded in this corpus; and
      one deliberately unsafe toy protocol constructed for the adversarial
      control.
    parameters:
      census_columns:
        - assumption
        - secret map
        - delta (is the degree public)
        - r (rank of published torsion images)
        - rho (published torsion order versus degree)
        - Kani-regime verdict
        - other known attack surfaces (never blank)
      toy_verification: >-
        An explicit GLV curve with an efficiently computable endomorphism psi,
        used to check psi(P) in <P> by direct computation.
    implementation: >-
      Mostly derivation and specification reading. The only computation is the
      toy-curve eigenspace check and the adversarial toy protocol.
    budget:
      total_cpu_hours: 2
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Kani's requirement is not expressible as the triple. The index is the wrong
      shape; the record is superseded, not amended.
    - >-
      SIDH is not classified IN_KANI_REGIME by the mechanical screen. Instrument
      failure; the census is void and nothing is reported.
    - >-
      A rank-1 instantiation of the embedding machinery is exhibited. The ECDLP
      row's first obstruction falls, and this is FAR MORE INTERESTING THAN THE
      CENSUS -- it would be a new handle on the ECDLP and becomes the successor
      proposal immediately.
    - >-
      The eigenspace argument fails on an explicit curve. Either the derivation
      or the implementation is wrong; the run halts either way.
  interpretation_limits:
    - >-
      The screen decides applicability of ONE machinery. It is not a security
      evaluation and no row may be summarised as one. This is the dominant risk
      of the whole record and it is a communication failure mode, not a technical
      one.
    - >-
      The ECDLP closure is scoped to prime-field curves with prime-order P and
      the currently known form of the embedding requirement. A change to that
      requirement reopens it; that is the stated revisit condition.
    - >-
      The (r = 2, delta = 0) cell is explicitly NOT closed and is handed forward
      as the open question.
    - >-
      Every row cites an exact specification version and field. Published-data
      inventories change between scheme versions.
  status: specified
  proposed_by: idea-generator
  specified_by: coordinator
  specified_at: '2026-08-06'
