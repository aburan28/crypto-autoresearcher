  title: 'alpha(m) of DPLL point decomposition at m in {3,4,5}: the per-attempt UNSAT conflict law 2^(ml)/m!
    persists on chained S_3 and direct S_(m+1), and no cell reaches alpha < m/2 - 1'
  statement: >-
    (From the IDEA-20261017-4b1672 claim.) For WDSat on Weil-descended Semaev systems over F_{2^n} (prime n 13..31,
    Koblitz and ordinary, V = polynomial-basis subspace of dim l) the per-attempt UNSAT conflict median obeys log2 c
    = a + alpha*l with alpha = m (c ~ 2^{ml}/m!) at m = 4 and 5 under every complete symmetry-pruned configuration
    and presentation P in {chained S_3, S_4-split, direct S_(m+1)}; no cell has a 95% CI upper bound below m-1,
    none near break-even m/2-1 (1 at m=4, 1.5 at m=5). Tested by EXP-SATIC-f50f16 at toy n on enumeration-certified
    UNSAT instances with WDSat vendored and sha-bound (the pilot's complete symfull patch) and CryptoMiniSat as
    control; nothing at n = 131; no attack and no speedup claim. The decision threshold is the program's per-attempt
    criterion alpha < m/2 - 1 (IDEA notes section 1), which no predicted outcome meets.
  mechanism: >-
    (Verbatim from IDEA-20261017-4b1672.) OBJECT FRAME. Representation R1 (x in F_2-subspace V; descent gives ml
    core bits). Sigma = S_m permutations of the factor-base tuple (plus translation by factor-base points: Class I,
    partial-action, IDEA-20260806-c5d183). Tracked object = a DPLL node = partial core assignment mod S_m.
    Lossy-projection test against Sigma: discards tuple order (exactly m!), compatible since S_(m+1) is
    S_m-symmetric. No new object; an existing one is priced. Readings of the tree size: H_enum alpha=m (no
    above-leaf pruning, IDEA-20260904-3c7a91); H_ideal alpha->m-1 (XG closes the last block, IDEA-20260926-b11cb1);
    H_sub alpha<m-1. Presentation is an independent variable: the m=3 pilot separates chained (2.26-2.55) from
    direct (2.98).
  assumptions:
  - 'F2 factor-base decomposition used as a component only (IDEA-20261017-4b1672).'
  - 'Labels are ground truth only when two independent exhaustive enumerators agree (E1 curve-level root solving,
    E2 Boolean count; E3 group-law brute force for the direct S_5 builder check); a disagreement voids the
    instance (IDEA notes G4).'
  - 'A configuration is fitted only if complete on every UNSAT-labelled instance and every SAT answer carries a
    curve-verified model (IDEA notes G5); stock -b on chained m >= 4 is incomplete and never fitted.'
  - 'WDSat conf counts branch points, not CDCL conflicts (IDEA confounders); comparisons across solvers are by
    slope only.'
  proof_search_map:
    not_applicable_reason: 'measurement; no theorem. Baseline slice: m=3 Xn15l5/Xn17l6/Xn19l6 under -b.'
  asymptotic_claim: null
  target_complexity:
    time_exponent: 'per attempt 2^{alpha l}, predicted alpha=m; no improvement claimed'
    memory_exponent: 'poly(l); WDSat static, ~17MB reported'
    best_known: 'rho 2^{n/2}; (m-1)-fold enumeration 2^{(m-1)l}/(m-1)! (IDEA-20260904-96c4f3) dominates DPLL;
      measured MITM alpha 2.32 at m=4'
    hidden_overhead: 'n-dependent poly cost per node'
    tradeoff_note: 'relations total ~ m!*2^{(1+alpha)n/m}'
  dominated_by: '(m-1)-fold enumeration at alpha = m-1 (IDEA-20260904-96c4f3) and the measured chained-S_3 MITM at
    m=4 (alpha 2.32, ctrial-harvest); all above m/2-1 (IDEA notes section 1)'
