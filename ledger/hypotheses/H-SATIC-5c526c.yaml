  heuristic_assumptions:
  - id: H1
    statement: 'Complete pruned WDSat UNSAT conflicts ~ C(2^l+m-1,m) ~ 2^{ml}/m!, within [0.5,2]x per cell.'
    rigorous_support: 'lex-ordered m-tuples counted exactly by C(2^l+m-1,m); imitates exhaustive-enumerator tree
      size (Trimoska Prop. 1 backdoor).'
    validation_plan: 'm=3 gate; m=4 l=3..6, m=5 l=2..5; median over exact count; tail max/median <= 1.5.'
    validation_experiment_ids:
    - EXP-SATIC-f50f16
    falsification_condition: 'a complete pruned cell with median/(2^{ml}/m!) outside [0.5,2] or max/median > 1.5
      (IDEA validation plan); CI upper bound of alpha below m-1 refutes H_enum there (IDEA falsification
      condition 1)'
  - id: H2
    statement: 'Under pruning alpha is presentation-independent: |alpha(P)-alpha(P'')| <= 0.3 at fixed m.'
    rigorous_support: 'all presentations share one solution set (E3); backdoor size ml is invariant.'
    validation_plan: 'paired cells, same curves/targets. Unpruned m=3 pilot (2.26-2.55 vs 2.98) already violates
      it: scoped to pruned configs.'
    validation_experiment_ids:
    - EXP-SATIC-f50f16
    falsification_condition: '|alpha(direct) - alpha(chained)| > 0.3 at fixed m under pruned complete configs
      (IDEA prediction 4)'
  - id: H3
    statement: 'c depends on (m,l), not on n or curve family, at n >= ml+3.'
    rigorous_support: 'core-variable tree is blind to n beyond leaf tests.'
    validation_plan: 'fixed l, n in 13..31, Koblitz vs ordinary (pilot m=4,l=3: 160 vs 177).'
    validation_experiment_ids:
    - EXP-SATIC-f50f16
    falsification_condition: 'median conflicts at fixed (m,l) differing by more than a factor 2 across n or
      between Koblitz and ordinary curves on complete cells (descriptive in EXP-SATIC-f50f16; no criterion)'
