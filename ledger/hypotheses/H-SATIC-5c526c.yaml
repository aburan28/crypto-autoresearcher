  distinguishable_outcomes:
  - 'support_scoped: G0 passes, P1-P3 hold on every complete cell with >= 20 UNSAT instances, no such cell has an
    alpha CI upper bound below m-1, every fitted configuration is complete and every SAT model is verified.'
  - 'falsify: any complete cell with >= 20 UNSAT instances at two or more l values has an alpha CI upper bound
    below m-1 (the first sub-exhaustive SAT behaviour at m >= 4; routes to replicate, not to a claim).'
  - 'criterion met (escalation, not a claim): an alpha CI upper bound below m/2-1 anywhere; routes to RQ-RELN-001.'
  - 'inconclusive: fewer than two l values completed per m at m >= 4; or local slope falls by > 0.5 across the
    ladder (power law is a small-l artefact).'
