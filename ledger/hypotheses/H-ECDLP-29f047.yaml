hypothesis:
  id: H-ECDLP-29f047
  question_id: RQ-ECDLP-001
  derived_from_idea: IDEA-20260806-e4f96e
  added: '2026-08-25'

  statement: >-
    SCOPE: the frozen toy Semaev point-decomposition systems already used in
    this program's DREG lane, at arity m in {3, 4} and prime field size
    p <= 2^16, in three declared encodings. CLAIM TIER toy. NO LOWER BOUND ON
    THE ECDLP IS CLAIMED -- this bounds ONE STEP (relation collection by
    algebraic decomposition) inside ONE attack family, in ONE encoding, in ONE
    proof system.

    THE HYPOTHESIS, IN TWO PARTS THAT ARE MEASURED SEPARATELY.

    PART S (THE SIMULATION IS USABLE AS STATED). A Groebner-basis computation
    that terminates having considered no polynomial of degree above D yields a
    degree-D polynomial-calculus refutation of the same system, in the exact
    PC variant used, with the field-equation convention declared. If the
    mechanical extraction of such a refutation from a logged F4 run FAILS, the
    load-bearing relation is false as stated and the whole line ends there.
    This part is a HARD GATE and is not evidence about refutation degree.

    PART C (WHAT THE COMPARISON DECIDES). Conditional on Part S, PC(F) computed
    by Macaulay rank is compared against the maximum degree the reference
    Groebner solver actually reaches on the identical instance, under a
    PRE-REGISTERED three-way rule -- a signed gap of 0 records OUTCOME 1, the
    program's heuristic degree meters were tracking a solver-independent
    obstruction at this scale; a gap of at least 2 records OUTCOME 2, a
    low-degree algebraic refutation EXISTS that the solver does not find and
    its size is an explicit algorithmic target; a gap of exactly 1 is declared
    INCONCLUSIVE IN ADVANCE so neither branch can be reached by rounding.

    AND THE CONTROL THAT BOUNDS BOTH. Matched random systems -- same variable
    count, total degree, per-variable degree, support size and Newton polytope
    -- are measured on the identical pipeline. A gap of at least 2 between the
    Semaev and matched-random PC degrees is REQUIRED before any Semaev-specific
    statement may be made. THE PREDICTED OUTCOME IS NO GAP, i.e. that at this
    scale refutation degree is a function of the system's SHAPE, and that
    prediction is recorded here so a match is a confirmed control rather than a
    disappointment.

  mechanism: >-
    ADAPTED FROM PROOF COMPLEXITY, an adjacent field. Nothing about degree
    lower bounds in polynomial calculus is claimed as new; what is new to this
    program is the application, and specifically the observation that it
    changes what KIND of statement the DREG-lane measurements support.

    (1) WHY PC DEGREE IS A DIFFERENT KIND OF QUANTITY. The degree of regularity
    and the first-fall degree are properties of a solver's execution. The
    polynomial-calculus refutation degree PC(F) is a property of the SYSTEM,
    quantified over solvers -- if a Groebner computation reaching degree at
    most D yields a degree-D PC refutation, then PC(F) > D implies EVERY
    Groebner-order solver in the declared model must reach degree at least
    PC(F). One integer bounds a class where the program has been benchmarking
    members one at a time.

    (2) THE OBJECT. Fix a prime-field curve, a factor base given by a vanishing
    condition, a target point with NO m-decomposition over that factor base,
    and an arity m. The system is the Semaev summation polynomial together with
    factor-base membership equations and the field equations. Unsatisfiability
    makes PC(F) defined.

    (3) WHY IT IS CHEAP TO COMPUTE. For fixed D, "does a degree-D PC refutation
    exist" is a rank question on the degree-D Macaulay matrix -- build all
    products of axioms by monomials up to degree D and ask whether 1 is in the
    row space. PC(F) is the least such D, found by search on D. NS degree is
    the same computation restricted to linear-combination-only derivations,
    giving a second, weaker, even cheaper number.

    (4) WHY THE ENCODING SWEEP IS NOT OPTIONAL. PC degree is NOT an invariant
    of the variety; it is a function of the presentation. At least three
    encodings are measured and reported side by side, and every reported number
    names its encoding. A single number from a single encoding is not a result.

    (5) WHY THE MATCHED-RANDOM NULL IS BLOCKING. Semaev summation polynomials
    have specific structure. The question the null answers is whether ANY of it
    shows up in the refutation degree, or whether the degree is a function of
    the shape alone. If matched random systems give the same PC degree, the
    measured number says nothing about Semaev and reporting it as a Semaev
    result would be exactly the artifact the inventor protocol forbids.

    (6) THE INSTRUMENT'S OWN SOUNDNESS CHECK. A satisfiable instance -- a
    target that DOES decompose -- must yield no refutation at any tested
    degree. A pipeline returning a finite refutation degree for a satisfiable
    system is broken and the line halts before anything is reported.

  assumptions:
    - >-
      The Groebner-to-PC simulation holds in the exact variant used (PC over
      F_p versus PCR with dual variables, and whether the field equations count
      as axioms). It is verified CONSTRUCTIVELY at toy scale rather than
      assumed, and a failure ends the line rather than being repaired.
    - >-
      Toy scale is where exact rank computations on the degree-D Macaulay
      matrix are feasible. Everything reported is scoped there and NO
      extrapolation to cryptographic-scale degrees is performed or licensed.
    - >-
      The factor base is the one already frozen in this program's toy Semaev
      protocols, so the measured numbers are comparable with existing DREG-lane
      records rather than describing a fresh setup. If it is not, the Outcome
      1/2 comparison is meaningless.
    - >-
      "Groebner-order solver" is pinned to a stated model. F4, F5, XL and
      BooleanSolve are inside it; a solver manipulating polynomials in a
      factored or straight-line representation is NOT, and the bound says
      nothing about it. This limit is a feature of the model and appears in
      every write-up.
    - >-
      The field-equation accounting convention is FROZEN before any Semaev
      number is produced and is reported with every number, because whether the
      field equations are axioms or are built into the ambient ring changes the
      degree materially.
    - >-
      AVAILABILITY IS NOT ASSUMED. A Groebner engine may be absent from the
      execution container; prior lane records report Sage and sympy absent. If
      it is absent, the F4 arm is INFRASTRUCTURE-BLOCKED, the Outcome 1/2
      verdict is DEFERRED, and the run reports PC and NS degrees with the null
      only. That is a blocked arm, never a negative result.

  proof_search_map:
    bottleneck: >-
      The rank computation on the degree-D Macaulay matrix, whose column count
      grows as binomial(n + D, D) in the number of variables n. This step
      determines the largest (m, p) reachable and is where the whole compute
      budget goes.
    baseline_embedding:
      parameter_slice: >-
        m = 3, the smallest declared prime, encoding E1 -- the exact instance,
        seed, factor base and target already used in an existing DREG run
        record.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE. The same instance is re-run through both
        meters and the recorded degree of regularity is compared, as an EXACT
        INTEGER, with the newly measured maximum degree reached by the
        reference solver. Any mismatch is an instrument-comparability failure
        and halts the line -- if the two meters are not measuring comparable
        things on the one instance where both have already been run, the
        Outcome 1/2 comparison is meaningless everywhere else.
    observation_collision:
      observable: >-
        The single integer PC(F).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, which is why the null is blocking --
        find two systems with the same PC degree, one Semaev and one matched
        random. The collision does not falsify the measurement, it CALIBRATES
        it, establishing that PC degree at this scale is a function of shape
        rather than of summation-polynomial structure, and bounding what any
        conclusion drawn from the number may say. Reporting a Semaev PC degree
        without having run this search is prohibited.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "how hard is decomposition for algebraic solvers" into the proof
          system, where it becomes the exact condition "1 is in the row space
          of the degree-D Macaulay matrix". Encoding obligation -- three
          declared encodings, reported separately. Completeness -- every
          Groebner run in the model yields a PC refutation of its own degree.
          Soundness -- a refutation exists only for unsatisfiable systems, which
          the satisfiable control tests. Transfer -- NONE across encodings, and
          none is claimed. Cost -- one rank computation per (instance, D).
        predicted_gain: >-
          Converts a per-solver empirical curve into one integer per instance
          that bounds all of them. The gain is in the STRENGTH OF THE
          STATEMENT, not in attack cost.
      - transform: stronger_invariant
        proposed_object: >-
          The full rank profile of the Macaulay matrix as a function of D,
          rather than only the threshold at which 1 appears.
        predicted_gain: >-
          A curve rather than a point, comparable across m and against the null
          with far more resolution than a single crossing.
    quantifier_order: >-
      INTENDED -- FOR ALL encodings in the declared set, FOR ALL instances F in
      the declared toy family, THERE EXISTS an integer PC(F) such that FOR ALL
      Groebner-order solvers S in the declared model, the maximum degree
      reached by S on F is at least PC(F). THE DANGEROUS WEAKER READING, NOT
      CLAIMED -- FOR ALL S THERE EXISTS a degree bound, which lets the bound
      depend on the solver and is exactly what the degree of regularity already
      is. The audit obligation is to check that the simulation is UNIFORM over
      solvers in the model and uses no property of a particular strategy.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No Groebner-order solver, in this encoding, on this instance family,
        at this scale, reaches a solution below degree PC(F)." It can NEVER
        certify anything about non-algebraic algorithms, about a different
        encoding, or about the ECDLP itself. Any summary dropping one of those
        four qualifiers is overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        THE DECOMPOSABLE INSTANCE -- the same curve, factor base and arity with
        a target that DOES decompose. The method must FAIL to produce a
        refutation there. A method that cannot distinguish the decomposable
        from the undecomposable instance has not identified the load-bearing
        structure and is measuring the encoding's shape only.
    proof_obligations:
      - claim: The Groebner-to-PC simulation holds in the variant used.
        responsibility: correctness
      - claim: PC(F) computed by Macaulay rank equals its definition.
        responsibility: correctness
      - claim: The search on D terminates and returns the least such D.
        responsibility: runtime
      - claim: The satisfiable control yields no refutation at any tested D.
        responsibility: success_probability
      - claim: Every reported degree names its encoding and its field-equation convention.
        responsibility: scope
      - claim: >-
          The measured maximum solver degree reproduces the recorded DREG-lane
          degree of regularity on the frozen fixture, exactly.
        responsibility: baseline
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO ATTACK EXPONENT IS CLAIMED. The proposal produces a
    lower bound on one step of one attack family in one encoding, not an
    algorithm. Pollard rho at p^(1/2) with O(1) memory remains the prime-field
    ECDLP baseline and nothing here approaches it. If OUTCOME 2 fires, the gap
    it exposes would be the INPUT to a separate algorithmic proposal carrying
    its own exponent claim, heuristics and cost table -- it is not itself an
    improvement.

  heuristic_assumptions:
    - id: HEUR-PC-1
      formal_statement: >-
        For the frozen toy Semaev family, the PC refutation degree measured at
        m in {3, 4} and p <= 2^16 is a monotone non-decreasing function of m at
        fixed p, and its dependence on p is o(log p).
      random_model_justification: >-
        Monotonicity in m is expected because the arity-m system contains the
        arity-(m-1) structure after specialisation. The p-dependence half
        imitates the standard expectation that an algebraic system's refutation
        degree is governed by its combinatorial shape rather than by field size
        once the field is large enough to avoid degenerate coincidences.
        NEITHER HALF IS A THEOREM QUOTED HERE.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-bf1129]
      falsification_condition: >-
        PC degree decreasing in m at fixed p on any cell, or a fitted
        p-dependence that is not o(log p) over the declared prime ladder, with
        the matched-random null measured on the identical grid so that the
        Semaev p-dependence is read against the p-dependence of shape alone
        rather than against zero.
    - id: HEUR-PC-2
      formal_statement: >-
        The maximum degree reached by the specific reference solver
        implementation is a faithful proxy for "the degree a Groebner-order
        solver reaches" in the declared model, i.e. the instrumentation reports
        that degree correctly.
      random_model_justification: >-
        Not distributional. The simulation is what makes any Groebner run yield
        a PC refutation; HEUR-PC-2 is the narrower implementation claim that
        the logging is faithful.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-bf1129]
      falsification_condition: >-
        Two independent solver implementations on frozen seeds reporting
        DIFFERENT maximum degrees on the same instance. That is an instrument
        failure, not a finding, and no Outcome 1/2 verdict may be recorded
        until it is resolved.

  predictions:
    - metric: >-
        S1 -- simulation_extraction_success -- whether a degree-D PC refutation
        is mechanically extracted from a logged degree-D solver run on one
        small unsatisfiable instance
      direction: different
      minimum_effect: >-
        MUST SUCCEED. HARD GATE. Failure means the load-bearing relation is
        false as stated in the variant used, and the record is superseded
        rather than amended.
    - metric: >-
        C1 -- satisfiable_control_refutation_degree -- the refutation degree
        the pipeline reports on a target that DOES decompose
      direction: different
      minimum_effect: >-
        NONE AT ANY TESTED DEGREE. A finite value means the instrument is
        broken and nothing is reported from any arm.
    - metric: >-
        C2 -- textbook_validation -- PC degrees on instances of known
        refutation degree
      direction: different
      minimum_effect: >-
        EXACT agreement with the known degrees. Disagreement blocks every
        Semaev number.
    - metric: >-
        M1 -- pc_versus_solver_gap -- the signed integer (max solver degree
        minus PC degree) on the identical instance, per (m, p, encoding)
      direction: different
      minimum_effect: >-
        PRE-REGISTERED THREE-WAY RULE, fixed before any run -- gap 0 records
        OUTCOME 1; gap >= 2 records OUTCOME 2 with the gap as the quantified
        target; gap exactly 1 is INCONCLUSIVE by prior declaration, so that
        neither branch is reachable by rounding. A NEGATIVE gap (PC above the
        solver degree) contradicts the simulation and voids Part S for that
        cell.
    - metric: >-
        N1 -- semaev_versus_matched_random_pc_gap -- the difference in PC
        degree between the Semaev system and matched random systems on the
        identical pipeline
      direction: different
      minimum_effect: >-
        A gap of AT LEAST 2 is REQUIRED before any Semaev-specific statement is
        made. THE PREDICTED OUTCOME IS NO GAP, recorded here so a match is a
        confirmed control rather than a disappointment -- and the honest
        headline would then be that at toy scale the refutation degree of the
        decomposition system is a function of its shape.
    - metric: >-
        E1 -- encoding_spread -- the spread of PC degree across the three
        declared encodings on the same instance
      direction: different
      minimum_effect: >-
        REPORT THE FULL SPREAD. A spread of 3 or more means the number is
        primarily an encoding artifact, which bounds every conclusion drawn
        from it and must be stated in the same sentence as any reported degree.
    - metric: >-
        H1 -- rank_profile -- the full Macaulay rank profile as a function of
        D, per instance, not only the crossing point
      direction: different
      minimum_effect: >-
        Reported as a curve per instance, alongside the null's curve, so the
        comparison has resolution beyond a single integer.

  test_boundary:
    instances:
      - >-
        The frozen toy Semaev point-decomposition systems already used in this
        program's DREG lane, at m in {3, 4}, prime-field curves with p <= 2^16,
        and targets with no m-decomposition over the frozen factor base.
      - >-
        The SATISFIABLE control -- the same curve, factor base and arity with a
        target that does decompose.
      - >-
        MATCHED RANDOM systems -- same variable count, total degree,
        per-variable degree, support size and Newton polytope.
      - >-
        TEXTBOOK instances of known refutation degree, for implementation
        validation before any Semaev number is produced.
      - >-
        The frozen DREG fixture -- an exact instance, seed, factor base and
        target already used in a committed DREG run record.
      - >-
        OUT OF SCOPE -- m >= 5; p > 2^16; binary or extension fields; any
        encoding outside the three declared; any non-algebraic solver; and
        every cryptographic-size parameter.
    parameters:
      arities: [3, 4]
      max_prime_bits: 16
      encodings: [E1, E2, E3]
      field_equation_convention: frozen before any Semaev number is produced
      degree_search: search on D with the least D reported
    implementation: experiments/EXP-ECDLP-bf1129
    budget:
      stage1_wall_clock_seconds: 7200
      stage2_wall_clock_seconds: 7200
      stage4_wall_clock_seconds: 43200
      maximum_memory_gb: 32
      maximum_runs: 20

  distinguishable_outcomes:
    - outcome: >-
        S1 succeeds, C1 reports no refutation, C2 exact, the frozen fixture
        reproduces, and M1's gap is 0 with N1 showing no Semaev-versus-random
        gap.
      means: >-
        OUTCOME 1, SCOPED BY THE NULL. The heuristic degree meters were
        tracking a solver-independent obstruction AT THIS SCALE AND IN THIS
        ENCODING -- but with N1 showing no gap, that obstruction is a property
        of the system's SHAPE and not of summation-polynomial structure. The
        honest headline is the controlled null, and the promotion of DREG-lane
        measurements from solver behaviour to solver-independent statements is
        scoped to shape, to the tested encodings, and to m in {3,4}.
    - outcome: >-
        Same gates pass and M1's gap is at least 2.
      means: >-
        OUTCOME 2. A low-degree algebraic refutation EXISTS that the reference
        solver does not find, and its size is an explicit quantified target.
        This is NOT an attack and NOT a speedup -- it is a measured
        inefficiency in this program's own solver, and converting it into an
        algorithm is separate work with its own record.
    - outcome: >-
        M1's gap is exactly 1.
      means: >-
        INCONCLUSIVE BY PRIOR DECLARATION. Neither outcome is recorded. This
        cell resolves nothing and the design says so rather than rounding to a
        branch.
    - outcome: >-
        S1 fails -- a degree-D solver run does not yield a degree-D PC
        refutation in the variant used.
      means: >-
        The load-bearing relation is FALSE as stated. Part S is refuted, the
        record is superseded rather than amended, and no refutation-degree
        number from this line may be interpreted as a solver bound.
    - outcome: >-
        C1 returns a finite refutation degree on the satisfiable control, or C2
        disagrees with a known degree.
      means: >-
        INSTRUMENT BROKEN. Nothing is reported from any arm. The deliverable is
        the instrument defect.
    - outcome: >-
        N1 shows no gap between Semaev and matched-random PC degrees.
      means: >-
        NO SEMAEV-SPECIFIC CONCLUSION MAY BE DRAWN. The honest report is that
        PC degree at this scale measures shape -- and THAT IS THE RESULT, a
        controlled null under docs/inventor-protocol.md section 3. It was
        predicted in advance precisely so it cannot be reframed as a
        disappointment.
    - outcome: >-
        E1's encoding spread is 3 or more.
      means: >-
        The measured number is primarily an encoding artifact. Every
        conclusion is bounded by that and the bound must appear in the same
        sentence as any reported degree.
    - outcome: >-
        Macaulay matrices at m = 4 exceed the memory budget before any degree
        resolves, or no Groebner engine is available for the solver arm.
      means: >-
        INFRASTRUCTURE, under AGENTS.md rule 5. Recorded as such and NEVER as
        evidence about refutation degree. If only the solver arm is blocked,
        PC and NS degrees plus the null are still reported and the Outcome 1/2
        verdict is DEFERRED, not guessed.

  falsification_conditions:
    - >-
      F1 -- Stage-1 extraction fails. The Groebner-to-PC relation is false as
      stated in the variant used; the record is superseded.
    - >-
      F2 -- the satisfiable control returns a finite refutation degree.
      Instrument broken; nothing reported.
    - >-
      F3 -- textbook validation instances give the wrong known degree. Same
      disposition.
    - >-
      F4 -- matched random systems give the same PC degree as Semaev systems.
      No Semaev-specific conclusion may be drawn; the honest report is that PC
      degree at this scale measures shape, and that IS the result.
    - >-
      F5 -- the frozen DREG fixture's recorded degree of regularity does not
      reproduce as an exact integer against the measured maximum solver degree.
      The two meters are not comparable and the Outcome 1/2 comparison is void.
    - >-
      F6 -- M1 is NEGATIVE on any cell (PC degree above the measured solver
      degree). This contradicts the simulation and voids Part S for that cell.
    - >-
      F7 -- two independent solver implementations report different maximum
      degrees on the same instance. HEUR-PC-2 fails; instrument failure, not a
      finding.
    - >-
      F8 -- PC degree DECREASES in m at fixed p on any cell. HEUR-PC-1 is
      refuted at that cell and the refutation is localised there rather than
      generalised.

  interpretation_limits:
    - >-
      Bounds ONE STEP of ONE attack family in ONE encoding in ONE proof system,
      at toy scale. NOT a statement about the ECDLP.
    - >-
      OUTCOME 1 does not make index calculus infeasible. It makes the existing
      degree measurements solver-independent WITHIN THE STATED MODEL, at the
      tested scale, in the tested encodings -- and, if the null matches, only
      as a function of system shape.
    - >-
      OUTCOME 2 is NOT an attack. It is a quantified inefficiency in this
      program's own solver, and converting it into an algorithm is separate
      work with its own record and its own cost table.
    - >-
      Nothing here interacts with the generic-group lower bound. That bounds
      generic algorithms; this bounds algebraic solvers on a specific encoding.
      They are different models and neither implies the other.
    - >-
      The result hides entirely inside "in this encoding". A different encoding
      of the same mathematics can have a different PC degree, and no bound
      proved here transfers across the encoding sweep automatically. This
      qualifier is required in every downstream summary.
    - >-
      A memory-exhausted or engine-missing cell is an infrastructure outcome
      and is never evidence about refutation degree in either direction.

