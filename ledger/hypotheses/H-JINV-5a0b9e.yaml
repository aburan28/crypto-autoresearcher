hypothesis:
  id: H-JINV-5a0b9e
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  source_design: >-
    analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
    sections 3 and 4, E2, BETWEEN-CLASS ARM ONLY

  statement: >-
    SCOPE. The matched-order family N = 19507 (prime). Isogeny classes are
    generated by the identity D = (t - 2)^2 - 4N with p = N + t - 1 required
    prime, so that #E(F_p) = N EXACTLY in every class of the family. The design
    document reports 59 such classes, ~2000 curves in total, of which 51 lie at
    conductor f = 1 and carry 46 distinct fundamental discriminants spanning
    |D_0| = 1299 to 78027. Two contrasts, MEASURED AND REPORTED SEPARATELY AND
    NEVER POOLED. CLAIM TIER toy. NO ATTACK, NO EXPONENT, NO SPEEDUP,
    sota_delta ZERO.

    CLAIM (H1, THE |D_0| ARM). Across the 51 conductor-1 classes, with the group
    order held identically fixed at N = 19507 by construction, the relation-
    collection statistics decomposition_rate_m2, decomposition_rate_m3,
    liftable_density and decomposition_efficiency are measured against |D_0|.
    Because at f = 1 the minimal endomorphism norm satisfies
    N(alpha_min) ~ |D_0|/4, this is the only clean realisation available to this
    campaign of the hoped-for signal "N(alpha_min) down => relation density up".
    H1 states that the matched-order construction makes this contrast
    interpretable -- the #E confound that voided every earlier between-class
    result in this campaign is not modelled, matched or adjusted for; it VANISHES
    IDENTICALLY, because every class has the same N.

    CLAIM (H2, THE |Aut| ARM, SEPARATE AND NOT POOLED WITH H1). One class in the
    family, t = 211, p = 19717, D = -34347 = -3 * 107^2, is a depth-1
    107-volcano with a single crater vertex at j = 0 (End = Z[zeta_3],
    |Aut| = 6) and, per the design document's cross-check against
    h(-3 * 107^2) = 107 * (1 + 1/107) / 3 = 36, thirty-six floor vertices at
    generic j with |Aut| = 2. Inside this one class |Aut| varies while D_0, N, p
    and t are all identical. ACROSS classes |Aut| = 6 and |D_0| = 3 are perfectly
    confounded and can never be separated; INSIDE this class they separate
    exactly. This is the only place in this program where that separation is
    available, and H2 is the claim that it is worth measuring exactly once, at
    its true n.

    TRANSPORT. gcd(107, 19507) = 1 and N is prime, so T1 (DECOMPOSITION.md
    section 3) applies: the 107-isogeny carries the ECDLP instance between the
    crater and the floor of this class WITH THE SAME k. The two arms of H2 are
    therefore two representations of one discrete-logarithm problem, which is
    what makes a difference between them a statement about representation and
    not about difficulty.

    WHAT IS NOT CLAIMED. No advantage over the automorphism-discounted rho
    baseline of KN-TECH-018, under which a factor at or below sqrt(6) ~ 2.449 on
    a |Aut| = 6 curve is BASELINE CALIBRATION and is recorded as such, never as
    an attack. No exponent. No statement about crypto scale: N = 19507 is a
    14.25-bit group order. H-ENDO-001 is used as the admissibility filter and not
    retested. Nothing here bears on H-STR-002 in either direction -- no
    equivariant factor base is constructed and no phi-stable structure is tested
    -- so GOAL-ENDO-001 pause condition P2 is not triggered. Nothing here
    presumes H-ICINV-6c7920 true or false; this contract simply does not use the
    sampler that hypothesis disputes.

  mechanism: >-
    STEP 0 -- WHY THE OBVIOUS BETWEEN-CLASS DESIGN FAILED AND WHY THIS ONE DOES
    NOT. The campaign's committed obstruction is that its between-class
    instrument, NULL-C, is a between-class MEAN detector with power 1.00 at a
    0.9% shift (red_team_notes.md section 5), which is exactly the sensitivity
    profile that makes it fire on the #E confound identified in
    CORR-20260807-a05e1e rather than on anything about endomorphisms. Matching on
    #E post hoc cannot fix this, because #E and D are linked by D = t^2 - 4p and
    a between-class comparison at fixed p necessarily varies both. Fixing N
    instead and letting p float breaks the link: write N = p + 1 - t, then
    D = t^2 - 4p = (t - 2)^2 - 4N. Fix N, sweep t over the values for which
    p = N + t - 1 is prime, and D -- hence D_0 and f -- sweeps freely while N is
    literally the same integer in every class. There is no covariate to adjust
    and no matching procedure to get wrong.

    STEP 1 -- WHAT THE FAMILY IS, AND THAT IT IS NOT YET A MEASUREMENT. The
    class inventory of the family (59 classes; 51 at f = 1; 46 distinct D_0 with
    five values hit twice by trace pairs, giving a free internal replication
    check; |D_0| from 1299 to 78027; conductor arm f in {1, 3, 107}; the
    t = 211, p = 19717 class with D = -3 * 107^2) is reported in the design
    document as DERIVED IN THAT SESSION BY A SCRIPT, not as a committed run. It
    has no run record, no manifest and no independent verification. Stage 1 of
    EXP-JINV-bd141d re-derives the entire family under an immutable run record
    and certifies each class complete against the Hurwitz-Kronecker mass formula.
    NOTHING in any decision rule may depend on those figures until that run
    exists. If Stage 1 fails to reproduce the family, the experiment terminates
    in the pre-registered PREMISE-FAILED state and this hypothesis is withdrawn
    as mis-specified rather than refuted.

    STEP 2 -- THE DEURING WEIGHTING CAVEAT, CARRIED FORWARD EXPLICITLY. The class
    sizes quoted above are class numbers of orders. For D_0 in {-3, -4} the
    Deuring correspondence weights j = 0 by 1/3 and j = 1728 by 1/2, so a class
    number is NOT the vertex count. The authority on the exact vertex count of
    the t = 211 class is the campaign's own Hurwitz-Kronecker enumeration
    (harness/isogeny_class.py:class_census, already exercised at four primes and
    listed in BATCH-cb71b5 what_survived_review), NOT the class-number formula
    and NOT the design document. The "1 crater + 36 floor = 37" figure is
    recorded here as the design document's cross-check, and the run must report
    the enumerated count independently; a discrepancy is a finding about the
    enumeration and is reported as one.

    STEP 3 -- THE INSTRUMENTS, AND THE COMMITTED FAILURES THAT DICTATE THEM.
    Three requirements are inherited from committed defects and are not
    negotiable inside this contract.
      (a) TARGETS ARE SAMPLED WITH targets_B (harness/exp_icinv_fullgroup.py:485),
          the two-generator full-group sampler [u]P + [v]G2 with u uniform on
          [0, n1) and v uniform on [0, n2). targets_uniform is PROHIBITED.
          H-ICINV-6c7920 (status `specified`, live) holds that the campaign's
          entire reported within-class over-dispersion is an artifact of
          targets_uniform sampling the cyclic subgroup <G>, so that on r = 3
          curves the estimand is uniform on at most half the group. THIS
          CONTRACT TAKES NO POSITION ON WHETHER THAT HYPOTHESIS IS TRUE. It
          simply does not reuse a sampler whose estimand is under dispute, which
          is the only way to keep this experiment's result independent of that
          adjudication.
      (b) EVERY MEASUREMENT IS STRATIFIED ON r = #{x in F_p : x^3 + a x + b = 0}
          and the strata are reported. r in {0, 1, 3} is a gauge-invariant,
          class-varying integer and is exactly the invariant that decides n1's
          parity. Stratification is required even though targets_B is used,
          because the point is to demonstrate that the arm contrast does not
          depend on r rather than to assume it.
      (c) THE FACTOR-BASE DENSITY IS SWEPT and the saturated row is never run
          alone. On the committed p = 4001 class the over-dispersion decays from
          2.037 at density 0.531 to 0.930 at density 0.023 (red_team_notes.md
          section 4), and the operating density for m = 3 is 1/m! ~ 0.167, which
          sits inside the region where the committed table reads 1.265-1.337. A
          conclusion drawn from one density row is not a conclusion about the
          curves.

    STEP 4 -- WHY THE |Aut| ARM IS DETERMINISTIC AND NOT STATISTICAL, STATED
    BEFORE ANY DATA. The crater of the t = 211 class has ONE vertex. There is no
    stratum, no variance and no power. The honest measurement is therefore the
    exact rank of the single j = 0 curve within the exact 37-member distribution
    of its own class on each statistic, at each density row, under the identical
    sampler and factor-base rule. Under a permutation of the 37 class members the
    smallest attainable one-sided p-value is 1/37 = 0.027027..., achieved only
    when the j = 0 curve is the strict extreme. That number is a DERIVED CEILING
    ON THE ARM'S RESOLVING POWER, computed here before execution, and it means
    the arm can never distinguish a large effect from a moderate one. It is
    reported as a rank and an exact permutation probability, never as a
    difference of means, and never with a confidence interval on a sample of one.

    STEP 5 -- WHY THE |D_0| ARM'S OWN NULL EXPECTATION IS ZERO, AND WHY THAT
    MAKES IT WORTH RUNNING. DECOMPOSITION.md section 5 prediction 1 states the
    campaign's standing expectation that relation YIELD depends on N and
    factor-base size only. In this family N is identical by construction and the
    factor-base rule is identical by contract, so the campaign's own standing
    prediction for the |D_0| arm is EXACTLY NO TREND. The arm is therefore a
    sharp test of a standing prediction rather than a fishing expedition, and a
    null result is a genuine strengthening of that prediction under the one
    design that removes its main confound -- provided, and only provided, that
    EXP-INSTR-36c8cf has demonstrated the statistic can detect a planted trend of
    the relevant size on this exact design.

  assumptions:
    - >-
      [fact] D = t^2 - 4p and N = p + 1 - t give D = (t - 2)^2 - 4N identically.
      Elementary; re-verified symbolically and numerically for every admissible
      trace by the run before the family is used.
    - >-
      [fact] T1 transport. An F_p-isogeny of degree d with gcd(d, N) = 1
      restricts to an injective homomorphism on the prime-order subgroup and
      carries (E, P, Q, k) to (E', phi(P), phi(Q), k) with the SAME k. Here
      d = 107, N = 19507 prime, gcd(107, 19507) = 1, so transport applies between
      crater and floor of the t = 211 class.
    - >-
      [fact] T4. Fixing a class fixes t, p, N, D, D_0 and f, and j = 0 requires
      D_0 = -3. So |Aut| = 6 can occur only in a class whose D_0 is -3, which is
      why the |Aut| axis is confounded with |D_0| between classes and separable
      only within the t = 211 class.
    - >-
      [derived in the design session, NOT COMMITTED, NOT EVIDENCE] The entire
      family inventory: 59 classes, ~2000 curves, 51 at f = 1, 46 distinct D_0,
      |D_0| in [1299, 78027], conductor arm f in {1, 3, 107}, and the t = 211,
      p = 19717, D = -3 * 107^2 class with 1 crater vertex and 36 floor
      vertices. Re-derived under an immutable run record in Stage 1;
      disagreement triggers PREMISE-FAILED.
    - >-
      [caveat, binding] For D_0 in {-3, -4} the Deuring correspondence weights
      j = 0 by 1/3 and j = 1728 by 1/2, so class numbers are not vertex counts.
      The campaign's Hurwitz-Kronecker enumeration is the authority on the exact
      vertex count of the t = 211 class.
    - >-
      [instrument, blocking] Every statistic used in either arm must have passed
      BOTH directions of its RQ-INSTR-f8faa0 control on THIS design
      (EXP-INSTR-36c8cf) before any conclusion is drawn. NULL-C is not presumed
      admissible here merely because the #E confound has been annihilated: it was
      characterised on a design with a different n, a different shift scale and a
      different confound structure, and its power must be re-characterised on the
      matched-order design or it may not be used.
    - >-
      [scope] N = 19507 only. A second matched N is REQUIRED by the design
      document's own standard for calling a |D_0| trend real
      (MATCHED-ORDER-DESIGN.md section 5, "reproducing at a second N") and is
      explicitly NOT in this contract's budget; a trend observed here is
      therefore unreplicated by construction and is capped accordingly.
      claim_tier toy.

  proof_search_map:
    bottleneck: >-
      Every between-class result this campaign has produced was voided by the #E
      confound, and its detector was shown to be a between-class mean detector
      with power 1.00 at a 0.9% shift. The bottleneck is not the statistic but
      the design: as long as classes differ in #E, no between-class contrast is
      interpretable. Holding N fixed by construction is the one change that
      removes it without modelling it.
    baseline_embedding:
      parameter_slice: >-
        The committed p = 4001, t = 30 saturation sweep (red_team_notes.md
        section 4): factor-base sizes 4-13, densities 0.0234-0.5306, mean rate
        equal to density to four places at every row, variance ratio 0.930 ->
        2.037. That is the exact operating boundary of the campaign's existing
        relation-density instrument.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE. Before any N = 19507 measurement, the run must
        reproduce, on the committed p = 4001 t = 30 class and under targets_B,
        the identity mean_rate ~= |3V|/#E at every declared density row to within
        the exact enumeration tolerance. This checks the sum-set enumeration and
        the density accounting, NOT the disputed variance ratio, and is
        deliberately chosen to be a quantity that H-ICINV-6c7920 does not
        contest. Failure makes the run INVALID and returns it to the executor.
    observation_collision:
      observable: >-
        The per-class mean relation density at a fixed factor-base density, as a
        function of |D_0|, with N held identically fixed.
      distinct_preimage_search: >-
        A trend in that observable has at least four distinct preimages, and the
        contract separates them by construction rather than by argument:
        (i) a genuine endomorphism-norm effect; (ii) a residual dependence on p,
        which VARIES across the family even though N does not, since
        p = N + t - 1 -- this is the design's one unavoidable residual covariate
        and the run must report the statistic against p as well as against |D_0|
        and state that the two are algebraically linked through t;
        (iii) an r-composition difference between classes, separated by the
        mandatory r-stratification; (iv) a factor-base-construction artifact,
        separated by the mandatory density sweep. A trend that does not survive
        (ii) is not attributable to the endomorphism ring, and the record must
        say so.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Replace "compare curves at matched p" by "compare curves at IDENTICAL
          N across classes", realised through D = (t - 2)^2 - 4N. The
          specialisation pack is the set of 51 conductor-1 classes at
          N = 19507, which is a crossed design the single-class experiment
          cannot be: conductor pinned at 1, N identical, D_0 spanning nearly two
          orders of magnitude.
        predicted_gain: >-
          Encoding: exact -- N is the same integer, not a matched value.
          Completeness: the pack covers 46 distinct fundamental discriminants,
          with five hit twice by trace pairs, giving a free internal replication
          check that costs nothing. Soundness: each class certified complete by
          Hurwitz-Kronecker before measurement. Transfer: DECLARED UNMET beyond
          N = 19507; a second N is required by the design's own standard and is
          not in this budget. Cost: ~2000 curves, dominated by exact m = 3
          sum-set enumeration.
    quantifier_order: >-
      CLAIMED IN THIS ORDER FOR H1: FORALL density rows in the frozen grid,
      FORALL r strata reported, EXISTS or does not exist a monotone association
      between class-mean relation density and |D_0| across the 51 conductor-1
      classes at identical N. The weaker order (EXISTS a density row at which a
      trend appears) is explicitly NOT claimed and would not support H1; a
      density-row-specific trend is reported as an instrument observation. FOR
      H2: for the single t = 211 class, the exact rank of the one j = 0 vertex
      among all 37 class vertices, at every density row -- a statement about one
      class and one vertex, quantified over nothing else.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that at one matched group order N = 19507, over 51
        conductor-1 isogeny classes spanning |D_0| from 1299 to 78027, under one
        factor-base rule, one full-group sampler and one declared density grid,
        the measured relation-collection statistics do or do not vary
        monotonically with |D_0|; and that within one 37-vertex class the single
        j = 0 vertex does or does not sit at an extreme rank of its own class
        distribution. It cannot certify anything about solving degree, about any
        attack, about any exponent, about a second N, or about the ECDLP in the
        prime-order subgroup.
      nearby_object_control: >-
        THE TRACE-PAIR REPLICATION SET: the five fundamental discriminants hit
        TWICE within the family by distinct trace pairs. Two classes with the
        same D_0, the same N, different t and different p are the closest
        possible nearby objects -- everything the hypothesis claims to measure is
        identical between them and everything it does not claim to measure
        differs. If the statistic differs between the members of a trace pair by
        as much as it differs across the |D_0| range, the |D_0| axis is not
        resolvable at this design's precision and the arm reports that instead
        of a trend. This control is free and is mandatory.
    proof_obligations:
      - claim: >-
          Every class in the constructed family has #E(F_p) = 19507 exactly,
          verified per curve and not merely per class.
        responsibility: correctness
      - claim: >-
          Each class used is complete, certified against the Hurwitz-Kronecker
          mass formula, with the Deuring weighting caveat honoured for the
          D_0 = -3 class.
        responsibility: interface
      - claim: >-
          targets_B's support equals E(F_p) as a set, certified by enumeration on
          every measured curve.
        responsibility: correctness
      - claim: >-
          gcd(107, 19507) = 1, so T1 transport carries the ECDLP between the
          crater and floor arms of the t = 211 class with the same k.
        responsibility: correctness
      - claim: >-
          Every statistic used has a two-directional EXP-INSTR-36c8cf control on
          this design.
        responsibility: baseline
      - claim: >-
          The |Aut| arm's resolution ceiling is 1/37 and it is reported as a rank
          and exact permutation probability, never as a mean difference.
        responsibility: strictness
      - claim: >-
          Nothing transfers to a second N, to solving degree, to any exponent, or
          to the ECDLP in G.
        responsibility: scope
    not_applicable_reason: null
    not_applicable_reason_note: >-
      Filled rather than excused. The hypothesis is empirical and carries no
      theorem, but its four cheap pre-compute audits are exactly what decides
      whether the between-class contrast is interpretable at all, and nulling
      them would discard the part of the design that repairs the campaign's
      standing confound.

  rerandomization: null
  rerandomization_note: >-
    No worst-to-average-case device is used or needed. Every curve in every class
    is measured; there is no instance to re-randomise and no reduction to pull
    back.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    NO COMPLEXITY CLAIM OF ANY KIND. sota_delta ZERO on every axis.
    dominated_by: parallel Pollard rho with distinguished points at
    0.886 sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006),
    and on the |Aut| = 6 curve its automorphism-discounted variant
    (KN-TECH-018), under which a factor at or below sqrt(6) ~ 2.449 is baseline
    calibration and is recorded as such. No exponent is claimed, moved or
    implied. Any downstream record citing this hypothesis toward a cost or
    exponent statement is making an unsupported inference.

  heuristic_assumptions:
    - id: HEUR-JINV-1
      formal_statement: >-
        For every constructed class in the N = 19507 family, the two-generator
        sampler targets_B has support equal to E(F_p) as a SET, certified by
        enumeration on every measured curve, so that the estimand of every
        reported relation-density statistic is identical across all 59 classes
        and across every r stratum within them.
      random_model_justification: >-
        Not a probabilistic heuristic at all: the bijection
        (u, v) -> [u]P + [v]G2 for G2 of exact order n2 = group exponent and P
        generating the cyclic quotient E/<G2> is elementary finite-abelian-group
        structure theory, and at N = 19507 the support is certified by explicit
        enumeration of the n1 * n2 products rather than argued. It is recorded as
        a numbered heuristic only because the certification is an operational
        step that can fail, not because the mathematics is in doubt.
      supporting_results: []
      supporting_results_note: >-
        No external result is cited. The bijection is re-derived in
        H-ICINV-6c7920 mechanism STEP 5 and is certified per curve here.
      validation_experiment_ids: [EXP-INSTR-36c8cf, EXP-JINV-bd141d]
      falsification_condition: >-
        Any measured curve on which the enumerated support of targets_B is not
        equal to the enumerated point set of E(F_p). A single such curve
        falsifies HEUR-JINV-1 and triggers PREMISE-FAILED rather than being
        absorbed as noise.
    - id: HEUR-JINV-2
      formal_statement: >-
        On the matched-order design at its actual class count (51 conductor-1
        classes) and actual per-class vertex counts, the between-class statistic
        chosen for the |D_0| arm detects a PLANTED monotone trend in |D_0| of the
        smallest size the design document would call meaningful, and does NOT
        fire on a matched null in which class labels carry no |D_0| information.
      random_model_justification: >-
        This is precisely the two-directional requirement of GOAL-ENDO-001
        criterion C4, and it is stated as a heuristic rather than assumed because
        the campaign's existing between-class detector, NULL-C, was characterised
        on a DIFFERENT design -- one where #E varied -- at which it had power
        1.00 against a 0.9% mean shift (red_team_notes.md section 5). Power and
        false-positive behaviour do not transfer across designs, and asserting
        that they do is the exact error this campaign has already made once.
      supporting_results: []
      supporting_results_note: >-
        No external citation. The prior characterisation is the campaign's own
        red-team measurement and is cited as the reason the heuristic cannot be
        assumed, not as support for it.
      validation_experiment_ids: [EXP-INSTR-36c8cf]
      falsification_condition: >-
        EXP-INSTR-36c8cf reports either direction failing on the matched-order
        design: the statistic misses a planted trend at the declared size, or it
        fires on the matched null. Then GOAL-ENDO-001 pause condition P1 applies,
        the |D_0| arm's measurements are marked attempted_and_inconclusive, and
        they are NEVER read as negative evidence about the endomorphism-norm
        mechanism.

  structural_ingredients:
    - description: >-
        The identity D = (t - 2)^2 - 4N, which converts "fix p and vary t" into
        "fix N and vary t" and thereby annihilates the #E confound identically
        instead of modelling it.
      citation: >-
        Elementary, derived from D = t^2 - 4p and N = p + 1 - t; re-verified in
        the run. No external citation asserted.
      role: the design device that makes the between-class contrast interpretable
    - description: >-
        Deuring correspondence and the Hurwitz-Kronecker class-number mass
        formula, used to certify complete class enumeration and to weight j = 0
        by 1/3 and j = 1728 by 1/2.
      citation: >-
        Implemented in harness/isogeny_class.py:class_census and already
        exercised at four primes; no external citation asserted beyond what that
        module documents.
      role: completeness certificate and the vertex-count caveat for D_0 = -3
    - description: >-
        The analytic class-number formula for a non-maximal order,
        h(-3 * 107^2) = 107 * (1 + 1/107) / 3 = 36, used ONLY as a cross-check on
        the enumerated floor size of the t = 211 class.
      citation: >-
        Standard; quoted from MATCHED-ORDER-DESIGN.md section 3 as a cross-check.
        It is NOT the authority on the vertex count -- the enumeration is.
      role: independent arithmetic cross-check on one class size
    - description: >-
        T1 transport (DECOMPOSITION.md section 3) at degree 107 with N prime and
        gcd(107, N) = 1.
      citation: Elementary; stated and used in DECOMPOSITION.md section 3.
      role: makes the crater and floor arms two representations of one ECDLP instance

  reduction_chain:
    core_problem: >-
      Decide whether relation-collection density on toy ordinary curves varies
      with the CM fundamental discriminant when the group order is held
      identically fixed, and whether a single j = 0 vertex sits at an extreme
      rank of its own isogeny class.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no corollary about the ECDLP, about solving
      degree, about relation-collection COST as opposed to density, about any
      exponent, or about any curve at cryptographic scale, and none is claimed.
      The only downstream consequences permitted are a Coordinator decision on
      RQ-JINV-8fc13a scoped to N = 19507 and prioritisation within
      GOAL-ENDO-001.

  predictions:
    - metric: >-
        P1 -- family construction certificate: number of classes with
        #E(F_p) = 19507 exactly, number at f = 1, number of distinct D_0, and the
        range of |D_0|
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT with the design document's derived figures -- 59 classes,
        51 at f = 1, 46 distinct fundamental discriminants, |D_0| from 1299 to
        78027, five D_0 values hit twice -- or an explicit disagreement report.
        Any disagreement triggers PREMISE-FAILED, costs minutes, and can kill the
        contract before any sweep is run.
    - metric: >-
        P2 -- class-mean decomposition_rate_m3 against |D_0| across the 51
        conductor-1 classes, per density row, per r stratum
      direction: lower
      minimum_effect: >-
        THE DESIGN'S HOPED-FOR SIGNAL, STATED QUALITATIVELY BECAUSE THE DESIGN
        DOCUMENT GIVES NO NUMBER AND NONE IS INVENTED HERE. If the
        endomorphism-norm mechanism is real, class-mean relation density
        DECREASES monotonically in |D_0| (since N(alpha_min) ~ |D_0|/4 at
        f = 1), the trend survives the density sweep, and its sign is the same in
        every r stratum. THE CAMPAIGN'S OWN STANDING PREDICTION IS THE OPPOSITE:
        DECOMPOSITION.md section 5 prediction 1 holds that relation yield depends
        on N and factor-base size only, and N is identical here by construction,
        so the pre-registered null expectation is NO TREND. The measured
        quantity reported is the rank correlation with its exact permutation
        distribution over class labels, at every density row, together with the
        smallest trend EXP-INSTR-36c8cf demonstrated the statistic can detect on
        this design. No trend smaller than that detection floor may be reported
        as a trend.
    - metric: >-
        P3 -- trace-pair internal replication: difference in class-mean statistic
        between the two classes sharing each of the five doubly-hit D_0 values
      direction: different
      minimum_effect: >-
        The five within-pair differences must be SMALL relative to the spread
        across the full |D_0| range for the |D_0| axis to be resolvable at all.
        If the within-pair spread is comparable to the across-range spread, the
        arm reports "not resolvable at this design's precision" and no trend
        claim is made, whatever the rank correlation says. Reported at every
        density row.
    - metric: >-
        P4 -- residual covariate check: the same class-mean statistic against p,
        which varies across the family as p = N + t - 1 even though N does not
      direction: different
      minimum_effect: >-
        Reported alongside P2 at every density row, with the explicit statement
        that p and D_0 are algebraically linked through t and therefore cannot be
        fully separated within one matched-N family. A |D_0| trend that is
        equally well explained by p is NOT attributable to the endomorphism ring
        and the record must say so.
    - metric: >-
        P5 -- |Aut| ARM: exact rank of the single j = 0 crater vertex among all
        enumerated vertices of the t = 211, p = 19717 class, on each statistic,
        at each density row
      direction: different
      minimum_effect: >-
        Reported as a rank out of the ENUMERATED class size (design document
        cross-check: 37) with its exact one-sided permutation probability. THE
        DERIVED RESOLUTION CEILING IS 1/37 = 0.02703, attained only at a strict
        extreme; this is computed here before execution and means the arm cannot
        distinguish a large effect from a moderate one. Never reported as a
        difference of means and never with a confidence interval on n = 1.
    - metric: >-
        P6 -- |Aut| ARM baseline calibration: any observed crater-versus-floor
        ratio, expressed against the automorphism-discounted rho baseline
      direction: different
      minimum_effect: >-
        A ratio at or below sqrt(6) ~ 2.449 is BASELINE CALIBRATION under
        KN-TECH-018 and is recorded as such, never as an attack. Exceeding it
        triggers GOAL-ENDO-001 pause condition P3: work stops for an independent
        review-adversarial session before any record states the excess, and for
        review-breakthrough at max effort before any record calls it a break.
    - metric: >-
        P7 -- r-stratum composition and per-stratum agreement across the family
      direction: different
      minimum_effect: >-
        The r composition of every class is reported, and every headline
        statistic is reported per stratum. If the sign of the |D_0| association
        differs between r strata, the pooled figure is withdrawn and only the
        stratified figures are reported.

  test_boundary:
    instances:
      - >-
        THE MATCHED-ORDER FAMILY: N = 19507 (prime); all isogeny classes with
        #E(F_p) = N exactly, generated by sweeping t with p = N + t - 1 prime and
        D = (t - 2)^2 - 4N; design document reports 59 classes and ~2000 curves.
        Every class certified complete by class_census before measurement.
      - >-
        |D_0| ARM: the 51 conductor-1 classes, 46 distinct fundamental
        discriminants, |D_0| from 1299 to 78027.
      - >-
        |Aut| ARM: the single class t = 211, p = 19717, D = -34347 = -3 * 107^2;
        all enumerated vertices, crater (j = 0, |Aut| = 6) versus floor
        (|Aut| = 2), identified by Velu 107-isogeny structure and NOT by any
        2-torsion proxy.
      - >-
        FROZEN REGRESSION FIXTURE: the committed p = 4001, t = 30 class, used
        only for the mean-rate / density identity check of the proof_search_map.
      - >-
        OUT OF SCOPE: a second matched N (required by the design's own standard
        for calling a trend real, and explicitly not budgeted here);
        supersingular classes; extension fields; any solving-degree or Groebner
        quantity; any within-class volcano-level contrast, which belongs to
        EXP-VOLC-9f5571 and must not be run here; and every statement about the
        ECDLP in the prime-order subgroup.
    parameters:
      matched_order_N: 19507
      family_construction: "D = (t-2)^2 - 4N with p = N + t - 1 required prime"
      classes_expected_total: 59
      classes_expected_f1: 51
      distinct_D0_expected: 46
      abs_D0_range_expected: [1299, 78027]
      conductor_arm_expected: [1, 3, 107]
      aut_arm_class: "t = 211, p = 19717, D = -34347 = -3 * 107^2"
      aut_arm_crater_expected: "1 vertex, j = 0, |Aut| = 6, End = Z[zeta_3]"
      aut_arm_floor_expected: "36 vertices, generic j, |Aut| = 2"
      aut_arm_vertex_count_authority: >-
        harness/isogeny_class.py Hurwitz-Kronecker enumeration, NOT the class
        number, because Deuring weights j = 0 by 1/3 and j = 1728 by 1/2
      sampler_required: "harness/exp_icinv_fullgroup.py:485 targets_B (full-group, two-generator)"
      sampler_prohibited: "targets_uniform (exp_icinv.targets_uniform) is PROHIBITED in every arm"
      stratification_required: "r = #{x in F_p : x^3 + a x + b = 0}, reported per stratum"
      density_sweep_required: true
      operating_density_target: 0.16666666
      saturated_row_alone_prohibited: true
      isogeny_construction: "Velu; two_torsion_x_count is PROHIBITED as a level or crater proxy"
      dependent_variables:
        - decomposition_rate_m2
        - decomposition_rate_m3
        - liftable_density
        - decomposition_efficiency
      statistic_definitions_required: >-
        The run must record the exact definition and source location of every
        dependent variable it computes, so a later reader can reconstruct the
        estimand without reading this contract.
      pooling_prohibition: >-
        The |D_0| arm and the |Aut| arm are reported SEPARATELY and are never
        pooled into one model, one table or one test.
      instrument_gate: >-
        BLOCKING. No conclusion may be drawn from any statistic that has not
        passed both directions of EXP-INSTR-36c8cf on this design
        (GOAL-ENDO-001 criterion C4).
    implementation: >-
      New driver and new module built over harness/isogeny_class.py,
      harness/toycurve.py and harness/exp_icinv_fullgroup.py. harness/exp_icinv.py
      MUST NOT BE EDITED. Exact m = 2 and m = 3 sum-set enumeration; no solver,
      no Groebner basis. The exact sum sets are seed- and arm-independent and
      must be computed once per (curve, factor-base size) and reused across every
      density row, seed and statistic; recomputation per arm is prohibited. Run
      manifests must pin the hash of every source file executed
      (harness/runner.py:source_provenance, audited by
      tools/check_run_source_provenance.py --strict), which is the standing A6
      precondition carried from EXP-ICINV-4d33aa amendment v2.
    budget:
      wall_clock_seconds_per_run: 21600
      total_cpu_hours: 48
      maximum_memory_gb: 8
      maximum_runs: 24
      budget_provenance: >-
        COORDINATOR-SET. The design document states no budget for E2. These
        figures bound the task and are not derived from any measurement;
        exhausting them is a budget event under AGENTS.md rule 5, reported as
        such and never as a result.
      dominant_cost: >-
        Exact m = 3 sum-set enumeration over ~2000 curves at #E = 19507, ~4 s^3
        point additions per (curve, factor-base size). Computed once per (curve,
        size) and reused; that reuse is a contract requirement, not an
        optimisation.

  falsification_conditions:
    - >-
      F1 (MINUTES, ZERO SWEEP COST, THE PRIMARY FALSIFIER). Stage 1 fails to
      reproduce the family: the class count, the conductor-1 count, the distinct
      D_0 count, the |D_0| range, or the t = 211 class structure disagrees with
      the design document. PREMISE-FAILED; the hypothesis is withdrawn as
      mis-specified rather than refuted, and the disagreement is reported as a
      finding about the design document.
    - >-
      F2. Any curve in the constructed family has #E(F_p) != 19507, or any class
      fails its Hurwitz-Kronecker completeness certificate. The design's
      confound-annihilation premise fails; the run is INVALID and returns to the
      executor as a defect.
    - >-
      F3. targets_B's certified support is not the full group on some measured
      curve (HEUR-JINV-1 refuted). PREMISE-FAILED.
    - >-
      F4 (THE MAIN NEGATIVE, AND IT IS A RESULT). No monotone |D_0| association
      survives the density sweep in either the m = 2 or m = 3 statistic, at a
      design whose detection floor EXP-INSTR-36c8cf has established. Then
      DECOMPOSITION.md section 5 prediction 1 is STRENGTHENED under the one
      design that removes its main confound, and the |D_0| axis of
      RQ-JINV-8fc13a is closed at N = 19507 with a named obstruction and an
      explicit test boundary. This is an intended, archivable deliverable.
    - >-
      F5. The trace-pair internal replication (P3) shows within-pair spread
      comparable to the across-range spread. The |D_0| axis is not resolvable at
      this design's precision; NO trend claim may be made in either direction and
      the arm reports its own precision limit instead.
    - >-
      F6. EXP-INSTR-36c8cf fails either direction for a statistic this contract
      uses (HEUR-JINV-2 refuted). GOAL-ENDO-001 pause condition P1 fires; every
      measurement taken with the failed statistic is marked
      attempted_and_inconclusive and is NEVER negative evidence.
    - >-
      F7. The |Aut| arm's single crater vertex is not extreme, or is extreme with
      an exact permutation probability of 1/37 that the contract has already
      declared to be the arm's resolution ceiling. Either way the arm reports a
      rank, not an effect, and a non-extreme rank does NOT close the |Aut|
      question -- it records that a one-vertex crater cannot answer it. Naming
      the successor is mandatory: a matched-order family at a second N whose
      D_0 = -3 class has a larger crater.
    - >-
      F8 (PLANNED NEGATIVE, PRE-REGISTERED). If the |D_0| arm is null, the batch
      does not get to emit "no effect" and stop. It must emit the per-density-row
      rank correlations with their exact permutation distributions, the
      detection floor established by EXP-INSTR-36c8cf, the trace-pair
      replication, the residual-p check, the r-stratified tables, and a named
      successor with its cost. A negative that names no successor has not
      finished and its honest status is unverified (docs/inventor-protocol.md
      closure standard).

  interpretation_limits:
    - >-
      claim_tier toy and no downstream citation may raise it. N = 19507 is a
      14.25-bit group order and p ranges near 2^14.3. Nothing here is a statement
      about any cryptographic parameter.
    - >-
      UNREPLICATED BY CONSTRUCTION. The design document's own standard for
      calling a |D_0| trend real requires reproduction at a SECOND matched N,
      which this contract does not budget. Any positive finding here is therefore
      capped at `preliminary` regardless of its apparent size, and the cap is set
      before execution so it cannot be argued away afterwards.
    - >-
      RELATION DENSITY IS NOT RELATION-COLLECTION COST AND IS NOT AN ATTACK. The
      measurement is exact sum-set enumeration, not an algorithm. sota_delta
      ZERO. Any claimed advantage on the |Aut| = 6 curve at or below sqrt(6) is
      baseline calibration under KN-TECH-018, recorded as such.
    - >-
      p IS A RESIDUAL COVARIATE. Fixing N does not fix p, since p = N + t - 1,
      and p and D_0 are linked through t. A |D_0| trend equally explained by p is
      not attributable to the endomorphism ring and must be reported with that
      ambiguity intact.
    - >-
      H-ENDO-001 is the admissibility filter and is NOT retested; this lane's
      resources are R1 (x-coordinates as field elements) and R3 (End(E) as a
      ring), never a group-operation output. KN-FIND-b7e091's generic-group
      closure is treated as binding and is not revisited.
    - >-
      Nothing here bears on H-STR-002 in either direction, so pause condition P2
      is not triggered, and nothing here presumes H-ICINV-6c7920 true or false --
      it merely declines to reuse the disputed sampler.
    - >-
      THE WITHIN-CLASS CONTRAST IS NOT IN THIS CONTRACT. Within a single class
      the |D_0| axis is not distinguishable from the conductor axis
      (MATCHED-ORDER-DESIGN.md section 1); the within-class arm belongs to
      EXP-VOLC-9f5571 and results from the two contracts may not be pooled.

