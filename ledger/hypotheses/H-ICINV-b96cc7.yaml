hypothesis:
  id: H-ICINV-b96cc7
  question_id: RQ-ICINV-475b5e
  added: '2026-08-25'
  derived_from_idea: IDEA-20260807-0ff796
  statement: >-
    THE LENGTH-2 SEMAEV RELATION LOCUS IS AN F_p-ISOMORPHIC COPY OF THE CURVE, SO ARITY-2 RELATION
    YIELD IS AN EXACT ISOGENY-CLASS INVARIANT IN THE MEAN. Three claims that can each fail
    independently.
    (S1) THE STRUCTURAL IDENTITY. Fix E/F_p with p > 3, non-singular, and a target R in E(F_p) with
    R not in E[2] and R not the identity. Let C_R be the affine plane curve cut out by the third
    summation polynomial with the third coordinate specialised at x(R). The map sending P to
    (x(P), x(R - P)) is an F_p-morphism onto the closure of C_R and is injective on geometric points
    away from the two boundary points; C_R has bidegree (2,2), hence arithmetic genus 1, so a
    birational morphism from the genus-1 curve cannot lower the geometric genus and the map is an
    ISOMORPHISM. Consequently the affine F_p-point count of C_R is EXACTLY p - 1 - t, a function of
    (p, t) alone and therefore constant on the whole F_p-isogeny class.
    (S2) THE CLOSURE IT IMPLIES. For a factor base of B x-coordinates drawn uniformly at random, the
    expected number of ordered length-2 relations is B^2 (p - 1 - t)/p^2 up to a relative error of
    order 1/p, so relation yield and factor-base decomposition probability AT ARITY 2 have ZERO
    within-class variance IN THE MEAN. The axis is closed for this functional with the obstruction
    named - the mean relation count is the point count of a curve isomorphic to E, and point counts
    of curves in an isogeny class are determined by the class.
    (S3) THE RESIDUAL CHANNELS ARE THE ONLY ONES. Any observed within-class spread of the sampled
    yield is confined to three named channels - sampling noise, whose relative size decays as
    B^{-1} p^{1/2}; box-localisation error for an interval factor base, carried as OPEN and not
    quoted as settled; and GAUGE, the choice of Weierstrass equation, since the summation polynomial
    is weighted-homogeneous of weight 8 and a coordinate-defined factor base is not carried along by
    the induced dilation. Gauge variance is NOT class variance. Concretely, within-class relative
    spread at matched B must not exceed within-gauge relative spread by more than a factor of 1.5,
    and must decay in B.
    WHAT IS NOT CLOSED, stated so this is a closure and not a fatigue report - arity 3 and above,
    where the locus is higher-dimensional and the genus-1 argument gives out; the VARIANCE and higher
    moments as opposed to the mean; structured factor bases, where the box channel dominates; and
    every functional that is not a count.
  mechanism: >-
    Relation collection at arity 2 reads exactly one thing about a curve - which pairs of
    x-coordinates sum to the target's x-coordinate - and that incidence pattern IS the F_p-point set
    of a plane curve determined by nine coefficients. The projection from the curve to that locus is
    enormously lossy: it forgets the y-coordinates, forgets which of the two lifts of each x is meant,
    forgets the group law except through the single relation, and forgets every point outside the
    fibre over the target. The loss is COMPATIBLE with the operation being tracked, because the
    summation polynomial vanishes precisely when SOME choice of signs works, so the retained incidence
    propagates deterministically under the operations relation collection performs. Under a change of
    Weierstrass equation the locus propagates exactly, by a dilation, because the polynomial has
    weight 8. Under an F_p-isogeny it does NOT propagate by any map of bounded degree, because the
    isogeny is not compatible with the x-coordinate projection and the induced correspondence has
    degree equal to the isogeny's. THAT FAILURE OF PROPAGATION IS EXACTLY WHY THE ALGEBRAIC
    functionals are the ones with a chance of varying, and why the COUNT is not - the count survives
    because it is a birational invariant, and birational invariance is coarser than the
    correspondence.
  assumptions:
  - >-
    The third summation polynomial has bidegree (2,2) in the first two coordinates and is
    weighted-homogeneous of weight 8. Verified by direct expansion in the parent record; re-verified
    symbolically as a hard gate before anything else runs.
  - >-
    Tate's isogeny theorem over finite fields - F_p-isogenous curves have equal characteristic
    polynomial of Frobenius, hence equal point count, hence equal trace. This is what makes p - 1 - t
    a class invariant.
  - >-
    The box-localisation error for an interval factor base is carried as OPEN. The standard
    completion-of-sums figure is NOT re-derived here and must be either re-derived or replaced by a
    measured empirical bound before any write-up uses its exponent.
  - >-
    Everything is at toy scale, small enough for full class enumeration, at claim tier toy. No
    cryptographic-scale claim is made or implied.
  - >-
    The argument is stated for a target not in the 2-torsion and not the identity. Two-torsion
    targets are a non-empty exception and must be excluded by an explicit filter, not by hope - and
    they are simultaneously the nearby-object control.
  - >-
    The target must be TRANSPORTED between class members by an explicit isogeny with a re-verified
    certificate. Comparing curves at independently chosen targets compares different problems and is
    the single most likely way to manufacture a fake within-class signal.
  proof_search_map:
    bottleneck: >-
      The INJECTIVITY of the map on geometric points away from the two boundary points. Everything
      else is bookkeeping - bidegree is a computation, the arithmetic genus of a (2,2) curve is a
      formula, and Tate's theorem is quoted. If the map is not injective, for instance if the case
      analysis missed a configuration, the image is a QUOTIENT of the curve, its genus can drop to 0,
      and the count becomes something other than p - 1 - t. That single step carries the whole result.
    baseline_embedding:
      parameter_slice: >-
        The full factor base, i.e. taking the factor base to be all of F_p. At that slice the
        predicted count is the exact integer p - 1 - t with NO error term and NO sampling noise, and it
        must reproduce the curve's own point count minus 2 as computed independently by naive point
        counting.
      reproduction_check: >-
        A frozen regression fixture - for at least 20 curves spanning at least three distinct traces at
        two toy primes, assert EXACT INTEGER EQUALITY between the counted locus and p - 1 - t. Exact
        integer comparison, no tolerance. Any mismatch halts the line and is reported as a refutation of
        S1.
    observation_collision:
      observable: 'The integer affine F_p-point count of the relation locus.'
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, AND ITS SUCCESS IS THE RESULT RATHER THAN A DEFECT. Find two
        curves with the same count but different j-invariant - every pair of distinct class members is
        such a pair, by S1. THE SEARCH THAT WOULD FALSIFY THE INTERPRETATION IS THE OPPOSITE ONE: find
        two curves with the SAME TRACE and DIFFERENT counts. Predicted - none exists. This is the
        cheapest possible discriminator and it is an EXACT INTEGER TEST with no statistical threshold.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace 'how many relations does this curve yield' by 'how many F_p-points does this plane curve
        have', and then replace that by 'what is the trace of the isogeny class', using the isomorphism.
        Two reductions, each exact, ending at a class invariant.
      predicted_gain: >-
        Converts an empirical variance measurement over a whole class into a one-line derivation plus one
        exact integer check. The gain is in the STRENGTH AND COST OF THE STATEMENT, not in attack cost -
        zero speedup is claimed.
    - transform: stronger_invariant
      proposed_object: >-
        The full zeta function of the relation locus rather than its F_p-point count, i.e. its point
        counts over the first few extensions. Since the locus is isomorphic to the curve, this is the
        curve's zeta function and is class-invariant at every extension degree.
      predicted_gain: >-
        Closes the extension-field variants of the same functional at no extra cost, and pre-empts the
        obvious objection that the F_p statement might not survive base change.
    quantifier_order: >-
      INTENDED - FOR ALL primes p > 3, FOR ALL admissible traces, FOR ALL ordinary E/F_p with that trace,
      FOR ALL targets R in E(F_p) outside the 2-torsion and the identity, the integer affine point count
      of the relation locus EQUALS p - 1 - t. NOTE THE 'FOR ALL E' INSIDE THE 'FOR ALL t' - that ordering
      is the whole claim. The weaker and useless reading, NOT claimed, is FOR ALL E THERE EXISTS a count,
      which is vacuous. The audit obligation is that the injectivity argument uses NO property of E beyond
      non-singularity and NO property of R beyond its not being 2-torsion.
    method_ceiling:
      strongest_certifiable_claim: >-
        'The MEAN number of length-2 Semaev relations over a factor base drawn uniformly at random is a
        function of (p, t, B) alone, hence constant on every F_p-isogeny class.' It can NEVER certify
        anything about arity 3 or above, about the variance or tails of the relation count, about
        structured factor bases, about solving degree, or about the ECDLP.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS, AND IT MUST BE EXHIBITED - a target in the
        2-torsion. There the map is 2-to-1, the locus degenerates, and the count is NOT p - 1 - t. Running
        the pipeline on a 2-torsion target must produce a DIFFERENT number; if it produces p - 1 - t
        anyway, the counter is not reading the geometry and the whole measurement is an artifact.
    proof_obligations:
    - claim: 'The map P to (x(P), x(R - P)) is injective on geometric points away from the two boundary points.'
      responsibility: correctness
    - claim: 'The image is a (2,2) curve, so its arithmetic genus is 1 and smoothness follows.'
      responsibility: correctness
    - claim: 'Exactly two points of the curve map to the boundary of the product of projective lines.'
      responsibility: size
    - claim: 'The trace is constant on an F_p-isogeny class (Tate).'
      responsibility: baseline
    - claim: 'The 2-torsion-target control gives a different count.'
      responsibility: strictness
    - claim: 'Every reported count names its target and its arity.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. NO ATTACK EXPONENT IS CLAIMED OR MOVED. The record's own computational cost is
    linear in p per curve for the exact count and quadratic in p for a full class enumeration, i.e. STRICTLY
    WORSE than the square-root baseline, and is affordable only because this is a measurement and not an
    attack. A closure of a cost functional is not a security statement - it says the isogeny-class axis
    carries no information for that functional, which is a statement about the SEARCH and not about the
    hardness of the ECDLP.
  heuristic_assumptions:
  - id: H1
    formal_statement: >-
      For a factor base V drawn uniformly at random from F_p with |V| = B, the number of ordered pairs of
      V-elements on the relation locus is distributed as the number of successes in B^2 draws from a
      population of density (p - 1 - t)/p^2, up to the dependence induced by the locus's fibre structure,
      and its standard deviation is therefore asymptotically the square root of B^2 (p - 1 - t)/p^2.
    random_model_justification: >-
      THE MEAN IS NOT HEURISTIC - it is exact by linearity of expectation together with the exact count in
      S1. ONLY THE VARIANCE IS MODELLED, and it imitates the classical hypergeometric/Poisson approximation
      for counting a fixed set of size of order p inside a random product set. The dependence the locus
      induces - each first coordinate has 0, 1 or 2 partners - is bounded and makes the true variance at most
      a constant factor larger.
    supporting_results:
    - 'Classical Poisson approximation to the hypergeometric distribution; standard, not re-derived here.'
    validation_experiment_ids:
    - EXP-ICINV-683b1e
    falsification_condition: >-
      The empirical standard deviation over many independent factor bases per (curve, B) differs from the
      Poisson prediction by more than a declared ratio, or the largest observed count exceeds the Poisson
      upper quantile at the same sample size. TOY SCALE ONLY, labelled as such; H1 is not validated at
      cryptographic scale by anything here.
  - id: H2
    formal_statement: >-
      For an interval factor base of width W, the deviation of the relation count from the density prediction
      is of order the square root of p times a polylogarithmic factor, uniformly in W and in the curve.
    random_model_justification: >-
      Imitates the standard completion-of-sums argument - expand the indicator of the box in additive
      characters and apply the Weil bound for the resulting character sums along a curve of genus 1. THE
      RIGOROUS INGREDIENT IS WEIL; the heuristic part is the uniformity in W and the exact power of the
      logarithm. Marked OPEN in the assumptions and NOT quoted as settled.
    supporting_results:
    - 'Weil bound for character sums along a curve of genus 1; classical, quoted and not re-derived.'
    validation_experiment_ids:
    - EXP-ICINV-683b1e
    falsification_condition: >-
      The maximum deviation over all interval widths, divided by the square root of p, grows like a power of p
      rather than a power of the logarithm across the tested primes. A fitted p-exponent materially above 1/2
      refutes H2 and is the reportable outcome. Toy scale, labelled.
  structural_ingredients:
  - description: 'The third summation polynomial and its role in point-decomposition index calculus.'
    citation: KN-TECH-002, KN-TECH-003.
    provenance: internal
    verified_by: 'knowledge/techniques/KN-TECH-002.md'
    role: defines the relation locus and the heuristic decomposition probability this record derives exactly at arity 2
  - description: >-
      Tate's isogeny theorem over finite fields, making the trace an isogeny-class invariant.
    citation: Classical; used exactly as the campaign's own transport results use it.
    provenance: internal
    verified_by: 'RQ-ICINV-475b5e and the campaign decomposition note'
    role: converts the exact point count into a class invariant
  predictions:
  - metric: >-
      exact affine point count of the relation locus, for every member of one complete toy isogeny class at a
      fixed TRANSPORTED target
    direction: different
    minimum_effect: >-
      EXACT INTEGER PREDICTION - the count equals p - 1 - t for every member, with within-class variance
      EXACTLY ZERO. A single member differing by even 1, after excluding 2-torsion targets, falsifies S1. This
      is not a statistical threshold; it is an identity.
  - metric: >-
      within-class standard deviation of the sampled relation count at a COMMON random factor base of size B,
      divided by the mean
    direction: lower
    minimum_effect: >-
      Must equal the gauge-arm relative standard deviation within a factor of 1.5, AND must decay as
      B^{-1} p^{1/2} across at least four values of B. A within-class spread exceeding the gauge spread by more
      than 1.5 times, or failing to decay in B, is the artifact tell and forces the record to be superseded
      rather than amended.
  - metric: 'interval-factor-base yield spread within a class versus within the gauge orbit, at matched B'
    direction: different
    minimum_effect: >-
      PREDICTED - the gauge orbit produces AT LEAST as much spread as the class, because gauge dilates the
      interval while the class does not move it at all. If the class produces materially more spread than gauge
      at matched B, the box channel has a class-dependent component and the closure is INCOMPLETE - which would
      be the interesting outcome.
  - metric: 'exact point count on a 2-torsion target (the nearby object)'
    direction: different
    minimum_effect: >-
      Must DIFFER from p - 1 - t. If it does not, the counter is not reading the geometry and nothing is
      reported.
  - metric: 'exact point count on a random (2,2) form with matched support'
    direction: different
    minimum_effect: >-
      Must differ from p - 1 - t. If the counter returns the same value, it is reading the SHAPE of the equation
      and not the curve.
  test_boundary:
    instances:
    - >-
      Complete F_p-isogeny classes at toy primes small enough for full enumeration by a single quadratic-
      character table sweep, bucketed by trace, with the three largest ordinary classes selected under a
      PRE-REGISTERED rule.
    - >-
      The gauge orbit of one fixed class member - the same curve written with many different Weierstrass
      equations.
    - >-
      Nearby objects - a 2-torsion target, and a random (2,2) form with matched support.
    parameters:
      primes: 'toy primes admitting full class enumeration, pre-registered before any measurement'
      factor_base_sizes: 'at least four values of B, so the sampling decay can be FITTED rather than asserted'
      factor_base_types: 'common random subset shared across class members / interval / gauge-orbit'
      target_rule: 'transported by an explicit isogeny chain with a re-verified certificate; 2-torsion targets excluded by filter'
      exclusions: 'trace-zero classes excluded or stratified, since the twist lies in the same class there'
    implementation: >-
      Symbolic verification of bidegree, weight and the classical discriminant identity; vectorised
      quadratic-character table enumeration of the class; exact locus counting by solving the quadratic in the
      second coordinate for each first coordinate and testing the discriminant's quadratic character; explicit
      small-degree isogeny construction on rational kernels for transport, with the transported pair re-verified
      by direct scalar multiplication. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 5400
      total_cpu_hours: 8.0
      maximum_memory_gb: 8
      maximum_runs: 12
  distinguishable_outcomes:
  - >-
    O1 (CLOSURE). The symbolic gates pass, the exact integer identity holds on every non-2-torsion class member,
    the 2-torsion control and the random-form control both DISAGREE with p - 1 - t, the within-class relative
    spread is within 1.5 times the gauge spread at matched B, and it decays as B^{-1} p^{1/2} across four values
    of B. MEANING - arity-2 relation yield is closed on the isogeny-class axis with a named obstruction, an exact
    integer identity verifiable in linear time per curve, and the residual spread bounded by three named channels
    with their sizes. The lane's open expectation becomes a derived closure.
  - >-
    O2 (S1 FALSE). Some class member with a non-2-torsion target gives a count other than p - 1 - t. MEANING -
    the structural identity is false as stated, most likely through an unnoticed degenerate configuration; the
    record is SUPERSEDED, not amended, and the failure is itself the finding.
  - >-
    O3 (COUNTER NOT READING GEOMETRY). The 2-torsion control returns p - 1 - t, or the random (2,2) form does.
    MEANING - the counter is reading the shape of the equation rather than the curve; nothing is reported and
    every number is void.
  - >-
    O4 (CLOSURE INCOMPLETE - THE INTERESTING BRANCH). Within-class relative spread at matched B exceeds gauge
    relative spread by more than 1.5 times, or fails to decay in B. MEANING - relation yield has a
    class-dependent component the derivation misses; the closure is WITHDRAWN and the lane gets a TARGET instead
    of a closure. The reachability accounting then becomes live and must be applied before any attack reading.
  - >-
    O5 (GAUGE ANALYSIS WRONG). The symbolic weight-8 identity fails. MEANING - the gauge channel is mis-described
    and EVERY gauge-null design in this lane must be revisited, not just this record's.
  - >-
    O6 (BOX CHANNEL CLASS-DEPENDENT AT TOY SCALE). The interval arm shows more class spread than the gauge arm
    while the common-random arm does not. MEANING - the box-localisation channel, which is carried as OPEN,
    dominates at these primes; the closure holds for uniformly drawn factor bases and is NOT established for
    structured ones, and the interval result must be reported as a small-p effect until its p-trend is fitted.
  - >-
    O7 (INFRASTRUCTURE). Class enumeration at the largest prime exceeds the memory or time budget, or a transport
    certificate fails to re-verify. MEANING - an infrastructure outcome under AGENTS.md rule 5. The prime is
    reduced and the shortfall recorded; it is NEVER evidence about invariance.
  falsification_conditions:
  - >-
    Any class member with a non-2-torsion target gives a count other than p - 1 - t - S1 is false; supersede.
  - >-
    The symbolic weight-8 identity fails - the gauge analysis is wrong and every gauge-null design in this lane
    must be revisited.
  - >-
    The 2-torsion control returns p - 1 - t - the counter is not reading the geometry; nothing is reported.
  - >-
    Within-class relative spread at matched B exceeds gauge relative spread by more than 1.5 times, or fails to
    decay in B - S3 is false, the closure is withdrawn, and the lane gets a target.
  - >-
    A random (2,2) form with matched support returns p - 1 - t - the counter is reading the shape and not the
    curve.
  interpretation_limits:
  - >-
    This closes ONE functional at ARITY 2 in the MEAN, at toy scale, for short-Weierstrass models. It says nothing
    about arity 3 or above, nothing about variance, nothing about solving degree, and nothing about the ECDLP.
    Both qualifiers - 'in the mean' and 'at arity 2' - must appear in every downstream sentence.
  - >-
    A closure of a cost functional is not a security statement. It says the isogeny-class axis carries no
    information FOR THAT FUNCTIONAL, which is a statement about the SEARCH and not about hardness.
  - >-
    The derivation is unconditional given S1; the MEASUREMENT is toy-scale and its residual-channel fits are
    toy-scale. Neither licenses an extrapolation.
  - >-
    At toy primes the Weil error is a visible fraction of p, so the box channel is visible here and would not be at
    cryptographic scale. Trends in p must be reported, never a single p.
  - >-
    Trace-zero classes behave differently, because the quadratic twist lies in the same class. They are excluded or
    stratified and no number here covers them.
  - >-
    Nothing here interacts with the generic-group bound, which concerns a different model.
