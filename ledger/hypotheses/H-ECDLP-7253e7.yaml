      rho beat.
  assumptions:
    - id: A1
      statement: >
        Degrees 1 and 2 are frozen.
        Identity delta=1 and Kummer
        Galois delta=1/2 are the
        (S1) equality cases. Stage 0
        does not enumerate fibres or
        compute a monodromy group.
      status: explicit
    - id: A2
      statement: >
        IDEA-20260902-a0ed78 (S1)
        Galois equality delta times d
        equals 1 is the zero-compute
        count law. Stage 0 tests that
        law as arithmetic, not a
        size-law measurement.
      status: explicit
    - id: A3
      statement: >
        Standing user authorization 2026-09-06
        covers protocol approval once the
        contract is complete.
      status: explicit
    - id: A4
      statement: >
        Recalled Chebotarev, Albanese,
        Cameron-Cohen, and KN-LIT-025
        remain pointers until an
        authorized later stage measures
        a cover. Stage 0 uses only the
        frozen integers and rationals
        recorded here.
      status: explicit
  heuristic_assumptions: []
  proof_search_map:
    bottleneck: >
      Whether product at frozen
      identity and Kummer degrees
      equals 1 as exact rational
      arithmetic. Stage 0 only checks
      that identity, the wrong-delta
      known-false, and the zero nearby
      object.
    baseline_embedding:
      parameter_slice: >
        The REAL, KF, and NULL fixtures.
        Disclosed tightening: Galois
        equality delta times d equals 1
        at frozen d in {1,2} only, not
        the proposal's fibre census,
        not Chebotarev size law, not
        yield, not conorm.
      reproduction_check: >
        REAL identity product=1.
        REAL Kummer product=1.
        KF wrong-delta product=2 not 1.
        NULL zero-product=0 not 1.
    observation_collision:
      observable: >
        product versus 1, versus 2,
        versus 0.
      distinct_preimage_search: >
        Hold d=2 and replace delta=1/2
        by delta=1 (KF). Hold d and
        replace the product by 0 (NULL).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frozen exact Galois product identity.
        predicted_gain: >
          Exact known-false wrong-delta
          gap on KF. Zero claimed attack
          improvement.
    quantifier_order: >
      Freeze d in {1,2} before reading
      product. Existential equality at
      two degrees does not imply a
      fibre census and does not imply
      a rho beat.
    method_ceiling:
      strongest_certifiable_claim: >
        Instrument reproduction on the
        declared frozen degrees.
        Never a fibre census.
        Never a Chebotarev size law.
        Never an ECDLP exponent.
      nearby_object_control: >
        NULL is the zero product. An
        argument that still assigns it
        product=1 is wrong. KF is the
        wrong-delta object; an
        argument that assigns every
        density formula product=1 is
        wrong.
    proof_obligations:
      - claim: well-defined exact Galois product identity
        responsibility: correctness
      - claim: exact REAL identity at d=1 and d=2
        responsibility: baseline
      - claim: exact KF wrong-delta gap
        responsibility: baseline
      - claim: no fibre census, no Chebotarev size law, no yield census, no conorm arm, no Stage 1 of 11c247/114eb2/821bc5/735974/fdae20/089e80/b3f975/daf1bb/0d1336/1aa0f8/79f8c4/628891/9e9536/90f602, no Stage 2 of 4be480
        responsibility: interface
    not_applicable_reason: null
