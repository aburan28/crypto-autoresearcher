  statement: >
    Fix the degrees d=1 (identity
    cover) and d=2 (Galois Kummer
    slice) before any fibre is
    enumerated. Stage 0 asserts only
    the Galois equality of
    IDEA-20260902-a0ed78 (S1) as
    exact rational arithmetic:
    product(d, delta) equals
    delta times d, and that product
    equals 1 on a Galois cover.
    Identity REAL is d=1, delta=1,
    product=1. Kummer REAL is d=2,
    delta=1/2, product=1. KF uses
    delta=1 at d=2, so KF product=2
    which is not 1. NULL is the zero
    product, which is not 1. d=0 is
    rejected. This is not a fibre
    root-finding census, not a
    Chebotarev size-law measurement,
    not a yield census, not a conorm
    smoothness arm, and not a rho
    beat. Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260902-a0ed78 (S1) names
    the fixed-point proportion
    delta_phi of a transitive action
    of degree d as at least 1/d, with
    equality if and only if the
    action is regular, i.e. the cover
    is Galois. Stage 0 freezes that
    equality as product=1 at two
    frozen degrees. The producer
    evaluates delta times d by exact
    rational arithmetic. The KF
    wrong-delta object and the NULL
    zero product are the
    proves-too-much and nearby-object
    controls. No fibre is enumerated.
    No curve is touched. No cover
    polynomial is built. This is a
    new RQ-ECDLP-002 object after
    Stage 0 of EXP-ECDLP-114eb2 held
    as P-S0-TUPLE
    (DEC-20260908-dfbd7c). It is not
    Stage 1 of EXP-ECDLP-114eb2 and
    not Stage 1 of this experiment.
    IDEA-20260902-2327a5 shares the
    W_n law already calibrated as
    P-S0-WTLAW and is not selected.
  predictions:
    - id: P-S0-DELTA
      metric: well-defined exact Galois product identity at frozen d in {1,2}
      direction: different
      minimum_effect: >
        After fixture_pass, REAL
        identity product equals 1,
        REAL Kummer product equals 1.
        KF wrong-delta product equals
        2. NULL zero-product equals 0.
        d=0 is rejected. One certified
        miss after fixture_pass is a
        scoped falsification of this
        instrument at those degrees.
      claim_tier: observational
    - id: P-S1-FIBRE
      metric: fibre root-finding census of cover images at toy p
      direction: different
      minimum_effect: >
        Stage 1+, unauthorized here.
        Stage 0 does not enumerate
        fibres, does not count F_phi,
        and does not touch yield or
        conorm.
      claim_tier: observational
  falsification_criteria:
    - id: F-S0-KFCOUNT
      statement: >
        After fixture_pass, KF
        wrong-delta product reports 1,
        equal to REAL. An encoding
        bug is failed_infrastructure.
    - id: F-S0-REALCNT
      statement: >
        After fixture_pass, REAL
        identity product fails to
        equal 1, or REAL Kummer
        product fails to equal 1.
        That falsifies only P-S0-DELTA
        at frozen d in {1,2}.
    - id: F-S1-FIBRE
      statement: >
        After an authorized later
        stage, a claimed size law
        that misses the Weil band.
        Unauthorized here.
  test_boundary:
