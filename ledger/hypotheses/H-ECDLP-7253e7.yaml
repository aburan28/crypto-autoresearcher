    prose: >
      Toy scale. Stage 0 is exact
      rational arithmetic on one
      frozen Galois-equality identity.
      It is not a fibre census, not a
      Chebotarev size-law measurement,
      not a yield census, not a conorm
      smoothness arm, not Stage 1 of
      EXP-ECDLP-11c247, not Stage 1 of
      EXP-ECDLP-114eb2, not Stage 1 of
      EXP-ECDLP-821bc5, not Stage 1 of
