hypothesis:
  id: H-CRYPTO-a405d4
  question_id: RQ-CRYPTO-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260805-52a0d1
  statement: >-
    The cost of a matched Pollard-rho baseline on a fixed ECDLP instance is a random
    variable whose coefficient of variation is scale-free at the value
    cv = sqrt(4/pi - 1) = 0.5227, so that certifying a relative advantage eps against
    that baseline requires n = (z_0.975 + z_0.80)^2 * cv^2 / eps^2 = 2.1446 / eps^2
    matched baseline runs per arm; and a single matched rho baseline at a 96-bit group
    order costs more than 100 times GOAL-CRYPTO-001's declared
    campaign_budget.total_wall_clock_seconds of 21600, at any sustained
    group-operation throughput within two orders of magnitude of 10^7 per second per
    core. The empirical conjunct of that goal's completion criterion is therefore not
    satisfiable by measurement under its own budget for any advantage smaller than an
    exponent-sized one.
  mechanism: >-
    Under the birthday model for a pseudorandom walk in a cyclic group of order N, the
    collision time T satisfies Pr[T > t] = exp(-t^2/(2N)) + o(1), i.e. T = sqrt(N) * R
    with R standard Rayleigh. Rayleigh moments give E[T] = sqrt(pi N / 2) and
    sd[T] = sqrt((2 - pi/2) N), hence cv = sqrt((2 - pi/2)/(pi/2)) = sqrt(4/pi - 1),
    INDEPENDENT of N and of the leading constant in front of sqrt(N). Because a constant
    factor cancels in cv, the sample-size law is invariant to the normalisation
    convention for rho's cost (walk steps versus group operations; Floyd versus Brent
    versus distinguished points), while the absolute cost figures are not - the two are
    kept separate throughout. The absolute figure follows from rho at group order 2^96
    costing sqrt(pi N / 4) = 2^47.83 group operations, divided by a MEASURED sustained
    throughput R, and compared against the goal record's committed budget number.
  assumptions:
  - >-
    The birthday/Rayleigh model describes the implemented walk's collision time well
    enough for its coefficient of variation. Falsifiable cheaply at toy sizes where
    thousands of full runs are affordable, and the experiment measures it rather than
    assuming it.
  - >-
    Sustained elliptic-curve group-operation throughput at 96-bit prime-field arithmetic
    is within two orders of magnitude of 10^7 per second per core. Declared as an
    engineering assumption, measured by the experiment, and the conclusion is stated as
    a function of the measured value.
  - >-
    GOAL-CRYPTO-001 campaign_budget.total_wall_clock_seconds = 21600 is the operative
    budget. Read from the committed goal record by the run, not recalled. If the operative
    budget differs, the ratio changes proportionally and the derivation is restated.'
  - >-
    A candidate pipeline's own cost is either deterministic or has spread no larger than
    rho's, so the one-sample sample sizes bound the requirement from below and the
    two-sample column bounds it from above. Both columns are reported.
  proof_search_map:
    not_applicable_reason: >-
      Not proof-oriented in the KN-TECH-080 sense. No theorem is claimed, no asymptotic
      bound is improved, no certificate family is constructed and no reduction is
      offered. The one derived quantity - cv = sqrt(4/pi - 1) - is two lines of Rayleigh
      moments stated in the mechanism, and the deliverable is a measurement of whether
      the implemented walk attains it. The audits KN-TECH-080 requires are therefore not
      applicable, and this field records that rather than nulling the map silently.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-CRYPTO-A405-1
    formal_statement: >-
      FOR ALL cyclic groups of prime order N and FOR ALL well-mixed r-adding walks on
      them, the collision time T satisfies Pr[T > t] = exp(-t^2/(2N))(1 + o(1))
      uniformly for t = Theta(sqrt(N)), hence cv[T] -> sqrt(4/pi - 1) as N -> infinity.
    random_model_justification: >-
      The walk is modelled as sampling uniformly at random with replacement; the birthday
      calculation is exact in that limit and cv follows from the Rayleigh moments. This is
      a uniform-model justification offered as such. Real r-adding walks deviate from
      uniformity, an effect that inflates the leading constant; whether it also moves cv
      is precisely what the toy measurement decides.
    supporting_results: []
    validation_experiment_ids:
    - EXP-CRYPTO-dddbdb
    falsification_condition: >-
      Measured cv departing from 0.5227 by more than 0.05 at any tested group order, or
      a regression of cv on log2 N whose slope confidence interval excludes zero, at toy
      sizes where thousands of full runs are affordable.
  - id: HEUR-CRYPTO-A405-2
    formal_statement: >-
      Sustained elliptic-curve group-operation throughput at 96-bit prime-field
      arithmetic on the execution host is within two orders of magnitude of 10^7
      operations per second per core.
    random_model_justification: >-
      Not a random model. An engineering estimate, labelled as such rather than dressed
      as a distributional claim. It is the only empirical input to the budget ratio and
      it is measured in minutes on the execution host.
    supporting_results: []
    validation_experiment_ids:
    - EXP-CRYPTO-dddbdb
    falsification_condition: >-
      Measured sustained throughput above 10^10 operations per second per core, which
      would drop the 96-bit budget ratio below 1 and refute the headline.
  structural_ingredients:
  - description: >-
      Rayleigh law for birthday collision time, E[T] = sqrt(pi N / 2) and
      Var[T] = (2 - pi/2) N, re-derived in the mechanism from
      Pr[T > t] = exp(-t^2/(2N)) rather than cited.
    citation: null
    provenance: internal
    verified_by: >-
      Re-derivation inside this record; the experiment additionally measures the
      resulting cv on a uniform-birthday positive control where the model is exact by
      construction.
    role: distribution law for the baseline's cost
  - description: >-
      Pollard rho cost sqrt(pi N / 4) group operations at group order N. RECALLED and
      normalisation-dependent; quarantined so that only the absolute figures depend on
      it and the sample-size law does not.
    citation: null
    provenance: recalled
    verified_by: null
    role: absolute cost constant, deliberately quarantined
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: >-
      Empirical coefficient of variation of matched Pollard-rho iteration counts at toy
      group orders N in {2^20, 2^24, 2^28, 2^32}, at least 2000 independent seeds each
    direction: different
    minimum_effect: >-
      0.5227 +/- 0.05 at EVERY size AND flat in N. Two informative failures - a value far
      from 0.5227 refutes the Rayleigh model for the implemented walk, and a value
      trending with N refutes the scale-freeness the sample-size argument rests on.
  - metric: >-
      Ratio of one 96-bit matched rho baseline to
      campaign_budget.total_wall_clock_seconds, at the measured throughput
    direction: higher
    minimum_effect: >-
      Greater than 100. The pre-derived value is 1.16 x 10^3 at 10^7 operations per
      second; the prediction is stated at 100 so an order-of-magnitude error in the
      throughput does not overturn it. A measured ratio below 1 withdraws the proposal.
  - metric: >-
      Number of matched baseline runs required to certify eps = 0.10 at alpha = 0.05 and
      power 0.80, computed from the MEASURED cv
    direction: different
    minimum_effect: >-
      Between 150 and 300 per arm. Pre-derived value 214.5 at cv = 0.5227.
  - metric: Coefficient of variation of a deterministic baby-step giant-step run on the same instances
    direction: lower
    minimum_effect: >-
      Below 0.05. BSGS's cost is a deterministic function of N varying only through where
      the answer sits in the enumeration, so a large measured cv means host timing noise
      is being read as algorithmic spread and every cv number in the package is void.
  test_boundary:
    instances: >-
      Toy cyclic groups of order N in {2^20, 2^24, 2^28, 2^32} for the cv measurement;
      a uniform-birthday collision search on the same orders as positive control; a
      deterministic BSGS run on the same instances as the timing-noise null. No 96-bit,
      112-bit or 128-bit run is executed - the figures at those sizes are ARITHMETIC from
      a closed-form operation count and a measured per-operation throughput.
    parameters:
      group_orders:
      - 1048576
      - 16777216
      - 268435456
      - 4294967296
      seeds_per_order: 2000
      bit_sizes_for_budget_arithmetic:
      - 96
      - 112
      - 128
      throughput_measurement: sustained 96-bit prime-field group operations per second per core, on the execution host
    implementation: >-
      Pure Python, no external dependency required beyond the standard library and numpy
      for summary statistics; recorded through harness/runner.py. No Sage.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 2.0
      maximum_runs: 12
  falsification_conditions:
  - >-
    The uniform-birthday positive control does not return cv within 0.05 of 0.5227. The
    instrument is broken and nothing else in the package may be reported.
  - >-
    The BSGS null returns cv >= 0.05. Host timing noise dominates and every cv number is
    void.
  - >-
    Measured rho cv is more than 0.05 from 0.5227 at any size, or the regression of cv on
    log2 N has a slope interval excluding zero. The scale-free claim fails, the
    sample-size table must be rebuilt from the measured distribution, and the invariance
    argument is withdrawn.
  - >-
    The measured 96-bit budget ratio is below 1. The central quantitative claim is false
    and the hypothesis is rejected at the tested scope.
  - >-
    A costed matched-rho baseline at any bit size is found in GOAL-CRYPTO-001's committed
    records. The arithmetic has already been done and this record must cite it rather
    than claim the gap.
  interpretation_limits:
  - >-
    Nothing here is evidence about the ECDLP, about any curve, or about any attack
    mechanism. No exponent moves and no security claim is made or implied.
  - >-
    This does NOT show GOAL-CRYPTO-001 is unachievable. It bears on ONE conjunct of its
    completion criterion under ONE declared budget, and it supplies a repair rather than
    a closure.
  - >-
    The cv measurement is toy-tier and transfers only the scale-freeness it measures. A
    2^32 measurement says nothing about 2^96 beyond the model's own flatness, and the
    budget figures at 96/112/128 bits are arithmetic from an operation count, never
    measurements.
  - >-
    No change to any goal's objective, completion criteria, budget, status or next_action
    is made or requested by this hypothesis.
  distinguishable_outcomes:
  - outcome: >-
      Positive control returns cv ~ 0.5227, BSGS null returns cv < 0.05, rho cv lies
      within 0.05 of 0.5227 at all four orders with a flat trend, AND the measured 96-bit
      budget ratio exceeds 100.
    means: >-
      The scale-free spread constant and the sample-size law n = 2.1446/eps^2 hold for the
      implemented walk at toy scale, and the goal's empirical conjunct costs at least two
      orders of magnitude more than its declared budget at 96 bits. The next decision is
      whether to amend the completion criterion so the baseline is analytic and the
      minimum acceptable advantage is named - a Coordinator action this record does not
      take.
  - outcome: >-
      Rho cv is measured far from 0.5227, or trends with N, while the positive control and
      the BSGS null both pass.
    means: >-
      The Rayleigh model does not describe the implemented walk's spread. The sample-size
      law must be rebuilt from the measured distribution and the claim of invariance to
      the rho normalisation constant is withdrawn. This is a genuine negative for the
      hypothesis as stated and is reported as one; the budget half may still stand and is
      reported separately.
  - outcome: >-
      The measured budget ratio at 96 bits is below 1.
    means: >-
      The central quantitative claim is false at the measured throughput. The hypothesis
      is rejected at the tested scope and no criterion amendment is warranted on cost
      grounds.
  - outcome: >-
      The BSGS null returns a large cv, or the uniform-birthday positive control misses
      0.5227.
    means: >-
      Instrument failure. Under AGENTS.md rule 5 this is infrastructure signal and NOT
      negative mathematical evidence; no cv or budget conclusion may be drawn and the run
      returns to the Executor.
  - outcome: >-
      A costed rho baseline already exists in the goal's committed records.
    means: >-
      The gap this hypothesis asserts does not exist. The record is superseded by one that
      cites the existing estimate.
  prior_evidence_refs:
  - IDEA-20260805-52a0d1
  - IDEA-20260801-001
  - GOAL-CRYPTO-001
  status: proposed
  proposed_by: idea-generator
