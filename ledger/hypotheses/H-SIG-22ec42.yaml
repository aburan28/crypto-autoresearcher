hypothesis:
  id: H-SIG-22ec42
  question_id: RQ-SIG-001
  derived_from_idea: IDEA-20260805-8a68d3
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  statement: >-
    The residual-counting pipeline that produces every number this goal owns responds with UNIT
    SLOPE to a planted syzygy family of known size. Formally: adjoin to the frozen boolean chained
    Semaev system k relations that are F_2-independent as row-index vectors and are of neither
    Koszul nor principal-Frobenius shape, so that exactly k new kernel dimensions are planted by
    construction. Then residual_D(k) minus residual_D(0) equals k exactly, with slope 1 in k, at (n
    = 9, D = 4) and at (n = 12, D = 5). The competing readings, each of which the design can select
    instead, are slope 0 (the instrument is blind and every reported residual is a constant of the
    apparatus), slope strictly between 0 and 1 (partial absorption, so the reported residuals are
    systematic UNDER-counts), and slope above 1 (collateral syzygies, so the reported residuals are
    OVER-counts and the growth laws need rescoping).
  mechanism: >-
    The goal's pipeline builds the boolean Macaulay matrix, computes its kernel dimension,
    enumerates a model rewritable family, subtracts it, then subtracts an inherited closure. Its
    NEGATIVE behaviour has been validated repeatedly - nulls returning zero excess, determinism
    reruns matching, anchor reproductions passing - but its POSITIVE behaviour has never been
    validated: no record exhibits an object with a non-rewritable syzygy family of KNOWN dimension
    and shows that the pipeline returns that dimension. Planting supplies the missing half. Take the
    frozen system, adjoin a polynomial that is a known F_2-linear combination of existing generators
    multiplied by chosen monomials; the added syzygy dimension is known before any run. A relation
    of that shape is neither a pairwise Koszul relation nor a principal Frobenius relation, because
    the adjoined generator is not a product of two members of the original system. Whether the
    instrument nonetheless absorbs it into the rewritable family is exactly what the control
    measures, and an instrument that absorbs it is reporting rewritability where there is none. The
    SLOPE, not the intercept, is the statistic - the unplanted baseline need not be correct for the
    derivative with respect to a known perturbation to be informative, which is what makes this
    control independent of every modelling assumption in the lane.
  assumptions:
  - >-
    The pinned instrument reproduces its committed anchors before any planted cell is run. A prior
    evidence record in this lane documents a reimplementation drift caught by exactly this gate, so
    the gate is mandatory and a mismatch stops the sweep before any slope is read.
  - >-
    The k planted relations are F_2-independent as row-index vectors. This is VERIFIED by rank of
    the k bitmasks before the measurement, not left to the measurement to establish.
  - >-
    The degree histogram is held fixed across the sweep, because adjoining generators changes it.
    The k = 0 arm is implemented as k adjoined DUPLICATES of existing rows so that the histogram
    matches at every rung. Getting this wrong makes the whole sweep uninterpretable and it is the
    single most delicate part of the design.
  - >-
    The sweep is confined to D at most 5, well below the freeze degree at these sizes, so the
    variety change induced by planting does not drive the rank. At D = 6 it would, and D = 6 is
    excluded by design - it is also the cell that has broken every budget in this lane.
  proof_search_map:
    bottleneck: >-
      The step under audit is the pipeline's attribution of a kernel dimension to the residual
      rather than to the rewritable family or to the inherited closure. The closure subtraction is
      the specific place a planted relation could be misattributed as inherited.
    baseline_embedding:
      parameter_slice: >-
        k = 0, implemented as k adjoined duplicates, must reproduce the goal's own committed
        residual at each primary cell exactly.
      reproduction_check: >-
        The committed unplanted residuals at (n = 9, D = 4) and (n = 12, D = 5) are the frozen
        regression fixture, reproduced before any planted cell is run.
    observation_collision:
      observable: 'The single integer residual_D, and thence the slope d(residual_D)/dk.'
      distinct_preimage_search: >-
        The projection is the goal's own pipeline unchanged, so its fibres are exactly as
        non-singleton as the measurement it audits - which is the design requirement, not a defect.
        Extra visibility would make the control non-representative.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        A planted family of known dimension k, whose fibre under the pipeline's projection is known
        by construction before any run.
      predicted_gain: >-
        Converts an uncalibrated reading into a measurement with a known right answer, at cells the
        goal already completes inside budget.
    quantifier_order: >-
      FOR ALL k in the declared ladder and FOR ALL admissible planting-site seeds, the measured
      residual_D at that k exceeds the k = 0 arm by exactly k. The site seeds are quantified over
      because site dependence is a declared confounder; the k values are the swept variable.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim a run may support is that the instrument detects relations of the
        PLANTED SHAPE at the planted sizes with a measured slope. A cascade syzygy of a different
        shape could still be missed, and a clean slope of 1 therefore proves less than it looks.
      nearby_object_control: >-
        Plant k genuinely REWRITABLE relations - products of existing generators - instead. FORCED -
        residual_D unchanged, because a rewritable family belongs to the model family by definition.
        A pipeline that reports those as residual is OVER-counting and the goal's numbers are
        inflated. This arm and the treatment arm together bracket the instrument.
    proof_obligations:
    - claim: 'k F_2-independent adjoined relations contribute exactly k dimensions to the augmented kernel.'
      responsibility: correctness
    - claim: 'The planted relation is of neither Koszul nor principal-Frobenius shape.'
      responsibility: correctness
    - claim: 'The duplicate arm holds the degree histogram fixed across the k ladder.'
      responsibility: interface
    - claim: 'The expected change in the rewritable family''s rank from planting is derivable in advance.'
      responsibility: baseline
    - claim: 'A measured slope at the planted shape does not license a claim about a cascade-shaped family.'
      responsibility: scope
    not_applicable_reason: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
  - id: HEUR-PLANT-1
    formal_statement: >-
      None load-bearing. The planted family's dimension is known by construction and verified by an
      independent rank computation before the measurement, so the expected response is an IDENTITY,
      not a distributional prediction. This entry records that the control is unconditional, which
      is unusual in this lane and is the reason it is worth running first.
    random_model_justification: >-
      Not applicable. The support is that k F_2-independent adjoined relations contribute exactly k
      dimensions to the kernel of the augmented Macaulay matrix, with independence checked by rank
      of the k bitmasks.
    supporting_results: []
    validation_experiment_ids:
    - EXP-SIG-823e22
    falsification_condition: >-
      The k planted bitmasks fail the pre-run independence check, in which case the sweep's k axis
      is MISLABELLED and must be rebuilt before any slope is read.
  structural_ingredients: []
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: recovery_slope_n9_D4
    direction: higher
    minimum_effect: >-
      1.00 exactly, forced by construction before any run, acceptance band 0.90 to 1.10. A slope
      below 0.50 means the instrument absorbs more than half of a planted non-rewritable family and
      NO NEGATIVE RESULT FROM THIS GOAL MAY BE REPORTED WITHOUT THAT CORRECTION ATTACHED.
  - metric: recovery_slope_n12_D5
    direction: higher
    minimum_effect: >-
      1.00, band 0.90 to 1.10. This is the cell that carries the lane's most-cited residual number.
  - metric: linear_fit_r_squared
    direction: higher
    minimum_effect: >-
      At least 0.98. A ragged response at exact-integer planting is itself a defect - the
      relationship is deterministic, so anything but a near-exact line indicates the pipeline is not
      measuring dimensions cleanly.
  - metric: unplanted_intercept_match
    direction: different
    minimum_effect: >-
      EXACT equality with the goal's committed residual at each primary cell. A mismatch is a
      reproduction failure and stops the sweep before the slope is read; this is the archive check
      and it is ordered first.
  - metric: rewritable_family_rank_change
    direction: different
    minimum_effect: >-
      Exactly the number of trivial Koszul relations the new generators legitimately create, a
      figure computable in advance from the enumerator's own loop bounds. Any excess means the
      instrument is classifying planted non-rewritable relations as rewritable, which is the
      specific failure that would have suppressed a real cascade.
  test_boundary:
    instances:
    - The frozen boolean chained Semaev system at n = 9 and n = 12, augmented by k adjoined relations
    parameters:
      n: '9 and 12'
      D: '4 and 5, with D = 6 excluded by design'
      k_ladder: '0, 1, 2, 4, 8, 16'
      planting_site_seeds: 3 per cell
      arms: 'planted, duplicate (k = 0), rewritable'
    implementation: >-
      The goal's own pinned pipeline, unchanged - the projection must be identical to the one being
      audited. Independence of planted bitmasks verified by a separate rank computation.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 16
  falsification_conditions:
  - >-
    Slope below 0.90 at either primary cell. The instrument UNDER-reports and every committed
    residual in this goal is a lower bound of unknown tightness.
  - >-
    Slope above 1.10. The instrument OVER-reports and the growth laws need rescoping.
  - >-
    residual_D moves on the duplicate (k = 0) arm. The measurement is histogram-sensitive and the
    sweep is void.
  - >-
    residual_D moves on the rewritable arm. The model family fails to absorb genuinely rewritable
    relations and every non-rewritable count is inflated.
  - >-
    Stage 1 fails to reproduce a committed residual. That is a reproduction failure, reported as
    such, and no calibration conclusion is drawn.
  - >-
    The planted bitmasks fail the pre-run independence check. The k axis is mislabelled and the
    sweep is rebuilt, not reinterpreted.
  interpretation_limits:
  - >-
    Toy scale. n at most 15, D at most 5, boolean chained Semaev. Nothing here bears on any deployed
    parameter set.
  - >-
    A PASSING calibration does NOT support the lane's substantive hypothesis, does NOT make any D at
    least 6 quantity admissible, and does NOT bear on the null-baseline blocker. It removes one
    reason to doubt the goal's numbers and nothing else.
  - >-
    A FAILING calibration does NOT show the cascade is absent. It shows the instrument's response to
    a planted family of a specific shape is not unity, and it requires every committed residual to
    be reported with a correction factor. Forward guidance if it fails - the next object is a
    planted family of CASCADE shape (a relation between relations) rather than a flat adjoined
    relation, and the calibration must be redone at that shape before any residual is cited again.
  - >-
    A CLEAN SLOPE OF 1 PROVES LESS THAN IT LOOKS. It shows the instrument detects relations of the
    planted shape at the planted sizes. A cascade syzygy of a different shape could still be missed.
  - >-
    No status change to any hypothesis and no goal transition is proposed. The output is a
    correction factor or a clean bill, both of which are INPUTS to a Coordinator decision rather
    than decisions.
