hypothesis:
  id: H-NTRU-31de9f
  question_id: RQ-NTRU-9015ee
  derived_from_idea: IDEA-20260809-24eec3
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  statement: >-
    The overstretched (dense-sublattice) event in an NTRU lattice has an observable signature in
    the Gram-Schmidt log-norm profile after lattice reduction to a fixed block size, and that
    signature is detectable at parameters where secret recovery does NOT succeed. Formally: define
    a departure statistic D as a localized deviation of the measured GSO log-norm profile from the
    profile of a matched random lattice of identical dimension and determinant. Then there exists a
    region of q, at fixed n, in which D separates NTRU instances from matched random lattices with
    a pre-declared effect size while the recovery rate on the same instances at the same block size
    is zero; and the minimum block size at which D separates is STRICTLY SMALLER than the minimum
    block size at which recovery succeeds.
  mechanism: >-
    In the overstretched regime an NTRU lattice contains a dense sublattice of dimension well below
    the full lattice dimension. Reduction that has partially resolved that sublattice reports it as
    a localized distortion of the GSO log-norm sequence relative to the shape a random lattice of
    the same volume would produce, because the sublattice's vectors are anomalously short for their
    position in the profile. Recovery, by contrast, is an all-or-nothing event: reduction either
    finds a secret-bearing vector or it does not, so success counting throws away every partially
    informative run and has almost no statistical power near the transition. Turning the distortion
    into a declared STATISTIC with a null distribution taken from matched random lattices converts
    non-recovery from an uninformative outcome into a measurement, which is what would tighten an
    estimate of where the transition lies.
  assumptions:
  - >-
    A matched random lattice can be constructed at identical dimension and determinant, so that any
    profile departure cannot be attributed to volume. This is a construction requirement on the
    experiment, not an empirical assumption, and a failure to meet it voids the comparison.
  - >-
    The reduction implementation reports a GSO log-norm profile that is a deterministic function of
    the reduced basis, and that profile is recorded at the SAME point in the reduction schedule for
    both arms. A profile read at different points is not a comparison.
  - >-
    Recovery success is defined by an explicit certificate - a recovered vector re-verified against
    the planted secret by the run wrapper - and never by a heuristic norm threshold.
  - >-
    Instances within a cell are independent and drawn from a declared distribution with recorded
    seeds.
  proof_search_map:
    not_applicable_reason: >-
      Not proof-oriented. The hypothesis asserts a measurable separation between two empirical
      distributions at toy dimension; it states no theorem, no asymptotic bound and no certificate
      hierarchy, so the KN-TECH-080 gate does not bind. Any later attempt to convert a measured
      transition location into an asymptotic statement WOULD engage that gate and is out of scope.
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
  - id: HEUR-NTRU-PROF-1
    formal_statement: >-
      For a random lattice of dimension d and determinant V, the GSO log-norm profile after BKZ
      reduction at block size beta concentrates around a deterministic shape depending only on
      (d, V, beta), with instance-to-instance fluctuation small enough that a localized departure of
      the declared magnitude is not produced by fluctuation alone at the sample sizes used.
    random_model_justification: >-
      The matched-random-lattice arm is drawn from the same construction and reduced by the same
      implementation at the same block size, so the null distribution of D is MEASURED rather than
      assumed. The heuristic is therefore used only to justify that a null distribution exists and
      is stable enough to compare against, and the experiment measures its spread directly.
    supporting_results: []
    validation_experiment_ids:
    - EXP-NTRU-683618
    falsification_condition: >-
      The measured null distribution of D on matched random lattices has spread comparable to the
      NTRU-versus-random separation itself, so no threshold on D discriminates. The statistic is
      then not a detector at these parameters, whatever the mean shift.
  structural_ingredients:
  - description: >-
      The overstretched-NTRU / fatigue-point phenomenon and the qualitative description of profile
      shape distortion caused by a dense sublattice.
    citation: 'NTRU fatigue-point literature - RECALLED, REQUIRED READ, NOT YET READ by this program'
    provenance: recalled
    verified_by: null
    role: >-
      Motivates the existence of a profile signature. It is a pointer for the reviewer and is NOT
      support - Stage 0 of the experiment must obtain primary text or record that it could not, and
      no quantity in this hypothesis is taken on its authority.
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
  - metric: separation_auc_below_recovery
    direction: higher
    minimum_effect: >-
      At least 0.80 AUC between the NTRU and matched-random D distributions in at least one (q,
      block size) cell whose measured recovery rate is exactly zero. An AUC at or below 0.60 in
      every such cell is the clean negative - the statistic adds nothing where success counting has
      no power, which is the entire value proposition.
  - metric: block_size_gap
    direction: lower
    minimum_effect: >-
      beta_detect strictly less than beta_recover at fixed q, by at least one rung of the declared
      block-size ladder. A gap of zero or a negative gap means detection is not cheaper than
      recovery and the proposal is refuted on its own terms.
  - metric: block_size_monotonicity
    direction: different
    minimum_effect: >-
      The separation must be non-decreasing in block size across the ladder within the sweep's
      resolution. A separation that appears at one block size and vanishes at both neighbours is a
      reduction artifact, not a structural signal, and is reported as such.
  test_boundary:
    instances:
    - >-
      NTRU lattices at one small n, in the toy regime only, with a planted secret whose recovery is
      certifiable; and matched random lattices of identical dimension and determinant.
    parameters:
      n: single small value declared in the contract, toy scale only
      q_sweep: a declared ladder spanning the predicted transition at that n
      block_size_ladder: a declared ladder of at least four block sizes
      instances_per_cell: 20 NTRU and 20 matched random
    implementation: >-
      A single pinned lattice-reduction implementation with a recorded version, invoked identically
      for both arms, with the GSO profile read at the same point of the reduction schedule in both.
    budget:
      wall_clock_seconds_per_run: 7200
      maximum_memory_gb: 16
  falsification_conditions:
  - >-
    The departure statistic does not separate NTRU from matched random lattices in any cell below
    the recovery threshold. The detector has no power where it was proposed to have power, and the
    lane closes on this observable with a measured separation as the recorded obstruction.
  - >-
    beta_detect is greater than or equal to beta_recover everywhere on the ladder. Detection is not
    cheaper than recovery, so the statistic is dominated by success counting on the only axis the
    proposal claims.
  - >-
    Separation depends on block size with no monotone trend. The signal is a reduction artifact and
    no transition-location estimate may be built on it.
  - >-
    The matched-random arm and the NTRU arm cannot be constructed at identical determinant. The
    control is unavailable, so any observed departure is confounded with volume and no number is
    reportable.
  interpretation_limits:
  - >-
    Toy dimension only. A detector calibrated at one small n is NOT evidence about deployed NTRU
    parameters, and any extrapolation carries the goal's stated interval as an explicit,
    separately-approved heuristic rather than as an inference from this record.
  - >-
    No attack and no speedup is claimed. A detector for the overstretched event is a measurement
    instrument, not a key-recovery method, and locating a transition more precisely does not move
    any attack exponent.
  - >-
    The result is scoped to the pinned reduction implementation and its schedule. A different
    reduction strategy produces a different profile and the comparison must be redone.
  - >-
    A clean positive establishes that the statistic detects the planted structure at these
    parameters. It does not establish that the detected structure IS the dense sublattice rather
    than some other correlate of the NTRU construction; distinguishing those requires an additional
    arm and is named as follow-up, not claimed.
  prior_evidence_refs: []
