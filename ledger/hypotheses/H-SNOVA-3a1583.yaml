hypothesis:
  id: H-SNOVA-3a1583
  question_id: RQ-SNOVA-001
  derived_from_idea: IDEA-20260801-016
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  statement: >-
    At matched toy parameters, the cost of the best implementable wedge-product
    attack and the cost of the best implementable group-action attack against a
    SNOVA instance are each COVERED BY the plain-whipped-UOV baseline attack cost
    on a size-matched plain-whipped-UOV instance, in the operational sense that
    the ratio
    R_family := (measured cost of the structure attack on the SNOVA instance) /
    (measured cost of the baseline UOV attack on the matched plain-whipped-UOV
    instance)
    satisfies R_family >= 0.5 for family in {wedge_product, group_action} at
    every toy size in the declared ladder, and in particular at the largest toy
    size reached. The hypothesis is a statement about the tested toy ladder only
    and asserts nothing about SNOVA's standardized parameter sets.
  mechanism: >-
    SNOVA's public key carries two structures the plain-whipped-UOV baseline does
    not: the wedge/tensor decomposition of its whipping, and the extended-public-key
    group-action orbit. Each of those structures admits an attack family that a
    plain UOV attack cannot express. At toy parameters both structures are small
    enough to be built explicitly and attacked directly, so the three attack costs
    (wedge-product, group-action, baseline UOV) can be measured on the same code
    path against matched instances. If the structures give an attacker nothing the
    generic baseline does not already give, the measured costs coincide up to the
    implementation constant and every ratio sits near 1; if either structure is
    genuinely exploitable, the corresponding ratio falls below the baseline by a
    factor that grows with the toy size, which is the observable that discriminates.
  assumptions:
    - >-
      Toy parameters preserve a non-degenerate wedge-product decomposition and a
      non-trivial group-action orbit. This is CHECKED per toy size as a
      precondition, not assumed - a size at which the structure degenerates is
      excluded from the map and its exclusion is recorded.
    - >-
      The best-known attack in each family is implementable at toy sizes from its
      published description, and the same solver back end is used for all three
      families so that the ratio is not an artifact of differing solver quality.
    - >-
      Cost is measured in two units simultaneously - wall clock and a
      solver-independent operation count - so that a ratio driven by constant-factor
      implementation differences can be separated from one driven by the structure.
  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      This is a measurement hypothesis, not a proof-oriented one. It claims no
      theorem, no asymptotic bound and no reduction; its deliverable is a measured
      cost map at toy parameters. The proof-oriented audits of KN-TECH-080 have no
      object to act on here. The baseline-reproduction discipline they encode IS
      nevertheless carried, as the positive control in the paired contract.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-SNOVA-3a1583-1
      formal_statement: >-
        For the SNOVA/plain-whipped-UOV instance families at the declared toy
        ladder, the ORDERING and rough MAGNITUDE of the cost ratios R_wedge and
        R_group_action at toy size s are directionally representative of the same
        ratios at larger s - that is, sign(d log R / d log s) measured on the
        ladder does not reverse above it.
      random_model_justification: >-
        No random model is claimed. This is an extrapolation-in-trend assumption,
        stated so it can be attacked rather than absorbed. Its only support is the
        measured monotonicity of R across at least three toy sizes.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SNOVA-1f0a27
      falsification_condition: >-
        R_family is non-monotone across the toy ladder, or its measured slope
        against log(size) has a confidence interval containing both signs. Either
        makes the trend uninformative and the map must be reported as a
        single-size snapshot with no directional statement at all.
  structural_ingredients:
    - description: >-
        The wedge-product (tensor/whipping) decomposition of the SNOVA public key,
        and the extended-public-key group-action orbit, as the two structures whose
        attack cost is being mapped.
      citation: null
      provenance: internal
      verified_by: >-
        Not verified against any external source in this record. The structures are
        taken from the parent proposal IDEA-20260801-016 and must be re-derived from
        the SNOVA specification as stage 0 of the paired contract before any attack
        is implemented; a structure that cannot be re-derived is an infrastructure
        stop, not a measurement.
      role: attack-family definition
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: R_wedge at the largest toy size
      direction: different
      minimum_effect: >-
        Pre-registered decision threshold 0.5. R_wedge >= 0.5 supports coverage;
        R_wedge < 0.5 is an uncovered cost gap for the wedge-product family and is
        the primary falsifier of this hypothesis.
    - metric: R_group_action at the largest toy size
      direction: different
      minimum_effect: >-
        Pre-registered decision threshold 0.5, same disposition as R_wedge.
    - metric: baseline_attack_success_rate on matched plain-whipped-UOV instances
      direction: higher
      minimum_effect: >-
        1.0 at every toy size. This is a POSITIVE CONTROL with a forced value, not
        a finding: if the baseline attack cannot recover a key on the baseline
        instances, every ratio has an undefined denominator and NO conclusion of
        any kind may be drawn from the run.
    - metric: >-
        structure_nondegeneracy per toy size (rank of the wedge decomposition and
        size of the group-action orbit)
      direction: higher
      minimum_effect: >-
        Strictly greater than the degenerate value at every included toy size. A
        size where either structure degenerates is excluded from the map, and the
        exclusion is recorded with its measured value rather than dropped.
  test_boundary:
    instances: >-
      Matched pairs of toy SNOVA and toy plain-whipped-UOV instances, at least 20
      independent instances per (attack family, instance type, toy size) cell,
      generated from declared seeds.
    parameters:
      toy_ladder: >-
        At least three toy sizes, each small enough that all three attacks
        terminate inside the per-run wall clock, with the two instance types
        matched on field, variable count, equation count and whipping multiplicity.
      matched_on: field, variable count, equation count, whipping multiplicity
      cost_units: wall clock seconds AND a solver-independent field-operation count
    implementation: >-
      One shared attack code base with the three attack families as selectable
      modes over a common solver back end and a common instance representation.
      Pure Python plus numpy, or an equivalent declared in the contract; no
      SageMath, which is absent from this container.
    budget:
      total_cpu_hours: 8
      maximum_runs: 30
  falsification_conditions:
    - >-
      R_wedge < 0.5 or R_group_action < 0.5 at the largest toy size, with the
      positive control passing. The structure attack is cheaper than the baseline,
      the coverage claim is false at the tested toy scale, and the measured ratio
      is the recorded gap.
    - >-
      The measured ratios are indistinguishable between the SNOVA and the matched
      plain-whipped-UOV arm because the SAME attack succeeds identically on both -
      i.e. the "structure" attack never uses the structure. This does not confirm
      coverage; it means the instrument did not implement a structure attack, and
      it invalidates the run rather than supporting the hypothesis.
    - >-
      The structure degenerates at every toy size the budget can reach. The
      hypothesis is untestable on this ladder and the honest report is a coverage
      gap in the INSTRUMENT, not a measurement.
  interpretation_limits:
    - >-
      Toy scale only. No outcome here supports, weakens or bears on any claim about
      SNOVA's submitted or standardized parameter sets (AGENTS.md rule 4).
    - >-
      A coverage result (all ratios >= 0.5) does NOT prove crypto-scale coverage
      and does not license the sentence "the wedge-product and group-action attacks
      are covered by the UOV baseline". It licenses exactly: "at the tested toy
      sizes, with the tested attack implementations and the tested solver, neither
      structure attack was measured cheaper than the matched baseline by a factor
      of 2 or more".
    - >-
      A measured ratio is a property of a PAIR of implementations. A structure
      attack that is merely badly implemented produces a high ratio for a reason
      that has nothing to do with SNOVA, which is why the operation-count unit and
      the shared solver back end are contract requirements rather than niceties.
  prior_evidence_refs: []
  distinguishable_outcomes:
    - outcome: >-
        Positive control passes; both R_wedge and R_group_action are >= 0.5 at
        every toy size, with a non-decreasing or flat trend.
      means: >-
        SUPPORTS the hypothesis at toy scale. The two structure attacks are covered
        by the plain-whipped-UOV baseline on the tested ladder. Next decision: the
        toy map is archived as the independent security map RQ-SNOVA-001 asked for,
        and the open question moves to whether the ladder can be extended far enough
        for the trend to mean anything.
    - outcome: >-
        Positive control passes; at least one ratio is < 0.5 at the largest toy
        size, with the corresponding structure verified non-degenerate.
      means: >-
        FALSIFIES the hypothesis at toy scale. An uncovered cost gap exists for
        that attack family on the tested ladder. Next decision: replicate at a
        second seed set and a fourth toy size before any status change, and route
        the result to independent adversarial review; the gap's SIZE, not its
        existence, is what a follow-on must measure.
    - outcome: >-
        Ratios land between 0.5 and 1 with overlapping dispersion, or the trend
        across sizes is non-monotone.
      means: >-
        INCONCLUSIVE. The measurement cannot discriminate coverage from a small
        real gap at this instance count. Next decision: raise the instance count
        per cell, not the toy size, since the binding limit is dispersion rather
        than scale.
    - outcome: >-
        Positive control fails, or the structure is degenerate at every reached
        size, or an attack times out.
      means: >-
        NO EVIDENCE EITHER WAY. This is an instrument or infrastructure outcome
        (AGENTS.md rule 5) and is never a negative mathematical result about SNOVA.
        Next decision: return to the Executor with the concrete defect.
