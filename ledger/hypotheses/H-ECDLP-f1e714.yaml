hypothesis:
  id: H-ECDLP-f1e714
  question_id: RQ-ECDLP-c1b7b1
  added: '2026-09-05'
  derived_from_idea: IDEA-20260905-3a30d5
  instrument_idea: IDEA-20260905-dacf4f
  statement: >-
    SCOPE: cofactor-1 non-anomalous ordinary curves over F_p at field_bits in {10,
    12, 14, 16, 18, 20}, three seeds each, the naive curve lift, precision 2 and 3;
    the frozen digit library F (Fermat-quotient digit x q_p(x)), q_p(x), q_p(y),
    D_t (torsion lift's second x-digit), delta_1 (defect digit), delta_2
    (precision-3 defect digit), and their post-functions (residues mod 2, 4, 8,
    Legendre symbol, half-interval); anomalous toy curves at field_bits 10 to 16
    with the Smart functional Sigma as the known-true object. CLAIM TIER toy. NO
    ATTACK, NO EXPONENT MOVED; the anomalous arm reproduces a known attack.
    Claim, in three parts. (1) WHITE DIGITS: every library member has DL-spectral
    beta in [0.45, 0.60], Z in [0.5, 4] and half-energy fraction 0.5 +- 0.05 at
    every size, matching the random-function null (beta 0.5 +- 0.05) with zero
    slope in p. (2) NO COMPACT DEFECT FAMILY: delta_1 and delta_2 in particular are
    white, so the canonical Teichmuller section's defect values carry no character
    correlation at this precision. (3) KNOWN-TRUE DETECTION: on every anomalous
    instance the scalar is recovered exactly with certificate [m]P = Q, Sigma has
    beta = 1 and half-energy fraction below 8/N, and the instrument's five
    self-checks pass.
    Claim (1) is FALSE for a member if beta is at or above 0.60 at the two largest
    sizes on both curve families while the null stays at 0.5; that member is the
    first computational handle in face F2 and triggers replication at a fourth
    seed and a further size, then independent review. Claim (3) failing voids the
    instrument.
  mechanism: >-
    Lifts of a point are the torsion section plus a formal-group point; the
    Teichmuller section is the canonical coordinate-defined lift and its defect
    against the torsion section is the object ECFG-P1543 calls the defect
    syndrome. The three digit functions are the complete precision-2 content of
    face F2, each cheap (log p multiplications) and each of unbounded degree, so
    the Weil-level ceiling for bounded-degree coordinate functions does not bound
    them and their spectra must be measured. The anomalous case is where the same
    machinery yields a scalar-linear function; its spectral signature (beta = 1,
    energy on a progression of frequencies) is what a positive would look like and
    is the instrument's calibration.
  assumptions:
    - >-
      The five self-checks of IDEA-20260905-dacf4f pass before any digit is
      computed: torsion-section homomorphism, defect non-additivity, precision
      consistency, the first-order identity, and certified anomalous recovery.
    - >-
      Points with y = 0 or x = 0 are excluded and counted; the log table is
      certified on a 1000-entry sample.
    - >-
      Anomalous curves are found by exhaustive search at 10 to 16 bits; if fewer
      than 3 are found at a size the size is reported as under-sampled, never
      padded.
    - Toy tier, precision 2 and 3; no transfer beyond the slopes.
  proof_search_map:
    bottleneck: a spike in the DL-spectrum of a canonical digit on a non-anomalous curve
    baseline_embedding:
      parameter_slice: the anomalous arm and the random-function null
      reproduction_check: certified recovery on every anomalous instance; null at beta 0.5
    observation_collision:
      observable: (beta, Z, half-energy fraction) per member
      distinct_preimage_search: a spike shared with the null is normalisation; one absent on the null is structure
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: DL-spectra of the digit library
        predicted_gain: a measured obstruction in face F2; no exponent
    quantifier_order: FOR ALL non-anomalous cells and members white; alternative existential in the member, persistent in p.
    method_ceiling:
      strongest_certifiable_claim: white spectra of the frozen digit library at precision 2-3 to 20 bits with the anomalous object detected
      nearby_object_control: the anomalous toy curve
    proof_obligations:
      - claim: instrument self-checks
        responsibility: correctness
      - claim: Gumbel level and beta windows
        responsibility: size
      - claim: precision-3 arithmetic to 20 bits within one tool window
        responsibility: runtime
      - claim: toy tier
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: Explicitly null; a measurement, no complexity claim.
  heuristic_assumptions:
    - id: HEUR-LIFT-H1
      formal_statement: >-
        White-digit heuristic: the second and third p-adic digits of the
        Teichmuller and torsion lifts of points of a non-anomalous cofactor-1
        curve, and their defect, are distributed against the group characters
        like random functions with the same marginal.
      random_model_justification: >-
        No rigorous bound applies (unbounded degree); the classical statement
        imitated is the equidistribution of Fermat quotients, recalled and
        unverified. The only rigorous inputs are P1543's non-additivity of the
        defect and the isomorphism closure of KN-TECH-73630e.
      supporting_results:
        - 'Recalled pointer only: equidistribution of Fermat quotients. Unverified in this program.'
        - 'The random-function null measured in the same runs.'
      validation_experiment_ids: [EXP-ECDLP-1e6502]
      falsification_condition: >-
        A member with beta at or above 0.60 on both families at the two largest
        sizes while the null stays at 0.5.
  structural_ingredients:
    - description: Face F2 closed for group-theoretic invariants; coordinate invariants open.
      citation: KN-TECH-73630e
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (read in full)
      role: what is already closed
    - description: The open coordinate/valuation question this measurement addresses.
      citation: KN-OPEN-3417fc
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (read in full)
      role: the question
    - description: Defect theorem, pro-p gate, live exception of a compact defect family.
      citation: ledger/FINDING-PF-IC-001.md ECFG-P1543-R0 and R1
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (lines 2016-2110 read)
      role: the object measured
    - description: The anomalous additive transfer as the known-true object.
      citation: KN-TECH-033
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (lines 1-40 read)
      role: positive control
    - description: The DL-spectrum instrument and statistics.
      citation: IDEA-20260905-f31bc4
      provenance: internal
      verified_by: claude-code-session 2026-09-05 (authored and read)
      role: instrument
    - description: The Teichmuller congruence and the first-order formal-group identity.
      citation: >-
        RECALLED, elementary; derived in the parent proposal and verified
        numerically in Stage 1 of the contract rather than relied on.
      provenance: recalled
      verified_by: null
      role: the digit definitions
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: beta_per_member
      direction: different
      minimum_effect: Null in [0.45, 0.60]; structure at or above 0.60 under replication.
    - metric: half_energy_fraction
      direction: different
      minimum_effect: Null 0.5 +- 0.05; structure below 0.1; Sigma below 8/N.
    - metric: anomalous_certified_recovery
      direction: higher
      minimum_effect: every anomalous instance, exactly.
    - metric: self_check_pass_count
      direction: higher
      minimum_effect: 5 of 5.
  test_boundary:
    instances:
      - cofactor-1 non-anomalous curves at field_bits in {10, 12, 14, 16, 18, 20}, three seeds, by rejection from the harness generator
      - anomalous curves at field_bits in {10, 12, 14, 16} by exhaustive search, up to 5 per size
      - random-function null per member per cell
    parameters:
      field_bits: [10, 12, 14, 16, 18, 20]
      seeds: [20260905, 20260906, 20260907]
      precision: [2, 3]
      library: frozen in EXP-ECDLP-1e6502 Stage 0
    implementation: >-
      The p-adic module of IDEA-20260905-dacf4f under harness/, a driver under
      experiments/EXP-ECDLP-1e6502/driver/, the FFT pipeline of EXP-ECDLP-184fc4
      (numpy, undeclared dependency, version recorded in environment.json), runs
      through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 12
      maximum_memory_gb: 8
      maximum_runs: 48
  falsification_conditions:
    - A member with beta at or above 0.60 on both families at the two largest sizes with the null at 0.5. Claim (1) false; escalate.
    - delta_1 or delta_2 specifically above threshold. Claim (2) false; the compact-defect-family question reopens with a measured object.
    - Anomalous recovery fails, Sigma not beta = 1, or a self-check fails. Claim (3) fails; instrument void.
    - Precision inconsistency. Instrument defect; nothing reported.
    - Crashes, timeouts, memory exhaustion. Infrastructure, never negative mathematical evidence.
  interpretation_limits:
    - Toy tier; precision 2-3; naive curve lift only.
    - Closes the frozen digit family, not face F2.
    - No attack; the anomalous arm is a calibration.
  status: proposed
  proposed_by: claude-code-session
  specified_by: claude-code-session 2026-09-05, as a DESIGN DRAFT; not a Coordinator status change.
  prior_evidence_refs:
    - RQ-ECDLP-c1b7b1
    - RQ-CANL-63098f
    - IDEA-20260905-3a30d5
    - IDEA-20260905-dacf4f
    - IDEA-20260905-848b77
    - KN-TECH-73630e
    - KN-OPEN-3417fc
    - KN-TECH-033
  distinguishable_outcomes:
    - outcome: All three claims hold.
      meaning: >-
        The canonical digit family is measured white at precision 2-3 and toy
        scale; KN-OPEN-3417fc receives its first negative datum for a stated
        family, P1543's compact-defect-family exception is measured absent for
        the canonical section, and the instrument is validated for the other
        waiting records.
    - outcome: A member is concentrated under replication.
      meaning: >-
        The first computational handle in face F2. Replicate, review
        independently, then price with IDEA-20260905-b6154d's break-even line; no
        attack is asserted before that.
    - outcome: Instrument failure.
      meaning: Nothing about the curves is learned.
    - outcome: Infrastructure.
      meaning: Missing cells stay missing.
