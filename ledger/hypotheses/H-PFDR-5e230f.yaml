hypothesis:
  id: H-PFDR-5e230f
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260815-b4d106
  batch_id: BATCH-2eaca1
  title: >-
    The corpus reads as a run of negatives because it is scored against a
    break: under a spectrum of intermediate result classes fixed IN WRITING
    BEFORE the corpus is looked at, at least half the ECDLP evidence and
    decision records land in the three lowest claim-strength classes and at
    least two classes have never been produced -- with the binding caveat
    that if the identical criteria give the same distribution on this
    program's NON-ELLIPTIC-CURVE records, the finding is about the
    program's record-keeping and not about ECDLP research at all
  statement: >-
    (A) THE SPECTRUM, FIXED BEFORE THE CORPUS IS READ. GOAL-ECDLP-001's
    completion criteria, read verbatim by the coordinator at
    ledger/goals/GOAL-ECDLP-001/goal.yaml lines 7009-7018, name exactly two
    endpoints: an independently reproduced or proved attack improvement
    with complete end-to-end cost accounting beating matched rho/BSGS, or
    an independently validated novel technique improving a decision-critical
    attack stage. Between 'nothing' and those two there is no stated
    classification, so every batch is scored against an endpoint it will not
    reach. This record fixes nine classes, ORDERED BY CLAIM STRENGTH AND
    EXPLICITLY NOT BY WORTH, each with criteria that are checkable against
    record FIELDS rather than against prose:
      C0 NO-RESULT: reports that work was attempted; no quantity with
         units, no stated scope, no named boundary. Infrastructure
         failures land here by AGENTS.md rule 5 and are not negatives.
      C1 INSTRUMENT: delivers a measurement device validated against a
         known answer; the deliverable is the instrument, not a number
         about the target.
      C2 CALIBRATED-NULL: a signal shown to be reproduced by a null object
         of the same shape, so the claim is about the null.
      C3 MEASURED-CONSTANT: a quantity of the target measured with units,
         error bars and a stated scope. A complete obstruction block per
         templates/research-records.md qualifies by construction.
      C4 CORRECTED-COST-MODEL: a previously asserted cost expression shown
         wrong or refined, with the corrected expression and its parameter
         range.
      C5 SCOPED-NEGATIVE: a mechanism class shown not to deliver its
         claimed effect over an explicitly stated tested scope, with a
         named obstruction measured to the C3 standard.
      C6 CLOSURE: a C5 additionally meeting the inventor-protocol section 4
         standard -- named obstruction, argument, and forward guidance
         naming what remains open.
      C7 CONDITIONAL-EXPONENT: an asymptotic improvement stated
         conditionally on numbered heuristics, each carrying archived
         validation evidence or a scheduled validation experiment.
      C8 BREAK: a verified sub-baseline solve with an independently
         re-verified certificate at declared parameters.
      CX UNCLASSIFIABLE: states a conclusion that fits no class above.
    (B) THE MEASURED CLAIM. On the declared ECDLP record population,
    H1 (CONCENTRATION): the mass in C0 + C1 + C2 is at least 0.5.
    H2 (EMPTY CLASSES): at least two of C4 through C8 have count zero.
    H3 (CLASSIFIABILITY): the CX share is at most 0.2; above that the
    corpus does not state its conclusions in classifiable terms and that
    process finding supersedes H1 and H2.
    (C) THE SCOPE CLAIM, WHICH IS THE ONE THAT BINDS AND WHICH THE SOURCE
    IDEA DOES NOT STATE. A class distribution is a property of RECORDS, and
    records are written by the same agents under the same contract in every
    area of this program. So the identical criteria are applied to a
    declared NON-ELLIPTIC-CURVE population -- the evidence and decision
    records of the symmetric-primitive and lattice areas, which contain no
    curve, no group, and no discrete logarithm. H4: the ECDLP distribution
    must differ from the non-curve distribution by a pre-registered margin.
    If it does not, then 'the ECDLP corpus reads as a run of negatives' is
    a statement about how this program writes records in general, it is NOT
    a statement about elliptic-curve research or about the difficulty of the
    ECDLP, and the record forbids in advance any reading of it as one. This
    is the standing scope constraint of the pfdr-battery-20260904 round
    applied to a meta-research measurement: the signature -- a distribution
    concentrated in the low classes -- is exactly the kind a curve-free
    object can reproduce, so a curve-free null is mandatory and blocking.
    (D) WHAT IS NOT CLAIMED. Nothing about any record's quality. An empty
    class is not evidence that the class is unreachable, and the record
    refuses to say which of unreachable or unattempted it is. The ordering
    is by claim strength; a C1 instrument may be worth more to the program
    than a C5 scoped negative, and the confounder CLASS ORDERING in the
    source idea is honoured by stating that here rather than by suppressing
    the order.
  mechanism: >-
    CRITERIA FIRST, CORPUS SECOND, AND THE CONTRACT IS THE FREEZING DEVICE.
    Criteria drift -- writing a taxonomy after seeing what the corpus
    contains, so that it fits -- is the dominant confounder and cannot be
    detected after the fact. It is defeated only by fixing the criteria in
    a frozen contract before the population is enumerated, which is why the
    nine class definitions above and their per-class field checklists live
    in EXP-PFDR-3aa522 rather than being derived during execution. A
    criterion may not be changed after any record has been classified; a
    change requires a versioned protocol_amendment and reclassification
    from scratch.
    MECHANICAL CHECKS BEFORE JUDGEMENT. Each class carries a checklist over
    record FIELDS, so most of the classification is decidable rather than
    interpretive. C3 requires an obstruction block with statement,
    quantity, value with units, nonempty measured_by and scope, all
    non-empty. C5 additionally requires direction in {weakens, contradicts}
    and a stated tested scope. C6 additionally requires forward guidance
    naming an open question or a successor record. C7 requires a nonempty
    heuristic_assumptions list in the referenced hypothesis with every
    entry carrying either a nonempty supporting_results of non-recalled
    provenance or a nonempty validation_experiment_ids. C8 requires a
    certificate_refs entry with an independently re-verified certificate.
    A record failing a checklist drops to the highest class whose checklist
    it satisfies; a record satisfying no checklist while stating a
    conclusion is CX. The residual judgement -- 'does this prose state a
    conclusion at all' -- is the only interpretive step and is exactly what
    the reliability controls measure.
    THREE RELIABILITY CONTROLS, ALL BLOCKING.
    (i) THE TWO POLARITY NULLS from the source idea: a pre-registered
    record known to meet the section 4 closure standard MUST classify C6,
    and a pre-registered fatigue report -- a count of screened-and-rejected
    mechanisms with no measured obstruction -- MUST NOT classify C6.
    Distinguishing those two is the classification's entire purpose and a
    scheme that cannot is discarded before it produces a distribution.
    (ii) INTER-RATER AGREEMENT: 25 records drawn by a declared seeded
    sample are classified independently and blindly by two agents; Cohen's
    kappa is computed. Below 0.7 the distribution is not reproducible and
    kappa is the only reported result.
    (iii) THE FIELD-ONLY ABLATION: 20 records are classified with title,
    abstract and narrative prose redacted, leaving only the structured
    fields the checklists read. Agreement between the full-text and
    field-only classifications measures how much of the classification
    comes from checkable structure and how much from rhetoric. A low
    agreement does not void the result; it is reported as the fraction of
    the taxonomy that is prose-driven, which is the honest calibration of
    how mechanical this instrument really is.
    THE NON-CURVE NULL, RUN THROUGH THE IDENTICAL PIPELINE. The non-curve
    population is classified by the same criteria, the same checklists and
    the same agents, and its distribution is compared with the ECDLP
    distribution by a chi-square test over the nine classes plus a
    difference in the C0+C1+C2 mass with a bootstrap interval. The
    comparison is pre-registered in both directions: a large difference
    licenses an ECDLP-specific reading, and a small one forbids it.
  assumptions:
    - >-
      The class criteria are fixed in the frozen contract before the
      population is enumerated and are not changed after any record is
      classified.
    - >-
      Both populations are fixed by reproducible queries executed once at a
      recorded commit; the ledger grows and is worked in several worktrees,
      so every count is a statement about a named commit.
    - >-
      The polarity nulls are chosen and named in the contract before
      classification begins, so that neither can be selected to make the
      scheme look calibrated.
    - >-
      A record's classification is assigned from its own fields and prose
      alone, never from what other records in its batch were classified as.
  proof_search_map:
    bottleneck: >-
      There is no mathematical bottleneck. The load-bearing step is that
      the criteria be fixed before the corpus is seen: a taxonomy written
      afterwards fits by construction, and no amount of downstream care
      recovers from it. The frozen contract is the only mechanism that
      makes the claim falsifiable at all.
    baseline_embedding:
      parameter_slice: >-
        The incumbent classification is binary: GOAL-ECDLP-001's two
        completion criteria, everything else being 'not met'. That
        incumbent is reproduced exactly by collapsing C0-C7 to 'not met'
        and C8 plus the qualifying part of C7 to 'met'.
      reproduction_check: >-
        The collapse must reproduce the goal's own reading of its record
        set: every record the corpus currently treats as not meeting a
        completion criterion must fall in C0-C7. A record classified C8
        that the goal does not treat as a completion is a contradiction and
        halts the run for adjudication rather than being resolved by the
        classifier.
    observation_collision:
      observable: >-
        The nine-class distribution over the declared population, the set
        of empty classes, and the CX share.
      distinct_preimage_search: >-
        REQUIRED AND BLOCKING. Four preimages of 'the distribution is
        concentrated in the low classes': (i) ECDLP research really
        produces mostly instruments and calibrated nulls; (ii) THIS PROGRAM
        writes records that way in every area, which the NON-CURVE
        population detects directly; (iii) the criteria are miscalibrated,
        which the two polarity nulls detect at a named point; (iv) the
        classification is not reproducible, which kappa detects. Only (i)
        is a statement about the ECDLP, and it is reportable only after
        (ii), (iii) and (iv) are excluded.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          A record's conclusion reduced to a class label drawn from a
          fixed, field-checkable spectrum.
        predicted_gain: >-
          Makes progress legible on a scale the program can actually move,
          and makes 'which class should the next batch target' a stateable
          question rather than an implicit one.
      - transform: observable_fiber
        proposed_object: >-
          Hold the criteria, the checklists and the classifiers fixed and
          vary only the record population: ECDLP versus non-curve areas.
        predicted_gain: >-
          Separates a property of ECDLP research from a property of this
          program's writing conventions -- the single most likely
          misreading of this record's headline number.
    quantifier_order: >-
      CLAIMED: FOR THE NAMED POPULATIONS at the named commit, the ECDLP
      class distribution has at least half its mass in C0+C1+C2 AND differs
      from the non-curve distribution by the pre-registered margin. NOT
      CLAIMED: that FOR ALL possible taxonomies the corpus concentrates
      low, nor that FOR ANY class an empty count implies the class is
      unreachable. The vacuous reading 'for every record there exists a
      class' is not what H1 to H3 mean.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At commit C, under the criteria frozen in EXP-PFDR-3aa522, with
        inter-rater kappa K and field-only agreement A, the declared ECDLP
        evidence and decision records distribute over the nine classes as
        follows, classes X and Y are empty, the CX share is Z, and the
        non-curve population distributes as follows.' It cannot certify
        that any class is unreachable, that any record was misjudged by its
        own authors, or that any distribution would survive a different
        taxonomy.
      nearby_object_control: >-
        The non-curve population, where the conclusion 'this is what ECDLP
        research produces' is KNOWN FALSE because those records concern no
        curve at all. A criterion set that produces the same distribution
        there has proved too much about the ECDLP.
    proof_obligations:
      - claim: >-
          The class criteria were fixed in the frozen contract before the
          population was enumerated, evidenced by the contract's archive
          preceding the run package.
        responsibility: baseline
      - claim: >-
          Each class checklist is decidable from record fields except for
          the single named interpretive step.
        responsibility: correctness
      - claim: >-
          The polarity nulls classify as forced, on criteria written before
          they were chosen.
        responsibility: strictness
      - claim: >-
          Inter-rater kappa and field-only agreement are measured and
          reported before any distribution is reported.
        responsibility: interface
      - claim: >-
          The non-curve population is classified by the identical pipeline
          and its distribution is reported beside the ECDLP one, whichever
          way the comparison comes out.
        responsibility: scope
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        SPECTRUM COMPLETENESS. Every conclusion this program can state
        between 'no result' and 'a break' falls into exactly one of C0
        through C8, so that CX is populated only by records that fail to
        state a conclusion and never by records stating a kind of result
        the spectrum lacks.
      random_model_justification: >-
        Rigorous ingredient: the classes are not invented, they are read
        off what the program's own binding contract already recognises --
        AGENTS.md rule 5 (infrastructure failures are not negatives, C0),
        rule 6 (negative evidence closes the exact tested scope, C5), the
        inventor protocol's controls-before-belief (C2) and section 4
        closure standard (C6), the obstruction block of
        templates/research-records.md (C3), and the target profile's
        conditional-exponent pattern and certificate requirement (C7, C8).
        THE GAP, STATED PLAINLY: the spectrum is derived from what the
        program has already named, so a genuinely new kind of result would
        have no class and would be recorded as CX -- indistinguishable from
        a record that says nothing. This is the source idea's own
        HEUR-RESCLASS-1 gap and it is not repaired here, only surfaced by
        the tail check.
      supporting_results:
        - ref: IDEA-20260815-b4d106
          provenance: internal
          claim: >-
            HEUR-RESCLASS-1 as originally stated, its rigorous ingredient
            (classes derived from the program's own contract) and its
            explicit gap (a novel result class would read as
            unclassifiable rather than as novel).
          verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
        - ref: 'ledger/goals/GOAL-ECDLP-001/goal.yaml lines 7009-7018'
          provenance: internal
          claim: >-
            The goal's completion_criteria state exactly two endpoints and
            enumerate no intermediate result class, which is the premise
            of this record.
          verified_by: coordinator, TASK-20260904-b2a7e9 (lines read verbatim)
      validation_experiment_ids:
        - EXP-PFDR-3aa522
      falsification_condition: >-
        A record classified CX whose conclusion a reviewer judges to be a
        genuine result of a kind no class covers. Each such record is named
        in the tail check; one or more falsifies HEUR-001 and the missing
        class is the finding.
    - id: HEUR-002
      formal_statement: >-
        CLASSIFICATION REPRODUCIBILITY. Two agents applying the frozen
        criteria independently and blindly to the same record agree with
        Cohen's kappa at least 0.7 over the nine classes.
      random_model_justification: >-
        No rigorous ingredient exists; this is a claim about the legibility
        of prose records and about how mechanical the checklists really
        are. It is numbered so that its failure is a reportable result
        rather than a caveat, and the field-only ablation quantifies how
        much of any agreement comes from structure rather than rhetoric.
      supporting_results:
        - ref: IDEA-20260815-b4d106
          provenance: internal
          claim: >-
            The assumption that class criteria are precise enough for
            classification to be repeatable, which the source idea proposes
            testing with the two polarity nulls.
          verified_by: coordinator, TASK-20260904-b2a7e9 (record read in full)
      validation_experiment_ids:
        - EXP-PFDR-3aa522
      falsification_condition: >-
        Measured kappa below 0.7 on the blind seeded sample. The
        distribution is then not reproducible; kappa is the only reported
        result and no class count is quoted anywhere.
  structural_ingredients:
    - description: >-
        The section 4 closure standard against which C6 is defined -- named
        obstruction, argument, forward guidance -- and the statement that a
        count of screened-and-rejected mechanisms is a fatigue report whose
        honest status is unverified.
      citation: 'docs/inventor-protocol.md section 4, as restated in AGENTS.md "Inventor protocol"'
      provenance: internal
      verified_by: coordinator, TASK-20260904-b2a7e9 (AGENTS.md restatement read verbatim; docs/inventor-protocol.md itself not opened)
      role: definition of C6 and of the C6-versus-C0 polarity null
    - description: >-
        The obstruction block requiring a statement about the object, a
        quantity, a value with units and error bars, the runs it is read
        from, and a scope -- which is exactly the C3 checklist.
      citation: 'templates/research-records.md, evidence.obstruction'
      provenance: internal
      verified_by: coordinator, TASK-20260904-b2a7e9 (template read in full)
      role: field-checkable definition of C3 and C5
    - description: >-
        The two completion criteria of GOAL-ECDLP-001, which name the
        spectrum's upper endpoint and enumerate nothing below it.
      citation: 'ledger/goals/GOAL-ECDLP-001/goal.yaml lines 7009-7018'
      provenance: internal
      verified_by: coordinator, TASK-20260904-b2a7e9 (lines read verbatim)
      role: >-
        premise of claim (A). NOTE: IDEA-20260815-b4d106 and
        IDEA-20260801-003 both paraphrase this criterion as already
        requiring a stage-by-stage preprocessing/relation/linear-algebra/
        descent/verification/memory accounting. The verbatim text says
        'complete end-to-end cost accounting' and does NOT enumerate those
        stages. The paraphrase is a reading; this record uses the verbatim
        text.
  reduction_chain:
    core_problem: >-
      No attack problem is reduced and no cryptanalytic claim is made. The
      core statement is a classification of this program's own records at a
      named commit, with a curve-free control population.
    corollaries: []
  predictions:
    - metric: 'P1 -- the known-closure polarity null'
      direction: different
      minimum_effect: 'FORCED C6. A misclassification means the criteria are wrong; the run halts and nothing is classified.'
    - metric: 'P2 -- the known-fatigue-report polarity null'
      direction: different
      minimum_effect: >-
        FORCED NOT C6, and predicted C0 or CX. Conflating a fatigue report
        with a closure is the specific error the taxonomy exists to
        prevent; a scheme that does so is discarded, not adjusted.
    - metric: 'P3 -- inter-rater Cohen kappa on a blind seeded sample of 25 records'
      direction: higher
      minimum_effect: '>= 0.7. Below that, kappa is the only result reported.'
    - metric: 'P4 -- field-only ablation agreement on 20 records'
      direction: different
      minimum_effect: >-
        Reported as a number with no threshold. It calibrates how much of
        the taxonomy is prose-driven; a low value bounds every other
        statement in the record and does not void it.
    - metric: 'P5 -- ECDLP mass in C0 + C1 + C2'
      direction: higher
      minimum_effect: '>= 0.5 predicted (claim H1). Below that, H1 is refuted for this population at this commit.'
    - metric: 'P6 -- count of empty classes among C4 through C8'
      direction: higher
      minimum_effect: >-
        >= 2 predicted (claim H2), reported by name. The record refuses to
        say whether an empty class is unreachable or merely unattempted;
        that distinction is the follow-up question and is stated as open.
    - metric: 'P7 -- CX share of the ECDLP population'
      direction: lower
      minimum_effect: >-
        <= 0.2 predicted (claim H3). Above that, the corpus does not state
        its conclusions in classifiable terms; that process finding is
        reported and supersedes P5 and P6.
    - metric: >-
        P8 -- difference between the ECDLP and NON-CURVE distributions:
        chi-square over the nine classes, and the difference in C0+C1+C2
        mass with a bootstrap 95 percent interval
      direction: different
      minimum_effect: >-
        The ECDLP C0+C1+C2 mass must exceed the non-curve mass by at least
        0.15 with the interval excluding 0. If it does not, the
        concentration is a property of the program's record-keeping and NOT
        of ECDLP research, and no ECDLP-specific reading of P5 is
        permitted. THIS IS THE BLOCKING CURVE-FREE NULL.
  test_boundary:
    instances:
      - >-
        ECDLP population: live (non-superseded) records under
        ledger/evidence/ and ledger/decisions/ whose area token is in the
        declared elliptic-curve set, enumerated by the exact query stated
        in EXP-PFDR-3aa522 and executed once at a recorded commit
      - >-
        NON-CURVE population: live records under the same directories whose
        area token is in the declared non-elliptic set (symmetric
        primitives and lattice schemes -- e.g. MLKEM, ASCON, SHATHREE,
        BLAKE, ARGON, FALCON), which contain no curve, no group and no
        discrete logarithm, size-matched to the ECDLP population by a
        seeded draw
      - >-
        Polarity nulls: one record named in the contract as meeting the
        section 4 closure standard and one named as a fatigue report, both
        chosen and named before classification begins
      - >-
        Reliability samples: 25 records for blind double classification;
        20 records for the field-only ablation
    parameters:
      classes: 'C0 NO-RESULT, C1 INSTRUMENT, C2 CALIBRATED-NULL, C3 MEASURED-CONSTANT, C4 CORRECTED-COST-MODEL, C5 SCOPED-NEGATIVE, C6 CLOSURE, C7 CONDITIONAL-EXPONENT, C8 BREAK, CX UNCLASSIFIABLE'
      thresholds: 'kappa >= 0.7; CX share <= 0.2; C0+C1+C2 >= 0.5; ECDLP minus non-curve C0+C1+C2 mass >= 0.15 with interval excluding 0'
      excluded_by_name: >-
        superseded records; records whose only content is a supersession
        pointer; handoff and question records (they state no conclusion by
        design and their inclusion would manufacture C0 mass)
    implementation: >-
      Symbolic. Field checklists evaluated mechanically from the parsed
      YAML; the single interpretive step and the blind samples performed by
      agents under the declared procedure. No curve, no solver, no
      cryptographic computation, no run touches mathematical content.
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 2
      maximum_memory_gb: 8
      maximum_runs: 6
  falsification_conditions:
    - >-
      F1 CRITERIA FAILURE. P1 or P2 fails: a polarity null misclassifies.
      The criteria are wrong. The run halts, the failing null is named, and
      no distribution is produced. Fixing the criteria requires a versioned
      protocol_amendment and reclassification from scratch.
    - >-
      F2 RELIABILITY FAILURE. P3 fails. The classification is not
      reproducible between agents; kappa is the only reported result and no
      class count is quoted.
    - >-
      F3 UNCLASSIFIABILITY. P7 fails. The corpus does not state its
      conclusions in classifiable terms. This is a process finding about
      how records are written, independent of the science, and it
      supersedes H1 and H2 rather than being reported alongside them.
    - >-
      F4 NULL FAILURE, THE SCOPE-CONSTRAINT OUTCOME. P8 fails: the
      non-curve records distribute the same way. The concentration is a
      property of this program's record-keeping across all areas. The
      result is a controlled null, it says nothing about ECDLP research or
      about the difficulty of the ECDLP, and every artifact must say so in
      its own words.
    - >-
      F5 CONCENTRATION REFUTED. P5 fails while P1, P2, P3, P7 and P8 pass:
      the ECDLP corpus is NOT concentrated in the low classes. The premise
      that the corpus reads as a run of negatives because it is scored
      against a break is wrong for this population, and the actual
      distribution is the finding.
    - >-
      F6 SPECTRUM INCOMPLETE. The tail check finds a CX record whose
      conclusion is a genuine result of a kind no class covers. HEUR-001 is
      falsified and the missing class, named, is the most valuable output
      the run can produce.
    - >-
      F7 CLAIM SUPPORTED. P1-P3 and P5-P8 all hold. The corpus concentrates
      in the low classes by a margin over the non-curve baseline, at least
      two upper classes are empty by name, and the program has an explicit
      target class for its next batch. This is a planning result and
      changes no scientific status.
  interpretation_limits:
    - >-
      A classification scheme. It makes no mathematical claim, produces no
      evidence about elliptic curves, and cannot support or weaken any
      hypothesis about the ECDLP.
    - >-
      It makes NO judgement about any record's quality. The ordering is by
      claim strength and not by worth: instrument and cost-model work is
      most of what this program can deliver and is deliberately not
      devalued by sitting low on the scale.
    - >-
      An empty class is not evidence that the class is unreachable. Whether
      an empty class is unreachable or unattempted is the follow-up
      question and this record declines to answer it.
    - >-
      Every count is scoped to one commit, two named populations, one
      criterion set and one pair of classifying agents. The ledger grows
      continuously and in several worktrees at once.
    - >-
      A genuinely novel kind of result would be recorded CX, which is the
      same bucket as a record that states nothing. The tail check is the
      only defence and it is a manual read, not a guarantee.
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-08-15'
  specified_under_task: TASK-20260904-b2a7e9
  specified_at: '2026-09-04'
  status_note: >-
    status is 'proposed' per the constraints of TASK-20260904-b2a7e9. This
    record is DESIGN ONLY: no experiment is approved, no run has occurred,
    and no existing record's status is changed by writing it.
  id_allocation_provenance: >-
    H-PFDR-5e230f pre-allocated by the tasking Coordinator in
    TASK-20260904-b2a7e9 and stated there verbatim against source idea
    IDEA-20260815-b4d106. The authoring subagent has no shell and minted
    nothing; no state was scanned for a next free number.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no
    duplicate keys to the author's reading. The orchestrating session must
    run a strict parse and tools/validate_ledger.py before this record is
    relied on.
