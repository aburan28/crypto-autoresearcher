  title: >-
    The integer 16 has 4 doublings and 0 additions
  statement: >-
    The integer 16 has bit length 5. Its bits are 1, 0, 0, 0, and 0.
    Reaching it by doubling uses 4 doublings and 0 additions. Five
    exceeds four by 1. Four exceeds zero by 4. Five exceeds zero by
    5. The product of 5, 4, and 0 is 0. Their sum is 9. Two readings
    of the addition count are both 0, so that gap is 0 and their
    product is 0.
  mechanism: >-
    The proposal writes the counts 5, 4, and 0. This contract
    checks those integers. It does not add a curve point.
