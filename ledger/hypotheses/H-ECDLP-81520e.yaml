        The counts 5, 4, and 0 in IDEA-20261003-4f6a56, read
        2026-10-04. The gaps, the product, and the sum were
        recomputed in this design session. That computation is
        not a run.
      reproduction_check: >-
        One route reads the bits of 16. The other counts the
        doublings and additions. They must agree that the counts
        are 5, 4, and 0.
    observation_collision:
      observable: The addition count 0 and the product 0.
      distinct_preimage_search: >-
        Reporting the addition count as 4 drops the gap against
        the doubling count. Two readings of the addition count
        make that gap 0.
    constructive_transforms:
