hypothesis:
  id: H-WESO-ac6c87
  question_id: RQ-WESO-8aff57
  derived_from_idea: IDEA-20260805-07ff43
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  title: >-
    The weakest link of the conjugate-degree density law, isolated and made
    falsifiable on its own: the Deuring/Eichler count N_d = h(-4pd) has NO
    d-dependent local factor, and therefore the density exponent is exactly
    3/2 + beta with beta = 0
  relation_to_existing_records: >-
    H-WESO-9dc201 (committed, same question, same parent lineage) states the full
    density law rho_p(Y) = Y^{3/2} p^{-1/2+o(1)}, the two anchors, and the
    Y-parameterised family. THIS RECORD DOES NOT RESTATE THAT CLAIM AND MUST NOT BE
    READ AS A DUPLICATE OF IT. It isolates the one input that H-WESO-9dc201 carries
    as an assumption and that the parent proposal itself calls "the weakest link in
    the derivation" and "a hazard, not a caveat" - heuristic HA-2, the Eichler
    optimal-embedding count and its local factors - and turns it into a directly
    measurable exponent with its own forced value and its own falsifier. Whatever
    this record concludes bears on H-WESO-9dc201's exponent through the identity
    a = 3/2 + beta and through nothing else. No status of H-WESO-9dc201 is proposed,
    implied, or permitted to change by this record.
  statement: >-
    SCOPE: supersingular elliptic curves over F_{p^2} for primes p in a declared toy
    ladder, delta and the degree-d incidence counted by exhaustive l-isogeny-graph
    enumeration up to a declared, per-prime-checked degree ceiling; exact integer
    counts throughout; class numbers computed independently by reduced-binary-form
    counting. CLAIM TIER toy for every measured number. NO ATTACK IS CLAIMED AND NO
    EXPONENT OF ANY ALGORITHM IS MOVED.
    THE CLAIM. Let S_p be the set of supersingular j-invariants over F_{p^2} and,
    for an integer d >= 1, let N_d(p) be the number of curves E in S_p admitting an
    isogeny of degree EXACTLY d to E^{(p)}, counted with the natural weights. Define
    the incidence ratio
    r_p(d) := N_d(p) / h(-4pd).
    CLAIM (BETA-ZERO): over 1 <= d <= (p/2)^{1/3}, log r_p(d) has ZERO slope in
    log d; formally, the least-squares slope beta_hat of log r_p(d) against log d,
    fitted per prime over the declared d-grid, satisfies beta_hat = 0 with the
    per-prime fluctuation bounded independently of d.
    THE CONSEQUENCE THAT MAKES IT WORTH MEASURING. If instead r_p(d) ~ d^beta with
    beta != 0, then summing gives sum_{d<=Y} N_d(p) ~ sqrt(p) Y^{3/2 + beta}, so the
    density exponent is a = 3/2 + beta and NOT 3/2. beta is therefore the exact
    quantity that decides whether the derived exponent survives, and it is
    measurable by pure integer arithmetic. The hypothesis asserts beta = 0 and is
    falsified by a measured beta_hat whose interval excludes 0.
  mechanism: >-
    An isogeny phi of degree d from E to E^{(p)}, composed with the p-power Frobenius
    iota, gives theta = iota o phi in End(E) with deg(theta) = pd, and choosing phi
    in its Z-coset so theta has trace 0 gives theta^2 = -pd, i.e. an embedding of
    Z[sqrt(-pd)] into End(E). The correspondence in that direction is elementary and
    is written out in the parent proposal. What is NOT elementary, and what this
    hypothesis isolates, is the COUNTING statement: that the number of such curves is
    h(-4pd) up to a factor that is bounded and INDEPENDENT OF d. Eichler's
    optimal-embedding theorem supplies local factors at p and at the primes dividing
    d, and those local factors are exactly what "up to p^{o(1)}" hides. A local
    factor carrying a power of d propagates directly into the summation
    sum_{d<=Y} h(-4pd) ~ (2/3) sqrt(p) Y^{3/2} and shifts the density exponent by
    that power. So the mechanism under test is: compute N_d(p) by exhaustive
    enumeration and h(-4pd) by independent form counting, over the same d-grid and
    the same primes, and read the slope of their ratio. Two disjoint code paths, one
    integer ratio, one exponent.
  assumptions:
    - >-
      The exhaustive enumeration of S_p and of degree-d incidences is CORRECT. Not
      assumed - gated by an exact positive control (the number of supersingular
      j-invariants in F_p must equal the independently computed class number, integer
      for integer) and by an exact structural check (delta(E) = 1 exactly on the
      F_p-rational curves and nowhere else).
    - >-
      The degree ceiling of the enumeration instrument does not bind on the d-grid.
      CHECKED and RECORDED per prime; if it binds, every measured N_d is an
      undercount, the bias has a known direction, and every downstream statement
      inherits it explicitly rather than silently.
    - >-
      "Counted with the natural weights" has one fixed meaning, declared before the
      run. Two reasonable weightings (curves versus curve-isogeny pairs, and
      automorphism weighting at j = 0 and j = 1728) differ by a bounded factor that
      is d-INDEPENDENT, so they cannot move beta - but they can move the intercept,
      and the convention must be frozen so the two arms are comparable.
  proof_search_map:
    bottleneck: >-
      The d-dependence of the Eichler local factors in the count N_d(p) = h(-4pd) *
      (local factors). It is the single step whose failure changes the density
      exponent from 3/2 to 3/2 + beta, and therefore the single step whose failure
      changes the location of the memory corner in the Y-parameterised family. Every
      other ingredient of the derivation - Siegel's exponent, the summation of
      sqrt(d), the two anchors - is either a theorem or arithmetic.
    baseline_embedding:
      parameter_slice: >-
        d = 1 is the exact old-method boundary and the fixed reference point: there
        N_1(p) counts the F_p-rational supersingular j-invariants, the quantity
        Delfs-Galbraith runs on, and h(-4p) is its independently computed class
        number. beta is measured as a slope ANCHORED at that point.
      reproduction_check: >-
        Frozen fixture, exact and free: at every prime in the ladder, N_1(p) computed
        by curve enumeration must equal h(-p) or 2h(-p) (per p mod 4) computed by
        reduced-form counting, INTEGER FOR INTEGER, by two disjoint code paths. A
        mismatch means the enumeration is wrong and no beta from that run may be
        reported.
    observation_collision:
      observable: >-
        The ratio r_p(d) = N_d(p) / h(-4pd) as a function of d.
      distinct_preimage_search: >-
        A non-zero measured slope has at least three distinct preimages that the
        contract must separate: (a) a genuine d-dependent local factor - the finding;
        (b) an enumeration degree ceiling that binds increasingly with d, which
        depresses N_d at large d and manufactures a NEGATIVE slope; (c) a
        multiplicity artifact, since a curve with several admissible degrees is
        counted in several N_d. Separation is by construction: (b) by recording the
        ceiling and the maximum degree actually reached per prime; (c) by reporting
        both the degree-EXACTLY-d incidence and the multiplicity distribution, so the
        overcount is measured rather than inferred. A slope reported without those
        two separations is uninterpretable.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold h(-4pd) fixed and vary d over the d-grid, reading r_p(d) as a fibre
          statistic; this converts an inaccessible statement about local factors into
          a directly countable ratio at toy p.
        predicted_gain: >-
          No speed gain. It converts the derivation's least-supported input from an
          unverifiable recollection into a measured exponent with a forced value.
    quantifier_order: >-
      The claim is: FOR ALL primes p in the declared ladder, FOR ALL d in the
      declared grid with 1 <= d <= (p/2)^{1/3}, r_p(d) = C_p * (1 + o(1)) with C_p
      independent of d. The trap named: the inverted order "for each d there exists a
      constant" is vacuous, since any single ratio is its own constant. The content is
      that ONE constant works across the whole grid at fixed p, which is exactly what
      a slope measurement tests.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "at the tested toy primes and over the tested d-grid, the fitted
        slope of log r_p(d) against log d was [value] with interval [interval], and
        the degree ceiling did not bind." It can NEVER certify beta = 0
        asymptotically - the toy grid spans roughly one decade in d - and a measured
        beta_hat near 0 at toy p is consistent with a genuine small d-dependence that
        the grid cannot resolve. The contract must report the SMALLEST beta the grid
        could have resolved, alongside the measurement.
      nearby_object_control: >-
        The counting instrument is run on a NEARBY OBJECT where the answer is known
        independently: the d = 1 fibre, where N_1 must equal the class number exactly.
        Additionally, small-CM curves (j = 0, j = 1728) are known to have anomalous
        automorphism weights and are reported SEPARATELY rather than folded into the
        ratio, since they are precisely where a weighting convention could
        manufacture a slope.
    proof_obligations:
      - claim: N_d(p) is counted by exhaustive enumeration with a recorded, non-binding degree ceiling.
        responsibility: correctness
      - claim: h(-4pd) is computed by a code path disjoint from the enumeration.
        responsibility: correctness
      - claim: The multiplicity overcount is measured, not assumed bounded.
        responsibility: size
      - claim: The identity a = 3/2 + beta is derived symbolically before any fit.
        responsibility: correctness
      - claim: Every conclusion is scoped to the tested primes and d-grid, with the resolvable beta stated.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: >-
      The supersingular isogeny problem, only INDIRECTLY: this record measures an
      input to a density law, and moves no algorithm's exponent itself.
    prior_best: >-
      As stated by the frozen paper in inputs/P13-WESOLOWSKI-2026: p^{1/3+o(1)} time
      and memory conditional on its Heuristic 1; p^{1/2}(log p)^{O(1)} time at
      negligible memory (Delfs-Galbraith).
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: >-
      Not applicable to this record, which claims no algorithm. The quantity it
      measures, beta, is what would SHIFT the density exponent 3/2 and hence the
      location of the p^{1/3} memory corner; the record asserts no shift.
    claim_kind: cofactor_improvement
    claim_kind_note: >-
      Set to the weakest available value because NO improvement of any kind is
      claimed. This record is a measurement of an input, not a complexity claim, and
      the asymptotic_claim block is filled only to record what the measured quantity
      would bear on if it moved.
  heuristic_assumptions:
    - id: HEUR-WESO-ac6c87-1
      formal_statement: >-
        (The hypothesis itself, stated as the heuristic it tests.) For all primes p
        in the declared ladder and all d in the declared grid with
        1 <= d <= (p/2)^{1/3}, the Eichler optimal-embedding count satisfies
        N_d(p) = C_p * h(-4pd) * (1 + eps(p,d)) with C_p independent of d and
        |eps(p,d)| bounded by a constant independent of d; equivalently beta = 0 in
        r_p(d) ~ d^beta.
      random_model_justification: >-
        No random model. This is an arithmetic statement about local factors, and the
        justification offered for it in the parent proposal is a RECALLED, UNVERIFIED
        reading of Eichler's theorem. That is precisely why it is measured here rather
        than assumed.
      supporting_results:
        - >-
          Deuring correspondence and Eichler's optimal-embedding count. RECALLED,
          UNVERIFIED; no theorem number, page or venue is asserted by this record.
        - >-
          Siegel's theorem h(-D) = D^{1/2+o(1)}, used only for the INTERCEPT scale and
          not for beta, since an ineffective o(1) in the class number is d-independent
          at fixed p and cannot produce a slope.
      validation_experiment_ids:
        - EXP-WESO-97b2fc
      falsification_condition: >-
        The fitted beta_hat has a bootstrap interval excluding 0, systematically
        across the prime ladder rather than at isolated primes, with the degree
        ceiling recorded as non-binding and the multiplicity overcount measured. The
        density exponent is then 3/2 + beta_hat and not 3/2.
    - id: HEUR-WESO-ac6c87-2
      formal_statement: >-
        The multiplicity overcount - a curve admitting several admissible degrees d
        being counted in several N_d - is bounded by a factor independent of d over
        the declared grid.
      random_model_justification: >-
        None offered. The parent proposal declares this correction UNMEASURED and
        assigns it to a companion proposal. It is numbered here because a
        d-dependent multiplicity is indistinguishable from a d-dependent local factor
        in the ratio r_p(d), which would make the primary measurement
        unidentifiable.
      supporting_results: []
      validation_experiment_ids:
        - EXP-WESO-97b2fc
      falsification_condition: >-
        The measured mean multiplicity per curve has a non-zero fitted slope against
        log d. beta_hat is then confounded and must be reported as unidentifiable
        rather than as a finding.
  structural_ingredients:
    - description: >-
        The theta^2 = -pd correspondence between degree-d isogenies to the conjugate
        and embeddings of Z[sqrt(-pd)] into the endomorphism ring.
      citation: null
      provenance: internal
      verified_by: >-
        Written out elementarily in the parent proposal IDEA-20260805-07ff43 STEP 3
        and re-derived as stage S1 of the paired contract before any compute.
      role: the correspondence that defines N_d
    - description: >-
        Eichler's optimal-embedding count with its local factors at p and at primes
        dividing d.
      citation: null
      provenance: recalled
      verified_by: >-
        NOT VERIFIED. No source was read for this record and none is asserted. This
        is the ingredient under test, not an ingredient relied on.
      role: the counting law whose d-dependence is the measured quantity
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        beta_hat - the least-squares slope of log r_p(d) against log d, fitted per
        prime over the declared d-grid
      direction: different
      minimum_effect: >-
        FORCED VALUE 0, derived before any run. Pre-registered admissible band
        beta_hat in [-0.15, +0.15] at the largest toy prime reached, with the sign
        consistent across the ladder. A beta_hat whose interval excludes 0
        systematically REFUTES the d-independence of the local factors and makes the
        density exponent 3/2 + beta_hat.
    - metric: >-
        n_fp - the exact number of supersingular j-invariants in F_p, by direct
        enumeration, against h(-p) or 2h(-p) computed by reduced-form counting
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT, integer for integer, at every toy prime. POSITIVE CONTROL
        with a forced value computed by a disjoint code path; not a finding. Any
        disagreement means the enumeration is wrong and NO beta may be reported from
        that run.
    - metric: >-
        delta_one_locus - the set of curves with delta(E) = 1, against the
        F_p-rational locus
      direction: different
      minimum_effect: >-
        EXACT SET EQUALITY. delta(E) = 1 iff j(E) in F_p. If the instrument misses an
        F_p-rational curve or reports delta = 1 off F_p, it is broken and nothing is
        reportable.
    - metric: >-
        max_delta - the maximum over E in S_p of delta(E), against the bound
        (p/2)^{1/3}
      direction: lower
      minimum_effect: >-
        max_delta <= (p/2)^{1/3} at every toy prime, with no exception. A single
        counterexample would contradict an external theorem this program has only ever
        seen relayed; it is ALSO the most likely place an instrument bug shows, so the
        frozen disambiguation rule is that a counterexample is treated first as a bug
        report and only second as mathematics.
    - metric: >-
        multiplicity_slope - the fitted slope of the mean number of admissible degrees
        per curve against log d
      direction: different
      minimum_effect: >-
        FORCED VALUE 0. A non-zero slope confounds beta_hat and makes the primary
        measurement unidentifiable, which must be reported as such rather than
        resolved by choosing a reading.
    - metric: >-
        decoy_rate - accidental sigma-collisions in a MATCHED RANDOM subset of S_p of
        the same cardinality as the measured degree-<=Y ball, over structural
        collisions
      direction: lower
      minimum_effect: >-
        Forced expectation 12 * |ball|^2 / p, decaying in p at exponent -1/3 at the
        operating point. A decoy rate that does NOT decay with p means the measured
        collisions are not the structural ones and the run is an artifact.
  test_boundary:
    instances: >-
      All supersingular j-invariants over F_{p^2}, exhaustively enumerated, for every
      prime p in the declared toy ladder.
    parameters:
      prime_ladder: >-
        At least four primes spanning at least one and a half decades, the largest
        chosen so exhaustive enumeration of S_p and of all degree-d incidences for
        d <= (p/2)^{1/3} terminates inside the per-run budget.
      d_grid: >-
        Every integer d with 1 <= d <= floor((p/2)^{1/3}) at each prime; the fit uses
        the full grid and the record reports the number of grid points, since a
        slope fitted over fewer than 8 points has no resolving power for a 0.15 band.
      degree_ceiling: >-
        The largest prime l for which a modular polynomial is available to the
        instrument, recorded per prime, with an explicit non-binding check.
    implementation: >-
      Pure Python with numpy; no SageMath, which is absent from this container. Two
      DISJOINT code paths: curve/isogeny enumeration for N_d, and reduced binary
      quadratic form counting for h(-4pd). They must not share a helper.
    budget:
      total_cpu_hours: 4
      maximum_runs: 20
  falsification_conditions:
    - >-
      beta_hat's bootstrap interval excludes 0 systematically across the prime ladder,
      with the degree ceiling non-binding, the multiplicity slope at 0, and the
      positive controls passing. HEUR-WESO-ac6c87-1 is REFUTED, the Eichler local
      factors are d-dependent, and the density exponent is 3/2 + beta_hat. This is
      the primary falsifier and it is the outcome the parent proposal calls the hazard.
    - >-
      The multiplicity slope is non-zero. beta_hat is confounded and unidentifiable;
      no verdict on the local factors is licensed from this run.
    - >-
      The n_fp positive control or the delta = 1 locus check fails. Nothing at all may
      be reported.
    - >-
      The degree ceiling binds on the d-grid at any prime included in the fit. The
      measured N_d is an undercount whose bias grows with d, which manufactures a
      negative slope; that prime is excluded and the exclusion recorded.
    - >-
      The smallest beta the grid could resolve exceeds 0.15. The experiment cannot
      decide its own question at this ladder and the honest report is INCONCLUSIVE
      with the required grid size computed.
  interpretation_limits:
    - >-
      Toy scale, and the toy scale is severe: at p ~ 10^4, (p/2)^{1/3} is about 17, so
      the d-grid spans barely one decade and a beta of small magnitude is simply not
      resolvable. The record must report the resolvable beta beside the measured one
      or the measurement is uninterpretable (AGENTS.md rule 4).
    - >-
      A measured beta_hat consistent with 0 does NOT establish that the local factors
      are d-independent. It establishes that no d-dependence larger than the grid's
      resolution was observed at the tested primes.
    - >-
      NO status change to H-WESO-9dc201, H-WESO-001, or any goal record is proposed or
      implied by this record. A disagreement with a committed record travels as a
      superseding record under a new id, never as an edit, and only by the Coordinator.
    - >-
      No attack is claimed, no algorithm's exponent is moved, and no scheme is weakened
      or strengthened by any outcome here.
  prior_evidence_refs:
    - H-WESO-9dc201
    - RQ-WESO-8aff57
    - IDEA-20260805-07ff43
  distinguishable_outcomes:
    - outcome: >-
        Both positive controls pass exactly, the degree ceiling is non-binding, the
        multiplicity slope is 0, and beta_hat lies in [-0.15, +0.15] with its interval
        containing 0, at a grid whose resolvable beta is below 0.15.
      means: >-
        SUPPORTS the hypothesis at toy scale: no d-dependence in the Eichler local
        factors was resolvable, so the derivation's weakest link survives the check it
        can be given. Next decision: the density exponent 3/2 stands ON THIS INPUT,
        H-WESO-9dc201's assumption HA-2 gains toy-scale validation evidence and nothing
        stronger, and the open question moves to the multiplicity correction.
    - outcome: >-
        Controls pass, ceiling non-binding, multiplicity slope 0, and beta_hat's
        interval excludes 0 with a consistent sign across the ladder.
      means: >-
        FALSIFIES the hypothesis. The local factors carry a power of d and the density
        exponent is 3/2 + beta_hat, which relocates the memory corner of the
        Y-parameterised family. Next decision: this is a high-value surprise and goes
        to independent replication and adversarial review BEFORE any status change
        anywhere in the WESO lane; a single toy ladder is a weaken, never a
        reject_scoped.
    - outcome: >-
        Controls pass but the multiplicity slope is non-zero, or the resolvable beta
        exceeds 0.15, or the ceiling binds at the larger primes.
      means: >-
        INCONCLUSIVE, and specifically identifiable as such. The instrument cannot
        separate the two mechanisms at this ladder. Next decision: extend the ladder
        or the degree ceiling - NOT the interpretation - and re-run; report the
        confound explicitly rather than picking a reading.
    - outcome: >-
        n_fp mismatches the class number, delta = 1 lands off F_p, max_delta exceeds
        (p/2)^{1/3}, or the run times out.
      means: >-
        NO EVIDENCE EITHER WAY. Instrument or infrastructure outcome (AGENTS.md rule
        5). A max_delta violation is triaged as a bug FIRST by the frozen rule. Next
        decision: return to the Executor with the concrete defect.
