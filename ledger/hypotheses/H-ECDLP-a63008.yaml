      Measurement, not a theorem; the census's audits transfer verbatim
      (reproduction anchors, R08 boundary control, checker spots,
      vhat(0)=1 invariant), plus the anchor-sweep equivalence check: one
      Moebius-composed cell compared against the corresponding swept
      anchor triple (they are the same set up to the permutation, so the
      l1* values must agree exactly).
  rerandomization: null
  asymptotic_claim: null
