  statement: >-
    For the cross-ratio statistic v_{a,b,c} = 1_A/|A| with
    A = {x in F_p minus the anchors and the pole : the quadratic
    character of cross-ratio(x; a, b, c) is +1} (canonical probability
    normalisation per DEC-20260921-8e8086), the pair (level,
    anchor-constancy) is measurable on the census's primary ladder with a
    frozen anchor sweep, and the measurement decides whether the
    census's stability-signal tradeoff can be broken inside a PGL_2-
    closed coordinate system: (a) level above the random-set level by
    more than 2SE with anchor-constancy within 2SE -- the first
    stable-AND-structured synthetic statistic, naming the successor
    construction step (replicate before any use); (b) anchor-constancy
    with the level AT the random level (and at R08's boundary level) --
    the Gauss-flat finding extends through the invariant coordinate and
    the cross-ratio lane is scoped out for set statistics with the
    Kloosterman-cancellation reading recorded as the obstruction;
    (c) anchor spread beyond 2SE -- the family is level-varying, the
    stability-by-construction premise fails, and the idea is withdrawn
    in a superseding record.

  mechanism: >-
    The cross-ratio is the fundamental PGL_2 invariant: composing the
    statistic with a Moebius map M permutes the family (moving the
    anchors), so the census's Moebius battery becomes an anchor-triple
    sweep and lambda-constancy across the sweep IS the family-stability
    question. The multiplicative (quadratic-character) condition sits
    INSIDE the invariant coordinate, so the x-line additive Fourier
    transform of A is governed by inversion-twisted character sums
    (Kloosterman/Salie type, RECALLED, not extracted), whose
    cancellation behaviour differs from the pure Gauss case that forced
    the cosets flat: the flat-level conclusion does not transfer by
    analogy, and the difference is measurable. Tracked-object frame:
    the fibre statistic under the a5757d branching operation --
    BRANCHING class (IDEA-20260806-c5d183), R1 representation, attack
    stage COLLISION STRUCTURE; gates necessary, not sufficient.

  assumptions:
    - Canonical probability normalisation; set rows v = 1_A/|A| with
      vhat(0) = 1 exactly per cell.
    - The census's frozen primary ladder verbatim (same ten primes) for
      comparability with the census rows and controls.
    - Cross-ratio form frozen: cr(x; a, b, c) = ((x-a)(b-c)) / ((x-c)(b-a));
      anchors distinct and nonzero drawn from the frozen hash stream with
      resampling on collision; the anchors and the pole x = c are
      assigned to A's complement (recorded; any fixed choice is
      protocol-equivalent and this one is frozen).
    - Quadratic character of the cross-ratio value via the exact
      squares-set scatter (no per-element modular exponentiation).
    - Toy/medium scale only; positive outcomes are candidates pending
      replication and the owed independent adversarial review.

  proof_search_map:
