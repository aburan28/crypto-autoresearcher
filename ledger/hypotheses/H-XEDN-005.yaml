hypothesis:
  id: H-XEDN-005
  question_id: RQ-XEDN-004
  statement: >-
    On non-isotrivial surfaces y^2 = x^3 + a(t)x + b(t) over F_p with a≠0,
    deg a≤2, deg b=10, and non-constant j, among free-x integral sections of
    shape deg x≤3 and deg y≤5, the infinity-norm of the shortest nonzero
    Mordell-Weil relation among the observed sections remains in {1,2,3}
    across p in {7,13,19,31} with no slope vs log p that excludes 0. Growth
    excluding a constant upper bound of 3, or any verified shortest relation
    with infinity-norm ≥4, falsifies the hypothesis and blocks transferring
    the prior coefficient-bound closures to this joint degree-shape window.
  mechanism: >-
    With deg b=10, polynomial free-x sections of deg x=3 make f=x³+ax+b of even
    degree 10, hence eligible for square roots of deg ≤5. Bounded-degree
    integral sections should still generate short MW relations if the prior
    coefficient bounds reflected geometry rather than the narrow deg-b=6 /
    deg-x≤2 window.
  assumptions:
    - Surfaces are non-isotrivial: a≠0 and j non-constant.
    - Free-x means deg x≤3, deg y≤5 under the frozen square predicate with content scaling.
    - Shortest relation means shortest nonzero integer relation in infinity norm,
      verified by group law / specialisation.
  predictions:
    - metric: max_|coeff|(p) of the shortest nonzero relation among observed free-x sections
      direction: lower
      minimum_effect: >-
        max_|coeff|(p) stays in {1,2,3} at every tested p with slope vs log p
        whose uncertainty includes 0.
  test_boundary:
    instances:
      - p in {7, 13, 19, 31}
      - section-rich non-isotrivial surfaces (target ≥2 free-x slots; prefer ≥5/size)
      - free-x sections deg x≤3, deg y≤5
    parameters:
      surface_family: "y^2 = x^3 + a(t)x + b(t), a≠0, deg a≤2, deg b=10, j non-constant"
      relation_extraction: "group-law short search primary; specialisation ≥20 fibres"
    implementation: experiments/EXP-XEDN-006
    budget:
      wall_clock_seconds: 3600
      maximum_memory_gb: 4
      maximum_runs: 6
  falsification_conditions:
    - >-
      max_|coeff|(p) grows so the slope vs log p excludes 0, OR any eligible
      surface has a verified shortest relation with infinity-norm ≥4.
  interpretation_limits:
    - Boundedness supports only this joint degree-shape window at these sizes.
    - Not B2; not crypto-scale.
  status: approved
  proposed_by: coordinator
