hypothesis:
  id: H-SEMBIN-83a856
  question_id: RQ-SEMBIN-9e8f82
  question_ids: [RQ-SEMBIN-9e8f82, RQ-SEMBIN-9fa4ba]
  goal_id: GOAL-SEMBIN-5078bc
  proposal_id: IDEA-20260913-cedd2f
  title: >-
    Trace-parity confinement is the whole low-degree-window yield deficit measured in
    RUN-SEMBIN-1b9afe, and it imposes an unstated parity condition on Nagao's coset
    representatives
  statement: >-
    Let E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, b != 0, and let pi(P) :=
    Tr(x_P) + Tr(a) in Z/2 with pi(O) := 0. Then pi is the quotient map
    E(F_q) -> E(F_q)/2E(F_q) = Z/2 (F1: x(2P) = lambda^2 + lambda + a has trace Tr(a);
    F2: the point-halving criterion, P in 2E iff Tr(x_P) = Tr(a)). Consequently, for
    any F_2-subspace V contained in ker(Tr), every sum of m factor-base points with
    x-coordinates in V has parity m Tr(a), and a target R with pi(R) != m Tr(a) has
    EXACTLY ZERO m-decompositions -- for every b, every chain topology, and both the
    single (eq. 4) and chained (eq. 5) presentations. Semaev's own low-degree window
    V = span{1, alpha, ..., alpha^{k-1}} lies in ker(Tr) at every EVEN n with k < n - s
    (s the second-highest exponent of the field polynomial), by Tr(1) = n mod 2 and
    Newton's identities; a random k-dimensional V lies in ker(Tr) with probability
    2^{-k}. The hypothesis is that this confinement, and nothing else, produces the
    f_dispersion = 0.79-0.82 and variance/mean = 1.46-1.52 recorded for the
    low_degree_polynomial configurations of RUN-SEMBIN-1b9afe (EV-SEMBIN-d40877 O-5):
    the pooled per-target count is a 50/50 mixture of Poisson(2 lambda) and the point
    mass at 0, giving hit fraction (1 - e^{-2 lambda})/2, f_dispersion
    [(1 - e^{-2 lambda})/2] / (1 - e^{-lambda}) and variance/mean = 1 + lambda, with
    lambda the eq. (11) mean and no free parameter. Transferred to Nagao 2015/984
    Section 7: with V confined, coset V + v_i is monochromatic of parity
    Tr(v_i) + Tr(a), so a disjoint family reaches subgroup targets (which lie in 2E)
    only if sum_i Tr(v_i) = m Tr(a) (mod 2), a condition the section does not state.
  mechanism: >-
    The quotient E -> E/2E is a lossy projection compatible with the group law, trivial
    on the odd-order subgroup where the DLP lives, and therefore not an attack
    ingredient: it constrains which targets a factor base can reach and how a yield
    measured over all of E(F_q) transfers to the subgroup. Conditioned on pi(R) =
    m Tr(a) the per-target count keeps eq. (11)'s Poisson shape at mean 2 lambda
    (the same number of factor-base multisets lands on half as many targets);
    conditioned on the other class it is identically 0. Pooling gives mean lambda
    (unchanged, which is EV-SEMBIN-d40877 O-2), variance lambda + lambda^2, and a zero
    fraction above e^{-lambda} -- exactly a shape deficit with an intact mean. b does
    not enter because the criterion involves a and x only (O-5's b-independence is
    predicted). A random V has both parities in equal measure, so every target is
    reachable and the Poisson link holds (O-5's random-family result is predicted).
    Full derivation, novelty screen and retrieved sources: IDEA-20260913-cedd2f.
  assumptions:
    - >-
      (F2)'s converse direction is taken from the retrieved sources named in
      IDEA-20260913-cedd2f (Fong-Hankerson-Lopez-Menezes 2003 Lemma 4.1; Pornin
      ePrint 2022/1325 Section 3) and is re-verified inside the experiment by
      exhaustive enumeration at n = 7, 8, 9 for a in {0, 1} (selftest, not evidence).
    - >-
      RUN-SEMBIN-1b9afe's targets are uniform on affine points with x outside V, so
      the two parity classes are equally represented up to O(q^{-1/2}); the recorded
      R_x integers are field elements under the run's own modulus_for(n).
    - >-
      The measured pooled means (0.45-0.52 at the three t = 2 cells) stand in for
      eq. (11)'s lambda; model predictions are evaluated at the measured mean, never
      at a fitted one.
  proof_search_map:
    applicability: >-
      This is a mechanism hypothesis whose central claim is an elementary theorem
      given (F1), (F2) and V in ker(Tr); the map is recorded because the claim is used
      to CLOSE an open attribution (EV-SEMBIN-d40877 unresolved_confounds) and to add
      a condition to a published construction, both of which are closure-shaped.
    bottleneck: >-
      Whether the WHOLE measured deficit is parity confinement, or only part of it.
      The theorem fixes the Tr = 1 class at zero; it does not by itself fix the
      Tr = 0 class at Poisson shape.
    baseline_embedding:
      parameter_slice: >-
        The three t = 2 cells of RUN-SEMBIN-1b9afe, low_degree_polynomial variant:
        (n, k) = (20, 10), (22, 11), (24, 12), moduli x^20+x^3+1, x^22+x+1,
        x^24+x^4+x^3+x+1 (s = 3, 1, 4; k < n - s at all three).
      reproduction_check: >-
        Recompute the validator's f_dispersion (0.79-0.82) and variance/mean
        (1.46-1.52) from per-R-counts.json before any split; a re-analysis that cannot
        reproduce the pooled figures is not reading the same data.
    observation_collision:
      observable: per-target decomposition count split by pi(R).
      distinct_preimage_search: >-
        Any other mechanism producing an empty class must correlate with pi(R) at
        every target; the known-false splits (an unrelated bit of x_R; Tr under a
        different irreducible of the same degree) are the search for such collisions
        -- they must NOT produce an empty class.
    quantifier_order: >-
      For every confined V and every R with pi(R) != m Tr(a), count = 0 (universal,
      deterministic). For the Tr = 0 class, the Poisson-shape claim is statistical
      and is tested per configuration against the same fit the original run used.
    method_ceiling:
      statement: >-
        Confinement changes yield by a factor in {0, 2} per target class and by nothing
        in the pooled mean. It cannot move an exponent and does not claim to.
      nearby_object_control: >-
        Low-degree V at ODD n (n = 21, 23), where 1 in V has trace 1 and V is not
        confined: the mechanism predicts f_dispersion within error of 1 there, so a
        deficit at odd n would be a different window property.
  predictions:
    - id: P1
      text: >-
        DETERMINISTIC, ZERO FREE PARAMETERS. In every low_degree_polynomial
        configuration of RUN-SEMBIN-1b9afe at even n, every target with
        Tr(x_R) != m Tr(a) (a = 0 on those curves, so Tr(x_R) = 1) has decomposition
        count exactly 0 in both presentations, all seeds, both B modes. The predicted
        integer is 0.
    - id: P2
      text: >-
        Conditioned on Tr(x_R) = 0 in those configurations: mean within sampling error
        of twice the pooled mean; variance/mean within sampling error of 1.00; pooled
        variance/mean within error of 1 + lambda. The Poisson shape is restored inside
        the reachable class.
    - id: P3
      text: >-
        In random_k_dimensional configurations of the same cells and seeds, both
        parity classes are hit with means equal within error and per-class
        variance/mean about 1.00. No stratification.
    - id: P4
      text: >-
        NEW CELLS. Low-degree V at odd n (n = 21, k = 11; n = 23, k = 12; t = m = 2)
        shows f_dispersion within error of 1.00: the deficit is an even-n phenomenon.
    - id: P5
      text: >-
        In RUN-SEMBIN-cbd770's n = 12 low_degree_polynomial rows every typed and
        untyped image lies in a single parity class; at n = 15, 17 and for random V
        neither does. Conditional on the run having retained image MEMBERSHIP (not
        only sizes); if it did not, P5 is recorded as untestable from the archive and
        is NOT scored.
    - id: P6
      text: >-
        RE-READING, NOT A NEW CLAIM. Restricted to targets in 2E, the confined factor
        base's per-target mean is 2 lambda, so eq. (11)'s 18-22% overstatement of P
        for the paper's own V (EV-SEMBIN-d40877 O-4) becomes an understatement of the
        mean by a factor 2 on exactly the targets the algorithm decomposes. Constant,
        not exponent.
  test_boundary:
    instances:
      - >-
        RUN-SEMBIN-1b9afe per-R-counts.json, all 180 configurations, both target
        populations, under the run's own modulus_for(n) and V bases (re-analysis;
        no new curve arithmetic beyond Tr)
      - >-
        RUN-SEMBIN-cbd770 image artifacts, where membership is retained (P5)
      - >-
        two new exhaustive t = m = 2 cells at odd n (P4), counted with the
        EXP-SEMBIN-354a75 code reused read-only
    scale: toy, n <= 24; transfer to any cryptographic n is by the theorem, not by measurement
    excluded: >-
      Supersingular binary curves (different 2-torsion); odd characteristic; any
      degree, Groebner or first-fall quantity; any curve's security in either
      direction.
  falsification_conditions:
    - >-
      One nonzero count on one Tr = 1 target in a low-degree even-n configuration
      falsifies confinement as applied at that cell; since the claim is a theorem
      given (F1), (F2) and V in ker(Tr), such a count indicates an error in the
      recorded x_R, the modulus, or the reading of the code, and is recorded as a
      procedure finding before any claim.
    - >-
      Per-class variance/mean in the Tr = 0 class remaining at 1.4-1.5 falsifies
      "confinement is the WHOLE deficit": the open attribution of EV-SEMBIN-d40877
      stands with this mechanism subtracted.
    - >-
      Low-degree V at odd n showing f_dispersion 0.79-0.82 falsifies the even-n
      scoping (P4).
    - >-
      A known-false split (unrelated bit, wrong modulus) that also produces an empty
      class means the analysis code, not the curve, produces the effect; the run is
      then invalid, not a finding.
  interpretation_limits:
    - Says nothing about first fall degree, Proposition 5, or Theorem 1's exponent.
    - Says nothing about the security of any curve at any parameter, in either direction.
    - >-
      Changes constants only: a factor in {0, 2} in per-target yield and one parity
      condition on Nagao's representatives. No exponent is moved or claimed.
    - >-
      Immutable records EV-SEMBIN-d40877, DEC-20260913-3b51c8 and the RELN records are
      not edited by any outcome here; a confirmed mechanism is a new record that
      supersedes by reference.
