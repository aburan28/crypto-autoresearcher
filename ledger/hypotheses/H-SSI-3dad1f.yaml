hypothesis:
  id: H-SSI-3dad1f
  title: A canonical complete EndRing witness can seed a code-decoding PKE trapdoor, but EndRing-only IND-CPA requires a new reverse reduction
  area: SSI
  question_id: RQ-SSI-1946c9
  research_question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  idea_id: IDEA-20261007-6553d5
  added: '2026-10-07'
  recorded_at: '2026-10-07'
  status: proposed
  proposed_by: idea-generator
  approved_by: null
  statement: >-
    For accepted ER-McE keys, certified binary Goppa decoding returns the
    actual selected message for every exact-weight-t encryption error. Any
    claim that IND-CPA security follows from supersingular EndRing additionally
    requires a polynomial exact-distribution simulator and extractor from an
    IND adversary to a complete evaluable End(E) basis; neither is supplied.
  mechanism: >-
    CanRing(End(E)) deterministically seeds a scrambled Goppa code. Public
    encryption adds a weight-t error to mG_pub; the recipient uses the derived
    Goppa trapdoor to decode. The current one-way implication runs from an
    EndRing solver to decryption, while the claimed security direction is open.
  predictions:
    - id: P1
      statement: conditional on distance at least 2t+1 and a correct total decoder, every valid round trip returns exactly m
      falsifier: one accepted valid key/message/error with a different output or bottom
    - id: P2
      statement: a bare EndRing challenge E is insufficient to sample exact G_pub by the stated KeyGen because G_pub depends on CanRing(End(E))
      falsifier: a polynomial simulator from E alone with proved exact or negligible-distance output and no EndRing witness
    - id: P3
      statement: plaintext distinguishing advantage alone does not identify a complete ring basis under the current proof map
      falsifier: a polynomial extractor with explicit loss that passes the known-false control
  test_boundary: zero-run symbolic/type and reduction audit only; no experimental, implementation, formalizer, or concrete-security evidence
  controls:
    - public-data generic/structural decode using the exact adversarial view
    - known-false ciphertext that directly contains m
    - equivalent-basis CanRing agreement
    - wrong-key, malformed-ciphertext, and exact-weight checks
  falsification_conditions:
    - conditional correctness counterexample
    - polynomial public decoder or trapdoor recovery
    - CanRing disagreement across equivalent bases
    - exact bare-challenge embedding and attacker-to-EndRing extraction, which would close the recorded reduction gap
  assumptions:
    - Seeded-Goppa-IND is separate and not implied by EndRing in this record
    - path-generated Walk-ER and real-view Aux-ER-McE are distinct games
    - no QPT, QROM, CCA, concrete security, novelty, or deployment conclusion is inherited
