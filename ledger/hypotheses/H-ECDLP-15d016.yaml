  statement: >
    Fix the one-step next-feature split
    of a parity feature on a prime-order
    additive group before any predictive
    automaton, history class, cubical
    point, Tate pairing, DL-spectrum,
    Coppersmith solve, Semaev polynomial,
    or Velu map is read. Stage 0 asserts
    only that on Z/7Z the feature
    phi(x)=x mod 2 with action x |-> x+1
    splits the even class {0,2,4} from
    {6} by next-feature, that the odd
    class stays unsplit, and that the
    same construction rejects the
    known-false claim that phi is a
    group homomorphism Z/7Z -> Z/2Z.
    Frozen REAL tables: phi =
    [0, 1, 0, 1, 0, 1, 0]; next-phi =
    [1, 0, 1, 0, 1, 0, 0]; even next =
    [1, 1, 1, 0]; odd next = [0, 0, 0].
    KF witness: phi(3+4)=0 but
    phi(3)+phi(4)=1. NULL empty x-list
    rejected. n=0 rejected. This is not
    an automaton-size bound, not a
    cubical lift, not Tate, not a
    DL-spectrum, not Coppersmith, not
    Semaev S_m, not Velu, not a yield
    ratio k, and not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260906-e07475 Stage 0 hard
    gate is whether a declared feature
    plus one public action splits a
    class by next-feature, and whether
    a translation-equivariant
    deterministic quotient that is
    neither trivial nor injective is
    rejected. Stage 0 freezes that
    identity as exact tables on Z/7Z
    and rejects the homomorphism
    nearby object. No automaton is
    minimized. No history class is
    stored beyond one step. This is a
    new GOAL-ECDLP-001 object after
    Stage 0 of EXP-ECDLP-eab4d7 held
    as P-S0-N2ROOT (DEC-20260908-18768d).
    It is not Stage 1 of EXP-ECDLP-eab4d7
    and not Stage 1 of this experiment.
  predictions:
    - id: P-S0-REFSPLIT
      metric: well-defined one-step next-feature split table on frozen Z/7Z
      direction: different
      minimum_effect: >
        After fixture_pass, REAL phi
        equals [0, 1, 0, 1, 0, 1, 0]
        and next-phi equals
        [1, 0, 1, 0, 1, 0, 0]. Even
        next equals [1, 1, 1, 0]. Odd
        next equals [0, 0, 0]. KF
        homomorphism claim is rejected.
        NULL empty x-list is rejected.
        n=0 is rejected. One certified
        miss after fixture_pass is a
        scoped falsification of this
        instrument at the frozen toys.
      claim_tier: observational
  falsification_criteria:
