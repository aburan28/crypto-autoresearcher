    prose: >
      Toy scale. Stage 0 is exact
      Z/7Z arithmetic on one frozen
      split table and one homomorphism
      reject. It is not an automaton,
      not a cubical lift, not Tate,
      not a DL-spectrum, not
      Coppersmith, not Semaev S_m,
      not Velu, not Stage 1 of
