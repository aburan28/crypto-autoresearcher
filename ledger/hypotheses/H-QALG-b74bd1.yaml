hypothesis:
  id: H-QALG-b74bd1
  question_id: RQ-QALG-74bf20
  derived_from_idea: IDEA-20260813-55d3a0
  added: '2026-08-25'
  status: proposed
  proposed_by: coordinator
  title: >-
    CRT decomposition of the dihedral hidden-shift instance: after measuring the
    Z_{N2} component of a D_N coset sample, the surviving (coin, Z_{N1}) state is,
    for EVERY measurement outcome, a genuine D_{N1} coset sample with shift
    d mod N1 up to a publicly computable relabeling
  statement: >-
    SCOPE: toy moduli N = N1*N2 with N1, N2 coprime and log2 N <= 20, simulated
    EXACTLY over cyclotomic rationals rather than in floating point; plus a purely
    number-theoretic arm on the class-group order of standardized CSIDH parameter
    sets. CLAIM TIER toy for the algebra and exact-arithmetic for the factorization.
    NO ATTACK IS CLAIMED, NO CSIDH SECURITY LEVEL IS ASSERTED, AND NO EXPONENT IS
    MOVED BY THIS RECORD.
    THE CLAIM, in two separable parts.
    (P1, ALGEBRAIC) Let |psi> = (|0,x> + |1, x+d mod N>)/sqrt(2) with x uniform mod
    N. Under the CRT isomorphism Z_N = Z_{N1} x Z_{N2}, write x = (x1, x2) and
    d = (d1, d2). Measure the x2 register, obtaining outcome x2*. Then the reduced
    state on the (coin, x1) registers is, for EVERY outcome x2* and EVERY true shift
    d, exactly the density matrix of a genuine D_{N1} coset sample with shift d1, up
    to a relabeling computable from x2* and public data alone. Fidelity against the
    directly constructed ground-truth D_{N1} coset state is exactly 1, not
    approximately 1.
    (P2, ARITHMETIC) The class-group order N of at least one standardized CSIDH
    parameter set admits a nontrivial coprime factorization N = N1*N2 with log2 N1
    and log2 N2 both within a constant factor of (log2 N)/2.
    THE HYPOTHESIS ASSERTS BOTH. Either part failing falsifies it, and the two
    failures have completely different meanings and different successors, so they are
    measured separately and reported separately.
  mechanism: >-
    CRT on Z_N is a ring isomorphism and therefore commutes with negation, the
    involution generating the dihedral group, so the D_N instance formally
    decomposes as a fiber product D_{N1} x_{Z_2} D_{N2} sharing exactly one Z_2
    factor. The load-bearing subtlety - and the reason this is an experiment rather
    than a remark - is that the two branches of the coset superposition share ONE
    coin qubit b. The two components are therefore NOT two independent samples, and
    the question is whether measuring the Z_{N2} register leaves the coin's relative
    phase intact on the Z_{N1} side or scrambles it by an x2*-dependent term that a
    single-sample partial trace cannot undo. If it leaves it intact, a batch of D_N
    samples converts into a batch of D_{N1} samples plus a batch of D_{N2} samples,
    each solvable by the standard sieve at the smaller size, with the full shift
    recovered by classical CRT recombination. If it scrambles, the projection
    destroys exactly the information the sieve consumes and the decomposition is
    void. The state at log2 N <= 20 is small enough to construct and trace out
    EXACTLY, so this is a decidable algebraic question requiring no quantum
    hardware, no statistics and no heuristic.
  assumptions:
    - >-
      Exact simulation at log2 N <= 20 faithfully represents the algebra. The state
      vector is over exact roots of unity and the arithmetic is rational/cyclotomic,
      so this is not a numerical assumption - but the CONVENTION for the coset state,
      the relabeling and the fidelity must be frozen before the run, since a
      relabeling chosen after seeing the reduced state can absorb any discrepancy.
    - >-
      The class-group order used in P2 is obtained with a citation and NOT adopted
      from any in-progress internal reconstruction, per this question's own
      baseline-reproduction constraint. If it cannot be obtained with a citation in
      this environment, P2 is UNAVAILABLE and is reported as unavailable, not guessed.
    - >-
      The reduction producing the D_N instance from isogeny path-finding is taken as
      given and is NOT modified. This record asks only whether the resulting D_N
      instance decomposes further given N's factorization.
  proof_search_map:
    bottleneck: >-
      Whether measuring the Z_{N2} register commutes with the coset state's defining
      phase relation, so that the reduced (coin, x1) state is a valid D_{N1} coset
      state with shift d1 for EVERY outcome x2* - or whether the coin register's
      relative phase acquires an x2*-dependent term that a partial trace on a single
      sample cannot undo. One yes/no algebraic fact, exactly decidable at toy size,
      on which every downstream cost claim rests.
    baseline_embedding:
      parameter_slice: >-
        N1 = N, k = 1, no split. The construction must reduce EXACTLY to the ordinary
        dihedral coset sample with no claimed gain. This is the fixed reference point
        and it is free.
      reproduction_check: >-
        At N1 = N the projected state must equal the directly constructed coset state
        as an exact density matrix, entry for entry over the cyclotomic field. Exact
        equality, not similarity of a statistic. A failure means the harness's
        bookkeeping is wrong and no split result from it may be reported.
    observation_collision:
      observable: >-
        The reduced (coin, x1) density matrix after tracing out the Z_{N2} register.
      distinct_preimage_search: >-
        Construct two distinct full-instance shifts d and d' whose (coin, x1)
        observables after measurement and relabeling are IDENTICAL. If such a pair
        exists with d1 != d1', the projected state does not determine d1 and the
        mechanism's claimed recovery is refuted directly, regardless of what the
        fidelity says on any single instance. This search is a REQUIRED arm, not an
        afterthought: fidelity 1 on one instance and identifiability are different
        properties and only the second supports the cost claim.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-express D_N coset sampling as a fiber product of two group actions with
          the shared coin bit as the only entangling resource, and state the
          completeness, soundness, transfer and cost-loss obligations for converting
          one D_N sample batch into a D_{N1} batch plus a D_{N2} batch.
        predicted_gain: >-
          IF the algebra holds AND a favourable factorization exists, a
          PARAMETER-REDUCTION - the sieve runs at (log N)/k instead of log N inside
          the same exponent form. This is explicitly NOT a change of functional form
          and the record refuses to describe it as one.
    quantifier_order: >-
      The existing claim is: for all N, there exists a sieve running in
      2^{O(sqrt(log N))}. This record's claim, if it survives, is: for all N admitting
      a coprime factorization with comparable-size factors, there exists an algorithm
      running at the smaller effective size, PROVIDED the fiber-product sample
      reduction is correct for that specific N's factorization. The witness - the exact
      reduction map - depends on N's factorization, which is public and computable, so
      that dependence is legitimate rather than a hidden non-uniformity, and saying so
      explicitly is what keeps it legitimate. The critical quantifier risk is whether
      correctness requires N1 and N2 to be COMPARABLE in size, which must be checked
      across unbalanced splits and not assumed favourable.
    method_ceiling:
      strongest_certifiable_claim: >-
        At best: a PARAMETER-REDUCTION result - a factor-sqrt(k) reduction in the
        argument of the sqrt in the exponent - for parameter sets whose class-group
        order factors favourably, certified as exact algebra at toy size and as a
        number-theoretic fact at the standardized set. It can never certify a
        method-level exponent-form change, and the record must not be written as one.
      nearby_object_control: >-
        The degenerate k = 1 case, which must reproduce the ordinary algorithm exactly
        with no gain; and a deliberately WRONG pseudo-factorization (non-coprime
        factors), which the compatibility check must demonstrably REJECT. A harness
        that accepts the wrong factorization cannot detect an incompatibility and its
        verdict on the real one is worthless.
    proof_obligations:
      - claim: The CRT map on Z_N is compatible with the dihedral involution.
        responsibility: correctness
      - claim: Tracing out Z_{N2} leaves a valid D_{N1} coset state for EVERY outcome, not a post-selected subset.
        responsibility: correctness
      - claim: Distinct d1 give distinct projected observables (identifiability).
        responsibility: correctness
      - claim: The standardized class-group order admits a comparable-size coprime split.
        responsibility: baseline
      - claim: Combined cost of the k smaller instances plus recombination and any post-selection beats the direct instance.
        responsibility: runtime
      - claim: The toy-scale finding is scoped and its extrapolation named as such.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: The dihedral hidden-shift instance underlying CSIDH-style key recovery.
    prior_best: 2^{O(sqrt(log N))} time and query, by the standard sieve applied to the full unfactored order.
    time_exponent: >-
      Conditional and NOT claimed by this record: 2^{O(sqrt((log N)/k))} for k
      roughly-equal coprime factors, which is a reduction of the CONSTANT inside the
      sqrt and not of the exponent's functional form.
    memory_exponent: >-
      Comparable to k independent sieve instances at the smaller size; to be confirmed
      by the same reproduction that would establish any time claim, and unconfirmed here.
    hidden_cofactor: >-
      Classical CRT bookkeeping and any post-selection needed to handle the shared coin
      bit. UNBOUNDED at present. If handling the coin costs a factor growing with N
      rather than a true constant, the claimed gain is erased, and the toy arm measures
      exactly that.
    claim_kind: constant_factor
    claim_kind_note: >-
      Deliberately the weakest label. The best available outcome is a parameter
      reduction inside an unchanged exponent form; calling it an exponent improvement
      would be the overclaim this record is written to avoid.
  heuristic_assumptions:
    - id: HEUR-QALG-b74bd1-1
      formal_statement: >-
        The exact algebraic identity verified at toy N (log2 N <= 20) - that the
        projected (coin, x1) state equals the ground-truth D_{N1} coset state for every
        measurement outcome - continues to hold at cryptographic-size N, since the
        derivation of CRT compatibility with negation is scale-invariant.
      random_model_justification: >-
        No random model applies: the toy finding, if positive, is an EXACT
        finite-dimensional linear-algebra identity, not a statistical claim. The residual
        risk is the ordinary risk of generalizing a proof from verified instances, and it
        is numbered here rather than absorbed because that is the only place scale enters
        this record at all.
      supporting_results:
        - >-
          CRT is a ring isomorphism and therefore commutes with negation. Elementary and
          re-derived symbolically at stage 1 rather than cited.
      validation_experiment_ids:
        - EXP-QALG-8e2fce
      falsification_condition: >-
        The exact fidelity degrades - not merely stays at 1 - as toy N is raised across
        the declared ladder. Any downward trend in a quantity that is supposed to be
        exactly 1 signals a scale-dependent effect the algebra did not anticipate, and it
        must be diagnosed before any generalization is written.
    - id: HEUR-QALG-b74bd1-2
      formal_statement: >-
        Handling the shared coin bit between the two projected sub-instances costs at
        most a CONSTANT factor per sample, independent of N.
      random_model_justification: >-
        NONE. The parent proposal asserts this and its own confounders flag it as needing
        verification rather than assumption. It is the assumption on which the entire
        cost claim rests, and if the cost grows with N the gain is erased even when the
        algebra is sound.
      supporting_results: []
      validation_experiment_ids:
        - EXP-QALG-8e2fce
      falsification_condition: >-
        The measured post-selection acceptance rate, or the number of D_N samples needed
        per usable D_{N1} sample, grows with toy N across the ladder. The cost claim then
        fails on its own terms even under a perfect fidelity.
  structural_ingredients:
    - description: >-
        The standard dihedral hidden-shift sieve as the declared baseline, and the
        reduction of isogeny path-finding to a hidden-shift instance as the declared
        source of the D_N instance.
      citation: null
      provenance: recalled
      verified_by: >-
        NOT VERIFIED. Neither is read for this record and neither is modified by it; both
        are used only as the boundary the record must not silently re-enter. The
        baseline's cost is used only as a comparison target and is stated as relayed.
      role: declared baseline and declared instance source
    - description: >-
        The published class-group structure and order for a standardized CSIDH parameter
        set.
      citation: null
      provenance: recalled
      verified_by: >-
        NOT VERIFIED and NOT adopted from any in-progress internal reconstruction. Stage 1
        of the paired contract must obtain it with a citation or declare P2 unavailable.
      role: the integer whose factorization decides whether the mechanism is vacuous
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: >-
        projection_fidelity - exact fidelity between the reduced (coin, x1) state and
        the directly constructed ground-truth D_{N1} coset state, over every measurement
        outcome x2* and every true shift d, at every toy (N1, N2) pair
      direction: higher
      minimum_effect: >-
        EXACTLY 1.0, over exact arithmetic, with NO tolerance - the algebra is exact, not
        probabilistic. Any outcome with fidelity strictly below 1 falsifies P1 as stated.
        This is the primary metric and it is two-valued by construction.
    - metric: >-
        identifiability - existence of two distinct shifts d, d' with d1 != d1' whose
        projected observables coincide
      direction: lower
      minimum_effect: >-
        NONE FOUND over an exhaustive sweep at toy size. A single such pair refutes
        recovery of d1 from the projected state even if the fidelity is 1, and it is the
        failure mode a fidelity check alone cannot see.
    - metric: degenerate_case_reproduction
      direction: different
      minimum_effect: >-
        At N1 = N, exact equality with the ordinary coset state, entry for entry.
        POSITIVE CONTROL, forced value; a failure voids the run.
    - metric: wrong_factorization_rejection
      direction: different
      minimum_effect: >-
        The compatibility check must REJECT a deliberately non-coprime pseudo-split. If
        it accepts, the check cannot detect an incompatibility and every acceptance it
        issued is meaningless. NEGATIVE CONTROL with a forced value.
    - metric: >-
        class_group_order_split - existence of a coprime factorization of a standardized
        CSIDH class-group order with log2 of both factors within a constant factor of
        (log2 N)/2
      direction: different
      minimum_effect: >-
        HONESTLY PREDICTED UNKNOWN. Cyclicity of the class group does not determine
        whether its ORDER is composite with comparable factors; this is a fact about one
        specific integer and no value is assumed favourable. Existence supports P2;
        N prime, or N = tiny factor times huge cofactor, falsifies P2 for that parameter
        set and makes the mechanism vacuous THERE - not everywhere.
    - metric: >-
        coin_handling_cost - number of D_N samples consumed per usable D_{N1} sample, as
        toy N grows
      direction: different
      minimum_effect: >-
        FLAT in N under HEUR-QALG-b74bd1-2. Any growth trend erases the claimed gain even
        under perfect fidelity, and it is measured rather than assumed away.
  test_boundary:
    instances: >-
      All toy moduli N = N1*N2 on a declared ladder with N1, N2 coprime and
      log2 N <= 20, exhaustively over every measurement outcome x2* and every shift d;
      plus, separately, the standardized CSIDH class-group order for the arithmetic arm.
    parameters:
      toy_ladder: >-
        At least four (N1, N2) pairs spanning balanced and deliberately UNBALANCED
        splits, since the quantifier audit names size-comparability as the critical risk.
      arithmetic: >-
        Exact cyclotomic/rational arithmetic; explicitly no floating point, since the
        claim is exact equality and a float would convert a falsification into a rounding
        question.
      exhaustiveness: >-
        Every x2* and every d at every toy pair. At log2 N <= 20 this is affordable and
        partial sampling is forbidden - a mechanism that fails on one outcome fails.
    implementation: >-
      Pure Python with exact rational/cyclotomic arithmetic; no SageMath, which is absent
      from this container; no quantum hardware and no approximate simulator.
    budget:
      total_cpu_hours: 1
      maximum_runs: 15
  falsification_conditions:
    - >-
      The exact fidelity is strictly below 1 for at least one measurement outcome at any
      toy pair, with the degenerate control passing and the wrong-factorization control
      rejecting. P1 is refuted: the projection does not preserve the coset structure, the
      shared coin bit's phase is scrambled, and the decomposition is void. Direct,
      decisive, and requires no statistics.
    - >-
      Two distinct shifts with d1 != d1' produce identical projected observables. Even at
      fidelity 1, d1 is not recoverable from the projection and the mechanism's cost claim
      has no basis.
    - >-
      The standardized class-group order has no comparable-size coprime factorization. P2
      fails for that parameter set and the mechanism is vacuous THERE - it does not close
      the question for other parameter sets, whose orders factor differently.
    - >-
      The coin-handling cost grows with toy N. The gain is erased on cost grounds even if
      the algebra is sound.
    - >-
      The degenerate k = 1 control fails, or the wrong-factorization control is accepted.
      The harness is broken; nothing is reportable from any arm.
  interpretation_limits:
    - >-
      Toy-scale exact verification is HYPOTHESIS-GENERATING for the algebra and nothing
      more; it establishes nothing about any standardized parameter set without the
      arithmetic arm succeeding independently.
    - >-
      No claim about CSIDH's security level is made regardless of outcome, and none is
      reachable from this record.
    - >-
      The best possible outcome is a PARAMETER-REDUCTION result - attacking a smaller
      effective instance - and must be reported as one. Describing a factor-sqrt(k)
      reduction inside the sqrt as an exponent improvement would be an overclaim, and
      this record forbids that reading in advance.
    - >-
      A negative arithmetic arm closes THIS parameter set for THIS mechanism with a
      named, checkable obstruction. It explicitly leaves open whether other CSIDH-like
      parameter proposals factor favourably, and that forward guidance is part of the
      deliverable rather than an afterthought.
    - >-
      No status change to any existing record is proposed or implied.
  prior_evidence_refs:
    - RQ-QALG-74bf20
    - IDEA-20260813-55d3a0
  distinguishable_outcomes:
    - outcome: >-
        Degenerate control passes, wrong-factorization control rejects, exact fidelity is
        1 on every outcome at every toy pair including the unbalanced ones, no
        identifiability collision is found, and coin-handling cost is flat.
      means: >-
        SUPPORTS P1 at toy scale. The projection is algebraically sound. Next decision:
        the arithmetic arm becomes decisive - if a standardized order splits favourably,
        this is a genuine parameter-reduction lead and goes to adversarial review with a
        cost accounting BEFORE anything is claimed; if not, the lead is vacuous at that
        parameter set and the successor is other parameter sets.
    - outcome: >-
        Controls behave, and the exact fidelity is below 1 on at least one outcome, or an
        identifiability collision is found.
      means: >-
        FALSIFIES P1. The shared coin bit is not benign; the decomposition does not
        survive the partial measurement. Next decision: record the exact failing outcome
        as a counterexample CERTIFICATE - this is the strongest refutation artifact
        available here and it is cheap - and close this mechanism on the algebra, with
        the certificate archived before the decision that rests on it.
    - outcome: >-
        Fidelity is 1 but the coin-handling cost grows with N, or the class-group order
        does not split favourably.
      means: >-
        The algebra survives and the LEAD does not, for a stated reason. Next decision:
        record the obstruction with its measured quantity and scope; do not write "the
        mechanism is wrong", because it is not - it is inapplicable here.
    - outcome: >-
        Degenerate control fails, wrong-factorization control accepts, or the class-group
        order cannot be obtained with a citation.
      means: >-
        NO EVIDENCE EITHER WAY. Instrument or unavailable-source outcome (AGENTS.md
        rule 5). Next decision: return to the Executor with the concrete defect, or report
        the arithmetic arm as unavailable rather than substituting an uncited number.
