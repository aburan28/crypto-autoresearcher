# H-TORS-87932d — specified from IDEA-20261006-ed9a14.
# The proposal file is the byte-for-byte copy from
# origin/design/ntru-bd02d9-fatigue. Protocol approval is
# DEC-20261006-fc6f93. This record asserts no change in the discrete-log
# exponent 1/2. The design session counted points, built psi_5, and
# factored it once. It did not draw the 200 scalars.
hypothesis:
  id: H-TORS-87932d
  question_id: RQ-TORS-8c7b79
  source_proposal: IDEA-20261006-ed9a14
  status: approved
  status_note: >-
    approved means the measurement protocol in EXP-TORS-9f8a77 is
    approved for a later executor. It does not mean the Legendre
    symbol of psi_5 agrees with k mod 2 at a rate within 0.06 of 1/2.
    Status moves only by DEC-20261006-fc6f93 under the standing user
    authorization of 2026-09-06. This design session wrote no run
    artifact and did not evaluate the symbol on the 200-scalar sample.
  proposed_by: coordinator
  conversion_note: >-
    The agreement band 0.06, the sign floor 20, the sample size 200,
    the second sample, and the rate-0.70 negative are carried from
    IDEA-20261006-ed9a14. The Coordinator pinned p=751, the curve
    y^2 = x^3 + x + 1, the generator (0, 1), the integer coefficients
    of psi_5, and the SHA-256 sampler.

  statement: >-
    TEST BOUNDARY. Let p=751. Let E be y^2 = x^3 + x + 1 over F_751.
    The design session counted #E = 727 by a Legendre sum and by
    enumeration, found that 727 is prime, and found that G = (0, 1)
    has order 727. The polynomial psi_5 is the primitive integer
    5-division polynomial of degree 12 with positive leading
    coefficient, frozen in EXP-TORS-9f8a77. For nonzero Q = kG, chi(Q)
    is the Legendre symbol (psi_5(x(Q)) / F_751) in {+1, -1}. The sign
    bit is (1 - chi)/2. Two samples, seeds 1 and 2, each draw 200
    uniform scalars in 1..726 by the frozen SHA-256 rejection sampler.

    PRE-REGISTERED PREDICTION, fixed before any executor run. After the
    nonsingular, ordinary, order, formula-check, carrier, and
    factorization gates pass, each sample has agreement count a with
    |a - 100| <= 12, and each of +1 and -1 occurs at least 20 times in
    each sample, and the three factorizations of the frozen psi_5
    return the same degree multiset (2, 2, 2, 2, 2, 2). A finished
    pair of samples with both agreement counts at least 140, under
    those gates, falsifies the claim that the symbol is not tracking
    k mod 2 at rate 0.70. A sign count below 20 is the other finished
    negative from the proposal. The exponent 1/2 is not claimed to move.

    DISTINGUISHABLE OUTCOMES. (1) The gates pass and both samples sit
    in the band with both signs at least 20 times: the prediction
    holds at this pin. (2) The gates pass and both agreement counts
    are at least 140: the rate-0.70 negative. (3) A sign occurs fewer
    than 20 times: the symbol is not shown to be point-dependent.
    (4) The factorization multiset changes across the three calls.
    (5) An agreement count leaves the band without both counts
    reaching 140: the prediction misses, and that miss is not the
    rate-0.70 negative. (6) psi_5 vanishes at a sample point, the
    planted carrier fails to agree at rate 1, or the two group laws
    disagree: invalid, not a correlation. (7) A timeout: infrastructure,
    not a mathematical negative.

  mechanism: >-
    The tracked object is chi(Q) = (psi_5(x(Q)) / F_751) for Q = kG
    nonzero in the prime-order subgroup. The representation is the
    affine x-coordinate. The value is one degree-12 evaluation and one
    Legendre symbol. No pairing is evaluated. Translation on the
    subgroup is the operation in the lossy-projection test. A map into
    a 2-element set is not injective on a subgroup of order 727, so a
    symbol that took only one value would be a curve constant. Both
    signs appearing at least 20 times is the observation that chi is
    not that constant. Agreement with k mod 2 at rate 0.70 or higher
    on both samples would be the observation that the lost information
    includes that public bit. The irreducible-factor degree multiset
    of psi_5 over F_751 does not read Q, so it is the curve-only
    control and must not change when k is resampled. Frobenius fixes
    every F_751-point, so chi is automatically Frobenius-invariant.
    The non-generic resource is the division polynomial at a public
    point, not an endomorphism acting as a scalar.

  assumptions:
    - The curve is ordinary, p=751 > 5, and 5 does not divide N=727.
    - psi_5 is the primitive odd division polynomial of degree 12 frozen in the experiment, obtained from the recurrence psi_5 = psi_4 psi_2^3 - psi_3^3 before any sample.
    - For nonzero Q in the subgroup, psi_5(x(Q)) is nonzero, so the Legendre symbol is +1 or -1. A zero is an invalid sample.
    - Each sample draws 200 scalars uniformly from 1..726 by the frozen rejection sampler, with the curve and the base point held fixed.

  proof_search_map:
    bottleneck: >-
      Whether the agreement rate of the sign bit with k mod 2 stays
      within 0.06 of 1/2 on both samples of 200, while both signs
      appear at least 20 times. The exponent 1/2 is a different
      quantity.
    baseline_embedding:
      parameter_slice: >-
        p=751, N=727, G=(0, 1), 200 scalars per seed in {1, 2}, the
        frozen psi_5 coefficients, and the SHA-256 rejection bound
        in EXP-TORS-9f8a77.
      reproduction_check: >-
        Two group-law implementations agree on 2G and on 727*G = O.
        Two point counters agree on #E = 727. The formula-check
        point of order 5 on the auxiliary curve has psi_5 equal to 0.
    observation_collision:
      observable: agreement count of the sign bit with k mod 2
      distinct_preimage_search: >-
        The planted carrier that outputs k mod 2 must agree with
        that bit at rate 1. If it does not, the comparison code is
        wrong and the claim is not scored.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The pair of agreement counts and the pair of sign
          histograms on the two seeds.
        predicted_gain: >-
          Each agreement count within 12 of 100, or an explicit
          finished count of at least 140 on both seeds.
    quantifier_order: >-
      There exists this one named curve at p=751 such that, after
      the gates, both samples of 200 lie in the band and both signs
      appear at least 20 times. Not for all ordinary curves, and not
      for all division polynomials.
    method_ceiling:
      strongest_certifiable_claim: >-
        At this pin, either the band and the sign floor hold on both
        samples, or a finished negative named in the reading table
        holds. No ECDLP solve and no exponent change is certifiable
        from the agreement rate.
      nearby_object_control: >-
        The planted carrier matches k mod 2 at rate 1. The
        irreducible-factor multiset of psi_5 does not read k. A
        change in that multiset is an instrument failure.
    proof_obligations:
      - claim: The sign bit is (1 - chi)/2 and the band is |a - 100| <= 12.
        responsibility: correctness
      - claim: Both samples meet the band and the sign floor when the gates pass.
        responsibility: baseline
      - claim: No exponent change is inferred.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits one Legendre-symbol comparison. It is not
      a proof that a division polynomial beats or fails the generic
      bound beyond KR-RHO-13bf67.

  rerandomization: >-
    The two SHA-256 seeds resample k on the same curve. That is the
    proposal's second sample, not a reduction from a worst-case
    instance to an average-case instance. No discrete log is pulled
    back from a different curve.

  asymptotic_claim:
    problem: >-
      Whether the agreement band and the sign floor hold at p=751
      on both samples. ECDLP is not claimed to be faster.
    prior_best: >-
      Pollard rho at exponent 1/2 (KR-RHO-13bf67). A pairing
      transfer applies only for small embedding degree
      (KR-RHO-53c89f) and is not invoked. The exponent stays 1/2.
    time_exponent: unchanged
    memory_exponent: unchanged
    hidden_cofactor: >-
      No algorithmic o(1) term is claimed. Degree 12 and one
      Legendre symbol are explicit. The band 0.06 is an instrument
      tolerance around 1/2, not a hidden cofactor.
    claim_kind_note: >-
      No exponent improvement, cofactor improvement, or constant-factor
      improvement of ECDLP is claimed, so none of those three labels
      is applied.

  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For Q = kG with k uniform in 1..726, the Legendre symbol of
        psi_5(x(Q)) agrees with k mod 2 at a rate whose absolute
        deviation from 1/2 is at most 0.06 on a sample of 200, on
        both frozen seeds, and each symbol value occurs at least 20
        times.
      random_model_justification: >-
        The comparison distribution is a fair coin on the planted
        bit, against a carrier that matches the bit at rate 1. A
        Weil-type character-sum bound of size about deg(psi_5) times
        sqrt(p) is recalled and was not opened in this session, so
        it is not used as a checked bound. The band 0.06 is the
        pre-registered comparison from IDEA-20261006-ed9a14.
      supporting_results:
        - ref: IDEA-20261006-ed9a14
          provenance: internal
          claim: >-
            The proposal states the band 0.06 on 200 scalars, the
            sign floor 20, the second sample, and the rate-0.70
            falsifier.
          verified_by: ledger/proposals/IDEA-20261006-ed9a14.yaml
        - ref: KR-RHO-13bf67
          provenance: internal
          claim: >-
            Generic algorithms for a prime-order discrete logarithm
            need Omega(sqrt(N)) group operations. This hypothesis
            does not beat that floor.
          verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        - ref: KR-RHO-53c89f
          provenance: internal
          claim: >-
            MOV and Frey-Rück apply only for small embedding degree.
            This hypothesis evaluates no pairing.
          verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
      validation_experiment_ids:
        - EXP-TORS-9f8a77
      falsification_condition: >-
        The gates pass and both agreement counts are at least 140.
        A sign count below 20 is the other negative. A vanished
        symbol or a broken carrier does not falsify the heuristic.

  structural_ingredients:
    - description: >-
        A generic-group discrete logarithm in a prime-order group
        needs Omega(sqrt(N)) group operations.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
      role: exponent ceiling this hypothesis does not cross
    - description: >-
        Pairing transfer to a finite-field logarithm requires small
        embedding degree. Generic curves are not handled by that
        reduction.
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
      role: scope limit, no pairing is evaluated
    - description: >-
        Small-order torsion is used in the literature to shrink
        point-decomposition systems on extension fields. This
        hypothesis evaluates psi_5 at prime-field points and claims
        no decomposition saving.
      citation: KR-IC-955fd6
      provenance: internal
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
      role: adjacent torsion use this measurement does not repeat

  reduction_chain:
    core_problem: >-
      The numerical comparison of one Legendre symbol with the bit
      k mod 2 at p=751, on two samples of 200.
    corollaries: []

  predictions:
    - metric: agreement_with_k_mod_2
      direction: lower
      minimum_effect: >-
        On each sample of 200 the absolute deviation of the
        agreement rate from 1/2 is at most 0.06, equivalently the
        agreement count a satisfies |a - 100| <= 12.
    - metric: sign_support
      direction: different
      minimum_effect: >-
        Each of +1 and -1 occurs at least 20 times in each sample
        of 200.

  test_boundary:
    instances:
      - E y^2 = x^3 + x + 1 over F_751 with G = (0, 1) of order 727
    parameters:
      prime: 751
      subgroup_order: 727
      sample_size: 200
      seeds: [1, 2]
      agreement_band: 0.06
      sign_floor: 20
      rate_070_count: 140
    implementation: >-
      Exact field arithmetic in F_751, the frozen integer polynomial,
      two group-law implementations, and the SHA-256 rejection sampler.
    budget:
      maximum_runs: 1
      enforcement: advisory

  falsification_conditions:
    - Both agreement counts are at least 140 after the gates pass. That is an agreement rate of at least 0.70 on both samples.
    - Either sign occurs fewer than 20 times in a sample of 200.
    - The irreducible-factor degree multiset of psi_5 changes across the three factorization calls.
    - psi_5(x(Q)) = 0 for a nonzero subgroup point in the sample, in which case the sample is invalid rather than a positive correlation.

  interpretation_limits:
    - An agreement rate inside the band on 200 scalars does not prove independence. It rules out a 0.70 agreement with this one bit on this curve.
    - The symbol is not a Weil or Tate pairing, and the test does not reduce the discrete logarithm to a finite-field logarithm.
    - No statement is made about ell-torsion for ell dividing N, about the embedding degree, or about any curve other than the frozen one.
    - Evidence from this design is toy-scale and closes only psi_5 and the bit k mod 2 on y^2 = x^3 + x + 1 over F_751.
    - KR-RHO-13bf67 remains the generic-group floor. This hypothesis does not contradict it.

  citations:
    - ref: IDEA-20261006-ed9a14
      provenance: internal
      claim: >-
        Source prediction and sample size, carried into this hypothesis
        without a change of threshold.
      verified_by: ledger/proposals/IDEA-20261006-ed9a14.yaml
    - ref: RQ-TORS-8c7b79
      provenance: internal
      claim: >-
        A curve-only statistic is independent of k by construction. The
        proposal is in scope because psi_5 is evaluated at the public
        point kG.
      verified_by: ledger/questions/RQ-TORS-8c7b79.yaml
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        MOV and Frey-Rück reduce ECDLP to a finite-field discrete
        logarithm only when the embedding degree is small.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Small-order torsion and S_m symmetry shrink point-decomposition
        systems on extension fields. This hypothesis claims no such saving.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic algorithms for a prime-order discrete logarithm need
        Omega(sqrt(N)) group operations.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: Weil character-sum bound for elliptic curves
      provenance: recalled
      claim: >-
        A nontrivial character sum along E(F_p) is recalled to be
        O(deg sqrt(p)). This session did not open a source for that bound.
      verified_by: null
