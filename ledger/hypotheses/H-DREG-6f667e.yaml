  title: >-
    Eight pairs set the null threshold at 1 over sqrt(2), strictly above 0.707.
  statement: >-
    The lag-1 ratio of a series is the sum of adjacent centered products
    divided by the sum of squared deviations from the mean. A zero sum
    of squares leaves the ratio undefined. The level series 3, 2, 1, 0
    has ratio 1/4. The alternating series 1, 0, 1, 0 has ratio -3/4.
    The constant series 2, 2, 2, 2 is undefined. The null threshold for
    a measured series is 2 over the square root of the number of pairs,
    and fewer than 8 pairs is unmeasured. At 8 pairs the threshold is
    1 over sqrt(2), which is strictly above 707/1000 and strictly below
    708/1000, and strictly above both 2/3 and 1/2. At 9, 16, 25 and 36
    pairs the thresholds are 2/3, 1/2, 2/5 and 1/3. Five is coprime to
    12. Two and three are not.
  mechanism: >-
    The proposal compares a lag-1 autocorrelation of a degree increment
    with the null threshold 2 over the square root of the number of
    pairs, and it uses a known level series as a control. This contract
    checks those arithmetic gates. It does not walk an isogeny graph
    and it does not build a matrix.
