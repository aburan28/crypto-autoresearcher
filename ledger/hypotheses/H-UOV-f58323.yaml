hypothesis:
  id: H-UOV-f58323
  question_id: RQ-UOV-001
  added: '2026-08-25'
  derived_from_idea: IDEA-20260805-69af7c
  statement: >-
    UOV KEY RECOVERY IS A (TIME, MEMORY) PAIR AND THIS PROGRAM HAS BEEN PROJECTING IT TO ONE
    COORDINATE. Four claims that can each fail independently.
    (S1) THE UNCHARGED MEMORY. The dominant step of the intersection-style key-recovery attack is
    linear algebra on a Macaulay matrix whose column count S is a MEMORY requirement even in the
    most favourable sparse-iterative formulation, because a Wiedemann or Lanczos iteration must
    hold at least one dense vector of that length. The quoted security figure carries the time T
    and drops S.
    (S2) THE FRONTIER IS GENUINE. Hybridisation - guess g variables at cost q^g and solve the
    rest - makes T strictly increasing and S strictly decreasing in g, so the pair traces a real
    Pareto frontier rather than a single point.
    (S3) THE COMPARISON MOVES. MARGIN COMPRESSION, defined as (the time-only gap between the
    intersection attack and the polynomial-memory Kipnis-Shamir route) minus (the same gap once
    memory is capped at 2^60 field elements), is at least 20 bits at at least two of the four
    parameter tuples audited. If it is below 20 bits at every tuple, charging memory changes
    nothing at UOV's scale and the record's practical content collapses to S4.
    (S4) THE PARAMETER FLOOR. Because the Kipnis-Shamir route needs only polynomial memory, its
    cost is a hard floor on any honest security claim, so a parameter tuple claiming level lambda
    must satisfy (n - 2m - 1) log2 q + 4 log2 m >= lambda. This is a NECESSARY, not sufficient,
    condition on the parameters alone, computable in one line, and it catches mis-transcribed
    tuples before they propagate into a cost table.
    PRE-REGISTERED AND NEGATIVE - the ranking is predicted NOT to invert at any memory cap above
    2^30. An inversion is the more interesting outcome and would falsify the prediction.
  mechanism: >-
    Take the intersection-attack system as M quadratic equations in N variables over F_q. The
    published-style cost model computes the degree of regularity from the semi-regular Hilbert
    series, the time as a power of a binomial coefficient, and the linear-algebra step as
    operating on a matrix whose column count is that same binomial coefficient. S is therefore a
    memory requirement the time figure drops. Hybridisation restores a knob - guessing g of the N
    variables multiplies T by q^g and replaces N by N - g in BOTH formulas - so T and S propagate
    deterministically and the pair traces a frontier. Put the frontier beside the Kipnis-Shamir
    route, whose cost is a power of q times a polynomial cofactor at POLYNOMIAL memory. Neither
    dominates: one is memory-heavy and cheap in time, the other memory-light and expensive in
    time, so which one is 'the best known attack' is a function of a memory budget nobody states.
    The same arithmetic yields the parameter floor, because a polynomial-memory attack cannot be
    escaped by any memory budget at all. Charging memory in this direction makes the scheme look
    STRONGER, and a result that makes a scheme look stronger is still a result.
  assumptions:
  - >-
    The intersection system's shape (its equation and variable counts as functions of the UOV
    parameters) is inherited from a sibling derivation. If the published system differs, every
    table is recomputed with the corrected shape; the STRUCTURE of the argument is unaffected,
    because the Pareto-incomparability conclusion follows from the SHAPE of the two costs and not
    from any particular constant.
  - >-
    The degree of regularity is the semi-regular value. This is the SAME heuristic a sibling
    record measures at toy scale, inherited explicitly rather than silently, and the HYBRIDISED
    case is a strictly stronger assumption than the unhybridised one that no existing measurement
    covers.
  - >-
    Memory is charged as the number of Macaulay columns times one field element. This is the most
    ATTACKER-FAVOURABLE charge available - dense elimination would charge the square - and the
    attacker-favourable end is chosen deliberately, so that a conclusion of the form 'memory does
    not change the ranking' cannot be an artifact of a pessimistic charge.
  - >-
    Every parameter tuple used as an input is RECALLED-UNVERIFIED until a specification is read.
    The parent proposal demonstrates that recall has already failed once. No tuple is treated as
    authoritative and the floor test's whole purpose is to catch exactly that failure.
  - >-
    Field multiplications are not gate counts. Comparing a field-multiplication attack count
    against a gate-count security level is a unit error worth several bits and the conversion is
    stated wherever the two meet.
  - >-
    The area-time charge is the abstract circuit-model one. It says nothing about a distributed
    attack with communication costs, cache hierarchies or concrete hardware, and pretending to
    more precision than that would be false.
  proof_search_map:
    bottleneck: >-
      Whether the memory-charged RANKING of the two attack families differs from the time-only
      ranking at any admissible memory budget. Everything else is arithmetic. If the two rankings
      coincide at every budget and every tuple, charging memory is a change of units with zero
      comparator spread and this hypothesis says nothing.
    baseline_embedding:
      parameter_slice: >-
        g = 0, unbounded memory. At that slice the frontier degenerates to the single point the
        corpus currently quotes, and the memory-capped optimum must equal the unconstrained
        optimum at every cap above the unconstrained memory requirement.
      reproduction_check: >-
        A frozen regression fixture recomputing, in committed code, the Hilbert-series degree of
        regularity, the time and memory formulas, the Kipnis-Shamir figure and the parameter floor,
        and reproducing every figure the parent proposal quotes. ANY disagreement with the parent's
        scratchpad figures is resolved in favour of the in-harness computation and the parent record
        is superseded rather than defended.
    observation_collision:
      observable: >-
        The pair (log2 T, log2 S), and then the scalar log2 S + 2 log2 T under the area-time charge.
      distinct_preimage_search: >-
        GENUINELY LOSSY AT THE FIRST STEP - infinitely many attack instances share a pair, and
        everything about the algebra (field structure, oil space, the actual matrix, the success
        probability) is discarded. NOT lossy in the dangerous direction at the second step, and this
        is stated as a LIMITATION rather than a virtue - the area-time scalar is an order-preserving
        summary only under wire-delay assumptions this hypothesis does not verify, so THE PAIR is the
        primary reported object and the scalar is secondary, reported beside it and never instead
        of it.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        Carry the PAIR (log2 T, log2 S) as the tracked object for every UOV-family cost claim in this
        program, together with the memory-capped best time at a declared ladder of caps, rather than
        the time scalar the corpus currently carries.
      predicted_gain: >-
        No attack gain and none claimed. The gain is a cost CONVENTION under which the two families'
        relationship is stated correctly. Quantitatively the convention changes the reported gap
        between the two families by the margin-compression metric, which is the number this hypothesis
        exists to measure and which may turn out to be small.
    quantifier_order: >-
      FOR ALL four audited parameter tuples and FOR ALL memory caps in the declared ladder, THERE
      EXISTS a hybridisation parameter g achieving the reported best time under that cap; and FOR ALL
      caps above 2^30 the time-optimal FAMILY is the same one as at unbounded memory. The negation -
      THERE EXISTS a tuple and THERE EXISTS a cap above 2^30 at which the time-optimal family differs -
      is the rank inversion, and it is what the run is built to be able to report. Note the order: the
      witness g is allowed to depend on the tuple and the cap, but the CLAIMED INVARIANCE of the
      family is uniform over caps above 2^30, which is what makes it falsifiable by a single cap.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under this cost model, this memory charge, this degree-of-regularity convention and these
        parameter tuples, the two named attack families sit at the tabulated points of the (time,
        memory) plane, their gap compresses by the tabulated number of bits when memory is capped, and
        the time-optimal family does or does not change.' It can NEVER certify anything about the
        security of any deployed parameter set, about families not costed (signature-based and forgery
        routes, rectangular MinRank, quantum variants), or about actual hardware cost.
      nearby_object_control: >-
        A family whose memory requirement is KNOWN to be polynomial in the parameters - exhaustive
        search over the oil space. The hoped-for conclusion 'hybridisation traces a frontier' FAILS
        there by construction: its (T, S) curve must be a SINGLE POINT with S constant in g, and its
        memory-capped optimum must equal its unconstrained optimum at every cap above the polynomial
        floor. If the machinery reports a nontrivial frontier for that family, the machinery is
        MANUFACTURING frontiers and every other curve it produced is void.
    proof_obligations:
    - claim: 'A sparse-iterative linear-algebra step over a Macaulay matrix with C columns requires at least C field elements of working memory.'
      responsibility: memory
    - claim: 'T is strictly increasing and S strictly decreasing in the hybridisation parameter g.'
      responsibility: correctness
    - claim: 'The in-harness recomputation reproduces every figure quoted in the parent proposal.'
      responsibility: baseline
    - claim: 'The polynomial-memory family produces a single point, not a frontier.'
      responsibility: strictness
    - claim: 'The parameter floor is a necessary condition on the parameters alone.'
      responsibility: correctness
    - claim: 'Every conclusion is scoped to the two costed families, the declared conventions and the audited tuples; families not costed are enumerated with reasons.'
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: >-
    NULL AND REQUIRED TO BE. NO EXPONENT IS MOVED and this hypothesis refuses to pretend otherwise.
    What moves is WHICH exponent is called the baseline, and that is a convention decision this program
    has not made. A finding that UOV looks stronger under charged memory is NOT a security argument for
    UOV - it is a statement about two named attack families under one cost model, with every other family
    declared uncosted.
  heuristic_assumptions:
  - id: HEUR-UOV-B1
    formal_statement: >-
      The solving degree of the intersection system equals the semi-regular degree of regularity read
      off the standard Hilbert series at EVERY (M, N) appearing in the frontier table, INCLUDING at
      every hybridised N - g.
    random_model_justification: >-
      The semi-regularity assumption is the published model's own, and it asserts that a structured
      system behaves like a generic one of the same shape. The HYBRIDISED case is strictly stronger
      than the unhybridised one, because guessing g variables changes the structure of the system, and
      no existing measurement in this program covers it.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      A measured solving degree at any tabulated (M, N) differing from the semi-regular value. The
      frontier is reported as CONDITIONAL on this heuristic in every cell, and each cell records the
      degree of regularity it relies on, so a later correction can be applied without recomputing the
      whole table.
  - id: HEUR-UOV-B2
    formal_statement: >-
      Kipnis-Shamir style key recovery on UOV costs q^(n - 2m - 1) times a polynomial cofactor in m
      field operations, with memory polynomial in n.
    random_model_justification: >-
      The exponent's SHAPE is derivable - the attack succeeds when a random guess lands in a subspace of
      the right codimension, and n - 2m is the natural codimension in the relevant count. The exact
      offset and the cofactor are RECALLED-UNVERIFIED and must not be treated as derived.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      A specification read that states a different exponent or cofactor. Meanwhile every conclusion is
      reported at three candidate cofactor powers, and the only conclusion sensitive to the choice is one
      row of the parameter-floor table, whose sensitivity is reported explicitly rather than resolved by
      choosing the convenient cofactor.
  - id: HEUR-UOV-B3
    formal_statement: >-
      A sparse-iterative linear-algebra step over a Macaulay matrix with C columns requires at least C
      field elements of working memory.
    random_model_justification: >-
      Effectively definitional for Wiedemann or Lanczos - the iteration maintains at least one dense
      vector indexed by the columns. It is a LOWER bound on memory and therefore attacker-favourable,
      which makes a 'memory does not matter' conclusion safe and a 'memory matters' conclusion
      conservative.
    supporting_results: []
    validation_experiment_ids: []
    falsification_condition: >-
      No validation is needed for the lower bound. The dense upper bound C squared is reported beside it
      so the reader sees the whole interval; a conclusion that survives only at one end of that interval
      is reported as convention-dependent.
  structural_ingredients:
  - description: >-
      The area-time full-cost charging convention, under which a memory-heavy and a memory-light attack
      are compared on one scalar.
    citation: KN-TECH-035, KN-TECH-044, KN-TECH-050, KN-TECH-057.
    provenance: internal
    verified_by: 'knowledge/techniques/KN-TECH-035.md and siblings'
    role: the charging convention; catalogued in this corpus but never applied to a multivariate scheme
  - description: >-
      The round-3 UOV specification's own parameter tuples and its own attack table, needed to replace the
      recalled tuples and to check whether the premise that memory is uncharged is even true for UOV.
    citation: NIST round-3 UOV specification; NOT read in this program.
    provenance: recalled
    verified_by: null
    role: >-
      the authoritative source of the parameter tuples and, critically, the check on this hypothesis's own
      premise - if the specification already tabulates memory beside time, the audit's first part collapses
      to a reproduction and that must be reported as the primary finding
  predictions:
  - metric: >-
      rank_inversion_budget - the largest memory cap, in log2 field elements, at which the time-optimal
      attack family differs from the time-optimal family at unbounded memory
    direction: different
    minimum_effect: >-
      PREDICTED TO NOT EXIST, i.e. no inversion at any cap above 2^30. THE PRE-REGISTERED PREDICTION IS
      THE NEGATIVE ONE. An inversion at any cap above 2^30 falsifies it and is the more interesting
      outcome.
  - metric: >-
      margin_compression - (time-only gap between the two families) minus (gap at a 2^60 memory cap), in
      bits, at each of the four audited tuples
    direction: lower
    minimum_effect: >-
      At least 20 bits at at least two of the four tuples. Below 20 bits at EVERY tuple, the charge is a
      footnote and the practical content collapses to the parameter floor - which must then be reported
      plainly rather than dressed up.
  - metric: >-
      parameter_floor_violations - the number of candidate tuples failing (n - 2m - 1) log2 q + 4 log2 m
      >= lambda
    direction: higher
    minimum_effect: >-
      At least one among the recalled candidates, which is what demonstrates the test has teeth. The
      FORWARD prediction is that the FINAL transcribed tuples, once a specification is read, all PASS -
      and a transcribed tuple that fails is a TRANSCRIPTION ERROR, not a break, and must be treated as one.
  - metric: >-
      at2_ordering_stability - whether the area-time ordering of the two families agrees with the
      memory-capped time ordering at caps 2^30, 2^40, 2^50 and 2^60
    direction: different
    minimum_effect: >-
      Agreement at all four caps is the prediction. Any disagreement means the area-time scalar is not a
      faithful summary at these parameters and the PAIR must be carried unreduced into every dependent
      goal - a convention decision with real downstream cost, which is why it is pre-registered.
  - metric: >-
      frontier_slope - bits of time bought per bit of memory saved, over the hybridisation range, per tuple
    direction: different
    minimum_effect: >-
      Reported per tuple with its range. A slope that is not strictly positive contradicts the monotonicity
      of T and S in g and indicates a mis-implemented hybridisation search rather than a finding.
  test_boundary:
    instances:
    - >-
      Four candidate UOV parameter tuples, treated as RECALLED-UNVERIFIED throughout and used only to
      exercise the machinery, never as authoritative parameters.
    - >-
      The polynomial-memory null family (exhaustive oil-space search) at the same tuples.
    - >-
      The direct full-oil-space key-equation route at the same tuples, costed for the dominated_by check
      and reported as dominated.
    parameters:
      memory_caps: 'log2 field elements in {30, 40, 50, 60, 72}'
      linear_algebra_exponent: 'three values spanning the standard range'
      memory_charge_convention: 'sparse (columns) and dense (columns squared), both reported'
      kipnis_shamir_cofactor: 'three candidate polynomial powers in m'
      security_levels: 'the claimed level per tuple, for the parameter-floor test'
    implementation: >-
      Roughly 150 lines of standard-library Python - binomial coefficients, a Hilbert-series coefficient
      loop, a sweep over the hybridisation parameter, and a table writer. No solver, no field arithmetic,
      no seeds. Recorded through harness/runner.py.
    budget:
      wall_clock_seconds_per_run: 900
      total_cpu_hours: 0.5
      maximum_memory_gb: 2
      maximum_runs: 8
  distinguishable_outcomes:
  - >-
    O1 (CONVENTION MATTERS, RANKING HOLDS - PREDICTED). The recomputation reproduces the parent's figures,
    the null family yields a single point, the positive control reproduces its forced gap, margin_compression
    is at least 20 bits at at least two tuples, and no rank inversion occurs above a 2^30 cap. MEANING - the
    memory charge materially changes the reported GAP between the two families but not which is time-optimal;
    the program adopts the pair-plus-cap-ladder convention, and every dependent goal's Pareto comparison must
    state its memory budget.
  - >-
    O2 (CHARGE IS A FOOTNOTE). margin_compression is below 20 bits at every tuple. MEANING - charging memory
    changes nothing at UOV's scale, the frontier is real but uninteresting, and the record's practical content
    reduces to the parameter floor. This is the mirror-failure check firing, it is a real negative, and it
    must be reported plainly.
  - >-
    O3 (RANK INVERSION). The time-optimal family differs at some cap above 2^30. MEANING - the pre-registered
    negative is FALSIFIED; which attack is 'best known' is a function of a memory budget nobody states, and
    the dependent goals' baselines are wrong as written. This is the outcome most worth escalating.
  - >-
    O4 (MACHINERY VOID). The polynomial-memory null family is reported with a nontrivial frontier, or the
    positive control's forced gap is not reproduced. MEANING - the machinery manufactures frontiers or is
    broken; every curve it produced is void and NO negative conclusion about memory charging may be drawn
    from any other row.
  - >-
    O5 (PREMISE FALSE). The specification, once read, already tabulates memory beside time for every attack in
    its own table. MEANING - the premise that memory is uncharged is FALSE for UOV specifically, the audit's
    frontier part collapses to a reproduction, and THAT must be reported as the primary finding rather than
    buried. The parent names this as the single most likely way the whole record is moot.
  - >-
    O6 (PARENT ARITHMETIC WRONG). The in-harness recomputation disagrees with any figure the parent quotes.
    MEANING - the parent's numbers are wrong and are corrected by supersession before any use. The
    disagreement, not the table, is the deliverable of that run.
  - >-
    O7 (AREA-TIME UNFAITHFUL). The area-time ordering disagrees with the memory-capped time ordering at any
    cap. MEANING - the scalar summary is not order-preserving at these parameters, the pair must be carried
    unreduced into every dependent goal, and that is a convention decision with real downstream cost.
  falsification_conditions:
  - >-
    margin_compression below 20 bits at all four tuples - S3 is false and the charge is a footnote.
  - >-
    A rank inversion at any cap above 2^30 - the pre-registered negative prediction is falsified.
  - >-
    The polynomial-memory null family is reported with a nontrivial frontier - the machinery is void.
  - >-
    The positive control's forced gap is not reproduced - nothing may be concluded from any row.
  - >-
    The in-harness recomputation disagrees with any figure the parent quotes - the parent's numbers are wrong.
  - >-
    The specification states memory alongside time for every attack in its own table - S1's premise is false
    for UOV and the audit is a reproduction.
  interpretation_limits:
  - >-
    No attack is proposed, no exponent moves, and nothing here is evidence about the security of any deployed
    parameter set. The output is a COST CONVENTION and a table computed under it.
  - >-
    The conclusions are conditional on the semi-regular degree of regularity, which a sibling record measures
    at toy scale only. If that heuristic fails, the degrees fall, the memory falls with them, and the whole
    frontier moves - so this hypothesis must be REISSUED after that measurement, never merged into it.
  - >-
    A finding that UOV looks stronger under charged memory is NOT a security argument for UOV. It is a
    statement about two named families under one cost model, with every other family declared uncosted and
    enumerated.
  - >-
    The parameter floor is NECESSARY, not sufficient. A tuple that passes it is not thereby a correct
    transcription, and the test can only tell us which recalled candidates are certainly wrong.
  - >-
    Area-time is a circuit-model charge and says nothing about a distributed attack with communication costs.
    Not modelled, and declared not modelled.
  prior_evidence_refs:
  - RQ-UOV-001
  - KN-TECH-035
  - KN-TECH-044
  - KN-TECH-050
  - KN-TECH-057
  - GOAL-ICEX-001
  status: proposed
  proposed_by: coordinator
  owner: coordinator
