hypothesis:
  id: H-MTBK-001
  question_id: RQ-ECDLP-002
  source_proposal: IDEA-20260805-0cd03f
  status: proposed
  statement: >-
    For toy prime-field curves with factor base F of size B ~ p^b (b in
    {0.4, 0.5, 0.6}) and Semaev decomposition arity m in {3,4,5}, applying the
    BKK sparse-check speedup (KN-FIND-c7d31e, beta = 2/(m+1) factor on
    decomposition-search cost) to the multi-target index-calculus pipeline of
    H-MTIC-001 compresses BOTH the relation-collection channel S_rel and the
    per-target descent channel T_desc by beta, so that the measured multi-target
    crossover K* satisfies K*(BKK)/K*(std) = beta*(1-t)/(1-t*beta) with
    s = S_rel/sqrt(N), t = T_desc/sqrt(N). In particular, in the rescue window
    t in [1, (m+1)/2) where standard IC has K* infinite (per-target descent
    alone does not beat rho), the BKK version yields a FINITE K* — the unique
    pre-registered strengthening over H-MTIC-001.
  mechanism: >-
    The BKK group-law factorization (KN-FIND-c7d31e) types a candidate m-tuple
    sum in factor beta = 2/(m+1) fewer membership tests than the naive
    enumeration, because the group law correlates which index subsets can
    appear. That factor applies identically to harvesting attempts (relation
    collection) and to each target's descent attempts (both enumerate F^m sums),
    and therefore enters both s and t. Multi-target amortization shares S_rel
    over K targets, so K* solves S_rel + K*T_desc < K*sqrt(N); with BKK this
    inequality is satisfied for smaller K exactly when 1 - t*beta > 0, i.e.
    t < (m+1)/2.
  assumptions:
    - A1: BKK factor holds at toy scale for the factor-base x-threshold
          construction used (EV-BKK/EV-BKKMV evidence base).
    - A2: relation and descent instances in the multi-target framework are
          target-independent (non-interference control, EXP-MTIC-001).
    - A3: "yield is non-degenerate: B^m/N in (0.05, 0.8) per cell."
  proof_search_map:
    not_applicable_reason: >-
      Experiment-driven mechanism claim (measurement crossover), not a
      proof-oriented theorem: the theoretical prediction is the algebraic
      crossover formula, and the claim's truth is settled by measurement.
  heuristic_assumptions:
    - id: HEUR-MT-BKK-001
      formal_statement: >-
        For the deterministic toy curves, the BKK factor applies equally to
        relation-collection and descent channels, with no interaction with the
        target count k.
      random_model_justification: >-
        BKK theorem is rigorous at the group-algebra level (KN-FIND-c7d31e);
        the residual assumption is channel equality, i.e. that descent
        attempts have the same typed-decomposition cost structure as harvest
        attempts. Empirical cross-check via the single-target cross-check
        control.
      supporting_results:
        - KN-FIND-c7d31e
        - KN-FIND-2a8b7e
      validation_experiment_ids:
        - EXP-MTIC-001
        - EXP-SEMAEV-001
        - EXP-SEMAEV-002
      falsification_condition: >-
        Measured R = K*(BKK)/K*(std) diverges from the algebraic formula by
        >25% relative, or rescue-window cells fail to produce a finite K*.
  asymptotic_claim:
    problem: multi-target prime-field ECDLP (K targets, shared factor base)
    prior_best: "K*sqrt(N) per target baseline; K* crossover per H-MTIC-001"
    time_exponent: "1/2 (Perrier rho per target)"
    claim_kind: constant_factor
  structural_ingredients:
    - BKK group-algebra factorization speedup (KN-FIND-c7d31e) applied in the m-ary sum enumeration.
  falsification_criteria: >-
    In the BKK-enabled implementation, computed on the same instances with the
    flagged no-BKK path as null control. Criterion 1: median R_measured within
    25% relative of R_theory on completed cells. Criterion 2: in rescue cells,
    K*(BKK) is finite where the standard run reports infinite.
  status_history:
    - event: proposed
      at: '2026-08-05'
      by: coordinator
      note: Contract drafted (TASK-20260805-007), pending approval and EXP allocation.
    - event: claims_scope_corrected
      at: '2026-08-06'
      by: coordinator
      note: >-
        DEC-20260806-26c0e8 supersedes the rescue-window prediction: the
        corridor is empty at toy sizes and the measured channel ratio stays
        ~1.0-1.8x. H-MTBK-001 stays proposed; its falsifiable content is now
        the full-check ratio vs 2^(m-1) per AMEND-001.
    - event: independent_review_accepted
      at: '2026-08-06'
      by: coordinator
      note: >-
        DEC-20260806-bba4bf accepts the TASK-20260806-688acb independent
        review (CONCUR_WITH_OBJECTIONS), corrects the corridor derivation to
        the hypothesis-model window (beta*B^(m-1), 64/39/39, empty), and
        records the empirical falsification of the toy rescue at the live
        window cell (B=16, m=3, N=1045; descent ratio 1.37-1.46). Rescue-
        window falsification clause superseded. Still proposed.