hypothesis:
  id: H-SSIQ-90e07b
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  source_idea_ids:
    - IDEA-20260805-250e50
    - IDEA-20260805-e7ee4a

  statement: >-
    SCOPE: the archived p^{1/3+o(1)} algorithm of
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, its threshold-generalised
    form, and a closed pre-registered list of poly-time-computable screens on
    supersingular j-invariants, measured on the four in-session-built
    2-isogeny graphs at p = 2437, 3889, 5737, 7333 (N = 203, 324, 478, 611)
    already committed under RUN-SSIQ-a85692-b. CLAIM TIER toy for every
    measured quantity, theory tier for the identity. NO ALGORITHM IS PROPOSED,
    NO EXPONENT IS CLAIMED TO BE ATTAINED, AND NO SCREEN IS EXHIBITED.

    THE HYPOTHESIS HAS TWO HALVES, ONE DERIVABLE AND ONE MEASURABLE, AND THEY
    ARE STATED SEPARATELY SO A FAILURE OF ONE DOES NOT CARRY THE OTHER.

    (H-A1, DERIVABLE, ZERO COMPUTE) Running Algorithm 2 of the frozen source at
    an arbitrary degree threshold T = p^theta with X = (BT)^{1/2}, and sampling
    curves through the source's own re-randomising walk, the total expected
    time exponent is exactly
      E(theta, s, gamma) = (1/2 - 3theta/2)_+ + max(gamma, theta - s),
    where p^{-s} is the fraction of curves admitted by a screen S evaluable in
    p^{gamma} whose recall on {delta_E <= T} is p^{-o(1)}, and the memory
    exponent is theta. THREE FORCED VALUES FIX THIS BEFORE ANY RUN:
    E(1/3, 0, 1/3) = 1/3 exactly (the incumbent, whose only delta-test is the
    list build itself); E(1/4, 0, 1/4) = 3/8 exactly, reproducing this
    campaign's committed reading in TASK-20260805-87e568's
    baseline_reproduction_check; and the generalised Lemma 3.4 must return
    X = B^{1/2}(p/2)^{1/6} at T = (p/2)^{1/3}, character for character the
    frozen source's line 167. The identity's minimum over the whole admissible
    region with a free exact screen is 1/5, attained at theta = 1/5.

    (H-A2, MEASURABLE, TOY TIER) Of the closed pre-registered list of screens
    below, NONE has selectivity exponent s bounded away from 0 with recall
    exponent indistinguishable from 0, at the achievable scale. This half is
    stated in the NEGATIVE direction deliberately: the interesting outcome is
    its falsification, and pre-registering the negative makes a positive
    finding cost something to reach rather than being read off a search over
    screens.

    THE DELIVERABLE IF H-A2 SURVIVES IS A CLOSED BRANCH WITH A NUMBER: the
    enumerated screen list, at N <= 611, with each screen's measured (s, recall)
    beside a matched null's, and the forward guidance naming what is not
    covered. THE DELIVERABLE IF H-A2 FALLS is a screen with s > 0 and
    gamma < 1/3, which by H-A1 puts the exponent strictly below 1/3 and routes
    immediately to AGENTS.md rule 12 review at max effort.

  mechanism: >-
    DERIVED IN-RECORD FROM THE FROZEN SOURCE. Line references are to
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and were checked in this
    session. Nothing below is re-derived from the campaign's prior work without
    credit, and the two places where it reproduces committed results are
    flagged as reproduction checks rather than as findings.

    STEP 1 -- LEMMA 3.4 IS THRESHOLD-GENERIC.
    Lemma 3.4 (line 160), proof at lines 177-185, assumes deg(phi) <=
    (p/2)^{1/3} from Theorem 1.5, sets X = B^{1/2}(p/2)^{1/6} (Algorithm 2
    step 1, line 167), and derives deg(eta) = deg(phi)/deg(psi) <=
    l_{k+1}(p/2)^{1/3}/X <= B(p/2)^{1/3}/(B^{1/2}(p/2)^{1/6}) = X.
    REPLACE the hypothesis by deg(phi) <= T and set X = (BT)^{1/2}. The same
    three-line chain gives deg(eta) <= B T / (BT)^{1/2} = (BT)^{1/2} = X.
    The remaining ingredients of the proof are untouched: cyclicity of psi and
    eta comes from minimality of phi, and chi = eta-hat^{(p)} has domain
    E^{(p^2)} = E. THE BOUND'S VALUE IS USED IN EXACTLY TWO PLACES AND BOTH ARE
    LINEAR IN IT. Setting T = (p/2)^{1/3} returns the source's own X, which is
    the first reproduction check.

    STEP 2 -- COST AND MEMORY OF ONE ATTEMPT AT THRESHOLD T.
    Lemma 3.2 (line 133): #L(E,X,B) <= Psi(X,B) X (log X + 2).
    Lemma 3.3 (line 154): construction cost Psi(X,B) X^{1+o(1)} B^{O(1)}.
    With B = p^{o(1)} (line 200) and Theorem 1.4's uniformity range,
    Psi(X,B) = X^{1+o(1)}, so cost = X^{2+o(1)} = (BT)^{1+o(1)} = p^{theta+o(1)}.
    The table IS the algorithm's state, so MEMORY = p^{theta+o(1)} as well; the
    two exponents are equal at every point of the identity and the memory one
    is never omitted.

    STEP 3 -- THE BASE RATE AND ITS ONE-SIDEDNESS.
    Write P(theta) = Pr[delta_E <= p^theta] for E uniform supersingular over
    F_{p^2}. This campaign's committed derivation D1 (EV-SSIQ-e43afd O-5,
    produced by TASK-20260805-87e568, independently confirmed by
    TASK-20260805-89a2e7) gives P(theta) << p^{3theta/2 - 1/2 + o(1)}, by
    counting optimal embeddings weighted by class number. A second and
    independent route, derived in IDEA-20260805-2d2c41: the governing lattice
    is rank 3 of determinant asymptotic to p (EV-SSIQ-e43afd O-6), and the
    ellipsoid count gives the same exponent 3/2 in T. THE TWO ROUTES AGREE ON
    THE EXPONENT, WHICH IS WHY IT IS TREATED AS STRUCTURAL. D1 IS AN UPPER
    BOUND ONLY, and the identity's draw-count term needs a matching lower
    bound; that gap is HEUR-SS-1 and it is the hypothesis's most exposed
    assumption, not a silent step.

    STEP 4 -- THE IDENTITY.
    Draw curves E' by the source's non-backtracking walk of length n = O(log p)
    (line 202-203, mixing per the source's [6, Lemma 14]); each draw costs
    p^{o(1)} plus the screen's p^{gamma}. Let r = Pr[S | delta <= T] be the
    recall and p^{-s} the admitted fraction.
      draws until a curve both passes S and has delta <= T:
        1/(r P) = p^{1/2 - 3theta/2 + o(1)} when r = p^{-o(1)};
      draw-stage cost exponent: gamma + 1/2 - 3theta/2;
      curves reaching the list stage: draws x p^{-s};
      list-stage cost exponent: 1/2 - 3theta/2 - s + theta;
      E = max of the two = (1/2 - 3theta/2) + max(gamma, theta - s),
    and the first term is 0 for theta >= 1/3 because Theorem 1.5 makes P = 1.

    STEP 5 -- WHAT IS FORCED, COMPUTED BEFORE ANY RUN.
      (i)   E(1/3, 0, 1/3) = 0 + max(1/3, 1/3) = 1/3. INCUMBENT REPRODUCED.
      (ii)  E(theta, 0, theta) = 1/2 - theta/2, whose value at theta = 1/4 is
            3/8. THIS CAMPAIGN'S COMMITTED READING REPRODUCED
            (TASK-20260805-87e568 baseline_reproduction_check, which states
            "total >> p^{1/2 - theta/2} ... p^{3/8} at theta = 1/4; theta = 1/3
            is the interior optimum of the method").
      (iii) Free exact screen (gamma = 0, s = 1/2 - 3theta/2):
            E = (1/2 - 3theta/2) + max(0, 5theta/2 - 1/2), minimised at
            theta = 1/5 with value 1/5. THE SCREEN FAMILY'S CEILING.
      (iv)  Break-even: with s = 0, E < 1/3 for some theta iff gamma < 1/3.
      (v)   E <= 1/4 iff theta >= 1/6 and max(gamma, theta - s) <= 3theta/2 -
            1/4. At theta = 1/4 that is gamma <= 1/8 with s = 1/8 (a perfect
            screen); at theta = 1/6 it is gamma = 0 with s >= 1/6. At
            theta = 1/3 the cell is VACUOUS because every curve satisfies
            delta_E <= p^{1/3}, so no screen can have both recall 1 and s > 0
            -- and recording that vacuity as part of the map, rather than
            discovering it later, is part of the derivation.

    STEP 6 -- WHY THIS IS NOT LEVER L2 IN NEW NOTATION. L2 restricts the LIST;
    the goal record's correction gives its generic exchange rate as e = 2 delta
    (worse than 1:1) with aligned restriction breaking even at 1/3 for every
    delta. The screen restricts the SAMPLE, before any list exists, and its
    exchange rate is different because the sampling stage and the list stage
    are charged separately in the identity. A restriction that shrinks the list
    must still contain both halves of the required split (hence the square);
    a screen must only retain the curve (hence no square). That asymmetry is
    the entire reason the two levers have different arithmetic, and a reviewer
    should attack it first.

    STEP 7 -- THE SCREEN LIST, CLOSED BEFORE ANY MEASUREMENT.
      S1  j in F_p. Exactly delta_E = 1. Selectivity s = 1/2 by the class
          number; recall on {delta <= T} = P(0)/P(theta), which is
          p^{-3theta/2} -- catastrophically low. Included because its numbers
          are forced and it calibrates the recall computation.
      S2  Tr(j) = j + j^p and Nm(j) = j^{1+p}, both in F_p: any threshold on
          these. gamma = 0. No mechanism links them to delta_E; included as a
          plausible-looking screen whose expected s is 0, i.e. a second null in
          all but name.
      S3  Phi_l(j, j^p) = 0 for l <= L. EXACT detector of "there is an
          l-isogeny E -> E^{(p)}", hence of delta_E | small. gamma = 2 lambda
          where L = p^{lambda}, since Phi_l has O(l^2) coefficients. Its recall
          is the graded control's forced value.
      S4  The number of l <= L with j^p in the l-neighbourhood of j, as an
          integer statistic rather than a bit. gamma = 2 lambda. This is the
          only candidate with a mechanism: it measures local conjugate-adjacency
          density, which is a coarse proxy for the lattice being skew.
      S5  Distance <= 1 in the 2-isogeny graph to the F_p locus, and more
          generally distance <= d. gamma = O(3^d). Included because it makes
          the descent branch and the screen branch commensurable: a
          distance-d screen IS a depth-d descent, and the identity prices it.
      S6  A random subset of the same size as each candidate. THE MATCHED NULL.
    NO SCREEN OUTSIDE THIS LIST MAY BE ADDED AFTER ANY MEASUREMENT IS SEEN.
    Adding one requires a versioned amendment with confirmatory_status
    exploratory_only.

  assumptions:
    - >-
      The frozen in-repo transcription faithfully reproduces the archived
      result at lines 133, 154, 160, 167, 177-185, 193-220. STEP 1 depends on
      the proof text at 177-185 in detail. Stage 0 of the experiment re-reads
      those lines and records the check; GD-6's standing repair (a pre-freeze
      review re-reads every cited prior artefact in full, not just its headline)
      applies with force.
    - >-
      Charging one attempt as p^{theta+o(1)} in time AND memory. The source
      charges one F_{p^2}-operation per table entry in its own Section 4.1 and
      calls that optimistic. The identity inherits that optimism symmetrically
      on both sides of every comparison, so it cancels in the exponent and does
      not cancel in any concrete figure -- and no concrete figure is computed
      here (SC-3).
    - >-
      Conditioning on a screen does not break the pull-back at line 206. It
      does not: the walk omega is known and invertible regardless of how E' was
      chosen. What conditioning CAN break is Heuristic 1, carried as HEUR-SS-2
      and owned by IDEA-20260805-2d2c41.
    - >-
      The committed delta_E labels at the four toy primes are the minimal degree
      of an isogeny E -> E^{(p)} in the same normalisation the source uses.
      RE-VERIFIED AGAINST compute_delta_e_v2.py BEFORE USE, not assumed: this
      campaign has already had one normalisation failure of exactly this shape
      (GD-6). A mismatch is an INVALIDATION, never a negative result.
    - >-
      Environment, measured in this session and recorded rather than assumed:
      numpy 2.4.6 imports; sympy does not (ModuleNotFoundError); no Sage and no
      Pari. Every stage of the paired experiment is therefore designed for pure
      Python plus numpy, and any stage needing quaternion arithmetic is an
      INFRASTRUCTURE REQUEST under AGENTS.md rule 5, not an experiment.

  proof_search_map:
    bottleneck: >-
      THE DELTA-TEST. In the archived algorithm the only way to learn whether a
      sampled curve E' admits a small isogeny to its conjugate is to build the
      list that would use it -- so the test costs exactly what it saves, and
      the exponent sits at the interior optimum 1/3 of a one-variable curve.
      Every route to a lower exponent through this architecture must break that
      coincidence. Removing this one step changes the cost function, not merely
      its constant, which is what makes it the bottleneck rather than a step.
    baseline_embedding:
      parameter_slice: >-
        (theta, s, gamma) = (1/3, 0, 1/3): threshold at the structural bound,
        no screen, delta-test by list build. This is the archived algorithm
        exactly, and the neighbouring slice (theta, 0, theta) is this
        campaign's own committed one-variable curve.
      reproduction_check: >-
        SYMBOLIC, and it is a GATE rather than a confirmation: the identity
        must return E = 1/3 at (1/3, 0, 1/3), E = 3/8 at (1/4, 0, 1/4), and the
        generalised Lemma 3.4 must return X = B^{1/2}(p/2)^{1/6} at
        T = (p/2)^{1/3}. All three are exact equalities against text and
        against a committed independent task report, not curves that resemble
        each other. Failure of any one stops the line at Stage 0.
    observation_collision:
      observable: >-
        The pair (admitted fraction p^{-s}, recall r) of a screen -- i.e. the
        2x2 contingency table between S(j) and [delta_j <= T].
      distinct_preimage_search: >-
        THE COLLISION IS THE HYPOTHESIS'S CENTRAL RISK AND IT IS SEARCHED FOR
        DIRECTLY. Two ground-truth objects on opposite sides of the claimed
        conclusion: (a) a genuine screen, which admits a p^{-s} fraction and
        retains almost all small-delta curves; (b) a RANDOM subset of the same
        size, which by construction retains exactly a p^{-s} fraction of them.
        These collide on the observable "admitted fraction" and are separated
        ONLY by recall. A candidate screen whose recall equals its admitted
        fraction is indistinguishable from the random subset and carries zero
        information -- so the matched null S6 is not decoration, it is the
        separating condition, and the reported statistic is the RATIO of
        recalls, never a recall alone.
        A SECOND COLLISION, on the other observable: the identity's value E
        depends on (theta, s, gamma) only, so two entirely different screens
        with the same triple are indistinguishable to it. That is intended --
        E is a cost, not an identification -- but it means E cannot be used to
        argue that a particular screen is the right one, only that some screen
        with that triple would suffice.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the algorithm's exponent" by the explicit function
          E(theta, s, gamma) on a three-dimensional admissible region, so that
          the question "can the exponent move" becomes the exact inequality
          max(gamma, theta - s) <= 3theta/2 - 1/4 with an encoding
          (the threshold generalisation of Lemma 3.4), a completeness
          obligation (Algorithm 2 at threshold T still succeeds whenever
          delta <= T and smooth), a soundness obligation (it never returns a
          wrong isogeny -- unchanged, since correctness is by construction),
          and a cost-loss obligation (the B^{O(1)} and walk factors, both
          p^{o(1)}).
        predicted_gain: >-
          Converts one unquantified lever into three measurable numbers and
          makes both a positive and a negative outcome reportable. The gain is
          to the search, not to the attacker: no exponent is claimed.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "the minimal isogeny E -> E^{(p)}
          is B-smooth and below the structural bound" to "SOME isogeny below the
          chosen threshold T is B-smooth", and prove a STRICT inward
          improvement in E rather than mere feasibility.
        predicted_gain: >-
          At theta = 1/3 the enlargement is worth exactly the multiplicity
          bound of IDEA-20260805-2d2c41, which is B^{3/2} = p^{o(1)} -- so it
          gives NO strict improvement, and recording that is the honest use of
          this transform. At theta < 1/3 the multiplicity is p^{3(theta-1/3)/2}
          < 1 and the enlargement is worth less still. THE TRANSFORM IS
          EVALUATED AND RETURNS NOTHING; it is listed because a proposal that
          only lists transforms that worked has not run the audit.
      - transform: observable_fiber
        proposed_object: >-
          Hold the screen's observable (admitted fraction) fixed and vary the
          forgotten structure (which curves are admitted). The intrinsic
          invariant proposed to distinguish a real screen from a random subset
          of the same size is the recall, and the graded family S3 at
          L/T in {1/8, 1/4, 1/2, 3/4} supplies four points where the recall is
          FORCED to (L/T)^{3/2} by the counting law.
        predicted_gain: >-
          If the measured recalls do not track the forced values, the counting
          law does not apply at the achievable scale and the identity's base-rate
          term is unusable there -- which fires at essentially zero compute and
          is the cheapest available refutation of the measurable half.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER, FOR H-A1: FOR ALL (theta, s, gamma) in the
      admissible region, FOR ALL sufficiently large p, THERE EXISTS an
      instantiation of Algorithm 3 with those parameters whose expected time
      exponent is E(theta, s, gamma). The witness (the instantiation) is
      allowed to depend on theta, s and gamma -- that is the point -- but NOT on
      the instance E, and not on p beyond the parameter choices. The screen S
      itself must be a FIXED family indexed by p, not chosen per instance: a
      screen allowed to depend on the input curve would be reading the answer.
      THE WEAKER ORDER -- FOR ALL instances THERE EXISTS a screen -- IS
      TRIVIALLY SATISFIABLE (take S = {that curve}) AND IS EXPLICITLY NOT
      CLAIMED AND NOT ADMISSIBLE AS A RESULT. This is the quantifier trap the
      audit is hunting and it is the one an enthusiastic reading of a measured
      screen would fall into.
      FOR H-A2: FOR ALL screens in the closed list of STEP 7, FOR ALL four toy
      primes, the measured s is indistinguishable from 0 or the recall is not
      p^{-o(1)}. Falsified by a single screen at three of four primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        H-A1 can certify, at most, a COST IDENTITY for one family of algorithms
        -- those that sample a curve, optionally screen it, and run a
        threshold-generalised Algorithm 2. It certifies nothing about
        algorithms that do not sample (a descent), nothing about lower bounds,
        and nothing about whether any screen exists. H-A2 can certify, at most,
        that a named list of screens has no measurable selectivity on four
        graphs of at most 611 vertices with real delta_E labels. IT CANNOT
        CLOSE LEVER L4 and no record may write it as if it could. In
        particular, an all-negative screen census is a scoped negative under
        rule 6 and its forward guidance is mandatory: screens using
        neighbourhoods of radius beyond the reachable d, screens using modular
        polynomials at degrees toy scale cannot reach, and the entire descent
        branch, all remain open.
      nearby_object_control: >-
        TWO, AND THE SECOND IS THE ONE THAT MATTERS.
        (1) THE STRUCTURE-FREE SURROGATE: a random subset of the same size as
        each candidate screen (S6). The method must FAIL to find selectivity
        there. This is the null and it can fail.
        (2) THE OBJECT WHERE THE HOPED-FOR CONCLUSION IS KNOWN FALSE: apply the
        same lattice-and-threshold reasoning to ORDINARY elliptic curves. There
        End(E) has rank 2, the analogous "criterion" log(det)/rank would predict
        a cost the ordinary isogeny problem demonstrably does not have, and the
        threshold identity's base-rate term has no analogue because there is no
        Theorem 1.5. THE METHOD MUST BE SEEN TO FAIL ON THE ORDINARY CASE. A
        version of this reasoning that appears to work equally well there has
        not identified the load-bearing structure -- which is the supersingular
        rank-3 trace-zero collapse -- and must be withdrawn. This control is
        shared with IDEA-20260805-e7ee4a's census and is stated once here.
    proof_obligations:
      - claim: >-
          Lemma 3.4's proof uses the bound (p/2)^{1/3} in exactly two places,
          both linear, so the threshold generalisation is sound.
        responsibility: correctness
      - claim: >-
          E(1/3, 0, 1/3) = 1/3, E(1/4, 0, 1/4) = 3/8, and X = B^{1/2}(p/2)^{1/6}
          at T = (p/2)^{1/3}.
        responsibility: baseline
      - claim: >-
          Memory exponent equals theta at every point of the identity, and the
          van Oorschot-Wiener position of one attempt is p^{3theta/2}/w^{1/2}.
        responsibility: memory
      - claim: >-
          P(theta) >= p^{3theta/2 - 1/2 - o(1)} (HEUR-SS-1). NOT ESTABLISHED;
          D1 gives the upper bound only.
        responsibility: success_probability
      - claim: >-
          Heuristic 1 survives conditioning on delta_E <= T (HEUR-SS-2). NOT
          ESTABLISHED; owned and tested by IDEA-20260805-2d2c41.
        responsibility: success_probability
      - claim: >-
          Each candidate screen's admitted fraction and recall are measured
          against a matched random subset of identical size, and the reported
          statistic is their ratio.
        responsibility: strictness
      - claim: >-
          The screen family is fixed before the instance; the per-instance
          quantifier order is not claimed.
        responsibility: scope
      - claim: >-
          A negative census closes the enumerated list at toy scale only, and
          the forward guidance names what remains.
        responsibility: scope
      - claim: >-
          Any candidate arising must return log deg alpha = (log p)^{O(1)}
          (goal condition SC-2). The threshold-generalised Algorithm 3 does:
          the output has degree p * deg(phi) * deg(omega)^2 with deg(phi) <= BT
          and deg(omega) = 2^{O(log p)}.
        responsibility: interface
    not_applicable_reason: null

  rerandomization: >-
    Inherited unchanged from the frozen source, and it is load-bearing for the
    identity's draw-count term. Algorithm 3 step 3 (line 202): a
    non-backtracking random walk of length n in the 2-isogeny graph, with n
    chosen so that E' is indistinguishable from uniform; the source cites [37]
    (Pizer) and the more explicit [6, Lemma 14] for n = O(log p), NEITHER OF
    WHICH THIS RECORD READ -- relayed via the frozen source. The solution is
    pulled back at line 206-207 as omega-hat o phi o phi o omega, and the
    pull-back is unaffected by screening because omega is known and invertible.
    IF THE MIXING BOUND IS WEAKER THAN RELAYED, the draws are not uniform, the
    base rate P(theta) is not the population rate, and the identity's first
    term changes; the experiment therefore measures the empirical delta_E
    distribution over WALK ENDPOINTS as well as over the full vertex set, and
    reports both.

  asymptotic_claim: null
  asymptotic_claim_note: >-
    DELIBERATELY NULL AND REQUIRED TO BE. No complexity improvement is claimed.
    The identity is a cost accounting for a family of algorithms whose only
    currently-instantiable member is the archived one, at exponent 1/3. The
    values 1/5 and 1/4 appearing in the statement are CONDITIONS ON A SCREEN
    THAT DOES NOT EXIST and are not achieved exponents. sota_delta is zero on
    every attack axis; dominated_by is not applicable because no Pareto point
    is claimed. IF a screen were exhibited with s > 0 and gamma < 1/3, THAT
    would be an exponent claim and would be routed to review-breakthrough at
    max effort under AGENTS.md rule 12 before any record asserted it.

  heuristic_assumptions:
    - id: HEUR-SS-1
      formal_statement: >-
        THERE EXISTS c > 0 such that FOR ALL theta in (0, 1/3) and FOR ALL
        sufficiently large p, Pr_{E uniform supersingular over F_{p^2}}
        [delta_E <= p^theta] >= c p^{3theta/2 - 1/2 - o(1)}.
      random_model_justification: >-
        The count of curves with a small isogeny to their conjugate is a
        first-moment count of optimal embeddings weighted by class number
        (D1), and the same exponent arises from counting lattice points in a
        ternary ellipsoid of determinant asymptotic to p. A first-moment count
        is tight when the counted events do not concentrate; the standard
        expectation is that they do not, and the standard failure is that they
        do. THE UPPER BOUND IS COMMITTED (EV-SSIQ-e43afd O-5); THE LOWER BOUND
        IS THIS HEURISTIC AND IS NOT ESTABLISHED.
      supporting_results:
        - >-
          D1, as recorded in EV-SSIQ-e43afd O-5 and derived in
          coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/
          TASK-20260805-87e568/L1_ceiling_audit.md -- upper bound only.
        - >-
          AOV Conjecture 6.3 (delta surjective onto the positive integers) and
          the observation that every value 1 <= n <= delta(p) occurs at
          p = 234,959. NOT READ -- relayed via the BATCH-001 audit. Supports
          abundance of small values but is not a lower bound of the right shape.
      validation_experiment_ids: [EXP-SSIQ-a5c0cb]
      falsification_condition: >-
        The empirical exponent of Pr[delta_E <= T] in T, measured on the four
        committed graphs with an estimator first shown to recover a known
        exponent on a synthetic ternary form, falls outside [1.35, 1.65]. A
        measured exponent materially BELOW 3/2 makes the identity optimistic --
        every E value becomes a lower bound rather than a value -- and that must
        be stated on every citation rather than repaired by refitting.
    - id: HEUR-SS-2
      formal_statement: >-
        FOR ALL theta in (0, 1/3), for E uniform supersingular conditioned on
        delta_E <= p^theta, Pr[delta_E is B-smooth | delta_E <= p^theta] >=
        v^{-v(1+o(1))} with v = theta log p / log B, uniformly for
        (log p)^eps < v < (log p)^{1-eps}.
      random_model_justification: >-
        Heuristic 1 of the frozen source (line 69) makes the same assertion
        WITHOUT conditioning, justified by Theorem 1.4 (Canfield-Erdos-Pomerance,
        the source's [10], NOT READ -- relayed via the source's own statement).
        The conditioned version is NOT justified by that theorem: conditioning
        restricts to values of a ternary quadratic form and to lattice minima,
        neither of which is a uniform integer. Three separable effects (size,
