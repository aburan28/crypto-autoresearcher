  statement: >-
    The integer 134217727 has bit length 27. Its bits are twenty-seven 1s.
    Reaching it by doubling and adding uses 26 doublings and 26
    additions. Twenty-seven exceeds twenty-six by 1. Twenty-six equals
    twenty-six, so that gap is 0. The product of 27, 26, and 26 is
    18252. Their sum is 79. Two readings of the addition count are
    both 26, so that gap is 0 and their product is 676.
