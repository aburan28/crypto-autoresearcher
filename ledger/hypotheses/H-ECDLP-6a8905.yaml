  title: >-
    The integer 268435455 has 27 doublings and 27 additions
  statement: >-
    The integer 268435455 has bit length 28. Its bits are twenty-eight 1s.
    Reaching it by doubling and adding uses 27 doublings and 27
    additions. Twenty-eight exceeds twenty-seven by 1. Twenty-seven equals
    twenty-seven, so that gap is 0. The product of 28, 27, and 27 is
    20412. Their sum is 82. Two readings of the addition count are
    both 27, so that gap is 0 and their product is 729.
  mechanism: >-
    The proposal writes the counts 28, 27, and 27. This contract
    checks those integers. It does not add a curve point.
