hypothesis:
  id: H-ECDLP-df33b3
  question_id: RQ-ECDLP-4fcbd3
  source_idea: IDEA-20260930-a6491b
  derived_from_idea: IDEA-20260930-a6491b
  experiment_id: EXP-ECDLP-8197c0
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-ECDLP-4fcbd3 lists GOAL-ECDLP-001 and GOAL-CRYPTO-001. This design does
    not edit any goal head (including GOAL-ECDLP2M-001.yaml, which is out of
    write-scope). Attachment to a goal is a later record if a Coordinator
    so decides.
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-c8da17
  proposed_by: coordinator
  status: approved
  title: >-
    Bounded-degree subset restriction of a cheap coordinate predictor sits at
    the random-subset product floor on a Python-enumerable toy ladder, or else
    a concentration signature is localised against an equal-size null

  statement: >-
    SETTING (Python-bounded restatement of IDEA-20260930-a6491b). G = <P> of
    odd prime order N on a short-Weierstrass curve E/F_p generated in pure
    Python. A subset S of G is cheaply decidable at bounded degree when its
    indicator is an x-interval, an x-residue class, or a Boolean combination
    of those (class C(D, L) of IDEA-20260905-b6154d as recalled by the idea;
    this hypothesis does not reopen Bombieri / Kohel-Shparlinski). Write
    sigma = |S| / N. Restricted advantage eps_S(a) is the max over a != 0 of
    |sum_{W in S} g(W) chi_a(W)| / |S|. Product C(S) = eps_S^(-2) / sigma.
    Dual meters: the same C and spike on a seeded uniformly random subset of
    identical size, through the identical DFT code path.

    PYTHON BOUND (not a rewrite of the idea). The idea's minimal_test names
    field_bits in {16, 20, 24} and Magma-tabulated logs / length-2^24 FFTs
    via EXP-ECDLP-184fc4. That path is NOT a success path here. Stages 0-1
    freeze field_bits in {8, 10, 12} with Python point enumeration and
    numpy.fft (or O-IMPEDIMENT if numpy is absent). Transfer to {16,20,24}
    or cryptographic p is not claimed. Magma/Sage/AUXIN absence is never
    negative evidence.

    CLAIMS UNDER TEST at the approved cells:
    (S0) Derivation worksheet: the product inequality of the idea's (C)
    with toy constant c=1, the meeting point sigma* = 1/sqrt(N), the
    (D1) break at "N odd prime" and the (D2) break at "bounded degree",
    and the sigma=1 slice reducing to the whole-group square.
    (FLOOR) E-FLOOR: every bounded-degree family on the ladder has spike
    ratio to the equal-size random subset in [0.5, 2] at every approved
    size.
    (CONC) E-CONCENTRATION: some family has ratio >= 4 at every approved
    size with a non-decreasing trend in field_bits, and the null does not.
    (D1) Positive control: on one cyclic even-order curve of order 2q per
    size, the 2-descent kernel S = {Legendre(x - e) = +1} reads eps_S = 1
    at frequency q and sigma = 1/2, else the run is void (O-D1-MISS).
    (D2) Proves-too-much: the discrete-log interval is reported with
    kangaroo membership 2 sqrt(sigma N) and is not scored.

  mechanism: >-
    OBJECT FRAME from IDEA-20260930-a6491b. Representation R1: affine (x, y).
    Operation set: re-randomisation W |-> W + uP by known u, plus a frozen
    subset predicate and a frozen predictor. Class III (coordinate-dependent).
    Tracked object: (membership bit, restricted spectral magnitudes). Dual
    route: structured S versus a random subset of equal cardinality. The
    priced open number is C(S). Stage 0 is zero-curve arithmetic. Stage 1
    enumerates toy groups in Python and reads the ladder.

  assumptions:
    - N is an odd prime of large embedding degree on the prime-order arm; (D1) and (D2) are named failures of those hypotheses.
    - Hitting cost is charged as rejection sampling at 1/sigma; no Magma hitter is provisioned.
    - H1 (Weil-level restricted correlation) remains a recalled input of the idea; Stage 1 measurements stand on their own.
    - Python numpy.fft is the DFT engine; missing numpy is O-IMPEDIMENT, never a floor or concentration.

  proof_search_map:
    bottleneck: >-
      cost >= eps_S^(-2) / sigma >= sqrt(N) / polylog for every bounded-degree
      S on the Python-enumerable ladder.
    baseline_embedding:
      parameter_slice: >-
        S = G (sigma = 1): the inequality reduces to the whole-group square
        of IDEA-20260905-b6154d (C2). Frozen on Stage 0 as exact arithmetic
        with c = 1.
      reproduction_check: >-
        Symbolic: set sigma = 1 in (C) and recover cost >= N. Frozen fixture:
        (D1) must break at "N odd prime"; (D2) at "bounded degree".
    observation_collision:
      observable: >-
        The pair (sigma, restricted max spike) and C(S), per family and size,
        versus the equal-size random subset.
      distinct_preimage_search: >-
        A random subset and a bounded-degree subset of equal size are predicted
        to share the Gumbel level; a high thin-set spike is expected and is a
        signal only if it exceeds the null by a growing factor.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: Split hitting and information over Weil-informative and thin regimes.
        predicted_gain: Uniform floor sqrt(N) at c = 1; no exponent moves.
      - transform: boundary_lift
        proposed_object: >-
          High-degree Python family {popcount(x) < bits/2} as the first
          Magma-free stand-in for the idea's digit family (delta_KS of
          IDEA-20260930-8e3b75 is not computed here).
        predicted_gain: Floor extends, or a localiser is reported separately.
    quantifier_order: >-
      FOR ALL approved Python-generated E/F_p in field_bits {8,10,12}, FOR ALL
      odd-prime-order subgroups, FOR ALL frozen S on the ladder, FOR ALL frozen
      g in {1, Legendre(x), x mod 2, Legendre(y)}: the dual-meter ratio is
      compared to the frozen bands. Not claimed: all cheaply decidable S;
      Magma scale; cryptographic p.
    method_ceiling:
      strongest_certifiable_claim: >-
        Toy-tier measured ladder of C(S) versus random subsets at field_bits
        {8,10,12}, plus a Stage-0 derivation worksheet. Nothing about
        itineraries, delta_KS, or p >= 2^16.
      nearby_object_control: >-
        (D1) 2-descent kernel on even-order 2q; (D2) discrete-log interval.
    proof_obligations:
      - claim: Stage-0 meeting point of max(sigma N, 1/sigma) is sqrt(N) at sigma = 1/sqrt(N) for c = 1.
        responsibility: strictness
      - claim: Derivation breaks on (D1) at odd prime order and on (D2) at bounded degree.
        responsibility: baseline
      - claim: Dual meters share one DFT implementation.
        responsibility: correctness
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-1
      formal_statement: >-
        For 1_S, g in the frozen bounded-degree library and every a != 0,
        |sum_{W in S} g(W) chi_a(W)| <= sqrt(p) at the toy constant c = 1
        (the idea's H1 with j = D = L = 1). Recalled Weil-level shape; not
        a theorem in this program.
      random_model_justification: >-
        Square-root cancellation for a character sum on a genus-1 curve,
        as recalled by IDEA-20260905-b6154d; supporting papers not opened
        this session.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-8197c0
      falsification_condition: >-
        A bounded-degree family has spike ratio to the equal-size null >= 4
        at every approved size with a non-decreasing trend.
    - id: HEUR-2
      formal_statement: >-
        Below the meeting point, a bounded-degree subset behaves like a
        random subset of equal size on this toy panel. Transfer to
        cryptographic p is an extrapolation and is not claimed.
      random_model_justification: Gumbel law for the maximum of |S| unit phases over N frequencies.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-8197c0
      falsification_condition: Thin-half ratios leave [0.5, 2] at every size with a slope that grows in log p.

  structural_ingredients:
    - description: Generic-group lower bound Omega(sqrt N) covers equality-only algorithms; this floor is a different mechanism on coordinate subsets.
      citation: knowledge/frontiers/ecdlp
      provenance: internal
      verified_by: coordinator, IDEA-20260930-a6491b nearest row KR-RHO-13bf67 read 2026-10-03
      role: adjacent generic bound
    - description: Interval DLP / kangaroo constants price nearby object (D2).
      citation: KR-RHO-898783
      provenance: internal
      verified_by: coordinator, idea prior_art.nearest read 2026-10-03
      role: nearby-object membership cost

  reduction_chain:
    core_problem: restricted-advantage times hitting-cost product on bounded-degree subsets
    corollaries: []

  predictions:
    - metric: (D1)/(D2) break steps on Stage 0
      direction: different
      minimum_effect: Odd-prime-order step on (D1); bounded-degree step on (D2).
    - metric: spike ratio A(S)/A(null) on the x-interval, residue, and popcount families
      direction: different
      minimum_effect: >-
        O-FLOOR iff every ratio in [0.5, 2] at every size; O-CONCENTRATION iff
        some family has ratio >= 4 at every size with non-decreasing trend and
        the null does not; O-INCONCLUSIVE otherwise.
    - metric: D1 eps_S at frequency q
      direction: same
      minimum_effect: Exactly 1 at sigma = 1/2; else O-D1-MISS (void).

  test_boundary:
    instances:
      - one prime-order short-Weierstrass curve per field_bits in {8, 10, 12}
      - one cyclic even-order curve of order 2q per size (D1)
    parameters:
      field_bits: [8, 10, 12]
      curve_seeds:
        8: 2026100308
        10: 2026100310
        12: 2026100312
      d1_seeds:
        8: 2026101308
        10: 2026101310
        12: 2026101312
      weil_c: 1
      ratio_floor_lo: 0.5
      ratio_floor_hi: 2.0
      ratio_concentration: 4.0
    implementation: experiments/EXP-ECDLP-8197c0/implementation/run.py (pure Python + optional numpy.fft)
    budget:
      maximum_runs: 3
      maximum_memory_gb: 2
      maximum_workers: 1

  falsification_conditions:
    - O-FLOOR is falsified iff some subset family has spike ratio to the null >= 4 at every approved size with a non-decreasing trend.
    - O-CONCENTRATION is falsified iff every family has ratio <= 2 at every approved size.
    - Stage-0 derivation going through on (D1) or (D2) voids the worksheet.
    - D1 control missed: run void (AGENTS.md rule 3), not a mathematical negative.

  interpretation_limits:
    - Toy tier field_bits {8,10,12} only. No transfer to the idea's {16,20,24} Magma panel or to cryptographic p.
    - Recalled Weil bound of b6154d is not support (AGENTS.md rule 9); Stage-1 numbers are measurements.
    - No exponent moves. A concentration signature is a localiser, not an attack.
    - High-degree itineraries (IDEA-20260905-9c4f0c) and delta_KS (IDEA-20260930-8e3b75) remain undesigned.
    - Magma/Sage/AUXIN/Bedrock are not success paths.

  dominated_by: >-
    n/a (ceiling measurement). TIME: rho 0.886 sqrt(N) (KR-RHO-fb88e6). MEMORY: rho O(1).
  sota_delta:
    time: Zero on every ECDLP axis. A toy obstruction ladder, not a cost improvement.
    memory: Zero.
    data_queries: Not applicable.
