hypothesis:
  id: H-ECDLP-f6a43a
  question_id: RQ-ECDLP-bc7a54
  source_idea: IDEA-20261003-cd1903
  derived_from_idea: IDEA-20261003-cd1903
  experiment_id: EXP-ECDLP-02bd1c
  goal_id: null
  goal_ids: []
  goal_ids_note: >-
    RQ-ECDLP-bc7a54 copies GOAL-ECDLP-001 from its record. This design does not edit any
    goal head (including GOAL-ECDLP2M-001.yaml, which is out of write-scope).
    Attachment to a goal is a later record if a Coordinator so decides.
  specified_at: '2026-10-04'
  approved_at: '2026-10-04'
  authorised_by: DEC-20261004-7129c9
  proposed_by: coordinator
  status: approved
  title: >-
    On a Python-enumerable toy ladder, the maximal agreement A(1) of the
    elliptic-curve log-graph with degree-1 polynomial graphs sits inside the
    relabelled generic-group null (E-RANDOM / H1), or else a power/Weil-tight
    incidence signature is localised

  statement: >-
    SETTING (Stages 0-1 of IDEA-20261003-cd1903). Let E/F_p be ordinary of prime order n,
    g a generator, Gamma_E = {(x(Q), log_g Q)} the log-graph. Model M_deg
    charges a polynomial omega F by its degree. Lemma V: a TOTAL F is its own
    chi by one scalar multiplication, so the total-omega question reduces to
    A(d) = max_{deg F <= d} |D_F|. Theorem W (Kohel-Shparlinski plus
    completion; d=1 from retrieved Ahmadi-Shparlinski Lemma 1): N(F) <=
    2 + K_d sqrt(p)(1 + ln(pn)). Regime (i) total polylog omega is closed at
    alpha = 1/2; regime (ii) promised-input omega within budget is excluded
    only for alpha > 3/4; the window (1/2, 3/4] containing n^{1/3} is held
    open by the sqrt(p) error term alone. Heuristic H1 (random-graph
    incidences) predicts A(d) ~ (d+1) ln p / ln((d+1) ln p) and would close
    the window for every alpha > 1/2.

    CLAIMS UNDER TEST at the approved cells:
    (S0) Zero-run worksheet: Lemma V, Theorem W with audit constant K=8,
    regime arithmetic, H1 first-moment table on bits {10..16}, retrieval
    status for the general Kohel-Shparlinski bound.
    (A1) Exact A(1) census by anchor-slope on the frozen ladder, versus
    NULL-1 relabelled Z/n with x-pairing preserved, with planted-line
    positives, j=0 orbit expected-value control, and anomalous ceiling arm
    when a CM toy is found.
    (RAND) E-RANDOM: A(1) inside the NULL-1 band; fitted theta < 0.1.
    (POWER) E-POWER: theta >= 0.15 or NULL-1 exceedances at >=2 sizes on
    >=25 percent of curves.
    (WEIL) E-WEIL-TIGHT: A(1) >= 0.05 sqrt(p) ln p at the two largest sizes.

  mechanism: >-
    OBJECT FRAME from IDEA-20261003-cd1903. Representation R1: affine x-coordinate with
    integer lifts. Operation set: degree-bounded polynomial evaluation on x
    (not the translation action). Class III (coordinate-dependent). Tracked
    object: incidences of Gamma_E with degree-1 graphs. Priced open number:
    A(1). Stage 0 is zero-curve arithmetic. Stage 1 enumerates toys and reads
    the census against NULL-1.

  assumptions:
    - n is prime on the prime-order arm; the toy ladder enforces it.
    - Agreement is equality of integer lifts; values of F in [n, p) cannot agree when p > n.
    - Omega cost in M_deg is degree (dense evaluation); SLP-cheap omegas are outside the model and are the anomalous ceiling.
    - Recalled general Kohel-Shparlinski for d >= 2 is not support until retrieved; Stage 1 is the d = 1 census.
    - Python enumeration is the engine; timeouts/crashes are O-IMPEDIMENT, never negative evidence.

  proof_search_map:
    bottleneck: >-
      The sqrt(p) error term of Theorem W. Closing (1/2, 3/4] needs A(d) <<
      d sqrt(p) polylog, or H1.
    baseline_embedding:
      parameter_slice: >-
        d = 0: A(0) = 1 exactly (log injective). Relabelled generic group:
        same completion gives order-sqrt(n) log -- Theorem W is generic-strength.
      reproduction_check: >-
        Frozen fixture: A(0)=1 and A(1)>=2; planted affine agreement on NULL-1
        recovers at least the planted size; j=0 orbit count (n-1)/6 when a j=0
        curve is present.
    observation_collision:
      observable: A(1) and the argmax line with its agreement list.
      distinct_preimage_search: >-
        Anomalous and random curves are predicted to share the same A(1) band;
        A(1) identifies polynomial-omega existence, not curve hardness.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: total polynomial omega -> D_F via Lemma V -> incidence count -> mixed character sum.
        predicted_gain: Regime (i) closed at 1/2; regime (ii) closed above 3/4.
      - transform: observable_fiber
        proposed_object: Hold A(1) fixed; vary random / j=0 / anomalous / NULL-1.
        predicted_gain: Locates the model's blind spot by measurement.
    quantifier_order: >-
      Theorem W: FOR ALL ordinary prime-order E/F_p, FOR ALL d>=1, FOR ALL F of
      degree d: N(F) <= 2 + K_d sqrt(p)(1+ln pn). H1: FOR ALL tested E on the
      ladder, max_F N(F) sits at the first-moment scale. Witness F may depend on
      E; it may not depend on the target.
    method_ceiling:
      strongest_certifiable_claim: >-
        Toy-tier A(1) census deciding E-RANDOM vs E-POWER/E-WEIL-TIGHT on the
        frozen ladder, with Theorem W audit and planted/j0/anomalous controls.
        Nothing outside M_deg; no hardness claim about a curve.
      nearby_object_control: >-
        Anomalous curve: cheap SLP omega exists; model predicted blind; Theorem W
        forces high interpolation degree.
    proof_obligations:
      - claim: Lemma V exact.
        responsibility: correctness
      - claim: Theorem W for d=1 from retrieved Lemma 1 with completion constant.
        responsibility: correctness
      - claim: Stage-1 A(1) census O(n^2) modular ops per curve.
        responsibility: runtime
      - claim: Nothing claimed outside M_deg; anomalous arm states the ceiling.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For every ordinary prime-order E/F_p and every d with 1 <= d <= p^{1/2},
        A(d) <= (1+eps)(d+1) ln p / ln((d+1) ln p) + O(1).
      random_model_justification: >-
        Rigorous half: Theorem W. Classical half: first-moment count over
        p^{d+1} polynomials with Poisson(~1) incidences.
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-02bd1c
      falsification_condition: >-
        A(1) exceeds NULL-1 99th percentile plus 3 at two or more sizes on
        >=25 percent of curves, or fitted theta >= 0.15.
    - id: H2
      formal_statement: >-
        General Kohel-Shparlinski holds for F o x with K_d <= 4d+2 (recalled).
      random_model_justification: Weil-Bombieri character sums along a curve with an isogeny character twist (recalled).
      supporting_results: []
      validation_experiment_ids:
        - EXP-ECDLP-02bd1c
      falsification_condition: >-
        Stage-0 retrieval fails and d>=2 claims remain conditional; Stage-1
        Theorem W audit ratio > 1 voids the run.

  structural_ingredients:
    - description: Ahmadi-Shparlinski Lemma 1 restates Kohel-Shparlinski Corollary 1 for d=1 mixed sums.
      citation: 'arXiv:1302.4210'
      provenance: retrieved
      verified_by: idea-generator via IDEA-20261003-cd1903 citations
      role: d=1 input to Theorem W
    - description: Generic Omega(sqrt n) floor; this record gives a coordinate-reading bound for polynomial omegas.
      citation: KR-RHO-13bf67
      provenance: internal
      verified_by: coordinator, idea prior_art read 2026-10-04
      role: adjacent generic bound
    - description: Anomalous curves solved by p-adic lifting; used as ceiling control.
      citation: KR-RHO-53c89f
      provenance: internal
      verified_by: coordinator, idea prior_art read 2026-10-04
      role: nearby-object ceiling

  reduction_chain:
    core_problem: maximal agreement of the log-graph with degree-d polynomial graphs in M_deg
    corollaries: []

  predictions:
    - metric: Stage-0 Lemma V / Theorem W / H1 table self-checks
      direction: same
      minimum_effect: All Stage-0 self-checks pass before any enumeration.
    - metric: A(1) per curve versus NULL-1 band on bits {10..16}
      direction: different
      minimum_effect: >-
        O-E-RANDOM iff inside NULL-1 band with theta < 0.1; O-E-POWER iff
        theta>=0.15 or exceedances; O-E-WEIL-TIGHT iff A(1) >= 0.05 sqrt(p) ln p
        at the two largest sizes.
    - metric: Planted positive recovery on NULL-1
      direction: higher
      minimum_effect: A(1) >= planted size at every planted cell; else O-ARTIFACT.
    - metric: Theorem W audit ratio
      direction: lower
      minimum_effect: max N(F)/(2+8 sqrt(p)(1+ln pn)) <= 1; else void.

  test_boundary:
    instances:
      - seeded random prime-order short-Weierstrass toys on field_bits {10..16}
      - NULL-1 relabelled pairing-preserving draws per size
      - planted affine positives on NULL-1
      - j=0 expected-orbit control; anomalous ceiling when a CM toy is found
    parameters:
      field_bits: [10, 11, 12, 13, 14, 15, 16]
      curves_per_size_declared: 20
      null1_per_size_declared: 20
      executed_taper_note: >-
        Pure-Python wall-clock disclosure (not a silent threshold change): full
        20/20 on bits<=12; 10/10 on bits 13-14; 4/4 on bits 15-16. Declared
        scientific counts remain 20/20; incomplete cells relative to the
        declaration are labelled in artifacts and may yield O-IMPEDIMENT if the
        discriminator cannot be read.
      weil_K: 8
      planted_fracs: [0.5, 0.6, 0.7]
      seeds_base: 2026100400
    implementation: experiments/EXP-ECDLP-02bd1c/implementation/run.py
    budget:
      maximum_runs: 3
      maximum_memory_gb: 4
      maximum_workers: 1

  falsification_conditions:
    - E-RANDOM is falsified iff A(1) exceeds NULL-1 99th percentile plus 3 at two or more sizes on >=25 percent of curves, or theta >= 0.15.
    - E-WEIL-TIGHT is falsified iff A(1) < 0.01 sqrt(p) ln p at every size.
    - Theorem W audit ratio > 1 voids the run (code or cited bound).
    - Planted positive miss or broken identity calibration voids the instrument (O-ARTIFACT).
    - Timeouts/crashes are O-IMPEDIMENT, never mathematical negatives.

  interpretation_limits:
    - Claim tier toy for every measurement; Theorem W is derivation-level conditional on the cited bound.
    - Nothing outside M_deg is constrained; SLP-cheap omegas escape by construction.
    - E-RANDOM supports H1 at p <= 2^16 only; extrapolation to cryptographic p is labelled extrapolation.
    - Recalled Lange-Winterhof / general Kohel-Shparlinski are not support (AGENTS.md rule 9).
    - No exponent-moving attack is proposed or tested.
    - Magma/Sage/AUXIN/Bedrock are not success paths.

  dominated_by: >-
    n/a (model lower-bound measurement). Checked against KR-RHO-13bf67,
    KR-RHO-ea34b8, KR-RHO-53c89f and the idea's prior_art rows; no attack axis occupied.
  sota_delta:
    time: Zero on every ECDLP attack axis. Model delta is the regime split and A(1) census.
    memory: Zero.
    data_queries: Not applicable.
