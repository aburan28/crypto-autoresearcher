# H-SSI-07fa48
# Depth-two label collision on the F_p supersingular Phi_2 graph.
# Curve-graph contract. H-SSI-89db95 remains the integer slice.
hypothesis:
  id: H-SSI-07fa48
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  source_idea: IDEA-20261004-e4c461
  experiment_id: EXP-SSI-c34de8
  specified_at: '2026-10-05'
  status: approved
  proposed_by: coordinator
  approved_by_decision: DEC-20261005-f1f75a
  title: >-
    On the toy Phi_2 graph the starting supersingular j determines
    the depth-two endpoint only when that graph is a single loop
  statement: >-
    Let S_7 = {6}, S_11 = {0, 1}, and S_19 = {7, 18}, the
    supersingular j-invariants in F_p found earlier for
    y^2 = x^3 + x. An edge joins distinct or equal elements j, j'
    of S_p when the classical modular polynomial Phi_2(j, j') is
    0 mod p. A design-session expansion, which is not a run, gives
    neighbors 6 to {6}; 0 to {1}; 1 to {0, 1}; 7 to {7, 18};
    18 to {7, 18}. Depth-two walks on distinct neighbor j-invariants
    number 1, 5, and 8. Starts whose walks reach more than one
    endpoint number 0, 2, and 2. Unordered pairs of walks with the
    same start and different endpoints number 0, 3, and 8.
    Publishing the walk makes the endpoint agree with the graph.
  mechanism: >-
    The unlabeled public view is the starting j. A hidden labeling
    is a depth-two walk. When two walks from the same start end at
    different j-invariants, no function of the start alone matches
    both endpoints. Publishing the intermediate and final j removes
    that ambiguity. At p=7 the only walk is the loop at 6, so the
    start does determine the endpoint.
  assumptions:
    - Edges are pairs inside S_p with Phi_2 congruent to 0 mod p.
    - Walks use distinct neighbor j-invariants. Edge multiplicity is not a second label.
    - Depth is exactly two.
  proof_search_map:
    bottleneck: >-
      Whether the starting j separates depth-two endpoints.
    baseline_embedding:
      parameter_slice: >-
        The F_p Phi_2 graph on S_p. This is not a CSIDH class-group
        action and not SiGamal encryption. H-SSI-89db95 checked the
        integers 2 and 1 and did not build this graph.
      reproduction_check: >-
        The monomial formula for Phi_2 and the expanded cubic in the
        second variable must yield the same neighbor sets.
    observation_collision:
      observable: >-
        The endpoint j of a depth-two walk, together with the start.
      distinct_preimage_search: >-
        Two walks from one start with different endpoints.
    constructive_transforms:
      - transform: auxiliary_information_exposure
        proposed_object: the published walk (start, middle, end)
        predicted_gain: >-
          Drops endpoint disagreements to 0. No attack exponent.
    quantifier_order: >-
      For each prime, every start in S_p, then every neighbor, then
      every neighbor of that neighbor.
    method_ceiling:
      strongest_certifiable_claim: >-
        An endpoint collision on this finite graph, or its absence
        at p=7. Not an impossibility theorem for isogeny PKE.
      nearby_object_control: >-
        The single loop at p=7. Ambiguous starts are 0.
    proof_obligations:
      - claim: Neighbor sets match the statement
        responsibility: correctness
      - claim: Ambiguous starts are 0, 2, and 2
        responsibility: size
      - claim: A published walk has endpoint disagreement 0
        responsibility: interface
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        Collisions on these three graphs do not transfer to a
        cryptographic endomorphism-ring PKE.
      random_model_justification: The walks are enumerated in full.
      supporting_results: []
      validation_experiment_ids:
        - EXP-SSI-c34de8
      falsification_condition: >-
        A later record that treats these walk counts as a break of a
        published scheme.
  structural_ingredients:
    - description: >-
        IDEA-20261004-e4c461 asks for a depth-two public-view
        collision. This hypothesis tests that shape on the Phi_2
        graph of three supersingular sets.
      citation: ledger/proposals/IDEA-20261004-e4c461.yaml
      provenance: internal
      verified_by: coordinator session 2026-10-05, proposal file read
      role: source claim
  reduction_chain:
    core_problem: Endpoint ambiguity of unlabeled depth-two walks.
    corollaries: []
  predictions:
    - metric: ambiguous_starts
      direction: equal
      minimum_effect: "0 at p=7, 2 at p=11, 2 at p=19"
    - metric: conflicting_walk_pairs
      direction: equal
      minimum_effect: "0 at p=7, 3 at p=11, 8 at p=19"
    - metric: oriented_disagreements
      direction: equal
      minimum_effect: "0 at each prime"
  test_boundary:
    instances:
      - Phi_2 graph on S_p for p in {7, 11, 19}
    parameters:
      primes: [7, 11, 19]
      depth: 2
    implementation: >-
      Two evaluations of Phi_2, the monomial form and the cubic
      expansion in the second variable.
    budget:
      maximum_runs: 6
      maximum_memory_gb: 2
  falsification_conditions:
    - >-
      Both Phi_2 evaluations agree and an ambiguous-start count or
      a conflicting-pair count differs from the statement.
    - >-
      Both evaluations agree and a published walk disagrees with
      its graph endpoint.
  interpretation_limits:
    - H-SSI-89db95 is unchanged. This record does not replace it.
    - Not a CSIDH action, not SiGamal, and not a theorem about all PKE.
    - A timeout, a crash, or a formula disagreement is not evidence against the statement.
  dominated_by:
    verdict: not_applicable
    justification: A finite graph audit. No exponent is claimed.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Records ambiguous-start counts 0, 2, 2 and conflicting walk
      pairs 0, 3, 8.
  status_note: >-
    Approved with EXP-SSI-c34de8 by DEC-20261005-f1f75a under the
    standing user authorization of 2026-09-06.
