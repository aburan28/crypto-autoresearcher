  title: >-
    A factor-base meter row is accepted only when its class is one of four
    frozen names, its scope tier is present, its four controls are named,
    and the identity calibration is L = 0, b = 1.
  statement: >-
    The parser accepts a row whose class is algebraic_predicate,
    power_residue_coset, oracle_described, or target_dependent_ball, whose
    scope_tier is toy, whose controls are identity, random_label,
    generic_relabelled_Z_nZ, and matched_random, and whose identity reading
    is L = 0 and b = 1. It rejects a missing scope_tier, a class
    coordinate_dependent, and an identity reading with L different from 0.
  mechanism: >-
    The proposal's instrument claim starts from a frozen grammar and
    hard-wired controls. This contract tests only that gate. It does not
    solve a system and does not reproduce EV-FB-001.
  assumptions: []
  proof_search_map:
    bottleneck: The accept/reject decision on four hand-written fixtures.
    baseline_embedding:
      parameter_slice: >-
        The four class names and the identity calibration L = 0, b = 1, as
        written in IDEA-20260921-da1896.
      reproduction_check: >-
        Two parsers. One walks required keys. The other matches a declared
        schema. They must agree on all four fixtures.
    observation_collision:
      observable: accept or reject, plus the rejection reason.
      distinct_preimage_search: >-
        A good row and three single-defect mutants. Accepting any mutant
        falsifies the gate.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: One accepted fixture and three rejected mutants.
        predicted_gain: A parse gate. No attack cost.
    quantifier_order: >-
      For the one good fixture, accept. For each mutant, reject. The class
      list is closed: a fifth class name is a reject.
    method_ceiling:
      strongest_certifiable_claim: >-
        The parser gate. Not a yield, not an L/b measurement of a real
        factor base, and not a reproduction of EV-FB-001.
      nearby_object_control: >-
        The identity fixture with L set to 1. Accepting it invalidates the
        calibration check.
    proof_obligations:
      - claim: The good fixture is accepted.
        responsibility: correctness
      - claim: The three mutants are rejected.
        responsibility: scope
      - claim: No solve is performed.
        responsibility: scope
