  title: >-
    On two toy fields the Boolean degree of S_3 is 3 and the Boolean degree
    of x1*S_3 is also 3, while a constant third argument drops the first
    degree to 2.
  statement: >-
    Let S_3(x1, x2, x3) = (x1*x2 + x1*x3 + x2*x3)^2 + x1*x2*x3 + 1. On
    F_2^3 with modulus x^3+x+1 and on F_2^4 with modulus x^4+x+1, the
    maximum algebraic-normal-form degree of the polynomial-basis
    coordinates of S_3(x1, x2, x3) is 3, and the same degree for
    x1*S_3(x1, x2, x3) is 3. The sum of the separate degrees is 4. If
    x3 is any constant field element, those two degrees are 2 and 3, and
    their separate-degree sum is 3.
  mechanism: >-
    Semaev's first-fall argument for the three-variable summation
    polynomial is a Boolean degree drop: multiplying by x1 does not
    reach degree 4. With one argument constant the same multiplication
    does not drop below the separate-degree sum. This contract checks
    those degrees. It does not run F4.
