  title: >-
    sqrt(2/ln 2) lies strictly above 1.6986 and strictly below 1.6987.
  statement: >-
    On the ladder n in {12, 15, 18, 21, 24} with m = 3, the Boolean
    count N = n(m-1) is 24, 30, 36, 42 and 48. Each of those n is
    divisible by 3, so ceil(n/3) is 4, 5, 6, 7 and 8. At pi = 1 and
    cap 4 the per-attempt power is N to the 4 omega, the same
    monomial as (n(m-1)) to the 4 omega. That identity does not
    reopen a table of concrete estimates. The closed form
    sqrt(2/ln 2) is strictly above 16986/10000 and strictly below
    16987/10000. The comparison uses the series for ln 2, the
    partial sum through k = 20, and the tail bound 1/(21 * 2^20).
    Raising the cap from 4 to 6 multiplies that power by N to the
    2 omega. At N = 24 the factor is 331776 when omega = 2 and
    191102976 when omega = 3. The one-unit power at omega = 2 is
    576, which is not the two-unit factor. The kill exponent n/10
    is strictly below sqrt(n ln n) at each of the five n, because
    the harmonic sum from 2 through n exceeds n/100 and that sum
    is a lower bound for ln n. The squared ratio n/(100 ln n) is
    strictly larger at n = 24 than at n = 12, and both squared
    ratios stay strictly below 1. At n = 24 the threshold
    2 to the power -12/5 is strictly above 947/5000 and strictly
    below 379/2000, and it is strictly above 6/100.
  mechanism: >-
    The proposal replaces an unproved degree assumption by a
    measured yield and a deterministic per-attempt power. This
    contract checks the accounting identities on the toy ladder.
    It does not build a Macaulay matrix and it does not sample a
    yield.
