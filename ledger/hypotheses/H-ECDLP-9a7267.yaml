hypothesis:
  id: H-ECDLP-9a7267
  question_id: RQ-CLGRP-66ab7f
  title: >-
    The low-order assumption is a findability claim, not an existence claim:
    small-order elements usually exist, l = 2 has an exact structural shortcut
    that the deployed prime-discriminant convention removes outright, and for
    odd l no route below whole-group computation is known, so the assumption's
    content is an exponent map with a derived rank threshold that sits far
    above any constructed rank
  statement: >-
    Source proposal IDEA-20260818-0b933f (RQ-CLGRP-66ab7f, class
    representation). FIELD NOTE, RECORDED BECAUSE THE DISPATCHING HANDOFF
    MISLABELS IT. The object is the class group of an imaginary quadratic
    order as deployed in hidden-order-group constructions. There is no elliptic
    curve and no ECDLP instance anywhere in this hypothesis; the ECDLP area
    token in its identifier is an allocation artifact.
    (A) SMALL-ORDER ELEMENTS USUALLY EXIST. Under Cohen-Lenstra the probability
    that l divides h(D) is 1 minus the product over i at least 1 of
    (1 - l^(-i)), which is 0.4399 for l = 3, 0.2396 for l = 5 and 0.1632 for
    l = 7. A deployed class group very probably CONTAINS an element of order 3,
    so the assumption's content is entirely about findability.
    (B) l = 2 IS THE ONLY CASE WITH A STRUCTURAL SHORTCUT AND THE DEPLOYED
    CONVENTION REMOVES IT EXACTLY. Genus theory gives 2-rank equal to t - 1 for
    a fundamental discriminant with t prime divisors. For D = -p with p prime
    and p congruent to 3 mod 4, t = 1, the 2-rank is 0, h(D) is odd and the
    2-torsion is EMPTY rather than merely hard to search. For p congruent to
    1 mod 4 the fundamental discriminant is -4p with t = 2, the 2-rank is 1,
    and an ambiguous form of order exactly 2 is written down in polynomial time
    from the public factorisation.
    (C) FOR ODD l THERE IS NO KNOWN SHORTCUT. The cheapest known routes are to
    compute the whole group and take g^(h/l), or random search at about
    h/l^r group operations for l-rank r. Random search beats the generic
    |D|^(1/4) route only when l^r exceeds |D|^(1/4), which at 1024 bits and
    l = 3 requires 3-rank above 1024/(4 log_2 3) = 161.5, and at 2048 bits
    above 323.0; for l = 5 at 1024 bits the threshold is
    1024/(4 log_2 5) = 110.2.
    (D) A UNIT ERROR IN THE SOURCE PROPOSAL, FOUND AND CORRECTED HERE, BECAUSE
    BOTH SIDES OF A RATIO MUST BE CHARGED IN THE SAME UNIT. The source states
    that beating index calculus at 1024 bits requires 3^r greater than
    2^407.5, i.e. r greater than 257.1, while describing the index-calculus
    exponent as 104.5/512. Those two statements are inconsistent. Recomputing:
    L[1/2, 3/sqrt(8)] at |D| = 2^1024 has log_2 equal to
    1.06066 times sqrt(709.78 times 6.5649) / ln 2 = 104.5, so the
    index-calculus cost is 2^104.5 and its EXPONENT IN log_2|D| is 104.5/1024
    = 0.1021, not 104.5/512. With 0.1021 the condition
    1/2 - r log l / log|D| below 0.1021 gives r log_2 3 above 0.39795 times
    1024 = 407.5, hence r above 257.1, which reproduces the source's own
    number. The stated denominator 512 would instead give r above 191.2. THE
    THRESHOLD 257.1 IS CORRECT AND THE DENOMINATOR 512 IS WRONG; the
    correction is recorded rather than silently applied.
    (E) THE ONE UNTIMED ROUTE. Nontrivial 3-torsion classes correspond to cubic
    fields of discriminant D, reachable by enumerating reduced binary cubic
    forms in a box of side about |D|^(1/4), giving about |D|^(3/4) candidate
    triples. Nobody in this program has timed it and this hypothesis predicts
    it loses.
    NOTHING HERE IS A BREAK OF ANY DEPLOYED CONSTRUCTION. Every statement is
    about the group Cl(D), per the question's own claim_tier_ceiling, which
    this coordinator session read verbatim.
  mechanism: >-
    The tracked object is Cl(D)[l] with its rank r as the free parameter. The
    l = 2 shortcut exists because the 2-torsion is determined by PUBLIC data,
    namely the discriminant's factorisation, through an explicit isomorphism
    between Cl(D)/Cl(D)^2 and a character group indexed by the prime divisors
    of D. There is no odd-l analogue: no character group indexed by the primes
    dividing D computes Cl(D)[3], and Cohen-Lenstra predicts the odd part
    behaves as if random. That asymmetry, and not the size of l, is what makes
    l = 2 the only structurally attackable case, and it is measurable as the
    gap between two certification costs.
  assumptions:
    - >-
      Full class group computation is feasible in seconds at 2^60 to 2^80,
      which is what makes a 2000-discriminant rank census possible at all. This
      is an assumption about available software, not a mathematical claim, and
      a failure to meet it is a feasibility outcome under AGENTS.md rule 5.
    - >-
      The deployed family under study is D = -p with p prime and p congruent to
      3 mod 4. Cohen-Lenstra is applied to that sub-family BY CONVENTION, and
      the calibration null measures the convention rather than assuming it.
    - >-
      The recalled record that the largest constructed imaginary quadratic
      3-ranks are single-digit is UNVERIFIED. Verifying or correcting it is a
      named deliverable, and the margin statement depends on it.
  proof_search_map:
    bottleneck: >-
      Producing ONE nontrivial element of Cl(D)[l] without computing h(D).
      Every known odd-l route computes h(D) first; removing that dependency is
      exactly what would separate the low-order assumption from the
      order-computation assumption.
    baseline_embedding:
      parameter_slice: >-
        l = 2 with t at least 2 prime divisors, where the answer is known to be
        polynomial from the public factorisation, so the exponent map must
        return 0 there.
      reproduction_check: >-
        Frozen fixture with BOTH directions asserted. For composite fundamental
        discriminants with known factorisations the pipeline must construct an
        element of order exactly 2 in time independent of |D| beyond arithmetic
        cost; for D = -p with p congruent to 3 mod 4 it must return "no such
        element" BY GENUS-THEORY CERTIFICATE rather than by exhausting a search
        budget. A pipeline that cannot reproduce the classical l = 2 case
        cannot be trusted on l = 3.
    observation_collision:
      observable: >-
        A nontrivial element g with g^l equal to the identity, i.e. the
        certificate the low-order assumption is about.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE SHARPEST POINT IN THIS RECORD. The
        observable does not distinguish a group whose l-torsion is trivial from
        a group whose l-torsion is nontrivial but whose elements were not found
        within budget. For l = 2 the collision is BROKEN by genus theory, which
        certifies absence in polynomial time. For odd l it is broken by nothing
        known: there is no cheap certificate that Cl(D)[3] is trivial short of
        computing h(D). That asymmetry between checkable-for-2 and
        uncheckable-for-3 is the statement about the assumption that this
        corpus does not contain.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "search Cl(D) for an l-torsion element" by "enumerate reduced
          binary cubic forms of discriminant D" at l = 3, moving from a group
          search to an exact Diophantine condition on four bounded integers.
        predicted_gain: >-
          PREDICTED NEGATIVE at about |D|^(3/4) pointwise against |D|^(1/4) for
          the generic route, i.e. the transform loses by half an exponent. It
          is proposed because the loss has never been measured here and because
          the same enumeration is cheap in AMORTIZED form across a sweep.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "no l-torsion element found" fixed and vary the
          hidden structure between rank 0 and rank at least 1 with a failed
          search, seeking a cheap intrinsic invariant that separates them for
          odd l.
        predicted_gain: >-
          A cheap negative certificate for the low-order assumption would be a
          DEFENDER-SIDE tool, not an attack. None is known; naming the search
          is the deliverable and finding one is not expected.
    quantifier_order: >-
      THE LOW-ORDER ASSUMPTION, WITH EXPLICIT ORDER. FOR ALL probabilistic
      polynomial-time A, FOR ALL sufficiently large security parameters, FOR
      the discriminant D sampled by the declared procedure, the probability
      over A's coins that A(D) outputs (g, l) with g not the identity, l
      greater than 1 and bounded, and g^l the identity, is negligible. NOTE
      WHAT MOVES: D is sampled once and is public for the lifetime of the
      deployment, so an adversary may depend on D through unbounded
      preprocessing. The gap between polynomial-time in the security parameter
      and years of preprocessing against one fixed public D is a quantifier
      gap, not a constant. This record RECORDS it and does not exploit it or
      claim it is exploitable.
    method_ceiling:
      strongest_certifiable_claim: >-
        Over the tested discriminants and the enumerated routes, the measured
        cost of producing an l-torsion element matches the derived exponent map
        and no route cheaper than whole-group computation was found for odd l.
        It CANNOT certify that no such route exists and no record under this
        hypothesis may say so.
      nearby_object_control: >-
        Apply the identical machinery to l = 2 with t at least 2, where a cheap
        route DOES exist and the conclusion "no route cheaper than whole-group
        computation" MUST FAIL. If the machinery reports l = 2 as hard it is
        not detecting structural shortcuts and its odd-l negative is worthless.
        THIS CONTROL IS FREE AND BLOCKING.
    proof_obligations:
      - claim: 2-rank equals t - 1, and D = -p with p congruent to 3 mod 4 gives
          2-rank 0 and odd h.
        responsibility: baseline
      - claim: Random search costs about h/l^r group operations.
        responsibility: runtime
      - claim: l^r above |D|^(1/4) is the threshold against the generic route.
        responsibility: strictness
      - claim: The thresholds 161.5, 323.0 and 110.2 are correct, and 257.1 is
          correct against an index-calculus exponent of 104.5/1024 rather than
          104.5/512.
        responsibility: feasibility
      - claim: The Cohen-Lenstra divisibility probabilities are 0.4399, 0.2396
          and 0.1632.
        responsibility: success_probability
      - claim: Pointwise cubic-form enumeration costs about |D|^(3/4).
        responsibility: runtime
      - claim: Claims are scoped to the tested discriminants and routes only.
        responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: null
    prior_best: null
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: null
    claim_kind: null
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        For imaginary quadratic fields with fundamental discriminant D, the odd
        part of Cl(D) is distributed as a random finite abelian group weighted
        inversely by the size of its automorphism group; in particular the
        probability that l divides h(D) is 1 minus the product over i at least
        1 of (1 - l^(-i)), uniformly over the family D = -p with p prime and p
        congruent to 3 mod 4 at the tested sizes.
      random_model_justification: >-
        The Cohen-Lenstra measure on finite abelian groups, applied to the odd
        part, with the average size of the 3-torsion known unconditionally from
        Davenport-Heilbronn as the rigorous companion.
      supporting_results:
        - ref: Cohen-Lenstra heuristics for class groups of imaginary quadratic fields
          provenance: recalled
          claim: >-
            The divisibility probability formula. The formula is recalled; the
            arithmetic 0.439874, 0.239600 and 0.163180 was recomputed from it
            in the source session and is reproducible in three lines.
          verified_by: null
        - ref: >-
            Ellenberg and Venkatesh, reflection principles and bounds for class
            group torsion
          provenance: recalled
          claim: >-
            Bounds for the 3-torsion part of class groups of quadratic fields.
            PROVENANCE RESOLVED BY THIS COORDINATOR SESSION. The source
            proposal labelled this entry `retrieved` while its own verified_by
            text states it is search-summary level, was NOT primary-read, and
            that the authoring agent referred the label to the Coordinator. It
            does not meet the `retrieved` bar, so it is carried here as
            `recalled` with verified_by null. It may not discharge this
            heuristic or back any decision until an agent that opened the
            source says so in a new record.
          verified_by: null
      validation_experiment_ids: [EXP-ECDLP-d5228c]
      falsification_condition: >-
        The empirical frequency of l dividing h(D) deviates from the predicted
        value by more than 3 sigma at the declared sample size, for any l in
        {3, 5, 7}, or an l-rank above 3 is observed in a uniform sample.
    - id: HEUR-002
      formal_statement: >-
        The expected number of uniformly random group elements examined before
        finding a nontrivial element of Cl(D)[l] is h(D)/(l^r - 1) up to a
        factor 1 + o(1), and each examination costs O(log h) compositions.
      random_model_justification: >-
        Exact for a uniform sampler on a finite abelian group. The heuristic
        content is only that the sampler used, namely products of small prime
        forms, is close to uniform.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-d5228c]
      falsification_condition: >-
        Measured random-search cost on the structureless twin differs from the
        measured cost on the real class group beyond sampling error.
    - id: HEUR-003
      formal_statement: >-
        Products of O(log|D|) uniformly chosen prime forms of norm below the
        Bach bound are statistically close to uniform on Cl(D), so the
        random-search cost model applies.
      random_model_justification: >-
        Rapid mixing of random walks on the Arakelov class group under the
        Riemann hypothesis for Hecke L-functions.
      supporting_results:
        - ref: >-
            de Boer, Ducas, Pellet-Mary and Wesolowski, rapid mixing for random
            walks on the Arakelov class group
          provenance: recalled
          claim: >-
            A mixing-time bound for walks on the Arakelov class group under a
            Riemann hypothesis for Hecke L-functions. Pointer only. NOT
            primary-read for the imaginary quadratic specialisation and its
            constants are unchecked.
          verified_by: null
      validation_experiment_ids: [EXP-ECDLP-d5228c]
      falsification_condition: >-
        The distribution of walk endpoints over the computed group's cyclic
        decomposition deviates from uniform beyond sampling error at any tested
        walk length.
    - id: HEUR-004
      formal_statement: >-
        GRH holds, underwriting the Bach bound used by the sampler and the
        subexponential and |D|^(1/4) route costs used in the exponent map.
      random_model_justification: >-
        Unproved; unconditional analogues with worse exponents exist, so its
        contribution to the map is quantifiable rather than hidden.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-d5228c]
      falsification_condition: >-
        Not falsifiable here. Testable proxy: the computed h(D) must match the
        ERH-interval analytic estimate at every census discriminant.
  structural_ingredients:
    - description: >-
        The question's own ceiling on what may be claimed, namely measurement
        and extrapolation only, with no statement that a deployed parameter is
        adequate or inadequate.
      citation: RQ-CLGRP-66ab7f
      provenance: internal
      verified_by: >-
        coordinator, TASK-20260904-3baed3, read the claim_tier_ceiling field of
        ledger/questions/RQ-CLGRP-66ab7f.yaml verbatim
      role: binding scope ceiling on every conclusion under this hypothesis
    - description: >-
        Genus theory for binary quadratic forms, giving 2-rank equal to t - 1
        and ambiguous forms realising the 2-torsion.
      citation: Genus theory for binary quadratic forms
      provenance: recalled
      verified_by: null
      role: the l = 2 half of the exponent map and the exactness of the
        prime-discriminant countermeasure
    - description: >-
        The Hasse and Davenport-Heilbronn correspondence between 3-torsion
        classes and cubic fields, and Belabas's amortized cubic-field
        enumeration.
      citation: Hasse correspondence and Belabas cubic-field enumeration
      provenance: recalled
      verified_by: null
      role: the untimed route, and the amortized-versus-pointwise distinction
        this hypothesis exists to separate
  reduction_chain:
    core_problem: null
    corollaries: []
  predictions:
    - metric: empirical_frequency_of_l_dividing_h
      direction: different
      minimum_effect: >-
        Predicted 0.4399, 0.2396 and 0.1632 for l equal to 3, 5 and 7. BAND
        RECOMPUTED HERE AND WIDENED TO ITS OWN STATED RULE. At n = 2000 the
        binomial standard errors are 0.01110, 0.00954 and 0.00826, so 3 sigma
        is 0.0333, 0.0286 and 0.0248. The source proposal's plus or minus 0.025
        band for l = 3 is 2.25 sigma, which contradicts its own 3-sigma
        falsification rule and carries a 2.4 percent per-l false-alarm rate.
        The 3-sigma values above are used instead.
    - metric: fitted_exponent_of_pointwise_cubic_form_enumeration
      direction: different
      minimum_effect: >-
        Predicted 0.75 plus or minus 0.10 over the FEASIBLE ladder only. An
        exponent below 0.30 would mean the structural route beats the generic
        whole-group route; it is reported at that width and no wider, escalated
        to adversarial review, and explicitly NOT reported as a break.
    - metric: l_rank_distribution_and_maximum
      direction: different
      minimum_effect: >-
        Predicted rank 0 with probability about 0.56 and rank 1 with most of the
        remainder; maximum observed rank over 2000 samples predicted at most 3.
        An observed rank at least 6 in a uniform sample would contradict
        Cohen-Lenstra badly enough to be the report's headline.
    - metric: derived_rank_threshold_recomputed_symbolically
      direction: different
      minimum_effect: >-
        FORCED BY ARITHMETIC: 161.5 and 323.0 for l = 3 at 1024 and 2048 bits,
        110.2 for l = 5 at 1024 bits, and 257.1 for l = 3 at 1024 bits against
        index calculus AT AN EXPONENT OF 104.5/1024. The re-derivation must
        also report what the source proposal's stated denominator 512 would
        give, namely 191.2, so the correction is visible rather than silent.
    - metric: cost_of_certifying_absence_l_equals_2_versus_l_odd
      direction: different
      minimum_effect: >-
        Predicted polynomial for l = 2 by genus theory and no route below the
        minimum of the subexponential and |D|^(1/4) costs for odd l, an
        exponent gap of about 1/4 in the certification direction. A cheap odd-l
        absence certificate would be a DEFENDER-SIDE result of real value.
  test_boundary:
    instances:
      - at least 2000 prime discriminants D = -p with p congruent to 3 mod 4,
        at 2^60 to 2^80 where full class group computation is feasible
      - composite fundamental discriminants with t at least 2, for the l = 2
        positive null
      - a structureless black-box abelian group with matched invariant factors
      - route-race discriminants VERIFIED to have 3-rank at least 1
    parameters:
      l_values: [2, 3, 5, 7]
      census_sample_size: 2000
      route_race_sizes_bits: [32, 40, 48, 56]
      routes: [index_calculus_then_exponentiate, generic_structure_then_exponentiate,
        pointwise_reduced_binary_cubic_form_enumeration]
    implementation: >-
      Certified class group computation validated against known small
      discriminants, with operation counts reported alongside wall clock for
      every route.
    budget:
      wall_clock_seconds: 86400
      memory_gb: 8
      maximum_runs: 40
  falsification_conditions:
    - >-
      The l = 2 nearby-object control reports l = 2 as hard. The machinery does
      not detect structural shortcuts, its odd-l negative is worthless, and the
      hypothesis is void until the control passes.
    - >-
      The l = 2 negative null reports absence by budget exhaustion rather than
      by a genus-theory certificate. That is reporting an infrastructure
      outcome as a mathematical one, which AGENTS.md rule 5 forbids; the design
      must make the distinction machine-checkable before any odd-l result is
      recorded.
    - >-
      The empirical frequency of 3 dividing h deviates from 0.4399 by more than
      0.0333 at n = 2000. Either the sampler is biased or the tested family is
      not Cohen-Lenstra-generic, and the exponent map's rank distribution must
      be re-derived from the measured distribution.
    - >-
      The pointwise cubic-form route fits an exponent below 0.30 over the
      feasible ladder. SCOPED METHODOLOGICAL FINDING ONLY: it is a statement
      about Cl(D), not about any deployed system, and must be escalated to
      adversarial review before any wider phrasing is used.
    - >-
      The structureless twin's random-search cost differs from the real class
      group's beyond sampling error. The search is exploiting class-group
      arithmetic and the h/l^r model is not what is being measured.
    - >-
      A verified constructed imaginary quadratic 3-rank above 40 is found. The
      margin between constructible ranks and the derived threshold shrinks by
      more than an order of magnitude and the steering question becomes
      materially more urgent.
  interpretation_limits:
    - >-
      NOT AN ECDLP RECORD, NOT A CURVE RECORD. The object is Cl(D). The
      standing curve-free-null requirement is discharged BY CONSTRUCTION
      because no object here is a curve; the structure-attribution null that
      this design does require, and runs, is the black-box abelian twin with
      matched invariant factors.
    - >-
      Every statement is about the group Cl(D) and none is about any system
      that uses it, per RQ-CLGRP-66ab7f's claim_tier_ceiling, read verbatim by
      this coordinator session. No statement that a deployed parameter is
      adequate or inadequate may be derived here.
    - >-
      The rank thresholds at 1024, 2048 and 3072 bits are DERIVED from the cost
      model, not measured, and are not security estimates.
    - >-
      A negative for the cubic-form route closes exactly that route at exactly
      the tested sizes. It says nothing about the existence of a better
      pointwise l-torsion algorithm.
    - >-
      The l = 2 content is classical and confers no novelty; it is included
      only because the exponent map is incomplete without it.
    - >-
      Amortized and pointwise costs for the cubic-form route are different
      quantities in different units and are reported separately and never
      pooled. Conflating them would invert this record's conclusion.
  status: proposed
  proposed_by: idea-generator
