  statement: >
    Fix the exact weighted replay
    identity T = sum_v r(v)c(v) on a
    frozen two-child fork before any
    nested low-weight collision
    generator, Esser-May carry
    transducer, Semaev polynomial,
    factor-base, or P1553 recurrence
    is built. Stage 0 asserts only
    that on the frozen REAL DAG
    A→B→{C1,C2} with unit costs one
    has r=(1,1,1,1) and T=4 when the
    separator stores B, and that the
    nearby KF claim T_no_separator=4
    is false because replay gives
    r=(2,2,1,1) and T=6. NULL empty
    DAG rejected. Negative cost
    rejected. This is not a Semaev
    relation, not a rho beat.
    Stages 1+ stay unauthorized.
  mechanism: >
    IDEA-20260906-3493fe Stage 0 hard
    gate is the exact separator versus
    no-separator replay charge, derived
    from the frozen fork DAG alone.
    Stage 0 freezes that identity as
    exact tables. No nested LHW
    collision generator. No Esser-May
    transducer. No Semaev S_m. No
    P1553 recurrence. No factor-base.
    No Velu. This is a new
    GOAL-ECDLP-001 object after the
    20260825 leftover quartet was
    exhausted as Stage 0 objects
    (7efa27 already owned by
    H-PFDR-5b5c46). It is not Stage 1
    of EXP-ECDLP-166141 and not
    Stage 1 of this experiment.
  predictions:
