hypothesis:
  id: H-FROB-6774fb
  question_id: RQ-FROB-7d8dd4
  proposal_id: IDEA-20260918-9abf42
  source_idea_ids:
    - IDEA-20260918-9abf42
  goal_id: GOAL-FROB-6333a9
  added: '2026-09-22'
  title: >-
    The Frobenius-orbit factor base is available only on an arithmetic lattice
    of dimensions, its gain is exactly n and never more, and the two facts
    together decide it by a single inequality
  statement: >-
    Let E/F_q be ordinary and attacked over F_{q^n}, and let the factor base be
    the Gaudry/Diem family F_V = {P in E(F_{q^n}) : x(P) in V} for V an
    F_q-subspace of dimension l. Then (i) F_V is pi-stable, for pi(x,y) =
    (x^q, y^q), exactly when V is sigma-stable, and the sigma-stable subspaces
    are exactly the ideals of F_q[T]/(T^n - 1), so the attainable l are exactly
    the subset sums of the degrees of the irreducible factors of T^n - 1;
    (ii) sigma acts trivially on exactly one stable line, V = F_q, so the
    smallest USEFUL stable dimension is d = ord_n(q) when n is prime;
    (iii) for n an odd prime the number of pi-orbits on F_V is exactly
    f + (|F_V| - f)/n with f = #(E(F_q) affine points in F_V), so the orbit gain
    is exactly n asymptotically and never more; and therefore (iv) against the
    unconstrained optimum l* = ceil(n/m), stability forces l' = min{attainable
    faithful l >= l*} and the orbit trick is a net win if and only if
    q^(l' - l*) < n.
  mechanism: >-
    By the normal basis theorem F_{q^n} is free of rank one over
    R_n = F_q[T]/(T^n - 1) with T acting as sigma, so sigma-stable F_q-subspaces
    correspond exactly to ideals of R_n, i.e. to monic divisors of T^n - 1, and
    the ideal cut by a divisor of degree j has F_q-dimension n - j. For n prime
    with gcd(q, n) = 1 the factorisation is T^n - 1 = (T-1) * f_1 * ... * f_s
    with s = (n-1)/d and every deg f_i = d = ord_n(q), so the attainable
    dimensions are exactly {a + b*d : a in {0,1}, 0 <= b <= s}: a coarse lattice
    of spacing d, NOT an interval. The fixed space of sigma on F_{q^n} is the
    fixed field F_q, which is the ideal cut by (T^n - 1)/(T - 1) and is
    one-dimensional; hence the one stable subspace a small-m attack would most
    like to use -- the line -- is fixed pointwise and buys nothing, and any
    useful V has dimension at least d. On the curve side pi is an endomorphism
    of E exactly because E is defined over F_q, pi^n is the identity on
    E(F_{q^n}), and for n an odd prime an orbit has length 1 or n with length 1
    exactly on E(F_q) -- a point with x in F_q has y quadratic over F_q, and
    F_{q^2} is not contained in F_{q^n} for n odd, so y lies in F_q too. The
    cost consequence is then forced: quotienting by orbits divides both the
    relation count and the linear-algebra dimension by the mean orbit size
    (at most n), while rounding l* up to the nearest attainable faithful l'
    multiplies the factor base by q^(l' - l*) and the sparse linear algebra by
    q^(2(l' - l*)). The two exponents are compared directly, which is the
    inequality in clause (iv).
  assumptions:
    - >-
      The factor base is the Gaudry/Diem family cut by an F_q-subspace of the
      x-line. Other factor-base shapes (Joux-Vitse variants, factor bases cut by
      non-linear conditions, GHS descent bases) are NOT covered and the
      conclusion is not asserted for them.
    - >-
      Clauses (ii)-(iv) as stated are for n prime and gcd(q, n) = 1. Clause (i)
      is asserted for all n including p | n, where T^n - 1 is not squarefree.
    - >-
      The cost model is the standard one for this pipeline -- relation count
      proportional to the number of factor-base classes, sparse linear algebra
      quadratic in that number -- and is used only to compare the SAME pipeline
      with and without the orbit quotient, never to claim an absolute cost.
    - >-
      This hypothesis makes no claim about solving degree, first-fall degree, or
      any Groebner or SAT cost. It is about which factor bases EXIST and what
      the orbit quotient is worth, not about the cost of decomposition.
  proof_search_map:
    bottleneck: >-
      Factor-base selection, which precedes every charged stage. The claimed
      removal is of an assumption -- that a Frobenius-stable factor base of the
      index-calculus dimension may simply be chosen -- rather than of a cost.
    baseline_embedding:
      parameter_slice: >-
        The unconstrained Gaudry/Diem choice l* = ceil(n/m), which imposes no
        stability requirement on V and obtains no orbit gain.
      reproduction_check: >-
        Frozen regression: attainable_dimensions(q, n) must contain {0, 1,
        n-1, n} for every prime n, and must equal [0..n] exactly when q = 1
        mod n; both are checked as fixtures in the driver self-test.
    observation_collision:
      observable: >-
        The pair (attainable dimension spectrum, mean orbit size), which is a
        function of (q, n) alone -- not of the curve, the basis, or the solver.
      distinct_preimage_search: >-
        Distinct (q, n) with the same ord_n(q) must give the same spectrum shape
        up to scaling; the target table spans q in {2,3,4,8} at n = 41 to look
        for a collision that would indicate the observable is not what is
        claimed.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          F_{q^n} as a module over F_q[T]/(T^n - 1) rather than as a field
        predicted_gain: >-
          Replaces a search over subspaces by an enumeration of divisors, making
          the design space exactly computable at cryptographic n
    quantifier_order: >-
      For all q, for all prime n with gcd(q, n) = 1, for all m >= 2: there
      EXISTS a faithful sigma-stable V with dim V >= ceil(n/m) and
      q^(dim V - ceil(n/m)) < n  IF AND ONLY IF  the orbit trick is a net win at
      that (q, n, m). The existential is over V at fixed (q, n, m); it is NOT
      claimed uniformly in m.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact structural census at the enumerated (q, n), plus an exact
        orbit count on the curve cells actually built. No statement about
        end-to-end attack cost on any deployed curve is certified.
      nearby_object_control: >-
        A curve defined over F_{q^n} and over no proper subfield: pi is not an
        endomorphism of it, so no orbit structure exists on its factor base at
        all. Measured, not assumed.
    proof_obligations:
      - claim: >-
          sigma-stable subspaces are exactly the ideals of F_q[T]/(T^n - 1)
        responsibility: correctness
      - claim: >-
          every non-E(F_q) pi-orbit on F_V has length exactly n, for n odd prime
        responsibility: correctness
      - claim: >-
          the net-win inequality compares the two effects at the same stage
        responsibility: baseline
  rerandomization: null
  asymptotic_claim:
    problem: ECDLP on E(F_{q^n}) for E defined over F_q
    prior_best: >-
      Gaudry/Diem index calculus with an unconstrained subspace factor base;
      Pollard rho with the sqrt(n) Frobenius-class speedup as the matched
      baseline
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: >-
      The orbit quotient is a factor n in relation collection and n^2 in linear
      algebra -- a CONSTANT FACTOR in the field size, not an exponent move.
    claim_kind: constant_factor
  heuristic_assumptions: []
  heuristic_assumptions_note: >-
    None. Every quantity in the statement is an exact finite count. The cost
    comparison in clause (iv) uses the standard proportionality of the relation
    count and linear-algebra dimension to the number of factor-base classes,
    which is a model assumption recorded under `assumptions`, not a heuristic
    about a random object.
  structural_ingredients:
    - description: >-
        Normal basis theorem: F_{q^n} is free of rank one over F_q[T]/(T^n - 1)
        with T acting as the q-power Frobenius.
      citation: >-
        Lidl and Niederreiter, Finite Fields, 2nd ed., Theorem 2.35 (normal
        basis theorem) and Chapter 2 on cyclotomic cosets
      provenance: recalled
      verified_by: >-
        Not taken on trust: the consequence actually used -- that every stable
        subspace is the sigma-closure of a single vector, and that the count
        matches the divisor count -- is re-derived from scratch by Methods B and
        C of the driver on every lattice cell.
      role: module structure that converts subspace search into divisor enumeration
    - description: >-
        Gaudry/Diem index calculus with factor base {P : x(P) in V}, decomposition
        via Semaev summation polynomials after Weil descent.
      citation: >-
        KN-LIT-010 in this repository's corpus (the ledger's experimental
        exemplar for this pipeline), as cited by RQ-FROB-7d8dd4
      provenance: internal
      verified_by: ledger/questions/RQ-FROB-7d8dd4.yaml scope.methods
      role: the pipeline whose factor-base stage is being constrained
  reduction_chain:
    core_problem: >-
      Which Frobenius-stable Gaudry/Diem factor bases exist at a given (q, n),
      and what the orbit quotient is worth
    corollaries:
      - problem: >-
          Whether the n-fold orbit gain is available at the ECC2K-130 extension
          degree n = 131 and at the NIST binary degrees
        reduction_ref: >-
          direct specialisation of clauses (i)-(iv); no external reduction
        asymptotics_preserved: true
  predictions:
    - metric: >-
        P1 -- agreement of four independent methods (divisor enumeration,
        sigma-closure, exhaustive subspace enumeration, direct orbit iteration)
        on subspace count, dimension spectrum and orbit-length census
      direction: different
      minimum_effect: >-
        EXACT agreement on every lattice cell including the non-semisimple cells
        p | n. Any single disagreement falsifies clause (i).
    - metric: >-
        P2 -- agreement of the annihilator/totient derivation and the Burnside
        derivation of the orbit census on every stable subspace
      direction: different
      minimum_effect: EXACT agreement; any mismatch falsifies the census.
    - metric: >-
        P3 -- pi-stability of F_V for sigma-stable V, and its failure for a
        random non-stable V' of the same dimension and for a curve over no
        proper subfield
      direction: different
      minimum_effect: >-
        Stable V pi-stable on every curve cell; BOTH controls fail on every
        curve cell. A control that passes falsifies the measurement.
    - metric: >-
        P4 -- measured pi-orbit count on F_V versus the predicted
        f + (|F_V| - f)/n, n odd prime
      direction: different
      minimum_effect: >-
        EXACT equality on every curve cell. Any deviation falsifies clause (iii)
        and with it the claim that the gain is exactly n and never more.
    - metric: >-
        P5 -- net-win verdict q^(l' - l*) < n at the real extension degrees
      direction: different
      minimum_effect: >-
        NET LOSS at q = 2, n in {131, 163} for every m in {2,3,4,5}, with the
        loss margin at least 50 bits; net WIN available at n in {41, 43, 127,
        233} for at least one m in that range. A net win at n = 131 or 163, or
        no net win at n = 127, falsifies clause (iv) as applied.
  test_boundary:
    instances:
      - 12 lattice cells, q in {2,3,4,5}, n in {3,...,11}, including p | n
      - 15 census cells including composite n with intermediate orbit lengths
      - 10 curve cells, ordinary subfield curves, up to two distinct j per cell
      - 16 target degrees including the nine real binary ECC extension degrees
    parameters:
      q: [2, 3, 4, 5, 8, 9]
      n: [3, 4, 5, 6, 7, 8, 9, 11, 13, 15, 17, 21, 41, 43, 89, 101, 103, 107, 109, 113, 127, 131, 163, 233, 239, 283, 409, 571]
      m: [2, 3, 4, 5]
      seed: 20260922
    implementation: experiments/EXP-FROB-ec08b5/impl/
    budget:
      watchdog_seconds: 5400
      memory_mb: 4096
      checkpointed: true
  falsification_conditions:
    - Any disagreement among the four subspace-lattice methods on any cell.
    - Any mismatch between the totient and Burnside orbit censuses.
    - A sigma-stable V whose factor base is not pi-stable on an ordinary subfield curve.
    - A measured pi-orbit count differing from f + (|F_V| - f)/n at n odd prime.
    - A net win at q = 2, n in {131, 163}, or no net win at q = 2, n = 127.
  interpretation_limits:
    - >-
      Scoped to the Gaudry/Diem factor-base family cut by an F_q-subspace of the
      x-line. A negative verdict here is NOT a statement that Frobenius is
      useless in index calculus generally, nor about GHS Weil descent, nor about
      Pollard rho on Frobenius classes.
    - >-
      Structural availability is not practical feasibility. A cell reported as a
      net win at large m says nothing about whether the Semaev polynomial
      S_{m+1} can be solved at that m; the decomposition cost is out of scope
      and is measured by other experiments in this lane.
    - >-
      The net-win inequality compares the same pipeline with and without the
      orbit quotient. It does NOT claim that index calculus beats Pollard rho at
      any of these parameters, which is a separate comparison RQ-FROB-7d8dd4
      also asks for and this experiment does not answer.
    - >-
      Curve-cell measurements are at toy field sizes where a factor base can
      contain very few points; cells whose factor base is smaller than roughly
      10 points carry no statistical content and are reported with that caveat.
  status: supported
  status_note: >-
    Set to `supported` by DEC-20260922-5796b8 (decision D4) on EV-FROB-d336b0:
    all five preregistered predictions held, both controls failed on every curve
    cell as required, and the exact orbit-count prediction was exact on 14 of 14
    cells. NOT `established`: the scope is one factor-base family and the
    decisive orbit-length clause is verified exactly only at toy field sizes.
  status_note_20260923: >-
    ADDITIVE; the status_note above is kept as written. Status `supported` is
    RE-AFFIRMED ON REVIEWED EVIDENCE by DEC-20260923-e6cd5d, composing
