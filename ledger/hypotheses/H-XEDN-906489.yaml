hypothesis:
  id: H-XEDN-906489
  question_id: RQ-XEDN-003

  statement: >-
    SCOPE: rational elliptic surfaces y^2 = x^3 + a(t)x + b(t) over F_p(t) with
    deg a <= 4, deg b <= 6, squarefree discriminant, p in {7,13,19,31}; free-x
    integral sections deg x <= 2, deg y <= 3; the archived slot data of
    EXP-XEDN-005 and EXP-XEDN-007 plus a bounded fresh enumeration. CLAIM TIER
    toy. NO ATTACK, NO EXPONENT, NO CRYPTO-SCALE TRANSFER.
    THE HYPOTHESIS, in three parts, each independently falsifiable.
    (P1) THE DICHOTOMY. On every surface in scope, the free-x sections are the
    norm-2 vectors (roots) of an E8 Mordell-Weil lattice, the exhaustive
    enumeration makes the observed set saturated, and consequently the quantity
    reported as max_|coeff| by EXP-XEDN-003/004/005/006/007 -- the infinity norm
    of the SHORTEST nonzero Mordell-Weil relation among the observed sections --
    takes exactly two values: 1 whenever the realised root system has any
    component other than A1, and undefined (no relation exists) whenever it is
    A1^r. No third value occurs. Hence the reported constancy in p and the
    reported slope 0.0 with CI [0,0] are consequences of root-system algebra and
    carry no information about p, about deg a, or about the surface.
    (P2) THE CEILING. The infinity norm of any MINIMAL-SUPPORT relation among
    such sections equals the largest mark of an affine simply-laced Dynkin
    diagram realised inside E8, hence lies in {1,2,3,4,6}, is at most 6, and
    never equals 5. This is an absolute bound, uniform in p and in deg a, so
    coefficient GROWTH -- the obstruction the xedni literature is said to
    identify -- cannot be exhibited anywhere in this window by any census.
    (P3) THE INSTRUMENT. Independently of P1 and P2, the value that H-XEDN-004
    nominates as its falsifier is outside the implemented search space: the
    primary search in experiments/EXP-XEDN-005/implementation/run_census.sage,
    shortest_relation_group_law(E, pts, coeff_bound=3, max_support=3), enumerates
    supports 2 and 3 with coefficients in [-3,3], returns on the first
    infinity-norm-1 hit, and then tries support 4 with coefficients in {-1,+1}
    only; no path returns a value >= 4.
    IF P1 OR P2 FAILS, that failure is the deliverable: it means a saturated set
    of height-2 vectors on a chi = 1 surface admits a minimal relation the
    classification forbids, which locates an error in one of the three premises
    (chi = 1, irreducible fibres, height 2) and is far more interesting than
    confirmation.

  mechanism: >-
    DERIVED IN-REPO, with every recalled step labelled and made a stage of the
    experiment. Full derivation and its confounders: ledger/proposals/
    IDEA-20260805-4ddf4e.yaml and IDEA-20260805-4ed1b1.yaml.

    (1) GENUS. For y^2 = x^3 + a(t)x + b(t) the associated elliptic surface over
    P^1 has chi = ceil(max(3 deg a, 2 deg b)/12). At deg b = 6 and deg a <= 4
    this is 1: a RATIONAL elliptic surface. The entire XEDN window sits at
    chi = 1, and only GOAL-XEDN-003's deg b = 10 family leaves it.
    [Classification RECALLED, UNVERIFIED; re-derived or sourced in Stage 1.]

    (2) HEIGHT. Shioda's height is hhat(P) = 2 chi + 2 (P.O) - sum_v contr_v(P).
    An integral section has (P.O) = 0; a squarefree discriminant makes every
    fibre irreducible (type I1) so every contr_v vanishes; hence hhat(P) = 2.
    The height-2 sections are exactly those with x a polynomial of degree <= 2
    and y of degree <= 3, and the Mordell-Weil lattice is E8, 240 roots, rank 8.
    [RECALLED, UNVERIFIED from Shioda's Mordell-Weil lattice theory -- the papers
    were NOT READ. INDEPENDENTLY ASSERTED INSIDE THIS CORPUS: DEC-20260724-021's
    limitations state "The counted sections are in fact height-2 roots of the E_8
    Mordell-Weil lattice, so their relation coefficients are absolutely bounded",
    and its next_actions prescribe the pairing "<P,P> = 2, <P,Q> = 1 - (P.Q),
    with chi = 1, (P.O) = 0, all fibres irreducible for squarefree b". Two
    unsourced statements are not a source, and Stage 1 must resolve this.]

    (3) SATURATION. enumerate_slots_frozen_mod in EXP-XEDN-005 loops x0,x1,x2
    over all of F_p^3 and keeps every pair passing the frozen square predicate,
    so the observed set is the complete set of F_p-rational sections of the
    shape. If r and s are observed roots with <r,s> = -1, then r+s has norm
    2+2-2 = 2, is again a height-2 section, and is therefore also observed.
    Saturation is a property of the enumeration, not of the surface.

    (4) THE DICHOTOMY (P1). Let Phi be the realised root system, r its rank, N
    its positive-root count. For simply-laced irreducible types the pairs
    (rank, positive roots) are A1 (1,1), Ak (k, k(k+1)/2), Dk (k, k(k-1)),
    E6 (6,36), E7 (7,63), E8 (8,120); every type but A1 has strictly more
    positive roots than rank. So N = r iff Phi = A1^r, in which case the roots
    are pairwise orthogonal, hence independent, hence no relation exists. And
    N > r forces a non-A1 component, which -- being connected and simply laced --
    contains two simple roots alpha, beta with <alpha,beta> = -1, so
    gamma = alpha+beta is a root, is observed by (3), and alpha+beta-gamma = 0 is
    a support-3 relation with coefficient vector (1,1,-1) and infinity norm 1.
    Since 1 is the minimum possible infinity norm of a nonzero integer vector,
    the reported minimum is exactly 1. Two cases, exhaustive, no third value.

    (5) THE CEILING (P2). A minimal-support relation is a circuit of the root
    matroid; for simply-laced systems the circuits are the root sets of affine
    (extended) subdiagrams, on which the unique relation has coefficients equal
    to the diagram's marks. Largest marks: affine A_n 1, affine D_n 2, affine E6
    3, affine E7 4, affine E8 6. Inside E8 no other affine type occurs, so the
    ceiling is 6 and the value 5 is impossible. [Mark tables RECALLED,
    UNVERIFIED; the experiment RECOMPUTES them from the root system in exact
    integer arithmetic, which removes the dependence entirely.]

    (6) WHY THE MEASUREMENT NEVER MOVED, AND THE TWO DESIGN FACTS THAT MADE IT SO.
    First, the sampler. EXP-XEDN-005's fiber_find_rich_surfaces does not draw
    (a,b); it draws two candidate sections and solves
    a = ((y1^2-x1^3)-(y2^2-x2^3))/(x1-x2), b = y1^2-x1^3-a x1. Every censused
    surface is conditioned on the realised root system containing a prescribed
    2-root configuration, i.e. conditioned into the N > r branch where the metric
    is forced to 1. Second, the eligibility rule requires >= 2 slots, which is
    the same conditioning applied twice. Neither is concealed -- the artifacts
    record source: fiber_over_sections -- but neither is charged.

    (7) THE PAIRING BUILT WAS NOT THE PAIRING ORDERED. DEC-20260724-021 specified
    the Shioda Gram. The implemented height_gram builds a matrix from
    h_naive(P) = max(deg num x, deg den x) with off-diagonal
    (h(P+Q)-h(P)-h(Q))/2. The naive degree height is not the canonical height and
    its polarisation is not bilinear, so that matrix's rank and kernel are not
    the rank and relation lattice of the Mordell-Weil span. The committed data
    shows them disagreeing -- surfaces recorded with corank 0 yet carrying a
    group-law-verified relation, and recorded max_abs_coeff_gram of 2 and 4 where
    the group-law value is 1. P1 and P2 are stated for the SHIODA pairing and the
    experiment recomputes it.

    (8) WHAT COULD BE WRONG, FIXED BEFORE THE RUN. The premises are not universal
    across the census. The committed data records b_squarefree false on at least
    one surface and records naive-height sets {0,1,2} and {1,2} on others, so the
    pure-root stratum is a subset. Sharpest of all: the archived EXP-XEDN-005
    planted control (a = [2,4,0,3,3], b = [1,2,3,3,6,5,2], p = 7, 3 slots,
    specialisation 20/20) reports max_abs_coeff = 2, and the dichotomy forbids 2
    among saturated roots at support <= 3, because 2 r1 = r2 + r3 with all three
    of norm 2 forces <r2,r3> = 2, hence r2 = r3. Either that surface violates a
    premise or P1 is wrong. It is promoted to a primary control for exactly that
    reason, and it costs no new curve compute to settle.

  assumptions:
    - >-
      chi = 1 across deg a <= 4, deg b <= 6. Checked per surface in Stage 2 by
      recomputing max(3 deg a, 2 deg b), not inherited.
    - >-
      Squarefree DISCRIMINANT (4a^3 + 27b^2), recomputed and factored per
      surface. The committed census records b_squarefree, which is a different
      condition, and the two must not be conflated.
    - >-
      Every observed slot has Shioda height exactly 2. Recomputed per slot; any
      slot at a different height moves its surface out of the pure stratum and it
      is reported separately, never pooled.
    - >-
      "Relation" means verified in the group law over F_p(t). Specialisation at
      20 fibres is necessary and not sufficient; both are reported and neither
      substitutes for the other.
    - >-
      Reading committed artifacts during design is not running an experiment.
      Every quantity in this record taken from
      experiments/EXP-XEDN-005/runs/RUN-XEDN-005-MAIN/raw-result.json is labelled
      as read from it, and Stage 2 re-derives each in-harness before any of them
      may enter an evidence record.
    - >-
      ENVIRONMENT, MEASURED IN THIS SESSION AND NOT ASSUMED: numpy 2.4.6 imports;
      sympy does NOT (ModuleNotFoundError); sage does NOT; so EXP-XEDN-005's
      run_census.sage CANNOT be re-executed here. The frozen predicate module
      experiments/EXP-XEDN-001/xedni_sections.py (sha256
      76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f) is pure
      Python and imports cleanly. All arms must therefore be pure-Python integer
      arithmetic; any arm that needs a CAS is an infrastructure request, not an
      experiment (AGENTS.md rule 5).

  proof_search_map:
    bottleneck: >-
      The step where an arithmetic quantity is supposed to enter the observable.
      P1 asserts that it never does: the reported scalar is a function of the
      realised root system's Dynkin type alone, and the type-to-scalar map is
      two-valued. If that is right, no improvement to the census -- more primes,
      larger deg a, more surfaces, a thicker p = 31 cell -- can change the
      reading, because the reading is not measuring them. Settling this one step
      is upstream of GOAL-XEDN-001, -002 and -003 and consumes none of their
      budgets.
    baseline_embedding:
      parameter_slice: >-
        The committed EXP-XEDN-005 MAIN run at p in {7,13,19,31}, 41 analysed
        surfaces, of which 25 are recorded eligible, with per-surface slot lists,
        naive-Gram ranks and coranks, group-law shortest relations, and the
        planted control. That is the exact slice the incumbent conclusion rests
        on and it is the slice the audit must reproduce.
      reproduction_check: >-
        EXACT AND COMMITTED-NUMBER-BASED, not visual. Stage 2 must reproduce, per
        surface, the recorded n_slots and the recorded group-law shortest
        relation from the recorded slot list alone. A recomputation that cannot
        return the incumbent numbers from the incumbent inputs is not an
        embedding of the baseline and no comparison may be drawn from it. Note
        the reproduction is of the RELATION SEARCH, not of the enumeration: the
        enumeration is re-run independently in Stage 3 on a subset, using the
        frozen predicate, and any disagreement there is itself reportable.
    observation_collision:
      observable: >-
        The single integer max_|coeff| per surface (or the symbol null), and the
        derived slope of that integer against log p.
      distinct_preimage_search: >-
        A COLLISION IS ALREADY COMMITTED, and it is the reason this hypothesis
        has content. Read from the archived MAIN run during design: 41 surfaces
        spanning four primes, two deg-a windows, slot counts from 2 to 12,
        naive-Gram ranks from 2 to 11, squarefree and non-squarefree b, and
        naive-height sets {2}, {1,2} and {0,1,2}, produce exactly two observable
        values -- 1 on every surface where a relation was found, and null on the
        three where none was. Distinct ground-truth objects on both sides of any
        arithmetic distinction one might care about share the observable. That is
        a direct falsifier of identifiability unless a further condition
        separates them, and P1 asserts there is none: the separating condition is
        the Dynkin type, which the observable does not see. The opposite-side
        member is supplied too: the archived planted control returns 2, so if it
        satisfies the same premises the observable DOES separate something and P1
        is refuted.
    quantifier_order: >-
      CLAIMED, IN THIS ORDER: FOR ALL primes p in the tested set, FOR ALL surfaces
      S in scope satisfying the three premises, THERE IS NO relation among the
      observed sections whose infinity norm is neither 1 nor absent. The witness
      (the (1,1,-1) relation) is ALLOWED to depend on S -- it is a different
      triple of roots on each surface -- and P1 does not claim a uniform witness;
      claiming one would be false. What P1 does claim uniformly is the VALUE, and
      that is the correct quantifier order for a forced-value statement.
      The incumbent H-XEDN-004 is stated the other way round: FOR ALL p, the
      measured max_|coeff|(p) lies in {1,2,3} with slope 0. Under P1 that
      statement is true but vacuous, because its predicate is satisfied by a
      quantity whose range is {1, undefined}. A true-but-vacuous universal is
      exactly the quantifier trap this audit is hunting, and naming it is not the
      same as saying the incumbent record is wrong: it is saying its predicate
      cannot distinguish the world it asserts from the world it denies.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: a toy-tier, chi = 1-only, squarefree-discriminant-only statement
        that one observable is determined by a lattice invariant, plus a
        recomputed mark table with an absolute ceiling of 6 on minimal-support
        relations in that window, plus a code-reading fact about one instrument's
        reachable range. It cannot certify anything about crypto-scale ECDLP,
        cannot move an exponent, cannot close the lifting route, cannot bound any
        solver's cost, and cannot license any of the sentences
        DEC-20260724-021 publishes as forbidden.
      nearby_object_control: >-
        THE chi = 2 FAMILY, deg b = 10 with deg a <= 2, whose slot data is
        already committed in EXP-XEDN-006 and EXP-XEDN-007. It is the closest
        object to the target -- same predicate, same enumeration code path, same
        primes, same lane -- and the hoped-for conclusion FAILS there by
        construction: minimal integral sections have height 2 chi = 4, the
        lattice is not a root lattice, marks are undefined, and the dichotomy has
        no reason to hold. A method that cannot hold the two families apart is
        responding to the pipeline, not to the surfaces, and in that case NO
        conclusion may be drawn about either. A SECOND nearby object, sharper and
        cheaper: the archived planted control that returns 2 while sitting in the
        chi = 1 family. If the audit cannot explain that single committed number
        by a named premise violation, it has not identified the load-bearing
        structure.
    proof_obligations:
      - claim: chi = 1 for deg a <= 4, deg b <= 6, verified per surface.
        responsibility: baseline
      - claim: Squarefree discriminant implies all fibres I1 implies hhat = 2 for integral sections.
        responsibility: correctness
      - claim: The observed set is saturated under root addition.
        responsibility: correctness
      - claim: N = r iff A1^r; N > r implies an inf-norm-1 relation exists and is observed.
        responsibility: correctness
      - claim: Circuits of a simply-laced root matroid are affine subdiagrams; marks give the coefficients; ceiling 6, value 5 impossible.
        responsibility: correctness
      - claim: shortest_relation_group_law cannot return a value >= 4.
        responsibility: interface
      - claim: The naive-degree Gram is not the Shioda pairing, and only the recomputed Shioda pairing enters any conclusion.
        responsibility: strictness
      - claim: Everything here is toy-tier and scoped to chi = 1 with squarefree discriminant; no forbidden sentence is licensed.
        responsibility: scope
    not_applicable_reason: null

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Deliberately null. NO complexity claim of any kind. This hypothesis is an
    INSTRUMENT AND OBSERVABLE AUDIT with an algebraic ceiling attached. It makes
    no system easier to solve, moves no exponent, and adds no attack. Pollard rho
    at N^(1/2) time and O(1) memory remains the ECDLP baseline, and sota_delta is
    zero on time, memory, data, queries, preprocessing and advice.
    dominated_by is not applicable because no Pareto point is offered.

  heuristic_assumptions:
    - id: HEUR-X1
      formal_statement: >-
        For a rational elliptic surface (chi = 1) over F_p(t), p >= 5, with
        squarefree discriminant, the sections with x a polynomial of degree <= 2
        and y a polynomial of degree <= 3 are EXACTLY the Mordell-Weil vectors of
        canonical height 2, and the geometric Mordell-Weil lattice is E8.
      random_model_justification: >-
        Not a distributional heuristic; it is a recalled theorem carried as a
        heuristic because it is unsourced here. The remembered supporting
        argument is Shioda-Tate: rank MW = rho - 2 - sum_v (m_v - 1) with rho =
        10 for a rational elliptic surface and all m_v = 1 under irreducible
        fibres, giving rank 8, with the lattice pinned to E8 by its determinant.
        THE PAPERS WERE NOT READ and no citation is asserted.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-1bcf87]
      falsification_condition: >-
        Any observed slot whose recomputed Shioda height is not 2 on a surface
        with squarefree discriminant; any realised subsystem of rank > 8; any
        realised root count > 240; any realised (rank, positive-root count) pair
        not realisable by a root subsystem of E8 once the Shioda pairing (not the
        naive one) is used. Read from the archived data during design, at least
        one recorded (naive rank 3, 5 slots) pair at p = 19 is NOT ADE-admissible
        -- under HEUR-X1 that must be an artefact of the naive pairing, and if it
        survives recomputation under the Shioda pairing, HEUR-X1 is refuted.
    - id: HEUR-X2
      formal_statement: >-
        A squarefree discriminant over F_p, p >= 7, implies every fibre of the
        minimal model is of type I1, hence contr_v(P) = 0 for every section and
        every place.
      random_model_justification: >-
        Standard Kodaira/Tate reasoning as recalled: a simple root of the
        discriminant gives a nodal fibre with trivial component group. Wild
        behaviour at p = 2, 3 is out of scope since every tested p >= 7, but
        additive-reduction and behaviour at t = infinity are NOT covered by that
        one-line argument and are checked explicitly.
      supporting_results: []
      validation_experiment_ids: [EXP-XEDN-1bcf87]
      falsification_condition: >-
        Any surface with squarefree discriminant on which the recomputed fibre
        type at some place is not I1, or on which the height of an integral
        section differs from 2. Reported per surface, never pooled.

  structural_ingredients:
    - description: >-
        Shioda height pairing on the Mordell-Weil lattice of an elliptic surface,
        hhat(P) = 2 chi + 2 (P.O) - sum_v contr_v(P), with the specialisation
        <P,P> = 2 and <P,Q> = 1 - (P.Q) at chi = 1 with irreducible fibres.
      citation: >-
        Stated inside this corpus at ledger/decisions/DEC-20260724-021.yaml,
        next_actions, first bullet. The primary literature (Shioda) was NOT READ.
        An in-corpus restatement is not a source and the experiment must either
        obtain one or replace the pairing by an in-repo derivation.
      role: converts sections into lattice vectors with an exact integer Gram
    - description: >-
        Classification of simply-laced root systems by (rank, positive-root
        count), and the identification of root-matroid circuits with affine
        subdiagrams carrying the marks as coefficients.
      citation: >-
        Standard; RECALLED, UNVERIFIED as a table, and RECOMPUTED from the E8
        root system in exact integer arithmetic by the paired experiment so that
        no table is relied on.
      role: supplies the dichotomy and the ceiling
    - description: >-
        The frozen square predicate and polynomial arithmetic of
        experiments/EXP-XEDN-001/xedni_sections.py, sha256
        76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f.
      citation: >-
        Read and imported in this session; pure Python, no CAS dependency.
      role: independent re-enumeration arm without Sage

  reduction_chain:
    core_problem: >-
      Determine whether the XEDN lane's primary observable is a function of the
      realised Mordell-Weil root system alone, and if so, what its range is.
    corollaries: []
    corollaries_note: >-
      DELIBERATELY EMPTY. There is no reduction from this statement to any
      cryptographic-scale statement and none is claimed. In particular nothing
      here bears on whether a lifting-based relation source exists; the cost side
      is a separate hypothesis, H-XEDN-beb408, and even that one claims no
      attack.

  predictions:
    - metric: >-
        G1 -- dichotomy violations: surfaces in the recomputed archived census
        with squarefree discriminant, all slots at Shioda height 2, and a
        group-law-verified shortest relation whose infinity norm is neither 1 nor
        absent
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Exact, not a percentage band: a single violation refutes P1.
    - metric: >-
        G2 -- Case-O identification: fraction of surfaces reporting
        max_abs_coeff = null whose recomputed root system is exactly A1^r
      direction: higher
      minimum_effect: >-
        EXACTLY 1.00. Three such surfaces are already present in the archived
        MAIN run. Any null surface that is not A1^r means the incumbent search
        bound missed a relation, which is P3's defect and must be reported under
        that heading rather than absorbed here.
    - metric: >-
        G3 -- ADE admissibility: fraction of recomputed (rank, positive-root
        count) pairs realisable by a root subsystem of E8, under the SHIODA
        pairing
      direction: higher
      minimum_effect: >-
        EXACTLY 1.00 on the pure stratum. This control has teeth because most
        integer pairs are inadmissible -- at rank 3 only the counts 3, 4 and 6
        occur -- so passing it is not cheap.
    - metric: >-
        G4 -- instrument reachability: the maximum value returned by
        shortest_relation_group_law on a synthetic point configuration whose only
        relation has infinity norm 4
      direction: different
      minimum_effect: >-
        None, or a fall-through to the Gram path; NEVER 4. Forced by
        coeff_bound = 3 and max_support = 3. A return of 4 refutes P3 outright.
    - metric: >-
        G5 -- POSITIVE CONTROL, the archived planted surface a = [2,4,0,3,3],
        b = [1,2,3,3,6,5,2] at p = 7 that reported max_abs_coeff = 2: which
        premise it violates
      direction: different
      minimum_effect: >-
        EXACTLY ONE of a non-squarefree discriminant, a fibre that is not I1, or
        a slot at height /= 2 must be found. If none is found, P1 is refuted by
        an already-committed number and NO negative statement about the lane's
        observable may be reported.
    - metric: >-
        G6 -- synthetic affine ladder: the returned infinity norm of the unique
        relation on hand-built circuits of type affine A4, D4, D6, E6, E7, E8
      direction: different
      minimum_effect: >-
        EXACTLY the sequence 1, 2, 2, 3, 4, 6 -- non-decreasing along that order,
        with the affine E8 coefficient multiset {1,2,3,4,5,6,4,3,2}. A flat
        sequence means the machinery reports a constant of the apparatus and no
        coefficient conclusion may be drawn from any arm.
    - metric: >-
        G7 -- NULL ARM, chi = 2: the recomputed Shioda diagonal on the archived
        deg b = 10 slot data of EXP-XEDN-006/007
      direction: different
      minimum_effect: >-
        4, not 2, and its (rank, count) pairs NOT constrained to the ADE table.
        If the chi = 2 family behaves identically to chi = 1, the audit is
        measuring the pipeline and must report an artifact and stop.
    - metric: >-
        G8 -- graded control: fraction of surfaces on which the dichotomy holds,
        across deg b in {6,7,8,9,10,11,12} at fixed deg a <= 4
      direction: lower
      minimum_effect: >-
        1.00 at deg b = 6 and strictly falling above it. A fraction that stays at
        1.00 across the whole sweep is the canonical artifact tell -- a quantity
        that does not decay when the parameter meant to destroy it increases --
        and forces the artifact report.
    - metric: >-
        G9 -- Dynkin type spread: number of distinct realised types across the
        recomputed census
      direction: higher
      minimum_effect: >-
        >= 4. The replacement observable must have comparator spread where the
        incumbent has none; below 4 the constructive half of the hypothesis fails
        on its own criterion.

  test_boundary:
    instances:
      - Archived slot data of EXP-XEDN-005 (41 analysed surfaces, p in {7,13,19,31}) and EXP-XEDN-007 (p = 31, deg b = 10), read from committed raw-result.json files.
      - A bounded fresh enumeration with the frozen predicate on a subset, to check the archived slot lists rather than trust them.
      - Synthetic root configurations inside E8, constructed rather than sampled, for the ladder and reachability controls.
    parameters:
      primes: [7, 13, 19, 31]
      deg_a_max: 4
      deg_b_treatment: 6
      deg_b_null: [7, 8, 9, 10, 11, 12]
      section_shape: "deg x <= 2, deg y <= 3"
      pairing: "Shioda: <P,P> = 2, <P,Q> = 1 - (P.Q); the naive-degree Gram is recorded beside it and never used in a conclusion"
      arithmetic: "exact integers and F_p, pure Python; no CAS"
    implementation: experiments/EXP-XEDN-1bcf87
    budget:
      stage0_1_wall_clock_seconds: 900
      stage2_wall_clock_seconds: 900
      stage3_wall_clock_seconds: 2700
      maximum_memory_gb: 2
      maximum_runs: 4

  falsification_conditions:
    - >-
      F1 (ZERO NEW CURVE COMPUTE, THE PRIMARY FALSIFIER) -- any surface in the
      recomputed archived census satisfying all three premises with a
      group-law-verified shortest relation of infinity norm >= 2. P1 dies and is
      withdrawn by a superseding record.
    - >-
      F2 -- a minimal-support relation of infinity norm exactly 5, or greater
      than 6, anywhere in scope. P2 dies. The value 5 is the cheapest single
      counterexample available against this hypothesis and it is named here so
      that anyone can look for it.
    - >-
      F3 -- shortest_relation_group_law returns a value >= 4 on the synthetic
      driver. P3 dies independently of P1 and P2.
