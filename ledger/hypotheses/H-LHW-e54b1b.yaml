# =============================================================================
# H-LHW-e54b1b -- Translation-walk advice cannot beat min(R3,R4) unless the
# structural millirho of W(m,w) versus a matched random set grows. Specified
# from IDEA-20260930-79abd9 under RQ-LHW-1877bb. Approved DEC-20261003-1c5b5a.
# ZERO RUNS in this design packet. No AUXIN. No Bedrock. No curve attack.
# IDEA claim text is not rewritten.
# =============================================================================
hypothesis:
  id: H-LHW-e54b1b
  question_id: RQ-LHW-1877bb
  source_idea: IDEA-20260930-79abd9
  experiment_id: EXP-LHW-b49bc6
  goal_id: null
  goal_id_note: >-
    IDEA-20260930-79abd9 and RQ-LHW-1877bb carry goal_ids []. This hypothesis
    does not attach GOAL-ECDLP2M-001. Shared goal heads are not edited.
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-1c5b5a
  status: approved
  status_history:
    - from: proposed
      to: specified
      at: '2026-10-03'
      by: DEC-20261003-1c5b5a
    - from: specified
      to: approved
      at: '2026-10-03'
      by: DEC-20261003-1c5b5a
  proposed_by: coordinator

  title: >-
    On the frozen (m,w) ladder, hash-realisable jump sums yield millirho
    Def(W)/Def(W') that either stays ≤ 2000 at every T≥64 (E1) or reaches
    ≥8000 at T=1024 and rises at T=4096 on two cells (E2)

  statement: >-
    CLAIM (heuristic_validation / integer sumset instrument; NO ATTACK; NO
    EXPONENT MOVE). Let W = W(m,w) be the weight-w integers below 2^m. For
    each frozen family in {Ja r-adding r=16, Jb signed bits, Jc exchanges,
    Jd unit {1..16}} and each T in {16,64,256,1024,4096}, form J_T as the
    distinct partial sums of a keyed-hash walk of length T on (Z,+). Let
    Def(X)=|X| |J_T| / |X+J_T| and millirho = 1000 |W'+J_T| // |W+J_T| at
    matched |W'|=|W| (five W' seeds). FORALL six cells (m,w) in
    {(20,2),(20,3),(20,5),(24,3),(24,4),(24,6)}: E1 iff median millirho ≤
    2000 for every family at every T≥64 with no required upward trend;
    E2 iff some family has median millirho ≥ 8000 at T=1024 and strictly
    larger median at T=4096 on at least two cells. Between those gates:
    O-INCONCLUSIVE. Twin routes A/B must agree on every |X+J|. W_ap
    (arithmetic progression of size |W|) must show millirho ≥ 8000 at
    T=1024 on Jd (proves-too-much / nearby-object control). NO break.
    NO cryptographic-m transfer. Stage 2 tables are not authorized.

  mechanism: >-
    OBJECT FRAME as IDEA-20260930-79abd9: walk region R_T = W + D0 + J_T
    priced by the sumset |W+J_T|. Dual Python routes count that cardinality
    independently (bytearray bitmap vs uint64-word bitmap) after a shared
    hash-driven jump sequence. Stage 0 freezes integer binomials, least
    primes above 2^{m+2}, millirho gates, T grid, and alpha gap 11/100.
    Stage 1 is the discriminator. WHAT IS NEW relative to H-LHW-90bf21 /
    EXP-LHW-44a6ec: that contract checked floor-square products and
    forbade walks; this contract measures the advice-region sumset.

  assumptions:
    - Advice and walks depend on public (m,w) and a keyed hash of the current
      integer state only; no target Q is used in Stages 0-1.
    - Jumps wrap neither modulo l nor modulo 2^m; the bitmap is two-sided
      on [-2^{m+2}, 2^{m+2}] and l is frozen only as the IDEA's wrap-exclusion
      witness (not used as a modulus in Stage 1).
    - millirho is an integer; E1/E2 thresholds are 2000 and 8000 millirho.
    - Toy ladder only; m in {20,24}.

  predictions:
    - metric: millirho_vs_Wprime
      direction: different
      minimum_effect: >-
        E1 iff median ≤ 2000 at all T≥64 for all families; E2 iff ≥8000 at
        T=1024 and rising at T=4096 on ≥2 cells
    - metric: millirho_Wap_Jd_T1024
      direction: higher
      minimum_effect: median ≥ 8000 (blocking positive control)
    - metric: twin_card_sumset
      direction: same
      minimum_effect: route A cardinality equals route B on every counted X+J
    - metric: decay_millirho_q
      direction: lower
      minimum_effect: >-
        If millirho(q=0)>1000 then the q ladder 0,25,50,75,100 is monotone
        nonincreasing (else O-ARTIFACT)

  test_boundary:
    instances:
      - 'Stage 0: closed-form R0/R3/R4/LB integer table + millirho gates; hashed'
      - 'Stage 1 authorized: six (m,w) cells, four jump families, T_GRID, exact bitmaps'
    parameters:
      cells: [[20, 2], [20, 3], [20, 5], [24, 3], [24, 4], [24, 6]]
      binom_20_2: 190
      binom_20_3: 1140
      binom_20_5: 15504
      binom_24_3: 2024
      binom_24_4: 10626
      binom_24_6: 134596
      l20: 4194319
      l24: 67108879
      e1_max_millirho: 2000
      e2_min_millirho: 8000
      e1_t_min: 64
      e2_t: 1024
      e2_t_rise: 4096
      t_grid: [16, 64, 256, 1024, 4096]
      gap_num: 11
      gap_den: 100
      walk_count: 10
      wprime_count: 5
      walk_seed0: 2026100310
      wprime_seed0: 2026100320
    implementation: >-
      Pure Python under experiments/EXP-LHW-b49bc6/implementation/; dual
      routes route_a.py and route_b.py must not import each other; command
      surface implementation/run.py driven by trial-plan.json.
      No Magma/Sage/AUXIN/Bedrock.
    budget:
      wall_clock_seconds: 7200
      memory_gb: 4
      maximum_runs: 4

  falsification_conditions:
    - Twin cardinalities disagree on any counted X+J (O-ARTIFACT).
    - W_ap millirho < 8000 at T=1024 on Jd (instrument void).
    - Decay ladder not monotone when millirho(q=0)>1000 (artifact).
    - Editing millirho gates or T_GRID after Stage-0 freeze.
    - Claiming an ECDLP break or cryptographic-m exponent from this toy.

  distinguishable_outcomes:
    - id: O-E1
      meaning: >-
        Twin OK; W_ap control passes; every cell has median millirho ≤ 2000
        at all T≥64 for all families. Translation-walk advice inherits the
        LHW obstruction on this ladder (IDEA E1). No algorithm claim.
    - id: O-E2
      meaning: >-
        Twin OK; W_ap control passes; some family reaches millirho ≥ 8000 at
        T=1024 and rises at T=4096 on at least two cells (IDEA E2). Stage 2
        W-adapted tables remain unauthorized under this card.
    - id: O-INCONCLUSIVE
      meaning: >-
        Twin and controls pass, but neither E1 nor E2 gates fire (mixed
        families/T).
    - id: O-ARTIFACT
      meaning: Twin disagreement, W_ap miss, decay fail, or freeze mismatch.
    - id: O-IMPEDIMENT
      meaning: >-
        Infrastructure timeout/crash/missing Stage-0 freeze. Never negative
        evidence against H-LHW-e54b1b.

  interpretation_limits:
    - Toy integer sumsets; m≤24. No transfer to cryptographic m.
    - E1 is scoped to the four hash-realisable families tested, not to
      list-based, nested, or representation advice.
    - P-CGK-W remains an unproved obligation; LB is not used as a Stage-1 gate.
    - Does not rewrite H-LHW-90bf21 / EXP-LHW-44a6ec.
    - No claim about RQ-ECDLP-78dbc5's uniform-target constant.

  heuristic_assumptions:
    - id: HEUR-LHW-79abd9-H1
      formal_statement: >-
        (BL region law, inherited.) For translation-walk advice, achievable
        (S,T,epsilon) obey S T^2 ~ c epsilon |W+J_T|. Stage 1 does not test
        the law; it tests whether |W+J_T| can be structurally smaller than
        |W'+J_T|.
      random_model_justification: >-
        Random-oracle keyed hash of the integer state imitates i.i.d. jumps
        from Sigma (KR-RHO-93979e pointer; not re-opened this tick).
      supporting_results:
        - KN-LIT-3060
        - KN-LIT-013
        - KR-RHO-ea34b8
      validation_experiment_ids:
        - EXP-LHW-b49bc6
      falsification_condition: >-
        O-E2 on this ladder (structured deficit grows) does not refute H1;
        H1 is refuted in later Stage 2 if measured S T^2 / |R| leaves a
        factor-4 band. Stage 1 falsifies E1 vs E2 only.
    - id: HEUR-LHW-79abd9-H2
      formal_statement: >-
        Hash-realisable J_T behaves like partial sums of i.i.d. Sigma draws,
        so millirho depends on X through the representation function of X-X.
      random_model_justification: >-
        Ten keyed walks per (family,T); median millirho is the reported
        statistic; seed spread is retained in panels.
      supporting_results:
        - KR-RHO-93979e
      validation_experiment_ids:
        - EXP-LHW-b49bc6
      falsification_condition: >-
        Twin disagreement, or millirho seed range that check.py cannot
        recompute on W(20,2) cardinality 190.

  asymptotic_claim:
    problem: >-
      Preprocessing low-weight DLP frontier for translation-walk advice
      (whether |W+J_T| can beat the random-set envelope)
    prior_best: >-
      R3 split-advice and R4 Bernstein-Lange interval tables as formulated
      in IDEA-20260930-79abd9; EXP-LHW-44a6ec is an unrelated floor-square
      arithmetic check
    time_exponent: >-
      NO EXPONENT MOVED by this contract. E1 would leave the formula gap
      at alpha<11/100 as an open problem with a measured obstruction.
    memory_exponent: Bitmap of 2^{m+3} bits at m≤24
    hidden_cofactor: 2 m^2 window factors live in Stage-2 R3, not here
    claim_kind: heuristic_validation

  proof_search_map:
    bottleneck: >-
      Whether a hash-realisable J_T exists with |W+J_T| far below the
      matched random-set value — the property that would let walk-advice
      beat the split row.
    baseline_embedding:
      parameter_slice: >-
        C(m,w) freeze, l = next prime > 2^{m+2}, millirho gates 2000/8000,
        T_GRID, W(20,2) size 190.
      reproduction_check: >-
        Stage 0 dual-route binomials and primes must match freeze.py.
        check.py recomputes those integers and W(20,2) cardinality.
    observation_collision:
      observable: the pair (|J_T|, |W+J_T|) and millirho against W'
      distinct_preimage_search: >-
        Four families at equal T; W vs W' vs W_ap. A method reporting the
        same millirho on W_ap and W' has not identified load-bearing
        structure (proves-too-much).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Frontier motion reduced to integer millirho
        predicted_gain: One integer per (cell, family, T) decides E1 vs E2
    quantifier_order: >-
      FOR the six cells, four families, ten walk seeds, five W' seeds and
      T in T_GRID, |X+J_T| is counted exactly on the frozen bitmap.
      NOT CLAIMED: Stage 2 tables; cryptographic m; non-walk advice.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this ladder and these families, millirho is as measured; under
        H1 that confines translation-walk advice to min(R3,R4) if E1.
      nearby_object_control: >-
        W_ap arithmetic progression of size |W|: millirho must be ≥8000 at
        T=1024 on Jd. E1 is known false there.
    proof_obligations:
      - claim: Dual-route |X+J| agreement
        responsibility: baseline
      - claim: W_ap millirho ≥ 8000 at T=1024 Jd
        responsibility: correctness
      - claim: E1/E2 gates use frozen millirho integers 2000/8000
        responsibility: success_probability
      - claim: Nothing asserted at cryptographic m or for list advice
        responsibility: scope
    not_applicable_reason: null

  proves_too_much:
    objects:
      - id: W_ap
        known_false_reading: >-
          E1 (no structured deficit) is known false for an arithmetic
          progression of size |W| under unit jumps: |W_ap+J| stays near
          |W_ap|, so millirho vs W' must be large.
        predicted_observation: millirho_Wap_Jd_T1024 >= 8000
        failure_signature: millirho_Wap_Jd_T1024 < 8000 voids the arm
    failure_signature: W_ap millirho < 8000 at T=1024 on Jd

  prior_art:
