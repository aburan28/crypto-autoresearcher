# H-SEMBIN-371c51
# Stage-0 refutation-degree certificate for IDEA-20261010-066c44.
# One chained system. Not a batch and not a Groebner run.
hypothesis:
  id: H-SEMBIN-371c51
  question_id: RQ-SEMBIN-fa2e3f
  goal_id: GOAL-SEMBIN-5078bc
  source_idea: IDEA-20261010-066c44
  added: '2026-10-12'
  status: specified
  statement: >-
    The first unsatisfiable target in 1..31, on the chained
    summation system over F_2[z]/(z^5+z^2+1) with subspace
    dimension 2, has Boolean closure degree exactly 4. Degree 4
    means the constant 1 appears in the degree-capped closure and
    did not appear at a smaller positive degree.
  test_boundary: >-
    Eleven bit variables and one target. The search order is the
    integers 1 through 31. Batches, m greater than 3, and any
    deployed curve are outside this boundary.
  mechanism: >-
    The closure multiplies by one variable at a time and stops at
    degree 4. The constant 1 in that span is a refutation. A
    satisfiable linear equation is the control that must not refute.
  distinguishable_outcomes:
    - >-
      The planted checks hold and the refutation degree is 4.
    - >-
      The planted checks hold and the refutation degree is not 4.
    - >-
      No unsatisfiable target exists, or a planted check fails.
      That outcome invalidates the run.
  falsification: >-
    The planted checks hold and the refutation degree is not 4.
  not_claimed: >-
    No exponent, no batch rate, and no statement about a deployed
    curve.
