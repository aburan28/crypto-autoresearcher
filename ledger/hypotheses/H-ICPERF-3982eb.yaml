hypothesis:
  id: H-ICPERF-3982eb
  question_id: RQ-ICPERF-94c86e
  goal_id: GOAL-ICPERF-e6b6a4
  idea_ids: [IDEA-20261017-3f46a5]
  title: Canonical summand order and gamma-bound binary m8 solver feasibility
  statement: >-
    On the certified ordinary-binary GF(2^61) curve with prime subgroup order
    576460752557211763, sorting the eight accepted torsion-coordinate summands
    preserves every certified full-point relation after the seven intermediate
    sums are recomputed. A target-blind sorted encoding may reduce finite-cap
    solver work on the two separately planted B=316 positive controls. The
    quantitative test is whether both sorted controls return independently
    checked Boolean models and full-point certificates within one prospectively
    fixed 1200-second, one-thread, sampled-8-GiB-RSS call each. This is an
    instrument hypothesis, not an index-calculus cost claim.
  mechanism: >-
    The two bases have eight identical membership predicates on eight 11-bit
    coordinate blocks. Group addition is commutative. Sort the represented
    coordinates in nondecreasing numerical order, carrying each actual signed
    point with its coordinate, and recompute every partial sum in the chained
    S3 circuit. The permutation preserves the raw point sum and its cofactor-4
    projection. This removes up to 8! order presentations, with fewer when
    coordinates repeat; comparator clauses and their construction cost are
    charged. The claim concerns certified point relations, not equivalence of
    all Boolean roots of the two encodings.
  assumptions:
    - The curve, two target-blind B=316 bases and separate positive witnesses are exactly the frozen sources cited by EXP-ICPERF-018b0c.
    - Sorting moves the full signed point associated with each coordinate; ties use stable input order, and all seven intermediate point sums are recomputed.
    - Every accepted model is checked against CNF, native XOR, curve lifts, signs, raw sum and projected row by independent code.
    - The separately planted positive targets do not support a paired natural-yield or base-quality comparison.
    - A timeout, resource stop or unproved solver-reported UNSAT leaves solver feasibility censored or unvalidated.
  proof_search_map:
    bottleneck: >-
      The v1 two positive calls were each wall-censored at 300 seconds before
      any natural call; solver feasibility and a uniquely derivable target
      schedule are both unresolved.
    baseline_embedding:
      parameter_slice: >-
        Frozen GF(2^61), B=316, m=8, seven chained S3 equations, identical
        membership predicate per summand, CryptoMiniSat one thread, and the
        two v1 unsorted planted XCNF inputs.
      reproduction_check: >-
        Preserve the exact v1 formula/model digests and its two 300-second
        censored receipts. Recheck complete Boolean and full-point witnesses
        before any new solver call.
    observation_collision:
      observable: Ordered coordinate tuple, Boolean model and certified projected coefficient row.
      distinct_preimage_search: >-
        Check repeated-coordinate and opposite-sign witnesses. Enumerate all
        permutations of each positive witness at the point level, compare the
        sorted representative and verify the same raw sum. Do not identify
        Boolean model counts with distinct useful rows.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Seven nondecreasing comparisons on the eight 11-bit coordinate
          blocks, with sorted complete-point witnesses and re-chained partial
          sums for the frozen positive formulas.
        predicted_gain: >-
          Fewer order-equivalent search branches at a charged comparator and
          encoding cost; no gain is assumed before a matched solver receipt.
    quantifier_order: >-
      Fix curve, base, target and raw channel. For every certified ordered
      eight-point decomposition, there exists a permutation sorted by its
      encoded coordinates; all signed points and their torsion lifts travel
      with the permutation, and new partial sums witness the same raw target.
      Only after this finite correctness obligation passes are new solver
      calls admitted under frozen order, seed, binary and caps.
    method_ceiling:
      strongest_certifiable_claim: >-
        Preservation of certified point relations and bounded planted-positive
        solver feasibility on this one fixture. A later natural panel is
        required for relation yield; rank and end-to-end cost remain open.
      nearby_object_control: >-
        Exact unsorted XCNF per base under the same host, binary, seed, point
        filter and call cap. Two identical unsorted calls per base establish
        an A/A timing spread; independent byte-for-byte re-emission is an
        additional input-integrity control.
    proof_obligations:
      - {claim: Sorting any valid eight-point tuple preserves its raw sum after re-chaining, responsibility: correctness}
      - {claim: Coordinate ties and all signed/torsion lifts preserve a sorted witness, responsibility: interface}
      - {claim: New sorted XCNF and transformed positives satisfy every CNF and XOR row, responsibility: correctness}
      - {claim: All preprocessing, comparator, solver, failed-call and checker work is charged, responsibility: runtime}
    not_applicable_reason: null
  predictions:
    - metric: sorted_positive_certification
      direction: higher
      minimum_effect: >-
        Both distinct sorted planted controls return independently checked
        models and full-point certificates within 1200 seconds and sampled
        8 GiB RSS per call on an admitted quiet host.
    - metric: sorted_vs_unsorted_planted_solver_cost
      direction: lower
      minimum_effect: >-
        Exploratory paired difference with all four calls and censoring
        retained; no superiority threshold or end-to-end inference from two
        different planted targets.
  test_boundary:
    instances: [ordinary_binary_gf2_61_b31_weighted_k11_b316, ordinary_binary_gf2_61_b31_local_random_k11_b316]
    parameters: {summands: 8, positive_targets_per_base: 1, encoding_arms: [unsorted_first, sorted, unsorted_repeat], natural_solver_calls: 0, solver_threads: 1}
    implementation: EXP-ICPERF-554db4
    budget: {wall_seconds_per_call: 1200, sampled_rss_bytes_per_call: 8589934592, positive_solver_calls: 6}
  falsification_conditions:
    - A point-level counterexample to the declared sorted-witness construction disproves the exact preservation claim and invalidates the sorted arm before a solver call.
    - A sorted formula rejects its independently re-chained positive witness at a CNF, native-XOR, curve, sign, raw-sum or projection check; this is an implementation defect, not a factor-base result.
    - Both valid sorted calls can complete with a rigorous exhaustive certificate but without a model despite the verified planted witnesses; this is an instrument contradiction requiring independent review.
    - A wall, memory, model or infrastructure stop is censored; solver-reported UNSAT without a proof is unvalidated, never absence of a relation.
  interpretation_limits:
    - Six planted calls cannot measure natural relation yield or compare base quality because the two planted targets differ.
    - SAT conflicts, comparator counts and formula sparsity are diagnostics, not algebraic degree of regularity.
    - A solver win alone cannot establish useful rank, linear-algebra cost, target solving, full end-to-end speed, or matched-rho gap.
  status: specified
  approved_by: null
  specified_by: coordinator
