  title: >-
    Full width costs 2 to the 161, and that exceeds the rho factor.
  statement: >-
    With constant 2, an interval of width 2 to the k costs 2 to the
    power 1 plus k over 2 when k is even. At k equal to 320, 256, 254
    and 200 the exponents are 161, 129, 128 and 101. The rho factor
    443/500 times 2 to the 160 has base-2 logarithm strictly above
    159.8 and strictly below 159.9, because twice the fifth power of
    443 exceeds the fifth power of 500, and twice the tenth power of
    443 is below the tenth power of 500. The full-width cost divided
    by that rho factor is 1000/443, which exceeds 2 by 114/443. The
    constant 17/10 has base-2 logarithm strictly above 3/4 and
    strictly below 4/5, so the width that hits exponent 128 lies
    strictly between 1272/5 and 509/2. The written 255 is above
    509/2. At width 2 to the 254 the constant 17/10 costs a factor
    17/20 of 2 to the 128, and the base-2 logarithm of 17/20 lies
    strictly between -1/4 and -1/5. Half the square root of 2 to the
    30 is 16384, and half the square root of 2 to the 40 is 524288.
  mechanism: >-
    The proposal prices an interval by twice the square root of its
    width and compares that with a full-width rho factor. This
    contract checks those powers. It does not run a kangaroo and it
    does not read a sampling implementation.
