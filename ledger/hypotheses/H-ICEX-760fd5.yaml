hypothesis:
  id: H-ICEX-760fd5
  question_id: RQ-ECDLP-002
  source_idea_id: IDEA-20260814-a67a1d
  title: >-
    An online stopping rule over the verified Semaev relation stream may cut
    complete charged cost by adapting overcollection to the observed 2-core, but
    the source idea's 0.85 held-out ratio is computed here to be UNREACHABLE
    unless the best fixed rule's row surplus exceeds 17.6 percent - a quantity
    the design never measures - so the target is replaced by an oracle-relative
    efficiency whose dynamic range is measured in the same run, and the source's
    inherited claim to reuse the exact thresholds of IDEA-20260807-291968 is
    corrected- that record is a proposal with no run set and no thresholds
  statement: >-
    SCOPE FIELD. Prime-field ECDLP by Semaev point-decomposition index calculus,
    specifically the SCHEDULING of relation collection against peeling, residual
    sparse linear algebra, retries and target descent. The handoff label is
    correct for this record.

    (A) THE TRACKED OBJECT AND THE LOSSY-PROJECTION TEST, ADOPTED FROM THE SOURCE
    AND RESTATED. For one frozen ordinary Semaev relation generator, track the
    growing coefficient matrix and its support hypergraph after every verified
    relation- row weights, column degrees, duplicate supports, peeling pivots,
    residual 2-core, coefficient rank on that core, projected sparse-elimination
    fill, generation work, failed trials and serialized bytes. Mapping a verified
    coefficient row to its support edge is LOSSY- rows with the same support can
    have different coefficients, rank and right-hand sides - so every policy
    state keeps the full coefficients of unpeeled rows and evaluates rank and
    fill separately. A support-predicted cheap core that turns out
    coefficient-rank deficient is a FAILED ATTEMPT and all its added harvesting
    and linear-algebra work is charged.

    (B) THE SOURCE'S TARGET IS COMPUTED HERE TO BE POSSIBLY UNREACHABLE. The
    source pre-registers a held-out complete-cost ratio 'At most 0.85 in median
    and at most 1.00 at the 90th percentile'. Let the best preregistered fixed
    rule collect (1 + s) B relations, let the oracle-optimal prefix collect
    (1 + s*) B with s* at most s, and let generation dominate the complete cost.
    Then the BEST ACHIEVABLE ratio is about (1 + s*)/(1 + s), which is at best
    1/(1 + s). Reaching 0.85 therefore requires 1/(1 + s) at most 0.85, i.e.
    s at least 0.176. IF THE BEST FIXED RULE'S SURPLUS IS UNDER 17.6 PERCENT,
    THE 0.85 TARGET IS UNREACHABLE EVEN BY A PERFECT ORACLE, and the experiment
    would report a failure of the mechanism when what it measured was the absence
    of headroom. The source's design never measures s, so it cannot tell the two
    apart.

    (C) THE COMPUTED REPLACEMENT, WHICH IS SELF-CALIBRATING. The source already
    requires every complete toy relation stream to be replayed at every prefix,
    which yields the ORACLE complete-cost curve for free. Define
      r_oracle := (complete cost at the oracle-optimal prefix) divided by
                  (complete cost of the best preregistered fixed threshold),
    the CEILING of any online rule on that stream, and
      eta := (1 - r_online) / (1 - r_oracle),
    the fraction of the available saving the online rule actually captures.
    PRE-REGISTERED- a cell is INFORMATIVE only if the measured r_oracle is at
    most 0.90, i.e. at least 10 percent of the complete cost is genuinely on the
    table. Where informative, eta at least 0.60 at the median with the 90th
    percentile r_online at most 1.00 records a scheduling advantage; eta at most
    0.20 records none; between is INCONCLUSIVE, declared in advance. Where
    r_oracle exceeds 0.90 the cell is declared UNDERPOWERED with r_oracle
    reported, and the absolute 0.85 ratio is retained only as a secondary,
    explicitly conditional number. THE DYNAMIC RANGE IS SUPPLIED BY r_oracle,
    MEASURED IN THE SAME RUN, so the band cannot be degenerate by construction.

    (D) A CHARACTERISATION IN THE SOURCE IS CORRECTED RATHER THAN INHERITED. The
    source's controls list requires 'Fixed row-surplus thresholds chosen on
    calibration sizes only, including the exact thresholds used by
    IDEA-20260807-291968 where applicable'. THAT RECORD HAS NO THRESHOLDS. This
    task read IDEA-20260807-291968 and found it is a PROPOSAL - status proposed -
    whose own claim is that 'No record measures, over prime fields, the
    oversampling factor (how many harvested relations before the B x B matrix
    reaches rank B-1), the row-weight distribution, the rank profile as relations
    accumulate, the measured sparse-solve exponent on real harvested matrices, or
    the matrix's memory footprint'. It proposes to MEASURE the oversampling
    factor; it does not supply one. The fixed thresholds in this contract are
    therefore derived on this contract's own calibration sizes and nowhere else,
    and the inherited pointer is recorded as a correction.

    (E) THE POLICY IS CURVE-FREE BY CONSTRUCTION, AND THAT IS RECORDED AS A PROOF
    RATHER THAN AS AN ARM. Every state variable of the stopping rule - degree
    histogram, peel count, 2-core dimensions, coefficient rank, projected fill,
    accumulated work - is a function of the coefficient matrix and its support
    hypergraph ALONE. No curve parameter, no field element outside the
    coefficient ring, no factor-base point and no target enters the policy state.
    A curve-free arm of the POLICY would therefore be the identical computation
    on the identical matrix and would prove nothing. IT FOLLOWS, WITHOUT AN
    EXPERIMENT, that any measured policy gain is attributable to the matrix
    statistics of the stream and not to elliptic-curve structure per se. What
    remains genuinely open, and does need an arm, is whether the STREAM's matrix
    statistics differ from a same-shape random stream, which is what the matched
    random-support null and the support-replacement decay control measure.

    (F) WHAT IS NOT CLAIMED. No new source of relations, no exponent improvement,
    no relation-abundance claim, no asymptotic transfer, and no statement that
    ordinary Semaev relations occur at the random-model rate. A lower toy constant
    does not move the N^{1/2} rho or BSGS benchmark.
  mechanism: >-
    Verified ordinary Semaev relations arrive as a stream. After each batch an
    incremental reducer peels degree-one variables, updates the residual 2-core,
    estimates sparse-elimination fill from the retained coefficient matrix, and
    predicts remaining collection plus solve work. A target-independent rule stops
    at the first robust minimum of generation cost already paid plus forecast
    core solve, retry, back-substitution and descent cost. It then solves the
    core, reverses the peel certificates, and performs a masked target descent.
    The proposed gain is SCHEDULING- adapt the number of expensive verified
    relations to the observed core rather than selecting a universal row surplus.
    Relation generation itself is unchanged and its misses are fully charged.
  assumptions:
  - >-
    E/F_p is public, G = <P> has prime order N asymptotic to p, and every target
    is a generated public toy or certificate-bearing instance. No live key.
  - >-
    The factor base, arity, signed-source convention, relation sampler, batch
    size, stopping features, calibration split, sparse solver and descent rule
    are ALL frozen before any held-out stream is generated. A threshold selected
    after seeing a held-out stream is leakage and voids the cell.
  - >-
    Only independently verified elliptic point-sum relations enter the matrix;
    generator failures, duplicate relations and rejected roots remain charged.
  - >-
    The random-support law is a same-shape null, not a theorem about real Semaev
    supports; departures are measured rather than assumed away.
  - >-
    Any cryptographic extrapolation would require a separately justified scaling
    law for relation probability, core size, coefficient rank, fill and descent.
    None is claimed.
  proof_search_map:
    bottleneck: >-
      Whether the support-core evolution carries enough target-independent
      information to select a lower-cost stopping point AFTER all coefficient,
      retry and descent costs are included. Every claim here is a function of
      that.
    baseline_embedding:
      parameter_slice: >-
        A constant stopping threshold recovers the standard collect-a-fixed-row-
        surplus-then-solve pipeline. Disabling peeling recovers direct sparse
        elimination. Replacing real supports by matched random supports recovers
        the null core model.
      reproduction_check: >-
        PREFIX REPLAY, BLOCKING. Replay every complete toy relation stream at
        every prefix. The online reducer and a from-scratch reducer must agree
        EXACTLY on peel certificate, core support, coefficient rank, final factor
        logs and descent result. Exact agreement, not agreement within noise.
    observation_collision:
      observable: >-
        The degree histogram, peel count, 2-core dimensions and projected fill at
        a stream prefix.
      distinct_preimage_search: >-
        Search for prefixes with the SAME observable but different coefficient
        rank or different future optimal stopping point, and report their regret
        distribution. A large collision fiber proves the declared policy state is
        insufficient even when its average forecast is calibrated. This search is
        required, not optional, and its outcome is a primary metric.
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: >-
        Convert each verified relation prefix into a certified COMPLETE-cost
        curve rather than a rank-only or core-only statistic, so that the
        stopping decision is charged against the same total the baseline is
        charged against.
      predicted_gain: >-
        Stop before overcollection when the retained core is already cheap enough
        to solve, with the saving charged net of every retry it causes.
    - transform: core_certificate
      proposed_object: >-
        Store peel pivots, retained coefficients and reverse-substitution edges as
        a replayable solve certificate.
      predicted_gain: >-
        Prevents support shrinkage from being misread as factor-log recovery,
        which is the specific failure this lane is exposed to.
    - transform: representation_reduction
      proposed_object: >-
        Replace the absolute held-out cost ratio by the oracle-relative
        efficiency eta = (1 - r_online)/(1 - r_oracle), with r_oracle measured on
        the same streams.
      predicted_gain: >-
        Makes the effect size self-calibrating, so a cell with no headroom is
        reported as having no headroom instead of as a failure of the rule.
    quantifier_order: >-
      THERE EXISTS one target-independent stopping rule, trained on declared
      calibration curves, such that FOR ALL held-out parameter cells and FOR ALL
      random relation streams from the frozen generator its expected complete
      cost is below the preregistered fixed-threshold baseline. The existential is
      OUTSIDE, so one rule must work everywhere; no threshold may be chosen after
      reading held-out cost curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        A held-out toy scheduling advantage for ONE frozen relation generator, at
        the tested sizes, under the declared complete-cost accounting. It cannot
        certify a new relation law, an exponent improvement, or any ECDLP
        speedup.
      nearby_object_control: >-
        Random coefficient matrices whose row count, support-size distribution,
        column-degree histogram, duplicate rate, coefficient alphabet and batch
        arrival times match the real stream. A policy gain shared with this null
        is a generic sparse-matrix scheduling effect.
    proof_obligations:
    - claim: Every input row is a verified elliptic point-sum relation.
      responsibility: correctness
    - claim: Incremental and from-scratch reductions agree exactly at every prefix.
      responsibility: baseline
    - claim: Core solve and reverse peeling recover the same factor logarithms.
      responsibility: correctness
    - claim: The stopping state predicts held-out complete-cost minima.
      responsibility: success_probability
    - claim: Per-relation work, failures, linear algebra, retries and descent are all charged.
      responsibility: runtime
    - claim: Retained rows, fill, certificates and outputs fit the memory cap.
      responsibility: memory
    - claim: Real-stream behaviour is separated from the same-shape null.
      responsibility: strictness
    - claim: >-
        r_oracle is measured before any eta verdict, so a cell with no headroom
        is reported as underpowered rather than as a negative.
      responsibility: feasibility
    - claim: Every conclusion is scoped to the tested sizes, generator and budget.
      responsibility: scope
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: H-CORE-1
    formal_statement: >-
      FOR the tested sizes, after normalisation by the factor-base size B, the
      joint support-degree and 2-core process of frozen-generator relation
      streams has a stable distribution across adjacent toy sizes, in the sense
      that the total-variation distance between adjacent normalised joint
      distributions is at most 0.10.
    random_model_justification: >-
      Sparse random hypergraph core laws supply the baseline shape, and a
      rigorous random sparse GF(2) matrix and 2-core comparison is available in
      the literature the source names. NEITHER THEOREM IS TRANSFERRED to Semaev
      rows, and the stability across sizes is asserted, not derived.
    supporting_results:
    - >-
      'Penrose, Rank deficiency in sparse random GF(2) matrices, Electronic
      Journal of Probability 19 (2014), doi 10.1214/EJP.v19-2458. NAMED BY THE
      SOURCE RECORD AS primary_sources_checked. THIS TASK DID NOT OPEN IT AND
      THERE IS NO KN-LIT ENTRY FOR IT IN THIS CORPUS - a repository grep found it
      only in knowledge/SOURCES.md, knowledge/sources.json and
      knowledge/findings/KN-FIND-a8990a.md, not as a filed literature record. It
      is a POINTER and does not discharge this heuristic.'
    validation_experiment_ids:
    - EXP-ICEX-959b99
    falsification_condition: >-
      Normalised core or degree distributions show persistent nonconvergence, or
      total-variation distance between the largest two cells exceeds 0.10, or
      strong generator-seed dependence appears. Extrapolation across sizes is
      then rejected.
  - id: H-CORE-2
    formal_statement: >-
      FOR the tested sizes, the frozen state variables predict remaining
      sparse-linear-algebra and retry cost well enough to locate a prefix whose
      complete cost is within 5 percent of the oracle-optimal prefix, in median
      regret over held-out streams.
    random_model_justification: >-
      In matched sparse matrices, core dimensions and degree profiles constrain
      elimination work, but coefficient collisions create residual variance. The
      assumption is that the residual variance is small enough not to swamp the
      available headroom, which is exactly what the collision-fiber search
      measures.
    supporting_results:
    - >-
      None. No corpus record measures oversampling, rank profile or fill on real
      prime-field harvested matrices - IDEA-20260807-291968, read by this task,
      states that gap explicitly and PROPOSES to fill it. This heuristic is
      undischarged.
    validation_experiment_ids:
    - EXP-ICEX-959b99
    falsification_condition: >-
      Median regret exceeds 0.05 of complete fixed-baseline cost, or 90 percent
      prediction intervals cover fewer than 80 percent of held-out complete
      costs. The declared policy state is then insufficient.
  - id: H-CORE-3
    formal_statement: >-
      FOR the tested sizes, masked target descent has a retry distribution
      controlled by the same frozen relation generator, so its expected cost can
      be charged from held-out data with a finite mean inside the declared cap.
    random_model_justification: >-
      Independent target masks motivate a geometric-attempt baseline, but the
      empirical tail is authoritative for this test and the geometric model is
      only a comparison distribution.
    supporting_results:
    - >-
      'Amadori, Pintore and Sala, On the discrete logarithm problem for
      prime-field elliptic curves, IACR ePrint 2017/609. NAMED BY THE SOURCE
      RECORD AS primary_sources_checked and cited there for the prime-field
      factor-base, relation-collection, linear-algebra and descent pipeline. THIS
      TASK DID NOT OPEN IT AND THERE IS NO KN-LIT ENTRY FOR IT. Pointer only.'
    - >-
      'Semaev, Summation polynomials and the discrete logarithm problem on
      elliptic curves, IACR ePrint 2004/031. FILED IN THIS CORPUS AS KN-LIT-001
      with citation_verified: web; this task read only the KN-LIT-001 header, not
      the paper. It supplies the relation equation and NOT the stopping rule or
      the descent retry law.'
    validation_experiment_ids:
    - EXP-ICEX-959b99
    falsification_condition: >-
      Retry tails are seed-dependent, target-dependent, nonstationary, or too
      heavy for the declared expectation to be finite within the cap. Descent
      cost is then not chargeable from held-out data and no complete-cost ratio
      may be reported.
  structural_ingredients:
  - description: >-
      The relation equation that defines what enters the matrix.
    citation: knowledge/literature/KN-LIT-001.md
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- KN-LIT-001's header read on 2026-09-04,
      confirming it records Semaev, IACR ePrint 2004/031, with
      citation_verified web. THE PAPER ITSELF WAS NOT READ BY THIS TASK.
    role: supplies the relation equation, not the stopping rule
  - description: >-
      The record the source idea says supplies fixed row-surplus thresholds.
    citation: ledger/proposals/IDEA-20260807-291968.yaml
    provenance: internal
    verified_by: >-
      TASK-20260904-f2b3db, coordinator- READ AS A GREP FRAGMENT, and the
      fragment is decisive- it is status proposed and its own claim is that no
      record measures the oversampling factor, the row-weight distribution, the
      rank profile, the sparse-solve exponent or the memory footprint over prime
      fields. IT SUPPLIES NO THRESHOLDS. The source idea's characterisation is
      corrected here and the pointer is not used.
    role: recorded as a corrected inherited premise, not as an input
  - description: >-
      A rigorous random sparse GF(2) matrix and 2-core comparison model.
    citation: 'Penrose, Electronic Journal of Probability 19 (2014), doi 10.1214/EJP.v19-2458'
    provenance: recalled
    verified_by: null
    role: >-
      The null model's baseline shape. NOT OPENED BY THIS TASK, NO KN-LIT ENTRY
      IN THIS CORPUS. Pointer, not support.
  - description: >-
      The prime-field factor-base, relation-collection, linear-algebra and
      descent pipeline whose costs must be composed.
    citation: 'Amadori, Pintore and Sala, IACR ePrint 2017/609'
    provenance: recalled
    verified_by: null
    role: >-
      Names the stages that must be charged. NOT OPENED BY THIS TASK, NO KN-LIT
      ENTRY IN THIS CORPUS. Pointer, not support.
  reduction_chain:
    core_problem: >-
      The complete charged cost of one prime-field Semaev relation pipeline under
      an online stopping rule, against the best preregistered fixed
      overcollection rule, on held-out toy streams.
    corollaries: []
  predictions:
  - metric: oracle_headroom_r_oracle
    direction: lower
    minimum_effect: >-
      'Measured r_oracle at most 0.90 for a cell to be INFORMATIVE. This is
      measured by offline prefix replay before any online rule is scored. A cell
      with r_oracle above 0.90 has under 10 percent of complete cost on the table
      and is declared UNDERPOWERED with r_oracle reported.'
  - metric: oracle_relative_efficiency_eta
    direction: higher
    minimum_effect: >-
      'eta := (1 - r_online)/(1 - r_oracle). PRE-REGISTERED- eta at least 0.60 at
      the median with 90th-percentile r_online at most 1.00 records a scheduling
      advantage; eta at most 0.20 records none; between is INCONCLUSIVE. Scored
      only on held-out streams and only on informative cells.'
  - metric: absolute_held_out_cost_ratio
    direction: lower
    minimum_effect: >-
      'r_online at most 0.85 in median and at most 1.00 at the 90th percentile,
      RETAINED AS A SECONDARY AND EXPLICITLY CONDITIONAL NUMBER. It is reachable
      only if the best fixed rule''s surplus s satisfies 1/(1+s) at most 0.85,
      i.e. s at least 0.176; the measured s is reported beside it so a miss is
      never read as a failure of the mechanism when it is an absence of
      headroom.'
  - metric: incremental_reducer_prefix_agreement
    direction: higher
    minimum_effect: >-
      'Exactly 1.000000 for peel set, core support, coefficient rank and
      recovered logarithms, at every prefix of every completed stream. Not
      agreement within tolerance.'
  - metric: solve_and_masked_descent_success_rate
    direction: nondecreasing
    minimum_effect: >-
      No more than 0.02 absolute loss relative to the fixed-threshold baseline,
      with every failed descent converted into a charged retry.
  - metric: core_law_separation_from_matched_random_support_null
    direction: different
    minimum_effect: >-
      At least 0.10 total-variation distance in the joint normalised core-size
      and fill distribution, or else the scheduling effect is reported as
      GENERIC.
  - metric: regret_under_observation_collisions
    direction: lower
    minimum_effect: >-
      Median regret at most 0.05 of complete fixed-baseline cost over the
      collision fiber. Larger regret rejects the declared policy state.
  test_boundary:
    instances:
    - >-
      Public generated toy prime-order subgroups at 12, 14, 16, 18, 20 and 22
      bits; anomalous and smooth-order curves excluded before entry; every
      recovered logarithm verified by scalar multiplication.
    - >-
      Same-shape random sparse matrices matched on row weights, column-degree
      histogram, duplicate rate, coefficient alphabet and row arrival times.
    - >-
      Support-replacement ladder at 0, 25, 50, 75 and 100 percent replacement of
      real supports by degree-matched random supports, retaining coefficient
      alphabets.
    parameters:
      bit_sizes: [12, 14, 16, 18, 20, 22]
      arity_m: [3, 4]
      streams_per_completed_cell_minimum: 50
      calibration_sizes: [12, 14]
      held_out_sizes: [16, 18, 20, 22]
      informative_cell_gate_r_oracle_max: 0.90
      eta_advantage_threshold: 0.60
      eta_no_advantage_threshold: 0.20
    implementation: >-
      One frozen ordinary Semaev relation generator; one incremental reducer with
      a from-scratch reducer used only for prefix-replay verification; one sparse
      solver with a frozen ordering; one masked descent rule. Policy state
      variables read ONLY the coefficient matrix and its support hypergraph.
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 16
      maximum_runs: 400
  falsification_conditions:
  - >-
    A1 REPLAY, BLOCKING. Incremental reduction disagrees with from-scratch prefix
    replay in any completed cell. The instrument is wrong and nothing is
    interpreted.
  - >-
    A2 UNDERPOWERED, NOT SHRUNK. r_oracle exceeds 0.90 at a cell. The cell has
    under 10 percent headroom, no eta verdict is admissible, and the cell is
    reported UNDERPOWERED with r_oracle and the measured fixed-rule surplus s. It
    is NOT reported as a failure of the stopping rule.
  - >-
    A3 NO ADVANTAGE. eta at most 0.20 at the median on two successive informative
    sizes. The online rule captures effectively none of the available saving and
    the simpler fixed policy dominates on the tested scope.
  - >-
    A4 RANK DECEPTION. A support-predicted cheap core is coefficient-rank
    deficient often enough that charged retries erase the measured collection
    saving. The lossy projection is the failure and it is reported as such.
  - >-
    A5 OMITTED COST. The apparent advantage exists only when relation-generation
    failures, residual fill, target descent or emitted certificate bytes are
    omitted from the charge. Void; the complete-cost boundary is the claim.
  - >-
    A6 SAME-SHAPE NULL. Real-stream separation does not decay monotonically
    toward the matched null under progressive support replacement. The advantage
    is a generic sparse-matrix scheduling or implementation artifact and is
    reported as a controlled null.
  - >-
    A7 LEAKAGE. Any calibration threshold selected after seeing a held-out
    stream. The affected cells are void, not corrected.
  - >-
    A8 BUDGET. Collection-cap, wall-clock or memory exhaustion. Infrastructure
    under AGENTS.md rule 5, never evidence about the stopping rule.
  interpretation_limits:
  - >-
    CURVE-FREE STATUS RECORDED AS A PROOF, NOT AN ARM. Every policy state
    variable is a function of the coefficient matrix and its support hypergraph
    alone; no curve parameter, factor-base point or target enters it. A
    curve-free arm of the POLICY would be the identical computation and would
    prove nothing. It follows without experiment that any measured policy gain is
    about matrix statistics and not about elliptic-curve structure. What the
    matched random-support null and the decay ladder test is a different
    question- whether the STREAM's matrix statistics differ from a same-shape
    random stream - and that arm is required.
  - >-
    This proposal supplies no new source of relations and no claim that ordinary
    Semaev relations occur at the random-model rate.
  - >-
    A lower toy constant does not change the N^{1/2} rho or BSGS benchmark and
    does not establish any cryptographic-size advantage. The proposal remains
    dominated by Pollard rho, by BSGS, and possibly by the best offline fixed
    threshold, and says so.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED PLAINLY. Whether an online stopping
    rule helps at cryptographic B is not testable here and is not claimed. The
    ladder stops at 22 bits because a complete pipeline - harvest, peel,
    coefficient solve, retries and masked descent - must run to completion at
    least 50 times per cell inside the declared budget, and the largest cell
    already consumes most of it. Extrapolation would require a separately
    justified scaling law for relation probability, core size, coefficient rank,
    fill and descent, none of which exists.
  - >-
    Agreement with a random sparse GF(2) core model would describe a null, not
    prove that the real coefficient matrix has the required rank.
  - >-
    The policy is target-independent. Target-specific retraining, or an uncharged
    target relation table, is outside the claim.
  - >-
    NOVELTY IS UNVERIFIED. The source record asserts a complete repository screen
    of 79 RQ-ECDLP-002 proposals, 795 proposal files and a 1166-file legacy tree.
    This task did not reproduce that screen and does not inherit its conclusion.
  - >-
    Two of the three sources the record names as primary_sources_checked -
    Amadori-Pintore-Sala and Penrose - have NO KN-LIT entry in this corpus and
    were not opened by this task. They are pointers and support nothing.
  status: proposed
  proposed_by: idea-generator
