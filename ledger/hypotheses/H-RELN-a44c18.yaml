hypothesis:
  id: H-RELN-a44c18
  question_id: RQ-RELN-001
  derived_from_idea: IDEA-20260805-44bc0b
  status: proposed
  added: '2026-08-25'

  duplication_note: >-
    STATED FIRST. A hypothesis for the SAME parent proposal IDEA-20260805-44bc0b already
    exists as H-PATH-89d1d0, which the proposal itself names as the carrier of its
    proof_search_map. This record was drafted under identifiers supplied by the
    dispatching session; the coordinator subagent that wrote it mints none and did not
    choose to duplicate. A COORDINATOR MUST ADJUDICATE - supersede one under a decision
    record, or withdraw one - BEFORE EITHER IS APPROVED.

  statement: >-
    SCOPE. The frozen interface of the bounded-degree algebraic factor-base theorem
    (ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md, Theorems
    1, 1G, 2, 3) and the open universal question KN-OPEN-020, examined against two
    external index-calculus families. CLAIM TIER derivation for the counting statements,
    toy for every measured cell. NO ATTACK, NO ALGORITHM, NO FACTOR BASE PROPOSED, NO
    EXPONENT MOVED, NO PRIME-FIELD ECDLP CLAIM.

    THE HYPOTHESIS, IN FOUR PARTS.
    (C1) EQUIVALENCE. Theorem 1G's hypothesis Delta^m <= N^{1-epsilon} is EXACTLY
      chi <= 1 - epsilon, where chi := m log(Delta) / log(N) is the COVERAGE EXPONENT,
      and Theorem 3's success bound reads Pr[T in mF] <= 2^C N^{chi - 1}. The no-go's
      entire quantitative content is that one scalar.
    (C2) THE SEPARATING PREDICATE IS chi, NOT "ALGEBRAIC DESCRIPTION". Evaluated on the
      two families where index calculus demonstrably works: the NFS rational side, where
      chi = u log(B)/log(M) = 1 IDENTICALLY for every B by the definition of B-smooth;
      and the Gaudry/Diem subfield construction over E(F_{q^n}), where
      chi = n log(q)/log(q^n) = 1 EXACTLY. Both factor bases ARE algebraically
      described. Quantified over "algebraically described", KN-OPEN-020 is therefore
      FALSE with NFS as the witness; quantified over chi, it is a different and harder
      question that remains open.
    (C3) DESCRIPTION DENSITY IS THE MECHANISM. With delta := (bits to write the
      membership predicate) / |F|, a plane predicate of degree d over F_p has
      delta >= (d+1)(d+2) log2(p) / (6d) ~ (d/6) log2(p) - LINEAR in d - while chi rises
      only as m log(3d)/log(N) - LOGARITHMIC in d. NFS and Gaudry buy an unbounded base
      with an O(log) TOTAL predicate, so delta tends to 0. That is the separation, and it
      is information-theoretic rather than algebraic.
    (C4) THE DIAGNOSTIC IS NECESSARY, NOT SUFFICIENT, AND THIS IS PART OF THE CLAIM. A
      uniformly random subset of G of size B with m = log N / log B has chi = 1 and is
      useless. chi measures COVERAGE and says nothing about the cost of finding a
      decomposition, and the null object exists to make that limit measured rather than
      asserted.

    THE THEOREM IS NOT CLAIMED DEFECTIVE. Its hypothesis correctly excludes NFS and
    Gaudry-Diem, so no contradiction exists. The claim is about the theorem's SCOPE and
    about how the open universal question should be quantified.

  mechanism: >-
    DERIVED FROM THE THEOREM RECEIPT'S OWN INTERFACE.
    (1) THE INTERFACE. E/F_p a nonsingular plane cubic, G of prime order N = Theta(p),
    Z_p a target-independent projective locus with no component equal to E and finite
    intersection degree Delta_p, F a subset of G intersect (Ebar intersect Z_p)(F_p).
    Theorem 1 gives |F| <= Delta_p by Bezout, with Delta = 3d for a plane polynomial of
    degree d. Theorem 2 gives |mF| <= |F|^m <= Delta^m because an image is no larger than
    its domain. Theorem 3 converts min-entropy into Pr[T in mF] <= 2^C Delta^m / N.
    (2) THE ONE-SCALAR REWRITE. Taking logarithms, Delta^m <= N^{1-epsilon} is chi <= 1 -
    epsilon and the success bound is 2^C N^{chi-1}. This is a rewrite, not a theorem, and
    its whole value is that it makes the family comparable to families outside the
    interface, which the inequality in its original form invites nobody to do.
    (3) NEARBY OBJECT 1, NFS, WHERE THE CONCLUSION IS KNOWN FALSE. On the rational side
    F is the primes up to B, and a B-smooth integer of size M is a product of about
    u = log M / log B factor-base elements, so with m = u and Delta ~ B, chi = 1
    identically. It is not asymptotic; it is what B-smooth means.
    (4) NEARBY OBJECT 2, GAUDRY/DIEM, AN ELLIPTIC CURVE. F = {P : x(P) in F_q} has
    |F| ~ q, arity m = n and N ~ q^n, so chi = 1 exactly. WHAT MAKES chi = 1 AVAILABLE IS
    A SUBFIELD: a predicate of description length O(log q) selects q points out of q^n.
    Over a prime field there is no subfield, and that single structural fact is the honest
    content of the whole difficulty.
    (5) THE BOUNDED-DEGREE PRIME-FIELD FAMILY has Delta = 3d with m fixed and
    N = Theta(p), so chi = m log(3d)/log(p) tends to 0. Reaching chi = 1 at 256 bits with
    m = 4 needs 3d at least 2^64.
    (6) WHY delta IS THE MECHANISM AND NOT A SECOND OBSERVATION. Buying coverage by
    raising d costs description LINEARLY while buying only LOGARITHMIC coverage. Stated
    this way the obstruction is about the PREDICATE'S BUDGET rather than about "algebra",
    which is why the no-go feels stronger than it is.
    (7) WHAT NFS USES THAT E(F_p) LACKS. "Norm below B" is a SIZE condition at an
    archimedean place, not a Zariski-closed condition - cheap to describe, selects
    unboundedly many objects, and compatible with a multiplicative structure whose
    factorization is canonical and unbounded in length. E(F_p) has neither. THREE NAMED
    ESCAPES REMAIN OPEN AND ARE NOT GRADED: tuple predicates (the summation polynomial is
    a short predicate on a TUPLE, outside the single-point interface); predicates on a
    cover with a non-proper or infinite intersection, explicitly excluded by the
    receipt's own hypotheses; and a pulled-back size function, valuation or height
    playing the role of "norm below B".

  assumptions:
    - >-
      That the arity attributable to NFS is u = log M / log B rather than a fixed
      constant. Definitional, but it is the step a reviewer should attack first, because
      a different arity convention changes chi. The contract MEASURES the empirical arity
      distribution of B-smooth integers by exhaustive enumeration at toy M rather than
      assuming it.
    - >-
      That |F| ~ q and N ~ q^n for the Gaudry construction. Both are measured by
      exhaustive point enumeration at small (q, n), not assumed.
    - >-
      That description length is the right charge for a predicate. An implicit-membership
      predicate can be short while being expensive to evaluate, and delta does not charge
      evaluation. KN-OPEN-020's own text names implicit membership solvers as part of what
      keeps the universal question open, and delta does NOT close that gap.
    - >-
      NO NFS OR GAUDRY PAPER HAS BEEN READ BY THIS PROGRAM. The constructions are recalled
      and are stated from their definitions so that a reviewer can reject the
      identification directly; every asymptotic beyond a counting identity is labelled
      recalled and unverified, and the contract converts the load-bearing ones into
      measurements.

  proof_search_map:
    bottleneck: >-
      Whether Theorem 1G's hypothesis is EXACTLY the condition chi <= 1 - epsilon, and
      whether chi evaluated on the two external families really equals 1 under the arity
      convention used. Everything else - the escapes, the restatement, delta - is
      downstream of those two counting steps and neither needs compute.
    baseline_embedding:
      parameter_slice: >-
        The bounded-degree prime-field family the theorem covers IS the slice at which
        the diagnostic must reproduce the theorem's own verdict: chi tends to 0 there, and
        the four worked cells (m=2,d=10 at 64 bits; m=3,d=10 at 64; m=4,d=30 at 256;
        m=2,d=100 at 256) are exact arithmetic a reviewer can redo by hand.
      reproduction_check: >-
        Two frozen fixtures. FIRST, symbolic: assert that Delta^m <= N^{1-epsilon} and
        chi <= 1 - epsilon are the same condition. SECOND, empirical: on an explicit toy
        curve with an explicit plane predicate of degree d, enumerate F exhaustively and
        assert |F| <= 3d. That is Bezout, so it MUST hold; a violation means the interface
        has been misread and everything downstream is void.
    observation_collision:
      observable: 'the pair (chi, delta) attached to a factor-base construction'
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, WHICH IS WHY THE NULL IS BLOCKING. The fibre
        over (chi, delta) = (1, 0) contains NFS, Gaudry-Diem AND a uniformly random subset
        of G of size B with m = log N / log B, which is worthless. THE COLLISION IS REAL
        AND IS THE POINT: it bounds the diagnostic to NECESSITY, and the random-subset
        null is built to exhibit the collision rather than to be defeated by it. A record
        citing chi = 1 as evidence that a construction works has misused this hypothesis,
        and the null makes that misuse visible.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry the pair (chi, delta) where prior treatments carried the phrase
          "algebraically described", so the no-go's hypothesis becomes comparable across
          families inside and outside its interface.
        predicted_gain: >-
          A nearby-object control for KN-OPEN-020 that the entry has never had, plus a
          restatement over the predicate that actually separates. No attack, no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold chi fixed at 1 and vary the construction across NFS, Gaudry-Diem and a
          matched random subset, exhibiting that coverage alone does not determine
          usefulness.
        predicted_gain: >-
          A permanent, measured statement of the diagnostic's limit, recorded before
          anyone cites it.
    quantifier_order: >-
      CLAIMED. FOR the four declared families, chi and delta take the stated values, and
      FOR ALL constructions inside the theorem's single-point interface, raising the
      plane-predicate degree buys chi only logarithmically while costing delta linearly.
      NOT CLAIMED: any universal statement about prime-field factor bases. The restated
      question - is there a prime-field factor base with chi tending to 1 and polylog
      delta, with membership and decomposition CHARGED? - is strictly harder than the
      current phrasing and is left open.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Theorem 1G's hypothesis is the condition chi <= 1 - epsilon; the two external
        families that work sit at chi = 1 exactly while the covered bounded-degree family
        has chi tending to 0; and within the theorem's interface delta grows linearly in
        the degree that buys chi logarithmically." It certifies NOTHING about whether any
        prime-field index calculus exists, nothing about attack cost, and it does not
        close KN-OPEN-020 - it restates it.
      nearby_object_control: >-
        The uniformly random subset of matched size and arity, on which chi = 1 holds
        while usefulness fails. It is the object on which the hoped-for reading
        ("chi = 1 means it works") must fail, and it is constructed for exactly that
        purpose.
    proof_obligations:
      - claim: Theorem 1G's hypothesis is equivalent to chi <= 1 - epsilon.
        responsibility: correctness
      - claim: chi_NFS = 1 identically under the arity convention m = u.
        responsibility: correctness
      - claim: chi_GD = 1 from measured cardinalities at small (q, n).
        responsibility: size
      - claim: The Bezout bound |F| <= 3d holds on an explicit toy predicate.
        responsibility: baseline
      - claim: A matched random subset attains chi = 1 with comparable coverage, bounding the diagnostic to necessity.
        responsibility: strictness
      - claim: delta separates the four families by the stated orders of magnitude.
        responsibility: scope
      - claim: No status change is proposed for KN-OPEN-020 or the theorem receipt.
        responsibility: interface

  asymptotic_claim: null
  asymptotic_claim_note: >-
    Explicitly null. No exponent is moved or claimed. The exponent this audit BEARS ON is
    the one KN-OPEN-020 is about - whether any prime-field index calculus can beat
    N^{1/2} - and the contribution is to identify the quantity that must reach 1 before
    such a claim is even coherent, not to move anything.

  heuristic_assumptions:
    - id: HEUR-RELN-1
      formal_statement: >-
        NOT LOAD-BEARING FOR THE HEADLINE. chi <= 1 - epsilon is Theorem 1G's hypothesis
        with logarithms taken; chi_GD = 1 is a cancellation of n log q; chi_NFS = 1 is the
        definition of B-smooth. Bezout and the image-cardinality bound are theorems in the
        receipt that was read in full. This entry records that the headline is
        unconditional.
      random_model_justification: 'Not applicable: nothing is modelled as random.'
      supporting_results: []
      validation_experiment_ids: [EXP-RELN-e48d01]
      falsification_condition: >-
        Symbolic re-derivation showing the hypothesis is NOT equivalent to
        chi <= 1 - epsilon.
    - id: HEUR-RELN-2
      formal_statement: >-
        FOR ALL B in the sieve's parameter range and FOR ALL M, the number of distinct
        B-smooth integers up to M satisfies log Psi(M,B) / log M tending to 1, equivalently
        u log u = o(log M) with u = log M / log B.
      random_model_justification: >-
        The Dickman model gives Psi(M,B) = M rho(u)(1+o(1)) with log rho(u) = -u log u
        (1+o(1)). THE DICKMAN ASYMPTOTIC IS RECALLED AND UNVERIFIED - no paper was read
        and none is cited.
      supporting_results: []
      validation_experiment_ids: [EXP-RELN-e48d01]
      falsification_condition: >-
        Measured log Psi(M,B)/log M drifting away from 1 as B falls across the tested grid
        in a way the model does not predict.
    - id: HEUR-RELN-3
      formal_statement: >-
        For a uniformly random subset R of a group G of order N with |R| = B, the m-fold
        sumset satisfies E|mR|/N ~ 1 - exp(-B^m / N).
      random_model_justification: >-
        Balls-in-bins, treating the B^m ordered tuples as independent uniform draws.
        INDEPENDENCE IS FALSE - sums share summands - so this is a heuristic, is labelled
        one, and is used only to set a pre-run prediction for the null, never as a result.
      supporting_results: []
      validation_experiment_ids: [EXP-RELN-e48d01]
      falsification_condition: >-
        Measured |mR|/N outside the pre-registered band at any cell, which means the null's
        forced value was wrong and the null must be re-derived before the treatment arm is
        interpreted.

  predictions:
    - metric: chi for the NFS rational-side factor base, at every B in the declared sweep
      direction: different
      minimum_effect: >-
        EXACTLY 1.000, independent of B, within the arity estimator's declared
        discretisation. A forced value derived before any run. If measured chi depends on
        B, the identification m = u is wrong and the central comparison is falsified.
    - metric: >-
        chi for Gaudry/Diem from EXHAUSTIVELY ENUMERATED cardinalities at (q,n) in
        {(5,3),(7,3),(11,2),(13,2)}
      direction: different
      minimum_effect: >-
        1.000 plus or minus 0.05 at every cell, the tolerance covering the Hasse deviation
        of #E(F_{q^n}) from q^n and of |F| from q. Any cell below 0.9 means the
        identification is wrong at small parameters and the extrapolation must be withdrawn.
    - metric: log2 of the plane-curve degree required to reach chi = 1 at log2 N = 256 with m = 4
      direction: higher
      minimum_effect: >-
        d at least 2^64/3, i.e. log2 d at least 62.4. Derived, not measured. Any
        construction claiming a bounded-degree prime-field factor base with chi near 1 must
        exhibit a degree at least this large and be charged delta ~ (d/6) log2 p per element.
    - metric: coverage fraction |mF|/N for the Gaudry subfield base versus a SIZE-MATCHED uniformly random subset, same m
      direction: different
      minimum_effect: >-
        BOTH exceed 0.3 at every cell where |F|^m >= N. THE POINT OF THIS PREDICTION IS
        THAT THE TWO AGREE: agreement shows chi measures coverage and NOT usefulness,
        which is the honest limit of the diagnostic and must be recorded before anyone
        cites it.
    - metric: delta, description bits per factor-base element, for the four families
      direction: different
      minimum_effect: >-
        A separation of at least 6 orders of magnitude at the 256-bit cell: delta tending
        to 0 for NFS and Gaudry against at least 4.3e17 bits per element for a plane
        predicate at d = 2^64/3. If delta does not separate the families, the
        description-density half is dead and only the chi rewrite survives.
    - metric: Bezout check |F| <= 3d on an explicit toy plane predicate, per degree
      direction: lower
      minimum_effect: >-
        Holds at every degree. It is a theorem; a violation means the interface has been
        misread and no conclusion may be reported.

  test_boundary:
    instances: >-
      Four declared families - NFS rational side, Gaudry/Diem subfield base, the
      bounded-degree prime-field family, and a size-matched uniformly random subset -
      instantiated at toy parameters where every cardinality entering chi is COUNTED
      rather than assumed; plus an explicit toy curve with explicit plane predicates for
      the Bezout fixture.
    parameters:
      gaudry_cells: [[5, 3], [7, 3], [11, 2], [13, 2]]
      nfs_toy_M: 'a grid of toy M with a grid of B, small enough for exhaustive smooth-integer enumeration'
      plane_degrees: [1, 2, 5, 10, 30, 100]
      bounded_degree_cells: [[2, 10, 64], [3, 10, 64], [4, 30, 256], [2, 100, 256]]
      random_null_seeds: 20
    implementation: >-
      Python 3.11, exact integer arithmetic, pure Python plus numpy. E(F_{q^n}) built by
      exhaustive enumeration over an explicit polynomial basis; B-smooth integers
      enumerated exactly; sumsets |mF| and |mR| computed exactly at every cell. No Sage,
      no Groebner, no solver is required.
    budget:
      wall_clock_seconds: 1800
      total_cpu_hours: 1.0
      memory_gb: 4
      maximum_runs: 20

  distinguishable_outcomes:
    - outcome: 'chi_NFS IS NOT 1, or the theorem hypothesis is not equivalent to chi <= 1 - epsilon.'
      what_observing_it_would_mean: >-
        (C1) or (C2) is false. The central comparison fails and this record is withdrawn
        by a superseding record. Zero compute, decisive, and the cheapest possible outcome.
    - outcome: 'BEZOUT FIXTURE FAILS: |F| > 3d on an explicit toy predicate.'
      what_observing_it_would_mean: >-
        The theorem's interface has been misread here. NO CONCLUSION about the
        bounded-degree family may be reported from any arm, and the misreading is the
        deliverable.
    - outcome: 'GAUDRY POSITIVE CONTROL FAILS: chi far from 1, or coverage not reaching a constant fraction.'
      what_observing_it_would_mean: >-
        The enumeration code is wrong, or the identification of the Gaudry cardinalities
        is wrong at small parameters. The instrument is broken and no negative about the
        bounded-degree family may be reported.
    - outcome: >-
        FULL AUDIT HOLDS. chi = 1 for both external families, chi tending to 0 for the
        bounded-degree family at the four cells, delta separating by the predicted orders,
        and the Bezout and Gaudry controls passing.
      what_observing_it_would_mean: >-
        (C1), (C2) and (C3) hold. KN-OPEN-020 as posed quantifies over the wrong
        predicate, with NFS as an explicit witness, and the corrected question is the
        chi-and-delta one, which is strictly harder. This RESTATES the open problem and
        supplies the nearby-object control it has never had. IT CLOSES NOTHING and it
        proposes no status change; those are separate Coordinator decisions.
    - outcome: >-
        RANDOM NULL COVERS COMPARABLY, as predicted - the matched random subset reaches a
        coverage fraction comparable to the Gaudry base at chi = 1.
      what_observing_it_would_mean: >-
        (C4) is CONFIRMED. chi is established as a NECESSARY-ONLY diagnostic, and that
        limit must travel permanently with the record. This is the outcome the null is
        built to produce and it constrains every future citation of chi.
    - outcome: >-
        RANDOM NULL COVERS FAR LESS than the balls-in-bins prediction.
      what_observing_it_would_mean: >-
        HEUR-RELN-3 is falsified: the sumset of a random subset is structured and the
        counting behind the null is wrong. The null's forced value must be re-derived
        before the treatment arm is interpreted at all.
    - outcome: >-
        delta DOES NOT SEPARATE the families by the predicted orders.
      what_observing_it_would_mean: >-
        (C3) is falsified. The description-density half is dead and only the chi rewrite
        survives, which is a materially weaker contribution and is reported as such rather
        than as a partial success.
    - outcome: >-
        SOMEONE EXHIBITS an algebraically described prime-field factor base with chi
        tending to 1 and polylog delta.
      what_observing_it_would_mean: >-
        (C3) is refuted outright and this would be the single most valuable outcome
        available here. It is not something this contract can produce, but it is recorded
        as the falsifier so the record is honest about what would overturn it.

  falsification_conditions:
    - chi_NFS is not 1 under the declared arity convention.
    - The theorem's hypothesis is not equivalent to chi <= 1 - epsilon.
    - The Bezout positive control fails on an explicit toy predicate.
    - The Gaudry positive control fails - chi far from 1 or coverage not reaching a constant fraction.
    - Measured |mR|/N falls outside the pre-registered balls-in-bins band, falsifying HEUR-RELN-3.
    - delta fails to separate the four families, which kills the description-density half.
    - >-
      An algebraically described prime-field factor base with chi tending to 1 and polylog
      delta is exhibited, which refutes (C3) outright.

  interpretation_limits:
    - >-
      NOTHING HERE IS AN ATTACK, AN ALGORITHM OR AN EXPONENT. No factor base is proposed,
      no relation is collected, no cost is claimed against Pollard rho, and no prime-field
      index calculus is made feasible. Pollard rho remains the ECDLP baseline.
    - >-
      NO STATUS CHANGE is proposed for KN-OPEN-020, for IDEA-20260801-021, for the theorem
      receipt, or for any decision citing them.
    - >-
      THE THEOREM IS NOT CLAIMED DEFECTIVE. Its hypothesis correctly excludes NFS and
      Gaudry-Diem; there is no contradiction. The claim is about SCOPE and quantification.
    - >-
      chi MEASURES COVERAGE ONLY. Decomposition-search cost, membership cost, linear
      algebra, relation rank and descent are all outside it. Citing chi = 1 as evidence
      that a construction works misuses this record.
    - >-
      THE THREE NAMED ESCAPES ARE NOT GRADED, RANKED OR ENDORSED. Naming them is the
      forward guidance a closure owes; it is not a claim that any is promising, and escape
      (iii) overlaps a lane where this program holds a scoped negative that nothing here
      reopens or contests.
    - >-
      NO NFS OR GAUDRY PAPER WAS READ. If the recalled constructions are misdescribed, the
      nearby objects are misidentified, and the contract states each construction from its
      definition so a reviewer can reject the identification directly.

