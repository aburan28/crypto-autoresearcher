hypothesis:
  id: H-RELN-10ad6b
  id_allocation_provenance: >-
    H-RELN-10ad6b was pre-minted by the orchestrating session with
    tools/allocate_id.py and confirmed free with --check before this record
    was authored; this agent did not re-mint and did not scan state for a
    next free number.
  question_id: RQ-RELN-61638a
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. GOAL-RELN-001 (factor-base decomposition
    probability audit) is the natural host, as RQ-RELN-61638a and the source
    proposal both say; binding is a Coordinator ledger-archive act recorded
    separately and this record does not perform it.
  source_proposal: IDEA-20260906-79ff48
  status: proposed
  proposed_by: coordinator
  task_id: null
  recorded_at: '2026-09-06'
  novelty_status: unverified

  statement: >-
    For prime-order short-Weierstrass curves E/F_p with the negation-closed
    x-interval factor base of nominal size B = ceil((6N)^{1/3}) at arity
    m = 3, the excess over the random-partition selection null of the
    precision lift lambda(D, pi) = Pr[c_D(r) >= 1 | r in S] / Pr[c_D(r) >= 1]
    and of the yield lift rho(D, pi) = E_{r in S}[c_D(r)] / E_{r in G}[c_D(r)]
    (IDEA-20260830-c5c614's definitions, unchanged) of the top-sigma
    held-out slice S, sigma in {1/8, 1/32}, of any predictor in the frozen
    trained class (a K = 3 inductive message-passing model and a
    gradient-boosted tree model on coordinates-only features, regimes F0 and
    F1), after subtraction of the Z/N-random lookup capacity, decays across
    the growth arm N in {2^14, 2^16, 2^18, 2^20, 2^24} with a fitted log-log
    slope whose interval contains -1/2 and excludes 0 (or sits inside the
    Holm-corrected null band at every rung) for BOTH model classes with the
    GNN-minus-trees difference inside the null band, whereas a slope interval
    containing 0 and excluding -1/2 on the E/x-interval arm, replicated
    across >= 3 curves and >= 3 training seeds with every control cell in
    band, is the distinguishable alternative that refutes this statement at
    toy scale over the trained class.

  mechanism: >-
    OBJECT. The tracked object is the two-cell pushforward of the
    decomposition-count vector c_D along the partition {top-sigma predicted
    slice, complement} that a trained coordinates-only function f_theta
    induces on held-out targets, together with the predictor's charged
    evaluation cost c_f (representation class R1, affine coordinates; attack
    stage relation collection; trichotomy class coordinate-dependent). The
    operation set is generate-and-filter (draw R = aP + bQ, evaluate f_theta
    on the coordinates of R and of k = 8 fixed translates, spend a solve only
    if R is in the slice). Nothing propagates under translation and nothing
    is claimed that would.
    WHY A LIFT COULD EXIST. Sigma_3(D) is the projection of the algebraic
    correspondence cut out by Semaev's S_4(x(R), x_1, x_2, x_3) applied to a
    structured box on the x-line, so any bias of that projection with
    respect to a cheap x-line function is visible from x(R) alone; the seed
    brief's INV-5 (unreviewed) reads the m = 3 count as the number of conics
    through -R with three residual intersections in D, which motivates the
    L(4 O) evaluation vector (1, x, y, x^2) as a feature.
    WHY THE PREDICTION IS DECAY. Under heuristic H1 (x-line additive
    pseudorandomness for the trained class) the slice total of ANY predictor
    in the class is sigma C(B+2, 3) (1 + O(N^{-1/2+eps})), so the excess of
    rho and lambda over the selection null decays like N^{-1/2+o(1)}. The
    trained class CONTAINS c5c614's frozen ten-member grammar as a parameter
    slice (bit thresholds and Legendre classes are depth-1 trees and
    one-layer readouts), so a null here is a strictly stronger closure than
    the grammar's and a positive here would be strictly more surprising.
    WHY THE GRAPH MAY NOT MATTER. In the inductive protocol a held-out target
    has no incident relation nodes (its edges are its labels), so message
    passing over certified decompositions enters the held-out prediction
    only through a pooled global context g_theta; the GNN-specific claim is
    exactly that this context adds nothing beyond trees on the same
    per-target and base-summary features, predicted difference within the
    null band.
    WHY THE RANDOM ARMS ARE ANALYTIC NULLS. By affine exchangeability (INV-3)
    and the in-record covariance derivation Cov(c_D(r), c_D(r')) = -M/N^2
    for an i.i.d. uniform base (heuristic H2, unreviewed), training labels
    on a random-base arm carry no second-order information about held-out
    labels except through D itself, so any lift on Z/N-random is the model
    reading D's coordinates and implementing part of the Theta(B) sumset
    lookup at charged cost; that lift is subtracted from the E arms at
    matched budget and never reported as structure, and E/random must agree
    with Z/N-random within band (nearby-object control).
    WHY THE POSITIVE CONTROL HAS A KNOWN NUMBER. In Z/N with the
    negation-closed interval base +-[1, B_eff] the 3-fold multiset sumset is
    [-3 B_eff, 3 B_eff], of 6 B_eff + 1 elements, of density below 1/32 at
    every rung, so a perfect ranker attains lambda = rho = 1/sigma exactly
    (the conservation ceiling); the pass threshold is half that ceiling.
    INSTRUMENT, NOT RESULT. A learned predictor's accuracy, AUC or lift is
    never a result; the deliverables are the fitted decay exponent with its
    interval, the GNN-minus-trees difference, the measured c_f against the
    Theta(B) lookup, and, only if a null-separated lift survives, three
    tables (slice membership, permutation importances, partial dependence)
    handed to the symbolic-regression sibling IDEA-20260906-1f6bfe /
    EXP-RELN-141a86 for compression into a candidate invariant that is then
    a proof obligation.

  assumptions:
    - >-
      Targets are generated as R = aP + bQ with a, b uniform, the scalars are
      discarded, and a rejected target costs one point addition plus one
      predictor evaluation c_f (standard relation-collection convention).
    - >-
      FROZEN COUNTING CONVENTION (chosen here because the proposal left it to
      the contract). Every arm uses a NEGATION-CLOSED base of nominal size
      B = 2 B_eff, B_eff = ceil(ceil((6N)^{1/3}) / 2), counted as size-3
      multisets from D with repetition (unreduced), so that
      sum_r c_D(r) = C(B+2, 3) exactly (KN-FIND-007). Targets r in D (the
      INV-2'' forced cluster, c_D(Q) >= B_eff for Q in D via the multisets
      {P, -P, Q}) are MASKED from training, validation, held-out scoring and
      the selection null on every arm, and their lift is reported separately
      as a theorem, never as a discovery.
    - >-
      Exhaustive labels at 2^14, 2^16, 2^18, 2^20 come from the exhaustive
      enumeration battery EXP-RELN-f202be (IDEA-20260906-d1494b) when count
      vectors exist for the identical curve, base seed and convention, and
      otherwise from the contract's own enumeration stage; either way the
      closed-form total check has deviation exactly 0 and a random sample of
      claimed decompositions is re-added independently by the run wrapper.
      Labels at the sampled 2^24 rung come from the Theta(B) lookup
      R - d in D + D over a sorted pair-sum table, every claimed
      decomposition carrying a three-point certificate re-verified by the
      wrapper (docs/claims-and-verification.md).
    - >-
      The node ordering of every graph and feature table is shuffled with a
      seed independent of the target-generation seed; no positional
      encoding, node index or enumeration order is ever a feature. In the
      exhaustive setting the enumeration order of targets IS the discrete
      logarithm, so this is a leak channel and the static audit is blocking.
    - >-
      Model capacity and training budget are frozen in the contract and
      identical across arms; hyperparameters are selected on a VALIDATION
      split of the training targets only, never on held-out targets, with
      the same selection protocol for every arm.
    - >-
      OFF-LIMITS COMPONENT NAMED. The x-interval base is a bounded-degree
      algebraic base in KN-OPEN-020's scoped-out class; it is the OBJECT
      whose count vector is measured, not a proposed factor base, and nothing
      here proposes a base that escapes KN-OPEN-020.
    - >-
      Toy scale binds. N <= 2^20 exhaustive, 2^24 sampled, m = 3, generated
      prime-order curves (3 per rung), B = ceil((6N)^{1/3}); nothing is
      claimed at cryptographic scale.

  predictions:
    - metric: >-
        sigma = 1 baseline slice and closed-form total check per arm per rung
      direction: different
      minimum_effect: >-
        FORCED EXACT. rho = lambda = 1 at sigma = 1; slice total plus
        complement total equals C(B+2, 3) with deviation exactly 0. Any
        deviation halts the run as an implementation error.
    - metric: >-
        Z/N-interval positive control, lambda and rho of the top-sigma
        held-out slice, both model classes, coordinates-only features
      direction: higher
      minimum_effect: >-
        lambda >= 4 and rho >= 4 at sigma = 1/8; lambda >= 16 and rho >= 16
        at sigma = 1/32 (half the conservation ceiling 1/sigma). Expected
        value 1/sigma. A cell below threshold is UNINFORMATIVE for that model
        class at that rung and no negative may be reported from it.
    - metric: >-
        Z/N-random structure-free control, excess of rho and lambda over the
        selection null, both model classes
      direction: different
      minimum_effect: >-
        Predicted within the Holm-corrected 2-sigma band of the analytic
        exchangeable null. If above band the excess is lookup capacity,
        recorded with the measured c_f, subtracted from the E arms at matched
        budget and never reported as structure. E/random must agree with
        Z/N-random within band.
    - metric: >-
        label-permutation null on every arm and the E/log-interval canary
        with coordinates-only features
      direction: different
      minimum_effect: >-
        Predicted within band on every arm. A permuted-label lift or a
        canary lift above band is a LEAK and halts the run.
    - metric: >-
        E/x-interval excess of rho and lambda over the selection null, per
        rung, class, regime and sigma, after subtracting Z/N-random lookup
        capacity
      direction: different
      minimum_effect: >-
        Minimum reportable excess at each rung is the Holm-corrected 2-sigma
        band of the analytic null at that rung (reference arithmetic at
        N_test = N/2, Delta = 1: about 0.12 at 2^14 and 0.015 at 2^20 for
        sigma = 1/32, 0.055 and 0.007 for sigma = 1/8; replaced by the
        measured Delta, mu and actual N_test). Below that it is reported as
        inside band, which is the predicted outcome, not as an effect.
    - metric: >-
        fitted slope of log(excess of rho over null) against log N on the
        E/x-interval arm, four exhaustive rungs plus the sampled 2^24 rung,
        per class, regime and sigma
      direction: different
      minimum_effect: >-
        Compared against the two values copied from c5c614 and no sign is
        pre-committed. Interval containing -1/2 and excluding 0 (or excess
        inside band at every rung so that no slope is fittable) reads as
        square-root cancellation, the trained class is CLOSED with an
        exponent attached; this is the predicted outcome. Interval
        containing 0 and excluding -1/2 with every control in band reads as
        ALIVE and refutes this hypothesis at toy scale over the trained
        class. Interval containing both is underpowered and is reported as
        such with the number of additional rungs computed.
    - metric: >-
        GNN-minus-trees difference in excess lift, same features, splits and
        budget, per arm per rung
      direction: different
      minimum_effect: >-
        Predicted approximately 0, |difference| within 2 sigma of the
        selection null. A positive difference replicating across >= 3 curves
        and >= 3 seeds that does not shrink with N is an instrument finding
        about the pooled context g_theta, not a finding about the curve.
    - metric: >-
        INV-6 theorem arm, lambda on the slice 'some translate R - P_i is
        2-decomposable', k = 8, indicator supplied, E/x-interval only
      direction: higher
      minimum_effect: >-
        lambda >= 1.4 at mu ~ 1 (theoretical value 1 / Pr[c_D >= 1], about
        1.5 to 1.6 at these rungs). E-side instrument check; failure marks
        the E cells of that class and rung uninformative.
    - metric: >-
        predictor evaluation cost c_f per target in point-addition
        equivalents versus the Theta(B) lookup, measured in-process
      direction: lower
      minimum_effect: >-
        Predicted c_f of about 10 to 15 point-addition equivalents against
        B = 48 to 466 lookups per target; a measured ratio
        c_f / (B lookups) >= 1 at every rung closes the cost half at these
        parameters regardless of lift.

  test_boundary:
    instances:
      - >-
        Three generated prime-order short-Weierstrass curves E/F_p per rung
        at N ~ 2^14, 2^16, 2^18, 2^20 (exhaustive) and 2^24 (sampled), with
        Z/N arms run at the same N as each curve's order; 15 curves total.
      - >-
        Five arms per rung: E/x-interval (object), E/random matched at the
        same nominal and effective size, Z/N-interval +-[1, B_eff] (positive
        control), Z/N-random (structure-free negative control),
        E/log-interval canary {[+-j]P, j in [1, B_eff]}; plus the INV-6
        theorem arm on E/x-interval.
    parameters:
      arity_m: 3
      base_size_rule: >-
        B_eff = ceil(ceil((6N)^{1/3}) / 2); nominal B = 2 B_eff (about 48, 74,
        118, 186, 466 at the five rungs)
      convention: negation-closed base, unreduced size-3 multisets, targets in D masked
      sigma:
        - 0.125
        - 0.03125
      model_classes:
        - inductive message-passing model, K = 3, width 64, mean and sum aggregation
        - gradient-boosted tree ensemble, frozen grid
      feature_regimes:
        - F0 per-target coordinates-only
        - F1 = F0 plus base-summary features
      split_by_target: 50/10/40 train/validation/held-out by an independent seed
      selection_null_draws: 1000
      sampled_rung_targets: 163840
    implementation: >-
      No implementation exists under this design. Python 3 with pinned
      versions recorded in environment.json; exact enumeration and point
      arithmetic in the program's existing prime-field elliptic-curve code
      or an equivalent declared in source/; message-passing model in a
      declared tensor library on CPU; gradient-boosted trees in a declared
      library; label, feature and model code paths separated and audited
      statically. Full contract at experiments/EXP-RELN-82f487/specification.yaml.
    budget:
      enforcement: advisory
      wall_clock_seconds_per_run: 172800
      total_cpu_hours: 400
      maximum_memory_gb: 16
      maximum_runs: 30
      maximum_workers: 4

  falsification_conditions:
    - >-
      Fitted slope interval containing 0 and excluding -1/2 on the
      E/x-interval arm for either model class at either sigma, replicated
      across >= 3 curves and >= 3 training seeds, with every control cell in
      band and after subtracting lookup capacity. THE STATEMENT IS REFUTED at
      toy scale over the trained class; heuristic H1 fails for the learned
      class; the output goes to IDEA-20260906-1f6bfe / EXP-RELN-141a86 and
      to a proof attempt against INV-4c; still not an algorithm.
    - >-
      A DECAYING LIFT (slope interval containing -1/2 and excluding 0, or
      excess inside band at every rung) is the NULL OUTCOME, is the
      hypothesis's prediction, and is NOT a failure of the instrument or of
      the experiment; it is a reportable bounded obstruction with a number.
    - >-
      THE INSTRUMENT fails, and NEITHER outcome may be read, only if the
      Z/N-interval positive control is not recovered to at least half its
      ceiling by a model class at a rung (that class and rung are
      uninformative), or the label-permutation null or the canary sits above
      its band (leak; halt for audit), or E/random and Z/N-random disagree
      beyond band (pipeline fault), or a reproduction fixture deviates
      (implementation error). None of these is evidence about the
      hypothesis.
    - >-
      A GNN-minus-trees difference above band, replicated and non-shrinking,
      refutes the 'graph context adds nothing' clause only; it is an
      instrument finding to be explained by inspecting g_theta.

  interpretation_limits:
    - >-
      Toy scale: N <= 2^20 exhaustive, one sampled rung at 2^24, m = 3,
      generated curves. A fitted exponent over five rungs is a trend with a
      wide interval and may not be quoted as an asymptotic rate.
    - >-
      Closure is over the TRAINED CLASS ONLY (two architectures, frozen
      budgets, two feature regimes). A learned predictor's null is not a
      non-existence proof; a wider class, feature set or budget is a new
      record.
    - >-
      No ECDLP claim in any outcome. A surviving lift is an existence
      witness for representation-visible structure in c_D at toy scale, an
      input to symbolic regression and a proof obligation, not a speedup; a
      null is a bounded obstruction with a number.
    - >-
      A GNN accuracy, AUC or lift is never a result; the outputs are the
      exponent, the GNN-minus-trees difference, the cost ratio and, in the
      refuting branch, the handoff tables.
    - >-
      Measures neither coverage nor rank nor solve cost and may not be cited
      about any of them.
    - >-
      The x-interval base is in KN-OPEN-020's scoped-out class and is the
      measured object, not a proposed base.
    - >-
      Novelty is not adjudicated; every external reference is recalled and
      the crypto-kb index was not queried in this session.
    - >-
      The in-record covariance derivation (H2) and the seed brief's INV-2 to
      INV-6 are unreviewed sketches treated as candidate statements; any of
      them failing empirically is itself reportable.

  proof_search_map:
    bottleneck: >-
      The EXISTENCE of a cheap representation-decidable predicate on targets
      whose lift over the exchangeable null does not decay with N. Every
      other step of the relation-collection ledger is pinned by conservation
      (target count m! N / B^{m-1}) or lives in another channel (solve,
      linear algebra, arity). c5c614 searched a ten-member grammar; this
      record searches a learned class containing that grammar, so its null
      is strictly stronger.
    baseline_embedding:
      parameter_slice: >-
        c5c614's frozen grammar is a parameter slice of the learned class: a
        top-k-bit or bottom-k-bit predicate on x(R) is a depth-k tree on the
        bit features and a one-hidden-layer readout with a threshold, and
        the Legendre-class predicate is a depth-1 split on the Legendre
        feature. The k = 1 (sigma = 1) slice reproduces KN-FIND-007
        (rho = lambda = 1 identically).
      reproduction_check: >-
        Two frozen fixtures. (i) sigma = 1 returns rho = lambda = 1 to
        floating-point exactness on every arm and rung, and slice plus
        complement totals sum to C(B+2, 3) with integer counters and
        deviation exactly 0. (ii) Depth-1 and depth-k trees on the Legendre
        and top-k-bit features reproduce, on the same count vectors, the
        rho and lambda that a direct implementation of c5c614's grammar
        members g1-g3 returns, to floating-point exactness (c5c614 is unrun,
        so the reference values are computed in-run by an independent code
        path, not imported). A discrepancy halts the run.
    observation_collision:
      observable: >-
        The pair (rho, lambda) of the top-sigma predicted slice on held-out
        targets per arm, rung, class, regime and sigma, each with its
        selection-null band; it discards which targets are in the slice,
        the multiplicity profile inside it, and the model.
      distinct_preimage_search: >-
        Two collisions by construction. FIRST, distinct predicates with
        identical slice mass and support have identical (rho, lambda) while
        selecting different targets, so equal lift for a GNN and a tree is
        not evidence of the same structure; hence the surviving output is a
        membership and attribution table for symbolic regression, not a
        lift number. SECOND, a lift produced by reading D's coordinates and
        implementing the sumset lookup collides at the level of
        (rho, lambda) with a lift produced by genuine x-line structure; they
        are separated only by the Z/N-random arm (where the first exists and
        the second cannot, by INV-3 and H2) and by the charged cost c_f. A
        run without the Z/N-random arm may not report either.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The pushforward of c_D along the two-cell partition induced by a
          LEARNED coordinates-only predicate, the function class enlarged
          from a frozen O(1) grammar to an inductive message-passing model
          and a gradient-boosted tree model, each containing the grammar as
          a slice.
        predicted_gain: >-
          None expected. Under H1 the excess of rho over the selection null
          decays like N^{-1/2+o(1)} exactly as for the grammar; the
          deliverable is the measured exponent with its interval. If the
          exponent is 0 on E/x-interval with all controls in band the gain is
          a candidate invariant for IDEA-20260906-1f6bfe and a proof
          obligation against INV-4c, not an algorithm.
      - transform: observable_fiber
        proposed_object: >-
          The Z/N-random arm as the fibre of the observable over lookup
          capacity: every lift a coordinates-reading model can produce
          WITHOUT representation structure, subtracted from the E arms.
        predicted_gain: >-
          Diagnostic only. Predicted Z/N-random lift within band at the
          frozen budgets; if above band the subtraction is performed and c_f
          is reported as the price of the rediscovered lookup.
    quantifier_order: >-
      THERE EXISTS a trained predictor f in the frozen class F_theta (fixed
      architecture, budget and feature regime, trained on a training split
      of one arm at one rung), with sigma in {1/8, 1/32}, such that FOR ALL
      rungs N in the tested range the held-out excess of rho over the
      selection null exceeds a fixed c > 0, replicated across >= 3 curves
      and >= 3 training seeds. The witness is ALLOWED to be retrained per
      rung, strictly weaker than a uniform predicate, so a positive result
      is an existence witness and not an algorithm. The negative result
      closes only the existential over the trained class, panel, regimes and
      range.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured decay exponent for the lift of the best held-out
        predictor in ONE trained class over ONE five-arm panel at FOUR
        exhaustive rungs and ONE sampled rung at toy scale, with a selection
        null, an analytic null, a label-permutation null and a non-graph
        baseline, plus the measured GNN-minus-trees difference and c_f. A
        learned predictor gives an existence witness when it finds structure
        and never a non-existence proof when it does not. Nothing about
        solve cost, rank or ECDLP hardness.
      nearby_object_control: >-
        Z/N with a random base, and the E/random arm that must match it: by
        INV-3 and H2 the count vector of a random base carries no structure
        visible to any partition chosen independently of D, so every lift
        there is lookup. Second nearby object, the E/log-interval canary
        (small-multiples base), whose count vector has a large lift in the
        LOG coordinate and none visible from coordinates; a coordinates-only
        lift there is a leak or a DLP predictor and halts the run for audit.
    proof_obligations:
      - claim: >-
          sigma = 1 reproduces rho = lambda = 1 and slice totals sum to
          C(B+2, 3) with deviation exactly 0 on every arm and rung.
        responsibility: baseline
      - claim: >-
          The tree and readout slices of the learned class reproduce
          c5c614's grammar lifts g1-g3 to floating-point exactness on the
          same count vectors.
        responsibility: correctness
      - claim: >-
          For an i.i.d. uniform base of size B in a prime-order group with
          m < N, Cov(c_D(r), c_D(r')) = -M/N^2 for r != r' (unreviewed), so
          random-arm training labels carry no second-order information about
          held-out labels except through D.
        responsibility: success_probability
      - claim: >-
          On Z/N with D = +-[1, B_eff] the 3-fold multiset sumset is
          [-3 B_eff, 3 B_eff], of density below 1/32 at every rung, so a
          perfect ranker attains lambda = rho = 1/sigma exactly.
        responsibility: feasibility
      - claim: >-
          rho <= 1/sigma exactly, so a lift ~ N^delta requires
          sigma <= N^{-delta}, and the filter is worthwhile only if
          c_f / sigma <= s / rho, i.e. c_f <= s N^{-2 delta} at the ceiling.
        responsibility: strictness
      - claim: >-
          Under c5c614's ledger a sustained rho ~ N^delta moves the m = 3
          relation-collection exponent from 1/2 to (1-delta)/2; under
          772cff's s(B) = Theta(B) ledger from 2/3 to (2/3)(1-delta); a
          constant rho moves neither.
        responsibility: runtime
      - claim: >-
          c_f per target is O(1) field operations plus k = 8 point additions
          plus one frozen-width readout, measured in-process against the
          Theta(B) lookup.
        responsibility: memory
      - claim: >-
          Nothing here is a statement about coverage, rank, solve cost or
          ECDLP hardness; closure is over the trained class only.
        responsibility: scope
    not_applicable_reason: null

  rerandomization: null
  rerandomization_note: >-
    No worst-to-average-case device. Targets are uniform in G by
    construction (exhaustive: every target; sampled: uniform sample), curves
    are generated by seed, and no re-randomising walk or pull-back to an
    input instance exists because no instance is being solved.

  asymptotic_claim: null

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        X-LINE ADDITIVE PSEUDORANDOMNESS FOR THE LEARNED CLASS. For a factor
        base D of size B = ceil((6N)^{1/3}) defined by an x-interval on a
        prime-order E/F_p at m = 3, and for the top-sigma slice S of ANY
        predictor in the frozen trained class F_theta with sigma in
        {1/8, 1/32}, the slice total satisfies sum_{r in S} c_D(r) =
        sigma C(B+2, 3) (1 + O(N^{-1/2+eps})) for every eps > 0, uniformly
        over the class, so that the excess of rho over the selection null
        decays like N^{-1/2+o(1)}. This is c5c614's H1 with the grammar
        replaced by the trained class.
      random_model_justification: >-
        The rigorous half is conservation itself (KN-FIND-007), which pins
        the sum of the slice totals exactly so deviations must cancel. The
        classical statement imitated is Weil-type square-root cancellation
        for character sums along a curve, in the form of the recalled
        Kohel-Shparlinski bound for points with x in an interval; per the
        seed brief's INV-4 (unreviewed) that bound proves the no-cluster
        statement only for B above p^{3/5} at m = 3, far above the
        index-calculus B ~ p^{1/3}, so at the tested B the assumption is a
        genuine heuristic and is exactly what the growth arm measures. The
        proves-too-much control is Z/N with the interval base, where the
        bound correctly fails and the instrument must see the
        over-dispersion.
      supporting_results:
        - >-
          KN-FIND-007 (internal, read in full this session): the conservation
          identity, the rigorous half.
        - >-
          Kohel and Shparlinski, ANTS-IV 2000 (RECALLED, not opened; a pointer
          for the reviewer, not support).
      validation_experiment_ids:
        - EXP-RELN-82f487
      validation_plan: >-
        SAMPLE the complete count vector for every arm at 2^14, 2^16, 2^18,
        2^20 by exhaustive enumeration and a fixed 163840-target sample at
        2^24 with certificates. COMPARISON: the normalised slice deviation
        (slice total - sigma total) / sqrt(sigma total Delta / mu) for the
        learned slice against the selection-null distribution of the same
        statistic, per rung, by Kolmogorov-Smirnov at the 1 percent level;
        the excess against the N^{-1/2} envelope. TAIL CHECKS: the single
        largest excess across the panel at each rung against the max-of-k
        order statistic of the null; the dispersion index Delta of every arm
        against the Poisson value 1 - 1/N; the fitted decay exponent with
        its interval against -1/2. TRANSFER: none.
      falsification_condition: >-
        Fitted slope interval containing 0 and excluding -1/2 on
        E/x-interval, replicated, with every control in band and lookup
        capacity subtracted.
    - id: H2
      formal_statement: >-
        RANDOM-BASE PAIRWISE DECORRELATION (INV-3 sharpened, derived
        in-record by the proposal, unreviewed). For D of B i.i.d. uniform
        elements of a prime-order group of order N > m and any r != r',
        Cov(c_D(r), c_D(r')) = -M/N^2 with M = C(B+m-1, m), and for any
        partition chosen independently of D every cell has E[rho] = 1
        exactly; hence on the random-base arms any held-out lift is a
        function of D's coordinates (lookup capacity) and not of the
        training labels.
      random_model_justification: >-
        Elementary: for distinct multisets A != A' the integer coefficient
        vectors of Sigma A and Sigma A' in the d_i both have entry sum m, so
        they are proportional mod N only with factor u = 1, i.e. never; two
        non-proportional linear forms in i.i.d. uniform variables over a
        prime field are jointly uniform on G^2; the covariance follows by
        double counting as in KN-FIND-007. Sampling WITHOUT replacement and
        the negation-closed convention perturb the constant by O(m/B) and
        are not covered; that gap is what the validation measures.
      supporting_results:
        - >-
          KN-FIND-007 (internal): the double-count identity the derivation
          extends.
      validation_experiment_ids:
        - EXP-RELN-82f487
      validation_plan: >-
        SAMPLE: on the Z/N-random and E/random arms at every exhaustive
        rung, the empirical autocovariance of the count vector at all lags
        in the representation ordering and at 1000 random pairings, from the
        exact vectors under the frozen convention, over 3 base seeds.
        COMPARISON: against -M/N^2 with the finite-population correction, and
        the cell-lift variance against (1 - sigma) Delta / (mu sigma N_test).
        TAIL CHECK: the maximum absolute autocovariance over lags against the
        Gaussian max-of-N order statistic. TRANSFER: none.
      falsification_condition: >-
        A lag with autocovariance far above the envelope on a RANDOM arm, or
        E[rho] on a random arm outside its band for a partition independent
        of D; reported either way as a fault of the derivation or of the
        sampler.
    - id: H3
      formal_statement: >-
        PREDICTOR AFFORDABILITY. At the frozen feature set and architecture,
        the per-target evaluation cost c_f is at most 20 point-addition
        equivalents, hence below the Theta(B) existence lookup by a factor
        of at least B/20 and below one Groebner solve attempt by at least
        10^3; consequently a slice of density sigma >= 10^{-2} adds at most
        10 percent to relation-collection cost under c5c614's ledger.
      random_model_justification: >-
        No theorem; an ENGINEERING RATIO, labelled as such. The
        exponent-relevance condition it feeds is exact arithmetic: with
        rho <= 1/sigma, a filter is worthwhile only if c_f / sigma <= s / rho,
        so at the ceiling with rho ~ N^delta the predictor needs
        c_f <= s N^{-2 delta}; with s = Theta(B) = Theta(N^{1/3}) a
        constant-cost predictor satisfies this for delta <= 1/6 and no
        predictor beyond it.
      supporting_results: []
      validation_experiment_ids:
        - EXP-RELN-82f487
      validation_plan: >-
        SAMPLE: instrument c_f, t_gen, the Theta(B) lookup and the Groebner
        solve in the SAME process on the SAME machine at every rung, over
        >= 200 targets per rung for c_f and the lookup and >= 100 solve
        attempts including failures, under a declared cap. COMPARISON: ratio
        distributions with inter-quartile ranges, never point estimates.
        TAIL CHECK: the slowest observed c_f against the fastest observed
        lookup. TRANSFER: none; machine- and implementation-specific.
      falsification_condition: >-
        Measured c_f / (B lookups) >= 1 at every rung.
    - id: H4
      formal_statement: >-
        INSTRUMENT LEARNABILITY. Under the frozen budgets, both model classes
        recover (i) the Z/N-interval positive control to at least half its
        ceiling (lambda, rho >= 0.5/sigma) and (ii) the INV-6 theorem arm on
        E to lambda >= 1.4 at mu ~ 1, at every rung, from coordinates-only
        features plus the supplied indicators respectively.
      random_model_justification: >-
        No theorem beyond the observation that an interval threshold on a
        residue is a depth-1 tree and a one-neuron readout, and that the
        theorem-arm slice is a disjunction of 8 supplied indicators. This
        assumption is what turns 'the model found nothing' into 'there is
        nothing in the trained class to find' and is therefore blocking.
      supporting_results: []
      validation_experiment_ids:
        - EXP-RELN-82f487
      validation_plan: >-
        SAMPLE: the positive-control and theorem-arm cells themselves at
        every rung, 3 training seeds each. COMPARISON: lambda and rho against
        the ceiling 1/sigma resp. 1/Pr[c_D >= 1] and the half-ceiling
        thresholds. TAIL CHECK: the worst seed. TRANSFER: none.
      falsification_condition: >-
        A model class below threshold on the positive control or below 1.4
        on the theorem arm at a rung; that class and rung are uninformative
        and no negative is reported from them.

  dominated_by: >-
    CHECKED ROW BY ROW, copied from the proposal. AS AN ATTACK: dominated on
    every axis by every row, since none is mounted (Pollard rho at
    0.886 sqrt(N) and O(1) memory, BSGS, van Oorschot-Wiener parallel rho,
    and the corpus's own m = 3 chained-Semaev index calculus). AS A YIELD OR
    COVERAGE STATEMENT: strictly dominated by KN-FIND-007 and the 1.582
    envelope of IDEA-20260830-772cff, neither contested. AS A LEARNED-MODEL
    COST STATEMENT: dominated by IDEA-20260806-94676a's preprocessing-bound
    framing, adopted here. AS A MEASUREMENT OF THE RESTRICTED-TARGET
    CHANNEL: c5c614 proposes the frozen-grammar measurement and is unrun;
    RT-4 measured one log-space window at one (N, B); no row measures a
    learned class with the four-arm panel, a permutation null and a growth
    arm, so nothing dominates it on that axis and it displaces nothing.
  sota_delta: >-
    Zero on every ECDLP cost axis: no attack, no algorithm, no exponent
    moved. Quantified deliverable if run: (i) a measured decay exponent with
    interval for the lift of the best predictor in a trained class that
    CONTAINS c5c614's grammar, over five arms and five rungs, against a
    1000-draw selection null, an analytic null with a stated variance, a
    permutation null and a canary; (ii) the first measurement in this
    program of whether message passing over certified decompositions adds
    anything to per-target features (predicted 0); (iii) the measured c_f
    against the Theta(B) lookup and the exact condition c_f <= s N^{-2 delta}
    for exponent relevance; (iv) in the refuting branch, a typed table for
    symbolic regression and a proof obligation against INV-4c; in the
    predicted branch, a bounded obstruction with a number. Prior state on
    this axis: zero measured values.

