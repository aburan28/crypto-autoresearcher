  title: >-
    The written exponent ratio lies strictly between 723/1000 and 724/1000.
  statement: >-
    The five integers 3, 37, 1407181, 51593604295295867744293584889 and
    31599414504681995853008278745587832204909 multiply to
    254652442229484275177030186010639202161620514305486423592570860975597611726191.
    The integer 1407181 is prime. The base-2 logarithm of 3 lies strictly
    above 3/2 and strictly below 8/5. The logarithm of 37 lies strictly
    above 26/5 and strictly below 53/10. The logarithm of 1407181 lies
    strictly above 102/5 and strictly below 103/5. The logarithm of the
    95-bit factor lies strictly above 953/10 and strictly below 477/5.
    The logarithm of the 135-bit factor lies strictly above 269/2 and
    strictly below 135. The logarithm of the product lies strictly above
    2571/10 and strictly below 2572/10. The square of 723/1000 is below
    1345/2571, and the square of 724/1000 is above it. The cross gaps
    are 1063741 and 2656496.
  mechanism: >-
    The proposal compares the largest written factor size with the
    written size of the product. This contract checks the product and
    those bounds. It does not run a sieve.
