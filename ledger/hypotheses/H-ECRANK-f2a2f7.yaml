hypothesis:
  id: H-ECRANK-f2a2f7
  question_id: RQ-ECRANK-27dcc5
  statement: There is an elliptic curve E/Q and a subgroup V <= Q*/(Q*)^2 of order 8 with sum_{d
    in V} rank E^(d)(Q) >= 31, hence rank >= 31 over a field of degree 8 -- and the construction
    that supplies it is a Mestre-style search for a high-rank base curve, not a quadratic-twist search,
    which GOAL-ECRANK-001 measured to top out at rank 4.
  mechanism: 'The certified rank at k is sum over the 2^k classes of the twist ranks. At k = 3 there
    are only 8 classes, so 31 requires an average of nearly 4 per class. One class can carry a large
    rank cheaply -- the base curve itself -- so the reachable total is approximately (max twist rank
    in the coset) + (contribution of the other 7 classes). GOAL-ECRANK-001 measured the second term
    at about 16 for pool curves of rank 3-4, giving totals of 20. If that second term is roughly
    independent of the base curve, then 31 at k = 3 needs a class of rank about 15, and a rank-8
    base curve reaches only about 24. The hypothesis is therefore testable in a way that is likely
    to FALSIFY it, and the falsification is the useful output: it converts "degree 8 is out of reach"
    from a search report into a number.'
  assumptions:
  - Mestre-style construction can produce curves of rank >= 6 over Q within budget, where quadratic-twist
    search measurably could not (no twist of rank >= 5 in 364756 candidates).
  - The non-maximal-class contribution at k = 3 is approximately independent of the base curve. THIS
    IS THE ASSUMPTION MOST LIKELY TO BE WRONG and the scan task measures it directly rather than
    assuming it.
  - Every rank used is a certified lower bound from exhibited points, never an analytic rank and
    never a Selmer upper bound.
  proof_search_map:
    bottleneck: The size of the largest twist rank obtainable in a single class. Everything else
      at k = 3 is already measured; this one term is what separates 20 from 31.
    baseline_embedding:
      parameter_slice: GOAL-ECRANK-001 k = 3 optimum of 20 over the 502-curve pool, EV-ECRANK-b6c9b6.
      reproduction_check: The new scan must reproduce 20 on the committed pool with the committed
        support before any extended-support number is believed. A frozen regression fixture, not
        a re-derivation.
    observation_collision:
      observable: the k = 3 optimum as a function of the maximum twist rank present in the coset
      distinct_preimage_search: Two cosets with the same maximum twist rank but different totals
        would falsify the separability assumption above and are searched for explicitly.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Replace twist search over d, whose yield was measured at rank <= 4, by Mestre-style
        construction of the base curve, which builds many independent points in by design.
      predicted_gain: base rank 6-8 instead of 4, i.e. +2 to +4 on the k = 3 total
    quantifier_order: EXISTS E/Q and EXISTS V of order 8 such that FOR ALL of the 8 classes the exhibited
      points are non-torsion and their total is >= 31. Finite and exhibitable; no infinite family
      and no heuristic is quantified over.
    method_ceiling:
      strongest_certifiable_claim: At k = 3 the eigenspace argument alone certifies at most 8, so
        ANY degree-8 result at rank 31 rests on within-class multiplicities and therefore on height
        regulators. A degree-8 certificate would be strictly weaker in kind than the degree-32 exact
        one already held, and must be reported as such rather than as a strict improvement.
      nearby_object_control: 'k = 4 is run with the same pool as the nearby object: if the new base
        curves raise k = 4 above the committed 32 but leave k = 3 far below 31, that is the separability
        assumption failing in the informative direction.'
    proof_obligations:
    - claim: each exhibited point lies on its twist and is non-torsion
      responsibility: correctness
    - claim: within-class multiplicities are independent
      responsibility: correctness
    - claim: the reported ceiling is measured, not assumed
      responsibility: scope
    - claim: Mestre-constructed curve ranks are certified by points, not analytic rank
      responsibility: strictness
  rerandomization: null
  asymptotic_claim: null
  asymptotic_claim_note: Explicitly null. No complexity claim on any hard problem; this is an existence-or-ceiling
    question about a construction.
  heuristic_assumptions: []
  heuristic_assumptions_note: 'Empty: the deliverable is either a finite exact certificate or a measured
    number, neither of which rests on a heuristic.'
  predictions:
  - id: P1
    statement: Mestre-style construction yields a curve of rank >= 6 over Q with certified points,
      beating the rank-4 ceiling the twist search hit.
  - id: P2
    statement: The k = 3 optimum rises above the committed 20 when a higher-rank base curve enters
      the pool.
  - id: P3
    statement: The k = 3 optimum nevertheless stays BELOW 31, and the campaign returns the measured
      base rank that 31 would require.
  falsification:
  - 'P1 fails: the Mestre construction does not beat rank 4 within budget, leaving the constraint
    unmoved and the campaign closing on C2 with that fact.'
  - The k = 3 optimum reaches 31 and a verified degree-8 certificate exists, falsifying P3 and closing
    on C1.
  - The independent exact verifier reports any error on a produced certificate.
  status: specified
  owner: coordinator
