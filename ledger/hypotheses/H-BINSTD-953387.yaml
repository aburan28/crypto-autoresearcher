# =============================================================================
# H-BINSTD-953387 -- Part-2 CERT-LABEL/QUOT/BIND independence under planted
# single-axis faults (IDEA-20261001-2b71e5). Instrument / observational.
# Approved DEC-20261003-63fca9. Stages 0-1 only. Zero runs in the design packet.
# No AUXIN. Amazon Bedrock prohibited. No O-SUPPORT / break / exponent / n>=131.
# =============================================================================
hypothesis:
  id: H-BINSTD-953387
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-2b71e5
  derived_from_idea: IDEA-20261001-2b71e5
  experiment_id: EXP-BINSTD-266fc6
  goal_id: GOAL-ECDLP2M-001
  specified_at: '2026-10-03'
  approved_at: '2026-10-03'
  authorised_by: DEC-20261003-63fca9
  status: approved
  proposed_by: coordinator
  title: >-
    On toy Part-2 relation fixtures at n=17, planted single-axis faults on
    CERT-LABEL / CERT-QUOT / CERT-BIND each reject their own axis at rate >=0.99
    while the other two accept at rate >=0.99 — or a measured cross-talk rate
    names a coupled failure mode

  statement: >-
    SETTING. Part-2 certificate objects CERT-LABEL, CERT-QUOT, CERT-BIND as
    declared by EXP-BINSTD-178742 / part2_surface.py. Stages 0-1 of
    EXP-BINSTD-266fc6 use stub_synthetic relation fixtures (stdlib) so the
    instrument admits without Magma/Sage; live Part-2 emits may replace stubs
    under a later amendment and are not required for Stages 0-1.

    CLAIM (instrument / observational). For each planted single-axis fault
    family F in {label, quot, bind} on >=50 admitted relations at n=17:
    P(cert_F rejects) >= 0.99 AND P(cert_G accepts) >= 0.99 for each G != F,
    OR the measured off-axis reject (cross-talk) rate names a coupled failure
    mode (E-COUPLED). Controls: no-fault all-green; triple-fault all-red;
    null_object random bit flip off certificate bytes stays green.

    TEST BOUNDARY. Stages 0-1 only (n=17). Stage 2 (n=23 replicate) is NOT
    authorized here. NO O-SUPPORT, break, exponent, or n>=131 transfer.

    FALSIFICATION OF HEUR-BINSTD-2b71e5-H1 (within boundary). Cross-talk >=0.05
    on any off-axis certificate under a single-axis plant with the contract
    still reading E-INDEPENDENT, OR a no-fault arm shows any certificate red
    rate >=0.01 (voids the bake-off). Budget / missing Stage-0 freeze is
    O-IMPEDIMENT, never negative mathematical evidence.

  mechanism: >-
    OBJECT FRAME. Representation: frozen Part-2 certificate predicates on
    relation records. Operation set: flip exactly one axis per trial; re-verify
    all three certificates; record the 3x3 accept/reject matrix. Trichotomy:
    Class I instrument that makes the Part-2 seal falsifiable before any rank
    reading is trusted. Lossy-projection / null: no-fault must keep all three
    green; triple-fault must keep all three red; off-certificate bit flip must
    not trip certificates. OFF-LIMITS: claiming O-SUPPORT from certificate
    rates alone; Magma/Sage provisioning; editing EXP-BINSTD-178742 bytes.

  predictions:
    - metric: on_axis_reject_rate
      direction: higher
      minimum_effect: '>=0.99 per planted axis at n=17'
    - metric: off_axis_accept_rate
      direction: higher
      minimum_effect: '>=0.99 for each non-planted certificate at n=17'

  test_boundary: >-
    Stages 0-1; n=17; stub_synthetic fixtures or later-admitted Part-2
    relations; stdlib only; no deployed curves.

  falsification_criteria: >-
    Reading Part-2 ranks while any on-axis reject rate <0.99 under E-INDEPENDENT;
    claiming O-SUPPORT / break / exponent from certificate rates alone;
    transferring toy seal rates to n>=131 without a new contract.

  distinguishable_outcomes:
    - id: E-INDEPENDENT
      meaning: >-
        On-axis reject >=0.99 and off-axis accept >=0.99 for all three plants;
        controls pass.
    - id: E-COUPLED
      meaning: >-
        Controls pass but on-axis or off-axis thresholds miss; matrix names
        the coupled failure mode.
    - id: O-CONTROL-FAIL
      meaning: >-
        No-fault / triple-fault / null-object controls fail; bake-off void as
        instrument defect, not a Part-2 rank reading.
    - id: O-IMPEDIMENT
      meaning: >-
        Stage-0 freeze missing or infrastructure abort; never negative evidence.

  heuristic_assumptions:
    - id: HEUR-BINSTD-2b71e5-H1
      formal_statement: >-
        FORALL planted single-axis fault families F in {label,quot,bind} and
        FORALL relations in a >=50-sample at n=17: P(cert_F rejects) >= 0.99
        AND P(cert_G accepts) >= 0.99 for each G!=F, under independent
        Bernoulli trials with the contract verifier — OR a measured cross-talk
        rate is reported as E-COUPLED.
      random_model_justification: >-
        Rigorous: each certificate verifies a distinct predicate in the frozen
        Part-2 surface. Classical: independent predicate failures under
        single-coordinate corruption unless the implementation couples checks.
      supporting_results: []
      validation_experiment_ids:
        - EXP-BINSTD-266fc6
      falsification_condition: >-
        Cross-talk >=0.05 on any off-axis certificate under a single-axis plant
        while claiming independence, OR a no-fault arm shows any certificate
        red rate >=0.01.

  interpretation_limits:
    - Toy / stub certificate QA only; no O-SUPPORT; no n>=131 transfer.
    - No break; no exponent; no rho-competitiveness claim.
    - Stub fixtures validate the planted-fault meter; live Part-2 replacement
      needs an additive amendment before ranks are trusted.

  citations:
    - ref: IDEA-20261001-2b71e5
      provenance: internal
      claim: Source proposal for the independence bake-off.
      verified_by: coordinator, this design session, proposal read in full.
    - ref: EXP-BINSTD-178742
      provenance: internal
      claim: Declares CERT-LABEL / CERT-QUOT / CERT-BIND on the Part-2 surface.
      verified_by: coordinator, this design session, specification + part2_surface.py read.
    - ref: KR-IC-b0fcda
      provenance: recalled
      claim: >-
        Frobenius-invariant FB mechanism (frontier positioning only; not support
