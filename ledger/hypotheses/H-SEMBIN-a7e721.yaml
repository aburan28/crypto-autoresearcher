  added: '2026-09-16'
  authored_by: coordinator
  authored_under: >-
    DEC-20260916-88ac73 next_actions rank 1, which directed that this hypothesis be written with DC-1
    through DC-4 binding its test boundary. Standing user authorization of 2026-09-06 covers the intake;
    protocol readiness is the Coordinator's responsibility and is discharged in EXP-SEMBIN-4fa22c.
  title: >-
    Proposition 5 of Nagao 2015/984 is justified only by a chain of three borrowed or unproven steps, and
    at the coset-shifted EQS4 instances the chain's own quantity exceeds the bound the proposition claims

  statement: >-
    For the EQS4 systems of Nagao ePrint 2015/984 — the degree-3 Weil descents of the third summation
    polynomial over F_{2^n} taken with the coset shifts v_i of Definition 8, together with the field
    equations — the FAKE first fall degree d'_F, computed in the Boolean ring where X^2 is identified with
    X, EXCEEDS 4 at parameters within reach of this host.

    Proposition 5 asserts d_F <= 4 for these systems. Because Lemma 4 of the same paper runs in the
    direction d_F <= d'_F, a measured d'_F > 4 IS CONSISTENT WITH PROPOSITION 5 AND DOES NOT REFUTE IT.
    What it refutes is the paper's only offered justification at that instance: the bound is obtained by
    borrowing Semaev's fake-degree estimate, converting it to the true degree through Lemma 4, and
    transferring it from EQS2 to EQS4 by a footnote that omits the proof. If the borrowed quantity itself
    exceeds 4 at an instance, the chain cannot deliver 4 there, and Proposition 5 stands unproven at that
    instance while remaining unrefuted.

  mechanism: >-
    Proposition 5's justification is a three-link chain, and each link is separately weaker than the
    proposition it carries:

    LINK 1 — BORROWED. The numerical bound originates as Semaev's estimate of the FAKE first fall degree
    for summation-polynomial descents, not as a statement about the true degree. It is imported rather
    than proved in 2015/984.

    LINK 2 — UNPROVEN, AND FALSE IN ITS LITERAL FORM. Lemma 4 asserts d_F <= d'_F, which is what converts
    link 1's fake quantity into the true one the proposition needs. Its LITERAL form — field equations
    treated as outside the generating set — IS FALSE: for f1 = X1X2 + X3 and f2 = X1 + X2 the fake
    quantity is 2 while the true first fall is 3, verified by exhaustive search over all 31 nonzero
    coefficient choices at degree 2 (coordination/review/sembin-20260916-propquant/coordinator-recheck.py,
    output alongside). The INSIDE form — field equations among the generators — holds in every instance
    checked and is what the paper must mean, but it is asserted on the strength of a lemma proved
    elsewhere and is not proved in 2015/984.

    LINK 3 — TRANSFERRED BY FOOTNOTE. Proposition 5 is stated for EQS4, which differs from EQS2 exactly
    by the coset shifts v_i (Definition 8 :713, footnote 1 :285-290). The footnote asserts the transfer
    and omits its proof. The shifts are not cosmetic: they are the device the whole coset-typed factor
    base rests on.

    THE MECHANISM THIS HYPOTHESIS PROPOSES is that link 1's quantity is simply too small for the systems
    link 3 applies it to — that the fake first fall degree of the SHIFTED degree-3 descents grows past 4
    at modest n, so that the borrowed estimate cannot support the bound at EQS4 even granting links 2
    and 3. The reason to expect this rather than the reverse is that the shifts destroy the coordinate
    symmetry that keeps early degree falls available in the unshifted system: a fall at degree d requires
    a syzygy among the descent polynomials realisable at that degree, and each independent shift adds
    inhomogeneous terms that break the symmetric cancellations without adding new low-degree relations.

  predictions:
    - id: P-1
      prediction: >-
        d'_F of the shifted EQS4 system exceeds 4 at some n reachable on this host, and the smallest such
        n is identifiable.
      what_would_show_it: >-
        A Macaulay-style degree-by-degree rank computation in the Boolean ring exhibiting no degree fall
        at or below degree 4 for the shifted system at that n, with the same computation exhibiting the
        fall for a control that should have one.
    - id: P-2
      prediction: >-
        d'_F of the UNSHIFTED EQS2 system at the same n is strictly smaller than the shifted one, or the
        two agree. Agreement would locate the effect somewhere other than the shifts and is the more
        informative outcome for the mechanism.
      what_would_show_it: The identical measurement run on both, reported as a matched pair.
    - id: P-3
      prediction: >-
        d'_F is non-decreasing in n over the measured range. A non-monotone series is a defect signal in
        the instrument before it is a fact about the systems.
      what_would_show_it: Three or more consecutive n at fixed m.
    - id: P-4
      prediction: >-
        A null object of the same shape — a random degree-3 system over the same variables with matched
        equation count and matched monomial support — has a DIFFERENT d'_F profile from the descent
        systems. If they agree, the measurement is reading the shape of the system and not the summation
        polynomial, and P-1 asserts nothing about Nagao.
      what_would_show_it: The identical measurement on matched random systems, before any belief in P-1.

  test_boundary:
    what_this_can_reach: >-
      A statement about the JUSTIFICATION of Proposition 5 at the specific instances measured: whether
      the borrowed quantity is large enough to carry the claimed bound there. Instance-level, at the
      tested n, m, curve and shift set, on the declared instrument.
    what_this_can_never_reach: >-
      A REFUTATION OF PROPOSITION 5. This is DC-1 of DEC-20260916-88ac73 and it is a capability limit of
      the instrument, not a caution about interpretation. A Boolean-ring Macaulay computation is
      STRUCTURALLY UNABLE to exhibit d_F > 4: degree drops produced purely by X^2 -> X count toward d_F
      and are invisible to d'_F, so the instrument never sees the falls that can make d_F small. No run
      under this hypothesis may report a refutation of Proposition 5, and no success criterion of
      EXP-SEMBIN-4fa22c may be satisfiable only by one.
    what_a_confirmation_would_be_conditional_on: >-
      Lemma 4's INSIDE form, which is unproven here and whose literal form is verified false. Any record
      reporting d'_F <= 4 as confirming Proposition 5 at an instance must carry that condition, and must
      also state that the confirmation is instance-level and does not extend to the proposition's stated
      generality.
    the_trivial_ceiling_that_bounds_the_whole_question: >-
      With the field equations inside the generating set, g = (X_j^2 + X_j) on a cubic f and h_j = f + 1
      on the field equation give degree-5 products summing to X_j^2 + X_j. So the literal true d_F of ANY
      cubic system together with the field equations at p = 2 is at most 5, and Proposition 5's bound of
      4 sits ONE DEGREE BELOW A TRIVIAL CEILING. An instrument that admits trivial Koszul falls measures
      the ceiling rather than the system; DC-2 requires the contract to declare whether such falls count
      and how they are excluded.

  falsification_criteria:
    - id: F-1
      falsifies: P-1 and the hypothesis as stated
      condition: >-
        d'_F <= 4 for every shifted EQS4 instance measured, with the null control of P-4 discriminating
        and the monotonicity of P-3 holding. Then the borrowed quantity does support the bound at every
        instance reached, and the chain's weakest link is not the one this hypothesis names.
      what_would_then_be_worth_doing: >-
        Attack link 3 directly instead: whether the EQS2 -> EQS4 transfer the footnote asserts is
        provable, which is a question about the shifts and not about degrees.
    - id: F-2
      falsifies: the mechanism, while leaving P-1 possible
      condition: >-
        d'_F > 4 for the shifted system AND the unshifted system at the same n, equally. Then the shifts
        are not what breaks the estimate and the mechanism's account of why is wrong, whatever happens to
        the prediction.
    - id: F-3
      falsifies: any reading of the measurement at all
      condition: >-
        The matched random null objects of P-4 produce the same d'_F profile as the descent systems. Then
        the instrument is measuring equation count and monomial support, and no d'_F value it produces
        says anything about summation polynomials. This is the canonical artifact tell and it is checked
        BEFORE belief, not after.
    - id: F-4
      falsifies: the instrument rather than the hypothesis
      condition: >-
        d'_F is non-monotone in n, or the declared convention of DC-2 changes a reported value. Either is
        an instrument defect and is reported as one. Neither is negative evidence about Nagao (core rule
        5 as extended by the inventor protocol's controls-before-belief obligation).

  obstruction:
    statement: >-
      The measurable quantity and the quantity the published proposition bounds are DIFFERENT NUMBERS,
      and the instrument that can measure one is structurally blind to the other.
    quantity: >-
      The gap d'_F - d_F for degree-3 Weil descents of summation polynomials over F_2, at the tested
      parameters.
    value: >-
      NOT YET MEASURED, and by DC-1 not measurable by this instrument in the direction that matters. One
      lower bound on the gap's possible size is established by hand: on f1 = X1X2 + X3, f2 = X1 + X2 the
      literal-form gap is d_F - d'_F = 3 - 2 = +1 in the direction Lemma 4 forbids, which is what makes
      the literal form false. Units: degrees. Error bars: exact integers, no measurement error; the
      uncertainty is entirely in which convention the source intends.
    scope: >-
      Claimed only for the two hand instances verified in
      coordination/review/sembin-20260916-propquant/coordinator-recheck.py, over F_2, in the polynomial
      ring with exponents preserved.
    read_from: >-
      coordination/review/sembin-20260916-propquant/coordinator-recheck.py and its committed output; no
      experimental run yet exists.
    resource_check:
      examined: true
      reading: >-
        THE GAP IS AN ASSET TO A DIFFERENT PROGRAM THAN THIS ONE. This campaign reads it as an obstruction
        because it stands between a measurement and a refutation. But a quantity that a Boolean-ring
        computation cannot see, and that can only shrink the true degree, is exactly a source of
        UNCLAIMED SPEEDUP for anyone building solvers rather than auditing bounds: every fall produced by
        X^2 -> X that d'_F cannot see is a real degree drop an F4 run would benefit from, and the size of
        the gap is a measure of how much a solver that exploits field equations early gains over one that
        does not. That is a directly ICPERF-facing question — the same gap this campaign must route around
        is a candidate explanation for why WDSat's ANF-native handling of field equations beats
        CNF-XOR pipelines on the same instances. Recorded so the measurement is not thrown away by the
        lane that finds it inconvenient.
      recorded_for: GOAL-ICPERF-e6b6a4, whose solver comparison is the program that would read it as a gain

  dominated_by: null
  dominated_by_basis: >-
    Checked against the frontier this hypothesis actually sits on, which is AUDIT RESULTS about the
    Nagao/Semaev first-fall-degree literature rather than ECDLP algorithms: no record in this program or
    in the corpus known to it reports a measured fake first fall degree for the SHIFTED EQS4 systems, and
    the shifts are what make the question specific to 2015/984 rather than to Semaev's original estimate.
    This is a null asserted about a narrow frontier and it is not a claim of novelty about anything else;
    the underlying construction is published and its attribution is settled separately in
    CORR-20260916-273589.
  sota_delta: >-
    Not applicable as a performance delta — this hypothesis proposes no algorithm and moves no exponent.
    Its quantitative deliverable is a degree, and its value is the difference between a published
    exponent-bearing bound whose justification is checked and one whose justification is assumed. Stated
    plainly so this is not mistaken for an exponent-moving result under the target result profile: it is
    audit work in service of one, and the profile's `exponent-first` bias is a reason to keep it cheap.

