coordinator_decision:
  id: DEC-20260718-005
  context: "EXP-BKK-001 tropical/Newton-polytope (BKK) decomposition of the target-sectioned Semaev family"
  decision: reject_scoped
  target_ids: [H-BKK-001]
  rationale:
    - "Newton saturation measured exactly: sectioned S_m support fills the full box at m=3,4,5; MV = Bezuout_box exactly (rho_m = 1 at every m) — the candidate's named fatal obstruction, triggering its disproof track (>= 0.95 at m=5; measured 1.0)."
    - "log MV/log Bezout = 1.0 at m=5 caps any BKK-based algorithm at the dense driver; MX-1478's 1.979 unchanged."
    - "NEG-1/NEG-2 PASS: random same-support systems give identical MV and identical op counts — no EC-specific sparse structure exists at the polytope level."
    - "POS-1 PASS: sparse and dense solution sets identical (54/54)."
  evidence_refs: [EV-BKK-001, RUN-BKK-001-a, RUN-BKK-001-b, RUN-BKK-001-c, RUN-BKK-001-d]
  limitations:
    - "Toy p <= 2^10, m <= 5; unsectioned S_m IS materially sparser (439/625 at m=4) — the saturation is a property of target-sectioning; closes the support-aware-solving scope for sectioned systems (rule 6)."
  next_actions:
    - "H-BKK-001 = rejected_scoped. Cross-confirmed by the independent D2 certificate (EV-BKKMV-001)."
  decided_by: coordinator
  decided_at: "2026-07-18"
