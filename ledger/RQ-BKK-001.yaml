research_question:
  id: RQ-BKK-001
  title: What are the Newton polytopes of the target-sectioned Semaev family S_m(x_1..x_{m-1}; x_R), and does their mixed volume undercut the dense Bezout bound enough to make support-aware (BKK/sparse) elimination cheaper than dense composed resultants for m-summation membership solving?
  scope: {curve_families: [prime-field short-Weierstrass (ordinary, char >= 5)], field_types: [F_p], bit_sizes: ["toy p in {101,431,1009}"], methods: [exact Semaev recursion by evaluation-interpolation, exact Newton polytopes (pulling triangulation + Sage volume), BKK mixed volume, counted-F_p-op sparse-vs-dense solve]}
  motivation: Candidate B2 (research_directions_20260717.md). Every ledger resultant is dense (MX-1478, measured exponent 1.979). If the Semaev Newton polytopes are proper subpolytopes of their degree boxes, the BKK root count MV < Bezout and support-aware elimination changes the complexity driver; if saturated, MV = Bezout and B2 dies at stage 0 (decisive in both directions). The Semaev Newton polytopes had apparently never been computed.
  decision_target: Whether MV/Bezout <= 0.85 at m=5 (promote) or >= 0.95 (saturation, scoped kill) holds for the target-sectioned Semaev family, and whether measured sparse-vs-dense solve costs show any support-aware advantage.
  constraints: [toy primes only, "m in {3,4,5}", "seeds 20260717..20260719", wall-clock 2400 s total / 600 s per sage invocation, maximum 8 runs]
  status: active
  owner: coordinator
