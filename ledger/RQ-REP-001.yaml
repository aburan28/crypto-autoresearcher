research_question:
  id: RQ-REP-001
  title: >-
    Does the curve MODEL / coordinate representation change the ALGEBRAIC solving
    complexity (solving degree d_reg, per-PDP wall-time exponent) of the point-
    decomposition problem on generic prime-field curves, beyond the known
    constant-factor FHJRV symmetrization?
  scope:
    curve_families:
      - twisted-Edwards-form prime-field curves (a*x^2+y^2 = 1+d*x^2*y^2)
      - their birational Weierstrass form (same underlying curve / same points)
    field_types: [prime field F_p]
    bit_sizes: [toy: p ~ 2^12 .. 2^20]
    methods:
      - Weierstrass Semaev chained system (baseline / control)
      - twisted-Edwards native addition-law system on the SAME points
  motivation: >-
    The whole ecdlp-autolab PDP program is Weierstrass-Semaev. The summation /
    addition-law polynomial degree is model-dependent (Edwards has a complete,
    lower-degree biquadratic addition law and rational 2-torsion), which drives
    the Macaulay/Groebner solving degree. If a coordinate model gives a d_reg that
    scales strictly below the Weierstrass Semaev baseline (not a constant offset),
    that is an in-bar signal toward sub-birthday relation generation on GENERIC
    prime-field curves. IC-5 already found the FHJRV *symmetrization* to be
    constant-factor; this asks the distinct question of whether the raw
    model-native solving degree differs in its SCALING.
  decision_target: >-
    Whether to open a scaling study on model-native PDP solving degree, or to
    record a scoped negative that d_reg is model-invariant (up to a constant) on
    the tested toy Edwards/Weierstrass instances.
  constraints:
    - Only curves admitting a twisted-Edwards model (rational point of order 4)
      are in scope; this is a real but restricted family, NOT all prime curves.
    - Toy scale only; per AGENTS rule 7 this cannot be presented as crypto-scale.
  status: active
  owner: coordinator
