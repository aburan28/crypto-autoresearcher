evidence:
  id: NET-EV-001
  hypothesis_id: NET-H-001
  experiment_ids: [EXP-NET-001]
  run_ids: [RUN-NET-001-a]
  type: empirical
  direction: weakens
  strength: preliminary
  validity_status: valid
  validity_reason: >
    All controls passed: PC1 net-based reduced Tate pairing == Sage tate_pairing on 3/3
    dedicated instances (n = 5, 43, 5; non-vacuous); PC2 EDS exactness (x(mP) identity,
    translation identity, Somos identity) on 18/18 main instances; NC1 independent-curve
    and NC3 random-oracle enrichments ~1.0; NC2 permuted-target control behaved as designed.
    Deviations recorded: Tate substituted for Weil in PC1 (toy fields host no independent
    rational n-torsion pair; same Stange theorem family); MAXC=600 stride sample in
    k-consistency analysis; script path per handoff ID mapping. No stopping-rule trigger
    (wall 15.1 s << 600 s; 6/6 seeds kept).
  observations:
    - "S2 collision enrichment vs birthday (ratio of totals): 1.111 (p=101), 1.200 (p=431), 1.052 (p=1601); large-n subset (n>=400) 1.068; random-oracle control 0.976-1.057; per-family-pair 1.02-1.15 with the excess accounted by the measured index-1 universal-tautology class (581 collisions)."
    - "k-yielding (|S|=1) relations occur at 0.141/0.181/0.297 per analyzed Q-involving collision (main) vs 0.183/0.214/0.121 in the permuted-target control -- birthday artifacts, not k-structure (rates reverse at two of three sizes; main excess at p=1601 is the conditioning artifact: main collisions are guaranteed >=1 consistent k')."
    - "Consistency sets are large: mean |S| = 11-68 (naive random model ~2) -- EDS index periodicity + W_P(k')^Delta scale factor make value collisions k-unspecific (measured form of the 'relations encode the group law, not k' obstruction)."
    - "Charged k-recovery exponent (log ops / log n): 2.025/2.025/1.972 optimistic, 2.802/2.595/2.406 full-scan, 1.698/1.708/1.590 enumeration-only fiction, per size; BSGS reference at identical accounting 1.317/1.311/1.174 (constant-inflated at toy sizes)."
    - "Sieve/BSGS op ratio (optimistic accounting) grows with size: 24.2 -> 38.6 -> 134.7 (per-instance up to 298 at n=1607)."
    - "Promotion-gate arithmetic: gate 1 requires charged exponent trend < 0.49 -- measured values are 1.97-2.80 (and 1.59-1.71 even with free verification); gate 2 requires net-relation rank per field op >= 2x BSGS-equivalent -- measured 0.045/0.046/0.024. Neither gate crossed; the sieve/BSGS gap grows with n."
    - "Unexpected (rule 8): permuted nets show only 0.52-0.70x as many Q-involving collisions as true k-structured nets at equal multiset sizes -- a genuine k-dependence of the product-value distribution (origin unresolved: product-level identities vs small-period effects); it does not convert into cheap recovery because |S|=1 rates are birthday-equivalent and verification costs Omega(n) per relation."
  inference: >
    No improvement meeting the predefined threshold was observed over the tested instances,
    parameters, solver, and resource budget. Net-domain collision statistics are
    random-oracle-equivalent across sizes once the universal tautology class is removed;
    the two-parameter Somos family supplies relations that are exact but k-unspecific at
    FB indices, and any use of them costs Omega(n) verification -- consistent with the
    generic-model (Shoup) closure argument. Scoped negative for the tested representation.
  boundaries:
    - "Toy prime fields: p in {101, 431, 1601}, subgroup orders n = 37..1607, B = ceil(sqrt(n)), 6 seeds, single run."
    - "EDS in division-polynomial normalization; op policy: 1 F_p mult = 1 op, inversion = 10, comparison = 1 (identical for sieve and BSGS)."
    - "Closes only the exact tested scope: not other net parameterizations, other B regimes, rank >= 2 nets as relation source, or crypto-scale claims."
    - "BSGS charged exponent at these toy n is 1.0-1.5 (constant-dominated); gate 0.49 is asymptotic -- comparison made at equal accounting and via the ops-ratio trend."
  unresolved_confounds:
    - "Origin of the k-dependence in Q-involving collision counts (NC2 asymmetry) not resolved by this experiment."
    - "Proof-track theorem (relation module of Somos identities restricted to k-fibers) remains open; measurements are consistent with it."
  reviewed_by: coordinator
