research_goal:
  id: GOAL-FNDSA-001
  title: "FN-DSA: distributional exactness of the sampler, not just its timing"
  objective: >-
    Test FN-DSA's least-examined load-bearing assumption — that its
    signature distribution is an exact discrete Gaussian — with a
    measurement rather than an argument: build the
    deviation-to-signature-count curve for trapdoor recovery, calibrate
    detection power with a deliberately biased positive control and an
    exact null control, and apply the resulting instrument to the
    sampler the draft standard actually specifies, while the FIPS 206
    window is still open.
  question_ids: [RQ-FNDSA-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "FN-DSA (draft FIPS 206, formerly FALCON)"
    family: "lattice signature (NTRU hash-and-sign with Gaussian sampling)"
    nist_track: selected_algorithm
    standardization_status: >-
      Not yet final. Reported: draft submitted for approval 2025-08-28
      and in final review, with publication expected late 2026 or early
      2027 — unverified here. This goal therefore has a live window in
      which findings can still reach the standard.
  completion_criteria:
    - >-
      A calibrated detection instrument — exact-sampler null control and
      biased positive control, with reported power — applied to the
      standardized sampler, yielding either a measured distributional
      deviation with its implied signature count for trapdoor recovery,
      or an upper bound on deviation at a stated confidence with the
      instrument's sensitivity honestly reported.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the draft FIPS 206 text nor a reference sampler
      implementation can be obtained under the network policy after the
      declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-FNDSA-001 with priority among the
    selected-algorithm goals, because FIPS 206 is reportedly still in
    review and a finding could still reach the standard. No detection
    claim is admissible until the biased-sampler positive control
    demonstrates the instrument can see a deviation of known size;
    docs/inventor-protocol.md requires the null-object control before
    belief, and this instrument needs both controls.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
