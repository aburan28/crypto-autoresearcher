research_goal:
  id: GOAL-XEDN-001
  title: >-
    Non-isotrivial coefficient-bound control for function-field lifting
    (a(t) ≠ 0, μ₃ absent)
  objective: >-
    Reduce the outstanding falsification uncertainty left by GOAL-ICLIFT-001
    BATCH-002 / DEC-20260724-009 / TASK-20260724-242: whether Mordell-Weil
    relation coefficients among low-degree integral sections remain absolutely
    bounded when the surface family is non-isotrivial (a(t) ≠ 0, j non-constant),
    so the μ₃ automorphism that saturated max_|coeff|=1 on the frozen j=0 family
    is unavailable. Boundedness supports transferring the coefficient-bound
    closure beyond the isotrivial window; growth forces withdrawal of that
    transfer reading of DEC-20260724-009 and reopens the non-isotrivial
    relation-source question. Toy scale only; no attack claim.
