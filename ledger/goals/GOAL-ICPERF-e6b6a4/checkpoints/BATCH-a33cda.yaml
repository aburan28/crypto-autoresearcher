  # -------------------------------------------------------------------
  # WHAT WAS MEASURED, AND WHAT IT IS WORTH
  # -------------------------------------------------------------------
  what_was_measured:
    - "A Macaulay2 1.22 F4 row on n15l5-1-S: gb_size 43, engine CPU 46.55 s, maxdeg 2, non-unit, 49.21 s wall at CPU/wall 3.37, peak RSS 6.62 GiB under an 8 GiB resident-set watchdog polled 197 times without firing."
    - "That the same ideal, re-derived from the upstream instance by an independent route with no shared code, has cardinality 43 and maximal degree 2 -- in every monomial order, by proof."
    - "That the watchdog kills a 12 GiB resident hog at the declared 8 GiB and does not kill a 64 GiB address-space reserver; that no RLIMIT_AS is set on a live child."
    - "That the repaired reduction reproduces 186/186 cells and reports every unevaluable clause as null with a reason."
    - "That the environment probe's defect and its repair are both reproducible under one controlled launch (60.06 s unavailable, versus 0.008 s and a version string)."
    - "That Macaulay2 F4's resident memory on this system is 8-10 GB and is SENSITIVE TO VARIABLE ORDER, and that inter-poll growth reaches 1.40 GiB per 0.25 s."
  what_was_not_measured:
    - "l = 6 anything. Expected censored; not attempted."
    - "Any wall-based ratio, which the accepted bytes cannot measure for a fast child."
    - "The memory limit's behaviour for a forking engine."
    - "A cross-engine confirmation of the unperturbed basis: Singular's std did not finish in 600 s."
    - "Peak RSS of the R6 reviewer's first invocation, lost to its own runner bug and disclosed rather than backfilled."

  impediments: []
  impediments_note: >-
    NONE RAISED BY THIS BATCH, and one near-miss worth naming: machine headroom.
    A 4-CPU / 15.6 GiB host with a virtio balloon holding roughly 8.5 GB at
    launch cannot run a 6.6 GiB Groebner row beside another producer, which is
    why the two reviewer tasks were serialised against each other by a declared
    dispatch precondition rather than run concurrently. That is capacity
    management inside the batch, not an impediment on the goal.
