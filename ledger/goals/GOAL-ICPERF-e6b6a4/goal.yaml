research_goal:
  id: GOAL-ICPERF-e6b6a4
  title: >-
    Index-calculus ECDLP performance boundary: measured, phase-decomposed cost
    tables and a maintained algorithm library for Koblitz, binary-extension and
    prime-field curves, against matched rho
  objective: >-
    Answer RQ-ICPERF-94c86e by building, cell by cell, a boundary table that the
    rest of the program can iterate against: for each (curve family, field size,
    factor-base parameter) row, the measured cost of point decomposition, relation
    search, linear algebra and descent, in hardware-independent primary units with
    wall time and memory secondary, every solve certified, and matched Pollard rho
    on the same machine beside it. The campaign proceeds in the order the phases
    unblock each other.

    (1) POINT DECOMPOSITION FIRST, ON THE AUTHORS' OWN INSTANCES. The user pointed
    this program at github.com/mtrimoska/EC-Index-Calculus-Benchmarks, which is the
    instance generator behind the only published SAT-versus-Groebner PDP comparison
    in the corpus (KN-LIT-102cdb). It is frozen at SRC-ICPERF-TRIMOSKA-ECICB-2024
    with a byte-identical regeneration check, WDSat is frozen and built
    (SRC-ICPERF-TRIMOSKA-WDSAT-2024), and Macaulay2 F4, Singular, msolve,
    CryptoMiniSat, CaDiCaL and MiniSat are installed on this host. Batch 1
    (EXP-ICPERF-66fd51) measures every engine on every shipped instance of the three
    cells (n,l) in {(15,5),(17,6),(19,6)}, certifies every SAT answer against the
    curve with independent GF(2^n) arithmetic, and certifies UNSAT by Groebner unit
    ideal where an engine finishes. It is the first in-repo measurement of the
    RQ-SATIC-1ae57a effect, on the same instances rather than a re-implementation.

    (2) THE ALGORITHM LIBRARY. The user asked for the algorithms themselves. Batch 1
    delivers the first pieces as experiment code under a frozen contract: an
    independent GF(2^n) / binary-curve arithmetic module with an S_4 certificate
    checker, format converters from the generator's Magma form to Macaulay2, Singular
    and msolve, and the harness that drives every engine with uniform resource
    accounting. Later batches add the point sampler (so any (n, l) can be generated
    without Sage), S_3 chained systems (SEMBIN), Nagao coset bases (GOAL-SEMBIN-fcb7a2),
    a prime-field Semaev/Gaudry-Diem generator, structured Gaussian elimination and a
    matched rho. Code is promoted from experiments/ to tools/ only after a validator
    has run it.

    (3) RELATION SEARCH, LINEAR ALGEBRA, DESCENT, AND THE RHO COLUMN. Each is its own
    batch with its own frozen contract; none is claimed here. The end-to-end boundary
    at a cell exists only when every column of that row is measured.

    (4) EXTRAPOLATION TABLES. Only after (3), and only as arithmetic on numbered
    assumptions, at the FIPS K-/B- and NIST P- labels. Never a security statement.

    Scope discipline: standalone mathematical instances only. No deployed target and
    no private-key recovery. Reported literature numbers never enter a boundary
    table as measured. Engines are named and versioned in every cell.
  question_ids:
    - RQ-ICPERF-94c86e
