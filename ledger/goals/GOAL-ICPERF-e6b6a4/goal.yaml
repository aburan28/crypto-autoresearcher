  completion_criteria:
    - >-
      A committed Coordinator decision publishes a boundary table with at least one
      fully measured row per family (Koblitz-form binary, general binary, prime
      field): every phase measured in-repo with run ids, every solve certified, and
      matched rho on the same machine in the same row. An honest row in which no
      index-calculus pipeline beats rho satisfies this criterion.
    - >-
      The algorithm library named in objective (2) exists under tools/ with a
      validator-run test for each component, and the table can be regenerated from
      it and the run records.
