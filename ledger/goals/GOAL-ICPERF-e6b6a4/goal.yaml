    experiments/ or under another task's coordination directory, because three in-place edits
    landed in one batch (CORR-20260916-5166fe, CORR-20260916-2e9bc3) and that is a mechanism
    problem rather than three lapses; NA-6 teach check_review_independence.py to parse a
    review_plan_joint file AND to flag a plan that quotes a value its own blind_rederivation
    protects, which is the check that would have caught CORR-20260916-292e53 before the
    reviewer read it; NA-7 author the additive amendment adding AP-6 to EXP-ICPERF-13f001
    and fill AP-4 from the measurements the decision records; NA-8 consider R6's
    order-independence lemma for the corpus, read by an agent that did not write it; NA-9
