  impediments: []
  next_action: >-
    BATCH-51e2aa's review is composed and the batch is closed: EV-ICPERF-390707 and
    DEC-20260915-87360d are archived, H-ICPERF-cc4847 is `weakened` and
    EXP-ICPERF-66fd51 is `analyzed`. Batch 2 is the next thing to open, and the review
    ranked its work. (1) REPAIR THE INSTRUMENT FIRST, as one scoped executor task,
    because it is the only reason two of six columns are empty: convert.py's `gens_`
    line, which zeroes the Macaulay2 column at any memory limit; RLIMIT_AS replaced by
    an RSS watchdog at >= 8 GiB per child, since the review showed an equivalent 6 GiB
    RSS cap would also kill the row honestly; summary.py's three reporting defects; and
    bench.py's version probe, which hangs on inherited stdin so the run cannot name its
    own Singular. The payoff is measured: Singular slimgb computes the n15l5-1-S basis
    in 167 s and Macaulay2 F4 in ~50 s, agreeing on gb_size = 43, so the Groebner column
    is reachable on this host inside the contracted budget. (2) Design
    IDEA-20260915-3f1964, the exhaustive side-classified V^3 table, INHERITING the
    reviewer's enumeration -- it already covers all 60 instances, agrees with the solvers
    60/60, and classifies 67 roots as 45 on E, 1 on the twist, 21 mixed. (3) Settle, with
    no solver, why the 30 shipped U targets contain one decomposable target where the
    measured fractions predict 5.57 (P(X <= 1) = 0.0148): regenerate U targets at a
    recorded seed. Until then every "U instance" statement is about 30 specific files.
    (4) Separate structure from variable order, which is what the failed relabelling
    control leaves open -- IDEA-20260915-7ef636's 2x2-plus-planted-core null. (5) Build
    the generic-baseline column by MEASURING rho and BSGS on these groups and this host,
    carrying sqrt(n) rather than sqrt(2n), using r rather than #E (at n = 15 the order is
    fully smooth and the substitution overstates rho by 12.4x), and treating n = 15 as
    unusable for any asymptotic constant at ~7 equivalence classes.
