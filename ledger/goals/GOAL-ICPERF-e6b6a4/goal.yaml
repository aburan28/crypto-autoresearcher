    a batch here, read that lane's checkpoint shard and claim a disjoint lane rather than
    racing it; NA-1 and NA-3 are instrument work and do not overlap it.

    RANKED BEHIND, none dropped, each with its revisit condition in DEC-20260915-428a17:
    (2) IDEA-20260915-3f1964's exhaustive side-classified V^3 table -- now largely absorbed
    by BATCH-94168f's EXP-ICPERF-2f2e40, so check that lane before re-ranking it here;
