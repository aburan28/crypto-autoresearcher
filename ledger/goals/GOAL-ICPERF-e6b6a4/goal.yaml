    and H-ICPERF-2c57cc scopes itself that way; (4) separate structure from variable order
    (IDEA-20260915-7ef636's 2x2-plus-planted-core null) -- this goal has measured evidence
    for the ORDER half only; (5) build the generic-baseline column by MEASURING rho and BSGS
    on these groups and this host, carrying sqrt(n) rather than sqrt(2n) and r rather than
    #E (at n = 15 the order is fully smooth and the substitution overstates rho by 12.4x),
    treating n = 15 as unusable for any asymptotic constant at ~7 equivalence classes. The
    first completion criterion requires (5), so it cannot be dropped.

    NEITHER COMPLETION CRITERION MOVES. C1 needs a fully measured boundary row per family
    with matched rho on the same machine; C2 needs the algorithm library under tools/ with a
    validator-run test per component. Accepting an instrument is preparatory work, and
    reporting it as progress against a criterion is precisely what CORR-20260916-402547
    corrects on the sibling campaign. BATCH-51e2aa still has no checkpoint shard -- a
    disclosed gap in that batch's archive, deliberately not backfilled here because it would
    be owned by no archival task.
