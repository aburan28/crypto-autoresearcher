    WHAT THE BATCH SETTLED. The repaired point-decomposition instrument is ACCEPTED for the
    Groebner, CPU-second, peak-RSS and SAT-status channels at (n, l) = (15, 5) on this host,
    at the bytes RUN-ICPERF-a4a24b measured. The Groebner column of the RQ-ICPERF-94c86e
    table is therefore MEASURABLE and still EMPTY -- an accepted instrument makes a column
    recordable and records nothing. EXP-ICPERF-e21835 is `analyzed`. Neither
    H-ICPERF-2c57cc nor H-ICPERF-cc4847 moves: an instrument acceptance tests no prediction
    of either, and epoch 1's manifest naming H-ICPERF-2c57cc as the run's hypothesis is
    corrected by CORR-20260916-b35a05.

    The one joint that carries the acceptance is R6, and it is worth naming why. Two engines
    agreeing on gb_size = 43 could not tell a correct converter from one that dropped an
    equation, because both read files from the SAME converter. TASK-20260915-abf147
    re-derived the quantity from the upstream instance through its own parser, emitter,
    verifier and Buchberger implementation -- cardinality 43, maximal degree 2, proper
    ideal, quotient dimension 3 -- and PROVED 43 and 2 forced in every monomial order for
    this instance. The quotient dimension, the one value no document leaked to it, was
    settled by brute force over 2^15 assignments with no Groebner engine at all.

    WHAT THE BATCH DID NOT SETTLE, and this is the immediate work: THE WALL-CLOCK CHANNEL IS
    NOT ACCEPTED. At the accepted bytes the Runner polled in 0.25 s sleeps, so wall_s for a
    child faster than one poll is a poll boundary rather than a duration -- 0.2515 s
    recorded for a SAT invocation the frozen run timed at a fiftieth of that. Every
    fast-child wall RATIO is driven toward 1 regardless of engine, which would have returned
    "no engine is faster than any other" as a MEASUREMENT, and no acceptance criterion could
    see it (A2 checks a ~49 s Groebner wall against [30, 120]). A concurrent session fixed
    it after the run was certified (commit e1728d8a8, recorded as additive amendment D6,
    UNACCEPTED: CORR-20260916-d51133 as corrected by CORR-20260916-33068f).

    THE IMMEDIATE ACTION IS DEC-20260915-927eaa NA-1: accept or reject amendment D6 on a
    measurement. Run the poll loop at the D6 bytes against a child of known short duration,
    show wall_s tracking it rather than the poll boundary, then re-measure the C-SATREG rows
    and record the corrected wall figures beside the accepted ones. It is seconds of compute
    gating every comparative wall claim this campaign intends to make, including the
    boundary table's per-phase timings and EXP-ICPERF-13f001's CPU-per-wall metric. Note
    that the CURRENT experiments/EXP-ICPERF-e21835/code/bench.py is NOT the accepted bytes;
    the accepted set is CODE_SHA256.json as of RUN-ICPERF-a4a24b.

    THEN, in DEC-20260915-927eaa's order: NA-2 restate the byte-attribution criterion at
    LINE granularity in the next repair contract (C-BYTE as written FAILED on
    EXP-ICPERF-e21835 -- 5 of 13 bench.py hunks draw from 2-3 defects -- and is deliberately
    not amended there); NA-3 close the shared-page double counting, because pgid_rss_kb sums
    COW-shared anonymous pages once per process after fork, so the memory limit is validated
    only for NON-FORKING children and every forking engine the campaign might add inherits
    an unvalidated limit; NA-4 supersede the contract's two defective statements (A6 cites
