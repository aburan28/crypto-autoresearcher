    EXP-ICPERF-13f001 STAYS AT approved_by NULL. AP-1 is DISCHARGED for the accepted
    channels by DEC-20260915-927eaa. AP-4 is now fillable from measured behaviour: a
    Macaulay2 F4 row on n15l5-1-S costs 46.5-48.0 engine CPU seconds and ~49 s wall at
    CPU/wall 3.37, peak RSS 6.62 GiB under an 8 GiB resident-set watchdog polled 197 times
    without firing -- but F4's resident memory on this 42-variable system is 8-10 GB and is
    SENSITIVE TO VARIABLE ORDER (Magma order under 8 GiB, reversed order over 9 GiB), and
    inter-poll growth reaches 1.40 GiB per 0.25 s so a declared 8 GiB limit has an effective
    ceiling near 9.4 GiB. A 15 GiB host with a balloon holding ~8.5 GB has no room for two
    such rows at once. AP-2 (slimgb), AP-3 (side-classified verifier) and AP-5 (lane claim)
    are unchanged and open, and AP-6 is NEW and owed for the wall channel.

    ANOTHER SESSION IS WORKING THIS GOAL. BATCH-94168f is open as a lane on branch
    claude/index-calculus-graph-dag-3linyk: it designed H-ICPERF-afe62e / EXP-ICPERF-2f2e40
