  next_action: >-
    BATCH-a33cda IS CLOSED (DEC-20260915-927eaa, 2026-09-16), and this field is rewritten
    from that decision's own ranking. Its 2026-09-16 wording said the immediate action was
    the epoch 2 resumption of TASK-20260915-4f4027; that ran, both independent validators
