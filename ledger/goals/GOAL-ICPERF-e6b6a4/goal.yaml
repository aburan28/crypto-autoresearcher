    - id: EXP-SEMBIN-4fa22c
      owner_goal: GOAL-SEMBIN-fcb7a2
      relation: >-
        GF(2) degree-4 Macaulay closure instrument. When it exists it is a candidate
        Groebner-side engine for the boundary table's binary rows.
