research_goal:
  id: GOAL-SIMSPK-001
  title: "SIMON and SPECK: score the standardized rotation constants against the full computable cryptanalytic portfolio, with a random-constant null family deciding what the score can detect"
  objective: >-
    Turn a trust dispute into a measurement. Reproduce the published
    optimal-differential and optimal-linear trail bounds for the standardized
    SIMON and SPECK constants; extend the scoring to the measures the prior
    evaluation did not cover — impossible-differential and integral/division-
    property reach, and rotational-XOR for SPECK — and report where the
    published constants sit in the distribution over the constant space under
    each measure. Run the identical pipeline over a random-constant null family
    first, so that any reported anomaly is known to be a property of the design
    rather than of the measure. Deliver a per-variant margin curve computed from
    exact trail bounds instead of the inherited summary that best attacks reach
    "slightly more than half the rounds". No attack on any full-round variant is
    in scope, and no statement about designer intent is admissible.
  question_ids: [RQ-SIMSPK-f6a6c0]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MD5-001, GOAL-ASCON-001, GOAL-AES-001, GOAL-ECTD-001]
  scheme_context:
    scheme: "SIMON and SPECK, all twenty published block/key size variants"
    family: "AND-RX Feistel and ARX lightweight block ciphers"
    nist_track: not_a_nist_candidate
    standardization_status: >-
      Reported rejected from ISO/IEC 29192-2 in April 2018 on trust grounds
      rather than on a published attack, while reportedly present in ISO/IEC
      29167-21/-22 for RFID air-interface use. Both claims UNVERIFIED.
      Deployed in constrained settings regardless of standardization outcome.
    why_this_scheme: >-
      Almost no public cryptographic controversy reduces to a finite integer
      computation. This one does. The objection was to unexplained parameter
      choices over a space small enough to enumerate, and exact optimal-trail
      search — mature, budget-reachable, and integer-valued — can say where the
      published choices actually fall. The program gets a rare thing here: a
      contested question with a computable answer, where BOTH possible answers
      are worth recording.
  non_duplication:
    - >-
      GOAL-ECTD-001 owns trapdoor and hidden-structure claims for elliptic
      curves, and GOAL-SNFS-001 owns them for integer and prime-field
      parameters. THIS GOAL MAKES NO TRAPDOOR CLAIM OF ANY KIND. Its output is
      a position in a distribution under named measures; if a batch finds
      itself constructing a trapdoor argument, it has left this goal's scope
      and the finding is handed off rather than written here.
    - >-
      GOAL-AES-001/002/003 own propagation objects for AES. The tracked object
      here is a parameter-space distribution rather than a single cipher's
      propagation, but the trail-search instrument and certificate conventions
      are shared: whichever runs second binds to the other's conventions or
      records why it cannot.
    - >-
      GOAL-MD5-001 owns instrument calibration. This goal consumes it. A trail
      search that has not been validated against known ground truth cannot
      support a distributional claim, because the distribution would be over
      solver artifacts.
  completion_criteria:
    - >-
      A REPRODUCTION RESULT against the prior constant-space evaluation:
      published optimal-differential and optimal-linear bounds for the
      standardized constants at named round counts, reproduced or not, within a
      PRE-DECLARED tolerance, with failures reported as failures. If the prior
      study cannot be located in primary text, that is recorded explicitly and
      the campaign proceeds knowing its baseline is missing.
    - >-
      A NULL-FAMILY RESULT, DELIVERED BEFORE ANY ANOMALY IS REPORTED: the
      identical scoring pipeline run over structurally identical ciphers with
      randomly drawn constants, establishing the spread each measure produces
      when there is nothing to find.
    - >-
      A SCORING TABLE placing the standardized constants in the constant-space
      distribution under every measure computed, with the enumeration rule
      stated per variant and any sampled-rather-than-exhausted region named.
      The outcome that the published constants are unremarkable under every
      measure is a complete result and closes the goal.
    - >-
      A PER-VARIANT MARGIN CURVE from exact trail bounds as far as the solver
      reaches, with every solver timeout recorded as a budget outcome and never
      as a bound.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions. THE
      RED TEAM IS SPECIFICALLY CHARGED with checking that no record drifts from
      a distributional statement toward a statement about intent.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, scoped to the measures,
      variants, round counts, and solver budget actually run.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The specification and the prior constant-space study cannot be obtained
      under the network policy after the declared source-preference order is
      exhausted.
    - >-
      Exact trail search over the constant space exceeds the declared campaign
      budget after cheaper falsification gates are exhausted. This is a budget
      outcome about a solver and is never a security statement about any
      variant (AGENTS.md rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Acquisition first, and the acquisition has an unusual priority: LOCATE THE
    PRIOR CONSTANT-SPACE STUDY BEFORE ANYTHING ELSE. This program believes one
    exists; designing an extension without it is the exact baseline-reproduction
    failure docs/inventor-protocol.md section 8 exists to catch, and the whole
    goal's value depends on extending rather than repeating. THE FIRST TECHNICAL
    GATE IS THE NULL FAMILY, RUN BEFORE THE REAL CONSTANTS ARE SCORED AT ALL.
    Scoring random constants first is cheap, it is the only way to know what
    spread each measure produces when there is nothing to find, and running it
    afterwards would let a result be interpreted before its control exists.
    Start with the smallest variant, where exhaustive enumeration is actually
    reachable, and state the sampling rule the moment exhaustion stops being
    possible. Claim tier: a distributional statement under named measures.
    NOTHING IN THIS CAMPAIGN MAY BE WRITTEN AS A STATEMENT ABOUT A BACKDOOR OR
    ABOUT ANY DESIGNER'S INTENT, in either direction — an anomaly is not
    evidence of one, and its absence is not a clearance.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
