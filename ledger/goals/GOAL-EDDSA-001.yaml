research_goal:
  id: GOAL-EDDSA-001
  title: >-
    Ed25519: build the verification-semantics divergence matrix as literal
    accept/reject certificates, and classify each divergence by what an
    adversary must control to reach it
  objective: >-
    Replace an inherited folklore property — "an Ed25519 signature either
    verifies or it does not" — with an enumerated, certificate-backed matrix.
    The separating objects live in a finite torsion structure and a finite set
    of non-canonical encodings, so the enumeration is COMPLETE rather than a
    bounded search: this is one of the very few security-relevant questions in
    this program that admits an exhaustive answer within minutes of compute.
    For each verification decision point, derive what each named specification
    requires from its primary text, and where two admissible readings differ,
    emit a literal (public key, message, signature) triple that separates them,
    re-verified by two independently written implementations. Then classify
    every certificate by the adversary's required control — signing key, public
    key only, signature only, or nothing — because that classification, not the
    existence of the divergence, is the security-relevant statement. Batch
    verification is treated as a first-class reading whose acceptance set is
    compared against single verification. No statement about any third-party
    library, product, chain or service is in scope.
  question_ids: [RQ-EDDSA-9b8473]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 5
    total_wall_clock_seconds: 7200
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-ECDSA-001, GOAL-SIG-001, GOAL-ROS-001]
  scheme_context:
    scheme: "Ed25519, Ed25519ph/ctx (RFC 8032), FIPS 186-5 EdDSA; Ristretto255 as the designed-away nearby object"
    family: "Schnorr-type signatures over a cofactor-8 curve with a prime-order subgroup"
    nist_track: fielded_standard
    standardization_status: >-
      RECALLED, UNVERIFIED: RFC 8032 plus FIPS 186-5 admission. Deployed for SSH
      keys, package and release signing, certificate transparency logs, and
      consensus-critical validation in several distributed systems.
    why_this_scheme: >-
      Three properties make this the highest evidence-per-unit-compute target
      available to the program. The separating set is FINITE AND SMALL, so the
      answer is exhaustive rather than probabilistic. The evidence is a
      CERTIFICATE any reader checks in microseconds — the strongest tier this
      program can produce. And the property at issue is one that higher-level
      systems (consensus, transparency logs, reproducible builds) assume without
      ever testing, because no official test vector exercises it. Against that:
      the divergence class is known in the literature, so novelty lies in
      completeness, adversary-reachability classification, and certificates,
      not in discovering that a divergence exists.
  non_duplication:
    - >-
      GOAL-ECDSA-001 owns nonce-leakage lattice and Fourier recovery for ECDSA.
      This goal touches no leakage, no lattice, and no secret-dependent data. The
      two share a curve and nothing else; neither may cite the other's result.
    - >-
      GOAL-ROS-001 owns concurrency and nonce-generation failures in Schnorr-type
      protocols. This goal owns verification semantics for a single signature
      and never varies the signing procedure.
    - >-
      GOAL-HYBRID-001 also produces "two objects, one output" certificates, for
      KEM binding. The certificate discipline is shared deliberately; the objects,
      mechanisms and specifications are disjoint and cross-citation is prohibited.
  completion_criteria:
    - >-
      A COMPLETE DIVERGENCE MATRIX: every verification decision point enumerated,
      every named specification's requirement derived from filed primary text with
      the clause cited, and cells the specification does not determine marked
      undetermined rather than resolved for tidiness.
    - >-
      A CERTIFICATE SET: for every reachable divergence, a literal triple emitted
      as bytes, accepted under one reading and rejected under another, re-verified
      by two implementations written independently from the specification text and
      both passing the official test vectors first.
    - >-
      AN ADVERSARY-REACHABILITY CLASSIFICATION for every certificate, stating the
      minimum control required to produce it, with the derivation.
    - >-
      A BATCH-VERIFICATION RESULT: whether the batch equation's acceptance set
      equals single verification's under each admissible reading, with a
      certificate for each inequality or an explicit statement of the enumeration's
      boundary where none was found.
    - >-
      Independent Validator and Red Team sessions admit the run package, verifying
      that every certificate reproduces from the recorded bytes, that both checkers
      pass the official vectors, and that no record overstates a divergence as a
      break of the signature scheme.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry committed
      through a verified ledger archive, scoped to the readings and encodings
      actually enumerated.
  pause_conditions:
    - The five-batch campaign budget is exhausted without an admissible next mechanism.
    - RFC 8032 or FIPS 186-5 cannot be obtained in primary text under the network policy after the declared source-preference order is exhausted; the matrix is a claim about documents and cannot be built from memory.
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    BUILD THE ENUMERATION BEFORE READING ANYTHING. The torsion structure of the
    curve and the set of non-canonical encodings are fixed public mathematics; the
    complete list of candidate separating objects can be generated, and each
    candidate's behaviour under each admissible verification equation computed,
    with no specification text and no literature. That produces the matrix's
    ROW SPACE and a set of candidate certificates in one cheap batch. Acquisition
    then decides only which columns exist and which cells are determined. Run the
    torsion enumeration and the two clean-room verifier implementations first,
    validate both against the official test vectors, and hold every certificate
    as a candidate until the specification text lands. Claim tier: verification-
    semantics divergence with literal certificates; never a statement about
    Ed25519's hardness assumption and never a statement about any deployed system.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
