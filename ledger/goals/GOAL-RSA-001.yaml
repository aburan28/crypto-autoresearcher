research_goal:
  id: GOAL-RSA-001
  title: "RSA: build the memory-charged NFS cost baseline this program lacks, and validate it against the record computations it would be extrapolated from"
  objective: >-
    Give the program a factoring analogue of KN-TECH-057. Re-implement a
    number-field-sieve cost model that predicts phase running times and matrix
    size from parameters, validate it against the published RSA-240, RSA-250
    and 795-bit DLP-240 measurements, charge the linear algebra's memory and
    communication rather than reporting core-years alone, adjudicate the
    core-year versus area-time disagreement the corpus currently holds
    unreconciled, and emit a concrete cost table at RSA-1024/2048/3072 with
    every optimistic assumption flagged. No factorization record is attempted
    and no break is claimed: the deliverable is the baseline that any future
    RSA claim — including any comparison of this program's own results
    against "the RSA line" — would otherwise be inherited without.
  question_ids: [RQ-RSA-afe33c]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-ECTD-001, GOAL-CRYPTO-001, GOAL-ECDSA-001]
  scheme_context:
    scheme: "RSA (balanced semiprime factorization)"
    family: "number field sieve (general NFS; special NFS as control)"
    nist_track: not_a_nist_candidate
    standardization_status: >-
      Deployed at scale and on a published migration path away from it.
    why_this_scheme: >-
      The program's most-cited comparison point is the one it cannot cost.
      docs/inventor-protocol.md treats "this space is exhaustively studied" as
      a hypothesis about the search rather than a reason to decline, and the
      honest form of that here is not an attack on NFS but the missing
      baseline: a matched, memory-charged cost model, validated against
      published measurements.
  non_duplication:
    - >-
      GOAL-ECTD-001 owns elliptic-curve trapdoors including hidden-SNFS
      patterns. This goal owns NFS COST for integer factorization. Where the
      two touch — special NFS structure — this goal uses SNFS only as a
      control on the model and defers any trapdoor claim to GOAL-ECTD-001.
    - >-
      GOAL-CRYPTO-001 owns reproducible crypto-scale ECDLP search. This goal
      produces the factoring-side cost convention that any cross-primitive
      comparison would need, and produces no ECDLP result.
    - >-
      GOAL-ECDSA-001, opened in the same batch, owns the ECDSA-side charged
      frontier. The two goals share a discipline (memory beside time,
      certificates, flagged optimism) and must not derive two incompatible
      charging conventions; the first batch of whichever runs second binds to
      the other's convention or records why it cannot.
  completion_criteria:
    - >-
      An independently re-implemented NFS cost model with a stated
      reproduction result against the published record computations — RSA-240,
      RSA-250, and the 795-bit DLP-240 record as a same-size cross-problem
      control — reporting for each whether predicted running time and matrix
      size fall within a PRE-DECLARED factor, with failures reported as
      failures.
    - >-
      A charged linear-algebra model: memory footprint and communication
      requirement for block Wiedemann at record matrix dimensions, with the
      parallel scaling law stated, plus a reasoned position on the core-year
      versus area-time disagreement naming which record data supports which.
    - >-
      A COST-* record at RSA-1024 / 2048 / 3072 following
      templates/research-records.md: memory beside time, every optimistic
      assumption enumerated, overestimating factors named, time-memory
      tradeoff stated, and affected-versus-safe scope explicit.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive. If the model reproduces the
      records, the warranted knowledge entry is a KN-TECH charging convention
      for factoring, explicitly the factoring analogue of KN-TECH-057.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The record announcements and the NFS simulation methodology cannot be
      obtained under the network policy after the declared source-preference
      order is exhausted.
    - >-
      Calibration runs at sizes this harness can reach exceed the declared
      campaign budget after cheaper falsification gates are exhausted. This is
      a budget outcome about the model's calibration and is never evidence
      about the cost of factoring (AGENTS.md rule 5).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Open with acquisition and filing, not ideation: RQ-RSA-afe33c.constraints
    forbids design before the record announcements and the simulation
    methodology are KN-LIT entries, and the quoted phase figures already carry
    one unexplained discrepancy — 130 + 2450 + 250 core-years does not equal
    the headline 2700 — which the transcription must resolve against primary
    text rather than smooth over. THE FIRST TECHNICAL GATE IS THE CHEAPEST AND
    MOST DECISIVE ONE: reproduce the published matrix size and phase times for
    RSA-240 and RSA-250 from parameters, and DO IT AGAINST DLP-240 TOO. The
    same-size factorization-versus-discrete-logarithm control was set up by
    the literature at no cost to this program, and a model that reproduces one
    but not the other is caught before any extrapolation is built on it. A
    reproduction failure here is a RESULT, not a setback, and closes the
    campaign's most expensive branch early. Do not build the RSA-2048 table
    before that gate passes; an extrapolation from an unvalidated model is the
    exact failure this goal exists to stop the program from inheriting. Claim
    tier: statements about a cost model only, never about deployed keys.
  owner: coordinator
  created_at: '2026-08-04'
  updated_at: '2026-08-04'
