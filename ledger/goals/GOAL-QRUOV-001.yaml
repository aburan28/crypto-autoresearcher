research_goal:
  id: GOAL-QRUOV-001
  title: "QR-UOV: is the quotient-ring key compression security-neutral?"
  objective: >-
    Decide whether QR-UOV's quotient-ring representation is a pure
    compression or a genuine structural weakening: build the matched
    extension-field-UOV baseline cost, then search for a structure-aware
    attack that beats it, with explicit attention to the quotient
    polynomial's factorization type and to any weak-key family it
    induces.
  question_ids: [RQ-QRUOV-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "QR-UOV"
    family: "multivariate (Unbalanced Oil and Vinegar over a quotient ring)"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      Either a certified toy-scale key recovery whose fully charged cost
      beats the matched extension-field-UOV baseline, with a conditional
      extrapolation to a named parameter set; or a derivation showing
      the quotient-ring structure yields no advantage beyond the known
      reduction, together with a measured weak-quotient-polynomial
      density bound.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      No QR-UOV Round-3 specification can be obtained under the network
      policy after the declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-QRUOV-001 after the extension-field-UOV
    baseline is filed as a KN-TECH entry. Coordinate with RQ-UOV-001:
    the plain-UOV attack model is a shared dependency and must not be
    re-derived twice with two different cost conventions.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
