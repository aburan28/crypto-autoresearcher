  impediments_discharged:
    - id: IMP-FROB-6333A9-REVIEWCARDS
      raised: '2026-09-22'
      raised_by_decision: DEC-20260922-e9d35a
      discharged: '2026-09-22'
      discharged_by_decision: DEC-20260922-e9d35a
      condition: >-
        Blocker, not a declared pause_condition. BATCH-5286b0 was opened by a
        session that could not mint identifiers, so the review round the frozen
        contract requires (`review_required: true`) had no reviewer cards and no
        review_plan.
      what_it_claimed_was_blocked: >-
        "The CLAIM, precisely ... NOT blocked: the batch, the executor card, the
        run itself, or this campaign."
      why_that_claim_was_WRONG: >-
        THE DISPATCHER CONTRADICTED IT, and the dispatcher was right.
        `_validate_review_chains` (research_dispatch.py lines 765-812) refuses
        the WHOLE QUEUE when a producer carries `review_required: true` and its
        review chain is incomplete -- it demands reviewer successors depending on
        both the producer and its snapshot archive, and exactly one ledger
        archive depending on every review. With TASK-20260922-cd6f21 in this
        queue, the missing review cards blocked the queue, and therefore the run.
        The impediment was RIGHT ABOUT WHAT WAS OWED AND WRONG ABOUT WHAT IT
        STOPPED. Preserved here rather than silently corrected: a scoping claim
        that a tool falsified is worth more on the record than a tidy one.
      how_it_was_discharged: >-
        Not by narrowing the claim -- by completing the chain.
        coordination/review/frob-20260922-5286b0/review-plan.yaml was written
        first, with the prior recorded before any reviewer and before the
        measurement exists, six joints each owned by exactly one reviewer with a
        worked attack, a proves-too-much control and a blind re-derivation with
        its blind_from list. Then TASK-20260922-ba4a2f (validator, J1/J2/J4/J6),
        TASK-20260922-e62294 (red team, J3/J5) and TASK-20260922-7ef166 (compose
        and ledger-archive, owning DEC-20260922-f4d910).
      what_remains_genuinely_unreached: >-
        An EVIDENCE RECORD. No `EV-FROB-*` identifier is minted, so this batch
        closes its review round with a composed decision and no EV-*, and
        therefore discharges NEITHER C1 NOR C2 -- C1 asks for a measured ratio
        "citing run/evidence IDs". That is a declared remainder of the batch, not
        an impediment on the campaign: it needs one identifier and the
        measurement that does not yet exist.
      asserts_nothing_about: >-
        The science, in either its raised or its discharged form. A session
        tooling gap is not negative mathematical evidence about Frobenius-stable
        factor bases, is not an infrastructure verdict on WDSat, and is not a
        statement that the review will find anything.
  next_action: >-
    TWO DISJOINT TRACKS, neither blocking the other. (A) Independent validation
    and red-team of EXP-FROB-ec08b5 (EV-FROB-d336b0, DEC-20260922-5796b8), which
    answers the factor-base half of RQ-FROB-7d8dd4: the Frobenius-orbit gain is
