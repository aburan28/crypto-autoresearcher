research_goal:
  id: GOAL-FROB-6333a9
  title: >-
    Frobenius-stable factor bases vs WDSat search: decide basis-blindness at
    rich n (41 / 43)
  objective: >-
    Answer the residual of RQ-FROB-7d8dd4 left after IDEA-20260918-9abf42
    (stable subspaces exist at intermediate dimension on rich n) and
    IDEA-20260906-a77711 (Frobenius is equivariance, not a solving-degree
    symmetry): does an invariant factor base prune WDSat conflicts on
    fixed-target UNSAT PDPs below 2^{m l}/m!? Primary cell n = 41, m = 2;
    decisive cell n = 43, m = 3 capacity-gated. Publish the conflict ratio;
    open branch-order / conflict-depth follow-on only if pruning is measured.
    Do not attack deployed curves; do not reopen GFPN-excluded combined arms
    under this goal.
  question_ids:
    - RQ-FROB-7d8dd4
  active_hypothesis_ids:
    - H-FROB-a5bf86
    - H-FROB-6774fb
  status: active
  owner: coordinator
  created_at: '2026-09-20'
  updated_at: '2026-09-22'
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 1
    max_concurrent_basis: >-
      MACHINE HEADROOM. WDSat cells require the machine otherwise quiet; one
      solver-running task at a time.
  budget_note: >-
    maximum_batches and total_wall_clock_seconds are null because FROB is a
    declared ECC area (orchestration/research-priority.yaml).
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  completion_criteria:
    - id: C1
      statement: >-
        Measured WDSat conflict ratio vs 2^{ml}/m! on the n = 41 primary cell
        (stable V and random-V control), with independent UNSAT certificates,
        citing run/evidence IDs; verdict basis-blind or pruning within the
        preregistered thresholds.
      status: OPEN
    - id: C2
      statement: >-
        Either a completed n = 43 decisive cell under the same protocol, or a
        recorded impediment naming the capacity limit with clears_when.
      status: OPEN
  pause_conditions:
    - WDSat or the instance generator cannot be built; record an impediment.
    - review-breakthrough required for a claim and unservable; claim stays un-promoted.
  impediments:
    - id: IMP-20260922-stage0
      recorded_by: DEC-20260922-5796b8
      recorded_at: '2026-09-22'
      what_is_blocked: >-
        EXP-FROB-d8aa37 stage0, trial `stage0-q8-n3-complete`, has not completed
        in nineteen consecutive launch attempts across trial plans v3 to v23.
      diagnosis: >-
        An engineering defect in the frozen driver, not an infrastructure
        accident, and a twentieth identical relaunch would fail the same way.
        (1) driver-v2.py writes one JSON record per signed tuple, so the partial
        roots.jsonl.gz of RUN-FROB-4b8e05 reached 2.44 GB in about three hours
        and exceeded the 100 MiB hosting limit -- a completed run could not have
        been archived as specified either. (2) The driver has no resume path, so
        every environment reclamation loses the whole run; a 24-hour watchdog
        cannot be met by an ephemeral container. (3) `sage` is not on PATH in a
        fresh container here (it is /opt/conda-sage/bin/sage), so the v23 launch
        command would fail before any science began.
      clears_when: >-
        Stage0 is amended -- additively, never by rewriting the frozen record --
        to emit bounded aggregates instead of a per-tuple stream, to checkpoint
        per cell with a --resume path, and to resolve the interpreter by absolute
        path. EXP-FROB-ec08b5's driver is the worked reference for all three: the
        same environment ran its five phases in 53 seconds with 51 KB of output.
      recheck: >-
        Next session that opens this goal. Do not authorise a twentieth identical
        relaunch before the amendment lands.
      is_not_evidence: >-
        No stage0 run reached a checker, so nothing scientific is being withheld.
        This is execution status and is never negative mathematical evidence
        about H-FROB-73df22 or any other hypothesis.
  next_action: >-
    Independent validation and red-team of EXP-FROB-ec08b5 (EV-FROB-d336b0,
    DEC-20260922-5796b8), which answers the factor-base half of RQ-FROB-7d8dd4:
    the Frobenius-orbit gain is exactly n and never more, is available only on
    the dimension lattice cut by the divisors of T^n - 1, and is a net loss at
    n = 131 and n = 163 for every m tested. Then promote to KN-FIND. SEPARATELY,
    amend EXP-FROB-d8aa37 stage0 per impediment IMP-20260922-stage0 before any
    further launch attempt; do not authorise a twentieth identical relaunch.
    The WDSat conflict-ratio question (H-FROB-a5bf86, criteria C1/C2) is
    untouched by EXP-FROB-ec08b5 and remains open.
  cross_referenced_not_owned:
    - id: GOAL-ICPERF-e6b6a4
      relation: Owns WDSat build/sizing machinery and PDP phase tables; reused, not re-owned.
    - id: IDEA-20260918-9abf42
      relation: Supplies the rich-n dimension table; counting holds under DEC-20260920-f1e672.
    - id: IDEA-20260906-a77711
      relation: Closes rewriting gain; does not decide SAT pruning (this goal's residual).
  scope_exclusions:
    - Deployed Koblitz / ECC2K-130 as attack instances.
    - Combined WDSat+torsion+coset arm (IDEA-20260920-18dc28) under GFPN.
    - Claiming a77711 implies equal first-fall degree on stable vs random V.
