      recorded_by: DEC-20260923-37693b
      recorded_at: '2026-09-23'
      condition: >-
        Blocker, not a declared pause_condition. EXP-FROB-30006a was executed out
        of band, under the superseded card TASK-20260920-66a30e and with no lane
        claim. The outputs are on the unmerged ref
