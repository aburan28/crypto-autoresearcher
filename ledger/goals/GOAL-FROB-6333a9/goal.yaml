research_goal:
  id: GOAL-FROB-6333a9
  title: >-
    Frobenius-stable factor bases vs WDSat search: decide basis-blindness at
    rich n (41 / 43)
  objective: >-
    Answer the residual of RQ-FROB-7d8dd4 left after IDEA-20260918-9abf42
    (stable subspaces exist at intermediate dimension on rich n) and
    IDEA-20260906-a77711 (Frobenius is equivariance, not a solving-degree
    symmetry): does an invariant factor base prune WDSat conflicts on
    fixed-target UNSAT PDPs below 2^{m l}/m!? Primary cell n = 41, m = 2;
    decisive cell n = 43, m = 3 capacity-gated. Publish the conflict ratio;
    open branch-order / conflict-depth follow-on only if pruning is measured.
    Do not attack deployed curves; do not reopen GFPN-excluded combined arms
    under this goal.
