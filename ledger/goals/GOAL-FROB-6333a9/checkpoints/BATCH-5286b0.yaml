  # -------------------------------------------------------------------
  # THE PROTOCOL AMENDMENT -- the substantive content of this opening
  # -------------------------------------------------------------------
  protocol_amendment:
    id: AMD-EXP-FROB-30006a-20260922-nullcontrol
    path: experiments/EXP-FROB-30006a/amendments/AMD-20260922-nullcontrol.yaml
    kind: additive_protocol_amendment
    authorized_by: DEC-20260922-e9d35a
    written_before_any_run_existed: true
    written_before_any_run_existed_basis: >-
      experiments/EXP-FROB-30006a/runs/ contains only .gitkeep, bound by that
      name in TASK-20260920-956d12's receipt at commit 14ef07b83. Zero outcomes
      observed, so the prohibition on changing a success criterion after
      observing outcomes is not engaged. This is checkable with git ls-tree and
      is not asserted in prose alone.
    what_it_adds:
      A-1: >-
        search_mode declared an independent variable (wdsat_default,
        wdsat_xg_ext); both modes required at the primary cell on every
        certified-UNSAT replicate of both arms; verdict computed per mode; a mode
        disagreement is `inconclusive` and is never resolved by choosing a mode.
      A-2: >-
        `pruning` requires r_s <= 0.5 AND r_r > 0.5 in the same mode on the same
        replicates. Both arms at or below 0.5 is the named bin `null_loose` -- a
        finding about the null 2^{ml}/m! and HEUR-FROB-WDSAT-NULL, never support
        for pruning.
      A-3: r_s / r_r reported as a primary quantity per mode.
      A-4: >-
        `null_loose` carries a forward obligation to be reported as evidence
        against the declared heuristic_under_test, not as a failed measurement.
    what_it_weakens: >-
      NOTHING. 0.5 stays 0.5, 0.01 stays 0.01, the basis_blind branch is
      untouched, and pruning is strictly harder to reach. No cell, curve,
      dimension, seed, control, invalidation rule or stopping rule changes, and
      the specification is not edited.
    why_it_was_needed: >-
      Two defects in the frozen contract, both checkable by reading it. D1: the
      primary metric is conflicts / 2^{ml}/m! and the contract names no WDSat
      search mode, while EV-FROB-b6e1e9 measures that mode at 69x (n=19) and
      220x (n=23) on comparable Koblitz PDP instances -- a two-orders-of-magnitude
      knob on the numerator against a basis_blind window 0.02 wide. D2: the
      pruning branch reads only r_s, so any effect common to both arms returns a
      claim specifically about Frobenius stability. EV-FROB-b6e1e9's
      resource_check reading (ii) is what makes D2 live: under XG a baseline with
      no Frobenius specialness sat 12x and 24x BELOW its own orbit-naive
      enumeration bound, and 2^{ml}/m! is a bound of exactly that kind.
    transfer_assumption_declared: >-
      The amendment does NOT assume that gap transfers from n=19/23 on a
      non-linear orbit union at m=2 to n=41/43 on the linear ker g(sigma). It
      assumes only that the transfer is POSSIBLE, which justifies a control and
      not a prediction. Both defects stand independently of any transfer.

