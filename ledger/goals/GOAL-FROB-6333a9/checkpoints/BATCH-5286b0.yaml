  review:
    review_plan: coordination/review/frob-20260922-5286b0/review-plan.yaml
    review_plan_id: REVIEW-FROB-20260922-5286b0
    review_plan_written: true
    written_before_any_reviewer_ran: true
    written_before_the_measurement_existed: true
    joints:
      J1: THE OBJECT IS THE ONE THE CONTRACT NAMES (owner TASK-20260922-ba4a2f)
      J2: EVERY SCORED ROW CARRIES AN INDEPENDENT UNSAT CERTIFICATE (owner TASK-20260922-ba4a2f)
      J3: THE NULL AND THE AMENDED BINNING (owner TASK-20260922-e62294)
      J4: INSTRUMENT SIZING AND SEARCH-MODE LABELLING (owner TASK-20260922-ba4a2f)
      J5: PROVES TOO MUCH -- the random-V arm, and a conditional variable-order scramble (owner TASK-20260922-e62294)
      J6: BLIND RE-DERIVATION of the median stable-arm ratio (owner TASK-20260922-ba4a2f)
    joint_verdicts: {}
    blindness: mutual, not lifted
    independence_check: >-
      not run; no reviewer has run. `tools/check_review_independence.py` is a
      hard completion gate on TASK-20260922-7ef166 and its result must be
      recorded in DEC-20260922-f4d910 whatever it is.
    prior_contamination: >-
      DISCLOSED AS PD-R1 ON THE PLAN. The prior, the amendment whose application
      J3 checks, and the design of J5 were all produced by ONE session -- the
      same that composed EV-FROB-b6e1e9 and found both contract defects. So
      concurrence with the prior is weaker evidence than it looks, and a later
      reader must discount it by the right amount rather than by none. It cannot
      be cured from here: an uncontaminated prior needs a Coordinator that had
      not read EV-FROB-b6e1e9, and that reading is the reason the plan could be
      written at all. Revisit condition on the plan: if the run returns
      `pruning`, a red-team pass by an agent that has read neither this plan nor
      EV-FROB-b6e1e9 is owed before any promotion.
    why_it_could_be_written_at_opening: >-
      Its joints are the CONTRACT's load-bearing steps, not the run's outputs:
      what the run will measure is unknown, but what it must get right to have
      measured anything is fully determined by the frozen specification and the
      amendment. This is BATCH-cbb416's reasoning, which this batch's first draft
      had in front of it and did not apply -- see PD-3.
    superseded_reasoning_for_not_writing_it: >-
      A review plan's central property is exactly one owner per joint, and the
      two reviewer TASK-* identifiers could not be minted in the opening session
      (DEC-20260922-e9d35a PD-1, PD-3). A plan with unassigned joints reads as
      rigorous while failing its own independence check, which
      tools/check_review_independence.py exists to catch. BATCH-cbb416 on
      GOAL-SEMBIN-fcb7a2 could write its plan at opening because its joints were
      the contract's load-bearing steps and it had identifiers to own them; the
      first half of that reasoning holds here too, which is why the plan is the
      NEXT Coordinator act and not a deferred one.
    when_it_must_exist: >-
      Before any REVIEWER runs. SATISFIED, and better than required: it exists
      before the PRODUCER runs too, so the quantity J6 targets does not exist and
      cannot be pre-leaked -- the failure CORR-20260916-292e53 records. The plan
      carries a standing obligation that follows from this: no card, queue note,
      bus message, receipt or report in this batch may quote a measured conflict
      ratio, median or verdict before the re-derivation returns, and the
      Coordinator re-greps the tree -- including whatever the dispatch itself
      writes -- before dispatching TASK-20260922-ba4a2f.
    joints_expected_superseded_by_the_written_plan:
      - >-
        Whether the stable V actually is ker f(sigma) for a degree-20 irreducible
        factor of (T^41-1)/(T-1), and whether the random V was verified
        non-stable rather than assumed.
      - >-
        Whether each scored row carries an INDEPENDENT UNSAT certificate, and
        whether any conflict count was scored without one (C-CERT, an
        invalidation rule).
      - >-
        Whether MAX_ID equals the ANF-derived value on every run (C-SIZE) and
        whether the two search modes were served by the same build.
      - >-
        Whether the amended decision rule was applied as written -- both modes,
        the r_r conjunct on pruning, `null_loose` named rather than absorbed into
        inconclusive, and no mode silently preferred.
      - >-
        A blind re-derivation of the conflict ratio from the statement of the
        quantity and the parameters alone, with the producer's implementation and
        report in blind_from.
    joints_expected_note: >-
      THE SKETCH THE PLAN WAS WRITTEN FROM, KEPT FOR COMPARISON AND SUPERSEDED BY
      IT. It named five expectations with no owner, no worked attack, no
      proves-too-much control and no blind_from list. The written plan has six
      joints, each owned, each with a worked attack and a named breaking
      artifact. The difference between the two is what the word "plan" is doing
      in "review plan", and it is left visible rather than overwritten.
    rule_12_status: >-
      Not triggered and pre-declared. If a `pruning` verdict were promoted as
      CONTRADICTING prior FROB negatives, AGENTS.md rule 12 would require
      review-breakthrough at max, which is `degradable: false` and cannot be
      served in this environment -- the CLAIM would stay un-promoted, not the
      campaign parked. No cheaper tier is pre-authorized here for a result nobody
      has seen.

  procedure_deviations:
    - id: PD-2
      severity: material
      what: >-
        The batch-opening act's card was written AFTER the act, because the queue
        that carries it is one of the things the act creates. The first draft of
        this batch had no opening card at all and declared the ledger archive
        with an empty `source_task_ids`; `tools/research_dispatch.py` refused the
        queue with "tasks[0].archive.source_task_ids must be a nonempty text
        list". The schema was right: every archive follows a producer, and the
        empty list was the shadow of the missing card rather than a property of
        opening archives. Recorded in full on DEC-20260922-e9d35a.
      what_was_done: >-
        The card was written as queue tasks[0], `state: completed`, owning the
        eight opening artifacts with a full envelope, a budget and a completion
        gate, and naming TASK-20260922-0e3b58 as its archival owner -- which
        makes that archive's source TRUE rather than schema-satisfying. Naming
        TASK-20260920-956d12 instead was considered and rejected as false; a
        self-referencing source and dropping the archive card from the queue were
        also rejected, with reasons, on the decision and in the queue's notes.
      consequence: >-
        None for ownership or durability, which held throughout. The residual
        weakness is real: a write scope written after the work does not constrain
        the work, only makes it checkable afterwards. The next batch on this goal
        writes its opening card first.
    - id: PD-4
      severity: disclosed
      what: >-
        The queue was REFUSED THREE TIMES by `tools/research_dispatch.py` before
        it dispatched, and no refusal was found by the authoring Coordinator: an
        empty `source_task_ids` on the opening archive (PD-2), directory entries
        in the merged executor card's `artifact_paths` (ITEM-5), and a ledger
        archive owning no `ledger/decisions/` path. Recorded in full on
        DEC-20260922-e9d35a.
      what_it_cost_and_what_it_did_not: >-
        Three rounds and no corrections: nothing was pushed at any refusal,
        because the driving session held the push rather than publishing an
        unverified queue. The last two PRs here auto-merged within fifteen
        minutes, so an undispatchable queue would have landed on `main` and
        become another campaign's inherited defect -- which is what
        GOAL-ICEX-001, GOAL-SIG-001 and GOAL-DREG-001 are carrying now.
      the_substantive_one: >-
        The third refusal OVERTURNED A DELIBERATE CHOICE: the ledger archive's
        `artifact_paths` had been narrowed to its receipt alone, on the principle
        that a task's produced set and staged set should stay disjoint.
        `_validate_ledger_archive` requires a ledger archive to own the decision
        it makes official. Under AGENTS.md rule 7 the verifier is what makes a
        record official, so the contract won and the principle is recorded as
        having lost. It was not wrong, it was over-applied: the snapshot archive
        TASK-20260922-98729f keeps the one-path shape because that branch never
        runs for `kind: snapshot`, and the union at line 931 preserves the
        separation for the other eight sources either way.
    - id: PD-3
      status: RESOLVED WITHIN THIS UNPUBLISHED ACT
      what: >-
        The first draft declined to write the review plan, reasoning that joints
        cannot be owned by identifiers that do not exist. The constraint was real
        and the conclusion too broad: what could not be done was OWNING the
        joints, and what was lost by waiting was the only part that expires --
        the prior, and the blind re-derivation's protection, which exists only
        while the quantity does not.
      how_it_resolved: >-
        Three identifiers were minted and the plan written in the same
        unpublished act, before any reviewer and before the measurement exists.
        IMP-FROB-6333A9-REVIEWCARDS is discharged rather than carried.
      residual_cost: >-
        The prior is contaminated and the plan says so as PD-R1. Disclosed, not
        cured; curing it needs a Coordinator that had not read EV-FROB-b6e1e9,
        and that reading is why the plan could be written at all.
    - id: PD-5
      severity: material
      what: >-
        TASK-20260922-7ef166 both WRITES and ARCHIVES DEC-20260922-f4d910 -- the
        same conflation PD-2 records catching at this batch's opening.
      why_accepted: >-
        No fifth handoff identifier is minted, and `_validate_review_chains`
        requires exactly ONE ledger archive over the reviews, so the correct
        split is a separate non-archive COMPOSE card sourced by that archive --
        a real structure needing an identifier this session does not have.
      consequence: >-
        The composition has no write scope or completion gate of its own while it
        is being written, and its artifacts are unowned until the same card
        commits them. A later batch on this goal should split it.
  procedure_deviations_note: >-
    Two, both disclosed at opening rather than discovered later. Departures from
    this batch's plan go in the closing decision and in the review plan's own
    procedure_deviations, never quietly absorbed.

