research_goal:
  id: GOAL-POLYMAC-001
  title: "GHASH and Poly1305 on one frontier: measure whether the forgery bounds behind deployed rekeying limits are tight, using each construction as the other's control"
  objective: >-
    Take the program's symmetric work up one layer, from primitives to the mode
    where deployed cryptography actually fails. Measure forgery success
    probability against message length and query count on declared scaled-down
    analogues where exhaustion is possible, and report the RATIO to the bound
    instantiated at the same parameters rather than the bound alone; count
    exactly the weak-key structure each field admits and whether the two
    constructions inherit the same exposure; and quantify the nonce-misuse cliff
    as a cost — how many repeated-nonce pairs recover the authentication key, at
    what measured cost — so a known-catastrophic failure becomes a number a
    deployment can reason about. Require any model to explain BOTH constructions:
    the same polynomial-evaluation idea over a binary extension field and a prime
    field is a free control, and a model that fits one is a field artifact. No
    attack on correctly-used AES-GCM or ChaCha20-Poly1305 is in scope.
  question_ids: [RQ-POLYMAC-7c89e4]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-ASCON-001, GOAL-AES-002, GOAL-BLAKE-001]
  scheme_context:
    scheme: "GHASH (AES-GCM) and Poly1305 (ChaCha20-Poly1305)"
    family: "polynomial-evaluation universal hash MACs inside nonce-based AEAD"
    nist_track: fielded_standard
    standardization_status: >-
      Both fielded at internet scale. The concrete data limits and rekeying
      intervals written into protocol specifications and library defaults are
      derived from these bounds.
    why_this_scheme: >-
      Every other goal in this set targets a primitive. Deployed cryptography
      fails at the mode layer far more often than at the primitive, and the
      polynomial MAC is the most consequential object there: it is what every
      concrete data limit reduces to. It is also unusually measurable — small,
      exact, and admitting faithful scaled-down analogues where forgery
      probability comes from EXHAUSTION rather than estimation. And it arrives
      with its own control already fielded: one construction, two fields, both
      at internet scale.
  non_duplication:
    - >-
      GOAL-AES-002 owns the AES block cipher's own security against the
      exhaustive-search reference. THIS GOAL TREATS AES AS A BLACK BOX and makes
      no claim about it; the object here is the authenticator, not the cipher.
    - >-
      GOAL-ASCON-001 owns sponge/duplex AEAD bounds at the SP 800-232
      parameters. Both goals re-derive a mode bound with constants tracked and
      MUST NOT PRODUCE INCOMPATIBLE BOUND CONVENTIONS: whichever runs second
      binds to the other's convention for stating data limits and query counts,
      or records why it cannot.
    - >-
      GOAL-BLAKE-001 owns keyed-mode domain separation for a hash tree. Any
      key-commitment or domain-separation question arising here is scoped to the
      AEAD composition and is not merged with that goal's enumeration.
  completion_criteria:
    - >-
      A MEASURED TIGHTNESS RESULT: forgery success probability against message
      length and query count on declared scaled-down analogues where exhaustion
      is possible, reported as a ratio to the bound at those same parameters,
      for BOTH constructions under an identical pipeline. The outcome that both
      bounds are tight is a complete result.
    - >-
      AN EXACT WEAK-KEY COUNT in each field — density and structure of keys for
      which forgery is cheaper than the generic bound suggests, accounting for
      each construction's key clamping or constraints — stated as finite
      structural facts with their derivation.
    - >-
      A COSTED NONCE-MISUSE RESULT: repeated-nonce pairs required for
      authentication key recovery and the measured cost, per construction, in
      the charging convention shared across this program's cost work, on
      self-generated keys and traffic exclusively.
    - >-
      A CROSS-CONSTRUCTION VERDICT: whether one model explains both fields, with
      any divergence stated as a number and attributed to a field property. A
      model fitting only one construction is reported as a field artifact, not
      as a result about polynomial MACs.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, scoped to the analogue
      parameters actually measured, with every extrapolation to full-size fields
      labelled as a projection.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The mode specifications and forgery-bound proofs cannot be obtained in
      primary text under the network policy after the declared source-preference
      order is exhausted. RQ-POLYMAC-7c89e4 deliberately quotes no bound, so
      there is nothing to design against until that filing exists.
    - >-
      Exhaustive measurement at the declared analogue sizes exceeds the campaign
      budget after cheaper falsification gates are exhausted. This is a budget
      outcome about an analogue and is never evidence about either deployed
      construction (AGENTS.md rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Open with acquisition and with the one deliverable that needs no analogue at
    all: THE EXACT WEAK-KEY COUNT. It is finite arithmetic over two public
    fields, it is reproducible to the bit, it needs no scaling argument, and it
    is the first place the paired-construction control can fire — if the two
    fields give structurally different exposure, that shapes everything after
    it. Then declare and COMMIT the scaled-down analogue and its scaling rule
    BEFORE any forgery measurement; an analogue adjusted after seeing results
    measures the adjustment, and this is the single most likely way for this
    goal to produce something that looks like a finding and is not. Nonce-misuse
    costing runs last and stays entirely on self-generated keys and traffic: no
    third-party capture, key material, or service is touched at any point. Claim
    tier: statements about analogue parameters, exact structural counts, and a
    misuse model the campaign supplies to itself. NEVER an attack on
    correctly-used AES-GCM or ChaCha20-Poly1305, and never a statement about a
    deployed protocol or service.
