research_goal:
  id: GOAL-SSI-001
  title: Supersingular-isogeny cryptanalysis after the SIDH break
  objective: Identify, novelty-screen, and independently challenge algorithmic mechanisms
    that could materially reduce the asymptotic or concrete cost of attacking a surviving
    supersingular-isogeny hardness assumption — endomorphism-ring / path-finding (CGL,
    SQIsign foundations), CSIDH class-group action, or a precisely scoped auxiliary-structure
    variant — while charging memory, preprocessing, oracles, and quantum resources,
    and while keeping the broken SIDH/SIKE torsion-image setting strictly out of scope
    as a positive target.
