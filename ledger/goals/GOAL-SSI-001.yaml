research_goal:
  id: GOAL-SSI-001
  title: Supersingular-isogeny cryptanalysis after the SIDH break
  objective: >-
    Identify, novelty-screen, and independently challenge algorithmic mechanisms
    that could materially reduce the asymptotic or concrete cost of attacking a
    surviving supersingular-isogeny hardness assumption — endomorphism-ring /
    path-finding (CGL, SQIsign foundations), CSIDH class-group action, or a
    precisely scoped auxiliary-structure variant — while charging memory,
    preprocessing, oracles, and quantum resources, and while keeping the broken
    SIDH/SIKE torsion-image setting strictly out of scope as a positive target.
  question_ids: [RQ-SSI-001]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-001
  dispatch_queue_path: coordination/goals/GOAL-SSI-001/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: null
  completion_criteria:
    - >-
      A mechanism is specified with reproducible derivation or implementation
      evidence and a fully charged attack estimate that materially improves a
      matched baseline for at least one surviving supersingular hardness
      assumption at a stated parameter regime.
    - >-
      Independent red-team (or validator) review verifies novelty, correctness,
      scope, and the absence of uncharged oracle, torsion-image, preprocessing,
      memory, or quantum-query costs.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - All surviving mechanisms require resources beyond the declared campaign budget before a cheaper decisive gate can be constructed.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run BATCH-001 producer TASK-20260725-501: map surviving supersingular
    baselines against the existing knowledge spine and return one novelty-
    screened falsifiable candidate (or NO_ADMISSIBLE_NEXT_MECHANISM with the
    residual open question named).
  batch_checkpoints: []
  owner: coordinator
  created_at: '2026-07-25'
  updated_at: '2026-07-25'
