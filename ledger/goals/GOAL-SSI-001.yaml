    with 4 calibration criteria; p=6143, D=2^17, 5 keys x 400 transcripts x 3 runs; TV threshold >= 0.05.
    Power >= 0.95 (concentrated) / ~0.73 (diffuse) at aggregate. Next gate (BATCH-044): Execute EXP-SSI-S1.
    Implement toy SQIsign KLPT at p=6143, implement SIM-UNIFORM-KERNEL, freeze preregistration manifest,
    run calibration + 8000 transcripts + chi2_7 analysis for 3 replicate seeds. Expected outcome: clean
    negative (no KLPT bias detected). QM-STOPPING and QM-ERROR lanes remain paused from BATCH-041.'
