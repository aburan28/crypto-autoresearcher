    attack estimate that materially improves a matched baseline for at least one surviving supersingular
    hardness assumption at a stated parameter regime.
  - Independent red-team (or validator) review verifies novelty, correctness, scope, and the absence of
    uncharged oracle, torsion-image, preprocessing, memory, or quantum-query costs.
  - Coordinator evidence, decision, and any warranted knowledge entry are committed through a verified
    ledger archive.
  pause_conditions:
