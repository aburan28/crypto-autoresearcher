research_goal:
  id: GOAL-SSI-001
  title: Supersingular-isogeny cryptanalysis after the SIDH break
  objective: >-
    Identify, novelty-screen, and independently challenge algorithmic mechanisms
    that could materially reduce the asymptotic or concrete cost of attacking a
    surviving supersingular-isogeny hardness assumption — endomorphism-ring /
    path-finding (CGL, SQIsign foundations), CSIDH class-group action, or a
    precisely scoped auxiliary-structure variant — while charging memory,
    preprocessing, oracles, and quantum resources, and while keeping the broken
    SIDH/SIKE torsion-image setting strictly out of scope as a positive target.
  question_ids: [RQ-SSI-001]
  active_hypothesis_ids: []
  status: active
  status_basis: >-
    LEFT AT active BY THE BATCH-002 CLOSURE (DEC-20260728-004), after checking
    every declared pause_condition against the committed record. (1) The
    six-batch campaign budget is NOT exhausted: BATCH-002 was the second of a
    maximum six. (2) No surviving mechanism is known to require resources beyond
    the campaign budget, because the mechanism hunt has not yet been run - the
    two batches so far produced a baseline map and a cost-model derivation. (3)
    No infrastructure, authentication, or dependency blocker exists; the batch
    completed all its cards. A caution recorded rather than smoothed over: on
    DECLARED figures the two batches account for 9000 of 10800 wall-clock
    seconds, leaving roughly one further batch of nominal headroom, and
    BATCH-001's ACTUAL consumption is recorded in no committed artifact, so the
    tally is not auditable and the budget is NOT asserted to be satisfied. If
    BATCH-003 cannot be scoped inside that headroom it needs its own Coordinator
    decision extending campaign_budget, not a silent overrun. completed remains
    unavailable: no completion criterion has been met, no completion_quorum
    block exists in this record, none was added, and no attestation was obtained
    or is claimed.
