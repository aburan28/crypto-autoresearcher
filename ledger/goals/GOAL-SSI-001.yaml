research_goal:
  id: GOAL-SSI-001
  title: Supersingular-isogeny cryptanalysis after the SIDH break
  objective: >-
    Identify, novelty-screen, and independently challenge algorithmic mechanisms
    that could materially reduce the asymptotic or concrete cost of attacking a
    surviving supersingular-isogeny hardness assumption — endomorphism-ring /
    path-finding (CGL, SQIsign foundations), CSIDH class-group action, or a
    precisely scoped auxiliary-structure variant — while charging memory,
    preprocessing, oracles, and quantum resources, and while keeping the broken
    SIDH/SIKE torsion-image setting strictly out of scope as a positive target.
  question_ids: [RQ-SSI-001]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-002
  dispatch_queue_path: coordination/goals/GOAL-SSI-001/batches/BATCH-002/dispatch_queue.json
  latest_verified_commit: 963e93bdd2171d4b33fecc4c0148833904b9ea48
  latest_verified_commit_basis: >-
    LEFT UNCHANGED AT THE BATCH-001 LEDGER ARCHIVE COMMIT. Opening BATCH-002
    verifies nothing: the authoring Coordinator session has no shell, ran no git
    command, computed no hash, and made no commit. The commit that carries this
    batch opening is not yet verified and is deliberately not recorded here. The
    next candidate value is the BATCH-002 snapshot archive commit of
    TASK-20260728-006, once its receipt records a PASS on every post-commit check.
  completion_criteria:
    - >-
      A mechanism is specified with reproducible derivation or implementation
      evidence and a fully charged attack estimate that materially improves a
      matched baseline for at least one surviving supersingular hardness
      assumption at a stated parameter regime.
    - >-
      Independent red-team (or validator) review verifies novelty, correctness,
      scope, and the absence of uncharged oracle, torsion-image, preprocessing,
      memory, or quantum-query costs.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - All surviving mechanisms require resources beyond the declared campaign budget before a cheaper decisive gate can be constructed.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Execute BATCH-002 from
    coordination/goals/GOAL-SSI-001/batches/BATCH-002/dispatch_queue.json in card
    order: TASK-20260728-005 (derivation note plus matched-baseline
    recommendation; separate F_{p^2} MITM full-cost from F_p Delfs-Galbraith
    dominance; define or falsify the low-memory isogeny-graph collision-search
    analogue; zero curve compute), then the isolated snapshot archive
    TASK-20260728-006, then the independent red-team review TASK-20260728-007 in a
    session sharing no lineage with the producer or with RT-20260725-503, then the
    isolated ledger archive TASK-20260728-008 recording EV-SSI-002 and
    DEC-20260728-004. BATCH-002 does not count toward the GOAL-SSI-001 completion
    criteria unless both TASK-20260728-005 and TASK-20260728-007 independently
    report a new attack mechanism; a matched-baseline recommendation alone is
    cost-model hygiene and closes no completion criterion. No experiment and no
    curve computation is authorized by this batch.
  open_batch:
    batch_id: BATCH-002
    state: open
    opened_at: '2026-07-28'
    opened_by: coordinator
    authorized_by: >-
      The committed next_action of DEC-20260725-002, executing red-team
      RT-20260725-503 disposition ADMIT_BASELINE_DERIVATION_FOR_BATCH_002. No new
      decision record was created to open this batch; the authorization is the
      already-committed one.
    dispatch_queue_path: coordination/goals/GOAL-SSI-001/batches/BATCH-002/dispatch_queue.json
    max_concurrent: 3
    task_ids:
      - TASK-20260728-005
      - TASK-20260728-006
      - TASK-20260728-007
      - TASK-20260728-008
    shape: 'design -> snapshot archive -> independent red-team review -> ledger archive'
    reserved_record_ids:
      - EV-SSI-002
      - DEC-20260728-004
    reserved_record_ids_basis: >-
      Reserved and named only. Neither record exists, neither is created by this
      batch opening, and both are written solely by the TASK-20260728-008 ledger
      archive. Freedom of TASK-20260728-005..008, EV-SSI-002 and DEC-20260728-004
      was checked by repository-wide content search in this worktree, which
      returned no occurrence of any of them; tools/allocate_id.py was NOT run
      because the authoring session has no shell. The executing session should run
      allocate_id.py --check on each identifier before the first commit and stop if
      any is taken.
    completion_counting: >-
      DOES NOT COUNT TOWARD COMPLETION unless a new attack mechanism appears. This
      condition is carried verbatim from DEC-20260725-002 and RT-20260725-503
      required_scope_fixes item 4, and it is not weakened by opening the batch. A
      matched-baseline recommendation, a KN-TECH note, or a falsification of the
      low-memory analogue are all admissible outcomes and none of them satisfies a
      GOAL-SSI-001 completion criterion.
    claim_ceiling: >-
      Maximum claim strength is a matched-baseline recommendation plus, at most, a
      proposed KN-TECH baseline note. Evidence tier is theory/derivation; no
      empirical evidence can arise from a batch that computes nothing. No
      breakthrough, closure, or contradiction claim is in scope, so AGENTS.md rule
      12 is not triggered by this batch and is not discharged by it either.
    knowledge_scope: >-
      knowledge/ is deliberately outside every BATCH-002 write scope. If the
      derivation warrants a KN-TECH or KN-FIND entry, it is a separately dispatched
      successor task with its own declared paths and a regenerated
      knowledge/INDEX.md, so that the ledger archive's declared path set stays
      equal to what it commits.
    budget_accounting: >-
      NOMINAL, NOT MEASURED, AND RECORDED RATHER THAN SMOOTHED OVER. The four
      BATCH-002 cards declare 1800 + 300 + 1200 + 600 = 3900 wall-clock seconds.
      BATCH-001's four cards declared 5100; no committed artifact records what
      BATCH-001 actually consumed, so the campaign tally against
      campaign_budget.total_wall_clock_seconds (10800) is not auditable and is not
      asserted to be satisfied. On declared figures alone the two batches account
      for 9000 of 10800, leaving roughly one further batch of nominal headroom
      against a six-batch maximum. That headroom was the reason this batch was
      given one independent review rather than two: the goal's completion route
      requires a new attack mechanism, which this lane cannot supply, so the
      remaining budget is deliberately not spent here. campaign_budget is NOT
      extended by this record and any extension requires its own Coordinator
      decision.
    queue_state_reconciliation: >-
      DECIDED IN ADVANCE RATHER THAN DISCOVERED LATER. BATCH-002's
      dispatch_queue.json is deliberately NOT listed in the artifact_paths of
      either archive card, so that each archive commits exactly the path set it
      declares - three paths for TASK-20260728-006 and six for TASK-20260728-008.
      Consequently the queue's task states and archive receipt fields are updated
      by a separate coordination write, not by either archive commit, and a queue
      that still reads 'queued' after an archive is a bookkeeping lag rather than a
      failed task. The same omission was recorded as an open defect in
      GOAL-ECDLP-001 BATCH-006; here it is a declared choice with a named owner,
      the dispatching Coordinator session.
    independence_repair: >-
      DEC-20260725-002 records BATCH-001's producer and red team as sharing one
      conversation lineage after an API-limit fallback. TASK-20260728-007 is
      constrained to an independent session sharing no lineage with the producer or
      with RT-20260725-503, and must record that status in its report. If
      independence again cannot be achieved, the fact is recorded and the evidence
      strength is capped accordingly rather than the limitation being repeated
      silently.
    not_changed_by_this_opening:
      status: >-
        LEFT AS FOUND at active. No completion or pause condition is met: the batch
        budget is not exhausted, no blocker exists, and no completion criterion has
        been approached. completed is unavailable under AGENTS.md rule 13 - no
        completion_quorum block exists in this record, none was added, and no
        attestation was obtained or is claimed.
      active_hypothesis_ids: >-
        LEFT AS FOUND at []. IDEA-20260725-001 remains at idea stage; no H-SSI-*
        hypothesis record exists and none is created by this batch.
      latest_verified_commit: 'LEFT AS FOUND. See latest_verified_commit_basis.'
      ledger_validation: >-
        NOT CLAIMED. This session ran no validator. The repository ledger is known
        to carry pre-existing validation errors and duplicate identifiers that are
        not this batch's to repair; nothing here asserts that the ledger validates.
