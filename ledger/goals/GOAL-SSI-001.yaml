    - All surviving mechanisms require resources beyond the declared campaign budget before a cheaper decisive gate can be constructed.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    EXACTLY ONE, per DEC-20260728-004. Open BATCH-003 as a MECHANISM-GENERATION
    batch against the corrected baseline, with the BATCH-002 review debt
    attached, in this card order and with every card carrying non-null budget
    fields and an exclusive write scope: (1) idea-generator mechanism hunt on
    the surviving supersingular hardness assumptions (endomorphism-ring /
    SQIsign foundations, CSIDH class-group action), admitting only candidates
    that target the TIME exponent - benchmarks are p^{1/2+o(1)} unconditional
    and p^{1/3+o(1)} conditional on F_{p^2} and p^{1/4+o(1)} on F_p, never the
    provisional full-cost figures - and carrying the L1 ceiling that a
    constant-multiplicity target set is already priced at o(1); (2) one bounded
    zero-compute card discharging the BATCH-002 review debt: an independent
    check of erratum items D1 and Lemma 4-prime(b), the RC4 and RC5 literature
