research_goal:
  id: GOAL-FRODO-002
  title: "FrodoKEM: does the claimed IND-CCA bit security survive its own Fujisaki-Okamoto reduction being charged concretely at deployment query, salt, and multi-user counts?"
  objective: >-
    GOAL-FRODO-001 asks whether FrodoKEM's two computed numbers reproduce. This
    goal asks what they are worth. FrodoKEM's IND-CCA claim is produced by an
    FO-style reduction that consumes the decryption failure rate and a
    random-oracle query budget as inputs; taking the published failure rates as
    GIVEN, transcribe that bound from primary text with every symbol defined
    and every quantifier order recorded, reproduce the published bit-security
    figure from it at the published inputs as a gating control, then evaluate
    it exactly over a swept grid of query, user, and ciphertext counts and
    failure rates. Report which term dominates per parameter set, where — if
    anywhere — the claimed category floor is crossed, what the 2025
    per-ciphertext salt buys in the multi-target accounting, and the
    bit-security movement per unit of failure-rate discrepancy. Baseline,
    mutation, and nearby-object controls are established BEFORE any agreement
    is reported as a verification.
  question_ids: [RQ-FRODO-a2dbe2]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 5
    total_wall_clock_seconds: 9000
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-FRODO-001, GOAL-MLKEM-003, GOAL-MLKEM-004, GOAL-HQC-001]
  scheme_context:
    scheme: "FrodoKEM (Frodo-640, Frodo-976, Frodo-1344), eFrodoKEM variants"
    family: "unstructured (plain) LWE KEM, IND-CCA via a Fujisaki-Okamoto transform with implicit rejection"
    nist_track: not_a_nist_selection
    standardization_status: >-
      ISO/CFRG track rather than a NIST selection: a standard proposal is
      published at frodokem.org and an IETF CFRG Internet-Draft exists
      (draft-longa-cfrg-frodokem). The 2025 proposal revision reportedly
      introduced a per-ciphertext salt, which is exactly the kind of change
      that moves multi-target bookkeeping. UNVERIFIED by this program; see
      RQ-FRODO-a2dbe2.provenance.
    why_this_scheme: >-
      Reachability again, one link further down the chain. Evaluating a stated
      inequality at the standardized parameters is finite arithmetic, so the
      program can hold a crypto-tier claim about the BOOKKEEPING without any
      extrapolation heuristic — the same property that selected FrodoKEM for
      GOAL-FRODO-001. What is new is that the object under study is a formula
      rather than a figure, and a printed inequality gets checked far less
      often than a printed table entry.
  non_duplication:
    - >-
      GOAL-FRODO-001 OWNS THE VALUES. Whether the Renyi divergence and the
      decryption failure rate reproduce under exact recomputation is that
      goal's question and this goal does not answer it. Here the failure rate
      is a SYMBOL that is swept: this goal reports sensitivity — bit-security
      movement per unit of discrepancy — and must neither assert the published
      value is wrong nor assume it is right. A batch that finds itself
      recomputing a convolution over chi has crossed into GOAL-FRODO-001 and
      must hand off.
    - >-
      The lattice-estimator lane is NOT this goal's. GOAL-MLKEM-003 and
      GOAL-MLKEM-004 own core-SVP conventions and memory-charged sieve cost.
      The IND-CPA/LWE hardness figure enters here as a GIVEN INPUT to the
      reduction and is not re-derived; a batch deriving a sieve cost has left
      its lane.
    - >-
      Implementation attacks are out of scope under AGENTS.md rule 7:
      KN-LIT-2088 (FO timing), KN-LIT-3859 (fault injection on the FO equality
      test), KN-LIT-118 and KN-TECH-047 (hint-integrated primal attacks).
      Those concern implementations of the transform; this goal concerns the
      bound stated over it, and they may not be scored as evidence here in
      either direction. KN-LIT-2541 (anonymity of Round-3 KEMs in the QROM) is
      adjacent and does not state FrodoKEM's concrete IND-CCA bound.
    - >-
      GOAL-HQC-001 is cited for METHOD, not scope: its BATCH-001/002 sequence
      established the acquire-then-file-then-design ordering this goal adopts,
      and its RS-S3 finding is the precedent that a printed quantity in a
      standardization document can be wrong.
  completion_criteria:
    - >-
      The FrodoKEM IND-CCA bound transcribed from primary text as an explicit
      inequality, every additive and multiplicative term named and bound to
      its definition, quantifier order recorded, and the model (ROM, QROM, or
      both) stated as read rather than as assumed — with the source filed as a
      KN-LIT entry at a stated provenance level and any extraction damage
      marked.
    - >-
      A GATING baseline reproduction: the published bit-security figure
      recomputed from the transcribed bound at the published inputs for each
      of Frodo-640/976/1344, reported as reproduced or as a stated discrepancy
      with its size. No swept result may be reported on top of an unreproduced
      baseline; if the baseline does not reproduce, that discrepancy is the
      deliverable.
    - >-
      An exact or interval-arithmetic evaluation table sweeping query count,
      user count, ciphertext count, and failure rate, per parameter set,
      reporting the dominant term in each regime, any query or target count at
      which the claimed category floor is crossed, the movement attributable
      to the per-ciphertext salt, and the bit-security derivative with respect
      to the failure rate.
    - >-
      Controls admitted before belief: a mutation control showing the
      evaluation registers a seeded one-exponent perturbation of the
      transcribed bound, and a nearby-object control running the identical
      pipeline on a second independently-published FO-based lattice KEM to
      show it distinguishes schemes rather than emitting a fixed answer.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      checking the transcription against the primary text, the matched
      baseline, the controls, and the absence of uncharged preprocessing,
      memory, oracle, or randomness assumptions in the swept accounting.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive, with the conclusion scoped
      to the exact bound, model, and parameter grid actually evaluated, and
      with the BOOKKEEPING claim and any SECURITY reading recorded at separate
      tiers per RQ-FRODO-a2dbe2.scope.claim_tier_ceiling.
  pause_conditions:
    - The five-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the FrodoKEM specification's security-argument section nor the
      primary FO-transform analyses it depends on can be obtained under the
      network policy after the declared source-preference order is exhausted.
      Note that this closes the ACQUISITION attempt only; it is not evidence
      that the bound is tight or loose (AGENTS.md rule 5).
    - >-
      The published analysis turns out not to state a concrete inequality at
      all — only an asymptotic or qualitative claim — in which case the
      goal stops and records that as the finding, because there is then no
      published bookkeeping to charge and constructing one would be this
      program's own analysis rather than an audit of FrodoKEM's.
    - >-
      GOAL-FRODO-001 reports a failure-rate discrepancy large enough that the
      sweep should be re-anchored to a value that goal has established; pause
      and rerank rather than publishing a sweep around a number known to be
      moving.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    THE SOURCE GATE IS SHUT, AND IT IS SHUT HARDER HERE THAN FOR
    GOAL-FRODO-001: no primary source has been acquired for this question and
    NO FIGURE APPEARS IN RQ-FRODO-a2dbe2 BECAUSE NONE HAS BEEN READ. Do not
    run /propose-ideas yet. BATCH-001 acquires the FrodoKEM specification's
    security-argument section and the primary FO-transform analyses it cites,
    files them as KN-LIT entries at stated provenance levels with extraction
    damage marked, and TRANSCRIBES THE BOUND — every symbol defined, every
    quantifier order recorded, the model (ROM/QROM) stated as read. Four
    facts this goal's own framing rests on are unverified targets to be
    re-read, not premises: that a per-ciphertext salt exists in the 2025
    proposal, which model the analysis is stated in, the form of the
    query-count loss, and whether the bound is per-key or multi-target. ONLY
    THEN design the evaluation, and order it so that BASELINE REPRODUCTION
    GATES THE SWEEP: a pipeline that cannot recover the paper's own
    bit-security figure from the paper's own bound at the paper's own inputs
    has not earned the right to disagree with it anywhere else. Design the
    mutation and nearby-object controls before the sweep, not after it.
    Claim tier is SPLIT — crypto tier for the arithmetic of the inequality,
    nothing above toy for any reading about FrodoKEM's actual security — and a
    tightness gap is a statement about a proof, never about an attacker. A
    batch that blurs those has failed regardless of what it computed.
