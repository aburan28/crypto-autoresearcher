research_goal:
  id: GOAL-HAWK-001
  title: "HAWK: independent verification of the reported module-LIP key-recovery break"
  objective: >-
    Independently verify or refute the reported classical
    polynomial-time smLIP key-recovery attack on HAWK: restate it as a
    numbered-heuristic conditional theorem, reimplement it at parameters
    where a recovered key can be certified against the public key, and
    determine the fully charged concrete cost at HAWK's deployed
    parameter sets — including the possibility that one or more
    heuristics fails exactly where HAWK lives.
  question_ids: [RQ-HAWK-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "HAWK"
    family: "lattice (the only lattice-based Round-3 candidate)"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      Either a certified secret-key recovery at a HAWK-shaped instance
      large enough to discriminate the heuristics, with a charged cost
      extrapolation stated conditionally on the numbered heuristics; or
      an identification, with derivation, of the specific heuristic that
      fails at HAWK parameters and the resulting true cost floor.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The disclosed attack description or its supporting preprints
      cannot be obtained under the network policy after the declared
      source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Before ideation: obtain the primary sources (the disclosed attack,
    eprint 2026/890, eprint 2026/1318, van Gent-Pulles 2025) and file
    them as KN-LIT entries with the four heuristics transcribed verbatim
    and numbered. Only then /propose-ideas RQ-HAWK-001. Treat every
    secondary-reporting figure in this record as unverified until the
    primary text is read; this goal must not inherit a break claim it
    has not checked.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
