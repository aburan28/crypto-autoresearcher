research_goal:
  id: GOAL-HAWK-001
  title: "HAWK: independent verification of the reported module-LIP key-recovery break"
  objective: >-
    Independently verify or refute the reported classical
    polynomial-time smLIP key-recovery attack on HAWK: restate it as a
    numbered-heuristic conditional theorem, reimplement it at parameters
    where a recovered key can be certified against the public key, and
    determine the fully charged concrete cost at HAWK's deployed
    parameter sets — including the possibility that one or more
    heuristics fails exactly where HAWK lives.
  question_ids: [RQ-HAWK-001]
  active_hypothesis_ids: []
  status: active
  status_value_history:
    - value: draft
      in_force_until: '2026-08-02'
      note: >-
        Opened 2026-07-29 as draft. Activated 2026-08-02 by TASK-20260802-003,
        the BATCH-001 opening archive, on the user's explicit direction this
        session to launch this goal (selected from three offered options). This
        is a USER AUTHORIZATION RECORDED BY THE COORDINATOR and not a
        self-grant. No completion criterion is met or approached by activation,
        no hypothesis exists (active_hypothesis_ids stays empty), and no claim
        tier moves.
