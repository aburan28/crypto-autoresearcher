    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action_history:
    - recorded_at: '2026-07-29'
      superseded_at: '2026-08-02'
      text: >-
        Before ideation: obtain the primary sources (the disclosed attack,
        eprint 2026/890, eprint 2026/1318, van Gent-Pulles 2025) and file
        them as KN-LIT entries with the four heuristics transcribed verbatim
        and numbered. Only then /propose-ideas RQ-HAWK-001. Treat every
        secondary-reporting figure in this record as unverified until the
        primary text is read; this goal must not inherit a break claim it
        has not checked.
      superseded_because: >-
        PARTLY DISCHARGED AND PARTLY FOUNDED ON A FALSE PREMISE, both established
        by TASK-20260802-004 against obtained full texts. (1) The instruction to
        transcribe "the four heuristics" from the disclosed attack CANNOT BE
        CARRIED OUT: the disclosed attack is Straznickas-Weis, "HAWK-n Key
        Recovery Reduces to SVP in Dimension n/2 + 1", and it is UNCONDITIONAL -
        a regex census over its full 78015-character text returns Heuristic x0
        and Conjecture x0. The four heuristics belong to eprint 2026/1318, a
        SEPARATE attack. (2) The disclosed attack was ALREADY IN THE CORPUS as
        KN-LIT-7592, filed 2026-07-28, ONE day before this goal asked for it -
        the goal named the referent only as "the disclosed attack" and did not
        cite the ID. (3) van Gent-Pulles 2025 = iacr:2025/928 = IACR
        Communications in Cryptology 2(2), obtained in full text and filed as
        KN-LIT-7673; it has EXACTLY ONE numbered heuristic. THE UNDISCHARGED
        REMAINDER IS REAL AND SURVIVES: eprint 2026/1318's four heuristics are
        STILL UNREAD, its PDF being Cloudflare-gated.
      corrected_at_batch001_close: >-
        TWO ERRORS IN THE TEXT ABOVE, both found by TASK-20260802-007 (Red Team)
        objection O5 and both corrected here rather than left standing. (i) "four
        days" was wrong and now reads ONE day - the interval was computed against
        2026-08-02 instead of against this goal's creation date, 2026-07-29. (ii)
        The claim that the instruction "CANNOT BE CARRIED OUT" is AN OVERREAD.
        next_action reads "obtain the primary sources (...) and file them as
        KN-LIT entries with the four heuristics transcribed verbatim"; the
        modifier attaches to the FOUR SOURCES COLLECTIVELY, and on that reading
        the instruction IS satisfiable, since iacr:2026/1318 does have four
        heuristics. THIS GOAL'S next_action WAS NOT DEFECTIVE IN THE WAY BATCH-001
        CLAIMED. The record that does conflate the two attacks is
        RQ-HAWK-001.motivation, and amending it is item (c) of the next action.
        The supersession of this next_action still stands on ground (1)'s factual
        core - the disclosed attack is unconditional - and on the discharge
        recorded in DEC-20260802-005 D-2.
  next_action: >-
