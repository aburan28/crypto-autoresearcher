research_goal:
  id: GOAL-ECDSA-001
  title: "ECDSA: put the lattice and Fourier nonce-leakage attacks on one memory-charged frontier, and locate the recoverability boundary at deployed curve sizes"
  objective: >-
    Determine where ECDSA key recovery from partial nonce leakage actually
    stops at 256-bit deployed curves once memory is charged alongside time and
    sample count. Reproduce a published record instance with a verified
    certificate at a rung this harness can reach; assemble the
    lattice-with-predicate and Fourier/Bleichenbacher results into a single
    Pareto frontier over (leaked bits, error rate, samples, time, memory,
    curve size) rather than the per-paper reporting the literature currently
    offers; and state where the 1-bit boundary sits at 256 bits, conditionally
    on numbered heuristics, with the resource gap distinguished from any
    structural obstruction.
  question_ids: [RQ-ECDSA-87625f]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 3
    unlimited_budget_note_20260904: >-
      ECC goal: campaign budget is UNLIMITED by declared policy
      (orchestration/research-priority.yaml, user instruction
      2026-09-04). Prior finite values, preserved and NOT retracted: maximum_batches=6; total_wall_clock_seconds=10800.
      max_concurrent stays bounded -- it is machine headroom, not a
      research budget. Unlimited removes the batch ceiling, not the
      duty to rank: never dispatch a task you cannot rank ahead of
      doing nothing.
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-ECDLP-001, GOAL-PATH-001, GOAL-RSA-001]
  scheme_context:
    scheme: "ECDSA (secp256k1, P-256, P-384; 112/128/160-bit curves as the calibration ladder)"
    family: "hidden number problem from partial nonce leakage"
    nist_track: deployed_classical
    standardization_status: >-
      Deployed at very large scale and on a published migration path away.
    why_this_scheme: >-
      Two reasons this program specifically. First, a certified crypto-scale
      solve is genuinely reachable here — the certificate is one scalar
      multiplication — which is the standard docs/target-result-profile.md
      sets and which this program's toy-scale lanes structurally cannot meet.
      Second, the missing work is exactly the kind this program is built to
      do: the attack papers exist and are strong, and what is absent is the
      matched, memory-charged comparison between them.
  non_duplication:
    - >-
      THIS GOAL MAKES NO CLAIM ABOUT PLAIN ECDLP, and the separation is
      load-bearing rather than decorative. KN-TECH-019 records that the
      HNP-plus-lattice pipeline is not a plain ECDLP attack; KN-OPEN-011 owns
      whether the technique transfers; GOAL-ECDLP-001 and GOAL-PATH-001 own
      the ECDLP program. A batch here that starts arguing about ECDLP has left
      its lane.
    - >-
      Distinct from RQ-ALECF-001 (imported Autolab quantum point-addition
      circuit scores on secp256k1): same curve, unrelated object, no shared
      claim.
    - >-
      GOAL-RSA-001 was opened in the same batch and shares the charged-cost
      discipline. Whichever runs second binds to the other's memory-charging
      convention or records why it cannot; two incompatible conventions inside
      one program would defeat the purpose of building either.
  completion_criteria:
    - >-
      At least one independently reproduced key recovery from partial nonce
      leakage, with a certificate the run wrapper re-verifies by confirming
      the recovered scalar reproduces the public key, at a stated curve size,
      leakage level and error rate; with peak memory, wall time and sample
      count reported, and with the reproduction compared against the published
      figures for the same instance.
    - >-
      A single memory-charged frontier over (curve size, leaked bits, error
      rate, samples, time, peak memory) covering both the lattice-with-
      predicate and Fourier/Bleichenbacher families, with each point marked
      reproduced or published-but-unreproduced, and with dominated_by and a
      quantitative sota_delta filled per docs/inventor-protocol.md.
    - >-
      A stated position on the 1-bit-at-256-bit boundary that distinguishes a
      resource gap from a structural obstruction, conditional on numbered
      heuristics, each with a falsification condition. If the honest answer is
      that the distinction cannot be made within budget, that is recorded as
      the result with the specific measurement that would settle it.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with every conclusion
      stating its leakage assumption in the same sentence as its claim.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The primary attack literature and released instances cannot be obtained
      under the network policy after the declared source-preference order is
      exhausted.
    - >-
      Every reachable rung of the reproduction ladder exceeds the declared
      campaign budget or the available memory. Published instances at the
      frontier are quoted at terabyte-scale RAM and multiple GPUs, so this is
      a foreseeable outcome and NOT evidence about the attacks: under
      AGENTS.md rule 5 an unreachable rung is reported as unreached, and the
      frontier records the published figure as unreproduced.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Do not open with the hardest instance. THE FIRST BATCH ESTABLISHES THAT
    THE PIPELINE RECOVERS KEYS AT ALL, on a rung chosen to fit comfortably
    inside budget — a generous leakage level on a small curve, against a
    published instance where one is available — and produces a verified
    certificate. A frontier assembled by a pipeline that has never recovered a
    key is an arithmetic exercise. Before that, acquire and file the primary
    sources as KN-LIT entries per RQ-ECDSA-87625f.constraints; the resource
    figures this goal cites were read from a repository README in excerpt and
    are not yet this program's. THE REPORTING TRAP TO AVOID IS SPECIFIC AND
    LIKELY: this lane produces results that read as "ECDSA broken at 256
    bits", and every such statement is conditional on an assumed side channel
    that must appear in the same sentence. A recovery under assumed leakage is
    a crypto-tier claim about the LEAKAGE MODEL and says nothing about ECDLP —
    KN-OPEN-011 owns that question and it stays with the ECDLP program.
  owner: coordinator
  created_at: '2026-08-04'
  updated_at: '2026-08-04'
