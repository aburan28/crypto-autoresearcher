# GOAL-SERP-5ecff7 -- opened by DEC-20260924-decc6a on user direction
# (2026-09-24). Non-ECC (SERP is an excluded area in
# orchestration/research-priority.yaml), so it is ranked after ECC goals.
research_goal:
  id: GOAL-SERP-5ecff7
  title: >-
    Serpent reduced-round cryptanalysis: differential, linear,
    differential-linear, boomerang and algebraic distinguishers, measured
    round by round against the published frontier
  objective: >-
    Push, or measurably bound, the number of Serpent rounds reachable by each
    classical technique family, using modern automated trail search and
    middle-layer theory (MILP/SAT/CP characteristic and hull search,
    DLCT/BCT/BDT switch evaluation, clustered-differential estimation,
    division-property degree bounds). Every distinguisher is verified
    empirically wherever that is computable and compared with a
    random-permutation null of identical shape. Every result is placed on
    the SYMF frontier under its own comparison key (family, key size,
    attacker model, result type). The campaign's primary deliverable is a
    per-family "death round": the first round count at which that family's
    best certified bound stops beating the generic attack. The campaign
    reports it whether or not it moves the published frontier.
  question_ids: [RQ-SERP-722a09]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 2
  campaign_budget_note: >-
    Null ceilings per the 2026-09-06 progress-first research budget policy.
    max_concurrent is machine headroom, not a research budget.
  current_batch_id: null
  dispatch_queue_path: null
  related_goals: [GOAL-SYMF-c00fa1, GOAL-AES-003]
  non_duplication:
    - >-
      GOAL-SYMF-c00fa1 owns the census of published attacks and their
      comparison keys. This goal consumes that census for sota_delta and
      contributes Serpent rows to it through the SYMF process; it does not
      maintain a parallel census.
    - >-
      GOAL-AES-003 and the AES goals own AES-specific distinguishers. Tooling
      shared with them, such as the trail-search engine or the statistics
      module, is reused by import, not forked.
  claim_ceiling: >-
    No batch may claim a full-round Serpent weakness, or any round count
    above the SYMF-recorded frontier for its comparison key, until the claim
    has passed review-breakthrough at max. A distinguisher is never reported
    as a key-recovery attack, and a related-key result is never reported
    under the single-key comparison key.
  completion_criteria:
    - >-
      FRONTIER RESULT: for at least one comparison key, a distinguisher or
      key-recovery attack at a round count that reaches or exceeds the
      SYMF-recorded published frontier, with (i) empirical verification at
      every round count where the data complexity is at most 2^40, (ii) a
      random-permutation null control at identical sample count, (iii)
      numbered heuristics with falsification checks for every extrapolated
      round, (iv) a concrete-cost table (time, data, memory), and (v)
      independent review-breakthrough at max.
    - >-
      MEASURED BARRIER: for each of the five families (differential, linear,
      differential-linear, boomerang/rectangle, algebraic), a committed
      obstruction block recording the death round for the 128-bit and
      256-bit key sizes. Each block gives the search engine and its
      completeness scope (optimal within a stated model, or heuristic), the
      measured bound with error bars, and a resource_check. It closes only
      that family within that scope.
  pause_conditions:
    - >-
      No reference Serpent implementation can be pinned to published
      full-round test vectors. This records an impediment on every
      measurement task; it is not evidence.
    - >-
      A trail-search engine (MILP/SAT/CP) cannot be installed or licensed in
      the execution environment. This records an impediment on search tasks
      only; empirical-verification tasks continue.
    - >-
      review-breakthrough at max cannot be served. The claim stays
      un-promoted and the campaign stays active.
  impediments: []
  next_action: >-
    OPEN BATCH 1: FOUNDATIONS AND OWN DEATH ROUNDS. No ideation first.
    (1) Pin a reference Serpent implementation (bitsliced, plus a
    table-based cross-check) to published full-round known-answer vectors
    for all three key sizes. Expose an r-round API with a declared round
    convention.
    (2) Reproduce the classical short-round baselines empirically: the
    best-known 3- and 4-round differential characteristics and linear
    approximations, measured at at least 2^30 samples each against a
    random-permutation null. Record where the measured probability or
    correlation departs from the single-trail prediction; that departure is
    the clustering / hull signal.
    (3) Stand up a MILP or SAT trail-search baseline and reproduce the
    published best-trail bounds for 1 to 6 rounds. This is the
    exact-baseline-reproduction audit of the proof_search_map.
    (4) File Serpent rows into the SYMF census for sota_delta.
    (5) Then run /propose-ideas under RQ-SERP-722a09, with DLCT-based
    differential-linear at 9 or more rounds and division-property degree
    bounds as the first two seeded directions.
  owner: coordinator
  created_at: '2026-09-24'
  updated_at: '2026-09-24'
  opened_by: DEC-20260924-decc6a
