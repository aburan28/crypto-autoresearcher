research_goal:
  id: GOAL-MLKEM-003
  title: "ML-KEM: is the core-SVP margin conservative at FIPS 203 dimensions, and by how much?"
  objective: >-
    Put ML-KEM's parameter-level security estimate on independently
    re-derived and partially measured footing: reproduce the submitted
    estimates from primary text, build a memory-charged concrete sieve
    cost model at FIPS 203 dimensions, calibrate it against measured
    behaviour at reduced dimensions, and state the resulting margin — in
    whichever direction it moves — conditionally on numbered
    assumptions. Explicitly complementary to GOAL-MLKEM-001 and
    GOAL-MLKEM-002, which own the implementation-conformance flank.
    BATCH-001 additionally targets the residual of KN-OPEN-016: matched
    dual-vs-primal costing under MATZOV and the gap to Carrier/MATZOV-2022
    dual headlines.
  question_ids: [RQ-MLKEM-003]
  active_hypothesis_ids: [H-MLKEM-014, H-MLKEM-010, H-MLKEM-011, H-MLKEM-012, H-MLKEM-013]
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 8
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-007
  dispatch_queue_path: coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/dispatch_queue.json
  latest_verified_commit: 1b2b72497523de3c4889ab45216c1f5f3258bf97
  related_goals: [GOAL-MLKEM-001, GOAL-MLKEM-002]
  scheme_context:
    scheme: "ML-KEM (FIPS 203, formerly CRYSTALS-Kyber)"
    family: "lattice KEM (module learning with errors)"
    nist_track: selected_algorithm
    standardization_status: >-
      Finalized 2024-08-13 as FIPS 203. Deployed at scale; the most
      widely fielded PQC primitive.
  completion_criteria:
    - >-
      An independently re-derived security estimate for at least one
      FIPS 203 parameter set under a memory-charged cost model,
      calibrated by measured sieve behaviour at reduced dimensions, with
      the margin relative to the published estimate reported in
      whichever direction it falls and every extrapolation step stated
      as a numbered heuristic.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the FIPS 203 text nor the primary parameter-derivation
      literature can be obtained under the network policy after the
      declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    BATCH-007 closed under DEC-20260802-15cadd with disposition `revise`: two of
    three adjudication verdicts did not survive independent review, and the
    Coordinator independently reproduced both blocking objections. Open BATCH-008
    — the FINAL batch under maximum_batches: 8 — as a zero-new-compute
    measurement batch whose producer task (i) re-scopes Q3 explicitly to
    Carrier's polar-coded score and mines Ducas-Pulles
    (https://ir.cwi.nl/pub/33407/33407.pdf, sha256 947f2826...; data repo
    ludopulles/DoesDualSieveWork @ f390d77b) for measured log2(Pwrong) at the
    measured Pgood=1/2 threshold across n=40..90, the measured-vs-predicted
    excess (9.12 bits at n=90, coordinator-verified) and its trend in n, and
    (ii) fits Carrier's archived Pwrong survival function on its measured range,
    extrapolates to the aligned Pgood median 2222.56 against Approximation 4.9's
    prediction at the same point, and computes the nb_iteration needed to push
    the counting-resolution floor -log2(nb_iteration * q^k_fft) below score
    2222.56 — converting `fraction_inside = 0` from a coverage statement into a
    quantitative test with a stated extrapolation assumption; and whose review
    slot carries the AGENTS.md rule 12 independent `review-breakthrough` pass at
    `max` on the counting-resolution contradiction, refusing any degraded
