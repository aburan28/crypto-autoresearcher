        resolution bound, while every recorded number and the 83.87/142.09/208.33
        -bit dynamic-range statement stand. EV-MLKEM-013 -> claim_void on the
        merits: init()'s unused-index loop accumulates each phase k_fft times and
        FFT()'s /k_fft cancels it, so scale_factor recomputes to 1 not 3,
        corroborated code-independently by the archived data's own sigma
        (coordinator-verified: ratios 0.9996/1.0020 vs raw, 2.9987/3.0060 vs
        aligned); the aligned 2223/3988/5941 and T-gap 420.56 are a wrong unit
        conversion and EV-MLKEM-011 did not overstate its T-gap. This also
        corrects BATCH-007's blocking objection: the operating threshold is
        ~93-117 bits below the counting floor (~2^105-2^129 iterations), so the
        diagnosis stands and the "run longer" remedy is wrong by ~100 bits.
        EV-MLKEM-017 narrowed, not falsified - it stated this exact residual.
        NO status change to EV-MLKEM-011 / EV-MLKEM-013 / EV-MLKEM-017 /
        H-MLKEM-011 / H-MLKEM-013 and NO knowledge promotion or supersession:
        rule 12 unserved. Goal paused at exhausted budget (batch 8 of 8); no
        closure quorum asserted or sought; no ML-KEM claim.

