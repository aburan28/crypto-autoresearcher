        over-prediction. First validation TASK-20260802-08f428 died on a
        provider session limit (infrastructure, rule 5, no evidential weight);
        repaired by successor TASK-20260803-bc8c1f.
    - batch_id: BATCH-010
      decision_id: DEC-20260803-ed6522
      evidence_id: EV-MLKEM-eac95b
      snapshot_commit: be7ed9e36426517d91e7bb0206e01e52463ddbaf
      summary: >-
        Discriminating controls, zero new sampling. CHECK A ADVERSE AND ONE-SIDED:
        neither archived file's own Approximation-4.9 exponent minimises rms
        against its own data (n=43 argmin 23.25 vs own 26.0; n=50 argmin 22.25 vs
