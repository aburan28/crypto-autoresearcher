      An independently re-derived security estimate for at least one
      FIPS 203 parameter set under a memory-charged cost model,
      calibrated by measured sieve behaviour at reduced dimensions, with
      the margin relative to the published estimate reported in
      whichever direction it falls and every extrapolation step stated
