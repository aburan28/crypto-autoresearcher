    condition, and BATCH-011's red team has since supplied a memory
    reconstruction calibrated against EV-MLKEM-020's own figures to
    |delta| < 4.0e-07, so a future attempt starts from a calibrated recipe rather
    than from nothing. VERBATIM TEXT FOLLOWS.
    "BATCH-011 is authorized by DEC-20260803-c7a1a3 (budget 10 -> 12, bounded at
    two batches). Its FIRST AND PRODUCING TASK is ranking candidate A: DERIVE A
    MEMORY FIGURE THAT primal_bdd ACTUALLY IMPLIES, instead of the borrowed one.
    The red team established that `grep -n "mem" estimator/lwe_primal.py` returns
    nothing and that lwe_primal never calls `short_vectors`, so the instrument
    supplies NO memory figure for this attack: H4's 0.2075 literals live in a
    function primal_bdd does not invoke, annotated "# pick something" by the
    estimator's own authors, and H5's unit convention is borrowed from
    lwe_dual.py, a different module serving a different attack. Every c* in
    EV-MLKEM-020 divides by that borrowed denominator. The task must (i) state
    what the MATZOV/AGPS20 gate count charged for primal_bdd's two sieve calls
    implies about the database those calls hold, sourcing it from retrievable
    primary or archived text rather than from an uncalled function, and report
    honestly if it cannot be sourced -- a declared "the instrument cannot supply
    it and no retrievable source does" is a usable result and the expected one;
    (ii) recompute c* against whatever figure that yields, beside the borrowed
    one, and report whether the inequality c* < 1/3 survives the substitution;
    and (iii) carry, in the same script because it rebuilds the same artifact,
    the two cheap corrections both reviews named: fix
    memory_charged_derivation.py:151, which adds log2_q where log2(log2 q)
    belongs and overstates one memory unit by 8.152329 bits in the direction of
    the conclusion (RC-2, also restating the "15% across units" claim), and
    replace the vacuous CTRL-5 with the two real nulls of the same shape the red
    team already specified and ran (RC-1: the sign null and the denominator
    null). The deliverable is FRAMED AROUND THE ROBUSTNESS OF THE INEQUALITY,
    with c* reported to at most two significant figures and stated as the
    identity margin / log2 M in its first sentence. Then an independent
    review-adversarial pass in a separate session, then a ledger archive. Budget:
    one producing run, <= 1800 s. Authorize no G6K run and no new sampling. Rule
    12 stays unmet and unwaived; nothing in BATCH-011 may treat EV-MLKEM-011,
    EV-MLKEM-013, EV-MLKEM-015, EV-MLKEM-017, EV-MLKEM-018, KN-FIND-012 or
    KN-FIND-014 as corrected. COST-MLKEM-001 remains the conditional envelope;
    KN-OPEN-016 and KN-OPEN-017 remain open; no ML-KEM break claim and no
    security proof. IDENTIFIERS FOR BATCH-011 MUST BE MINTED WITH
    `python3 tools/allocate_id.py --next <type>` random 6-hex tokens, whatever
    origin/main's CLAUDE.md currently says -- see
    DEC-20260803-c7a1a3.repository_state_observation."
