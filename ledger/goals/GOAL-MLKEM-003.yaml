        counterexample returns phi = 0.00433, ~2300 sd below). It requires
        IDENTICAL DISTRIBUTION, which the archive cannot verify. Under i.i.d. the
        floor is the EXACT minimum. Deep-tail null untouched, so BATCH-014's T-1
        stands. Format exonerated decisively; estimator arithmetic bit-for-bit.
        Job B reconstructs BATCH-012's flagged rows to 2.6e-10 bits and the flags
        were right -- but its inference is corrected to something STRONGER: the
        fit-dependence is a normalisation BIAS, centred scatter is
        fit-INDEPENDENT for four of six models, and with O(1) dof neither ratio
        is resolved from 1.0, so the honest reading is "unresolved under both
        fits". Second congenial control in two batches confirmed degenerate.
    - batch_id: BATCH-016
      decision_id: DEC-20260803-4d31df
      evidence_id: EV-MLKEM-ee220e
      summary: >-
        Adversarial pass on BATCH-015; verdict blocking_objections. RIGHT
        CONCLUSION, WRONG MECHANISM, and the Coordinator endorsed the mechanism
        twice. The occupancy floor 0.9183 is a valid MINIMUM and an invalid
        REFERENCE POINT: it is attained only by the 0/1-per-cell member, and the
        archive REJECTS that member at z = +3.46 (+3.15 deflated; n=50 +2.03).
        The floor member predicts a deficit at HIGH occupancy; the observed
        deficit is in the LOW-occupancy tercile (phi 0.6371 where the correction
        is 0.4 percent) and VANISHES at high occupancy (0.9043 where it is 22
        percent). i.i.d. SURVIVES -- and W-3 retires the question entirely, since
        heterogeneous independent Poisson sums have Var = mu exactly, so
        non-identity cannot produce a sub-floor reading at all. ANOM-5 REMAINS
        NOT AN EFFECT on grounds needing no floor: Sidak p = 0.105 over six
        post-hoc readings, model-order range 0.43 against a 0.082 correction, and
        the two files disagreeing in SIGN. EXHAUSTION RULED: the mid-band lane is
        NOT exhausted (five moves remain at 301 bins, one executed); the
        WHOLE-BAND POINT-COMPARISON sub-lane IS, with a sharper obstruction than
        bin count -- a = 0.01530 per score fixes the count window so more
        iterations translate it without widening it. SIXTH falsified Coordinator
        premise: I asserted the archive holds no per-iteration data; it holds
        4000 values in iteration order and BATCH-015's own code already used
        them.
    - batch_id: BATCH-017
      decision_id: DEC-20260803-95176a
      evidence_id: EV-MLKEM-890e2a
      summary: >-
        The per-cell occupancy regression at 301 and 496 cells; validator verdict
        ADMISSIBLE_WITH_DEFECTS on 11 numbered defects. THE FLOOR REJECTION
        SURVIVES AND IS NOT A TERCILE ARTIFACT: 164 cells at occupancy below 0.02,
        where the floor moves the reference by at most 2 percent, read mean
        t = 0.6811 against 0.9959 +/- 0.1084 and 0.9995 +/- 0.1114 (z = -2.91,
        -2.86); monotone across four occupancy quartiles the wrong way for the
        floor member; survives leverage restriction; and VISIBLE IN THE RAW
        INCREMENTS WITH NO RATE MODEL (detrended var/mean 0.453, 0.561, 0.660).
        EV-MLKEM-ee220e W-4 is CONFIRMED, not superseded -- the handoff's
        reinstate-the-floor counterfactual did not occur. THREE FRAMINGS STRUCK.
        (1) The intercept "second surprise" is an IDENTITY: intercept = phi -
        slope*xbar exactly, so E[intercept] = 1 under BOTH nulls by construction
        and "under both" says no more than "under one"; Coordinator confirmed to
        0.00e+00 at seven degrees and floor = 1 - xbar to 1.11e-16. It also
        restates BATCH-016 section 3b's -2.55 sd at a WEAKER |z|, which the
        Coordinator failed to point the producer at. (2) The degree-2 row that
        appeared to REINSTATE the floor member rejects it HARDEST once tested
        jointly: validator D^2 = 27.97 at 0/400 against degree 5's 13.62 at 1/400;
