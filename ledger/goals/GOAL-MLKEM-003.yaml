    - batch_id: BATCH-010
      decision_id: DEC-20260803-c7a1a3
      evidence_id: EV-MLKEM-020
      summary: >-
        Memory-charged re-derivation of the FIPS 203 NIST margin under RC.MATZOV
        (VAL ADMISSIBLE_WITH_DEFECTS, 8 defects; RT pass_with_constraints, 11
        objections). Disposition `revise` (refine): the finding is real and its
        framing was wrong. WHAT SURVIVES is a robustness statement, not a
        magnitude - the charge that erases EV-MLKEM-015's undercut is
        c* = 0.03164649 / 0.04588645 / 0.00705473 (Model A, Z_q units) and the
        INEQUALITY c* < 1/3 is invariant to the sieve-memory exponent across
        [0.05, 0.40], to every memory unit, to both charge models, to the
        BKZ-vs-SVP sieve dimension (+3.98..+8.25%), to within-RC.MATZOV
        re-optimisation (recovers 0.46 bits of the 26.70 needed), and to the
        polynomial-memory enumeration falsifier the red team named and the
        Coordinator ran (18/18 combinations above cutoff, smallest excess +76.04
        bits). WHAT DOES NOT SURVIVE: c* is the identity margin / log2 M in two
        pre-existing numbers, so its value is forced and its eight significant
        figures contradict H11 (a one-bit cutoff error moves Kyber-1024's c* by
        78% of it); the memory model is BORROWED, since lwe_primal supplies no
        memory figure at all; CTRL-5 cannot fail, so controls-before-belief is
        formally unmet; and an 8.152329-bit arithmetic error at
        memory_charged_derivation.py:151 feeds a c* row in the direction of the
        conclusion. A Coordinator overclaim in the immutable BATCH-010 snapshot
        commit message is recorded and corrected in DEC-20260803-c7a1a3. NO
        status change anywhere, NO knowledge promotion (concrete reason and
        successor recorded), NO ML-KEM break and no security proof, no FIPS 203
        parameter set affected or cleared, EV-MLKEM-015 not contradicted. Rule 12
        remains unmet and unwaived. The batch-10-of-10 budget exhaustion was met
        and CLEARED in the same decision by a 10 -> 12 extension on direct user
        instruction, so the goal stays `active` and is NOT paused; no closure
        quorum is sought or asserted, and `active` asserts no success either.
