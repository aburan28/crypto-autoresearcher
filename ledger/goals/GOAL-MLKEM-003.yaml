  scheme_context:
    scheme: "ML-KEM (FIPS 203, formerly CRYSTALS-Kyber)"
    family: "lattice KEM (module learning with errors)"
    nist_track: selected_algorithm
    standardization_status: >-
      Finalized 2024-08-13 as FIPS 203. Deployed at scale; the most
      widely fielded PQC primitive.
  completion_criteria:
    - >-
      An independently re-derived security estimate for at least one
      FIPS 203 parameter set under a memory-charged cost model,
      calibrated by measured sieve behaviour at reduced dimensions, with
      the margin relative to the published estimate reported in
      whichever direction it falls and every extrapolation step stated
      as a numbered heuristic.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
