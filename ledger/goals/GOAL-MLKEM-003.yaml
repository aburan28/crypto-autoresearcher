research_goal:
  id: GOAL-MLKEM-003
  title: "ML-KEM: is the core-SVP margin conservative at FIPS 203 dimensions, and by how much?"
  objective: >-
    Put ML-KEM's parameter-level security estimate on independently
    re-derived and partially measured footing: reproduce the submitted
    estimates from primary text, build a memory-charged concrete sieve
    cost model at FIPS 203 dimensions, calibrate it against measured
    behaviour at reduced dimensions, and state the resulting margin — in
    whichever direction it moves — conditionally on numbered
    assumptions. Explicitly complementary to GOAL-MLKEM-001 and
    GOAL-MLKEM-002, which own the implementation-conformance flank.
    BATCH-001 additionally targets the residual of KN-OPEN-016: matched
    dual-vs-primal costing under MATZOV and the gap to Carrier/MATZOV-2022
    dual headlines.
  question_ids: [RQ-MLKEM-003]
  active_hypothesis_ids: [H-MLKEM-014, H-MLKEM-010, H-MLKEM-011, H-MLKEM-012, H-MLKEM-013]
