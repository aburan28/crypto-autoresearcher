        misspecification conclusion SURVIVES on better evidence (count>=1000
        sub-band misfit 16.5x and 24.8x the closed-form counting floor) but its
        argument is STRUCK: zero was never achievable, the whole-band excess is
        only 1.25x/1.30x that floor. Also struck: O-7's source-defect suggestion
        (operative displays favour a consistent reading 5 to 1), O-6's
        "unattributed" (Phi_dlsc at (4.10) and alpha to 0.48% are both in the
        archive, so it was a fatigue report), O-4 as counterweight (the band
        reaches only ~15% of the operating threshold), and the values 23.25/22.25
        as exponent estimates (argmin drifts monotonically as noise is removed).
        Coordinator's own handoff premise about (4.18) was false and is recorded.
