  next_action: >-
    Next batch, zero new sampling, authorized by DEC-20260806-0c1e35: FIT THE
    COMPETING ALTERNATIVE INSTEAD OF TUNING IT. The BATCH-e41719 validator ruled
    the log-normal AR(1) random-dispersion process an ALTERNATIVE rather than a
    null on four grounds, the sharpest being that sigma was CHOSEN to make z cross
    -2 -- a minimum over a family, which standing binding (g) forbids reading as
    the value of the statistic. The legitimate version has never been done. Fit
    (sigma, ell) by maximum likelihood, compare against the independence model on
    a proper criterion with the parameter count paid for, and report which the
    data prefer. This decides between two genuinely different mechanisms --
    sub-Poisson counting versus spatially smooth random dispersion -- and converts
    the last live escape from an untested possibility into a measured comparison.
    PAIR IT with the joint minimum-variance object EV-MLKEM-26cf46 J-4 says is
    still unbuilt: the subset-count-constrained design reaching a variance ratio
    of 0.1588 against JN-3's 0.9211, which BATCH-017 W-10 asked for and which two
    batches have now failed to deliver. Its direction is conservative so it cannot
    overturn the finding, but leaving a named object unbuilt across three batches
    is how a program accumulates unexamined premises. REQUIRE AN INDEPENDENT
    VALIDATION IN THE SAME BATCH. Require an `inference` block in every
    machine-readable artifact, closing validator defect V-5. DO NOT attempt to
    identify the deficit's mechanism from these two files: J-9 establishes it is
    impossible here under all 24 specifications tried, with the cross-file
    contrast REVERSING SIGN on this lane's declared raw-score scale; that needs a
    third file or a non-monotone occupancy-position map, and the archive has
    neither. BINDINGS: all prior bindings stand, plus the two issued by
    DEC-20260806-0c1e35 -- a statistic's null MEAN is part of the statistic, never
    quote a dispersion reading against an assumed expectation of 1; and
    "model-free" describes a numerator, not a test. Rule 12 unmet and unwaived;
    KN-FIND-031 withdrawn; KN-OPEN-016 open; no closure quorum; no ML-KEM break
    claim.
