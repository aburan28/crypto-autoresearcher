        validator implementation, robust across six weightings. BUT THE VALIDATOR'S
        IDENTIFIABILITY CONTROL REFRAMES IT: the scan recovers the generating
        exponent exactly on model-generated data, so the displacement is real, yet
        the best achievable rms on real data is 0.426 bits rather than 0 -- a
        MISSPECIFIED FAMILY whose least-bad member sits lower, not a corrected
        exponent. Counter-instance recorded: on the deep tail T>1000 the n=43 own
        exponent IS the argmin. CHECK B fixes the sign only; concavity bounds no
        magnitude, the finite bound comes from P_in >= Q(T) and is nearly vacuous,
        and the textually motivated reading accounts for 0.31%/0.27% of the
        BATCH-009 over-prediction, which stays unattributed. D7 (source (4.18)
        defines D with the integral INSIDE) is material and unresolved.
    - batch_id: BATCH-011
      decision_id: DEC-20260803-2e82d5
      evidence_id: EV-MLKEM-2e668d
      snapshot_commit: eb7cdc1dac08fd2a8a0835c927879b61088ac20c
      summary: >-
        D7 settled and the BATCH-010 reading adversarially tested. THE OBJECT
        UNDER TEST WAS NEVER THE ONE NAMED: BATCH-009 through BATCH-011 fitted
        BATCH-009's Gaussian-Phi surrogate, not Approximation 4.9's family, with
        a named mechanism from the source's own (4.10)/(4.11) -- Upsilon at
