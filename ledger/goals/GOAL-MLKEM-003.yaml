    - batch_id: BATCH-012
      decision_id: DEC-20260803-3bba92
      evidence_id: EV-MLKEM-553b83
      snapshot_commit: d274699aade09abc81815627d16afaf06085d91a
      supersedes_batch_log_entry: >-
        The BATCH-012 entry recorded under DEC-20260803-f2d3a4 (NOT EXECUTED,
        paused on a provider session limit) is superseded by this one. The pause
        and its resume under DEC-20260803-db64f6 both stand as recorded.
      summary: >-
        FIRST POSITIVE RESULT IN THIS LANE, and it corrects three batches of the
        program's own work. The exact region measure from (4.10)/(4.11)/(4.24)
        fits the whole band at 1.06-1.13x the counting-noise floor with ONE FEWER
        free parameter and its exponent frozen, against the surrogate's
        2.07x/2.13x at own exponent -- so the whole-band misfit reported across
        BATCH-009/010/011 was a property of the GAUSSIAN-PHI SURROGATE, not of
        Approximation 4.9. Two structurally different second parameters each
        select their null value exactly and buy nothing. SURVIVING: the
        count>=1000 misfit at 13x-26x, strengthened -- both attacks on the
        comparison failed -- and now characterised as a systematic S-shaped shape
        error with lag-1 autocorrelation 0.99907. STRUCK: the word "closed" (the
        residual is Brownian, so profiling a normalisation removes 6-11% of it;
        nothing is at or below its floor and ANOM-4 dissolves), report 3.2's
        edge claim and its 177x->61.4x row, and the Coordinator's premise that
        PDF page 20 was among the extracts. Counting floor confirmed on THREE
        independent derivations. ANOM-1 node-ordering defect contained;
        BATCH-010 verified structurally unaffected.