    - batch_id: BATCH-012
      decision_id: DEC-20260803-3bba92
      evidence_id: EV-MLKEM-553b83
      snapshot_commit: d274699aade09abc81815627d16afaf06085d91a
      supersedes_batch_log_entry: >-
        The BATCH-012 entry recorded under DEC-20260803-f2d3a4 (NOT EXECUTED,
        paused on a provider session limit) is superseded by this one. The pause
        and its resume under DEC-20260803-db64f6 both stand as recorded.
      summary: >-
        FIRST POSITIVE RESULT IN THIS LANE, and it corrects three batches of the
        program's own work. The exact region measure from (4.10)/(4.11)/(4.24)
        fits the whole band at 1.06-1.13x the counting-noise floor with ONE FEWER
        free parameter and its exponent frozen, against the surrogate's
        2.07x/2.13x at own exponent -- so the whole-band misfit reported across
        BATCH-009/010/011 was a property of the GAUSSIAN-PHI SURROGATE, not of
        Approximation 4.9. Two structurally different second parameters each
        select their null value exactly and buy nothing. SURVIVING: the
        count>=1000 misfit at 13x-26x, strengthened -- both attacks on the
        comparison failed -- and now characterised as a systematic S-shaped shape
        error with lag-1 autocorrelation 0.99907. STRUCK: the word "closed" (the
        residual is Brownian, so profiling a normalisation removes 6-11% of it;
        nothing is at or below its floor and ANOM-4 dissolves), report 3.2's
        edge claim and its 177x->61.4x row, and the Coordinator's premise that
        PDF page 20 was among the extracts. Counting floor confirmed on THREE
        independent derivations. ANOM-1 node-ordering defect contained;
        BATCH-010 verified structurally unaffected.
    - batch_id: BATCH-013
      decision_id: DEC-20260803-52a750
      evidence_id: EV-MLKEM-0cf1df
      summary: >-
        Adversarial pass on BATCH-012's positive finding, run to close a scrutiny
        asymmetry (four adverse batches got a red team; the one favourable batch
        got a validator only). SURVIVES: at MATCHED parameter count the exact
        region measure fits ~2x better than the surrogate (0.3556 vs 0.7055;
        0.3172 vs 0.6969), with 98.6%/90.8% of the improvement on C>=1000 rows
        where the counting floor is negligible -- so it is not a tail artifact
        and rests on no floor protocol. Misfit there falls 64.7x -> 23.9x,
        UNCLOSED. STRUCK: the whole-band headline and every variant. That
        statistic carries ~1.5 effective degrees of freedom (perfect-model
        sampling sd ~57%) and attenuates measurable misfit 1147-fold, scoring a
        PERFECT model at 0.769x, so two batches of conclusions were built on an
        uninterpretable number. ANOM-4 was never an anomaly. The Coordinator's
        own suggested attack (a single fitted scale rescuing any monotone shape)
        was REFUTED: null families score 4.86x-56.9x. All four budget-blocked
        claims answered; D-2's n=50 leg now measured and struck. Whole-band
        ratios are retired from this goal.
    - batch_id: BATCH-014
      decision_id: DEC-20260803-7bc224
      evidence_id: EV-MLKEM-c50030
      snapshot_commit: e95fe60d7e
      summary: >-
        Control C1 SUCCEEDED where two prior attempts were inconclusive: the deep
        tail is consistent with Poisson under TWO independent constructions
        (producer 0.895+/-0.154 and 1.062+/-0.166; validator, rebuilt from
        scratch on a different basis and binning, 0.9494 and 1.1229, all 24
        windows within 1.20 sd), with a TWO-SIDED power control -- phi_true=1.5
        recovers as 1.5038+/-0.2529, and the validator added the missing downward
        control, phi_true=0.80 recovering as 0.813+/-0.133. Over-dispersion is
        removed as an explanation for sub-floor readings. BOUNDED BY ANOM-5,
        which is real: n=43's mid band shows a 20 percent variance DEFICIT at
        -2.36 sd against its own null, and the deep-tail test's unexcluded band
        CONTAINS 0.80 -- so T-1 is a null at the deep tail's resolution, never
        "no dispersion structure exists". CORRECTED: the headline dof does NOT
        reproduce from the stated formula (brute force gives 1.573/1.519, not
        1.545/1.514; convention-contingent, sub-bands agree exactly), so the
        VALUE is withdrawn while the O(1) CONCLUSION stands across all four
        conventions (1.51-2.35). THREE COORDINATOR ERRORS corrected: the
        plug-in-control inference (the control computes (Y-Y)^2/Y and says
        nothing about the S-11 attempts), the sign-alternation claim (n=43 reads
        -,+,-,-,+,-), and labelling a model-dependent 0.7701x as structural.
        Attenuation identity reproduced a third time, counting floors a fourth.
    - batch_id: BATCH-015
      decision_id: DEC-20260803-b4d2d0
      evidence_id: EV-MLKEM-ce1884
      snapshot_commit: 18e6679ba0
      summary: >-
        ANOM-5 DISSOLVES: it is the estimator's NULL OBJECT. A finite-iteration
        statistic at occupancy 0.739 cannot be referenced to the Poisson point
        1.0; the admissible floor is 0.9183 and the residue falls from -2.4 sd to
        about -1.5 sd across two independent instruments, which is not an effect.
        BUT THE THEOREM WAS OVER-STATED and my confirmation of it was blind in
        the same place: "any independent-iteration model" is FALSE (the step needs
        sum p_i^2 <= mu^2/N and Cauchy-Schwarz gives the opposite; a
        counterexample returns phi = 0.00433, ~2300 sd below). It requires
        IDENTICAL DISTRIBUTION, which the archive cannot verify. Under i.i.d. the
        floor is the EXACT minimum. Deep-tail null untouched, so BATCH-014's T-1
        stands. Format exonerated decisively; estimator arithmetic bit-for-bit.
        Job B reconstructs BATCH-012's flagged rows to 2.6e-10 bits and the flags
        were right -- but its inference is corrected to something STRONGER: the
        fit-dependence is a normalisation BIAS, centred scatter is
        fit-INDEPENDENT for four of six models, and with O(1) dof neither ratio
        is resolved from 1.0, so the honest reading is "unresolved under both
        fits". Second congenial control in two batches confirmed degenerate.