      evidence_id: EV-MLKEM-018
      summary: >-
        Contradiction review of the counting-resolution confound (zero new
        compute, archived bytes only; run under review-adversarial and explicitly
        NOT the AGENTS.md rule 12 review-breakthrough pass, which no backend in
        this environment can serve). EV-MLKEM-011 -> claim_survives_narrowed: the
