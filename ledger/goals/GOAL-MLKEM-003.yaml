    uncertainty and revisit conditions in DEC-20260802-15cadd.ranking_rationale;
    objection 2 may make it moot or reframe it, and (ii) is its cheap precursor.
    Snapshot before review; the promotion decision (KN-FIND-012 / KN-FIND-014
    supersession, KN-LIT-111 upgrade) is made in BATCH-008's ledger decision on
