      pause this goal. Retained here rather than deleted because this list is
      cited by DEC-20260731-006, which paused the goal under exactly this
      condition; the remaining conditions below are still live.
    - >-
      Neither the FIPS 203 text nor the primary parameter-derivation
      literature can be obtained under the network policy after the
      declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    BATCH-008 (zero-network, no permissions needed): recount the Fig 4.1 sample
    budget directly from the archived .out files in
    experiments/EXP-MLKEM-011/vendor-lock/data/ to convert KN-FIND-031's
