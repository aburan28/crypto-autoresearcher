  next_action: >-
    BATCH-012 IS THE LAST BATCH under the DEC-20260803-c7a1a3 extension (batch 12
    of `maximum_batches: 12`). ITS FIRST AND PRODUCING TASK is ranking candidate
    A of DEC-20260803-85adf8: OBTAIN A SAGE-COMPUTED REFERENCE FOR
    `estimator.lwe_dual.matzov` AT KYBER-768 AND KYBER-1024 under RC.MATZOV at
    pin 3e48ef421ec256afddb3e7d2249a77eab6e9ba12 - install Sage and run
    `LWE.estimate(schemes.Kyber768)` and `LWE.estimate(schemes.Kyber1024)`, or
    run the estimator's own doctest suite at the pin - and COMPARE AGAINST
    196.3662433540 AND 262.3356800075, archiving the transcript verbatim
    whichever way it falls. WHY THIS FIRST: those two numbers are the campaign's
    single UNCOVERED INSTRUMENT PATH. The harness known-answer control covers
    `primal_bdd` and `dual_hybrid(fft=True)` only; the sole Sage anchor for
    `matzov` anywhere in this campaign is the pinned repository's own committed
    doctest at KYBER-512; and the two uncovered figures carry ANOM-3's 4.59 and
    8.39-bit margins, D1's 7.42 and 11.48 bits, the Carrier residuals at 768/1024
    and every below-cutoff sentence for those two sets. One disagreement
    falsifies all of them at once, which makes it the only check in the batch
    that can fail catastrophically rather than incrementally. It is also the
    producer's own gap_report section 8 item 1 and the red team's
    `next_concrete_action`, reached independently. IF SAGE CANNOT BE INSTALLED
    UNDER THIS PROGRAM'S NETWORK POLICY, a declared "the reference cannot be
    obtained here" is a USABLE RESULT and must be reported as one rather than
    padded; that is infrastructure signal and never a mathematical result
    (AGENTS.md rule 5). BECAUSE THAT OUTCOME IS REAL, THE SAME TASK CARRIES THREE
    CHEAP RIDERS on the same artifact so the batch produces something reviewable
    either way: (i) RC-4 / OBJ-9(b) - re-run stages 2-4 with the search boxes
    doubled (p in [2,16], k_enum/k_fft/beta +-16, about 60 s) and report whether
    S4 keeps falling, which decides whether "the pinned estimator reproduces
    Carrier's headline" is bounded by the model or merely by the box; (ii) RC-1 -
    the null object ANOM-3 still lacks: cost `matzov` and `primal_bdd` on an LWE
    instance with the same (n, q, m) as Kyber but a secret/error distribution for
    which the dual distinguisher provably cannot work, and report whether the
    ordering persists; (iii) RC-2 - extend the N-inflation decay test to 2^24 and
    2^32 so Kyber-768 and Kyber-1024 are BRACKETED rather than merely unbroken at
    2^16. THE CARD MUST ENUMERATE EVERY CALLABLE THE HARNESS ACTUALLY SERVES,
    at every parameter set, under the named cost model, BEFORE costing anything,
    and record each resolved callable (`__module__`, `__qualname__` /
    `type(...).__name__`, the estimator's own `f_name`) and its binding locus
    into results.json - this campaign audited what does NOT run across ten
    batches and never once enumerated what DOES, which is what let a one-line
    alias go unnoticed through EV-MLKEM-015 and ten batches
    (DEC-20260803-85adf8 CD-1). Then an independent `review-adversarial` pass in
    a separate session, with a snapshot archive before it and a ledger archive
    after it; the snapshot must either include `tools/sage_free_estimator` in its
    declared paths or record the instrument hash it certifies (CD-3, third
    recurrence), and its receipt must be filled in after the commit (CD-4).
    Candidate B - the KN-TECH promotion on the callable-identity discipline,
    scoped to SOURCE FACTS ONLY and asserting nothing about EV-MLKEM-015 - rides
    BATCH-012 with `knowledge/` in its own declared write_scope if the batch can
    carry a second task, with a regenerated knowledge/INDEX.md in the same ledger
    archive commit. Budget: one producing run, <= 1800 s, plus the Sage
    installation. Authorize no G6K run, no new sampling, and NO COST-MODEL CHANGE
    - candidate C's sizing of Carrier's unmapped log2 R (9.39 / 9.49 / 15.15)
    needs an explicit `protocol_amendment` first, and note that the producer's
    own proposal to spend that amendment on `mu` is superseded: the red team
    sized mu at <= 0.267033 bits over a 128-bit tightening. Mint every BATCH-012
    identifier with `python3 tools/allocate_id.py --next <type>` random 6-hex
    tokens and confirm with `--check`, regardless of what origin/main's CLAUDE.md
    currently says (DEC-20260803-c7a1a3.repository_state_observation). RULE 12
    STAYS UNMET AND UNWAIVED: nothing in BATCH-012 may treat EV-MLKEM-011,
    EV-MLKEM-013, EV-MLKEM-015, EV-MLKEM-017, EV-MLKEM-018, EV-MLKEM-020,
    KN-FIND-012 or KN-FIND-014 as corrected, and ANOM-3 may not be recorded as
    correcting EV-MLKEM-015 however many reviewers recommend it. COST-MLKEM-001
    remains the conditional envelope; KN-OPEN-016 and KN-OPEN-017 remain open; no
    ML-KEM break claim and no security proof.
  superseded_next_action_batch_011: >-
    PRESERVED VERBATIM (AGENTS.md rule 4). The `next_action` this one replaces,
    written by DEC-20260803-c7a1a3, is reproduced below unchanged. NOTE THE
    DEVIATION, recorded rather than elided: it named the borrowed-memory-model
