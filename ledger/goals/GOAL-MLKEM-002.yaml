research_goal:
  id: GOAL-MLKEM-002
  title: Defensive ML-KEM comparison-conformance under a decidable hardened gate
  objective: >-
    Decide, with a repaired multi-class differential conformance gate, whether
    the incomplete ML-KEM re-encryption comparison class observed in audited
    wolfSSL pre-fix routines is isolated to those routines or systemic across
    optimized ML-KEM implementations whose comparison code is in the same
    defect-mechanism neighborhood (fixed-bound hand-written vector tails),
    while preserving every theory, run, review, and ledger transition as
    committed evidence.
  question_ids: [RQ-MLKEM-002]
  active_hypothesis_ids: [H-MLKEM-004]
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 4
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-001
  dispatch_queue_path: coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: null
  predecessor_goal: GOAL-MLKEM-001
  predecessor_disposition: >-
    GOAL-MLKEM-001 closed_at_budget with primary cryptanalysis objective unmet
    (DEC-20260724-008). Its durable defensive output is KN-FIND-001; its
    hardening attempt failed as generator_hardening_insufficient under a
    self-defeating precedence design recorded in KN-TECH-030.
  completion_criteria:
    - >-
      A repaired hardened gate reaches a unique outcome class under frozen
      precedence in which both generator_hardening_insufficient and
      isolated_to_audited_commits are reachable worlds, and the instrument-
      adequacy conjunct is decided by a baseline-invisible synthetic control
      rather than by rediscovery of a G1-visible defect.
    - >-
      The isolation-versus-systemic question is asked of at least one second
      implementation whose comparison routine uses fixed-bound hand-written
      vector comparison tails, or an explicit infrastructure unavailability is
      recorded after exhausting the preference order.
    - >-
      Independent Validator and Red Team sessions admit the run package, and
      the Coordinator commits evidence, decision, and any warranted knowledge
      entry through a verified ledger archive.
  pause_conditions:
    - The four-batch campaign budget is exhausted without an admissible next decisive experiment.
    - No second implementation with fixed-bound hand-written comparison tails can be built within budget after the declared preference order is exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Execute BATCH-001: run frozen EXP-MLKEM-004 (TASK-20260724-919) under the
    repaired hardened gate with the baseline-invisible synthetic control and a
    mechanism-matched second implementation, then independent validation, red
    team, and ledger archive as EV-MLKEM-007 / DEC-20260724-015.
