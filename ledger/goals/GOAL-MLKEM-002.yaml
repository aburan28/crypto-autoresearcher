research_goal:
  id: GOAL-MLKEM-002
  title: Defensive ML-KEM comparison-conformance under a decidable hardened gate
  objective: >-
    Decide, with a repaired multi-class differential conformance gate, whether
    the incomplete ML-KEM re-encryption comparison class observed in audited
    wolfSSL pre-fix routines is isolated to those routines or systemic across
    optimized ML-KEM implementations whose comparison code is in the same
    defect-mechanism neighborhood (fixed-bound hand-written vector tails),
    while preserving every theory, run, review, and ledger transition as
    committed evidence.
