      The isolation-versus-systemic question is asked of at least one second
      implementation whose comparison routine uses fixed-bound hand-written
      vector comparison tails, or an explicit infrastructure unavailability is
      recorded after exhausting the preference order.
    - >-
      Independent Validator and Red Team sessions admit the run package, and
      the Coordinator commits evidence, decision, and any warranted knowledge
      entry through a verified ledger archive.
  pause_conditions:
