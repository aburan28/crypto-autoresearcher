research_goal:
  id: GOAL-CLGRP-001
  title: >-
    Class groups as trustless hidden-order groups: measure the cost curve from
    certified computations, state the extrapolation interval honestly, and
    verify which structural sub-case each countermeasure removes
  objective: >-
    Class groups of imaginary quadratic orders entered deployment because they
    give a hidden-order group with no trusted setup. Their parameter sizes rest
    on a subexponential cost model anchored by far fewer record computations
    than the RSA model it replaced. Measure it: run class group order and
    structure computations to completion across a sweep of discriminant sizes,
    emit a CERTIFICATE for each (generators, relations, a verifiable structure
    statement) re-verified independently, fit the observed cost, and extend the
    fit to deployed sizes WITH ITS INTERVAL. The width of that interval is the
    deliverable, because the deployment argument treats the estimate as tight.
    In parallel, audit the assumptions rather than the parameters: the low-order
    and adaptive root assumptions fail in the presence of known structure, the
    structural sub-cases are finite and enumerable, and each named countermeasure
    can be checked against each sub-case with an explicit witness where it fails.
    No computation at a deployed discriminant size is attempted and no verdict on
    a deployed parameter is recorded.
  question_ids: [RQ-CLGRP-66ab7f]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 21600
    max_concurrent: 3
  related_goals: [GOAL-RSA-001, GOAL-SNFS-001, GOAL-PAIR-001, GOAL-CSIDH-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "class groups of imaginary quadratic orders as used in verifiable delay functions, trustless accumulators, and hidden-order commitments"
    family: "index calculus in imaginary quadratic class groups; low-order and adaptive root assumptions"
    nist_track: not_standardized
    standardization_status: >-
      RECALLED, UNVERIFIED: not standardized. Deployed in at least one
      production proof-of-time construction and in several accumulator designs,
      chosen specifically to avoid the trusted setup an RSA modulus needs.
    why_this_scheme: >-
      The trusted-setup-free property is exactly why these groups were adopted,
      and it is bought with a cost model that has fewer anchors than the one it
      replaced — the program's recurring pattern, in a setting where the
      measurement genuinely runs. Small-discriminant class group computations
      complete quickly, produce certificates, and sweep. The structural
      assumption audit is finite and is where a real defect, if one exists, would
      live.
  non_duplication:
    - >-
      GOAL-RSA-001 owns the memory-charged NFS baseline for factoring, and
      GOAL-SNFS-001 owns special-form primes. This goal's group has no modulus
      and no trusted setup; the algorithms are related in shape only. Neither
      goal's cost figures transfer and neither may cite the other's evidence.
    - >-
      GOAL-PAIR-001 also fits a subexponential curve from small certified
      computations and extrapolates. The METHODOLOGY is deliberately shared and
      may be cited as method; the numbers are disjoint.
    - >-
      GOAL-CSIDH-001 touches class groups as the acting group of an isogeny
      action. Same objects, different question: that goal asks about quantum
      cost of a group ACTION, this one about classical cost of computing the
      GROUP. Cross-citation of conclusions is prohibited.
  completion_criteria:
    - >-
      A MEASURED COST CURVE from class group computations run to completion
      across a declared sweep of discriminant sizes, each emitting a certificate
      re-verified by an independent checker.
    - >-
      AN EXTRAPOLATION WITH ITS INTERVAL: the fitted model form stated,
      residuals reported, and the interval at deployed sizes given explicitly —
      with the record stating plainly that the interval, not the point estimate,
      is the result.
    - >-
      A STRUCTURAL SUB-CASE AUDIT: the known sub-cases enumerated exhaustively
      within a declared class, an explicit witness constructed for each, and each
      named countermeasure checked against each sub-case with the outcome
      recorded per cell.
    - >-
      A PARAMETER-PROVENANCE STATEMENT: where each deployed discriminant size
      came from, and whether it is a translation of an RSA-modulus estimate under
      a rule this program can restate and check — with "could not determine"
      recorded as such.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificate reproduction, that no extrapolation is presented as a
      verdict, and that no failed computation is presented as evidence of
      hardness.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - The class group algorithm reference and at least one hidden-order-group construction cannot be obtained in primary text after the declared source-preference order is exhausted.
    - Class group computations exceed the campaign budget above some discriminant size. That boundary is recorded as this program's reach and is never evidence about the problem's hardness (AGENTS.md rule 3).
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    RUN THE STRUCTURAL SUB-CASE ENUMERATION FIRST — IT IS FINITE, CHEAP, AND
    NEEDS NO SWEEP. Two-torsion arising from ambiguous forms is classical genus
    theory: the sub-cases can be enumerated and an explicit witness constructed
    for each at small discriminants in minutes, with no cost model and no
    extrapolation involved. That produces either a clean table showing each
    countermeasure removing each sub-case, or a witness that one does not — and
    the second outcome would be the most valuable result this goal can produce,
    reachable in batch one. The cost sweep is the expensive half and should start
    only once the certificate and verification machinery has been exercised on
    the cheap half. Claim tier: certified computations at run sizes and a fitted
    extrapolation with intervals; never a verdict on a deployed parameter.
