  additional_diagnostics:
  - complete curve and twist order factorization with checkable certificates
  - subgroup, cofactor, and invalid-curve confinement costs
  - automorphism- and endomorphism-adjusted rho cost
  - embedding-degree certificate or explicit search bound
  - CM discriminant and conductor structure
  - model-conversion exceptional sets
  - scalar and multiscalar formula exceptional-case search
  - deterministic parameter-generation transcript audit
  claim_boundaries:
  - Every SafeCurves True or False cell is user-supplied, unverified intake and a
    preregistered comparison target; it is not evidence.
  - A failure of rigidity, ladder availability, completeness, or indistinguishability
    is not by itself an ECDLP break.
  - The Anomalous and BN(2,254) rows are positive-control candidates for the described
    transfer or small-discriminant behavior, not newly discovered attacks; their parameters
    and behavior still require sourced reproduction.
  - The declared diagnostic list is deliberately non-exhaustive; a sourced, measurable
    additional parameter-level weakness may be added through a later scoped handoff.
  - Infrastructure errors, timeouts, unavailable dependencies, and budget stops are
    operational observations, never mathematical evidence.
  completion_criteria:
  - Reconcile the exact parameter tuple to retrieved primary or authoritative sources,
    record citation provenance, and adjudicate every conflict.
  - Produce a fully sourced, certificate-bearing dossier for each of the eleven declared
    SafeCurves lanes, including method, controls, raw/checkable artifacts, tested
    boundary, falsifier, and limitations.
  - Evaluate every declared additional diagnostic with checkable certificates or an
    explicit reproducible bound, and state any untested or only partially tested scope.
  - Adjudicate every disagreement with the preregistered SafeCurves row without treating
    the intake row as ground truth.
  - Obtain independent validation of artifacts and controls plus independent review
    of any proposed interpretation before a Coordinator synthesis or status transition.
  - Archive producer, validation, review, decision, and synthesis records through
    the durable snapshot and ledger mechanisms required by the repository.
  pause_conditions:
  - Archive, queue, identifier, or ledger integrity cannot be established.
  - A required non-degradable independent review policy cannot be honored by an allowed
    non-Bedrock backend.
  - Primary or authoritative sources leave an unresolved conflict in the named curve's
    parameter tuple.
  - The campaign reaches its declared batch or wall-clock budget before the evidentiary
    completion criteria are met.
