    curve: BN(2,254)
    equation: y^2 = x^3+0x+2
    modulus: '16798108731015832284940804142231733909889187121439069848933715426072753864723'
    details: 2011 Pereira-Simplicio-Naehrig-Barreto pairing-friendly curve. Included
      as an illustration of multiplicative transfer and small discriminant.
    expected_safe: false
    expected_criteria:
      field: true
      equation: true
      base: true
      rho: true
      transfer: false
      disc: false
      rigid: true
      ladder: false
      twist: false
      complete: false
      ind: false
