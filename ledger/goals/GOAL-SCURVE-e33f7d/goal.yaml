  objective: Independently reproduce and source the eleven SafeCurves criteria for
    BN(2,254) (field, equation, base, rho, transfer, discriminant, rigidity, ladder,
    twist, completeness, and indistinguishability), then measure prioritized additional
    parameter-level weakness diagnostics without treating the intake table as evidence.
