research_goal:
  id: GOAL-MAYO-001
  title: "MAYO: does whipping cost security relative to matched plain UOV?"
  objective: >-
    Determine whether MAYO's whipped construction is security-neutral
    relative to plain UOV at matched claimed levels — by searching for a
    whipping-induced invariant or intersection structure that lowers
    oil-space recovery cost, and by bounding what the specification's
    randomness discipline must guarantee for the known seed-fixing and
    fault key-recovery routes to remain out of reach.
  question_ids: [RQ-MAYO-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "MAYO"
    family: "multivariate (whipped Unbalanced Oil and Vinegar)"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      Either a certified toy-scale oil-space recovery whose fully
      charged cost model beats the matched plain-UOV baseline and
      extrapolates conditionally to a named parameter set; or a derived
      structural argument that the whipping map preserves no exploitable
      invariant, paired with an explicit statement of the
      randomness/fault assumptions the scheme then depends on.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      No MAYO Round-3 specification or reference implementation can be
      obtained under the network policy after the declared
      source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-MAYO-001 after the matched plain-UOV baseline
    (intersection attack complexity at the underlying map's parameters)
    is written down as a KN-TECH entry. Proposals that attack the
    implementation must be filed as a separate class from proposals that
    attack the map; do not let a fault result be scored as a break of
    the mathematics.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
