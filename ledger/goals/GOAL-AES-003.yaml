research_goal:
  id: GOAL-AES-003
  title: >-
    Reduced-round AES, executed: build, run and certify an attack whose cost is
    MEASURED, against references this repository can adjudicate
  objective: >-
    Against the pinned FIPS-197-verified AES ground truth and under a cost model
    committed before any measurement, CONSTRUCT and EXECUTE attacks and
    distinguishers on reduced-round AES at r in 3-7, and produce either
    (a) a certified single-key key recovery whose MEASURED end-to-end cost is
    strictly below the DEFINITIONAL exhaustive-key-search reference at that round
    count and key size, or
    (b) a certified single-key key recovery whose MEASURED cost is strictly below
    the MEASURED cost of a generic baseline this campaign implements, freezes and
    runs itself at the same round count on the same machine in the same unit, or
    (c) a distinguisher surviving strictly beyond this campaign's OWN MEASURED
    death rounds, with a measured false-positive rate against a matched
    random-permutation control, or
    (d) failing all three, a scoped barrier statement at the
    docs/inventor-protocol.md section 4 standard about a construction that was
    ACTUALLY BUILT AND RUN.
    THE OBJECTIVE IS EXPLICITLY NOT "beat the published reduced-round
    cryptanalysis": that comparison is not adjudicable here and RQ-AES-003 R3
    forbids asserting it in either direction. THE OBJECTIVE IS EXPLICITLY NOT A
    STATEMENT ABOUT FULL-ROUND OR DEPLOYED AES, under any outcome.
  question_ids: [RQ-AES-003]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null

  # ===================================================================
  # WHY THIS GOAL IS SEPARATE FROM GOAL-AES-001, WHICH ALSO COVERS
  # REDUCED-ROUND AES. THE NON-DUPLICATION RULING, IN OPERATIONAL TERMS.
  # ===================================================================
  relationship_to_GOAL_AES_001: >-
    GOAL-AES-001 IS ALSO A REDUCED-ROUND AES CAMPAIGN AND THAT IS NOT GLOSSED
    OVER. The scopes do not duplicate, on three grounds, and the boundary is
    written here so that no future batch has to infer it.
    (1) DIFFERENT MODE AND DIFFERENT DELIVERABLE. GOAL-AES-001 is bound to
    RQ-AES-001, a SCREENING-AND-DERIVATION question about five named propagation
    objects measured against a NAMED BASELINE MECHANISM. This goal is bound to
    RQ-AES-003, an EXECUTION-AND-CERTIFICATION question whose unit of work is a
    working attack program, an independently re-verified certificate and an
    instrumented MEASURED cost, against references (REF-A definitional, REF-B
    self-built, REF-C this campaign's own measured death rounds) that are
    adjudicable inside this repository. GOAL-AES-001 has run FOUR BATCHES AND
    SPENT ZERO CRYPTANALYTIC COMPUTE ON AES ITSELF; this goal's first producer
    task spends it.
    (2) DIFFERENT REFERENCE, AND THIS IS THE LOAD-BEARING ONE. RQ-AES-001's
    decision target is bound to a named-baseline comparison that
    DEC-20260731-011 STRUCK and DEC-20260731-031 ruling 3 ruled UNADJUDICABLE IN
    BOTH DIRECTIONS. Answering the present directive requires replacing that
    reference. Replacing the reference of a committed question under which four
    batches of reviewed evidence (EV-AES-001..004) and two knowledge entries
    (KN-FIND-028, KN-FIND-029) were produced is the retroactive act
    DEC-20260731-031 refused when it opened RQ-AES-002 rather than widening
    RQ-AES-001. The same reasoning gives the same answer here.
    (3) GOAL-AES-001 HAS NO CAPACITY, AND ITS REMAINING CAPACITY IS ALREADY
    COMMITTED ON THE MERITS. maximum_batches is 6 and FOUR ARE SPENT. BATCH-005
    is the LAST batch that may open new research questions and BATCH-006 is
    reserved for consolidation and the terminal record (DEC-20260731-030). Its
    BATCH-005 shape is bound by DEC-20260731-030 to CAND-806-A's
    bounded-index-subgroup residual (rank 1), CTRL-810-A (rank 2), the pre-screen
    reform (rank 3) and D-705-5 hole (i) (rank 4). REDIRECTING THAT BATCH TOWARD
    ATTACK CONSTRUCTION WAS CONSIDERED AND IS REFUSED, on two grounds recorded in
    DEC-20260731-032: it would abandon the exact candidate on which that campaign
    was NOT PAUSED, making the refusal to pause retroactively dishonest by that
    decision's own words; and it would drop CTRL-810-A, which IS HEUR-806-1's own
    validation experiment and which the Coordinator contract requires be paired
    with a conditional result in the same or the FOLLOWING batch — BATCH-005
    being that following batch.
    THIS GOAL THEREFORE DOES NOT PAUSE, CLOSE, SUPERSEDE, RE-SCOPE, RE-BUDGET OR
    REPRIORITIZE GOAL-AES-001. Its status stays `active` at BATCH-004, its single
    next action stands unchanged and unreordered, its 34500 s ceiling and its
    maximum_batches of 6 are untouched, and DEC-20260731-030's ranked BATCH-005
    shape is NOT superseded. No second of its budget is charged here and none of
    this goal's budget is charged there.
    PRIOR WORK IS AN INPUT, NOT A PREMISE. EV-AES-001..004, KN-FIND-028 and
    KN-FIND-029 may be cited here as inputs carrying their original scope
    verbatim and none is upgraded by being cited from this question. Proposition
    806-1 may be cited ONLY at ONE super-box interface, for the F-linear
    round-independent subclass, NEVER as a cost inequality, and never with its
    unnumbered state-quantifier dependence U-809-1 dropped. PROP-701-I and
    Proposition 801-1 are WITHHELD and are NOT citable as established. Section
    5's cost table remains STRUCK.

  relationship_to_GOAL_AES_002: >-
    GOAL-AES-002 is the FULL-ROUND campaign and is untouched: `active`, three
    batches, 22500 s, its single next action (draft, commit and dispatch its
    BATCH-001 queue in the DEC-20260731-031 ranked shape) intact. Its
    non_completion_criteria (iii) already routes reduced-round findings out of
    it; this goal is where the executable ones land, at RQ-AES-001's ceiling,
    which RQ-AES-003 adopts verbatim.
    THE SUBSTANTIVE DIFFERENCE, STATED PLAINLY BECAUSE IT IS THE REASON THIS
    GOAL IS WORTH OPENING AT ALL. GOAL-AES-002 is capped at `analyzed` FOREVER by
    its own R7 and by DEC-20260731-031 ruling 8: a certificate proves a claimed
    solve is real on the instance solved, but it does not validate a cost model,
    and this environment cannot execute at the scale where a full-round cost
    claim would be tested — measured reach 2^42.6 against 2^128
    (MEAS-GOAL-AES-002-001). AT r = 4-6 THAT CAP LIFTS, and the reason is
    specific rather than optimistic: the attack RUNS, the recovered key is
    CHECKED against the target ciphertexts under an implementation independent of
    the attack code, and the cost is MEASURED on the machine that ran it. THIS IS
    THE ONLY AES GOAL IN THIS PROGRAM UNDER WHICH A HYPOTHESIS CAN HONESTLY REACH
    `supported`. What does NOT lift is the CLAIM TIER: every record here is
    `toy`-tier and reduced-round-only, exactly as RQ-AES-001 binds, and no result
    here says anything about full-round or deployed AES.
    THREE ACTIVE AES CAMPAIGNS NOW SHARE ONE MACHINE. max_concurrent 3 is a cap
    ACROSS ALL THREE, not 3 each. If honouring it would require running degraded,
    this goal's batch WAITS.

