  # ===================================================================
  # WHAT COUNTS AS A BREAKTHROUGH HERE. RULED EXPLICITLY.
  # ===================================================================
  what_counts_as_a_breakthrough: >-
    THREE FORMS, RANKED BY INFORMATION CONTENT RATHER THAN BY DIFFICULTY, EACH
    ADJUDICABLE INSIDE THIS REPOSITORY WITH NO LITERATURE. Each is a completion
    criterion below; this block is the ruling that says WHY each counts and what
    each does NOT establish.
    BT-1 — EXECUTED CERTIFIED KEY RECOVERY BEATING THE DEFINITIONAL REFERENCE AT
    ROUND r. The reference is REF-A: 2^(k-1) r-round AES-k evaluations, which
    follows from the key length and the definition of the cipher and needs no
    document. Note what does NOT change with r: THE KEY LENGTH. So REF-A at r = 5
    for AES-128 is 2^127 five-round encryptions, and an executed attack either
    beats it by an enormous margin or not at all — which is exactly why the
    comparison is decidable on a machine whose whole-campaign reach is 2^42.6.
    THIS IS THE FLOOR AND THE ENTRY TICKET, NOT THE CEILING. It is a determinate,
    checkable, certified result and it is very probably a REDISCOVERY — and under
    RQ-AES-003 R3 that expectation, being an unverified recollection, MAY NOT BE
    USED TO DOWNGRADE IT any more than its absence could be used to upgrade it.
    The verdict against REF-A is DETERMINATE; the verdict on novelty is
    INCONCLUSIVE; they are recorded separately and never merged.
    BT-2 — EXECUTED CERTIFIED KEY RECOVERY BEATING A GENERIC BASELINE THIS
    CAMPAIGN IMPLEMENTS AND MEASURES ITSELF AT THE SAME r. This is the strongest
    COMPARATIVE statement available in this environment, and it is real precisely
    because BOTH SIDES ARE BUILT AND RUN IN THIS REPOSITORY on the same machine
    in the same CM-3 unit — the DEC-20260731-031 ruling 6(iii) route, merely
    conceivable at full round and actually affordable here. THE DISCIPLINE THAT
    MAKES IT HONEST RATHER THAN RIGGED, AND IT IS NON-NEGOTIABLE: the baseline is
    implemented, tuned in good faith, and its parameters FROZEN AND COMMITTED
    BEFORE the candidate attack's cost is measured; it is dispatched to a
    DIFFERENT producer task than the candidate; and it is the object an
    independent RED TEAM is specifically tasked to attack, because a baseline
    built badly manufactures the margin. GOAL-AES-001's first red-team pass
    destroyed the campaign's only cost model, and it did so by re-running the
    producer's own code on an untried input (RT-1). A BT-2 result establishes a
    margin against A BASELINE THIS CAMPAIGN BUILT, never against the published
    one, and every sentence stating it says so.
    BT-3 — A NEW DISTINGUISHER SURVIVING BEYOND THIS CAMPAIGN'S OWN MEASURED
    DEATH ROUNDS. This is the form with the most genuine information content,
    because the reference is MEASURED ON THIS MACHINE rather than recalled or
    definitional. The measured wall (REF-C): the full-diagonal 2^32 integral holds
    EXACTLY through r = 4 (16/16 balanced, all-zero accumulator) and is DEAD at
    r = 5 (0/16 for two independent keys, full-entropy accumulators); the 1-byte
    delta-set integral holds through r = 3; the key-indexed influence object is at
    the null from r = 4 by per-cell bias; the linear-structure set CAND-FR-2 died
    at r = 2-4. A DATA-PATH DISTINGUISHER SURVIVING TO r >= 6, OR A KEY-INDEXED
    ONE SURVIVING TO r >= 5, IS STRICTLY BEYOND EVERY OBJECT THIS PROGRAM HAS
    MEASURED, and that is a genuine result AT THIS SCALE adjudicated with no
    literature at all. IT REQUIRES, WITHOUT EXCEPTION: a MEASURED false-positive
    rate against a matched random-permutation control AT THE SAME DATA
    COMPLEXITY; a round-count decay check (a statistic that fails to decay as
    rounds rise is the canonical artifact tell); THE INSTRUMENT'S RESOLUTION
    STATED IN BITS in the same sentence as the claim, because "at the null" has
    already meant "below an instrument ~30 bits too blunt" once in this program
    (RQ-AES-003 R4(1)); and a SIBLING NULL that isolates the property named
    rather than merely discriminating (V-804-1, KN-FIND-029 rule 6).
  what_does_not_count: >-
    RULED EXPLICITLY, BECAUSE EACH IS A TRAP THIS PROGRAM HAS FALLEN INTO OR
    NARROWLY AVOIDED.
    (i) A MODELLED COST. A cost figure that was computed rather than observed is
    an estimate and satisfies nothing. GOAL-AES-001's only cost model was voided
    by its first red-team pass with every entry modelled and peak RSS never
    measured. THIS IS THE SINGLE DISCIPLINE THE WHOLE GOAL TURNS ON.
    (ii) A MARGIN AGAINST A BASELINE THIS CAMPAIGN BUILT BADLY, or one whose
    parameters were chosen after the candidate's cost was known.
    (iii) A DISTINGUISHER WITHOUT its matched random-permutation control at the
    same data complexity, its round-count decay check, its stated instrument
    resolution, and its sibling null. A statistic with NO POWER BY CONSTRUCTION
    read as a closure is an error already made here once.
    (iv) A KEY RECOVERY WHOSE CERTIFICATE IS VERIFIED BY THE ATTACK CODE, or
    whose target key was reachable by the attack code. A failed certificate
    invalidates the run as `invalid_measurement`, never as a negative
    observation.
    (v) ANY CLAIM OF NOVELTY OR NON-NOVELTY against published cryptanalysis, in
    either direction (R3, symmetric).
    (vi) ANY STATEMENT ABOUT FULL-ROUND OR DEPLOYED AES. Transcribing a
    reduced-round margin as a full-round one is a claim-tier violation and is the
    violation this goal is most exposed to.
    (vii) A RELATED-KEY, KNOWN-KEY OR CHOSEN-KEY RESULT, at any margin, on any
    key size, and never one presented without its threat model in the same
    sentence.
    (viii) A REPRODUCIBILITY FACT ABOUT AN INSTRUMENT. A pinned harness, a
    repaired mutation control, a frozen CM-3, a measured throughput receipt and a
    pinned AES-NI path are INFRASTRUCTURE. GOAL-AES-001 spent four batches
    learning to say so and the lesson is inherited, not relearned.
    (ix) A FATIGUE REPORT. A count of screened-and-rejected mechanisms is a
    statement about the search, its honest status is `unverified`
    (docs/inventor-protocol.md section 4), and RT-9 additionally rules that a
    screen verdict of "no upper bound exhibited" reports a fact about the
    PRODUCER under a label that is a predicate on the CANDIDATE. DEFERRED_UNBOUNDED
    is the correct verdict and is kept OUT of any count of rulings.

  completion_criteria:
    - >-
      C1 — EXECUTED, CERTIFIED KEY RECOVERY BEATING REF-A AT ROUND r (BT-1). An
      attack implemented in this repository, RUN TO COMPLETION against a target
      instance generated by a separate process from a declared seed and whose key
      the attack code cannot read, recovering the key; the recovered key
      reproduces the EXACT target ciphertexts at the SAME round count under an
      AES implementation independent of the attack code, re-verified by the run
      wrapper with the attack code excluded from the verification path, under
      pycryptodome and — where the round count admits it — the openssl CLI; and
      the MEASURED end-to-end cost under the COMMITTED CM-3 is strictly below
      2^(k-1) r-round AES-k evaluations, with time from an INSTRUMENTED COUNTER,
      MEASURED peak RSS, counted queries with their kind, and success probability
      MEASURED over a declared number of independent instances, the cost
      normalised by that measured probability and the verification charged.
      REPLICATED over independent seeds and target instances. Every sentence
      stating the margin carries the R5 clause.
    - >-
      C2 — EXECUTED, CERTIFIED KEY RECOVERY BEATING REF-B AT THE SAME r (BT-2).
      C1's certificate and measurement requirements in full, PLUS: a generic
      baseline attack implemented in this repository at the same round count and
      key size, its parameters FROZEN AND COMMITTED BEFORE the candidate's cost
      is measured, produced by a DIFFERENT task than the candidate, RUN on the
      same machine and charged in the same CM-3 unit with the same success
      convention; the candidate's measured cost strictly below the baseline's
      measured cost on the stated Pareto axes with any axis it loses on named in
      the same sentence; and an independent RED-TEAM PASS SPECIFICALLY ON THE
      BASELINE, because a weak baseline manufactures the margin. The result is
      stated as a margin against A BASELINE THIS CAMPAIGN BUILT, never against
      the published one.
    - >-
      C3 — DISTINGUISHER SURVIVING BEYOND REF-C (BT-3). A distinguisher on
      r-round AES that survives at r >= 6 for a data-path object, or r >= 5 for a
      key-indexed object, against this campaign's own measured death rounds
      (MEAS-GOAL-AES-002-002; MEAS-GOAL-AES-002-006 as corrected;
      RUN-FRGATES-20260801-001), carrying: its MEASURED false-positive rate
      against a matched random-permutation control at the SAME data complexity;
      the round-count decay check across r; THE INSTRUMENT'S RESOLUTION IN BITS
      stated in the same sentence as the claim; a SIBLING NULL isolating the
      property named; its data, time and MEASURED memory; and replication over
      independent keys and seeds. Two keys is not a distribution and does not
      satisfy this criterion.
    - >-
      C4 — SCOPED BARRIER STATEMENT AT THE CLOSURE STANDARD, ABOUT A CONSTRUCTION
      THAT WAS ACTUALLY BUILT AND RUN. For a NAMED executed construction: a named
      obstruction, a checkable argument archived as a derivation artifact and
      independently re-worked, and forward guidance naming what remains open —
      docs/inventor-protocol.md section 4. THE QUALIFIER "ACTUALLY BUILT AND RUN"
      IS THE POINT AND DISTINGUISHES THIS FROM GOAL-AES-001's SECOND CRITERION: a
      barrier statement about a construction nobody implemented is a derivation,
      belongs under RQ-AES-001, and does not complete this goal.
    - >-
      C5 — REVIEW ADMISSION, required on top of C1, C2, C3 or C4. Independent
      Validator and Red Team sessions admit the package, checking: certificate
      INDEPENDENCE and re-verification from committed bytes by the reviewer's own
      execution; that the attack code could not read the target key; null-control
      comparability including the round-count decay check, the stated resolution
      and the sibling null; CM-3 charging on BOTH sides with the same unit and
      success convention; that every cost figure is MEASURED and not modelled,
      with peak RSS measured; the round count and key size ACTUALLY tested; the
      absence of uncharged precomputation, memory or data; and the R5
      anti-laundering clause in every sentence stating a margin. A claimed
      breakthrough routes to `review-breakthrough` at max per AGENTS.md rule 12.
      Under RQ-AES-003 R4(3) the ADMISSION MUST REST ON MECHANICAL RE-EXECUTION,
      not on judgemental concurrence between correlated sessions.
    - >-
      C6 — DURABLE ARCHIVE. Coordinator evidence, decision and any warranted
      knowledge entry committed through a VERIFIED ledger archive, pushed, and
      carried by an open PR against `main`, with the conclusion scoped to the
      exact round counts, key sizes, threat model, implementation, seeds and
      budget actually tested.

  pause_conditions:
    - >-
      P1 — BUDGET. The four-batch or 30400 s campaign budget is exhausted without
      an admissible next construction, and no amendment is approved. The goal
      moves to `paused` or `closed_at_budget` with the narrowest supported result
      recorded and exactly one next action preserved.
    - >-
      P2 — THE HONEST ONE. EVERY CONSTRUCTION THIS CAMPAIGN BUILT AND RAN FAILED
      TO BEAT ITS DECLARED REFERENCE, AND NO DISTINGUISHER SURVIVED PAST REF-C.
      Stated as a pause because it is the most likely outcome and it must not be
      dressed up as anything else on arrival. WHAT THIS PAUSE ASSERTS: NOTHING
      ABOUT AES beyond the exact constructions built, at the exact rounds tested,
      at this budget, with this instrument, in this environment. It is NOT a
      barrier statement, NOT a closure, and NOT evidence that reduced-round AES
      resists — and it must never be transcribed as any of those. Constructions
      considered but not built are named OPEN AND UNATTEMPTED and are NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8). Under
      docs/inventor-protocol.md section 4 an exhausted candidate pool is a FATIGUE
      REPORT whose honest status is `unverified`.
    - >-
      P3 — INFRASTRUCTURE. A definitive infrastructure or dependency blocker
      prevents the next approved task. This includes BLK-1 remaining unresolved
      (no conforming run may emit an AES key-recovery certificate, which is this
      goal's PRIMARY success mode), the AES-NI path failing to pin across
      r = 3-7, and an unmeasured memory-bound envelope blocking a table-based
      construction. A blocker is infrastructure signal, NEVER negative
      mathematical evidence (AGENTS.md rule 5).
    - >-
      P4 — COST. The decisive construction's cheapest EXECUTABLE instance exceeds
      the measured envelope (2^38.8 AES evaluations per producer task; ~15 GB;
      four-core scaling unmeasured). Recorded as OUT OF ENVELOPE and named, never
      estimated into a result.
    - >-
      P5 — SUCCESS WHOSE NOVELTY CANNOT BE ADJUDICATED HERE. A result meets C1,
      C2 or C3 and survives review. THIS DOES NOT PAUSE THE GOAL AT `analyzed`,
      AND THE DIFFERENCE FROM GOAL-AES-002's P5 IS THE WHOLE POINT OF THIS
      CAMPAIGN: the verdict against REF-A / REF-B / REF-C is EXECUTED, CERTIFIED
      AND MEASURED here, so the supporting hypothesis may reach `replicated` and
      `supported`, scoped to the tested rounds. WHAT IS RECORDED AS
      `inconclusive`, SEPARATELY AND NEVER MERGED INTO THE VERDICT, IS NOVELTY
      AGAINST THE PUBLISHED FRONTIER, which is unadjudicable here in both
      directions. `completed` still requires the quorum in
      completion_reachability below.
    - >-
      P6 — CONTRADICTION. Any result here that would contradict a committed
      RQ-AES-001 or RQ-AES-002 evidence record, or that could only be stated by
      relaxing RQ-AES-001's claim_tier_ceiling. The goal pauses and the resolution
      is a superseding record under a new id, never an edit to a committed record
      and never a reinterpretation of that ceiling.

  completion_reachability: >-
    STATED AT THE OPENING RATHER THAN DISCOVERED AT THE CLOSE, AND THE
    DISTINCTION IT DRAWS IS THIS GOAL'S CENTRAL DESIGN CLAIM.
    `status: completed` on the GOAL record requires, under AGENTS.md rule 13 and
    CLAUDE.md rule 8, three CONCUR attestations with PAIRWISE-DISTINCT
    resolved_model_id. Under inference-amendment-TASK-20260731-602 (commit
    0137a051) cross-model independence is unavailable campaign-wide in this
    harness: every producer, validator, red team and Coordinator resolves to the
    same model, so a validator CONCUR plus a red-team CONCUR is ONE DRAW FROM A
    CORRELATED PAIR, NOT TWO. THEREFORE `completed` IS UNREACHABLE FOR THIS GOAL
    unless the dispatching session deliberately routes three different backends.
    No `completion_quorum` block is created here and none may be created until
    three distinct resolved models are actually available; no attestation may be
    recorded that was not obtained.
    WHAT IS REACHABLE, AND WHAT GOAL-AES-002 CANNOT REACH: a HYPOTHESIS under
    this goal may reach `replicated` and `supported`. Those are different objects
    from goal closure and are governed by evidence rather than by quorum.
    GOAL-AES-002's cost claims are capped at `analyzed` because no full-round cost
    claim can be tested at 2^42.6 of reach; here the attack runs, the key is
    checked under an independent implementation, and the cost is measured on the
    machine that ran it. If a completion criterion is met without the goal-closure
    quorum, the honest transition is `paused` with the supported hypothesis
    recorded at its exact tier and scope and the closure quorum named as
    outstanding — never `completed`, and never `closed_at_budget` used to retire a
    goal that DID meet a criterion, which is a contract violation.

  saturation_stance: >-
    THE PRIOR IS AGAINST AND IS STATED PLAINLY IN RQ-AES-003's motivation rather
    than discovered later as a disappointment: reduced-round AES is heavily
    studied, the 4-6 round frontier is a mature literature, and the odds of a
    genuine improvement are low. THEY ARE FAR BETTER THAN FULL-ROUND, improvements
    at 5-7 rounds are still published, and — decisively — THIS ENVIRONMENT CAN
    ACTUALLY TEST. The campaign proceeds because PREMATURE CLOSURE IS A FAILURE
    MODE SYMMETRIC WITH OVERCLAIMING (CLAUDE.md; docs/inventor-protocol.md
    section 4), because "the 4-6 round space is mined" is a hypothesis about the
    search whose honest status is `unverified`, and because the incident that
    motivated the inventor protocol (KN-LIT-7594) is a model declining AES
    cryptanalysis on exactly these grounds immediately before improving a
    best-known attack. BOTH FACTS ARE HELD BY PROCEDURE: the off-limits family
    list binds the NOVEL arm while the BASELINE arm is deliberately built from
    known constructions; matched and sibling nulls before belief; measured rather
    than modelled cost; independently re-verified certificates; and a claim-tier
    ceiling under which converting a reduced-round margin into a full-round or
    published-frontier statement is a recorded violation rather than an available
    shortcut.

  claim_tier_ceiling: >-
    GOVERNED BY RQ-AES-003's claim_tier_ceiling R1-R6, adopted here in full and
    not restated in weaker words. In brief, never to be read as a replacement:
    `toy` tier for EVERY record under this goal, without exception and regardless
    of outcome, exactly as RQ-AES-001 binds; reduced-round only, with no statement
    about full-round or deployed AES under any outcome; the three references are
    REF-A (definitional at round r), REF-B (self-built and self-measured) and
    REF-C (this campaign's own measured death rounds); NO relation to the
    published state of the art may be asserted in EITHER direction, with
    `dominated_by` recorded as unresolvable-in-this-environment and never `null`;
    a MODELLED cost claim is capped at `analyzed`; and no universal impossibility
    claim may be made from bounded search here.

  corrections_carried_forward: >-
    THREE, ADOPTED SO THIS GOAL DOES NOT INHERIT BROKEN REASONING, EACH BINDING,
    EACH CITED RATHER THAN RESTATED IN FULL (RQ-AES-003 R4).
    (1) THE INFLUENCE-DENSITY CLOSURE IS WITHDRAWN AS STATED. The density
    statistic has NO POWER BY CONSTRUCTION — a pure random function measures
    0.4995 against the AES reading of 0.4996 — and a controlled null was read as
    a closure. The key-indexed object dies at r = 4 by per-cell BIAS, not at r = 3
    by density. The original receipt is not edited;
    CORRECTION-influence-and-O3.json (MEAS-GOAL-AES-002-006) is the correction of
    record. THE RESIDUAL BINDS EVERY DISTINGUISHER CLAIM HERE: the bias probe
    resolves to ~2^-8.8 per cell against a relevant threshold of 2^-40, so "at the
    null" means "below an instrument about 30 bits too blunt", and every
    death-round and distinguisher claim states its instrument's resolution in bits
    in the same sentence.
    (2) THE O-3 CEILING'S PREMISE IS MEASURABLY FALSE AND ITS CONCLUSION SURVIVES
    ON MEASURED GROUNDS. Measured mu FALLS 194.4 -> 125.2 -> 12.3 against a
    pre-registered discriminator that it should RISE, capped analytically at
    2^15.64 (MEAS-GOAL-AES-002-006); the conclusion is re-established because full
    16-byte states are FULLY DISTINCT across the coset at every round with zero
    collisions (MEAS-GOAL-AES-002-007) and sharing exists ONLY at byte granularity
    (MEAS-GOAL-AES-002-008). THE 7.64-BIT FIGURE MAY NOT BE CITED AS THE
    JUSTIFICATION FOR THE BOUND anywhere under this goal, and the bound is scoped
    to affine master-key cosets at d <= 12 with four coordinate projections.
    (3) PROMOTION GATE (4)'s INDEPENDENT-CONFIRMATION HALF IS STRUCTURALLY
    UNSATISFIABLE UNDER THIS HARNESS (RT-13; DEC-20260731-029; not re-scoped by
    DEC-20260731-030 and not re-scoped here). NO PROMOTION UNDER THIS GOAL MAY
    REST ON IT. The operative consequence is in
    provenance_and_review_gates.independent_review_chain: mechanical re-execution
    carries weight, judgemental concurrence between correlated sessions does not.
    A FOURTH, CARRIED AS A SCREEN RULE: RT-9's ruling that "no upper bound
    exhibited" is a fatigue report and not a vacuity verdict, together with the
    five pre-screen reforms DEC-20260731-029 required — rename it a
    LAYER-DEPENDENCE screen; the TASK-20260801-807 interface-counting rule;
    DEFERRED_UNBOUNDED kept OUT of any count of rulings; n = 1 IS NOT A LICENCE
    and needs a separate explicit tractability judgement; and the ~7 threshold
    restated against the quantity it actually bounds.

