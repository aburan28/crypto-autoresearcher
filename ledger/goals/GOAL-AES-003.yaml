    total_wall_clock_seconds: null
    total_wall_clock_seconds_amendment_20260803: >-
      RAISED TO null (NO CAP) by protocol-amendment-GOAL-AES-003-002, on the
      USER'S EXPLICIT DIRECTION of 2026-08-03 to pursue a batch count. THE
      JUSTIFICATION IS THE TARGET AND NOT THE EVIDENCE, and the amendment says so
