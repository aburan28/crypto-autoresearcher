    total_wall_clock_seconds_history:
      - value: 30400
        in_force_until: '2026-08-03'
        note: Superseded by the 2026-08-03 user direction. Sized bottom-up from measured per-role actuals.
    accounting_basis: measured_wall_clock_of_completed_tasks
    max_concurrent: 3
    sizing_basis: >-
      BOTTOM-UP FROM GOAL-AES-001's MEASURED PER-ROLE ACTUALS, at or near each
      role's observed maximum, with NO cushion and NO rounding slack — the
      discipline of protocol-amendment-GOAL-AES-001-005 Part A, adopted at this
      campaign's opening rather than after three budget acts. Per-role lines:
      executor producer 1600 (observed 792 / 892 / 1609 / 1510); snapshot archive
      500 (observed 378, one datum); independent validation 1400 (observed
      1046 / 1370); red team 1000 (observed 668 ONCE — one task is not a
      distribution, and sizing to the single low observation is the error
      amendment 005 exists to stop making); ledger archive 900; coordination act
      600-900.
      BATCH-001 8800 = coordination-and-protocol act 900 + queue drafting 700 +
      two concurrent producers 3200 + snapshot 500 + validation 1400 + red team
      1000 + ledger archive 900.
      BATCH-002 7700 = queue drafting 700 + two concurrent producers 3200 +
      snapshot 500 + validation 1400 + red team 1000 + ledger archive 900.
      BATCH-003 7700 = same shape as BATCH-002.
      BATCH-004 6200 = queue drafting 600 + one producer 1600 + snapshot 500 +
      validation 1400 + red team 1000 + ledger archive and terminal record 1100.
      8800 + 7700 + 7700 + 6200 = 30400 EXACTLY. There is no rounding, no slack
      and no contingency; the per-role maxima ARE the contingency.
      COMPUTE FITS INSIDE THE PRODUCER LINE AND IS NOT A SEPARATE LINE, AND THAT
      IS A MEASURED CLAIM RATHER THAN AN ASSUMPTION: the measured reach is
      2^38.81 AES evaluations per 1600 s task at 7.555e7 enc/s single core, and a
      full-diagonal 2^32 integral sweep measured 53 s (MEAS-GOAL-AES-002-001,
      -002). Under C4 the compute component is reported SEPARATELY in its own
      field, because GOAL-AES-001's two budget overruns were AUTHORING (67 s and
      ~254 s of compute against 1609 s and 1510 s elapsed) and this is the first
      AES campaign whose producers spend real compute; the two must never again
      be conflated.
    why_four_batches: >-
      FOUR, WITH THE LAST RESERVED, AND THE ARITHMETIC OF THAT IS THREE RESEARCH
      BATCHES. That is one more research batch than GOAL-AES-002 was given, and
      the ground is specific rather than enthusiasm: this is the only AES goal
      whose success mode is EXECUTABLE AND CERTIFIABLE HERE, so a batch spent
      here can produce a determinate verdict rather than a derivation. BATCH-001
      is protocol and instrument (BLK-1, CM-3, pinning the AES-NI path) plus the
      first construction; BATCH-002 is construction and execution; BATCH-003 is
      replication, adversarial review and the distinguisher push past REF-C;
      BATCH-004 is consolidation and the terminal record and MAY NOT OPEN NEW
      RESEARCH QUESTIONS. A FIFTH BATCH REQUIRES A VERSIONED AMENDMENT ON THE
      MERITS OF WHAT THE FIRST FOUR ACTUALLY PRODUCED, which is a better decision
      point than pre-authorising work whose value is unknown.
    what_a_red_team_should_attack_here: >-
      NAMED BY THIS COORDINATOR AGAINST ITSELF, since a rationale naming no
      attack surface is not a rationale.
      (1) 30400 s FOR A THIRD CONCURRENT AES CAMPAIGN IS THE HARDEST LINE TO
      DEFEND. GOAL-AES-001 has 15042 s remaining and GOAL-AES-002 has 22500
      unspent; opening a third with 30400 puts roughly 68000 s of AES budget in
      flight at once, on a machine with four cores and a concurrency cap of 3
      shared across all of them. The answer offered is that this is the only one
      of the three that can reach a determinate verdict, and that the honest
      alternative — pausing one of the others — was considered and refused on the
      merits recorded in DEC-20260731-032 rationale item 4. That answer is only
      as good as this campaign's first executed run turns out to be.
      (2) BATCH-001 MAY BE CONSUMED ENTIRELY BY PROTOCOL AND INSTRUMENT WORK.
      BLK-1, CM-3 and pinning the AES-NI C path across r = 3-7 are three gating
      artifacts, and GOAL-AES-001's experience is that protocol and instrument
      work consumes whole batches. THE MITIGATION IS STRUCTURAL AND IS THE ONE
      GOAL-AES-001 LACKED: the protocol act costs no producer slot and runs first
      in time, and BOTH BATCH-001 producer slots are research producers, so a
      batch consumed by protocol would be a scheduling failure with a named
      cause, not an expected outcome.
      (3) THE PER-ROLE FIGURES ARE BORROWED FROM ANOTHER GOAL'S CAMPAIGN and
      three of them (snapshot, ledger, coordination) rest on declarations no
      clock ever tested. This goal has no measured data of its own.
      (4) THE PRODUCER LINE OF 1600 s WAS MEASURED ON AUTHORING-HEAVY TASKS THAT
      SPENT ALMOST NO COMPUTE. This campaign's producers write code, run it, and
      write it up. 1600 s may be the wrong number in the new direction, and the
      first batch is where that will show. Under C3 a producer that discharges
      its stamp duty has complied in full even if the charged figure exceeds the
      declaration, and any residual is a campaign-side accounting fact.

  # ===================================================================
  # ACCOUNTING, CLOCK AND PROVENANCE: INHERITED BY EXPLICIT ADOPTION.
  # ===================================================================
  budget_accounting:
    basis: measured_wall_clock_of_completed_tasks
    inheritance_basis: >-
      ADOPTED BY EXPLICIT REFERENCE AT THIS GOAL'S CREATION, AND THE DISTINCTION
      MATTERS: protocol-amendment-GOAL-AES-001-003 and -005 are scoped to
      GOAL-AES-001 and bind no other goal automatically. This record ADOPTS
      amendment 003's measured-clock accounting basis; amendment 005 Part B C1-C6
      in full; amendment 005 Part A's coordination-act charging fix; and the
      artifact-provenance gate of amendment 004 Part B AS CORRECTED by amendment
      005 Part C. They are in force from BATCH-001 and require no amendment here.
      Precisely the same adoption GOAL-AES-002 made, for the same reason.
    clock_convention: >-
      protocol-amendment-GOAL-AES-001-005 Part B, C1 THROUGH C6, ADOPTED VERBATIM
      AND IN FORCE FROM BATCH-001. (C1) CHARGED CLOCK: SESSION ELAPSED,
      authoring-inclusive, first act to terminal receipt, dispatcher-observed;
      compute seconds are NOT the charged clock. (C2) STOP-CONDITION CLOCK: the
      producer's own COMMITTED UTC STAMPS — a first-act stamp carrying start_utc,
      start_epoch, declared_wall_clock_seconds and a COMPUTED binding_stop_utc; a
      stamp at every major section boundary carrying utc, elapsed_s and a marker;
      a HALT at binding_stop_utc with halted_on_budget recorded truthfully and
      the dropped work NAMED; the stamps COMMITTED as a declared artifact. The
      TASK-20260801-810 budget block is the reference implementation. A halt is
      INFRASTRUCTURE SIGNAL, never a negative mathematical result (AGENTS.md rule
      5), and dropped work is SCOPE, never an answer (rule 8). (C3) DISCHARGING
      C2 IS FULL COMPLIANCE even where the charged figure later exceeds the
      declaration; any residual is a campaign-side accounting fact and NEVER a
      producer defect; correspondingly a producer may NOT offer compute seconds
      as budget compliance. (C4) Declarations are calibrated against
      AUTHORING-INCLUSIVE elapsed with the COMPUTE COMPONENT REPORTED SEPARATELY
      IN ITS OWN FIELD — load-bearing here, since this is the first AES campaign
      whose producers spend real compute. (C5) The charged figure is the LARGEST
      session-elapsed figure on the record from any source; every other figure is
      preserved marked `on_record_not_charged` with its source named; no spread
      is resolved silently and no figure is deleted; producer stamps GOVERN THE
      TIMELINE while the largest-figure rule GOVERNS THE CHARGE, on the stated
      mechanism that a stamp ends at the final write and cannot cover the task's
      tail. (C6) An unmeasured completed task is charged at its DECLARED budget,
      never at zero, and a recurrence is a defect against the campaign's
      instrumentation rather than against the producer.
    coordination_acts_are_charged_from_batch_001: >-
      EVERY COORDINATION ACT IS A DISPATCHED, BUDGETED, CHARGED QUEUE TASK FROM
      BATCH-001. GOAL-AES-001 discovered at its fifth batch that queue drafting,
      amendment authoring and decision taking had been charged at ZERO for four
      batches, leaving an under-count it recorded as UNQUANTIFIED AND
      UNRECOVERABLE. The BATCH-001 sizing above carries two such lines
      explicitly.
    declared_budgets_remain_binding: >-
      Declared per-task budgets are stop conditions, not estimates. A task that
      reaches its declared handoff.budget.wall_clock_seconds HALTS, and that halt
      is infrastructure signal, never a negative mathematical result.
    charged_to_date: 0
    charged_to_date_basis: >-
      ZERO, AND IT IS AN HONEST ZERO ONLY UNTIL THIS RECORD IS COMMITTED. No
      GOAL-AES-003 task has been dispatched and no batch exists. The Coordinator
      act that authored RQ-AES-003, this record and DEC-20260731-032 was NOT
      dispatched as a queue task, because no queue can exist before the goal does.
      It is the ONE act of this campaign performed outside the charging regime,
      it is named here rather than hidden, its duration is UNMEASURED, and it is
      recorded as an UNQUANTIFIED OPENING UNDER-COUNT OF EXACTLY ONE ACT in the
      direction that favours this campaign. It is not reconstructed:
      reconstructing a duration nobody recorded would be fabrication (AGENTS.md
      rule 9). From BATCH-001 onward the regime is exceptionless.
    measurement_provenance: >-
      Measured figures are per-task durations REPORTED BY THE DISPATCHING
      SESSION. There is no instrumented timer in this repository. Committed UTC
      stamps are PRODUCER ATTESTATION, not a mechanism — the V-804-2 lesson
      applies unchanged: a producer-written timestamp is a string the producer
      wrote. Part B makes the timeline READABLE AND CONSISTENT, not PROVEN.
      NOTE THE ONE PLACE THIS CAMPAIGN IS DIFFERENT AND BETTER OFF: the ATTACK's
      cost is NOT charged on this clock. It is charged on an instrumented counter
      inside the executed run plus measured peak RSS (CM-3 (b), (f)), which IS
      re-derivable from committed artifacts by an independent session. The
      campaign's budget accounting is attested; its research measurements are not.
    standing_limit: >-
      THE CEILING IS REAL AND BINDS. 30400 s of MEASURED wall clock across at
      most 4 batches. IF MEASURED CONSUMPTION APPROACHES 30400, OR IF THE FOURTH
      BATCH CLOSES, A FURTHER AMENDMENT IS REQUIRED to continue; reaching either
      without one fires pause condition P1 and this goal moves to `paused` or
      `closed_at_budget`. An overrun is not a research result.

  provenance_and_review_gates:
    artifact_provenance_gate: >-
      IN FORCE FROM BATCH-001, adopted from protocol-amendment-GOAL-AES-001-004
      Part B AS CORRECTED BY amendment 005 Part C, so this campaign never issues
      cards under clauses already known to be defective. (i) Every declared
      source-code artifact carries a comment-block inference stanza in its own
      text. (ii) AT LEAST ONE machine-readable manifest per task, DESIGNATED THE
      COVERING MANIFEST by the task's card and by the manifest itself, carries an
      artifact_provenance list covering EVERY declared artifact of the task;
      every other manifest of the task appears as an ENTRY in it; a
      self-referential digest is impossible and is recorded as SELF. (iii) The
      `kind` vocabulary is CLOSED and CASE-INSENSITIVE — SOURCE_CODE,
      MACHINE_READABLE_MANIFEST, PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD —
      matched ignoring underscore/hyphen/space differences; any machine-readable
      structured-data artifact resolves to MACHINE_READABLE_MANIFEST; a value
      outside the vocabulary is a DEFECT TO REPORT, never a fifth class to invent.
    independent_review_chain: >-
      UNCHANGED FROM GOAL-AES-001 AND NOT RELAXED, AND TIGHTENED IN ONE PLACE.
      Every claim-relevant producer task has a dependent independent Validator
      task and, where a result could change a claim, an independent Red Team task.
      The Coordinator records an official decision only after those reports exist
      as committed artifacts. A claimed breakthrough, a closure result, or a
      contradiction between validated evidence records routes to
      `review-breakthrough` at max effort per AGENTS.md rule 12, which may not be
      degraded.
      THE TIGHTENING: because gate (4)'s independent-confirmation half is
      STRUCTURALLY UNSATISFIABLE under this harness (RT-13; DEC-20260731-029,
      unchanged by DEC-20260731-030), NO PROMOTION HERE MAY REST ON JUDGEMENTAL
      CONCURRENCE BETWEEN CORRELATED SESSIONS. What carries weight is MECHANICAL
      RE-EXECUTION by a session that did not author the artifact: re-run the
      certificate verifier from committed bytes, re-run the attack from its
      committed seed and reproduce its counter, recompute the digests,
      re-implement the baseline's cost count from scratch. The certificate
      discipline is what makes this campaign less exposed to that structural gap
      than its predecessors: a certificate is CHECKED, not agreed with.
    instrument_inheritance: >-
      The GOAL-AES-001 harness is reused WITH its declared defect set attached and
      NOT reset: H-2, H-4 (irreducible), ER-5, ER-7, ER-8, V-804-4, V-804-5 and
      the KN-FIND-029 escape classes. KN-FIND-029's practice rules bind every
      instrument built here — a green states its covered cells or it states
      nothing; a repair is proved by execution, never by reading the new task set;
      coverage escapes are closed BY CONSTRUCTION from the module's own declared
      parameter domain and never by enumerating one more axis; the evasion class
      is DECLARED OUT of the threat model on a stated ground and that declaration
      is written into any certificate relying on the instrument; a null control
      must ISOLATE the property it names and the SIBLING NULL is built before the
      label is believed. KN-FIND-029 practice rule 4 is specifically live here: a
      structured key/plaintext can whiten to a constant state on which MixColumns
      is the identity, so every fault or property confirmation uses multiple
      random vectors and never one structured vector.
      THE AES-NI C PATH IS AN UNPINNED SECOND INSTRUMENT and no measurement may
      be charged to it until it agrees with the pinned harness across r = 3-7 and
      with FIPS-197 at full round, with a machine-readable receipt.

