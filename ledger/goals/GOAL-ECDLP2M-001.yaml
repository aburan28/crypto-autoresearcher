research_goal:
  id: GOAL-ECDLP2M-001
  title: >-
    Characteristic-2 ECDLP index-calculus and descent search over binary extension fields
  objective: >-
    Systematically investigate whether elliptic-curve discrete logarithms over
    binary extension fields E/F_(2^m) admit practical or asymptotic improvements
    over generic rho by exploiting structures unavailable, weaker, or differently
    expressed over prime fields. Treat index calculus as a family of mechanisms,
    not a single algorithm: factor-base decomposition via summation polynomials,
    Weil/GHS descent, Frobenius and subfield orbit structure, trace-zero and
    restriction-of-scalars representations, binary polynomial-basis and normal-basis
    effects, low-degree function-field relations, and hybrid algebraic/coding
    formulations are all in scope. Every candidate must be benchmarked end-to-end,
    with relation probability, decomposition cost, Groebner/SAT/elimination cost,
    linear algebra, descent, preprocessing, memory, and verification charged.
    Positive toy behavior is hypothesis-generating only; promotion requires a
    scaling law that survives independent curves and is compared against generic rho.
  question_ids:
    - RQ-QSP-f9bbdb
    - RQ-BINSTD-b6f698
    - RQ-CERTBIN-836ce2
    - RQ-NISTBIN-06157b
    - RQ-OAKLEY-264353
  question_ids_note: >-
