    - id: RQ-FROB-7d8dd4
      status: CANDIDATE ADOPTION -- NOT ADOPTED BY THIS ARCHIVE
      relation: >-
        Frobenius exploitation in subfield-curve index calculus. Squarely inside
        this goal's declared scope (primary_mechanism_families names
        "Frobenius-orbit and subfield-orbit relation generation" and
        "normal-basis versus polynomial-basis representation effects"), a
        declared ECC area in orchestration/research-priority.yaml, and -- like
        RQ-QSP-f9bbdb before this archive -- attached to no goal.
      why_not_adopted_now: >-
        OTHER SESSIONS HOLD ACTIVE FROB EXPERIMENTS. Adopting a question whose
        experiments another lane is running would put two owners on one line and
        risk a collision in exactly the shared state
        docs/concurrent-goal-lanes.md exists to keep writers out of. The cost of
        waiting is one batch; the cost of colliding is an immutable record with
        two owners.
      recheck: >-
