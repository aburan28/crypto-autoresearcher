  scope:
    field_family: "binary extension fields F_(2^m)"
    curve_family: >-
      Ordinary binary elliptic curves by default; supersingular or special families
      may be used only as explicit controls unless a mechanism is claimed to extend
      to ordinary cryptographic curves.
    primary_mechanism_families:
      - summation-polynomial point decomposition and index calculus
      - GHS / Weil descent and restriction of scalars
      - Frobenius-orbit and subfield-orbit relation generation
      - trace-zero and related subvariety encodings
      - normal-basis versus polynomial-basis representation effects
      - SAT, Groebner, XL, resultant, and hybrid algebraic solvers
      - large-prime and batch-relation variants
      - algebraic-geometry-code or sparse-syndrome reformulations when binary structure is essential
  non_duplication:
    - >-
      GOAL-ECDLP-001 owns the prime-field ECDLP breakthrough search. Results from
      characteristic 2 are not evidence for prime fields unless a transfer theorem
      is stated and independently validated.
    - >-
      GOAL-DREG-001 may own generic degree-of-regularity instrumentation and solver
      methodology. This goal owns the binary-field ECDLP question and must import
      DREG tooling without duplicating its general claims.
    - >-
      Special binary curves with known weak structure are positive controls, not
      evidence about generic ordinary binary curves.
  completion_criteria:
    - >-
      Establish reproducible baselines for generic rho and at least two index-calculus
      families on multiple binary-field sizes and independent ordinary curves.
    - >-
      Reproduce at least one known characteristic-2 structural speedup or descent
      phenomenon as a positive control, with all assumptions and field representation
      choices recorded.
    - >-
      Measure decomposition probability and fully charged relation cost separately,
      including failed solves and preprocessing.
    - >-
      Run Frobenius-orbit and subfield-structure ablations that compare orbit-aware
      factor bases against size-matched coordinate-only controls.
    - >-
      Run solver crossovers on the same decomposition instances using at least two
      algebraic representations or solver families where feasible.
    - >-
      Fit scaling laws across increasing m and reject any apparent speedup that
      disappears under independent-curve, representation, or full-cost controls.
    - >-
      Independent Validator and Red Team review any promoted claim, explicitly
      checking for hidden special-curve assumptions, uncharged preprocessing,
      oracle-like factor-base selection, and extrapolation from tiny fields.
  negative_controls:
    - random size-matched factor bases
    - coordinate-only factor bases with no scalar information
    - ordinary curves without targeted subfield structure
    - basis changes between polynomial and normal representations
    - independently selected targets rather than constructed decomposable targets
  first_experiments:
    - id: EXP-ECDLP2M-001
      objective: >-
        Build a small exact benchmark matrix over several F_(2^m) sizes comparing
        generic rho, summation-polynomial decomposition, and solver cost under
        polynomial-basis and normal-basis representations.
    - id: EXP-ECDLP2M-002
      objective: >-
        Measure whether Frobenius-orbit-aware factor bases improve relation yield or
        decomposition cost beyond size-matched controls, charging orbit construction
        and deduplication.
    - id: EXP-ECDLP2M-003
      objective: >-
        Reproduce a GHS/Weil-descent positive control on a deliberately favorable
        toy family, then move one structural assumption at a time toward ordinary
        binary curves and record exactly where the advantage disappears.
  promotion_metric: >-
    Primary metric is fully charged expected work per new independent relation and
    per fresh-target descent, expressed both in measured operations and fitted
    exponent versus field/group size. No relation-count or solver-runtime metric may
    be promoted in isolation.
  pause_conditions:
    - >-
      A required exact model policy cannot be resolved and the handoff forbids
      fallback or degradation.
    - >-
      A required snapshot or ledger archive fails exact-path, hash, parent, or
      reachability verification.
    - >-
      Missing or unverifiable solver, curve, or field-representation dependencies
      prevent the exact planned task.
    - >-
      The remaining candidate frontier has no ranked, auditable next action; under
      unlimited ECC budget this records an impediment and never retires the goal
      on estimate exhaustion alone.
  next_action: >-
    Start EXP-ECDLP2M-001. Use small ordinary curves where exhaustive verification is
    possible, freeze curve-selection and factor-base rules before target generation,
    and record representation-specific solver metrics. In parallel, prepare the
    GHS/Weil-descent positive control so the harness can distinguish 'implementation
    cannot see known binary structure' from 'candidate structure provides no gain.'
