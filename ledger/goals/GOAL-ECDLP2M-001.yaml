    A SCOPING AMENDMENT TO THE 2026-09-07 TEXT, WHICH IS A STATEMENT ABOUT THE TARGET
    AND NOT A NEW RESULT. That text calls for preparing a GHS/Weil-descent positive
    control "so the harness can distinguish 'implementation cannot see known binary
    structure' from 'candidate structure provides no gain'". At this goal's operative
    target -- ECC2K-130 over F_(2^131), the object of RQ-QSP-f9bbdb -- n = 131 is PRIME.
    The GHS/Weil-descent family reaches composite extension degrees, where a proper
    subfield exists to descend to; it does not reach a prime n. So at n = 131 that
    control tests THE INSTRUMENT -- that the harness can see binary structure where
    binary structure is known to be -- and is not a candidate attack on the target, and
    must not be reported as one. THIS IS A SCOPE STATEMENT ABOUT WHERE THE CONTROL
    APPLIES. It asserts nothing about whether GHS/Weil descent works where it does
    apply, nothing about composite n, nothing about EXP-ECDLP2M-003's value as an
    instrument check (which is undiminished and is why the control is retained rather
    than struck), and it is not evidence about any curve. The 2026-09-07 text is left
    exactly as written because it is the ranking that authorised the control.

    THE OPERATIVE NEXT ACTION, AND THERE IS EXACTLY ONE: dispatch TASK-20260918-53664e
