  adoption_note: >-
    THIS GOAL ADOPTS A CAMPAIGN THAT WAS CONDUCTED BEFORE IT EXISTED, AND THE
    ADOPTION IS CUSTODIAL.
    Established by audit on 2026-09-18 and recorded in DEC-20260918-7e0865: the
    whole of RQ-QSP-f9bbdb ran under NO goal and NO batch -- the question record
    itself says so in its own `related.goal_note`, which anticipates exactly this
    archive. The adopted set, listed so a later reader can see precisely what was
    orphaned: RQ-QSP-f9bbdb; the hypotheses H-QSP-411d8f, H-QSP-5540d7 and
    H-QSP-645a07; the experiments EXP-QSP-33b442 (7 runs) and EXP-QSP-82a906
    (5 runs); the evidence record EV-QSP-a6aa4b; and the five DEC-20260917-*
    decisions of that line, of which DEC-20260917-793ae2 is the evidence-review
    transition.
    WHAT ADOPTION DOES: it gives that work an owner, a batch and a ranked queue,
    so the next action on it is visible at a goal head rather than only inside a
    decision's next_actions list.
    WHAT ADOPTION DOES NOT DO, stated because a custodial act that is read as a
    scientific one is the failure mode here: it changes NO status, NO claim and
    NO evidence of any adopted record; it re-approves nothing; it does not
    re-open, ratify, extend or narrow DEC-20260917-793ae2's scoped negative,
    which stands exactly as that decision wrote it ("the 732 enumerated
    candidates and nothing else"); it discharges none of this goal's completion
    criteria, which all require measurements this goal has not taken; and it
    does not make the adopted runs evidence for anything they were not already
    evidence for. Every adopted record remains immutable and is not edited by
    this archive.
    OPEN ITEMS OF THE ADOPTED CAMPAIGN ARE NOT RE-HOMED EITHER. DEC-20260917-793ae2's
    next actions NA-2 through NA-5, NA-9 and NA-10 remain owned where they were
    recorded; this goal's own next_action names exactly one of them
    (the IDEA-20260916-3f7a1c design, which no NA covered) and claims no other.
