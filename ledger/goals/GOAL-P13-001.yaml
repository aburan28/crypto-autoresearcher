      status: closed
      closed_by: DEC-20260802-611354
      closed_at: "2026-08-03"
      inference_amendment: INFAMEND-20260802-P13-002
      artifacts:
        frozen_contracts:
          - experiments/EXP-HEUR-d640d9/specification.yaml
          - experiments/EXP-PEC-d7979c/specification.yaml
        frozen_contract_commit: dfe285d4c4239d0a7d1e7490e7f4b27e409484fb
        runs:
          - RUN-HEUR-d640d9-a
          - RUN-PEC-d7979c-b
        quarantined_infrastructure_record: RUN-PEC-d7979c-a
        run_package_commits:
          - 64238edc876221e74949449dc5df20c03e041675
          - 11b086d960dee2e8bd44f78aab291c9903e25499
        validation: VAL-20260803-cd08cd (TASK-20260802-cd08cd)
        red_team: RT-20260802-44c6a2 (TASK-20260802-44c6a2)
        bibliographic: TASK-20260802-79a3cd
        evidence: EV-PEC-7d8de9
        knowledge: KN-FIND-7f2a1c
      outcome: >-
        THE CONTROLS RAN AND THREE OF FOUR MEASURED THE INSTRUMENT RATHER THAN THE
        OBJECT. That is the batch's result, and it is a real one.
        EXECUTED: the frozen EXP-HEUR-d640d9 protocol over 299 completely enumerated
        primes 11 <= p <= 1999 and 13834 conjugacy classes, and the frozen
        EXP-PEC-d7979c closeout at three primes on the pre-registered new ell grid.
        Both contracts byte-unchanged since dfe285d4; both snapshot commits verified
        against git by the Validator with zero hash mismatches; every headline
        statistic in both packages recomputed BIT-IDENTICALLY by independent
        Validator code.
        THE BATCH'S REAL FINDING: TWO INDEPENDENT REVIEWERS CONVERGED, BY DIFFERENT
        ARITHMETIC, ON THE SAME DEFECT. S2's parity statistic conditions on
        n = the sample's own realised delta_E, so the event and the conditioning
        quantity are the same random variable; the estimator is self-conditioned and
        the pre-registered rejection condition HAD NO POWER. The Validator generated
        data EXACTLY from the contract's own random-integer model and got z_2 =
        12.5-13.5, LARGER than the arithmetic 8.645103378616307; the Red Team
        decomposed the excess exactly into a parity term -0.09679849 and a
        self-conditioning offset +0.14831138, 64.2 per cent of it from the delta_E = 1
        spike. THE VOID WAS COMPELLED BY THE CONTRACT'S OWN RULE and the mechanism
        reported for it was wrong. A CONTRACT-DESIGN DEFECT, NOT AN EXECUTOR ERROR.
        RT-H3's ell = 2 LANE IS THEREFORE NOT CLOSED - IT HAS NOT YET BEEN MEASURED;
        against the contract's exogenous M2 the same data give z = -9.2100, OPPOSITE
        IN SIGN to the reported constant factor.
        S1 IS A REFERENCE-MEASURE ERROR, NOT A MIXING FAILURE. The walk equilibrates
        to W-CURVE; S1a compared it to W-TYPE. Mean TV to W-CURVE 0.03485 -> 0.01102
        -> 0.01055 against a 0.00846 noise floor, W-CURVE closer at 288 of 299 primes
        - the same 288 as the Holm count - while TV to W-TYPE converges to a nonzero
        limit. The Fisher statistic 5305.213651378483 is EXACTLY 2*288*ln(10001), so
        every rejecting prime is pinned at the Monte-Carlo floor and the "flat across
        three walk lengths" claim is CENSORED, not informative. RT-H2's experimental
        arm returns to UNRUN.
        FC-4 STANDS, DOUBLY CONFIRMED AND BY MEASUREMENT. The committed gap
        recomputed at 0.16618962442799579 against 0.16618962442799545 (3e-16, float
        summation order) and all ten per-ell alphas exactly. Clause (b) fails
        (PRIMARY-A per-ell 1.1503204217789973 > 1.15) and clause (d) fails
        (PRIMARY-B's slope is 41.8 SE from zero); either alone forces STANDS. The
        pre-registered rerank trigger did NOT fire. Clause (a) is ONE weak comparison:
        the null never exercises Karatsuba on the new grid and 71 per cent of the gap
        shrinkage came from the null arm moving.
        A CLOSED LANE REOPENS ON THE DOMINANT RESIDUAL. The bibliographic package's
        STATED_ABSENCE of a batching statement in Sutherland ANTS X 2013 is FALSE -
        the Validator re-fetched the source and quotes it verbatim, with a batch-size
        ceiling k = O(log l). RT3-C8's BATCH-003 assertion was wrong and a lane marked
        CLOSED rested on it. RT3-C8 / L4 REVERTS TO OPEN and remains the dominant
        residual at 11.50-13.25 bits, 48-59 per cent of the corrected overhead.
        k IS INSTANTIATED, p-DEPENDENT (k(768) - k(256) = log2 3 = 1.585 bits), and
        pro-attack on the BASELINE term - and ADOPTING IT WIDENS the NIST-I span by
        0.49-3.15 bits against a 2.2309-bit criterion. Adopted as a direction and a
        structural fact; REFUSED as a number in any margin row (SP-16), on four
        independent grounds including partial double-counting with RT2-C7 (which
        converts at lambda = 2.1592 to 3.89-5.89 bits against row A's 6.00-6.49:
        overlapping, not subsumed). k remains blog-cited: the Validator reproduced
        HTTP 403 Cloudflare interstitials on all three eprint PDFs with a shell, and
        per rule 5 that obstruction is not evidence.
        A DEFECT IN THE ORCHESTRATING SESSION'S OWN RECORD, CORRECTED: the quarantine
        marker for RUN-PEC-d7979c-a asserts "no statistic reached a recorded verdict".
        FALSE - that run FINISHED (2809.624 s, all controls pass, verdict_word
        STANDS) and is bit-identical to -b at all 432 cells. It changes no verdict; it
        means the campaign twice described a completed run as having produced nothing.
        NOTHING MOVED, FOR A FOURTH BATCH. concrete_threat_nist1 stays INCONCLUSIVE;
        no H-P13-001 position changes state; RT-S1 survives with reason (iv) half
        discharged. THE DIAGNOSIS IS THE HEADLINE: three surfaces each ran to a method
        ceiling and EACH ENDED BY FINDING A DEFECT IN ITS OWN INSTRUMENT, so the next
        contract's scarce resource is ESTIMATOR CENTRING AND REFERENCE-MEASURE CHOICE,
        not primes and not compute. The one solid result is an instrument result: the
        enumeration is sound and independently checked, with the supersingular count
        brute-forced by the Validator itself at six primes.
        KNOWLEDGE: REM-1 DISCHARGED. KN-FIND-7f2a1c shipped with a regenerated
        knowledge/INDEX.md in the same commit, after two deferrals for the same
        task-card scoping omission.
      contract_gates: >-
        RUN-HEUR-d640d9-a: gate MET (10 of 10 declared artifacts; every
