    Independently verify or falsify the Wesolowski 2026 attack assessment:
    (a) provability routes and biases for Heuristic 1, (b) concrete
    van Oorschot-Wiener middle-memory cost versus Delfs-Galbraith at
    cryptographic sizes, with independent review, validation, and red team.
