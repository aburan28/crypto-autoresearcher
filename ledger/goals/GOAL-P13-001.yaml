research_goal:
  id: GOAL-P13-001
  title: "Assess the Wesolowski 2026 p^{1/3+o(1)} supersingular isogeny attack"
  objective: >-
    Independently verify or falsify the Wesolowski 2026 attack assessment:
    (a) provability routes and biases for Heuristic 1, (b) concrete
    van Oorschot-Wiener middle-memory cost versus Delfs-Galbraith at
    cryptographic sizes, with independent review, validation, and red team.
  question_ids: [H-P13-001]
  active_hypothesis_ids: [H-P13-001]
  status: active
  status_note: >-
    ACTIVE, UNCAPPED, AND NOT `completed` UNDER ANY READING.
    THE CAMPAIGN IS NO LONGER CAPPED. The budgeting mechanism is retired
    repo-wide (harness commit 3834d84f): this goal carries no `campaign_budget`,
    no `maximum_batches`, no `total_wall_clock_seconds`, and no task under it
    carries a budget. `max_concurrent` below survives as a write-scope
    concurrency guard, not a budget. DEC-20260802-48c72c's pre-commitment that
    "after BATCH-004 the goal goes to `paused`/`closed_at_budget`" is SUPERSEDED
    by DEC-20260802-fa3b26 on two independent grounds: `closed_at_budget` is
    retired and unavailable to this goal (grandfathered to GOAL-MLKEM-001 alone,
    tools/validate_ledger.py CLOSED_AT_BUDGET_GOAL_IDS), and the four-batch cap
    that made "one batch remains" meaningful no longer exists.
    WHAT THE REMOVAL OF THE CAP DID NOT DO. It removed an arbitrary stopping
    point, not a standard. Completion criterion 1 is still NOT MET and is still
    assessed UNREACHABLE BY THIS METHOD - an unimplemented subroutine (L4,
    11.50-13.25 bits) cannot be measured by uncapped time, and the method
    ceiling gamma = exponent(M) - 1 <= 1 is exact. Closure additionally requires
    the three-model quorum of AGENTS.md rule 13, which this harness cannot
    supply. Every standing prohibition of DEC-20260802-8227b9 and
    DEC-20260802-48c72c stays in force, four of them permanently, and
    concrete_threat_nist1 stays INCONCLUSIVE.
    WHAT ENDS THIS CAMPAIGN IS NOW WRITTEN DOWN: see campaign_end_standard.
    "Continue" is a decision that must be justified against a ranked list, not a
    default that survives because nothing stops it.
  owner: coordinator
  runtime:
    provider: kimi-work
    goal_id: GOAL-P13-001
  # Not a budget. Per templates/research-records.md this caps how many tasks may
  # hold disjoint write scopes on the shared worktree at once - a data-integrity
  # guard. It imposes no ceiling on batches, runs, or wall clock.
  max_concurrent: 3
  current_batch_id: BATCH-003
  dispatch_queue_path: coordination/goals/GOAL-P13-001/batches/BATCH-003/dispatch_queue.json
  dispatch_queue_path_note: >-
    Still pointing at BATCH-003 because BATCH-004's queue does not yet exist: it
    is created by next_action, and this checkpoint does not name a path that is
    not on disk. The archive that opens BATCH-004 advances this field.
  previous_dispatch_queue_paths:
    - path: coordination/goals/GOAL-P13-001/batches/BATCH-002/dispatch_queue.json
      batch_id: BATCH-002
      state: all seven tasks completed; retained immutable for its committed archive receipts
    - path: coordination/dispatch_queue_GOAL-P13-001.json
      batch_id: BATCH-001
      state: all tasks completed; retained immutable for its committed archive receipts
  latest_verified_commit: 833240b5ca55828ab9461aea1d86b34487fdd1f4
  latest_verified_commit_note: >-
    Commit 833240b5, the TASK-20260802-c1f7c8 BATCH-003 LEDGER archive carrying
    EV-PEC-857664, DEC-20260802-48c72c, H-P13-001 and the BATCH-003 goal
    checkpoint. PROVENANCE STATED RATHER THAN IMPLIED: this value was reported
    to the Coordinator by the dispatching session as accepted by the
    post-commit verifier. The Coordinator that wrote this checkpoint ran no git
