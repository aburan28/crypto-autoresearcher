      what_this_batch_measures: >-
        The TRUE per-entry table-construction cost of Algorithm 1 of the frozen
        source - modular polynomial evaluation AND root finding AND the
        non-backtracking filter AND table insertion, all charged - across a
        SWEEP of eight computed primes at log2 p in {20, 23, 26, 29, 32, 35, 38,
        40}, at three smoothness bounds B, under two implementation variants and
        two seeding strategies, with a FITTED overhead exponent carrying a
        confidence interval, full signed residuals and goodness-of-fit gates,
        plus five named controls including a machine-calibration control and a
        null control.
      why_a_sweep_and_not_a_single_p: >-
        AN EXPONENT CANNOT BE IDENTIFIED FROM A SINGLE p. NC-2 as recorded says
        `at p ~ 2^40`; a measurement at one prime yields ONE COST NUMBER, NOT AN
        OVERHEAD EXPONENT, and a c reported from it would be an unfalsifiable
        number dressed as a measurement. The approved contract WIDENS NC-2 to a
        sweep. This is a deliberate strengthening of the control, recorded as
        such, and is not a substitution of a different question.
      claim_ceiling: >-
        A measured per-entry cost and a FITTED overhead exponent at p in about
        2^20..2^40 on ONE host with ONE Sage build, plus a CLEARLY LABELLED
        CONDITIONAL EXTRAPOLATION computed by substitution into the committed
        unmodified EXP-P13VOW-001 model. p ~ 2^40 IS NOT CRYPTOGRAPHIC SIZE and
        THE NIST-I MARGIN IS NOT MEASURED BY THIS BATCH. Not an attack, not a
        break, not a test of Heuristic 1, not a repair of GAP-1 or GAP-2, not an
        asymptotic claim, and not a parameter recommendation.
      pre_registered_both_directions: >-
        READING-SMALL-C, READING-LARGE-C, READING-STRADDLE,
        READING-NOT-IDENTIFIED and READING-INFRASTRUCTURE are frozen in
        experiments/EXP-SSI-002/specification.yaml BEFORE ANY MEASUREMENT
        EXISTS, so neither direction can be framed after the fact. Both are
        equally required to be reported; their LICENSING is asymmetric and that
        asymmetry is also pre-registered - a small c is the more robust
        direction because this Sage proof of concept's cost is an UPPER bound on
        an optimised implementation's, while A LARGE c DOES NOT ESTABLISH A SAFE
        MARGIN.
