    this programme has now run three batches downstream of a
    Heuristic-1-conditional theorem without that pairing, while P0 multiplies
    every one of the eighteen margin rows identically.
    NC-3/NC-6 MUST carry an explicit feasibility gate: if the sampler needed to
    reach the relevant distribution cannot itself be validated within budget,
