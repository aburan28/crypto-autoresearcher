      NOT MET, and now additionally assessed as UNREACHABLE BY THIS METHOD WITHIN
      THE REMAINING BUDGET. (a) ERROR: the defensible modelled margin span at
      w = 2^30 is [8.3498, 22.2927] bits at alpha = 1 throughout (width 13.9429)
