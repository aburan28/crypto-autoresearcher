  next_action_superseded_20260810: >-
    OPEN BATCH-004, THE FINAL BUDGETED BATCH, scoped explicitly NOT as an attempt
    to meet completion criterion 1 - which DEC-20260802-48c72c has assessed as
    unreachable by this method within the remaining budget - but as the cheapest
    set of items that retires the qualifications currently attached to every
    citation and tests the one load-bearing term that has never been tested.
    Ordered, with the cheap falsifier-closing items first so that a truncation
    degrades gracefully:
    (1) NC2d-PROPER - minutes of compute. Re-run C-PSCALE at the SAME three
    primes but at ell in {47, 101, 151, 211}, the range where the p-scaling is
    actually applied, at 4 j. Phi_ell is already acquired for all four, two of
    the three primes are already measured, and the p3 arm is free.
    PRE-REGISTER: alpha_primary in [0.85, 1.15]; |alpha_primary - alpha_null|
    <= 0.15; no residual trend of alpha_hat in ell. If FC-4 fires again on
    ell >= 47 the derivation really is contradicted and L5 must be replaced by
    the measured exponent; if it does not, the MECHANISM-INCONSISTENT label is
    retired BY MEASUREMENT, which is the only legitimate way to retire it.
    (2) NC2b-SLOPE - zero compute, arithmetic on 47 committed numbers. Multiply
    the committed null series pointwise by ell^s for declared s in {0.4, 0.8}
    and require the corrected estimator to recover s*log2(B_opt) + REF_null to
    within the same 0.75 bits at every field size. This is the only proposed gate
    with power against assumption L1, which the flat null cannot reach.
    (3) THE FREE BIBLIOGRAPHIC SUBTASK, no longer optional: retrieve Sutherland
    (ANTS X, 2013) and the frozen bibliography's [15] (Santos-Costello-Shi) and
    [3] (Adj et al.). Named as necessary in THREE consecutive red-team reports
    and executed in none; it costs no compute and is the only route to
    quantifying the baseline constant k, which sits under every margin row.
    (4) NC-3 / NC-6 - Heuristic 1's tail validation at the operating point,
    carried from BATCH-001 and unrun since. This is the substantive item.
    RATIONALE, WEIGHED RATHER THAN INHERITED: the Red Team recommends it over
    NC2c and the Coordinator agrees, but for a stronger reason of its own. The
    case for NC2c is real - it is the only control addressing L4, the single
    largest residual term at 48-59 per cent of the corrected overhead, and it is
    the separator for an identifiability collision that remains open - but its
    best outcome RE-SCOPES the c-programme rather than answering the concrete
    question, and L4 cannot be closed without building the batched
    implementation. The decisive reason is that agents/coordinator.md and
    docs/target-result-profile.md require a conditional result to be PAIRED with
    a heuristic-validation experiment in the same or the following batch, and
    this programme has now run three batches downstream of a
    Heuristic-1-conditional theorem without that pairing, while P0 multiplies
    every one of the eighteen margin rows identically.
    NC-3/NC-6 MUST carry an explicit feasibility gate: if the sampler needed to
    reach the relevant distribution cannot itself be validated within budget,
    that is reported as an infrastructure/feasibility outcome and NEVER as
    evidence about Heuristic 1 (AGENTS.md rule 5).
    (5) THE BATCH-004 LEDGER ARCHIVE TASK MUST carry knowledge/findings/ and
    knowledge/INDEX.md in its write_scope and ship the KN-FIND scheduled by
    DEC-20260802-48c72c.knowledge_promotion (the estimator lemma and pairing
    rule, proof_status `derivation`, NOT any c value). This is the second
    consecutive deferral of that item for the same task-card scoping omission,
    and the requirement is binding rather than hoped for.
    RERANK TRIGGER, recorded before the measurement: if NC2d-PROPER fires FC-4
    again on ell >= 47, L5 is contradicted at the ell where it is actually
    applied, alpha ceases to be the smallest term in the corrected law, and the
    batch's remaining capacity should go to characterising it rather than to
    NC-3/NC-6.
    CONSTRAINTS ON THE BATCH: no handoff may direct an execution order or
    parameter differing from the frozen contract it dispatches
    (INCIDENT-20260802-P13-03); every standing prohibition of
    DEC-20260802-48c72c binds, four of them permanently; and no task may claim a
    review-breakthrough tier, which is non-degradable and unavailable here.
