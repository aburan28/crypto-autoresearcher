    diagnostic. The superseding contract must also define the fitted response on a
    single implementation so it cannot change definition inside the fitted range,
    place C-NULL after the optional extension or re-run it over the achieved
    grid, and fix a Cantor-Zassenhaus seed policy explicitly. Rationale for this
    ordering, on which both independent reviewers converge: NC2b is free and
    repairs the number the whole batch exists to produce, NC2a costs hours and
    decides whether the headline was ever a measurement, and only two batches
    remain of the four-batch campaign budget.
