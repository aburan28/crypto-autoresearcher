        the Validator's own recomputation; the Red Team attacked on six fronts
        and broke it on none; both reproduced the corrected c to ~1e-16.
        NOT FIXED, AND RECORDED. (a) The gate is weaker than its margin suggests:
        its tolerance derivation has NO VARIANCE TERM, so the PASS is about 1.4
        noise units and the failing confirmatory arm A-1 has no resolving power
