    research project rather than a control. THE c-CALIBRATION LANE IS AT ITS
    METHOD CEILING. Per guard G-4 that closes the LANE and is not generalised to
    the goal.
    THE THREE REASONS RECORDED HERE AFTER BATCH-003 HAVE ALL BEEN EXECUTED, AND
    THE JUDGEMENT IS RE-MADE ON NEW GROUNDS RATHER THAN CARRIED. They were: (i)
    NC2d-PROPER and NC2b-SLOPE; (ii) the free bibliographic subtask quantifying k;
    (iii) the never-tested term P0 via Heuristic 1. ALL THREE RAN IN BATCH-004.
    NC2d-PROPER measured on the pre-registered grid and FC-4 STANDS; the
    bibliographic subtask instantiated k; NC-3/NC-6 executed in full over 299
    primes. A reason that has been discharged is not a reason to continue, and
    reusing it would be exactly the inertia guard G-2 exists to prevent.
    WHY THE GOAL IS NOT PAUSED AFTER BATCH-004 (guard G-2, RE-MADE 2026-08-03,
    DEC-20260802-611354). END-2 was assessed on the merits and NOT invoked, because
    the batch's OWN ADVERSE FINDINGS produced two ranked items of material value
    that did not exist before it.
    (i) RT-H3's ell = 2 LANE IS UNMEASURED RATHER THAN CLOSED. The S2 statistic that
    probed it conditions on the sample's own realised value and PROVABLY HAD NO
    POWER, so the measurement RT-H3 has requested since BATCH-001 has still not been
    made. The prerequisite for making it correctly - re-deciding S1 and S2 against
    correct references - COSTS ZERO COMPUTE on numbers already committed at
    11b086d9, and must precede any successor Heuristic 1 contract, which would
    otherwise inherit both defects.
    (ii) THE LANE CARRYING THE DOMINANT RESIDUAL REOPENED. RT3-C8 / L4 (11.50-13.25
    bits, 48-59 per cent of the corrected overhead) was closed on a STATED_ABSENCE
    in Sutherland ANTS X 2013 that the Validator's own re-fetch shows is FALSE. A
    closure resting on a false obstruction fails the inventor protocol's own closure
    standard, and re-arguing it on the text is cheap and consequential.
    FOUR ITEMS WERE DECLINED ON THEIR MERITS IN THE SAME BREATH - NC2c, NC2a-BAND,
    NC2f and a TIER-2/3 extension - one of them (NC2f) newly WEAKENED by a free
    cross-check this batch closed at zero compute. That is the load-bearing half:
    if removing the cap simply enlarged every batch, the guard would be decorative.
    G-1 IS RESPECTED EXPLICITLY: this continuation rests on the two ranked items
    above and NOT on available capacity, and not on the absence of a cap.
    THE STANDING NO-CLOSURE-ON-FATIGUE DIRECTIVE (2026-08-03) BINDS EFFORT, NOT
    OUTCOME, and is not cited as a reason to continue. INCIDENT-20260803-P13-05
    terminated both BATCH-004 Executors mid-run; both were re-dispatched under the
    SAME frozen contracts and the incident is recorded as infrastructure, never as
    evidence (AGENTS.md rule 5). The directive lowers no evidence standard, makes no
    breakthrough expected, and licenses no report the evidence does not support. The
    continuation above would be justified identically without it.
    WHAT REPLACED THE PRE-COMMITMENT. DEC-20260802-48c72c pre-committed a
    terminal disposition after BATCH-004 in terms of a batch count and
    `closed_at_budget`; DEC-20260802-fa3b26 superseded that clause because
    neither mechanism exists. The governing standard is campaign_end_standard
    above. Under guard G-2 this "not paused" judgement is NOT a standing
    permission: it must be re-made and re-recorded at the close of EVERY batch,
    against a ranked list, or END-2 is invoked instead. There is no third option
    and no default.
