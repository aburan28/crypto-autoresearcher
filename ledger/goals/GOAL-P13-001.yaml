  batch_checkpoints:
    - batch_id: BATCH-001
      opened: "2026-07-24"
      closed_by: DEC-20260724-016
      outcome: >-
        Conditional mathematical validity supported at independent-review level;
        Heuristic 1 unproven but not falsified; concrete NIST-I threat
        INCONCLUSIVE because the margin (~2.3 bits at the red team's c ~ 1.8)
        is smaller than the cost model's own +-3.51-bit irreproducibility band;
        NIST-III/V not threatened under any tested overhead scenario.
    - batch_id: BATCH-002
      opened: "2026-08-02"
      objective: >-
        Execute next-control NC-2, the deciding measurement named by
        DEC-20260724-016 and red-team objection RT-C1: measure the true
        per-entry cost of Algorithm 1 table construction at p ~ 2^40 against
        the paper's Section 4.1 assumption of one F_{p^2}-operation per entry,
        under a frozen contract (EXP-PEC-6be870) with pre-registered
        null-object and instrument-fidelity controls, then independent
        Validator and Red Team review before a ledger archive.
      status: closed
      closed_by: DEC-20260802-8227b9
      closed_at: "2026-08-02"
      inference_amendment: INFAMEND-20260802-P13-002
      artifacts:
        frozen_contract: experiments/EXP-PEC-6be870/specification.yaml
        frozen_contract_commit: 0e773e9a89d663b8ded6cdbfe6470b500f6fabc6
        run: RUN-PEC-6be870-a
        run_package_commit: 49166fa5b9573e170b4923333ff743fa9b2ab5d6
        validation: VAL-20260802-d9e2c1 (TASK-20260802-9ade2e)
        red_team: RT-20260802-96d908 (TASK-20260802-96d908)
        evidence: EV-PEC-2e67ff
      outcome: >-
        EXECUTED AND REVIEWED; THE DECIDING QUESTION IS NOT DECIDED.
        Established: the paper's Section 4.1 one-F_{p^2}-operation-per-entry
        convention is refuted at the tested scale in the attack's DISFAVOUR
        (measured 1843.5 to 94023.4 counted multiplications per entry over
        2 <= ell <= 211 at p ~ 2^40, against an assumed 1), with homogeneous
        exponents 0.9332 (schoolbook) and 0.7929 (Karatsuba) and an
        ell-independent prefactor of 2^8.92 that is structural and survives any
        multiplication routine; all ten pre-registered controls pass and the
        Validator concurs on all ten, reproducing the fit to 0.0e+00 and eleven
        samples of its own choosing bit-for-bit.
        Two defects found by independent review, neither an execution defect:
        (1) the pre-registered extrapolation law is DEFECTIVE - it discards the
        measured intercept, and the run's own null control shows it returns
        c ~ 0 for an object costing 2^12.3 multiplications per entry, so
        c = 0.864 at NIST-I may not be cited and the corrected value is
        ~1.42-1.80; (2) the fitted response changes definition at the
        ell = 101/103 seam, so the headline gamma 0.9739 exceeds BOTH of its
        constituents - a contract-internal inconsistency executed literally.
        The Red Team retracted its own prior RT-C1 calibration (gamma = 2 rested
        on an arithmetic error), retiring the "NIST-I margin might be ~zero"
        scenario. Net: the defensible modelled NIST-I margin at w = 2^30
        narrowed from [2.27, 34.27] to [5.40, 22.67] bits (-46% of the
        uncertainty width, lower end now clear of both irreproducibility bands),
        which is a real contribution and not a determination.
        Contract completion gate UNMET (25 of 26 core ell; ell = 97 lost to a
        transient fetch obstruction, curl 35 - an infrastructure outcome and
        never mathematical evidence, AGENTS.md rule 5; the Validator re-fetched
        the URL, confirmed the Executor's recorded hash, and measured the
        omission's effect at 0.0013 on W-MID).
      later_correction: >-
        DEC-20260802-48c72c corrects one phrase of this checkpoint's own
        summary: "an ell-independent prefactor of 2^8.92" is a FITTED
        extrapolation to ell = 1, not a measured prefactor (RT3-C7). The
        ell-independent floor is better evidenced by the null object's measured
        level, REF_null = 12.2595 bits. The checkpoint text is retained as
        written; the correction is recorded rather than applied by edit.
    - batch_id: BATCH-003
      opened: "2026-08-02"
      objective: >-
        Repair the two defects DEC-20260802-8227b9 found, under a SUPERSEDING
        contract (EXP-PEC-49c773; EXP-PEC-6be870 was not edited), in the order
        both reviewers converged on: NC2b at zero compute (recompute the
        overhead with the fitted intercept restored, gated by a pre-registered
        requirement that the corrected estimator return c_null ~ 0.77 for the
        run's own O(1)-per-entry null object instead of ~0), then NC2a
        (extend IMPL-B over ell 103..211 so the primary response has ONE
        definition across the whole fitted range), with full-range C-NULL
        coverage, a new C-SEED control, an opportunistic C-PSCALE p-sweep, and
        independent Validator and Red Team review before a ledger archive.
      status: closed
      closed_by: DEC-20260802-48c72c
      closed_at: "2026-08-02"
      inference_amendment: INFAMEND-20260802-P13-002
      artifacts:
        frozen_contract: experiments/EXP-PEC-49c773/specification.yaml
        frozen_contract_commit: e9a850f2c5e102d501b3ff846a939fa1c05f7050
        run: RUN-PEC-49c773-a
        run_package_commit: 84356221fbb448127245539e944c896a6e97cee5
        validation: VAL-20260802-5a24d2 (TASK-20260802-c50ea2)
        red_team: RT-20260802-8e00fe (TASK-20260802-8e00fe)
        evidence: EV-PEC-857664
        ledger_archive_commit: 833240b5ca55828ab9461aea1d86b34487fdd1f4
      outcome: >-
        THE REPAIR HOLDS, AND THE INTERESTING CONTENT IS WHAT IT DID NOT FIX.
        REPAIRED: NC2b's null gate PASSES at 0.271670 bits of a 0.75-bit
        tolerance where the superseded law misses by up to 12.605090 and fails at
        every one of its TEN evaluation points; c_null = 0.759087 against the
        ~0.77 pre-registered. The seam is gone - 47 of 47 ell acquired and
        admitted, both implementations at every ell at the identical j-set,
        ell = 97 re-acquired at exactly the SHA-256 the Validator obtained itself
        in BATCH-002, and the 101/103 step falling from 0.395971 to 0.017345
        bits. C-NULL coverage is 1.0000 in every fitted window BY CONSTRUCTION
        (coverage is now a membership precondition), and C-REPRO reproduces all
        884 overlapping samples bit-for-bit. Validator F-1 and F-3 RESOLVED, F-4
        PARTIALLY (correctness bought back by C-SEED; independence deliberately
        not restored). Seam-free exponents on W-MID: gamma_A = 0.9328644281,
        gamma_B = gamma_S-MIN = 0.8100336227. 12 of 12 gating controls pass on
        the Validator's own recomputation; the Red Team attacked on six fronts
        and broke it on none; both reproduced the corrected c to ~1e-16.
        NOT FIXED, AND RECORDED. (a) The gate is weaker than its margin suggests:
        its tolerance derivation has NO VARIANCE TERM, so the PASS is about 1.4
        noise units and the failing confirmatory arm A-1 has no resolving power
        either way - a defect of the frozen contract, not of the execution.
        (b) A pre-registered falsifier FIRED (FC-4, MECHANISM-INCONSISTENT); it
        is driven by ell in {3,5} alone, but a post-hoc restriction cannot lift a
        pre-registered falsifier and the designation STANDS. (c) The charging
        point at ell = B_opt OVERSTATES the entry-weighted cost by 0.60-1.00 bits
        - the Red Team's own objection against its own prior direction, declared
        by assumption L2 and priced for the first time.
        THE BATCH'S STRUCTURAL CONTRIBUTION: anomaly A-3 is NAMED, not merely
        bounded - it is the Karatsuba recursion staircase, with a free
        null-object control on the EXPLANATION (a depth regressor at -0.0749
        bits/level on IMPL-B and +0.0066 on IMPL-A, explaining 72 per cent of the
        residual variance on the recursive routine and nothing on the other).
        Correctly PAIRED it is worth 1.007 bits of NIST-I margin rather than an
        exponent revision, and the contract's general pairing rule is what
        absorbs it. Counter-consideration recorded against the programme's own
        convenience: gamma_B = 0.810 is a TRANSIENT of the unimproved shared
        reduction, so THE BRACKET'S LOW END IS THE OPTIMISTIC ONE.
        NET POSITION: c is CITABLE as the bracket [1.327077, 1.576444] at NIST-I
        with eight mandatory attachments, never as a number. All eighteen
        measured-gamma readings put the margin at w = 2^30 in [8.3498, 13.1544],
        clearing both irreproducibility bands by 4.8-6.1 bits, so the SIGN is
        robust; with L4 the span is 13.94 to 16.62 bits wide against a 2.23-bit
        band, so the MAGNITUDE is not. concrete_threat_nist1 stays INCONCLUSIVE.
        sota_delta: width 17.27 -> 13.94 (-19.3%), low end +2.95 bits, and the
        old 5.40 low end no longer exists. Batched evaluation still removes
        11.50-13.25 bits of a 21.23-25.22-bit total - 48-59%, STILL DOMINANT.
        Contract completion gate MET for RUN-PEC-49c773-a; RUN-PEC-6be870-a's
        gate remains UNMET, which is a separate fact about a separate run.
  completion_criteria:
    - >-
      An empirical per-entry cost calibration (NC-2) decides the NIST-I
      margin with error below the irreproducibility band, and the result
      survives independent Validator and Red Team review.
    - >-
      A Coordinator evidence record, decision, and hypothesis-status update
      are committed through a verified ledger archive.
  completion_criteria_assessment:
    assessed_by: DEC-20260802-48c72c
    assessed_at: "2026-08-02"
    supersedes_assessment_by: DEC-20260802-8227b9
    budget_supersession_note:
      by: DEC-20260802-fa3b26
      at: "2026-08-02"
      what_changed: >-
        ONE PHRASE, AND NOTHING ELSE. DEC-20260802-48c72c assessed criterion 1 as
        "UNREACHABLE BY THIS METHOD WITHIN THE REMAINING BUDGET". There is no
        remaining budget - there is no budget - so the clause has no referent and
        is replaced below by "UNREACHABLE BY THIS METHOD", which is exactly what
        the assessment's two supporting arguments establish. That decision's own
        copy is immutable and is left byte-unchanged; this is the live
        checkpoint's copy and the edit is recorded here rather than made
        silently.
      what_did_not_change: >-
        THE ASSESSMENT IS NOT WEAKENED AND IS IF ANYTHING STRENGTHENED BY THE
        REMOVAL. Neither support ever depended on a budget. (i) The residual
        width is dominated by L4, an UNIMPLEMENTED SUBROUTINE worth 11.50-13.25
        bits; building it is a research project, not a control, and no amount of
        uncapped time turns an unwritten subroutine into a measurement. (ii) The
        method ceiling is exact: gamma = exponent(M) - 1 with M at most
        schoolbook, so gamma <= 1 and this method can only narrow the overhead
        FROM ABOVE within [0, 1] in the exponent. REMOVING THE CAP DOES NOT MAKE
        CRITERION 1 REACHABLE, and no record may read the retirement of
        budgeting as having changed this.
    note: >-
      An assessment of the criteria as written. The criteria themselves are
      UNCHANGED: success criteria are never adjusted after observing an outcome
      without a versioned protocol_amendment, and none was made in three batches
      or in the budget-retirement decision.
    criterion_1: >-
      NOT MET, and additionally assessed as UNREACHABLE BY THIS METHOD.
      (a) ERROR: the defensible modelled margin span at w = 2^30 is
      [8.3498, 22.2927] bits at alpha = 1 throughout (width 13.9429) or
      [8.3498, 24.9708] allowing alpha in {0, 1, alpha_hat} (width 16.6210),
      against irreproducibility bands of 2.2309 bits (NIST-I time) and 3.5133
      bits (largest absolute deviation anywhere in RUN-P13VOW-001's C1 control) -
      four to seven times the band. (b) SURVIVAL: this time the calibration DID
      survive independent review, which is a real change from BATCH-002 - the
      Validator's verdict is admissible with 12 of 12 gating controls passing on
      its own recomputation, and the Red Team broke it on none of six fronts -
      but both reviewers still decline to move the NIST-I question, and a
      pre-registered falsifier fired.
      WHY UNREACHABLE, STATED AS A METHOD CEILING RATHER THAN AS FATIGUE: the
      residual width is dominated by assumption L4, an UNIMPLEMENTED subroutine
      worth 11.50 to 13.25 bits which the frozen paper itself names as the
      expected implementation route. Narrowing it requires building a batched
      implementation, which is a research project and not a control. The method's
      ceiling is exact: gamma = exponent(M) - 1 and M is at most schoolbook, so
      this method can only narrow the overhead FROM ABOVE within [0, 1] in the
      exponent, and it has now done that to a 4.805-bit span on the
      measured-gamma axis.
    criterion_2: >-
      MET ON VERIFICATION of the TASK-20260802-c1f7c8 ledger archive at commit
      833240b5, as reported by the dispatching session's post-commit verifier
      receipt, with the branch pushed and a PR against `main` naming
      EV-PEC-857664, DEC-20260802-48c72c, H-P13-001 and GOAL-P13-001. The
      criterion is recorded as met on that receipt and not on this Coordinator's
      own inspection: a record in a working tree is not durable evidence, and a
      record that exists only in a local commit is unpublished. Criterion 2 alone
      is not closure - criterion 1 governs.
  campaign_end_standard:
    established_by: DEC-20260802-fa3b26
    why_it_exists: >-
      A capped campaign had a built-in end. That end was arbitrary - a number,
      not a scientific statement - and retiring it is right, but it was doing
      real work. With the cap gone, TWO failure modes sit on either side of this
      campaign, and docs/inventor-protocol.md treats them as SYMMETRIC.
      PREMATURE CLOSURE: declining to search because a target looks saturated.
      Cheap to produce, reads as rigour, almost never challenged, because a
      rejection needs no evidence.
      UNBOUNDED DRIFT: continuing because nothing stops you. This is the mode the
      retirement creates - with no cap, "continue" becomes the default, and a
      default is not a decision. The remedy is not to reinstate a number; it is
      to require that CONTINUING be justified in a record, exactly as STOPPING
      already must be.
    ends_in_exactly_one_of_three_ways:
      - id: END-1
        name: completion
        condition: >-
          A completion criterion is MET and the AGENTS.md rule 13 quorum
          concurs: three CONCUR attestations with PAIRWISE-DISTINCT
          resolved_model_id values, each in an independent session, no DISSENT.
          Distinctness is judged on the resolved model, never on the requested
          policy alias.
        currently_available: >-
          NO, and recorded as closed rather than pending. Criterion 1 is not met
          and is unreachable by this method; and this harness resolves every
          subagent to one inherited model under INFAMEND-20260802-P13-002, so a
          quorum would require deliberately routing three different backends.
      - id: END-2
        name: exhaustion_on_the_merits
        condition: >-
          A Coordinator decision, committed through a VERIFIED ledger archive,
          records that NO RANKED NEXT ACTION OF MATERIAL VALUE REMAINS, naming -
          per AGENTS.md "Research-direction integrity and auditability" - the
          evidence, the scope actually reached, the test boundary, the remaining
          uncertainty, and a CONCRETE REVIVAL CONDITION stated specifically
          enough that a later agent can check whether it has happened. Resulting
          status: `paused` with a concrete resume action. NEVER `completed`,
          NEVER `closed_at_budget`.
        note: >-
          `paused` is the STRICTER record, not a softer one. The retired status
          asserted only that a number had been reached and required no
          scientific content at all; `paused` must say what would restart the
          work.
      - id: END-3
        name: user_instruction_or_a_triggered_pause_condition
        condition: >-
          The user instructs the campaign to stop, or a declared pause condition
          below fires. A pause condition that fires for ONE LANE pauses that
          lane and is recorded as such; it does not automatically pause the goal,
          and the difference must be stated wherever it is invoked.
    binding_guards:
      - "G-1: CAPACITY EXISTING IS NEVER A REASON to open a batch, add a task, or continue - and, symmetrically, THE ABSENCE OF A CAP IS NEVER A REASON TO CONTINUE. This rule predates budgeting (AGENTS.md: 'Do not fill capacity merely because a slot is free') and survives it unchanged."
      - "G-2: EVERY BATCH IS OPENED BY A DECISION that names what it buys, against the standing ranked list, before dispatch. A batch that closes without producing a ranked item of material value for its successor triggers END-2 rather than a default reopen."
      - "G-3: A TARGET LOOKING SATURATED IS NOT AN END. 'This space is mined' is a hypothesis about the search. END-2 requires the closure standard of docs/inventor-protocol.md section 4 - obstruction, argument, forward guidance; a count of screened-and-rejected items is a fatigue report whose honest status is `unverified`."
      - "G-4: A LANE AT ITS METHOD CEILING IS CLOSED AS A LANE and is not generalised to the goal. The c-calibration lane is at its ceiling; the goal is not, because Heuristic 1's tail has never been tested."
      - "G-5: NOTHING HERE LOOSENS AN EVIDENCE RULE. Removing a stopping point cannot promote a claim, widen a scope, lift a prohibition, or upgrade `preliminary` evidence. AGENTS.md rules 4, 5, 6, 7, 9 and 10 apply exactly as before."
  closure_requirements:
    - >-
      This goal may NOT be marked `completed` while criterion 1 is unmet, and
      criterion 1 is assessed as UNREACHABLE BY THIS METHOD - an assessment that
      never rested on a budget and is unaffected by the budget's retirement
      (DEC-20260802-48c72c, reaffirmed by DEC-20260802-fa3b26). The terminal
      NON-COMPLETION status available to this goal is `paused` with a concrete
      resume action, reached only through route END-2 or END-3 of
      campaign_end_standard. `closed_at_budget` IS RETIRED AND IS NOT AVAILABLE
      TO THIS GOAL: tools/validate_ledger.py grandfathers it to
      CLOSED_AT_BUDGET_GOAL_IDS = {"GOAL-MLKEM-001"} and rejects any addition,
      and with no budget to exhaust a new holder would be asserting something
      that cannot have happened.
    - >-
      Closure additionally requires the three-model quorum of AGENTS.md rule 13:
      three CONCUR attestations in completion_quorum.attestations whose
      resolved_model_id values are pairwise distinct, each in an independent
      session, with any single DISSENT blocking closure. This harness cannot
      supply it - every subagent resolves to the same inherited model under
      INFAMEND-20260802-P13-002 - so closure would require deliberately routing
      three different backends. No attestation has been obtained and none is
      recorded; a fabricated attestation would be worse than an open goal. The
      `completion_quorum` block is omitted entirely rather than stubbed, per the
      template.
    - >-
      GOAL-P13-001 appears in tools/validate_ledger.py's PRE_QUORUM_GOAL_IDS
      exemption. That exemption exists because the quorum rule is prospective for
      goals closed before it existed, and it MUST NOT be used as a route to close
      this goal without a quorum. Retiring a goal that did meet a criterion under
      `paused`, `blocked`, or `closed_at_budget` to avoid the quorum is likewise
      a contract violation. Neither manoeuvre is attempted: criterion 1 is
      genuinely unmet on the numbers.
  pause_conditions:
    - Heuristic 1 is refuted or proven by external work, making further internal controls moot.
    - >-
      The empirical calibration cannot be brought below the irreproducibility
      band by any method available to this campaign, as assessed in a
      Coordinator decision that states the METHOD CEILING rather than a spend.
      TRIGGERED FOR COMPLETION CRITERION 1 SPECIFICALLY - see
      pause_condition_watch. Per END-3 this pauses the c-calibration LANE and
      does not pause the goal.
    - A definitive infrastructure or dependency blocker prevents the next approved task.
  pause_conditions_note: >-
    Condition 2 was rewritten by DEC-20260802-fa3b26: it previously read "within
    the campaign budget", which has no referent, and it now tests the method
    ceiling instead. That is a stricter test, not a looser one - a spend can run
    out on a reachable target, while a ceiling is a property of the method. The
    condition's trigger status is unchanged: it was already triggered for
    criterion 1 and it remains so.
    Conditions 1 and 3 are unchanged. Condition 3 is the one covering
    archive-verification failures, dependency blockers, and infrastructure
    obstructions; any such event is an infrastructure outcome and is NEVER
    mathematical evidence (AGENTS.md rule 5). An unresolvable model policy is
    handled under closure_requirements clause 2, where it blocks CLOSURE without
    blocking work.
  pause_condition_watch: >-
    PAUSE CONDITION 2 IS TRIGGERED FOR COMPLETION CRITERION 1 SPECIFICALLY, and
    this checkpoint says so plainly rather than deferring the judgement. After
    BATCH-003 the residual span is 13.94 to 16.62 bits against a
    2.23-to-3.51-bit band, and its width is dominated by a subroutine nobody has
    written (L4, 11.50-13.25 bits). BATCH-002 named NC2b, NC2a and NC2c as the
    controls addressing that width; the first two have now been executed and the
    third cannot close L4 without building a batched implementation, which is a
    research project rather than a control. THE c-CALIBRATION LANE IS AT ITS
    METHOD CEILING. Per guard G-4 that closes the LANE and is not generalised to
    the goal.
    WHY THE GOAL IS NOT PAUSED. Pausing it would be premature closure in the
    sense of docs/inventor-protocol.md - a failure mode the protocol treats as
    symmetric with overclaiming - for three concrete reasons, NONE of which was
    ever budget-shaped and all of which survive the retirement intact.
    (i) Two of the items that currently qualify EVERY citation of this
    programme's results cost minutes and zero compute respectively: NC2d-PROPER,
    the only legitimate way to retire a fired pre-registered falsifier - by
    measurement, since a post-hoc restriction of the grid cannot lift one - and
    NC2b-SLOPE, the only proposed gate with power against L1.
    (ii) The free bibliographic subtask that would quantify the baseline
    constant k has been named as necessary in three consecutive red-team reports
    and executed in none.
    (iii) Most importantly, the term that MULTIPLIES every margin row - P0, via
    Heuristic 1's tail at the operating point - has never been tested in three of
    three executed batches, while agents/coordinator.md and
    docs/target-result-profile.md require a conditional result to be paired with
    a heuristic-validation experiment. Declining to test the untested
    load-bearing term on the grounds that a DIFFERENT term is saturated is
    exactly the move the protocol forbids.
    WHAT REPLACED THE PRE-COMMITMENT. DEC-20260802-48c72c pre-committed a
    terminal disposition after BATCH-004 in terms of a batch count and
    `closed_at_budget`; DEC-20260802-fa3b26 superseded that clause because
    neither mechanism exists. The governing standard is now campaign_end_standard
    above. Under guard G-2 this "not paused" judgement is NOT a standing
    permission: it must be re-made and re-recorded at the close of every batch,
    against a ranked list, or END-2 is invoked instead. There is no third option
    and no default.
