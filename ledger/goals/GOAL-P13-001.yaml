    written (L4, 11.50-13.25 bits). BATCH-002 named NC2b, NC2a and NC2c as the
    controls addressing that width; the first two have now been executed and the
    third cannot close L4 without building a batched implementation, which is a
    research project rather than a control. The c-calibration lane is at its
    method ceiling.
    WHY THE GOAL IS NOT PAUSED TODAY. Pausing the whole goal now would be
    premature closure in the sense of docs/inventor-protocol.md - a failure mode
    the protocol treats as symmetric with overclaiming - for three concrete
    reasons. (i) Two of the items that currently qualify EVERY citation of this
    programme's results cost minutes and zero compute respectively (NC2d-PROPER,
    which is the only legitimate way to retire a fired pre-registered falsifier,
    and NC2b-SLOPE, the only proposed gate with power against L1). (ii) The free
    bibliographic subtask that would quantify the baseline constant k has been
    named as necessary in three consecutive red-team reports and executed in
    none. (iii) Most importantly, the term that MULTIPLIES every margin row -
    P0, via Heuristic 1's tail at the operating point - has never been tested in
    three of four batches, and the coordinator contract requires a conditional
    result to be paired with a heuristic-validation experiment. Declining to
    spend the last batch on the untested load-bearing term, on the grounds that a
    DIFFERENT term is saturated, is exactly the move the protocol forbids.
    PRE-COMMITMENT: BATCH-004 is NOT an attempt to meet criterion 1. After it,
    this goal moves to `paused` or `closed_at_budget` with the narrowest
    supported result recorded. A remaining batch is a permission, not an
    obligation, and BATCH-004 is scoped to what remains testable rather than to
    what remains budgeted.
