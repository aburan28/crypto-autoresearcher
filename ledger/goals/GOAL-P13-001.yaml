    - batch_id: BATCH-002
      opened: "2026-08-02"
      objective: >-
        Execute next-control NC-2, the deciding measurement named by
        DEC-20260724-016 and red-team objection RT-C1: measure the true
        per-entry cost of Algorithm 1 table construction at p ~ 2^40 against
        the paper's Section 4.1 assumption of one F_{p^2}-operation per entry,
        under a frozen contract (EXP-PEC-6be870) with pre-registered
        null-object and instrument-fidelity controls, then independent
        Validator and Red Team review before a ledger archive.
      status: closed
      closed_by: DEC-20260802-8227b9
      closed_at: "2026-08-02"
      inference_amendment: INFAMEND-20260802-P13-002
      artifacts:
        frozen_contract: experiments/EXP-PEC-6be870/specification.yaml
        frozen_contract_commit: 0e773e9a89d663b8ded6cdbfe6470b500f6fabc6
        run: RUN-PEC-6be870-a
        run_package_commit: 49166fa5b9573e170b4923333ff743fa9b2ab5d6
        validation: VAL-20260802-d9e2c1 (TASK-20260802-9ade2e)
        red_team: RT-20260802-96d908 (TASK-20260802-96d908)
        evidence: EV-PEC-2e67ff
      outcome: >-
        EXECUTED AND REVIEWED; THE DECIDING QUESTION IS NOT DECIDED.
        Established: the paper's Section 4.1 one-F_{p^2}-operation-per-entry
        convention is refuted at the tested scale in the attack's DISFAVOUR
        (measured 1843.5 to 94023.4 counted multiplications per entry over
        2 <= ell <= 211 at p ~ 2^40, against an assumed 1), with homogeneous
        exponents 0.9332 (schoolbook) and 0.7929 (Karatsuba) and an
        ell-independent prefactor of 2^8.92 that is structural and survives any
        multiplication routine; all ten pre-registered controls pass and the
        Validator concurs on all ten, reproducing the fit to 0.0e+00 and eleven
        samples of its own choosing bit-for-bit.
        Two defects found by independent review, neither an execution defect:
        (1) the pre-registered extrapolation law is DEFECTIVE - it discards the
        measured intercept, and the run's own null control shows it returns
        c ~ 0 for an object costing 2^12.3 multiplications per entry, so
        c = 0.864 at NIST-I may not be cited and the corrected value is
        ~1.42-1.80; (2) the fitted response changes definition at the
        ell = 101/103 seam, so the headline gamma 0.9739 exceeds BOTH of its
        constituents - a contract-internal inconsistency executed literally.
        The Red Team retracted its own prior RT-C1 calibration (gamma = 2 rested
        on an arithmetic error), retiring the "NIST-I margin might be ~zero"
        scenario. Net: the defensible modelled NIST-I margin at w = 2^30
        narrowed from [2.27, 34.27] to [5.40, 22.67] bits (-46% of the
        uncertainty width, lower end now clear of both irreproducibility bands),
        which is a real contribution and not a determination.
        Contract completion gate UNMET (25 of 26 core ell; ell = 97 lost to a
        transient fetch obstruction, curl 35 - an infrastructure outcome and
        never mathematical evidence, AGENTS.md rule 5; the Validator re-fetched
        the URL, confirmed the Executor's recorded hash, and measured the
        omission's effect at 0.0013 on W-MID).
      later_correction: >-
        DEC-20260802-48c72c corrects one phrase of this checkpoint's own
        summary: "an ell-independent prefactor of 2^8.92" is a FITTED
        extrapolation to ell = 1, not a measured prefactor (RT3-C7). The
        ell-independent floor is better evidenced by the null object's measured
        level, REF_null = 12.2595 bits. The checkpoint text is retained as
        written; the correction is recorded rather than applied by edit.
    - batch_id: BATCH-003
      opened: "2026-08-02"
      objective: >-
        Repair the two defects DEC-20260802-8227b9 found, under a SUPERSEDING
        contract (EXP-PEC-49c773; EXP-PEC-6be870 was not edited), in the order
        both reviewers converged on: NC2b at zero compute (recompute the
        overhead with the fitted intercept restored, gated by a pre-registered
        requirement that the corrected estimator return c_null ~ 0.77 for the
        run's own O(1)-per-entry null object instead of ~0), then NC2a
        (extend IMPL-B over ell 103..211 so the primary response has ONE
        definition across the whole fitted range), with full-range C-NULL
        coverage, a new C-SEED control, an opportunistic C-PSCALE p-sweep, and
        independent Validator and Red Team review before a ledger archive.
      status: closed
      closed_by: DEC-20260802-48c72c
      closed_at: "2026-08-02"
      inference_amendment: INFAMEND-20260802-P13-002
      artifacts:
        frozen_contract: experiments/EXP-PEC-49c773/specification.yaml
        frozen_contract_commit: e9a850f2c5e102d501b3ff846a939fa1c05f7050
        run: RUN-PEC-49c773-a
        run_package_commit: 84356221fbb448127245539e944c896a6e97cee5
        validation: VAL-20260802-5a24d2 (TASK-20260802-c50ea2)
        red_team: RT-20260802-8e00fe (TASK-20260802-8e00fe)
        evidence: EV-PEC-857664
        ledger_archive_commit: 833240b5ca55828ab9461aea1d86b34487fdd1f4
      outcome: >-
        THE REPAIR HOLDS, AND THE INTERESTING CONTENT IS WHAT IT DID NOT FIX.
        REPAIRED: NC2b's null gate PASSES at 0.271670 bits of a 0.75-bit
        tolerance where the superseded law misses by up to 12.605090 and fails at
        every one of its TEN evaluation points; c_null = 0.759087 against the
        ~0.77 pre-registered. The seam is gone - 47 of 47 ell acquired and
        admitted, both implementations at every ell at the identical j-set,
        ell = 97 re-acquired at exactly the SHA-256 the Validator obtained itself
        in BATCH-002, and the 101/103 step falling from 0.395971 to 0.017345
        bits. C-NULL coverage is 1.0000 in every fitted window BY CONSTRUCTION
        (coverage is now a membership precondition), and C-REPRO reproduces all
        884 overlapping samples bit-for-bit. Validator F-1 and F-3 RESOLVED, F-4
        PARTIALLY (correctness bought back by C-SEED; independence deliberately
        not restored). Seam-free exponents on W-MID: gamma_A = 0.9328644281,
        gamma_B = gamma_S-MIN = 0.8100336227. 12 of 12 gating controls pass on
        the Validator's own recomputation; the Red Team attacked on six fronts
        and broke it on none; both reproduced the corrected c to ~1e-16.
        NOT FIXED, AND RECORDED. (a) The gate is weaker than its margin suggests:
        its tolerance derivation has NO VARIANCE TERM, so the PASS is about 1.4
        noise units and the failing confirmatory arm A-1 has no resolving power
        either way - a defect of the frozen contract, not of the execution.
        (b) A pre-registered falsifier FIRED (FC-4, MECHANISM-INCONSISTENT); it
        is driven by ell in {3,5} alone, but a post-hoc restriction cannot lift a
        pre-registered falsifier and the designation STANDS. (c) The charging
        point at ell = B_opt OVERSTATES the entry-weighted cost by 0.60-1.00 bits
        - the Red Team's own objection against its own prior direction, declared
        by assumption L2 and priced for the first time.
        THE BATCH'S STRUCTURAL CONTRIBUTION: anomaly A-3 is NAMED, not merely
        bounded - it is the Karatsuba recursion staircase, with a free
        null-object control on the EXPLANATION (a depth regressor at -0.0749
        bits/level on IMPL-B and +0.0066 on IMPL-A, explaining 72 per cent of the
        residual variance on the recursive routine and nothing on the other).
        Correctly PAIRED it is worth 1.007 bits of NIST-I margin rather than an
        exponent revision, and the contract's general pairing rule is what
        absorbs it. Counter-consideration recorded against the programme's own
        convenience: gamma_B = 0.810 is a TRANSIENT of the unimproved shared
        reduction, so THE BRACKET'S LOW END IS THE OPTIMISTIC ONE.
        NET POSITION: c is CITABLE as the bracket [1.327077, 1.576444] at NIST-I
        with eight mandatory attachments, never as a number. All eighteen
        measured-gamma readings put the margin at w = 2^30 in [8.3498, 13.1544],
        clearing both irreproducibility bands by 4.8-6.1 bits, so the SIGN is
        robust; with L4 the span is 13.94 to 16.62 bits wide against a 2.23-bit
        band, so the MAGNITUDE is not. concrete_threat_nist1 stays INCONCLUSIVE.
        sota_delta: width 17.27 -> 13.94 (-19.3%), low end +2.95 bits, and the
        old 5.40 low end no longer exists. Batched evaluation still removes
        11.50-13.25 bits of a 21.23-25.22-bit total - 48-59%, STILL DOMINANT.
        Contract completion gate MET for RUN-PEC-49c773-a; RUN-PEC-6be870-a's
        gate remains UNMET, which is a separate fact about a separate run.
    - batch_id: BATCH-004
      opened: "2026-08-02"
      objective: >-
        THE FIRST UNCAPPED BATCH, opened on merits under DEC-20260802-fa3b26 and
        explicitly NOT an attempt at completion criterion 1. PRIMARY: NC-3/NC-6, the
        first direct test of Heuristic 1's random-integer model against ground truth
