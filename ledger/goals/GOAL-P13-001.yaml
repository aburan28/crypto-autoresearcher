    with power against assumption L1, which the flat null cannot reach.
    (3) THE FREE BIBLIOGRAPHIC SUBTASK, no longer optional: retrieve Sutherland
    (ANTS X, 2013) and the frozen bibliography's [15] (Santos-Costello-Shi) and
    [3] (Adj et al.). Named as necessary in THREE consecutive red-team reports
    and executed in none; it costs no compute and is the only route to
    quantifying the baseline constant k, which sits under every margin row.
    (4) NC-3 / NC-6 - Heuristic 1's tail validation at the operating point,
    carried from BATCH-001 and unrun since. This is the substantive item.
    RATIONALE, WEIGHED RATHER THAN INHERITED: the Red Team recommends it over
    NC2c and the Coordinator agrees, but for a stronger reason of its own. The
    case for NC2c is real - it is the only control addressing L4, the single
    largest residual term at 48-59 per cent of the corrected overhead, and it is
