  pause_condition_watch: >-
    PAUSE CONDITION 2 IS TRIGGERED FOR COMPLETION CRITERION 1 SPECIFICALLY, and
    this checkpoint says so plainly rather than deferring the judgement. After
    BATCH-003 the residual span is 13.94 to 16.62 bits against a
    2.23-to-3.51-bit band, and its width is dominated by a subroutine nobody has
    written (L4, 11.50-13.25 bits). BATCH-002 named NC2b, NC2a and NC2c as the
