    The previous value, 84356221 (the TASK-20260802-18f85d snapshot of the
    NC2b/NC2a run package), is retained in the BATCH-003 checkpoint's artifacts
    block and nothing about its verification is withdrawn: it was accepted by
    the post-commit verifier and INDEPENDENTLY RE-VERIFIED BY BOTH REVIEWERS -
    reachable from HEAD with parent 809490aa, changing exactly the eleven
    declared paths, all ten declared path_sha256 re-verified in the working tree
    AND against the committed blobs (thirty comparisons, all agreeing), with
    stdout/stderr confirmed byte-identical pairs; the frozen contract commit
    e9a850f2 (TASK-20260802-b33bd4) is an ancestor and its specification.yaml is
