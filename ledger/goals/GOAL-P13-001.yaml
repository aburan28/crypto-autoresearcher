      outcome: >-
        EXECUTED AND REVIEWED; THE DECIDING QUESTION IS NOT DECIDED.
        Established: the paper's Section 4.1 one-F_{p^2}-operation-per-entry
        convention is refuted at the tested scale in the attack's DISFAVOUR
        (measured 1843.5 to 94023.4 counted multiplications per entry over
        2 <= ell <= 211 at p ~ 2^40, against an assumed 1), with homogeneous
        exponents 0.9332 (schoolbook) and 0.7929 (Karatsuba) and an
        ell-independent prefactor of 2^8.92 that is structural and survives any
        multiplication routine; all ten pre-registered controls pass and the
        Validator concurs on all ten, reproducing the fit to 0.0e+00 and eleven
        samples of its own choosing bit-for-bit.
        Two defects found by independent review, neither an execution defect:
        (1) the pre-registered extrapolation law is DEFECTIVE - it discards the
        measured intercept, and the run's own null control shows it returns
        c ~ 0 for an object costing 2^12.3 multiplications per entry, so
        c = 0.864 at NIST-I may not be cited and the corrected value is
        ~1.42-1.80; (2) the fitted response changes definition at the
        ell = 101/103 seam, so the headline gamma 0.9739 exceeds BOTH of its
        constituents - a contract-internal inconsistency executed literally.
        The Red Team retracted its own prior RT-C1 calibration (gamma = 2 rested
        on an arithmetic error), retiring the "NIST-I margin might be ~zero"
        scenario. Net: the defensible modelled NIST-I margin at w = 2^30
        narrowed from [2.27, 34.27] to [5.40, 22.67] bits (-46% of the
        uncertainty width, lower end now clear of both irreproducibility bands),
        which is a real contribution and not a determination.
        Contract completion gate UNMET (25 of 26 core ell; ell = 97 lost to a
        transient fetch obstruction, curl 35 - an infrastructure outcome and
        never mathematical evidence, AGENTS.md rule 5; the Validator re-fetched
        the URL, confirmed the Executor's recorded hash, and measured the
        omission's effect at 0.0013 on W-MID).
      later_correction: >-
        DEC-20260802-48c72c corrects one phrase of this checkpoint's own
        summary: "an ell-independent prefactor of 2^8.92" is a FITTED
        extrapolation to ell = 1, not a measured prefactor (RT3-C7). The
        ell-independent floor is better evidenced by the null object's measured
        level, REF_null = 12.2595 bits. The checkpoint text is retained as
        written; the correction is recorded rather than applied by edit.
