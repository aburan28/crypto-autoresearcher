  pause_condition_watch: >-
    THE SECOND PAUSE CONDITION IS NOW TRIGGERED FOR COMPLETION CRITERION 1
    SPECIFICALLY, and this checkpoint says so plainly rather than deferring the
    judgement. After BATCH-003 the residual span is 13.94 to 16.62 bits against a
