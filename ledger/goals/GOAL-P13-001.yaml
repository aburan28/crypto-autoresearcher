research_goal:
  id: GOAL-P13-001
  title: "Assess the Wesolowski 2026 p^{1/3+o(1)} supersingular isogeny attack"
  objective: >-
    Independently verify or falsify the Wesolowski 2026 attack assessment:
    (a) provability routes and biases for Heuristic 1, (b) concrete
    van Oorschot-Wiener middle-memory cost versus Delfs-Galbraith at
    cryptographic sizes, with independent review, validation, and red team.
  question_ids: [H-P13-001]
  active_hypothesis_ids: [H-P13-001]
  status: active
  status_note: >-
    ACTIVE, UNCAPPED, AND NOT `completed` UNDER ANY READING.
    THE CAMPAIGN IS NO LONGER CAPPED. The budgeting mechanism is retired
    repo-wide (harness commit 3834d84f): this goal carries no `campaign_budget`,
    no `maximum_batches`, no `total_wall_clock_seconds`, and no task under it
    carries a budget. `max_concurrent` below survives as a write-scope
    concurrency guard, not a budget. DEC-20260802-48c72c's pre-commitment that
    "after BATCH-004 the goal goes to `paused`/`closed_at_budget`" is SUPERSEDED
    by DEC-20260802-fa3b26 on two independent grounds: `closed_at_budget` is
    retired and unavailable to this goal (grandfathered to GOAL-MLKEM-001 alone,
    tools/validate_ledger.py CLOSED_AT_BUDGET_GOAL_IDS), and the four-batch cap
    that made "one batch remains" meaningful no longer exists.
    WHAT THE REMOVAL OF THE CAP DID NOT DO. It removed an arbitrary stopping
    point, not a standard. Completion criterion 1 is still NOT MET and is still
    assessed UNREACHABLE BY THIS METHOD - an unimplemented subroutine (L4,
    11.50-13.25 bits) cannot be measured by uncapped time, and the method
    ceiling gamma = exponent(M) - 1 <= 1 is exact. Every standing prohibition of
    DEC-20260802-8227b9, DEC-20260802-48c72c and DEC-20260802-611354 stays in
    force, five of them permanently, and concrete_threat_nist1 stays
    INCONCLUSIVE.
    THE QUORUM CLAIM THAT USED TO SIT HERE IS FALSE AND HAS BEEN REMOVED
    (DEC-20260802-611354). This record previously asserted that "closure
    additionally requires the three-model quorum of AGENTS.md rule 13, which this
    harness cannot supply". AGENTS.md RULE 13 IS SUSPENDED:
    GOAL_CLOSURE_QUORUM_REQUIRED = False in tools/validate_ledger.py, no
    `completion_quorum` block is required, and closure now rests on a committed
    Coordinator decision showing a declared completion criterion was met.
    THE SUSPENSION CHANGED THE GATE, NOT THE VERDICT, AND NOTHING HERE MAY BE READ
    OTHERWISE. The quorum was the SECOND lock. THE FIRST LOCK IS UNTOUCHED:
    criterion 1 is NOT MET, on grounds that never mentioned a quorum, and
    BATCH-004 made one of those grounds WORSE rather than better - the lane
    carrying the dominant residual was reopened when its stated obstruction proved
    false (DEC-20260802-611354 adjudication D), and instantiating the baseline
    constant k WIDENS the NIST-I span by 0.49-3.15 bits against a 2.2309-bit
    criterion. Reading the suspension as opening closure has the argument
    backwards. No attestation has been obtained, none is recorded, and the
    `completion_quorum` block stays omitted rather than stubbed.
    WHAT ENDS THIS CAMPAIGN IS WRITTEN DOWN: see campaign_end_standard.
    "Continue" is a decision that must be justified against a ranked list, not a
    default that survives because nothing stops it. At the close of BATCH-004 that
    judgement was RE-MADE, not carried: END-2 was assessed and NOT invoked, because
    the batch's own adverse findings produced two ranked items of material value
    (guard G-2). See pause_condition_watch and next_action.
