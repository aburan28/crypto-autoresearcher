    "the BINDING UNCERTAINTY IN THE PROGRAMME", P0 sits inside every one of the
    eighteen margin rows and a constant-factor error moves them all identically,
    and pairing a heuristic-conditional result with a heuristic-validation
    experiment is a STANDING OBLIGATION of agents/coordinator.md and
    docs/target-result-profile.md that has gone unmet for three batches.
    FEASIBILITY GATE, CARRIED VERBATIM AND NOT SOFTENED: if the sampler required
    to reach the relevant distribution cannot itself be validated, that is
    reported as an infrastructure/feasibility outcome and NEVER as evidence
    about Heuristic 1 (AGENTS.md rule 5), with what was actually covered recorded
    in `scope_reached`. The gate no longer says "within budget"; it now fires on
    the science, which is the stricter reading.
    DISPATCHED ALONGSIDE IT, under disjoint write scopes and max_concurrent: 3.
    Priority order is NOT dispatch order: the cheap items may run first in
    wall-clock while NC-3/NC-6's contract is being specified and frozen, and no
    record may cite dispatch order as priority.
    (2) NC2d-PROPER - minutes. Re-run C-PSCALE at the SAME three primes at
    ell in {47, 101, 151, 211}, the range where the p-scaling is actually
    applied, at 4 j. Phi_ell is already acquired for all four, two of the three
    primes are already measured, the p3 arm is free. PRE-REGISTERED AND
    UNCHANGED: alpha_primary in [0.85, 1.15]; |alpha_primary - alpha_null|
    <= 0.15; no residual trend of alpha_hat in ell. It is the ONLY LEGITIMATE
    WAY to retire the fired FC-4 / MECHANISM-INCONSISTENT designation, because a
    post-hoc restriction of the ell-grid cannot lift a pre-registered falsifier.
    (3) THE BIBLIOGRAPHIC SUBTASK, binding and no longer optional: retrieve
    Sutherland (ANTS X, 2013) and the frozen bibliography's [15]
    (Santos-Costello-Shi) and [3] (Adj et al.). Named as necessary in THREE
    CONSECUTIVE red-team reports and executed in none; zero compute; the only
    route to quantifying the baseline constant k, which sits under every margin
    row and is in the attack's disfavour if k > 1.
    (4) NC2b-SLOPE - zero compute, arithmetic on 47 committed numbers. Multiply
    the committed null series pointwise by ell^s for declared s in {0.4, 0.8}
    and require the corrected estimator to recover s*log2(B_opt) + REF_null to
    within the same 0.75 bits at every field size. The only proposed gate with
    power against L1, which a flat null cannot reach.
    (5) L2-WEIGHT - PROMOTED into the batch from carried-not-scheduled, because
    its only reason for exclusion was a scarce slot and that reason is void.
    Zero new compute, using RUN-P13VOW-001's committed cross-validated Dickman
    implementation. Predicted Delta in [0.55, 1.05] bits at every field size;
    discriminating check fixed in advance: reproduce the exact-enumeration values
    0.598 at (10^7, 100) and 0.625 at (10^8, 215). It converts MA-4 from a
    permanent attachment on every citation into a priced correction.
    DELIBERATELY NOT ADDED, DECLINED ON THE MERITS (guard G-1 - capacity is
    never a reason to add work): NC2c, whose deprioritization rationale was
    substantive and budget-free (its best outcome re-scopes the c-programme
    rather than answering the concrete question, and L4 cannot be closed without
    building the batched implementation) - it becomes highest priority the moment
    such an implementation is built, or if NC-3/NC-6 is reported infeasible under
    its gate; NC2a-BAND, whose revisit condition ("required before gamma_B =
    0.810 is treated as anything but a transient") has not fired, since MA-5
    makes that label mandatory; and NC2f, whose revisit condition ("required
    before any margin is reported as a difference of two MEASURED per-step
    costs") has not fired - it is the leading candidate for the batch after this
    one.
    RERANK TRIGGER, RECORDED BEFORE THE MEASUREMENT AND NOW AN ADDITION TRIGGER
    RATHER THAN A SUBSTITUTION ONE: if NC2d-PROPER fires FC-4 again on
    ell >= 47, L5 is contradicted at the ell where it is actually applied, alpha
    ceases to be the smallest term in the corrected law, and L5 must be replaced
    by the MEASURED exponent under a successor contract. With no single slot to
    contest, that work is ADDED rather than displacing NC-3/NC-6.
    BINDING ON THE BATCH.
    (a) REM-1: THE BATCH-004 LEDGER ARCHIVE TASK MUST carry knowledge/findings/
    and knowledge/INDEX.md in its write_scope and ship the KN-FIND scheduled by
    DEC-20260802-48c72c.knowledge_promotion (the estimator lemma and the pairing
    rule, proof_status `derivation`, NOT any c value) together with a regenerated
    knowledge/INDEX.md in the SAME commit. This is the second consecutive
    deferral of that item for the same task-card scoping omission; a third is
    pre-emptively refused.
    (b) REM-2 / INCIDENT-20260802-P13-03: no handoff may direct an execution
    order, tolerance, window, estimator or prediction differing from the frozen
    contract it dispatches. If an order must change, the instrument is a
    versioned protocol_amendment recorded before execution, or a superseding
    contract - never a dispatch message.
    (c) Every standing prohibition of DEC-20260802-8227b9 and DEC-20260802-48c72c
    binds, four of them permanently (SP-1, SP-2, SP-5, SP-6), including: no
    citation of c = 0.864 or its family as an estimate; c cited only as the
    bracket [1.327077, 1.576444] at NIST-I with all eight mandatory attachments
    and never as a number; margins quoted at w = 2^30 only; alpha = 1 labelled
    DERIVED and MECHANISM-INCONSISTENT.
    (d) NC-3/NC-6 and NC2d-PROPER each require a frozen contract under a NEW EXP
    id with predictions, tolerances, windows, estimators and failure consequences
    fixed before any datum exists; EXP-PEC-49c773 and EXP-PEC-6be870 are not
    edited. No task may claim a review-breakthrough tier, which is non-degradable
    and unavailable here. Each producer task whose result could change an ECDLP
    claim carries a dependent independent Validator and Red Team task, and each
    task card names exactly one archival task - snapshot archives alone before
    review, ledger archives alone after.
    AT THE CLOSE OF BATCH-004 (guard G-2): the Coordinator must either name a
    ranked next action of material value or invoke END-2 with an obstruction, an
    argument, forward guidance and a concrete revival condition. There is no
    third option and no default.
  next_action: >-
    OPEN BATCH-005, JUSTIFIED ON RANKED MERIT AND NOT ON AVAILABLE CAPACITY (guards
    G-1, G-2). END-2 WAS ASSESSED AT THE CLOSE OF BATCH-004 AND NOT INVOKED, because
    the batch's own adverse findings produced two ranked items of material value
    that did not exist before it. It is explicitly NOT an attempt at completion
    criterion 1, which remains unreachable by this method and which BATCH-004 moved
    further away rather than closer.
    PRIMARY OBJECTIVE - THE ZERO-COMPUTE RE-DECISION OF S1 AND S2 AGAINST CORRECT
    REFERENCES, under a NEW EXP id, as a SUPERSEDING ANALYSIS RECORD that does not
    touch the immutable run record.
    (1) RE-DECIDE S2 against the committed NULL-B READING_NEW_SIZE empirical
    distribution instead of the analytic zero, and RE-DECIDE S1a and S1d against the
    W-CURVE enumerated CDF instead of W-TYPE, with S1c against the W-CURVE
    pushforward on classes. All inputs are already inside
    experiments/EXP-HEUR-d640d9/runs/RUN-HEUR-d640d9-a/raw-result.json at 11b086d9.
    IT MUST PRECEDE ANY SUCCESSOR HEURISTIC 1 CONTRACT, because a successor built on
    the current S1/S2 readings would inherit both defects. S1c NEEDS PER-CLASS
    WALK-VISIT COUNTS, WHICH raw-result.json DOES NOT RETAIN - make that a required
    artifact of any successor enumeration.
    MANDATORY HONESTY CONSTRAINT, RECORDED BEFORE DISPATCH: THIS IS NOT A BLIND
    TEST. The Red Team has already computed the answers, so the successor contract
    must declare itself a RE-DECISION ON COMMITTED DATA WITH A KNOWN EXPECTED
    OUTCOME, state that expectation in advance, and record any disagreement with
    RT-RECOMP as a finding in whichever direction it falls. It may not be presented
    as a fresh measurement.
    (2) A CENTRED ell = 2 STATISTIC, under a frozen contract, dependent on (1).
    Candidates: a pair-collapse P(delta = 2k | delta in {2k-1, 2k}, X_p >= 2k),
    exactly 1/2 under any model flat within the pair and carrying no size parameter;
    and the same statistic as a two-sample arithmetic-vs-NULL-A comparison. THE NULL
    MUST BE PRE-REGISTERED AS THE EMPIRICAL DISTRIBUTION OF THE STATISTIC ON A
    GENUINE RANDOM INTEGER, NEVER AS AN ANALYTIC ZERO, and NULL-A must sit in the
    attribution column rather than inside the falsification criterion, where it can
    only subtract power. THIS IS THE MEASUREMENT RT-H3 HAS ASKED FOR SINCE BATCH-001
    AND IT HAS STILL NOT BEEN MADE. Honest ceiling unchanged: a rejection would be a
    scoped toy-scale constant-factor result, never a tail statement and never a
    statement about the attack.
    (3) RE-ARGUE RT3-C8 ON THE TEXT. The closure rested on a STATED_ABSENCE that is
    false; the corrected reading is that Sutherland ANTS X 2013 supplies batching
    with a k = O(log l) ceiling, far below the N >> l regime the argument needs, for
    algorithms not taking Phi_l as input. Re-argue or withdraw the disposition of the
    11.50-13.25-bit term ON THE TEXT. This bears on 48-59 per cent of the residual
    uncertainty and is the highest-value item BY CONSEQUENCE; it is ranked third only
    because (1) and (2) are free and are prerequisites for the campaign's other open
    lane.
    (4) RESOLVE HZ-1. Adopt lambda = 4096/1897 = 2.1592, re-derive whether RT2-C7 is
    genuinely subsumed by k or sits 0.6-2.1 bits below it, and record any corrected
    margin as a PAIR (baseline term, attack term) per SP-16.
    (5) THE HEURISTIC INVENTORY DEFECT, WHICH IS THE COORDINATOR'S AND IS CHEAP.
    Create the numbered HEUR-NNN record for Heuristic 1 per
    docs/claims-and-verification.md - formal statement, random-model justification
    (rigorous bound plus classical distribution theorem), obstructions, falsification
    condition, validation plan - and a hypothesis-level proof_search_map per
    inventor-protocol section 8. RT4-P2 records that S2's quantifier-order defect was
    EXACTLY THE KIND section 8's pre-compute audits exist to catch, and that it was
    not caught BECAUSE NO SUCH MAP EXISTS.
    (6) REDESIGN S4's RARITY LEVER and fix the raw-artifact layout (one file per
    tier, or drop per-class debug fields at higher tiers) so a tier decision is
    scientific rather than a packaging limit. Only then is a TIER-2/3 extension worth
    its X_p reach, which is its one measured gain.
    DELIBERATELY NOT ADDED, DECLINED ON THE MERITS (guard G-1 - capacity is never a
    reason to add work): NC2c, whose best outcome still re-scopes the c-programme
    rather than answering the concrete question, since L4 cannot be closed without
    building the batched implementation - it becomes highest priority the moment such
    an implementation is built; NC2a-BAND, whose revisit condition has not fired;
    and NC2f, whose revisit condition still has not fired AND which this batch
    WEAKENED - the Red Team closed its cross-check at zero compute from data already
    in hand (2^4.43-2^5.05 per DG step at p ~ 2^40 against a pre-registered 2^5..2^7
    band), so running the measurement now buys less than it did before, not more.
    BINDING ON THE BATCH.
    (a) Every standing prohibition of DEC-20260802-8227b9, DEC-20260802-48c72c and
    DEC-20260802-611354 binds, including the six added by the last: SP-13 (the S2
    numbers are never a property of maximal orders), SP-14 (S1 is a reference-measure
    error and its Fisher statistic is saturated), SP-15 (RT-H3's ell = 2 lane is
    UNMEASURED, not closed), SP-16 (k never enters a margin row as a number;
    corrected margins are quoted only as a pair), SP-17 (the two INVALID secondary
    signals are never revived) and SP-19 (RT3-C8 / L4 is REOPENED).
    (b) REM-2 / INCIDENT-20260802-P13-03 binds unchanged: no handoff may direct an
    execution order, tolerance, window, estimator or prediction differing from the
    frozen contract it dispatches. A dispatch message cannot amend a frozen protocol.
    (c) REM-3, NEW (DEC-20260802-611354): EVERY TASK CARD MUST DECLARE, IN ITS OWN
    artifact_paths, EVERY ARTIFACT ITS ARCHIVE MUST COMMIT - INCLUDING REVIEWER
    REPORTS. BATCH-004's ledger archive card omitted both review reports, which are
    the proof artifacts its own evidence and decision records rest on. This is the
    same class of Coordinator card defect as REM-1's and is carried forward for the
    same reason: a defect binds only if it appears in the record that dispatches the
    next batch.
    (d) Contracts are frozen under NEW EXP ids before any datum;
    EXP-HEUR-d640d9, EXP-PEC-d7979c, EXP-PEC-49c773 and EXP-PEC-6be870 are not
    edited. No task may claim a review-breakthrough tier, which is non-degradable and
    unavailable here. Each producer whose result could change an ECDLP claim carries
    a dependent independent Validator and Red Team task, and each card names exactly
    one archival task - snapshots alone before review, ledger archives alone after.
    AT THE CLOSE OF BATCH-005 (guard G-2): the Coordinator must again either name a
    ranked next action of material value or invoke END-2 with an obstruction, an
    argument, forward guidance and a concrete revival condition. There is no third
    option and no default, and the judgement may not be carried forward from this
    one.
