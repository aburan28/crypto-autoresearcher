research_goal:
  id: GOAL-QLWE-291164
  title: >-
    Quantum algorithms for LWE, Ring-LWE, and Module-LWE: develop a mechanism
    that beats the matched quantum baseline on the hardness assumptions
    themselves, or establish with named obstructions why the searched lanes
    cannot
  objective: >-
    A good-faith search for a QUANTUM algorithmic mechanism against the LWE
    family treated as a family: plain (unstructured) LWE, Ring-LWE, and
    Module-LWE, with the algebraic structure that separates them as the object
    under study rather than as a fixed background. Three lanes, bound as three
    independently falsifiable research questions.
    LANE 1 (RQ-QLWE-1c4a3b) — BASELINE AND STANDING CLAIMS, and the gate on
    everything else. Nothing can be claimed to move an exponent until the
    exponent it moves is written down. Transcribe from primary sources, into one
    frozen comparison schema, what the best currently known quantum algorithm is
    against each of the three assumptions under a declared quantum cost model,
    and classify every admitted row as structure-blind or structure-dependent.
    The same lane discharges a debt the knowledge corpus is already carrying and
    no ledger record owns: three claims of polynomial-time quantum attacks
    reaching this family sit in the corpus in three different states — Chen 2024
    (KN-LIT-52ce4c) retracted, Simon 2026 (KN-LIT-e204ab) recorded with six
    ranked checkable gaps and explicitly deferred by KN-OPEN-8a5965, and Luo
    2026 (KN-LIT-1743) bulk-seeded from two pages and referenced by no ledger
    record at all. Q1 of KN-OPEN-8a5965 — is the proof correct — is written
    OUT OF SCOPE by both existing hypotheses that touch it (H-MLKEM-36f511,
    H-MLKEM-7f3a2c). This goal owns it.
    LANE 2 (RQ-QLWE-9108dc) — STRUCTURE. Does the ring/module structure admit a
    quantum mechanism plain LWE does not, at the approximation factors deployed
    cryptography actually uses? The known quantum results that exploit cyclotomic
    structure live on ideal lattices at large approximation factor; the known
    quantum results that reach cryptographic parameters appear to be
    structure-blind amplifications of classical lattice reduction. Module-LWE's
    rank-versus-degree axis is exactly the interpolation between those two ends,
    and it is largely unmapped. Every candidate runs against a plain-LWE null
    object and a structure-removed nearby object BEFORE any structural claim is
    believed.
    LANE 3 (RQ-QLWE-d2d713) — REDUCTION MACHINERY. LWE's worst-case hardness
    argument is itself a quantum algorithm. Whether that machinery, its ring and
    module analogues, or the recorded quantum-polynomial-time equivalence
    between LWE and an extrapolated dihedral coset problem can be run as an
    attack subroutine — and if not, exactly which hypothesis fails and with what
    quantifier order — is cheap to write down and has never been written down
    here. The asymmetry is probably definitional. "Probably definitional" is a
    belief, not a recorded obstruction, and the gap between those two is the
    gap between a lane that is closed and a lane everyone assumes is closed.
    THIS GOAL DOES NOT PRESUPPOSE THAT A BREAK EXISTS. Standardization of the
    schemes resting on these assumptions reflects that no such mechanism is
    currently known, and the base rate for claims of this shape is a retraction
    within ten days (KN-LIT-52ce4c). A rigorous null in one, two, or all three
    lanes — a completed falsification search with named obstructions per
    docs/inventor-protocol.md — is the expected and fully legitimate range of
    outcomes, and premature closure is treated as a failure mode symmetric with
    overclaiming. Every proposal under this goal is proof/algorithm-oriented and
    therefore carries a `proof_search_map` (exact bottleneck, baseline
    reproduction, observation-collision search, quantifier order, method ceiling,
    nearby-object control per docs/inventor-protocol.md section 8 and
    knowledge/techniques/KN-TECH-080.md) as a cheap pre-compute falsification
    check before the Coordinator approves implementation or any expensive
    experiment; a failed proof_search_map audit is itself a useful, recordable
    result.
