  non_duplication:
    - >-
      GOAL-QALG-001 / RQ-QALG-457b41 OWNS THE SIEVING LANE AGAINST ML-KEM. That
      question searches for a quantum mechanism moving the exponent of
      MLWE/MSVP scoped to standardized ML-KEM parameter sets against a
      Grover-only baseline, and owns H-MLKEM-36f511 (evaluating Simon 2026's
      stated constants at FIPS 203 parameters). This goal does not search the
      quantum sieving/enumeration lane, does not restate that lane's
      conclusions, and asserts no verdict at any ML-KEM parameter set. Where a
      quantum-sieve baseline figure is needed, RQ-QLWE-1c4a3b CITES the
      QALG record rather than re-deriving it, and no cost figure crosses in
      either direction.
    - >-
      WHAT THIS GOAL OWNS THAT NOTHING ELSE DOES: Q1 of KN-OPEN-8a5965 — the
      correctness adjudication of standing polynomial-time quantum claims
      against the LWE family, on a named load-bearing step. Q1 is written
      explicitly OUT OF SCOPE by H-MLKEM-36f511 and by H-MLKEM-7f3a2c, whose
      statement grants Q1 "WITHOUT ADJUDICATING IT". KN-LIT-1743 (Luo 2026) is
      referenced by no ledger record at all. Verified by direct record
      inspection and a repository-wide search on 2026-08-30.
    - >-
      H-MLKEM-7f3a2c UNDER RQ-MLKEM-001 OWNS THE CONDITIONAL REACH MAP: granting
      Q1, does the published DCP -> Regev -> BKSW -> IP-M-EDCP chain reach rank-k
      MLWE at FIPS 203 parameters, under which alpha convention. That approved
      hypothesis is not re-derived, extended, contradicted, or pre-empted here.
      RQ-QLWE-d2d713 studies the reduction MACHINERY — machinery that predates
      the claim and stays interesting whichever way it resolves — not the reach
      of any particular claim to any particular deployed parameter set.
    - >-
      RQ-MLKEM-001 (GOAL-MLKEM-005) and RQ-MLKEM-003 (GOAL-MLKEM-003/004) own
      CLASSICAL mechanism search and classical cost-model work against FIPS 203:
      core-SVP margins, dual-attack independence heuristics, best-of-M ciphertext
      selection. This goal is quantum-only and scheme-agnostic; its object is a
      hardness assumption family, not a standardized KEM. No conclusion transfers
      in either direction.
    - >-
      GOAL-FRODO-001 / GOAL-FRODO-002 own FrodoKEM's own published quantities
      and its FO bound. Plain LWE appears in this goal as a hardness assumption
      and, critically, as the NULL OBJECT against which structural claims are
      controlled — never as FrodoKEM parameter auditing. A batch that finds
      itself recomputing a Frodo divergence or failure rate has crossed a
      boundary and stops.
    - >-
      GOAL-NTRU-001 owns the NTRU fatigue point and the overstretched dense-
      sublattice regime. NTRU is a different assumption and this goal does not
      touch it, including where an external claim (KN-LIT-1743) asserts NTRU
      consequences: adjudication under RQ-QLWE-1c4a3b is scoped to that
      document's named step and produces no NTRU verdict.
    - >-
      GOAL-QALG-001 / RQ-QALG-74bf20 and GOAL-CSIDH-001 own the dihedral-HSP and
      abelian-hidden-shift lane against the ISOGENY class group action. Where
      hidden-subgroup machinery appears in both, THE GROUPS ARE DIFFERENT — the
      unit and class group of a number field here, the isogeny class group
      action there. Shared machinery is not a shared result and nothing
      transfers without an explicit cited reduction.
    - >-
      GOAL-QRE-001 owns quantum resource estimation for Shor against RSA-2048
      and 256-bit ECDLP. This goal borrows the discipline of declaring a cost
      model and separating asymptotics from concrete cost; it produces no
      resource estimate for factoring or ECDLP.
    - >-
      GOAL-MLDSA-001 / GOAL-MLDSA-002 own MSIS, SelfTargetMSIS, and ML-DSA's
      signing-side questions. Different assumptions; nothing transfers.
  completion_criteria:
    - >-
      LANE 1, BASELINE. A committed, schema-validated quantum frontier covering
      plain LWE, Ring-LWE, and Module-LWE in which every cell has a terminal
      coverage state — primary_source_complete, primary_source_partial with
      named gaps, no_result_located with the exact search boundary,
      not_applicable with a reason, or routed_to_another_goal. Every row carries
      its comparison key, cost model, oracle/QRAM assumptions, alpha
      normalisation convention, citation provenance, and a structure-blind /
      structure-dependent classification. A blank cell is not a conclusion, and
      no `recalled` row is ever marked verified or placed on the authoritative
      frontier.
    - >-
      LANE 1, STANDING CLAIMS. For each standing polynomial-time quantum claim
      in scope (KN-LIT-e204ab via KN-OPEN-8a5965 Q1; KN-LIT-1743), one recorded
      verdict on a NAMED step: established as written, not established as
      written with the precise gap, or not reached within budget — the last
      being a budget outcome and never a verdict (AGENTS.md rule 3). A verdict
      about a document's step is never restated as a verdict about the hardness
      of the underlying problem or about any scheme.
    - >-
      LANE 2, STRUCTURE. Every candidate structural mechanism admitted to
      implementation has passed its proof_search_map audit and has been run
      against BOTH controls — plain LWE of the same total dimension, and a
      structure-removed nearby ring shape — with the control results recorded
      before any structural claim. Each candidate terminates in either a fully
      charged claim with numbered heuristics that beats the Lane 1 matched
      baseline, or a NAMED obstruction with its boundary, remaining uncertainty,
      and a concrete revisit condition.
    - >-
      LANE 3, MACHINERY. A committed obstruction map covering the three named
      routes, in which each entry is a statement that could be false: it names
      the hypothesis that fails, its quantifier order, and what would have to be
      true for it not to fail. "No known way" and "seems hard" do not close a
      route and are not admissible entries.
    - >-
      REVIEW. Independent Validator and Red Team sessions admit each batch's
      transcription provenance, comparison keys, control results, quantifier
      audits, and the proves-too-much controls in its precommitted review plan.
      Any claim of a mechanism beating the baseline on a real parameter set
      routes to the breakthrough tier (`review-breakthrough`) rather than to
      ordinary adversarial review.
    - >-
      A Coordinator ledger archive commits the frontier, adjudication records,
      obstruction map, evidence, decision, review reports, and the batch
      checkpoint shard, with every conclusion citing the experiment, run, and
      evidence IDs supporting it and scoped to the exact parameters, cost model,
      and budget tested.
  pause_conditions:
    - >-
      The six-batch or 18000-second campaign ceiling is reached without fresh
      user authorization to continue. This goal is NOT covered by the 2026-08-28
      "Fund every goal" directive; see standing_directive_scope_note.
    - >-
      Primary sources for a required frontier cell or a claim's load-bearing
      step remain unavailable after the recorded source-preference order is
      exhausted. The cell becomes primary_source_partial or the adjudication
      records "not reached within budget"; neither is ever filled from memory
      or from an abstract.
    - >-
      A definitive infrastructure, authentication, or dependency blocker
      prevents the next approved task.
    - >-
      Lane 1 establishes that a searched lane's baseline is already occupied by
      a published result this goal would merely be re-deriving. That lane pauses
      with the citation recorded; the other lanes continue.
  next_action: >-
    Open BATCH 1 as a literature-and-adjudication batch under RQ-QLWE-1c4a3b
    only, running no cryptanalytic search and no lattice reduction. Three
    producer tasks: (1) freeze the quantum-frontier comparison schema — cost
    model, oracle/QRAM assumptions, alpha normalisation convention,
    structure-blindness classification — and populate it from primary sources
    for plain LWE, Ring-LWE, and Module-LWE, filing each source as a KN-LIT
    entry with verified provenance and reporting the corpus duplicate pair
    KN-LIT-7667 / KN-LIT-7c2620 as disclosed debt without overwriting either;
    (2) adjudicate KN-OPEN-8a5965 Q1 sub-question 1 ONLY — the signed-C_{z*}
    cancellation in Lemma 3 of KN-LIT-e204ab, which that entry's own "cheapest
    next step" names as the entire game — and check the ePrint record for a
    revision or withdrawal notice first, since the Chen 2024 precedent says such
    claims usually resolve fast and legibly; (3) read KN-LIT-1743 past its
    abstract far enough to identify and name its load-bearing step (the claimed
    tower decomposition of the Principal Ideal Problem through the 2-power
    cyclotomic chain) and record either a verdict on that step or an explicit
    "not reached within budget", and upgrade the bulk-seeded entry's metadata
    from the primary document. Then one Coordinator snapshot, independent
    Validator and Red Team review at review-adversarial/xhigh, and one ledger
    archive with the batch checkpoint written as a write-once shard under
    ledger/goals/GOAL-QLWE-291164/checkpoints/. Lanes 2 and 3 open only after
    Lane 1's frontier exists, so that no mechanism proposal can be scored
    against an unstated baseline. Before dispatch, the Coordinator moves this
    goal from `draft` to `active` in its own ledger commit.
