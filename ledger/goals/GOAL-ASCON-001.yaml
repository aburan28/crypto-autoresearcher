research_goal:
  id: GOAL-ASCON-001
  title: "Ascon: audit which decade of published cryptanalysis actually transfers to SP 800-232, and enumerate the customized XOF surface that standardization added last"
  objective: >-
    Close the gap between the document that was analysed and the document that
    was standardized. Build the applicability table nobody holds — one row per
    published cryptanalytic result against Ascon, one column per difference
    between the submission and SP 800-232, and a determination per cell backed
    by the exploited property and where the standardized specification preserves
    or breaks it — treating "undetermined" as a first-class outcome and as the
    goal's primary finding. Exhaustively enumerate the customized XOF's
    customization-string domain separation within a declared class, since that
    mode was added at standardization and has neither the competition's scrutiny
    nor the follow-up literature's. Measure the standardized permutation's
    reduced-round margin against the inter-block round count actually applied.
    No attack on the full construction is in scope.
  question_ids: [RQ-ASCON-2dfd8b]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MD5-001, GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-SIMSPK-001, GOAL-POLYMAC-001]
  scheme_context:
    scheme: "Ascon-AEAD128, Ascon-Hash256, Ascon-XOF128, Ascon-CXOF128 (NIST SP 800-232)"
    family: "sponge/duplex AEAD and hashing"
    nist_track: selected_algorithm
    standardization_status: >-
      NIST SP 800-232, reported final 2025-08-13, targeting constrained devices.
    why_this_scheme: >-
      Of everything in this set, Ascon has the worst ratio of deployment
      consequence to elapsed scrutiny OF THE ACTUAL ARTIFACT. Its target
      devices are cheap, numerous, long-lived and often not field-updatable, so
      a late finding is expensive in a way it is not for a server-side
      primitive; and its confidence rests on a competition that analysed a
      different document. The audit that closes that gap is reading and
      enumeration, not compute, which makes it one of the highest
      value-per-batch items this program can run.
  non_duplication:
    - >-
      GOAL-SHA3-001 owns internal-differential analysis of Keccak-f. Both are
      sponges and the instrument is shared, but the object here is a
      DOCUMENT-TO-DOCUMENT APPLICABILITY AUDIT plus a mode surface, not a
      permutation frontier. Where this goal measures the permutation it does so
      against the standardized round counts and defers frontier questions.
    - >-
      GOAL-BLAKE-001 owns BLAKE3's tree-mode domain separation. The customized
      XOF audit here is the SAME KIND OF FINITE ENUMERATION in a different
      design, and the two goals must share an enumeration methodology:
      whichever runs second adopts the other's declared-class convention or
      records why it cannot.
    - >-
      GOAL-SIMSPK-001 owns lightweight BLOCK CIPHER parameter distributions.
      This goal makes no claim about SIMON or SPECK and no cross-primitive
      lightweight-cryptography claim is assembled from the two.
    - >-
      GOAL-MD5-001 owns instrument calibration; this goal consumes it. The
      applicability audit and the mode enumeration need no instrument at all,
      which is why they run first.
  completion_criteria:
    - >-
      AN APPLICABILITY TABLE covering every published Ascon cryptanalytic
      result located during acquisition, against every identified difference
      between the submission and SP 800-232, with a per-cell determination
      backed by the exploited property and the specification text that preserves
      or breaks it. Cells lacking that chain are recorded as undetermined. A
      table that is entirely "applies" is a complete and reportable result.
    - >-
      A CUSTOMIZED-XOF DOMAIN-SEPARATION AUDIT: the customization-string,
      length-encoding and mode surface enumerated within a declared class,
      reporting whether two semantically distinct inputs can present identically
      to the permutation, with any unenumerated region named. A clean result is
      a real result.
    - >-
      A PERMUTATION MARGIN MEASUREMENT stated against the STANDARDIZED
      inter-block round count rather than against twelve, under the mode's own
      constraints on injection and observation, with solver budget declared and
      every timeout recorded as a budget outcome.
    - >-
      A RE-DERIVED MODE BOUND at the standardized parameters with constants
      tracked, and a statement of what it implies at realistic device lifetimes
      and rekeying practice.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions. THE
      RED TEAM IS SPECIFICALLY CHARGED with checking that no "undetermined" cell
      has been written up as a security statement in either direction.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive. A completed applicability
      table warrants a KN-LIT/KN-TECH entry in its own right: it is the artifact
      the standardization process did not produce.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      SP 800-232 and the submission specification cannot BOTH be obtained in
      primary text under the network policy after the declared source-preference
      order is exhausted. The audit is a comparison of two documents and is not
      attempted with one.
    - >-
      Characteristic search against the permutation exceeds the declared
      campaign budget after cheaper falsification gates are exhausted. This is a
      budget outcome about a solver and is never evidence about Ascon
      (AGENTS.md rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Acquisition of BOTH documents first — the standard and the submission — then
    the applicability audit, which needs no compute and is the goal's primary
    deliverable. Build the difference list from the specifications directly
    rather than from any summary of what changed; one specific item to settle in
    primary text is the inter-block round count, which this program believes
    INCREASED from the submission to the standard but has not confirmed, and the
    direction of that change determines how the whole table is read. THEN run the
    customized XOF enumeration, before any permutation work: it is the newest
    surface in the standard, it is finite, and it is the only object here whose
    failure would matter to devices already shipping. Permutation margin
    measurement comes last and is the least likely to move. Claim tier: a
    coverage statement about the literature and a structural audit; never a
    security statement derived from an undetermined cell, in either direction.
    Disclose any domain-separation gap to NIST and the designers before it
    appears in a published deliverable.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
