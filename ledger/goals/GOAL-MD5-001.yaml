research_goal:
  id: GOAL-MD5-001
  title: "MD5: calibrate the symmetric search instrument against complete ground truth, and name the obstruction that has held the preimage frontier for fifteen years"
  objective: >-
    Do the one thing the rest of this program's symmetric lane cannot do for
    itself: validate the instrument against a primitive whose ground truth is
    complete and whose full attack pipeline executes inside a campaign budget.
    Require the automated characteristic search to REDISCOVER a published MD5
    collision path unaided from the specification and drive it to a literal
    colliding pair; produce measured wall-clock, memory and near-collision-block
    costs that the SHA-1 cost model has no way to measure for itself; and, as
    the goal's own research target, audit the meet-in-the-middle preimage
    method's ceiling against MD5 — naming the obstruction that stopped the
    preimage frontier around 2^123 while collision resistance collapsed to
    seconds, with MD4 as the control where the same method does break through.
  question_ids: [RQ-MDFIVE-6870c1]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-SHA1-001, GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-ASCON-001, GOAL-SIMSPK-001]
  scheme_context:
    scheme: "MD5 (RFC 1321), with MD4 as the fully-broken lower control"
    family: "Merkle-Damgard, ARX, MITM/biclique preimage cryptanalysis"
    nist_track: withdrawn
    standardization_status: >-
      Withdrawn from security use; still present in legacy identification and
      deduplication.
    why_this_scheme: >-
      This goal exists twice over. As INSTRUMENT CALIBRATION it is a
      precondition for believing anything GOAL-SHA2-001, GOAL-SHA3-001,
      GOAL-BLAKE-001, GOAL-ASCON-001 and GOAL-SIMSPK-001 report, because all
      five run the same automated search against primitives where nobody can
      check the answer. As RESEARCH it targets an asymmetry that is easy to
      overlook precisely because the primitive is written off: two frontiers
      moved by wildly different amounts under identical attention, and the
      reason has never been stated in this corpus. A named obstruction for the
      MITM method is a result about the method, which also bounds SHA-2.
  non_duplication:
    - >-
      THIS GOAL OWNS INSTRUMENT CALIBRATION FOR THE WHOLE SYMMETRIC LANE. No
      other goal in the 2026-08-09 set re-derives it, and any batch elsewhere
      that finds itself validating the solver rather than using it belongs
      here.
    - >-
      GOAL-SHA1-001 owns the chosen-prefix cost model and the detector audit.
      This goal supplies it with MEASURED near-collision-block anchors and
      claims nothing about SHA-1 itself.
    - >-
      GOAL-SHA2-001 owns the step-reduced SHA-256 deficit ledger. The preimage
      ceiling audited here is about the MITM method against MD5's schedule;
      transferring it to SHA-2 is a separate question and is not claimed.
  completion_criteria:
    - >-
      A BLIND CALIBRATION RESULT: the automated search, given only the RFC 1321
      specification and a declared budget, either rediscovers a published
      collision path and drives it to a literal verified colliding pair, or
      fails and reports the encoding, solver version, seed, and ceiling that
      produced the failure. BOTH OUTCOMES SATISFY THIS CRITERION and the second
      is the more important one, because it tells the other five goals what
      their instrument is worth before they spend a batch on it.
    - >-
      A MEASURED COST ANCHOR: wall-clock, peak memory, and near-collision-block
      counts for identical-prefix and chosen-prefix MD5 collisions actually
      executed here, in the charging convention GOAL-SHA1-001 and GOAL-RSA-001
      share.
    - >-
      A METHOD CEILING STATEMENT for MITM/biclique preimages against MD5: the
      strongest certifiable claim, the named obstruction, the argument, and
      what remains open — with MD4 run through the identical audit as the
      control where the method does break through. A count of screened-and-
      rejected variants without a named obstruction is a fatigue report and is
      recorded as `unverified` per docs/inventor-protocol.md.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive. A successful blind
      calibration warrants a KN-TECH entry recording the instrument, its
      encoding, and the exact ground truth it reproduced, since five other
      goals will cite it.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The preimage papers or a published collision path cannot be obtained in
      primary text under the network policy after the declared source-preference
      order is exhausted.
    - >-
      The blind path search exceeds the declared campaign budget after cheaper
      falsification gates are exhausted. This is a budget outcome about a
      solver and is NEVER evidence about MD5 (AGENTS.md rule 3) — but it IS a
      reportable result about the instrument, and the dependent goals must be
      told.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    THIS GOAL RUNS FIRST IN THE 2026-08-09 SYMMETRIC SET AND THE OTHERS WAIT ON
    ITS FIRST BATCH. Open by pinning and test-vector-validating an RFC 1321
    implementation, then run the blind calibration before anything else —
    instrument first, research second, because five other campaigns are
    priced on the answer. The calibration must be scored blind: a run that
    consumes the published path and reports success has measured nothing and is
    recorded as invalid rather than as a weaker pass. Only after the instrument
    has a verdict should the preimage ceiling audit open, and it opens with
    MD4, not MD5 — the control where the method demonstrably breaks through is
    the cheaper way to learn what the audit can even detect. Claim tier:
    collision certificates are complete objects and need no caveat; the ceiling
    statement names a method and an obstruction and asserts nothing about MD5's
    preimage resistance in general.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
