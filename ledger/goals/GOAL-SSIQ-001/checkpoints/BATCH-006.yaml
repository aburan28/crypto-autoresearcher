  process_note: >-
    THIS BATCH FOUND THE FOURTH INSTANCE OF THE SAME UNDERLYING FAILURE
    PATTERN THIS CAMPAIGN HAS NOW NAMED FOUR TIMES (GD-4, GD-7, GD-9,
    GD-10): something that LOOKS validated -- a formula frozen without
    being stress-tested (GD-4), a budget check applied but never verified
    against a cumulative reading (GD-7), a control that "ran" without its
    comparison logic ever being implemented (GD-9) -- and now, a
    validation artifact BUILT SPECIFICALLY to close GD-9's own gap that
    itself never calls the function it exists to validate (GD-10). The
    pre-freeze review process caught GD-8/GD-9's shape correctly (PF-1
    through PF-4 in this batch's own pre-freeze review); what it did not
    anticipate is that the FIX for a validation gap can itself have the
    identical validation gap, one layer further in. This is recorded as
    the clearest demonstration yet that "add a test" is not itself
    sufficient discipline -- the test's own target must be checked.
  outcome_summary: >-
    GD-8 IS FIXED AND VALIDATED ON REAL DATA. trapped_exclusion_filter_v3
    correctly excludes all 4 previously-searched primes in BOTH the real
    arm (trapped_fraction 0.8374/0.7222/0.8201/0.8511) and the null arm
    (0.8079/0.7037/0.7908/0.8478), independently confirmed by both
    reviewers via hand re-derivation from RUN-SSIQ-a85692-b's own raw
    data, matching the frozen contract's own pre-freeze-confirmed worked
    check to full float precision. Terminal branch DATA-UNAVAILABLE-BLOCKED
    is correctly and honestly derived, does not reopen the already-passed
    Phase -1 gate, and is itself informative: pervasive trapping at N in
    [203, 611] appears independent of which label arm (real or shuffled)
    is used.
    GD-9's WRAPPER (c_null_label_comparison_v3) IS FIXED IN CODE,
    CONSISTENT WITH THE FROZEN SPEC'S OWN PROSE, BUT REMAINS
    RUNTIME-UNVALIDATED. The required synthetic self-test (built because
    real data cannot exercise the wrapper's substantive branch, per this
    batch's own pre-freeze finding PF-1) was independently confirmed
    arithmetically correct by the Validator (an exact power law must
    recover gamma exactly; hand-derived from first principles), but the
    Red Team found, by reading the self-test's code directly, that it
    NEVER CALLS c_null_label_comparison_v3 -- it calls the underlying
    ols_loglog_fit/bootstrap_gap_ci library functions directly and
    re-implements the comparison rule inline as a second, hand-written
    copy, bypassing the wrapper's own cross-dict indexing (confirmed
    structurally necessary: the null arm's data schema has no N field),
    min-primes gate, and ordering logic. A subtly wrong wrapper
    implementation would pass this self-test unchanged. Named GD-10.
    Both reviewers agree DATA-UNAVAILABLE-BLOCKED is correct and the run
    was honestly executed; the Red Team's CHALLENGE targets what the
    self-test's passing report is entitled to mean, not the run's
    fidelity.
