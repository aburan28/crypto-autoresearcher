        in the real schema and call the wrapper itself through both
        branches.
      standing_repair_adopted: >-
        A validation artifact (a synthetic self-test, a unit test, a
        null-object control's comparison logic) must be verified to
        actually CALL the specific function/branch it is built to
        validate, not merely to exercise library code that function
        happens to reuse. When a pre-freeze review requires a self-test
        BECAUSE a specific wrapper is unreachable on real data, the
        pre-freeze review's required_controls should name the exact
        function the self-test must call, not just describe the desired
        behavior in prose.
