  outcome_summary: >-
    THE INSTRUMENT WORKED; THE BUDGET-ALLOCATION FORMULA DID NOT. The
    delta_E-computation route (bidirectional meet-in-the-middle
    smooth-degree search) is independently confirmed genuine: live Phi_ell
    re-fetch and independent Velu re-verification for ell in {3,11,23},
    full independent re-execution reproducing the terminal branch,
    C-SEARCH-BIAS correlations reproduced to 14 significant figures. The
    mandatory Phase -1 coverage gate (>=4 of 12 primes admitted) failed:
    the pre-registered truncation fallback's individual per-prime budget
    cap (T_prime = 0.5*7200/12 = 300s, checked against each prime's
    estimated full-coverage cost in isolation) admitted zero primes,
    because even the smallest pre-registered prime's flat-extrapolated
    cost (379.7s) exceeded it. Decision branch: DATA-UNAVAILABLE-BLOCKED,
    correctly and mechanically derived from the frozen contract per the
    Validator's independent code trace.
    NAMED, GD-7: the Red Team found, and the Coordinator independently
    re-verified by hand from the run's own already-committed per-prime
    estimates (zero re-measurement), that a CUMULATIVE reading of the
    identical numbers against the SAME reserved budget admits 4 primes at
    the half-budget reading and 6 at the full-budget reading -- clearing
    the gate's own 4-prime floor. The individual-cap formula is the wrong
    check for an ascending-prefix selection rule that already discards the
    expensive tail; it was finalized during the pre-freeze fix pass and
    never itself stress-tested the way the smoothness parameters were
    (RT-PREFREEZE Finding 1/8). A second, smaller, orthogonal defect (the
    Validator's F-1: the flat single-largest-prime cost estimate plausibly
    overstates cost at the 1-2 smallest primes by ~1.3-2.3x) was also
    found, real but strictly secondary -- GD-7 alone reaches the gate with
    zero cost-model correction.
    DESPITE THE FAILED GATE: the delta_E instrument is now validated,
    reusable infrastructure, and the blocker has a named, concrete,
    near-zero-cost fix using budget this run left almost entirely unspent
    (90.57s of 7200s). Decision: revise (a versioned amendment to the same
    contract), not inconclusive and not reject_scoped.
