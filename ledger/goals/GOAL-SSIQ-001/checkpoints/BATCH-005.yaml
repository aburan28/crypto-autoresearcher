  new_defects_recorded:
    - id: GD-8
      raised_by: [TASK-20260805-91bae2, TASK-20260805-10868f, TASK-20260805-f60ff9]
      severity: high
      summary: >-
        v1's inherited M-GAMMA-GREEDY definition states its own
        trapped_fraction>0.5 exclusion threshold in text, but the reused
        inline orchestration never implements it -- confirmed by all
        three independent parties (Executor's own PD-2 disclosure,
        Validator, Red Team) against the actual code
        (usable_full = [p for p in per_prime], no filter) and this run's
        own raw data (all 4 contributing primes at trapped_fraction
        0.72-0.85). Fixable at zero new search cost against
        already-collected data (BATCH-006's next action).
    - id: GD-9
      raised_by: [TASK-20260805-f60ff9]
      severity: high
      summary: >-
        C-NULL-LABEL, a control named "required, not optional" and cited
        by name in the frozen decision rule's own CONTROL-FAILURE-VOID
        branch text, is dead code: its control_failure flag is
        initialized False and never reassigned in either
        compute_delta_e.py or compute_delta_e_v2.py -- no null M-GAP is
        ever fit, bootstrapped, or compared against the real arm.
        Undetected in BATCH-003/004 because neither run reached this
        code path with real, non-empty data; first exposed by BATCH-005,
        the first run to do so. Moot for BATCH-005's own terminal label
        (C-SEARCH-BIAS fires first) but load-bearing for any future run
        that clears C-SEARCH-BIAS. Fixable at zero new search cost
        against already-collected data (BATCH-006's next action).
      standing_repair_adopted: >-
        A control's failure_consequence being named in a frozen decision
        rule does not establish its comparison logic was ever
        implemented. Verify any reused control by direct code reading the
        first time a run actually reaches its comparison logic with
        non-trivial data, not by citing that the control "ran" in a
        prior batch's review.
  claim_boundary: >-
