    until this run finally reached their code paths with real,
    non-empty data. This is the clearest demonstration yet in this
    campaign that "reused unchanged" code is not the same claim as
    "verified correct code," and that verification only happens when a
    real run actually exercises the path in question.
  outcome_summary: >-
    THE BUDGET-ALLOCATION FIX WORKED, ON BOTH ITS ADMISSION AND EXECUTION
    SIDES. For the first time in this campaign's history, the Phase -1
    gate PASSED (5 of 12 primes admitted, all 5 cleared M-COVERAGE>=0.5)
    and a real M-GAP was computed on real, in-session-computed delta_E
    labels (gamma_greedy=0.23354, gamma_random=0.40140, m_gap=+0.16786,
    CI [-0.4077, 1.3256], 4 usable primes, N in [203, 611]). Both
    reviewers independently confirmed real_execution_budget_v2's
    aggregate wall-clock counter behaves exactly as its pre-freeze fix
    specified (a 3.8x spread in per-prime wall_seconds_used directly
    falsifies any hidden per-prime-cap reading; independent re-summation
    matched the reported aggregate to five significant figures).
    THE TERMINAL LABEL, CONTROL-FAILURE-VOID, IS MECHANICALLY CORRECT BUT
    ITS EVIDENTIARY FORCE IS CHALLENGED ON TWO GROUNDS. (Red Team, O-4)
    C-SEARCH-BIAS's comparability rule has two clauses that disagree on
    this run's own numbers; only the low-power absolute-floor clause
    fires, and that floor has essentially no statistical power at n=20 --
    a possible FALSE control-failure (insufficient power to distinguish
    "no relationship in either arm" from "genuine contamination"), not a
    false pass, so the void stands but should not be read as confirmed
    contamination evidence. (Red Team, O-5, NEW) C-NULL-LABEL, the OTHER
    control the decision branch's own reason text cites, is DEAD CODE --
    its control_failure flag is initialized False and never reassigned in
    either implementation file. Moot for this run (C-SEARCH-BIAS fires
    first) but this is the first run ever to reach this code path with
    real data, so it is the first opportunity to notice a "required"
    control structurally cannot fail. Named GD-9.
    SEPARATELY, PD-2 (disclosed by the Executor, confirmed by both
    reviewers, O-6) INVALIDATES THE REPORTED gamma_greedy ON ITS OWN
    TERMS, INDEPENDENT OF THE CONTROL QUESTION: v1's inherited
    PER-PRIME-TRAPPED-EXCLUSION filter (trapped_fraction>0.5, stated in
    the spec's own text) was never implemented in the reused inline
    orchestration. All 4 contributing primes have trapped_fraction in
    [0.72, 0.85], exceeding the threshold. Under a correct filter, zero
    primes would remain and no gamma_greedy/m_gap would exist to report.
    Named GD-8.
    Both new defects are fixable at ZERO NEW SEARCH COST using data this
    run already collected -- the Red Team's own ranked recommendation for
    BATCH-006.
