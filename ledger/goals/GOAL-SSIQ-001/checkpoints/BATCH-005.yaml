  process_note: >-
    THIS BATCH ADDED A SECOND, NESTED PRE-FREEZE CATCH: the pre-freeze
    review of the v2 amendment itself found a hidden second instance of
    the very defect the amendment was written to fix (PF-1), one layer
    deeper in the same reused code than the amendment's own drafter had
