  outcome_summary: >-
    THE BATCH FAILED AT ITS PRIMARY QUESTION AND THE FAILURE IS INFORMATIVE,
    BECAUSE IT IS A FAILURE OF THE COORDINATOR'S INSTRUMENT AND WAS MEASURED
    RATHER THAN INFERRED.
    Run: external dataset obtained (authors' released WISDE results, 5379 files,
