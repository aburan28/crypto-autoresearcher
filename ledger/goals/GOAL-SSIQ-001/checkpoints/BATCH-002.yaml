    decision rule returned INCONCLUSIVE mechanically: alpha lies BELOW BOTH
    competing models (3/2 and 2).
    THE INSTRUMENT IS THE FINDING. Two independent null ensembles — different
    lattice families, different code — agree to 0.005 that the frozen window
    returns ~1.14 on an object with asymptotic alpha = 3/2 BY CONSTRUCTION, a
    bias of ~ -0.36, which is 1.8x the decision rule's own +-0.20 tolerance. A
    rank-4 object with true alpha = 2 returns 1.82. SUPPORTS-D1 WAS THEREFORE
    UNREACHABLE AT ANY DATA. The bias is saturation inside the retained window
    (~ -0.15) plus finite-T discreteness at T <= 45 (~ -0.21); a decile sweep
    peaks at 1.254 and never reaches 1.5, so no window choice would have saved
    it. On an exact power law the same estimator returns 1.500000.
    C-NULL FAILED, voiding the primary metric under the contract's own clause,
    and the Red Team explains why it COULD NOT have passed: the surrogate shares
    both endpoints with the real object, since Hermite gives
    gamma_3 (p/4)^{1/3} = (p/2)^{1/3}, reproducing Theorem 1.5's constant.
    Consequence: L1 IS CLOSED BY GENERICITY — still a ceiling, but with no claim
    to arithmetic depth, which raises N5's priority rather than lowering it.
    THE LANE IS RETIRED, NOT REPAIRED: T = p^{1/4} sits at x in [0.44, 0.71]
    (saturation) at every prime tested, versus x ~ 2^{-21} at log2 p = 256, so
    the accessible data never samples the regime the lever lives in;
    discrimination needs log2 p >~ 22.5.
    Cascade: no exponent is assigned to the [35] reductions anywhere, so NO 1/4
    CONDITION CHANGES and the goal is NOT rescoped to OneEnd — but GRH, an
    unstated lambda binding every future candidate, and non-inheritable concrete
    cost are now standing conditions.
    NOT ESTABLISHED: D1's exponent, in either direction. The pre-committed
    reversion did NOT fire and SUPPORTS-D1 did not fire either. Model
    independence is still absent and the campaign cap stays preliminary.
