      revisit_condition: >-
        R3 — reopen if a rank-4-or-higher object with log_p(det)/rank <= 1/4
        is exhibited, or if REC-1 returns alpha near 2 rather than 3/2.
    - id: L2
      state: OPEN
      detail: >-
        Obstruction field CORRECTED: it was an uncited fatigue report and was
        optimistic in direction. The generic exchange rate is e = 2*delta,
        i.e. WORSE than the 1:1 the goal record assumed. A4 (the correlation
        condition) is the admissible form of this lever and both its nulls are
        pre-computed: independent gives worse than 1/3, aligned gives exact
        break-even at 1/3 for every delta.
    - id: L3
      state: OPEN
      detail: >-
        Obstruction field CORRECTED: "k-way splits do not beat the two-list
        bound" is FALSE as a generality (Wagner's k-tree) and holds only in
        the unique-solution, no-group setting; it was also attached to the
        wrong symbol. A3 (non-materialised representation) is the unstated
        prerequisite that makes a c < 1 admissible at all.
    - id: L4
      state: OPEN
      priority: highest
      detail: >-
        PROMOTED, not demoted. Because the descent stage costs Otilde(p^{1/2})
        and the p^{1/4} phase is asymptotically free, the F_p route's ideal
        ceiling IS the target — the only lever of which that is true. Real
        obstruction: a hitting-time bound for a density-p^{-1/2} set in an
        expander. Lives iff a computable delta_E-gradient exists (REC-1b).
        Live gap: the published body was not obtained, so the memory profile
        is unknown.
    - id: L5
      state: OPEN
      detail: >-
        Recorded for honesty, not prioritised: it moves memory, not the time
        exponent. Its obstruction field was MISSING entirely in the goal
        record and is supplied there now.
    - id: N5
      state: OPEN
      minted_by: DEC-20260805-2be965
      detail: >-
        Structurally different auxiliary targets — oriented curves,
        prescribed-torsion targets, higher-dimensional targets. The single
        uncovered case inside L1's nearby-object control. Minted as its own
        lever so that a CLOSED verdict cannot absorb an open route. Needs a
        scoping pass before it can be audited.
    - id: A1
      state: OPEN-BUT-REFUTED-AT-BASELINE
      detail: >-
        Split arity k. The enumeration had NO lever on k, which the arithmetic
        says is one of only four places the target can sit. Its headline
        attraction is refuted by default: the naive k-way collision costs
        c = k-1, giving T = 4/9 at k = 3 — worse than the incumbent. Its
        payoff table must not enter BATCH-002 unqualified; the requirement
        reads "beat c = k-1", not "establish c = 1".
    - id: A7
      state: OPEN
      detail: >-
        Cross-ATTEMPT amortisation under re-randomisation, distinct from A5's
        cross-instance precomputation. Both packages fix
        TOTAL = per-attempt x P0^{-1} and no lever acts on the multiplication
        (Red Team O6, HIGH). Attempts are not independent — successive E' are
        joined by known small-degree walks, so tables compose. Invisible at
        the source's parameters, load-bearing in the lowered-threshold regime.
    - ids: [A2, A3, A4, A5, A6]
      state: OPEN
      detail: >-
        Relation families (A2, with a free refutation available via Remark 1:
        multiplicity is not degree), non-materialised representation (A3), the
        correlation condition for L2 (A4), amortised multi-instance (A5), the
        exponent-free register (A6). Recorded so none is silently dropped.
