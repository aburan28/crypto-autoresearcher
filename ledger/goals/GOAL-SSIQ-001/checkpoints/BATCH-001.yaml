  outcome_summary: >-
    THE BATCH'S MOST VALUABLE RESULTS ARE CORRECTIONS TO THE COORDINATOR'S OWN
    FRAMING, WHICH IS WHAT A PRE-COMPUTE FALSIFICATION BATCH IS FOR.
    Established: the 1/3 exponent decomposes as T = c*q*d/k + r with source
    values (1, 2, 1/3, 2, 0), so total time exponent = the Theorem 1.5 degree
    exponent and memory equals time; reaching 1/4 is exactly one
    multiplicative movement of 3/4 on c, q or d, or 4/3 on k. Two placements
    are provably unavailable (c = 3/4 forces memory > time; r has no solution
    since it needs P0 > 1). All 45 line locators re-extract verbatim AND
    support what they are claimed to support, on independent re-extraction.
    Lever L1 is CLOSED-IN-SCOPE: D1 bounds the fraction of curves with
    delta_E <= p^{1/4} by p^{-1/8+o(1)} and survived independent re-derivation,
    with the Validator resolving the producer's own open question (ingredient
    (c) contributes (np)^{o(1)}, not n^{1/2}). AOV Remark 4.3 corroborates
    unconditionally but does NOT carry the closure: D1 subsumes it.
    CORRECTED, and this is the part worth reading: the obstruction this
    program NAMED for L1 was a category error twice over (upper bounds cannot
    force a floor; on the rank-4 object they give exponent 1/2, weaker than
    the known 1/3), the governing object is the rank-3 trace-zero sublattice
    of discriminant p/4 where 1/3 = 1/rank, and FOUR OF FIVE obstruction
    fields in the goal record were defective. L4 was assumed dead and is the
    opposite: because the descent is the whole cost, Delfs-Galbraith's ideal
    ceiling is exactly p^{1/4} — the only lever whose ceiling meets the
    target. Seven levers the enumeration missed were added, including split
    arity k and cross-attempt amortisation A7.
    NOT ESTABLISHED: the published Delfs-Galbraith body (infrastructure
    outcome, never mathematical evidence), so the F_p memory profile is still
    unknown; D1 ingredient (d) has no fetched artifact; and model
    independence was unavailable, which caps everything here at preliminary.
  lever_states:
    - id: L1
      state: CLOSED-IN-SCOPE
      detail: >-
        Single-pillar, derivation-tier. Scoped to the target E^{(p)} and
        targets reachable from it by a known small-degree isogeny. Case N5 is
        NOT covered and is minted below as its own lever.
      reversion_condition: >-
        Carried verbatim from the producer's pre-commitment, which did NOT
