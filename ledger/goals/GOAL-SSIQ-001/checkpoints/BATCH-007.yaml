  new_defects_recorded:
    - id: GD-11
      raised_by: [TASK-20260805-b73a2e]
      severity: medium
      summary: >-
        dht.ols_loglog_fit's degeneracy guard (an exact-float sxx==0.0
        comparison after IEEE-754 summation of n copies of log(N)) does
        not reliably fire on genuinely degenerate designs, because
        whether the sum-then-divide round-trips to bit-identical log(N)
        depends on log(N)'s specific mantissa bits, unrelated to the
        actual data. Independently reproduced by the Red Team from first
        principles across a grid wider than the Executor's own
        disclosure, finding the failure recurs at N=324 (prime 3889's own
        real N value, used in every real-arm bootstrap to date) at n=3 --
        the exact resample size this batch's own new CHECK 3 introduces
        -- and can produce a spurious, plausible-looking nonzero gamma
        (0.5), not merely a harmless 0.0. Confirmed NOT to contaminate any
        currently-archived real result (every real bootstrap to date used
        n=4 over a value set the guard correctly handles), a fact checked
        directly by both reviewers, not assumed. Fixable at zero new
        search cost: harden the guard to compare inputs directly
        (max(xs)==min(xs)) rather than a post-summation derived value.
      standing_repair_adopted: >-
        A degeneracy/edge-case guard implemented as an exact
        floating-point equality check after a summation is not reliable
        due to IEEE-754 rounding; compare the inputs directly for the
        exact condition, or use an epsilon-relative tolerance, never a
        post-summation exact-zero check.
