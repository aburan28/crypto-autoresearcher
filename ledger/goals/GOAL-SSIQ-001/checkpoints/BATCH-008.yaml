      summary: >-
        The frozen v5 contract's required trapped-vs-structural cross-
        check compared greedy_descent_hitting_time's "trapped" flag
        (a property of the walk's TERMINAL vertex, never exposed by the
        function's return value) against is_structural_local_min(START)
        -- the wrong vertex whenever start is not itself a local minimum
        (the majority case). PF-6's underlying mathematical argument
        (in round 1 of this amendment's own pre-freeze review) is correct
        for the terminal vertex; the frozen contract's operational
        concretization silently substituted the start vertex. Confirmed
        independently by the Executor (who did not improvise past the
        failure, per this task's own governing instruction), the
        Validator (re-tracing the Executor's own example), and the Red
        Team (constructing an entirely separate counter-example at a
        different prime). The Red Team additionally found a second,
        independent boundary-condition defect at the delta_E=1 success
        case (start==terminal, but the walk is unconditionally labelled
        trapped=False), exactly matching the F_p-rational vertex count in
        each prime's disagreement total -- a naive terminal-vertex fix
        alone would newly misclassify every successful walk. Fixable at
        zero new search cost: supersede greedy_descent_hitting_time
        (never edit) to expose the terminal vertex, and restrict the
        cross-check to trapped: True walks, excluding the delta=1 case.
      standing_repair_adopted: >-
        Any pre-freeze finding that asserts a mathematical equivalence,
