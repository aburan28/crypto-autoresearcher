    coordination/goals/GOAL-SSIQ-001/batches/BATCH-003/ or BATCH-004/.
    Recorded so the absence reads as a process choice, not an oversight.
  latest_verified_commit: a925cf30eadb65f636f06c95ee83cbc02073f857
  latest_verified_commit_note: >-
