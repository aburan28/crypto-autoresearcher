  instrument_calibration:
    recorded_by: DEC-20260805-be2f87
    applies_to: any exponent estimated on the released WISDE delta_E data
    detail: >-
      THE FROZEN EXP-SSIQ-4de240 W-MAIN WINDOW IS BIASED BY ~ -0.36 IN THE
      T-EXPONENT. Two independent null ensembles (different lattice families,
      different code) agree to 0.005: the window returns ~1.14 on an object
      whose asymptotic exponent is 3/2 by construction, and 1.82 on one whose
      exponent is 2. On an exact power law it returns 1.500000. The bias is
      saturation inside the retained window (~ -0.15) plus finite-T discreteness
      at T <= 45 (~ -0.21); a decile sweep peaks at 1.254 and never reaches 1.5.
      Any later fit on this data inherits this bias unless its estimator is
      shown not to.
    standing_practice_adopted: >-
      RUN THE FROZEN ESTIMATOR ON AN OBJECT WITH THE TARGET EXPONENT BEFORE
      FREEZING THE CONTRACT. It costs nothing and would have caught this.
