        the wrapper itself through both its branches.
      standing_repair_adopted: >-
        Effective BATCH-007 onward: a validation artifact (a synthetic
        self-test, a unit test, a null-object control's comparison logic)
        must be verified to actually CALL the specific function/branch it
        is built to validate, not merely to exercise library code that
        function happens to reuse. When a pre-freeze review requires a
        self-test BECAUSE a specific wrapper is unreachable on real data,
        the pre-freeze review's own required_controls names the exact
        function the self-test must call, not just describes the desired
        behavior in prose -- the fix for a validation gap can itself have
        the identical validation gap, one layer further in, and checking
        that requires the same direct-code-reading discipline GD-9's own
        repair established, applied recursively to the repair itself.
    - id: GD-11
      raised_by: [TASK-20260805-b73a2e]
      severity: medium
      detail: >-
        NAMED IN BATCH-007, BY THE RED TEAM, WHILE CLOSING GD-10 -- A
        DIFFERENT SPECIES THAN GD-4 THROUGH GD-10 (all wrapper/formula/
        control-comparison-logic defects): a numerical-robustness defect
        in SHARED LIBRARY CODE, dht.ols_loglog_fit
        (experiments/EXP-SSIQ-58b642/implementation/descent_hitting_time.py),
        imported unchanged into every experiment's descent-fit machinery
        since BATCH-003. Its degeneracy guard (if sxx == 0.0: raise
        ValueError, checking an exact float equality AFTER summing n
        copies of log(N) and dividing by n) does not reliably fire on
        genuinely degenerate designs: whether the sum-then-divide
        round-trips to bit-identical log(N) depends on log(N)'s specific
        mantissa bits, unrelated to any property of the actual data.
        Surfaced when BATCH-007's own GD-10 fix introduced the first test
        in this campaign's history to exercise a 3-point bootstrap
        resample (CHECK 3, at the NULL_ARM_MIN_PRIMES=3 floor); the
        Executor disclosed one instance (N=500, n=3, worked around in
        CHECK 3's own construction). The Red Team independently
        reproduced the mechanism from first principles and swept a wider
        grid, finding it recurs at multiple (N, resample-size)
        combinations, is NOT merely cosmetic (confirmed to produce a
        spurious, plausible-looking nonzero gamma at N=611/n=6 using a
        real campaign value rather than a benign 0.0), and -- materially
        beyond the original disclosure -- recurs at N=324, which is
        prime 3889's own real N value, already used in every real-arm
        bootstrap this campaign has run, at exactly n=3. Both reviewers
        independently confirmed NO currently-archived real result is
        contaminated: every real bootstrap to date resampled at n=4 over
        the fixed set {203,324,478,611}, and the guard correctly fires
        for all four values at that specific resample size -- but this is
        a coincidence of that value set and resample size, not a
        structural guarantee (N=324 IS anomalous at n=3/6/7/8; N=611 is
        anomalous at every n>=5 tested). The null arm's fit-and-bootstrap
        branch has never yet executed on real data, so no already-
        computed null-arm CI is at risk retroactively -- but the next
        real dispatch that reaches it at a small survivor count including
        prime 3889 is at genuine, non-hypothetical risk. Fixable at zero
        new search cost: harden the guard to compare inputs directly
        (max(xs)==min(xs)) rather than a post-summation derived value.
      standing_repair_adopted: >-
        A degeneracy/edge-case guard implemented as an exact
        floating-point equality check after a summation is not reliable,
        because IEEE-754 rounding of a sum-then-divide sequence does not
        always round-trip to bit-identical inputs, independent of whether
        the underlying data is genuinely degenerate. Compare the INPUTS
        directly for the exact condition (e.g. max(xs)==min(xs)), or use
        an epsilon-relative tolerance keyed to the operands' magnitude --
        never rely on a post-summation exact-zero check as a proxy for
        input degeneracy.
    - id: GD-12
      raised_by: [TASK-20260806-b3c2fc, TASK-20260806-3c6363, TASK-20260806-bf15ab]
      severity: medium
      detail: >-
        NAMED IN BATCH-008, THE LAST BATCH OF THIS GOAL'S CAMPAIGN BUDGET,
        WHILE RUNNING THE TRAPPING-MECHANISM DIAGNOSTIC DEFERRED SINCE
        BATCH-006 -- A NEW CATEGORY, DISTINCT FROM GD-4 THROUGH GD-11
        (production-code, control-comparison-logic, and numerical-
        robustness defects): a specification-authoring defect, where an
        unconditional mathematical claim asserted with high confidence in
        a pre-freeze review's OWN PROSE (PF-6, round 1 of specification_v5's
        pre-freeze review) was transcribed into frozen contract text as
        fact without being checked against a concrete numerical trace. The
        frozen v5 contract's required trapped-vs-structural cross-check
        compared greedy_descent_hitting_time's "trapped" flag (a property
        of the walk's TERMINAL vertex, never exposed by the function's
        return value) against is_structural_local_min(START) -- the wrong
        vertex whenever start is not itself a local minimum, the majority
        case. PF-6's underlying mathematical argument is correct for the
        terminal vertex; the frozen contract's operational concretization
        silently substituted the start vertex. The cross-check failed on
        ALL FOUR primes (93/203, 138/324, 234/478, 267/611 disagreements).
        Confirmed independently by the Executor (who ran the check
        exhaustively and did not improvise past the failure, per this
        campaign's own governing instruction), the Validator (re-tracing
        the Executor's own p=2437 example end to end), and the Red Team
        (constructing an entirely separate counter-example at p=3889 the
        Executor never used). THE INSTRUMENT (greedy_descent_hitting_time,
        frozen and unchanged since BATCH-003) WORKED EXACTLY AS BUILT AND
        FAILED LOUDLY AND REPRODUCIBLY -- this is not a repeat of GD-9/
        GD-10 (a check that structurally cannot fail, or doesn't call the
        right function); the defect is upstream, in what the frozen
        contract told a working instrument to compare. The Red Team
        additionally found a second, independent boundary-condition
        defect at the delta_E=1 "success" case (start==terminal, walk
        unconditionally labelled trapped=False), exactly matching the
        F_p-rational vertex count in each prime's disagreement total -- a
        naive terminal-vertex fix alone would newly misclassify every
        successful walk. The structural local-minimum fractions the
        diagnostic computed (0.41-0.47 per prime) remain valid and
        independently confirmed by both reviewers via bit-exact
        reproduction, and reveal a real, quantified funnelling signal
        against the 72-85% walk-based trapped_fraction. Fixable at zero
        new search cost: supersede greedy_descent_hitting_time (never
        edit) to expose the terminal vertex, and restrict the cross-check
        to trapped: True walks, excluding the delta_E=1 case.
      standing_repair_adopted: >-
        Any pre-freeze finding that asserts a mathematical equivalence,
        invariant, or "provably exact" claim as the justification for a
        required check must be accompanied by a concrete, executed trace
        of at least one non-trivial instance before that claim is written
        into frozen contract text as unconditional fact -- applied
        uniformly within a single review, not selectively to some
        findings and not others (round 2 of specification_v5's own
        pre-freeze review applied this correctly to PF-9 but not to PF-6,
        in the same document). Extends the GD-9/PF-9 "trace it, don't
        trust it" lineage explicitly to a reviewer's own mathematical
        reasoning, not only to code and data claims.
      status: CLOSED
      closed_by: DEC-20260806-498531
      closed_at: '2026-08-06'
      closure_note: >-
        CLOSED IN BATCH-009. specification_v6.yaml supersedes
        greedy_descent_hitting_time (never editing the frozen original)
        with greedy_descent_hitting_time_v2, exposing the terminal vertex,
