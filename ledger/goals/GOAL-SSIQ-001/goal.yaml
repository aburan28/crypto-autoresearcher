  related_goals:
    - GOAL-P13-001
    - GOAL-SSI-001
  related_goals_note: >-
    GOAL-P13-001 ASSESSES the archived p^{1/3+o(1)} attack (is Heuristic 1
    sound, what is the concrete NIST-level margin). THIS GOAL ASKS THE OPPOSITE
    QUESTION: taking the result as given, what would have to move to reach a
    lower exponent. They share primary text and must not share conclusions:
    GOAL-P13-001's concrete-cost findings (EV-PEC-2e67ff, EV-PEC-857664 — the
    measured per-entry overhead refuting the paper's Section 4.1 convention)
    are INPUTS here and are cited, never re-derived and never restated as this
    goal's own evidence. GOAL-SSI-001 owns post-SIDH mechanism screening
    broadly; this goal is narrower and exponent-specific, and any mechanism it
    surfaces that is not exponent-carrying belongs there, not here.
  scheme_context:
    problem: >-
      the supersingular isogeny problem over F_{p^2}, via OneEnd (given
      supersingular E/F_{p^2}, find a non-scalar endomorphism) and the
      endomorphism ring problem, per Theorem 1.1 and Corollary 1.2 of the
      archived source
    incumbent_baselines:
      unconditional: "p^{1/2} * (log p)^{O(1)} time at polynomial memory"
      heuristic_conditional: >-
        p^{1/3+o(1)} time AND memory, conditional on Heuristic 1 of the
        archived source, above a superpolynomial o(1) the source discloses
      heuristic_conditional_correction_20260805: >-
        CORRECTED BY DEC-20260805-be2f87 D-7, on EV-SSIQ-29fcbb O-10. The field
        above is RIGHT for OneEnd and EndRing and WRONG for the SUPERSINGULAR
        ISOGENY PROBLEM, which this goal names as its target. Isogeny is reached
        only through [35, Proposition 8.5], which is stated ASSUMING THE
        GENERALISED RIEMANN HYPOTHESIS — and GRH does not appear in the frozen
        source's Corollary 1.2 assumptions. So for the isogeny problem the tier
        is conditional on Heuristic 1 AND GRH, not on Heuristic 1 alone. This
        campaign had been quoting it the wrong way throughout.
        Two further riders arrive with the same reading and are recorded in
        standing_conditions below.
      tradeoff_curve: >-
        van Oorschot-Wiener claw finding at memory w: time ~ sqrt(N^3/w) =
        p^{1/2+o(1)}/w^{1/2} for N = p^{1/3+o(1)}. The two baselines are
        endpoints of ONE curve, so any candidate must say where on it it sits.
      f_p_restricted: >-
        Otilde(p^{1/4}) for the F_p-restricted problem (Delfs-Galbraith),
        carried at confidence relayed_from_abstract AND CONTESTED ACROSS
        RETRIEVALS (KN-TECH-058 RC4). NOT a baseline for this goal's target
        problem and NOT evidence that exponent 1/4 is reachable over F_{p^2}.
      f_p_restricted_update_20260805: >-
        SHARPENED BY BATCH-001 (EV-SSIQ-e43afd O-8, DEC-20260805-2be965 D-4).
        RC4 is RESOLVED WITH A MECHANISM: arXiv holds one version whose METADATA
        abstract carries no complexity figure at all while its LATEX SOURCE
        abstract does, and the published Springer abstract is word-for-word the
        LaTeX one. The split was arXiv-metadata-versus-paper-text, NOT
        preprint-versus-published as the corpus conjectured, and both earlier
        retrievals were correct readings of what they fetched. The figure is a
        HEURISTIC birthday bound for a HIGH-STORAGE bi-directional search, with
        memory UNSTATED — and now known to be absent from the preprint body
        rather than merely unretrieved. The published BODY was not obtained
        (infrastructure outcome, AGENTS.md rule 5).
        KN-TECH-058's own confidence label is NOT changed here: a knowledge
        record is corrected by supersession under /curate-knowledge, not as a
        side effect of another goal's ledger archive.
        THE PROHIBITION ABOVE STANDS UNCHANGED — this is still not evidence that
        exponent 1/4 is reachable over F_{p^2}. What did change is the reading
        of L4: see levers.
    target_exponent_note: >-
      "0.25" names the search target the user set: time p^{1/4+o(1)} for the
      general F_{p^2} problem. It is deliberately NOT stated as a completion
      criterion below, because a criterion this program cannot cause to be true
      is not a criterion — it is a wish, and pinning closure to it would either
      block the campaign forever or invite a weakened restatement later.
      Criterion 4 is where a genuine sub-1/3 mechanism lands if one is found.
    affected_scope_if_a_result_were_obtained: >-
      The archived source names its own affected set (CGL, the SQIsign family,
      GPS signatures, PRISM, ⊗-MIKE) and names as out of range all
      group-action constructions like CSIDH and torsion-based key exchanges
      like M(D)-SIDH, FESTA and POKE, on the ground that other cryptanalysis
      dominates those. That scope is THE SOURCE'S, is inherited unchanged, and
      may not be widened by any record under this goal.
  exponent_budget:
    note: >-
      The decomposition below is the campaign's spine and its first
      deliverable. It was transcribed as an OPENING READING and has now been
      re-derived from primary text by TASK-20260805-85af9d and independently
      re-derived by TASK-20260805-89a2e7; the factor rows below are RETAINED AS
      WRITTEN and their corrections are recorded in exponent_budget.corrections,
      not applied by edit.
      CITATION CORRECTED (DEC-20260805-2be965 D-6a): this note originally cited
      "proof-of-Theorem-1.1 lines 177-218". That is wrong twice. The proof of
      Theorem 1.1 is lines 193-220; lines 177-185 are the proof of Lemma 3.4.
      Worse, the cited range OMITS the sources of two of the four factors
      entirely — Theorem 1.5 at line 81 carries all of F1, and Lemmas 3.2/3.3
      carry all of F3. The same wrong range was copied into RQ-SSIQ-9702af and
      the BATCH-001 opening; both are corrected by the same decision.
    factors:
      - id: F1
        name: structural degree bound
        exponent: 1/3
        statement: >-
          Theorem 1.5, attributed to [4]: for supersingular E/F_{p^2} there
          exists an isogeny E -> E^{(p)} of degree at most (p/2)^{1/3}.
        moves_total_as: >-
          the total is X^2 where X ~ (deg bound)^{1/2}, so total exponent =
          F1 exponent. Reaching 1/4 via F1 alone needs a degree bound with
          exponent 1/4.
      - id: F2
        name: split exponent
        exponent: 1/2 (of F1)
        statement: >-
          a B-smooth degree splits as phi = eta o psi with both sides of degree
          at most X = B^{1/2}(p/2)^{1/6} (Lemma 3.4).
      - id: F3
        name: list cardinality
        exponent: 1/3 jointly with F1, F2
        statement: >-
          |L(E,X,B)| = Psi(X,B) * X^{1+o(1)} = X^{2+o(1)} = p^{1/3+o(1)}:
          ~X admissible smooth degrees, and ~d cyclic isogenies of degree d.
          THIS IS THE QUADRATIC FACTOR and the reason memory equals time.
      - id: F4
        name: inverse success probability
        exponent: 0
        statement: >-
          P0^{-1} = u^{u(1+o(1))} = p^{o(1)} at B = e^{(1/3)sqrt(log(p/2))}
          under Heuristic 1 (Lemma 3.5).
        consequence: >-
          F4 CARRIES NO EXPONENT, so no exponent can be recovered from it. Any
          proposal whose saving comes from "improving the success probability"
          is confusing an o(1) with an exponent and is refuted at the whiteboard.
    levers:
      - id: L1
        targets: F1
        claim_that_would_have_to_be_true: >-
          a degree bound on the minimal isogeny E -> E^{(p)} (or to another
          cheaply-recognisable auxiliary target) with exponent 1/4 rather than
          1/3, holding for all supersingular E or for a p^{-o(1)} fraction.
        named_obstruction_to_audit_first: >-
          Minkowski-type lower bounds on the minimum of the rank-4 quaternion
          lattice underlying Hom(E, E^{(p)}) with the form Nrd/p. If the
          lattice determinant forces a minimum matching exponent 1/3, L1 is
          CLOSED and the ceiling argument is itself a useful, publishable
          negative. AUDIT THIS BEFORE ANY IMPLEMENTATION.
      - id: L2
        targets: F3
        claim_that_would_have_to_be_true: >-
          a restricted family F contained in L(E,X,B) of cardinality
          X^{2-delta} that still contains the required psi with probability
          p^{-o(1)}, i.e. a restriction that shrinks the list strictly faster
          than it shrinks the hit probability.
        named_obstruction_to_audit_first: >-
          the exchange rate is the whole question and is usually 1:1 — every
          natural restriction tried so far divides the list and the hit
          probability by the same factor. The cheap pre-compute test is a toy
          measurement of that exchange rate, not an argument about it.
      - id: L3
        targets: the collision mechanism fed by F3
        claim_that_would_have_to_be_true: >-
          the middle-curve equality test admits a sieve or index-calculus-style
          search below list cardinality, exploiting modular-polynomial
          structure on j-invariants that generic claw finding cannot see.
        named_obstruction_to_audit_first: >-
          for UNSTRUCTURED claw finding, k-way splits do not beat the two-list
          bound; a proposal must exhibit the structure it exploits, and a
          null-object control (the same search on a structure-free surrogate)
          must FAIL to find the shortcut before any speedup is believed.
      - id: L4
        targets: F1 and the problem's geometry jointly
        claim_that_would_have_to_be_true: >-
          a descent to the F_p-rational subgraph cheaper than p^{1/2}. The
          object is natural: E lies on the F_p locus exactly when E ≅ E^{(p)},
          i.e. when the minimal E -> E^{(p)} degree is 1, so the archived
          theorem is already a statement that every curve is within degree
          p^{1/3} of the degenerate stratum of the same invariant.
        named_obstruction_to_audit_first: >-
          the F_p locus has size ~p^{1/2} inside ~p/12 curves, and the
          Otilde(p^{1/4}) figure attached to it is CONTESTED in this corpus
          (KN-TECH-058 RC4). Establish the true F_p-side cost from the
          published paper before building anything on it; a lever resting on a
          contested figure is a lever resting on nothing.
      - id: L5
        targets: memory, not time
        claim_that_would_have_to_be_true: >-
          a point strictly below the van Oorschot-Wiener curve
          sqrt(N^3/w) — i.e. a genuine improvement of the tradeoff rather than
          a relabelling of a point already on it.
        status_note: >-
          RECORDED FOR HONESTY, NOT PRIORITISED: it does not move the time
          exponent and so does not serve this goal's target. It is here so that
          a memory result is never mistaken for a time result, in either
          direction.
    lever_completeness_disclaimer: >-
      L1-L5 is an OPENING ENUMERATION by the Coordinator, not a proof of
      exhaustiveness. BATCH-001 explicitly asks its producers to add levers,
      and no later record may treat "not in L1-L5" as "not a route".
  exponent_budget_corrections:
    recorded_by: DEC-20260805-2be965
    recorded_at: '2026-08-05'
    note: >-
      The factor rows above are RETAINED AS WRITTEN. Corrections supersede,
      never overwrite (AGENTS.md immutability). Every item below was established
      by TASK-20260805-85af9d and independently confirmed by TASK-20260805-89a2e7.
    items:
      - factor: F1
        verdict: CONFIRMED_IN_SUBSTANCE_LOCATOR_CORRECTED
        detail: >-
          Theorem 1.5 is at line 81, not inside the cited range; it ENTERS the
          argument at line 177, which opens the proof of Lemma 3.4, not of
          Theorem 1.1. Attribution to [4] stands as CITED-NOT-VERIFIED: [4] is
          Aubry-Oyono-Vincent (arXiv:2607.14624), fetched in BATCH-001 but not
          verified line-by-line as a proof.
      - factor: F2
        verdict: CORRECTED
        detail: >-
          The split bound is NOT in the statement of Lemma 3.4 — line 160
          contains no X. It is Algorithm 2 step 1 (line 167) plus the proof at
          lines 177-181. "1/2 of F1" understates the operative identity, which
          is X = (B*D)^{1/2} exactly, so X^2 = B*D.
      - factor: F3
        verdict: CORRECTED
        detail: >-
          Cardinality is Lemma 3.2 (line 133), not Lemma 3.3 (line 154, which is
          the running-time lemma). The paper states <=, not =; the matching
          lower bound appears only in section 4.1, which the source itself
          frames as a rough estimate under optimistic assumptions. Validator
          condition V6: "q = 2 is pinned two-sidedly" overstates the lower half
          and must be written as "upper bound proved on a cited count; lower
          bound asserted in the source's rough-cost section".
      - factor: F4
        verdict: CONFIRMED_AND_STRENGTHENED
        detail: >-
          Upgraded from observation to argument: r >= 0 because P0 is a
          probability. NARROWING: the batch opening's "refuted at the
          whiteboard, for free" is correct about the EXPONENT and would
          overstate if carried to practical impact — frozen text Remark 1
          (line 191) calls the same phenomenon practically relevant. The Red
          Team tested the joint B-move and found the cost doubly one-sided.
      - factors: [F5, F6, F7, F8]
        verdict: ADDED
        detail: >-
          Four omitted exponent-free factors: the smoothness parameter B, the
          walk length, the collision mechanism, and per-step arithmetic. All
          carry exponent 0 so the accounting is unchanged — but F7 was the
          unnamed target of both L3 and L5.
      - factor: composition
        verdict: OPEN_DEFECT
        detail: >-
          Red Team objection O6 (HIGH), NOT repaired by this decision because it
          needs work rather than an edit: both packages fix
          TOTAL = per-attempt x P0^{-1}, every symbol in T = c*q*d/k + r lives
          inside ONE attempt, and no lever acts on the multiplication. Lever A7
          is minted for exactly this.
      - factor: admissibility_criterion
        verdict: CORRECTED
        detail: >-
          The audit's own criterion ("rank-3 with disc << p^{3/4}, or rank < 3 —
          the only two ways") is false. The condition is
          log_p(det)/rank <= 1/4, which admits rank 4 with det <~ p. Rank > 3 is
          exactly where N5's higher-dimensional case lives.
  lever_corrections:
    recorded_by: DEC-20260805-2be965
    recorded_at: '2026-08-05'
    note: >-
      THE OBSTRUCTION FIELDS ABOVE WERE MOSTLY WRONG, AND THAT IS THE SINGLE
      MOST IMPORTANT RESULT OF BATCH-001. Four of five were defective. The rows
      above are retained; read them only with these corrections attached.
      Current lever states are in ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-001.yaml.
    items:
      - lever: L1
        state: CLOSED-IN-SCOPE
        obstruction_field_verdict: CATEGORY_ERROR_TWICE_OVER
        detail: >-
          Minkowski/Hermite bounds are UPPER bounds and cannot force a floor;
          and on the rank-4 object (P, Nrd/p) they give exponent 1/2, WEAKER
          than the known 1/3. The governing object is the rank-3 trace-zero
          sublattice of Hom(E, E^{(p)}), discriminant p/4, with N_1 = delta_E
          and p/4 <= N_1 N_2 N_3 <= p/2; the 1/3 is 1/rank. The Validator
          confirmed the replacement reproduces Theorem 1.5's CONSTANT.
          Closed on ONE pillar at derivation tier (D1), corroborated by AOV
          Remark 4.3 which D1 subsumes. Scoped: N5 not covered.
      - lever: L2
        state: OPEN
        obstruction_field_verdict: UNCITED_AND_OPTIMISTIC_IN_DIRECTION
        detail: >-
          The generic exchange rate is e = 2*delta, i.e. WORSE than the 1:1 the
          field assumed. A4 is the admissible form of this lever, with both
          nulls pre-computed: independent gives worse than 1/3; aligned gives
          exact break-even at 1/3 for every delta.
      - lever: L3
        state: OPEN
        obstruction_field_verdict: FALSE_AS_A_GENERALITY_AND_MISATTACHED
        detail: >-
          "k-way splits do not beat the two-list bound" is false in general
          (Wagner's k-tree); it holds only in the unique-solution, no-group
          setting, and was attached to the wrong symbol. A3 (non-materialised
          representation) is the unstated prerequisite that makes c < 1
          admissible at all.
      - lever: L4
        state: OPEN
        priority: highest
        obstruction_field_verdict: AIMED_AT_THE_WRONG_COST
        detail: >-
          The field aimed the expensive work at sourcing when the structural
          fact sat at line 51 of an already-frozen in-repo file. And the
          Coordinator's inference from the finding ran backwards: "the p^{1/4}
          phase is asymptotically free" means the DESCENT is the whole cost,
          which makes Delfs-Galbraith's ideal ceiling exactly p^{1/4} — the
          goal's target, and the only lever of which that is true. Real
          obstruction: a hitting-time bound for a density-p^{-1/2} set in an
          expander. Lives iff a computable delta_E-gradient exists.
      - lever: L5
        state: OPEN
        obstruction_field_verdict: MISSING_ENTIRELY
        detail: >-
          No obstruction field was supplied. It is: a point strictly below the
          van Oorschot-Wiener curve sqrt(N^3/w) requires improving the tradeoff
          rather than relabelling a point already on it. Still not prioritised —
          it moves memory, not the time exponent.
    levers_added:
      note: >-
        The completeness disclaimer earned its keep. These were missed by the
        Coordinator's L1-L5 and are now first-class rows.
      items:
        - id: N5
          summary: >-
            Structurally different auxiliary targets (oriented curves,
            prescribed-torsion, higher-dimensional). The one case L1's
            nearby-object control does not reach. Minted separately so a CLOSED
            verdict cannot absorb an open route.
        - id: A1
          summary: >-
            Split arity k — one of only four places the target can sit, and the
            enumeration had no lever on it. Refuted at its naive baseline:
            c = k-1 gives T = 4/9 at k = 3, worse than the incumbent. Its
            requirement reads "beat c = k-1", never "establish c = 1".
        - id: A7
          summary: >-
            Cross-ATTEMPT amortisation under re-randomisation (distinct from
            A5's cross-instance precomputation). Successive E' are joined by
            known small-degree walks, so tables compose. Invisible at the
            source's parameters; load-bearing in the lowered-threshold regime.
        - ids: [A2, A3, A4, A5, A6]
          summary: >-
            Relation families; non-materialised representation; the correlation
            condition for L2; amortised multi-instance; the exponent-free
            register. Recorded so none is silently dropped.
  standing_conditions:
    recorded_by: DEC-20260805-be2f87
    recorded_at: '2026-08-05'
    note: >-
      Conditions every future candidate under this goal must satisfy, added by
      BATCH-002's costing of the [35] cascade (EV-SSIQ-29fcbb O-9, O-10). None
      moves an exponent; all three change what a candidate must say.
    items:
      - id: SC-1
        condition: >-
          A statement about the SUPERSINGULAR ISOGENY PROBLEM is conditional on
          Heuristic 1 AND GRH. Only OneEnd and EndRing are conditional on
          Heuristic 1 alone.
      - id: SC-2
        condition: >-
          EVERY CANDIDATE MUST RETURN log deg alpha = (log p)^{O(1)}. Theorem
          7.2 of [35] reduces EndRing to OneEnd_lambda for an unstated lambda;
          the frozen source's Problem 2.2 is UNBOUNDED OneEnd and bounds no
          deg alpha. A candidate producing an endomorphism of unbounded degree
          does not feed the cascade, whatever its exponent.
      - id: SC-3
        condition: >-
          CONCRETE COST IS NOT INHERITABLE ACROSS THE CASCADE. Its only explicit
          exponent — 12, in Theorem 7.2's per-iteration success probability
          Omega((log N)^{-12}) — propagates to 2^96 - 2^192 at log2 p = 256
          against a 2^{85.3} headline. No record may carry a concrete figure
          from OneEnd to EndRing or Isogeny.
  instrument_calibration:
    recorded_by: DEC-20260805-be2f87
    applies_to: any exponent estimated on the released WISDE delta_E data
    detail: >-
      THE FROZEN EXP-SSIQ-4de240 W-MAIN WINDOW IS BIASED BY ~ -0.36 IN THE
      T-EXPONENT. Two independent null ensembles (different lattice families,
      different code) agree to 0.005: the window returns ~1.14 on an object
      whose asymptotic exponent is 3/2 by construction, and 1.82 on one whose
      exponent is 2. On an exact power law it returns 1.500000. The bias is
      saturation inside the retained window (~ -0.15) plus finite-T discreteness
      at T <= 45 (~ -0.21); a decile sweep peaks at 1.254 and never reaches 1.5.
      Any later fit on this data inherits this bias unless its estimator is
      shown not to.
    standing_practice_adopted: >-
      RUN THE FROZEN ESTIMATOR ON AN OBJECT WITH THE TARGET EXPONENT BEFORE
      FREEZING THE CONTRACT. It costs nothing and would have caught this.
