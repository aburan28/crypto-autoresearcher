# Sharded goal record. The mutable head lives here; the checkpoint log lives
# one-file-per-batch under checkpoints/ so that a batch close in another
# worktree does not conflict with this file (CLAUDE.md, "Goal checkpoints are
# one file per batch"). validate_ledger.py merges the two before checking
# anything. Checkpoint shards are WRITE-ONCE.
research_goal:
  id: GOAL-SSIQ-001
  title: >-
    Toward p^{1/4}: which exponent-carrying factor of the p^{1/3+o(1)}
    supersingular isogeny algorithm can move, and what closes the ones that
    cannot
  objective: >-
    Attack the exponent of the supersingular isogeny problem over F_{p^2} where
    it is actually attackable: not by asserting a p^{1/4} algorithm, but by
    decomposing the archived p^{1/3+o(1)} result (eprint 2026/1486, frozen
    in-repo at inputs/P13-WESOLOWSKI-2026/paper_fulltext.md) into its
    separately-quantified exponent-carrying factors, enumerating every lever
    that could move one of them, subjecting each lever to a method-ceiling
    audit BEFORE expensive work, and then advancing the survivors to
    falsifiable hypotheses with frozen contracts and independent review.
    The deliverable of the campaign is a decided lever map: each route either
    CLOSED by a committed ceiling argument or executed falsification, or OPEN
    with a designed minimal discriminating test, or ADVANCED with a charged
    cost model whose time exponent over F_{p^2} is strictly below 1/3.
    A p^{1/4} algorithm is the TARGET OF THE SEARCH, not a deliverable this
    record promises, predicts, or claims to be near.
  question_ids: [RQ-SSIQ-9702af]
  active_hypothesis_ids: []
  status: active
  status_value_history:
    - value: draft
      in_force_until: '2026-08-05'
      note: >-
        Created and activated 2026-08-05 in one act, on the user's explicit
        direction this session ("create a new goal to breakthrough and find a
        0.25 algorithm for this problem https://eprint.iacr.org/2026/1486").
        This is a USER AUTHORIZATION RECORDED BY THE COORDINATOR, not a
        Coordinator self-grant. Activation asserts nothing: no hypothesis
        exists, active_hypothesis_ids is empty, no completion criterion is met
        or approached, no exponent below 1/3 is claimed at any tier, and no
        knowledge entry is promoted by this record.
  owner: coordinator
  runtime:
    provider: none
    goal_id: null
    runtime_note: >-
      No durable goal API is available under this harness. The ledger record IS
      the persistent goal (per /coordinate-research-goal step 4, recorded
      explicitly rather than left implicit). Per-role model policies do not
      resolve under this Claude Code binding either: every alias falls back to
      the session model, so every task under this goal records requested_policy
      alongside the resolved model with fallback_used: true, and independence
      between producer and reviewer is SESSION independence, not model
      independence. That cap on evidence strength is stated up front because it
      bounds what this campaign can ever promote.
  campaign_budget:
    maximum_batches: 8
    total_wall_clock_seconds: 28800
    max_concurrent: 3
  current_batch_id: BATCH-001
  dispatch_queue_path: coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: null
  latest_verified_commit_note: >-
    NULL BY CONSTRUCTION: this record is being created, so no Coordinator
    archive has yet verified anything under it. The first snapshot archive of
    BATCH-001 sets this field. Do not backfill it with the commit that
    introduces this file — that commit has not been through a post-commit
    verifier, and an unverified sha in this field is exactly the defect
    CORR-20260802-a1f151 and CORR-20260802-7787de were raised about.
  related_goals:
    - GOAL-P13-001
    - GOAL-SSI-001
  related_goals_note: >-
    GOAL-P13-001 ASSESSES the archived p^{1/3+o(1)} attack (is Heuristic 1
    sound, what is the concrete NIST-level margin). THIS GOAL ASKS THE OPPOSITE
    QUESTION: taking the result as given, what would have to move to reach a
    lower exponent. They share primary text and must not share conclusions:
    GOAL-P13-001's concrete-cost findings (EV-PEC-2e67ff, EV-PEC-857664 — the
    measured per-entry overhead refuting the paper's Section 4.1 convention)
    are INPUTS here and are cited, never re-derived and never restated as this
    goal's own evidence. GOAL-SSI-001 owns post-SIDH mechanism screening
    broadly; this goal is narrower and exponent-specific, and any mechanism it
    surfaces that is not exponent-carrying belongs there, not here.
  scheme_context:
    problem: >-
      the supersingular isogeny problem over F_{p^2}, via OneEnd (given
      supersingular E/F_{p^2}, find a non-scalar endomorphism) and the
      endomorphism ring problem, per Theorem 1.1 and Corollary 1.2 of the
      archived source
    incumbent_baselines:
      unconditional: "p^{1/2} * (log p)^{O(1)} time at polynomial memory"
      heuristic_conditional: >-
        p^{1/3+o(1)} time AND memory, conditional on Heuristic 1 of the
        archived source, above a superpolynomial o(1) the source discloses
      tradeoff_curve: >-
        van Oorschot-Wiener claw finding at memory w: time ~ sqrt(N^3/w) =
        p^{1/2+o(1)}/w^{1/2} for N = p^{1/3+o(1)}. The two baselines are
        endpoints of ONE curve, so any candidate must say where on it it sits.
      f_p_restricted: >-
        Otilde(p^{1/4}) for the F_p-restricted problem (Delfs-Galbraith),
        carried at confidence relayed_from_abstract AND CONTESTED ACROSS
        RETRIEVALS (KN-TECH-058 RC4). NOT a baseline for this goal's target
        problem and NOT evidence that exponent 1/4 is reachable over F_{p^2}.
    target_exponent_note: >-
      "0.25" names the search target the user set: time p^{1/4+o(1)} for the
      general F_{p^2} problem. It is deliberately NOT stated as a completion
      criterion below, because a criterion this program cannot cause to be true
      is not a criterion — it is a wish, and pinning closure to it would either
      block the campaign forever or invite a weakened restatement later.
      Criterion 4 is where a genuine sub-1/3 mechanism lands if one is found.
    affected_scope_if_a_result_were_obtained: >-
      The archived source names its own affected set (CGL, the SQIsign family,
      GPS signatures, PRISM, ⊗-MIKE) and names as out of range all
      group-action constructions like CSIDH and torsion-based key exchanges
      like M(D)-SIDH, FESTA and POKE, on the ground that other cryptanalysis
      dominates those. That scope is THE SOURCE'S, is inherited unchanged, and
      may not be widened by any record under this goal.
  exponent_budget:
    note: >-
      The decomposition below is the campaign's spine and its first
      deliverable, transcribed here from proof-of-Theorem-1.1 lines 177-218 of
      the archived text as the OPENING READING. It is a Coordinator reading,
      NOT yet independently verified, and TASK-20260805-85af9d exists precisely
      to re-derive it from primary text and correct it. Any lever built on an
      uncorrected factor inherits that defect.
    factors:
      - id: F1
        name: structural degree bound
        exponent: 1/3
        statement: >-
          Theorem 1.5, attributed to [4]: for supersingular E/F_{p^2} there
          exists an isogeny E -> E^{(p)} of degree at most (p/2)^{1/3}.
        moves_total_as: >-
          the total is X^2 where X ~ (deg bound)^{1/2}, so total exponent =
          F1 exponent. Reaching 1/4 via F1 alone needs a degree bound with
          exponent 1/4.
      - id: F2
        name: split exponent
        exponent: 1/2 (of F1)
        statement: >-
          a B-smooth degree splits as phi = eta o psi with both sides of degree
          at most X = B^{1/2}(p/2)^{1/6} (Lemma 3.4).
      - id: F3
        name: list cardinality
        exponent: 1/3 jointly with F1, F2
        statement: >-
          |L(E,X,B)| = Psi(X,B) * X^{1+o(1)} = X^{2+o(1)} = p^{1/3+o(1)}:
          ~X admissible smooth degrees, and ~d cyclic isogenies of degree d.
          THIS IS THE QUADRATIC FACTOR and the reason memory equals time.
      - id: F4
        name: inverse success probability
        exponent: 0
        statement: >-
          P0^{-1} = u^{u(1+o(1))} = p^{o(1)} at B = e^{(1/3)sqrt(log(p/2))}
          under Heuristic 1 (Lemma 3.5).
        consequence: >-
          F4 CARRIES NO EXPONENT, so no exponent can be recovered from it. Any
          proposal whose saving comes from "improving the success probability"
          is confusing an o(1) with an exponent and is refuted at the whiteboard.
    levers:
      - id: L1
        targets: F1
        claim_that_would_have_to_be_true: >-
          a degree bound on the minimal isogeny E -> E^{(p)} (or to another
          cheaply-recognisable auxiliary target) with exponent 1/4 rather than
          1/3, holding for all supersingular E or for a p^{-o(1)} fraction.
        named_obstruction_to_audit_first: >-
          Minkowski-type lower bounds on the minimum of the rank-4 quaternion
          lattice underlying Hom(E, E^{(p)}) with the form Nrd/p. If the
          lattice determinant forces a minimum matching exponent 1/3, L1 is
          CLOSED and the ceiling argument is itself a useful, publishable
          negative. AUDIT THIS BEFORE ANY IMPLEMENTATION.
      - id: L2
        targets: F3
        claim_that_would_have_to_be_true: >-
          a restricted family F contained in L(E,X,B) of cardinality
          X^{2-delta} that still contains the required psi with probability
          p^{-o(1)}, i.e. a restriction that shrinks the list strictly faster
          than it shrinks the hit probability.
        named_obstruction_to_audit_first: >-
          the exchange rate is the whole question and is usually 1:1 — every
          natural restriction tried so far divides the list and the hit
          probability by the same factor. The cheap pre-compute test is a toy
          measurement of that exchange rate, not an argument about it.
      - id: L3
        targets: the collision mechanism fed by F3
        claim_that_would_have_to_be_true: >-
          the middle-curve equality test admits a sieve or index-calculus-style
          search below list cardinality, exploiting modular-polynomial
          structure on j-invariants that generic claw finding cannot see.
        named_obstruction_to_audit_first: >-
          for UNSTRUCTURED claw finding, k-way splits do not beat the two-list
          bound; a proposal must exhibit the structure it exploits, and a
          null-object control (the same search on a structure-free surrogate)
          must FAIL to find the shortcut before any speedup is believed.
      - id: L4
        targets: F1 and the problem's geometry jointly
        claim_that_would_have_to_be_true: >-
          a descent to the F_p-rational subgraph cheaper than p^{1/2}. The
          object is natural: E lies on the F_p locus exactly when E ≅ E^{(p)},
          i.e. when the minimal E -> E^{(p)} degree is 1, so the archived
          theorem is already a statement that every curve is within degree
          p^{1/3} of the degenerate stratum of the same invariant.
        named_obstruction_to_audit_first: >-
          the F_p locus has size ~p^{1/2} inside ~p/12 curves, and the
          Otilde(p^{1/4}) figure attached to it is CONTESTED in this corpus
          (KN-TECH-058 RC4). Establish the true F_p-side cost from the
          published paper before building anything on it; a lever resting on a
          contested figure is a lever resting on nothing.
      - id: L5
        targets: memory, not time
        claim_that_would_have_to_be_true: >-
          a point strictly below the van Oorschot-Wiener curve
          sqrt(N^3/w) — i.e. a genuine improvement of the tradeoff rather than
          a relabelling of a point already on it.
        status_note: >-
          RECORDED FOR HONESTY, NOT PRIORITISED: it does not move the time
          exponent and so does not serve this goal's target. It is here so that
          a memory result is never mistaken for a time result, in either
          direction.
    lever_completeness_disclaimer: >-
      L1-L5 is an OPENING ENUMERATION by the Coordinator, not a proof of
      exhaustiveness. BATCH-001 explicitly asks its producers to add levers,
      and no later record may treat "not in L1-L5" as "not a route".
  completion_criteria:
    - >-
      An exponent-budget decomposition of the archived p^{1/3+o(1)} algorithm
      is committed and independently verified against primary text: every
      exponent-carrying factor F1-F4 (as corrected) re-derived with its line
      locators, and the p^{1/4} target expressed as explicit numeric conditions
      on named factors — which factor must move, to what value, for the total
      to reach 1/4.
    - >-
      Every enumerated lever carries a committed method-ceiling audit per
      docs/inventor-protocol.md section 8 (KN-TECH-080): the exact statement
      that would have to be true, the nearest known obstruction or lower bound,
      a nearby-object control, and a cheap pre-compute falsification test
      actually executed — with the audit's verdict recorded whichever way it
      falls.
    - >-
      At least one surviving lever is advanced to a specified falsifiable
      hypothesis with a frozen experiment contract, executed bounded runs with
      pre-registered null-object and instrument-fidelity controls, and
      independent Validator and Red Team review admitting the package.
    - >-
      IF a mechanism whose charged time exponent over F_{p^2} is strictly below
      1/3 survives that review, it carries a full cost model — time, memory,
      disclosed o(1) overhead, position on the van Oorschot-Wiener curve,
      parallelisation, numbered heuristics with validation evidence — a
      claim-tier-correct evidence record, and a scoped statement of which
      schemes and parameter sets are affected, inherited unwidened from the
      source's own scope.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with every conclusion scoped
      to the exact objects, parameters, solver and budget actually used.
  completion_criteria_notes:
    on_criterion_4: >-
      Criterion 4 is CONDITIONAL and is the only place a sub-1/3 mechanism can
      land. It is written conditionally on purpose: a criterion the program
      cannot cause to be true would make closure hostage to luck, and the
      predictable repair later would be to weaken it. Criteria 1-3 and 5 are
      deliverables the campaign can actually produce.
    on_not_closing_early: >-
      MEETING CRITERIA 1-3 AND 5 DOES NOT LICENSE CLOSURE while any lever
      remains OPEN and campaign budget remains. Premature closure is a failure
      mode symmetric with overclaiming (docs/inventor-protocol.md), and
      AGENTS.md rule 9 requires any deprioritisation to record its evidence,
      budget, test boundary, remaining uncertainty, and a named successor or
      revisit condition. "The exponent was just improved, so the next one is
      hopeless" is not evidence.
    on_negative_results: >-
      A closed lever is a real contribution and is recorded as one, but it is
      NOT a completion criterion (/coordinate-research-goal step 3). Closing
      all five levers with committed ceiling arguments satisfies criterion 2,
      not the goal.
  pause_conditions:
    - The eight-batch campaign budget is exhausted without an admissible next
      lever or next mechanism.
    - >-
      Every enumerated lever — including any added by producers under the
      completeness disclaimer — is CLOSED by a committed ceiling argument or
      executed falsification, and no successor route is identified. Pausing
      here requires the successor/revisit record of AGENTS.md rule 9, not a
      bare "closed".
    - A definitive infrastructure, authentication, or dependency blocker
      prevents the next approved task.
    - The user requests a pause.
  pause_reason: null
  next_action: >-
    LAUNCH BATCH-001 (zero compute, primary-text only), whose queue is committed
