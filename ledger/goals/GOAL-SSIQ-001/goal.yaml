    - id: GD-10
      raised_by: [TASK-20260805-176dab]
      severity: high
      detail: >-
        NAMED IN BATCH-006, BY THE RED TEAM, ON RUN-SSIQ-a85692-c -- THE
        FOURTH INSTANCE OF THIS CAMPAIGN'S "LOOKS VALIDATED, WASN'T"
