research_goal:
  id: GOAL-ECQ-002
  title: Take a record cell on the ICARM rank leaderboard, and close the base-rank gap left open by GOAL-ECQ-001
  objective: >-
    GOAL-ECQ-001 certified rank 13 over Q and closed with the gap to the world record MEASURED
    rather than closed: its base was a rational elliptic surface, whose Mordell-Weil rank over
    Q(t) is capped at 8 by Shioda-Tate (10d-2 at d=1), while the published records are built on
    an elliptic K3 (d=2, cap 18 over C, 17 over Q -- rank 18 over Q is impossible, Elkies). The
    user directive is to PURSUE THE RECORD. This campaign does that on the two axes where pursuit
    is meaningful rather than performative.
    AXIS A1 (structural): replace the rank-8 base with a base of generic rank > 8 over Q(t),
    reproduced from published work with citation and independently re-certified here. This is the
    thing that actually separates 13 from 28-30; more sieving on a rank-8 base cannot.
    AXIS A2 (record, and the one that is winnable now): the ICARM leaderboard scores rank RELATIVE
    TO SIZE and keeps a record per (rank threshold x metric) cell, so a modest-rank curve that is
    unusually small holds a record. Its r>=15 cell is soft -- minimum naive height jumps 85.19 ->
    118.77 from r>=14 to r>=15, against steps of 9.4 and 6.6 on either side. A base of generic
    rank r hands every specialisation rank >= r for free, so specialising at SMALL parameters buys
    high rank and small height at once. That is the shot.
    Rank >= 31 over Q is NOT the target of this campaign. It remains an open world record (30,
    Alpoge-Howell 2026) and no result here may be presented as progress toward it unless it is.
  question_ids:
  - RQ-ECQ-80f23c
  active_hypothesis_ids:
  - H-ECQ-d60d07
  status: active
  runtime:
    provider: none
    goal_id: GOAL-ECQ-002
  campaign_budget:
    maximum_batches: 4
    total_wall_clock_seconds: 21600
    max_concurrent: 2
    max_concurrent_basis: >-
      4 cores / 15 GB, load 0.01 at sizing. Held at 2 producers because the
      launch skill records GOAL-AES-003 BATCH-002 driving load to 13 with three
      producers on a 4-core box, losing a whole segment and five of eight trials
      to timeouts. Descent is CPU-bound, so 2 is the honest ceiling here.
  current_batch_id: BATCH-f2341e
  dispatch_queue_path: coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/dispatch_queue.json
  preregistered_baseline:
    path: coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
    snapshot_path: coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json
    snapshot_sha256: 118db069fcfc0cddc61bb00a235736202f01dc72d608b3c743bd342935cadc59
    retrieved_at_utc: '2026-08-23T00:43Z'
    why: >-
      The leaderboard is live and third parties submit to it. Without a frontier
      frozen BEFORE the search, "we took a record" is unfalsifiable -- the target
      could be re-read after the fact to fit whatever was found. A cell that is
      open here and closed by someone else before we submit is a real outcome to
      report, never a licence to re-baseline.
  completion_criteria:
  - id: C1
    statement: >-
      A curve produced by this program is accepted by the ICARM verifier (exact 2-descent,
      quadratic characters at good primes, no floating point) AND takes at least one record cell
      (rank threshold x metric) relative to the PRE-REGISTERED frontier above, with the live board
      re-read at submission time and any third-party movement reported.
    met: false
  - id: C2
    statement: >-
      The base-rank gap is closed or bounded: a family of generic Mordell-Weil rank > 8 over Q(t)
      is obtained, its rank independently re-certified in this repo (not merely cited), and its
      exact Shioda-Tate ceiling stated; OR the obstruction to obtaining one is documented with
      evidence, naming which published construction failed to reproduce and why.
    met: false
  pause_conditions:
  - id: P1
    statement: Campaign budget exhausted (4 batches or 21600s wall clock).
  - id: P2
    statement: An archive fails post-commit verification.
  - id: P3
    statement: A required model policy cannot be honoured without a silent downgrade.
  - id: P4
    statement: >-
      The ICARM endpoint is unreachable or refuses submission. This pauses C1 ONLY and must not
      block C2, which is entirely internal and is the axis that carries the research content.
  next_action: >-
    Run BATCH-f2341e: TASK-20260823-d1cb76 (idea-generator) retrieves and verifies explicit
    high-rank Q(t) families with exact coefficients; TASK-20260823-01d3d9 (executor) builds the
    family-agnostic specialise -> Mestre-Nagao score -> exact descent -> height/conductor ->
    ICARM-format pipeline. Both run concurrently on disjoint write scopes.
  created: '2026-08-23'
  owner: coordinator
