research_goal:
  id: GOAL-ECQ-002
  title: Take a record cell on the ICARM rank leaderboard, and close the base-rank gap left open by GOAL-ECQ-001
  objective: 'GOAL-ECQ-001 certified rank 13 over Q and closed with the gap to the world record MEASURED
    rather than closed: its base was a rational elliptic surface, whose Mordell-Weil rank over Q(t) is
    capped at 8 by Shioda-Tate (10d-2 at d=1), while the published records are built on an elliptic K3
    (d=2, cap 18 over C, 17 over Q -- rank 18 over Q is impossible, Elkies). The user directive is to
    PURSUE THE RECORD. This campaign does that on the two axes where pursuit is meaningful rather than
    performative. AXIS A1 (structural): replace the rank-8 base with a base of generic rank > 8 over Q(t),
    reproduced from published work with citation and independently re-certified here. This is the thing
    that actually separates 13 from 28-30; more sieving on a rank-8 base cannot. AXIS A2 (record, and
    the one that is winnable now): the ICARM leaderboard scores rank RELATIVE TO SIZE and keeps a record
    per (rank threshold x metric) cell, so a modest-rank curve that is unusually small holds a record.
    Its r>=15 cell is soft -- minimum naive height jumps 85.19 -> 118.77 from r>=14 to r>=15, against
    steps of 9.4 and 6.6 on either side. A base of generic rank r hands every specialisation rank >= r
    for free, so specialising at SMALL parameters buys high rank and small height at once. That is the
    shot. Rank >= 31 over Q is NOT the target of this campaign. It remains an open world record (30, Alpoge-Howell
    2026) and no result here may be presented as progress toward it unless it is.'
  question_ids:
  - RQ-ECQ-80f23c
  active_hypothesis_ids:
