    why: The leaderboard is live and third parties submit to it. Without a frontier frozen BEFORE the
      search, "we took a record" is unfalsifiable -- the target could be re-read after the fact to fit
      whatever was found. A cell that is open here and closed by someone else before we submit is a real
      outcome to report, never a licence to re-baseline.
  completion_criteria:
  - id: C1
    superseded_by: C1prime
    met: false
    statement: 'SUPERSEDED, NOT MET. Original wording: a curve accepted by the ICARM verifier that takes
      at least one record cell relative to the pre-registered frontier. The BATCH-f2341e red team showed
      this permits a HOLLOW CLOSURE: three Cremona-table curves (43a1 11.269579, 53a1 11.387464, 83a1
      11.550443) already beat the frozen r>=1 cell of 11.613603, so a textbook rank-1 curve nobody in
      this program discovered would satisfy it as written. Tightened BEFORE any candidate curve exists,
      which is the only time such a tightening is honest.'
  - id: C1prime
    met: false
    statement: A curve FIRST EXHIBITED BY THIS PROGRAM -- not present in the frozen ICARM snapshot, not
      in Cremona's tables, and not obtainable by looking up a published curve -- is accepted by the ICARM
      verifier (exact 2-descent, quadratic characters at good primes, no floating point) AND takes a cell
      that was PRE-DECLARED in the governing hypothesis before the curve existed, measured against BOTH
      the frozen frontier AND the live board re-read at submission time, with any third-party movement
      in between reported rather than absorbed.
    predeclared_cells_source: ledger/hypotheses/H-ECQ-a609f8.yaml target_cells_predeclared
  - id: C2
    met: true
    met_by: DEC-20260823-51726e
    statement: A family of generic Mordell-Weil rank > 8 over Q(t) is obtained, its rank independently
      re-certified in this repo rather than cited, and its exact Shioda-Tate ceiling stated; OR the obstruction
      is documented with evidence.
    met_qualifications:
    - Delivered by the REVIEWER (TASK-20260823-6040d1), not by the producer.
    - rank E(Q(T)) >= 11 for Mestre's family is a lower bound that is also that method's own ceiling.
    - 'Derivation-tier: UNREPLICATED, with no archived exhibited-point certificate. Never certificate-tier.'
    - Closes nothing whatever about C1 or C1prime.
