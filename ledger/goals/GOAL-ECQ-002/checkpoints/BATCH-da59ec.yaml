    algebraic parametrisation of M_{1,k+1} scored by an APPROXIMATE
    MESTRE-NAGAO PRODUCT, the very heuristic the hypothesis demoted. BOTH SIDES
    OF THE DICHOTOMY ARE CONSTRUCTION-PLUS-PARAMETER-SEARCH; THE DICHOTOMY DOES
    NOT EXIST. Compounding it, the supporting statistic was a free-text
    classifier artifact: board #1, "Found by Mestre (1982)", r = 12, h = 79.329,
    is +9.99 from its cell, not +137.
    E2: THE RE-AIM WENT TO HARDER TARGETS. Frontier steps 12->13 +6.42, 13->14
    +9.43, 14->15 +33.58, 15->16 +6.56; on the anomaly criterion the goal record
    itself uses, r >= 15 was the SOFTEST cell below rank 17, and the three new
    cells are on-trend and 33.6 to 49.4 log units LOWER in absolute height. Two
    senses of "soft" were conflated and no record noticed the trade until the red
    team.
    E3: THE FALSE-NEGATIVE DECLARATION WAS ITSELF THE ERROR -- see the next item.
    E4: THE FROZEN BASELINE OMITTED A SCORED METRIC (log|Delta|), making a
    discriminant-cell claim UNJUDGEABLE against the frozen frontier until the red
    team built it; plus the already-recorded pre-declared target-value
    transcription defect, whose "stricter is conservative" reasoning is backwards
    for the falsification that was actually run.
  - >-
    E3 IN FULL, BECAUSE IT CORRECTS THIS PROGRAM'S OWN COMMITTED DECISION.
    BATCH-f2341e's NAGAO verdict was declared a FALSE NEGATIVE by the
    Coordinator, recorded as such in DEC-20260823-51726e R1 and EV-ECQ-d9ffe6
    OBS-1, relayed to the user, and written into the producer's handoff as a
    constraint. BOTH REVIEWERS, BLIND TO EACH OTHER, SAY OTHERWISE. The validator
    (F2) checked the retrieved section directly: the point AS RECORDED does NOT
    lie on the transcribed quartic. The red team (RT-CORR-O2) inverted the
    diagnosis: every one of the thirteen distinct integer coefficients is exactly
    divisible by 1557504 = 1248^2, so the transcription is 1557504 * Q0 and the
    PUBLISHED section lies on y^2 = Q0 unmodified -- confirmed by the
    orchestrating session over all 14 nonzero coefficients. BATCH-f2341e's
    "FAILS" WAS A TRUE NEGATIVE; the repair is to divide the equation by 1248^2,
    not to multiply the point by 1248; and THE TRANSCRIPTION IS PROVABLY NOT THE
    PUBLISHED EQUATION, which is a stronger and more useful statement than the
    one on file. Numerically nothing moves -- 1248^2 is a square, so y -> 1248y
    is a Q-isomorphism -- which is exactly why an error of this shape is one a
    program stops looking for. The finding recorded against the BATCH-f2341e
    producer is withdrawn as to substance: its verdict was right and only its
    stated justification was wrong.
  - >-
