  - >-
    FOUR COORDINATOR ERRORS, ALL FOUND BY REVIEWERS, NONE BY THE LAYER THAT MADE
    THEM. E1: the method-class hypothesis is REFUTED AT ITS LOAD-BEARING PREMISE
    BY A RETRIEVED PRIMARY SOURCE -- the board's commentary cites one URL for all
