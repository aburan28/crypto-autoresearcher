  - >-
    J1-F1, THE MOST IMPORTANT FINDING OF THE BATCH. NAGAO-1994 -- rank EXACTLY
    12 over Q(t), peer-proved (Scholten Cor. 1), the highest exactly-known Q(t)
    rank available -- WAS SET ASIDE ON A FALSE NEGATIVE. The producer's hand
    arithmetic is exactly right and its conclusion is false: right/left =
    1557504 at EVERY one of t^0..t^6, and 1557504 = 1248^2, so the constant
    perfect-square ratio is absorbed exactly by y -> 1248*y and the point
    ((t+703)/15, 1248*N(t)/75) LIES ON THE TRANSCRIBED QUARTIC. The assertion
    that the factors "are not squares and so are not absorbed by any rescaling"
    was decidable from the two numbers already printed. The orchestrating
    session independently reproduced it. NAGAO-1994 IS REINSTATED as a
    candidate pending source retrieval. LIMIT, stated by the validator itself:
    this shows the evidence for "transcription corrupted" fails; it does NOT
    establish the coefficients are Nagao's equation.
