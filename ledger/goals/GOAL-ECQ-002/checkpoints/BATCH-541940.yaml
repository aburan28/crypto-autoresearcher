  - >-
    THE MORE INFORMATIVE FACT NOBODY REPORTED: within a family the envelope
    minimum and the rank-12 locus are DISJOINT. The headline family's envelope
    minimum is at t = 4 with h = 69.28330998318052, where the validator
    independently certified the rank as 8; its rank-12 fibre is at t = 23, 17.49
    log units higher. That 69.283 sits below the frozen r >= 12 incumbent AND IS
    NOT A CELL, NOT A NEAR-MISS AND NOT PROGRESS, because the rank there is 8 and
    the r >= 8 cell is 41.826.
  - >-
    THE SECTION 3 FIBRE COLUMN IS AN ARITHMETIC RELABELLING, NOT A MEASUREMENT,
    AND THE DELIVERABLE CARRIES NO FIELD IT COULD HAVE BEEN READ FROM. It equals
    sum(m_v - 1) + 1 on every row; no family has I_8, I_10, I_12 or I_14; the
    label is right for 0.36 percent of rows. Both reviewers found this
    independently and blind, and a third re-derivation from the deliverable
    established that fibre_types carries no at-infinity designation at all - so
    the column was not merely misread, it was UNOBTAINABLE.
  - >-
    "CEILING STRATIFICATION EXPLAINS FAR MORE VARIANCE THAN CONTENT" IS BACKWARDS
    BY ABOUT SEVEN TIMES: content R^2 = 0.19165243721035774, ceiling one-way
    eta^2 = 0.02798. With content and class size matched, every high-ceiling class
    sits at or below the size-matched generic minimum and the fitted ceiling
    coefficient has the OPPOSITE SIGN to the claimed mechanism. WHAT IS MEASURED
    IS RARITY, NOT A COUPLING.
  - >-
    THE REQUIRED NULL IS NOT A NULL, AND THIS IS THE ROUND'S MOST CONSEQUENTIAL
    FINDING ABOUT THE CAMPAIGN'S METHOD. The k = 0 rung retains large forced
    rational rank - 12 of 15 at rank >= 3 against ZERO of 79 random curves at
    matched height - because with irreducible quadratic factors the trace of a
    Galois-conjugate section pair is rational while n_sections counts only rational
