    D-705-5. No reject_scoped of the round-independent single-word deterministic
    class may be considered until that redesigned gate returns a discriminating
    result. (2) SECOND, close ER-6 in a superseding package: the one-line
    build_tasks() change generating final_mix_columns in {False, True} for all
    three key lengths, a re-run showing the validator's regime-confined fault is
    now DETECTED, the (key length x final_mix_columns) coverage boundary written
