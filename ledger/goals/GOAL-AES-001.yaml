      driving Coordinator session by direct question to the user, and recorded in
      DEC-20260825-374b3e: a program-wide instruction to multiply
      campaign_budget.total_wall_clock_seconds by 2 and to increase
      campaign_budget.maximum_batches by exactly 2 on every currently active goal
      carrying a finite cap, leaving uncapped goals untouched. THE COORDINATOR DOES
      NOT SELF-GRANT ONE; this is that separate, authorized decision. BUDGET-CEILING
      RAISE ONLY, BY EXACTLY +2 BATCHES. No other campaign_budget field is touched
      (total_wall_clock_seconds is amended by its own sibling key under the same
      decision; max_concurrent is deliberately untouched), and no completion_criteria,
      pause_conditions, claim_tier_ceiling, objective_and_scope, next_action, goal
      status or hypothesis status is touched. A raised ceiling is ROOM, NOT A
      JUDGEMENT that this campaign is going well and NOT A LICENCE TO SPEND.
    maximum_batches_history_20260825:
      - value: 7
        in_force_until: '2026-08-26'
        note: >-
          Superseded by the user-authorized "+2 batches" raise (DEC-20260825-374b3e).
          Whether this value was consumed is not asserted here.
    # AMENDED 6 -> 7 by protocol-amendment-GOAL-AES-001-006 (v6 -> v7), approved
    # 2026-08-12 in DEC-20260812-f30c6e on EXPLICIT USER AUTHORIZATION obtained
