  # ===================================================================
  # BUDGET ACCOUNTING BASIS. Amended 2026-08-01 by
  # protocol-amendment-GOAL-AES-001-003 (v3 -> v4), approved in
  # DEC-20260731-027 on a dispatcher ruling taken under the user's standing
  # instruction to keep running the harness and recorded as REVERSIBLE.
  # THE CEILING WAS NOT RAISED. total_wall_clock_seconds stays 20000. What
  # changed is that consumption charged against it is the MEASURED wall clock of
  # COMPLETED TASKS, not the sum of DECLARED per-task budgets. Charging
  # declarations had blocked two consecutive batches on time the campaign never
  # spent: declared 17400 against 9243 actually consumed.
  budget_accounting:
    basis: measured_wall_clock_of_completed_tasks
    prior_basis: sum_of_declared_per_task_budgets
    # HISTORY PRESERVED, NOT OVERWRITTEN: this field recorded that amendment 003 left
    # the ceiling at 20000. That remains true of amendment 003. The ceiling was
    # subsequently RAISED to 34500 by protocol-amendment-GOAL-AES-001-005
    # (DEC-20260731-030); see ceiling_current below.
    ceiling_unchanged_under_amendment_003: 20000
    ceiling_current: 34500
    ceiling_current_basis: >-
      Set by protocol-amendment-GOAL-AES-001-005 Part A (v5 -> v6), approved in
      DEC-20260731-030 on a USER AUTHORIZATION relayed by the dispatching session
      after disclosure that continuing means a THIRD budget act on a campaign which,
      four batches in, has produced NO CLAIM ABOUT AES — against a real bound at ONE
      interface (Proposition 806-1), two knowledge entries (KN-FIND-028, KN-FIND-029)
      and an open candidate now demonstrably wrongly discarded (CAND-806-A's residual,
      RT-8 / D-811-2). Sized bottom-up at per-role MEASURED MAXIMA with NO cushion:
      producer 1600, snapshot 500, validation 1400, red team 1000 (NOT the single
      observed 668 — one task is not a distribution), ledger archive 900, coordination
      act 700-900. BATCH-005 8600 + BATCH-006 6200 + 19458 charged = 34258, rounded to
      34500.
    coordination_act_undercount_fixed_prospectively: >-
      FOUND WHILE SIZING amendment 005 AND FIXED FORWARD ONLY. charged_to_date has
      only ever counted QUEUE TASKS; coordination acts performed outside the queue
      (drafting a queue and its handoffs, authoring an amendment, taking a decision)
      consume real session elapsed and have been CHARGED AT ZERO for four batches.
      From BATCH-005 EVERY COORDINATION ACT IS DISPATCHED AS A QUEUE TASK with a
      declared budget and is charged at measured session elapsed. NOT RETROACTIVE: no
      prior batch is re-charged and no committed figure is edited, because
      reconstructing durations nobody recorded would be fabrication (AGENTS.md rule
      9). CONSEQUENCE STATED AGAINST THE CAMPAIGN'S OWN INTEREST: 19458 IS AN
      UNDERSTATEMENT and the historical under-count is UNQUANTIFIED AND UNRECOVERABLE.
    clock_convention: >-
      NAMED by protocol-amendment-GOAL-AES-001-005 Part B, closing the amendment-003
      drafting fault that produced BATCH-004's two overruns. (C1) CHARGED CLOCK:
      SESSION ELAPSED, authoring-inclusive, first act to terminal receipt,
      dispatcher-observed. (C2) STOP-CONDITION CLOCK: THE PRODUCER'S OWN COMMITTED UTC
      STAMPS — a first-act stamp carrying start_utc, declared budget and a COMPUTED
      binding_stop_utc; a stamp at every major section boundary; a halt at
      binding_stop_utc; the stamps COMMITTED as a declared artifact. The
      TASK-20260801-810 budget block is the reference implementation. (C3) DISCHARGING
      C2 IS FULL COMPLIANCE even where the charged figure later exceeds the
      declaration; any residual is a campaign-side accounting fact and NEVER a
      producer defect. (C4) Declarations are calibrated against AUTHORING-INCLUSIVE
      elapsed with the compute component reported SEPARATELY; compute seconds may no
      longer be offered as budget compliance (prospective only — TASK-20260801-806 is
      not re-graded). (C5) D-811-3 RESOLUTION: the charged figure is the LARGEST
      session-elapsed figure on the record from any source, every other figure is
      preserved marked `on_record_not_charged` with its source named, and no spread is
      ever resolved silently; producer stamps GOVERN the timeline while the
      largest-figure rule governs the charge, because a producer stamp ends at the
      final write and cannot cover the task's tail. Applied to TASK-20260801-809 the
      rule returns 1370, the figure already charged, so nothing is re-charged.
      (C6) The unmeasured_work_rule is retained; under C2 an unmeasured task should
      not recur, and if one does it is charged at declaration AND a defect is recorded
      against the campaign's instrumentation, not against the producer.
    # UPDATED at the BATCH-004 ledger archive (DEC-20260731-029). 13151 was the
    # figure charged BEFORE this batch and is preserved in batch_003 below.
    charged_to_date: 19458
    charged_to_date_basis: >-
      13151 charged before BATCH-004 + 6307 for BATCH-004's six tasks =
      19458 of the unchanged 20000 s ceiling. BATCH-004 by task:
      TASK-806 1609 and TASK-807 1510, both DISPATCHER-OBSERVED SESSION ELAPSED
      and both OVER their declarations (1600 and 1200), charged at the larger
      clock under the TASK-20260801-808 ruling that the campaign does not get to
      under-charge itself by using the smaller of two clocks; TASK-808 350,
      charged at its DECLARED budget under unmeasured_work_rule because NO
      duration was reported for it at all; TASK-809 1370, the HIGHEST of THREE
      figures on the record (1336 and 1370 dispatcher-reported, ~1180
      self-reported in validation_report.yaml under a named session-elapsed
      convention) with the spread recorded as defect D-811-3 rather than resolved
      silently; TASK-810 668, MEASURED, the campaign's first red-team datum;
      TASK-811 800, charged at its DECLARED budget because a record authored
      inside a task cannot state that task's own duration. Replace TASK-808's and
      TASK-811's figures with measurements when the dispatching session reports
      them; the measured-only subtotal for BATCH-004 is 5157.
    batch_001: {declared: 8100, measured: 3231, ratio: '2.51x'}
    batch_002: {declared: 9300, measured: 6012, ratio: '1.55x'}
    batch_003: {declared: 5000, measured: 3908, ratio: '1.28x',
                measured_note: 'TASK-805 charged at its declared 800 s, not measured'}
    batch_004: {declared: 6350, charged: 6307, ratio: '~1.01x',
                measured_note: 'TASK-808 and TASK-811 charged at declaration; TASK-806 and TASK-807 both OVER declaration'}
    batch_004_declared: 6350
    # PRESERVED AS THE FIGURE AGAINST THE OLD CEILING. 542 was the headroom against
    # 20000 and is the fact that forced amendment 005; it is not overwritten.
    remaining_against_ceiling_20000_after_batch_004: 542
    remaining_against_ceiling_34500_after_batch_004: 15042
    the_over_declaration_series_has_flattened_to_parity: >-
      2.51x -> 1.55x -> 1.28x -> ~1.01x AT THE BATCH LEVEL, with TWO INDIVIDUAL
      PRODUCER TASKS OVER their declarations for the first time. The BATCH-004
      queue's projection of "~4900 s expected at the historical ratio" IS
      SUPERSEDED BY MEASUREMENT and the ratio may no longer be used as an
      expectation. THE CAMPAIGN NOW HAS NO CALIBRATED BASIS FOR PREDICTING
      MEASURED COST. Both BATCH-004 overruns were AUTHORING, not compute (67 s and
      ~254 s of compute against 1609 s and 1510 s elapsed), so future declarations
      must be calibrated against AUTHORING-INCLUSIVE elapsed with the compute
      component stated separately.
    the_binding_scarcity_has_switched: >-
      The BATCH-004 queue judged BATCHES the scarcer resource than seconds. THAT
      JUDGEMENT IS FALSIFIED BY MEASUREMENT. Two of six batches remain and roughly
      542 seconds remain, so SECONDS BIND FIRST and BOTH remaining batches are
      unreachable without a budget act. BATCH-005 CANNOT BE DISPATCHED WITHOUT A
      FURTHER AMENDMENT: its minimum credible shape — a coordination act, one
      producer, a snapshot archive, one review, a ledger archive — is an order of
      magnitude larger than the headroom. This is exactly the point at which
      amendment 003's standing_limit requires a further amendment, and it is the
      single next action below.
      UPDATED AT THIS CHECKPOINT, AND THE SWITCH HAS REVERSED AGAIN: that amendment
      was authored and APPROVED (protocol-amendment-GOAL-AES-001-005,
      DEC-20260731-030). With 15042 s remaining against 34500 and TWO batches left,
      SECONDS NO LONGER BIND AND THE BATCH COUNT DOES. maximum_batches STAYS 6, was
      NOT raised, and was NOT put to the user as raisable. OPERATIVE CONSEQUENCE,
      BINDING ON BOTH REMAINING QUEUES: BATCH-005 IS THE LAST BATCH THAT MAY OPEN NEW
      RESEARCH QUESTIONS, and BATCH-006 is reserved for consolidation, review and the
      terminal record. Anything not attempted in BATCH-005 is named as OPEN AND
      UNATTEMPTED and is NEVER recorded as tried, screened or negative (AGENTS.md
      rules 5 and 8). Raising seconds while holding batches fixed does not buy this
      campaign a result; it buys it the ability to finish the two batches it was
      already permitted, at the cost the work actually has.
    the_clock_is_undefined_and_that_caused_the_overruns: >-
      RULED IN THE TASK-20260801-808 RECEIPT AS AN AMENDMENT-003 DRAFTING FAULT,
      COORDINATOR-SIDE, WITH NEITHER PRODUCER CHARGED. Amendment 003 charges a
      DISPATCHER-OBSERVED quantity while imposing the stop duty on a PRODUCER THAT
      CANNOT OBSERVE IT, and a stop condition a producer cannot evaluate is not a
      stop condition. TASK-806 measured COMPUTE and halted on completion under the
      only clock it had; TASK-807 measured SESSION ELAPSED and DISCLOSED its
      overrun UNPROMPTED as DEV-807-4 with the dropped work NAMED, which is
      recorded as CORRECT CONDUCT UNDER AN UNCLEAR RULE. Its three dropped items
      are UNMEASURED and are SCOPE, never answers (AGENTS.md rule 5). The next
      amendment must NAME THE BINDING CLOCK.
      DISCHARGED AT THIS CHECKPOINT. protocol-amendment-GOAL-AES-001-005 Part B NAMES
      IT: see budget_accounting.clock_convention above for C1-C6 in full. In brief —
      charged clock SESSION ELAPSED (C1); stop condition evaluated against the
      PRODUCER'S OWN COMMITTED UTC STAMPS with a computed binding_stop_utc (C2);
      discharging C2 is FULL COMPLIANCE even if the charged figure exceeds the
      declaration (C3); declarations calibrated against AUTHORING-INCLUSIVE elapsed
      with compute reported separately (C4); D-811-3 resolved by charging the LARGEST
      figure on the record, with the mechanism stated (C5). The duty is not
      speculative: TASK-20260801-809 and TASK-20260801-810 BOTH did this voluntarily
      when the rule was unclear and BOTH came in within budget.
    declared_budgets_remain_binding: >-
      Declared per-task budgets are NOT demoted to estimates. A task that reaches
      its declared handoff.budget.wall_clock_seconds STILL HALTS, and that halt
      is infrastructure signal, never a negative mathematical result (AGENTS.md
      rule 5). No task gains running time from the re-basing.
    unmeasured_work_rule: >-
      A completed task whose wall-clock duration was not reported is charged at
      its DECLARED budget until a measurement is recorded. The campaign may not
      under-charge itself by failing to measure, and an unmeasured task is never
      charged at zero.
    nothing_was_edited: >-
      The re-basing is arithmetic on a counter. No run record, receipt, evidence
      record, decision, queue or checkpoint was altered. BATCH-001's declared
      8100 stands as declared and its measured 3231 stands as measured; likewise
      BATCH-002.
    measurement_provenance: >-
      The measured figures are per-task durations REPORTED BY THE DISPATCHING
      SESSION. There is no instrumented timer in this repository and no timing
      artifact is committed, so a later session cannot re-derive them from the
      tree and there is no independent second measurement. On that one axis the
      declared basis was stronger, because declarations live in committed queue
      records. Recorded as a cost of this ruling, not hidden by it.
    standing_limit: >-
      THE CEILING IS REAL AND STILL BINDS. A FURTHER AMENDMENT IS REQUIRED if
      MEASURED consumption approaches 20000; reaching it without one triggers the
      declared pause condition. This is not a budget increase and buys no
      additional research scope, claim tier or authority. maximum_batches remains
      6 and is an independent constraint: BATCH-003 is the third of six, and the
      campaign can run out of batches while still under the time ceiling.
      UPDATED AT THE BATCH-004 CHECKPOINT: measured consumption has NOT merely
      approached 20000, it stands at 19458 with 542 remaining, so THE FURTHER
      AMENDMENT THIS CLAUSE REQUIRES IS NOW DUE AND IS THE SINGLE NEXT ACTION. If
      it is declined, the declared pause condition fires and this goal moves to
      `paused` — never to `completed`, which is unreachable in this harness — with
      the narrowest supported result recorded and one next action preserved.
      UPDATED AT THIS CHECKPOINT: IT WAS NOT DECLINED. protocol-amendment-GOAL-AES-
      001-005 was authored and APPROVED in DEC-20260731-030 on a USER AUTHORIZATION
      relayed by the dispatching session, so THE PAUSE CONDITION DID NOT FIRE and this
      goal CONTINUES as `active`. THE STANDING LIMIT IS UNCHANGED IN FORM AND NOW
      BINDS AT 34500: a FURTHER amendment is required if measured consumption
      approaches 34500, and reaching it without one triggers the declared pause
      condition. This was the THIRD budget act on one campaign and it buys NO
      additional research scope, claim tier, authority or review relaxation.
      maximum_batches remains 6, was not raised, and is now the BINDING constraint.
