  environment_context:
    executable_without_network: true
    rationale: >-
      Unlike GOAL-FAEST-001 (paused 2026-07-31 under DEC-20260731-009 because
      its Round-3 specification is unreachable), this campaign needs no
      document acquisition. AES is specified by FIPS-197 and is fully
      checkable locally against ground-truth known-answer vectors, so the
      campaign is executable under the current network policy and is
      designed to be.
    verified_tooling:
      - "gcc 13.3.0 with -maes (AES-NI intrinsics compile and link)"
      - "python3 with pycryptodome 3.23.0"
      - "openssl CLI present"
      - "4 CPU cores, 15 GB RAM, no GPU, no sage"
    network_policy: >-
      csrc.nist.gov, faest.info, eprint.iacr.org, arxiv.org, and ietf.org are
      all blocked (proxy CONNECT 403 / no route). GitHub scope is bound to
      this repository only. WebSearch returns secondary reporting only;
      WebFetch of primary crypto sources fails.
    consequences:
      - >-
        The AES specification is NOT at risk: it is pinned by locally
        reproducible FIPS-197 known-answer tests under BOTH pycryptodome and
        the openssl CLI. That pinning is a hard gate before any
        cryptanalytic work in this campaign.
      - >-
        All literature baseline numbers (biclique key recovery on full
        AES-128, impossible-differential and meet-in-the-middle results on
        7-round AES, integral/square attacks on 4-6 rounds, partial sums)
        are recalled from memory and are UNVERIFIED under this policy. They
        are recorded as unverified-from-memory, never cited as if read, and
        every comparison against them must state that the baseline is
        unverified. This constrains claim tier; it does not block work.
  saturation_stance: >-
    The prior that no improvement exists here is overwhelming and is stated
    plainly in RQ-AES-001's motivation. The campaign proceeds anyway because
    premature closure is a failure mode symmetric with overclaiming
    (CLAUDE.md; docs/inventor-protocol.md §4). Both are held simultaneously
    by procedure: hard novelty screening plus the lossy-projection test
    before any compute, matched baselines with end-to-end charging, null
    controls before belief, and a toy/reduced-round claim-tier ceiling that
    makes an overclaim about deployed AES structurally impossible.
  claim_tier_ceiling: >-
    toy / reduced-round only. No result from this goal may be stated as a
    claim about full-round AES or deployed AES security.
  completion_criteria:
    - >-
      Either a certified reduced-round result — a distinguisher or key
      recovery at a named round count that matches or beats a named baseline
      mechanism at that round count, with data, time, memory,
      precomputation, and verification charged end to end, carrying a
      certificate the run wrapper re-verifies independently (recovered key
      reproduces the target ciphertexts under an independent AES
      implementation; distinguisher accompanied by its measured
      false-positive rate against a matched random-permutation control);
      or a scoped barrier statement deriving why the named object cannot
      yield the sought improvement, with the derivation archived as a
      checkable artifact and forward guidance naming what remains open
      (docs/inventor-protocol.md §4 closure standard).
    - >-
      Independent Validator and Red Team sessions admit the package,
      checking certificate independence, null-control comparability, the
      matched baseline (and its unverified-from-memory status), the round
      count actually tested, and the absence of uncharged precomputation,
      memory, or data assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion
      scoped to the exact round counts, key sizes, implementation, and
      budget actually tested.
  # A negative result is explicitly NOT a completion criterion: a scoped
  # barrier statement counts only when it meets the §4 closure standard
  # (named obstruction + argument + forward guidance), archived and reviewed.
  pause_conditions:
    - >-
      The six-batch campaign budget is exhausted without an admissible next
      mechanism.
    - >-
      The decisive computation exceeds the declared campaign budget after
      the cheaper falsification gates are exhausted.
    - >-
      A definitive infrastructure or dependency blocker prevents the next
      approved task (this is infrastructure signal, never negative
      mathematical evidence — AGENTS.md rule 5).
    - >-
      Novelty screening finds every candidate to be a rediscovery of a known
      attack family (integral/square, impossible differential,
      meet-in-the-middle / Demirci-Selcuk, boomerang, biclique, division
      property) with no admissible next object, and the residual open
      question is named.
