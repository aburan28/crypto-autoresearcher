    - id: protocol-amendment-GOAL-AES-001-002
      path: coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-002.yaml
      scope_of_amendment: artifact_provenance_completion_gate
      version_from: 2
      version_to: 3
