    ER-6 stands. (3) THIRD, a versioned protocol_amendment adopting the
    TASK-20260731-705 provenance recommendation PROSPECTIVELY only (D-704-1).
    GATE-601-A remains NOT dispatched. A filled inference block in every producer
    artifact remains a dispatch-time completion gate at the snapshot archive.
    Budgets must be calibrated toward measured rather than conservative time and
    must fit the standing 20000 s campaign ceiling.
