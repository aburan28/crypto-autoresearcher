research_goal:
  id: GOAL-AES-001
  title: "Reduced-round AES: does any named propagation object still move a cost boundary?"
  objective: >-
    Against a locally pinned, FIPS-197-verified AES ground truth, generate
    and screen object-first cryptanalytic candidates on reduced-round AES —
    each naming its tracked object (integral/division-property set, key
    schedule differential relation, Demirci-Selcuk matching object,
    partial-sum cost term, impossible-differential contradiction) — and
    either produce one certified reduced-round distinguisher or key recovery
    that matches or beats a named baseline mechanism at a stated round count
    with charged end-to-end cost, or produce a scoped barrier statement,
    with archived derivation, explaining why the named object cannot yield
    the sought improvement and naming what remains open.
  question_ids: [RQ-AES-001]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    # AMENDED 10800 -> 20000 by protocol-amendment-GOAL-AES-001-001 (v1 -> v2),
    # approved 2026-07-31 on a dispatcher-relayed user ruling and recorded in
    # DEC-20260731-012. This is a BUDGET-CEILING CALIBRATION CORRECTION, not a
    # widening of research scope, claim tier, or authority: BATCH-001 declared
    # 8100 s but measured ~3231 s, so declared budgets were running at roughly
    # 2.5x measured time and the campaign was being exhausted by conservative
    # ceilings rather than by spent work. maximum_batches and max_concurrent are
    # UNCHANGED. 20000 covers BATCH-001's declared 8100 plus BATCH-002's declared
    # 9300 with ~2600 s of headroom; a FURTHER AMENDMENT is required beyond that.
    total_wall_clock_seconds: 20000
    max_concurrent: 3
  amendments:
