research_goal:
  id: GOAL-BLAKE-001
  title: "BLAKE3: measure the BLAKE2-to-BLAKE3 margin transfer instead of arguing it, and audit the tree mode's domain separation as the finite object it is"
  objective: >-
    Test the one design decision BLAKE3's security most visibly rests on. Run an
    identical characteristic search against BLAKE3's and BLAKE2s's permutations
    and schedules and compare bound-per-round curves like for like, attributing
    any divergence to the specific mechanism that changed rather than to the
    pair of names; require the same instrument to reproduce the published
    reduced-round ChaCha differential-linear frontier first, since BLAKE's round
    function is ChaCha's quarter-round with message injection and that control
    is free. Separately, exhaustively audit BLAKE3's tree-mode domain separation
    — flags, chunk counters, length encoding, keyed and key-derivation modes —
    within a declared class, since it is a finite property of a fielded design
    that a proof sketch is assumed to have covered. No claim about full
    seven-round BLAKE3 is in scope.
  question_ids: [RQ-BLAKE-584719]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MD5-001, GOAL-SHA2-001, GOAL-SHA3-001, GOAL-ASCON-001]
  scheme_context:
    scheme: "BLAKE3, with BLAKE2s as matched baseline and reduced-round ChaCha as nearby-object control"
    family: "ARX permutation (ChaCha lineage) in a Merkle-tree mode with flag-based domain separation"
    nist_track: not_a_nist_candidate
    standardization_status: >-
      Unstandardized and widely deployed — content addressing, integrity
      checking, build systems, file synchronisation.
    why_this_scheme: >-
      This is the most widely deployed unstandardized hash of the last decade,
      and its round-count choice is justified by a TRANSFER ARGUMENT rather than
      by a measurement on the primitive actually shipped. The argument may be
      right; it has not been checked here, and it is untested precisely because
      the lineage makes the answer feel obvious. The tree mode is the cheaper
      half: a finite flag space is where an error outlives everything, because
      nobody re-enumerates what a proof sketch already covered.
  non_duplication:
    - >-
      GOAL-MD5-001 owns instrument calibration. This goal consumes it and adds
      one gate of its own: the instrument must also reproduce the published
      reduced-round ChaCha frontier before any BLAKE3 claim is recorded, because
      ChaCha is the nearest object with a published answer.
    - >-
      GOAL-SHA2-001 owns the SHA-256 deficit ledger and GOAL-SHA3-001 the
      Keccak symmetry-decay curve. All three measure bound-per-round behaviour
      with the same instrument, and CROSS-PRIMITIVE COMPARISON IS ADMISSIBLE
      ONLY after each has independently reproduced its own published baseline.
      A comparison table assembled before that is the specific failure these
      clauses exist to prevent.
    - >-
      ChaCha appears here ONLY as a control on the instrument. This goal makes
      no claim about ChaCha as a stream cipher, and any finding that looks like
      one is handed off rather than written here.
  completion_criteria:
    - >-
      A CONTROL RESULT FIRST: the published reduced-round ChaCha
      differential-linear frontier reproduced, or a reported failure to
      reproduce it with the encoding, solver version, seed, and ceiling that
      produced the failure. A failure here BLOCKS the transfer measurement
      rather than merely qualifying it, and is itself a reportable result about
      the instrument.
    - >-
      A LIKE-FOR-LIKE TRANSFER MEASUREMENT: bound-per-round curves for BLAKE3
      and BLAKE2s under demonstrably identical pipelines, with the divergence
      stated as a number and attributed to specific design changes where the
      structure permits. The outcome that the curves coincide — supporting the
      transfer argument — is a complete result and closes the goal's main
      question.
    - >-
      A DOMAIN-SEPARATION AUDIT: the flag, counter, length-encoding and mode
      surface enumerated within a declared class, reporting whether two
      semantically distinct inputs can present identically to the compression
      function, with any unenumerated region named explicitly. A clean result is
      a real result.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, scoped to the round counts,
      solver budget, and enumerated class actually covered.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The BLAKE2 cryptanalysis that the transfer argument cites cannot be
      located in primary text under the network policy after the declared
      source-preference order is exhausted. WITHOUT IT THERE IS NO BASELINE TO
      MEASURE THE TRANSFER AGAINST and the campaign pauses at acquisition
      rather than substituting a remembered result.
    - >-
      Characteristic search on either permutation exceeds the declared campaign
      budget after cheaper falsification gates are exhausted. This is a budget
      outcome about a solver and is never evidence about BLAKE3 (AGENTS.md
      rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Open with the domain-separation audit, NOT with the transfer measurement.
    It needs no solver, no calibration, and no acquisition beyond the
    specification itself; it is finite; and it is the deliverable whose failure
    mode would matter to deployed systems today. Its own precondition is
    implementation fidelity: pin BLAKE3 and BLAKE2s and validate them against
    published vectors INCLUDING keyed mode, key-derivation mode, and multi-chunk
    inputs, because an audit against a subtly wrong implementation produces a
    spurious finding of the kind hardest to retract. In parallel, acquisition
    for the transfer measurement, whose gate is the ChaCha control: if the
    instrument cannot reproduce a published frontier on the nearest object with
    a known answer, the BLAKE3 comparison is not attempted at all. Claim tier:
    reduced-round curves and a structural audit; never a statement about full
    BLAKE3 or any deployed system. If a domain-separation gap is found, disclose
    it to the maintainers before it appears in any published deliverable.
  owner: coordinator
