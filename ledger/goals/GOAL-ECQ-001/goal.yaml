    statement: 'An explicit curve over Q with a committed certificate of rank >= 31: 31 exhibited
      points, each verified on the curve in exact arithmetic, with a nonsingular 31x31 Neron-Tate
      height regulator. THIS WOULD BE A NEW WORLD RECORD and is recorded as the literal user target.
      It is not expected to be met by this pipeline and no partial result may be reported as if it
      were.'
    status: OPEN
  - id: C2
    statement: 'The best rank over Q this pipeline ACTUALLY certifies, with a committed witness,
      together with a quantified gap to 31: the Q(t) base rank achieved versus the ~18-20 the published
      records used, and the sieve volume covered. C2 requires NUMBERS on both axes; a narrative gap
      does not satisfy it.'
    status: OPEN
