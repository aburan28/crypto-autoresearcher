  completion_criteria:
  - id: C1
    statement: 'An explicit curve over Q with a committed certificate of rank >= 31: 31 exhibited
      points, each verified on the curve in exact arithmetic, with a nonsingular 31x31 Neron-Tate
      height regulator. THIS WOULD BE A NEW WORLD RECORD and is recorded as the literal user target.
      It is not expected to be met by this pipeline and no partial result may be reported as if it
      were.'
    status: OPEN
    adjudication: >-
      NOT MET by BATCH-7e06d3 and not expected to be. Best certified rank over Q
      by this pipeline: 12 (exactly 12). Best anywhere in this program: 13, from
      the carried-forward Mestre route commissioned under GOAL-ECRANK-002.
      Shortfall to 31: 19. Rank >= 31 over Q remains an OPEN WORLD RECORD.
      Adjudicated by DEC-20260822-564044 on EV-ECQ-0d142e.
  - id: C2
    statement: 'The best rank over Q this pipeline ACTUALLY certifies, with a committed witness,
      together with a quantified gap to 31: the Q(t) base rank achieved versus the ~18-20 the published
      records used, and the sieve volume covered. C2 requires NUMBERS on both axes; a narrative gap
      does not satisfy it.'
    status: MET
    adjudication: >-
      MET by BATCH-7e06d3, adjudicated by DEC-20260822-564044 on EV-ECQ-0d142e
      after two independent adversarial reviews. Witness: certified_curves.json,
      sha256 a342ff9c7c93424e1f6dbb886bd70dba85c2ce754ba54ec4f0bf06cc83d15aee,
      committed at b71f4668 and content-verified independently by both
      reviewers -- 20 exhibited points on
      y^2 = x^3 - 518228207838672723 x + 141005837549331272675978478 at
      t = -65/22, 12 independent, and the rank is EXACTLY 12 because PARI
      ellrank returned an unconditional r_high = 12 in a blind re-derivation
      from the a-invariants alone.
      AXIS 1 (base rank over Q(t)): achieved 8 -- measured from RUN-ECQ-81141a-002
      and qt_family.json, and PROVEN to be this construction's exact ceiling by
      Shioda-Tate from a squarefree degree-12 discriminant -- against the ~18-20
      this criterion names as the comparator; gap 10 to 12, scoped, since the
      comparator is recalled literature and is not measured by this program.
      AXIS 2 (sieve volume): 97,640 specialisations scored at 1.028 ms each;
      1,548 in the matched tier-2 box; 140 descents attempted on 137 distinct
      fibres; 84 timeouts; 56 completed at ~7.5 s each; 1,993.0 s total;
      1.22 GB peak RSS.
      Recorded limits on the numbers, not asterisks on the criterion: the 12 is
      censored at 60% and came from a 20 s alarm while the matched 8 s arms
      max out at 11, and axis 1's numbers are cited to RUN-ECQ-81141a-002 rather
      than to gap_analysis.json, whose axis-1 fields are hardcoded literals that
      bind nothing (red-team OBJ-1).
