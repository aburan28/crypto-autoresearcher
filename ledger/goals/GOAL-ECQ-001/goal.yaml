research_goal:
  id: GOAL-ECQ-001
  title: Highest certifiable Mordell-Weil rank OVER Q, and the measured gap to the world record
  objective: 'The user target is rank > 30 OVER Q. That means rank >= 31 over Q, which is an OPEN
    WORLD RECORD: the largest rank known for an explicit curve over Q is 30 (Alpoge-Howell 2026),
    after 29 (Elkies-Klagsbrun 2024) and 28 (Elkies 2006). This campaign does not pretend that a
    bounded search will beat it. It builds the actual record-class pipeline -- a high-rank elliptic
    surface over Q(t), Mestre-Nagao sieving of its specialisations, descent certification over Q
    -- certifies the best rank it genuinely reaches, and MEASURES the distance to 31 in the terms
    the record is actually made of: the rank of the Q(t) base curve and the sieve volume. A number
    for the gap is a real deliverable; a rank-14 curve reported as progress toward 31 without that
    number is not.'
  question_ids:
