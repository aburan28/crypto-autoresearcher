    round's attempt.

    Scope finding, stated precisely because the report's own disposition
    label ("obstruction_found") could otherwise be read more broadly than
    what was actually shown: what is proven here is that the EIGHT FROZEN,
    AS-BUILT EXP-CREP-001 ROUTES, exactly as constructed, are held to a
    Theta(B^3) online floor by a directly-verified absent decomposition in
    a step every one of them shares (mechanically forced by the verifier's
