    prior_gate_g2_g8_wording_before_amendment_20260830.

    (b) Structural argument. The proposed coefficient-space-versus-ideal/root-space
    dichotomy (framing-revisit-analysis.yaml, proof-search-map.yaml) was
    tested by its own producer against a proves-too-much control: subproduct-tree
    / remainder-tree reduction of a product of known, public linear
    factors modulo a smaller polynomial. This Coordinator confirms, on
    general computational-algebra grounds, that this control object is
    real: quasi-linear-time reduction of an explicit product of known
    linear factors via a divide-and-conquer product/remainder tree,
    without materializing the full product and without any external
    witness, is standard, well-established computer algebra (the same
    fast-modular-transforms lineage EXP-CREP-001's own ROUTE-04 is built
    on) -- this is not a fabricated or exaggerated citation. However, this
    Coordinator's own independent re-derivation finds the producer's
    "control fails / general form falsified" framing overstates what the
    control actually shows against the SCOPED argument as literally
    written (premises P1-P3 with P2's explicit asymmetry condition): the
    control object's roots (the known scalars a_i) are FREE, PUBLIC data,
    which places it on the same side of premise P2's own carve-out as
    g_I's already-exempted public roots, not on r_R's non-free side: a
    root-space technique using free root data was never claimed by P1-P3
    to require importing a witness, so the control does not, strictly,
    exhibit a like-for-like object satisfying the scoped argument's stated
    premises with a different, contradicting conclusion. The producer's
    own proof-search-map.yaml already partially discloses this nuance
    ("is_the_collision_resolved_by_an_additional_condition: Yes ... an
    additional condition (P2's asymmetry) is available"), but its
    overall_audit_verdict still states the control refutes the argument
    without this qualification carried through to the headline framing.

    This Coordinator's independent judgment therefore differs in reasoning
    but reaches the SAME practical conclusion, for a related but more
    fundamental reason: independent of whether the proves-too-much control
    is a strict logical counterexample, premise P2/P3's central asymmetry
    -- that r_R's factor/ideal structure is "not free" in the specific
    sense that blocks a remainder-tree-style telescoping construction --
    is ASSERTED by definition (r_R's structure is the sought witness,
    hence by definition not free) rather than DERIVED from the P1553
    complete-chart system's own defining equations. A dichotomy whose
    distinguishing premise is definitional rather than derived adds no
    independent explanatory content beyond the raw fact that eight tried
    routes each hit one of two predicate failures; it does not establish
    that a third mechanism is impossible, only that none was found. This
    is exactly the gap CLAUDE.md's asymptotic-complexity promotion gates
    require to be closed (an explicit, numbered, validated heuristic or
    derivation, not an assertion) before any structural claim -- even a
    conditional one -- could be entertained, and it independently confirms
    the record's own quantifier-order finding (existential-negative over a
    finite retrieved list, not a proof). Decision: the structural argument
    does NOT survive review, for the reason recorded at
    preadmission_structural_argument_review_decision_20260830, and
    H-CREP-001/EXP-CREP-001 remain unchanged.

    A genuinely useful residual survives regardless of which reasoning
    chain is used: EXP-CREP-001's own execution-report.yaml
    (predicate_matrix) records, as a plain machine-verified fact, that
    ROUTE-04-multipoint-evaluation and ROUTE-07-subresultant-hgcd -- the
