    graph) to the classical subproduct-tree/remainder-tree reduction of a
    product of known linear factors modulo a smaller modulus. This
    Coordinator confirms, on general and well-established computational-
    algebra grounds (the same fast-modular-transforms lineage ROUTE-04 is
