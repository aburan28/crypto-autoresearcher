    known linear factors. This is a genuine, already-recorded anomaly
    whose EXPLANATION (what specific property of the complete-chart
    system's local pair-product generators blocks the same telescoping)
    has not been derived by any of the thirteen literature-search rounds
    or by this review, because all fourteen analytical passes to date
    have searched external literature or audited wording/argument
    structure rather than deriving the P1553 object's own combination
