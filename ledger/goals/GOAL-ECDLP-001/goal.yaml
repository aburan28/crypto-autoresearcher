  preadmission_gate_framing_review_terminal_note_20260830: >-
    Coordinator closeout (TASK-20260830-443b92) of the gate-calibration and
    framing-revisit review dispatched at
    prior_next_action_before_gate_framing_review_close_20260830 and
    produced by TASK-20260830-1e385f at
    coordination/goals/GOAL-ECDLP-001/proposals/B71-GATE-FRAMING-REVIEW-20260830-1e385f/tasks/TASK-20260830-1e385f/
