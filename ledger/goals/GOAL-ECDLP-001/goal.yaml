  frontier_rerank_20260728:
    performed_on: '2026-07-28'
    performed_by_task: TASK-20260728-002
    trigger: >-
      The BATCH-008 resume action TASK-20260727-033 is discharged and explicit user direction
      of 2026-07-28 authorizes continued operation. Two research resume actions were live
      and competing for one bounded batch.
    candidates:
    - id: CAND-A
      name: EXP-STR-004, carried as DEFER-BATCH007-001
      lane: H-STR-002, the phi-invariant factor base and displacement-rank lane
      standing: >-
        THE COMMITTED RESUME ACTION, preserved verbatim in superseded_next_actions and never
        retracted. RT-20260727-004 called it the replication that a `weaken` on an `empirical_only`
        basis requires.
      cost: implementation low, compute low
      rank: 2
    - id: CAND-B
      name: IDEA-20260727-008, frozen as H-ENDO-001 and EXP-ENDO-001
      lane: endomorphism-rank cost curve on the ECDLP witness lattice
      standing: >-
        A proposal, class `control`, cost low/low, recommended_priority high, carrying the
        load-bearing claim of IDEA-20260727-005's exit-map classification barrier.
      cost: implementation low, compute low
      rank: 1
    ranking_reasons:
    - >-
      EXPONENT VERSUS COFACTOR, THE GOVERNING BIAS. Under the target-result profile rule that
      constant-factor speedups, implementation tuning and logarithmic-cofactor improvements
      are valuable engineering but are not target-class, CAND-A sits in a lane whose only
      reproducible effect is the constant factor r = 3 measured at 2.62 to 3.20x, and its
      best outcome adjudicates an INSTRUMENT inside that lane. CAND-B's primary metric is
      the search exponent in N as the endomorphism rank rises, and its F1 branch would identify
      an exponent-relevant mechanism. Only one of the two can move an exponent in either direction.
    - >-
      THE REPLICATION OBLIGATION IS NOT YET DUE. DEC-20260727-009's `weaken` rests on three
      grounds it states are independent of the instrument question. The replication CAND-A
      owes binds the NEXT transition of H-STR-002 in either direction; BATCH-009 proposes
      none, so deferring CAND-A defers no decision and leaves no claim resting on an unreplicated
      basis.
    - >-
      REFUTATION-ARTIFACT STRENGTH. CAND-A can produce, at best, another instrument statistic
      about a metric DEC-20260727-009 declares UNADJUDICATED. CAND-B produces exact integer
      Hermite normal form indices, certificate-verified witnesses replayed on the curve with
      [k]P = Q checked, a PLANTED positive control that voids its own negatives if undetected,
      and a known-answer calibration against the classical 0.886 sqrt(N/|Aut|).
    - >-
      ROADMAP GATING. CAND-B bounds or collapses IDEA-20260727-005's classification barrier
      BEFORE compute is committed to IDEA-20260727-006 or -007. CAND-A gates nothing outside
      its own lane.
    - >-
      COST PARITY. Both are low/low. Ranking CAND-B first buys the exponent-relevant question
      at the same price.
    honest_counterweights:
    - >-
      CAND-A is the committed resume action and CAND-B is not. A committed action is being
      outranked by a proposal, which is a Coordinator judgement, not a discharge of a prior
      commitment.
    - >-
      Deferring CAND-A leaves the `phi_alpha` instrument question UNADJUDICATED for at least
      another batch and leaves H-STR-002 `weakened` on a basis whose replication is still
      owed.
    - >-
      CAND-B's dominant confound is real: at 16 bits and r = 4 the constant 2^r and sqrt(N)
      are the same order of magnitude, which is why four field sizes are required and why
      the red team is asked to attack the fit rather than accept it.
    - >-
      CAND-B's higher-rank cells are SYNTHETIC, because only three efficiently computable
      eigenvalues exist at j = 0 and two at j = 1728. Beyond those bounds the rank sweep tests
      lattice geometry, not a realizable attack.
    what_this_rerank_does_not_do: >-
      It does not retract, cancel, supersede or discharge EXP-STR-004; it does not settle
      the `phi_alpha` instrument question, which remains UNADJUDICATED; it does not assert
      CAND-B is more likely to succeed - its confirmatory outcome is a NEGATIVE and the batch
      is dispatched expecting one; and it changes no hypothesis status.
    deferred_candidate_record: DEFER-BATCH009-001 in the BATCH-009 dispatch queue
