  independently_passing:
    - exact snapshot commit, sole parent, reachability, six-path diff, commit identifiers, record IDs, receipt, and all frozen hashes
    - strict single-document duplicate-key-free parsing of all five producer artifacts and both independent reports
    - decoder-reachable point/null KAT at p=262147, exact decode and re-encode, SHAKE256 output, labels, replay bytes, and digest
    - 47185926 total verification and KAT passes, 283115556 verifier additions, and 28800 fixed-table additions
    - all twenty-eight class populations conserve exactly across setup, treatment, control, candidate, rho, and BSGS columns
    - deterministic event-index-to-shard arithmetic, separated aggregate CPU and wall axes, and exact declared record widths
    - declared group-operation, logical-traffic, archive, communication, output, 450000/562500 wall-second, and 988/1235 CPU-hour caps
    - null future executable hashes and coverage evidence, authorization false, maximum_runs zero, and 18-to-30-bit finite-toy ceiling

  blockers:
    - id: receipt-grammar-uninstantiable
      finding: >-
        The common schema rejects unknown fields but has no allowed payload
        container or payload_sha256 preimage rule. It also requires a
        prerequisite digest for custody_open despite zero prerequisites and
        freezes no sentinel. The partial replay KAT is not a conforming full
        production receipt.
    - id: consumer-block-receipt-collision
      finding: >-
        Class-level q blocks can cross consumer boundaries while a receipt has
        one consumer_id. At 18 bits, group-addition block 2231 contains 11940
        treatment events and 1168 control events, so the written receipt
        cannot represent the mandatory block.
    - id: census-receipts-and-reset-work-uncharged
      finding: >-
        Full-census q widths imply 5660902 block receipts whose paths, bytes,
        hashes, counters, archive and communication costs are absent. The 480
        fresh-sandbox blocks, cooldowns, cache resets, counter snapshots and
        environment records likewise lack complete resource ownership.
    - id: candidate-slot-semantic-bijection-missing
      finding: >-
        The 3145728 slots per size factor through curve, model, eta, root and
        candidate coordinates, but the 96-byte record omits model_id and eta
        and freezes no slot-index bijection. Cardinal coverage can therefore
        conceal duplicated and missing semantic cells.
    - id: fixed-target-cost-pairing-lost
      finding: >-
        The compiler does not preserve the joint targetwise pairing needed for
        E[C_i/p_i]. Two populations with inverse-success factors (1,2) and
        costs (1,2) versus (2,1) compile to the same marginal product 2.25 but
        have correct mean expected costs 2.5 and 2.0.
    - id: rho-walk-schedule-selectable
      finding: >-
        Walk IDs map modulo five shards, but neither the initial walk set nor
        the intra-shard schedule among resident walks is frozen. Compliant
        implementations can produce different state order, collisions,
        restarts, stopping outcomes and finite costs.
    - id: finite-frontier-incomplete
      finding: >-
        One fixed rho and one full-table BSGS row do not establish a complete
        nondominated frontier. Memory-bounded or segmented BSGS and
        parameterized rho time-memory configurations can add nondominated rows
        on the declared physical axes.
    - id: executable-and-coverage-self-hashes-circular
      finding: >-
        manifest_sha256 and coverage_sha256 occur inside the exact JCS objects
        they purport to hash without an omitted-field, fixed-null, or external
        receipt preimage rule.
    - id: syscall-policy-overclaims
      finding: >-
        The frozen seccomp policy is asked to distinguish pathname contents
        and temporal or dataflow properties that seccomp cannot observe; the
        prospective executable contract therefore does not uniquely enforce
        its stated separation.
    - id: physical-noninterference-family-incomplete
      finding: >-
        Wiring-line touches are a mandatory directed physical axis but are in
        neither the exact identity set nor the noisy interval family. Adding
        them yields 105 intervals and remains below the stated family ceiling,
        so omission is unnecessary and blocking.
    - id: median-only-interference-gate-insufficient
      finding: >-
        Twenty-eight zero log ratios and four log(2) ratios pass the fifth-to-
        twenty-eighth order-statistic median interval despite two-fold
        interference on 12.5 percent of blocks. A finite tail or maximum-
        affected-block criterion is required in addition to median
        equivalence.

  cheapest_falsification_control: >-
    Before any implementation proposal, construct one complete custody_open
    receipt from the frozen grammar and one group-addition census receipt for
    18-bit block 2231. Both fail without running curve code: the first lacks
    frozen payload and zero-prerequisite bytes, and the second spans two
    consumers while permitting one consumer_id.

  next_action: >-
    Open a fresh maximum-runs-zero static successor, not an Executor task. It
    must freeze a conforming self-neutral receipt grammar and KAT; split blocks
    at consumer boundaries and charge every receipt/reset artifact; add an
    exact slot-to-curve/model/eta/root/candidate bijection; retain targetwise
    cost pairing; freeze rho walk population and step schedule; enumerate and
    compare the finite memory-time baseline frontier; define self-neutral
    manifest and coverage hash preimages; separate enforceable syscall rules
    from external path/dataflow validation; and add wiring plus sparse-tail
    physical noninterference gates. Preserve every passing KAT, population,
    charge and cap above and obtain fresh independent Validator and Red Team
    verdicts. No implementation or execution is admitted before dual PASS.

