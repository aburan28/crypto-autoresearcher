  summary: >-
    BATCH-ea56c5 repaired and independently preserved the predecessor's
    canonical decoder/null KAT, exact three-mount verification population,
    six-addition verifier charge, twenty-eight class population/allocation
    sums, deterministic event-to-shard arithmetic, declared resource caps,
    and no-execution toy claim ceiling. The independent Validator and Red Team
    nevertheless both return REVISE. The receipt grammar has no unique
    conforming production instance; class blocks and candidate slots do not
    carry enough consumer and semantic coordinates; rho scheduling and the
    claimed finite frontier remain selectable or incomplete; self-hash
    preimages are circular; fixed-target cost pairing is lost; mandatory
    receipts, sandbox/reset work, and physical wiring observations are not
    completely charged or adjudicated; and a sparse two-fold interference
    pattern can pass the median-only physical criterion. No implementation or
    experiment is admitted and no ECDLP evidence follows.

