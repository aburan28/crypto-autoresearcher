        (archive_scheduled_bytes). This exact x3-mount-state-multiplier
        derivation was independently verified FOUR times total: by that
        earlier batch's own Validator (TASK-20260811-b34084) and Red Team
        (TASK-20260811-c0a729) when it was first derived, and now again by
        this batch's Red Team and Validator. The producer's own
        authoritative_sources_used list confirms it read the file one hop
        before this reference without following it further.

        Both reviewers independently confirm this basis is itself disclosed,
        by its own original authors, as a DERIVED (not directly-stated, not
        provably certain) x3-multiplier inference -- not a directly-measured
        formula -- and that an alternative additive-delta derivation was
        also computed there giving a different, larger total (7713503488),
        used as a robustness check, not adopted. Any future citation of this
        basis must carry that same derivation-uncertainty disclosure
        forward, not present it as certain.

        For communication_scheduled_bytes, BOTH reviewers independently
        confirm NO comparable per-row basis exists anywhere in the inherited
        chain (the same BATCH-68ea16 document explicitly states "no
        analogous population-driven class exists for communication_bytes"
        and its own communication figure is only a weaker, total-level
        "extend by symmetry" relationship: 5614086912 = 3 x 1871362304,
        disclosed as "an explicitly weaker, more uncertain extrapolation,"
        not a row-level itemization). The producer's
        NOT_ACHIEVABLE_WITHOUT_FABRICATION conclusion IS well-supported for
        communication specifically.

        This is a genuine premature-closure defect under
        docs/inventor-protocol.md (a closure with a named obstruction and an
        argument that appears well-formed but rests on a factually false
        premise -- "no relationship exists anywhere in the chain" --
        discoverable one hop past material the producer itself cites as
        read), not a fatigue report and not evidence of fabrication by the
        producer.
