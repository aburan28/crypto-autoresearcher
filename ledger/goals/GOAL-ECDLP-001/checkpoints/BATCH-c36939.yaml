  supported_static_findings:
    - >-
      JPR-C1 through C7 jointly give a coherent conditional theorem architecture:
      if a concrete curve relation satisfies every row, the charged time and
      memory are N^(1/3+o(1)). No relation is shown to satisfy them.
    - >-
      Equal pair survival does not identify attack cost. Output-sensitive
      enumeration and conditioned collision concentration are separate
      load-bearing requirements.
