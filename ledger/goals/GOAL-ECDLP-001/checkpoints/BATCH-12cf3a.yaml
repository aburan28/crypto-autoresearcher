    - id: B61-DER-2
      finding: >-
        B61-DER-1 is an immediate semantic instantiation of B58-DER-1 with
        f=S and T=U. Arbitrary support size, labels, multiplicities, and seed
        structure do no mathematical work, so it is not a substantive theorem
        extension and supports no novelty claim.
      scope: proposition-level comparison to B58 only
    - id: B61-DER-3
      finding: >-
        Injectivity of the tracked state is not a scalar decoder. The exact
        control S(R)=R, U(R)=R+P is injective while decoding S(Q)=Q remains
        the original ECDLP.
      scope: decoder sufficiency for the frozen b_P=1 slice
    - id: B61-DER-4
      finding: >-
        The Kummer state x(R) has exact two-valued translations
        Tau_P(x(R))={x(R+P),x(P-R)} and
        Tau_Q(x(R))={x(R+Q),x(Q-R)}. This is a partial concrete b=2 EC
        boundary object, but source-consistent sign location,
        relation-producing replay, and sub-rho cost remain absent.
      scope: nearby-object boundary control only
    - id: B61-DER-5
      finding: >-
        The generic max(pi,alpha+sigma) identity is valid only for genuinely
        one-time preprocessing and fully charged iid attempts. If seed failure
        triggers fresh preprocessing, C_pre belongs inside the corresponding
        retry nest; the producer's symbolic ledger does not separate seed and
        online success, detection, restart, reuse, or target-count quantifiers.
      scope: frozen symbolic cost ledger only
    - id: B61-DER-6
      finding: >-
        No concrete b>1 transition graph, locator, complete EC lineage,
        separation/collision theorem, decoder, replay, or all-axis cost point
        exists. The formal branch product is an upper bound, not a growth lower
        bound. The genuinely multivalued route therefore remains open.
      scope: frozen B61 packet only
