    WHAT WAS NOT OBTAINED is any admissible reading of the decomposition yield, because the
    pre-registered gate INV-4 voided every efficiency value before one could be read.
  outcome: >-
    executed_six_valid_runs_then_INV_4_fired_at_4_of_49_cells_so_every_efficiency_is_VOID_under_P0_decision_inconclusive_with_one_scoped_instrument_successor_and_the_fault_located_as_one_omitted_term_in_the_null_control
  claim_boundary: >-
    TOY TIER, 12 to 18 field bits, m in {2, 3}, x-interval factor bases on the frozen beta
    grid, ONE prime-order curve per size, one implementation, one budget, ONE UNREPLICATED
    RUN SET. EXP-YIELD-001 v2 SUPPORTS NO STATEMENT ABOUT DECOMPOSITION YIELD IN EITHER DIRECTION:
    INV-4 fired at 4 of 49 criterion-evaluable cells, so every occupancy-normalised efficiency
    is VOID rather than negative by pre-registration, no outcome branch is evaluated, and
    the void is never a negative mathematical result. What the batch supports, at claim tier
    toy and at no strength above preliminary, is ONE instrument finding on a DERIVATION basis
    - that the occupancy null does not simulate the process P_pred models, that the discrepancy
    is exactly the omitted |S_(m-2)| exp(-C_red/N) term at all 49 cells, and that restoring
    it recovers P_pred at 49 of 49 cells under both denominator readings. NO HYPOTHESIS STATUS
    CHANGED. No attack, no attack improvement, no cryptanalytic result, no closure, no impossibility
    claim, no target-class outcome, no exponent moved in either direction, all four asymptotic-claim
    promotion gates still OPEN, no closure quorum claimed or claimable, and the ledger still
    does not validate. Nothing measured here is evidence about cryptographic-size curves in
    either direction, and no correspondence argument to scale exists or is offered.
  honest_batch_accounting: >-
    THE EXECUTION DROUGHT IS BROKEN AND THE MEASUREMENT DROUGHT IS NOT. BATCH-011 is the first
    batch since BATCH-007 to produce committed run records, and its run package is the highest-integrity
    this program has produced - bit-exact re-execution, byte-identical summary regeneration,
    an independent recount through a different representation, and 128 independently re-verified
    certificates. It nonetheless answered NONE of the question it was built to answer, and
    the reason was a Coordinator-side arithmetic slip inside the contract pair that survived
    an amendment and TWO independent pre-execution reviews. The correction that suggests is
    not more review: it is that the cheapest control in the design - a curve-free balls-in-bins
    re-derivation costing seconds - was never run before the expensive one. RC-A is that control,
    and it is the single next action.
