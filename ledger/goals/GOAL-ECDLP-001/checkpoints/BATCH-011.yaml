  measurement_taken: >-
    YES, AND IT IS THE FIRST SINCE BATCH-007. An exhaustive census at 136 of 136 planned cells
    with no cell skipped, six run records all `completed_valid`, plus a shape-matched occupancy
    null, a factor-base-randomisation null, an EV-STR-001 calibration leg and matched Pollard-rho
