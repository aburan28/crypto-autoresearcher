# WRITE-ONCE. One checkpoint per file so that concurrent batch
# closes in different worktrees never touch the same bytes. Append a
# new file; never edit or reorder an existing one. Corrections
# supersede, exactly as they do for any other immutable record.
batch_checkpoint:
  batch_id: BATCH-005
  snapshot_archive_task_id: null
  snapshot_commit: null
  completed_review_task_ids: []
  review_verdicts: {}
  evidence_ids:
  - EV-IC-001
  - EV-STR-002
  - EV-GGM-001
  decision_ids:
  - DEC-20260726-005
  - DEC-20260726-006
  - DEC-20260726-007
  ledger_archive_task_id: null
  ledger_commits:
  - 5de2db97 (EV-IC-001 + DEC-20260726-005, EV-STR-002 + DEC-20260726-006)
  - 3a59a207 (EV-GGM-001 + DEC-20260726-007)
  ledger_commit_form: abbreviated_unverified_in_batch006_session
  outcome: three_support_decisions_two_resting_on_runs_without_any_decomposition
  integrity_note: >-
    The BATCH-005 coordination artifacts (dispatch queue, task cards TASK-20260726-005..008,
    snapshot and ledger archive receipts, review reports) were never committed and are absent
    from this worktree. The archive task IDs, snapshot commit and review verdicts are therefore
    unknown and are recorded as null rather than reconstructed. The evidence and decision
    records themselves ARE committed and are the only durable BATCH-005 artifacts. Per docs/dynamic-subagent-dispatch.md
    this is an evidence-integrity gap in the batch's provenance chain, not a mathematical
    result; it means the three BATCH-005 decisions carry no verifiable independent-review
    receipt in the ledger.
  claim_boundary: >-
    Toy scale only. EV-GGM-001 (strong, derivation) establishes that the jet (C=1) and endomorphism
    (C=0) oracles are GGM-simulable under the STRUCTURED generic group model with a public
    curve equation - a scale-independent closure at exponent 1/2 for those candidate families,
    and explicitly not a claim under the strictest Shoup GGM, where EV-GGM-001's own boundaries
    state both would be NON-SIMULABLE. EV-IC-001 (preliminary) and EV-STR-002 (preliminary)
    each carry a recorded confound in their own boundaries blocks - "all Groebner solves on
    trivial ideals (no decompositions)" and "all Groebner solves on trivial ideals (no decompositions
    at B >= 27)" respectively - so the two support verdicts DEC-20260726-005 and DEC-20260726-006
    rest on runs in which no decomposition ever occurred, and EV-STR-002's cost advantage
    is a model comparison rather than a measured wall time. No attack improvement, no crypto-scale
    evidence, no breakthrough. BATCH-006 exists to test the first of those two confounds (EXP-IC-002).
  claim_boundary_correction: >-
    The two quoted confound statements are quoted accurately from EV-IC-001 and EV-STR-002,
    but the EV-IC-001 one is FALSE as an absolute claim about the EXP-IC-001 run set and true
    exactly at field_bits >= 20. Superseded by ledger/corrections/CORR-20260727-005.yaml.
    The EV-STR-002 quotation is not corrected: that census has not been run.
