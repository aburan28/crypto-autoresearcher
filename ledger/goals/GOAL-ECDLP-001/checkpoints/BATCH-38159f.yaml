  blockers:
    - id: receipt-domain-exceeds-unchanged-archive-cap
      finding: >-
        5660912 lossless 280-byte receipts require 1585055360 bytes. Replacing
        the 524288-byte legacy reserve yields 3439116160 archive bytes, exactly
        1131370560 above the unchanged cap. Only 453684800 bytes remain for all
        receipts; three unconstrained bytes32 fields alone need 543447552,
        exceeding that allowance by 89762752 before metadata or signatures.
    - id: reset-counter-and-census-artifacts-incomplete
      finding: >-
        The corrected census still omits complete codebooks and the owned
        bytes, paths, hashes, archive, communication, and physical costs for
        480 sandbox, reset, cooldown, environment, and counter records.
    - id: semantic-record-bijection-incomplete
      finding: >-
        The mixed-radix integer map round-trips but freezes no canonical
        curve/model/root/candidate registries, record bytes, widths, framing,
        empty encoding, or self-neutral checksum preimage.
    - id: targetwise-constructor-and-order-incomplete
      finding: >-
        The symbolic E[C_i/p_i] collision KAT passes, but the 1920 rational
        weights, 256-root interval constructors, outward-rounding bytes,
        digests, and root/attempt stopping order are not frozen.
    - id: rho-and-frontier-not-jointly-instantiable
      finding: >-
        The protocol fixes five shards while eight of twelve rho rows request
        one or eight workers. Transition, distinguished-point, encoding,
        collision, persistence, and broader nondominated frontier semantics
        remain incomplete; the one-worse-axis negative gate also rejects
        legitimate time-memory tradeoffs.
    - id: receipt-lifecycle-and-aggregation-incomplete
      finding: >-
        The signed KAT chain is internally consistent, but no lifecycle
        automaton, cross-receipt identity/status predicates, retention rules,
        or authenticated aggregation binds the 280-byte census record to the
        fourteen-field production receipt.
    - id: executable-and-self-neutral-closure-incomplete
      finding: >-
        Literal hash KATs pass, but complete final-object schemas and bindings
        are absent. Seccomp bootstrap and descriptor-broker ordering leave
        executable and pathname/TOCTOU gaps.
    - id: physical-cost-and-tail-scope-incomplete
      finding: >-
        Unique cache-line touches are not a proved Wiener wiring or full
        hardware-times-time cost. A two-fold disturbance of one complete
        target cell produces at most a 13/12 size-block ratio and passes the
        declared 1.25 tail threshold.

  cheapest_falsification_control: >-
    Before any new implementation proposal, require an injective-code proof
    for the complete receipt field domain under the exact remaining
    453684800-byte allowance. The three unconstrained bytes32 fields already
    refute such a proof by 89762752 bytes. Any successor must first narrow the
    field domain with proved derivation/correlation or change the census
