  independently_confirmed_repairs:
    - id: simultaneous_S4_substitution
      finding: >-
        The corrected S4 equals an independently constructed resultant, has
        free symbols exactly x1, x2, x3, and x4, contains no temporary t, has
        total degree 12, and evaluates to zero on the frozen F_101 group-sum
        witness. Independent additional F_101 and F_103 witnesses also pass.
    - id: legacy_full_curve_compatibility
      finding: >-
        The first three build_factor_base parameters and the default
        full_curve semantics remain compatible. The frozen default output is
        [34, 4, 25, 40, 30], equal to explicit full_curve, and all existing
        direct callers continue to omit the new scope keyword.
    - id: opt_in_target_subgroup_semantics
      finding: >-
        On the frozen order-11, cofactor-5 instance, target_subgroup returns
        exactly five distinct x-coordinates {12, 13, 18, 24, 33}; canonical
        lifts are n-torsion; repeated calls are deterministic; and oversize,
        shortfall, and unknown-scope paths fail explicitly.

