  summary: >-
    BATCH-1800b3 implemented the frozen EXP-SEMAEV-a097b5 shared-code
    contract with zero experiment runs. The patch constructs S4 with a
    simultaneous right-hand substitution so x1, x2, x3, and x4 all survive,
    and adds a keyword-only target_subgroup factor-base mode while preserving
    the legacy full_curve default exactly. Focused deterministic controls and
    the complete tests/test_harness.py suite pass. Fresh independent Validator
    TASK-20260813-d7ed22 and Red Team TASK-20260813-8ebacc reviews, in distinct
    verified review-adversarial xhigh Codex sessions, both returned PASS and
    recommend implementation acceptance. Their static consumer audit identifies
    EXP-MTIC-001 and EXP-FIB-001 as direct future S4 consumers, with 11 and 10
    committed run directories respectively that used the former shared path.
    CORR-20260813-d9f0fa therefore records an additive provenance notice: the
    archived bytes and numerical outputs remain immutable and are neither
    invalidated nor reinterpreted; any future numerical comparison requires a
    separately approved matched rerun. No ECDLP experiment, attack, speedup,
    hypothesis support, security-impact conclusion, or cryptographic-scale
    claim follows from this implementation result.

