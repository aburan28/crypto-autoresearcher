    - exact 450000/562500 planned/hard wall-second and 988/1235 planned/hard CPU-hour stage sums
    - corrected predecessor bucket population 583630848 and redesigned population 778174464
    - one authoritative chronological S0-through-S5 control order preserving all predecessor controls
    - 48 unique literal future paths under the fixed experiment root, all absent before implementation
