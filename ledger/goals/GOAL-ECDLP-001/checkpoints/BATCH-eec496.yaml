  blockers:
    - id: B1-incomplete-s3-physical-class-crosswalk
      finding: >-
        The seven stage totals and eighteen prefix-plus-remainder identities are
        exact, but the admission inequality quantifies over twenty-eight
        mandatory physical-cost classes using n_c, q_c, and shards_c. The
        contract supplies a differently named eighteen-row table, only two
        literal identifier matches, and no per-class shard allocation. Its
        full-work CPU and wall projections therefore cannot be evaluated.
    - id: B6-unidentified-harmonic-slope-confidence
      finding: >-
        The Validator accepts the simultaneous per-input lower bounds as valid
        pointwise harmonic-cost bounds. The Red Team independently shows that
        pointwise H_N upper bounds do not order or identify the fitted slope,
        so they do not imply the stated one-sided gamma_fixed lower bound.
        The reused bootstrap does not construct the required joint confidence-
        set extremum, and the restart-population semantics are not operationally
        frozen. This disagreement is resolved conservatively as blocking.
    - id: B7-noncanonical-generator-and-replay
      finding: >-
        Domain names and finite populations exist, but field-coefficient maps,
        prime/certificate selection, curve-order tooling and schema, base-point
        decoding and sign rules, scalar rejection sampling, serialization, and
        sealed-seed replay are not byte-exact across compliant implementations.
    - id: B8-treatment-wide-losslessness-gap
      finding: >-
        Complete-stream X counting and thirty-third-candidate invalidation are
        explicit, but X equals V is mandatory only for fixtures, not every
        treatment and same-path-null root. Candidate and witness identity are
        also not fully reconciled, so the primary X-to-V-to-S bridge remains
        incomplete.
    - id: B9-noncanonical-same-path-null
      finding: >-
        The downstream treatment-shaped path and aggregate charging improve on
        the predecessor, but the XOF permutation, ordering, odd-length handling,
        sign complement, and word-to-permutation map are not canonical and no
        single-delta machine manifest proves that public labels are the only
        treatment/null difference.
    - id: B10-incomplete-physical-and-crossover-accounting
      finding: >-
        Twenty-eight physical classes are named, but there is no per-size
        H_N times C_root(N) times wiring(N) total-cost assembly or direct
        finite-ladder comparison with Pollard rho. The harmonic fits are not
        separately charged or proven reused. The Validator additionally finds
        that full true-plus-decoy verification would require at least 31457280
        scalar verifications and 47185920 candidate write/read events, leaving
        at least 15728640 scalar verifications and 15728640 reads uncharged
        before lower-level group, CPU, wall, memory, and energy costs.
    - id: B12-incomplete-and-contradictory-noninterference
      finding: >-
        The process boundary is useful, but decoy coverage does not freeze a
        finite population over curves, models, roots, arms, and candidates.
        Moreover, public verification by [k_hat]P=Q should make V and S
        independent of the hidden scalar, while another clause permits them to
        depend on verifier substitution. The primary outcome and its cost are
        therefore not reproducibly isolated from verifier-only state.

  cheapest_falsification_control: >-
    Before another full specification rewrite, implement no curve code. Freeze
    and run a zero-experiment symbolic contract test that holds every observed
    L_i and H_N upper bound fixed while selecting two admissible probability
    vectors inside the same simultaneous confidence set whose harmonic slopes
    lie on opposite sides of 5/18. Require the current gamma gate to reject.
    In the same static compiler, require a one-to-one 28-class n_c/q_c/shards_c
    crosswalk and exact true-plus-decoy population accounting. These controls
    cheaply falsify the current slope and throughput/cost interfaces.

  next_action: >-
    Open a fresh static successor, not an Executor task. It must construct a
    joint confidence-set extremum for the harmonic slope or remove that claim;
    freeze restart semantics; provide a canonical generator/replay algorithm;
    require X=V for every valid treatment and null root; compile one exact
    single-delta null manifest; map all twenty-eight physical classes to
    prefix populations and shards; assemble per-size fully charged restart
    cost against rho; and make public verification and exhaustive decoy
    noninterference internally consistent. Preserve the existing caps and
    obtain new independent Validator and Red Team verdicts. No implementation
    or execution is admitted before dual PASS.

