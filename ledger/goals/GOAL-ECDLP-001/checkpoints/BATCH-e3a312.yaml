  blockers:
    - id: B1-budget-incompatibility
      finding: >-
        Corrected compiler schedule 451200/564000 wall seconds and 992/1240
        CPU hours exceeds the separately authorized 450000/562500 and 988/1235
        ceilings by 1200/1500 wall seconds and 4/5 CPU hours. The difference is
        in S3 curves and isomorphism fixtures. No budget increase is authorized.
    - id: B2-prior-review-commit-misbinding
      finding: >-
        The contract assigns the independent PASS review to proposal snapshot
        225ce3b63a4233b81b08657fe0ca5144a7839242, where the review path does not
        exist. The exact review bytes are first durable at ledger archive
        9bc747e770323dac560ff7932977669a1221e9b7.
    - id: B3-stale-bucket-artifact-count
      finding: >-
        The required-artifact inventory retains 585105408 bucket integers, but
        the corrected compiler schedules 583630848 list/join rows. The
        1474560 difference is padding with no scheduled event.
    - id: B4-control-order-conflict
      finding: >-
        controls.execution_order places repeated coverage before selector
        controls, while numbered stages put S1 selector controls before S2
        coverage; no precedence rule resolves the contradiction.
    - id: B5-nonexact-artifact-paths
      finding: >-
        Nine of ten future required artifacts are descriptions rather than
        exact repository-relative paths, so implementation archival coverage
        is not statically enforceable.
    - id: B6-marginal-fixed-target-inversion
      finding: >-
        The contract estimates family-marginal E[p(C,Q)] but assembles fixed-
        target restart cost as its reciprocal. Fixed-target expected cost
        requires E[1/p(C,Q)] or a preregistered uniform lower-tail gate. The
        Red Team supplied an identical-observable family with infinite cost.
    - id: B7-unfrozen-curve-target-generation
      finding: >-
        The 15 domains do not freeze curve or target generation, rejection
        policy, discovery cost, or special-curve exclusion, so the public
        family and target distribution are not reproducible.
    - id: B8-x-v-s-and-overflow-gap
      finding: >-
        Paley-Zygmund controls Pr[X>0], while runtime success is S=1[V>0]. The
        contract lacks a hard X-to-V-to-S losslessness gate and exact invalid
        behavior for overflow of the 32 candidate slots.
    - id: B9-nonidentical-null-path
      finding: >-
        The declared identical-shape null does not use the same widths, model
        transformations, and treatment path, leaving apparatus differences as
        an alternative explanation.
    - id: B10-incomplete-end-to-end-costs
      finding: >-
        Explicit group/field/logical-traffic arithmetic passes, but the
        physical manifest does not yet fully charge labels, SHAKE, hashing,
        joins, comparisons, witnesses, input certification, high-precision
        fitting, archives, and Wiener wiring on one end-to-end basis.
    - id: B11-finite-ladder-ceiling
      finding: >-
        The 18-to-30-bit ladder can support only a toy finite-ladder
        coefficient, not an asymptotic or cryptographic-scale exponent.
    - id: B12-verifier-secret-noninterference
      finding: >-
        The known target scalar used by the verifier lacks a frozen selector-
        verifier noninterference gate that prevents leakage into selection.

  cheapest_falsification_control: >-
    Before any implementation, build a versioned static contract compiler that
    rejects unless one canonical source produces every schedule and budget
    total, every required artifact is an exact path, and curve/target domains
    are explicit. Add a zero-compute observation-fiber unit control with two
    families having identical marginal observables but different E[1/p] and
    require the fixed-target inference to reject. This directly falsifies the
    current reciprocal-of-marginal rule without curve computation.

  next_action: >-
    Open a fresh proposal/design-repair batch, not an Executor batch. It must
    repair all B1-B12 in one versioned successor: reconcile the full schedule
    within the existing authorized caps by removing only proven duplicate
    accounting or by a power-justified workload redesign; otherwise request
    explicit user budget authority. Bind the prior PASS review to archive
    9bc747e, correct the bucket count, freeze one control order and exact future
    artifact paths, replace reciprocal-of-marginal fixed-target inference with
    an E[1/p] or uniform-tail design, add curve and target generator domains,
    X-to-V-to-S/overflow invalidation, identical-path nulls, complete physical
    cost accounting, toy-only claim ceiling, and verifier noninterference.
    Snapshot exact bytes and obtain new independent Validator and Red Team
    verdicts. No implementation or execution is admitted before dual PASS.

