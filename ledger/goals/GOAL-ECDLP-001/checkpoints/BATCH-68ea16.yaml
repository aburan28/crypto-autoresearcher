    capacity-fit residuals (VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED,
    VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP) that fits within unchanged
