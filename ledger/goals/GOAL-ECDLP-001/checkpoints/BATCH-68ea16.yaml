  independently_confirmed_closures:
    - id: RT-OBJ2-asymmetric-shard-parallelism-biases-wall-axis-of-positive-gate
      finding: >-
        Both reviewers independently confirm shard_sets.rho and
        shard_sets.bsgs are symmetrically widened from five to eight shards,
        matching the candidate path and budget.maximum_parallel_shards: 8,
        with zero side effect on any group-addition, logical-traffic,
        archive, communication, output, CPU-hour, or wall-second figure in
        the document. CONFIRMED_FULLY_CLOSED (both).

  partially_closed_findings:
    - id: RT-OBJ1-candidate-population-cap-N-independent-vs-HA1-N-dependent-boundary
      finding: >-
        The original "no derivation, no bound, no overflow rule" defect is
        independently confirmed closed: a correct, independently reproducing
        worst-case bound (8*(L(bits)-1), exact at all five ladder sizes) and
        an overflow-invalidation rule symmetric with the pre-existing
        output-byte rule now exist. What remains open: no worst-case-certain
        bound shows 32 is adequate at any tested size; adequacy holds only
        conditionally on the producer's disclosed DERIV-1 heuristic. The
        Validator independently found one isolated, non-consequential
        arithmetic literal error in DERIV-1's bits=27 row. The Red Team
        independently found (NEW, not raised by any prior reviewer) that
        DERIV-1's disclosed margin is internally inconsistent with
        H-SYC-b854f4's own already-adopted HA-2 heuristic by two to three
        orders of magnitude at the hypothesis's own decision-relevant
        parameter range: recomputed from HA-2 directly, the margin at the
        decision threshold gamma_x=5/18 is only 64x-101.6x, and at the
        theoretical ceiling gamma_x=1/3 it is a constant 32.0x at every
        tested size -- razor-thin, and neither computed nor disclosed by the
        producer.
    - id: VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-UNCHARGED
      finding: >-
        Both reviewers independently confirm the silent non-charging defect
        is genuinely fixed: archive_hashing, archive_scheduled_bytes, and
        communication_scheduled_bytes are no longer byte-identical to the
        unrepaired deep predecessor. What remains open: the correctly
        recharged totals independently confirm to exceed the unchanged
        archive_hard_cap_bytes and communication_hard_cap_bytes by
        3256009664 and 3285369792 bytes respectively; this batch has no
        authority to raise either cap.
    - id: VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP
      finding: >-
        Both reviewers independently confirm the undisclosed file-swap
        defect is genuinely fixed: every one of the ten legacy output files
        now has an explicit, traceable disposition. What remains open: the
        honest, independently reconfirmed sum of every required file
        (15520768 bytes) exceeds the unchanged declared output_caps total
        (8388608 bytes) by 7132160 bytes; this batch has no authority to
        raise that cap.

  newly_identified_residuals:
    - id: RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2
      source: red_team
      severity: blocking
      finding: >-
        See partially_closed_findings.RT-OBJ1 above. This is a NEW,
        blocking calibration defect distinct from the original RT-OBJ1
        (which challenged the absence of any bound; this successor supplies
        a bound, but its attached confidence figure is miscalibrated
        against the hypothesis's own model).
    - id: RT-68EA16-OBJ2-peak_live_bytes-shard-sensitivity-unaudited
      source: red_team
      severity: moderate
      finding: >-
        The shard-widening repair's claim of "provably zero effect on every
        ... figure" omits peak_live_bytes, the one non-additive comparison
        axis among the nine mandatory candidate_positive_gate axes not
        actually checked; a plausible ~8/5x increase in BSGS's
        concurrently-live baby-table memory from the 5-to-8-way widening is
        neither derived nor disclosed. Non-blocking to this batch's
        static-review admissibility (no live number is asserted or
        contradicted); blocking to accepting the "every figure" claim as
        written.
    - id: RT-68EA16-OBJ3-RTOBJ3-RTOBJ4-deferred-status-not-recorded
      source: red_team
      severity: advisory
      finding: >-
        DEC-20260809-e35473's next_actions and this batch's own task card
        both explicitly required RT-OBJ3 (crossover-N estimate) and RT-OBJ4
        (k-list/generalized-birthday baseline) to be noted as deferred, not
        dropped. A text search of all five reviewed producer artifacts
        found zero matches. Cheap compliance gap, not fulfilled in this
        batch.
    - id: VAL-68EA16-DERIV1-BITS27-LITERAL-ERROR
      source: validator
      severity: informational
      finding: >-
        The DERIV-1 by_size table's bits=27 expected_occupancy literal
        (claimed 0.0000304654240608) fails independent recomputation
        against the document's own formula (correct value
        0.0000304579734802); isolated to one literal, non-consequential to
        the qualitative conclusion (the row's own margin_vs_32 field is
        consistent with the correct value, not the erroneous one).
    - id: VAL-68EA16-SYSCALL-COUNT-CITATION-INACCURACY
      source: validator
      severity: informational
      finding: >-
        sandbox-policy.json's supporting prose cites a "37-syscall"
        allowlist; independently parsing the actual committed allowlist
        gives 40 entries. Inherited uncorroborated from the prior
        BATCH-ea56c5 Validator's own report; does not affect the disclosed
        byte estimate or any sum_check total.

  next_action: >-
    Coordinator opens one further versioned static successor to
