  blockers:
    - id: B7-production-seed-envelope-underbound
      finding: >-
        The literal AEAD KAT recomputes, but production AAD derivation,
        external key-ID framing, commitment binding, custody receipt bytes,
        retention, and destruction evidence are not frozen. Distinct
        implementations can therefore produce incompatible replay custody.
    - id: B1-event-to-shard-allocation-underdefined
      finding: >-
        Every physical row names a shard set but does not deterministically map
        each event index to one shard. Wall latency and residual-prefix
        measurements therefore remain implementation-selectable even when all
        declared n_c and q_c totals agree.
    - id: B10-class-to-candidate-cost-assembly-missing
      finding: >-
        The twenty-eight rows do not define an exact matrix from each class to
        setup, treatment, control, candidate, rho, and BSGS axes, nor exact
        residual-prefix equations. Per-size directed candidate bounds cannot
        be reproduced uniquely from the frozen rows.
    - id: B10-finite-baseline-frontier-incomplete
      finding: >-
        The rho distinguished-point table, tie and collision ordering,
        inter-shard behavior, and cycle policy remain selectable. BSGS remains
        a prose cost class rather than a byte-exact finite protocol, while the
        positive gate compares only to rho instead of the nondominated finite
        rho/BSGS frontier.
    - id: B9-null-point-kat-constructor-unreachable
      finding: >-
        The null KAT declares bits=18 but encodes affine points as two bytes
        0201 and 0301. Its own frozen generator uses a 19-bit field prime at
        that row, requiring a one-byte prefix plus a three-byte x coordinate.
        The supplied literal null point stream is therefore not accepted by
        the canonical decoder it purports to test.
    - id: B12-two-verification-passes-uncharged
      finding: >-
        Exhaustive noninterference requires three mount-state verification
        passes over 15728640 candidate slots, or 47185920 verifications. The
        scalar class charges only 15728640 plus six KATs, leaving exactly
        31457280 required verifications, their reads, counters, and archive
        effects uncharged.
    - id: B12-executable-and-coverage-universe-incomplete
      finding: >-
        Exact syscalls, interpreter and standard-library dependency closure,
        import machinery, scanner identity, canonical coverage records, and
        actual-stream replay are deferred. A synthetic fixture is not an
        exhaustive certificate for the outcome-dependent candidate stream,
        and exact equality of noisy physical counters across mount-state runs
        is not a valid noninterference invariant.
    - id: producer-sole-lifecycle-residual-misidentified
      finding: >-
        The immutable handoff requires a finite noninterference universe to be
        frozen, but does not demand present hashes for code that does not yet
        exist or a present actual-stream coverage certificate. Those values
        are later maximum-runs-zero implementation admission evidence. The
        producer's asserted sole circularity therefore neither answers nor
        replaces the surviving static blockers.

  cheapest_falsification_control: >-
    Before another implementation proposal, run no curve code. Require the
    exact static verification-count identity for every noninterference mount:
    three times 15728640 equals 47185920 candidate verifications. The current
    compiler charges 15728640 plus six, leaving 31457280 uncharged, so it is
    rejected immediately. A successor must also prove every literal null point
    reaches its canonical decoder and compile every class into explicit
    per-size candidate, control, rho, and BSGS axes.

  next_action: >-
    Open a fresh static successor, not an Executor or implementation task. It
    must freeze production envelope and custody bytes; deterministic event-to-
    shard functions; a complete class-to-setup/treatment/control/candidate/rho/
    BSGS allocation matrix and per-size directed equations; canonical null
    points accepted by the declared decoder; all three fully charged
    verification passes; byte-exact finite rho and BSGS baselines; and a
    canonical executable, syscall, dependency, and actual-stream coverage
    universe with statistically sound noninterference criteria. Preserve the
    existing caps and obtain fresh independent Validator and Red Team verdicts.
    No implementation or execution is admitted before dual PASS.

