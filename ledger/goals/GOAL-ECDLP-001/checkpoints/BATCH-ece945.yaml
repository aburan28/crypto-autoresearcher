  summary: >-
    BATCH-ece945 froze a zero-run successor and three cheap falsifiers for the
    six BATCH-3468a0 blockers. Parent and independent recomputation confirm
    constructor-reachable confidence branches, twenty-four literal SHAKE256
    vectors, the supplied authenticated replay vector, point-null replay,
    twenty-eight physical-class populations and unique owners, corrected
    aggregate-CPU-versus-wall semantics, and all unchanged resource caps. The
    independent Validator and Red Team nevertheless both return REVISE. The
    production seed envelope and shard allocation remain underdefined; the
    class rows do not uniquely assemble per-size candidate/control/rho costs;
    the finite rho/BSGS frontier and noninterference universe are incomplete;
    and the Red Team exhibits both an unreachable 18-bit null point encoding
    and 31,457,280 uncharged verification passes. The producer's claimed sole
    pre-implementation hash circularity is not supported by its handoff. No
    implementation or experiment is admitted and no ECDLP evidence follows.

