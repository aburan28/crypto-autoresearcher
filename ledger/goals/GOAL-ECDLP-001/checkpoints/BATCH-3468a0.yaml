  blockers:
    - id: B1-incomplete-physical-class-ownership-and-allocation
      finding: >-
        The twenty-eight numeric rows and prefixes reconcile, but no row
        supplies the required artifact owner, shards_c is a count rather than
        an evaluable shard assignment, and decoy-scalar generation has no
        primitive-cost owner. Per-size n_c(b) and unambiguous probe ownership
        are absent.
    - id: B6-unreachable-and-incomplete-confidence-kat
      finding: >-
        The confidence-box extremum is mathematically correct, but the frozen
        KAT probability interval has half-width about 0.00629 while the frozen
        Hoeffding constructor radius is about 0.14702, so the end-to-end
        implementation cannot generate that KAT from its own interface. The
        KAT also exercises only eta=0 and omits eta=-4, eta=4, clipping, and
        the L_i=0 infinity branch.
    - id: B7-noncanonical-byte-framing-and-seed-absorption
      finding: >-
        The tuple encoder names one-byte type tags but provides no byte-value
        registry, no per-domain ordered tuple schemas, and no exact seed-to-
        SHAKE absorption or durable replay-key custody. Multiple compliant
        implementations can therefore emit different curves, targets, nulls,
        and replay bytes.
    - id: B9-null-bytes-and-shape-not-frozen
      finding: >-
        The rank-pair construction proves balance once bytes are fixed, but
        its KAT freezes counts rather than literal label bytes or a canonical
        digest. The arbitrary position pairing also does not preserve the
        treatment label's point-negation and duplicate-point correlations.
    - id: B10-no-fully-charged-per-size-hardware-time-rho-comparison
      finding: >-
        Aggregate class arithmetic does not define per-size class allocations
        or directed G, C, W, and rho bounds. Dividing CPU nanoseconds by shard
        count measures latency rather than hardware multiplied by occupied
        time; the Red Team's 720 CPU-ns over eight shards versus rho at 500
        CPU-ns over five shards reverses the claimed 90-versus-100 ordering.
        The Pollard-rho walk, seed, distinguished-point, restart, stopping, and
        per-size statistic are unfrozen, and new stored outputs are not fully
        included in traffic/archive accounting.
    - id: B12-nonexhaustive-public-verifier-isolation
      finding: >-
        The public verification equation is secretless, but six sandbox KAT
        invocations and five top-level graph names do not close the complete
        executable dependency, path, environment, descriptor, IPC/network,
        syscall, or policy universe for 15728640 candidate slots. Exhaustive
        counterfactual noninterference is therefore not reproducible.

  cheapest_falsification_control: >-
    Before another implementation proposal, run no curve code. Freeze a
    zero-run hardware-time shard-division collision certificate that compares
    both latency and aggregate processor occupancy for candidate and rho, and
    require the admission scalar to preserve the ordering. Pair it with a
    reachable end-to-end confidence KAT generated by the exact Hoeffding
    constructor and a literal byte-framing/XOF registry. Any reversal or
    unreachable KAT rejects the successor statically.

  next_action: >-
    Open a fresh static successor, not an Executor task. It must freeze the
    complete type-tag/domain/seed registry and literal null/replay KAT bytes;
    make confidence KATs reachable for every eta plus clipping and infinity;
    assign every class, artifact, probe, decoy-scalar cost, and shard by size;
    define hardware-time without shard-division ambiguity; freeze the matched
    Pollard-rho protocol and directed per-size totals; and close the finite
    executable noninterference universe. Preserve the existing caps and obtain
    fresh independent Validator and Red Team verdicts. No implementation or
    execution is admitted before dual PASS.

