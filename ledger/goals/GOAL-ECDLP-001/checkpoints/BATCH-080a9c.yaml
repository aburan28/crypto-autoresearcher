  summary: >-
    BATCH-080a9c froze EXP-SYC-b11b38 as a zero-run static successor to
    EXP-SYC-12de89 and obtained fresh independent Validator
    TASK-20260811-6b1bfb and Red Team TASK-20260811-d42301 reviews in distinct
    verified review-adversarial xhigh Codex sessions. Both returned REVISE.
    The snapshot is authentic and several scoped repairs are real: the HA-2
    mean calculation and X-to-accounting-tuple correspondence are explicit;
    the DERIV-1 bits=27 literal is corrected; RT-OBJ3 and RT-OBJ4 are visibly
    recorded as open and deferred; the prior eight-way shard equalization,
    deterministic worst-case candidate_index bounds, and no-truncation
    overflow rule remain intact; and the widened BSGS peak-memory dependency
    is no longer falsely called invariant. The remaining gates are material.
    HA-2 supplies a mean but no finite per-tuple tail, dependence model, or
    simultaneous maximum-over-98304-tuples certificate. The Red Team gives a
    same-mean two-point law with overflow probability 1/33, so the mean cannot
    certify capacity 32. No analytic eight-way peak bound or complete
    all-shard census exists. Archive, communication, and output exceed their
    unchanged hard caps by 3256009664, 3285369792, and 7132160 bytes. Honest
    disclosure preserves integrity but is not closure. No implementation or
    experiment ran, and nothing here supports or weakens H-SYC-b854f4 or
    ECDLP.

