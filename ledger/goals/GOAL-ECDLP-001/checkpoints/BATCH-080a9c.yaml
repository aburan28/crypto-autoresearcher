  independently_confirmed_repairs:
    - id: RT-68EA16-OBJ1-DERIV1-uncalibrated-against-HA2
      scope: mean_calibration_and_correspondence_only
      finding: >-
        H-SYC-b854f4's HA-2 formula is used at gamma_x=5/18 and 1/3, and
        per-root X is explicitly mapped to the retained per-eta accounting
        tuple. This repairs the predecessor's calibration omission but does
        not prove capacity adequacy.
    - id: VAL-68EA16-DERIV1-BITS27-LITERAL-ERROR
      scope: fully_closed
      finding: >-
        4088/134217728 renders as 0.0000304579734802 at the frozen precision;
        both reviewers independently confirm the corrected literal.
    - id: RT-68EA16-OBJ3-RTOBJ3-RTOBJ4-deferred-status-not-recorded
      scope: notation_omission_closed_underlying_findings_open
      finding: >-
        RT-OBJ3 and RT-OBJ4 are visibly recorded as open, non-blocking, and
        deferred. The notation defect closes; the underlying questions do not.
    - id: RT-68EA16-OBJ2-peak_live_bytes-shard-sensitivity-unaudited
      scope: overstatement_withdrawn
      finding: >-
        The successor no longer claims peak_live_bytes is invariant under
        shard widening and freezes an all-eight-shard future maximum rule.
        Validator treats that as closing the zero-run disclosure item; Red
        Team correctly preserves the unmeasured peak axis as open.

  blocking_residuals:
    - id: candidate_index_finite_tail_and_simultaneous_capacity
      finding: >-
        HA-2 constrains only E[X]. No finite-N tail or dependence model bounds
        the maximum over 98304 tuples. At gamma_x=1/3, X=33B with a shared
        Bernoulli B of probability 1/33 has the same mean as X=1 identically
        but overflows capacity 32 with probability 1/33. Deterministic bounds
        504, 1016, 2040, 4088, and 8184 all exceed 32.
    - id: eight_way_BSGS_peak_live_bytes
      finding: >-
        No shard-invariance proof, analytic process-wide bound, or complete
        setup-plus-eight-shard peak census exists. Disclosure prevents an
        overclaim but does not complete the comparison axis.
    - id: archive_communication_output_capacity_fit
      finding: >-
        Archive, communication, and output remain over unchanged caps by
        3256009664, 3285369792, and 7132160 bytes. No lossless scope
        reduction or separately authorized cap amendment exists.
    - id: HA2_decimal_serialization_rule
      severity: informational
      finding: >-
        The bits=21 displayed HA-2 expectation differs by one final decimal
        under nearest rounding. A successor must freeze truncation versus
        rounding or preserve the exact symbolic value.

  next_action: >-
    Park EXP-SYC-b11b38 at review_required and do not implement it. Before
    revisiting this lineage, require all three of: a finite-tail plus
    simultaneous-capacity certificate or fully propagated capacity widening;
    an analytic or complete all-eight-shard BSGS peak contract; and a lossless
    archive/communication/output fit or an explicit Coordinator-approved cap
    amendment. The immediate bounded campaign action is a fresh Coordinator
    frontier rerank from committed records, not another implicit repair or an
    Executor dispatch. Any successor must be a new approved batch with a
    frozen handoff and fresh independent review.

