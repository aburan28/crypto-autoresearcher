research_goal:
  id: GOAL-SQISIGN-002
  title: "SQIsign: audit the published-data surface of the Round-3 design against the SIDH/Kani attack template, and name the obstruction rather than assert it"
  objective: >-
    Check the structural claim that carries most of SQIsign's post-SIDH
    confidence — that it does not publish the auxiliary torsion-point
    information the SIDH break consumed. Build an exact inventory, from the
    Round-3 specification, of what a verifier actually receives per key and
    per signature; separate what the higher-dimensional design computes
    internally from what it publishes, since the redesign builds its response
    out of torsion images by construction; instantiate the Kani-based template
    against the published surface far enough to NAME the missing ingredient;
    and establish, with a null control that supplies the missing ingredient
    and must make the audit fire, whether the obstruction is structural or
    merely parametric. The expected and most valuable outcome is a negative
    one stated precisely enough to be used.
  question_ids: [RQ-SQISIGN-39f231]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-SQISIGN-001, GOAL-SSI-001, GOAL-P13-001]
  scheme_context:
    scheme: "SQIsign (NIST additional-signatures Round 3, post-redesign higher-dimensional variant)"
    family: "isogeny signature; the only isogeny-based Round-3 candidate"
    nist_round: 3
    standardization_status: >-
      Advanced to Round 3. Reported second-round status language states that
      SQIsign avoids the auxiliary torsion-point information exploited against
      SIKE and recommends that future effort prioritize study of its security
      properties. UNVERIFIED; see RQ-SQISIGN-39f231.provenance.
    why_this_lane: >-
      The claim is load-bearing, is currently a sentence rather than an audit,
      and concerns exactly the ingredient whose overlooked significance
      overturned confidence in SIDH. The audit is also cheap: a reading task
      plus a toy-scale instantiation, gated well before expensive compute.
  non_duplication:
    - >-
      GOAL-SSI-001 owns endomorphism-ring and isogeny-path hardness and the
      KN-TECH-057 matched baselines. This goal costs no hard problem and
      claims nothing about one.
    - >-
      GOAL-SQISIGN-001 owns signing-transcript distinguishability against a
      claimed simulation. This goal owns the PUBLISHED-DATA SURFACE and one
      named external attack template. The two touch only in that both read the
      same specification.
    - >-
      OBSERVATION RECORDED FOR THE COORDINATOR, NOT ACTED ON HERE:
      GOAL-SQISIGN-001 was written 2026-07-29 against the transcript-versus-
      simulation lane. The reported second-round redesign — from KLPT-based
      path-finding to higher-dimensional isogenies, described as letting the
      response isogeny be sampled from a more natural distribution and thereby
      clarifying zero-knowledge properties — may have moved the object that
      goal targets. That is an observation from an unverified excerpt, not a
      finding, and it is recorded under AGENTS.md rule 8 rather than used:
      GOAL-SQISIGN-001 is not edited by this goal, and only a Coordinator
      ledger archive may revise it after the Round-3 specification is
      actually read.
  completion_criteria:
    - >-
      An itemized inventory, sourced to the Round-3 specification, of every
      curve, torsion basis and point image a verifier receives per key and per
      signature, each marked as published or internally computed, and each
      marked as required by verification or merely present.
    - >-
      An instantiation of the Kani-based template against that inventory
      carried to a NAMED obstruction — the specific ingredient the template
      requires and the surface does not supply — with an argument, and with
      forward guidance stating what a variant would have to publish for the
      obstruction to fall. A screening count is not an acceptable substitute
      and is recorded as unverified.
    - >-
      A null-object control in which the identical audit is run against a
      deliberately weakened variant supplying the allegedly missing
      ingredient, and FIRES. Until it fires, no conclusion about
      inapplicability may be recorded.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions. The
      Red Team is directed at the inventory's completeness specifically, since
      an omission there invalidates everything downstream.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact template, published surface and parameters examined.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      No SQIsign Round-3 specification or reference implementation can be
      obtained under the network policy after the declared source-preference
      order is exhausted. This blocks the goal completely rather than
      partially: the inventory is the first deliverable and cannot be
      assembled from secondary sources.
    - >-
      The toy-scale instantiation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted. Under AGENTS.md rule 5 that
      is a budget outcome and never evidence that the template does not apply.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    THE FIRST BATCH IS A READING TASK AND SHOULD BE DISPATCHED AS ONE.
    Acquire the Round-3 SQIsign specification and the primary
    higher-dimensional-design papers, file them as KN-LIT entries with
    provenance levels and any extraction damage marked, and produce the
    published-data inventory. Everything else in this goal is downstream of
    that inventory, and no proposal that presupposes a data surface should be
    accepted before it exists — RQ-SQISIGN-39f231.constraints forbids design
    until the sources are filed, and this program has read NO Round-3
    specification. Two instructions bind the batch after it. First, BUILD THE
    NULL CONTROL BEFORE RUNNING THE AUDIT: a weakened variant that supplies
    the allegedly missing ingredient, against which the audit must fire. An
    audit that has only ever returned "does not apply" is untested
    instrumentation, and this is the exact failure docs/inventor-protocol.md
    names. Second, the deliverable is a NAMED OBSTRUCTION with forward
    guidance; "we tried N template variants and none worked" is a fatigue
    report whose honest status is unverified. Claim tier stays toy for all
    attack behaviour. Also note the scope observation recorded under
    non_duplication: the redesign may have moved GOAL-SQISIGN-001's object,
    and if the inventory confirms it, that is a Coordinator matter for that
    goal's own record and must not be resolved inside this one.
  owner: coordinator
