research_goal:
  id: GOAL-SYMF-c00fa1
  title: "Symmetric-cryptanalysis frontier: a notion-separated, primary-source ledger for hash functions and block ciphers"
  objective: >-
    Maintain a reproducible, date-stamped census of the strongest publicly
    reported attacks on deployed or standardized hash functions, cryptographic
    permutations, AES, and other deployed or standardized block ciphers.  Each
    row fixes the primitive variant, security notion, attacker model, round/step
    convention, result type, time, data, memory, preprocessing, success
    probability, and source provenance before any comparison is made.  The
    output is a Pareto frontier within identical comparison keys, not one scalar
    per primitive.  It exists so every future proposal can state a quantitative
    `sota_delta` against the right row and so apparent improvements caused by
    mixing full/reduced-round, collision/chosen-prefix, single/related-key, or
    trail/attack results are mechanically rejected.
