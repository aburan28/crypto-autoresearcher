research_goal:
  id: GOAL-SYMF-c00fa1
  title: "Symmetric-cryptanalysis frontier: a notion-separated, primary-source ledger for hash functions and block ciphers"
  objective: >-
    Maintain a reproducible, date-stamped census of the strongest publicly
    reported attacks on deployed or standardized hash functions, cryptographic
    permutations, AES, and other deployed or standardized block ciphers.  Each
    row fixes the primitive variant, security notion, attacker model, round/step
    convention, result type, time, data, memory, preprocessing, success
    probability, and source provenance before any comparison is made.  The
    output is a Pareto frontier within identical comparison keys, not one scalar
    per primitive.  It exists so every future proposal can state a quantitative
    `sota_delta` against the right row and so apparent improvements caused by
    mixing full/reduced-round, collision/chosen-prefix, single/related-key, or
    trail/attack results are mechanically rejected.
  question_ids: [RQ-SYMF-5ab172]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 8
    total_wall_clock_seconds: 21600
    max_concurrent: 3
  campaign_budget_note: >-
    These are ceilings for a new user-requested campaign, not spending targets.
    Batch 1 is literature acquisition and structured transcription only: three
    producer tasks at 900 seconds each, one snapshot, two independent reviews,
    and one ledger archive.  It runs no cryptanalytic search.  Any raise is a
    separate user-authorized decision.
  current_batch_id: BATCH-303ce8
  dispatch_queue_path: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/dispatch_queue.json
  latest_verified_commit: null
  related_goals:
    - GOAL-DIFFP-84d641
    - GOAL-MD5-001
    - GOAL-SHA1-001
    - GOAL-SHA2-001
    - GOAL-SHA3-001
    - GOAL-BLAKE-001
    - GOAL-ASCON-001
    - GOAL-SIMSPK-001
    - GOAL-AES-001
    - GOAL-AES-002
    - GOAL-AES-003
  non_duplication:
    - >-
      This goal owns published-frontier acquisition, normalization, dominance,
      and update cadence.  It does not search for new characteristics, trails,
      distinguishers, collisions, or keys.  GOAL-DIFFP-84d641 retains exclusive
      ownership of new MD5/SHA-1 differential-path search and novelty
      adjudication.
    - >-
      Primitive-specific goals retain experiments, reproductions, detector
      audits, cost-model work, and official conclusions about their tested
      mechanisms.  This ledger supplies their external baseline; it cannot
      promote or reject their hypotheses.
    - >-
      GOAL-MD5-001's quarantine is a content firewall, not a path firewall.
      This campaign may cite its committed frontier ledger and bibliographic
      metadata but may not fetch, read, transcribe, or reconstruct quarantined
      MD5 collision-path data by any route.
  completion_criteria:
    - >-
      The committed coverage manifest has a terminal coverage state for every
      tier-1 primitive/variant and attack-notion cell: primary_source_complete,
      primary_source_partial with named gaps, no_result_located with the exact
      search boundary, not_applicable with a reason, or routed_to_another_goal.
      A blank cell is not a conclusion.
    - >-
      Every frontier row validates against the frozen schema and carries an
      exact comparison key, all cost axes (explicit null when unstated), a
      success probability, round convention, full/reduced scope, result kind,
      and citation provenance.  No `recalled` row may be marked verified or
      placed on the authoritative frontier.
    - >-
      Every `is_frontier: true` row is nondominated only within an identical
      comparison key; dominance is checked across time, data, memory,
      preprocessing, queries, and success probability.  Incomparable rows stay
      separate.  In particular SHA-1 collision, chosen-prefix collision, and
      practical demonstration rows are never collapsed into a global "2^N".
    - >-
      Independent Validator and Red Team sessions admit the schema, provenance,
      transcription, comparison keys, and dominance decisions, including the
      proves-too-much controls in the precommitted review plan.
    - >-
      A Coordinator ledger archive commits the canonical frontier, source
      index, evidence, decision, review reports, and updated goal checkpoint.
      The next action ranks improvement targets by round margin and quantitative
      cost delta without claiming that a literature row has been reproduced.
  pause_conditions:
    - The eight-batch or 21600-second campaign ceiling is reached without user authorization to continue.
    - >-
      Primary sources for a required cell remain unavailable after the recorded
      source-preference order is exhausted; the cell becomes
      primary_source_partial rather than being filled from memory.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Complete syntax-normalization successor TASK-20260825-30a080 approved by
    DEC-20260825-9dfc9f, pass the Coordinator parse gate over the normalized
    modern shard and correction addendum, then run snapshot TASK-20260825-568663
    alone before either independent reviewer reads producer artifacts.
  owner: coordinator
  created_at: '2026-08-25'
  updated_at: '2026-08-25'
