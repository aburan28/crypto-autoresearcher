research_goal:
  id: GOAL-GFPN-380702
  title: >-
    EcGFp5 / EcMasFp5 (Goldilocks quintic) security and index-calculus boundary
  objective: >-
    Answer RQ-GFPN-4ab8c7 by executing the seven user-token proposals in
    priority order: measure n = 5 PDP/symmetrization bands on a toy-p ladder
    against the design notes' ≥2^142 Gaudry claim; cost oracle-assisted static
    DH after freezing JV/Granger; compute odd-char GHS cover genus at n = 5;
    run a SafeCurves-style certificate audit against EcMasFp5's 101.93-bit twist
    self-report; file arithmetic closures for the JV (n−1) variant and the
    translation-descent lemma; and score Trimoska's combined WDSat future work
    as constant-factor-only unless measurement says otherwise. Deliberately do
    not reopen coset bases, torsion quotients, Sarkar-Singh, linear-invariance
    pruning, GRUMPY/FROB/QSP, or the finite-field-DLP analogy under this goal.
  question_ids:
