research_goal:
  id: GOAL-GFPN-380702
  title: >-
    EcGFp5 / EcMasFp5 (Goldilocks F_{p^5}): symmetrization-aware Gaudry,
    OA-SDH, and odd-char cover costs
  objective: >-
    Answer RQ-GFPN-c01af8 per research/gfp5_deployed_curves_20260920.md:
    measure symmetrization-aware Gaudry/PDP cost on EcGFp5 and EcMasFp5
    (IDEA-20260920-a639a1); cost oracle-assisted static DH
    (IDEA-20260920-73dc35); audit odd-char GHS covers at n = 5
    (IDEA-20260920-10547b); run a SafeCurves-style certificate pack
    (IDEA-20260920-63a902); file arithmetic/theory closures
    (IDEA-20260920-9e672a, IDEA-20260920-0490f5 / THM_QUOTIENT_DESCENT1);
    and score Trimoska's WDSat+torsion+coset combo as constant-factor-only
    unless measurement falsifies that prior (IDEA-20260920-18dc28). Do not
    reopen coset bases, torsion quotients, Sarkar–Singh, linear-invariance
    pruning, GRUMPY/FROB/QSP, or the finite-field-DLP analogy under this goal.
  question_ids:
    - RQ-GFPN-c01af8
  active_hypothesis_ids:
    - H-GFPN-ee4d45
    - H-GFPN-9a29be
    - H-GFPN-3366ea
  status: active
  owner: coordinator
  created_at: '2026-09-20'
  updated_at: '2026-09-21'
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 2
    max_concurrent_basis: >-
      MACHINE HEADROOM, NOT A RESEARCH BUDGET. Two concurrent design/theory
      tasks; solver-running PDP cells require the machine otherwise quiet.
  budget_note: >-
    maximum_batches and total_wall_clock_seconds are null because GFPN is a
    declared ECC area (orchestration/research-priority.yaml, added 2026-09-20;
    verified with `python3 tools/ecc_priority.py --classify GOAL-GFPN-380702`).
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  completion_criteria:
    - id: C1
      statement: >-
        Measured D and per-PDP cost per symmetrization arm on a toy-p ladder at
        n = 5, with p-independence of D established or falsified, and a concrete
        cost band at p = 2^64 reported next to the design note's ≥2^142 figure
        (IDEA-20260920-a639a1), citing run/evidence IDs.
      status: OPEN
    - id: C2
      statement: >-
        OA-SDH query and work costs for both curves after JV/Granger sources are
        frozen, or a recorded impediment naming the missing freeze
        (IDEA-20260920-73dc35).
      status: OPEN
    - id: C3
      statement: >-
        Odd-char GHS cover genus (or Diem bound) for both curves and an
        isogeny-class control after Diem/Gorla–Massierer freeze
        (IDEA-20260920-10547b).
      status: OPEN
    - id: C4
      statement: >-
        SafeCurves-style certificate pack recomputing EcMasFp5's 101.93-bit
        twist self-report (IDEA-20260920-63a902).
      status: OPEN
    - id: C5
      statement: >-
        Arithmetic/theory closures filed for JV (n−1) and THM_QUOTIENT_DESCENT1
        so those lanes draw no further experimental budget without a new
        decision (IDEA-20260920-9e672a, IDEA-20260920-0490f5).
      status: OPEN
  pause_conditions:
    - >-
      A required source freeze (Diem, Gaudry, JV/Granger, FGHR/FHJRV) cannot be
      obtained; record an impediment with clears_when = successful freeze.
    - >-
      review-breakthrough is required for a claim and is unservable; the claim
      stays un-promoted and the goal stays active.
  next_action: >-
    Executor: invoke /run EXP-GFPN-726eb2 (SafeCurves-style audit; card
    TASK-20260920-d78326). Sequenced behind it, in this order and not as
    separate next actions: /run EXP-GFPN-05ff43 (PDP ladder;
    TASK-20260920-dd8205), then dispatch TASK-20260921-838c4a and
    /run EXP-GFPN-659e34 (oracle-assisted SDHP; approved by
    DEC-20260921-b5c2da) once experiments/EXP-GFPN-05ff43/implementation.md
    is committed. Ranking of every open idea: DEC-20260921-683a85
    (design_next IDEA-20260920-10547b after its Diem/GHS freeze; rho lane
    held behind IDEA-20260920-68b279 until EXP-GFPN-05ff43 records a band).
    Keep deliberately-not-opened avenues closed under this goal.
  impediments:
    - id: IMP-1
      raised: '2026-09-21'
      condition: >-
        C2 is worded "after JV/Granger sources are frozen, or a recorded
        impediment naming the missing freeze". Joux-Vitse 2010/157 is frozen
        (KN-LIT-673219) and carries the OA-SDH algorithm, query count and
        130-bit estimate; Granger 2010 (oracle-assisted static DH over
        extension fields) is NOT frozen and is cited nowhere as support.
      what_is_blocked: >-
        Only the "Granger frozen" reading of C2's first clause. Nothing
        else: EXP-GFPN-659e34 is designed and approved against the frozen JV
        text alone (DEC-20260921-b5c2da), and C2 may close under its own
        second clause by naming this missing freeze.
      clears_when: >-
        A zero-run freeze card for Granger 2010 is archived with a KN-LIT
        entry and frozen text (scheduled in DEC-20260921-683a85
        next_actions), or the evidence-review decision of EXP-GFPN-659e34
        closes C2 naming this impediment.
      recheck: >-
        At the coordination act that follows the EXP-GFPN-659e34 result, or
        at the next coordination act that mints the freeze card, whichever
        is first.
  scope_exclusions:
    - Coset-base experiments (owned by IDEA-20260918-c05e71 / SEMBIN).
    - Torsion-quotient PDP benchmarks (owned by IDEA-20260918-7a11c2).
    - Sarkar-Singh relation generators (owned by IDEA-20260918-5a9a51).
    - Linear-invariance pruning (THM_FALLDEG_INVARIANTS1 §3.1).
    - GRUMPY, FROB, QSP campaigns and the finite-field-DLP analogy.
    - Trace-zero variety (Gorla–Massierer): N/A — neither named curve is subfield.
