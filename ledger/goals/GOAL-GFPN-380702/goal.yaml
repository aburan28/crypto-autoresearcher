research_goal:
  id: GOAL-GFPN-380702
  title: >-
    EcGFp5 / EcMasFp5 (Goldilocks F_{p^5}): symmetrization-aware Gaudry,
    OA-SDH, and odd-char cover costs
  objective: >-
    Answer RQ-GFPN-c01af8 per research/gfp5_deployed_curves_20260920.md:
    measure symmetrization-aware Gaudry/PDP cost on EcGFp5 and EcMasFp5
    (IDEA-20260920-a639a1); cost oracle-assisted static DH
    (IDEA-20260920-73dc35); audit odd-char GHS covers at n = 5
    (IDEA-20260920-10547b); run a SafeCurves-style certificate pack
    (IDEA-20260920-63a902); file arithmetic/theory closures
    (IDEA-20260920-9e672a, IDEA-20260920-0490f5 / THM_QUOTIENT_DESCENT1);
    and score Trimoska's WDSat+torsion+coset combo as constant-factor-only
    unless measurement falsifies that prior (IDEA-20260920-18dc28). Do not
    reopen coset bases, torsion quotients, Sarkar–Singh, linear-invariance
    pruning, GRUMPY/FROB/QSP, or the finite-field-DLP analogy under this goal.
  question_ids:
    - RQ-GFPN-c01af8
