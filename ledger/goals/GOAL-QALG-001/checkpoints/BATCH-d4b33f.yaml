      precision_note_1_audit_performed_collision_found_phrasing:
        finding: >-
          The phrase "AUDIT PERFORMED, COLLISION FOUND" in three HQC records
          (IDEA-20260813-a46301, IDEA-20260813-5a2aaa, IDEA-20260813-c34e09)
          is loosely worded against KN-TECH-080's own definition of an
          observation-collision audit (a search for two distinct ground-truth
          objects sharing one observable). The Validator's own close read
          found each of the three is actually closer to a quantifier-order
          failure (no single global witness/shift/oracle satisfies the
          claim's existential clause) than a literal observable collision,
          and that each record's own quantifier_order field already restates
          the correct finding.
        disposition: >-
          Not a claim-ceiling violation: no EXP-*/RUN-*/EV-* id is invoked in
          any of the three passages, no execution is claimed, and the
          underlying pen-and-paper arguments were independently sanity-checked
          by the Validator for internal coherence. This is a terminology-
          precision note for future batches (prefer "symbolic argument
          completed, construction fails" over "AUDIT PERFORMED... FOUND",
          which a skimming reader could mistake for an executed-run result),
          not a defect requiring the batch to be sent back.
