    q2_next_stage_candidates:
      selection_rationale: >-
        Recommendation only. Promoting any of these from IDEA-* to an approved
        H-* hypothesis with a frozen protocol is a SEPARATE, later,
        Coordinator-approved /design-experiment step and is explicitly NOT
        performed by this checkpoint. Selection criterion: this program's bias
        toward exponent-targeting mechanisms over logarithmic-/constant-cofactor
        improvements (docs/target-result-profile.md; CLAUDE.md "Research
        direction"), applied to what each proposal's OWN method_ceiling audit
        already admits it could certify at best, plus cost/decisiveness (an
        inventor-protocol preference for the cheapest available falsifier).
        Of the fifteen, twelve are self-classified, on their own method_ceiling
        audits, as cofactor-class, closure-shaped, or pure baseline/access-model
        controls with sota_delta: zero by their own accounting -- correctly
        screened negative or non-exponent-moving results, not candidates for
        promotion. The three recommended below are the only proposals in this
        batch whose own best-case ceiling is a genuine exponent-class change,
        or that gate whether such a change is even reachable.
      candidates:
        - id: IDEA-20260813-02479f
          lane: RQ-QALG-457b41 (ML-KEM)
          rationale: >-
            The cheapest, most decisive gate on the entire ML-KEM DCP-route
            family: a pure closed-form arithmetic check (no ML-KEM
            implementation, no lattice software, no quantum simulation)
            of whether ML-KEM's actual k in {2,3,4} real public-key rows can
            ever materialize anywhere near Simon 2026's required
            Q = k*n^(c+1), c>=12 samples within its own noise budget, via
            standard linear self-reduction. Its own falsification_conditions
            already state this is "the cheapest possible way to learn whether
            the entire DCP-route family is already dead-on-arrival against
            ML-KEM's actual, non-asymptotic parameters, before spending
            further effort on Lemma 3's correctness" -- exactly the
            inventor-protocol's cheap-falsifier-first discipline, run before
            the more expensive Lemma-3 audit below.
        - id: IDEA-20260813-4aecda
          lane: RQ-QALG-457b41 (ML-KEM)
          rationale: >-
            The load-bearing correctness gate for the entire DCP-route family
            against ML-KEM: a small-n classical audit (n up to roughly 20-22)
            of Simon 2026's Lemma 3 (no catastrophic phase-sum cancellation),
            with a random-sign-shuffle null-object control and an explicit
            shrinking-vs-non-shrinking trend check across n, per
            docs/inventor-protocol.md section 3. Recommended alongside
            IDEA-20260813-02479f rather than instead of it: if 02479f's
            access-model check comes back unfavorable, this audit becomes
            moot for ML-KEM specifically, so the two should be sequenced
            (02479f first) or run in parallel with that dependency disclosed.
        - id: IDEA-20260813-e6d55d
          lane: RQ-QALG-74bf20 (CSIDH)
          rationale: >-
            The single strongest exponent-moving candidate in this entire
            15-proposal batch: whether Simon 2026's construction, specialized
            to the zero-noise limit a(n) -> infinity that CSIDH's exact
            (error-free) Kuperberg-regime hidden-shift instances present, is
            (i) a legitimate specialization of the paper's own stated theorem
            and (ii) yields a concrete poly(n) = O(n^13) cost smaller than
            Kuperberg's 2^{O(sqrt(log N))} sieve at CSIDH-standardized class-
            group orders. Its own method_ceiling states this could certify
            "a genuine exponent-moving replacement for Kuperberg's sieve...
            a change in functional form, not a constant-factor gain" if every
            step specializes cleanly -- explicitly the target-result-profile's
            own exponent-first ambition, not a building-block or cofactor
            result. recommended_priority: high in the record itself, and the
            only CSIDH proposal in this batch not self-capped to a
            constant/polylog gain.
      shared_dependency_disclosure: >-
        IDEA-20260813-4aecda (ML-KEM) and IDEA-20260813-e6d55d (CSIDH) both
        depend on the SAME external, unverified claim -- Simon 2026's Lemma 3
        (KN-LIT-e204ab) -- audited from two different applications. Per
        GOAL-QALG-001's own non_duplication clause, a RESULT from either
        proposal does not transfer to the other lane; but the underlying
        external mathematical question (does Lemma 3 hold) is the same
        question in both records, and a future design-stage batch should
        disclose this shared dependency explicitly (e.g. running the small-n
        Lemma-3 arithmetic skeleton once and reusing it for both audits'
        finite-n vs a(n)->infinity comparisons) rather than treating the two
        as independent unknowns, while still keeping each lane's CONCLUSION
        separately scoped and separately reviewed as the goal record requires.
      hqc_lane_note: >-
        No HQC proposal is recommended for promotion. Two (IDEA-20260813-
        5a2aaa, IDEA-20260813-c34e09) are already self-described,
        closure-shaped negative results with a named obstruction and forward
        guidance, exactly matching docs/inventor-protocol.md section 4's
        closure standard -- a future batch could consider formally recording
        these as scoped closures rather than re-running them. The remaining
        three (IDEA-20260813-a46301, IDEA-20260813-319645,
        IDEA-20260813-fe3c5e) are all explicitly self-capped by their own
        method_ceiling audits to constant/polylog-cofactor gains at best, or
        (fe3c5e) are a baseline-clarification control blocked on the same
        WebSearch/WebFetch infrastructure failure noted below. None targets
