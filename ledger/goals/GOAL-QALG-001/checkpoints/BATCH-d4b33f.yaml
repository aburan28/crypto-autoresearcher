        batch wants to keep the HQC lane moving, IDEA-20260813-fe3c5e (pin
        down which of Grover-Prange or Kachigar-Tillich is HQC's actual
        tighter quantum baseline) is the cheapest prerequisite for evaluating
        any future HQC candidate against the TRUE baseline, but it is a
        scoping task, not itself an exponent-moving candidate.

