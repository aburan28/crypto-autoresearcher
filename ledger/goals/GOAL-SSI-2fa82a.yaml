    context_limit: >-
      These records are corpus pointers for the novelty and scope screen. Their
      presence does not establish a reduction, validate a construction, or
      support a security claim for this goal. Primary texts must be read before
      their claims are relied upon.
  non_duplication:
    - >-
      GOAL-KEX-001 owns constructive KEY EXCHANGE: two parties interact or
      publish contributions to agree on a shared value. This goal owns
      non-interactive public-key ENCRYPTION syntax in which a sender encrypts
      under a recipient public key and only the recipient decrypts. It does not
      design a KEX, NIKE, AKE, or generic KEM combiner.
    - >-
      GOAL-SSI-001 and GOAL-SSIQ-001 own cryptanalysis and exponent-moving work
      on supersingular isogeny, OneEnd, and EndRing. This goal may import their
      reviewed baselines but does not claim an attack, alter a hardness
      conclusion, or use a construction record to weaken those problems.
    - >-
      GOAL-ENDO-001 concerns prime-field ECDLP subproblems and attack-cost
      variation across ordinary isogeny classes. This goal concerns a
      supersingular F_{p^2} encryption construction and must not transfer that
      campaign's observations or draft contracts as evidence.
    - >-
      GOAL-CSIDH-001 owns disputed quantum-cost reconstruction for a
      commutative group action. This goal may compare against CSIDH-derived PKE
      only in its prior-art map; it does not adjudicate CSIDH security or reuse
      its cost figures as evidence.
    - >-
      GOAL-SQISIGN-001 and GOAL-SQISIGN-002 own signatures. Knowledge of a
      supersingular endomorphism ring is also used as a signing trapdoor, but a
      signature transcript is not an encryption primitive and no signature
      construction or forgery question is in scope here.
    - >-
      Existing corpus pointers describe Seta, SiGamal/C-SiGamal, LIT-SiGamal,
      and key-updatable supersingular PKE. A candidate that is the same scheme,
      a parameter change, or an unacknowledged transform of one of them fails
      the novelty gate and is not filed as a new mechanism.
  scope_discipline:
    - >-
      PKE ONLY. Every candidate exposes KeyGen, Encrypt, and Decrypt with
      explicit key, message, randomness, and ciphertext spaces. Shared-secret
      agreement, signatures, authentication, live protocol integration, and
      cryptanalysis of deployed systems are outside this goal.
    - >-
      NO SECURITY OR DEPLOYMENT CLAIM AT OPENING. The words secure,
      post-quantum secure, practical, production-ready, and deployable may not
      describe an artifact from this goal unless a later claim-tier-correct
      decision independently supports the exact statement. No task may target
      third-party keys, ciphertexts, networks, wallets, or deployed services.
    - >-
      The endomorphism-ring dependency must be explicit. Naming EndRing in a
      motivation section is insufficient: the candidate must identify the
      secret witness, the public distribution, the inversion problem, every
      auxiliary datum, and either a reduction to a precisely stated EndRing
      problem or a separately named intermediate assumption whose gap is
      visible.
    - >-
      Toy correctness is not security. A reference implementation or finite
      test can establish only algorithmic agreement on its declared cells. A
      failed attack is not evidence of security, and an infrastructure failure
      is not evidence about the construction or the EndRing problem.
  completion_criteria:
    - >-
      C1 PRIOR-ART AND PROBLEM BOUNDARY. A committed design record reads the
      primary texts behind KN-LIT-6572, KN-LIT-6628, KN-LIT-827, and
      KN-LIT-1260 (or records exact retrieval impediments), compares their
      syntax and assumptions against the proposed lane, and states the precise
      EndRing variant being used, including field, input distribution,
      auxiliary information, and any GRH or other conditional dependency.
    - >-
      C2 COMPLETE PKE SYNTAX. A candidate specification gives deterministic or
      probabilistic algorithms KeyGen, Encrypt, and Decrypt; exact domains and
      encodings; randomness and failure behavior; and a trace from each public
      and secret value to a defined mathematical object. All algorithms are
      executable at declared toy parameters and no undeclared oracle or hidden
      setup is required.
    - >-
      C3 CHECKED CORRECTNESS. A single-responsibility derivation states the
      algebraic invariant that makes Decrypt(KeyGen, Encrypt(m)) return m,
      states its quantifiers and failure probability, and is checked by an
      independently validated toy reference implementation over a frozen test
      boundary with positive, negative, malformed-ciphertext, and wrong-key
      controls. Every mismatch is retained and scoped.
    - >-
      C4 AUDITABLE HARDNESS DEPENDENCY. The candidate defines its first security
      target and game, identifies the exact inversion or distinguishing step,
      and supplies either a reviewed reduction to the stated supersingular
      EndRing problem or a reviewed reduction chain whose intermediate
      assumption and unresolved gap are named. This criterion authorizes no
      claim that the assumption is true or that parameters are secure.
    - >-
      C5 NON-DUPLICATION AND HONEST COSTING. Independent review confirms that
      the candidate is not merely an existing supersingular PKE under new
      notation, and a toy cost table charges key generation, encryption,
      decryption, public-key and ciphertext size, failure handling, auxiliary
      data, and any preprocessing. Comparisons state matched assumptions and
      never imply deployability.
    - >-
      C6 DURABLE INDEPENDENT REVIEW. Validator and Red Team sessions independent
      of the producer review correctness, reduction interfaces, auxiliary-data
      leakage, proves-too-much controls, and claim language. The Coordinator
      archives the exact artifacts and a scoped decision. No completion
      criterion is met by survival of attempted attacks alone.
  pause_conditions:
    - >-
      SOURCE-BOUNDARY IMPEDIMENT. If primary specifications for the nearest
      supersingular PKE constructions cannot be obtained, record what novelty
      comparison is blocked, the acquisition routes tried, and a concrete
      recheck. The goal remains draft or active; no novelty claim proceeds.
    - >-
      DEFINITION IMPEDIMENT. If no candidate can state a public encryption
      algorithm without using the recipient's secret endomorphism-ring witness,
      record the exact ill-typed or circular interface and what definition
      would clear it. This blocks that candidate, not the goal, and asserts
      nothing about EndRing hardness.
    - >-
      REDUCTION IMPEDIMENT. If the construction requires auxiliary torsion,
      orientation, setup, or an intermediate assumption not implied by the
      stated EndRing problem, block any EndRing-based security wording until a
      reviewed reduction or explicit assumption separation clears it. Keep the
      goal active and the candidate unpromoted.
    - >-
      REVIEW IMPEDIMENT. If the required independent policy tier cannot be
      served, record the exact review and claim that are blocked plus the probe
      that will recheck serviceability. Do not downgrade the review, and do not
      change the goal to paused or blocked.
    - >-
      OVERLAP IMPEDIMENT. If the proposed mechanism is the same as an existing
      PKE, KEX, KEM, or signature construction after notation is normalized,
      stop that mechanism, cite the matched construction, and rerank a distinct
      lane. Duplication does not become novelty through implementation.
  next_action: >-
    NEXT-EIGENX-V3-J4-ROBUSTNESS: Freeze one bounded transform amendment that
    requires either perfect pointwise witness-independent DX correctness for
    every valid setup, accepted R_CER witness, message and Enc coin string, or
    a formal adversarial-valid-ciphertext robustness game with its q_D-scaled
    loss; include the exact byte-level strong-sUSS game, total parser/CRS
    behavior, and a line-by-line hybrid coupling real two-component Dec to the
    known-one-witness simulator, then obtain a new sole-owner J4 verdict.
