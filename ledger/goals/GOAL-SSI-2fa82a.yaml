# GOAL-SSI-2fa82a -- opened as a draft by DEC-20261004-23eb8d on direct
# user instruction. Activated after the bounded BATCH-f72362 definition search
# and independent review by DEC-20261005-dbb0d2. H-SSI-072490, H-SSI-1ed6df,
# and H-SSI-4a0c67 specify toy interface audits; the later C-star and transporter
# rounds leave no finalist. The later evaluator reconstruction round required a
# protocol correction and also leaves no finalist. Its single admission/decoder
# repair was reviewed in BATCH-9681e3: J1--J3 hold while J4--J5 break, so the
# submitted packet has no finalist. The later correction and trapdoor-interface
# records are preserved additively. BATCH-fc23a6 evaluates two public-binding
# interfaces, finds no survivor, and narrows the next action to bare-E public
# noncentral sampling feasibility. BATCH-12e6aa then evaluates four public
# noncentral-endomorphism sampler families, finds no survivor, and isolates the
# adaptive every-query OneEnd coverage gap. BATCH-44a1ce then evaluates three
# adaptive bridge interfaces and the EigenX/CEST reduction boundary: no bridge
# survives, O3 alone is discharged, and the frozen syntax has an exact scoped
# IND-CCA2 break. BATCH-be2a37 then tests one prescribed-path/torsion mechanism:
# J1--J5 all break, O4/O5 are contradicted for that exact interface, and the
# other four obligations remain open. No scientific run has been opened, and
# no mechanism or security claim is approved. BATCH-d92210 then evaluates two
# renewed Category-5 recipient mechanisms, finds zero survivors, leaves the
# documentation gate incomplete, and records a stop boundary. BATCH-5313dc
# then evaluates the
# materially different EigenX-v3 ring-witness mechanism: J1/J2/J3/J5 are
# inconclusive, J4 breaks the proposed CCA oracle simulation, O5 is
# contradicted, and O1/O2/O3/O4/O6 remain open. It is an incomplete candidate
# with a scoped transform obstruction, not a secure construction.
research_goal:
  id: GOAL-SSI-2fa82a
  title: >-
    Public-key encryption from the supersingular endomorphism-ring problem:
    specify a correct candidate and make its exact hardness dependency auditable
  objective: >-
    Build a research-grade public-key encryption candidate with explicit
    KeyGen, Encrypt, and Decrypt algorithms whose declared trapdoor or one-way
    mechanism is tied to computing the endomorphism ring of a supersingular
    elliptic curve over F_{p^2}. The campaign begins with no proposed mechanism
    and makes no security claim. It must first distinguish the intended object
    from existing supersingular PKE constructions and from the known
    endomorphism-ring/isogeny-path equivalence, then state exactly what secret
    witness decryption uses, what public data encryption uses, and what
    reduction or intermediate assumption would connect inversion to EndRing.
    The deliverable is a reproducible research candidate with checked
    correctness and an independently reviewed assumption map. It is not a
    deployment recommendation, a standardized scheme, or evidence that the
    candidate is secure at any parameter size.
  question_ids: [RQ-SSI-1946c9]
