      has executed under the approved v2 -- TASK-20260907-2db9aa's Stage A'
      re-seal, EV-ECDLP-6783b8 -- used the a = 1/4 cell as its proves-too-much
      method control and its result is recorded as matching EV-ECDLP-60e266, so
      there is NO EVIDENCE that control (b)'s misstatement affected it. THE RISK
      IS PROSPECTIVE: any future run under v2, and any contract that inherits
      control (b)'s text.
    remedy: >-
      A SUPERSEDING RECORD against the approved specification.v2.yaml, correcting
      control (b) to match metrics.primary and EV-ECDLP-60e266's own two-scale
      seed split. NEVER AN EDIT to the approved file.
    owner_named_by_the_gate: 'BATCH-8f3e86, "the lane that owns it".'
    owner_as_reassigned_by_this_close: >-
      BATCH-8f3e86 HAS CLOSED, so that assignment no longer resolves. Reassigned
