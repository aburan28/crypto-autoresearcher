      clean approval, and the gate returned `revise`. BOTH THE AUTHOR AND THE
      GATE RECORD THAT THIS DISCRIMINATES BETWEEN ALMOST NOTHING, for the reason
      the prior itself gives: predicting clean approval of one's own work is the
      least credible prior available, so `revise` is the modal prediction any
      competent author makes about any large document. It is not cited as
      corroboration anywhere in this lane's closing records.
    the_four_named_break_points_all_passed:
      summary: >-
        THE AUTHOR NAMED FOUR PLACES IT EXPECTED THE CONTRACT TO BREAK FIRST.
        THE GATE PASSED ALL FOUR. Not one of the seven blocking findings is at a
        location the prior named.
      items:
        - 'EXP-BREAK-1, control (g)''s authority argument for the wider seed set -- the author expected a strict gate could reasonably refuse it. PASSED: the gate verified the authority gap independently and accepted control (e)''s own stated rationale as the warrant, holding that refusing it would require holding that a control''s stated purpose cannot license a change serving that purpose better.'
        - 'EXP-BREAK-2, the cap formula''s fidelity in some subtle detail, with pool-construction crediting or the saturation constant named as likeliest. PASSED, and it took the LEAST argument of any joint; both specific details the author worried about were found as stated.'
        - 'EXP-BREAK-3, the packet''s leak-freedom or completeness -- "both are my own assertions about my own text". PASSED on all three properties with zero hash mismatches, and the gate independently reached the author''s own conclusion about the one disclosed inclusion.'
        - 'EXP-BREAK-4, the second scale as added surface for no required purpose. PASSED: the gate took the smaller change seriously and declined it, because N-dependence of the feasibility boundary is a live possibility a single-scale batch cannot see.'
    the_miss_prediction_and_its_reversal:
      what_the_prior_predicted: >-
        Recorded by the author as the most useful thing a prior can contain:
        that the gate would focus on the cap formula because it is legible and
        checkable, and would UNDER-ATTACK the control falsifiability table --
        whether each item really has a reachable failing world, which requires
        arguing about each item rather than reading code -- and the question of
        whether the derivation packet is sufficient. "If the gate confirms the
        cap formula and stops, the review has checked the easy joint."
      what_happened: >-
        OVERTURNED. The control falsifiability table is not merely where the
        gate looked hardest; it is where FOUR of the seven blocking findings
        came from -- CF-1, CF-4, CF-5 and LO-1 all come out of working through
        the fifteen items one at a time and constructing or refusing a failing
        world for each, which is exactly the expensive work the prior predicted
        would be skipped. The cap formula was checked and was clean.
      the_one_point_where_the_prior_was_right: >-
        Sufficiency of the derivation packet cannot be settled by reading, and
        the gate agrees EXPLICITLY rather than by accident: its J4 records that
        sufficiency is its own judgement from reading deliverables.md against
        the allowlist, and that a packet is proven sufficient only when a
        re-deriver completes without reaching outside it. That limitation was
        written before the prior was opened and stands unchanged.
    net_effect_on_the_verdict: >-
      Zero blocking findings added, zero withdrawn, zero severities changed
      after the read. The gate records that the prior constrained nothing
      because there was nothing to correct, and reports that as an outcome
      rather than as a virtue.
    where_the_risk_actually_lies:
      the_inference: >-
        THE RISK IN THIS CONTRACT IS NOT WHERE ITS AUTHOR EXPECTED IT, AND THE
        DIFFERENCE IS SYSTEMATIC RATHER THAN INCIDENTAL. Every location the
        author named is a place where the contract makes an EXTERNAL claim -- a
        formula matches code, a packet is complete, a seed count has authority,
        a second scale earns its cost. Each is checkable against something
        outside the document, which is why an author can audit it, and all four
        survived. Every one of the gate's seven blocking findings is instead an
        INTERNAL claim: that the two normative documents agree with each other
        about how many controls the contract has and which letters name them;
        that a summary partitions its own item set; that a required-artifact
        quantifier ranges only over items whose declared kind admits the field
        it demands; that a condition number resolves to one condition. Those are
        exactly the claims a one-pass author cannot audit, because auditing them
        requires holding two distant blocks of a two-thousand-line document in
        view at once, and no amount of care while writing either block reveals a
        disagreement between them.
      it_is_falsifiable: >-
        If the successor revision is refused again, this predicts the findings
        will AGAIN be internal cross-reference or calibration defects rather
        than external ones. The prediction is WRONG if the next gate breaks the
        contract on a formula, a packet or a scope.
      what_it_does_not_claim: >-
        It is one comparison of one prior against one gate on one document, it
        is UNREVIEWED, it asserts nothing about the ECDLP, and it implies no
        carelessness: five of the ten defects the gate lists are single-token
        cross-references and one was self-reported by the author before the gate
        ran.

