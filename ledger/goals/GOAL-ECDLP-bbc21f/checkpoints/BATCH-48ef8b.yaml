  two_gates_two_refusals:
    id: TG-1
    full_statement: 'ledger/decisions/DEC-20260907-de6b71.yaml `two_gates_two_refusals`.'
    the_pattern: >-
      TWO INDEPENDENT COORDINATOR GATES HAVE NOW REFUSED TWO SUCCESSIVE
      AMENDMENTS OF ONE EXPERIMENT BEFORE ANY COMPUTE WAS SPENT, each in a fresh
      session that authored none of what it gated, and IN BOTH ROUNDS THE
      MATHEMATICS PASSED WHILE THE CONTRACT TEXT FAILED. Round 1:
      DEC-20260907-4e34c5 on PA-ECDLP-6ac801-v1-to-v2 (BATCH-e9fd22, gate
      TASK-20260907-f65c6e) -- three blocking, four non-blocking. Round 2:
