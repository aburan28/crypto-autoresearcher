      TASK-20260907-9c0626) -- seven blocking, three non-blocking, none of them
      a Round 1 item. In both rounds the authoring session did not see the
      defects the gate found; in Round 2 the author self-reported one and
      declined to fix it on a ground the gate then ruled does not hold.
    the_concrete_cost:
      - 'TWO FULL AUTHORING CYCLES AND TWO GATE SESSIONS, ZERO RUNS. The wide measurement the lineage exists to run is still unapproved and unexecuted, with a third authorship and a third gate now between it and execution.'
      - 'THE OPPORTUNITY COST HAS BEEN PAID TWICE and is nameable: the online RESEL-L arm (the goal''s largest genuine gap, zero arms ever run) and completion criterion C2 (the goal''s only OPEN criterion) have each waited behind an amendment authorship in two consecutive lanes.'
      - 'Round 2 additionally spent budget discharging Round 1''s defects. That work was not wasted -- all seven are confirmed discharged -- but its only purpose was to make a document acceptable, not to reduce any uncertainty about the ECDLP.'
    the_concrete_benefit:
      - 'FOUR OF THE TEN BLOCKING DEFECTS WOULD HAVE PRODUCED INVALID OR UNINTERPRETABLE OUTPUT, discovered -- if at all -- after compute: Round 1''s stale T value would have run a second-scale arm at a table size the frozen instrument does not use; its false exhaustive-partition identity would have handed a blind re-deriver a self-check that is false of the object both readings compute; its leaking prior would have contaminated the seal the whole design rests on; and Round 2''s CF-1 leaves an executor with no correct action for six of fifteen items, where the two available actions differ in whether two fenced diagnostics enter the control report.'
      - 'ROUND 1''S D2 IS STILL LIVE IN THE APPROVED, EXECUTION-AUTHORIZED v2 (DEC-20260907-b6bcf4 CR-1a), and a run has already executed under that contract. The defect was found by a gate reading a DIFFERENT document. That is the strongest available evidence that the gate caught something real.'
      - 'Each refusal is enumerated, per-item and cheap to discharge; Round 2 carries ten named remedies plus an explicit list of what must NOT be reopened, so the third authorship is bounded work rather than another open-ended pass.'
    the_verdict:
      is_the_gate_working_as_designed: >-
        YES, AND THAT IS NOT THE OPERATIVE ANSWER. The gate refuses operative
        defects before compute, in a session that cannot be flattered by having
        written the document, and says which are blocking and why. Nothing in
        its conduct needs changing, and the second gate did the expensive work
        its own author predicted it would skip.
      does_contract_authorship_need_a_different_method: >-
        YES, AND THIS IS THE OPERATIVE ANSWER. A process in which two successive
        one-pass authorships of the same contract each fail on THE
        SELF-CONSISTENCY OF THEIR OWN TEXT does not have bad luck as its failure
        mode. Both rounds' defects share one shape -- internal disagreements no
        single reading of any one block can see -- and every one of that class
        is MECHANICALLY CHECKABLE with no judgement in it. Continuing to catch
        them by asking a reader to hold a two-thousand-line document in view is
        a method with a known, twice-measured failure rate.
    the_method_named:
      id: AM-1
      name: >-
        Derive-then-assert: one machine-checkable source for the item and
        condition tables, plus a MANDATORY PRE-GATE SELF-CONSISTENCY PASS that
        is a script rather than a reading, archived as a task artifact.
      the_five_checks:
        - 'C-1 ITEM-SET IDENTITY: extract the declared item set from the specification and from the amendment as sets of (letter, name, kind) and assert equality. Would have caught LO-1.'
        - 'C-2 PARTITION ARITHMETIC: assert every summary count equals the size of the partition it claims, and that the partition is disjoint and exhaustive over the extracted set. Would have caught CF-5.'
        - 'C-3 QUANTIFIER RANGE: assert every `required_artifacts` quantifier ranges only over items whose declared kind admits the field it demands. Would have caught CF-1, the round''s one OPERATIVE blocking defect.'
        - 'C-4 CROSS-REFERENCE RESOLUTION: assert every condition, criterion, falsification and control reference resolves to exactly one target, and that any phrase quoted from a source decision carries a pointer to it. Would have caught XR-1, XR-2 and XR-3.'
        - 'C-5 POINTER FRESHNESS: assert every cited file:line pointer still resolves to the cited token. Would have caught J1-CITE.'
      what_it_would_not_have_caught_and_why_that_is_the_point: >-
        CF-2 and CF-4. THOSE TWO NEED A READER, and they are the two findings of
        this round a gate's judgement is actually worth paying for. The method's
        purpose is not to replace the gate; it is to stop spending the gate's
        judgement on arithmetic, so a refusal carries two findings a script
        cannot reach instead of seven of which five it could.
      cost_and_honesty: >-
        The pass is not free: it requires the contract's item and condition
        tables to be EXTRACTABLE, which in practice means authoring them as one
        structured block and deriving the prose from it rather than writing
        both. That is a real constraint on how these contracts are written and
        it is the substance of the method. IT IS ALSO UNTESTED: no such pass has
        been run in this program, this lane implements none of it, and the claim
        that it would have caught five of the seven blocking findings is derived
        by inspection of the gate's own defect list, not demonstrated by running
        anything.
      where_it_is_owed: >-
        A required carried deliverable of `lane_next_action` below, so the claim
        gets tested on the next document rather than asserted here.

