  carried_finding_CF_3:
    id: CF-3
    raised_by: 'DEC-20260907-adbe7e (the approval gate), as a program finding OUTSIDE its gated contract'
    target: 'experiments/EXP-ECDLP-6ac801/specification.v2.yaml -- APPROVED, frozen, execution_authorized TODAY'
    the_defect: >-
      THE APPROVED CONTRACT CONTRADICTS ITSELF ABOUT THE a = 1/4 ANCHOR. Control
      (b) at line 537 attributes all ten anchor seeds to N = 2^24; its own
      metrics.primary at line 584 attributes five.
    what_settles_it: >-
      ledger/evidence/EV-ECDLP-60e266.yaml lines 150-155: the ten seeds span TWO
      SCALES -- five at N = 2^24 (RUN-013..017) and five at N = 2^20
      (RUN-001..005), both on EXP-ECDLP-612fb1. metrics.primary is right and
      control (b) is not.
    the_live_consequence: >-
      An executor running under the approved v2 today reads control (b) as a
      ten-seed N = 2^24 anchor, OVERSTATING the reproduction control's external
      support twofold in seed count while silently attributing N = 2^20 seeds to
      N = 2^24.
    v3_is_not_at_fault: >-
      Both blocks are reproduced BYTE-IDENTICALLY in specification.v3.yaml under
      CR-1's COND-2 and COND-3, which forbid editing them. Reproducing the
      contradiction faithfully was the correct behaviour, and the gate says so.
    what_is_and_is_not_at_risk_today: >-
