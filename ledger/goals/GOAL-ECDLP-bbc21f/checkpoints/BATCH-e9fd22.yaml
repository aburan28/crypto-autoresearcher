        Its dispatch queue carries `goal_id: GOAL-ECDLP-001`, with a
        `goal_id_note` recording that EXP-ECDLP-6ac801 and H-ECDLP-37dc01 both
        declare `goal_id: null`.
      - >-
        No checkpoint shard was ever written under
        ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/ for it, so the head's own
        shard set had no entry.
    why_it_is_a_finding_and_not_bookkeeping: >-
      IT WILL RECUR, AND ITS COST IS A WASTED BATCH. The three mechanisms above
      are independent of each other and each alone is sufficient to hide a
      landed result from the head of the goal it advances. The concrete cost
      already paid: DEC-20260907-38e5ae had to spend a lane opening on
      discovering that the head's RANK 1 was stale, and a session that had
      instead executed the head's literal text would have re-measured a cell
      already resolved. The generic statement is: WORK ARCHIVED AGAINST ONE
      GOAL IDENTIFIER IS INVISIBLE TO THE HEAD OF THE GOAL IT ACTUALLY
      ADVANCES, and a head read is not a substitute for reading the decisions.
    scope: >-
      Observed on this goal for BATCH-3c7493 / EXP-ECDLP-6ac801. Not claimed as
      a survey of the repository; no other goal was audited for the same
      pattern by this archive.
    remedy_recorded_not_performed: >-
      This close records the affected records on the goal head additively (see
      the head's `external_work_advancing_this_goal_20260907_e9fd22` key) so
      the next session's head read is not blind to them again. It does NOT
      change `goal_id` on EXP-ECDLP-6ac801 or H-ECDLP-37dc01 and does NOT
      retroactively register BATCH-3c7493 as a lane: both are separate
      additive acts on records this lane does not own, and both remain open
      items carried in the ranking.

  # -------------------------------------------------------------------
  # FINDING 2: THE AMENDMENT IDENTIFIER COLLISION
  # -------------------------------------------------------------------
  identifier_collision:
    id: IC-1
    what: >-
      ONE EXPERIMENT IDENTIFIER NOW CARRIES TWO v1-to-v2 AMENDMENTS UNDER THE
      SAME AMENDMENT ID `PA-ECDLP-6ac801-v1-to-v2`.
    the_two_records:
      approved:
        amendment: experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml
        contract: experiments/EXP-ECDLP-6ac801/specification.v2.yaml
        content: the narrow a = 1/8 re-seal
        status: approved, frozen, execution_authorized true
        authored_by: BATCH-8f3e86 (session coordinator-ecdlp-8f3e86, branch cursor/run-experiments-batch-93e3), task TASK-20260907-a7c0bf
        merged: PR #822 at 9546db253 and 1ed5d8f35; reached this branch via the origin/main merge
      revision_required:
        amendment: experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.BATCH-e9fd22-proposed.yaml
        contract: experiments/EXP-ECDLP-6ac801/specification.v2.BATCH-e9fd22-proposed.yaml
        content: this lane's wide 25-seed, two-scale, four-control re-seal
        status: proposed / revision_required (DEC-20260907-4e34c5)
        authored_by: BATCH-e9fd22 (this lane), task TASK-20260907-d47b50
    how_it_arose: >-
      Two lanes amended one experiment concurrently. This lane wrote its draft
      at the live canonical paths and snapshot-archived it at 5856b36e8. The
      other lane's narrow amendment was approved on its own branch, merged to
      main, and arrived here through the origin/main merge; that same session
      then pushed 465c01cba onto THIS branch, demoting this lane's draft to the
      two `.BATCH-e9fd22-proposed.yaml` sidecars. NO FILE WAS OVERWRITTEN. The
      collision is in the identifier, and it is real. Full sequence:
      DEC-20260907-4e34c5 `procedure_deviations` PD-1.
    disposition: >-
      THE COLLISION STANDS PERMANENTLY AS A DISCLOSED DEFECT, AND NEITHER
      RECORD IS RENAMED. AGENTS.md rule 15 forbids the remap: the identifier
      appears in the binding fields of two COMPLETED archives -- 4ce154's
      `archive.record_ids` (commit 5856b36e8) and TASK-20260907-ceb8cf's
      ledger receipt `record_ids` (commit f996864d2) -- so a rename would break
      both archives permanently, since the commits are immutable and their
      declared sets could never again be reconciled with the tree. NO
      SUPERSEDING RECORD IS REQUIRED EITHER: the successor amendment is a
      v2-to-v3 under the NEW id `PA-ECDLP-6ac801-v2-to-v3`, which names the
      approved v1-to-v2 as its base explicitly and needs neither of the two
      colliding records to change. A reader disambiguates today from the
      sidecar's own `revision_required` status and from DEC-20260907-4e34c5's
      `gated_object` block, which states which bytes the gate read.
    residual_risk_disclosed: >-
      A future reader citing "PA-ECDLP-6ac801-v1-to-v2" without a path or a
      status qualifier names an ambiguous object. That ambiguity is not
      repairable by this or any later record; it is the cost of two lanes
      amending one experiment, and it is recorded rather than smoothed over.

  # -------------------------------------------------------------------
  # FINDING 3: THE COMPATIBILITY READ THE ARCHIVE TASK DECLINED
  # -------------------------------------------------------------------
  compatibility_read:
    id: CR-1
    performed_by: TASK-20260907-9e7580
    question: >-
      TASK-20260907-ceb8cf recommended closing this lane and carrying its scope
      forward as a v2-to-v3 amendment on top of BATCH-8f3e86's approved v2, and
      named the one check that would falsify that recommendation without
      performing it: can the approved v2's frozen `definitions` and
      `success_criterion` additively carry this lane's wide scope -- 25 seeds,
      interval estimation with an UNRESOLVED verdict, the externally anchored
      decay control, and the cross-scale reproduction control -- or must the
      collision instead be resolved by superseding one amendment under a new
      id?
    method: >-
      Read the two live approved records --
      experiments/EXP-ECDLP-6ac801/specification.v2.yaml and
      experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml -- against the
      sidecar draft's `definitions`, `controls`, `independent_variables`,
      `metrics`, `replication`, `budget`, `stopping_rules`,
      `invalidation_rules` and `success_criterion`, field by field. READ ONLY:
      no byte of either approved record was written, and both are another
      lane's approved records.
    verdict: >-
      YES -- A v2-to-v3 AMENDMENT CAN CARRY THE WIDE SCOPE ADDITIVELY. The
      archive task's recommendation therefore stands and its stated falsifying
      condition does NOT fire. No supersession under a new id is needed, and
      none is performed.
    decisive_frozen_fields:
      - field: 'specification.v2.yaml invalidation_rules item 7'
        text_quoted: >-
          "Any post-hoc change to the a-grid, N, r, T_sel, or the G3-style
          feasibility criterion beyond what THIS versioned contract states:
          requires a further versioned protocol_amendment; runs already
          executed are never re-scored."
        why_decisive: >-
          THIS IS THE APPROVED CONTRACT'S OWN DECLARED CHANGE MECHANISM, and it
          names by name three of the four things the wide scope must move: N
          (the second scale), T_sel (T/4 and T/8 for the DECAY-TSEL control),
          and the G3-style feasibility criterion (interval estimation and the
          UNRESOLVED verdict). A v2-to-v3 amendment is exactly the instrument
          this rule points at. Its one binding condition -- that runs already
          executed are never re-scored -- is satisfied: the six executed runs
          RUN-ECDLP-6ac801-001..006 enter the wide scope only as control (f)'s
          REFERENCE, never as its subject.
      - field: 'specification.v2.yaml definitions.N, independent_variables, inputs.stage_plan (Stage B), inputs.exact_basins, blind_rederivation.parameters'
        text_quoted: >-
          'fixed at 2^24 = 16777216 for this contract' / 'N: fixed, 2^24' /
          'N = 2^24 only' / 'restricted to N = 2^24' / 'N = 2^24; a_grid = ...;
          5 seeds'
        why_decisive: >-
          N is frozen as a constant in five places, so the second scale is the
          largest single change. It is nevertheless additive in this program's
          sense, because the approved v2 states NOTHING at N = 2^20 -- there is
          no value to contradict, only a value to state. v3 appends a second
          arm declaring T = 64 and T_sel = 32 at N = 2^20, cited to
          experiments/EXP-ECDLP-612fb1/specification.v2.yaml line 223 ("T:
          nominal table size N^{1/3} rounded, i.e. 64 at 2^20, 256 at 2^24,
          1024 at 2^30"), and leaves every N = 2^24 field byte-identical. D1
          is therefore CHEAPER against the approved v2 than against the
          sidecar: against the sidecar it is a contradiction to repair,
          against the approved v2 it is a blank to fill.
      - field: 'specification.v2.yaml blind_rederivation (frozen: true) and its appended sub-key v2_rerequirement_a_1_8'
        why_decisive: >-
          THE APPROVED v2 ANSWERS THE "DOES frozen: true BLOCK AN EXTENSION"
          QUESTION AGAINST ITSELF. It appended `v2_rerequirement_a_1_8` as a
          new sub-key INSIDE a block carrying `frozen: true`, and its own
          amendment's `not_changed` records the pattern explicitly:
          "blind_rederivation's own v1 fields (required, frozen, quantity,
          parameters, procedure, blind_from, comparison_rule,
          non_negotiable_note) -- verbatim; `v2_rerequirement_a_1_8` is a new,
          appended sub-key only". So in this program's practice `frozen: true`
          means the existing fields are byte-identical, NOT that no sub-key may
          be appended. That precedent sits inside the very record being read,
          which makes it the strongest available answer.
      - field: 'specification.v2.yaml success_criterion (S1 / S2 / S3) and metrics.primary'
        text_quoted: >-
          'per a: pass-count out of 5 seeds (margin >= 0); G3-style feasibility
          verdict (>= 4/5 -> FEASIBLE, else INFEASIBLE)' / 'S3 (DISAGREEMENT)'
        why_decisive: >-
          The verdict PARTITION is the one place where a naive port is NOT
          additive, and the defect is a LABEL COLLISION rather than a frozen
          conflict. The approved v2's S3 means DISAGREEMENT; the sidecar's S3
          means CONFIRMED UNRESOLVED and its S4 means DISAGREEMENT. A v3 that
          adopted the sidecar's labels would make "S3" denote two different
          outcomes for one experiment identifier -- precisely the failure this
          experiment has already suffered once at the amendment id (IC-1).
          REQUIRED OF v3: keep S1, S2 and S3 with the approved v2's meanings
          verbatim, and give the new interval-routed outcome its own fresh
          label. With that done the change is additive: a new verdict value
          plus a new criterion for the 25-seed arm, with the approved >= 4-of-5
          rule preserved verbatim and applied to the seeds 1..5 subgroup,
          reported separately and never composited.
      - field: 'specification.v2.yaml controls (e) SEED-COUNT PARITY; definitions.seed; replication.seeds / independent_instances'
        text_quoted: >-
          '(e) SEED-COUNT PARITY: 5 seeds per a, matching Stage 0''s and v2''s
          own seed count, so this batch''s statistical power is comparable, not
          thinner, than the batch that produced the original discrepancy.' /
          '5 seeds per a' / 'seeds: [1, 2, 3, 4, 5]' / 'independent_instances: 5'
        why_decisive: >-
          THE SEED SET IS THE ONE WIDE-SCOPE ITEM invalidation_rules item 7
          DOES NOT NAME, so its authority to change comes from nowhere in that
          rule; it is instead frozen in four places including a CONTROL with a
          stated rationale. The rationale is what settles it: control (e)
          exists so power is "comparable, not thinner", and 25 seeds satisfy it
          a fortiori. v3 must therefore supersede control (e) by APPENDING a
          new control that quotes (e) verbatim, states that its purpose is met
          more strongly, and pins seeds 1..5 as the subgroup serving the
          reproduction control -- never by editing (e)'s text. (Corroborating
          detail, not authority: the sidecar draft's own version of item 7
          silently ADDS "the seed set" to the enumerated list, which is a tell
          that its author noticed the same omission.)
      - field: 'specification.v2.yaml budget (enforcement: advisory; maximum_runs: 8; total_cpu_hours: 1)'
        why_decisive: >-
          NOT AN OBSTACLE, recorded so nobody re-raises it. The wide scope
          needs maximum_runs 30 and 6 CPU-hours against the approved v2's 8 and
          1, but `enforcement: advisory` and CLAUDE.md "Research budgets:
          progress first" make these advisory estimates revisable upward
          without further approval. `maximum_memory_gb: 8` and
          `maximum_workers: 1` are machine protection and v3 must not raise
          them.
    the_finding_that_strengthens_the_recommendation:
      id: CR-1a
      what: >-
        THE APPROVED v2 REPAIRED ONE DEFINITIONAL GAP AND LEFT A SECOND ONE OF
        THE SAME CLASS IN PLACE. `cap`, `CAP_MULT`, `cycle_mass` and
        `capped_mass` appear ZERO times in
        experiments/EXP-ECDLP-6ac801/specification.v2.yaml (verified by grep of
        the committed file), so the cap = ceil(8*W) that decides which points
        belong to a basin at all is not derivable from the approved contract's
        text.
      why_it_matters: >-
        The approved v2 is `execution_authorized: true` and requires a freshly
        sealed Stage A' re-derivation of the a = 1/8 cell. A from-scratch
        re-deriver working from that contract alone must INVENT a cap
        convention -- which is the identical failure mode
        TASK-20260907-80e198's validator root-caused the original a = 1/8
        disagreement to, relocated from the weight to the cap.
      what_is_NOT_claimed: >-
        NO MAGNITUDE AND NO DIRECTION. Whether a cap difference could change
        the a = 1/8 verdict is UNMEASURED by this archive and by the gate. The
        gate measured only the unassigned mass itself (4.67e-4 to 2.09e-3 of N
        across the four a-cells of RUN-ECDLP-6ac801-001) and stated the
        direction of any induced difference is unpredictable from the contract
        text. The risk asserted here is a REPEAT OF A FAILURE CLASS, not a
        known verdict flip, and it is not evidence about G3 feasibility at any a.
      one_difference_from_the_sidecar_worth_recording: >-
        The approved v2 is SILENT about the partition's exhaustiveness; the
        sidecar draft ASSERTS 'sum over all d of b(d) = N', which is false of
        the object both readings compute (sidecar lines 92 and 169). Silence is
