      T_sel = T/2, a sealed Stage A blind re-derivation under
      TASK-20260907-80e198, and a proves-too-much control), with evidence
      record EV-ECDLP-2e9680 and decision DEC-20260907-9b1b02 at commit
      84233e8c3.
    why_the_head_could_not_see_it:
      - >-
        BATCH-3c7493 was opened under coordination/experiments/EXP-ECDLP-6ac801/
        rather than under this goal's lane directory, so
        `tools/goal_lanes.py lanes GOAL-ECDLP-bbc21f` never listed it.
