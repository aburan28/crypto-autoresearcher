  # -------------------------------------------------------------------
  # WHAT BROKE
  # -------------------------------------------------------------------
  what_broke:
    - >-
      THE HEADLINE CLAIM WAS INFEASIBLE BY CEILING. The exact top-T/2 basin
      share (0.255-0.287, mean 0.271, reproducing C_max(1/8) = 0.2716 to
      0.1%) lies BELOW the static T table's exact coverage (0.264-0.304,
      mean 0.291) in 10/10 exactly enumerated seeds at a = 1/4 (2^20 and
      2^24), so by disjointness no T/2 table can reach static T on this
      instrument -- the same argument the contract used to predict failure
      at a = 1/2. The model rested on the equality C_max(1/8) = p_static =
      0.27 with zero pre-registered margin; each input reproduced within
      tolerance and the equality still failed by 0.02. The oracle floor on
      rho_T is about 0.55, above the model asymptote 0.51.
    - >-
      S1 FAILED WITH CI EVERYWHERE and F1's letter did not fire: difference
      -0.064 [-0.080, -0.049] (2^24), -0.076 [-0.083, -0.068] (2^30), -0.049
      [-0.071, -0.029] (curve); rho_T(16T) 0.619 / 0.632 against F1's 0.85.
      The outcome sits in a cell the contract did not name (its two F1
      formulations are not equivalent). Coordinator action: `weaken` with
      amendment, not an S1/F1 transition.
    - >-
      "FEWER STORED DPs" SURVIVES ON NO CELL once entries at the online site
      are counted: the smallest re-selected cell CAP(2T,T/2) holds 2.6 T
      against STATIC(T)'s 1 T; uncapped 8.7-9.9 T. On the RQ's cumulative
      epsilon the advice ratio is 0.75-0.77 and U* is unreachable. The
      record is a tradeoff point on the (P, S, L, epsilon, U) frontier.
    - >-
      S1 PROVES TOO MUCH: on an affine-xorshift keyed bijection where every
      table sits at 3-5% and RHO at 0, the pipeline reports S1_met true
      (-0.008 [-0.023, 0.000]) and U_ss = U* = 2T -- the absolute tolerance
      has no non-vacuity guard. The composite S1-S4 with G1 and the fixture
      does fail on every known-false object as required.
    - >-
      S2 AS WRITTEN IS UNSATISFIABLE: uniform relabelling of every evidence
      increment must randomise the table (NULL-A -0.11 to -0.22 in every
      real cell, 2-3x the effect size), so "within CI of zero at every
      round" could never accept; the one-sided rule 5 is the operative null
      test and it works.
    - >-
      THE 869870 FIXTURE GATE FAILED AT 2^24 by one cost cell ((1, 8) +0.1005
      vs 0.10) and four precomputation cells (+14.6% to +20.9% vs 12%); the
      passing headline cell is band-edge under re-keying (validator: every
      instrument of the class reads 0.06-0.11 below 1.79 at theta = 1/128).
      The instrument is not validated; the 2^24+ cells are
      invalid-for-interpretation, not negative.
    - >-
      The snapshot analysis.py crashes (TypeError) instead of reporting G1
      FAILED on a no-tail object; HEUR-BLT-7's r_eff formula overcounts
      admitted evidence by about 1.7x; CAP(2T) holds 2.6 T not 2 T; the
      a = 1/2 differential does not discriminate the basin model (the same
      inequality holds at a = 1/4).

