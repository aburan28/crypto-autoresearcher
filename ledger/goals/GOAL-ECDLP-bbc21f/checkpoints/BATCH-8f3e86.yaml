    - "A MEASURED OBSTRUCTION WITH A GENUINE RESOURCE CHECK IS ON RECORD: estimator-loss saturation near 0.099 for all a >= 1/8 at both tested N, read the other way round as a potentially REUSABLE CONSTANT that would make the a-crossing predictable rather than measurable-only. See EV-ECDLP-6a4ebc `obstruction`."

  # -------------------------------------------------------------------
  # WHAT BROKE
  # -------------------------------------------------------------------
  what_broke:
    - >-
      R3 IS NOT DISCHARGED, AND THE BATCH WAS SCOPED TO DISCHARGE IT. The
      amendment's R3 claims STAGE 3B has a different experiment identifier, a
      different random-function family AND a different basin-closure
      implementation from either 6ac801 arm. EXACTLY ONE IS TRUE. Section 3
      REQUIRES STAGE 3B to import source_v2/instrument.py unchanged, and
      EV-ECDLP-2e9680 records 6ac801's production arm reusing that same module.
      Both mutually blind reviewers found this independently. The defect is in a
      frozen contract's premise, not in the executor's conduct -- the executor
      flagged the bitwise coincidence itself, as U1, without drawing the
      conclusion.
    - >-
      THE ROUND'S ONLY INDEPENDENT READING RETURNS 4/5 AT a = 1/8, NOT 5/5.
      Validator -0.002952278 at the draw it labels seed 2, against the producer's
      +0.005128205 at its own seed 2; the validator's next smallest margin is
      +0.000260115, so the cell has almost no headroom under a differently-drawn
      instrument. With STAGE 3A and STAGE 3B both reducing to the same frozen
      instrument, J2 is the ONLY independent reading IN THIS ROUND -- and it is
      the one that dissents at a draw. Every strength and status judgement in
      this batch follows from that.
      READ IT AS A SAMPLE DIFFERENCE, NOT A SEED-PAIRED CONTRADICTION: Section 3
      leaves the instrument family to the implementer under reading P2, and the
      validator disclosed choosing a uniformly random function on Z_N with an
      independent Bernoulli DP marking rather than the frozen mix64, so the two
      "seed 2"s index different draws. The validator asserted no implementation
      error in either direction and stated the finding as "the a = 1/8 PASS IS
      NOT ROBUST TO THE INSTRUMENT FAMILY, while the a = 1/16 PASS IS", which the
      caveat sharpens rather than softens. See EV-ECDLP-6a4ebc
      `j2_seed_pairing_caveat`.
    - >-
      A SECOND INDEPENDENT READING OF a = 1/8 EXISTS ON origin/main AND
      CORROBORATES -- DISCOVERED AT ARCHIVE TIME, NOT AVAILABLE TO EITHER
      REVIEWER. EV-ECDLP-6783b8 / DEC-20260907-8d8782 (TASK-20260907-2db9aa,
      BATCH-1e7251, EXP-ECDLP-6ac801) is a freshly sealed independent blind
      re-derivation of the same cell -- N = 2^24, r = 2, T_sel = 128, exact
      basins, seeds {1..5}, corrected weight -- returning 4/5, verdict
      G3-FEASIBLE, margins [+0.004869, +0.020602, -0.001513, +0.002507,
      +0.004358]. TWO INDEPENDENT IMPLEMENTATIONS, NEITHER HAVING READ THE OTHER,
      BOTH RETURNED 4/5 WITH EXACTLY ONE NARROWLY NEGATIVE DRAW against a
      production reading of 5/5. That lane reached the seed-pairing caveat
      independently too. It makes the VERDICT more secure and the CELL no less
      marginal; it does NOT discharge this batch's R3, does NOT lift
      `preliminary` (that lane assigned itself `preliminary` too), and does NOT
      touch a = 1/16, which still has no independent reading outside this batch.
      See DEC-20260907-6d9427 `cross_lane_state_discovered_at_archive_time`.
    - >-
      THE AMENDMENT'S MEASURE-ZERO TIE-BREAK CLAIM IS FALSE AS WRITTEN. 75-85% of
      pool entries are TIED and ties STRADDLE the selection cut. The conclusion
      survives because 64 alternative tie-break streams flipped no sign -- BY
      MEASURED HEADROOM, NOT BY THE ARGUMENT THE CONTRACT GAVE. A successor
      amendment must correct the text.
    - >-
      THE POOL-EVIDENCE-ONLY INVARIANT IS NOT ENFORCED BY CONSTRUCTION: `basins`
      is lexically in scope inside measure_cell and `_assert_evidence_only` is a
      length check. The invariant HOLDS as information flow (audited clause by
      clause) but the code does not make its violation impossible -- and reading
      true basin size in the SELECTION path is a NAMED INVALIDATION RULE of this
      amendment, being the exact confound the 6ac801 disagreement traced to.
    - >-
      THE FROZEN SECTION 6 CONTROL SET IS TOO WEAK TO HAVE PROTECTED THE a = 1/8
      PASS. It detects a uniform upward bias only at 0.017737, while 0.005128
      already manufactures the PASS -- a blind band 2.46x the headroom. (At
      a = 1/16 the band is 1.7% of the headroom: almost fully protected.) The red
      team closed the gap with NULL_T, whose bias-to-fire is 0.000869, under
      which both blind bands are EMPTY.
    - >-
      a = 3/16 IS NOT DECISIVELY KNOWN-FALSE AT FIVE SEEDS. Over 20 seeds 4 are
      positive; over all 15504 five-seed draws 16 return G3 PASS -- a MEASURED
      TYPE-I ERROR RATE OF 1.03e-3 -- and the frozen draw's m(4) of -0.017737 is
      roughly twice as favourable to the control as the median draw's -0.008719.
      The control DID NOT FIRE and this is a measurement of its type-I error, not
      a firing. Consequence: no later reading may treat "a = 3/16 FAILS 0/5" as a
      SHARP SEPARATOR between feasible and infeasible a.
    - >-
      TWO DECLARED CONTROLS ARE WEAKER THAN THEIR COUNTS SUGGEST. DECAY_G3's
      40/40 monotonicity is close to STRUCTURALLY FORCED (pools nest and
      TopShare(T_sel) is bitwise identical across r, so r acts only on the
      comparator). NULL_A tests only "is w(d) better than an information-free
      selection", a LOW BAR, and is not a null for the SIGN of the margin -- and
      its headline 0.32-0.36 ratio is THE a = 1/16 ROW ONLY.
    - >-
      A STRUCTURAL GAP IN THE DECLARED CONTROL SET: writing
      margin = estimator loss - halving loss, all three declared controls act on
      the ESTIMATOR loss and NONE touches the HALVING loss, which carries the
      a-dependence the claim is about. Closed by the red team's NULL_T, which is
      a diagnostic and not yet a declared control.
    - >-
      THE BATCH PRODUCES NO POINT ON THE ACHIEVABLE FRONTIER AT ALL.
      TopShare(T_sel) is an ORACLE and zero online arms ran; sota_delta is 0.000
      on every achievable axis. Judged as a ceiling, a = 1/16 is 19.2% below the
      ATTAINED a = 1/4 static table per unit walk length and 4.6% below per unit
      precomputation, winning only advice size and only by 2x. Largest uncharged
      cost: exact basins are Theta(N) time and memory -- Theta(2^256) at crypto
      scale, WORSE THAN THE INSTANCE THE TABLE WOULD HELP SOLVE. U is uncharged
      entirely and inverse success probability is implicitly 1.

