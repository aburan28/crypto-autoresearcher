  title: >-
    Batch ECDLP with precomputation: fewer stored distinguished points at
    fixed online cost
  objective: >-
    Measure, with independent validation and red-team review, whether the
    batch-reselected fixed-size table (H-ECDLP-37dc01, contract
    EXP-ECDLP-612fb1) and the basin-partition coverage instrument
    (H-ECDLP-3550b8, contract EXP-ECDLP-869870) answer RQ-ECDLP-78dbc5 in
    EITHER direction with a measured constant and a confidence interval:
    whether the number of stored distinguished points T needed for a fixed
    per-target online cost and success probability can be reduced below the
    selected Bernstein-Lange table in a fully charged (P, S, L, epsilon, U)
    cost model, and by what factor. Every result of this campaign is
    constant-factor, generic, claim_tier toy, and sits under the
    Corrigan-Gibbs-Kogan S T^2 = Omega~(eps N) ceiling (KN-LIT-013); no
    exponent is targeted and the campaign says so at every step. A negative
    batch narrows the constant's known range; only a measured obstruction
    block per docs/inventor-protocol.md closes a lane.
