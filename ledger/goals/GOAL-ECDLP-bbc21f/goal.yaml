  - id: C1
    statement: >-
      A committed evidence record for EXP-ECDLP-612fb1, independently
      validated and red-teamed, reporting T_resel(U)/T_static at fixed
      (L, epsilon) at a = 1/4 with a confidence interval, the early-batch
      penalty (first 10% of the batch, U_ss and cumulative U*), and the
      outcomes of the NULL-A / NULL-B nulls and the phi decay -- in EITHER
