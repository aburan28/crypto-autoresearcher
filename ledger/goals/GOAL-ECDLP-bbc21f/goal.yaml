      function of N/T), and their N-independence verdict across 2^20..2^30
      (V5), each with a confidence interval and the model value beside it,
      never in one column.
    status: OPEN
  - id: C3
    statement: >-
      CLOSURE STANDARD, failing a positive on C1: a committed evidence record
      carrying a complete measured `obstruction` block per
      docs/inventor-protocol.md -- the quantity that bounds the gain
      (rho_T(16T) with its CI, or the static table's measured estimation-loss
