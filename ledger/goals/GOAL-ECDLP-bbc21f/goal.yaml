      U = 8T (S1-S4), or remaining CI-separated below it at U = 16T (F1), on
      the tested (N, a, r, k, cap, walk, solver) grid at claim_tier toy.
    status: OPEN
  - id: C2
    statement: >-
      The instrument EXP-ECDLP-869870 committed with its basin-law
      measurements (survival slope, cutoff), its oracle-ceiling measurements
      (exact top-T share against C_max(a)), its published-rule measurements
