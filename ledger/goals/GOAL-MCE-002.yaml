research_goal:
  id: GOAL-MCE-002
  title: >-
    Binary-Goppa McEliece-style trapdoor feasibility and detectability at toy
    scale: dual decoding representations and master-keyed
    quadratic/syzygetic witnesses
  objective: >-
    Determine, only on deliberately small synthetic binary-Goppa instances,
    whether an honestly decodable McEliece-like public code can also carry a
    second master-keyed recovery route of either of two forms: (1) a genuinely
    distinct hidden decoding representation for the same public code, or (2)
    a master-key-derived low-rank quadratic-relation or low-degree syzygetic
    witness from which an equivalent decoder can be recovered. Treat
    functionality and detectability as one joint research object: compare
    candidate and honest Goppa-key ensembles under matched generation and a
    pre-registered battery of structural distinguishers, and publish a
    detector or named obstruction when the extra structure leaks. Passing the
    toy battery establishes only that no registered test separated the
    ensembles at the measured power; it is never evidence of crypto-scale
    indistinguishability. No production backdoor, covert deployment, key
    escrow, or interception capability is an objective.
  question_ids: [RQ-MCE-b38a8b]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MCE-001, GOAL-ECTD-001]
  scheme_context:
    scheme: >-
      Toy binary Goppa codes exposed through a McEliece-like public-code
      representation; no standards-compatible key serialization
    family: >-
      Code-based public-key encryption research object with an ordinary user
      decoder and a separately tested master-keyed recovery witness
    parameter_boundary: >-
      Laboratory cells only: m in {4, 5, 6}, 12 <= n <= 64, n <= 2^m, and
      t in {2, 3, 4}, restricted further whenever exhaustive decoding or
      public witness enumeration does not fit the frozen batch budget. No
      Classic McEliece or ISO parameter set may be instantiated or
      extrapolated to.
    why_this_lane: >-
      Normal McEliece key generation already hides one efficient decoding
      representation for its owner. The distinct scientific question here is
      whether the same public code can support a separately recoverable
      master route without moving outside the tested honest-Goppa public-key
      distribution. Extra algebraic structure is useful only if it decodes,
      and scientifically credible only if the same experiment measures the
      public structure it introduces.
  non_duplication:
    - >-
      GOAL-MCE-001 owns transcription of the published McEliece structural-
      attack frontier and a charged ISD baseline at actual parameter sets.
      This goal neither revises that campaign nor attacks those parameter
      sets. It owns designer-side toy generation, dual-representation
      feasibility, and defensive detectability measurements.
    - >-
      GOAL-ECTD-001 owns prime-field elliptic-curve trapdoors. This goal adopts
      its constructive-or-named-barrier discipline but studies binary Goppa
      representations and code invariants only.
    - >-
      Generic malicious key generation, subliminal leakage, and secret
      exfiltration are out of scope. A candidate must arise from one of the
      two declared algebraic lanes and must be evaluated as a distribution of
      valid toy Goppa public codes, not as an arbitrary payload channel.
  scope_discipline:
    - >-
      ACADEMIC AND DEFENSIVE RESEARCH ONLY. Every key, error vector and
      ciphertext is generated locally for this experiment, is deliberately
      toy-sized, and has no third-party owner. No live key, captured
      ciphertext, wallet, account, network endpoint, or deployed system may
      be supplied to any task under this goal.
    - >-
      COVERT DEPLOYMENT IS EXPLICITLY PROHIBITED. No task may build or modify a
      production key generator, standards-compatible implementation, library
      integration, service, wire protocol, escrow facility, or mechanism for
      decrypting or intercepting third-party traffic. No task may test a
      candidate against third-party keys or traffic.
    - >-
      Key exfiltration and subliminal payload channels are prohibited. The
      master key exists only as experiment metadata for deriving or locating
      the declared algebraic witness; it may not encode a user secret,
      identifier, message, or telemetry into a public key.
    - >-
      Detectability testing is for scientific falsification and defensive
      detector construction, not for evading operational review. Any
      constructive artifact must ship with its structural measurements,
      positive controls, known detector failures, and an unambiguous
      TOY-ONLY / DO-NOT-DEPLOY label.
    - >-
      A distinguisher is not key recovery, and failure to distinguish at
      finite sample size is not indistinguishability. Every conclusion states
      which interface was tested, the toy cells used, the statistical power,
      the registered detector family, and the scope that remains untested.
  formal_candidate_contract:
    honest_generation: >-
      HonestGen(theta; r) -> (pk, sk_user), using a frozen binary-Goppa support,
      polynomial, scrambler and coordinate-permutation sampling convention.
      Every public key is reduced to the same frozen public representation
      before comparison.
    candidate_generation: >-
      TrapGen(tau, theta; r) -> (pk, sk_user, audit_witness), where pk is a
      valid toy binary-Goppa public code at the same theta, sk_user remains an
      ordinary user decoding representation, and audit_witness is retained
      only for correctness and detector validation.
    master_recovery: >-
      MasterRecover(tau, pk) -> sk_master or an equivalent bounded-distance
      decoder. The recovery algorithm receives neither sk_user nor
      audit_witness. Its output must decode the same locally generated error
      patterns as sk_user and must carry an independently reverified
      correctness certificate.
    master_key_lifecycle: >-
      Tau is a master key only if one fixed tau governs multiple independently
      randomized candidate keys. Stage 0 freezes the number of keys per tau,
      the number of independently sampled tau values and domain separation
      between master selection and per-key randomness. Constructive success
      must reuse the same tau across its declared nested cohort and must test
      both within-master and across-master correlations. A one-time tau is a
      per-key auxiliary secret and may not be reported as a master key.
    equivalence_boundary: >-
      Stage 0 freezes which support transformations, field automorphisms,
      row operations and coordinate permutations count as trivial
      equivalences. A second description that is merely a publicly computable
      relabeling of sk_user is a positive control, not a successful dual
      representation.
  candidate_lanes:
    - id: dual-decoding-representation
      mechanism: >-
        Search for one public toy Goppa code with two hidden decoding
        descriptions that remain distinct after quotienting by the frozen
        trivial-equivalence relation. The user receives one description;
        tau indexes or reconstructs the other without receiving the first.
      mandatory_control: >-
        Plant a trivially equivalent second description and require the
        equivalence checker to reject it as a research success while the
        decoding harness still recognizes both descriptions as functional.
    - id: master-keyed-quadratic-syzygetic-witness
      mechanism: >-
        Use tau only to derive or locate a low-rank element in the frozen
        quadratic-relation space, or a low-degree syzygy in the frozen graded
        relation module, and test whether that witness recovers an equivalent
        Goppa decoding representation. Any conditioning or rejection sampling
        used to create the witness is charged and included in the public-key
        distribution comparison.
      mandatory_control: >-
        Include ordinary honest Goppa keys, matched random linear codes, and a
        deliberately planted low-rank or low-degree witness whose public
        signal is strong enough that the measurement pipeline must detect it.
  structural_distinguisher_contract:
    public_detector_interface: >-
      A single-key public detector implements Detect(pk, theta). A cross-key
      detector implements DetectSet(P, theta), where P is an unordered multiset
      of public keys and carries no tau value or same-master grouping labels;
      same-tau versus independent-tau set membership is hidden until scoring.
      Neither interface receives sk_user, sk_master or audit_witness. Features
      that use private metadata or true tau groupings are labeled audit-only
      diagnostics and cannot support a claim of public distinguishability. A
      witness rank is public only when the registered algorithm enumerates or
      derives the relevant public rank spectrum from pk alone.
    cohort_design: >-
      Candidate and honest cohorts are matched exactly on (m, n, t, k),
      public-key normalization and scrambler/permutation law. Honest cohorts
      are unconditional HonestGen draws except for its ordinary binary-Goppa
      validity predicate; candidate-only conditioning is never mirrored by
      post-selecting honest keys. Candidate acceptance rate and sampling bias
      remain leakage gates. Candidate cohorts are nested: multiple independent
      per-key seeds under each fixed tau and multiple independently sampled
      tau values, all domain-separated. Labels remain blinded through feature
      extraction. Honest-versus-honest splits calibrate the null; planted
      witnesses calibrate sensitivity. Sample sizes, keys per tau, tau count,
      holdout split, equivalence margins, multiplicity correction and stopping
      rules are frozen before candidate labels are opened.
    primary_metrics:
      - >-
        Dimensions of the Schur square C^(2) and Schur cube C^(3), together
        with pre-registered puncturing and shortening profiles so a saturated
        full-code dimension cannot hide a lower-dimensional signal.
      - >-
        Coordinate-permutation automorphism statistics: group order, orbit
        sizes and the support-size distribution of nonidentity elements, with
        the exact enumeration or approximation method recorded.
      - >-
        Dimension and rank profile of the quadratic-relation space under the
        Stage-0 coefficient-field and evaluation-map convention, including
        minimum publicly observed rank and low-rank multiplicities computed
        from pk alone.
      - >-
        Low-degree syzygy dimensions, Hilbert-function values and graded Betti
        invariants of the Stage-0 relation ideal/module under a frozen ring,
        grading and term-order-independent reporting convention.
    public_distribution_leakage_gates:
      - >-
        Candidate acceptance/rejection rate and generation work, compared with
        unconditional HonestGen rather than a post-selected honest cohort.
      - >-
        Any support or Goppa-polynomial sampling imbalance introduced by
        candidate conditioning, together with within-master and across-master
        correlations visible to DetectSet from an unlabeled public-key set
        alone.
    secondary_metrics:
      - >-
        Decoder failure rate, master-recovery work, public witness-recovery
        work and peak memory, plus audit-only diagnostics such as the known
        planted/master witness rank percentile. Audit-only values are never
        inputs to Detect(pk, theta).
    inference_boundary: >-
      A candidate passes this battery only when every registered primary test
      and every public-distribution leakage gate stays inside its pre-declared
      honest-versus-honest equivalence bound on the untouched holdout, and the
      pk-only joint classifier stays below its frozen detection threshold,
      with confidence intervals and achieved power reported. This permits only
      the phrase "not detected by this battery at these toy cells and this
      power." A replicated holdout separation by any primary metric or public
      leakage gate fails the candidate lane even if all other metrics pass.
  staged_experiment_plan:
    - stage: S0-source-and-contract
      budget_role: batch_1
      plan: >-
        Acquire and file the primary Goppa-equivalence, quadratic-relation and
        syzygy-distinguisher sources at honest provenance levels. Freeze the
        two generator interfaces, trivial-equivalence quotient, coefficient
        field, relation ideal/module, tau reuse/lifecycle, pk-only detector
        interface, nested toy grid, work metric, safety boundary, cohort sizes,
        seeds, statistical power and all positive/negative/inconclusive
        branches. No construction code or confirmatory run is permitted before
        independent review of this contract.
      gate: >-
        Every algebraic object and every success/failure threshold has one
        executable definition; the toy-only and no-third-party-input gate is
        machine-checkable in the experiment specification.
    - stage: S1-instrument-and-controls
      budget_role: batch_2
      plan: >-
        Implement HonestGen and the feature pipeline first. On smoke cells
        m in {4, 5}, t in {2, 3}, 12 <= n <= 32, exhaustively verify ordinary
        decoding where feasible and require the planted-representation and
        planted-witness positive controls to fire while honest-versus-honest
        cohorts remain calibrated.
      gate: >-
        A pipeline that cannot reject a trivial second representation, detect
        the planted witness, or reproduce its own honest null does not proceed
        to candidate evaluation.
    - stage: S2-dual-representation-lane
      budget_role: batch_3
      plan: >-
        Enumerate or construct candidate dual descriptions on the smoke grid,
        quotient them by the frozen equivalence relation, and measure user and
        master decoding correctness plus public search cost. Admit at most one
        object-first candidate to the paired-cohort stage; otherwise record a
        named equivalence or existence obstruction with forward guidance.
      gate: >-
        The admitted candidate has two independently verified decoding routes,
        and the second is neither given sk_user nor accepted solely because of
        a trivial public equivalence.
    - stage: S3-quadratic-syzygetic-lane
      budget_role: batch_4
      plan: >-
        Instantiate master-keyed low-rank quadratic and low-degree syzygetic
        candidates on the frozen grid. Charge rejection sampling; measure
        MasterRecover against a public witness search; and extend only a
        functional object to matched cohorts with m in {5, 6}, t in {2, 3, 4},
        24 <= n <= 64 and n <= 2^m.
      gate: >-
        The witness is reproducibly derived or located from tau, recovers an
        equivalent decoder, and is not publicly recoverable at comparable
        charged work under the registered search.
    - stage: S4-blinded-distribution-and-red-team
      budget_role: batch_5
      plan: >-
        For every functional candidate, run the frozen blinded candidate-
        versus-honest comparison and untouched holdout. Report the complete
        Schur, automorphism, quadratic-rank and syzygy/Betti panels, not only
        favorable features. An independent Red Team attempts public witness
        recovery, unregistered classifiers, shortening/puncturing sweeps,
        DetectSet correlation tests and seed/rejection-bias attacks. For a
        lane that reaches a named obstruction before any candidate exists,
        independently review the obstruction and complete honest-null and
        planted-positive-control calibration without fabricating a candidate
        cohort.
      gate: >-
        A constructive candidate survives only the pre-registered acceptance
        rule and a red-team check for public recovery. Any replicated public
        signal is promoted as a defensive detector and fails that candidate.
        An obstruction-only lane advances only with independent review and
        successful calibration of every detector cited in its disposition.
    - stage: S5-replication-and-synthesis
      budget_role: batch_6
      plan: >-
        Independently regenerate the decisive cohorts and choose exactly one
        scoped disposition per lane: toy candidate not detected by the frozen
        battery, defensive distinguisher/public-recovery result, named
        structural obstruction, or inconclusive at budget. Archive all
        controls, raw features, certificates, decision and forward guidance.
      gate: >-
        Validator and Red Team agree that the disposition follows from the
        registered criteria and that no statement exceeds the tested toy
        interface. An inconclusive-at-budget disposition moves the persistent
        goal to paused or closed_at_budget; it does not satisfy completion.
  success_criteria:
    - >-
      CONSTRUCTIVE TOY SUCCESS for a lane requires an ordinary user decoder
      and a tau-conditioned master recovery route that both pass independent
      correctness checks under one reused tau across its declared nested
      cohort, a charged master-route advantage over the matched public recovery
      search, and no registered structural detector or public-distribution
      leakage gate crossing its frozen holdout threshold at every claimed toy
      cell. The report must state achieved power and may claim only
      non-detection by the named battery.
    - >-
      DEFENSIVE SUCCESS is equally valid: a detector, public witness-recovery
      algorithm, equivalence collapse or named algebraic obstruction that
      replicates on untouched seeds, explains why the candidate lane fails,
      and gives forward guidance on what remains open.
    - >-
      Either form of success requires independent Validator and Red Team
      admission plus a Coordinator evidence/decision archive. A screening
      count, a favorable p-value without an equivalence test, or one successful
      decoder transcript is not success.
  candidate_failure_criteria:
    - >-
      User or master decoding fails the frozen correctness test, or the alleged
      second representation collapses to a publicly computable trivial
      equivalence.
    - >-
      Tau provides no charged recovery advantage over the matched public
      search, or a public algorithm recovers the low-rank/syzygetic witness or
      an equivalent decoder at comparable work.
    - >-
      Any registered primary detector or public-distribution leakage gate
      produces a replicated separation on the untouched holdout, including a
      Schur-profile, automorphism, quadratic-rank, syzygy/Betti,
      generation-rejection, support-sampling or cross-key-correlation signal
      outside its frozen honest-null bound.
    - >-
      The candidate is not distributed as a valid binary-Goppa public code
      under the frozen interface, or obtains its effect through an arbitrary
      subliminal payload rather than either declared algebraic lane.
  non_terminal_conditions:
    - >-
      Underpowered samples, a timeout, a symbolic-algebra crash, inability to
      enumerate an automorphism group, or exhaustion of a search budget are
      inconclusive or infrastructure outcomes. They are never evidence that a
      candidate is hidden, impossible, secure, or insecure.
    - >-
      Failure to find a candidate within six batches closes only the explored
      mechanisms and toy grid. It cannot establish that a McEliece master
      trapdoor does not exist.
  completion_criteria:
    - >-
      A reviewed formal specification fixes HonestGen, TrapGen,
      MasterRecover, the dual-representation equivalence relation, the
      quadratic/syzygetic objects, the deliberately toy parameter grid, the
      statistical acceptance rule and the scope gate before confirmatory runs.
    - >-
      Both candidate lanes reach a success-bearing registered disposition: a
      functional toy object meeting the constructive criteria, a replicated
      defensive detector/public recovery, or a named structural obstruction
      with forward guidance. An inconclusive lane leaves the goal paused or
      closed_at_budget and cannot satisfy this criterion. At least the planted
      positive controls and honest-versus-honest null are executed for every
      metric used in a conclusion.
    - >-
      Every functional candidate is compared against honest Goppa keys on
      matched nested cohorts using Schur square/cube dimensions, automorphism
      statistics, quadratic-relation-space ranks and syzygy/Hilbert/Betti
      invariants, with raw per-key features, tau grouping, seeds, effect sizes,
      confidence intervals, multiplicity handling, achieved power and holdout
      results retained. If a named obstruction occurs before a candidate can
      exist, non-applicability is documented and the feature pipeline is still
      calibrated on its honest null and planted positive controls.
    - >-
      Independent Validator and Red Team sessions admit the functional
      certificates, distribution comparison, public-recovery attempt, safety
      boundary and exact claim language, explicitly checking that non-detection
      was not promoted to indistinguishability.
    - >-
      Coordinator evidence, decision and any warranted defensive knowledge
      entry are committed through a verified ledger archive, with constructive
      artifacts labeled TOY-ONLY / DO-NOT-DEPLOY and every conclusion scoped to
      the exact lane, toy cells and detector battery tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Primary sources needed to define the quadratic-relation space, syzygy
      module or Goppa-equivalence quotient cannot be obtained after the
      declared source route is exhausted. This blocks design; it is not
      evidence against either lane.
    - >-
      The symbolic algebra or exact automorphism computations exceed the
      declared toy budget after the smoke grid and cheaper falsification gates
      are exhausted.
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    OPEN WITH ONE SOURCE-AND-SPECIFICATION BATCH, NOT CONSTRUCTION. Acquire and
    file the primary binary-Goppa equivalence, quadratic-relation and syzygy-
    distinguisher sources; reconcile their exact algebraic objects with the
    existing unverified McEliece map under RQ-MCE-e65b3c; and freeze the
    interfaces, equivalence quotient, toy grid, control matrix, work metric,
    statistical power, success/failure thresholds and machine-checkable safety
    gate described in Stage S0. The first review must specifically reject any
    standards-compatible serialization, live or third-party input path,
    subliminal channel, production key-generator integration, or claim that a
    finite toy non-detection result implies indistinguishability. Only after
    that review may a later handoff implement HonestGen and the planted
    controls. Claim tier remains toy under every outcome.
