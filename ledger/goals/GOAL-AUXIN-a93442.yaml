  completion_criteria:
    - >-
      The divisor census is complete for a declared, frozen list of standardized
      curve orders: r-1 and r+1 fully factored (or factored to a stated bound
      with the unfactored cofactor reported as such, never silently), each
      factorization independently recomputed by the run wrapper, and the best
      achievable exponent min over admissible d of the Cheon cost tabulated per
      curve against the sqrt(r) rho baseline at identical accounting.
    - >-
      The protocol supply audit is complete for a declared list of deployed
      instantiations: for each, the number and form of released auxiliary powers,
      cited to the specification, with instantiations whose parameters are not
      publicly pinned reported as UNDETERMINED rather than guessed.
    - >-
      A joined verdict table with one row per (curve, protocol) pair, each cell
      either a stated reachable exponent with its certificate, or an explicit
      not_applicable with the reason. Cells that are inert because of (1) are
      distinguished from cells that are inert because of (2).
    - >-
      Either the mechanism reproduction passes its planted-divisor positive
      control AND its no-divisor null control at toy scale, or the goal records
      why it could not be run and claims nothing about the mechanism.
  pause_conditions:
    - >-
      The Cheon primary sources cannot be filed as KN-LIT records. Everything
      beyond the pure-arithmetic divisor census is gated on them; the census
      itself depends on no citation, only on the algorithm's stated cost, which
      is already filed as prior art by DEC-20260802-208.
    - >-
      Any record under this goal states or implies an ordinary-ECDLP
      improvement. Pause and supersede: DEC-20260802-204's acquisition gate is
      binding and this goal is scoped to protocol-supplied inputs only.
    - >-
      The divisor census returns a hit near sqrt(r) on a deployed curve. That is
      a stop-and-escalate condition, not a proceed condition: it goes to
      independent validation and red team BEFORE any further work, because a
      surprising positive on standardized parameters is exactly the class of
      claim this program is least entitled to make quickly.
