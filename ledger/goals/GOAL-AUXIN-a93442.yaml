  provenance_note: >-
    Opened from the 2026-08-31 external coverage-gap report (see
    research_goals_20260831_coverage_gap_batch.md). That report ranked Cheon
    auxiliary-input DLP third of five and called it ABSENT from this program.
    The "absent" characterization is WRONG and is corrected in the batch
    document: DEC-20260802-204, -206 and -208 already classify the algorithm as
    known prior art and record the acquisition gate that closes the
    ordinary-ECDLP route. What the report got right is narrower and still worth
    a goal: no goal, question, hypothesis or experiment covers the
    protocol-supplied case, and the deployed-parameter divisor census has never
    been computed. This goal is scoped to that residue, not to the report's
    claim.
