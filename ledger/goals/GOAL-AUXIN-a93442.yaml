research_goal:
  id: GOAL-AUXIN-a93442
  title: >-
    Auxiliary-input discrete logarithm at deployed parameters: the exact divisor
    census of r±1, and the protocol audit of which powers are actually released
  objective: >-
    Decide, with certificates rather than opinion, whether Cheon-type
    auxiliary-input discrete logarithm reaches anything at deployed parameters.
    The campaign separates two questions this program has so far only met fused
    together, and answers the cheap one first.

    (1) THE ARITHMETIC QUESTION, exact and finite. Cheon's algorithm runs in
    O(sqrt((r-1)/d) + sqrt(d)) when d divides r-1 (and a variant for d dividing
    r+1). Its benefit is entirely controlled by which divisors r±1 actually
    has. For every standardized curve order this is a FINITE INTEGER
    FACTORIZATION with a checkable certificate and no heuristic anywhere. It has
    a definite answer that nobody in this program has computed, it costs
    approximately nothing, and it is decisive in both directions: if the
    standardized orders carry no divisor near sqrt(r), the whole attack class is
    inert at deployed parameters regardless of any protocol, and the lane closes
    on a certificate.

    (2) THE SUPPLY QUESTION, an audit. Cheon needs [x^d]P. DEC-20260802-204
    established that ordinary ECDLP input does not supply it below rho-scale
    work, which is exactly why the ordinary route was closed. But q-SDH,
    Boneh-Boyen signatures and several pairing and threshold constructions
    PUBLISH the powers as part of their public parameters. For each such
    deployed instantiation the audit records how many powers are released, of
    what form, and whether the released set meets what (1) says would be needed.

    The goal is scoped so that the two questions cannot contaminate each other.
    (1) is arithmetic about integers and is reported as such. (2) is a reading of
    protocol specifications and is reported as such. A vulnerability claim would
    require both plus a certified recovery, and this goal does not assume it will
    get one.
