research_goal:
  id: GOAL-HQC-001
  title: "HQC: is the decoding-failure-rate model that carries IND-CCA correct under measurement?"
  objective: >-
    Attack HQC's one measurable load-bearing claim: independently
    re-derive its analytic decoding-failure-rate model, measure actual
    failure rates at reduced parameters where failures are observable,
    determine how far the model can be wrong before the IND-CCA argument
    and its chosen-ciphertext consequences change, and separately build
    the memory-charged ISD baseline at its selected parameters — all
    before the standard is published.
  question_ids: [RQ-HQC-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-SDITH-001]
  scheme_context:
    scheme: "HQC"
    family: "code-based KEM (quasi-cyclic Hamming, concatenated Reed-Muller / Reed-Solomon decoder)"
    nist_track: selected_algorithm
    standardization_status: >-
      Selected 2025 as the code-based backup KEM alongside ML-KEM; the
      standard is not yet published as of this record. Like FN-DSA, it
      has a live pre-standardization window.
  completion_criteria:
    - >-
      A measured decoding-failure-rate curve at reduced parameters
      compared against the independently re-derived analytic model, with
      the discrepancy (in either direction) reported and its
      extrapolation to the selected parameters stated conditionally on
      numbered heuristics; plus a memory-charged ISD baseline at those
      parameters.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the HQC specification nor the primary DFR-analysis
      literature can be obtained under the network policy after the
      declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-HQC-001. Coordinate the ISD baseline with
    GOAL-SDITH-001 so the two code-based goals do not derive two
    different memory-charging conventions. The DFR measurement is the
    distinctive lane and should be scoped first.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
