research_goal:
  id: GOAL-HQC-001
  title: "HQC: is the decoding-failure-rate model that carries IND-CCA correct under measurement?"
  objective: >-
    Attack HQC's one measurable load-bearing claim: independently
    re-derive its analytic decoding-failure-rate model, measure actual
    failure rates at reduced parameters where failures are observable,
    determine how far the model can be wrong before the IND-CCA argument
    and its chosen-ciphertext consequences change, and separately build
    the memory-charged ISD baseline at its selected parameters — all
    before the standard is published.
  question_ids: [RQ-HQC-001]
  active_hypothesis_ids: []
  status: active
  status_value_history:
    - value: draft
      in_force_until: '2026-08-02'
      note: >-
        Opened 2026-07-29 as draft and never launched. Activated 2026-08-02 by
        the BATCH-001 opening archive, on the user's explicit direction this
        session to launch a goal targeting HQC. GOAL-HQC-001 is the only goal
        record whose scheme_context.scheme is HQC, so the selection was
        unambiguous. This is a USER AUTHORIZATION RECORDED BY THE COORDINATOR
        and not a self-grant. No completion criterion is met or approached by
        activation, no hypothesis exists (active_hypothesis_ids stays empty),
        and no claim tier moves — the toy ceiling declared by RQ-HQC-001
        stands.
