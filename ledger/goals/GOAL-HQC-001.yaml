research_goal:
  id: GOAL-HQC-001
  title: 'HQC: is the decoding-failure-rate model that carries IND-CCA correct under measurement?'
  objective: 'Attack HQC''s one measurable load-bearing claim: independently re-derive its analytic decoding-failure-rate
    model, measure actual failure rates at reduced parameters where failures are observable, determine
    how far the model can be wrong before the IND-CCA argument and its chosen-ciphertext consequences
    change, and separately build the memory-charged ISD baseline at its selected parameters — all before
    the standard is published.'
