research_goal:
  id: GOAL-HQC-001
  title: "HQC: is the decoding-failure-rate model that carries IND-CCA correct under measurement?"
  objective: >-
    Attack HQC's one measurable load-bearing claim: independently
    re-derive its analytic decoding-failure-rate model, measure actual
    failure rates at reduced parameters where failures are observable,
    determine how far the model can be wrong before the IND-CCA argument
    and its chosen-ciphertext consequences change, and separately build
    the memory-charged ISD baseline at its selected parameters — all
    before the standard is published.
  question_ids: [RQ-HQC-001]
  active_hypothesis_ids: []
  status: active
  status_value_history:
    - value: draft
      in_force_until: '2026-08-02'
      note: >-
        Opened 2026-07-29 as draft and never launched. Activated 2026-08-02 by
        the BATCH-001 opening archive, on the user's explicit direction this
        session to launch a goal targeting HQC. GOAL-HQC-001 is the only goal
        record whose scheme_context.scheme is HQC, so the selection was
        unambiguous. This is a USER AUTHORIZATION RECORDED BY THE COORDINATOR
        and not a self-grant. No completion criterion is met or approached by
        activation, no hypothesis exists (active_hypothesis_ids stays empty),
        and no claim tier moves — the toy ceiling declared by RQ-HQC-001
        stands.
  runtime:
    provider: none
    goal_id: null
    runtime_note: >-
      No durable goal API is available under this harness. The ledger record IS
      the persistent goal. Recorded explicitly rather than left implicit, per
      /coordinate-research-goal step 4.
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-001
  dispatch_queue_path: coordination/goals/GOAL-HQC-001/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: null
  related_goals: [GOAL-SDITH-001]
  scheme_context:
    scheme: "HQC"
    family: "code-based KEM (quasi-cyclic Hamming, concatenated Reed-Muller / Reed-Solomon decoder)"
    nist_track: selected_algorithm
    standardization_status: >-
      Selected 2025 as the code-based backup KEM alongside ML-KEM; the
      standard is not yet published as of this record. Like FN-DSA, it
      has a live pre-standardization window.
  completion_criteria:
    - >-
      A measured decoding-failure-rate curve at reduced parameters
      compared against the independently re-derived analytic model, with
      the discrepancy (in either direction) reported and its
      extrapolation to the selected parameters stated conditionally on
      numbered heuristics; plus a memory-charged ISD baseline at those
      parameters.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the HQC specification nor the primary DFR-analysis
      literature can be obtained under the network policy after the
      declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action_history:
    - recorded_at: '2026-07-29'
      superseded_at: '2026-08-02'
      text: >-
        Run /propose-ideas RQ-HQC-001. Coordinate the ISD baseline with
        GOAL-SDITH-001 so the two code-based goals do not derive two
        different memory-charging conventions. The DFR measurement is the
        distinctive lane and should be scoped first.
      superseded_because: >-
        PARTLY DISCHARGED AND PARTLY BLOCKED, established by the pre-dispatch
        census in BATCH-001-OPENING.md sections 3 and 4. (1) The ideation
        instruction is already partly discharged: ledger/proposals/
        IDEA-20260801-011.yaml exists, is bound to question_id RQ-HQC-001, and
        is exactly the DFR-measurement proposal this text calls "the
        distinctive lane". It was filed 2026-08-01, three days after this goal
        record was written, and this next_action was never updated to cite it.
        (2) That proposal is not executable as specified: its minimal_test
        compares measured failure counts against "the model" and its controls
        require recomputing the model's prediction independently, but no
        primary statement of HQC's analytic DFR model has ever been read by
        this program — the corpus census in section 3 finds six HQC-touching
        KN-LIT records and no specification among them. Re-running ideation
        before the model is in hand would generate further proposals carrying
        the same unmet dependency. (3) The second clause — coordinate the ISD
        baseline with GOAL-SDITH-001 — is NOT superseded and is carried
        forward: it is dispatched as TASK-20260802-0100a5 in BATCH-001.
        THE DISPOSITION OF (1) AND (2) IS CONTESTED ON PURPOSE. The red team
        task TASK-20260802-73a352 is directed to challenge both halves against
        the actual records, because the equivalent Coordinator claim in
        GOAL-HAWK-001 BATCH-001 was itself found to be an overread by that
        batch's red team. The formal disposition is therefore deferred to the
        BATCH-001 ledger archive, which will have that challenge in hand.
  next_action: >-
    EXACTLY ONE NEXT ACTION: run BATCH-001 to completion —
    coordination/goals/GOAL-HQC-001/batches/BATCH-001/dispatch_queue.json.
    Two producers with disjoint write scopes: TASK-20260802-6344ed acquires
    the HQC specification and the primary DFR-analysis literature and
    transcribes the analytic DFR model verbatim with numbered assumptions;
    TASK-20260802-0100a5 derives the memory-charged ISD costing convention
    that this goal and GOAL-SDITH-001 must both bind to, scheme-independently
    and with no parameter numbers. Then snapshot (TASK-20260802-a3dc0a),
    independent validation (TASK-20260802-b8d69f) and red team
    (TASK-20260802-73a352), then the ledger archive TASK-20260802-a157ad
    writing EV-HQC-9906b9 and DEC-20260802-344883. DO NOT run /propose-ideas:
    RQ-HQC-001.constraints forbids designing an experiment before the primary
    sources are filed as KN-LIT entries, and IDEA-20260801-011 already exists
    and already lacks the model it would be tested against. Claim-tier ceiling
    stays toy. Nothing in BATCH-001 is admissible toward the AGENTS.md rule 13
    closure quorum: the reviews are independent sessions on ONE model, because
    no policy alias in orchestration/model-policies.yaml resolves under this
    Claude Code harness.
