  completion_criteria:
    criteria_note: C1-C3 are the ANSWER criteria and EVERY ONE IS SATISFIED BY A NEGATIVE -- not by a
      negative result being redefined as success, but because each asks for a BOUND or an ADJUDICATION,
      and a bound of zero is a bound. C4-C5 are procedural and, per the DEC-20260803-64b55b and DEC-20260805-0b3e11
      precedent, CANNOT carry a completion on their own.
    items:
    - C1 THE BOUND. A stated numeric bound, with derivation, on the dbeta -- and its core-SVP bit value
      under one NAMED cost model -- attainable by best-of-M selection at the M established in C2. "The
      attainable reduction is <= X bits, of which Y bits are model assumption, and X may be 0" satisfies
      this in full. Any figure depending on BKZ-profile curvature f'' must print an f'' sensitivity table
      beside it and be labelled a model readout, not a measurement.
    - C2 THE CENSUS. A census of M -- ciphertexts decapsulable under one encapsulation key -- across standardised
      and deployed ML-KEM uses, reported as a DISTRIBUTION with the ephemeral (M = 1) share stated in
      the same sentence as any maximum, each row carrying specification, section, bounding mechanism and
      retrieval date. SATISFIED BY "M = 1 in every standardised mode we could source", which is the cheapest
      and most likely outcome.
    - 'C3 THE MEASUREMENT. The projected-error left-tail measurement with its pre-registered prediction
      adjudicated to one of three declared branches: the Beta tail law holds at the measured cells; it
      fails by a measured factor; or NEITHER, with the sensitivity demonstration''s failure recorded as
      an INSTRUMENT outcome. AGREEMENT SATISFIES C3 AS FULLY AS DEPARTURE. Reporting only E[R] does NOT
      satisfy C3: E[R] = beta/d is forced for every basis, reduced or not.'
    - C4 Independent Validator and Red Team sessions admit the run package, checking the forced-value
      derivations as first-class artifacts and not merely the arithmetic.
    - C5 Coordinator evidence, decision and any warranted knowledge entry committed through a verified
      ledger archive.
    stop_rule: 'The goal MUST close as `completed` as soon as C1-C3 are met, even with work remaining.
      A campaign that has its answer and keeps spending is a budget failure, not diligence. This is the
      complement of the unbounded budget: the campaign cannot end from exhaustion or fatigue, and MUST
      end once it has answered. Note the closure quorum is SUSPENDED (CLAUDE.md rule 8), so closure needs
      only a committed Coordinator decision naming which criterion was met and citing the evidence --
      no attestation may be recorded that was not obtained.'
  pause_conditions:
  - INFRASTRUCTURE ONLY. An archive that will not verify against its declared commit, paths and hashes
