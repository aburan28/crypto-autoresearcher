    READINGS LEFT VISIBLE; the branch, its licence and every item on its FORBIDS list are
    adopted unamended, and the frozen text is not edited.
    THREE CONVERGENT FINDINGS, REACHED INDEPENDENTLY. (1) THE FAILURE IS A FLOAT-REPRESENTATION
    EFFECT: `rdet`'s float32/float64 fibre-dispersion ratio is 1.40e6 to 5.91e8 against an eps
    ratio of 5.369e8, while the real object X_gso_k is PRECISION-INVARIANT at 0.9999991 to
    1.0000001; under exact integer arithmetic (route R6_exact) G-VAR2 REFUSES `rdet` at 38/38
    and F0's target IS MET; and the admission is THRESHOLD-INDEPENDENT across sixteen decades of
    tau_var, because bit-identity at a scale_degenerate cell has no threshold at all. (2) THE
    DEFECT BELONGS TO THE CLAUSE, NOT TO `rdet`: the Validator's own blind null N2,
    log|det B|/(d*k), which no producer scored, reproduces the admission exactly. (3) THE
    DECLARED ARGUMENT SET IS DECORATIVE IN THE IMPLEMENTATION -- Validator F-2 and Red Team O-1
    found the same gap separately, PREREG-1 2.4 declaring A[0,0] a fibre nuisance while no fibre
