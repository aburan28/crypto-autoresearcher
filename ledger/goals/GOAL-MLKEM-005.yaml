    tours against 26, two different b0 values at the same seed). Red Team
    TASK-20260826-5ee48b: J4, J5, J6 all `breaks` UNDER AN EXPLICIT POLARITY
    WARNING that `breaks` attacks the INFERENCE from a green d=64 board to d=512
    readiness and NOT the board, which it adjudicates as six correctly reported
    PASSes; residuals R1-R5, the strongest being F1, THAT NOTHING IS JOURNALLED
    BETWEEN THE STARTED STUB AND THE FIRST `tour_start` -- a window of 0.000378 s
    at d=64 and of at least 498.9597418308258 s at d=512 by this goal's own
    committed measurement, in which a killed cell flushes `tours: 0` with elapsed
    frozen near zero, i.e. a CONFIDENTLY WRONG machine-readable record rather
    than an empty one.
    THE BLIND RE-DERIVATION SUCCEEDED. On a Coordinator-chosen cell the producer
    never ran -- d=64, beta=25, mpfr_bits=53, seed 613149553 -- the Validator
    independently derived 13 TOURS and b0 = 130.15375522819156 from a
