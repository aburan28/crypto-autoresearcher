    BOTH REVIEWS CONFIRM IT. G-VAR2 fails fixture F0 -- the fixture AM-16(d) was written
    against -- because `rdet`, WHICH READS ZERO ENTRIES OF A, is ADMITTED at 38 of 38 cells
    through routes R2, R4 and R5, while X_null is correctly REFUSED at 38/38 on all six. IT IS
    NOT REACHED THROUGH THE fpylll GAP: it lives in the reduction-free determinant-only half at
    full 38/38 coverage, which PREREG-1 7.4 itself declares fully scorable on any host and
    binding regardless. The Validator re-derived it FROM THE FROZEN TEXT with no producer
    import -- 1368 of 1368 per-cell values BIT-IDENTICAL and 1368 of 1368 verdicts agreeing,
