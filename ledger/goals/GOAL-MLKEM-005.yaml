research_goal:
  id: GOAL-MLKEM-005
  title: >-
    ML-KEM mechanism search: find and conclusively assess an algorithmic
    mechanism that materially improves cryptanalysis of FIPS 203, or establish
    with measurement why the searched lanes cannot
  objective: >-
    Serve RQ-MLKEM-001 -- can an algorithmic mechanism materially improve
    cryptanalysis of standardized ML-KEM -- which two prior campaigns and
    eighteen batches never served. GOAL-MLKEM-003 and GOAL-MLKEM-004 both bound
    themselves to RQ-MLKEM-003 (how much of the margin is model rather than
    measurement) and therefore spent their entire budgets validating and
    measuring cost models other people proposed. Neither ever asked for a
    mechanism. This goal asks for one, and assesses each candidate to a standard
    that produces an answer whichever way it falls.
  question_ids:
    - RQ-MLKEM-001
  active_hypothesis_ids: []
  status: active

  runtime:
    provider: none
    goal_id: null

  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 3
    budget_note: >-
      DELIBERATELY UNBOUNDED, at the user's explicit instruction, and this is the
      substantive design decision of the record. `closed_at_budget` asserts that
      the budget ran out WITHOUT a completion criterion being met
      (tools/validate_ledger.py line 809). With no maximum_batches and no wall
      clock, that status CANNOT FIRE for this goal. Both predecessor campaigns
      ended at exactly that exit -- GOAL-MLKEM-003 after 12 batches,
      GOAL-MLKEM-004 after 6 -- and neither ended because the science was
      finished. That exit is removed here. Five other active goals in this
      portfolio already run unbounded (GOAL-AES-003, ICEX-001, P13-001,
      SDEG-001, SIG-001), so this is an established pattern the validator
      accepts, not a novel mechanism. A budget may only be reimposed by a
      committed Coordinator decision recording who asked for it and why.

  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null

  completion_criteria:
    - >-
      C1 SCREEN BEFORE MEASUREMENT. A candidate mechanism is specified precisely
      enough to measure, and its FORCED-QUANTITY SCREEN is archived BEFORE any
      measurement of it is taken: a derivation of what the proposed statistic
      must yield under the null hypothesis that is NOT being tested, answering
      whether the sign is guaranteed a priori, whether the magnitude is a closed
      form in quantities available without running the experiment, and whether
      an object with the lattice, the modulus and the sieve deleted would
      reproduce it. This criterion exists because six consecutive observables in
      GOAL-MLKEM-004 were forced by construction and every one was discovered
      only after it had been measured and replicated.
    - >-
      C2 CONCLUSIVE MEASUREMENT. That mechanism is measured at the largest scale
      this harness reaches, with a null object of the right shape -- the object
      removed NAMED, the statistic NAMED, and the statistic's sensitivity to
      that object DEMONSTRATED (KN-TECH-1a5b7e) -- reporting effect size and
      direction IN WHICHEVER DIRECTION THEY FALL, with per-group error bars and
      replication across independent instances. Met by a conclusive assessment,
      not by a positive finding: a mechanism measured to this standard and shown
      not to work satisfies C2 exactly as one shown to work does. A mechanism
      merely screened out under C1 does NOT satisfy C2 -- screening is not
      measuring, and a campaign that only ever screens has not met this.
    - >-
      C3 SCOPED, WITH THE EXTRAPOLATION NAMED. The result is scoped to the exact
      dimensions, modulus, distributions and instrument actually used, with an
      explicit numbered heuristic stating what would have to hold to carry it to
      FIPS 203 dimensions -- or a statement that it cannot be carried, and why.
      No toy-scale result is presented as a crypto-scale claim.
    - >-
      C4 Independent Validator and Red Team sessions admit the package, checking
      the C1 screen as a first-class artifact and not merely the arithmetic.
    - >-
      C5 Coordinator evidence, decision and any warranted knowledge entry
      committed through a verified ledger archive.

  pause_conditions:
    - >-
      INFRASTRUCTURE ONLY. An archive that will not verify against its declared
      commit, paths and hashes after a good-faith repair attempt.
    - >-
      INFRASTRUCTURE ONLY. The repository cannot be pushed, so work cannot be
      made durable or reviewable.
    - >-
      INFRASTRUCTURE ONLY. A required review policy with `degradable: false`
      (notably `review-breakthrough`) has no resolvable backend, so a
      claim-changing result cannot be independently reviewed without a silent
      downgrade. Refusing the downgrade is mandatory; pausing is the consequence.
    - >-
      The user asks for a pause.

  non_terminal_conditions:
    note: >-
      RECORDED EXPLICITLY SO IT BINDS A LATER COORDINATOR, INCLUDING A LATER
      SESSION OF ME. None of the following closes, pauses or completes this
      goal, and none of them may be cited in a decision that does.
    conditions:
      - A candidate mechanism is refuted.
      - >-
        MANY candidate mechanisms are refuted. GOAL-MLKEM-004 refuted six in a
        row; that was a budget exhaustion dressed as a conclusion, and it is not
        one here.
      - A measurement returns a negative result, or no effect.
      - >-
        A lane is closed with a named obstruction. Closing a lane is a real
        output and it retires the LANE, never the goal, while other lanes and
        RQ-MLKEM-001 remain open.
      - The ready set is empty this batch.
      - A task fails, times out, or hits a provider limit.
      - No promising idea presents itself this batch.
      - >-
        The Coordinator judges the problem hard, saturated, or unlikely to
        yield. Premature closure is a failure mode symmetric with overclaiming
        (docs/inventor-protocol.md), and fatigue is not evidence.
    when_the_ready_set_is_empty: >-
      Follow /coordinate-research-goal: run the recorded next_action; failing
      that dispatch the highest-ranked open hypothesis; failing that dispatch a
      replication or control for the weakest-supported live claim; failing that
      run /propose-ideas on RQ-MLKEM-001 to refill the pool. Only if none of
      those yields a task rankable ahead of doing nothing is there anything to
      report, and the report is a finding about the portfolio, not a closure of
      this goal.

  inherited_constraints:
    - >-
      THE ALGEBRA IS CLOSED at about 17 bits. Every algebraically derived
      instance -- ring multiplication, Galois twist, CRT projection, module
      re-basing -- is a Z_q-linear function of the original samples with the
      error the same function of the original error, so the posterior on s is
      unchanged and all structure gains are work-reuse gains bounded by the
      isometry count 2n*phi(2n) = 2^17. Do not re-propose algebraic structure
      attacks. If there is an exponent, it is in the GEOMETRY, the DEPLOYMENT,
      or the FAILURES.
    - >-
      Rule 12 is UNMET and UNWAIVED, inherited. Two knowledge promotions remain
      owed from GOAL-MLKEM-003 and cannot be executed without a second backend.
    - >-
      PD-4 is open: the harness requires review artifacts to sit uncommitted
      across a dispatch window, which destroyed two reviews in GOAL-MLKEM-004.
      The fix is a tools/research_dispatch.py change verifying an
      already-committed source by hash.
    - >-
      Independence has been procedural, never model-level: every producer and
      reviewer across eighteen batches resolved to the same model. Record it in
      every batch rather than letting it pass as independence.

  next_action: >-
    OPEN BATCH-001. Its producing task is the C1 FORCED-QUANTITY SCREEN, run
    and archived BEFORE any measurement, on the top-ranked candidate from the
    five-lane screening workflow now in flight (lanes: deployment, decryption
    failures, geometry/gauge, RQ-MLKEM-002, and a third route to the cost-model
    question). The screen is the batch's deliverable in its own right: a
    candidate that fails it is retired at zero measurement cost, which is the
    entire lesson of the eighteen batches that preceded this goal. Only a
    candidate that survives C1 is measured, and it is measured in BATCH-002.

  owner: coordinator
  created_at: '2026-08-05'
  updated_at: '2026-08-05'
  batch_log: []
