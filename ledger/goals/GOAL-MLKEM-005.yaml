  inherited_constraints:
  - THE ALGEBRA IS CLOSED at about 17 bits. Every algebraically derived instance -- ring multiplication,
    Galois twist, CRT projection, module re-basing -- is a Z_q-linear function of the original samples
    with the error the same function of the original error, so the posterior on s is unchanged and all
    structure gains are work-reuse gains bounded by the isometry count 2n*phi(2n) = 2^17. Do not re-propose
    algebraic structure attacks. If there is an exponent, it is in the GEOMETRY, the DEPLOYMENT, or the
    FAILURES.
  - Rule 12 is UNMET and UNWAIVED, inherited. Two knowledge promotions remain owed from GOAL-MLKEM-003
    and cannot be executed without a second backend.
  - 'PD-4 is open: the harness requires review artifacts to sit uncommitted across a dispatch window,
    which destroyed two reviews in GOAL-MLKEM-004. The fix is a tools/research_dispatch.py change verifying
    an already-committed source by hash.'
  - 'Independence has been procedural, never model-level: every producer and reviewer across eighteen
    batches resolved to the same model. Record it in every batch rather than letting it pass as independence.'
