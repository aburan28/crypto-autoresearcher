research_goal:
  id: GOAL-MLKEM-005
  title: 'ML-KEM mechanism search: find and conclusively assess an algorithmic mechanism that materially
    improves cryptanalysis of FIPS 203, or establish with measurement why the searched lanes cannot'
  objective: 'Serve RQ-MLKEM-001, which two prior campaigns and eighteen batches never served: both bound
    themselves to RQ-MLKEM-003 and spent their budgets validating cost models other people proposed, so
    neither ever asked for a mechanism. Concretely: determine how much block-size reduction, if any, best-of-M
    ciphertext selection against a single shared BKZ-reduced basis can deliver against ML-KEM AS STANDARDISED
    -- by sourcing the one free parameter M from published FIPS 203 deployment specifications, and by
    measuring on real BKZ-reduced q-ary bases with real CBD errors whether the left tail of the projected-error-norm
    statistic the mechanism consumes obeys the Beta law the argument assumes. Tracked object: the pair
    (shared BKZ-beta-reduced basis of a q-ary lattice; the per-target ratio R = ||pi_{d-beta}(e)||^2 /
    ||e||^2 of a CBD error vector).'
  ceiling_known_in_advance: 'THIS CAMPAIGN CANNOT MOVE AN EXPONENT, and that is provable rather than pessimistic.
    The gain obeys dbeta/beta ~ 0.29*sqrt((1-rho)*ln M / beta), so an exponent needs ln M = Theta(beta),
    i.e. roughly 2^Theta(600) ciphertexts under one key. And G <= log2 M holds UNCONDITIONALLY by convexity
    of f(beta) = -log2 p(beta): the single-target optimiser sets f''(beta_1) = -0.292, so log2 M = f(beta_M)
    >= f(beta_1) + f''(beta_1)(beta_M - beta_1) = G. The ceiling is a constant, and the constant is capped
    by a number that published deployment specifications -- not mathematics -- determine. Stated here
    so no batch can rediscover it as a finding.'
  question_ids:
  - RQ-MLKEM-001
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
