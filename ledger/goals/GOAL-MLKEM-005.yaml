    scope: >-
      AM-1's grid, AM-3's gate and its 0.096 bound, AM-4's transform triple, AM-5, AM-6, AM-7, AM-8's
      pre-registration escalation and AM-9's k convention are ALL RETAINED. What is amended is the
      SPECIFICATION OF THE CRITERIA AND CONTROLS they are implemented with. AM-10: a relevance or
      sensitivity criterion must be replicated over all frozen bases with mean, sd and a paired test,
      reported at BOTH normalizations with s_X/|X| printed, and must carry a candidate that MUST PASS
      it. AM-11: add G-VAR -- an admissible observable must have non-zero dispersion across the frozen
      bases at fixed (d,k,beta,q); a gate that admits a parameter-determined observable is INADMISSIBLE,
      and tr(P^2) cannot serve as that control because it is q- and k-independent. AM-12: a refutation
      clause triggers on ANY candidate above its OWN floor, a clause whose trigger list holds only
      algebraically-true candidates is dead by construction and may not be declared a guard, and a
      conditional exclusion must carry the row for the branch where its condition fails. AM-13: every
      headline count is quoted against the same count on a null object of the same shape and must DECAY
      as the effect is destroyed; two injections of one family are not a null object; a prediction whose
      falsifier is empty given a bit-exact reproduction is a CONSISTENCY CHECK, not a prediction.
      AM-14: a section must declare which clause is load-bearing and verify the verdict is not invariant
      to the quantity under repair; a positive control must actually inject and re-run the scoring path;
      a relative floor must be re-derived from the REBUILT null; the SUGGESTIVE band records any pair
      inside 0.8*|t|crit regardless of the floor; SE_2way/SE_naive is reported at every target; a
      NEGATIVE-VARIANCE-COMPONENT target may not carry a family bound without its flag. Binding carries:
      durable command.txt/stdout.log/stderr.log per run with no paths in folded YAML scalars; a q = 1
      rung under this construction compares against Z^d and must say so; a Gram-matrix pipeline cannot
      test ambient isometry and must report it as untested. Nothing else in DEC-20260806-607779,
      DEC-20260806-14ac13, DEC-20260806-00deff or DEC-20260805-4823db is disturbed.
