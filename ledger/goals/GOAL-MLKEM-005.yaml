    does not fire; the guard crossed at 38/38 on every route.
    THE MEANS CLAUSE IS WRITTEN ABOUT THE CONJUNCTION, AND THAT IS THE DECISION'S HARDEST CALL.
    PREREG-1 7.3 says T-F0FAIL means "AM-16(a) itself needs replacing". AM-16(a) IS VAR-S, and
    VAR-S DECIDED NO FAILING CELL: `rdet` is scale_degenerate at 38/38 under all six routes, so
    3.2's degenerate-scale rule routed every one of them to VAR-F alone and 3.3's BIT-IDENTITY
    FALLBACK decided all of them. Under a strict reading of route RD, AM-16(a) has ZERO misses
    in this batch; under the lead's reduction-free reading it has exactly one, rawtail at L4
    beta 95, which the Validator measured to be created by the calibration. THE FROZEN CLAUSE'S
