    criteria_note: C1-C3 are the ANSWER criteria and EVERY ONE IS SATISFIED BY A NEGATIVE -- not by a
      negative result being redefined as success, but because each asks for a BOUND or an ADJUDICATION,
      and a bound of zero is a bound. C4-C5 are procedural and, per the DEC-20260803-64b55b and DEC-20260805-0b3e11
      precedent, CANNOT carry a completion on their own.
    items:
