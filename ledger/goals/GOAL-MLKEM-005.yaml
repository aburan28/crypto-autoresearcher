    summary: >-
      THREE CONTROLS WERE FOUND DEFECTIVE AND THE BATCH'S THREE HEADLINE RESULTS DO NOT SURVIVE REVIEW IN
      THE FORM THEY WERE STATED -- and that is a real outcome, not a failed batch. The question five
      records across four batches deferred is ANSWERED, smaller and firmer than the headline: the tail
      GSO window of the unreduced q-ary presentation lies in the identity block with boundary beta <= k
      and never beta <= d-k, verdict NEITHER in all four cells, the E_I arm falsifying M-D at 36 of 36
