    the pre-executor Coordinator prior and the pre-Validator blind answer -- and
    scores the prior against the outcome INCLUDING ONE OUTRIGHT MISS IN IT (the
    prior predicted the loop-equivalence control would reproduce 26 tours at
    d=64; it is 9, and the 26 belongs to a differently-constructed probe).
    THE FINDING THAT REACHES THE NEXT RUN: v2's stated warrant for its tour count
    -- that upstream opens one `tour` context around each `self.tour(...)` call
    and around nothing else -- IS FALSE FROM BLOCK SIZE 46 UP, because bkz2's
    `svp_preprocessing` calls `self.tour` recursively per
    `preprocessing_block_sizes` entry with no context opened. MEASURED at d=64,
    beta=46: 13 loop iterations against 260 tour calls, a 20x divergence. THE
    COUNT IS UNAFFECTED AND CORRECT -- v2 counts loop iterations -- and only the
    stated WARRANT fails, which is what a successor inherits. In the pinned
    strategies file `preprocessing_block_sizes` is EMPTY for block sizes 0..45
    and `[36]` AT BLOCK SIZE 55, WHICH IS THIS GOAL'S PINNED d=512 CELL, so NO
    TEST THIS BATCH COULD HAVE RUN WOULD HAVE CAUGHT IT and the next run is
    exactly where it bites. That [36] entry is independently corroborated by
    EV-MLKEM-59e4a4, a prior committed record from a different batch and review.
    WHAT ELSE HOLDS, so this summary is not one-sided: ten real subprocess kill
    scenarios (SIGTERM, SIGINT, SIGKILL, double-signal, a 30-signal storm against
    a 1 ms heartbeat, a startup race, the instrument's own SIGALRM timeout, a
