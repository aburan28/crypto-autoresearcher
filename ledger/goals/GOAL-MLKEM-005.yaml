    which destroyed two reviews in GOAL-MLKEM-004. The fix is a tools/research_dispatch.py change verifying
    an already-committed source by hash.'
  - 'Independence has been procedural, never model-level: every producer and reviewer across eighteen
    batches resolved to the same model. Record it in every batch rather than letting it pass as independence.'
  next_action: 'BATCH-436ddd CLOSED by DEC-20260806-8c33bf / EV-MLKEM-94f036 (decision: REFINE). THIS
    IS NOT A NULL BATCH and must not be retired as one -- citing "C3 unmet" to pause would invoke non-terminal
    conditions this record bars by name. WHAT B2-A ACHIEVED: the sensitivity demonstration is now REAL
    -- 46.6-75.9 SE dynamic range, G1 clearing by 11.9-19.3x, G2 not firing anywhere -- which is precisely
    what the superseded one could not do, and its pre-registration was hash-enforced (the validator reproduced
    sha256 2893a6b0 three independent ways and proved the frozen text contains no data-tunable quantity).
    WHAT DID NOT SURVIVE REVIEW: (1) the "absent below gate after reduction" headline was an UPPER BOUND
    reported as an absence -- the statistic is a deterministic scalar of the tail frame, and computed
    EXACTLY on 16 bases the excess is +0.1863 (+10.2 sd, 16/16) for LLL at d=100, +0.4386 (+16.6 sd, 16/16)
    at d=140, +0.1400 (+9.9 sd, 16/16) for BKZ-30 at d=140. Reduction suppresses 15-50x and DOES NOT ZERO.
    (2) The q*I block mechanism is geometrically FALSE: the tail window carries 0.00000 of its energy
    there and 1.00000 in the complementary I_k block. (3) "The falsifier fired, therefore artifact" does
    not follow -- a zero-free-parameter geometry model predicts D(60)/D(30)=1.544 at d=140 and the d=100
    reversal, so the growth was predictable and 1/sqrt(beta) was the wrong null to freeze. THE ANSWER
    IS THE THIRD READING: it is a basis-PRESENTATION property AND the instrument is BLIND to the residual
    (floor V ~ 2.2 against residuals 0.14-0.44; ~1000 frames per arm needed against 8 run). TWO COORDINATOR
    DECISIONS ARE THE BLOCKING ITEMS, because no executor can make them: (a) AMEND THE FROZEN t GRID in
    DEC-20260805-4823db to BRACKET t = 1/(d+1) (0.0099 / 0.0071) instead of starting 5-7x past it, and
    make G3 tie-tolerant; (b) REPLACE THE P1/P2 ADJUDICATION with a predicate that discriminates -- it
    currently returns IDENTICAL verdicts on null and real arms in all four cells, so even a VALID demonstration
    on a repaired grid still would not discharge C3. Then: state every "absent" verdict in this lane as
    an upper bound with its floor; run the k != d/2 test that separates the refuted q*I story from the
    measured I_k confinement; and fix the harness (split the producer so a pre-registration is snapshot-notarized
    BEFORE the measurement it governs, and correct the batch-card claim that a BKZ cache exists -- the
    SEEDS are the reproducible artifact, verified 32/32 at max deviation 0.0). Claim tier stays TOY; nothing
    bears on ML-KEM security or any FIPS 203 parameter set.'
