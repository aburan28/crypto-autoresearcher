  completion_criteria:
    - >-
      A committed Coordinator decision states the map between Semaev's d_F4 and
      GOAL-DREG-001's Macaulay-rank d_reg/D, instrumented on identical instances,
      so that campaign's existing measurements can be read as bearing on
      Assumption 1 or explicitly as not bearing on it. Either answer satisfies this
      criterion; an unstated map does not.
    - >-
      A committed Coordinator decision reports the reproduction status of
      KN-LIT-fa346d Tables 1-2, cell by cell, on an open-source engine, together
      with the calibration control that distinguishes a genuine degree
      disagreement from an engine difference. Cells this program cannot reach are
      listed as unreached with their impediment, which satisfies the criterion;
      silently omitting them does not.
    - >-
      A committed Coordinator decision reports the located d_F4 = 4 versus
      d_F4 >= 5 boundary surface in (n, m, t, k) as far as certificates reach,
      scoped to Assumption 1 alone and never to Assumption 2, OR names the exact
      certificate that is missing and why it was out of machine reach.
    - >-
      A committed Coordinator decision carries a COST record giving time AND memory
      for the chained-S_3 index calculus against van Oorschot-Wiener PARALLEL rho
      with distinguished points at n = 233, 283, 409, 571, with every optimistic
      assumption flagged on both sides and a tradeoff curve in m. Semaev's own
      strongest position from the KN-LIT-e77232 thread -- that the method still
      wins at n = 571 with regularity degree up to 6 and linear-algebra constant 3
      -- is costed as one of the rows.
    - >-
      A committed Coordinator decision states the measured relation yield of the
      chained system against eq. (11) with error bars over the enumeration window,
      fixes the sign of the bias from substituting the upper bound P(n,m,t,k) for
      P(solve eq. 5), and says whether the frozen HEUR-SEMAEV-2015-4.3 reference
      curve in EXP-RELN-164ad3 remains a sound comparator. If it does not, the
      remedy is an additive amendment and a new record; the frozen specification
      and H-RELN-96e3ba are immutable.
    - >-
      Tooling readiness, design intake, or an assembled ideation batch never
      satisfies any criterion above. Each requires a measurement or a derivation
      with its scope stated.
  pause_conditions:
    - >-
      A required Groebner or Macaulay-rank computation exceeds usable machine
      memory (roughly 8-16 GB) or its declared wall-clock cap. GOAL-DREG-001's
      n = 15 attempt already died at 11.73 GiB in the prepare phase alone, and
      Kosters' cells in KN-LIT-e77232 are recorded at 111-126 GB.
    - >-
      An open-source engine cannot be made to report a degree statistic
      commensurable with Semaev's d_F4 definition, so no calibration control is
      available and a measured disagreement would be uninterpretable.
    - >-
      A frozen protocol, archive binding, or required independent review is
      unavailable or invalid.
    - >-
      review-adversarial at xhigh, or review-breakthrough at max, cannot be served
      by any reachable backend for a claim-changing round.
