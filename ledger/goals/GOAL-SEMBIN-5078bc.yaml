research_goal:
  id: GOAL-SEMBIN-5078bc
  title: >-
    Audit of Semaev 2015 (ePrint 2015/310): the validity boundary of Assumption 1,
    the d_F4 versus d_reg definitional gap, the eq. (11) yield model, and the
    memory-charged crossover the paper omits
  objective: >-
    Establish what Semaev's 2015 chained-S_3 index calculus over F_{2^n} actually
    supports, at the scale this program can measure, and state the boundary of that
    support explicitly. Four separable uncertainties, in the order their answers
    unblock each other.
    (1) DEFINITIONAL. Semaev's d_F4 (Section 4.4: maximal total degree of
    polynomials occurring before F4 terminates, excluding the degree-5/6/7 "No pairs
    to reduce" tail steps he reports and excludes) and the Macaulay-rank d_reg/D
    that GOAL-DREG-001 has been measuring on THIS system since 2026-07 are not
    known to be the same quantity. Until the map between them is stated, that
    campaign's degree-5 and degree-6 measurements (EV-DREG-008) neither support nor
    contradict Assumption 1, and this program cannot say which (KN-OPEN-d218ec).
    (2) BOUNDARY. Assumption 1 asserts d_F4 <= 4 for the Boolean system equivalent
    to eq. (5) at every 2 <= t <= m on the diagonal k = ceil(n/m). Its entire
    experimental basis is 2300 MAGMA systems at n <= 21, m <= 6, plus one cell at
    n = 40, m = t = 2; the FIPS conclusion needs n = 409, 571 at m = 11, 12. Locate
    the d_F4 = 4 versus d_F4 >= 5 surface in (n, m, t, k) as far as certificates
    reach, beginning in the m = 2 window n in [40, 45] and off the diagonal, where
    the paper's own Section 4.5.1 reports that regularity degree "generally exceeds
    4 when k > ceil(n/m) though the first fall degree is still 4".
    (3) YIELD. eq. (11) is the curve this program has been citing as
    HEUR-SEMAEV-2015-4.3 in frozen GOAL-RELN-001 and GOAL-ICEX-001 protocols while
    the paper was recorded unread. Its formula is now confirmed against the source;
    whether it is the right law for the chained system, and in which direction its
    stated inequality biases relation cost, is not.
    (4) COST. Produce the time-AND-memory comparison the paper does not make.
    Table 3 and eqs. (15)-(17) are time only, while stage 2 stores Theta(2^k)
    relations -- 2^31 at n = 310, 2^38 at n = 409, 2^48 at n = 571 -- against a
    Pollard rho comparator with negligible memory (KN-OPEN-86e7e1).
    Scope discipline: only standalone mathematical instances and derivations from
    published formulas are in scope. No deployed target, no private-key recovery,
    and no claim about the security of any FIPS curve in either direction. The FIPS
    binary curves appear here as parameter sets in a cost table.
