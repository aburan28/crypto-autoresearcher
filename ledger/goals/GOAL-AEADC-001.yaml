research_goal:
  id: GOAL-AEADC-001
  title: >-
    Key-committing AEAD: produce the colliding-key certificates at full standard
    parameters, measure the k-way cost curve, and fill the table mapping each
    published repair to the precondition it removes
  objective: >-
    The fielded AEADs do not commit to their keys; the literature established
    this and the higher-level attacks that follow from it. What does not exist
    in one place is a certificate-backed, cost-measured, repair-by-precondition
    table. Build it. Emit literal certificates — one ciphertext, two keys, two
    distinct valid decryptions — for AES-GCM and ChaCha20-Poly1305 at FULL
    standard parameters, re-verified by two implementations, at least one not
    used in construction. Extend to k keys and MEASURE the cost curve in k,
    since that curve is what governs the efficiency of partitioning-oracle
    attacks and is usually assumed rather than measured. Then audit each
    published committing construction: which precondition it removes, whether it
    commits to the key alone or to the full context, and what it costs on this
    program's own harness. This is the cheapest strong evidence available
    anywhere in the program: the certificate is a few hundred bytes and
    verification is instant.
  question_ids: [RQ-AEADC-8db132]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 5
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  related_goals: [GOAL-POLYMAC-001, GOAL-AES-003, GOAL-ASCON-001, GOAL-HYBRID-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "AES-GCM, ChaCha20-Poly1305, AES-GCM-SIV; committing transforms and dedicated committing AEADs as the repair set"
    family: "AEAD; key-commitment and context-commitment security"
    nist_track: fielded_standard
    standardization_status: >-
      RECALLED, UNVERIFIED: AES-GCM and ChaCha20-Poly1305 are the fielded TLS
      1.3 AEADs; committing AEAD has been a CFRG work item and a subject of NIST
      discussion of a GCM successor, with no fielded standard yet.
    why_this_scheme: >-
      Two reasons. First, evidence economics: this is the single cheapest place
      in the program to produce top-tier, instantly verifiable certificates at
      FULL standard parameters rather than reduced ones. Second, the gap is real
      and structural — a security property the fielded primitives were never
      designed to have, which higher-level protocols keep assuming, and whose
      repairs are now numerous enough that choosing between them requires a
      table nobody has filled.
  non_duplication:
    - >-
      GOAL-POLYMAC-001 owns the FORGERY BOUNDS of GHASH and Poly1305 — the
      probability that an adversary forges under a single unknown key. This goal
      owns COMMITMENT: the adversary knows and chooses both keys, and forgery
      probability is irrelevant to it. The two goals share the same polynomial
      arithmetic and must not share conclusions; neither may cite the other's
      evidence as support.
    - >-
      GOAL-ASCON-001 owns the standardized-versus-submitted audit for Ascon,
      including its committing-relevant modes. Any Ascon result reached here is
      referred to that goal rather than recorded here.
    - >-
      GOAL-AES-003 owns executed reduced-round AES cryptanalysis. This goal
      attacks no round function and reduces nothing.
  completion_criteria:
    - >-
      CERTIFICATES AT FULL STANDARD PARAMETERS for at least two fielded AEADs,
      emitted as bytes, each re-verified by two independent implementations, at
      least one of which was not used to construct it.
    - >-
      THE k-WAY COST CURVE: measured construction cost as a function of the
      number of keys, over a declared range, with the machine model and seeds
      recorded and the curve's form stated rather than asserted.
    - >-
      THE REPAIR TABLE: for each published committing construction implemented
      here, the precondition removed, whether commitment is to the key or to the
      full context, a certificate attempt against it (expected to fail, and the
      failure recorded as such), and measured overhead.
    - >-
      A PATTERN DESCRIPTION naming, generically, which deployed usage shapes
      instantiate the precondition — with no product, service or repository
      named anywhere.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      confirming every certificate reproduces from recorded bytes and that no
      record presents key-commitment failure as a confidentiality or single-key
      authenticity break.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The five-batch campaign budget is exhausted without an admissible next mechanism.
    - The AEAD specifications and at least one committing-AEAD reference cannot be obtained in primary text after the declared source-preference order is exhausted.
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    MINT THE FIRST GCM CERTIFICATE IN BATCH ONE, BEFORE ACQUISITION COMPLETES.
    The construction follows from the authenticator's polynomial structure over a
    known field and needs no literature to derive; the specification is needed to
    fix conventions, and conventions are exactly what the official test vectors
    pin. Implement GCM from the specification, pass the vectors, derive the
    two-key collision, emit the bytes, and have a second implementation verify
    them. That single artifact establishes the harness's ability to produce
    top-tier evidence and is reusable as the instrument for every later cell. Do
    NOT begin with the repair survey: an unvalidated harness auditing repairs
    produces a table nobody can check. Claim tier: key-commitment certificates
    and measured construction cost; never confidentiality, never single-key
    forgery, and never a statement about any deployed product.
