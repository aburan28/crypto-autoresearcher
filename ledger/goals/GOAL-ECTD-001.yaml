research_goal:
  id: GOAL-ECTD-001
  title: >-
    Prime-field elliptic-curve trapdoors: Teske analogue via secret isogenies
    to rare endpoint weaknesses
  objective: >-
    Determine whether a Teske-style trapdoor can exist for ordinary curves over
    generic prime fields: a public-looking E_pub, a secret isogeny chain to an
    endpoint E_s with a private ECDLP (or trapdoor-DDH) advantage that is not a
    public isogeny-class invariant, and public path recovery / detection that
    remains at least rho-hard. Prioritize (1) secret isogeny-aligned factor
    bases and Semaev/Gröbner heavy tails, (2) large-conductor vertical
    barriers, (3) hidden correspondences, (4) trapdoor DDH as a weaker first
    target. Deprioritize hiding anomalous / MOV / smooth-order / supersingular
    endpoints and secret-GLV-only constant factors.
  question_ids:
  - RQ-ECTD-001
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 8
    total_wall_clock_seconds: 28800
    max_concurrent: 3
  current_batch_id: BATCH-001
  dispatch_queue_path: coordination/goals/GOAL-ECTD-001/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: null
  batch_checkpoints: []
  related_goals:
  - GOAL-ECDLP-001
  related_note: >-
    GOAL-ECDLP-001 remains the broad charged breakthrough search on
    RQ-ECDLP-002. This goal is a focused trapdoor-existence campaign. Shared
    instruments (Semaev meters, isogeny walks) may be reused, but evidence and
    decisions stay under ECTD record IDs. IDEA-20260731-008 (isogeny-transfer
    cost gate) is the dual attacker-side question and must not be conflated
    with a designer trapdoor claim. H-ISO-001 rejected_scoped closes only short
    neighbor d_reg/yield homogeneity, not this campaign.
  completion_criteria:
  - >-
    Either a constructive trapdoor candidate with independently reviewable
    private advantage (empirical complexity exponent below 1/2 inside tested
    toy scope, or a verified precomputation/individual-log separation in the
    hidden-SNFS sense) plus a red-team showing public path search and public
    detection remain at least matched-rho hard; or a scoped barrier result that
    names, for each prioritized endpoint family, a concrete obstruction with
    argument and forward guidance on what remains open
    (docs/inventor-protocol.md closure standard).
  - >-
    Independent Validator and Red Team admit the decisive package: certificates
    (if any), matched rho/BSGS baselines, class-invariant negative controls,
    and claim-tier honesty (toy ≠ crypto).
  - >-
    Coordinator evidence, decision, and any warranted KN-FIND / KN-OPEN /
    KN-LIT upgrades are committed through a verified ledger archive.
  - >-
    Goal status may move to completed only when the three-model closure quorum
    is satisfied (AGENTS.md rule 13).
  pause_conditions:
  - The eight-batch campaign budget is exhausted without an admissible next mechanism.
  - >-
    Primary Teske source and the approach-adjacent papers cannot be obtained
    after the declared fetch order is exhausted; leave the goal paused with
    exact fetch obstructions rather than designing experiments on unverified
    summaries.
  - >-
    The decisive computation exceeds the declared campaign budget after cheaper
    falsification gates (literature barriers, toy heavy-tail screens) are
    exhausted.
  - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  - User requests pause.
  next_action: >-
    Run TASK-20260731-034 (Coordinator protocol snapshot archive of GOAL /
    RQ / briefing / queue / opening_report), then TASK-20260731-027 literature
    curation. Status remains draft until the BATCH-001 ledger archive
    (TASK-20260731-032) activates the goal after independent review.
