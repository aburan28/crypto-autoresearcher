  related_note: >-
    GOAL-ECDLP-001 remains the broad charged breakthrough search on
    RQ-ECDLP-002. This goal is a focused trapdoor-existence campaign. Shared
    instruments (Semaev meters, isogeny walks) may be reused, but evidence and
    decisions stay under ECTD record IDs. IDEA-20260731-008 (isogeny-transfer
    cost gate) is the dual attacker-side question and must not be conflated
    with a designer trapdoor claim. H-ISO-001 rejected_scoped closes only short
    neighbor d_reg/yield homogeneity, not this campaign.
  completion_criteria:
  - >-
    Either a constructive trapdoor candidate with independently reviewable
    private advantage (empirical complexity exponent below 1/2 inside tested
    toy scope, or a verified precomputation/individual-log separation in the
    hidden-SNFS sense) plus a red-team showing public path search and public
    detection remain at least matched-rho hard; or a scoped barrier result that
    names, for each prioritized endpoint family, a concrete obstruction with
    argument and forward guidance on what remains open
    (docs/inventor-protocol.md closure standard).
  - >-
    Independent Validator and Red Team admit the decisive package: certificates
    (if any), matched rho/BSGS baselines, class-invariant negative controls,
    and claim-tier honesty (toy ≠ crypto).
  - >-
    Coordinator evidence, decision, and any warranted KN-FIND / KN-OPEN /
    KN-LIT upgrades are committed through a verified ledger archive.
  - >-
    Goal status may move to completed only when the three-model closure quorum
    is satisfied (AGENTS.md rule 13).
  pause_conditions:
