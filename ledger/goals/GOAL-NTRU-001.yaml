research_goal:
  id: GOAL-NTRU-001
  title: >-
    NTRU: measure the fatigue point instead of inheriting it, and test whether
    the transition moves for the ring shape that is actually deployed in SSH
  objective: >-
    Deployed NTRU-family parameters are argued safe partly by distance from the
    overstretched regime, where dense-sublattice attacks apply. That distance is
    computed from an asymptotic law whose constant was fitted at small dimension
    for one ring shape. Measure the transition directly: sweep q at fixed n and n
    at fixed q, run lattice reduction to completion, emit a CERTIFICATE for every
    recovery (the short vector, re-verified independently), and detect the dense
    sublattice event through the reduction profile rather than only through
    success or failure. Then ask the question the published law does not answer:
    does the transition move for NTRU Prime's deliberately different ring shape,
    and for the matrix/module generalizations appearing in newer constructions? A
    law insensitive to the ring is a stronger law; a law that moves is a
    correction the deployed margin should know about. Deployed parameters are
    placed on the measured curve as a DISTANCE with its extrapolation interval,
    never as a safety verdict.
  question_ids: [RQ-NTRU-9015ee]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 21600
    max_concurrent: 3
  related_goals: [GOAL-MLKEM-003, GOAL-MLKEM-004, GOAL-FRODO-001, GOAL-HAWK-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "NTRU-HPS/HRSS, NTRU Prime (sntrup761, the OpenSSH hybrid default), matrix-NTRU and module-NTRU as generalization targets"
    family: "structured lattices; overstretched NTRU and the dense sublattice attack"
    nist_track: not_selected_but_widely_deployed
    standardization_status: >-
      RECALLED, UNVERIFIED: NTRU was a NIST PQC finalist that was not selected;
      sntrup761 is nonetheless executed in an enormous fraction of the world's
      SSH connections as part of the default hybrid key exchange. Deployment
      scale and standardization status point in opposite directions here, which
      is precisely why the parameter argument is under-examined.
    why_this_scheme: >-
      The fatigue point is a fitted constant in an asymptotic law that a
      deployment margin depends on — the program's recurring pattern — and unlike
      most such constants it can be re-measured directly at reachable dimensions
      with literal certificates. The ring-shape question is the novel part: the
      deployed variant deliberately differs from the object the law was measured
      on, and nobody in this program's corpus has checked whether the constant
      transfers.
  non_duplication:
    - >-
      GOAL-MLKEM-003 and GOAL-MLKEM-004 own core-SVP margin and dual-attack
      score distributions for module-LWE. This goal owns an NTRU-specific
      structural event — a dense sublattice — that does not exist in the
      module-LWE setting. Shared tooling is admissible; shared conclusions are
      not, and neither goal may cite the other's cost figures.
    - >-
      GOAL-HAWK-001 owns module-LIP. Distinct problem, distinct attack, no
      transfer.
    - >-
      GOAL-FRODO-001 owns unstructured-lattice recomputation and is the natural
      null for "is this event caused by structure at all"; using it that way
      requires each goal to have produced its own certified baseline first.
  completion_criteria:
    - >-
      A MEASURED TRANSITION with certificates: recoveries emitted as short
      vectors and re-verified, over a declared sweep in (n, q), with the fitted
      transition location AND width reported with confidence intervals.
    - >-
      A REDUCTION-PROFILE OBSERVATION establishing that the recoveries at the
      transition are caused by the dense sublattice event rather than by generic
      reduction success, with the profile data recorded.
    - >-
      A RING-SHAPE COMPARISON: the same sweep repeated for at least two
      distinct ring shapes including the deployed one, with the measured
      transitions compared and any difference reported with its uncertainty.
    - >-
      A PLACED MARGIN: deployed parameters located on the fitted curve as a
      distance with the extrapolation interval, explicitly not stated as a
      safety verdict.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      checking certificate reproduction, the planted-null control at every cell,
      and that no non-recovery is reported as evidence of security.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive, scoped to the dimensions,
      moduli and ring shapes actually run.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - The fatigue-point reference and both submission specifications cannot be obtained in primary text after the declared source-preference order is exhausted; the ring-shape comparison is meaningless without them.
    - Lattice reduction at the declared cells exceeds the campaign budget after cheaper gates are exhausted. Budget outcome about a solver, never evidence about a parameter set (AGENTS.md rule 3).
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    RUN THE SMALLEST FULL SWEEP FIRST AND MEASURE THE PROFILE, NOT JUST THE
    OUTCOME. At dimensions where reduction completes in seconds, sweep q across
    the predicted transition for one ring shape and record the full reduction
    profile at every cell alongside recovery or non-recovery. That single cheap
    batch establishes whether this program can SEE the dense sublattice event at
    all — if the profile signature is not visible at reachable dimensions, every
    later and more expensive cell is uninterpretable, and knowing that early is
    the most valuable outcome available. Include the planted-null control from
    the first cell, not as a robustness check afterwards. Claim tier: toy-scale
    measurement and fitted extrapolation with stated intervals; never a verdict
    on any deployed parameter set.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
