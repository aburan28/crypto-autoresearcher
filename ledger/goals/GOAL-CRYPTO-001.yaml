  completion_criteria:
    - >-
      A certificate-verified discrete logarithm or relation-to-solve pipeline
      completes on a recognized curve above 96 bits and independently
      reproduces a fully charged wall-clock or operation-count advantage over
      the matched Pollard-rho baseline.
