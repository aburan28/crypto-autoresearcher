research_goal:
  id: GOAL-SLHDSA-001
  title: "SLH-DSA: measuring the slack between the hash-based proof and the best concrete multi-target attack"
  objective: >-
    Quantify, rather than assume, SLH-DSA's remaining margin: re-derive
    the multi-target security bound at FIPS 205 parameters with
    constants tracked, build a concrete classical and quantum attack
    cost model against the FORS layer, and report the gap under a
    sensitivity analysis over the quantum cost convention — while
    keeping fault/memory-corruption results in a strictly separate claim
    class from anything said about the hash assumption.
  question_ids: [RQ-SLHDSA-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "SLH-DSA (FIPS 205, formerly SPHINCS+)"
    family: "stateless hash-based signature"
    nist_track: selected_algorithm
    standardization_status: >-
      Finalized 2024-08-13 as FIPS 205. The conservative fallback of the
      standardized set.
  completion_criteria:
    - >-
      A re-derived bound with tracked constants at a named FIPS 205
      parameter set, a concrete best-attack cost model classically and
      quantumly with the cost convention's sensitivity reported as a
      range rather than a point, and an explicit statement of the
      resulting slack — including the outcome that the margin is
      comfortable.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the FIPS 205 text nor the primary multi-target proof
      literature can be obtained under the network policy after the
      declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-SLHDSA-001. The first deliverable is the
    re-derived bound with constants, not an attack; a slack measurement
    is the durable output here whether or not any attack materializes.
    Fault-chain proposals are filed as a separate class.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
