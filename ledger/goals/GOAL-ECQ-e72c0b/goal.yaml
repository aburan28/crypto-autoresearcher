  id: GOAL-ECQ-e72c0b
  title: Construct and unconditionally certify an elliptic curve over Q of Mordell-Weil rank at least 32
  objective: >-
    Generate an exact nonsingular elliptic curve E over the rationals, exhibit
    at least 32 explicit rational points on E, and prove unconditionally and
    reproducibly that 32 of those points are Z-linearly independent modulo
    E(Q)_tors. The completion claim is rank E(Q) >= 32; exact rank is not
    required and is never inferred from analytic evidence.
