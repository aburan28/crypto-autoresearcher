  completion_criteria:
    - >-
      Record an exact rational Weierstrass equation for E and verify with exact
      arithmetic that its discriminant is nonzero.
    - >-
      Record at least 32 explicit rational points and verify with exact
      rational arithmetic that every listed point lies on the stated curve.
    - >-
      Provide an unconditional, machine-checkable certificate proving that 32
      listed points are Z-linearly independent modulo E(Q)_tors. An acceptable
      Cremona-Brumer-style certificate must publish the complete exact
      character basis or basis bindings, good primes and preconditions,
      point and torsion rows, exact F2 matrix, matrix rank, torsion-row rank,
      any halving witnesses, and the proof that matrixRank-torsionRank=32
      implies independence of the intended rational points. An exact descent,
      saturation, or height certificate is acceptable only when every
      load-bearing decision is exact and proves the same unconditional bound.
    - >-
      Determine E(Q)_tors exactly, including generators or an independently
      checkable equivalent certificate sufficient to exclude every torsion
      relation relevant to the independence proof.
    - >-
      Preserve a reproducible exact verifier with commands, source commit and
      dirty-tree state, dependency and environment versions, inputs, seeds,
      raw outputs, artifact hashes, timestamps, and resource measurements.
    - >-
      Strictly snapshot producer artifacts before review; independently
      validate the exact certificate and controls; obtain an independent
      adversarial red-team assessment; and obtain a blind rederivation of the
      load-bearing nonsingularity, on-curve, torsion, and independence
      quantities from the statement and exact inputs alone.
    - >-
      Execute the predeclared success review plan under review-breakthrough at
      max reasoning, in fresh independent sessions, with no fallback or
      degradation, before any success or closure claim.
    - >-
      Ledger-archive a Coordinator decision citing the exact experiment,
      certificate, validation, red-team, blind-rederivation, and breakthrough
      review records that establish rank E(Q) >= 32. Exact rank is not
      required.
    - >-
      Do not use BSD, GRH, analytic rank, a floating regulator or determinant,
      distinctness of points, a timeout, or an infrastructure failure as proof
      of the rank lower bound.
