research_goal:
  id: GOAL-HYBRID-001
  title: >-
    Hybrid KEM combiners: fill the binding table for the deployed and proposed
    constructions with a certificate per failure, and state precisely what the
    protocol-level rescue argument requires
  objective: >-
    Hybrid key exchange went from proposal to browser default in a very short
    time, and the binding properties of the combiners are exactly the class of
    property that composition arguments elsewhere in a protocol are assumed to
    cover. The taxonomy exists, the component's behaviour is known, the
    combiners are short, and the certificates are cheap. Fill the table.
    Implement each named combiner from its specification, validate against
    published test vectors, and for every binding property in the taxonomy
    produce either a derivation from the combiner's own key-derivation input
    list or a LITERAL CERTIFICATE of failure — two distinct (key, ciphertext)
    pairs yielding the same shared secret, re-verified independently. Establish
    the component's own binding behaviour under adversarially generated keys
    first, since every combiner's row depends on it. Enumerate the finite lattice
    of key-derivation input subsets and determine which properties survive each,
    locating the deployed choices as points in that lattice. Finally, state the
    protocol-level transcript-binding argument precisely enough that the set of
    settings where it does NOT apply is explicit rather than implied.
  question_ids: [RQ-HYBRID-cdf2b2]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 5
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  related_goals: [GOAL-MLKEM-005, GOAL-MLKEM-003, GOAL-AEADC-001, GOAL-EDDSA-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "X25519MLKEM768 and related TLS hybrid groups, X-Wing, generic KEM combiners; ML-KEM alone as the component under study"
    family: "KEM combiners; binding properties and IND-CCA composition"
    nist_track: fielded_standard_component
    standardization_status: >-
      RECALLED, UNVERIFIED: ML-KEM is FIPS 203; hybrid key exchange is deployed
      by default in major TLS stacks and is the subject of active IETF drafts;
      X-Wing is a specific proposed combiner with its own security argument.
    why_this_scheme: >-
      Deployment scale is already enormous and rising, the properties at issue
      are decidable, the certificates are a few hundred bytes and instantly
      checkable, and the input-subset lattice is finite — so the table can be
      COMPLETED rather than sampled. It is also adjacent to this program's
      existing ML-KEM lane without duplicating any of it: no lattice, no cost
      model, no core-SVP estimate appears anywhere in this goal.
  non_duplication:
    - >-
      GOAL-MLKEM-003, GOAL-MLKEM-004 and GOAL-MLKEM-005 own the HARDNESS side of
      ML-KEM: core-SVP margins, dual attacks, and mechanism search. This goal
      makes no hardness claim, runs no lattice reduction, and treats ML-KEM as a
      black box with a specified interface. Neither lane's evidence transfers.
    - >-
      GOAL-AEADC-001 owns commitment for AEADs. Both goals produce "two objects,
      one output" certificates and the discipline is deliberately shared; the
      primitives, taxonomies and specifications are disjoint and cross-citation
      of conclusions is prohibited.
    - >-
      GOAL-EDDSA-001 owns signature verification semantics. Shared certificate
      economics, disjoint object.
  completion_criteria:
    - >-
      A COMPONENT BASELINE: ML-KEM's own binding behaviour under adversarially
      generated keys, established with certificates or with derivations, before
      any combiner row is filled.
    - >-
      THE BINDING TABLE: every taxonomy property against every implemented
      combiner, each cell either derived from the combiner's key-derivation
      inputs with the derivation shown, or witnessed by a literal certificate
      re-verified by a second independent implementation.
    - >-
      THE INPUT-SUBSET LATTICE enumerated exhaustively, with the deployed and
      proposed combiners located as points in it and the binding consequences of
      each subset stated.
    - >-
      A PRECISE STATEMENT OF THE PROTOCOL-LEVEL RESCUE ARGUMENT, including the
      conditions it requires, so that settings where it does not apply are
      explicit.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying every implementation passes its specification's test vectors,
      every certificate reproduces, and no record presents a binding failure as a
      confidentiality break or as a statement about any deployed implementation.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The five-batch campaign budget is exhausted without an admissible next mechanism.
    - FIPS 203, the relevant hybrid draft, or a primary binding-taxonomy reference cannot be obtained in primary text after the declared source-preference order is exhausted. The taxonomy's exact definitions decide every cell, and approximating them from memory would produce a table that looks authoritative and is not.
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    ESTABLISH THE COMPONENT BASELINE FIRST: what does ML-KEM alone bind, under
    adversarially generated keys? Every combiner row is a function of that
    answer, the experiment is a direct construction against a FIPS 203
    implementation validated on its own test vectors, and the certificate — if
    one exists in the enumerated class — is a few hundred bytes. Getting this
    wrong poisons the entire table, and getting it right makes most of the table
    derivable rather than searched. Build the ML-KEM implementation, pass the
    vectors, and attempt the component certificates before implementing a single
    combiner. Claim tier: binding-property claims about specification-level
    constructions implemented here, with certificates. Never a confidentiality
    claim, never a statement about any deployed TLS implementation, browser or
    service, and all key material self-generated.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
