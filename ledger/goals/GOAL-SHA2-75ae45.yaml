research_goal:
  id: GOAL-SHA2-75ae45
  title: >-
    SHA-2 collisions to 39 steps: independently reproduce Li et al.'s
    memory-efficient 36–39-step attack line and name the uncontrolled-part
    obstruction
  objective: >-
    Own independent reproduction and cost-model audit of the attack line in
    "Pushing Collision Attacks on SHA-2 to 39 Steps" (Li, Zhang, Li, Liu, Qian,
    Zhu; user-supplied 2026 text frozen at SRC-SHA2-LI-39STEPS-2026). First
    re-verify the stated practical 36-step SHA-256 colliding pair and the SFS
    characteristic witnesses; then re-derive the stated 36/37/38/39-step
    time/memory accounts under the memory-efficient on-the-fly MITM framework;
    only then ask whether a further refinement can make 39-step SHA-256
    effective or push SHA-512 past 39 steps under the same local-collision
    family. No claim about full SHA-256/SHA-512 is in scope.
  question_ids: [RQ-SHATWO-f340ac]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 2
  campaign_budget_note: >-
    Non-ECC goal. Budgets are advisory under docs/research-budget-policy.md;
    null removes batch/wall ceilings without removing the duty to rank.
    max_concurrent stays 2 (machine headroom; AES-003 BATCH-002 precedent).
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals:
    - GOAL-SHA2-001
    - GOAL-SYMF-c00fa1
    - GOAL-MD5-001
    - GOAL-DIFFP-84d641
    - GOAL-SHA1-001
  scheme_context:
    scheme: SHA-256 and SHA-512 (FIPS 180-4), step-reduced compression
    family: Merkle-Damgard / Davies-Meyer, ARX + Boolean round function
    nist_track: fielded_standard
    standardization_status: >-
      FIPS 180-4. Collision-resistance root of TLS chains, code signing, and
      Bitcoin's SHA-256d; not on a migration path.
    why_this_scheme: >-
      The supplied paper claims a literal practical collision at 36-step
      SHA-256 and effective theoretical collisions through 38 (both) and 39
      (SHA-512 only). This program has never independently verified that
      certificate line, and GOAL-SHA2-001's draft deficit campaign still lacks
      a primary-text baseline of this strength.
  source_freeze:
    record_id: SRC-SHA2-LI-39STEPS-2026
    path: inputs/SHA2-LI-39STEPS-2026/source_record.yaml
    claims_extract: inputs/SHA2-LI-39STEPS-2026/claims_extract.md
    provenance: user_supplied_2026-09-09
  non_duplication:
    - >-
      GOAL-SHA2-001 owns the degrees-of-freedom versus conditions deficit
      ledger and the instrument-versus-deficit discrimination across step
      counts. This goal consumes published characteristics and certificates
      from the Li et al. line; it does not reopen that discrimination unless
      a verified cost-model contradiction forces a handoff.
    - >-
      GOAL-MD5-001 owns instrument calibration against complete ground truth.
      This goal consumes that calibration and does not redo MD5 rediscovery.
    - >-
      GOAL-DIFFP-84d641 owns new MD5/SHA-1 differential-path census and novelty
      adjudication. SHA-2 signed characteristics here are out of that census
      unless explicitly handed off.
    - >-
      GOAL-SYMF-c00fa1 owns the notion-separated published-frontier ledger.
      Verified rows from this campaign may be proposed as SYMF updates; this
      goal does not edit the census in place.
  completion_criteria:
    - >-
      PRIMARY SOURCE: an attached retrieval (or a recorded retrieval failure
      with exact search boundary) for the paper PDF, reconciled against
      SRC-SHA2-LI-39STEPS-2026 Table-1/2 claims.
    - >-
      CERTIFICATE: the stated 36-step SHA-256 colliding pair re-verified by an
      independent FIPS 180-4 36-step compression check, or a documented
      verification failure with pinned commands, implementation, and digests.
    - >-
      COST-MODEL PACKAGE: re-derived condition counts and time/memory accounts
      for at least the 36- and 38-step SHA-256 claims and the 39-step SHA-512
      claim, with explicit null controls on condition enumeration.
    - >-
      OBSTRUCTION OR EXTENSION: either a named, measured obstruction that
      stops effective 39-step SHA-256 (and/or further SHA-512 steps) under the
      tested local-collision family, or a frozen follow-on protocol that
      attempts one concrete refinement after the certificate and cost-model
      gates pass.
    - >-
      Independent Validator and Red Team sessions admit the run package;
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive. Every conclusion is scoped
      to the exact step counts and characteristics tested.
  pause_conditions:
    - >-
      Required FIPS 180-4 implementation or NIST vectors cannot be obtained
      after the declared source-preference order is exhausted.
    - >-
      Primary PDF remains unavailable after the recorded retrieval boundary;
      work continues on the user-supplied extract but cannot promote
      complexity figures beyond user_supplied provenance.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next ranked task.
  next_action: >-
    Open BATCH-1 as acquisition and certificate only: (1) pin a FIPS 180-4
    implementation against NIST test vectors; (2) attempt independent
    retrieval of the paper PDF and attach SHA-256 + byte length to
    SRC-SHA2-LI-39STEPS-2026; (3) re-verify the Table-2 36-step SHA-256
    colliding pair under a 36-step compression check and record pass/fail with
    exact commands. No SAT search and no MITM attack implementation in
    BATCH-1. Claim tier: reduced-round certificate check; never a statement
    about full SHA-2 or any deployed system.
  owner: coordinator
  created_at: '2026-09-09'
  updated_at: '2026-09-09'
