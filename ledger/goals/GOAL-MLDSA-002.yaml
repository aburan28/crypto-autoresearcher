research_goal:
  id: GOAL-MLDSA-002
  title: "ML-DSA: measure what the verifier does not check and what FIPS 204 asserts without deriving — the signing-only rejection conditions and the t0-secrecy claim"
  objective: >-
    Turn two qualitative statements about a fielded standard into measured
    numbers at its real parameter sets. First, the rejection conditions
    enforced during signing but not at verification: measure how often a
    compliant signer actually triggers them, exhibit a verifying signature
    that no compliant signer would emit, and determine what a signer that
    omits the check leaks and what the security argument loses. Second, FIPS
    204's assertion that t0 need not be regarded as secret because it is
    reconstructible from a small number of signatures: independently reproduce
    the recovery, measure the per-signature leak rate, and state the required
    signature count per parameter set. Neither object is a break, and the goal
    is written so that neither can be reported as one.
  question_ids: [RQ-MLDSA-ffa0f5]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MLDSA-001, GOAL-MLKEM-002, GOAL-SLHDSA-001]
  scheme_context:
    scheme: "ML-DSA (FIPS 204, formerly CRYSTALS-Dilithium)"
    family: "lattice signature (Fiat-Shamir with aborts)"
    nist_track: selected_algorithm
    standardization_status: >-
      Finalized 2024-08-13 as FIPS 204.
    why_this_lane: >-
      The assumption lane is already owned and already hard to reach: nothing
      this program can compute settles whether SelfTargetMSIS is correctly
      costed. The conformance-and-assertion lane is the opposite — cheap
      certificates, real parameter sets, and two specific statements that were
      asserted rather than derived. Reachable decisive evidence is the
      selection criterion.
  non_duplication:
    - >-
      GOAL-MLDSA-001 OWNS THE ASSUMPTIONS AND THE FAULT PROOF: which of MLWE,
      MSIS or SelfTargetMSIS binds at each FIPS 204 category, and where the
      fault-injection security proof's boundary lies. THIS GOAL RE-ESTIMATES
      NO ASSUMPTION AND INJECTS NO FAULT. Both objects here are properties of
      the scheme's own algorithms and of the standard's own text, measurable
      with an unmodified, unfaulted, correctly-executing implementation. A
      batch that starts estimating a lattice problem or glitching a device has
      crossed into GOAL-MLDSA-001 and must hand off.
    - >-
      GOAL-MLKEM-002 is the structural precedent, not an overlap: it owned the
      ML-KEM re-encryption comparison conformance lane and completed. The
      defect class is the same shape — a security-relevant step that outside
      observation cannot confirm was performed — which is why a conformance
      lane deserves its own goal rather than being folded into a
      cryptanalysis one.
    - >-
      GOAL-SLHDSA-001 owns proof-versus-attack slack for SLH-DSA. Cited only
      because both goals target a bound or an assertion rather than a hard
      problem; no shared scope.
  completion_criteria:
    - >-
      A measured rate, with a stated confidence interval, for the
      signing-only rejection condition at each of ML-DSA-44/65/87 — reported
      as an upper bound with its sample size if the observed count is zero —
      together with an exhibited signature that violates the condition and
      still verifies under an independent verifier, and a stated account of
      what a signer omitting the check leaks and what the security argument
      loses by it.
    - >-
      An independently reproduced t0 recovery at each parameter set, with the
      recovered t0 certified against the true t0 from the keypair, the
      per-signature leak rate measured, and the required signature count
      stated as a number with its variance — replacing the standard's
      qualitative "small number of signatures" with a quantity, and running
      the null control in which t0 is resampled independently of the key.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions. The
      Red Team is directed specifically at the claim boundary: whether any
      statement in the package can be read as a claim about MLWE, MSIS or
      SelfTargetMSIS.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conformance
      findings and the t0 quantification recorded as separate claims at
      separate tiers, and with the non-break scope stated in the evidence
      record itself rather than only in the goal.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither FIPS 204 nor the primary attack literature can be obtained under
      the network policy after the declared source-preference order is
      exhausted. This is a live risk: NIST domains are recorded elsewhere in
      this ledger as blocked by the harness proxy, and the excerpts behind
      this goal came through the search tool rather than the harness's own
      network path.
    - >-
      The signature volume required for t0 recovery or for observing the
      rejection condition exceeds the declared campaign budget after cheaper
      falsification gates are exhausted. Under AGENTS.md rule 5 that is a
      budget outcome and never evidence that the leak or the condition is
      absent.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Acquire and file FIPS 204 and the two attack papers as KN-LIT entries
    before designing anything — RQ-MLDSA-ffa0f5.constraints requires it, and
    one specific transcription question is already open: the rejection
    condition was quoted against a paper's OWN algorithm numbering, and its
    correspondence to FIPS 204's algorithm and line numbering is unestablished.
    Resolve that from the standard's text, not by assuming the mapping. THE T0
    OBJECT SHOULD BE SCOPED FIRST. It is the one with a published reproduction
    target, a certificate that costs a comparison, and a claim in the standard
    precise enough to be contradicted by a number; the rejection-condition
    object requires estimating a rate that may be small enough to need a
    sample size the campaign budget cannot buy, so scope it second and size
    the sample before committing. RUN THE NULL CONTROL BEFORE BELIEVING ANY
    LEAK MEASUREMENT: a per-signature leak that does not vanish when t0 is
    resampled independently of the key is an artifact of the measurement, and
    docs/inventor-protocol.md requires the null object of the same shape
    first. Claim tier: crypto for both measurements, and NEITHER IS A BREAK —
    any package that can be read as a statement about MLWE, MSIS or
    SelfTargetMSIS is defective regardless of what it measured.
  owner: coordinator
  created_at: '2026-08-04'
  updated_at: '2026-08-04'
