research_goal:
  id: GOAL-SCURVE-3e3cb4
  title: Certificate-bearing weak-curve audit of NIST P-192 and its valid isogeny class
  objective: >-
    Determine, with reproducible native certificates, whether (a) an unchecked
    P-192 scalar-multiplication interface admits fixed-seed planted-key recovery
    through the same-a singular companion y^2=x^3-3x-2, and (b) the valid
    ordinary P-192 isogeny class contains a short, map-realizable CM class
    relation that produces a charged end-to-end advantage. Keep implementation
    validation failure separate from any property of the valid isogeny class.
  question_ids:
    - RQ-SCURVE-df94be
  active_hypothesis_ids:
    - H-SCURVE-d5f25f
    - H-SCURVE-9f8f9a
  status: active
  runtime:
    provider: codex
    goal_id: null
  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 1
  current_batch_id: BATCH-00628c
  dispatch_queue_path: coordination/goals/GOAL-SCURVE-3e3cb4/batches/BATCH-00628c/dispatch_queue.json
  latest_verified_commit: 9c2bc35e93f0c2f83026c8e351c621f623bdfb90
  latest_verified_commit_note: >-
    Clean origin/main base checked before these design records were authored;
    it predates this campaign and is not an archive receipt for these records.
  claim_boundaries:
    - >-
      The singular companion is not an elliptic curve and is not a member of
      the P-192 isogeny class. Recovery through it can establish only an
      implementation/interface validation weakness.
    - >-
      A reduced-form identity or principal CM relation is algebraic evidence,
      not an attack. A valid-isogeny weakness requires oriented kernels,
      explicit maps, point evaluation, full construction and evaluation costs,
      and a demonstrated end-to-end advantage over the declared baseline.
    - >-
      P-192's approximately 96-bit generic ECDLP baseline is below a 128-bit
      policy target because of group size; that known size classification is
      separate from both experiments and is not rediscovered here.
    - All keys, points, seeds, tags, and targets are public and synthetic; live keys are prohibited.
    - Timeouts, dependency failures, and budget stops are operational outcomes, never evidence of strength.
  completion_criteria:
    - >-
      EXP-SCURVE-29040c has a frozen snapshot, native run artifacts, independent
      certificate verification, negative controls, and an interpretation that
      does not exceed IMPLEMENTATION_WEAK.
    - >-
      EXP-SCURVE-647ade has a frozen snapshot, exact boundary census, order and
      discriminant certificates, independent form/HNF replay, map-cost accounting
      where available, and an interpretation no stronger than its evidence.
    - Claim-changing results have independent validation and adversarial review before synthesis.
    - Producer, review, decision, and synthesis artifacts are durably archived.
  pause_conditions:
    - Archive, identifier, dispatch, or ledger integrity cannot be established.
    - The P-192 parameter tuple or implementation surface differs from the frozen contract.
    - A required claim-level independent review cannot be obtained.
