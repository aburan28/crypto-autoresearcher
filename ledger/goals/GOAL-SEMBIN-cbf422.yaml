  completion_criteria:
    - >-
      A committed Coordinator decision states, as a derivation from the paper's own
      eqs. (15)-(17), whether the joint (m, t) optimum of the two-stage balance is
      interior or lies on the t = m boundary, and what that does to the concrete
      crossover n. An interior optimum and a boundary optimum both satisfy this
      criterion; it is the derivation that is required, not a particular answer.
      The result is reported as a crossover effect and never as an exponent
      improvement.
    - >-
      A committed Coordinator decision reports the matched-pair comparison of the
      low-degree polynomial subspace V against a random k-dimensional V at equal
      (n, m, k) on one engine and machine, WITH the variable-permutation control,
      and classifies Table 1's starred effect as structural or as an
      ordering/shape artifact. An inconclusive classification with the measured
      ratio and its error bar also satisfies this criterion; an unclassified
      timing difference does not.
    - >-
      A committed Coordinator decision reports, for at least one alternative
      chaining topology over the same t points built from the same S_3 block, the
      auxiliary-variable count, the algebraic degree of the descended Boolean
      system, and the first-fall degree, each against the path topology at matched
      (n, m, t, k), together with the statement of what happens to Lemma 2's
      equivalence condition under that topology.
    - >-
      A committed Coordinator decision records the two-stage balance recomputed with
      the n^{4 omega} cofactor charged rather than absorbed, at n = 233, 283, 409,
      571, alongside the paper's own absorbed form, with the divergence between them
      stated in bits.
    - >-
      Every deliverable above names the degree assumption it inherits -- Semaev's
      Assumption 1, his Assumption 2, or a new numbered heuristic with a
      falsification condition -- and carries dominated_by checked across time,
      memory and data/queries rather than left null.
    - >-
      Tooling readiness, design intake, or an assembled ideation batch never
      satisfies any criterion above.
  pause_conditions:
    - >-
      A required matched-pair Groebner or Macaulay computation exceeds usable
      machine memory (roughly 8-16 GB) or its declared wall-clock cap. This
      program has no MAGMA licence and cannot reproduce the paper's timings; the
      comparisons above are between two of its own systems for that reason.
    - >-
      An alternative topology cannot be given a first-fall-degree derivation that
      is commensurable with the path topology's, so the comparison would not be
      of like with like.
    - >-
      A frozen protocol, archive binding, or required independent review is
      unavailable or invalid.
    - >-
      review-adversarial at xhigh, or review-breakthrough at max, cannot be served
      by any reachable backend for a claim-changing round.
