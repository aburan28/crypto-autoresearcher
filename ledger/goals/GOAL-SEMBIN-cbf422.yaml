research_goal:
  id: GOAL-SEMBIN-cbf422
  title: >-
    Semaev 2015 worked forward: the four choices the paper made and did not
    revisit -- chain length t = m, path chaining topology, low-degree subspace V,
    and the absorbed n^{4 omega} cofactor
  objective: >-
    Take the chained-S_3 construction of Semaev 2015 (ePrint 2015/310, frozen at
    inputs/SEMAEV-2015-310/, technique abstract KN-TECH-b18366) as a mechanism to
    develop rather than a claim to audit, and determine which of its unrevisited
    choices carry the 2^{1.6986 sqrt(n ln n)} exponent.
    (1) SHORT CHAINS. Section 3 step 3 says that for t < m the solving time "drops
    dramatically" while the solving probability is "relatively lower", that the
    trade "may be positive", and declines it because it "does not affect the
    asymptotical running time estimates". That reason is correct about the exponent
    and silent about the crossover n, which is what the FIPS claim of Section 4.5.2
    turns on. The two-stage balance of eqs. (15)-(17) was optimized over m with
    t = m held fixed; optimizing over (m, t) jointly is a different optimization,
    and whether its optimum is interior is unknown (KN-OPEN-94f456). This is pure
    derivation from published formulas and needs no execution.
    (2) SUBSPACE CHOICE. Table 1's starred rows measure a low-degree polynomial V
    beating a random k-dimensional subspace at equal k -- 11.41 s / 364 MB against
    27.08 s / 378 MB at n = 17, m = t = 3, k = 6 -- attributed only to the Groebner
    input being "simpler" and not pursued. A 2.4x factor at equal k is either
    structural or an artifact of the variable ordering the basis induces, and a
    matched permutation control separates the two cheaply.
    (3) CHAINING TOPOLOGY. The paper chains S_3 along a PATH. A path is one binary
    tree over t factor-base points; a balanced tree is another presentation of the
    same decomposition from the same S_3 block, with a different auxiliary-variable
    count and a different first-fall-degree analysis. Which topology minimizes what,
    and whether the degree-3 Boolean degree survives, is a question the paper does
    not ask.
    (4) COFACTOR. Stage 1 carries n^{4 omega}; at omega = 3 that is n^{12}, about
    2^{109} at n = 571, larger than the 2^{2n/m} stage-2 term the balance is struck
    against. The asymptotic statement is untouched by a polynomial factor by
    construction; every concrete number in Table 3 is not.
    Cross-cutting obligations. Any variant that changes t, the topology, or the
    subspace must say what happens to Lemma 2's conditional equivalence with
    eq. (4) -- which holds only when the lower-t systems are unsatisfiable, with the
    y_i in F_{q^2}\F_q case handled by an order-2 argument -- because a relation the
    algorithm emits when that condition fails is not a relation. And any cost claim
    resting on a degree bound must name whether it inherits Semaev's Assumption 1,
    his weaker Assumption 2, or a new numbered heuristic authored here; a mechanism
    result that silently inherits Assumption 1 is unfalsifiable.
    Scope discipline: standalone mathematical instances and derivations only. No
    deployed target, no private-key recovery, no claim about the security of any
    FIPS curve in either direction.
