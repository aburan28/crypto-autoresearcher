  headline: >-
    THE PROVENANCE GAP IS CLOSED FOR TEN NUMBERS AND FOR NOTHING ELSE, AND THE
    CAMPAIGN'S OLDEST ADVERSE FINDING IS NOW REPRODUCED BY TWO ROUTES AND
    CORROBORATED FROM OUTSIDE THE FROZEN FILE. Every fidelity result this program held
    about its frozen transcript was a comparison of that transcript against itself or
    against code derived from it; two independent readings of one possibly-corrupted
    source agree exactly as strongly as one. This round fetched the published article
    twice, independently, and diffed. Ten of ten, character for character, relation
    symbols included. AND THE LIMITATION THAT SURVIVES IS THE ONE THAT MATTERS: BOTH
    RETRIEVALS CAME FROM ONE VENUE, AND THE REVIEWER THEN ESTABLISHED THAT A SECOND
    VENUE DOES NOT EXIST - the paper is not on arXiv (three queries, all HTTP 200, all
    zero results, with a control query returning five other papers by the same author)
    and the archive records it as a preprint with no journal publication. If the
    archive's copy were itself corrupt, every retrieval would agree and every one would
    be wrong. THE SINGLE-VENUE EXPOSURE IS UNCLOSED AND UNCLOSEABLE HERE, and it is the
    load-bearing limitation of the J4 result rather than a footnote.

