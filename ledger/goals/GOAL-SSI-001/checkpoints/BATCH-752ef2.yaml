  caveats:
    - >-
      THE SINGLE-VENUE EXPOSURE IS UNCLOSED AND UNCLOSEABLE HERE, AND IT IS RECORDED
      FIRST. All three retrievals came from one archive. arXiv rate-limited the
      producer (HTTP 429; its retained 14-byte artifact contains exactly the recorded
      error stub, which the reviewer confirmed), and the reviewer then established with
      three queries that the paper is not on arXiv AT ALL - so a second-publisher copy
      does not exist to fetch. If the archive's copy were itself corrupt, both
      retrievals would agree and both would be wrong. Related: the article offers NO
      internal redundancy - each of the ten decimal strings occurs exactly once in the
      whole 13-page document, no table, no abstract restatement - so no value can be
      cross-checked against a second occurrence; and NO RENDERED PAGE WAS INSPECTED by
      anyone, all ten having been read through machine text extraction.
    - >-
      THE ROUND IS SESSION-INDEPENDENT, NOT MODEL-INDEPENDENT, AND POSITIVELY INDICATED
      TO BE THE SAME MODEL. The RC-6 producer's own receipt records an adapter-resolved
      model identifier that DISAGREES with the self-report of the session that served
      it, with `model_verified: false` and no probe run, and the divergence escalated
      to the Coordinator rather than absorbed; the reviewer self-reports the same family
      as that self-report; and the reviewer established that it and the OBJ-4 producer
      SHARE A SCRATCHPAD and therefore one orchestrating session and one filesystem. It
      may NEVER be presented as agreement between distinct models. The only partial
      mitigation is for the J4 limb alone - three extraction engines from at least two
      codebase lineages - and it does not extend to J1, J2 or J3, which are acts of
      reading and reasoning by one model family. IMP-1 on the goal head is re-confirmed
      by this round rather than re-raised.
    - >-
      F-1 IS A CONFIRMED LIVE DEFECT IN THE DRAFT'S OWN CONTROL, AND IT SURVIVED THE
      REPAIR THE PACKAGE DISCLOSED. AC-4's eighth pattern carries an uppercase literal
      against a haystack the scanner lowercases, so it can never fire. The orchestrating
      session verified this directly: the pattern alone returns zero hits on a sentence
      built to make it fire, the same pattern lowercased returns one hit on that
      sentence, and THE FULL AC-4 VOCABULARY RETURNS ZERO HITS ON IT - the control
      passes exactly the drift it exists to catch. Same defect class the package
      disclosed and repaired elsewhere in the same control; the recorded remedy audited
      gap classes, and `every gap class was widened` is not `every pattern can now
      fire`. It does NOT overturn J2, because the drift it would catch does not exist in
      the draft on an independent hand scan. NOT FIXED HERE: the artifact is
      snapshot-bound and this was an archive task. Carried forward as CF-13 with its
      one-character fix and with the general meta-check remedy.
    - >-
      F-3: `C3 CORROBORATES INDEPENDENTLY OF C4` IS OVERSTATED AND IS CORRECTED ON THE
      RECORD. C3's second clause entails C4, which is that clause at a single point, so
      the producer's C3 route is the same inference from a strictly stronger premise.
      THE BETTER VERSION, ADOPTED: C3's FIRST clause, monotonicity, needs no charging
      law at all and gives that whenever the overhead-inflated full-memory time exceeds
      the baseline NO CROSSOVER EXISTS ANYWHERE, while the metrics line returns a finite
      one - it asserts the existence of an object C3 forbids. The satisfying set is
      unchanged either way.
    - >-
      F-12, AND IT IS THIS ROUND'S OWN PROCESS DEFECT: THE REVIEWER'S LAUNCHING PROMPT
      DISCLOSED THE PRODUCER'S VENUE, ITS COMPOSED OUTCOME AND THE EXPECTED CHECKSUM
      PREFIX BEFORE ITS PHASE A. No value of the ten was disclosed, so the ten-value
      extraction is INTACT; what is not blind is the venue choice and the checksum
      agreement. THE PROMPT WAS WRITTEN BY THE ORCHESTRATING SESSION: this is a defect
      of this round's dispatch, not a fault of the reviewer, which found and reported
      an entailment channel that leaves no auditable trace and that nobody else could
      have detected. The blind-phase rule names control-plane files and commit
      messages; a prompt is neither. Carried forward as CF-15.
    - >-
      F-6, A SECOND LIVE INCONSISTENCY IN THE FROZEN CONTRACT THAT NO CARRIED-FORWARD
      ITEM NAMED. specification.yaml:49 calls control C1's tolerance `3-bit` while C1's
      own tolerance at :139 is 0.75 bit, and 3 bits is the stopping rule's rerun
      threshold at :151. Found independently by the producer - which correctly recorded
      it, called it orthogonal, and did not touch it - and by the reviewer. Added to the
      carried-forward list by DEC-20260905-5f5592 as CF-14.
    - >-
      TWO WARRANT DEFECTS IN THE RC-6 PACKAGE, NEITHER OVERTURNING ITS CONCLUSION AND
      NEITHER GROUNDS TO REJECT IT. F-2: the scope audit's `exhaustive by construction`
      warrant is literally false, covering 165 of 167 lines, the two uncovered being
      bare mapping keys read and confirmed harmless. F-4: the derivation's step 4 rests
      on an unnecessary functional-form posit that the file nowhere licenses, named
      honestly by both artifact and instrument, and avoided entirely by the reviewer's
      own derivations. A successor record noting both is the proportionate response;
      superseding an immutable artifact over a two-line coverage gap is not.
    - >-
      F-7, THE SHORTEST OVER-READING PATH IN THE PACKAGE, AND IT MUST BE SCOPED BEFORE
      ANY ENACTMENT. The draft's `fidelity ... settled and closed` reads, if quoted
      without the qualifier `frozen`, as fidelity to the PUBLISHED ARTICLE - exactly the
      gap OBJ-4 was dispatched to close and which no record had closed when the draft
      was written. On this round's evidence the stronger reading now happens to be TRUE
      for the ten values; it was not true on the evidence the draft cites, and a
      sentence that is accidentally right is still an over-reading path.
    - >-
      F-8, A STRUCTURAL LIMIT ON THE REVIEW AND NOT ON THE PACKAGE. Six classes of
      citation in the RC-6 package are unverifiable by the reviewer BY CONSTRUCTION -
      records in its blind_from or outside its read scope, statuses recomputable only by
      executing a prohibited file, every cost_model.py line locator, and two records in
      its scope that it did not read. Its J1, J2 and J3 verdicts are CONDITIONAL
      wherever the package's reasoning depends on one of them. This is a cost of a
      blind_from list correctly drawn for J4.
    - >-
      ONE REVIEWER, FOUR JOINTS, AND NO RED-TEAM PASS. Recorded in advance by
      batch.yaml as a COST. The RC-6 argument is checked ONCE. A red-team pass on the
      drafted amendment is a NAMED PRECONDITION for approving it and this round did not
      supply one, which is why the amendment stays a draft and the experiment stays
      unamended.
    - >-
      THE --batch INDEPENDENCE GATE WAS NEVER RUN, IN THE ROUND BUILT TO MAKE IT
      RUNNABLE. CF-11 gave this batch a standalone review_plan.yaml precisely so the
      checker could resolve it; the reviewer states it ran the tool in no mode and the
      composing archive task holds no shell. Recorded OUTSTANDING and NOT as a pass;
      CF-11 is discharged only in part; the plan's resolvability is asserted from its
      shape rather than demonstrated. The --blind-history mode WAS run, by the
      dispatching session, and its verbatim FAIL on the working branch and PASS on the
      detached pre-merge worktree are preserved in the snapshot receipt, with the
      binding consequence that any FUTURE blind task on this batch must be given a
      pre-merge base, never this branch and never main.
    - >-
      NOTHING IN THE TREE WAS REPAIRED. The internally unsatisfiable contract, the
      second contract inconsistency, the AC-4 dead pattern, the unannotated-memory
      serialization hazard, the RAW_PATH output-path hazard (CONTAINED by this batch's
      absolute execution prohibition, and containment expires with the batch), and the
      under-reporting citation flag all remain LIVE. The per-field anchor reachability
      statuses the licensing analysis is structured around were verified by nobody this
