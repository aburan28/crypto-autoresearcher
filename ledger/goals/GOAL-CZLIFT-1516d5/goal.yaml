  title: >-
    Characteristic-zero lifts of the prime-field ECDLP: canonical point
    sections, the Serre-Tate canonical lift, and small global points
  objective: >-
    Decide the three measurable clauses of the user's hypothesis H2
    (2026-10-09) on RQ-CZLIFT-b9f765: (A) whether the Serre-Tate canonical
    lift of an anomalous CM curve is the lift on which Smart's attack
    degenerates and whether its next digit is lift-noise; (B) whether the
    prime-to-p torsion section is a computable canonical point section on
    non-anomalous curves and what the formal logarithm does to it; (C)
    whether rational points of bounded height on rank-0..7 curves and their
    quadratic twists reduce to E(F_p) like uniform points, so that reaching
    a random residue needs exponentially large height. Every answer is an
    exact toy-scale measurement with a stated claim boundary; no attack on
    a deployed curve is attempted or claimed.
