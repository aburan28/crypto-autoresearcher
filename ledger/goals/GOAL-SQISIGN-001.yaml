research_goal:
  id: GOAL-SQISIGN-001
  title: "SQIsign: transcript-level leakage versus the matched endomorphism-ring baseline"
  objective: >-
    Test SQIsign's protocol-level assumption rather than its hard
    problem: determine whether signing transcripts are distinguishable
    from their claimed simulation at toy scale, whether any such
    distinguisher converts into secret-ideal information, and how the
    resulting charged cost compares to the KN-TECH-057 endomorphism-ring
    baselines — while leaving the hard-problem flank to GOAL-SSI-001 and
    keeping the broken SIDH torsion-image setting out of scope.
  question_ids: [RQ-SQISIGN-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-74c282
  dispatch_queue_path: coordination/goals/GOAL-SQISIGN-001/batches/BATCH-74c282/dispatch_queue.json
  latest_verified_commit: 5ffefa0ad
  related_goals: [GOAL-SSI-001]
  scheme_context:
    scheme: "SQIsign"
    family: "isogeny (the only isogeny-based Round-3 candidate)"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      Either a transcript distinguisher significant against a properly
      simulated null control at toy parameters, with a stated conversion
      path to key information and a charged cost against the KN-TECH-057
      baseline; or a measured bound showing the simulator gap is
      negligible at the sampled scale, with the sampling power honestly
      reported.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      No SQIsign Round-3 specification or reference implementation can
      be obtained under the network policy after the declared
      source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Execute BATCH-74c282: first archive the opening control plane, then dispatch
    three independent Idea Generator lanes for twelve novelty-unverified
    proposals. Snapshot every producer artifact before independent review.
    GOAL-SSI-001 retains exclusive ownership of EndRing, OneEnd, path-finding,
    and hard-problem interpretation. No experiment is authorized; every future
    transcript design still requires a genuine-simulator null before approval.
