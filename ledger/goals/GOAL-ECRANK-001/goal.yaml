# Sharded goal record. The mutable head lives here; the checkpoint log lives
# one-file-per-batch under checkpoints/ so a batch close in another worktree
# does not conflict with this file.
research_goal:
  id: GOAL-ECRANK-001
  title: Generate an elliptic curve of Mordell-Weil rank greater than 30, with a checkable certificate
  objective: >-
    Produce an explicit elliptic curve of rank >= 31 together with a witness a
    third party can verify, and state precisely over which field the claim
    holds. The goal statement did not name a base field and the two readings are
    not close, so the goal is decomposed rather than answered ambiguously:
    (a) over number fields, exhibit explicit curves and fields with certified
    rank >= 31 and drive the field degree as low as the method reaches;
    (b) over Q, establish and report the true state of the art rather than
    implying it was matched.
  question_ids: [RQ-ECRANK-27dcc5]
  active_hypothesis_ids: [H-ECRANK-28dba7]
  status: completed
  runtime:
    provider: none
    goal_id: GOAL-ECRANK-001
  campaign_budget:
    maximum_batches: 1
    total_wall_clock_seconds: 14400
    max_concurrent: 1
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  completion_criteria:
  - id: C1
    statement: >-
      An explicit elliptic curve E and an explicit number field K with a
      committed certificate establishing rank E(K) >= 31, verified by a checker
      that shares no code with the search.
    status: MET
    met_by: >-
      DEC-20260822-5a5635 on EV-ECRANK-b6c9b6. Strongest exact instance:
      E : y^2 = x^3 + 405x + 16038 (conductor 53) has rank >= 32 over
      K = Q(sqrt -2, sqrt -3, sqrt -5, sqrt 7, sqrt 13), [K:Q] = 32, by an
      argument with no numerical step. Also rank >= 64 over a degree-64 field,
      rank >= 32 over a degree-16 field (regulator-assisted), and rank >= 31
      over a quadratic field relative to the published rank-30 record curve.
  - id: C2
    statement: >-
      The state of the art for rank over Q is established from a primary source
      and reported, and the report distinguishes it from anything this program
      certified.
    status: MET
    met_by: >-
      The record over Q is 30 (Alpoge-Howell 2026), read from Dujella's rank
      records page and its rank-30 entry, superseding Elkies-Klagsbrun 29 (2024)
      and Elkies 28 (2006). Recorded in RQ-ECRANK-27dcc5, EV-ECRANK-b6c9b6 and
      KN-FIND-fd382f, in each case with an explicit statement that this program
      certified nothing over Q.
  scope_exclusions:
  - >-
    Rank >= 31 OVER Q was never a completion criterion and is NOT claimed. It is
    an open world-record problem. The method used here provably cannot approach
    it: at k = 0 the construction degenerates to the base curve's own rank. This
    exclusion is recorded so that closure on C1 can never be misread as closure
    on the harder question.
  pause_conditions: []
  next_action: >-
    None required; the goal is closed on C1 and C2. The open successor, recorded
    but not scheduled, is whether degree 8 is reachable: it needs base curves of
    rank >= 8 over Q, which the twist search measurably failed to produce (no
    twist of rank >= 5 in 364756 candidates), and which would need a
    Mestre-style construction instead.
  owner: coordinator
  created_at: '2026-08-22T05:55:00+00:00'
  updated_at: '2026-08-22T07:25:00+00:00'
