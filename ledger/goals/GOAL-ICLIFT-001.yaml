research_goal:
  id: GOAL-ICLIFT-001
  title: >-
    Exact-counting closure of the two remaining open measurement routes in the
    index-calculus (factor-base geometry) and lifting (function-field xedni)
    families
  objective: >-
    Reduce the two open measurement uncertainties that the ledger still carries
    on the index-calculus and lifting lines, using exact counting instead of
    sampling wherever the pre-registered sampling design is infeasible:
    (i) RQ-FB3-001 / H-FB3-001 — whether ANY structured factor-base geometry has
    a decomposition-yield advantage over a matched random base that GROWS with
    the group order N (the last open F3 question, approved as EXP-FB3-001 by
    DEC-20260717-002 but never executed); and
    (ii) RQ-XEDN-001 / H-XEDN-001 — the lift probability P_lift of the
    function-field xedni representation, whose EXP-XEDN-001 phase-2 census was
    contracted as rare-event sampling at p up to 809 where the predicted rate is
    below 1e-8 per slot and therefore unmeasurable inside the stated budget.
    Both routes must end in an exactly stated, independently reviewable result
    with an explicit claim boundary; neither is permitted to be presented as an
    attack improvement.
  question_ids: [RQ-FB3-001, RQ-XEDN-001]
  active_hypothesis_ids: []   # both closed within scope this batch; see batch_checkpoints
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 2
    total_wall_clock_seconds: 21600
    max_concurrent: 3
  current_batch_id: BATCH-001
  dispatch_queue_path: coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: TASK-20260724-236 (filled in the BATCH-001 ledger archive receipt)
  batch_checkpoints:
    - batch_id: BATCH-001
      protocol_snapshot_task_id: TASK-20260724-227
      protocol_snapshot_commit: 81d9e9f
      producer_snapshot_task_ids: [TASK-20260724-230, TASK-20260724-231]
      producer_snapshot_commits: [68e375f, 9f9186c]
      completed_review_task_ids:
        - TASK-20260724-232
        - TASK-20260724-233
        - TASK-20260724-234
        - TASK-20260724-235
      review_verdicts:
        TASK-20260724-232: valid_with_findings
        TASK-20260724-233: conclusion_requires_narrowing
        TASK-20260724-234: valid_with_findings
        TASK-20260724-235: conclusion_requires_narrowing
      evidence_ids: [EV-FBG-001, EV-XEDN-001]
      decision_ids: [DEC-20260724-007, DEC-20260724-008]
      knowledge_promoted: [KN-FIND-001, KN-FIND-002]
      ledger_archive_task_id: TASK-20260724-236
      outcome: both_routes_closed_within_narrowed_scope
      claim_boundary: >-
        Two scoped rejections and one durable methodological finding per route.
        No attack improvement, no cryptanalytic result, and no crypto-scale
        statement exists in this batch. RQ-FBG-001 side: the growth clause of the
        decomposition-YIELD channel is closed for the six pre-registered
        geometries under the frozen convention at N <= 2^18; it is NOT shown that
        no factor-base geometry beats a matched random base, and a Bose-Chowla
        B_3 base reaches a measured coverage ratio of 1.1071. RQ-XEDN-001 side:
        the exact uniform-measure per-slot section density of the frozen family
        is (1 - 2/p + p^-3)/(2p^3), so alpha = 3 and H-XEDN-001 is rejected AS
        POSED; this is NOT a closure of candidate B2 or of function-field xedni,
        because the frozen family is entirely iso-trivial (j = 0, the class B2
        excluded), because distinct sections were counted as a proxy for
        independent ones, and because the attack uses a constructed rather than a
        uniform measure.
      budget_used:
        producer_wall_clock_seconds: 1410
        review_runs: 9
        batches_used: 1
  completion_criteria:
    - >-
      RQ-FB3-001 receives a committed Coordinator decision on H-FB3-001 that is
      backed by an executed, independently validated battery covering every
      pre-registered cell with a terminal state, and by a stated growth verdict
      against the frozen success and falsification criteria of EXP-FB3-001.
    - >-
      RQ-XEDN-001 receives a committed Coordinator decision on H-XEDN-001 that
      resolves the EXP-XEDN-001 contract gate (alpha < 1/2 promotion versus
      alpha >= 1/2 closure) with values that are exact or carry a stated
      uncertainty, and with the reason the original sampling design could not
      deliver them recorded as a methodology finding rather than as evidence
      about the mathematics.
    - >-
      Any structural result used to justify either decision is separated into a
      proved scoped statement with explicit hypotheses, an independent
      verification artifact, and a red-team objection record.
  pause_conditions:
    - The 21600-second or two-batch campaign budget is exhausted without a positive completion criterion.
    - A required snapshot or ledger archive fails exact-path, hash, parent, or reachability verification.
    - >-
      An executor reports that a pre-registered cell is infeasible at reachable
      scale in a way that changes the frozen protocol; the Coordinator must then
      record the censoring and issue a scoped successor task rather than
      reinterpreting the cell.
    - The user requests pause.
  next_action: >-
    Run the red team's relation-coefficient control from DEC-20260724-008 as
    BATCH-002: on the surfaces the census already identified, form the Shioda
    height Gram matrix for the observed free-x integral sections at
    p = 7, 13, 19, 31, extract a Z-basis of the relation lattice, and report
    max |coefficient| of the minimal relation versus p. It costs under a CPU
    minute, needs no new family or predicate, and it is the only cheap
    measurement that can force withdrawal of a closure recorded this batch:
    coefficient growth reopens the lifting route, while boundedness shows the
    p^-3 census measured the wrong obstruction and moves the question onto the
    mechanism the literature (KN-LIT-021) actually names.
  owner: coordinator
  created_at: '2026-07-24T11:20:00-07:00'
  status_note: >-
