research_goal:
  id: GOAL-ICLIFT-001
  title: Exact-counting closure of the two remaining open measurement routes in the
    index-calculus (factor-base geometry) and lifting (function-field xedni) families
  objective: 'Reduce the two open measurement uncertainties that the ledger still
    carries on the index-calculus and lifting lines, using exact counting instead
    of sampling wherever the pre-registered sampling design is infeasible: (i) RQ-FB3-001
    / H-FB3-001 — whether ANY structured factor-base geometry has a decomposition-yield
    advantage over a matched random base that GROWS with the group order N (the last
    open F3 question, approved as EXP-FB3-001 by DEC-20260717-002 but never executed);
    and (ii) RQ-XEDN-001 / H-XEDN-001 — the lift probability P_lift of the function-field
    xedni representation, whose EXP-XEDN-001 phase-2 census was contracted as rare-event
    sampling at p up to 809 where the predicted rate is below 1e-8 per slot and therefore
    unmeasurable inside the stated budget. Both routes must end in an exactly stated,
    independently reviewable result with an explicit claim boundary; neither is permitted
    to be presented as an attack improvement.'
