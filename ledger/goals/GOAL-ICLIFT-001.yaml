    outcome: both_routes_closed_within_narrowed_scope
    claim_boundary: 'Two scoped rejections and one durable methodological finding
      per route. No attack improvement, no cryptanalytic result, and no crypto-scale
      statement exists in this batch. RQ-FBG-001 side: the growth clause of the decomposition-YIELD
      channel is closed for the six pre-registered geometries under the frozen convention
      at N <= 2^18; it is NOT shown that no factor-base geometry beats a matched random
      base, and a Bose-Chowla B_3 base reaches a measured coverage ratio of 1.1071.
      RQ-XEDN-001 side: the exact uniform-measure per-slot section density of the
      frozen family is (1 - 2/p + p^-3)/(2p^3), so alpha = 3 and H-XEDN-001 is rejected
      AS POSED; this is NOT a closure of candidate B2 or of function-field xedni,
      because the frozen family is entirely iso-trivial (j = 0, the class B2 excluded),
      because distinct sections were counted as a proxy for independent ones, and
      because the attack uses a constructed rather than a uniform measure.'
