research_goal:
  id: GOAL-SHA1-001
  title: "SHA-1: re-derive the chosen-prefix cost with memory charged, and audit whether the deployed collision detector covers the attack class or only its published instances"
  objective: >-
    Replace two inherited numbers with derived ones. Re-implement the published
    chosen-prefix collision cost model from parameters and validate it against
    the reported computation; re-cost it at 2026 hardware with the compute-price
    assumption isolated and varied rather than baked in; and separately audit
    the deployed counter-cryptanalysis detector to determine whether its
    criterion is defined over the disturbance-vector class or over the specific
    published attacks, testing it against an object constructed to evade it. No
    new SHA-1 collision is attempted and none is claimed; the deliverables are a
    validated cost model and a scoped completeness statement.
  question_ids: [RQ-SHAONE-081e3a]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MD5-001, GOAL-SHA2-001, GOAL-RSA-001]
  scheme_context:
    scheme: "SHA-1 (FIPS 180-4, deprecated) and its deployed collision-detection countermeasure"
    family: "Merkle-Damgard, ARX, disturbance-vector cryptanalysis"
    nist_track: deprecated_standard
    standardization_status: >-
      Deprecated and disallowed for new signatures, yet still load-bearing in
      Git object identifiers, legacy HMAC-SHA-1, and long-lived archives.
    why_this_scheme: >-
      The interesting object is not the hash. It is the DETECTOR — the piece of
      deployed mathematics that lets a broken primitive keep carrying
      production systems. Its coverage is a finite, auditable property that
      this program's corpus records no independent re-derivation of, and the
      audit is cheap. The cost model is the second deliverable and the more
      conventional one: a stale price quoted from a 2020 rental market is
      exactly the kind of inherited quantity GOAL-RSA-001 was opened to stop
      this program from carrying.
  non_duplication:
    - >-
      GOAL-RSA-001 owns the memory-charged NFS cost baseline and the
      core-year-versus-area-time adjudication. This goal owns a symmetric
      near-collision-block cost model. THE TWO MUST NOT DERIVE INCOMPATIBLE
      CHARGING CONVENTIONS: whichever runs second binds to the other's
      convention for memory, interconnect, and price sensitivity, or records
      why it cannot.
    - >-
      GOAL-MD5-001 owns instrument calibration and executable end-to-end
      collision generation. This goal CONSUMES an MD5-scale measured anchor for
      its cost model and does not itself own the MD5 pipeline.
    - >-
      GOAL-SHA2-001 owns the step-reduced SHA-256 frontier. Nothing here
      transfers a SHA-1 result to SHA-2 in either direction; the disturbance
      vector machinery does not apply unchanged and no cross-claim is made.
  completion_criteria:
    - >-
      A re-implemented chosen-prefix cost model with a stated reproduction
      result against the published computation, reporting whether predicted
      near-collision block count and search cost fall within a PRE-DECLARED
      factor, with failures reported as failures.
    - >-
      A charged re-costing at 2026 hardware: memory footprint, birthday-phase
      storage and access pattern, and interconnect requirement stated beside
      time, with the compute-price assumption isolated as a declared input and
      reported as a sensitivity range rather than a point.
    - >-
      A DETECTOR COMPLETENESS STATEMENT, scoped to the class actually audited:
      which disturbance vectors and near-collision structures the deployed
      criterion covers, which it does not, and the outcome of running it
      against an object constructed to evade it — including the outcome that
      the detector holds, which is a real and useful result.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive. If the cost model validates,
      the warranted knowledge entry is a KN-TECH charging convention for
      near-collision-block search, stated as the symmetric analogue of the
      factoring convention GOAL-RSA-001 produces.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The chosen-prefix papers or the counter-cryptanalysis specification
      cannot be obtained in primary text under the network policy after the
      declared source-preference order is exhausted. The detector audit is not
      attempted from a remembered description of the criterion.
    - >-
      Calibration runs at sizes this harness can reach exceed the declared
      campaign budget after cheaper falsification gates are exhausted. This is
      a budget outcome about a cost model's calibration and is never evidence
      about SHA-1 (AGENTS.md rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Open with acquisition and file the three primary sources as KN-LIT. THEN
    RUN THE DETECTOR AUDIT FIRST, NOT THE COST MODEL. It is the cheaper of the
    two deliverables, it needs no compute at all, and it is the one whose
    failure mode matters to deployed systems — whereas the cost model's worst
    case is a stale price getting slightly staler. The audit's own gate is the
    adversarial control: build the evasive object BEFORE reporting coverage, so
    the audit is capable of failing. Only then re-derive the cost model, and
    anchor it against the MD5-scale collisions GOAL-MD5-001 can actually
    measure, since SHA-1 supplies no measurement this harness can reproduce.
    Claim tier: a cost model and a scoped detector statement; never a new
    collision, never a claim about a specific deployed repository or
    certificate.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
