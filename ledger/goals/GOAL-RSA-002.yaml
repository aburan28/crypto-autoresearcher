research_goal:
  id: GOAL-RSA-002
  title: "RSA under partial information: measure the gap between the asymptotic Coppersmith frontier and the one a real lattice budget reaches, with memory charged"
  objective: >-
    Build the leakage-side companion to GOAL-RSA-001's no-information cost
    baseline. Re-implement the Coppersmith small-root constructions from primary
    text; run them over a declared leakage grid of KNOWN-ANSWER instances at
    1024- and 2048-bit moduli, where success and failure are decidable rather
    than inferred; measure reduction quality, time and PEAK MEMORY against
    lattice dimension; and report the achieved frontier beside the asymptotic
    one so the difference between "breaks in the limit" and "breaks on a
    machine" is a number this program holds rather than inherits. Use the ECDSA
    nonce-leakage setting as a cross-setting control on the reduction-quality
    model. No deployed key is touched and no factorization record is attempted.
  question_ids: [RQ-RSA-d46f02]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-RSA-001, GOAL-ECDSA-001, GOAL-SNFS-001, GOAL-MLKEM-004]
  scheme_context:
    scheme: "RSA under partial information (partial key exposure, small private exponent, structured primes, short-pad settings)"
    family: "Coppersmith small-root methods; LLL/BKZ lattice reduction"
    nist_track: not_a_nist_candidate
    standardization_status: >-
      Deployed at scale, on a published migration path away, and assessed for
      leakage severity far more often than the governing bounds are re-derived
      at the sizes being assessed.
    why_this_scheme: >-
      GOAL-RSA-001 costs breaking RSA knowing nothing. This costs breaking it
      knowing something, which is the case that actually arises. The lane has a
      property this program almost never gets: INSTANCES WITH KNOWN ANSWERS.
      The campaign manufactures its own ground truth, so there is no inference
      between running an attack and knowing whether it worked — no statistical
      artifact, no null-model argument, no strength-of-evidence judgement.
      Almost everything else this program does would be easier if it had that.
  non_duplication:
    - >-
      GOAL-RSA-001 owns the number field sieve cost model and the
      core-year-versus-area-time adjudication. THIS GOAL RUNS NO SIEVE and
      produces no factoring-from-scratch estimate. The two share a primitive and
      a charging convention and nothing else; whichever runs second binds to
      the other's memory and communication conventions or records why it cannot.
    - >-
      GOAL-ECDSA-001 owns the ECDSA nonce-leakage frontier. This goal owns the
      RSA-side partial-information frontier. THE OVERLAP IS DELIBERATE AND IS
      THE POINT: the two are the same lattice question in two settings, so each
      is a control on the other's reduction-quality model. Neither may restate
      the other's result as its own, and any transfer of a fitted model across
      the boundary is recorded as a prediction to be tested, not as evidence.
    - >-
      GOAL-MLKEM-004 owns sieve-produced dual vector distributions and
      memory-charged sieve cost. This goal runs enumeration/reduction at small
      dimensions and makes no claim about sieving asymptotics.
    - >-
      GOAL-SNFS-001 owns structured and trapdoored MODULUS GENERATION. Where
      structured primes appear here they appear as a leakage setting with the
      structure known to the campaign by construction; any claim about
      detectability of that structure belongs to GOAL-SNFS-001.
  completion_criteria:
    - >-
      A REPRODUCTION RESULT: at least one published small-root construction
      re-implemented from primary text and run against known-answer instances,
      reporting whether the achieved bound matches the published one within a
      PRE-DECLARED tolerance at a declared lattice dimension, with failures
      reported as failures and distinguished explicitly from budget exhaustion.
    - >-
      A CHARGED LEAKAGE FRONTIER: for each attack family run, achieved leakage
      threshold against lattice dimension, with reduction time, peak memory, and
      achieved root-Hermite factor, at 1024- and 2048-bit moduli, in the
      convention shared with GOAL-RSA-001 and GOAL-ECDSA-001.
    - >-
      A COST-* record following templates/research-records.md stating, at each
      modulus size, what fraction of leaked structure is exploitable inside a
      named budget — every optimistic assumption enumerated, the time-memory
      tradeoff stated, and the affected-versus-safe scope explicit.
    - >-
      A CROSS-SETTING CHECK: the reduction-quality model fitted here applied as
      a PREDICTION to the ECDSA nonce-leakage setting (or the reverse, whichever
      goal runs second), with agreement or disagreement reported as measured.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, scoped to the constructions,
      modulus sizes, lattice dimensions, and budget actually run.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The small-root constructions cannot be obtained in primary text under the
      network policy after the declared source-preference order is exhausted.
      This record deliberately contains no bounds to fall back on.
    - >-
      Lattice reduction at the declared dimensions exceeds the campaign budget
      after cheaper falsification gates are exhausted. This is a budget outcome
      about a reduction implementation and is NEVER evidence that a published
      bound is wrong (AGENTS.md rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Open with acquisition: file the specific small-root constructions as KN-LIT
    from primary text. RQ-RSA-d46f02 deliberately quotes no bound anywhere, so
    there is nothing in the ledger to design against until that filing exists —
    this is intentional and must not be worked around by recalling a constant.
    THE FIRST TECHNICAL GATE IS THE CHEAPEST DECISIVE ONE: build the
    known-answer instance generator and reproduce ONE published bound at a small
    modulus size before any frontier is mapped. A construction this program
    cannot reproduce where the answer is known will not become trustworthy at
    2048 bits, and finding that out in BATCH-001 closes the expensive branch
    early. Charge memory from the first run, not retrofitted at write-up:
    GOAL-RSA-001 and GOAL-ECDSA-001 both consume this convention. Claim tier:
    statements about a leakage model and a lattice budget. NEVER about a
    deployed key, and no third-party key material is collected or analysed at
    any point.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
