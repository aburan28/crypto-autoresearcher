  completion_criteria:
    - >-
      C1 GATE, AND IT IS UNCONDITIONAL. Lane L2 has landed: a committed, toy-scale,
      independently reviewed in-repo reproduction of the CSIDH class-group action,
      of OSIDH with the Dartois-De Feo attack, and of SIDH with the Kani-based
      torsion-point break, each with a working attack that recovers the intended
      secret at toy parameters, or a committed decision recording exactly which
      reproduction failed, how far it got, and what it would take. No novelty
      claim under this goal is admissible until C1 is discharged.
    - >-
      C2 EITHER A CANDIDATE OR A CLOSURE, PER LANE. For each of L1, L3, L4, L5:
      either a specified candidate carrying a written specification, a reference
      toy implementation demonstrating that both parties agree on the same shared
      value, its hardness assumption stated as a NUMBERED falsifiable assertion
      with quantifiers and range (profile A2), and an executed independently
      reviewed attack attempt from this repository's harnesses; or a closure at
      the docs/inventor-protocol.md section 4 standard — a NAMED OBSTRUCTION, an
      ARGUMENT, and FORWARD GUIDANCE naming the classes left open. A per-lane
      report that the lane was searched and nothing was found is a fatigue report,
      its honest status is `unverified`, and it does NOT discharge C2.
    - >-
      C3 THE SECURITY DELIVERABLE IS AN OBSTRUCTION, NOT A SURVIVAL RECORD. Where
      any candidate is described as resisting an attack class, the record carries
      an argument for WHY that class cannot apply, in the shape of the section 4
      model (the property the attack needs; the structure that supplies it; the
      reason this construction does not). A tally of attacks attempted without a
      recovered secret satisfies nothing.
    - >-
      C4 L4 REPORTS A MEASURED WORST CASE OR SAYS WHY IT COULD NOT. Either a
      certified-complete enumeration of a toy reachable public-key set with the
      full meter suite run over every element, reporting worst case, distribution
      and matched random-instance null; or a committed record of the exact
      enumeration or metering cost that made completeness unreachable at the
      budget, with the partial coverage stated as a fraction and never rounded up.
    - >-
      C5 HONEST ACCOUNTING ON EVERY DELIVERABLE: `dominated_by` checked against
      every frontier row, `sota_delta` quantitative, claim tier `toy` on every
      metered statement, and each conclusion citing the experiment, run and
      evidence IDs supporting it (AGENTS.md rules 4 and 6).
    - >-
      C6 INDEPENDENT ADMISSION AND COMMITTED CLOSURE. Independent Validator and
      Red Team admit the decisive package in sessions independent of the producer,
      and the Coordinator's evidence, decision and any warranted KN-FIND /
      KN-OPEN / KN-TECH entries are committed through a verified ledger archive.
      Any claimed candidate advantage — any statement that a construction beats an
      incumbent on any axis — routes to the `review-breakthrough` tier
      (`validator-breakthrough`, `red-team-breakthrough`) before it is recorded,
      not after.
  pause_conditions:
    - >-
      L2 UNREPRODUCIBLE WITHIN BUDGET. If two batches pass without at least the
      CSIDH toy action and one of the two published attacks reproducing in-repo,
      pause the goal. Every novelty claim downstream is unbacked without C1, and
      continuing would produce candidates this program cannot evaluate.
    - >-
      A CANDIDATE REACHES A CLAIMED ADVANTAGE. Pause dispatch immediately and
      escalate to `review-breakthrough` before any further batch, any knowledge
      promotion, or any statement outside the ledger. A construction claimed to
      beat an incumbent is the unrecoverable decision class.
    - >-
      THE GOAL DRIFTS INTO AN ADJACENT GOAL'S QUESTION. If a lane's next act would
      re-open trapdoor construction (GOAL-ECTD-001), combiner binding
      (GOAL-HYBRID-001), or CSIDH cost modelling (GOAL-CSIDH-001), pause and hand
      off rather than duplicating a live campaign.
    - >-
      TOY-TIER PRESSURE. If discharging a criterion appears to require a metered
      claim above log2 p = 32, pause rather than raise the tier; a successor goal
      with its own budget and its own review is the correct instrument.
    - >-
      L4's ENUMERATION PROVES INFEASIBLE AT EVERY TOY PARAMETER TRIED. Pause and
      record the cost wall; partial coverage reported as complete would corrupt
      the one claim this goal is uniquely positioned to make.
  next_action: >-
    DRAFT. NOT DISPATCHED, NO BATCH MINTED, NO HANDOFF WRITTEN, AND ONE DECISION
    IS OWED BEFORE ANY OF THAT.
    THE OWED DECISION, AND IT IS THE COORDINATOR'S, NOT THE DISPATCHER'S: this is
    the program's first CONSTRUCTIVE goal, and AGENTS.md, docs/inventor-protocol.md
    and docs/target-result-profile.md are all written for cryptanalysis. The
    mapping in this record's objective — assumption-class change as the
    exponent-moving analogue, section 4 closure applied to a survival claim — is
    ASSERTED HERE AND NOT YET RATIFIED. A Coordinator decision must either adopt
    it as a protocol amendment or amend it, because C2 and C3 are unenforceable
    while the standard they invoke is one this session wrote into a goal record
    rather than one the program agreed. Do not dispatch a batch first: an
    unratified standard would be discovered at review, after the work.
    THEN, AND ONLY THEN, THE FIRST BATCH IS L2 AND NOTHING ELSE. Not L5, however
    much the idea lane is the interesting one. L2 is the gate in C1, it is the
    only lane whose success criterion is unambiguous (a toy secret is recovered
    or it is not), it needs no new theory, and it is the lane that tells this
    program whether it can evaluate a key exchange at all. Order within it:
    CSIDH toy action first (smallest, no attack required, establishes the
    group-action harness), then SIDH plus the Kani break (the attack is published,
    concrete, and its reproduction is a pass/fail), then OSIDH plus Dartois-De Feo
    (hardest, and the one whose structure L3 and L5 actually need).
    ONE ZERO-COST ACT MAY BE TAKEN AT ANY TIME AND SHOULD BE TAKEN EARLY, because
    it is pure pre-compute falsification and can only save budget: run the L1
    public-invariant kill screen against the volcano-depth candidate. The depth
    vector is recoverable by factoring the conductor, so the candidate should die
    on paper, and confirming that in a record establishes the screen's format for
    every later candidate at the cost of an afternoon.
    A STANDING PROHIBITION THAT SURVIVES EVERY LATER EDIT OF THIS FIELD: nothing
    produced under this goal is a deployment recommendation, no candidate may be
    called secure, and EV-ICINV-c68f13 may not be cited as support anywhere under
    this goal while DEC-20260807-4261e3's independent-review gate is unmet.
