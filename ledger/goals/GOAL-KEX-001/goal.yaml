research_goal:
  id: GOAL-KEX-001
  title: >-
    The constructive turn: build a key-exchange candidate whose flatness
    assumptions this program measures itself instead of inheriting, and hold the
    construction to the closure standard under which "we could not break it" is
    unverified
  objective: >-
    THE PROGRAM'S FIRST CONSTRUCTIVE GOAL, AND THE REASON IT IS WORTH RUNNING IS
    NOT THAT DESIGN IS NEW HERE — IT IS THAT THE MEASUREMENTS ALREADY ARE.
    Sixty-nine goal records precede this one and none of them proposes a key
    exchange; the closest, GOAL-ECTD-001, seeks a constructive TRAPDOOR — a
    private advantage for the constructor, not a shared secret agreed between two
    parties — and this goal defers to it on that question rather than reopening
    it. What the other sixty-eight lanes do is attack schemes other people built.
    The residue of that work is a body of results whose content is an ABSENCE, and
    every one of those absences is a property that a group-action key exchange
    must ASSUME: (i) EV-ECTD-8c098d returned `scoped_homogeneity` on a five-class
    screen of ordinary F_p isogeny classes at 40-bit N — no curve in a class
    carried a confirmed attack-cost outlier under the tested Semaev/Groebner and
    rho meters (preliminary, direction `weakens`, single unreplicated batch, with
    CORR-20260806-2f98f4 attached); (ii) EXP-PAIR-21437a argues that on an
    ordinary prime-field curve every geometric endomorphism commutes with
    Frobenius and therefore acts on the prime-order subgroup as a scalar, so no
    distortion map exists; (iii) EXP-TORS-328b59 argues that Elkies torsion
    transport D_ell(E,P,Q) = (E', phi(P), phi(Q)) is publicly computable with no
    discrete logarithm and creates no new leverage; (iv) EXP-VOLC-48d4e7 records
    that for distinct ell_1, ell_2 dividing the conductor the depths
    v_{ell_1}(f_E) and v_{ell_2}(f_E) are INDEPENDENT coordinates, so a curve is
    simultaneously crater in one volcano and floor in another and any unqualified
    "E is deep" is ill-posed. ITEMS (ii), (iii) AND (iv) ARE FROZEN DRAFT
    CONTRACTS UNDER GOAL-ENDO-001 THAT HAVE NEVER BEEN RUN AND ARE NOT APPROVED;
    they enter this goal as SEEDS AND DESIGN CONSTRAINTS TO BE TESTED, never as
    established results, and no record under this goal may cite them as evidence.
    WHAT THIS GOAL DOES WITH THEM. A key exchange needs a map pi: Secrets ->
    Publics that is lossy, hard to invert, and compatible with a commuting
    action. Section 2 of docs/inventor-protocol.md rejects a tracked object whose
    projection discards nothing, on the ground that a lossless projection is a
    change of coordinates rather than a new object. Run in the constructive
    direction the same test is the cheapest possible kill for a scheme: a public
    key from which a public invariant recovers the secret is broken before a line
    of code is written. The program's meters make the second half testable too —
    for a toy group action the reachable public-key set can be ENUMERATED
    CERTIFIED-COMPLETE and every reachable public key metered, so the security
    statement becomes a measured WORST CASE OVER THE REACHABLE SET rather than
    the average-case heuristic every incumbent scheme rests on. That measurement
    is a contribution on its own, available to this repository because it already
    built the meters, and it stands whether or not any construction survives.
    SIX LANES, EACH WITH A CHEAP PRE-COMPUTE FALSIFICATION FIRST (section 8).
    L1 PUBLIC-INVARIANT KILL SCREEN. Enumerate the publicly computable invariants
    of each candidate public-key space and kill any candidate they determine.
    The worked null-object control is already in hand and must be run first
    because it costs nothing: any construction keyed on volcano depth is DEAD,
    because the depth vector (v_ell(f_E))_ell is recoverable from the curve by
    factoring the conductor — a lossless projection, hence a coordinate change
    and not a new object. A lane that cannot produce its own kill screen does not
    proceed. L2 BASELINE REPRODUCTION, AND IT GATES EVERYTHING. Reproduce in-repo
    at toy scale the CSIDH class-group action, the OSIDH descending-chain
    construction with the Dartois-De Feo attack, and SIDH with the Kani-based
    torsion-point break. This program has never built a scheme and has never
    executed these attacks; a design goal that cannot break the incumbents it
    means to improve on has not earned the word "new", and section 8 makes exact
    baseline reproduction a precondition of approval rather than a courtesy.
    L3 TORSION TRANSPORT, WHOSE CONTROL PROBABLY KILLS IT AND MUST RUN FIRST.
    EXP-TORS-328b59's claim, if it survives execution, says the Kani attack's
    auxiliary torsion input is publicly derivable in the ordinary Elkies setting
    — which admits two readings, and the deflationary one is far more likely:
    data that is publicly computable also carries no secret, so a SIDH-shaped
    protocol built on it has no hardness at all rather than an immunity. The lane
    runs the deflationary control before the hopeful measurement and records
    whichever way it falls as a closure with a mechanism. L4 COST HOMOGENEITY AS
    A MEASURED SECURITY REQUIREMENT. Over a certified-complete toy public-key set,
    run the full meter suite on EVERY reachable public key and report the worst
    case, the distribution, and a matched random-instance null. State what fails
    to extrapolate as a numbered heuristic in the sense of the target-result
    profile A2, not as a reassurance. L5 ASSUMPTION-CLASS SEARCH — the actual
    idea lane, run object-first with the established families DECLARED OFF-LIMITS
    as the primary lens: ECDH, CSIDH/CSURF/SCALLOP, SIDH/SIKE, the lattice KEMs
    (ML-KEM, NTRU, FrodoKEM), the code KEMs (HQC, Classic McEliece), hidden-order
    and class-group constructions, and hybrid combiners. Every candidate names
    its secret object, its lossy projection, its commuting operation, and a
    one-step propagation that can be measured. L6 HONEST ACCOUNTING. Every
    deliverable carries `dominated_by` and `sota_delta`; a candidate dominated by
    X25519 or ML-KEM on every axis is recorded as dominated, and that record is
    the deliverable rather than a disappointment.
    HOW THIS MAPS ONTO docs/target-result-profile.md, STATED PLAINLY BECAUSE THE
    PROFILE WAS WRITTEN FOR ATTACKS. The exponent-moving analogue for a
    construction is a change of ASSUMPTION CLASS or of the attack-cost-versus-key
    -size tradeoff, not a constant-factor or implementation gain, and a candidate
    that merely re-parameterizes an incumbent is A1-disqualified exactly as a
    cofactor polish would be. Profile elements A2 (numbered falsifiable
    heuristics), A3 (single-responsibility decomposition), A5 (average-case
    rerandomization) and A8 (honest costing) transfer unchanged and bind every
    deliverable here.
    WHAT THIS GOAL IS NOT. It is not a deployment recommendation, and no artifact
    produced under it may be described as secure or suggested for use; new key
    exchange designs are precisely the class of artifact that gets misread as an
    endorsement, and this record says once and bindingly that nothing here is
    one. It does not own trapdoors (GOAL-ECTD-001), KEM combiners
    (GOAL-HYBRID-001), or CSIDH quantum cost models (GOAL-CSIDH-001).
