research_goal:
  id: GOAL-ROS-001
  title: >-
    ROS and concurrency: measure the solver's real cost curve with literal
    forgeries, then map which instantiation choice in each deployed two-round
    Schnorr protocol is load-bearing
  objective: >-
    The ROS break removed a family of concurrent Schnorr-type protocols from
    service and produced replacements now being standardized and deployed at
    scale. The residual risk has moved from the protocol to the instantiation:
    what the binding factor is computed over, whether nonces can be derandomized
    or reused, whether sessions are separated. Measure both halves. Implement
    the ROS solver and produce literal forgery certificates at declared
    parameters, reporting cost and memory as a CURVE in the number of concurrent
    sessions and in the group order, rather than quoting an asymptotic verdict.
    Then take reference implementations of the deployed replacements, vary
    exactly one instantiation choice at a time, and produce a certificate — or a
    recorded failure to produce one within budget — for each choice. Every
    forgery is against this program's own deliberately-instantiated reference
    code and is labelled as such in the record's title.
  question_ids: [RQ-ROS-595c15]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 14400
    max_concurrent: 3
  related_goals: [GOAL-EDDSA-001, GOAL-ECDSA-001, GOAL-TECDSA-001, GOAL-WFS-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "blind Schnorr, MuSig1/MuSig2, FROST and Schnorr threshold variants; any two-round protocol resting on ROS-hardness or an algebraic one-more assumption"
    family: "Schnorr-type signatures under concurrent sessions; the ROS problem"
    nist_track: adjacent_to_standardization
    standardization_status: >-
      RECALLED, UNVERIFIED: FROST is on an IRTF/CFRG track; MuSig2 is deployed
      for Bitcoin Taproot multisignatures; blind Schnorr variants appear in
      e-cash and token issuance. NIST's threshold cryptography effort covers
      adjacent ground.
    why_this_scheme: >-
      This is the program's clearest live example of a folklore-secure
      construction failing under concurrency and being replaced in the field
      within a few years. The replacements are sound; what is unmeasured is the
      instantiation surface around them, and that surface is enumerable with
      literal forgery certificates on this program's own code. The cost curve is
      the second unmeasured quantity: the break is quoted as a verdict, and a
      curve in the concurrency parameter is what an implementer actually needs.
  non_duplication:
    - >-
      GOAL-ECDSA-001 owns ECDSA nonce leakage via lattices and Fourier methods —
      partial information about nonces from side channels. This goal assumes NO
      leakage: the adversary is a protocol participant opening concurrent
      sessions. Different adversary, different mechanism, no transfer.
    - >-
      GOAL-EDDSA-001 owns single-signature verification semantics and never
      varies the signing procedure. This goal varies signing exclusively.
    - >-
      GOAL-TECDSA-001 owns threshold ECDSA, whose failures come from auxiliary
      zero-knowledge proofs rather than from linear-combination structure in
      Schnorr nonces. Both goals produce key or forgery certificates against
      reference implementations; the mechanisms are disjoint and cross-citation
      of conclusions is prohibited.
  completion_criteria:
    - >-
      A MEASURED ROS COST CURVE: running time and memory as a function of the
      number of concurrent sessions and of group order, over a declared sweep,
      with seeds and machine model recorded.
    - >-
      LITERAL FORGERY CERTIFICATES for blind Schnorr at declared parameters,
      each verifying under an independently implemented honest verifier.
    - >-
      THE INSTANTIATION MAP: for each deployed two-round protocol implemented
      here, one row per instantiation choice, each with a certificate or an
      explicit "no certificate within declared budget", never rounded to "secure".
    - >-
      AN ASSUMPTION TABLE stating, from filed primary text, which replacement's
      proof rests on an algebraic-group-model or one-more assumption, so the
      assumption being relied on is visible rather than folded into "proven".
    - >-
      Independent Validator and Red Team sessions admit the run package,
      confirming every certificate reproduces, that each is labelled as against a
      deliberately instantiated reference, and that no record asserts a break of
      a standardized protocol.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - The ROS reference and the specifications of the protocols under test cannot be obtained in primary text after the declared source-preference order is exhausted; reconstructing a protocol from memory would manufacture a false instantiation map.
    - The solver exceeds the declared budget at every reachable parameter. Budget outcome about an implementation, never evidence of security (AGENTS.md rule 3).
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    IMPLEMENT THE SOLVER AT SMALL GROUP ORDER AND GET THE CURVE'S SHAPE FIRST.
    Blind Schnorr over a small prime-order group is fully implementable now, and
    the first question — does this program's solver reproduce the published
    scaling behaviour at all — gates everything else. Produce one literal forgery
    at a small parameter, verified by an independent verifier, then sweep the
    concurrency parameter to obtain the curve. Only after the curve reproduces
    should reference implementations of the replacements be built, because an
    instantiation map produced by an uncalibrated solver is unfalsifiable.
    Claim tier: scoped certificates against this program's own instantiations;
    never a claim about a standardized protocol, a deployed wallet, or a chain.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
