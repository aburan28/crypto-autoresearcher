research_goal:
  id: GOAL-MLKEM-001
  title: Reproducible ML-KEM cryptanalysis breakthrough exploration
  objective: >-
    Identify, novelty-screen, and independently challenge algorithmic mechanisms
    that could materially reduce the asymptotic or concrete cost of attacking
    standardized ML-KEM, while accounting for lattice reduction, decoding,
    module structure, decryption failures, side information, memory, and
    preprocessing.
  question_ids: [RQ-MLKEM-001]
  active_hypothesis_ids: [H-MLKEM-001]
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-005
  dispatch_queue_path: coordination/goals/GOAL-MLKEM-001/batches/BATCH-005/dispatch_queue.json
  latest_verified_commit: 28608fb8a48ffbb8291c82810f2867553d3fe6f1
  completion_criteria:
    - >-
      A mechanism is specified with reproducible derivation or implementation
      evidence and a fully charged attack estimate that materially improves a
      current matched baseline for at least one standardized ML-KEM parameter set.
    - >-
      Independent Reviewer and Red Team sessions verify novelty, correctness,
      scope, and the absence of uncharged oracle, data, preprocessing, or memory costs.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - All surviving mechanisms require resources beyond the declared campaign budget before a cheaper decisive gate can be constructed.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Open BATCH-006, the final batch of the six-batch campaign budget, to specify
    and run EXP-MLKEM-003: harden the validated conformance gate against its own
    surviving objections with a multi-class generator (multi-byte, alignment and
    lane, malformed-length), a strong named conformance anchor, and
    Decapsulate-path dispatch attestation including a NEON integration sample,
    then apply the hardened gate to at least one additional open-source ML-KEM
    comparison implementation to test whether the incomplete-comparison class is
    isolated to the audited wolfSSL commits or systemic (EV-MLKEM-005,
    DEC-20260724-007).
  batch_checkpoints:
