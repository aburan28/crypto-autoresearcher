research_goal:
  id: GOAL-MLKEM-001
  title: Reproducible ML-KEM cryptanalysis breakthrough exploration
  objective: >-
    Identify, novelty-screen, and independently challenge algorithmic mechanisms
    that could materially reduce the asymptotic or concrete cost of attacking
    standardized ML-KEM, while accounting for lattice reduction, decoding,
    module structure, decryption failures, side information, memory, and
    preprocessing.
  question_ids: [RQ-MLKEM-001]
  active_hypothesis_ids: []
  status: closed_at_budget
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-006
  dispatch_queue_path: coordination/goals/GOAL-MLKEM-001/batches/BATCH-006/dispatch_queue.json
  latest_verified_commit: e487652127433e4cb1f0c1de173dfa197ca23c1f
  completion_criteria:
    - >-
      A mechanism is specified with reproducible derivation or implementation
      evidence and a fully charged attack estimate that materially improves a
      current matched baseline for at least one standardized ML-KEM parameter set.
    - >-
      Independent Reviewer and Red Team sessions verify novelty, correctness,
      scope, and the absence of uncharged oracle, data, preprocessing, or memory costs.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - All surviving mechanisms require resources beyond the declared campaign budget before a cheaper decisive gate can be constructed.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  campaign_disposition:
    status: closed_at_budget
    batches_used: 6
    batches_authorized: 6
    primary_objective_met: false
    closing_decision: DEC-20260724-019
    summary: >-
      The goal sought algorithmic mechanisms that could materially reduce the
      cost of attacking standardized ML-KEM. No such mechanism was found, and no
      candidate reached a charged attack estimate against a matched baseline. The
      campaign converged instead on defensive implementation conformance, whose
      durable output is KN-FIND-001: a byte-complete differential gate that
      discriminates incomplete ML-KEM re-encryption comparisons at fix
      boundaries. The first two completion criteria are unmet and cannot be met
      by that line of work; only the procedural archival criterion holds.
  next_action: >-
    None under this goal. GOAL-MLKEM-001 is closed at its six-batch budget with
    its primary objective unmet, and no seventh batch is authorized. Continuation
    requires a new goal record whose objective matches defensive ML-KEM
    implementation conformance rather than ML-KEM cryptanalysis, and whose first
    experiment repairs the two defects EXP-MLKEM-003 exposed: a positive control
    with a component invisible to the single-byte generator, and a second
    implementation with fixed-bound hand-written assembly comparison tails
    (DEC-20260724-019, EV-MLKEM-006, KN-TECH-054).
  batch_checkpoints:
