research_goal:
  id: GOAL-SNOVA-001
  title: "SNOVA: independent security map under the wedge-product and group-action attacks"
  objective: >-
    Independently reproduce the reported SNOVA attacks at parameters
    where a recovered key or forged signature can be certified, extend
    them into a security-level map over (v, o, ell, q) with a measured
    weak-key density, and determine honestly whether any surviving
    parameter choice keeps SNOVA's size advantage over matched UOV
    variants — including the outcome that none does.
  question_ids: [RQ-SNOVA-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "SNOVA"
    family: "multivariate (UOV over a noncommutative ring / simple matrix structure)"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      A certified attack instance (recovered oil space or a verifying
      forgery) at reduced parameters, plus a fully charged cost model
      extrapolating to at least one named Round-2/Round-3 parameter set,
      plus a weak-key density estimate with stated sampling assumptions
      and confidence bounds.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the SNOVA specification nor the reported attack papers can
      be obtained under the network policy after the declared
      source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-SNOVA-001 only after the reported attacks are
    filed as KN-LIT entries from primary text. The secondhand figures in
    this record (2^8-2^39 margin loss, 1/500 weak keys at 2^97, SNOVA-I
    at 94 bits) are explicitly unverified and must not be cited as this
    program's results, or restated in any deliverable, until reproduced.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
