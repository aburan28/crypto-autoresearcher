research_goal:
  id: GOAL-QALG-001
  title: >-
    Quantum algorithmic mechanism search across ML-KEM, HQC, and CSIDH: does an
    exponent-moving quantum algorithm exist against any of the three, judged
    against each scheme's own best currently known quantum attack?
  objective: >-
    A genuine, good-faith search for an EXPONENT-MOVING quantum algorithmic
    mechanism against the best currently known quantum attack in each of three
    unrelated hard-problem lanes: Grover-only quantum sieving/enumeration
    against Module-LWE/Module-SVP (ML-KEM); Grover/quantum-walk-accelerated
    Information Set Decoding against quasi-cyclic syndrome decoding (HQC); and
    an actual improvement to Kuperberg-type dihedral hidden-subgroup-problem
    algorithms against the abelian isogeny group action (CSIDH) -- not a
    re-derivation of CSIDH's already-disputed cost constants, which
    GOAL-CSIDH-001 owns. This goal is a campaign umbrella binding three
    independently falsifiable research questions (RQ-QALG-457b41,
    RQ-QALG-122b59, RQ-QALG-74bf20), one per scheme, because ML-KEM's
    Module-LWE/Module-SVP, HQC's quasi-cyclic syndrome decoding, and CSIDH's
    commutative isogeny / abelian hidden-shift problem are three unrelated
    hard-problem families sharing no common mechanism: a result, proposed
    mechanism, cost figure, or negative finding on one lane says nothing about
    either of the other two, and no record under this goal may transfer a
    conclusion across lanes. This goal does NOT presuppose that a break
    exists: standardization of these schemes reflects that no such
    algorithmic mechanism is currently known, and a genuine possibility that
    the search concludes null in one, two, or all three lanes is the expected
    and fully legitimate range of outcomes. Every proposal under this goal is
    proof/algorithm-oriented (per CLAUDE.md "Research direction", section 8 of
    the inventor protocol, knowledge/techniques/KN-TECH-080.md) and therefore
    requires a proof_search_map -- exact bottleneck, baseline reproduction,
    observation-collision search, quantifier order, method ceiling, and
    nearby-object control -- as a cheap pre-compute falsification check before
    the Coordinator approves implementation or any expensive experiment; a
    failed proof_search_map audit is itself a useful, recordable result under
    docs/inventor-protocol.md, not a wasted proposal.
  question_ids: [RQ-QALG-457b41, RQ-QALG-122b59, RQ-QALG-74bf20]
  active_hypothesis_ids: []
  status: active
