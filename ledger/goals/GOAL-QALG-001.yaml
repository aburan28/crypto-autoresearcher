    task authorized to write one shard path thereby created the SHARDED
    DIRECTORY without performing the conversion that would have moved the head
    into it. Nothing is lost and nothing is corrupted; a conversion was never
    begun.
    WHY IT IS DANGEROUS DESPITE VALIDATING CLEAN. tools/validate_ledger.py
    MERGES the two layouts before checking anything, so no check fires and
    nothing errors. But ANY TOOL THAT RESOLVES SHARDING BY TESTING isdir FIRST
    will find ledger/goals/GOAL-QALG-001/, look inside it for goal.yaml, fail to
    find one, AND SILENTLY SKIP THIS GOAL ENTIRELY — no error, no warning, an
    active goal simply absent from the output. A portfolio sweep on 2026-08-18
