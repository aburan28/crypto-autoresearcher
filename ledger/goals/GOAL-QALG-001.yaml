    HOW IT AROSE, FROM THE SHARD'S OWN TEXT. The shard was written by
    TASK-20260813-01150b, whose declared write_scope was
    "ledger/goals/GOAL-QALG-001/checkpoints/BATCH-d4b33f.yaml only" — the shard
