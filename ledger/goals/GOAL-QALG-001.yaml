  non_duplication:
    - >-
      GOAL-MLKEM-001 (closed_at_budget) and GOAL-MLKEM-005 (active) own
      RQ-MLKEM-001: the search for ANY algorithmic mechanism -- classical or
      quantum, lattice-geometric, deployment-parameter-based, or
      decryption-failure-based -- that materially improves cryptanalysis of
      standardized ML-KEM, evaluated against the best matched baseline in
      whatever cost model applies. RQ-QALG-457b41 under this goal is scoped
      narrowly and exclusively to QUANTUM algorithms that would move the
      exponent of the best currently known QUANTUM attack (Grover-only) on
      the underlying Module-LWE/Module-SVP hardness assumption. Neither lane
      inherits the other's constraints or findings: GOAL-MLKEM-005's "the
      algebra is closed" inherited_constraint concerns a classical
      structural-attack line and does not bind this goal's quantum-specific
      search, and no mechanism, cost figure, or conclusion from either
      GOAL-MLKEM-001/005 batch may be cited as evidence under RQ-QALG-457b41
      without independent verification, nor may a finding under
      RQ-QALG-457b41 be cited into GOAL-MLKEM-005's campaign.
    - >-
      GOAL-HQC-001 (active) owns HQC's decoding-failure-rate model
      correctness under direct measurement at reduced parameters, plus a
      memory-charged CLASSICAL ISD baseline at HQC's selected parameters, plus
      a separate timing/side-channel claim class -- NOT a quantum-mechanism
      search. RQ-QALG-122b59 under this goal is scoped narrowly and
      exclusively to QUANTUM algorithms that would move the exponent of the
      best currently known QUANTUM attack (Grover/quantum-walk-accelerated
      ISD) on quasi-cyclic syndrome decoding. GOAL-HQC-001's DFR-model results
      and classical ISD cost figures do not bear on whether a better quantum
      decoding algorithm exists, and nothing found under RQ-QALG-122b59 bears
      on HQC's DFR model correctness or its classical ISD baseline; neither
      goal's records may be cited into the other as load-bearing evidence.
    - >-
      GOAL-CSIDH-001 (draft) owns RECONSTRUCTION of published Kuperberg/
      dihedral-HSP cost estimates for CSIDH from their own stated model
      switches (oracle cost model, quantum memory model, Kuperberg variant and
      parameters, reversible group-action gate cost, depth limits), isolation
      of the "disagreement kernel" between those published estimates, and a
      classical reversible-circuit gate count for the group action -- it
      explicitly does NOT adjudicate CSIDH's security level and explicitly
      does NOT search for a new algorithmic mechanism. RQ-QALG-74bf20 under
      this goal is the opposite motion: it takes the best published
      Kuperberg-type algorithm as a fixed target, reproduced from its own
      stated assumptions, and searches for a genuinely NEW mechanism that
      would beat it -- an exponent-moving improvement to the dihedral HSP
      algorithm itself, not a re-derivation of disputed constants. No cost
      figure, switch value, or disagreement-kernel finding from GOAL-CSIDH-001
      may be adopted as a baseline under RQ-QALG-74bf20 without independent
      re-derivation, and no mechanism proposed under RQ-QALG-74bf20 may be
      cited as resolving GOAL-CSIDH-001's disagreement kernel or as an
      adjudication of CSIDH's security level -- both goals independently
      inherit the same "no security-level verdict" discipline for their own
      reasons and neither goal's records satisfy the other's completion
      criteria.
    - >-
      WITHIN THIS GOAL, the same discipline applies across its own three
      lanes: no mechanism, heuristic, cost figure, proof_search_map audit
      result, or falsification finding under RQ-QALG-457b41 (ML-KEM),
      RQ-QALG-122b59 (HQC), or RQ-QALG-74bf20 (CSIDH) transfers to either of
      the other two. Each is an independently falsifiable question with its
      own baseline, own best-known-attack comparison, and own completion
      state; this goal record is a campaign umbrella and a shared budget, not
      a shared result space.
  completion_criteria:
    - >-
      For EACH of the three sub-lanes independently (RQ-QALG-457b41 /
      ML-KEM, RQ-QALG-122b59 / HQC, RQ-QALG-74bf20 / CSIDH), the lane reaches
      one of two conclusion states: (a) POSITIVE -- a quantum algorithmic
      mechanism is specified with a proof_search_map, survives baseline
      reproduction and novelty screening, and reaches a fully charged
      asymptotic-complexity claim (heuristic-validation experiment at
      declared scale plus concrete-cost table, per CLAUDE.md's four
      asymptotic-complexity promotion gates) that materially improves on that
      lane's own best-known-quantum-attack baseline for at least one
      standardized parameter set; or (b) NULL-BY-SEARCH -- a rigorous
      falsification search is completed per docs/inventor-protocol.md
      (lossy-projection test, null-object controls, proof_search_map audits
      across the candidate mechanisms considered) and written up with the
      specific obstruction(s) found. A negative result on any single
      candidate, or several, is NOT itself a completion criterion for a lane
      -- only a properly documented, independently reviewed CONCLUSION
      (state (a) or state (b)) is.
    - >-
      Independent Validator and Red Team sessions verify, for any lane
      reaching state (a): novelty, correctness, scope, and the absence of
      uncharged oracle, circuit-depth, memory, or preprocessing costs. For any
      lane reaching state (b): the completeness and validity of the
      falsification search (that the candidates considered were the live,
      non-dominated ones; that the lossy-projection and null-object controls
      were properly applied).
    - >-
      Coordinator evidence, decision(s), and any warranted knowledge entries
      are committed through verified ledger archive(s), with lane-level
      conclusions recorded and reviewed separately and never merged into a
      single cross-lane claim.
    - >-
      This GOAL record itself may reach status: completed once all three
      lanes have independently reached a conclusion state (a) or (b), or have
      been explicitly closed as a lane with a named obstruction (mirroring
      GOAL-MLKEM-005's non_terminal_conditions discipline: a lane closure
      retires that LANE, not this goal, until all three are accounted for).
  pause_conditions:
    - The five-batch campaign budget is exhausted without an admissible next
      mechanism or completed falsification search in any lane still open.
    - A definitive infrastructure, authentication, or dependency blocker
      prevents the next approved task.
    - The user asks for a pause.
