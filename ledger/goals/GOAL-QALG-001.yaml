    AN ACTIVE GOAL IS WORSE THAN A LOUD FAILURE, WHICH IS WHY THIS IS WRITTEN
    INTO THE HEAD RATHER THAN LEFT TO BE REDISCOVERED. Tool authors: resolve the
    FLAT path as a fallback, or treat a goal directory lacking goal.yaml as an
    ERROR rather than as an absent goal.
    A SECOND, MILDER CONSEQUENCE. BATCH-d4b33f is now checkpointed in TWO
    PLACES — the inline batch_checkpoints entry below and the write-once shard —
    while BATCH-dbf57a is checkpointed ONLY inline, with no shard. The two
    BATCH-d4b33f records do not contradict each other: the inline entry is a
    summary of what the shard records at length. A reader must nonetheless know
    both exist.
    WHAT IS DELIBERATELY NOT DONE HERE. THE LAYOUT IS NOT CONVERTED. Completing
    the conversion is a tools/shard_goal.py operation requiring a shell this
    audit did not have, and CLAUDE.md directs that a goal is converted when
    someone next has it open substantively and NEVER IN BULK — so it belongs to
    whoever next works this goal's research, not to a bookkeeping pass. WHOEVER
    DOES IT MUST NOTE ONE HAZARD: checkpoints/BATCH-d4b33f.yaml ALREADY EXISTS
    AND IS WRITE-ONCE, so a converter that emits one shard per inline
    batch_checkpoints entry must not overwrite or re-emit it. For that batch the
    shard is the authority and the inline entry is the summary.
