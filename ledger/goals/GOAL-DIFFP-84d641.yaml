  related_goals: [GOAL-MD5-001, GOAL-SHA1-001, GOAL-SHA2-001]
  scheme_context:
    scheme: >-
      MD5 (RFC 1321) and SHA-1 (FIPS 180-4), full and step-reduced, collision /
      near-collision setting. SHA-0 (FIPS 180) is the nearby-object control for
      the message expansion and is not a target.
    family: >-
      Merkle-Damgard, ARX, differential cryptanalysis of hash functions:
      message-difference characteristics with sufficient bitconditions, and
      disturbance vectors from the linearized message-expansion code.
    nist_track: >-
      MD5 withdrawn; SHA-1 deprecated and disallowed for new signatures.
    standardization_status: >-
      Neither is a live security margin. The scientific content is the structure
      of the difference space and the reach of a search over it, which is what
      transfers to primitives whose margins are live.
    why_this_scheme: >-
      Because the difference space is the one part of these primitives that is
      LARGE, ENUMERABLE IN PLACES, and unexamined here. SHA-1's disturbance
      vector is a codeword of a linear code, so "do the published families cover
      the usable part" is a decidable question rather than a rhetorical one, and
      this program's corpus answers it nowhere. And because the assumption that
      makes the question look uninteresting -- that the published paths exhaust
      the space -- is exactly the premature closure docs/inventor-protocol.md
      names as a failure mode symmetric with overclaiming. Both answers are
      results.
  non_duplication:
    - >-
      THIS GOAL OWNS THE SEARCH OVER DIFFERENCE SPACE for previously unpublished
      differential paths in MD5 and SHA-1, full and step-reduced, AND THE
      ADJUDICATION OF WHAT "NEW" MEANS -- the census, the declared equivalence
      relation, the verifier, and their controls. No other goal owns any of
      these.
    - >-
      GOAL-MD5-001 OWNS INSTRUMENT CALIBRATION FOR THE SYMMETRIC LANE. Its
      completion criterion is that the automated characteristic search
      REDISCOVERS a published MD5 collision path unaided from the specification
      and drives it to a literal colliding pair; it also owns the MITM/biclique
      preimage method-ceiling audit and the measured MD5 cost anchor. This goal
      USES a search solver, it does not validate one.
      BINDING HANDOFF RULE: IF A BATCH HERE FINDS ITSELF VALIDATING THE SEARCH
      SOLVER RATHER THAN USING IT -- measuring whether the encoding, the solver
      version, the seed or the ceiling is what produced an outcome, rather than
      measuring the difference space -- THAT WORK BELONGS TO GOAL-MD5-001 AND IS
      HANDED OFF, NOT ABSORBED. The handoff is a decision record naming the
      observation, the tasks that produced it, and the GOAL-MD5-001 batch it is
      offered to; this goal's batch then ends that task and continues on its own
      object or pauses. Absorbing solver-validation work here would both
      duplicate GOAL-MD5-001 and contaminate its blind-calibration criterion.
    - >-
      GOAL-MD5-001'S BCP-1 QUARANTINE IS NOT CROSSED. The single published MD5
      characteristic held in this repository is quarantined at
      coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
      (sha256 e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5)
      so that GOAL-MD5-001's blind rediscovery criterion stays falsifiable. No
      task of this goal reads it, and every task attests non-reading. It enters
      the census as a POINTER BY SHA256 with status `quarantined_not_read` and
      an UNDETERMINED orbit. Opening it from this goal would launder another
      goal's firewall; the honest cost -- an MD5 census with no readable path
      data -- is recorded as a measured acquisition gap instead.
    - >-
      GOAL-SHA1-001 (draft) OWNS THE CHOSEN-PREFIX COST MODEL AND THE DEPLOYED
      COLLISION-DETECTOR AUDIT: re-deriving the published chosen-prefix cost from
      parameters, re-costing it at 2026 hardware with memory charged, and
      deciding whether the counter-cryptanalysis criterion is defined over the
      disturbance-vector class or over the published attack instances. THE
      BOUNDARY IS SHARP AND CUTS THROUGH THE SAME WORD: that goal asks what a
      DETECTOR covers over the disturbance-vector class; this goal asks what the
      PUBLISHED CENSUS covers over the disturbance-vector class. If the census
      and equivalence built here turn out to be usable by the detector audit,
      they are offered to GOAL-SHA1-001 as an input with their scope attached;
      this goal never states a detector-coverage conclusion, never constructs an
      object to evade a detector, and never re-derives a chosen-prefix cost.
    - >-
      NO COST MODEL AND NO NEW COLLISION. This goal produces no chosen-prefix
      cost figure (GOAL-SHA1-001) and no measured end-to-end MD5 collision
      anchor (GOAL-MD5-001). A conforming-path certificate at a step-reduced
      parameter set is in scope; a full-primitive collision is not attempted and
      would in any case restate a published result.
    - >-
      GOAL-SHA2-001 owns the step-reduced SHA-256 frontier. Nothing here
      transfers to SHA-2 in either direction; the disturbance-vector machinery
      does not apply unchanged and no cross-claim is made.
  claim_ceiling: >-
    BATCH 1 TOPS OUT AT `analyzed`. NO PATH IS CLAIMED NEW ON BATCH-1 ARTIFACTS,
    AND NO CRYPTANALYTIC IMPROVEMENT OF ANY KIND IS CLAIMED. Batch 1 produces
    adjudication machinery and its controls; the machinery's verdicts are claims
    about a CENSUS and a DECLARED EQUIVALENCE, scoped to both, and are exactly as
    strong as the census is complete. A NON-MEMBER verdict against an incomplete
    census means "not in this census", never "not in the literature" and never
    "new". A MEMBER verdict means "equivalent to a census entry under the
    declared, verified generators", never "identical to a published path".
    Three of CLAUDE.md's four supported-promotion gates are structurally unmet by
    a batch of this kind and the fourth is not attempted, so no batch-1 record
    may reach `supported`. This goal carries no asymptotic-complexity claim at
    present; if a later batch proposes one, all four promotion gates in
    agents/coordinator.md apply before it may move toward `supported`, and it
    may reach `analyzed` and no further until they do.
  completion_criteria:
    - >-
      AN ADJUDICATOR THAT CAN ANSWER NO AND CAN ANSWER YES: a committed,
      machine-readable census with per-entry citation provenance; a declared
      equivalence relation whose generators are each individually VERIFIED to map
      conforming paths to conforming paths (or excluded and listed as
      unverified); and a verifier that adjudicates candidate-vs-census membership
      and passes BOTH controls -- planted-positive recall of 100% over every
      planted entry and every image of it under every verified generator, and
      zero false positives on the declared random-negative null run against a
      census containing plantable entries. A FAILURE OF EITHER CONTROL SATISFIES
      THIS CRITERION TOO, provided the failing case is reported with its integer
      counts and its named cause: it says the adjudication problem is harder than
      the design assumed, which is the thing this goal exists to find out.
    - >-
      A MEASURED COVERING STATEMENT: the number of distinct orbits the readable
      census occupies under the declared equivalence, and the measured fraction
      of a declared, enumerable, budget-feasible slice of the difference space
      that those orbits cover -- with the slice's definition fixed before
      acquisition and the completeness of the census stated as the scope of the
      number. If the covering is high, the obstruction is recorded as an
      `obstruction` block with a quantity, units, error bars, the runs it is read
      from, and its `resource_check`. If it is low, the remainder is the search
      target and its size is the budget argument.
    - >-
      A SEARCH RESULT OVER THE REMAINDER, SCOPED HONESTLY: at least one bounded
      search over a declared slice of the difference space that either (a)
      returns a candidate path adjudicated NON-MEMBER against the census, driven
      to a literal conforming message pair re-verified by an independent
      reference implementation, and reported as "not in this census" with the
      census's completeness attached and NO novelty claim beyond it; or (b)
      returns nothing and reports the exhausted slice, the solver, the encoding,
      the seed, the ceiling and the measured obstruction. BOTH OUTCOMES SATISFY
      THIS CRITERION. A count of rejected difference vectors with no named,
      measured obstruction does NOT.
    - >-
      Independent Validator and Red Team sessions admit each claim-relevant run
      package, verifying controls, certificates, the census provenance, the
      equivalence generators' verification status, and the absence of uncharged
      preprocessing, memory, oracle or randomness assumptions.
    - >-
      Coordinator evidence, decision and any warranted knowledge entry are
      committed through a verified ledger archive and published on a branch with
      an open PR against main. A working adjudicator warrants a KN-TECH entry
      recording the census schema, the equivalence generators with their
      individual verification status, and the two controls -- because the
      adjudication problem is the reusable part and it recurs for every
      primitive this program will ever ask "is this new" about.
  pause_conditions:
    - >-
      The six-batch campaign budget is exhausted without an admissible next
      mechanism.
    - >-
      NO PRIMARY SOURCE CARRYING ACTUAL PATH OR DISTURBANCE-VECTOR DATA CAN BE
      OBTAINED under the network policy after the declared source-preference
      order is exhausted, leaving the census unpopulatable for both primitives.
      This is a live risk measured at opening, not a hypothetical: the corpus
      today holds one MD5 path source whose data is quarantined under another
      goal's firewall, and no SHA-1 disturbance-vector source at all. If it
      materialises, the goal pauses with the machinery and the gap recorded, and
      the gap IS the result -- this program cannot adjudicate novelty for either
      primitive and now knows why.
    - >-
      The equivalence relation cannot be given a verified generating set: every
      candidate generator fails its conforming-path check, so no canonical form
      is defensible. This would be a genuine and reportable negative result about
      the adjudication problem, recorded with the failing checks, and it pauses
      the search rather than licensing an unadjudicated one.
    - >-
      A batch's work turns out to be solver validation rather than difference-
      space measurement. That task ends and is handed off to GOAL-MD5-001 per
      non_duplication; if it is the whole batch, the goal pauses pending that
      goal's result. This ends a task, not this goal, and never both silently.
    - >-
      Search runs at sizes this harness can reach exceed the declared campaign
      budget after cheaper falsification gates are exhausted. This is a budget
      outcome about a solver and is NEVER evidence about the difference space
      (AGENTS.md rule 5).
    - >-
      A definitive infrastructure, authentication or dependency blocker prevents
      the next approved task.
