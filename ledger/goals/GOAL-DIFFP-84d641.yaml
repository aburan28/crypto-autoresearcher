research_goal:
  id: GOAL-DIFFP-84d641
  title: >-
    MD5 and SHA-1 differential paths: search the difference space for previously
    unpublished characteristics and disturbance vectors, and first build the
    census, the equivalence relation and the verifier that make "new" a
    falsifiable word
  objective: >-
    Own the SEARCH OVER DIFFERENCE SPACE for MD5 and SHA-1, full and
    step-reduced, and own the adjudication of what "new" means. The tracked
    object is the differential path itself -- for MD5 a message-difference
    vector plus its signed bit-difference path and sufficient conditions, for
    SHA-1 a disturbance vector from the linearized message-expansion code plus
    the near-collision path it induces. The campaign's first move is
    deliberately cheap and deliberately falsifiable: a claim that a path is NEW
    is unfalsifiable until this program holds (a) a machine-readable census of
    published paths and disturbance vectors with citation provenance, (b) a
    DECLARED equivalence relation fixing when two paths are the same object, and
    (c) a verifier that adjudicates a candidate against the census under that
    relation, with a null control proving it can answer NO. Batch 1 builds
    exactly those three and their controls, spends no large compute, and can
    fail informatively in both directions -- if the published families already
    tile the reachable space that is a named obstruction with a measured
    covering quantity, and if the census collapses to very few orbits the space
    of genuinely new paths is larger than assumed. Only after that gate does any
    batch spend budget searching.
