research_goal:
  id: GOAL-AES-002
  title: >-
    Full-round AES: does any named tracked object beat the definitional
    exhaustive-key-search reference, or yield a scoped barrier statement?
  objective: >-
    Against the locally pinned, FIPS-197-verified AES ground truth and under a
    frozen cost model committed before any measurement, generate and screen
    object-first cryptanalytic candidates on FULL-ROUND single-key
    AES-128/192/256 (10/12/14 rounds) — each naming its tracked object, each
    passing the lossy-projection test and deduplication against the established
    families before earning compute — and produce either (a) a certified
    single-key key recovery whose end-to-end charged cost is materially below
    the DEFINITIONAL exhaustive-key-search reference at that key size, or
    (b) a conditional full-round construction whose numbered heuristics,
    proof decomposition and concrete-cost table are archived and independently
    reviewed, reaching `analyzed`, or (c) a scoped barrier statement, with an
    archived checkable derivation, naming why a specific full-round object
    class cannot yield the sought improvement and naming what remains open.
    THE OBJECTIVE IS EXPLICITLY NOT "beat the published state of the art":
    that comparison is not adjudicable in this environment and RQ-AES-002's
    claim_tier_ceiling forbids asserting it in either direction.
  question_ids: [RQ-AES-002]
  active_hypothesis_ids: []
  status: paused
  status_note_20260831_pause: >-
    SET TO paused 2026-08-31 BY DEC-20260831-3ab565 UNDER DECLARED PAUSE
    CONDITION P3 (INFRASTRUCTURE): the subagent runtime account balance
