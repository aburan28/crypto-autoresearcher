research_goal:
  id: GOAL-AES-002
  title: >-
    Full-round AES: does any named tracked object beat the definitional
    exhaustive-key-search reference, or yield a scoped barrier statement?
  objective: >-
    Against the locally pinned, FIPS-197-verified AES ground truth and under a
    frozen cost model committed before any measurement, generate and screen
    object-first cryptanalytic candidates on FULL-ROUND single-key
    AES-128/192/256 (10/12/14 rounds) — each naming its tracked object, each
    passing the lossy-projection test and deduplication against the established
    families before earning compute — and produce either (a) a certified
    single-key key recovery whose end-to-end charged cost is materially below
    the DEFINITIONAL exhaustive-key-search reference at that key size, or
    (b) a conditional full-round construction whose numbered heuristics,
    proof decomposition and concrete-cost table are archived and independently
    reviewed, reaching `analyzed`, or (c) a scoped barrier statement, with an
    archived checkable derivation, naming why a specific full-round object
    class cannot yield the sought improvement and naming what remains open.
    THE OBJECTIVE IS EXPLICITLY NOT "beat the published state of the art":
    that comparison is not adjudicable in this environment and RQ-AES-002's
    claim_tier_ceiling forbids asserting it in either direction.
  question_ids: [RQ-AES-002]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null

  # ===================================================================
  # WHY THIS GOAL IS SEPARATE FROM GOAL-AES-001, AND WHAT IT DOES NOT TOUCH.
  # ===================================================================
  relationship_to_GOAL_AES_001: >-
    GOAL-AES-001 is bound to RQ-AES-001, whose claim_tier_ceiling is toy /
    reduced-round only and whose scope lists full-round AES as OUT of scope.
    A full-round directive therefore cannot be executed inside it, and
    smuggling one in would retroactively lift a ceiling under which four
    batches of reviewed evidence were produced. THIS GOAL DOES NOT PAUSE,
    CLOSE, SUPERSEDE, RE-SCOPE, RE-BUDGET OR REPRIORITIZE GOAL-AES-001. That
    goal remains `active` at BATCH-004 with its single next action (draft,
    commit and dispatch the BATCH-005 queue) intact, its 34500 s ceiling
    intact, its maximum_batches of 6 intact, and its standing research
    constraints intact. No second of GOAL-AES-001's budget is charged to this
    goal and no second of this goal's budget is charged to that one.
    RESOURCE CONTENTION IS REAL AND IS RULED ON: both campaigns run on the same
    4 cores in the same session, so max_concurrent 3 is a cap ACROSS BOTH
    GOALS, not 3 each. If the dispatching session cannot honour that, this
    goal's BATCH-001 waits; it does not run degraded.
    PRIOR WORK IS AN INPUT, NOT A PREMISE. EV-AES-001..004, KN-FIND-028 and
    KN-FIND-029 may be cited here as inputs, each carrying its original scope
    verbatim and none upgraded by being cited from a full-round question. The
    binding restatements are in RQ-AES-002 relationship_to_RQ_AES_001 (iii).

  campaign_budget:
    maximum_batches: 3
    total_wall_clock_seconds: 22500
    accounting_basis: measured_wall_clock_of_completed_tasks
    max_concurrent: 3
    sizing_basis: >-
      BOTTOM-UP FROM GOAL-AES-001's MEASURED PER-ROLE ACTUALS, at or near each
      role's observed maximum, with NO cushion added on top — the sizing
      discipline of protocol-amendment-GOAL-AES-001-005 Part A, adopted here at
      this campaign's opening rather than after three budget acts. Per-role
      lines: executor producer 1600 (observed 792 / 892 / 1609 / 1510);
      snapshot archive 500 (observed 378, one datum, and the provenance gate
      has grown since); independent validation 1400 (observed 1046 / 1370);
      red team 1000 (observed 668 once — ONE TASK IS NOT A DISTRIBUTION and
      sizing to the single low observation is the error that amendment 005
      exists to stop making); ledger archive 900; coordination act 700-900.
      BATCH-001 8600 = coordination-and-protocol act 900 + queue drafting 700 +
      two concurrent producers 3200 + snapshot 500 + validation 1400 + red team
      1000 + ledger archive 900.
      BATCH-002 7700 = queue drafting 700 + two concurrent producers 3200 +
      snapshot 500 + validation 1400 + red team 1000 + ledger archive 900.
      BATCH-003 6200 = queue drafting 600 + one producer 1600 + snapshot 500 +
      validation 1400 + red team 1000 + ledger archive and terminal goal record
      1100.
      8600 + 7700 + 6200 = 22500 exactly. There is NO rounding slack and no
      contingency; the maxima ARE the contingency.
    why_three_batches_and_not_six: >-
      A DELIBERATE UNDER-SIZING RELATIVE TO AMBITION, TAKEN AS A JUDGEMENT AND
      RECORDED AS ONE. GOAL-AES-001 opened at six batches against a target whose
      prior was already stated as overwhelming, took THREE budget acts, and four
      batches in had produced no claim about AES at any round count. This goal's
      prior is WORSE, not better: full-round AES is the harder target and this
      environment forecloses the computational methods that produced most
      recalled reduced-round progress. Sizing a new campaign to five or six
      batches at the opening would be sizing the budget to the ambition, which
      is the exact failure protocol-amendment-GOAL-AES-001-005 Part A named
      against itself. Three batches buys one protocol-and-ideation batch, one
      screening-and-gate batch, and one consolidation-and-terminal-record batch.
      A FOURTH BATCH REQUIRES A VERSIONED AMENDMENT ON THE MERITS OF WHAT THE
      FIRST THREE ACTUALLY PRODUCED, which is a better decision point than
      pre-authorising work whose value is unknown.
    what_a_red_team_should_attack_here: >-
      NAMED BY THIS COORDINATOR AGAINST ITSELF, since a rationale naming no
      attack surface is not a rationale. (1) THREE BATCHES MAY BE TOO FEW TO
      REACH ANY CRYPTANALYSIS AT ALL: BATCH-001 is largely protocol (CM-1, the
      BLK-1 amendment, the throughput receipt) and GOAL-AES-001's experience is
      that protocol and instrument work consumes whole batches. The honest
      answer is that this is intended — if three batches produce only protocol
      and an object enumeration, the correct outcome is `paused` with that
      recorded, not a fourth batch taken on momentum. (2) THE PER-ROLE FIGURES
      ARE BORROWED FROM ANOTHER GOAL'S CAMPAIGN and this goal has no measured
      data of its own; the snapshot, ledger and coordination lines rest on
      numbers that were charged at declaration and never measured even there.
      (3) 22500 s FOR A CAMPAIGN WHOSE OWN MOTIVATION SAYS IT WILL ALMOST
      CERTAINLY FIND NOTHING is on its face indefensible; the answer offered is
      that premature closure is a declared failure mode and the deliverable is
      the enumeration and the barrier statements, not the break — and that
      answer is only as good as those deliverables turn out to be.

  # ===================================================================
  # ACCOUNTING AND CLOCK CONVENTION.
  # INHERITED BY EXPLICIT ADOPTION, NOT BY DEFAULT.
  # ===================================================================
  budget_accounting:
    basis: measured_wall_clock_of_completed_tasks
    inheritance_basis: >-
      ADOPTED BY EXPLICIT REFERENCE AT THIS GOAL'S CREATION, AND THE
      DISTINCTION MATTERS. protocol-amendment-GOAL-AES-001-003 and
      protocol-amendment-GOAL-AES-001-005 are scoped to GOAL-AES-001 and do NOT
      bind another goal automatically. This record ADOPTS their conventions as
      GOAL-AES-002's founding practice, citing them as the campaign's current
      best practice, so they are in force from BATCH-001 and require no
      amendment here. Adopted: amendment 003's measured-clock accounting basis;
      amendment 005 Part B C1-C6 in full (the clock convention); amendment 005
      Part A's coordination-act charging fix; and the artifact-provenance gate
      of amendment 004 Part B AS CORRECTED by amendment 005 Part C.
    clock_convention: >-
      protocol-amendment-GOAL-AES-001-005 Part B, C1 THROUGH C6, ADOPTED
      VERBATIM AND IN FORCE FROM BATCH-001. (C1) CHARGED CLOCK: SESSION
      ELAPSED, authoring-inclusive, from the task's first act to its terminal
      receipt, as observed by the dispatching session. Compute seconds are NOT
      the charged clock. (C2) STOP-CONDITION CLOCK: THE PRODUCER'S OWN
      COMMITTED UTC STAMPS. Every dispatched task in every role, INCLUDING
      Coordinator tasks, writes as its FIRST act a stamp record in its own task
      directory carrying start_utc, start_epoch, declared_wall_clock_seconds and
      a binding_stop_utc COMPUTED as start plus declared; writes a further stamp
      at each major section boundary carrying utc, elapsed_s and a marker naming
      what was completed; HALTS at binding_stop_utc, records halted_on_budget
      truthfully and NAMES the work dropped; and COMMITS those stamps as a
      declared artifact. The TASK-20260801-810 budget block is the reference
      implementation. A halt at binding_stop_utc is INFRASTRUCTURE SIGNAL,
      never a negative mathematical result (AGENTS.md rule 5), and dropped work
      is SCOPE, never an answer (rule 8). (C3) DISCHARGING C2 IS FULL
      COMPLIANCE even where the charged figure later exceeds the declaration;
      any residual is a campaign-side accounting fact and is NEVER a producer
      defect and never a returned task. Correspondingly a producer may NOT
      offer compute seconds as evidence of budget compliance. (C4) Declarations
      are calibrated against AUTHORING-INCLUSIVE elapsed, with the compute
      component reported SEPARATELY in its own field. (C5) CONFLICT RESOLUTION:
      the charged figure is the LARGEST session-elapsed figure on the record
      for that task from any source; every other figure is preserved marked
      `on_record_not_charged` with its source named; no spread is ever resolved
      silently and no figure is ever deleted. Producer stamps GOVERN THE
      TIMELINE (they are readable from committed bytes) while the largest-figure
      rule GOVERNS THE CHARGE, on the stated mechanism that a producer stamp
      ends at its final write and cannot cover the task's tail. (C6) A completed
      task whose duration was not reported is charged at its DECLARED budget and
      never at zero; under C2 that should not recur, and if it does a defect is
      recorded against the campaign's instrumentation, not against the producer.
    coordination_acts_are_charged_from_batch_001: >-
      THE ONE PLACE THIS CAMPAIGN STARTS AHEAD OF ITS PREDECESSOR. GOAL-AES-001
      discovered at its FIFTH batch that coordination acts performed outside
      the queue — drafting a queue and its handoffs, authoring an amendment,
      taking a decision — consume real session elapsed and had been charged at
      ZERO for four batches, leaving an under-count it recorded as UNQUANTIFIED
      AND UNRECOVERABLE. Here EVERY COORDINATION ACT IS A DISPATCHED, BUDGETED,
      CHARGED QUEUE TASK FROM BATCH-001, and the BATCH-001 sizing above carries
      two such lines explicitly.
    declared_budgets_remain_binding: >-
      Declared per-task budgets are stop conditions, not estimates. A task that
      reaches its declared handoff.budget.wall_clock_seconds HALTS, and that
      halt is infrastructure signal, never a negative mathematical result.
    charged_to_date: 0
    charged_to_date_basis: >-
      ZERO, AND IT IS AN HONEST ZERO ONLY UNTIL THIS RECORD IS COMMITTED. No
      GOAL-AES-002 task has been dispatched and no batch exists. The
      Coordinator act that authored RQ-AES-002, this record and
      DEC-20260731-031 was NOT dispatched as a queue task, because no queue can
      exist before the goal does; it is the ONE act of this campaign performed
      outside the charging regime, it is named here rather than hidden, and its
      duration is UNMEASURED. Under C6 an unmeasured act is charged at its
      declared budget, and it had none. It is therefore recorded as an
      UNQUANTIFIED OPENING UNDER-COUNT of exactly one act, in the direction that
      favours this campaign, and it is not reconstructed — reconstructing a
      duration nobody recorded would be fabrication (AGENTS.md rule 9). From
      BATCH-001 onward the regime is exceptionless.
    measurement_provenance: >-
      Measured figures are per-task durations REPORTED BY THE DISPATCHING
      SESSION. There is no instrumented timer in this repository. Committed UTC
      stamps are PRODUCER ATTESTATION, not a mechanism: the V-804-2 lesson
      applies unchanged, a producer-written timestamp is a string the producer
      wrote, and Part B makes the timeline READABLE and CONSISTENT, not PROVEN.
    standing_limit: >-
      THE CEILING IS REAL AND BINDS. 22500 s of MEASURED wall clock across at
      most 3 batches. IF MEASURED CONSUMPTION APPROACHES 22500, OR IF THE THIRD
      BATCH CLOSES, A FURTHER AMENDMENT IS REQUIRED to continue; reaching either
      limit without one fires pause condition P1 and this goal moves to `paused`
      or `closed_at_budget` — never to `completed`, which is unreachable here
      (see completion_reachability below). An overrun is not a research result.

  provenance_and_review_gates:
    artifact_provenance_gate: >-
      IN FORCE FROM BATCH-001, adopted from protocol-amendment-GOAL-AES-001-004
      Part B AS CORRECTED BY amendment 005 Part C, so this campaign never issues
      cards under the clauses already known to be defective. (i) Every declared
      source-code artifact carries a comment-block inference stanza in its own
      text. (ii) AT LEAST ONE machine-readable manifest per task, DESIGNATED THE
      COVERING MANIFEST by the task's card and by the manifest itself, carries
      an artifact_provenance list covering EVERY declared artifact of the task;
      every other manifest of the task appears as an ENTRY in it. A
      self-referential digest is impossible and is recorded as SELF. (iii) The
      `kind` vocabulary is CLOSED and CASE-INSENSITIVE — SOURCE_CODE,
      MACHINE_READABLE_MANIFEST, PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD —
      matched ignoring underscore/hyphen/space differences; no fifth class may
      be invented, a value outside the vocabulary is a DEFECT TO REPORT, and any
      machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST.
    independent_review_chain: >-
      UNCHANGED FROM GOAL-AES-001 AND NOT RELAXED. Every claim-relevant producer
      task has a dependent independent Validator task and, where a result could
      change a claim about AES, an independent Red Team task. The Coordinator
      records an official decision only after those reports exist as committed
      artifacts. A claimed break, a closure result, or a contradiction between
      validated evidence records routes to `review-breakthrough` at max effort
      per AGENTS.md rule 12, which may not be degraded.
    instrument_inheritance: >-
      The GOAL-AES-001 harness is reused WITH its declared defect set attached
      and NOT reset: H-2, H-4 (irreducible), ER-5, ER-7, ER-8, V-804-4, V-804-5
      and the KN-FIND-029 escape classes. KN-FIND-029's practice rules bind any
      instrument built here — a green states its covered cells or it states
      nothing; a repair is proved by execution, never by reading the new task
      set; coverage escapes are closed BY CONSTRUCTION from the module's own
      declared parameter domain and never by enumerating one more axis; the
      evasion class is DECLARED OUT of the threat model on a stated ground and
      that declaration is written into any certificate relying on the
      instrument; a null control must ISOLATE the property it names and the
      sibling null is built before the label is believed.

  current_batch_id: BATCH-001
  current_batch_id_note: >-
    NULL BY FACT. No GOAL-AES-002 batch exists. Naming a batch id or a
    dispatch_queue_path for a file that has not been written would be a
    fabrication under AGENTS.md rule 9 — the same test GOAL-AES-001 applied at
    every batch boundary. The single next_action below creates the first one.
  current_batch_id_note_status_20260809: >-
    THE NOTE ABOVE IS PRESERVED VERBATIM AND DESCRIBES THE STATE AT THIS GOAL'S
    CREATION, WHEN BOTH FIELDS WERE GENUINELY NULL. It is not deleted, because
    a committed statement is superseded in view rather than destroyed. AS OF
    2026-08-09 IT NO LONGER DESCRIBES THE CURRENT VALUES: BATCH-001 exists,
    its batch record and dispatch queue have been written, and the two fields
    are bound to them under DEC-20260809-16c8f4. The test the note states is
    unchanged and was applied here — the id and the path were bound only
    because the files were written first.
  dispatch_queue_path: coordination/goals/GOAL-AES-002/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: null
  latest_verified_commit_note: >-
    NULL BY FACT. This field is bound to the last VERIFIED LEDGER ARCHIVE of
    this goal and there has been none. The commit carrying RQ-AES-002, this
    record and DEC-20260731-031 is an OPENING COORDINATION COMMIT, not a ledger
    archive of a reviewed result: it reviews no evidence, creates no EV-*
    record and archives no producer artifact. It does not advance this field.
    A record that exists only in a local commit is unpublished; the branch must
    be pushed and a PR opened or refreshed against `main` naming RQ-AES-002,
    GOAL-AES-002 and DEC-20260731-031 before any of them is treated as durable.

  # ===================================================================
  # WHAT WOULD COUNT AS DONE.
  # ===================================================================
  completion_criteria:
    - >-
      C1 — CERTIFIED FULL-ROUND SINGLE-KEY KEY RECOVERY. A recovered key that
      reproduces the exact target ciphertexts under BOTH pycryptodome and the
      openssl CLI, re-verified by the run wrapper with the attack code excluded
      from the verification path, on full-round AES-128, -192 or -256
      (10/12/14 rounds), together with an end-to-end cost charged under the
      COMMITTED cost model CM-1 that is materially below the DEFINITIONAL
      exhaustive-key-search reference at that key size — same unit, same
      success convention on both sides, with time, memory, data and success
      probability all stated and the cost normalised by success probability —
      and with all four promotion gates of agents/coordinator.md satisfied by
      committed artifacts. THE COMPARISON IS TO THE DEFINITIONAL REFERENCE
      ONLY; whether such a result also beats the published state of the art is
      UNADJUDICABLE here and is recorded as `inconclusive` alongside, never
      merged into the verdict (RQ-AES-002 claim_tier_ceiling R3, R4).
    - >-
      C2 — CONDITIONAL FULL-ROUND CONSTRUCTION REACHING `analyzed`. A full-round
      single-key attack claimed at cost materially below the definitional
      reference, stated CONDITIONALLY on numbered, formally quantified
      heuristics, with: an archived proof decomposition into
      single-responsibility lemmas whose main theorem is pure assembly under
      explicit per-attempt-cost x inverse-success-probability bookkeeping; every
      conditional dependence numbered and carrying archived validation evidence
      or an approved scheduled validation experiment; a concrete-cost table at
      AES-128/192/256 with the cost model stated, optimistic assumptions
      flagged, memory beside time, time-memory tradeoffs and parallelisation,
      and an explicit affected-vs-safe scope statement; and independent
      review-breakthrough review plus a red-team pass on the cost model and
      heuristics. STATED PLAINLY AND NOT BURIED: C2 COMPLETES THIS GOAL AS A
      RESEARCH DELIVERABLE AND DOES NOT ESTABLISH A BREAK. This environment
      cannot execute at the scale where the cost claim would be tested, so a
      C2 result reaches `analyzed` and NEVER `supported` here, and the correct
      terminal posture for it is `paused` pending external adjudication
      (pause condition P5).
    - >-
      C3 — SCOPED BARRIER STATEMENT AT THE CLOSURE STANDARD. For a NAMED
      full-round object class: a named obstruction, a checkable argument
      archived as a derivation artifact and independently re-worked, and
      forward guidance naming what remains open — the standard of
      docs/inventor-protocol.md section 4, and the deliverable this campaign
      most plausibly produces. Scoped to the named class; never a universal
      impossibility claim about AES.
    - >-
      C4 — REVIEW ADMISSION, required on top of C1, C2 or C3. Independent
      Validator and Red Team sessions admit the package, checking certificate
      independence and re-verification under two implementations, null-control
      comparability including the round-count decay check, the CM-1 charging on
      BOTH sides, the round count and key size ACTUALLY tested, the absence of
      uncharged precomputation/memory/data, and the R5 anti-laundering clause
      in every sentence stating a margin.
    - >-
      C5 — DURABLE ARCHIVE. Coordinator evidence, decision and any warranted
      knowledge entry committed through a VERIFIED ledger archive, pushed, and
      carried by an open PR against `main`, with the conclusion scoped to the
      exact round counts, key sizes, threat model, implementation and budget
      actually tested.
  # ---------------------------------------------------------------
  # WHAT IS EXPLICITLY *NOT* A COMPLETION CRITERION.
  # ---------------------------------------------------------------
  non_completion_criteria: >-
    STATED AS A RULING BECAUSE EACH IS A TRAP THIS PROGRAM HAS EITHER FALLEN
    INTO OR NARROWLY AVOIDED.
    (i) AN OBJECT ENUMERATION IS NOT A COMPLETION. The object-first taxonomy of
    full-round-relevant tracked objects is a REQUIRED INTERMEDIATE ARTIFACT of
    BATCH-001 and is genuinely valuable, but under
    docs/inventor-protocol.md section 4 a count of screened-and-rejected
    mechanisms is a FATIGUE REPORT, its honest status is `unverified`, and it is
    a statement about the search rather than about the problem. It may be
    promoted to KN-OPEN; it does not close this goal.
    (ii) A RELATED-KEY, KNOWN-KEY OR CHOSEN-KEY RESULT IS NOT A COMPLETION, at
    any margin, on any key size.
    (iii) A REDUCED-ROUND RESULT IS NOT A COMPLETION. It belongs to RQ-AES-001's
    ceiling and is cross-filed there.
    (iv) A SIDE-CHANNEL, FAULT, IMPLEMENTATION OR QUANTUM RESULT IS NOT A
    COMPLETION; all four are out of scope entirely.
    (v) A MARGIN AGAINST THE PUBLISHED STATE OF THE ART IS NOT A COMPLETION AND
    MAY NOT BE ASSERTED, because it is not adjudicable here in either direction.
    (vi) A REPRODUCIBILITY FACT ABOUT AN INSTRUMENT IS NOT A COMPLETION. A
    passing harness, a repaired mutation control, a frozen cost model and a
    measured throughput receipt are infrastructure; GOAL-AES-001 spent four
    batches learning to say so and the lesson is inherited, not relearned.

  pause_conditions:
    - >-
      P1 — BUDGET. The three-batch or 22500 s campaign budget is exhausted
      without an admissible next mechanism, and no amendment is approved. The
      goal moves to `paused` or `closed_at_budget` with the narrowest supported
      result recorded and exactly one next action preserved.
    - >-
      P2 — THE HONEST ONE: THE SEARCH EXHAUSTS ITS ADMISSIBLE OBJECT CLASSES
      WITHOUT AN ADMISSIBLE MECHANISM. Every generated object either fails the
      lossy-projection test (it discards nothing, so it is a change of
      coordinates and not a new object), or deduplicates to a named family as a
      rediscovery, or has no falsification gate that fits the measured resource
      envelope. WHAT THIS PAUSE ASSERTS: nothing about AES. Under
      docs/inventor-protocol.md section 4 an exhausted candidate pool is a
      FATIGUE REPORT whose honest status is `unverified` — a statement about
      this search, at this budget, with this generation procedure, in this
      environment. It is recorded with the residual open question named and the
      unscreened classes listed as OPEN AND UNATTEMPTED, never as tried,
      screened or negative (AGENTS.md rules 5 and 8). It is NOT a closure and
      NOT a barrier statement, and it must never be transcribed as one.
    - >-
      P3 — INFRASTRUCTURE. A definitive infrastructure or dependency blocker
      prevents the next approved task. This includes BLK-1 remaining unresolved
      (the certificate vocabulary cannot express an AES key recovery, so no
      conforming run may claim one) and includes the toolchain contradiction
      recorded in RQ-AES-002's resource-envelope constraint remaining
      unmeasured. A blocker is infrastructure signal, NEVER negative
      mathematical evidence (AGENTS.md rule 5).
    - >-
      P4 — COST. The decisive computation exceeds the declared campaign budget
      after the cheaper falsification gates are exhausted. Recorded as
      out-of-envelope and named, never estimated into a result.
    - >-
      P5 — SUCCESS THAT CANNOT BE ADJUDICATED HERE. A candidate full-round
      break survives internal review. THE GOAL PAUSES AT `analyzed` PENDING
      EXTERNAL ADJUDICATION AND DOES NOT CLOSE. Recorded as a pause condition
      because it is counter-intuitive and would otherwise be resolved by
      momentum: the one thing this environment cannot do is compare against the
      published frontier, and AGENTS.md rule 12 routes a claimed break to
      `review-breakthrough` at max effort, which under
      inference-amendment 0137a051 cannot obtain the independent models it
      requires. The correct terminal state for a SUCCESS here is `paused` with
      the result recorded at its exact tier and the adjudication named as
      outstanding — not `completed`, and not a published comparative claim.
    - >-
      P6 — CONTRADICTION. Any result under this goal that would contradict a
      committed RQ-AES-001 evidence record, or that could only be stated by
      relaxing RQ-AES-001's claim_tier_ceiling. The goal pauses and the
      resolution is a superseding record under a new id, never an edit to a
      committed record and never a reinterpretation of that ceiling.

  completion_reachability: >-
    STATED AT THE OPENING RATHER THAN DISCOVERED AT THE CLOSE. Under AGENTS.md
    rule 13 and CLAUDE.md rule 8, `status: completed` requires three CONCUR
    attestations with PAIRWISE-DISTINCT resolved_model_id. Under
    inference-amendment-TASK-20260731-602 (commit 0137a051), cross-model
    independence is unavailable campaign-wide in this harness: every producer,
    validator, red team and Coordinator resolves to the same model, so a
    validator CONCUR plus a red-team CONCUR is ONE DRAW FROM A CORRELATED PAIR,
    NOT TWO. THEREFORE `completed` IS UNREACHABLE FOR THIS GOAL REGARDLESS OF
    OUTCOME unless the dispatching session deliberately routes three different
    backends, and no attestation may be recorded that was not obtained. No
    `completion_quorum` block is created here and none may be created until
    three distinct resolved models are actually available. If a completion
    criterion is met without the quorum, the honest transition is `paused` with
    the narrowest supported result recorded — never `completed`, and never
    `closed_at_budget` used to retire a goal that DID meet a criterion, which
    is a contract violation.

  saturation_stance: >-
    THE PRIOR THAT NO FULL-ROUND IMPROVEMENT EXISTS HERE IS OVERWHELMING AND IS
    STATED PLAINLY IN RQ-AES-002's motivation rather than discovered later as a
    disappointment. Full-round AES has resisted more than two decades of
    concentrated global effort; the best recalled single-key results are
    marginal constant-factor improvements, not exponent movers; and that
    recollection is itself unverified. The campaign proceeds anyway because
    PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING (CLAUDE.md;
    docs/inventor-protocol.md section 4), and because the incident that
    motivated the inventor protocol was a model declining AES cryptanalysis on
    exactly these grounds immediately before improving a best-known attack.
    BOTH FACTS ARE HELD BY PROCEDURE, NOT BY RHETORIC: hard novelty screening
    and the lossy-projection test before any compute; null controls with a
    round-count decay check before belief; matched-reference accounting under a
    frozen CM-1; certificates re-verified under two independent
    implementations; and a claim-tier ceiling under which converting "beats the
    definitional reference" into "beats the published state of the art" is a
    recorded violation rather than an available shortcut.

  claim_tier_ceiling: >-
    GOVERNED BY RQ-AES-002's claim_tier_ceiling R1-R7, adopted here in full and
    not restated in weaker words. In brief, and never to be read as a
    replacement for R1-R7: default tier `toy`; `crypto` tier only through a
    re-verified full-round key-recovery certificate; any COST claim capped at
    `analyzed` in this environment; the reference is EXHAUSTIVE KEY SEARCH,
    which is definitional; and NO relation to the published state of the art may
