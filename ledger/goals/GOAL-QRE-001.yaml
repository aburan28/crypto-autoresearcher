research_goal:
  id: GOAL-QRE-001
  title: >-
    Quantum resource estimates for RSA-2048 and 256-bit ECDLP: reproduce the
    costing pipeline from published inputs, then measure which assumption each
    order of magnitude belongs to
  objective: >-
    This program's central lane is the classical hardness of ECDLP, and every
    argument about the urgency of that work routes through a handful of quantum
    resource estimates that are quoted downstream as constants. They are not
    constants: they are single evaluations of a pipeline from algorithm
    parameters and physical assumptions to physical qubits and wall-clock time.
    Reimplement that pipeline as auditable code, reproduce at least two
    published totals FROM THEIR OWN STATED INPUTS within a declared tolerance,
    and then produce the deliverable nobody publishes — the sensitivity table
    saying how far each output moves when each input moves over a declared
    range. Recompute the arithmetic layer (Toffoli and T counts for modular
    exponentiation and for elliptic-curve point addition) here rather than
    citing it, since every downstream number is linear in it, and cost RSA and
    ECDLP under ONE pipeline with identical assumptions so the ratio between
    them is meaningful. No hardware, no quantum advantage claim, and — an
    absolute prohibition — no timeline, forecast, or policy recommendation.
  question_ids: [RQ-QRE-6dba8c]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 5
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  related_goals: [GOAL-ECDLP-001, GOAL-RSA-001, GOAL-PATH-001, GOAL-CSIDH-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "RSA-2048 factoring and 256-bit prime-field ECDLP under Shor's algorithm, costed under surface-code fault tolerance"
    family: "quantum resource estimation: circuit synthesis, error correction, magic state distillation, layout"
    nist_track: not_applicable
    standardization_status: >-
      RECALLED, UNVERIFIED: published estimates of this kind are cited in
      migration guidance and risk statements without being re-derived. They are
      not standards, which is exactly why their inputs go unexamined downstream.
    why_this_scheme: >-
      It is arithmetic. There is no hardware, no new theory, and a completely
      decidable reproduction criterion: either the pipeline returns the paper's
      number from the paper's inputs or it does not, and both outcomes are
      informative. It is also the one lane where this program can contribute
      something directly useful to its own ECDLP work — a like-for-like
      comparison of the quantum cost of ECDLP and factoring under one set of
      assumptions, which the literature generally does not provide because the
      two are costed in separate papers.
  non_duplication:
    - >-
      GOAL-ECDLP-001, GOAL-PATH-001 and the Tier goals own CLASSICAL ECDLP cost.
      This goal computes a quantum resource estimate and may not be cited as
      evidence for or against any classical claim, nor may any classical result
      be cited here.
    - >-
      GOAL-RSA-001 owns the classical memory-charged NFS baseline. Shared
      discipline, disjoint model; neither goal's figures transfer.
    - >-
      GOAL-CSIDH-001 also reconstructs disputed quantum cost models. That goal
      owns abelian-hidden-shift costs for a group action; this one owns
      Shor-type period finding under surface-code fault tolerance. Reconstruction
      METHOD may be shared as tooling; numbers may not.
  completion_criteria:
    - >-
      A REPRODUCTION RESULT: at least two published headline totals reproduced
      from their own stated inputs within a declared tolerance, or reported
      reproduction failures with the discrepancy's magnitude and the inputs that
      could not be determined from the filed text.
    - >-
      AN INDEPENDENT ARITHMETIC-LAYER COUNT: Toffoli/T counts for modular
      exponentiation and elliptic-curve point addition computed here, validated
      by classical simulation of the same circuits at small bit widths.
    - >-
      THE SENSITIVITY TABLE: outputs swept against every input over declared
      ranges, one-at-a-time and jointly, with inputs ranked by influence on
      physical qubit count and on wall-clock time separately.
    - >-
      A LIKE-FOR-LIKE COMPARISON of RSA-2048 and 256-bit ECDLP under one
      assumption set, reported as a ratio with the assumptions listed.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      specifically verifying that every constant is derived or cited to filed
      text and that NO record contains a date, arrival probability, or policy
      recommendation.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The five-batch campaign budget is exhausted without an admissible next mechanism.
    - Fewer than two primary resource-estimation papers with extractable input tables can be obtained after the declared source-preference order is exhausted; a sensitivity table with nothing to reproduce against is not the deliverable.
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    COUNT THE ARITHMETIC LAYER FIRST — IT NEEDS NOTHING. Toffoli and T counts for
    modular exponentiation and for elliptic-curve point addition are pure
    reversible-circuit construction, verifiable by simulating the same circuits
    classically at small bit widths, and every published headline number is
    linear in them. Produce those counts and their validation before any paper is
    acquired; they are this goal's own contribution and they are also the
    instrument for reproducing anyone else's totals. Acquisition then supplies
    only the fault-tolerance parameters and the published totals to reproduce
    against. THE PROHIBITION IS ABSOLUTE AND APPLIES FROM THE FIRST RECORD: no
    date, no timeline, no arrival probability, no migration advice. Claim tier:
    costing and sensitivity under stated physical assumptions.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
