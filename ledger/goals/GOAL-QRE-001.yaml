  scheme_context:
    scheme: RSA-2048 factoring and 256-bit prime-field ECDLP under Shor's algorithm, costed under
      surface-code fault tolerance
    family: 'quantum resource estimation: circuit synthesis, error correction, magic state distillation,
      layout'
    nist_track: not_applicable
    standardization_status: 'RECALLED, UNVERIFIED: published estimates of this kind are cited
      in migration guidance and risk statements without being re-derived. They are not standards,
      which is exactly why their inputs go unexamined downstream.'
    why_this_scheme: 'It is arithmetic. There is no hardware, no new theory, and a completely
      decidable reproduction criterion: either the pipeline returns the paper''s number from the
      paper''s inputs or it does not, and both outcomes are informative. It is also the one lane
      where this program can contribute something directly useful to its own ECDLP work — a like-for-like
      comparison of the quantum cost of ECDLP and factoring under one set of assumptions, which
      the literature generally does not provide because the two are costed in separate papers.'
  non_duplication:
  - GOAL-ECDLP-001, GOAL-PATH-001 and the Tier goals own CLASSICAL ECDLP cost. This goal computes
    a quantum resource estimate and may not be cited as evidence for or against any classical
    claim, nor may any classical result be cited here.
  - GOAL-RSA-001 owns the classical memory-charged NFS baseline. Shared discipline, disjoint model;
    neither goal's figures transfer.
  - GOAL-CSIDH-001 also reconstructs disputed quantum cost models. That goal owns abelian-hidden-shift
    costs for a group action; this one owns Shor-type period finding under surface-code fault
    tolerance. Reconstruction METHOD may be shared as tooling; numbers may not.
  completion_criteria:
  - 'CRITERION 1 -- A REPRODUCTION RESULT, WITH ITS ARITHMETIC INPUT NOW SEPARATED. At least two
    published headline totals reproduced FROM THEIR OWN STATED INPUTS -- including THAT PAPER''S
    OWN Toffoli/T counts, not this program''s -- within the tolerance declared in reproduction_tolerance
    below; or reported reproduction failures with the discrepancy''s magnitude and the inputs
    that could not be determined from the filed text. AMENDED 2026-08-13 by DEC-20260813-5cef9c:
    the prior wording let this criterion be read as consuming criterion 2''s counts, which would
    make a reproduction test circular.'
  - CRITERION 2 -- AN INDEPENDENT ARITHMETIC-LAYER COUNT, which is this program's own contribution
    and is NOT an input to criterion 1. Toffoli/T counts for modular exponentiation and elliptic-curve
    point addition computed here, validated by classical simulation of the same circuits at small
    bit widths. SUBSTANTIALLY MET AT TOY TIER by EV-QRE-45dfe1 (BATCH-973b49); the point-addition
    side remains a Fermat-inversion UPPER BOUND until a tighter inverter is derived.
  - 'CRITERION 3 -- THE SENSITIVITY TABLE, RESHAPED. Outputs swept against every input over declared
    ranges, inputs ranked by influence on physical qubit count and on wall-clock time SEPARATELY.
    AMENDED 2026-08-13 by DEC-20260813-5cef9c: one-at-a-time partial derivatives are the wrong
    instrument for the physical-qubit axis, which depends on the arithmetic layer only through
    code distance and therefore behaves as a STAIRCASE rather than a slope. The table must report
    BREAKPOINTS and LOGICAL WIDTH as first-class outputs, not only slopes. The wall-clock axis
    is the half on which the original linearity premise holds. The surface-code form behind this
    amendment was ASSERTED BY A RED TEAM AND IS NOT FILED; it must be rechecked against whatever
    error-correction model is filed before this criterion is scored.'
  - 'CRITERION 4 -- A LIKE-FOR-LIKE RSA-2048 vs 256-bit ECDLP COMPARISON under one assumption
    set, reported as a ratio with the assumptions listed. BLOCKED as of 2026-08-13 by DEC-20260813-5cef9c
    and NOT scoreable until unblocked: the current point addition is a Fermat-inversion upper
    bound, the two sides are in different units (full algorithm vs one point addition), and a
    ratio of two asymmetrically loose upper bounds bounds nothing. Unblocking requires a tighter
    inverter under the same frozen convention AND a declared unit for both sides.'
  - 'CRITERION 5 -- Independent Validator and Red Team sessions admit the run package, specifically
    verifying that every constant is derived or cited to filed text and that NO record contains
    a date, arrival probability, or policy recommendation. NOTE 2026-08-13: a producer''s own
    self-audit does not discharge this; BATCH-973b49''s scanner covered 4 of 17 files and had
    no date pattern (D-V3). The discharging sweep is the reviewer''s.'
  - CRITERION 6 -- Coordinator evidence, decision, and any warranted knowledge entry committed
    through a verified ledger archive.
