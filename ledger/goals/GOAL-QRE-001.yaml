  current_batch_id: BATCH-973b49
  dispatch_queue_path: coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/dispatch_queue.json
  latest_verified_commit: d931391c2
  scheme_context:
    scheme: RSA-2048 factoring and 256-bit prime-field ECDLP under Shor's algorithm, costed under
      surface-code fault tolerance
    family: 'quantum resource estimation: circuit synthesis, error correction, magic state distillation,
      layout'
    nist_track: not_applicable
    standardization_status: 'RECALLED, UNVERIFIED: published estimates of this kind are cited
      in migration guidance and risk statements without being re-derived. They are not standards,
      which is exactly why their inputs go unexamined downstream.'
    why_this_scheme: 'It is arithmetic. There is no hardware, no new theory, and a completely
      decidable reproduction criterion: either the pipeline returns the paper''s number from the
      paper''s inputs or it does not, and both outcomes are informative. It is also the one lane
      where this program can contribute something directly useful to its own ECDLP work — a like-for-like
      comparison of the quantum cost of ECDLP and factoring under one set of assumptions, which
      the literature generally does not provide because the two are costed in separate papers.'
  non_duplication:
  - GOAL-ECDLP-001, GOAL-PATH-001 and the Tier goals own CLASSICAL ECDLP cost. This goal computes
    a quantum resource estimate and may not be cited as evidence for or against any classical
    claim, nor may any classical result be cited here.
  - GOAL-RSA-001 owns the classical memory-charged NFS baseline. Shared discipline, disjoint model;
    neither goal's figures transfer.
  - GOAL-CSIDH-001 also reconstructs disputed quantum cost models. That goal owns abelian-hidden-shift
    costs for a group action; this one owns Shor-type period finding under surface-code fault
    tolerance. Reconstruction METHOD may be shared as tooling; numbers may not.
  completion_criteria:
  - 'A REPRODUCTION RESULT: at least two published headline totals reproduced from their own stated
    inputs within a declared tolerance, or reported reproduction failures with the discrepancy''s
    magnitude and the inputs that could not be determined from the filed text.'
  - 'AN INDEPENDENT ARITHMETIC-LAYER COUNT: Toffoli/T counts for modular exponentiation and elliptic-curve
    point addition computed here, validated by classical simulation of the same circuits at small
    bit widths.'
  - 'THE SENSITIVITY TABLE: outputs swept against every input over declared ranges, one-at-a-time
    and jointly, with inputs ranked by influence on physical qubit count and on wall-clock time
    separately.'
  - A LIKE-FOR-LIKE COMPARISON of RSA-2048 and 256-bit ECDLP under one assumption set, reported
    as a ratio with the assumptions listed.
  - Independent Validator and Red Team sessions admit the run package, specifically verifying
    that every constant is derived or cited to filed text and that NO record contains a date,
    arrival probability, or policy recommendation.
  - Coordinator evidence, decision, and any warranted knowledge entry committed through a verified
    ledger archive.
  pause_conditions:
  - The five-batch campaign budget is exhausted without an admissible next mechanism.
  - Fewer than two primary resource-estimation papers with extractable input tables can be obtained
    after the declared source-preference order is exhausted; a sensitivity table with nothing
    to reproduce against is not the deliverable.
  - A definitive infrastructure, authentication or dependency blocker prevents the next approved
    task.
  next_action: 'ONE ACTION, RECORDED BY DEC-20260813-5cef9c. REPAIR THIS GOAL''S FRAMING BEFORE
    BATCH-2 ACQUISITION IS WRITTEN, because three of the five completion criteria are currently
    mis-specified and dispatching against them would waste the batch. (a) SEPARATE THE ARITHMETIC
    INPUTS: criterion 1 reproduces a published total from THAT PAPER''S OWN Toffoli count; criterion
    2 is this program''s independent count. The objective sentence currently reads as though one
    feeds the other and it must not. (b) DECLARE THE TOLERANCE criterion 1 requires -- per axis
    and per layer -- which is declared nowhere. (c) RESHAPE CRITERION 3: the physical-qubit axis
    depends on the Toffoli count only through code distance and behaves as a staircase, so one-at-a-time
    partial derivatives are the wrong instrument; the table must report logical width and breakpoints.
    The wall-clock axis is the half where the linearity premise holds. (d) STATE THAT CRITERION
    4 IS BLOCKED pending a tighter inverter: the current point addition is a Fermat-inversion
    UPPER BOUND and a ratio of two asymmetrically loose upper bounds bounds nothing. THEN dispatch
    ONE producer task: derive a Euclid/Kaliski-type reversible inverter under the SAME frozen
    convention and re-count with the existing builder. That is what unblocks criterion 4 and removes
    the instrument-induced Hamming-weight sensitivity in the point-addition count. Acquisition
    may run in parallel and STARTS FROM THE ALREADY-FILED KN-LIT-099 -- see CORR-20260813-1a06db;
    the belief that no resource-estimation paper was filed was false. Also owed, as the first
    act of the next batch: promote the negative-control finding via /curate-knowledge, which DEC-20260813-5cef9c
    records as warranted but outside the last archive''s write scope. AND SEARCH THE CORPUS BEFORE
    ASSERTING A NEGATIVE: the retrieval index being unavailable is a reason to say it was not
    searched, never a licence to say it is empty. THE PROHIBITION IS ABSOLUTE AND UNCHANGED: no
    date, no timeline, no arrival probability, no forecast, no migration or policy advice, in
    any artifact.'
