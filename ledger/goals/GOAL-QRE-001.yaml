  latest_verified_commit: null
  scheme_context:
    scheme: RSA-2048 factoring and 256-bit prime-field ECDLP under Shor's algorithm, costed
      under surface-code fault tolerance
    family: 'quantum resource estimation: circuit synthesis, error correction, magic state
      distillation, layout'
    nist_track: not_applicable
    standardization_status: 'RECALLED, UNVERIFIED: published estimates of this kind are cited
      in migration guidance and risk statements without being re-derived. They are not standards,
      which is exactly why their inputs go unexamined downstream.'
    why_this_scheme: 'It is arithmetic. There is no hardware, no new theory, and a completely
      decidable reproduction criterion: either the pipeline returns the paper''s number from
      the paper''s inputs or it does not, and both outcomes are informative. It is also the
      one lane where this program can contribute something directly useful to its own ECDLP
      work — a like-for-like comparison of the quantum cost of ECDLP and factoring under one
      set of assumptions, which the literature generally does not provide because the two
      are costed in separate papers.'
  non_duplication:
  - GOAL-ECDLP-001, GOAL-PATH-001 and the Tier goals own CLASSICAL ECDLP cost. This goal computes
    a quantum resource estimate and may not be cited as evidence for or against any classical
    claim, nor may any classical result be cited here.
  - GOAL-RSA-001 owns the classical memory-charged NFS baseline. Shared discipline, disjoint
    model; neither goal's figures transfer.
  - GOAL-CSIDH-001 also reconstructs disputed quantum cost models. That goal owns abelian-hidden-shift
    costs for a group action; this one owns Shor-type period finding under surface-code fault
    tolerance. Reconstruction METHOD may be shared as tooling; numbers may not.
  completion_criteria:
  - 'A REPRODUCTION RESULT: at least two published headline totals reproduced from their own
    stated inputs within a declared tolerance, or reported reproduction failures with the
    discrepancy''s magnitude and the inputs that could not be determined from the filed text.'
  - 'AN INDEPENDENT ARITHMETIC-LAYER COUNT: Toffoli/T counts for modular exponentiation and
    elliptic-curve point addition computed here, validated by classical simulation of the
    same circuits at small bit widths.'
  - 'THE SENSITIVITY TABLE: outputs swept against every input over declared ranges, one-at-a-time
    and jointly, with inputs ranked by influence on physical qubit count and on wall-clock
    time separately.'
  - A LIKE-FOR-LIKE COMPARISON of RSA-2048 and 256-bit ECDLP under one assumption set, reported
    as a ratio with the assumptions listed.
  - Independent Validator and Red Team sessions admit the run package, specifically verifying
    that every constant is derived or cited to filed text and that NO record contains a date,
    arrival probability, or policy recommendation.
  - Coordinator evidence, decision, and any warranted knowledge entry committed through a
    verified ledger archive.
  pause_conditions:
  - The five-batch campaign budget is exhausted without an admissible next mechanism.
  - Fewer than two primary resource-estimation papers with extractable input tables can be
    obtained after the declared source-preference order is exhausted; a sensitivity table
    with nothing to reproduce against is not the deliverable.
  - A definitive infrastructure, authentication or dependency blocker prevents the next approved
    task.
  next_action: 'BATCH-973b49 IS OPEN AND DISPATCH-READY. One task is ready: TASK-20260813-c99166,
    the arithmetic-layer count -- Toffoli and T counts for modular exponentiation (RSA-2048
    shape) and elliptic-curve point addition (256-bit prime-field shape), every constant DERIVED
    from the construction rather than cited, validated by classical simulation of the identical
    circuits at small bit widths. It needs no acquisition, which is why it goes first: no
    resource-estimation paper has been filed and none is required to produce this. The counting
    convention (gate set, T-from-Toffoli ratio, ancilla accounting, uncomputation policy)
    is PRE-REGISTERED before any count, because a count without its convention is not comparable
    to anything. Counts are reported as functions of n with residuals, not as single numbers
    at one width, because the sensitivity deliverable needs the function. Then snapshot (TASK-20260813-884e20),
    independent Validator (TASK-20260813-13e948) and Red Team (TASK-20260813-312e93) in fresh
    sessions, then the ledger archive TASK-20260813-654347 committing EV-QRE-45dfe1 and DEC-20260813-5cef9c.
    THE PROHIBITION IS ABSOLUTE AND APPLIES FROM THE FIRST RECORD: no date, no timeline, no
    arrival probability, no migration or policy advice, in any artifact. Claim tier: costing
    and sensitivity under stated physical assumptions, and this batch supports a statement
    about counts under a stated convention and nothing more.'
