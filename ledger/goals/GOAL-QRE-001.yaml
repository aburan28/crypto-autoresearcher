  reproduction_tolerance:
    declared_at: '2026-08-13 by DEC-20260813-5cef9c, closing a gap: criterion 1 previously said
      "declared tolerance" and declared none.'
    toffoli_or_t_count: +/- 2 percent against the paper's own stated count at the paper's own
      parameters.
    logical_qubit_width: +/- 5 percent.
    physical_qubits: within a factor 1.5, because it depends on a code-distance choice the source
      may not state exactly.
    wall_clock: within a factor 2, for the same reason plus cycle-time assumptions.
    rule: A miss outside these bands is REPORTED AS A REPRODUCTION FAILURE with its magnitude,
      which criterion 1 admits as a result. Tolerances are per axis and per layer and are never
      widened after seeing a number.
