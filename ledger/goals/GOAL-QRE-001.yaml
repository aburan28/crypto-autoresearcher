research_goal:
  id: GOAL-QRE-001
  title: 'Quantum resource estimates for RSA-2048 and 256-bit ECDLP: reproduce the costing
    pipeline from published inputs, then measure which assumption each order of magnitude
    belongs to'
  objective: 'This program''s central lane is the classical hardness of ECDLP, and every argument
    about the urgency of that work routes through a handful of quantum resource estimates
    that are quoted downstream as constants. They are not constants: they are single evaluations
    of a pipeline from algorithm parameters and physical assumptions to physical qubits and
    wall-clock time. Reimplement that pipeline as auditable code, reproduce at least two published
    totals FROM THEIR OWN STATED INPUTS within a declared tolerance, and then produce the
    deliverable nobody publishes — the sensitivity table saying how far each output moves
    when each input moves over a declared range. Recompute the arithmetic layer (Toffoli and
    T counts for modular exponentiation and for elliptic-curve point addition) here rather
    than citing it, since every downstream number is linear in it, and cost RSA and ECDLP
    under ONE pipeline with identical assumptions so the ratio between them is meaningful.
    No hardware, no quantum advantage claim, and — an absolute prohibition — no timeline,
    forecast, or policy recommendation.'
  question_ids:
  - RQ-QRE-6dba8c
  active_hypothesis_ids: []
  status: active
