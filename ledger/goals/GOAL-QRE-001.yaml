    passes all ten dispatch gates and has two tasks ready. DISPATCH THEM. TASK-20260814-e95462
    writes the pre-registration and nothing else; TASK-20260814-9081e8 runs lane B extraction
    in parallel. TASK-20260814-334157 -- the inverter derivation -- STAYS BLOCKED UNTIL TASK-20260814-19d2b9
    HAS COMMITTED THE PRE-REGISTRATION ALONE. That ordering is the batch''s process fix and
