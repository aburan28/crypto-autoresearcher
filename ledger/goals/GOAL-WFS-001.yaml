research_goal:
  id: GOAL-WFS-001
  title: >-
    Fiat-Shamir transcript completeness: enumerate the omission classes with a
    forged proof for each, test whether a decidable static criterion matches the
    enumeration, and measure the grinding curve
  objective: >-
    Weak Fiat-Shamir is a vulnerability class that is simple, fully understood,
    published repeatedly, and still recurring — because the correctness
    condition lives in an implementation detail that no test vector exercises.
    That is the shape of a property that should be made mechanically decidable.
    Build a reference multi-round argument with a parameterized Fiat-Shamir
    transform in which each transcript element can be omitted; for each omission,
    produce a LITERAL FORGED PROOF for a false statement, accepted by an
    independently written honest verifier. The enumeration is complete over a
    small set rather than a search. Then ask the research question: is there a
    static check over transcript construction that accepts exactly the
    instantiations for which no certificate exists, and what must it inspect?
    Separately, measure the grinding curve for a FRI-like protocol — cost as a
    function of round count, challenge entropy and repetition — against the bit
    level the parameters are chosen to deliver, and state which quoted levels
    depend on a soundness conjecture rather than a proven bound.
  question_ids: [RQ-WFS-e776b6]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 14400
    max_concurrent: 3
  related_goals: [GOAL-ROS-001, GOAL-TECDSA-001, GOAL-SIG-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "reference sumcheck-based, PLONK-like and FRI-like multi-round arguments built for this goal; the Fiat-Shamir transform as the object under study"
    family: "interactive arguments; round-by-round and state-restoration soundness"
    nist_track: emerging
    standardization_status: >-
      RECALLED, UNVERIFIED: no standardized proof system, though
      zero-knowledge-proof standardization efforts exist. Multi-round
      Fiat-Shamir arguments nonetheless secure very large amounts of value.
    why_this_scheme: >-
      The failure mode is enumerable, the certificates are literal and instant to
      check, and the whole study runs on reference implementations this program
      writes — so it produces top-tier evidence with zero exposure to anyone
      else's system. The decidable-criterion question is genuine research rather
      than reimplementation: it asks whether a property currently checked by
      human review can be checked by a machine, and the certificate enumeration
      is the ground truth against which any candidate criterion is scored.
  non_duplication:
    - >-
      GOAL-ROS-001 owns concurrency failures in Schnorr-type SIGNATURE protocols
      arising from linear structure in nonces. This goal owns transcript
      completeness in MULTI-ROUND ARGUMENTS. Both produce forgery certificates
      against reference implementations; the mechanisms are disjoint.
    - >-
      GOAL-TECDSA-001 owns failures of auxiliary zero-knowledge proofs inside a
      threshold signing protocol. This goal owns the Fiat-Shamir transform
      itself, not the proofs it is applied to, and neither goal may cite the
      other's conclusions.
    - >-
      No third-party proof system, library, circuit or deployment appears in this
      goal's scope in any form, which also removes any duplication question about
      auditing external artifacts: this goal does not audit external artifacts.
  completion_criteria:
    - >-
      A COMPLETE OMISSION ENUMERATION with, for each class, a literal forged
      proof accepted by an independently written honest verifier — or an explicit
      "no forgery within declared budget", never rounded to "this omission is
      safe".
    - >-
      A CANDIDATE DECIDABLE CRITERION scored against the certificate
      enumeration, with its false accepts and false rejects reported; a criterion
      that cannot be stated as a mechanical check is reported as a negative
      result, which is a legitimate and useful outcome.
    - >-
      THE GRINDING CURVE for the FRI-like reference protocol: measured attack
      cost as a function of round count, challenge entropy and repetition
      parameter, with seeds and machine model recorded, set against the intended
      bit level.
    - >-
      A CONJECTURE TABLE stating, from filed primary text, which quoted security
      levels in the reference parameter sets depend on a proximity or soundness
      conjecture.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying that every forged proof reproduces, that each record's title
      labels it as against a deliberately weakened reference, and that no
      third-party system is named or characterized anywhere.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - The primary weak-Fiat-Shamir reference and the protocol specifications under test cannot be obtained in primary text after the declared source-preference order is exhausted.
    - Grinding attacks exceed the declared budget at every reachable parameter. Budget outcome about an implementation, never evidence of soundness (AGENTS.md rule 3).
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    BUILD THE SMALLEST COMPLETE PROTOCOL AND FORGE AGAINST IT IN BATCH ONE. A
    sumcheck-based argument with three or four rounds is short enough to
    implement, verify, and weaken exhaustively within one batch, and the first
    certificate — a proof of a false statement accepted by an honest verifier
    because the public statement was not hashed — establishes the whole harness.
    Do that before touching FRI, before the criterion work, and before
    acquisition: the enumeration is the ground truth every later stage is scored
    against, and it is cheap. Claim tier: certificates against this program's own
    reference implementations. NO THIRD-PARTY PROOF SYSTEM, LIBRARY, CIRCUIT,
    CONTRACT OR DEPLOYMENT IS EXAMINED, FETCHED, TESTED OR NAMED AT ANY POINT.
