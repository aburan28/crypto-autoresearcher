research_goal:
  id: GOAL-MQOM-001
  title: "MQOM: tightness of the TCitH forgery bound and measured MQ hardness at its parameters"
  objective: >-
    Close MQOM's two open flanks: re-derive the concrete forgery cost
    under the Round-3 Fiat-Shamir/TCitH instantiation and locate any
    slack a grinding attacker can spend, and calibrate the assumed MQ
    hardness at MQOM's exact small-field parameters by measurement,
    using this program's existing solving-degree instrumentation rather
    than a quoted asymptotic.
  question_ids: [RQ-MQOM-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "MQOM"
    family: "MPC-in-the-Head (Threshold Computation in the Head) over the MQ problem"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      Either a charged forgery or key-recovery cost below a named
      claimed level, with a certificate at reduced parameters; or a
      re-derived tight bound plus a measured solving-degree law at
      MQOM's (q, n, m) whose extrapolation is stated conditionally and
      whose stated uncertainty is honest about this program's own prior
      extrapolation failures.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      No MQOM Round-3 specification can be obtained under the network
      policy after the declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-MQOM-001. Before any solving-degree experiment
    is designed, check whether the harness's degree-of-regularity
    backend is in the state EV-DREG-004 left it in; a measured MQ law
    from an uncalibrated backend is not evidence.
