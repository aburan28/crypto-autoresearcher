# GOAL-TFISH-9db414 -- opened by DEC-20260924-decc6a on user direction
# (2026-09-24). Non-ECC (TFISH is an excluded area in
# orchestration/research-priority.yaml), so it is ranked after ECC goals.
research_goal:
  id: GOAL-TFISH-9db414
  title: >-
    Threefish reduced-round cryptanalysis: differential, rotational/RX,
    boomerang, differential-linear and algebraic distinguishers on the Skein
    v1.3 tweakable ARX cipher, measured against the published frontier
  objective: >-
    Push, or measurably bound, the number of Threefish-256/512/1024 rounds
    reachable per technique family and attacker model, using ARX-native
    automated search (SAT/SMT characteristic search with exact modular-
    addition differential and correlation models, RX-differential search
    that accounts for C240 and the subkey constants) and direct empirical
    verification of every multi-trail construction, especially the
    boomerang switch. Every result sits on the SYMF frontier under its own
    comparison key. Single-key, related-key/tweak and known-key
    (compression-function) results are never conflated. The primary
    deliverable is a per-family, per-block-size death round, reported
    whether or not it moves the frontier.
  question_ids: [RQ-TFISH-9b13ff]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 2
  campaign_budget_note: >-
    Null ceilings per the 2026-09-06 progress-first research budget policy.
    max_concurrent is machine headroom, not a research budget.
  current_batch_id: null
  dispatch_queue_path: null
  related_goals: [GOAL-SYMF-c00fa1, GOAL-SIMSPK-001]
  related_goals_note: >-
    GOAL-SIMSPK-001 (SIMON/SPECK rotation constants) is the other ARX lane.
    Its rotation-constant sensitivity tooling is the nearby-object control
    here: the same trail search run on Threefish with non-standard rotation
    constants.
  non_duplication:
    - >-
      GOAL-SYMF-c00fa1 owns the census of published attacks. This goal
      contributes Threefish/Skein rows through the SYMF process and does not
      keep a parallel census.
    - >-
      No existing goal works Skein or Threefish; GOAL-BLAKE-001 is the only
      other ARX hash campaign and shares no primitive with this goal.
  claim_ceiling: >-
    No batch may claim a full-round Threefish or Skein weakness, or any round
    count above the SYMF-recorded frontier for its comparison key, until the
    claim has passed review-breakthrough at max. A boomerang probability that
    was not confirmed by sampled right quartets at the reachable rounds is
    reported as unverified, never as a distinguisher.
  completion_criteria:
    - >-
      FRONTIER RESULT: for at least one comparison key, a distinguisher or
      attack at a round count that reaches or exceeds the SYMF-recorded
      published frontier, with (i) empirical verification (sampled right
      pairs or quartets) at every round count where the data complexity is
      at most 2^40, (ii) a random-permutation null at identical sample
      count, (iii) numbered heuristics with falsification checks for every
      extrapolated round, (iv) a concrete-cost table, and (v) independent
      review-breakthrough at max.
    - >-
      MEASURED BARRIER: for Threefish-256 and Threefish-512, a committed
      obstruction block per family (differential, rotational/RX, boomerang,
      differential-linear, algebraic) recording the death round. Each block
      states the search model's exactness (exact ARX model or approximation),
      the measured bound with error bars, and a resource_check. It closes
      only that family within that scope.
  pause_conditions:
    - >-
      The implementation cannot be pinned to the official Skein v1.3
      Threefish known-answer tests. This records an impediment on
      measurement tasks; it is not evidence.
    - >-
      A SAT/SMT solver adequate for ARX characteristic search cannot run in
      the execution environment. This records an impediment on search tasks
      only.
    - >-
      review-breakthrough at max cannot be served. The claim stays
      un-promoted and the campaign stays active.
  impediments: []
  next_action: >-
    OPEN BATCH 1: FOUNDATIONS AND OWN DEATH ROUNDS. No ideation first.
    (1) Pin Threefish-256/512/1024 to the Skein v1.3 known-answer tests.
    Expose an r-round API with a declared start round modulo 8 and a
    declared subkey-injection boundary convention.
    (2) Reproduce the published short-round baselines empirically: the
    near-collision differentials at 8 to 17 rounds that fall within 2^36
    samples, and the rotational pair probability over the first 8 to 16
    rounds with and without C240. Measure each against a random-permutation
    null and a random-constant null.
    (3) Sample right quartets for the published related-key boomerang
    characteristic at the largest reachable round count, which is the
    switch-compatibility control. Record compatible or incompatible, with
    counts.
    (4) Stand up an ARX SAT trail-search baseline that reproduces the
    best-trail bounds for 1 to 8 rounds.
    (5) File Threefish/Skein rows into the SYMF census.
    (6) Then run /propose-ideas under RQ-TFISH-9b13ff, with RX-differential
    search across subkey injections and carry-aware differential-linear as
    the first seeded directions.
  owner: coordinator
