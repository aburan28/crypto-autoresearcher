research_goal:
  id: GOAL-FAEST-001
  title: "FAEST: is the symmetric-only security claim tight end to end?"
  objective: >-
    Reconstruct FAEST's security claim as an explicit numbered chain
    from AES one-wayness through VOLEitH soundness and the Fiat-Shamir
    transform to a concrete forgery cost, identify every step where the
    chain is loose, and either exhibit a fully charged forgery below the
    claimed category or produce a scoped barrier statement showing which
    steps cannot be the source of an attack.
