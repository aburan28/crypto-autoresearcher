research_goal:
  id: GOAL-FAEST-001
  title: "FAEST: is the symmetric-only security claim tight end to end?"
  objective: >-
    Reconstruct FAEST's security claim as an explicit numbered chain
    from AES one-wayness through VOLEitH soundness and the Fiat-Shamir
    transform to a concrete forgery cost, identify every step where the
    chain is loose, and either exhibit a fully charged forgery below the
    claimed category or produce a scoped barrier statement showing which
    steps cannot be the source of an attack.
  question_ids: [RQ-FAEST-001]
  active_hypothesis_ids: []
  status: paused
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "FAEST"
    family: "symmetric / VOLE-in-the-Head (MPCitH family)"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      Either a fully charged forgery cost model that lands below the
      claimed security category at a named Round-3 parameter set,
      reproduced with a verifiable forgery certificate at reduced
      parameters; or a scoped barrier result identifying, with
      derivation, which links of the chain are provably not exploitable
      and what residual slack remains.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      No Round-3 FAEST specification or reference implementation can be
      obtained under the network policy after the declared
      source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
