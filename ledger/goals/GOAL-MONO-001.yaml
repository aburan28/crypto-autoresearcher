      outcome: >-
        The frozen m=3 census ran clean - 80 random ordinary controls across four
        pinned primes, 22 CM-screen curves, 3150000 specializations, all 11
        declared controls reporting pass, outcome_id FULL_MONODROMY_BARRIER_TOY.
        BUT THE OUTCOME IS NOT THE EVIDENCE. The run found that
        disc_T S_3 = 16 f(x1) f(x2), which makes the cycle type a quadratic
        character product, gives geometric monodromy S_2 for every non-singular
        curve, and bounds the density deviation by 4/p - so the census could not
        have failed, needing a 52-143 sigma excursion to do so. The m=3 slice of
        KN-OPEN-009 is answered by derivation, and it is the DEGENERATE slice: a
        transitive degree-2 group is primitive, so the imprimitivity mechanism the
        open problem hunts cannot exist there.
      most_consequential_finding: >-
        SUPPLIED BY THE RED TEAM, NOT THE PRODUCER, and it is an UNDERCLAIM
        correction. On the factor-base locus the summation fibre splits completely
        AT EVERY m, by the group law - verified at m=4, 193/193 triples. So a
        generic-fibre Frobenius census measures a quantity identically trivial
        where relation search operates. That is what N-1 now turns on.
      known_defects: >-
        Eleven, ALL FOUND BY THE TWO REVIEWS AND NONE BY THE PRODUCER, recorded in
        CORR-20260802-1d8384. Two were blocking: closed-form quantities labelled
        "measured", and an ICEX feed that would have propagated the very
        relation-rate model this run refutes. Also a latent logic inversion that
        would have promoted a failed_infrastructure reverification to
        EXCEPTIONAL_LOCUS_TOY, and two controls that pass for an empty window at
        every pinned prime.
      promotion_gates_status: >-
