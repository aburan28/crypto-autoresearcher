  next_action: >-
    BATCH-6f309b repair (DEC-20260804-d7cc39): re-run TASK-20260804-27e27b on
    Linux x86_64 (Docker linux/amd64 or equivalent). The variance_test.py
    script is ready; KN-TECH-14efa5 recipe builds g6k on that platform.
    CTRL-RT-4c is already DONE (matzov callable verified). Before sieve work:
    run CTRL-RT-4 1a (zero-error, all scores = 1.0) and 1b (uniform-error,
    mean ≈ 0). Then run the 50-run variance test. Record T_N per run and
    compare empirical Var[T_N] against N·Var[s_i] = 5,958.15 (already
    computed from batch-1 data).

  outstanding_work:
    - >-
      A null object of the right shape must exist before any departure is
      believed. The predecessor campaign went two consecutive batches without one
      and its only run of one came back a coin flip (RT-20260803-f55e34 OBJ-4).
      This goal's batch 1 card carries the null as a completion-gate item, not as
      an aspiration.
    - >-
      CTRL-RT-4 from the predecessor: put a known-answer control on
      `estimator.lwe_dual.matzov` itself, the callable four batches argued about
      and none covered. Inherited as setup work.

