  next_action: >-
    Open BATCH-6ec7a4 (batch 4 of 6) — native x86_64 control run. DECISIVE:
    run outlier seeds {2941775225, 26883012, 2418421570} plus run-0 seed from
    batch-3 on NATIVE Linux x86_64 (not QEMU). Also run null control (wrong
    secret s*≠s) in QEMU to test whether variance inflation is environmental.
    If native variance_ratio persists > 1.1, the signal survives the QEMU
    confound. If native ratio ≈ 1.0 but QEMU ratio ≈ 1.4, QEMU emulation is
    the source. See DEC-20260804-6ebd6e.

  outstanding_work:
    - >-
      A null object of the right shape must exist before any departure is
      believed. The predecessor campaign went two consecutive batches without one
      and its only run of one came back a coin flip (RT-20260803-f55e34 OBJ-4).
      This goal's batch 1 card carries the null as a completion-gate item, not as
      an aspiration.
    - >-
      CTRL-RT-4 from the predecessor: put a known-answer control on
      `estimator.lwe_dual.matzov` itself, the callable four batches argued about
      and none covered. Inherited as setup work.

