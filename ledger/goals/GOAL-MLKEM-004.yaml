  next_action: >-
    Open BATCH-68471b (batch 3 of 6) — adequate-power independence test.
    BLOCKING (DEC-20260804-1a2a1d OBJ-5): n>=150 bgj1_sieve runs in SAME
    Docker environment as batch-2 (same image, same glibc), using RANDOMLY
    CHOSEN g6k Siever seeds. Compute Var[s_i] WITHIN the same environment
    (do NOT import from batch-1). Report chi-squared test, p-value, 95% CI
    alongside ratio. Also characterise the ~103.9 mean-T_N shortfall between
    environments (OBJ-1/3). Budget: maximum_runs 165 (150 + 15 spare).

  outstanding_work:
    - >-
      A null object of the right shape must exist before any departure is
      believed. The predecessor campaign went two consecutive batches without one
      and its only run of one came back a coin flip (RT-20260803-f55e34 OBJ-4).
      This goal's batch 1 card carries the null as a completion-gate item, not as
      an aspiration.
    - >-
      CTRL-RT-4 from the predecessor: put a known-answer control on
      `estimator.lwe_dual.matzov` itself, the callable four batches argued about
      and none covered. Inherited as setup work.

