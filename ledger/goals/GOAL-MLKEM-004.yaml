  batch_log:
    - batch_id: BATCH-d2a728
      decision_id: DEC-20260803-d810d0
      evidence_id: EV-MLKEM-da9e3b
      snapshot_commit: 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e
