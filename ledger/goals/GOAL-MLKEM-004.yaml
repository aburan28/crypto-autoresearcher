research_goal:
  id: GOAL-MLKEM-004
  title: >-
    Measure the score distribution of sieve-produced dual vectors, and test the
    independence heuristic the dual-attack cost models assume
  objective: >-
    Answer KN-OPEN-016's actual question -- does the improved dual attack on LWE
    beat the primal attack once its heuristics are repaired -- by MEASURING the
    object the cost models assume, rather than by differencing two estimator
    functions. Ducas-Pulles argue the dual-sieve family's independence
    assumption is unsound; MATZOV-2022 and the pinned lattice-estimator's
    `MATZOV.Nf` both compute the required sample count N from a closed-form
    advantage law with no correlation term. Nobody has measured whether real
    sieve output obeys that law. This goal measures it at reduced dimensions and
    reports where the model departs from observation, in whichever direction it
    falls.

  question_ids:
    - RQ-MLKEM-003
  question_note: >-
    RQ-MLKEM-003 asks how much of ML-KEM's claimed security margin is MODEL
    rather than MEASUREMENT. GOAL-MLKEM-003 served it entirely with model; this
    goal serves it with measurement, which is the half that was missing.
    KN-OPEN-016 is the specific open problem within it.
  active_hypothesis_ids: []

  status: active
  runtime: claude_code

  predecessor: GOAL-MLKEM-003
  predecessor_note: >-
    GOAL-MLKEM-003 closed at budget on 2026-08-03 (DEC-20260803-64b55b) with a
    NAMED OBSTRUCTION: its instrument, the lattice-estimator, cannot answer this
    question, because every quantity it yields differences two cost models of
    which one drops an unbounded O() on the term that sets its own block size,
    receives its short vectors free, and is not amplified to a success
    probability while the other is. That closure explicitly named this goal as
    the successor and named its instrument as unavailable. The instrument turned
    out to be obtainable within the hour -- see KN-TECH-14efa5. This goal exists
    because the obstruction was real and the tooling blocker was not.

  campaign_budget:
    maximum_batches: 6
    rationale: >-
      Half of GOAL-MLKEM-003's twelve. This goal has a working instrument from
      batch one rather than spending batches acquiring one, and a measurement
      that disagrees with a model is decisive in a way that estimator arithmetic
      never was. If six batches cannot produce a measured score distribution and
      a stated comparison against the assumed law, that is itself informative and
      the goal closes at budget.

  instrument:
    obtained_by: KN-TECH-14efa5
    components:
      - passagemath-standard 10.8.7 (Sage; a redistribution, NOT upstream 10.9)
      - fpylll 0.6.4 (LLL, GSO, BKZ2; ships no sieve)
      - g6k 0.1.2 (General Sieve Kernel; gauss_sieve, bgj1, bdgl, hk3, nv)
    verified_by_execution:
      - "fpylll dim 60 qary q=3329, BKZ-30 x4 loops: ||b0|| 160.4 -> 130.3 (0.3s)"
      - "g6k dim 50 qary q=3329, gauss_sieve: db 4075 vectors (0.94s)"
      - "g6k dim 70 qary q=3329, bgj1: db 75511 vectors (335.2s)"
    reproducibility_warning: >-
      The instrument lives in an ephemeral container at /tmp/sagevenv and WILL
      NOT survive session end. KN-TECH-14efa5 records the exact install recipe
      including the two link-level fixes. Every batch must rebuild it and record
      the rebuild in its receipt; a batch that cannot rebuild it reports that as
      an infrastructure failure under AGENTS.md rule 5 and archives nothing else.

  completion_criteria:
    - >-
      A measured score distribution of sieve-produced dual vectors at a stated
      set of reduced dimensions, with the sieve algorithm, dimension, modulus,
      secret and error distributions, vector count, and random seed recorded, and
      with the measurement reproducible from the archived script.
    - >-
      An explicit comparison of that measured distribution against the law the
      cost models assume -- specifically the independence structure underlying
      `MATZOV.Nf`'s closed-form advantage computation -- reporting the direction
      and size of any departure, or reporting agreement, in whichever direction
      it falls, with a null object of the right shape run BEFORE any departure is
      believed.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying the measurement's controls, the absence of uncharged assumptions,
      and that no extrapolation from reduced dimensions to FIPS 203 dimensions is
      asserted beyond what a numbered heuristic supports.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry committed
      through a verified ledger archive, scoped to the exact dimensions, sieve,
      and parameters actually measured.

  pause_conditions:
    - >-
      The instrument cannot be rebuilt in a session and no route in
      KN-TECH-14efa5 works. Recorded under rule 5 as infrastructure, never as
      evidence about the mathematics.
    - >-
      A measurement is found to be contaminated by a harness defect that cannot
      be fixed within the batch. The defect is recorded and the batch reports no
      finding.

  standing_blocker:
    rule12: >-
      AGENTS.md rule 12 is UNMET and UNWAIVED and is INHERITED from
      GOAL-MLKEM-003. This goal may not record any result as correcting
      EV-MLKEM-015 or any other predecessor record. Two knowledge promotions
      (the KN-FIND-012 restatement and the KN-FIND-014 withdrawal) and a KN-TECH
      on callable-identity discipline remain OWED and blocked. Unblocking needs a
      `review-breakthrough` at policy `max` with `degradable: false`, which needs
      a second backend or a provisioned model.

  scope_discipline:
    - >-
      Reduced-dimension measurements are NOT crypto-scale evidence. Any statement
      about FIPS 203 dimensions is an extrapolation and must be stated as a
      numbered heuristic with its own uncertainty, per AGENTS.md rule 4.
    - >-
      A departure from the assumed law is not an attack and not a break. It is a
      statement that a cost model's input assumption does not match measured
      behaviour at the dimensions measured.
    - >-
      Agreement is as publishable as departure. The predecessor campaign's
      failure mode was reading a difference as a finding; this goal's symmetric
      failure mode would be needing the model to be wrong.

  current_batch_id: BATCH-6ec7a4
  dispatch_queue_path: coordination/goals/GOAL-MLKEM-004/batches/BATCH-68471b/dispatch_queue.json
