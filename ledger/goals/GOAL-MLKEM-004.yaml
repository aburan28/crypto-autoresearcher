research_goal:
  id: GOAL-MLKEM-004
  title: >-
    Measure the score distribution of sieve-produced dual vectors, and test the
    independence heuristic the dual-attack cost models assume
  objective: >-
    Answer KN-OPEN-016's actual question -- does the improved dual attack on LWE
    beat the primal attack once its heuristics are repaired -- by MEASURING the
    object the cost models assume, rather than by differencing two estimator
    functions. Ducas-Pulles argue the dual-sieve family's independence
    assumption is unsound; MATZOV-2022 and the pinned lattice-estimator's
    `MATZOV.Nf` both compute the required sample count N from a closed-form
    advantage law with no correlation term. Nobody has measured whether real
    sieve output obeys that law. This goal measures it at reduced dimensions and
    reports where the model departs from observation, in whichever direction it
    falls.

  question_ids:
    - RQ-MLKEM-003
  question_note: >-
    RQ-MLKEM-003 asks how much of ML-KEM's claimed security margin is MODEL
    rather than MEASUREMENT. GOAL-MLKEM-003 served it entirely with model; this
    goal serves it with measurement, which is the half that was missing.
    KN-OPEN-016 is the specific open problem within it.
  active_hypothesis_ids: []

  status: active
  runtime: claude_code

  predecessor: GOAL-MLKEM-003
  predecessor_note: >-
    GOAL-MLKEM-003 closed at budget on 2026-08-03 (DEC-20260803-64b55b) with a
    NAMED OBSTRUCTION: its instrument, the lattice-estimator, cannot answer this
    question, because every quantity it yields differences two cost models of
    which one drops an unbounded O() on the term that sets its own block size,
    receives its short vectors free, and is not amplified to a success
    probability while the other is. That closure explicitly named this goal as
    the successor and named its instrument as unavailable. The instrument turned
    out to be obtainable within the hour -- see KN-TECH-14efa5. This goal exists
    because the obstruction was real and the tooling blocker was not.

  campaign_budget:
    maximum_batches: 6
    rationale: >-
      Half of GOAL-MLKEM-003's twelve. This goal has a working instrument from
      batch one rather than spending batches acquiring one, and a measurement
      that disagrees with a model is decisive in a way that estimator arithmetic
      never was. If six batches cannot produce a measured score distribution and
      a stated comparison against the assumed law, that is itself informative and
      the goal closes at budget.

  instrument:
    obtained_by: KN-TECH-14efa5
    components:
      - passagemath-standard 10.8.7 (Sage; a redistribution, NOT upstream 10.9)
      - fpylll 0.6.4 (LLL, GSO, BKZ2; ships no sieve)
      - g6k 0.1.2 (General Sieve Kernel; gauss_sieve, bgj1, bdgl, hk3, nv)
    verified_by_execution:
      - "fpylll dim 60 qary q=3329, BKZ-30 x4 loops: ||b0|| 160.4 -> 130.3 (0.3s)"
      - "g6k dim 50 qary q=3329, gauss_sieve: db 4075 vectors (0.94s)"
      - "g6k dim 70 qary q=3329, bgj1: db 75511 vectors (335.2s)"
    reproducibility_warning: >-
      The instrument lives in an ephemeral container at /tmp/sagevenv and WILL
      NOT survive session end. KN-TECH-14efa5 records the exact install recipe
      including the two link-level fixes. Every batch must rebuild it and record
      the rebuild in its receipt; a batch that cannot rebuild it reports that as
      an infrastructure failure under AGENTS.md rule 5 and archives nothing else.

  completion_criteria:
    - >-
      A measured score distribution of sieve-produced dual vectors at a stated
      set of reduced dimensions, with the sieve algorithm, dimension, modulus,
      secret and error distributions, vector count, and random seed recorded, and
      with the measurement reproducible from the archived script.
    - >-
      An explicit comparison of that measured distribution against the law the
      cost models assume -- specifically the independence structure underlying
      `MATZOV.Nf`'s closed-form advantage computation -- reporting the direction
      and size of any departure, or reporting agreement, in whichever direction
      it falls, with a null object of the right shape run BEFORE any departure is
      believed.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying the measurement's controls, the absence of uncharged assumptions,
      and that no extrapolation from reduced dimensions to FIPS 203 dimensions is
      asserted beyond what a numbered heuristic supports.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry committed
      through a verified ledger archive, scoped to the exact dimensions, sieve,
      and parameters actually measured.

  pause_conditions:
    - >-
      The instrument cannot be rebuilt in a session and no route in
      KN-TECH-14efa5 works. Recorded under rule 5 as infrastructure, never as
      evidence about the mathematics.
    - >-
      A measurement is found to be contaminated by a harness defect that cannot
      be fixed within the batch. The defect is recorded and the batch reports no
      finding.

  standing_blocker:
    rule12: >-
      AGENTS.md rule 12 is UNMET and UNWAIVED and is INHERITED from
      GOAL-MLKEM-003. This goal may not record any result as correcting
      EV-MLKEM-015 or any other predecessor record. Two knowledge promotions
      (the KN-FIND-012 restatement and the KN-FIND-014 withdrawal) and a KN-TECH
      on callable-identity discipline remain OWED and blocked. Unblocking needs a
      `review-breakthrough` at policy `max` with `degradable: false`, which needs
      a second backend or a provisioned model.

  scope_discipline:
    - >-
      Reduced-dimension measurements are NOT crypto-scale evidence. Any statement
      about FIPS 203 dimensions is an extrapolation and must be stated as a
      numbered heuristic with its own uncertainty, per AGENTS.md rule 4.
    - >-
      A departure from the assumed law is not an attack and not a break. It is a
      statement that a cost model's input assumption does not match measured
      behaviour at the dimensions measured.
    - >-
      Agreement is as publishable as departure. The predecessor campaign's
      failure mode was reading a difference as a finding; this goal's symmetric
      failure mode would be needing the model to be wrong.

  superseded_next_action_batch_d2a728: >-
    The BATCH-d2a728 next_action was carried out. The measurement was made
    (17,919 certified sieve vectors), no finding was stated, and both
    independent reviews returned. Superseded by the next_action below.
  superseded_next_action_batch_f75059: >-
    The BATCH-f75059 next_action was carried out in full: the comparison was
    made well-posed, the vector-null was run, error bars were produced per
    candidate group, and the instrument was genuinely rebuilt. Superseded by
    the next_action below on the reviews' findings, not on failure.
  superseded_next_action_batch_c45baf: >-
    Carried out in full: the separation replicated on all 9 held instances and
    the Stage B redesign was reached. Superseded below because both re-run
    reviews showed the replicated quantity is forced by construction.
  superseded_next_action_batch_d3a45a: >-
    Carried out in full. T1 ran and returned NEITHER named outcome; T2, T3 and
    T4 all delivered. Superseded below because both reviews showed the third
    outcome is forced as well.
  next_action: >-
    BATCH 5 of 6. FIRST, two seconds of numpy: make the RANDDIR arm's Y a
    DETERMINISTIC function of its X instead of an independent draw. The batch-4
    red team measures 12.1507; confirm it on the program's own record. It closes
    the last live reading of the row-permutation excess -- if it separates,
    outcome A is dead alongside outcome B and no form of that observable
    survives. THEN, and this is the batch's real work, MEASURE WHAT THE
    HEURISTIC ACTUALLY ASSERTS: across-candidate score dependence. Nothing in
    four batches has attempted it, both batch-4 reviewers say so explicitly, and
    it is the only quantity in this campaign whose value is not determined by
    construction. Include the FFT-bin candidate family, unmet since batch 3.
    ALSO: supersede KN-TECH-9d21c4 with a revision adding a FIFTH obligation --
    alternative exhaustiveness, because batch 4 failed while executing step 4
    impeccably and never asked whether its two named outcomes exhausted the
    space -- turning obligation 3 into a criterion with a named comparator and
    threshold, and correcting the false novelty claim and the c4(8) reference.
    AND: archive raw vectors, and remove wall-clock truncation from any sampler
    whose output is an archived artifact. Every null still names object,
    statistic and a sensitivity demonstration with a NAMED COMPARATOR; every
    contrast states its forced value under the null not being tested; and no
    snapshot commit message contains a present-indicative sentence about what
    the numbers mean (DEC-20260804-5c9fe1 CE-2).

  outstanding_work:
    - >-
      A null object of the right shape must exist before any departure is
      believed. The predecessor campaign went two consecutive batches without one
      and its only run of one came back a coin flip (RT-20260803-f55e34 OBJ-4).
      This goal's batch 1 card carries the null as a completion-gate item, not as
      an aspiration.
    - >-
      CTRL-RT-4 from the predecessor: put a known-answer control on
      `estimator.lwe_dual.matzov` itself, the callable four batches argued about
      and none covered. Inherited as setup work.

  owner: coordinator
  created_at: '2026-08-03'
  updated_at: '2026-08-03'
  created_by_decision: DEC-20260803-4d4528
  batch_log:
    - batch_id: BATCH-d2a728
      decision_id: DEC-20260803-d810d0
      evidence_id: EV-MLKEM-da9e3b
      snapshot_commit: 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e
      reviews:
        - VAL-20260803-535d15
        - RT-20260803-4064e1
      summary: >-
        BATCH 1 OF 6, and the first measurement this program has made on this
        question. 17,919 g6k bgj1 vectors at dim 60 / q=127, all certified to
        lie in the dual lattice by integer arithmetic independent of the sieve
        and reconstructed end-to-end by both reviewers. No secret leakage: the
        validator ran the sieve to completion BEFORE drawing the secret and
        reproduced the database three ways. AGREEMENT WITH THE ASSUMED LAW IS
        REACHABLE and two ingredients agree -- the per-vector advantage law
        across ||x||^2 deciles (0.987-1.060, no trend) and uniform
        wrong-candidate noise against the iid prediction (ratio 1.00). Departure
        is localised to near-miss candidates. WHAT FAILED: the batch-1 null
        cannot fail and tests the wrong object, which is a Coordinator gate
        defect (PD-1); and two Coordinator overclaims are corrected by
        supersession (CE-1, CE-2), the first being the third overclaim in an
        immutable commit message in this program. Verdicts:
        ADMISSIBLE_WITH_DEFECTS (7) and pass_with_constraints (9 objections, 3
        must-fix). No ML-KEM claim of any kind; toy scale.
    - batch_id: BATCH-f75059
      decision_id: DEC-20260803-264d6a
      evidence_id: EV-MLKEM-50901f
      snapshot_commit: e08462acade972dd7cfa0f3e3a4e5f4f57a1b2c9
      reviews:
        - VAL-20260803-124629
        - RT-20260803-dc7568
      summary: >-
        BATCH 2 OF 6, and both reviews overturned two of its three headline
        conclusions -- in the OPTIMISTIC direction. The batch concluded the
        instrument was blind (PAC-1); the red team showed NULL-V's statistic
        contains no y at all, so it could not test blindness against lattice
        membership, and ran the null the batch owed: a row-permutation
        surrogate preserving both multisets and every column marginal separates
        from the real database by +35.6% and -13.6%, and does not decay as
        1/sqrt(N) while the surrogate does. THE CAMPAIGN'S FIRST POSITIVE
        SEPARATION, recorded at exactly one unreplicated computation. The
        impossibility proof is REAL BUT NARROW -- R2 is a free design choice
        (compare.py:372-379 is literally `if k==0 and k==25`), the tuple
        (35,0,0,.,.,60) is admissible, and nothing bears on KN-OPEN-016. What
        survives: a real rebuild, 10 known-answer controls including the
        callable-identity check four predecessor batches never ran, an exactly
        re-derived certificate, and Sheppard's correction as principled. FOURTH
        Coordinator overclaim in an immutable commit message (CE-1), the first
        in the pessimistic direction. PD-2: the PD-1 null rule was followed and
        was insufficient. Verdicts: ADMISSIBLE_WITH_DEFECTS (10 defects) and
        blocking_objections on the conclusions, not the data, with batch 3 to
        CHANGE and explicitly not abandon.
    - batch_id: BATCH-c45baf
      decision_id: DEC-20260803-81b778
      evidence_id: EV-MLKEM-b43de0
      snapshot_commit: 555a576209c5a4e8f1b0d3c7e2a94f6b8d5c1e0a
      reviews:
        - VAL-20260803-3fc363
        - RT-20260803-d2e23e
      review_note: >-
        Both reviews are RE-RUNS. The first pass was destroyed by a container
        replacement before archiving; see artifact_loss_incident.md. Nothing was
        forwarded and nothing was reconstructed. The re-runs reached the same
        central conclusion independently and by different constructions.
      summary: >-
        BATCH 3 OF 6. The separation replicated 9 of 9 and is STRONGER than the
        producer claimed -- the real pairing is strictly extremal among its 11
        pairings in every instance, joint p = 4.24e-10, reproduced by a validator
        on an independently rebuilt instrument. AND IT IS FORCED. An ensemble of
        iid Gaussian vectors with y a coordinate slice of x -- no lattice, no
        sieve, no matrix, no modulus -- reproduces the excess, the monotone
        decay and the graded contrast; a non-sieve BKZ dual family separates at
        5.43; the growth in N' is algebraically implied by any fixed separation.
        The near-miss score is one Fourier coefficient of the x-database at a
        frequency where it is coherent by construction. DISPOSITION
        reject_scoped. THE FINDING THAT SHOULD HAVE COME FIRST: the heuristic's
        own null was already in the producer's code and never reported -- both
        arms sit 7.1x and 9.4x BELOW the iid prediction, so three batches
        compared two failing objects to each other. What survives: the validator
        refuted the norm-coupling alternative in the producer's favour, Stage B's
        arithmetic re-derived to 13 significant figures, and the producer's PD-2
        refusal endorsed by both reviewers on independent grounds. CE-1: a
        snapshot message that says "I draw no conclusion" and then draws two --
        but the red team searched for a security claim and found NONE, and
        states it is not an overclaim of the e08462ac kind. PD-3: reviews now
        commit their own artifacts, adopted and exercised. Verdicts:
        ADMISSIBLE_WITH_DEFECTS (9 defects) and blocking_objections, batch 4 to
        CHANGE and explicitly not close.
    - batch_id: BATCH-d3a45a
      decision_id: DEC-20260804-5c9fe1
      evidence_id: EV-MLKEM-ba6c25
      snapshot_commit: e8cc366eb4ea3f9d1c05a7b2e4f80d6c93a15f7b
      reviews:
        - VAL-20260804-a84239
        - RT-20260804-37a8f2
      knowledge_promoted:
        - KN-TECH-9d21c4
      summary: >-
        BATCH 4 OF 6. The deciding check returned NEITHER named outcome: the
        valid non-sieve BKZ family separates at 5.4311 against the sieve's
        1.2704, so "it is about sieving" is EXCLUDED, and the producer reported
        C_NEITHER rather than choosing a nearest label. Both reviews then showed
        the third outcome is forced too. The red team derived
        excess = sqrt(1+rho) with rho measurable WITH NO SCORING, predicting
        1.3108/5.6880/5.9487 against measured 1.2937/5.4461/5.4298 and linear in
        N; the validator fit an independent first-order model predicting all
        five arms to 2-10%. LATTICE MEMBERSHIP IS NOT WHAT IT READS -- a family
        NOT in the lattice, with y a deterministic function of x, separates at
        12.1507. Nor is sieving: one round of pair reduction on a non-sieve pool
        drops 5.4311 to 3.2439 at unchanged norms. The validator settled the
        norm question by building the excluded family: matched norms, 4.4x
        apart. DISPOSITION reject_scoped, on the OBSERVABLE, not the arithmetic
        -- every printed digit reproduced. KN-TECH-9d21c4 PROMOTED after three
        deferrals, with four corrections owed and recorded rather than hidden.
        Two Coordinator errors: CE-1, I called a finding novel that
        RT-20260803-d2e23e had already reported, and propagated it into the
        knowledge entry; CE-2, a snapshot message that drew six conclusions
        after saying it drew none, repeating a defect named one batch earlier.
        PD-4 recorded and NOT worked around: the harness requires review
        artifacts to sit uncommitted across a dispatch window. Verdicts:
        ADMISSIBLE_WITH_DEFECTS (8 defects) and blocking_objections, batch 5 to
        CHANGE.
