research_goal:
  id: GOAL-ECQ-2298dc
  title: >-
    Exhibit an elliptic curve over Q of Mordell-Weil rank at least 32

  objective: >-
    THE OBJECTIVE, STATED LITERALLY: exhibit an elliptic curve over Q of Mordell-Weil rank >= 32.
    Not a proxy for it, not a leaderboard cell scored relative to size, not a rank over a number
    field, not a generic rank over Q(t), not an analytic or conjectural rank. An explicit curve
    over Q, with 32 rational points exhibited on it and certified independent in exact arithmetic.
    The user directive is that literal target and nothing adjacent to it. A previous campaign's
    rank->=31 result over multiquadratic fields was rejected for exactly this reason: IT MUST BE
    OVER Q. That rejection binds here. Any record in this campaign that reports a rank over a
    quadratic, multiquadratic or any other number field has not advanced this objective and must
    say so in its own text rather than leaving a reader to infer it.

  odds_assessment: >-
    THIS IS A REALISTIC ASSESSMENT AND IT IS DELIBERATELY NOT A MOTIVATIONAL ONE.
    (1) THE TARGET IS CONTESTED AND MOVING FAST. The live ICARM head is curve no. 302 at rank >= 31,
    posted 2026-08-23 -- three days after no. 273 took rank 30 on 2026-08-20. Before that pair, the
    record moved by +1 in EIGHTEEN YEARS (28, Elkies 2006; 29, Elkies-Klagsbrun 2024). Two
    increments in three days after eighteen years for one is the signature of an active, well
    resourced effort holding the frontier right now, not of a dormant target.
    (2) RANK >= 31 OVER Q IS THE LIVE RECORD AND IS CLAIMED. It is not unclaimed and must never be
    described as such in this campaign; an earlier session in this program made exactly that error.
    (3) OUT-SIEVING THE CURRENT HOLDERS IS NOT PLAUSIBLE WITH THIS PROGRAM'S RESOURCES. That is the
    honest collective verdict of the eight committed IDEA-20260824-* records for RQ-ECQ-e9b361, and
    several of those records say it about their own proposal in their own reach_to_32 and
    sota_delta fields. The prior campaign's measured sieve economics are not close: a constant
    factor on sieve yield buys well under one unit of rank (IDEA-20260824-324dca), and the campaign
    that ran the sieve took no record cell in three batches on any metric.
    (4) THE ONLY STRUCTURAL ROUTE THE IDEA SET IDENTIFIES IS A Q(t) FAMILY OF GENERIC RANK >= 32,
    which would hand rank >= 32 over Q by specialisation for almost all rational t. Nothing in the
    idea set exhibits such a family, and the standing record for generic rank over Q(t) is 18.
    (5) THE NEAREST GENUINELY REACHABLE WORLD RECORD IS GENERIC RANK >= 19 OVER Q(t). Elkies' 18 has
    stood since 2006 (Dujella's table, G(0) >= 18, retrieved by the idea-generator session), and
    IDEA-20260824-248142, -b26635 and -5980b2 each identify concrete routes at which 19 or 20 is the
    intermediate outcome rather than the jackpot. That is an adjacent record, not this objective.
    (6) THEREFORE THE HONEST PRIOR ON C1 IS THAT IT WILL NOT BE MET. It is recorded here, before any
    work, so that a later negative cannot be read as a surprise and a later positive cannot be read
    as expected. Recording a low prior is not permission to stop looking: premature closure is a
    failure mode symmetric with overclaiming (docs/inventor-protocol.md), and this goal is pursued
    in good faith under AGENTS.md rule 9 regardless of the prior above.

  state_of_the_art:
    rank_over_q_record: >-
      rank >= 31, ICARM curve no. 302, posted 2026-08-23. Board comment string reported as "BSD +
      GRH certified to rank 31, found by Claude, Levent Alpoge, and Ava Howell". THAT STRING AND THE
      CURVE DATA WERE RETRIEVED THROUGH A SUMMARISING FETCH TOOL, NOT BY DIRECT PAGE-SOURCE
      INSPECTION, and the caveat travels with every use of them.
    prior_ladder: >-
      28 (Elkies 2006), 29 (Elkies-Klagsbrun 2024), 30 (no. 273, 2026-08-20), 31 (no. 302,
      2026-08-23).
    generic_rank_over_qt_record: >-
      18, Elkies 2006, unbeaten for twenty years. The published record ladder over Q that has a
      public method description stands on a rank-17 elliptic K3 fibration, so 28 = 17 + 11 and
      29 = 17 + 12; whether 30 and 31 stand on the same base is UNKNOWN to this program and is the
      subject of IDEA-20260824-155411.
    prescribed_torsion: >-
      Every prescribed-torsion row is at least 11 below 32 (trivial 31; Z/2Z 20; Z/3Z 15; Z/4Z 13;
      downward), so torsion-constrained families are ruled out as a route to this objective.

  citations:
  - ref: IDEA-20260824-155411
    provenance: internal
    claim: >-
      Committed idea record carrying the retrieved state of the art for ICARM no. 302 and no. 273,
      the Simons/ICERM statement that the rank-29 search was a sieve on a rank-17 elliptic K3
      fibration -- the same surface used for rank 28 -- and the explicit note that NO public method
      description of the 2026 rank-30 and rank-31 steps was found. Its own citations are marked
      `retrieved` by the idea-generator session with the summarising-fetch caveat attached.
    verified_by: >-
      coordinator session authoring GOAL-ECQ-2298dc, 2026-08-24, which read the committed record at
      ledger/ideas/IDEA-20260824-155411.yaml
  - ref: IDEA-20260824-248142
    provenance: internal
    claim: >-
      Elkies' record table for generic rank over Q(T) -- 8, 9, 10 Neron (1952); 11, 12 Mestre
      (1991); 13 Nagao (1994); 14 Mestre and Kihara (2000-1); 15, 16, 17, 18 Elkies (2006-7) -- and
      the statement that an invariant rank of 19 or 20 would itself be a world record over Q(t).
    verified_by: >-
      coordinator session authoring GOAL-ECQ-2298dc, 2026-08-24, which read the committed record at
      ledger/ideas/IDEA-20260824-248142.yaml
  - ref: IDEA-20260824-b26635
    provenance: internal
    claim: >-
      Dujella's table of best known generic ranks over Q(t) by torsion group, trivial torsion
