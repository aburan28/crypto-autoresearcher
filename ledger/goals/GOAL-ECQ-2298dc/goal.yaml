    accounting_convention: >-
      DISCLOSED, NOT CLAIMED. This campaign charges PRODUCER WALL CLOCK ONLY against the total, the
      same convention GOAL-ECQ-002 used, and it therefore UNDERSTATES true consumption: validator,
      red-team and archival sessions are unmeasured, and in GOAL-ECQ-002 a single red team reported
      about 2600 s of its own compute. The number is carried unchanged only so it stays comparable
      across campaigns.

