  - ref: GOAL-ECQ-002
    provenance: internal
    claim: >-
      The predecessor campaign, its frozen ICARM baseline at
      coordination/goals/GOAL-ECQ-002/baseline/ (snapshot sha256
      118db069fcfc0cddc61bb00a235736202f01dc72d608b3c743bd342935cadc59, retrieved 2026-08-23T00:43Z),
      and its standing negative: no record cell taken in three batches on any metric at any rank
      threshold.
    verified_by: >-
      coordinator session authoring GOAL-ECQ-2298dc, 2026-08-24, which read the committed record at
      ledger/goals/GOAL-ECQ-002/goal.yaml

