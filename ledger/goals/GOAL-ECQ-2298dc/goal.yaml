      is the one construction that provably carries rank across the descent from Qbar(t) to Q(t).
    verified_by: >-
      coordinator session authoring GOAL-ECQ-2298dc, 2026-08-24, which read the committed record at
      ledger/ideas/IDEA-20260824-b26635.yaml
  - ref: IDEA-20260824-324dca
    provenance: internal
    claim: >-
      Best known ranks over Q with prescribed torsion (trivial 31, Alpoge-Howell 2026; Z/2Z 20;
      Z/3Z 15; Z/4Z 13; downward), and this program's own measured sieve economics, under which a
      constant factor on sieve yield is worth well under +1 of rank.
    verified_by: >-
      coordinator session authoring GOAL-ECQ-2298dc, 2026-08-24, which read the committed record at
      ledger/ideas/IDEA-20260824-324dca.yaml
  - ref: coordination/goals/GOAL-ECQ-2298dc/inputs/ICARM-302.json
    provenance: internal
    claim: >-
      The a-invariants and 31 witness points of ICARM curve no. 302, saved as a committed input.
      THE FILE CARRIES ITS OWN PROVENANCE CAVEAT IN ITS `_provenance` FIELD -- retrieved through a
