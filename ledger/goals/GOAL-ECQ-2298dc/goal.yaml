  completion_criteria:
  - id: C1
    primary: true
    met: false
    statement: >-
      THE LITERAL OBJECTIVE. An explicit elliptic curve over Q, FIRST EXHIBITED BY THIS PROGRAM, on
      which 32 rational points are exhibited and certified jointly independent in the Mordell-Weil
      group modulo torsion, subject to every one of the following, none of which may be relaxed:
      every point
      verified to lie on the globally minimal model in exact rational arithmetic; independence
      certified with NO FLOATING POINT ANYWHERE in the decision; the certificate re-runnable end to
      end by a third party from the committed artifacts alone; the curve absent from the frozen
      ICARM snapshot at coordination/goals/GOAL-ECQ-002/baseline/ by curve_key AND by a-invariants,
      absent from Cremona's tables, and checked against the LIVE board re-read at claim time with
      any third-party movement in between reported rather than absorbed. Rank is claimed as a
      CERTIFIED LOWER BOUND of 32; rank equality is not claimed.
    not_satisfied_by: >-
      Rank >= 32 over any number field, including a quadratic or multiquadratic field. Generic rank
      >= 32 over Q(t) WITHOUT an exhibited specialisation over Q meeting every clause above. An
      analytic rank, a Selmer bound, a conjectural rank, or any bound resting on BSD or GRH. A
      leaderboard cell scored relative to size at any rank threshold below 32.
  - id: C2
    primary: false
    met: false
    statement: >-
      SECONDARY AND ADJACENT. An explicit non-isotrivial elliptic curve over Q(t) of GENERIC
      Mordell-Weil rank >= 19 over Q(t), certified in this repository rather than cited, with its
      exact Shioda-Tate ceiling stated and its fibre census reproduced from the family's own
      discriminant. This would be a world record over Q(t), where the incumbent is Elkies' 18 from
      2006, and by Silverman specialisation it would give rank >= 19 over Q for almost all rational
      t. It is recorded here because it is the nearest genuinely reachable record the idea set
      identifies, and because a campaign that hides its reachable adjacent target ends up reporting
      it dishonestly as the main one.
    is_not_a_substitute_for_c1: >-
      READ THIS BEFORE REPORTING ANYTHING UNDER C2. Meeting C2 does not meet C1, does not partially
      meet C1, and is not progress toward C1 unless the same family is also shown to reach generic
      rank 32, which nothing in the idea set proposes. 19 is thirteen short of 32. A C2 result is
      reported as a Q(t) generic-rank result and never as an advance on the user's directive, and
      no deliverable may present the two criteria as alternatives on the same footing.
  closure_rule: >-
    ONLY C1 CLOSES THIS GOAL AS `completed`. C2 met alone, with C1 unmet, leaves the goal `active`
    or, at budget, `closed_at_budget` with C2 recorded as met and the primary target recorded as
    UNMET IN THE SAME SENTENCE. This rule exists because the secondary criterion is the obvious
    place a campaign under time pressure would declare victory, and it is written before any result
    exists, which is the only time such a rule is honest. Closure additionally requires a committed
    Coordinator decision naming the criterion met and citing its evidence (AGENTS.md rule 13 as
    suspended); the three-model quorum is not required and no attestation may be recorded that was
    not obtained.

  pause_conditions:
  - id: P1
    statement: >-
      Campaign budget exhausted: 3 batches or 10800 s of producer wall clock, whichever first.
  - id: P2
    statement: >-
      An archive fails post-commit verification, or a required record exists only in a local commit
      with no open PR against main.
  - id: P3
    statement: >-
      A required model policy cannot be honoured without a silent downgrade.
  - id: P4
    statement: >-
      The instrument cannot certify independence at record scale. If EXP-ECQ-f5af06 part A certifies
      materially fewer than 31 of the 31 witness points of ICARM no. 302 within its budget, then 32
      is not claimable by this program at this scale, and every route that ends in a 32-point
      certificate is paused until the instrument is rebuilt. This is a capability finding, not a
      mathematical one, and must be reported as such.
  - id: P5
    statement: >-
      This does NOT pause the goal, and is recorded here so that it cannot be mistaken for a pause:
      a third party posting rank >= 32 to the board is a real outcome to REPORT, never a licence to
      re-baseline. It would remove the world-record character of a C1 result; it would not change
      C1, which is the user's literal directive and is stated over the mathematics, not over the
      leaderboard.

  next_action: >-
    ONE ACTION AND ONLY ONE, AND THIS PROGRAM CANNOT TAKE IT. A HUMAN MUST REVIEW AND SEND
    coordination/goals/GOAL-ECQ-2298dc/inputs/DRAFT-elkies-request.md FROM A REAL ADDRESS,
    under the constraints in that file's own "Notes for whoever sends this": replace the
    signature block with a real person, keep the disclosure that an AI system drafted it, and
    do not overstate what this program has done -- the rank->=31 certification CONFIRMS AN
    EXTERNAL PARTY'S RESULT ON AN EXTERNAL PARTY'S CURVE and is not this program's. It asks
    N. D. Elkies for the explicit Weierstrass model of the rank-17 elliptic K3 fibration over
    Q(t) that carries the published record ladder (28 = 17 + 11, 29 = 17 + 12) and that he
    offered on NMBRTHRY in May 2006 and never posted.
    WHAT IT REACHES, STATED HERE SO THAT `blocked` IS NEVER READ AS "ONE EMAIL AWAY FROM 32":
    GENERIC RANK 17 OVER Q(t). IT REOPENS A LANE AND IT DOES NOT REACH C1. The remaining 15
    units of rank would still have to come from the specialisation sieve this campaign recorded
    as not plausible with its resources before any work began (odds_assessment items 3 and 4,
    IDEA-20260824-324dca). A decline or no reply is a COMPLETE ANSWER and closes that lane
    cleanly; it is explicitly NOT a reason to attempt the model's reconstruction, which
    coordination/goals/GOAL-ECQ-2298dc/inputs/SCOPING-recomputation-lane.md establishes would
    yield only rank 17 and so would not reach the objective EVEN ON COMPLETE SUCCESS.
    NOTHING IS DISPATCHED UNDER THIS GOAL. No batch, no experiment, no producer task, and no
    identifier is minted against this goal. A later session that wants to resume must first
    record in a NEW Coordinator decision that one of the three resume conditions in
    DEC-20260824-b7557b was met -- the model obtained from its author, a published model of
    generic rank >= 18 over Q(t) appearing, or a funded OSCAR step-0 lattice measurement
    reporting the free-parameter count d -- and must not resume by dispatching another search.
    NONE OF THE THREE REACHES RANK 32; each reopens a lane whose own ceiling is stated in that
    decision.
