research_goal:
  id: GOAL-XEDN-002
  title: >-
    Raised deg-a window coefficient-bound control (deg a≤4) on non-isotrivial
    surfaces
  objective: >-
    Reduce the outstanding falsification uncertainty left by GOAL-XEDN-001 /
    DEC-20260725-001 / TASK-20260725-006: whether Mordell-Weil relation
    coefficients among free-x integral sections (deg x≤2, deg y≤3) remain in
    {1,2,3} when the Weierstrass a-degree window is raised from deg a≤2 to
    deg a≤4 on non-isotrivial surfaces (a≠0, deg b=6, j non-constant) at
    p∈{7,13,19,31}, with a thickened p=31 eligibility target (≥10). Growth to
    inf-norm ≥4 forces withdrawal of the degree-window transfer of the
    coefficient-bound closure. (Note: raising free-x to deg x≤3 on deg-b=6 is
    empty — deg(x³+ax+b) is odd — so the executable RT control is the deg-a
    raise.) Toy scale only; no attack claim.
