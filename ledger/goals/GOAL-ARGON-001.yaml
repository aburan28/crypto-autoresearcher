  scheme_context:
    scheme: "Argon2i, Argon2d, Argon2id at RFC 9106 recommended parameter sets; scrypt and bcrypt as nearby objects"
    family: "memory-hard functions; depth-robustness and AT tradeoff attacks"
    nist_track: fielded_standard_adjacent
    standardization_status: >-
      RECALLED, UNVERIFIED: RFC 9106 specifies Argon2 and gives recommended
      parameter sets; Argon2id is a common default in password-hashing guidance.
    why_this_scheme: >-
      The measurement is a finite graph computation plus an implemented attack —
      no new theory — and its output lands directly in the coordinates
      practitioners already use, which is rare in this program. The published
      tradeoff attacks were significant enough to shift the recommendation
      toward the hybrid mode, so the concrete cost at today's recommended
      parameters is a live and unpublished number rather than a historical one.
  non_duplication:
    - >-
      GOAL-BLAKE-001 owns the BLAKE2-to-BLAKE3 margin transfer and BLAKE3's tree
      mode. Argon2's compression function is BLAKE2-derived, so the two goals
      touch related primitives; this goal makes NO claim about the compression
      function's cryptographic strength and treats it as a fixed black box whose
      only relevant property is cost per call. Neither goal may cite the other.
    - >-
      GOAL-SHA3-001 and the other symmetric goals own round-function
      cryptanalysis. Nothing here is cryptanalysis of a permutation; the object
      is a memory-access graph.
    - >-
      GOAL-AEADC-001 shares the discipline of measuring cost at FULL standard
      parameters rather than reduced ones. Discipline shared, objects disjoint.
  completion_criteria:
    - >-
      A MEASURED AT-COST REDUCTION at each recommended parameter set for each
      variant, reported as (computation, memory) pairs with machine model,
      compiler and repetition count declared.
    - >-
      A DIRECT GRAPH MEASUREMENT on the DAG induced by the actual recommended
      parameters, with exactly computed quantities reported as exact and bounded
      quantities reported with the bounding method named.
    - >-
      THE FRONTIER in (t, m, p) coordinates: the boundary beyond which the
      implemented tradeoff no longer reduces cost, with the boundary's
      uncertainty stated.
    - >-
      A THREE-VARIANT COMPARISON under one harness, presented so that the
      exchange between tradeoff resistance and data-dependence is legible as
      numbers rather than as advice.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      confirming that every cost is a pair rather than a scalar, that no
      synthetic input pipeline touched real credential data, and that no record
      recommends or deprecates a parameter set.
    - >-
