    - RFC 9106 and at least one primary tradeoff-attack reference cannot be obtained in primary text after the declared source-preference order is exhausted; recommended parameter sets must be read rather than recalled.
    - The tradeoff implementation fails to reduce cost within budget at every cell. Budget outcome about this implementation, never proof that no tradeoff exists (AGENTS.md rule 3).
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
