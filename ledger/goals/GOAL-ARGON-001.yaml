research_goal:
  id: GOAL-ARGON-001
  title: >-
    Argon2: measure the tradeoff attack's cost at the exact recommended
    parameter sets and map the frontier where it stops paying, in the same
    coordinates the recommendation table uses
  objective: >-
    Password hashing is where cryptographic parameter selection is most often
    performed by non-specialists reading a table, and the table's justification
    is asymptotic while the choice is concrete. Close that gap by measurement.
    Implement the published tradeoff attack against the real indexing functions
    and measure the achieved cost reduction at the RECOMMENDED parameter sets as
    (computation, memory) pairs — the AT metric the security argument itself
    uses — rather than as asymptotics. Measure the memory-access DAG directly:
    for concrete parameters it is a finite graph, and attacker-relevant
    quantities such as the size of a depth-reducing set can be computed or
    tightly bounded on the actual graph instead of bounded asymptotically. The
    deliverable is a FRONTIER in the (t, m, p) coordinates the recommendation is
    written in: the region where the tradeoff still pays and the region where it
    does not. Measure all three variants under one harness so the tradeoff-versus-
    side-channel exchange between data-independent, data-dependent and hybrid
    indexing is visible as numbers. No real password or credential data is used
    anywhere, and no parameter set is recommended or deprecated.
  question_ids: [RQ-ARGON-141710]
  active_hypothesis_ids: []
  status: active
