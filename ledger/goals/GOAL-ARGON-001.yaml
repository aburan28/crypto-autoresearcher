research_goal:
  id: GOAL-ARGON-001
  title: >-
    Argon2: measure the tradeoff attack's cost at the exact recommended
    parameter sets and map the frontier where it stops paying, in the same
    coordinates the recommendation table uses
  objective: >-
    Password hashing is where cryptographic parameter selection is most often
    performed by non-specialists reading a table, and the table's justification
    is asymptotic while the choice is concrete. Close that gap by measurement.
    Implement the published tradeoff attack against the real indexing functions
    and measure the achieved cost reduction at the RECOMMENDED parameter sets as
    (computation, memory) pairs — the AT metric the security argument itself
    uses — rather than as asymptotics. Measure the memory-access DAG directly:
    for concrete parameters it is a finite graph, and attacker-relevant
    quantities such as the size of a depth-reducing set can be computed or
    tightly bounded on the actual graph instead of bounded asymptotically. The
    deliverable is a FRONTIER in the (t, m, p) coordinates the recommendation is
    written in: the region where the tradeoff still pays and the region where it
    does not. Measure all three variants under one harness so the tradeoff-versus-
    side-channel exchange between data-independent, data-dependent and hybrid
    indexing is visible as numbers. No real password or credential data is used
    anywhere, and no parameter set is recommended or deprecated.
  question_ids: [RQ-ARGON-141710]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 5
    total_wall_clock_seconds: 14400
    max_concurrent: 3
  related_goals: [GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-AEADC-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "Argon2i, Argon2d, Argon2id at RFC 9106 recommended parameter sets; scrypt and bcrypt as nearby objects"
    family: "memory-hard functions; depth-robustness and AT tradeoff attacks"
    nist_track: fielded_standard_adjacent
    standardization_status: >-
      RECALLED, UNVERIFIED: RFC 9106 specifies Argon2 and gives recommended
      parameter sets; Argon2id is a common default in password-hashing guidance.
    why_this_scheme: >-
      The measurement is a finite graph computation plus an implemented attack —
      no new theory — and its output lands directly in the coordinates
      practitioners already use, which is rare in this program. The published
      tradeoff attacks were significant enough to shift the recommendation
      toward the hybrid mode, so the concrete cost at today's recommended
      parameters is a live and unpublished number rather than a historical one.
  non_duplication:
    - >-
      GOAL-BLAKE-001 owns the BLAKE2-to-BLAKE3 margin transfer and BLAKE3's tree
      mode. Argon2's compression function is BLAKE2-derived, so the two goals
      touch related primitives; this goal makes NO claim about the compression
      function's cryptographic strength and treats it as a fixed black box whose
      only relevant property is cost per call. Neither goal may cite the other.
    - >-
      GOAL-SHA3-001 and the other symmetric goals own round-function
      cryptanalysis. Nothing here is cryptanalysis of a permutation; the object
      is a memory-access graph.
    - >-
      GOAL-AEADC-001 shares the discipline of measuring cost at FULL standard
      parameters rather than reduced ones. Discipline shared, objects disjoint.
  completion_criteria:
    - >-
      A MEASURED AT-COST REDUCTION at each recommended parameter set for each
      variant, reported as (computation, memory) pairs with machine model,
      compiler and repetition count declared.
    - >-
      A DIRECT GRAPH MEASUREMENT on the DAG induced by the actual recommended
      parameters, with exactly computed quantities reported as exact and bounded
      quantities reported with the bounding method named.
    - >-
      THE FRONTIER in (t, m, p) coordinates: the boundary beyond which the
      implemented tradeoff no longer reduces cost, with the boundary's
      uncertainty stated.
    - >-
      A THREE-VARIANT COMPARISON under one harness, presented so that the
      exchange between tradeoff resistance and data-dependence is legible as
      numbers rather than as advice.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      confirming that every cost is a pair rather than a scalar, that no
      synthetic input pipeline touched real credential data, and that no record
      recommends or deprecates a parameter set.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The five-batch campaign budget is exhausted without an admissible next mechanism.
    - RFC 9106 and at least one primary tradeoff-attack reference cannot be obtained in primary text after the declared source-preference order is exhausted; recommended parameter sets must be read rather than recalled.
    - The tradeoff implementation fails to reduce cost within budget at every cell. Budget outcome about this implementation, never proof that no tradeoff exists (AGENTS.md rule 3).
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    COMPUTE THE DAG STATISTICS BEFORE IMPLEMENTING ANY ATTACK. For fixed (t, m,
    p) the memory-access graph is fully determined and finite; building it and
    measuring its structure requires no attack, no literature and no tuning, and
    it yields the quantity every tradeoff bound is a statement about. If the
    measured structure of the graph at recommended parameters differs from what
    the asymptotic argument assumes, that is the goal's most valuable result and
    it arrives in batch one at near-zero cost. Use synthetic inputs exclusively
    from the first line of code — no real password, credential, leaked corpus or
    third-party dataset enters this goal at any stage. Claim tier: measured cost
    at declared parameters; never a safety verdict and never a recommendation.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
