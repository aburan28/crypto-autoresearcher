  latest_verified_commit: null
  scheme_context:
    scheme: "BLS12-381 (Ethereum consensus, BLS aggregate signatures, several proof systems); BN254/alt-bn128 as the nearby object with a known re-estimation history"
    family: "pairing-friendly curves; discrete logarithm in GF(p^12) via the extended tower number field sieve"
    nist_track: de_facto_standard
    standardization_status: >-
      RECALLED, UNVERIFIED: not a NIST standard; a de facto one through
      deployment, with IETF/CFRG drafts for BLS signatures and pairing-friendly
      curves.
    why_this_scheme: >-
      BN254 is the program's cleanest historical instance of the pattern it
      hunts: a number computed once, quoted everywhere, and then moved by 28
      bits by a cryptanalytic advance that changed no parameter. BLS12-381 was
      chosen in response, using the same class of estimate. The recomputation is
      genuinely runnable — polynomial selection is a search this harness can
      execute, and a small-field DL gives a real certificate to calibrate
      against — and the deployment surface is enormous and growing.
  non_duplication:
    - >-
      GOAL-RSA-001 owns the memory-charged NFS baseline for FACTORING. This goal
      owns the DL variant in an extension field with a tower structure, where
      polynomial selection is the object of study rather than a fixed input. The
      memory-charging DISCIPLINE is shared and must be cited as method, not as
      evidence; neither goal's cost figures transfer to the other.
    - >-
      GOAL-SNFS-001 owns trapdoored special-form primes and their detectability.
      This goal makes no claim about how any deployed prime was chosen and is
      forbidden from making one.
    - >-
      GOAL-CLGRP-001 also fits a subexponential cost curve from small
      computations. Cross-primitive comparison of extrapolation methodology is
      admissible only after each goal has independently produced its own
      certified calibration.
  completion_criteria:
    - >-
      A REPRODUCED BASELINE: at least one published pairing-curve security
      estimate reproduced from its own stated inputs within a declared tolerance,
      or a reported reproduction failure with the exact inputs, the discrepancy's
      magnitude, and what could not be determined from the filed text.
    - >-
      AN INDEPENDENT POLYNOMIAL SELECTION for the deployed target field, with
      every choice recorded, and the resulting cost curve reported as
      (operations, memory) pairs — never as a scalar bit level.
    - >-
      A CALIBRATION CERTIFICATE: a completed discrete logarithm in a small
      GF(p^k) of the same tower shape, the exponent emitted and re-verified
      independently, with the observed cost used to anchor the model's constants.
    - >-
      THE SENSITIVITY TABLE: for each modelling choice, the movement in the
      headline figure over a declared range, with the choices ranked by
      influence.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      specifically checking that no uncharged memory, precomputation, or descent
      cost is hiding in the model and that no extrapolation is stated as a
      security verdict.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry committed
      through a verified ledger archive, scoped to the fields, parameters and
      model choices actually computed.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - The exTNFS reference and at least one key-size estimation paper cannot be obtained in primary text after the declared source-preference order is exhausted.
    - Polynomial selection or the calibration DL exceeds the declared budget after cheaper gates are exhausted. This is a budget outcome about this program's implementation and is never evidence about the curve (AGENTS.md rule 3).
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    START WITH THE CALIBRATION DL, NOT THE LITERATURE. A completed, certified
    discrete logarithm in a small extension field of the same tower shape is
    within reach immediately, requires no acquisition, and is the only anchor
    that makes any later extrapolation this program's own rather than a
    restatement of somebody else's constants. Run it, emit the certificate, and
    record the observed (operations, memory) pair. In parallel, implement
    polynomial selection for a small analogue so the machinery is validated
    before it is pointed at the deployed prime. Acquisition then determines which
    published figures can be reproduced and which modelling choices exist to
    sweep. Claim tier: cost-model calibration and sensitivity; never a security
    verdict on any deployed curve, and never a claim of a computation not run.
