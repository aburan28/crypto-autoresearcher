research_goal:
  id: GOAL-PAIR-001
  title: >-
    BLS12-381 and BN254: re-run exTNFS polynomial selection and charge memory
    for the target field, then measure which modelling choice each published
    bit level is actually a statement about
  objective: >-
    The security levels quoted for every pairing-based deployment are single
    evaluations of an exTNFS cost model with named free choices, and the BN254
    precedent shows what happens when those choices are revisited: a curve
    deployed at a quoted 128 bits was re-estimated near 100 without the curve
    changing. Do the recomputation. Run polynomial selection for the actual
    target field at the deployed prime, produce a cost curve rather than a
    scalar, charge memory for the linear-algebra step explicitly, and calibrate
    the model's free constants against a discrete logarithm this program
    actually completes in a small field of the same tower shape, emitted as a
    certificate. The primary deliverable is the SENSITIVITY TABLE: how many bits
    the headline number moves per modelling choice. A choice that moves the
    answer by ten bits and is made by convention is the finding, and it is
    reachable with arithmetic and search rather than with any break.
  question_ids: [RQ-PAIR-f2e31f]
  active_hypothesis_ids: []
  status: draft
