  # -------------------------------------------------------------------
  # NA-3: THE NAMING DEFECT. RECORDED HERE, NOTHING EDITED.
  # -------------------------------------------------------------------
  naming_defect_NA_3:
    what_it_is: >-
      A NAMING DEFECT THAT STOOD FIVE DAYS AND PROPAGATED INTO THIS LANE'S OWN
      DISPATCH CARD. Lemma 4 of Nagao 2015/984, as printed, puts the field
      equations S_fe INSIDE the fake system and OUTSIDE the true one. Because
      adjoining S_fe to the FAKE system is INERT -- every h_j(X_j^p - X_j) is 0 mod
      S_fe and Definition 6 states all three conditions mod S_fe, so d'_F is
      unchanged -- an "inside form" and an "outside form" distinguished ON THE
      FAKE SIDE are ONE STATEMENT, and one half of that pair had already been
      falsified on 2026-09-16.
    the_four_committed_documents:
      - document: coordination/review/sembin-20260916-e0a0c1/read-plan.yaml, prior P-4
        what_it_says: >-
          "the INSIDE form (d'_F taken of {f_1..f_M} UNION S_fe, which is how
          2015/984's Lemma 4 is written)" as against "the outside form".
        status: >-
          VOID AS A DISTINCTION. P-4 asserts that the upstream lemma both licenses
          and does not license one statement, so as written it is incoherent rather
          than merely false. The prior was therefore unfalsifiable in one direction
          and incoherent in the other, and a prior that cannot be confirmed is only
          half a prior.
      - document: coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/opening-report.md
        what_it_says: >-
          "Lemma 4's LITERAL form -- with the field equations OUTSIDE the fake
          system -- is FALSE".
        status: MISDESCRIBES LEMMA 4 AS PRINTED, which puts S_fe inside the fake system.
      - document: ledger/goals/GOAL-SEMBIN-fcb7a2/checkpoints/BATCH-e0a0c1.yaml
        what_it_says: >-
          "Lemma 4's LITERAL form -- field equations OUTSIDE the fake system -- is
          FALSE" (this lane's OPENING checkpoint).
        status: SAME DEFECT.
      - document: TASK-20260916-a8e5b5's own dispatch card, in BATCH-e0a0c1's dispatch_queue.json
        what_it_says: repeats the fake-side framing.
        status: >-
          SAME DEFECT, five days after the read plan. This is the propagation that
          makes the defect worth a record rather than a shrug.
    none_of_the_four_is_edited: >-
      CORRECT AND DELIBERATE. All four are committed and immutable under AGENTS.md
      core rule 4. Each is historically accurate for the moment it was written and
      each remains readable as the state the campaign was in. A correction
      supersedes by reference; it never overwrites.
    what_was_NOT_wrong: >-
      CORR-20260916-96f47d, WHICH IS WHERE THE DISTINCTION ORIGINATES, DREW IT ON
      THE TRUE SIDE AND DREW IT CORRECTLY: "Lemma 4 puts d_F on {f_1..f_M} with the
      field equations OUTSIDE the left-hand system", and its "with the field
      equations INSIDE" clause exhibits a TRUE-side fall. The goal head's ranked
      item (2) and tools/lemma4_inside_form.py both inherit that correct framing.
      THE DRIFT IS IN THE DOCUMENTS THAT RESTATED THE CORRECTION, NOT IN THE
      CORRECTION. This is recorded precisely because the cheap and wrong lesson
      would be "the 2026-09-16 correction was sloppy", and it was not.
    the_rule_this_imposes_on_every_FUTURE_record_of_this_campaign: >-
      STATE WHICH SIDE A PLACEMENT IS ON, EVERY TIME. A record that says "the
      inside form" or "the outside form" without naming the system -- fake or true
      -- is unreadable at best and, on the fake side, names a distinction that does
      not exist. Lemma 4 as printed is: S_fe INSIDE the fake system, OUTSIDE the
      true one.
    what_it_cost: >-
      LESS THAN IT MIGHT HAVE, and this is stated so the record is not read as
      worse than it was. The lane was still worth running: it produced J-3, the
      unstated hypothesis U-4, the U-1..U-7 inheritance list, the frozen-extraction
      hazard, and the whole Semaev read, none of which depended on the naming. What
      it cost is P-4's value as a prior.
    how_it_was_caught: >-
      BY THE ROUND'S OWN DESIGN. The reader caught it, and the proves-too-much
      control is what a proves-too-much control is for. Recorded as an argument for
      the procedure, not only as a defect.
    recorded_here_rather_than_as_a_CORR_record_because: >-
      This checkpoint is inside TASK-20260916-d4fb62's declared write scope and a
      ledger/corrections/ path is not. The ruling's NA-3 explicitly permits either
      ("as a correction OR in the closing checkpoint"). Recording it here keeps the
      archive's commit equal to its declared set, which is what makes the archive
      verifiable.

