# Write-once goal checkpoint shard (tools/shard_goal.py layout).
# GOAL-SEMBIN-fcb7a2 / BATCH-e0a0c1, written by the batch-opening coordinator
# task TASK-20260916-7ecd0f and committed by the snapshot archive
# TASK-20260916-b88c5a. Corrections are new records, never edits to this one.
#
# OPENING checkpoint. It records that a SECOND lane was opened on this goal,
# concurrent with BATCH-cbb416, for the zero-compute source read the goal head
# ranks second. It records no measurement, because this lane takes none by
# construction: every card carries maximum_runs 0.
batch_checkpoint:
  batch_id: BATCH-e0a0c1
  goal_id: GOAL-SEMBIN-fcb7a2
  question_id: RQ-SEMBIN-9e8f82
  opened_at: '2026-09-16'
  opened_by: coordinator
  opening_decision_id: DEC-20260916-441cd5
  closed_at: null
  closed_at_note: >-
    OPEN. This lane closes when both reads have returned, the Coordinator has
    composed them with every prior scored, and DEC-20260916-87fc5c is committed
    by the ledger archive TASK-20260916-d4fb62. The closing shard is a SEPARATE
    write-once file, BATCH-e0a0c1.closing.yaml, because this one is immutable.
    Calendar dates are supplied by the authoring runtime; this role holds no
    clock.
  disposition: control_plane_only
  disposition_note: >-
    ZERO RUNS, ZERO MEASUREMENTS, ZERO EVIDENCE RECORDS, NO HYPOTHESIS OR
    EXPERIMENT STATUS MOVED. This checkpoint records the opening of a queue and
    a read plan carrying the Coordinator's prior. Opening a lane is not progress
    against any completion criterion, exactly as authoring and approving a
    contract was not (CORR-20260916-402547).
  decision_id: DEC-20260916-441cd5
  evidence_ids: []
  evidence_ids_note: >-
    EMPTY, and EV-SEMBIN-1ca3c8 is RESERVED rather than promised. Whether a read
    of two external sources produces an evidence record at all is the closing
    ruling's decision: the honest alternative is a decision citing the two
    reports directly. The identifier is reserved so the ruling need not mint one
    under time pressure, and it is recorded here as reserved so a later reader
    does not read its absence as a lost record.
  hypothesis_ids:
    - H-SEMBIN-a7e721
  hypothesis_ids_note: >-
    Listed because this lane reads the provenance of a lemma that hypothesis's
    inference depends on. NOTHING HERE CAN MOVE ITS STATUS: it predicts a
    measurable separation and this lane takes no measurement.
  experiment_ids:
    - EXP-SEMBIN-4fa22c
  experiment_ids_note: >-
    Listed because the contract records Lemma 4 as a dependency and this lane
    reads that dependency's provenance. The contract is FROZEN and no card here
    may edit it; a change would be an additive amendment under a new id.
  dispatch_queue: coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/dispatch_queue.json
  lane_file: coordination/goals/GOAL-SEMBIN-fcb7a2/lanes/BATCH-e0a0c1.lane.json
  branch: cursor/semaev-2015-audit-program-5b8b

  # -------------------------------------------------------------------
  # THIS IS A SECOND CONCURRENT LANE, NOT A SUCCESSOR BATCH
  # -------------------------------------------------------------------
  concurrent_with:
    batch_id: BATCH-cbb416
    state_when_this_lane_opened: >-
      OPEN and dispatched. Its opening archive TASK-20260916-007117 is committed
      at d38386a31 and its collision audit TASK-20260916-fc72a6 is claimed and
      running.
    who_owns_the_operative_next_action: >-
      BATCH-cbb416's checkpoint, not this one. This lane's ranking is item (2) of
      the goal head; that batch holds item (3) and is the campaign's route to a
      run record.
    disjointness: >-
      The two lanes share exactly one file, the goal head, and each edits it
      additively inside its own archive (docs/concurrent-goal-lanes.md). No path
      under this batch's directory, its review directory, or either reader's task
      directory is declared by any card of BATCH-cbb416, and this lane declares
      nothing under BATCH-cbb416's tree.
    why_not_folded_into_that_batch: >-
      BATCH-cbb416 declares max_concurrent 1 because its executing producer is a
      degree-by-degree GF(2) rank computation with a 10 GB resident-set watchdog.
      Folding two readers in would have stacked them behind that executor for no
      reason, and raising its concurrency to admit them would have put readers in
      the same slot pool as the measurement — the failure mode BATCH-51e2aa
      recorded when a Macaulay2 phase drove the load average to 4.55 and a review
      joint had to be split out to keep a timing clean.

  # -------------------------------------------------------------------
  # WHAT IS AT STAKE
  # -------------------------------------------------------------------
  why_this_lane_exists: >-
    EXP-SEMBIN-4fa22c measures the FAKE first fall degree d'_F. Every route from
    that quantity to any statement of Nagao's runs through 2015/984's Lemma 4,
    d_F <= d'_F. That paper asserts Lemma 4 WITHOUT PROOF, derives it from its
    Lemma 3, attributes Lemma 3 to [11] = Nagao 2013/549, and declines to
    reproduce the proof ("Proof of this Lemma is complicated and not
    constructive", inputs/NAGAO-2015-984/paper_fulltext.md :507). This program
    has separately verified by exhaustive two-polynomial search over F_2 that
    Lemma 4's LITERAL form — field equations OUTSIDE the fake system — is FALSE.
    So the campaign is about to spend compute on a quantity whose only bridge to
    its target is a lemma with no proof in the consuming paper, no reader in this
    program before 2026-09-13, and one form already known false. The contract
    consumes Lemma 4 rather than testing it, so the run cannot discover this.
  the_trap_the_first_read_is_built_around: >-
    2013/549 HAS ITS OWN LEMMA 3 — paper_fulltext.md :1081 — and it is an
    unrelated weight-degree statement about monomials. A reader who greps for
    "Lemma 3" in the upstream paper will find it, and will report on the wrong
    statement confidently. The card therefore requires matching on CONTENT rather
    than number, and the Coordinator's prediction about which statement is the
    real match sits in the read plan the reader may not open.

  # -------------------------------------------------------------------
  # TASKS
  # -------------------------------------------------------------------
  tasks:
    - id: TASK-20260916-7ecd0f
      role: coordinator (lane opening; ran in-session)
      state_at_this_checkpoint: completed
      outcome: >-
        DEC-20260916-441cd5 recorded, seven-card queue built and rendered with
        every gate passing and no inference advisory,
        REVIEW-SEMBIN-20260916-e0a0c1 written with six numbered predictions
        before either reader was dispatched, this shard written, and the goal head
        edited additively. Zero runs.
    - id: TASK-20260916-b88c5a
      role: coordinator (snapshot archive, runs alone)
      state_at_this_checkpoint: queued
      why_it_gates_both_readers: >-
        A blind_from list that could still be edited after the readers run is not
        a declared blindness. This archive commits the read plan and the prior so
        that what the readers were blind FROM is fixed and hash-bound before they
        start.
    - id: TASK-20260916-9da6e0
      role: validator (blind read of Nagao 2013/549; independent session)
      state_at_this_checkpoint: queued
      joints: J-1, J-2, J-3, plus the J-5 proves-too-much control
    - id: TASK-20260916-64a93b
      role: validator (blind read of Semaev 2015/310; independent session)
      state_at_this_checkpoint: queued
      joints: J-4, plus the J-5 proves-too-much control
      parallel_with: TASK-20260916-9da6e0, mutually blind, disjoint joints
    - id: TASK-20260916-92128f
      role: coordinator (snapshot archive of both reader packages, runs alone)
      state_at_this_checkpoint: queued
      binding_mode: content_first
      binding_mode_note: >-
        DIFFERENT FROM THE OPENING ARCHIVE ON PURPOSE. A reader's filed report
        never legitimately changes, so content_first — which verifies at HEAD —
        is the mode that catches an in-place edit to one. The sibling campaign has
        suffered exactly that twice (CORR-20260916-5166fe, CORR-20260916-2e9bc3),
        both times from a concurrent session fixing something in place.
    - id: TASK-20260916-a8e5b5
      role: coordinator (composition; drafts the ruling)
      state_at_this_checkpoint: queued
      required_to: >-
        score every prediction P-1..P-6 as confirmed, refuted or untested, and
        name every joint with a verdict or an explicit `unowned`.
    - id: TASK-20260916-d4fb62
      role: coordinator (ledger archive, runs alone)
      state_at_this_checkpoint: queued
      writes: DEC-20260916-87fc5c, BATCH-e0a0c1.closing.yaml, an additive goal-head rerank

  # -------------------------------------------------------------------
  # REVIEW ARCHITECTURE
  # -------------------------------------------------------------------
  review:
    round_id: REVIEW-SEMBIN-20260916-e0a0c1
    plan_path: coordination/review/sembin-20260916-e0a0c1/read-plan.yaml
    written_before_any_reader_ran: true
    what_kind_of_round: >-
      A SOURCE READ rather than a review of a run: there is no run and no
      artifact of this program under examination. It is written as a review plan
      anyway because the last read of this paper family OVERTURNED the
      Coordinator (CORR-20260916-96f47d), and it did so because the prior was
      recorded first and the reader was blind from it.
    joints: 5
    owners: 2
    proves_too_much_control: >-
      REQUIRED of both readers. For J-3 the known-false object is supplied by the
      program's own exhaustive counterexample: if a reconstruction of Lemma 4 from
      the upstream lemma also goes through with the field equations OUTSIDE, the
      reconstruction is wrong somewhere and locating that is worth more than the
      reconstruction.
    priors_recorded: 6
    prior_the_coordinator_expects_to_lose: >-
      P-4, the load-bearing one. A reader who finds the upstream lemma unproved or
      insufficient for the inside form produces the most valuable outcome
      available here, because the contract would have to record its Lemma 4
      dependency as weaker. Confirmation leaves the campaign where it stands.
    prior_recorded_because_it_was_already_wrong: >-
      P-3. The Coordinator's first reading was that 2015/984 had silently dropped
      a locality hypothesis, which would have been a serious finding; the
      definition at 2013/549 :180 refuted it within minutes. Recorded so the
      ruling scores calibration against what the Coordinator actually believed
      rather than against the beliefs that survived its own checking.
    blindness_limit_declared: >-
      The J-1 answer is a lemma number in a public paper, derivable by grep, so
      the blind buys real independence on J-2, J-3 and J-4 and much less on J-1.
      Stated rather than hidden, because CORR-20260916-292e53 is this campaign's
      record of a protective document that leaked what it protected.

  # -------------------------------------------------------------------
  # BOUNDS
  # -------------------------------------------------------------------
  what_this_lane_cannot_reach:
    - >-
      It cannot refute Nagao's Proposition 5 and nothing in it may be presented
      as doing so. DC-1 of DEC-20260916-88ac73 is untouched by either read.
    - >-
      It cannot promote or weaken H-SEMBIN-a7e721. The hypothesis predicts a
      measurable separation; this lane measures nothing.
    - >-
      It cannot discharge a completion criterion by itself. All four require a
      committed decision on run or read evidence, and a report is not a decision.
    - >-
      It cannot settle anything about the FIRST revision of Nagao 2013/549. Only
      the last of two revisions is served, that is what the program froze, and
      this environment cannot fetch an unserved revision. Both readers are told to
      report the limit rather than reason about a version they cannot open.
    - >-
      IF A READER FINDS THE UPSTREAM LEMMA UNPROVED OR INSUFFICIENT, the claim
      that follows — a published subexponential ECDLP bound resting on an
      unsupported lemma — is a contradiction of established evidence under core
      rule 12 and requires `review-breakthrough` at max. That tier is
      undegradable and cannot be served in this environment, so the finding is
      recorded at its narrowest supported scope and the CLAIM stays un-promoted
      while the campaign stays ACTIVE. A limit on the claim, never on the campaign,
      and never a reason to soften the finding so a servable tier will carry it.

  completion_criteria_status_at_this_checkpoint: >-
    UNCHANGED. Criterion 4 remains the only one met, by DEC-20260913-8d19e5.
    Criteria 1, 2 and 3 require run records that do not exist. This lane changes
    reachability and conditionality, not status.

  what_was_measured: >-
    Nothing. Every card carries maximum_runs 0 and the two producers are readers
    of frozen PDF text. The one thing that happened to a measurable quantity in
    this lane's opening is that none was touched.
