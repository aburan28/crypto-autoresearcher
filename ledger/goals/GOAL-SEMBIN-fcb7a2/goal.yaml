    d'_F > 4 result refuted a published proposition, core rule 12 would make its review
    review-breakthrough at max. Under the corrected reading such a result refutes the justification
    rather than the proposition, which is a weaker claim class -- and this record does NOT therefore
    pre-authorize a cheaper review. The tier is set by what a result actually claims, when it claims
    it. A result presented as contradicting Proposition 5 still requires review-breakthrough at max,
    undegradable, whatever the instrument was designed to reach.

