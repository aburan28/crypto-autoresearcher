      its reading remains one of the two this goal now requires to be reported.
    - >-
      Tooling readiness, a designed contract, an assembled ideation batch, or an
      approval decision NEVER satisfies any criterion above. Each requires a
      measurement or a derivation with its scope stated. Approving EXP-SEMBIN-4fa22c
      is explicitly not progress against criterion 1; only its run records and their
      independent review are.
