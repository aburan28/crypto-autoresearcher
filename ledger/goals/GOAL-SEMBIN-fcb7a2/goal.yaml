  completion_criteria:
    - >-
      A committed Coordinator decision states, on the evidence of EXP-SEMBIN-4fa22c's
      run records, whether the FAKE first fall degree d'_F of EQS4 matches that of
      EQS2 in matched pairs at every reachable cell, and in particular whether the
      degree-4 bound Proposition 5 asserts is CONFIRMED at those cells via Lemma 4.
      An honest negative answer satisfies this criterion, and so does an honest
      "confirmed at every cell we can reach". What does not satisfy it is a degree
      reported without its matched control, or a degree reported with only ONE of the
      two consequences the source ambiguity forces (objective (2)): every reported
      d'_F carries both the fake-degree-reading consequence and the
      true-degree-reading consequence, and a report that silently picks a reading
      fails this criterion however the number came out.
    - >-
      A committed Coordinator decision states whether the argument-by-analogy that
      Proposition 5 offers in place of a proof -- "the situation is the same as the
      Semaev's case" -- transfers to EQS4 as an explicit construction at the tested
      cells, or names the exact step at which it fails to transfer. This is separable
      from the criterion above and is the one this campaign can answer in BOTH
      directions: the analogy either produces the degree-4 fall for the shifted system
      or it does not, and the second outcome is a statement about the PROOF and never
      about the proposition's truth.
    - >-
      A committed Coordinator decision states the map between Nagao's Definition 5
      d_F, his Definition 6 d'_F, and the Macaulay-rank statistic this program's own
      instruments compute, on identical instances, so that existing internal degree
      measurements can be read as bearing on a Nagao or Semaev assumption or
      explicitly as not bearing on it. Either answer satisfies the criterion; leaving
      the map unstated does not. This closes the gap KN-OPEN-d218ec opened under the
      parent goal, from the Nagao side.
    - >-
