research_goal:
  id: GOAL-SEMBIN-fcb7a2
  title: >-
    Audit of Nagao's ECDLP programme (ePrint 2015/984 with its 2013/548 and 2013/549
    antecedents): Proposition 5's unproven coset invariance, Theorem 1's concrete cost,
    and the true-versus-fake first-fall-degree gap this program has never drawn
  objective: >-
    Establish what Nagao's disjoint-coset chained-S_3 index calculus over F_{p^n}
    actually supports, at the scale this program can measure, and state the boundary of
    that support explicitly. Nagao 2015/984 claims ECDLP over F_{2^n} in O(n^{8w+1})
    under the first fall degree assumption -- the ePrint's own keyword is "polynomial
    time algorithm" -- and the claim rests on a chain of steps of very unequal
    evidential standing. Four separable uncertainties, in the order their answers
    unblock each other.

    (1) THE UNPROVEN STEP. Proposition 5 asserts that the first fall degree of EQS4
    (the Weil descent of the DISJOINT-COSET system EQS3) obeys the same bound as
    EQS2 (the descent of Semaev's unshifted system): 4 at p = 2, 3p+1 at p >= 3.
    Its entire justification is footnote 6, "The situation is the same as the Semaev's
    case. So, we omit the proof." Every complexity statement downstream --
    Propositions 6, 7 and Theorem 1 -- consumes it. Nothing in this program or, so far
    as its corpus reaches, in the literature has tested it. This is the goal's first
    and highest-ranked target and is the subject of H-SEMBIN-a7e721 /
    EXP-SEMBIN-4fa22c.

    (2) THE DEFINITIONAL GAP. Nagao is unusually explicit that the community conflates
    two different quantities -- Definition 5's TRUE first fall degree d_F and
    Definition 6's FAKE d'_F, computed modulo the field equations -- and says so in
    those words: "Many researchers misunderstand the definition of first fall degree
    and use this assumption and estimation of the complexity using the following FAKE
    version." His Lemma 4 gives d_F <= d'_F in ONE direction only. This program has
    never drawn that distinction: GOAL-DREG-001's Macaulay-rank measurements, the
    d_F4-versus-d_reg map open under GOAL-SEMBIN-5078bc (KN-OPEN-d218ec), and every
    internal record that says "first fall degree" are all silent about which of the
    two they mean. Until the map is stated, an internal degree measurement cannot be
    read as bearing on any Nagao or Semaev assumption in either direction.

    The inequality's direction is not a technicality, and WHICH QUANTITY PROPOSITION 5
    BOUNDS IS UNDECIDED IN THE SOURCE ITSELF. This was found on 2026-09-15 by reading
    the frozen bytes, after two records in this repository stated OPPOSITE
    consequences for the same instrument, and it is the reason neither was simply
    wrong:

      - Proposition 5 is PRINTED as "First fall degree of EQS4(m,R) is bounded by 4
        (p = 2)" (paper_fulltext.md line 719), unqualified -- which by the paper's own
        Definition 5 (line 398) is the TRUE d_F. Under that reading, and because
        Lemma 4 gives d_F <= d'_F, a measured d'_F <= 4 CONFIRMS the bound and a
        measured d'_F > 4 REFUTES NOTHING: exceeding an upper bound on d_F says
        nothing about d_F.
      - Its ONLY justification is footnote 6 (line 844), "The situation is the same as
        the Semaev's case. So, we omit the proof." The passage that footnote defers to
        (lines 449-452) describes Semaev's argument as producing "the relation that
        its Fake first fall degree d'_F <= 4". Under THAT reading Proposition 5 is a
        statement about d'_F, and a measured d'_F > 4 refutes it directly.

    The two readings invert the instrument's evidential direction, so no success
    criterion may be frozen on either alone. The rule this goal adopts instead costs
    nothing and is strictly more informative: an experiment reports the measured d'_F
    and BOTH consequences side by side, never one. A measured d'_F > 4 is then
    recorded as refuting the fake-degree reading of Proposition 5 AND as not bearing
    on the true-degree reading -- and that pair is the scientific content, not either
    half of it. This is the quantifier-order audit of docs/inventor-protocol.md
    section 8 arriving before any compute, which is where it is cheap.

    AMENDED 2026-09-16 UNDER DEC-20260916-88ac73: THE SENTENCE ABOVE BEGINNING "WHICH
    QUANTITY PROPOSITION 5 BOUNDS IS UNDECIDED IN THE SOURCE ITSELF" IS SUPERSEDED AND
    WAS WRONG. It is left standing rather than deleted, because the ranked action it
    justified -- an independent blind read of exactly that question, barred from this
    record -- is what refuted it, and a reader who cannot see the superseded claim
    cannot see why the read was worth its cost.

    The source DOES decide the referent: the TRUE d_F, at a stated confidence near
    0.85-0.9. The argument this record missed is that Lemma 6's statement is in d_F
    while its proof (:580-583) bounds the FAKE quantity and converts by Lemma 4, so a
    d_F statement proved through a d'_F bound is the paper's CONVENTION -- which makes
    footnote 6's deferral of Proposition 5 to a fake-degree argument evidence about how
    the paper proves things and no evidence at all about what Proposition 5 is about.
    This record read a proof as evidence about a statement's referent. Independently,
    Proposition 5 feeds Proposition 6's exponent 4w through Lemma 2 and Assumption 1,
    both written in d_F, so the bounded quantity must be d_F or Proposition 6 does not
    follow. Full account: CORR-20260916-96f47d.

    THE BOTH-CONSEQUENCES RULE SURVIVES THE CHANGE INTACT and is retained on a restated
    basis: the true-degree reading is now primary and the fake-degree reading is a
    recorded ~0.1-0.15 residual rather than a co-equal branch. Reporting both is still
    free and still mandatory, because the directions genuinely differ between the
    readings and a report that silently assumes one is unreadable by anyone holding the
    other. What changes is the correction of a direction: a measured d'_F > 4 does NOT
    refute Proposition 5 under the operative reading, since d_F <= d'_F permits
    d_F <= 4 < d'_F; it refutes the paper's ONLY justification at that instance, leaving
    the proposition UNPROVEN there rather than false. That is the campaign's reachable
    target. And a fourth constraint the ambiguity had hidden: a Boolean-ring instrument
    is STRUCTURALLY unable to exhibit d_F > 4, so no tuning makes it a refuter of
    Proposition 5 (DC-1 of DEC-20260916-88ac73).

    (3) THE CONCRETE COST. What Theorem 1's O(.) and Section 6's self-described "HUGE"
    o(1) absorb, at the FIPS binary labels. ALREADY IN FLIGHT UNDER THE PARENT GOAL and
    deliberately not re-homed here: H-SEMBIN-4a80f3 / EXP-SEMBIN-db9bc3 under
    GOAL-SEMBIN-5078bc BATCH-9d649f owns it, grants Proposition 5 explicitly rather
    than testing it, and is cross-referenced from this goal rather than moved into it.
    This goal's contribution to (3) is to supply the Proposition 5 answer that
    experiment currently has to assume.

    (4) THE UPSTREAM PAPERS. inputs/NAGAO-2013-548/ and inputs/NAGAO-2013-549/ were
    frozen into this repository on 2026-09-13 and, at the time this record was written,
    NO AGENT IN THIS PROGRAM HAD READ EITHER. They are cited here as frozen pointers
    and support nothing. 2015/984 attributes Lemma 3 and Lemma 5 to "[11]", one of
    them; the omitted Proposition 5 proof may or may not exist there, and whether it
    does is a cheap and high-value question. TASK-20260913-0188bf is reading them
    concurrently with this record's authorship; its result is not assumed here.

    Scope discipline: only standalone mathematical instances and derivations from
    published formulas are in scope. No deployed target, no private-key recovery, and
    no claim about the security of any curve in either direction. The FIPS binary
    curves appear in this campaign only as parameter labels in a cost table, and a
    degree measured at n <= 44 is evidence about n <= 44.
