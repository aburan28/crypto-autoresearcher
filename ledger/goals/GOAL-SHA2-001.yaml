research_goal:
  id: GOAL-SHA2-001
  title: "SHA-256: reproduce a step-reduced certificate, then measure whether the frontier is set by the search instrument or by the message schedule's degrees of freedom"
  objective: >-
    Establish this program's first symmetric-cryptanalysis capability against a
    primitive where certificates are literal. Reproduce a published
    step-reduced SHA-256 collision as an executable message pair verified by an
    independent FIPS 180-4 implementation; build the degrees-of-freedom versus
    conditions ledger over step counts; and discriminate the two competing
    explanations of the published stall — instrument-limited versus
    deficit-limited — by the different predictions they make under increased
    solver budget. Report the deficit curve for SHA-512 under the identical
    procedure as a nearby-object control. No claim about full 64-step SHA-256
    is in scope in either direction.
  question_ids: [RQ-SHATWO-f196c7]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MD5-001, GOAL-SHA1-001, GOAL-SHA3-001, GOAL-BLAKE-001, GOAL-AES-001]
  scheme_context:
    scheme: "SHA-256 (FIPS 180-4), with SHA-512 as the paired control"
    family: "Merkle-Damgard / Davies-Meyer, ARX + Boolean round function"
    nist_track: fielded_standard
    standardization_status: >-
      FIPS 180-4, not on a migration path. The collision-resistance root of
      TLS chains, code signing, and HMAC-SHA-256.
    why_this_scheme: >-
      Two reasons, and the second is the operative one. First, the program has
      no symmetric lane at all while holding goals against nine PQC families.
      Second, and unlike every other lane this program runs, SHA-2 admits
      LITERAL CERTIFICATES: a colliding pair is checkable by any reader in
      microseconds, with no extrapolation, no heuristic, and no cost model in
      between. That is the strongest evidence tier available anywhere in this
      program, and it has never been exercised.
  non_duplication:
    - >-
      GOAL-MD5-001 owns instrument calibration. The automated characteristic
      search used here is validated there, against a primitive whose full
      attack pipeline is executable end to end. This goal consumes that
      calibration and does not redo it; if BATCH-001 finds itself validating
      the solver rather than using it, it has crossed into GOAL-MD5-001.
    - >-
      GOAL-SHA1-001 owns charged real-world collision cost and detection. This
      goal produces no cost extrapolation toward a full-round attack and makes
      no deployment statement.
    - >-
      GOAL-AES-001/002/003 own block-cipher propagation objects. The tracked
      object here is a hash message schedule's degrees of freedom, which has no
      AES analogue, but the CHARGING AND CERTIFICATE CONVENTIONS established in
      the AES goals bind: whichever of the two runs second adopts the other's
      conventions or records why it cannot.
    - >-
      GOAL-SHA3-001, GOAL-BLAKE-001 and GOAL-ASCON-001 apply the same
      instrument to different permutations. Cross-primitive comparison of
      deficit curves is admissible only after each has independently
      reproduced a published baseline; a comparison table built before that is
      the failure this clause exists to prevent.
  completion_criteria:
    - >-
      A REPRODUCED CERTIFICATE: a step-reduced SHA-256 collision (or
      semi-free-start collision) at a named step count, emitted as the literal
      input pair, re-verified by a second independent FIPS 180-4
      implementation, with the reproduced step count and cost stated against
      the published claim. A reproduction FAILURE, reported with the encoding,
      solver, seed and budget that produced it, satisfies this criterion:
      it is a result about this program's instrument and is recorded as such.
    - >-
      A DEFICIT LEDGER over step counts: free message-schedule bits available
      to message modification against conditions imposed by the best
      characteristic found, per step count, with the crossing point stated,
      and the identical ledger computed for SHA-512 as the nearby-object
      control.
    - >-
      A DISCRIMINATION RESULT: solver budget varied over a pre-declared range
      with everything else fixed, reporting whether the reachable step count
      moves. Instrument-limited and deficit-limited predict differently here,
      and the answer is the goal's durable output whichever way it lands.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with every conclusion scoped
      to the exact step counts, solver, and budget actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The chosen step-reduced attack cannot be obtained in primary text under
      the network policy after the declared source-preference order is
      exhausted, leaving nothing to reproduce against.
    - >-
      The characteristic search exceeds the declared campaign budget after
      cheaper falsification gates are exhausted. This is a budget outcome about
      a solver and is NEVER evidence about SHA-256 (AGENTS.md rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Do not open with a characteristic search. Open with acquisition and the two
    cheap gates that can end the expensive branch early: file the chosen
    step-reduced attack as KN-LIT from primary text, and pin a FIPS 180-4
    implementation validated against the NIST test vectors. THE FIRST TECHNICAL
    GATE IS THE DEFICIT LEDGER, NOT THE ATTACK: counting free schedule bits
    against imposed conditions is a finite computation that needs no solver at
    all, and it predicts the published frontier before any search is run. If
    the ledger's crossing point does not match the published stall, the model
    is wrong and the campaign has learned that in BATCH-001 for almost nothing.
    Only then attempt the reproduction. Claim tier: reduced-round certificates
    and a deficit measurement; never a statement about full SHA-256, HMAC, or
    any deployed chain.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
