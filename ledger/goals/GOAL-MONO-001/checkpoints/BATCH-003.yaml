    The m=3 slice of KN-OPEN-009 is answered by derivation, and it is the DEGENERATE slice:
    a transitive degree-2 group is primitive, so the imprimitivity mechanism the open problem
    hunts cannot exist there.
  most_consequential_finding: >-
    SUPPLIED BY THE RED TEAM, NOT THE PRODUCER, and it is an UNDERCLAIM correction. On the
    factor-base locus the summation fibre splits completely AT EVERY m, by the group law -
    verified at m=4, 193/193 triples. So a generic-fibre Frobenius census measures a quantity
    identically trivial where relation search operates. That is what N-1 now turns on.
  known_defects: >-
