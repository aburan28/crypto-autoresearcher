  outcome: >-
    The frozen m=3 census ran clean - 80 random ordinary controls across four pinned primes,
    22 CM-screen curves, 3150000 specializations, all 11 declared controls reporting pass,
    outcome_id FULL_MONODROMY_BARRIER_TOY. BUT THE OUTCOME IS NOT THE EVIDENCE. The run found
