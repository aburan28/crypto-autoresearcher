# completes on effect of this batch, so no successor batch will exist to write
# this shard. It is written by the composing act TASK-20261022-a2f575 before
# the batch's own ledger archive and is committed only inside that archive,
# TASK-20261022-f42d75. Like an archive receipt inside its own commit, it
# carries no commit sha for that archive; the queue's archive block and the
# lane-close record carry it.
