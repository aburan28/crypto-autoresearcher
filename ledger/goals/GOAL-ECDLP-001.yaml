  completion_criteria:
    - >-
      A candidate attack improvement is independently reproduced or proved within its
      declared scope, carries required certificates, and has complete end-to-end cost
      accounting showing a credible asymptotic or concrete cryptographic advantage
      over matched rho/BSGS controls.
    - >-
      Or a novel cryptographically relevant technique is independently validated with
      a concrete, reproducible improvement to a decision-critical ECDLP attack stage or
      to rigorous cryptanalytic verification, together with a credible path to broader
      relevance and explicit non-breakthrough boundaries.
  pause_conditions:
    - The 14400-second or three-batch campaign budget is exhausted without meeting a positive completion criterion.
    - A required exact model policy cannot be resolved and the handoff forbids fallback.
    - A required snapshot or ledger archive fails exact-path, hash, parent, or reachability verification.
    - The user requests pause or the remaining candidate frontier has no auditable next action within the campaign budget.
  next_action: >-
    Scoped repair (requires budget extension to resume): re-run the producer to
    enumerate the exact field set and RFC-8785 canonicalization for each of the
    four non-reproducible binding hashes (fixture_sha256, field_schema_sha256,
    schedule_sha256, verifier artifact_sha256), following the reproducible
    column_schema_sha256 computation pattern, so all six binding hashes are
    independently reproducible. Then independently re-review the repaired
    protocol. Authorize no implementation or experiment until the repaired
    protocol passes independent re-review. The three-batch campaign budget is
    exhausted; resume requires a new campaign or amended maximum_batches.
