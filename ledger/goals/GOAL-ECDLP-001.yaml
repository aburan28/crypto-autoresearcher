      ideals (no decompositions)" and EV-STR-002 line 55 records "All Groebner solves
      on trivial ideals (no decompositions at B >= 27)", yet DEC-20260726-005 and
      DEC-20260726-006 both concluded support. BATCH-006 dispatches EXP-IC-002 as a
      control on the first; the second (IDEA-20260727-001, orbit-quotient and rank
      control on H-STR-002) is recorded as the first deferred successor. No
      hypothesis status is changed by opening this batch.
    correction:
      corrected_on: '2026-07-27'
      corrected_by_task: TASK-20260727-010
      what_was_wrong: >-
        The EV-IC-001 quotation is accurate but the note repeated it as an
        absolute fact about the EXP-IC-001 run set, and BATCH-006 was opened on
        that reading. It is false as an absolute statement. A census of all 748
        experiments/EXP-IC-001/runs/*/raw-result.json files, read independently
        twice and in agreement (TASK-20260727-004 / RT-20260727-001, and the
        dispatching orchestrator), shows 68 runs with decomposition_found true,
        is_trivial_ideal false and an independently verified certificate of kind
        "decomposition"; certificate census {none: 646, decomposition: 68,
        discrete_log: 34}; 612 trivial ideals; 34 fixed-mode decompositions at 7
        of the 34 instances, namely 9, 9, 10, 1, 2, 2 and 1 of 10 targets at
        (field_bits, seed) = (8,1), (8,2), (8,3), (12,1), (12,2), (12,3) and
        (16,3).
      what_survives: >-
        The statement is TRUE at field_bits >= 20: 0 decompositions across all
        500 runs there. That set contains every instance with N >= 1e9 and all
        four instances DEC-20260726-005 rests on (36-bit seeds 2, 5, 10, 11), so
        the confound this note was opened on survives intact across the entire
        decision-bearing regime. Only the absolute framing was wrong, and the
        per-instance record supplies the yield observation EXP-IC-002 said it
        lacked.
      corrected_reading: >-
        "All Groebner solves at field_bits >= 20 ran on trivial ideals; no
        decomposition occurred at any instance with N >= 1e9, including the four
        instances DEC-20260726-005 rests on. 68 of the 748 runs, at 7 of the 34
        instances with N between 5 and 2377, did decompose with verified
        certificates."
      scope_of_this_correction: >-
        This record is the one living record that may be edited in place, so the
        correction is applied here. The identical false statement in
        ledger/evidence/EV-IC-001.yaml, ledger/decisions/DEC-20260726-005.yaml
        and experiments/EXP-IC-001/analysis.md is immutable and is NOT edited:
        it is corrected by a superseding record under ledger/corrections/, which
        TASK-20260727-009 now carries as a required deliverable. Nothing about
        EV-STR-002 or H-STR-002 is corrected here; that census has not been run.
        No hypothesis status is changed by this correction.
