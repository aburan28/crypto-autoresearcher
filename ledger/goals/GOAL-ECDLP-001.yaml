    MOVES IT AND DEC-20260729-004 SAYS WHY, and `reject_scoped` on this single
    unreplicated run set is forbidden outright by agents/coordinator.md.
    NO ARM OF EXP-STR-004 TESTS H-STR-002's MECHANISM. Phi is an automorphism,
    phi(R) is a genuine relation whenever R is and F is phi-invariant, and the
    closed system really is C_3-equivariant; the two declared arms measure a
    displacement-rank statistic and its misalignment set, not that. The prior
    notes are retained verbatim beneath.
