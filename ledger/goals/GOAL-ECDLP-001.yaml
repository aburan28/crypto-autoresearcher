  status_note_amendment_20260729_batch014_open: >-
    AMENDMENT, 2026-07-29, AT THE BATCH-014 OPENING. Every status note and
    status_value_history entry below is RETAINED VERBATIM and none is edited.
    THE GOAL MOVES FROM `paused` BACK TO `active` ON BUDGET-AMEND-20260729-004,
    which raises campaign_budget.maximum_batches from 13 to 14 BY EXACTLY ONE on
    the user's standing and repeated direction this session to keep running the
    harness and to commit and push routinely.
    THE RAISE DISCHARGES THE PAUSE CONDITION AND NOTHING BATCH-013 ACHIEVED
    DISCHARGES IT. BATCH-013 closed `inconclusive` (DEC-20260729-003) on the
    mechanism of the +0.3610 z_sem shift and CLOSED ON THE CHASE, at claim tier
    toy on a CURVE-FREE simulation, ON AN INSTRUMENT QUESTION. It moved no
    hypothesis, moved no exponent, met no completion criterion and established
    nothing about decomposition yield in either direction. THAT IS NOT A
    COMPLETION CRITERION OF THIS GOAL AND CANNOT BECOME ONE. The pause
    condition's firing at the close of BATCH-013 STANDS UNRETRACTED here, in
    status_value_history and in DEC-20260729-003, and so does the closing
    Coordinator's refusal to self-grant a fourteenth batch, which was CORRECT.
    THE AUTHORIZATION RECORDED HERE IS THE USER'S, NOT THE COORDINATOR'S.
    WHAT BATCH-014 IS, AND IT SAYS WHICH OF THE THREE OPTIONS IT TAKES.
    RULE-BATCH013-SCOPE required the successor batch to do EXACTLY ONE of three
    things AND TO SAY WHICH. BATCH-014 TAKES OPTION (i): IT DISPATCHES
    DEFER-BATCH009-001's EXP-STR-004 REPLICATION, AND THE SOLVER-AVAILABILITY
    CHECK THAT RULING MADE A PRECONDITION HAS BEEN RUN BEFORE THE FREEZE AND HAS
    PASSED. It does NOT dispatch a fresh-cell yield experiment under RC-G and it
    does NOT record that the goal has no auditable next action. IT IS THE FIRST
    BATCH IN FOUR THAT TOUCHES THE RESEARCH QUESTION RATHER THAN THE INSTRUMENT.
    Nine cards, 23700 declared seconds, 28 run records, TOY-SCALE CURVE COMPUTE.
    THE SOLVER CHECK, RECORDED WITH ITS PROVENANCE AND ITS LIMITS. The
    dispatching session observed, before this queue was authored, that SageMath
    10.9, release date 2026-05-04, is installed at /usr/local/bin/sage and
    computes correctly - it built EllipticCurve(GF(1009),[1,1]), returned order
    1034 and produced a generator of that order - and that `import sage` from the
    system python3 FAILS. THAT IS A HOST OBSERVATION BY THE DISPATCHING SESSION,
    NOT AN ARCHIVED RESULT: it has no run id, no manifest and no receipt, and it
    may not be cited anywhere as a measurement. Its consequences are design
    consequences only: Sage is invoked THROUGH THE `sage` BINARY and never as a
    Python import, Sage is NOT the primary driver - the committed harness is the
    object of measurement and the driver is plain Python, exactly as
    EXP-STR-003's was - and the Executor must capture the exact `sage --version`
    string BEFORE the first computation and record it verbatim in every manifest,
    with any mismatch treated as INFRASTRUCTURE SIGNAL and never as a result.
    WHAT THE BATCH MEASURES. Two arms and no third, exactly as DEC-20260727-009
    specifies - arm A-prime, the phi-invariant factor base with the line-303/304
    dedup and zero-filter DISABLED, and arm E-prime, a phi-free closure emitting
    each sigma-orbit once and never suppressing - at FOURTEEN NAMED (curve, B, m)
    CELLS. THE B-SWEEP IS THE EXPERIMENT: H-STR-002 claims alpha = O(r) = O(1)
    INDEPENDENT OF B, and a replication that measures alpha at one B establishes
    nothing about independence of B. `Two arms and nothing else` constrains the
    ARMS, not the instances, and DEC-20260727-009 specifies no instance set at
    all; no third arm is added.
    WHAT THIS BATCH IS NOT: not an attack, not an attack improvement, not a
    cryptanalytic result, not a closure, not an impossibility claim, not a claim
    above toy tier, and NOT A TEST OF H-STR-002's MECHANISM - phi is an
    automorphism, phi(R) is a genuine relation whenever R is and F is
    phi-invariant, and no arm touches any of that. It moves no asymptotic
    exponent in either direction and leaves all four promotion gates OPEN. Under
    docs/target-result-profile.md rule A1 IT IS NOT TARGET-CLASS ON ITS OWN and
    the queue's claim_ceiling says so in terms. NO CLOSURE QUORUM IS CLAIMED OR
    CLAIMABLE (INT-BATCH014-D). THE LEDGER STILL DOES NOT VALIDATE
    (INT-BATCH012-F) and nothing here repairs or claims to repair it.
    THE PRICE OF CHOOSING OPTION (i), RECORDED RATHER THAN DISCOVERED LATER.
    RULE-BATCH013-SCOPE reserved DEFER-BATCH013-001, RT21-3's structurally exact
    pre-marking arm, as the ONLY item that could still justify a batch in the
    EXP-YIELD lineage, and ruled that if the batch after BATCH-013 did not
    dispatch it the lineage is CLOSED FOR GOOD. BATCH-014 DOES NOT DISPATCH IT.
    THAT LINEAGE IS THEREFORE CLOSED ON THE CURRENT RECORD, and EV-ECDLP-008
    observation O-4 component (d)'s CENSUS-FACING claim REMAINS UNTOUCHED AND
    UNARCHIVED unless a future authorization revisits it on the merits.
    TWO ENVIRONMENTAL FACTS, RECORDED BECAUSE THEY ARE REAL. The volume holding
    this worktree is at 99 PER CENT with about 30 GiB free and `git fsck` TIMED
    OUT on it, so BATCH-014 declares an artifact-size budget - 2 MiB per run
    directory, 64 MiB for the experiment tree, a mandatory pre-flight disk check
    with a below-5-GiB stop - and treats every breach as infrastructure signal.
    AND THIS BRANCH IS FIVE COMMITS BEHIND origin/main AT THIS OPENING: co-drivers
    have moved main. That is a MERGE obligation for the dispatcher and not for
    this batch, no card here performs it, and it is recorded so a successor
    reading latest_verified_commit knows the base was not current. Currency is
    restored by MERGING main in, NEVER by rebasing.
  status_note_amendment_20260729_batch013_close: >-
    AMENDMENT, 2026-07-29, BY TASK-20260729-039, THE BATCH-013 LEDGER ARCHIVE.
    Every status note and status_value_history entry below is RETAINED VERBATIM
    and none is edited; the note immediately beneath describes BATCH-013 AS IT
