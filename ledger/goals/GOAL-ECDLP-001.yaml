research_goal:
  id: GOAL-ECDLP-001
  title: Novel, fully charged prime-field ECDLP breakthrough search
  objective: Search for a genuine, independently reviewable reduction in prime-field
    ECDLP attack cost or, absent immediate breakthrough evidence, a novel cryptographically
    relevant technique that improves a rigorously verified attack stage or cryptanalytic
    methodology. Every candidate must include complete preprocessing, relation collection,
    linear algebra, target descent, verification, memory, and multi-target accounting
    against Pollard rho and BSGS.
  question_ids:
  - RQ-ECDLP-002
  active_hypothesis_ids:
  - H-ENDO-001
  active_hypothesis_note_2026_07_28: >-
    UPDATED 2026-07-28 by TASK-20260728-002, the BATCH-009 batch opening. The
    operational focus moves to H-ENDO-001, a NEW hypothesis created at
    `approved` by TASK-20260728-001 together with the frozen contract
    EXP-ENDO-001 that tests it. NO EXISTING HYPOTHESIS STATUS CHANGED: H-STR-002
    remains `weakened` per DEC-20260727-002 and H-IC-001 remains `weakened` per
    DEC-20260727-001, and creating a new record is not a transition of either.
    H-STR-002 leaves active_hypothesis_ids because it is not in operational
    focus, NOT because anything about it is settled - its instrument question is
    UNADJUDICATED and the replication its `weaken` owes is carried, unretracted,
    as DEFER-BATCH009-001. H-ENDO-001 asserts that augmenting the ECDLP witness
    lattice with endomorphisms pins the index at N, shrinks the lattice minimum
    like N^(1/(2r)), and leaves the meet-in-the-middle search exponent at one
    half with a constant that doubles per added endomorphism. `approved` carries
    NO evidential standing: no run exists, nothing has been measured, and the
    claim tier of anything it can produce is capped at toy. The prior note is
    retained verbatim beneath for the record.
  active_hypothesis_note: >-
    UPDATED 2026-07-27 by TASK-20260727-018, the BATCH-007 ledger archive.
    H-STR-002's status is now `weakened` per DEC-20260727-002 (was `supported`
    per DEC-20260726-006, which that decision supersedes and CORR-20260727-003
    corrects). BATCH-007 tested the EVIDENTIARY BASIS of the support verdict and
    then, under EXP-STR-003, the INSTRUMENT behind it - never the mechanism. The
    transition rests on three grounds independent of the instrument question:
    absent artifacts (R1), a one-variable comparison showing phi-invariance of the
    factor base moves alpha by 0, 0, 2 and 1 on values of order B at 4 of 4 (R2),
    and the absence of any assembled system, solve or archived baseline at the
    headline instances (R3). The instrument question itself is UNADJUDICATED:
    EXP-STR-003's criterion F1 fired at B = 27 and B = 397, so OBS-1 and
    RT-OBJ-1's comparative limb are withdrawn and no record may call `phi_alpha`
    either an artifact or a validated measurement. The MECHANISM is untested, not
    refuted. Both hypotheses this goal has carried are now weakened and neither is
    in operational focus: H-IC-001 is `weakened` per DEC-20260727-001 and
    BATCH-006 closed it; H-STR-002 is `weakened` per DEC-20260727-002 and
    BATCH-007 closes it. Any further work on H-STR-002 begins with the replication
    named in the resume action (EXP-STR-004).
  status: active
  status_note: >-
    ACTIVE from 2026-07-28, resumed from `paused` under explicit user direction
    on 2026-07-28 to keep running the harness, which the Coordinator records as
    authorization of a NINTH batch. The pause condition that held at the close
    of BATCH-008 - campaign_budget.maximum_batches = 8 consumed without meeting
    a completion criterion - is discharged by BUDGET-AMEND-20260728-001 below,
    which raises maximum_batches from 8 to 9 on that authorization. The
    28800-second clause remains neither claimed nor evaluable
    (INT-BATCH006-005). NOTHING ABOUT THE EIGHT-BATCH OUTCOME IS RETRACTED:
    eight batches have produced no candidate attack improvement reproduced or
    proved within scope and no independently validated novel technique, and both
    hypotheses this goal has carried remain `weakened`. THE BATCH-008 RESUME
    ACTION IS DISCHARGED: TASK-20260727-033 wrote the two M4 frozen companion
    files from the blobs with git and never by transcription, and archived a
    re-runnable verification of sixteen checks that all pass, discharging L2, L3
    and RC-3. That closes a bookkeeping obligation; it is not research and moves
    nothing.
    BATCH-009 IS THE FIRST RESEARCH BATCH SINCE BATCH-007. It freezes, reviews,
    executes and reviews ONE bounded toy-scale experiment, EXP-ENDO-001, testing
    the new hypothesis H-ENDO-001 - that endomorphism augmentation of the ECDLP
    witness lattice pins the index at N, shrinks the lattice minimum like
    N^(1/(2r)), and leaves the search exponent at one half with a constant
    growing like 2^r. Nine cards, 23100 declared seconds, eight run records, four
    field sizes at most 28 bits.
    THE FRONTIER WAS RERANKED AND BOTH CANDIDATES ARE NAMED. See
    frontier_rerank_20260728 below. EXP-STR-004, the committed resume action
    preserved as DEFER-BATCH007-001, is OUTRANKED AND CARRIED FORWARD, NOT
    RETRACTED, as DEFER-BATCH009-001: its lane's only reproducible effect is the
    constant factor r = 3 measured at 2.62 to 3.20x, which the target-result
    profile places outside target class, whereas the endomorphism-rank cost
    curve asks an exponent question at the same cost. Its replication obligation
    binds the NEXT transition of H-STR-002 in either direction, and BATCH-009
    proposes none.
    WHAT THIS BATCH IS NOT: not an attack, not an attack improvement, not a
    cryptanalytic result, not a closure, not an impossibility claim, not a claim
    above toy tier. It changes no existing hypothesis status, meets no
    completion criterion under any outcome, moves no asymptotic exponent in
    either direction, and leaves all four promotion gates OPEN. NO CLOSURE
    QUORUM IS CLAIMED OR CLAIMABLE: this commit's AGENTS.md carries no rule 13
    and every review in this lineage resolves to claude-opus-5 with
    `fallback_used: true`. THE LEDGER STILL DOES NOT VALIDATE - 986 error lines
    with eleven specifications unparseable - and nothing here repairs or claims
    to repair that. The BATCH-008 close status text is retained verbatim beneath
    for the record.
  status_note_amendment_20260728_batch009_disposition: >-
    AMENDMENT, 2026-07-28, by TASK-20260728-010. The status_note above is
    RETAINED VERBATIM and is not edited; it describes BATCH-009 as it was
    OPENED, and this amendment records what BATCH-009 BECAME. The goal remains
    `active` and the batch remains open.
    WHAT CHANGED. TASK-20260728-004, an independent non-originating review of
    the frozen EXP-ENDO-001 contract, returned REVISE BEFORE EXECUTION, in
    report RT-20260728-001 committed at 4f87e165. It confirmed snapshot
    integrity and pre-registration order without reservation - calling the
    provable commit-order precedence of the contract the strongest property of
    the submission - and raised six blocking objections, all about the design.
    The Coordinator held the INT-BATCH009-E gate: the Executor card was never
    dispatched, no compute was spent, and ZERO RUNS OF EXP-ENDO-001 EXIST.
    THE DISPOSITION IS WITHDRAWAL, NOT AMENDMENT. EXP-ENDO-001 version 1 is
    withdrawn before execution by
    experiments/EXP-ENDO-001/amendments/v1_withdrawn_before_execution.yaml, on
    seven recorded grounds. The committed specification.yaml is NOT edited and
    still reads `approved`; corrections supersede rather than overwrite, and
    this campaign has already paid once for an in-place edit of a frozen
    contract. The decisive grounds are that no outcome of the contract could
    have been target-class - RT-20260728-001 finds the algorithm under test
    dominated by BSGS by about 2^r in BOTH time and memory at every rank
    including r = 1 and by Pollard rho absolutely on memory, with no time-memory
    point where it wins - and that the minimal repair collapses the GENUINE
    r-sweep to two points, r = 1 and r = 2, which cannot separate a 2^r constant
    from an exponent effect. The Coordinator could not name what would make an
    amend-and-re-review cycle different from EXP-IC-002's, which went through a
    REVISE, a versioned amendment and an independent re-review and never
    executed, and recorded that concession rather than arguing around it.
    WHAT THE BATCH YIELDED INSTEAD, WITH ZERO RUNS. Two paper-verifiable claims,
    archived as refutation artifacts under docs/claims-and-verification.md at
    level 2, DERIVATION, in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/tasks/TASK-20260728-010/.
    (D2) On family J0, at every rank r at least 3, the infinity-norm first
    minimum of the witness lattice is EXACTLY 1 for every N and every k, because
    the two roots of L^2 + L + 1 mod N sum to -1 by Vieta and so
    lambda_1 + lambda_2 + lambda_3 = 0 identically - against a predicted
    N^(1/(2r)). Prediction P2 is false on the cells the contract itself labels
    GENUINE, and its genuine rank bound for J0 is 2, not 3 (D1). (D4) The
    witness lattice is NOT attacker-constructible - its congruence involves the
    unknown k - and constructing it plus LLL plus k = -A/B would solve the
    instance outright, so the pinned determinant is not what makes the shortness
    unexploitable. (D3, new here) The k-independent part of the witness lattice
    is exactly the product of the eigenvalue relation lattice with itself, and
    every vector in it has zero Q-side combination and therefore carries no
    information about k - so every vector an attacker can write down without
    knowing k is useless, and the J0 degeneracy lives entirely inside that
    useless part.
    NONE OF THAT IS OFFICIAL YET AND NONE OF IT IS VERIFIED. The artifacts are
    working-tree files written by the same session that is deciding on them
    (INT-BATCH009-R). They become durable only at the TASK-20260728-011 snapshot
    commit, and their claims are unchecked until TASK-20260728-012 re-derives
    them and instantiates the counterexample numerically and TASK-20260728-013
    tests how far they may be read. EV-ENDO-001 and DEC-20260728-001 remain
    RESERVED AND UNWRITTEN, exactly as at the batch opening; the disposition is
    persisted as batch_disposition_decision in the BATCH-009 queue, a
    coordination record, because the refutation artifact must be committed
    BEFORE the decision that relies on it.
    WHAT IS NOT CHANGED, NOT CLAIMED AND NOT RETRACTED. No hypothesis status
    moves: H-STR-002 stays `weakened` per DEC-20260727-002, H-IC-001 stays
    `weakened` per DEC-20260727-001, and H-ENDO-001 stays `approved`, which
    carries no evidential standing. P1, the index pinning at N, STANDS and is
    correctly derived; P3, cost neutrality, is UNADJUDICATED and nothing in this
    batch measures or settles it. Nothing here is an attack, an attack
    improvement, a cryptanalytic result, a closure or an impossibility claim,
    and D4 in particular is a statement about the class of attacks that
    construct and reduce that specific lattice, not about ECDLP or about
    endomorphisms in general. No claim above toy tier and in fact no tier at
    all - paper algebra with no instance, no curve and no field size. No closure
    quorum is claimed or claimable. THE LEDGER STILL DOES NOT VALIDATE. Both
    losing options are carried as ranked deferrals and neither is retracted:
    EXP-STR-004 as DEFER-BATCH009-001, now the ranked-first deferral and the
    recommended opening of BATCH-010, and an EXP-ENDO-001 v2 as
    DEFER-BATCH009-002.
    THE BATCH BUDGET FALLS AND NO AUTHORIZATION IS REQUIRED FOR THAT.
    QUEUE-AMEND-20260728-001 releases 13800 seconds by cancelling four cards and
    adds 8700 across four new ones, taking the declared BATCH-009 task budget
    from 23100 to 18000 seconds across thirteen cards and the declared Executor
    COMPUTE budget from 7200 seconds to ZERO. campaign_budget.maximum_batches =
    9 is untouched and total_wall_clock_seconds remains untracked and
    unevaluable, so the BUDGET-AMEND-20260728-001 arithmetic of 23100 seconds is
    superseded in amount but not in authorization.
    RECORDED PLAINLY AND NOT PRESENTED AS EFFICIENCY: THIS IS THE THIRD BATCH IN
    FOUR THAT MEASURES NOTHING. BATCH-006 executed nothing, BATCH-008 executed
    nothing beyond a validator invocation and a diff, and BATCH-009 now executes
    nothing. Nine batches have produced no candidate attack improvement
    reproduced or proved within scope and no independently validated novel
    technique. Two of the last three frozen contracts produced their result at
    review rather than at execution, and the Coordinator's read of that is
    recorded in full in the queue: MOSTLY SELECTION BIAS - both refutations are
    algebraic identities of the design, where paper analysis beats a run by
    construction - plus one real component that is a DESIGN-PROCESS DEFECT of
    the Coordinator's own, namely pre-registering thresholds without evaluating
    them at the cells that would actually run. The correction is NOT to review
    more and execute less; it is DEFER-BATCH009-003, a required criterion
    feasibility table inside every contract before it is frozen. The next batch
    must execute something, which is why the recommended opening of BATCH-010 is
    the EXP-STR-004 replication.
