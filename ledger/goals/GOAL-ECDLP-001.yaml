    `approved`, which carries no evidential standing at all; H-YIELD-001 and
    H-GGM-001 remain `specified`; H-FCP-001 remains `analyzed`.
    WHAT BATCH-014 DOES TO H-STR-002 AND WHAT IT DOES NOT. It dispatches
