  - id: INT-BATCH006-011
    subject: EXP-IC-002 design review returned REVISE and the protocol was amended
    note: >-
      TASK-20260727-004 (RT-20260727-001) returned REVISE on EXP-IC-002 version 1
      with five blocking objections. The decisive one is an execution defect, not
      an interpretation defect: CTRL-G's expectation was stated as "0
      decompositions across all 748 EXP-IC-001 runs" and stopping rule 4 required
      an immediate halt on any CTRL-G disagreement, so the frozen protocol halts
      the primary arm at instance 1 of 34 and produces no primary result.
      experiments/EXP-IC-002/amendments/v1_to_v2.yaml repairs all five: the
      verified per-instance decomposition table replaces the false premise and
      CTRL-G gains graded dispositions; falsifier F2 is recorded unreachable at
      N >= 1e9; p_dec_counting_bound is capped at 1 and
      t_desc_charged_lower_bound floored at T_attempt; CTRL-E2 adds the
      exhaustive-table and N^(1/3) preprocessing-frontier multi-target baselines
      in closed form; and the |S| invalidation threshold tightens from 420 to 392.
      confirmatory_status is exploratory_only under docs/task-lifecycle.md
      section 5, so no SC1-SC4 outcome may be reported as a satisfied
      confirmatory pre-registered criterion. Execution of TASK-20260727-005 is
      gated on a PASS from TASK-20260727-012, an independent non-originating
      session that must also not be the session that produced the
      TASK-20260727-004 reports. No hypothesis status is changed, and no evidence
      or decision record was created, by the amendment.
    outcome:
      recorded_on: '2026-07-27'
      recorded_by_task: TASK-20260727-009
      result: >-
        The gate did not open. TASK-20260727-012 (RT-20260727-002) returned
        REVISE on the amended contract with four blocking objections, the
        sharpest being that the R3 metric repair makes the design's own
        falsification criterion F3 fire determinately (SC4 Spearman 0.8143 <
        0.90) while two escape statistics sit beside it that both pass, and
        that the amendment's new SC1 disposition rule converts a determinate
        2.6% failure into INCONCLUSIVE asymmetrically. TASK-20260727-005 was
        therefore never unblocked and is now cancelled (INT-BATCH006-015).
        EXP-IC-002 is closed UNEXECUTED. Its two independent reviews are the
        durable output, and they are the derivation notes DEC-20260727-001
        relies on.
