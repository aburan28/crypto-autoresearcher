    ECDLP attack cost or, absent immediate breakthrough evidence, a novel cryptographically
    relevant technique that improves a rigorously verified attack stage or cryptanalytic
    methodology. Every candidate must include complete preprocessing, relation collection,
    linear algebra, target descent, verification, memory, and multi-target accounting
    against Pollard rho and BSGS.
