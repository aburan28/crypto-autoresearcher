  status_note_amendment_20260728_batch009_disposition: >-
    AMENDMENT, 2026-07-28, by TASK-20260728-010. The status_note above is
    RETAINED VERBATIM and is not edited; it describes BATCH-009 as it was
    OPENED, and this amendment records what BATCH-009 BECAME. The goal remains
    `active` and the batch remains open.
    WHAT CHANGED. TASK-20260728-004, an independent non-originating review of
    the frozen EXP-ENDO-001 contract, returned REVISE BEFORE EXECUTION, in
    report RT-20260728-001 committed at 4f87e165. It confirmed snapshot
    integrity and pre-registration order without reservation - calling the
    provable commit-order precedence of the contract the strongest property of
    the submission - and raised six blocking objections, all about the design.
    The Coordinator held the INT-BATCH009-E gate: the Executor card was never
    dispatched, no compute was spent, and ZERO RUNS OF EXP-ENDO-001 EXIST.
    THE DISPOSITION IS WITHDRAWAL, NOT AMENDMENT. EXP-ENDO-001 version 1 is
    withdrawn before execution by
    experiments/EXP-ENDO-001/amendments/v1_withdrawn_before_execution.yaml, on
    seven recorded grounds. The committed specification.yaml is NOT edited and
    still reads `approved`; corrections supersede rather than overwrite, and
    this campaign has already paid once for an in-place edit of a frozen
    contract. The decisive grounds are that no outcome of the contract could
    have been target-class - RT-20260728-001 finds the algorithm under test
    dominated by BSGS by about 2^r in BOTH time and memory at every rank
    including r = 1 and by Pollard rho absolutely on memory, with no time-memory
    point where it wins - and that the minimal repair collapses the GENUINE
    r-sweep to two points, r = 1 and r = 2, which cannot separate a 2^r constant
    from an exponent effect. The Coordinator could not name what would make an
    amend-and-re-review cycle different from EXP-IC-002's, which went through a
    REVISE, a versioned amendment and an independent re-review and never
    executed, and recorded that concession rather than arguing around it.
    WHAT THE BATCH YIELDED INSTEAD, WITH ZERO RUNS. Two paper-verifiable claims,
    archived as refutation artifacts under docs/claims-and-verification.md at
    level 2, DERIVATION, in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/tasks/TASK-20260728-010/.
    (D2) On family J0, at every rank r at least 3, the infinity-norm first
    minimum of the witness lattice is EXACTLY 1 for every N and every k, because
    the two roots of L^2 + L + 1 mod N sum to -1 by Vieta and so
    lambda_1 + lambda_2 + lambda_3 = 0 identically - against a predicted
    N^(1/(2r)). Prediction P2 is false on the cells the contract itself labels
    GENUINE, and its genuine rank bound for J0 is 2, not 3 (D1). (D4) The
    witness lattice is NOT attacker-constructible - its congruence involves the
    unknown k - and constructing it plus LLL plus k = -A/B would solve the
    instance outright, so the pinned determinant is not what makes the shortness
    unexploitable. (D3, new here) The k-independent part of the witness lattice
    is exactly the product of the eigenvalue relation lattice with itself, and
    every vector in it has zero Q-side combination and therefore carries no
    information about k - so every vector an attacker can write down without
    knowing k is useless, and the J0 degeneracy lives entirely inside that
    useless part.
    NONE OF THAT IS OFFICIAL YET AND NONE OF IT IS VERIFIED. The artifacts are
    working-tree files written by the same session that is deciding on them
    (INT-BATCH009-R). They become durable only at the TASK-20260728-011 snapshot
    commit, and their claims are unchecked until TASK-20260728-012 re-derives
    them and instantiates the counterexample numerically and TASK-20260728-013
    tests how far they may be read. EV-ENDO-001 and DEC-20260728-005 remain
    RESERVED AND UNWRITTEN, exactly as at the batch opening; the disposition is
    persisted as batch_disposition_decision in the BATCH-009 queue, a
    coordination record, because the refutation artifact must be committed
    BEFORE the decision that relies on it.
    WHAT IS NOT CHANGED, NOT CLAIMED AND NOT RETRACTED. No hypothesis status
    moves: H-STR-002 stays `weakened` per DEC-20260727-009, H-IC-001 stays
    `weakened` per DEC-20260727-008, and H-ENDO-001 stays `approved`, which
    carries no evidential standing. P1, the index pinning at N, STANDS and is
    correctly derived; P3, cost neutrality, is UNADJUDICATED and nothing in this
    batch measures or settles it. Nothing here is an attack, an attack
    improvement, a cryptanalytic result, a closure or an impossibility claim,
    and D4 in particular is a statement about the class of attacks that
    construct and reduce that specific lattice, not about ECDLP or about
    endomorphisms in general. No claim above toy tier and in fact no tier at
    all - paper algebra with no instance, no curve and no field size. No closure
    quorum is claimed or claimable. THE LEDGER STILL DOES NOT VALIDATE. Both
