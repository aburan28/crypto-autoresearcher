  completion_criteria:
  - A candidate attack improvement is independently reproduced or proved within its
    declared scope, carries required certificates, and has complete end-to-end cost
    accounting showing a credible asymptotic or concrete cryptographic advantage over
    matched rho/BSGS controls.
  - Or a novel cryptographically relevant technique is independently validated with
    a concrete, reproducible improvement to a decision-critical ECDLP attack stage
    or to rigorous cryptanalytic verification, together with a credible path to broader
    relevance and explicit non-breakthrough boundaries.
  pause_conditions:
  - The 28800-second or six-batch campaign budget is exhausted without meeting a positive
    completion criterion.
  - A required exact model policy cannot be resolved and the handoff forbids fallback.
  - A required snapshot or ledger archive fails exact-path, hash, parent, or reachability
    verification.
  - The user requests pause or the remaining candidate frontier has no auditable next
    action within the campaign budget.
  next_action: Dispatch BATCH-006 (coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/dispatch_queue.json)
    per DEC-20260726-007, starting with TASK-20260726-005, the independent review-xhigh
    review of H-GGM-001 + EXP-GGM-001 by a non-originating session, concurrently with
    the TASK-20260726-006 red-team review of the EXP-GGM-001 claim_tier_basis
    scale-independence argument. No execution of EXP-GGM-001 is authorized until that
    review returns and the TASK-20260726-008 ledger archive records the resulting
    decision. BATCH-006 is the sixth and final batch under campaign_budget.maximum_batches;
    its ledger archive triggers the six-batch pause condition unless a completion
    criterion is met.
