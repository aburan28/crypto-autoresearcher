      does not yet exist in the repository. EXP-STR-003 exists to create it.
  - id: INT-BATCH007-008
    subject: the reviewer probe numbers are not evidence and this record does not treat them as such
    note: >-
      Every arm value quoted in TASK-20260727-017 - arm A 9/2/4/1, arm B
      27/52/197/386, arm C 27/54/201/382, arm E 0/1/0/1, the misalignment counts,
      and the IndexError reproductions - was produced by two scratchpad scripts
      held OUTSIDE the repository, with no manifest, no run id, no seed record
      and no environment block. That session labels them non-records itself and
