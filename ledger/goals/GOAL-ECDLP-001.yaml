    constructs an exact precommitted schedule-to-receipt-to-rank certificate
    with field/schema binding, vector resource ownership, and a declared-alpha
    negative-binomial tail gate, or returns a decisive scoped no-go derivation;
    do not repeat P1553 R4 or run an experiment.
