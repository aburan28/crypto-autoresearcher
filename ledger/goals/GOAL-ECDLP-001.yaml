      queue's validation status is a hand simulation of
      tools/research_dispatch.py, not an execution of it; the orchestrator must
      run the validator before dispatching. No commit_sha, parent_sha or
      path_sha256 is recorded anywhere in BATCH-007 and none may be fabricated.
  - id: INT-BATCH007-005
    subject: observation OBS-1 is routed, not adjudicated
    note: >-
      The census records an observation it explicitly does not decide: at
      harness/endomorphism_la.py lines 292-304 the phi arm inserts the two
      phi-shifted copies of every found relation into the relation list, and the
      phi-displacement rank is then measured on that same list (line 434), while
      commutation_holds is computed (lines 441-452) by shifting the first
      relation and testing membership in that same list. If that construction is
      what produces the low phi_alpha, then phi_alpha measures the insertion rule
      rather than a property of relation collection, and it bears on the PRIMARY
      metric of H-STR-002 - which would matter more than the artifact gap this
      batch is about. It is an interpretation of code behaviour, not an
      artifact-integrity fact, and the Coordinator is not the agent who
      adjudicates it. TASK-20260727-017 must decide it and TASK-20260727-016 must
      confirm the code reading. No BATCH-007 finding depends on it.
  - id: INT-BATCH007-006
    subject: BATCH-006 archival plumbing is carried forward unrepaired
    note: >-
      INT-BATCH006-016 is NOT discharged by BATCH-007 and is not claimed to be.
      TASK-20260727-003 remains blocked, the TASK-20260727-011 and
      TASK-20260727-009 receipts remain untracked, and TASK-20260727-007 and -008
      remain cancelled-but-claimed in the BATCH-006 queue. The same structural
      archive-receipt ordering defect (AMEND-2026-07-27-D) applies to both
      BATCH-007 archive tasks. These are repository-level evidence-integrity
      gaps, not mathematical results, and no BATCH-007 task may fabricate a
      receipt or a hash to close them. AMENDED 2026-07-27: the same defect now
      also applies to the two archive tasks added by QUEUE-AMEND-20260727-002,
      TASK-20260727-020 and TASK-20260727-022, and is unrepaired there too.
  - id: INT-BATCH007-007
    subject: >-
      both BATCH-007 reviews reported, and the load-bearing finding moved from
      the archive to the primary metric
    note: >-
      TASK-20260727-016 (Validator, PASS) settled the census claim exhaustively:
      no run record for B = 55, 204 or 397 exists in any local branch, any
      remote-tracking branch, any tag, any stash, any reflog entry, or anywhere
