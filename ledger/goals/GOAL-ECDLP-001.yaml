research_goal:
  id: GOAL-ECDLP-001
  title: Novel, fully charged prime-field ECDLP breakthrough search
  objective: >-
    Search for a genuine, independently reviewable reduction in prime-field ECDLP
    attack cost or, absent immediate breakthrough evidence, a novel cryptographically
    relevant technique that improves a rigorously verified attack stage or
    cryptanalytic methodology. Every candidate must include complete preprocessing,
    relation collection, linear algebra, target descent, verification, memory, and
    multi-target accounting against Pollard rho and BSGS.
