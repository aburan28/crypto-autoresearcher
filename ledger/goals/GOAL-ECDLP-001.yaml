      re-execution and archival. This record cites none of them as a
      measurement. They appear in experiments/EXP-STR-003/specification.yaml
      only under pre_registered_predictions, as predictions to be tested, and
      every criterion of that contract is evaluated on values measured by
      TASK-20260727-021 and independently re-executed by TASK-20260727-023. If
      the run falsifies them, that outcome is recorded and OBS-1 is withdrawn or
      rescoped; the contract fixes that consequence in advance.
  - id: INT-BATCH007-009
    subject: what EXP-STR-003 can and cannot do, fixed before it runs
    note: >-
      EXP-STR-003 tests an INSTRUMENT. A confirming outcome establishes that the
      number harness/endomorphism_la.py reports as `phi_alpha` carries no
      information about whether the factor base is phi-invariant, at toy tier, on
      four j=0 curves with n <= 158071, B <= 397 and arity m = 2. It does NOT
      establish that H-STR-002's mechanism is false: phi is an automorphism,
      phi(R) is a genuine relation on a phi-invariant factor base, and the
      relation system really is C_3-equivariant - no arm of the experiment
      touches any of that. It does not close the endomorphism direction, does not
      settle the open cost-model objections, and is not a cryptanalytic result,
      an attack improvement, a closure, an impossibility claim or a result above
      toy tier. No asymptotic exponent moves in either direction under any
      outcome. H-STR-002's status is UNCHANGED at `supported` per
      DEC-20260726-006, and nothing in this amendment changes it; any transition
      belongs to TASK-20260727-018 after all four independent reviews.
  - id: INT-BATCH007-010
    subject: >-
      EXP-STR-003 falsified the probe that motivated it; the instrument question
      is UNADJUDICATED and no record may resolve it in either direction
    note: >-
      The contract frozen at 92268c9e pre-registered arm E at alpha = 0, 1, 0, 1;
      it measured 11, 1, 0, 29, so falsification criterion F1 fired at B = 27 and
      B = 397 and the mechanical verdict is `obs1_falsified`. The consequence was
      fixed in advance and binds: OBS-1 and RT-OBJ-1's COMPARATIVE limb are
      WITHDRAWN and are restated nowhere, DEC-20260727-002 does not rest on them,
      and the as-committed `phi_alpha` metric is UNADJUDICATED - neither refuted
      nor vindicated. RT-OBJ-1 is admitted only in its rescoped DERIVATIONAL form
      (alpha is bounded by the count of positions at which the emitted row list
      departs from a clean sigma-orbit concatenation), which is criterion S3 and
      held at 4 of 4 with equality at 3 of 4; that limb is load-bearing for
      nothing in this batch's ledger records. TASK-20260727-024 adjudicated the
      divergence: arm E as frozen mirrors the committed harness's dedup pathology
      and consumes 2.5x-3.0x as many base rows as arm A, so the two arms' skip
      processes are different random variables and F1 fired on an uncontrolled
      nuisance variable rather than on endomorphism content. Two design defects
      are recorded rather than glossed: the contract's `mixed` verdict branch is
      unreachable by construction (S_i = not F_i) although the measured S1 pattern
      IS mixed (held at I2 and I3, failed at I1 and I4), and confirmation required
      S1 at 4 of 4 while falsification required F1 at 1 of 4. The TASK-20260727-017
      and TASK-20260727-024 scratchpad probes are cited by no ledger record as
      measurements, exactly as INT-BATCH007-008 requires.
