research_goal:
  id: GOAL-ECDLP-001
  title: Novel, fully charged prime-field ECDLP breakthrough search
  objective: Search for a genuine, independently reviewable reduction in prime-field
    ECDLP attack cost or, absent immediate breakthrough evidence, a novel cryptographically
    relevant technique that improves a rigorously verified attack stage or cryptanalytic
    methodology. Every candidate must include complete preprocessing, relation collection,
    linear algebra, target descent, verification, memory, and multi-target accounting
    against Pollard rho and BSGS.
  question_ids:
  - RQ-ECDLP-002
  active_hypothesis_ids:
  - H-STR-002
  active_hypothesis_note: >-
    UPDATED 2026-07-27 by TASK-20260727-018, the BATCH-007 ledger archive.
    H-STR-002's status is now `weakened` per DEC-20260727-002 (was `supported`
    per DEC-20260726-006, which that decision supersedes and CORR-20260727-003
    corrects). BATCH-007 tested the EVIDENTIARY BASIS of the support verdict and
    then, under EXP-STR-003, the INSTRUMENT behind it - never the mechanism. The
    transition rests on three grounds independent of the instrument question:
    absent artifacts (R1), a one-variable comparison showing phi-invariance of the
    factor base moves alpha by 0, 0, 2 and 1 on values of order B at 4 of 4 (R2),
    and the absence of any assembled system, solve or archived baseline at the
    headline instances (R3). The instrument question itself is UNADJUDICATED:
    EXP-STR-003's criterion F1 fired at B = 27 and B = 397, so OBS-1 and
    RT-OBJ-1's comparative limb are withdrawn and no record may call `phi_alpha`
    either an artifact or a validated measurement. The MECHANISM is untested, not
    refuted. Both hypotheses this goal has carried are now weakened and neither is
    in operational focus: H-IC-001 is `weakened` per DEC-20260727-001 and
    BATCH-006 closed it; H-STR-002 is `weakened` per DEC-20260727-002 and
    BATCH-007 closes it. Any further work on H-STR-002 begins with the replication
    named in the resume action (EXP-STR-004).
  status: paused
  status_note: >-
    PAUSED at the close of BATCH-007 on 2026-07-27 by TASK-20260727-018. The
    pause condition fires again on its own terms: campaign_budget.maximum_batches
    = 7 is CONSUMED with the close of this batch and no completion criterion is
    met. The 28800-second clause remains neither claimed nor evaluable
    (INT-BATCH006-005), and this record does not claim it is satisfied. NOT
    COMPLETED, and no closure quorum is sought: a weakened hypothesis and a
    repaired ledger are not a completion criterion, and AGENTS.md rule 13 would in
    any case require three concurring attestations on pairwise-distinct resolved
    models, whereas all four BATCH-007 reviews resolved to the same model. What
    seven batches have produced remains: no candidate attack improvement
    reproduced or proved within scope, and no independently validated novel
    technique. BATCH-007 produced one bounded toy-scale instrument ablation
    (EXP-STR-003, 20 runs, 132.595 s measured), four independent reviews, one
    evidence record, one decision, one correction and one hypothesis transition
    (H-STR-002 supported -> weakened). Exactly one resume action is preserved in
    next_action below. The prior status text is retained verbatim beneath for the
    record.
  prior_status_note: >-
    ACTIVE from 2026-07-27, resumed from `paused` under explicit user
    authorization of a SEVENTH batch. The pause condition that held at the close
    of BATCH-006 - campaign_budget.maximum_batches = 6 consumed without meeting
    a completion criterion - is discharged by BUDGET-AMEND-20260727-002 below,
    which raises maximum_batches from 6 to 7 on that authorization. The
    28800-second clause remains neither claimed nor evaluable
    (INT-BATCH006-005). Nothing about the six-batch outcome is retracted: six
    batches produced no candidate attack improvement reproduced or proved within
    scope and no independently validated novel technique, and BATCH-006 in
    particular produced no experiment execution and no result of any tier above
    toy. BATCH-007 opened as a single bounded artifact-integrity batch with no
    execution, no new run and no compute cost. AMENDED 2026-07-27: it now also
    carries ONE bounded Executor task, EXP-STR-003, because both independent
    reviews reported that the load-bearing question is about the PRIMARY METRIC
    rather than about the archive, and that question currently rests on
    unarchived scratchpad probes that no record may cite. See
    BUDGET-AMEND-20260727-003 and INT-BATCH007-007. The batch STILL cannot meet
    a completion criterion and is not dispatched as if it could: EXP-STR-003 is
    capped at toy tier, tests an instrument rather than a mechanism, and can
    neither establish nor refute the endomorphism mechanism of H-STR-002.
