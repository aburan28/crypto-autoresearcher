research_goal:
  id: GOAL-ECDLP-001
  title: Novel, fully charged prime-field ECDLP breakthrough search
  objective: >-
    Search for a genuine, independently reviewable reduction in prime-field ECDLP
    attack cost or, absent immediate breakthrough evidence, a novel cryptographically
    relevant technique that improves a rigorously verified attack stage or
    cryptanalytic methodology. Every candidate must include complete preprocessing,
    relation collection, linear algebra, target descent, verification, memory, and
    multi-target accounting against Pollard rho and BSGS.
  question_ids: [RQ-ECDLP-002]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 3
    total_wall_clock_seconds: 14400
    max_concurrent: 2
  current_batch_id: BATCH-001
  dispatch_queue_path: coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: null
  completion_criteria:
    - >-
      A candidate attack improvement is independently reproduced or proved within its
      declared scope, carries required certificates, and has complete end-to-end cost
      accounting showing a credible asymptotic or concrete cryptographic advantage
      over matched rho/BSGS controls.
    - >-
      Or a novel cryptographically relevant technique is independently validated with
      a concrete, reproducible improvement to a decision-critical ECDLP attack stage or
      to rigorous cryptanalytic verification, together with a credible path to broader
      relevance and explicit non-breakthrough boundaries.
  pause_conditions:
    - The 14400-second or three-batch campaign budget is exhausted without meeting a positive completion criterion.
    - A required exact model policy cannot be resolved and the handoff forbids fallback.
    - A required snapshot or ledger archive fails exact-path, hash, parent, or reachability verification.
    - The user requests pause or the remaining candidate frontier has no auditable next action within the campaign budget.
  next_action: >-
    Launch TASK-20260721-001 and TASK-20260721-002 concurrently from the validated
    BATCH-001 dispatch plan.
  owner: coordinator
  created_at: '2026-07-21T18:06:00-07:00'
  updated_at: '2026-07-21T18:06:00-07:00'
