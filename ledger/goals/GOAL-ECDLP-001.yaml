  - id: INT-BATCH006-008
    subject: EXP-IC-001 success criterion revised after the original failed, marked preserved
    note: >-
      experiments/EXP-IC-001/amendments/v2_to_v3.yaml revises the success criterion
      after observing that the v2 criterion failed, and records
      confirmatory_status preserved. Under docs/task-lifecycle.md section 5 an
      outcome-driven revision is exploratory and cannot be evaluated against the
      original confirmatory criterion, so exploratory_only or reset would be the
      defensible status. Separately, a Coordinator arithmetic observation to be
      independently checked and not settled here: K* is finite exactly when
      sqrt(N) > T_desc_gops + T_verify with T_verify = 2 group operations, while
      the v3 criterion conditions on sqrt(N) > T_desc_gops, so it can fail only
      inside a 2-group-operation window out of roughly 32,000 and the reported
      4/4 may be arithmetic rather than measurement. TASK-20260727-004 and
      TASK-20260727-008 are tasked with adjudicating both points. If confirmed,
      they compound the zero-decomposition confound recorded in
      INT-BATCH006-003 rather than replacing it. No status is changed on this
      basis today.
    adjudication:
      adjudicated_on: '2026-07-27'
      adjudicated_by_task: TASK-20260727-009
      outcome: >-
        BOTH POINTS CONFIRMED. TASK-20260727-004 (RT-20260727-001 Q5, Q3)
        adjudicated confirmatory_status "preserved" as NOT DEFENSIBLE under
        docs/task-lifecycle.md section 5, the defensible status being
        exploratory_only, and confirmed the near-tautology charge as correct and
        understated: the conditioning event and the outcome event differ by a
        two-group-operation window against a T_desc_gops of about 32,000, with
        a narrowest actual margin of 23,982. TASK-20260727-008 was cancelled
        unexecuted (INT-BATCH006-015), so the second adjudication came instead
        from the TASK-20260727-012 re-review's independent re-derivation. Both
        points are recorded as superseding corrections in
        ledger/corrections/CORR-20260727-002.yaml, and they are two of the three
        grounds for DEC-20260727-001's weaken verdict on H-IC-001. As predicted,
        they compound the zero-decomposition confound rather than replacing it.
