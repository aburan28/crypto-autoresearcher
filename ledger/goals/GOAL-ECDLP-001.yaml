    campaign_budget.maximum_batches = 13 IS CONSUMED and no completion criterion
    is met. BUDGET-AMEND-20260729-003 stated in terms that the raise from 12 was
    BY EXACTLY ONE - a thirteenth batch authorized, a FOURTEENTH NOT - and that
    statement now binds. A FOURTEENTH BATCH REQUIRES ITS OWN BUDGET AMENDMENT ON
    EXPLICIT USER AUTHORIZATION AND NONE IS RECORDED HERE. THE COORDINATOR DOES
    NOT SELF-GRANT ONE. `paused` asserts NO SUCCESS and needs no closure quorum
    (AGENTS.md rule 13); it is not `completed`, not `closed_at_budget` and not
    `cancelled`.
    WHAT BATCH-013 DID. It froze EXP-YIELD-003 at de6fbb75, reviewed it
    independently before execution (RT-20260729-033, PASS, fifteen objections and
    ZERO blocking, discharged as PDC-1 to PDC-15 recorded VERBATIM and
    pre-execution in the TASK-20260729-034 receipt at 99dec70d), executed three
    curve-free runs, snapshot-committed them alone at 6921e716, and reviewed the
    bound package twice independently. NO INVALIDATION RULE FIRED IN ANY RUN. The
    primary observation, an OBSERVATION FEEDING NO CRITERION, is a 48-tuple z_sem
    mean of 0.3336976784 with sample sd 0.8915705400 and standard error
    0.1286871228 over the 48 declared tuples, against BATCH-012's 0.3610236850 /
    0.9750016842 / 0.1407293712 under disjoint master seeds. The Validator
    returned PASS with `blocks_ledger_record: false` and thirteen required
    narrowings, reproduced the package bit-identically on every scientific leaf,
    and reached python 3.13.1 with numpy 2.4.0 ITSELF rather than relaying PP-1.
    The Red Team returned PASS WITH BLOCKING CONSTRAINTS ON THE DECISION - the
    run package is admissible and needs no repair - and ruled that THE SHIFT IS
    NOT ESTABLISHED AS ANYTHING.
    WHAT WAS DECIDED. DEC-20260729-003 records `inconclusive` ON THE MECHANISM
    AND CLOSED ON THE CHASE, at strength `inconclusive` and claim tier toy
    (EV-ECDLP-010). The mathematics limb is closed BY DERIVATION - the exact
    process mean is a theorem and the total expectation of the statistic is of
    order +0.04 - and the code limb is closed EMPIRICALLY for any
    fixed-bins-offset defect by this batch's own ten-tuple 10,000-replicate
    block. NO LOCUS FOR A DETERMINISTIC COMPONENT WAS IDENTIFIED AND NONE IS
    ASSERTED; the residue, a defect proportional to sem_rep, is NAMED, UNEXCLUDED
    AND NOT PROPOSED. NO RECORD OF THIS BATCH SAYS THE SHIFT IS A PROPERTY OF THE
    RECORDED DRIVER, BUILD OR PLATFORM.
    THE LINEAGE IS CLOSED. Under RULE-BATCH013-SCOPE, carried into the ledger by
    DEC-20260729-003 as INT-BATCH013-K, BATCH-013 WAS THE LAST BATCH THIS LINEAGE
    MAY CONSUME FOR A REPLICATION OR A CONTROL-ON-A-CONTROL, under either branch
    and regardless of outcome. The successor batch, if one is ever authorized,
    must do EXACTLY ONE of three things and SAY WHICH: dispatch the EXP-STR-004
    replication of DEFER-BATCH009-001 with a solver-availability check BEFORE the
    freeze; dispatch a FRESH-CELL yield experiment under RC-G; or record that the
    goal has no auditable next action inside its budget and pause on
    pause_condition 4. INSTRUMENT MAINTENANCE IS NOT AMONG THE OPTIONS, and NO
    BATCH AFTER BATCH-014 MAY BE JUSTIFIED BY THIS LINEAGE.
    WHAT THIS BATCH IS NOT. Not an attack, not an attack improvement, not a
    cryptanalytic result, not a closure, not an impossibility claim, NOT A
    FRESH-PLATFORM REPLICATION, and not a claim above toy tier. NO HYPOTHESIS
    STATUS CHANGED - H-YIELD-001 stays `specified` and H-STR-002 does not move in
    either direction, DEFER-BATCH009-001 binding. INV-4 is not un-fired and not
    re-disposed; INV-5 is declared neither way; no cost model is touched; no
    efficiency E or yield ratio appears as a measurement; nothing whatever is said
    about decomposition yield. No exponent moved and all four promotion gates
