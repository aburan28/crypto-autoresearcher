  - id: INT-BATCH007-014
    subject: what BATCH-007 did NOT settle
    note: >-
      Stated so that no downstream record overstates the batch. The endomorphism
      MECHANISM is untested, not refuted: phi is an automorphism, phi(R) is a
      genuine relation on a phi-invariant factor base, and the closed system
      really is C_3-equivariant - no arm touched any of that. The cost model is
      UNTOUCHED: the frozen contract excludes cost explicitly, no cell reports any
      cost quantity, and RT-CM-1 through RT-CM-6 (displacement-rank theory applied
      to a finite-order permutation rather than a nilpotent shift; the alpha = 0
      degeneracy priced at zero operations; uncharged relation collection at 7x to
      79x the entire modelled linear algebra; absent memory accounting on both
      sides; the cost_ratio inverted under the ablation; non-comparable units)
      remain OPEN and must not be described as settled, tested or addressed. All
      four promotion gates - proof decomposition, numbered validated heuristics,
      concrete-cost honesty, and independent review plus red team of a cost model -
      remain OPEN, and DEC-20260727-002 moves H-STR-002 away from `supported`
      rather than toward it. No asymptotic exponent moves in either direction, and
      nothing in this batch is a cryptanalytic result, an attack improvement, a
      closure or an impossibility claim. The one reproducible effect is the
      constant factor r = 3 in relation collection, which is the known
      automorphism-quotient baseline and is not target-class.
