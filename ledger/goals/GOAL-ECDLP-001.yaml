      the prior next_action named three metric keys that do not exist in the
      EXP-STR-002 run records
    note: >-
      The superseded BATCH-006 resume action asked for a census of
      metrics.decomposition_found, metrics.is_trivial_ideal and certificate.kind
      across the EXP-STR-002 runs. The first two DO NOT EXIST in any committed
      EXP-STR-002 run record, and certificate.kind is "none" in all eight
      measurement runs and "discrete_log" in all five rho runs. Those fields
      belong to harness/semaev.py's Groebner measurement path (fields listed at
      lines 83-87), which EXP-STR-002's arity-2 code path never invokes: it calls
      semaev._find_decomposition (lines 147-171), a direct factor-base
      enumeration with an s3_eval filter that never calls sympy.groebner. The
      task as written would have censused nothing. This also means EV-STR-002's
      boundary "All Groebner solves on trivial ideals (no decompositions at B >=
      27)" describes a computation this experiment never performs, in addition to
      being contradicted at B = 27 on its decomposition clause. Recorded so the
      departure from the committed next_action is visible rather than silent.
  - id: INT-BATCH007-004
    subject: what the BATCH-007 opening session could and could not verify
    note: >-
      The session that froze the census and opened this batch had NO shell and NO
      git access. It ran no git command, no validator and no harness. It verified
