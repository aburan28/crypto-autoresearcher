    - '3a59a207 (EV-GGM-001 + DEC-20260726-007)'
    ledger_commit_form: abbreviated_unverified_in_batch006_session
    outcome: three_support_decisions_two_resting_on_runs_without_any_decomposition
    integrity_note: >-
      The BATCH-005 coordination artifacts (dispatch queue, task cards
      TASK-20260726-005..008, snapshot and ledger archive receipts, review
      reports) were never committed and are absent from this worktree. The
      archive task IDs, snapshot commit and review verdicts are therefore
      unknown and are recorded as null rather than reconstructed. The evidence
      and decision records themselves ARE committed and are the only durable
      BATCH-005 artifacts. Per docs/dynamic-subagent-dispatch.md this is an
      evidence-integrity gap in the batch's provenance chain, not a
      mathematical result; it means the three BATCH-005 decisions carry no
      verifiable independent-review receipt in the ledger.
    claim_boundary: >-
      Toy scale only. EV-GGM-001 (strong, derivation) establishes that the jet
      (C=1) and endomorphism (C=0) oracles are GGM-simulable under the
      STRUCTURED generic group model with a public curve equation - a
      scale-independent closure at exponent 1/2 for those candidate families,
      and explicitly not a claim under the strictest Shoup GGM, where
      EV-GGM-001's own boundaries state both would be NON-SIMULABLE.
      EV-IC-001 (preliminary) and EV-STR-002 (preliminary) each carry a
      recorded confound in their own boundaries blocks - "all Groebner solves
      on trivial ideals (no decompositions)" and "all Groebner solves on
      trivial ideals (no decompositions at B >= 27)" respectively - so the two
      support verdicts DEC-20260726-005 and DEC-20260726-006 rest on runs in
      which no decomposition ever occurred, and EV-STR-002's cost advantage is
      a model comparison rather than a measured wall time. No attack
      improvement, no crypto-scale evidence, no breakthrough. BATCH-006 exists
      to test the first of those two confounds (EXP-IC-002).
  completion_criteria:
  - A candidate attack improvement is independently reproduced or proved within its
    declared scope, carries required certificates, and has complete end-to-end cost
    accounting showing a credible asymptotic or concrete cryptographic advantage over
    matched rho/BSGS controls.
  - Or a novel cryptographically relevant technique is independently validated with
    a concrete, reproducible improvement to a decision-critical ECDLP attack stage
    or to rigorous cryptanalytic verification, together with a credible path to broader
    relevance and explicit non-breakthrough boundaries.
  pause_conditions:
  - The 28800-second or six-batch campaign budget is exhausted without meeting a positive
    completion criterion.
  - A required exact model policy cannot be resolved and the handoff forbids fallback.
  - A required snapshot or ledger archive fails exact-path, hash, parent, or reachability
    verification.
  - The user requests pause or the remaining candidate frontier has no auditable next
    action within the campaign budget.
  next_action: >-
    Run TASK-20260727-003, the Coordinator snapshot archive for BATCH-006, alone:
    stage and commit exactly experiments/EXP-IC-002/specification.yaml,
    ledger/goals/GOAL-ECDLP-001.yaml and
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/dispatch_queue.json, record
    the post-commit receipt with full commit_sha, parent_sha and per-path SHA-256,
    and let the dispatcher verify it before TASK-20260727-004 opens the independent
    review of EXP-IC-002.
  superseded_next_action:
    superseded_on: '2026-07-27'
    prior_value: >-
      Review H-GGM-001 + EXP-GGM-001 via independent review-xhigh session. If
      approved, execute EXP-GGM-001 to classify jet, elliptic-net, incidence, and
      endomorphism oracles as SIMULABLE or NON-SIMULABLE. [...] Separately, upgrade
      H-STR-002 to replicated by implementing a structured solve and measuring
      wall-time vs Wiedemann at B=200-1000.
    reason: >-
      Stale on both clauses. Clause 1 requested review-then-execute of EXP-GGM-001,
      which is already executed and closed: EV-GGM-001 and DEC-20260726-007 (support,
      strong) record 9 runs, a 4/4 control gate and SIMULABLE verdicts for all four
      oracles. Clause 2 (structured-solve wall-time) is deferred, not adopted, for the
      reason recorded in integrity_notes and in the BATCH-006 queue's
      deferred_successors: a measured wall-time win for a structured/Toeplitz solve is
      a constant- or polynomial-cofactor engineering result, and DEC-20260726-007 has
      since shown the endomorphism oracle is GGM-simulable with C=0, so any advantage
      there is non-generic and cannot move an exponent.
  integrity_notes:
  - id: INT-BATCH006-001
    subject: BATCH-005 coordination artifacts missing
    note: >-
      TASK-20260726-005..008 and every BATCH-005 dispatch, snapshot, review and
      ledger-archive artifact are uncommitted and absent from this worktree. They are
      recorded as null in the BATCH-005 checkpoint, never reconstructed. Consequence:
      DEC-20260726-005, -006 and -007 have no verifiable independent-review receipt
      in the repository, so their "independently reviewed" standing cannot be checked
      from the ledger alone.
  - id: INT-BATCH006-002
    subject: docs/target-result-profile.md absent at this commit
    note: >-
      The dispatch bias for BATCH-006 is governed by the rule "A target-class result
      changes the asymptotic exponent (or an equally central structural barrier) of a
      named hard problem. Constant-factor speedups, implementation tuning, and
      logarithmic-cofactor improvements are valuable engineering but are not
      target-class, and must not be presented as if they were." That text lives in
      docs/target-result-profile.md, which does NOT exist in this tree (it was
      introduced on an unmerged branch). The rule is applied as the governing rule;
      the document is not cited as present. Any record that cites the path at this
      commit is citing a file that is not here.
  - id: INT-BATCH006-003
    subject: two support decisions rest on runs with zero decompositions
    note: >-
      EV-IC-001 line 55 records "B=14, m=2 only; all Groebner solves on trivial
      ideals (no decompositions)" and EV-STR-002 line 55 records "All Groebner solves
      on trivial ideals (no decompositions at B >= 27)", yet DEC-20260726-005 and
      DEC-20260726-006 both concluded support. BATCH-006 dispatches EXP-IC-002 as a
      control on the first; the second (IDEA-20260727-001, orbit-quotient and rank
      control on H-STR-002) is recorded as the first deferred successor. No
      hypothesis status is changed by opening this batch.
  - id: INT-BATCH006-004
    subject: archive commit identifiers recorded in abbreviated form
    note: >-
      The BATCH-004 and BATCH-005 commit identifiers, and latest_verified_commit
      3a59a207, were supplied by the dispatching orchestrator in abbreviated form.
      This session has no shell or Git access and could not re-verify ancestry,
      parents or paths. They are marked abbreviated_unverified_in_batch006_session.
      TASK-20260727-003 must record full 40-hex identifiers in its receipt, and any
      later checkpoint should expand these values once verified.
  - id: INT-BATCH006-005
    subject: campaign wall-clock consumption is not tracked
    note: >-
      campaign_budget.total_wall_clock_seconds is 28800 but no batch checkpoint
      records consumed wall clock, so the remaining campaign budget cannot be
      computed from this record. BATCH-006 is therefore capped by its own declared
      task budgets (12300 s summed across nine task cards) rather than by a verified
      remaining balance.
  - id: INT-BATCH006-006
    subject: fallback authorization reference does not contain a fallback clause
    note: >-
      The BATCH-004 snapshot receipt cites DEC-20260726-003 as authorization_ref for
      the glm-5p2 fallback, but DEC-20260726-003 is a weaken decision on H-FCP-001
      and contains no fallback authorization. BATCH-006 does not inherit that
      reference; its fallback disclosure requirements are stated per task card in the
      BATCH-006 dispatch queue.
  - id: INT-BATCH006-007
    subject: batch-opening decision has no ledger DEC record
    note: >-
      The Coordinator decision that opened BATCH-006 (approve EXP-IC-002, defer the
      H-STR-002 rank control and the structured-solve wall-time contract, reconcile
      this record) is persisted as the batch_opening_decision block inside
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/dispatch_queue.json, not as
      a ledger/decisions/DEC-*.yaml record, because the batch-opening task was
      explicitly scoped to create no decision or evidence records. It is a
      coordination record, not an official ledger decision; DEC-20260727-001 is
      reserved for the TASK-20260727-009 evidence-review decision.
  - id: INT-BATCH006-008
    subject: EXP-IC-001 success criterion revised after the original failed, marked preserved
    note: >-
      experiments/EXP-IC-001/amendments/v2_to_v3.yaml revises the success criterion
      after observing that the v2 criterion failed, and records
      confirmatory_status preserved. Under docs/task-lifecycle.md section 5 an
      outcome-driven revision is exploratory and cannot be evaluated against the
      original confirmatory criterion, so exploratory_only or reset would be the
      defensible status. Separately, a Coordinator arithmetic observation to be
      independently checked and not settled here: K* is finite exactly when
      sqrt(N) > T_desc_gops + T_verify with T_verify = 2 group operations, while
      the v3 criterion conditions on sqrt(N) > T_desc_gops, so it can fail only
      inside a 2-group-operation window out of roughly 32,000 and the reported
      4/4 may be arithmetic rather than measurement. TASK-20260727-004 and
      TASK-20260727-008 are tasked with adjudicating both points. If confirmed,
      they compound the zero-decomposition confound recorded in
      INT-BATCH006-003 rather than replacing it. No status is changed on this
      basis today.
  - id: INT-BATCH006-009
    subject: evidence records cite runs without binding run identifiers
    note: >-
      EV-IC-001, EV-STR-002 and EV-GGM-001 each carry run_ids: [] while their
      observations cite 748, 22 and 9 runs. AGENTS.md rule 10 requires every
      conclusion to cite the experiment and run artifacts supporting it. The run
      records exist under experiments/*/runs/ but are not bound in the evidence.
      EV-IC-002 must not repeat this; TASK-20260727-009 fills run_ids with the
      four exact EXP-IC-002 run identifiers.
  - id: INT-BATCH006-010
    subject: BATCH-004 archive receipts have no commit identity either
    note: >-
      The committed BATCH-004 receipts
      (coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/archives/TASK-20260726-002/snapshot_commit_receipt.json
      and .../TASK-20260726-004/ledger_commit_receipt.json) carry commit_sha null
      and parent_sha null, and the ledger receipt carries no path_sha256 at all.
      The BATCH-004 archive chain is therefore not verifiable from the repository
      either, extending the BATCH-005 provenance gap one batch further back. The
      abbreviated identifiers in the BATCH-004 checkpoint above come from
      EV-ECDLP-006 and the dispatching orchestrator, not from those receipts.
