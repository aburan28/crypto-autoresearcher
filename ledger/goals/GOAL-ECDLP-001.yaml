  - id: INT-BATCH007-002
    subject: the EV-STR-002 census is an artifact-integrity finding, not a refutation
    note: >-
      TASK-20260727-013 froze a census of all 13 committed
      experiments/EXP-STR-002/runs/*/raw-result.json files. Verified in the
      working tree: B in {2, 6, 27} across the whole committed set; every
      headline number of DEC-20260726-006 (B=55 cost_ratio 0.218; B=204
      phi_alpha 4 vs rand_alpha 200 ratio 0.314; B=397 phi_alpha 1 vs rand_alpha
      387 ratio 0.011; "the structured solve beats Wiedemann at B >= 55") comes
      from nine measurements EV-STR-002 line 23 itself calls inline, with no
      manifest, seed, command, environment or raw result, and run_ids is empty;
      at the largest committed B the record reports phi_alpha 9 and cost_ratio
      7.5, failing the frozen success criterion at specification.yaml lines
      83-87, and is dismissed as an artifact by analysis.md line 37 and
      EV-STR-002 lines 48-49; and the boundary "no decompositions at B >= 27" is
      contradicted at B = 27 by 15/27 and 37/67 recorded decompositions. THIS IS
      NOT A REFUTATION OF H-STR-002. The mechanism may hold; what is missing is
      the evidence for it. The committed data does not even meet H-STR-002's own
      falsification condition, which requires the ABSENCE of separation from the
      random baseline, whereas at B = 27 phi_alpha 9 against rand_alpha 27 is a
      3x separation. Nothing here is a cryptanalytic result, an attack
      improvement, a closure, an impossibility claim or a result above toy tier,
      and no asymptotic exponent moves in either direction. H-STR-002's status is
      UNCHANGED at `supported`; any transition belongs to TASK-20260727-018 after
      both independent reviews.
