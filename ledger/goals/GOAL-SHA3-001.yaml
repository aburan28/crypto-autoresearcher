research_goal:
  id: GOAL-SHA3-001
  title: "SHA-3: compute the round function's symmetry-decay curve and test whether it predicts the published internal-differential collision frontier"
  objective: >-
    Give the largest margin in the standardized family a measured explanation
    instead of an inherited round count. Compute exactly, by linear algebra over
    the fixed permutation, how fast the translation-invariant subspace that
    internal-differential attacks depend on is destroyed per round, and test
    whether the point at which maintenance cost crosses the birthday bound
    predicts the published stall. Reproduce a published round-reduced collision
    as a literal message pair — practical attacks in this family sit at round
    counts this harness can plausibly re-run — and discriminate a
    structure-limited frontier from a budget-limited one by varying solver
    budget with everything else fixed. Require the decay model to explain the
    differing published reach across digest sizes over the same permutation. No
    claim about full 24-round SHA-3 is in scope.
  question_ids: [RQ-SHATHREE-cd2cb2]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MD5-001, GOAL-SHA2-001, GOAL-BLAKE-001, GOAL-ASCON-001]
  scheme_context:
    scheme: "SHA-3 / Keccak-f[1600] (FIPS 202), all standard digest sizes"
    family: "sponge over an iterated permutation; internal-differential cryptanalysis"
    nist_track: fielded_standard
    standardization_status: >-
      FIPS 202. The largest published margin in the fielded family, and
      correspondingly the least commercial pressure driving third-party work.
    why_this_scheme: >-
      Two properties make SHA-3 the best-shaped target in this set even though
      it is the least likely to move. First, its leading attack method has a
      NAMED STRUCTURAL RESOURCE — translation symmetry of the round function —
      and named resources can be counted exactly, by linear algebra, with no
      solver and no heuristic. Second, published practical attacks sit at round
      counts a modest budget can actually re-run, so baseline reproduction here
      is real rather than aspirational. Against that, the reason it is
      under-examined is precisely its margin, which is the inversion
      docs/inventor-protocol.md treats as a failure mode.
  non_duplication:
    - >-
      GOAL-SHA2-001 owns the Merkle-Damgard degrees-of-freedom deficit ledger.
      This goal owns a symmetry-decay curve over a permutation. The two share a
      QUESTION SHAPE — is the frontier structural or instrumental — and no
      mechanism; neither may cite the other's answer as support for its own.
    - >-
      GOAL-MD5-001 owns instrument calibration and this goal consumes it. The
      decay computation itself needs no instrument, which is why it runs first.
    - >-
      GOAL-BLAKE-001 and GOAL-ASCON-001 also analyse permutations with the same
      instrument. Cross-primitive comparison of decay or bound curves is
      admissible only after each goal has independently reproduced its own
      published baseline.
  completion_criteria:
    - >-
      AN EXACT SYMMETRY-DECAY COMPUTATION: per-round dimension of the surviving
      translation-invariant subspace over Keccak-f[1600], with full derivation,
      reproducible to the bit, DERIVED RATHER THAN FITTED. A model fitted to the
      published frontier assumes what the goal asks and is invalid.
    - >-
      A PREDICTION TEST: the round count at which internal-differential
      maintenance cost crosses the birthday bound, stated as a prediction, set
      against the published frontier — including the outcome that the prediction
      misses, which falsifies the decay hypothesis and is the cheapest useful
      result this goal can produce.
    - >-
      A REPRODUCED CERTIFICATE: a published round-reduced SHA-3 collision
      re-run and emitted as the literal message pair, independently verified, or
      a reported reproduction failure with encoding, solver version, seed, and
      ceiling.
    - >-
      A DISCRIMINATION RESULT: solver budget varied over a pre-declared range
      with everything else fixed, reporting whether reachable round count moves,
      plus the decay model's account of the differing reach across digest sizes
      over the same permutation.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, scoped to the round counts,
      digest sizes, and solver budget actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The round-reduced attack chosen for reproduction cannot be obtained in
      primary text under the network policy after the declared source-preference
      order is exhausted, leaving nothing to reproduce against.
    - >-
      Internal-differential search exceeds the declared campaign budget after
      cheaper falsification gates are exhausted. This is a budget outcome about
      a solver and is never evidence about SHA-3 (AGENTS.md rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    RUN THE SYMMETRY-DECAY COMPUTATION FIRST, BEFORE ACQUISITION COMPLETES AND
    BEFORE ANY SEARCH. It is exact linear algebra over a fixed public
    permutation, it needs no solver, no literature and no calibration, and it
    produces a NUMBER — the predicted stall round — that can then be checked
    against the published frontier the moment acquisition lands. If the
    prediction misses, the decay hypothesis is falsified in BATCH-001 at
    essentially no cost and the campaign has its most valuable result already.
    Derive the curve; do not fit it to the frontier, which would assume the
    conclusion. During acquisition, settle whether a public round-reduced Keccak
    challenge scoreboard exists and record the answer either way: an external
    frontier with machine-checkable targets is the strongest baseline available
    to this program and must not be missed by omission. Claim tier: round-reduced
    certificates and a decay measurement; never a statement about full SHA-3,
    SHAKE, or any deployed protocol.
  owner: coordinator
  created_at: '2026-08-09'
  updated_at: '2026-08-09'
