  scheme_context:
    scheme: "Classic McEliece"
    family: >-
      code-based KEM: binary Goppa codes in Niederreiter form, deterministic
      one-way PKE under an FO-style CCA transform
    nist_track: not_selected
    standardization_status: >-
      SETTLED FOR NIST, OPEN FOR ISO, established by TASK-20260803-f3aece from
      primary text (EV-MCE-332f99 O-6, O-7, O-8). NIST IR 8545 (March 2025,
      DOI 10.6028/NIST.IR.8545) states Classic McEliece "is no longer under
      consideration for standardization as part of the current NIST PQC
      Standardization Process", citing limited interest, migration complexity
      and NIST/ISO incompatibility risk -- explicitly NOT security. ISO
      standardization in June 2026 is asserted only by the designers' own site;
      iso.org returned 403 twice, the designation number was NOT obtained, and
      ISO's own text was never read, so the ISO half stays OPEN. This record's
      earlier gloss that non-selection "makes its parameters durable rather
      than provisional" is NOT established by anything fetched and is withdrawn.
      SCOPING CONSEQUENCE: the ISO set list contains no mceliece348864 variant,
      so "standardized parameter sets" excludes the lowest-claimed-category set.
    why_this_target: >-
      The single best-calibrated hard-problem record available: the 1978
      construction (KN-LIT-141bac) stands after 48 years and 162 catalogued
      papers, while every structured variant proposed for efficiency was
      broken (KN-LIT-19cf36, KN-LIT-2395, KN-LIT-495e7f, KN-LIT-2d9edb,
      KN-LIT-5792). Meanwhile ISD moved the exponent very little across the
      same period (KN-LIT-6a786b to KN-LIT-47b29b), and in the sub-linear
      weight regime McEliece actually uses, the advanced variants
      asymptotically collapse back toward Prange (KN-LIT-fa9bc8).
  completion_criteria:
    - >-
      KN-LIT-7c4620's complexity claim, its numbered heuristics, and the code
      families and rate regime it applies to are transcribed from primary text
      with the transcription independently controlled; and the distance between
      that regime and Classic McEliece's actual parameters is stated
      quantitatively, or its unavailability is recorded with routes tried.
    - >-
      A memory-charged concrete ISD cost at Classic McEliece's parameter sets,
      computed under a stated costing convention -- NOT ISD-FC-2026 unless and
      until it is adopted (see objective_correction) -- with hidden overhead, memory access, and time-memory
      tradeoffs accounted, and an affected-vs-safe scope statement.
    - >-
      Independent Validator and Red Team sessions admit the resulting package,
      checking transcription fidelity, the rate/parameter arithmetic, the
      baseline's matching, and the absence of uncharged preprocessing, memory,
      oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with every conclusion scoped
      to the exact parameter sets, sources, and solver actually used.
