research_goal:
  id: GOAL-MCE-001
  title: >-
    Classic McEliece: does the 2026 heuristic subexponential line reach the
    standardized parameters, and what is the charged ISD cost there?
  objective: >-
    Attack Classic McEliece where it is actually attackable by this program:
    not by attempting a break, but by determining precisely what the 2026
    heuristic subexponential attack (KN-LIT-7c4620, iacr:2026/1232) claims,
    which code families and rates it reaches, and how far that regime sits
    from Classic McEliece's parameters — then building a memory-charged ISD
    baseline at those parameters. The deliverable is a correctly-scoped
    reading of the current attack frontier plus an honestly-charged baseline.
    A break is not an objective and is not expected.
