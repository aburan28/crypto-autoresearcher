# Sharded goal record. The mutable head lives here; the checkpoint
# log lives one-file-per-batch under checkpoints/ so that a batch
# close in another worktree does not conflict with this file.
# validate_ledger.py merges the two before checking anything.
research_goal:
  id: GOAL-MCE-001
  title: >-
    Classic McEliece: does the 2026 heuristic subexponential line reach the
    standardized parameters, and what is the charged ISD cost there?
  objective: >-
    Attack Classic McEliece where it is actually attackable by this program:
    not by attempting a break, but by determining precisely what the 2026
    heuristic subexponential attack (KN-LIT-7c4620, iacr:2026/1232) claims,
    which code families and rates it reaches, and how far that regime sits
    from Classic McEliece's parameters — then building the memory-charged ISD
    baseline at those parameters under the costing convention GOAL-HQC-001 and
    GOAL-SDITH-001 already bind to. The deliverable is a correctly-scoped
    reading of the current attack frontier plus an honestly-charged baseline.
    A break is not an objective and is not expected.
  question_ids: [RQ-MCE-e65b3c]
  active_hypothesis_ids: []
  status: active
  status_value_history:
    - value: draft
      in_force_until: '2026-08-03'
      note: >-
        Created and activated 2026-08-03 in one act, on the user's explicit
        direction this session ("/coordinate-research-goal attack mceliece").
        No goal record with scheme_context.scheme == "Classic McEliece"
        existed, so this is a new campaign rather than a resumption; the
        nearest existing goals are GOAL-HQC-001 and GOAL-SDITH-001, both
        code-based, and this record binds to their ISD costing convention
        rather than opening a competing one. This is a USER AUTHORIZATION
        RECORDED BY THE COORDINATOR, not a self-grant. Activation asserts
        nothing: no hypothesis exists, active_hypothesis_ids stays empty, no
        completion criterion is met or approached, and the toy claim-tier
        ceiling declared by RQ-MCE-e65b3c stands.
  runtime:
    provider: none
    goal_id: null
    runtime_note: >-
      No durable goal API is available under this harness. The ledger record IS
      the persistent goal. Recorded explicitly rather than left implicit, per
      /coordinate-research-goal step 4.
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: BATCH-001
  dispatch_queue_path: coordination/goals/GOAL-MCE-001/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: null
  related_goals: [GOAL-HQC-001, GOAL-SDITH-001]
  scheme_context:
    scheme: "Classic McEliece"
    family: >-
      code-based KEM: binary Goppa codes in Niederreiter form, deterministic
      one-way PKE under an FO-style CCA transform
    nist_track: not_selected
    standardization_status: >-
      UNVERIFIED IN THIS RECORD. The Classic McEliece project site lists both
      a "NIST" and an "ISO" page, from which this record infers an ISO track
      and non-selection by NIST. Neither page was fetched. BATCH-001 is
      directed to establish this from primary text or record it as
      unestablished; no deliverable of this goal may characterise the
      algorithm's standardization state until it does.
    why_this_target: >-
      The single best-calibrated hard-problem record available: the 1978
      construction (KN-LIT-141bac) stands after 48 years and 162 catalogued
      papers, while every structured variant proposed for efficiency was
      broken (KN-LIT-19cf36, KN-LIT-2395, KN-LIT-495e7f, KN-LIT-2d9edb,
      KN-LIT-5792). Meanwhile ISD moved the exponent very little across the
      same period (KN-LIT-6a786b to KN-LIT-47b29b), and in the sub-linear
      weight regime McEliece actually uses, the advanced variants
      asymptotically collapse back toward Prange (KN-LIT-fa9bc8).
  completion_criteria:
    - >-
      KN-LIT-7c4620's complexity claim, its numbered heuristics, and the code
      families and rate regime it applies to are transcribed from primary text
      with the transcription independently controlled; and the distance between
      that regime and Classic McEliece's actual parameters is stated
      quantitatively, or its unavailability is recorded with routes tried.
    - >-
      A memory-charged concrete ISD cost at Classic McEliece's parameter sets,
      computed under the convention shared with GOAL-HQC-001 and
      GOAL-SDITH-001, with hidden overhead, memory access, and time-memory
      tradeoffs accounted, and an affected-vs-safe scope statement.
    - >-
      Independent Validator and Red Team sessions admit the resulting package,
      checking transcription fidelity, the rate/parameter arithmetic, the
      baseline's matching, and the absence of uncharged preprocessing, memory,
      oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with every conclusion scoped
      to the exact parameter sets, sources, and solver actually used.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      KN-LIT-7c4620's primary text cannot be obtained after the declared route
      order is exhausted, AND no substitute primary statement of the 2026
      subexponential line (KN-LIT-d6d510, KN-LIT-e4a472, KN-LIT-71d1a0) can be
      obtained either. A blocked route is a recorded outcome, never negative
      mathematical evidence (AGENTS.md rule 5).
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  known_hazards:
    - >-
      THE CORPUS IS BROAD AND UNREAD. 137 McEliece KN-LIT entries were filed
      2026-08-03 and none of the papers was read; every entry says so. A broad
      unread corpus is precisely the condition under which a novelty or
      dedup check returns a confident wrong answer. RQ-MCE-e65b3c forbids
      designing an experiment before primary text is in hand.
    - >-
      PROVENANCE INHERITED FROM KN-OPEN-3f7a21. 7457 of 7666 literature
      entries carried citation_verified: read against an absent downloads/
      tree. Any pre-2026-08-03 McEliece entry's `read` provenance is
      unconfirmed and must not be relied on as if the text were in hand.
    - >-
      TWO CONSECUTIVE CAMPAIGNS (GOAL-HAWK-001 BATCH-001, GOAL-HQC-001
      BATCH-001) had a Coordinator "the prior record is defective" claim found
      to be an overread by their own red team. This goal's BATCH-001 makes
      several framing claims about the 2026-08-03 sweep and explicitly directs
      the red team to challenge them.
    - >-
      eprint.iacr.org ABSTRACT pages returned 200 on 75/75 requests
      2026-08-03; the PDF endpoint is a DIFFERENT question and GOAL-HQC-001
      BATCH-001 established it still returns 403. Do not repeat the retracted
      "the eprint blocker did not reproduce" claim.
  next_action: >-
    EXACTLY ONE NEXT ACTION: run BATCH-001 to completion —
    coordination/goals/GOAL-MCE-001/batches/BATCH-001/dispatch_queue.json.
    Two producers with disjoint write scopes, neither of which designs an
    experiment or asserts anything about Classic McEliece's security in either
    direction. TASK-20260803-292b99 obtains KN-LIT-7c4620 (iacr:2026/1232) and
    the nearest primary statements of the 2026 subexponential/distinguisher
    line, and transcribes the complexity claim, the numbered heuristics, and
    the rate regime VERBATIM. TASK-20260803-f3aece transcribes Classic
    McEliece's own parameter sets and claimed categories from the primary
    specification and establishes the standardization status this record
    currently marks UNVERIFIED. Then snapshot (TASK-20260803-f3beb0),
    independent validation (TASK-20260803-409c5e) and red team
    (TASK-20260803-08e883), then the ledger archive TASK-20260803-a561d8
    writing EV-MCE-332f99 and DEC-20260803-a5b9b1. DO NOT run /propose-ideas:
    RQ-MCE-e65b3c forbids designing an experiment before primary text is
    filed, and 137 unread map entries are not a foundation. Claim-tier ceiling
    stays toy. Nothing in BATCH-001 is admissible toward an AGENTS.md rule 13
    closure quorum: reviews are independent sessions on ONE model, because no
    policy alias in orchestration/model-policies.yaml resolves under this
    Claude Code harness.
  owner: coordinator
  created_at: '2026-08-03'
  updated_at: '2026-08-03'
