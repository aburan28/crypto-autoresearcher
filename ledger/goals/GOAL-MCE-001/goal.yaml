    DEC-20260802-344883 D-6 records "ISD-FC-2026 IS NOT ADOPTED... a usable
    draft, not a binding convention", and GOAL-HQC-001.next_action says "DO NOT
    bind GOAL-SDITH-001 to ISD-FC-2026". No goal binds to it; its declared
    binding scope names HQC and SDITH, not MCE; and this goal may not bind to
    it until it is adopted. It cost a real deliverable: TASK-20260803-f3aece
    read Esser-Bellini SEC Table 1 and declined to transcribe it in deference
    to the non-existent binding.
