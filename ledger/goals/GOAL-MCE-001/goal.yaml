# validate_ledger.py merges the two before checking anything.
research_goal:
  id: GOAL-MCE-001
  title: >-
    Classic McEliece: does the 2026 heuristic subexponential line reach the
    standardized parameters, and what is the charged ISD cost there?
  objective: >-
    Attack Classic McEliece where it is actually attackable by this program:
    not by attempting a break, but by determining precisely what the 2026
    heuristic subexponential attack (KN-LIT-7c4620, iacr:2026/1232) claims,
    which code families and rates it reaches, and how far that regime sits
    from Classic McEliece's parameters — then building a memory-charged ISD
    baseline at those parameters. The deliverable is a correctly-scoped
    reading of the current attack frontier plus an honestly-charged baseline.
    A break is not an objective and is not expected.
  objective_correction: >-
    CORRECTED 2026-08-03 by DEC-20260803-a5b9b1 D-3. This objective originally
    read "under the costing convention GOAL-HQC-001 and GOAL-SDITH-001 already
    bind to". That was FALSE and both BATCH-001 reviews found it independently.
    DEC-20260802-344883 D-6 records "ISD-FC-2026 IS NOT ADOPTED... a usable
    draft, not a binding convention", and GOAL-HQC-001.next_action says "DO NOT
    bind GOAL-SDITH-001 to ISD-FC-2026". No goal binds to it; its declared
    binding scope names HQC and SDITH, not MCE; and this goal may not bind to
    it until it is adopted. It cost a real deliverable: TASK-20260803-f3aece
    read Esser-Bellini SEC Table 1 and declined to transcribe it in deference
    to the non-existent binding.
