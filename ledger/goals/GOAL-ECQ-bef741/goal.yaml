research_goal:
  id: GOAL-ECQ-bef741
  title: Construct and certify an elliptic curve over Q of Mordell-Weil rank at least 31
  objective: >-
    Generate an exact nonsingular elliptic curve E over the rationals, exhibit
    at least 31 explicit rational points on E, and prove unconditionally and
    reproducibly that 31 of those points are Z-linearly independent in E(Q).
  question_ids:
    - RQ-ECQ-80f23c
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: codex
    goal_id: 01a02808-6b99-7bb0-b54f-ea0717eb5526
  campaign_budget:
    maximum_batches: 12
    total_wall_clock_seconds: 2592000
    max_concurrent: 2
  current_batch_id: BATCH-9fa73f
  dispatch_queue_path: coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/dispatch_queue.json
  latest_verified_commit: c57d838d910c42d089632457c97adc3a0100b948
  completion_criteria:
    - >-
      Record an exact rational Weierstrass equation for E and verify with exact
      arithmetic that its discriminant is nonzero.
    - >-
      Record at least 31 explicit rational points and verify with exact rational
      arithmetic that every listed point lies on the stated curve.
    - >-
      Provide an unconditional, machine-checkable certificate proving that 31
      listed points are Z-linearly independent in E(Q). An acceptable
      Cremona-Brumer-style certificate must define and justify the required
      squareclass or valuation characters, publish the complete exact matrix,
      prove that its rank over F2 is 31, and prove the implication from that
      matrix rank to Z-linear independence. An exact descent, saturation, or
      height certificate is acceptable only if it proves the same unconditional
      lower bound.
    - >-
      Determine E(Q)_tors exactly, or provide another exact torsion argument
      sufficient to exclude every torsion relation relevant to the independence
      proof.
    - >-
      Preserve a clean reproducible verifier with exact commands, source commit,
      dirty-tree state, dependency and environment versions, inputs, seeds where
      applicable, raw outputs, artifact hashes, timestamps, and resource
      measurements.
    - >-
      Archive the producer evidence before review, validate the certificate
      independently, obtain an independent adversarial red-team assessment, and
      execute a predeclared breakthrough review plan under review-breakthrough
      at max reasoning with no fallback or degradation.
    - >-
      Archive a Coordinator decision citing the exact experiment, certificate,
      validation, red-team, and breakthrough-review records that establish
      rank(E(Q)) at least 31. Proving that the rank is exactly 31 is not
      required.
    - >-
      Do not use BSD, GRH, an analytic-rank computation, a floating regulator,
      a floating determinant, or the mere existence of 31 distinct rational
      points as the proof of the rank lower bound.
  pause_conditions:
    - >-
      Pause before materialization or archival if origin/main advances beyond
      the bound authority projection until the relevant allocator, validator,
      goal, dispatch, and archive changes have been inspected and the authority
      binding has been renewed.
    - >-
      Pause if any newly allocated identifier fails its allocator check, the
      direct new-goal checks fail, or the candidate projection introduces a
      validation or merge-hygiene diagnostic absent from the clean bound base.
    - >-
      Pause executable research if the frozen protocol cannot identify exactly
      66 unique carried-forward timeout cases from immutable records, cannot
      preregister the 32-cell Mestre extension, or omits the required controls,
      budgets, stopping rules, proof-search map, or exact-certificate route.
    - >-
      Treat timeout, crash, OOM, Docker failure, unavailable runtime, or budget
      exhaustion as an operational condition only. None is mathematical
      evidence against the goal and none authorizes a success or closure claim.
    - >-
      Pause any proposed rank-greater-than-30 promotion until independent
      validation, red-team review, blind rederivation of the load-bearing
      certificate, and nondegraded review-breakthrough review at max are
      complete.
  next_action: >-
    Complete and archive the zero-experiment opening under
    TASK-20260824-e3992d and TASK-20260824-9e826a, then dispatch the no-experiment
    protocol-design task TASK-20260824-2218b3. That task must bind the exact 66
