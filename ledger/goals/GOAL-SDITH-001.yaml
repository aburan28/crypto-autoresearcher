research_goal:
  id: GOAL-SDITH-001
  title: "SDitH: is d-split syndrome decoding as hard as the plain-SD baseline it inherits?"
  objective: >-
    Test whether SDitH's inherited conservative security estimate
    survives contact with the instance it actually uses: construct a
    fully charged concrete ISD baseline at SDitH's parameters including
    memory, then determine whether a d-split-aware decoder beats it, and
    separately whether the MPCitH transform's soundness leaves any
    grinding slack.
  question_ids: [RQ-SDITH-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "SDitH"
    family: "code-based MPC-in-the-Head (Syndrome Decoding in the Head)"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      Either a structure-aware decoding or forgery cost that beats the
      charged plain-SD baseline at a named parameter set, certified at
      reduced parameters; or a derivation that the d-split instance is
      equivalent in cost to plain SD, paired with the corrected charged
      baseline (which may itself differ from the specification's
      estimate in either direction).
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      No SDitH Round-3 specification can be obtained under the network
      policy after the declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-SDITH-001. The first deliverable is the
    memory-charged ISD baseline, not an attack: this program's standing
    failure mode is a partial win that dies once memory and
    preprocessing are charged, and ISD is the canonical place that
    happens.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
