# GOAL-NGCC-6c8a52 -- opened by DEC-20260930-713445 on user direction
# (2026-09-30): make the Chinese NGCC round-1 algorithms targets.
# Non-ECC. Ranked after every ECC goal that has a ranked task.
research_goal:
  id: GOAL-NGCC-6c8a52
  title: >-
    NGCC round 1: the 119 Chinese public-key, key-exchange, and hash
    candidates as named cryptanalysis targets
  objective: >-
    Treat each of the 119 ICCS NGCC first-round candidates as a named
    attack target. Reproduce or refute published claims that a candidate
    misses a primary security claim or an NGCC call target, and search for
    new breaks only where a ranked batch names the candidate, the game,
    the baseline, and a falsifier. The target list is
    inputs/ngcc-round1-20260920/candidates.yaml. Published commentary is
    inputs/ngcc-round1-20260920/paper_mentions.yaml and is not evidence.
  question_ids: [RQ-NGCC-f52138]
  active_hypothesis_ids: [H-NGCC-f74578, H-NGCC-0313ae, H-NGCC-624765, H-NGCC-200f1c, H-NGCC-b764c1, H-NGCC-e2f945, H-NGCC-ad4a16]
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: null
    total_wall_clock_seconds: null
    max_concurrent: 2
  campaign_budget_note: >-
    Null ceilings per the 2026-09-06 progress-first research budget policy.
    max_concurrent is machine headroom, not a research budget. NGCC is not
    an ECC area, so this goal is scheduled only when no ECC goal offers a
    ranked task.
  current_batch_id: null
  dispatch_queue_path: null
  target_registry: inputs/ngcc-round1-20260920/candidates.yaml
  target_count: 119
  related_goals:
    - GOAL-SQISIGN-001
    - GOAL-SQISIGN-002
    - GOAL-SSI-001
    - GOAL-CSIDH-001
    - GOAL-MLKEM-004
    - GOAL-MLDSA-002
    - GOAL-UOV-001
    - GOAL-MAYO-001
    - GOAL-SNOVA-001
    - GOAL-HQC-001
    - GOAL-MCE-001
    - GOAL-SHA3-001
    - GOAL-SYMF-c00fa1
  non_duplication:
    - >-
      GOAL-SQISIGN-001, GOAL-SQISIGN-002, GOAL-SSI-001, and GOAL-CSIDH-001
      own the supersingular-isogeny and CSIDH problems. sign-25, sign-26,
      sign-27, and kex-08 (NIIKE) are NGCC submission targets here. An
      attack on the isogeny problem that is not about those submitted
      parameter sets stays with the ECC goals.
    - >-
      NIST schemes already on the ledger (ML-KEM, ML-DSA, UOV, MAYO,
      SNOVA, HQC, Classic McEliece, SHA-3) stay with their goals. An NGCC
      candidate that is a close variant is still an NGCC target; a result
      is not transferred across by name.
  claim_ceiling: >-
    No batch may claim that an NGCC candidate is broken, or that a
    published break is confirmed, until this program holds a certificate
    for the tested parameter set and the claim has passed the review tier
    its strength requires. A finding below a 512-bit claim that still
    costs 2^256 is a target shortfall, not a practical break, and the
    record says which. Absence of a report is not a security certificate.
  scheme_context:
    program: NGCC round 1
    publisher: Institute of Commercial Cryptography Standards (ICCS)
    published: '2026-09-20'
    roster: inputs/ngcc-round1-20260920/candidates.yaml
    literature_index: inputs/ngcc-round1-20260920/paper_mentions.yaml
    tracks:
      sign: 34
      kem: 41
      kex: 9
      hash: 35
  completion_criteria:
    - >-
      REGISTRY ACCEPTED: a committed Coordinator decision cites
      inputs/ngcc-round1-20260920/candidates.yaml and records that its 119
      rows are the round-1 target population this goal owns.
    - >-
      ONE INDEPENDENT WITNESS: for at least one candidate and one parameter
      set, either a certificate that a primary claim or an NGCC call target
      fails, re-verified by the run wrapper and reviewed, or a committed
      obstruction that names the tested instance, the cost, and what
      remains open. A literature citation does not meet this criterion.
    - >-
      NEXT TARGET NAMED: the same decision names the next candidate to
      rank, the reason it outranks the rest of the roster, and the
      candidates that were considered and set aside.
  pause_conditions:
    - >-
      The official submission packages named in the roster cannot be
      obtained, so no candidate can be compiled from source. Record an
      impediment. This is not evidence about any scheme.
    - >-
      A required review-breakthrough session cannot be served for a claim
      that would change a candidate's security status. The claim stays
      unpromoted. The goal stays active.
  next_action: >-
    File ePrint 2026/2266 and the ICCS round-1 notices as KN-LIT entries
    after the papers are read, then rank a first reproduction batch.
    Prefer a design-scoped primary break the paper presents as demonstrated
    and that names a small witness (sign-29 Tins, sign-10 Facto-DSA-128,
    hash-19 MoFang, hash-21 Neulaser, sign-05 Chinith) over an
    implementation bug, over the two attacks the paper leaves Probable
    (sign-02-2, sign-33-6), and over a 2^256 shortfall against a 512-bit
    claim.
    Do not open a batch that attacks the placeholder hash. Do not dispatch
    this goal ahead of a ranked ECC task.
