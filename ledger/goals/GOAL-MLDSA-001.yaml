research_goal:
  id: GOAL-MLDSA-001
  title: "ML-DSA: is SelfTargetMSIS the under-scrutinized load-bearing assumption, and where does the fault proof stop?"
  objective: >-
    Determine which of ML-DSA's three underlying problems binds at each
    FIPS 204 category under independently re-derived estimates, with
    particular attention to SelfTargetMSIS as the scheme-specific and
    least independently scrutinized one; and separately map the boundary
    of the existing fault-injection security proof, so that the
    published fault attacks can be classified as inside or outside its
    guarantee rather than argued about informally.
  question_ids: [RQ-MLDSA-001]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
    budget_risk_note: >-
      BATCH-001's five task-card ceilings sum to 9000s wall-clock (83% of this
      entire 6-batch campaign's 10800s total). That is a ceiling, not expected
      consumption -- a literature-acquisition-and-review batch should come in
      well under it -- but it is flagged here rather than silently absorbed.
      If BATCH-001 consumes materially more than a small fraction of 9000s,
      the Coordinator must record an explicit amendment to campaign_budget
      before opening BATCH-002, rather than letting the remaining five
      batches run underfunded by default. See
      coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/batch.yaml.
  current_batch_id: BATCH-214d98
  dispatch_queue_path: coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/dispatch_queue.json
  latest_verified_commit: '7ef705ca51c5861a14461085967413209a7934da'
  scheme_context:
    scheme: "ML-DSA (FIPS 204, formerly CRYSTALS-Dilithium)"
    family: "lattice signature (Fiat-Shamir with aborts)"
    nist_track: selected_algorithm
    standardization_status: >-
      Finalized 2024-08-13 as FIPS 204.
  completion_criteria:
    - >-
      Independently re-derived concrete estimates for MLWE, MSIS, and
      SelfTargetMSIS at a named FIPS 204 parameter set identifying which
      binds, with any toy-scale calibration certified; and a stated
      boundary for the fault-security proof placing each published fault
      attack inside or outside it, with the residual assumption named.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the FIPS 204 text nor the primary fault-security proof can
      be obtained under the network policy after the declared
      source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Open exactly one scoped literature-filing batch for GOAL-MLDSA-001, under a
    freshly minted BATCH-<6-hex> (mint with `python3 tools/allocate_id.py
    --next batch` and `--check` it before use; do NOT reuse BATCH-001), whose
    producer files (i) Kosuge & Xagawa, "The Security of ML-DSA against
    Fault-Injection Attacks" (ASIACRYPT 2025 / ePrint 2025/904) as a new KN-LIT
    entry and (ii) the KN-LIT-4dadec citation_verified partial -> read upgrade,
