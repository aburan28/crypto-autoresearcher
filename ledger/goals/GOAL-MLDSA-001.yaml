    - prior_text: >-
        BATCH-001 is queued and dispatch-ready at
        coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/dispatch_queue.json.
        Run TASK-20260805-a1c3f9 (idea-generator): acquire the FIPS 204 primary
