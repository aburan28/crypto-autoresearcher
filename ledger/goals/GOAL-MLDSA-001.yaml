  completion_criteria:
    - >-
      Independently re-derived concrete estimates for MLWE, MSIS, and
      SelfTargetMSIS at a named FIPS 204 parameter set identifying which
      binds, with any toy-scale calibration certified; and a stated
      boundary for the fault-security proof placing each published fault
      attack inside or outside it, with the residual assumption named.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
