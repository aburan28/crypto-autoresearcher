research_goal:
  id: GOAL-MLDSA-001
  title: "ML-DSA: is SelfTargetMSIS the under-scrutinized load-bearing assumption, and where does the fault proof stop?"
  objective: >-
    Determine which of ML-DSA's three underlying problems binds at each
    FIPS 204 category under independently re-derived estimates, with
    particular attention to SelfTargetMSIS as the scheme-specific and
    least independently scrutinized one; and separately map the boundary
    of the existing fault-injection security proof, so that the
    published fault attacks can be classified as inside or outside its
    guarantee rather than argued about informally.
  question_ids: [RQ-MLDSA-001]
  active_hypothesis_ids: []
  status: active
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
    budget_risk_note: >-
      BATCH-001's five task-card ceilings sum to 9000s wall-clock (83% of this
      entire 6-batch campaign's 10800s total). That is a ceiling, not expected
      consumption -- a literature-acquisition-and-review batch should come in
      well under it -- but it is flagged here rather than silently absorbed.
      If BATCH-001 consumes materially more than a small fraction of 9000s,
      the Coordinator must record an explicit amendment to campaign_budget
      before opening BATCH-002, rather than letting the remaining five
      batches run underfunded by default. See
      coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/batch.yaml.
