    "rank >= 31 at degree <= 8 BY THIS CONSTRUCTION". C1 reads "degree <= 8" and DEGREE 1 QUALIFIES, and
    the reduction runs one way only -- a curve of rank r over Q has rank >= r over any extension, so a
    degree-1 witness settles the degree-<=8 question and not conversely. CAVEAT CARRIED VERBATIM FROM THE
    RED TEAM AND NOT SOFTENED: "This review did NOT verify the 31 points and asserts no rank." THE EXTERNAL
    RECORD IS A POINTER, NOT EVIDENCE, until this program''s own verifier accepts the bytes; NO RANK OVER
    Q IS ASSERTED ANYWHERE BY THIS GOAL. The task needs NETWORK OR RETRIEVAL PERMISSION to fetch the point
    list -- the batch that produced this decision was forbidden it -- and the fetched bytes must be archived
    under a content hash so the verification is replayable. It costs minutes once the points are in hand
    and is the only action in view that can SETTLE this goal rather than refine it, so every other queued
