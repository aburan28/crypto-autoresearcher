research_goal:
  id: GOAL-ECRANK-002
  title: Drive the certified rank-31 field degree below 16
  objective: 'GOAL-ECRANK-001 certified rank >= 31 over number fields of degree 16 and above and
    recorded exactly one open successor: whether degree 8 is reachable. DEC-20260822-5a5635 also
    named the binding constraint and measured it -- base rank over Q. The quadratic-twist search
    found NO twist of rank >= 5 in 364756 candidates and the small-coefficient enumeration found
    only 2 curves of rank 4 in 49692. This campaign attacks that constraint directly with a Mestre-style
    construction instead of a twist search, then re-runs the k = 3 and k = 4 optimisation. Either
    outcome is a result: a degree-8 certificate, or a measured ceiling saying what base rank degree
    8 would actually require.'
