    transition via Write, and the orchestrating session performs only the mechanical `git add`/`git commit`
    of exactly the paths the Coordinator declared. Authorship of state transitions stays with the Coordinator;
    only the shell call moves. Each archive receipt records this split explicitly so it is auditable and
    never mistaken for a worker committing to shared state.'
  next_action_superseded_20260905: 'ONE ACTION, and it is not another Mestre search. BATCH-e0caa5 is CLOSED by
    DEC-20260822-7d356e on evidence EV-ECRANK-6695dc; the goal stays `active`, C1 stays OPEN and C2 is
