    own input and the most optimistic is a sample-size artifact). NEXT: dispatch N1 of that decision --
    fetch the exhibited points of the externally reported rank >= 31 curve over Q and run this program''s
    OWN committed verifiers on them as a k = 0 configuration (V trivial, degree 1),
    experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py for the exact on-curve and non-torsion
    checks and regulator_check.py for a non-singular regulator, exactly as C1 specifies; then record in
