  # -------------------------------------------------------------------
  # WHAT BROKE
  # -------------------------------------------------------------------
  what_broke:
  - >-
    SEPARABILITY IS FALSE ON THE MEASURED DATA, by exhibited counterexample.
    Equal-max / different-total k = 3 sub-cosets are abundant: within
    cert_deg32_multiplicity at max = 3 the total takes 10, 12, 14, 16, 18; over
    the 651 multiplicity-objective rows `others` spans 6 to 17 on a mean of
    10.41, and its conditional mean rises 9.49 -> 10.70 -> 13.07 as the max goes
    2 -> 3 -> 4. This is the assumption H-ECRANK-f2a2f7 itself named as most
    likely to be wrong; the batch measured it rather than assuming it, and it
    came back false.
  - >-
    THE COSET RELATION IS A CONTROL THAT CANNOT FAIL. Label-shuffle null, 200
    trials, seed 20260904: pooled observed R^2 0.6682 against a null median
    0.6691; on the n_classes rows the shuffled statistic is IDENTICAL in 200 of
    200 trials; on the sum_mult rows the observed fit is WORSE than the null
    median. The cause is structural -- the k = 3 sub-coset enumeration is a
    2-design (constant pair co-occurrence 7 / 35 / 35 / 155), and a least-squares
    fit is a second-moment statistic -- so the relation CANNOT DETECT COSET
    STRUCTURE EVEN IN PRINCIPLE. The two figures 17.87 and 23.80 are a
    restatement of the histogram of per-class ranks under another name.
  - >-
    THE FITTED DATASET IS STRUCTURALLY UNLIKE THE POOL IT REASONS ABOUT. All
    12,431 fitted totals are EVEN (0 odd of 12,431) and the target 31 is ODD; the
    mechanism is an exact affine parity functional on each parent coset. NOT AN
    IMPOSSIBILITY RESULT ABOUT RANK 31: the committed 502-row scan contains 78
    curves with odd k3_mult. It upgrades the producer's own Limitation 4 from a
    caveat to a mechanism.
  - >-
    PSEUDO-REPLICATION AND NO HELD-OUT SET. The 12,431 rows are combinatorial
    re-uses of 152 per-class values on FOUR distinct base curves; 9,145 of them
    are the single repeated point (max, total) = (1, 8). Every fit is in-sample
    and no fit anywhere is evaluated on an object it did not see. The frontier
    fit is an order-statistic artifact (group sizes 1, 1, 497, 3; expected max of
    3 draws 16.91, not 20; jackknife swing 6.00-9.06).
  - >-
    THE CERTIFICATE-KIND AXIS IS ABSENT FROM EVERY TABLE. k3_cls = 8 for ALL 502
    curves, so the exact eigenspace ceiling at k = 3 is saturated everywhere: 8 of
    the fixture's 20 are exact and 12 are regulator-dependent, and a hypothetical
    degree-8 total of 31 or 32 would be 8 exact plus 23 or 24 regulator-dependent
    against a HELD degree-32 result that is 32 exact with no floating point.
    NOT VIOLATED in this batch -- no degree-8 result at 31 was produced and no
    improvement is claimed -- but UNMAINTAINED, which is how the violation would
    enter the next record.

