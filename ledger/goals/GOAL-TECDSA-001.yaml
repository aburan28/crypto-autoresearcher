  related_goals: [GOAL-ECDSA-001, GOAL-ROS-001, GOAL-WFS-001, GOAL-RSA-002]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "GG18/GG20-style and CGGMP-style threshold ECDSA over secp256k1 and NIST curves, at toy and standard parameters as separately declared"
    family: "multiparty ECDSA with Paillier or OT-based multiplication; range proofs and modulus well-formedness proofs"
    nist_track: adjacent_to_standardization
    standardization_status: >-
      RECALLED, UNVERIFIED: NIST has an active multi-party threshold
      cryptography effort. Threshold ECDSA itself is already deployed in custody
      and wallet infrastructure — the dangerous ordering, and the reason a
      certificate-backed fix map has value now rather than after a standard.
    why_this_scheme: >-
      The defect class is unusually well shaped for this harness: preconditions
      are named in the papers, a switchable reference implementation makes them
      enumerable, and the certificate is decisive — a recovered key produces a
      valid signature that any reader verifies. The session-count curve is the
      missing practical quantity. And the whole study runs on self-generated key
      material with no exposure to anyone's deployment.
  non_duplication:
    - >-
      GOAL-ECDSA-001 owns single-party ECDSA nonce leakage via lattice and
      Fourier methods. This goal's adversary is a protocol participant and no
      side-channel leakage is assumed anywhere. Distinct adversary, distinct
      mechanism; no transfer in either direction.
    - >-
      GOAL-ROS-001 owns concurrency failures in Schnorr-type protocols arising
      from linear nonce structure. This goal's failures come from auxiliary
      proofs about Paillier ciphertexts and ranges. Both produce certificates
      against reference implementations and must not share conclusions.
    - >-
      GOAL-RSA-002 owns Coppersmith-style partial-information attacks on RSA.
      Where an attack here concerns Paillier modulus structure, any
      lattice-method question is REFERRED to that goal rather than duplicated.
  completion_criteria:
    - >-
      A KEY-EXTRACTION CERTIFICATE PER PUBLISHED ATTACK CLASS against the
      reference implementation, each verified by producing a valid signature
      under the recovered key, checked by an independent verifier.
    - >-
      THE SESSION-COUNT CURVE for each attack as a function of its declared
      parameterization, with seeds and machine model recorded.
    - >-
      THE FIX MAP: each published countermeasure implemented, each attack re-run
      against it, and the outcome recorded per cell — including cells where the
      attack still succeeds and cells where the budget ran out, which are
      distinct outcomes and must not be merged.
    - >-
      A PROOF-SET COMPLETENESS STATEMENT: whether every enumerated precondition
      has a corresponding proof in each protocol version studied, with
      "undetermined" recorded as such.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificate reproduction, that every record names the exact proof
      set of the instantiation attacked, and that nothing is stated about any
      deployed system.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - The protocol specifications and the corresponding attack papers cannot be obtained in primary text after the declared source-preference order is exhausted. Reconstructing an attack from memory would put a false precondition into the fix map, which is worse than producing no map.
    - An attack exceeds the declared budget at every reachable parameterization. Budget outcome about an implementation, never evidence that a protocol version is secure (AGENTS.md rule 3).
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    BUILD THE SWITCHABLE REFERENCE IMPLEMENTATION AT TOY PARAMETERS FIRST, AND
    PROVE IT CORRECT BEFORE ATTACKING IT. A threshold ECDSA implementation whose
    honest path does not produce valid signatures will manufacture false
    "attacks" out of its own bugs — the dominant failure mode for this goal and
    the reason the honest-path test suite is a precondition rather than a
    formality. Get correct threshold signing at toy modulus and curve sizes,
    with every zero-knowledge proof independently switchable and parameterizable,
    and verify honest signatures against an independent verifier. Only then turn
    off the first proof. Acquisition runs in parallel and gates which attacks may
    be implemented at all. Claim tier: certificates against this program's own
    instantiations, labelled as such in every title; if any finding appears to
    affect a current published protocol version rather than a deliberately
    weakened instantiation, disclosure to the protocol authors precedes any
    publication and that precedence is recorded in the run package.
  owner: coordinator
