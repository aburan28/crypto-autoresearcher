research_goal:
  id: GOAL-TECDSA-001
  title: >-
    Threshold ECDSA: rebuild each published key-extraction class as a
    certificate against a switchable reference implementation, measure the
    session-count curve, and verify which fix removes which precondition
  objective: >-
    Threshold ECDSA reached production ahead of standardization and has a
    history of complete signing-key extraction from small omissions in auxiliary
    zero-knowledge proofs. The published attacks share a structure — a proof
    that is present in the paper and optional, weakened, or mis-parameterized in
    an instantiation — which makes them enumerable against a reference
    implementation whose every proof is independently switchable. For each
    published class, produce a KEY-EXTRACTION CERTIFICATE: the recovered signing
    key, verified by producing a valid signature under the honest verification
    equation. Measure the SESSION-COUNT CURVE for each attack as a function of
    its parameterization, since that curve, not the existence of the defect,
    decides practical reachability and is rarely published. Then re-run each
    attack against each published countermeasure and record which precondition
    is actually removed. Every certificate is against this program's own
    deliberately-instantiated code; no third-party wallet, custodian, library,
    service or chain is examined, probed, tested or named at any point.
  question_ids: [RQ-TECDSA-8d340d]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
