research_goal:
  id: GOAL-SNFS-001
  title: "SNFS: test the inherited claim that trapdoored primes are undetectable, using classes this program manufactures itself, and measure where SNFS actually beats GNFS"
  objective: >-
    Convert a negative detectability claim from something the field carries into
    something this program has measured. Generate honest and SNFS-trapdoored
    parameters at reachable sizes, matched on every public criterion a verifier
    applies, against a battery of candidate distinguishing statistics FROZEN
    BEFORE THE CLASSES EXIST; report separation or non-separation with decidable
    ground truth; and, if nothing separates, deliver a named obstruction
    explaining what the construction leaves invariant rather than a count of
    statistics tried. In parallel measure the SNFS/GNFS crossover on one
    implementation and one machine, since a trapdoor is only consequential where
    SNFS actually wins. Deliver a provenance-verifiability inventory of
    published fixed groups: re-derivable from a stated construction, or not. No
    kilobit computation is attempted, and no deployed parameter set is alleged
    to be trapdoored.
  question_ids: [RQ-SNFS-005666]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-RSA-001, GOAL-RSA-002, GOAL-ECTD-001, GOAL-SIMSPK-001]
  scheme_context:
    scheme: "Special number field sieve over integer moduli and prime-field DLP parameters"
    family: "NFS with a special polynomial; GNFS as the matched baseline"
    nist_track: not_a_nist_candidate
    standardization_status: >-
      Fixed prime-field groups persist in deployed protocols and long-lived
      configurations; the inventory of which published groups carry a
      re-derivable construction is not held by this program.
    why_this_scheme: >-
      The claim under test is negative — that a trapdoor cannot be seen — and
      negative claims are the ones that calcify. This program can test this one
      unusually well because BOTH CLASSES ARE MANUFACTURABLE: honest and
      trapdoored parameters can be generated here, so the experiment has
      decidable ground truth and a real null by construction. That is a
      methodological luxury this program almost never has, and it is exactly
      the setting where docs/inventor-protocol.md's controls-before-belief rule
      is cheap to satisfy completely.
  non_duplication:
    - >-
      GOAL-ECTD-001 owns ELLIPTIC-CURVE trapdoors — the Teske analogue via
      secret isogenies. This goal owns INTEGER AND PRIME-FIELD parameter
      structure. The two share a shape of question and no object; a batch here
      that finds itself reasoning about curves hands off rather than writing it.
    - >-
      GOAL-RSA-001 owns the GNFS cost model and its validation against the
      published record computations, and uses SNFS only as a control on that
      model. THIS GOAL OWNS SNFS AS AN OBJECT: the crossover measurement and
      the trapdoor construction. Neither restates the other's result, and the
      crossover measurement here binds to GOAL-RSA-001's charging convention.
    - >-
      GOAL-RSA-002 owns structured primes as a LEAKAGE SETTING where the
      structure is known to the campaign by construction. Any claim about
      whether that structure is DETECTABLE from public data belongs here.
    - >-
      GOAL-SIMSPK-001 asks a structurally similar question about symmetric
      design parameters and is bound by the same prohibition on statements
      about intent. The two goals must not be summarised together into a
      cross-primitive claim about trapdoors; they share a discipline, not a
      thesis.
  completion_criteria:
    - >-
      A DETECTABILITY RESULT with decidable ground truth: honest and trapdoored
      classes generated at named reachable sizes and matched on the public
      criteria, scored against a statistic battery demonstrably frozen before
      generation, reporting separation or non-separation per statistic. A
      measured non-separation is a complete result and satisfies this criterion.
    - >-
      IF NON-SEPARATION IS THE OUTCOME, A NAMED OBSTRUCTION: what the
      construction leaves invariant, why the public checks are blind to it, and
      what would have to change for a check to see it. A count of statistics
      tried without this is a fatigue report and is recorded as `unverified`.
    - >-
      A MEASURED CROSSOVER: SNFS against GNFS on one implementation and one
      machine across a declared size and polynomial-degree grid, with memory
      beside time in GOAL-RSA-001's convention, stating where the special
      structure begins to pay.
    - >-
      A PROVENANCE-VERIFIABILITY INVENTORY of published fixed groups: for each,
      whether a stated derivation exists and whether this program re-derived the
      published value from it, with failures recorded as this program's failure
      to re-derive and never as an allegation.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions. THE
      RED TEAM IS SPECIFICALLY CHARGED with checking the freeze order of the
      statistic battery and that no record drifts toward attributing intent.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, scoped to the sizes,
      constructions, and statistics actually run.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      The kilobit hidden-SNFS paper and the parameter-validation literature
      cannot be obtained in primary text under the network policy after the
      declared source-preference order is exhausted. The trapdoor construction
      is not reimplemented from a remembered description.
    - >-
      Matched SNFS/GNFS runs at the declared grid exceed the campaign budget
      after cheaper falsification gates are exhausted. This is a budget outcome
      about an implementation and is never evidence about detectability
      (AGENTS.md rule 3).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Acquisition first: file the hidden-SNFS construction and the parameter-
    validation literature as KN-LIT from primary text. THEN FREEZE THE STATISTIC
    BATTERY AND COMMIT IT BEFORE GENERATING A SINGLE PRIME. This ordering is the
    whole experiment: a battery chosen after the classes exist can be tuned,
    consciously or not, until something separates, and no amount of later
    analysis can undo that. Commit the frozen battery with its own hash, then
    generate. START WITH THE CROSSOVER MEASUREMENT IN PARALLEL, not after: it is
    the cheaper deliverable, it needs no trapdoor construction at all, and it
    determines whether the detectability question is consequential at the sizes
    this program can reach. Claim tier: a detectability statement scoped to the
    sizes and statistics run, and a reproducibility inventory. NO RECORD MAY
    ALLEGE THAT ANY REAL PARAMETER SET IS TRAPDOORED OR ATTRIBUTE INTENT TO ANY
    PARTY, whatever the measurement shows.
  owner: coordinator
