research_goal:
  id: GOAL-FRODO-001
  title: "FrodoKEM: do the published Renyi divergence and decryption failure rate reproduce under exact recomputation at the standardized parameter sets?"
  objective: >-
    Take the one lane in this program where cryptographic parameters are
    directly reachable and use it. FrodoKEM's security argument passes through
    two quantities that are finite exact computations at Frodo-640/976/1344:
    the Renyi divergence between its tabulated error distribution and the
    rounded Gaussian it approximates, and its decryption failure rate.
    Independently re-derive both in exact rational arithmetic from primary
    text, audit the conversion of the divergence bound into a bit-security
    loss once the adversary's sample count is charged, and cost what any
    discrepancy in the failure rate is worth under published failure-boosting
    models — with mutation and null-object controls established BEFORE any
    agreement is reported as a verification.
  question_ids: [RQ-FRODO-3260cc]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  related_goals: [GOAL-MLKEM-003, GOAL-MLKEM-004, GOAL-HQC-001]
  scheme_context:
    scheme: "FrodoKEM (Frodo-640, Frodo-976, Frodo-1344)"
    family: "unstructured (plain) LWE KEM, IND-CCA via Fujisaki-Okamoto"
    nist_track: not_a_nist_selection
    standardization_status: >-
      ISO/CFRG track rather than a NIST selection: a standard proposal is
      published at frodokem.org and an IETF CFRG draft exists. Positioned as
      the conservative unstructured-lattice alternative to ML-KEM and
      recommended as such by several European agencies. UNVERIFIED by this
      program; see RQ-FRODO-3260cc.provenance.
    why_this_scheme: >-
      Reachability, not prominence. This is the rare target whose load-bearing
      quantities can be checked AT the standardized parameters instead of at
      toy scale, because the error distribution has support |z| <= 12 and the
      failure rate is a convolution over it. The claim tier available here is
      therefore higher than this program usually gets, for the arithmetic
      claim only.
  non_duplication:
    - >-
      The lattice-estimator lane is NOT this goal's. GOAL-MLKEM-003 and
      GOAL-MLKEM-004 own core-SVP conventions and memory-charged sieve cost.
      This goal does not re-estimate LWE hardness at Frodo's dimensions and
      makes no claim about it; if a batch finds itself deriving a sieve cost
      it has left its lane and must hand off.
    - >-
      Implementation attacks are out of scope under AGENTS.md rule 7:
      KN-LIT-2088 (FO timing), KN-LIT-3859 (fault injection on the FO
      equality test), KN-LIT-118 and KN-TECH-047 (hint-integrated primal
      attacks). Those results are about implementations; this goal is about
      the numbers in the document.
    - >-
      GOAL-HQC-001 is cited for METHOD, not scope: its BATCH-001/002 sequence
      established the acquire-then-file-then-design ordering and the exact
      rational recomputation discipline that this goal adopts, and its RS-S3
      finding is the precedent that a printed number in a standardization
      document can be wrong.
  completion_criteria:
    - >-
      An independent exact-rational recomputation, from primary text, of the
      Renyi divergence between the published sampling table and the rounded
      Gaussian at the stated order for each of Frodo-640/976/1344, and of the
      decryption failure rate for each, each reported as reproduced or as a
      stated discrepancy with its size; accompanied by a mutation control
      demonstrating the pipeline detects a seeded perturbation of comparable
      magnitude, and a null-object control on a distribution with a
      closed-form answer.
    - >-
      An audit of the divergence-to-bit-security conversion that states
      explicitly how the loss scales with the number of samples an adversary
      consumes, what sample count the published Renyi order corresponds to,
      and what the security claim becomes at sample counts above it.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and computation actually performed, and with
      the arithmetic claim and any security claim recorded at separate tiers.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      Neither the FrodoKEM specification nor the primary divergence and
      failure-rate analyses can be obtained under the network policy after the
      declared source-preference order is exhausted.
    - >-
      The exact convolution at Frodo's true dimensions exceeds the declared
      campaign budget after cheaper falsification gates — mutation control,
      reduced-dimension reproduction, interval-arithmetic bracketing — are
      exhausted. Note this is a budget outcome about a computation, never
      evidence about the number being computed (AGENTS.md rule 5).
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    THE SOURCE GATE IS SHUT AND MUST BE OPENED FIRST. Do not run
    /propose-ideas yet: RQ-FRODO-3260cc.constraints[0] forbids designing an
    experiment before the primary sources are filed, and every figure this
    goal names was read from a visibly extraction-damaged search excerpt. The
    first batch acquires the FrodoKEM specification and the primary
    Renyi-divergence and decryption-failure analyses, files them as KN-LIT
    entries at stated provenance levels with extraction damage marked, and
    transcribes the two computations with numbered assumptions — the
    GOAL-HQC-001 BATCH-001/002 sequence, whose lesson was that acquisition
    does not discharge filing. ONLY THEN design the recomputation, and design
    the MUTATION CONTROL BEFORE THE RECOMPUTATION: a pipeline that has not
    been shown to detect a seeded one-unit table perturbation cannot report
    agreement as a verification. Claim tier is split by
    RQ-FRODO-3260cc.scope.claim_tier_ceiling — crypto for the arithmetic
    claim, nothing above toy for any security reading — and a batch that
    blurs the two has failed regardless of what it computed.
