  related_goals: [GOAL-SSI-001, GOAL-SSIQ-001, GOAL-P13-001, GOAL-QRE-001, GOAL-CLGRP-001]
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "CSIDH-512 and larger CSIDH parameter proposals; CSI-FiSh and SeaSign as dependent constructions"
    family: "commutative supersingular isogeny group actions; abelian hidden shift"
    nist_track: not_standardized
    standardization_status: >-
      RECALLED, UNVERIFIED: not standardized and not a NIST finalist. It remains
      the principal candidate for post-quantum NON-INTERACTIVE key exchange, a
      functionality the standardized set does not offer — so the parameter
      dispute is a dispute about whether that functionality exists at all.
    why_this_scheme: >-
      A parameter set with a dozens-of-bits spread in published quantum security
      estimates is a rare and tractable object: the disagreement is between
      explicit models, so it must reduce to quantities that can be named and
      compared. The reversible group-action cost is additionally a classical
      computation this program can contribute regardless of who is right, and
      the same Kuperberg-cost questions recur for every abelian-hidden-shift
      proposal, so the reconstruction has value beyond CSIDH.
  non_duplication:
    - >-
      GOAL-SSI-001, GOAL-SSIQ-001 and GOAL-P13-001 own SUPERSINGULAR ISOGENY
      PATH-FINDING in the full (non-commutative) setting after the SIDH break.
      CSIDH's security rests on a commutative group action and an entirely
      different quantum algorithm; neither lane's results transfer, and neither
      may cite the other's cost figures.
    - >-
      GOAL-QRE-001 owns Shor-type costing under surface-code fault tolerance.
      This goal owns Kuperberg-type costing for a group action. Shared
      reconstruction TOOLING is admissible; shared numbers are not.
    - >-
      GOAL-CLGRP-001 owns class groups of imaginary quadratic fields as
      hidden-order groups for VDFs. This goal touches class groups only as the
      acting group of an isogeny action; the objects coincide and the questions
      do not, and cross-citation of conclusions is prohibited.
  completion_criteria:
    - >-
      A PARAMETERIZED COST FUNCTION in which each published analysis is a named
      switch setting, with each published figure reproduced from its own
      assumptions or a reported reproduction failure carrying the discrepancy
      and the undetermined inputs.
    - >-
      THE DISAGREEMENT KERNEL: the minimal set of quantities whose values decide
      the outcome, demonstrated by holding all others fixed, or an explicit
      demonstration that the disagreement does not so reduce.
    - >-
      A REVERSIBLE GATE COUNT for group-action evaluation at deployed
      parameters, with gate set and memory model named, validated by classical
      simulation of the same circuit at small parameters.
    - >-
      CERTIFIED CLASS GROUP STRUCTURE at small CSIDH-like parameters as
      calibration, re-verified independently.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      specifically checking that no researcher's position is characterized beyond
      filed primary text and that no verdict on CSIDH's security level appears
      anywhere in the package.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry
      committed through a verified ledger archive.
  pause_conditions:
    - The five-batch campaign budget is exhausted without an admissible next mechanism.
    - Fewer than three primary analyses spanning the dispute can be obtained in primary text after the declared source-preference order is exhausted; a reconstruction with one side missing would misrepresent the disagreement and must not be attempted.
    - A definitive infrastructure, authentication or dependency blocker prevents the next approved task.
  next_action: >-
    BUILD THE REVERSIBLE GROUP-ACTION CIRCUIT FIRST. It is the one input every
    model multiplies by, it is classical, it needs no acquisition, and its gate
    count is checkable by simulating the circuit at small parameters against a
    direct implementation of the action. Producing it early means that when the
    three analyses land, this program is comparing them with its own number in
    hand rather than adopting one paper's figure to evaluate another's. Do NOT
    begin by tabulating who claims what: characterizing positions from memory is
    the specific failure mode this goal is most exposed to, and the constraint
    against it binds from the first record. Claim tier: model reconstruction and
    classical gate counting; no adjudication, no verdict, no quantum computation.
  owner: coordinator
