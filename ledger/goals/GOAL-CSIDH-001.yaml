research_goal:
  id: GOAL-CSIDH-001
  title: >-
    CSIDH's disputed quantum security: reconstruct every published cost model
    over one parameterization, isolate the disagreement kernel, and compute the
    classical part nobody disputes
  objective: >-
    CSIDH-512's published quantum security estimates differ by dozens of bits
    between careful analyses, which means the disagreement must reduce to
    identifiable quantities. Build one parameterized cost function in which each
    published analysis is a setting of named switches — oracle cost model,
    quantum memory model, Kuperberg variant and parameters, reversible cost of
    the group action, depth limits — and reproduce each published figure FROM ITS
    OWN SWITCH SETTING before commenting on any of them. The deliverable is the
    DISAGREEMENT KERNEL: the minimal set of quantities whose values decide the
    answer, or a demonstration that no such short list exists. Alongside it,
    compute the part that is not in dispute and that this program can do
    exactly: a concrete reversible-circuit gate count for evaluating the class
    group action at the deployed parameters, validated by classical simulation,
    plus certified class group structure computations at small parameters as
    calibration. This goal does not adjudicate the dispute and may not record a
    verdict on CSIDH's security level.
  question_ids: [RQ-CSIDH-64343f]
  active_hypothesis_ids: []
  status: draft
