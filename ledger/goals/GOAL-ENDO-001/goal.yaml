# Sharded goal record (tools/shard_goal.py layout). The mutable head lives
# here; the checkpoint log lives one-file-per-batch under checkpoints/ so a
# batch close in another worktree does not conflict with this file.
research_goal:
  id: GOAL-ENDO-001
  title: >-
    Resource-labelled subproblem decomposition of prime-field ECDLP, centred on
    endomorphisms, isogenous curves, and j-invariant structure
  objective: >-
    Partition prime-field ECDLP into subproblems each labelled by the exact
    non-generic resource it must consume, and attack every subproblem with
    falsifiable, null-controlled experiments. The campaign's organising question
    is the one the parent goal has not asked: the ECDLP transports exactly along
    any F_p-isogeny of degree coprime to N (transport theorem T1), so ECDLP
    difficulty is an isogeny-class invariant up to transport cost, and the whole
    class falls if any curve in it does. The campaign therefore measures whether
    any attack-cost functional is NON-constant across an isogeny class, whether
    a minimiser is reachable, and whether endomorphism-ring depth, j-invariant
    special structure, or CM discriminant size changes anything beyond the known
    sqrt(|Aut|) automorphism-quotient constant. A clean negative carrying a
    named obstruction is an accepted and intended deliverable; a count of
    screened-and-rejected mechanisms is not.
  question_ids:
  - RQ-ICINV-475b5e
  - RQ-VOLC-f6253b
