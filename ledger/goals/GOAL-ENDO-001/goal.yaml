  active_hypothesis_note_20260807_open: >-
    OPENED 2026-08-07 AT BATCH-cb71b5. active_hypothesis_ids IS DELIBERATELY EMPTY AND NO
    HYPOTHESIS STATUS IS CHANGED ANYWHERE BY THE CREATION OF THIS GOAL. This campaign
