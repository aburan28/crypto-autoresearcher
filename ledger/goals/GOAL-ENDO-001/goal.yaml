  - >-
    P1. The instrument fails its RQ-INSTR-f8faa0 two-directional control. Measurement stops
    until the instrument is repaired under a new contract; existing measurements taken with
    the failed instrument are marked attempted_and_inconclusive, never negative evidence.
  - >-
