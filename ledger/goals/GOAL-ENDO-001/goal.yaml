  completion_criteria:
  - >-
    C1. For every one of the fourteen lanes, either an archived experiment contract with an
    executed, independently reviewed run, or an archived decision recording why the lane is
    closed that names an obstruction, an argument, and concrete forward guidance. A count of
    screened-and-rejected mechanisms does not satisfy C1 (docs/inventor-protocol.md closure
    standard).
  - >-
    C2. RQ-ICINV-475b5e, the gating lane, is adjudicated: either the within-class variance of
    at least one attack-cost functional exceeds its matched null with the reachability gate T5
    addressed, or the isogeny-class invariance of the measured functionals is recorded as a
    scoped negative with its obstruction named and its test boundary stated.
  - >-
    C3. Every oracle class invented by any lane has been passed through RQ-GGMB-6eaabc and is
    recorded as simulable (hence closed at exponent 1/2) or non-simulable with an explicit
    argument.
  - >-
    C4. Every instrument used to support any conclusion has passed both directions of its
    RQ-INSTR-f8faa0 control: it detects a planted signal and it rejects a matched null.
