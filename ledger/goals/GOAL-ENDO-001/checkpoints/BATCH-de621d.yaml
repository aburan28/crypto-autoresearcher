    THE L9 CLOSURE'S STATED LOAD-BEARING ARGUMENT. The norm-form gap
    N(alpha) >= |D_E|/4 is a property of the PRINCIPAL CLASS, not of the ORDER:
    a rank-1 projective O-module is an ideal class whose Z-lattice has
    successive-minima ratio c/a_Q of that class's reduced form, and for balanced
    classes that ratio is O(1) at arbitrarily large |D_E|. Reproduced by
    enumerating all reduced forms: 44%, 49%, 62% and 53% of classes at
    D = -2003, -10007, -100003 and -1000003 have c/a <= 4, with observed minima
    1.42, 1.04, 1.15 and 1.03, against Lemma-1 gaps tabulated as 501, 2502,
    25001 and 250001. What actually holds the lane closed is EXP-CANL-1064e0's
    target-independence bound Pr[Q in red(S)] <= |S|/N together with the
    constancy of C_0 and r (G6, which the decision's revisit condition omits).
    The conclusion survives -- the escape is the same Theta(C_0^2)-per-slot
    constant, so the exponent stays 1 against rho's 1/2 (CORR-20260810-930c42).
