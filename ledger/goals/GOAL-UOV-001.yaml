research_goal:
  id: GOAL-UOV-001
  title: "UOV: measured calibration of the plain-UOV security model that three other candidates depend on"
  objective: >-
    Put the plain-UOV concrete security model on measured footing rather
    than quoted asymptotics — anchoring the intersection-attack
    complexity with certified toy recoveries and a solving-degree
    census, stating every extrapolation step as a numbered heuristic —
    and determine whether the compressed-key variants preserve the
    model. The output is the shared baseline for the MAYO, QR-UOV, and
    SNOVA goals.
  question_ids: [RQ-UOV-001]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 6
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  scheme_context:
    scheme: "UOV"
    family: "multivariate (foundational Unbalanced Oil and Vinegar)"
    nist_round: 3
    advanced_on: '2026-05-14'
    round3_tweaks_due: '2026-08-14'
  completion_criteria:
    - >-
      A measured solving-degree law with certified toy key recoveries,
      yielding a plain-UOV cost model whose extrapolation to Round-3
      parameters is stated conditionally on numbered heuristics,
      together with an explicit finding on whether key compression
      alters it — or a charged attack that beats the published model at
      a named parameter set.
    - >-
      Independent Validator and Red Team sessions admit the run package,
      verifying certificates, the matched baseline, scope, and the absence of
      uncharged preprocessing, memory, oracle, or randomness assumptions.
    - >-
      Coordinator evidence, decision, and any warranted knowledge entry are
      committed through a verified ledger archive, with the conclusion scoped
      to the exact parameter sets and solver actually tested.
  pause_conditions:
    - The six-batch campaign budget is exhausted without an admissible next mechanism.
    - >-
      No UOV Round-3 specification can be obtained under the network
      policy after the declared source-preference order is exhausted.
    - >-
      The decisive computation exceeds the declared campaign budget after
      cheaper falsification gates are exhausted.
    - A definitive infrastructure, authentication, or dependency blocker prevents the next approved task.
  next_action: >-
    Run /propose-ideas RQ-UOV-001 first among the multivariate goals:
    GOAL-MAYO-001, GOAL-QRUOV-001, and GOAL-SNOVA-001 all consume this
    baseline, and three independently derived UOV cost conventions would
    make their Pareto comparisons meaningless.
  owner: coordinator
  created_at: '2026-07-29'
  updated_at: '2026-07-29'
