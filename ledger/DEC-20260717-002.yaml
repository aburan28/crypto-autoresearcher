coordinator_decision:
  id: DEC-20260717-002
  context: >-
    REVIEW-H100-20260717 section 4 found that no HYPOTHESES_100 entry tagged
    PRE-REG meets the frozen-protocol contract of docs/task-lifecycle.md
    section 4 (inputs, controls, independent variables, metrics, replication,
    budget, stopping/invalidation rules, frozen criteria, artifacts). Five
    priority items have now been generated to contract grade with handoff
    envelopes and are approved for execution.
  decision: approve
  target_ids: [RQ-DREG-001, H-DREG-001, EXP-DREG-001, RQ-R6-001, H-R6-001,
    EXP-R6-001, RQ-ICI-001, H-ICI-001, EXP-ICI-001, RQ-SIG-001, H-SIG-001,
    EXP-SIG-001, RQ-FB3-001, H-FB3-001, EXP-FB3-001]
  rationale:
    - "EXP-DREG-001 (H011+H012 / T2+T10) is the honest ledger's D6 — 'the one
       experiment that could falsify the core' — and correction C1 shows the
       past-wall null is currently unmeasured by any valid instrument. Its
       instrument-validation gate (three exact anchors: 69,073 at n=15; 143,882
       at n=18 by two engines; null==pred at n<=15) makes any past-wall number
       trustworthy before it exists."
    - "EXP-R6-001 (H009 / T1) is the residual of the R6 wall and the only
       configuration (arbitrary explicit birthday base) not covered by prior
       kills; the four mandatory controls (rho on same instances, matched
       random curve, same-order isogenous curve, T11 null) are pre-registered."
    - "EXP-ICI-001 (H014 / T12+T23) puts CI backing under every 'loses by 2^k'
       statement and under the H096 gate."
    - "EXP-SIG-001 (H013, absorbing T3/T5) implements the recovered Yokoyama
       object the honest ledger re-opened, with a Koszul-validation gate; it is
       two-sided (null closes D5 with the correct object)."
    - "EXP-FB3-001 (H004+H018-H022 batched) retires the F3 family with
       family-wise Holm statistics and a mandatory growth clause in the WIN
       criterion, fixing the multiple-comparison exposure the honest ledger
       flagged and the constant-vs-growing ambiguity that H028/H032 died on."
  evidence_refs: [REVIEW-H100-20260717, AUTOLAB_TASKS (T1, T2, T3, T5, T10,
    T12, T23), EC_SIEVE_HONEST_LEDGER (D5, D6 sections)]
  limitations:
    - "Approval is protocol approval, not a prior: by the framework's own bar
       the expected outcome of the in-bar experiments is further scoped KILLs."
    - "All five are toy-scale; no outcome may be presented as crypto-scale
       (AGENTS rule 7)."
    - "EXP-R6-001 and the H096 gate additionally depend on the P0 anchors
       (H095/T24 large arm, H097 null regression) which are NOT yet contracted;
       they remain queued, not approved."
  next_actions:
    - "Executor picks up handoffs in order TASK-20260717-001 (DREG, unblocks
       others), -002 (R6), -003 (ICI), -004 (SIG), -005 (FB3)."
    - "Coordinator to contract the P0 anchors (H095, H097) and the H098
       artifact-debt task next; H096 remains gated on EXP-R6-001 +
       EXP-DREG-001 + EXP-ICI-001 outputs."
    - "Any protocol change after this approval requires a versioned amendment
       per docs/task-lifecycle.md; confirmatory status resets if criteria move."
  decided_by: coordinator
  decided_at: "2026-07-17"
