hypothesis:
  id: H-INCB-001
  question_id: RQ-INCB-001
  statement: "Factor-base chord arrangements on E(F_p) exhibit a richness-profile excess over matched random line/point arrangements that is detectable as a fitted richness exponent separated by > 3 standard errors at all three toy sizes p in {211, 1009, 4099}; absence of such separation certifies the generic ceiling at the tested scale and caps A2-class chord-harvesting relation supply."
  mechanism: "EC chord lines are an algebraically structured, non-generic family (each line determined by two curve points; every chord meets the curve in a third point), which could either densify the rich-line tail (excess, opening for A2) or sit exactly at the generic Stevens-de-Zeeuw/Vinh-type ceiling (barrier)."
  assumptions:
    - "FB = x-set semantics as in A2 (point set = all lifts, M = 2B)"
    - "arrangement = all lines through distinct point pairs"
    - "fitted exponent = -OLS slope of log c_r vs log r over support {r >= 2 : c_r > 0}"
  predictions:
    - metric: "cell separation z = |mean_tau_ec - mean_tau_random| / sqrt(se_ec^2 + se_random^2)"
      direction: different
      minimum_effect: "> 3 at all three sizes p (either direction; candidate gate)"
    - metric: "excess ratio mean c_3 EC / random"
      direction: higher
      minimum_effect: "> 1 materially, if the excess mechanism is real"
  test_boundary:
    instances: [one seeded ordinary curve per prime, 6 seeds 20260717..20260722, "B grid round(n^1/4)/round(n^1/3)/round(n^2/5) with B >= 8"]
    parameters: {p: [211, 1009, 4099], controls: [matched-M uniform random point sets (negative null), deterministic integer-grid sets (positive sensitivity)]}
    implementation: experiments/EXP-INCB-001/incbarrier1_richness.sage
    budget: {wall_clock_seconds: 2400, maximum_runs: 8, per-invocation kill: 600 s}
  falsification_conditions:
    - "z <= 3 (or not computable for lack of rich lines) at one or more of the three sizes, with controls passing: no measured curve-specific richness excess at the tested scale"
  interpretation_limits:
    - "toy fields only; richness mass concentrated at r in {2,3} so the exponent fit is noise-dominated at small cells"
    - "a null result closes only the tested scope; the candidate's alternative gate path (a proved bound) is untouched by this measurement"
  status: supported
  proposed_by: coordinator-research-director
