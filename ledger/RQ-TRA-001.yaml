research_question:
  id: TRA-RQ-001
  title: Can the leading spectrum of a coarse-grained (Markov) transfer operator of the translation-by-P walk on E(F_p), estimated from sub-birthday samples, localize k into an interval shrinkable below sqrt(n) total cost?
  scope: {curve_families: [ordinary prime-field short-Weierstrass, prime-order subgroup], field_types: [F_p], bit_sizes: ["toy p in {211,1009,4099}"], methods: [Koopman/Ruelle transfer operator, Markov coarse-graining, spectral phase readout, BSGS finish]}
  motivation: Candidate C1 (research_directions_20260717.md). No ledger entry touches operator spectra; the new mathematical operation is Markov coarse-grained spectral inversion. Character orthogonality predicts L = O(1); the experiment measures L(S, C) directly and, if negative, archives a barrier measurement with the fitted law.
  decision_target: Whether spectral phase information from the coarse translation operator yields localization L >= n^0.05 at S <= n^0.3 sustained across three sizes (promotion gate), or a measured barrier law.
  constraints: [no factor base (direct-solver candidate), charged cost must include sampling + spectral + finish, toy scale is not crypto scale]
  status: active
  owner: coordinator
