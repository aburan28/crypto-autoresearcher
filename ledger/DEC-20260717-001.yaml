coordinator_decision:
  id: DEC-20260717-001
  context: >-
    Coordinator review REVIEW-H100-20260717 re-verified all 14 artifact-cited
    measured claims of HYPOTHESES_100 against the staged result JSONs
    (inputs/h100_session/). Ten claims verified exactly; four are partially
    supported and require correction records (AGENTS rule 4: results are
    immutable, corrections create new records). The audit also found one
    dependency closure missed by the session and several tag-vocabulary issues.
  decision: revise
  target_ids:
    - "HYPOTHESES_100: H002, H012, H016, H023, H032, H040, H041, H065, H067,
       H075, H090, H098, H100"
  rationale:
    - "C1 (H012): the claim 'n=17 null D=5 126,922 == pred, first direct null
       measurement past n=15' is NOT evidenced in the artifacts — 126,922 appears
       only as runs[0].sr_pred_D (the prediction); the measured n=17 ranks are
       108,392 / 99,071 from subset runs that finding (iv) itself declares
       invalid for sem, and no null-arm rank key exists in either n=17 file.
       Corrected to 'prediction only; past-wall null unmeasured by any valid
       instrument' — this RAISES the priority of EXP-DREG-001."
    - "C2 (H067): the quoted delta = 0.000 +/- 0.001 is the null-SUBTRACTED
       convention; raw r=4 delta_mm = 0.0054/0.0106 bits is significantly above
       cyclic and is erased only by the equally large permutation null. KILL
       stands (transfer retention 0.32 < 0.5, negative slope), but the record
       must state the convention. '100-rep permutation null' is not recorded in
       the artifact (only perm_null_mean/std/p95); xor_positive_control_ok =
       false at r=4 is an unexplained flag anomaly to disclose."
    - "C3 (H023): at the largest config (N=21,341, B=28) two proxies sit
       marginally OUTSIDE the 100-permutation band (nuclear_over_fro 2.6677 vs
       <=2.6598; cp_relres_r8 0.4868 vs <=0.4851; flags.any_outside=true) —
       omitted from the ledger. KILL direction stands; one confirmation run at
       larger B is owed before the family is called closed."
    - "C4 (H016): small-multiples coverable fractions are 0.5/0.375/0.25/0.0%
       (recomputed from counts arrays), not '0.1-0.4%'; also omitted: curve 1017
       shows 272 decompositions piled onto 2 targets (concentration, not
       coverage). QR-arm numbers verify exactly."
    - "C5 (H040): negation constants 0.949/0.943 are conditional-on-success
       (17/200 and 29/200 escape_overflow runs excluded); censoring must be
       disclosed in the ledger line."
    - "C6 (H002): against its frozen pre-reg ('WIN: lower solving degree'),
       the outcome is NOT a win — solving degree unchanged; the wall-time gain
       is formulation quality on a non-pre-registered metric (criterion drift).
       '~10x/doubling both arms' is asserted only for the original arm; the
       |F|=64 original cell was skipped."
    - "C7 (H032): fitted shrink-exponent range is -0.69..-1.09, not '-0.7..-0.97'."
    - "C8 (H041): 2.30/3.22 sqrt(N) is 1.83x-2.57x the 1.2533 baseline, not '~2x'."
    - "H065 is contingent on H032, which is killed: leaving it PRE-REG
       contradicts the session's own logic. Closed as rejected_scoped
       (superseded by H032's kill)."
    - "H090 is a roll-up of H039/H042, not independent evidence; re-tagged to
       cite those artifacts. H100 is a summary sentinel, excluded from counts.
       H075's argument is not yet written down — split to 'argued, write-up
       owed'. H098 (DONE) has no persistent artifact — re-opened as artifact
       debt (the session's own T18 principle)."
  evidence_refs:
    - REVIEW-H100-20260717
    - "inputs/h100_session/: h002_symmetrized_gb.json, h012b_denseT_n15/n15f/
       n17/n17r/n18.json, h012_peel_rank_n18.json, h016_base_yield.json,
       h023_tensor_rank.json, h028_fourier_decomp.json, h032_pair_mi.json,
       h033_psid.json, h039_walk_corr.json, h039_diag.json, h040_rho_const.json,
       h041_xonly_walk.json, h042_doubling_orbits.json, h067_predicate_channel.json,
       h074_relation_degree.json, h010_defectB_adversarial.json"
  limitations:
    - "Corrections amend the RECORD of the session's claims; the underlying
       immutable artifacts are untouched (AGENTS rule 4)."
    - "No KILL direction was reversed; all corrections are quantification,
       framing, or disclosure. The session aggregate (0 sub-rho survivors in 14
       measured) stands."
    - "Staged copies were audited; if the session holds additional unstaged
       artifacts (e.g. a genuine n=17 null rank), C1 should be revisited with
       the artifact cited explicitly."
  next_actions:
    - "Apply corrections C1-C8 to the session ledger as new correction records
       referencing this DEC (do not edit the original JSONs or ledger lines)."
    - "Close H065 as rejected_scoped (superseded by H032)."
    - "Re-tag H090 (roll-up), H075 (argued, write-up owed), H100 (sentinel)."
    - "Re-open H098 as artifact debt: persist h098_holm_ledger.py + aggregate
       JSON before the DONE tag is restored."
    - "Add the H023 larger-B confirmation cell to the EXP-FB3-001-era queue."
  decided_by: coordinator
  decided_at: "2026-07-17"
