hypothesis:
  id: H-TTN-001
  question_id: RQ-TTN-001
  statement: The recursive Semaev tensor S_m, read as a tree tensor network whose bonds are the eliminated resultant variables, has bond ranks chi that grow polynomially (exponent < 1 in d = 2^(m-2)) at recall >= 0.99 for contraction-based relation counting, so rank-chi-truncated contraction costs poly(chi)*tree-size and beats the 1.979 dense composed-resultant exponent (MX-1478) with margin.
  mechanism: Sylvester-determinant structure of each resultant makes every bond flattening a short sum of products of leaf coefficient-polynomials, so exact F_p bond rank may be far below the full flattening dimension; if that rank grows slowly, never-materializing dense S_m converts relation counting/enumeration into poly(chi) contraction with exact output verification (truncation loses recall only, never precision).
  assumptions:
    - "exact rank-revealing truncation over F_p is a meaningful stand-in for norm-based truncation (no norm over F_p; recall is measured empirically)"
    - "bond ranks of the Semaev recursion tensor had never been measured, generic or otherwise"
  predictions:
    - {metric: "chi(m, log q) growth exponent at recall >= 0.99", direction: lower, minimum_effect: "exponent < 1 across three sizes, beating 1.979 with margin"}
  test_boundary:
    instances: ["p in {101, 431, 1009}", "m in {3, 4, 5}", "3 seeds {20260717..20260719}", "seeded ordinary short-Weierstrass curves", "EC x-coord factor bases |FB| = 24/14/9"]
    parameters: {bonds: "balanced recursion-tree splits", truncation: "deterministic prefix-CUR over F_p", recall_target: 0.99}
    implementation: experiments/EXP-TTN-001/ttn1_semaev_contraction.sage
    budget: {wall_clock_seconds: 2400, maximum_runs: 8, per_invocation_cap_seconds: 600}
  falsification_conditions:
    - "measured chi(m) fit exponent >= 1.9 (disproof track), or exhibition of a full-rank bond slice family"
    - "promotion gate fails if exponent >= 1 at recall >= 0.99 (correctness alone is not the gate)"
  interpretation_limits:
    - "toy primes <= 2^10, m <= 5: window slopes, not asymptotics; toy evidence is never crypto-scale validation"
    - "negative results close only the tested scope (this truncation rule, these sizes, FB-grid counting recall)"
    - "a timeout/crash is not evidence"
  status: rejected_scoped
  proposed_by: coordinator-research-director
