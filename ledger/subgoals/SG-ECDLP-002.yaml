subgoal:
  id: SG-ECDLP-002
  question_id: RQ-ECDLP-002
  title: >-
    Isogeny-transfer attack paths: can ordinary isogenies connect generic
    curves to special families with charged cost below matched rho?
  mechanism: >-
    Special-curve ECDLP algorithms (Smart–Araki–Satoh–Semaev anomalous; MOV;
    GHS Weil descent) beat rho only on sparse families. An isogeny is a group
    homomorphism on the N-primary part when deg is coprime to N, so logs
    transfer as log_E(Q) = log_{E'}(phi(Q)) * (deg-scaling). The bottleneck is
    finding a short path in the ordinary isogeny graph to a weak j-invariant.
    This subgoal installs a charged cost gate: measure path-finding cost
    against matched rho before any special-curve algorithm is credited as a
    generic-curve attack.
  status: paused
  status_history:
    - status: active
      decision_id: DEC-20260731-023
      decided_at: '2026-07-31'
      reason: >-
        Opened as part of RQ-ECDLP-002 investigation. H-IT-001 specified as the
        primary hypothesis for ordinary isogeny transfer to special families.
    - status: paused
      decision_id: DEC-20260808-86ec3c
      decided_at: '2026-08-08'
      reason: >-
        BATCH-d8bb19 theoretical analysis (EV-ECDLP-b3e847) established four
        obstructions to isogeny-transfer attacks: (1) Tate isogeny theorem
        proves ordinary F_p-isogenies preserve trace of Frobenius, so special
        families (anomalous, MOV, Weil-descent) are isogeny-class invariants;
        (2) Delfs-Galbraith shows ordinary isogeny graph distances to sparse
        special sets are exponential in set density; (3) no constructive path
        found at 20-28 bit toy scale; (4) charged cost gate C_path + C_special
        >= 0.886 sqrt(N) with high probability. H-IT-001 transitioned
        rejected_scoped -> weakened (DEC-20260808-86ec3c) because successor
        directions (non-invariant special families, within-class
        reformulations) remain open. Subgoal paused pending identification of
        viable successor mechanisms or crypto-scale validation.
      evidence_refs:
        - EV-ECDLP-b3e847
      hypothesis_refs:
        - H-IT-001
      successor_directions:
        - >-
          Non-invariant special families (if any exist outside the three named
          families protected by Tate isogeny theorem)
        - >-
          Within-class reformulations (exploit structure within an isogeny
          class rather than transferring between classes)
        - >-
          Supersingular isogeny paths (out of scope for ordinary-isogeny
          hypothesis but not ruled out)
  linked_hypotheses:
    - H-IT-001
  linked_evidence:
    - EV-ECDLP-b3e847
    - EV-IT-001
    - EV-IT-002
  proposed_by: coordinator
