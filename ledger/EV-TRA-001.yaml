  observations:
    - "Controls: positive PASS (full-resolution C=n estimator recovers k exactly for all 18 instances; explicit n x n matrix path for p in {211,1009} gives L = n, phi = 1/n); negative PASS (random permutations: 50 hits vs chance 50.35, ratio 0.993; informative-only 23 vs 23.34); determinism PASS (second invocation byte-identical in non-volatile fields)."
    - "Gate rows (S = n^1/4, 18 configs/size): hits vs chance 13/11.08 (p=211), 15/12.53 (p=1009), 9/7.58 (p=4099); L_eff means 1.667 / 1.555 / 1.778 vs chance floors 1.385 / 1.304 / 1.579; L_eff median = 1.0 at all sizes; L claimed stays in [1.5,4.0] across the whole (p,C,S) grid."
    - "Gate arithmetic: literal threshold n^0.05 = 1.304 / 1.414 / 1.516; crossing fractions 0.278 / 0.278 / 0.333 (not sustained), and the threshold is at/below the chance floor at these toy sizes (23 of 108 negative-control rows also cross) — literal crossings carry no signal. Growth exponent of L_eff vs n: delta = 0.0195 (super-constant required by the cost model)."
    - "Cost: charged (2S + Cc^3)/sqrt(n) means 51135 / 22705 / 11358; candidate-model S*C^2 means 23296 / 34944 / 46592; finish-inclusive ratio unchanged (~+1). No regime with total charged cost below sqrt(n)."
    - "Unexpected structural observation: all 54 exact coarse operators are exactly reversible (detailed-balance residual 2.5e-17) with entirely real spectra (max |Im lambda| = 3.7e-16) — for negation-symmetric x-interval partitions there are no eigenvalue phases at any sampling budget; the k-encoding character phases are destroyed structurally by the +/- fold, not merely statistically. lambda_2 mean 0.422, max 0.988."
    - "Informative-only hit excess on EC rows (ratios 1.63 / 1.97 / 1.31 vs chance, 5-6 hits each) does not grow with n and is absent on the negative control (0.985); consistent with small-count fluctuation."
  inference: "No improvement meeting the predefined threshold was observed over the tested instances, parameters, estimator, and resource budget: L = O(1) with growth exponent delta = 0.0195, hit rates at chance, and the exact-coarse diagnostic shows the tested channel is structurally phase-free for x-cell partitions (reversibility => real spectrum). Executor reports numbers only; hypothesis status is the Coordinator's decision."
  boundaries: ["toy prime fields n <= ~4200; x-interval partitions; single-eigenpair matched-filter estimator; S in {n^1/4, n^3/8}; 6 seeds; C=128 is not << sqrt(n) at these sizes; literal n^0.05 gate at/below chance floor at toy scale"]
  unresolved_confounds: ["non-negation-symmetric partitions and multi-mode estimators untested; reversibility obstruction is measured (and symmetry-argued) for x-cells, not proved for all partitions"]
  reviewed_by: coordinator
