web_search = "live"
sandbox_mode = "danger-full-access"
[agents]
# One thread per role in a dispatch batch, and no nesting: a subagent
# spawning subagents would put work outside the batch the Coordinator
# authorised.
max_threads = 5
max_depth = 1

[agents.coordinator]
description = "Research Coordinator for the ECDLP autoresearch program. Use for approving or revising experiment protocols, changing official hypothesis status, reviewing Executor run records and evidence, issuing handoffs, prioritizing the roadmap, and writing synthesis or decision records. The only agent allowed to change hypothesis status or approve experiments. Use proactively whenever a research-state transition, evidence review, or task assignment is needed."
config_file = "./agents/coordinator.toml"

[agents.idea-generator]
description = "Hypothesis and idea generator for the ECDLP autoresearch program. Use when a research question needs structured, falsifiable proposals: new mechanisms, algorithms, representations, measurements, compositions, controls, or tooling ideas. Produces YAML idea records with predictions, minimal discriminating tests, and falsification criteria. Never assigns work or changes hypothesis status."
config_file = "./agents/idea-generator.toml"

[agents.executor]
description = "Experiment Executor for the ECDLP autoresearch program. Use to implement and run Coordinator-approved experiment protocols: validate the frozen specification, write implementation code, run bounded experiments with deterministic seeds, and produce immutable run records and execution reports. Refuses underspecified experiments. Never interprets results or changes hypothesis status."
config_file = "./agents/executor.toml"

[agents.validator]
description = "Independent evidence validator for the ECDLP autoresearch program. Use after a Coordinator snapshot commit to verify run receipts, controls, metrics, and reproducibility bindings. Never changes research status or raw artifacts."
config_file = "./agents/validator.toml"

[agents.red-team]
description = "Independent interpretation and cost-model challenger for the ECDLP autoresearch program. Use after a Coordinator snapshot commit to identify hidden assumptions, omitted end-to-end costs, and the cheapest falsification control. Never changes research status or raw artifacts."
config_file = "./agents/red-team.toml"

[sandbox_workspace_write]
network_access = true
