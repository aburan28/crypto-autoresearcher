  summary: >-
    For the boolean Semaev t=3 Weil-descent family (nb=2n boolean vars, n deg-2 +
    n deg-3 eqs) the semi-regular degree of regularity is LINEAR in n with an
    exact analytic density c*=0.2374790709146819 (interior max of psi=zB'/B on
    (0,1); root of a self-reciprocal octic; coalescing-saddle asymptotics of
    B(z)^n). Consequently the Groebner/Macaulay solve is super-exponentially
    worse than Pollard-rho at every tested scale, including the real crypto
    target t=7 n=161 (d_reg=150 -> Groebner 2^1194..2^1415 vs rho 2^80.5). The
    n=9/D6 "null break" is a d_reg=6 degeneracy of the semi-regular baseline, not
    an instrument bug; the baseline is well-defined iff probe degree D < d_reg(n),
    so D6-at-n=12 (d_reg=7) is a clean sub-d_reg point. This is a t=3/t=7 binary
    Weil-descent NEGATIVE CONTROL for the prime-field ECDLP target; no break and
    no prime-field/crypto-scale positive claim is made.

  key_results:
    - >-
      LINEAR d_reg law (survives independent validation + adversarial re-derivation):
      d_reg(n)=first non-positive coeff of B(z)^n, B=(1+z)^2/((1+z^2)(1+z^3));
      d_reg = 5,6,7,8,9,10 at n=6,9,12,15,18,24; 46 at n=161; 252 at n=1000;
      1929 at n=8000. d_reg/n -> ~0.238; d_reg/sqrt(n) grows without bound
      (3.6 at n=161, 8.0 at n=1000, 21.6 at n=8000) => Theta(n), not O(sqrt(n)).
    - >-
      ANALYTIC linearity (theorem-grade FOR THE SEMI-REGULAR MODEL): density is the
      algebraic constant c*=0.2374790709146819, the interior maximum of the rational
      psi(z)=z(2-4z+z^2-2z^3-3z^4)/((1+z^2)(1+z^3)); psi'(z*)=0 reduces to the octic
      2z^8-8z^7+z^6-12z^5-10z^4-12z^3+z^2-8z+2=0 (quartic 2w^4-8w^3-7w^2+12w-8 in
      w=z+1/z), unique root z*=0.2330651016198973 in (0,1); genuine double saddle
      (g''(z*)=0). d_reg(n)=c*n+Theta(n^{1/3}); 3-param fit recovers slope to 1.6e-5.
    - >-
      CRYPTO-SCALE (t=7 n=161, construction verified from semaev_tree.py: nb=966,
      161 deg-2 + 805 deg-3): d_reg=150; log2(#monomials<=150 in 966 boolean vars)
      =597.19; Groebner LA cost 2^1194.4 (omega=2) to 2^1415.3 (omega=2.37); rho
      2^80.5 on E(GF(2^161)); bit loss 1114 (omega=2) / 1335 (omega=2.37). Gap
      grows monotonically with t (t=3..7: +299,+505,+710,+914,+1114 bits at omega=2).
    - >-
      n=9/D6 mechanism (survives): the null fails its C5 control at n=9/D6 because
      d_reg(9)=6 -> at D=d_reg the random null reaches full rank and the pre-collapse
      sr_pred under-shoots. Robust invariant at two sizes: null collapse degree
      (quotient ncols-rank -> 1) equals predicted d_reg exactly (n=6 D5, n=9 D6);
      below d_reg the null rank tracks sr_pred (exactly n=9 D2..D5 incl. 9504).
    - >-
      d_reg(sem) > d_reg(null) — RE-ESTABLISHED BY A CORRECTED INSTRUMENT after the
      v1 method was RETRACTED (see limitations). Using the order-independent graded
      pivot-degree Hilbert function on a single Macaulay matrix: at d=d_reg(null)
      the null's genuine graded piece vanishes (HF_null=0 at n=9; single affine
      residual at n=6) while the sem's is large (HF_sem=32 at n=6, 2034 at n=9). A
      Macaulay-max-degree statement: the Semaev cascade syzygies RAISE the solving
      degree — the wrong direction for an attacker. Reproduced by a distinct engine
      (Sage m4ri) at n=6 and n=9/D5.
    - >-
      FIRST-FALL completeness (no sub-d_reg opening at toy scale): first-fall IS low
      (extra>0 at D4 n=6 / D3 n=9; linear ideal elements at D3/D2), but the relation
      supply there is only O(1)-O(n) (le1_max 8<nb=12, 14<nb=18), the quotient stays
      exponentially large until ~d_reg (q_sem 77,171,95 at n=6; 365,1423,2437,2040 at
      n=9), and a usable count of linear relations only materializes at Macaulay degree
      ~d_reg. A hybrid/last-fall solver still pays ~d_reg -> Groebner 2^{Theta(n)} >>
      rho 2^{n/2}.

  controls:
    - >-
      Support-matched random NULL (boolean_null with stable_seed) vs true Semaev
      (build_boolean_semaev): the null's quotient collapses to 1 exactly at its
      predicted semi-regular d_reg at BOTH n=6 (D5) and n=9 (D6); sem is far from
      collapse there. Positive/negative control reproduced.
    - >-
      Distinct-engine cross-check: graded Hilbert function and ranks reproduced by
      Sage native m4ri (independent of the instrument's hand-rolled GF(2) echelon)
      at n=6 and n=9/D5; every case sum_d HF_graded(d)=ncols-rank.
    - >-
      Confounded-measure control (secondary finding): the naive stacked-rank-
      difference per-degree measure is confounded by affine degree-falls and INVERTS
      the sem>null claim (sem goes negative at D4 first). This reproduces the
      red-team's D4-deficit signal and documents why that measure must not be used.
    - >-
      Recorded-receipt cross-check: n=9 sem D6 (ncols 29332, rank 27292, sr_pred
      28068) and null D6 (ncols 31180, rank 31179, sr_pred 28068) reproduced
      bit-for-bit from RUN-EXP-SIG-005-h / -k.
    - >-
      Anchor validation: recurrence reproduces every published anchor exactly and was
      independently re-derived in exact big-integer arithmetic (~30 quantities, zero
      discrepancies) and by two independent d_reg implementations (Miller B^n
      recurrence and C(2n,j)/divide-by-(1+z^d)).

  limitations:
    - >-
      RETRACTED v1 METHOD: v1 Claim 5 argued d_reg(sem)>d_reg(null) from a raw
      subset-column corank (q_sem vs q_null) at the single degree D=d_reg(null). The
      independent RED-TEAM refuted this on four accepted grounds (different column
      supports = pre-declared artifact; one-arm-collapsed non-evaluability per
      DEC-20260720-002; sr_pred degenerate at D=d_reg for both arms; q_sem is on a
      monotone descent 171->9 toward the sem solving instance's own solution count,
      with a +76 D4 deficit trending the opposite way). That measurement is retracted;
      the conclusion is re-established only by the corrected graded-HF instrument above.
    - >-
      SEMI-REGULAR PROXY: d_reg here is the semi-regular prediction, validated to match
      the random null exactly for D<d_reg at n=6,9 and by the exact closed form. The
      true Semaev solving degree is >= this (extra syzygies), so the negative conclusion
      is robust in the safe direction, but semi-regularity of the true system at scale is
      NOT proven. The crypto-scale (t=7 n=161) and analytic-density results inherit this
      assumption: no first-fall collapse below d_reg is proven at n=161.
    - >-
      TOY SCALE / SAMPLE SIZE: all direct linear-algebra measurements are n in {6,9}
      (per-degree HF, first-fall census); the first-fall "relation supply stays O(n)
      while quotient stays exponential" separation rests on two sizes plus the closed
      form and is not an asymptotic or constructive-impossibility proof. No sub-d_reg
      solve was run to termination.
    - >-
      ANALYTIC SCOPE: c* is theorem-grade only for the semi-regular model (given the
      Hilbert series = truncated B(z)^n). One step (global saddle dominance over the
      boundary poles on |z|=z*) is verified numerically, not by a written lemma. The
      t=7 n=161 target is a different B(z) outside the written proof; only the t=3
      family density is analytically covered.
    - >-
      NEGATIVE CONTROL / SCOPE DISCIPLINE (AGENTS 4-7): t=3 and t=7 boolean Weil-descent
      over a binary field is a NEGATIVE CONTROL for the generic prime-field ECDLP target.
      No prime-field claim, no crypto-scale positive claim, and no ECDLP break is made or
      implied. This finding changes no hypothesis status and does NOT discharge the
      DEC-20260720-002 prerequisite — those are Coordinator-only actions.

