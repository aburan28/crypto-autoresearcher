<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="440" viewBox="0 0 1050 440" role="img" aria-labelledby="title desc">
  <title id="title">Prime63 prospective admission repair</title>
  <desc id="desc">Both parent and child require a frozen plan, repository authorization and a ready selector before task scratch, output or Sage work. Twenty refusal controls and a mocked 27-call forwarding path passed.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17314c}.box{fill:#e8f2f8;stroke:#2d6080;stroke-width:2}.gate{fill:#e1f3e8;stroke:#23754f;stroke-width:2}.later{fill:#fff0d8;stroke:#a07124;stroke-width:2}.arrow{stroke:#345b75;stroke-width:3;fill:none;marker-end:url(#head)}.big{font-size:19px;font-weight:bold}.small{font-size:15px}</style>
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#345b75"/></marker></defs>
  <text x="25" y="38" font-size="25" font-weight="bold">Prime63 launcher admission: both entry points</text>
  <rect class="box" x="25" y="75" rx="10" width="290" height="110"/>
  <text class="big" x="45" y="107">Frozen trial plan</text><text class="small" x="45" y="135">source + spec hashes</text><text class="small" x="45" y="159">load_plan before task output</text>
  <rect class="gate" x="380" y="75" rx="10" width="290" height="110"/>
  <text class="big" x="400" y="107">Repository authorization</text><text class="small" x="400" y="135">decision + live published claim</text><text class="small" x="400" y="159">owner + epoch checked</text>
  <rect class="gate" x="735" y="75" rx="10" width="290" height="110"/>
  <text class="big" x="755" y="107">Ordinary selector</text><text class="small" x="755" y="135">exact EXP row = ready</text><text class="small" x="755" y="159">same plan path + SHA256</text>
  <path class="arrow" d="M315 130 H370"/><path class="arrow" d="M670 130 H725"/>
  <rect class="gate" x="25" y="245" rx="10" width="455" height="115"/>
  <text class="big" x="45" y="279">Engineering controls passed</text><text class="small" x="45" y="308">20 fail-closed entry-point cases</text><text class="small" x="45" y="333">27 mocked calls forward plan / owner / epoch</text>
  <rect class="later" x="570" y="245" rx="10" width="455" height="115"/>
  <text class="big" x="590" y="279">Future scientific admission</text><text class="small" x="590" y="308">real approved EXP + published claim pending</text><text class="small" x="590" y="333">0 full-width solver calls here</text>
  <path class="arrow" d="M880 185 V235"/>
  <text class="small" x="25" y="415">The repair adds admission evidence; E2E speed remains unmeasured.</text>
</svg>
