      The runner and checker parse and their tests pass without any named-cohort
      execution; test-report.txt explicitly states named_orders_executed: 0.
    - >-
      Every frozen input binding above is rehashed and reported. A mismatch is
      a hard refusal, not a warning or fallback.
    - >-
      The runner/checker reject mutated UID/order/label/manifest bindings,
      duplicate or missing prior-primality mappings, malformed framing,
      incomplete/mutated certificates, missing raw outputs, false A/A equality,
      and a trace record that claims unprinted branches were executed.
    - >-
      The report names exact remaining steps: Coordinator review-required
