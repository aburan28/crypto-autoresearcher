  constraints:
    - >-
      ZERO named-order execution: do not call execute_case, vm, runecpp, or
      checkcertif with any row from cohort-inputs.json. Do not boot a QEMU VM
      for a cohort order. This task has maximum_runs: 0.
    - >-
      Do not edit cohort-inputs.json, COHORT_PROTOCOL_DRAFT.md,
      cohort_case.py, runtime-bindings.json, runtime-summary.json, the source
      REPLAY_REQUIREMENTS.md, prior certificates, assessed.json, or traits.json.
      Those are frozen inputs, not implementation targets.
    - >-
      Preserve all 21 UIDs and manifest order exactly. The implementation must
      reject a cohort other than exactly 21 unique UIDs with exactly 11 omitted
      and 10 published labels; it must reject a substituted order, field prime,
      curve UID, label, or manifest digest.
    - >-
      The future primary measurement is exactly one serial cohort pass. It keeps
      the full original Data catalog, original factor parameters, proving, N-1,
      and N+1 enabled, no distributed mode, DEBUG absent, a fresh process/VM
      per order, and original ModInitialize srandom(1). No implementation
      option may select CM-only, truncate the catalog, change limits by label,
      or tune a separator.
    - >-
      Encode, but do not execute here, the fixed machine-protection limits:
      one emulated CPU, 256 MiB VM RAM, 128 MiB child address space, 300-second
      guest CPU/alarm limit, 390-second host watchdog, and checker 30/90-second
      guest/host limits. They are machine protections, not historical timing or
      performance measurements.
    - >-
      Implement a public, supervisor-callable runner interface that accepts only
      a declared cohort index and output directory. It must reject arbitrary
      integers, duplicate output directories, indices outside [0,20], and an
      absent exact input-binding manifest. It must not add a bulk/cohort CLI
      that bypasses the future enumerated trial plan.
    - >-
      Implement a separate checker interface. It must fail closed unless all
      of the following hold: exact cohort row identity; complete prior-primality
      evidence mapping; required fresh-VM framing; retained raw prover/checker
      artifacts; child/host status consistency; a complete root-bound legacy
      certificate where admission is asserted; checker acceptance and exact
      certificate-step count where admission is asserted; and an output schema
      with no conflicting legacy/classification fields.
    - >-
      The checker may use certificate_admission.py as one bounded component but
      must state that it is not an independent general primality verifier.
      Legacy labels remain observations. They must never be used to claim new
      primality, compositeness, a weak curve, historical selection, or ECDLP
      relevance.
    - >-
      The runner must retain immutable raw serial/stderr, exact child arguments,
      payload and kernel digests, original-data inventory binding, QEMU/child
      statuses, limits, watchdog reason, host elapsed time, certificate bytes
      when present, and raw observation bytes. It must emit an extraction record
      for every printed recursive N, D, factor list, route, retry, and phase
      marker that its parser recognizes; it must map printed D values only to
      positions in the fixed original catalog. Anything not printed is recorded
      as unobserved, not reconstructed as attempted.
    - >-
      Censoring is mandatory. Timeout, crash, malformed/missing certificate,
      framing failure, missing completion, exception, watchdog stop, or checker
      rejection must produce retained artifacts and mathematical classification
      INDETERMINATE. A contradictory legacy prime/composite label is retained
      separately. No retry or alternate configuration is automatic.
    - >-
      Implement but do not execute an A/A admission-comparator mode for a later
      non-cohort public fixture. It must compare two fresh controlled executions
      semantically and reject a mismatch. Its contract must state that it is an
      engineering reproducibility control, not an additional cohort order or an
      independent curve. A later independent replay is a separately approved
      task, triggered only by an observed mechanism needing replication.
    - >-
      Tests for this task must be static or mocked-fixture tests only. They may
      exercise parser, manifest, tamper-refusal, certificate-admission and A/A
      comparison semantics without running the legacy ECPP scientific path.
      The report must contain `named_orders_executed: 0`.
    - >-
      No scientific hypothesis/goal status, approval decision, evidence record,
      historical explanation, performance claim, or ECDLP-security conclusion
      may be written by this task.
  deliverables:
