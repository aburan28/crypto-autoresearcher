schema: crypto.autoresearch.endring_trap_interface.v1
required_fields:
  identity: [name, candidate_id, producer_task_id, status]
  endring_problem:
    - field_and_curve_distribution
    - challenge_input
    - allowed_auxiliary_information
    - required_output_representation
    - conditional_dependencies
  domains:
    - X_E
    - Y_E
    - encodings
    - equality_or_equivalence
    - validation
    - failure_symbols
  algorithms:
    - Sample_from_bare_E
    - Eval_from_bare_E
    - Inv_from_complete_basis
    - runtimes
    - failure_bounds
  any_basis_statement:
    - basis_representation
    - quantified_correctness
    - change_of_basis_audit
  necessity:
    - smallest_known_sufficient_witness
    - factorization_search
    - non_factorization_or_reconstruction_theorem
  reduction:
    - first_security_game
    - challenge_embedding
    - oracle_simulation
    - attacker_to_interface_step
    - interface_to_complete_ring_step
    - loss_runtime_abort
  audits:
    - CEST_RWCT_regression
    - observation_collisions
    - quantifier_order
    - known_false_control
    - method_ceiling
  obligations: [O1, O2, O3, O4, O5, O6]
  provenance: [sources_read, prior_art_delta, novelty_status]
allowed_status: [candidate, typed_obstruction]
forbidden_shortcuts:
  - hidden orientation or torsion basis
  - undeclared connecting isogeny
  - planted-basis alignment oracle
  - undeclared BaseGen, Eval2, quotient lift, or canonical selector
  - forward EndRing-solver attack relabeled as a security reduction
  - complete-ring necessity inferred only from KeyGen provenance
