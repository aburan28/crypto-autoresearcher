<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="775" viewBox="0 0 1400 775" role="img" aria-labelledby="title desc">
  <title id="title">CEFC-PKE intended data flow and exact blockers</title>
  <desc id="desc">The sender samples an isogeny walk, computes an endpoint and a missing edge-label sum, while the recipient requires a missing ring-potential evaluator. A missing extractor prevents an EndRing reduction, and a related-ciphertext query breaks the raw CCA syntax.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#245b8f"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#bd2c2c"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c66a00"/></marker>
    <style>
      .title{font:700 30px DejaVu Sans,Arial,sans-serif;fill:#173f68}.sub{font:400 17px DejaVu Sans,Arial,sans-serif;fill:#526174}.box{rx:14;ry:14;stroke-width:2.5}.defined{fill:#e8f1fb;stroke:#245b8f}.missing{fill:#fff1f1;stroke:#bd2c2c;stroke-dasharray:8 6}.attack{fill:#fff3df;stroke:#c66a00}.label{font:600 17px DejaVu Sans,Arial,sans-serif;fill:#17324d;text-anchor:middle}.small{font:400 14px DejaVu Sans,Arial,sans-serif;fill:#526174;text-anchor:middle}.red{fill:#671515}.orange{fill:#6e3b00}.arrow{fill:none;stroke:#245b8f;stroke-width:3;marker-end:url(#blueArrow)}.dash{fill:none;stroke:#bd2c2c;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#redArrow)}.cca{fill:none;stroke:#c66a00;stroke-width:3;marker-end:url(#orangeArrow)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="55" y="58" class="title">CEFC-PKE: conditional endpoint flow, missing arrows, and CCA break</text>
  <text x="55" y="88" class="sub">BATCH-3e1bfd · zero runs · zero surviving constructions</text>

  <rect x="45" y="125" width="890" height="430" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="75" y="160" class="sub">Conditional honest-party flow</text>

  <rect class="box defined" x="75" y="195" width="205" height="82"/>
  <text x="177" y="227" class="label">Public sender</text><text x="177" y="251" class="small">E, m, coins ρ</text>
  <rect class="box defined" x="350" y="185" width="205" height="102"/>
  <text x="452" y="220" class="label">WalkSample</text><text x="452" y="244" class="small">walk w (abstract law)</text><text x="452" y="266" class="small">not executable yet</text>
  <path class="arrow" d="M280 236 H350"/>

  <rect class="box defined" x="635" y="165" width="235" height="82"/>
  <text x="752" y="198" class="label">Endpoint</text><text x="752" y="222" class="small">C = F<tspan baseline-shift="sub">E</tspan>(w)</text>
  <rect class="box missing" x="635" y="285" width="235" height="98"/>
  <text x="752" y="318" class="label red">Sender value</text><text x="752" y="342" class="small red">x = Σ EdgeLabel(e)</text><text x="752" y="364" class="small red">concrete label missing</text>
  <path class="arrow" d="M555 220 H635"/>
  <path class="dash" d="M555 256 C585 256 585 334 635 334"/>

  <rect class="box defined" x="1005" y="205" width="310" height="105"/>
  <text x="1160" y="239" class="label">Ciphertext</text><text x="1160" y="266" class="small">(C, m ⊕ H(pp,E,C,x,|m|))</text><text x="1160" y="290" class="small">conditional on the missing x</text>
  <path class="arrow" d="M870 206 C940 206 940 242 1005 242"/>
  <path class="dash" d="M870 334 C940 334 945 275 1005 275"/>

  <rect class="box defined" x="75" y="425" width="245" height="88"/>
  <text x="197" y="458" class="label">Secret witness W<tspan baseline-shift="sub">E</tspan></text><text x="197" y="482" class="small">complete evaluable End(E)</text>
  <rect class="box missing" x="410" y="415" width="250" height="108"/>
  <text x="535" y="449" class="label red">RingPotential</text><text x="535" y="474" class="small red">W<tspan baseline-shift="sub">E</tspan>, C ↦ x</text><text x="535" y="498" class="small red">algorithm &amp; necessity missing</text>
  <rect class="box defined" x="750" y="430" width="155" height="78"/>
  <text x="827" y="464" class="label">Decrypt</text><text x="827" y="488" class="small">recover m</text>
  <path class="dash" d="M320 469 H410"/>
  <path class="dash" d="M752 247 C752 395 675 469 660 469"/>
  <path class="dash" d="M660 469 H750"/>
  <path class="arrow" d="M1160 310 C1160 480 980 469 905 469"/>

  <rect class="box missing" x="970" y="390" width="350" height="135"/>
  <text x="1145" y="424" class="label red">Smaller-witness controls</text>
  <text x="1145" y="450" class="small red">public endpoint · exact path · EvalLine</text>
  <text x="1145" y="474" class="small red">finite action · cache · compressed witness</text>
  <text x="1145" y="498" class="small red">opaque endpoint decoder not excluded</text>
  <path class="dash" d="M970 457 C855 555 745 535 650 500"/>

  <rect class="box missing" x="70" y="630" width="230" height="92"/>
  <text x="185" y="665" class="label red">Successful attacker</text><text x="185" y="691" class="small red">IND-CPA / potential bit</text>
  <rect class="box missing" x="420" y="620" width="275" height="112"/>
  <text x="557" y="654" class="label red">Extractor missing</text><text x="557" y="680" class="small red">same distribution + loss</text><text x="557" y="704" class="small red">must output full ring basis</text>
  <rect class="box defined" x="805" y="630" width="265" height="92"/>
  <text x="937" y="664" class="label">Complete End(E) basis</text><text x="937" y="691" class="small">required reduction output</text>
  <path class="dash" d="M300 676 H420"/><path class="dash" d="M695 676 H805"/>
  <text x="557" y="758" class="small red">Available direction W<tspan baseline-shift="sub">E</tspan> → decrypt is reverse functionality, not security.</text>

  <rect class="box attack" x="1130" y="600" width="235" height="142"/>
  <text x="1247" y="633" class="label orange">Raw CCA break</text>
  <text x="1247" y="660" class="small orange">query (C, v ⊕ Δ)</text>
  <text x="1247" y="686" class="small orange">receive m<tspan baseline-shift="sub">b</tspan> ⊕ Δ</text>
  <text x="1247" y="712" class="small orange">recover m<tspan baseline-shift="sub">b</tspan>; advantage 1/2</text>
  <path class="cca" d="M1220 310 C1360 390 1360 530 1280 600"/>

</svg>
