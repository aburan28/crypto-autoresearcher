corrections:
  - stage: svg_layout
    observed: >-
      The first Mermaid render placed the gate matrix before the proposal
      because a literal back-edge controlled the cycle layout.
    correction: >-
      Replaced the layout-driving back-edge with an explicit return-to-propose
      node, then compacted the gate matrix and increased the Mermaid wrapping
      width for a top-to-bottom, page-legible flow.
    reinspection: pass
  - stage: first_pdf_engine
    observed: >-
      Pandoc plus XeLaTeX failed promptly because rsvg-convert was unavailable;
      no PDF was accepted from that attempt.
    correction: >-
      Rendered Pandoc to self-contained HTML and printed it locally with
      Chromium, which embeds the current SVG natively.
    reinspection: pass
  - stage: first_browser_pdf
    observed: >-
      The first browser PDF split the diagram over two pages and left
      backslash-delimited math as literal source text.
    correction: >-
      Rebuilt with Pandoc native Markdown, implicit figures, and
      tex_math_single_backslash enabled; the final diagram occupies page 2 and
      the mathematical expressions are typeset.
    reinspection: pass_all_8_pages

