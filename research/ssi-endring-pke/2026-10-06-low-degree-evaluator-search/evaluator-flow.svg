<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Evaluator reconstruction routes and exact bottlenecks</title>
  <desc id="desc">One exact input branches to orbit interpolation, two-isogeny lifting, calibrated ideal realization, and an evaluator-only challenge. Only dense interpolation returns an evaluated map, at exponential cost in a. The other proposed routes have named missing interfaces. A certified evaluator feeds the exact slope decoder.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2166ac"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad6b00"/></marker>
    <style>
      .bg{fill:#ffffff}.title{font:700 30px sans-serif;fill:#10243b}.subtitle{font:16px sans-serif;fill:#34495e}
      .node text{font:16px sans-serif;fill:#10243b}.node .head{font-weight:700;font-size:18px}
      .input{fill:#eef4ff;stroke:#315b8a;stroke-width:3}.derived{fill:#d9ecff;stroke:#2166ac;stroke-width:3}
      .proposed{fill:#fff0c2;stroke:#ad6b00;stroke-width:3;stroke-dasharray:9 6}.missing{fill:#ffe0e0;stroke:#b42318;stroke-width:3}
      .output{fill:#dcf4e4;stroke:#237a45;stroke-width:3}.edgeD{fill:none;stroke:#2166ac;stroke-width:3;marker-end:url(#arrowBlue)}
      .edgeP{fill:none;stroke:#ad6b00;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#arrowAmber)}
      .label{font:14px sans-serif;fill:#26384a}.legend{font:15px sans-serif;fill:#26384a}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="1050"/>
  <text class="title" x="55" y="48">Low-degree evaluator reconstruction — TASK-20261006-fa5bac</text>
  <text class="subtitle" x="55" y="78">Solid blue = derived transformation · dashed amber = proposed interface · red = precise unresolved interface · no measured scientific results</text>

  <g class="node">
    <rect class="input" x="55" y="130" rx="14" width="310" height="170"/>
    <text x="75" y="160"><tspan class="head">Exact encoded input</tspan><tspan x="75" dy="28">O=End(E), exact E,C/Fp²</tspan><tspan x="75" dy="24">P∈E[N], X∈C[N]</tspan><tspan x="75" dy="24">D=2ᵃ, N&gt;4D, U,V,k</tspan><tspan x="75" dy="24">No connection / target frame / advice</tspan></text>

    <rect class="derived" x="440" y="95" rx="14" width="310" height="120"/>
    <text x="460" y="128"><tspan class="head">[DERIVED] Uniqueness</tspan><tspan x="460" dy="28">Full signed X and N&gt;4D</tspan><tspan x="460" dy="24">identify at most one degree-D f</tspan><tspan x="460" dy="24">Identification is not construction</tspan></text>

    <rect class="derived" x="440" y="255" rx="14" width="310" height="145"/>
    <text x="460" y="288"><tspan class="head">[DERIVED] Route A</tspan><tspan x="460" dy="28">2D orbit equations</tspan><tspan x="460" dy="24">Padé reconstructs dense f</tspan><tspan x="460" dy="24">Executable f(U),f(V) → m</tspan></text>

    <rect class="derived" x="825" y="255" rx="14" width="300" height="145"/>
    <text x="845" y="288"><tspan class="head">[DERIVED] Dense cost</tspan><tspan x="845" dy="28">Θ(D) samples and output</tspan><tspan x="845" dy="24">Θ(D log p) bits</tspan><tspan x="845" dy="24">Exponential in encoded a</tspan></text>

    <rect class="derived" x="440" y="445" rx="14" width="310" height="145"/>
    <text x="460" y="478"><tspan class="head">[DERIVED] Route B</tspan><tspan x="460" dy="28">Forward/backward 2-isogenies</tspan><tspan x="460" dy="24">Labelled midpoint join</tspan><tspan x="460" dy="24">3 first edges, then 2</tspan></text>

    <rect class="derived" x="825" y="445" rx="14" width="300" height="145"/>
    <text x="845" y="478"><tspan class="head">[DERIVED] Chain cost</tspan><tspan x="845" dy="28">Θ(2^(a/2)) states</tspan><tspan x="845" dy="24">Time and table memory</tspan><tspan x="845" dy="24">No uniform merger bound</tspan></text>

    <rect class="proposed" x="440" y="635" rx="14" width="310" height="145"/>
    <text x="460" y="668"><tspan class="head">[PROPOSED] Route C</tspan><tspan x="460" dy="28">Primitive cyclic norm-D ideal</tspan><tspan x="460" dy="24">Exact right order, C and X</tspan><tspan x="460" dy="24">must be realized/evaluated</tspan></text>

    <rect class="missing" x="825" y="635" rx="14" width="330" height="145"/>
    <text x="845" y="668"><tspan class="head">UNRESOLVED INTERFACE</tspan><tspan x="845" dy="30">CALIBRATED_IDEAL_REALIZE</tspan><tspan x="845" dy="25">Must charge norm, KLPT, right order,</tspan><tspan x="845" dy="23">isomorphism, evaluation, certificates</tspan></text>

    <rect class="proposed" x="440" y="825" rx="14" width="310" height="145"/>
    <text x="460" y="858"><tspan class="head">[PROPOSED] Evaluator-only</tspan><tspan x="460" dy="28">Return only f(U),f(V)</tspan><tspan x="460" dy="24">Small output accepted</tspan><tspan x="460" dy="24">No exponential preprocessing</tspan></text>

    <rect class="missing" x="825" y="825" rx="14" width="330" height="145"/>
    <text x="845" y="858"><tspan class="head">UNRESOLVED INTERFACE</tspan><tspan x="845" dy="30">MISSING_SUBLINEAR_</tspan><tspan x="845" dy="23">ORBIT_EVALUATOR</tspan><tspan x="845" dy="25">No lower bound asserted</tspan></text>

    <rect class="derived" x="1225" y="350" rx="14" width="315" height="165"/>
    <text x="1245" y="383"><tspan class="head">[DERIVED, conditional]</tspan><tspan x="1245" dy="28">Certified evaluated f</tspan><tspan x="1245" dy="24">or exact f(U),f(V)</tspan><tspan x="1245" dy="28">H=[2^(a-k)]f(V)</tspan><tspan x="1245" dy="24">G=-[2^(a-k)]f(U)=[m]H</tspan></text>

    <rect class="output" x="1225" y="565" rx="14" width="315" height="105"/>
    <text x="1245" y="600"><tspan class="head">Actual message output</tspan><tspan x="1245" dy="30">m = s mod 2^k</tspan><tspan x="1245" dy="24">after checked binary slope</tspan></text>

    <rect class="output" x="1225" y="735" rx="14" width="315" height="140"/>
    <text x="1245" y="770"><tspan class="head">Round outcome</tspan><tspan x="1245" dy="30">1 mechanism · 3 routes</tspan><tspan x="1245" dy="25">0 finalists · 0 runs</tspan><tspan x="1245" dy="25">0 measured scientific results</tspan></text>
  </g>

  <path class="edgeD" d="M365 165 C395 150 410 150 440 150"/><text class="label" x="373" y="132">degree bound</text>
  <path class="edgeD" d="M365 230 C405 275 405 320 440 330"/><text class="label" x="370" y="286">orbit samples</text>
  <path class="edgeD" d="M750 330 L825 330"/><text class="label" x="760" y="315">dense accounting</text>
  <path class="edgeD" d="M365 245 C400 390 400 505 440 515"/><text class="label" x="370" y="430">chain enumeration</text>
  <path class="edgeD" d="M750 515 L825 515"/><text class="label" x="760" y="500">branch count</text>
  <path class="edgeP" d="M365 260 C390 570 405 690 440 705"/><text class="label" x="370" y="625">ideal selection</text>
  <path class="edgeP" d="M750 705 L825 705"/><text class="label" x="760" y="690">exact realization</text>
  <path class="edgeP" d="M365 275 C390 765 405 885 440 895"/><text class="label" x="370" y="820">transposed challenge</text>
  <path class="edgeP" d="M750 895 L825 895"/><text class="label" x="760" y="880">poly(a) theorem</text>

  <path class="edgeD" d="M1125 330 C1170 330 1180 400 1225 410"/><text class="label" x="1135" y="352">dense f</text>
  <path class="edgeP" d="M1125 515 C1170 510 1180 455 1225 445"/><text class="label" x="1134" y="500">after full join</text>
  <path class="edgeP" d="M1155 705 C1190 660 1190 490 1225 475"/><text class="label" x="1160" y="640">if instantiated</text>
  <path class="edgeP" d="M1155 895 C1210 820 1185 510 1225 495"/><text class="label" x="1160" y="850">if instantiated</text>
  <path class="edgeD" d="M1382 515 L1382 565"/><text class="label" x="1395" y="545">two evaluations</text>
  <path class="edgeD" d="M1382 670 L1382 735"/><text class="label" x="1395" y="713">scope/accounting</text>

  <g transform="translate(55 1000)">
    <line x1="0" y1="0" x2="55" y2="0" class="edgeD"/><text class="legend" x="68" y="5">derived</text>
    <line x1="170" y1="0" x2="225" y2="0" class="edgeP"/><text class="legend" x="238" y="5">proposed / conditional</text>
    <rect x="430" y="-16" width="34" height="25" class="missing"/><text class="legend" x="477" y="5">unresolved interface</text>
    <rect x="680" y="-16" width="34" height="25" class="output"/><text class="legend" x="727" y="5">returned/scoped outcome</text>
  </g>
</svg>
