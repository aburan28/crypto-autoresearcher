<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Staged admission and decoder flow</title>
  <desc id="desc">Derived public pre-admission and post-evaluation decoding are separated by the open exact map or two-point evaluator obligation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .head{font:700 30px sans-serif;fill:#0f172a}.sub{font:18px sans-serif;fill:#334155}
      .box{rx:14;ry:14;stroke-width:3}.label{font:700 18px sans-serif;text-anchor:middle;fill:#172033}.small{font:15px sans-serif;text-anchor:middle;fill:#273449}
      .derived{fill:#dbeafe;stroke:#1d4ed8}.proposed{fill:#fef3c7;stroke:#b45309;stroke-dasharray:8 6}.open{fill:#fee2e2;stroke:#b91c1c;stroke-width:4;stroke-dasharray:10 7}.conditional{fill:#ede9fe;stroke:#6d28d9}.control{fill:#f3f4f6;stroke:#4b5563}
      .edge{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.edgeText{font:15px sans-serif;fill:#334155;text-anchor:middle}
      .legend{font:15px sans-serif;fill:#1f2937}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#ffffff"/>
  <text x="750" y="48" class="head" text-anchor="middle">Canonical staged admission and actual-message decoding</text>
  <text x="750" y="80" class="sub" text-anchor="middle">Solid blue = derived; amber = inherited/proposed; red dashed = separately open; violet = conditional on Eval2</text>

  <rect x="45" y="135" width="250" height="105" class="box proposed"/>
  <text x="170" y="170" class="label">PROPOSED / inherited</text><text x="170" y="199" class="small">BaseGen: p, E,</text><text x="170" y="222" class="small">evaluable End(E)</text>
  <rect x="350" y="135" width="255" height="105" class="box derived"/>
  <text x="478" y="170" class="label">DERIVED KeyGen</text><text x="478" y="199" class="small">ord(P)=N</text><text x="478" y="222" class="small">ordered D-basis (U,V)</text>
  <rect x="660" y="120" width="285" height="135" class="box derived"/>
  <text x="803" y="156" class="label">PUBLIC PreAdmit</text><text x="803" y="185" class="small">canonical exact tags</text><text x="803" y="208" class="small">P,X,U,V exact orders</text><text x="803" y="231" class="small">full-order Weil pairing</text>

  <rect x="350" y="330" width="255" height="125" class="box derived"/>
  <text x="478" y="366" class="label">Honest Encrypt</text><text x="478" y="395" class="small">K=U+sV</text><text x="478" y="418" class="small">a normalized 2-isogenies</text><text x="478" y="441" class="small">sender map erased</text>
  <rect x="660" y="340" width="285" height="105" class="box derived"/>
  <text x="803" y="376" class="label">Exact ciphertext</text><text x="803" y="405" class="small">(C, full signed X)</text><text x="803" y="428" class="small">literal model bytes</text>

  <rect x="1030" y="120" width="400" height="135" class="box open"/>
  <text x="1230" y="156" class="label">OPEN — NOT CONSTRUCTED</text><text x="1230" y="187" class="small">exact calibrated recipient map</text><text x="1230" y="211" class="small">or uniform bit-polynomial Eval2</text><text x="1230" y="235" class="small">no hidden connection / advice</text>
  <rect x="1030" y="330" width="400" height="105" class="box conditional"/>
  <text x="1230" y="366" class="label">CONDITIONAL INPUT</text><text x="1230" y="398" class="small">A0=f(U), B0=f(V) for exact f</text><text x="1230" y="421" class="small">shape checks do not prove semantics</text>

  <rect x="1030" y="510" width="400" height="125" class="box derived"/>
  <text x="1230" y="546" class="label">POST-evaluation admission</text><text x="1230" y="577" class="small">A0 in C[D], ord(B0)=D</text><text x="1230" y="600" class="small">H=[2^(a-k)]B0 has order 2^k</text><text x="1230" y="623" class="small">bind exact PRE_OK receipt</text>
  <rect x="660" y="520" width="285" height="105" class="box derived"/>
  <text x="803" y="556" class="label">Checked decoder</text><text x="803" y="586" class="small">G=[m]H digit loop</text><text x="803" y="609" class="small">final [m]H=G recheck</text>
  <rect x="350" y="520" width="255" height="105" class="box conditional"/>
  <text x="478" y="556" class="label">Selected message m</text><text x="478" y="587" class="small">derived conditional on</text><text x="478" y="610" class="small">semantically correct Eval2</text>

  <rect x="45" y="690" width="560" height="125" class="box control"/>
  <text x="325" y="726" class="label">SYMBOLIC CONTROLS</text><text x="325" y="757" class="small">P=0 · lower-order P · V=0 · nonbasis · weak orders</text><text x="325" y="780" class="small">swapped/retagged · x-only X · supplied evaluator</text><text x="325" y="803" class="small">each names the exact separating conjunct</text>
  <text x="1040" y="745" class="sub">No quantitative graph:</text><text x="1040" y="772" class="sub">zero measured data and zero run IDs.</text>

  <path d="M295 187 H350" class="edge"/><path d="M605 187 H660" class="edge"/>
  <path d="M478 240 V330" class="edge"/><path d="M605 392 H660" class="edge"/><path d="M803 340 V255" class="edge"/>
  <path d="M945 187 H1030" class="edge dash"/><text x="987" y="174" class="edgeText">separate</text>
  <path d="M1230 255 V330" class="edge dash"/><text x="1325" y="298" class="edgeText">if correct</text>
  <path d="M1230 435 V510" class="edge"/><path d="M1030 573 H945" class="edge"/><path d="M660 573 H605" class="edge"/>
  <path d="M325 690 V645 H760 V625" class="edge"/><path d="M325 690 V275 H700 V255" class="edge"/>
</svg>
