<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">EndRing PKE propose-evaluate candidate funnel</title>
  <desc id="desc">Two initial candidates are independently reviewed, one gap drives a revised candidate, and a fresh review yields zero finalists and one next research action.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #0f172a; }
      .subtitle { font: 16px sans-serif; fill: #475569; }
      .box-title { font: 700 18px sans-serif; fill: #0f172a; }
      .body { font: 15px sans-serif; fill: #1e293b; }
      .small { font: 13px sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
      .proposed { fill: #fff3bf; stroke: #8a6d00; stroke-width: 2; }
      .reviewed { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
      .broken { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .control { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2; }
      .next { fill: #dcfce7; stroke: #15803d; stroke-width: 2.5; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#ffffff"/>
  <text x="60" y="55" class="title">EndRing PKE candidate funnel</text>
  <text x="60" y="85" class="subtitle">BATCH-65c2dd | propose -&gt; evaluate -&gt; gap-feed -&gt; propose -&gt; evaluate</text>

  <rect x="1125" y="32" width="22" height="18" rx="4" class="proposed"/>
  <text x="1157" y="47" class="small">proposed</text>
  <rect x="1250" y="32" width="22" height="18" rx="4" class="reviewed"/>
  <text x="1282" y="47" class="small">independently reviewed</text>
  <rect x="1460" y="32" width="22" height="18" rx="4" class="broken"/>
  <text x="1492" y="47" class="small">break</text>

  <rect x="45" y="115" width="1510" height="300" rx="18" class="panel"/>
  <text x="70" y="148" class="box-title">Round 1</text>

  <rect x="75" y="180" width="250" height="92" rx="12" class="proposed"/>
  <text x="95" y="210" class="box-title">CEST-PKE [A]</text>
  <text x="95" y="237" class="body">Canonical endomorphism</text>
  <text x="95" y="260" class="body">same-scalar transfer</text>

  <rect x="75" y="292" width="250" height="92" rx="12" class="proposed"/>
  <text x="95" y="322" class="box-title">ER-McE [B]</text>
  <text x="95" y="349" class="body">EndRing-seeded</text>
  <text x="95" y="372" class="body">Goppa-code trapdoor</text>

  <rect x="390" y="226" width="190" height="94" rx="12" class="reviewed"/>
  <text x="413" y="257" class="box-title">Snapshot 1</text>
  <text x="413" y="284" class="body">0f0a92e25e</text>
  <text x="413" y="306" class="small">immutable bytes</text>

  <rect x="650" y="170" width="210" height="92" rx="12" class="reviewed"/>
  <text x="672" y="201" class="box-title">Validator [V]</text>
  <text x="672" y="228" class="body">O1-O3, blind</text>
  <text x="672" y="250" class="small">actual-message derivation</text>

  <rect x="650" y="282" width="210" height="92" rx="12" class="reviewed"/>
  <text x="672" y="313" class="box-title">Red team [R]</text>
  <text x="672" y="340" class="body">O4-O6, independent</text>
  <text x="672" y="362" class="small">attacks and controls</text>

  <rect x="930" y="170" width="270" height="92" rx="12" class="control"/>
  <text x="952" y="201" class="box-title">CEST outcome [C1]</text>
  <text x="952" y="228" class="body">Conditional transfer shell</text>
  <text x="952" y="250" class="body">O2 and O5 break</text>

  <rect x="930" y="282" width="270" height="92" rx="12" class="broken"/>
  <text x="952" y="313" class="box-title">ER-McE eliminated [C1]</text>
  <text x="952" y="340" class="body">Exact-weight residual test</text>
  <text x="952" y="362" class="body">IND-CPA success = 1</text>

  <rect x="1270" y="226" width="250" height="104" rx="12" class="control"/>
  <text x="1292" y="257" class="box-title">Gap packet [G]</text>
  <text x="1292" y="284" class="body">Complete-ring necessity</text>
  <text x="1292" y="307" class="body">and attacker extraction</text>

  <path d="M325 226 L390 260" class="arrow"/>
  <path d="M325 338 L390 287" class="arrow"/>
  <path d="M580 266 L650 216" class="arrow"/>
  <path d="M580 280 L650 328" class="arrow"/>
  <path d="M860 216 L930 216" class="arrow"/>
  <path d="M860 328 L930 328" class="arrow"/>
  <path d="M1200 216 L1270 258" class="arrow"/>
  <path d="M1200 328 L1270 299" class="arrow dash"/>

  <rect x="45" y="450" width="1510" height="270" rx="18" class="panel"/>
  <text x="70" y="483" class="box-title">Round 2</text>

  <rect x="85" y="525" width="275" height="108" rx="12" class="proposed"/>
  <text x="107" y="556" class="box-title">RWCT-PKE [W]</text>
  <text x="107" y="583" class="body">Compiled noncommutative</text>
  <text x="107" y="606" class="body">ring-word transfer slots</text>
  <text x="107" y="627" class="small">proposed obstruction packet</text>

  <rect x="430" y="532" width="190" height="94" rx="12" class="reviewed"/>
  <text x="453" y="563" class="box-title">Snapshot 2</text>
  <text x="453" y="590" class="body">c020468c0e</text>
  <text x="453" y="612" class="small">immutable bytes</text>

  <rect x="690" y="512" width="285" height="134" rx="12" class="reviewed"/>
  <text x="712" y="543" class="box-title">Fresh review [RR]</text>
  <text x="712" y="570" class="body">R1, R2, R3 all break</text>
  <text x="712" y="593" class="body">Gap not repaired</text>
  <text x="712" y="616" class="small">Obstruction downgraded to</text>
  <text x="712" y="637" class="small">inconclusive (no no-go theorem)</text>

  <rect x="1045" y="512" width="240" height="134" rx="12" class="broken"/>
  <text x="1067" y="543" class="box-title">Final gate [F]</text>
  <text x="1067" y="570" class="body">3 candidates generated</text>
  <text x="1067" y="593" class="body">0 finalists</text>
  <text x="1067" y="616" class="body">0 O1-O6 completions</text>
  <text x="1067" y="637" class="small">No secure PKE claim</text>

  <rect x="1350" y="520" width="170" height="118" rx="12" class="control"/>
  <text x="1372" y="551" class="box-title">Stop</text>
  <text x="1372" y="578" class="body">Two evaluations</text>
  <text x="1372" y="601" class="body">completed</text>
  <text x="1372" y="624" class="small">zero experiments</text>

  <path d="M360 579 L430 579" class="arrow"/>
  <path d="M620 579 L690 579" class="arrow"/>
  <path d="M975 579 L1045 579" class="arrow"/>
  <path d="M1285 579 L1350 579" class="arrow"/>
  <path d="M1395 330 C1395 420 230 420 230 525" class="arrow"/>

  <rect x="165" y="770" width="1270" height="118" rx="16" class="next"/>
  <text x="195" y="808" class="box-title">Exactly one next action [N]</text>
  <text x="195" y="839" class="body">Define and audit a basis-independent Trap_E : X_E -&gt; Y_E before proposing another PKE wrapper.</text>
  <text x="195" y="865" class="small">Required: public sampling from bare E; inversion from any complete basis; quotient/reconstruction theorem; attacker-to-complete-ring reduction.</text>
  <path d="M1165 646 C1165 724 1040 744 1040 770" class="arrow"/>

  <text x="60" y="920" class="small">Diagram is a navigation aid, not evidence. Labels map to the source index in report.md.</text>
</svg>
