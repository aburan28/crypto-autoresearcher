schema: crypto.autoresearch.endring_public_binding_interface.v1
required_fields:
  identity: [name, candidate_id, producer_task_id, status]
  endring_problem:
    - field_and_curve_distribution
    - challenge_input
    - allowed_auxiliary_information
    - required_complete_evaluable_output
    - conditional_dependencies
  domains:
    - X_E
    - Y_E
    - byte_grammar
    - equality
    - public_equivalence
    - validation
    - failure_symbols
  relation:
    - R_E
    - decision_algorithm
    - decision_runtime
    - honest_support
    - binding_statement
    - message_recovery_invariance
  algorithms:
    - Sample_from_bare_E
    - Eval_from_bare_E
    - Inv_from_every_complete_basis
    - runtimes
    - retries
    - failure_bounds
  any_basis_statement:
    - basis_representation
    - quantified_correctness
    - change_of_basis_audit
  repeated_use:
    - adversary_class
    - input_lengths
    - query_bound
    - adaptive_history
    - state
    - randomness_coupling
    - abort_behavior
    - complete_public_view
  necessity:
    - smallest_known_sufficient_witness
    - factorization_search
    - non_factorization_or_reconstruction_theorem
  reduction:
    - first_security_game
    - challenge_embedding
    - oracle_simulation
    - attacker_to_preimage_or_class
    - preimage_or_class_to_complete_ring
    - loss_runtime_abort
  audits:
    - CEST_RWCT_regression
    - accepted_preimage_collisions
    - quantifier_order
    - known_false_controls
    - method_ceiling
  obligations: [O1, O2, O3, O4, O5, O6, C1, C2, C3, C4, C5, C6]
  provenance: [sources_read, prior_art_delta, novelty_status, overlap_screen]
allowed_status: [candidate, typed_obstruction]
forbidden_shortcuts:
  - hidden orientation or torsion basis
  - undeclared connecting isogeny or ideal
  - secret-derived binding tag
  - planted-basis alignment oracle
  - non-polynomial canonical or lexicographic selector
  - endpoint equality called message-preserving equivalence without proof
  - undeclared BaseGen, Eval2, quotient lift, or canonical selector
  - forward EndRing-solver attack relabeled as a security reduction
  - complete-ring necessity inferred only from KeyGen provenance
