<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">CEFC-I endpoint-fiber instantiation evidence flow</title>
  <desc id="desc">The supported isogeny walk and strict transported suborder are defined and independently checked. Complete endpoint-ring saturation is missing at O1, so label, PKE, security, and Category-5 claims remain unestablished. The next action is a focused known-isogeny saturation audit.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52606d"/></marker>
    <style>
      .box{stroke-width:2.4;rx:14;ry:14}.t{font:600 17px Arial,sans-serif;fill:#102a43}.s{font:15px Arial,sans-serif;fill:#334e68}.lab{font:italic 14px Arial,sans-serif;fill:#52606d}.edge{stroke:#52606d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect x="20" y="24" width="1160" height="642" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="600" y="60" text-anchor="middle" class="t" font-size="23">CEFC-I: verified transport diagnostic, then exact O1 stop</text>

  <rect class="box" x="55" y="105" width="235" height="105" fill="#e8f1fb" stroke="#2b6cb0"/>
  <text x="172" y="138" text-anchor="middle" class="t"><tspan x="172">Public parameters</tspan><tspan x="172" dy="25">E₀ and complete W₀</tspan></text>
  <text x="172" y="192" text-anchor="middle" class="s">proposed fixed-pp input</text>

  <rect class="box" x="365" y="105" width="235" height="105" fill="#e8f1fb" stroke="#2b6cb0"/>
  <text x="482" y="137" text-anchor="middle" class="t"><tspan x="482">Supported nonbacktracking</tspan><tspan x="482" dy="24">ℓ-isogeny walk φ</tspan></text>
  <text x="482" y="192" text-anchor="middle" class="s">degree d = ℓ^L</text>

  <rect class="box" x="675" y="105" width="235" height="105" fill="#e7f6ec" stroke="#2f855a"/>
  <text x="792" y="138" text-anchor="middle" class="t"><tspan x="792">Integral transport</tspan><tspan x="792" dy="25">Sφ ⊂ End(E)</tspan></text>
  <text x="792" y="192" text-anchor="middle" class="s">defined rank-four unital order</text>

  <rect class="box" x="955" y="105" width="190" height="105" fill="#e7f6ec" stroke="#2f855a"/>
  <text x="1050" y="136" text-anchor="middle" class="t"><tspan x="1050">J1 verified</tspan><tspan x="1050" dy="25">[End(E):Sφ] = d³</tspan></text>
  <text x="1050" y="192" text-anchor="middle" class="s">normalized integrality can fail</text>

  <path class="edge" d="M290 157 H357"/><path class="edge" d="M600 157 H667"/><path class="edge" d="M910 157 H947"/>

  <rect class="box" x="455" y="278" width="290" height="118" fill="#fff4d6" stroke="#b7791f"/>
  <text x="600" y="314" text-anchor="middle" class="t"><tspan x="600">O1 exact stop</tspan><tspan x="600" dy="27">CompleteBasisAtEndpoint</tspan></text>
  <text x="600" y="374" text-anchor="middle" class="s">algorithm, cost, output law, failure tail absent</text>
  <path class="edge" d="M1050 210 V245 H600 V270"/>

  <rect class="box" x="65" y="470" width="245" height="110" fill="#fff4d6" stroke="#b7791f"/>
  <text x="187" y="504" text-anchor="middle" class="t"><tspan x="187">O2 blocked</tspan><tspan x="187" dy="26">EdgeLabel / RingPotential</tspan></text>
  <text x="187" y="560" text-anchor="middle" class="s">no formulas or executable trace</text>

  <rect class="box" x="367" y="470" width="245" height="110" fill="#fff4d6" stroke="#b7791f"/>
  <text x="489" y="504" text-anchor="middle" class="t"><tspan x="489">O3–O6 open</tspan><tspan x="489" dy="26">PKE / correctness / reduction</tspan></text>
  <text x="489" y="560" text-anchor="middle" class="s">ciphertext and full view undefined</text>

  <rect class="box" x="668" y="470" width="245" height="110" fill="#fde8e8" stroke="#c53030"/>
  <text x="790" y="503" text-anchor="middle" class="t"><tspan x="790">Destination not established</tspan><tspan x="790" dy="25">IND-CPA / quantum / Cat 5</tspan></text>
  <text x="790" y="560" text-anchor="middle" class="s">zero survivors for validation</text>

  <rect class="box" x="970" y="452" width="180" height="146" fill="#eee9ff" stroke="#6b46c1"/>
  <text x="1060" y="486" text-anchor="middle" class="t"><tspan x="1060">Next batch</tspan><tspan x="1060" dy="25">audit one known-isogeny</tspan><tspan x="1060" dy="25">maximal-order</tspan><tspan x="1060" dy="25">saturation route</tspan></text>
  <text x="1060" y="579" text-anchor="middle" class="s">or exact obstruction</text>

  <path class="edge dash" d="M530 396 V435 H187 V462"/>
  <text x="333" y="427" text-anchor="middle" class="lab">blocked</text>
  <path class="edge dash" d="M310 525 H359"/><path class="edge dash" d="M612 525 H660"/>
  <path class="edge dash" d="M745 338 H1060 V444"/>
  <text x="929" y="329" text-anchor="middle" class="lab">next discriminating action</text>

  <rect x="65" y="620" width="18" height="18" fill="#e7f6ec" stroke="#2f855a"/><text x="92" y="634" class="s">independently verified, scoped</text>
  <rect x="360" y="620" width="18" height="18" fill="#fff4d6" stroke="#b7791f"/><text x="387" y="634" class="s">open / missing interface</text>
  <rect x="650" y="620" width="18" height="18" fill="#fde8e8" stroke="#c53030"/><text x="677" y="634" class="s">requested destination not established</text>
</svg>
