<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">EndRing PKE recipient-mechanism search and security-reduction gaps</title>
  <desc id="desc">Two proposed mechanisms are compared. The labelled Hom lift has missing recipient and reduction arrows. Simultaneous conjugation has a public recovery path. The required attacker-to-complete-EndRing reduction and Category 5 evidence are absent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker>
    <style>
      .t{font:600 18px Inter,Arial,sans-serif;fill:#10243d}.h{font:700 25px Inter,Arial,sans-serif;fill:#10243d}.s{font:500 15px Inter,Arial,sans-serif;fill:#1e293b}.tiny{font:500 13px Inter,Arial,sans-serif;fill:#475569}.box{fill:#fff8dc;stroke:#8b6b00;stroke-width:2}.result{fill:#eef8ee;stroke:#25752a;stroke-width:2}.bad{fill:#ffe2e2;stroke:#8f1111;stroke-width:3}.panel{fill:#f8fafc;stroke:#64748b;stroke-width:2}.edge{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.miss{fill:none;stroke:#b42318;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#redarrow)}.label{font:600 13px Inter,Arial,sans-serif;fill:#b42318}.oklabel{font:600 13px Inter,Arial,sans-serif;fill:#166534}
    </style>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="38" text-anchor="middle" class="h">BATCH-d92210: propose → evaluate → stop at the first unsupported arrow</text>
  <rect x="390" y="58" width="620" height="66" rx="12" fill="#e8eef9" stroke="#244a7c" stroke-width="2"/>
  <text x="700" y="84" text-anchor="middle" class="t">Goal: novel public-key encryption based on complete EndRing hardness</text>
  <text x="700" y="108" text-anchor="middle" class="s">QPT/QROM security and NIST Category 5 are separate, unestablished gates</text>

  <rect x="35" y="150" width="650" height="420" rx="14" class="panel"/>
  <text x="360" y="180" text-anchor="middle" class="t">M1 — LABELLED-NORM-HOM-LIFT (construction gap)</text>
  <rect x="65" y="210" width="250" height="76" rx="10" class="box"/>
  <text x="190" y="237" text-anchor="middle" class="s">Public sender</text><text x="190" y="260" text-anchor="middle" class="s">a=m+Mr; Kₐ=⟨P+[a]Q⟩</text>
  <rect x="405" y="210" width="240" height="76" rx="10" class="box"/>
  <text x="525" y="237" text-anchor="middle" class="s">Ciphertext endpoint</text><text x="525" y="260" text-anchor="middle" class="s">c = j(E/Kₐ)</text>
  <path d="M315 248 H405" class="edge"/>
  <rect x="65" y="340" width="250" height="76" rx="10" class="box"/>
  <text x="190" y="367" text-anchor="middle" class="s">Secret complete evaluable</text><text x="190" y="390" text-anchor="middle" class="s">End(E) basis B</text>
  <rect x="405" y="340" width="240" height="76" rx="10" class="box"/>
  <text x="525" y="367" text-anchor="middle" class="s">Complete Hom(E,C)</text><text x="525" y="390" text-anchor="middle" class="s">+ norm-L fiber</text>
  <path d="M315 378 H405" class="miss"/><text x="360" y="360" text-anchor="middle" class="label">MISSING lift</text>
  <path d="M525 286 V340" class="miss"/><text x="542" y="318" class="label">MISSING exact map</text>
  <rect x="405" y="474" width="240" height="66" rx="10" class="bad"/>
  <text x="525" y="500" text-anchor="middle" class="s">Actual message m</text><text x="525" y="522" text-anchor="middle" class="tiny">singleton residue not proved</text>
  <path d="M525 416 V474" class="miss"/><text x="542" y="452" class="label">MISSING fiber bound</text>
  <rect x="65" y="474" width="250" height="66" rx="10" class="result"/>
  <text x="190" y="500" text-anchor="middle" class="s">Public reference decoder</text><text x="190" y="522" text-anchor="middle" class="tiny">O(L) quotient evaluations</text>
  <path d="M315 507 H405" class="edge"/>

  <rect x="715" y="150" width="650" height="420" rx="14" class="panel"/>
  <text x="1040" y="180" text-anchor="middle" class="t">M2 — full-module conjugation (exact syntax rejected)</text>
  <rect x="745" y="210" width="250" height="76" rx="10" class="box"/>
  <text x="870" y="237" text-anchor="middle" class="s">Public sender</text><text x="870" y="260" text-anchor="middle" class="s">X=SUS⁻¹; Y=SVS⁻¹</text>
  <rect x="1085" y="210" width="240" height="76" rx="10" class="box"/>
  <text x="1205" y="237" text-anchor="middle" class="s">Ciphertext</text><text x="1205" y="260" text-anchor="middle" class="s">(X,Y,v)</text>
  <path d="M995 248 H1085" class="edge"/>
  <rect x="1085" y="340" width="240" height="76" rx="10" class="result"/>
  <text x="1205" y="367" text-anchor="middle" class="s">PUBLIC solve</text><text x="1205" y="390" text-anchor="middle" class="s">XT=TU; YT=TV</text>
  <path d="M1205 286 V340" class="edge"/>
  <rect x="745" y="340" width="250" height="76" rx="10" class="box"/>
  <text x="870" y="367" text-anchor="middle" class="s">Secret EndRing basis W</text><text x="870" y="390" text-anchor="middle" class="tiny">not used by finite decoder</text>
  <path d="M995 378 H1085" class="miss"/><text x="1040" y="360" text-anchor="middle" class="label">BYPASSED</text>
  <rect x="1085" y="474" width="240" height="66" rx="10" class="bad"/>
  <text x="1205" y="500" text-anchor="middle" class="s">Recover N(S), then m</text><text x="1205" y="522" text-anchor="middle" class="tiny">one H query; zero Dec queries</text>
  <path d="M1205 416 V474" class="edge"/>

  <rect x="35" y="604" width="1330" height="250" rx="14" class="panel"/>
  <text x="700" y="635" text-anchor="middle" class="t">Required security direction (neither candidate supplies it)</text>
  <rect x="70" y="680" width="245" height="76" rx="10" class="box"/>
  <text x="192" y="707" text-anchor="middle" class="s">Complete-EndRing challenge</text><text x="192" y="730" text-anchor="middle" class="tiny">exact real-key distribution</text>
  <rect x="410" y="680" width="245" height="76" rx="10" class="box"/>
  <text x="532" y="707" text-anchor="middle" class="s">PKE challenge transcript</text><text x="532" y="730" text-anchor="middle" class="tiny">same public/challenge law</text>
  <rect x="750" y="680" width="245" height="76" rx="10" class="box"/>
  <text x="872" y="707" text-anchor="middle" class="s">Successful QPT attacker</text><text x="872" y="730" text-anchor="middle" class="tiny">classical challenge bytes</text>
  <rect x="1090" y="680" width="245" height="76" rx="10" class="bad"/>
  <text x="1212" y="707" text-anchor="middle" class="s">Complete evaluable</text><text x="1212" y="730" text-anchor="middle" class="s">saturated End(E)</text>
  <path d="M315 718 H410" class="miss"/><text x="362" y="696" text-anchor="middle" class="label">MISSING simulator</text>
  <path d="M655 718 H750" class="edge"/>
  <path d="M995 718 H1090" class="miss"/><text x="1042" y="696" text-anchor="middle" class="label">MISSING extractor + loss</text>
  <rect x="430" y="790" width="540" height="44" rx="9" class="bad"/>
  <text x="700" y="818" text-anchor="middle" class="t">NIST Category 5: UNESTABLISHED — no eligible scheme or parameter set</text>

  <line x1="70" y1="900" x2="145" y2="900" class="edge"/><text x="165" y="905" class="tiny">defined/computable arrow</text>
  <line x1="410" y1="900" x2="485" y2="900" class="miss"/><text x="505" y="905" class="tiny">missing proof or algorithm</text>
  <rect x="790" y="882" width="42" height="30" rx="5" class="bad"/><text x="848" y="903" class="tiny">reviewed break / failed gate</text>
  <text x="700" y="950" text-anchor="middle" class="tiny">Solid arrows are defined operations. Dashed red arrows are obligations, not assumed oracles. Zero scientific runs.</text>
</svg>

