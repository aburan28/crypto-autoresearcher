<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="210" viewBox="0 0 1080 210">
<rect width="100%" height="100%" fill="#fffdf7"/>
<text x="24" y="30" font-family="Arial" font-size="22" font-weight="700" fill="#172b36">What this search computes</text>
<rect x="23" y="65" width="158" height="93" rx="8" fill="#dcece7" stroke="#809ba0"/>
<text x="31" y="91" font-family="Arial" font-size="15" font-weight="700" fill="#172b36">48-bit start state</text>
<text x="31" y="118" font-family="Arial" font-size="12" fill="#4a5962">x = 4i + 1</text>
<path d="M182 111 L197 111" stroke="#55747a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="199" y="65" width="158" height="93" rx="8" fill="#dcece7" stroke="#809ba0"/>
<text x="207" y="91" font-family="Arial" font-size="15" font-weight="700" fill="#172b36">20 output bytes</text>
<text x="207" y="118" font-family="Arial" font-size="12" fill="#4a5962">one candidate seed</text>
<path d="M358 111 L373 111" stroke="#55747a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="375" y="65" width="158" height="93" rx="8" fill="#dcece7" stroke="#809ba0"/>
<text x="383" y="91" font-family="Arial" font-size="15" font-weight="700" fill="#172b36">SHA-1 coefficient</text>
<text x="383" y="118" font-family="Arial" font-size="12" fill="#4a5962">fixed field prime, a = -3</text>
<path d="M534 111 L549 111" stroke="#55747a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="551" y="65" width="158" height="93" rx="8" fill="#dcece7" stroke="#809ba0"/>
<text x="559" y="91" font-family="Arial" font-size="15" font-weight="700" fill="#172b36">square-root screen</text>
<text x="559" y="118" font-family="Arial" font-size="12" fill="#4a5962">b exists for about half</text>
<path d="M710 111 L725 111" stroke="#55747a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="727" y="65" width="158" height="93" rx="8" fill="#f7e7d2" stroke="#809ba0"/>
<text x="735" y="91" font-family="Arial" font-size="15" font-weight="700" fill="#172b36">exact order</text>
<text x="735" y="118" font-family="Arial" font-size="12" fill="#4a5962">PARI/GP or censored</text>
<path d="M886 111 L901 111" stroke="#55747a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="903" y="65" width="158" height="93" rx="8" fill="#f7e7d2" stroke="#809ba0"/>
<text x="911" y="91" font-family="Arial" font-size="15" font-weight="700" fill="#172b36">candidate class</text>
<text x="911" y="118" font-family="Arial" font-size="12" fill="#4a5962">published choice unknown</text>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#55747a"/></marker></defs>
<text x="24" y="187" font-family="Arial" font-size="13" fill="#4a5962">The historical keep/skip decision was not observed. The numeric orbit shard ends after the square-root screen.</text>
</svg>
