implementation:
  helper: tools/frobenius_rank_diagnostics.py
  tests: tools/test_frobenius_rank_diagnostics.py
  command_template: >-
    python3 tools/frobenius_rank_diagnostics.py
    experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/metrics.json
    --expected-sha256 4dc150e12d3bd5921d3f7da572c51420102b2fc1b392f195f2e6e2b2986fd9dc
    --output NEW_COORDINATOR_OWNED_DIAGNOSTIC_PATH.json
  semantics: >-
    The helper derives diagnostics from stored ranks; it does not recompute
    ranks, validate subgroup primeness, reverify points or replace independent
    review. It verifies input hash and coverage, uses exact rational cost
    ratios, preserves incomplete cells, and refuses to overwrite output.
  local_validation: >-
    Thirteen synthetic unittest cases passed in an isolated Python workspace.
    The full repository suite and a full-artifact diagnostic were not run in
    this GitHub editing session. No new Sage experiment was executed.

common_contract_requirements:
  - Freeze fixtures, finite sample counts, target and seed lists before measurement.
  - Separate eligibility census from outcome measurement; log all rejected objects.
  - Use independent arithmetic and exact row/solution checks; retain failed controls.
  - Charge failed attempts, setup, selection, basis conversion, orbit work and storage.
  - Keep hidden scalar labels in the checker, inaccessible to measured algorithms.
  - Preserve per-cell outcomes and incomplete cells; label-seed replicates are not new curves.
  - Separate odd-characteristic subfield curves from binary curves and prime-field controls.
  - Use new immutable run paths, snapshot, independent review and Coordinator disposition.
  - Apply progress-first research budgets; memory/concurrency protection is not a research verdict.
  - A zero Delta_rank is not a prerequisite failure for testing faster relation generation.

candidates:
  - key: rank_density_diagnosis
    priority: 1
    mechanism: >-
      A zero added-rank observation may mean no relations, no mixed relations,
      dependent mixed rows, or no available ambient rank. These mechanisms call
      for different successors and must not share a broad negative verdict.
    work: >-
      Run the helper over all stored covers/presentations, then independently
      inspect selected pivot and point witnesses from each nonempty category.
      For U nonidentity columns, verified homogeneous rows annihilate the
      nonzero logarithm vector, so rank <= U-1. Report U-1-rank_same as an
      ambient upper-bound headroom, not guaranteed attainable rank.
    controls:
      - Single-base Delta_rank=0 and global-Frobenius scalar-multiple rank-null controls.
      - Saturated, zero-relation, dependent-row and positive-span synthetic fixtures.
      - Reject cover omissions, duplicates, hash changes and inconsistent rank/pair counts.
    metrics:
      - Per-cover same/all ranks, ambient headroom, accepted/mixed pair counts and exact cost ratios.
      - Rank growth versus cumulative charged work, if raw ordering supports reconstruction.
    decision: >-
      Scarcity routes to geometry/arity; dependence routes to quotient/pivot
      structure; saturation routes to time-to-common-rank and target-solving
      tests. Positive span routes to full-cost replication. Preserve overlap
      flags rather than pretending the categories prove unique causality.
    required_artifacts: [diagnostic.json, witness_selection.json, independent_check.md]
    formal_followup: >-
      Freeze the finite-field rank/nullspace lemma and its exact correspondence
      to nonidentity homogeneous columns as a Lean target. Compilation and
      independent semantic review are required before claiming formal proof.

  - key: eligibility_complete_replication
    priority: 2
    mechanism: >-
      Distinguish a finite curve-pool eligibility failure from failure of the
      mixed-incidence prediction, while retaining the completed zero findings.
    work: >-
      First freeze an outcome-blind eligibility census over proposed cells
      (q,n)=(7,3),(11,3),(11,5),(13,3),(17,3). Reuse explicit subgroup,
      j-distinctness and lawful-orbit requirements. Record eligible counts and
      every rejection. Freeze the successor panel and deterministic selection
      before ranks are measured; propose at least four distinct j values in
      each admitted stratum where the census supports them. Publish strata
      with insufficient eligibility, rather than hiding them or rank-shopping.
    controls:
      - Retain original q=7,n=3 missing cell and both q=11,n=5 zero findings unchanged.
      - Repeat matched-null membership/overlap controls; do not claim isolated Frobenius causality.
      - Include independent curves, not merely different label seeds.
    metrics: [eligibility_counts, accepted_relation_density, mixed_rank_gain, ambient_headroom, total_setup_cost]
    decision: >-
      The successor is a new panel with a new claim boundary; it cannot make the
      historical 9/12 experiment complete. Failure narrows this module/arity
      slice, not all Frobenius-assisted decomposition.
    required_artifacts: [eligibility_census.jsonl, frozen_panel.json, per_cell_results.json, review.md]

  - key: module_geometry_and_arity
    priority: 3
    mechanism: >-
      Degree-1/2 invariant modules and signed triples may be too sparse or
      poorly connected to exhibit mixed relations, even when a different
      geometry or larger arity would produce useful independent rows.
    work: >-
      Compare the original modules against degree-3 module candidates, sums of
      invariant subspaces, and explicitly computed Frobenius/negation closures
      of affine cosets. Compare homogeneous relation arities 3 and 4; record
      separately the number of summands in subsequent target decompositions.
      Retain empty and duplicate bases. Verify actual point-set closure and
      scalar weights; coordinate-subspace invariance is not a point identity.
    controls:
      - Matched union cardinality and quotient-column count, or explicitly stratified unmatched cases.
      - Matched membership intersections and random point-set controls where possible.
      - Compare same-base versus mixed rows in exactly the same union columns.
      - Charge larger unions, larger arity, basis construction and every unsuccessful attempt.
    metrics: [relation_density, rank_per_attempt, rank_per_cpu_second, nullity, memory_bytes]
    decision: >-
      Promote a finite geometry only on reproducible informative-row cost or
      target-solve benefit. More relations from a larger enumeration alone are
      not a gain. Refute only the exact tested geometry/arity prediction.
    required_artifacts: [candidate_bases.json, membership_checks.json, relation_witnesses.json, cost_frontier.json]

  - key: direct_orbit_aware_decomposition
    priority: 2
    existing_candidates:
      - EXP-FROB-STABSTRATA-002
      - EXP-FROB-GBORDER-002
      - EXP-SDEG-BASISSURR-001
      - EXP-SDEG-ACTIVEBASIS-001
    mechanism: >-
      Frobenius may help produce the same informative row space more cheaply,
      even when it adds no final rank. Test orbit structure inside the solver,
      not only as post-generation column compression.
    work: >-
      Complete contracts for the existing candidates. Compare raw coordinates,
      representative-plus-relative-shift encoding, and orbit/block ordering
      on identical point-decomposition instances. Hold equations fixed for
      ordering-only tests. Compare polynomial/normal bases with conversion
      charged. Verify all solutions on exhaustive tiny instances before
      scaling to held-out targets and curves. Guided search must beat
      equal-cost random search after selection and training costs are included.
    controls:
      - Exact solution-set correspondence including orbit stabilizers and signs.
      - A fixed target is not invariant under Frobenius unless explicitly verified.
      - Simultaneous conjugation transforms the target too; do not delete solutions through invalid gauge fixing.
      - Global conjugates of one lawful reduced row are scalar copies, not independent relations.
      - Separate binary curve equations and negation from the odd-characteristic implementation.
    metrics: [solver_time_distribution, solved_fraction, seconds_per_independent_row, peak_memory, target_recovery_cost]
    decision: >-
      Test regardless of parent Delta_rank sign. A reproducible reduction in
      end-to-end collection cost at common rank can justify continuation even
      when the final span is unchanged. Report finite gains without exponent claims.
    required_artifacts: [frozen_instances.json, equivalence_checks.json, solver_logs, held_out_results.json]

  - key: exact_macaulay_symmetry
    priority: 3
    existing_candidates: [EXP-FROB-CHARMAC-002]
    mechanism: >-
      Determine whether cyclic symmetry survives in the actual coefficient
      matrices before building a symmetry-specialized elimination solver.
    work: >-
      Complete the existing candidate with explicit row and column actions.
      For an r-by-c matrix M, compute F_rows*M-M*F_columns using r-by-r and
      c-by-c actions, not an undefined square-matrix commutator. Verify exact
      equivariance. For a nonfixed target, use a correctly indexed target-orbit
      family or its actual stabilizer; combining equations for distinct targets
      by intersection changes the problem and is not a valid shortcut.
    controls:
      - Exact invertible transforms, ranks and reconstructed solution sets.
      - Synthetic equivariant positive control and symmetry-broken negative control.
      - Characteristic dividing the action order requires nonsemisimple treatment, not assumed diagonalization.
      - Charge any coefficient-field extension, projection and inverse transformation.
    metrics: [intertwiner_defect_rank, exact_block_sizes, off_block_nonzeros, full_elimination_cost]
    decision: >-
      Nonzero leakage must be retained in an exact solve; dropping small blocks
      is not valid. A failed character split narrows that representation, not
      every orbit-aware encoding or factor-base family.
    required_artifacts: [actions.json, matrices, exact_transform_certificate.json, timing.json]

  - key: end_to_end_and_scaling
    priority: 4
    mechanism: >-
      Resolve whether any structural or solver benefit survives relation
      collection, sparse linear algebra, normalization and target recovery.
    work: >-
      On identical public curve/target fixtures compare the strongest surviving
      collector against its unmodified collector, BSGS where feasible, and
      optimized rho with the applicable negation/Frobenius symmetries. Freeze
      sizes, seeds and fresh held-out curves before timing. Provide separately
      single-target and amortized multi-target totals; precomputation is never free.
    controls:
      - Measured algorithms cannot access full subgroup scalar lookup tables used by the checker.
      - Verify every recovered scalar by multiplication on the original curve.
      - Report failed targets and resource exits; do not fit only successes.
      - Match memory and account for all setup/search/conversion costs and unsuccessful candidates.
    metrics: [total_cpu_and_wall_time, memory_bytes, success_rate, cost_per_recovered_target, amortization_break_even]
    decision: >-
      Compare distributions and full time-memory frontiers. Treat the parent's
      20-percent full-cost target as a prospective test threshold, not a
      measured benefit. A fitted toy slope is not an asymptotic proof, and
      results on subfield/binary curves do not transfer automatically to P-256
      or secp256k1 over their prime base fields.
    required_artifacts: [target_certificates.json, full_costs.json, baseline_logs, uncertainty_analysis.md]

next_action: >-
  Coordinator admits a new hash-bound rank/density diagnostic task using the
  supplied helper, and completes the existing direct-decomposition contracts
  as a parallel research track. Then freeze an eligibility-complete successor
  and geometry/arity comparisons. No fresh user approval is required.
continuation_policy: >-
  Evidence archival is a checkpoint, not research retirement. Each completed
  stage records a concrete successor or a narrowly evidenced technical
  impediment and recheck. Missing objects, runtime failures, limited toy panels,
  zero extra rank and completed review paperwork alone do not close this lane.
  Preserve genuine negative evidence and narrow failed mechanisms without
  upgrading the hypothesis or forcing repeated identical experiments.
