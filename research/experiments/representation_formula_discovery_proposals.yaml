representation_ir:
  field_spec: Characteristic, size, defining polynomial where applicable, arithmetic backend and exact serialization.
  group_spec: Original curve coefficients, verified nonsingularity, group order, selected prime subgroup order
    N, cofactor, identity and subgroup membership rule.
  field_basis: Forward/inverse matrices and conversion circuit when a genuine extension-field basis change
    is used; not a fictitious bit-vector field basis for F_p.
  point_map: Chart formulas, inverse/lift, domain conditions, coverage of exceptional points and identity transport.
  preserved_object: Same curve/group, same ideal, graded-isomorphic ideal, same projected solution set, or
    quotient with certified lift. Do not conflate these.
  equation_dag: Typed operations, auxiliary definitions, field and subgroup constraints, target transport and
    denominator handling.
  factor_base: Original full-point manifest, membership predicate, actual cardinality, sign convention and
    selection cost.
  symmetry: Actual group action, field of definition, target stabilizer or target-orbit transport, orbit-length
    and lifting certificates.
proposed_protocol:
  not_yet_frozen: true
  binary_field_degrees:
  - 11
  - 13
  - 17
  - 19
  - 23
  prime_field_bit_sizes:
  - 11
  - 13
  - 17
  - 19
  - 23
  curve_families:
  - ordinary prime-field curves
  - ordinary binary curves
  - binary Koblitz curves as a separately reported structured family
  curve_selection: Freeze exact field, curve, subgroup and seed manifests before execution. For random families
    use independent curve classes; for Koblitz use the available F2 model cases and held-out extension degrees
    rather than pretending isomorphic copies are independent curves.
  decomposition_arities:
  - 3
  - 4
  base_sizes: Let B0 be the smallest integer with B0^m >= N. Compare ceil(B0/2), B0, 2*B0 when valid, matching
    actual full-point counts. Record unavailable cells without substitution.
  proposed_uniform_targets_per_cell: 256
  proposed_target_seed_values: 0 through 255, expanded by domain-separated SHA-256 using experiment slug, field,
    curve, subgroup, arity and phase; freeze exact generation and rejection-sampling algorithm in the canonical
    specification.
  instrument_controls: Separate planted SAT, certified UNSAT, deliberately malformed representations and original-curve
    oracle fixtures. Never pool these with uniform targets.
  data_split: Group all representations of the same underlying curve into one split. Fit surrogates on discovery
    only, choose candidates on validation, and report final paired results on untouched test curves/degrees
    and fresh targets. Freeze the split manifest before search.
  comparison_policy: Candidate search and random-search controls get matched candidate-evaluation and full-solve
    counts. These are scientific comparison controls, not default research spending caps.
  primary_relation_metric: Total charged generation, construction, solve, lift, verify and rank-tracking time
    divided by useful rank increase. Zero rank increase is never represented as zero cost.
  full_attack_metric: Cold search + setup + relation collection + linear algebra + target recovery. Show separately
    declared reuse scenarios and memory.
  statistical_plan: Paired comparisons on identical instances; uncertainty clustered by underlying curve and
    repeated target panel. Log all trials and censoring. Use preregistered effect targets; do not estimate
    asymptotic exponents from a short toy ladder.
  machine_protection: Freeze explicit per-process memory/concurrency settings and watchdog/checkpoint behavior
    at dispatch. Record their justification. A resource interruption is not a negative mathematical result.
  routine_campaign_spending_cap: null
  required_freeze_fields:
  - exact parameters and instance manifests
  - canonical IDs and dependencies
  - solver/compiler versions and flags
  - candidate grammar and search seed
  - matched controls and target distributions
  - process-protection settings
  - full command lines
  - hash-bound artifact paths
  - independent review handoffs
  - current knowledge and ledger deduplication plus frontier comparison
  - proof-search-map audits and exact Lean target for proof-oriented tasks
proposals:
- draft_slug: addition-law-superoptimization
  title: Synthesize cheaper, certified addition-law circuits
  lane: rho_arithmetic
  priority: parallel practical lane
  hypothesis: A bounded search around verified formulas can find a cheaper straight-line program for the actual
    rho transition workload, even when the underlying coordinate system is unchanged.
  mechanism: Use counterexample-guided synthesis to search a typed finite-field arithmetic DAG. A synthesizer
    proposes a circuit; an independent checker finds a failing valid input or proves the claimed identity on
    its declared domain. Counterexamples constrain future candidates.
  search_space:
  - Start with mixed addition P + A for a public affine step-table point A. Treat per-entry specialization
    and one circuit accepting arbitrary A as separate arms.
  - 'Mutations: algebraic factoring, common-subexpression sharing, reassociation, square-versus-multiply selection,
    dependency scheduling, cached-coordinate selection, and admissible coordinate choices.'
  - 'Grammar operations: add, subtract, multiply, square, multiplication by declared constants; inversion only
    in separately labeled grammar families.'
  - Seed from applicable EFD formulas. Search increasing circuit-size/cost frontiers; do not treat a bounded
    grammar as all possible formulas.
  controls:
  - Reference point addition independently implemented; exhaustive pairs on tiny fields and randomized differential
    testing at larger sizes.
  - Explicit identity, inverse-point, doubling, zero-denominator, infinity, and valid-projective-scaling cases.
  - Known-bad formula with a deleted term and known-incomplete formula used outside its domain must be rejected.
  - Compare against both unmodified reference formulas and ordinary compiler optimization of the same formulas.
  - 'Verify field semantics: prime-field products must not silently become arithmetic modulo 2^word_bits; binary
    products require the frozen irreducible-polynomial reduction.'
  primary_metrics:
  - verified transition wall time including exceptional-case handling
  - full rho time-to-collision distribution after integration
  secondary_metrics:
  - multiplications, squarings, inversions, additions
  - dependency depth
  - register use and spills
  - code and precomputation size
  - synthesis and compilation cost
  promotion_gate: 'Proposed engineering gate: at least 10% lower median complete-transition time than the strongest
    matched baseline, a paired confidence interval excluding no improvement, no correctness failures, and no
    worse collision-step distribution. This is a chosen target, not an expected result.'
  falsification: Reject the specific candidate if it fails any domain case or its apparent operation-count
    gain disappears in compiled complete-transition measurements. A search timeout does not refute the formula
    family.
  proof_obligations:
  - For every valid input in the stated domain, decode(candidate(encode(P), A)) = P + A.
  - Every excluded input has a correct, charged fallback; symbolic identities and finite-instance SAT certificates
    have explicitly different scope.
  artifacts:
  - grammar.json
  - candidate_dag.json
  - formula_domain.json
  - counterexamples.jsonl
  - identity_certificate/
  - generated_kernel/
  - benchmark_manifest.json
  source_keys:
  - S1
  - S8
  novelty_status: unresolved
- draft_slug: rho-coordinate-workload-codesign
  title: Optimize coordinates, batching, and the rho walk as a complete workload
  lane: rho_arithmetic
  priority: parallel practical lane
  hypothesis: The best representation for a full collision-search iteration differs from the winner of an isolated
    point-addition benchmark.
  mechanism: Run a factorial benchmark of coordinate storage, field representation, batch inversion, step-table
    design, partition computation, and distinguished-point detection. Separate arithmetic-only changes from
    walk changes so that different mixing behavior is not attributed to faster coordinates.
  search_space:
  - 'Prime-field arms: applicable Jacobian/projective/mixed formulas and batched affine addition with a verified
    batch-inversion implementation.'
  - 'Binary-field arms: polynomial, normal, and certified hybrid field-basis implementations, with conversion
    work charged.'
  - 'Candidate batch sizes for the first design: 1, 8, 32, 128, 512. These are scientific comparison points,
    not campaign spending caps.'
  - Optional quotient walks require a verified group action and correct coefficient-label transport. X-only
    differential addition is admissible only with its required difference state.
  controls:
  - First hold the mathematical transition function, step table, point-level partition, seeds, and distinguished-point
    predicate fixed.
  - Two projective encodings of the same point must produce the same mathematical next point and distinguished-point
    decision, unless a rigorously specified extended-state walk is intentionally being tested.
  - When a walk changes, separately measure short cycles, restarts, collision-step distributions, useful collisions,
    endpoint traffic, and coefficient recovery.
  - Reference invariant X = aG + bQ is verified throughout toy runs; endomorphism or negation operations update
    a and b modulo subgroup order N.
  - Compare like-for-like hardware, precision, compiler settings, occupancy and measurement scope.
  primary_metrics:
  - end-to-end time to a verified useful collision on toy instances
  - wall time per complete transition on full-size arithmetic-only panels
  secondary_metrics:
  - steps per useful collision normalized by sqrt(N)
  - distinguished-point and normalization overhead
  - fruitless-cycle and restart rates
  - memory traffic and peak memory
  - network or queue overhead where applicable
  promotion_gate: At least 10% improvement in complete-workload time with independent reproduction and no statistically
    supported mixing regression. Full-size kernel throughput is labeled arithmetic evidence, not a full-size
    DLP recovery.
  falsification: A candidate does not survive if cheaper additions are offset by point normalization, conversion,
    endpoint handling, or additional steps to useful collisions.
  proof_obligations:
  - The walk and endpoint key are well defined on the declared state space.
  - Every accepted collision yields a correctly checked scalar equation; degenerate equations are not counted
    as recoveries.
  artifacts:
  - walk_spec.json
  - state_equivalence_tests.json
  - kernel_metrics.json
  - collision_trials.jsonl
  - endpoint_costs.json
  source_keys:
  - S1
  - S9
  novelty_status: unresolved
- draft_slug: relation-circuit-synthesis
  title: Search equivalent low-degree circuits for point decomposition
  lane: index_calculus
  priority: first scientific experiment
  hypothesis: Different exact presentations of P1 + ... + Pm = R can expose sufficiently different sparsity,
    propagation, and elimination structure to improve verified relation throughput.
  mechanism: Treat the decomposition equation as a compiler input and search its expression DAG, auxiliary
    variables, and exact lifting constraints rather than only renaming variables.
  search_space:
  - 'Baselines: direct Semaev polynomial where construction is feasible; a documented chain of S3 equations;
    and an exact full-point addition encoding.'
  - 'Alternatives: balanced addition trees, hybrid elimination retaining selected intermediate points, and
    redundant product variables with defining equations.'
  - 'Example for four summands: encode U=P1+P2, V=P3+P4, U+V=R, then compare with a left-associated chain on
    identical original points and targets.'
  - Compile each applicable presentation to finite-field polynomial systems and, for binary fields, XOR-preserving
    Boolean constraints. Prime-field bit encodings are a separate, fully charged backend.
  - Keep field basis, factor base and target set fixed in the first ablation. Only then cross the winning encoding
    family with existing basis/ordering proposals.
  controls:
  - Exact small-instance decomposition enumeration or MITM oracle. It must be separate from the experimental
    solver and may not leak scalar labels.
  - 'Both soundness and completeness checks: every returned solution lifts correctly, and every oracle decomposition
    is represented by at least one valid assignment on exhaustively checked tiny cases.'
  - Use uniformly sampled targets for throughput; planted satisfiable and certified unsatisfiable inputs are
    separate instrument controls.
  - Include curve equations, field membership, subgroup membership as required, sign/lift choices, infinity
    branches and denominator-domain constraints.
  - A Semaev root over an algebraic closure is not automatically a decomposition over the original field and
    subgroup.
  - Measure relation rank modulo subgroup order N, not modulo 2 merely because coordinates are binary-field
    elements.
  primary_metrics:
  - charged seconds per independently useful verified relation
  - time and peak memory to a fixed target relation rank
  secondary_metrics:
  - compile and construction time
  - solver time and solved fraction
  - observed maximum solving degree with precise definition
  - Macaulay dimensions, nonzeros and rank by degree
  - SAT conflicts, decisions and propagations
  - lift rejection and duplicate rates
  promotion_gate: 'Proposed empirical gate: at least 25% lower charged relation cost on the two largest completed
    held-out sizes, a paired uncertainty interval excluding no improvement, no semantic failures, and no unreported
    loss of solved fraction. If evidence is too censored or thin, report inconclusive and design an additive
    replication.'
  falsification: The mechanism is unsupported in the tested slice if degree reduction merely shifts the expense
    to extra variables, denser matrices, harder UNSAT instances, lost decompositions, or lower relation rank.
  proof_obligations:
  - Projection of the constrained auxiliary-variable solution set equals the original decomposition set on
    the stated field/subgroup and chart domains.
  - Decomposition signs and intermediate-point compatibility are globally consistent, not checked independently
    per local equation.
  artifacts:
  - representation_ir.json
  - equations/
  - boolean_instances/
  - solution_map_certificate/
  - oracle_checks.json
  - solver_logs/
  - relations.jsonl
  - rank_trace.jsonl
  source_keys:
  - S2
  - S3
  - S4
  - S5
  - S6
  novelty_status: unresolved
- draft_slug: point-chart-factor-base-codesign
  title: Jointly search point charts and inexpensive factor-base predicates
  lane: index_calculus
  priority: after equivalent-encoding baseline
  hypothesis: A chart can make a useful factor-base membership condition cheaper to express without losing
    enough decomposition probability or independent-relation yield to erase the gain.
  mechanism: 'Use a two-stage ablation: first transport an identical set of original points through certified
    charts; then allow the chart-dependent predicate to define a new base of matched cardinality.'
  search_space:
  - Start with invertible triangular affine charts such as u=x+c*y, v=y, with explicit inverse x=u-c*v, y=v.
  - Then bounded-degree triangular polynomial charts and rational x-chart changes u=(a*x+b)/(c*x+d) with nonzero
    determinant and an explicit inverse.
  - Rational poles and infinity remain covered by additional charts or exact fallback branches; do not discard
    them to improve timings.
  - Compare membership predicates based on transported original sets, simple coordinate restrictions, and binary
    linear subspaces only where the field really has the relevant vector-space structure.
  - Edwards/Montgomery/Jacobi model changes are a separate eligible-model arm; prove field of definition, map
    domain and subgroup transport rather than assuming every curve has every model.
  controls:
  - Stage A freezes the actual factor-base point list and every target. A reversible chart alone cannot change
    the existence of these decompositions.
  - Stage B matches full-point cardinality B and charges selection, sampling, conversion, predicate compilation
    and membership costs.
  - Include random charts, standard coordinates, and equal-search-effort random candidate selection.
  - Track sumset support, duplicates, rank growth and held-out target success, not just Boolean monomial counts.
  - Do not provide factor-base discrete logarithms or precomputed group-wide lookup tables to the solver without
    labeling and charging that information.
  primary_metrics:
  - net charged seconds per independent relation
  - total toy index-calculus recovery time including setup and target phase
  secondary_metrics:
  - predicate circuit size
  - true decomposition probability
  - sumset support on oracle-feasible sizes
  - relation redundancy
  - chart coverage and exceptional-point fraction
  - search break-even reuse count
  promotion_gate: At least 20% net relation-cost improvement on held-out instances after search and construction
    accounting. Report cold-start and declared-reuse results separately; a convenient encoding by itself is
    not success.
  falsification: A candidate fails this objective if it gains by shrinking the true base, removing difficult
    points, leaking scalar structure, concentrating sums on too few targets, or assuming free chart conversion.
  proof_obligations:
  - Forward and inverse maps agree on every claimed chart domain; chart union covers every point required by
    the declared experiment.
  - Transported group-law constraints are used for arbitrary charts; a coordinate map is not automatically
    a group homomorphism under an unrelated target-model addition law.
  artifacts:
  - chart_spec.json
  - inverse_and_domain_certificate/
  - factor_base_points.json
  - predicate_circuit.json
  - coverage_tests.json
  - sumset_summary.json
  - relation_costs.json
  source_keys:
  - S2
  - S3
  novelty_status: unresolved
- draft_slug: representation-mechanism-audit
  title: Distinguish solver tuning from changed algebraic structure
  lane: shared_validation
  priority: first dependency
  hypothesis: Many apparent representation improvements are attributable to solver scheduling, sparsity or
    changed instance semantics; a structured audit can distinguish those mechanisms and identify the gains
    that genuinely transfer.
  mechanism: Record which mathematical object is preserved by each transform. Compare graded invariants where
    applicable, solution-set certificates, sparsity, observed solving degree, and end-to-end cost as separate
    quantities.
  search_space:
  - 'Arm 1: variable permutation or invertible linear variable change of the same precisely specified homogeneous
    ideal.'
  - 'Arm 2: different generators for the same ideal; certify equality where feasible.'
  - 'Arm 3: nonlinear reversible chart or auxiliary-variable embedding; compare projected solution sets, not
    an unjustified assertion that the two ideals are identical.'
  - Use this audit on the existing BASISSURR, ACTIVEBASIS and GBORDER proposals rather than creating duplicate
    basis-search experiments.
  - 'Add an applicability certificate to orbit-aware candidates: curve, factor base, target equation, subgroup
    and lifting rules must support the claimed action.'
  controls:
  - An invertible homogeneous linear substitution induces a graded isomorphism, so the homogeneous quotient
    Hilbert function must be unchanged; the corresponding intrinsic regularity is also invariant. Use exact
    tiny examples to verify the instrument.
  - Do not identify input degree, first-fall degree, observed solving degree and Castelnuovo-Mumford regularity.
    Every metric must record its definition and whether it was measured, bounded, or unknown.
  - A random curve over F_(2^n) need not be preserved by (x,y)->(x^2,y^2); that operation also squares its
    coefficients. Certify the actual field of definition.
  - For a fixed target R, simultaneous Frobenius sends the target to pi(R). Either use its stabilizer, or transform
    and restore the entire target instance with costs recorded.
  - On E(F_p), p-power Frobenius fixes rational points. Do not import a nontrivial binary Frobenius-orbit model
    into the prime-field arm.
  - For a rectangular Macaulay map use compatible row and column actions, testing M*F_domain = F_codomain*M.
    Do not form an ill-typed square commutator or drop small but nonzero blocks.
  primary_metrics:
  - fraction of proposed transforms receiving a correct mechanism classification
  - held-out net gain for each surviving mechanism class
  secondary_metrics:
  - graded Hilbert-function agreement where applicable
  - ideal or projected-solution equivalence
  - definition and provenance of each degree metric
  - symmetry eligibility failures
  - exact block leakage
  promotion_gate: Every accepted candidate has an explicit preserved-object statement, domain certificate,
    and correctly scoped interpretation. Existing measured improvements may be retained as solver/implementation
    gains even when intrinsic invariants do not change.
  falsification: Reject the stated structural interpretation when its supposedly changed invariant is mathematically
    preserved, or when the proposed symmetry does not preserve the declared instance. This does not automatically
    reject a separately verified engineering gain.
  proof_obligations:
  - For homogeneous I and invertible linear phi, establish the graded isomorphism S/I ~= S/phi(I), including
    the declared grading.
  - For each symmetry rule, prove or finitely certify equivariance and the target/lift transport required by
    that exact rule.
  artifacts:
  - transform_classification.json
  - invariant_checks.json
  - degree_metric_dictionary.json
  - symmetry_certificate/
  - known_false_controls.json
  source_keys:
  - S2
  - S6
  - S9
  - S10
  novelty_status: unresolved
- draft_slug: restricted-lower-bounds-and-cost-audit
  title: Derive checkable method ceilings and break-even requirements
  lane: theory_and_accounting
  priority: first dependency
  hypothesis: Explicitly model-bounded lower bounds and charged cost decompositions can expose the exact bottleneck
    a candidate must improve, without incorrectly declaring coordinate-aware ECDLP algorithms impossible.
  mechanism: 'Build two proof tracks: finite-grammar circuit exclusions using checked UNSAT certificates, and
    exact combinatorial bounds for restricted relation-generation models. Attach every conclusion to its assumptions
    and let promising candidates challenge those assumptions explicitly.'
  search_space:
  - Given a frozen circuit grammar, field, domain and cost bound k, synthesize a valid formula or certify that
    no circuit in that grammar and cost region satisfies the specification.
  - For a fixed full-point factor base F of size B in a subgroup of order N and exactly m summands with repetitions
    allowed, certify |mF| <= min(N, binom(B+m-1,m)).
  - For a uniform target independent of F, p_dec = |mF|/N. Treat distinct-summand, signed-point, multi-output
    and target-adaptive variants as different models.
  - 'Maintain full cost: search + setup + relation generation + lifting/verification + rank tracking + linear
    algebra + target recovery. Report memory and cold-start/reuse scenarios.'
  - Formalize the smallest decision-relevant finite counting lemma in the existing Lean lane once the exact
    statement and dependencies are frozen.
  controls:
  - Shoup generic-group bounds are attached only to their generic-model scope, with preprocessing and oracle
    access explicit. They are not universal bounds for coordinate-aware index calculus.
  - Planted targets must not be used to estimate uniform-target decomposition probability.
  - Count full signed points, not raw x-coordinate entries; use binom(B+m-1,m), not an unjustified exact B^m/m!
    formula.
  - Independent checking of SAT certificates and encoding semantics; a solver timeout or unchecked UNSAT string
    is not a proof.
  - 'Known-false controls: an omitted chart denominator, an unavailable symmetry, free preprocessing, and a
    fabricated low-cost scalar lookup must all trigger scope/cost failures.'
  - A failed bounded search closes only the frozen grammar and tested bound, never the entire representation
    family or ECDLP.
  primary_metrics:
  - fully scoped verified certificates
  - measured and modeled cold-start cost relative to matched rho and applicable MITM baselines
  secondary_metrics:
  - minimum useful-relation success rate required to win
  - search amortization break-even count
  - memory-time tradeoff
  - sensitivity to relation redundancy and target distribution
  promotion_gate: A bound or exclusion is eligible for a conclusion only after its assumptions, quantifiers,
    encoder and certificate receive independent review. A candidate speedup is considered separately from whether
    its total attack beats rho.
  falsification: Withdraw or narrow the bound when a verified counterexample satisfies the written assumptions.
    If an algorithm escapes an assumption, register the changed model rather than mislabeling it as a contradiction.
  proof_obligations:
  - State all quantifiers, especially whether F is fixed before a uniform target is drawn.
  - If each attempt costs at least c and produces at most one useful relation, a uniform-target success upper
    bound p_max gives expected work at least R*c/p_max for R useful outputs under the declared repeated-trial
    assumptions. Do not apply this automatically to adaptive or multi-output algorithms.
  - A circuit UNSAT certificate proves only the exact grammar, cost model, parameters and allowed input domain
    encoded.
  artifacts:
  - cost_model.json
  - assumption_ledger.md
  - finite_count_certificate/
  - bounded_grammar.cnf
  - unsat_certificate/
  - certificate_check.log
  - break_even_report.json
  - formal_target_spec.yaml
  source_keys:
  - S7
  - S8
  novelty_status: unresolved
