<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Proposed prime63 phase trace and fail-closed monitor</title>
<desc id="desc">A synthetic-only validated monitor and prospective Sage phase path; the six historical positive timeouts remain censored.</desc>
<style>.box{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.guard{fill:#fef3c7;stroke:#b45309;stroke-width:2}.raw{fill:#ecfdf5;stroke:#047857;stroke-width:2}.t{font:16px sans-serif;fill:#111827}.s{font:13px sans-serif;fill:#374151}.head{font:bold 19px sans-serif;fill:#111827}.arr{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#374151"/></marker></defs>
<text class="head" x="30" y="38">Prime63 monitor and phase custody — engineering source, no solver trial in this task</text>
<rect class="box" x="28" y="78" width="210" height="92" rx="10"/><text class="t" x="43" y="108">Archived m=2 requests</text><text class="s" x="43" y="131">coset · random · small-x</text><text class="s" x="43" y="150">prospective diagnostic only</text>
<rect class="box" x="360" y="78" width="250" height="92" rx="10"/><text class="t" x="374" y="107">Instrumented backend</text><text class="s" x="374" y="129">load → ring → Gröbner</text><text class="s" x="374" y="149">count → roots → response</text>
<rect class="guard" x="688" y="78" width="240" height="92" rx="10"/><text class="t" x="702" y="107">RSS and wall watchdog</text><text class="s" x="702" y="129">live unreadable → fault</text><text class="s" x="702" y="149">exit race → reap/terminal</text>
<path class="arr" d="M238 123 H355"/><path class="arr" d="M610 123 H683"/>
<rect class="raw" x="360" y="238" width="250" height="105" rx="10"/><text class="t" x="374" y="268">Append-only phase.jsonl</text><text class="s" x="374" y="291">fsync each transition/sample</text><text class="s" x="374" y="312">partial trace survives kill</text>
<rect class="raw" x="688" y="238" width="240" height="105" rx="10"/><text class="t" x="702" y="268">Raw custody</text><text class="s" x="702" y="291">request/response if present</text><text class="s" x="702" y="312">trace/stdout/stderr SHA-256</text>
<path class="arr" d="M485 170 V232"/><path class="arr" d="M810 170 V232"/><path class="arr" d="M610 290 H683"/>
<text class="s" x="30" y="385">Validated here: 10 synthetic tests, including 20 fast exits. Historical RUN-ICPERF-7ed866: 6 positive calls censored at 300 s.</text>
</svg>
