<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">Prime63 one-trial admission sequence</title>
  <desc id="desc">An engineering fixture shows ready before supervisor dispatch, a bound in-flight launch after run directory creation, and exact parent and checker admission. Forged or stale metadata is refused.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#43526b"/></marker>
    <style>
      .bg{fill:#f7f9fc}.box{fill:white;stroke:#52637d;stroke-width:2;rx:12}.pass{fill:#e4f4e9;stroke:#35834b;stroke-width:2;rx:12}.deny{fill:#fff0ed;stroke:#ba5143;stroke-width:2;rx:12}
      .head{font:700 20px -apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#16243a}.label{font:600 15px -apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#1f2c42}.small{font:13px -apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#35445c}.arrow{stroke:#43526b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="390"/>
  <text class="head" x="40" y="40">Bound admission across the standard supervisor</text>
  <text class="small" x="40" y="65">TASK-20261017-7fbab5 · engineering fixture · one trial · zero Sage calls</text>
  <rect class="pass" x="40" y="100" width="218" height="132"/>
  <text class="label" x="60" y="129">Before dispatch</text>
  <text class="small" x="60" y="155">ordinary selector: ready</text>
  <text class="small" x="60" y="176">frozen plan + live claim</text>
  <text class="small" x="60" y="197">exact owner / epoch</text>
  <path class="arrow" d="M260 166 H300"/>
  <rect class="box" x="305" y="100" width="226" height="132"/>
  <text class="label" x="325" y="129">Supervisor</text>
  <text class="small" x="325" y="155">creates run directory</text>
  <text class="small" x="325" y="176">writes launch.json</text>
  <text class="small" x="325" y="197">then starts driver</text>
  <path class="arrow" d="M533 166 H573"/>
  <rect class="pass" x="578" y="100" width="230" height="132"/>
  <text class="label" x="598" y="129">Parent and checker</text>
  <text class="small" x="598" y="155">load_plan + authorize</text>
  <text class="small" x="598" y="176">bind exact launch + claim</text>
  <text class="small" x="598" y="197">in-flight state accepted</text>
  <path class="arrow" d="M810 166 H850"/>
  <rect class="pass" x="855" y="100" width="225" height="132"/>
  <text class="label" x="875" y="129">Fixture outcome</text>
  <text class="small" x="875" y="155">1 validated trial</text>
  <text class="small" x="875" y="176">parent + checker admitted</text>
  <text class="small" x="875" y="197">second attempt refused</text>
  <rect class="deny" x="305" y="270" width="503" height="80"/>
  <text class="label" x="325" y="298">Fail-closed controls</text>
  <text class="small" x="325" y="323">stale/forged launch, altered source, missing/expired claim, wrong owner/epoch</text>
  <path class="arrow" d="M675 233 V265"/>
  <text class="small" x="40" y="375">Synthetic approval/claim fixture; a genuine approved plan and live-claim run remain a later gate.</text>
</svg>
