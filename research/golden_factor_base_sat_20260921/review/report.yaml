      required_bootstrap_uppers_below: 1.0
      required_prefix_delta_at_least: 0.10
      observed: "All eight held-out cases valid, but all three wall medians exceed 0.80 and prefix median is 0.0. The finite N7 effect gate fails for this implementation."
      finding: holds
  control_checks:
    - "Independent GF(2^7) and curve arithmetic enumerated 142 curve points, 71 order-71 subgroup points, generator (3,85), normal beta 9 and its 7 columns; candidate index 0, 14 x-values/28 points and null arrival 15, 14 x-values/28 points match the frozen basis manifest. All 64 selector slots, all 134 public Q/scalar mappings, and both full point sets matched."
    - "70 fixed controls: 4 exact SAT and 66 exact UNSAT by independent finite point oracle; 2 charged shortcuts, 2 CMS SAT exits 10, and 66 CMS UNSAT exits 20. Their 68 CMS instances contain original CNF/XOR rows consistent with the manifests. No independent proof trace for CMS UNSAT was supplied; the exact N7 oracle is the independent finite ground truth."
    - "64 fixed scientific rows: all SAT by independent point oracle, with 29 shortcuts, 26 CMS SAT models and 9 direct MITM non-shortcut witnesses. All 64 reported witnesses contain base points and sum exactly to their public Q."
    - "All 94 CMS instances have original CNF and native XOR rows matching their raw manifests; all 28 SAT model streams assign every declared variable and satisfy each original CNF/XOR row, ordered admitted x-domain and exact group sum. No solver was launched in this review."
    - "Known-false controls performed in memory: swapping case 1 arm label fails frozen case/receipt identity; flipping its valid CMS assignment's x1 bit changes violated original rows from 0 to 5; forging a contradiction for case 9 prefix x1=3 is rejected by an exact canonical group completion."
  heuristic_validation_checks: []
  cost_model_checks:
    - "134 unique fresh worker directories, in frozen order, with no overlap between recorded outer-worker intervals; 70 controls plus 64 science. No retry slot or extra worker is represented in these manifests."
    - "All 134 outer wait4 user/system CPU and peak RSS fields and all 94 CMS child wait4 CPU/RSS fields are nonnegative and in labelled byte/second units; 0 capped, watchdog, or unexpected UNKNOWN receipts. Each worker and CMS child has separate scopes; potentially inclusive outer and child CPU were not summed as an execution total."
    - "Scientific sum of 64 outer spawn-to-wait4-reap walls is 6.273923578 s; outer wait4 CPU components sum to 5.95169 s and CMS child components to 0.97922 s in their separate scopes. Maximum observed outer wait4 peak RSS is 26755072 bytes; maximum child wait4 peak RSS is 6176768 bytes; largest per-case sum 32931840 bytes is a conservative bound, not exact simultaneous peak. No CMS child was labelled zero merely for being unsampled."
    - "Held-out median outer walls in seconds: flat 0.1303503755, explicit same-B 0.1019084375, null 0.096519542, direct MITM 0.0764654165. The charged candidate construction is visible in every applicable worker; median base-construction share across all 16 flat rows is 0.3412."
    - "Only whole outer wall determines the paired effect; prefix work was charged and archived separately. Timed workers receive Q coordinates and recipes, with no scalar label in their input JSON. The supervisor retains scalar labels only for public known-answer checks outside worker timing."
  proof_architecture_checks: []
  assigned_joints:
    field_domain_composition:
      verdict: holds
      worked_check: "Rebuilt field, curve, normal basis, candidate and null flats/orbits, selector map and public Q values independently; compared exact finite counts and point sets with frozen manifests."
    SAT_UNSAT_replay:
