      worked_check: "Checked 134 serial unique fresh workers, wait4 wall/CPU/RSS, 94 child scopes, cold input paths, charged construction and no caps; did not double-count CPU."
      limit: "Historical solver tarball cannot restore executable bytes on its own."
    static_prefix_soundness:
      verdict: holds
      worked_check: "From raw instances, independently scanned CNF units and GF2 RREF to fixpoint on all 552 held-out prefix-arm rows; matched contradiction, assignment and round counts exactly and checked ordered group completions."
    paired_math_scope:
