    - metric: heldout_prefix_contradiction_score_flat_minus_explicit
      eligible_cases: [9, 10, 13, 14, 15, 16]
      prefixes_per_case: 46
      raw_prefix_arm_rows_replayed: 552
      paired_median: 0.0
      unsound_contradictions: 0
      exact_producer_row_disagreements: 0
      finding: holds
    - metric: finite_effect_gate
