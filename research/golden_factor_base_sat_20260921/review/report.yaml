  claim_boundary: "Finite public-synthetic K1/F2^7 exact-three decomposition, static propagation, and cold outer-worker cost only. No N19, IC/rho, private target, log recovery, or key-breaking conclusion."
  verdict: incomplete
  verdict_reason: "The five assigned finite checks held, but the archived solver snapshot lacks executable bytes and the original single-task staged-unblinding attestation fails the canonical permanent-blindness checker. The sealed blind calculations remain separately inspectable; a new formal blind-only review and additive custody correction are Coordinator matters."
  artifact_checks:
    - finding: holds
      check: "62 snapshot-bound paths: 61 named by science_snapshot_receipt.json plus that committed receipt itself; all live and Git-blob SHA256 values agree. Snapshot commit has the stated parent."
    - finding: holds
      check: "All 8 source files match source_closure.json in the live tree and the implementation parent commit; the normative protocol, basis/case manifests, source closure, Stage B/C admissions, and phase launch commits align."
    - finding: holds
      check: "32 run snapshot-manifest entries, 386 science raw-manifest entries, and 620 control raw-manifest entries exist with matching lengths and SHA256 values. All 134 fresh input/result/worker stream hashes and 94 CMS stream hashes agree with their receipts."
    - finding: holds
      check: "The committed raw_outputs.tar.gz and control_outputs.tar.gz contain exactly the 386 and 620 regular files, respectively, named by their manifests; every extracted member length and SHA256 matches. This binds the otherwise untracked live raw directories into the committed snapshot."
    - finding: breaks
      check: "solver_snapshot.tar.gz has a symlink at bin/cryptominisat5 to ../Cellar/cryptominisat/5.14.7/bin/cryptominisat5, absent from the archive. Its 3 non-system dylibs are regular files and match recorded hashes. The historical solver archive is not self-contained."
      scope: "Offline binary replay from the archived bundle; raw outcomes, archived CNF/XOR, model streams, and present host hash checks remain available."
    - finding: holds_with_limit
      check: "Current host CMS executable and 3 non-system libraries hash-match solver_dependency_manifest.json; worker source rehashes the executable before each CMS call. solver_versions.json records CryptoMiniSat 5.14.7/arm64 but source_commit_verified=false and GIT-notfound; this is a version and binary hash binding, not a verified upstream source revision."
    - finding: holds
      check: "Preserved pool-scan attempt 1 records implementation_filter_error; preserved native attempt 1 records a signed-literal mux test error; preserved first passing Stage A receipt was superseded by an additive direct-MITM control extension. None was counted as a mathematical negative or a scientific worker."
  metric_recomputations:
