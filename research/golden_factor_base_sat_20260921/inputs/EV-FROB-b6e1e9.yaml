# =============================================================================
# EV-FROB-b6e1e9 -- the shift-encoded Frobenius orbit-union decomposition system
#                   costs what the n gauge-fixed systems it replaces cost
#
# WHAT THIS RECORD IS: a toy-scale measurement of the REP+INDEX arm of
# EXP-FROB-ORBIT-1 (research/ideas/frobenius_orbit_experiment_matrix.md), which
# had never been run. It asks whether parameterising a Frobenius orbit union by
# (representative, shift) makes ONE decomposition system cheaper than the n
# separate systems the global Frobenius gauge leaves behind.
#
# THE ANSWER IS NO, AND THE WAY IT IS NO IS THE REUSABLE PART: the cost is not
# merely un-improved, it is EQUAL up to a small additive term. The encoding
# removes the system count and leaves the work.
#
# PROVENANCE, STATED FIRST BECAUSE IT BOUNDS EVERYTHING BELOW: produced by
# scripts in analysis/frobenius-orbit-union/ inside ONE interactive session, not
# by harness/runner.py. No RUN-* manifest exists and none is invented. No
# independent reviewer in this program has read the instruments.
# =============================================================================
evidence:
  id: EV-FROB-b6e1e9
  hypothesis_id: null
  hypothesis_id_note: >-
    Null, and deliberately so. H-FROB-a5bf86 (approved pre-run under
    DEC-20260920-cf8ded) is the nearest hypothesis and this record scores NONE
    of its stated predictions: that hypothesis tests LINEAR Frobenius-stable V
    cut from intermediate irreducible factors of T^n - 1, at n = 41 and 43,
    against the null 2^{m l}/m!. This record tests a NON-LINEAR orbit union of a
    random subspace, at n = 13..23, against the summed cost of the n gauge-fixed
    systems. Different object, different cells, different null. Attaching it to
    that hypothesis would let a measurement of one object read as a verdict on
    another, which is the defect DEC-20260918-4b7e21 blocked propagation for.
  experiment_ids:
    - EXP-FROB-9af278
  experiment_ids_note: >-
    EXP-FROB-9af278 is an EXTERNAL CONTRACT RECORD -- this ledger's record of
    instruments written and invoked in one interactive session, NOT a contract
    this program authored, approved or executed. It exists so the obstruction
    block below can name what its values are read from, and it carries no
    approved_by because no Coordinator approved it and no preregistered
    prediction because none was frozen before the measurement. "EXP-FROB-ORBIT-1"
    in research/ideas/frobenius_orbit_experiment_matrix.md is a name in a
    research slate, not a minted EXP-* record, and is cited as the arm's origin
    rather than as its contract.
  run_ids: []
  run_ids_note: >-
    Empty. These are `python3` invocations of the scripts committed under
    analysis/frobenius-orbit-union/, not runs of this program's harness, so no
    manifest with an `inference` block exists for any of them.
  goal_ids:
    - GOAL-FROB-6333a9
  goal_ids_note: >-
    Listed against the active FROB goal because that is the campaign whose
    question this bears on. The goal's status, next_action and completion
    criteria are NOT touched by this record; see completion_criteria_impact.
  question_ids:
    - RQ-FROB-7d8dd4
  type: empirical
  direction: weakens
  direction_basis: >-
    Weakens, and read what it weakens: it weakens the hope in RQ-FROB-7d8dd4's
    decision target (b) -- a Frobenius-invariant decomposition system measurably
    cheaper than the plain system at the same (q, n, m) -- for the
    SHIFT-PARAMETERISED ORBIT-UNION family at m = 2 and for that family only. It
    weakens nothing about the factor-base and linear-algebra constants of
    KN-LIT-796, which are not in question and are not measured here, and nothing
    about any other way of using Frobenius structure.
  strength: preliminary
  strength_basis: >-
    Preliminary, and the grade is the ceiling this provenance allows rather than
    a comment on the numbers. One producing agent, one session, no independent
    review in this program, no frozen contract, no harness run record. Against
    that: the measurement is internally cross-checked (two independent solvers,
    two search modes, ground truth computed without any solver, a positive
    control), the effect is monotone across four field degrees, and the
    headline ratio is reproduced to the exact conflict on a re-run. It is not
    `replicated` in this program's sense and must not be read as such.
  claim_tier: toy
  certificate_refs: []
  certificate_refs_note: >-
    No solve is claimed, so no solution certificate is owed. The nearest thing
    is the positive control's recovered decompositions, which are re-verified
    against S_3 and against membership in V' and S in-instrument.
  proof_status: empirical_only
  proof_refs: []
  proof_status_note: >-
    Empirical only. The measured quantity is a SOLVER CONFLICT COUNT, which is
    a property of a search, not of the algebra. It is not a solving degree, not
    a first-fall degree, and not a lower bound on anything: a better encoding or
    a better solver could change any row. The one part of the reading that is
    not a measurement -- the interpretation of the additive overhead in
    `inference` -- is labelled there as an interpretation.
  observations:
    - >-
      THE HEADLINE, ON REFUTED TARGETS. Mean conflicts per target for the
      one-hot shift-encoded single system, divided by the summed conflicts of
      the n gauge-fixed single-shift systems it replaces. CaDiCaL 1.5.3:
      1.017 at n = 13 (25 targets), 1.017 at n = 17 (22), 1.467 at n = 19 (16),
      1.150 at n = 23 (15). WDSat with shift bits given branching priority:
      1.017 (plain) and 1.212 (XG) at n = 19; 1.000 (plain) and 1.033 (XG) at
      n = 23. The ratio is at or above 1 in every one of the eight cells and
      approaches 1 from ABOVE as n grows. It is never below 1.
    - >-
      THE GAP IS ADDITIVE, NOT MULTIPLICATIVE, AND THAT IS THE INFORMATIVE
      PART. On WDSat the shift-first one-hot arm costs the baseline plus 95
      conflicts (n = 19, plain), plus 18 (n = 19, XG), plus 22 (n = 23, plain)
      and plus 22 (n = 23, XG). Three of those four are within one of n - 1.
      An additive term of about one conflict per discarded shift is what a
      search that enumerates the same tree as the n separate searches, closing
      each wrong shift once, would cost.
    - >-
      XOR-NATIVE REASONING DOES NOT RESCUE THE ENCODING; IT HELPS BOTH ARMS.
      WDSat's XG-ext mode cuts the baseline by 69x at n = 19 (5747 -> 83) and
      220x at n = 23 (148234 -> 675), and the one-hot arm by 58x and 213x.
      The ratio between them therefore stays at or above 1. This answers a
      caveat the CaDiCaL-only measurement could not: the negative is NOT an
      artifact of encoding XOR constraints as CNF chains.
    - >-
      BRANCHING ORDER DOMINATES THE ENCODING'S COST, AND THE FIGURES ABOVE GIVE
      IT ITS BEST CONFIGURATION. With WDSat's default variable order the one-hot
      arm costs 3.24x (n = 19, plain), 9.24x (n = 19, XG), 2.52x (n = 23, plain)
      and 15.17x (n = 23, XG) the baseline. Every headline row above instead
      supplies the shift bits as a branching-priority prefix via `-g`, which is
      the configuration favourable to the arm under test.
    - >-
      THE ONE DECOMPOSABLE TARGET, CHARGED FAIRLY, DOES NOT RESCUE IT EITHER.
      At n = 23 target 9 decomposes, at shift 17, found by both arms. A real
      relation search stops at the first satisfiable shift, so the baseline was
      charged that way, averaged over 2000 random shift orders: 342.6 conflicts
      under XG against the one-hot arm's 187, a genuine 1.8x win for the
      encoding on that target. Weighting the 15 refutations and the 1 hit at the
      coverage actually observed gives a cost per relation found of 1.017 --
      still against the encoding, because refutation is what a relation search
      spends its time on.
    - >-
      A SEPARATE OBSERVATION, WORTH A POINTER AND NOT A CONCLUSION: under XG the
      BASELINE system is far below its own orbit-naive enumeration bound. The
      single-shift system has two blocks of l' Boolean unknowns over distinct
      subspaces (no m! summand symmetry), so that bound is 2^{2 l'} = 1024 at
      n = 19 and 16384 at n = 23; measured XG conflicts are 83 and 675, i.e.
      12x and 24x BELOW it, while the same instances in plain mode sit 5.6x and
      9.0x ABOVE it. Whether an analogous gap holds for the LINEAR stable V and
      the 2^{m l}/m! null of HEUR-FROB-FROB-WDSAT-NULL at n = 41/43 is a
      question about different cells and a different object; this record
      prejudges it in neither direction.
    - >-
      VALIDATION, INCLUDING THE PART THAT WOULD HAVE HIDDEN A DEFECT. Ground
      truth per target is an exhaustive solve of the quadratic S_3 over every
      x_1 in V', computed without any solver, and all arms agree with it on
      every target in every cell. Because every target at n = 19 refutes,
      agreement alone would also be satisfied by a solver that never finds
      anything, so four decompositions were PLANTED with both summands in the
      required sets: each was found by exactly the predicted shift and no other,
      and every model verifies as a genuine decomposition. All 320 refutations
      in the n = 19 WDSat cell print a real refutation. The n = 19 cell
      reproduces to the exact conflict count after an unrelated output-parsing
      fix, so both WDSat cells were measured by the same instrument.
    - >-
      ONE ARM WAS THROWN OUT, AND THE REASON IS THE SOLVER, NOT THE ENCODING.
      The binary shift encoding carries degree-7 monomials. On WDSat at n = 19
      its two search modes DISAGREE on satisfiability, and the model the default
      mode reports for binary/t014.anf violates 11 of that instance's 32 rows.
      Degree 7 is outside the degree 3-4 envelope every shipped config.h profile
      targets. The arm is excluded from every figure above rather than reported;
      its CaDiCaL column (2.5x to 3.2x the baseline) is retained in the raw
      results only.
  inference: >-
    For the shift-parameterised orbit union at m = 2, over the tested degrees
    and both solvers, quotienting the Frobenius action into the decomposition
    system is COST-NEUTRAL: one system costs what n systems cost, plus about one
    conflict per shift it rules out. The INTERPRETATION -- and it is an
    interpretation, not a measurement -- is that branching on the shift bits
    first makes the single search enumerate the n searches in sequence, so the
    encoding relabels the enumeration over j as a branching decision instead of
    removing it. Under the reporting taxonomy of the sibling repository's
    AGENTS.md this is the `relabelling` class: the headline count falls from n
    systems to 1 while total work does not move. It is consistent with
    IDEA-20260906-a77711's standing prior that Frobenius is an equivariance
    between the systems of CONJUGATE targets rather than a symmetry of the
    system of one fixed target, and it supplies that prior's first measurement
    on a non-linear stable factor base. It closes no lane: it prices ONE
    parameterisation of ONE family at ONE arity.
  boundaries:
    - >-
      Field degrees n in {13, 17, 19, 23}, all prime. NOTHING at any
      cryptographic degree, and in particular nothing at n = 131, 163, 233,
      283, 409 or 571. The largest subgroup touched is 23 bits.
    - >-
      Summand count m = 2 ONLY. The chained system at m >= 3 -- which is where
      an index calculus at n = 131 would have to live, and which carries
      (m-2) n extra unknowns -- is not built by these instruments at all.
    - >-
      Factor base: S = union of the n Frobenius images of a RANDOM F_2-subspace
      V' of dimension l' = ceil(n/2) - ceil(log2 n), so |S| is near 2^{n/2}.
      Claimed for no other subspace family; in particular NOT for the linear
      Frobenius-stable ker g(sigma), which is a different object and is
      H-FROB-a5bf86's.
    - >-
      Measured quantity: solver conflict counts. Propagations and wall seconds
      are recorded in the raw results but wall time is NOT comparable between
      arms, because the baseline pays n process launches against the one-hot
      arm's one.
    - >-
      Solvers: CaDiCaL 1.5.3 via python-sat, and WDSat at commit
      55d55b2620d768d9f7c78dcd8990a0689533c1d0 in both its default and its
      -x (XORGAUSS / XG-ext) search modes. Claimed for no other solver or
      version.
    - >-
      Target counts per cell are 15 to 25 and the SAT subset is 0 to 1 target.
      The per-relation-found figure at n = 23 rests on a single decomposable
      target and is a point estimate with no spread.
  unresolved_confounds:
    - >-
      NO INDEPENDENT REVIEW IN THIS PROGRAM. One agent wrote the instruments,
      the exporter and the runner, and read the results. The internal
      cross-checks are real but they are not this ledger's independence check,
      and they cannot catch a defect shared by the exporter and the ground-truth
      routine, which were written in the same session by the same author.
    - >-
      THE BASELINE'S COMPLETENESS CLAIM IS AN ARGUMENT, NOT A MEASUREMENT. The
      n gauge-fixed systems are asserted to cover the target's whole Frobenius
      orbit, on the ground that a pair with x_1 in sigma^i(V') maps under
      sigma^{-i} to a pair for the conjugate target sigma^{-i}(x_R), whose
      logarithm differs by a known lambda^{-i}. The instruments verify only that
      the n systems reproduce the exhaustive ground truth over V' x S. A reader
      who doubts the gauge argument should re-derive it; if it is wrong the
      baseline is charged too little and the ratios above are too FAVOURABLE to
      the encoding.
    - >-
      m = 2 may be the wrong arity for the question. The orbit structure has
      more to act on at larger m, and the additive-overhead reading predicts the
      overhead grows only with n and not with m -- untested, and the natural
      next cell.
    - >-
      Python field arithmetic caps the reachable degree near 23 at these
      subspace sizes, so the trend has four points and the two largest carry the
      two smallest target counts.
  obstruction:
    statement: >-
      About the OBJECT: for a Frobenius orbit union parameterised as
      (orbit representative, shift), the m = 2 point-decomposition search costs
      the same as the n gauge-fixed subspace systems the parameterisation
      replaces, plus an additive term of roughly one conflict per shift ruled
      out. The (representative, shift) coordinates do not remove decomposition
      work; they relocate the enumeration over the shift into the solver's
      branching.
    quantity: >-
      Mean solver conflicts for the one-hot shift-encoded system on
      independently certified non-decomposable targets, divided by the summed
      conflicts of the n single-shift systems on the same targets, with the
      shift bits given branching priority.
    value: >-
      CaDiCaL 1.5.3: 1.017 (n = 13, 25 targets), 1.017 (n = 17, 22), 1.467
      (n = 19, 16), 1.150 (n = 23, 15). WDSat 55d55b2 plain / XG: 1.017 / 1.212
      (n = 19, 16 targets), 1.000 / 1.033 (n = 23, 15). Additive overhead in
      conflicts: +95, +18, +22, +22 on the four WDSat rows. Means over the
      targets stated; no spread is recorded, so no error bar is claimed.
    measured_by:
      - EXP-FROB-9af278
    measured_by_note: >-
      EXP-FROB-9af278 is this ledger's EXTERNAL CONTRACT RECORD for the
      instruments, and naming it asserts nothing beyond that. NO RUN-* ID EXISTS
      for any figure here -- these were `python3` invocations in one interactive
      session, not harness runs -- and inventing one would be a fabrication under
      AGENTS.md rule 5. Within that record the values are read from the committed
      artifacts bound by content under external_provenance below:
      union_n{13,17,19,23}.json for the CaDiCaL rows and wdsat{19,23}.json for
      the WDSat rows.
    scope: >-
      Binary Koblitz curves y^2 + xy = x^3 + a x^2 + 1 with a in {0, 1} over
      F_{2^n} for n in {13, 17, 19, 23} prime; m = 2; factor base the Frobenius
      orbit union of a random F_2-subspace of dimension ceil(n/2) - ceil(log2 n);
      conflict counts from CaDiCaL 1.5.3 and WDSat 55d55b2 in both search modes;
      refuted targets except where the per-relation figure is stated. Claimed
      for no other m, no other subspace family, no composite n, no larger n, and
      no other solver.
    resource_check:
      examined: true
      reading: >-
        The check ran and found two readings, both pointers rather than results.
        (i) THE OVERHEAD IS CHEAP, WHICH IS A STATEMENT ABOUT WHAT IS STILL
        OPEN: deciding the shift costs about n conflicts, so the shift bits are
        very nearly free to the solver. What is expensive is the coordinate
        blocks, and those are unchanged by the parameterisation. A use of the
        orbit structure that changes the BLOCKS -- fewer unknowns per summand,
        not a cheaper index over j -- is untouched by this measurement and is
        where the family's remaining hope has to live. (ii) THE XG GAP ON THE
        BASELINE: 12x and 24x below the orbit-naive enumeration bound at n = 19
        and 23, against 5.6x and 9.0x above it in plain mode. If that gap
        survives on the linear stable V at H-FROB-a5bf86's cells it is a fact
        about the null that hypothesis scores against, and it would be worth
        knowing BEFORE that experiment's result is interpreted. Neither reading
        is claimed here and neither has a record of its own yet.
      spawned_ids: []
      spawned_ids_note: >-
        None. Both readings above belong in successor records a Coordinator
        composes, never by editing this one.
