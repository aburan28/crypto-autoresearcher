    verified_by: coordinator
assumptions:
  - The Koblitz model has T=(0,1), all targets Q and candidate points use one declared group or odd-order subgroup, and group order/cofactor are independently checked.
  - All u, x, w and y arithmetic uses the frozen field polynomial and canonical point encoding; no quotient witness is accepted without exact group replay.
  - The two u orbits and target-independent factor base are frozen before the confirmation targets are opened.
  - The four-point fiber formula is applied only at nonzero u and nonzero x; exceptional fibers are separately enumerated.
  - For cofactor two, the doubling image is the odd-order subgroup; if a later curve has larger cofactor, this statement is not carried over without proof.
proof_search_map:
  bottleneck: >-
    Whether quotient variables and trace filtering reduce useful SAT branching
    enough to repay four-point lift and isogeny/canonicalization costs.
  baseline_embedding:
    parameter_slice: >-
      First a complete n=7 Koblitz correctness rung; then K1/F_2^19 with
      exactly three points and matched 152-point bases, including the frozen
      four-orbit control with 6224/6909 exact-three and 6257/6909
      at-most-three quotient-target coverage.
    reproduction_check: >-
      Independently enumerate n=7 point fibers, group sums, exceptional
      points and quotient relations; at n=19 reproduce the frozen control
      with its separate exact-two branch and use exact same-domain MITM.
  observation_collision:
    observable: The u tuple or quotient SAT answer.
    distinct_preimage_search: >-
      Enumerate both signs and T mates for each u, then search for tuples
      sharing the same u data whose sums differ by T or sign. Verify that
      canonicalization and the final lift recover precisely the original Q.
  constructive_transforms:
    - transform: Replace paired x and 1/x representatives by u=x+1/x and keep the complete four-point fiber.
      proposed_object: Frobenius/T/sign-closed point base indexed by two admissible u orbits.
      predicted_gain: Smaller selector domain and trace rejection before late point choices.
    - transform: Solve the doubled relation and correct its T coset by toggling one summand.
      proposed_object: Exact original-group three-point witness with a checked quotient certificate.
      predicted_gain: Quotient-level propagation without sacrificing exact lift correctness.
  quantifier_order: >-
    Fix curve, cofactor, admissible-u rule and target split; choose two u
    orbits on training targets; freeze B; for each confirmation Q solve and
    lift; compare to direct SAT and MITM on exactly the same B before comparing
    to any different-base control.
  method_ceiling:
    strongest_certifiable_claim: >-
      Finite solve-cost benefit for this quotient encoding and/or a better
      finite base/coverage tradeoff at n=19, with all lift costs charged.
    nearby_object_control: >-
      Encode the identical T-closed point set directly by x orbit selectors.
      Also relabel u values by a random orbit-preserving bijection while
      keeping domain size fixed; a claimed algebraic propagation benefit
      should disappear under the relabeling.
  proof_obligations:
    - claim: For x!=0, x(P+T)=1/x and x(2P)=u(P)^2.
      responsibility: Derive from the binary group law and verify independently on n=7.
    - claim: Rational four-point fibers are characterized by the two trace conditions, and T toggling repairs the quotient relation.
      responsibility: Prove both directions, including signs, exceptional branches and cofactor-two kernel/image conditions.
    - claim: Smallest formal obligation is exact rational fiber recovery.
      responsibility: >-
        A Lean lemma should show, for nonzero u in a finite field of
        characteristic two, that the four pairs from
        x^2+u*x+1=0 and w^2+w=u+a are exactly the curve points
        with u=x+1/x; identify suitable curve/group-law libraries first.
  not_applicable_reason: null
predictions:
  - metric: True exact-three and at-most-three coverage when the same B is encoded directly and through the quotient.
    direction: equal
    minimum_effect: Exact equality; any difference is an implementation error or an uncharged change of point set.
  - metric: Fraction of search nodes pruned before the third quotient/point selector is fixed.
    direction: increase
    minimum_effect: At least 10 percentage points above direct same-B x encoding with a matched branch policy.
  - metric: End-to-end CPU seconds per verified original-group relation, including quotient lift and amortized base construction.
    direction: decrease
    minimum_effect: At least 20 percent below direct same-B x encoding and exact same-B MITM on held-out targets, with uncertainty intervals.
minimal_test:
  design: >-
    Freeze a canonical normal basis, low-weight orbit candidate order, two-u-orbit
    selection budget, target split, solver seeds, resource caps and batch
    amortization. At n=7 exhaustively compare every eligible u fiber,
    both direct and quotient SAT truth values, and all original-group
    decompositions for repeated and exceptional cases; include constructed
    SAT and true UNSAT targets. At n=19 choose two ordinary admissible u
    orbits on training targets, then evaluate exact-three plus a separate
    exact-two branch on held-out targets. Compare direct and quotient
    encodings of the identical 152-point B, exact MITM on B, and matched-size
    frozen/random orbit bases. Replay every CNF/XOR model and all four-point
    lifts. Treat capped solver outcomes as UNKNOWN, not UNSAT.
  controls:
    - Direct x-coordinate SAT encoding of precisely the same T-closed B.
    - Exact MITM on precisely the same B and the same exact-three or at-most-three query.
    - Frozen four-orbit 152-point base and equal-size random orbit bases, each with the same subgroup rule.
    - Orbit-preserving random relabeling of u values to test whether the algebraic coordinate link matters.
    - Exhaustive n=7 group law, rational fiber, repeated-point, x=0, T and infinity checks.
  required_metrics:
    - Counts of admissible u orbits, four-point fibers, duplicate/short orbits, subgroup and exceptional exclusions.
    - Exact-two, exact-three and at-most-three coverage with symmetry weights and train/holdout separation.
    - Trace/base construction, quotient mapping, CNF/XOR encoding, solve, lift, canonicalization and group-verification CPU/wall time.
    - Clauses, XORs, decisions, conflicts, pre-third-selector pruning rate, peak RSS and amortization batch size.
    - SAT, independently checked UNSAT, UNKNOWN, timeout, crash and false-lift counts.
falsification_conditions:
  - Direct and quotient encodings of the same B disagree on any exact original-group decomposition or coverage count.
  - The rational-fiber or T-repair identities fail in the exhaustive n=7 rung or the independently replayed n=19 witnesses.
  - Quotient pruning does not exceed the matched direct encoding threshold, or lift/construction costs erase its finite throughput advantage.
  - A claimed changed-base advantage disappears under matched cardinality and exact MITM controls.
confounders:
  - The map u identifies both T mates and sign-related doubled points; counting u values as points inflates apparent coverage.
  - Cofactor-two image facts can fail on another curve, and x=0/infinity cannot be passed through 1/x.
  - Low Hamming weight depends on the chosen normal basis and may merely select a different point set.
  - Fixed solver branching, native XOR support and target split leakage can mimic quotient gain.
interpretation_limits:
  - This is a coordinate-dependent quotient and partial-action factor-base design; it is not a lossy group homomorphism or a full-translation claim.
  - On cofactor-two E, the quotient/doubling map on the odd group is a group isomorphism; rewriting the same B cannot increase its mathematical relation yield.
  - A smaller u selector list can be offset by four-point fibers and lift verification.
  - No finite observation here implies a generic ECDLP exponent change or prime-field transfer.
heuristic_assumptions:
  - id: H-QUOT-1
    statement: >-
      A training-selected pair of trace-admissible u orbits retains useful
      early propagation and coverage on independent public targets.
    rigorous_support: >-
      The trace/fiber identities are exact, but there is no proved
      distribution theorem for solver conflict depth or favorable orbit
      selection at n=19; transfer is an explicit heuristic.
    validation_plan: >-
      Use disjoint target partitions, repeat with independently selected
      normal bases and report the entire first-conflict-depth and coverage
      distributions against same-size random-orbit controls.
target_complexity:
  time_exponent: No new asymptotic exponent asserted.
  memory_exponent: No new asymptotic exponent asserted.
  best_known: Exact same-domain MITM and direct x-domain SAT are mandatory finite comparators; generic rho is only a separate context benchmark.
  hidden_overhead: Trace filters, u-orbit search, four-point fibers, quotient mapping, sign/T choices, CNF/XOR encoding, lift correction and full group verification.
  tradeoff_note: T-closed bases double point fibers per quotient class; compare only matched point count and report relation coverage jointly with time and memory.
estimated_cost:
  implementation: Moderate; exact fiber and quotient decoder plus same-B direct encoding are required.
  compute: Exhaustive n=7 correctness rung followed by capped n=19 held-out solves; Coordinator freezes counts and stopping rules before dispatch.
dominated_by: Unresolved; direct same-B encoding and exact MITM are the nearest time-memory-data frontier rows, pending measured costs.
sota_delta: 0 proven exponent improvement; same-B mathematical coverage delta must be exactly 0, while changed-base finite deltas are unmeasured.
recommended_priority: medium
