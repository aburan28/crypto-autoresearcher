id: IDEA-20260921-457a46
related_question: RQ-KIC-7502b9
title: Trace-admissible two-torsion quotient base with certified point lifts
class: composition
claim: >-
  A factor base chosen in the quotient coordinate u=x+1/x, together with an
  exact two-torsion lift rule, may make three-point SAT decomposition cheaper
  for a matched-size Koblitz base. Any coverage change must come from the
  selected point set; coordinate rewriting of the identical set cannot change
  its true sumset.
mechanism: >-
  On E:y^2+xy=x^3+a*x^2+1 over F_2^n, let T=(0,1), the rational point of
  order two. For x(P)!=0, x(P+T)=1/x(P). Set u(P)=x(P)+1/x(P), which is
  invariant under adding T and obeys u(tau P)=u(P)^2. The doubled point
  R=2P has x(R)=u(P)^2. For nonzero u, recover the two x roots from
  x^2+u*x+1=0 and the two y values per x by solving
  w^2+w=u+a and y=x*w+1. The rational four-point fiber exists exactly
  when Tr(1/u)=0 and Tr(u+a)=0; handle u=0, T and infinity separately.
  At K1/F_2^19, the nonzero rational-fiber conditions specialize to
  Tr(u)=1 and Tr(1/u)=0. Choose two full Frobenius orbits of admissible u,
  selected by a predeclared low-normal-basis-weight/trace candidate order
  and training-target score. Two ordinary length-19 u orbits yield 152
  points after all four lifts, matching the prior base size; reject or
  stratify shorter/overlapping orbits. Thus B is closed under T,
  Frobenius and negation. Solve R1+R2+R3=2Q using the x(R_i)=u_i^2
  coordinates and exact sign witnesses. A quotient solution yields
  P1+P2+P3 equal to Q or Q+T; if the latter, toggle one Pi by T,
  which stays in B, then verify the original equality. The [2] quotient
  map is an isomorphism E/<T> to the odd-order image only after the
  cofactor-two and kernel facts are checked; larger cofactors require an
  explicit image/subgroup check. Charge trace filtering, four-point
  recovery, sign/T canonicalization, encoding and final group verification.
novelty_status: unverified
citations:
