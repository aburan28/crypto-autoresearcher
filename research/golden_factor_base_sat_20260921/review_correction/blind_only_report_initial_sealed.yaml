  - Rebuilt the least normal basis, deterministic candidate and null bases, ranked target scalars, exact canonical group completions, and all declared small-base control outcomes.
  - Checked every archived raw file against its committed file manifest, every 70 control and 64 science receipt against its raw input/result and process telemetry, and every SAT model against original archived DIMACS CNF/XOR rows and exact group identity.
  - Computed the eight held-out ratios per arm pair as same-case flat wall divided by comparison-arm whole outer-worker wall; bootstrapped 10000 resamples of eight paired case indices with Random("GFB-SAT-N7-v1-bootstrap") and type-7 endpoints.
  - Parsed the archived extended DIMACS independently and ran fresh original-order CNF units plus least-variable GF(2) RREF singleton propagation to fixpoint for the frozen 46 prefixes per eligible held-out case. Checked canonical x-order group extendibility independently.
  - Compared the independently derived prefix rows with the permitted raw progress stream only after calculating and saving the independent values.
