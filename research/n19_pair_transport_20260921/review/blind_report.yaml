method:
  - Independently implemented GF(2^19), K1 group arithmetic, negation, Frobenius, the selected 152-point signed base, and the least normal basis. Verified polynomial-normal conversion and the Frobenius rotation direction over all 524288 field values.
  - Constructed every unordered full point pair, obtaining 11097 distinct sums from 11628 additions. Checked every exported table row against actual base endpoints, stored sums, documented keys, anchored source frames, and deterministic canonicalization.
  - For every one of the 11097 pair sums, looked up each 293-key canonical table, independently inverted its shift/sign transport, and required recovered endpoints in the same base with the exact original group sum.
  - Reconstructed the declared universe O plus 6909 public scalar representatives, 19 Frobenius shifts and both signs. Verified all 262543 points are distinct, then compared an independently generated membership bitvector byte-for-byte with all three exported bitvectors.
  - Recomputed all 6909 exact-three public target outcomes and all 153 exceptions by scanning the same sorted 152-point query order against the independent pair set. Checked every positive per-arm witness and every negative exhaustive miss.
  - Bound all 144 benchmark receipts to the frozen schedule and archived result, timing, stdout and stderr bytes. Rechecked each public Q, status, first-hit index, table cardinality and SAT witness or UNSAT exhaustion before applying the frozen paired statistic.
