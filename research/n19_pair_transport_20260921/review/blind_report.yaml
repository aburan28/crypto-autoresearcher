interpretation_boundary:
  - The primary frozen comparison meets its finite eight-case process-wall thresholds under six technical repeats per case and arm.
  - Repeats reduce technical timing noise; they are not 48 independent targets. Statistical resampling uses eight paired case medians and preserves four SAT and four UNSAT strata.
  - The 293-key representation and these fixed native-process ratios do not establish a full single-target IC or rho improvement, asymptotic change, scaling result, novelty claim, or key-recovery consequence.
limitations:
  - This joint establishes the finite arithmetic, membership, witness transport, raw worker identities and paired statistic from permitted artifacts. Source, build and execution custody remain owned by the separate source-aware joint.
  - The public query control reused constructed tables and is correctness evidence only. Its wall time is not benchmark evidence.
  - The recorded benchmark process boundary includes native startup, input/base checks, table construction, query, transport and output. It does not include earlier geometry discovery or exhaustive control/checker costs.
  - Worker RSS values and logical payload bytes remain different quantities. No allocated-map memory or end-to-end IC cost claim is derived here.
  - No new benchmark, native control, target worker or solver was launched. The independent Python replay is a separately scoped static check, not a new measured sample.
