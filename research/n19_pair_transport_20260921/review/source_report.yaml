  control_checks:
  - The one native control reports 4,457 field checks, all 524,288 normal conversions/Frobenius rotations, 4,096
    group batches, all 152 base-point subgroup/closure checks, T and infinity short-orbit cases, 262,543 membership
    decisions, 6,909 exact-three queries and 153 exceptions. The separately admitted checker reports the same finite
    counts using independent arithmetic; neither control time is reused as benchmark timing.
  - Independent replay rebuilt all 380 anchored candidates per canonical arm, confirmed exact one-row/key tie selection,
    and required normal-x hits to align the full shifted point with stored C or -C before choosing sign. A key match
    without y/sign correspondence was not accepted.
  - Actual known-false predicates reject a one-point-missing base, same-shape replacement, off-curve input, inverse
    shift plus one, flipped transport sign, wrong key and wrong stored sum. This review independently reproduced
    missing-base, wrong-shift, wrong-sign and wrong-key rejection with the genuine table convention.
  - Infinity has a tagged key. Repeated/opposite summands and stabilizers are retained. The selected subgroup has
    signed Frobenius orbit 38 for nonzero points; torsion T=(0,1) and O are tested separately and do not enter the
    11,097 prime-subgroup pair members.
  heuristic_validation_checks: []
  cost_model_checks:
  - finding: holds
    check: 'Exactly 144 scheduled native processes occur in the frozen 48-block order: eight target cases, all six
      arm permutations, three arms. Every receipt is completed_valid with correct identity, result/stream/timing
      hashes, positive wait4 CPU/RSS and no watchdog, memory cap, wakeup error, registration-race recovery, overlap
      or replacement.'
  - finding: holds
    check: Primary wall is direct native Popen through kqueue NOTE_EXIT and sole wait4 reap. The supervisor checks
      wait4 before registration, handles an ESRCH fast-exit race by immediate owned wait4, and observed zero such
      recoveries. All 144 children were too short for the 50ms footprint sampler, so sampled peak is null, not zero
      memory; mandatory wait4 RSS is present for every process. There is no Python worker inside the primary boundary.
  - finding: holds
    check: Marginal 48-worker wall medians are expanded 0.0097260005 s, canonical poly 0.007371771 s and canonical
      normal-x 0.0074814165 s. These marginals are not the primary statistic, which takes six-repeat medians within
      each case/arm before forming eight paired case ratios.
  - finding: holds
    check: Median wait4 maximum RSS across 48 workers is expanded 2,818,048 bytes, canonical poly 1,851,392 bytes
      and normal-x 1,867,776 bytes. Logical key+row payload is 133,164 bytes for expanded versus 16,408 bytes for
      each canonical arm; payload explicitly excludes buckets, allocators, code, stack and RSS and must not be equated
      with measured process memory.
  - finding: holds
    check: The 144 child walls sum to 1.2059595 s. Root benchmark supervisor wall is 4.104262292 s and separately
      includes source/identity validation, result validation, hashing, fsync and archive. Root control/checker supervisor
      walls are 6.314426791/50.473086041 s; they validate correctness and are not cold-query timing. Supervisor
      wait4 CPU may include descendants and is never added to child CPU.
  - finding: holds
    check: All arms use the same native binary, base construction/validation, group/field primitives, sorted 152-point
      query order, Q-P batch and witness replay. Expanded builds 11,628 anchors; canonical arms build 380. Normal-x
      additionally constructs the normal basis and nibble maps fresh. Counter instrumentation is common, though
      counts vary with arm and SAT first-hit location.
  - finding: scope_limit
    check: The earlier P7 48.5ms Python-wrapped native worker measurement has a different boundary and is not compared
      as a replicate. The current six repeats are technical repeats on one host and eight fixed cases, not IID target
      or host samples. No IC relation-generation pipeline, preprocessing amortization, rho baseline or parameter
      scaling was measured.
  proof_architecture_checks: []
  limitations:
  - The finite effect gate supports only the exact frozen native process boundary on this host, curve, base, compiler,
    eight cases and schedule. It does not identify an asymptotic change or an end-to-end IC benefit.
  - Although every public membership bit and recorded witness was independently checked, the full 6,909-query UNSAT
    absence result is primarily bound to the exhaustive control and admitted independent checker; this source review
    did not launch a third timed or native oracle.
  - Logical payload reduction and lower RSS medians measure different scopes. Neither is an allocator-exact table
    footprint or portable memory prediction.
  - The public push remains unapproved and unperformed. This is a local immutable review package only.
