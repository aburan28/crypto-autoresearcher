  control_checks:
  - Native-control receipt records 4457 field products, 4096 deterministic group pairs, 20480 batched group cases,
    1406 signed pool points and 6909 target orbits; first-eight pair and triple plane sets both contain three keys.
    The archived independent checker reports field/group, bit-reversal and negative geometry controls passed.
  - Known-false in-memory controls rejected a one-bit selected plane vertex change, false orbit ID, incremented
    selected score and a flipped cache byte. The archived checker also records all four forgery cases against its
    real certificate verifier.
  - The cache anchoring is justified by common signed-Frobenius group automorphisms acting transitively on the least-index
    orbit. The direct sampled comparison included repeated orbit labels, repeated points, inverse cancellation and
    nonidentity target canonicalization. Infinity was excluded from the nonzero target-key bitsets.
  heuristic_validation_checks: []
  cost_model_checks:
  - finding: holds
    check: Exactly three fixed native/child process receipts appear, in controls, science, checker order, with no
      overlap, retries, cap, watchdog, unexpected status or missing output. Every child has positive wait4 wall/user/system/RSS
      fields with labelled byte/second scopes and sampled footprints; sampling is not a continuous memory bound.
  - finding: holds
    check: Child Popen-to-wait4-reap walls are controls 0.761208833 s, science 5.808000125 s and independent checker
      39.761390958 s. Root supervisor whole-phase walls, including input/source checks, child compute, promotion,
      hashing and raw archive, are 0.987860208 s, 7.947165541 s and 41.986067 s. Child and supervisor CPU scopes
      may include descendants and are not additive.
  - finding: holds
    check: Cold v2 build wall is 1.816366458 s, with compiler RUSAGE_CHILDREN user/system 1.726724/0.11169 s; before/after
      high-water RSS values are not a per-build peak difference. The four disjoint measured build-plus-supervisor
      intervals sum to 52.737459207 s, not continuous campaign elapsed time and excluding outer receipt serialization,
      Git admissions and later review/archive.
  - finding: holds
    check: Inside the science child, reported prepared/geometry/support-cache/frontier-total walls are 0.231597291/0.118252875/5.315221209/5.803070041
      s; selected frontier scoring is 0.137882208 s. The outer 5.808 s charges field preparation, complete pair
      discovery, all caches and full ranking in this run. Cache construction dominates the child wall. Separately
      charged checker replay is 39.761 s child wall.
  - finding: scope_limit
    check: This is per-curve discovery and validation cost for the fixed pool, not a free factor-base descriptor
      or a measured IC relation pipeline. No fixed-description SAT, PDP, rho comparison or amortized crossover is
      established; host compiler/Python hashes do not make the environment portable.
  proof_architecture_checks: []
  limitations:
  - The complete 66045 scores are recomputed from the frozen cache, while only seven supports were regenerated directly
    in this review. The archived checker additionally performed three complete coordinate-MITM base replays; neither
    proves a global optimum outside the fixed 37-orbit pool.
  - The controls command recorded symbolic HEAD. The additive commit/hash/timeline binding is strong byte-level
    custody evidence but does not alter that historical argv or create a fresh run.
  - Reported 6189/6909 coverage and compact affine membership do not imply easier SAT propagation, solver speed,
    index-calculus performance, or an asymptotic or security result.
  - Machine watchdogs would censor a failed process rather than negate the mathematics; all three declared processes
    completed valid in this snapshot.
