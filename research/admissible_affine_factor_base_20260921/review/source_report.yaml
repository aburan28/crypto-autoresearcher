  verdict: passed
  verdict_scope: The assigned finite N19 source, custody, cost and complete fixed-pool frontier joint holds. This
    report does not adjudicate the separate permanently blind geometry joint or change a hypothesis status.
  claim_boundary: Exact public-synthetic K1/F2^19 geometry and coordinate decomposition within the frozen 37-orbit
    pool only. No SAT solver, IC/rho timing, global factor-base family, asymptotic or key-recovery conclusion.
  artifact_checks:
  - finding: holds
    check: All 74 Coordinator snapshot bindings (73 named paths plus the receipt) match live bytes and Git blobs
      at 4afb14f3; parent is cfbe1b78. Raw controls/science/checker archives contain exactly 4/10/4 regular members
      and the aggregate archive contains all 18; each live and tar member length and hash matches its raw manifest.
  - finding: holds
    check: Actual v2 source closure binds four code files, five normative/input artifacts, the arm64 native binary,
      compiler and build logs. All four code and seven correction-bound Git blobs match immutable commit 988bcf406b04ae82769803a09e14ad20c80309fa
      and live bytes; binary SHA256 is f9f95c952845367e90528dbaecf7c3fbe8ff7566b5f428d640316b6903a41fbf. Current
      host /usr/bin/clang++ and Python 3.13 executable match recorded hashes. This is a host-specific byte binding,
      not a portable environment.
  - finding: holds_with_provenance_limit
    check: The sole control launch and original manifest retain symbolic HEAD. controls_execution_commit_resolution.json
      binds the actual commit 988bcf406b04ae82769803a09e14ad20c80309fa immediately before the next commit, with
      all seven Git blob hashes, controls SHA, first process-receipt prefix SHA and root outer receipt SHA matching.
      Commit 8e83ab70638e8f476bb3ed92831a663a53ff1317 directly descends from 988bcf and followed the control interval.
      The original argv is not rewritten; the additive manifest_execution_bound.yaml changes only code.commit to
      988bcf and records the original manifest digest 3f29cc0ae065a6cfd68ec55a50e1c8cad7b0f1566a05e7cc5f85d047913a887f.
  - finding: holds
    check: The earlier 917ed4d0 source/build and admission were preserved as unused. source_custody_supersession.json
      records that v2 added triple/pair region and sorted-target-key custody before any native control, science
      or checker process. The actual source closure and admissions bind v2 bytes; science and checker launch receipts
      name full immutable admission commits.
