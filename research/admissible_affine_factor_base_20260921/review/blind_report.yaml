method:
  - Constructed GF(2^19) independently from modulus 524327; compared shift-and-reduce multiplication with carryless schoolbook multiplication and long polynomial division, then checked irreducibility.
  - Expanded each of the 37 public pool representatives by 19 coordinate squarings and both signs, checked curve and prime-order subgroup identities, and constructed all 6909 public target signed-Frobenius orbits from the supplied scalars.
  - Enumerated all 240426 unordered cross-orbit x-pairs, found equal-XOR partitions with four distinct orbit IDs, canonicalized all planes over 19 simultaneous Frobenius shifts, and independently cross-checked the first eight orbits by triple-XOR membership and the complete set by reversible bit mapping.
  - Built a fresh 152-point coordinate MITM pair-sum table for each selected, prior and null base. For each of the 6909 canonical public target representatives, checked all third-point queries, replayed every positive group witness, and retained exact-three and at-most-three verdicts.
  - Independently rebuilt symmetry-anchored triple, pair and singleton support for each of those three bases and compared its full target-key sets with the MITM verdicts.
