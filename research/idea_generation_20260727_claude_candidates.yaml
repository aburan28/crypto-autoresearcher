  area: logic-and-proof-complexity
  name: 'Algebraic CSP dichotomy: polymorphism / Maltsev / few-subpowers tractability of the factor-base decomposition constraint'
  candidate_count: 7
  family_verdict: BARRIER-ONLY
  family_verdict_text: 'BARRIER-ONLY. The family is genuinely corpus-bare (28 core keywords re-screened first-hand at 0/95, including Maltsev, few subpowers, polymorphism, cube term, near-unanimity, Bulatov, Zhuk, Dalmau, CSP dichotomy, Datalog, local consistency, compact representation, weak near-unanimity, pp-interpretation, relational clone, PCSP, Maltsev embedding, affine integer program, linear clone, Taylor polymorphism, absorbing subuniverse, Barto-Kozik, Maroti-McKenzie, Brakensiek-Guruswami, tractable-iff-trivial, polymorphism closure, growing domain, idempotent polymorphism), and it is NOT exponent-neutral: candidate A2 shows that IF the compact-representation route applied, the complete seven-stage cost would cross rho (model arithmetic: p=2^256, m=9 gives relation collection 2^103.8 and memory 2^63.2 versus rho 2^127.8). That makes the kill load-bearing rather than trivial. But the kill is total and provable in three short lemmas (D1): polymorphisms of an additive relation on a prime-order group are exactly the Z/n-linear maps; a linear WNU must be the k-fold average; and a subset of a prime-order group of size >=2 closed under k-fold averaging is the whole group. Hence no Taylor term, hence (Maroti-McKenzie + Bulatov/Zhuk) no Maltsev, no cube/edge term, no near-unanimity, no bounded width - every tractability class in the dichotomy dies at once. The corollary generalises to every finite abelian group as a TRACTABLE-IFF-TRIVIAL dichotomy whose best corner is BSGS (sqrt(n) ops AND sqrt(n) memory), strictly worse than rho''s 0.886 sqrt(n) at O(1) memory. Recommended payload: two named barriers, BAR-POLYCLONE-D1 and BAR-TEMPLATE-D2, plus a KN-OPEN entry. No constructive candidate survives; A1 is a decisive meter, A2 a conditional audit, and B1/B2/C1 are the three escape routes, each closed by an independent wall (vacuous-relaxation/DLP-circularity; the catalogued PO-005 trace-fiber lemma; total closure). Not a duplicate: the nearest prior mechanism, C1 ''ho