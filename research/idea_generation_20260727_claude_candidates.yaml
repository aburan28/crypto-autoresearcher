- uid: FEASINTERP:BAR-NONAUTOMATIZE-D3
  id: BAR-NONAUTOMATIZE-D3
  family: Feasible-interpolation / witnessing extraction of a discrete-log bit from a refutation
  family_key: FEASINTERP
  area: logic-and-proof-complexity
  group: D barrier
  title: 'BAR-NONAUTOMATIZE-D3: even where feasible interpolation holds and a short refutation exists, FINDING it is NP-hard, so the preprocessing stage carries no finite cost exponent'
  mechanism: 'Feasible interpolation is an implication whose antecedent is a refutation IN HAND. The family''s pipeline therefore has a mandatory proof-SEARCH stage that no interpolation theorem bounds. The literature closes it: Resolution is NP-hard to automate (Atserias-Muller), Cutting Planes is NP-hard to automate (Goos-Koroth-Mertz-Pitassi), and Resolution non-automatizability under parameterized hardness is older (Alekhnovich-Razborov). So even in the exact systems where extraction is available — the weak ones — the search for the object to extract from is intractable, and the cost of stage (1) preprocessing cannot be bounded by the refutation size S. This is the barrier that kills the naive ''just run a SAT solver on the pair'' route that candidate A1 operationalizes, and it is logically INDEPENDENT of D1: D1 says short refutations do not exist; D3 says that even if they did, you could not find them.'
  fingerprint: 'algebraic object: the proof-search problem for the ECDLP disjoint pair in a fixed interpolating system; public ops: proof search (CDCL, cutting-plane search, Groebner-style search); hidden structure: the automatizability status of the system, which is decoupled from its interpolation status; info discarded: nothing; info retained: the separation between ''a short proof exists'' and ''a short proof is findable''; relation primitive: irrelevant; compression primitive: interpolant extraction, which the barrier leaves intact but strands without an input; rank mechanism: irrelevant; descent mechanism: irrelevant; dominant cost exponent: unassignable — no finite exponent can be charged to stage (1) preprocessing.'
  prediction: For every proof system in the interpolating class, the cost of stage (1) is bounded below by a proof-search problem that is NP-hard to approximate, so the family cannot state a complete-cost figure at all — not a large one, but NONE. Empirically this predicts that A1's CDCL runs will censor on the time budget at the larger sizes even in cases where a short refutation provably exists (the smooth-order arm), and that the censoring will NOT be evidence about refutation size. This last point matters for the integrity of A1's measurement and is why D3 must be stated alongside it.
  minimal_test: 'Discriminate ''no short proof'' from ''short proof not found'' directly. p = 251 and p = 1021, smooth-order arm only. (i) CONSTRUCT a short refutation by hand from the Pohlig-Hellman argument (the CRT decomposition over the smooth factors gives an explicit derivation), and measure its length L_hand. (ii) Run CDCL with a 4-CPU-hour budget and measure the found refutation length L_found, or record CENSORED. (iii) The discriminating quantity is the ratio L_found / L_hand, or the fact of censoring in the presence of a known short proof. Positive control: a formula with a known short resolution proof that CDCL reliably finds within seconds (e.g. a small pigeonhole instance below the hardness threshold) — validates the solver setup. Negative control: Tseitin on expander, where no short proof exists and censoring is expected for the OTHER reason.'
  falsification: 'Falsified if CDCL finds refutations within a constant factor of L_hand at both sizes, indicating that the ECDLP pair is a benign instance for proof search despite the general non-automatizability results (which are worst-case). This is the one genuinely open crack: non-automatizability is a WORST-CASE statement and does not preclude that this specific family of formulas is easy to search. Also falsified by an automatizability result for any system with feasible interpolation. Confirmed (barrier holds) if the ratio L_found / L_hand grows with p or CDCL censors while L_hand remains small.'
  cost_accounting: 'CHARGED: (1) preprocessing only, and the finding is that NO finite exponent can be assigned to it. OMITTED with no figure claimed: (2) relation collection and (3) linear algebra are structurally absent from the family; (4) target descent and (5) verification are bounded by D1 and are not the binding constraint here; (6) memory and (7) multi-target accounting are handled by D2. The candidate''s whole content is that stage (1), which A1 charges at cost ~S, is not in fact bounded by S.'
  dominant_exponent: Unassignable. Stage (1) preprocessing is lower-bounded by an NP-hard proof-search problem, so the family's complete cost exponent is not merely large but undefined; per the program's rules a complete-cost comparison to rho therefore cannot be stated at all, and no member of this family may claim one.
  verdict: UNREFUTED
  killer_objection: 'NOT adversarially refuted. Refutation was capped at the first six candidates per family, so this candidate was never independently attacked. Unrefuted is NOT endorsed: it is a proposal nobody has killed yet, not a result and not a survivor.'
  status: unrefuted-not-endorsed
- uid: PATHDYN:PATHDYN-A1
  id: PATHDYN-A1
  family: Dynamical analysis of algorithms - Baladi-Vallee transfer operator on the Euclidean/PRS execution-path space
  family_key: PATHDYN
  area: dynamical-and-spectral
  group: A conservative
  title: Exact characteristic-p Gauss-Kuzmin law for the RT-1476 backward-3-sum PRS degree path
  mechanism: Model the serial-S3 backward-3-sum subresultant PRS as a trajectory of the Artin continued-fraction (Gauss) map on F_p((1/X)). Its Dirichlet series Lambda(s) = sum over partial quotients a in F_p[X], deg a >= 1, of |a|^{-s} has a simple pole at s=1; the induced digit law is exactly geometric, P(deg a_i = d) = (1 - 1/p) * p^{-(d-1)}, with mean p/(p-1) -> 1. This yields a CLOSED FORM for the mean and variance of the eliminant-degree exponent beta, replacing the Monte-Carlo null of the standing RT-1476-SUBRES-A1 gate. It is an ANALYSIS INSTRUMENT, not an algorithm, and I state that as its verdict rather than dressing it as a winner.
  fingerprint: 'algebraic object: the degree-sequence path space Sigma = {(d_1,...,d_L): d_i >= 1} of pseudo-division steps, with the Artin Gauss map T on the unit ball of F_p((1/X)); public ops: pseudo-division, subresultant coefficient extraction, degree read-off; hidden structure: exactly-invariant Haar measure of T and the simple pole of Lambda(s) at s=1; info discarded: ALL F_p coefficient data, ALL elliptic-curve group structure, the eliminant polynomial itself; info retained: the integer degree-drop sequence only; relation primitive: NONE NEW (the underlying primitive stays the m=5 Semaev membership test); compression primitive: NONE — path space is a summary, not a compressed witness; rank mechanism: NONE; descent mechanism: NONE (this is precisely report85 A2''s disqualifier); dominant cost exponent: UNCHANGED — beta predicted -> 3/2, hence alpha >= 3/2, hence m=5 IC total >= q^{1/2}.'
  prediction: 'The empirical per-step degree-drop histogram of the backward-3-sum PRS at p in {101,211,431,809,1601,3001,10007} matches the geometric law (1-1/p)*p^{-(d-1)} with chi-square p-value > 0.01, and the fitted beta lies in [1.4,1.6] with closed-form point prediction beta = 3/2 (the normal-PRS limit, since mean degree drop -> 1 as p -> infinity). Equivalently: the closed form REPRODUCES the program''s existing adverse prior rather than displacing it.'
  minimal_test: 'p in {101,211,431,809,1601,3001,10007}, ordinary prime-order curves; factor base L = ceil(p^{1/5}); N = 10^4 random factor-base 5-tuples per prime; seeds 20260727..20260731. Instrument the existing experiments/rt1476_subres_beta/rt1476_backward3sum_eliminant.sage path to emit the FULL per-step degree vector (d_1..d_L), not only the final eliminant degree. POSITIVE CONTROL: a plain univariate Euclidean PRS on random f,g in F_p[X] of degree 200 — must match the geometric law exactly (this is a standard theorem, so a mismatch here is an implementation bug and must be treated as one before it is treated as evidence). NEGATIVE CONTROL: a planted-decomposable tuple with a known anomalously large degree drop. Shares one data collection with B1, C1, D1, D2.'
  falsification: 'Chi-square rejects the geometric marginal at alpha=0.01 on >= 3 of the 7 primes in the Semaev arm, OR the fitted beta falls outside [1.4,1.6] with a monotone size-trend. Note the designed coupling: falsifying A1 CONFIRMS C1 (structured inputs are non-Bernoulli), so this single experiment discriminates BAR-PATHDYN-CHARP against PATHDYN-C1.'
  cost_accounting: 'CHARGES NOTHING — all seven stages OMITTED (preprocessing, relation collection, linear algebra, target descent, verification, memory, multi-target accounting). Stating a cost model for an analysis instrument would be fabrication. Under report85''s A2 rule (''a relation-rate meter cannot lower the amortized exponent'') A1 is explicitly NOT a winner and must never be promoted as one. Its sole value is as a DISPROOF-TRACK ACCELERATOR for RT-1476-SUBRES-A1: it converts an empirical null into a closed form.'
  dominant_exponent: 1/2 unchanged (rho baseline 0.886*sqrt(n) undisplaced); the candidate makes NO exponent claim. It predicts beta -> 3/2 hence alpha >= 3/2 hence m=5 IC >= q^{1/2}.
  verdict: REJECTED-duplicate
  killer_objection: Already registered as NORMAL-PRS-BETA-BARRIER-D3 in two corpus files and already recorded as RT-1476-SUBRES-A1's fatal obstruction in report85, where it is labelled the sharpest cheap disproof track. Worse, the closed-form derivation establishes the geometric law for Haar-random univariate Laurent series - a DIFFERENT object from the conditioned multivariate Semaev PRS the barrier is about - so promoting it would upgrade a named open lever into a theorem it has not earned.
- uid: PATHDYN:PATHDYN-A2
  id: PATHDYN-A2
  family: Dynamical analysis of algorithms - Baladi-Vallee transfer operator on the Euclidean/PRS execution-path space
  family_key: PATHDYN
  area: dynamical-and-spectral
  group: A conservative
  title: 'Vallee-optimal interrupted membership: closed-form early-abort threshold for the PRS test'
  mechanism: 'Use the tilted transfer operator''s dominant eigenvalue lambda(s) to compute the exactly optimal abort depth k* for the m=5 PRS membership test: abort as soon as the prefix cumulative degree drop falls below the level curve at which conditional expected remaining work exceeds the cost of drawing a fresh candidate. Converts a heuristic engineering knob into a closed-form one. I include this DESPITE its duplicate-adjacency, flagged below, because it is the family''s only cost-charged conservative entry and it makes a previously qualitative catalogued objection quantitative.'
  fingerprint: 'algebraic object: prefix path (d_1..d_k) as a stopping-time filtration on Sigma; public ops: pseudo-division steps, degree read-off, abort; hidden structure: optimal stopping rule derived from lambda(s) / the geometric digit law; info discarded: the aborted candidate''s entire remaining PRS; info retained: prefix degrees plus the abort decision; relation primitive: UNCHANGED (m=5 Semaev membership); compression primitive: NONE; rank mechanism: NONE; descent mechanism: NONE; dominant cost exponent: UNCHANGED alpha — only the constant multiplying q^{alpha*(5/4)} moves.'
  prediction: 'k* = O(1) prefix steps; total relation-collection field-ops reduced by a factor in [1,5]. Upper bound argument: the speedup is capped by 1/P(success) ~ 120 in the most favourable arrangement, but under BAR-PATHDYN-CHARP the prefix carries only O(1/p) bits about the final degree, so the realistic factor is <= 5. Measured work exponent (log-log slope of field-ops vs p) unchanged to within +/- 0.02 across all abort depths.'
  minimal_test: 'p in {1601, 3001, 10007}; L = ceil(p^{1/5}); collect R = 1000 relations at abort depths k in {0 (no abort), 1, 2, 3, 5, 10}; 5 seeds (20260727..20260731) each; measure total F_p operations to completion. POSITIVE CONTROL: a planted mixture where 10% of candidates are guaranteed-failing after step 1 — abort MUST win a large factor there, validating the instrument. NEGATIVE CONTROL: k=0 (no abort) baseline.'
  falsification: Some abort depth reduces total relation-collection field-ops by a factor that GROWS with p — i.e. the log-log slope of speedup versus p is significantly > 0 at the 99% level across all 3 sizes. That would contradict both BAR-PATHDYN-CHARP and the catalogued batch2 objection, and would be the first evidence that early abort touches the relation-producing fraction.
  cost_accounting: 'CHARGES: (1) preprocessing — negligible, O(1) samples to fit lambda(s) and solve for k*; (2) relation collection — the entire point, with ALL aborted candidates charged; (5) verification — unchanged, each relation still carries a wrapper-re-verified certificate per docs/claims-and-verification.md. OMITS: (3) linear algebra, (4) target descent, (6) memory, (7) multi-target accounting — an abort rule changes none of them. Therefore A2 cannot be a complete-cost win even if it succeeds.'
  dominant_exponent: alpha unchanged (predicted >= 3/2); total m=5 IC stays q^{alpha*(5/4)} >= q^{1/2}. Constant-factor movement only.
  verdict: REJECTED-duplicate
  killer_objection: 'The early-abort statement is already written down at idea_generation_20260718_batch2.md:1391 (''early abort only helps the non-relation fraction'') and already operationalized. As a control it is not merely redundant but counter-specified: the frozen RT-1476 contract deliberately EXCLUDES the abort-inclusive aggregate A2 would measure, on the red-team''s own instruction to charge the successful-membership subset only.'
- uid: PATHDYN:PATHDYN-B1
  id: PATHDYN-B1
  family: Dynamical analysis of algorithms - Baladi-Vallee transfer operator on the Euclidean/PRS execution-path space
  family_key: PATHDYN
  area: dynamical-and-spectral
  group: B representation-change
  title: 'Execution-path-space representation: a p-free operator, and the proof that report85''s D1 does not transfer'
  mechanism: 'A genuine representation change: move the state space of the spectral analysis OFF the group E(F_p) and off the Semaev correspondence (report85 D1''s Theta(p)-dimensional setting) and ONTO the algorithm''s own execution-path space Sigma, whose transfer operator acts on functions of the degree sequence with dimension independent of p — p enters only as a scalar in the digit weights. The claim to be PROVED, not asserted: report85''s D1 ''arithmetic-dynamical spectral wrong-field barrier'' does not transfer verbatim, because D1 bounds operators attached to F_p arithmetic dynamical systems ON THE GROUP at Theta(p) dimension, whereas L_Sigma is p-free. I grant the family this point. The honest payload is what follows.'
  fingerprint: 'algebraic object: the path-space Ruelle operator L_Sigma with one inverse branch per partial quotient, acting concretely on the countable degree alphabet {1,2,3,...}; public ops: composition of inverse branches, degree read-off; hidden structure: p-INDEPENDENCE of the operator''s dimension (the sought asset); info discarded: everything about E(F_p) — group law, point coordinates, eliminant coefficients; info retained: branch/digit statistics only; relation primitive: NONE NEW; compression primitive: the operator itself — a p-free summary of a Theta(p)-sized computation (this IS the representation change); rank mechanism: NONE; descent mechanism: NONE; dominant cost exponent: NO change — the operator is p-free but so is its informational output.'
  prediction: 'Two-part, both falsifiable. (i) The operator''s non-essential spectrum has dimension independent of p: the empirical transfer matrix restricted to degree-drop states {1..D} has the same numerical rank at every p in the sweep — this CONFIRMS the family''s D1-non-transfer claim. (ii) The honest payload: that rank is ONE. The empirical transition matrix M_p[d,d''] = P(drop_{i+1}=d'' | drop_i=d) is rank-1 to within sampling error at every p, i.e. sigma_2/sigma_1 sits at the ~1/sqrt(N) = 0.01 sampling floor. So the p-freedom buys exactly zero exploitable structure.'
  minimal_test: 'Reuse A1''s collection (p in {101,211,431,809,1601,3001,10007}, N=10^4 paths/prime, seeds 20260727..20260731). Build the 8x8 empirical transition matrix on binned degree-drops {1,...,7,>=8}; compute singular values; report sigma_2/sigma_1 per prime. POSITIVE CONTROL: a synthetic Markov path with planted sigma_2/sigma_1 = 0.4 — must be detected. NEGATIVE CONTROL: i.i.d. resampling of the same marginal, 400 resamples (matching the PO96L control-envelope convention already used in this program) — sigma_2/sigma_1 must land at the sampling floor.'
  falsification: sigma_2/sigma_1 exceeds the 400-resample i.i.d. control envelope's 99th percentile on >= 3 of 7 primes AND does not decay as p grows. That refutes the Bernoulli payload, refutes BAR-PATHDYN-CHARP, and promotes PATHDYN-C1 to live status.
  cost_accounting: CHARGES NOTHING as a standalone — all seven stages OMITTED. B1 is a REPRESENTATION, and a representation is not an algorithm; per the target definition ('a new coordinate system is NOT a breakthrough') it cannot win. It is a PRECONDITION for B2 and C1, which do charge stages. Any cost model attributed to B1 alone would be fabricated.
  dominant_exponent: 1/2 unchanged. B1 is exponent-neutral by construction. Its entire value is that it is the ONE move in this family that survives report85's D1, whose kill was dimensional rather than informational.
  verdict: REJECTED-exponent-neutral
  killer_objection: 'Self-admitted exponent-neutral (''1/2 unchanged... exponent-neutral by construction''; relation primitive NONE NEW, rank NONE, descent NONE). Its headline claim is an EXEMPTION - that report85''s D1 does not transfer - which removes a wall rather than erecting one; the genuine by-product (the alphabet pincer: Theta(p) alphabet on the group, degenerate single-symbol alphabet off it) is a corollary of two already-recorded corpus items and is conditional on D3, itself only an OPEN negative-theory lever.'
- uid: PATHDYN:PATHDYN-B2
  id: PATHDYN-B2
  family: Dynamical analysis of algorithms - Baladi-Vallee transfer operator on the Euclidean/PRS execution-path space
  family_key: PATHDYN
  area: dynamical-and-spectral
  group: B representation-change
  title: 'Gibbs-tilted degree steering: the family''s only instrument-to-algorithm conversion, and its predicted cancellation'
  mechanism: 'The single move that could make this family an algorithm rather than a meter, and therefore the only one that can escape report85''s A2 rule. Use the s-tilted operator L_s (equivalently the Gibbs/equilibrium measure at inverse temperature s on execution paths) to importance-sample elimination orders, eliminated-variable choices, and factor-base coordinate changes, biasing the induced PRS toward anomalously large early degree drops => low eliminant degree => low beta => low alpha. Concretely: score a candidate from its k-step prefix, accept only the top-epsilon fraction, and charge every rejection.'
  fingerprint: 'algebraic object: Gibbs measure mu_s on Sigma with d(mu_s)/d(mu) proportional to exp(s * cumulative degree drop); public ops: sample a 5-tuple plus elimination order, run k prefix pseudo-divisions, accept or reject; hidden structure: the large-deviation rate function I(beta) = Legendre transform of log lambda(s); info discarded: rejected candidates entirely; info retained: the accepted low-beta subpopulation; relation primitive: m=5 Semaev membership on the STEERED candidate stream; compression primitive: NONE — the eliminant is still computed in full on every accepted candidate; rank mechanism: unchanged (sparse full-rank relation matrix); descent mechanism: unchanged and UNRESOLVED (2-LP graph descent, inherited from RT-1476, not supplied here); dominant cost exponent: alpha_eff = alpha(beta_tilt) + I(beta_tilt)/log q, with the steering cost written into the exponent explicitly.'
  prediction: 'I predict FAILURE, by exact cancellation, and state the mechanism so it can be checked. Under BAR-PATHDYN-CHARP''s geometric digit law, P(cumulative drop exceeds its mean by Delta) = p^{-Theta(Delta)}, while the eliminant-cost saving from a degree defect Delta is only poly(Delta). Hence d(alpha_eff)/d(tilt) >= 0 at s=0 and the optimum is s=0, i.e. NO steering. Quantitatively: total relation-collection work at any acceptance fraction epsilon in (0,1) is >= the work at epsilon=1, up to a factor < 2.'
  minimal_test: 'p in {1601, 3001, 10007}; L = ceil(p^{1/5}); prefix length k in {2,3,5}; acceptance fraction epsilon in {1, 0.5, 0.1, 0.01}; R = 1000 relations; 5 seeds (20260727..20260731). Measure total F_p operations to collect R relations INCLUDING all rejected candidates, and fit the work exponent w(epsilon) = d log(work)/d log p across the 3 primes. POSITIVE CONTROL: a synthetic candidate stream with a planted 1% subpopulation whose eliminant degree is one third of typical — the steerer MUST find and exploit it, or the instrument is broken and no negative result is admissible. NEGATIVE CONTROL: epsilon selected on a random score independent of the prefix.'
  falsification: w(epsilon*) < w(1) - 0.03 for some epsilon*, replicated on all 3 primes, with the planted subpopulation DISABLED. That is a genuine toy-scale exponent movement and the only constructive outcome available anywhere in this family; it would falsify the cancellation claim and reopen the lane.
  cost_accounting: 'CHARGES: (1) preprocessing — fitting lambda(s) and the prefix scorer, O(1) samples; (2) relation collection — steered sampling with EVERY rejected candidate charged; this is precisely the stage where cancellation bites and where dishonest accounting would hide, so the contract must report rejections explicitly; (5) verification — each accepted relation still carries a wrapper-re-verified certificate. OMITS: (3) linear algebra, (4) target descent, (6) memory, (7) multi-target accounting — B2 changes none of them and inherits RT-1476''s unresolved status for all four. CONSEQUENCE: B2 CANNOT be a complete-cost win even on success; at best it moves alpha, leaving the descent map still missing.'
  dominant_exponent: alpha_eff = alpha + I(beta_tilt)/log q; predicted minimized at zero tilt, so alpha_eff = alpha >= 3/2 and total m=5 IC >= q^{1/2}. Exponent-neutral as predicted.
  verdict: REJECTED-duplicate
  killer_objection: 'The declared cancellation is a strawman: the tilted subshift can be sampled sequentially and EXACTLY via the Ruelle-Perron-Frobenius eigenfunction with zero rejections, which a competent implementer would do, so a barrier that rules out only the naive rejection implementation is not citable. The direct-sampling version dies from a degenerate-locus supply collapse that B2 never addresses and has not proved.'
- uid: PATHDYN:PATHDYN-C1
  id: PATHDYN-C1
  family: Dynamical analysis of algorithms - Baladi-Vallee transfer operator on the Euclidean/PRS execution-path space
  family_key: PATHDYN
  area: dynamical-and-spectral
  group: C high-risk
  title: 'Non-Haar induced path measure restores quasi-compactness: does Semaev structure make the PRS path non-Bernoulli?'
  mechanism: 'The family''s highest-value constructive shot and the direct attack on its own barrier. Semaev PRS inputs are NOT Haar-random Laurent series: they are pseudo-remainders of summation polynomials with rigid symmetric-function and Newton-polytope structure and a repeated leading-coefficient pattern. If the path measure INDUCED by that structure is non-Bernoulli — i.e. the Ruelle operator on Sigma is genuinely quasi-compact with essential spectral radius strictly below its spectral radius and a nontrivial second eigenvalue lambda_2 — then early degree drops CORRELATE with the final eliminant degree, and an O(1)-length prefix becomes a genuine PREDICTOR rather than a description. That is the only route by which this family yields a selector that is predictive rather than descriptive.'
  fingerprint: 'algebraic object: the induced non-Haar path measure nu on Sigma from Semaev-structured pseudo-division, and its Ruelle operator L_nu; public ops: pseudo-division on structured inputs, prefix degree read-off; hidden structure: the second eigenvalue lambda_2 of L_nu (correlation-decay rate) — quasi-compactness restored by INPUT STRUCTURE rather than by map hyperbolicity, which is the genuinely new idea; info discarded: coefficient values, all group data; info retained: degree path plus the input''s structural type; relation primitive: m=5 Semaev membership on prefix-selected candidates; compression primitive: an O(1)-length prefix as proxy for the full PRS; rank mechanism: unchanged; descent mechanism: unchanged, INHERITED and UNRESOLVED; dominant cost exponent: alpha_eff = alpha - gain, where gain is bounded by the mutual information I(prefix; beta) in bits.'
  prediction: 'I predict FAILURE, and I state the a-priori ceiling that nearly closes C1 before the experiment: an O(1)-length prefix over an effective alphabet of size O(1) carries O(1) bits, while alpha is a log_q quantity — so a constant-length prefix can move alpha by at most O(1/log q) -> 0. To have any chance C1 needs prefix length k = Theta(log q), at which point the prefix costs a constant fraction of the full PRS and the saving evaporates. This ceiling is itself a mini-barrier and I record it as the honest self-critique. The falsifiable empirical form: the mutual information I(d_1..d_3 ; final eliminant degree) for Semaev-structured PRS exceeds that for matched-degree random-polynomial PRS by a margin that does NOT shrink as p grows.'
