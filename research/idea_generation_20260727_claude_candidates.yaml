 barrier, honestly scored novelty-3 (a sharpening, not a new wall): METRIC-NONEMBEDDING-BARRIER-D3, batch14_0722 D1/D2, batch11_0719 LOCAL-HAMILTONIAN-C2''s "no continuous energy landscape over F_p", and collapse class (a) "no metric on a finite group" (batch8_0721 reconciliation table) already occupy the same wall from the input side. D2''s surviving content is that it relocates the barrier from EXISTENCE of a metric to EVALUABILITY of one, unifies four previously-separate kills under a single root cause, and is the first version of that wall with a cheap falsifying experiment (C1''s surrogate rank-correlation meter, whose falsification would be a genuine constructive opening). NO WINNER; no candidate charges a route to a sub-1/2 complete-cost exponent; D1 DATA-MOVEMENT, BAR-AMORT-D2, JETBARRIER1 and the Shoup bound are all respected and none is contradicted -- D2 is in fact the landscape-language reading of Shoup''s equality-only feedback model, extended (falsifiably) to algorithms with field-side access.'
