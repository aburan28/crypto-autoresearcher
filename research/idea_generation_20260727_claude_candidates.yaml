  prediction: 'All three forms fail, for one shared reason plus one separate one. Form (i) fails because a block evaluation of FFT type requires the map j -> (data determining N(j)) to be convolutional or character-diagonal in j; the data is x(R_0 + jP), whose only diagonalizing basis is the character basis of the subgroup generated by P, and evaluating a nontrivial character there requires the discrete log — this is the corpus''s catalogued Fourier-circularity kill, restated as D2. Form (ii) fails because the block {R_0 + r*2^k*P + i*P : i < 2^k} is not an algebraic family in one low-degree parameter over F_p — advancing i is a GROUP operation, not a coordinate translation, so eliminating i has degree Theta(2^k). Form (iii) fails on BAR-AMORT-D2 / Corrigan-Gibbs–Kogan ST^2 = Omega(eps*N): a block-occupancy table with S bits of advice and online time T obeys that bound, so single-target complete cost stays >= sqrt(N) once table build and storage are charged.'
  minimal_test: 'p1 = prime near 2^16, 5 random ordinary E/F_p with #E prime, m=2, L = round(sqrt(p)) = 256. FORM (i): compute the EXACT block sums sum over j in B of N(j) for all 2^{16-k} blocks at k in {4, 8, 12}, then compare against the low-frequency reconstruction from the |t| <= 2^k truncation, and report the relative reconstruction error — predicted Theta(1), i.e. no reconstruction at all. FORM (ii): substitute the division-polynomial expression for x(R + iP) into S_3(x(R_0 + (r*2^k + i)P), x_1, x_2) and compute the DEGREE IN i of the eliminant at k in {2, 3, 4}; check whether it grows like 2^k (predicted) or stays O(1). FORM (iii): build the block-occupancy table at k = 8, measure S in bits and online T in blocks probed, and evaluate S*T^2 against eps*N with eps = the measured hit rate. POSITIVE CONTROL for form (i): a synthetic index family j -> (alpha*j + beta mod p), for which the FFT genuinely does diagonalize and the reconstruction error MUST be 0 — without this control a Theta(1) error proves nothing about the field. NEGATIVE CONTROL: the real field. 5 seeds throughout.'
