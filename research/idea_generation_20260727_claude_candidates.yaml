- uid: FEASINTERP:NSINTERP-SIZEDEGREE-A2
  id: NSINTERP-SIZEDEGREE-A2
  family: Feasible-interpolation / witnessing extraction of a discrete-log bit from a refutation
  family_key: FEASINTERP
  area: logic-and-proof-complexity
  group: A conservative
  title: 'Size-degree tradeoff audit: the corpus''s own conjectured PC-degree bound is too weak to bound the interpolant, and therefore too weak to close the extraction lane'
  mechanism: 'Nullstellensatz and Polynomial Calculus admit feasible interpolation (Pudlak-Sgall), so a PC refutation of the split-variable decomposition pair yields an interpolant circuit of size polynomial in the refutation SIZE, not its degree. The corpus''s existing barrier POLYCALC-D2 conjectures a PC DEGREE lower bound d = Omega(L^{1/2}) on the decomposition ideal. Converting degree to size requires the Impagliazzo-Pudlak-Sgall size-degree tradeoff, size >= exp(Omega((d - d_0)^2 / n_vars)). Instantiate it: if the encoding carries n_vars = Theta(L) Boolean variables and d = Theta(L^{1/2}), then (d - d_0)^2 / n_vars = Theta(L)/Theta(L) = Theta(1), and the implied size bound is exp(Omega(1)) — a constant, i.e. VACUOUS. The corpus''s degree barrier sits exactly at the threshold where the standard degree-to-size conversion returns nothing.'
  fingerprint: 'algebraic object: the m=5 Semaev decomposition ideal already frozen in-ledger, in its PC/NS propositional encoding; public ops: PC derivations (multiply by variable, linear combination); hidden structure: the gap between refutation degree and refutation size in the specific encoding used; info discarded: the geometry of the variety (only the monomial count survives); info retained: n_vars, d_0 (max initial degree), and the conjectured d; relation primitive: NONE (this is an audit of an existing barrier, not an engine); compression primitive: Pudlak-Sgall NS/PC interpolant extraction; rank mechanism: NONE; descent mechanism: NONE (no descent is defined — the candidate is deliberately INCOMPLETE as an algorithm); dominant cost exponent: none is implied — the finding is that no exponent follows from the existing degree bound.'
  prediction: 'Instantiating the IPS tradeoff on the actual encoding will show (d - d_0)^2 / n_vars = Theta(1), yielding size >= exp(Omega(1)) = O(1), a vacuous bound. Consequence, stated as a correction to the reach of an existing corpus barrier rather than as a new attack: POLYCALC-D2''s Omega(L^{1/2}) degree bound, even if fully proved, does NOT preclude a small PC refutation and therefore does NOT preclude a small extracted interpolant. To bound the interpolant one needs a degree bound of omega(sqrt(n_vars)), strictly stronger than what the corpus has ever conjectured.'
  minimal_test: 'Purely analytic plus a variable count; no solver run needed. For L in {16, 32, 64}: (i) open the frozen POLYCALC-D2 encoding and COUNT the Boolean variables n_vars(L) actually instantiated, and the maximum initial degree d_0 (expected d_0 = 5 for the S5 summation row, 1-2 for factor-base membership rows); (ii) for d = c*L^{1/2} with c in {0.5, 1, 2}, evaluate (d - d_0)^2 / n_vars(L) numerically at each L; (iii) report the implied size bound exp(Omega(.)) and its trend in L. Positive control: instantiate the same tradeoff on random 3-CNF at the same n_vars, where d = Theta(n_vars) is known and the bound is genuinely exponential — confirming the arithmetic is being applied correctly. Negative control: instantiate at d = d_0 + 1, where the bound must be trivial by construction.'
  falsification: Falsified if n_vars(L) = O(L^{1-delta}) for some delta > 0 in the actual encoding — then d = Theta(L^{1/2}) gives (d-d_0)^2/n_vars = Omega(L^{delta}) -> infinity and the size bound IS superpolynomial, so the existing degree barrier does close the extraction lane and A2's negative conclusion is wrong. Also falsified if the corpus's PC encoding is over O(1) field variables rather than Theta(L) Boolean variables, in which case the Boolean IPS tradeoff does not apply at all and a different (unavailable) conversion is needed — a different but equally real gap, which I would report as such rather than as confirmation.
  cost_accounting: 'CHARGED: none of the seven stages. This candidate produces no algorithm and no cost figure; it is an audit of whether an existing barrier''s stated bound supports the conclusion drawn from it. OMITTED, explicitly and with no figure claimed: preprocessing, relation collection, linear algebra, target descent, verification, memory, multi-target accounting. Labelled INCOMPLETE as an algorithm by construction, per the harness rule that a meter is not an engine.'
  dominant_exponent: None implied. The finding is precisely that the existing degree bound d = Theta(L^{1/2}) at n_vars = Theta(L) implies only exp(Omega(1)), so no size exponent and hence no interpolant-size exponent follows from it.
  verdict: REJECTED-duplicate
  killer_objection: 'A null observation about the downstream implications of an unproven conjecture: it audits POLYCALC-D2''s own conjectured PC-degree bound, finds the Impagliazzo-Pudlak-Sgall size-degree tradeoff gives exp(Omega(1)) = vacuous, and its literal content is therefore ''we cannot rule out small refutations'' - which opens the lane rather than closing it. POLYCALC-D2 already self-reports the same vacuity risk in its own Likely-fatal-obstruction line.'
- uid: FEASINTERP:DLPAIR-CANONICAL-B1
  id: DLPAIR-CANONICAL-B1
  family: Feasible-interpolation / witnessing extraction of a discrete-log bit from a refutation
  family_key: FEASINTERP
  area: logic-and-proof-complexity
  group: B representation-change
  title: ECDLP re-represented as a disjoint NP pair; the algorithm becomes a separator circuit and its cost becomes a proof length
  mechanism: 'Replace the representation ''ECDLP is a search problem in a group'' by ''ECDLP is the disjoint NP pair (U_lo, U_hi)'', where U_lo = {(E,P,Q) : exists x < n/2 with xP = Q} and U_hi = {(E,P,Q) : exists x >= n/2 with xP = Q}. Both sides are in NP (the witness is x itself), and they are disjoint by uniqueness of the discrete log. An algorithm is then no longer a search procedure but a SEPARATOR: any circuit C with C = 0 on U_lo and C = 1 on U_hi is a top-bit oracle, and log2(n) of them give the full log. In this representation, for any proof system P with feasible interpolation, P-separability of the pair is EQUIVALENT to the existence of short P-proofs of the ECDLP tautologies; the algorithmic question becomes a proof-length question, and the family''s objects are canonical pairs and reductions between disjoint NP pairs (Razborov; Glasser-Selman-Sengupta) rather than curves and factor bases.'
  fingerprint: 'algebraic object: the disjoint NP pair (U_lo, U_hi) over ordinary prime-field curves, and the lattice of disjoint NP pairs under many-one reductions; public ops: pair reductions, and P-proofs in a fixed interpolating system; hidden structure: the position of the DL pair relative to the canonical pair of each proof system; info discarded: the group law, the coordinates, everything algebraic — only membership in two languages survives; info retained: separability status and the proof length that certifies it; relation primitive: NONE; compression primitive: the separator circuit itself (a one-bit compression of the whole instance); rank mechanism: NONE; descent mechanism: log2(n) separator evaluations under interval halving; dominant cost exponent: the separator-size exponent, rho crossed iff size < p^{1/2} / log2 p.'
  prediction: 'The DL pair will reduce to (i.e. be no easier than) the canonical pair of every proof system weak enough to have feasible interpolation, and will be P-inseparable for all such P. Concretely: the representation change is EXACT — it loses no information and adds no operation — and therefore cannot by itself move any exponent. Its predicted value is entirely as the frame in which barrier D1 is stated; predicted verdict on its own merits is INCOMPLETE (no relation-generation primitive, no independent descent map beyond the bit oracle it inherits).'
  minimal_test: 'At p = 251 only, and framed as a correctness test of the representation, not a cost test. (i) Construct the pair explicitly for arm (b) of A1''s curve selection. (ii) Run the A1 refutation search on the conjunction. (iii) If any refutation is found, extract the interpolant by the Krajicek construction and verify by EXHAUSTION over all 251 group elements that it computes MSB(log_P) with zero errors. (iv) Independently verify that the pair is genuinely disjoint by checking that no (x_A, x_B) with x_A < n/2 <= x_B satisfies both equations — this must hold by uniqueness and confirms the encoding. Positive control: the same construction on the additive group Z/p, where the separator is a modular inversion and provably exists in small size. SCOPE: at p = 251 the crossing threshold is 0.886*sqrt(251)/log2(251) ~ 1.75 gates, so NO circuit found at this size can constitute a cost win; the test verifies representational soundness only, and any cost statement would be a toy-to-crypto extrapolation and is withheld.'
  falsification: Falsified as a representation if the extracted interpolant fails exhaustive verification on all 251 points, or if the disjointness check finds a joint satisfying assignment (which would mean the encoding of the group law or the interval constraint is wrong). Falsified as a NOVEL representation if a prior corpus candidate is found that already treats ECDLP as a promise-separation problem rather than a search problem. Its own predicted INCOMPLETE verdict is falsified only by exhibiting a relation-generation primitive or an independent descent map that the pair representation supplies and the group representation does not — I predict none exists, because the representation is information-preserving.
  cost_accounting: 'CHARGED: (4) target descent — log2(n) separator evaluations; (5) verification — exact, recompute xP and compare to Q. OMITTED with no figure claimed: (1) preprocessing — the cost of establishing separability is exactly the proof length, deferred to A1 and D3; (2) relation collection — structurally absent; (3) linear algebra — structurally absent; (6) memory; (7) multi-target accounting — deferred to D2. Because the representation is exact and information-preserving, it charges nothing new and can therefore not lower any stage''s exponent on its own; that is the honest reason it is INCOMPLETE.'
  dominant_exponent: Separator-circuit-size exponent. rho crossed iff separator size < p^{1/2}/log2 p. No value is derivable from the representation change itself — the representation is exact, so it moves no exponent, and any value must come from A1's measured refutation size.
  verdict: REJECTED-exponent-neutral
  killer_objection: Proof systems that HAVE feasible interpolation are weak, and there Krajicek's separator is a MONOTONE circuit while the DL top-bit predicate is not monotone. The corpus already logged exactly that self-defeat ('membership predicate is NOT monotone => vacuous/self-defeating', idea_generation_20260720_batch6.md line 60) and records it as the identical restricted-model collapse of nine prior C1 candidates. The representation change is exact, so it moves no exponent by construction.
- uid: FEASINTERP:HERBRAND-DISJUNCTION-B2
  id: HERBRAND-DISJUNCTION-B2
  family: Feasible-interpolation / witnessing extraction of a discrete-log bit from a refutation
  family_key: FEASINTERP
  area: logic-and-proof-complexity
  group: B representation-change
  title: 'The DL algorithm re-represented as a Herbrand disjunction: a finite set of closed-form candidate terms rather than a search'
  mechanism: 'Represent ''for all Q in <P>, there exists x with xP = Q'' as a first-order statement over the theory of E(F_p) and apply Herbrand''s theorem: a proof yields a finite disjunction of TERMS t_1(Q), ..., t_k(Q) in the language (field operations, curve operations) such that OR_i (t_i(Q)P = Q) is valid. This is a genuine representation change — the algorithm becomes a finite list of closed-form rational functions of Q''s coordinates, evaluated and tested, with no search at all. Cost = k evaluations plus k verifications. rho is crossed iff k < 0.886*sqrt(n) with each t_i cheap. The Herbrand width k is thus the entire cost, and the family''s question becomes: how algebraically compressible is the map Q -> log_P Q?'
  fingerprint: 'algebraic object: the Herbrand universe of terms over (F_p, +, *, curve group law) and the disjunction certifying DL totality; public ops: term evaluation over F_p; hidden structure: whether log_P admits a low-degree rational section on a positive-density subset; info discarded: the group''s ordering and any bit structure — only algebraic closed forms survive; info retained: the disjunction width k and the maximal term degree d; relation primitive: NONE (no factor base — each term is a direct candidate for the log); compression primitive: the Herbrand disjunction itself, compressing an exhaustive search into k closed forms; rank mechanism: NONE; descent mechanism: NONE needed — the disjunction is the whole algorithm, evaluated in one shot per target; dominant cost exponent: tau = log_p k, the Herbrand-width exponent; rho crossed iff tau < 1/2.'
  prediction: The minimal degree d(p) of a bivariate rational function in (Q_x, Q_y) agreeing with log_P on a random subset of size m = p/2 will sit AT the pure counting threshold d ~ sqrt(2m), within a multiplicative factor of 1.00 +/- 0.05, across all tested sizes — i.e. log_P is algebraically incompressible and the Herbrand disjunction achieves no compression whatsoever below what naive interpolation of an arbitrary function gives. Consequently tau >= 1/2 with no gain, and typically tau = 1 once exactness on all of <P> is demanded.
  minimal_test: 'p in {251, 1021, 4093}, three seeds (20260727-29), curves per A1 arm (b) (ordinary, prime order, non-anomalous, j not in {0,1728}). For each cell: sample a uniformly random subset S of <P> with |S| = m = floor(p/2); by linear algebra on the coefficient space of bivariate polynomials of total degree <= d, find the minimal d such that some rational function of numerator/denominator degree <= d agrees with log_P on all of S; report the ratio d_measured / sqrt(2m). POSITIVE CONTROL: the same measurement with log_P replaced by a genuinely low-degree function of (Q_x, Q_y) (e.g. Q_x itself), where d = 1 must be recovered — this validates the linear-algebra search. NEGATIVE CONTROL: log_P replaced by a uniformly random function on S, where the ratio must be 1.00 by counting. Budget: exact rational linear algebra over F_p, well under an hour per cell at these sizes.'
  falsification: Falsified (favourably) if d_measured <= 0.5 * sqrt(2m) consistently across all three sizes and 3/3 seeds, which would demonstrate genuine algebraic compressibility of log_P and would justify computing an actual Herbrand width. Falsified (unfavourably, i.e. the candidate is confirmed dead) if the ratio is 1.00 +/- 0.05 across all cells. VOID if the positive control fails to recover d = 1, which would mean the linear-algebra search is misimplemented.
  cost_accounting: 'CHARGED: (4) target descent — k term evaluations, this IS the algorithm; (5) verification — exact, each candidate t_i(Q) is tested by recomputing t_i(Q)*P and comparing to Q, so every claim carries a solution certificate. OMITTED with no figure claimed: (1) preprocessing — the cost of extracting the Herbrand disjunction from a proof is not modelled here and is not claimed; (2) relation collection — structurally absent; (3) linear algebra — structurally absent from the online algorithm (the offline degree measurement is the experiment, not the attack); (6) memory — storing k terms of degree d costs Omega(k*d^2) field elements, not measured; (7) multi-target accounting — the disjunction is target-independent and amortizes, which lands it in D2.'
  dominant_exponent: tau = log_p k, the Herbrand-disjunction width exponent; rho crossed iff tau < 1/2. Predicted tau >= 1/2 (at the counting threshold, no gain) and tau = 1 for exactness on all of <P>.
  verdict: REJECTED-exponent-neutral
  killer_objection: 'Not new internally (report92 D2 is the dedicated no-definable-section barrier, D3 its logic-vocabulary restatement), not new externally (the degree version is published: Coppersmith-Shparlinski, Lange-Winterhof), and not provable in the only genuinely new form (the SIZE version needs an algebraic circuit lower bound; VP != VNP is open). Independently, the proposed measurement measures interpolation DEGREE, which bounds neither Herbrand width k nor term size - the experiment cannot test the wall it claims to measure.'
- uid: FEASINTERP:MONOTONE-UNARY-C1
  id: MONOTONE-UNARY-C1
  family: Feasible-interpolation / witnessing extraction of a discrete-log bit from a refutation
  family_key: FEASINTERP
  area: logic-and-proof-complexity
  group: C high-risk
  title: Forcing the DL pair monotone so that monotone feasible interpolation applies — and quantifying the unary blow-up that kills it
  mechanism: 'Monotone feasible interpolation (Krajicek for Resolution; Pudlak for Cutting Planes via monotone real circuits and the Karchmer-Wigderson correspondence) is the strongest form of the extraction: the interpolant is a monotone (real) circuit, and the extraction is tightest there. It requires the pair to be monotone in the shared variables u. The DL pair is not monotone in the BINARY bits of Q. The speculative move is to re-encode the shared variables so that the top-bit predicate becomes monotone — which forces a unary/threshold encoding, u = the characteristic vector of {Q} over the group. Then run the extraction forward and read off the circuit. The candidate exists to be measured and killed quantitatively rather than dismissed.'
  fingerprint: 'algebraic object: the unary (characteristic-vector) encoding of <P> and the monotone disjoint pair over it; public ops: monotone real circuit gates; monotone Karchmer-Wigderson communication; hidden structure: whether any sub-unary encoding makes MSB(log_P) monotone; info discarded: all binary/positional structure of Q; info retained: monotone order structure on the group; relation primitive: NONE; compression primitive: monotone interpolant extraction (Pudlak''s CP route through real communication protocols); rank mechanism: NONE; descent mechanism: log2(n) monotone-circuit evaluations; dominant cost exponent: 1 — the unary encoding forces the circuit to have Theta(n) input wires, so |C| >= n = p^1.'
  prediction: 'Near-certain self-defeat, and now QUANTIFIED rather than asserted: any encoding in which the top-bit predicate is monotone requires |u| = Theta(n) shared variables, so the interpolant has at least n input wires and |C| >= n = p^1, versus the extraction budget of p^{1/2}/log2 p. The gap is a full factor of p^{1/2}*log2 p. Equivalently in the Karchmer-Wigderson picture: after unary encoding, Alice holds the unary string of Q and the monotone KW game is solved by Alice naming her single 1-coordinate, costing log2 n bits and corresponding to a circuit of size ~n — the same Theta(n) wall from the communication side. The two derivations agree, which is the useful content.'
  minimal_test: 'p = 251 (n = #E prime, arm (b) curve). (i) Construct the unary shared-variable encoding and COUNT the input wires: predicted exactly n ~ 251. (ii) Compute the extraction budget at this size: 0.886*sqrt(251)/log2(251) ~ 1.75 gates. (iii) Report the ratio 251/1.75 ~ 143, and confirm it grows as sqrt(p)*log2 p by repeating at p = 1021 and p = 4093 (predicted ratios ~ 4.0e2 and ~ 1.1e3, growing). (iv) SEARCH ARM, the part that is actually speculative: attempt to construct any encoding with |u| = o(n) shared variables in which the top-bit predicate is monotone, by exhaustive search over threshold encodings of the group at p = 251. Positive control: a genuinely monotone predicate (e.g. majority on the unary string) where the monotone extraction does apply and yields a small monotone circuit — confirming the extraction machinery is correctly implemented. Negative control: the signed 5-sum membership predicate, already known non-monotone in this corpus.'
  falsification: Falsified (and the candidate becomes live) if the search arm exhibits an encoding with |u| = o(n) in which the top-bit predicate is monotone. I predict this is impossible, because monotonicity in a sub-unary encoding would supply an order-preserving compression of Q -> log_P Q, i.e. a monotone structure on the group aligned with the log ordering. Falsified in the other direction (killed) if the input-wire count is exactly n at all three sizes and the search arm returns empty — the expected outcome. VOID if the positive control fails to produce a small monotone circuit for majority, indicating the extraction implementation is wrong.
  cost_accounting: 'CHARGED: (4) target descent — log2(n) monotone-circuit evaluations, cost >= n each, total >= n*log2 n; (6) memory — the unary encoding alone requires Theta(n) bits, which is the explicit killing term and is charged here rather than hidden; (5) verification — exact, recompute xP and compare to Q. OMITTED with no figure claimed: (1) preprocessing, (2) relation collection (structurally absent), (3) linear algebra (structurally absent), (7) multi-target accounting.'
  dominant_exponent: 1. The unary encoding forces |C| >= n = p^1, against a crossing threshold of p^{1/2}/log2 p. The candidate is above the threshold by p^{1/2}*log2 p and cannot cross.
  verdict: REJECTED-duplicate
  killer_objection: One-hot/unary encoding makes EVERY predicate monotone, so the extracted 'monotone interpolant' is literally the lookup table of MSB(log_P) and '|C| >= n' is the statement that a table over the group has N entries - definitional, not a theorem. The crossing threshold is p^{1/2}/log2 p, so the candidate misses by a full factor of p^{1/2}*log2 p, and the collapse shape is already recorded ~ten times in the corpus as 'restricted-model collapse'.
- uid: FEASINTERP:BAR-INTERP-D1
  id: BAR-INTERP-D1
  family: Feasible-interpolation / witnessing extraction of a discrete-log bit from a refutation
  family_key: FEASINTERP
  area: logic-and-proof-complexity
  group: D barrier
  title: 'BAR-INTERP-D1: extraction/strength anti-correlation — feasible interpolation converts proof strength into circuit strength only in the systems that have no strength'
  mechanism: 'State and argue the dichotomy that governs the entire family. For any proof system P admitting feasible interpolation with polynomial blow-up, a P-refutation of size S of the ECDLP disjoint pair yields a DL top-bit circuit of size poly(S) and hence a complete DL algorithm of cost O(log n * poly(S)). Therefore EITHER no interpolating system has refutations of size below ~p^{1/2}/log p for the ECDLP pair, OR ECDLP is easy. The literature closes the useful half of this dichotomy from the other side: exactly the STRONG systems — Extended Frege and Frege (Krajicek-Pudlak, under RSA/factoring hardness), TC^0-Frege (Bonet-Pitassi-Raz), and AC^0-Frege (Bonet-Domingo-Gavalda-Maciel-Pitassi, under DIFFIE-HELLMAN, i.e. literally the discrete-log assumption) — are those PROVED not to have feasible interpolation. Extraction is available only in the weak systems (Resolution, Cutting Planes, Nullstellensatz/PC, Lovasz-Schrijver), which are precisely where the corpus''s own degree/width/rank barriers already bite. Name the invariant: extraction power and proof power are anti-correlated, so the family can never have both simultaneously.'
  fingerprint: 'algebraic object: the pair (proof system P, ECDLP disjoint NP pair) and the map from P-refutations to separator circuits; public ops: P-derivations and interpolant extraction; hidden structure: the anti-correlation between a system''s proof power and its admission of feasible interpolation; info discarded: nothing — the barrier is about which implications are available; info retained: the dichotomy and its parameter S; relation primitive: irrelevant (the family has none); compression primitive: interpolant extraction, the very thing being bounded; rank mechanism: irrelevant; descent mechanism: irrelevant; dominant cost exponent: sigma >= 1/2 for every interpolating system — no interpolating P yields a refutation of the ECDLP pair with sigma < 1/2.'
  prediction: 'No proof system simultaneously (a) admits feasible interpolation and (b) has refutations of the ECDLP disjoint pair of size below p^{1/2}/log2 p. Concretely: A1''s measurement will show the resolution refutation size exponent sigma >= 1/2 even on the SMOOTH-ORDER arm where the target circuit provably exists, and the Diffie-Hellman-based non-interpolation results block the strong systems by assumption. The barrier is HONESTLY CONDITIONAL, not unconditional: making it unconditional would require an unconditional circuit lower bound on MSB(log_P), which is exactly what the corpus''s own NATURAL-PROOFS-INAPPLICABILITY D3 (idea_generation_20260722_batch20.md line 112) says is unavailable. I state that limitation rather than overclaim.'
  minimal_test: 'The barrier is falsifiable through A1''s smooth-order arm, which is the cheapest discriminating probe in the family. Concretely: p in {251, 1021, 4093, 16381}; on the 7-smooth-order arm a poly-size DL circuit PROVABLY exists (Pohlig-Hellman), so if the barrier is wrong and extraction tracks circuit existence, resolution refutation length must be polynomial in k = log2 p. Measure log2(DRAT line count) versus k with 3 seeds per size. Positive control: a disjoint pair whose interpolant is provably small AND whose refutation is provably short (a pair encoding a comparison of two unary-encoded numbers), where the extraction must succeed with a small proof — this validates that the pipeline can extract at all. Negative control: Tseitin on a 3-regular expander at matched CNF size.'
  falsification: 'D1 is falsified by ANY of: (i) a refutation of the ECDLP pair, in any system with feasible interpolation, of size below p^{1/2}/log2 p at any tested size, with the extracted interpolant exhaustively verified to compute MSB(log_P); (ii) polynomial growth of refutation length on the smooth-order arm across all four sizes; (iii) a proof that some system with feasible interpolation p-simulates Extended Frege, which would break the anti-correlation directly. Any one of these would make the family constructive and would be a genuine breakthrough. D1 is NOT falsified by censored cells: per harness rule 3, timeouts and infrastructure failures are never negative mathematical evidence and are recorded as CENSORED.'
  cost_accounting: 'CHARGED: none — this is a negative-theory candidate and claims no algorithm and no runtime figure. It BOUNDS stage (1) preprocessing (refutation size and hence extraction cost) and stage (4) target descent (interpolant evaluation cost) jointly, since in this family those two stages together are the entire algorithm. OMITTED with no figure claimed: (2) relation collection and (3) linear algebra are structurally absent from the family; (5) verification is exact and negligible; (6) memory and (7) multi-target accounting are handled by D2.'
  dominant_exponent: sigma >= 1/2 for every proof system admitting feasible interpolation. Since the complete cost of the family is (log2 n + 1) * poly(S) with S = p^sigma, the family cannot cross the 0.886*sqrt(n) baseline. The bound is conditional on the standard hardness assumptions (RSA/factoring for EF, Diffie-Hellman for AC^0-Frege) plus the empirical/conjectural weak-system bounds, and I do not claim it unconditionally.
  verdict: REJECTED-duplicate
  killer_objection: The extraction/strength anti-correlation is the textbook contrapositive of Krajicek-Pudlak 1998, Bonet-Pitassi-Raz 1997 and BDGMP 2004 - papers that PROVE their non-interpolation results by exactly this argument, and whose Diffie-Hellman hypothesis is already generic in the group, so substituting an elliptic-curve group is a parameter substitution rather than a theorem. It additionally duplicates the already-shipped D3 NATURAL-PROOFS-INAPPLICABILITY at mechanism level.
- uid: FEASINTERP:BAR-INTERP-ADVICE-D2
  id: BAR-INTERP-ADVICE-D2
  family: Feasible-interpolation / witnessing extraction of a discrete-log bit from a refutation
  family_key: FEASINTERP
  area: logic-and-proof-complexity
  group: D barrier
  title: 'BAR-INTERP-ADVICE-D2: the extracted interpolant IS a preprocessing advice string, so the whole family is a preprocessing attack in disguise and inherits BAR-AMORT-D2 / Corrigan-Gibbs-Kogan'
  mechanism: A propositional refutation refutes A(u,y) AND B(u,z) for ALL settings of the shared variables u. Since u carries the bits of the target Q, ONE refutation serves every target on the fixed (E, P), and the extracted interpolant C is a fixed circuit evaluated per target. That is precisely the definition of a preprocessing advice string. Consequently the family is not a fresh algorithmic lane at all — it is a construction method for DL preprocessing advice, and every preprocessing accounting rule already on file applies to it automatically, whatever the proof system and whatever the refutation size. In the generic-restricted compilation, Corrigan-Gibbs-Kogan gives S*T^2 = Omega~(eps*N) for advice size S and online group-operation count T; the known constructions realizing the S = T = N^{1/3} frontier require Omega~(N) offline work, so the SINGLE-TARGET complete cost with preprocessing charged is Omega~(N) = p^1, far above rho's p^{1/2}. Amortizing requires M >~ sqrt(N) targets, which is BAR-AMORT-D2 verbatim. The escape hatch is that the interpolant is NOT generic — it reads the F_p coordinates — but taking that hatch throws the family straight back onto D1 and the corpus's weak-system degree/width bounds.
  fingerprint: 'algebraic object: the extracted interpolant viewed as an advice string for the fixed pair (E, P), with Q as online input; public ops: offline refutation search and extraction, then online circuit evaluation; hidden structure: the identity of ''refutation valid for all u'' with ''advice valid for all targets''; info discarded: per-target specialization — one object must serve all targets; info retained: the S/T trade-off point; relation primitive: NONE; compression primitive: interpolant extraction, now recognized as advice compression; rank mechanism: NONE; descent mechanism: log2(n) advice-circuit evaluations; dominant cost exponent: 1 for single-target complete cost with preprocessing charged; 1/3 per-target only in the amortized regime that requires M >~ p^{1/2} targets.'
  prediction: 'No instantiation of the family beats single-target rho once stage (1) preprocessing is charged, because the interpolant is universal over targets and therefore is advice, and advice construction costs Omega~(N). Any reported win will be found to have omitted the preprocessing stage, and the family''s apparent single-target character is an accounting illusion. Specifically: if a future candidate in this family reports a per-target cost below 0.886*sqrt(n), it will be operating in the M >~ sqrt(N) multi-target regime, which the target definition for this program explicitly excludes from counting as a win.'
  minimal_test: 'An accounting audit, not a wet run, made concrete. For a 256-bit curve (N ~ 2^256): (i) tabulate the CGK frontier S*T^2 = Omega~(N) at three operating points T in {2^8, 2^40, 2^85}, giving S >~ {2^240, 2^176, 2^86}; (ii) add the Omega~(N) = 2^256 offline construction cost to each; (iii) compare the single-target total to 0.886*sqrt(n) ~ 2^127.8 — every point loses by at least 2^128; (iv) compute the amortization crossover M* solving M*sqrt(N) = N + M*N^{1/3}, obtaining M* ~ sqrt(N) ~ 2^128 targets. Positive control: apply the same audit to the known Mihalcik/Bernstein-Lange/CGK preprocessing attack and confirm the audit reproduces its published S = T = N^{1/3} frontier — this validates the accounting. Negative control: apply it to plain rho, where S = 0 and the audit must return exactly 0.886*sqrt(n).'
  falsification: Falsified if a refutation of the ECDLP pair can be made TARGET-SPECIFIC at cost below p^{1/2} per target — i.e. if some system admits per-instance refutations whose extraction cost does not amortize, breaking the identification of interpolant with advice. Also falsified if a sub-N preprocessing construction for DL advice is exhibited, which would break the Omega~(N) offline term independently of this family. Also falsified if the CGK bound is shown not to apply even in the generic-restricted compilation of the interpolant — but note that escaping via non-genericity is not a falsification of D2, it is a transfer of the burden to D1.
  cost_accounting: 'CHARGED, and this is the entire point of the candidate: (1) preprocessing — Omega~(N) to build the advice/refutation, the term every optimistic account of this family omits; (6) memory — S bits of advice must be stored, at the CGK frontier S >~ N/T^2; (7) multi-target accounting — the crossover M* ~ sqrt(N) is computed explicitly. ALSO CHARGED: (4) target descent — T online operations per target. OMITTED with no figure claimed: (2) relation collection and (3) linear algebra, structurally absent from the family; (5) verification, exact and negligible.'
  dominant_exponent: 1 for the single-target complete cost with preprocessing charged (Omega~(N) = p^1), versus rho's p^{1/2}. The per-target exponent 1/3 is reachable only in the amortized regime requiring M >~ p^{1/2} targets, which does not satisfy the program's single-target win condition.
