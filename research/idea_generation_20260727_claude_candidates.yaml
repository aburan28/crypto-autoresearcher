  prediction: 'The overlap profile of the E-sublevel set matches the hypergeometric null to within Poisson error at every one of 3 primes x 3 factor-base sizes x 4 energy thresholds, with NO forbidden band. Concretely at L=40, m=5 the null masses for k = |supp cap supp| = 0..5 are C(5,k)C(35,5-k)/C(40,5) = (0.4934, 0.3979, 0.0995, 0.00904, 2.66e-4, 1.52e-6) [computed this session from C(40,5)=658008, C(35,5)=324632, C(35,4)=52360, C(35,3)=6545, C(35,2)=595, C(35,1)=35]; all six observed masses land within 3 sigma. Further prediction: the elliptic ensemble is statistically indistinguishable from the curve-free i.i.d. control.'
  minimal_test: 'Fixtures: the three smallest primes above 2^20, 2^24, 2^28 admitting an ordinary prime-order curve (selected at runtime, not hardcoded). Factor base L in {24, 32, 40}; m = 5; v in {-1,0,1}^L with |supp(v)| = 5, so |space| = C(L,5)*2^5 (at L=40: 658008*32 = 2.1e7, fully enumerable). Precompute x_i = dlog(P_i) by BSGS at ~sqrt(p) <= 2^14 group ops per point. Energy thresholds E in {2^-4, 2^-8, 2^-12, 2^-16}; at L=40, p~2^20, |sublevel(2^-8)| ~ 2.1e7 * 2 * 2^-8 ~ 1.6e5, ample for a histogram. Sample 1e7 near-optimal pairs per cell; 5 independent factor-base seeds per cell. NEGATIVE CONTROL: x drawn i.i.d. uniform from Z/n directly (curve-free random modular subset-sum) - if the elliptic ensemble matches it, the curve contributes nothing. POSITIVE CONTROL: synthetic ensemble with a planted forbidden band at k=2 (delete all overlap-2 near-optima) to verify detector power.'
