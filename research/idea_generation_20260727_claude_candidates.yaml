  minimal_test: 'p in {1601, 3001, 10007}; L = ceil(p^{1/5}); 200 random targets per prime; rewriting arity m in {3,4,5}; large-prime tolerance in {0,1,2}; seeds 20260727..20260731. Record the full level-size profile of each descent tree; estimate rho TWO independent ways — the ratio test on level sizes, and a Flajolet-Odlyzko fit to the level-size asymptotics — and check the identity b_hat * P_hat = 1. POSITIVE CONTROL: a synthetic branching process with known rho; the estimator must recover it within 3% or the instrument is not admissible. NEGATIVE CONTROL: descent with a deliberately mismatched factor base — rho must move in the predicted direction.'
  falsification: A parametrization whose fitted descent exponent (log total descent nodes / log p) drops by more than 0.03 relative to the m=5, tolerance-0 baseline, replicated on all 3 primes AND agreed by both estimators. Anything seen on only one estimator or one prime is instrument noise, not evidence.
  cost_accounting: 'CHARGES: (4) target descent — the only stage it touches; and (5) verification of each descent step''s certificate. OMITS: (1) preprocessing, (2) relation collection, (3) linear algebra, (6) memory, (7) multi-target accounting. EXPLICIT SCOPE LIMIT: even a positive result is NOT a win. The m=5 index-calculus bottleneck is relation collection at q^{alpha*(5/4)}, not descent; a descent-only improvement cannot cross rho by itself. C2''s honest value is COVERAGE — as the family''s only stage-4 entry, a negative result closes the standing ''but you never tried descent'' objection that killed report85 A2, and a positive result would be the first descent-side movement in the lane.'
