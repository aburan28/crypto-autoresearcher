- uid: OGP:BAR-ENERGY-ORACLE-D2
  id: BAR-ENERGY-ORACLE-D2
  family: Overlap Gap Property (m-OGP) landscape barrier for relation-search OPTIMIZATION
  family_key: OGP
  area: statistical-physics
  group: D barrier
  title: D2 ENERGY-ORACLE / DLOG-HIDDEN-LANDSCAPE BARRIER (net-positive product of this run)
  mechanism: 'The relation configuration space carries a genuine graded energy H(v) = |sum_i v_i x_i|_circ / n, but evaluating H at any point with H > 0 requires the factor-base discrete logs - so an evaluable graded energy IS a partial-DLP oracle. Attacker-legal feedback is therefore the 0/1 equality test plus field-side statistics (Semaev residual, x-coordinate bits, serial-S3 chain hits) conjectured pseudorandom with respect to H. Consequence: the entire landscape/optimization toolkit - m-OGP, simulated annealing, Glauber/MCMC relation samplers, decimation, AMP, survey propagation, IAMP/stochastic localization, Franz-Parisi potential - is inapplicable BY CONSTRUCTION rather than by the four separate technical reasons previously recorded, which share this single root. Dichotomy form: either D2 holds, or an evaluable graded energy exists - and such an energy is itself a partial-DLP break, i.e. the programme would already have won.'
  fingerprint: 'object: the pair (attacker-legal statistic algebra on E(F_p), graded energy on Z/n); ops: group addition, equality test, x-coordinate read, F_p arithmetic, Semaev polynomial evaluation, serial-S3 chaining; hidden structure: the dlog isomorphism that supplies the grading and is exactly what the attacker lacks; discarded: nothing - the barrier is about what cannot be COMPUTED, not about what is thrown away; retained: the 0/1 membership bit as the only sound feedback signal; relation-generation primitive: forecloses all energy-descending harvesters; compression primitive: n/a; rank mechanism: n/a; descent mechanism: forecloses landscape descent and annealing-style target descent; dominant cost exponent: no exponent moved - the foreclosure is class-level, and it reinforces rather than challenges the Shoup Omega(sqrt(p)) generic bound.'
  prediction: Every attacker-evaluable surrogate has vanishing rank correlation with H, with |rho_Spearman| -> 0 as p grows. Specifically |rho| < 0.02 for the Semaev residual, the x-coordinate Hamming weight, and the serial-S3 chain-hit count, at p ~ 2^20, decreasing across 2^24 and 2^28.
  minimal_test: 'Exactly candidate C1''s experiment, which exists to decide this barrier: 1e6 weight-5 sign vectors per cell; 3 primes (smallest above 2^20, 2^24, 2^28 with ordinary prime-order curves) x L in {24, 40} x 5 seeds; surrogates s1 = folded integer lift of the Semaev residual S_6, s2 = Hamming weight of x(sum v_i P_i + R), s3 = serial-S3 intermediate-hit count against a density-1/L target set; Spearman rho with 1000-resample bootstrap CI; positive control H + 0.1-amplitude noise (must give rho ~ 0.9); negative control support-hash (must give rho ~ 0).'
  falsification: '|rho| >= 0.05 for any surrogate at p = 2^20, non-decreasing across the three primes, replicated over all 5 seeds. That refutes D2 and simultaneously opens C1 as a live constructive lane - the first evaluable descent direction in the programme. Note the asymmetry deliberately built in: this barrier''s falsifier is a genuine win, so the experiment is worth running even though the barrier is expected to hold.'
