  title: BLOCKSURROGATE-C1 — the family's declared honest gap, made precise, enumerated, and attacked
  mechanism: 'The family''s stated missing ingredient turned into a falsifiable requirement and then assaulted. Does there exist a coarse-scale surrogate Phi_k, evaluable on a whole dyadic block B_{k,r} = {r*2^k, ..., (r+1)*2^k - 1} of indices in time o(2^k), that correctly certifies ''no j in B_{k,r} has N(j) >= 1''? Such a Phi is exactly what a dyadic branch-and-prune needs and is the ONLY route by which ANY covariance structure could ever become an algorithm — which is why it, not the covariance itself, is the real question. Enumerate and empirically attack the three constructible forms: (i) low-frequency truncation Phi_k(B) = p^{-1} * sum over |t| <= 2^k of S(t,B), which requires the block sum to factor through a transform; (ii) a resultant/elimination surrogate treating the block as an algebraic family in one parameter; (iii) a precomputed block-occupancy advice table.'
