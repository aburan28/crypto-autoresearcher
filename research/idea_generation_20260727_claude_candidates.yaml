  mechanism: No m-OGP result - presence or absence - can move the Theta(sqrt(p)) relation-count exponent, because (a) the complete-cost exponent is set by solution DENSITY (Theta(1/q), pinned by the single mod-n constraint and independent of factor-base size L) together with the additive-group search structure, both invariant under any rearrangement of the solution set, while an m-OGP is a statement purely about ARRANGEMENT; and (b) at the only useful energy level (E = 1/n, exact relations) the near-optimal set has expected size Theta(1), so there is no exponentially large set for a band to be forbidden in - the OGP-nonvacuous regime and the relation-useful regime are separated by exactly the factor E*q.
  fingerprint: 'object: the near-optimal set of the lifted relation energy and its overlap profile; ops: any - the barrier is stated against the UNRESTRICTED algorithm class; hidden structure: none - the barrier asserts that arrangement carries no exponent; discarded: the arrangement itself; retained: the density Theta(1/q) and the additive-group search structure; relation-generation primitive: irrelevant; compression primitive: none helps; rank mechanism: irrelevant; descent mechanism: irrelevant; dominant cost exponent: relation count Theta(sqrt(p)), invariant under any overlap-profile hypothesis.'
  prediction: 'At L = q^(1/5), m = 5, signed weight-5 decompositions, the exact-relation count per random target concentrates at 2^m/m! = 32/120 = 0.267 - i.e. Theta(1), not exponential - and the sublevel-set density ratio |sublevel(E)| / (|space| * 2E) is pinned at 1 with the underlying solution density 1/q INDEPENDENT of L across all three toy sizes. Corollary: any claimed OGP-derived speedup must state which of these two measured invariants it breaks.'
  minimal_test: 'Measure (i) exact-relation count per random target and (ii) the density ratio |sublevel(E)|/(|space|*2E), at p in {2^20, 2^24, 2^28} (smallest primes above those bounds admitting an ordinary prime-order curve), L in {24, 32, 40}, m = 5, E in {2^-8, 2^-12}, 5 seeds, >= 1e4 random targets per cell. Gate: leave-one-out log-log slope of solution density against L must be 0 +/- 0.05, and the mean exact-relation count at L = q^(1/5) must be 0.267 +/- 0.05.'
  falsification: 'Either (a) a measured solution density that DEPENDS on L (LOO slope differing from 0 by more than 0.05, replicated across seeds and sizes), or (b) an exponentially growing exact-relation set at the L = q^(1/5) operating point. Either result means the relation constraint is not effectively a single mod-n equation and D1''s premise fails. A third falsifier: exhibit two ensembles with identical density but opposite OGP status AND different optimal query complexity - that would prove arrangement does carry an exponent.'
  cost_accounting: Charges NONE of the seven stages. It FORECLOSES a hypothetical win in relation collection (stage 2) and says nothing at all about preprocessing, linear algebra, target descent, verification, memory, or multi-target accounting. It is a foreclosure, not an attack, and must never be cited as cost evidence for any pipeline.
