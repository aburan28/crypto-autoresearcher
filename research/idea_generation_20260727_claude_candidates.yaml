- uid: EIGLOC:A1-OCCMEAS-PR
  id: A1-OCCMEAS-PR
  family: Eigenvector localization / random-matrix level statistics of the pseudorandom-walk transition operator
  family_key: EIGLOC
  area: statistical-physics
  group: A conservative-extension
  title: Participation-ratio instrument on the quenched occupation measure of the r-adding walk
  mechanism: 'Measure, on the walk Pollard rho actually runs (the deterministic map R -> R + M_{s(R)}), the Renyi-2 participation ratio PR(pi_hat_T) = 1/sum_x pi_hat_T(x)^2 of the single-trajectory empirical occupation measure, and fit the collision exponent theta in T_coll = n^theta against the identity T_coll = Theta(sqrt(PR)). This replaces the corpus''s outcome-level metric (group-ops-per-collision, EXP-018) with the cause-level statistic that NR-023 explicitly asked for but never defined. Sensitivity note (honest): a localized core of size n^{1-c} only becomes visible at T ~ sqrt(|S|), which is exactly the collision time, so the instrument''s detection threshold coincides with the point at which localization would start paying off — it is neither over- nor under-powered.'
  fingerprint: 'algebraic object: empirical occupation measure pi_hat_T of one quenched trajectory of R -> R + M_{s(R)} on the prime-order subgroup <P> of E(F_p) | public ops: EC point addition, x-coordinate bit extraction for the index map s(.), visit-count histogramming | hidden structure: hypothesised localized core S with pi_hat(S) -> 1 and |S| = n^{1-c} | info discarded: the exponent pairs (a,b), the visit order, all curve arithmetic beyond the step | info retained: the visit-count histogram, i.e. the Renyi-2 collision entropy of pi_hat_T | relation primitive: unchanged ordinary rho collision aP+bQ = a''P+b''Q with (a,b) != (a'',b'') | compression primitive: none — this is an instrument, not an algorithm | rank mechanism: n/a (rho has no linear algebra) | descent mechanism: standard rho descent k = (a-a'')(b''-b)^{-1} mod n, complete and unchanged | dominant cost exponent: predicted theta = 1/2 (c = 0)'
  prediction: theta = 0.500 +/- 0.02 for every r in {4,20,128} across all sizes, and PR(pi_hat_{T_coll})/T_coll^2 converges to a constant kappa(r) that is FLAT in n. Any r-dependence — including the known small-r deviation of adding walks from uniformity, which is the one literature fact that makes the measurement non-vacuous — appears as a constant kappa(r), never as a size-dependent exponent. This constant-vs-exponent discrimination is the entire deliverable.
  minimal_test: '5 sizes n in {2^20, 2^24, 2^28, 2^32, 2^36} (add 2^40 for fit leverage), ordinary prime-order a=-3 prime-field curves; r in {4, 20, 128}; 30 DISTINCT targets Q per cell (NR-023 reusable-lesson 3 forbids a single-Q mean — all 200 EXP-018 instances targeted one Q, invalidating that statistic); run each trajectory to first exponent-distinct collision; record T_coll, PR(pi_hat_{T_coll}), and fruitless-cycle event count. POSITIVE CONTROL: MAP_D-style structured coset offsets (|S|=3) from EXP-018, recorded in NR-023 as 33-213x slower — must exhibit PR/T_coll^2 far below kappa, proving the instrument detects real localization. NEGATIVE CONTROL: iid uniform sampler on <P> — must return theta = 0.5 and PR = Theta(T_coll^2). Budget approx 10^8 EC additions at n=2^36; minutes on one core.'
  falsification: 'Family goes CONSTRUCTIVE if fitted theta <= 0.45 with a monotone downward trend across >= 4 of 5 sizes AND the collisions are exponent-distinct (useful). Barrier D1 is confirmed if theta in [0.48, 0.52] with kappa(r) flat in n. The instrument is declared INVALID — evidence for neither side — if the negative control fails to return theta = 0.5, or if any run is truncated by timeout or resource exhaustion (AGENTS.md rule 3: timeouts and infra failures are never negative mathematical evidence).'
  cost_accounting: 'CHARGES: relation collection / collision search only. OMITS: preprocessing, linear algebra (rho has none), target descent, verification, memory, multi-target. Explicit disclosure: the histogram costs Theta(T) words, far above a real rho implementation''s Theta(1) memory — this is instrument-only overhead and is charged to no algorithm. A1 can never by itself constitute a rho-beating claim; it emits exactly one exponent readout theta.'
  dominant_exponent: n^{1/2} predicted (unchanged from the 0.886*sqrt(n) rho baseline); the measured quantity IS the exponent, so the instrument is exponent-bearing even though the candidate is not an algorithm.
  verdict: REJECTED-exponent-neutral
  killer_objection: 'Fatal validity defect: a single trajectory''s empirical occupation measure is uniform-on-visited by construction, so no occupation-measure statistic can predict rho collision time - the instrument cannot measure what it claims. The lane (functional-graph cycle/visit statistics used to predict collision time) is prior art and closed: ECFG-001..043 functional-graph selector hypotheses are recorded ''almost all NEGATIVE'', and batch7 already collapsed this exact mechanism class.'
- uid: EIGLOC:A2-LOCSIGN
  id: A2-LOCSIGN
  family: Eigenvector localization / random-matrix level statistics of the pseudorandom-walk transition operator
  family_key: EIGLOC
  area: statistical-physics
  group: A conservative-extension
  title: 'Sign-of-effect test: does occupation-measure localization accelerate or sabotage collision search?'
  mechanism: 'Logically prior to measuring the magnitude of a localization exponent is determining its SIGN. NR-023 already records the only relevant datapoint: the most structured (most confining) walk map tested, MAP_D with coset-offset compression |S|=3, was 33-213x SLOWER than the unstructured MAP_B. A2 regresses log(group-ops-per-USEFUL-collision) on log(PR(pi_hat)) across MAP_B/MAP_C/MAP_D plus a tunable-confinement family, testing whether confinement is cost-positive or cost-negative. Mechanistic prediction: confinement in an exponent-trackable walk manifests as fruitless cycling — revisits whose exponent difference degenerates — so lowering PR raises cost. This is the cheapest possible test of the family''s core premise and it uses data the program already paid for.'
  fingerprint: 'algebraic object: the joint (PR, ops-per-useful-collision) profile of a parameterized family of r-adding step-set designs on <P> | public ops: EC addition, step-set construction, exponent bookkeeping, collision detection with an exponent-distinctness check | hidden structure: the coupling between point-orbit confinement and exponent-increment degeneracy | info discarded: identity of individual points, the curve''s j-invariant | info retained: two scalars per cell — PR(pi_hat) and ops-per-USEFUL-collision | relation primitive: ordinary rho collision, counted only when (a,b) != (a'',b'') | compression primitive: none | rank mechanism: n/a | descent mechanism: standard rho descent, unchanged | dominant cost exponent: 1/2; A2 measures the sign of d log(cost)/d log(PR), not the exponent itself'
  prediction: 'The regression slope d log(ops) / d log(PR) is strictly NEGATIVE — cost rises as PR falls — and the fruitless-cycle event rate rises monotonically as PR falls. Quantitatively: MAP_D reproduces a PR/T^2 at least 10x below MAP_B while costing >= 30x more ops, recovering NR-023''s recorded 33-213x band as a function of PR rather than of map name.'
  minimal_test: 'Replicate EXP-018''s three maps (MAP_B = x mod 3 partition + negation; MAP_C = 20-set partition, 50% doublings; MAP_D = coset-offset compression |S|=3) at the SAME n in {16,20,24} bits for direct comparability with NR-023, then extend to n in {2^28, 2^32} with 30 distinct targets per cell. Add a tunable family: step multipliers drawn from an arithmetic progression of controllable density, sweeping confinement continuously over ~8 settings. Record PR, ops-per-useful-collision, fruitless-cycle count. POSITIVE CONTROL: the negation map without its standard fruitless-cycle fix (known to trap in 2-cycles). NEGATIVE CONTROL: MAP_B itself, which must reproduce NR-023''s recorded group-op figures within noise, validating the replication before any new inference is drawn.'
  falsification: The barrier direction is REFUTED if any cell shows PR reduced by >= 2x AND ops-per-useful-collision reduced by >= 1.2x simultaneously, replicated across >= 3 sizes and >= 30 distinct targets. It is CONFIRMED if the slope is negative across all cells. A non-monotone or noisy slope with overlapping confidence intervals is INCONCLUSIVE — explicitly not a negative result.
  cost_accounting: 'CHARGES: relation collection only, including every step wasted in fruitless cycles — charging the waste is the whole point. OMITS: preprocessing, linear algebra, target descent, verification, memory, multi-target. Honest asymmetry worth stating: A2 charges the recognition-and-waste cost that the family''s original framing omitted, which is precisely the hidden charge the brief flagged as able to eat the exponent gain by itself.'
  dominant_exponent: n^{1/2} throughout; A2 tests the SIGN of the localization effect at fixed exponent and makes no exponent claim.
  verdict: REJECTED-duplicate
  killer_objection: The novelty case rests on the claim that NR-023 records a per-map verdict 'with no explanatory variable and no mechanism'; that is factually false against the cited record. NR-023 states the mechanism (walk bias from structured coset offsets), prescribes the explanatory variable (always measure fruitless-cycle rate or walk-return probability), and names the follow-up - and hypothesis_ledger.md H09 already prescribes A2's exact joint measurement.
- uid: EIGLOC:B1-COLLENT-SUPPLY
  id: B1-COLLENT-SUPPLY
  family: Eigenvector localization / random-matrix level statistics of the pseudorandom-walk transition operator
  family_key: EIGLOC
  area: statistical-physics
  group: B representation-change
  title: 'From spectral gap (eigenvalue) to Renyi-2 collision entropy of the stationary measure: the correct supply object for collision search'
  mechanism: 'The corpus has priced the walk operator''s EIGENVALUE side exhaustively (''spectral gap'' 48/95; ISOWALK-C1 is a non-backtracking Ramanujan-gap gate). The representation change: for collision search the governing functional is not the spectral gap but the Renyi-2 collision entropy of the walk''s occupation measure pi, via the exact identity E[# colliding pairs among T samples] = C(T,2) * sum_x pi(x)^2 = C(T,2)/PR(pi), hence T_coll = Theta(sqrt(PR(pi))). The gap controls how FAST pi is approached — a burn-in constant, which is exactly why the standing red-team expectation on ISOWALK-C1 is ''constant, not exponent''; PR(pi) controls WHERE the birthday exponent sits. This reframing DERIVES that recorded expectation instead of assuming it, and identifies PR(pi) as the unique exponent-bearing supply quantity of the entire walk lane. It also corrects the family''s own framing: a measure can have full support yet small PR, so ''support size |S|'' is the wrong observable and PR is the right one.'
  fingerprint: 'algebraic object: the stationary/occupation measure pi of an exponent-trackable walk on <P>, viewed through its Renyi-2 collision entropy H_2(pi) = -log sum_x pi(x)^2 | public ops: EC addition, step selection, sampling | hidden structure: the identity PR(pi) = 2^{H_2(pi)} as the sole exponent-bearing degree of freedom in collision search | info discarded: the entire eigenvalue spectrum of T — gap, mixing time, Ihara/non-backtracking data — all demoted to burn-in constants | info retained: one scalar, H_2(pi) | relation primitive: rho collision, useful iff exponent-distinct | compression primitive: none; this is a re-accounting, not a compression | rank mechanism: n/a | descent mechanism: standard rho descent, complete and unchanged — the reframing is a SUPPLY statement, not a descent gap | dominant cost exponent: theta = log(PR(pi)) / (2 log n); the D1 theorem pins PR(pi) = n hence theta = 1/2'
  prediction: (a) The identity T_coll = Theta(sqrt(PR(pi))) holds empirically to within a small constant across every walk design tested, including the pathological MAP_D. (b) For every state-INDEPENDENT trackable step selection, PR(pi) = n EXACTLY (D1 horn i), so no gap improvement — Ramanujan or otherwise — can move theta. (c) Consequently ISOWALK-C1, even if it attains the Ramanujan bound, yields a constant only, confirming by derivation the red-team expectation recorded at idea_generation_20260722_batch21.md line 279.
  minimal_test: 'Two parts. (i) IDENTITY CHECK: on n in {2^20, 2^24, 2^28}, for 6 walk designs spanning PR from n down to about n^{1/2} — MAP_B, MAP_D, an iid sampler, and critically a subgroup-confined walk on a deliberately COMPOSITE-order curve where a proper invariant subgroup genuinely exists — measure PR(pi_hat) and T_coll independently and test T_coll/sqrt(PR) within a band [c1,c2] with c2/c1 < 3. The composite-order curve is the decisive positive control: there PR(pi) really is < n and theta really does drop, demonstrating the instrument can detect a true exponent shift and simultaneously isolating PRIME ORDER as the load-bearing hypothesis rather than an artifact. (ii) GAP-INDEPENDENCE CHECK: construct two step sets with deliberately different spectral gaps but identical (uniform) pi; verify T_coll differs by a constant only, with no size-dependent drift.'
  falsification: The representation is WRONG if the identity check fails — T_coll not Theta(sqrt(PR)) — on any non-degenerate design, or if the gap-independence check shows a size-dependent (exponent-level) difference between equal-pi designs. The representation is CORRECT but the lane is CLOSED if the composite-order control shows theta < 1/2 while every prime-order design shows theta = 1/2.
  cost_accounting: 'CHARGES: relation collection. OMITS: preprocessing, linear algebra, target descent, verification, memory, multi-target. Honest limitation stated up front: B1 is a re-accounting of a single stage; it produces no algorithm and cannot beat rho. Its deliverable is the identity plus the reduction of the whole walk-spectral lane to one scalar, which is a screening tool for future candidates rather than an attack.'
  dominant_exponent: theta = log_2(PR(pi)) / (2 log_2 n); the rho baseline theta = 1/2 is recovered exactly when PR = n, and the formula makes explicit what any winner in this lane would have to achieve.
  verdict: REJECTED-duplicate
  killer_objection: 'Already recorded twice in-corpus as ISOWALK-C1''s own fatal obstruction and published externally (Bellare-Kohno balance; Teske walk quality). The supporting novelty screen misreports files it claims to have read: all 18 Renyi occurrences in the denominator are Erdos-Renyi random-graph negative controls, zero are entropy. And the parameterization is empty - any candidate that could move PR is already non-generic, at which point PR is bookkeeping.'
- uid: EIGLOC:B2-QUENCH-FGRAPH
  id: B2-QUENCH-FGRAPH
  family: Eigenvector localization / random-matrix level statistics of the pseudorandom-walk transition operator
  family_key: EIGLOC
  area: statistical-physics
  group: B representation-change
  title: 'Quenched functional-graph representation: the operator the algorithm runs is not the operator the corpus priced'
  mechanism: 'The corpus''s standing kill for the walk-spectral lane is that the walk operator''s ''spectrum is Fourier-circular (= DLP), so the walk is cost-neutral'' (recorded verbatim at idea_generation_20260721_batch11.md line 402, batch12 line 329, batch13 line 352). That statement is true for the ANNEALED operator — steps chosen independently of position, i.e. a Cayley-graph walk on an abelian group, diagonalized by characters. But the algorithm actually runs the QUENCHED map R -> R + M_{s(R)}: deterministic, state-dependent, with exactly one 1 per row, translation-invariance broken by the x-coordinate partition s(.), and NOT Fourier-diagonalizable. B2''s representation change replaces the stochastic matrix by the functional graph of the actual map and prices it with Flajolet-Odlyzko random-mapping statistics — rho length, tail length, cyclic points, component count — at the EXPONENT level, together with the per-cycle exponent increment. This exposes and repairs a genuine over-statement in a catalogued kill.'
  fingerprint: 'algebraic object: the functional graph of the deterministic map f: R -> R + M_{s(R)} on <P>, together with its exponent cocycle (a,b) -> (a + m_s, b + n_s) | public ops: EC addition, x-coordinate partition evaluation, forward iteration only | hidden structure: deviation of f''s rho-length and cyclic-point count from the random-mapping law, and the exponent-degeneracy of its cycles | info discarded: the character/Fourier decomposition (inapplicable — f is not translation-equivariant), the eigenvalue spectrum | info retained: (tail length, cycle length, # cyclic points, # components, per-cycle exponent increment) | relation primitive: cycle-closure collision, useful iff the exponent increment around the cycle is nonzero | compression primitive: none | rank mechanism: n/a | descent mechanism: standard rho descent, gated on a nonzero cycle exponent increment | dominant cost exponent: predicted n^{1/2} with Flajolet-Odlyzko constants (rho length ~ sqrt(pi*n/8), cyclic points ~ sqrt(pi*n/2))'
  prediction: For r >= 16 the measured (tail, cycle, cyclic-point) statistics agree with the random-mapping law to within constants, with no size-dependent drift. For r <= 4 the known adding-walk deviation appears as an r-dependent CONSTANT multiplying sqrt(n), not as an exponent. Crucially, the fraction of cycles with DEGENERATE (zero) exponent increment is o(1) for standard designs and Theta(1) for confining designs — the quantitative form of the D2 coupling.
  minimal_test: 'n in {2^20, 2^24, 2^28} prime-order ordinary a=-3 curves; r in {2,3,4,8,16,32,128}; 200 seeds per cell; full functional-graph statistics via Brent cycle detection with exponent tracking. Record tail length, cycle length, cyclic-point count, component count, and per-cycle exponent increment (zero or not). POSITIVE CONTROL: an explicitly random function on n points, which must reproduce the Flajolet-Odlyzko constants. NEGATIVE CONTROL: a pure translation R -> R + M, which is a single n-cycle with tail 0 and total exponent increment n*m = 0 mod n — the maximally degenerate case, demonstrating that the instrument detects exponent-degeneracy rather than merely cycle shortness.'
  falsification: The corpus's Fourier kill is shown INSUFFICIENT (not wrong) if the quenched statistics deviate at all from the annealed prediction — this is already expected and is not itself a win. The FAMILY goes constructive only if rho length scales as n^theta with theta <= 0.45 for some r, with exponent-DISTINCT cycle closures, replicated across >= 3 sizes. The lane is confirmed closed if theta = 0.5 +/- 0.02 for all r with only constant-level r-dependence.
  cost_accounting: 'CHARGES: relation collection — the full walk to cycle closure INCLUDING the tail. Charging the tail is the honest correction the family''s original framing omitted: the cycle is genuinely localized (PR ~ sqrt n) but is reached only after a Theta(sqrt n) tail. OMITS: preprocessing, linear algebra, target descent, verification, multi-target. MEMORY is noted but not charged to an algorithm: Brent detection is Theta(1), while the instrument''s full-graph statistics are Theta(sqrt n) and are instrument-only.'
  dominant_exponent: n^{1/2}, with the Theta(sqrt n) TAIL length being precisely the term that forbids exploiting the cycle's own localization — the quantitative content of D1 horn (iii).
  verdict: REJECTED-duplicate
  killer_objection: 'The ''quenched functional graph'' object IS the r-adding walk, i.e. Pollard rho itself, and the diagnostic on offer (instrument the actual walk rather than trusting the closed-form baseline) is ALREADY a required open task in the ledger: NR-026 records ''rho baseline = 0.886*sqrt(n)*12 field-ops (formula, not a measured walk)'' and prescribes EXP-023. Restating why rho costs sqrt(n) is the baseline the program is trying to beat, not a barrier above it.'
- uid: EIGLOC:C1-RPWALK
  id: C1-RPWALK
  family: Eigenvector localization / random-matrix level statistics of the pseudorandom-walk transition operator
  family_key: EIGLOC
  area: statistical-physics
  group: C high-risk
  title: 'Rosenzweig-Porter interpolation between the Cayley walk and the deterministic map: is there a nonergodic-extended phase?'
  mechanism: 'D1''s two horns are endpoints: at eps=0 the annealed Cayley walk has pi exactly uniform, PR = n, theta = 1/2; at eps=1 the fully deterministic map has pi supported on Theta(sqrt n) cyclic points but reached only after a Theta(sqrt n) tail. Consider the interpolating chain P_eps = (1-eps) U + eps D, where U is the uniform-index r-adding walk and D the x-coordinate-determined one — i.e. at each step, with probability eps consult s(R), else draw the index uniformly. This is the ECDLP analogue of the Rosenzweig-Porter ensemble, the one random-matrix model exhibiting a genuine NONERGODIC-EXTENDED phase (PR = n^{D_2} with 0 < D_2 < 1) rather than a sharp localized/delocalized dichotomy. The high-risk question: is there an eps at which PR(pi_eps) = n^{1-c} with c > 0 AND the burn-in/hitting cost stays o(n^{(1-c)/2})? If so, theta < 1/2. The candidate''s one genuine strength is that the mixed walk remains fully exponent-trackable, so unlike ISOWALK-C1 it has NO descent gap.'
  fingerprint: 'algebraic object: the one-parameter family of transition operators P_eps = (1-eps) U + eps D on <P> | public ops: EC addition, a biased coin, x-coordinate partition evaluation | hidden structure: hypothesised nonergodic-extended phase with fractal dimension D_2(eps) in (0,1) | info discarded: the eigenvalue spectrum; exponent bookkeeping is retained but unused by the mechanism | info retained: PR(pi_eps) and the hitting time to the high-density core | relation primitive: rho collision, useful iff exponent-distinct | compression primitive: none | rank mechanism: n/a | descent mechanism: standard rho descent, COMPLETE — the mixed walk stays exponent-trackable, so this candidate has no descent gap, unlike ISOWALK-C1 | dominant cost exponent: hypothesised n^{(1-c)/2} + hitting cost; predicted to collapse to n^{1/2}'
  prediction: NEGATIVE. D_2(eps) = 1 (PR = Theta(n), c = 0) for every eps bounded away from 1, because for eps < 1 the chain retains a uniform-translation component that is doubly stochastic and pulls the measure back to uniform; c jumps to 1/2 only in the eps -> 1 limit, where the Theta(sqrt n) tail cost reappears and dominates. Total cost T_hit + sqrt(PR) is predicted to be Omega(sqrt n) for every eps in [0,1], with a shallow minimum at eps = 0.
  minimal_test: 'n in {2^20, 2^24, 2^28}; r = 20; eps in {0, 0.25, 0.5, 0.75, 0.9, 0.99, 1.0}; 30 distinct targets per cell. Measure PR(pi_hat), T_coll to first exponent-distinct collision, and fruitless-cycle rate; fit c(eps) and theta(eps). POSITIVE CONTROL: the composite-order curve from B1, where a true invariant subgroup exists — must show c > 0, proving the sweep can detect a nonergodic phase if one exists. NEGATIVE CONTROL: eps = 0, which must return theta = 0.5.'
  falsification: 'CONSTRUCTIVE if any eps yields theta(eps) <= 0.45 with exponent-distinct collisions across >= 3 sizes with a monotone trend. Closed if theta(eps) >= 0.48 for all eps, with the eps -> 1 end exhibiting the predicted tail-cost dominance. Note the pre-registration: D1''s subset-sampling identity predicts the outcome BEFORE the sweep runs, so a positive result would falsify D1 — which is exactly what makes the sweep worth running rather than assuming.'
  cost_accounting: 'CHARGES: relation collection INCLUDING the burn-in/hitting phase AND the per-step cost of evaluating s(R) at rate eps — the membership-recognition charge the brief flagged as the hidden cost that can eat the exponent gain by itself. OMITS: preprocessing, linear algebra, target descent, verification, memory, multi-target. Honest gate: even a positive c would require re-charging memory and verification before any rho comparison could be claimed.'
  dominant_exponent: predicted n^{1/2} for all eps; the hypothesised alternative being tested is n^{(1-c(eps))/2} + n^{h(eps)}, where h is the hitting exponent and the barrier claim is that the two terms cannot both be sub-1/2.
  verdict: REJECTED-exponent-neutral
  killer_objection: 'The true object is ''which index-selection rule should the r-adding walk use'' - a walk-map design question already carrying a scoped negative of the opposite sign: NR-023 measured structured step sets inflating cost 33-213x, whereas C1''s premise is that biasing helps. The residual analytic content, PR(pi_eps) = (1-eps^2)N, confines all eps-dependence to a prefactor and is a prettier proof of two catalogued walls rather than a third.'
- uid: EIGLOC:C2-MBLFLEET
  id: C2-MBLFLEET
  family: Eigenvector localization / random-matrix level statistics of the pseudorandom-walk transition operator
  family_key: EIGLOC
  area: statistical-physics
  group: C high-risk
  title: 'Many-body localization of the van Oorschot-Wiener parallel fleet — REJECTED: the walkers do not interact'
  mechanism: 'Single-particle Anderson localization is killed by D1. The remaining physics escape hatch is MANY-BODY localization, which can localize an interacting many-particle system whose single-particle counterpart is delocalized — precisely the situation D1 leaves open. The VW parallel-rho fleet of W walkers sharing a distinguished-point table is superficially a many-particle system on <P>, and H11/BMTRD (hypothesis_ledger.md line 29, recorded INCONCLUSIVE) is the corpus''s open fleet-scaling question. C2 asks whether the fleet''s joint occupation measure on <P>^W localizes. VERDICT: REJECTED on inspection, with a clean structural reason. MBL requires a genuine dynamical INTERACTION term. In the VW fleet the walkers are exactly independent: each trajectory''s transition depends only on its own state, and the DP table is a write-only readout consulted for collision detection, never fed back into any walker''s transition. The joint measure is therefore an exact product measure pi^{tensor W}, whose participation ratio is PR(pi)^W — delocalization is AMPLIFIED, not defeated. There is no interaction to localize. Recording the rejection with its reason is the deliverable.'
  fingerprint: 'algebraic object: the joint occupation measure on <P>^W of a W-walker VW fleet | public ops: EC addition per walker, DP predicate, table insert/lookup | hidden structure: hypothesised inter-walker correlation — SHOWN ABSENT (exact product measure) | info discarded: everything except the joint histogram | info retained: PR(joint) = PR(pi)^W | relation primitive: cross-walker DP collision, useful iff exponent-distinct | compression primitive: the distinguished-point table — a memory/communication device, NOT a dynamical coupling, and this distinction is the whole kill | rank mechanism: n/a | descent mechanism: standard rho descent from the cross-walker collision | dominant cost exponent: n^{1/2} total work, n^{1/2}/W wall-clock with W-fold hardware — the standard VW linear speedup, no exponent change'
  prediction: 'PR(joint) = PR(pi)^W exactly (product measure), and measured inter-walker mutual information is zero up to sampling noise for every W. Fleet scaling follows VW: total work Theta(sqrt n) independent of W, wall-clock Theta(sqrt n / W). No MBL phase exists at any W.'
  minimal_test: 'n in {2^20, 2^24}; W in {1, 4, 16, 64}; measure empirical mutual information between walker pairs'' occupancy indicators and test against zero; verify PR(joint) = PR(pi)^W. POSITIVE CONTROL: an ARTIFICIALLY coupled fleet in which walker i''s step index depends on walker j''s current x-coordinate — a genuine interaction — which must show nonzero mutual information, demonstrating the instrument works. Explicit warning: this artificial coupling is NOT a candidate attack; it destroys independent exponent tracking and is included solely as an instrument control. NEGATIVE CONTROL: the standard uncoupled VW fleet, which must show zero.'
  falsification: C2 would be revived only if a STANDARD (uncoupled) fleet showed nonzero inter-walker mutual information — which would indicate an implementation defect rather than physics. The rejection stands as long as each walker's transition is a function of its own state alone, which is a property of the VW algorithm's definition and not an empirical question. This candidate is therefore closed by inspection, and the experiment is a soundness check on that reasoning, not a live test.
  cost_accounting: 'CHARGES: relation collection, MULTI-TARGET / parallel accounting (the stage most often omitted elsewhere in this candidate set), and MEMORY (the DP table, Theta(sqrt n / theta_DP) entries). OMITS: preprocessing, linear algebra, target descent, verification. C2 deliberately charges memory and multi-target because those are exactly the stages a fleet claim must survive — and it still finds no exponent change, which is why the rejection is robust rather than provisional.'
  dominant_exponent: 'n^{1/2} total work, unchanged. Multi-target with T targets: Theta(sqrt(T*n)) per VW and consistent with BAR-AMORT-D2 (Corrigan-Gibbs-Kogan ST^2 = Omega(eps*N)); no exponent movement in any stage.'
  verdict: REJECTED-duplicate
  killer_objection: Stripped of physics labels the object is verbatim H11/BMTRD (the van Oorschot-Wiener W-walker fleet sharing a distinguished-point table), carried in hypothesis_ledger.md at RESTRICTED THEOREM status. The many-body premise is false on its own analysis - the walkers do not interact, PR(joint) = PR(pi)^W exactly - so multi-target Theta(sqrt(T*n)) is plain VW94 and consistent with BAR-AMORT-D2; recording it would inject a false structural claim into an immutable ledger.
- uid: EIGLOC:D1-THM-OCCLOC1
  id: D1-THM-OCCLOC1
  family: Eigenvector localization / random-matrix level statistics of the pseudorandom-walk transition operator
  family_key: EIGLOC
  area: statistical-physics
  group: D barrier
  title: 'OCCUPATION-MEASURE DELOCALIZATION BARRIER: no exponent-trackable collision-search walk on a prime-order subgroup can localize profitably'
  mechanism: 'A three-horn dichotomy plus a sampling identity, closing the localization lane. SETUP: every step must be EXPONENT-TRACKABLE — the state must remain a known affine combination aP + bQ. The permissible steps are translations R -> R + M_j, known-scalar multiplications R -> [c]R with gcd(c,n)=1, and automorphisms (negation; extra automorphisms only at j=0,1728, excluded for ordinary generic curves). EVERY such map is a BIJECTION of <P>, hence measure-preserving. HORN (i) ANNEALED: if the step index is chosen independently of the current point, T is a convex combination of permutation matrices, hence DOUBLY STOCHASTIC; assuming the M_j generate (irreducibility), its unique stationary measure is exactly uniform, so PR(pi) = n and by the B1 identity theta = 1/2 exactly. Equivalently T is the Cayley operator of an abelian group, diagonalized by the n characters, each with inverse participation ratio exactly 1/n. HONEST STATUS: this horn is a COROLLARY of a catalogued fact (''spectrum is Fourier-circular (= DLP)'') and is restated in measure-theoretic language only because the other horns need that form; it is NOT claimed as new. HORN (ii) STRUCTURAL CONFINEMENT: suppose a proper nonempty S is invariant under the step maps and recognizable independently of running the walk. Invariance under translation by M != O forces S to be a union of cosets of <M>; because <P> has PRIME order n, <M> = <P> for every M != O, so S = <P>, a contradiction. Prime order — the target regime — is load-bearing: on a composite-order curve a proper invariant subgroup exists and the argument genuinely fails, which is precisely why Pohlig-Hellman applies there and not here. HORN (iii) POST-HOC CONFINEMENT: the remaining escape is S = the walk''s own forward orbit, trivially invariant. For the quenched map this is the rho tail plus cycle; the cyclic part has size Theta(sqrt n) — genuine localization, PR ~ sqrt n — but is reached only after a tail of expected length Theta(sqrt n). The localization is a CONSEQUENCE of the collision, not a route to it. Circular. SUBSET-SAMPLING IDENTITY (closes the recognition loophole): abandon invariance and rejection-sample into a recognizable S with |S| = n^{1-c}. Producing one point of S with known exponents costs n/|S| trials; a birthday collision within S needs Theta(sqrt|S|) points; total = (n/|S|) * sqrt|S| = n/sqrt|S| >= sqrt n, with EQUALITY iff |S| = n. Every proper subset is STRICTLY WORSE and the loss is monotone in c. Multi-target version: (n/|S|) * sqrt(T|S|) = n*sqrt(T)/sqrt|S| >= sqrt(T*n), unchanged. CONCLUSION: localization is impossible (i), non-existent (ii), circular (iii), or self-cancelling (identity).'
  fingerprint: 'algebraic object: the set of exponent-trackable self-maps of <P> (translations, known-scalar multiplications, automorphisms) and the invariant measures of the walks they generate | public ops: EC addition, known-scalar multiplication, negation, x-coordinate membership tests | hidden structure: NONE SURVIVES — the theorem''s content is that the hypothesised localized core does not exist | info discarded: the entire spectral side (eigenvalues, gap, mixing time) as constant-level | info retained: one scalar, PR(pi), pinned to n | relation primitive: rho collision, unchanged | compression primitive: none — the barrier forbids exactly the compression the family sought | rank mechanism: n/a | descent mechanism: standard rho descent, COMPLETE — this is a SUPPLY barrier, not a descent gap, which is what makes it bite | dominant cost exponent: n^{1/2}, proved unimprovable within the stated model'
  prediction: 'No exponent-trackable walk design on an ordinary prime-order prime-field curve achieves theta < 1/2. Concretely: every design in A1/A2/B2/C1 returns theta in [0.48, 0.52], while the composite-order control returns theta < 1/2 — confirming that prime order is the load-bearing hypothesis rather than an artifact of the instrument. The barrier also predicts, without further experiment, that ISOWALK-C1 resolves as constant-only.'
  minimal_test: 'Horns (i) and (ii) are THEOREMS — the discriminating work is a proof, not an experiment. The mechanized soundness check is an EXHAUSTIVE finite verification of the invariant-subset claim at small prime order: for n in {101, 211, 1009}, enumerate all subsets closed under x -> x + m for each m != 0 and confirm only the empty set and the whole group appear (a complete enumeration, not a sample). For horn (iii) and the identity, the empirical discriminators are A1 and C1. The single most informative experiment in the whole set is B1''s COMPOSITE-ORDER positive control, which must break the barrier exactly where the proof says it should — if it does not, the instrument, not the theorem, is wrong.'
  falsification: D1 falls if (a) an exponent-trackable step map is exhibited that is NOT a bijection of <P>, breaking horn (i); or (b) a proper nonempty subset of a prime-order group invariant under a nonzero translation is exhibited — elementary and included as a soundness check, not a live risk; or (c) a recognizable S is exhibited whose membership test costs o(1) amortized per candidate point AND which can be sampled WITHOUT rejection, breaking the identity's n/|S| factor. Route (c) is the ONLY live falsification route and is where any future attack on this barrier must aim; naming it precisely is part of the deliverable.
  cost_accounting: 'CHARGES: relation collection; VERIFICATION (the membership test is charged explicitly at 1 unit per trial — this is the family''s flagged hidden charge and it is the term that closes the identity); MEMORY (the identity''s rejection sampling is memoryless and horn (iii)''s cycle detection is Theta(1), so no memory advantage is available to hide in); and MULTI-TARGET (the identity is carried through to sqrt(T*n)). OMITS: preprocessing (D1 makes no advice claim and does not interact with BAR-AMORT-D2), linear algebra (rho has none), target descent (standard, one modular inverse). MODEL ASSUMPTIONS STATED EXPLICITLY: one EC addition = 1 unit; one membership test = 1 unit; uniform sampling of <P> with known exponents = 1 unit. ROBUSTNESS: if the membership test were FREE the identity is unchanged at n/sqrt|S|, because the rejection COUNT, not the test cost, drives it — so the barrier does not depend on the test being expensive.'
  dominant_exponent: n^{1/2}; the barrier's content is that this exponent is RIGID under every localization-based reorganization of the walk, independently of the spectral gap and independently of how many x-coordinate bits the partition consumes.
  verdict: UNREFUTED
  killer_objection: 'NOT adversarially refuted. Refutation was capped at the first six candidates per family, so this candidate was never independently attacked. Unrefuted is NOT endorsed: it is a proposal nobody has killed yet, not a result and not a survivor.'
  status: unrefuted-not-endorsed
- uid: EIGLOC:D2-FRUITCONF
  id: D2-FRUITCONF
  family: Eigenvector localization / random-matrix level statistics of the pseudorandom-walk transition operator
  family_key: EIGLOC
  area: statistical-physics
  group: D barrier
  title: 'FRUITLESS-CONFINEMENT COUPLING: in a prime-order group, confining the point-orbit forces exponent degeneracy'
  mechanism: 'D1 horn (ii) shows no proper structurally-invariant subset exists. D2 asks the sharper mechanistic question: what actually HAPPENS when a designer forces confinement anyway? CLAIM: for exponent-trackable walks on a PRIME-order group, any mechanism that confines the point-orbit to a small set does so by imposing an algebraic relation among the step multipliers, and that same relation makes the exponent increments around the confining orbit dependent — so the collisions it produces are EXPONENT-DEGENERATE (a = a'', b = b'', yielding 0 = 0) rather than useful. Confinement buys FRUITLESS CYCLES, not cheap logs. PROOF for the subgroup-shaped case (rigorous): if the orbit is confined to a coset of a subgroup H then every applied increment lies in H; prime order forces H = {O} or <P>; H = {O} means all applied increments are O, so the walk is frozen and every collision has zero exponent difference — maximal degeneracy. GENERAL CASE (stated as CONJECTURE, not proved): any confining relation sum_j c_j M_j = O among the multipliers used around the orbit pushes the exponent increment sum_j c_j (m_j, n_j) into the kernel of (m,n) -> mP + nQ, which is exactly the rank-1 sublattice encoding the unknown log — so the increment degenerates precisely when the confinement is exact. This is the mechanism behind NR-023''s recorded 33-213x slowdown for MAP_D: the structure that confined the walk also made its short cycles fruitless. It also explains why the negation map — the one genuinely useful equivalence-class compression — REQUIRES an explicit fruitless-cycle fix, and why its payoff is a constant sqrt(2) rather than an exponent.'
  fingerprint: 'algebraic object: the exponent cocycle of a confined orbit — the map from cycles of the walk to Z^2, composed with the evaluation (m,n) -> mP + nQ | public ops: EC addition, step-set construction, exponent bookkeeping | hidden structure: the coupling between point-orbit confinement and the kernel of the exponent evaluation map | info discarded: point identities; only cycle exponent increments matter | info retained: per-cycle exponent increment and whether it vanishes | relation primitive: cycle-closure collision, USEFUL iff the increment is nonzero | compression primitive: equivalence-class compression (negation, automorphisms) — shown to be the only survivor, and only at constant-factor value | rank mechanism: the rank of the lattice generated by the cycle exponent increments; degeneracy is exactly a rank drop | descent mechanism: standard rho descent, INAPPLICABLE on degenerate cycles — this is where the barrier bites | dominant cost exponent: n^{1/2}; confinement raises the constant and never lowers the exponent'
  prediction: 'Across a tunable-confinement family of step sets, the fraction of exponent-degenerate cycle closures rises monotonically with confinement (falling PR), and ops-per-USEFUL-collision rises with it — quantitatively reproducing NR-023''s recorded 33-213x band as a function of confinement rather than of map name. No design achieves both low PR and a low degenerate fraction. This is a strictly stronger claim than exponent-neutrality: the family is predicted to be cost-NEGATIVE.'
  minimal_test: 'n in {2^20, 2^24, 2^28} prime-order ordinary curves; a step-multiplier family interpolating from generic random multipliers to multipliers satisfying a PLANTED relation sum_j c_j M_j = O with controllable support size (the confinement dial, ~8 settings); 30 distinct targets per setting. For each cycle closure record (i) whether the exponent increment vanishes, (ii) PR(pi_hat), (iii) ops-per-useful-collision. POSITIVE CONTROL: multipliers with a planted exact relation of small support, which must show a high degenerate fraction. NEGATIVE CONTROL: independent uniform random multipliers, which must show a degenerate fraction near zero. CRITICAL BRACKETING CONTROL: the standard negation map WITH and WITHOUT its fruitless-cycle fix, which must bracket the effect and reproduce the known sqrt(2) constant — anchoring the instrument to a quantity whose true value is independently known.'
  falsification: D2 falls if any step-set design SIMULTANEOUSLY achieves PR <= n^{0.9} and an exponent-degenerate cycle fraction <= 0.1, replicated across >= 3 sizes — that would be a genuine confining-and-useful walk and would reopen the family constructively. D2 is confirmed if the degenerate fraction and the confinement dial are monotonically coupled with no design escaping the trade. Because D2's general case is a CONJECTURE and not a theorem, a single clean counterexample suffices to kill it, and that asymmetry is deliberate.
  cost_accounting: 'CHARGES: relation collection, counting ALL steps including those consumed by fruitless cycles; and VERIFICATION (the exponent-distinctness check separating useful from degenerate collisions — normally free, charged here because it is the discriminating measurement). OMITS: preprocessing, linear algebra, target descent, memory, multi-target. HONEST SCOPE: the subgroup-shaped case is proved; the general case is a conjecture and the experiment is its test, not its proof. Toy-scale results at n <= 2^28 do not transfer to crypto scale and are scoped accordingly.'
  dominant_exponent: n^{1/2}; the claim is that the achievable CONSTANT degrades with confinement, making the family not merely exponent-neutral but actively cost-negative — which is why no amount of step-set engineering rescues it.
  verdict: UNREFUTED
  killer_objection: 'NOT adversarially refuted. Refutation was capped at the first six candidates per family, so this candidate was never independently attacked. Unrefuted is NOT endorsed: it is a proposal nobody has killed yet, not a result and not a survivor.'
  status: unrefuted-not-endorsed
