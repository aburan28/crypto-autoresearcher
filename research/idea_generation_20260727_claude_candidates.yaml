  cost_accounting: 'CHARGES: relation collection only — specifically the per-trial membership decision cost, taken to be the size of the extracted interpolant circuit (its evaluation cost per target). OMITS: preprocessing, linear algebra, target descent, verification, memory, multi-target accounting; no figure claimed for any of them, all inherited from standard index-calculus accounting. Additional honest charge that this candidate must not hide: the interpolant EXTRACTION itself is a one-time cost that must be charged like any preprocessing under BAR-AMORT-D2 if it is ever amortized across targets; the version specified here charges only the per-target evaluation and therefore claims nothing about the extraction cost.'
