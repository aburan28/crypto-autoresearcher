  title: D3 · PRIME-ORDER ULTRAMETRIC COLLAPSE — the branching/GREM hypothesis has no carrier on the index line
  mechanism: 'Prove the family''s central hypothesis is not merely false but uninstantiable. A branching or hierarchical field requires an ultrametric — a tree — on the index set along which the field''s conditional law refines. Enumerate every candidate tree on Z/n and kill each. (a) The GROUP-COMPATIBLE tree is the subgroup lattice of Z/n, which for n prime is {0} inside Z/n: one level, so no hierarchy exists at all. (b) The 2-adic/dyadic tree on integer representatives, blocks {j = r mod 2^k}, has image {R_0 + rP + t*(2^k P)}; but 2^k is invertible mod n for n prime, so the subgroup generated by 2^k*P is the WHOLE group, and the supposedly coarse block is a full-size uniformly spread subset — a coarse-graining that coarsens nothing. (c) The ARCHIMEDEAN interval tree, blocks {j in [r*2^k, (r+1)*2^k)}, has image a consecutive run R_0 + r*2^k*P + i*P — the only candidate with content, and exploiting consecutive runs is precisely baby-step/giant-step and kangaroo, i.e. the rho-class baseline itself. Trichotomy: trivial, non-coarsening, or the baseline.'
