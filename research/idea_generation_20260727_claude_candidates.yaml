- uid: PATHDYN:BAR-PATHDYN-CHARP-D1
  id: BAR-PATHDYN-CHARP-D1
  family: Dynamical analysis of algorithms - Baladi-Vallee transfer operator on the Euclidean/PRS execution-path space
  family_key: PATHDYN
  area: dynamical-and-spectral
  group: D barrier
  title: 'BAR-PATHDYN-CHARP: characteristic-p Gauss-Kuzmin Bernoulli degeneracy — the Baladi-Vallee apparatus is vacuous in char p'
  mechanism: 'CLAIM. For the function-field continued-fraction (Artin/Gauss) map on F_p((1/X)), Haar measure is exactly invariant and the partial quotients are i.i.d. with the exactly geometric degree law P(deg a = d) = (1 - 1/p) * p^{-(d-1)}, mean p/(p-1). Consequently the associated Ruelle transfer operator is RANK ONE on the degree-alphabet observable space: its non-essential spectrum is a single point, there are no correlations to decay, and the entire Baladi-Vallee apparatus — Lasota-Yorke inequalities, quasi-compactness, the essential spectral radius, the UNI/Diophantine condition, Dolgopyat cancellation estimates — is VACUOUS in characteristic p. Every one of those tools exists to handle the nontrivial correlations of the REAL Gauss map; in char p the theory returns a closed-form geometric law and exactly nothing more. COROLLARY (the transferable part): dynamical analysis of algorithms is a CONSTANT-AND-LIMIT-LAW theory, not an exponent theory — its outputs are lambda''(1)-type means, lambda''''-type variances, and Gaussian/stable limit laws for costs whose ORDER of growth is already fixed by input size and the algorithm''s combinatorial structure. Moving an exponent lies outside the theory''s output type. This is the char-p analogue of D1 DATA-MOVEMENT EXPONENT-NEUTRALITY.'
  fingerprint: 'algebraic object: Ruelle operator of the Artin Gauss map on F_p((1/X)); public ops: inverse branches indexed by F_p[X] partial quotients; hidden structure: NONE — that absence IS the claim; info discarded: n/a; info retained: the geometric digit law and nothing else; relation primitive: NONE; compression primitive: NONE; rank mechanism: operator rank = 1, essential spectrum trivial; descent mechanism: NONE; dominant cost exponent: UNMOVED at 1/2.'
  prediction: 'Across p in {101,...,10007}, the degree-drop sequence of BOTH a plain F_p[X] Euclidean PRS AND the Semaev backward-3-sum PRS is statistically indistinguishable from i.i.d. geometric: lag-1..5 autocorrelations inside the i.i.d. band; transition-matrix sigma_2/sigma_1 at the ~1/sqrt(N) sampling floor; prefix-to-final-degree mutual information below 0.05 bits and shrinking with p. Predicted consequence for the program: every constructive candidate in this family (A2, B2, C1) is exponent-neutral, and A1 is the family''s only sound deliverable.'
  minimal_test: 'IDENTICAL instrumentation to A1/B1/C1 — one data collection serves all. p in {101,211,431,809,1601,3001,10007}; N = 10^4 paths per prime; seeds 20260727..20260731. THREE statistics: (i) chi-square of the degree-drop marginal against the geometric law; (ii) sigma_2/sigma_1 of the 8x8 empirical transition matrix against an i.i.d.-resampled null with 400 resamples (PO96L control-envelope convention); (iii) Miller-Madow-corrected mutual information of the 3-step prefix against the final eliminant degree. POSITIVE CONTROL: a planted Markov path with sigma_2/sigma_1 = 0.4 and MI = 0.3 bits — ALL THREE statistics must fire, else the instrument cannot support a negative result. NEGATIVE CONTROL: i.i.d. resampling.'
  falsification: 'Any of (i)/(ii)/(iii) departs from the i.i.d. null with a p-STABLE, non-decaying effect size on >= 5 of 7 primes IN THE SEMAEV-STRUCTURED ARM and outside the 400-resample control envelope. EXPLICIT DISCIPLINE: a departure in the PLAIN EUCLIDEAN arm indicates an implementation bug, since the i.i.d. property there is a standard theorem; it must be treated as a bug and fixed before it is treated as mathematical evidence. Timeouts, crashes, or infra failures are never negative evidence here.'
  cost_accounting: A barrier charges NO stages and exhibits NO algorithm — all seven OMITTED (preprocessing, relation collection, linear algebra, target descent, verification, memory, multi-target accounting), deliberately. Its function is to DENY the family's exploitable-structure premise. By construction it can never exhibit a rho-crossing engine, and must never be quoted as though it bounded any stage's cost.
  dominant_exponent: 1/2, unmoved. The barrier asserts exponent-neutrality of the entire method, not a new cost.
  verdict: UNREFUTED
  killer_objection: 'NOT adversarially refuted. Refutation was capped at the first six candidates per family, so this candidate was never independently attacked. Unrefuted is NOT endorsed: it is a proposal nobody has killed yet, not a result and not a survivor.'
  status: unrefuted-not-endorsed
- uid: PATHDYN:BAR-PATHDYN-CONDTAIL-D2
  id: BAR-PATHDYN-CONDTAIL-D2
  family: Dynamical analysis of algorithms - Baladi-Vallee transfer operator on the Euclidean/PRS execution-path space
  family_key: PATHDYN
  area: dynamical-and-spectral
  group: D barrier
  title: 'BAR-PATHDYN-CONDTAIL: constant-probability conditioning cannot move a large-deviation tail — closes the RT-1476 successful-subset loophole'
  mechanism: 'The highest-value output of this run. Report85''s A1 (RT-1476-SUBRES-A1) — the program''s #1 conservative winner for 29+ consecutive runs — is kept alive by exactly ONE argument, quoted from its ''Why not already killed'' line: it measures the SUCCESSFUL-membership subset rather than the generic worst-case eliminant that the first-fall barrier bounds. BAR-PATHDYN-CONDTAIL says that argument is worth at most a constant factor. TWO PREMISES, both checkable. (P1) At the balanced m=5 sizing L = q^{1/5} already used by the program, the probability that a random 5-tuple decomposes tends to 1/5! = 1/120 — a CONSTANT. The corpus already records this probability but never draws the consequence. (P2) Under BAR-PATHDYN-CHARP, the unconditional event {beta < 3/10} is a large deviation of the degree-drop path: it needs the cumulative drop to exceed its mean by Theta(L), so it has probability exp(-Theta(L)) = q^{-Theta(1)}. CONCLUSION, by the elementary Bayes bound P(A|S) <= P(A)/P(S): P(beta < 3/10 | success) <= 120 * q^{-Theta(1)}. Conditioning on membership success multiplies the tail by at most 120 and cannot turn an exponentially rare event into a typical one. Hence the beta < 3/10 gate is closed on the SUCCESSFUL SUBSET too — unless P(success) itself decays like a power of q, in which case the index calculus loses on relation YIELD instead. A strict either/or, and the first argument in the 95-file corpus that attacks the conditioning loophole rather than the aggregate.'
  fingerprint: 'algebraic object: the conditional law of the eliminant-degree exponent beta on the membership-success event; public ops: Bayes bound plus the large-deviation rate function; hidden structure: the CONSTANCY of P(success) at balanced m=5 sizing — the load-bearing and previously undrawn fact; info discarded: everything about the eliminant except its degree; info retained: P(success) and the beta tail; relation primitive: NONE; compression primitive: NONE; rank mechanism: NONE; descent mechanism: NONE; dominant cost exponent: pins alpha >= 3/2, hence m=5 IC >= q^{1/2}, hence no rho crossing on this route.'
  prediction: 'Measured P_hat(success) is p-stable near 1/120 with no power-law decay: |d log P_hat(success) / d log p| < 0.02 across the size sweep. AND the ratio P_hat(beta < t | success) / P_hat(beta < t) stays below 1/P_hat(success) ~ 120 at every threshold t — i.e. the successful-subset beta histogram is a BOUNDED REWEIGHTING of the unconditional one, contributing no new low-beta mass. Program consequence: RT-1476-SUBRES-A1''s promotion gate (measured beta < 0.30 with a monotone size-trend crossing alpha = 3/2) is unreachable, and the standing conservative winner should be re-classified from OPEN GATE to CLOSED-pending-verification.'
  minimal_test: 'The SAME collection as A1/B1/C1/D1, with ONE extra label per sample. p in {101,211,431,809,1601,3001,10007}; L = ceil(p^{1/5}); N = 10^4 random 5-tuples per prime; seeds 20260727..20260731. Per sample record: (a) the full degree-drop path; (b) the final eliminant degree, giving beta_hat = log(deg)/log(L) with the normalization stated explicitly in the frozen contract; (c) the boolean membership-success label, where success means the eliminant has an F_p root yielding a valid decomposition certificate that the run wrapper INDEPENDENTLY re-verifies per docs/claims-and-verification.md. Then overlay the two beta_hat histograms and fit d log P_hat(success)/d log p. POSITIVE CONTROL: a planted population in which 5% of successes carry beta_hat = 0.2 — this tests the INSTRUMENT''s ability to see low-beta mass, not the theorem (the theorem''s bound cannot be violated by Bayes while P(success) stays constant). NEGATIVE CONTROL: shuffled success labels, which must destroy any apparent conditioning effect.'
  falsification: EITHER P_hat(success) decays as a power of p with exponent > 0.02 — this breaks premise P1, but then relation yield collapses and RT-1476 fails on a different axis, which the contract must record as such rather than as a win; OR the unconditional {beta_hat < 0.30} event is observed at a p-stable, non-vanishing rate — this breaks premise P2 and simultaneously falsifies BAR-PATHDYN-CHARP's geometric law. Either falsification reopens the gate honestly.
  cost_accounting: 'A barrier: NO stages charged, all seven OMITTED. What it BOUNDS is stage (2) relation collection only, by pinning alpha >= 3/2 and hence the m=5 index-calculus total at >= q^{1/2}. It says NOTHING about (1) preprocessing, (3) linear algebra, (4) target descent, (5) verification, (6) memory, or (7) multi-target accounting, and must not be quoted as if it did. It is also scoped to the m=5 backward-3-sum serial-S3 route at L = q^{1/5}; other arities or sizings need their own P(success) measurement.'
  dominant_exponent: alpha >= 3/2 pinned, so m=5 IC total >= q^{1/2}; rho baseline 0.886*sqrt(n) undisplaced. The barrier moves no exponent — it forbids one from moving.
  verdict: UNREFUTED
  killer_objection: 'NOT adversarially refuted. Refutation was capped at the first six candidates per family, so this candidate was never independently attacked. Unrefuted is NOT endorsed: it is a proposal nobody has killed yet, not a result and not a survivor.'
  status: unrefuted-not-endorsed
- uid: OPENDYN:OPENDYN-A1
  id: OPENDYN-A1
  family: Open / absorbing (killed) dynamics - Dirichlet spectrum and conditionally-invariant measure of the punctured relation walk
  family_key: OPENDYN
  area: dynamical-and-spectral
  group: A conservative
  title: EXTREMAL-INDEX AUDIT OF FRUITLESS CYCLES — periodic-orbit resonance as the design objective for the DP predicate in negation-map rho
  mechanism: Treat the negation-map (equivalence-class) r-adding rho walk as an open system whose hole H is the distinguished-point predicate; identify fruitless cycles (X -> -X -> X and longer short orbits) as exactly the periodic-orbit resonances that drive the extremal index theta below 1 in the escape-rate expansion; then choose the partition/DP predicate to MAXIMISE theta rather than to maximise uniformity, recovering part of the sqrt(2) that current fruitless-cycle mitigation forfeits.
  fingerprint: 'algebraic object: sub-stochastic (killed) transfer operator of the r-adding rho walk on E(F_p)/{+-1} punctured by the DP hole H | public ops: EC addition, negation, partition-index evaluation, equality test | hidden structure: short periodic orbits of the iteration map lying in or feeding H, which cluster hole visits | info discarded: trail interiors (all points strictly between DP arrivals) | info retained: the extremal index theta = 1/(mean exceedance cluster size) and the DP arrival times | relation primitive: a DP coincidence between two trails carrying distinct (a,b) labels | compression primitive: distinguished points (an endpoint stands for a whole trail) | rank mechanism: n/a (collision type, no linear algebra) | descent mechanism: solve one linear congruence (a1-a2) + k(b1-b2) = 0 mod n | dominant cost exponent: 1/2 unchanged; only the constant 0.886/theta moves'
  prediction: For the standard r-adding negation-map walk with r in {16,20,32}, the measured extremal index of the DP hole is strictly < 1, with 1-theta decreasing roughly like c/r (dominated by the 2-cycle X -> -X); a DP predicate that excludes the fixed loci of the short cycles raises theta measurably and lowers steps-per-useful-DP by the factor theta_new/theta_old. That factor is capped above by sqrt(2) (the negation map's ideal gain), so no exponent moves.
  minimal_test: 'p in {10007, 100003, 1000003}; at each p take the first ordinary non-CM curve y^2 = x^3 + ax + 1 (smallest a, j != 0,1728) whose order n is prime, recorded in the contract rather than assumed; r in {16,20,32}; DP predicate = t trailing zero bits of x with mu(H) in {2^-6, 2^-8}; seeds 20260727..20260731; 10^7 walk steps per run. Measure (i) mean steps per DP arrival, (ii) the empirical DP-arrival cluster-size distribution, (iii) theta by BOTH the blocks and the runs estimator with 95% CIs. Positive control: an i.i.d.-uniform surrogate walk on Z/nZ, which must return theta = 1 within CI. Negative control: a walk seeded with a planted 2-cycle intersecting H, which must return theta significantly < 1.'
  falsification: 'Dies if theta = 1 within a 95% CI for the standard negation-map walk at all three sizes (mechanism empty: fruitless cycles are not periodic-orbit resonances of the hole). Also dies as a design lever if theta < 1 is confirmed but the theta-maximising predicate yields no measurable reduction in steps-per-useful-DP sustained across >= 3 sizes. Cannot be promoted at all above a constant factor: any claimed gain > sqrt(2) over standard negation-map rho is by itself evidence of a measurement error.'
  cost_accounting: 'CHARGES: relation collection (walk steps per usable collision) and memory (DP table size, unchanged from VW baseline). OMITS: preprocessing (walk setup is O(r) point additions), linear algebra (none — collision type), target descent (one congruence, O(log n)), verification (one scalar multiplication per claimed collision, re-verified independently by the run wrapper), multi-target accounting (single target only).'
  dominant_exponent: 1/2 — unchanged. Constant only, hard-capped by sqrt(2).
  verdict: REJECTED-exponent-neutral
  killer_objection: It chases the same sqrt(2) negation-involution constant on the same object as idea_generation_20260723.md B1, already rejected there as 'constant-only (the negation sqrt(2)), no exponent', and is hard-capped by sqrt(2) inside 0.886*sqrt(n). The impossibility content is textbook open dynamics (Keller) plus the already-recorded report85 D1 and the mixing-vs-birthday orthogonality note.
