  group: B representation-change
  title: Maltsev embedding of the decomposition template and its BLP+AIP relaxation
  mechanism: 'Genuine representation change: abandon the domain F entirely and re-encode each factor-base point by its indicator in Z^B. The decomposition constraint becomes the affine lattice condition {v in Z^B, v >= 0 : sum_P v_P . P = Q and sum_P v_P = m}. The relation ''sum v_P P = Q over Z'' is a coset of the kernel lattice L = ker(Z^B -> G), hence carries the Maltsev term x - y + z; the template therefore has a Maltsev EMBEDDING in the Brakensiek-Guruswami sense, and the theory says the right algorithm is the affine integer program (AIP), optionally combined with the basic LP (BLP+AIP). Test whether that relaxation decides anything.'
  fingerprint: 'algebraic object: the relation lattice L = ker(Z^B -> G) and the affine coset {v : sum v_P P = Q, sum v_P = m}; public ops: integer linear algebra (Hermite/Smith normal form), LP solve, EC additions; hidden structure (hoped): that the Maltsev structure of the lattice coset transfers tractability back to the 0/1-constrained original template; info discarded: the nonnegativity / multiset constraint v >= 0 - which is exactly the relaxation, and exactly where the hardness lives; info retained: the additive congruence sum v_P P = Q and the weight constraint sum v_P = m; relation primitive: an integer vector v with sum v_P P = Q; compression primitive: HNF/lattice basis - B generators standing for an infinite coset; rank mechanism: L IS the relation lattice that index calculus exists to compute, so the mechanism is self-referential; descent mechanism: solve AIP at the target-coupled point; dominant cost exponent: none - the relaxation is information-free, see prediction.'
  prediction: 'Two-horned kill, both horns provable. HORN (i), decision-vacuity: for any B >= 2 with two distinct factor-base points P_1 != P_2 in a prime-order group, set a = log_{P_1 - P_2}(Q - m P_2), which exists mod n because P_1 - P_2 generates G; then v = (a, m - a, 0, ..., 0) satisfies both sum v_P P = Q and sum v_P = m over Z. So AIP is feasible on EVERY instance, answers YES always, and prunes nothing. HORN (ii), search-DLP-completeness: producing that v requires exactly the discrete logarithm of Q - m P_2 to base P_1 - P_2. So the relaxation is either vacuous (as a decision procedure) or circular (as a search procedure). BLP+AIP therefore cannot decide the promise, and the Maltsev embedding is information-free. Prediction in numbers: AIP feasibility rate = 100.0% on all toy instances, while the true weight-m nonnegative feasibility rate is ~ B^m/(m! n).'
  minimal_test: 'p = 1009 and p = 2003, ordinary curves of prime order n, O excluded from F, B in {8, 16}, m in {3, 4}. (a) For all n targets Q, decide AIP feasibility by the explicit two-coordinate construction above; predict rate 1.000 exactly. (b) For the same targets, brute-force the true nonnegative weight-m feasibility rate by enumerating all B^(m-1) tuples; predict rate ~ B^m/(m! n), i.e. ~0.68 at B = 16, m = 3, n = 1009 and ~0.085 at B = 8, m = 3, n = 1009. The gap between (a) = 1.000 and (b) is the exact numerical measure of the relaxation''s vacuity. (c) Attempt to compute the Hermite normal form of the generator map [P_1 ... P_B] : Z^B -> G using only group operations and no DL oracle; predict this is impossible and that any implementation silently calls a DL routine.'
  falsification: 'Falsified if AIP feasibility is < 100% on any toy instance with B >= 2 and two distinct factor-base points - the decision-vacuity horn would then be wrong. Falsified in the LIVE direction if the HNF or Smith normal form of the factor-base generator map can be computed with o(sqrt(n)) group operations without discrete-logarithm knowledge: horn (ii) would fail, AIP would become a genuine oracle, and B1 would immediately become a constructive candidate worth full contract treatment. Also falsified if a BLP+AIP combination (not AIP alone) is shown to prune a nonzero fraction of instances - the BLP wing is not covered by the two horns above and is the one untested sub-branch.'
  cost_accounting: 'CHARGES: relation collection ONLY - the AIP solve is proposed as a drop-in replacement for the per-trial decomposition solve. NO COST FIGURE IS CLAIMED for that stage, because the stage is vacuous rather than cheap: an oracle that always answers YES has no meaningful cost model, and one that answers correctly is a DL oracle. OMITS: preprocessing, linear algebra, target descent, verification, memory, multi-target accounting - all six, deliberately, and no figure is asserted for any of them. Per the family''s honesty rule, missing data stays missing: no complete-cost comparison to rho is offered, and none can be until a non-vacuous relaxation exists.'
  dominant_exponent: None claimed. The decision relaxation has exponent 0 and information content 0; the search version has the exponent of the DLP itself (1/2 by rho), i.e. circular. Neither is below 1/2.
  verdict: REJECTED-duplicate
  killer_objection: 'ker(Z^B -> G) is OLAT-C3''s lattice (idea_generation_20260718_batch3.md), already screened and killed with the same circularity: ''the DLP is precisely the statement that this map has no efficiently-detectable structure''. The relaxation is separately vacuous - a two-point witness satisfies the affine conditions for any target - and the resulting ''barrier'' is three already-banked barriers (vacuous relaxation, lattice circularity, embed-into-an-easier-group fallacy) under Brakensiek-Guruswami vocabulary.'
- uid: POLYCLONE:COSETLIFT-B2
  id: COSETLIFT-B2
  family: 'Algebraic CSP dichotomy: polymorphism / Maltsev / few-subpowers tractability of the factor-base decomposition constraint'
  family_key: POLYCLONE
  area: logic-and-proof-complexity
  group: B representation-change
  title: Engineered coset factor base in a composite-order auxiliary group, pushed down by transfer
  mechanism: 'Maltsev-closure of F requires F = c + H for a subgroup H, and E(F_p) of prime order has no proper nontrivial subgroup. So change the group: lift to G'' that DOES have a subgroup lattice - E(F_{p^k}) whose order is divisible by n and by other factors, or the Weil-restriction abelian variety A = Res_{F_{p^k}/F_p} E - choose F to be a genuine coset c + H there, run the Maltsev/compact-representation decomposition inside G'' where the tractability theory now legitimately applies, and push relations down to E(F_p) through the trace or norm map tau : G'' -> G.'
  fingerprint: 'algebraic object: an auxiliary abelian group G'' with a nontrivial subgroup lattice, a transfer homomorphism tau : G'' -> G = E(F_p), and F = c + H with H <= G''; public ops: arithmetic in G'', evaluation of tau, componentwise x - y + z on H-cosets, hash membership; hidden structure: the subgroup lattice of G'' supplying the coset structure that a prime-order group cannot supply; info discarded: the requirement that the factor base live inside E(F_p) itself; info retained: the transfer homomorphism tau and the coset representation of F; relation primitive: an H-coset decomposition computed in G'' and pushed through tau; compression primitive: coset representation - |F| = |H| described by O(log|H|) generators, the strongest compression in the whole family; rank mechanism: the image under tau of the G''-relation lattice, measured as rank over Z/n; descent mechanism: decompose a tau-preimage of the target-coupled point inside G''; dominant cost exponent: no gain, >= 1/2 - see prediction.'
  prediction: 'Dead by two independent walls, one already catalogued and one new. WALL (i), PO-005 trace-fiber lemma, recorded in idea_generation_20260718_batch3.md section 0: ''for a group hom tau : H -> G, full kernel fibers multiply successes and trials equally, so no relation-probability or rank gain''. Relations harvested in G'' are equidistributed over tau-fibres, so yield per unit work in G is unchanged. WALL (ii), the TRACTABLE-IFF-TRIVIAL corollary of D1, now applied inside G'': if F = c + H then every m-fold F-sum lies in mc + H, so the tau-images of decomposable targets fill only the coset tau(mc + H); the fraction of targets Q in G that are decomposable at all is |tau(H)|/n. Making that fraction non-negligible forces |tau(H)| ~ n, hence |F| = |H| >= n, hence zero compression. Complete cost >= max(n/|tau(H)|, |F|) >= sqrt(n), attained only at |F| = sqrt(n) with sqrt(n) memory - that is baby-step-giant-step, strictly worse than rho''s 0.886 sqrt(n) at O(1) memory. Concrete prediction: when tau(H) is trivial, the relation matrix over Z/n has rank 0.'
  minimal_test: 'p in {1009, 2003}; k = 2; E/F_{p^2} chosen so that #E(F_{p^2}) = n . c with the cofactor c having a prime factor l in [5, 50] (search over ~50 curves per p, seed-fixed); H = the unique subgroup of order l; F = c_0 + H for a random c_0 in E(F_{p^2}); m = 3; tau = the trace map to E(F_p). Measure (a) the fraction of targets Q in E(F_p) that are tau-images of m-fold F-sums - predict exactly |tau(H)|/n, which is 1/n whenever tau(H) is trivial; (b) the rank over Z/n of the resulting relation matrix - predict rank 0 when tau(H) is trivial, and rank <= log_l(|tau(H)|) otherwise, in both cases far below B. Arm (b) is the cheap decisive discriminator and needs only ~10^3 group operations per cell. Cross-check against the PO-005 prediction by also measuring successes-per-trial in G'' versus in G directly; predict equal ratios.'
  falsification: Falsified - and this would be a genuine result contradicting the catalogued PO-005 lemma - by exhibiting an auxiliary group G' and a subgroup H <= G' with |H| much less than n, tau(H) generating G, and a rank-full relation matrix over Z/n. Also falsified if the measured successes-per-trial ratio in G' exceeds the ratio in G by more than sampling error, which would mean PO-005's fibre-multiplication argument does not apply to this construction. Also falsified if some G' admits a factor base that is Maltsev-closed WITHOUT being a subgroup coset, contradicting the elementary classification used in D1's corollary.
  cost_accounting: 'CHARGES: (2) relation collection, as >= n/|tau(H)| target randomizations, and (6) memory, as >= |F| = |H| words; the bound max(n/|tau(H)|, |F|) >= sqrt(n) follows from these two alone. OMITS: (1) preprocessing (the search for a suitable G'' and subgroup H, a real and possibly large cost), (3) linear algebra, (4) target descent, (5) verification, (7) multi-target accounting. The omission is conservative and harmless in the barrier''s direction: all five omitted stages can only ADD cost, so a lower bound derived from two stages remains a valid lower bound. No upper-bound or crossing figure is claimed.'
  dominant_exponent: 1/2 at best, and only at the degenerate point |F| = sqrt(n) where the method is BSGS with sqrt(n) memory - strictly worse than rho's 0.886 sqrt(n) at O(1) memory once the memory stage is charged. Away from that point the exponent is worse than 1/2 in one of the two charged stages.
  verdict: REJECTED-duplicate
  killer_objection: 'A re-derivation of the standing named barrier PO-005 / B-trace-fiber, reproduced verbatim in the standing-barrier preamble of multiple reports: ''for a group hom tau : H -> G, full kernel fibers multiply successes and trials equally -> no relation-probability or rank gain'' - with the variable names tau, H, G already matching. On the charged accounting it does not reach exponent 1/2, it reaches 1; the only new residue (the |tau(H)| in {1,n} dichotomy collapsing the tradeoff curve to two points) is a footnote to PO-005.'
- uid: POLYCLONE:CLOSURE-BLOWUP-C1
  id: CLOSURE-BLOWUP-C1
  family: 'Algebraic CSP dichotomy: polymorphism / Maltsev / few-subpowers tractability of the factor-base decomposition constraint'
  family_key: POLYCLONE
  area: logic-and-proof-complexity
  group: C high-risk
  title: Promise-CSP relaxed-target polymorphism, metered by the Maltsev closure iterate
  mechanism: 'Speculative escape from D1: drop the requirement that the polymorphism land back inside F. In the promise-CSP formulation PCSP(Gamma_F, Gamma_{F''}) a polymorphism is a map F^k -> F'' with F'' a relaxed factor base containing F, and Brakensiek-Guruswami''s BLP+AIP is the canonical algorithm. The minimal relaxed base for the Maltsev term is F_1 = F - F + F; for the algorithm one needs a closed base, so iterate F_{i+1} = F_i - F_i + F_i. The candidate asks whether the ascending chain can stabilise at a set small enough to still compress - i.e. whether one can BUY a polymorphism by PAYING factor-base size, and at what rate.'
  fingerprint: 'algebraic object: the ascending Maltsev-closure chain F contained in F_1 contained in F_2 ... inside G = Z/n, and the PCSP pair (Gamma_F, Gamma_{F''}); public ops: EC additions, set union and dedup, PCSP polymorphism search, BLP+AIP; hidden structure (hoped): a SLOW closure - a factor base whose Maltsev closure is a proper subset of G of size only B^{O(1)}, which would give a genuine tractability/compression trade rather than an all-or-nothing dichotomy; info discarded: exactness - the promise gap between what F guarantees and what F'' must certify; info retained: the affine relation and the closure chain itself; relation primitive: an m-tuple over F'' certified against the F-promise; compression primitive: the PCSP relaxation - pay |F''| in memory and linear algebra to buy a polymorphism; rank mechanism: relation matrix of size |F''| x |F''| over Z/n; descent mechanism: decomposition of the target over F''; dominant cost exponent: |F''| = |F_infinity| = n, so exponent 1 in both memory and linear algebra - strictly worse than rho''s 1/2.'
  prediction: 'The closure is TOTAL and FAST, so no trade exists. Claim: for any F contained in Z/n with |F| >= 2 and n prime, F_infinity = G, reached in O(log n / log 3) iterations, with |F_i| growing at least 3^i-fold until saturation. Proof sketch: pick a != b in F and consider the reachable affine coefficients T = {t : a + t(b - a) in F_infinity}. T contains 0 and 1 and is closed under t_1 - t_2 + t_3, hence T is a coset of a subgroup of Z/n containing 0 and 1, hence T = Z/n since n is prime. Therefore F_infinity contains a + Z/n.(b - a) = G. The same holds for the k-ary averaging term, where the reachable coefficients are {j/k^i : 0 <= j <= k^i}, which exhaust Z/n as soon as k^i >= n, i.e. after ceil(log_k n) steps. Consequence: no PCSP relaxation of this template that admits a Maltsev or WNU polymorphism can have |F''| < n, so C1 strengthens D1 from the exact setting to the promise setting.'
  minimal_test: 'n in {1009, 2003, 4001, 8009}, prime-order toy curves, F = the B points of smallest x-coordinate with O excluded, B in {4, 8, 16, 32}. Compute |F_i| for i = 0..8 under BOTH the Maltsev iterate F_{i+1} = F_i - F_i + F_i and the 3-ary averaging iterate F_{i+1} = (F_i + F_i + F_i)/3, recording the saturation index i*. Prediction: |F_i| ~ min(n, B^(3^i)) modulo overlap, and i* <= ceil(log_3 n), i.e. i* <= 7 at n = 2003, B = 4. Second arm, the informative one: for each i compute the ratio |F_i|/|F_{i-1}| and check it exceeds the PFR-style doubling constant - predict growth closer to cubing than doubling, which is what distinguishes a closure-iterate statement from a doubling-constant statement. Third arm: repeat with F an arithmetic progression of length B (the most nearly coset-like set available), predicting saturation is only ~1 iteration slower.'
  falsification: Falsified by ANY prime-order toy curve and factor base with 2 <= B < n whose Maltsev closure (or k-averaging closure) is a proper subset of G - that would contradict the coefficient-set argument and immediately reopen the constructive branch. Falsified in the most valuable direction by exhibiting a PCSP polymorphism F^k -> F' that is NOT the restriction of a Z/n-linear map, since that breaks D1 Lemma 1 in the promise setting and the entire barrier would need restating. Falsified quantitatively if the measured saturation index i* exceeds ceil(log_3 n) by more than 1 for any tested cell, indicating the closure is slower than the argument allows.
  cost_accounting: 'CHARGES: (6) memory and (3) linear algebra, both scaling as |F''| = |F_infinity| = n, i.e. exponent 1 versus rho''s 1/2 - the relaxation destroys compression outright; and (2) relation collection, which becomes trivial once F'' = G but then yields relations carrying no information, since a factor base equal to the whole group produces a relation matrix whose rows are tautologies. OMITS: (1) preprocessing, (4) target descent, (5) verification, (7) multi-target accounting - no figure claimed for any. The omission is harmless because the two charged stages already exceed rho by a full exponent.'
  dominant_exponent: 1 (memory and linear algebra both scale as |F'| = n). This is worse than rho's 1/2, not merely equal - the PCSP escape is strictly cost-increasing, not exponent-neutral.
  verdict: REJECTED-duplicate
  killer_objection: 'Duplicates HOLDICH-D3 (idea_generation_20260718_batch3.md lines 1305-1385), which applies the Cai-Lu / Cai-Chen dichotomy to the identical m-term factor-base decomposition constraint and tests the three tractable islands, the affine island being exactly the Maltsev/abelian-affine class - fingerprint match on every load-bearing field. The PCSP escape is additionally cost-INCREASING, not merely exponent-neutral: memory and linear algebra both scale as |F''| = n, i.e. exponent 1 against rho''s 1/2.'
- uid: POLYCLONE:BAR-POLYCLONE-D1
  id: BAR-POLYCLONE-D1
  family: 'Algebraic CSP dichotomy: polymorphism / Maltsev / few-subpowers tractability of the factor-base decomposition constraint'
  family_key: POLYCLONE
  area: logic-and-proof-complexity
  group: D barrier
  title: 'BAR-POLYCLONE-D1: Taylor vacuity of the prime-order decomposition template, and the TRACTABLE-IFF-TRIVIAL dichotomy'
  mechanism: 'The headline negative result: prove that the factor-base decomposition template over a prime-order elliptic curve group has NO Taylor polymorphism, which by Maroti-McKenzie (Taylor iff WNU on a finite idempotent algebra) and Bulatov/Zhuk (CSP(Gamma) tractable iff the core has a Taylor term) simultaneously excludes EVERY tractability class in the CSP dichotomy - Maltsev, few subpowers / cube-edge term, near-unanimity, bounded width - by a single algebraic fact, in three short lemmas. Then convert it to a cost statement valid over every finite abelian group.'
  fingerprint: 'algebraic object: the polymorphism clone Pol(Gamma_F) of Gamma_F = (G; S_m, F) under the Inv-Pol Galois connection, with G = E(F_p) cyclic of prime order n, S_m = {(x_1..x_m, y) : sum x_i = y}, O not in F, 2 <= |F| < n, n not dividing m-1; public ops: EC group law, equality, factor-base membership - nothing more, so the barrier is representation-free; hidden structure: NONE survives - the clone collapses to projections; info discarded: nothing, and that is the strength of the barrier - it never forms a Semaev polynomial, never fixes a coordinate system, never assumes a solver, so it cannot be evaded by a change of coordinates, a new elimination order or a solver swap; info retained: only the additive structure of a prime-order group and the factor-base indicator; relation primitive: n/a (barrier); compression primitive: n/a - the theorem is precisely that no compact representation exists; rank mechanism: n/a; descent mechanism: n/a; dominant cost exponent: no exponent below 1/2 is reachable on this axis, and the unique tractable corner is BSGS at exponent 1/2 with sqrt(n) memory, which is worse than rho once the memory stage is charged.'
  prediction: 'THEOREM (three lemmas). L1 LINEARITY: for m >= 3 (fixed-Q encoding) or m >= 2 with n not dividing m-1 (all-Q encoding S_m), every polymorphism f : G^k -> G of the summation relation is affine, f(x) = sum lambda_j x_j + c. Proof: the tuples (a, b, Q1 - a - b, 0..0) and (a, 0, Q1 - a, 0..0) both lie in the relation; subtracting the two induced identities for h(x) = f(x) - f(0) gives h(a) + h(b) = h(a+b); an additive map G^k -> G with G isomorphic to Z/n is sum lambda_j x_j. L2 IDEMPOTENT WNU = AVERAGING: idempotence forces c = 0 and sum lambda_j = 1; the WNU identities w(y,x..x) = ... = w(x..x,y) force all lambda_j equal, so lambda_j = k^{-1} and w is the k-fold average (and if n divides k no such linear map exists, so there is no WNU of that arity either). L3 AVERAGING CLOSURE IS TOTAL: if F contained in G with |F| >= 2 is closed under the k-fold average then F = G, because with a != b in F the reachable coefficients {t : a + t(b-a) in F} contain 0 and 1 and every j/k^i with 0 <= j <= k^i, which exhaust Z/n once k^i >= n. THEOREM: for 2 <= |F| < n, Gamma_F is a core (its only unary polymorphisms are lambda x with lambda F = F, all automorphisms; the constant map to O is excluded by O not in F) and has no WNU of any arity, hence no Taylor term, hence CSP(Gamma_F) is NP-complete and no Maltsev term, no cube/edge term, no near-unanimity term and no bounded width exist. COROLLARY, TRACTABLE-IFF-TRIVIAL, any finite abelian G: F is Maltsev-closed iff F = c + H for a subgroup H; then decomposable targets form the single coset mc + H of size |F|, so per-target success probability is |F|/|G|, relation collection needs >= |G|/|F| randomizations while storage needs >= |F|, and max(|G|/|F|, |F|) >= sqrt(|G|) with the optimum at |F| = sqrt(|G|) requiring sqrt(|G|) memory - i.e. baby-step-giant-step, strictly worse than rho''s 0.886 sqrt(|G|) at O(1) memory. Tractability and compression are mutually exclusive in EVERY finite abelian group; prime order is merely the degenerate extreme where the only Maltsev-closed factor bases are singletons and G itself.'
  minimal_test: 'The theorem is proved, so the test is a falsification hunt across four cheap arms. ARM 1 = candidate A1''s linear census: p in {1009, 2003, 4001, 8009}, B in {8, 16, 32, 64}, k <= 4; predict stabiliser size exactly 1. ARM 2 = exhaustive brute force on the one encoding where L1''s proof does not directly apply (domain = F, single fixed Q): all 3^9 = 19683 binary operations on |F| = 3 and all 2^8 = 256 ternary operations on |F| = 2; predict every non-projection polymorphism found is either the restriction of a linear map or fails the WNU identities. ARM 3 = candidate C1''s closure iterate: predict saturation index i* <= ceil(log_3 n). ARM 4, the encoding-degeneracy check: verify that the fixed-Q encoding retracts to a one-element core exactly when Q/m lies in F, confirming that the escaping encoding corresponds precisely to the trivially-already-solved instances. All arms must agree; disagreement between ARM 1 and ARM 2 localises the gap to the encoding.'
  falsification: 'Falsified by (i) any non-projection idempotent polymorphism on a toy instance with 2 <= |F| < n, in particular any WNU - the direct target of ARMs 1 and 2; (ii) a counterexample to L1 in the domain-F single-fixed-Q encoding, i.e. a polymorphism of R_Q intersect F^m that is not the restriction of a linear map on G AND satisfies the WNU identities; (iii) any F with |F| >= 2 whose k-averaging closure is a proper subset of G; (iv) a factor base that is Maltsev-closed without being a subgroup coset, which would break the corollary''s classification step. These are the ONLY escapes: the barrier depends on no conjecture, no solver, no coordinate system, and no complexity assumption beyond the published Bulatov/Zhuk dichotomy and Maroti-McKenzie.'
  cost_accounting: 'The corollary CHARGES exactly two stages and derives a lower bound from them alone: (2) relation collection, >= |G|/|F| target randomizations because only a |F|-sized coset of targets is decomposable at all; and (6) memory, >= |F| words to hold the factor base. Their maximum is >= sqrt(|G|), with equality only at |F| = sqrt(|G|). OMITS: (1) preprocessing, (3) linear algebra, (4) target descent, (5) verification, (7) multi-target accounting. The omission is CONSERVATIVE IN THE BARRIER''S FAVOUR and therefore sound: every omitted stage can only ADD cost, so a lower bound derived from two stages remains a valid lower bound on the complete cost. The comparison to rho explicitly charges memory, which is why the tractable corner (BSGS: sqrt(n) ops and sqrt(n) memory) is judged strictly WORSE than rho (0.886 sqrt(n) ops, O(1) memory) rather than merely equal.'
  dominant_exponent: '1/2 at the single degenerate optimum |F| = sqrt(|G|), and strictly worse than 1/2 in one of the two charged stages everywhere else. No point of the tractable island reaches an exponent below 1/2, and the unique 1/2 point carries sqrt(n) memory, losing to rho on the complete-cost metric. Consistent with, and independent of, the generic-group Shoup 1/2 bound: D1 is a structural statement about the constraint language, not a query-count bound, so it constrains non-generic algorithms that Shoup does not reach.'
  verdict: REJECTED-exponent-neutral
  killer_objection: 'The conclusion already exists in the ledger by a stronger, empirically verified route (hypothesis_ledger.md:1010; NR-009; BIN-NR-003), so the lemmas re-derive a banked result. The cost derivation is arithmetically self-contradictory - the charged stages give 1/m, not 1/2 - and it omits the linear-algebra stage that actually binds. Applying Bulatov/Zhuk is also a category error: that dichotomy fixes the finite template and grows the instance, whereas here the DOMAIN grows with the security parameter and the instance is constant-size.'
- uid: POLYCLONE:BAR-TEMPLATE-D2
  id: BAR-TEMPLATE-D2
  family: 'Algebraic CSP dichotomy: polymorphism / Maltsev / few-subpowers tractability of the factor-base decomposition constraint'
  family_key: POLYCLONE
  area: logic-and-proof-complexity
  group: D barrier
  title: 'BAR-TEMPLATE-D2: fixed-template / growing-domain asymptotic mismatch closes the remaining encodings'
  mechanism: 'A second, independent barrier that closes the encodings D1''s lemmas do not reach, and that limits what the CSP dichotomy could ever contribute even if D1 were false. The CSP dichotomy is a theory of FIXED finite templates: complexity is measured in instance size with the domain size |D| a constant whose contribution to the runtime is unbounded in general. ECDLP relation search has the opposite shape - the instance is m variables and one constraint (tiny and fixed) while the domain |F| = B is the growing parameter. Therefore the dichotomy''s ''in P'' verdicts are VACUOUS here unless the specific algorithm is explicitly polynomial in |D|.'
  fingerprint: 'algebraic object: the pair (template Gamma, instance I) and the question of which member carries the growing parameter; public ops: the primitive operations of any CSP algorithm; hidden structure: none - this is an accounting and applicability barrier, not a structural one; info discarded: n/a; info retained: the asymptotic regime itself; relation primitive: n/a; compression primitive: n/a; rank mechanism: n/a; descent mechanism: n/a; dominant cost exponent: the general dichotomy contributes NO exponent whatsoever, and the three domain-polynomial classes contribute exponents only under a hypothesis that D1 refutes.'
  prediction: 'Three horns. HORN 1, applicability: exactly three tractable classes have runtimes explicitly polynomial in |D| - Maltsev / few subpowers (Bulatov-Dalmau compact representation, poly in arity and |D|), bounded width / k-consistency (poly in |D|^k), and near-unanimity / bounded strict width. Bulatov''s and Zhuk''s general algorithms are polynomial in INSTANCE size with a template-dependent constant that is not polynomial in |D|. Prediction: a literature audit finds no domain-polynomial general Taylor algorithm. And each of the three is independently closed here - Maltsev/few subpowers by D1''s coset condition, bounded width because R_Q is a coset of a subgroup so the affine type is present and Barto-Kozik gives bounded width iff the affine type is omitted, and near-unanimity because the projections of R_Q onto any <= m-2 coordinates do not determine membership so no NU term of arity <= m-1 exists. HORN 2, encoding closure: the only encoding escaping D1 Lemma 1 is the degenerate ''domain = F, single fixed Q'' template, whose CSP has exactly ONE instance per Q and therefore no asymptotics at all - the complexity question is not well posed. D1 and D2 thus interlock and jointly close every encoding of the decomposition constraint as a CSP. HORN 3, local consistency is a self-reduction not a reduction: the k-ary projection of R_Q intersect F^m onto any k coordinates is exactly the set of k-tuples whose complementary sum decomposes into m-k factor-base elements; with B = p^(1/m) a random k-tuple survives with probability ~ p^(-k/m)/(m-k)!, so projections ARE informative, but computing any one of them is a decomposition problem for m-k variables, i.e. the same problem one size down. k-consistency renames the problem rather than reducing it, and naive computation of the m-ary projection costs B^m ~ p, worse than rho.'
