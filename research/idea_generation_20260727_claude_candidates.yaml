- uid: OPENDYN:OPENDYN-B1
  id: OPENDYN-B1
  family: Open / absorbing (killed) dynamics - Dirichlet spectrum and conditionally-invariant measure of the punctured relation walk
  family_key: OPENDYN
  area: dynamical-and-spectral
  group: B representation-change
  title: HOLE-GROWTH VARIATIONAL PRINCIPLE — rho is the extremal open system, and sub-rho is equivalent to superlinear known-representation supply
  mechanism: Re-represent every DLP walk algorithm as a choice of hole SCHEDULE {H_t} rather than a fixed hole, where H_t is the set of points whose (a,b) representation is already known. Absorption occurs at the first T with sum_{t<T} mu(H_t) >= 1. Pollard rho is the schedule H_t = the walk's own visited set, whose measure grows linearly at the maximal rate of one new labelled point per group operation, giving T = Theta(sqrt(N)). Hence, within the whole open-dynamics family, beating rho is EXACTLY equivalent to superlinear growth of the labelled set — more than one new (a,b)-carrying point per group operation.
  fingerprint: 'algebraic object: a time-indexed family of absorbing sets {H_t} in E(F_p) with the associated sequence of killed operators; the hole is the known-representation set | public ops: EC addition, equality test, table insert/lookup | hidden structure: the coupling between the cost of one operation and the increment |H_{t+1}| - |H_t| | info discarded: the position and geometry of H_t (D1 proves it irrelevant) | info retained: only the growth schedule t -> mu(H_t) | relation primitive: a hit of the current walk point into H_t (a collision with an already-labelled point) | compression primitive: distinguished points and cycle-finding, which reduce the STORAGE of H_t without changing its effective measure | rank mechanism: n/a for collision type; |FB| x |FB| sparse solve if instantiated as index calculus | descent mechanism: one linear congruence (collision) or factor-base log reconstruction (IC) | dominant cost exponent: T solves sum_{t<T} mu(H_t) = 1 — linear growth gives 1/2, superlinear growth gives < 1/2'
  prediction: For every algorithm realisable with group operations plus equality, the labelled-set increment per operation is at most 1, hence mu(H_t) <= t/N, hence T >= sqrt(2N) — recovering Shoup's Omega(sqrt(N)) as a hole-growth statement and placing BSGS, rho, kangaroo and VW parallel rho all exactly on the extremal schedule. Any sub-rho algorithm must exhibit an operation emitting Omega(N^delta) new labelled points at O(1) amortised cost. Measured growth exponent alpha in |H_t| ~ t^alpha will be 1.00 for all four baselines.
  minimal_test: 'p in {10007, 100003, 1000003}; prime-order ordinary non-CM curves; seeds 20260727..20260731. Instrument four algorithms with a per-operation counter on the labelled set: (1) BSGS with baby-step table sqrt(n); (2) Teske r-adding rho, r = 20; (3) Pollard kangaroo on an interval of width n/16; (4) toy prime-field Semaev m=3 index calculus with factor base L = ceil(p^{1/3}). For each, fit alpha in |H_t| ~ t^alpha over t up to 10^6. Predict alpha = 1.00 +- 0.02 for all four. Positive control: a synthetic oracle that emits k labelled points per call must measure alpha = 1 with a k-fold constant, confirming the meter distinguishes constants from exponents. Negative control: a walk that re-visits points must measure alpha < 1.'
  falsification: Falsified — and the family becomes constructive — if any concrete algorithm measures alpha > 1 sustained across >= 3 sizes. Conversely the principle is CLOSED for index calculus by proving that the Semaev membership test emits its k decomposition points at cost >= k group-equivalent operations. A measured alpha > 1 that survives the wrapper's independent certificate re-verification would be the single most important observation this family could produce.
  cost_accounting: 'CHARGES: relation collection (steps to absorption), memory (storage of H_t, reducible by DP/cycle-finding), and verification (every labelled point must carry a re-checkable (a,b) certificate, wrapper-verified). OMITS: preprocessing (schedule-independent), linear algebra (only present in the IC instantiation, where it is charged separately and is NOT covered by this principle), target descent (O(log n) for collision type), multi-target accounting (single target; the multi-target variant shares H_t and changes only the constant).'
  dominant_exponent: 1/2 — the principle derives the exponent rather than beating it, and localises the single quantity (labelled points per operation) that would have to change.
  verdict: REJECTED-duplicate
  killer_objection: 'The conclusion - hole geometry is irrelevant, only the growth schedule matters - is already in the corpus verbatim (''the spectral gap changes constants, not the exponent''; ''the birthday bound is information-theoretic on an unstructured collision''), and the exponent statement is implied by Shoup. It is also not clean: it rests on an unproven maximality axiom plus a heuristic walk-point/H_t independence assumption, and it excludes by fiat the only stage that could violate it.'
- uid: OPENDYN:OPENDYN-B2
  id: OPENDYN-B2
  family: Open / absorbing (killed) dynamics - Dirichlet spectrum and conditionally-invariant measure of the punctured relation walk
  family_key: OPENDYN
  area: dynamical-and-spectral
  group: B representation-change
  title: QSD-REWEIGHTED BIRTHDAY — chi-square concentration of the conditionally-invariant arrival law
  mechanism: Replace the uniform-arrival assumption in the rho birthday count with the true conditionally-invariant (quasi-stationary) arrival law q on the hole, so the collision count becomes sqrt(1/sum_i q_i^2) = sqrt(|H|/(1 + chi^2(q || uniform))), and then design the iteration function to maximise chi^2, buying collisions at a discount of sqrt(1+chi^2). The bias is not imposed by an explicit weight — it IS the leading Dirichlet eigenvector of the killed operator.
  fingerprint: 'algebraic object: the left Dirichlet eigenvector (QSD) nu of the killed operator L_H, and the induced arrival law q = nu restricted and normalised on H | public ops: EC addition, partition-index evaluation, DP predicate, equality test | hidden structure: deviation of the leading Dirichlet eigenvector from the constant function, i.e. non-uniformity of the pre-absorption law | info discarded: trail interiors and the exact survival time | info retained: the second moment sum_i q_i^2 of the arrival law | relation primitive: an arrival coincidence between two trails carrying distinct (a,b) | compression primitive: the QSD acts as an implicit importance weight — nothing is stored or reweighted | rank mechanism: n/a | descent mechanism: one linear congruence from the coincidence | dominant cost exponent: 1/2 - (1/2)log_N(1+chi^2); crosses rho iff chi^2 grows as a positive power of N'
  prediction: For any r-adding walk on prime-order ordinary E(F_p) with a coordinate-predicate hole, the measured chi^2(q || uniform on H) is O(1), bounded independent of p, so the saving is a constant factor and the exponent is exactly 1/2. Quantitatively, in the perturbative regime mu(H) < gamma (gamma = the closed-system spectral gap), first-order perturbation of the killed operator gives ||nu - pi||_2 = O(mu(H)/gamma) and hence chi^2 = O((mu(H)/gamma)^2) < 1 throughout the regime's own validity range.
  minimal_test: 'p in {10007, 100003, 1000003}; prime-order ordinary non-CM curves; r = 20; holes = t trailing zero bits of x with mu(H) in {2^-4, 2^-8, 2^-12}; seeds 20260727..20260731. At p = 10007 the state space is n ~ 10^4, so the exact killed operator is an n x n sparse matrix with r = 20 nonzeros per row and is fully materialisable; extract the leading Dirichlet eigenpair by sparse power iteration, form q, and report chi^2(q || uniform on H). Repeat at 100003 (n ~ 10^5, still sparse-feasible) and at 1000003 by Monte-Carlo estimation of q from 10^7 trails. Report the trend of chi^2 in p. Positive control: a deliberately bottlenecked walk (generators confined inside a proper subgroup of a composite-order curve) must show chi^2 growing with size. Negative control: an i.i.d.-uniform surrogate must show chi^2 -> 0.'
  falsification: Survives only if measured chi^2 grows as a positive power of p across >= 3 sizes for a legitimately computable walk on a PRIME-ORDER curve. Dies (expected) if chi^2 stays bounded. Note the composite-order positive control does NOT count as survival — it is outside the target family and exists solely to prove the instrument fires.
  cost_accounting: 'CHARGES: relation collection only (the collision count). OMITS: preprocessing (walk setup), linear algebra (none), target descent (one congruence), verification (one scalar multiplication), memory (DP table, unchanged), multi-target accounting (single target). CRITICAL DISCLOSURE: B2 also omits the burn-in cost required to REACH the QSD. That omission is load-bearing and is precisely what OPENDYN-D2 charges; B2 stated in isolation flatters itself by exactly the size of its claimed saving.'
  dominant_exponent: 1/2 - (1/2)log_N(1+chi^2); predicted to evaluate to 1/2 because chi^2 = O(1).
  verdict: REJECTED-exponent-neutral
  killer_objection: The identity 1 + chi^2 = 1/theta is a change of variables on the standard van Oorschot-Wiener DP analysis, which already establishes that the DP rate affects memory and overhead but never the sqrt(N) work exponent. The declared 'hidden structure' is the noise floor of a random functional graph (chi^2 = Theta(1/theta) under a random encoding), not a property of the curve; predicted exponent 1/2 sits exactly on the cap.
- uid: OPENDYN:OPENDYN-C1
  id: OPENDYN-C1
  family: Open / absorbing (killed) dynamics - Dirichlet spectrum and conditionally-invariant measure of the punctured relation walk
  family_key: OPENDYN
  area: dynamical-and-spectral
  group: C high-risk
  title: FIRST-RETURN (INDUCED-MAP) ACCELERATION — does E(F_p) admit a Kac-inducible subset with a cheap return map?
  mechanism: 'Ask whether E(F_p) admits a subset A of density N^{-delta} whose FIRST-RETURN (induced) map T_A : A -> A is evaluable in polylog(p) group-equivalent operations WITHOUT simulating the ~N^delta intermediate steps — the way the Gauss map''s induced map on a small interval is one continued-fraction step — so that a birthday collision inside A costs sqrt(|A|) = N^{(1-delta)/2} induced evaluations instead of N^{1/2} group operations.'
  fingerprint: 'algebraic object: the first-return map T_A of the walk (or of translation-by-P) to a subset A of E(F_p), together with the return-time function n_A : A -> N | public ops: EC addition and doubling, equality test, plus whatever closed-form return-time evaluation is exhibited — that formula is the NON-GENERIC ingredient and the whole content of the candidate | hidden structure: an arithmetic closed form for n_A(x), which is exactly what makes induction cheap in the Gauss and Rauzy cases | info discarded: every orbit point strictly between consecutive visits to A | info retained: the induced dynamics on A and the accumulated (a,b) label, which must be updatable in closed form alongside the jump | relation primitive: a collision of the induced walk inside A between points with distinct accumulated labels | compression primitive: Kac induction — the state space contracts from N to |A| with the invariant measure renormalising to mu restricted to A over mu(A) | rank mechanism: n/a (collision type) | descent mechanism: one linear congruence using the accumulated labels | dominant cost exponent: ((1-delta)/2) times the cost of one induced evaluation; crosses rho iff the induced map costs polylog while delta > 0'
  prediction: No such A exists for ordinary prime-order E(F_p) under a group-operation-only walk. Evaluating T_A requires n_A(x); for the translation walk n_A(x) is a difference of discrete logarithms, so the construction is circular. Formally, an O(polylog)-evaluable induced map on a density-N^{-delta} set is a non-generic operation and would contradict Shoup's Omega(sqrt(N)) unless it consumes curve structure (a subfield, a small-norm endomorphism, or a rational map) that ordinary prime-field curves do not supply.
  minimal_test: 'p in {1009, 10007, 100003}; prime-order ordinary non-CM curve at each; A = {Q : x(Q) < p/2^d} for d in {4,6,8}. At the two smallest sizes, exhaustively tabulate T_A and n_A by full O(p) enumeration. Then test the only thing that could make induction cheap: whether n_A is computable from x(Q) by a low-complexity arithmetic expression. Fit n_A against (i) polynomials in x of degree <= 8 over F_p (interpolate and check residual), (ii) a three-distance-theorem / continued-fraction model with parameters read off A''s interval structure, (iii) a linear-congruence model n_A(x) = alpha x + beta mod n. Positive control: the Gauss map induced on a rational subinterval, where the induced map IS one CF step and fit (ii) must succeed exactly. Negative control: a uniformly random permutation of the same state space, where no fit may beat chance. Seeds 20260727..20260731.'
  falsification: 'Dies (expected) if n_A admits no fit better than the random-permutation control at any d and any size. Survives — and becomes the program''s first non-generic lever — only if an exact closed form for n_A is exhibited at all three sizes together with a certificate the run wrapper re-verifies by independent scalar multiplication. Additional automatic kill: if the exhibited A requires a stored table of size |A|, the memory stage must be re-charged and the candidate collapses into BSGS.'
  cost_accounting: 'CHARGES: relation collection (induced-map evaluations to collision) and verification (each induced jump must emit a re-checkable (a,b) label, wrapper-verified by one scalar multiplication). OMITS: preprocessing (existence of A assumed free), linear algebra (none), target descent (one congruence), memory (assumed O(1) — THIS OMISSION IS LOAD-BEARING and is the candidate''s principal hidden-cost risk), multi-target accounting.'
  dominant_exponent: (1-delta)/2 if a polylog induced map existed; predicted 1/2 because it does not.
  verdict: REJECTED-duplicate
  killer_objection: 'Mechanism-duplicate of DML-ORBIT-C1 / ECFG-P1544, whose own preregistered metric reads ''hit_location_exponent: measured cost to find one k in R vs n/|X|'' with success criterion < 1/2 - so the claimed distinction (arithmetic SHAPE of the return set versus EVALUATION COST of the return map) is false on the record. Kac''s identity mu(A)*E[n_A] = 1 is textbook (Kac 1947) and reproduces the already-recorded Theta(n/|X|) exactly.'
- uid: OPENDYN:OPENDYN-C2
  id: OPENDYN-C2
  family: Open / absorbing (killed) dynamics - Dirichlet spectrum and conditionally-invariant measure of the punctured relation walk
  family_key: OPENDYN
  area: dynamical-and-spectral
  group: C high-risk
  title: METASTABLE WELL CONFINEMENT — Freidlin-Wentzell wells as a birthday-on-a-subset
  mechanism: 'Place the absorbing hole so the surviving dynamics is confined to a metastable well: an almost-invariant subset W of E(F_p) with |W| = N^{1-delta} that the walk leaves only on an exponentially long timescale, so the birthday collision is taken on |W| rather than N, giving N^{(1-delta)/2}. The killed operator''s second Dirichlet eigenvector is the detector for W.'
  fingerprint: 'algebraic object: an almost-invariant (metastable) subset W of E(F_p) for the walk kernel, characterised by conductance Phi(W) = o(1) and by a near-degenerate cluster at the top of the killed operator''s Dirichlet spectrum | public ops: EC addition, W-membership test, equality test | hidden structure: a Freidlin-Wentzell-type energy landscape on E(F_p) whose wells are the almost-invariant sets | info discarded: everything outside W (absorbed) | info retained: the confined sub-walk and its accumulated labels | relation primitive: a collision inside W between labelled points | compression primitive: confinement — the effective state space contracts from N to |W| | rank mechanism: n/a (collision type) | descent mechanism: one linear congruence from the confined collision | dominant cost exponent: (1-delta)/2, provided confinement costs O(1) per step'
  prediction: No such W exists. An almost-invariant set for a walk whose steps add fixed group elements g_1..g_r is, up to o(1), a set with W + g_i contained in W for most i — an approximate subgroup / small-doubling subset of Z/nZ. For n prime, Kneser with Vosper-Kemperman and PFR force such a set to be an arithmetic progression or nearly all of Z/nZ, and an AP is not simultaneously almost-invariant under r >= 2 generic generators. Hence Phi(W) = Omega(1) for every W with |W| <= N/2, the r-adding walk is an expander in the relevant range, and delta = 0.
  minimal_test: 'p in {1009, 10007, 100003}; prime-order ordinary non-CM curves; r in {4, 20}. Build the exact r-adding transition graph and compute (i) minimum conductance over sets found by spectral partitioning plus sweep cuts, and (ii) the top five Dirichlet eigenvalues of the killed operator with a hole of measure 2^-4, checking for a near-degenerate cluster below the leading eigenvalue — the signature of metastability. Positive control: a planted-bottleneck walk with generators chosen inside a proper subgroup of a COMPOSITE-order curve, which must show Phi = o(1) and a visible spectral cluster. Negative control: the prime-order curve itself, expected Phi = Omega(1) with a clean gap after the leading eigenvalue. Seeds 20260727..20260731.'
  falsification: Dies (expected) if measured minimum conductance is bounded below across all three sizes with no near-degenerate Dirichlet cluster. Survives only if a family of sets with |W| = N^{1-delta}, delta > 0, and Phi(W) -> 0 is exhibited on PRIME-ORDER ordinary curves. The composite-order control surviving is not evidence — it is instrument validation.
  cost_accounting: 'CHARGES: relation collection (collisions inside W) and memory (the W-membership test must be O(1) and storage-free, otherwise memory re-charges and the candidate collapses into BSGS). OMITS: preprocessing (finding W assumed free — LOAD-BEARING OMISSION: locating a metastable set generally requires a spectral computation on an N x N operator, i.e. Omega(N), which alone exceeds sqrt(N)), linear algebra, target descent, verification, multi-target accounting.'
  dominant_exponent: (1-delta)/2 if a metastable well existed; predicted 1/2 because delta = 0.
  verdict: REJECTED-exponent-neutral
  killer_objection: 'The true object is ''an o(n) structured subset of E(F_p) carrying Q'', catalogued twice: as the growth/product-theorem candidate''s only named escape hatch, and as STAB-C1, whose disproof track explicitly reserves this barrier ''against all future structured subset ideas''. Independently Shoup caps it at 1/2: every relation-producing event remains a group-op collision detected by equality, so a membership predicate on a fixed encoding subset adds zero group-oracle queries.'
- uid: OPENDYN:OPENDYN-D1
  id: OPENDYN-D1
  family: Open / absorbing (killed) dynamics - Dirichlet spectrum and conditionally-invariant measure of the punctured relation walk
  family_key: OPENDYN
  area: dynamical-and-spectral
  group: D barrier
  title: KAC-EXTREMAL-INDEX SIGN BARRIER — hole geometry cannot help and generically hurts
  mechanism: 'Prove the two-sided pin on relation supply from an open walk: (i) by Birkhoff/Kac, for an ergodic walk the mean number of steps per hole visit equals EXACTLY 1/mu(H), independent of the geometry of H — geometry can redistribute the return-time law but never its mean; (ii) by the extreme-value / escape-rate expansion (Keller; Freitas-Freitas-Todd; Bruin-Demers-Todd), the rate of INDEPENDENT, non-clustered and therefore non-redundant visits is theta*mu(H) with the extremal index theta in (0,1]. Therefore the family''s motivating asymmetry — that escape depends on hole position, not merely hole measure — is REAL but has the WRONG SIGN for the attacker: geometry is at best neutral and generically strictly harmful.'
  fingerprint: 'algebraic object: the killed transfer operator L_H together with the pair (mean return time, extremal index) attached to (walk, H) | public ops: any group-operation walk plus a hole-membership predicate | hidden structure: none available — the barrier asserts absence by an exact identity plus a one-sided inequality | info discarded: hole geometry, proved irrelevant to the mean | info retained: the hole measure mu(H) and the clustering index theta | relation primitive: a hole visit | compression primitive: none can help | rank mechanism: irrelevant | descent mechanism: irrelevant | dominant cost exponent: relation-collection steps per USEFUL relation >= 1/mu(H), with equality iff theta = 1'
  prediction: 'At fixed measure, every hole geometry yields mean steps-per-visit exactly 1/mu(H); no hole design achieves a useful-relation rate above mu(H); designs aligned with the walk''s short periodic orbits achieve strictly less. Corollary: the escape-rate lever cannot produce any relation-collection gain beyond a constant, and can only produce losses.'
  minimal_test: OPENDYN-A2 IS the discriminating test. p in {10007, 100003, 1000003}; prime-order ordinary non-CM curves; four geometries H1-H4 at fixed mu(H) = 2^-8; r = 20; seeds 20260727..20260731; 10^7 steps per run. D1 fires if mean steps/visit equals 1/mu(H) within 95% CI for all four geometries at all three sizes AND theta <= 1 for all four, with theta strictly below 1 for the cycle-aligned geometry H4.
  falsification: Broken by exhibiting, on a prime-order ordinary curve, a hole geometry whose measured USEFUL-visit rate exceeds mu(H) at all three sizes; or by exhibiting any walk-plus-hole pair measuring theta > 1. Either result would restore the family's constructive hope. Note that a mean steps-per-visit differing from 1/mu(H) would not break the barrier but would instead indicate the walk is not ergodic with respect to counting measure — a separate and independently useful finding.
  cost_accounting: Barrier — CHARGES nothing and BOUNDS relation collection only. Explicitly SILENT on preprocessing, linear algebra, target descent, verification, memory and multi-target accounting. It must never be quoted as a complete-cost statement, and it is scoped to walks that are ergodic with respect to counting measure on a prime-order ordinary E(F_p).
  dominant_exponent: 1/2 — the barrier pins the relation RATE at mu(H) from above and forbids geometry-driven improvement.
  verdict: UNREFUTED
  killer_objection: 'NOT adversarially refuted. Refutation was capped at the first six candidates per family, so this candidate was never independently attacked. Unrefuted is NOT endorsed: it is a proposal nobody has killed yet, not a result and not a survivor.'
  status: unrefuted-not-endorsed
- uid: OPENDYN:OPENDYN-D2
  id: OPENDYN-D2
  family: Open / absorbing (killed) dynamics - Dirichlet spectrum and conditionally-invariant measure of the punctured relation walk
  family_key: OPENDYN
  area: dynamical-and-spectral
  group: D barrier
  title: RELAXATION-ABSORPTION DICHOTOMY BARRIER — the quasi-stationary measure is exploitably non-uniform only where it is never realised
  mechanism: 'Let gamma be the closed-system spectral gap and eps = mu(H). (i) PERTURBATIVE REGIME eps << gamma: first-order perturbation of the killed operator, with resolvent norm 1/gamma on the orthogonal complement of the constants, gives ||nu - pi||_2 = O(eps/gamma), hence chi^2(nu||pi) = O((eps/gamma)^2), which is o(1) throughout the regime''s own validity range — the QSD is uniform to leading order and buys at most a constant. (ii) NON-PERTURBATIVE REGIME eps >~ gamma: the mean survival time 1/(theta*eps) is at most the relaxation time 1/gamma, so trails are absorbed BEFORE the subdominant modes decay; the arrival law is governed by the initial law and the transient, and no QSD is ever realised to design against. There is no third regime, hence no exponent gain is available from conditional invariance. Equivalently: any attempt to grow chi^2 by shrinking gamma raises burn-in by at least the same factor, so the product (burn-in cost) x (collision count) is scale-invariant at sqrt(N).'
  fingerprint: 'algebraic object: the pair (closed spectral gap gamma, hole measure eps) and the resulting regime dichotomy for the killed operator''s leading eigenpair | public ops: any group-operation walk with a hole predicate | hidden structure: the resolvent bound ||(I-L)^{-1}|| = 1/gamma on the complement of the constants, which is what couples QSD distortion to gamma | info discarded: the fine structure of the QSD, irrelevant in both regimes | info retained: the single ratio eps/gamma that decides the regime | relation primitive: an arrival into the hole | compression primitive: none — the ''free'' conditioning is either trivial or unreachable | rank mechanism: irrelevant | descent mechanism: irrelevant | dominant cost exponent: 1/2, with the burn-in x collision-count product invariant'
  prediction: 'Over all r-adding walks and coordinate-predicate holes on ordinary prime-order E(F_p), the chi^2 of the REALISED arrival law from uniform stays O(1) as p grows, in BOTH regimes: where the QSD is genuinely non-uniform the trails die before reaching it, and where the trails do reach it the QSD is uniform to leading order. This closes OPENDYN-B2 and reinforces the closure of OPENDYN-C2.'
  minimal_test: 'p in {10007, 100003, 1000003}; prime-order ordinary non-CM curves. Sweep the regime parameter directly: hole measures eps in {2^-12, 2^-8, 2^-4, 2^-1} crossed with walks of tuned gap (r in {2, 4, 20}; smaller r lowers gamma). For each (eps, r, p) compute (a) gamma from the closed transition operator, (b) the leading Dirichlet eigenpair of the killed operator, (c) chi^2 of the TRUE QSD arrival law, and (d) chi^2 of the REALISED arrival law from simulation started at uniform with 10^6 trails. D2 fires if (c) is O(1) wherever eps < gamma, AND (d) stays O(1) even in the region where (c) grows, because trails die before relaxing. Positive control: a composite-order curve with generators inside a proper subgroup, where (c) and (d) must BOTH grow (instrument validation). Negative control: an i.i.d.-uniform surrogate, where both must vanish. Seeds 20260727..20260731.'
  falsification: Broken by exhibiting, at three sizes on prime-order ordinary curves, a configuration where the REALISED arrival law has chi^2 growing as a positive power of p; or by exhibiting a walk whose QSD is reached WITHIN the survival time AND is polynomially non-uniform. Either falsifies D2 and revives OPENDYN-B2 and OPENDYN-C2.
  cost_accounting: Barrier — CHARGES nothing and BOUNDS relation collection only. Its entire content is that OPENDYN-B2's omitted burn-in is exactly the size of B2's claimed saving. Explicitly SILENT on preprocessing, linear algebra, target descent, verification, memory and multi-target accounting. Scoped to ordinary prime-order E(F_p) with group-operation walks; the perturbative estimate is a first-order statement whose validity region (eps << gamma) is part of the claim, not an omission.
  dominant_exponent: 1/2 — the barrier shows the (burn-in) x (collision-count) product is invariant, so conditional invariance is exponent-neutral by exact cancellation.
  verdict: UNREFUTED
  killer_objection: 'NOT adversarially refuted. Refutation was capped at the first six candidates per family, so this candidate was never independently attacked. Unrefuted is NOT endorsed: it is a proposal nobody has killed yet, not a result and not a survivor.'
  status: unrefuted-not-endorsed
- uid: LOGCORR:A1
  id: TWOPOINT-COVMETER-A1
  family: Log-correlated / branching-field structure of the Semaev decomposition-count field (multiscale covariance vs Derrida REM)
  family_key: LOGCORR
  area: statistical-physics
  group: A conservative
  title: TWOPOINT-COVMETER-A1 — distance-resolved two-point function of the Semaev decomposition-count field
  mechanism: 'Measure, for the first time in the program, the DISTANCE-RESOLVED covariance rho(d) = Corr(N(j), N(j+d)) of the decomposition-count field N(j) = #{(x_1..x_m) in V^m : S_{m+1}(x(R_0+jP), x_1..x_m)=0} over a window of consecutive indices, stratified two ways simultaneously — archimedean (dyadic ranges of |d|) and 2-adic (by v_2(d)) — to decide the family''s dichotomy: log-correlated / branching (rho(d) ~ 1 - log|d|/log W, near-maximal sites reachable by O(log p)-scale pruning) versus Derrida-REM (rho(d) = O(p^{-1/2}), Theta(1/delta_1) independent trials forced). The corpus has computed only GLOBAL first and second moments of this count; it has never produced rho as a FUNCTION of index distance.'
