- uid: AUTOMAT:C1
  id: ONESIDED-NS-FILTER-C1
  family: Proof-search AUTOMATABILITY of the factor-base non-decomposition refutation (non-Groebner backends)
  family_key: AUTOMAT
  area: logic-and-proof-complexity
  group: C high-risk
  title: ONESIDED-NS-FILTER-C1 — degree-truncated sound one-sided refutation filter with a re-balanced factor base at L = p^{1/6}
  mechanism: 'Stop trying to make the exact membership test cheap (the alpha < 3/2 gate) and instead make MOST trials free: run a bounded-degree Nullstellensatz/PC certificate search at constant degree d as a SOUND ONE-SIDED filter (finding a degree-d certificate PROVES non-decomposability, so there are no false negatives by construction), pass only survivors to the expensive exact test, and shrink the factor base from L = p^{1/5} to L = p^{1/6} so that refutations dominate POLYNOMIALLY rather than by the constant factor m! = 120. This trades the alpha threshold for a filter threshold, opening a crossing point the program has never specified.'
  fingerprint: 'algebraic object: the ideal I_m(F,Q) together with its degree-d truncated Nullstellensatz cone; public ops: solve the degree-d NS feasibility linear system (unknowns = C(d+m,m) cofactor coefficients, equations = the O(L*d^m) monomials actually appearing in the sparse products g_j*f_j — NOT the ambient monomial space); hidden structure: presumed existence of low-degree reasons for non-decomposability on a positive fraction of NO-instances; info discarded: the exact solution set on rejected trials (only ''no decomposition'' is retained); info retained: the survivor set; relation primitive: unchanged Semaev m-point decomposition on survivors only; compression primitive: the filter itself — replacing L^alpha exact work by a sound O(L)-cost certificate check on a 1 - f fraction of trials; rank mechanism: unchanged sparse L x L relation matrix over Z/n; descent mechanism: inherited 2-LP large-prime graph (NOT re-derived here, flagged as an open obligation); dominant cost exponent: p^{(k-4)/k}*C_f with k = 6, i.e. p^{1/3}*C_f.'
  prediction: 'FAILS, and fails by a factor of L, not by a constant. Explicit derivation of the requirement (m = 5, L = p^{1/k}, #E ~ p): decomposition probability Pr = L^5/(120p); relations needed ~ L; trials T = L/Pr = 120*p^{(k-4)/k}. At k = 6: T = 120*p^{1/3}, and the two budgets are (i) filter cost C_f < p^{1/6}/120 = L/120 and (ii) false-positive rate f < p^{-1/6}/120 = 1/(120L); survivors ~ 2L then cost 2L*L^alpha = 2p^{5/12} < p^{1/2} for alpha = 3/2, and LA = L^2 = p^{1/3} < p^{1/2}. Budget (i) is exponent-feasible: the degree-d NS system is O(L*d^m) equations in C(d+m,m) unknowns, so C_f = O(L*d^{2m}) = O(L) for constant d. Budget (ii) is what dies: I predict f(d) >= 0.99 for every constant d <= 3 and every tested L, i.e. constant-degree NS certificates refute essentially NOTHING, missing the required 1/(120L) by a factor >= 100*L. Mechanistic reason: the true NS refutation degree tracks the corpus d_reg linear law (d_reg = Theta(n), c* = 0.2374790709, idea_generation_20260721.md D2), so d* = Theta(L), not O(1). Note the internal logic: C1 SUCCEEDS if and only if POLYCALC-D2''s conjectured degree barrier is VACUOUS.'
  minimal_test: 'Shares instances with A1, so it costs nothing extra. p in {1009, 4099, 16381}; ordinary non-CM prime-order E/F_p (reject #E = p, j in {0,1728}, embedding degree < 10); m in {3,4}; L in {8,16,32}; N = 200 exhaustively-certified non-decomposable targets per cell; seeds 20260727..20260729, 3 replicates. Measure f(d) = fraction of the N targets NOT refuted by a degree-<=d NS certificate, for d = 1,2,3, and measure C_f(d) in field operations. Decision rule: the k=6 crossing needs f(d) <= 1/(120L) AND C_f(d) <= L/120 simultaneously, i.e. at L = 32 that is f <= 2.6e-4 and C_f <= 0.27 ops — already visibly impossible at L = 32, which is the point of running the smallest cell first. Positive control: an inconsistent linear system (f(1) = 0, C_f = O(1)). Negative control: a random system of the same degree profile (expect f(d) = 1 for all d <= 3).'
  falsification: 'FALSIFIED (i.e. C1 lives) if there exists a constant d with f(d) <= 1/(120L) and C_f(d) <= L/120 sustained across all three L values with a fitted trend. Weaker but still escalation-worthy: f(d) decaying like L^{-c} for any c > 0 with C_f(d) = O(L) — any polynomial decay would justify pushing to larger L and to k = 7. CONFIRMED DEAD if f(d) is bounded away from 0 (i.e. Omega(1)) at every constant d, which also directly evidences barrier D1.'
  cost_accounting: 'CHARGES, at k = 6, L = p^{1/6}, m = 5: (1) PREPROCESSING — factor base build = L point constructions = p^{1/6}, subdominant; any filter advice table would have to be charged at build cost AND storage per BAR-AMORT-D2 (the version specified here uses NO advice table, deliberately, to stay clear of that wall). (2) RELATION COLLECTION — T*C_f + S_surv*L^alpha = 120*p^{1/3}*C_f + 2L*L^{3/2} = 120*p^{1/3}*C_f + 2p^{5/12}; this is the binding term and the whole claim reduces to C_f = o(p^{1/6}). (3) LINEAR ALGEBRA — sparse L x L over Z/n with 5 nonzeros per row, ~L^2 = p^{1/3} by block-Wiedemann, subdominant. (5) VERIFICATION — each claimed relation re-verified by m = 5 independent elliptic-curve additions, O(L) total; claim tier: relation only, per docs/claims-and-verification.md. (6) MEMORY — 5L = O(p^{1/6}) nonzeros, negligible. OMITS, with no figure claimed and flagged as an inherited open obligation, not a hidden win: (4) TARGET DESCENT — the individual-logarithm / 2-large-prime descent for prime-field m = 5 index calculus is NOT charged here and is not known to be sub-rho; if descent costs >= p^{1/2} the entire lane is void regardless of the filter. (7) MULTI-TARGET ACCOUNTING — n/a, the claim is single-target only. Toy-scale never becomes crypto-scale: the experiment measures f(d) at L <= 32 and any extrapolation is stated as a fitted trend with residuals, never as a crypto-scale figure.'
  dominant_exponent: 'total = max(120*p^{1/3}*C_f, 2p^{5/12}, p^{1/3}) with C_f the per-trial filter cost; crossing rho = p^{1/2} iff C_f = o(p^{1/6}) AND f = o(p^{-1/6}). Adverse prior: f = Omega(1), which leaves the total at 120*p^{1/3}*L^{3/2} = 120*p^{1/3+1/4} = 120*p^{7/12} > p^{1/2} — i.e. worse than the k = 5 configuration, confirming k = 5 is optimal absent a filter.'
