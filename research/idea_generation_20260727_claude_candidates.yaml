- uid: AUTOMAT:D1
  id: D1-FILTER-TIGHTNESS-COLLAPSE
  family: Proof-search AUTOMATABILITY of the factor-base non-decomposition refutation (non-Groebner backends)
  family_key: AUTOMAT
  area: logic-and-proof-complexity
  group: D barrier
  title: FILTER-TIGHTNESS COLLAPSE BARRIER — any refutation filter cheap enough to help is already an exact membership recognizer
  mechanism: Prove that the 'skip the refutations' loophole is self-closing. At the program's operating point L = q^{1/5}, m = 5 the decomposition probability is L^5/(5!p) = 1/120, a CONSTANT, so refutations outnumber successes only 119:1 and a free refutation oracle changes nothing but a constant. Re-balancing to L = p^{1/k}, k >= 6 makes refutations dominate polynomially, but then the filter must simultaneously satisfy C_f < L/120 and false-positive rate f < 1/(120L) (k=6), and a SOUND filter meeting the second budget recognizes a superset of the decomposable set within a constant factor of it — so composing filter-then-exact-test yields an EXACT decision procedure for 5-SUM-on-a-curve with average cost O(L) = L^{1+o(1)}, far below MITM L^3 and below the standing alpha >= 3/2 floor. The loophole therefore cannot be opened without refuting the corpus's own fine-grained barrier.
  fingerprint: 'algebraic object: the decomposable set D = {sums of m factor-base points} inside E(F_p), of density L^m/(m! p); public ops: any sound one-sided rejection test plus the exact membership test on survivors; hidden structure: the tightness coupling between the filter''s false-positive budget and the density of D; info discarded: the filter''s internal mechanism — the barrier is mechanism-agnostic, it charges only (C_f, f); info retained: the survivor-count identity S_surv = L + f*T; relation primitive: irrelevant to the barrier; compression primitive: none can help — the barrier says the filter cannot be simultaneously cheap and sharp; rank mechanism: irrelevant; descent mechanism: irrelevant; dominant cost exponent: pins the AVERAGE per-trial membership cost exponent at >= 3/2, closing the k in {6,7} re-balanced crossings.'
  prediction: 'No (C_f, f) pair satisfying both budgets exists for any sound filter. Falsifiable numeric form at k = 6: any sound filter with f <= 1/(120L) and C_f <= L/120 composes into an exact 5-point-decomposition recognizer whose expected cost on random targets is C_f + (f + Pr)*L^alpha = O(L), i.e. alpha_average <= 1, contradicting the report86 fine-grained floor and the RT-1476 sign-rank floor alpha >= 3/2. Secondary prediction, specific to the only concrete instantiation (C1): the degree-d NS filter has f(d) = 1 - o(1) for every constant d, missing the budget by a factor >= 100*L.'
  minimal_test: 'The C1/A1 measurement IS the D1 test — no separate experiment. Cells: p in {1009,4099,16381}, m in {3,4}, L in {8,16,32}, N = 200 certified non-decomposable targets, seeds 20260727..20260729. Record the empirical pair (C_f(d), f(d)) for d = 1,2,3 and plot it against the admissible region {C_f <= L/120, f <= 1/(120L)}. The barrier predicts every measured point lies outside the region by >= 2 orders of magnitude in f. Positive control: a synthetic filter with a planted low-degree certificate on a 1/L fraction of instances — the measurement must detect it, proving the instrument is not blind. Negative control: a random rejection rule (expect f = 1).'
