- uid: OGP:MODNPP-LIFT-B1
  id: MODNPP-LIFT-B1
  family: Overlap Gap Property (m-OGP) landscape barrier for relation-search OPTIMIZATION
  family_key: OGP
  area: statistical-physics
  group: B representation-change
  title: MODNPP-LIFT-B1 - Semaev relation search as random modular number partitioning with a graded circle energy
  mechanism: 'Represent relation search as random modular number partitioning: fix weight m=5, take the factor-base dlog vector x in (Z/n)^L as the disorder, and grade configurations by the circle distance H(v) = |sum_i v_i x_i + t|_circ / n, so a relation is exactly H = 0. This supplies the FIRST real-valued graded energy on the relation configuration space and is what makes the spin-glass toolkit (m-OGP, Franz-Parisi potential, free energy, Guerra interpolation) statable for ECDLP at all.'
  fingerprint: 'object: random modular subset-sum ensemble (Z/n codomain, weight-m sign sphere domain, i.i.d.-heuristic disorder x); ops: analytic - Z/n arithmetic; attack-side - group additions and equality test only; hidden structure: the graded circle metric on the CODOMAIN Z/n induced by the dlog isomorphism; discarded: the curve, the Semaev polynomial, the x-coordinate algebra - everything except x; retained: the single modular linear constraint plus the weight/support combinatorics; relation-generation primitive: none new - Wagner k-tree / generalized birthday remains best for a single modular constraint, which is batch21_0722 territory; compression primitive: none; rank mechanism: none; descent mechanism: energy descent on H, which is UNIMPLEMENTABLE (see D2); dominant cost exponent: solution density is Theta(1/q) for a single mod-n constraint INDEPENDENT of L, giving the generalized-birthday exponent 1/2 - exponent-neutral versus rho.'
  prediction: (i) The lifted elliptic ensemble is statistically indistinguishable from a curve-free i.i.d. random modular subset-sum on every measured statistic (overlap profile, sublevel-set size scaling, energy CDF). (ii) The sublevel-set density ratio |sublevel(E)| / (C(L,5)*2^5 * 2E) converges to 1 with leave-one-out log-log slope 0 +/- 0.05 against L, confirming density Theta(1/q) independent of factor-base size. (iii) Consequently the best complete-cost exponent obtainable in this representation is 1/2, matching rho and never beating it.
  minimal_test: Same fixtures as A1 (3 primes above 2^20/2^24/2^28 with ordinary prime-order curves; L in {24,32,40}; m=5; 5 seeds). Two-sample tests - Kolmogorov-Smirnov on the energy CDF, chi-square on the overlap histogram, log-log regression on sublevel-set size - between the elliptic ensemble and the curve-free i.i.d. ensemble; plus the density-ratio regression in prediction (ii). 1e6 configurations per cell suffices.
  falsification: Any statistic separating the elliptic ensemble from the i.i.d. control at >= 5 sigma, reproducible across all three sizes and all five seeds. That would mean the curve contributes exploitable structure to the lifted landscape - a genuine opening - AND would simultaneously falsify the corpus's standing uniform-dlog heuristic, itself a major finding requiring immediate escalation. Conversely, a measured density that DEPENDS on L (slope != 0) would falsify the 'single mod-n constraint' premise on which the 1/2 floor rests.
  cost_accounting: Charges NO stage as an attack. Analytically it re-derives the relation-collection stage (stage 2) only. Omits preprocessing (stage 1) - and note its own analytic precondition, knowing x, is ECDLP-hard, so the representation is available to the analyst and never to the attacker - and omits linear algebra (3), target descent (4), verification (5), memory (6), and multi-target accounting (7). INCOMPLETE by the corpus's own standard.
  dominant_exponent: 1/2 - the generalized-birthday floor on a single mod-n constraint. Exponent-neutral; does not cross rho.
  verdict: REJECTED-duplicate
  killer_objection: 'm-OGP is the rigorous algorithm-independent formalization of the same 1RSB clustering picture already spent on the same configuration space by SURVEY-PROPAGATION-RSB / ECFG-P1640 and by batch21''s AMP and SP-descent candidates - a rename, not an orthogonal axis. It is also non-binding: OGP bars stable/local algorithms while the acknowledged best method on a single modular constraint (Wagner k-tree) is a global non-local merge OGP does not cover. Terminological tell: ''m'' is used as Hamming weight rather than as the near-solution tuple index.'
- uid: OGP:SURROGATE-ENERGY-C1
  id: SURROGATE-ENERGY-C1
  family: Overlap Gap Property (m-OGP) landscape barrier for relation-search OPTIMIZATION
  family_key: OGP
  area: statistical-physics
  group: C high-risk
  title: SURROGATE-ENERGY-DESCENT-C1 - does any attacker-evaluable statistic correlate with the hidden relation energy?
  mechanism: 'Search for an ATTACKER-EVALUABLE surrogate energy on relation configurations that correlates with the hidden lifted energy H, which would convert relation collection from needle-in-a-haystack into a descent. Three concrete surrogates: s1 = the integer lift of the Semaev residual S_6(x(P_i1),...,x(P_i5),x(R)) in F_p folded by min(u, p-u)/p; s2 = the Hamming weight of the binary expansion of x(sum_i v_i P_i + R); s3 = the RT-1476 serial-S3 backward-chaining hit count, i.e. the number of intermediate 3-sums whose x-coordinate lands in a fixed density-1/L target set.'
  fingerprint: 'object: the joint pair (H(v), s_j(v)) on the weight-5 sign sphere; ops: attacker-legal only - group additions, x-coordinate reads, F_p arithmetic, Semaev polynomial evaluation, serial-S3 chaining; hidden structure: any statistical coupling between an evaluable field-side quantity and the dlog-side circle distance; discarded: the dlog vector x, which the attacker never has; retained: the rank correlation between surrogate and hidden energy; relation-generation primitive: greedy / steepest descent on s_j over weight-preserving support-swap moves; compression primitive: none; rank mechanism: none; descent mechanism: surrogate-energy hill descent replacing exhaustive membership testing; dominant cost exponent: if |rho_Spearman| >= c > 0 persists in p, relation collection could fall from exhaustive membership testing toward a walk of length ~1/rho^2 per hit, attacking the alpha of RT-1476 (gate: alpha < 3/2); realistic expectation rho -> 0, hence no exponent.'
  prediction: '|rho_Spearman(H, s_j)| < 0.02 for all j in {1,2,3} at p ~ 2^20, with the 95% bootstrap CI containing 0, and |rho| strictly DECREASING across p in {2^20, 2^24, 2^28} - consistent with each surrogate being a pseudorandom function of the configuration. This is precisely the empirical content of barrier D2; C1 and D2 stand or fall together.'
