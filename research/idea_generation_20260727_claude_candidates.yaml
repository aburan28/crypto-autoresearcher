  title: 'Singularity analysis of the descent-tree generating function: the family''s only stage-4 entry'
  mechanism: Every catalogued transfer-operator candidate in this program was rejected in part for having NO descent stage (report85 A2/A3/B2/C2 all 'descent = none'; batch13 C2 'INCOMPLETE'). C2 aims the analytic machinery at the one stage never targeted. Model the m=5 rewriting individual-logarithm descent as a labelled combinatorial class; form the bivariate generating function F(z,u) counting descent nodes by depth and cost; locate the dominant singularity rho(u) by singularity analysis (Flajolet-Odlyzko transfer); read the descent cost exponent off rho. Then ask whether ANY admissible re-parametrization — rewriting arity, factor-base stratification, large-prime tolerance — moves rho.
  fingerprint: 'algebraic object: the descent tree of the m=5 rewriting for a target Q, as a labelled combinatorial class with a bivariate GF; public ops: rewrite a node as a sum of m lower-height points, test membership, recurse; hidden structure: the dominant singularity rho of the descent GF and its dependence on rewriting arity; info discarded: identity of intermediate points — only the height/level profile is kept; info retained: level sizes and per-node cost; relation primitive: unchanged; compression primitive: NONE; rank mechanism: n/a (this stage is post-linear-algebra); descent mechanism: THIS CANDIDATE''S ENTIRE SUBJECT — a branching-process descent with an analytically located dominant singularity; dominant cost exponent: descent cost ~ rho^{-depth}; the open question is whether rho can be moved.'
