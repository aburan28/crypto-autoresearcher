- uid: POLYCLONE:POLYCLONE-CENSUS-A1
  id: POLYCLONE-CENSUS-A1
  family: 'Algebraic CSP dichotomy: polymorphism / Maltsev / few-subpowers tractability of the factor-base decomposition constraint'
  family_key: POLYCLONE
  area: logic-and-proof-complexity
  group: A conservative
  title: Toy-scale computational census of the polymorphism clone Pol(Gamma_F) of the decomposition template
  mechanism: 'Directly compute, for concrete small ordinary prime-order E(F_p), all idempotent polymorphisms of arity <=4 of the template Gamma_F = (G; S_m, F) where G = E(F_p), S_m = {(P_1..P_m, R) : sum P_i = R} and F is a factor base, and decide computationally whether any non-projection weak near-unanimity (WNU) operation exists. This is the experimental arm of D1: it is a meter, not an engine, and it is the cheapest decisive test of the whole family. It exploits the fact that (by D1 Lemma 1) every polymorphism is Z/n-linear, so the search space collapses from |F|^(|F|^k) operation tables to n^(k-1) coefficient vectors, and further to an O(n|F|) scan per reference point.'
  fingerprint: 'algebraic object: the relational structure Gamma_F = (G; S_m, F) with G = E(F_p) of prime order n, viewed through the Inv-Pol Galois connection; public ops: EC group law, equality test, hash-table factor-base membership, CP/SAT search over candidate operation tables; hidden structure: the polymorphism clone Pol(Gamma_F) and its idempotent reduct; info discarded: the entire coordinate/polynomial representation of the curve (no Semaev polynomial, no Macaulay matrix, no Groebner basis is ever formed); info retained: only the abstract additive relation and the factor-base indicator predicate; relation primitive: NONE - census only, generatively empty by construction; compression primitive: none (measurement); rank mechanism: n/a; descent mechanism: n/a; dominant cost exponent: n/a (meter). Census cost after the linearity collapse is O(n|F|) per (F, reference point), i.e. ~2.6e5 group ops at n=4001, |F|=64.'
  prediction: 'For every ordinary prime-order E(F_p) tested and every factor base F with 2 <= |F| < n and O not in F, the only idempotent polymorphisms of Gamma_F are the projections. Equivalently: the only lambda in (Z/n)^k with sum lambda_j = 1 and lambda.F^k contained in F are the unit vectors. Consequently no WNU of any arity, no Taylor term, no Maltsev term, no cube/edge term, no near-unanimity term, and no bounded width. Secondary quantitative prediction: the number of nonzero lambda_1 in Z/n with lambda_1(F - P_0) contained in (F - P_0) is exactly 1 (namely lambda_1 = 1) for every random F of size >= 3.'
  minimal_test: 'p in {1009, 2003, 4001, 8009}; curves y^2 = x^3 + ax + b over F_p of prime order n, rejecting CM j in {0, 1728} and anomalous n = p; m in {3, 4}; factor bases F = the B points of smallest x-coordinate with O excluded, B in {8, 16, 32, 64}; arity k in {2, 3, 4}. ARM 1 (linear census, cheap): fix a reference P_0 in F; for each lambda_1 in Z/n test whether lambda_1(F - P_0) is contained in (F - P_0); report the stabiliser size. O(n|F|) = 2.6e5 ops at the largest cell. ARM 2 (brute force, closes the encoding gap): on the degenerate ''domain = F, single fixed Q'' encoding, exhaustively enumerate ALL binary operations on |F| = 3 (3^9 = 19683 tables) and all ternary operations on |F| = 2 (2^8 = 256 tables) against R_Q intersect F^m, and check whether any non-projection polymorphism exists that is not the restriction of a linear map on G. ARM 3: repeat ARM 1 with F chosen adversarially as an arithmetic progression {P_0 + iD} of length B, the most nearly coset-like factor base available in a prime-order group.'
  falsification: 'Falsified by exhibiting ANY (p, E, F, k) with 2 <= |F| < n and a non-projection idempotent polymorphism of Gamma_F - in particular any WNU. Also falsified if ARM 2 finds, on the domain-F encoding, a non-projection polymorphism of R_Q intersect F^m that additionally satisfies the WNU identities and is not the restriction of a Z/n-linear map: that would break D1 Lemma 1 in the one encoding where its proof does not directly apply. Also falsified if ARM 3 finds an arithmetic-progression factor base with a nontrivial stabiliser lambda_1 != 1 that is simultaneously part of an idempotent tuple with sum lambda_j = 1.'
  cost_accounting: 'CHARGES: none of the seven stages. This candidate is explicitly a meter and is generatively empty - it produces no relations, no compression and no exponent, exactly as report93''s COMM-METER-A2 was labelled. It is a precondition test for whether the family has any engine at all. OMITS: preprocessing, relation collection, linear algebra, target descent, verification, memory, multi-target accounting - all seven, and NO cost figure is claimed or implied for any of them. Its value is decisiveness per unit compute, not exponent movement.'
  dominant_exponent: n/a - measurement only; no exponent is claimed, and by construction none can be produced. Census compute is O(n|F|) per cell, i.e. polynomial in the toy parameters and irrelevant to the crypto-scale exponent.
  verdict: REJECTED-exponent-neutral
  killer_objection: 'Template-duplicate of HOLANT-C1 (idea_generation_20260718_batch3.md): a toy-scale computational census of which side of an ALGEBRAIC DICHOTOMY THEOREM the same m-term decomposition constraint falls on, with Bulatov-Zhuk substituted for Cai-Lu and the polymorphism clone for the matchgate signature - same object, same epistemic product, same toy scale, same predicted-hard outcome. Its substantive content (a factor base is not closed under nontrivial affine combinations) is the defining property of a factor base and is the corpus''s existing Kneser/Cauchy-Davenport prime-order primitive restated.'
- uid: POLYCLONE:CRA-EXPONENT-AUDIT-A2
  id: CRA-EXPONENT-AUDIT-A2
  family: 'Algebraic CSP dichotomy: polymorphism / Maltsev / few-subpowers tractability of the factor-base decomposition constraint'
  family_key: POLYCLONE
  area: logic-and-proof-complexity
  group: A conservative
  title: Conditional complete-cost audit of the Bulatov-Dalmau compact-representation relation engine
  mechanism: Grant, counterfactually, that a Maltsev or cube term exists on Gamma_F. Then the Bulatov-Dalmau compact-representation algorithm (and its few-subpowers generalisation, Idziak-Markovic-McKenzie-Valeriote-Willard) solves the per-trial decomposition in time polynomial in the arity m and the domain size |F|, using only a membership oracle for the constraint - which here is O(m) EC additions - and no Groebner basis, no Macaulay matrix, no first-fall degree and no elimination at all. Compute the resulting COMPLETE seven-stage index-calculus cost and determine whether it crosses rho. The purpose is to establish whether D1 is load-bearing or merely exponent-neutral hygiene.
  fingerprint: 'algebraic object: the Bulatov-Dalmau compact representation (a witness/signature set of O(m^2|F|^2) tuples generating the full B^(m-1)-size solution set under the Maltsev term); public ops: EC addition, hash-table membership, componentwise application of the ternary term x - y + z; hidden structure (hypothesised, and refuted by D1): a subalgebra structure on R_Q intersect F^m admitting a generating set of size poly(m, |F|); info discarded: the Semaev polynomial system in its entirety, and with it the entire first-fall-degree / D_reg cost driver that dominates every prior prime-field index-calculus lane; info retained: only the group law and the factor-base indicator - which is precisely why the route sidesteps the classical ''no subfield over F_p means no low-degree description of the factor base'' wall; relation primitive: one m-tuple emitted by the compact-representation ''next'' subroutine; compression primitive: the compact representation itself - poly(m, |F|) generators standing in for a relation of size |F|^(m-1); rank mechanism: standard sparse |F| x |F| relation matrix over Z/n with row weight m, solved by block Wiedemann; descent mechanism: the same compact-representation solve applied to the target-coupled point R = aP + bQ; dominant cost exponent: relation collection ~ m! |F|^3 = O(p^(3/m)) up to the m! constant, versus rho''s p^(1/2).'
  prediction: 'The conditional exponent DOES cross rho, so the barrier is load-bearing rather than exponent-neutral. Model (stated, not measured): with B = p^(1/m), a random point decomposes into m factor-base points with probability ~1/m!, so trials per relation ~ m!; relations needed ~ B; per-trial compact-representation cost ~ m^2 B^2. Relation collection ~ m! m^2 B^3 = m! m^2 p^(3/m). My arithmetic at p = 2^256: m = 7 gives B = 2^36.6, relation collection 5040 * 2^109.7 = 2^122.0 and memory m^2 B^2 = 2^78.6, versus rho 0.886 * 2^128 = 2^127.8 - a crossing by ~5.8 bits. m = 9 gives B = 2^28.4, relation collection 362880 * 2^85.3 = 2^103.8 and memory 2^63.2 - a decisive crossing. Prediction: the audit confirms crossing for all m >= 7 at p >= 2^160, and confirms that memory (m^2 B^2, the compact-representation store) not arithmetic is the binding secondary stage.'
  minimal_test: 'This is an arithmetic audit, not a wet experiment, and is falsified by an arithmetic or modelling error rather than by data. Concrete instantiation to be checked independently: (i) p = 2^256 with n prime, m in {5, 7, 9, 11}, B = ceil(p^(1/m)); tabulate all seven stages; (ii) verify the 1/m! decomposition probability empirically at toy scale (p in {1009, 4001}, m = 3, B = ceil(p^(1/3)) in {10, 16}, 10^4 random targets, seed-fixed) - predict observed decomposition rate within 20% of 1/3! = 0.167; (iii) verify that the compact-representation size bound O(m^2|F|^2) is the correct bound to charge by instantiating Bulatov-Dalmau on a genuine Maltsev toy template of comparable shape (a coset of a subgroup of a COMPOSITE-order group, e.g. Z/1024 with H of order 32, m = 3) and measuring the actual signature-set size against 9 * 32^2 = 9216.'
  falsification: Falsified if the seven-stage total, computed honestly, does NOT cross 0.886 sqrt(n) for any m at any p <= 2^521 - which would demote the whole family to exponent-neutral and make D1 uninteresting. Also falsified if the toy measurement of the decomposition rate departs from 1/m! by more than a factor 2 (the Gaudry-Diem heuristic would then be wrong at these sizes and the trial count is mis-charged). Also falsified if the compact-representation size on the genuine Maltsev toy template exceeds O(m^2|F|^2) - in which case the per-trial cost is mis-charged and the crossing may vanish.
  cost_accounting: 'CHARGES ALL SEVEN - that is the entire point of this candidate. (1) preprocessing: factor-base construction and hash build, O(B) = p^(1/m); (2) relation collection: m! m^2 B^3 = p^(3/m) up to the m! constant - dominant; (3) linear algebra: sparse block Wiedemann on a B x B matrix of row weight m, O(m B^2) = p^(2/m); (4) target descent: one further compact-representation solve on R = aP + bQ, p^(2/m); (5) verification: m EC additions per relation certificate, independently re-verified by the run wrapper per docs/claims-and-verification.md, negligible; (6) memory: B + m^2 B^2 = p^(2/m) words for the factor base plus the compact-representation store - the binding secondary stage; (7) multi-target: unchanged standard index-calculus amortisation, factor base and relation matrix reused across targets, no advice term so BAR-AMORT-D2 / Corrigan-Gibbs-Kogan ST^2 = Omega(eps N) is not triggered. OMITS: nothing. All figures above are MODEL ARITHMETIC from the stated model, not measurements, and are explicitly conditional on a hypothesis that D1 refutes.'
  dominant_exponent: 'Conditional: 3/m in log_p terms (relation collection), i.e. p^(3/m), crossing rho''s p^(1/2) for m >= 7. Unconditional: no exponent - the hypothesis is false by D1, so the true dominant exponent on this axis remains >= 1/2.'
  verdict: REJECTED-duplicate
  killer_objection: 'The same counterfactual audit is already banked at hypothesis_ledger.md Round 020 line 1010 under a strictly STRONGER grant - a FREE decomposition oracle, not merely a polynomial one: |FB| = n^{1/m} relations, sparse linear algebra alone ~ n^{2/m}, m=3 closed and m=4 pinned at the rho boundary. Stages 1/3/4/6 are re-derivations of banked arithmetic, and stage 2 (relation collection) and stage 4 (descent) are left uncharged despite the ''OMITS: nothing'' claim - the per-membership-test price is given but the NUMBER of queries is never bounded.'
