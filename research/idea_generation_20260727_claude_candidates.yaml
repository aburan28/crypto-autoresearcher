  mechanism: 'Prove that the ENTIRE proof-complexity lane — degree, width, rank, space, size, and now automatability — is structurally barrier-only for this target, via a dichotomy on the encoding plus a quantifier mismatch. DICHOTOMY: either you use the natural ALGEBRAIC encoding of m-point decomposition, which has n = m = O(1) variables and axiom degree Theta(L), in which case every proof-complexity theorem is vacuous (Impagliazzo–Pudlak–Sgall gives degree <= d_0 + O(sqrt(n log S)) = L + O(sqrt(log S)) when d_0 = L and n = 5 — no information); or you use a BOOLEAN/CNF encoding with many variables, in which case the theorems apply but the encoding translation loses the F_p arithmetic cost that alpha actually charges (the failure mode RESOLUTION-WIDTH-A3 already flagged for itself as ''may bound the wrong object => INCOMPLETE''). QUANTIFIER MISMATCH: automatability theory quantifies as ''poly(|F| + S_min)'' — its positive results give an unspecified polynomial that MULTIPLIES alpha, and its negative results (Resolution NP-hard to automate, Atserias–Muller; NS and PC NP-hard to automate, de Rezende–Goos–Nordstrom–Pitassi–Robere–Sokolov; Alekhnovich–Razborov non-automatability under FPT/W[P]) forbid polynomial-time search in a regime where our backends are ALREADY polynomial in L. Neither direction can distinguish L^{1.4} from L^{1.6}, which is the only distinction the target needs.'
