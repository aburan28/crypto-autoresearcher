- uid: AUTOMAT:C2
  id: FEASINTERP-COMPILER-C2
  family: Proof-search AUTOMATABILITY of the factor-base non-decomposition refutation (non-Groebner backends)
  family_key: AUTOMAT
  area: logic-and-proof-complexity
  group: C high-risk
  title: FEASINTERP-COMPILER-C2 — feasible interpolation as a proof-to-algorithm compiler for the membership predicate
  mechanism: 'Split the m = 5 decomposition system at an intermediate partial-sum variable u: block A(u; x_1,x_2) asserts u is the x-coordinate of P_{i1}+P_{i2} with x_1,x_2 in V, block B(u; x_3,x_4,x_5) asserts the point with x-coordinate u plus three factor-base points equals Q; the conjunction is unsatisfiable exactly when Q is not 5-decomposable, and u is the only shared variable. Feasible interpolation would then EXTRACT from any refutation a circuit on u deciding which block fails — i.e. it converts a proof-existence statement into an actual membership-decision algorithm whose size is poly(refutation size). Run in reverse it is a bridge: any lower bound on that separator circuit lower-bounds the refutation size.'
  fingerprint: 'algebraic object: the two-block split system A(u,x_1,x_2) and B(u,x_3,x_4,x_5) over F_p with shared variable u; public ops: NS/PC/IPS derivation, then interpolant extraction from the refutation; hidden structure: the presumed low complexity of the block-separator function on u; info discarded: the refutation''s internal derivation, retaining only the extracted circuit; info retained: the interpolant circuit computing the membership predicate; relation primitive: evaluate the interpolant per target to decide decomposability; compression primitive: the circuit''s size relative to the refutation''s size; rank mechanism: n/a; descent mechanism: inherited, unchanged; dominant cost exponent: log_L(interpolant circuit size), which upper-bounds alpha.'
  prediction: 'The extracted interpolant is the meet-in-the-middle table and nothing smaller: circuit size ~ L^{ceil(5/2)} = L^3, giving alpha ~ 3, far above the required 3/2 and above even the k = 7 relaxed requirement alpha < 5/2. Quantitatively I predict the extracted circuit at m = 4 (2+2 split) has size >= the L^2 MITM table size in every cell, i.e. compression ratio >= 1. Second prediction, on the bridge direction: because algebraic feasible interpolation for IPS is tied to hard algebraic circuit lower bounds (Grochow–Pitassi), the bridge cannot be discharged without resolving an open problem in algebraic complexity, so it yields no unconditional number either way.'
  minimal_test: 'm = 4 with a 2+2 split (so the MITM baseline is an explicit L^2 table and the interpolant is small enough to inspect); p = 4099 (replicate at 1009); L in {8,16}; N = 50 non-decomposable targets; construct the two-block system, compute a refutation at the minimal degree d* found by A1, attempt interpolant extraction, and measure the extracted circuit size (gate count) against the L^2 MITM table size. Seeds 20260727..20260729. Positive control: a two-block system with a known small monotone interpolant (e.g. a clique/colouring-style split) — extraction must produce the small circuit. Negative control: a two-block split with no shared structure (expect extraction failure or maximal size).'
