ting sweep, and D1 names its one live falsification route (a recognizable S with amortized-free membership AND rejection-free sampling). Two candidates (A1, A2) are cheap instruments that convert an existing recorded negative into positive barrier evidence. Honest novelty ceiling: D1 shares its moral with catalogued PERM-D2 ("measure-preserving bijection => no gain"), but in a different cost stage and on a different object; the prime-order invariant-subset argument and the subset-sampling identity are new content.'
