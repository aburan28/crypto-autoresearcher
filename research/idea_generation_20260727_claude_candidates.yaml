  mechanism: 'Prove that the family''s own dichotomy cannot change an exponent, whichever way it resolves, via a first-moment identity that holds for EVERY joint law of the field: E[#{j in W : N(j) >= 1}] = |W| * Pr[N >= 1] = |W| * delta_1, with no dependence on the covariance whatsoever. The covariance controls only the VARIANCE of the harvest count, hence only concentration — constants and polylogs — never the Theta(1/delta_1) scanned-index exponent. Both branches therefore fail, and they fail asymmetrically: the REM branch forces Theta(1/delta_1) independent trials, while the log-correlated branch leaves the SAME first-moment supply and ADDS a linear-algebra rank penalty (A2), so the branch the family hoped was the win is strictly the worse of the two. SUPPORTING LEG from extreme-value theory: even in the most favourable hierarchical model, correlation moves only the SUBLEADING term of the maximum — the Derrida REM maximum is a*n_scales while the branching-random-walk maximum is a*n_scales - (3/(2a))*log(n_scales) — and with n_scales = log_2 p the entire difference is O(log log p), a polylog(p) factor on the density of near-maximal sites, never an exponent.'
  fingerprint: 'algebraic object: ANY joint law of the count field (N(j)) over the index window — the barrier is law-level, not instance-level | public ops: irrelevant by design; the statement quantifies over all operations | hidden structure: NONE survives — the barrier asserts that second-order structure carries no exponent-bearing information | info discarded: the entire covariance structure, deliberately | info retained: the first moment delta_1 = Pr[N >= 1], which the corpus equidistribution lane has already pinned | relation primitive: unchanged | compression primitive: none can exist, and that is the content of the barrier | rank mechanism: correlation DEGRADES it (the A2 leg) | descent mechanism: untouched and explicitly out of scope | dominant cost exponent: T = Theta(1/delta_1), a covariance-invariant'
  prediction: 'No reorganization of relation collection that exploits ONLY the correlation structure of the decomposition-count field can lower the complete-cost exponent below 1/2. Concretely: for ANY sampling schedule sigma over indices, E[hits after T probes] = T*delta_1 unless sigma is adaptive on information not derivable from the field''s own past values — and adaptivity on the field''s past values is exactly the block-surrogate requirement that C1 tests and D2 forecloses. The barrier therefore predicts A1''s flat covariance AND predicts that a flat covariance would not have mattered even if it had been curved.'
  minimal_test: 'The barrier is established by construction, not by measurement, but its two empirical legs are each falsifiable at toy scale. LEG 1 (supply invariance): at p1 near 2^16, m=2, L = round(p^{0.4}) ~ 84, 5 ordinary prime-order curves, 5 seeds, measure hits-per-probe under sampling schedules of window width W'' in {L, 4L, 16L, 64L, n} — predicted identical across all five widths to within sampling noise, since E[hits] = T*delta_1 regardless of how the probes are clustered. LEG 2 (rank non-improvement): A2''s rank/L versus W'' measurement on the same instances — predicted flat on the real field and DECREASING in the planted-cluster control, i.e. clustering never improves rank yield. Together these two cheap measurements (< 1e7 operations total) instantiate the identity and its corollary on real curves rather than leaving them as assertions.'
  falsification: 'D1 is FALSIFIED by exhibiting an index-calculus variant whose complete-cost exponent drops as a function of the field''s covariance while delta_1 is held FIXED. Since E[hits] = T*delta_1 is an identity, such a variant must do one of exactly two things: (a) need fewer than Theta(L) independent relations, or (b) use an adaptive schedule powered by a block surrogate. I state plainly that routes (a) and (b) are NOT closed by D1 — they are the honest escape hatches — and are closed instead by the RT-1472/RT-1476 rank requirements and by D2/C1 respectively. SOFT JOINT, disclosed: the extreme-value supporting leg assumes the relation-density threshold N >= 1 sits ABOVE the freezing transition of the true hierarchical model, where GREM and REM free energies provably coincide; whether the relevant inverse temperature (set by the exponent 1 - m*ell) is above or below freezing depends on parameters and I have NOT established it. The first-moment identity does not depend on that leg and stands alone.'
  cost_accounting: CHARGES NOTHING — a barrier makes no cost claim, and any barrier presented with a cost figure should be distrusted. It CONSTRAINS one stage, RELATION COLLECTION (the Theta(1/delta_1) exponent), and TOUCHES a second, LINEAR ALGEBRA (the rank-yield leg). It says nothing whatsoever about preprocessing, target descent, verification, memory, or multi-target amortization, and must NOT be read as closing those — a barrier over-read is worse than no barrier.
  dominant_exponent: T = Theta(1/delta_1) = p^{1 - m*ell} is a covariance-invariant; the complete-cost exponent >= 1/2 is preserved against rho ~ 0.886*sqrt(n).
  verdict: REFUTED-RECORD-ABSENT-FROM-SNAPSHOT
  killer_objection: REFUTED in the run tally, but the adversarial verdict record (sub-label and reasoning) is ABSENT from the run snapshot this catalogue was built from. No killer objection is asserted for this candidate.
