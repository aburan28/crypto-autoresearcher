  cost_accounting: 'Charges NONE of the seven stages. Omits preprocessing, relation collection, linear algebra, target descent, verification, memory, and multi-target accounting - it is an instrument, not an attack. Stated explicitly: the meter''s own precondition (L discrete logs of factor-base points) is itself ECDLP-hard at crypto scale, so this measurement is permanently toy-only and can never be lifted into an attack cost model. By the corpus''s own ranking rule it scores 0 on criterion (iii) chance-of-changing-an-exponent, exactly like report93''s A2 COMM-METER.'
