<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260">
  <rect width="920" height="260" fill="#fff"/>
  <style>text{font:16px Helvetica,Arial,sans-serif;fill:#172333}.small{font-size:12px}.box{fill:#eef5fb;stroke:#315b78;stroke-width:2}.arrow{stroke:#315b78;stroke-width:2;fill:none;marker-end:url(#head)}</style>
  <defs><marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#315b78"/></marker></defs>
  <rect class="box" x="15" y="72" width="190" height="100" rx="8"/>
  <text x="30" y="102">Validated discovery</text><text class="small" x="30" y="125">8,206 arm receipts</text><text class="small" x="30" y="145">frozen selection</text>
  <rect class="box" x="250" y="72" width="190" height="100" rx="8"/>
  <text x="265" y="102">Fresh confirmation</text><text class="small" x="265" y="125">32,768 targets per arm</text><text class="small" x="265" y="145">up to 294 arms</text>
  <rect class="box" x="485" y="72" width="190" height="100" rx="8"/>
  <text x="500" y="102">Exact intervals</text><text class="small" x="500" y="125">2 tails per arm</text><text class="small" x="500" y="145">family coverage ≥99%</text>
  <rect class="box" x="720" y="72" width="185" height="100" rx="8"/>
  <text x="735" y="102">Finalists</text><text class="small" x="735" y="125">≤6 per stratum</text><text class="small" x="735" y="145">complete costs later</text>
  <path class="arrow" d="M205 122 H245"/><path class="arrow" d="M440 122 H480"/><path class="arrow" d="M675 122 H715"/>
  <text class="small" x="15" y="220">Candidate procedure only. The boxes show planned quotas and rules; no graph yield is plotted.</text>
</svg>
