<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">P29 same-conductor secondary controls</title>
  <desc id="desc">P29 E1 remains the primary graph endpoint. P29 E2 and E3 each receive native low-x and random-x base arms with 8192 targets using the shared P29 discovery coefficient stream. These controls do not select finalists.</desc>
  <rect width="960" height="390" fill="#fbfcfe"/>
  <text x="40" y="42" font-family="sans-serif" font-size="23" font-weight="700" fill="#142433">P29 same-conductor controls</text>
  <text x="40" y="70" font-family="sans-serif" font-size="14" fill="#53616d">Common field p = 320092037 · prime subgroup r = 320091991 · conductor factor 8209</text>
  <rect x="42" y="105" width="260" height="184" rx="14" fill="#eef4fa" stroke="#667788" stroke-width="2"/>
  <text x="66" y="140" font-family="sans-serif" font-size="18" font-weight="700" fill="#142433">P29-E1 · primary</text>
  <text x="66" y="170" font-family="sans-serif" font-size="14" fill="#33495c">Graph floor endpoint</text>
  <text x="66" y="203" font-family="sans-serif" font-size="13" fill="#53616d">Existing graph arms</text>
  <text x="66" y="226" font-family="sans-serif" font-size="13" fill="#53616d">low_x · mid_x · random_x</text>
  <text x="66" y="258" font-family="sans-serif" font-size="12" fill="#53616d">Native graph selection source</text>
  <rect x="350" y="105" width="260" height="184" rx="14" fill="#eef8f4" stroke="#28836c" stroke-width="2"/>
  <text x="374" y="140" font-family="sans-serif" font-size="18" font-weight="700" fill="#142433">P29-E2 · secondary</text>
  <text x="374" y="178" font-family="sans-serif" font-size="14" fill="#33495c">low_x · 8,192 targets</text>
  <text x="374" y="204" font-family="sans-serif" font-size="14" fill="#33495c">random_x · 8,192 targets</text>
  <text x="374" y="253" font-family="sans-serif" font-size="12" fill="#53616d">Shared (alpha,beta) sequence</text>
  <rect x="658" y="105" width="260" height="184" rx="14" fill="#fff6e9" stroke="#d18a28" stroke-width="2"/>
  <text x="682" y="140" font-family="sans-serif" font-size="18" font-weight="700" fill="#142433">P29-E3 · secondary</text>
  <text x="682" y="178" font-family="sans-serif" font-size="14" fill="#33495c">low_x · 8,192 targets</text>
  <text x="682" y="204" font-family="sans-serif" font-size="14" fill="#33495c">random_x · 8,192 targets</text>
  <text x="682" y="253" font-family="sans-serif" font-size="12" fill="#53616d">Shared (alpha,beta) sequence</text>
  <path d="M310 197 H340" stroke="#667788" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M618 197 H648" stroke="#667788" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="193" y="322" width="574" height="42" rx="10" fill="#f0efff" stroke="#7165ae"/>
  <text x="480" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#352d68">Controls describe same-conductor variation; E2/E3 cannot enter graph finalist selection</text>
</svg>
