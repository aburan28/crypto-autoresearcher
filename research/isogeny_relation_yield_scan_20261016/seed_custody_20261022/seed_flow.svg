<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="Separate base, target, and verifier roots in graph input preparation">
  <rect width="860" height="260" fill="#fff"/>
  <text x="24" y="32" font-family="sans-serif" font-size="21" font-weight="bold" fill="#142433">Three independent roots in scientific preparation</text>
  <rect x="24" y="64" width="160" height="54" rx="7" fill="#e7f2f6" stroke="#247ba0"/>
  <text x="41" y="96" font-family="sans-serif" font-size="15" fill="#142433">base root</text>
  <rect x="24" y="139" width="160" height="54" rx="7" fill="#e7f2f6" stroke="#247ba0"/>
  <text x="41" y="171" font-family="sans-serif" font-size="15" fill="#142433">target root</text>
  <rect x="24" y="214" width="160" height="40" rx="7" fill="#f8eddb" stroke="#c77a0a"/>
  <text x="41" y="239" font-family="sans-serif" font-size="15" fill="#142433">verifier root</text>
  <line x1="184" y1="91" x2="322" y2="91" stroke="#247ba0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="184" y1="166" x2="322" y2="166" stroke="#247ba0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="184" y1="234" x2="322" y2="234" stroke="#c77a0a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="337" y="96" font-family="sans-serif" font-size="15" fill="#142433">factor base</text>
  <text x="337" y="171" font-family="sans-serif" font-size="15" fill="#142433">(α, β) draws</text>
  <text x="337" y="239" font-family="sans-serif" font-size="15" fill="#142433">Q scalar</text>
  <line x1="474" y1="91" x2="604" y2="139" stroke="#53616d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="474" y1="166" x2="604" y2="151" stroke="#53616d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="474" y1="234" x2="604" y2="163" stroke="#53616d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="605" y="116" width="225" height="73" rx="7" fill="#edf4e5" stroke="#4e7f25"/>
  <text x="625" y="145" font-family="sans-serif" font-size="15" fill="#142433">prepared input + manifest</text>
  <text x="625" y="169" font-family="sans-serif" font-size="13" fill="#40574b">8,192 targets replayed</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#53616d"/></marker></defs>
</svg>
