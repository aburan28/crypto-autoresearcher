<svg xmlns="http://www.w3.org/2000/svg" width="990" height="280" viewBox="0 0 990 280" role="img" aria-label="Candidate discovery selector validates all arms, rejects incomplete runs, then nominates confirmation vertices">
<style>text{font:16px sans-serif;fill:#1a3147}.small{font-size:13px}.box{fill:#eff5fa;stroke:#52799b;stroke-width:2}.ok{fill:#e8f5e9;stroke:#4d8958;stroke-width:2}.stop{fill:#faeded;stroke:#bd6666;stroke-width:2}.arrow{fill:none;stroke:#516d82;stroke-width:2;marker-end:url(#head)}</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#516d82"/></marker></defs>
<text x="22" y="29" font-weight="bold">Post-discovery candidate selection: complete coverage required</text>
<rect class="box" x="22" y="75" width="205" height="100" rx="8"/><text x="39" y="105">Frozen inputs</text><text class="small" x="39" y="131">8,206-arm schedule</text><text class="small" x="39" y="153">plan + control-root hash</text>
<path class="arrow" d="M227 125 H276"/>
<rect class="box" x="277" y="75" width="220" height="100" rx="8"/><text x="294" y="105">Validate every arm</text><text class="small" x="294" y="131">receipts + paired targets</text><text class="small" x="294" y="153">curve + transport checks</text>
<path class="arrow" d="M497 125 H545"/>
<rect class="ok" x="546" y="75" width="210" height="100" rx="8"/><text x="563" y="105">Prespecified nomination</text><text class="small" x="563" y="131">top/bottom by base</text><text class="small" x="563" y="153">source + drawn controls</text>
<path class="arrow" d="M756 125 H804"/>
<rect class="ok" x="805" y="75" width="160" height="100" rx="8"/><text x="822" y="105">Fresh confirmation</text><text class="small" x="822" y="131">selected vertices</text><text class="small" x="822" y="153">3 main bases each</text>
<path class="arrow" d="M386 175 V214 H547"/>
<rect class="stop" x="548" y="199" width="265" height="46" rx="8"/><text class="small" x="564" y="227">Any missing or invalid arm: stop</text>
</svg>
