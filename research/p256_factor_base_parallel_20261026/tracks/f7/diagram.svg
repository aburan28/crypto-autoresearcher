 <text x="905" y="132" class="body">E: y^2=x^3-3x+b</text><text x="905" y="163" class="body">norm(pullback(P))=[2]P</text><text x="905" y="193" class="body">Both infinities map to O</text><text x="905" y="223" class="small">Published P-256 field and source subgroup</text>
 <text x="30" y="290" class="body">T is nonzero but norm(T)=O: matching norms cannot certify class equality.</text>
 <text x="30" y="323" class="body">Class arithmetic has separate infinity / principal-divisor controls; no plane-quartic or DLP solver claim.</text>
 <text x="30" y="356" class="small">Algorithm reference: Galbraith-Harrison-Mireles Morales, ANTS2008, Algorithms1-5. Exact scope: derivation.md.</text>
