 <text x="30" y="38" class="title">F7: balanced genus-two classes and the elliptic norm</text>
 <text x="30" y="66" class="small">Prospective pipeline, TASK-20261026-59f4c9. No second-pass observation panel has run.</text>
 <rect x="30" y="100" width="355" height="145" rx="8" class="box"/>
 <text x="50" y="132" class="body">C: w^2=z^6-3z^2+b</text><text x="50" y="163" class="body">Balanced triple (u,v,n)</text><text x="50" y="193" class="body">Two rational infinities retained</text><text x="50" y="223" class="small">Identity (1,0,1); difference class T=(1,0,2)</text>
