 <text x="480" y="132" class="body">pi(z,w)=(z^2,w)</text><text x="480" y="163" class="body">Root-free norm on triples</text><text x="480" y="193" class="body">Separate Fp2 support sums</text><text x="480" y="223" class="small">Multiplicity, Frobenius and principal controls</text>
 <path d="M810 173 H880" class="line"/><path d="M865 163 L880 173 L865 183" class="line"/>
