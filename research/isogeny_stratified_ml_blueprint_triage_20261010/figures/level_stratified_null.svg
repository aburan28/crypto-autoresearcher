<text x="100" y="570" font-size="10" text-anchor="start" font-weight="normal" fill="#444">A: d0 = Koblitz crater (one curve per class); d1, d2 = breadth-first distance from the crater along the recorded ell-walk (descending edges, ell | conductor f). n=16 is the only class with two floor levels (f = 3*31): depth-2 vs depth-1 Spearman rho = +0.025 (perm. p = 0.84);</text>
<text x="100" y="584" font-size="10" text-anchor="start" font-weight="normal" fill="#444">incremental R^2 of depth beyond |F|, |F|^2 for the relation rate = 0.0014 (perm. p = 0.36). B: grey = within-prime permutation null (mean to max; dashed = 95th percentile), 1,000 draws; controls: log2 r, log2 p, log2 cofactor, |Aut|, family;</text>
<text x="100" y="598" font-size="10" text-anchor="start" font-weight="normal" fill="#444">the gain of +2e-5 in R^2 on the automorphism arm is under 1 % of the post-control residual variance; the plain arm's gain is negative. Noise floor = mean per-curve SEM / mean over 24 rho seeds.</text>
