    ordinal: 1
    label: identity-order-factor-base-and-controls
    status: pending_not_executed
    role: generator_and_control
    predecessor: null
    argv_template:
      - p192_weighted_cm
      - preflight
      - --curve
      - p192
      - --sieve-bound
      - '65521'
      - --map-bound
      - '4093'
      - --large-prime-bound
      - '2147483647'
