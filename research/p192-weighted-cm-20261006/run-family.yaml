    advancement_gate: Independent certificate replay and directionally agreeing paired replication; otherwise the result remains preliminary or invalid.

family_stop_rules:
  - A failed preflight blocks every successor.
  - A census shell must be complete and verified before the next shell.
  - Resource exhaustion or unavailable implementation yields incomplete; it does not consume an outcome label as a scientific null.
  - Exactly these eight labels belong to version 1; canonical RUN ids are allocated and rechecked only at dispatch, and any additional run requires a new experiment version and decision.
