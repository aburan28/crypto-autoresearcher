sheriff_case:
  schema: sheriff.case/v1
  id: SHF-20261024-46b7da
  target: >-
    Published main of crypto-autoresearcher, crypto and cryptanalysis at the
    exact heads recorded by the deep all-repository sweep, with independent
    reviews of selected load-bearing joints. The remaining experiment/run
    inventory is explicitly not covered, not passed.
  prior: >-
    Saved in prior.md before reading the target: expected many kernel-checked
    conditional or finite statements without an archive execution proof,
    cost-scope limitations, and incomplete cross-repository claim coverage.
  supersedes_nothing: Previous cases and immutable experiment records remain unchanged.
  readers:
    - role: validator
      model: GPT-6
      joint: B2 STARK transition verifier and negative controls
      report: readers/stark-v2.yaml
    - role: validator
      model: GPT-6
      joint: B3 BINSTD Lean statement fidelity and controls
      report: readers/binstd-lean.yaml
    - role: red-team
      model: GPT-6
      joint: B5/B6 n83 raw cost, baseline and controls
      report: readers/n83-cost.yaml
  claims:
    - id: C1
      text: The 84 registered auto researcher formal targets are machine verified against their pinned source tree.
      location: formal/targets; docs/reports/2026-10-23-formal-target-inventory
      verdict: upheld_scoped
      scoped_to: >-
        All 84 exact target declarations built and passed the target axiom audit
        under the pinned Lean/Mathlib environment and byte-identical formal tree;
        independent semantic fidelity and historical execution are not certified.
      beats: {B3: pass, B7: pass, B8: not_covered}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/formal-sweep/receipt-audit.json
        - research/sheriff/SHF-20261024-46b7da/scripts/formal-sweep/main-source-equivalence.json
        - research/sheriff/SHF-20261024-46b7da/scripts/sheriff-formal-partial-manifest.json
        - research/sheriff/SHF-20261024-46b7da/scripts/exact-main-formal-build.json
      findings: []
    - id: C2
      text: The conditional BINSTD yield ceiling follows from N > 0, openHits = N and tauHits <= N.
      location: formal/CryptoResearch/Binstd/YieldCeiling.lean; knowledge/findings/KN-FIND-48f0ae.md
      verdict: upheld_scoped
      scoped_to: For the stated premises, 4 * tauHits < 5 * openHits; it says nothing about whether archived EC runs met those premises.
      beats: {B3: pass, B6: not_covered, B7: not_covered}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/readers/binstd-lean.yaml
        - research/sheriff/SHF-20261024-46b7da/scripts/binstd-lean/negative.out
      findings: []
    - id: C3
      text: Four archived BINSTD open arms each reached the recorded 40/40 observations.
      location: experiments/EXP-BINSTD-8bdf86; knowledge/findings/KN-FIND-48f0ae.md
      verdict: not_covered
      beats: {B3: pass, B6: not_covered, B7: not_covered}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/readers/binstd-lean.yaml
      findings: []
    - id: C4
      text: The archived BINSTD x17 factors multiply to X^17 + 1 over the binary polynomial ring.
      location: formal/CryptoResearch/Binstd/Factorization.lean
      verdict: upheld_scoped
      scoped_to: Product identity only; irreducibility and the claimed EC invariant-subspace classification are outside this theorem.
      beats: {B3: pass, B4: not_covered}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/binstd-lean/factor.out
      findings: []
    - id: C5
      text: The n83 stacked run measured a 3.2391 paired charged-cold wall-time ratio against its matched pP arm.
      location: cryptanalysis:experiments/koblitz-n83-stacked-20261016/README.md
      verdict: upheld_scoped
      scoped_to: One EPYC host class, 20 points and two rank seeds; factor-base construction excluded from both arms; no other-host or every-phase magnitude conclusion.
      beats: {B5: pass, B6: not_covered, B7: pass}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/readers/n83-cost.yaml
        - research/sheriff/SHF-20261024-46b7da/scripts/n83-cost/rederivation.json
        - research/sheriff/SHF-20261024-46b7da/scripts/n83-main-equivalence.json
      findings: [F-N83-CONTROL]
    - id: C6
      text: The n83 stack remains about 94 times more costly than matched rho on this host's charged-cold wall-time scale.
      location: cryptanalysis:experiments/koblitz-n83-stacked-20261016/README.md
      verdict: upheld_scoped
      scoped_to: This run's wall-time comparison, not a host-independent group-operation cost ordering or a complete factor-base charge.
      beats: {B5: pass, B6: not_covered, B7: pass}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/readers/n83-cost.yaml
        - research/sheriff/SHF-20261024-46b7da/scripts/n83-cost/rederivation.json
      findings: []
    - id: C7
      text: The educational stark_v2 verifier checks the documented degree-one transition examples exercised by its controls.
      location: crypto:src/zk/stark_v2.rs; crypto:README.md
      verdict: upheld_scoped
      scoped_to: Tested degree-one controls only; the unrestricted closure API admits out-of-contract non-polynomial transitions, and general soundness is not established.
      beats: {B2: not_covered}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/readers/stark-v2.yaml
        - research/sheriff/SHF-20261024-46b7da/scripts/stark-v2-main-equivalence.json
      findings: [F-STARK-API]
    - id: C8
      text: Current cryptanalysis Lean receipt source hashes match the exact published tree.
      location: cryptanalysis:lean; cryptanalysis:tools/audit_lean_evidence.py
      verdict: upheld_scoped
      scoped_to: All 14 checked receipt-source hashes and metadata hygiene match; orbit and nearest-selector proof chains were separately rebuilt and axiom-inspected, but no claim about all 94 Lean files' semantic fidelity follows.
      beats: {B3: not_covered, B7: pass}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/cryptanalysis-lean-evidence-audit.json
        - research/sheriff/SHF-20261024-46b7da/scripts/cryptanalysis-orbit-lean-check.json
        - research/sheriff/SHF-20261024-46b7da/scripts/cryptanalysis-nearest-lean-rebuild.json
        - research/sheriff/SHF-20261024-46b7da/scripts/cryptanalysis-lean-main-equivalence.json
        - research/sheriff/SHF-20261024-46b7da/scripts/cryptanalysis-lean-orbit-audit/receipt.json
        - research/sheriff/SHF-20261024-46b7da/scripts/cryptanalysis-lean-selector-audit/receipt.json
      findings: []
    - id: C9
      text: The deep sheriff ecbench session checker directly verifies every committed ecbench.session/v1 directory.
      location: tools/sheriff.py:ecbench_sessions_check; docs/sheriff.md
      verdict: broken
      beats: {B7: fail}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-compressed-archive-enoent.strace
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-decompressed-smoke-receipt.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-later-v2/summary.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-earlier-v2/classification.json
      findings: [F-ECBENCH-INPUT]
    - id: C10
      text: The deep sheriff cryptanalysis Lean gate entries execute their named checks on the published tree.
      location: tools/sheriff.py:CHECKERS; cryptanalysis:tools/lean
      verdict: broken
      beats: {B3: fail, B7: pass}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/sweep.json
        - research/sheriff/SHF-20261024-46b7da/scripts/cryptanalysis-lean-checker-drift.json
      findings: [F-SHERIFF-LEAN-PATH]
    - id: C11
      text: The sheriff deep sweep leaves its audited published worktree unchanged.
      location: tools/sheriff.py:sweep; tools/verify_formal_targets.py
      verdict: broken
      beats: {B3: fail, B7: fail}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/sweep.json
        - research/sheriff/SHF-20261024-46b7da/scripts/formal-timeout-side-effect.json
        - research/sheriff/SHF-20261024-46b7da/scripts/formal-timeout-generated-target-audit.lean
      findings: [F-SHERIFF-FORMAL-TEMP]
    - id: C12
      text: The indexed cryptanalysis factor-base archive verifies its declared contents and hashes.
      location: cryptanalysis:experiments/fb-archive/README.md; cryptanalysis:experiments/fb-archive/index.csv
      verdict: upheld_scoped
      scoped_to: >-
        At the pinned cryptanalysis head, the archive verifier returned
        2,681 archives and zero problems with NumPy 1.26.4 supplied. This
        checks indexed archive contents; citation coverage is a separate
        refs.py gate.
      beats: {B7: pass}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/fb-archive-environment-recheck.json
        - research/sheriff/SHF-20261024-46b7da/scripts/fb-archive-recheck.stdout
      findings: []
    - id: C13
      text: Every factor-base digest cited by committed cryptanalysis results is indexed in the archive or declared on the closed unarchived debt list.
      location: cryptanalysis:experiments/fb-archive/refs.py; cryptanalysis:experiments/fb-archive/README.md
      verdict: broken
      beats: {B7: fail}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/fb-refs-recheck.json
        - research/sheriff/SHF-20261024-46b7da/scripts/fb-refs-recheck.stdout
      findings: [F-FBREF-NEW32]
    - id: C14
      text: Every committed complete ecbench session contains the inputs needed for direct source-bound integrity verification.
      location: crypto:research/gaudry_quartic_d4_char2_20261015/pilot; crypto:research/gaudry_quartic_d4_cost_20261014/pilot
      verdict: broken
      beats: {B7: fail}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-earlier-v2/classification.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-earlier-v2/summary.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-earlier-v2/missing-inputs-git-tree.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-missing-input-candidates/audit.json
      findings: [F-ECBENCH-ARCHIVE-INPUT]
    - id: C15
      text: Every ecbench session counted as a complete integrity pass in the first aggregate declared a complete run.
      location: research/sheriff/SHF-20261024-46b7da/scripts/ecbench-earlier-v2/classification.json; research/sheriff/SHF-20261024-46b7da/scripts/ecbench-later-v2/summary.json
      verdict: broken
      beats: {B7: fail}
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-status-correction.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-status-correction.py
      findings: [F-ECBENCH-STATUS]
  findings:
    - id: F-ECBENCH-STATUS
      beat: B7
      severity: major
      claim_ids: [C15]
      what: >-
        The first 603-pass aggregate counted 13 sessions whose immutable
        session_status is interrupted. Their retained records passed bound
        integrity checks, but that does not establish the planned runs
        completed. Reclassification of all 617 source-bound receipts yields
        590 complete-status bound integrity passes, 13 interrupted-status
        bound integrity passes, ten interrupted unbound archives, and four
        declared-complete pilots missing required source inputs. No original
        receipt or run record was changed.
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-status-correction.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-status-correction.py
      fix: >-
        Keep completion status distinct from record binding in aggregate
        reports, exclude interrupted sessions from completed-run performance
        claims, and only supersede earlier aggregate wording with a
        source-hashed reclassification. Preserve every original receipt.
    - id: F-ECBENCH-ARCHIVE-INPUT
      beat: B7
      severity: minor
      claim_ids: [C14]
      what: >-
        Four committed two-record scratch pilot sessions declare status
        complete but have neither local spec.json nor host.json. Their
        session.json files bind hashes for those inputs, yet the files are
        absent from each session directory at the pinned crypto head. Tracked
        scratch-spec files reproduce all four canonical spec IDs and hashes,
        but no exact host bytes were found among 717 tracked host-named JSON
        candidates. The independent replay still cannot verify the host class.
        This is an archive custody gap, not an
        independent refutation of the one or two recorded outputs per session.
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-earlier-v2/classification.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-earlier-v2/summary.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-earlier-v2/missing-inputs-git-tree.json
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-missing-input-candidates/audit.json
      fix: >-
        Preserve the four canonical-hash-matching scratch spec candidates in
        a corrected archive, recover the exact host bytes matching each
        session.json hash, then rerun the source-bound audit. Do not synthesize
        host replacements or promote these scratch records to completed
        performance evidence before that check.
    - id: F-FBREF-NEW32
      beat: B7
      severity: major
      claim_ids: [C13]
      what: >-
        At the pinned cryptanalysis head, 32 distinct factor-base or
        point-set digests cited by committed results are neither indexed
        archives nor entries in unarchived.csv. The reference checker exits
        1 after scanning 3,494 cited digests; 3,457 are archived and five
        are declared debt. This is a custody and coverage failure, not an
        independent refutation of the associated numerical results.
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/fb-refs-recheck.json
        - research/sheriff/SHF-20261024-46b7da/scripts/fb-refs-recheck.stdout
      fix: >-
        For each digest, independently identify the exact source point set
        and archive it with its content checks. If a cited field is not a
        factor-base or point-set digest, correct the claim through a
        source-bound supersession after review. Keep the existing closed
        unarchived debt list prune-only.
    - id: F-SHERIFF-FORMAL-TEMP
      beat: B7
      severity: minor
      claim_ids: [C11]
      what: >-
        The formal target checker timed out and left an untracked generated
        TargetAudit Lean file in the published-main worktree. The sweep
        correctly detected a worktree change. No tracked source changed;
        the exact generated file was preserved in this case and cleaned from
        the worktree after the sweep.
      evidence:
        - research/sheriff/SHF-20261024-46b7da/sweep.json
        - research/sheriff/SHF-20261024-46b7da/scripts/formal-timeout-side-effect.json
      fix: >-
        Create target audit files under the checker's scratch directory and
        remove them on timeout as well as normal completion.
    - id: F-SHERIFF-LEAN-PATH
      beat: B3
      severity: major
      claim_ids: [C10]
      what: >-
        Two configured cryptanalysis Lean checker commands point to shell
        scripts absent from the exact published tree. Both exit 127. Those
        entries provide no hosted Lean verdict, and their failure is not a
        theorem counterexample.
      evidence:
        - research/sheriff/SHF-20261024-46b7da/sweep.json
        - research/sheriff/SHF-20261024-46b7da/scripts/cryptanalysis-lean-checker-drift.json
      fix: >-
        Replace stale commands with the current source-bound cryptanalysis
        Lean projects and receipt audit, then run an expected-pass and
        expected-fail control on the configured gate.
    - id: F-ECBENCH-INPUT
      beat: B7
      severity: major
      claim_ids: [C9]
      what: >-
        The sheriff checker passes tracked gzip-only session directories to
        ecbench verify without expanding plan.json.gz and records.jsonl.gz.
        ecbench opens the uncompressed names and exits with ENOENT. A temporary
        decompressed copy of the same tracked files passes 528/528 records.
        This is checker input drift, not an invalid archive verdict.
      evidence:
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-compressed-archive-enoent.strace
        - research/sheriff/SHF-20261024-46b7da/scripts/ecbench-decompressed-smoke-receipt.json
      fix: >-
        Normalize gzip-only archives in a temporary directory, retain hashes
        of original tracked compressed bytes, and run ecbench verify on that
        copy without writing untracked files to the published worktree.
    - id: F-N83-CONTROL
      beat: B6
      severity: major
      claim_ids: [C5]
      what: >-
        The planted work control exercises the cold cSX arm but not the rank
        stage where most measured wall-time is saved. The two-rank-seed interval
        cannot be generalized to new seeds or host classes from these data.
      evidence:
        - research/sheriff/SHF-20261024-46b7da/readers/n83-cost.yaml
      fix: >-
        Run a preregistered same-path planted rank-stage control and independent
        rank-seed and host-class replications with the same matched arms and raw
        stdout custody; report the resulting interval at its measured scope.
    - id: F-STARK-API
      beat: B2
      severity: minor
      claim_ids: [C7]
      what: >-
        The public transition closure interface permits a non-polynomial AIR
        that violates the documented degree-one precondition and can yield an
        accepted proof of a false statement. The degree-one negative controls
        reject, so this finding does not claim a supported-case break.
      evidence:
        - research/sheriff/SHF-20261024-46b7da/readers/stark-v2.yaml
        - research/sheriff/SHF-20261024-46b7da/scripts/stark-v2/sheriff-b2-closure-control.stdout
      fix: >-
        Encode supported transitions as checked degree-bounded polynomial
        coefficients or a bounded AST and bind that representation to the
        transcript; reject unsupported closures at the public boundary.
