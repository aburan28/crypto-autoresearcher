findings:
  - id: B2-closure-precondition
    severity: major
    suggested_verdict: broken
    applies_to: "Public unrestricted AirV2 transition-closure verification, if used as proof of arbitrary closure AIR."
    evidence: "At boundary row 0 value 1, false transition C(a,b)=b-2a+1 only for (a,b)=(1,2), otherwise b-2a. For a=1 no canonical b satisfies C=0: b=2 is the sole zero of b-2 and is changed to 1. Yet a proof for this false statement is accepted. The closure matches the honest affine transition at all fixed fingerprint probes and on queried coset pairs."
    scope_limit: "The mutant is non-polynomial and violates the explicit degree-1 transition precondition in stark_v2 module docs; it does not break the documented degree-1 case."
    cause: "AirV2.transition is an unrestricted public closure. Its claimed degree is not enforced, and a finite-point fingerprint cannot bind arbitrary closures."
    suggested_fix: "Represent transition constraints as validated degree-bounded polynomial coefficients or an authenticated AST, and bind the exact representation into the transcript. Reject unsupported closure constraints."
