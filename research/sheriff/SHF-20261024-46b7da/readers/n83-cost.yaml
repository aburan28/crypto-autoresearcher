findings:
  - id: B5-F1
    severity: major
    state: confirmed
    what: "The literal every-phase cold total is unknown because factor-base construction is omitted from both arms. The published 3.2391 is valid for the charged rank+setup+online boundary. It upper-bounds the every-phase ratio only if the unmeasured construction cost is the same nonnegative X in both arms, as the shared K600 base policy suggests. The replay's X=427.524 ms came from another host class and does not create a same-host every-phase measurement."
    evidence: "cryptanalysis:AGENTS.md lines 516-536; stacked protocol.json arms cP/cS and online.base/base_hash, lines 250-255; stacked README.md Disclosures; raw timing calculation above."
  - id: B5-F2
    severity: minor
    state: confirmed
    what: "The old dashboard setup value 0.8856 excluded the rank stage while B's setup included it; that apparent 37-fold setup drop was accounting. Published main corrects the stack's comparable setup S to 9.6673. The actual 3.2391 paired cold difference is an engineering improvement against then-current pP, and the stack is now an Other verified record rather than the current n=83 baseline."
    evidence: "cryptanalysis:docs/ic/BASELINES.md lines 385-420 and 585; cryptanalysis:docs/ic/baselines.json corrections."
  - id: B6-F1
    severity: major
    state: not_covered
    what: "The frozen positive control only plants work in the cold cSX arm. No planted rank arm checks the detector on the rank-stage path, which accounts for approximately 612 of 635 seconds saved. This is missing sheriff B6 same-path positive-control coverage, not a failure of the protocol's stated control gate."
    evidence: "stacked protocol.json lines 32-37, 117-120, 152-157; frozen A/A and planted outputs above."
  - id: B6-F2
    severity: major
    state: confirmed_limitation
    what: "The primary interval resamples sequential deterministic attempts inside only two independent rank seeds per arm. It describes the frozen blocks and within-block attempt variation; it does not establish a 95% interval over new rank seeds or host classes. The rank K1 replay on Intel did not repeat the cold panel."
    evidence: "stacked protocol.json lines 159-170 and 306-307; stacked README.md Limits and Replay result; raw K1/K2 ratios above."
  - id: B5-F3
    severity: minor
    state: confirmed_limitation
    what: "The later counted run supplies the 0/0.1/1 GAE model for the stacked row, not the current rank-finder baseline. Counter-source semantic completeness was not independently audited here. Its arithmetic shows no robust IC-versus-rho ranking across the band."
    evidence: "cryptanalysis:experiments/koblitz-n83-opcounts-20261023/PROTOCOL.md; counted raw rows and pricing output above."

