checks:
  - id: B3.1-build
    what: lake build / lean4checker / per-theorem #print axioms
    command: none (no Lean toolchain in this reader; installing was forbidden)
    result: not_covered
    note: >-
      Session builds separately. Minimal-build hint: Semaev/BooleanParityFiniteCertificate
      and Semaev/FiniteEquationSemantics import only Init, and
      Endosweep/DkExactBatch4 needs only Discriminant -> NistCertificates -> DkExact
      (no Mathlib). Those three can be checked with bare `lean` before the Mathlib cache.
      Mathlib-name/tactic risks worth watching in the build log (not soundness issues):
      `Matrix.IsPivotedBy` / `IsPivotedBy.rank_eq` (Semaev rank certs), the `push Not`
      tactic (NCP/Reachability, Semaev/Filtration), `Matrix.isUnit_det_of_left_inverse`,
      `Polynomial.sup_ker_aeval_eq_ker_aeval_mul_of_coprime`.
  - id: B3.2-holes-and-escapes
    command: python3 -I scripts/readers/lean/scan_and_targets.py <repo> scripts/readers/lean/modules.txt
    output: scripts/readers/lean/scan_and_targets.out.json
    result: pass
    detail: >-
      Comment- and string-aware scan of all 20 files: zero hits for sorry, admit,
      axiom, native_decide, ofReduceBool/trustCompiler, implemented_by, @[extern],
      unsafe, #exit, skipKernelTC, `decide := true`, opaque, csimp,
      macro/elab/syntax/initialize/run_cmd, Lean.Elab/Lean.Meta, attribute[...],
      open Classical/propDecidable. No metaprogramming that adds declarations.
      Kernel computation is `decide` (Init `Decidable` evaluation, re-checked by the
      kernel) and `decide +kernel` (DkExactBatch4, kernel-only; no ofReduceBool).
      set_option lines: maxRecDepth 4000 (QuotientMatrices), maxHeartbeats 1000000
      (QuotientMatrixKernels), maxRecDepth 1000000 + maxHeartbeats 0 (four Semaev
      files). These raise resource limits and do not weaken kernel checking. The
      eval file has two `#eval` lines and no declarations.
  - id: B3.3-namespace-and-targets
    command: same script
    result: pass
    detail: >-
      Every declaration in the 19 modules sits under a `CryptoResearch.*` namespace
      (nested namespaces one/two/three/FiniteSemaev included), so `#audit_project`
      can reach them once tools/rebuild_formal_root.py adds them to the untracked,
      generated root. Each of the 21 target yamls names a theorem that is declared,
      public, and under the stated fully qualified name in the stated file. Every new
      module is named by at least one target. Audit-coverage notes: `#audit_project`
      skips `_private` names and non-theorem constants directly, but collectAxioms
      follows dependencies from the public theorems (all private lemmas here are used
      by public theorems; instances are reached through theorem types). The eval file is
      outside the lake workspace and unaudited; it declares nothing.
  - id: B3.4-fidelity-and-constants
    result: pass_with_findings
    recomputations:
      semaev:
        command: python3 -I scripts/readers/lean/semaev_recheck.py <repo>
        output: scripts/readers/lean/semaev_recheck.out.json
        results:
          - "Blind derivation: the ANF (Moebius transform) of each polynomial-basis bit of S3(x1,x2,1)=e2^2+e3+1 over F2[X]/(X^4+X+1), x1=sum u_i b_i, x2=sum w_i b_i, b=[9,3,2,12], gives exactly the four Lean `equations` lists. Because Boolean functions have unique squarefree ANF, this extensional identity is also an identity in the Boolean ring, which is more than the report claims."
          - "a6=1 and x_R=1 match the historical curve model (a2=a6=1, draws.json curve_model) and the draw record (seed 32201, xR 1, basis [9,3,2,12]). draws.json equations == Lean equations. sha256(compact JSON of equations) = 89ab8e66...a6eb, the hash quoted in the Lean headers and targets."
          - "XOR semantics: rows(D) lengths 16/17/28/80 for D=0..3; ranks 0/1/11/53; degree-D projected ranks 0/1/10/41; integer new_falls(1,2,3) = 0, 0, 1, so the Nat subtractions in newFalls/semanticNoFallTwo/semanticOneNewFallThree never truncate."
          - "Filtration reading computed directly rather than as a rank difference: rows3 have no support above degree 3; rows1 is a sublist of rows2 and rows2 of rows3; dim(V2 ∩ R<=1) = 1 = dim V1 with V1 inside it; dim(V3 ∩ R<=2) = 12; V2 inside it; explicit new vector outside V2: monomial masks [2,4,9,10,12,16,17,18,20,24,32,40,48,64,65,192]."
          - "Archived OR semantics: ranks 1/11/59, projected 1/10/41, new_falls(3) = 7, first fall still degree 3 (matches report line 85-86). OR-vs-XOR witness masks [1,17,129]; the OR product disagrees with f*u0 on 64 of 256 assignments and the XOR product on 0."
          - "All five literal row lists (one, two, twoProjected, three, threeProjected) equal my independently generated rows. Every elimination certificate has V*U = I over F2. U*A has its pivot at the lowest set column, strictly increasing, with zero rows last, and pivot count = rank (1, 11, 10, 53, 41). Erows = U*A for both degree-three certificates."
          - "Definition fidelity: Lean `rows D` (all 256 multiplier monomials, include iff the product has actual Boolean degree <= D) and newFalls(D) = rank - projRank - rank(D-1) are the historical ffd_semaev_core.fall_profile rule (lowdim = dim(V_D ∩ R<=D-1), new_falls = lowdim - dim V_{D-1}) with only the set-OR product replaced by XOR cancellation."
      frob:
        command: sage scripts/readers/lean/frob_recheck.sage <repo>
        output: scripts/readers/lean/frob_recheck.out.json
        results:
          - "The moduli z^5+2z^4+1 / GF(11), z^5+8z^4+1 / GF(13) and z^5+3z^4+1 / GF(19) are irreducible (not proved in Lean; the record says so). The three 5x5 matrices equal the coefficients of X^(qj) mod m. All 12 quotient/remainder identities hold, with remainder degree < 5."
          - "M^5 = I and M != I. T = 1+M+...+M^4 has the stated first row in each cell, zero elsewhere, rank 1 and kernel dimension 4. T's row 0 equals the field traces Tr(z^j) of GF(q^5)/GF(q), so T = embedded trace."
          - "Nontrivial factors of X^5-1: q11 X+2, X+6, X+7, X+8; q13 the cyclotomic quartic (irreducible); q19 X^2+5X+1 and X^2+15X+1 (irreducible). Factor-kernel dims are 1,1,1,1 / 4 / 2,2; the sums are direct and equal ker T. The fixed space ker(M-I) = constants, meeting ker T trivially."
          - "FactorKernel constants: p19*q19 = h19, the Bezout witness (11+2X)p19+(9+17X)q19 = 1, (X+2)(X+6)(X+7)(X+8) = Phi5 mod 11, ord_5(13) = 4, ord_5(19) = 2. CharacteristicFive: (X-1)^5 = X^5-1 and (X-1)^4 = Phi5 mod 5; X^5-1 is not squarefree."
          - "NullCurveOrder: recomputed Hasse intervals for q^5 equal the Lean bounds. Each interval holds exactly one multiple of the divisor, and it is the stated order. Sage point counts of y^2 = x^3+(z+a)x+(z+b) over GF(q^5) with the C5 moduli give 160644, 370778, 370420, 2475000 and 2476660. These satisfy all three hypotheses of each conditional theorem, so the theorems are non-vacuous on the real curves."
      dk_batch4:
        command: sage scripts/readers/lean/dk_batch4_recheck.sage <repo>
        output: scripts/readers/lean/dk_batch4_recheck.out.json
        results:
          - "All seven DkCert.Holds conjuncts were re-implemented with Lean Int emod/ediv semantics: q+1-t = h*n, t^2-4q = DK*f^2, factor product, odd-exponent filter = oddPrimes, Nodup, the DK = -s / -4s construction, IsDisc, minNonscalarDegree = deg, the 2^L bounds and deg >= 2^(L-2). All are true for all 7 curves. Small primes pass trial division and are < 1e8; large primes are >= 1e8."
          - "The only explicit hypothesis is discharged independently: every `largePrimes` entry and every factor is prime by PARI isprime, so D_K is fundamental (from the proved factorisation; no factoring was needed). exact_discriminants bounds |D_K| >= 2^385 and deg >= 2^383 hold."
          - "Data: every field equals research/endosweep_dk_exact_batch4_20261022/dk_exact.json. p matches 2^384-317, 2^414-17, 2^511-187, 2^512-569 and 2^521-1 for the five curves whose formula I know (ed-510-mont and mnt4_753 p not checked against a formula). |t| <= 2 sqrt(p). p and n pass BPSW (Lean claims neither)."
      binstd_ncp:
        command: python3 -I scripts/readers/lean/binstd_ncp_recheck.py <repo>
        output: scripts/readers/lean/binstd_ncp_recheck.out.json
        results:
          - "3*313*471 over GF(2)[X] = 2^17+1. The bitmasks decode to the Lean polynomials, and both degree-8 factors are irreducible (true; not claimed by Lean). Both admissible-phi-dims.json files have sha256 6f09e6c6...0e74 as the target notes say."
          - "Brute force over all targets, hits <= 59 finds no counterexample to saturated_open_below_band. The four Lean pairs (16,40),(40,40),(20,40),(40,40) equal the yield-matrix.json hits_tau/hits_open, with target_count 40, in panel order."
          - "NCP: 3000 random (B<=3, n<=30, |w|<=9) trials agree with the affine normal form under the leftmost-first action. Exhaustive words for B=0..3 up to d=7/7/6/5 (29 (B,d) cases) reproduce exactly the shadow set given by |a|_1 + m(e,a) <= d."
  - id: B3.4b-pinning
    command: python3 -I scripts/readers/lean/pinning_check.py <repo> scripts/readers/lean/scan_and_targets.out.json
    output: scripts/readers/lean/pinning_check.out.json
    result: pass_with_findings
    detail: >-
      17 of 19 modules (and the eval file) have at least one committed receipt
      containing their current source sha256. DkExactBatch4.lean (6137075074ca...beb92)
      and OrderFive.lean (828f172ea6b9...c8170a) have no committed receipt anywhere in
      the repository containing their current hash (see F3). Each file has a single
      commit, so no post-verification edit is indicated.
  - id: B3.5-proves-too-much
    command: python3 -I scripts/readers/lean/mutation_controls.py <repo>; frob_recheck.sage; binstd_ncp_recheck.py
    outputs: [scripts/readers/lean/mutation_controls.out.json, scripts/readers/lean/frob_recheck.out.json, scripts/readers/lean/binstd_ncp_recheck.out.json]
    result: pass_with_findings
    controls:
      - theorem: CryptoResearch.Semaev.BooleanParityFiltrationCertificate.FiniteSemaev.existsNewLowDegreeVector (with semanticOneNewFallThree, exact_first_fall_at_three)
        false_variant: "∃ v ∈ V2 ∩ R<=1, v ∉ V1 (a fall already at degree 2)."
        why_proof_fails: >-
          The proof's only non-generic step is `omega` on finrank(lowDegreePart) = 12
          versus finrank(V_prev) = 11. At degree 2 the certified ranks give 1 versus 1
          (recomputed directly: dim(V2∩R<=1) = 1 = dim V1, V1 ⊆ V2∩R<=1), so the
          contradiction cannot be derived. Mutating any one monomial of any input equation
          also breaks `literalRows_eq` (kernel `decide` on rows) and
          FiniteEquationSemantics (ANF uniqueness; all four one-monomial drops fail the
          256-point identity in mutation_controls.out.json).
      - theorem: CryptoResearch.Endosweep.DkExactBatch4.exact_discriminants
        false_variant: "One-digit change in q, t, n, DK, deg or s; largest factor +2; or L+1, for each of the 7 curves."
        why_proof_fails: >-
          My re-implementation of DkCert.Holds evaluates to false for all 56 mutants, so
          `decide +kernel` would reduce `Decidable.decide Holds` to `false` and the
          certificate theorem fails. This agrees with the README's two producer negative
          controls.
      - theorem: CryptoResearch.FrobTrace.NullCurveOrder.all_five_unique
        false_variant: "Replace each point-order divisor by its largest proper divisor that admits >1 multiple in the Hasse interval (33, 134, 5, 4125, 5)."
        why_proof_fails: >-
          Several multiples then lie in [lo,hi], so the conclusion is false and `omega`
          (complete for linear Nat arithmetic) cannot close it.
      - theorem: CryptoResearch.FrobTrace.QuotientMatrixKernels.all_matrix_C5_controls
        false_variant: "Same statement with frobeniusMatrix_q replaced by the identity, the zero matrix or a random matrix."
        why_proof_fails: >-
          PARTIAL. The three q*MatrixFactorClaim conjuncts stay TRUE for identity, zero
          and random matrices (Sage), and their Lean proofs (`FactorKernel.q11_kernel_direct_sum _`,
          `q19_kernel_direct_sum _`, `congrArg ker (h13_aeval _)`) carry no hypothesis on F.
          They would prove the variant (finding F2). The dimension-4 conjuncts and
          M^5 = I do fail on a random matrix (ker T dim 0), so the matrix-specific
          content is real but narrower than the factor-kernel wording suggests.
      - theorem: CryptoResearch.NCP.shadow_reachable_iff
        false_variant: "penalty 1 instead of 2 for e=+1 with a negative coordinate; or the left-negation sign convention."
        why_proof_fails: >-
          Brute force: e=+1, a=(-1), d=2 is unreachable (shortest word v t v has length 3).
          The left-convention signed count differs on [t,t,v]. The lower-bound lemma
          `shadow_length_lower` derives `2 <= negCount` from even parity plus a negative
          coordinate, which a penalty-1 variant cannot use to reach `omega` the other way.
      - theorem: CryptoResearch.Binstd.YieldCeiling.saturated_open_below_band
        false_variant: "Drop open_saturated."
        why_proof_fails: "Counterexample targets=1, open=0, tau=0 gives 0 < 0, false; omega fails."
  - id: B3.5b-closed-computation-as-general
    result: pass
    detail: >-
      Every closed `decide`/`omega` certificate (archived_counts_below_band, the five
      NullCurveOrder cases, the seven DK curves, three FROB matrices, the one Semaev
      draw) is labelled per-instance in its docstring, its target claim, and every citing
      record I found. The Semaev records use the single instance as a counterexample to
      a universal statement, which is logically valid, and say it does not generalise.
  - id: B3.6-citations
    command: rg -l over the repo (excluding formal/CryptoResearch) for every new theorem/module name and report path
    result: pass_with_findings
    detail: >-
      No ledger/ record cites these theorems by name. The citing records are the targets,
      knowledge/findings/KN-FIND-48f0ae.md, the problems/ records listed in claims below,
      the docs/reports/2026-10-2[12]-* reports, and research/{binstd_yield_ceiling_20261022,
      endosweep_dk_exact_batch4_20261022}/README.md.

findings:
  - id: F1
    beat: B3.4e
    severity: major
    claim_ids: [C-FROB-R1]
    what: >-
      docs/reports/2026-10-22-frob-c5-factor-kernels/REPORT.md ("Boundary and next
      check") says "the matrix-kernel certificate proves C5 for the resulting exact
      matrices". Frozen control C5 (experiments/EXP-FROB-91ee9c/specification.yaml
      C5_trace_identity_exact) also requires two things QuotientMatrixKernels does not
      prove: (i) T computed DIRECTLY by repeated q-th powering equals h(pi), whereas Lean
      defines trace5 := h(pi); (ii) ker(x-1)(pi) = F_q and is NOT contained in ker T.
      Lean proves only the factor-kernel sums/directness (matrix-independent, see F2),
      M^5 = I, the trace-matrix entries, rank 1 and dimension 4.
    evidence:
      - formal/CryptoResearch/FrobTrace/QuotientMatrixKernels.lean:186-247
      - experiments/EXP-FROB-91ee9c/specification.yaml:359-367
      - docs/reports/2026-10-22-frob-c5-factor-kernels/REPORT.md ("Boundary and next check", 2nd paragraph)
    fix: >-
      Narrow the sentence to "proves the C5 factor-kernel sum, directness and
      trace-kernel dimension 4 for the exact matrices, with T taken as h(pi)". Either
      add Lean lemmas for the direct-T equality (the FiniteFieldTrace analogue on the
      quotient basis) and the fixed-line exclusion (`fixed_trace5_eq_zero` instantiated
      with Matrix.toLin' M), or list them as open in the problem record. The executable
      replay and my Sage recheck both find (i) and (ii) true, so this is wording, not a
      wrong result.
  - id: F2
    beat: B3.5
    severity: minor
    claim_ids: [C-FROB-L9, C-FROB-R2]
    what: >-
      Proves-too-much: q11MatrixFactorClaim, q13MatrixFactorClaim and
      q19MatrixFactorClaim (conjuncts 1-3 of all_matrix_C5_controls) hold for EVERY
      endomorphism F, not only the archived matrices. They are proved by
      FactorKernel.q11/q19_kernel_direct_sum and h13_aeval, which take no hypothesis on F.
      q13MatrixFactorClaim is a definitional tautology: aeval F (Phi5) = trace5 F.
      Sage confirms the three claims stay true for the identity, zero and random 5x5
      matrices. The same applies to C5's own "direct sum" and "set equality" checks,
      which are automatic once the factors are coprime and multiply to h. Lines
      described as "Proved on exact matrices: ... proves the direct sums" (problem
      record, quotient-matrix-kernels report table) are true, but they add no
      matrix-specific evidence.
    evidence:
      - formal/CryptoResearch/FrobTrace/QuotientMatrixKernels.lean:205-216,228-229
      - formal/CryptoResearch/FrobTrace/FactorKernel.lean:59-67,144-163
      - scripts/readers/lean/frob_recheck.out.json (factor_sum_claim_holds_for_{identity,zero,random}_matrix = true)
    fix: >-
      State in the docstring, target notes and problem record that the factor-kernel
      identities are generic in F. The matrix-specific C5 content is M^5 = I, the
      T-matrix and dim ker T = 4 (plus, if added, per-factor kernel dimensions 1/4/2,
      which ARE matrix-specific and which Sage confirms).
  - id: F3
    beat: B3.6
    severity: minor
    claim_ids: [C-DK-L3, C-FROB-L5]
    what: >-
      No committed receipt binds the current source hash of
      formal/CryptoResearch/Endosweep/DkExactBatch4.lean
      (6137075074ca4bee122db1a62af2ec37b2eb9629fd31aeec2aabec42cc5beb92) or
      formal/CryptoResearch/FrobTrace/OrderFive.lean
      (828f172ea6b9c05f43041d08dbd8863e8590c7295ecf48136284d787d1c8170a). The batch-4
      README has a local `lean -o` narrative only; its SHA256SUMS omits the Lean file.
      docs/reports/2026-10-22-frob-c5-lean/REPORT.md says the exact receipt "is recorded
      separately by the formal verifier", but no such file contains that hash. OrderFive
      is built transitively by the FiniteFieldTrace/FactorKernel receipts, but its own
      target (frob-c5-order-five-trace-kernel.yaml) has no exact-source receipt. A
      search for the task ids TASK-20261022-adb94b and TASK-20261022-ff60b1 also finds
      only the reports, READMEs and targets. For DkExactBatch4 the only binding is
      tests/test_endosweep_dk_exact_batch4.py::test_lean_file_is_the_generators_output,
      which regenerates the file and compares bytes. That is not a build or axiom
      receipt.
    evidence: [scripts/readers/lean/pinning_check.out.json]
    fix: >-
      Run `python3 -m orchestration.formal.cli verify --task-file` for
      endosweep-dk-exact-batch4-discriminants.yaml and frob-c5-order-five-trace-kernel.yaml
      at the audited commit and commit the receipts, or have the session's build record
      them.
  - id: F4
    beat: B3.4a
    severity: minor
    claim_ids: [C-SEM-R4, C-SEM-L15]
    what: >-
      The claim "first fall is degree three" for the n=4,n'=4,s=1 draw has semantic Lean
      coverage only at D=3. existsNewLowDegreeVector identifies rank(rows3) - rank(proj3)
      with dim(V3∩R<=2) via the (private) rank-nullity lemma. At D=2,
      semanticNoFallTwo proves only the matrix-rank arithmetic 11-10-1 = 0. That
      difference is never tied in Lean to dim(V2∩R<=1) - dim V1, because no rows2 support
      or V1 ⊆ V2∩R<=1 lemma exists. projectedRank 1 is certified only as an executable
      rankOn value. The values are correct: I computed dim(V2∩R<=1) = 1 = dim V1 directly,
      with the inclusion.
    evidence:
      - formal/CryptoResearch/Semaev/BooleanParitySemanticRankCertificate.lean:124-128
      - formal/CryptoResearch/Semaev/BooleanParityFiltrationCertificate.lean:40-56,88-96
      - scripts/readers/lean/semaev_recheck.out.json (dim_V2_cap_R_le1, V1_subset_V2capRle1)
    fix: >-
      Instantiate row_space_projection_rank_nullity at degree 2 (rows2 support <= 2,
      V1 ≤ V2∩R<=1, dims 1 and 1) and prove `V2 ∩ R<=1 = V1`. Together with
      existsNewLowDegreeVector that gives a fully semantic "first fall at 3" theorem.
  - id: F5
    beat: B3.4c
    severity: minor
    claim_ids: [C-SEMCERT-L14]
    what: >-
      CryptoResearch.Semaev.decidable_validDecomposition is `decide_eq_true_eq` composed
      with validDecomposition_iff_curve_span_sum, and it holds for any Decidable instance.
      Its content beyond the iff lemma is only that an instance exists. The target's
      operational aim (a kernel-discharged checker for producer certificates) is not
      exercised: no concrete curve/certificate is decided in Lean, and for noncomputable
      fields (e.g. GaloisField) kernel reduction of the instance would not progress. The
      report's wording ("Total decision procedure") is accurate as a statement about
      `Decidable` and does not overclaim.
    evidence: [formal/CryptoResearch/Semaev/Certificate.lean:76-126]
    fix: >-
      Add one positive and one negative `example : decide (validRawDecomposition ...) =
      true/false := by decide` over a ZMod p curve, which shows the instance reduces in
      the kernel.
  - id: F6
    beat: B3.2
    severity: minor
    claim_ids: []
    what: >-
      `set_option maxHeartbeats 0` with maxRecDepth 1000000 in four Semaev files, and
      raised limits in the two QuotientMatrix files. These do not weaken checking, but
      they disable elaboration timeouts. A pathological edit could then hang CI instead of
      failing, and build-time variance is unbounded.
    evidence: [scripts/readers/lean/scan_and_targets.out.json]
    fix: Replace 0 with a measured finite bound (for example 4x the observed requirement).
  - id: F7
    beat: B3.4a
    severity: minor
