joint: B3
scope: >-
  crypto-autoresearcher origin/main e9b91d62a9b81a3e33a62f9f3e5036e8f7707907
  (HEAD == origin/main; worktree clean except the session's untracked
  research/sheriff/SHF-20261023-7b9227/). The 19 Lean modules added under
  formal/CryptoResearch/ in 30f95f89de..origin/main, the evidence file
  docs/reports/2026-10-22-semaev-first-fall-replay/evidence/finite-equation-lean-eval.lean,
  the 17 formal/targets/*.yaml added in that range plus the 4 pre-existing targets
  (ncp-*.yaml x3, semaev-decomposition-certificate.yaml) that name the new
  files. The only modified formal file in the range is formal/targets/README.md;
  no existing .lean file was modified.
reader:
  role: validator
  model: claude-opus-5-5
  independence: >-
    Produced none of the audited modules, targets, reports or receipts. Ran in a
    separate subagent context. No Lean toolchain was used, installed or
    available. All re-derivations are new code written from the statements,
    the Lean source text and the committed data (scripts under
    scripts/readers/lean/).
  blind_from_respected: true
  disclosed_exposures:
    - >-
      One `git log --oneline -3 origin/main -- formal/CryptoResearch/NCP`
      command printed three commit subject lines ("formal: refute
      commutator-only NCP kernel", "formal: prove NCP shadow reachability
      criterion", "Prove NCP affine word action normal form in Lean"). No
      commit message bodies or PR descriptions were read. Later history
      queries used --format='%h %cI' only.
    - >-
      research/verification/ffd_semaev_core.py and ffd_semaev_measure.py
      (the frozen 2026-09 measurement code, not the 2026-10-22 replay or
      generators) were read for definition fidelity (beat c): the historical
      fall_profile/new_falls rule that BooleanParityFiniteCertificate claims to
      mirror.
    - >-
      Producer reports, problem records and the KN finding were read because
      beat e (scope) requires comparing each citing sentence with the Lean
      statement.
  sibling_reports_read: false
  case_files_not_read: [prior.md, added.txt, cx-dirs.txt, sweep.log]
prior: >-
  Reconstructed at report time, not written down before reading (disclosed):
  from the task statement I expected (1) finite kernel-`decide` certificates
  on one toy instance cited as general results; (2) truncated Nat subtraction
  in a rank-difference "newFalls" formula; (3) generated certificate files
  whose constants were never independently recomputed; (4) "controls" whose
  Lean statement holds for any input. (1), (2) and (3) did not occur. (4)
  occurred once (QuotientMatrixKernels factor-kernel conjuncts).
