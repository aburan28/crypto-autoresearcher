  - id: c11
    beat: B5 (method ceiling, reversal)
    what: "does the gated probe law bound the lane? model from measured per-op costs"
    command: "python3 -I S/scripts/readers/n83/ceiling.py"
    output: S/scripts/readers/n83/ceiling.out
    result: >-
      Reader's model, not a measured bound. Every relation and the target cost phi*r/(166E) probes on the same index
      (phi = 1.0892 measured), independent of the number K' of unknown log columns, so cold(K', E) = c_b E + (K'+1) phi
      (r/166E) c_p + F with c_p = 94.7 ns/probe, c_b = 106.9 ns/root entry, F = 1.062 s (run 39527997793, EPYC 9V45).
      The model gives 7.29 s for the current row against 7.27 s measured, and #985's rank stages within 6% (kP 108.5 vs
      108.0 s, kM10 10.8 vs 11.5 s, kM38 2.86 vs 2.75 s). Minimising over E: gap to rT770 3.93 at K'=16 (the current row
