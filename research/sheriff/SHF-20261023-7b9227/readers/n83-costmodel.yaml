findings:
  - id: F-N83-1
    beat: B5
    severity: major
    claim_ids: [N1, N2, N9]
    what: >-
      Interpretation of the closure gain and of the row's distance to rho. The probe law the runs gate (r/(166E) probes
      per relation, the same law as for the target, and 'independent of how many columns the linear algebra has', #985
      README) means each relation costs one generic table-based DLP solve. The pipeline is therefore a (K'+1)-target table
      method on the 166-fold Frobenius-negation quotient, and its measured costs fit cold = c_b E + (K'+1) phi (r/166E)
      c_p + F within 0.3% (check c11). The closure's 6.44x / 7.66x is real (c4) but its mechanism is fewer auxiliary
      generic solves (K' 600 -> 16), not a higher relation probability. Its limit K' = 0 is the known-log construction
      that the ledger itself classes as 'BSGS on the Frobenius quotient', 'not an IC improvement' (other_records[28],
      #986, cL600 7.18x over kP+cP in its own run). Proves-too-much: the improvement metric, applied unchanged to that
      known-false object, reports a 7x 'IC improvement'; the only separator between M38 (promoted) and cL600 (refused) is
      K' > 0. With K' = 16 the row is at its own optimum (model 3.93 vs measured 3.92), so the remaining path to rho runs
      through per-op engineering, further K' reduction toward the BSGS limit, or a change of the probe law; on this host
      no K' >= 1 reaches the matched rho even with zero fixed overhead (K'=1 ceiling 1.15).
    evidence: [S/scripts/readers/n83/ceiling.out, S/scripts/readers/n83/band_closure.out, "cryptanalysis:experiments/koblitz-n83-closure-20261019/README.md", "cryptanalysis:docs/ic/baselines.json other_records[28]"]
    fix: >-
      State on the n=83 row and in the closure READMEs that relation collection costs one generic table solve per
      relation (the gated law), that the closure reduces the number of auxiliary solves, and the (K'+1) ceiling with its
      host per-op costs. Carry a same-run known-log arm at the row's E as the closest specialized (BSGS-on-quotient)
      comparator. A model, not an impossibility: a relation search whose success per probe beats 166E/r would break it.
  - id: F-N83-2
    beat: B5
    severity: minor
    claim_ids: [N9]
    what: >-
      No dominated_by / Pareto statement on the n=83 row; the comparison is time-only. On measured axes rT770 dominates
      the row in cold time (3.92 [3.16, 5.22]) and memory (IC peak RSS 1,808.9 MiB per process; rT770's own memory is not
      recorded: the wrapper's child_peak_rss_kb_cumulative is a high-water mark across children). The known-log
      (BSGS-on-quotient) comparator was measured once, cross-run, on the rank-probe producer (gap 2.19 [1.86, 2.59]); on
      the current producer the model puts it near the row's cold-without-rank path (4.47 s, gap ~2.4 at equal E, ~1.4 at
      its optimal E). The Bernstein-Lange arm has not been run since B (#918) although AGENTS asks for it wherever setup is
      excluded (the online gap 0.0933 compares a setup-free IC to a precomputation-free rho).
    evidence: [S/scripts/readers/n83/gap_1013.out, S/scripts/readers/n83/ceiling.out, "cryptanalysis:docs/ic/baselines.json baselines[4].gap_bernstein_lange"]
    fix: "Add dominated_by (or an explicit Pareto line) to the row over time, memory and setup; record rho memory; re-run the BL arm on the current producer."
  - id: F-N83-3
    beat: B5
    severity: minor
    claim_ids: [N9, F1]
    what: >-
      section_5a_band says the band is 'not computable'. A lower-bound band is computable from counters the producer
      already emits (rank probes, root calls, online probes, index states): IC/rho ~0 / 0.58-0.79 / 3.18-7.95 at 0 / 0.1 /
      1 GAE per unpriced op. The order flips inside the band, which is the informative statement (IC and rho are not ranked
      by 5a; the 3.92 holds as one host's wall time only). For the four engineering steps the band ratio is exactly 1.
    evidence: [S/scripts/readers/n83/band_1013.out, S/scripts/readers/n83/counts_identical.out]
    fix: "Replace 'not computable' by the counter-based band with its stated omissions (self-test, field operations); keep emitting group-operation counts as the K-N1 fix asked."
  - id: F-N83-4
    beat: B5/B6.5
    severity: minor
    claim_ids: [N6, N7, N9]
    what: >-
      The row's gap carries no interval and is host-dependent by more than the last two improvements combined. CI
      [3.16, 5.22] (12 rho runs, step CV 0.50). The identical round-2 producer (kM38IC+cM38IC) reads 4.0011 on AMD EPYC
      9V45 (run 39527997793), 4.4164 on Intel Xeon 8370C (39464544962) and 5.4304 on AMD EPYC 7763 (39527549698): a 1.36x
      spread, larger than #1009 x #1013 (1.139). The ledger already says only paired within-run gaps are deltas; the
      absolute gap of record is whichever host the latest run drew.
    evidence: [S/scripts/readers/n83/gap_paired_runs.out, S/scripts/readers/n83/gap_1013.out]
    fix: "Report the gap with a bootstrap CI and the range over measured hosts, or measure the row under ICMS with a fixed env_class."
  - id: F-N83-5
    beat: B6.4
    severity: minor
    claim_ids: [N6, N7]
    what: >-
      #1013 (1.0196) and #1015 (1.0165) are 1.6-2.0% wall-time effects between two different binaries. Their A/A runs one
      binary against itself, so it cannot see a binary-identity or code-layout effect; the A/A acceptance band is +/-3%,
      wider than the effects. #1013's local model (1.204 rank stage, 1.066 end to end) did not carry over (1.0467, 1.0196,
      below the design's own 1.03 minimal effect). The unchanged cold path inside the other binary (1.0026 [0.9961,
      1.0100]) bounds a global layout shift to about 1%, but not one in the edited loop.
    evidence: [S/scripts/readers/n83/rederive_1013.out, S/scripts/readers/n83/rederive_1006_1009_1015.out]
    fix: "For sub-3% effects add a null-edit arm (A's source rebuilt with an empty edit or a perturbed link order) or an other-host-class replay before promotion."
  - id: F-N83-6
