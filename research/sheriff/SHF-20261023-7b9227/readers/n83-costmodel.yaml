red_team_report:
  id: RT-20261023-9a74fc
  task_id: "sheriff case3, reader n83-costmodel (no TASK id issued to this reader)"
  claim_under_review: "N1-N9 and F1-F5 above"
  objections:
    - "F-N83-1 (major): the closure gain is real but its mechanism is fewer auxiliary generic table solves. The gated probe law makes each relation cost one target-sized solve, and the K'->0 limit is the ledger's own 'BSGS on the Frobenius quotient, not IC'. The improvement metric cannot tell IC progress from de-IC-ing."
    - "The row is dominated by rT770 on time and memory, and very likely by a same-producer known-log arm; no dominated_by or BSGS comparator is recorded (F-N83-2)."
    - "The rho gap has no interval ([3.16, 5.22]) and moves 1.36x with the host for an identical producer (F-N83-4)."
    - "Sub-3% engineering wins between different binaries rest on A/A runs that cannot see binary-identity effects (F-N83-5)."
  required_controls:
    - "Same-run known-log arm at the row's E (608 seeded orbits alpha(G), logs known, no rank stage), paired against kM38RF+cM38RF: measures the BSGS-on-quotient comparator and the rank stage's 38.6% share directly."
    - "Null-edit binary arm (or other-host replay) before promoting any effect below the A/A band (3%)."
    - "Other-env_class replay of the current row's primary under ICMS, capsule saved."
    - "Re-run the BL arm on the current producer; record rho memory."
  counterexample_or_mutation: >-
    Mutation K' -> 0 (column representative R_0 := G, every orbit alpha(G) with known log): the same producer, law and
    metric then report a large 'IC improvement' with no relation collection at all (measured once, #986: cL600 7.18x
    over kP+cP), which the ledger correctly refuses as IC. The closure (K'=16) differs from it only by 16 auxiliary solves.
