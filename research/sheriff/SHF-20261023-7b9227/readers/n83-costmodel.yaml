      smoke gate failed); the S0 diagnostic 39329564781 is archived under the v2 README's diagnosis/. Each invalidity is a
      pre-declared gate failure with no outcome data to select on, and each new version carries a new frozen protocol;
      the headline is not best-of-k on outcome.
  - id: c10
    beat: B5/B7 (re-audit of #944)
    what: "K-N1..K-N4 and R1-R fixes"
    command: "read cryptanalysis:docs/ic/baselines.json (conventions.setup, ratchet_history[9], other_records[12]); grep cryptanalysis:experiments/koblitz-n83-stacked-20261016/README.md and experiments/fb-archive/README.md; read experiments/koblitz-n83-replay-20261017/RESULTS.md, run_github_39007026856/host-class.json, host-probe.json"
    output: S/scripts/readers/n83/prereg_gh.out
    result: >-
      K-N1 partially fixed (wording, named LA 51.3 ms and input control 32.3 ms, measured X; group operations still not
      emitted and the band still declared not computable, see F-N83-3). K-N2 fixed (entry 9 holds the paired within-run
      gaps 305.8238 -> 94.4168 with cross-run figures under cross_run_context_*; entries 9-23 uniform). K-N3 fixed (OS byte
      3 on 2,568 of 2,664 indexed archives; sentence corrected). K-N4 fixed (8.7949; 1.358; 'per-probe wall time, not a
      host-speed factor'). R1-R fixed as specified: run 39007026856 replayed rank block K1 in the order kS, kP, kP, kS
      with one timed cold K600 construction, on an Intel Xeon Platinum 8573C (family 6 model 207) against the original
      AMD EPYC 9V74; protocol frozen at 863f6090 49 s before the run; per-attempt probes and relations bit-identical;
