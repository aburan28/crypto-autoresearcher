    claim_ids: [N1, N2, N3, N4, N5, N6, N7, N8, F5]
    what: >-
      Preregistration is not provable from main's history: every landing commit is a squash, so protocol and raw outputs
      first appear together. It is provable only from GitHub (run head_sha, branch commits, which this clone does not
      fetch); deleting the branches would remove the evidence. The pass in c8 rests on that API evidence.
    evidence: [S/scripts/readers/n83/prereg_gh.out]
    fix: "Record head_sha, the protocol commit sha and its timestamp in each run directory (the replay's host-class.json does), or land evidence branches with merge commits."
  - id: F-N83-7
