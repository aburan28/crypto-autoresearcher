      this is disclosed in the decision; "two independent rule-12 reviewers, blind" is accurate
      for the re-deriver by construction and for the joint owner by attestation.
    evidence: [ledger/decisions/DEC-20261022-a0f165.yaml rulings I-1, I-4, I-5; scripts/readers/mono/out/cc4/]
    fix: None required for this record; LS-3 and LS-5 of the decision are the right lessons. The confidence_note already says "model identities not probe-verified".
  - id: F4
    severity: minor
    beat: B6
    what: >-
      Scope imprecision. The Scope says "Measured corroboration covers m in {3, 4, 5} only ...
      nothing at m >= 6 is measured". On the SYMMETRIC base neither reviewer measured anything
      beyond m = 4 (ccd10c Table 5.4 and 8aff64 section 2.5 are m = 4; the m = 5, 6, 7 orders and
      block systems rest on the derivation plus the curve-free group computation, as the Scope
      says for m = 6, 7 but not for m = 5). This audit supplies the missing m = 5 symmetric-base
      measurement (K6, K7: five curves, chi2 fits, block structure confirmed), so the clause is
      now true as a matter of fact but was not supported by the producers' own data.
    evidence: [coordination/goals/GOAL-MONO-001/review/TASK-20261017-ccd10c/blind_rederivation.md section 5b; .../TASK-20261017-8aff64/review_report.md section 2.5; scripts/readers/mono/out/symmetric_summary.json, block_check.json]
    fix: Additive note that symmetric-base measurement by the producers covers m = 4 only (m = 3 trivially), m = 5 by this audit; no verdict changes.
  - id: F5
    severity: minor
    beat: B4
    what: >-
      Observation, not a defect: "nonsingular" and "p > 3" are sufficient hypotheses of the
      derivation (they make the f(x_i) independent modulo squares and char != 2), not necessary
      ones; on y^2 = x^3, y^2 = (x-1)^2 (x+2) and over F_27 the degree, squarefreeness and
