  - id: F2
    severity: minor
    beat: B8
    what: >-
      Wording. "it is primitive iff m - 1 is odd" sits inside the sentence headed "for m >= 4"
      and is only true there: at m = 3 the symmetric-base group S_2 acts on 2 points and is
      primitive although m - 1 = 2 is even. CS-PR states the restriction explicitly ("for m >= 4
      ... primitive iff m - 1 is odd"); the Statement's own sentence leaves it to the reader.
    evidence: [knowledge/findings/KN-FIND-bdcd60.md Statement (2); scripts/readers/mono/out/symmetric_summary.json group_model m=3 primitive true]
    fix: Any restatement should write "for m >= 4, primitive iff m - 1 is odd". No record edit.
  - id: F3
    severity: minor
    beat: B6/B7
    what: >-
      Independence is by session and role only, as the decision says (CS-IND, L-1): both
      reviewers and this reader report the same model family (claude-fable-5-1, never
      probe-verified); the joint owner's blindness from the blind re-deriver rests on its
