checks:
  # ---------------------------------------------------------------- blind phase (own derivation + own code)
  - id: K0
    what: Blind re-derivation of (a) ordered-base group, (b) symmetric-base order and primitivity, (c) Frobenius rule, from definitions
    command: (written by hand) scripts/readers/mono/blind_derivation.txt
    output: scripts/readers/mono/blind_derivation.txt
    result: >-
      Re-derived: roots x(P_1 + sum eps_i P_i), 2^{m-2} distinct generic values (no Z-relation at
      the generic point of E^{m-1}, [2] != 0), Kummer group (Z/2)^{m-1} (f(x_i) squarefree in
      disjoint variables), translation action with diagonal kernel => (Z/2)^{m-2} regular,
      arithmetic = geometric (no constant-field extension: same degree over F_p(x) and K(x)).
      Symmetric base: W = Z/2 wr S_{m-1} = Gal(K(x,y)/K(e)), kernel D of order 2 for m-1 >= 3
      (order 4 at m = 3) => order 2^{m-2}(m-1)! = 24, 192, 1920, 23040 at m = 4..7; S_2 at m = 3;
      primitivity iff F_2^{m-1}/D is an irreducible S_{m-1}-module iff m-1 odd (submodule lattice
      0 < D < W_even < F_2^n for n even; D (+) W_even for n odd), exactly one block system of two
      blocks of size 2^{m-3} (parity classes) for m-1 even. Frobenius: y_i^p = chi_i y_i =>
      phi(P_i) = chi_i P_i => translation by [chi]; cycle type 1^{2^{m-2}} iff all chi_i equal,
      else 2^{2^{m-3}}. All numbers of the statement reproduced.
  - id: K1
    what: Definitions re-verified (S_3, resultant recursion, degrees) against the defining property on random E(F_{p^2}) points
    command: /opt/conda-sage/envs/sage/bin/python3 scripts/readers/mono/check_ordered.py scripts/readers/mono/out
    output: scripts/readers/mono/out/ordered.log (D1), ordered_summary.json
    result: PASS. 10 curves; S_3 roots = {x(P1+P2), x(P1-P2)} with multiplicity; S_4, S_5 vanish on sign sums; degrees 4 and 8 in every variable.
  - id: K2
    what: Per-curve symbolic degree / generic squarefreeness / irreducibility of S_4 (17 curves) and S_5 (9 curves, p <= 13); disc_T S_3 = 16 f(x1) f(x2) over Z[a,b]
    command: same as K1
    output: scripts/readers/mono/out/ordered_summary.json ('symbolic')
    result: PASS on every curve (deg 4 / 8, disc_T S_4 != 0, S_4 and S_5 irreducible over F_p => F irreducible over F_p(x), transitive); identity exact over Z[a,b].
  - id: K3
    what: Labelled root formula and labelled Frobenius translation over F_{p^2} on sampled fibres, m = 3,4,5, all curves
    command: same as K1
    output: scripts/readers/mono/out/ordered.log ('labelled' lines, aggregated in blind_results.txt)
    result: PASS 1854/1854 fibres (product formula, every r_[eps] a root, phi(r_[eps]) = r_[chi*eps]); 996 degenerate fibres skipped as the statement requires.
  - id: K4
    what: Frobenius cycle-type rule census, ordered base, 17 curves (p = 7, 11, 13, 101, 1009, 1013, 10007; j = 0, j = 1728, supersingular, generic), m = 3, 4, 5; exhaustive when p^{m-1} <= 15000
    command: same as K1; then /opt/conda-sage/envs/sage/bin/python3 scripts/readers/mono/compare_ordered.py scripts/readers/mono/out
    output: scripts/readers/mono/out/ordered_summary.json, compare_ordered.json
    result: >-
      PASS. 51,547 (m=3) + 29,182 (m=4) + 8,656 (m=5) = 89,385 admissible fibres, 0 rule
      mismatches, only the two claimed cycle types. Identity fractions at p >= 1009 within
      sampling error of 2^{-(m-2)} (0.491-0.524, 0.238-0.257, 0.113-0.131); depressed at p <= 101
      by the admissibility selection (small curves lack 2^{m-2} distinct rational x-coordinates of
      one chi-class), quantitatively as expected (0.226 ~ 0.25*0.88 at p=101, m=4). Wrong groups
      (C_4, D_4, A_4, S_4; C_8, C_4xC_2, Q_8, D_8, AGL(3,2), S_8) rejected at every curve with
      p >= 1009 (types never observed; chi2 in the thousands) while (Z/2)^{m-2} fits (chi2 0.0-2.9 on 1 dof).
  - id: K5
    what: Curve-free permutation-group model of the symmetric-base group, m = 3..7 (GAP via libgap)
    command: /opt/conda-sage/envs/sage/bin/python3 scripts/readers/mono/check_symmetric.py scripts/readers/mono/out
    output: scripts/readers/mono/out/symmetric_summary.json ('group_model'), symmetric.log
    result: >-
      PASS. Orders 2, 24, 192, 1920, 23040; m=4 is Sym(4) (TransitiveGroup(4,5)), primitive;
      m=5 TransitiveGroup(8,41), imprimitive, exactly 1 nontrivial block system, blocks of size 4;
      m=6 primitive (2^4:S_5); m=7 imprimitive, exactly 1 block system, blocks of size 16.
  - id: K6
    what: Symmetric-base Chebotarev census with my own extension-field resultant code, m = 4 AND m = 5, 6 curves (p = 13, 101, 1009, 10007; j=0, j=1728, supersingular, generic), joint (cycle type of F, cycle type of g) vs the group model; wrong-group alternatives
    command: same as K5
    output: scripts/readers/mono/out/symmetric_summary.json ('census', 'alternatives')
    result: >-
      PASS. m=4: chi2 3.0, 3.7, 0.7, 6.4, 3.4 on 4 dof; identity 0.040-0.044 vs 1/24. m=5:
      chi2 9.2, 20.8, 8.2, 13.1, 9.2 on 11 dof; identity 0.002-0.005 vs 1/192; no joint type
      outside the model on any curve (p = 13 included, frequencies off for the small-p reason).
      Rejected: V_4, C_4, D_4, A_4 (m=4); C_8, S_2 wr S_4 (384), S_4 wr S_2 (1152), AGL(3,2),
      A_8, S_8, TransitiveGroup(8,38), (8,40). NOT separable by cycle types: TransitiveGroup(8,39)
      (order 192, dual module, blocks of size 2) -- see K7.
  - id: K7
    what: Block-system test at m = 5 on the symmetric base, joint distribution of (cycle type, block-swap flag s = chi_p(prod f(x_i)))
    command: /opt/conda-sage/envs/sage/bin/python3 scripts/readers/mono/block_check.py scripts/readers/mono/out
    output: scripts/readers/mono/out/block_check.json, block_check.stdout
    result: PASS. chi2 0.9 (p=1009, n=1494) and 6.2 (p=10007, n=600) on 8 dof vs the size-4-block model; 0 impossible pairs; 0 swap pairs incompatible with two blocks of size 4. Confirms the "parity classes" block structure with data, not only by derivation.
  - id: K8
    what: m=3 symmetric base, disc of F in F_p[a,b,e1,e2] is a non-square (generic a, b; five primes) and F irreducible over F_p(e) on four curves
    command: same as K5
    output: scripts/readers/mono/out/symmetric_summary.json ('m3_symbolic')
    result: PASS => S_2 of order 2 at m = 3.
  - id: K9
    what: Symbolic root formula over Z[a,b] (m=3) and over Z[a,b] and F_p[a,b], p in {7,11,13,101,10007} (m=4), modulo (y_i^2 - f(x_i))
    command: /opt/conda-sage/envs/sage/bin/python3 scripts/readers/mono/symbolic_checks.py scripts/readers/mono/out  (R1, R2; R3 superseded by K10)
    output: scripts/readers/mono/out/symbolic_R1R2.stdout, symbolic.log
    result: PASS, exact in every case (every curve over every odd characteristic at m = 3, 4).
  - id: K10
    what: Direct Galois-group determination at m = 4 by the polynomial resolvent cubic over F_p[x1,x2,x3], 13 curves and generic (a,b) at p in {7,11,13,101,10007}
    command: /opt/conda-sage/envs/sage/bin/python3 scripts/readers/mono/resolvent_fast.py scripts/readers/mono/out
    output: scripts/readers/mono/out/resolvent_summary.json, resolvent.stdout
    result: PASS. Resolvent splits into three linear factors and disc is a square in every case => Gal <= V_4; with irreducibility (K2) Gal = V_4 exactly, for every curve over those primes.
  # ---------------------------------------------------------------- proves-too-much controls
  - id: K11
    what: Control A, the proper closed locus x_2 = x([2]P_1) (group must shrink)
    command: /opt/conda-sage/envs/sage/bin/python3 scripts/readers/mono/controls.py scripts/readers/mono/out
    output: scripts/readers/mono/out/controls_summary.json ('A_locus_x2_eq_x2P1'), controls.log
    result: >-
      DETECTED. m=3 F = (linear)(linear) over F_p(x1) (trivial group; identity fraction 1.0 vs
      0.5); m=4 F = (quadratic)(quadratic) over F_p(x1,x3) (intransitive Z/2; identity fraction
      0.47-0.52 vs 0.25 at p = 101, 1009). The cycle-type rule itself survives there (chi_2 = chi_1
      automatically, as the derivation predicts), so the rule alone is not a group test.
  - id: K12
    what: Control B', square-discriminant sub-cover at m = 4 (group must become A_4) and Control B, wrong groups against the census data
    command: same as K11; K4; K6
    output: controls_summary.json ('Bprime_square_discriminant_A4'), compare_ordered.json, symmetric_summary.json ('alternatives')
    result: DETECTED. Only A_4 types on 2001 / 1953 fibres; chi2 vs A_4 0.8 / 10.1, vs S_4 2003 / 1973. Wrong groups rejected as in K4, K6.
  - id: K13
    what: Controls C and D, outside the claim's scope -- singular cubics (y^2 = x^3; y^2 = (x-1)^2 (x+2)) and p = 3 (F_3, F_27)
    command: same as K11
    output: controls_summary.json ('C_D_singular_and_p3')
    result: >-
      The degree, squarefreeness and Frobenius-rule conclusions SURVIVE (0 mismatches on ~35,000
      admissible singular-cubic fibres and on 2,970 F_27 fibres; over F_3 every m >= 4 fibre is
      degenerate). "Nonsingular" and "p > 3" are sufficient hypotheses of the derivation, not
      necessary ones; the finding's scope is conservative, not wrong. Not a defect.
  # ---------------------------------------------------------------- post-blind: producer numbers, records
  - id: K14
    what: Exact recomputation of producer headline counts with my own S_4 (true specialised S_4, census labelling)
    command: /opt/conda-sage/envs/sage/bin/python3 scripts/readers/mono/recompute_producer_numbers.py scripts/readers/mono/out
    output: scripts/readers/mono/out/recompute_producer_numbers.json, recompute.stdout
    result: >-
      EXACT MATCH on every quoted count: p=53 exhaustive 148,877 / 23,877 / 2,400 / 95,328 /
      19,488 / 75,840; OBS-1 C1 44,759 / 7,323 / 119,618 (excluded 5,151), C2 50,161 / 4,920 /
      121,770 (excluded 0), all 12,243 "2+1+1" fibres non-squarefree (0 squarefree of degree 4
      or 3); C1 m=4 exhaustive 1,030,301 / 30,301 / 9,836 / 58,628 / 931,536 / 214,416 / 717,120 /
      252,700. Plus my blind census reproduced ccd10c's exhaustive m=3 rows C1, C7, C8 exactly.
  - id: K15
    what: Trace every number of KN-FIND-bdcd60's Basis into the raw computations.json files
    command: python3 key walks and literal searches (see postblind_results.txt)
    output: scripts/readers/mono/postblind_results.txt
    result: >-
      Traced: 24,000; the four exhaustive curves p <= 103; 50,000 / 5,000 on four curves p >= 997;
      20,000 symmetric-base points + exhaustive p=101; 95,328; 12,243 (= 7,323 + 4,920); the
      primes list; curve lists. NOT traced: "334,354 sampled nondegenerate fibres" -- raw stage-B
      nondegenerate counts sum to 259,026 sampled (+95,328 exhaustive = 354,354; the quoted figure
      is 354,354 - 20,000). Also untraced in 8aff64 section 5: "395,914" (raw 393,626). F1.
  - id: K16
    what: "Record integrity and preregistration (B6/B7): archive receipt, hashes, commit ancestry, independence checker, ledger validator, goal status"
    command: >-
      python3 (receipt walk); git merge-base --is-ancestor; python3 tools/check_review_independence.py --plan
      ledger/handoffs/TASK-20261017-8aff64.yaml --reports <committed attestations> ; same on a normalized scratch copy
      (scripts/readers/mono/out/cc4/); python3 tools/validate_ledger.py
    output: scripts/readers/mono/postblind_results.txt, out/cc4/, out/validate_ledger.stdout
    result: >-
      PASS. Receipt of TASK-20261022-f42d75 records CC-1..CC-13 PASS; path_sha256 of the finding,
      the decision and goal.yaml equal the files at e9b91d62a9; archive commit 80d5aee303 reachable;
      plan+prior (00ee0a74a5, 2026-10-17 05:42Z) precede the reports (e3de77970e, 07:15Z) which
      precede the decision (2026-10-22). check_review_independence.py: FAIL on the committed round
      (one schema problem: seven mapping-typed sources_read entries), PASS exit 0 on the normalized
      copy -- CC-4(b) replicated. validate_ledger.py: 141 errors at HEAD, none naming any audited
      record. goal.yaml status completed, completion_record cites DEC-20261022-a0f165, criterion
      (c) only, (a) declined, (b) not met, no quorum block: consistent with the decision.
  - id: K17
    what: Compare the three producer derivations (40470a section "Blind re-derivation", ccd10c sections 1-6, 8aff64 D1-D9) with mine, clause by clause
    command: reading
    output: this file
    result: >-
      All three agree with each other and with my derivation on every clause (root set, Kummer
      group, translation action, kernel, generic distinctness, arithmetic = geometric, wreath
      product, kernel order 2 for m >= 4 and 4 at m = 3, submodule lattice / primitivity, block
      sizes, Frobenius rule, curve independence). ccd10c's Lemma C uses a transcendence-degree
      argument where mine uses the generic point of E^{m-1}; 8aff64's D4 is the same as mine.
      No gap found in any of them.

