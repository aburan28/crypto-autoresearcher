# Sheriff case 3 -- independent reader report (docs/sheriff.md B3/B4/B6/B8, review-breakthrough class)
# Target: KN-FIND-bdcd60 (confidence established, promoted by DEC-20261022-a0f165) and the
# GOAL-MONO-001 closure it accompanies, at origin/main e9b91d62a9b81a3e33a62f9f3e5036e8f7707907.
# Read-only on producer trees. All scripts/outputs under scripts/readers/mono/ (this scratchpad).
joint: >-
  B4 (certificates: the derivation and every quoted count re-verified by disjoint code),
  B6 (controls, statistics, preregistration order), B8 (every number in KN-FIND-bdcd60 traced),
  B3 not applicable (no Lean cited by the finding); review-breakthrough class (goal closure).
reader:
  role: validator-breakthrough
  model: claude-fable-5-1 (as reported by the runtime; not probe-verified)
  effort: max
  independence: >-
    Fresh session; produced none of the audited records; not the session of
    TASK-20260930-40470a, TASK-20261016-9c1bc5, TASK-20261017-ccd10c, TASK-20261017-8aff64 or
    TASK-20261022-a2f575. Code lineage disjoint from both reviewers (SageMath 10.9 / Singular /
    PARI / GAP via libgap, written here; the reviewers used CPython + numpy + sympy and their own
    polynomial code). Same model family as the two reviewers (claude-fable-5-1), so model
    independence is NOT claimed; independence is by session, role and method.
  dispatch_condition_check: >-
    Routed as review-breakthrough for proposed_state_transition: closed (GOAL-MONO-001 moved to
    completed). The condition holds. The finding itself is not a claimed breakthrough (toy tier,
    structural result, no attack); the routing is justified by the closure, not by the finding.

blind_from:
  respected: true
  paths_not_opened_before_the_blind_phase_closed:
    - coordination/goals/GOAL-MONO-001/review/**  (all four review directories)
    - experiments/EXP-MONO-*
    - ledger/evidence/EV-MONO-*
    - ledger/decisions/DEC-20260930-8553d4.yaml, ledger/decisions/DEC-20261017-12e0f4.yaml
    - DEC-20261022-a0f165.yaml sections validity_check_of_round, independence_and_disclosure_rulings, composition, dissent_dispositions
  read_before_the_blind_phase_disclosure: >-
    KN-FIND-bdcd60.md in full (the task required it); its 6-line "Basis" section sketches the
    producer argument (roots x(P_1 + sum eps_i P_i), Kummer group, translation action, generic
    distinctness, S_{m-1} on the symmetric base). My re-derivation (scripts/readers/mono/
    blind_derivation.txt) works every step out from definitions and produces every number
    independently, but it is not blind to that skeleton. Also read before the blind phase:
    DEC-20261022-a0f165 lines 1-107, 692-857, 992-1052 (statement_frozen, scope_frozen,
    goal_status_ruling, scope_statement, official_status_changes), goal.yaml status lines, the
    role contracts, docs/sheriff.md, knowledge/README.md, docs/claims-and-verification.md.
  blind_phase_artifacts:
    - scripts/readers/mono/blind_derivation.txt   (prior + full re-derivation, written first)
    - scripts/readers/mono/blind_results.txt      (all blind-phase numbers, written before any producer proof was opened)
  sibling_exposure_note: >-
    A directory scripts/readers/mono/redteam/ (another reader's) appeared in my scripts path during
    the run; it was listed by name only and never opened. No sibling report was read.
  post_blind_artifacts:
    - scripts/readers/mono/postblind_results.txt  (resolvent rewrite, exact recomputation of producer counts, number tracing, record integrity)

prior: >-
  Recorded in blind_derivation.txt before any computation. Expected the mathematics to hold
  (textbook Kummer / affine-group argument). Expected weak points: (i) "primitive iff m-1 odd"
  is false at m = 3 if read for all m; (ii) "every p > 3, every m" is derivation-only with
  measurements at m <= 5 and ten toy primes; (iii) reviewer independence rests on an attestation
  plus a listable scratchpad; (iv) possibly an untraced count in the Basis; (v) whether
  "confidence: established" fits a derivation-tier record with no literature check.
  Outcome against prior: (i) confirmed as a wording point only (the sentence is headed "for
  m >= 4"); (ii) confirmed and honestly scoped by the finding; (iii) confirmed and disclosed by
  the decision (CS-IND, L-1); (iv) CONFIRMED: the tally 334,354 does not trace (F1); (v) within
  repository convention (16 derivation-tier findings carry "established"; the confidence_note
  qualifies it). One thing the prior did not anticipate: the symmetric base at m = 5 was never
  measured by either reviewer (F5); this audit measured it.

