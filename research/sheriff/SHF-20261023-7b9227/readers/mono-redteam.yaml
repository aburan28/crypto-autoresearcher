  # --------------------------------------------------------------- checks
  checks:
    - id: CHK-1 criterion_word_for_word
      question: Does what was established meet the goal's closure criterion as written?
      result: >-
        HOLDS, literally and narrowly.  completion_criteria disjunct (c) reads "a scoped
        instrument/protocol no-go is recorded".  KN-FIND-4f0d84 / EV-MONO-1ef611 record
        exactly that (the generic-fibre Frobenius cycle-type census in the
        EXP-MONO-4b50b6 form is identically trivial on the factor-base locus, by
        derivation, every m >= 3), recorded met by DEC-20261017-435b01 (archive
        5a11b9500982) after the CU-7 rule-12 review (TASK-20261016-9c1bc5, J1-J3 CONCUR).
        DEC-20261022-a0f165 adds nothing to (c); it removes the last block (the J4
        DISSENT).  Criteria (a) and (b) are recorded NOT met, with the J4 grounds carried
        as counter-statements (CS-K1d2).  The goal's objective ("Decide KN-OPEN-009 ...
        via a frozen Chebotarev/monodromy census protocol") was NOT achieved by the
        protocol: the monodromy half of the question is answered by derivation outside
        any census, and the relation-rate half is open (KN-OPEN-62c870 Q1).  The status
        word "completed" therefore means "the goal's own instrument was shown unable
        to answer its question", which is what disjunct (c) declares a success.
    - id: CHK-2 overclaim_scan_goal_and_downstream
      result: >-
        The committed texts are unusually careful (CS-D2, CS-R7, CS-K1d2 carried verbatim
        into KN-FIND-bdcd60, KN-OPEN-62c870, goal head, typst report).  No record cites
        KN-FIND-bdcd60 outside its own lane (14 citers, all BATCH-e6e94f/dce635 records,
        the knowledge pair, CORR-20261022-87c9cd, the decision report and a session
        receipt); papers/, research/, knowledge/frontiers cite it nowhere; the frontier
        rows were checked and unchanged (report.typ line 82).  Clauses that DO claim
        more than the finding supports are the interpretive ones listed in findings
        F-1, F-2 and F-3 (independence wording, the "wreath" reading, the measured-scope
        wording).  Stale goal-head lines ("DECISIVELY CONFIRMED", 2026-09-04) are
        preserved as immutable text and neutralised by CS-QA/CS-QA2.
    - id: CHK-3 independence_and_blindness
      result: >-
        Custody verified by this reader at HEAD: both cards hash exactly as the
        attestations record (222154b2..., e19e3601...); the six review files equal the
        CC-2 digests; the marker PR8- occurs 0 times in all six review files (prior
        isolation held); the f42d75 receipt records CC-1..CC-13 PASS, its commit
        80d5aee3037e40d171b31cdf4152a23806d0da5b is reachable from origin/main and all
        16 declared path_sha256 match HEAD.  Sequence: ccd10c (blind, validator binding)
        released before 8aff64 was claimed; neither read a sibling report; 8aff64 could
        list (not open) the shared scratchpad (PD-2, attested).  Both reviewers and this
        reader are claude-fable-5-1 (model independence absent, disclosed in CS-IND).
        Weaknesses found: F-1 (8aff64's "independent re-derivation" is a guided
        verification: its card carried the statements AND the derivation route), F-5
        (the blind card's quantity statement encodes the answer's shape).  The
        Coordinator prior PR8-1..7 did not leak as verdicts or probabilities; the plan's
        attack hints (extra-automorphism curves, constant-field extension, OBS-1 2+1+1
        instances) are the prior's "where I could be wrong" items recast as tests, which
        the plan's LS-1 explicitly allows.
    - id: CHK-4 J4_dissent_disposition
      result: >-
        ON THE MERITS, not by procedure.  The DISSENT objected to adopting route (a) on
        grounds G-i, G-ii, G-iii; a fresh rule-12 review (8aff64, RA-4) re-assessed each
        ground against committed text and sustained all three; the composer DECLINED
        route (a) on those grounds (RA-C3, a key committed in the plan at 00ee0a74a5ca
        before any reviewer ran).  The dissenter's position is adopted, so nothing
        remains for it to dissent from.  RA-4's breaking artifact rightly requires
        every ground answered (each ground is independently sufficient to block (a)).
        Residual: G-i is sustained on one of two readings of "full symmetric/wreath"
        (F-2); G-ii (M3 withdrawn; no pre-stated error met) and G-iii (N-2 and dd58c3
        scope) stand on quoted text and alone suffice, so the disposition is robust to
        F-2.
    - id: CHK-5 cheapest_falsification_run
      result: >-
        RUN; the claim SURVIVED.  (i) Exhaustive, EVERY nonsingular curve y^2 = x^3+ax+b
        (not hand-picked panels): m=3 at p in {5,...,31} (1,867,654 admissible fibres),
        m=4 at p in {5,7,11,13} (227,520), m=5 at p in {5,7} exhaustive (7,728) and
        sampled over all curves at p = 11, 13 (5,872): every admissible fibre
        (f(x_i) != 0, full degree, squarefree) has pattern in {1^{2^{m-2}}, 2^{2^{m-3}}}
        and obeys the chi-rule; 0 violations in 2,131,737 admissible fibres over
        2,798,084 tuples (including the singular and char-3 objects of CHK-7).  Own
        S_3..S_6 from the chord law and FORMAL Sylvester resultants (no product
        formula), defining-property self-test 100% on four curves.  (ii) The
        never-measured part of statement (2): symmetric-base Frobenius census at m=5 on
        four curve types (generic, j=0, j=1728, supersingular; p in {1009,1013,1019};
        14,921 admissible fibres): exactly the 7 cycle types of the order-192 group
        (Z/2)^3 x| S_4 occur and none outside it (an 8-cycle, a transposition, a 5- or
        7-cycle would each refute the group); chi-square against its class densities
        4.75, 4.53, 2.25, 10.62 on 6 df.  (iii) RUN: symmetric-base census at m = 6 on y^2 = x^3+2x+3 / F_1009 (1,193 admissible fibres) and the supersingular y^2 = x^3+1 / F_1019 (594): exactly the 12 cycle types of the order-1920 group (Z/2)^4 x| S_5 occur and none outside it; chi-square 19.43 (p = 0.054) and 10.76 (p = 0.46) on 11 df; the type 1+5+5+5 (density 0.2; observed 264 and 125 times) is incompatible with any block system of two blocks of size 8, so primitivity at m = 6 is corroborated by measurement for the first time (artifact rt_symmetric_m56_out.json).
    - id: CHK-6 downstream_consequence_claims
      result: >-
        NONE FOUND.  No record cites KN-FIND-bdcd60 or the completion for relation
        rates, index-calculus cost or ECDLP difficulty.  The only exponent-relevant
        text in the lane (EV-MONO-1ef611 resource_check R2, the 2^{n-1} compounding
        over F_{q^n}) is carried everywhere as "open, untested, no exponent statement"
        (CS-D2) and lives in proposals (IDEA-20260803-ff7415, IDEA-20260904-a1b81b) at
        status proposed.  The portfolio snapshot lists GOAL-MONO-001 under
        buckets.batch_complete only.
    - id: CHK-7 proves_too_much_and_nearby_objects
      result: >-
        The producer's three known-false objects (PT-1 base contains y_i; PT-2 the
        [2]-graph; PT-3 square-discriminant cover) target steps D2 and D8 and the
        argument stops at the right step on each (8aff64 section 6; checked
        analytically here).  The remaining steps have natural known-false objects on
        which the argument also visibly fails: D4 (coincident variables x_j = x_i: Lemma
        C's hypothesis fails and F is not squarefree) and D5 (a constant cover T^2 = d,
        d a non-square: the constant field is F_{p^2}, so the arithmetic = geometric
        step is not available).  Characteristic 2: the Kummer step is unavailable
        (y^2 = f(x) is inseparable), so the argument does not run.  Singular cubics
        (nodal y^2 = (x-1)^2(x+2), cuspidal y^2 = x^3) and characteristic 3 are NOT
        known-false objects: the argument runs on them and the conclusion is TRUE there
        too -- measured here: all singular cubics at p = 7, 11, 13 exhaustive (m=3:
        2,412 admissible fibres; m=4: 13,320), p = 101 sampled (7,213), char 3 m=3 (18):
        the identical chi-rule, zero violations.  Reading: the cycle-type census does
        not see the curve at all -- it measures Legendre symbols of f(x_i) and the
        sign-cover structure shared by every 1-dimensional commutative group with a
        2:1 x-map.  This strengthens, rather than weakens, criterion (c)'s instrument
        no-go, and bounds what "uniform in the curve" means (F-4).

  # --------------------------------------------------------------- findings
  findings:
    - id: F-1
      severity: medium
      kind: interpretation / independence wording
      what: >-
        "Three derivations agree" and "re-derived blind and independently" (KN-FIND-bdcd60
        confidence_note and Basis; DEC-20261022-a0f165 I-4 "RA-1 to RA-3 count as a second
        re-derivation independent of RB") overstate TASK-20261017-8aff64's contribution.
        Its card (ledger/handoffs/TASK-20261017-8aff64.yaml lines 297-306, 348-365, 391-405)
        carried the full CU-9 statements (groups, orders 192/1920/23040, kernel {+-1},
        AGL(2,2) = S_4, the delta-rule) AND the derivation route ("write the roots as
        x(P_1 + sum eps_i P_i) over sign classes, adjoin the y_i, compute Gal(K(x,y)/K(x))
        and its image on the roots ...").  What 8aff64 did before opening the predecessor
        REPORT is a guided verification of a stated derivation, independent of RB but not
        of the original (TASK-20260930-40470a).  Honest count: one derivation, one blind
        re-derivation (with the F-5 caveat), one guided verification plus extensive
        independent measurement.
      evidence: [ledger/handoffs/TASK-20261017-8aff64.yaml, coordination/goals/GOAL-MONO-001/review/TASK-20261017-8aff64/review_attestation.yaml (order_of_work_actually_followed), knowledge/findings/KN-FIND-bdcd60.md (confidence_note, Basis), ledger/decisions/DEC-20261022-a0f165.yaml (I-4, knowledge_promotion.basis)]
      status_effect: none (RA-C5 required RA-1..3 compose C and RB agree; both hold regardless of how 8aff64 is labelled)
      fix: >-
        A wording correction (new record; KN-FIND-bdcd60 immutable) replacing "independent
        re-derivation" by "independent verification of the stated derivation with its own
        constructions and measurements", and "Three derivations agree" by the honest count.
    - id: F-2
      severity: medium
      kind: interpretation / decision logic (reading of "wreath")
      what: >-
        The closure texts assert as fact an interpretive conclusion the committed anchors do
        not settle.  CS-K1d2 says the ordered-base group "is not full symmetric or wreath";
        KN-FIND-bdcd60 and KN-OPEN-62c870 say the objective's dichotomy "is not exhaustive";
        8aff64 section 7.1 lists the reading R-max ("full" = the largest group the cover's
        structure permits) as having "no anchor" and the composer rules it "does not
        compose (A4-b)".  But the word "wreath" IS in the anchor texts -- criterion (a)
        verbatim, KN-OPEN-009's title and statement, RQ-MONO-001's title, KN-LIT-039's
        relevance note -- no record ever says WHICH wreath product is meant, and the only
        wreath product named anywhere in the lane is Z/2 wr S_{m-1}, named by
        KN-FIND-bdcd60 itself, which establishes that the symmetric-base monodromy is its
        full image (the kernel {+-1} acts trivially on roots in any case).  Under that
        reading the monodromy clause of criterion (a) is satisfied on the symmetric base at
        every m >= 4 for every curve, and the dichotomy IS exhaustive with the answer in
        the "full monodromy, no exceptional locus (barrier)" branch -- the outcome
        KN-OPEN-009 and KN-LIT-039 anticipated, with the refinement that the barrier is
        structural (the census carries no curve information at all, CHK-7).  Ground G-i is
        therefore sustained on one of two anchored readings, not on the merits against the
        other.
      evidence: [ledger/goals/GOAL-MONO-001/goal.yaml (completion_criteria), knowledge/open-problems/KN-OPEN-009.md (title, statement), ledger/questions/RQ-MONO-001.yaml (title), knowledge/literature/KN-LIT-039.md line 38, coordination/goals/GOAL-MONO-001/review/TASK-20261017-8aff64/review_report.md section 7.1 (R-max row) and 7.3, ledger/decisions/DEC-20261022-a0f165.yaml (joint RA-4 reasoning; CS-K1d2; criteria b), knowledge/findings/KN-FIND-bdcd60.md ("What this does not settle"), knowledge/open-problems/KN-OPEN-62c870.md (Q2)]
      status_effect: >-
        none on closure: G-ii (the only pre-registered error test M3 failed and was
        withdrawn) and G-iii (DEC-20260802-a51c82 N-2; dd58c3 scope and
        completion_criteria_met []) rest on quoted text and each alone blocks (a), so
        route (a) stays declined and (c) stays the basis.  The effect is on what the
        knowledge entries assert.
      fix: >-
        A clarification record defining "full wreath" for this cover and restating: on the
        symmetric base the generic monodromy is the full image of Z/2 wr S_{m-1} for every
        m >= 4 and every curve (a proper subgroup of Sym(2^{m-2}) for m >= 5); on the
        ordered base there is no permutation part and the group is the full image of the
        sign group; criterion (a) is declined on G-ii and G-iii irrespective of the reading;
        replace "the dichotomy is not exhaustive" by "the dichotomy's 'full' branch holds
        in the wreath sense and fails in the Sym(2^{m-2}) sense; no exceptional locus exists
        in either sense".
    - id: F-3
      severity: low-medium
      kind: scope wording / measured corroboration
      what: >-
        KN-FIND-bdcd60 Scope: "Measured corroboration covers m in {3, 4, 5} only ...;
        nothing at m >= 6 is measured" does not distinguish the two bases.  On the
        SYMMETRIC base both reviews measured only m = 4 (ccd10c section 5b; 8aff64
        section 2.5); the order-192 imprimitive group at m = 5 and the order-1920
        primitive group at m = 6 had NO measured corroboration -- they rested on the
        derivation plus a curve-free permutation computation.  This reader measured
        them: m = 5 on four curve types (14,921 admissible fibres, exactly the group's 7
        cycle types, chi-square 4.75 / 4.53 / 2.25 / 10.62 on 6 df); m = 6 on two curves (1,193 + 594 admissible fibres): exactly the 12 predicted cycle types, none outside the 1920-group, chi-square 19.43 and 10.76 on 11 df (p = 0.054, 0.46); the type 1+5+5+5 observed 264 and 125 times rules out any two-block system of size 8, i.e. corroborates primitivity directly.  The curve-free model was also recomputed in Sage/GAP: orders
        2, 24, 192, 1920, 23040; regular elementary-abelian ordered groups of order
        2^{m-2}; primitive exactly at m = 3, 4, 6; at m = 5 and 7 exactly one nontrivial
        block system whose minimal block is the even-minus-parity class of size 2^{m-3}
        (rt_groups_out.json), agreeing with CS-PR.
      evidence: [knowledge/findings/KN-FIND-bdcd60.md (Scope), coordination/goals/GOAL-MONO-001/review/TASK-20261017-ccd10c/blind_rederivation.md (sections 4, 5b), coordination/goals/GOAL-MONO-001/review/TASK-20261017-8aff64/review_report.md (sections 2.5, 2.7, 4), scratchpad artifacts rt_groups_out.json and rt_symmetric_m56_out.json]
      status_effect: none; the "every m" extent was declared as resting on derivation
      fix: >-
        Scope wording: "measured on the ordered base at m in {3,4,5} and on the symmetric
        base at m = 4 only".  If the Coordinator wants the symmetric-base m = 5, 6
        corroboration on record, it must be re-run under a task with a receipt; this
        reader's outputs are evidence for that decision, not a record.
    - id: F-4
      severity: low
      kind: decision logic / status semantics
      what: >-
        "completed" is correct under the goal's own declared criteria and AGENTS.md
        ("completed needs a committed Coordinator decision showing a declared criterion
        met"; no DISSENT outstanding on effect; quorum suspended; no attestation
        invented), but disjunct (c) makes a goal completable by showing its own
        instrument cannot answer its question.  The goal is titled "monodromy /
        relation-rate gate"; the relation-rate gate is not decided (KN-OPEN-62c870 Q1 open,
        RQ-MONO-001 active), and portfolio tooling will count this as a completed goal.
        Also, "uniform in the curve" is weaker than it sounds: the measured quantity is
        uniform across singular cubics and char 3 as well (CHK-7) -- the instrument is
        blind to the curve, which is the content of the no-go.
      evidence: [ledger/goals/GOAL-MONO-001/goal.yaml (title, objective, completion_criteria, completion_record_2026_10_22), coordination/portfolio_health/latest.json (buckets.batch_complete), knowledge/open-problems/KN-OPEN-62c870.md, scratchpad artifact rt_sweep_small_p_out.json (SINGULAR_* and CHAR3_* rows)]
