  findings:
    - id: F1
      severity: minor
      what: >-
        stark_v2's AIR identifier identifies the transition only within the documented degree <= 1
        class, and nothing enforces that class. AirV2.transition is an arbitrary closure, and the
        verifier calls it only at the fingerprint points and at the opened LDE points. Two closures
        that agree on those inputs but differ on trace-domain rows share an identifier, and the
        verifier cannot tell them apart. The documented degree-1 restriction (also needed for the
        composition degree bound) is therefore a caller obligation, not a verifier check. For
        degree-1 transitions the fingerprint is exact, so N3a-type wrong-AIR mutants are rejected
        (harness and module test).
      evidence: ["crypto:src/zk/stark_v2.rs:147 (closure transition)", "crypto:src/zk/stark_v2.rs:269-292 (fingerprint doc: 'for higher degree this is a fingerprint')", "crypto:src/zk/stark_v2.rs:77 ('The transition must be of degree 1')"]
      tested: false
      fix: "Represent the v2 transition as its coefficients (c0 + c1*a + c2*b), so degree 1 is structural and the identifier is the coefficient vector. Or state that the verifier's AIR must be fixed independently of any proof and is trusted to be degree 1."
    - id: F2
      severity: minor
      what: >-
        In stark v1, transitions of any degree are in scope, and the docs say the identifier is a
        6-point fingerprint (242-246). Yet the module docs (60-65) say the transcript absorbs "the
        whole statement". The module's own cheat_air (64 -> 12345, otherwise doubling, stark.rs
        894-905) has the same fingerprint as doubling, so distinct transitions with equal
        identifiers exist in the tree. Every documented bound (the (1-k/n)^q escape, the 2^(g-bits)
        grinding bound) assumes the AIR is fixed before the commitment. That holds when the verifier
        supplies the AIR. It is not guaranteed by the transcript if the AIR can be chosen after the
        query positions are known. Not measured.
      evidence: ["crypto:src/zk/stark.rs:60-65", "crypto:src/zk/stark.rs:242-255", "crypto:src/zk/stark.rs:289-297", "crypto:src/zk/stark.rs:894-905"]
      tested: false
      fix: "Say 'an AIR fingerprint' rather than 'the whole statement', and state that the bounds hold for a verifier-fixed AIR. Or absorb a collision-resistant identifier of a canonical AIR description."
    - id: F3
      severity: minor
      what: >-
        "Malformed input returns false; it never panics" holds for proof values (M3, v1.M1 and the
        module tests: no panics). By reading, it does not hold for the statement. v2 verify
        materialises coset(n*beta) before any Merkle check (479), and primitive_nth_root asserts
        log2(n*beta) <= 32 (plonk.rs 75-77). So a statement with n*beta > 2^32 panics, and n*beta
        near 2^31..2^32 attempts a multi-GB allocation first. v1 verify calls subgroup(n) (775).
        This matters only where n comes from an untrusted party. The verifier's own work is
        O(n*beta), so it is not succinct. Not run, to avoid an OOM on the shared host.
      evidence: ["crypto:src/zk/stark_v2.rs:477-480", "crypto:src/zk/stark.rs:773-778", "crypto:src/zk/plonk.rs:74-83"]
      tested: false
      fix: "Reject n*beta > 2^32 (or a configured maximum) in statement_transcript, and compute only the queried domain points (7*omega_L^p) instead of whole domains."
    - id: F4
      severity: info
      what: "Both proof structs carry the prover's full FRI tables (FriCommitment.layers, layer_trees). The verifier never reads them, so they are unbound passengers: arbitrary content does not change the verdict, and the proof as a struct is non-succinct. No soundness effect."
      evidence: ["crypto:src/zk/stark.rs:304-313", "crypto:src/zk/stark.rs:506-603 (fri_verify reads only layer_roots and final_constant)"]
      tested: false
      fix: "Split the prover state from the proof object."
    - id: F5
      severity: minor
      what: >-
        E1-R residual. records_bound is computed correctly
        (!killed && records_sha256.is_some() && rec_sha == records_sha256, audit.rs 631-633), and
        the tests cover strict, lenient, finalised and appended-byte cases (5/5 pass). But a
        never-finalised session still audits ok: true. The flag shows only in the JSON field and a
        stderr warning (ecbench.rs 1000-1006), so a consumer that checks only `ok` cannot see it.
        No test truncates the last record of a never-finalised session, the case the flag exists
        for. By reading, it passes with ok: true, fewer records and records_bound false.
      evidence: ["crypto:src/cryptanalysis/ecbench/audit.rs:143-158, 264-273, 621-633, 728-783", "crypto:src/bin/ecbench.rs:1000-1006", "$S/scripts/readers/stark/cargo-test-ecbench-audit.log"]
      fix: "Make consumers (claim build, sheriff ecbench-sessions-integrity, VALIDATION gate) require records_bound == true for any session cited as complete. Add a test that drops the last record of the killed fixture and asserts ok && records_bound == Some(false) && records == 3."
    - id: F6
      severity: info
      what: "v1 at an unsized q stays grindable: v1.N8b found an accepted false-statement proof at attempt 330 with q = 20. This is documented (stark.rs 75-80) and pinned by spot_check_at_q20_is_grindable. At q = spot_check_queries(8, 64) = 333, 0 of 20000 attempts were accepted (N8b2). Any caller passing q below the sized value gets this."
      evidence: ["$S/scripts/readers/stark/harness.jsonl rows v1.N8b_grind_two_broken_rows_q20, v1.N8b2_grind_two_broken_rows_sized_q"]
      fix: "None needed beyond the docs. Optionally make verify take bits and derive q."

  soundness_statement_review:
    v2_docs_54_77:
      formula: "eps <~ rho^q * 2^-g + eps_field + eps_hash, rho = 1/beta. This is the standard conjectured (ethSTARK-style) query term; rho = n/(n*beta) is correct for FRI to degree < n on n*beta points."
