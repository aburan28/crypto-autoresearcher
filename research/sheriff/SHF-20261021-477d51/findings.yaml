  findings:
    - id: F1
      beat: B5
      severity: major
      claim_ids: [C5]
      what: >-
        The bold headline ranks the plan at a single weight ("every choice the planner made was
        the better one"). Section 5a says to rank only where the order holds across the band, and
        against double-base it does not. "Every choice" also generalises beyond what was tested:
        - only x0.5 and x2 bases were tried, and the proves-too-much control shows any N in
          about [0.78N, 1.41N] would pass the same test;
        - the oracle was tried only against rootfind (already known 31-64x worse), not against
          m = 3 or the unblocked builder.
        The README states that no IC wall time is used, but never says the admitted wall
        comparison (median 0.68-0.76, outside A/A noise) points the other way on the base size.
        The benchmarks/README row repeats "beats every alternative".
      evidence:
        - research/sheriff/SHF-20261021-477d51/readers/costmodel.yaml
        - crypto:research/ic_planner_validation_20261020/sessions/r28/comparisons/plan__double-base.json
      fix: >-
        Rescope the headline: at w = 0, the plan beat each of five tested one-change
        alternatives. Across the band, the base size is unresolved against x2. Add the wall
        median as a practicality note. Run the cheapest falsification: extra base arms at
        1.125N and 1.25N, plus m = 3 and unblocked-builder arms, on the three registered specs.
    - id: F2
      beat: B6
      severity: major
      claim_ids: [C7, C9]
      what: >-
        The decision rule as implemented (scripts/summary.jq:20-22) is not the frozen one
        (PROTOCOL.md:68-71). The script checks an interval only at w = 0 and point means at
        w = 0.1 and 1, so it can never output "refuted" above w = 0. This deviation is not
        listed under Deviations. Per-weight intervals give a label that depends on the method:
        - two-stage: 1 inside on all six curves;
        - one-stage paired: below 1 on r28 and c30.
        The study's detectable effect (about 10%) is above the 2-9% effect at issue.
      evidence:
        - crypto:research/ic_planner_validation_20261020/scripts/summary.jq:20-22
        - research/sheriff/SHF-20261021-477d51/readers/stats.yaml
      fix: >-
        Record the deviation and compute per-weight paired intervals with one stated method.
        Report double-base at w = 1 as "unresolved, underpowered". Pre-register the interval
        method and N (a power check) before the follow-up.
    - id: F3
      beat: B5
      severity: major
      claim_ids: [C10, C12]
      what: >-
        The change is classed "engineering" in the README, REPORT, leaderboard section,
        scoreboard panel and progress chip. Crypto AGENTS.md section 3 defines engineering as
        "S fell, ... an improvement to the baseline: a success". The study itself says no S fell.
        The chip on the timeline therefore reads as an improvement that did not happen.
      evidence: [crypto:AGENTS.md, crypto:docs/ic/progress-timeline.json]
      fix: "Relabel it as a validation/diagnostic with no class gain (none, or accounting by repository precedent) everywhere the chip and class appear."
    - id: F4
      beat: B5
      severity: major
      claim_ids: [C12]
      what: >-
        The progress point 14.39 has three problems:
        - it is the best (lowest-gap) of the three registered cells;
        - it is a w = 0 quotient of two lower-bound arms;
        - it sits in the ec-cold emphasis series, defined as "faster than rho, every phase
          priced", without the lower-bound/diagnostic label its neighbour carries.
        A best-of-3 cell on a barrier-test series reads as frontier progress at r = 2^24.
      evidence: [crypto:docs/ic/progress-timeline.json, research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/leaderboard_diff.out.txt]
      fix: "Move it to the bounded-counts series, or label it lower-bound/diagnostic, with all three registered cells or the declared primary one, not the best."
    - id: F5
      beat: B7
      severity: major
      claim_ids: [C3, C6]
      what: >-
        No independent replay exists for any of the 1,536 records, and no replay of any kind
