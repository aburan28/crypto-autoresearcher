    Written before reading any producer file (prior.md). Expected:
    (1) a protocol or amendment not strictly before its sessions;
    (2) wording that generalises six toy cells;
    (3) rho.negation correctly matched, but with unsourced rho tables;
    (4) at least one planner citation that does not support its rule, and a recalled or fitted kappa;
    (5) restored plan.json legitimate but weakly evidenced;
    (6) a leaderboard/progress point that reads as a gain;
    (7) the workflow keeping the gate.
    Outcome: (1) not borne out; (2), (4) and (6) borne out; (3) partly borne out (the tables
    trace, but carry Measured labels they have not earned); (5) better than expected (the
    restored bytes equal the plan_sha256 sealed two days earlier); (7) borne out.
