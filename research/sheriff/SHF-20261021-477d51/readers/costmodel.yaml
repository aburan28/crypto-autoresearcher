proves_too_much_control:
  argument_under_test: >-
    "The plan beats each one-change neighbour, with every paired interval
    above 1, so every choice the planner made was the better one"
    (README.md:25-27; REPORT.typ:25), applied to the base size, with
    neighbours at x0.5 and x2.
  known_false_objects:
    - object: Base sizes M in about [0.78N, 1.41N] other than the counted optimum, with fitted S up to 6-9% above the minimum.
      survives: >-
        Yes. The same x0.5 / x2 design with an interval-above-1 rule would
        "confirm" every such M on all six curves (CM-15).
      where: >-
        At the step from "not beaten by x0.5 or x2" to "the better choice". The
        neighbourhood is too coarse to resolve the optimum to better than
        about +-35% in N.
    - object: The plan's own base at w = 1, where 2N is known to be cheaper (CM-10, CM-11) and wall time confirms it (CM-12).
      survives: >-
        Yes, at w = 0. The headline argument, evaluated in the counted unit
        only, confirms a size that is not the cheaper choice once the
        unpriced lookups are charged.
      where: In ranking at one weight, which section 5a forbids ("Rank only where the conclusion holds at every weight in the band").
    - object: >-
        The planner's oracle choice mitm-prime-blocked against the
        unblocked mitm:m=2,negation_folded=1. The unblocked builder is 2-8x
        slower in set-up wall time (E_BLOCKED32), so it is the worse choice.
      survives: >-
        Yes. The only oracle alternative tested is rootfind-subtract, which is
        31-64x worse by prior evidence (E_ROOTFIND). Any pair-table builder,
        at identical counts, would be "confirmed" in exactly the same way.
      where: >-
        "Oracle choice confirmed" tests the oracle family (pair table against
        root finding), not the planner's choice (blocked builder, m = 2 against
        m = 3).
  conclusion: >-
    The argument survives on objects whose conclusion is false, so the
    headline overgeneralises. The narrowest supported statement: at w = 0 the
    plan's S lies below each of the five tested one-change alternatives on
    all six curves, and its base sits within about 10% (in N) of the fitted
    counted optimum.

findings:
  - id: CM-F01
    beat: B5.1 class
    severity: major
    what: >-
      The change is labelled class "engineering" in the README, the
      leaderboard component, the scoreboard panel and the progress-chart chip,
      while the study states no S fell. Under crypto AGENTS.md section 3,
      engineering means "S fell, ratio to the floor flat: an improvement to
      the baseline: a success". Under "Every improvement is a success",
      engineering counts as a success. A tooling validation that re-measures
      the existing best recipe is not an S improvement. The repository's own
      precedents for such measurements are "Class: none (AGENTS.md section
      3); nothing here is a method change" (scoreboard, #lab-ecbench-all
      footnote) and "accounting" (ec-cold point 2026-10-03, "ecbench
      baseline, every candidate").
    evidence: >-
      README.md:104-109 ("Tooling validation, engineering (AGENTS.md section
      3). No S improves on a measured baseline"); PROTOCOL.md:76-77;
      docs/ic/leaderboard.json:50312 ("class": "engineering",
      planner_component); docs/ic/LEADERBOARD.md:256;
      docs/index-calculus-scoreboard.html:798 ("Class: engineering (tooling
      validation); no method changed") and :919 (chip engineering);
      docs/ic/progress-timeline.json:191 ("class": "engineering");
      crypto AGENTS.md:638-660 (section 3 table); precedent "Class: none" at docs/index-calculus-scoreboard.html:796.
    fix: >-
      Reclassify as none (tooling validation, no method change) or
      accounting wherever a section 3 class is shown, and keep "no row
      moves". Under AGENTS section 7 ("the class chip set ... by the test in
      section 3 and not by how the change felt to make"), the chip must follow
      the S test.
  - id: CM-F02
    beat: B5.2 baseline and section 7a (reference quality)
    severity: major
    what: >-
      The progress point 14.39 sits in the `ec-cold` emphasis series, whose
      note defines it as "The repository's own definition of faster than rho
      (AGENTS.md section 2)", that is, every phase priced. The point is a
      quotient of two lower bounds: every arm has lower_bound true and
      calibration_pinned_units [], and ecbench's own verdict on this exact
      comparison reads "diagnostic only (unpriced work; ratio does not bound
      full cost)". The point carries no lower-bound or diagnostic label,
      although the 2026-10-17 ec-cold point beside it says "quotient of
      incomplete GAE lower bounds; diagnostic, no cost-direction claim". It
      also states a direction ("Rho is cheaper on all six curves"), which the
      page's unit_note reserves for fully priced ratios. The established home
      for ecbench counted prime IC ratios is `ec-bounded-counts`, for example
      the 2026-10-14 "Prime rootfinding B48 batch-8, registered 20-bit
      subgroup" point. Only the w = 0 value is shown; at w = 0.1 and 1 it is
      14.98 and 17.76. The value traces correctly (CM-13) and moves no
      frontier or best value. The direction does hold across the band (band
      ranks rho-neg < plan at every weight).
    evidence: >-
      docs/ic/progress-timeline.json:18-20 (ec-cold note), :189-199 (point),
      :280-282 (ec-bounded-counts note);
      docs/index-calculus-scoreboard.html:916 against :919;
      sessions/r24/comparisons/rho-neg__plan.json (verdict string);
      sessions_costmodel.out.json r24.paired_ratios.plan/rho-neg.
    fix: >-
      Move the point to ec-bounded-counts, or label it "quotient of
      incomplete GAE lower bounds; diagnostic" with the band 14.39 / 14.98 /
      17.76. Set its class per CM-F01. Re-embed and add the table row as
      section 7a requires.
  - id: CM-F03
    beat: B5.3 unpriced work (section 5a)
    severity: major
    what: >-
      The bold headline ranks the plan against its alternatives at a single
      weight: "In the counted unit (w = 0), every choice the planner made was
      the better one". Section 5a says "Rank only where the conclusion holds
      at every weight in the band. If the order of two arms changes inside
      the band, report them as unresolved ... never as a win for either side."
      The distance-to-rho table and "Rho is cheaper ... by 12.6x to 25.8x"
      are also given at w = 0 only (15.6-30.7x at w = 1). Section 5a requires
      every unpriced counter of every arm to be listed with its count. The
      README lists IC's five, but omits rho's canonicalisations_uncharged
      (3.5k-26.6k per run) and rootfind's sixth counter (inversions). It
      never says that every ratio is a quotient of lower bounds. rho's
      partition hashes and DP-table work, which section 5a names, are not
      emitted at all. Pricing them would raise rho's S and shrink the gap,
      without changing its direction.
    evidence: >-
      README.md:25-27, :55-58, :73-87; REPORT.typ:25, :53-63; crypto
      AGENTS.md:691-723; sessions_costmodel.out.json (arms.rho-neg.unpriced;
      arms.rootfind.unpriced; paired_ratios.plan/rho-neg at w = 1).
    fix: >-
      Restate the headline across the band: "oracle, stop rule and targets
      hold against their tested alternatives at w = 0, 0.1 and 1; the base
      size beats x0.5 everywhere and is unresolved against x2 inside the
      band". Add w = 0.1 and 1 columns to the rho table. List rho's and
      rootfind's unpriced counters with counts, and label the ratios as
      lower-bound quotients. Record rho's missing counter emissions as an
      implementation gap.
  - id: CM-F04
    beat: B5.3 and B5.7 (practicality note; preserved observations)
    severity: major
    what: >-
      The only whole-cost measurement in the sessions contradicts the
      planner's size choice, and the README omits it. ecbench admitted the
      double-base / plan wall comparison on all six curves (L2 pairs, outside
      the A/A noise), at 0.68-0.76 with every interval below 1 (CM-12): the
      doubled base runs 24-32% faster. The README says "No IC wall time is
      used ... which affects nothing here, since only counts are compared".
      Wall time is never a bound and the protocol fixed counts as the measure.
      But AGENTS section 6 keeps wall time "in the table as a practicality
      note", and this observation is the direct evidence on which way the
      unpriced lookups cut. It is stronger than the w = 1 band.
    evidence: sessions/*/comparisons/plan__double-base.json (wall block); README.md:132-133; PROTOCOL.md:44; crypto AGENTS.md:725-737.
    fix: >-
      Add a practicality-note column with the admitted wall ratios,
      double-base included. Reword "too small if lookups are priced near an
      addition" to "too small once unpriced lookups are charged (w = 1) and
      in admitted wall time".
  - id: CM-F05
    beat: B5.2 matched reference (planner as shipped)
    severity: major
    what: >-
      For j = 0 and j = 1728 curves the planner names `rho.negation` as the
      matched rho (planner.rs:643-648) and interpolates generic-j points for
      them. ecbench ships `rho.cubic` and `rho.quartic` (methods.rs:585-586).
      The planner's own cited E_GLV, section 6.6, shows the matched folded rho
      takes about sqrt(3) and sqrt(2) fewer steps, and classes the understated
      gaps as accounting. The planner's "Against rho.negation: about X" line
      therefore understates the distance by about 1.7x (j = 0) and 1.4x
      (j = 1728). Class detection by a == 0 / b == 0 (planner.rs:75-82) also
      ignores the p mod 3 and p mod 4 conditions under which the extra
      automorphism is F_p-rational. None of this affects the six campaign
      curves (automorphisms_available = 2, CM-01).
    evidence: planner.rs:41-46, 75-82, 467-473, 643-648; src/cryptanalysis/ecbench/methods.rs:585-586, 1245-1279; RESEARCH_GLV_INVARIANT_FACTOR_BASES.md section 6.6 (E6 table).
    fix: >-
      Map PrimeJ0 with p = 1 mod 3 to rho.cubic and PrimeJ1728 with
      p = 1 mod 4 to rho.quartic. Return ic_over_rho None (Unmeasured), or the
      generic value times sqrt(A/2) marked Extrapolated with that factor
      named. Read automorphisms_available instead of a and b.
  - id: CM-F06
    beat: B5.5 scope (support labels)
    severity: major
    what: >-
      The planner's honesty contract ("a rule applied outside the sizes it
      was measured at is reported as extrapolated, never as known",
      planner.rs:9-11) is not implemented for most rules. The size rule is
      `Measured` across 23.4-32 bits, where no base-size optimum was
      measured: Table B's balanced base is the rule itself, and the 32-bit
      grid floor of 1,024 is above the rule's 813. The planner's own test
      cites "the unrecorded pilot" for 768-1,024 (planner.rs:736-737). The
      oracle, targets and both linalg choices are hard-coded `Measured` at
      every size, for example the folded table at 40 bits with p > 2^62
      (planner.rs:483, 493, 512, 563, 622, 633). For the six curves the
      planner would print "measured" for every stage, while PROTOCOL.md:27-28
      says "each plan is interpolated".
    evidence: planner.rs:9-13, 304-306, 327-333, 453, 483, 493, 512, 563, 622, 633, 736-737; tableB_check.out.json; research/ic_oracle_setup_blocked_20261020/README.md (grid).
    fix: >-
      Give each rule a measured span from its evidence. Mark the prime size
      rule Interpolated (or Extrapolated) between 23.4 and 32 bits until a
      bracketed optimum is measured there; this campaign's sessions are such
      evidence for 23.5-29.6 bits at w = 0. Commit the pilot or drop it from
      the test. Correct PROTOCOL wording in the README deviations.
  - id: CM-F07
    beat: B5.5 scope (cheapest falsification, Q5)
    severity: major
    what: >-
      "Every choice the planner made was the better one" generalises beyond
      the one-change neighbourhood tested. Base size was tested only at x0.5
      and x2, and the proves-too-much control shows any N in about
      [0.78N, 1.41N] would pass. The oracle was tested only against
      rootfind-subtract, already known 31-64x worse, while the planner's
      actual choices (blocked builder, m = 2 against m = 3) were not tested.
      Linalg was tested only against full-rank, and targets only against
      random. The three-point fit puts the w = 1 optimum near 1.5N (11-16%
      cheaper than the plan) and predicts that a base about 12% larger ties
      the plan at w = 0 and beats it at w = 0.1 and 1, that is, dominates
      across the band.
    evidence: README.md:25-27; REPORT.typ:25; specs/*.json (arms); proves_too_much.out.json; sessions_costmodel.out.json three_point_fit.
    fix: >-
      Narrow the claim to "better than each tested one-change alternative".
      Run the cheapest falsification (next_concrete_action) before any
      statement that the size rule is the optimum.
  - id: CM-F08
    beat: B5.3 band ranking against the frozen decision rule
    severity: minor
    what: >-
      PROTOCOL.md:68-71 confirms a choice "when the alternative's ratio
      interval lies above 1 at every band weight". summary.jq:20-22 checks
      the interval only at w = 0 and point means at w = 0.1 and 1. This is an
      unreported deviation. My per-weight intervals (CM-11) leave the four
      "confirmed" verdicts intact. They show double-base / plan below 1 with
      the interval excluding 1 at w = 1 on r28 [0.880, 0.991] and c30
      [0.914, 0.999], which the frozen rule's language would call refuted at
      that weight. The README's "not separated" (section 5a: unresolved) is
      defensible overall but omits this.
    evidence: PROTOCOL.md:66-71; scripts/summary.jq:20-22; sessions_costmodel.out.json paired_ratios.
    fix: Compute and publish paired intervals at each band weight, and list the decision-rule implementation under Deviations.
  - id: CM-F09
    beat: B5.6 machinery and provenance of the plan
    severity: minor
    what: >-
      No `ic plan` output is committed for any of the six curves. The "plan"
      arms and the predicted ic_over_rho exist only as spec parameters and as
      15-digit constants hard-coded in scripts/summary.sh:10. I re-derived
      both exactly (CM-04), so the values are right, but the claim "plan = ic
      plan (ic-planner/1) output" has no artifact.
    evidence: specs/*.json "description"; scripts/summary.sh:10; rg 'ic_over_rho|ic-planner' in the study (no plan output).
    fix: Commit `ic plan --json --ecbench-arm plan` for each curve, and have summary.sh read it.
  - id: CM-F10
    beat: B5 (cited calibration constant)
    severity: minor
    what: >-
      Koblitz kappa = 0.6 is a hand fit to eight exploratory picks from
      sessions "not kept". The six small curves pin it to [0.561, 0.629).
      The two largest need 0.45-0.51, and the source model gives 0.794. The
      rule overshoots by 25-33% exactly where it would be extrapolated.
    evidence: planner.rs:312-315, 571-573, 800-839; Frobenius-orbit PROTOCOL.md section 1 and section 3 table; planner_rederive.out.json koblitz_kappa.
    fix: State kappa as fitted, give its window, and refit with weight on n >= 37, or measure the column optimum at n41 and n43 on kept sessions.
  - id: CM-F11
    beat: B5.2 same counted unit (Koblitz outlook)
    severity: minor
    what: >-
      The KOBLITZ_RHO_POINTS are ratios of fully priced `*_full` methods.
      The planner names `rho.signed_frobenius` and emits a plain
      `ic.pipeline` arm, so a run of its plan is in a different (lower-bound)
      unit from its prediction. The interpolation in log2 r alone ignores the
      source's significant ln n term and runs between non-monotone points of
      different n and cofactor.
    evidence: planner.rs:245-251, 377-387, 655-660; Frobenius-orbit README (H6 fit table; "What was built" item 1).
    fix: Name the `_full` ids (or emit `ic.pipeline_full`), and fit ln ratio on ln r and ln n as the source does.
  - id: CM-F12
    beat: B5.2 baseline quality of the prime outlook
    severity: minor
    what: >-
      Both prime end points are lower-bound quotients measured at N = 48 and
      N = 1,024, not at the rule's 41 and 813. The 19.1-bit end point rests on
      an 8-target rho mean 1.575 times its theoretical S (ratio interval
      5.37-8.39). The outlook reports a bare point, without that uncertainty,
      and without the exponent it implies (r^0.179) when used beyond 32 bits,
      which AGENTS section 6 requires to be named. P4 ("within 2x") cannot
      fail short of a gross error. The six predictions were all low (1-18%).
      The campaign's six points corroborate the slope (0.117 against 0.124 per
      bit).
    evidence: planner.rs:366-368, 646, 688; holdout REPORT.md; rho-neg__blocked-1024.json; planner_rederive.out.json end_points.
    fix: Carry the end points' intervals into ic_over_rho, name the slope in `basis`, and add the six campaign points to PRIME_RHO_POINTS under a new planner version.
  - id: CM-F13
    beat: B5 / B8 reason strings and citation mapping
    severity: minor
    what: >-
      planner.rs:480 says "m = 2 beats m = 3 and root finding by 4-60x in
      S". On Table B prime rows m = 3 is 1.05-3.2x worse, and root finding
      is 31-64x. The claim on E_LINALG32 (planner.rs:279), "about 4.75
      relations per column", is stated in E_BLOCKED32's README, not
      E_LINALG32's.
    evidence: planner.rs:277-280, 480; tableB_check.out.json (min_ratio_m3 against min_ratio_m2); research/ic_oracle_setup_blocked_20261020/README.md ("needed about 4.75 relations per column").
    fix: Correct the ranges and attach the figure to the file that states it.
  - id: CM-F14
    beat: B5 (binary size rule; outside the campaign)
    severity: minor
    what: >-
      The binary dimension rule round(log2 #E / 3) appears to choose about
      twice Table B's balanced base on 4 of 5 rows (30, 62, 134 and 254
      points against about 64, 128, 256 and 512). The comment at
      planner.rs:526 assumes every subspace x is an abscissa. Inconclusive:
      not run.
    evidence: planner.rs:525-530; tableB_check.out.json char2 rows.
    fix: Check `ic plan --binary-degree` against Table B's base_points, and correct the rule or the comment.
  - id: CM-F15
    beat: B8 numbers
    severity: minor
    what: >-
      Three number slips. README.md:77 gives the r24 interval upper end as
      18.5, while the source gives 18.4487 (LEADERBOARD.md shows 18.4; the
      progress point shows 18.45). README.md:55 says "five native counters
      unpriced", but the rootfind arm has six. The A/A in counts, "1.000
      [1, 1]", is a determinism check of a deterministic pipeline on identical
      seeds, not a noise control; the informative null is the wall A/A (CM-12).
    evidence: README.md:39, 50, 55, 77; sessions/r24/comparisons/rho-neg__plan.json; sessions_costmodel.out.json rootfind.unpriced.
    fix: Round from the source, say "five (six on rootfind)", and describe the counted A/A as a determinism check.
  - id: CM-F16
    beat: B5.4 phases
    severity: minor
    what: >-
      Every phase is present and the setup is charged cold per target. The
      factor-base construction and the linear algebra, however, are 0 GAE at
      w = 0 and enter only through the band. For linear algebra, E_LINALG32
      says row_ops "is the wrong proxy for the dense matrix's cost" (the
      dense scan is uncounted), so even w = 1 under-prices it. Both are small
      here (factor-base natives under 1% of plan GAE at w = 1; LA wall about
      1% of solve wall in the r24 sample record). The phase statement should
      still say "priced only in the band".
    evidence: sessions_costmodel.out.json (factor_base_gae_values, linear_algebra_gae_values); research/ic_linalg_pipeline_20261019/README.md "Consequences".
    fix: State it in the README cost model.
  - id: CM-F17
    beat: B5 (planner output text)
    severity: minor
    what: >-
      The planner's verdict and basis strings ("`rho.negation` is cheaper:
      ... about Xx its S"; basis "ecbench GAE, matched rho.negation, at 19.1
      bits ... and 32 bits") do not say that the figure is a w = 0 quotient of
      lower bounds. The x <= 1 branch ("expected below `rho` ... confirm it in
      a paired session") would print a below-rho forecast from lower-bound
      quotients.
    evidence: planner.rs:419-428, 646, 688; plan.rs:149-163; bench.rs --auto eprintln.
    fix: Append "(w = 0 counted unit; both arms lower bounds)" to the basis, and make the x <= 1 branch say that no below-rho claim follows without a fully priced paired session.
  - id: CM-F18
    beat: 'context (6a3605965, outside PR #2343)'
    severity: minor
    what: >-
      6a3605965 ("keep the planner row, refreeze it as pre-gate") added
      "20261020-ic-planner-validation" to benchmarks/PRE_GATE.json. That file
      is described as "Rows present when the validation gate began
      (2026-10-19) ... may only shrink". A row that landed after the gate was
      thereby admitted as "unvalidated (pre-gate)" instead of passing the
      gate. The planner_component, the scoreboard panel and the progress point
      were left unchanged, so CM-F01 and CM-F02 persist on origin/main.
    evidence: git diff e8dc0e534 6a3605965 -- benchmarks/PRE_GATE.json; git show 6a3605965:scripts/validation_gate.py (freeze note, "may only shrink").
    fix: For the Coordinator. Either a VALIDATION.json for the planner row, or remove the grown entry and let the gate rule on it.

