next_concrete_action: >-
  This is the cheapest falsification of "every choice the planner made was the
  better one". Under a frozen amendment, re-run the three registered-curve
  specs unchanged (same binary d0527101..., targets 8, seed 20261021, rounds
  3+1), adding two arms per curve: prime-abscissa:size=round(1.125N) and
  size=round(1.25N), which is 144/160 on r24, 197/219 on r26 and 363/404 on
  r28. Score them with paired intervals at w = 0, 0.1 and 1. The pre-stated
  prediction from this reader's three-point fit is that 1.125N ties the plan
  at w = 0 (0.99-1.01) and beats it at w = 0.1 (0.98-1.00) and w = 1
  (0.93-0.95). If its w = 0 interval contains 1 and its w = 1 interval lies
  below 1, the planner's size is dominated across the band, and the headline
  must be narrowed to "better than each tested alternative". In the same
  session, an m = 3 arm and an unblocked mitm:m=2,negation_folded=1 arm would
  test the oracle choice the campaign did not test. Each existing session
  took 1-4 minutes, so this costs about one more session per curve.

review_attestation:
  joints_owned: [B5 interpretation, B5 cost model, cheapest falsification]
  read_sibling_reports: false
  ran_crypto_code: false
  verdict_on_joint: >-
    breaks in part. The numbers, the matched rho for the six curves, the band
    arithmetic, the leaderboard rows and the planner re-derivation hold. The
    headline's generality, the section 3 class, the progress-point series and
    label, and the planner's support labels and j0/j1728 reference break.
