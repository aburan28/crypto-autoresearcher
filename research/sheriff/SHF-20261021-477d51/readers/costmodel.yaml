blind_from:
  - sibling reader reports under readers/ (none were read)
  - research/sheriff/SHF-20261021-477d51/prior.md and sweep.* (not read)
  - 'the PR #2343 description, review thread and any producer messages'
  - the producer's ecbench outputs as interpretation. I read the saved comparison, band and table files as data, recomputed the band, the paired ratios and the planner outputs from the records and the stated formulas, and never quoted a producer verdict as a result.
  - the `ic plan` binary. No planner output is committed, so every predicted ic_over_rho and base size below was re-derived by hand from the formulas in planner.rs.

checks:
  - id: CM-01
    what: >-
      Matched rho (Q1). For every record of every arm on the six curves:
      curve parameters, j-class, automorphisms_available and _used, cost.unit,
      S == total_gae/sqrt(r), phase GAE summing to total_gae, and lower_bound.
    command: python3 -I scripts/readers/costmodel/sessions_costmodel.py /home/user/crypto/research/ic_planner_validation_20261020 scripts/readers/costmodel/sessions_costmodel.out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/sessions_costmodel.out.json
    result: >-
      holds for the six curves. r24 has a = p-3, b = 31; r26 has a = 26623966,
      b = 14210560; r28 has a = p-3, b = 3, so none is j = 0 or j = 1728. On all
      6 x 8 x 24 measured records, automorphisms_available = 2 and
      automorphisms_used = 2 for rho-neg and every IC arm. Every record uses
      unit ecbench.gae, has S = total_gae/sqrt(r) and has phase sums equal to
      total_gae. Targets and rounds are paired. rho.negation is therefore the
      matched reference for these six curves. Every arm, rho included, is
      lower_bound = true with calibration_pinned_units = [], so every
      IC/rho figure is a quotient of two lower bounds.
  - id: CM-02
    what: Planner rho reference for j = 0 / j = 1728 (Q1), read from the planner code, ecbench's method list and the planner's own GLV citation.
    command: rg -n 'rho.negation|PrimeJ0|PrimeJ1728' src/cryptanalysis/ic_framework/planner.rs; rg -n '"rho.cubic"|"rho.quartic"' src/cryptanalysis/ecbench/methods.rs; git show b4f056101:research/notes/index-calculus/RESEARCH_GLV_INVARIANT_FACTOR_BASES.md (section 6.6)
    output: none (read-only greps; findings CM-F05)
    result: >-
      breaks for the planner, outside the six curves. planner.rs:643-648 names
      rho.negation for Prime, PrimeJ0 and PrimeJ1728 alike. ecbench has
      rho.cubic (sqrt(pi/12)) and rho.quartic (sqrt(pi/8)) (methods.rs:585-586,
      1245-1279). The planner's own evidence, E_GLV section 6.6 (E6), shows
      the matched folded rho takes about sqrt(3) and sqrt(2) fewer steps, and
      classes "every 'vs rho' figure of section 5" as understated. The
      planner's outlook on those classes therefore names an unmatched, weaker
      rho.
  - id: CM-03
    what: Pass/fail or "beats"-style wording about rho in README.md, REPORT.typ, LEADERBOARD section, scoreboard panel, progress point, planner.rs, plan.rs, bench.rs (Q1).
    command: rg -n -i 'beat|pass|fail|cheaper|below|better one' on the listed files; read planner.rs:417-429, plan.rs:148-163, bench.rs (--auto block)
    output: none (greps)
    result: >-
      holds, with minor issues. Gaps to rho are given as distances:
      README.md:73 "Distance remaining to rho", README.md:86-87 "Rho is cheaper
      on every curve, by 12.6x to 25.8x ... These are the distances
      remaining, not a pass/fail gate.", REPORT.typ:51 and :63. The planner's
      verdict is a binary switch at x = 1.0 (planner.rs:419-427): "`{ref}` is
      cheaper: the planned index calculus is expected at about {x:.1}x its S
      ... run the plan only to measure or improve index calculus", otherwise
      "the planned index calculus is expected below `{ref}` ... confirm it in
      a paired session". It carries the magnitude and is a forecast, not a
      gate. The "beat" wording at README.md:25-26 ("No alternative beat the
      plan") compares IC arms with each other, not with rho. Not stated
      anywhere: that every figure is a w = 0 quotient of lower bounds (see
      CM-F03).
  - id: CM-04
    what: >-
      Blind re-derivation of the planner's base sizes and predicted
      ic_over_rho for the six curves, from round(#E^(1/3)/2), the 8 GiB / 24 B
      cap and log-linear interpolation of PRIME_RHO_POINTS, with the planner's
      support labels (Q2).
    command: python3 -I scripts/readers/costmodel/planner_rederive.py /home/user/crypto/research/ic_planner_validation_20261020 > scripts/readers/costmodel/planner_rederive.out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/planner_rederive.out.json
    result: >-
      holds. All 6 base sizes and all 6 predictions reproduce exactly (see
      blind_rederivation). The predictions match the constants hard-coded at
      scripts/summary.sh:10 to machine precision.
  - id: CM-05
    what: >-
      Trace every planner rho table point to a committed artifact (Q2):
      PRIME_RHO_POINTS (planner.rs:368), BINARY_RHO_POINTS (:370-376),
      KOBLITZ_RHO_POINTS (:378-387).
    command: git show b4f056101:research/ecbench_rootfinding_batchtable_20261013/followup/reports/holdout/REPORT.md; git show b4f056101:research/ic_oracle_setup_blocked_20261020/sessions/A-1k-8k/comparisons/rho-neg__blocked-1024.json; python3 -I scripts/readers/costmodel/tableB_check.py docs/ic/leaderboard.json; git show b4f056101:research/ecbench_frobenius_orbit_vs_rho_20261014/README.md
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/tableB_check.out.json
    result: >-
      holds as transcription, with scope caveats. (19.10, 6.6671) comes from
      the holdout REPORT: B48 6,980.417 GAE over matched rho 1,047 GAE =
      6.66706, with log2 562427 = 19.1013. (32.0, 32.955) comes from
      rho-neg__blocked-1024.json: ops 32.95507 [27.67, 40.56], with log2 r =
      31.9999975 on icv1-fp32-t7319-90da43e9. The five binary points equal the
      Table B best ratio_rho (13.069, 10.621, 17.986, 23.025, 38.211) at log2
      r 13.994, 14.998, 19.998, 21.0, 24.415. They are ledger GAE, which the
      planner labels. The eight Koblitz points equal the
      "orbit / rho-frob" column of the Frobenius-orbit README (n13 2.956, n29
      1.566, n17 1.719, n19 2.805, n31 3.664, n23 3.847, n37 5.048, n41
      18.16). Caveats are in CM-F11 and CM-F12. Both prime end points were
      measured at N = 48 and N = 1,024, not at the rule's 41 and 813. Both are
      ecbench "diagnostic only" lower-bound quotients. The holdout rho mean is
      1.575 times its theoretical S.
  - id: CM-06
    what: Interpolation scheme and support labels (Q2), read at planner.rs:327-364, :449-466 and :483-633.
    command: read planner.rs; re-implemented in planner_rederive.py
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/planner_rederive.out.json
    result: >-
      Partly holds. The scheme is piecewise linear in ln(ratio) against log2 r,
      with the end segment's slope used beyond the end points. The rho outlook
      is correctly "interpolated" for all six curves, which lie strictly
      inside 19.10-32.0 and are never within 0.25 of a point. The factor-base
      choice, however, is labelled "measured" for all six through span_support
      over (9.68, 32.0) +- 0.5. Between 23.4 and 32 bits no base-size optimum
      was measured: the 32-bit grid starts at 1,024 against the rule's 813.
      The oracle, targets and linalg supports are hard-coded `Measured` at
      every size (planner.rs:483, 493, 512, 563, 622, 633). PROTOCOL.md:27-28
      says "so each plan is interpolated", which is true of the rho outlook
      only. As a corroboration, the six measured ratios fit a slope of 0.117
      in ln(ratio) per bit, against the planner's two-point 0.124.
  - id: CM-07
    what: Koblitz kappa = 0.6 provenance (Q2).
    command: git show b4f056101:research/ecbench_frobenius_orbit_vs_rho_20261014/PROTOCOL.md (section 3 table, section 1 model); planner_rederive.py koblitz_kappa
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/planner_rederive.out.json
    result: >-
      fitted by hand, neither measured nor derived. The source model (PROTOCOL
      section 1) is n c^2/2 + r/(2 n^2 c), whose optimum is c = (r/(2 n^3))^(1/3),
      that is kappa_model = 2^(-1/3) = 0.794. The eight "chosen" counts come
      from exploratory sessions marked "sessions not kept" (only tables are
      committed under exploration/). They were picked on coarse grids, and two
      are at the grid floor. The kappa windows that reproduce each pick are:
      the six small curves intersect in [0.561, 0.629); n37 needs [0.453,
      0.513) and n41 needs [0.448, 0.453). kappa = 0.6 therefore reproduces the
      six by construction and overshoots the two largest curves by 25-33%,
      which are the curves that matter for extrapolation. The code comment
      (planner.rs:312-315) honestly calls it a calibration. The test tolerance
      0.75-1.34 (planner.rs:833) is just wide enough to admit n41's 1.33.
  - id: CM-08
    what: >-
      Every planner citation (11 Evidence consts, planner.rs:257-300) checked
      against its file at b4f056101 for curve family, size range, metric and
      numbers (Q2). Details are in citation_audit.
    command: git show b4f056101:<path> for each; tableB_check.py for docs/ic/leaderboard.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/tableB_check.out.json
    result: >-
      Numbers transcribed correctly in 10 of 11. Support for the rule each is
      cited for is weaker than claimed in four places: size rule (E_LADDER is
      circular, E_BLOCKED32 has no bracket), oracle reason "4-60x", j0/j1728
      rho (E_GLV contradicts it), and E_LINALG32 "4.75" (the figure sits in
      E_BLOCKED32).
  - id: CM-09
    what: >-
      Cost-model completeness (Q3): unpriced counters per arm, phases present,
      factor-base charging, cold rebuild per record (oracle_setup == N(N+1)),
      relations per column, phase shares of S.
    command: sessions_costmodel.py (as CM-01)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/sessions_costmodel.out.json
    result: >-
      holds as a lower-bound cost model, with gaps that are disclosed. Every IC
      record has phases factor_base, oracle_setup, relations, linear_algebra
      and verify. Descent and recovery sit inside linear_algebra (target
      pinned) plus verify, and the walk's target queries inside relations.
      oracle_setup = N(N+1) GAE on every IC record of every curve, so the setup
      is charged cold, per target, and there is no amortisation claim. The
      factor_base phase is 0 GAE on every record: its Legendre symbols (about
      2N) and square roots (N) are charged only in the band. linear_algebra is
      0 GAE: row_ops is priced only in the band, and E_LINALG32 itself says
      row_ops misses the dense scan. Unpriced counters are five on every IC arm
      except rootfind, which has six (legendre_symbols, lookups, row_ops,
      sqrt_solves, target_guard_probes, plus inversions on rootfind). rho-neg
      has one, canonicalisations, at 3.5k-26.6k per run. rho's partition
      hashes and distinguished-point table work, which section 5a names, are
      not emitted as counters. Plan phase shares are oracle_setup 0.29-0.32,
      relations 0.68-0.71, the rest at most 0.001: the 1:2 split of a counted
      optimum of A N^2 + B/N. Relations per column are 0.53-0.59 for the plan
      and 2.5-3.5 for full rank.
  - id: CM-10
    what: The section 5a band re-priced from the records with the band.rs rule priced_gae(w) = G + w*U, compared with the committed analysis/band-*.json.
    command: sessions_costmodel.py (as CM-01)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/sessions_costmodel.out.json
    result: >-
      holds. The maximum absolute difference from the committed band means is
      7.3e-12 over all arms, weights and curves. README numbers verified:
      double base at w = 1 is 29.6 against 32.3 (r24), 35.1 against 35.7 (r26)
      and 45.1 against 48.4 (r28), that is 2-8% cheaper, and 4-9% cheaper on
      the c-curves.
  - id: CM-11
    what: >-
      Paired, target-clustered bootstrap intervals (own implementation, 4,000
      resamples, seed 477051) of the mean-S ratio at w = 0, 0.1 and 1 for every
      alternative against the plan, and for plan against rho (Q3). The
      campaign computed intervals only at w = 0.
    command: sessions_costmodel.py (as CM-01)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/sessions_costmodel.out.json
    result: >-
      half-base, rootfind, full-rank and random-targets stay above 1 at every
      weight on every curve, so those verdicts survive. double-base / plan at
      w = 1: r24 0.917 [0.837, 1.004], r26 0.982 [0.918, 1.040], r28 0.932
      [0.880, 0.991], c24 0.912 [0.836, 1.014], c28 0.926 [0.860, 1.008], c30
      0.956 [0.914, 0.999]. On r28 and c30 the interval lies below 1.
      plan / rho at w = 0 / 0.1 / 1: r24 14.39 / 14.98 / 17.76, r26 14.56 /
      15.09 / 17.57, r28 21.68 / 22.45 / 25.98, c24 12.56 / 13.09 / 15.58, c28
      21.85 / 22.67 / 26.43, c30 25.78 / 26.67 / 30.68. My w = 0 intervals are
      close to ecbench's (r24 double 1.507 [1.413, 1.612] against ecbench
      [1.397, 1.640]). For plan/rho mine are narrower than ecbench's; I treat
      ecbench's as authoritative at w = 0.
  - id: CM-12
    what: Wall-time comparisons already saved in sessions/*/comparisons (Q3 and Q5). Not a bound; read as a practicality note.
    command: python3 -I scripts/readers/costmodel/comparisons_dump.py /home/user/crypto/research/ic_planner_validation_20261020 > scripts/readers/costmodel/comparisons_dump.out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/comparisons_dump.out.json
    result: >-
      ecbench admitted the wall comparison (L2 pairs, outside the A/A noise)
      for double-base / plan on all six curves. Median wall ratios are 0.703
      [0.655, 0.816], 0.700 [0.641, 0.743], 0.756 [0.666, 0.785], 0.679 [0.554,
      0.779], 0.688 [0.587, 0.801] and 0.734 [0.680, 0.812]. The doubled base
      runs 24-32% faster than the plan everywhere. The wall A/A is 0.956-1.026
      with intervals containing 1. README.md:132-133 says "No IC wall time is
      used ... affects nothing here, since only counts are compared".
  - id: CM-13
    what: >-
      Leaderboard and dashboard changes (Q4). docs/ic/leaderboard.json before
      and after; planner_component rows against analysis/summary.json and the
      specs; LEADERBOARD.md section; scoreboard panel and timeline row; the
