    command: python3 -I scripts/readers/costmodel/leaderboard_diff.py <b4f056101^1:docs/ic/leaderboard.json> docs/ic/leaderboard.json research/ic_planner_validation_20261020/analysis/summary.json research/ic_planner_validation_20261020/specs; git diff b4f056101^1..b4f056101 -- docs/ic docs/*.html scripts/build_ic_leaderboard.py
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/leaderboard_diff.out.txt
