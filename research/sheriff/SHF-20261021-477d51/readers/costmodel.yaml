      and CM-F02.
  - id: CM-14
    what: Context only. What 6a3605965 changed about the planner row.
    command: git show --stat 6a3605965; git diff b4f056101 6a3605965 -- docs/ic scripts/build_ic_leaderboard.py; git diff e8dc0e534 6a3605965 -- benchmarks/PRE_GATE.json docs/ic/validation/PRE_GATE.json
    output: none (read-only git)
    result: >-
      6a3605965 merges main, which carries the 2026-10-19 validation gate
      absent at b4f056101, into the PR line. It leaves the planner_component
      section, the progress point and the scoreboard panel byte-unchanged
      (no "planner" hunk in leaderboard.json, LEADERBOARD.md,
      progress-timeline.json or the scoreboard). It adds a `validation` column
      that renders every Table A-C row "unvalidated (pre-gate)". It also adds
      "20261020-ic-planner-validation" to benchmarks/PRE_GATE.json, whose note
      reads "Rows present when the validation gate began (2026-10-19) ...
      This file may only shrink". That puts a row dated 2026-10-20 into a
      shrink-only pre-gate freeze. It is outside PR #2343 and recorded as
      context (CM-F18).
  - id: CM-15
    what: >-
      Proves-too-much control on the size argument (Q5). Using the per-curve
      three-point fit S(N) = A N^2 + B/N + C (w = 0) over the N/2, N and 2N
      arms, find the base sizes M that the campaign's own x0.5 / x2 test would
      "confirm" (both neighbour ratios > 1.10).
    command: python3 -I scripts/readers/costmodel/proves_too_much.py scripts/readers/costmodel/sessions_costmodel.out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/proves_too_much.out.json
    result: >-
      breaks: the test proves too much. Any M in about [0.78 N, 1.41 N] passes
      (r24 [0.82, 1.41], r26 [0.79, 1.38], r28 [0.78, 1.32], c24 [0.82, 1.41],
      c28 [0.79, 1.35], c30 [0.75, 1.26]), including sizes whose fitted S is
      6-9% above the fitted optimum. The design cannot tell the planner's N
      from clearly suboptimal sizes. This is model-based, a pointer rather than
      a measurement.
  - id: CM-16
    what: >-
      Where the counted optimum sits (Q3 and Q5). The same three-point fit gives
      N* = (B/2A)^(1/3) at each weight and predicts S(kN)/S(N) for
      k = 1.125, 1.25, 1.5.
    command: sessions_costmodel.py (as CM-01)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/costmodel/sessions_costmodel.out.json
    result: >-
      At w = 0, N*/N = 0.99-1.09 and S(N*)/S(N) >= 0.991: the size rule sits at
      the counted optimum to within 10% in N and 1% in S, which supports
      "right for the counted unit". At w = 0.1, N*/N = 1.06-1.16. At w = 1,
      N*/N = 1.46-1.54 with S(N*)/S(N) = 0.84-0.89. Predicted S(1.125N)/S(N)
      is 0.99-1.01 at w = 0, 0.98-1.00 at w = 0.1 and 0.93-0.95 at w = 1. A
      base about 12% larger is therefore predicted to tie at w = 0 and win at
      w > 0, that is, to dominate the plan across the band.

citation_audit:
  # Each rule in planner.rs, its evidence, and whether the cited file supports it as used.
  - rule: 'prime.factor-base.family-optimum (planner.rs:447-505). N = round(#E^(1/3)/2), capped at floor(sqrt(max_table_bytes / 24 or 40 B)); support span (9.68, 32.0) +- 0.5 (planner.rs:306, 327-333)'
    evidence:
      - E_LADDER docs/ic/LEADERBOARD.md: >-
          The numbers hold (11 of 13 rows; 5.47-13.5x prime; 10.6-38.2x
          binary). The file does not support the size rule. Table B's
          "balanced" prime bases are the rule's own output (columns 5, 13, 20,
          32, 51, 74, 111 = round(#E^(1/3)/2) on every balanced row; see
          tableB_check.out.json). Table B never ran a smaller base. Its only
          other sizes are 2-3.5x larger, and at fp12 (11.9 bits) the 2x base
          beat the rule's base (5.47x against 5.80x rho).
      - E_HOLDOUT20 (20-bit holdout REPORT.md): >-
          Holds, as the only bracket. The rule gives 41 at r = 562427. Measured:
          B48 < B64, and B48/B40 = 0.917 [0.823, 1.015], not separated, so the
          optimum lies at 40-48. Numbers match: '6,980 / 7,613 / 7,970 GAE,'
          B48/B64 0.876 [0.819, 0.937], 6.67x rho.
      - E_BLOCKED32 (research/ic_oracle_setup_blocked_20261020/README.md): >-
          The numbers hold. It does not support the size rule at 32 bits. The
          grid is 1,024-16,384, the rule gives 813, and S rises
          monotonically from the grid floor, so no optimum is bracketed. The
          test planner.rs:736-737 leans on "the unrecorded pilot put the
          optimum between 768 and 1,024", a non-committed source.
      - E_GLV (j0/j1728 only): '"S moves only 1.00-1.13x (table 85-99% of S)" holds (section 5.1-5.2).'
    verdict: >-
      Partly supported. Measured at 20 bits, one-sided at 9.7-23.4 bits, and
      unmeasured at 23.4-32 bits, yet labelled "measured" there. The campaign
      itself (CM-16) is now the best evidence that the rule sits at the w = 0
      optimum for 23.5-29.6 bits.
  - rule: 'prime.oracle.blocked-table / folded-table (planner.rs:474-496). The reason reads "m = 2 beats m = 3 and root finding by 4-60x in S; blocked builder 2-8x faster"'
    evidence:
      - E_LADDER_JSON: 'm=2 beats m=3 on every row (holds). On the prime rows the margin is 1.05-3.2x, not >= 4x.'
      - E_ROOTFIND: '"310-2,775 S against the pair table''s 10-44" holds (9.96-43.7), which is a 31-64x margin. "rootfind-subtract equals subtract in counted operations" holds.'
      - E_SWEEP20: '42.4x is subtract against the table (holds, though it is subtract, not rootfind).'
      - E_BLOCKED32: 'identical counts; set-up wall 2-4x against batched and 4-8x against scalar (holds). This is a wall-time choice with no S consequence.'
    verdict: >-
      Supported as "pair table at m = 2". The lower bound of the "4-60x"
      range is not traceable (m = 3 is 1.05-3.2x on prime rows). The builder
      choice is wall-only.
  - rule: 'targets.walk (planner.rs:507-515, 558-565)'
    evidence:
      - E_LADDER_JSON: 'walk beats random on every Table B row; 8.93x against 76.69x at fp18 (holds).'
    verdict: >-
      Supported at 9.7-24.4 bits. The support is hard-coded `Measured` at
      every size, which contradicts planner.rs:9-11.
  - rule: 'binary.factor-base.family-optimum (planner.rs:525-549). Dimension round(log2 #E / 3)'
    evidence:
      - E_LADDER: >-
          The ratios hold. Table B's balanced binary bases have 30, 62, 134 and
          254 points (about #E^(1/3)/2). If roughly half of a subspace's
          x-values are abscissae, the planner's dimension is one higher (about
          2x the base) on 4 of 5 rows. The comment at planner.rs:526 ("2^l
          abscissae, 2^(l+1) points") assumes every x is an abscissa.
    verdict: 'inconclusive. Not exercised by the campaign; needs `ic plan --binary-degree 18|21|24|27` against Table B.'
  - rule: 'koblitz.factor-base.frobenius-orbit (planner.rs:569-590). c = max(1, round(0.6 (r/n^3)^(1/3)))'
    evidence:
      - E_FROB_PROTOCOL: 'the chosen counts 1, 1, 2, 3, 1, 2, 8, 90 hold. kappa = 0.6 is fitted (CM-07). The model constant is 0.794.'
      - E_FROB: '"orbit base beats subspace 2-15x" holds (orbit / negfold 0.065-0.511).'
    verdict: 'Supported as a calibration on small curves. It is biased high at n37 and n41.'
  - rule: 'koblitz.oracle.frobenius-table and koblitz.targets.stride-renew (planner.rs:591-611)'
    evidence:
      - E_FROB: 'renew / walk 0.40-0.75 for log2 r <= 21 and about 1 above (holds). The code threshold is 21.5.'
    verdict: 'supported'
  - rule: 'linalg.target-pinned (OneTarget; planner.rs:614-625)'
    evidence:
      - E_SWEEP20: '0.431 [0.399, 0.470] holds.'
      - E_BLOCKED32: 'about 0.5 relations per column holds (533 at N = 1,024). The "about 4.75 relations per column" for full rank is also in this file.'
      - E_LINALG32: '"0.72-0.25x LA wall, S unchanged" holds. "4.75 per column" is not in this file.'
    verdict: 'Supported. The campaign confirms 0.53-0.59 per column against 2.5-3.5 at full rank.'
  - rule: 'linalg.full-rank-sparse (LogDatabase; planner.rs:626-635)'
    evidence:
      - E_LINALG32 and E_LA_ENGINES: '"2.48-10.40x" holds (2.475 at 16,384; 10.40 at 262,144).'
    verdict: 'supported (wall). The log-database rho outlook is honestly `None`.'
  - rule: 'rho outlook (planner.rs:639-691). Prime to rho.negation with PRIME_RHO_POINTS; binary to rho.negation with BINARY_RHO_POINTS; Koblitz to rho.signed_frobenius with KOBLITZ_RHO_POINTS'
    evidence:
      - E_HOLDOUT20 and E_BLOCKED32: 'both points traced (CM-05). Both are quotients of lower bounds at N other than the rule''s. The holdout rho is 1.575 times its theory value.'
      - E_LADDER: 'the binary points are traced and labelled ledger GAE.'
      - E_FROB: >-
          The Koblitz points are traced, but they are fully priced *_full
          method ids. The planner names rho.signed_frobenius and emits an
          `ic.pipeline` arm (planner.rs:245-251), so a run of its own arm is
          in a different counted unit from its prediction. The source's own
          fit needs ln n (gamma = -1.18; free_r chi2/dof 9.9), while the
          planner interpolates in log2 r alone across curves of different n
          and cofactor.
      - E_GLV, cited for j0/j1728: contradicts rho.negation as the matched reference (CM-02).
    verdict: >-
      Prime outlook holds for generic-j curves at 19-32 bits and is
      corroborated by the campaign's slope. j0/j1728 reference unmatched.
      Koblitz basis mismatched in unit.

blind_rederivation:
  method: >-
    From the statement only: the planner doc table (planner.rs:17-21) and
    the constants PRIME_RHO_POINTS, the cap and span_support, transcribed by
    hand into planner_rederive.py. #E and r come from the frozen specs (r
    curves) and from one record per c curve (prime_search records carry only
    the construction). Nothing from crypto was executed.
  formulas:
    base_size: N = round(#E^(1/3) / 2); cap = floor(sqrt(8 * 2^30 / 24)) = 18,918 (not binding)
    ic_over_rho: exp( ln 6.6671 + (ln 32.955 - ln 6.6671) * (log2 r - 19.10) / 12.9 ); slope 0.123873 per bit (equivalently S_IC/S_rho proportional to r^0.1787)
