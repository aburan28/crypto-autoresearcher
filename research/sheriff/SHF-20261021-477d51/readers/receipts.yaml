checks:
  - id: R1-certificates
    what: >-
      B4.1, every record (1536 = 6 x 256): own short-Weierstrass affine arithmetic.
      [planted]G == target, [recovered]G == target, recovered == planted,
      status == verified, matches_target and matches_planted true, planted in [1, r-1],
      target on the curve; record session_id, env_class_id and binary_sha256 equal session.json;
      record curve_spec equals the frozen spec's curve.
    command: python3 -I scripts/readers/receipts/certs.py /home/user/crypto/research/ic_planner_validation_20261020 scripts/readers/receipts/certs_out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/certs_out.json
    result: >-
      pass. 1536/1536 records have status verified and [k]G == Q; 0 failures across all
      per-record checks. Per arm, every session has 32 records (8 targets x 4 rounds) for
      each of rho-neg, plan, half-base, double-base, rootfind, full-rank, random-targets, plan-aa.
  - id: R2-instance-identity
    what: >-
      B4.2, per curve: p and r prime by trial division to isqrt (a proof at these sizes;
      sympy agrees); G on the curve; [r]G == O; Hasse (p+1-r)^2 <= 4p; r^2 > 16p, so exactly
      one multiple of r lies in the Hasse interval, hence #E == r (cofactor 1) and Q in <G>;
      a, b != 0; disc != 0; j not in {0, 1728}, so Aut(E) = {+-1} (p > 3) and rho.negation
      (A = 2) is the matched rho, consistent with automorphisms_available 2; the ICV1 model
      hash, trace, order and j field and the slug recomputed from my own (p, a, b).
    command: (same script, curve block)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/certs_out.json (sessions[].curve)
    result: pass for all six curves.
    curves:
      c24: {construction: "prime_search bits 24 seed 3 -> find_prime_order_curve(24, 3)", p: 11647319, a: 9640543, b: 5164058, r: 11649061, G: [0x4ef095, 0x3b04c4], trace: -1741, j: 2066161, icv1: "ICV1:fp-11647319:-1741:11649061:2066161:unk:unk:r:7eb5536e9236", registered: false, ab_source: "solved from G and a recorded target, then checked against all 8 targets and the ICV1 model hash"}
      c28: {construction: "find_prime_order_curve(28, 1)", p: 216767363, a: 28556749, b: 85253558, r: 216772169, trace: -4805, j: 76291651, registered: false, ab_source: same}
      c30: {construction: "find_prime_order_curve(30, 1)", p: 826809979, a: 814559113, b: 519232406, r: 826801823, trace: 8157, j: 382281034, registered: false, ab_source: same}
      r24: {construction: prime_explicit, p: 16777199, a: "16777196 (= -3)", b: 31, r: 16782299, G: [2, 5412647], trace: -5099, j: 3786696, slug: icv1-fp24-tm5099-a6f137c6, ec1: EC1P24Cfph095cb65c0da0, registry_source: "registry.json curves[334]; equals ic-frontier-fp24 in research/ic_frontier_campaign_20261015/prime_curves.json"}
      r26: {construction: prime_explicit, p: 42652151, a: 26623966, b: 14210560, r: 42653927, G: [40895024, 26279521], trace: -1775, j: 38191413, slug: icv1-fp26-tm1775-7e8fb6df, ec1: EC1P26Cfph73708d649015, registry_source: "registry.json curves[413]; docs/curves/sources/generated.json curves[7]"}
      r28: {construction: prime_explicit, p: 268435399, a: "268435396 (= -3)", b: 3, r: 268407199, G: [1, 1], trace: 28201, j: 161059857, slug: icv1-fp28-t28201-65099091, ec1: EC1P28Cfph697ee600b15e, registry_source: "registry.json curves[503]; equals ic-frontier-fp28 in prime_curves.json"}
    registry_check:
      command: python3 -I scripts/readers/receipts/registry_check.py <scratch copies of the 3 git blobs> /home/user/crypto/research/ic_planner_validation_20261020/specs
      output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/registry_check_out.txt
      result: "pass: p, a, b, r, gx and gy of each r spec are all present in its registry entry"
  - id: R3-target-law
    what: >-
      B4.3, recompute every planted scalar from the law as read in workload.rs:948-954 and
      canonical.rs:128-132, i.e. k = 1 + u64_be(sha256('{"domain":"uniform_scalar_sha256_v1","parts":[model,r,seed,index]}')[0:8]) mod (r-1),
      where model = int(last ICV1 field, 16). Also recompute workload_id and workload_sha256
      from the identity view (workload.rs:1115-1133).
    command: (certs.py, planted_ne_target_law and workload_id_recompute checks)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/certs_out.json (planted_by_target_index)
    result: >-
      pass. 1536/1536 planted values equal the law; 48/48 workloads' ids recompute. Example:
      r24 index 0, model 0xa6f137c66052, r 16782299, seed 20261021 gives k = 8794004,
      matching the record.
  - id: R4-target-independence
    what: B4.3, can the solver see planted? Code-path reading only.
    command: "grep -rn planted_scalar|TARGET_LAW|target_seed|.planted over src/cryptanalysis/{ecbench,ic_framework,ic_boundary.rs}, src/bin/ecbench.rs; read record.rs:48-61,139-173; methods.rs:1030-1041,1097-1104,2170-2172; ic_framework/mod.rs:322-331,621; runner.rs:719-727"
    output: (inline)
    result: >-
      pass at the code-path level. The child gets {curve spec, target_seed, target_index,
      method, seed} on stdin (record.rs:48-61) and rebuilds the workload, so it computes k
      in its own address space (record.rs:139-144 -> workload.rs:1038). It then calls
      methods::solve(&m, &inst, &w.curve, &w.target, seed) (record.rs:167-173), whose
      signature carries no k, seed index or target_seed (methods.rs:1097-1104).
      rho.negation receives (group, G, Q, r, seed, cap) (methods.rs:1030-1041). ic.pipeline
      passes u64::MAX as planted (methods.rs:2170-2172), and run_pipeline uses it only for
      the post-hoc verified flag (ic_framework/mod.rs:621). Nothing under ic_framework/ or
      ic_boundary.rs references the target law. The k == planted check is in the parent
      (runner.rs:720). Isolation is by function signature, not by process (finding F6).
  - id: R5-seals
    what: >-
      B7.1-B7.3, my reimplementation per session: records_sha256 = sha256(records.jsonl)
      (runner.rs:655-659); plan_sha256 = sha256(plan.json) and host_sha256 = sha256(host.json)
      (runner.rs:162-166, 479, 490); spec_sha256 = sha256(canonical{schema, workloads, arms,
      measurement}) with serde defaults (spec.rs:202-209, 328); spec_id;
      session_id = ECBS1h + sha256(canonical{spec_sha256, host_sha256, plan_sha256, started_unix_ms})[:12]
      (runner.rs:493-501); records_written, executions_planned and status_counts. Run on the
      6 campaign sessions and the 12 f4 sessions.
    command: python3 -I scripts/readers/receipts/hashes.py scripts/readers/receipts/hashes_out.json scripts/readers/receipts/certs_out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/hashes_out.json
    result: >-
      pass for 18/18 sessions: every seal and every session_id recomputes. Campaign:
      c24 ECBS1h4087e7eb1b5a (records 75eb4c4f..., plan fddc7170...), c28 ECBS1haabb242baa49
      (5ee2a294..., 2973abb1...), c30 ECBS1h0d23937f2c51 (c7006cfe..., f592c509...),
      r24 ECBS1hcf6d4ac07e64 (9cab2855..., b4f10111...), r26 ECBS1h339ff9352e64
      (c1bf99b6..., 08427b5d...), r28 ECBS1h7d5230a73add (0e648b16..., b953c8eb...).
  - id: R6-plan-reconstruction-A
    what: >-
      Rebuild each plan.json from spec.json plus the sealed records.jsonl. Arms' resolved
      methods and workloads are copied from records. Executions come from my own expansion
      (spec.rs:283-321): warm-up and algorithm seeds via derive_u64, alternate order. The
      expansion is cross-checked against every record's (seq, round, warmup, arm, workload,
      seed), and the result is serialised as serde_json pretty + newline (json.dumps indent=2,
      ensure_ascii=False).
    command: (hashes.py, plan_from_records)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/hashes_out.json (planA_*)
    result: >-
      pass. 18/18 reconstructions are byte-identical to plan.json and hash to
      session.plan_sha256, with 0 expansion mismatches. This includes all 12 f4 files restored
      in b07d8b877: records/{000,039,095,096,303} share plan fcf62087e7e28675...; K13 cb834a81...,
      K19 2fcaa9d0..., R13 5d36dffe..., R19 6d6ec22d..., n13 cf5f432d..., n19 3893cde8...,
      n23 349f4234....
  - id: R7-plan-reconstruction-B (blind)
    what: >-
      Rebuild each campaign plan.json from the frozen spec plus the method declarations in
      methods.rs only (defaults, family, entry; method id = sha256 of canonical{schema,id,params}).
      Curve facts, ICV1, slug, planted k, target [k]G, workload ids and executions are all
      computed by me. Two inputs are not derived from the spec: (a, b) for prime_search
      curves, which come from R2 because the StdRng curve search is not reimplemented, and
      the registry fields (registered, ec1, curve_uid), which are copied from records.
    command: (hashes.py, plan_from_spec_only)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/hashes_out.json (planB_*)
    result: pass. 6/6 are byte-identical to plan.json and equal session.plan_sha256.
  - id: R8-plan-vs-frozen-spec
    what: >-
      Task 7: session spec.json is byte-equal to specs/<s>.json; plan.json spec_id equals
      session.spec_id; plan arms (name, role, method id, params) equal the frozen spec. Each
      frozen spec is PROTOCOL.md's one-change design (half = ceil(N/2), double = 2N, rootfind,
      full-rank, random targets, A/A control) with 8 targets, seed 20261021, 3+1 rounds,
      alternate order, L2 and 1800 s.
    command: python3 -I scripts/readers/receipts/spec_design.py /home/user/crypto/research/ic_planner_validation_20261020 (and hashes.py)
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/spec_design_out.txt
    result: >-
      pass, 6/6 (N = 113, 300, 469, 128, 175, 323; the PROTOCOL and amendment tables also
      match log2 r 23.47, 27.69, 29.62, 24.00, 25.35, 28.00).
  - id: R9-immutability-campaign
    what: >-
      B7.2: every file under sessions/<s>, <s>.audit.json and specs/<s>.json has exactly one
      commit, its add, on both b4f056101 and origin/main. Each protocol file has exactly one
      commit (git log --follow).
    command: "git log --format=%h <ref> -- <paths>; git log --follow <ref> -- PROTOCOL.md PROTOCOL_AMENDMENT_1.md; git show --name-status <commit>"
    output: (inline)
    result: >-
      pass. c sessions appear only in 93cfcfbea (all A); r sessions only in ce4392f14 (all A);
      specs c* only in 05a0ebd92; specs r* only in d1be0c1c8; PROTOCOL.md only in 05a0ebd92;
      PROTOCOL_AMENDMENT_1.md only in d1be0c1c8. No reseal.
  - id: R10-f4-restoration-legitimacy
    what: >-
      Task 4: did the 12 sessions originally lack plan.json? Were their other files touched?
      Was plan.json ever committed and deleted? Does verify pass only because of the restoration?
    command: "git show --stat 81ab9759e / 71ba41917; git rev-parse <commit>:<path>/{host.json,records.jsonl,session.json,spec.json} at the original commit, 4963f3a90 and b4f056101; git log --all --diff-filter=D -- .../plan.json; git log --all -- .../plan.json; read audit.rs:257-262"
    output: (inline)
    result: >-
      Legitimate. The original commits 81ab9759e (2026-10-19 01:19Z, records/*) and
      71ba41917 (02:13Z, leaderboard_rerun/*) added exactly host.json, records.jsonl,
      session.json and spec.json, never plan.json. All 48 non-plan files are blob-identical
      at the original commit, at 4963f3a90 and at b4f056101; b07d8b877 only adds 12 files.
      No deletion of a plan.json is reachable from b4f056101. --all shows the same 12 blobs
      restored independently on other branches (1be55be54 on claude/f4-session-plans-20261021,
      5ef03c7eb on repair/ci-runner-dependencies-20261021), then removed there in e8204813d
      ("Defer identical plan restoration to PR 2356"); blob ids are equal. The restored bytes
      hash to plan_sha256 sealed two days earlier and bound into session_id (R5), and my
      record-based reconstruction is byte-identical (R6). So the files are the original
      plan.json bytes, barring a SHA-256 second preimage, whatever tool wrote them; hand
      editing to match is ruled out. ecbench verify's plan_hash check (audit.rs:257-262)
      fails without plan.json, so verify now passes on these 12 sessions only because of
      the restoration. That is acceptable because the restored content is provably original.
      See F3 and F4.
  - id: R11-freeze-order-and-code-binding
    what: >-
      Task 5: ancestry; runtime commit; source identity of the binary inputs between the
      planner commit, both freezes and both session sets.
    command: "git merge-base --is-ancestor; git rev-parse <c>:src (tree) and blobs of planner.rs, ic/plan.rs, ic/bench.rs, docs/curves/registry.json (include_str! in workload.rs), src/cryptanalysis/curve_aliases.json at a29bead23, 05a0ebd92, b95d051cc, fed341c5d, d1be0c1c8; git diff --name-status over src Cargo.toml Cargo.lock build.rs crates docs/curves"
    output: (inline)
    result: >-
      pass. 05a0ebd92 is the parent of 93cfcfbea and d1be0c1c8 the parent of ce4392f14;
      93cfcfbea, d1be0c1c8 and ce4392f14 are ancestors of b4f056101 and origin/main.
      session.json and host.json record runtime HEAD 05a0ebd92 (c) and d1be0c1c8 (r), clean.
      A run cannot name a commit hash before that commit exists, so each protocol was
      committed before its sessions ran. The only exception would be fabricated session
      files, which is what replays bound. The src/ tree is 62d3853c2887 at a29bead23,
      05a0ebd92, fed341c5d and d1be0c1c8; planner.rs a60efcdd, plan.rs d6c28144, bench.rs
      d6ef4bd0, registry.json e0c17627 and curve_aliases.json 49da715f are identical. The
      only docs/curves change between the freezes (cover-transfer-assessments.json) is a
      path string in src/bin/ecdlp_audit.rs:117, not compiled into ecbench. The identical
      binary_sha256 d05271011cd7... across all six sessions is therefore consistent with
      unchanged sources. It is not verified, because no build was allowed (NC2), and the
      binary carries no embedded build commit (F5).
  - id: R12-producer-audits
    what: >-
      Task 6: what the six *.audit.json claim; whether the auditor is independent; which
      records were replayed.
    command: python3 -I scripts/readers/receipts/audits.py /home/user/crypto/research/ic_planner_validation_20261020 scripts/readers/receipts/audits_out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/audits_out.json
    result: >-
      Each audit reports ok true, all 12 checks true, 256 verified of 256, and 12 replays at
      seq 64, 80, ..., 240, all "identical". The file hashes in each audit match the files on
      disk. The auditor is not independent: auditor_binary_sha256 equals the producer's
      binary, auditor_env_class_id equals the session's ECBENV2h2196cccd7a31, there is one
      hardware class ECBHW1h0832b230440b, and the audits ran 15-40 s before the session
      commit. Replayed arms in every session: plan-aa x8 and rho-neg x4. The plan candidate
      and the five one-change baselines were never replayed. Cause: audit.rs:489-499 takes
      candidates[j*192/12], a stride of 16 = 2 workload blocks of 8 arms, so it always lands
      on the first execution of a block, which under alternate order is arm 7 (odd rounds)
      or arm 0 (even rounds). Simulation: --replay 12, 24 and 48 alias; only 192 covers
      every arm.
  - id: R13-plan-vs-plan-aa-determinism
    what: >-
      Does replaying plan-aa witness plan? Both have the same method_id and the same seed per
      (workload, round), so a deterministic pipeline must give identical counts.
    command: python3 -I scripts/readers/receipts/aa_determinism.py /home/user/crypto/research/ic_planner_validation_20261020 scripts/readers/receipts/aa_determinism_out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/aa_determinism_out.json
    result: >-
      192/192 plan and plan-aa pairs are identical in recovered, total_gae, phases (wall
      excluded), counters, field_ops and factor_base. The 8 plan-aa replays therefore cover
      the plan arm transitively. half-base, double-base, rootfind, full-rank and
      random-targets have 0 replays.
  - id: R14-ci-replay-coverage
    what: Does any other-host replay of these sessions exist or run in CI?
    command: "grep -n replay/verify .github/workflows/ecbench.yml .github/scripts/ecbench-audit-sessions.sh"
    output: (inline)
    result: >-
      No. PR CI and the weekly lane run --replay 0 (integrity only) on every session found by
      schema (ecbench-audit-sessions.sh:78). The exhaustive "replay on this host" lane lists
      fixed directories (ecbench.yml:413-421) that do not include
      research/ic_planner_validation_20261020. crypto AGENTS.md section 12 says "CI re-audits
      them with replays on another host", and that is not true for this campaign.
  - id: R15-comparisons-bound
    what: >-
      The 42 comparisons/*.json: session_id, measured counts, per-arm mean S, per-workload
      means and the ops ratio mean_b/mean_a, recomputed from the sealed records. The CI and
      cluster method are B6 and were not checked.
    command: python3 -I scripts/readers/receipts/comparisons_bind.py /home/user/crypto/research/ic_planner_validation_20261020 scripts/readers/receipts/comparisons_bind_out.json
    output: research/sheriff/SHF-20261021-477d51/scripts/readers/receipts/comparisons_bind_out.json
    result: pass, 42/42 with 0 mismatches (relative tolerance 1e-9).

blind_rederivation:
  statement: >-
    From the six frozen specs/<s>.json and the ecbench definitions alone (target law, ICV1
    model, method resolution, plan expansion, canonical codec), derive: the planted scalars
    and targets [k]G; the workload ids; the plan.json bytes and plan_sha256; spec_sha256 and
    session_id; and the count of records whose recovered k satisfies [k]G == Q on the
    independently verified curve.
  derived:
    kG_eq_Q_verified: "1536 of 1536 (6 x 256); 0 wrong answers; 48 distinct workloads, all planted k equal to the law"
    curves_proved: "6/6 prime p and prime r by trial division; #E = r (Hasse plus r^2 > 16p); j not in {0, 1728}"
    plan_sha256_blind: >-
      6/6 byte-identical plan.json rebuilt from spec plus method declarations (inputs not from
      the spec: prime_search (a, b) solved from recorded points, and registry flags) -
      c24 fddc717074157fbe..., c28 2973abb1ee1589d4..., c30 f592c509848389db...,
      r24 b4f10111ca63349d..., r26 08427b5d6807a2c4..., r28 b953c8ebdf593c2d...
    spec_sha256: "6/6 + 12/12 recompute (r24 451f5f1382a1e12e..., f4 records/* b7c45426c378f570...)"
    session_id: "18/18 recompute from (spec_sha256, host_sha256, plan_sha256, started_unix_ms)"
    f4_plan_sha256: "12/12 rebuilt (spec plus sealed records) byte-identical, matching the plan_sha256 sealed in 81ab9759e / 71ba41917"
  blind_from_respected: true
  limits: >-
    The prime_search curve generator (rand StdRng) was not reimplemented. The c-curve (a, b)
    were solved from recorded points, then fixed by 9 points per curve and by the ICV1
    model hash. The f4 Koblitz public-target workloads were taken from records, not rebuilt
    from the spec.

