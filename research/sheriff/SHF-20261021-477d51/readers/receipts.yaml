findings:
  - id: F1
    beat: B7.4/B7.5 (replay, independence)
    severity: major
    what: >-
      No independent replay exists for any of the 1536 records, and no replay of any kind
      exists for the five one-change baseline arms (half-base, double-base, rootfind,
      full-rank, random-targets). Their operation counts are the denominators of every
      P2/P3 ratio. The producer's audits replayed 12 of 192 measured runs per session with
      the producer's own binary, env class and hardware class, and the stride hit only
      plan-aa and rho-neg (plan is covered transitively, R13). CI runs only --replay 0 on
      these sessions, contrary to crypto AGENTS.md section 12 ("CI re-audits them with
      replays on another host").
    evidence: "audits_out.json (replay_arms {plan-aa: 8, rho-neg: 4} x 6; auditor_binary/env equal to the producer's); audit.rs:489-499; .github/scripts/ecbench-audit-sessions.sh:78; .github/workflows/ecbench.yml:413-421; aa_determinism_out.json"
    fix: >-
      Run NC1 (--replay 192 on another host class) for all six sessions and commit the
      receipts beside the sessions, or add research/ic_planner_validation_20261020/sessions/*/
      to the exhaustive replay lane in ecbench.yml. Until then, the comparison figures are
      producer-only receipts. The answers themselves are independently certified (R1).
  - id: F2
    beat: B7.4 (replay design, systemic)
    severity: minor
    what: >-
      ecbench verify --replay N picks evenly spaced candidates (audit.rs:489-499). With k
      arms and alternate order, any N whose stride is a multiple of 2k lands only on the
      first arm of a block. That means arm 0 or arm k-1, so the reference or control is
      replayed and the candidates and baselines are not. For 8 arms, --replay 12, 24 and 48
      alias. This is a repository-wide blind spot, not specific to this PR.
    evidence: "audits_out.json; simulation in this report (R12): replay 12 -> {0: 4, 7: 8}, 24 -> {0: 8, 7: 16}, 48 -> {0: 8, 3: 16, 4: 8, 7: 16}, 192 -> all arms"
    fix: Stratify replays by arm (at least one per arm per curve), or sample from a nonce drawn after the session seal, as tools/runbook.py audit does.
  - id: F3
    beat: B7.2 (immutability)
    severity: minor
    what: >-
      b07d8b877 adds a file (plan.json) to 12 sealed f4 session directories two days after
      they were committed. The content is provably the original: sha256 equals the
      plan_sha256 sealed in 81ab9759e / 71ba41917, every other file is blob-identical, and an
      independent rebuild matches byte for byte (R5, R6, R10). The run directories are still
      formally modified after creation. The restoration is recorded only in a commit
      message, and ecbench verify passes on these sessions only because of it.
    evidence: "git show --stat 81ab9759e / 71ba41917 (no plan.json); b07d8b877 (12 A); hashes_out.json planA_* and plan_sha256_ok; audit.rs:257-262"
    fix: >-
      Record the restoration in the session tree (for example a RESTORED.tsv next to
      docs/ecbench/INCOMPLETE_SESSIONS.tsv: path, restored-at commit, sealed plan_sha256,
      method). Add a commit-time check that a committed ecbench session directory contains
      plan.json, so it is never committed without it again.
  - id: F4
    beat: B7.1 (code binding), pre-existing
    severity: minor
    what: >-
      All 12 f4 sessions carry git_commit null and git_dirty null, with options cpus none
      and allow_busy true. Their only code binding is binary_sha256 (923dfc7a10dd for 8 of
      them; 4 bisect binaries for records/000, 039, 095 and 096). This predates PR #2343,
      but the PR makes these sessions pass verify.
    evidence: session.json of each of the 12 (listed in hashes_out.json)
    fix: Pin each binary_sha256 to a commit (bisect logs or a rebuild) in the f4 README; do not cite their wall time.
  - id: F5
    beat: B7.1 (code binding)
    severity: minor
    what: >-
      The campaign binary had no embedded build commit: host.json build.git_commit_source is
      runtime_worktree (host.rs:410-425). session.git_commit is the worktree HEAD at run time
      (05a0ebd92 / d1be0c1c8, clean), not the binary's build commit. The identical
      binary_sha256 across all six sessions is consistent with the identical src/ tree and
      embedded registry (R11), but a stale binary from before a29bead23 is excluded only by
      the operator's word until NC2 runs.
    evidence: "sessions/*/host.json build block; host.rs:410-425"
    fix: Build with the embedded-commit path (embedded_git_commit) for evidence sessions, or run NC2 and record the result.
  - id: F6
    beat: B4.3 (target independence)
    severity: minor
    what: >-
      Planted-target isolation is by function signature, not by process. The measured child
      derives k itself (it receives target_seed and target_index and rebuilds the workload)
      and holds w.planted in memory while the solver runs. No solver path reads it (R4), and
      every answer is independently correct (R1), so the risk is only to cost figures, not
      to correctness.
    evidence: "record.rs:48-61, 139-144, 167-173; workload.rs:1038; methods.rs:1097-1104, 2170-2172"
    fix: Send the child Q (and the curve) instead of (target_seed, target_index), or drop planted before solve, and keep the k == planted check in the runner (runner.rs:720).
  - id: F7
    beat: B4.2 (instance identity)
    severity: minor
    what: >-
      The c24/c28/c30 frozen specs pin a curve only through find_prime_order_curve(bits, seed)
      and its StdRng (ic_boundary.rs:3930-3975), so the frozen spec names a curve only
      together with a rand-crate version. Records carry p (inside ICV1), r, G and the ICV1
      model hash, but not a and b.
    evidence: "certs_out.json curve_source; workload.rs:470-600 (CurveFacts has no a, b)"
    fix: Record a and b in CurveFacts, or freeze the generated curve as prime_explicit. This reader reports the generated (p, a, b) in R2.

notes_for_other_joints:   # observations outside B4/B7, routed rather than judged
  - "B6: PROTOCOL_AMENDMENT_1.md was frozen after the c sessions were committed. It makes the r sessions primary and the c sessions supplementary, and its stated reason is curve registration (AGENTS.md section 11). Predictions P1-P5 and the decision rule are declared unchanged, and PROTOCOL.md has a single commit. Whether re-designating the primary after seeing c data is admissible is for the B6 reader."
  - "B5/B1: r24 and r28 are exactly ic-frontier-fp24 and ic-frontier-fp28 of research/ic_frontier_campaign_20261015/prime_curves.json. planner.rs does not cite that campaign (grep of research/ paths), but whether any study it cites used these two curves, against the amendment's 'none is in the planner's evidence', is for the planner-evidence reader."
  - "Prior item 1 (amendment committed with or after data) is not borne out: d1be0c1c8 is data-free, the r sessions ran at runtime HEAD d1be0c1c8 about 5 minutes later, and fed341c5d (same second) touches only docs/curves and curve_aliases.json."

