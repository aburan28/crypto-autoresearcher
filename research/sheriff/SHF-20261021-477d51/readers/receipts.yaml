review_attestation:
  joints_owned: [B4 certificates, B7 provenance/integrity/replay, B6/B7 freeze order]
  sources_read: see sources_read above (complete)
  read_sibling_reports: false
  blindness: "blind_from honoured; PROTOCOL files read after the blind checks; b07d8b877 commit message seen (disclosed)"
  verdict_on_joints: >-
    holds for certificates, instance identity, target law, seals, plan reconstruction and
    freeze order. inconclusive for replay and independence (F1 major: no independent
    replay, baselines never replayed). not_covered for the binary hash.
  procedure_deviations:
    - "Three git blobs outside the sparse checkout were read with git cat-file (prime_curves.json, registry.json, generated.json). Git 2.43 cannot suppress lazy fetch, so at most these 3 blobs were fetched."
    - "Task 6 suggested --replay 24 in the covering command; I record --replay 192 because 24 aliases to two arms (R12)."
