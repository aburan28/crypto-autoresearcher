  findings:
    - id: V1
      beat: B2
      severity: blocker
      claim_ids: [C1]
      what: >-
        Both STARK verifiers still accept proofs of false statements. stark_v2: the Fiat-Shamir
        transcript (transcript_to_fri, stark_v2.rs:226-240) absorbs only FS_TAG, the trace
        commitment and the composition commitment, never the public boundary values, n, the
        transition, beta or q; a prover picks the public input after alpha1, alpha2 so the boundary
        pole cancels, and stark_v2::verify accepts (N8a fast and default configs, N8b row-6
        boundary; control N8c with v+1 rejected). Deterministic, not probabilistic. stark v1:
        the verifier takes q from the proof (stark.rs:504), so a false output proved with q=1 is
        accepted (N7a), a rejected 20-query forgery cut to 3 queries is accepted (N7b), grinding
        two broken rows at q=20 succeeds (N8b, attempt 107), and zero-fold FRI is accepted (N5c).
        v1 is documented as a spot-check that may not back a claim. Reproduced by the session
        (new-mutants.session-rerun.jsonl). The original four mutants are now rejected.
      evidence: [research/sheriff/SHF-20261017-e4d7f6/scripts/readers/stark/new-mutants.jsonl, research/sheriff/SHF-20261017-e4d7f6/scripts/readers/stark/new-mutants.session-rerun.jsonl, research/sheriff/SHF-20261017-e4d7f6/scripts/readers/stark/new-mutants/src/main.rs]
      fix: >-
        Absorb the full statement (boundary values and positions, n, AIR identifier, beta, q)
        into the transcript before alpha1; fix q and FRI depth in the verifier for v1; add the
        frozen-heart, query-count, truncation and grinding mutants as negative tests. Until then
        mark both modules unsound in their docs and README:484.
    - id: V2
      beat: B2
      severity: major
      claim_ids: [C2]
      what: >-
        stark_v2.rs:34-41 states q·log2 β bits (240 default, 40 fast). That bound does not hold for
        a verifier that accepts frozen-heart forgeries, ignores SHA-256's ~128-bit collision bound,
        and 'proven bounds are about half' has no formula.
      evidence: ["crypto:src/zk/stark_v2.rs", research/sheriff/SHF-20261017-e4d7f6/readers/stark.yaml]
      fix: "Withdraw the bit figure until V1 is fixed; then state the conjectured and proven bounds with formula, hash cap, field size and grinding."
    - id: V3
      beat: B2
      severity: minor
      claim_ids: [C2]
      what: >-
        Residual verifier defects: v1's (1-k/n)^q text assumes a q the verifier does not enforce and
        'caught with probability about q/n' exceeds 1 at the sizes used; the last FRI root and final
        constant are not absorbed (zeroed last root accepted, M1); non-canonical encodings v+r are
        accepted (M2); an opened value of 2^300 panics instead of returning false; no out-of-domain
        sample; README:484 has no 'unsound' marker; the module tests miss frozen heart, wrong AIR,
        duplicated query and v1 query count.
      evidence: [research/sheriff/SHF-20261017-e4d7f6/readers/stark.yaml]
      fix: "Absorb every commitment, reduce and range-check opened values, return false on malformed input, and add the missing negative tests."
    - id: CI1
      beat: B7
      severity: major
      claim_ids: [C5, C11]
      what: >-
        In crypto-autoresearcher, 19 of 22 GitHub Actions workflows are disabled_manually,
        including validate, lean-verification and main-health (most since 2026-10-12); only
        scoped-evidence and two dynamic Copilot workflows are active. The last lean-verification
        run (152, 2026-10-12) was cancelled. PRs #2296 and #2298 ran only Cursor checks. So the
        ledger gate, the formal build and every other repository gate have not run on the fixes,
