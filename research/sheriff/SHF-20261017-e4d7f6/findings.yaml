    all (deterministic sweep, deep tier) + re-audit of every finding of
    SHF-20261016-3caa6f on origin/main of crypto-autoresearcher, crypto and cryptanalysis
  prior: >-
    Written before reading any fix (prior.md). Expected S1 partially fixed (the four known
    mutants patched, new mutants still accepted); S2, P1, P3-P5 likely fixed in text; L1
    possibly not compiling; L6 workflows possibly never run; M2 count at or above 287;
    R1 not fixed; regressions as new untraced numbers or strong words in the fix PRs.
  supersedes_nothing: "SHF-20261016-3caa6f stays as written; this is a new case (write-once)."
  readers:
