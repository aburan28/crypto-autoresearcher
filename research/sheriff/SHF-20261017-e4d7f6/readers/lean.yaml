findings:
  - id: RL1
    beat: B3.3
    severity: minor
    finding_ids: [L3]
    what: >-
      The repo-wide proof gate's trust manifest still allows native_decide for TreeSplit.Leak.in_gf2_7
      and TreeSplit.Leak.not_in_gf2_3. The reason given, "built on Replay's compiled polyMod", no
      longer holds: both are now `decide +kernel`. While they are kernel-checked, the gate reports
      them `ok`. If either were reverted to native_decide, lean-proof-gate.yml would pass it as
      TRUST. The manifest's own rule says it is "never for a reported theorem of a paper or
      result", yet RESULTS.md:46-47,83 reports Leak as proved. The per-study audit
      (lean/AxiomAudit.lean, kernel list) would still catch a regression.
    evidence:
      - "crypto:tools/lean/trusted-native.txt:1-8"
      - "crypto:tools/lean/AuditAxioms.lean:70-79"
      - "crypto:research/ic_tree_split_structured_v_20261011/lean/TreeSplit/Leak.lean:30-31"
    fix: "Remove lines 7-8 of tools/lean/trusted-native.txt so the repo-wide gate also requires kernel-only axioms for Leak."
  - id: RL2
    beat: B3.4e
    severity: minor
    finding_ids: [L5]
    what: >-
      The narrowing missed TransferBound.lean. Its module docstring, unchanged since the original
      audit (same sha256), still says the two files "together ... say: generic methods cannot see
      the conductor at all (that file)". "Generic methods" is unqualified there, and in this
      study's vocabulary (PROTOCOL.md:21) it includes rho.* and kangaroo.*. This is the claim L5
      narrowed everywhere else.
    evidence:
      - "crypto:research/conductor_gap_cm_pairs_20261010/lean/TransferBound.lean:13-16"
      - "crypto:research/conductor_gap_cm_pairs_20261010/PROTOCOL.md:21"
    fix: "Qualify it as 'methods in Nechaev's model (BSGS-type) cannot see the conductor at all (that file)', with a dated note."
  - id: RL3
    beat: B3.4e
    severity: minor
    finding_ids: [L5]
    what: >-
      The corrected text says that for bsgs.* "S = 1 is a theorem, and a deviation is a harness
      fault" (PROTOCOL.md correction; README §6 says "harness fault (check the control arm
      first)"). The theorem gives pathwise equality on transported instances. That yields equal
      cost distributions only when instances and tapes are identically distributed, so S = 1
      holds in expectation. S is a bootstrap statistic over independently drawn workloads, and the
      recorded BSGS ratios are 0.84 [0.61, 1.32], 0.98 and 1.25, not exactly 1. A 95% interval
      can exclude 1 by chance, at about the nominal rate or more with 4 workloads per curve.
    evidence:
      - "crypto:research/conductor_gap_cm_pairs_20261010/PROTOCOL.md:70-71"
      - "crypto:research/conductor_gap_cm_pairs_20261010/README.md:122-124,188"
      - "crypto:research/conductor_gap_cm_pairs_20261010/lean/GenericInvariance.lean:152-160"
    fix: "Say 'E[S] = 1 is a theorem for BSGS-type arms; an interval excluding 1 is re-sampled and checked against the control arm before it is called a harness fault.'"
  - id: RL4
    beat: B3.4e
    severity: minor
    finding_ids: [L5]
    what: >-
      New text says representation-hashing rho and kangaroo "fall under the second statement"
      (TransferBound). TransferBound's Solver is a deterministic run that must be correct on every
      instance (Solver.correct), with a self-reported cost. within_isogeny_cost bounds the cost of
      a transferred solver, so the best cost across levels differs by at most the isogeny cost.
      It says nothing about the measured S of a given method. A step-capped randomized walk is a
      Solver only after fixing the tape and only if it never fails. Original finding F8 noted the
      same solver-model limits.
    evidence:
      - "crypto:research/conductor_gap_cm_pairs_20261010/lean/README.md:56-59"
      - "crypto:research/conductor_gap_cm_pairs_20261010/lean/TransferBound.lean:55-59,85-98"
    fix: "Say 'any always-correct solver, including rho or kangaroo with a fixed tape that always succeeds, transfers at two isogeny evaluations; this bounds the best cost across levels, not a method's measured S.'"
  - id: RL5
    beat: B3.4e
    severity: minor
    finding_ids: [L5]
    what: >-
      README §5 now calls the ℓ = 8209 rho interval unexplained, with a fresh-seed re-test "still
      open" (131-141). Five lines later it concludes in bold that "No implemented method sees the
      conductor gap" (146), a conclusion that includes rho. The 16-target replication (rho 1.04
      [0.91, 1.19]) supports it, but the open re-test bears on it. This is outside B3, in B6/B8.
      It is flagged so the session can route it.
    evidence:
      - "crypto:research/conductor_gap_cm_pairs_20261010/README.md:131-148"
    fix: "Scope the bold line to 'no implemented method shows a reproducible conductor effect' pending the rho re-test, or run the re-test."
  - id: RL6
    beat: B3.4e
    severity: minor
    finding_ids: [L5]
    what: >-
      A cosmetic issue from the original case (L3-README-mathlib) is unchanged: README.md:79
      introduces both theorems as "Provable now, with Mathlib", but neither file uses Mathlib
      (lean/README.md:3; no imports beyond core).
    evidence: ["crypto:research/conductor_gap_cm_pairs_20261010/README.md:79"]
    fix: "Say 'Provable now in Lean core (no Mathlib needed)'."
  - id: RL7
    beat: B3.3
    severity: minor
    finding_ids: [L3, L6]
    what: >-
      The axiom-audit results are stated but no output is committed. The L6 fix asked for the audit
      log to be committed; it is kept only as CI artifacts (conductor-gap-axiom-audit,
      rootfinding-s3roots-axiom-audit, tree-split-axiom-audit). Those artifacts are
      retention-limited, though lean-proof-gate.yml regenerates receipts weekly. Three texts still
      assert the result: the S3Roots paper Remark ("depends only on Lean's standard axioms"), the
      program paper (lists propext, Classical.choice, Quot.sound) and TreeSplit RESULTS.md:84.
      crypto AGENTS.md asks to "retain the command and output". This is minor if a green run
      exists, and major if none does (the session's run check decides).
    evidence:
      - "crypto:papers/rootfinding-decomposition/rootfinding_decomposition.tex:261"
      - "crypto:papers/ecdlp-index-calculus-program/sections/rootfinding.tex:29-31"
      - "crypto:research/ic_tree_split_structured_v_20261011/RESULTS.md:84"
      - "crypto:AGENTS.md (Mathematical results should include Lean proofs: 'retain the command and output')"
    fix: "Commit the audit output of a green run beside each project (as research/factor_base_designs_20261015/proof_logs/axioms.txt does), or cite the run id and artifact digest in each README."
  - id: RL8
    beat: B3.4e
    severity: minor
    finding_ids: [L1, L2]
    what: >-
      research/THM_QUOTIENT_DESCENT1.md was rewritten in place in three places. The Status line
      went from "not yet formalized" to "PROVED ... formalized as"; the Setting moved from E[2](k)
      to E(k); and the Formal-target block was replaced. The Setting change carries a dated
      correction, and a History paragraph records the stub's removal. The Status change has no
      dated note of its own. AGENTS.md rule 4 says corrections are new records; whether this note
