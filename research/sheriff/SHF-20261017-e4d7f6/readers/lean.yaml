      minting the formal target)" section stands, the target is now minted, and nothing committed
      shows the Sage check was run. Its content is covered by descent_recheck.py Part D and the
      original descent_check.out.
    evidence:
      - "crypto-autoresearcher:research/THM_QUOTIENT_DESCENT1.md:3-6,16-30,67-75,77-96"
      - "crypto-autoresearcher:AGENTS.md:243"
    fix: "If the Coordinator treats research/THM_*.md as immutable, add a superseding correction record. Otherwise add a dated note on the Status line and record (or retire) the Sage check."
  - id: RL9
    beat: B3.4c
    severity: minor
    finding_ids: [L1]
    what: >-
      The theorem's name (translation_descends_iff_two_torsion) and its docstring gloss "(i.e.
      descends through the degree-2 quotient by ι_S)" state the geometric equivalence. The same
      file's header (17-19) says that equivalence is NOT formalized. The proved statement is
      commutation. A citer who reads only the name or the docstring could take it as the
      geometric Lemma.
    evidence: ["crypto-autoresearcher:formal/CryptoResearch/Quotient/TranslationDescent.lean:17-19,29-31"]
    fix: "Reword the docstring to 'commutes with ι_S (descent through the quotient is this, by the prose fibre argument in the note)'. Renaming is optional; the target spec pins the name."

