      conductor_gap or S3Roots, and leanchecker. To settle it, in crypto-autoresearcher run
      ./formal/setup.sh, then python3 tools/rebuild_formal_root.py --workspace formal, lake build,
      lake env lean AxiomAudit.lean and tools/verify_formal_targets.py; in crypto run lake build and
      lake env lean AxiomAudit.lean in each of the three project directories. Green CI runs of
      lean-verification.yml (formal-workspace), tree-split-structured-v-lean.yml,
      conductor-gap-lean.yml and rootfinding-s3roots-lean.yml at or after the audited heads would
      serve as well.
  # ---------------- L1 ----------------
  - id: R-L1-axiom-gone
    beat: B3.2
    command: "python3 -I scripts/hole_scan.py - < files_car.txt  (all 43 tracked .lean files in crypto-autoresearcher; comment/string aware)"
    output: scripts/readers/lean/hole_scan.out
    result: pass
    note: >-
      research/THM_QUOTIENT_DESCENT1.lean is deleted (git diff: D). No tracked .lean file in
      crypto-autoresearcher declares an axiom, and none contains sorry, admit, native_decide,
      unsafe, #exit, implemented_by or extern. The only code-level hits are the elab and run_cmd
      blocks of the two AxiomAudit files, which are audit-only. rg finds the stub's path only in
      immutable records that describe it as a stub (ledger/handoffs/TASK-20260923-aa277e.yaml and
      the EXP-GFPN-05ff43 v1_to_v2 amendment), in the new target notes, and in the .md History.
      No tool or test references the deleted file.
  - id: R-L1-holes
    beat: B3.2
    command: "same scan"
    output: scripts/readers/lean/hole_scan.out
    result: pass
    note: "formal/CryptoResearch/Quotient/TranslationDescent.lean: CLEAN (0 code hits, 0 masked mentions). No metaprogramming."
  - id: R-L1-coverage
    beat: B3.3
    command: "python3 -I scripts/render_root.py /home/user/crypto-autoresearcher (renders the generated root, writes nothing); read formal/AxiomAudit.lean, formal/lakefile.toml, ci_scope.py, lean-verification.yml, verify_formal_targets.py; load the target spec through orchestration.formal.targets"
    output: scripts/readers/lean/render_root.out
    result: pass
    note: >-
      The theorem is in namespace CryptoResearch.Quotient (TranslationDescent.lean:27). The root
      module is generated from the directory and gitignored. Its rendering contains
      `import CryptoResearch.Quotient.TranslationDescent` (23 modules). #audit_project
      (formal/AxiomAudit.lean:31-45) audits every non-internal theorem with prefix CryptoResearch
      and throws on any axiom outside propext/Classical.choice/Quot.sound. lakefile globs
      CryptoResearch.* include the module. In CI, a change under formal/ (except .md and smoke/)
      sets formal_workspace=true (ci_scope.py:76-82). The spec loads through task_from_spec,
      and its theorem_file exists, so verify_formal_targets.py treats it as discharged and runs
      `autoresearch formal verify` (forbidden scan, lake build, project audit, per-theorem
      audit). Its source document research/THM_QUOTIENT_DESCENT1.md exists, so the materialize
      step passes. Whether the job actually ran green is the session's check.
  - id: R-L1-elaboration-by-reading
    beat: B3.1
    command: >-
      Read TranslationDescent.lean:23-46. Fetched Mathlib/Tactic/Abel.lean at the formal/ pin
      7fa22735 (probe/Abel.lean). Checked the two `have key ... := by abel` identities and the
      rewrite chains by hand and in the free abelian group (descent_recheck.py Part C).
    output: scripts/readers/lean/descent_recheck.out
    result: pass
    note: >-
      Plausibly elaborates. Mathlib.Tactic.Abel exists at the pin as a module file (`module`,
      public imports of NormNum.Basic). Importing it from a non-module file is fine, and it brings
      AddCommGroup and nsmul. Forward direction: key is 2•T = (-(0+S)+T) - -(0+T+S), a true
      identity. `rw [key, h 0, sub_self]` turns the goal into x - x = 0 with x = -(0+T+S), which
      sub_self closes. Backward direction: key is -(P+S)+T = -(P+T+S) + 2•T, a true identity. Then
      `rw [key, hT, add_zero]` leaves an rfl goal. A `first | ... | (...; abel)` fallback covers
      rewrite-matching surprises. `- -(...)` parses as subtraction of a negation. Not settled
      without a build: exact rw matching of `h 0` against the goal, which is likely because the
      terms are syntactically identical after instantiation.
  - id: R-L1-a-statement
    beat: B3.4a
    command: "TranslationDescent.lean:31-32 against .md Lemma (36-37), Proof (41-48), Formal target (79-82), and target yaml claim"
    output: null
    result: pass
    note: >-
      ∀ S T, (∀ P, -(P+S)+T = -(P+T+S)) ↔ (2:ℕ)•T = 0. The left side is τ_T∘ι_S = ι_S∘τ_T, pointwise.
      Both directions are covered, and the quantifier order matches the .md proof ("Equal for all P iff
      ... iff 2T = O"). It matches the .md Formal target and the spec's claim symbol for symbol.
      Scope is disclosed: only the group-law identity is proved. "Degree-2 maps are such
      quotients" and "descends ⇔ commutes" remain prose (Lean header 17-21; .md 84-88; spec notes).
  - id: R-L1-b-hypotheses
    beat: B3.4b
    command: "python3 -I scripts/descent_recheck.py, Part A (exhaustive over 13 group shapes, 6172 (S,T) pairs)"
    output: scripts/readers/lean/descent_recheck.out
    result: pass
    note: >-
      The only hypothesis is [AddCommGroup E]; hS is gone. There are 0 counterexamples. On Z/12,
      every S with 2S ≠ 0 (10 of them) satisfies the statement for all T. Not vacuous: on Z/12
      both sides of the iff take both truth values, and the conclusion is not True. It is a
      trivial group identity by design, and the file and note say so ("in any additive
      commutative group").
  - id: R-L1-c-definitions
    beat: B3.4c
    command: "reading"
    output: null
    result: pass
    note: >-
      No self-defined notions. ι_S(P) = -(P+S) and τ_T(P) = P+T are inlined and match .md:16-17,32.
      (2:ℕ)•T = 0 is 2T = O. Cosmetic: the docstring (29-30) glosses commuting as "(i.e. descends
      ...)" and the name says "descends". The header disclaims that equivalence (finding RL9).
  - id: R-L1-d-data
    beat: B3.4d
    command: "n/a"
    output: null
    result: pass
    note: "No constants."
  - id: R-L1-e-scope
    beat: B3.4e
    command: "rg THM_QUOTIENT/translation_descends across crypto-autoresearcher; read .md Status/Formal target/History, target yaml"
    output: null
    result: pass
    note: >-
      .md:3-6 now reads "PROVED (elementary). The Lemma's group-law identity is formalized as
      ..." and .md:84-88 limits the formalization to the computation. No record cites the Lean as
      proving the geometric descent or the Corollary. .md:85-86 says the theorem "is built and
      axiom-audited by the formal-workspace job". That is true of the CI configuration. Whether
      the job ran is the session's check.
  - id: R-L1-proves-too-much
    beat: B3.5
    command: "descent_recheck.py Parts B and C"
    output: scripts/readers/lean/descent_recheck.out
    result: pass
    note: >-
      Six mutants are each FALSE, with a witness: rhs 3•T, rhs 4•T, rhs T=0, no outer negation,
      2•S in place of 2•T, and ι_{S+T} on the right. The proof's two abel keys fail with 3•T in
      place of 2•T, so the script cannot close the 3•T variant. A Lean-level negative control
      (edit 2 to 3 and watch the build fail) is not_covered without a toolchain.
  - id: R-L1-ec-lemma
    beat: B3.4b
    command: "descent_recheck.py Part D: y^2=x^3+x+2 over F_1009 (N=1008) and y^2=x^3+x+3 over F_211 (N=228), R of order 3"
    output: scripts/readers/lean/descent_recheck.out
    result: pass
    note: >-
      This checks the prose Lemma on actual curves with S = 2R, which is not 2-torsion. Fibres of
      φ(P) = x(P+R) are exactly {P, -(P+2R)} for all points. τ_T maps fibres to fibres iff
      2T = O, for 1008/1008 and 228/228 T. 4 resp. 2 descending T, equal to #E[2](F_p). The curve
      facts were re-checked by brute force (N=1008, 3R=O, 2R=-R).
  # ---------------- L2 ----------------
  - id: R-L2-setting
    beat: B3.4c
    command: "Read .md:14-30. Derived by hand. Checked computationally in descent_recheck.py Part D"
    output: scripts/readers/lean/descent_recheck.out
    result: pass
    note: >-
      The corrected Setting is right. An involution σ of E with E/σ ≅ P^1 has σ = α∘(·) + Q with
      α ∈ Aut(E,O). α = 1 gives a translation, whose quotient has genus 1. α = [i] or ζ_3/ζ_6 do
      not square to 1. So α = -1 and σ(P) = -P + Q = ι_{-Q}(P). Q = σ(O) is k-rational when φ is
      defined over k, so S ∈ E(k). "x(P+R) is the quotient by ι_{2R}" holds on both test curves.
      The Lemma is unaffected, as the note says. The correction is dated and cites the case and the
      counterexample. Process note: the paragraph was edited in place with a dated note, not
      superseded by a new record (finding RL8).
