  - id: K2-01-uncharged-phase
    beat: B5.4
    command: "k1k2.py X_sensitivity; README Disclosures; baselines.json uncharged_phases, conventions.cold"
    output: scripts/readers/costmodel/k1k2.out
    result: pass
    note: >
      Factor-base construction is disclosed in the README, the row (uncharged_phases), conventions.cold and
      BASELINES.md. base_source is retained_header in every cP and cS record, and base_load is about 310 ms. The
      sensitivity re-derives: X = 1 s gives R 3.23122 and S 9.71456; X = 10 s gives 3.16286 and 10.02158; X = 60 s
      gives 2.84829 and 11.72724. New fact: pushing R below 2 would need X >= 351.6 s of construction.
  - id: K2-02-section-5a-band
    beat: B5.3
    command: "python3 -I -B scripts/readers/costmodel/band.py <stacked experiment dir>"
    output: scripts/readers/costmodel/band.out
    result: not_covered
    note: >
      Counts are still not emitted, so the band remains uncomputable. The record discloses this as missing
      (section_5a_band; README "No §5a band") with a follow-up in a new protocol. Illustrative pricing from the
      emitted counters (reader estimate, not a measurement), with the IC's own group additions G_IC unknown and
      set to 0. rho: 8.88M group additions plus 17.9M other unpriced operations per point. Stack (kS + cS):
      1.528e9 unpriced IC operations (rank probes, root calls, online probes, index states). IC/rho >= 14.3 at
      w = 0.1 and >= 57.1 at w = 1. At w = 0 the ratio is G_IC / 8.88M, which is unknown. So the order is
      unresolved only at w = 0, and only because G_IC is not emitted. If the IC performs at least about 8.9M
      group additions (e.g. one per logical index state, 29.88M; an unverified guess), the IC is dearer across
      the whole band. IC vs IC: cP/cS is 1.4817 on emitted counters at w = 0.1 and w = 1, and a tie at w = 0.
