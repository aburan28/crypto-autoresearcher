      - "cryptanalysis@HEAD:experiments/koblitz-n83-bl-arm-20261014/README.md:532"
      - "scratch scripts/readers/costmodel/ext/B_precompute_summary.jsonl (setup_total excludes relation_la 51.3 ms)"
    fix: "Add uncharged_phases.factor_base_construction to B's row, and qualify conventions.setup with 'less any phase the row names in uncharged_phases'. New text only; no number changes."
  - id: N2
    beat: B5.2
    severity: minor
    claim_ids: [C19]
    what: >
      ratchet_history[9] adds paired_within_run, but its standard cold_gap/online_gap fields still hold the
      cross-run figures [360.4, 94.4168] and [1.0125, 0.1391]. In entries 6-8 the same fields hold within-run
      paired gaps (0.2047/0.1462 = 1.4001 and so on). A consumer reading cold_gap/online_gap uniformly still sees
      a 7.3x online closure for a step that made online 4.6% slower. The prose (class, reading) says so, and
      BASELINES.md shows the paired figures first, so a human reader is not misled; a machine reader would be.
    evidence: ["cryptanalysis:docs/ic/baselines.json ratchet_history[6..9]"]
    fix: "State in conventions which history entries carry cross-run gaps in cold_gap/online_gap (entries 0-2 and 9), or move the cross-run pair under a context key. A new correction entry, not an edit of the measurement."
  - id: N3
    beat: B7
    severity: minor
    claim_ids: []
    what: >
      New unsupported provenance sentence in experiments/fb-archive/README.md (#942): "their gzip header (OS byte
      3) shows another gzip writer than fbarchive.py's". The three files equal fbarchive.py's compress() output
      byte for byte except the OS byte, and OS 3 is the majority value among indexed archives (2,568 of 2,664).
      It does not affect X2's resolution or any number.
    evidence: ["scripts/readers/costmodel/gzwriter.out", "cryptanalysis:experiments/fb-archive/fbarchive.py:302-307"]
    fix: "Reword: 'same deflate stream as fbarchive.py's writer; only the gzip OS byte differs (a different Python/zlib version)', or drop the sentence."
  - id: N4
    beat: B5.5
    severity: minor
    claim_ids: [C17]
    what: >
      Precision notes; neither overclaims. (a) The "host-independent operation count" 1.4773 counts probes, but
      a kP probe (full canonicalization) and a kS probe (lift_scan) are not the same work. The 2.2837 "per-probe,
      host-specific" factor therefore mixes algorithmic per-probe savings with host effects. The labelling
      understates the host-independent part, which is the conservative direction. (b) s_ic_rank_stage 8.7948
      should round to 8.7949 (8.79486), and "about 1.3" for R < 2 is 1.358.
    evidence: ["scripts/readers/costmodel/k1k2.out", "scripts/readers/costmodel/blind_n83.out"]
    fix: "Optional: when counts are emitted (K2 follow-up), report field operations per probe for both arms, so the 2.28x splits into algorithm and host."

