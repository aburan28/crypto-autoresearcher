conduct_note: >
  No file in any worktree was written. Python ran with -B (and -I where it imports nothing from the tree).
  fbarchive.py verify ran with CC=/bin/false, and pdp-degree-heuristics/build/ was confirmed absent afterwards.
  Two side effects reached the cryptanalysis gitdir, which is a partial clone. Both were reported to the session
  at once, and the session says the clone is its own scratch clone and the packs are harmless.
  (1) A `git show` of an off-sparse blob lazily fetched it and started auto-gc. The gc failed for lack of disk
  and left tmp_pack_on4qFJ (~272 MB) and gc.log; the session has since cleaned them up.
  (2) A `git ls-tree -r -l`, run to size refs.py's inputs, lazily fetched about 1,610 blobs as promisor packs
  (about 98.8 MB, 04:11-04:26 UTC). It changed no worktree file. Every later git call disabled gc.auto.

