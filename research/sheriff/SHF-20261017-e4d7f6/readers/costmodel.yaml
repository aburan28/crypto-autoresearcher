      included" on every row. That is literally true only at n=41/53/61, where v3's setup includes factor-base
      build. Both n=83 rows leave factor-base construction out. B's row also leaves LA (51 ms) out of P_IC.
      The stacked row names its exclusion (uncharged_phases), as the new conventions.cold requires. B's row
      (other_records[11], s_ic_setup 32.848) does not, although B's README:532 records the same exclusion. The
      rank-stage meaning, which K3 is about, is consistent everywhere; this is a residual completeness gap.
    evidence:
