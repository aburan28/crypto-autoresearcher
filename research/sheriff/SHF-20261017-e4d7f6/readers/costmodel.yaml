  - id: K1-01-label-and-op-ratio
    beat: B5.5
    command: "python3 -I -B scripts/readers/costmodel/k1k2.py <stacked experiment dir>; README.md:13-22; baselines.json baselines[4].headline_scope, source_figure, evidence_tier"
