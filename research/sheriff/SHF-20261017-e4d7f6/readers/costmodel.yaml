  - id: K3-01-identity-every-row
    beat: B5.2
    command: "python3 -I -B scripts/readers/costmodel/rows.py docs/ic/baselines.json"
    output: scripts/readers/costmodel/rows.out
    result: pass
    note: >
      s_ic_setup - (s_ic_cold - s_ic_online) is 0 at n=41, 53, 61 and on B's row (other_records[11]), and
      -6.3e-5 (rounding) at n=83. n=19 carries no s_ic_setup (online not separable) and no other_record does,
      so no row holds a conflicting value.
  - id: K3-02-v3-rows-from-source
    beat: B5.2
    command: "python3 -I -B scripts/readers/costmodel/v3rows.py ext/crypto_v3_analysis.json docs/ic/baselines.json"
    output: scripts/readers/costmodel/v3rows.out
    result: pass
    note: >
      The n=41/53/61 rows reproduce from crypto rule v3 analysis.json. s_setup 11.048502 / 16.918616 / 24.852815
      against the rows' 11.0485 / 16.9186 / 24.8528 (|diff| <= 1.6e-5). setup + online equals s_ic_cold within
      4.5e-5, and the cold gaps 7.6571 / 13.2410 / 20.9709 reproduce. Meaning: v3 setup is "select, build,
      collection, the linear algebra and the descent's solver" (crypto s23 PROTOCOL.md:54-55, 187). So relation
      collection, the rank-stage analogue, is inside s_ic_setup, as is factor-base construction ("build").
  - id: K3-03-B-row-from-source
    beat: B5.2
    command: "git show (B result.json, precompute_receipt.json, summary.jsonl); arithmetic recorded in the note"
    output: scripts/readers/costmodel/ext/B_*.json*
    result: pass
    note: >
      B P_IC_ms 549,847.106617 = timing_ms.rank_stage 520,825.444 + timing_ms.setup_total 29,021.662. The
      summary shows setup_total = base_load 179.69 + index_build 28,836.58 + normal_basis_and_selftest 5.40.
      One unit = 180.8195 ns x 92,573,139.235 = 16,739.06 ms, giving rank 31.1144 -> 31.114, setup 1.7338 ->
      1.734, P_IC 32.848, cold 551,237.02 / unit = 32.931 and online 1,389.91 / unit = 0.0830, all matching the
      row. B's 32.848 therefore includes the rank stage, which is the one meaning now stated. Pre-existing
      precision note, not from #942: B's P_IC leaves out LA (51.3 ms) and setup_input_control (32.3 ms), 0.015%
      of P_IC, although B's P_IC_definition names LA.
  - id: K3-04-blind-n83
    beat: B5.2/B9
    command: "python3 -I -B scripts/readers/costmodel/blind_n83.py <stacked experiment dir>"
    output: scripts/readers/costmodel/blind_n83.out
    result: pass
    note: >
      Inputs: protocol.json (sqrt_r 92,573,139.235; E2E = mean rank_stage over the rank processes + mean
      cold_in_process_ms over the cold points) and the 192 raw records (all valid, every raw sha256 equal to its
      receipt). Unit (rho ms/step as a ratio of sums) 3.166599e-4 ms -> 29,314.198 ms. Stack (kS + cS):
      mean rank stage 257,814.27 ms -> 8.79486; mean setup without rank (cold_in_process - online)
      25,575.25 ms -> 0.87245; online 385.10 ms -> 0.013137; s_ic_setup = 9.66731 = s_ic_cold 9.68045 - online.
      Row: 9.6673 / 8.7948 / 0.8725 / 9.6805 / 0.013137. These match, except that 8.79486 rounds to 8.7949 (cosmetic).
      The protocol does not freeze the rho ms/step aggregator. A median-per-run step (3.158661e-4) gives
      s_ic_setup 9.6916 (+0.25%); the meaning is unaffected.
      Within-run comparator pP (kP + cP): s_ic_setup 31.343 against the stack's 9.667 (3.24x).
  - id: K3-05-B-vs-stack-setup
    beat: B5.2
    command: "arithmetic on K3-03 and K3-04"
    output: scripts/readers/costmodel/blind_n83.out
    result: pass
    note: >
      Read row to row on one meaning, s_ic_setup goes 32.848 -> 9.6673 (3.398x). That splits into wall time
      549,847 -> 283,389.5 ms (1.940x) and a unit change, the rho step 180.82 -> 316.66 ns (1.751x). The spurious
      37x is gone. The residual cross-row S comparison still mixes hosts, and the corrections entry says so
      ("different runs and step times; S compares inside a row only").
