findings:
  - id: N1
    beat: B8.2
    severity: minor
    origin: "new wording introduced by the P1 fix"
    what: >-
      The corrected LLL note asserts a mechanism for the P-521 failure: 'P-521 additionally suffers catastrophic
      cancellation' (abstract) and 'orthogonalising a row against rows of size about n^2 subtracts nearly equal
      53-bit quantities, and the residual swamps the true component by many orders of magnitude' (section 3). It
      rests on RESEARCH_LLL_GS_ANALYSIS.md 10.2, whose worked arithmetic is for the initial basis. On that basis the
      scaled P-521 diagonal is exactly 2^500 in f64, the same in lattice.rs, so the subtraction is exact (residual 0).
      The residual-swamps-true condition does hold, at 2^266 to 2^425, for P-256, brainpoolP256r1 and
      brainpoolP384r1, which recover on scaled f64. The measured facts stand: scaled f64 0/4 and 2048-bit fixed point
      3/3 at P-521. The causal story is asserted, not isolated.
    evidence:
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:33-34
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:141-149
      - crypto:papers/lll-degeneracy-note/README.md:24
      - crypto:research/notes/lattice-hnp/RESEARCH_LLL_GS_ANALYSIS.md:273-296
      - crypto:src/cryptanalysis/lattice.rs:384-460
      - scripts/readers/papers/p1_f64_overflow.out
    fix: >-
      State the measured fact ('scaled f64 still fails at P-521; 2048-bit fixed-point Gram-Schmidt recovers 3/3')
      and call the cancellation mechanism a hypothesis. Alternatively, instrument the f64 GS during the P-521 probe
      and record the step where precision is lost.
  - id: N2
    beat: B8.1
    severity: minor
    origin: "new numbers introduced by the P1 fix"
    what: >-
      Re-run counts are probe executions, not distinct instances. The probes are deterministic and overlapping test
      functions repeat seeds. 'secp256k1 included (6/6)' is 3 distinct (d_seed,k_seed) pairs: C0FFEE x3, DEADBEEF
      x2, 12345678 x1. Likewise P-256 6/6 = 3 distinct, P-384 and brainpoolP384r1 4/4 = 3, secp192k1 and
      secp224k1 3/3 = 2, P-521 f64 0/4 = 3. The captions say k_bits = 3 n_bits/4 throughout, but every P-521 probe
      ran at k_bits = 384 (3/4 of 512, not of 521 = 390).
    evidence:
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:35-38
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:158-179
      - crypto:research/lll_degeneracy_rerun_20261016/logs/probes.log
      - crypto:research/lll_degeneracy_rerun_20261016/logs/p521_hp.log
    fix: "Report distinct instances (e.g. secp256k1 3/3 distinct seeds, 6 runs) and P-521's k_bits = 384."
  - id: N4
    beat: B8.1
    severity: minor
    origin: "wording of the P3 fix"
    what: >-
      The numbers are right but three phrases are loose. (a) '5 <= p < 500, counting every instance (l,p,b) with
