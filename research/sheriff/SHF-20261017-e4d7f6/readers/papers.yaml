    beat: B4
    finding: P1
    command: "python3 -I -B scripts/readers/papers/p1_f64_overflow.py"
    output: scripts/readers/papers/p1_f64_overflow.out
    result: pass
    note: >-
      Exact integers, f64::MAX = (2^53-1)*2^971, orders written from SEC 2, FIPS 186-4 and RFC 5639
      (all prime and inside the Hasse bound). n^4 > f64::MAX: secp256k1 TRUE (n = 2^256 - 2^128.35);
      P-256 FALSE (log2(n^4/MAX) = -1.34e-9, i.e. n^4 = MAX*(1 - 9.3e-10)); brainpoolP256r1 FALSE
      (-2.36). Exact threshold: n^4 > f64::MAX iff n >= 2^256 - 3213876088517980684888395375866072719838990621118340425318400
      (about 2^256 - 2^201.0). secp192k1/secp224k1 below the threshold; every 384- and 521-bit order above it.
      In f64, float(n_secp256k1) == 2^256 exactly and (n^2)^2 = inf; P-256 gives 1.7976931331880837e308 (finite).
