  findings:
    - id: F1
      severity: blocker
      what: >-
        Frozen heart in stark_v2: the Fiat-Shamir transcript never absorbs the statement (the
        AIR's boundary positions and values, n, the transition, beta, q). alpha1 and alpha2
        depend only on the trace commitment. A prover can commit to a trace that breaks one
        transition at row p, read off alpha1 and alpha2, and then choose the public boundary
        value at row p that cancels the composition's pole at omega^p:
        v = t_p + alpha1 * C(t_p, t_{p+1}) / (alpha2^k * Z'(omega^p)).
        The composition is then a genuine polynomial of degree < n, and the producer's own
        stark_v2::prove emits a proof that stark_v2::verify accepts. The proved statement is
        false: for example "doubling over 8 rows with t0 = v and t7 = 128", true only for
        v = 1. This is deterministic, not probabilistic. It was accepted under
        StarkConfig::fast and StarkConfig::default, and for a forged row-6 boundary. The v+1
        control is rejected.
      evidence:
        - "crypto:src/zk/stark_v2.rs:226-240 (transcript_to_fri absorbs only trace_commit, then composition_commit)"
        - "crypto:src/zk/stark_v2.rs:362-365 (verifier derives alphas and positions from the same transcript)"
        - "$S/scripts/readers/stark/new-mutants.jsonl rows v2.N8a_frozen_heart_forged_input_fast, v2.N8a_frozen_heart_forged_input_default, v2.N8b_frozen_heart_forged_row6 (accepted), v2.N8c_frozen_heart_control_v_plus_1 (rejected)"
        - "$S/scripts/readers/stark/new-mutants/src/main.rs fn frozen_heart"
      fix: >-
        Absorb a canonical encoding of the full statement before the first challenge: tag, n,
        beta, q, every (position, value) boundary pair, and an AIR identifier. Also absorb the
        final FRI constant before the query positions. Add N8a and N8b as negative tests.
    - id: F2
      severity: major
      what: >-
        The stark v1 verifier takes the query count from the proof (q = trace_queries.len(),
        floor 1), and Fiat-Shamir positions are prefix-stable. So a forger chooses q. The
        producer's prover with q=1 yields an accepted proof that 1 doubled seven times is
        12345 (escape probability 7/8). The rejected 20-query M1 forgery, cut to its first 3
        queries, is accepted. Even with q held at 20, grinding a two-bad-row trace produced an
        accepted forgery in 107 attempts. The module docs describe a (1-k/n)^q spot-check bound
        and say "the prover cannot choose" positions. That bound is measured correct for a
        fixed q (rates table), but the verifier does not fix q. The docs disclaim v1 as "not a
        STARK" that "may not back a research claim", which is why this is major rather than
        blocker. By B2.4 the v1 verifier is still broken: it accepts mutants of false statements.
      evidence:
        - "crypto:src/zk/stark.rs:504-511 (q from the proof)"
        - "crypto:src/zk/stark.rs:294-307 (positions prefix-stable; q not absorbed)"
        - "crypto:src/zk/stark.rs:54-58 (documented bound)"
        - "$S/scripts/readers/stark/new-mutants.jsonl rows v1.N7a_false_output_q1_producer_prover, v1.N7b_truncate_rejected_forgery_to_prefix, v1.N8b_grind_two_broken_rows_q20 (accepted), v1.R1_*, v1.R2_*"
      fix: "Make the query count a verifier parameter (or a constant), require trace_queries.len() == q, and absorb q and the statement. Add a q=1 forgery as a negative test. Otherwise delete verify() from v1 or rename it so it cannot be mistaken for a verifier."
    - id: F3
      severity: major
      what: >-
        S2 remainder. The stark_v2 soundness text states "about 240 bits" (default) and "40 bits"
        (fast) as q*log2(beta) under the Reed-Solomon proximity conjecture. The formula and
        arithmetic are the standard conjectured query-phase term, but three things are wrong.
        (a) The bound does not hold for the implemented verifier: under F1 the soundness error
        is 1 for prover-chosen public inputs, and the text lists the absent grinding, DEEP and
        zero-knowledge but not the unabsorbed statement. (b) "240 bits" exceeds the roughly
        128-bit collision-resistance cap of the SHA-256 Merkle commitments. The text says only
        "SHA-256 and the 255-bit field cap everything", with no number, and StarkConfig::default
        (72-73) repeats "about 240 bits" with no cap. (c) "Proven bounds are weaker (about half
        that)" gives no formula and no source.
      evidence:
        - "crypto:src/zk/stark_v2.rs:34-41 — \"Under the Reed–Solomon proximity conjecture each query catches a cheating prover with probability about `1 − 1/β`, so `q` queries give about `q · log₂ β` bits (240 for the default `β = 8, q = 80`; 40 for [`StarkConfig::fast`]).  Proven bounds are weaker (about half that), there is no grinding, no out-of-domain (DEEP) sample and no zero-knowledge masking, the transition must be of degree 1, and SHA-256 and the 255-bit field cap everything.\""
        - "crypto:src/zk/stark_v2.rs:72-73 — \"Default: `blow_up = 8`, `query_count = 80`: about 240 bits under the proximity conjecture\""
        - "crypto:src/zk/stark_v2.rs:81-82 — \"Faster: `blow_up = 4`, `query_count = 20`, about 40 bits conjectured.\""
      fix: "Until F1 is fixed, say the verifier is not sound for prover-chosen public inputs. After that, state the bound as min(q*log2(beta) [conjectured] or the Johnson-regime proven term with its formula and source, FRI commit-phase and ALI field terms ~ log2(|F_r|/(n*beta)^2), and 128 for SHA-256 collisions), and drop the bare '240 bits'."
    - id: F4
      severity: minor
      what: >-
        stark v1's catch-probability text is wrong at the module's own sizes. It says "a single
        bad row is caught only with probability about q/n per attempt". The correct value is
        1 - (1 - 1/n)^q, and q/n exceeds 1 for the q=20 and q=64 used with n=8. The
        (1 - k/n)^q survival formula is correct (measured) only for a verifier-fixed q (F2).
      evidence:
        - "crypto:src/zk/stark.rs:54-58 — \"A trace with `k` broken transitions survives `q` queries with probability about `(1 − k/n)^q`, and a prover can grind its commitment to re-roll the positions, so a single bad row is caught only with probability about `q/n` per attempt.\""
        - "$S/scripts/readers/stark/new-mutants.jsonl v1.R1_escape_k1_q20 (0.0685 vs (7/8)^20 = 0.0692)"
      fix: "Write 1 - (1 - k/n)^q, and say q is prover-chosen until F2 is fixed."
    - id: F5
      severity: minor
      what: "stark_v2 has no out-of-domain (DEEP) sample, which B2.3 requires. It is documented (34-41). The non-DEEP construction relies on the boundary quotients to force the committed trace LDE to low degree. I found no exploit, but the soundness argument then needs the weaker non-DEEP analysis, which the text does not give."
      evidence: ["crypto:src/zk/stark_v2.rs:38-39", "crypto:src/zk/stark_v2.rs:337-402 (no OOD point)"]
      fix: "Add a DEEP out-of-domain sample (absorbed, then checked against both trace and composition), or state the non-DEEP soundness analysis the bound relies on."
    - id: F6
      severity: minor
      what: "FRI transcript incompleteness and malleability. fri_transcript_after absorbs layer_roots[..last] only. The last layer root is neither absorbed nor checked by anything (replacing it with zeros leaves the proof accepted, v2.M1), and final_constant is not absorbed before the query positions are drawn."
      evidence: ["crypto:src/zk/stark.rs:279-290", "crypto:src/zk/stark.rs:198-203", "$S/scripts/readers/stark/new-mutants.jsonl v2.M1_last_fri_root_garbage (accepted)"]
      fix: "Absorb the final layer (constant or root) before the positions, and drop or check the unused last root."
    - id: F7
      severity: minor
      what: "Non-canonical field encodings are accepted. Leaves are 32-byte big-endian BigUints with no < r check, so the same trace can be committed as v or v + r. That yields a different commitment, different alphas and different positions with the same field values (v2.M2 accepted), and gives a forger free re-rolls (used in the v1.N8a variant family)."
      evidence: ["crypto:src/zk/stark_v2.rs:257-262, 367-370", "crypto:src/zk/stark.rs:154-159, 516-520", "$S/scripts/readers/stark/new-mutants.jsonl v2.M2_noncanonical_trace_encoding (accepted)"]
      fix: "Reject any opened value >= r before hashing (and in the prover, reduce before committing)."
    - id: F8
      severity: minor
      what: "Both verifiers panic instead of returning false when an opened value is >= 2^256 (scalar_to_bytes computes 32 - len, which underflows and then indexes out of range). A malicious proof aborts the verifying process."
      evidence: ["crypto:src/zk/stark.rs:154-159", "crypto:src/zk/stark_v2.rs:257-262", "$S/scripts/readers/stark/new-mutants.jsonl v1.M1_oversize_opened_value, v2.M3_oversize_opened_value (panicked)", "$S/scripts/readers/stark/new-mutants.stderr.log"]
      fix: "Return false for values with more than 32 bytes (or >= r) before encoding."
    - id: F9
      severity: minor
      what: "stark v1 accepts a FRI truncated to zero folds with the transcript re-derived (v1.N5c), so FRI depth is prover-chosen. The docs already say v1's FRI adds no soundness, so the effect is an extra position re-roll for a grinding forger."
      evidence: ["crypto:src/zk/stark.rs:513-515, 558-563", "$S/scripts/readers/stark/new-mutants.jsonl v1.N5c_fri_zero_folds_rederived (accepted)"]
      fix: "Fix the number of folds in the verifier (as stark_v2 does at 355), or drop FRI from v1."
    - id: F10
      severity: minor
      what: "The README still lists `zk::stark` / `stark_v2` as a 'STARK proof system skeleton' with no 'unsound / must not back a claim' marker (original S1 fix option 1). It states no bound."
      evidence: ["crypto:README.md:484 — \"| `zk::stark` / `stark_v2` | STARK proof system skeleton                   |\""]
      fix: "Add the same 'educational, not sound, must not back a research claim' marker the module docs carry."
    - id: F11
