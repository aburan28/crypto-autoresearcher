      evidence: ["crypto:src/zk/stark_v2.rs:30-34", research/sheriff/SHF-20261016-3caa6f/checks/stark-mutation.jsonl]
      fix: "Remove the soundness claim until a sound verifier exists; then state a proven or conjectured bound with its formula, field size and grinding."
