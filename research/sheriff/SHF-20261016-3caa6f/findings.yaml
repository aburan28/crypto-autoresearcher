    - id: S1
      beat: B2
      severity: blocker
      claim_ids: [C1, C2, C3]
      what: >-
        Both STARK verifiers accept proofs of false statements. stark::verify accepted a proof
        that 1 doubled seven times is 12345 (one broken transition) and an empty proof with no
        queries; stark_v2::verify accepted the honest proof for a different boundary and an empty
        proof. 4 of 4 mutants accepted; honest controls verify. Causes: no transition check
        (stark.rs:449-454, `let _ = val`), composition never tied to trace and alpha1/alpha2 and
        the boundary discarded (stark_v2.rs:397-418), FRI run on the trace with no blow-up in v1,
        query count and positions never re-derived from the transcript, and no negative test in
        either module. Nothing outside src/zk calls them; no research result depends on them.
      evidence: [research/sheriff/SHF-20261016-3caa6f/checks/stark-mutation.jsonl, research/sheriff/SHF-20261016-3caa6f/scripts/stark-mutation/src/main.rs]
      fix: >-
        Mark both modules unsound in their docs and README (they must never back a claim), or
        implement the missing checks (transition at each query and its successor, composition
        against trace, boundary quotient, query count and positions from the transcript, FRI on
        the LDE), and add these four mutants as negative tests.
