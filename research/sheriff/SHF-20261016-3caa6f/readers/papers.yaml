    fix: "Name the exhaustive curve and primes, and write 'plus' rather than 'including'."
  - id: F11
    beat: B8.2
    severity: minor
    what: "Structural Thread 11 writes Jac(C) ≅ E1 x E2, but the classification (thread11_classify.py) only shows that the Weil polynomial factors, i.e. that Jac(C) is isogenous to the product."
    evidence:
      - crypto:papers/structural-completeness/structural_completeness.tex:372-375
      - crypto:secp256k1_cm_audit/thread11_classify.py:130-166
    fix: "Say 'isogenous to', or cite an isomorphism check."
  - id: F12
    beat: B8.1
    severity: minor
    what: >-
      Sweep tooling limits behind most of these leads (tools/sheriff.py).
      (a) cited_paths resolves paths against repository roots, not the citing
      file's directory. It therefore drops README-relative citations
      (`../../experiments/EXP-SMON-e5cbe6/`, `../../secp256k1_cm_audit/*.gp`)
      yet accepts `../..` itself, a path outside the repo, as a cited path for
      the lll note. Bare-filename citations in \texttt{} are never resolved.
      (b) TEX_NUMBER reads unspaced sets as thousands-grouped numbers:
      "{19,37,79,109}" becomes 79109, "{53,101,211}" becomes 53101211, and
      "brainpoolP\{256,384,512\}" becomes 256384512, which then "traces" by
      coincidence. (c) thebibliography volume, page and arXiv numbers are
      traced as results. (d) 3-digit integers are never extracted, so the
      false 621 passes.
    evidence:
      - crypto-autoresearcher:tools/sheriff.py:533-575
      - crypto:papers/structural-completeness/structural_completeness.tex:431
      - crypto-autoresearcher:papers/semaev-conservation-specialization/paper.tex:884
      - crypto:papers/structural-completeness/structural_completeness.tex:100
    fix: "Resolve relative paths against the citing file and reject paths outside the repo; skip \\bibitem blocks; treat ',' as a thousands separator only for \\, or {,} or a ',ddd' run not inside a set; add canary look-alikes for each."

