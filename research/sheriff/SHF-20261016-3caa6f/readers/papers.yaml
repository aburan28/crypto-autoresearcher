findings:
  - id: F1
    beat: B8.2
    severity: blocker
    what: >-
      The LLL degeneracy note presents as current an LLL failure that is
      "curve-specific", "specific to secp256k1", "empirically robust" and
      "reproducible via the companion code". The repository's own records
      resolve it as a numerical defect of the old implementation: an f64
      overflow (n^4 > f64::MAX for secp256k1 only, confirmed independently in K06),
      plus catastrophic cancellation for P-521. Both are fixed, and a re-run on
      2026-09-27 recovers 8/8. The note's Failure-B diagnosis (iteration cap)
      is also contradicted. The PDF was rebuilt on 2026-10-11, after the
      supersession was recorded, and neither the note nor its README mentions it.
    evidence:
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:27-34
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:171-173
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:208-219
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:356-362
      - crypto:research/notes/lattice-hnp/RESEARCH_GLV_HNP.md:232-251
      - crypto:research/notes/lattice-hnp/RESEARCH_LLL_GS_ANALYSIS.md:258-326
      - crypto:src/cryptanalysis/lattice.rs:371-375
      - crypto:papers/lll-degeneracy-note/README.md:7-20
    fix: >-
      Withdraw the note, or rewrite it as a post-mortem of the f64-overflow and
      cancellation defects with the 2026-09-27 re-run as the current result.
      Mark the old tables historical, rebuild the PDF, and update the
      crypto:papers/README.md row and the note's README.
  - id: F2
    beat: B8.1
    severity: minor
    what: >-
      All 7 lll numbers trace only to two narrative research notes that the
      paper does not cite. Those notes are transcriptions with no raw run log
      or seed/commit/host record. Unsupported anywhere: "exits in approximately
      53 seconds", "Additional probes (BKZ-10, larger m, varying k_bits)
      reproduce the same qualitative pattern", and "BKZ recovers where LLL fails".
    evidence:
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:89-91
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:99-101
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:109
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:192-194
      - crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:360-361
      - crypto:research/notes/lattice-hnp/RESEARCH_GLV_HNP.md:262-264
      - crypto:research/notes/lattice-hnp/RESEARCH_GLV_HNP.md:279-282
      - crypto:research/notes/lattice-hnp/RESEARCH_LLL_GS_ANALYSIS.md:178-185
    fix: "If the note survives F1: cite the notes with a crypto: prefix, commit a probe run record (stdout, commit, host), and drop or evidence the BKZ and 53 s statements."
  - id: F3
    beat: B8.1
    severity: major
    what: >-
      The structural paper says the Enhanced Lemma was checked on "16 562
      ordinary curve instances" for l in {3,5,7}, "Total: 18 364". The number
      16562 appears only as a hard-coded literal in the l in {11,13} script.
      Re-running the two cited l in {3,5,7} scripts gives 24,476 instances, of
      which 15,742 are supersingular (p = 2 mod 3, j = 0) and 8,734 ordinary.
      An independent recount agrees, and no subset gives 16,562. "Ordinary" is
      also wrong for what the scripts enumerate. The 1,802 for l in {11,13}
      reproduces, and "0 spurious violations" holds on the re-run.
    evidence:
      - crypto:papers/structural-completeness/structural_completeness.tex:351-361
      - crypto:secp256k1_cm_audit/exp_zdoubleprime_lemma_extended.py:179
      - crypto:secp256k1_cm_audit/exp_zprime2_generalized_lemma.py:72-76
      - scratchpad/readers/papers/run/exp_zprime2_generalized_lemma.out
      - scratchpad/readers/papers/recount_j0.py
    fix: "Replace 16 562 and 18 364 with recomputed counts (e.g. 8,734 ordinary for l in {3,5,7} plus 1,802), commit the three scripts' outputs, cite them with crypto: paths, and drop the hard-coded literal from the script."
  - id: F4
    beat: B8.1
    severity: major
    what: >-
      The CM-73 sweep is described as "over all 621 primes p = 1 (mod 6) with
      p <= 5000". There are 330 such primes (pi(5000) = 669). The sweep missed
      this because it skips 3-digit integers. The rest of the paragraph
      reproduces independently: the 11 norm-form k values and the seven
      a2-2p values. thread12_cm73_sweep.gp has no committed output, and the
      paper names the script by bare filename only.
    evidence:
      - crypto:papers/structural-completeness/structural_completeness.tex:400-410
      - crypto:secp256k1_cm_audit/thread12_cm73_sweep.gp:1-30
      - scratchpad/readers/papers/a2_recount.py
    fix: "Correct 621 to 330, commit the thread12 output (gp is not installed here), and cite it as crypto:secp256k1_cm_audit/... ."
  - id: F5
    beat: B8.2
    severity: major
    what: >-
      Structural abstract: "The theorem is proven via seven independent
      structural blocks and empirically verified across all four deployed
      curves." The theorem holds only under standing assumptions stated in the
      body: Gaudry and Diem-Thomé complexity, and prime-field hyperelliptic DLP
      not being subexponential. The proof treats best-known algorithm costs as
      lower bounds on T(A) for an informally defined attack family. The README
      calls §8 proof sketches, and the submission checklist flags the
      conditionality. The abstract and abstract.txt drop these caveats (D7).
      Checks on four curves cannot "verify" a statement quantified over all
      prime-field ordinary curves.
    evidence:
      - crypto:papers/structural-completeness/structural_completeness.tex:62-74
      - crypto:papers/structural-completeness/structural_completeness.tex:808-830
      - crypto:papers/structural-completeness/structural_completeness.tex:849-851
      - crypto:papers/structural-completeness/structural_completeness.tex:871-874
      - crypto:papers/structural-completeness/structural_completeness.tex:954-956
      - crypto:papers/structural-completeness/README.md:72-76
      - crypto:papers/structural-completeness/SUBMISSION_CHECKLIST.md:123-128
      - crypto:papers/structural-completeness/abstract.txt
    fix: "State the conditional form in the abstract and title block (under the standing assumptions, taking each family's best-known cost), say 'proof sketch' until the proofs are reviewed, and replace 'empirically verified' with 'checked on four curves'."
  - id: F6
    beat: B8.1
    severity: minor
    what: >-
