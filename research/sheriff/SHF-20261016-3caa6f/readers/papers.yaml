  - id: F10
    beat: B8.2
    severity: minor
    what: >-
      Semaev abstract: "verified computationally on 20 curves over 6 primes ...
      including 257 061 exhaustive specializations". The exhaustive cells come
      from one additional curve, y^2 = x^3 + 5x + 7 (A=5, B=7 in C6), over
      p in {53,101,211} (m=3) and {37,53} (m=4). Primes 37 and 53 are outside
      the 6-prime battery, and the paper never names this curve.
    evidence:
      - crypto-autoresearcher:papers/semaev-conservation-specialization/paper.tex:72-74
      - crypto-autoresearcher:papers/semaev-conservation-specialization/paper.tex:847-850
