findings:
  - id: F1
    beat: B7.5
    severity: minor
    what: >-
      The evidence is one run on one GitHub-hosted runner instance, with no independent replay on another
      host. cryptanalysis AGENTS.md requires independent replay for a complete one-target IC speedup.
      This claim is an IC-over-IC Tier 1, instance-scoped improvement. README and baselines.json label it
      that way, but the replaced baseline row does not say that no replay exists, while other rows cite
      "second-host replay".
    evidence:
      - cryptanalysis AGENTS.md:645-660
      - experiments/koblitz-n83-stacked-20261016/run_github_38862448935/host-probe.json
      - experiments/koblitz-n83-stacked-20261016/README.md:284
      - docs/ic/baselines.json:200 (baselines[4].evidence_tier "Tier 1 (instance scoped ...)")
    fix: >-
      State "single run, single instance, no independent replay" in the baseline row, or run the frozen
      schedule (or at least kP/kS + cP/cS) on a second host class before the row is cited across hosts.
  - id: F2
    beat: B6.1
    severity: minor
    what: >-
      Preregistration cannot be shown from main alone. The squash merge put protocol and result into one
      commit (77b5c02b), and the protocol commit 24abca74 is not an ancestor of main. Chronology rests on
      the GitHub PR ref and Actions server metadata, which I checked and which hold (C01). The repo rule says
      "Commit and open a protocol before creating held-out inputs". Here the held-out inputs were created
      in the same commit as the protocol and exercised locally before it, and the PR was opened at
      09:40:11Z, after the result commit at 09:38:51Z. The protocol push at 06:39Z, witnessed by Actions,
      is the effective publication.
    evidence:
      - cryptanalysis AGENTS.md:208-210
      - scratch/readers/receipts/github_provenance.txt
      - docs/ic/baselines.json baselines[4].pipeline.commit ("cryptanalysis 24abca74...", not on main)
    fix: >-
      Merge research PRs with merge commits, or record the protocol commit plus its Actions run id and
      created_at in the README and baseline row. Open the protocol PR before generating held-out inputs.
  - id: F3
    beat: B6.1
    severity: minor
    what: >-
      "20 new held-out points" and "frozen_before_any_timing: true" are not literally true for point
      s000 or rank seed 101. Pre-freeze smoke ran every cold arm on s000 and kS on rank seed 101/s000, with
      diagnostic timings recorded (cP 75.2 s vs cS 32.0 s; kS 333 s vs kR 607 s), and s000 then sits in
      the frozen panel and rank block K1. The timings were taken on a different host, and the effect does
      not depend on them: dropping s000 leaves R = 3.2390 (C08).
    evidence:
      - experiments/koblitz-n83-stacked-20261016/smoke/README.md:46-57,78-85
      - experiments/koblitz-n83-stacked-20261016/protocol.json:211-212
      - experiments/koblitz-n83-stacked-20261016/schedule.json (C1 = s000, K1 = s000 seed 101)
    fix: >-
      Smoke on a point outside the frozen panel. Otherwise say "19 unseen + 1 smoke point" and
      "frozen before any Tier 1 timing", which is the README's own, accurate wording.
  - id: F4
    beat: B6.4
    severity: minor
    what: >-
      The planted positive control covers only the cold path, about 9% of E2E(kS,cS). The rank-stage
      timer carries 91% of the cost and most of the 3.24x, and no planted control covers it. The A/A
      bootstrap resamples the identical attempt sequences of kS and kSaa independently, so its CI
      [0.934, 1.070] is noise from resampling, not from the instrument. The frozen A/A gate rightly uses
      point estimates. Neither point affects this verdict, given the per-process A/A agreement (<0.12%) and
      the effect size.
    evidence:
      - experiments/koblitz-n83-stacked-20261016/protocol.json:117-120
      - experiments/koblitz-n83-stacked-20261016/run_github_38862448935/panel/result.json:86-94,354-361
      - scratch/readers/receipts/blind_primary.out
    fix: >-
      Future protocols: add a planted rank-stage control and resample A/A attempts paired, since the
      attempt vectors are identical.
  - id: F5
    beat: B6.5
    severity: minor
    what: >-
      kP, the baseline rank arm and about 95% of E2E(kP,cP), ran last in both rank blocks. Only two
      rank processes per arm exist, and the bootstrap does not capture between-process (host-drift)
      variance. The K1-only and K2-only ratios are 3.31 and 3.17. The order effect is bounded at <0.2% by
      A/A positions, so the conclusion holds. The interval describes attempt sampling within two
      processes on one host, not run-to-run variability.
    evidence:
      - experiments/koblitz-n83-stacked-20261016/schedule.json (K1, K2 order)
      - scratch/readers/receipts/sensitivity_drop_smoke.out
    fix: Alternate kP/kS order across blocks and use more than 2 rank blocks, or replicate on another host.
  - id: F6
    beat: B7.3
    severity: minor
    what: >-
      The artifact digest (sha256:4aa1690d...) and artifact id are not recorded in the repo. GitHub
      deletes the artifact on 2026-11-15, after which the main-vs-CI byte identity (C14) cannot be
      re-checked. The binaries are not archived (C16).
    evidence:
      - .github/workflows/n83-stacked.yml:148-155 (retention-days 30)
      - scratch/readers/receipts/github_provenance.txt
    fix: Record the artifact id and digest and the binary hashes' build provenance in README/baselines row.
notes_for_other_joints:
  - >-
    B5 (red team, not judged here): the ablations show neither the fold (1.0272 [0.9622,1.0971]) nor the
    compact slots (1.0231 [0.9543,1.0958]) separated end to end. The 3.24x comes mostly from the rank
    stage: kP/kS stage 3.37x, kP 1.51x more rank probes (1,508,460,462 vs 1,000,454,051 on K1). That is
    the change from B's full/left-major/no-probe rank stage to lift/Feistel/target-probe. The README
    discloses this (L290-294).
  - >-
    B5/B8 (accounting): the stack's one-target online is 4.4% SLOWER (cP/cS 0.9562 [0.9524,0.9608]).
    cryptanalysis AGENTS.md L484-485 and L491-492 say cold-start accounting is supplementary to T_online,1
    for single-target studies. This study pre-registered E2E cold as the primary and discloses the online
    regression (README L233).
