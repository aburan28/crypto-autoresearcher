      subfield cell is degenerate at gap 0." Regenerate the report PDF.
  - id: F5
    beat: B3.4e
    severity: major
    what: >-
      The generic-invariance theorem is cited as proving that Pollard rho and the kangaroo
      "cannot see the conductor". It is also used to dismiss a rho interval excluding 1
      (1.22 [1.005, 1.46] at ell=8209) as "noise by theorem", and to pre-register any generic
      deviation as "a harness fault" "by theorem". The Lean model (Alg.next sees only cost,
      equality bits and the tape) excludes algorithms that hash the point representation.
      ecbench's rho picks jumps by mix(key(x)), with key built from the x-coordinate and y-sign,
      and its kangaroo does the same. They are not instances of the model, and their transcript is
      not invariant. Control: 197/200 cost changes for a hash-partition rho, 0/200 for BSGS. Only
      BSGS (equality-only) is covered. The dismissal is supported by the 16-target replication
      (rho 1.04 [0.91, 1.19]), not by the theorem.
    evidence:
      - crypto:research/conductor_gap_cm_pairs_20261010/lean/GenericInvariance.lean:3-17,41-42
      - crypto:research/conductor_gap_cm_pairs_20261010/lean/README.md:3-10
      - crypto:research/conductor_gap_cm_pairs_20261010/README.md:81-85,95,110,113,119-120,155-158
      - crypto:research/conductor_gap_cm_pairs_20261010/PROTOCOL.md:5,21-23
      - crypto:src/cryptanalysis/ic_boundary.rs:1926-1928,3582-3588
      - crypto:src/cryptanalysis/ecbench/generic.rs:66-67,275-278
      - research/sheriff/SHF-20261016-3caa6f/scripts/readers/lean/generic_scope_check.out
    fix: >-
      Add a dated correction note narrowing the theorem to handle-model algorithms (BSGS as
      implemented). For rho and kangaroo, state level-blindness as the random-walk heuristic,
      supported by the 16-target replication. Optionally formalise a Shoup-style model with a
      uniformly random injective encoding and prove distributional invariance. That would cover
      hash-partition walks in distribution over encodings, but not on a fixed curve.
  - id: F6
    beat: B3.3
    severity: major
    what: >-
      Axiom claims are made with no retained evidence. The S3Roots README, the paper Remark and
      the program paper say `#print axioms` gives only propext, Classical.choice and Quot.sound.
      The conductor_gap lean/README.md says only propext. There is no committed output, no axiom
      audit file and no CI workflow for either project. crypto:AGENTS.md:349-352 requires
      retaining the command and output. This reader could not run them (no toolchain).
    evidence:
      - crypto:papers/rootfinding-decomposition/README.md:54-60
      - crypto:papers/rootfinding-decomposition/rootfinding_decomposition.tex:261
      - crypto:papers/ecdlp-index-calculus-program/sections/rootfinding.tex:29-31
      - crypto:research/conductor_gap_cm_pairs_20261010/lean/README.md:25-26
      - crypto:AGENTS.md:349-352
      - crypto:.github/workflows/ (no workflow references either project)
    fix: >-
      Commit an AxiomAudit.lean (`#print axioms` for every cited theorem) plus its output log in
      each project, and add a CI job like tree-split-structured-v-lean.yml that runs lake build
      and the audit.
  - id: F7
    beat: B3.4e
    severity: minor
    what: >-
      The program paper's abstract says root-finding decomposition oracles are "a known mechanism,
      here proved in Lean". Lean proves the S3 root identity (Prop 1), not the oracles'
      exactness or completeness (Algorithms 1/2). The x± in S3Roots are self-defined chord
      formulas not tied to Mathlib's group law. That gap is disclosed as owed (README:124-127),
