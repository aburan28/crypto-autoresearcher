findings:
  - id: F1
    beat: B3.2
    severity: minor
    what: >-
      research/THM_QUOTIENT_DESCENT1.lean states the formal target as a custom `axiom`. It has no
      import, yet `Type*` and `AddCommGroup` need Mathlib, so it would not elaborate. It sits
      outside the formal/ workspace and has no toolchain pin. It is unaudited by #audit_project
      and has the wrong namespace. No record cites it as proved, verified or formalized, and the
      amendment explicitly does not rely on it. That is why this is minor and not a blocker. The
      statement itself is true and provable in one line in any AddCommGroup, and hS is unused.
    evidence:
      - crypto-autoresearcher:research/THM_QUOTIENT_DESCENT1.lean:1-14
      - crypto-autoresearcher:experiments/EXP-GFPN-05ff43/amendments/v1_to_v2_reanchor_and_arm_iii.yaml:507-510,1285-1287
      - crypto-autoresearcher:ledger/decisions/DEC-20260920-11b44c.yaml:57
      - research/sheriff/SHF-20261016-3caa6f/scripts/readers/lean/descent_check.out
    fix: >-
      When the target is minted, put a `theorem` with a proof under formal/CryptoResearch/Quotient/.
      Specialise at P = 0, then abel/omega-style group rewriting. Drop hS or generalise S to any
      Q (see F2). Until then, rename the stub so a sweep or import cannot mistake it for a proved
      fact, e.g. `theorem ... := by sorry` in a quarantined stubs path, or a .lean.txt extension.
  - id: F2
    beat: B3.4c
    severity: minor
    what: >-
      THM_QUOTIENT_DESCENT1.md:12-16 says every degree-2 map E -> P^1 over k is the quotient by
      iota_S = [-1]∘tau_S with S in E[2](k), up to an automorphism of P^1. That is false. A
      degree-2 map's involution is P -> -P + Q with Q = sum(D) in E(k) arbitrary. Counterexample:
      x(P+R) with R of order 3 over F_1009. The Lemma's conclusion (descent iff 2T = O) holds for
      every Q, so the "for every x-type coordinate" closure survives. But both the Setting and the
      Lean hypothesis hS are narrower than the truth. Also, .md:7-8 says "the note claims only
      'formalized here'" while .md:3 says "not yet formalized".
    evidence:
      - crypto-autoresearcher:research/THM_QUOTIENT_DESCENT1.md:3,7-8,12-16
      - research/sheriff/SHF-20261016-3caa6f/scripts/readers/lean/descent_check.out
    fix: >-
      Add a dated correction note (the record is immutable): the involutions are iota_Q(P) = -P + Q,
      Q in E(k), and the Lemma holds for all Q. Mint the formal target without hS.
  - id: F3
    beat: B3.4e
    severity: minor
    what: >-
      RESULTS.md:35-36 says the subfield-leak divisibility "is proved in Leak.lean, with
      native_decide". crypto:AGENTS.md:353-355 says a reported Lean proof may not use unverified
      native evaluation, so "proved" is not earned. The Leak.lean docstring has no trust note. The
      fact itself is true (independently recomputed). `not_in_gf2_3` holds trivially by degree.
    evidence:
      - crypto:research/ic_tree_split_structured_v_20261011/RESULTS.md:35-36,70
      - crypto:research/ic_tree_split_structured_v_20261011/lean/TreeSplit/Leak.lean:3-23
      - crypto:AGENTS.md:353-355
      - research/sheriff/SHF-20261016-3caa6f/scripts/readers/lean/treesplit_check.out
    fix: >-
      Add a dated correction to RESULTS.md: "compiler-checked (native_decide, trusts
      Lean.ofReduceBool)". Or close in_gf2_7 by kernel `decide`; ten small polynomial remainders
      should be within kernel reach. Add a trust note to the Leak.lean docstring.
  - id: F4
    beat: B3.4e
    severity: minor
    what: >-
      The frob n=21 gap tally is misreported. RESULTS.md:23 and report.typ:25 say "14 x 0, 6 x -1",
      and RESULTS.md:31 and report.typ:29 say "the six frob cells at gap -1". The records give
      15 x 0 and 5 x -1. Six cells have V inside GF(2^7), and one of them (a=0, seed 20261012,
