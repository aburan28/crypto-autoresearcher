      - crypto:papers/rootfinding-decomposition/README.md:124-127
      - crypto:papers/rootfinding-decomposition/rootfinding_decomposition.tex:249-263
    fix: "Reword to 'whose root identity (Proposition 1) is proved in Lean'."
  - id: F8
    beat: B3.4e
    severity: minor
    what: >-
      Three things in TransferBound are bookkeeping rather than proof: transfer_cost is `rfl`;
      Solver.cost is a self-reported number unconstrained by computation; and the docstring's
      "best cost on the two levels can differ by at most 2·max(cost φ, cost ψ)" is an informal
