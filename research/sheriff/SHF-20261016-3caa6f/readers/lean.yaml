      - crypto:research/ic_tree_split_structured_v_20261011/reports/run-20261011T2105Z/report.typ:25,29
      - crypto:research/ic_tree_split_structured_v_20261011/runs/registered/readout.txt:19,26,51,56,58
      - research/sheriff/SHF-20261016-3caa6f/scripts/readers/lean/treesplit_check.out
    fix: >-
