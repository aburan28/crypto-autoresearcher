      with no link to computation (57-59), and Solvers must always be correct, which excludes
      Monte Carlo solvers. The "best costs differ by at most" corollary (89-91, README:89-90) is
      informal: it holds for worst-case cost and needs bijectivity for average case. The
      hypotheses are satisfiable (identity, or x -> kx on Z/n). Calling it "the formal shape of
      JMV" is fair.
  - id: L3-README-mathlib
