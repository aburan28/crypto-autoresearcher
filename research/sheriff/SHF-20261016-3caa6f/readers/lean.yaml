  # ---------------- Lead 1: THM_QUOTIENT_DESCENT1 ----------------
  - id: L1-TRUTH
    beat: B3.4
    command_or_reading: >-
      python3 -I scripts/descent_check.py: exhaustive over Z/a x Z/b for (2,2),(4,2),(6,4),(12,1),(3,5),(8,8),
      with and without hS. Output: descent_check.out
    result: pass
    note: >-
      0 counterexamples with or without hS. By hand: -(P+S)+T = -(P+T+S) iff T = -T iff 2T = 0,
      independent of P and S. The statement is true in every additive commutative group, and the
      hypothesis hS : 2•S = 0 is never used.
  - id: L1-a-statement
    beat: B3.4a
    command_or_reading: "THM_QUOTIENT_DESCENT1.lean:10-14 against THM_QUOTIENT_DESCENT1.md:22-23, 31-34, 65-66"
    result: pass
    note: >-
      Matches the .md "Formal target" (lines 65-66) symbol for symbol, and the proof computation
      (31-34). The Lean encodes "descends" as "commutes with iota_S". The fibre step "descends iff
      commutes" (.md:27-29) is informal and outside the Lean statement.
  - id: L1-b-hypotheses
    beat: B3.4b
    command_or_reading: "Witness S = 0 (2•0 = 0); the T=(0,0) curve y^2=x^3+2x^2+5x over F_1009 (descent_check.out)"
    result: pass
    note: "Satisfiable. hS is superfluous, so the hypothesis is harmless but narrower than the truth."
  - id: L1-c-definitions
    beat: B3.4c
    command_or_reading: >-
      .md:12-16 Setting, checked on y^2=x^3+261x^2+120x+507 over F_1009 with R of order 3
      (descent_check.out)
    result: fail
    note: >-
      iota_S = [-1]∘tau_S matches .md:13. But the Setting's claim (.md:14-16) is false as stated:
      "every degree-2 map E->P^1 over k is the quotient by some iota_S, S in E[2](k), up to
      Aut(P^1)". A degree-2 map has involution P -> -P + Q for arbitrary Q in E(k). Witness:
      phi(P) = x(P+R) with R of order 3 has involution P -> -P - 2R, and -2R is not 2-torsion.
      The Lemma's conclusion still holds for every Q (checked on 40 T).
  - id: L1-d-data
    beat: B3.4d
