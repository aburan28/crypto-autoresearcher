schema_version: '1.0'
defaults:
  backend: openai
  backend_fallback_order:
  - openai
bindings:
  openai:
    coordinator-orchestration-code:
      model: gpt-5.6-terra
      provenance: operator-supplied
      last_probed: '2026-08-02'
      capabilities: &id001
        max_reasoning_effort: max
        tool_use: true
        structured_output: true
        context_tokens: 1050000
        max_output_tokens: 128000
      request:
        max_tokens: 32000
        reasoning:
          mode: openai_effort
          effort_map:
            high: high
            xhigh: xhigh
            max: max
    coordinator-orchestration:
      model: gpt-5.6-terra
      provenance: operator-supplied
      last_probed: '2026-08-02'
