review_plan:
  claim_under_review: Producer PRs crypto#2201, cryptanalysis#964 and crypto-autoresearcher#2407 claim
    machine verification of exactly 19 named retrospective declarations, with explicit conditional/model
    limitations, and 65/66 frozen autoresearcher targets. Their proof maps explicitly leave independent
    semantic review pending; they do not claim all historical work proved. The adapted review-evidence/formal
    skills claim to distinguish kernel evidence, source-claim fidelity, and review outcomes without changing
    scientific promotion authority.
  coordinator_prior: I authored these new proofs. Existing machine checks are expected to reproduce; I
    cannot independently certify their semantics. Highest risks are omitted concrete map/implementation
    bridges, stronger prose or target requirements than the lemmas, vacuous assumptions, word-order conventions,
    and workflow false success. I expect conditional lemmas to survive but do not expect a proof of every
    historical research claim.
  joints:
  - joint: J1-transport-and-rho-fidelity
    assigned_to: TASK-20261018-63a7cc
    attack_plan: Compare each of 9 proof-map rows to elaborated types, original transport/subfield statements
      and rho_try_solve. Attack noncoprime degree, zero maps, zero collision denominators and composite
      moduli. Identify exactly what is assumed about maps, injective scalar encoding and source C code,
      and seek nonvacuous examples.
    breaking_artifact: A checked counterexample under the stated assumptions, or an exact type/source
      mismatch with a reproducible witness and narrowed supported claim.
  - joint: J2-certificate-affine-kernel-fidelity
    assigned_to: TASK-20261018-a5dcec
    attack_plan: 'Review all 10 mapped declarations against the source notes and three frozen target specs.
      Expand definitions: true span, actual point sum, executable decider, word order and suffix parity,
      genuine two-sided commutator ideal and actual action group. Exercise empty cases, invalid raw coordinates,
      finite characteristic, and distinguish the single kernel witness from full target/source propositions.'
    breaking_artifact: A checked false acceptance, vacuous/circular type, incorrect affine order, fake
      algebraic model, or exact missing source/target obligation with an independent counterexample or
      derivation.
  - joint: J3-lean-workflow-and-evidence-gates
    assigned_to: TASK-20261018-dae80c
    attack_plan: Trace the adapted skills to actual LeanWorker/CLI/target runner and shared proof gate.
      Independently replay suitable machine checks and controls; inspect fresh root logs and receipt bindings.
      Attack wrong named theorem, data-only declarations, sorry/custom axioms, stale inputs, omitted modules
      and empty/fake success evidence. Mark unsupported interfaces and infrastructure failures explicitly.
    breaking_artifact: A reproducible false-success input or discrepancy between documented workflow,
      actual gate, exact theorem evidence and claimed coverage; retain positive and failed controls.
  - joint: J4-blind-mathematical-boundary
    assigned_to: TASK-20261018-29a8c7
    attack_plan: Read only blind-statements.json, independent Mathlib workspace and own handoff/AGENTS
      contract. Derive collision formulas and affine action from definitions; calculate the given finite-field
      examples; construct noncoprime transport and denominator controls; derive certificate boundary behavior.
      Use Lean kernel checks for finite controls where feasible, and label any written-only result.
    breaking_artifact: Independent formulas, checked small controls and certificate acceptance boundaries
      that the Coordinator can compare to producer types after this blind report is sealed.
  blindness:
    mutual: true
    lifted_for:
    - TASK-20261018-b1d5fa
    rationale: Only the synthesis Coordinator may read all completed reports after archival. Reviewer
      sessions remain mutually blind; the author may organize and repair but not supply an independent
      verdict.
  proves_too_much:
    objects:
    - ZMod 7 reverse composition with degree 7 without coprimality
    - Equal collision coefficients giving no unique scalar
    - An empty decomposition evaluated at a nonidentity target
    - Raw affine coordinates (0,0) on y^2=x^3+1 over ZMod 7
    failure_signature: The weakened injectivity/uniqueness conclusion must fail; the empty nonidentity
      decomposition and invalid coordinates must not be accepted as certificates. Expected Lean failure
      to apply a theorem is distinct from a checked mathematical counterexample.
    assigned_to: TASK-20261018-29a8c7
  blind_rederivation:
    required: true
    quantity: Collision scalar formulas and specified examples; left-to-right affine word action; transport
      necessity and certificate acceptance boundaries from mathematical definitions only. No timing or
      security exponent is a claim in this batch.
    parameters: research/lean_review_evidence_20261018/blind-statements.json
    blind_from:
    - /workspace/lean-review-inputs
    - /workspace/crypto
    - /workspace/cryptanalysis
    - /workspace/crypto-autoresearcher
    - /workspace/crypto-lean
    - research/lean_review_evidence_20261018/inputs.json
    - research/lean_review_evidence_20261018/workflow-inputs.json
    - research/lean_review_evidence_20261018/reports/TASK-20261018-63a7cc
    - research/lean_review_evidence_20261018/reports/TASK-20261018-a5dcec
    - research/lean_review_evidence_20261018/reports/TASK-20261018-dae80c
    assigned_to: TASK-20261018-29a8c7
  procedure_deviations: []
