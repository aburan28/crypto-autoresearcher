review_plan:
  claim_under_review: Final repair candidate binds configured hidden local sources as well as ordinary
    helpers; rejects inconsistent/stale receipt evidence; accepts the actual scoped zero-axiom audit format;
    and checks archived verifier bytes only under an explicit exact-revision selection. Source completeness
    excludes only declared .git/.lake infrastructure, with source-root inspection and immutable workspaces
    required. Existing gate repair and code copies are unchanged. No new research theorem or scientific
    status is claimed.
  coordinator_prior: I authored the new repairs after the first repair review broke hidden-directory coverage.
    All 229 relevant tests pass. The 65 fresh kernel receipts actually ran under older verifier 2951f9b...,
    before the hidden-directory repair; they are preserved and explicitly identified as such. Their actual
    workspaces contain no hidden local proof sources, and the new full input comparison plus explicit
    archived-verifier selection accepts all 65. This does not retroactively credit the new binder to that
    run. Independent review may still expose unsupported source/configuration cases; no general JSON execution
    authentication or hostile build-system defense is claimed.
  joints:
  - joint: J3-final-repair-boundaries
    assigned_to: TASK-20261018-1cab3a
    attack_plan: Independently replay imported hidden P=False to True during real version query, with
      unchanged target; require input-consistency exit3, plus clean positive and initial False controls.
      Recheck source additions/deletions and contradictory receipt fields. Replay real scoped zero-axiom
      receipt through corrected validator with explicitly pinned archived verifier; require wrong revision,
      changed hidden/local source and missing/contradictory audit evidence to fail. Confirm active Node
      wrapper invokes this validator and default current-verifier mode never silently credits old versions
      with current repairs. Gate code copies are unchanged from the earlier repair; verify byte identity
      and rerun a meaningful project positive/omitted-negative pair. Check skill statements/exclusions
      and report unsupported interfaces.
    breaking_artifact: A reproducible false-success receipt or omitted local source under the stated contract,
      a legitimate scoped audit wrongly rejected, or a mismatch between tool behavior and final skill
      guarantee.
  blindness:
    mutual: true
    lifted_for:
    - TASK-20261018-1cab3a
    rationale: New independent session may read only the original workflow review and the first repair
      workflow review, deliberately for hardening. It must not read J1/J2/J4 semantic reports or Coordinator
      synthesis.
  proves_too_much:
    objects:
    - Hidden configured local helper mutated False to True
    - New/deleted local source while target bytes remain fixed
    - Wrong task/result identity or forbidden constructs in a claimed success receipt
    - An archived-verifier override with changed local sources or wrong source revision
    failure_signature: False sources and inconsistent/stale records must never be accepted; persistent
      input changes are infrastructure/input-consistency failures. Both legitimate audit formats and nonvacuous
      current-code proofs must pass.
    assigned_to: TASK-20261018-1cab3a
  blind_rederivation:
    required: false
    rationale: Only workflow/input-binding repairs; mathematical proof statements and initial J4 derivations
      are unchanged.
  procedure_deviations: []
