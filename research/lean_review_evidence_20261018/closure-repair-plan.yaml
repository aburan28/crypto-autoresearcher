review_plan:
  claim_under_review: The corrected published candidate rejects exact audit-name mismatches and explicit
    audit failures; preserves prior persistent-source binding and explicit historical-verifier behavior;
    and audits tracked auxiliary proof files without changing frozen Lake configurations. This is validation
    of exercised workflow boundaries, not universal tool correctness, execution authentication, mathematical
    fidelity or scientific promotion.
  coordinator_prior: I authored the repair. 229 relevant tests, 11 gate controls, both consumer projects
    and the exact archived 65-receipt consistency recheck passed. Prior independent workflow reviews found
    real defects; their failures stay recorded. CI also exposed a frozen-Lakefile checksum rollout defect,
    now restored, and a stale consumer auditor/fixture bundle, now synchronized. Independent review must
    test behavior, not rely on my pass reports.
  joints:
  - joint: J3-closure-repair-controls
    assigned_to: TASK-20261018-2ea34a
    attack_plan: Start from authentic fresh and archived positive receipts. Append _WRONG to the named
      audit declaration and separately append explicit audit-failure diagnostics; require rejection by
      receipt_errors and active Node wrapper. Keep both legitimate counted/scoped audit formats accepted.
      Reproduce a persistent configured hidden-helper False-to-True mutation with unchanged target and
      source addition/deletion; require exit3/no verification, with true/initial-false controls. Exercise
      the current gate on unregistered and registered true/False-sorry sources; require both true cases
      to audit two theorems and false cases to fail. Replay the consumer bundle selftest with no default
      elan toolchain, using only directory pins. Check auditor/gate byte identity across shared/consumer
      copies, new retrospective pins, and restored historical config hashes. Verify archived 65 receipts
      only under explicit 2951f9b... selection, with current/wrong selections rejecting.
    breaking_artifact: A reproducible success on one of these contradictory records or omitted false modules,
      a legitimate positive wrongly rejected, missing source binding, or a mismatch between the stated
      bounded contract and actual code.
  blindness:
    mutual: true
    lifted_for:
    - TASK-20261018-2ea34a
    rationale: 'Deliberate workflow hardening: may read original J3 report, first repair report and reduced
      second-repair summary. No J1/J2/J4 semantic reports or synthesis.'
  proves_too_much:
    objects:
    - Different theorem audit with expected-name prefix
    - Pass text plus explicit audit failure
    - Persistent hidden helper False to True
    - Omitted False/sorry project proof
    failure_signature: All must fail in the appropriate evidence or kernel/source gate; positive real
      proofs must pass.
    assigned_to: TASK-20261018-2ea34a
  blind_rederivation:
    required: false
    rationale: Workflow-only repair; theorem sources and independent mathematical reviews are unchanged.
  procedure_deviations:
  - issue: Automatic approval review blocked uploading the preceding raw review source inventory and absolute
      workspace paths.
    handling: Unchanged originals retained in a local committed archive; reduced summary and identifying
      hashes published. This fresh review tests the published corrected candidate directly and publishes
      a scoped read attestation without unrelated internal inventories.
