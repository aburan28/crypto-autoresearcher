validation_report:
  id: TASK-20260922-a5ab4c/blind-report
  task_id: TASK-20260922-a5ab4c
  experiment_id: EXP-KIC-d9c828
  run_ids:
    - RUN-KIC-ba86d9
  scientific_snapshot: 43f937a8a08507affb7d4c15eab76977fa7c058e
  snapshot_parent: 8fc93f84761c646ebde6c3856f5bcba7fb581278
  joint: blind_panels_outcomes_paired_math
  joint_verdict: holds
  verdict: passed
  scope: >-
    Permanently blind independent finite replay of the frozen n19_k4 and
    n23_k16 public-synthetic panel, pair-membership, witness, receipt, and
    paired whole-cold-job timing quantities. This report validates its assigned
    joint only. It does not adjudicate the separately owned source/cost joint or
    change any research state.
  method:
    experiment_reruns: 0
    benchmark_reruns: 0
    native_control_reruns: 0
    checker_reruns: 0
    producer_source_imports: 0
    producer_checker_imports: 0
    private_or_imported_targets: 0
    scalar_log_recovery: 0
    independent_review_computation: >-
      A self-contained Python implementation rebuilt GF(2^19), GF(2^23), the
      binary curves, public generators, both base recipes, signed Frobenius
      bases, normal-coordinate orbit keys, full and canonical pair supports,
      deterministic public panels, direct first-hit queries, transported
      witnesses, raw receipt bindings, and the preregistered statistics.
  artifact_checks:
    - check: snapshot admission
      outcome: passed
      evidence: >-
        blind_admission.json binds this task to scientific snapshot
        43f937a8a08507affb7d4c15eab76977fa7c058e with parent
        8fc93f84761c646ebde6c3856f5bcba7fb581278 and declares permanent
        blindness, independent session, review-adversarial, gpt-5.6-sol,
        xhigh, no fallback, no degradation, and zero experiment reruns.
    - check: frozen public input bindings
      outcome: passed
      evidence: >-
        SHA-256 of inputs/n19_base.json and inputs/schedule.json exactly matches
        protocol.json; bindings.json carries the same n19 base hash.
    - check: deterministic schedule identity
      outcome: passed
      evidence: >-
        The schedule contains exactly 192 complete
        2-regime x 3-M x 8-panel x 4-repeat paired blocks and 384 exact arm
        expansions. Every panel has two expanded-first and two
        canonical-first repetitions; block order keys are sorted.
    - check: receipt eligibility and raw identity
      outcome: passed
      evidence: >-
        All 384 benchmark receipts are completed_valid, valid, exit zero,
        telemetry-valid, uncensored, below watchdog and memory guards, and
        exactly match the scheduled ordinal/block/regime/M/panel/repeat/arm.
        The raw archive SHA-256 is
        4a5cd5c58e129bb33e3eb8b3328f155da470518758616b3ba1a4762798f8ca18.
        All 1,567 regular archive members match raw_manifest.json in path,
        byte count, and SHA-256; every nested receipt result/timing object and
        stdout/stderr hash matches the corresponding archived member.
    - check: saved control and checker admission receipts
      outcome: passed
      evidence: >-
        The saved native-control and checker receipts are completed_valid,
        valid, exit zero, telemetry-valid, uncensored, and below their
        watchdog and memory guards. The checker implementation and checker
        result were not read or imported; its receipt was used only as the
        preregistered benchmark eligibility record.
  metric_recomputations:
    - metric: finite field, curve, generator, and base identity
      outcome: passed
      values:
        n19_k4:
          field_polynomial_irreducible: true
          trace: -797
          curve_order: 525086
          r: 262543
          r_prime: true
          public_generator: [393246, 31114]
          admitted_seed_indices: [13, 35, 28, 24]
          signed_base_points: 152
        n23_k16:
          field_polynomial_irreducible: true
          trace: -5197
          curve_order: 8393806
          r: 4196903
          r_prime: true
          public_generator: [2796197, 3750622]
          admitted_seed_indices: [0, 3, 4, 7, 15, 18, 28, 35, 36, 40, 52, 53, 57, 64, 65, 67]
          signed_base_points: 736
      evidence: >-
        Independent polynomial arithmetic, irreducibility tests, trace
        recurrence, trial-division primality, halftrace lifting, subgroup
        multiplication, and signed Frobenius expansion reproduce bases.json
        exactly. Both least normal elements are beta=3 with ranks 19 and 23;
        saved normal and inverse columns match exactly.
    - metric: pair support and canonical rows
      outcome: passed
      values:
        n19_k4:
          unordered_pairs: 11628
          distinct_expanded_sums: 11097
          anchored_pairs: 380
          canonical_rows: 293
          signed_frobenius_expansion_sums: 11097
        n23_k16:
          unordered_pairs: 271216
          distinct_expanded_sums: 260361
          anchored_pairs: 6256
          canonical_rows: 5661
          signed_frobenius_expansion_sums: 260361
      evidence: >-
        All saved canonical rows were independently reconstructed exactly from
        unordered seed-orbit anchors by the minimum normal-x orbit key and
        lexicographically least unordered normalized endpoint pair. Every
        endpoint and stored sum group-replays. Expanding each saved row through
        every sign and Frobenius frame equals the independently enumerated full
        pair-sum set exactly. The sorted packed-key digests match using the
        frozen y-low/x-high n-bit packing and UINT64_MAX infinity encoding.
    - metric: public panel identity
      outcome: passed
      values:
        n19_k4:
          panels: 8
          points_per_panel: 512
          unique_scalars_across_panels: 4076
          cross_panel_repetitions: 20
        n23_k16:
          panels: 8
          points_per_panel: 512
          unique_scalars_across_panels: 4094
          cross_panel_repetitions: 2
      evidence: >-
        SHA-256 scalar recipes and independent scalar multiplication reproduce
        oracle_metadata.json, public_panels.json, and all 16 Q-only panel files
        exactly. Each panel has 512 distinct scalars. Cross-panel overlap is
        retained as permitted by the frozen protocol.
    - metric: public outcomes, first hits, probes, and witnesses
      outcome: passed
      values:
        unique_panel_queries_per_regime: 4096
        benchmark_query_records_replayed: 69760
        n19_k4_unique_status_counts: {SAT: 3679, UNSAT: 417}
        n19_k4_unique_probe_median: 20.0
        n19_k4_unique_probe_max: 152
        n23_k16_unique_status_counts: {SAT: 4096}
        n23_k16_unique_probe_median: 12.0
        n23_k16_unique_probe_max: 278
      evidence: >-
        Direct scan of sorted B and independently enumerated pair support
        reproduces every saved panel decision, minimal third_index, probe
        count, expanded witness, canonical transported witness, and group sum.
        The same exact records appear in all nested M prefixes, arms, and four
        technical repetitions. Repeated jobs are counted separately from the
        4,096 unique targets in each regime.
    - metric: saved membership and exception controls
      outcome: passed
      values:
        n19_k4_membership_probes: 4096
        n19_k4_members: 177
        n19_k4_exception_queries: 153
        n23_k16_membership_probes: 4096
        n23_k16_members: 228
        n23_k16_exception_queries: 737
      evidence: >-
        The independent member-scalar recipe, exact pair-support membership,
        both stored pair witnesses, O plus every B-point exception query, first
        hit, and witness group replay match control_queries.json exactly.
    - metric: preregistered paired whole-cold-job wall ratios
      outcome: passed
      aggregation: >-
        Median of four fresh repetition wall times per
        regime/M/panel/arm; canonical_normal_x divided by expanded for each of
        eight panels; median of eight paired ratios. The descriptive 95%
        interval uses 10,000 index-bootstrap resamples from one
        Random(PAIR-REUSE-v1-bootstrap) stream in protocol regime/M order and
        type-7 quantiles.
      cells:
        - {regime: n19_k4, M: 1, median_ratio: 0.7636675193996606, ci_95: [0.7575052597203392, 0.7737279665493876]}
        - {regime: n19_k4, M: 32, median_ratio: 0.8246144927184089, ci_95: [0.7969905130224307, 0.8457936650469985]}
        - {regime: n19_k4, M: 512, median_ratio: 1.003193397822399, ci_95: [0.9919146715933422, 1.0086751945511185]}
        - {regime: n23_k16, M: 1, median_ratio: 0.28959503687633636, ci_95: [0.2821521172223422, 0.3027613431725844]}
        - {regime: n23_k16, M: 32, median_ratio: 0.32956741187054517, ci_95: [0.31409602792708735, 0.3505483856794324]}
        - {regime: n23_k16, M: 512, median_ratio: 0.646887831374332, ci_95: [0.6384838472688259, 0.6564915174997029]}
      primary_cell:
        regime: n23_k16
        M: 512
        arm_ratio: canonical_normal_x/expanded
        median_ratio: 0.646887831374332
        bootstrap_ci_95: [0.6384838472688259, 0.6564915174997029]
        threshold_median_lte: 0.90
        threshold_upper_lt: 1.0
        all_controls_checker_and_384_jobs_valid: true
        predeclared_effect_predicate: true
  control_checks:
    - check: actual public false certificates
      outcome: passed_with_joint_boundary
      evidence: >-
        In both regimes the saved wrong-inverse and wrong-sign endpoint pairs
        fail group replay to the saved target, the off-curve Q is off curve,
        the replacement is an r-subgroup point outside B, and the wrong key and
        stored sum differ from the genuine canonical row. This validates the
        certificates' mathematical falsehood. Verifier-source rejection is
        owned by source_base_transport_cost and is not claimed here.
  heuristic_validation_checks:
    - check: fixed-panel uncertainty scope
      outcome: passed
      evidence: >-
        The bootstrap resamples eight fixed public panel identities and is
        reported as descriptive finite-panel uncertainty. Panels are not
        stratified by outcomes; M=1,32,512 are nested prefixes and are not
        counted as independent data.
  cost_model_checks:
    - check: cold-job boundary and construction accounting
      outcome: passed
      evidence: >-
        Ratios use direct native Popen-to-sole-wait4 wall time. Each fresh job
        charges input reading, deterministic base construction and validation,
        arm-specific preparation, one pair-table construction, all M ordered
        queries and witness replays, and output. Construction is charged once
        per job and is not multiplied by M; both arms read the full common
        512-Q file for every M.
    - check: measured aggregate cost and memory scope
      outcome: passed
      values:
        jobs: 384
        total_wall_seconds: 17.233359785
        total_wait4_cpu_seconds: 16.364131999999998
        maximum_wait4_peak_rss_bytes: 18546688
        continuous_rss_samples: 165
        parent_validation_seconds_excluded_from_primary: 3.325994
      evidence: >-
        wait4 peak RSS is reported as the available process peak. Sparse
        continuous sampling is not promoted into a stronger memory bound.
  proof_architecture_checks:
    - check: exact finite baseline and representation interface
      outcome: passed
      evidence: >-
        The n19 base and expected pair counts reproduce exactly. Canonical
        representation preserves the complete finite signed-Frobenius pair
        support, and every stored/query transport is group-replayed at the
        representation interface. This is finite implementation evidence, not
        a proof of an asymptotic or full-IC improvement.
  checks_summary:
    independent_assertions: 312644
    failed_assertions: 0
    faults_or_censored_benchmark_receipts: 0
  code_and_result_hashes:
    blind_rederive.py:
      sha256: a1fda7609da49ec574d1c18b6fc3d1a929f5426345d4a90ccd84139c9a0e73fc
      bytes: 58912
    blind_results.json:
      sha256: 5984fa4f9348fe91894d04dfa3a5d0de793eb641065b0911b1bbca164805bd3d
      bytes: 64612
  actual_commands:
    - "sed -n ... AGENTS.md agents/validator.md research/pair_reuse_20260922/blind_review_handoff.json research/pair_reuse_20260922/review_plan.json research/pair_reuse_20260922/review/blind_admission.json"
    - "jq ... research/pair_reuse_20260922/protocol.json research/pair_reuse_20260922/inputs/*.json and allowed RUN-KIC-ba86d9 JSON receipts"
    - "tar -tzf experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/raw_outputs.tar.gz"
    - "PYTHONDONTWRITEBYTECODE=1 python3 research/pair_reuse_20260922/review/blind_rederive.py"
    - "shasum -a 256 research/pair_reuse_20260922/review/blind_rederive.py research/pair_reuse_20260922/review/blind_results.json"
  development_note: >-
    A first pre-seal run exposed that numeric-y sign normalization and ordered
    endpoint comparison were extra conventions absent from the frozen
    statement. The final implementation instead derives the declared
    minimum-normal-x and lexicographically least unordered normalized-pair
    representation, which reproduces every saved row exactly. This was a
    review-code correction before sealing, with no protocol, evidence, trial,
    receipt, or scientific artifact change.
  procedure_deviations: []
  limitations:
    - >-
      Evidence is finite and fixed-panel: n=19/K=4 and n=23/K=16 with eight
      public 512-point panels each.
    - >-
      The bootstrap is descriptive over eight fixed lists, not population
      uncertainty or an asymptotic inference.
    - >-
      Field size and base size change together across regimes; cross-regime
      differences do not isolate either factor.
    - >-
      n19_k4/M=512 is descriptively near parity and does not satisfy the
      primary effect criterion; only n23_k16/M=512 is the preregistered primary
      cell.
    - >-
      No relation construction, solver/rank/matrix/extraction cost, full index
      calculus, matched rho, or generic-exponent change is measured.
    - >-
      No claim is made about cryptographic key recovery, imported targets,
      novelty, asymptotic improvement, or transfer beyond the frozen public
      synthetic scope.
  artifact_paths:
    - research/pair_reuse_20260922/review/blind_report.yaml
    - research/pair_reuse_20260922/review/blind_rederive.py
    - research/pair_reuse_20260922/review/blind_results.json

