  - id: SRC-INTERFACE
    outcome: holds
    severity: none
    joint: source_base_transport_cost
    finding: >-
      Each cold worker receives the public base-recipe path and exactly one
      512-Q regime/panel file plus panel, M, arm, and output. All 384 argv
      records have this nine-token shape. The Q-only files contain only schema,
      regime, panel, and points; no scalar, generator advice, expected status,
      oracle, retained table, or short-circuit input reaches a worker. The
      n19_base input does contain an old public generator field, but the worker
      source never reads it.
    evidence:
    - experiments/EXP-KIC-d9c828/code/native.cpp:208
    - experiments/EXP-KIC-d9c828/code/native.cpp:821
    - experiments/EXP-KIC-d9c828/code/native.cpp:827
    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/panel_files.json
    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/benchmark_receipts.jsonl
  - id: SRC-COST
    outcome: holds
    severity: none
    joint: source_base_transport_cost
    finding: >-
      Source and receipts charge full 512-Q file input, fresh base reconstruction
      and validation, fresh normal/nibble preparation for the canonical arm,
      exactly one table construction, every requested Q, transport and group
      replay, serialization, output write, and process teardown. The primary
      wall is direct native Popen through Darwin kqueue NOTE_EXIT and the sole
      wait4 reap. Construction is outside the query loop and is not multiplied
      by M; parent validation, hashing, fsync, and archive work are measured
      separately.
    evidence:
    - experiments/EXP-KIC-d9c828/code/native.cpp:827
    - experiments/EXP-KIC-d9c828/code/runner.py:312
    - experiments/EXP-KIC-d9c828/code/runner.py:497
    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/benchmark_receipts.jsonl
    - research/pair_reuse_20260922/supervisor/benchmark.receipt.json
  - id: SRC-PROVES-TOO-MUCH
    outcome: holds
    severity: none
    joint: source_base_transport_cost
    finding: >-
      The native control passes actual wrong-shift and wrong-sign endpoints to
      verify_pair, passes the wrong key and stored sum to verify_row, passes an
      off-curve Q to query, and applies the constructor's closure predicate to
      a removed-point base and a same-cardinality subgroup replacement. The
      independent review established that every saved certificate is genuinely
      false under both regimes and that no forged object is accepted.
    evidence:
    - experiments/EXP-KIC-d9c828/code/native.cpp:484
    - experiments/EXP-KIC-d9c828/code/native.cpp:556
    - experiments/EXP-KIC-d9c828/code/native.cpp:653
