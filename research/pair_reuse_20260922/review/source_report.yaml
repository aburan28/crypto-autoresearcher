    exact finite transport, Q-only worker interface, one-construction-per-job
    cost boundary, immutable raw receipts, and additive custody corrections
    support the preregistered finite N23/K16 M=512 result. This is not a
    research-status transition and makes no full-index-calculus or rho claim.
  claim_boundary: >-
    Public-synthetic coordinate point decomposition on the two fixed regimes
    K_1/F_2^19 with four seed orbits and K_1/F_2^23 with sixteen seed orbits,
    eight deterministic 512-Q panels, M in {1,32,512}, and four technical
    repeats. No imported target, private scalar, log recovery, full relation
    collection, matrix/rank/solver/extraction pipeline, rho baseline,
    asymptotic exponent, novelty, or security-break claim was tested.
  findings:
