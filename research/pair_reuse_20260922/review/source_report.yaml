    severity: none
    joint: source_base_transport_cost
    finding: >-
      Independent arithmetic reconstructed the exact N19 and N23 parameter
      sets, bases, least normal bases, unordered pair supports, lexicographically
      retained canonical rows, signed-Frobenius expansions, O/T cases, inverse
      transport, first-hit decisions, probes, and witnesses with zero mismatch.
    evidence:
