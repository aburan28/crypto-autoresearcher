  control_checks:
  - finding: holds
    severity: none
    check: >-
      One native control and one separately admitted Python checker completed.
      Native control covers irreducibility, trace/order and r primality, n^2
      monomial products, 4,096 hashed products/inverses, every field value for
      polynomial/normal/nibble roundtrip and Frobenius rotation, 4,096 group
      batches per regime, complete support, all panels, exceptions, membership
      probes, and known-false certificates. The checker independently uses
      long-division multiplication, Euclidean inverse, and its own group law.
  - finding: holds
    severity: none
    check: >-
      All stored canonical endpoints belong to B and sum to the stored point;
      all keys equal the exact normal-x orbit key; every one of 293/5,661 rows
      is the exact first lex row under the frozen anchor enumeration; expanding
      each row through all signed Frobenius images equals the exact 11,097/
      260,361 full-point pair support.
  - finding: holds
