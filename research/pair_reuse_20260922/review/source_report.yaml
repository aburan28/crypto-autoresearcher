      canonicalization and inverse transport. Cross-regime ratios do not
      isolate field degree from base size because both change together.
  proof_architecture_checks:
  - finding: holds
    severity: none
    check: >-
      P8 N19 counts and transport are reproduced exactly; expanded is a direct
      same-job comparator; wrong transport and noninvariant-base controls do
      not prove too much; quantifiers were frozen before measurement; the
      method ceiling remains finite decomposition cost rather than full IC or
      rho.
  limitations:
  - >-
    External timing validity is limited by one loaded host, one compiler and
    binary, four technical repeats, and eight fixed deterministic panels.
    Balanced adjacent arm orders mitigate drift but do not replace a quiet-host
    or independent-host replication.
  - >-
    The primary N23 panels are all SAT and cannot identify cost for an UNSAT or
    differently mixed workload. Nested M prefixes and cross-panel overlaps are
    disclosed; the eight panel ratios are the descriptive resampling units.
  - >-
    N19/M512 is approximately parity and its interval overlaps one. The primary
    N23/M512 result must not be generalized backward to N19 or forward to an
    untested larger regime.
  - >-
    This run establishes no full-IC or rho improvement. Relation yield,
    relation construction outside decomposition, rank, solver, matrix,
    extraction, verification, preprocessing, and matched rho remain absent.
