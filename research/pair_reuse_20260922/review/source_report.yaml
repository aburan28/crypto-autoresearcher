    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/independent_replay.json
  - id: SRC-CUSTODY
    outcome: holds
    severity: none
    joint: source_base_transport_cost
    finding: >-
      Source, input, binary, raw archive, manifest, and receipt hashes match the
      Coordinator snapshot. The snapshot, binding, review admission, and claim
      commits are contained by origin/codex/pair-reuse-20260922. Review-plan
      blindness allowed byte-level readback of 111 of 112 bound paths; the only
      excluded content was the sibling blind-review handoff, whose hash remains
      bound by the Coordinator snapshot receipt. No sibling report, code,
      status, or message was read.
    evidence:
    - research/pair_reuse_20260922/science_snapshot_receipt.json
    - research/pair_reuse_20260922/review/source_admission.json
    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/source_closure.json
    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/raw_manifest.json
  - id: SRC-HOST-LOAD
    outcome: inconclusive
    severity: low
    joint: source_base_transport_cost
    finding: >-
      The benchmark supervisor records load averages 13.875/17.895/19.453
      before and 16.805/18.270/19.543 after on a 14-logical-CPU host. Adjacent
      paired blocks and exactly two EF plus two FE repeat orders per cell reduce
      arm-order drift, but no quiet-host replication establishes portability of
      these sub-155ms process timings.
    evidence:
    - research/pair_reuse_20260922/inputs/schedule.json
    - research/pair_reuse_20260922/supervisor/benchmark.receipt.json
  - id: SRC-CASE-SCOPE
    outcome: inconclusive
    severity: low
    joint: source_base_transport_cost
    finding: >-
      Panels are eight fixed deterministic public lists; M prefixes are nested
      and four repeats are technical repeats on one host. All 4,096 N23 panel
      queries are SAT, whereas N19 has 3,679 SAT and 417 UNSAT. The primary
      N23 result therefore does not estimate an UNSAT workload or an IID target,
      curve, base, compiler, or host population. The bootstrap is descriptive
      over the eight fixed panels.
    evidence:
    - research/pair_reuse_20260922/protocol.json
    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/independent_replay.json
    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/analysis.json
  - id: SRC-FULL-IC-RHO
    outcome: inconclusive
    severity: high
    joint: source_base_transport_cost
    finding: >-
      No full IC or matched-rho improvement follows. P9 times point
      decomposition jobs only. It contains no relation construction/yield,
      independent-row rank, sparse solve, extraction, final verification,
      preprocessing amortization, or matched rho measurement. The earlier P8
      source review and this run use finite decomposition metrics; neither can
      be substituted for the old charged full-IC/rho metric.
    evidence:
    - research/pair_reuse_20260922/protocol.json
    - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/analysis.json
    - research/n19_pair_transport_20260921/review/source_report.yaml
