  panel_distinctness_correction:
    source_read:
      - experiments/EXP-KIC-d9c828/runs/RUN-KIC-ba86d9/public_panels.json
    audit_method: >-
      Treat each saved affine coordinate pair as an exact tuple. For each
      regime, count tuple cardinality independently inside each of the eight
      panels, then count tuple multiplicity across the concatenation of all
      eight panels. No oracle scalar metadata, producer implementation,
      aggregate analysis, sibling output, or benchmark process was used.
    incorrect_sealed_phrase: "4096 unique public targets per regime"
    corrected_phrase: >-
      4,096 public panel positions per regime. Every individual panel contains
      512 distinct points. Across the eight panels there are 4,076 distinct
      points for n19_k4 and 4,094 distinct points for n23_k16; the remaining
      positions are permitted cross-panel repetitions.
    exact_counts:
      n19_k4:
        panels: 8
        positions_per_panel: [512, 512, 512, 512, 512, 512, 512, 512]
        distinct_points_per_panel: [512, 512, 512, 512, 512, 512, 512, 512]
        total_panel_positions: 4096
        distinct_points_across_all_panels: 4076
        cross_panel_repeated_positions: 20
        distinct_points_occurring_more_than_once: 20
        maximum_point_multiplicity: 2
        multiplicity_distribution:
          1: 4056
          2: 20
        nonzero_pairwise_panel_overlaps:
          - {panels: [0, 4], points: 2}
          - {panels: [0, 5], points: 1}
          - {panels: [0, 6], points: 1}
          - {panels: [0, 7], points: 1}
          - {panels: [1, 5], points: 2}
          - {panels: [2, 3], points: 1}
          - {panels: [2, 4], points: 1}
          - {panels: [2, 5], points: 3}
          - {panels: [2, 6], points: 1}
          - {panels: [2, 7], points: 2}
          - {panels: [3, 4], points: 1}
          - {panels: [3, 5], points: 3}
          - {panels: [3, 6], points: 1}
      n23_k16:
        panels: 8
        positions_per_panel: [512, 512, 512, 512, 512, 512, 512, 512]
        distinct_points_per_panel: [512, 512, 512, 512, 512, 512, 512, 512]
        total_panel_positions: 4096
        distinct_points_across_all_panels: 4094
        cross_panel_repeated_positions: 2
        distinct_points_occurring_more_than_once: 2
        maximum_point_multiplicity: 2
        multiplicity_distribution:
          1: 4092
          2: 2
        nonzero_pairwise_panel_overlaps:
          - {panels: [1, 4], points: 1}
          - {panels: [4, 5], points: 1}
    effect_of_correction: >-
      Metadata wording only. The replay consumed the exact saved panel arrays,
      and the bootstrap resampled panel indices rather than treating the 4,096
      positions as independent observations. Cross-panel repetitions were
      therefore already present in every sealed calculation. No result,
      interval, primary predicate, or joint verdict is changed or rescored.
  bootstrap_rng_clarification:
    sealed_choice: >-
      One Python random.Random instance was constructed once with the string
      seed PAIR-REUSE-v1-bootstrap immediately before iterating cells. The same
      continuously advancing stream was reused for all six cells in protocol
      order: n19_k4 at M=1,32,512, followed by n23_k16 at M=1,32,512. Each cell
      consumed 10,000 resamples, each resample drawing eight panel indices with
      replacement. The generator was not reset between cells.
    reason_for_choice: >-
      The protocol describes the procedure with a singular
      Random(PAIR-REUSE-v1-bootstrap) and one aggregation paragraph. The blind
      replay interpreted that singular construction literally as one seeded
      stream and used the regime order and M order already declared by the
      protocol for cell traversal.
    prose_explicitly_fixes_cross_cell_reset_behavior: false
    under_specification: >-
      The protocol fixes the seed, 10,000 resamples, eight panel-index draws,
      replacement, median statistic, and type-7 quantiles. It does not
      explicitly state whether a generator is reset to the same seed for each
      cell or advanced continuously across cells. It also does not separately
      declare a bootstrap cell-stream ordering. The sealed replay's continuous
      protocol-order stream is therefore a disclosed interpretation, not the
      only behavior forced by the prose.
    alternative_stream_computed: false
    convergence_or_comparison_attempted: false
    existing_values_changed_or_rescored: false
  effect_on_review:
    assigned_joint: blind_panels_outcomes_paired_math
    original_joint_verdict: holds
    addendum_joint_verdict: holds
    primary_effect_predicate_changed: false
    scientific_scope_changed: false
    reason: >-
      The distinctness correction accurately narrows a descriptive metadata
      sentence. The RNG clarification discloses the lifetime choice already
      used to obtain the sealed values and identifies an ambiguity in the
      protocol prose. Neither finding changes the exact finite group replay,
      witness checks, receipt integrity, saved ratios, or the original
      joint-level validation outcome.
  actual_command: >-
    PYTHONDONTWRITEBYTECODE=1 python3 - [read only public_panels.json; count
    exact coordinate tuples within panels and across their concatenation]
  writes:
    - research/pair_reuse_20260922/review/blind_addendum.yaml
  experiment_reruns: 0
  benchmark_reruns: 0
  statistical_recomputations: 0
  model_changes: 0

