advancement_gate: >-
  The immutable v2 advancement gate applies together with every addendum gate.
  This overlay cannot dispatch a run.  A fresh Coordinator decision must state
  interface_revision 3 and bind the direct fork topology P->D1->A1 for Role 1
  and P->D2 for Role 2 in distinct sealed protocol repositories; A1 is not an
  ancestor of D2. P is equal across the two stores by raw commit, canonical
  topology, and the SHA-256 payload map for the union of selected/protected
  leaves and every committed attributes-policy blob. The pre-Role-1 D1 receipt
  and 0700 staging-parent identity are retained under trusted-exclusive
  procedural chronology, copied unchanged into A1 after Role 1, and paired with
  a terminal A1 receipt in D2. The raw D1-to-A1 delta is exactly the twenty
  required Role-1 run leaves plus that one fixed archived pre-receipt leaf,
  with no unrelated change. The five protocol/native repository roots are
  pairwise distinct and non-nested. Each has a local non-hardlinked required
  object closure, no remote/promisor/alternate/shallow route, a direct loose or
  detached HEAD with exact canonical bytes (lowercase 40-hex plus LF in either
  the detached HEAD or direct loose ref), the frozen config including
  hooksPath=/dev/null, and a complete
  extension-free v3 stage-zero index: selected regular leaves are H, omitted
  leaves are S entries and physically absent from the worktree, and
  sparse-preparation metadata is absent.
  The finite commit domain is Role-2 P, D2, and A2 iff archived; predecessor P,
  D1, and A1; and the single bound HEAD of each native repository. Ordinary
  omitted blobs and gitlink targets are out of scope; every commit in that
  domain, recursively traversed tree, selected/protected/decision/source-build/output blob,
  and attributes-policy blob is self-hashed, SHA-256 bound, and replayed in one
  final same-repository mixed-object stream after that repository's subprocesses;
  only no-process administration/HEAD/ref/index/config/worktree identity seals
  follow it. A bounded nofollow worktree walk rejects unexpected files, rogue
  empty directories, and tracked native target output. The clean Role-2
  producer commit equals the immutable predecessor factor-base source commit;
  verifier and supervisor commits, executable hashes, repository/package roots,
  and every resolved argv array are separately bound. Advancement also requires
  full protected Role-1 validation and raw-decision replay; fixed inherited
  executable, predecessor, and directory-FD custody; active package-lock and
  whole-package source binding; exact scoped verifier build admission with
  hash-bound Cargo/Rustc, sanitized offline frozen argv/environment, one-member
  Cargo metadata graph/target set, retained configuration-absence custody,
  in-package compiler inputs, selected-bin dep-info byte/hash and committed
  local-input closure, and checksum-locked exact-crates.io dependencies;
  and post-run cross-document validation against that same committed decision,
  the exact retained canonical CONTROL_DIR, and the outer post-manifest
  terminal-custody seal.  A failure raw result must carry both replayed terminal
  counts, an exact schema-valid and semantically PASS prior-phase prefix,
  truthful PASS-manifest transition state, and flat single-link regular
  RUN/CONTROL custody inventories with no nested mutable state, and can never
  advance the family.  Every such failure retains and identity-binds
  CONTROL_DIR; a canonical-producer failure requires its inventory to be
  exactly empty. Per-file, small-document, producer-tree, RUN metadata, RUN,
  CONTROL, combined logical, and distinct committed-blob byte gates are
  mandatory; resource failure is infrastructure INCOMPLETE and never a
  scientific null. The separate 512 GiB session ceiling is externally
  quota-backed, not an evidence-file gate. Runtime evidence is wholly untracked;
  same-workspace archival
  replay is accepted only from one archive commit whose sole parent is the
  decision commit and whose exact raw full-tree delta is the two complete output
  trees.  Full post-run admission is original-supervised-workspace-only because
  it binds absolute paths and device/inode identities; a relocated clone has no
  portable-admission mode and cannot establish a full PASS.
