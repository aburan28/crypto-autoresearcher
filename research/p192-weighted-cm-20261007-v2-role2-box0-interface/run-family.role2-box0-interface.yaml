advancement_gate: >-
  The immutable v2 advancement gate applies together with every addendum gate.
  This overlay cannot dispatch a run.  A fresh Coordinator decision must bind
  one final clean protocol commit, a clean decision commit strictly descended
  from it, exact protocol and per-role repository/package checkouts, the clean
  Role-2 producer commit equal to the immutable predecessor factor-base source
  commit, separately identified verifier and supervisor commits, exact
  executable hashes, and every resolved argv array.  Advancement also requires
  byte/mode equality for the complete protected-path list at both protocol and
  decision commits and the current checkout, plus post-run cross-document
  validation against that same committed decision.  A failure raw result must
  carry both replayed terminal counts and can never advance the family.
