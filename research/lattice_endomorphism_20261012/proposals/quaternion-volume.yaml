  id: IDEA-20261014-6e60f1
  title: Noncommuting Hurwitz pairs with separate volume and closure certificates
  question_id: RQ-SSI-3e3f54
  goal_id: GOAL-ENDO-001
  task_id: TASK-20261012-7017ce
  class: measurement
  claim: Full-rank L in supplied Hurwitz O has det(trace Gram)=4*[O:L]^2. Noncommuting pairs span rank4 via (1,a,b,ab) but
    may generate proper orders. Equal volume/rank can hide nonclosure; certify containment and normalization separately.
  mechanism: Compare exact Hamilton trace Gram with independent coordinate volume. Audit pair-product rank/index, containment
    and every product. Derived alternate pair metric detG=Nrd([a,b])² awaits review; no cost gain claimed.
  citations:
  - ref: https://jvoight.github.io/quat-book.pdf
    provenance: retrieved
    claim: 'Read Lemma11.1.2, Lemma15.2.15, Theorem15.5.5/Example15.5.7: Hurwitz maximality, index-squared discriminant and
      p2 model.'
    verified_by: /root/lattice_exploration, 2026-10-14; exploration.md receipt
  - ref: https://aiezzi.it/documents/art7.pdf
    provenance: retrieved
    claim: Read trace Gram definition/AppendixA passages; odd-prime p-saturation is not directly applied at2.
    verified_by: /root/lattice_exploration, 2026-10-14; exploration.md receipt
  - ref: H-SSIQ-a9df38
    provenance: internal
    claim: Existing derivation distinguishes trace p² from norm p²/16 and determinant-only ceiling; not evidence for this
      pilot.
    verified_by: /root/lattice_exploration, 2026-10-14; exploration.md receipt
  assumptions:
  - Certified supplied maximal Hurwitz O at p2; trace pairing, not half-Gram.
  - Verify full rank and ambient membership before integer index extraction.
  - Frozen pool and charged selection; p2 etale basis gate excludes ell2, while exact lattice division remains meaningful.
  proof_search_map:
    bottleneck: Certify actual supersingular maps and maximal ambient embedding; volume cannot supply them.
    baseline_embedding:
      parameter_slice: Full Hurwitz1,i,j,h has det4/index1.
      reproduction_check: Independent trace Gram and coordinate determinant; verify products and maximality normalization.
    observation_collision:
      observable: Rank and determinant; separately individual pair norms and nonzero commutator.
      distinct_preimage_search: L=<1,i,j,2k> and R=<1,i,j+k,j-k> both index4/det64, only R closed. Pairs i/j and i/h have
        norms1/1 but indices2/1.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Containment, rank, unit, closure, index and commutator certificate tuple.
      predicted_gain: Separate lattice, order and complete maximal order.
    - transform: representation_reduction
      proposed_object: Compare commutator norm with pair Gram volume and ambient index.
      predicted_gain: Alternate exact metric; no measured cost improvement.
    quantifier_order: Every full-rank L in certified Hurwitz O satisfies the volume identity. Every supplied noncommuting
      pair has rank4 product span, not necessarily index1. No arbitrary-characteristic map-acquisition method.
    method_ceiling:
      strongest_certifiable_claim: Exact p2 supplied-order diagnostics; det4 plus containment certifies equality with O, not
        curve embedding.
      nearby_object_control: Equal-volume nonclosed lattice, nonmaximal Lipschitz pair, ell2 etale exclusion versus exact
        division.
    proof_obligations:
    - claim: Trace normalization and maximal Hurwitz det4.
      responsibility: baseline
    - claim: Volume/index and pair commutator derivations reviewed.
      responsibility: correctness
    - claim: Actual maximal embedding and maps independently certified.
      responsibility: interface
    not_applicable_reason: null
  predictions:
  - metric: volume_index_residual
    direction: lower
    minimum_effect: exactly zero on valid full-rank included lattices
  - metric: closure_collision
    direction: different
    minimum_effect: equal determinant64 but different multiplication-closure flags
  - metric: pair_completion_index
    direction: different
    minimum_effect: i/j gives2; i/h gives1; commuting pair rank below4
  minimal_test:
    design: Frozen coordinator Hurwitz basis and {-1,0,1} coefficient pool. Check exact Gram/index/closure and policy counts;
      include coordinator <1,2i,2j,3k>, equal-volume L/R, i/j versus i/h, and separate ell2/3/5/7 lattice/etale gates.
    controls: [ambient Hurwitz, Lipschitz index2, commuting rank deficiency, equal-volume closed/nonclosed lattices, coordinator
        nonclosed lattice, scalar/short distractors, half-Gram normalization error, nonintegral rational lattice, characteristic-prime
        gate]
    required_metrics: [reduced trace/norm, Gram entries/determinant, containment coefficients, rank, index, unit membership,
      all product memberships, commutator norm, candidate selection counts, lattice-division versus etale eligibility]
  falsification_conditions:
  - A valid full-rank included lattice violates determinant4*index^2 under correct trace convention.
  - Equal-volume fixtures are both marked closed, or noncommuting i/j is marked maximal without completing index2.
  - Characteristic2 point-torsion evidence is accepted as an etale basis certificate.
  confounders: [trace versus norm Gram factor16, full rank mistaken for closure, noncommutativity mistaken for maximality,
    omitted containment, odd-prime saturation procedure silently applied at2, uncharged candidate discovery]
  dominated_by:
    verdict: Standard discriminant/HNF baseline suffices.
    justification: Determinant-only shortest-vector ceiling in H-SSIQ-a9df38; no EndRing/isogeny speed claim.
