  id: IDEA-20261014-2a4b38
  title: Actual order index and module-zero division as saturation certificates
  question_id: RQ-ENDO-4a2bfa
  goal_id: GOAL-ENDO-001
  task_id: TASK-20261012-6a1e88
  class: control
  claim: In supplied O_f, the unital ring generated by a_j+b_j*f*omega has index gcd(b_j). Rank2 and closure can hold at larger
    index. Valid gamma/ell division is equivalent to zero action on the entire Lambda/ell*Lambda; selection costs stay diagnostic.
  mechanism: Track unit, HNF/rank, closure and actual index independently of coefficient gcd. Check every quotient basis vector
    before division. Compare fixed policies on the same pool and charge discovery, scoring and updates.
  citations:
  - ref: https://arxiv.org/pdf/0902.4670
    provenance: retrieved
    claim: Introduction/section2 distinguish actual and Frobenius conductors; full algorithm proofs not audited.
    verified_by: /root/lattice_exploration, 2026-10-14; exploration.md receipt
  - ref: https://aiezzi.it/documents/art7.pdf
    provenance: retrieved
    claim: AppendixA separates lattice, multiplication, generated order and enlargement in quaternion setting; not a CM division
      proof.
    verified_by: /root/lattice_exploration, 2026-10-14; exploration.md receipt
  assumptions:
  - Supplied actual O_f=multiplier(Lambda), with unit explicit.
  - Frozen common candidate pool/tie breaks; count all acquisition/scoring/rejection costs.
  - Actual-curve division needs full faithful torsion/group-scheme action and explicit quotient map; etale basis requires
    ell!=characteristic.
  proof_search_map:
    bottleneck: Certify missing saturation directions and price actual candidate discovery.
    baseline_embedding:
      parameter_slice: O_f, generators f*omega and1 recover index1; generators1 and6*f*omega are rank2 closed at index6.
      reproduction_check: Independent HNF containment index must equal coefficient gcd, and all products must remain in the
        recorded ring.
    observation_collision:
      observable: Additive rank, short-generator norm and zero action on a selected module vector.
      distinct_preimage_search: O_f and O_6f both rank2 closed. In actual O_2 in Q(i), gamma2i has norm4 yet gamma/2 is invalid
        and full action mod2 nonzero.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Generated-order index trajectory plus full quotient-module action and verified accepted divisions.
      predicted_gain: Exact certificate discrimination; no measured performance gain.
    quantifier_order: Every finite supplied unital quadratic set has coefficient-gcd index. Every actual gamma divides by
      ell iff its full mod-ell action is zero. A fixed policy panel asserts no universal advantage.
    method_ceiling:
      strongest_certifiable_claim: Saturation relative to supplied actual ring; diagnostic fixed-pool cost counts.
      nearby_object_control: Norm-only or one-vector-only false division; complete actual nonmaximal O_f must not enlarge
        to O_K.
    proof_obligations:
    - claim: Products and Bezout show the unital ring has coefficient gcd index.
      responsibility: correctness
    - claim: Full module-zero action exactly characterizes divisibility in the multiplier ring.
      responsibility: correctness
    - claim: Candidate scoring/updates and unsuccessful selections are completely counted.
      responsibility: runtime
    - claim: Actual curve ring and full torsion/divided-map interfaces independently certified.
      responsibility: interface
    not_applicable_reason: null
