key_findings:
  - "Heuristic 1 is exactly the claim that rare representation events are near-disjoint: the PROVEN class-number first moment (Eichler/Brandt trace formula, Hurwitz H(4np)) of the number of B-smooth-degree conjugate isogenies per curve matches u^{-u(1+o(1))}; proving the heuristic reduces to a second-moment/disjointness bound plus smooth-weighted L(1,chi) moments (route b)."
  - "Known fluctuation channels cannot break the exponent: L(1,chi_{-4np}) extremes are polyloglog (p^{o(1)}), the lattice-minimum size distribution shifts u by o(1), the j-in-F_p spike (delta_E = 1) has mass p^{-1/2+o(1)}, and extra automorphisms are O(1) curves."
  - "PROVEN absence of the naive refutation route: the degree form Q' (discriminant p/4) is nondegenerate mod every prime l not dividing 2p, so it represents all classes mod l; no forced small-prime divisibility or forbidden residue class of delta_E exists."
  - "One signed bias identified (SPECULATIVE, testable, constant factor): for B-smooth n the small primes l | n are ramified in Q(sqrt(-4np)), demoting Euler factors of L(1,chi) from mean l^2/(l^2-1) to 1 — a bias AGAINST smoothness of total size O(1) (e.g. ~0.63 for 2*3*5*7 | n); absorbed in (1+o(1)) but relevant to the paper's Section 4.1 concrete-cost table."
  - "The paper's Figures 1-2 do not discriminate size models: they compare against rho(u) with u from the MAXIMUM X = (p/2)^{1/3}, not from each sample's actual delta_E; a size-conditioned re-analysis is the sharpest cheap test of the random-integer justification."
  - "No parity bias on delta_E: the AOV Gram identity p = 4 det N forces at least one nonzero off-diagonal but leaves N1 mod 2 free in some branches; the candidate sum-of-two-squares bias for p = 3 mod 4 was checked and refuted (every residue mod p is a sum of two squares)."
  - "AOV (arXiv:2607.14624, fetched in full) provides ground truth: delta_E for all curves, all p <= 22000, plus sieved primes to 265207; 119 wisde primes (~0.5%) attain delta_E = floor((p/2)^{1/3}); their code is public and their per-prime cost (< 35 s at p ~ 2.6e5 post-enumeration) makes EXP-1 laptop-feasible."
  - "No independent analysis of Heuristic 1 was found in web search (paper is days old); Panny's PoC (fetched) attacks p ~ 2^40 and uses the pre-tightening X = B*(p/2)^{1/6}."
  - "Full proof of Heuristic 1 via random-lattice statistics (route a) or rigorous CEP uniformity (route d) is currently intractable; route (b) is the only visible program and is multi-year analytic number theory."
proposed_experiments:
  - id: EXP-1-MINFACT
    title: "Discriminate the random-integer model for delta_E against biased alternatives (toy scale)"
    mechanism: "Conditional on its value, delta_E should factor like a uniform integer of the same size iff Heuristic 1's justification holds; genus constraints, size-model mismatch, or the L-factor bias produce signed measurable deviations."
    protocol: "Enumerate maximal orders of B_{p,inf} for all p in [10^3, 22000] (stratified by p mod small primes), compute Gross lattice, ternary form Q', delta_E = N1 via Eisenstein reduction; extend by sampled orders up to p ~ 2^28; record delta_E factorization, Gram data, p mod l, #Aut, subfield flag."
    metrics: "T1 size-conditioned smoothness P(delta_E B-smooth | delta_E = n) vs exact Psi(n,B)/n; T2 congruence equidistribution of delta_E mod l stratified by p mod l; T3 prime-minimum rate vs exact random prediction; T4 smooth fraction vs H(4np)-weighted first-moment prediction; T5 delta_E = 1 spike calibration ~ p^{-1/2}."
    test_boundary: "p <= 2^28, u in [2,6]; toy-scale only (AGENTS.md rule 7); toy confirmation does not validate crypto sizes, toy falsification of the model weakens the global uniformity claim."
    falsification_criteria:
      - "Heuristic 1 weakened in tested scope if T1 shows a persistent deficit >= 2x growing with u, or T3 prime-minimum excess > 3 sigma growing in p."
      - "Unconditional random-integer model rejected and replaced by H(4np)-weighted first-moment model if T2 reveals forced/forbidden classes or T4 confirms a stable constant-factor deficit matching the B3 prediction."
      - "Experiment invalid if T5 calibration fails, reduction is not verified against brute force at p <= 10^3, or < 10^4 records collected."
    budget: "Days on one laptop, SageMath/Python; AOV per-prime timings support feasibility."
  - id: EXP-2-LMOMENT
    title: "Measure the B3 class-number bias and the disjointness factor directly"
    mechanism: "P(exists smooth conjugate isogeny) is driven by the first moment sum over B-smooth n of w(n,p) ~ H(4np); B3 predicts w averaged over smooth n sits a constant factor below the naive Psi-weighted average; Heuristic 1 requires observed/first-moment -> 1 in the rare regime."
    protocol: "For ~50 primes p in [10^4, 10^6]: compute exact first moment via Hurwitz class numbers (PARI qfbclassno), naive Psi prediction, and empirical smooth-conjugate-isogeny counts from sampled maximal orders; compare the three."
    falsification_criteria:
      - "Disjointness underpinning Heuristic 1 fails in tested scope if empirical/first-moment <= 0.5 persistently while events are rare."
      - "B3 refuted if first-moment/naive -> 1."
    budget: "Days on one laptop; class-number computations at np <= 10^9 are seconds each."
  - id: EXP-3-WISDEFACT
    title: "Factorization of extremal minima delta(p) at wisde primes (cheap add-on)"
    mechanism: "Tests whether extremal delta(p) = floor((p/2)^{1/3}) is biased smooth (anecdote: p=101051 gives delta=36)."
    protocol: "Recompute/extract AOV's 119 wisde primes via their sieve (eqs. 7-8) and published code, factor delta(p), compare largest-prime-factor distribution to random integers; extend sieve to p <= 10^6."
    falsification_criteria:
      - "If extremal delta(p) smoothness exceeds Psi prediction by > 3 sigma, record as unexpected observation and investigate the extremal Gram identity for forced structure; else close the anecdote as coincidence."
    test_boundary: "Concerns the MAX over curves, not the averaged distribution Heuristic 1 uses."
