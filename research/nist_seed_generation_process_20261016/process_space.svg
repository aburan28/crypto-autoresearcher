<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="452" viewBox="0 0 1070 452"><rect width="100%" height="100%" fill="#f7fafc"/><text x="32" y="40" fill="#152536" font-size="26" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">What the published seeds constrain</text><rect x="30" y="82" width="184" height="90" rx="12" fill="#dfefff" stroke="#31485b" stroke-width="1.6"/><text x="122" y="117" fill="#152536" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Clock input t</text><text x="122" y="147" fill="#152536" font-size="12" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Six recovered values</text><rect x="237" y="82" width="184" height="90" rx="12" fill="#dfefff" stroke="#31485b" stroke-width="1.6"/><text x="329" y="117" fill="#152536" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">48-bit lrand48</text><text x="329" y="147" fill="#152536" font-size="12" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Exact output recurrence</text><rect x="444" y="82" width="184" height="90" rx="12" fill="#dfefff" stroke="#31485b" stroke-width="1.6"/><text x="536" y="117" fill="#152536" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">20-byte blocks</text><text x="536" y="147" fill="#152536" font-size="12" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">All ten published seeds match</text><rect x="651" y="82" width="184" height="90" rx="12" fill="#fff0d8" stroke="#31485b" stroke-width="1.6"/><text x="743" y="117" fill="#152536" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Curve tests</text><text x="743" y="147" fill="#152536" font-size="12" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Call path unknown</text><rect x="858" y="82" width="184" height="90" rx="12" fill="#fff0d8" stroke="#31485b" stroke-width="1.6"/><text x="950" y="117" fill="#152536" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Publication</text><text x="950" y="147" fill="#152536" font-size="12" font-weight="normal" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">10 chosen / 11 passed</text><line x1="214" y1="127" x2="237" y2="127" stroke="#31485b" stroke-width="2"/><line x1="421" y1="127" x2="444" y2="127" stroke="#31485b" stroke-width="2"/><line x1="628" y1="127" x2="651" y2="127" stroke="#31485b" stroke-width="2"/><line x1="835" y1="127" x2="858" y2="127" stroke="#31485b" stroke-width="2"/><text x="32" y="231" fill="#152536" font-size="21" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Strict consecutive blocks</text><text x="32" y="263" fill="#152536" font-size="17" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">At most 2^46 candidate-start states, even with arbitrary timestamp retries and block ordinal.</text><text x="32" y="306" fill="#152536" font-size="21" font-weight="bold" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Extra calls to the same RNG</text><text x="32" y="338" fill="#152536" font-size="17" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">At most 2^48 possible start states if candidate windows may begin at any offset.</text><text x="32" y="387" fill="#152536" font-size="17" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Neither ceiling measures actual historical attempts or identifies the missing acceptance rule.</text><line x1="735" y1="174" x2="735" y2="214" stroke="#b46b0c" stroke-width="2" stroke-dasharray="6 5"/><text x="746" y="206" fill="#9a5600" font-size="14" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Unknown decision</text><text x="32" y="427" fill="#526477" font-size="13" font-weight="normal" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Derived from POSIX LCG period and the 21 archived candidate records; process model remains conjectural.</text></svg>
