campaign: frobenius_orbit_representation_search
status: proposed
claim_boundary:
  attack_claim: false
  beats_rho: false
  security_claim: false
baseline:
  decomposition: raw_chained_s3_sat
  rho: best_applicable_pollard_rho_with_automorphisms
experiments:
  - id: EXP-FROB-ORBIT-1
    title: three_way_decomposition_encoding
    arms: [RAW, CANONICAL_ORBIT, REP_PLUS_INDEX]
    measurements:
      - solver_variables
      - solver_constraints
      - solve_seconds
      - memory_high_water
      - decomposition_success_rate
      - independent_relation_rate
      - incremental_rank_per_relation
      - projected_total_log2_ops
    controls:
      identical_targets: true
      identical_factor_base_cardinality_targets: true
      identical_timeouts: true
      identical_solver_settings: true
  - id: EXP-FROB-ORBIT-2
    title: normal_basis_cyclic_constraint_test
    arms: [ordinary_constraints, cyclic_template_constraints]
    measurements:
      - gate_count
      - clause_count
      - sat_conflicts
      - sat_propagations
      - groebner_degree_proxy
      - solve_seconds
      - memory_high_water
  - id: EXP-FROB-ORBIT-3
    title: canonical_representative_strategy
    arms:
      - lexicographic_normal_basis
      - min_hamming_weight_then_lex
      - minimum_integer_encoding
      - invariant_signature_then_lex
    measurements:
      - canonicalization_seconds
      - orbit_coverage
      - collisions
      - downstream_relation_throughput
  - id: EXP-FROB-ORBIT-4
    title: orbit_relation_independence
    measurements:
      - orbit_id
      - frobenius_exponents
      - normalized_row_hash
      - frobenius_scalar_dependency
      - incremental_rank_delta
      - accepted_relation_count
      - independent_relation_count
  - id: EXP-FROB-FB-1
    title: nonlinear_frobenius_factor_base_sweep
    predicates:
      - hamming_weight_shells
      - trace_level_sets
      - norm_level_sets
      - sparse_linearized_plus_low_degree_zero_sets
      - low_codimension_frobenius_stable_varieties
      - algebraic_invariant_orbit_unions
    measurements:
      - factor_base_size
      - orbit_size_histogram
      - decomposition_success_rate
      - solver_seconds_per_relation
      - relation_independence_rate
      - projected_total_log2_ops
  - id: EXP-FROB-FB-2
    title: fixed_cardinality_factor_base_geometry
    rule: match_factor_base_cardinality_across_predicates
  - id: EXP-FROB-SYM-1
    title: quotient_vs_raw_scaling_ladder
    rule: fit_growth_with_timeout_censoring
  - id: EXP-TORUS-1
    title: algebraic_group_representation_generator
    rule: include_setup_and_conversion_costs
  - id: EXP-BRAUER-1
    title: toy_local_global_scalar_class_distinguisher
    controls:
      - randomized_scalar_labels
      - coordinate_isomorphisms
      - matched_random_curves
      - planted_observable
  - id: EXP-BRAUER-2
    title: hardness_relocation_audit
  - id: EXP-REP-1
    title: scalar_observable_discovery
    controls:
      - held_out_field_sizes
      - held_out_curves
      - random_isomorphisms
      - generator_changes
      - planted_and_null_observables
  - id: EXP-REP-2
    title: observable_invariance_stress_test
promotion_gate:
  - held_out_improvement_over_current_baseline
  - relation_independence_normalized
  - relevant_invariance_controls_pass
  - scaling_mechanism_identified
  - independent_cost_model_review
kill_criteria:
  - decomposition_cost_erases_orbit_or_matrix_saving
  - solver_growth_dominates
  - relations_collapse_to_frobenius_or_scalar_multiples
  - rep_plus_index_branching_erases_saving
  - setup_or_conversion_cost_material
  - auxiliary_construction_relocates_original_hardness
  - signal_disappears_on_held_out_or_isomorphic_instances
  - no_mechanism_to_improve_asymptotic_growth