<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Prime63 pilot launcher engineering controls</title>
  <desc id="desc">Six planted public inputs pass independent Sage replay. A guarded worker and supervisor pass small-field and mocked scheduling controls. Twenty-one archived natural systems are scheduled for a future approved experiment and were not solved here.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#18324d}.box{fill:#e8f2f8;stroke:#245879;stroke-width:2}.good{fill:#e0f4e9;stroke:#237b51;stroke-width:2}.future{fill:#fff1d8;stroke:#a37125;stroke-width:2}.arrow{stroke:#315b75;stroke-width:3;fill:none;marker-end:url(#head)}.small{font-size:16px}.big{font-size:20px;font-weight:bold}</style>
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#315b75"/></marker></defs>
  <text x="28" y="38" font-size="25" font-weight="bold">Prime63 launcher: bounded engineering controls</text>
  <rect class="box" x="30" y="78" rx="10" width="280" height="110"/>
  <text class="big" x="50" y="111">Frozen 475-point bases</text><text class="small" x="50" y="139">coset · random · small_x</text><text class="small" x="50" y="164">m=2,8 planted inputs: 6</text>
  <rect class="good" x="360" y="78" rx="10" width="280" height="110"/>
  <text class="big" x="380" y="111">Independent Sage replay</text><text class="small" x="380" y="139">6 / 6 pass</text><text class="small" x="380" y="164">full-point + polynomial checks</text>
  <rect class="good" x="690" y="78" rx="10" width="280" height="110"/>
  <text class="big" x="710" y="111">Guard and supervisor</text><text class="small" x="710" y="139">65 models censored pre-variety</text><text class="small" x="710" y="164">5 / 5 latest tests pass</text>
  <path class="arrow" d="M310 133 H350"/><path class="arrow" d="M640 133 H680"/>
  <rect class="future" x="360" y="245" rx="10" width="280" height="115"/>
  <text class="big" x="380" y="279">Future approved panel</text><text class="small" x="380" y="307">6 positives + 21 natural</text><text class="small" x="380" y="333">27 mocked; 0 wide solves</text>
  <path class="arrow" d="M830 188 C830 235 655 235 650 275"/>
  <text class="small" x="30" y="408">Engineering controls only · no observed end-to-end speed delta</text>
</svg>
