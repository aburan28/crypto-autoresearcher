handoff:
  id: TASK-20260718-RHO-REDTEAM
  from: coordinator
  to: red-team
  objective: >-
    Attack EXP-RHO-001 before implementation: determine whether its metric can
    mistake uncharged preprocessing, DP retention, coordinate leakage, special
    automorphisms, short cycles, or target-order artifacts for a generic
    prime-field rho improvement.
  inputs:
    - research/pollard-rho-generic/README.md
    - research/pollard-rho-generic/RQ-RHO-001.yaml
    - research/pollard-rho-generic/H-RHO-001.yaml
    - research/pollard-rho-generic/EXP-RHO-001-contract.yaml
    - inputs/h100_session/h039_walk_corr.json
    - inputs/h100_session/h040_rho_const.json
    - inputs/h100_session/h041_xonly_walk.json
  constraints:
    - Treat Shoup as a generic-model boundary, not a claim about every non-generic ECDLP method.
    - Demand exact DLP recovery and charged useful-collision accounting; reject raw-cycle or wall-clock-only wins.
    - Keep generic-curve and known negation/automorphism controls separate.
    - Do not approve, execute, or alter EXP-RHO-001; report defects as a versioned repair list.
  deliverables:
    - research/pollard-rho-generic/red-team-report.md
    - verdict: accept_for_review | revise_required | reject_scoped
    - minimal counterexample/control for every material objection
  budget: {wall_clock_seconds: 7200, memory_gb: 2, maximum_runs: 0}
  completion_gate:
    - Every primary metric has an accounting attack or acceptance rationale.
    - The x-only and imbalanced-partition controls catch a false raw-cycle win, or a repair is specified.
    - The report ends with exactly one next concrete action.
  return_format: red_team_report
