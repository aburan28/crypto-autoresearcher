hypothesis:
  id: H-RHO-001
  question_id: RQ-RHO-001
  statement: >-
    A full-point-state r-adding walk with keyed balanced partitions and a
    fused distinguished-point predicate can reduce fully charged work per
    useful scalar-verified collision by at least 5% versus a matched
    conventional r=20 baseline on declared generic prime-field cells, while
    remaining compatible with matched random-mapping collision controls.
  mechanism: >-
    This is an implementation hypothesis: retain the same walk state and
    collision equation, but eliminate separately charged partition and DP work.
    It does not alter the generic square-root exponent or assert a new
    group-theoretic property.
  assumptions:
    - Selected curves are ordinary prime-order groups with j not 0 or 1728.
    - The public partition key and r-adding table are fixed before targets are drawn.
    - Candidate and baseline use the same point representation, backend, DP density, worker count, and collision solver.
    - A DP-matched random-mapping simulator is a distributional control, not an elliptic-curve theorem.
  predictions:
    - metric: fully charged work per useful verified collision
      direction: lower
      minimum_effect: >-
        Candidate geometric mean is at least 5% lower; every scale has paired
        95% CI upper bound below 1.00 and the pooled bound below 0.95.
    - metric: normalized collision length and rejection/escape rate
      direction: different
      minimum_effect: >-
        Candidate stays inside the preregistered control band; a shorter raw
        cycle is not a win if useful-collision yield falls or recovery rises.
  test_boundary:
    instances:
      - three independently generated eligible curves at each N scale
      - 96 paired targets per curve and arm
    parameters:
      r_baseline: 20
      r_candidate: [16, 32]
      DP_density_bits: [10, 12, 14]
      walk_state: full point plus coefficient pair
      special_structure: disabled
    implementation: New clean-room reference harness under this lane.
    budget: {total_cpu_hours: 36, maximum_memory_gb: 4, maximum_runs: 5184}
  falsification_conditions:
    - The pooled paired confidence interval includes 1.00, or any scale fails the 5% gate.
    - Collision, DP-rejection, or escape metrics leave the matched control band.
    - A candidate uses uncharged setup, a special curve, automorphism fold, coordinate-only state, or unverified collision equation.
    - The effect disappears under matched operation weights or independent implementation.
  interpretation_limits:
    - A pass is an implementation-specific constant factor only; it does not change O(sqrt(N)).
    - A fail closes only this partition/DP co-design and backend.
    - The 5% threshold is an information gate, not a cryptanalytic significance threshold.
  status: proposed
  proposed_by: coordinator
