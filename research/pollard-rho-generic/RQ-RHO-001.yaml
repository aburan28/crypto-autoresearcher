research_question:
  id: RQ-RHO-001
  title: >-
    On ordinary generic prime-field curves, can a full-point-state r-adding
    Pollard-rho implementation lower fully charged work per useful collision
    by a reproducible constant factor without a special automorphism,
    precomputation, or degradation from random-mapping collision behavior?
  scope:
    curve_families:
      - ordinary E/F_p with prime group order N
      - j(E) not in {0, 1728}
      - no GLV/GLS decomposition or nontrivial automorphism fold enabled
    field_types: [prime field F_p]
    bit_sizes: [N near 2^20, 2^24, 2^28]
    methods:
      - full-state r-adding Pollard rho
      - keyed partition selection and distinguished-point filtering
      - exact collision recovery and scalar verification
  motivation: >-
    Existing local probes calibrate plain/negation collision constants and
    expose an x-only degeneracy, but do not test a full-state r-adding/DP
    co-design under complete useful-collision accounting.
  decision_target: >-
    Either authorize a hardware-specific benchmark with a bounded
    constant-factor target, or preserve a scoped negative for this co-design.
  constraints:
    - Match curves, targets, seeds, subgroup order, and DLP verification across arms.
    - No coordinate-only state, automorphism quotient, interval promise, or offline table beyond O(r) walk constants.
    - Count setup, steps, canonicalization, DP tests/stores/lookups, rejection, escapes, and final verification.
    - Fit no asymptotic exponent and make no below-rho claim.
    - Label all outcomes toy, heuristic, model-bound, and novelty-unverified until independently replicated.
  status: specified
  owner: coordinator
