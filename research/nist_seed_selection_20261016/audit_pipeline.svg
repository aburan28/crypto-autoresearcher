<text x="328" y="101" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#42586a">14 seeds and coefficients anchored</text>
<path d="M429,87 L443,87" stroke="#42586a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="446" y="34" width="196" height="105" rx="11" fill="#d7eef0" stroke="#7792a0"/>
<text x="544" y="74" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#172b3a">Basis / root checks</text>
<text x="544" y="101" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#42586a">prime branches and binary b</text>
<path d="M645,87 L659,87" stroke="#42586a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="662" y="34" width="196" height="105" rx="11" fill="#f7e7c6" stroke="#7792a0"/>
