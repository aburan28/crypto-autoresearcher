<text x="760" y="101" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#42586a">six streams complete</text>
<path d="M861,87 L875,87" stroke="#42586a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="878" y="34" width="196" height="105" rx="11" fill="#e1e9f1" stroke="#7792a0"/>
<text x="976" y="74" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#172b3a">Public acceptance</text>
<text x="976" y="101" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#42586a">family profile; X9 subset</text>
<text x="20" y="167" font-family="sans-serif" font-size="12" fill="#42586a">Cofactor-one prime census cross-checked. Exact near-prime orders and historical private filters remain open.</text>
