<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 188" role="img" aria-label="Audit pipeline with completed and pending stages">
<rect width="100%" height="100%" fill="#fffdf8"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#42586a"/></marker></defs>
<rect x="14" y="34" width="196" height="105" rx="11" fill="#d7eef0" stroke="#7792a0"/>
<text x="112" y="74" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#172b3a">Reported clock + index</text>
<text x="112" y="101" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#42586a">31,945 target/index pairs</text>
<path d="M213,87 L227,87" stroke="#42586a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="34" width="196" height="105" rx="11" fill="#d7eef0" stroke="#7792a0"/>
