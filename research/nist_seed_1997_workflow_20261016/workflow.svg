<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="705" viewBox="0 0 1120 705">
<rect width="1120" height="705" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<text x="50" y="47" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">1997–98 curve generation: known stages and one open decision</text>
<rect x="48" y="77" width="1024" height="78" rx="13" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="70" y="109" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">1. Fix field sizes and fast prime moduli</text>
<text x="70" y="136" font-family="Arial" font-size="15" fill="#334155">NIST 1999 rationale · documented</text>
<path d="M 560 155 V 176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="176" width="1024" height="78" rx="13" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="70" y="208" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">2. Fix a = −3; draw 20-byte candidate seed</text>
<text x="70" y="235" font-family="Arial" font-size="15" fill="#334155">Efficiency documented · drand48 stream recovered</text>
<path d="M 560 254 V 275" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="275" width="1024" height="78" rx="13" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/>
<text x="70" y="307" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">3. SHA-1 seed → c → coefficient b</text>
<text x="70" y="334" font-family="Arial" font-size="15" fill="#334155">ANSI/FIPS method · published relation verified</text>
<path d="M 560 353 V 374" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="374" width="1024" height="78" rx="13" fill="#e0f2fe" stroke="#475569" stroke-width="1.5"/>
<text x="70" y="406" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">4. Count points; test prime order and known attacks</text>
<text x="70" y="433" font-family="Arial" font-size="15" fill="#334155">Standard screens documented · historical implementation missing</text>
<path d="M 560 452 V 473" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="473" width="1024" height="78" rx="13" fill="#fef3c7" stroke="#475569" stroke-width="1.5" stroke-dasharray="10 7"/>
<text x="70" y="505" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">5. Choose records for ANSI/NIST publication</text>
<text x="70" y="532" font-family="Arial" font-size="15" fill="#334155">Exact keep/skip rule unknown · 10 published, 11 passed over</text>
<path d="M 560 551 V 572" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="572" width="1024" height="78" rx="13" fill="#e0f2fe" stroke="#475569" stroke-width="1.5"/>
<text x="70" y="604" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">6. Assign base point G and publish parameters</text>
<text x="70" y="631" font-family="Arial" font-size="15" fill="#334155">May 1997 FreeLIP pass recovered · later G sources open</text>
<text x="50" y="684" font-family="Arial" font-size="13" fill="#475569">Sources: FIPS 186-2; ANSI X9.62-1998; Anthropic 2026; internal 21-curve census. Dashed box = unresolved historical step.</text>
</svg>
