  recommended_evidence_strength:
    scale: docs/evidence-and-reproducibility.md
    C1:
      strength: replicated
      rationale: >-
        Every generator fact was re-derived independently from public
        specifications, with known-false controls that all fail as required.
        This covers all 10 prime seeds at the stated blocks (J1), X9.62 for all
        10 (J2), and the four binary seeds (Q2). J1 and J2 hold. Two reasons
        keep it short of strong. (i) The sentence "the native tests listed in
        the README check ..." could not be verified, because the Rust receipt
        is in blind_from (J6-4, not_run by plan design). (ii) The binary-seed
        word layout needed a declared 8-member reading family, of which
        exactly one member matched. Under pre-committed reading (4), a not_run
        check caps the affected claim at preliminary. J6-4 is a
        reference-availability check that the plan itself put out of reach,
        and the substance it refers to was re-derived. I recommend the
        Coordinator rule explicitly on whether (4) applies to it.
    C2:
      strength: strong
      rationale: >-
        State recovery from the seed alone and the walk-back were done for all
        ten prime seeds, as pre-committed reading (2) requires for strong. In
        every case the window holds exactly one block-aligned srand48-form
        state, and it equals the claimed t and block. The arithmetic
        recomputes, and "at most one" holds deterministically up to 16,384
        blocks. Null strings and positive controls behave as required. One
        nuance, not a defect: the 10^-11 figure is conditional on an aligned
        state existing, which errs toward overstating chance.
    C3:
      strength: strong
      scope: >-
        The census table, the candidate rule, the early-abort semantics, the
        classifier lists, the 21-of-21 match, the bitlen-rule statement, and
        the count of 31 twist-only-prime candidates in p = 3 (mod 4) runs.
      rationale: >-
        The independent early-abort re-census of all 11,042 rows agrees row by
        row (pre-committed reading (2)). The full counts and the SEA-free N*P
        certificates on 289 rows find no error. Every list equals summary.json
        and the posts. Excluded from the strength: the derived phrase "31
        seeds were lost", which should read "31 candidates have a prime-order
        twist; 26 of those twists pass the stated criteria", and "four" should
        read "five" (or "the four runs with twist-only rows"). Both are J4-3
        concerns. If the Coordinator classes the 26-versus-31 point as more
        than wording, that sentence alone falls to contradictory and the rest
        of C3 is unaffected. Coverage limit: PARI SEA is common to producer and
        Validator. Only the N*P certificates (covering every prime value that
        the classification uses) are SEA-free.
    C4:
      strength: replicated
      rationale: >-
        9 of 9 (p+1)/4 roots and the P-224 Tonelli-Shanks sign (z = 11) were
        verified exactly by independent code. These are exact algebraic facts
        with no further protocol; the pre-committed reading defines no strong
        path for C4.
    C5:
      strength: none (external analysis; labelling and provenance only)
      labelling_verdict: holds
      provenance_verdict: >-
        The preregistration's timing is unverifiable: it was first committed
        with the census data, and no third-party timestamp exists. Per
        DEC-20261016-7bcdd6 (5), this does not lower C1-C4.

  verdict: passed
  verdict_note: >-
    The bundle is admissible evidence for C1-C4 at the strengths above. J1-J6
    hold and J7 is inconclusive (C5 timing). This verdict does not support an
    ECDLP claim, demonstrate a speedup, or authorize promotion. KN-FIND-cee88d
    is the Coordinator's decision under DEC-20261016-7bcdd6.

  limitations:
    - >-
      PARI/GP SEA (ellsea, ellcard) is common to producer and Validator. The
      re-census used my own driver and a different twist model (d =
      smallest non-residue), but the same SEA library. Only the N*P = O
      certificates are SEA-independent, and they cover all 38 prime curve
      orders and 48 prime twist orders, which includes every prime value the
      classification uses. A recorded 0 hiding a prime would require SEA to
      return 0 for a prime-order curve in both runs.
    - >-
      Published parameters for prime192v2/v3 and prime239v1-v3 come only from
      OpenSSL 3.0.13. ANSI X9.62 itself could not be retrieved. The NIST
      curves agree across OpenSSL, FIPS 186-2 and SP 800-186 (0
      disagreements).
    - >-
      The X9.62-1998 MOV bound B = 20 is taken from SEC 1 v2's commentary
      ("A bound B >= 20 was updated to B >= 100 in [X9.62a]"). It is not from
      the X9.62 text. It changes nothing (J5-3).
    - >-
      The native Rust receipt, enumerator and census.sh in aburan28/crypto
      were neither read nor run (blind_from). The README's statements about
      what those tests check, and that census.sh re-ran byte for byte, are
      unverified. Their substance was re-derived independently.
    - >-
      Constraint 4 ordering is attested, not enforced (logs/order.log). I
      printed the first 3 lines of census/orders_871696354.txt at about
      22:44Z, before the 22:46:47Z EVENT entry. That was after my candidate
      sets were logged at 22:42Z.
    - >-
      out/q7_state_recovery.json was logged twice. The second run (22:44:08Z)
      added the null-stress walk; the prime-seed results are identical.
    - >-
      A single reviewer covered all seven joints, so mutual blindness is
      vacuous (plan note). There was no red-team pass.

