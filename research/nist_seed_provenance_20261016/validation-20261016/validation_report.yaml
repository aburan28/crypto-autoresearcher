        outside [0, 2^40). The stress walk finds a block-aligned srand48-form
        state for 2 of the 10 pseudo-states (2048-01-30 and 2078-08-22), near
        the expected rate of about 0.12, and 0 of 10 in 1997-98. The positive
        control recovers 10 of 10 true states. Under the binary family, the
        10 random strings and B-163 match no member. The method does not find
        1997-98 timestamps in noise. Without regeneration, the walk-back alone
        does produce aligned states at the chance rate, which is why
        regeneration plus the date carries the inference.
    - id: PTM-5
      claim: C3
      joint: J5
      status: pass
      object: The n < p criterion in place of bitlen(n) <= bitlen(p).
      evidence: out/j5_classification.json (published_p_lt_n, variants.n_lt_p, rows_where_bitlen_and_n_lt_p_differ)
      compared: >-
        The object is not void. The published prime239v2 has n > p, verified
        from the published n and p, and is the only published curve with
        n > p. The n < p classifier rejects it. The rules differ on exactly
        four rows, all in the p239 run (1562, 2320, 2491 and 2682, each with a
        239-bit n > p), and nowhere else.

