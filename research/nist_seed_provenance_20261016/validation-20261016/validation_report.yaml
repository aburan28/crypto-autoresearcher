    - id: J4-2
      claim: C3
      joint: J4
      status: pass
      check: For p = 3 (mod 4), y^2 = x^3 - 3x - b0 has order 2(p+1) - N. For P-224, -1 is a square, so -b gives an isomorphic curve, and no a = -3 model of the twist exists.
      evidence: out/j4_demo_fullcounts.txt; out/j3_analysis.json (j4_minus_b_demo); out/j5_classification.json (legendre_minus1_p224)
      compared: >-
        Numerically, on 11 rows (two per run, one at p521), the -b0 curve's full
        order equals 2(p+1) - N in all 9 p = 3 (mod 4) rows, and equals N in
        both P-224 rows. kronecker(-1, p224) = 1. Algebraically, E(-3,b) and
        E(-3,-b) are isomorphic via u = sqrt(-1) when p = 1 (mod 4) (u^4 = 1,
        u^6 = -1). The twist E^d is (-3d^2, d^3 b), and an a = -3 model would
        need u^4 d^2 = 1, which makes d = +-u^-2 a square. That is impossible
        for a non-residue d. When p = 3 (mod 4), d = -1 gives (-3, -b), the
        twist.
