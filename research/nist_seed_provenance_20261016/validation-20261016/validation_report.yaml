      compared: >-
        For all 10 seeds, the CVP state regenerates all 20 bytes. The window
        holds 2 or 3 srand48-form states and exactly 1 block-aligned one
        (d == 1 mod 20). Its t equals the README t and its block equals J1's
        block in all 10. The two triples give identical t (863966734 for
        P-192/prime192v2/v3, 863711343 for prime239v1-v3). Non-aligned
        srand48-form states in the windows include one in 1998 (P-192 walk,
        t = 905479852, d = 133833, not aligned), which shows that the
        alignment condition carries weight.
    - id: C2-2
      claim: C2
      joint: J1
      status: pass
      check: Arithmetic behind 2^-112, 0.0147, 10^-11, and "at most one block-aligned state within 8,000 blocks".
      evidence: out/q7_state_recovery.json (arithmetic)
      compared: >-
        2^48 / 2^160 = 2^-112. 1997-98 is 63,072,000 s, and 63,072,000 / 2^32
        = 0.014685. 0.014685^6 = 1.003e-11. srand48-form states recur every
        65,536 steps. 65,536 mod 20 = 16, so two block-aligned ones are at
        least lcm(65536, 20) = 327,680 steps (16,384 blocks) apart. "At most
        one in 8,000 blocks" holds deterministically. The 10^-11 figure leaves
        out the probability (about 0.12 per seed) that an aligned state exists
        in the window at all. That omission only makes chance less likely.
