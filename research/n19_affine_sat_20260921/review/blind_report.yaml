method:
  - Reconstructed GF(2^19) and the binary-curve group law from the frozen polynomial and curve equation, then rebuilt the 152-point, 76-x selected base from its four public seed points and signed Frobenius orbits.
  - Recomputed each frozen public Q from its given scalar and generator, and obtained exact-three SAT/UNSAT oracle outcomes by a fresh coordinate pair-sum table and exhaustive Q-minus-P lookup.
  - Verified the 398 regular archived raw files against their raw manifest; bound each of 12 control and 32 science receipts to its raw input, result, stdout, stderr, child receipt and available original CNF/XOR instance.
  - Parsed each archived extended DIMACS and checked it against the corresponding original instance manifest. Parsed raw CMS status and every model literal independently; required complete unique assignments and checked every original CNF clause, native XOR parity, selected domain coordinate and group witness for completed SAT models.
  - Preserved raw solver exit 15 and INDETERMINATE as UNKNOWN. Applied the frozen all-32 complete-valid gate before any paired ratio or stratified bootstrap calculation.
