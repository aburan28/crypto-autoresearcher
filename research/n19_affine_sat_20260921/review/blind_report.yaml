limitations:
  - UNKNOWN at the two-second internal CMS cap is censored operational evidence. It is neither UNSAT nor a negative mathematical result for either frozen SAT or UNSAT stratum.
  - The independent oracle classifies the public target decomposition, while raw solver completion remains unobserved for all 24 SAT-arm science workers. The finite wall-effect prediction cannot be assessed.
  - This joint checked outcomes, raw models, identities, declared process costs and the pairing gate. Source custody, executable provenance and full domain-circuit equivalence belong to the separately assigned source-aware joint.
  - The four-SAT/four-UNSAT panel is deliberately stratified and supplies no uniform target-cost estimate. No SAT-general, full-IC, rho, asymptotic or key-recovery claim follows.
  - No solver, native control, benchmark or target worker was launched by this Validator. The field/group and row replay is local static arithmetic, not another measured scientific sample.
