  control_checks:
  - Native control process passed its independently specified 361 monomial products, 4096 deterministic field/square
    samples, 152-point base admission, 4096 point-pair/batch fixtures, 76 legal values per arm, 52 invalid binary
    selector combinations, AND/XOR/mux truth tables and parser fixtures. It launched zero CMS instances.
  - The helper replayed every original serialized CNF/XOR row for four archived external SAT models and twelve constructed
    science models. It required a complete assignment, sorted legal x values, two S3 links, base rational lifts
    and exact group identity. For the four known-SAT science Q, the first two sorted witness points sum to a finite
    point.
  - 'A same-domain infinity intermediate cannot be necessary here: if the first two base points cancel, the third
    equals Q and Q would lie in B; all eight science Q were checked outside B. This finite rational odd-subgroup
    argument supports the two finite S3 links at the tested boundary.'
  - Actual negative predicates rejected a flipped model bit that violates an original row, a missing declared model
    variable, a changed public Q, a nonbase point, a wrong group sum and a swapped case label. Archived native controls
    report the same six real-validator rejection fixtures.
  heuristic_validation_checks: []
  cost_model_checks:
  - finding: holds
    check: Exactly one native-control pipeline/child, 12 external-control workers/CMS children and 32 science workers
      (24 CMS plus eight native MITM children) are present. All 44 worker raw input/result/stream hashes and child
      streams match receipts. No outer watchdog, memory cap, unexpected process fault or repeated slot; every required
      wait4 CPU/RSS field is positive and labelled.
  - finding: holds
    check: Scientific native MITM whole-worker median is 0.048474812 s and its eight-worker wall sum is 0.395330791
      s. The eight outer-worker walls spent by explicit one-hot, flat one-hot and flat binary are 16.835672124,
      17.640406001 and 16.82530275 s, respectively. These are spent costs on capped runs, not completed-solve ratios
      or a speed win.
  - finding: holds
    check: The native worker delegates fresh full-base construction and pair lookup to its measured native child;
      it does not build a second Python MITM inside the worker. The parent separately reconstructs the base and
      checks the frozen oracle after worker wait4, charged to parent_validation_seconds and the root science supervisor
      rather than to native worker wall. SAT workers charge fresh normal basis, base construction, encoding, CMS
      child and any model replay before exit.
  - finding: holds
    check: Root science supervisor whole-phase wall is 59.950199375 s, including source/input checks, 32 serial
      workers, parent validation, promotion, hashing and archive. The root native-control and external-control supervisor
      walls are 3.131007667 and 2.657519125 s, respectively; native build wall is 0.864515459 s. Root wait4 CPU
      may include descendants, so supervisor, worker and CMS/native child CPU must not be added.
  - finding: scope_limit
    check: 'The selected affine base is per-curve advice: prior N19 geometry science supervisor cost 7.947165541
      s plus 0.987860208 s controls and 41.986067 s checker, with its own build/discovery/cache/rank costs. None
      is free cold IC setup or included in these SAT worker medians. Host startup and filesystem cache were not
      normalized, and no full IC/rho end-to-end comparison was run.'
