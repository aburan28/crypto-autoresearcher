  limitations:
  - No scientific SAT arm completed a solve within the fixed CMS 2-second internal cap. The stratified paired wall
    effect and bootstrap are null by protocol; known mathematical SAT certificates do not turn censored solver exits
    into completed trials.
  - The 4/4 diagnostic panel is deliberately stratified, not a uniform target-cost sample. Population exact-three
    coverage from the separate geometry experiment is a different quantity.
  - Constructed assignments show satisfiability of the twelve archived known-SAT encodings and rule out accidental
    inconsistency there; they do not certify all UNSAT science instances, arbitrary Q, N19 SAT speed or a general
    encoding family.
  - The installed CMS binary source revision is unverified despite tagged upstream status documentation and exact
    payload hashes. The pinned host executable/library bundle is not a portable macOS environment.
