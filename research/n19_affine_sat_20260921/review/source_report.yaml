  verdict: passed
  verdict_scope: The assigned source/domain/model/cold-cost joint passes as an integrity review of a complete fixed
    launch with censored science CMS outcomes. The proposed finite speed effect is ineligible and inconclusive,
    not a validated failure or win.
  claim_boundary: Public-synthetic N19 exact-three decomposition on a fixed stratified 4 SAT/4 UNSAT panel. No private
    or imported targets, key/log recovery, full IC, rho, uniform population, asymptotic or general SAT-family claim.
  scientific_inference:
    completed_native_science: 8
    scientific_CMS_indeterminate: 24
    completed_scientific_SAT_models: 0
    reviewer_constructed_SAT_certificates: 12
    primary_pair_ratios: null
    stratified_bootstrap: null
    speed_effect_status: INCONCLUSIVE_CENSORED
  artifact_checks:
  - finding: holds
    check: All 58 Coordinator snapshot bindings (57 named paths plus receipt) match live bytes and committed Git
      blobs; the frozen run is the cited 1305ae15 snapshot. All 398 raw member files match live and aggregate tar
      hashes; phase archives independently match 8 native, 109 control and 281 science members.
  - finding: holds
    check: All nine code files and five frozen input/protocol/specification files match source_closure.json and
      the committed f553c70f pre-control source tree. Compiler, Python and native binary hashes match; the build
      occurred earlier under ccd37fb working-tree HEAD and was hash-frozen/committed before native launch.
  - finding: holds
    check: The solver archive has exactly four actual regular payloads (executable mode 0555) with byte sizes and
      hashes matching solver_dependency_manifest.json and the present resolved host executable and non-system dylibs.
      Version/help/otool outputs are archived; system macOS loader/framework bytes are not claimed portable.
  - finding: holds_with_limit
    check: The retrieved upstream release/v5.14.7 source maps SAT/UNSAT/undefined to exit 10/20/15 and prints s
      INDETERMINATE; frozen arguments omit --zero-exit-status. The installed executable says CryptoMiniSat 5.14.7
      and GIT-notfound, so its upstream source commit remains unverified even though executable/library bytes and
      actual output statuses are pinned.
  - finding: holds
    check: Native, external-control and science admissions are committed in order and bind the same source closure;
      root supervisor receipts name immutable admission commits f553c70f, b118c0fc and 73868e86. The complete native/control/science
      raw streams, commands, case manifest and telemetry are preserved; no replacement slot appears.
