  admitted_map_support_at_protocol_freeze: []
  large_prime_bound: 2147483647
  maximum_large_primes: 2
  allow_dirty: false
  workers: 32
  memory_gb: 128
  disk_gb: 512
  timeout_seconds: 259200
  output_rule: A fresh directory named by the newly allocated canonical RUN id; never overwrite or resume another run directory.
  argv_resolution: >-
    At dispatch allocate and recheck a fresh canonical RUN id for each label.
    Resolve RUN_DIR, PREFLIGHT_DIR, BOX0_DIR, BOX1_DIR, BOX2_DIR, and each
    named predecessor placeholder from hash-bound supervised receipts.  A
    *_DIR is valid only when that stage's independent-verifier receipt passed.  No shell
    expansion or implicit default is permitted.  Pin the
    admitted binary SHA-256 and resolved argv in every supervised manifest.
  composite_stage_rule: >-
    Labels 1 through 6 are supervised composite stages, not single-process
    claims.  The wrapper performs the producer argv first, closes its files,
    then invokes the separately built independent verifier argv against those
    immutable bytes.  It contains no curve arithmetic and archives both child
    binary hashes, exact argv arrays, exit codes, stdout/stderr hashes, and
    child receipts.  independent-verification.json and
    independent-verifier-receipt.json are mandatory before advancement; a
    producer-created verification.json is only a self-check.  The verifier has
    no crypto_lib dependency and receives no in-memory producer state.

