<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="690" viewBox="0 0 1020 690" role="img" aria-labelledby="title desc">
<title id="title">Three known lattice routes and proposed discriminations</title>
<desc id="desc">Known input requirements branch into pairing, auxiliary-map bases and Semaev equations. Dashed arrows lead to untested comparisons, then common correctness, rank and complete-cost gates. A dashed auxiliary-to-polynomial edge marks the missing height and density interface.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#53697b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172e40;font-size:16px} .heading{font-weight:bold;font-size:17px} .small{font-size:14px} .known{fill:#e6eef7;stroke:#234b70;stroke-width:2}.proposed{fill:#fff3d5;stroke:#967026;stroke-width:2;stroke-dasharray:6 4}.gate{fill:#f8e8e8;stroke:#805050;stroke-width:2}.edge{fill:none;stroke:#53697b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style>
<rect width="1020" height="690" fill="white"/>
