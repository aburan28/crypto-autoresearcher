<rect x="360" y="162" width="300" height="88" rx="8" class="known"/>
<text x="510" y="190" text-anchor="middle" class="heading">KNOWN F2/F6</text><text x="510" y="215" text-anchor="middle">Auxiliary-map bases</text><text x="510" y="238" text-anchor="middle">Action-log constraints</text>
<rect x="700" y="162" width="300" height="88" rx="8" class="known"/>
