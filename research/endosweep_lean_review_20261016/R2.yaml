- target: endosweep-lambda-add
  task_id: TASK-20261016-e6da74
  theorem: CryptoResearch.Endosweep.LambdaCoordinates.add_correct
  verdict: PASS
  checks:
    statement: >-
      LambdaCoordinates.lean:304-311: if P and Q satisfy OnCurveProj with X, Z != 0, X_P Z_Q + X_Q Z_P != 0 and
      (add P Q).1 != 0, then Z_3 != 0 and toAffine(add P Q) = affineAdd a (toAffine P) (toAffine Q).
      Under the other hypotheses, Bs != 0 is equivalent to x_P != x_Q.
      X3 = A^2 * XPZQ * XQZP is nonzero iff lambda_P != lambda_Q. By x3 (x1+x2)^2 = x1 x2 (l1+l2) (affine_add_x),
      that holds iff x_{P+Q} != 0. So the hypotheses are exactly the claim's.
    hypotheses: >-
      All of them are in the claim and the README (l.376-378), and they are the code's branch conditions
      (lambdacoord.py:327 Bs == 0 branches; :333 raises if X3 == 0). They are satisfiable: Witness.lean:170 over GF(4)
      with a = 0, b = 1, P = (1,0,1), Q = (1,1,u). They also hold on 160/160 random on-curve pairs over F_2^163
      (lambda_check.py).
    definitions: >-
      Lean `add` (l.114-126) compared operation by operation with lambdacoord.py:314-336:
        XPZQ, XQZP;
        A = LP ZQ + LQ ZP;
        Bs, B = Bs^2;
        AXQZP;
        X3 = AXQZP (A XPZQ);
        ABZQ = (A B) ZQ;
        L3 = (AXQZP + B)^2 + ABZQ (LP + ZP);
        Z3 = ABZQ ZP.
      All identical. toAffine (l.81-83) is lambdacoord.py:258-265. affineAdd (l.64-67) is binary.py:179-189, generic
      branch. Numerically: the Lean transcription equals LambdaCurve.add on 160/160 random off-curve triples, and the
      affine law equals GeneralCurve.add.
    data: n/a
    scope: >-
      Spec and README say that the degenerate branches and the operation counts (11M + 2S) are not formalised. The
      count appears in the claim only as an identifier of the formula.
  satisfiability_witness: R2/Witness.lean:170-171 (GF(4), b = 1 nonsingular); #eval at :183 shows (v,v) on both sides
  notes: Faithful. Over any char-2 Lean.Grind.Field, with general a, b; binary.py restricts a to {0,1}.

