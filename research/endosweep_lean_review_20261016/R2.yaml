- target: endosweep-msm-break-even
  task_id: TASK-20261016-fcd183
  theorem: CryptoResearch.Endosweep.Pippenger.glv_wins_iff
  verdict: PASS
  checks:
    statement: Pippenger.lean:116-117 states that for 0 < N, glv0 + N ce < plain <-> ce < (plain - glv0)/N, the claim verbatim.
    hypotheses: 0 < N, as in the claim. Satisfiable (Witness.lean:220).
    definitions: >-
      This is the quantity the README tabulates. msm.py sweep_curve sets glv_total = glv0.total_M + N ce (l.793) and
      cstar = (plain.total_M - glv0.total_M)/N (l.794), the C_star_M column. glv_gain_pct =
      100(plain - glv_total)/plain (l.798) is gain_pos_iff and gain_zero_iff (l.123-142). msm_check.py on all 204 rows
      of msm.json:
        C_star_M equals (plain - glv0)/N, with 0 mismatches;
        glv_gain_pct is recomputed with 0 mismatches;
        sign(gain) and [glv_total < plain] agree with [ce < C*] in all 204 rows.
      The README table (l.123-127) equals msm.json C_star_M for secp256k1: batched affine
      98.7/49.7/33.0/21.4/13.9/11.9/8.2/7.2/6.8; mixed 130.9/.../8.6; hypothesis row 74.2/.../4.3.
      Small glv_total_M differences (up to about 97 M at N = 4M) come from the stored ce being rounded to 3 decimals.
      They are not a definitional mismatch.
    data: Spot-checked secp256k1 rows at logN 6..22 in both modes against README l.125-127. All match.
    scope: Spec and README say that the tabulated C* values are modelled and not formalised.
  satisfiability_witness: R2/Witness.lean:220
  notes: >-
    Faithful. plain and glv0 are each optimised over their own window c (best_over_c), not a common window. The
    theorem is pointwise in the two totals, so this is fine.

- target: endosweep-msm-ideal-cstar
  task_id: TASK-20261016-126156
  theorem: CryptoResearch.Endosweep.Pippenger.ideal_glv_wins_iff
  verdict: PASS_WITH_NOTES
  checks:
    statement: >-
      Pippenger.lean:167-169: for c != 0 and 0 < N, idealGLV < idealPlain <-> Calpha < (b/(2c))(twoPowC R + cD + C)/N.
      twoPowC is a free rational. Setting it to 2^c gives the claimed formula exactly.
      ideal_saving (l.158-164) proves "accumulation unchanged, the rest halved".
      ideal_cstar_decomposition (l.180-183) proves break-even = aggregation-only saving + ((b/2)D + (b/(2c))C)/N.
    hypotheses: c != 0 and 0 < N. Satisfiable (Witness.lean:221).
    definitions: >-
      idealPlain = (b/c)(N A + 2^c R + c D + C) and idealGLV = ((b/2)/c)(2N A + 2^c R + c D + C) + N Calpha
      (l.148-155). This is a coherent saturated common-window Pippenger model. It is disclosed as not msm.py's occupancy
      model.
    data: n/a
    scope: >-
      "So the break-even exceeds the aggregation-only estimate" is proved only as an exact decomposition. Strict excess
      needs (b/2)D + (b/(2c))C > 0, which holds for positive b, c, D, C but is not stated. "Aggregation-only estimate"
      here means the model's (b/(2c)) 2^c R / N. It is NOT the README's hypothesis formula b A/(c(c+1)). The README
      reports that msm.py's C* falls below that formula at some sizes: mixed 2^16, 12.1 vs 14.3; mixed 2^20, 9.0 vs 9.6;
      and 2^17. The spec note discloses that b A/(c(c+1)) is not derived.
  satisfiability_witness: R2/Witness.lean:221
  notes: >-
    Wording fix: say "exceeds the model's aggregation-only saving (b/(2c)) 2^c R/N, by ((b/2)D + (b/(2c))C)/N >= 0",
    so that it is not read as exceeding the hypothesis formula b A/(c(c+1)). msm.py's C* does not always exceed that
    formula.

- target: endosweep-msm-window-slots
  task_id: TASK-20261016-216d53
  theorem: CryptoResearch.Endosweep.Pippenger.window_slots
  verdict: PASS
  checks:
    statement: >-
      Pippenger.lean:79-82: for 0 < c, N W(2h) <= 2N W(h), 2N W(h) <= N W(2h) + N, and
      2 W(h) = W(2h) <-> c <= 2(h % c). This is exactly the claim. I checked the math by hand:
      floor(2h/c) = 2 floor(h/c) + [c <= 2(h mod c)].
    hypotheses: 0 < c (msm.py searches c in 1..22). Satisfiable (Witness.lean:222). The Lean statement is false for c = 0, so the hypothesis is needed.
    definitions: >-
      windows bits c = bits / c + 1 (l.55) equals msm.py's W = shape.bits // c + 1 (l.429; also counted_msm_1d l.1026).
      All 204 msm.json rows satisfy windows = coeff_bits // c + 1, doublings = (W-1)c and combine = W-1.
      #eval (Witness.lean:219) gives 20, 10, 17, 9. The msm.json secp256k1 rows at c = 13 (plain 20, glv 10) and
      c = 16 (plain 17, glv 9) match window_slots_examples.
    data: window_slots_examples (decide) matches the msm.json windows at c = 13/16 for 256/128 bits.
    scope: >-
      The 2h/h form applies exactly to secp256k1 (256/128), CryptoPro-B (256/128) and Tom-384 (384/192). It does not
      apply to BLS12-381 G1 (255/128), Bandersnatch (253/127) or CP6-782 (377/190) (msm.json coeff_bits). The claim is
      explicitly scoped to 2h/h, so this is not a fidelity problem.
  satisfiability_witness: R2/Witness.lean:222
  notes: >-
    Faithful. The spec's "the condition is the README's 'b mod c' quantisation" is loose. The README's example
    (256 = 16*16, plain 17 windows) is covered. Its BLS12-381 counter-example (255 bits) is outside the 2h/h hypothesis.
