- target: endosweep-xonly-odd-trace-needed
  task_id: TASK-20261016-ebaed4
  theorem: CryptoResearch.Endosweep.XOnlyConjugate.QuadOrder.trace_one_exists_iff_D_odd
  verdict: PASS_WITH_NOTES
  checks:
    statement: >-
      XOnlyConjugate.lean:157-166 proves (exists x : QuadOrder D, trace x = 1) <-> D % 2 = 1. Int % is emod, so this
      means "D odd", including negative D. The claim's other clauses are proved by supporting theorems.
      "Every even D has only even traces, and no beta has beta + betabar = +-1" is trace_even_of_D_even (l.140) and
      no_trace_pm_one_of_D_even (l.149-153). "beta - betabar = 1 has no solution" is sub_conj_ne_one (l.170-175).
    hypotheses: >-
      The named theorem has no hypotheses. no_trace_pm_one_of_D_even is witnessed at Witness.lean:234 (D = -8), and the
      existence direction at Witness.lean:232 (D = -619).
    definitions: >-
      QuadOrder D = Z^2 in the basis 1, w with w = (D + sqrt D)/2 (l.102-127). I checked by hand:
      w^2 = D w + (D - D^2)/4.
      conj: a + bw -> (a + bD) - bw, because wbar = D - w.
      trace = 2a + bD = beta + betabar (add_conj, l.130, proved).
      norm = a^2 + abD + b^2 (D^2 - D)/4 = beta*betabar (hand expansion).
      These are the standard order of discriminant D, Z[(D+sqrt D)/2]. The Lean type also accepts D = 2,3 mod 4, where
      it is not an order. The trace statements only use the additive structure, so this is harmlessly more general.
    data: n/a
    scope: >-
      The claim's first sentence, "x((beta-1)P) = x(betabar P) NEEDS beta + betabar = 1", is not formalised. The
      necessity step (an x-coordinate equality on generic P forces beta - 1 = +-betabar in End(E)) is a curve fact: x
      determines a point up to sign, and End(E) acts faithfully. The Lean only proves the order-theoretic dichotomy that
      follows. The spec notes do not say that this step is informal. The README Lean section's heading "Odd trace is
      needed" (README l.324) reads as if the necessity itself were checked.
  satisfiability_witness: R2/Witness.lean:232-234
  notes: >-
    The theorem is faithful for the order-theoretic content. Wording fix: add to the spec notes and the README item 3
    that "x(P') = x(P'') => P' = +-P''", and the passage from an identity of endomorphisms on points to the ring
    identity beta - 1 = +-betabar, are informal and not Lean claims. The spec already says that the "odd conductor"
    step is informal.

