- target: endosweep-gls-psi-endomorphism
  task_id: TASK-20261016-4039c7
  theorem: CryptoResearch.Endosweep.BinaryGLS.psi_add
  verdict: PASS
  checks:
    statement: >-
      BinaryGLS.lean:146-148: Involution sigma, sigma u = u + 1, u^2 + u + 1 = 0 and P.1 + Q.1 != 0 give
      psi(affineAdd u P Q) = affineAdd u (psi P) (psi Q), on the curve with a' = u (gls.py:404 E = GeneralCurve(K, K.u, b)).
      The claim's other clauses are supporting theorems cited in the spec notes:
        psi_onCurve (l.137, uses sigma b = b);
        psi_dbl (l.163);
        psi_lambda_affine (l.177), the form (sigma x, sigma lambda + u).
    hypotheses: >-
      Involution (l.77-81) means additive, multiplicative, sigma 1 = 1 and an involution. Together with sigma u = u+1
      and u^2+u+1 = 0, these are stated in README l.386-388. I checked by hand that hu2 is genuinely needed:
      x3' - sigma(x3) = u^2 + u + 1. They are satisfiable in GF(4) with sigma = Frobenius
      (Witness.lean:193-206, 210-211). They hold for gls.py's tower: Fq2.conj (gls.py:151-154) on 200 random pairs at
      m = 127 satisfies sigma u = u+1, u^2+u+1 = 0 and sigma b = b (lambda_check.py).
    definitions: >-
      psi (l.118) is gls.py psi_affine (l.346-351). psiLambdaAffine (l.121) is psi_lambda_affine (l.354-356).
      psiLambda (l.124) is psi_lambda (l.359-364). All three are numerically equal on 100/100 random inputs.
      affineAdd is binary.py's generic branch.
    data: n/a
    scope: >-
      The spec and README say that the degenerate branches are not formalised. The file header's "so it is a group
      endomorphism on the points those branches cover" (l.25-26) is appropriately hedged.
  satisfiability_witness: R2/Witness.lean:205 (GF(4), sigma = x^2, u); psi_onCurve at :204 on the point (0,1) of E~(GF(4))
  notes: >-
    Faithful. The claim bundles four facts; the named theorem proves additivity and the supporting theorems prove the
    other three, as the spec notes disclose. E~(GF(4)) has only the point (0,1), so the psi_add/psi_dbl witnesses use
    off-curve inputs. Those theorems do not require curve membership.

- target: endosweep-gls-psi-from-twist
  task_id: TASK-20261016-3b5763
  theorem: CryptoResearch.Endosweep.BinaryGLS.psi_eq_conj_by_twist
  verdict: PASS_WITH_NOTES
  checks:
    statement: >-
      BinaryGLS.lean:226-229: for tau additive and multiplicative (not required to be unital, so more general than
      "ring endomorphism") and s + tau s = u, twistIso s (tau(twistIso s P)) = psi tau u P. conj_by_twist (l.217-223)
      gives the general (tau x, tau y + (s + tau s) tau x). twist_iso_onCurve (l.203) shows that phi_s maps
      coefficient a to a + s^2 + s, and twist_iso_invol (l.210) that phi_s^-1 = phi_s. This matches the claim.
    hypotheses: >-
      hadd, hmul and hs are in the claim. They are satisfiable: Witness.lean:209 in GF(4) with tau = Frobenius, s = u,
      which forces the statement's u := 1. A witness meaningful in context exists: in F_16 with tau = squaring (the
      q-Frobenius of F_{q^4}, q = 2), s^2 + s = u gives s + tau s = u (twist_check.py, m = 1, a = 0).
    definitions: twistIso (l.199) is (x, y + s x). psi is gls.py's psi_affine.
    data: n/a
    scope: >-
      The Lean result is conditional and correct. However, twist_check.py shows that for s^2 + s = a + u (a in F_2),
      s + s^q = a + u + (m-1)/2 (mod 2). For gls.py's m = 127 (m = 3 mod 4) and its base curve
      Eq = GeneralCurve(F, 0, b) (gls.py:394, a = 0), this gives s + tau s = u + 1. So phi o pi o phi^-1 = -psi there,
      and the hypothesis s + tau s = u holds only for the base curve with a = 1 (gls.py:400 Eq1, its F_q-twist). This
      changes no result: -psi is equally an endomorphism with square -1, and #E~ = (q-1)^2 + t^2 is even in t. But the
      spec note "That such an s exists in F_{q^4} is not formalised" is imprecise. An s with s^2 + s = a + u always
      exists in F_{q^4}. Whether it also satisfies s + tau s = u depends on Tr(a) and m mod 4. The gls.py docstring
      (l.8-10) and the README's "psi = phi o pi o phi^-1" hold for a = 1 when m = 127.
  satisfiability_witness: R2/Witness.lean:209 (GF(4)); R2/twist_check.py (F_16, F_2^12, F_2^20 cases)
  notes: >-
    Wording fix: state that s + tau s = u requires choosing E's a with Tr_{F_q/F_2}(a) = (m-1)/2 mod 2 (a = 1 for
    m = 127). Otherwise the conjugate is -psi.

