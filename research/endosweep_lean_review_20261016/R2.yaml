- target: endosweep-xonly-conjugate-difference
  task_id: TASK-20261016-fceddc
  theorem: CryptoResearch.Endosweep.XOnlyConjugate.xonly_difference_eq_conj
  verdict: PASS
  checks:
    statement: >-
      XOnlyConjugate.lean:86-90 states that for any Lean.Grind.IntModule G (an abelian group), any maps beta, betabar,
      any x : G -> X with x(-Q) = x(Q) for all Q, and beta P + betabar P = P, we get x(beta P - P) = x(betabar P).
      This is the claim word for word. The quantifiers are universal, and the conclusion has the same direction.
    hypotheses: >-
      There are two hypotheses (hx: x(-Q) = x(Q); htr: beta P + betabar P = P), and both are stated in the claim.
      They are satisfiable: Witness.lean:228 uses G = Int, x = natAbs, beta = 3*, betabar = -2*.
    definitions: >-
      The theorem defines nothing of its own. x is abstract. The README (l.337) and the spec say explicitly that the
      Weierstrass x(-P) = x(P) property enters as a hypothesis.
    data: n/a
    scope: >-
      README "Lean verification" item 1 (l.314-319) matches. The spec and README say that the curve realisation
      (xonly.py point checks) is not formalised.
  satisfiability_witness: R2/Witness.lean:228 (Int, natAbs, beta = 3x, betabar = -2x, P = 5)
  notes: Faithful.

