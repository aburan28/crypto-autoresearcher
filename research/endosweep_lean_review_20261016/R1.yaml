        attribution and wording gap, not a missing proof. The README's "4q - t^2 equals the
        certificate's prime powers" is stated as a product only. The primality of the
        even-exponent factor 2 is trivial and not needed.
    satisfiability_witness: >-
      Hypothesis true for every record (PARI isprime, check_data.out); one large prime proved in
      Lean (large_prime_try.lean); no record has all large primes small enough to discharge
