    notes: >-
      Fix: either add the conjunct `(c.DK = -oddPrimes.prod ∧ DK%4=1) ∨ (DK = -4*oddPrimes.prod
      ∧ ...)` to exact_discriminants (it is already in scope at :332), or cite
