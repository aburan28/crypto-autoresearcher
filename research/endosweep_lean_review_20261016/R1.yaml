  - target: endosweep-disc-fundamental-from-primes.yaml
    task_id: TASK-20261016-59751e
    theorem: CryptoResearch.Endosweep.Discriminant.isFundamental_of_primes
    verdict: PASS
    checks:
      statement: >-
        Discriminant.lean:206-210: for os Nodup with every element IsPrimeNat, and D = -prod(os) with
        D % 4 = 1, or D = -4*prod(os) with -prod(os) % 4 in {2,3}, conclude IsFundamental D. That is
        the claim: same objects, same two branches, universal over os and D, no extra hypothesis.
      hypotheses: >-
        Nodup + IsPrimeNat for each element is "core is a product of distinct primes", as the claim
        says. Primality is a hypothesis, and the spec notes say so. All three branches are
        instantiated in R1_checks.lean:62 (D=-15, core 3*5), :72 (D=-20, -core = 3 mod 4) and
        :81 (D=-8, -core = 2 mod 4). The repo's isFundamental_neg_seven (Koblitz.lean:116) is a
        fourth instance.
      definitions: >-
        IsPrimeNat (Discriminant.lean:128) is the textbook definition: 2 <= p and every divisor is
        1 or p. SqFree (:131) is "only m=1 has m*m | n", so SqFree 0 is false. IsFundamental
        (:136-138) is D<0 and either (D%4=1 and |D| squarefree) or (D%4=0, (D/4)%4 in {2,3}, |D/4|
        squarefree). That equals quadorder.is_fundamental (quadorder.py:125-142), since
        (-m4)%4 = (D/4)%4 under Int.emod. The construction matches nist.exact_discriminant
        (nist.py:186-206). Python's else-branch also admits -core = 0 mod 4, but that cannot
        happen for a product of distinct primes.
      data: n/a
      scope: >-
        The notes and the README Lean section (README.md:201-204, 255-256) state that uniqueness
        of the fundamental discriminant in a square class is not proved. Nothing is overclaimed.
    satisfiability_witness: R1_checks.lean:62, :72, :81 (all compile)
    notes: Faithful. No issues.

