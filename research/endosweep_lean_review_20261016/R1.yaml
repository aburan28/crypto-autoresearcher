  - target: endosweep-rm-golden-norm-2adic.yaml
    task_id: TASK-20261016-b5bdee
    theorem: CryptoResearch.Endosweep.RMGoldenNorm.norm_eq_four_pow_mul_odd
    verdict: PASS
    checks:
      statement: >-
        RMGoldenNorm.lean:41-43 states: for all n, a, b with |a|+|b| <= n and (a,b) != (0,0),
        there are k and m with a^2+ab-b^2 = 4^k*m and m % 2 = 1. The auxiliary n is a
        well-founded-induction bound. It is universally quantified and instantiable as
        n := |a|+|b|, so the statement equals "for all (a,b) != 0", as the primed version's proof
        (:66) shows. norm_eq_four_pow_mul_odd' (:63-64) states a^2-ab-b^2 directly.
      hypotheses: (a,b) != (0,0) is the claim's; the n bound is trivially satisfiable.
      definitions: >-
        For phi^2+phi-1 = 0: phi + phi' = -1 and phi*phi' = -1, so
        N(a+b*phi) = a^2 - ab - b^2. Under phi -> -phi' = 1+phi this becomes a^2 + ab - b^2.
        Both are covered. m % 2 = 1 under Int.emod means m odd, including negative m.
      data: n/a
      scope: >-
        The spec and README.md:413-426 state that #J being a norm from Z[phi], the 15.3% rate and
        the 1.33x ceiling are not Lean claims. R1 compiled the file standalone (rm_copy.lean):
        axioms propext, Classical.choice and Quot.sound, matching the spec.
