        identity t^2-4q = DK*f^2; 4q-t^2 = prod p^e; IsDisc DK; minNonscalarDegree DK = deg; and
        (all largePrimes IsPrimeNat) implies IsFundamental DK. The claim's third bullet, "D_K =
        -core or -4*core with core the product of the odd-exponent p_i, as
        nist.exact_discriminant computes it", is NOT in this theorem's statement. It is proved
        in factored_holds (:311, via FactoredCert.Holds :87-91) and only destructured inside the
        proof (:332).
      hypotheses: >-
        The single hypothesis is all largePrimes IsPrimeNat. It is explicit and disclosed (spec
        notes, README.md:211-214), and it is satisfiable. PARI isprime proves all 27 distinct
        large primes, and every factor in every certificate (check_data.out). Lean itself proves
        IsPrimeNat 11549194661 (P-224's smallest large prime) in 11 s by the repo's trial-division
        route (large_prime_try.lean). The small odd-exponent primes (< 10^8) are proved in Lean
        (:337-338). The statement does not depend on the 10^8 split being correct, but the data
        respects it: all smallPrimes < 10^8, all largePrimes > 10^8, r^2 > p.
      definitions: >-
        FactoredCert.Holds (:84-94) mirrors nist.exact_discriminant. The odd-exponent filter must
        equal small ++ large, and the -core/-4core branch condition is equivalent to Python's
        (-core)%4 == 1 test for squarefree core. IsDisc and minNonscalarDegree are as above.
      data: >-
        check_data.py checked all 14 records against nist.json and factorizations.jsonl:
        q, t, D_K, f, deg = min_nonscalar_degree, and the factor lists. It recomputed the
        product, the odd split, exact_discriminant's (D_K, f), and deg's closed form. All match.
        Negative control: one digit of P-224 deg changed makes factored_holds fail with "decide
        proved the proposition is false" (neg_nist.lean:311).
      scope: >-
        README.md:209-211 lists "D_K is built from the odd-exponent primes as
        nist.exact_discriminant builds it" among the unconditional facts of
        NistCertificates.exact_discriminants, and the spec claim lists it too. The named theorem
