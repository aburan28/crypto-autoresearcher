  theorem: CryptoResearch.Endosweep.FrobeniusSplit.q4_split
  verdict: PASS_WITH_NOTES
  checks:
    statement: >-
      FrobeniusSplit.lean:248-250: ∀ m with m odd and 5 ≤ m: 8·n4 = order 4 (−3) m, 2·na = order 2 1 m,
      4·nb = order 2 (−1) m (the three // are exact), n4 = na·nb, na > 1, nb > 1. This matches the claim's
      "Precisely ..." sentence exactly. q4_not_prime (291) gives ¬IsPrime(n4 m).
    hypotheses: >-
      "Odd m ≥ 5" is satisfiable (r3_C.lean:4, m = 5; r3_C.lean:5, m = 7). It covers every m the study
      considers: RANGES[4] = (67, 201) (frobenius.py:1101), the primes 67-199, 28 of them, as recorded in
      frobenius.json q4_t-3_composite. The trace setup matches q4_koblitz_split (frobenius.py:1349-1353):
      #E(F_4) = 8 for t = −3, #E(F_2) = 2 for t2 = 1, and #E'(F_2) = 4 for the twist t = −1. The twist
      over F_{2^m} for odd m uses V_neg_odd. Hasse is derived (hasse with 1 < 8), not assumed.
    definitions: >-
      n4/na/nb are the Python expressions. Lean and Python agree for m in {5, 7, 11, 13, 17, 19}
      (r3_C.lean:9). For large m the #eval is exponential because V uses naive double recursion, so
      m = 67+ was not evaluated in Lean. The theorem is universal anyway.
    data: n/a
    scope: >-
      The README Lean section (frob README:430-437) states the corrected scope correctly ("for every odd
      m ≥ 5 ... fails at m ∈ {2, 3}"). Two places still state the unqualified claim. (1) The spec claim's
      first sentence: "q = 4 with t = -3 can never have prime n". (2) The README's Finding 4 headline
      (frob README:212, "can never have prime n"), which the Lean section corrects only by addendum.
      Both are literally false at m = 2, 3, per q4_small_m.
  satisfiability_witness: r3_C.lean:4-5
  notes: >-
    The theorem is faithful to the precise claim and to its corrected scope. Wording fix: qualify the
    first sentence of the spec claim, ideally also README:212, as "for every odd m ≥ 5 (in particular
    every prime m in the study's range 67-199)".

- target: endosweep-blinding-classical-erased.yaml
  task_id: TASK-20261016-200d86
  theorem: CryptoResearch.Endosweep.Blinding.babai_unreduced_erases
  verdict: PASS_WITH_NOTES
  checks:
    statement: >-
      Blinding.lean:125-130: for any dimension d+1, any basis b, any num_i and den_i with den_i > 0,
      n·num_i = den_i·z_i, and Σ z_i b_i = (n, 0, …, 0), decomposeUnreduced(K + r·n) = decomposeUnreduced(K)
      for all integers K and r and every coordinate j. This matches "the Babai decomposition of k + rn
      equals that of k for every integer r" when Babai means decompose_unreduced.
    hypotheses: >-
      hz and hlat encode "(n, 0, …, 0) has integer coordinates z in the basis". The claim and
      blinding.py:9-11 give this as the reason, so it is assumed rather than derived from
      "(n, 0, …) ∈ L and B is a basis". It is satisfiable and holds on the real data. In Lean:
      r3_D.lean:22-25 discharges all three hypotheses by decide on blinding.py's secp256k1 reduced
      basis and B⁻¹ row. In Python: they hold on all four harness lattices (CryptoPro-B, secp256k1,
      Tom-521, FourQ d = 4); every den_i is odd, z_i is an integer, and Σ z_i b_i = (n, 0, …).
    definitions: >-
      roundCoeff (105) = blinding.py:161 `(2*K*num + den) // (2*den)`: Lean Int `/` is floor division
      for a positive divisor, the same as Python's //. decomposeUnreduced (109-111) = blinding.py:155-163.
      Numerical check: Lean decomposeUnreduced == Python decompose_unreduced on 8 values of K,
      including |K| ~ 10^80, K = 0 and K = n − 1 (r3_D.lean:28, `true`).
    data: n/a
    scope: >-
      The 40 000 measured checks compare decompose_unreduced(k + rn) with lattice.py's decompose(k)
      (blinding.py:346, 351), not with decompose_unreduced(k). lattice.py:117-129 rounds with Python
      round() (half-to-even) on k % n. The Lean theorem does not connect the two routines. They agree
      for 0 < k < n except at exact half-integer ties. No tie can occur here, because each den_i divides
      det B = ±n, and n is odd for all four lattices. I found 0 mismatches in 8 000 sampled k.
  satisfiability_witness: r3_D.lean:22-25
  notes: >-
    The theorem is faithful for decompose_unreduced. Wording fix: the spec note "formalises
    decompose_unreduced, which the 40 000 erasure checks run" should add that those checks compare
    against lattice.py's v(k), and that unreduced = reduced rounding for 0 < k < n (no ties, since den_i | n
    with n odd). This is not formalised.

- target: endosweep-blinding-mod-n.yaml
  task_id: TASK-20261016-0d79b3
  theorem: CryptoResearch.Endosweep.Blinding.decompose_mod_erases
  verdict: PASS
  checks:
    statement: >-
      Blinding.lean:96-97: for any function dec, dec((k + r·n) % n) = dec(k % n). This is the claim's
      "so k and k + rn decompose identically", given the premise "Babai depends only on k mod n". The
      premise is modelled by the shape dec ∘ (· % n).
    hypotheses: none.
    definitions: >-
      The modelling premise holds for lattice.py's ReducedLattice.decompose (117-129). It reads k only
      as `k % self.n` (target and v); the remaining use of k is in the assert. Lean `%` on Int is emod,
      which is nonnegative for n > 0, the same as Python's %.
    data: n/a
    scope: >-
      The spec notes call this "the weak form" and point to the stronger theorem, which is accurate. The
      theorem is a one-line tautology (Int.add_mul_emod_self_right). Its content is the modelling step,
      verified here by reading the code.
  satisfiability_witness: n/a (no hypotheses)
  notes: Faithful, but near-trivial. All the substance is in the code-shape premise, which I confirmed at lattice.py:117-129.

- target: endosweep-blinding-reconstruction.yaml
