      k = 1, b = {(7, 0), (−3, 1)}, r = 5).
    definitions: >-
      blind (146-148) = blinding.py blind (171-178), x = v + Σ r_i b_i; Python samples the r_i and Lean
      quantifies over all of them. dot = Σ x_i λ_i as in reconstructs (181-182).
    data: blinding.json records reconstructs_k_mod_n true for c5, naive and unblinded on all 4 cases (consistent).
    scope: Accurate. Costs, entropy and MSB statistics are excluded.
  satisfiability_witness: r3_D.lean:32-34
  notes: Faithful.
