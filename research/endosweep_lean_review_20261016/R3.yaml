      true Z-module generated. minorGcd/rowGcd (77-85) is gcd over all pairs i<j of |det[g_i g_j]|, the same
      double loop as subgroup.py:81-95 (`gcd(det, ...)` starting from 0). r3_A.lean:18 sanity: [(4,0),(0,6),(2,3)]
