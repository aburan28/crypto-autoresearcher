  source_id: bin_exp008
  area: ALBIN
  topic: binary-field ECDLP
  finding: 'Per `research/proof_obligation_binary_solving_degree.md`, PO-BIN-001(a) asks: **at FIXED arity
    m, is the solving degree D_solv of the descended binary Semaev system bounded as n→∞?** Bounded →
    supports the Petit–Quisquater subexponential heuristic; rising with n → refutes it. The crux (Kosters–Yeo)
    is that the *first-fall* degree d_ff=2 for S₃ does NOT imply low D_solv — **D_solv is the cost-relevant
    quantity and had not been measured past n≈17**.'
  artifact_count: 5
