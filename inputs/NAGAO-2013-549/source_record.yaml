  corroboration:
    - >-
      THIS PAPER IS THE SOLE SOURCE OF TWO LEMMAS 2015/984 DOES NOT PROVE. Nagao
      2015/984 (frozen at inputs/NAGAO-2015-984/, read as KN-LIT-71b758) cites
      this paper as [11] for its Lemma 3 -- the field-equation rewriting lemma
      that licenses substituting the FAKE first fall degree for the true one --
      and says of it "Proof of this Lemma is complicated and not constructive".
      It also cites [11] for its Lemma 5. Both statements are present here with
      proofs: 2015/984's Lemma 3 is this paper's LEMMA 2 (page 4, proof pages
      4-5) and 2015/984's Lemma 5 is this paper's LEMMA 9 (page 7). The reading
      is recorded in KN-LIT-c5dceb.
    - >-
      IT IS AN EARLIER, WEAKER-CONCLUSION PAPER BY THE SAME AUTHOR. Its Theorems
      1 and 2 (page 8) claim O(exp(n^{2/3+o(1)})) -- SUBEXPONENTIAL -- for ECDLP
      over F_{p^n} and for JACDLP of small-genus curves, under the first fall
      degree assumption. 2015/984 reaches POLYNOMIAL time from the same
      assumption by adding the disjoint factor base of 2013/548. So the pair is a
      before/after on one author's programme, not two independent accounts.
    - >-
      ITS ASSUMPTION 1 IS NOT 2015/984's ASSUMPTION 1. This paper's Assumption 1
      (page 3) reads "Upper bound of the degree of the polynomial for computing
      Groebner basis of f_1, ..., f_l of F4 algorithm is D_ff + O(1)", and its
      Lemma 1 (page 3) charges O(N^{D_ff.C+O(1)}). 2015/984's Assumption 1 drops
      the "+ O(1)" and its Lemma 2 charges O(N^{d_F w}). The difference is
      immaterial to a subexponential claim and is NOT immaterial to a claim that
      names a polynomial exponent.
    - >-
      REFERENCE [6] OF THIS PAPER IS 2013/548. It is cited as "K. Nagao,
      Decomposition formula of the Jacobian group of plane curve, draft, 2013" --
      the companion frozen at inputs/NAGAO-2013-548/ (SRC-NAGAO-2013-548). The
      two papers were received on the same day, 2013-09-04.
what_the_paper_claims:
  headline: >-
    Under the first fall degree assumption (its Assumption 1, page 3), ECDLP over
    F_{p^n} for small p costs O(exp(n^{2/3+o(1)})) (Theorem 1, page 8), and
    JACDLP for a small-constant-genus plane curve over F_{p^n} costs the same
    (Theorem 2, page 8). Parameters: d = O(n^{1/3}), n_0 = O(n^{2/3}).
  what_carries_the_result: >-
    Proposition 1 (page 7): the first fall degree of the equations system
    {[F_0]#_k | k = 1, ..., n} u S_fe is <= (p-1)d.alpha + 1, where alpha ~
    log_p(2^d) is chosen so that p^alpha - 1 + deg F < 2p^alpha - p^{alpha-1} - 2
    <= p^{n_0-1}. It is assembled from the weight theory of Section 3 (Lemmas
    3-8, pages 5-6), the multiplier identity Lemma 9 (page 7), and the rewriting
    Lemma 2 (page 4).
  the_lemma_the_2015_paper_needs: >-
    LEMMA 2, page 4: "Let G_1, ..., G_N in F_p[X_1, .., X_N] be local polynomials
    and put F := sum G_i . (X_i^p - X_i) and D := deg F. So, there are some local
    polynomials G'_1, ..., G'_N satisfying F := sum_{i=1}^N G'_i . (X_i^p - X_i)
    and deg G'_i <= D - p (i = 1, ..., N)." This is the statement 2015/984
    attributes to its Lemma 3, modulo renaming G -> f and D -> deg F. Its proof
    occupies pages 4-5 and is a descent on the leading monomial under a
    degree-compatible monomial order.
  self_declared_limits:
    - The PDF's title line ends "(Draft)".
    - >-
      Page 3, on the first fall degree assumption it then uses: "This assumption
      has some counter examples and Petit et al. assume that the polynomials
      f_1, ..., f_l are general polynomials. However, if f_1, ..., f_l are
      randomly chosen, the value of D_ff seems to be very large."
    - >-
      Page 3, on the stronger max-over-basis-change variant D_ff := max_M
      D_ff(M) that the author says would make the assumption plausible: "However,
      by using this new assumption, I can not prove that the equations system
      coming from Weil descent have low first fall degree in strict way and it
      remains a future work."
    - >-
      Page 5, immediately after Lemma 2, on computing the rewritten coefficients:
      "when deg f ~ exp(n^{1/3+O(1)}), computation of such G'_i is very difficult
      and its complexity (using direct computation) seems to be exponential of n,
      although computation of wd(f) is subexponential."
    - >-
      Page 2, on practicality: "although its complexity is subexponential, the
      practical computation, especially in cases of p > 2 or g >= 2, is difficult
      and it is only a result of the complexity."
    - >-
      Page 1, "Revise 9/8": "Lemma 9 of the first version of this manuscript is
      false and I delete the content of §4 and related footnote." The frozen text
      has a LEMMA-NUMBERING GAP consistent with a deletion -- Lemma 9 (page 7) is
      followed by Lemma 11 (page 7); there is no Lemma 10 anywhere.
    - >-
      Page 1, "Revise 6 NOV": Section 3's degree estimate did not have the
      property the aim required and is repaired by replacing the monomial
      multiplier m_0 = prod X_i^{p^alpha-1-E_i} with the polynomial prod (X_i -
      tau)^{p^alpha-1-E_i} for tau outside the base subspace. The author asserts
      "we have this property and all lemmas still hold".
    - >-
      Section 4 contains no Lemma 10 and its reference list has eight entries,
      one of which ([8], Semaev's summation polynomials) is cited as "Preprint,
      2004" with no venue.
what_this_freeze_does_not_assert: >-
  Nothing about whether Lemma 2, Proposition 1, Theorem 1 or Theorem 2 is
  correct. The freeze establishes only that these bytes are what eprint.iacr.org
  served at the recorded time and that paper_fulltext.md is a mechanical
  extraction of them. In particular it does not assert that the frozen bytes are
  the bytes Nagao 2015/984 read -- the earlier revision is not obtainable here --
  and it does not assert that the "all lemmas still hold" claim of the page-1
  revision note has been checked. What the reading did and did not establish is
  recorded in KN-LIT-c5dceb and DEC-20260913-8d19e5, not here.
