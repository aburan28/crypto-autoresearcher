why_frozen: >-
  These are the two standardised elliptic curves over binary fields of COMPOSITE
  extension degree with a large prime subfield that this program can name: 155 =
  5*31 and 185 = 5*37. Both fields are quintic extensions of F_{2^31} and F_{2^37}
  respectively, which is the Gaudry-Diem index-calculus setting at n = 5 with a
  factor base of points whose x-coordinate lies in the subfield, and it is the
  setting in which Weil (GHS) descent through the degree-5 extension is classically
  studied. They are therefore concrete, deployed, parameter-verified OBJECTS for the
  point-decomposition problem, rather than curves this program generated to suit
  its instruments. RQ-OAKLEY-264353 is posed on them.

verified_facts:
  verifier: inputs/RFC2409-OAKLEY-EC2N/verify_params.py
  verifier_output: inputs/RFC2409-OAKLEY-EC2N/verify_params.out
  method: >-
    Pure-Python F_2[u]/(f) arithmetic. The verifier parses the parameters OUT OF
    the frozen text, checks the trinomial is irreducible (Rabin), lifts Generator
    One to a point via the half-trace, checks that the stated Group Order kills
    it, checks that h = 1 is the only cofactor placing h*N in the Hasse interval
    (so the RFC's "Group Order" is #E itself), and factors #E. Everything below is
    a computation over the frozen bytes; nothing is recalled.
  group_3:
    field: 'F_{2^155}, f = u^155 + u^62 + 1 (irreducible trinomial)'
    subfield_tower: '155 = 5 * 31; [F_{2^155} : F_{2^31}] = 5'
    curve: 'y^2 + xy = x^3 + b, a = 0, b = 0x07338f'
    koblitz: false   # b is not in F_2, so no Frobenius/tau-adic structure
    generator_x: '0x7b, lifts to a point on the curve'
    curve_order: '#E = 0x0800000000000000000057db5698537193aef944 = 2^2 * 3 * r'
    dlp_subgroup: 'r = 0xaaaaaaaaaaaaaaaaaab1fcf1e206f421a3ea1b, 152-bit prime'
  group_4:
    field: 'F_{2^185}, f = u^185 + u^69 + 1 (irreducible trinomial)'
    subfield_tower: '185 = 5 * 37; [F_{2^185} : F_{2^37}] = 5'
    curve: 'y^2 + xy = x^3 + b, a = 0, b = 0x1ee9'
    koblitz: false
    generator_x: '0x18, lifts to a point on the curve'
    curve_order: '#E = 0x01ffffffffffffffffffffffdbf2f889b73e484175f94ebc = 2^2 * r'
    dlp_subgroup: 'r = 0x7ffffffffffffffffffffff6fcbe226dcf92105d7e53af, 183-bit prime'
  what_is_NOT_verified_here: >-
    Nothing about the security of either curve, the feasibility of any descent
    or decomposition on it, or the literature's prior analysis of these groups.
    Those are research questions, not properties of the frozen text.

