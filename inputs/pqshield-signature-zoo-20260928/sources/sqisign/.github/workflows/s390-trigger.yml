name: Big-endian s390x test (manual trigger)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'The commit SHA to run the workflow on'
        required: true
        type: string

jobs:
  s390-be:
    strategy:
      matrix:
        BUILD_TYPE: [Debug, Release]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.inputs.commit_sha }}
    - name: Setup multiarch/qemu-user-static
      run: |
        docker run --rm --privileged multiarch/qemu-user-static:register --reset
    - name: Run build and tests in s390x container
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace multiarch/ubuntu-core:s390x-focal bash -c "
          set -x &&
          cd /workspace &&
          ls -l . &&
          uname -a &&
          lscpu | grep Endian &&
          apt -y update &&
          apt -y install cmake gcc &&
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.BUILD_TYPE }} -DSQISIGN_BUILD_TYPE=ref &&
          cmake --build build --config ${{ matrix.BUILD_TYPE }} &&
          cd /workspace/build &&
          ctest -j4 --output-on-failure -C ${{ matrix.BUILD_TYPE }}
        "
