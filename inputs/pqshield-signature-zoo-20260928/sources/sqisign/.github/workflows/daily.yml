name: Daily Workflow

# Aggregator: everything that runs once a day rather than on every push lives here, one `uses:` per job file. The
# same four workflows are dispatched by hand from daily_trigger.yml. Add a job here and it is picked up nightly;
# remember to add it to daily_trigger.yml as well.
on:
  schedule:
    - cron: '0 0 * * *'  # This cron expression means "run at midnight UTC every day"

permissions:
  contents: read

jobs:
  benchmarks:
    uses: ./.github/workflows/benchmarks.yml

  ct-test:
    uses: ./.github/workflows/ct-test.yml

  cppcheck:
    uses: ./.github/workflows/cppcheck.yml

  clang-tidy:
    uses: ./.github/workflows/clang-tidy.yml
