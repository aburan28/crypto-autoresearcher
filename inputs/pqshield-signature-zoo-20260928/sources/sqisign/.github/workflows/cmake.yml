name: CMake

on:
  push:
    branches: ["**"]
#  pull_request:
#    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    strategy:
      matrix:
        platform: [x64, arm64]
        toolchain: [""]
        sqisign_build_type: [ref]
        sqisign_test_reps: [10]
        gf_radix: [AUTO, 32]
        enable_sign: [ON]
        include:
          - platform: x64
            toolchain: ""
            sqisign_build_type: broadwell
            sqisign_test_reps: 10
            gf_radix: AUTO
            enable_sign: ON
          - platform: arm64
            toolchain: ""
            sqisign_build_type: arm64
            sqisign_test_reps: 10
            gf_radix: AUTO
            enable_sign: ON
          - platform: x64
            toolchain: .cmake/32bit.cmake
            sqisign_build_type: ref
            sqisign_test_reps: 10
            gf_radix: 32
            enable_sign: ON
          - platform: x64
            toolchain: ""
            sqisign_build_type: ref
            sqisign_test_reps: 10
            gf_radix: AUTO
            enable_sign: OFF

    runs-on: [self-hosted, "${{ matrix.platform }}"]

    steps:
      - uses: actions/checkout@v5

      ##    - name: Install dependencies Valgrind, Doxygen, TeX, gcc-multilib
      ##      run: |
      ##          sudo apt update && sudo apt --fix-missing install valgrind doxygen texlive-xetex gcc-multilib

      - name: Set up environment for ccache
        run: echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DSQISIGN_BUILD_TYPE=${{ matrix.sqisign_build_type }} -DSQISIGN_TEST_REPS=${{ matrix.sqisign_test_reps }} -DGF_RADIX=${{ matrix.gf_radix }} -DENABLE_SIGN=${{ matrix.enable_sign }} ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} -G Ninja

      - name: Build
        # Build your program with the given configuration
        run: |
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      ## - name: Build documentation
      ##  # Create html and latex documentation, TODO: do we need different docs for ref and opt?
      ##  if: ${{ ((matrix.gf_radix != 32) && (matrix.enable_sign == 'ON')) }}
      ##  run: doxygen Doxyfile && cd latex && xelatex refman

      ## - name: Upload latex documentation
      ##  if: ${{ ((matrix.gf_radix != 32) && (matrix.enable_sign == 'ON')) }}
      ##  uses: actions/upload-artifact@v5
      ##  with:
      ##    name: docs-${{ matrix.platform }}-${{ matrix.sqisign_build_type }}
      ##    path: latex/refman.pdf

      - name: Test
        working-directory: ${{github.workspace}}/build
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest -j4 --output-on-failure -C ${{env.BUILD_TYPE}} -E "KAT$"

      - name: Examples
        working-directory: ${{github.workspace}}/build/apps
        run: |
          ./example_nistapi_p324_3
          ./example_nistapi_p500_27
          ./example_nistapi_p664_17
        if: ${{ matrix.enable_sign == 'ON' }}

      - name: Release build & test
        run: |
          rm -rf build
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSQISIGN_BUILD_TYPE=${{ matrix.sqisign_build_type }} -DCMAKE_C_COMPILER=clang -DSQISIGN_TEST_REPS=1 -DGF_RADIX=${{ matrix.gf_radix }} -DENABLE_SIGN=${{ matrix.enable_sign }} ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} -G Ninja
          cmake --build build
          CTEST_OUTPUT_ON_FAILURE=1 ctest -j4 -V --test-dir build -E "KAT$"

      - name: Memcheck
        run: |
          rm -rf build
          cmake -Bbuild -DSQISIGN_TEST_REPS=1 -DSQISIGN_BUILD_TYPE=${{ matrix.sqisign_build_type }} -DSQISIGN_TEST_REPS=1 -DGF_RADIX=${{ matrix.gf_radix }} -DENABLE_SIGN=${{ matrix.enable_sign }} ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} -G Ninja
          cmake --build build
          valgrind --error-exitcode=1 --max-stackframe=4116160 ./build/test/sqisign_test_scheme_p500_27
          valgrind --error-exitcode=1 --max-stackframe=4116160 ./build/test/sqisign_test_scheme_p324_3
          valgrind --error-exitcode=1 --max-stackframe=4116160 ./build/test/sqisign_test_scheme_p664_17
        if: ${{ matrix.toolchain == '' && matrix.platform == 'arm64' && matrix.gf_radix == 'AUTO' }} 

      - name: Build shared libraries
        run: |
          rm -rf build
          cmake -Bbuild -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DSQISIGN_BUILD_TYPE=${{ matrix.sqisign_build_type }} -DGF_RADIX=${{ matrix.gf_radix }} -DENABLE_SIGN=${{ matrix.enable_sign }} -DCMAKE_C_COMPILER=clang ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} -G Ninja
          cmake --build build
          find . -name '*.so' | grep so
          CTEST_OUTPUT_ON_FAILURE=1 ctest -j4 -V --test-dir build -E "KAT$"

      - name: Address Sanitizer ASAN
        run: |
          rm -rf build
          cmake -Bbuild -DCMAKE_BUILD_TYPE=ASAN -DSQISIGN_BUILD_TYPE=${{ matrix.sqisign_build_type }} -DCMAKE_C_COMPILER=clang -DSQISIGN_TEST_REPS=1 -DGF_RADIX=${{ matrix.gf_radix }} -DENABLE_SIGN=${{ matrix.enable_sign }} ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} -G Ninja
          cmake --build build
          CTEST_OUTPUT_ON_FAILURE=1 ctest -j4 -V --test-dir build -E "KAT$"

#      - name: Memory Sanitizer MSAN
#        run: |
#          rm -rf build
#          cmake -Bbuild -DCMAKE_BUILD_TYPE=MSAN -DSQISIGN_BUILD_TYPE=${{ matrix.sqisign_build_type }} -DCMAKE_C_COMPILER=clang -DSQISIGN_TEST_REPS=1 -DGF_RADIX=${{ matrix.gf_radix }} -DENABLE_SIGN=${{ matrix.enable_sign }} ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} -G Ninja
#          cmake --build build
#          CTEST_OUTPUT_ON_FAILURE=1 ctest -j4 -V --test-dir build -E "KAT$"

      - name: Leak Sanitizer LSAN
        run: |
          rm -rf build
          cmake -Bbuild -DCMAKE_BUILD_TYPE=LSAN -DSQISIGN_BUILD_TYPE=${{ matrix.sqisign_build_type }} -DCMAKE_C_COMPILER=clang -DSQISIGN_TEST_REPS=1 -DGF_RADIX=${{ matrix.gf_radix }} -DENABLE_SIGN=${{ matrix.enable_sign }} ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} -G Ninja
          cmake --build build
          CTEST_OUTPUT_ON_FAILURE=1 ctest -j4 -V --test-dir build -E "KAT$"

      - name: Undefined Behavior Sanitizer UBSAN
        run: |
          rm -rf build
          cmake -Bbuild -DCMAKE_BUILD_TYPE=UBSAN -DSQISIGN_BUILD_TYPE=${{ matrix.sqisign_build_type }} -DCMAKE_C_COMPILER=clang -DSQISIGN_TEST_REPS=1 -DGF_RADIX=${{ matrix.gf_radix }} -DENABLE_SIGN=${{ matrix.enable_sign }} ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE={0}', matrix.toolchain) || '' }} -G Ninja
          cmake --build build
          CTEST_OUTPUT_ON_FAILURE=1 ctest -j4 -V --test-dir build -E "KAT$"

  pqm4:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    runs-on: [self-hosted, x64]

    steps:
      - uses: actions/checkout@v5

      ##    - name: Install dependencies Valgrind, Doxygen, TeX, gcc-multilib
      ##      run: |
      ##          sudo apt update && sudo apt --fix-missing install valgrind doxygen texlive-xetex gcc-multilib

      - name: Set up environment for ccache
        run: echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake -B ${{github.workspace}}/build -DSQISIGN_BUILD_TYPE=ref -G Ninja

      - name: Build
        # Build your program with the given configuration
        run: |
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Generate pqm4 sources and update pqm4 directory
        working-directory: ${{github.workspace}}
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: |
          ./scripts/gen_pqm4_sources.sh all
          rsync -ac ~/the-sqisign-pqm4 .
          rm -rf ./the-sqisign-pqm4/crypto_sign/sqisign_{p324_3,p500_27,p664_17}
          cp -r src/pqm4/sqisign_{p324_3,p500_27,p664_17} ./the-sqisign-pqm4/crypto_sign

      - name: Build pqm4 firmware
        working-directory: ${{github.workspace}}
        # Build everything test.py and benchmarks.py need up front: the build runs in parallel and prints any errors
        run: |
          cd ./the-sqisign-pqm4
          make PLATFORM=mps2-an386 clean
          make PLATFORM=mps2-an386 -j$(nproc) \
            bin/crypto_sign_sqisign_{p324_3,p500_27,p664_17}_{ref,m4f}_{test,stack,speed,hashing}.bin \
            obj/libcrypto_sign_sqisign_{p324_3,p500_27,p664_17}_{ref,m4f}.a

      - name: Run pqm4 tests
        working-directory: ${{github.workspace}}
        run: |
          cd ./the-sqisign-pqm4
          TQDM_DISABLE=1 timeout 3600 ./test.py -p mps2-an386 -o speed sqisign_{p324_3,p500_27,p664_17}

      - name: Run pqm4 benchmarks
        working-directory: ${{github.workspace}}
        run: |
          cd ./the-sqisign-pqm4
          TQDM_DISABLE=1 timeout 900 ./benchmarks.py -p mps2-an386 -o speed sqisign_{p324_3,p500_27,p664_17}
