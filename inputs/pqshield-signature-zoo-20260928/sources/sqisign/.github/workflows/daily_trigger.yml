name: Daily Workflow, manual trigger

# Manual counterpart to daily.yml: runs the same four jobs, optionally against a specific commit. Keep the job list
# in sync with daily.yml.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'The commit SHA to run the workflow on (optional; defaults to the checked-out ref)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  benchmarks:
    uses: ./.github/workflows/benchmarks.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}

  ct-test:
    uses: ./.github/workflows/ct-test.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}

  cppcheck:
    uses: ./.github/workflows/cppcheck.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}

  clang-tidy:
    uses: ./.github/workflows/clang-tidy.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
