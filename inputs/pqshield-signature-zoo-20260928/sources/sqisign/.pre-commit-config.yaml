# Formatting hook. See FORMATTING.md for setup instructions.
#
# This file is the single source of truth for the clang-format version and for which files are formatted:
# scripts/format.sh (used by `make format`, `make check-format` and CI) parses `rev:` and `exclude:` out of this file,
# so the two can never disagree.
#
# Everything in `exclude:` below is vendored third-party code or generated code.
repos:
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v18.1.6
  hooks:
  - id: clang-format
    types_or: [c]
    exclude: '^src/precomp/|^src/common/ref/(aes_c\.c|randombytes_ctrdrbg\.c|include/aes\.h)$|^src/common/generic/(fips202\.c|randombytes_system\.c|include/(bench_macos|fips202)\.h)$|^src/gf/ref/p[0-9_]+/fp_p|^src/mp/ref/p[0-9_]+/(include/)?modq_|^include/sqisign_namespace\.h$|^apps/PQCgenKAT_sign|^test/test_kat\.c$'
