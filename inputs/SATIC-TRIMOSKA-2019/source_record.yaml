load_bearing_claims:
  - id: C1
    claim: >-
      The CNF-XOR model of the pdp has exactly ml core variables (the c_{i,j}); assigning all of
      them propagates every remaining variable by unit propagation (Proposition 1 of the paper).
    status: stated_and_proved_in_source
  - id: C2
    claim: >-
      Restricting the branching order to those ml core variables is the dominant effect. Patching
      that order into CryptoMiniSat took l=6,n=17 SAT from 133.98s to 15.67s and l=6,n=19 from
      560.08s to 14.13s (Table 4), i.e. roughly 8.5x-40x, with no change to the solver's core search.
    status: reported_measurement_not_reproduced
  - id: C3
    claim: >-
      Gaussian elimination on XOR constraints is NOT beneficial for this model. WDSatGE is slower
      than WDSat (0.601s -> 9.193s at l=6,n=17 SAT) for a small decrease in conflicts (Table 4).
    status: reported_measurement_not_reproduced
  - id: C4
    claim: >-
      A symmetry-breaking technique exploiting that the m factor-base points are unordered gives a
      time-complexity gain of a factor m!; measured speedup approaches 6 for m=3.
    status: stated_and_proved_in_source
  - id: C5
    claim: >-
      Memory, not time, is the Grobner wall for this problem: Grobner runs exceeded a 200GB limit at
      l=8, while WDSat allocates statically and stayed at ~16.9MB across all reported sizes (Table 2).
    status: reported_measurement_not_reproduced
  - id: C6
    claim: >-
      Headline comparison: WDSat with symmetry breaking is up to 300x faster than Magma's F4 for the
      l and n tested, and the authors state the factor grows with l and n.
    status: reported_measurement_not_reproduced
authors_own_open_problems:
