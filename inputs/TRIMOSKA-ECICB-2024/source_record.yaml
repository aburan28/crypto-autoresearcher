license: GPL-3.0 (upstream LICENSE file, vendored verbatim)
suggested_by: >-
  The repository owner, in conversation on 2026-09-13 ("Maybe this is a good
  approach? https://github.com/mtrimoska/EC-Index-Calculus-Benchmarks"), while
  asking for a concrete, phase-decomposed runtime boundary for index-calculus ECDLP
  on Koblitz, binary and prime-field curves.
what_it_is: >-
  The code Trimoska-Ionica-Dequen used to create the point-decomposition (PDP)
  instances behind SRC-SATIC-TRIMOSKA-2019 / KN-LIT-102cdb. `find_points.sage`
  draws m-1 = 3 random factor-base points (x of degree < l) on the fixed curve
  E: y^2 + xy = x^3 + x^2 + 1 over F_{2^n} (Sage's default Conway modulus), forms
  R = P1 + P2 + P3, and emits one `script_benchmarks.sh` line per instance carrying
  (n, l, modulus, x_R, and for SAT instances the three factor-base x-coordinates as
  a certificate). `script_benchmarks.sh` compiles the C generator in `Weil_descent/`
  and writes the fourth-summation-polynomial system after Weil descent in four
  forms: CNF-XOR DIMACS (`Xn*l*-id-{S,U}.dimacs`), ANF for WDSat (`X*.anf`), a Magma
  `BooleanPolynomialRing` Groebner script (`n*.in`), and pure CNF via
  `XORtoCNF.sh` (`n*.dimacs`). UNSAT instances use a random x_R with no known
  decomposition; their label `U` is the generator's, not a verified fact.
shipped_benchmark_set:
  cells: [{n: 15, l: 5}, {n: 17, l: 6}, {n: 19, l: 6}]
  per_cell: 20 instances, ids 1-10 labelled S (with certificate), 11-20 labelled U
  curve: y^2 + xy = x^3 + x^2 + 1 (a2 = 1, a6 = 1; the a = 1 Koblitz family form)
  moduli_in_info_files:
    n15: '1010110000000001 = x^15 + x^5 + x^4 + x^2 + 1'
    n17: '100100000000000001 = x^17 + x^3 + 1'
    convention: coefficient strings are low-degree-first (Sage coefficients(sparse=False))
    n19: '11100100000000000001 = x^19 + x^5 + x^2 + x + 1'
  variable_counts_magma_form: {n15l5: 42, n17l6: 51, n19l6: 51}
  equation_counts_magma_form: {n15l5: 43, n17l6: 52, n19l6: 52}
  note: >-
    Variable and equation counts for the Magma form are read from the vendored `.in`
    files (BooleanPolynomialRing(42|51, "grevlex"); 43|52 polynomials). The n19l6
    51-variable/52-equation shape matches the "51 variables, 52 equations" caption
    that SRC-SATIC-TRIMOSKA-2019 recorded for the CP 2020 slide, which identifies
    the instance family that slide reports.
vendored:
  path: inputs/TRIMOSKA-ECICB-2024/upstream/
  policy: >-
    Vendored under GPL-3.0. Included: README, LICENSE, both Sage scripts, both shell
    drivers, the complete C generator (`Weil_descent/*.c, *.h`) and its assembly
    scripts (`Weil_descent/out/*.sh`), and the 240 shipped instance files in the
    INFO, ANF, CNF-XOR and Magma forms. EXCLUDED to keep the package under 10 MB:
    the 60 pure-CNF `n*.dimacs` files (16 MB; a deterministic `XORtoCNF.sh`
    transform of the CNF-XOR files), the `build/` CMake tree with object files, the
    Xcode project, `.DS_Store` files, the `wd`/`a.out` binaries, and the generator's
    scratch `out/*` fixtures. Every excluded file is hashed in UPSTREAM_SHA256SUMS.txt.
  manifest_of_vendored_files: inputs/TRIMOSKA-ECICB-2024/VENDORED_SHA256.json
  manifest_of_full_upstream_tree: inputs/TRIMOSKA-ECICB-2024/UPSTREAM_SHA256SUMS.txt
  vendored_file_count: 269
provenance:
  acquisition: >-
    `git clone --depth 1 https://github.com/mtrimoska/EC-Index-Calculus-Benchmarks`
    at approximately 2026-09-13T21:15Z from the top-level Coordinator session on branch
    cursor/semaev-2015-audit-program-5b8b; HEAD a053971cb155fbab30eaed3e2d11df850b4f3fbb.
    Hashes taken from that clean checkout before anything was built in it.
  regeneration_check:
    performed: true
    performed_by: coordinator, in a scratch copy under /tmp, not in the repository
    method: >-
      Copied the clone, emptied benchmarks/, reset id-n19l6 to 1, and ran the shipped
      driver for the first n19l6 SAT line of launch.sh:
      `./script_benchmarks.sh 19 6 11100100000000000001 0110011110111000100 000010-001011-010010 S`
      (gcc, this machine). Compared the five regenerated files against the shipped
      ones with `cmp`.
    result: >-
      INFOn19l6-1-S.dimacs, Xn19l6-1-S.anf, Xn19l6-1-S.dimacs, n19l6-1-S.in and
      n19l6-1-S.dimacs were all BYTE-IDENTICAL to the shipped files. The shipped
      instance set is therefore a deterministic function of the INFO parameters and
      the vendored generator, and the excluded pure-CNF files are recoverable.
    not_checked: >-
      Only one instance was regenerated. The Sage point-sampling stage
      (`find_points.sage`) was NOT run: Sage is not installed here, and the INFO
      files already carry its output. Whether every shipped S-instance certificate
      actually lies on the curve and sums to x_R is NOT established by this record;
      that is the first control of EXP-ICPERF-66fd51, with independent GF(2^n)
      arithmetic.
  corroboration:
    - >-
      The 50 ANF files under `benchmarks/IC_S4/` in the WDSat repository
      (SRC-ICPERF-TRIMOSKA-WDSAT-2024) are byte-identical to the same-named files
      here (`diff -q` on Xn15l5-10-S.anf; the WDSat set is a 50-file subset).
    - >-
      The curve in `find_points.sage`, `EllipticCurve(K,[1,1,0,0,1])`, is
      y^2 + xy = x^3 + x^2 + 1, matching Section 5 of SRC-SATIC-TRIMOSKA-2019.
  not_verified:
    - No timing from any Trimoska publication has been reproduced by this record.
    - >-
      The `U` label on instances 11-20 of each cell asserts only that x_R was drawn
      at random; unsatisfiability is not certified anywhere upstream.
    - >-
      The fourth summation polynomial `f3` hard-coded in the Sage scripts and the C
      generator has not been re-derived here against Semaev's S_4 for this curve
      form; the certificate check in EXP-ICPERF-66fd51 tests the instances, not the
      formula.
