frozen_source:
  id: GG-2014-806
  title: Summation polynomial algorithms for elliptic curves in characteristic two
  authors:
    - Steven D. Galbraith
    - Shishay W. Gebregiyorgis
  year: 2014
  venue: IACR Cryptology ePrint Archive
  eprint: 'iacr:2014/806'
  url: https://eprint.iacr.org/2014/806
  corpus_record: knowledge/literature/KN-LIT-439.md
  frozen_at: '2026-09-13'
  frozen_by: coordinator
  frozen_under_decision: DEC-20260913-cb5ee2
  why_frozen: >
    KN-LIT-439 has carried `confidence: reported` since a 2026-07-24 bulk seeding
    pass that read only the local PDF's first two pages, and its "Local copies"
    section points at `downloads/2014-806.pdf`, WHICH DOES NOT EXIST anywhere in
    this repository. So the one paper that supplies the load-bearing device for
    H-SEMBIN-c59e50 -- the coset-typed factor base that removes eq. (11)'s m! --
    was uncheckable in this checkout: any agent citing it had to relay the corpus
    record's relayed abstract. Freezing it here makes the citation checkable by a
    later reader instead of trusted.
  retrieval:
    method: >
      curl -sL -o gg2014-806.pdf https://eprint.iacr.org/2014/806.pdf
    text_extraction: >
      pdfminer.six extract_text (installed for this purpose; the repository
      carries no PDF extractor by default)
    retrieved_at: '2026-09-13'
  files:
    - path: eprint-2014-806.pdf
      bytes: 357502
      sha256: 737e2ac98a9482cbb0d53ffb511782894bebe5e0d60d20cdf0f2220e972f51e5
    - path: paper_fulltext.txt
      bytes: 69500
      sha256: 4dd0eadc8e42da67127017e2e7182ecbb149f770885238eb587cc58fc54144de
  verified_passages:
    note: >
      Quoted VERBATIM from paper_fulltext.txt by the Coordinator on 2026-09-13.
      These four passages are the ones H-SEMBIN-c59e50 and EXP-SEMBIN-92724f rest
      on, so they are recorded here with their locations rather than paraphrased.
      Ligature artifacts of the extraction (fi, ff) are preserved as extracted.
    - locus: 'introduction, contribution item (2)'
      quote: >
        "The traditional approach has relations R = P1 + ... + Pm where Pi in
        F = {P in E(F2n) : x(P) in V} where V subset F2n is some F2-vector
        subspace of dimension l. Instead, we demand Pi in Fi over 1 <= i <= m for
        m different factor bases Fi = {P in E(F2n) : x(P) in V + vi} where vi in
        F2n are elements of a certain form so that the sets V + vi are all
        distinct. (Diem [8] has also used different factor bases Fi, but in a
        different way.) The probability of finding a relation is increased by a
        factor approximately m!, but we need m times as many relations, so the
        total speedup is approximately by a factor of (m - 1)!."
      supports: >
        The three substitutions the typed arm of EXP-SEMBIN-92724f applies, and
        the (m-1)! net rather than m!. Confirms the device is prior art and
        confirms the net is (m-1)!, so quoting m! would overstate the gain by a
        factor m.
    - locus: 'section 4.2, Breaking Symmetry'
      quote: >
        "Since we heuristically assume that #Fi ~ 2^l, we expect the number of
        points in {P1 + ... + Pm : Pi in Fi} to be roughly 2^{lm}. Note that
        there is no 1/m! term here. The entire purpose of this definition is to
        break the symmetry and hence increase the probability of relations.
        Hence, the probability that a uniformly chosen point R in E(F2n) can be
        decomposed in this way is heuristically 2^{lm}/2^n = 1/2^{n-lm}."
      supports: >
        HEUR-YT of H-SEMBIN-c59e50 verbatim: the typed yield law with no symmetry
        factor. Note it is stated by GG as a HEURISTIC ("we heuristically
        assume"), which is exactly why EXP-SEMBIN-92724f measures the image size
        by exhaustive enumeration rather than inheriting it.
    - locus: 'section 4.2, resolution of the "paradox"'
      quote: >
        "To resolve this 'paradox' we must distinguish the computation of the
        polynomial from the construction of the system of equations via Weil
        descent. ... When we do the Weil descent and include the definitions of
        the factor bases Fi, we then introduce some new variables. As noted by
        Huang et al [19], expressing the invariant variables with respect to the
        variables from the construction of the factor bases is non-trivial. But
        it is this stage where we introduce symmetry-breaking."
      supports: >
        THE LOAD-BEARING PASSAGE, and it supports the mechanism more directly
        than the proposal claimed. GG locate their own obstruction precisely at
        "expressing the INVARIANT VARIABLES with respect to the variables from the
        construction of the factor bases". Semaev's chained system has no
        invariant variables -- x_1, ..., x_t appear individually -- so the stage
        at which GG pay their penalty does not exist there. The non-transfer of
        GG's obstruction is therefore the authors' own diagnosis of it rather
        than an inference from their numbers.
    - locus: 'section 4.2, the penalty worked example at m = 4'
      quote: >
        "s2 = (t1^2 + t1)(t2^2 + t2) + ... + (t3^2 + t3)(t4^2 + t4) previously had
        highest term d2,4l-4 theta^{4l-4} but now has highest terms d2,4l-4
        theta^{4l-4} + d2,4l-2 theta^{4l-2} + theta^{4l+2}. Hence, we require one
        more variable than the previous case, and things get worse for higher
        degree terms. So the symmetry breaking increases the probability of a
        relation but produces a harder system of polynomial equations to solve."
      supports: >
        The cost of un-projecting IN A SYMMETRISED PRESENTATION, and hence the
        first of EXP-SEMBIN-92724f's two proves-too-much nearby objects: an
        argument that collapses GG's own setting to polynomial time has proved
        too much. The penalty is exhibited on s2, an elementary symmetric
        variable, which is the point.
  scope_notes_that_must_travel_with_these_quotes:
    - >
      NOTATION. GG's factor-base dimension is l; Semaev's is k. They are the same
      parameter and every cross-quotation must say which is meant. GG's probability
      1/2^{n-lm} is Semaev's 2^{mk-n} with the symmetry factor deleted.
    - >
      TWO DIFFERENT FACTOR-BASE MAPS APPEAR IN THIS PAPER AND THEY ARE NOT
      INTERCHANGEABLE. The introduction's item (2) states the device for
      Weierstrass curves as x(P) in V + v_i. Section 4.2 states it as
      t(P) in V + v_i with t(x, y) = x + y, on BINARY EDWARDS curves with the
      paper's new coordinates. H-SEMBIN-c59e50 transfers the INTRODUCTION's
      x(P) form to Semaev's Weierstrass chained system; the section 4.2
      construction of the v_i (v_1 = 0, v_2 = theta^l, v_3 = theta^{l+1},
      v_4 = theta^{l+1} + theta^l, ... with v_i's binary expansion reading i-1) is
      a construction of coset representatives and transfers independently of the
      curve model. A reviewer should check that this splice is stated wherever it
      is used, because conflating the two maps would attribute an Edwards-specific
      result to a Weierstrass one.
    - >
      GG's own verdict on their device is NEGATIVE-TO-INCONCLUSIVE: "The
      symmetry-breaking factor base and use of SAT solvers seem to give some
      benefits in practice, but our experimental results are not conclusive", and
      "Pollard rho is still much faster than index calculus algorithms for the
      ECDLP ... over prime extension fields F2n of reasonable size." Nothing in
      this program may cite GG as support for the device being effective. What GG
      supply is (a) that the device exists and is theirs, (b) the (m-1)!
      accounting, and (c) the location of its cost in symmetrised coordinates.
    - >
      A REMAINING CURATION DEBT, named rather than silently carried:
      knowledge/literature/KN-LIT-439.md still reads `confidence: reported`, still
      contains a "Not verified here" section saying its claims are relayed from
      the abstract, and still points at a nonexistent `downloads/2014-806.pdf`.
      Freezing the source here does NOT update that record. Upgrading it is
      knowledge-curation work outside this decision's scope and is listed in
      DEC-20260913-cb5ee2's next actions.
