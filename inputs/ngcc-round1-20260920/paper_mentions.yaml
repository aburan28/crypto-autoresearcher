# Literature index only. Each entry records that Saarinen, "Chinese NGCC
# Algorithms: The First Week of AI Cryptanalysis", IACR ePrint 2026/2266
# (2026-09-29), names this candidate or finding id. Nothing here is a
# result of this program, and nothing here is an attack procedure.
paper_mentions:
  source:
    citation: >-
      Markku-Juhani O. Saarinen, Chinese NGCC Algorithms: The First Week
      of AI Cryptanalysis, IACR Cryptology ePrint Archive, Report 2026/2266,
      2026-09-29.
    url: https://eprint.iacr.org/2026/2266
    provenance: retrieved
    retrieved: '2026-09-30'
    verified_by: >-
      This session fetched the ePrint landing page and the public harness
      roster on 2026-09-30. The finding identifiers and the one-line
      statements below are taken from the paper text supplied with the
      request to register these targets. They were not re-executed.
    asserts_nothing_about: >-
      Whether any named finding is correct. A later experiment must
      reproduce or refute a claim before this program records it as evidence.
  family_counts:
    note: >-
      Table 1 of the paper gives family totals only. It does not assign a
      family to each candidate id. These totals are not a license to label
      an unnamed candidate.
    lattice_based: {sign: 11, kem: 25, kex: 7, hash: 0, total: 43}
    code_based: {sign: 5, kem: 15, kex: 1, hash: 0, total: 21}
    multivariate: {sign: 6, kem: 0, kex: 0, hash: 0, total: 6}
    isogeny_based: {sign: 3, kem: 1, kex: 1, hash: 0, total: 5}
    hash_based_signatures: {sign: 4, kem: 0, kex: 0, hash: 0, total: 4}
    symmetric_vole_in_the_head: {sign: 4, kem: 0, kex: 0, hash: 0, total: 4}
    other_group_action: {sign: 1, kem: 0, kex: 0, hash: 0, total: 1}
    hash_functions: {sign: 0, kem: 0, kex: 0, hash: 35, total: 35}
  families_the_paper_names:
    - candidate_ids: [sign-25, sign-26, sign-27]
      family: isogeny-based signature
      basis: >-
        Section 5 names "the three SQIsign variants". The roster contains
        exactly three candidates whose official names begin with SQIsign:
        SQIsign2D2, SQIsign2D-push1/2, and SQIsignTriangle.
    - candidate_ids: [kex-08]
      family: commutative group-action isogeny NIKE
      basis: >-
        Section 4 names NIIKE as the one commutative group-action design
        and an isogeny NIKE whose parameters account for Kuperberg's attack.
    - candidate_ids: []
      family: isogeny-based KEM
      basis: >-
        Table 1 counts one isogeny-based KEM and does not name it. No
        candidate is labeled with that family here.
  finding_ids:
    - id: sign-32-1
      candidate_id: sign-32
      paper_label: UVW
      statement: >-
        The signature API computes a verification result and then returns
        success, so every signature is accepted.
    - id: sign-25-1
      candidate_id: sign-25
      paper_label: SQIsign2D2
      statement: >-
        A verifier verdict depends on stale stack contents once assertions
        are compiled out.
    - id: kem-09-1
      candidate_id: kem-09
      paper_label: CheetahKEM
      statement: A rejection mask leaks seven bits of every shared-secret byte.
    - id: kem-18-1
      candidate_id: kem-18
      paper_label: LoongKEM
      statement: A rejection mask leaks seven bits of every shared-secret byte.
    - id: kem-02-1
      candidate_id: kem-02
      paper_label: Amoeba
      statement: >-
        The re-encryption check compares only every fourth ciphertext byte,
        and the paper reports full key recovery.
    - id: kem-06-4
      candidate_id: kem-06
      paper_label: null
      statement: >-
        Ignored padding or a non-canonical encoding lets a different
        ciphertext decapsulate to the same key. The paper does not name
        this candidate in prose; the id is kem-06.
    - id: kem-07-2
      candidate_id: kem-07
      paper_label: null
      statement: Same class as kem-06-4. The paper does not name kem-07 in prose.
    - id: kem-10-3
      candidate_id: kem-10
      paper_label: null
      statement: Same class as kem-06-4. The paper does not name kem-10 in prose.
    - id: kem-31-2
      candidate_id: kem-31
      paper_label: null
      statement: Same class as kem-06-4. The paper does not name kem-31 in prose.
    - id: kem-38-4
      candidate_id: kem-38
      paper_label: null
      statement: Same class as kem-06-4. UVW-KEM is kem-38 on the roster.
    - id: sign-15-4
      candidate_id: sign-15
      paper_label: MORNING-ATLAS
      statement: >-
        A decoder overwrites a temporary so adjacent mask coefficients are
        equal, and the paper says two signatures expose the secret key.
    - id: sign-15-7
      candidate_id: sign-15
      paper_label: ATLAS-128
      statement: >-
        The paper reports an independently witnessed key recovery for
        ATLAS-128. ATLAS-128 is treated here as a parameter set of
        MORNING-ATLAS (sign-15), which is the roster name.
    - id: sign-03-1
      candidate_id: sign-03
      paper_label: CEDRUS+C
      statement: >-
        A macro precedence error leaves only four reachable few-time
        signature addresses.
    - id: sign-05-1
      candidate_id: sign-05
      paper_label: Chinith
      statement: >-
        The final Fiat-Shamir challenge omits the only public-key-dependent
        value, and the paper says an ordinary signer run on a false witness
        forges for any public key.
    - id: kem-11-1
      candidate_id: kem-11
      paper_label: null
      statement: >-
        A 384- or 512-bit parameter set expands the key from a 256-bit seed
        or signs a short unsalted digest, which the paper says caps security
        at 2^256. The paper gives kem-11-1 as an example and does not name
        the scheme in that sentence. The roster name is COMPASS-KEM.
    - id: sign-02-1
      candidate_id: sign-02
      paper_label: BiT
      statement: >-
        Cited with kem-11-1 as a seed or prehash below the claimed level.
        The roster name is BIT (BiT.zip).
    - id: sign-02-2
      candidate_id: sign-02
      paper_label: BiT-128
      statement: >-
        Reported key-recovery or forgery attack left Probable because the
        end-to-end search was not independently reproduced.
    - id: kex-03-1
      candidate_id: kex-03
      paper_label: CreTAKE
      statement: >-
        A length is passed in bits where bytes are expected, and the paper
        says 8 seed bytes are absorbed instead of 64 in 23 source files.
    - id: hash-09-1
      candidate_id: hash-09
      paper_label: Eijen
      statement: Mixed bit orders in the padding give a collision of the empty message with a short string.
    - id: hash-17-1
      candidate_id: hash-17
      paper_label: MasterCube
      statement: The pad10*1 padding collapses at rate boundaries.
    - id: sign-29-1
      candidate_id: sign-29
      paper_label: Tins
      statement: >-
        One signature yields the signing witness by linear algebra over F2
        on at most 1,044 unknowns.
    - id: sign-10-2
      candidate_id: sign-10
      paper_label: Facto-DSA-128
      statement: >-
        A public key yields a universal trapdoor. The paper reports forgery
        in 6.4 seconds for that parameter set.
    - id: hash-19-1
      candidate_id: hash-19
      paper_label: MoFang
      statement: Full-round collisions, credited by the paper to Tsinghua Hash Lab.
    - id: hash-21-1
      candidate_id: hash-21
      paper_label: Neulaser
      statement: >-
        Yuan et al., ePrint 2026/2152, analyze a Neulaser mechanism. The
        paper cites that work; this program has not read 2026/2152.
    - id: hash-21-2
      candidate_id: hash-21
      paper_label: Neulaser
      statement: One state merger, credited by the paper to Tsinghua Hash Lab.
    - id: sign-18-5
      candidate_id: sign-18
      paper_label: Origami-128
      statement: A public variable permutation permits public-key-only forgery.
    - id: sign-23-1
      candidate_id: sign-23
      paper_label: Shuttle
      statement: Independently witnessed key recovery, reported with OpenAI Codex assistance.
    - id: sign-24-1
      candidate_id: sign-24
      paper_label: Sigurd
      statement: Independently witnessed key recovery from 4-8 signatures.
    - id: sign-14-1
      candidate_id: sign-14
      paper_label: Lynxer
      statement: Public-key-only forgery, independently witnessed.
    - id: sign-27-5
      candidate_id: sign-27
      paper_label: SQIsignTriangle
      statement: One-query forgery, independently witnessed.
    - id: sign-33-6
      candidate_id: sign-33
      paper_label: VDOO-128
      statement: >-
        Reported attack left Probable because the end-to-end search was not
        independently reproduced.
    - id: kem-29-2
      candidate_id: kem-29
      paper_label: Polar-KEM
      statement: Polynomial-time key recovery, credited by the paper to human researchers.
    - id: sign-08-2
      candidate_id: sign-08
      paper_label: DARTS-128
      statement: Polynomial-time key recovery, credited by the paper to human researchers.
    - id: kem-30-1
      candidate_id: kem-30
      paper_label: PolarLAC
      statement: Medium rejection-sampling side-channel finding.
    - id: kem-38-3
      candidate_id: kem-38
      paper_label: UVW-KEM
      statement: High retry-reaction side-channel finding.
  named_without_a_finding_id:
    - candidate_id: sign-12
      paper_label: Galas
      statement: >-
        Signing keys ignore the official randomness source, and the paper
        groups Galas with zero-seeded private generators.
    - candidate_id: sign-19
      paper_label: Phoenix-SM3
      statement: >-
        Known-answer vectors were produced by a different code revision.
        Phoenix-SM3 is recorded against Phoenix (sign-19); SM3 is not a
        separate roster row.
    - candidate_id: kem-33
      paper_label: QUBE
      statement: Known-answer vectors were produced by a different code revision.
    - candidate_id: sign-33
      paper_label: VDOO
      statement: >-
        Grouped with Galas as a zero-seeded private generator. The Probable
        attack is sign-33-6.
    - candidate_id: null
      paper_label: HEP-QC
      statement: >-
        The paper names HEP-QC as a KEM whose keys and encapsulations come
        from a skipped DRNG call. No roster row is named HEP-QC. It is not
        joined to a candidate.
    - candidate_id: kem-36
      paper_label: TRIKE
      statement: >-
        Named among candidates that raise parameters under a literal reading
        of the 80-bit quantum target.
  quantum_strength_reading:
    note: >-
      Section 4. The paper reports two readings of the call's quantum
      targets. This is a parameter-interpretation split, not an attack.
    literal_2_to_the_80:
      - {candidate_id: sign-03, label: CEDRUS+C}
      - {candidate_id: sign-04, label: CEDRUSɑ}
      - {candidate_id: sign-11, label: FlexTree}
      - {candidate_id: sign-12, label: Galas}
      - {candidate_id: kem-36, label: TRIKE}
      - {candidate_id: kem-16, label: HARE}
      - {candidate_id: sign-25, label: SQIsign2D2}
      - {candidate_id: sign-26, label: SQIsign2D-push1/2}
      - {candidate_id: sign-27, label: SQIsignTriangle}
      - {candidate_id: sign-13, label: GreatWall}
    symmetric_equivalence:
      - {candidate_id: kem-39, label: Weaver}
      - {candidate_id: kex-05, label: Loom}
      - {candidate_id: sign-20, label: Qing Luan}
      - {candidate_id: sign-05, label: Chinith}
      - {candidate_id: kem-38, label: UVW-KEM}
  performance_examples:
    note: Section 5 cycle counts and bandwidth comparisons. Not attacks.
    rows:
      - candidate_id: sign-06
        label: COMPASS-SIG-128
        statement: Signing cited at 1.8 million cycles.
      - candidate_id: sign-30
        label: TRINE-128-Balanced
        statement: Signing cited at 40 billion cycles.
      - candidate_id: sign-34
        label: YuanYang-1024
        statement: >-
          Cited as 11 percent smaller than Falcon-1024. The paper also says
          every other smaller signature in that comparison has a Critical
          finding, five of them design-level, and names the three SQIsign
          variants as the smaller signatures that are not in that Critical set.
