what_the_paper_claims:
  headline: >-
    Under the first fall degree assumption, ECDLP over F_{2^n} costs O(n^{8w+1})
    with w ~ 2.7 the linear-algebra constant -- POLYNOMIAL in the input size n --
    and O(n^{(6p+2)w+1}) over F_{p^n} for small constant p >= 3 (Theorem 1). The
    author's own ePrint keyword for this is "polynomial time algorithm".
  mechanism: >-
    Replace Semaev's single factor base with m DISJOINT cosets V + v_i
    (Section 7): decomposing R = P_1 + ... + P_m with P_i drawn from coset i has
    success probability O(1) rather than 1/m!, because prod_i #Fb_i ~ p^n ~ #E.
    The m! yield penalty that forces Semaev to take m ~ n^{1/2} therefore
    disappears, and k may be fixed at a small CONSTANT C_0 with m ~ n/C_0, which
    makes the whole factor base #Fb ~ (p^{C_0}/C_0) * n = O(n) elements.
  what_carries_the_exponent: >-
    Everything then rests on the first fall degree of the coset-shifted Weil
    descent EQS4 still being <= 4 at p = 2 while the variable count grows to
    n(m-1) ~ n^2/C_0. That is Proposition 5, and the paper states it with THE
    PROOF OMITTED: "The situation is the same as the Semaev's case. So, we omit
    the proof" (footnote 6). Given it, Lemma 2 charges Groebner cost
    O(N^{d_F w}) = O((nm)^{4w}) = O(n^{8w}), and #Fb = O(n) relations at that
    cost gives O(n^{8w+1}).
  self_declared_limits:
    - >-
      Section 6, in the author's own words: "we adopt the easy and rough
      estimation ... Many complicated terms are included into the o(1) term and
      so for normal size input n, o(1) has HUGE value although lim_{n->inf}
      o(1) = 0." The capitalisation of HUGE is the paper's.
    - The title line of the PDF ends "(Draft)".
    - Lemma 6's proof states "We use heuristic argument only here" in a footnote.
    - >-
      The proof of Lemma 3, which licenses using the fake first fall degree in
      place of the true one, is not given: "Proof of this Lemma is complicated
      and not constructive." It is attributed to the author's [11] (ePrint
      2013/549), which is not frozen here.
  a_definitional_correction_it_makes: >-
    Definitions 5 and 6 separate the TRUE first fall degree from a "Fake first
    fall degree" taken modulo the field equations, and the paper says plainly
    "Many researchers misunderstand the definition of first fall degree and use
    this assumption and estimation of the complexity using the following FAKE
    version." Lemma 4 then shows d_F <= d'_F, so the fake version is a valid
    upper bound and the misunderstanding is safe in the direction people use it.
    This program measures a first-fall-degree quantity in GOAL-DREG-001 and cites
    Semaev's Assumption 1 throughout GOAL-SEMBIN-5078bc; which of the two
    definitions each of those refers to is now a checkable question and has not
    been checked.
what_this_freeze_does_not_assert: >-
  Nothing about whether Theorem 1 is true. The freeze establishes only that these
  bytes are what eprint.iacr.org served and that the text file is a mechanical
  extraction of them. Proposition 5 is unproven in the source; the first fall
  degree assumption is an assumption in the source; and no measurement of any
  kind appears in the source. Any concrete cost this program attaches to
  Theorem 1 is this program's arithmetic, computed under stated conventions, and
  must be attributed here rather than to Nagao.
