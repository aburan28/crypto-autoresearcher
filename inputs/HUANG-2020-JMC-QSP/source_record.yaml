what_the_paper_claims:
  headline: >-
    A factor base F = {(x, y) in E(F_{q^n}) : x^{q^{n'}} = lambda(x)} built from
    the roots of a "quasi-subfield polynomial" L = X^{q^{n'}} - lambda(X) that
    splits completely with deg lambda small yields an index-calculus algorithm
    whose relation-search system is m sparse equations in m variables solvable
    by Rojas' sparse resultant method (Lemma 3.1, Theorem 3.2). With l =
    log_q(deg lambda) < n'^2 / n (Definition 3.1) the algorithm beats exhaustive
    search; Remark 3.1 evaluates the exponent as 1 - alpha + 4.876 alpha^2 with
    minimum about 0.95, i.e. O~(q^{0.95 n}), and notes that beating generic
    O(q^{n/2}) needs deg lambda below q^{0.102 n / m^2}.
  existence_results: >-
    Lemma 4.1: if L divides X^{q^n} - X and l > 0 then floor(n/n') * l +
    (n mod n') >= n'. Lemma 4.2 counts n'-dimensional subspaces; the heuristic
    in Section 4.2 predicts about q^{n l - n'^2} linearized quasi-subfield
    polynomials, hence none when l << n'^2/n. Lemma 4.3 gives the one explicit
    infinite family, n = p_{k+1} = 1 + q' + ... + q'^{k+1}, with n = 1 mod n' --
    "the worst case scenario of Lemma 4.1". Appendix C.1 argues (heuristically)
    that Mersenne-prime n cannot help; Appendix C.2 treats multiplicative
    subgroups V = {0} U mu_r, r | q^n - 1, with the same negative expectation.
  self_declared_limits:
    - Section 3.1 assumes the relaxed system S is zero-dimensional (Appendix B argues plausibility, not proof).
    - Section 2.2 and 3.2 assume |F| ~ |V| ~ q^{n'} and the m!-decomposition heuristic.
    - Section 5 leaves open whether Lemma 4.1 is tight and whether any quasi-subfield polynomial beats generic algorithms; it names rational lambda, isogeny L, and large-prime variants as untried generalisations.
