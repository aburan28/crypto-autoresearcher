why_frozen: >-
  The corpus already carries a heavily worked frozen source for ONE challenge,
  ECC2K-130 (inputs/BAILEY-2009-541-ECC2K130, GOAL-ECDLP2M-001's QSP lane), but no
  normative source for the challenge SET, and no record of the one structural fact
  that governs index calculus on all of them: every binary challenge field degree is
  prime. RQ-CERTBIN-836ce2 is posed on this family as the complement to
  RQ-OAKLEY-264353's composite-degree pair.

