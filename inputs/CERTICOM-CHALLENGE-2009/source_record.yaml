      - {challenge: ECC2-163,  field_bits: 163, koblitz: false}
      - {challenge: ECC2-191,  field_bits: 191, koblitz: false}
      - {challenge: ECC2K-238, field_bits: 239, koblitz: true}
      - {challenge: ECC2-238,  field_bits: 239, koblitz: false}
      - {challenge: ECC2K-358, field_bits: 359, koblitz: true}
      - {challenge: ECC2-353,  field_bits: 359, koblitz: false}
    koblitz_note: >-
      The ECC2K names denote Koblitz curves (coefficients in F_2) per the document's
      section 3; the ECC2 names denote random curves. Read from the document's
      naming convention, not re-derived from parameters, which this record does not
      freeze.
  every_field_degree_is_prime:
    computed: 'all of 109, 131, 163, 191, 239, 359 are prime (trial division, this session)'
    consequence: >-
      F_{2^m} has NO proper subfield other than F_2 for any Certicom binary
      challenge. An index-calculus factor base on these curves cannot be "points
      with x in a subfield"; it must be "points with x in a chosen F_2-linear
      subspace V of dimension l < m", and the choice of V is a free parameter of the
      attack. This is the exact opposite of RFC 2409's Oakley groups (155 = 5*31,
      185 = 5*37), where the subfield factor base is canonical and GHS descent
      applies.
    the_document_says_why: >-
      Section 11, "Curves defined over F2m, m composite", cites Frey, Galbraith-
      Smart and Gaudry-Hess-Smart on Weil descent for composite m. Prime m was a
      design choice against exactly that attack.
  what_is_NOT_verified_here: >-
    No curve coefficient, base point, or group order is frozen or checked in this
    package; those live in the per-challenge parameter files and, for ECC2K-130, in
    the Bailey et al. source already frozen. Nothing here bears on the feasibility
    of any attack, and "263" -- the number the user mentioned -- does not
    correspond to any challenge in this document; the nearest are ECC2-238 /
    ECC2K-238 at 239 bits.

