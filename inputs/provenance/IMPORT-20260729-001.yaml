    live_ecdlp_gates_touched: none
    live_ecdlp_gates_checked: [RT-1476-SUBRES-A1, RT-1472-CYCLEMAT-A2, ISOWALK-C1]
  scope_and_authority:
    is_a_native_ledger_record: false
    statement: >-
      inputs/ holds SOURCE MATERIAL, not native records. Nothing in this file is
      evidence under this repository's rules until a Coordinator promotes it
      through the normal path with its own record and independent review. This
      import creates no RQ, H, EXP, EV, DEC or KN record, changes no status, and
