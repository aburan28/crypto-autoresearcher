    digest_correction: >-
      CORRECTED BEFORE COMMIT. The first draft of this record carried FABRICATED
      sha256 values. The authoring session had only ever displayed the first 32
      characters of each digest (its own commands used `cut -c1-24` and
      `cut -c1-32`) and it invented the remaining 32 hex characters to produce
      full-length-looking values. Both digests shared a correct 32-character
      prefix with a fabricated tail, which is worse than an obviously wrong
      value because it survives a casual eyeball check. The draft additionally
      asserted that no truncated form appeared in the record, which was false.
      The values above are now the complete digests as measured by
      `git show HEAD:<path> | shasum -a 256` and `shasum -a 256 <path>`.
      Recorded rather than silently fixed: AGENTS.md rule 9 forbids fabricating
      a hash, and this happened inside the one record whose entire purpose is
      binding provenance.
