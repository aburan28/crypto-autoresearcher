  new_frontier_identifiers:
    - id: P1486-SUPPORT-002
      state: open
      summary: >-
        Can Phi_n(j(E),j(E)^p)=0 be decided for selected factored smooth n by a
        curve-only circuit costing o(sqrt(n)), or many such decisions batched
        below Wesolowski's p^(1/3+o(1)) half-list cost, without expanding Phi_n,
        enumerating all kernels, or recovering End(E)?
    - id: P1486-MIDPOINT-002
      state: closed_negative
      summary: >-
        Ordinary conditioned smoothness does NOT make the squarefree center
        small: E[log(n/sf(n))] = O(1) as alpha->1, so sf(n)=X^(1-o(1)), and the
        exact 40-88 bit sweep fails its decreasing-center gate. Route reopens
        only via an explicit even-valuation bias or a sublinear central-support
        algorithm.
    - id: P1486-QCLAW-001
      state: open
      summary: >-
        Does Tani claw finding on Wesolowski's two p^(1/3+o(1)) aggregate
        Frobenius half-path functions give a heuristic p^(2/9+o(1)) quantum-query
        algorithm, with reversible padded-domain evaluation, path recovery,
        downstream reduction, and qRAM/gate costs fully charged?
  relevance_to_this_repo:
