what_was_read: >-
  Sections 1-2 (background, birthday bound), 3 (why direct parallelisation is
  inefficient, DES example), 4.1 (distinguished-point parallel collision search
  and its run-time analysis, eq. (3)), 4.2 (many-collision regime; nθ/w + 2/θ
  per collision), 5.1 (discrete logarithms; eq. (5) T_rho = (sqrt(pi p / 2)/m +
  1/θ) t; parallel lambda), 6 and 6.1 (machine design for GF(2^155): costs u, v,
  t; triple = 46 bytes; constraint mu + wv = B; optimum θ = 0.93 x 2^-32,
  m = 2.5 x 10^7, w = 3.8 x 10^8, 32 days), Appendix A (Lemma 1 E(X) ~ sqrt(pi n /
  2); Lemma 2 memory-limited E(Y) = sum_{k<z} e^{-k^2/2n} + (n/z) e^{-z^2/2n}),
  Appendix B (expected max of two geometrics = 1.5/p). Sections 5.2-5.3 and 6.2-6.3
  (hash collisions, MITM, MD5 and double-DES machines) were skimmed only.
