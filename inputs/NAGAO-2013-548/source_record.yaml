  corroboration:
    - >-
      THE PAPER DOES NOT CLAIM THE DISJOINT FACTOR BASE AS ITS OWN. Section 7
      (page 4) opens by crediting Diem [2] (2009, the "Diem-variant") and then
      Matsuo: "In 2005 or 2006, soon after the Semaev's formula is discoverd,
      Matsuo also found the simmilar and more general way of taking decomposed
      factor (for exapmle distinct or non-equal size decomposed factor)." Page 5
      then states this paper's own contribution as a generalisation, not an
      invention: "Here, we propose the way of taking decomposed factor of
      Jacobian of the curve, which is the generalization of Matsuo's decomposed
      factor." So on the source's own account the construction predates it. The
      Matsuo attribution is to unpublished, unpresented work -- "it it not
      presented and only the researchers around him knows this" (page 5) -- and
      is therefore not checkable from any frozen artifact.
    - >-
      IT IS THE COMPANION OF 2013/549, NOT AN INDEPENDENT SOURCE. Both were
      received 2013-09-04, both are self-described joint work with Matsuo and
      Takagi, both carry a "6 Nov" revision note retracting a numbered result,
      and each cites the other. 2013/549 cites this one as its [6] for the
      Jacobian decomposition formula; this one's [6] is Nagao's ANTS-IX 2010
      paper. Read together they are one author's programme at one moment, so
      agreement between them corroborates nothing.
    - >-
      ITS OWN DLP PROPOSITION IS IN A DIFFERENT PARAMETER REGIME FROM 2015/984's
      THEOREM 1. Proposition 5 (page 5) is restricted to "extension field F_{p^n}
      satisfying log p = O((ng)^2)" -- the large-characteristic Diem regime --
      whereas 2015/984's Theorem 1 is a small-characteristic claim whose headline
      case is F_{2^n}. The coset construction is shared; the complexity
      conclusion built on it here is not the conclusion 2015/984 draws.
what_the_paper_claims:
  headline: >-
    An algorithm for decomposing a given element of the Jacobian group of a plane
    curve of small genus g into a sum of points of a "decomposed factor", derived
    by a Riemann-Roch space construction, presented as a generalisation of
    Semaev's summation-polynomial formula (Abstract and Section 1, page 1). The
    only complexity statement is Proposition 5 (page 5): JACDLP for such a curve
    over F_{p^n} with log p = O((ng)^2) has subexponential complexity in the input
    size N = ng log p.
  the_construction_the_2015_paper_credits: >-
    SECTION 7, "Decomposed factor", pages 4-5. Fix a base [w_1, ..., w_n] of
    F_{p^n}/F_p and positive integers n_1, ..., n_d with n_1 + ... + n_d ~ ng. Put
    B'_i := {sum_j x_{i,j} w_j | x_{i,j} in F_p} (the extraction prints the
    summation upper limit as "n_j", evidently for n_i), let r_1, ..., r_d be
    elements of F_{p^n}, and take the decomposed factor B_i := {P - infinity in
    Jac(C/F_{p^n}) | P in C(F_{p^n}), exists x in B'_i such that x(P) = x + r_i}.
    Footnote 3 on page 5 supplies the disjointness recipe: "Take r_{i+1} in
    F_{p^n} \ union_{j=1}^i B'_j and disjoint decomposed factor is constracted."
  the_yield_statement: >-
    Page 5, immediately after the construction: "Note that B_i's are essentially
    disjoint, |B_i| ~ p^{n_i}, and the probability that the decomposition success
    is O(p^{n_1+...+n_d-ng}) ~ 1. From the disjointness, it is improved that the
    term of 1/d! in the probability is omitted. (Remark that it is needed to
    compute gaussian elimination of d-times size matrix in the last step.)" Both
    halves of the accounting -- the removed 1/d! and the d-times larger
    linear-algebra step -- are stated here.
  self_declared_limits:
    - The PDF's title line ends "(Draft)".
    - >-
      Page 1, "revise 6 Nov": the first version's Proposition 3 "is not true and
      this thechnique can not be used", Section 4 is rewritten, and the
      replacement is weaker -- "however, the number of the equations is quite
      large".
    - >-
      A statement numbered Proposition 3 is STILL PRINTED in the frozen last
      revision, on page 3 in Section 5. Whether it is the retracted statement,
      a renumbered survivor, or a new statement cannot be determined from these
      bytes, because the first version is not frozen.
    - >-
      Page 3, footnote 2, on the resultant argument: "We do not use homogenious
      polynomial system and projective variety. So, there is some gap. However,
      it seems to negligible and continue the discussion."
    - >-
      Page 5, the proof of Proposition 5 -- the paper's only complexity claim --
      cites "Proposition ??" TWICE, i.e. two unresolved LaTeX cross-references.
      The two propositions the proof depends on are therefore not named anywhere
      in the frozen bytes.
    - >-
      Page 1, Section 1, on the subexponential ECDLP results it builds upon:
      "These arguments seems to have some gaps, but, any way, there is some
      posibility that ECDLP is subexponential."
what_this_freeze_does_not_assert: >-
  Anything about who invented the disjoint or coset-shifted factor base. The
  freeze establishes only that these bytes are what eprint.iacr.org served at the
  recorded time and that paper_fulltext.md is a mechanical extraction of them.
  Two earlier revisions exist and are not obtainable here; Galbraith and
  Gebregiyorgis ePrint 2014/806 is not frozen anywhere in this repository and has
  not been opened by any agent in this program, so nothing here supports or
  refutes 2015/984's assertion that it "re-discovered" the construction; and the
  Matsuo attribution on page 5 is to unpublished work that no artifact can
  confirm. What the reading did and did not establish is recorded in
  KN-LIT-ebd657 and DEC-20260913-8d19e5, not here.
