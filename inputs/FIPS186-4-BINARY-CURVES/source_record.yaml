why_frozen: >-
  The corpus cites the NIST binary curves by name over a hundred times (K-409 and
  K-571 most, via the SEMBIN cost audit) but holds no normative source for their
  parameters, and no record of the structural fact this program's index-calculus
  campaigns turn on: every field degree is prime. RQ-NISTBIN-06157b is posed on
  this family as the standardised, deployed member of the no-subfield class that
  RQ-CERTBIN-836ce2 poses on the challenge family.

verified_facts:
  family_shape_from_D_1_3: >-
    For each degree m a pseudo-random curve B-m: y^2 + xy = x^3 + x^2 + b (a = 1,
    cofactor h = 2), and a Koblitz curve K-m: y^2 + xy = x^3 + a x^2 + 1 with
    a in {0, 1} (h = 2 if a = 1, h = 4 if a = 0). Read from the appendix preamble.
  field_polynomials_read_from_D_1_3_1_through_D_1_3_5:
    - {m: 163, polynomial: 't^163 + t^7 + t^6 + t^3 + 1', kind: pentanomial}
    - {m: 233, polynomial: 't^233 + t^74 + 1',            kind: trinomial}
    - {m: 283, polynomial: 't^283 + t^12 + t^7 + t^5 + 1', kind: pentanomial}
    - {m: 409, polynomial: 't^409 + t^87 + 1',            kind: trinomial}
    - {m: 571, polynomial: 't^571 + t^10 + t^5 + t^2 + 1', kind: pentanomial}
  koblitz_coefficient_a:
    K-163: 1
    K-233: 0
    K-283: 0
    K-409: 0
    K-571: 0
  every_field_degree_is_prime:
    computed: 'all of 163, 233, 283, 409, 571 are prime (trial division, this session)'
    consequence: >-
      No proper subfield other than F_2 exists for any NIST binary curve. As for
      the Certicom binary challenges, an index-calculus factor base here cannot be
      "points with x in a subfield" and must be "points with x in a chosen
      F_2-linear subspace V"; the choice of V is a free parameter of the attack.
      Unlike the challenges, these curves reach m = 409 and 571, so this family is
      where "index calculus at larger sizes" has its standardised instances.
  what_is_NOT_verified_here: >-
    The B-curve coefficients b, the base points, and the group orders are present
    in the frozen text but are NOT re-derived or checked in this package; a
    contract that uses a specific curve must verify the parameters it uses, as
    inputs/RFC2409-OAKLEY-EC2N/verify_params.py does for the Oakley groups.
    Nothing here bears on the feasibility of any attack.

