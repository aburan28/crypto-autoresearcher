scope_of_assessment:
  - "Whether weakness maximisation (|Z_h|) is a better hypothesis-selection proxy than description length under a NON-uniform task distribution -- the paper's optimality result assumes a uniform distribution over Gamma_v (Definition 4), which is the assumption least likely to hold for this program's cryptanalytic hypothesis space. Open problem KN-OPEN-875d43."
  - "Whether the enactive formalism (Definitions 1-3) can represent this program's hypotheses at all, i.e. whether |Z_h| is computable or even well defined for a hypothesis such as 'index-calculus relation search over curve family F has cost exponent e'."
