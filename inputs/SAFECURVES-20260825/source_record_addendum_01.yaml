  base_commit: 2251ae8ada4206e5e3890c542f1b159c52025cbe
  supersedes_nothing: 'This addendum ADDS files and RECORDS a defect. No file listed in source_record.yaml
    was edited, moved or rehashed: producer dossiers already cite those sha256 values and those citations
    remain valid.'
  defect:
    id: MIRROR-DEF-1
    severity: material for any table-valued reading
    affects: inputs/SAFECURVES-20260825/pages/*.txt (the tag-stripped text renderings)
    does_not_affect: inputs/SAFECURVES-20260825/pages/*.html and specs/* (raw bytes, unchanged)
    found_by: two independent producer tasks, TASK-20260824-7bc23f (E-222) and TASK-20260824-818c65
      (M-383), each of which went to the raw HTML rather than trusting the derived text
    description: The .txt renderings are produced by stripping tags and normalizing whitespace. That
      collapses EMPTY table cells and blurs row boundaries, so a comment belonging to one table row
      can appear adjacent to a DIFFERENT row and be misread as belonging to it.
    confirmed_instance: pages/rigid.html row for M-383 is "<td><p> M-383 </p></td> <td><p> fully rigid
      </p></td> <td><p> </p></td>" -- its comments cell is EMPTY. The adjacent Curve383187 row carries
      "p is largest prime smaller than 2^383; B=1; A > 2 is as small as possible." In pages/rigid.txt
      that transcript can appear to attach to M-383. Attributing it to M-383 would be a false statement
      about which curve has a published generation recipe.
    remedy: 'Added inputs/SAFECURVES-20260825/tables/*.tsv: one row per line, cells tab-separated, empty
      cells preserved as empty fields, one file per source page. FOR ANY TABLE-VALUED READING (criterion
      cells, comments, per-curve rows) USE tables/*.tsv OR pages/*.html, NEVER pages/*.txt.'
    authority_order: pages/*.html and specs/*.pdf are authoritative; tables/*.tsv next; pages/*.txt
      last, prose only.
