source_record:
  id: SAFECURVES-20260825
  staged_at: '2026-08-25T05:05:58+00:00'
  staged_by: top-level orchestration session (research harness), not a research role
  base_commit_at_staging: 627c092d7ba78d32c0a3e128584d5c9a9e5f7da7
  purpose: 'Local, hash-pinned mirror of the sources that GOAL-SCURVE-* producer handoffs require but
    that no idea-generator in this environment can retrieve. This is an infrastructure remedy, not research:
    it stages primary text and makes no claim about any curve.'
  why_staged:
    observed: Every GOAL-SCURVE-* producer handoff mandates retrieving safecurves.cr.yp.to. Three independent
      producers reported HTTP 502 from every URL on that host, including the bare host, and correctly
      recorded the sources as unretrieved rather than paraphrasing them.
    diagnosed_here: The WebFetch tool path returns 502 for https://safecurves.cr.yp.to/rho.html while
      curl to the same URL in the same container returns 200 with 11979 bytes. The host is reachable;
      the WebFetch path is not. The idea-generator role contract grants Read/Grep/Glob/Write/WebSearch/WebFetch
      and NO Bash, so no producer in this campaign can reach these sources by any route available to it.
    remedy: Stage the documents locally so producers can Read them, with per-file provenance and hashes
      so a reader can distinguish staged primary text from recollection.
    not_a_remedy_for: This does not retroactively source the three producer dossiers already completed
      against the 502. Those record their sources as unretrieved and that record stands; re-sourcing them
      requires a successor task.
  unavailable:
  - url: https://bada55.cr.yp.to/nist.html
    http_status: 404
    note: Returned a 47-byte "file does not exist" body. NOT staged. Recorded here so its absence is visible
      rather than inferred from a missing file.
  extraction_fidelity:
    pages/*.txt: Faithful. Nav boilerplate precedes body text on every page; body text verified present
      (rho.txt carries "SafeCurves requires l to be at least 2^200").
    specs/sec2-v1.txt, specs/sec2-v2.txt: LOSSY. Inter-word spaces are absent (kerning is carried in TJ
      arrays that this extractor discards) and f-ligatures are dropped ("identified" reads "identied").
      Hex and decimal parameter digits are intact and are the reason these files are staged. Do not quote
      prose from them.
    specs/fips186-5.txt, specs/sp800-186.txt: Word spacing preserved; line breaks follow the PDF layout
      and can split a token across lines. Verify any digit string against the PDF.
    binding: The .pdf and .html files are the authority. A .txt file is a derived convenience; where they
      disagree the source file wins.
  usage_rules:
  - A document staged here is RETRIEVED PRIMARY TEXT and may be cited with provenance "retrieved (staged
    mirror SAFECURVES-20260825)" plus this record id and the file sha256.
  - It is NOT a substitute for the SafeCurves intake table, which remains user_supplied_unverified and
    a comparison target only.
  - Staging changes no criterion verdict. Reading a threshold here permits ADJUDICATION that was previously
    blocked; it asserts nothing about any curve.
  - Never cite a file that is not listed below, and never cite a .txt where the fidelity note above says
    the prose is lossy.
