  license: ePrint terms; PDF and extraction vendored with attribution.
  what_the_paper_claims:
    headline: >-
      A variation of Gaudry/Diem index calculus for E(F_{q^n}) that improves
      asymptotic complexity when log q ≤ c n^3; obtains relations on E(F_{p^5});
      introduces an F4 variant that removes reductions to zero; applies the
      method to an oracle-assisted elliptic-curve static Diffie-Hellman instance
      over a ~130-bit field faster than birthday DLP on the same curve.
    methods_relevant_to_gfpn: >-
      (n-1)-point decomposition via summation polynomials; elementary-symmetric
      symmetrization; F4-remake for relation search; explicit E(F_{p^5})
      relation examples that GFPN reuses as the m=4 fallback observable when
      m=5 FGLM times out.
    self_declared_limits: >-
      Asymptotic statements under stated regimes; concrete timings are for the
      paper's parameter choices, not for EcGFp5/EcMasFp5 at p = 2^64 − 2^32 + 1.
  what_this_freeze_does_not_assert: >-
    Nothing about EcGFp5 or EcMasFp5 security floors. Nothing about measured
    ideal degree D under (Z/2)^4 ⋊ S_5 symmetrization. OA-SDH cost numbers for
    the Goldilocks quintic remain a separate GFPN experiment
    (IDEA-20260920-73dc35), not discharged by this freeze alone.
