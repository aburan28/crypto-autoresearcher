scope_of_assessment:
  - >-
    Whether the truncated l-adic period map Pi_m, which section 5.2 and section
    6.3 state is Z-linear with matrix form A x = y mod l^m, places MSI in a
    lattice regime whose cost is governed by the rank r = 2g + (c - 1) of
    Proposition 3 rather than by the path count B^L of section 7.3.
  - >-
    Section 6.4's declared-unknown: the effectiveness of lattice reduction
    followed by rounding to valid paths, against the combinatorial path
    constraint gamma in W_L of Definitions 8 and 9.
  - >-
    Section 7.1's identification protocol, whose reduction procedure ensuring
    gamma_resp lands in W_{L-prime} is left unspecified, and the transcript
    leakage that absence admits.
  - >-
    Whether any reduction exists between MSI and the isogeny path problems of
    KN-OPEN-013, which section 6.3 states is not currently known in either
    direction.
