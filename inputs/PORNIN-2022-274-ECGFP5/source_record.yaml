  what_the_paper_claims:
    headline: >-
      Defines EcGFp5 over GF(p^5) with p = 2^64 - 2^32 + 1 and modulus z^5 - 2,
      as a double-odd / n-torsion-complement group of prime order designed for
      Miden-like compute models (unit-cost GF(p) ops including division).
    security_arithmetic: >-
      Section on extension-field ECDLP cites Diem (GHS in odd characteristic)
      recommending prime extension degree, and Gaudry's index-calculus attack.
      With k = 5, Gaudry's attack is costed at a total theoretical complexity
      of at least 2^142, stated as well beyond the target 128-bit level.
    self_declared_limits: >-
      Security claims are theoretical cost lower bounds against named classical
      attacks (Gaudry, transfer/embedding-degree checks), not measured PDP
      costs and not an oracle-assisted static-DH analysis.
  what_this_freeze_does_not_assert: >-
    Nothing about EcMasFp5, nothing about measured solver costs, and nothing
    about oracle-assisted static Diffie-Hellman. Numbers appearing in GFPN
    idea records that are not quoted from this PDF remain provisional until
    their own sources are frozen and re-derived.
