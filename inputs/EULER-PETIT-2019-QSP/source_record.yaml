what_the_paper_claims:
  headline: >-
    Theorem 1: every linearized polynomial X^{p^{n'}} - (a_l X^{p^l} + ... +
    a_0 X), l >= 1, that splits completely over F_{p^n} has quality
    beta := l n / n'^2 >= 3/4 (via Lemma 2: n >= n' + (n' - l) floor((n'-1)/l)).
    Proposition 7 rewrites Huang et al.'s Theorem 3.2 as
    O~(m! p^{n(1 + kappa beta (n'm/n)^2 - n'm/n) + n'} m^{5.188} 3^{kappa m^2} + m p^{2n'});
    Proposition 8 optimises alpha = n'm/n at alpha_beta = 1/(2 kappa beta), giving
    O~(p^{(1 - alpha_beta/2) n}) for m >> 1, and Remark 1 concludes generic
    algorithms are beaten only for beta < 0.103 at kappa = 4.876. Section 4.4:
    linearized QSPs therefore cannot beat generic algorithms; the best QSP found
    anywhere has beta ~ 0.70 (X^8 - X^3 over F_{2^4}, multiplicative).
  new_families: >-
    Proposition 5 (linearized): Type 1 (Huang et al.), Type 1bis (n' = n - 1,
    beta = 1 - 1/(n-1)^2, exists for every n), Type 2 (n = q^{d+1} - 1), Type 3
    (inverses, Proposition 3). Proposition 6 (multiplicative X^{p^{n'}} - X^a):
    three families needing n even, or p = kn + k - 1, or p = kn - k - (-1)^n.
    Section 3.4 shows Type 2 refutes Huang et al.'s Mersenne-prime heuristic.
  self_declared_limits:
    - Section 5 leaves the classification of all QSPs open and notes the algorithm remains outperformed with every family found.
    - >-
      Section 4.4 states that kappa < 1.5 would give alpha_beta > 1 at beta = 3/4;
      from Proposition 8's alpha_beta = 1/(2 kappa beta) that needs kappa < 2/3.
      Recorded as a discrepancy in the source, not adjudicated here.
