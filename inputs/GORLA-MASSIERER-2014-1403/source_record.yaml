  what_the_paper_claims:
    headline: >-
      Derives a new F_q-equation for the rational points of the trace-zero
      variety of an elliptic curve over F_{q^n} via Semaev summation
      polynomials; produces an optimal-size representation compatible with
      scalar multiplication; gives compression/decompression algorithms
      efficient for small extension degrees, with explicit cubic and quintic
      cases.
    relevance_to_gfpn: >-
      Quintic (n=5) case and the remark that some F_{q^5} curves transfer into
      genus-5 Picard groups motivate the separate odd-characteristic cover
      audit (IDEA-20260920-10547b). Trace-zero compression itself is out of
      scope for EcGFp5/EcMasFp5 (neither curve is a subfield/trace-zero
      subgroup of a larger ambient curve under GOAL-GFPN-380702
      scope_exclusions).
  what_this_freeze_does_not_assert: >-
    No claim that EcGFp5 or EcMasFp5 admit a cheap GHS/cover transfer. No
    measured cover genus for those named curves. Cover applicability remains
    IDEA-20260920-10547b / C3 on GOAL-GFPN-380702.
