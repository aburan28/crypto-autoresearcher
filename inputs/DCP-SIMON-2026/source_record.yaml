scope_of_assessment:
  - >-
    Correctness of step 4 (Hadamard-and-measure erasure of the b_i) and of
    Lemma 1: does the claimed constant probability of collecting a = n/log n
    all-zero groups survive the conditioning the rest of the proof imposes?
  - >-
    Correctness of Lemma 3 and its corollary: the "well-behaved" amplitude
    bound is the load-bearing no-catastrophic-cancellation assumption, its
    proof is a sketch, and the corollary asserts the rescaled version (n in
    place of 2^n) by analogy rather than re-deriving it.
  - >-
    Correctness of Lemma 4 and the final amplitude accounting, including the
    n versus n^{3/2} discrepancy between the corollary's bound and its use.
  - >-
    Whether the recursion from d_n to the remaining bits of d goes through
    under the new erasure technique; the theorem proves only the last bit.
  - >-
    What the claimed LWE parameter "alpha = sqrt(n) polylog(n)" denotes, given
    that alpha is conventionally a noise-to-modulus ratio below 1.
  - >-
    Whether, if the result stands, it reaches the concrete MODULE-LWE
    parameters of ML-KEM / ML-DSA, or only unstructured LWE / SVP.
