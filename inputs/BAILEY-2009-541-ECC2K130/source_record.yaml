reproducibility:
  artifact_frozen_in_repo: true
  limitation: >-
    The progress figures rest on 16 bytes per report (paper Appendix C) and on
    reading the graph's last point by eye; tallies.py re-derives every number
    and brackets the eye reading. No per-seed data was ever published, so
    nothing beyond the aggregates can be checked.
what_was_read: >-
  Paper: Section 1 (challenge, expected work), Section 3 (iteration function,
  seed-to-start-point derivation, distinguished-point definition, normalization,
  16-byte (s, h) reports, benefits of recomputation), Section 9 and Appendix C
  (eight central servers, 8192 files, in-RAM sort, re-walk of colliding seeds,
  ECC2K-95 end-to-end test), Appendix D (UDP/NaCl transfer protocol). Platform
  sections 4-8 skimmed only. Talk decks: the "Running the attack" and "Reports
  so far" slides. Status page: full text and the graph.
