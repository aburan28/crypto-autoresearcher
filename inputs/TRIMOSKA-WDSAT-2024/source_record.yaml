title: WDSat -- a SAT solver dedicated to instances derived from a Weil descent
author: Monika Trimoska (with Sorina Ionica and Gilles Dequen, per the README)
kind_of_source: software repository (C source), not a paper
identifiers:
  url: https://github.com/mtrimoska/WDSat
  git_commit: 61c6ff3f49445af2729274819edb27b85a89efc1
  git_commit_date: '2024-06-20T15:59:48+02:00'
  paper: arXiv:2001.11229 (KN-LIT-102cdb), CP 2020
license: GPL-3.0 (upstream LICENSE file, vendored verbatim)
what_it_is: >-
  The solver whose reported 300x-over-Magma-F4 advantage on the binary-curve
  point-decomposition problem is frozen as a claim (C6) in SRC-SATIC-TRIMOSKA-2019
  and has never been run in this program. DPLL over CNF / XORSET / XORGAUSS modules
  with static allocation; reads CNF, CNF-XOR and ANF. Compile-time constants in
  `src/config.h` size the static arrays; the shipped configuration is the
  "IC-S4: l=6" block (MAX_ANF_ID 52, MAX_ID 767, MAX_XEQ 52), which fits the l<=6
  cells of SRC-ICPERF-TRIMOSKA-ECICB-2024 and must be re-sized for any larger cell.
  Command line: `-i file`, `-x` (Gaussian elimination), `-g v1,v2,...` (static
  branching order).
vendored:
  path: inputs/TRIMOSKA-WDSAT-2024/upstream/
  policy: >-
    README, LICENSE, and the complete `src/` (14 C/H files and the makefile).
    EXCLUDED: the 50 shipped `benchmarks/IC_S4/*.anf` files (byte-identical to
    files vendored under SRC-ICPERF-TRIMOSKA-ECICB-2024), the 34 `benchmarks/MQ/*`
    instances (out of scope), and the prebuilt `wdsat_solver` binary (a binary is
    not a source; the experiment rebuilds from the vendored source and records the
    compiler). Every excluded file is hashed in UPSTREAM_SHA256SUMS.txt.
  manifest_of_vendored_files: inputs/TRIMOSKA-WDSAT-2024/VENDORED_SHA256.json
  manifest_of_full_upstream_tree: inputs/TRIMOSKA-WDSAT-2024/UPSTREAM_SHA256SUMS.txt
  vendored_file_count: 17
provenance:
  acquisition: >-
    `git clone --depth 1 https://github.com/mtrimoska/WDSat` at approximately
    2026-09-13T21:18Z from the top-level Coordinator session; HEAD
    61c6ff3f49445af2729274819edb27b85a89efc1. The tree was built once in place
    (`make` in src/), which overwrote the shipped binary; the binary was restored
    with `git checkout` before UPSTREAM_SHA256SUMS.txt was taken, so that manifest
    hashes the upstream bytes.
  build_check:
    performed: true
    result: >-
      `make` in `src/` with the system gcc produced `wdsat_solver` with one unused-
      variable warning and no error. Run on six instances of the benchmark set (see
      the smoke block of SRC-ICPERF-TRIMOSKA-ECICB-2024); the solution line printed
      for Xn19l6-1-S begins 000010 001011 010010, which equals the certificate
      X1-X2-X3 recorded in INFOn19l6-1-S.dimacs.
  not_verified:
    - >-
      No reported timing of any Trimoska publication is reproduced by this record;
      the smoke runs are single uncontrolled executions on a different machine.
    - >-
      Correctness of an UNSAT answer is not certified by the solver; UNSAT results
      are treated as solver reports until an independent engine agrees.
    - >-
      The output format is not documented in the README and was read from
      `src/wdsat.c` by the Coordinator: on UNSAT the solver prints `UNSAT` then
      `conf[0]` (lines 535 and 539 at this commit); on SAT it prints the assignment
      bit-string then `conf[0]`. `conf[0]` is the solver's conflict counter. The
      shipped prebuilt binary also prints a `__MAX_ID__` sizing warning on the n15l5
      cell ("Set the __MAX_ID__ constant to 502"), so the experiment rebuilds the
      solver per cell with the constant the solver itself reports and records the
      value used.
