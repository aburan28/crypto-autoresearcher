# ---------------------------------------------------------------------------
# Arithmetic re-derived in the freezing session, from the paper's own stated
# formulas and parameters and nothing else. This checks that the paper is
# INTERNALLY CONSISTENT. It is not evidence that Assumption 1 holds, that the
# cost model is the right one, or that any FIPS curve is weakened.
# ---------------------------------------------------------------------------
derived_checks:
  section_4_3_probability_model:
    recovered_formula: 'P(n, m, t, k) = 1 - exp(-2^(t*k - n) / t!)'
    method: >-
      eq. (11) with q = 2^n and |V| = 2^k, i.e. P = 1 - (1 - 1/q)^K for
      K ~ |V|^t / t!, evaluated in the exponential limit.
    agreement: >-
      Reproduces every P_theoretical cell of Tables 1 and 2 to the 4 decimals
      printed (8 cells spot-checked across the (n, m, t, k) range: n=12 m=6 t=6
      k=2; n=13 m=4 t=4 k=4; n=15 m=4 t=3 k=4; n=15 m=5 t=2 k=3; n=17 m=3 t=3
      k=6; n=19 m=3 t=3 k=7; n=21 m=3 t=3 k=7; n=40 m=2 t=2 k=20).
    significance_for_this_program: >-
      This is the closed form behind the reference curve that experiments and
      protocols in GOAL-RELN-001 cite as "HEUR-SEMAEV-2015-4.3" (see
      experiments/EXP-RELN-164ad3/specification.yaml and H-RELN-cfa1a2). Until
      this freeze, that curve was cited from a paper recorded as not read
      (KN-LIT-009). The formula those records assume is now confirmed against
      the source; whether it is CORRECT is a separate question, and this
      program's own H-RELN-96e3ba already reports a 2^m-type discrepancy
      against an exact law at m = 2.
  table_3_columns:
    agreement: >-
      All 36 numeric cells of Table 3 reproduce from the stated formulas to
      within 0.7% (rounding of the printed 3-significant-figure values, plus
      the paper's use of a non-integer n/m in place of k = ceil(n/m) in the
      exponents).
    crossover: >-
      Minimising stage1 over m at each n, the first stage falls below 2^(n/2)
      at n = 302, not n = 310. The paper's stated threshold "n > 310" is
      therefore internally consistent and slightly CONSERVATIVE relative to its
      own formula; the FIPS n = 409 and n = 571 conclusions do not depend on
      this 8-unit difference.
  stage2_memory:
    status: NOT IN THE PAPER -- derived here from the paper's own parameters
    statement: >-
      Table 3 and eqs. (15)-(17) report time only. The second stage solves a
      linear system over a factor base of size |V| = 2^k, so it must hold
      Theta(2^k) relations, and the optimal m makes k = ceil(n/m) grow with n:
      2^31 relations at n = 310, 2^38 at n = 409, 2^48 at n = 571. Pollard rho
      at the same n needs negligible memory. The claim "performs better than
      Pollard's" is therefore a TIME-ONLY comparison between a
      constant-memory algorithm and one whose memory also grows exponentially.
    f4_working_set: >-
      Independently, each decomposition solves a Boolean system in
      N = (m-2)n + km variables at degree <= 4, giving 2^41.2 / 2^43.4 / 2^45.9
      degree-<=4 monomials at (n=310, m=10), (n=409, m=11), (n=571, m=12).
      Squaring the n=571 figure for a dense row-echelon form gives 2^91.8 bits,
      which independently recovers the "2^91 bits" figure that Galbraith's 2015
      ellipticnews post reports for exactly these parameters (KN-LIT-e77232),
      against Semaev's own sparse-storage estimate of 2^70 bits in the same
      thread. This program had that figure only as a third-party blog receipt;
      it is now re-derived from the frozen text.
    caveat: >-
      A memory figure is not by itself a refutation. Charging memory correctly
      requires a time-memory tradeoff comparison against parallel rho with
      distinguished points (van Oorschot-Wiener), which is the work assigned to
      EXP-SEMBIN-f4a17b, not a conclusion asserted here.
