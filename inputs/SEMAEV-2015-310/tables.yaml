# Row-wise transcription of Tables 1-3 of Semaev, "New algorithm for the
# discrete logarithm problem on elliptic curves", IACR ePrint 2015/310
# (revised 2015-04-10), frozen at inputs/SEMAEV-2015-310/eprint-2015-310.pdf.
#
# WHY THIS FILE EXISTS. pdfminer reflows these tables column-by-column, so
# paper_fulltext.md does not preserve which value belongs to which row. The rows
# below were read off the PDF and cross-checked against a second, independent
# extraction (pypdf, which happens to preserve row order and mangle the math)
# so that every cell is confirmed by two extractors. This is a TRANSCRIPTION of
# what the paper reports; it asserts nothing about whether those numbers are
# right, and no value here was measured by this program.
#
# These tables are the exact-baseline-reproduction target for any experiment in
# GOAL-SEMBIN-5078bc: Table 1 and Table 2 are the entire experimental basis of
# Assumption 1, and Table 3 is the entire basis of the "four FIPS curves are
# theoretically broken" claim.

schema: crypto.autoresearch.frozen_source_tables.v1
source_record_id: SRC-SEMAEV-2015-310
knowledge_record_id: KN-LIT-fa346d
transcribed_at: '2026-09-13'
transcribed_from:
  pdf_sha256: d6636436e2e9254d07e2270f61e6d1892de8d0d5f350a1c5232f60cafe39a7db
  cross_checked_with: >-
    second extraction of the same PDF with pypdf 6.x, which preserves row order;
    every cell below agrees between the two extractors
transcription_limits:
  - >-
    The paper prints probabilities to 2 decimals (experimental) and 4 decimals
    (theoretical); no error bars are given. Each experimental probability is an
    empirical frequency over 100 random z, so a reported 0.01 is one success in
    100 and carries roughly +/-1 count of Poisson noise -- a 0.00 cell is
    consistent with any true rate below about 0.03. Reproduction protocols must
    not treat these as tight point estimates.
  - >-
    Timings are MAGMA F4 on a 2.6 GHz Intel Core i7 with 16 GB DDR3 (Section
    4.5.1), and memory is the total over 100 systems, not per system. Neither is
    comparable to a modern open-source solver without a recalibration control.
  - >-
    Table 3 reports only time. The paper states no memory column anywhere in its
    asymptotic analysis; see the memory re-derivation in
    `derived_checks.stage2_memory` below and in KN-OPEN-86e7e1.

