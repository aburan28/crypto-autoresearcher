scope_of_assessment:
  - >-
    Sections 1-4.6, the References and the acknowledgement paragraph read in
    full. Tables 1-3 transcribed. No timing, memory figure, or step-degree value
    in the paper was independently reproduced: the paper's measurements are
    MAGMA F4 on a 2.6 GHz Intel Core i7 with 16 GB, the implementation was never
    published, and this program has no MAGMA licence. Reproducing Tables 1-2 on
    an open-source solver is assigned work (EXP-SEMBIN-c2c312), not something
    this record claims.
  - >-
    The re-derivation above establishes INTERNAL CONSISTENCY of the paper's
    arithmetic and nothing else. It is not evidence that Assumption 1 holds,
    that d_F4 <= d_ff for these systems, that the two-stage cost model is the
    right one, or that any FIPS curve is weakened. The paper's entire
    experimental support for Assumption 1 lies at n <= 21 with one cell at
    n = 40, and m <= 6, while the FIPS conclusion needs n = 409, 571 at
    m = 11, 12; that extrapolation is the paper's own stated risk and is the
    subject of GOAL-SEMBIN-5078bc.
  - >-
    Section 4.3's model is used in this program as the reference curve named
    HEUR-SEMAEV-2015-4.3 in already-frozen protocols (experiments/EXP-RELN-164ad3,
    H-RELN-cfa1a2, H-RELN-96e3ba, and the GOAL-RELN-001 and GOAL-ICEX-001
    BATCH-001 protocol notes). This freeze confirms the FORMULA those records
    assume against the source for the first time. It does not endorse it, and
    H-RELN-96e3ba already reports a 2^m-type discrepancy against an exact law at
    m = 2.
