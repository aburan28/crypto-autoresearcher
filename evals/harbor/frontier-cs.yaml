harbor_suite:
  name: frontier-cs-smoke
  description: >-
    External capability probe against Frontier-CS
    (https://github.com/FrontierCS/Frontier-CS), executed through Harbor.

    This suite exists because the internal suites under evals/suites/ are written
    by the same program they grade. They establish that an arm follows the
    protocol and does not fabricate; they cannot establish that it is any good at
    hard problems, because every answer they check is one this repository already
    knows. Frontier-CS problems are scored by a verifier written elsewhere.

    SCOPE: a score here is evidence about an (agent, model) arm and nothing else.
    It is NOT evidence about ECDLP, it does not promote a hypothesis, and it never
    enters ledger/. A perfect score on an algorithmic problem says nothing about
    the discrete logarithm problem.

    Problem ids below are placeholders pinned to the two examples the Frontier-CS
    README documents verbatim. Before trusting a number from this suite, run
    `frontier list <track>` and replace them with ids you have confirmed exist —
    an id that silently does not resolve is a failed trial, not a zero score.

  tasks:
    - id: fcs-algorithmic-0
      track: algorithmic
      problem: "0"
      agent: codex
      model: gpt-5.5
      policy: research-sol-max
      timeout_seconds: 3600
      split: dev
      tags: [external, algorithmic, smoke]

    - id: fcs-2.0-erdos-demo
      track: "2.0"
      problem: erdos_demo
      agent: codex
      model: gpt-5.5
      policy: research-sol-max
      timeout_seconds: 3600
      split: dev
      tags: [external, agent-native, iterative-feedback, smoke]

    # The 2.0 track accepts iterative `submit.sh` feedback during a trial and the
    # verifier keeps the better of the final and best interim submission, so it
    # exercises a different ability than the one-shot algorithmic track: whether
    # an arm improves when told it is wrong.
    - id: fcs-2.0-erdos-unit-distance
      track: "2.0"
      problem: erdos_unit_distance
      agent: codex
      model: gpt-5.5
      policy: research-sol-max
      timeout_seconds: 7200
      split: held_out
      tags: [external, agent-native, iterative-feedback]
