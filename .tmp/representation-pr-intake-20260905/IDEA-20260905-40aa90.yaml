idea:
  id: IDEA-20260905-40aa90
  question_id: RQ-ECDLP-002
  added: '2026-09-05'
  status: proposed
  approved_by: null
  title: Theta-coordinate Kummer representations with complete quotient-recovery accounting
  class: representation
  claim: On matched small mathematical examples, a complete theta-coordinate relation description may
    reduce algebraic representation complexity after restoring quotient ambiguity, exceptional cases and
    recovery constraints. This is a falsifiable candidate, not an observed advantage.
  mechanism: Theta coordinates expose structured identities and differential arithmetic. The question
    is whether that structure simplifies the complete relation locus rather than only arithmetic operations
    on its quotient.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-05'
    scope: Publication of the three conversational drafts as separate proposal PRs.
    related_open_pr: https://github.com/aburan28/crypto-autoresearcher/pull/750
    overlap_review: Pending; the related PR describes broader representation ideation. No novelty or nonduplication
      conclusion.
  citations:
  - ref: https://doi.org/10.1515/JMC.2007.012
    provenance: recalled
    claim: 'Gaudry, Fast genus 2 arithmetic based on Theta functions: nearest arithmetic reference; differential
      arithmetic is not evidence of easier decomposition.'
    verified_by: null
  citation_note: 'Literature leads are conservatively marked recalled: this publication pass does not
    certify full primary-source review. They are pointers, not support.'
  assumptions:
  - Quotienting by negation identifies points but does not halve dimension or automatically halve the
    required variables.
  - A genus-2 Kummer surface is a quotient of a two-dimensional Jacobian; transfer to an elliptic-curve
    problem requires an explicit construction and separate cost accounting.
  - Every compared description must encode the same intended solutions, including signs and exceptional
    points.
  proof_search_map:
    bottleneck: Distinguishing a simpler complete representation from complexity moved into hidden constraints.
    baseline_embedding:
      parameter_slice: The original relation description with negation symmetry already exploited.
      reproduction_check: Proposed exact equivalence check on small examples; no check has run.
    observation_collision:
      observable: The quotient relation locus together with a complete recovery condition.
      distinct_preimage_search: Look for different original configurations with the same quotient data
        and check whether recovery distinguishes them.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: The quotient relation locus together with a complete recovery condition.
      predicted_gain: A simpler complete algebraic presentation; magnitude unknown.
    quantifier_order: 'Candidate existence claim: there exists a declared small example and representation
      with a strict measured simplification; for every solution used in that example, equivalence and
      recovery must hold. No universal family or scaling claim.'
    method_ceiling:
      strongest_certifiable_claim: Equivalence and a scoped comparison of algebraic presentations; no
        general ECDLP cost or exponent claim.
      nearby_object_control: A quotient presentation with recovery information deliberately omitted must
        fail equivalence.
    proof_obligations:
    - claim: Original and transformed admissible solutions correspond, including exceptions.
      responsibility: correctness
    - claim: Comparison includes every defining, membership and recovery constraint.
      responsibility: size
    - claim: Any later computational claim charges all stages and specifies transfer assumptions.
      responsibility: scope
  predictions:
  - metric: complete_presentation_complexity
    direction: lower
    minimum_effect: At least one predeclared measure strictly improves with other measures and tradeoffs
      disclosed; measures must be frozen before testing.
  - metric: solution_correspondence
    direction: different
    minimum_effect: Exact agreement on all cases checked in the frozen small example, including exceptional
      cases.
  minimal_test:
    design: Establish equivalence of original and quotient relation descriptions on completely checkable
      small examples before comparing their full algebraic presentations. Count recovery constraints as
      part of the presentation. Parameters and budgets remain to be frozen by the Coordinator.
    controls:
    - Baseline already exploiting negation symmetry.
    - Comparison including sign/difference information needed by differential arithmetic.
    - Exceptional-point and extraneous-solution checks.
    required_metrics:
    - equivalence_check
    - equation_count
    - variable_count
    - degrees
    - exceptional_components
    - recovery_constraints
  falsification_conditions:
  - The complete presentation has no lower complexity than the symmetry-aware baseline in the tested scope.
  - An apparent reduction disappears when omitted recovery conditions are restored. A failed equivalence
    check invalidates the comparison.
  confounders:
  - Redundant baseline coordinates.
  - Omitted sign information.
  - Changing genus or field while attributing the difference to coordinates.
  interpretation_limits:
  - Proposal only; no experiment, implementation, run, review, approval, or research-status promotion.
  - A scoped failed comparison does not close a research direction.
  - No live keys, deployed systems, or private-scalar recovery is part of this proposal.
  - Small-example observations do not justify an asymptotic or cryptographic-scale conclusion.
  - Infrastructure failures and timeouts are not mathematical evidence.
  heuristic_assumptions: []
  heuristic_note: No distributional heuristic or asymptotic transfer assumption is asserted; any future
    such claim needs numbered assumptions and validation.
  target_complexity:
    time_exponent: Unknown; no improvement claimed.
    memory_exponent: Unknown; no improvement claimed.
    best_known: Matched complete original representation; full algorithmic frontier comparison remains
      pending.
    hidden_overhead: Coordinate or embedding construction, membership, exceptional cases, recovery and
      any field transfer must be charged.
    tradeoff_note: Time, memory and data/query tradeoffs are unmeasured.
  estimated_cost:
    implementation: low
    compute: low
    qualification: Provisional expectation for a symbolic small-example intake check only; not an execution
      budget.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured; no numeric delta claimed.
    memory: Unmeasured; no numeric delta claimed.
    data_queries: Unmeasured; no numeric delta claimed.
  frontier_check:
    status: pending
    note: No unchecked null or quantitative frontier claim; Coordinator must complete overlap and Pareto
      review before ranking implementation.
  recommended_priority: medium
  priority_rationale: Provisional intake priority only; user interest in the incidence idea is recorded
    without claiming evidence-based superiority.
  first_deliverable: Representation-equivalence note listing preserved data, forgotten data, exceptional
    cases and recovery obligations.
  next_gate: Coordinator overlap/frontier review followed by a separately frozen, unapproved experiment
    design; this record dispatches no work.
