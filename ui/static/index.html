<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Read-only dashboard over the crypto-autoresearcher ledger: findings, goals, experiments, evidence and integrity, read straight from the committed records.">
<title>Autoresearcher · Research in the open</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128300;</text></svg>">
</head>
<body>
<button class="skip-link" onclick="document.getElementById('main-content').focus()">Skip to content</button>
<div class="shell">
  <nav class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <a class="brand-link" href="#/">autoresearcher<span class="brand-dot">.</span></a>
      <span id="brand-sub">read-only ledger view</span>
    </div>
    <div id="nav"></div>
    <div class="sidebar-foot">
      <div id="build-state">reading the index…</div>
      <div class="row">
        <button class="btn" id="refresh" title="Re-read the corpus from disk">refresh</button>
        <button class="btn" id="theme" title="Toggle theme">theme</button>
      </div>
      <div class="foot-note" title="Every handler reads. The dashboard holds no authority in the research program: only a Coordinator decision changes state.">read-only · writes nothing to the repository</div>
    </div>
  </nav>
  <div class="main">
    <header class="topbar">
      <div class="search">
        <span class="icon">⌕</span>
        <input id="q" type="search" placeholder="Search research, ideas, and findings…"
               autocomplete="off" spellcheck="false" aria-label="Search records">
        <kbd>/</kbd>
      </div>
      <span id="crumb" class="faint mono"></span>
    </header>
    <div id="main-content" tabindex="-1"><main class="content" id="view"></main></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
