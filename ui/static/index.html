<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autoresearch</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128300;</text></svg>">
</head>
<body>
<div class="shell">
  <nav class="sidebar">
    <div class="brand">
      <b>autoresearch</b>
      <span id="brand-sub">read-only ledger view</span>
    </div>
    <div id="nav"></div>
    <div class="sidebar-foot">
      <div id="build-state">starting…</div>
      <div class="row">
        <button class="btn" id="refresh" title="Re-read the corpus from disk">refresh</button>
        <button class="btn" id="theme" title="Toggle theme">theme</button>
      </div>
      <div>writes nothing</div>
    </div>
  </nav>
  <div class="main">
    <header class="topbar">
      <div class="search">
        <span class="icon">⌕</span>
        <input id="q" type="search" placeholder="search every record — id, title, body"
               autocomplete="off" spellcheck="false" aria-label="Search records">
        <kbd>/</kbd>
      </div>
      <span id="crumb" class="faint mono"></span>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
