# Companion artifact for docs/scheme-construction-contract.md.
# This file is a parseable drafting template, not an executable protocol,
# schema-validated ledger record, or security certificate.
# Copy to the task's declared artifact path; retain the normal handoff,
# proof_search_map, archival ownership, and independent review process.
format: scheme-construction-contract/v1
title: null
primitive: null  # signature | pke | kem | ake
parent_record_ids: []  # Existing allocated RQ/H/TASK/GOAL identifiers.
artifact_revision: null  # Exact reviewed commit/path, when one exists.
author: null
security_parameter: null
domains:
  public_parameters: null
  public_key: null
  secret_key: null
  message: null  # Inapplicable to a KEM: give the reason.
  ciphertext: null
  signature: null
  key_space: null
  encoding_and_equality: null
  inapplicable_reasons: {}

security_claims: []
# Each claim supplies:
# - name: EUF-CMA | SUF-CMA | IND-CPA | IND-CCA1 | IND-CCA2 | named AKE game
#   primitive: signature | pke | kem | ake
#   status: conjectured | proposed_proof | reviewed_proof | refuted_scoped
#   adversary: PPT | QPT
#   oracle_model: standard_model | ROM | QROM
#   oracle_query_access: classical | specified_superposition_interfaces
#   game_definition: Exact challenge, win predicate, or source/section.
#   advantage_convention: Win probability or abs(Pr[correct guess] - 1/2).
#   query_bounds: {}
#   oracle_access_and_challenge_exclusions: null
#   assumptions: []
#   theorem_artifact: null
#   review_artifact: null
# For AKE additionally state session matching, Send/Reveal/Corrupt/Test,
# any ephemeral reveals, freshness, and the exact authentication property.

obligations:
  O1:
    name: exact_hard_problem
    status: open
    instance_sampler: null
    real_key_distribution: null
    adversary_input_and_auxiliary_data: null
    solution_representation_and_success_predicate: null
    setup_trust_and_erasure: null
    secret_representation_and_conversion_costs: null
    assumptions: []
    # Every assumption: name, formal game, distribution, model, source/artifact,
    # provenance (recalled | retrieved | kb | internal), verified_by.
    cited_equivalences_and_hypotheses: []
    evidence_artifacts: []
    review_artifact: null
    remaining_gap: null
    next_action: null
  O2:
    name: honest_party_algorithms
    status: open
    algorithms: []
    # Every required interface: name, inputs, outputs, randomness, validation,
    # failure behavior, pseudocode/artifact, time, memory, bit-length bounds.
    preprocessing_and_retry_costs: null
    complexity_guarantee: null  # Worst-case/expected, with applicable bounds.
    unavailable_subroutines: []
    evidence_artifacts: []
    review_artifact: null
    remaining_gap: null
    next_action: null
  O3:
    name: quantified_correctness
    status: open
    statement_and_quantifiers: null
    probability_space: null
    valid_key_and_message_scope: null
    per_key_or_average_guarantee: null
    failure_probability_bound: null
    actual_message_or_key_recovery: null
    exceptional_inputs: []
    theorem_artifact: null
    supporting_test_artifacts: []
    review_artifact: null
    remaining_gap: null
    next_action: null
  O4:
    name: functionality_mechanism
    status: open
    public_operation: null
    private_operation: null
    agreement_or_message_binding_lemma: null
    extra_recipient_secrets: []
    recipient_lift:
      applicability: null
      inapplicable_reason: null
      interface: null  # If used: SecretLift | Complete_2 | EndpointLift, etc.
      inputs: null
      output_representation_and_equivalence: null
      uniqueness_or_acceptance_condition: null
      polynomial_algorithm_and_cost: null
      failure_bound: null
      recovery_of_actual_message_or_key: null
      identical_public_data_control: null
    identification_and_transform:
      applicability: null
      inapplicable_reason: null
      relation: null
      completeness: null
      soundness_extractor_and_knowledge_error: null
      simulator_and_verifier_scope: null
      challenge_space: null
      transcript_message_key_and_context_binding: null
      transform_theorem_and_hypotheses: null
    ake_identity_and_session_binding: null
    evidence_artifacts: []
    review_artifact: null
    remaining_gap: null
    next_action: null
  O5:
    name: correctly_directed_security_reduction
    status: open
    reductions: []
    # One per security claim: solver input distribution, scheme attacker,
    # assumption problem solved, challenge embedding, real-key-distribution
    # argument, oracle simulation, extraction, aborts, advantage/loss bound,
    # solver runtime, model, theorem artifact, independently reviewed artifact.
    intermediate_assumptions: []
    # Each entry defines its game and states whether the needed reduction to
    # EndRing/the advertised base problem is proved, conditional, or open.
    multiple_assumption_dependency: null
    classical_quantum_and_rewinding_scope: null
    evidence_artifacts: []
    review_artifact: null
    remaining_gap: null
    next_action: null
  O6:
    name: complete_adversarial_view
    status: open
    public_disclosures: []
    allowed_oracles_and_query_history: null
    validation_rejection_and_failure_observables: null
    malformed_inputs_and_alternate_encodings: null
    repeated_use_and_collision_analysis: null
    side_channel_scope_and_exclusions: null
    public_data_and_known_false_controls: []
    concrete_parameter_security: null
    asymptotic_to_concrete_limitations: null
    evidence_artifacts: []
    review_artifact: null
    remaining_gap: null
    next_action: null

# Obligation statuses: open | proposed_discharge | reviewed_discharge | contradicted.
# All six obligations are mandatory. Inapplicability applies only to a
# primitive-specific subrequirement and needs a reason.
# Never mark reviewed_discharge without a real independent review artifact.
assessment:
  verdict: candidate  # candidate | construction | scoped_obstruction
  finite_functionality_status: unresolved
  efficient_functionality_status: unresolved
  security_status: unresolved
  named_conditions: []
  open_obligations: [O1, O2, O3, O4, O5, O6]
  obstruction:
    affected_obligation: null
    exact_family_and_parameter_scope: null
    counterexample_or_argument_artifact: null
    what_remains_open: null
  independent_review_artifacts: []
  next_action: null
  official_state_transition_record: null  # Normal Coordinator DEC record, if any.

citations: []
# Each citation: source, section, provenance, verified_by, inspected_scope.
# Recalled references are pointers and cannot discharge an obligation.
