experiment:
  id: EXP-SLHDSA-bafee8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f061f1; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f061f1
  question_id: RQ-SLHDSA-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compose an exactly enumerated elementwise-maximum chain-position accumulator with an exactly
    computed hypertree leaf-collision distribution, and report the transcript-wide dominance up-set
    as a curve in signature count across idealized, concrete-hash and shuffled-attribution arms
  objective: 'The one uncertainty a run reduces is what honest-operation leaf reuse actually costs
    in the one-time layer, expressed as an integer curve rather than as the observation that reuse
    is bad. Concretely: (i) whether the elementwise-maximum accumulator has a non-degenerate saturation
    horizon at enumerable encoding parameters, meaning it takes materially more than one or two signatures
    under a shared leaf before every forgeable message becomes forgeable, since a degenerate horizon
    would mean the composition carries no information and is itself a measured obstruction worth recording;
    (ii) whether an idealized uniform leaf-assignment arm reproduces the exact arithmetic birthday
    collision distribution, which is the pipeline validation without which no other number in the
    contract is readable; (iii) whether the composed transcript-wide up-set curve differs between
    a concrete truncated-hash leaf source and the idealized source, and whether it differs between
    the signal arm and a shuffled-attribution null that preserves per-leaf counts while destroying
    any correlation between leaf and encoding. A run reduces (i) to a distribution with full support,
    (ii) to a pass or fail against arithmetic, and (iii) to two differences with bands and seed spreads.
    Agreement everywhere is a complete outcome.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a completed run supports: at the tested (w, len1, h,
      q) grid, the exact saturation-horizon distribution of the accumulator, the exact leaf-collision
      distribution and the measured agreement of the idealized arm with it, and the composed transcript-wide
      up-set curve in each of the three arms with their pairwise differences, bands and seed spreads.
      WHAT DOES NOT FOLLOW: nothing about any FIPS 205 parameter set, whose hypertree height and Winternitz
      parameters lie outside the enumerable region; no security level in bits; no forgery, no attack,
      no weakness; no statement about SHA-2 or SHAKE, used here only as fixed truncated leaf sources;
      no statement about what the literature contains; and nothing whatsoever about faults, Rowhammer,
      state corruption or memory attacks, which RQ-SLHDSA-001 requires be reported as a strictly separate
      claim class and which no arm of this contract touches. A non-degenerate horizon at toy encodings
      is a statement about those encodings, not about any deployed margin.'
  inputs:
    procedure: 'STAGE 0, freeze (zero compute): register the (w, len1, h, q) grid, the encoding convention
      inherited from the companion up-set contract, the arithmetic birthday formula, and the pre-registered
      null expectations. STAGE 1, halves (~5h human): implement the accumulator module (elementwise
      max plus cached up-set lookup, reusing the companion enumeration) and, as a separate module
      with a declared interface, the occupancy dynamic program. STAGE 2, validate halves (~30min compute):
      single-signature consistency check against the companion enumeration; occupancy dynamic program
      against the exact birthday distribution at h up to 14 where both are arithmetic. STAGE 3, compose
      (~2h compute): three arms (idealized uniform, concrete truncated hash at two backends, shuffled
      attribution) across the q grid, three seeds, all in one process invocation. STAGE 4, horizon
      (~1h compute): exact saturation-horizon distribution per (w, len1) by enumerating accumulator
      trajectories. STAGE 5, report (zero compute): horizon distributions, collision distributions
      against arithmetic, composed curves per arm with all pairwise differences, per-leaf distributions
      alongside every summed curve.'
    instrument: Python 3.11 with numpy for the elementwise-max accumulation, the occupancy dynamic
      program and the band arithmetic, itertools for the accumulator-trajectory enumeration, and the
      companion up-set enumeration module reused directly rather than reimplemented, which is stated
      as a dependency and as a shared failure mode. hashlib supplies SHA-256 and SHAKE-128 truncated
      to h bits as the two concrete leaf-assignment backends; random.Random supplies the idealized
      uniform arm and the shuffled-attribution permutation. New single-file module under harness/
      in the style of harness/rho.py, run through harness/runner.py so seeds, parameters and the resolved
      inference block appear in the run manifest. No Sage, no external cryptographic library, no network.
    parameters: 'Encoding: w in {4, 16}, len1 in {4, 5, 6} for w = 4 and {3, 4} for w = 16, with the
      checksum length inherited from the companion contract. Hypertree height h in {8, 10, 12, 14,
      16, 20}, with the exact occupancy dynamic program used to h = 20 and the arithmetic birthday
      cross-check to h = 14. Signature count q on a logarithmic grid from 8 to 4096, chosen at each
      h to straddle 2^{h/2} with at least three points on each side. Arms: idealized uniform, concrete
      truncated hash at two backends, shuffled attribution. Seeds: 3 per arm. Saturation-horizon enumeration:
      complete over all valid encodings at every (w, len1) in the grid, no sampling.'
  controls:
  - Idealized-uniform leaf assignment arm, validated against the exact arithmetic birthday distribution
    computed independently of any run.
  - 'Shuffled-attribution null: same vectors, same per-leaf counts, leaf assignment permuted, identical
    pipeline, same invocation.'
  - 'Single-signature consistency check: r after one signature must give exactly that signature''s
    own |U(b)| from the companion enumeration.'
  - 'Monotonicity check: |U(r)| recomputed after every added signature, required nonincreasing at
    every step.'
  - Two concrete digest backends for the leaf-assignment arm, so a difference seen in one and not
    the other is identifiable as backend-specific rather than structural.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both in the same invocation as the signal arm. First, for
    the occupancy half, an idealized uniform index source: leaves assigned by a seeded uniform draw
    over [2^h], which must reproduce the exact birthday collision distribution computed arithmetically
    in STAGE B; if it does not, the pipeline is broken and the concrete-hash arm cannot be read. Second,
    for the accumulator half, a shuffled-attribution null in which the same multiset of chain-position
    vectors is redistributed across leaves uniformly at random while preserving the per-leaf signature
    counts. For the composed measurement to mean anything, the shuffled-attribution null must reproduce
    the signal arm''s up-set curve: the accumulator''s behaviour should depend only on how many signatures
    share a leaf, not on which ones, and a difference between the signal and shuffled arms would mean
    the leaf assignment and the message encoding are correlated, which is a finding about the digest
    split rather than about reuse and must be routed to the randomizer-distribution entry rather than
    reported here.'
  independent_variables:
  - Winternitz parameter w and message-block length len1
  - hypertree height h
  - signature count q
  - leaf-assignment arm (idealized uniform / concrete hash / shuffled attribution)
  - digest backend for the concrete arm
  metrics:
    primary:
    - saturation-horizon distribution with full support, per (w, len1)
    - '|U(r)| as a function of per-leaf signature count, exact'
    - measured leaf-collision count per arm versus the exact arithmetic birthday distribution
    - composed transcript-wide up-set curve in q, per arm, with band and seed spread
    - signal-versus-shuffled-null difference on the composed curve
    secondary:
    - per-leaf signature-count distribution alongside every summed curve
    - single-signature consistency check result against the companion enumeration
    - monotonicity check result at every accumulation step
    - agreement between the two concrete digest backends
    - wall-clock and enumeration-cache hit rates per arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The number of hypertree leaves receiving at least two of q signatures, in the idealized-uniform
      arm, at every (h, q) in the grid.
    formula: Predicted value equal to the exact arithmetic expectation 2^h * (1 - (1 - 2^{-h})^q -
      q * 2^{-h} * (1 - 2^{-h})^{q-1}), within the arm's binomial band at three seeds. This is the
      standard occupancy expectation for q balls in 2^h bins and is computed independently of any
      run in STAGE 0. The accumulator quantity is defined separately as |U(r)| where r_i = max over
      the signatures sharing a leaf of b_i, and U is the dominance up-set as defined in the companion
      up-set contract; no value is pre-registered for the saturation horizon, deliberately, since
      it is the deliverable.
    source: Pre-registered in the parent proposal IDEA-20260816-f061f1 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at w in {4,16} with len1 bounded so the encoding space is at most 2^24
      points, and at hypertree heights 8 to 20 where the occupancy distribution is computed exactly
      by dynamic programming rather than sampled. These are the largest parameters at which both halves
      are exact simultaneously, which is the design''s whole reason for choosing them. Deployed hypertree
      heights and Winternitz parameters lie far outside this region. The transfer assumption, stated
      and not established: that the accumulator''s saturation behaviour is a property of the encoding''s
      box geometry and the per-leaf signature count, and not of the absolute hypertree height, so
      that a horizon measured at h = 12 with q straddling the birthday point describes the same phenomenon
      at larger h with q scaled accordingly. That assumption is exactly what the shuffled-attribution
      null tests, and under AGENTS.md rule 4 no output is phrased as a statement about any deployed
      parameter set.'
    correspondence: null
  tail_checks:
  - Require the idealized arm to reproduce the exact arithmetic occupancy expectation within band
    at every (h, q).
  - Require |U(r)| nonincreasing at every accumulation step, halting on any increase.
  - Require r after one signature to give exactly that signature's own up-set count from the companion
    enumeration.
  - Require the two concrete digest backends to agree within band before any concrete-versus-idealized
    difference is reported.
  - Report the per-leaf signature-count distribution beside every summed curve so that a single heavy
    leaf is never hidden inside a sum.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report a pipeline failure if the idealized arm disagrees with the exact arithmetic occupancy
    expectation beyond band.
  - Halt the exact occupancy dynamic program above h = 20 and report larger heights as out of scope
    rather than sampling them silently.
  - Halt and report a degenerate-horizon obstruction, with the parameter range stated, if the saturation
    horizon is at most two at every tested encoding; this is a result, not a failure, and the run
    is not retuned to avoid it.
  - Hard wall-clock stop at 12 CPU-hours; a stop is an infrastructure outcome and is never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: An exact saturation-horizon distribution per encoding, an idealized arm matching
    the arithmetic occupancy expectation within band at every grid point, and a composed transcript-wide
    up-set curve reported for all three arms with pairwise differences, bands, seed spreads and per-leaf
    distributions attached.
  falsification_criterion:
  - 'The idealized arm disagrees with the arithmetic occupancy expectation: pipeline invalid, nothing
    readable.'
  - '|U(r)| increases at any accumulation step: the accumulator is misimplemented.'
  - 'Single-signature consistency against the companion enumeration fails: the two routines disagree
    and the composition is void.'
  - 'The shuffled-attribution null differs from the signal arm beyond band: leaf assignment and encoding
    are correlated and the finding is routed to the randomizer-distribution contract, not reported
    here.'
  - 'The two concrete backends disagree: any concrete-versus-idealized difference is backend-specific
    and reported as inconclusive.'
  - 'The saturation horizon is at most two at every tested encoding: reported as a degenerate-horizon
    obstruction with its parameter range, and the composed curve is reported as carrying no information
    at those parameters.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f061f1
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - This contract depends on the companion up-set enumeration and inherits its UNVERIFIED encoding
    convention and its checksum-direction ruling; a Coordinator must approve that dependency explicitly
    and must not approve this contract before that one's convention is fixed, since a shared sign
    error is invisible to every control here.
  - Whether the composed transcript-wide up-set sum is the right summary, or whether the per-leaf
    maximum is the quantity of interest, is a Coordinator scoping decision that changes what the curve
    means.
  - The q grid is specified relative to 2^{h/2}; whether points beyond the birthday point are within
    the intended scope of RQ-SLHDSA-001, which is concerned with realistic signature budgets, needs
    a Coordinator ruling before freezing.
  - No hypothesis is minted here, and H-SLHDSA-3a403a excludes this layer by its own text; the Coordinator
    must decide whether a new hypothesis is required or whether this is filed as a standalone mechanism
    measurement.
