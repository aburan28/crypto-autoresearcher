# EXP-BINSTD-fdd2d9
# Catalog-count arithmetic. No encoding is run.
# Approved by DEC-20261003-2e4a60.
experiment:
  id: EXP-BINSTD-fdd2d9
  hypothesis_id: H-BINSTD-f9fa00
  source_idea: IDEA-20261001-febbe1
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Catalog floor versus the bound in hundredths
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-2e4a60
  objective: >-
    Check the product 12, the excess 20, and the product 80.
  inputs:
    n_sum: 59
    n_product: 7429
    gap_product: 8
    span: 6
    ell_lo: 3
    ell_hi: 4
    ell_product: 12
    cells: 6
    catalog: 12
    slots: 72
    hour_cap: 6
    slot_quot: 6
    bound_hundredths: 70
    half_hundredths: 50
    hundredths_excess: 20
    distinct_floor: 3
    catalog_quot: 4
    excess_product: 80
    cross_two_thirds: 1
    cross_three_fifths: 5
  controls:
    - >-
      Three times 4 is 12. Six times 12 is 72. Reporting 12 as 9
      invalidates the run.
    - >-
      Seventy minus 50 is 20. Twelve divided by 3 is 4. The product
      of 20 and 4 is 80. Seven times 3 exceeds 10 times 2 by 1.
    - >-
      The n sum is 59 and the n product is 7429. The gap product is
      8 and the span is 6. Seventy-two divided by 12 is 6.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {catalog, excess, product}
    - route in {difference, product}
  metrics:
    primary:
      - hundredths_excess
      - excess_product
      - implementations_agree
    secondary:
      - ell_product
      - slots
      - n_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Three times 4 is 12. Seventy exceeds 50 by 20. The product of
      20 and 4 is 80.
    formula: >-
      Multiply 3 and 4. Subtract 50 from 70. Divide 12 by 3.
      Multiply 20 and 4. Compare 7 times 3 with 10 times 2.
    source: >-
      IDEA-20261001-febbe1 states the n list, the dimensions 3 and
      4, the catalog floor 12, the bound 0.70, the distinct-value
      floor 3, and the hour cap 6, read 2026-10-03. The products
      were recomputed in this design session. That computation is
      not a run. No encoding was run.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written catalog floor. No transfer to a correlation.
    correspondence: null
  tail_checks:
    - The product 80 and the excess 20 are required. A check that stops at the product 12 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the excess 20 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The product of 3 and 4 is not 12.
    - The excess is not 20.
    - The product of 20 and 4 is not 80.
    - An encoding is run, or 12 is reported as 9.
  success_criterion: >-
    Both runs agree that 3 times 4 is 12, that 6 times 12 is 72,
    that 70 minus 50 is 20, and that the product of 20 and 4 is 80.
  falsification_criterion: >-
    The runs agree that 70 minus 50 is computed, and that difference
    is not 20.
  required_artifacts:
    - experiments/EXP-BINSTD-fdd2d9/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-fdd2d9/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-fdd2d9/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-fdd2d9/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-fdd2d9/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-fdd2d9/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any encoding, subspace sweep, or rank correlation.
    - Any claim that a smaller product space predicts fewer variables.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
