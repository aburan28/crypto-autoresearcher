  validity_reason: >
    All controls passed. PC1: net-based reduced Tate pairing (Stange Thm 1) matched
    P.tate_pairing exactly on 3/3 dedicated embedding-degree-1 instances (n=5,43,5;
    non-vacuous). PC2: EDS exactness (x(mP) group identity, EDS translation identity,
    Somos identity) passed on 18/18 main instances. k-in-S assertion never failed.
    NC1 independent-curve enrichment ~1.1 (no sieve artifact); NC3 random-oracle
    enrichment 0.92-1.06 (birthday denominator validated); NC2 permuted-target control
    produced |S|=1 false-yield relations at comparable rates as designed. Deviations:
    (1) PC1 uses reduced Tate instead of Weil pairing (toy fields host no independent
    rational n-torsion pair; same Stange theorem family); (2) k-consistency analysis
    capped at MAXC=600 collisions/instance (deterministic stride sample, counts reported
    for the analyzed sample); (3) script placed at experiments/EXP-NET-001/ per handoff
    ID mapping instead of the candidate's proposal path experiments/ecdlp_net/.
    Two crashed invocations (RNG TypeError; UnboundLocalError/ZeroDivisionError) were
    infrastructure failures producing no data, fixed before this run; recorded in
    analysis.md. No invocation exceeded 600 s (wall 15.1 s); no seed reduction.
