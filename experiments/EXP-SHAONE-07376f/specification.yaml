experiment:
  id: EXP-SHAONE-07376f
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-fa13f6; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-fa13f6
  question_id: RQ-SHAONE-081e3a
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Produce N chosen-prefix collisions at analogue scale under cold-start and state-reuse policies
    over a shared kernel, verify each by recomputation, and fit the amortization exponent per policy
    and per phase.
  objective: 'The one uncertainty a run reduces is whether chosen-prefix cost is genuinely per-collision
    or whether retained search state makes later collisions cheaper, expressed as a fitted exponent
    rather than as an opinion. Stated as parts: (i) it validates the instrument by requiring the cold-start
    policy -- freshly seeded independent state per collision, identical pipeline, kernel and counter
    -- to return an amortization exponent indistinguishable from 1 within its bootstrap interval,
    so that any exponent reported for a reuse policy rests on a counter and a fitting procedure that
    have been shown to reproduce the trivially known answer; (ii) it measures the cumulative evaluation
    curve C(N) for each declared reuse policy at increasing N, with every produced collision independently
    verified by direct recomputation so that a policy cannot appear cheap by skipping necessary work,
    and reports the fitted exponent together with the fit residuals so a reader can judge whether
    a power law is even the right summary; (iii) it decomposes the exponent into birthday-phase and
    near-collision-phase contributions and locates the saturation N at which marginal cost returns
    to the cold-start level, attributing any amortization to a phase rather than reporting a bare
    aggregate. Peak memory is reported per policy beside cost and is never folded into the exponent.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: on THIS analogue at
      THESE parameters, under THIS declared reuse policy with THIS memory ceiling and THESE independently
      drawn prefix pairs, the cumulative cost curve is this, its fitted exponent is this with these
      residuals and intervals, its phase decomposition is this, and saturation occurs at this N --
      with cold start pinned at 1. WHAT DOES NOT FOLLOW: no exponent for full-scale parameters, no
      claim that any multi-collision attack is practical or impractical anywhere, no statement that
      any published per-collision quotation is right or wrong, no security consequence, and no reading
      of alpha as a cryptanalytic complexity exponent.'
  inputs:
    procedure: 'STAGE 0 (cost: 3 human-hours): declare the analogue, the reuse policies and their
      correctness obligations, the N schedule, the memory ceiling, the prefix-pair generator and its
      seeds. STAGE 1 (cost: 10-25 human-hours, dominant human cost): implement the shared compression
      kernel with an in-kernel counter, record its byte hash, and implement each reuse policy over
      it; implement the independent recomputation verifier as separate code. STAGE 2 (cost: 1-4 CPU-hours):
      run the cold-start null to the declared N, verify every collision, and fit alpha; halt if it
      is not indistinguishable from 1. STAGE 3 (cost: 2-12 CPU-hours): run each reuse policy to the
      declared N, recording cumulative evaluations after each success, retained item counts and reuse
      hits, verifying every collision. STAGE 4 (cost: minutes): fit alpha per policy with bootstrap
      intervals, report residuals, and decompose per phase. STAGE 5 (cost: 1-4 CPU-hours): run the
      independent-prefix-pair second null and the memory-ceiling sensitivity check. STAGE 6 (cost:
      1 CPU-hour): locate saturation N, report memory beside cost per policy, and state every disagreement
      with the predictions.'
    instrument: Python 3.11 orchestration over a single ctypes-wrapped C compression kernel whose
      byte hash is recorded in the manifest so the shared-kernel requirement is auditable; numpy for
      the state table, the curve fitting and the bootstrap; scipy for the power-law fit and residual
      analysis; an independently written recomputation verifier that shares no code with the search;
      multiprocessing for the birthday phase; harness/runner.py for run manifests, seeds and the inference
      block. No Sage and no computer-algebra dependency.
    parameters: 'Analogue: the smallest reduced-step, truncated setting at which a full chosen-prefix
      collision completes in minutes, plus one larger setting if budget permits. N schedule: 1, 2,
      4, 8, 16, 32 collisions, extended to 64 only if the fit''s intervals are too wide. Policies:
      cold start, table reuse, trail reuse, near-collision suffix reuse. Prefix pairs: independently
      drawn, 64 distinct pairs available. Memory ceiling: 8 GiB per policy, with one repeat at 2 GiB
      as the throttling sensitivity check. Bootstrap resamples: 10000. Verification: 100 percent of
      produced collisions.'
  controls:
  - Cold-start policy as the primary null, same invocation, same kernel and counter, which must return
    alpha = 1.
  - Independently drawn, mutually unrelated prefix pairs as a second null against correlated-target
    artifacts.
  - Direct recomputation verification of every collision produced under every policy.
  - Shared compression kernel with its byte hash recorded, so no policy benefits from a different
    implementation.
  - Reporting the C(N) curve and fit residuals, not only alpha, so a reader can see whether a power
    law is even the right form.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Cold-start policy: produce each of the N collisions with freshly seeded,
    wholly independent search state, using the IDENTICAL pipeline, kernel and counter in the same
    invocation. By construction this must yield C(N) proportional to N and alpha indistinguishable
    from 1. The null validates the counter, the fitting procedure and the instance-generation process
    all at once; if cold start does not return alpha = 1 within its bootstrap interval, the instrument
    is broken and no reuse policy''s alpha may be reported. A second null uses randomly drawn, mutually
    unrelated prefix pairs to confirm alpha is not an artifact of correlated targets.'
  independent_variables:
  - reuse policy
  - number of collisions N
  - analogue setting
  - memory ceiling (8 GiB / 2 GiB)
  metrics:
    primary:
    - cumulative evaluations after each success, per policy
    - fitted amortization exponent alpha with bootstrap interval, per policy
    - fit residuals of the power-law form, per policy
    - saturation N where marginal cost returns to the cold-start level
    secondary:
    - alpha decomposed by phase (birthday / near-collision)
    - retained state item count and reuse hit count per policy
    - peak memory per policy
    - fraction of collisions verified by independent recomputation
    - kernel byte hash per run
  heuristic_under_test: null
  preregistered_prediction:
    quantity: alpha_p, the fitted amortization exponent for each policy p, and alpha_cold for the
      cold-start null.
    formula: C_p(N) = c * N^alpha_p fitted by least squares in log-log coordinates over the declared
      N schedule, with 10000-resample bootstrap intervals. Predicted alpha_cold = 1.0 within its interval,
      by construction. Predicted alpha_table <= 0.95, i.e. at least a five percent exponent reduction,
      before saturation. Residuals are reported and a fit whose residuals show systematic curvature
      disqualifies the power-law summary for that policy.
    source: Pre-registered in the parent proposal IDEA-20260816-fa13f6 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are one or two reduced-step truncated analogue settings with
      N up to 32 or 64 collisions -- the smallest scale at which N complete chosen-prefix collisions
      can all be produced AND each independently verified by direct recomputation, which is the requirement
      that makes the amortization measurement trustworthy rather than modelled. Transfer assumption
      stated explicitly: alpha does NOT transfer to full-scale parameters and no extrapolation is
      performed. What is argued to carry is only the qualitative existence of phase-level reuse, and
      even that is asserted rather than established, since table coverage relative to target-set size
      scales differently.'
    correspondence: null
  tail_checks:
  - Report the full C(N) curve and residuals, never only the exponent; a systematic residual pattern
    disqualifies the power law.
  - Check whether any single collision instance dominates a policy's cumulative cost, which would
    make the fit hostage to one draw.
  - Check whether the memory ceiling binds at any N, and report the 2 GiB sensitivity repeat to separate
    saturation from throttling.
  - Check the reuse hit distribution for concentration in a few retained items, which would mean amortization
    rests on a handful of lucky items.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt after STAGE 2 if cold start does not return alpha indistinguishable from 1.
  - Halt any policy immediately if a produced collision fails independent recomputation.
  - Stop extending N at the declared wall-clock budget and report the N reached; a truncated schedule
    is a budget outcome, explicitly not evidence about amortization.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run is successful if cold start returns alpha indistinguishable from 1, every
    produced collision verifies by independent recomputation, and each policy's C(N) curve, exponent,
    interval and residuals are reported -- whichever way the exponents fall.
  falsification_criterion:
  - Cold start returns an exponent materially different from 1, voiding the instrument.
  - Table reuse returns alpha indistinguishable from cold start, closing the amortization hypothesis
    at this scale with a measured null.
  - Any collision under any reuse policy fails independent recomputation, showing the policy is not
    correctness-preserving.
  - Fit residuals show systematic curvature, so no exponent may be reported for that policy.
  - The memory ceiling binds before the declared N, so saturation cannot be distinguished from throttling.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-fa13f6
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Each reuse policy's correctness obligation must be written down and approved before implementation;
    recomputation catches violations but only after compute has been spent.
  - The dependency on GOAL-MD5-001's pipeline must be sequenced explicitly, since GOAL-SHA1-001 declares
    it does not own that pipeline.
  - Whether an N schedule topping out at 32 or 64 can support a power-law fit with usable intervals
    is unknown before STAGE 2 and the Coordinator should set a rule for extending it rather than leaving
    it to mid-run judgement.
  - Whether saturation should be defined by marginal cost returning to cold-start level, or by a declared
    fraction of it, needs fixing in advance since the two give different saturation N.
