experiment:
  id: EXP-MULTIV-5fc55b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-728064; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-728064
  question_id: RQ-MAYO-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Symbolic construction of both orders of Weil restriction and MAYO whipping at tiny parameters,
    with an exact computational check of the composition defect across prime-field and non-prime-field
    emulsifier arms.
  objective: 'The single uncertainty is whether analysing a whipped UOV map over F_q and then descending
    to F_p gives the same object as descending first and then whipping. Stated as parts: (i) the run
    fixes both arrows as explicit constructions and computes both composites'' parameter triples,
    which must agree on a forced value, so that any implementation error announces itself before any
    algebra is trusted; (ii) it computes the defect D between the two composites entrywise over exact
    F_p for keys drawn with emulsifier coefficients inside and outside the prime field, in the same
    invocation, so that the criterion in the claim is tested against its own built-in contrast rather
    than asserted; (iii) it records D''s rank profile and common left kernel dimension, and checks
    that these are invariant under a change of F_p-basis of F_q, which is what distinguishes an intrinsic
    object from a bookkeeping artifact. The run performs no key recovery, computes no attack cost,
    and exercises no solver. Its whole output is a table of booleans and small integers, plus the
    symbolic derivation that predicted them, and its value is highest if the two disagree.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: at the named tiny cells and under
      the recalled definitions of whipping and of the descent basis, the two composition orders produce
      identical parameter triples and produce identical maps exactly when the emulsifier coefficients
      lie in the prime field, with the defect''s measured rank profile stated per cell. What does
      NOT follow: nothing about the security of MAYO or of any UOV variant, nothing about whether
      either analysis order is cheaper to attack, no statement about deployed parameters, and no license
      to treat a nonzero defect as a structural weakness. A commuting square also does not license
      transporting any other transform through descent.'
  inputs:
    procedure: 'STAGE 0, definitions frozen (cost: human, hours): write both arrows into the run log
      with their conventions, flagged UNVERIFIED for the whipping definition. STAGE 1, symbolic derivation
      (cost: zero compute, human): expand both composites'' polar forms in the basis {1, w} of F_4
      over F_2 at (k, n, m, o) = (2, 3, 2, 1) and state the predicted criterion before any code runs.
      STAGE 2, construction code (cost: low): implement Whip_k and Res independently, sharing only
      the field tables and the basis object. STAGE 3, forced-value check (cost: seconds): compare
      parameter triples from both composites against (k e n, e m, k e o); abort on mismatch. STAGE
      4, two-arm defect computation (cost: minutes): 200 keys with prime-field emulsifiers and 200
      with non-prime-field emulsifiers, computing D entrywise and its rank profile. STAGE 5, controls
      (cost: minutes): e = 1, k = 1, random-non-isotropic-subspace, and basis-permutation arms. STAGE
      6, report (cost: human): the table, the derivation, and whichever of the two outcomes occurred.'
    instrument: Python 3 with exact GF(2) and GF(4) arithmetic via small precomputed tables written
      for this experiment; integer matrices over the prime field handled with plain nested lists to
      avoid any silent numpy dtype coercion. Symbolic Stage 1 is done by hand and transcribed into
      the run log; no computer algebra system and no Sage is used, so the symbolic claim is checked
      by exact enumeration rather than trusted. Driven by harness/runner.py for seed and manifest
      discipline.
    parameters: p = 2 with e in {2, 3} so q in {4, 8}; also p = 3 with e = 2 so q = 9, to check that
      nothing depends on characteristic 2. Underlying (n, m, o) in {(3,2,1), (4,2,1), (5,3,2)}; k
      in {1, 2, 3}; 200 keys per emulsifier arm per cell; 2 distinct F_p-bases of F_q for the invariance
      control. Largest object constructed has e k n = 3*3*5 = 45 variables over F_p, which is trivially
      small.
  controls:
  - 'e = 1 control: with q = p the descent is the identity and D must vanish identically for every
    emulsifier, including non-prime-field ones, which cannot then exist; this is a forced-value sanity
    anchor.'
  - Prime-field emulsifier arm and non-prime-field emulsifier arm, both executed in the same invocation,
    which is the built-in signal/null contrast.
  - 'Random isotropic subspace null: replace the oil space by a uniformly random subspace of the same
    dimension with no isotropy imposed and confirm the defect computation still runs and gives the
    same rank profile, since D should not depend on the oil space at all.'
  - 'Basis-permutation control: recompute with a different F_p-basis of F_q and confirm the rank profile
    is unchanged.'
  - 'k = 1 control: with no whipping the square degenerates and D must vanish.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a quadratic map of identical shape (kn variables,
    m equations over F_q) with a uniformly random distinguished isotropic subspace of the same dimension
    and a uniformly random emulsifier, run through the identical two composites in the same invocation.
    For the signal arm to mean anything, the null must show a nonzero defect at the same rate whenever
    its emulsifier coefficients leave F_p, and a zero defect whenever they lie in F_p. If the null
    shows zero defect always, the defect computation is broken; if it shows nonzero defect always,
    including for prime-field emulsifiers, the criterion in Part B is wrong and must be reported as
    such.'
  independent_variables:
  - emulsifier arm (coefficients inside F_p versus outside)
  - extension degree e
  - whipping factor k
  - F_p-basis choice
  - characteristic p
  metrics:
    primary:
    - 'boolean: D identically zero'
    - rank of D per key
    - dimension of the common left kernel of D
    - parameter-triple agreement against the forced value
    secondary:
    - fraction of keys in each arm with nonzero D
    - rank profile invariance under basis change
    - runtime per cell, recorded as cost
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The indicator that the two composition orders produce the identical map, as a function
      of whether the emulsifier's coefficients lie in the prime field.
    formula: 'Predicted law: D = 0 identically if and only if every emulsifier coefficient lies in
      F_p. Equivalently, the predicted fraction of keys with D = 0 is exactly 1.0 in the prime-field
      arm and exactly 0.0 in the non-prime-field arm, at every tested cell with e > 1 and k > 1. The
      predicted parameter triple from both orders is exactly (k e n, e m, k e o).'
    source: Pre-registered in the parent proposal IDEA-20260816-728064 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Every object built has at most 45 variables over F_p and every statement checked
      is an algebraic identity, not a cost. Identities verified exhaustively at tiny parameters are
      claimed only at those parameters; the general symbolic derivation is what carries the statement
      further, and it is recorded as a derivation with its assumptions, not as an extrapolation from
      the runs. No transfer to deployed parameters is asserted.
    correspondence: null
  tail_checks:
  - e = 1, where the descent is the identity and D must vanish
  - k = 1, where whipping is the identity and D must vanish
  - characteristic 3, to confirm nothing depends on the characteristic-2 polar-form convention
  - an emulsifier with exactly one coefficient outside F_p, the minimal violation of the criterion
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - abort on any parameter-triple mismatch, since no algebra downstream is meaningful
  - stop after both emulsifier arms are unanimous at every cell, since more keys add nothing to a
    boolean that is already 200 for 200
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both composites are constructed independently, agree on the forced parameter
    triple, and produce a defect table whose two emulsifier arms are separated or are demonstrably
    not separated, with the rank profile invariant under basis change either way.
  falsification_criterion:
  - A nonzero D in the prime-field arm.
  - A zero D throughout the non-prime-field arm.
  - Parameter triples disagreeing between orders.
  - Rank profile of D varying with the F_p-basis.
  - Nonzero D in the e = 1 or k = 1 degenerate controls.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-728064
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - Whether the defect D inherits an isotropic subspace from O, which Part C of the claim asserts
    but the mechanism does not prove; a Coordinator must decide whether to approve Part C as a measured
    question or strike it.
  - The exact whipping definition and emulsifier convention are recalled and UNVERIFIED, and RQ-MAYO-001
    constrains experiments pending primary sources; approval must state explicitly that this is a
    definition-conditional algebraic audit.
  - The extension of the audit to towers F_p subset F_{p^d} subset F_q is not derived and is listed
    as an open direction, not a contract item.
