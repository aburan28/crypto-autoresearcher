# EXP-ECDLP-78d58b
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-473789.
experiment:
  id: EXP-ECDLP-78d58b
  hypothesis_id: H-ECDLP-479c5d
  source_idea: IDEA-20261004-259f16
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-31 table versus width-30 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-473789
  objective: >-
    Check the table sizes 1073741824 and 536870912, the product 576460752303423488, and the nearby gap 0.
  inputs:
    width_hi: 31
    width_lo: 30
    table_hi: 1073741824
    table_lo: 536870912
    table_gap: 536870912
    table_product: 576460752303423488
    table_sum: 1610612736
    nearby_a: 536870912
    nearby_b: 536870912
    nearby_gap: 0
    nearby_product: 288230376151711744
  controls:
    - >-
      Two to the power 30 is 1073741824. Two to the power 29 is 536870912.
      Reporting both tables as size 536870912 drops the gap and invalidates
      the run.
    - >-
      One billion seventy-three million seven hundred forty-one thousand
      eight hundred twenty-four exceeds five hundred thirty-six million
      eight hundred seventy thousand nine hundred twelve by 536870912. The
      product of the two sizes is 576460752303423488. Their sum is 1610612736.
    - >-
      Two width-30 tables each store 536870912. Their gap is 0 and their
      product is 288230376151711744.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-31 table stores 1073741824 entries. The width-30 table stores
      536870912. The gap of two width-30 tables is 0.
    formula: >-
      Compute 2 to the power 30. Compute 2 to the power 29. Subtract
      536870912 from 1073741824. Multiply 1073741824 by 536870912. Subtract 536870912 from 536870912.
    source: >-
      IDEA-20261004-259f16 states the widths 31 and 30 and the sizes
      1073741824 and 536870912, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 576460752303423488 and the nearby gap 0 are required. A check that stops at the size 1073741824 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 1073741824 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 30 is not 1073741824.
    - Two to the power 29 is not 536870912.
    - The gap is not 536870912.
    - The product is not 576460752303423488.
    - Both tables are reported as size 536870912, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-31 table stores 1073741824 entries, that
    the width-30 table stores 536870912, and that 1073741824 exceeds 536870912 by 536870912.
  falsification_criterion: >-
    The runs agree that the width-31 table size is computed, and
    that size is not 1073741824.
  required_artifacts:
    - experiments/EXP-ECDLP-78d58b/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-78d58b/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-78d58b/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-78d58b/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-78d58b/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-78d58b/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 536870912 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
