experiment:
  id: EXP-HQCX-12b5f9
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-b336a3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-b336a3
  question_id: RQ-HQC-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Bias-corrected per-failure information count for HQC at reduced parameters: mutual information
    between a pre-declared key functional and the block-failure pattern, with permutation and key-independent
    nulls in one invocation'
  objective: 'The one uncertainty a run reduces: how many bits about the secret a single observed
    HQC decoding failure carries at parameters where the question can be measured at all. A run establishes
    (i) a bias-corrected estimate of I(G ; F | S > 0) in bits per observed failure, for a key functional
    G declared before any data exists; (ii) the estimator''s own floor at that sample size, fixed
    empirically by a label-permutation null whose true value is exactly zero, and cross-checked by
    a structural key-independent null that must agree with it; and (iii) the ratio between the pattern-based
    value and the value obtainable from the scalar failure bit alone, which decides whether tracking
    the pattern is worth anything. The run reduces uncertainty in exactly one direction: it turns
    an unmeasured quantity into either a number with intervals or an explicit upper bound at the achieved
    sample size. It constructs no adversary and simulates no attack. No attack, break, speedup or
    security consequence is claimed here or would follow from a run. No statement is made about what
    the published literature does or does not contain; this environment cannot reach external literature.
    No direction is declared impossible.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable scope: at the executed reduced parameter
      set, with the declared functional G, the declared alphabet and the achieved conditioned sample
      count, the mutual information between G and the observed failure pattern is a stated number
      of bits with stated confidence intervals, above a stated empirical null floor. WHAT DOES NOT
      FOLLOW: no key recovery, no attack, no query count, no procedure; nothing about deployed HQC
      parameters, where the failure rate makes this measurement impossible by design; nothing about
      I(key ; F) beyond the lower bound the projections give; and nothing about the correctness of
      HQC''s analytic DFR model, which this run does not evaluate.'
  inputs:
    procedure: 'STAGE 0 (zero compute): pre-register G, the coarsening alphabet, the estimator, the
      conditioning rule and the minimum effect; compute the estimator''s analytic bias as a function
      of alphabet size and sample count. STAGE 1 (minutes, disjoint seed stream): tune weights so
      the per-trial failure probability lands near 1e-2; record the tuning seeds and retire them.
      STAGE 2 (minutes, T = 1e6): generate trials, recording (G, F) per trial. STAGE 3 (seconds):
      compute the signal-arm estimate on the conditioned subsample. STAGE 4 (minutes): compute the
      permutation null over 200 independent permutations, and the structural null on synthetic key-independent
      patterns matched to the measured per-block rates. STAGE 5 (an hour): repeat STAGES 2-4 across
      the T ladder {1e5, 3e5, 1e6, 3e6} and the two alphabet coarsenings. STAGE 6 (zero compute):
      report all values with intervals, the convergence check and the per-block decomposition.'
    instrument: Python 3.11 with numpy; NO Sage. Trial generation reuses the same bit-packed GF(2)
      ring arithmetic and numpy fast Walsh-Hadamard Reed-Muller decoder as the other contracts in
      this batch, so the pipeline is shared and differential-testable. Mutual information by a plug-in
      estimator with Miller-Madow correction written directly from its definition in fewer than fifty
      lines, with an independent exact computation on a synthetic joint distribution as a unit test.
      Permutation null by numpy random permutation of the G column only. Runs recorded through harness/runner.py
      so seeds and the resolved inference block land in the manifest.
    parameters: n = 227 with ord_n(2) = n-1 checked at run time; inner code RM(1,5) length 32, duplication
      1; n_e = 7; N = 224; outer radius delta = 2. Input weights tuned on a disjoint seed stream to
      give a per-trial failure probability in [5e-3, 2e-2]. Key functional G = per-block secret-weight
      profile coarsened to a 4-symbol alphabet (primary) and to a 2-symbol alphabet (sensitivity).
      T ladder {1e5, 3e5, 1e6, 3e6}. 200 permutations for the permutation null. One structural null
      per T rung. All seeds from a ladder frozen in the specification before data generation.
  controls:
  - Label-permutation null on the identical estimator, same invocation, multiple independent permutations
    to get its own confidence interval.
  - Structural key-independent null matched to the measured per-block rates and pairwise structure.
  - Sample-size ladder in T, with convergence as a reporting precondition.
  - 'Alphabet-size sensitivity: repeat at two coarsening levels, so a result that depends entirely
    on the alphabet is exposed.'
  - Pre-registration of G, the alphabet and the estimator before any data generation, verified by
    the design document predating the data.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): TWO nulls, both executed in the same invocation as the signal arm and
    both on the identical estimator code path. NULL-1, label permutation: recompute the identical
    estimate after randomly permuting which key produced which pattern, destroying the association
    while preserving both marginals exactly. Its true value is zero by construction, so its estimate
    is the estimator''s bias-plus-noise floor at this sample size. NULL-2, structural: generate F
    from a key-independent process matched to the measured per-block rates and pairwise structure,
    and estimate again. FOR THE SIGNAL ARM TO MEAN ANYTHING: NULL-1 and NULL-2 must agree with each
    other within their confidence intervals - if they do not, the estimator responds to something
    other than key dependence and no signal-arm number is reportable - and the signal arm must exceed
    both by more than the pre-declared minimum effect. A signal arm that sits on the null floor is
    reported as a measured upper bound on per-failure information at the executed sample size, which
    is a result and not a failure.'
  independent_variables:
  - sample size T
  - coarsening alphabet size for G
  - 'arm: signal / label-permutation null / structural key-independent null'
  - 'observable: full pattern F versus the scalar failure bit'
  metrics:
    primary:
    - bias-corrected I(G ; F | S > 0) in bits
    - permutation-null estimate
    - structural-null estimate
    - I(G ; 1{S > delta}) and the pattern-to-scalar ratio
    secondary:
    - per-block mutual-information terms and their sum
    - achieved conditioned sample count per rung
    - analytic plug-in bias versus the measured permutation floor
    - wall-clock seconds per rung
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The excess Delta := I-hat(G ; F | S > 0) minus the mean permutation-null estimate, in
      bits per observed failure, at T = 3e6 with the 4-symbol alphabet.
    formula: I(G ; F) := sum over (g, f) of p(g, f) log2 [p(g, f) / (p(g) p(f))], estimated by plug-in
      on the failure-conditioned subsample with the Miller-Madow correction (m - 1)/(2 T ln 2) applied
      per marginal, where m is the number of observed cells. Predicted Delta >= 0.01 bits. Under the
      null hypothesis of key-independent failures, Delta = 0 exactly and the estimate concentrates
      on the permutation floor.
    source: Pre-registered in the parent proposal IDEA-20260816-b336a3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Executed at n = 227 with a deliberately inflated failure rate near 1e-2, chosen
      because the estimand is only measurable where failures are common. This is not merely smaller
      than deployed HQC - it is in a different operating regime, and the proposal states plainly that
      NO transfer assumption is offered and none should be inferred. What the run measures is whether
      the pipeline's failure patterns are key-informative at all in a regime where the question is
      answerable; the deployed regime remains untouched and unclaimed.
    correspondence: null
  tail_checks:
  - Report the number of distinct patterns actually observed against the 2^{n_e} possible, since an
    estimate over a sparsely observed alphabet is dominated by bias.
  - Check the permutation-null spread across all 200 permutations, not just its mean, and report its
    upper quantile as the practical floor.
  - Verify that the conditioned subsample's per-block rates match the unconditioned ones in the structural
    null, which is what makes it matched.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort if ord_n(2) != n-1.
  - Abort if the achieved conditioned sample count at any rung falls below 1000, and report the shortfall
    rather than the estimate.
  - Stop at the declared T ladder; no adaptive extension after seeing an estimate.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The two nulls agree within their intervals, the estimate converges across the
    T ladder, and the run reports Delta with its confidence interval and the pattern-to-scalar ratio
    - whatever their values.
  falsification_criterion:
  - 'Delta is below 0.01 bits at the largest T: the recorded obstruction is a measured upper bound
    on per-failure information at this sample size and regime.'
  - 'The permutation and structural nulls disagree: the instrument is void and nothing is reported.'
  - 'The estimate does not converge across the ladder: no value is reported.'
  - 'The pattern-to-scalar ratio is 1 within error: the pattern framing carries nothing and is withdrawn.'
  - 'Results reverse between the two alphabet coarsenings: the number is a functional artefact.'
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-b336a3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact definition of the per-block secret-weight profile and its coarsening thresholds is not
    fixed here; a Coordinator must freeze it, because a functional chosen after seeing data would
    inflate the estimate arbitrarily and the freeze is what makes the number honest.
  - The structural null's matching depth - per-block rates only, or per-block rates plus measured
    pairwise structure - must be decided in advance, since a null matched too loosely will disagree
    with the permutation null for uninteresting reasons.
  - Whether Delta should be reported per observed failure or per trial needs a written ruling; both
    are defensible and mixing them would make the number uninterpretable.
  - The defence of the inflated-failure-rate regime as HQC-shaped is asserted and needs an explicit
    written scope statement before approval.
