experiment:
  id: EXP-DREG-519ad9
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-DREG-152cff
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  title: >-
    Zero-compute validation of the block-incidence column law for the boolean
    chained Semaev family at t=3, against six committed column integers, with a
    full-support null whose forced value is 0 and a graded cross-block control

  objective: >-
    If separately approved, authorized and executed, decide whether the Macaulay
    column set of the boolean chained Semaev system at t = 3, ti = 0 is
    determined by the variable-block incidence pattern alone, by evaluating the
    parameter-free closed form of H-DREG-152cff against every committed column
    integer in GOAL-DREG-001's artifacts, rebuilding the column SET from
    committed supports where they are recoverable, and emitting forced
    out-of-sample counts for the rungs nobody has built. The whole contract is
    integer arithmetic and set construction; no rank, no Groebner basis, and no
    solver is involved at any stage.

  what_this_is_not:
    - Not a rank measurement, a deficit measurement, a d_reg measurement, or a first-fall-degree measurement.
    - Not evidence for or against H-DREG-001, H-SIG-001, the polynomial-solve scenario, or the sub-rho scenario.
    - Not a discrete-logarithm computation, relation collection, or any ECDLP attack.
    - Not an ECDLP cost, asymptotic, exponent, cryptographic-scale, or deployed-scheme claim.
    - Not a lifting of the BATCH-002 quarantine on the 17,947 headline, which is a Coordinator decision under AGENTS.md rule 1.
    - Not an amendment to GOAL-DREG-001's next_action, completion criteria, or any committed checkpoint.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence of any kind.

  claim_ceiling: >-
    Tier TOY, and it cannot be raised by any downstream citation. The exact scope
    a completed run could support is: for the boolean chained Semaev family built
    by src/semaev_tree.py at t = 3, ti = 0, m = 3, over GF(2), at sizes
    n in {9, 12, 15, 17, 18, 21} and degrees D in {3,4,5,6}, the number of
    Macaulay columns and the number of missing monomials per degree are given
    exactly by the stated closed form (or are not). NOTHING about rank, solving
    degree, cost, prime fields, t >= 4, or cryptographic scale may be concluded,
    and no run of this contract can support or reject an ECDLP claim.

  inputs:
    builder: src/semaev_tree.py
    builder_copies_to_diff:
      - experiments/EXP-SIG-001/src/semaev_tree.py
      - experiments/EXP-SIG-002/src/semaev_tree.py
      - experiments/EXP-SIG-003/src/semaev_tree.py
      - experiments/EXP-SIG-005/src/semaev_tree.py
      - experiments/EXP-SIG-006/src/semaev_tree.py
      - experiments/EXP-SIG-007/src/semaev_tree.py
      - experiments/EXP-SIG-008/src/semaev_tree.py
      - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N17-SEM-A/code/semaev_tree.py
      - experiments/EXP-DREG-001/runs/RUN-DREG-001-MEASURE-N17-NULL-B/code/semaev_tree.py
    t: 3
    ti: 0
    m: 3
    field: GF(2)
    n_values_validation: [9, 12, 15, 17, 18, 21]
    n_values_forward_only: [24, 27, 30]
    degrees: [3, 4, 5, 6]
    derived_parameters:
      k: "ceil(n/3)"
      nb: "n + 3*k"
      blocks: "U size n; X1, X2, X3 size k each"
      N: "N(v,D) = sum_{j<=D} C(v,j)"
    closed_form_under_test:
      u_D: "C(3k,D) + 2*C(n+k,D) - 2*C(k,D) - C(n,D)"
      u_Dm1: "2*C(k,D-1)"
      u_below: "0 for every degree <= D-2"
      ncols: "N(nb,D) - u_D - u_Dm1"
    master_seed: 5190439
    domain: EXP-DREG-519ad9/v1
    seed_derivation_rule: >-
      Seeds are needed only for the null and graded arms, which draw random
      supports. For arm label L, size n, degree D and replicate r, the seed is
      the big-endian unsigned integer of SHA-256 over the ASCII bytes of
      domain || "|" || L || "|" || decimal(n) || "|" || decimal(D) || "|" ||
      decimal(r) || "|" || decimal(master_seed), reduced mod 2^64. Support
      sampling uses Python's random.Random(seed) and draws without replacement in
      sorted index order, so a third party reproduces every support set
      bit-for-bit from (L, n, D, r) alone. Replicates are r = 0..4.
    committed_targets:
      - {quantity: "u_5 at n=9", value: 1584, source: "ledger/hypotheses/H-SDEG-0dd021.yaml mechanism, ingredient (ii)"}
      - {quantity: "u_6 at n=9", value: 1848, source: "ledger/hypotheses/H-SDEG-0dd021.yaml mechanism, ingredient (ii)"}
      - {quantity: "u_6 at n=12 seed 2026", value: 16016, source: "coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016 results.json admission metric deleted_degree_histogram_equals_6_16016 (as cited by H-SDEG-0dd021 and EV-DREG-008)"}
      - {quantity: "u_6 at n=12 seed 2", value: 16018, source: "ledger/hypotheses/H-SDEG-0dd021.yaml heuristic HEUR-BF-1"}
      - {quantity: "ncols at n=9 D6 (arm N1)", value: 29332, source: "EV-SIG-006 as cited by H-SDEG-0dd021 predictions G3"}
      - {quantity: "ncols at n=12 D6 seed 2026", value: 174035, source: "H-SDEG-0dd021 heuristic HEUR-BF-1 and TASK-20260731-016 anchors"}
      - {quantity: "ncols at n=21 D5", value: 778394, source: "GOAL-DREG-001 BATCH-003 checkpoint (EXP-DREG-004 progress denominator 392,000/778,394)"}
      - {quantity: "N(24,6)", value: 190051, source: "TASK-20260731-016 results.json ncols_null_full, as cited by H-SDEG-0dd021"}
      - {quantity: "nrows(9,6) / nrows(12,5) / nrows(12,6)", value: [45324, 31512, 183312], source: "H-SDEG-0dd021 baseline-reproduction audit"}
    provenance_caveat: >-
      Several of the committed targets above are read from H-SDEG-0dd021's
      transcription rather than opened directly in the session that wrote this
      contract. Stage 0 resolves each to its primary artifact path and records
      RESOLVED / UNREACHABLE per target. An UNREACHABLE target is dropped from
      the success criterion and its unreachability is reported; it is never
      counted as a pass.

  arms_and_controls:
    treatment:
      label: LAW
      description: >-
        Evaluate the closed form at every validation cell and compare to the
        resolved committed targets. Then, where supports are recoverable,
        construct the column SET from the supports by the up-closure rule and
        compare set hashes (not merely counts) to the predicate of
        H-DREG-152cff step 3.
    measured_null:
      label: FULL
      description: >-
        A random boolean system with the SAME degree histogram (n quadrics and n
        cubics) and the SAME nb variables but FULL supports - every quadric's
        support drawn from all degree-<=2 monomials in nb variables, every
        cubic's from all degree-<=3 monomials, sizes matched to the sem's
        per-equation support sizes.
      forced_value: >-
        u_j = 0 for every j and every D >= 2, hence ncols = N(nb,D) exactly.
        DERIVED BEFORE THE RUN and it CAN FAIL: any nonzero missing count means
        the up-closure implementation is wrong.
    positive_control:
      label: N9
      description: >-
        The n = 9 cell, whose missing counts (1,584 at D5 and 1,848 at D6) are
        committed by the EV-SIG-006 lineage, independent of the n = 12 and n = 21
        cells. The effect - a large nonzero missing count with the whole
        deficiency in the top degree - MUST appear here.
      requirement: >-
        If N9 is not reproduced exactly, the instrument is broken and NO result,
        positive or negative, may be reported from any other cell.
    graded_control:
      label: GRAD
      description: >-
        Interpolate between block supports and full supports by adding a fraction
        f of the forbidden cross-block monomials (X1-X3 pairs, X2-X3 pairs, and
        U-free triples) to the equation supports, f in {0, 0.25, 0.5, 0.75, 1},
        5 interior points, at n = 9 and n = 12, D = 5 and 6.
      requirement: >-
        u_D must decrease STRICTLY MONOTONICALLY in f and reach EXACTLY 0 at
        f = 1. Monotonicity is reported as a verdict, not as a plot. A quantity
        that fails to decay as f rises is the canonical artifact tell.
    nearby_object_control:
      label: PERM
      description: >-
        The block-permuted system: same block sizes, but the degree-3 family
        placed on (U, X3) and the degree-2 family on (U, X1, X2).
      forced_value: >-
        A DIFFERENT closed form, obtained by swapping the two reachability
        conditions, hence a different u_D. If the measured u_D of PERM equals
        LAW's, the observable responds to block sizes rather than to incidence
        and H-DREG-152cff step 3 is under-determined.
    ordering_control: >-
      The FULL and PERM arms are executed and their numbers written to the
      results artifact BEFORE the LAW arm's comparison to the committed targets
      is looked at. The frozen decision rule is executed on FULL first; if it
      emits the same label on FULL and on LAW it discriminates nothing and must
      be rewritten before the committed targets are read.
    comparability_policy: >-
      All arms share the same (n, D), the same nb, the same block sizes, the same
      per-equation support SIZES, the same up-closure implementation and the same
      counting convention (columns of all degrees <= D, stated explicitly with
      every number). Any arm differing on any of these is reported separately and
      never differenced against another.

  metrics:
    primary:
      - name: committed_target_match
        definition: >-
          For each RESOLVED committed target, the signed difference between the
          closed form's value and the committed value. Reported per target.
        units: monomials (integer)
      - name: column_set_hash_match
        definition: >-
          SHA-256 of the sorted canonical encoding of the column set built from
          supports, versus the same hash of the set defined by the predicate.
          Boolean per cell, with the count of symmetric-difference monomials and
          up to 20 of them exhibited by name when nonzero.
        units: boolean plus monomial count
      - name: full_support_null_missing_count
        definition: "u_j of the FULL arm at every j <= D. Forced value 0."
        units: monomials (integer)
    secondary:
      - name: forward_predictions
        definition: >-
          ncols and per-degree u_j at n in {15,17,18,24,27,30}, D in {5,6},
          emitted as pre-registered values for future rungs.
        units: monomials (integer)
      - name: seed_residual_explanation
        definition: >-
          For n = 12 D6 seed 2, the list of support pairs/triples absent from the
          union support, with its cardinality, to be compared against the
          residual 16,018 - 16,016 = 2.
        units: named monomials
      - name: grad_monotonicity
        definition: "Verdict in {strictly_monotone, non_monotone} plus the 5 values."
        units: categorical
      - name: perm_separation
        definition: "u_D(PERM) - u_D(LAW) at each cell."
        units: monomials (integer)
      - name: arm_r_discrepancy
        definition: >-
          The law's u_5 at n=12 (8,736) against H-SDEG-0dd021's cited arm-R value
          (8,746), with a statement of whether the two refer to the same object.
        units: monomials (integer) plus prose verdict
      - name: builder_diff
        definition: "Per-copy diff status of semaev_tree.py against src/."
        units: categorical

  preregistered_prediction:
    quantity: >-
      u_D, u_{D-1}, u_{<=D-2} and ncols at every validation cell, plus the
      forward set.
    formula: >-
      k = ceil(n/3); nb = n + 3k; N(v,D) = sum_{j<=D} C(v,j);
      u_D = C(3k,D) + 2*C(n+k,D) - 2*C(k,D) - C(n,D);
      u_{D-1} = 2*C(k,D-1); u_j = 0 for j <= D-2;
      ncols(n,D) = N(nb,D) - u_D - u_{D-1}.
    source: >-
      ledger/hypotheses/H-DREG-152cff.yaml mechanism steps 1-4, derived from
      src/semaev_tree.py lines 50-52, 55-87 and 90-171.
    values_frozen_here:
      committed_cells:
        "u_5(9)": 1584
        "u_6(9)": 1848
        "ncols(9,6)": 29332
        "u_6(12)": 16016
        "ncols(12,6)": 174035
        "u_5(21)": 196518
        "u_4(21)": 70
        "ncols(21,5)": 778394
      forward_cells:
        "ncols(15,5)": 143421
        "ncols(17,5)": 314472
        "ncols(18,5)": 358678
        "ncols(24,5)": 1522577
        "ncols(30,5)": 4669266
        "ncols(15,6)": 690690
        "ncols(18,6)": 2122294
        "ncols(21,6)": 5467260
        "u_5(18)": 84996
        "u_6(18)": 269190
      null_arm:
        "u_j(FULL) at every j and every cell": 0
    in_sample_disclosure: >-
      THE COMMITTED-CELL VALUES ARE IN-SAMPLE. They were available when the
      closed form was written and their reproduction is a REPRODUCTION, never a
      prediction. Only the forward cells and the FULL/GRAD/PERM arms are
      out-of-sample. Every reported conclusion must carry this distinction.

  stages:
    - id: S0
      name: provenance resolution
      cost: "reading, <= 30 min, zero compute"
      terminates_run: false
      description: >-
        Resolve each committed target to a primary artifact path; mark
        RESOLVED / UNREACHABLE. Diff the semaev_tree.py copies. Record the
        environment probe verbatim (`python3 -c "import numpy"` and
        `python3 -c "import sys;sys.path.insert(0,'src');import semaev_tree"`).
    - id: S1
      name: closed-form evaluation
      cost: "seconds, pure Python integer arithmetic"
      terminates_run: true
      description: >-
        THE CHEAPEST DECISIVE GATE AND IT RUNS FIRST. Evaluate the closed form at
        every RESOLVED committed cell. If any resolved target is missed, the
        hypothesis is falsified (F1) and the run ENDS here with that result. This
        stage needs no system, no supports, no solver and no seed.
    - id: S2
      name: set-level verification and controls
      cost: "<= 30 min, pure Python set construction"
      terminates_run: false
      description: >-
        Where supports are recoverable, build the column SET by up-closure and
        compare hashes. Run the FULL null arm (forced 0), the PERM nearby control
        and the GRAD graded arm at n = 9 and n = 12. FULL and PERM are written
        first per the ordering control. Explain the n = 12 seed-2 residual by
        exhibiting absent support monomials.
    - id: S3
      name: forward emission
      cost: "seconds"
      terminates_run: false
      description: >-
        Emit the forward cells as pre-registered values, and record the arm-R
        discrepancy (8,736 vs 8,746) with its verdict.

  replication:
    seeds: [0, 1, 2, 3, 4]
    seed_scope: >-
      Seeds apply ONLY to the FULL, GRAD and PERM arms, which draw random
      supports. The LAW arm is deterministic in (n, D) and has no seed - which is
      itself the hypothesis's claim and is why a seed-dependence in the LAW arm
      would be a falsification rather than noise.
    replicates_per_cell: 5
    determinism_requirement: >-
      Re-running any arm with the same (L, n, D, r) must reproduce the identical
      support set hash and the identical counts. A non-reproducible arm is
      invalid.

  budget:
    wall_clock_seconds: 3600
    cpu_seconds: 3600
    memory_gb: 4
    max_runs: 40
    note: >-
      No stage requires a rank computation, a Groebner basis, Sage, or any
      external solver. The dominant cost is set construction at n = 21 D = 5
      (about 7.8 x 10^5 columns), which is comfortably inside the budget. If any
      stage exceeds its budget the cause is an implementation defect, and the
      correct report is an infrastructure receipt.

  stopping_rules:
    - S1 fails at any resolved committed target -> STOP, report F1, do not run S2 or S3.
    - The FULL null arm returns a nonzero missing count -> STOP, report instrument failure, no other number is reportable.
    - The N9 positive control is not reproduced exactly -> STOP, instrument broken, no result reported.
    - Wall clock exhausted -> STOP and report which cells completed, as infrastructure signal.
    - More than half the committed targets resolve UNREACHABLE -> STOP and report the provenance failure as the deliverable.

  invalidation_rules:
    - Any arm whose support set hash is not reproducible from its declared seed is invalid.
    - Any number reported without its counting convention (all degrees <= D, versus degree exactly D) is invalid.
    - Any comparison between arms that differ in nb, block sizes, degree histogram, per-equation support sizes, or counting convention is invalid.
    - Any committed target counted as a pass without a resolved primary artifact path is invalid.
    - Any conclusion about rank, deficit, d_reg, cost or prime fields drawn from this contract is invalid on its face.

  success_criterion: >-
    ALL of: (a) every RESOLVED committed target reproduced with signed difference
    EXACTLY 0, with at least four targets resolved and at least two of them from
    a lineage other than TASK-20260731-016; (b) the FULL null arm returns missing
    count exactly 0 at every cell and every seed; (c) the N9 positive control
    reproduced exactly; (d) the GRAD arm strictly monotone in f and exactly 0 at
    f = 1; (e) where supports were recoverable, column set hashes match with
    symmetric difference exactly 0; (f) the forward set emitted. Partial success
    - (a) through (d) holding but (e) unreachable because supports could not be
    recovered without Sage - is reported as PARTIAL with the count-level result
    only, and the set-level obligation carried forward as unmet.

  falsification_criterion: >-
    ANY of: a resolved committed target missed by any nonzero amount; a column
    present in the built set and absent from the predicate, or vice versa; a
    support containing a monomial the block decomposition forbids (an X1-X3 pair,
    an X2-X3 pair, a U-free triple, or a degree-1 monomial in the cubic family);
    the FULL arm returning nonzero; the GRAD arm non-monotone or nonzero at
    f = 1; or a seed-dependence in the LAW arm exceeding what named absent
    support monomials account for. The failing monomial or cell is EXHIBITED BY
    NAME in every case; a negative that names nothing has not finished and its
    honest status is unverified (inventor protocol section 4).

  required_artifacts:
    - results.json with every metric above, per cell, per arm, per seed
    - provenance table: committed target -> primary path -> RESOLVED/UNREACHABLE -> value read
    - the exact commands, git commit, dirty-tree state, Python version and numpy version
    - environment probe transcript for numpy, sage and semaev_tree import
    - column set hashes per cell and arm, with the hashing convention stated
    - the exhibited symmetric-difference monomials where nonzero (up to 20)
    - the named absent support monomials explaining the n=12 seed-2 residual, or a statement that none was found
    - the semaev_tree.py copy diff table
    - the forward-prediction table, frozen and timestamped
    - stdout and stderr

  scale_relevance:
    tier: toy
    statement: >-
      Every cell is toy scale (n <= 21 boolean unknowns, nb <= 42) and no
      conclusion transfers to cryptographic parameters. The closed form is an
      ALGEBRAIC IDENTITY in (n, D) rather than an extrapolation, so evaluating it
      at n = 30 or n = 161 is arithmetic and not a scale claim - but a VALIDATION
      of it exists only where a committed measurement exists, i.e. at
      n in {9, 12, 21}. Its limit is stated: t >= 4 changes the block graph from
      two blocks sharing a vertex to a path, and prime fields break the char-2
      Frobenius step at the derivation's first line. Neither is in scope.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory, missing dependency, unreadable artifact, or
    unresolvable committed target is INFRASTRUCTURE SIGNAL and is recorded as
    failed_infrastructure with its cause. It is NEVER negative mathematical
    evidence and never counts toward the falsification criterion (AGENTS.md
    rule 5). Specifically: Sage is absent from the container verified while this
    contract was written, so if the sem supports cannot be recovered without it,
    stage S2's set-level obligation is reported UNMET as infrastructure and the
    count-level result stands on its own. The host ENOSPC and OOM history of this
    goal (GOAL-DREG-001 execution_status.infra_note, INC-20260724-EXFAT-01/-02)
    is the reason this clause is stated explicitly rather than assumed.

  authorization_note: >-
    This contract is status review_required, is not frozen, and carries no
    approved_by field. Only the Coordinator may approve, freeze or authorize
    execution (AGENTS.md rule 1). It supersedes no existing contract, edits no
    existing record, and does not alter GOAL-DREG-001's next_action or any
    committed checkpoint.

  inference:
    requested_policy: research-deep
    resolved_model_id: claude-opus-5
    reasoning_effort: null
    fallback_used: true
    fallback_reason: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml. Recorded, never silently substituted.
    degraded_allowed: false
    degraded_requirements: []
    model_verified: false
    model_verified_reason: >-
      No adapter probe receipt exists for this session.
