experiment:
  id: EXP-XEDN-5202c1
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-XEDN-beb408
  question_id: RQ-XEDN-003
  goal_id: GOAL-XEDN-002
  title: >-
    Prescribed-support cost audit of the function-field xedni construction:
    measure the solution-count exponent 12 - 3k, locate the free-plant boundary,
    and measure the unmeasured dependence exponent delta

  objective: >-
    If separately approved, frozen and authorized, measure the three quantities
    that convert the XEDN lane's uncosted census into a priced construction.
    (1) The solution-count exponent for planting k prescribed sections, predicted
    to be 12 - 3k, i.e. 9, 6, 3, 0, -3 at k = 1..5. (2) The free-plant boundary,
    predicted to be exactly k = 4. (3) The rate at which four planted prescribed
    sections are DEPENDENT -- the only route to a relation supported on the
    prescribed set -- from which the exponent delta in
    T(k,p) ~ 2^k p^(max(0,3(k-4))) p^delta is estimated. NO VALUE OF delta IS
    PREDICTED; predicting one without a derivation is the failure this contract
    exists to avoid. NO ATTACK IS ATTEMPTED AND NONE IS CLAIMED.

  what_this_is_not:
    - Not a discrete-logarithm computation, a relation collection run, a lifting attack, or an ECDLP attack of any kind.
    - Not an ECDLP cost claim. T(k,p) is a PER-RELATION expectation that excludes the consuming index calculus's B relations, excludes its linear-algebra stage entirely, and charges no memory.
    - Not a claim that a Mordell-Weil relation specialises usefully to a relation among target points; the specialisation-injectivity gap is DECLARED UNMET.
    - Not a re-run or a correction of EXP-XEDN-005; that contract requires Sage, absent here.
    - Not a status change to any XEDN record.
    - Not a closure. DEC-20260724-021's published forbidden-sentence list binds this contract verbatim: nothing produced here may be quoted as "the multi-section or Mordell-Weil relation-source route is closed", "no lifting-based relation source exists over F_p(t)", or "section-rich surfaces are exponentially rare over F_p(t)".
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: measured solution-count exponents for the prescribed-section
      Weierstrass system over p in {7,13,19,31} at k in {1,2,3,4,5}; a measured
      free-plant boundary; a measured dependence rate at k = 4 with its
      regression; and an assembled per-relation expectation with every factor
      labelled measured, derived or unmeasured. NOTHING ABOVE TOY. The prime
      range spans under half a decade in log p and no extrapolation to
      cryptographic p is made, implied, or admissible.

  environment_preconditions:
    measured_this_session_not_assumed:
      numpy: "2.4.6, imports"
      sympy: "ABSENT"
      sage: "ABSENT"
      frozen_predicate: >-
        experiments/EXP-XEDN-001/xedni_sections.py, sha256
        76f0cfe2f32362ff1110fc7c7b42db40d293099ae7718927c46223a42450b34f, pure
        Python, imports cleanly.
    consequence: >-
      The counting arm (Stages 0-1) needs NO elliptic-curve arithmetic at all --
      it is linear algebra over F_p plus a square test -- and the dependence arm
      (Stage 2) needs a pure-Python Mordell-Weil group law over F_p(t) on
      polynomial pairs. A missing dependency is infrastructure signal, never
      negative mathematical evidence (AGENTS.md rule 5).

  inputs:
    primes: [7, 13, 19, 31]
    k_values: [1, 2, 3, 4, 5]
    family:
      form: "y^2 = x^3 + a(t) x + b(t)"
      deg_a_max: 4
      deg_b: 6
      section_shape: "deg x <= 2, deg y <= 3"
      filters_for_the_baseline_cell: "a != 0, deg a <= 4, deg b = 6, 4a^3 + 27b^2 not identically zero, j non-constant -- identical to fiber_find_rich_surfaces"
    tuples_per_cell_min: 2000
    seeds:
      master_seed: 5202001
      domain: "EXP-XEDN-5202c1/v1"
      derivation_rule: >-
        For stream label L, prime p, arity k and counter n, the seed bytes are
        SHA-256(UTF-8 of (domain || "|" || L || "|" || decimal(p) || "|" ||
        decimal(k) || "|" || decimal(n))), digests read big-endian unsigned.
        Stream labels, and no others: "presc" (prescribed x-tuples in the
        treatment arm), "nullx" (uniform random x with no curve provenance),
        "freex" (the nearby-object arm where x is a free unknown), "dep"
        (dependence arm draws). A third party reproduces every tuple
        bit-for-bit from the master seed, the label, p, k and n.
    x_tuple_draw_rule: >-
      Each x_i is formed from 3 consecutive digest-derived integers reduced mod
      p, giving a polynomial of degree <= 2. Duplicate x_i within a tuple cause
      the tuple to be discarded and n incremented, with the discard count
      recorded. In the treatment arm the tuple is additionally required to be a
      set of lifts of points on a curve constructed from the same stream, with
      the construction transcript recorded; in the null arm no such requirement
      is applied, and that is the ONLY difference between the two arms.
    solver:
      description: >-
        For fixed (x_i, y_i) the identity y_i^2 = x_i^3 + a x_i + b is LINEAR in
        the 12 unknown coefficients of (a, b). The solver enumerates the y-side
        by the square condition rather than by brute force over y: for each
        candidate (a, b) in the solution space of the linear system induced by a
        chosen subset, the frozen is_square_poly predicate decides whether
        x_i^3 + a x_i + b is a square and returns h, and the square-class factor
        is handled by testing both signs exactly as the census code does.
      exactness: >-
        All arithmetic is exact over F_p with Python integers. No floating point
        enters any count; the regressions are the only place floating point is
        used and their inputs are exact rationals.

  arms_and_controls:
    treatment: >-
      Prescribed x-tuples that ARE lifts of curve points, k in {1..5},
      p in {7,13,19,31}. Reported quantity: the histogram of solution counts per
      tuple, and from it the mean and log_p exponent, with the square-class
      factor divided out and reported separately.
    measured_null: >-
      NULL-X: prescribed x-tuples drawn uniformly with NO curve provenance,
      identical in every other respect, run through the identical code path.
      FORCED VALUE DERIVED PRE-RUN: identical exponents at every k and every p,
      within +/- 0.4 in log_p units, BECAUSE THE PARAMETER COUNT CANNOT SEE WHERE
      x_i CAME FROM. This null can fail, and its failure would be the more
      interesting outcome: a difference means the count is not the operative
      mechanism and something about the lifts is doing work.
    nearby_object_control: >-
      FREE-X: the identical machinery with x treated as a FREE unknown
      (12 + 7k unknowns against 7k equations) rather than prescribed. The
      hoped-for conclusion -- that prescription is expensive -- FAILS there by
      construction: the exponent is 12, constant in k, never negative. If the
      free-x arm returns the same exponents as the prescribed arm, the method is
      not measuring prescription, has not identified the load-bearing structure,
      and NO cost statement may be made.
    positive_control: >-
      CTRL-K2: the k = 2 cell under the census sampler's exact filters must
      reproduce the committed behaviour of fiber_find_rich_surfaces in
      experiments/EXP-XEDN-005/implementation/run_census.sage -- a working
      sampler with abundant solutions, comparable in yield per pair examined to
      the fiber_pairs_budget recorded per surface in
      experiments/EXP-XEDN-005/runs/RUN-XEDN-005-MAIN/raw-result.json, within a
      stated factor of 4. IF CTRL-K2 DOES NOT REPRODUCE A WORKING SAMPLER, THE
      IMPLEMENTATION IS BROKEN AND NO NEGATIVE STATEMENT ABOUT ANY k MAY BE
      REPORTED. This is the sensitivity demonstration and its comparator is a
      committed artifact rather than an expectation.
    graded_control: >-
      The k sweep {1,2,3,4,5} IS the graded control, with 5 interior points and
      monotonicity reported. The forced sequence of exponents is 9, 6, 3, 0, -3:
      strictly decreasing with constant step -3. A flat sequence means the solver
      is finding spurious solutions -- the canonical artifact tell, a quantity
      that fails to decay as the parameter meant to destroy it increases -- and
      forces an artifact report. A decreasing sequence with a different constant
      step refutes HEUR-P1 cleanly. A non-monotone sequence localises the error
      to a specific k instead of leaving "the model did not fit".
    ordering_control: >-
      The forced exponents 9, 6, 3, 0, -3, the k = 4 boundary, and the free-x
      forced exponent 12 are written and hash-committed BEFORE any cell is run.
      NULL-X is run, analysed and hash-committed BEFORE the treatment arm is
      looked at.
    comparability_policy: >-
      No number here may be compared with an EXP-XEDN-002..007 number except
      CTRL-K2's explicit reproduction of the committed sampler, and that
      comparison is stated with its factor-of-4 tolerance in advance. The
      measured marginal exponent is compared with DEC-20260724-021's alpha = 3 as
      a CROSS-CHECK between two derivations, not as a replication of a
      measurement, and the report must say which.

  metrics:
    primary:
      - P1_solution_count_exponent: log_p of the mean solution count per prescribed k-tuple, per (k, p), square-class factor divided out
      - P2_free_plant_boundary: the largest k with mean solution count >= 1 at every tested p
      - P3_marginal_exponent: d(log_p mean solution count)/dk, with uncertainty
      - P6_prescribed_support_nonzero_rate: fraction of k = 4 surfaces on which L(S;Q) is nonzero, group-law verified
      - P7_delta: regression of log(1/rate) against log p, with residuals
    secondary:
      - P4_null_arm_exponents: NULL-X exponents per (k, p)
      - P5_free_x_exponents: FREE-X exponents per (k, p)
      - P8_prescribed_minimal_support_norms: infinity norms of minimal-support vectors of L(S;Q)
      - per-tuple solution-count histograms per cell (not only means), so tuple-dependence is visible
      - discard counts, square-class factor per cell, and CTRL-K2 yield beside the committed fiber_pairs_budget
      - assembled T(k,p) beside the Pollard rho baseline N^(1/2) at each tested p, with every factor labelled measured / derived / unmeasured

  preregistered_prediction:
    - quantity: P1_solution_count_exponent
      formula: "12 - 3k, i.e. 9, 6, 3, 0, -3 at k = 1..5; tolerance +/- 0.4 in log_p units"
      source: "H-XEDN-beb408 HEUR-P1: 7k equations in 12 + 4k unknowns with x prescribed"
    - quantity: P2_free_plant_boundary
      formula: "exactly 4"
      source: "12 - 3k >= 0 iff k <= 4"
    - quantity: P3_marginal_exponent
      formula: "-3.0 +/- 0.4"
      source: "derivative of 12 - 3k; cross-checked against alpha = 3 in DEC-20260724-021's P_lift(p) = (1 - 2/p + p^-3)/(2 p^3)"
    - quantity: P4_null_arm_exponents
      formula: "identical to the treatment arm at every (k, p), within +/- 0.4"
      source: "the count is blind to the provenance of x_i"
    - quantity: P5_free_x_exponents
      formula: "12, constant in k, never negative"
      source: "12 + 7k unknowns against 7k equations when x is free"
    - quantity: P6_prescribed_support_nonzero_rate
      formula: "strictly between 0 and 1 at every tested p"
      source: "comparator-spread requirement; at k = 4 the generic solution family has independent sections while a proper closed subfamily does not"
    - quantity: P7_delta
      formula: "NO FORCED VALUE. Reporting rule only: delta with regression uncertainty and residuals, and T reported as only as good as its worst-measured factor."
      source: "H-XEDN-beb408 HEUR-P2, which offers no argument for delta and says so"
    - quantity: P8_prescribed_minimal_support_norms
      formula: "subset of {1,2,3,4,6}; the value 5 impossible"
      source: "H-XEDN-906489 P2, carried here as a cross-check"

  stages:
    ordering_rationale: >-
      Cheapest-first with a decisive first stage. Stage 0 is pen-and-paper and
      can end the contract; Stage 1 needs no elliptic-curve arithmetic at all and
      can end it too. Only Stage 2 needs the group law.
    stage_0:
      name: bookkeeping audit
      cost: zero compute
      content: >-
        Write the equation and unknown count out in full -- 7 scalar equations
        per section because deg x_i^3 <= 6, deg(a x_i) <= 6 and deg b = 6; 5 + 7
        unknowns for (a,b) and 4 per y_i with x_i prescribed; 3 more per section
        when x is free -- and have it independently checked. A single off-by-one
        changes every exponent in the contract.
      can_terminate: >-
        YES. If the count is wrong the contract stops and is rewritten.
    stage_1:
      name: solution-count sweep, all three arms
      cost: minutes, pure Python linear algebra over F_p
      content: >-
        Treatment, NULL-X and FREE-X across k in {1..5} and p in {7,13,19,31},
        >= 2000 tuples per cell, reporting full histograms.
      can_terminate: >-
        YES. If the measured slope is not -3 within tolerance, HEUR-P1 is refuted
        and the cost equation is rebuilt around the measured slope before any
        Stage-2 compute is spent.
    stage_2:
      name: dependence arm at k = 4
      cost: bounded, pure-Python group law over F_p(t)
      content: >-
        For each k = 4 surface obtained, test whether the four planted sections
        are dependent, verify every dependence in the group law over F_p(t) AND
        separately by specialisation at >= 20 good fibres, and record the
        minimal-support vectors and their infinity norms.
      can_terminate: no
    stage_3:
      name: assembly
      cost: zero compute
      content: >-
        Assemble T(k,p), state it beside N^(1/2) at each tested p, label every
        factor's provenance, and write the forward guidance from
        H-XEDN-beb408's interpretation_limits into the report verbatim.
      can_terminate: no

  replication:
    seeds: [5202001, 5202002]
    independent_instances: 2
    note: >-
      Both seeds are run for every cell of every arm and the between-seed spread
      of each exponent is REPORTED BEFORE the exponent's deviation from its
      forced value is reported. If the between-seed spread is comparable to or
      larger than that deviation, the estimate is reported as noise-limited and
      no exponent claim is made from that cell.

  budget:
    maximum_runs: 4
    maximum_wall_seconds: 7200
    maximum_cpu_seconds: 14400
    maximum_memory_gb: 2
    maximum_total_disk_bytes: 4294967296
    maximum_workers: 1
    no_network: true

  stopping_rules:
    - Do not execute unless separately approved, frozen, archived and authorized by the Coordinator; no approved_by field is present.
    - Stop after Stage 0 if the equation or unknown count is wrong.
    - Stop after Stage 1 if the measured slope is not -3.0 +/- 0.4; rebuild before spending Stage-2 compute.
    - Stop before the treatment arm if NULL-X has not been run and hash-committed.
    - Stop and report an artifact if the k sweep is flat.
    - Stop on any budget, memory or integrity failure.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - CTRL-K2 failing to reproduce a working sampler within the stated factor of 4 -- no negative statement about any k may then be reported.
    - Any dependence counted as verified by specialisation alone without group-law verification over F_p(t).
    - Any exponent reported without its between-seed spread reported first.
    - Any cell reported by its mean alone, without the per-tuple histogram.
    - Any presentation of T(k,p) that omits the three exclusions (B relations, linear algebra, memory) or the unmet specialisation gap.
    - Any extrapolation of a fitted exponent beyond p = 31.

  success_criterion: >-
    A complete, controlled readout in which: the Stage-0 count is confirmed
    independently; the treatment arm's exponents match 12 - 3k within +/- 0.4 at
    every (k, p); the free-plant boundary is exactly 4; the marginal exponent is
    -3.0 +/- 0.4 and its agreement or disagreement with DEC-20260724-021's
    alpha = 3 is stated explicitly; NULL-X matches the treatment arm and FREE-X
    returns 12 constant in k; CTRL-K2 reproduces the committed sampler; the k = 4
    dependence rate lies strictly between 0 and 1 at every p, with delta reported
    with its residuals; and T(k,p) is assembled beside N^(1/2) with every factor
    labelled and every exclusion stated. That disposition supports ONLY the toy
    scope in claim_ceiling and establishes no ECDLP attack, cost, exponent,
    cryptographic-scale or deployed-scheme conclusion.

  falsification_criterion: >-
    Any of: measured exponents not matching 12 - 3k; a free-plant boundary other
    than 4; NULL-X differing from the treatment arm; FREE-X returning the same
    exponents as the prescribed arm; a k = 4 dependence rate of exactly 0 or
    exactly 1 at every p; or a minimal-support relation of infinity norm 5 or
    greater than 6. The first four falsify HEUR-P1 or the identification of the
    mechanism, the fifth falsifies the comparator-spread premise, and the sixth
    falsifies H-XEDN-906489's ceiling through this contract. Each is reported as
    the primary result.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: review_required draft; no run, no evidence,
      no mathematical inference.
    controlled_cost_readout: >-
      Only after separate approval, freezing and authorization. Toy-scope only,
      and the report must carry the forward guidance verbatim so that a large T
      is recorded as a priced obstruction with named ways out, not as a closure.
    controlled_refutation: >-
      Any falsification criterion firing. First-class outcome; the package is
      complete when it names which factor failed and what the measured value was.
    infrastructure_or_integrity_failure: >-
      A timeout, crash, missing archived file or missing dependency is reported
      as INFRASTRUCTURE SIGNAL and is NEVER negative mathematical evidence
      against H-XEDN-beb408 or any ECDLP proposition (AGENTS.md rule 5). The
      absence of Sage in this container is an infrastructure fact and no arm may
      be reported as failed on that ground.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_do_not: >-
      The parameter count is an identity in the degrees and does not depend on p,
      so if HEUR-P1's genericity holds the exponent 12 - 3k is p-independent.
      THAT IS STILL NOT A CRYPTO-SCALE RESULT: genericity is exactly what may
      fail, it can only be measured at small p here, and the dependence exponent
      delta -- the factor that decides whether the construction is usable -- is
      fitted over p in {7,13,19,31}, a range too short to support extrapolation.
      Any citation of T(k,p) at cryptographic p would be an extrapolation this
      contract forbids in its invalidation rules.

  required_artifacts_if_later_authorized:
    - Frozen approved specification with a freeze receipt binding its sha256.
    - The Stage-0 count written out, with the name of the independent checker and the check's outcome.
    - Hash-committed forced values (9, 6, 3, 0, -3; boundary 4; free-x 12) recorded before any cell runs.
    - Per-cell per-tuple solution-count histograms, all three arms, both seeds, in canonical sorted-key JSON.
    - Regression outputs with residuals and between-seed spreads, reported in the order spread-then-deviation.
    - CTRL-K2 yield beside the committed fiber_pairs_budget values, with the sha256 of the archived file read.
    - Group-law verification transcripts for every dependence found, with specialisation transcripts reported separately.
    - The assembled T(k,p) table beside N^(1/2), with a provenance label on every factor and the three exclusions stated in the same table.
    - manifest.yaml, environment.json, command.txt, stdout.log, stderr.log per run with git commit and dirty-tree state and the resolved inference block.
    - execution_report.md whose first paragraph names which stage could have terminated the run and whether it did.

  approval_requirements:
    - Independent review confirms the Stage-0 bookkeeping, since every exponent depends on it and an off-by-one is invisible downstream.
    - Independent review confirms that FREE-X is a genuine nearby-object control and that CTRL-K2's no-negative-without-it rule is enforceable as written.
    - Independent review confirms that no wording in the package licenses a sentence on DEC-20260724-021's forbidden list.
    - Coordinator separately approves and freezes without editing this draft.

  approval_status: >-
    Pending Coordinator review. No approved_by field is present because this
    draft is not approved, and only the Coordinator may approve it
    (AGENTS.md rule 1).
