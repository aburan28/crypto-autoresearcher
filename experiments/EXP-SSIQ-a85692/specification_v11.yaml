        (2) ONE EMPIRICAL DISTRIBUTION, NEW IN ROUND 4: the final-pop
        overshoot over the b = 1.10 s arm's truncated vertices, up to 194
        free samples, the first direct measurement of that quantity anywhere
        in this lineage, and the quantity PF-27 shows the reference curve is
