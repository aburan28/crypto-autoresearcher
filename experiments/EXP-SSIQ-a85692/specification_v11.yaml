      delta_e_independent_rng_probe_v8.derive_per_vertex_seed(BASE_SEED =
      20260811, v) (GENUINELY IMPORTED, UNCHANGED); rng_v =
      random.Random(seed_v), a FRESH instance never shared or advanced
      across vertices; target = graph["field"].frobenius(v); then
      compute_delta_e.two_sided_search(field, v, target, rng_v, q,
