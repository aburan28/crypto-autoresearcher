      SELECTION-BIAS DISCLOSURE, REQUIRED IN-BAND (BATCH-012 obligation
      applied to the calibration instrument itself): this set is the extreme
      fastest tail of the population and carries only delta_E in {2, 3}. IT
      IS A TIMING INSTRUMENT ONLY. Its delta_E values must never be cited as
      informative about the delta_E population, and its measured times must
      never be used as an estimate of the population's typical completion
      time -- only as a floor. THE SAME APPLIES TO F_cal, which is a minimum
      over this same extremity-selected set: it is deliberately a FLOOR
