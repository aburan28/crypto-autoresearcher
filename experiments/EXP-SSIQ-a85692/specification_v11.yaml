      reproduced: the naturally-completed delta_E >= 5 subset falls from 36
      to 4, and the delta_E = 5 class -- the largest single class at
      delta_E >= 5, 42 of the 80 -- goes from 20 observable to ZERO
      observable, for a saving of 9.7 s (2%) inside a ~350 s margin. This
