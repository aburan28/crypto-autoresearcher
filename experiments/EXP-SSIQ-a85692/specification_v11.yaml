    BUDGET JUSTIFICATION (REQUIRED, since this is NOT zero new search
    cost; arithmetic re-derived by this Coordinator in round 3 for the
    corrected budgets and shown term by term so a reviewer can check it):
      SWEEP, worst case, if EVERY one of 194 vertices consumes its FULL
      budget at BOTH points without any internal stopping condition
      firing: 194 * (1.1 + 1.45) = 194 * 2.55 = 494.7 s. (Per arm:
      194 * 1.1 = 213.4 s and 194 * 1.45 = 281.3 s.)
      CALIBRATION CAL-1, worst case: 8 vertices * 15.0 s = 120.0 s
      (realistic ~10-12 s on an unloaded machine, since the archived times
      for these eight are 1.15-1.32 s).
      CALIBRATION CAL-2, worst case: 8 vertices * 2.0 s = 16.0 s
      (realistic ~5-7 s).
      GRAPH BUILD, exactly once: ~1-2 s per every prior amendment's own
      measured figures.
      SUBTOTAL WORST CASE: 494.7 + 120.0 + 16.0 + 2.0 = 632.7 s.
      OVERSHOOT ALLOWANCE: the budget test sits at the TOP of
      build_smooth_table's heap loop, so a vertex can overshoot its slice
      by one heap pop's work. RT-BATCH-013 measured this on v10's real run
      at +4.2% / +1.4% / +0.5% for b = 0.6 / 0.8 / 1.0. Applying the
      largest measured figure to the whole 630.7 s of search terms gives
      630.7 * 1.042 = 657.2 s, i.e. ~657 s.
      AGAINST THE BUDGET BELOW: 1000 / 632.7 = 1.58x margin;
      1000 / 657.2 = 1.52x margin. In CPU-hours, 657 s single-threaded =
      0.183 CPU-hours against the 0.33 CPU-hour allowance (55.3%). PF-17's
      repair costs +9.7 s of search over the round-2 draft's 485.0 s and
      ~+10 s of headroom, moving the margin from 1.55x to 1.52x. NO BUDGET
      AMENDMENT IS REQUESTED and the round-1 budget block is carried
      unchanged.
      IN PRACTICE the sweep is expected to fall below 494.7 s at b = 1.45 s
      because many vertices should complete before their budget elapses --
      but that expectation is this amendment's own object of study, so the
      budget is sized against the zero-natural-completions worst case and
      relies on it for nothing.
