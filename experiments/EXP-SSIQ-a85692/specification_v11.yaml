      PRE-SWEEP FLOOR CALIBRATION (PF-14(b) fix). FIXED AND NAMED BY
      COORDINATE IN THIS FROZEN TEXT so the set cannot be chosen, extended,
      or trimmed after the fact. These are exactly the EIGHT SMALLEST
      archived wall_seconds among RUN-SSIQ-a85692-h's 194 per_vertex_records
      under inputs.delta_e_ge_5_inclusion_rule_v11; the ninth smallest is
      1.3176441192626953 s, comfortably separated, so the boundary is
      unambiguous and no tie-break rule is needed. Each row is
      [x, y] archived_delta_E archived_wall_seconds:
        [749, 1684]   delta_E 2   1.149932861328125
        [749, 753]    delta_E 2   1.1633622646331787
        [360, 1897]   delta_E 3   1.257300853729248
        [360, 540]    delta_E 3   1.2623295783996582
        [817, 445]    delta_E 2   1.2640187740325928
        [2154, 970]   delta_E 2   1.2711119651794434
        [697, 105]    delta_E 3   1.2978770732879639
        [2405, 1073]  delta_E 2   1.314664602279663
      SELECTION-BIAS DISCLOSURE, REQUIRED IN-BAND (BATCH-012 obligation
      applied to the calibration instrument itself): this set is the
      extreme fastest tail of the population and carries only delta_E in
      {2, 3}. IT IS A TIMING INSTRUMENT ONLY. Its delta_E values must never
      be cited as informative about the delta_E population, and its
      measured times must never be used as an estimate of the population's
