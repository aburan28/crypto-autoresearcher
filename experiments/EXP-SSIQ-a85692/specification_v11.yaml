      CAL-1 (measured floor). PF-18 FIX: CAL-1 IS A SINGLE CALL TO THE
      FROZEN FUNCTION, UNCHANGED, ON A VERTEX-RESTRICTED SHALLOW COPY --
        THE_EIGHT = the eight coordinates above, as TUPLES OF INTS, in the
        order listed;
        REQUIRED EXECUTOR ASSERTIONS BEFORE THE CALL (round-3 control):
          len(THE_EIGHT) == 8
          set(THE_EIGHT) <= set(graph["vertices"])
