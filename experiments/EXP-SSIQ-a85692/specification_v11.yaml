    pf27_summary: >-
      BLOCKING, NEW (round 3), applied. FINDING: 115 is not an upper bound,
      and the stated reason it survived as one had the sign backwards. The
      round-2/round-3 text said the one-heap-pop qualification was "an error
      in the PERMISSIVE direction for the only use made of it here (an upper
      bound on n_naturally_completed)". A premise STRICTER than the code
      means the code admits MORE natural completions than the premise
      admits, which ATTACKS an upper bound rather than defending it. Round
      2's alternative rescue -- that the bound "actually rests on" the
      necessary condition t_total < b -- fails by the identical mechanism
      applied to the target half: remaining is checked at the top of the
      target loop too (compute_delta_e.py:189-192 with :155-159), so a
      target build whose final pop straddles the deadline still returns
      to_t = False with t_total = b + one pop. The archived distribution is
      densest exactly there, and PF-17's own move from 1.4 to 1.45 is what
      put the reference point in the mode and made the defect
      quantitatively load-bearing. CHANGED: (i) the "PERMISSIVE direction"
      sentence is WITHDRAWN and replaced by the correct two-sided statement
      -- timed_out == False implies t_source <= b/2 + one pop AND
      t_total <= b + one pop, so NEITHER condition is necessary and there is
      no one-sided archived bound; (ii) the words "upper bound" are
      WITHDRAWN throughout for the archived-derived counts, replaced by
      REFERENCE COUNT WITH TWO-SIDED CORRECTIONS, both directions named
      wherever it is quoted -- downward and unquantifiable from the archive
      (the 0.725 s source cap), upward and crudely boundable (the final-pop
      slack); (iii) P-3d is added FIRST among the over-bound branches, with
      a pre-registered band, so the branch set is genuinely exhaustive
      rather than nominally so; (iv) the round-3 required control is adopted
      -- the b = 1.10 s arm, being 100% truncated by construction, yields up
      to 194 free samples of (measured wall_seconds - 1.10), the first
      direct measurement of the final-pop overshoot on the execution host,
      and it is now REQUIRED to be reported as a distribution so a reader
      can check P-3d post hoc and a successor can set the tolerance
      empirically; (v) the b = 1.10 s arm's "exactly 0" is restated as
      holding unless the slack exceeds 49.93 ms, roughly ten times the
      largest per-vertex slack this lineage has measured.
      ARCHIVED DENSITY, RECOMPUTED BY THIS COORDINATOR DIRECTLY FROM
      probe_delta_e_comparison.json RATHER THAN TAKEN FROM THE REVIEW: 18
      records lie in [1.45, 1.46) and 71 in [1.45, 1.50) (the latter as
      194 - 8 records at or above 1.50, minus 115), so the count reaches 133
      at 10 ms of slack and 186 at 50 ms. Round 3's finer slack table
      (5 ms -> 124, 7.2 ms -> 127, 11 ms -> 135, 20.3 ms -> 147,
      60.9 ms -> 187) is CITED FROM THAT REVIEW WITH PROVENANCE and was not
      separately recomputed here.
    pf28_summary: >-
      ADVISORY, NEW (round 3), applied -- and it strengthens the amendment
      at zero cost. FINDING: Q-LOAD, as written in round 3, stamped EVERY
      mismatch as "not mathematical evidence until re-measured on an
      unloaded machine" -- but the mismatches in question are on
      NATURALLY-COMPLETED vertices, and this document's own PF-25 derivation
      establishes that such a vertex's value cannot depend on anything but
      the vertex. Machine load determines WHICH vertices complete naturally;
      it cannot alter the VALUE returned by one that did. So Q-LOAD
      discounted on a mechanism provably incapable of producing the
      observation -- and since PF-25 has just reclassified the equality half
      as a control whose ONLY informative outcome is failure, under G-2
      (which fires at only 15% floor inflation) the single informative
      outcome this amendment can produce would have been born pre-stamped as
      non-evidence. That is the amendment disarming its own instrument.
      CHANGED: Q-LOAD is narrowed to exactly the quantities load reaches --
      n_naturally_completed, the naturally-completed value histogram, the
      P-1/P-2/P-3 reading, the composition of the naturally-completed set,
      and the conjugate-pair figures over it -- and it is stated explicitly
      that a VALUE mismatch on a naturally-completed vertex is NOT
      discountable by load and MUST be surfaced loudly regardless of the
      run's load_confounded stamp.
    pf29_summary: >-
      ADVISORY, NEW (round 3), applied, both parts. FINDING (a): G-2b's
      stamping threshold of 10 was undefended and sat two rules apart from
      this document's own P-2 artifact boundary of 58, leaving a wide band
      (predicted counts from about 10 to 57) in which the specification's
      reading rule calls an outcome an environment artifact while the
      artifact's own load_confounded reads false -- a median inflation ratio
      of only 1.05 yields a load-adjusted predicted count of 31 and would
      have gone unstamped. Round 3 accepted the stated epistemic reason for
      STAMPING rather than DEFERRING, and this draft retains that form; what
      it rejected was the VALUE. CHANGED: G-2b's threshold is ALIGNED TO
      P-2's own boundary -- it now stamps load_confounded: true whenever the
      load-adjusted predicted count at b = 1.45 s is BELOW 58 (= 0.5 x 115,
      P-1/P-2's frozen boundary), so the artifact's top-level boolean and
      the specification's reading rule agree about the same run by
      construction rather than by coincidence. FINDING (b): the G-0/G-0b/G-1
      artifact's CLOSED required list includes "the load-adjusted predicted
      counts", but G-0 fires precisely when some CAL-1 vertex timed out or
      fewer than 8 records exist, and the median ratio had no stated
      exclusion of timed-out vertices and no stated behaviour on an empty
      set -- so the required field was either meaningless or undefined on
      the branch required to report it. CHANGED: the G-2b median is stated
      to EXCLUDE timed-out CAL-1 vertices (symmetry with F_cal), and on any
      defer branch the load-adjusted counts are reported as NULL WITH A
      REASON STRING, never as a fabricated 0 -- the same "ABSENT, not zero"
      discipline PF-14 established, applied to the field PF-23 added.
    pf30_summary: >-
      ADVISORY, NEW (round 3), applied. FINDING: the file's provenance
      header still named RT-BATCH-013's originating prediction -- whether
      delta_E >= 5 convergence begins appearing as budget crosses the floor
      -- as this amendment's motivation, while P-4 pre-commits that NO
      outcome at ANY budget licenses a statement about it and PF-25 shows
