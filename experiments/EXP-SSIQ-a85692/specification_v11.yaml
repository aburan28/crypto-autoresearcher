      round-1 review's prose and this Coordinator's independent
      recomputation -- the total delta_E >= 5 population (80 vs 78) and the
      delta_E >= 5 subset under b = 1.45 s (36 vs 30) -- and deliberately
      did NOT guess which was right. NEITHER IS HARMONISED HERE EITHER. The
      rule is stated and the counts recomputed under it so any reader can
      reproduce them. Rounds 2 and 3 each recomputed every figure below
      independently and reproduced all of them.
      RULE (four clauses):
        (R-1) POPULATION. Exactly the 194 entries of the per_vertex_records
        array in
        experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/probe_delta_e_comparison.json.
        These are the 194 NON-F_p-RATIONAL vertices of the p=2437 graph and
        nothing else. THE 9 F_p-RATIONAL VERTICES ARE EXCLUDED: they are
        wired to delta = 1 unconditionally, are never searched, and have no
        per-vertex record. This is why that run's comparison_against_archived
        reports 203 on the full key intersection but 194 in its
        non_fp_rational_only sub-breakdown; every count here uses the
        194-vertex domain.
        (R-2) RESOLVED FILTER. Records with resolved == true only. VACUOUS in
        this artifact -- all 194 have resolved == true and timed_out ==
        false -- so it cannot be the source of any discrepancy here. Stated
        anyway because it is the clause that makes the rule transfer
        unchanged to RUN-SSIQ-a85692-k, where it will NOT be vacuous.
        (R-3) VALUE THRESHOLD, INCLUSIVE. "delta_E >= 5" means
        delta_e_upper_bound >= 5, INCLUSIVE of 5. "delta_E = 5" means
        exactly 5.
        (R-4) BUDGET MEMBERSHIP, STRICT. "completes naturally under budget b"
        means the record's archived wall_seconds is STRICTLY LESS THAN b. No
        archived wall_seconds equals any budget quoted here, so
        strict-vs-inclusive changes no count; the convention is fixed anyway.
      COUNTS RECOMPUTED BY THIS COORDINATOR UNDER (R-1)..(R-4), DIRECTLY
      FROM THE COMMITTED ARTIFACT:
        Full delta_e_upper_bound value histogram over the 194-vertex
        population: {2: 34, 3: 70, 4: 10, 5: 42, 6: 10, 7: 16, 8: 12}.
        Sums to 194 exactly; no record carries a value outside 2..8.
