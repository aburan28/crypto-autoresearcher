        (3) ONE DURABLE INFRASTRUCTURE FACT: the execution host's platform,
        ISA, Python build, CPU count and load averages -- which no run
        -a..-j ever recorded, which is precisely why PF-26 was possible.
        (4) TWO CONTROLS with pre-registered null expectations: the
        b = 1.10 s guaranteed-truncated arm (pre-registered at exactly 0),
        and the equality cross-check (informative only on failure).
      IS IT WORTH ~657 s WORST CASE AND 0.183 CPU-HOURS? THIS COORDINATOR'S
      JUDGEMENT IS YES, AND ONLY BECAUSE PF-26 AND PF-27 ARE NOW REPAIRED --
      without them item (1) is not interpretable against the reference it is
      compared to, and the run would have produced a number nobody could
      read. The cost is a tenth of a CPU-hour under an uncapped campaign
