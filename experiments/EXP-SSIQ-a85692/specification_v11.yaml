      HOW THE CURVE IS TO BE READ AFTER THE RUN, PRE-COMMITTED HERE SO IT
      CANNOT BE CHOSEN AFTER SEEING THE RESULT. THE FOUR RULES ARE
      EXHAUSTIVE OVER MEASURED OUTCOMES AND THE P-1/P-2 BOUNDARY IS NUMERIC
