    EXECUTION-HOST CONTENTION AND HOST-IDENTITY CAVEAT (PF-26 FIX, round 3 --
    THIS SECTION WAS TITLED "SAME-HARDWARE CONTENTION CAVEAT" IN THE
    ROUND-2 AND ROUND-3 DRAFTS, AND THAT TITLE WAS FALSE AND INVERTED THE
    EXACT DISTINCTION PF-14 EXISTED TO DRAW). The distinction, restored:
      SAME-HOST CONTENTION is the mechanism PF-14 named -- the SAME machine
      that produced the archived times is more heavily loaded when it
      produces the new ones, so wall times inflate while budgets do not.
      This is the mechanism CAL-1, F_cal and G-0/G-1/G-2/G-2b instrument.
      CROSS-HOST DIFFERENCE is a DIFFERENT mechanism -- the new times come
      from a different machine, so they may be faster OR slower for reasons
      that have nothing to do with load. This is the mechanism the
      CROSS-HARDWARE caveat below covers, and the mechanism G-0c now
      instruments.
      THIS DOCUMENT DOES NOT KNOW WHICH APPLIES TO RUN-k, AND SAYS SO. Every
      archived time was produced on a 4-CPU x86_64 Linux host that logged no
      load average; every load figure this document ever contained came from
      a 14-core arm64 Darwin ORCHESTRATION host that has never run the
      experiment. G-0c resolves the question BY MEASUREMENT at run time and
      DEFERS if the answer is "different host", because the reference curve
      is only transferable across matched hosts.
      CONSEQUENCE FOR THE b = 1.10 s ARM, STATED RATHER THAN ASSERTED: that
      arm's guaranteed-truncated character rests on the execution host not
      being FASTER than the archived host, against a margin of only
      1.149932861328125 - 1.10 = 49.93 ms (4.3%). Under a cross-host
      execution -- for instance a modern arm64 core against a 4-vCPU x86_64
      sandbox -- a speedup of that size is plausible and the guarantee would
      not hold. G-0c makes this moot in the only honest way: if the hosts do
      not match, the run defers rather than proceeding on an unchecked
      premise.
      CONSEQUENCE FOR THE READING RULES: P-3a (RUN-h itself contended) and
      P-3b (cross-host difference) were ordered in the round-3 draft on the
      assumption of a single heavily-loaded machine. That assumption is what
      PF-26 breaks. Their relative ordering is therefore stated below as
      CONDITIONAL on G-0c's measured outcome rather than fixed in advance.
      A measured count far below the reference IS AN EXECUTION-ENVIRONMENT
      ARTIFACT AND MUST BE REPORTED AS ONE, never as a property of delta_E
      convergence (AGENTS.md rule 3).
      ACCEPTED OVER-CONSERVATISM, RECORDED RATHER THAN REPAIRED (round 2's
      observation, and this Coordinator agrees): on a G-1 deferral the
      ENTIRE run defers, including the b = 1.10 s arm, which would still
      have been valid. That is conservative rather than wrong, and preferred
      to writing a partial artifact under a tripped load gate.

