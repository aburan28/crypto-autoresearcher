# DRAFT PROTOCOL AMENDMENT, NOT YET FROZEN. Supersedes specification_v10.yaml
# (v10, frozen ca905c2482e00fef5b0bdc6902b43a77a43c8d5c, retained unedited)
# on the ranked resume action DEC-20260806-520ca4 recorded at BATCH-013's
# close: item (1), the Red Team's own falsifiable prediction (RT-BATCH-013):
# one more sweep point at 1.1-1.2s per-vertex budget, straddling the observed
# 1.14993s natural-completion floor, to test whether delta_E>=5 convergence
# begins appearing there while delta_E=2/3 remain exactly converged.
#
# PURPOSE: BATCH-013 (v10) established, at derivation-tier proof_status, that
# budget-truncated delta_E search never underestimates the true minimal
# collision degree -- it converges to the true value in ascending order of
# true depth as budget grows, with the resolved-vertex sets nesting exactly
# and the delta_E=2/delta_E=3 populations converging to EXACT identity with
# the true archived population by b=1.0s, while delta_E>=5 remained mostly
# unresolved. Every one of v10's three sweep points (0.6s/0.8s/1.0s) stayed
# STRICTLY BELOW the observed 1.14993s natural-completion floor (RUN-SSIQ-a85692-h,
# this Coordinator's own independent re-derivation, confirmed by both
# BATCH-013 reviewers), so v10 could only ever observe truncation, never
# a transition out of it. This amendment runs a TWO-POINT SWEEP -- 1.1s and
# 1.2s -- the first still strictly below the floor (preserving v9/v10's own
# "every vertex guaranteed truncated" guarantee at that point), the second
# ABOVE the floor's minimum but still below the observed 1.15-1.70s
# natural-completion RANGE's own upper end (v10's own independently-verified
# figure) -- so at b=1.2s, some fast-completing vertices are now expected to
# complete NATURALLY (not truncated) while slower ones remain truncated, a
# genuine, disclosed change of instrument character from every prior
# amendment in this lineage, which this amendment's own new cross-check
# (below) directly measures rather than assumes.
#
# THIS AMENDMENT REQUIRES NEW delta_E SEARCH COMPUTATION, sized and justified
# explicitly below. campaign_budget.maximum_batches remains uncapped (user
# direction, "No budget constraints," ledger/goals/GOAL-SSIQ-001/goal.yaml)
# -- this does NOT waive this amendment's own per-run budget discipline,
# which remains bounded and pre-registered exactly as every prior
# amendment's has been.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 11
  title: >-
    Floor-straddling truncation sweep (1.1s/1.2s): does delta_E>=5
    convergence begin appearing as budget crosses the observed 1.14993s
    natural-completion floor, while delta_E=2/3 remain exactly converged,
    testing RT-BATCH-013's own falsifiable prediction and directly measuring
    the truncated/naturally-completed split via each vertex's own timed_out
    flag? (BATCH-014)
  status: draft
  approved_by: null
  amends: EXP-SSIQ-a85692 (version 10, specification_v10.yaml, frozen ca905c2482e00fef5b0bdc6902b43a77a43c8d5c)
  amendment_scope: >-
    TWO INDEPENDENT PART-A-ONLY BUDGET PASSES OVER ONE SHARED GRAPH (no PART
    B, identical reasoning to v9/v10), against the SAME prime, p=2437, via
    trapping_diagnostic_v5.build_graph_for_prime(2437, 20260805). GRAPH
    REBUILD/RE-VERIFY HAPPENS EXACTLY ONCE, before the sweep loop, IDENTICAL
    procedure to v10's own step (0) (GENUINELY IMPORTED, UNCHANGED,
    build_graph_for_prime then delta_e_independent_rng_probe_v8.
    verify_graph_identity), NOT wrapped in any try/except -- if either
    raises, the exception propagates UNCAUGHT and the run terminates with NO
    truncation_sweep_comparison.json written at all, before any sweep point
    is attempted (infra/setup failure under AGENTS.md rule 3, never a
    sweep_point_error for any budget -- v10's own PF-10 discipline, applied
    identically here without needing a second review round to discover it).
    non_fp_rational_set is derived once, from the graph object, at step (0),
    identically to v10.
    THEN, PER SWEEP POINT b in [1.1, 1.2] (seconds), EACH SWEEP POINT'S
    ENTIRE BUNDLE WRAPPED IN ITS OWN EXCEPTION HANDLER (v10's own PF-2
    discipline, applied identically here from the start, not discovered by
    a review round): (1) wire all 9 F_p-rational vertices to
    new_delta_map[v]=1 unconditionally BEFORE the search loop (IDENTICAL
    required construction step to v8/v9/v10); (2) for every
    non-F_p-rational vertex, GENUINELY IMPORT AND CALL
    delta_e_truncation_probe_v9.run_truncation_probe_v9(graph, BASE_SEED,
    b) DIRECTLY, UNCHANGED -- IDENTICAL BASE_SEED=20260811 every prior
    amendment in this lineage used, holding the per-vertex RNG stream
    IDENTICAL across v8 through v11 so budget remains the ONLY manipulated
    variable; (3) per-vertex records (resolved, delta_e_upper_bound,
    wall_seconds, timed_out) are returned by run_truncation_probe_v9 itself,
    unchanged in shape; (4) REQUIRED REPORTING per sweep point: n_resolved,
    n_timed_out, coverage_fraction (n_resolved / 194, identical convention);
    (5) REQUIRED COMPARISON 1 per sweep point, against RUN-SSIQ-a85692-b's
    archived delta_map, via trapping_diagnostic_v5.load_archived_prime_data
    and delta_e_truncation_probe_v9.compare_against_archived, BOTH
    GENUINELY IMPORTED, UNCHANGED -- IDENTICAL in structure to v9/v10's own
    Comparison 1; (6) REQUIRED COMPARISON 2 per sweep point, against
    RUN-SSIQ-a85692-h's own new_delta_map, via delta_e_truncation_probe_v9.
    parse_v8_new_delta_map and delta_e_truncation_probe_v9.
    compare_against_v8, BOTH GENUINELY IMPORTED, UNCHANGED -- IDENTICAL in
    structure and parsing convention to v9/v10's own Comparison 2; (7)
    REQUIRED VALUE HISTOGRAM AND CONJUGATE-PAIR REPORTING per sweep point,
    via delta_e_truncation_sweep_v10.value_histogram_and_conjugate_pairs,
    GENUINELY IMPORTED, UNCHANGED -- this amendment is the FIRST in this
    lineage to reuse v10's own reporting function rather than re-deriving
    it, extending the reuse-not-duplicate discipline PF-3/PF-9 established
    for v9's functions to v10's own genuinely-reusable, pure functions;
    (8) REQUIRED NATURAL-COMPLETION CROSS-CHECK (the genuinely new analysis
    this amendment adds, below) per sweep point.
    STEPS (1) THROUGH (8) ABOVE, FOR ONE SWEEP POINT, ARE ALL INSIDE THAT
    SWEEP POINT'S OWN try BLOCK, IDENTICAL failure-isolation discipline to
    v10: any exception anywhere in steps (1)-(8) for sweep point b is
    caught, recorded as a sweep_point_error field (string) for that sweep
    point alone, and the loop continues to the next sweep point -- one
    sweep point's failure never prevents another's independent attempt or
    discards its already-valid result. Results accumulate incrementally;
    the final combined artifact write is unconditional on how many of the
    two sweep points succeeded (0, 1, or 2).
    REQUIRED NATURAL-COMPLETION CROSS-CHECK (genuinely new, the core test
    this amendment exists to run): for THIS sweep point's own resolved
    non-F_p-rational vertices, partition by each vertex's own timed_out
    flag (already returned by run_truncation_probe_v9, per-vertex, unchanged
    in shape -- no new instrumentation is added to the search itself) into
    two disjoint sets: NATURALLY-COMPLETED (timed_out is False -- the
    search reached its own internal stopping condition strictly before this
    sweep point's budget elapsed, so per EV-SSIQ-48d274's own derivation
    the returned value IS the confirmed true minimum, not merely a valid
    upper bound) and STILL-TRUNCATED (timed_out is True -- budget elapsed
    before the search's own stopping condition, so the returned value is a
    valid-but-possibly-non-minimal upper bound, identical in kind to every
    v9/v10 sweep point). Report, per sweep point: n_naturally_completed,
    n_still_truncated (these two sum to n_resolved for that sweep point --
    an internal-consistency assertion this amendment REQUIRES the Executor
    to check and report the outcome of, not silently assume holds), and
    the FALSIFIABLE PREDICTION this cross-check exists to test:
    EVERY naturally-completed vertex's new_delta_map value MUST equal
    RUN-SSIQ-a85692-b's own archived_delta_map value for that vertex
    EXACTLY (a strictly SHARPER claim than v10's own "never smaller"
    derivation -- v10 proved new_value >= archived_value always; this
    predicts new_value == archived_value specifically for the
    naturally-completed subset, which is what "the search reached its own
    confirmed-true-minimum stopping condition" actually means). Report
    n_naturally_completed_matching_archived and
    n_naturally_completed_NOT_matching_archived (the latter MUST be 0 under
    the frozen prediction; if it is ever nonzero, report every such vertex
    by coordinate, its new value, its archived value, and its full
    per-vertex record -- this would be a striking, adversarially valuable
    result, either overturning EV-SSIQ-48d274's own derivation or revealing
    that "timed_out" does not mean what this amendment assumes it means,
    and must be surfaced loudly, never silently reconciled or omitted).
    Also report, per sweep point, the delta_E VALUE HISTOGRAM restricted to
    the naturally-completed subset alone (a dict from value to count,
    EMPTY {} if n_naturally_completed==0 -- explicitly well-defined at zero,
    the identical PF-8 discipline v10 established, applied here without
    needing a review round to discover it), to directly observe whether
    delta_E>=5 values appear there for the first time in this lineage.
    STATISTICAL-POWER FRAMING REQUIRED (v10's own PF-7 discipline, applied
    here without needing a review round to discover it): any statement, in
    this amendment's own execution_report.yaml or any future citation, of
    the natural-completion cross-check's outcome MUST report
    n_naturally_completed (the effective sample size for that specific
    claim) alongside any percentage or count, never a bare figure.
    CROSS-HARDWARE REPRODUCIBILITY CAVEAT (v9's own PF-3 discipline,
    restated identically to v10's own PF-6 restatement): this amendment's
    own "b=1.2s exceeds the natural-completion floor for some vertices"
    premise rests on comparing THIS run's (RUN-SSIQ-a85692-k's) wall-clock
    behavior against a DIFFERENT run's (RUN-SSIQ-a85692-h's) hardware-
    measured floor and range -- on sufficiently different hardware, the
    SET of vertices that complete naturally at b=1.2s could differ from
    what RUN-SSIQ-a85692-h's own per-vertex timings would predict, though
    the qualitative existence of SOME naturally-completing vertices at
    b=1.2s (which exceeds the observed MINIMUM of 1.14993s) is robust to
    modest cross-run timing variation. b=1.1s remains, like every v9/v10
    sweep point, strictly below the observed floor and so still guarantees
    every vertex is truncated at that point specifically, independent of
    this caveat.
    BUDGET JUSTIFICATION (REQUIRED, since this is NOT zero new search
    cost): worst case per sweep point b, if EVERY one of 194 vertices
    consumes its FULL budget without its own internal stopping condition
    firing, total search time for that point is 194*b. At b=1.2 (the
    largest sweep point), worst case is 232.8s; summed across both points
    (1.1+1.2=2.3s/vertex aggregate), the worst-case TOTAL search time
    across the entire sweep is 194*2.3 = 446.2 seconds -- LOWER than v10's
    own 465.6s worst-case bound despite the larger per-vertex budgets,
    because this amendment sweeps only two points, not three. Graph
    reconstruction runs EXACTLY ONCE (~1-2s per every prior amendment's own
    measured figures) and is negligible against this bound. In PRACTICE,
    per this amendment's own core hypothesis, SOME vertices at b=1.2s are
    expected to complete naturally in LESS than their full budget (that is
    the entire point of the natural-completion cross-check), so actual
    wall-clock time is expected to fall meaningfully below this worst-case
    bound -- but the bound itself assumes zero natural completions, the
    conservative case, and the budget below is sized against it.
  pre_freeze_review:
    status: PENDING
    report: null
    verdict: null
  inputs:
    floor_straddling_sweep_search_v11: >-
      TWO INDEPENDENT PART-A-ONLY BUDGET PASSES OVER ONE SHARED, ONCE-BUILT
      GRAPH (see amendment_scope for the full procedure). A new module,
      delta_e_floor_straddling_sweep_v11.py, defines the sweep driver.
      GENUINELY IMPORTS, UNCHANGED, and calls DIRECTLY, no reimplementation:
      delta_e_truncation_probe_v9.run_truncation_probe_v9(graph, base_seed,
      b) for the per-vertex search loop itself;
      delta_e_truncation_probe_v9.parse_v8_new_delta_map(path) for loading
      RUN-SSIQ-a85692-h's own new_delta_map;
      delta_e_truncation_probe_v9.compare_against_archived(new_delta_map,
      archived_delta_map, non_fp_rational_set) and
      delta_e_truncation_probe_v9.compare_against_v8(new_delta_map,
      v8_delta_map, non_fp_rational_set) for both required comparisons'
      matching/diffing logic; trapping_diagnostic_v5.build_graph_for_prime
      and trapping_diagnostic_v5.load_archived_prime_data;
      delta_e_independent_rng_probe_v8.verify_graph_identity (called once,
      at step (0)); delta_e_truncation_sweep_v10.
      value_histogram_and_conjugate_pairs(resolved_non_fp_set,
      new_delta_map, field) for the value-histogram/conjugate-pair
      reporting -- THE FIRST REUSE OF A v10-DEFINED FUNCTION IN THIS
      LINEAGE, since v10 was the first amendment to define it and no later
      amendment existed until now to reuse it from; extends the
      reuse-not-duplicate discipline PF-3/PF-9 established for v9's
      functions to v10's own genuinely-reusable, pure functions, the same
      discipline applied one lineage-generation further in.
      SWEEP_BUDGETS = [1.1, 1.2] is a FIXED, PRE-REGISTERED list (never
      computed or adjusted at runtime). For each b in SWEEP_BUDGETS, in
      order, within that sweep point's own try block, call
      delta_e_truncation_probe_v9.run_truncation_probe_v9(graph,
      BASE_SEED=20260811, b), producing that sweep point's own independent
      new_delta_map, coverage figures, and per_vertex_records (which
      already carry each vertex's own timed_out flag, unchanged in shape
      from every prior amendment -- the natural-completion cross-check
      below reads this existing field; it does not require or add any new
      instrumentation to run_truncation_probe_v9 or two_sided_search
      itself).
      REQUIRED NATURAL-COMPLETION CROSS-CHECK (per sweep point, inside that
      sweep point's own try block, the genuinely new analysis this
      amendment adds -- see amendment_scope for the full specification):
      partition this sweep point's own resolved non-F_p-rational vertices
      by their own timed_out flag into naturally-completed
      (timed_out=False) and still-truncated (timed_out=True); assert
      n_naturally_completed + n_still_truncated == n_resolved and report
      the outcome of that assertion explicitly rather than assuming it
      holds; for the naturally-completed subset, compare each vertex's
      new_delta_map value against RUN-SSIQ-a85692-b's own archived_delta_map
      value and report n_naturally_completed_matching_archived and
      n_naturally_completed_NOT_matching_archived (the latter must be 0
      under the frozen prediction; if nonzero, report every such vertex's
      full detail, never silently reconciled); report the delta_E value
      histogram restricted to the naturally-completed subset alone (dict,
      EMPTY {} if n_naturally_completed==0, well-defined at zero).
      JSON SAFETY (inherited unchanged from v8/v9/v10): every vertex-keyed
      artifact output uses the str(list(v))-keyed convention; a raw tuple
      is never written directly as a JSON dict key.
      OBJECTIVE_BOUNDARY: this remains a DESCRIPTIVE DIAGNOSTIC CONTROL,
      not a claim. It does not test H-SSIQ-36e970's real-arm prediction,
      does not gate any decision rule, and does not itself constitute
      evidence for or against a computable delta_E-gradient or a p^{1/4}
      algorithm. It does not produce a PERSISTS/WEAKENS label. Scoped to
      p=2437 ONLY; no claim about the other three primes or any scale
      beyond this toy instance. This amendment DOES NOT itself answer
      RT-BATCH-011's original truncation-boundary question (does
      RNG-sharing matter under genuine incompleteness) -- per
      DEC-20260806-520ca4 D-3, any future amendment attempting that must
      separately account for BATCH-013's own now-proven truncation-bias
      confound; this amendment instead extends BATCH-013's own
      instrument-behavior characterization to the floor-straddling regime.
