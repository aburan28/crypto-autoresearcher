      gate working as designed and is not a defect.
    pf25_summary: >-
      ADVISORY/OBSERVATION, NEW (round 2), applied as a framing correction.
      FINDING: the mixed-regime equality prediction is not merely already
      confirmed at n = 194 (PF-13) but A PRIORI DETERMINATE. Each vertex in
