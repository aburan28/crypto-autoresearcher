    floor_calibration_set_v11: >-
      PRE-SWEEP FLOOR CALIBRATION (PF-14(b) fix; CAL-1 respecified under
      PF-18; CAL-2 given a gate role under PF-22; boundary wording corrected
      under PF-24(a)). FIXED AND NAMED BY COORDINATE IN THIS FROZEN TEXT so
