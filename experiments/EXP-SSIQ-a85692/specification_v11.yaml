      the artifact must say so in-band.
    pre_registered_prediction_curve_v11: >-
      PRE-REGISTERED, FROZEN BEFORE EXECUTION (PF-14(a); upper arm corrected
      by PF-17; reading rules repaired by PF-20, PF-21 and PF-27; host
      transferability gated by PF-26). Derived entirely from
      RUN-SSIQ-a85692-h's committed archived per-vertex wall_seconds under
      inputs.delta_e_ge_5_inclusion_rule_v11, by this Coordinator's own
      recomputation, independently reproduced in rounds 2 and 3.
      THESE ARE REFERENCE COUNTS, NOT UPPER BOUNDS (PF-27). The word "upper
      bound" is withdrawn throughout. Each carries TWO CORRECTIONS IN
      OPPOSITE DIRECTIONS, and both must be named wherever the figure is
      quoted:
        DOWNWARD, unquantifiable from the archive: natural completion also
        requires the source half to finish within b/2 (0.725 s at
        b = 1.45 s), and the source/target split has never been persisted
        anywhere in this lineage, so no archived record can evidence it.
        UPWARD, crudely boundable: the final-pop straddle means
        timed_out == False implies only t_total <= b + one heap pop, so
        vertices just above b can still complete naturally. From the
        archived density, +18 within 10 ms (count 133) and +71 within 50 ms
        (count 186).
      TRANSFERABILITY: these figures are 4-CPU x86_64 Linux measurements and
      transfer only to a matched execution host. Gate G-0c defers the run if
      the host does not match; nothing in this curve is asserted about an
      unmatched host.
        AT b = 1.10 s: pre-registered n_naturally_completed = 0. This is
        exact under two stated conditions rather than unconditionally:
        (i) the execution host is not FASTER than the archived host (G-0c
        enforces host match by measurement); and (ii) the final-pop slack
        does not exceed 1.149932861328125 - 1.10 = 49.93 ms, roughly ten
        times the largest per-vertex slack this lineage has measured
        (~25 ms at b = 0.6, ~11 ms at b = 0.8, ~5 ms at b = 1.0, from
        RT-BATCH-013's +4.2%/+1.4%/+0.5% aggregate figures). Under load,
        contention only reinforces truncation here, so this arm is
        monotone-safe against the mechanism PF-14 named. Pre-registered
        naturally-completed histogram = {}; delta_E >= 5 count = 0;
        n_still_truncated = n_resolved.
        AT b = 1.45 s: reference n_naturally_completed = 115, with the two
        corrections above (so 133 at 10 ms of slack, 186 at 50 ms, and an
        unquantified downward correction from the 0.725 s source cap).
        Reference delta_E >= 5 count = 36, histogram {5: 20, 6: 4, 7: 6,
        8: 6}; reference delta_E = 5 count = 20; remainder 79 in {2, 3, 4},
        split {2: 28, 3: 43, 4: 8}. Reference mixed-regime split: ~115
        naturally completed against ~79 truncated in the SAME pass.
        Source-side cap at this budget: 0.725 s.
      HOW THE CURVE IS TO BE READ AFTER THE RUN, PRE-COMMITTED SO IT CANNOT
      BE CHOSEN AFTER SEEING THE RESULT. THE RULES ARE EXHAUSTIVE OVER
      MEASURED OUTCOMES AND THE P-1/P-2 BOUNDARY IS NUMERIC (PF-21):
        (P-1) MEASURED n_naturally_completed >= 0.5 x the reference count
        for that budget -- at b = 1.45 s, >= 58 (0.5 x 115 = 57.5). Reading:
        the archived timing curve transfers to this host well enough that
        the mixed-regime configuration is interpretable, and the measured
        naturally-completed histogram may be compared against the reference
        one. (The 0.5 factor is a convention, and PF-27 does not disturb it;
        what PF-27 corrects is the description of its anchor.)
        (P-2) MEASURED n_naturally_completed strictly below 0.5 x the
        reference -- at b = 1.45 s, <= 57, including a measured 0. Reading:
        in the first instance an EXECUTION-ENVIRONMENT ARTIFACT under
        AGENTS.md rule 3, NOT a statement about delta_E convergence, to be
        reported as such alongside the recorded load averages, the measured
        calibration floor, the host-identity comparison and the
        load-adjusted predicted count. It is a fatigue report about the
        instrument, not a statement about the object. The lower the count
        the more strongly this applies; a measured 0 is its extreme case and
        carries no mathematical content whatever.
        AT b = 1.10 s the reference is 0, so P-1/P-2 are vacuous there by
        construction and any measured n_naturally_completed > 0 is an
        over-reference outcome read under P-3.
        (P-3) MEASURED n_naturally_completed ABOVE the reference count at
        either budget. THE BRANCH SET IS EXHAUSTIVE AND ORDERED BY PRIOR
        LIKELIHOOD, WITH THE INSTRUMENT'S OWN MECHANISM FIRST (PF-27's fix;
        the round-3 draft's ordering omitted it entirely, which was the same
        false-exhaustiveness defect PF-20 was raised to fix, one layer down):
          (P-3d) FIRST, AND THE CHEAPEST EXPLANATION AVAILABLE: WITHIN THE
          INSTRUMENT'S OWN FINAL-POP OVERSHOOT TOLERANCE. A measured count
          in the pre-registered band 115 < measured <= 133 at b = 1.45 s is
          FULLY CONSISTENT with identical hardware, identical load, and
          every premise of this amendment intact -- it is the code's own
          documented behaviour. THE BAND IS PRE-REGISTERED HERE AND ITS
          BASIS IS STATED: 133 = #{archived < 1.46}, i.e. 10 ms of slack,
          which is roughly twice the ~5 ms per-vertex slack RT-BATCH-013
          measured at the closest budget (b = 1.0) and is conservative given
          that the measured slack falls steeply with b (~25 ms at 0.6,
          ~11 ms at 0.8, ~5 ms at 1.0). An outcome in this band requires NO
          explanation beyond the instrument and must NOT be reported as a
          contention, hardware or premise-falsification story. At
          b = 1.10 s the corresponding statement is that any measured
          natural completion at all implies a slack above 49.93 ms, which
          would be a genuinely surprising instrument result and is NOT
          covered by P-3d.
          FOR 133 < measured AT b = 1.45 s the outcome is AMBIGUOUS between
          a larger-than-expected overshoot and the branches below, and the
          MEASURED final-pop overshoot distribution required at step (9) is
          the instrument that discriminates them. That is precisely why that
          measurement is required.
          (P-3a) RUN-SSIQ-a85692-h ITSELF RAN UNDER UNRECORDED CONTENTION.
          That run recorded no load average in any window (verified
          directly), so its archived times may already be inflated and a
          RUN-k under lighter contention can legitimately exceed the
          reference WITH EVERY PREMISE INTACT. A scheduling difference, not
          a finding, to be reported with both runs' load figures side by
          side -- noting that RUN-h's side DOES NOT EXIST, which is the
          point and is why PF-26(d) requires RUN-k to record its own.
          (P-3b) A CROSS-HOST DIFFERENCE other than contention.
          ORDERING NOTE (PF-26): P-3a is listed before P-3b, but that
          ordering is CONDITIONAL ON G-0c's MEASURED OUTCOME, not fixed. It
          was chosen under the round-3 draft's assumption of a single
          heavily-loaded machine, and PF-26 broke that assumption. If G-0c
          reports an exact host match, P-3a before P-3b is right. If G-0c
          reports any difference at all short of a deferral-triggering
          mismatch, P-3b moves ahead of P-3a. The artifact must state which
          ordering applied and why.
          (P-3c) ONLY IF P-3d, P-3a AND P-3b ARE ALL EXCLUDED: one of this
          amendment's stated premises is falsified -- the archived timings
          as such, or the b/2 source-side cap reading of two_sided_search.
          THIS is the branch that must be surfaced loudly and never
          reconciled; the first three must not be reported under it.
        (P-4) NO OUTCOME OF THIS RUN, at any budget, licenses the statement
        "delta_E >= 5 convergence does not begin at the floor". Even at
        b = 1.45 s the naturally-completed delta_E >= 5 subset is at most a
        speed-selected 36 of an 80-vertex population, and a low count is
        confounded with host and load by construction under P-2. This is why
        RT-BATCH-013's originating prediction is forwarded as F-1 rather
        than answered.
    floor_calibration_set_v11: >-
      PRE-SWEEP FLOOR CALIBRATION (PF-14(b); CAL-1 respecified under PF-18;
      CAL-2 given a gate role under PF-22; boundary wording corrected under
      PF-24(a); an Executor assertion added under round 3's required
      controls). FIXED AND NAMED BY COORDINATE IN THIS FROZEN TEXT so the
      set cannot be chosen, extended or trimmed after the fact. These are
      exactly the EIGHT SMALLEST archived wall_seconds among
      RUN-SSIQ-a85692-h's 194 per_vertex_records under
      inputs.delta_e_ge_5_inclusion_rule_v11, independently verified by
      coordinate and to full float precision in rounds 2 and 3. Each row is
      [x, y] archived_delta_E archived_wall_seconds:
        [749, 1684]   delta_E 2   1.149932861328125
        [749, 753]    delta_E 2   1.1633622646331787
        [360, 1897]   delta_E 3   1.257300853729248
        [360, 540]    delta_E 3   1.2623295783996582
        [817, 445]    delta_E 2   1.2640187740325928
        [2154, 970]   delta_E 2   1.2711119651794434
        [697, 105]    delta_E 3   1.2978770732879639
        [2405, 1073]  delta_E 2   1.314664602279663
      BOUNDARY, STATED ACCURATELY (PF-24(a) -- the round-2 draft called this
      boundary "comfortably separated", which is FALSE and is withdrawn):
      the ninth smallest is [2154, 1467] at 1.3176441192626953 s, only
      2.98 ms (0.23%) above the eighth, and the tenth is [2405, 1364] at
      1.3180382251739502 s, a further 0.39 ms beyond. THE BOUNDARY IS NOT
