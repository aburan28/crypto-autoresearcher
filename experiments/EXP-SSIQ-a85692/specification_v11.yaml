        Maximum over the whole population: 1.6985499858856201 s.
      EXECUTION-HOST PROVENANCE OF THESE FIGURES (PF-26): all of the above
      are 4-CPU x86_64 Linux measurements
      (Linux-6.18.5-fc-v18-x86_64-with-glibc2.39, Python 3.11.15 [GCC
