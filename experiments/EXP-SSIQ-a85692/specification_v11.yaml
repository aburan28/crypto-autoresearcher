    NATURAL-COMPLETION SEMANTICS, STATED CORRECTLY (PF-12 FIX APPLIED,
    round 1 pre-freeze review, BLOCKING). THE FINDING: the round-1 draft
    asserted that a vertex whose archived TOTAL natural time is below b
    will complete naturally at budget b. That is FALSE as stated, on direct
    read of the real frozen code. run_truncation_probe_v9 does not compute
    timed_out; it copies it (delta_e_truncation_probe_v9.py:183) from
    compute_delta_e.two_sided_search, which sets
    "timed_out": bool(to_s or to_t) (compute_delta_e.py:208) after giving
    the SOURCE table half_budget = time_budget_seconds / 2.0
    (compute_delta_e.py:185-187) and the TARGET table only
    remaining = max(0.0, time_budget_seconds - (t_mid - t0))
    (compute_delta_e.py:189-192).
    THE CORRECTED PREMISE, FROZEN: natural completion at budget b requires
      t_source <= b/2  AND  t_total = t_source + t_target <= b,
    equivalently max(2 * t_source, t_total) <= b. At b = 1.4 s the
    source-side cap is 0.7 s. WHAT THE ARCHIVE CAN AND CANNOT SUPPORT,
    STATED EXPLICITLY: RUN-SSIQ-a85692-h persists ONLY the per-vertex TOTAL
    wall_seconds; the source/target split has never been persisted anywhere
    in this lineage. Therefore the archived curve supports the NECESSARY
    condition (t_total <= b) and NOT the sufficient one. Every archived-
    derived count in inputs.pre_registered_prediction_curve_v11 is
    consequently an UPPER BOUND on n_naturally_completed and is labelled as
    such; the round-1 draft's claim that some vertices are "expected to
    complete NATURALLY" at a given budget is WITHDRAWN and replaced by that
    upper bound. Step (0b)'s calibration CAL-2 measures t_source directly on
    8 named vertices for the first time in this lineage, so the run itself
    supplies the missing quantity rather than assuming it.
    WHAT timed_out == False ACTUALLY ESTABLISHES, FROZEN: that BOTH
    Dijkstra expansions exhausted their heaps within the frozen
    (L = [2,3,5,7,11,13,17,19,23], X = 23, B_SMOOTH = 23) smooth-degree
    search class -- i.e. the returned value is exact WITHIN THAT CLASS. It
    does NOT establish "the true minimal isogeny degree";
    two_sided_search's own docstring is explicit that an UPPER BOUND is
    searched. The round-1 draft's phrase "the returned value IS the
    confirmed true minimum" is WITHDRAWN and replaced by "exact within the
    frozen (L, X=23, B=23) search class" everywhere it occurred.
    THE MISMATCH DICHOTOMY IS REPLACED BY A THREE-WAY BRANCH: the round-1
    draft said a naturally-completed-vs-archived mismatch would mean either
    EV-SSIQ-48d274's derivation is overturned or timed_out does not mean
