      0.33 allowance (55.3%), conservative in the correct direction since
      wall-seconds upper-bound CPU-seconds for a single-threaded run.
      IN PRACTICE the b = 1.45 s pass is expected to fall well below its
      281.3 s worst case because many vertices should complete before their
      budget elapses -- but that expectation is this amendment's own object
      of study, so the budget is sized against the zero-natural-completions
      worst case and relies on it for nothing.
