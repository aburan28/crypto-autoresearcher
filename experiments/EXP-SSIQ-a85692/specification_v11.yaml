  budget:
    wall_clock_seconds_per_run: 1000
    total_cpu_hours: 0.33
    maximum_memory_gb: 2
    maximum_runs: 1
    note: >-
      NOT ZERO NEW SEARCH COST. UNCHANGED THROUGH ALL FOUR DRAFTS: all three
      reviewers independently concluded the design fits this budget and that
      no increase is required, and round 3 reproduced every term to the
      digit. Worst case, term by term: sweep 194 vertices *
      (1.1 + 1.45) s/vertex = 494.7 s, if every vertex at every budget
      consumed its full allotment without its own internal stopping
      condition firing (per arm: 213.4 s at b = 1.10 s and 281.3 s at
      b = 1.45 s); CAL-1 8 * 15.0 = 120.0 s; CAL-2 8 * 2.0 = 16.0 s; graph
      build once ~2 s. The round-4 additions (PF-26 host capture and G-0c
      comparison, PF-27 overshoot summary, PF-29 load-adjusted counts) are
      pure bookkeeping over data already in memory or a single small JSON
      read, well under 1 s in total, absorbed inside the 2 s allowance
      rather than added to it. SUBTOTAL 632.7 s, i.e. 1000 / 632.7 = 1.58x
      margin. Adding the largest per-vertex overshoot factor RT-BATCH-013
      measured on v10's real run (+4.2%) to the 630.7 s of search terms --
      the right base, since the mechanism lives in build_smooth_table's loop
      and does not touch graph construction -- gives 630.7 * 1.042 =
      657.2 s, i.e. 1000 / 657.2 = 1.52x margin. In CPU-hours, 657 s
      single-threaded = 0.183 CPU-hours against 0.33 (55.3%), conservative
      in the correct direction since wall-seconds upper-bound CPU-seconds
      for a single-threaded run and contention pushes CPU-hours consumed
      BELOW that. THE ~2 s GRAPH-BUILD ALLOWANCE IS INDEPENDENTLY SUPPORTED
      BY THE COMMITTED ARTIFACTS (round 3): RUN-h's wall_clock_seconds is
      278.49618768692017 against a sum of per-vertex wall_seconds of
      277.831778..., leaving 0.664 s for graph build, identity verification,
      two comparisons and all JSON I/O -- so 2 s is roughly 3x measured.
      NOTE ON LOAD, WITH ONE HONEST QUALIFICATION ROUND 3 ADDED: a TRUNCATED
      vertex consumes ~b wall seconds regardless of contention, since
      build_smooth_table gates on wall clock and simply completes less work,
      so the dominant 494.7 s term is close to load-invariant -- but a
      truncated vertex still pays its final straddling pop, and under
      contention that pop takes longer in wall time. That is exactly the
      +4.2% term and it is already in the arithmetic. It is the SAME
      mechanism as PF-27's, and this document must not treat it as a budget
      nuisance in one place while denying its existence in another; after
      PF-27 it is named consistently in both.
      IF A DEFER BRANCH FIRES the run costs roughly 140 s (host capture plus
      CAL-1 and CAL-2 worst case) and produces the calibration and host
      facts and nothing else -- an infrastructure outcome under AGENTS.md
      rule 3, never a result about delta_E.
