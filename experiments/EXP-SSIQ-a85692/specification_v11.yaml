        cal_graph = {**graph, "vertices": THE_EIGHT}   # a NEW dict; the
        # real graph object is never mutated;
        delta_e_truncation_probe_v9.run_truncation_probe_v9(cal_graph,
        BASE_SEED = 20260811, 15.0)
      -- GENUINELY IMPORTED, UNCHANGED, with ZERO duplicated code, and the
      authorized-duplicate classification for CAL-1 DROPPED ENTIRELY.
      run_truncation_probe_v9 subscripts graph only at lines 156-158 for
      field, q and vertices (verified statement by statement in round 3), so
      over cal_graph its fp_rational list is EMPTY, its non_fp_rational list
      is exactly the eight, n_attempted = 8, n_non_fp_rational = 8,
