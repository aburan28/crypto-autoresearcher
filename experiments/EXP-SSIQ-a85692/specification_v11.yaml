    load_defer_gate_v11: >-
      PRE-REGISTERED DEFER/ABORT GATE (PF-14(c) fix; G-1's threshold moved
      by PF-17; G-0b added by PF-22; G-2b added by PF-23). THIS IS A HARD
      PRECONDITION, NOT A CAVEAT: it is evaluated immediately after step
      (0b)'s calibration and BEFORE the sweep loop begins, and its branches
      are exhaustive. Round 2 probed it for bypasses and could construct
      none.
      Let F_cal = the MINIMUM measured CAL-1 wall_seconds over the eight
      calibration vertices, counting only vertices whose CAL-1 timed_out is
      False. Let A = 1.149932861328125 (the archived minimum, attained by
      [749, 1684], which is a member of the calibration set, so F_cal is the
      measured analogue of exactly the same quantity). F_cal is a value IN
      SECONDS, not a ratio, and both thresholds it is compared against are
      absolute second values. The branches are evaluated IN ORDER, and the
      ordering is what makes F_cal well-defined: G-0 fires first if ANY of
      the eight timed out, so by the time G-1 is reached all eight are
      non-timed-out and the qualifier in F_cal's definition is vacuous.
        (G-0) ABORT-AS-INFRA. If ANY of the eight CAL-1 per-vertex records
        has timed_out True at the 15.0 s budget, or if fewer than 8 CAL-1
        records were produced: DEFER the entire run. The archived maximum
        natural time over all 194 vertices is 1.6985499858856201 s, so a
        15.0 s timeout implies at least an ~8.8x slowdown and the machine is
        not in a state where any timing measurement is interpretable. This
        is an infrastructure/environment outcome under AGENTS.md rule 3 and
        is NEVER mathematical counterevidence about delta_E.
        (G-0b) ABORT-AS-INFRA ON THE SOURCE SIDE (PF-22's fix). Else if ANY
        of the eight CAL-2 source-side builds returns timed_out True at its
        2.0 s cap: DEFER the entire run. Reason, stated rather than
        asserted: those same eight vertices have archived TOTAL times of at
        most 1.314664602279663 s, so a source half alone exceeding 2.0 s
        implies the source side is running at least ~1.5x inflated, which
        puts the b = 1.45 s arm's 0.725 s source-side cap out of reach for
        essentially every vertex and makes its natural-completion result
        predictably empty for environmental reasons. Same rule-3 status as
        G-0.
        (G-1) DEFER. Else if F_cal >= 1.45 (THE LARGEST SWEEP BUDGET -- this
        threshold is DEFINED as the largest sweep budget and moved from 1.4
        to 1.45 with PF-17's change to SWEEP_BUDGETS): DEFER the sweep. In
        this state the b = 1.45 s arm's natural-completion cross-check is
        GUARANTEED EMPTY for environmental reasons, so its emptiness carries
        no information and must not be written as a result.
        (G-2) PROCEED, STAMPED. Else if F_cal > 1.32242279052734375
        (= 1.15 * A, the pre-registered 1.15x inflation tolerance -- this
        threshold is derived from the ARCHIVED FLOOR and NOT from any sweep
        budget, so PF-17's budget change does not move it; that was
        re-checked explicitly rather than assumed): PROCEED with both sweep
        points, but set load_confounded: true.
        (G-2b) PROCEED, STAMPED ON THE LOAD-ADJUSTED COUNT (PF-23's fix, in
        stamping form). Independently of G-2, compute the LOAD-ADJUSTED
        PREDICTED COUNT: take the median of CAL-1's eight measured/archived
        ratios, multiply every one of RUN-SSIQ-a85692-h's 194 archived
        wall_seconds by that median, and count how many products fall
        strictly below b. Report this count for BOTH sweep budgets in
        truncation_sweep_comparison.json and execution_report.yaml. If the
        load-adjusted predicted count at b = 1.45 s is BELOW 10, set
        load_confounded: true even if G-3 would otherwise have applied.
        DISCLOSED WEAKENING RELATIVE TO THE REVIEWER'S PROPOSAL: this is a
        STAMPING clause and NOT a DEFER clause, because the load-adjusted
        count rests on an n = 8 extremity-selected median ratio applied
        uniformly across a 194-vertex distribution -- a cruder instrument
        than the direct floor measurement the defer branches use. This
        Coordinator judges it strong enough to stamp an artifact but not to
        discard a run; a round-3 reviewer who disagrees should say so.
        (G-3) PROCEED, CLEAN. Else (F_cal <= 1.32242279052734375 and G-2b
        did not fire): PROCEED with both sweep points and set
        load_confounded: false.
      REQUIRED ARTIFACT BEHAVIOUR:
        load_confounded is a REQUIRED, ALWAYS-PRESENT top-level boolean
        field of truncation_sweep_comparison.json in every branch that
        writes that file, and is restated in execution_report.yaml adjacent
        to every n_naturally_completed figure. It is never omitted and
        never defaulted silently.
        ON G-0, G-0b OR G-1: NO truncation_sweep_comparison.json asserting
        ANY natural-completion result is written. The run instead writes
        truncation_sweep_comparison.json containing ONLY: deferred: true,
        deferral_branch ("G-0", "G-0b" or "G-1"), load_confounded: true, the
        full CAL-1/CAL-2 records, the load-adjusted predicted counts, the
        recorded hw.ncpu and start/end load averages, the pre-registered
        prediction curve, and an explicit statement that NO SWEEP WAS
        EXECUTED and that this outcome is an infrastructure/environment
        condition under AGENTS.md rule 3 and is NOT evidence about delta_E
        convergence, truncation bias, or H-SSIQ-36e970. THAT LIST IS CLOSED:
        the word ONLY is load-bearing, and a future edit must not weaken it
        to "including" -- round 2 identified the closed list, not the
        absent-fields sentence, as the clause that actually makes this
        branch airtight. Every sweep-derived field is therefore excluded by
        the closed list whether or not it is named; to be explicit, the
        excluded set includes at least n_attempted, n_resolved,
        n_timed_out, n_naturally_completed, n_still_truncated,
        n_unresolved_and_timed_out, n_unresolved_and_not_timed_out,
        coverage_fraction, n_naturally_completed_matching_archived, every
        histogram field, and the I-1/I-2/I-3 identity outcomes. They are
        ABSENT, not zero and not {} -- a written zero is exactly the
        silent-null failure PF-14 exists to prevent.
        ON G-2, G-2b OR G-3: the sweep runs as specified, with
        load_confounded set accordingly and every natural-completion figure
        reported adjacent to it and to the load-adjusted predicted count.
        THE GATE IS EVALUATED ONCE, ON THE FROZEN THRESHOLDS ABOVE, AND MAY
        NOT BE RECOMPUTED, RELAXED, OR RE-RUN AFTER SEEING ANY SWEEP
        RESULT. If the Executor believes a threshold is wrong, the correct
        action is to stop and report it, not to adjust it -- changing a
        pre-registered success/validity criterion after observing outcomes
        requires a versioned protocol_amendment record from the
        Coordinator, never an Executor edit.
    mixed_regime_sweep_search_v11: >-
      TWO INDEPENDENT PART-A-ONLY BUDGET PASSES OVER ONE SHARED, ONCE-BUILT
      GRAPH, PRECEDED BY THE MANDATORY STEP (0b) CALIBRATION AND DEFER GATE
      (see amendment_scope for the full procedure). A new module,
      delta_e_floor_straddling_sweep_v11.py, defines the sweep driver.
      GENUINELY IMPORTS, UNCHANGED, and calls DIRECTLY, no reimplementation:
      delta_e_truncation_probe_v9.run_truncation_probe_v9 -- called once per
      sweep budget on the FULL graph, AND once more at step (0b) on the
      vertex-restricted shallow copy for CAL-1 (PF-18);
      delta_e_truncation_probe_v9.parse_v8_new_delta_map(path) for loading
      RUN-SSIQ-a85692-h's own new_delta_map;
