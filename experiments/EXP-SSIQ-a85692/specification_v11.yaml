        b = 1.45 s remainder, which this Coordinator obtained only as the
        total 79 by direct subtraction (115 - 36, both recomputed here) and
        took the split itself from round 1's §1 table. ROUND 3
        INDEPENDENTLY RECOMPUTED THAT SPLIT AND CONFIRMED IT, so it now
        rests on two independent recomputations rather than on inheritance.
        Minimum archived wall_seconds over the whole population:
        1.149932861328125 s (vertex [749, 1684], delta_E = 2) -- the
        1.14993 s "floor" this lineage has cited since BATCH-013.
        Minimum over the delta_E >= 5 population: 1.3924050331115723 s
