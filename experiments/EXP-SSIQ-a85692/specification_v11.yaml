  inputs:
    contribution_accounting_v11: >-
      HONEST ACCOUNTING OF WHAT THIS AMENDMENT IS EXPECTED TO YIELD, FROZEN
      IN THE SPECIFICATION SO THAT NO LATER CITATION CAN INFLATE IT (round 3
      §8 asked for this in the frozen text rather than left to a reader, and
      this Coordinator agrees).
      THE REDUCTION IS REAL AND IT IS THIS AMENDMENT'S OWN DOING, ARRIVED AT
      HONESTLY: PF-13 disclosed that the equality proposition was already
      confirmed at n = 194; PF-25 showed it is a priori determinate, hence a
      control rather than a measurement; PF-27 showed the archived-derived
      count it is read against is not the one-sided bound this document
      claimed; and PF-26 showed the host that produced the reference may not
      be the host that produces the measurement. Each of those is a
      correction that made the amendment smaller and more honest, and none
      of them is a reason to pretend otherwise now.
      WHAT REMAINS:
