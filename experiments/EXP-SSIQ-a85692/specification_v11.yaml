      CAL-2 consumes a FRESH RNG instance and is therefore an INDEPENDENT
      MEASUREMENT of the source-side build, NOT a decomposition of CAL-1's
      total; the two must not be presented as summing.
      REUSE CLASSIFICATION, DISCLOSED (PF-3/PF-9 standard): CAL-1 is an
      8-vertex restriction of run_truncation_probe_v9's own inner loop
