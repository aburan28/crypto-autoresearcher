      REQUIRED PRECONDITION CHECK, replacing the dropped duplicate
      disclosure: before the call the Executor must confirm BY DIRECT READ
      of the frozen delta_e_truncation_probe_v9.py that
      run_truncation_probe_v9 reads NO key of the graph dict other than
