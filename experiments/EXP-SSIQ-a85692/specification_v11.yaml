  budget:
    wall_clock_seconds_per_run: 1000
    total_cpu_hours: 0.33
    maximum_memory_gb: 2
    maximum_runs: 1
    note: >-
      NOT ZERO NEW SEARCH COST. UNCHANGED FROM THE ROUND-1 DRAFT: the
      round-1 reviewer's own cost-model check concluded that the corrected
      design fits this budget and that no increase is required, and this
      Coordinator re-derived the arithmetic independently in round 2 rather
      than carrying that conclusion forward unexamined. Worst case, term by
      term: sweep 194 vertices * (1.1 + 1.4) s/vertex = 485.0 s, if every
      vertex at every budget consumed its full allotment without its own
      internal stopping condition firing; CAL-1 calibration 8 * 15.0 =
      120.0 s; CAL-2 calibration 8 * 2.0 = 16.0 s; graph build once ~2 s.
      SUBTOTAL 623.0 s, i.e. 1.61x margin under the 1000 s cap. Adding the
      largest per-vertex overshoot factor RT-BATCH-013 actually measured on
      v10's real run (+4.2%, from the budget test sitting at the top of
      build_smooth_table's heap loop) to the 621.0 s of search terms gives
      ~647 s, i.e. 1.55x margin. In CPU-hours, 647 s single-threaded =
      0.180 CPU-hours against the 0.33 CPU-hour allowance. In practice the
      b = 1.4 s pass is expected to fall below its 271.6 s worst case
      because some vertices should complete before their budget elapses --
      but that expectation is precisely this amendment's object of study, so
      the budget is sized against the zero-natural-completions worst case
      and relies on the expectation for nothing. NOTE ON LOAD: a TRUNCATED
      vertex consumes ~b wall seconds regardless of contention (it simply
      completes less work), so the dominant 485.0 s term is close to
      load-invariant; the calibration, graph build, JSON I/O and overshoot
      terms do inflate under contention, which the 1.55x-1.61x margin
      absorbs.
