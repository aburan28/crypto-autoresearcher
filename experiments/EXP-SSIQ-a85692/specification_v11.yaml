    load_defer_gate_v11: >-
      PRE-REGISTERED DEFER/ABORT GATE (PF-14(c); G-1's threshold moved by
      PF-17; G-0b added by PF-22; G-2b added by PF-23 and its threshold
      aligned by PF-29(a); G-0c added by PF-26). THIS IS A HARD
      PRECONDITION, NOT A CAVEAT: it is evaluated immediately after step
      (0b)'s host capture and calibration and BEFORE the sweep loop begins,
      and its branches are exhaustive. Rounds 2 and 3 both probed it for
      bypasses and could construct none.
      Let F_cal = the MINIMUM measured CAL-1 wall_seconds over the eight
      calibration vertices, counting only vertices whose CAL-1 timed_out is
      False. Let A = 1.149932861328125 (the archived minimum, attained by
      [749, 1684], a member of the calibration set, so F_cal is the measured
      analogue of exactly the same quantity). F_cal is a value IN SECONDS,
      not a ratio, and both thresholds it meets are absolute second values.
      The branches are evaluated IN ORDER, and the ordering is what makes
      F_cal well-defined: G-0 fires first on any CAL-1 timeout or short
      record set, so by the time G-1 evaluates all eight are non-timed-out
      and the qualifier in F_cal's definition is vacuous rather than
      potentially empty-set.
        (G-0c) ABORT-AS-INFRA ON HOST MISMATCH (PF-26's fix). FIRST,
        BEFORE ANY CALIBRATION IS INTERPRETED: read RUN-SSIQ-a85692-h's own
        runs/RUN-SSIQ-a85692-h/environment.json and compare its platform and
        cpus_available against RUN-k's own run-start capture. DEFER the
        entire run if EITHER of the following holds:
          - RUN-k's platform.platform() does not begin with "Linux" or
            RUN-k's platform.machine() is not "x86_64" -- i.e. the OS family
            or ISA differs from the archived host's
            Linux-6.18.5-fc-v18-x86_64-with-glibc2.39;
          - RUN-k's os.cpu_count() differs from RUN-h's recorded
            cpus_available of 4.
        A DIFFERING KERNEL PATCH LEVEL OR glibc MINOR VERSION ALONE IS NOT A
        MISMATCH and does not defer; it is recorded in the artifact as a
        noted difference. If RUN-h's cpus_available cannot be read, DEFER
        rather than assume. This branch converts host comparability from an
        asserted premise into a measured one; it is an infrastructure
        outcome under AGENTS.md rule 3 and is NEVER mathematical
        counterevidence about delta_E. Rationale: the entire reference curve,
        A, F_cal and every threshold below are 4-CPU x86_64 Linux
        measurements and transfer only across matched hosts.
        (G-0) ABORT-AS-INFRA ON CAL-1. Else if ANY of the eight CAL-1
        per-vertex records has timed_out True at the 15.0 s budget, or fewer
        than 8 CAL-1 records were produced: DEFER the entire run. The
        archived maximum natural time over all 194 vertices is
        1.6985499858856201 s, so a 15.0 s timeout implies at least an ~8.8x
        slowdown and the machine is not in a state where any timing
        measurement is interpretable. Rule-3 outcome.
        (G-0b) ABORT-AS-INFRA ON THE SOURCE SIDE (PF-22's fix). Else if ANY
        of the eight CAL-2 source-side builds returns timed_out True at its
        2.0 s cap: DEFER the entire run. Those eight vertices have archived
        TOTAL times of at most 1.314664602279663 s, so a source half alone
        exceeding 2.0 s implies the source side is running at least ~1.5x
        inflated, putting the b = 1.45 s arm's 0.725 s source-side cap out
        of reach for essentially every vertex. Rule-3 outcome.
        (G-1) DEFER. Else if F_cal >= 1.45 (THE LARGEST SWEEP BUDGET -- this
        threshold is DEFINED as the largest sweep budget and moved from 1.4
        to 1.45 with PF-17's change to SWEEP_BUDGETS): DEFER the sweep. In
        this state the b = 1.45 s arm's natural-completion cross-check is
        guaranteed empty for environmental reasons, so its emptiness carries
        no information and must not be written as a result.
        (G-2) PROCEED, STAMPED. Else if F_cal > 1.32242279052734375
        (= 1.15 x A, the pre-registered 1.15x inflation tolerance -- derived
        from the ARCHIVED FLOOR and NOT from any sweep budget, so PF-17's
        change does not move it; round 3 verified 1.15 x A equals this
        literal exactly as a rational): PROCEED with both sweep points, but
        set load_confounded: true. THE EXECUTOR MUST USE THE FROZEN LITERAL
        1.32242279052734375 AND MUST NOT EVALUATE 1.15 * A AT RUNTIME: the
        literal's nearest IEEE-754 double is 1.3224227905273438 while
        1.15 * A evaluates to 1.3224227905273436, one ULP apart. Immaterial
        against a wall-clock measurement, but this specification already
        forbids runtime recomputation of frozen thresholds and the Executor
        should know why.
        (G-2b) PROCEED, STAMPED ON THE LOAD-ADJUSTED COUNT (PF-23, threshold
        aligned by PF-29(a)). Independently of G-2, compute the LOAD-ADJUSTED
        PREDICTED COUNT (LAC): take the median of CAL-1's measured/archived
        ratios OVER NON-TIMED-OUT VERTICES ONLY, multiply every one of
        RUN-SSIQ-a85692-h's 194 archived wall_seconds by that median, and
        count how many products fall strictly below b. Report LAC for BOTH
        sweep budgets in truncation_sweep_comparison.json and
        execution_report.yaml. IF LAC AT b = 1.45 s IS BELOW 58, set
        load_confounded: true even if G-3 would otherwise have applied.
        WHY 58 AND NOT THE ROUND-3 DRAFT'S 10: 58 is P-1/P-2's own frozen
        boundary (0.5 x the reference count of 115), so the artifact's
        top-level boolean and this specification's reading rule now agree
        about the same run BY CONSTRUCTION. The round-3 value of 10 was
        undefended and sat two rules apart from that boundary, leaving a
        band of predicted counts from about 10 to 57 in which the reading
        rule called an outcome an environment artifact while
        load_confounded read false -- a median inflation of only 1.05 yields
        LAC = 31 and would have gone unstamped. THE STAMPING FORM IS
        RETAINED RATHER THAN UPGRADED TO A DEFER, for the epistemic reason
        round 3 accepted: LAC rests on an n = 8 extremity-selected median
        ratio applied uniformly across a 194-vertex distribution, a cruder
        instrument than the direct floor measurement the defer branches use.
        It is strong enough to stamp an artifact, not to discard a run.
        (G-3) PROCEED, CLEAN. Else (F_cal <= 1.32242279052734375 and G-2b
        did not fire): PROCEED with both sweep points and set
        load_confounded: false.
      REQUIRED ARTIFACT BEHAVIOUR:
        load_confounded is a REQUIRED, ALWAYS-PRESENT top-level boolean of
        truncation_sweep_comparison.json in every branch that writes that
        file, restated in execution_report.yaml adjacent to every
        n_naturally_completed figure. Never omitted, never defaulted
        silently.
        ON G-0c, G-0, G-0b OR G-1: NO truncation_sweep_comparison.json
        asserting ANY natural-completion result is written. The run instead
        writes truncation_sweep_comparison.json containing ONLY: deferred:
        true; deferral_branch ("G-0c", "G-0", "G-0b" or "G-1");
        load_confounded: true; the run-start (and run-end, if reached) host
        capture; RUN-h's archived host values and the G-0c comparison
        outcome; the full CAL-1/CAL-2 records to whatever extent they exist;
        the load-adjusted predicted counts; the pre-registered reference
        curve with its two-sided corrections; and an explicit statement that
        NO SWEEP WAS EXECUTED and that this outcome is an
        infrastructure/environment condition under AGENTS.md rule 3 and is
        NOT evidence about delta_E convergence, truncation bias, or
        H-SSIQ-36e970. THAT LIST IS CLOSED: the word ONLY is load-bearing
        and a future edit must not weaken it to "including" -- round 2
        correctly identified the closed list, not any absent-fields
        sentence, as the clause that makes this branch airtight. Every
        sweep-derived field is excluded whether or not it is named; to be
        explicit, the excluded set includes at least n_attempted,
        n_resolved, n_timed_out, n_naturally_completed, n_still_truncated,
        n_unresolved_and_timed_out, n_unresolved_and_not_timed_out,
        coverage_fraction, n_naturally_completed_matching_archived, every
        histogram field, the measured final-pop overshoot distribution, and
        the I-1/I-2/I-3 identity outcomes. They are ABSENT, not zero and not
        {} -- a written zero is exactly the silent-null failure PF-14 exists
        to prevent.
        LOAD-ADJUSTED COUNTS ON A DEFER BRANCH (PF-29(b)): the closed list
        requires them, but on G-0c or G-0 they may be uncomputable (no CAL-1
        ratios, or only timed-out ones). In that case they are reported as
        NULL WITH A REASON STRING -- e.g. "undefined: fewer than one
        non-timed-out CAL-1 record" -- and NEVER as 0 or as a median over
        timed-out ratios, which would fabricate a number. Same "ABSENT, not
        zero" discipline as above, applied to the field PF-23 added.
        ON G-2, G-2b OR G-3: the sweep runs as specified, with
        load_confounded set accordingly and every natural-completion figure
        reported adjacent to it, to the load-adjusted predicted count, to
        the host-identity comparison outcome, and to the applicable
        P-1/P-2/P-3 reading.
        THE GATE IS EVALUATED ONCE, ON THE FROZEN THRESHOLDS ABOVE, AND MAY
        NOT BE RECOMPUTED, RELAXED, OR RE-RUN AFTER SEEING ANY SWEEP
        RESULT. If the Executor believes a threshold is wrong, the correct
        action is to stop and report it, not to adjust it -- changing a
        pre-registered success/validity criterion after observing outcomes
        requires a versioned protocol_amendment record from the
        Coordinator, never an Executor edit.
    mixed_regime_sweep_search_v11: >-
      TWO INDEPENDENT PART-A-ONLY BUDGET PASSES OVER ONE SHARED, ONCE-BUILT
      GRAPH, PRECEDED BY THE MANDATORY STEP (0b) HOST CAPTURE, CALIBRATION
      AND DEFER GATE (see amendment_scope). A new module,
      delta_e_floor_straddling_sweep_v11.py, defines the sweep driver.
      GENUINELY IMPORTS, UNCHANGED, and calls DIRECTLY, no reimplementation:
      delta_e_truncation_probe_v9.run_truncation_probe_v9 -- once per sweep
      budget on the FULL graph, AND once at step (0b) on the
      vertex-restricted shallow copy for CAL-1 (PF-18);
      delta_e_truncation_probe_v9.parse_v8_new_delta_map(path);
      delta_e_truncation_probe_v9.compare_against_archived(new_delta_map,
      archived_delta_map, non_fp_rational_set) and
      delta_e_truncation_probe_v9.compare_against_v8(new_delta_map,
      v8_delta_map, non_fp_rational_set);
      trapping_diagnostic_v5.build_graph_for_prime and
      trapping_diagnostic_v5.load_archived_prime_data;
      delta_e_independent_rng_probe_v8.verify_graph_identity (once, step
