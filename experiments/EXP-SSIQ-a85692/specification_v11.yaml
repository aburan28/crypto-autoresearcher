    load_defer_gate_v11: >-
      PRE-REGISTERED DEFER/ABORT GATE (PF-14(c) fix). THIS IS A HARD
      PRECONDITION, NOT A CAVEAT: it is evaluated immediately after step
      (0b)'s calibration and BEFORE the sweep loop begins, and its branches
      are exhaustive. Let F_cal = the MINIMUM measured CAL-1 wall_seconds
      over the eight calibration vertices, counting only vertices whose
      CAL-1 timed_out is False. Let A = 1.149932861328125 (the archived
      minimum, attained by [749, 1684], which is a member of the
      calibration set). The branches are evaluated IN ORDER:
        (G-0) ABORT-AS-INFRA. If ANY of the eight CAL-1 calls returns
        timed_out True at a 15.0 s budget, or if fewer than 8 CAL-1 records
        were produced: DEFER the entire run. The archived maximum natural
        time over all 194 vertices is 1.6985499858856201 s, so a 15.0 s
        timeout implies at least an ~8.8x slowdown and the machine is not
        in a state where any timing measurement is interpretable. This is
        an infrastructure/environment outcome under AGENTS.md rule 3 and is
        NEVER mathematical counterevidence about delta_E.
        (G-1) DEFER. Else if F_cal >= 1.4 (the largest sweep budget):
        DEFER the sweep. In this state the b = 1.4 s arm's
        natural-completion cross-check is GUARANTEED EMPTY for
        environmental reasons, so its emptiness carries no information and
        must not be written as a result.
        (G-2) PROCEED, STAMPED. Else if F_cal > 1.32242279052734375
        (= 1.15 * A, the pre-registered 1.15x inflation tolerance):
        PROCEED with both sweep points, but set load_confounded: true.
        (G-3) PROCEED, CLEAN. Else (F_cal <= 1.32242279052734375):
        PROCEED with both sweep points and set load_confounded: false.
      REQUIRED ARTIFACT BEHAVIOUR:
        load_confounded is a REQUIRED, ALWAYS-PRESENT top-level boolean
        field of truncation_sweep_comparison.json in every branch that
        writes that file, and is restated in execution_report.yaml adjacent
        to every n_naturally_completed figure. It is never omitted and
        never defaulted silently.
        ON G-0 OR G-1: NO truncation_sweep_comparison.json asserting ANY
        natural-completion result is written. The run instead writes
        truncation_sweep_comparison.json containing ONLY: deferred: true,
        deferral_branch ("G-0" or "G-1"), load_confounded: true, the full
        CAL-1/CAL-2 records, the recorded hw.ncpu and start/end load
        averages, the pre-registered prediction curve, and an explicit
        statement that NO SWEEP WAS EXECUTED and that this outcome is an
        infrastructure/environment condition under AGENTS.md rule 3 and is
        NOT evidence about delta_E convergence, truncation bias, or
        H-SSIQ-36e970. n_naturally_completed, n_resolved and every
        histogram field are ABSENT (not zero, not {}) in this branch --
        their absence is the point, since a written zero is exactly the
        silent-null failure PF-14 exists to prevent.
        ON G-2 OR G-3: the sweep runs as specified, with load_confounded
        set accordingly and every natural-completion figure reported
        adjacent to it.
        THE GATE IS EVALUATED ONCE, ON THE FROZEN THRESHOLDS ABOVE, AND MAY
        NOT BE RECOMPUTED, RELAXED, OR RE-RUN AFTER SEEING ANY SWEEP
        RESULT. If the Executor believes a threshold is wrong, the correct
        action is to stop and report it, not to adjust it -- changing a
        pre-registered success/validity criterion after observing outcomes
        requires a versioned protocol_amendment record from the
        Coordinator, never an Executor edit.
    mixed_regime_sweep_search_v11: >-
      TWO INDEPENDENT PART-A-ONLY BUDGET PASSES OVER ONE SHARED, ONCE-BUILT
      GRAPH, PRECEDED BY THE MANDATORY STEP (0b) CALIBRATION AND DEFER GATE
      (see amendment_scope for the full procedure). A new module,
      delta_e_floor_straddling_sweep_v11.py, defines the sweep driver.
      GENUINELY IMPORTS, UNCHANGED, and calls DIRECTLY, no reimplementation:
      delta_e_truncation_probe_v9.run_truncation_probe_v9(graph, base_seed,
      b) for the per-vertex search loop itself;
      delta_e_truncation_probe_v9.parse_v8_new_delta_map(path) for loading
      RUN-SSIQ-a85692-h's own new_delta_map;
      delta_e_truncation_probe_v9.compare_against_archived(new_delta_map,
      archived_delta_map, non_fp_rational_set) and
      delta_e_truncation_probe_v9.compare_against_v8(new_delta_map,
      v8_delta_map, non_fp_rational_set) for both required comparisons'
      matching/diffing logic; trapping_diagnostic_v5.build_graph_for_prime
      and trapping_diagnostic_v5.load_archived_prime_data;
      delta_e_independent_rng_probe_v8.verify_graph_identity (called once,
      at step (0)); delta_e_independent_rng_probe_v8.derive_per_vertex_seed
      and compute_delta_e.two_sided_search and
      compute_delta_e.build_smooth_table (all three for step (0b)'s
      calibration ONLY, per floor_calibration_set_v11 -- note this is the
      first amendment in this lineage to import two_sided_search or
      build_smooth_table directly, and it does so ONLY inside the
      calibration, never in the sweep loop, where the search remains
      exclusively inside the genuinely-imported run_truncation_probe_v9);
      delta_e_truncation_sweep_v10.value_histogram_and_conjugate_pairs(
      resolved_non_fp_set, new_delta_map, field) for the value-histogram/
      conjugate-pair reporting -- THE FIRST REUSE OF A v10-DEFINED FUNCTION
      IN THIS LINEAGE, extending the reuse-not-duplicate discipline
      PF-3/PF-9 established for v9's functions to v10's own
      genuinely-reusable, pure functions. PLUMBING NOTE, STATED HERE RATHER
      THAN LEFT FOR AN EXECUTOR TO DISCOVER (the same note PF-9 attached to
      the comparison functions in v10 round 2, raised again as an advisory
      by the round-1 reviewer): resolved_non_fp_set is NOT returned by
      run_truncation_probe_v9's output dict and must be reconstructed by
      the caller, from that sweep point's own per_vertex_records as
      {tuple(rec["vertex"]) for rec in per_vertex_records if
      rec["resolved"] is True}. THE SAME FUNCTION IS CALLED A SECOND TIME
      PER SWEEP POINT with the NATURALLY-COMPLETED subset
      {tuple(rec["vertex"]) for rec in per_vertex_records if
      rec["resolved"] is True and rec["timed_out"] is False} as its
      resolved_non_fp_set argument, per the BATCH-012 obligation in
      amendment_scope; the two calls' outputs are reported under distinct,
      unambiguous field names and are never merged.
      SWEEP_BUDGETS = [1.1, 1.4] is a FIXED, PRE-REGISTERED list (never
      computed or adjusted at runtime, and never derived from the
      calibration -- the calibration gates the run, it does not tune it).
      For each b in SWEEP_BUDGETS, in order, within that sweep point's own
      try block, call
      delta_e_truncation_probe_v9.run_truncation_probe_v9(graph,
      BASE_SEED = 20260811, b), producing that sweep point's own independent
      new_delta_map, coverage figures, and per_vertex_records (which
      already carry each vertex's own timed_out flag, unchanged in shape
      from every prior amendment -- the mixed-regime cross-check reads this
      existing field; it does not require or add any new instrumentation to
      run_truncation_probe_v9 or two_sided_search itself).
      REQUIRED MIXED-REGIME NATURAL-COMPLETION CROSS-CHECK (per sweep
      point, inside that sweep point's own try block -- see amendment_scope
      for the full specification, the disclosed prior evidence state, the
      M-1/M-2/M-3 mismatch branching, and the PF-16 population
      definitions): partition this sweep point's own resolved
      non-F_p-rational vertices by their own timed_out flag; report all
      seven PF-16 counts with their populations named and the outcome of
      all three identities (I-1)/(I-2)/(I-3) explicitly; for the
      naturally-completed subset, compare each vertex's new_delta_map value
      against RUN-SSIQ-a85692-b's own archived_delta_map value and report
      n_naturally_completed_matching_archived and
      n_naturally_completed_NOT_matching_archived, with every mismatch
      reported in full and branch-labelled M-1/M-2/M-3, never silently
      reconciled; report the delta_E value histogram restricted to the
      naturally-completed subset alone (dict, EMPTY {} if
      n_naturally_completed == 0, well-defined at zero) alongside the
      pre-registered predicted histogram for that budget.
      JSON SAFETY (inherited unchanged from v8/v9/v10): every vertex-keyed
      artifact output uses the str(list(v))-keyed convention; a raw tuple
      is never written directly as a JSON dict key.
      OBJECTIVE_BOUNDARY: this remains a DESCRIPTIVE DIAGNOSTIC CONTROL,
      not a claim. It does not test H-SSIQ-36e970's real-arm prediction,
      does not gate any decision rule, and does not itself constitute
      evidence for or against a computable delta_E-gradient or a p^{1/4}
      algorithm. It does not produce a PERSISTS/WEAKENS label. Scoped to
      p=2437 ONLY; no claim about the other three primes or any scale
      beyond this toy instance. It does NOT answer RT-BATCH-011's original
      truncation-boundary question (does RNG-sharing matter under genuine
      incompleteness) -- per DEC-20260806-520ca4 D-3, any future amendment
      attempting that must separately account for BATCH-013's own
      now-proven truncation-bias confound. IT ALSO DOES NOT, UNDER ANY
      OUTCOME, ESTABLISH OR REFUTE THAT "delta_E >= 5 CONVERGENCE BEGINS AT
      THE FLOOR": the predicted delta_E >= 5 naturally-completed subset at
      b = 1.4 s has an upper bound of 4 vertices out of an 80-vertex
      delta_E >= 5 population, and a null there is confounded with machine
      load by construction (prediction-curve reading rule P-4). What this
      amendment can contribute, if the defer gate passes and the prediction
      curve is tracked, is the MIXED-REGIME conditioning of an equality
      result already established at n = 194 -- and nothing broader.
