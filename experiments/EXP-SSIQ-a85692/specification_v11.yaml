      DRAFTS: both reviewers independently concluded that the corrected
      design fits this budget and that no increase is required, and this
      Coordinator re-derived the arithmetic in round 3 for the corrected
      sweep points rather than carrying either conclusion forward
      unexamined. Worst case, term by term: sweep 194 vertices *
      (1.1 + 1.45) s/vertex = 494.7 s, if every vertex at every budget
      consumed its full allotment without its own internal stopping
      condition firing (per arm: 213.4 s at b = 1.10 s and 281.3 s at
      b = 1.45 s); CAL-1 calibration 8 * 15.0 = 120.0 s; CAL-2 calibration
      8 * 2.0 = 16.0 s; graph build once ~2 s. SUBTOTAL 632.7 s, i.e.
      1000 / 632.7 = 1.58x margin under the 1000 s cap. Adding the largest
      per-vertex overshoot factor RT-BATCH-013 actually measured on v10's
      real run (+4.2%, from the budget test sitting at the top of
      build_smooth_table's heap loop) to the 630.7 s of search terms gives
      630.7 * 1.042 = 657.2 s, i.e. 1000 / 657.2 = 1.52x margin. In
      CPU-hours, 657 s single-threaded = 0.183 CPU-hours against the 0.33
      CPU-hour allowance (55.3%); the conversion is conservative in the
      correct direction because the run is single-threaded, so wall-seconds
      upper-bound CPU-seconds and contention pushes CPU-hours consumed
      BELOW 0.183. PF-17's repair costs +9.7 s of search over the round-2
      draft's 485.0 s, moving the margin from 1.55x to 1.52x, in exchange
      for a factor of nine on the naturally-completed delta_E >= 5 subset
      and for making the delta_E = 5 class observable at all. In practice
      the b = 1.45 s pass is expected to fall well below its 281.3 s worst
      case because many vertices should complete before their budget
      elapses -- but that expectation is precisely this amendment's object
      of study, so the budget is sized against the zero-natural-completions
      worst case and relies on the expectation for nothing. NOTE ON LOAD: a
      TRUNCATED vertex consumes ~b wall seconds regardless of contention
      (build_smooth_table gates on wall clock, so it simply completes less
      work), so the dominant 494.7 s term is close to load-invariant; the
      calibration, graph build, JSON I/O and overshoot terms do inflate
      under contention, which the 1.52x-1.58x margin absorbs. Applying the
      +4.2% truncation-overshoot factor to the CAL-1/CAL-2 terms, which are
      expected to complete naturally rather than truncate, is a further
      deliberate conservatism.
