      n_resolved             -- over ATTEMPTED; a collision was found.
      n_timed_out            -- over ATTEMPTED; to_s or to_t fired.
      n_naturally_completed  -- over RESOLVED; timed_out is False.
      n_still_truncated      -- over RESOLVED; timed_out is True.
      n_unresolved_and_timed_out     -- over UNRESOLVED; timed_out True.
      n_unresolved_and_not_timed_out -- over UNRESOLVED; timed_out False.
                                This is the genuinely interesting residual:
                                a COMPLETE (L, X=23, B=23)-class search that
                                found no collision at all. It has never been
                                observed in this lineage; if it is nonzero,
                                report every such vertex by coordinate.
