                        the >=5 histogram is {6: 1, 7: 1, 8: 2}; the other
                        41 carry delta_E in {2, 3, 4}
          b = 1.45 -> 115 total, 36 with delta_E >= 5, 20 with delta_E = 5;
                        the >=5 histogram is {5: 20, 6: 4, 7: 6, 8: 6}; the
                        other 79 carry delta_E in {2, 3, 4}, split
                        {2: 28, 3: 43, 4: 8}
          b = 1.70 -> 194 total, 80 with delta_E >= 5, 42 with delta_E = 5
        DENSITY IMMEDIATELY ABOVE 1.45, RECOMPUTED FOR PF-27: 18 records lie
        in [1.45, 1.46) and 71 in [1.45, 1.50) -- so the count reaches 133
        at 10 ms of slack above the budget and 186 at 50 ms. THE ARCHIVED
        DISTRIBUTION IS AT ITS DENSEST IMMEDIATELY ABOVE THE UPPER SWEEP
