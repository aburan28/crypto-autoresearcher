      in the same pass. So the equality half of the cross-check is an
      INSTRUMENT-INTEGRITY CONTROL whose only informative outcome is
      FAILURE, and a k/k match confirms nothing new even at k = 115.
      CHANGED: the round-2 draft's description of it as "the genuinely new
      thing this amendment can measure" is WITHDRAWN; the cross-check is
      reclassified in amendment_scope and in OBJECTIVE_BOUNDARY as a
      control; the strength_note clause is rewritten so that the empirical
      contribution to be sized is the measured n_naturally_completed(b)
      curve and the naturally-completed value histogram, not the equality
      result; and the BATCH-011 self-admission is extended to record that
      discharging that obligation on the cross-check itself in round 2 would
