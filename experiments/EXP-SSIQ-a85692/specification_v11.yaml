      entirely from RUN-SSIQ-a85692-h's committed archived per-vertex
      wall_seconds under inputs.delta_e_ge_5_inclusion_rule_v11, by this
      Coordinator's own recomputation. EVERY FIGURE IS AN UPPER BOUND, NOT
      A POINT PREDICTION, for the reason PF-12 establishes: a vertex whose
      archived TOTAL time is below b satisfies only the NECESSARY condition
      t_total <= b; the SUFFICIENT condition additionally requires
      t_source <= b/2, which no archived record can evidence. Machine
      contention (PF-14) can only push the measured counts further below
      these bounds.
        AT b = 1.10 s: predicted n_naturally_completed = 0 (EXACT, not
        merely an upper bound: 0 of 194 archived records fall below 1.1 s,
        and contention can only increase times, so this arm's prediction is
        monotone-safe under load). Predicted naturally-completed histogram
        = {}. Predicted naturally-completed count with delta_E >= 5 = 0.
        Predicted n_still_truncated = n_resolved (whatever n_resolved
        proves to be at this budget).
        AT b = 1.40 s: predicted n_naturally_completed <= 45. Predicted
        naturally-completed count with delta_E >= 5 <= 4, whose predicted
        value histogram is {6: 1, 7: 1, 8: 2}; the remaining <= 41 carry
        delta_E in {2, 3, 4}. Predicted mixed-regime split: ~45 naturally
        completed against ~149 truncated in the SAME pass.
      HOW THE CURVE IS TO BE READ AFTER THE RUN, PRE-COMMITTED HERE SO IT
      CANNOT BE CHOSEN AFTER SEEING THE RESULT:
        (P-1) A measured n_naturally_completed at or slightly below its
        upper bound at b = 1.40 s means the archived timing curve transfers
        to this machine and the mixed-regime cross-check is interpretable.
        (P-2) A measured n_naturally_completed FAR below the upper bound at
        b = 1.40 s -- and specifically a measured 0 -- is, in the first
        instance, an EXECUTION-ENVIRONMENT ARTIFACT under AGENTS.md rule 3,
        NOT a statement about delta_E convergence, and must be reported as
        such alongside the recorded load averages and the measured
        calibration floor. It is a fatigue report about the instrument, not
        a statement about the object.
        (P-3) A measured n_naturally_completed ABOVE the upper bound at
        b = 1.40 s would falsify one of this amendment's stated premises
        (either the archived timings, or the b/2 cap reading of
        two_sided_search) and must be surfaced loudly, never reconciled.
        (P-4) NO OUTCOME OF THIS RUN, at any budget, licenses the statement
        "delta_E >= 5 convergence does not begin at the floor". The run is
        not powered for it (predicted upper bound n = 4 at b = 1.40 s) and
        a null there is confounded with load by construction.
