    delta_e_ge_5_inclusion_rule_v11: >-
      THE EXACT INCLUSION RULE AND THRESHOLD CONVENTION FOR EVERY COUNT
      QUOTED IN THIS AMENDMENT ABOUT RUN-SSIQ-a85692-h, FROZEN SO THAT NO
      READER MUST INFER IT AND NO AMBIGUITY CAN PROPAGATE INTO A FROZEN
      PREDICTION. This block exists because COORD-VERIFY-PREFREEZE-v11.md
