      archived_delta_map, non_fp_rational_set) and
      delta_e_truncation_probe_v9.compare_against_v8(new_delta_map,
      v8_delta_map, non_fp_rational_set) for both required comparisons'
      matching/diffing logic; trapping_diagnostic_v5.build_graph_for_prime
      and trapping_diagnostic_v5.load_archived_prime_data;
      delta_e_independent_rng_probe_v8.verify_graph_identity (called once,
      at step (0)) and delta_e_independent_rng_probe_v8.derive_per_vertex_seed
      (for CAL-2's fresh RNG ONLY -- CAL-1 no longer calls it directly,
      since run_truncation_probe_v9 derives its own seeds internally);
      compute_delta_e.build_smooth_table, compute_delta_e.L_PRIMES,
      compute_delta_e.X_LIST_BOUND (for CAL-2 ONLY -- never in the sweep
      loop, where all searching remains inside the genuinely-imported
      run_truncation_probe_v9); delta_e_truncation_sweep_v10.
      value_histogram_and_conjugate_pairs(resolved_non_fp_set,
      new_delta_map, field) for the value-histogram/conjugate-pair
      reporting -- THE FIRST REUSE OF A v10-DEFINED FUNCTION IN THIS
      LINEAGE, extending the reuse-not-duplicate discipline PF-3/PF-9
      established for v9's functions to v10's own genuinely-reusable, pure
      functions. NOTE THAT AFTER PF-18 THIS AMENDMENT CONTAINS NO AUTHORIZED
      DUPLICATE OF ANY SEARCH OR CALIBRATION LOOP AT ALL; the only
      discretionary duplicate that remains permitted is the trivial
      JSON-safety helper pair noted in required_artifacts_note.
      PLUMBING NOTE, STATED HERE RATHER THAN LEFT FOR AN EXECUTOR TO
      DISCOVER (the same note PF-9 attached to the comparison functions in
      v10 round 2, raised again as an advisory in round 1):
      resolved_non_fp_set is NOT returned by run_truncation_probe_v9's
      output dict and must be reconstructed by the caller, from that sweep
      point's own per_vertex_records as
      {tuple(rec["vertex"]) for rec in per_vertex_records if
      rec["resolved"] is True}. THE SAME FUNCTION IS CALLED A SECOND TIME
      PER SWEEP POINT with the NATURALLY-COMPLETED subset
      {tuple(rec["vertex"]) for rec in per_vertex_records if
      rec["resolved"] is True and rec["timed_out"] is False} as its
      resolved_non_fp_set argument, per the BATCH-012 obligation in
      amendment_scope; the two calls' outputs are reported under distinct,
      unambiguous field names and are never merged.
      SWEEP_BUDGETS = [1.1, 1.45] is a FIXED, PRE-REGISTERED list (never
      computed or adjusted at runtime, and never derived from the
      calibration -- the calibration GATES the run, it does not TUNE it).
      For each b in SWEEP_BUDGETS, in order, within that sweep point's own
      try block, call
      delta_e_truncation_probe_v9.run_truncation_probe_v9(graph,
      BASE_SEED = 20260811, b) ON THE FULL, UNRESTRICTED GRAPH, producing
      that sweep point's own independent new_delta_map, coverage figures,
      and per_vertex_records (which already carry each vertex's own
      timed_out flag, unchanged in shape from every prior amendment -- the
      mixed-regime cross-check reads this existing field; it does not
      require or add any new instrumentation to run_truncation_probe_v9 or
      two_sided_search itself).
      REQUIRED MIXED-REGIME NATURAL-COMPLETION CROSS-CHECK (per sweep
      point, inside that sweep point's own try block -- see amendment_scope
      for the full specification, the disclosed prior evidence state,
      PF-25's reclassification of the equality half as an
      instrument-integrity control, the M-1/M-2 partition with the Q-LOAD
      run-level qualifier, and the PF-16 population definitions): partition
      this sweep point's own resolved non-F_p-rational vertices by their own
      timed_out flag; report all seven PF-16 counts with their populations
      named and the outcome of all three identities (I-1)/(I-2)/(I-3)
      explicitly; for the naturally-completed subset, compare each vertex's
      new_delta_map value against RUN-SSIQ-a85692-b's own archived_delta_map
      value and report n_naturally_completed_matching_archived and
      n_naturally_completed_NOT_matching_archived, with every mismatch
      reported in full, M-1/M-2 labelled and Q-LOAD stamped, never silently
      reconciled; report the delta_E value histogram restricted to the
      naturally-completed subset alone (dict, EMPTY {} if
      n_naturally_completed == 0, well-defined at zero; built from THIS
      RUN'S OWN delta_e_upper_bound values, never the archived ones)
      alongside the pre-registered predicted histogram for that budget and
      the P-1/P-2/P-3 reading that applies.
      JSON SAFETY (inherited unchanged from v8/v9/v10): every vertex-keyed
      artifact output uses the str(list(v))-keyed convention; a raw tuple
      is never written directly as a JSON dict key.
      OBJECTIVE_BOUNDARY: this remains a DESCRIPTIVE DIAGNOSTIC CONTROL,
      not a claim. It does not test H-SSIQ-36e970's real-arm prediction,
      does not gate any decision rule, and does not itself constitute
      evidence for or against a computable delta_E-gradient or a p^{1/4}
      algorithm. It does not produce a PERSISTS/WEAKENS label. Scoped to
      p=2437 ONLY; no claim about the other three primes or any scale
      beyond this toy instance. It does NOT answer RT-BATCH-011's original
      truncation-boundary question (does RNG-sharing matter under genuine
      incompleteness) -- per DEC-20260806-520ca4 D-3, any future amendment
