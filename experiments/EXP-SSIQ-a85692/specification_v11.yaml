    pf17_summary: >-
      BLOCKING, NEW (round 2), applied -- REPAIR (A) ADOPTED. FINDING: the
      round-2 draft asserted, in both amendment_scope and pf11_summary,
      that "ONLY [1.1, 1.4] PRESERVES A GUARANTEED-TRUNCATED ARM ... That
      constraint decides the choice; it is not a preference." Every factual
      clause in that passage is true; THE INFERENCE IS FALSE. The
