      is_structural_local_min, not re-derived, per the same disclosed-
      duplication exception v5's PF-1 and v6's PF-2 already established)
      that ALSO satisfy depth(v) == 0, computed on the REAL, unpermuted
      delta_map; (4) NULL_DEPTH0_FRACTIONS: a list of N_TRIALS = 1000
      values, one per trial, each computed identically to (3) but on a
      delta_map whose VALUES are a random permutation (via a single
      random.Random(20260806) instance, advanced sequentially across all
      1000 trials for that prime, never re-seeded mid-prime) of the SAME
      real multiset across the SAME vertex set -- i.e. shuffle(list(
      delta_map.values())) assigned back onto dict(zip(vertices,
      shuffled)), using Python's own random.Random.shuffle (Fisher-Yates,
      deterministic given the RNG state) for the permutation itself.
      REQUIRED SUMMARY STATISTICS, per prime: REAL_DEPTH0_FRACTION;
      NULL mean, median, min, max, standard deviation (self-contained,
      dependency-free computation -- this campaign has never imported a
      stats library and does not start doing so here) across the 1000
      trials; NULL_EXCEEDS_OR_EQUALS_REAL_COUNT: the number of the 1000
      null trials whose own depth0_fraction is >= REAL_DEPTH0_FRACTION
      (a one-sided permutation-test count -- report the count directly,
      NOT a computed "p-value" fraction, since a claimed p-value invites a
      significance-threshold interpretation this diagnostic's own
      OBJECTIVE_BOUNDARY below explicitly declines to make). EXPECTED
      RESULT (stated explicitly, not claimed as a foregone conclusion this
      run's own execution must still report honestly): REAL_DEPTH0_FRACTION
      = 1.0 on every prime (RUN-SSIQ-a85692-f's own already-archived
      result, which this run's identical inputs should reproduce exactly);
      NULL_EXCEEDS_OR_EQUALS_REAL_COUNT expected to be 0 or very small
      (consistent with the informal 15/30-trial runs, in which no null
      trial reached 100% on any prime), given the null means (35-57%)
      already observed informally are far below 100% -- but this run's own
      1000-trial result is what is reported and archived, not this
      expectation. If REAL_DEPTH0_FRACTION does NOT equal 1.0 on any
      prime, or if it materially disagrees with RUN-SSIQ-a85692-f's own
      already-archived ANOM-1 figures, this is a REQUIRED, EXPLICITLY
      DISCLOSED anomaly (a graph-rebuild or delta_map-loading discrepancy
      between this run and RUN-SSIQ-a85692-f, which read the identical
      inputs) -- report it honestly, per this task's own governing
      instruction, rather than silently reconciling or improvising past
      it.
      OBJECTIVE_BOUNDARY: this is a CONTROL, formalizing an already-run
      analysis for the durable record -- it does not itself constitute a
      new claim, does not test H-SSIQ-36e970's real-arm prediction, does
      not gate any decision rule, and does not resolve the funnel-
      structure mechanism question (DEC-20260806-498531's own next_actions
      item (2), explicitly deferred, not attempted here). Its purpose is
      narrowly to convert an informally-reproduced result into an
      immutable, independently re-runnable artifact, and to report the
      null distribution's own summary statistics precisely enough that a
      future amendment attempting the B/X-widening falsification test
      (DEC-20260806-498531 item (1)'s own stated hypothesis) has an
      archived baseline to compare against.
