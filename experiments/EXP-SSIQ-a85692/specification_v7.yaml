experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 7
  title: >-
    Formally archive the delta_E label-permutation null control (BATCH-010)
  status: draft
  approved_by: null
  amends: EXP-SSIQ-a85692 (version 6, specification_v6.yaml, frozen 66753c92fede639ab30e1b28dc1382b08a25167f)
  amendment_scope: >-
    A SINGLE PART, no PART A/PART B split (unlike v5/v6): this amendment
    formalizes ONE already-informally-run analysis into an immutable,
    reproducible run record. For each of the same four primes (2437, 3889,
    5737, 7333) with already-archived full delta_map coverage
    (RUN-SSIQ-a85692-b's raw-result.json, REUSED UNCHANGED, READ ONLY, same
    source every amendment since v5 has used): hold the rebuilt graph
    adjacency fixed (via trapping_diagnostic_v5.build_graph_for_prime,
    GENUINELY IMPORTED, same pinned seed 20260805), take the exact archived
    delta_E value multiset for that prime, and for N_TRIALS independent
    trials (PRE-REGISTERED BEFORE EXECUTION, per this campaign's own
    discipline against selecting a trial count after seeing results:
    N_TRIALS = 1000, a round, generously-sized number well above the 15-30
    trials either informal run used, chosen for statistical stability, not
    fitted to any observed outcome), randomly permute the multiset across
    the graph's vertex set (destroying spatial structure while exactly
    preserving the graph and the value distribution) and recompute
    is_structural_local_min(v) and depth(v) := min(delta_map[u] for u in
    adjacency[v]) - delta_map[v] for every resulting local minimum, using
    the SAME formulas specification_v6.yaml's funnel_structure_diagnostic_v6
    already established (REUSED, disclosed duplicate, per PF-2's own
    reuse-mechanism discipline -- see required_artifacts_note). Report the
    fraction of local minima with depth==0 for each trial, plus the
    REAL (unpermuted) data's own depth==0 fraction (EXPECTED, per
    RUN-SSIQ-a85692-f's own already-archived ANOM-1: 100% / 95/132/194/287
    out of 95/132/194/287, i.e. every structural local minimum, on every
    prime -- this amendment's own run is EXPECTED to reproduce this exactly
    since it reads the identical delta_map and rebuilds the identical
    graph, not a new prediction requiring this run to resolve).
    REQUIRED DETERMINISM: the permutation RNG uses a SINGLE, PRE-REGISTERED
    seed per prime (PERMUTATION_SEED = 20260806, one fixed seed reused
    across all N_TRIALS via a single random.Random(PERMUTATION_SEED)
    instance advanced sequentially -- NOT a fresh seed per trial and NOT
    the graph-construction seed 20260805, kept distinct to avoid any
    accidental correlation between graph structure and permutation draws),
    so a re-run is bit-identical (C-REPRO). This is PURE ARITHMETIC on
    already-archived data: no new graph construction beyond the same
    deterministic rebuild every amendment since v5 performs, no new
    delta_E search of any kind, zero new search cost.
