      self-sufficiently below, not attributed to an inherited model that
      does not in fact cover this check): confirm PER-PRIME (this
      amendment's own explicit choice, matching gd12_fix_v6/
      funnel_structure_diagnostic_v6's failure-handling model in
      specification_v6.yaml, NOT a property of the reused
      trapping_diagnostic_v5.py code, which is not called for this
      purpose in a way that would inherit its own global behavior), PF-1
      FIX APPLIED (round 1 pre-freeze review: the original draft narrowed
      this to a bare len(delta_map) == archived_n_vertices count, dropping
      v6's own TWO-PART check without disclosure): RESTORED, IDENTICAL TO
      v6's OWN TWO-PART CHECK FORMULA (independently re-verified,
      formula-by-formula, against trapping_diagnostic_v5.py's own
      coverage_assertion_pass/graph_rebuild_independently_verified_correct
      code by the round-2 reviewer) -- (a) coverage assertion: vertex_set
      = set(g["vertices"]); n_matched =
      len([v for v in delta_map if v in vertex_set]); confirm n_matched ==
      archived_n_vertices (2437: 203, 3889: 324, 5737: 478, 7333: 611,
      matching specification_v6.yaml's own already-verified figures) --
      NEVER a bare len(delta_map) count, since a same-count key mismatch
      would pass a bare count but fail this key-membership match; (b)
      graph-rebuild verification: degree_sequence_check(g).pass AND
      len(g["vertices"]) == archived_n_vertices (both IMPORTED UNCHANGED
      from build_isogeny_graph, matching v6's own procedure exactly). Halt
      with an explicit error, reported for that prime only, if EITHER (a)
      or (b) fails -- per v6's own PF-11 finding, neither check alone is
      sufficient, both are required; (3) compute REAL_DEPTH0_FRACTION:
      the fraction of vertices satisfying is_structural_local_min(v) (an
      authorized, disclosed duplicate of trapping_diagnostic_v5.py's own
      inline formula, delta_map[v] <= min(delta_map[u] for u in
      adjacency[v]) -- IDENTICAL to specification_v6.yaml's own
      is_structural_local_min, not re-derived, per the same disclosed-
      duplication exception v5's PF-1 and v6's PF-2 already established)
      that ALSO satisfy depth(v) == 0, computed on the REAL, unpermuted
      delta_map. PF-4 FIX APPLIED (round 1, advisory: the original draft
      described this as "the SAME formulas... already established"
      without disclosing that the DOMAIN differs): unlike v6's own depth(m),
      which was scoped ONLY to the basin-eligible set (delta_map[m] > 1,
      v6's own PF-1 fix), THIS amendment's depth(v) and
      is_structural_local_min(v) are evaluated over EVERY structural local
      minimum, WITHOUT the delta_map[v] > 1 restriction -- a deliberately
      BROADER domain than v6's basin-eligible set, including the delta_E=1
      (F_p-rational) local minima v6 excluded. This broadening is
      intentional (matching RUN-SSIQ-a85692-f's own execution_report.yaml
      ANOM-1 text, which independently re-checked this same broader
      population) and is stated here explicitly, not left for a reader to
      infer from "the same formula"; (4) NULL_DEPTH0_FRACTIONS: a list of
      N_TRIALS = 1000 values, one per trial, each computed identically to
      (3) but on a delta_map whose VALUES are a random permutation (via a
      SINGLE, FRESHLY-CONSTRUCTED random.Random(20260806) instance,
      constructed once per prime, advanced sequentially across all 1000
      trials for that prime via repeated .shuffle() calls on the SAME
      instance, never re-seeded or reconstructed mid-prime) of the SAME
      real multiset across the SAME vertex set -- PINNED EXPLICITLY (PF-7
      FIX APPLIED, round 1, advisory): "vertex set" means g["vertices"]
      specifically (confirmed a deterministic sorted(...) list, not a set
      or BFS-insertion order, by trapping_diagnostic_v5.build_graph_for_prime's
      own return value), i.e. shuffle(list(delta_map.values())) assigned
      back onto dict(zip(g["vertices"], shuffled)), using Python's own
      random.Random.shuffle (Fisher-Yates, deterministic given the RNG
      state) for the permutation itself.
      REQUIRED SUMMARY STATISTICS, per prime: REAL_DEPTH0_FRACTION;
      NULL mean, median, min, max, and standard deviation -- PF-3 FIX
      APPLIED (round 1, advisory: the original draft left population vs.
      sample ambiguous), PF-10 FIX APPLIED (round 2, advisory: round 1's
      own rationale, "the 1000 trials constitute the full population of
      interest," conflicted with this same paragraph's own Monte Carlo
      framing of N_TRIALS as a fixed sample size "chosen for statistical
      stability" and NULL_EXCEEDS_OR_EQUALS_REAL_COUNT as a permutation-
      test statistic): POPULATION standard deviation (divide the sum of
      squared deviations from the mean by N_TRIALS, NOT N_TRIALS - 1) is
      used here as a plain, simple DESCRIPTIVE statistic of this run's own
      1000 REALIZED trial outcomes -- the fixed, finite empirical
      distribution this run actually produced and archives, not an
      estimate of a hypothetical larger population of trials that were
      never run -- consistent with treating NULL_DEPTH0_FRACTIONS as data
      to report, not a sample to generalize from (the arithmetic
      difference from the sample formula is ~0.05% relative at N=1000,
      immaterial either way) -- self-contained, dependency-free
      computation, this campaign has never imported a stats library and
      does not start doing so here -- across the 1000 trials;
      NULL_EXCEEDS_OR_EQUALS_REAL_COUNT:
      the number of the 1000 null trials whose own depth0_fraction is >=
      REAL_DEPTH0_FRACTION (a one-sided permutation-test count). PF-5 FIX
      APPLIED (round 1, advisory: the original draft's rationale for
      withholding a p-value fraction did not achieve its own stated goal,
      since N_TRIALS=1000 is itself fixed and disclosed, making the
      division trivial for any reader): reported as a count for direct
      legibility, not to imply a formal significance test -- dividing by
      N_TRIALS recovers the equivalent one-sided permutation p-value, which
      should NOT be read against a conventional significance threshold
      without a stated, pre-registered alpha (none is stated or implied
      here). EXPECTED RESULT (stated explicitly, not claimed as a foregone
      conclusion this run's own execution must still report honestly):
      REAL_DEPTH0_FRACTION = 1.0 on every prime (RUN-SSIQ-a85692-f's own
      already-archived result, which this run's identical inputs should
      reproduce exactly); NULL_EXCEEDS_OR_EQUALS_REAL_COUNT expected to be
      0 or very small (consistent with the informal 15/30-trial runs, in
      which no null trial reached 100% on any prime), given the null means
      (35-57%) already observed informally are far below 100% -- but this
      run's own 1000-trial result is what is reported and archived, not
      this expectation. FAILURE-HANDLING SCOPE FOR THIS BRANCH, STATED
      EXPLICITLY (PF-2 FIX APPLIED, round 1 pre-freeze review: the
      original draft stated a disclosure obligation but no scope,
      leaving ambiguous whether a prime's 1000 null trials are still
      computed on this branch -- the same global-vs-per-prime ambiguity
      shape v6's own PF-3/PF-7 were blocking for): if REAL_DEPTH0_FRACTION
      does NOT equal 1.0 on some prime, or materially disagrees with
      RUN-SSIQ-a85692-f's own already-archived ANOM-1 figures for that
      prime, this DOES NOT HALT OR SKIP that prime's NULL_DEPTH0_FRACTIONS
      computation -- the 1000 null trials are computed and archived for
      that prime REGARDLESS of whether REAL_DEPTH0_FRACTION matches its
      expected value (this amendment's entire purpose is archiving the
      null distribution; an anomaly in the real-data comparison is not a
      reason to withhold the null distribution itself). Instead, this is a
      REQUIRED, EXPLICITLY DISCLOSED anomaly (a graph-rebuild or
      delta_map-loading discrepancy between this run and
      RUN-SSIQ-a85692-f, which read the identical inputs), reported
      ALONGSIDE that prime's full, complete summary statistics -- report it
      honestly, per this task's own governing instruction, rather than
      silently reconciling or improvising past it, and never as a reason
      to produce an incomplete result for that prime.
      OBJECTIVE_BOUNDARY: this is a CONTROL, formalizing an already-run
      analysis for the durable record -- it does not itself constitute a
      new claim, does not test H-SSIQ-36e970's real-arm prediction, does
      not gate any decision rule, and does not resolve the funnel-
      structure mechanism question (DEC-20260806-498531's own next_actions
      item (2), explicitly deferred, not attempted here). Its purpose is
      narrowly to convert an informally-reproduced result into an
      immutable, independently re-runnable artifact, and to report the
      null distribution's own summary statistics precisely enough that a
      future amendment attempting the B/X-widening falsification test
      (DEC-20260806-498531 item (1)'s own stated hypothesis) has an
      archived baseline to compare against. NAMED, DEFERRED CONTROL (PF-6,
      round 1 pre-freeze review, NOT required by this amendment): this
      control distinguishes "coarse alphabet + graph regularity" from
      "genuine graph-spatial structure," but by construction it CANNOT
      distinguish genuine near-Lipschitz smooth-isogeny-degree structure
      from an artifact of the delta_E-computation PROCEDURE itself
      (compute_delta_e.py's run_phase_minus1_on_confirmatory_set uses one
      shared, sequentially-advancing RNG instance per prime under a
      shrinking per-vertex time budget, in sorted-tuple rather than graph
      order). Recorded here as the next required control before any FUTURE
      amendment credits ANOM-1's spatial autocorrelation to genuine
      mathematical structure rather than a search-procedure confound: a
      probe re-run of the delta_E search with per-vertex-independent,
      freshly-seeded RNG, checking whether the graph-edge correlation
      persists. Explicitly out of THIS amendment's own zero-new-search-cost
      scope.
