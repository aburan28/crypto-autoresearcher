  inputs:
    delta_e_permutation_null_control_v7: >-
      For each of the 4 primes: (1) rebuild the graph via
      trapping_diagnostic_v5.build_graph_for_prime(p, 20260805) and load
      delta_map via trapping_diagnostic_v5.load_archived_prime_data
      (BOTH GENUINELY IMPORTED, confirmed standalone module-level
      functions per specification_v6.yaml's own PF-2 finding -- not
      reconfirmed here, inherited); (2) REQUIRED COVERAGE ASSERTION AND
      GRAPH-REBUILD VERIFICATION, PF-8 FIX APPLIED (round 2 pre-freeze
      review: the original round-1 fix cited "specification_v6.yaml's own
      PF-3/PF-7/PF-13 unified per-prime failure-handling model" as the
      source of "inherited unchanged," but direct re-check shows PF-3/
      PF-7/PF-13 addressed only crosscheck_pass and the basin-accounting
