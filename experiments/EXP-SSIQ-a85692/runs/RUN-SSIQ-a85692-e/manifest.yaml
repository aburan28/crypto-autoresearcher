  validity_reason: >-
    TWO INDEPENDENT PARTS (specification_v5.yaml, zero new search cost).
    PART A (gd11_fix_v5): ols_hardened.ols_loglog_fit_v2 and
    ols_hardened.bootstrap_gap_ci_v2 (NEW module, NOT edits to the frozen
    descent_hitting_time.py). Both REQUIRED regression tests pass:
    (i) gd11_standalone_regression_test confirms ols_loglog_fit_v2 raises
    ValueError on both RT-BATCH-007.md-named anomaly cases (N=324/repeat=3,
    N=611/repeat=6), and independently re-confirms both are genuinely
    "known-anomalous" -- the frozen, unchanged dht.ols_loglog_fit does NOT
    raise on either (spurious gamma -0.5 and 0.5 respectively, both
    materially wrong nonzero values, not merely gamma=0.0);
    (ii) bootstrap_gap_ci_v2_regression_test confirms bootstrap_gap_ci_v2
    (not only the standalone function) correctly discards every degenerate
    resample for N_list=[N]*n at both anomaly points (lo=hi=None,
    n_valid_draws=0), directly contrasted against the frozen, unchanged
    dht.bootstrap_gap_ci on IDENTICAL inputs, which accepts a spurious
    nonzero gap on every one of 2000 resamples in both cases (0.5 in both
    cases, per the concrete construction used).
    PART B (trapping_mechanism_diagnostic_v5): rebuilt the four primes'
    graphs (2437, 3889, 5737, 7333; build_isogeny_graph.build_graph_bfs,
    IMPORTED UNCHANGED, SEEDS[0]=20260805 pinned convention). All four
    rebuilds INDEPENDENTLY VERIFIED CORRECT: M-DEGSEQ passes on all four,
    rebuilt vertex counts exactly match archived n_vertices (203/324/478/
    611), and the coverage assertion's delta_map key-set match (via
    tuple(json.loads(key)) round-trip, PF-4) also passes exactly on all
    four (matched == archived n_vertices, NEVER n_resolved, per PF-9) --
    additionally, this run's OWN rebuilt per-vertex greedy-descent trapped
    fraction is BIT-IDENTICAL to RUN-SSIQ-a85692-b's archived
    descent_metrics.per_prime[p].greedy_trapped_fraction for all four
    primes, independently confirming the rebuild reproduces the ORIGINAL
    graph exactly, not merely a graph of the right size. Structural local
    minimum fractions computed for all four primes (2437: 0.4680, 3889:
    0.4074, 5737: 0.4059, 7333: 0.4697), each meaningfully SMALLER than the
    corresponding archived greedy_trapped_fraction (0.8374/0.7222/0.8201/
    0.8511) -- reported per PF-8 as a DIFFERENT statistic, never as
    corroborating the same quantity.
    PROTOCOL DEVIATION FROM THE FROZEN SPEC, DISCLOSED (see
    execution_report.yaml PD-SPEC-1): the REQUIRED exhaustive
    trapped-vs-structural cross-check (PF-6), executed exactly as
    specified, disagrees on a large fraction of vertices for every prime
    (93/203, 138/324, 234/478, 267/611). Independently re-verified by a
    hand-traced counter-example using ONLY the imported, unmodified
    functions (descent_hitting_time.greedy_descent_hitting_time,
    build_isogeny_graph adjacency) that this is NOT "conclusively a bug in
    this amendment's own code" as the frozen spec assumes: the walk's
    "trapped" flag reflects the WALK's eventual fate (a possibly
    multi-step, strictly-descending path), not whether the STARTING vertex
    itself is an immediate dead end, so comparing it against
    is_structural_local_min(START) (as the spec's operational text
    literally instructs) differs from is_structural_local_min(the walk's
    actual, unexposed TERMINAL vertex) -- which this run's own trace
    confirms DOES satisfy the spec's claimed equivalence exactly. This is
    reported as a specification_error requiring a Coordinator amendment,
    not silently reconciled, not treated as a coding bug, and not
    presented as a negative research finding (PART B is explicitly a
    diagnostic, not a hypothesis test, per its own objective_boundary).
    certificate.kind is none -- neither part claims a discrete-log solve
    or a factor-base relation. See execution_report.yaml for the full
    required_artifacts_note diff-list cross-check and the complete PD-SPEC-1
    trace.

