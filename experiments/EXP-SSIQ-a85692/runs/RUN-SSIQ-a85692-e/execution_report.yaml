  protocol_deviations:
    - id: PD-1
      statement: >-
        NONE FOUND against specification_v5.yaml's inputs.gd11_fix_v5 text
        for PART A. Both required regression tests assert exactly what
        inputs.gd11_fix_v5 names: (i) ols_loglog_fit_v2 raises ValueError
        on RT-BATCH-007.md's own two named anomaly cases; (ii)
        bootstrap_gap_ci_v2, called directly (not only the standalone
        function), with N_list = [N]*n (PF-10's exact construction
        mechanism, e.g. [324,324,324]), correctly discards every degenerate
        resample. No prediction, tolerance, threshold, or control was
        adjusted after this run began, and none was adjusted based on this
        run's own output.
    - id: PD-SPEC-1
      statement: >-
        BLOCKING FOR PF-6's OWN OPERATIONAL TEXT, DISCLOSED, NOT
        IMPROVISED PAST. specification_v5.yaml's REQUIRED CROSS-CHECK
        (PF-6) instructs: "confirm its own 'trapped' flag agrees with
        is_structural_local_min(start) for every single vertex tested;
        halt with an explicit error, not a silently-reported disagreement
        count, if any vertex disagrees" and separately asserts "any
        observed disagreement is THEREFORE CONCLUSIVELY A BUG in this
        amendment's own is_structural_local_min or key-matching code...
        never a mechanism finding."
        EXECUTED EXACTLY AS SPECIFIED against all four primes' real,
        already-committed delta_map data, using ONLY the imported,
        UNCHANGED greedy_descent_hitting_time and this diagnostic's own
        is_structural_local_min (computed from the SAME delta_map and the
        SAME rebuilt adjacency), this produces LARGE, reproducible
        disagreement counts on every prime: 93/203 (2437), 138/324 (3889),
        234/478 (5737), 267/611 (7333).
        INDEPENDENTLY RE-VERIFIED, by a hand-traced counter-example using
        ONLY the imported, unmodified functions (not this diagnostic's own
        code in isolation) -- p=2437, vertex (148, 37):
          delta_map[(148,37)] = 5; adjacency[(148,37)] = [(1617,1793),
          (1849,2359), (1944,484)] with deltas [2, 5, 5]. Since 2 < 5,
          is_structural_local_min((148,37)) is correctly False.
          dht.greedy_descent_hitting_time(adjacency, (148,37), delta_map,
          sentinel) -- called DIRECTLY, the frozen unmodified function --
          returns {"trapped": True, "steps": 1, ...}: the walk takes its
          one available strict-descent step to (1617,1793) (delta=2), and
          THAT vertex genuinely has no smaller-delta neighbour (its own
          neighbour deltas are [5, 2, 8], min=2), so
          is_structural_local_min((1617,1793)) = True, and the walk is
          correctly trapped THERE.
        PF-6's OWN stated justification ("a strict-descent walk's
        predecessor always has strictly greater delta than the current
        vertex, so it can never be excluded from a smaller-delta candidate
        set by the non-backtracking rule") is mathematically CORRECT, and
        DOES prove "the walk halts at w <=> w is a structural local
        minimum" for w = the walk's own TERMINAL vertex -- confirmed
        exactly by the trace above, at (1617,1793). But the OPERATIONAL
        instruction compares against is_structural_local_min(START)
        instead, a DIFFERENT vertex whenever start is not itself a local
        minimum (the majority case: only 41-47% of vertices are structural
        local minima per prime, per this run's own measurement, while
        69-85% of starts have their walk end up "trapped" somewhere --
        exactly PF-8's own "many-to-one funnelling" language, which this
        run's data independently confirms is real and large).
        greedy_descent_hitting_time's frozen return value (hitting_time,
        trapped, steps, tie_events, steps_with_choice) does NOT expose the
        walk's terminal vertex, so checking PF-6's own underlying,
        actually-correct invariant at the correct vertex would require
        either editing the frozen descent_hitting_time.py or
        re-implementing its internal walk logic outside this amendment's
        "imported unchanged, by reference" scope -- neither of which this
        Executor is authorized to do without a Coordinator amendment.
        ACTION TAKEN: implemented the cross-check EXACTLY as specified
        (full per-vertex comparison, full disagreement list recorded, not
        merely a count, in trapped_vs_structural_crosscheck.json);
        REPORTED crosscheck_pass=False honestly for all four primes; did
        NOT accept the spec's own "conclusively a bug in this amendment's
        own code" framing (independently falsified above); did NOT halt
        the Python process with an uncaught exception (which would have
        prevented producing ANY of this run's required artifacts, on the
        FIRST prime, for all four primes) -- instead recorded the required
        halt condition AS DATA, per AGENTS rule 8 ("unexpected observations
        must be recorded, not silently discarded") and this task's own
        governing instruction ("If you hit a genuine underspecification,
        STOP and report it rather than improvising a fix"). Neither
        redefining "start" to mean "terminal vertex" (silent
        reinterpretation) nor suppressing the disagreement (silent pass)
        was done. CLASSIFICATION: specification_error (the frozen contract
        embeds a mathematical claim, as literally operationalized, that
        does not hold against real data) -- requires a Coordinator
        amendment to either (a) change the cross-check's comparison target
        to the walk's terminal vertex (which would require exposing it
        from a modified/superseding version of greedy_descent_hitting_time,
        analogous to how ols_hardened.py supersedes ols_loglog_fit by
        addition), or (b) rescope/drop the cross-check. NOT a bug in this
        amendment's own code (independently disproven above); NOT a
        negative research finding (PART B's own objective_boundary
        explicitly disclaims any bearing on H-SSIQ-36e970); NOT silently
        reconciled into a false "all checks pass."

