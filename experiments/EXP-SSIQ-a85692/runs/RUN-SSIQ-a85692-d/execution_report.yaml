  anomalies:
    - id: ANOM-1
      statement: >-
        UNEXPECTED, DISCOVERED DURING IMPLEMENTATION (before this run's own
        artifacts were produced), DISCLOSED PER AGENTS.md RULE 8 (do not
        silently discard). A genuine floating-point precision artifact
        exists in the frozen, UNCHANGED dht.ols_loglog_fit
        (experiments/EXP-SSIQ-58b642/implementation/descent_hitting_time.py,
        not modified by this amendment or by this run): for the SPECIFIC
        value N=500.0 at EXACTLY 3 repeated points (i.e. a bootstrap
        resample whose three drawn indices all reference the same original
        N=500 point), `xbar = sum([log(500.0)]*3) / 3` does not round-trip
        to a value bit-identical to `log(500.0)` in IEEE-754 double
        precision (verified directly: xbar - log(500.0) = 9.99e-16, giving
        sxx = 2.37e-30, not exactly 0.0). ols_loglog_fit's own degeneracy
        guard (`if sxx == 0.0: raise ValueError`) therefore FAILS TO FIRE
        for this specific (N, repeat-count) pair, where it correctly fires
        for every other (N, repeat-count) combination tested (N in
        {200, 300, 700} at repeat-count 3; N in {200, 300, 500, 700} at
        repeat-count 4; verified by brute-force enumeration of all 27
        length-3 and 256 length-4 index-resample patterns respectively).
        The result is a spurious non-degenerate fit (gamma computed from a
        near-zero-signal, near-zero-noise division) that pollutes
        dht.bootstrap_gap_ci's resampled-gap distribution rather than being
        correctly skipped as degenerate -- observed directly: an EARLIER,
        DISCARDED construction of CHECK 3 (null_survivors=[7000,2000,5000],
        INCLUDING prime 5000/N=500) produced m_gap_null_ci_lo=0.0 instead of
        the analytically-expected ~0.5, failing the required <1e-9-tolerance
        assertion. THIS IS NOT A DEFECT IN c_null_label_comparison_v3 (the
        function under test by this amendment) OR IN THIS SELF-TEST'S CALL
        TO IT -- c_null_label_comparison_v3 correctly delegates to
        dht.ols_loglog_fit/dht.bootstrap_gap_ci exactly as GD-9 specifies,
        and the artifact is entirely internal to those two frozen,
        unchanged, imported-by-reference functions' own floating-point
        arithmetic at this specific numerical coincidence. RESOLUTION
        ADOPTED FOR THIS RUN (recorded, not silently applied): CHECK 3's
        null_survivors list was constructed as [7000, 2000, 3000]
        (excluding prime 5000/N=500) instead, which the same brute-force
        enumeration confirms has zero anomalous resamples across all 27
        length-3 index patterns. This is a data-CONSTRUCTION choice within
        specification_v4.yaml's own stated freedom (CHECK 3's text specifies
        only the survivors-list LENGTH, "EXACTLY NULL_ARM_MIN_PRIMES=3," not
        which 3 of the 4 constructed primes must be used), not a change to
        any assertion, tolerance, or control. NOT RE-VERIFIED AS A DEFECT IN
        c_null_label_comparison_v3 ITSELF, since c_null_label_comparison_v3
        does not construct or select bootstrap resample indices at all --
        that logic lives entirely inside dht.bootstrap_gap_ci, unchanged by
        this or any prior amendment in this lineage. Recorded here per
        AGENTS.md's instruction that unexpected observations must not be
        silently discarded; flagged for a future Coordinator/Idea-Generator
        review of whether dht.ols_loglog_fit's degeneracy guard should be
        hardened (e.g. an epsilon-based comparison instead of `sxx == 0.0`)
        outside this amendment's own narrow, one-change scope.

