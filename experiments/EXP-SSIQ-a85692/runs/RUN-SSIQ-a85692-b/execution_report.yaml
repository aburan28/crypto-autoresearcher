      - CHANGED: apply_truncation_fallback -- REWRITTEN in
        compute_delta_e_v2.py per scope_reduction_fallback_v2 (cumulative
        -ascending-prefix admission against a single T_reserved, replacing
        v1's individual per-prime T_prime=0.5*7200/12=300s cap). CONFIRMED.
      - CHANGED: run_phase_minus1_on_confirmatory_set -- REWRITTEN in
        compute_delta_e_v2.py per real_execution_budget_v2 (PF-1's fix): no
        longer accepts a per-prime t_prime cap; instead accepts and
        maintains a single aggregate remaining-budget counter, threaded
        across every prime it is called on (both the confirmatory prefix and
        each widening extension prime, one call per extension). CONFIRMED.
      - CHANGED (call site only, function body unmodified):
        run_feasibility_smoke_test -- v1's function is imported UNCHANGED
        (`run_feasibility_smoke_test = v1c.run_feasibility_smoke_test`,
