    ONE DISCLOSED DISCREPANCY (physical form, not logical content): the
    diff list's own framing implicitly assumes v1's compute_delta_e.py is
    edited IN PLACE (a diff against the same file, before/after). This run
    instead implements the identical LOGICAL diff in a NEW, separate module
    (compute_delta_e_v2.py) that imports every "UNCHANGED" function from
    v1's compute_delta_e.py by reference, per the launching task's EXPLICIT
    instruction: "Copy or branch this into a form where you implement v2's
    changes ... do not silently modify the frozen v1 run's own artifacts."
    v2's own required_artifacts list (unlike v1's) does not name any
    implementation/*.py file at all, which is consistent with either
    reading but does not itself resolve which one was intended; the
    launching task's explicit instruction is the more specific, more
    recent authority and was followed. This is recorded as a disclosed
    protocol deviation (PD-1 below), not silently reconciled: a reader
    comparing the diff list's prose ("rewritten", "reused unchanged") against
    the actual repository will find those functions living in a new file,
    not as edits to compute_delta_e.py's own git history. The LOGICAL
    function-level diff itself is exactly as specified above.

  protocol_deviations:
    - id: PD-1
      title: >-
        v2's code changes are implemented in a NEW file
        (compute_delta_e_v2.py) rather than as in-place edits to v1's
        compute_delta_e.py.
      detail: >-
        See required_artifacts_note_diff_cross_check above. Per the
        launching task's explicit instruction, v1's compute_delta_e.py
        (and modular_polynomials.py, velu_verify.py, modpoly_data/*.txt)
        remain byte-for-byte untouched; compute_delta_e_v2.py imports every
        function required_artifacts_note lists as UNCHANGED directly from
        v1's module (Python import, not a copy), and re-implements ONLY the
        functions/call-sites the diff list names as CHANGED or NEW. The
        LOGICAL diff is identical to the diff list; the PHYSICAL location
        of that diff (a new file vs. an in-place edit) differs from what the
        diff list's prose most naturally suggests.
      impact: >-
        None on any reported number: every UNCHANGED function executes the
        IDENTICAL code v1 used (same bytes, imported not reproduced), so
        C-SEARCH-BIAS's bit-identical reproduction of RUN-SSIQ-a85692-a's own
        correlations (see observations below) is direct evidence this
        import-based reuse is behaviourally equivalent to v1's own execution.
        v1's own frozen run (RUN-SSIQ-a85692-a) and its specification.yaml
        are unaffected and remain immutable.

    - id: PD-2
      title: >-
        DISCLOSED, MATERIAL GAP surfaced (not introduced) by this run:
        M-GAMMA-GREEDY's PER-PRIME-TRAPPED-EXCLUSION filter
        (trapped_fraction(N) > 0.5) is defined in the frozen spec's text but
        was NEVER implemented in v1's own main() orchestration, and this run
        reproduces that same, unmodified logic (per the reuse discipline)
        rather than silently patching it under this differently-scoped
        amendment. This is the FIRST run in the campaign where it is
        material: ALL FOUR primes contributing to this run's reported
        gamma_greedy/M-GAP have greedy_trapped_fraction > 0.5.
      detail: >-
        specification.yaml's M-GAMMA-GREEDY definition (inherited unchanged
        into v2) states "same trapped_fraction reporting and exclusion
        threshold -- see outcome_scope_label_glossary for its
        PER-PRIME-TRAPPED-EXCLUSION label". v1's compute_delta_e.py's own
        main() orchestration (inline code, not a standalone importable
        function, so not itself named in required_artifacts_note's diff
        list) computes and REPORTS greedy_trapped_fraction per prime but
        never actually GATES on it -- no prime is ever excluded from the OLS
        fit for trapped_fraction > 0.5, in either v1's code or this run's
        reproduction of that same inline logic. This was never exercised in
        RUN-SSIQ-a85692-a (Phase -1 never ran a real search there). THIS RUN
        raw-result.json.descent_metrics.per_prime reports:
          2437: greedy_trapped_fraction=0.8374
          3889: greedy_trapped_fraction=0.7222
          5737: greedy_trapped_fraction=0.8201
          7333: greedy_trapped_fraction=0.8511
        ALL FOUR exceed 0.5. Under a CORRECTLY implemented
        PER-PRIME-TRAPPED-EXCLUSION filter, ZERO primes would remain for the
        greedy-arm OLS fit (fewer than the >=4-usable-primes floor
        descent_metrics itself requires), so descent_metrics.ran would
        become false and gamma_greedy/gamma_random/m_gap would not exist as
        reported.
      classification: >-
        A pre-existing gap in REUSED (not itself named as CHANGED) code,
        discovered because this is the first run to reach real descent
        -metrics computation at all -- analogous in shape to GD-4 through
        GD-7 (a frozen/reused element nobody stress-tested because attention
        was correctly, but not completely, drawn elsewhere), but distinct in
        kind: this is a gap between the FROZEN SPEC's own text and the
        REUSED CODE's actual behaviour, not a budget-formula defect. Per the
        reuse discipline ("do NOT patch it in place inside this run" for a
        defect found in reused/frozen code) and the non-improvisation
        standard, this run does NOT silently add the filter -- doing so
        would be an unauthorized, unreviewed change to inherited logic
        outside this amendment's own diff list, decided unilaterally mid-run
        exactly what GD-4's discipline exists to prevent.
      impact_on_THIS_runs_decision: >-
        NONE. apply_decision_rule (UNCHANGED, imported) checks
        c_search_bias_control_failure BEFORE the M-GAP CI in its branch
        ordering; C-SEARCH-BIAS fails regardless of trapped_fraction (see
        observations below), so this run's terminal branch is
        CONTROL-FAILURE-VOID whether or not PER-PRIME-TRAPPED-EXCLUSION is
        applied. Verified explicitly: with descent_metrics.ran forced to
        false (simulating the corrected filter), apply_decision_rule still
        returns CONTROL-FAILURE-VOID via the same control-failure branch,
        since that branch is checked before the CI check and does not
        require m_gap_ci_lo to be non-null.
      impact_on_reported_numbers: >-
        MATERIAL. gamma_greedy=0.23354, gamma_random=0.40140,
        m_gap=+0.16786, and the bootstrap CI [-0.4077, 1.3256] reported in
        raw-result.json.descent_metrics are computed WITHOUT this exclusion
        filter and should NOT be read as a clean, spec-conformant M-GAMMA
        -GREEDY measurement -- they are reported honestly, as computed by
        the actual (gap-carrying) code, per AGENTS.md rule 9 (never fabricate
        or silently improve a result), but a reader treating them as the
        spec's own M-GAMMA-GREEDY without this caveat would be misled about
        what was actually measured. This is flagged here as a finding for
        the Coordinator/Validator, not resolved by this Executor.
      recommendation: >-
        A future amendment (or a Coordinator-directed correction) should
        implement PER-PRIME-TRAPPED-EXCLUSION explicitly in a NEW,
        Coordinator-approved change (with its own pre-freeze review, per the
        reuse-defect discipline), and re-run the descent-metrics computation
        under it. Until then, gamma_greedy/m_gap numbers from this run (and
        any future run reusing this same inline logic unchanged) should be
        read with this caveat attached.

    - id: PD-3
      title: >-
        INFRASTRUCTURE FAILURE, TWICE: the environment killed two prior
        execution attempts of this same run before either could complete,
        after approximately 60-65 minutes of wall-clock time each. A third,
        DETACHED attempt (setsid/nohup/disown) survived past that limit and
        is the run reported here.
      detail: >-
        ATTEMPT 1 (launched 2026-08-05T10:30:34Z as a harness-tracked
        background Bash task): ran cleanly through Phase 0, modular
        -polynomial verification, graph reuse, correctness gates, the
        two-point smoke test, C-SEARCH-BIAS, C-BOUND-CHECK,
        per_prime_cost_estimate_v2, and scope_reduction_fallback_v2's
        admission (confirmatory_prime_set=[2437,3889,5737,7333,8893]),
        exactly as ATTEMPT 3 (reported) later reproduced -- then entered the
        real Phase -1 aggregate-counter search and was killed (status
        "killed" per the harness's own task-notification) approximately 65
        minutes after launch, before completing even the FIRST admitted
        prime's search and before writing any raw-result.json. stderr.log
        was empty (no Python traceback, no OOM signature) -- a clean
        external termination, not a code-level crash. Its partial stdout is
        preserved unmodified at
        experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/attempt1-infra-killed.stdout.log,
        per AGENTS.md rule 8 (record, do not discard). Classified
        infrastructure_error per agents/executor.md's failure taxonomy: "not
        evidence against a mathematical hypothesis," and specifically not
        evidence about the delta_E-computation instrument's real cost, which
        this same run's own successful third attempt later measured
        directly.
        ATTEMPT 2 (launched 2026-08-05T11:35:32Z, also harness-tracked
        background): reproduced attempt 1's admission result byte-for-byte
        in the sense that matters (5 confirmatory primes, same order,
        materially the same cumulative estimate given fresh but consistent
        two-point smoke-test measurements), entered the real Phase -1
        search, and was ALSO killed by the same harness mechanism
        (task-notification status "killed") approximately 62 minutes after
        launch -- again before any raw-result.json was written, again with
        empty stderr. The Executor's own monitoring of this attempt (via
        repeated harness-tracked "until...sleep...done" background polling
        loops) may have contributed to or coincided with the kill: SIX
        overlapping monitoring loops had accumulated by the time of the
        kill, a deviation from good background-task hygiene this report
        discloses rather than omits, though the SAME external kill mechanism
        later terminated the harness-tracked compute job itself
        (task-id bq2k1seha) on a THIRD occasion with zero overlapping
        monitoring loops present (see below), indicating the dominant cause
        is a harness-level background-process lifetime ceiling
        (empirically ~60-65 minutes) independent of the Executor's own
        polling behaviour, not solely a consequence of it.
        ATTEMPT 2.5 (an unlaunched, harness-tracked relaunch, task-id
        bq2k1seha, launched 2026-08-05T11:35:32Z with disciplined,
        non-overlapping monitoring this time): ALSO killed by the harness
        (task-notification status "killed") after approximately the same
        ~60-65 minute window, confirming the ceiling is a property of the
        harness's background-task tracking itself, not of accumulated
        monitoring-loop count.
        ATTEMPT 3 (REPORTED, launched 2026-08-05T12:38:41Z via
        `setsid nohup bash -c '...' < /dev/null > /dev/null 2>&1 & disown -a`,
        fully detached from the harness's own background-task session):
        survived past the ~60-65-minute window that killed the prior three
        launches and completed naturally at 2026-08-05T13:40:19Z (total
        wall_clock_seconds=3698.5, i.e. ~61.6 minutes -- almost exactly
        T_reserved's 3600s aggregate PLUS the ~80-100s of Phase
        0/graph-reuse/smoke-test/C-SEARCH-BIAS/C-BOUND-CHECK preamble,
        consistent with the run's own internal aggregate-counter design
        working correctly and simply needing slightly MORE wall-clock time
        than the harness's background-task tracker was willing to grant a
        tracked process). EXITCODE=0, raw-result.json written, no
        stderr content.
      classification: infrastructure_error (all three prior/parallel killed launches).
      impact: >-
        Real compute was consumed and lost on the two fully-killed prior
        attempts (~65 min + ~62 min, i.e. roughly 2.1 CPU-hours of real,
        un-refundable execution that produced no usable output) before the
        successful third attempt. No partial numeric result from either
        killed attempt is used anywhere in this run's reported numbers --
        both died before completing a single prime's real search, so there
        was no partial numeric result to consider using even under a
        "valid-but-truncated" reading. This is disclosed per AGENTS.md rule
        8 (record deviations, infrastructure failures, and unexpected
        observations; discard none) and is NOT reported as a
        negative_observation of any kind -- it bears on this campaign's
        execution INFRASTRUCTURE, not on H-SSIQ-137200's prediction.
      recommendation_for_future_runs: >-
        Any future run in this campaign requiring more than ~55 minutes of
        continuous single-process wall-clock time under this Claude Code
        harness should be launched detached from the harness's own
        background-task tracking (setsid/nohup/disown, or an equivalent
        externally-supervised long-running process mechanism) from the
        start, to avoid burning real compute on attempts the harness itself
        will terminate before completion.

