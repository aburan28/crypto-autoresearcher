        SECOND call site at PRIMES[0] alongside the existing call at
        PRIMES[-1], per feasibility_smoke_test_v2. CONFIRMED, and PF-5's own
        correction (the function needs no change, only a call site) holds
        exactly as the pre-freeze review predicted.
      - CHANGED (call site + surrounding orchestration): main()'s call to
        run_phase_minus1_on_confirmatory_set -- updated to pass the
        aggregate counter (T_RESERVED=3600.0s) per real_execution_budget_v2,
        and main() is extended per coverage_widening_note with an iterative
        widening loop over extension primes after the confirmatory set's
