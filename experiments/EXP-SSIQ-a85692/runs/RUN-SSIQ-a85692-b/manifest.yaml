  validity_reason: >-
    Phase 0 (C-CAL-GAP) ran to completion and PASSED (overall_pass=true; see
    raw-result.json phase0_calibration). Modular-polynomial independent
    verification (PF-2, unchanged from v1) PASSED for ell=23 (required, all_ok
    =true, 3/3 test curves) via the Velu-formula route. All 12 pre-registered
    graphs were reused via Phi_2 BFS; C-CONNECTIVITY (floor(p/12) anchor),
    M-DEGSEQ, and C-EDGELIST all PASSED for every prime. The TWO-POINT
    feasibility smoke test (feasibility_smoke_test_v2) measured c_min=1.4221
    s/vertex at p=2437 and c_max=1.9500s/vertex at p=21601 -- MONOTONIC
    (c_max > c_min), so the non-monotonicity STOP condition
    (invalidation_rules_v2_additions) did NOT fire. per_prime_cost_estimate_v2
    (two-point linear interpolation) was computed for all 12 primes; applying
    scope_reduction_fallback_v2's CUMULATIVE-ascending-prefix admission
    against T_reserved=3600.0s admitted 5 primes ({2437, 3889, 5737, 7333,
    8893}, cumulative_estimated=3492.94s) -- this is GD-7's admission-side fix
    (RT-BATCH-004.md/DEC-20260805-a4e04e), now confirmed to actually admit
    >=4 primes using a FRESH, independently re-measured two-point cost model,
    not merely BATCH-004's own already-committed flat-single-point numbers.
    real_execution_budget_v2 (PF-1's fix, RT-PREFREEZE-EXP-SSIQ-a85692-v2.md)
    then ran the REAL delta_E search on all 5 admitted primes, ascending
    order, against a SINGLE aggregate real-time counter (no per-prime cap):
    primes 2437, 3889, 5737, and 7333 each reached FULL non-F_p-rational
    coverage (M-COVERAGE=1.0000) before the aggregate counter exhausted; the
    5th prime (8893) was stopped MID-SEARCH when the aggregate counter hit
    zero (aggregate_seconds_spent_confirmatory=3600.07s, essentially exactly
    T_reserved), resolving 554 of 718 non-F_p-rational vertices
    (M-COVERAGE=0.7716, still >=0.5 -- passes the per-prime coverage
    threshold, though NOT full coverage, so it is excluded from the
    downstream OLS fit and C-NULL-LABEL's full-multiset requirement, exactly
    as v1's inherited "delta_map length != vertex count -> skip" logic
    requires). n_primes_coverage_pass=5 (all 5 admitted primes clear
    M-COVERAGE>=0.5): the Phase -1 gate PASSES for the first time in this
    campaign under H-SSIQ-9e2c71/H-SSIQ-137200 -- this run is the first EVER
    to compute a REAL M-GAP on real, in-session-computed delta_E labels.
    coverage_widening_note's extension loop did not fire (REMAINING=0.00s
    after the confirmatory search consumed the entire T_reserved aggregate;
    n_extension_primes_attempted=0). C-SEARCH-BIAS (REQUIRED, unconditional)
    reproduced RUN-SSIQ-a85692-a's own measurement BIT-IDENTICALLY (true
    -target corr 0.09610901099736084, random-target corr
    0.030832644977609028 -- both figures match RUN-a to the digits shown,
    since the same seeds/graph/parameters were reused unchanged), and both
    magnitudes remain below the pre-registered 0.1 comparability threshold,
    so magnitudes_comparable_flag=true fires the SAME control-failure
    consequence RUN-a's orphaned diagnostic anticipated would apply "once a
    real M-GAP exists" (RT-BATCH-004.md numbered objection 4). C-NULL-LABEL
    ran (4 usable primes with full delta_E coverage: 2437, 3889, 5737, 7333;
    8893 excluded for partial coverage). Descent metrics RAN for the first
    time in this campaign (gamma_greedy=0.23354, gamma_random=0.40140,
    m_gap=+0.16786, bootstrap 95% CI [-0.4077, 1.3256], N range achieved
    [203, 611], n_primes_used=4). Per the frozen decision rule's ordering
    (Phase -1 gate checked first, then control failures, then the CI sign),
    the C-SEARCH-BIAS control failure is checked BEFORE the CI, so the
    terminal branch is CONTROL-FAILURE-VOID regardless of the CI including a
    wide positive range -- exactly the pre-registered mechanical consequence
    ("the real arm's M-GAP is CONTROL-FAILURE-VOID regardless of what
    C-NULL-LABEL shows, because the artifact is in the search algorithm, not
    in delta_E itself"). This is a fully executed, fully honest run: never
    DETECTED, never UNRESOLVED-BY-THIS-TEST, never DATA-UNAVAILABLE-BLOCKED
    -- CONTROL-FAILURE-VOID, per outcome_scope_label_glossary (inherited
    unchanged from v1). See execution_report.yaml for the full diff-list
    cross-check, protocol deviations, and infrastructure-failure disclosure
    (two prior attempts at this same run were killed by an environment
    -imposed background-process lifetime limit before completion; this is
    the third attempt, run detached via setsid/nohup/disown to survive past
    that limit, and is the ONLY attempt that produced a raw-result.json).

