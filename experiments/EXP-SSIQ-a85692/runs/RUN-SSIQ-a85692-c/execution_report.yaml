  protocol_deviations:
    - id: PD-1
      statement: >-
        NONE FOUND against specification_v3.yaml's own text. This run
        implements trapped_exclusion_filter_v3, c_null_label_comparison_v3,
        decision_rule_v3, not_evaluable_decision_rule_v3, and
