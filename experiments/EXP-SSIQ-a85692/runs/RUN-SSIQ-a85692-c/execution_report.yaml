        run's own output.
    - id: PD-2
      statement: >-
        MINOR, DISCLOSED, NON-SUBSTANTIVE: reanalyze_v3.py computes
        c_null_label_comparison_v3 (and writes its result to
        raw-result.json) UNCONDITIONALLY -- i.e. regardless of whether
        decision_rule_v3's own real-arm gate passes or fails -- rather than
        only inside the >=4-real-arm-survivors branch where decision_rule_v3's
        text formally introduces it. This is a DISCLOSURE/reporting choice,
        not a decision-rule change: decision_rule_v3's own NEW GATE (real-arm
        survivors < 4) still determines the terminal decision.branch
        entirely on its own (DATA-UNAVAILABLE-BLOCKED), and
        c_null_label_comparison_v3's result (NOT-EVALUABLE) is reported
        purely as an additional, honest disclosure of what the null-arm
        filter and comparison logic would say if evaluated -- consistent
        with evidentiary_limitation_disclosure_v3's own instruction to
        state this branch's reachability plainly rather than let a
        report block's mere presence imply something the run cannot
        support. No spec text was violated: specification_v3.yaml never
        says c_null_label_comparison_v3 may ONLY be computed inside the
        >=4-survivors branch, and computing it either way changes nothing
        about the reported decision on this run's actual data.
    - id: PD-3
      statement: >-
        The >=4-real-arm-survivors branch of decision_rule_v3 (recomputing
        gamma_greedy/gamma_random/m_gap on the surviving subset, then
        calling apply_decision_rule with the real c_null_label_control_failure
