        this run's actual data (real_survivors=0 < 4). This is expected and
        predicted by specification_v3.yaml's own worked check and
        independently confirmed by the pre-freeze review
        (RT-PREFREEZE-EXP-SSIQ-a85692-v3.md check (b)) before this run
        executed -- not a surprise discovered here. Disclosed per this
        campaign's standing discipline of naming every code path a run's
        own artifacts cannot supply runtime evidence for (see
        required_artifacts_note_diff_cross_check item (4) above).

