        effect: both numbers refer to the same principle, and this run's
        deferral IS treated as an infrastructure outcome, never as
        evidence against H-SSIQ-36e970, under either numbering.
      classification: specification_error (a numbering drift in the
        frozen text against a living document it cites, reported rather
