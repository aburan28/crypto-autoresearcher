        reading: G-0c is evaluated using ONLY the step (0b) host capture
        and RUN-h's already-committed environment.json, and it gates
        whether CAL-1/CAL-2 run at all.
      justification: >-
        (i) G-0c's own text introduces it with "FIRST, BEFORE ANY
        CALIBRATION IS INTERPRETED"; (ii) the frozen artifact-behaviour
        text for a defer explicitly allows "the full CAL-1/CAL-2 records
        to whatever extent they exist" -- language only meaningful if a
        G-0c defer can occur with zero calibration records; (iii) it is
        the economically sensible reading (no reason to spend up to 136s
        of calibration compute once the host is already known to differ);
        (iv) it matches the dispatching Coordinator's own handoff
        (TASK-20260808-d458a3), which lists G-0c ahead of "any of the 8
        CAL-1 calibration vertices timing out" in its own evaluation
        order. This is a disclosed interpretation of textual ambiguity,
        in the same "HONESTY RULE" style this lineage's own code already
        uses (e.g. v9's PD-3 domain disclosure), NOT a silent choice, and
        NOT an edit of the frozen spec text.
      consequence: >-
        cal1_records and cal2_records are empty lists in this run's
        artifacts (0 of the up to 8+8 records that would exist under the
        alternative reading). This does not change the run's outcome
        (G-0c fires regardless of whether calibration runs first, since
        the host mismatch is unconditional on calibration data) and does
        not omit any REQUIRED field -- the closed list still contains
        cal1_records/cal2_records, populated "to whatever extent they
        exist" (zero, this run), exactly as the frozen text's own phrase
        anticipates.
      classification: specification_error (an ambiguity in the frozen
        text, not resolved by an Executor edit -- reported rather than
        silently guessed at).
    - deviation: >-
        The frozen specification text cites "AGENTS.md rule 3" (repeatedly)
        for the "a timeout/crash/environment failure is not evidence
        against a mathematical hypothesis" principle. This repository's
        LIVE AGENTS.md currently numbers that identical principle as rule
        5 (rule 3 is currently "every experiment must define controls,
        metrics, budgets, stopping rules, and required artifacts before
        execution").
      consequence: >-
        A citation-numbering drift between the frozen spec text (which is
        NOT edited, per this task's own constraints) and the live
        AGENTS.md file. This run's own newly-authored text (the
        implementation module's docstring, this execution_report, the
        manifest) cites the CORRECT current number (rule 5) while quoting
