  anomalies:
    - id: A-1
      title: >-
        The literal truncation formula excludes even the SMALLEST
        pre-registered prime; an informal, NON-OFFICIAL development-time
        measurement suggests the true per-vertex cost at that prime may be
        low enough to fit T_prime, but this was NOT used to alter the
        mechanical decision.
      detail: >-
        During interactive development (BEFORE compute_delta_e.py's final
        structure was written; this measurement is NOT part of
        raw-result.json and was NOT re-run inside the official
        primary_execution command), the SAME table-building algorithm
        measured on 3 sample vertices at p=2437 gave an average cost of
        ~1.43s/vertex, versus the smoke test's OFFICIAL 1.9574s/vertex
        measured at p=21601. Extrapolated with the smaller number, p=2437's
        194 non-F_p-rational vertices would cost ~277s -- UNDER T_prime.
        The frozen contract's fallback rule explicitly specifies using
        "the smoke test's OWN measured per-entry cost" (singular, from the
        MANDATED largest-prime smoke test), not a separately re-measured
        smallest-prime cost, and explicitly forbids running Phase -1 on any
        prime before the truncation decision is finalised ("do not
        discover the overshoot partway through the prime set"). This run
        therefore applied ONLY the official, single, largest-prime
        measurement, exactly as specified, and did NOT substitute or
        additionally use the informal smallest-prime number to alter the
        confirmatory set. Recorded here per AGENTS.md rule 8 (unexpected
        observations are recorded, not silently discarded) because it
        surfaces a genuine, disclosed tension in the fallback's own design
        (a single global per-vertex-cost estimate is, by construction,
        conservative for every prime smaller than the one it was measured
        at) that the Coordinator may wish to weigh when deciding whether
        this lane merits a re-scoped amendment (e.g. a per-prime smoke
        test, or a smaller (B,X) pinned specifically for a reduced prime
        set) rather than remaining DATA-UNAVAILABLE-BLOCKED under the
        current pinned parameters.
      classification: >-
        Not a contract defect and not an executor deviation -- the frozen
        formula was followed exactly. Recorded as a disclosed design
        tension for possible future amendment consideration, per AGENTS.md
        rule 9 (do not silently abandon a lever without recording a
        concrete revisit condition).

    - id: A-2
      title: "git tree was dirty throughout (untracked new files only)"
      detail: >-
        experiments/EXP-SSIQ-a85692/implementation/ and .../runs/ were
        untracked at execution time (this run created both); no
        pre-existing file was modified. Recorded per AGENTS.md rule "record
        the exact git commit and dirty-tree state before every run."

    - id: A-3
      title: "PD-1, PD-2, PD-3 restated as anomalies (see protocol_deviations for full detail)"
      detail: >-
        Cross-referenced here per the execution report template's
        expectation that unexpected observations appear in BOTH sections;
        full text is in protocol_deviations above, not duplicated here.

