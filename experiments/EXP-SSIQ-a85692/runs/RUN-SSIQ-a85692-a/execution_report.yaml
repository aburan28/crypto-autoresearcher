  executor_assessment:
    protocol_complete: true
    protocol_complete_note: >-
      spec.success_criterion is fully met: the feasibility smoke test was
      executed and reported; Phase 0 and Phase -1 gates were both evaluated
      (Phase 0 PASSED, Phase -1 FAILED, mechanically, per the pre-registered
      truncation formula); M-COVERAGE (for the smoke-test sample),
      M-BOUND-TIGHTNESS (free-identity only, PD-3), and
      M-SEARCH-BIAS-RANDOM-TARGET were reported; every control returned a
      recorded verdict (C-CAL-GAP pass, Phi_23 verification pass,
      C-CONNECTIVITY/M-DEGSEQ/C-EDGELIST pass, C-SEARCH-BIAS measured);
      the decision rule was applied mechanically and returned exactly one
      of the four labels: DATA-UNAVAILABLE-BLOCKED. Per
      spec.success_criterion's own text, "A DATA-UNAVAILABLE/BLOCKED
      outcome with an honest, disclosed obstruction is a fully successful
      run in the sense EXP-SSIQ-58b642's VOID outcome was: it retires or
      narrows the lane with a measured reason."
    data_quality: good
    data_quality_note: >-
      Every reported number (Phase 0, Phi_23 verification, correctness
      gates, the smoke test's 3 vertices, the truncation arithmetic,
      C-SEARCH-BIAS's 40 searches) is an exact, reproducible, independently
      re-derivable measurement from this run's own committed code and
      seeds, not an estimate presented as a measurement. The CONFIRMATORY
      metric (M-GAP on real labels) does not exist for this run -- that is
      the run's finding, not a data-quality defect in what WAS measured.
    requires_rerun: false
    requires_rerun_note: >-
      Not a rerun of THIS experiment under the same protocol (re-running
      would reproduce the identical measured cost and the identical
      truncation-to-empty-set result, since it is a compute-cost fact of
      the pinned (B=23, X=23) instrument at these graph sizes, not a random
      or environmental failure -- C-REPRO-style bit-for-bit determinism was
      not separately re-verified in this run beyond the deterministic
      seeding already used throughout, since the confirmatory descent
      pipeline never ran to have a C-REPRO check applied to it). Requires a
      Coordinator-approved protocol amendment (a different (B,X) pinning, a
      narrower prime set chosen up front with its own pre-freeze review, or
      a per-prime smoke-test design) before this instrument can produce
      confirmatory descent data at these graph sizes -- see anomaly A-1 for
      the specific, disclosed tension a future amendment might address.
