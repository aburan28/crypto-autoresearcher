    not run, because it requires a full per-vertex delta_E multiset for at
    least 4 primes, which the Phase -1 gate confirms does not exist.
    TOTAL measured wall clock: 90.57s of the 7200s budget (1.26%). The
    dominant cost by far was C-SEARCH-BIAS's 40 individual two-sided
    searches (20 vertices x 2 arms), each independently timed and reported
    in raw-result.json c_search_bias.

  protocol_deviations:
    - id: PD-1
      title: >-
        C-CONNECTIVITY uses ONLY the floor(p/12) formula anchor, not a
        WISDE cross-check, unlike EXP-SSIQ-58b642's inherited dual-anchor
        version.
      detail: >-
        spec.controls.C-CONNECTIVITY says "REUSED UNCHANGED from
        EXP-SSIQ-58b642 (floor(p/12) anchor at p = 1 mod 12)." Read
        literally as "reuse the exact CHECK FUNCTION," EXP-SSIQ-58b642's
        run_correctness_gates() takes a wisde_records argument and compares
        the BFS vertex count against BOTH the WISDE-reconstructed curve
        count AND the floor(p/12)+e formula. This experiment's entire
        reason for existing, per H-SSIQ-9e2c71's "WHAT IS NEW" text, is
        that its real arm "needs no external dataset... at all" -- fetching
        WISDE again here would reintroduce exactly the dependency this
        contract exists to remove, for a check whose formula-only half
        BATCH-003 itself already reported as an EXACT match in every case
        (raw-result.json wisde_records_summary, normalisation_ok: true for
        all 12 primes). This run therefore implements C-CONNECTIVITY using
        ONLY the self-contained floor(p/12) formula anchor (exact,
        epsilon=0, at p = 1 mod 12 per CGL / De Feo Theorem 47), which is
        the information-preserving half of the inherited check for this
        residue class, not a weaker replacement of it.
      impact: >-
        None on the run's own decision: C-CONNECTIVITY passed for all 12
        primes under the formula-only anchor (raw-result.json
        correctness_gates.connectivity). Recorded because "REUSED UNCHANGED"
        is not literally true of the CHECK'S INPUT SET, only of its
        mathematical content for this prime residue class -- per AGENTS.md
        rule 8, disclosed rather than silently narrowed.

    - id: PD-2
      title: >-
        The delta_E-computation table-builder implements a Dijkstra-style
        shortest-degree-first completion of Algorithm 1's evident intent,
        not a literal transcription of its pseudocode, and does not
        explicitly track cyclic-kernel-ness of composed isogeny paths.
      detail: >-
        Algorithm 1 (paper_fulltext.md lines 137-152), read literally,
        starts with L = empty set (step 1) and only ever extends existing
        entries of L (step 4: "for psi in L such that ell*deg(psi) <= X"),
        so as literally written nothing is ever added at any (ell, i=1)
        iteration -- an evident gap in the published pseudocode (most
        plausibly an implicit seed entry for the trivial degree-1 isogeny
        E->E is intended but not stated). compute_delta_e.py's
        build_smooth_table implements the natural completion: start the
        table at {E: degree 1}, then repeatedly finalise the
        smallest-degree unfinalised entry and expand it by every prime in
        L up to the degree bound X (a Dijkstra-style expansion, correct by
        the standard shortest-path invariant since every step multiplies
        degree by a prime >= 2, hence is monotonic). This subsumes
        Algorithm 1's own non-backtracking exclusion (never re-expand an
        already-finalised, i.e. already-minimal-degree, codomain) as a
        SPECIAL CASE without needing explicit parent-tracking, but it does
        NOT verify that a composed multi-step isogeny path has a CYCLIC
        kernel (Algorithm 1's own dedup criterion, step 6: "ker(eta) not
        subset ker(psi-hat)"). This is disclosed as a simplification of
        Algorithm 1's bookkeeping OPTIMISATION, not of its correctness
        property: composition of isogenies always multiplies degree
        regardless of kernel structure, so every reported delta_E upper
        bound remains a genuine, valid upper bound (an actual isogeny
        E -> E^{(p)} of the reported degree provably exists whenever a
        collision is found), which is everything the labelling instrument
        needs (H-SSIQ-9e2c71's assumptions block). See compute_delta_e.py's
        module docstring for the full disclosure.
      impact: >-
        None on validity of reported upper bounds (see above). A possible,
        undisclosed-magnitude effect on table SIZE/composition (a
        non-cyclic composed path could occupy a table slot that a
        cyclic-kernel-only implementation would have pruned), which could
        make the measured per-vertex cost in this run's smoke test a mild
        OVERESTIMATE of a strictly-Algorithm-1-conformant implementation's
        cost -- if anything, conservative in the direction of the
        feasibility conclusion (DATA-UNAVAILABLE-BLOCKED), not against it.

    - id: PD-3
      title: >-
        C-BOUND-CHECK's "second independently-implemented search route for
        a small sample" was NOT attempted; only the free delta_E=1 identity
        cross-check ran.
      detail: >-
        spec.controls.C-BOUND-CHECK states this second route runs "budget
        permitting" and explicitly "does not gate the run." Given the
        budget was allocated to the MANDATORY items (Phase 0, the
        feasibility smoke test, the truncation-fallback arithmetic, and
        C-SEARCH-BIAS's required >=20-vertex sample) and the Phase -1 gate
        result (DATA-UNAVAILABLE-BLOCKED, meaning no full-prime delta_E
        multiset exists to cross-check against in the first place beyond
        the smoke test's own 3 vertices), a second independent search
        route was not additionally implemented and run in this pass.
      impact: >-
        M-BOUND-TIGHTNESS is reported using ONLY the free delta_E=1
        identity (raw-result.json c_bound_check), a non-gating diagnostic
        per its own definition. Disclosed per AGENTS.md rule 8 rather than
        silently omitted.

