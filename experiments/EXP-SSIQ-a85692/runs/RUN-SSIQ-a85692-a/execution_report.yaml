      comparison_to_pre_freeze_first_principles_estimate: >-
        The pre-freeze review's own estimate (specification.yaml,
        Lemma 3.2's cardinality bound applied to X=B=23) projected roughly
        2716 table entries per side and a 21.5x budget overshoot at an
        OPTIMISTIC 2.5ms/entry floor. This run's MEASURED table sizes
        (~342-365 entries per side) were smaller than that upper bound (as
        expected -- Lemma 3.2 is an upper bound, not an exact count), but
        the MEASURED per-entry cost was far above the 2.5ms optimistic
        floor (measured per-vertex cost 1.9574s / ~318 average phi_calls
