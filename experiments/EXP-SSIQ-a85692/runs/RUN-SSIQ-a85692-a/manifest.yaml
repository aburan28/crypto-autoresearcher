  validity_reason: >-
    Phase 0 (C-CAL-GAP) ran to completion and PASSED on all three
    pre-registered synthetic pairs (recovered M-GAP within +-0.10 of the
    true gap 0.25 in every case; see raw-result.json phase0_calibration).
    The PF-2-required independent verification of the largest sourced
    modular polynomial (Phi_23, via the from-scratch Vélu-formula route,
    velu_verify.py) PASSED on all 3 test curves; the additional,
    not-required Phi_3 sanity check also passed. All 12 pre-registered
    graphs were built independently via Phi_2 BFS (build_isogeny_graph.py,
    unchanged); C-CONNECTIVITY (floor(p/12) formula anchor), M-DEGSEQ, and
    C-EDGELIST all PASSED for every prime. The MANDATORY feasibility smoke
    test was executed at the largest pre-registered prime (p=21601, per
    PF-1) on 3 non-F_p-rational vertices, all 3 resolved with a measured
    average cost of 1.9574s/vertex (both tables, at least one Phi_ell
    evaluation for ell>2 in every case). Applying the PRE-REGISTERED
    truncation fallback (T_prime=300s, using ONLY this single measured
    per-vertex cost, extrapolated ascending by prime size, exactly as
    scope_reduction_fallback_pinned_before_data specifies) found that even
    the SMALLEST pre-registered prime's estimated full-coverage cost
    (194 non-F_p-rational vertices x 1.9574s ~= 379.7s) exceeds T_prime, so
    the ascending-prefix confirmatory prime set is EMPTY (0 primes). Per
    the frozen decision rule's Phase -1 gate (M-COVERAGE >= 0.5 required on
    at least 4 primes), this yields the DATA-UNAVAILABLE-BLOCKED branch --
    the run's mechanically-applied terminal outcome. Per the explicit
    instruction "TRUNCATE the confirmatory prime set... BEFORE running
    Phase -1 on any prime beyond the smoke test itself," no further
    full-prime delta_E search was attempted once the confirmatory set was
    determined empty. The REQUIRED C-SEARCH-BIAS control (PF-3) was still
    run, at the smallest prime, on 20 sampled non-F_p-rational vertices
    (both a true-target and a random-target arm), since it is mandated
    independently of the truncated confirmatory set; its raw correlations
    (true-target 0.0961, random-target 0.0308, both consistent with no
    strong correlation, both n=20) are reported but do not alter the
    terminal branch, since the Phase -1 gate result is checked first in the
    decision hierarchy, per spec.preregistered_prediction.
    decision_rule_frozen_before_data's own ordering. C-NULL-LABEL and the
    descent metrics (M-GAMMA-GREEDY/RANDOM/M-GAP) were NOT run: they
    require a FULL per-vertex delta_E multiset for at least 4 primes, which
    the Phase -1 gate confirms does not exist. This is a valid, fully
    executed, fully honest run whose terminal finding is the discovered
    infeasibility of the pinned (B=23, X=23) instrument at the mandated
    per-vertex cost, exactly as EXP-SSIQ-a85692's own pre-freeze review
    (PF-1) anticipated might occur. Never DETECTED, never
    UNRESOLVED-BY-THIS-TEST, never CONTROL-FAILURE-VOID, never "falsified"
    or "refuted."

