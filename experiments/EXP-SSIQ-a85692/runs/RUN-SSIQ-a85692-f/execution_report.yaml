  anomalies:
    - id: ANOM-1
      statement: >-
        GENUINE, UNEXPECTED, DISCLOSED FINDING (not a specification defect
        of gd12_fix_v6/funnel_structure_diagnostic_v6's own text, and not a
        bug in this run's own code -- independently re-derived TWICE, by
        direct query against raw delta_map/adjacency data, using code
        entirely OUTSIDE this run's own funnel_structure_diagnostic_v6.py/
        descent_walk_hardened.py implementation, before concluding the
        result was real rather than a coding defect). depth(m) := min(
        delta_map[u] for u in adjacency[m]) - delta_map[m] is EQUAL TO 0
        for EVERY SINGLE basin-eligible local minimum, on EVERY ONE of the
        four primes, with ZERO exceptions (86/86 at p=2437, 114/114 at
        p=3889, 176/176 at p=5737, 270/270 at p=7333 -- 646 basin-eligible
        local minima total, all depth==0). The SAME degeneracy holds even
        more broadly: independently re-checked against ALL structural local
        minima (including the delta_E=1 ones excluded from the
        basin-eligible set), all 95/324/478/611-scale local-minimum
        populations for these primes also show depth==0 universally
        (confirmed by a from-scratch, standalone script reading only
        trapping_diagnostic_v5.load_archived_prime_data and
        trapping_diagnostic_v5.build_graph_for_prime directly, bypassing
        this run's own is_structural_local_min duplicate entirely) -- e.g.
        every one of the 9/18/18/17 F_p-rational (delta_E=1) vertices per
        prime has AT LEAST ONE neighbour that is ALSO delta_E=1 (confirmed
        by direct enumeration for all four primes, zero exceptions). PF-5's
        own text anticipated "depth==0 is a legitimate, expected,
        reportable value ... not an error condition" for SOME local minima
        with a tied neighbour, but its own supporting prose ("depth==0 is a
        legitimate, expected, reportable value for a local minimum with a
        tied neighbour at the same delta") reads naturally as describing an
        occasional case among a population with genuine depth variation,
        not a UNIVERSAL one -- the frozen spec's own REQUIRED CORRELATION
        (depth vs basin_size, depth vs log(basin_size)) presupposes a
        depth distribution with nonzero variance to correlate against
        anything. CONSEQUENCE: the REQUIRED CORRELATION is computed exactly
        as specified (self-contained Pearson, per the frozen spec's own
        instruction) but is mathematically UNDEFINED (division by zero
        variance) on all four primes, for both the raw and
        log-transformed variant -- reported honestly as null with an
        explicit "zero variance" note (see OBS-B3), never fabricated as
        0.0 or silently omitted. CLASSIFICATION: this is recorded as a
        genuine, disclosed, unexpected empirical observation (per AGENTS
        rule 8 and this task's own governing instruction), NOT a
        specification_error (the frozen spec's formulas and procedures are
        all well-defined and correctly implementable; only the ACTUAL DATA
        produces a degenerate input to one of them) and NOT an
