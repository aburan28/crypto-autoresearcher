  validity_reason: >-
    TWO DEPENDENT PARTS (specification_v6.yaml, zero new search cost).
    PART A (gd12_fix_v6): descent_walk_hardened.greedy_descent_hitting_time_v2
    (a NEW module superseding, never editing, the frozen
    descent_hitting_time.greedy_descent_hitting_time; adds "terminal_vertex"
    to every returned dict). The REQUIRED EQUIVALENCE REGRESSION passed on
    all 3 constructed inputs, collectively covering all three return
    branches (immediate delta_E==1, trapped=True using the archived p=2437
    graph and the exact (148,37) start from trapping_diagnostic_v5.py's own
    hand-traced counter-example, and trapped=False-via-steps): every
    non-terminal-vertex field (hitting_time/trapped/steps/tie_events/
    steps_with_choice) is bit-identical between greedy_descent_hitting_time_v2
    and the frozen, unmodified greedy_descent_hitting_time on every input,
    and terminal_vertex is correct on every branch, including the exact
    (1617, 1793) value the frozen spec itself predicts for the (148,37)
    case. The CORRECTED cross-check (comparing is_structural_local_min
    against each trapped=True walk's own terminal_vertex, never against
    is_structural_local_min(START) as v5's defective version did) PASSED on
    all four primes with ZERO disagreements (2437: 0/170, 3889: 0/234,
    5737: 0/392, 7333: 0/520) -- independently confirming
    corrected_equivalence_proof against real archived data, in contrast to
    v5's RUN-SSIQ-a85692-e, which failed the UNCORRECTED cross-check on
    every prime. The REQUIRED ACCOUNTING ASSERTION (n_trapped_true +
    n_trapped_false == n_vertices) passed for all four primes.
    PART B (funnel_structure_diagnostic_v6), DEPENDENT ON PART A: ran for
    all four primes (PART A's crosscheck_pass precondition was True for
    every prime, so PART B was never skipped or blocked). basin-eligible
    local minima counts (86/114/176/270) and the REQUIRED ACCOUNTING
    ASSERTION values (n_trapped_false=33/90/86/91, sum(basin)=170/234/392/
    520, all exactly matching n_vertices=203/324/478/611) EXACTLY MATCH the
    frozen spec's own stated EXPECTED values in every one of these 12
    numbers, across all four primes. Basin sizes are modest (max 4/4/8/7;
    top-decile concentration 0.171/0.167/0.181/0.188 -- only mildly above
    the 10% proportional baseline, no dramatic funnel/hub structure at this
    scale). GENUINE, DISCLOSED ANOMALY (not a specification defect, not a
    coding bug -- independently re-derived twice by direct query against
    raw delta_map/adjacency, outside this run's own new code): depth(m) ==
    0 for EVERY basin-eligible local minimum on EVERY one of the four
    primes (646 local minima total, zero exceptions), making the REQUIRED
    CORRELATION (Pearson, depth vs basin_size and depth vs log(basin_size))
    mathematically undefined (zero variance in depth) on all four primes.
    Reported honestly as "value: null, zero variance" per prime, per this
    campaign's own discipline against fabricating a value where none is
    defined -- see execution_report.yaml ANOM-1 for the full trace.
    certificate.kind is none -- neither part claims a discrete-log solve or
    a factor-base relation. See execution_report.yaml for the full
    required_artifacts_note diff-list cross-check.

