# FROZEN CONTRACT. Went to a Red Team pre-freeze review before any data was
# touched, per GD-4's standing practice
# (coordination/goals/GOAL-SSIQ-001/batches/BATCH-004/reviews/RT-PREFREEZE-EXP-SSIQ-a85692.md,
# verdict FREEZE-WITH-FIXES), which honoured GD-6's standing repair (full
# re-read of every BATCH-003 artifact, not just its headline metric) and found
# four BLOCKING findings, all applied below: (1) no feasibility estimate
# existed for the new delta_E-search instrument, and a first-principles
# calculation from already-committed BATCH-003 numbers suggested a ~21.5x
# budget overshoot at any useful smoothness bound -- fixed with a pinned
# B=23/X=23, a mandatory largest-prime feasibility smoke test, and a
# pre-registered prime-truncation fallback; (2) Phi_ell for ell>2 had no cited
# source -- fixed with a named source and an independent-verification
# requirement; (3) C-NULL-LABEL cannot detect a search-construction-order
# artifact this instrument itself introduces -- fixed with a new required
# control, C-SEARCH-BIAS; (4) the new M-COVERAGE per-prime exclusion clause
# reused the bare word "VOID" the contract's own run-level taxonomy fix exists
# to retire -- fixed with an explicit four-label glossary. Every prediction,
# tolerance, window, estimator and failure consequence below was fixed before
# any real search was run.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-9e2c71
  version: 1
  title: >-
    Greedy delta_E descent versus random-walk hitting time, with delta_E
    supplied by direct in-session smooth-degree isogeny search (BATCH-004,
    unblocking H-SSIQ-18dc91's real arm)
  status: approved
  approved_by: coordinator
  pre_freeze_review:
    report: coordination/goals/GOAL-SSIQ-001/batches/BATCH-004/reviews/RT-PREFREEZE-EXP-SSIQ-a85692.md
    verdict: FREEZE-WITH-FIXES
    findings_applied: [PF-1, PF-2, PF-3, PF-4]
    findings_advisory_noted: [PF-5, PF-6, PF-7, PF-8]
    gd6_reread_confirmed: >-
      The reviewer confirmed re-reading, in full, EXP-SSIQ-58b642's frozen
      contract, its execution_report.yaml and raw-result.json (both halves),
      RT-BATCH-003.md, VAL-BATCH-003.md, EV-SSIQ-9a0396.yaml,
      DEC-20260805-cd8bcd.yaml, the goal record's GD-6 entry, and
      paper_fulltext.md's Algorithm 1-3 / Section 4.1 directly -- and named
      exactly which raw-artifact numbers (per-prime vertex counts summing to
      11,462; measured Phi_2 timing) the feasibility arithmetic was built
      from, none of which appear in any summary document.
  supersedes_experiment: EXP-SSIQ-58b642
  supersedes_note: >-
    EXP-SSIQ-58b642 is retained unedited (frozen, VOID outcome). This contract
    REUSES its committed graph-construction code and its committed C-CAL-GAP
    calibration code BY REFERENCE (import, not reimplementation) rather than
    respecifying either, and changes exactly one thing: the source of the
    delta_E label for each vertex, from a blocked WISDE cross-reference to a
    direct in-session computation.
  gd6_standing_repair_applied:
    reread_requirement: >-
      The pre-freeze reviewer of THIS contract must re-read, in full, not
      sampled: EXP-SSIQ-58b642/specification.yaml (frozen), its
      RUN-SSIQ-58b642-a/execution_report.yaml and raw-result.json in full
      (not just decision.reason), RT-BATCH-003.md, VAL-BATCH-003.md, and
      ledger/goals/GOAL-SSIQ-001/goal.yaml's GD-6 entry, BEFORE assessing
      whether this contract's design actually removes BATCH-003's blocker
      rather than reintroducing a variant of it.
    decision_rule_taxonomy_fix: >-
      See decision_rule_frozen_before_data below: DATA-UNAVAILABLE/BLOCKED is
      now a NAMED branch, distinct from the CONTROL-FAILURE VOID branch,
      exactly as VAL-BATCH-003.md finding 7 and the goal record's GD-6
      standing repair require.
  objective: >-
    Supply real-label delta_E values for every vertex in BATCH-003's
    already-built 2-isogeny graphs (12 primes, p = 1 mod 12) via direct
    in-session bounded smooth-degree isogeny search, then run the IDENTICAL
    M-GAP pipeline BATCH-003 froze (greedy descent versus random walk hitting
    time, sign-tested via bootstrap CI) to test whether a computable
    delta_E-gradient exists.
  objective_boundary: >-
    Inherited unchanged from EXP-SSIQ-58b642: this experiment tests for the
    EXISTENCE of a computable delta_E-gradient. It does not implement,
    propose, or cost a descent algorithm, and a positive result does not
    itself constitute a complexity claim. THE DELTA_E-COMPUTATION SEARCH ITSELF
    IS ALSO NOT A CLAIM: it is a bounded, disclosed, toy-scale labelling
    instrument, and no statement about the archived source's Heuristic 1 or
    its cryptographic-scale claim follows from anything measured here.
  inputs:
    reused_from_batch_003:
      graph_construction_code: experiments/EXP-SSIQ-58b642/implementation/build_isogeny_graph.py
      calibration_code: experiments/EXP-SSIQ-58b642/implementation/calibration_synthetic.py
      descent_estimator_code: experiments/EXP-SSIQ-58b642/implementation/descent_hitting_time.py
      reuse_rule: >-
        IMPORT OR CALL THIS CODE UNCHANGED. Do not fork, do not re-derive the
        OLS-on-logs estimator, the population-median-with-sentinel convention,
        the tie-break rule, or the graph-construction routines. Any change to
        this reused code is a protocol amendment requiring its own pre-freeze
        review, not a silent improvement made mid-run. If a genuine bug is
        found in the reused code, STOP and report it rather than patching it
        in place -- see invalidation_rules.
      primes_reused: >-
        The IDENTICAL 12 primes EXP-SSIQ-58b642 pinned (p = 1 mod 12,
        p <= 22000, spread ~200-1800 vertices): 2437, 3889, 5737, 7333, 8893,
        10657, 12541, 14389, 16189, 18049, 19717, 21601. Re-pinning to a
        different set requires the same pre-freeze justification a fresh
        selection would.
    delta_e_computation:
      method: >-
        For each j-invariant vertex NOT already resolved by the F_p-rational
        identity (delta_E = 1 iff j in F_p, requiring no search, per
        EXP-SSIQ-58b642's delta_eq_1_resolved route): compute delta_E as an
        UPPER BOUND via bidirectional meet-in-the-middle smooth-degree isogeny
        search, mirroring the archived source's Algorithm 1-3
        (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, lines 137-220, ALREADY
        FROZEN IN THIS REPOSITORY -- read it, do not reimplement from memory).
        Build a table of B-smooth-degree isogenies reachable from E (using
        primes in the set L, per smoothness_parameters_pinned_before_data
        below) up to list size X; build the same table from E^{(p)} (the
        Frobenius twist); search for a collision (identical target
        j-invariant) between the two tables. The collision's combined degree
        is the reported delta_E upper bound.
      smoothness_parameters_pinned_before_data: >-
        PF-1 FIX APPLIED (RT-PREFREEZE-EXP-SSIQ-a85692.md Finding 1). B=23,
        X=23, L={2,3,5,7,11,13,17,19,23}. DERIVATION: at the largest
        pre-registered prime (21601), Theorem 1.5 bounds delta_E <=
        (21601/2)^{1/3} ~= 22.14, so B must exceed the largest prime that can
        divide any integer <= 22 -- i.e. B >= 19, rounded to the next prime
        23 for margin. X = B^{1/2}(p_max/2)^{1/6} ~= sqrt(23) x 4.68 ~= 22.4,
        rounded to 23. This REPLACES the prior unpinned worked example
        {2,3,5,7,11,13}, which omitted primes 17 and 19 and would have
        mechanically capped coverage below what Theorem 1.5 itself
        guarantees is reachable at the largest primes (Finding 8).
        NOT TUNED UPWARD OR DOWNWARD MID-RUN under any circumstance.
      feasibility_smoke_test_required_before_phase_minus_1: >-
        PF-1 FIX APPLIED. Before Phase -1 proceeds across the full
        pre-registered prime set, the Executor MUST run and report an
        EXECUTED smoke test at the LARGEST pre-registered prime (21601, NOT
        the smallest -- the prior draft's stopping-rule check tested only the
        smallest prime, where cost is lowest, which the pre-freeze review
        showed provides no assurance about the largest, where cost
        concentrates): build the two-sided B=23,X=23 table for AT LEAST ONE
        non-F_p-rational vertex at p=21601, including at least one Phi_ell
        evaluation for ell>2, and report the measured wall-clock time and
        entry count. A first-principles estimate from this campaign's own
        committed numbers (Theorem 1.5's bound, Lemma 3.2's cardinality
        bound #L(E,X,B) ~= X^2(ln X + 2), and EXP-SSIQ-58b642's own measured
        Phi_2 timing as a per-entry cost FLOOR) suggests roughly 6.19x10^7
        table entries run-wide and a real cost around 21.5x the 7200s budget
        at an optimistic 2.5ms/entry -- BEFORE the larger real cost of
        Phi_ell for ell>2. The smoke test measures the true per-entry cost
        rather than assuming it, because this campaign's own sibling goal
        GOAL-P13-001 already found (EV-PEC-2e67ff, EV-PEC-857664) that the
        archived source's own Section 4.1 convention of "one F_p^2-operation
        per entry" understates real per-entry cost -- the same optimistic
        assumption this smoke test exists to not repeat.
      scope_reduction_fallback_pinned_before_data: >-
        PF-1 FIX APPLIED. IF THE SMOKE TEST CONFIRMS THE PINNED (B,X) CANNOT
        COVER THE FULL PRE-REGISTERED PRIME SET WITHIN BUDGET, the fallback is
        PRIME-SET TRUNCATION, not vertex sampling within a prime (vertex
        sampling would require the descent simulation to handle walks that
        visit unlabelled vertices, a materially larger design change this
        fix does not make). Compute a per-prime sub-budget
        T_prime = 0.5 x 7200s / 12 = 300s (the 0.5 factor reserves the
        other half of the budget for Phase 0, graph reuse, and descent
        simulation) and, using the smoke test's OWN measured per-entry cost,
        estimate each pre-registered prime's full-coverage cost ascending by
        prime size. TRUNCATE the confirmatory prime set to the largest
        ascending PREFIX whose estimated per-prime cost is each <= T_prime.
        This reuses the existing ">= 4 primes or INCONCLUSIVE" floor
        (stopping_rules) rather than inventing new machinery: if the
        truncated prefix has fewer than 4 primes, the run is INCONCLUSIVE for
        lack of coverage. The truncation rule itself -- T_prime's value and
        the ascending-prefix selection -- is FIXED HERE, before any real
        vertex is searched, so it cannot be tuned after seeing which primes
        are convenient.
      known_frobenius_twist_construction: >-
        E^{(p)} is the Galois/Frobenius conjugate curve, computable directly
        from E's own coefficients over F_{p^2} (apply Frobenius to the
        coefficients) -- state the exact construction used and verify it
        against the frozen source's own definition of E^{(p)}
        (paper_fulltext.md Problem 2.3/2.4 region) before use.
      modular_polynomial_source_pinned: >-
        PF-2 FIX APPLIED (Finding 2). Phi_ell for ell in L \ {2} (i.e.
        Phi_3, Phi_5, Phi_7, Phi_11, Phi_13, Phi_17, Phi_19, Phi_23) MUST be
        obtained from a CITED, VERIFIABLE source before implementation begins
        -- e.g. Sutherland's classical modular polynomial database
        (https://math.mit.edu/~drew/ClassicalModPolys.html, already used as a
        primary-source route elsewhere in this campaign, or Andrew
        Sutherland's arXiv:1202.3985 which documents the database), or another
        cited, verifiable classical table. DO NOT approximate, truncate, or
        recall coefficients from memory for ANY ell in L -- the classical
        modular polynomial's coefficients grow large quickly past ell=13 and
        an unverified recollection is fabrication under AGENTS.md rule 9,
        exactly as Phi_2's nine-term form was required to be sourced, not
        recalled, in EXP-SSIQ-58b642.
        INDEPENDENT VERIFICATION REQUIRED for at least the LARGEST ell
        actually used (23 if the pinned B holds): cross-check via a from
        -scratch, differently-implemented route -- e.g. exact rational Velu
        -formula 23-isogeny computation and j-invariant evaluation on a
        handful of test curves, mirroring VAL-BATCH-003's own third-route
        verification of Phi_2 -- BEFORE any real-vertex search runs against
        the sourced polynomial. If independent verification fails for any
        ell, STOP and report per invalidation_rules; do not proceed on an
        unverified polynomial for that ell.
    correctness_cross_checks: >-
      For every vertex where BOTH a computed delta_E upper bound AND an
      independently-derivable quantity exist (the delta_E=1 locus identity;
      and, where feasible within budget, a small independent sample verified
      by a SECOND, differently-implemented search route), cross-check and
      report agreement/disagreement explicitly. This is the successor to
      EXP-SSIQ-58b642's delta_E_cross_reference clause, replaced rather than
      retried: that clause assumed an EXTERNAL correctness oracle (WISDE) that
      does not exist at the per-vertex level; this one builds its own INTERNAL
      cross-check instead, per the two prior contract defects (GD-4, GD-5)
      that came from asserting an instrument's capability without testing it.
  independent_variables:
    - N (graph size, inherited from BATCH-003's pinned 12 primes)
    - descent method: greedy versus undirected random walk (unchanged from EXP-SSIQ-58b642)
    - delta_E resolution status: exact (F_p-rational identity), upper-bound-resolved (collision found), unresolved (search exhausted, no collision)
  metrics:
    primary:
      - id: M-GAMMA-GREEDY
        definition: >-
          IDENTICAL to EXP-SSIQ-58b642's M-GAMMA-GREEDY (same estimator, same
          population-wide-median-with-sentinel convention, same
          trapped_fraction reporting and exclusion threshold -- see
          outcome_scope_label_glossary for its PER-PRIME-TRAPPED-EXCLUSION
          label, PF-4 fix), computed on the NEWLY LABELLED graphs.
      - id: M-GAMMA-RANDOM
        definition: IDENTICAL to EXP-SSIQ-58b642's M-GAMMA-RANDOM.
      - id: M-GAP
        definition: gamma_random - gamma_greedy, with a bootstrap confidence interval.
    secondary:
      - id: M-COVERAGE
        definition: >-
          fraction of non-F_p-rational vertices per prime resolved by a
          collision (upper bound found) versus unresolved (search exhausted),
          as a function of N -- the delta_E-computation analogue of
          trapped_fraction(N). Reported alongside M-GAP for every prime.
          NEW GATING RULE (PF-4 FIX APPLIED, Finding 4): if M-COVERAGE(N)
          falls below 0.5 for any prime, that prime's contribution to M-GAP is
          excluded under the label PER-PRIME-COVERAGE-SHORTFALL -- NOT the
          bare word "VOID", which this contract's decision rule reserves
          exclusively for the run-level CONTROL-FAILURE-VOID branch (see
          outcome_scope_label_glossary below). Mirrors the trapped_fraction
          gate's PURPOSE (an under-covered graph should not silently feed a
          headline number computed mostly from unresolved vertices) but uses
          a DISTINCT label from it, per the glossary.
      - id: M-SEARCH-BIAS-RANDOM-TARGET
        definition: >-
          PF-3 FIX APPLIED (Finding 3), REQUIRED CONTROL, not advisory. For a
          fixed sample of vertices at the SMALLEST pre-registered prime (at
          least 20 non-F_p-rational vertices, or all of them if fewer than 20
          exist), re-run the identical compute_delta_e.py search at the
          identical (B,X), but with each sampled vertex's search TARGET
          replaced by a uniformly random OTHER vertex on the same graph
          instead of the true Frobenius conjugate E^{(p)}. Report the
          correlation between the resulting collision-degree and the
          vertex's 2-isogeny-graph distance to its (random) target.
        why_this_control_exists: >-
          Algorithm 2 as specified builds tables by iterating primes ell <= B
          in ASCENDING order and returns on the FIRST matching collision
          found, which systematically favours degree combinations built from
          small primes -- especially ell=2, the SAME prime that defines the
          descent graph. If this construction-order bias is real, a vertex
          close to many candidate targets in 2-isogeny-graph distance gets a
          smaller reported label FOR A REASON UNRELATED TO ITS TRUE delta_E,
          which would make the real-label arm show a gap correlated with
          exactly the adjacency greedy descent walks -- while C-NULL-LABEL
          (which only shuffles the ALREADY-COMPUTED label multiset) cannot
          distinguish this from a genuine delta_E-gradient, since shuffling
          destroys both correlations identically. If this control finds the
          collision degree correlates with distance-to-RANDOM-target at a
          magnitude comparable to what the real experiment reports against
          the TRUE target, the real arm's M-GAP is CONTROL-FAILURE-VOID
          regardless of what C-NULL-LABEL shows, because the artifact is in
          the search algorithm, not in delta_E itself.
      - id: M-BOUND-TIGHTNESS
        definition: >-
          for vertices where an independent cross-check exists (see
          correctness_cross_checks), the fraction where the computed upper
          bound EQUALS the cross-checked value (bound is tight) versus exceeds
          it. Reported as a correctness diagnostic, not gated into the
          decision rule -- an upper bound remains a valid, disclosed label for
          the descent test even where it is not provably tight, as long as
          M-COVERAGE and the label distribution are honestly reported.
      - id: M-TIEFREQ
        definition: IDENTICAL to EXP-SSIQ-58b642's M-TIEFREQ (content-derived tie-break, reported for both label arms).
      - id: M-DEGSEQ
        definition: IDENTICAL to EXP-SSIQ-58b642's M-DEGSEQ ("every vertex has degree exactly 3").
  tie_break_rule:
    inherited: >-
      IDENTICAL to EXP-SSIQ-58b642's content-derived sha256 tie-break rule,
      reused by code reference, not reimplemented.
  preregistered_prediction:
    quantity: "M-GAP = gamma_random - gamma_greedy"
    formula: >-
      NO POINT PREDICTION IS PRE-REGISTERED, inherited from EXP-SSIQ-58b642 for
      the same reason (DEC-20260805-be2f87 D-1/D-2). The DECISION RULE below is
      pre-registered, stated in terms of statistical separability.
    source: >-
      L4's revisit condition in ledger/goals/GOAL-SSIQ-001/goal.yaml
      (exponent_budget.levers L4) and DEC-20260805-cd8bcd's single next action.
    decision_rule_frozen_before_data:
      - >-
        PHASE -1 GATE (NEW, per GD-6's standing repair): the delta_E-computation
        instrument must resolve M-COVERAGE >= 0.5 on at least 4 primes' full
        vertex sets within budget BEFORE the descent metrics are computed on
        real labels. If this gate fails, the run reports
        DATA-UNAVAILABLE/BLOCKED -- a NAMED, DISTINCT branch from the
        CONTROL-FAILURE VOID below, exactly the taxonomy gap VAL-BATCH-003.md
        finding 7 identified. Do not report this outcome as VOID.
      - >-
        PHASE 0 GATE: C-CAL-GAP (below, reused unchanged from EXP-SSIQ-58b642)
        must PASS before any real graph's descent metrics are computed. This
        gate is ORDERED AFTER Phase -1 in execution if convenient (both are
        real-data-independent... EXCEPT Phase -1 depends on the isogeny search
        working, which IS part of "before real data" in the relevant sense:
        Phase -1 tests the LABEL SOURCE, Phase 0 tests the ESTIMATOR; run
        Phase 0 first since it is pure synthetic arithmetic and cheaper, then
        Phase -1, then Phase 1 real-label descent, in that order, and report
        all three gate results even if an earlier one fails).
      - >-
        M-GAP's bootstrap 95% CI excludes 0 in the POSITIVE direction
        (gamma_random > gamma_greedy): DETECTED. Lever L4 status moves to
        OPEN-WITH-SIGNAL; next action becomes designing a cost model, NOT a
        claim a p^{1/4} algorithm exists.
      - >-
        M-GAP's CI includes 0 or excludes 0 in the NEGATIVE direction: NO
        detectable gradient at this scale. Record as "UNRESOLVED BY THIS TEST"
        -- never "refuted", never "falsified" -- exactly EXP-SSIQ-58b642's
        PF-7 fix, inherited unchanged.
      - >-
        C-NULL-LABEL or C-CONNECTIVITY fails (a CONTROL FAILURE, contaminated
        signal): CONTROL-FAILURE-VOID. Distinct in the report from
        DATA-UNAVAILABLE/BLOCKED above -- a downstream reader filtering
        outcomes must be able to tell these apart, which was exactly what
        EXP-SSIQ-58b642's decision rule failed to provide.
  controls:
    - id: C-CAL-GAP
      kind: calibration
      inherited: >-
        REUSED UNCHANGED from EXP-SSIQ-58b642 (import calibration_synthetic.py
        directly; do not reimplement). Same two synthetic pairs, same +-0.10
        tolerance, same Phase-before-real-data ordering. Independently
        re-derived twice by the Validator in BATCH-003 (from-scratch estimator
        20/20 across seeds; bit-for-bit reproduction of the producer's code) --
        this is now VALIDATED, REUSABLE infrastructure per
        DEC-20260805-cd8bcd D-4, not a fresh claim to re-establish from
        scratch, though it must still be RUN (not merely cited) as this
        contract's own Phase 0 gate.
    - id: C-COVERAGE
      kind: correctness
      pf5_style_new_control: true
      description: >-
        Phase -1 gate, defined under
        metrics.secondary.M-COVERAGE and preregistered_prediction's Phase -1
        branch. The single new control this contract adds beyond
        EXP-SSIQ-58b642's set, because the delta_E-computation search is the
        one genuinely new instrument here.
      pre_registered_expectation: >-
        NO expectation is asserted about what fraction resolves -- learned
        from GD-6: do not assert an instrument's capability without testing
        it. M-COVERAGE is measured and gates the run per the Phase -1 rule; no
        number is assumed in advance.
      failure_consequence: >-
        M-COVERAGE < 0.5 on 4+ primes: DATA-UNAVAILABLE/BLOCKED (see decision
        rule). This is NOT the same failure_consequence text pattern as
        C-NULL-LABEL's VOID -- deliberately, to keep the two outcomes visibly
        distinct in the contract itself, not just in a downstream label.
    - id: C-BOUND-CHECK
      kind: correctness
      description: >-
        Cross-check computed delta_E upper bounds against the delta_E=1 locus
        identity (free, exact) and, budget permitting, a second independently
        -implemented search route for a small sample per prime. Reports
        M-BOUND-TIGHTNESS; does not gate the run (see M-BOUND-TIGHTNESS
        definition) but must be run and reported honestly.
    - id: C-NULL-LABEL
      kind: null_object
      inherited: >-
        REUSED UNCHANGED from EXP-SSIQ-58b642 (shuffle the computed delta_E
        multiset across the same graph). Same failure_consequence: shuffled-
        label gap also significant means real-label M-GAP is
        CONTROL-FAILURE-VOID.
      known_limitation_pf3: >-
        PF-3 FINDING (Finding 3), recorded rather than silently accepted:
        C-NULL-LABEL alone CANNOT detect a search-construction-order artifact
        (see M-SEARCH-BIAS-RANDOM-TARGET), because shuffling the already
        -computed label multiset destroys a genuine delta_E-gradient
        correlation and a search-order artifact correlation IDENTICALLY. Both
        controls are required together; neither alone is sufficient.
    - id: C-SEARCH-BIAS
      kind: null_object
      pf3_fix_applied: true
      description: >-
        REQUIRED CONTROL, not optional. Implements
        M-SEARCH-BIAS-RANDOM-TARGET (see metrics.secondary above): re-run the
        identical compute_delta_e.py search with each sampled vertex's target
        replaced by a uniformly random OTHER graph vertex instead of the true
        Frobenius conjugate, for at least 20 non-F_p-rational vertices (or
        all of them if fewer exist) at the SMALLEST pre-registered prime.
      pre_registered_expectation: >-
        NO expectation is asserted about the magnitude of any correlation
        found -- consistent with C-COVERAGE's own stance (do not assert an
        instrument's behaviour without testing it). The correlation between
        collision-degree and distance-to-(random)-target is measured and
        compared against the real-arm's correlation between collision-degree
        and distance-to-(true)-target, both computed the same way.
      failure_consequence: >-
        If the random-target correlation is comparable in magnitude to the
        real-target correlation the main run reports, the real arm's M-GAP is
        CONTROL-FAILURE-VOID, on the SAME footing as a C-NULL-LABEL failure --
        the artifact is in the search algorithm, not in delta_E, and
        C-NULL-LABEL's own pass does not clear it (see C-NULL-LABEL's
        known_limitation_pf3).
    - id: C-CONNECTIVITY
      kind: correctness
      inherited: REUSED UNCHANGED from EXP-SSIQ-58b642 (floor(p/12) anchor at p = 1 mod 12).
    - id: C-DEGSEQ
      kind: correctness
      inherited: REUSED UNCHANGED from EXP-SSIQ-58b642.
    - id: C-EDGELIST
      kind: correctness
      inherited: REUSED UNCHANGED from EXP-SSIQ-58b642.
    - id: C-SEED
      kind: sampling_independence
      inherited: REUSED UNCHANGED (seeds [20260805, 11, 977]).
    - id: C-REPRO
      kind: determinism
      inherited: REUSED UNCHANGED.
  outcome_scope_label_glossary:
    pf4_fix_applied: >-
      Finding 4. FOUR distinct outcome-scope labels exist in this contract,
      at two different granularities, and none may be substituted for
      another:
        RUN-LEVEL (apply to the whole run's confirmatory decision):
          - CONTROL-FAILURE-VOID: C-NULL-LABEL, C-SEARCH-BIAS, or
            C-CONNECTIVITY failed. Signal is contaminated.
          - DATA-UNAVAILABLE/BLOCKED: the Phase -1 gate (M-COVERAGE >= 0.5 on
            4+ primes) failed. No data existed to test either direction.
        PER-PRIME (exclude one prime's contribution to the aggregate fit,
        without necessarily voiding the whole run):
          - PER-PRIME-COVERAGE-SHORTFALL: that prime's M-COVERAGE(N) < 0.5.
          - PER-PRIME-TRAPPED-EXCLUSION: that prime's greedy-arm
            trapped_fraction(N) > 0.5 (inherited from EXP-SSIQ-58b642, RENAMED
            here from its prior bare "VOID" text for the same reason).
      The bare word "VOID" appears ONLY inside the compound term
      CONTROL-FAILURE-VOID in this contract. Any other appearance is a
      drafting defect.
  fitting_window:
    W-MAIN: >-
      All pre-registered primes with a CONNECTIVITY-passing graph, within the
      scope_reduction_fallback_pinned_before_data's truncated prime set if
      that fallback fired, AND M-COVERAGE >= 0.5 (else
      PER-PRIME-COVERAGE-SHORTFALL). No prime may be excluded post-hoc for an
      inconvenient hitting time or an inconvenient M-GAP contribution.
  scale_relevance:
    tier: toy
    justification: >-
      Inherited unchanged from EXP-SSIQ-58b642: graphs ~200-1800 vertices,
      toy scale, sign-test-on-a-difference design to resist shared-instrument
      bias (BATCH-002's lesson, EV-SSIQ-29fcbb O-4/O-5). The NEW instrument
      (delta_E search) is itself toy-scale (list size X and smoothness bound B
      pinned small, per inputs.delta_e_computation.smoothness_parameters_pinned_before_data)
      and its parameters are disclosed exactly, per docs/claims-and-verification.md.
    correspondence: null
  tail_checks:
    - Inherited unchanged from EXP-SSIQ-58b642 (largest/smallest per-prime hitting time reported beside the fitted trend).
    - >-
      NEW: report the largest delta_E upper bound found per prime beside the
      theoretical ceiling (p/2)^{1/3} (Theorem 1.5), as a sanity check on the
      search's own correctness independent of C-BOUND-CHECK.
  replication:
    seeds: [20260805, 11, 977]
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 1
    delta_e_search_sub_budget_note: >-
      The delta_E-computation search is the new, expensive step -- a
      first-principles estimate (inputs.delta_e_computation.feasibility_smoke_test_required_before_phase_minus_1)
      suggests it plausibly dominates the ENTIRE budget by an order of
      magnitude or more at any smoothness bound wide enough to be useful,
      which is why the smoke test and truncation fallback exist. State
      explicitly in execution_report.yaml how the 7200s is split between graph
      reuse (near-zero, cached from BATCH-003 or rebuilt cheaply per
      EXP-SSIQ-58b642's own measured ~12-120s total), the feasibility smoke
      test itself, delta_E search proper, C-CAL-GAP (measured ~seconds in
      BATCH-003), C-SEARCH-BIAS, and descent simulation. If the split is not
      stated, that is an underspecification per invalidation_rules.
  stopping_rules:
    - >-
      PF-1 FIX APPLIED (Finding 1). MANDATORY FEASIBILITY SMOKE TEST FIRST:
      before Phase -1 proceeds across the full prime set, execute and report
      the smoke test at the LARGEST pre-registered prime (21601) per
      inputs.delta_e_computation.feasibility_smoke_test_required_before_phase_minus_1.
      If the measured cost, extrapolated to the full prime set, exceeds
      budget, apply scope_reduction_fallback_pinned_before_data BEFORE
      running Phase -1 on any prime beyond the smoke test itself -- do not
      discover the overshoot partway through the prime set.
    - >-
      PHASE -1 (delta_E search) BUDGET CAP, per prime: allocate an explicit,
      stated fraction of the 7200s to delta_E computation. If the pinned
      (B, X) does not resolve M-COVERAGE >= 0.5 on a given prime within its
      allocated sub-budget, that prime is excluded under
      PER-PRIME-COVERAGE-SHORTFALL (not DATA-UNAVAILABLE/BLOCKED unless 4+
      primes are so excluded) -- do not silently raise B or X after seeing
      any prime's result.
    - >-
      PHASE 0 GATE: if C-CAL-GAP fails, STOP before Phase -1/Phase 1 entirely
      (inherited from EXP-SSIQ-58b642).
    - >-
      If total budget is reached with only a partial prime set completed,
      report achieved coverage and mark valid-but-truncated, provided at least
      4 primes pass BOTH C-CONNECTIVITY and the M-COVERAGE >= 0.5 gate;
      otherwise INCONCLUSIVE for lack of coverage (inherited pattern from
      EXP-SSIQ-4de240/EXP-SSIQ-58b642).
  invalidation_rules:
    - C-CAL-GAP fails -- STOP before Phase -1/Phase 1; no real-data run attempted.
    - >-
      Feasibility smoke test (largest prime) shows the pinned (B,X) cannot
      cover the full prime set within budget -- apply
      scope_reduction_fallback_pinned_before_data (prime-set truncation), not
      an improvised fix; if the truncated set has fewer than 4 primes,
      INCONCLUSIVE for lack of coverage.
    - >-
      M-COVERAGE < 0.5 on 4+ primes (after any truncation) --
      DATA-UNAVAILABLE/BLOCKED, per outcome_scope_label_glossary (this is the
      run-level taxonomy fix GD-6 requires).
    - >-
      M-COVERAGE < 0.5 for a single prime (not 4+) -- that prime's data point
      is excluded under PER-PRIME-COVERAGE-SHORTFALL, per
      outcome_scope_label_glossary; the run continues on the remaining primes.
    - C-CONNECTIVITY fails for a prime -- that prime's data point is dropped, not fabricated.
    - C-NULL-LABEL or C-SEARCH-BIAS fails -- M-GAP on real labels is CONTROL-FAILURE-VOID.
    - >-
      trapped_fraction(N) exceeds 0.5 for a prime's greedy arm -- that prime's
      gamma_greedy contribution is excluded under PER-PRIME-TRAPPED-EXCLUSION,
      per outcome_scope_label_glossary (inherited from EXP-SSIQ-58b642,
      relabelled here per Finding 4).
    - >-
      Phi_ell independent verification fails for any ell in L -- STOP and
      report per modular_polynomial_source_pinned; do not proceed on an
      unverified polynomial.
    - C-REPRO fails -- completed_invalid.
    - >-
      A pre-registered prime is found NOT to satisfy p = 1 (mod 12) -- STOP
      and correct the prime list (inherited from EXP-SSIQ-58b642).
    - >-
      The reused BATCH-003 code (graph construction, calibration, descent
      estimator) is found to contain a genuine defect -- STOP and report it as
      a finding against EXP-SSIQ-58b642's validated status, per
      inputs.reused_from_batch_003.reuse_rule; do NOT patch it in place inside
      this run.
    - >-
      The contract is found underspecified on any point that changes M-GAP:
      STOP and report the underspecification rather than choosing unilaterally.
  success_criterion: >-
    The run is successful when the feasibility smoke test has been executed
    and reported, Phase -1 and Phase 0 gates both pass (on the truncated
    prime set if scope_reduction_fallback_pinned_before_data fired),
    M-COVERAGE, M-BOUND-TIGHTNESS and M-SEARCH-BIAS-RANDOM-TARGET are reported
    for every prime, M-GAP is estimated with a bootstrap CI, every control
    returns a recorded verdict, and the decision rule is applied mechanically
    to return exactly one of DETECTED / UNRESOLVED-BY-THIS-TEST /
    CONTROL-FAILURE-VOID / DATA-UNAVAILABLE-BLOCKED (see
    outcome_scope_label_glossary for these and the two per-prime labels).
    A DATA-UNAVAILABLE/BLOCKED outcome with an honest, disclosed obstruction is
    a fully successful run in the sense EXP-SSIQ-58b642's VOID outcome was: it
    retires or narrows the lane with a measured reason. An
    UNRESOLVED-BY-THIS-TEST outcome with all gates and controls passing is
    also fully successful.
  falsification_criterion: >-
    Inherited from EXP-SSIQ-58b642's PF-7 fix, restated for H-SSIQ-9e2c71:
