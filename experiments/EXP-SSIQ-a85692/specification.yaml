# DRAFT CONTRACT — NOT YET FROZEN. Goes to a Red Team pre-freeze review before
# any data is touched and before status moves to approved, per GD-4's standing
# practice. THIS DRAFT ALSO CARRIES GD-6's STANDING REPAIR (BATCH-003): the
# pre-freeze review is EXPLICITLY REQUIRED to re-read every cited prior
# artifact IN FULL (not sample its headline metric), and the decision rule
# below names a DATA-UNAVAILABLE/BLOCKED branch as distinct from a
# control-failure VOID, wherever an external or computed input could fail to
# materialise. Do not treat this file as authoritative until status: approved
# and frozen_at is set.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-9e2c71
  version: 1
  title: >-
    Greedy delta_E descent versus random-walk hitting time, with delta_E
    supplied by direct in-session smooth-degree isogeny search (BATCH-004,
    unblocking H-SSIQ-18dc91's real arm)
  status: draft
  approved_by: null
  supersedes_experiment: EXP-SSIQ-58b642
  supersedes_note: >-
    EXP-SSIQ-58b642 is retained unedited (frozen, VOID outcome). This contract
    REUSES its committed graph-construction code and its committed C-CAL-GAP
    calibration code BY REFERENCE (import, not reimplementation) rather than
    respecifying either, and changes exactly one thing: the source of the
    delta_E label for each vertex, from a blocked WISDE cross-reference to a
    direct in-session computation.
  gd6_standing_repair_applied:
    reread_requirement: >-
      The pre-freeze reviewer of THIS contract must re-read, in full, not
      sampled: EXP-SSIQ-58b642/specification.yaml (frozen), its
      RUN-SSIQ-58b642-a/execution_report.yaml and raw-result.json in full
      (not just decision.reason), RT-BATCH-003.md, VAL-BATCH-003.md, and
      ledger/goals/GOAL-SSIQ-001/goal.yaml's GD-6 entry, BEFORE assessing
      whether this contract's design actually removes BATCH-003's blocker
      rather than reintroducing a variant of it.
    decision_rule_taxonomy_fix: >-
      See decision_rule_frozen_before_data below: DATA-UNAVAILABLE/BLOCKED is
      now a NAMED branch, distinct from the CONTROL-FAILURE VOID branch,
      exactly as VAL-BATCH-003.md finding 7 and the goal record's GD-6
      standing repair require.
  objective: >-
    Supply real-label delta_E values for every vertex in BATCH-003's
    already-built 2-isogeny graphs (12 primes, p = 1 mod 12) via direct
    in-session bounded smooth-degree isogeny search, then run the IDENTICAL
    M-GAP pipeline BATCH-003 froze (greedy descent versus random walk hitting
    time, sign-tested via bootstrap CI) to test whether a computable
    delta_E-gradient exists.
  objective_boundary: >-
    Inherited unchanged from EXP-SSIQ-58b642: this experiment tests for the
    EXISTENCE of a computable delta_E-gradient. It does not implement,
    propose, or cost a descent algorithm, and a positive result does not
    itself constitute a complexity claim. THE DELTA_E-COMPUTATION SEARCH ITSELF
    IS ALSO NOT A CLAIM: it is a bounded, disclosed, toy-scale labelling
    instrument, and no statement about the archived source's Heuristic 1 or
    its cryptographic-scale claim follows from anything measured here.
  inputs:
    reused_from_batch_003:
      graph_construction_code: experiments/EXP-SSIQ-58b642/implementation/build_isogeny_graph.py
      calibration_code: experiments/EXP-SSIQ-58b642/implementation/calibration_synthetic.py
      descent_estimator_code: experiments/EXP-SSIQ-58b642/implementation/descent_hitting_time.py
      reuse_rule: >-
        IMPORT OR CALL THIS CODE UNCHANGED. Do not fork, do not re-derive the
        OLS-on-logs estimator, the population-median-with-sentinel convention,
        the tie-break rule, or the graph-construction routines. Any change to
        this reused code is a protocol amendment requiring its own pre-freeze
        review, not a silent improvement made mid-run. If a genuine bug is
        found in the reused code, STOP and report it rather than patching it
        in place -- see invalidation_rules.
      primes_reused: >-
        The IDENTICAL 12 primes EXP-SSIQ-58b642 pinned (p = 1 mod 12,
        p <= 22000, spread ~200-1800 vertices): 2437, 3889, 5737, 7333, 8893,
        10657, 12541, 14389, 16189, 18049, 19717, 21601. Re-pinning to a
        different set requires the same pre-freeze justification a fresh
        selection would.
    delta_e_computation:
      method: >-
        For each j-invariant vertex NOT already resolved by the F_p-rational
        identity (delta_E = 1 iff j in F_p, requiring no search, per
        EXP-SSIQ-58b642's delta_eq_1_resolved route): compute delta_E as an
        UPPER BOUND via bidirectional meet-in-the-middle smooth-degree isogeny
        search, mirroring the archived source's Algorithm 1-3
        (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, lines 137-220, ALREADY
        FROZEN IN THIS REPOSITORY -- read it, do not reimplement from memory).
        Build a table of B-smooth-degree isogenies reachable from E (using
        primes in a small set L, e.g. {2,3,5,7,11,13}) up to list size X;
        build the same table from E^{(p)} (the Frobenius twist); search for a
        collision (identical target j-invariant) between the two tables. The
        collision's combined degree is the reported delta_E upper bound.
      smoothness_parameters_pinned_before_data: >-
        B (the largest prime in L) and X (the per-side table size cap) MUST BE
        FIXED BEFORE ANY GRAPH'S delta_E COMPUTATION BEGINS, chosen to fit the
        run's wall-clock budget for the LARGEST pre-registered graph (21601,
        N=1800) -- not tuned upward mid-run if early primes finish fast, and
        not tuned downward mid-run if early primes are slow. If the
        pre-registered (B, X) proves infeasible for the full prime set within
        budget, STOP and report per stopping_rules; do not silently shrink
        scope after seeing partial results.
      known_frobenius_twist_construction: >-
        E^{(p)} is the Galois/Frobenius conjugate curve, computable directly
        from E's own coefficients over F_{p^2} (apply Frobenius to the
        coefficients) -- state the exact construction used and verify it
        against the frozen source's own definition of E^{(p)}
        (paper_fulltext.md Problem 2.3/2.4 region) before use.
    correctness_cross_checks: >-
      For every vertex where BOTH a computed delta_E upper bound AND an
      independently-derivable quantity exist (the delta_E=1 locus identity;
      and, where feasible within budget, a small independent sample verified
      by a SECOND, differently-implemented search route), cross-check and
      report agreement/disagreement explicitly. This is the successor to
      EXP-SSIQ-58b642's delta_E_cross_reference clause, replaced rather than
      retried: that clause assumed an EXTERNAL correctness oracle (WISDE) that
      does not exist at the per-vertex level; this one builds its own INTERNAL
      cross-check instead, per the two prior contract defects (GD-4, GD-5)
      that came from asserting an instrument's capability without testing it.
  independent_variables:
    - N (graph size, inherited from BATCH-003's pinned 12 primes)
    - descent method: greedy versus undirected random walk (unchanged from EXP-SSIQ-58b642)
    - delta_E resolution status: exact (F_p-rational identity), upper-bound-resolved (collision found), unresolved (search exhausted, no collision)
  metrics:
    primary:
      - id: M-GAMMA-GREEDY
        definition: >-
          IDENTICAL to EXP-SSIQ-58b642's M-GAMMA-GREEDY (same estimator, same
          population-wide-median-with-sentinel convention, same trapped_fraction
          reporting and VOID threshold), computed on the NEWLY LABELLED graphs.
      - id: M-GAMMA-RANDOM
        definition: IDENTICAL to EXP-SSIQ-58b642's M-GAMMA-RANDOM.
      - id: M-GAP
        definition: gamma_random - gamma_greedy, with a bootstrap confidence interval.
    secondary:
      - id: M-COVERAGE
        definition: >-
          fraction of non-F_p-rational vertices per prime resolved by a
          collision (upper bound found) versus unresolved (search exhausted),
          as a function of N -- the delta_E-computation analogue of
          trapped_fraction(N). Reported alongside M-GAP for every prime.
          NEW GATING RULE: if M-COVERAGE(N) falls below 0.5 for any prime, that
          prime's contribution to M-GAP is VOID (mirrors the trapped_fraction
          gate on the descent side; an under-covered graph should not silently
          feed a headline number computed mostly from unresolved vertices).
      - id: M-BOUND-TIGHTNESS
        definition: >-
          for vertices where an independent cross-check exists (see
          correctness_cross_checks), the fraction where the computed upper
          bound EQUALS the cross-checked value (bound is tight) versus exceeds
          it. Reported as a correctness diagnostic, not gated into the
          decision rule -- an upper bound remains a valid, disclosed label for
          the descent test even where it is not provably tight, as long as
          M-COVERAGE and the label distribution are honestly reported.
      - id: M-TIEFREQ
        definition: IDENTICAL to EXP-SSIQ-58b642's M-TIEFREQ (content-derived tie-break, reported for both label arms).
      - id: M-DEGSEQ
        definition: IDENTICAL to EXP-SSIQ-58b642's M-DEGSEQ ("every vertex has degree exactly 3").
  tie_break_rule:
    inherited: >-
      IDENTICAL to EXP-SSIQ-58b642's content-derived sha256 tie-break rule,
      reused by code reference, not reimplemented.
  preregistered_prediction:
    quantity: "M-GAP = gamma_random - gamma_greedy"
    formula: >-
      NO POINT PREDICTION IS PRE-REGISTERED, inherited from EXP-SSIQ-58b642 for
      the same reason (DEC-20260805-be2f87 D-1/D-2). The DECISION RULE below is
      pre-registered, stated in terms of statistical separability.
    source: >-
      L4's revisit condition in ledger/goals/GOAL-SSIQ-001/goal.yaml
      (exponent_budget.levers L4) and DEC-20260805-cd8bcd's single next action.
    decision_rule_frozen_before_data:
      - >-
        PHASE -1 GATE (NEW, per GD-6's standing repair): the delta_E-computation
        instrument must resolve M-COVERAGE >= 0.5 on at least 4 primes' full
        vertex sets within budget BEFORE the descent metrics are computed on
        real labels. If this gate fails, the run reports
        DATA-UNAVAILABLE/BLOCKED -- a NAMED, DISTINCT branch from the
        CONTROL-FAILURE VOID below, exactly the taxonomy gap VAL-BATCH-003.md
        finding 7 identified. Do not report this outcome as VOID.
      - >-
        PHASE 0 GATE: C-CAL-GAP (below, reused unchanged from EXP-SSIQ-58b642)
        must PASS before any real graph's descent metrics are computed. This
        gate is ORDERED AFTER Phase -1 in execution if convenient (both are
        real-data-independent... EXCEPT Phase -1 depends on the isogeny search
        working, which IS part of "before real data" in the relevant sense:
        Phase -1 tests the LABEL SOURCE, Phase 0 tests the ESTIMATOR; run
        Phase 0 first since it is pure synthetic arithmetic and cheaper, then
        Phase -1, then Phase 1 real-label descent, in that order, and report
        all three gate results even if an earlier one fails).
      - >-
        M-GAP's bootstrap 95% CI excludes 0 in the POSITIVE direction
        (gamma_random > gamma_greedy): DETECTED. Lever L4 status moves to
        OPEN-WITH-SIGNAL; next action becomes designing a cost model, NOT a
        claim a p^{1/4} algorithm exists.
      - >-
        M-GAP's CI includes 0 or excludes 0 in the NEGATIVE direction: NO
        detectable gradient at this scale. Record as "UNRESOLVED BY THIS TEST"
        -- never "refuted", never "falsified" -- exactly EXP-SSIQ-58b642's
        PF-7 fix, inherited unchanged.
      - >-
        C-NULL-LABEL or C-CONNECTIVITY fails (a CONTROL FAILURE, contaminated
        signal): CONTROL-FAILURE-VOID. Distinct in the report from
        DATA-UNAVAILABLE/BLOCKED above -- a downstream reader filtering
        outcomes must be able to tell these apart, which was exactly what
        EXP-SSIQ-58b642's decision rule failed to provide.
  controls:
    - id: C-CAL-GAP
      kind: calibration
      inherited: >-
        REUSED UNCHANGED from EXP-SSIQ-58b642 (import calibration_synthetic.py
        directly; do not reimplement). Same two synthetic pairs, same +-0.10
        tolerance, same Phase-before-real-data ordering. Independently
        re-derived twice by the Validator in BATCH-003 (from-scratch estimator
        20/20 across seeds; bit-for-bit reproduction of the producer's code) --
        this is now VALIDATED, REUSABLE infrastructure per
        DEC-20260805-cd8bcd D-4, not a fresh claim to re-establish from
        scratch, though it must still be RUN (not merely cited) as this
        contract's own Phase 0 gate.
    - id: C-COVERAGE
      kind: correctness
      pf5_style_new_control: true
      description: >-
        Phase -1 gate, defined under
        metrics.secondary.M-COVERAGE and preregistered_prediction's Phase -1
        branch. The single new control this contract adds beyond
        EXP-SSIQ-58b642's set, because the delta_E-computation search is the
        one genuinely new instrument here.
      pre_registered_expectation: >-
        NO expectation is asserted about what fraction resolves -- learned
        from GD-6: do not assert an instrument's capability without testing
        it. M-COVERAGE is measured and gates the run per the Phase -1 rule; no
        number is assumed in advance.
      failure_consequence: >-
        M-COVERAGE < 0.5 on 4+ primes: DATA-UNAVAILABLE/BLOCKED (see decision
        rule). This is NOT the same failure_consequence text pattern as
        C-NULL-LABEL's VOID -- deliberately, to keep the two outcomes visibly
        distinct in the contract itself, not just in a downstream label.
    - id: C-BOUND-CHECK
      kind: correctness
      description: >-
        Cross-check computed delta_E upper bounds against the delta_E=1 locus
        identity (free, exact) and, budget permitting, a second independently
        -implemented search route for a small sample per prime. Reports
        M-BOUND-TIGHTNESS; does not gate the run (see M-BOUND-TIGHTNESS
        definition) but must be run and reported honestly.
    - id: C-NULL-LABEL
      kind: null_object
      inherited: >-
        REUSED UNCHANGED from EXP-SSIQ-58b642 (shuffle the computed delta_E
        multiset across the same graph). Same failure_consequence: shuffled-
        label gap also significant means real-label M-GAP is
        CONTROL-FAILURE-VOID.
    - id: C-CONNECTIVITY
      kind: correctness
      inherited: REUSED UNCHANGED from EXP-SSIQ-58b642 (floor(p/12) anchor at p = 1 mod 12).
    - id: C-DEGSEQ
      kind: correctness
      inherited: REUSED UNCHANGED from EXP-SSIQ-58b642.
    - id: C-EDGELIST
      kind: correctness
      inherited: REUSED UNCHANGED from EXP-SSIQ-58b642.
    - id: C-SEED
      kind: sampling_independence
      inherited: REUSED UNCHANGED (seeds [20260805, 11, 977]).
    - id: C-REPRO
      kind: determinism
      inherited: REUSED UNCHANGED.
  fitting_window:
    W-MAIN: >-
      All pre-registered primes with a CONNECTIVITY-passing graph AND
      M-COVERAGE >= 0.5. No prime may be excluded post-hoc for an inconvenient
      hitting time or an inconvenient M-GAP contribution.
  scale_relevance:
    tier: toy
    justification: >-
      Inherited unchanged from EXP-SSIQ-58b642: graphs ~200-1800 vertices,
      toy scale, sign-test-on-a-difference design to resist shared-instrument
      bias (BATCH-002's lesson, EV-SSIQ-29fcbb O-4/O-5). The NEW instrument
      (delta_E search) is itself toy-scale (list size X and smoothness bound B
      pinned small, per inputs.delta_e_computation.smoothness_parameters_pinned_before_data)
      and its parameters are disclosed exactly, per docs/claims-and-verification.md.
    correspondence: null
  tail_checks:
    - Inherited unchanged from EXP-SSIQ-58b642 (largest/smallest per-prime hitting time reported beside the fitted trend).
    - >-
      NEW: report the largest delta_E upper bound found per prime beside the
      theoretical ceiling (p/2)^{1/3} (Theorem 1.5), as a sanity check on the
      search's own correctness independent of C-BOUND-CHECK.
  replication:
    seeds: [20260805, 11, 977]
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 1
    delta_e_search_sub_budget_note: >-
      The delta_E-computation search is the new, potentially expensive step.
      State explicitly in execution_report.yaml how the 7200s is split between
      graph reuse (near-zero, cached from BATCH-003 or rebuilt cheaply per
      EXP-SSIQ-58b642's own measured ~12-120s total), delta_E search (expected
      to dominate), C-CAL-GAP (measured ~seconds in BATCH-003), and descent
      simulation. If the split is not stated, that is an underspecification
      per invalidation_rules.
  stopping_rules:
    - >-
      PHASE -1 (delta_E search) BUDGET CAP: allocate an explicit, stated
      fraction of the 7200s to delta_E computation. If the pinned (B, X) does
      not resolve M-COVERAGE >= 0.5 on the smallest pre-registered graph
      within a stated sub-budget, STOP and report DATA-UNAVAILABLE/BLOCKED
      with the exact obstruction (search did not terminate; collision rate too
      low at the pinned B/X) -- do not silently raise B or X after seeing the
      first result.
    - >-
      PHASE 0 GATE: if C-CAL-GAP fails, STOP before Phase -1/Phase 1 entirely
      (inherited from EXP-SSIQ-58b642).
    - >-
      If total budget is reached with only a partial prime set completed,
      report achieved coverage and mark valid-but-truncated, provided at least
      4 primes pass BOTH C-CONNECTIVITY and the M-COVERAGE >= 0.5 gate;
      otherwise INCONCLUSIVE for lack of coverage (inherited pattern from
      EXP-SSIQ-4de240/EXP-SSIQ-58b642).
  invalidation_rules:
    - C-CAL-GAP fails -- STOP before Phase -1/Phase 1; no real-data run attempted.
    - >-
      M-COVERAGE < 0.5 on 4+ primes -- DATA-UNAVAILABLE/BLOCKED, NOT VOID (see
      decision rule; this is the taxonomy fix GD-6 requires).
    - C-CONNECTIVITY fails for a prime -- that prime's data point is dropped, not fabricated.
    - C-NULL-LABEL fails -- M-GAP on real labels is CONTROL-FAILURE-VOID.
    - >-
      trapped_fraction(N) exceeds 0.5 for a prime's greedy arm -- that prime's
      gamma_greedy contribution is VOID (inherited from EXP-SSIQ-58b642).
    - C-REPRO fails -- completed_invalid.
    - >-
      A pre-registered prime is found NOT to satisfy p = 1 (mod 12) -- STOP
      and correct the prime list (inherited from EXP-SSIQ-58b642).
    - >-
      The reused BATCH-003 code (graph construction, calibration, descent
      estimator) is found to contain a genuine defect -- STOP and report it as
      a finding against EXP-SSIQ-58b642's validated status, per
      inputs.reused_from_batch_003.reuse_rule; do NOT patch it in place inside
      this run.
    - >-
      The contract is found underspecified on any point that changes M-GAP:
      STOP and report the underspecification rather than choosing unilaterally.
  success_criterion: >-
    The run is successful when Phase -1 and Phase 0 gates both pass,
    M-COVERAGE and M-BOUND-TIGHTNESS are reported for every prime, M-GAP is
    estimated with a bootstrap CI over the pre-registered prime set, every
    control returns a recorded verdict, and the decision rule is applied
    mechanically to return exactly one of DETECTED / UNRESOLVED-BY-THIS-TEST /
    CONTROL-FAILURE-VOID / DATA-UNAVAILABLE-BLOCKED.
    A DATA-UNAVAILABLE/BLOCKED outcome with an honest, disclosed obstruction is
    a fully successful run in the sense EXP-SSIQ-58b642's VOID outcome was: it
    retires or narrows the lane with a measured reason. An
    UNRESOLVED-BY-THIS-TEST outcome with all gates and controls passing is
    also fully successful.
  falsification_criterion: >-
    Inherited from EXP-SSIQ-58b642's PF-7 fix, restated for H-SSIQ-9e2c71:
    H-SSIQ-9e2c71's toy-scale prediction is NOT SUPPORTED AT THIS SCALE if
    M-GAP's CI includes or is below 0 with the Phase -1 gate, C-CAL-GAP,
    C-NULL-LABEL and C-CONNECTIVITY all passing on at least 4 primes. Record
    as "unresolved by this test," NEVER as "falsified" or "refuted."
  required_artifacts:
    - implementation/compute_delta_e.py
    - runs/RUN-SSIQ-a85692-a/manifest.yaml
    - runs/RUN-SSIQ-a85692-a/raw-result.json
    - runs/RUN-SSIQ-a85692-a/execution_report.yaml
    - runs/RUN-SSIQ-a85692-a/source_access_log.yaml
    - runs/RUN-SSIQ-a85692-a/command.txt
    - runs/RUN-SSIQ-a85692-a/environment.json
    - runs/RUN-SSIQ-a85692-a/stdout.log
    - runs/RUN-SSIQ-a85692-a/stderr.log
  required_artifacts_note: >-
    Only implementation/compute_delta_e.py is new; graph construction,
    calibration, and descent-estimator code are IMPORTED from
    experiments/EXP-SSIQ-58b642/implementation/ by reference, not copied.
    source_access_log.yaml is retained in the required list even though this
    experiment needs no external dataset for its real arm, because the delta_E
    search route must still log whatever it fetches (e.g. re-verifying
    paper_fulltext.md's frozen content, or any WISDE fetch used ONLY for
    C-BOUND-CHECK's optional cross-check) -- an empty or near-empty log is an
    acceptable, honest content for this field, not a reason to omit it. Same
    five companion filenames as EXP-SSIQ-58b642 (PF-6's fix, GD-5's lesson):
    command.txt, environment.json, stdout.log, stderr.log, raw-result.json.
    manifest.yaml's BODY must independently satisfy RUN_REQUIRED_TOP with
    code.commit/code.command populated, as a SEPARATE obligation from the
    companion files existing.
  assigned_to: executor
  approved_by: null
  freeze_note: >-
    NOT YET FROZEN. Pending Red Team pre-freeze review with GD-6's standing
    repair applied: full re-read of every cited BATCH-003 artifact, and
    verification that the DATA-UNAVAILABLE/BLOCKED branch is genuinely
    distinct from CONTROL-FAILURE-VOID throughout, not just in name.
