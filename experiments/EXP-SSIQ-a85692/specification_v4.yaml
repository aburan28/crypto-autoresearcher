    reopened, restated, or re-run by this amendment.
  pre_freeze_review:
    status: PENDING
    note: >-
      Not yet reviewed. The reviewer must: (a) verify by direct code
      reading that run_synthetic_self_test_v4 genuinely calls
      c_null_label_comparison_v3 (imported, not reimplemented) in BOTH
      branches, not a hand-written duplicate of its comparison expression
