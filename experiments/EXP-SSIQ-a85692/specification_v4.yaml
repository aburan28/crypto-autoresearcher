      one MUTATION of c_null_label_comparison_v3 (e.g. swap which dict N
      is read from, introduce an off-by-one in min_primes, remove the
      sorted() call) and confirm, by tracing the mutated code against the
      new self-test's synthetic inputs, that the mutation would actually
      change the self-test's reported outputs (a genuine discriminating-
      power check, not merely "the test exists and passes" -- RT-BATCH-006.md's
