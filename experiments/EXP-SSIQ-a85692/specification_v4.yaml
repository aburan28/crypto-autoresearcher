# DRAFT PROTOCOL AMENDMENT, NOT YET FROZEN. Supersedes specification_v3.yaml
# (v3, frozen 7f40426b, retained unedited) on ONE POINT: GD-10, the
# discovery that v3's own required synthetic self-test (built to validate
# c_null_label_comparison_v3, GD-9's fix, because real data cannot exercise
# it -- see v3's own PF-1 finding) never actually calls that function. It
# calls the underlying ols_loglog_fit/bootstrap_gap_ci library functions
# directly and re-implements the comparison rule as a second, hand-written
# copy, bypassing c_null_label_comparison_v3's own cross-dict indexing,
# min-primes gate, and sorted() ordering step entirely (RT-BATCH-006.md
# Front 1, Objection 1). A subtly wrong wrapper implementation -- a swapped
# dict source for N, an off-by-one in min_primes, a missing sort -- would
# pass v3's self-test unchanged.
#
# THIS AMENDMENT REPLACES v3's synthetic self-test with one that calls
# c_null_label_comparison_v3 ITSELF, through both its branches, with
# synthetic data constructed in the REAL DATA'S OWN SCHEMA (real_per_prime
# carries N; null_per_prime does not -- confirmed structurally forced by
# RUN-SSIQ-a85692-b's own raw-result.json, RT-BATCH-006.md check (a)), so a
# wrong dict-source choice raises KeyError rather than silently working,
# and with an UNSORTED null_survivors input, so a missing sorted() step
# produces a detectably wrong gamma. Zero new search cost: this is
# synthetic-data-only test construction, the same class of work as v3's
# own (failed) self-test, done correctly this time. It does NOT re-analyze
# RUN-SSIQ-a85692-b's real data again (that re-analysis, and its
# DATA-UNAVAILABLE-BLOCKED outcome, is already archived and unchanged by
# this amendment) and does NOT touch the trapping-mechanism diagnostic
# (DEC-20260805-e46f4f's next_actions item 2), which is deferred to
# BATCH-008 as a separately-scoped amendment, per this campaign's
# preference for narrow, precisely-specified, independently-reviewable
# amendments (evident in the v1->v2->v3 lineage's own one-change-at-a-time
# discipline).
#
# This amendment must go through its own pre-freeze Red Team review before
# freeze, per GD-10's standing repair: the reviewer verifies, by direct
# code reading of the NEW self-test code (not the prose description below),
# that it genuinely calls c_null_label_comparison_v3 in both branches, and
# additionally attempts to construct a MUTATION of c_null_label_comparison_v3
# (a swapped dict source, an off-by-one, a missing sort) and confirms the
# new self-test would actually catch it -- the exact discriminating-power
# check RT-BATCH-006.md performed against v3's self-test and found it
# failed.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 4
  title: >-
    A synthetic self-test that actually calls c_null_label_comparison_v3
    (BATCH-007, fixing GD-10, zero new search)
  status: draft
  approved_by: null
