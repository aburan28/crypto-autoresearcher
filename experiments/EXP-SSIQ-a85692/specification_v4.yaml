  inputs:
    synthetic_self_test_v4: >-
      REPLACES v3's run_synthetic_self_test_v3. Two required checks, both
      calling c_null_label_comparison_v3 ITSELF (imported, not
      reimplemented):
      CHECK 1 (NOT-EVALUABLE branch): construct synthetic real_per_prime
      (>=4 entries, each carrying an N key, e.g. {2000: {"N": 200}, 3000:
      {"N": 300}, 5000: {"N": 500}, 7000: {"N": 700}}) and synthetic
      null_per_prime (matching keys, each carrying greedy_median/
      random_median but explicitly NO N key, mirroring
      c_null_label.per_prime's real schema exactly) and a null_survivors
      list of length 2 (< NULL_ARM_MIN_PRIMES=3). Call
      c_null_label_comparison_v3(real_per_prime, null_per_prime,
      null_survivors, rng_seed, ...) and assert the return value's
      c_null_label_control_failure is EXACTLY the string "NOT-EVALUABLE"
      and evaluable is False -- via the function's own return value, not a
      hand-computed prediction of what it should return.
      CHECK 2 (fit-and-bootstrap branch): construct synthetic
      real_per_prime and null_per_prime as above but with >=4 entries in
      null_per_prime's schema-matching dicts (no N key), an UNSORTED
      null_survivors list (e.g. [7000, 2000, 5000, 3000], deliberately out
      of ascending order), and greedy_median/random_median values
      constructed as TWO EXACT POWER LAWS in N (using real_per_prime's own
      N values, which the function must correctly pull via
      real_per_prime[p]["N"] for each p in the SORTED null_survivors --
      this is the specific wiring GD-10 found untested) with known
      gamma_greedy_synth and gamma_random_synth. Call
      c_null_label_comparison_v3 with this UNSORTED null_survivors list
      and assert: (i) the function's own internal sort produces the
      correct ascending N_list (checkable because each synthetic prime's N
      is unique and known); (ii) the returned gamma_null_greedy/
      gamma_null_random match the known exact-power-law exponents to
      <1e-9 tolerance (hand-computable, an exact power law forces a
      perfect OLS fit); (iii) the returned m_gap_null_ci_lo/hi both equal
      the point value gamma_random_synth - gamma_greedy_synth to <1e-9
      tolerance (an exact power law's bootstrap CI must degenerate to a
      point, per VAL-BATCH-006.md's own independently-confirmed reasoning);
      (iv) c_null_label_control_failure matches the pre-registered
      comparison rule applied to that CI (True if m_gap_null_ci_lo > 0,
      chosen here to be unambiguously True by construction, so the branch
      that actually assigns this boolean from real computation is
      exercised, not merely the branch that returns "NOT-EVALUABLE").
      PF-2 FIX APPLIED: assertion (i) (the ascending N_list/primes_used
      ordering) is THE LOAD-BEARING CHECK for a missing-or-incorrect
      sorted() defect specifically, and must not be dropped or weakened
      independent of (ii)-(iv). Traced directly: for this check's
      deliberately noiseless exact-power-law construction,
      ols_loglog_fit's sum-based gamma and bootstrap_gap_ci's resampling
      are BOTH INVARIANT to point order -- every valid subset/resample
      recovers the identical true gamma regardless of whether
      null_survivors was sorted before use. So (ii)-(iv) would report
      numerically IDENTICAL values whether or not sorted() ran; only the
      raw N_list/primes_used field order differs, and (i) alone is what
      catches a missing/wrong sort. (i)-(iv) are NOT interchangeable
      evidence for the same class of bug and must all be retained, but a
      future amendment trimming any of them for redundancy must know (i)
      is not redundant with the others for this specific mutation.
      CHECK 3 (fit-and-bootstrap branch, AT THE FLOOR -- PF-1 FIX APPLIED,
      BLOCKING): construct synthetic real_per_prime/null_per_prime as in
      CHECK 2 (exact power laws, known gamma_greedy_synth/
      gamma_random_synth, no N key in null_per_prime) but with a
      null_survivors list of length EXACTLY NULL_ARM_MIN_PRIMES=3 (not 4,
      not 2) -- the one length that distinguishes a correct
      `len(null_survivors) < min_primes` gate from an off-by-one mutant
      (e.g. `<= min_primes`, requiring >3 rather than >=3): under the
      correct gate, length-3 survivors clears it (evaluable=True); under
      the off-by-one mutant, length-3 does NOT clear it
      (evaluable=NOT-EVALUABLE). CHECK 1 (length 2, one below the floor)
      and CHECK 2 (length 4, one above) are both INSENSITIVE to this
      specific mutation -- both report the same result under the correct
      gate and the off-by-one mutant, which is exactly why this amendment
      as originally drafted would not have caught it (RT-PREFREEZE-EXP-SSIQ-a85692-v4.md
      PF-1, independently traced and confirmed by the pre-freeze
      reviewer). Assert evaluable is True and (ii)-(iv)'s same checks as
      CHECK 2, at this boundary length specifically -- symmetric with how
      CHECK 1 already tests the boundary from below.
      ALL THREE CHECKS CALL c_null_label_comparison_v3 DIRECTLY -- no
      duplicate, hand-written re-implementation of its internal logic
      anywhere in the self-test code, per GD-10's standing repair.
      Report all three checks' full inputs, outputs, and pass/fail
      verdicts in execution_report.yaml as a distinct section, per v3's
      own precedent (synthetic_self_test_v3's reporting requirement,
      inherited unchanged in form).
    mutation_precondition_v4: >-
