    run_synthetic_self_test_v4, which calls c_null_label_comparison_v3
    itself, through both its NOT-EVALUABLE and fit-and-bootstrap branches,
    with synthetic data shaped in the real data's own schema. Everything
    else in v1/v2/v3 (B=23/X=23, the delta_E instrument, the
