        or call unchanged; any further change is a new amendment, not a
        silent improvement made mid-run.
    New run id RUN-SSIQ-a85692-b (v1's RUN-SSIQ-a85692-a stays frozen and
    untouched). The Executor's own execution_report.yaml must confirm this
    diff list against the code it actually wrote/ran, and report any
    discrepancy rather than silently reconciling it.
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 1
    note: >-
      Unchanged from v1. BATCH-004 spent only 90.57s of this budget (Phase
