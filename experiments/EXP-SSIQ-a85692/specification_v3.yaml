# DRAFT PROTOCOL AMENDMENT, NOT YET FROZEN. Supersedes specification_v2.yaml
# (v2, frozen 14b56525, retained unedited) on TWO POINTS: GD-8 (the
# PER-PRIME-TRAPPED-EXCLUSION filter stated in v1's own inherited text but
# never implemented in the reused inline orchestration) and GD-9 (C-NULL-LABEL's
# comparison logic, never implemented -- a "required" control that structurally
# could not fail). Both defects were found by BATCH-005's Executor/Validator/
# Red Team (RT-BATCH-005.md, VAL-BATCH-005.md), independently confirmed
# against the actual code and RUN-SSIQ-a85692-b's own raw data. THIS
# AMENDMENT IS A PURE RE-ANALYSIS: it re-derives descent_metrics and adds a
# real C-NULL-LABEL computation from data RUN-SSIQ-a85692-b ALREADY
# COLLECTED (per-prime greedy_median/random_median/trapped_fraction/N for
# both the real and shuffled-label arms). It runs NO NEW delta_E search, NO
# NEW graph construction, and NO NEW Phase -1 execution -- zero new search
# cost, per DEC-20260805-5f5ac6's adopted BATCH-006 plan. Every other pinned
# element of v1/v2 -- B=23/X=23, the delta_E instrument, the
# budget-allocation formulas (GD-7's fix, independently confirmed working in
# BATCH-005), C-SEARCH-BIAS, C-CAL-GAP, C-BOUND-CHECK, C-CONNECTIVITY,
# C-DEGSEQ, C-EDGELIST, C-SEED, C-REPRO, the four-label
# outcome_scope_label_glossary -- is REUSED UNCHANGED and NOT restated in
# full below. This amendment must go through its own pre-freeze Red Team
# review before freeze, per GD-9's standing repair: the reviewer verifies
# by direct code reading that the comparison rules below are ACTUALLY
# IMPLEMENTED as pre-registered, not merely described in prose, before this
# is frozen -- the exact discipline whose absence let GD-9 go undetected
# for three prior batches.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 3
  title: >-
    Re-analysis of RUN-SSIQ-a85692-b under a corrected trapped-vertex
    exclusion filter and a wired C-NULL-LABEL comparison (BATCH-006,
    fixing GD-8/GD-9, zero new search)
  status: draft
  approved_by: null
  amends: EXP-SSIQ-a85692 (version 2, specification_v2.yaml, frozen 14b56525)
  amendment_scope: >-
    TWO CHANGES, BOTH RE-ANALYSIS OF ALREADY-COLLECTED DATA, ZERO NEW
    SEARCH. (1) trapped_exclusion_filter_v3 (GD-8's fix): implement the
    PER-PRIME-TRAPPED-EXCLUSION filter v1's own M-GAMMA-GREEDY definition
    text has always required (trapped_fraction>0.5) but the reused inline
    orchestration never applied, and re-derive descent_metrics (real arm)
    on whichever of RUN-SSIQ-a85692-b's 4 already-searched primes survive
    it. (2) c_null_label_comparison_v3 (GD-9's fix): implement C-NULL-LABEL's
    missing comparison logic -- fit a null M-GAP via the identical
    OLS-log-log + bootstrap machinery the real arm already uses, on the
    SAME (filtered) primes' already-computed shuffled-label medians, and
    derive c_null_label_control_failure from a comparison rule stated and
    justified in THIS document, BEFORE being applied to
    RUN-SSIQ-a85692-b's already-known null_by_prime numbers -- so fixing
    dead code does not become an opportunity to tune a threshold to a
    desired outcome. Every other pinned element of v1/v2 is REUSED
    UNCHANGED and NOT restated below.
  pre_freeze_review:
    status: PENDING
    note: >-
      Not yet reviewed. The reviewer must: (a) verify by direct code
      reading that trapped_exclusion_filter_v3 and
      c_null_label_comparison_v3 below are actually implemented as
      specified, not left as dead code the way GD-9 was (the exact
      failure mode this amendment exists to fix, so the reviewer must not
      repeat it); (b) independently re-derive, from
      RUN-SSIQ-a85692-b's own already-committed raw-result.json
      (c_null_label.per_prime and descent_metrics.per_prime), which
      primes survive trapped_exclusion_filter_v3 (expected: zero of the 4
      previously-used primes, since all four have trapped_fraction in
      [0.72, 0.85], each exceeding 0.5 -- confirm this arithmetic
      independently rather than trusting the draft's own worked check);
      (c) check that c_null_label_comparison_v3's pre-registered rule is
      genuinely stated independent of what it would output on existing
      data, i.e. that the rule's design does not implicitly encode
      knowledge of RUN-SSIQ-a85692-b's actual null_by_prime numbers; (d)
      confirm the DATA-UNAVAILABLE/BLOCKED-for-corrected-filter branch
      below (fired when < 4 primes survive trapped_exclusion_filter_v3)
      is a genuinely informative, honestly-reported outcome and not a
      way to avoid computing an inconvenient number; (e) check for any
      other reused element (beyond C-NULL-LABEL) whose
      failure_consequence is named in the decision rule but whose
      comparison logic might likewise be unimplemented -- GD-9's own
      standing repair requires this be checked now that it is known to
      be possible, not assumed absent elsewhere just because it was
      found once.
  inputs:
    reanalysis_scope: >-
      THIS AMENDMENT OPERATES ENTIRELY ON RUN-SSIQ-a85692-b's ALREADY-
      COMMITTED raw-result.json (experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/raw-result.json,
      snapshot commit 06af9596). No new delta_E search, no new Phi_ell
      verification, no new graph construction, no new Phase -1 real-time
      execution, and no new C-SEARCH-BIAS run are performed -- those
      remain exactly as BATCH-005 computed and independently verified
      them (EV-SSIQ-f3ce32 O-1/O-2/O-3). This amendment reads
      descent_metrics.per_prime (real arm: N, greedy_median,
      random_median, greedy_trapped_fraction per prime) and
      c_null_label.per_prime (shuffled-label arm: greedy_median,
      random_median, greedy_trapped_fraction per prime, or a skip reason
      for prime 8893's partial coverage) directly from that file.
    trapped_exclusion_filter_v3: >-
      GD-8's fix. PER-PRIME-TRAPPED-EXCLUSION per v1's own M-GAMMA-GREEDY
      definition text ("same trapped_fraction reporting and exclusion
      threshold"): for the real arm, exclude any prime with
      descent_metrics.per_prime[p].greedy_trapped_fraction > 0.5 from the
      OLS fit input; for the null arm, apply the IDENTICAL threshold to
      c_null_label.per_prime[p].greedy_trapped_fraction (both arms share
      the same underlying graph and greedy-descent dynamics, so the same
      filter governs both -- a prime whose real-labelled descent gets
      trapped pervasively will trap the shuffled-labelled descent on the
      identical graph too, for a reason unrelated to which arm's labels
      are used). Recompute the surviving prime set ONCE, applied
      identically to both arms, before either OLS fit runs. THE THRESHOLD
      (0.5) IS NOT NEW: it is v1's own inherited text, unchanged, applied
      here for the first time to real data. WORKED CHECK (not itself part
      of the frozen rule, a sanity check for the pre-freeze reviewer):
      applying this filter to RUN-SSIQ-a85692-b's own already-committed
      numbers (trapped_fraction 0.8374, 0.7222, 0.8201, 0.8511 for primes
      2437, 3889, 5737, 7333 respectively) excludes ALL FOUR -- zero
      primes survive. This is expected, disclosed, and handled by
      decision_rule_v3 below, not silently avoided.
    c_null_label_comparison_v3: >-
      GD-9's fix. IF (and only if) trapped_exclusion_filter_v3 leaves >=3
      primes surviving in the null arm (ols_loglog_fit's own minimum,
      imported unchanged from experiments/EXP-SSIQ-58b642/implementation/descent_hitting_time.py):
      fit gamma_null_greedy and gamma_null_random via the IDENTICAL
      ols_loglog_fit function the real arm already uses (imported by
      reference, not reimplemented), on the surviving primes' N values
      (from descent_metrics.per_prime, unchanged) against
      c_null_label.per_prime[p].greedy_median and .random_median.
      Compute m_gap_null = gamma_null_random - gamma_null_greedy.
      Bootstrap its 95% CI via the IDENTICAL bootstrap_gap_ci function
      (same n_boot=2000, same PRIMES-as-resampling-unit design), reusing
      the SAME rng seed convention this experiment already pins
      (replication.seeds, unchanged). PRE-REGISTERED COMPARISON RULE,
      STATED BEFORE THIS DOCUMENT'S DRAFTER LOOKED AT
      RUN-SSIQ-a85692-b's null_by_prime numbers in any detail beyond
      what BATCH-005's own committed artifacts already disclosed:
      c_null_label_control_failure = True IF the null arm's 95%
      bootstrap CI for m_gap_null ALSO excludes 0 in the POSITIVE
      direction (i.e. the shuffled, uninformative label multiset
      produces the SAME "detected"-shaped statistical separation the
      real arm's own preregistered_prediction.decision_rule_frozen_before_data
      would call DETECTED) -- mirroring the real arm's own detection
      criterion exactly, on the theory that a null-object control which
      reproduces the real arm's detection signature under a broken
      correspondence between label and vertex indicates the separation
      is a property of the GRAPH/DESCENT DYNAMICS, not of genuine delta_E
      information, which is precisely what a null-object control exists
      to catch (docs/inventor-protocol.md section 3). If the null CI
      does NOT exclude 0 in the positive direction (includes 0, or
      excludes it in the negative direction), c_null_label_control_failure
      = False. IF trapped_exclusion_filter_v3 leaves fewer than 3 primes
      in the null arm, c_null_label_comparison_v3 CANNOT RUN (ols_loglog_fit
      requires n>=3) and c_null_label_control_failure is reported as
      NOT-EVALUABLE, distinct from both True and False -- this is itself
      informative and must not be silently defaulted to either boolean.
  decision_rule_v3: >-
    REPLACES v1/v2's decision_rule_frozen_before_data's Phase -1 gate
    check for THIS re-analysis with a NEW, PRIOR gate specific to the
    corrected filter (the Phase -1 gate itself, M-COVERAGE>=0.5 on >=4
    primes, is UNCHANGED and was already passed in RUN-SSIQ-a85692-b --
    this amendment does not reopen it). NEW GATE, CHECKED FIRST: if
    trapped_exclusion_filter_v3 leaves FEWER THAN 4 primes surviving in
    the real arm (the same >=4-prime floor v1's stopping_rules already
    uses elsewhere, applied here to the corrected filter), the run
    reports DATA-UNAVAILABLE/BLOCKED for lack of coverage under the
    corrected trapped-vertex filter -- distinct in its stated reason
    from every other DATA-UNAVAILABLE/BLOCKED instance this campaign has
    recorded (WISDE unavailability in BATCH-003; budget-formula
    exhaustion in BATCH-004), and itself a genuine, informative result:
    it would show that greedy descent gets trapped pervasively at N in
    [203, 611] on these graphs REGARDLESS of delta_E-labelling quality --
    a property of graph SIZE, not of the labelling instrument, per
    H-SSIQ-36e970's mechanism section. If >=4 primes DO survive: recompute
    gamma_greedy/gamma_random/m_gap on exactly the surviving subset (the
    SAME ols_loglog_fit/bootstrap_gap_ci functions, unchanged), then
    apply v1/v2's UNCHANGED decision rule ordering (Phase 0 already
    passed -> Phase -1 gate already passed -> control-failure check, now
    including c_null_label_control_failure computed for real for the
    first time, alongside the already-computed C-SEARCH-BIAS flag -> CI
    sign) to determine DETECTED / UNRESOLVED-BY-THIS-TEST /
    CONTROL-FAILURE-VOID.
  invalidation_rules_v3_additions:
    - >-
      NEW (this amendment only). trapped_exclusion_filter_v3 leaves fewer
      than 4 primes in the real arm -- report DATA-UNAVAILABLE/BLOCKED
      for lack of coverage under the corrected filter (see
      decision_rule_v3), not INCONCLUSIVE and not a bare VOID.
    - >-
      NEW. c_null_label_comparison_v3 cannot run because fewer than 3
      primes survive in the null arm (ols_loglog_fit's own minimum) --
      report c_null_label_control_failure as NOT-EVALUABLE explicitly;
      do not default it to False (which would silently disable the
      control this amendment exists to fix) or to True (which would
      fabricate a control failure with no computation behind it).
    - >-
      All of v1/v2's invalidation_rules are inherited unchanged and
      continue to apply -- not restated here.
  required_artifacts:
    - runs/RUN-SSIQ-a85692-c/manifest.yaml
    - runs/RUN-SSIQ-a85692-c/raw-result.json
    - runs/RUN-SSIQ-a85692-c/execution_report.yaml
