# outcome_scope_label_glossary -- is REUSED UNCHANGED and NOT restated in
# full below. This amendment must go through its own pre-freeze Red Team
# review before freeze, per GD-9's standing repair: the reviewer verifies
# by direct code reading that the comparison rules below are ACTUALLY
# IMPLEMENTED as pre-registered, not merely described in prose, before this
