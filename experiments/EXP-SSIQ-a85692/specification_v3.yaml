    parameter with either True or False. Instead, BYPASS
    apply_decision_rule entirely for that branch and report the
    terminal outcome as UNRESOLVED-BY-THIS-TEST directly -- never
    DETECTED -- on the same non-improvisation principle this campaign
    already applies elsewhere: a control that could not be evaluated
    cannot license a positive claim, so the absence of its protection is
    treated the same way a genuine ambiguous/uncertain result is treated
    (v1's PF-7 fix), not silently treated as if the control had passed.
    This rule is stated here, before any run exercises it, so a future
    Executor cannot choose an interpretation mid-run.
