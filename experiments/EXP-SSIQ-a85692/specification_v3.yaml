    corrected trapped-vertex filter -- distinct in its stated reason
    from every other DATA-UNAVAILABLE/BLOCKED instance this campaign has
    recorded (WISDE unavailability in BATCH-003; budget-formula
    exhaustion in BATCH-004), and itself a genuine, informative result:
