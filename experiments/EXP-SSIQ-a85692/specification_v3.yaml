      the same underlying graph and greedy-descent dynamics, so the same
      filter governs both -- a prime whose real-labelled descent gets
      trapped pervasively will trap the shuffled-labelled descent on the
      identical graph too, for a reason unrelated to which arm's labels
      are used). Recompute the surviving prime set ONCE, applied
      identically to both arms, before either OLS fit runs. THE THRESHOLD
      (0.5) IS NOT NEW: it is v1's own inherited text, unchanged, applied
      here for the first time to real data. WORKED CHECK (not itself part
      of the frozen rule, a sanity check for the pre-freeze reviewer),
      PF-3 FIX APPLIED -- BOTH ARMS STATED, not the real arm alone:
      applying this filter to RUN-SSIQ-a85692-b's own already-committed
      numbers excludes ALL FOUR primes in the REAL arm (trapped_fraction
      0.8374, 0.7222, 0.8201, 0.8511, range [0.7222, 0.8511], for primes
      2437, 3889, 5737, 7333 respectively) AND ALL FOUR primes in the
      NULL arm (trapped_fraction 0.8079, 0.7037, 0.7908, 0.8478, range
      [0.7037, 0.8478], same four primes) -- zero primes survive in
      EITHER arm. This is expected, disclosed, and handled by
      decision_rule_v3 below, not silently avoided. IT ALSO MEANS (PF-1
      FIX APPLIED, see evidentiary_limitation_disclosure_v3 below):
      c_null_label_comparison_v3's fit-and-bootstrap branch cannot be
      exercised by this dispatch's real data at all, since the null
      arm's own survivor count (0) is below its own >=3 minimum.
    c_null_label_comparison_v3: >-
      GD-9's fix. IF (and only if) trapped_exclusion_filter_v3 leaves >=3
      primes surviving in the null arm (ols_loglog_fit's own minimum,
      imported unchanged from experiments/EXP-SSIQ-58b642/implementation/descent_hitting_time.py):
      fit gamma_null_greedy and gamma_null_random via the IDENTICAL
      ols_loglog_fit function the real arm already uses (imported by
      reference, not reimplemented), on the surviving primes' N values
      (from descent_metrics.per_prime, unchanged) against
      c_null_label.per_prime[p].greedy_median and .random_median.
      Compute m_gap_null = gamma_null_random - gamma_null_greedy.
      Bootstrap its 95% CI via the IDENTICAL bootstrap_gap_ci function
      (same n_boot=2000, same PRIMES-as-resampling-unit design), reusing
      the SAME rng seed convention this experiment already pins
      (replication.seeds, unchanged). PRE-REGISTERED COMPARISON RULE,
      STATED BEFORE THIS DOCUMENT'S DRAFTER LOOKED AT
      RUN-SSIQ-a85692-b's null_by_prime numbers in any detail beyond
      what BATCH-005's own committed artifacts already disclosed:
      c_null_label_control_failure = True IF the null arm's 95%
      bootstrap CI for m_gap_null ALSO excludes 0 in the POSITIVE
      direction (i.e. the shuffled, uninformative label multiset
      produces the SAME "detected"-shaped statistical separation the
      real arm's own preregistered_prediction.decision_rule_frozen_before_data
      would call DETECTED) -- mirroring the real arm's own detection
      criterion exactly, on the theory that a null-object control which
      reproduces the real arm's detection signature under a broken
      correspondence between label and vertex indicates the separation
      is a property of the GRAPH/DESCENT DYNAMICS, not of genuine delta_E
      information, which is precisely what a null-object control exists
      to catch (docs/inventor-protocol.md section 3). If the null CI
      does NOT exclude 0 in the positive direction (includes 0, or
      excludes it in the negative direction), c_null_label_control_failure
      = False. IF trapped_exclusion_filter_v3 leaves fewer than 3 primes
      in the null arm, c_null_label_comparison_v3 CANNOT RUN (ols_loglog_fit
      requires n>=3) and c_null_label_control_failure is reported as
      NOT-EVALUABLE, distinct from both True and False -- this is itself
      informative and must not be silently defaulted to either boolean.
    evidentiary_limitation_disclosure_v3: >-
      PF-1 FIX APPLIED (RT-PREFREEZE-EXP-SSIQ-a85692-v3.md, BLOCKING
