    findings_applied: [PF-1, PF-2, PF-3, PF-4, PF-5, PF-6, PF-7, PF-8, PF-10, PF-11, PF-12, PF-13]
    pf1_summary: >-
      BLOCKING (round 1). PART B's original "empty basin -> basin_size==1,
      its own start" convention is FALSE for every delta_E=1 structural
      local minimum: greedy_descent_hitting_time_v2's inherited top-level
      short-circuit (delta_map[start]==1 => trapped=False, unconditionally)
      means these vertices can never receive a trapped=True walk from any
      start including themselves, so their true basin is always empty (size
      0), not 1 -- guaranteeing the REQUIRED ACCOUNTING ASSERTION would fail
      by exactly the F_p-rational locus size on every prime, every run, as
      originally specified. Fixed by defining "basin-eligible local minima"
      = {m : is_structural_local_min(m) AND delta_map[m] > 1}, excluding
      delta_E=1 vertices from the basin set entirely (they are not genuine
      trapping destinations by construction) rather than special-casing an
      "empty basin" that can no longer occur for the remaining set (every
      basin-eligible m has itself in its own basin by construction, so
      basin_size(m) >= 1 always, with no special case needed).
    pf2_summary: >-
      BLOCKING (round 1). The original "REUSED, not reimplemented"
      instruction for is_structural_local_min named a symbol confirmed not
      to exist as an importable unit in trapping_diagnostic_v5.py (it is six
      inline lines inside run_diagnostic_for_prime, whose own returned dict
      never exposes per-vertex flags). Fixed by an explicit, disclosed
      split: build_graph_for_prime and load_archived_prime_data are
      GENUINELY IMPORTED (both confirmed standalone module-level functions),
      while is_structural_local_min, the coverage assertion, and the
      graph-rebuild verification are AUTHORIZED, DISCLOSED DUPLICATES of
      trapping_diagnostic_v5.py's own inline logic -- the same exception
      v5's own PF-1 fix already established for bootstrap_gap_ci_v2.
    pf3_summary: >-
      BLOCKING (round 1). PART A's "halt with an explicit error... on ANY
      disagreement" (global) and PART B's "must not run for that prime"
      (per-prime) described the same failure event two incompatible ways.
      Fixed by stating explicitly that the trapped=True-vs-
      is_structural_local_min(terminal) comparison is a PER-PRIME boolean
      (crosscheck_pass) that never aborts the process, matching
      trapping_diagnostic_v5.py's own ACTUAL executed behavior in
      RUN-SSIQ-a85692-e (which also did not literally halt on disagreement,
      despite its own frozen spec text saying it would) rather than that
      file's contradictory spec-text language.
    pf4_summary: >-
      ADVISORY (round 1), applied. The REQUIRED EQUIVALENCE REGRESSION now
      explicitly requires the >=3 constructed inputs to collectively
      exercise all three of greedy_descent_hitting_time_v2's return
      branches (immediate delta_E==1, trapped=True, trapped=False-via-steps),
      not merely reach 3 total cases.
    pf5_summary: >-
      ADVISORY (round 1), applied. depth(m)'s description corrected from
      "well-defined and positive" (self-contradictory alongside "depth==0 is
      legitimate") to "provably NON-NEGATIVE."
    pf6_summary: >-
      ADVISORY (round 1), applied. The top-decile boundary is now an
      explicit, deterministic formula: k = max(1, ceil(0.1 *
      n_basin_eligible)) local minima, never silently resolving to zero for
      a small basin-eligible set. Re-verified round 2 against the real
      basin-eligible counts these four primes will produce (86/114/176/270)
      -- well-defined throughout, no boundary case triggered.
    pf7_summary: >-
      BLOCKING, NEW (round 2). PART B's own REQUIRED ACCOUNTING ASSERTION,
      written to fix PF-3, reintroduced PF-3's exact global-vs-per-prime
      ambiguity one level deeper: "a GLOBAL, run-aborting check for that
      prime's computation" named two incompatible scopes in one phrase.
      Fixed by stating explicitly that a mismatch halts ONLY that prime's
      PART B computation, using the same per-prime isolation
      crosscheck_pass gating already requires -- never global/run-aborting,
      and the other three primes' results are computed and written
      normally.
    pf8_summary: >-
      BLOCKING, NEW (round 2). The accounting assertion's own "traced by
      hand" illustrative numbers (n_trapped_false==9, sum(basin)==194 for
      p=2437) were FALSE, confirmed by direct query against RUN-SSIQ-a85692-b's
      archived descent_metrics.per_prime[p].greedy_trapped_fraction, and
      falsely attributed to "the round-1 reviewer's own trace" (round 1
      never made this claim -- it cited 9/18/18/17 only as the OLD, broken
      scheme's overcount magnitude, a different quantity). Fixed with the
      correct values for all four primes, computed directly from already-
      archived data: p=2437 n_trapped_false=33/sum=170; p=3889
      n_trapped_false=90/sum=234; p=5737 n_trapped_false=86/sum=392; p=7333
      n_trapped_false=91/sum=520.
    pf10_summary: >-
      ADVISORY (round 2), applied. The is_structural_local_min disclosed
      duplicate now also restates the source formula's missing-neighbour
      loud-raise guard, for completeness, though structurally unreachable
      given the required coverage assertion.
    pf11_summary: >-
      ADVISORY (round 2), applied. The top-decile concentration now
      specifies null-with-a-note (never a division by zero) for the
      theoretical n_basin_eligible==0 case, not reachable by any of this
      amendment's four primes.
    pf12_summary: >-
      ADVISORY, NEW (round 3), applied. PF-7's fix correctly specified the
      required BEHAVIOR but its own justifying parenthetical ("the SAME
      per-prime isolation mechanism... necessarily wraps... the identical
