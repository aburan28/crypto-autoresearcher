  amends: EXP-SSIQ-a85692 (version 5, specification_v5.yaml, frozen 59cfaf39ea721780b4cddf3d7ac5968a70872b15)
  amendment_scope: >-
    PART A fixes GD-12 (EV-SSIQ-334ab9, DEC-20260806-357b30 D-2/D-3):
    descent_hitting_time.py is EXP-SSIQ-58b642's own frozen artifact and
    stays byte-for-byte UNTOUCHED (AGENTS.md immutability). A NEW module,
    experiments/EXP-SSIQ-a85692/implementation/descent_walk_hardened.py,
    defines greedy_descent_hitting_time_v2: identical to
    dht.greedy_descent_hitting_time's walk logic in every branch, except
    every returned dict additionally carries "terminal_vertex": the value
    of `current` at the moment of return (start itself, unmoved, in the
    delta_E==1 immediate-identity branch; the trapped vertex in the
    trapped=True branch; the delta_E==1 vertex reached by descent in the
    trapped=False/steps>0 branch). This is a pure superset of the
    original's return value -- hitting_time/trapped/steps/tie_events/
    steps_with_choice are computed by the IDENTICAL walk logic and must be
    bit-identical to dht.greedy_descent_hitting_time's own output on every
    input, which is a REQUIRED regression control (gd12_fix_v6.equivalence
    below), not merely a stated intention.
    The frozen v5 contract's required cross-check compared
    dht.greedy_descent_hitting_time's "trapped" flag against
    is_structural_local_min(START) for EVERY vertex, unconditionally. Both
    BATCH-008 reviewers independently confirmed (Validator: re-tracing the
    Executor's own p=2437/(148,37) example; Red Team: an independent
    p=3889 counter-example) that this is the wrong vertex whenever start is
    not itself a local minimum -- PF-6's underlying mathematical argument
    (round 1 of v5's own pre-freeze review) is correct for the walk's
    TERMINAL vertex, never exposed by the frozen function's return value.
    THIS AMENDMENT'S OWN CORRECTED CLAIM, stated explicitly and traced
    below (gd12_fix_v6.corrected_equivalence_proof) rather than asserted as
    round 1's prose was: for every walk with trapped=True, the walk's own
    non-backtracking exclusion NEVER removes a genuine smaller-delta
    candidate (dht's own docstring: a strict-descent walk's predecessor
    always has STRICTLY GREATER delta than the current vertex, so it can
    never itself be a smaller-delta candidate) -- so a trapped=True walk's
    terminal vertex has no neighbour, among its FULL neighbour set
    including the excluded predecessor, with strictly smaller delta. That
    IS exactly is_structural_local_min(terminal) by definition. This holds
    UNCONDITIONALLY for trapped=True walks and is NOT claimed for
    trapped=False walks (the delta_E=1 immediate-identity case): there,
    terminal==start and delta_map[terminal]==1, which trivially satisfies
    is_structural_local_min (1 is the global minimum of a positive-integer-
    valued delta_E) regardless of whether the walk was meaningfully
    "trapped" in the interesting sense -- comparing trapped=False against
    is_structural_local_min(terminal)=True-by-triviality is exactly the
    SECOND, independent boundary-condition defect the Red Team found in
    BATCH-008 (RT-BATCH-008.md), and would newly misclassify every
    successful walk (15-28% of vertices per prime, per that report) as a
    disagreement under a naive terminal-vertex-only fix. THE CORRECTED
    CROSS-CHECK THEREFORE COMPARES ONLY trapped=True WALKS, explicitly
    EXCLUDING trapped=False (delta_E=1 success) walks from the equivalence
    claim entirely -- reported and counted separately, never silently
    dropped from the accounting.
    PART B, DEPENDENT ON PART A: for the same four primes as v5's diagnostic
    (2437, 3889, 5737, 7333; already-archived full delta_map coverage), run
    greedy_descent_hitting_time_v2 from EVERY vertex (not the frozen
    dht.greedy_descent_hitting_time, since only the v2 function exposes
    terminal_vertex) and, for every trapped=True walk, assign that START
    vertex to the BASIN of its terminal_vertex (a structural local minimum,
    by PART A's corrected proof). Compute, per prime: the basin-size
    distribution over the set of structural local minima (independently
    computed exactly as v5's trapping_diagnostic_v5.py already does, REUSED
    UNCHANGED as a library import, not re-implemented) -- is capture
    concentrated on a small number of "deep" local minima (a funnel/hub
    structure) or spread near-uniformly across all local minima? Reports
    max basin size, the top-decile concentration (fraction of all
    trapped=True walks captured by the top 10% of local minima by basin
    size), and the correlation between a local minimum's basin size and its
    own "depth" (the gap between its delta_E value and its smallest
    neighbour's delta_E among non-local-minimum neighbours it could have
    been reached from -- operationalized precisely in
    funnel_structure_diagnostic_v6 below, not left to the Executor to
    invent). This is NEW analysis (no prior batch computed a basin
    assignment), but at ZERO NEW SEARCH COST: no new delta_E computation,
    reusing the already-archived delta_map and the same pinned-seed graph
    rebuild v5 already established.
    Everything else in v1-v5 (B=23/X=23, the delta_E instrument, every
    budget-allocation formula, trapped_exclusion_filter_v3,
    c_null_label_comparison_v3, the decision rule, every control, GD-11's
    fix in ols_hardened.py) is REUSED UNCHANGED and NOT reopened, restated,
    or re-run.
