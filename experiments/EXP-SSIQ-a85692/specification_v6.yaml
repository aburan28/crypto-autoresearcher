  version: 6
  title: >-
    (A) Fix GD-12: expose the greedy walk's terminal vertex and correct the
    trapped-vs-structural cross-check, and (B) diagnose funnel structure --
    which structural local minima capture the most walks (BATCH-009)
  status: approved
