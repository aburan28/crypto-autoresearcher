      comparisons, but does not modify either.
    New run id RUN-SSIQ-a85692-j (a single run producing all three sweep
    points' results in one execution and one artifact set). The
    Executor's own execution_report.yaml must confirm this diff list
    against the code it actually wrote/ran, and report any discrepancy
    honestly rather than silently reconciling it.
  budget:
    wall_clock_seconds_per_run: 1200
    total_cpu_hours: 0.4
    maximum_memory_gb: 2
    maximum_runs: 1
    note: >-
      NOT ZERO NEW SEARCH COST. Worst-case total search time across all
      three sweep points (194 vertices * (0.6+0.8+1.0) seconds/vertex, if
      every single vertex at every single budget consumed its full
      allotment without resolving) is 465.6 seconds; this amendment's
      1200s/0.4 CPU-hour total budget is ~2.58x that worst-case bound,
      generous margin for graph-rebuild overhead (once, not three times),
      per-vertex bookkeeping, and the new histogram/conjugate-pair
      reporting logic, while remaining bounded and pre-registered, not
      open-ended. This is larger than v9's own single-point 600s budget
      (proportionate to running three sweep points instead of one) but
      remains far smaller than v8's own 3600s budget for a single
      full-coverage 15.0s-per-vertex run.
  frozen_at: null
  freeze_note: null
