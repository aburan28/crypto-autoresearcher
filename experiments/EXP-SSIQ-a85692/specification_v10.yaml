# DRAFT PROTOCOL AMENDMENT, NOT YET FROZEN. Supersedes specification_v9.yaml
# (v9, frozen d729af05328f7e40fe466f4e4d473298e246db8f, retained unedited)
# on the ranked resume action DEC-20260806-f96efd recorded at BATCH-012's
# close: item (1), a follow-up truncation-mutation run at an intermediate
# per-vertex budget, both post-execution reviewers' own converging
# recommendation (VAL-BATCH-012, RT-BATCH-012 "Required controls"/
# "Counterexample or mutation").
#
# PURPOSE: RT-BATCH-012 showed v9's own 0.5s-budget probe was too severe to
# test what it was built to test -- every one of 194 non-F_p-rational
# vertices timed out, and the 8 that still resolved a collision were a
# mechanism-traced, extreme-value, internally-correlated sample (4 exact
# Frobenius-conjugate pairs, all at the smallest achievable delta_E value,
# 17.5% of the true population) essentially immune to the truncation effect
# under test. This amendment runs a THREE-POINT SWEEP of intermediate
# per-vertex budgets -- 0.6s, 0.8s, 1.0s -- chosen to sit strictly between
# v9's 0.5s (shown too severe) and RUN-SSIQ-a85692-h's own observed minimum
# full, non-truncated two-sided completion time (1.14993s, this
# Coordinator's own independent re-derivation from RUN-SSIQ-a85692-h's
# archived per_vertex_records, confirming RT-BATCH-012's identical figure).
# Every one of the three budgets stays below that floor, so EVERY vertex is
# still guaranteed to be genuinely truncated on at least one table-build
# half at every sweep point (preserving RT-BATCH-011's own falsification
# design, which specification_v8.yaml's 15.0s budget failed to exercise at
# all) -- while giving the best-first search progressively more room to
# reach deeper (higher-delta_E) collisions before each cutoff, directly
# testing RT-BATCH-012's own falsifiable prediction: does the resolved-value
# distribution shift toward the true population mix (more delta_E=3,
# delta_E=4, etc.) as budget grows from 0.5s through 0.6s/0.8s/1.0s?
#
# THIS AMENDMENT REQUIRES NEW delta_E SEARCH COMPUTATION, sized and
# justified explicitly below. Campaign_budget.maximum_batches is uncapped
# as of this batch (user direction, "No budget constraints," recorded in
# ledger/goals/GOAL-SSIQ-001/goal.yaml) -- this does NOT waive this
# amendment's own per-run budget discipline, which remains bounded and
# pre-registered exactly as every prior amendment's has been.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 10
  title: >-
    Intermediate-budget truncation sweep (0.6s/0.8s/1.0s): does the
    resolved-value distribution shift toward the true population mix as
    per-vertex budget grows from v9's too-severe 0.5s toward the observed
    1.14993s natural-completion floor, testing RT-BATCH-012's own
    falsifiable prediction? (BATCH-013)
  status: draft
  approved_by: null
  amends: EXP-SSIQ-a85692 (version 9, specification_v9.yaml, frozen d729af05328f7e40fe466f4e4d473298e246db8f)
  amendment_scope: >-
    THREE INDEPENDENT PART-A-ONLY RUNS (no PART B, same reasoning as v9:
    a partial-coverage delta_map has no principled domain for
    depth0_fraction), against the SAME prime and SAME rebuilt graph every
    amendment since v5 has used, p=2437, via
    trapping_diagnostic_v5.build_graph_for_prime(2437, 20260805). PER SWEEP
    POINT b in [0.6, 0.8, 1.0] (seconds): (1) rebuild the graph (IMPORTED
    UNCHANGED); re-run the two-part graph-identity verification via
    delta_e_independent_rng_probe_v8.verify_graph_identity (GENUINELY
    IMPORTED, UNCHANGED, exactly as v9 did) BEFORE any delta_E search
    begins for that sweep point; (2) wire all 9 F_p-rational vertices to
    new_delta_map[v]=1 unconditionally BEFORE the search loop (IDENTICAL
    required construction step to v8/v9's own PF-9 fix); (3) for every
    non-F_p-rational vertex, construct a FRESH random.Random instance via
    delta_e_independent_rng_probe_v8.derive_per_vertex_seed (GENUINELY
    IMPORTED, UNCHANGED, IDENTICAL BASE_SEED=20260811 v8/v9 both used --
    the SAME deliberate design choice v9 made, extended across all three
    sweep points: holding the per-vertex RNG stream IDENTICAL across v8,
    v9, and every point in this sweep isolates budget as the ONLY
    manipulated variable throughout this entire lineage, not merely within
    one run) and call compute_delta_e.two_sided_search with
    time_budget_seconds=b, a FIXED constant per sweep point (never a
    function of elapsed/remaining time, and never shared across sweep
    points -- each of the three runs is fully independent, using the
    SAME per-vertex seeds but a DIFFERENT fixed budget); (4) record,
    per vertex, per sweep point: resolved (bool), delta_e_upper_bound
    (int or None), wall_seconds (float), timed_out (bool); (5) REQUIRED
    REPORTING per sweep point: n_resolved, n_timed_out, coverage_fraction
    (identical denominator convention to v8/v9: n_resolved / 194); (6)
    REQUIRED COMPARISON 1 per sweep point, against RUN-SSIQ-a85692-b's
    archived delta_map (via trapping_diagnostic_v5.load_archived_prime_data,
    GENUINELY IMPORTED, UNCHANGED, READ ONLY) -- IDENTICAL in structure to
    v9's own Comparison 1; (7) REQUIRED COMPARISON 2 per sweep point,
    against RUN-SSIQ-a85692-h's own new_delta_map (v8's non-truncated
    15.0s-budget probe) -- IDENTICAL in structure and parsing convention to
    v9's own Comparison 2 (load ONLY probe_delta_e_comparison.json, apply
    tuple(json.loads(key)) with the same collision check, PF-1's fix from
    v9's own round-1 pre-freeze review, reused here unchanged); (8)
    REQUIRED WRITE-ORDER / FAILURE-ISOLATION DISCIPLINE, IDENTICAL to v9's
    own PF-5 fix, extended across all three sweep points independently:
    each sweep point's own PART A result and Comparison 1 result MUST be
    captured before that sweep point's Comparison 2 is attempted, and each
    sweep point's Comparison 2 code MUST be wrapped so any exception
    becomes a recorded comparison_2_error field for THAT sweep point only,
    never discarding any other sweep point's already-computed results --
    the three sweep points are fully independent in both computation and
    failure isolation, so a failure at one budget must never affect the
    other two.
    REQUIRED CROSS-SWEEP REPORTING (the genuinely new analysis this
    amendment adds beyond a mechanical repeat of v9 three times): for
    each sweep point, report the FULL delta_e_upper_bound VALUE HISTOGRAM
    of its own resolved non-F_p-rational vertices (not merely
    n_resolved), and compare that histogram's shape against
    RUN-SSIQ-a85692-b's own true archived population histogram over the
    same 194-vertex domain (delta_E=2: 34/194=17.5%, delta_E=3:
    70/194=36.1% the modal value, delta_E>=4: 90/194=46.4% -- this
    Coordinator's own independently-reproduced figures, matching
    RT-BATCH-012's identical histogram exactly). This directly tests
    RT-BATCH-012's own falsifiable prediction (Front 2(b)/"Counterexample
    or mutation"): if the resolved-value distribution remains dominated
    by delta_E=2 far out of proportion to its 17.5% population share EVEN
    AT b=1.0 (the sweep's most generous point, still below the 1.14993s
    natural-completion floor), that is a genuinely surprising result the
    best-first-search selection-effect mechanism does NOT predict, worth
    flagging explicitly rather than assumed away; if it shifts toward the
    true population mix as b grows, that CONFIRMS the traced mechanism
    and, separately, whether the confirmed shift also breaks v9's own
    Frobenius-conjugate-pairing degeneracy (are the resolved sets at
    higher budgets still exclusively conjugate pairs, or does that
    correlation weaken too) MUST be reported explicitly, using the
    IDENTICAL frobenius(x)=(a, p-b) check RT-BATCH-012 applied
    (build_isogeny_graph.py's own frobenius function, GENUINELY IMPORTED,
    UNCHANGED) -- never silently omitted, since RT-BATCH-012 named this
    as a SEPARATE, compounding limitation from the value-extremity bias,
    not merely a restatement of it.
    BUDGET JUSTIFICATION (REQUIRED, since this is NOT zero new search
    cost): worst case per sweep point b, if EVERY one of 194 vertices
    consumes its FULL budget without resolving, total search time for
    that point is 194*b. At b=1.0 (the largest sweep point), worst case
    is 194.0s; summed across all three points (0.6+0.8+1.0=2.4s/vertex
    aggregate), the worst-case TOTAL search time across the entire sweep
    is 194*2.4 = 465.6 seconds. Graph reconstruction runs three times
    (once per sweep point, ~1-2s each per every prior amendment's own
    measured figures) and is negligible against this bound.
  pre_freeze_review:
    status: pending
    report: null
    verdict: null
    findings_applied: []
  inputs:
    truncation_sweep_search_v10: >-
      THREE INDEPENDENT PART-A-ONLY RUNS (see amendment_scope for full
      procedure). A new module, delta_e_truncation_sweep_v10.py, defines
      run_truncation_probe_for_budget(graph, base_seed, per_vertex_budget_seconds)
      -- a GENERALIZED version of v9's own run_truncation_probe_v9, taking
      per_vertex_budget_seconds as an explicit PARAMETER rather than a
      module constant (this is the one genuine code change relative to
      v9's own design: v9's own PER_VERTEX_BUDGET_SECONDS was a fixed
      module-level constant, not reusable across multiple budget values
      in one run without either three separate frozen amendments or this
      generalization -- disclosed here explicitly, not silently
      introduced). SWEEP_BUDGETS = [0.6, 0.8, 1.0] is a FIXED, PRE-
      REGISTERED list (never computed or adjusted at runtime). For each
      b in SWEEP_BUDGETS, in order, call
      run_truncation_probe_for_budget(graph, BASE_SEED=20260811, b),
      producing that sweep point's own independent new_delta_map,
      coverage figures, and per_vertex_records. The graph is rebuilt ONCE
      and its identity re-verified ONCE at the start (not once per sweep
      point -- IDENTICAL graph object reused across all three sweep
      points, since it does not depend on the budget and rebuilding it
      three times would add cost with no diagnostic value); the identity
      re-verification result is reported once and applies to all three
      sweep points.
      REQUIRED COMPARISONS (per sweep point, both Comparison 1 against
      RUN-SSIQ-a85692-b's archived delta_map and Comparison 2 against
      RUN-SSIQ-a85692-h's own new_delta_map, IDENTICAL structure and
      parsing convention to v9's own Comparisons 1/2, GENUINELY IMPORTED
      where v9's own helper functions are reusable: trapping_diagnostic_v5.
      load_archived_prime_data for Comparison 1; a small parsing helper
      for Comparison 2 IDENTICAL to v9's own parse_v8_new_delta_map,
      either genuinely imported from delta_e_truncation_probe_v9.py if
      its function signature permits reuse without modification, or
      restated as an authorized disclosed duplicate if v9's own function
      is too tightly coupled to its module-level constants to import
      cleanly -- the Executor's own execution_report.yaml must state
      which approach was taken and why).
      REQUIRED VALUE HISTOGRAM AND CONJUGATE-PAIR REPORTING (per sweep
      point, the genuinely new cross-sweep analysis): for each sweep
      point's own resolved non-F_p-rational vertices, report the full
      delta_e_upper_bound value histogram (a dict from value to count),
      and report whether the resolved set's vertices form exact
      Frobenius-conjugate pairs (using build_isogeny_graph.frobenius,
      GENUINELY IMPORTED, UNCHANGED) -- report n_resolved,
      n_conjugate_pairs_among_resolved, n_resolved_without_a_paired_
      partner_in_resolved_set (a vertex whose frobenius(v) is NOT itself
      in the resolved set this sweep point -- this is the concrete,
      falsifiable signal that the v9 pairing artifact is breaking down as
      budget grows, since a genuinely independent-in-outcome pair would
      not always resolve together).
      JSON SAFETY (PF-13's convention, inherited unchanged from v8/v9):
      every vertex-keyed artifact output uses the str(list(v))-keyed
      convention; a raw tuple is never written directly as a JSON dict
      key.
      OBJECTIVE_BOUNDARY: this remains a DESCRIPTIVE DIAGNOSTIC CONTROL,
      not a claim. It does not test H-SSIQ-36e970's real-arm prediction,
      does not gate any decision rule, and does not itself constitute
      evidence for or against a computable delta_E-gradient or a p^{1/4}
      algorithm. It does not produce a PERSISTS/WEAKENS label. Scoped to
      p=2437 ONLY; no claim about the other three primes or any scale
      beyond this toy instance. A shift in the resolved-value distribution
      toward the true population mix, if observed, licenses treating an
      appropriately-sized intermediate budget as a valid instrument for
      RT-BATCH-011's own truncation-boundary question in a FUTURE
      amendment -- it does not itself answer that question, since even
      the b=1.0 sweep point remains below the 1.14993s full-completion
      floor and therefore still forces truncation on every vertex.
