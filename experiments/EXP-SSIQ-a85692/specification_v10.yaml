  required_artifacts_note: >-
    EXPLICIT, CODE-VERIFIED FUNCTION-LEVEL DIFF, per GD-9/GD-10's standing
    repair:
      NEW: experiments/EXP-SSIQ-a85692/implementation/delta_e_truncation_sweep_v10.py
