# DRAFT PROTOCOL AMENDMENT, NOT YET FROZEN. Supersedes specification_v9.yaml
# (v9, frozen d729af05328f7e40fe466f4e4d473298e246db8f, retained unedited)
# on the ranked resume action DEC-20260806-f96efd recorded at BATCH-012's
# close: item (1), a follow-up truncation-mutation run at an intermediate
# per-vertex budget, both post-execution reviewers' own converging
# recommendation (VAL-BATCH-012, RT-BATCH-012 "Required controls"/
# "Counterexample or mutation").
#
# PURPOSE: RT-BATCH-012 showed v9's own 0.5s-budget probe was too severe to
# test what it was built to test -- every one of 194 non-F_p-rational
# vertices timed out, and the 8 that still resolved a collision were a
# mechanism-traced, extreme-value, internally-correlated sample (4 exact
# Frobenius-conjugate pairs, all at the smallest achievable delta_E value,
# 17.5% of the true population) essentially immune to the truncation effect
# under test. This amendment runs a THREE-POINT SWEEP of intermediate
# per-vertex budgets -- 0.6s, 0.8s, 1.0s -- chosen to sit strictly between
# v9's 0.5s (shown too severe) and RUN-SSIQ-a85692-h's own observed minimum
# full, non-truncated two-sided completion time (1.14993s, this
# Coordinator's own independent re-derivation from RUN-SSIQ-a85692-h's
# archived per_vertex_records, confirming RT-BATCH-012's identical figure).
# Every one of the three budgets stays below that floor, so EVERY vertex is
# still guaranteed to be genuinely truncated on at least one table-build
# half at every sweep point (preserving RT-BATCH-011's own falsification
# design, which specification_v8.yaml's 15.0s budget failed to exercise at
# all) -- while giving the best-first search progressively more room to
# reach deeper (higher-delta_E) collisions before each cutoff, directly
# testing RT-BATCH-012's own falsifiable prediction: does the resolved-value
# distribution shift toward the true population mix (more delta_E=3,
# delta_E=4, etc.) as budget grows from 0.5s through 0.6s/0.8s/1.0s?
#
# THIS AMENDMENT REQUIRES NEW delta_E SEARCH COMPUTATION, sized and
# justified explicitly below. Campaign_budget.maximum_batches is uncapped
# as of this batch (user direction, "No budget constraints," recorded in
# ledger/goals/GOAL-SSIQ-001/goal.yaml) -- this does NOT waive this
# amendment's own per-run budget discipline, which remains bounded and
# pre-registered exactly as every prior amendment's has been.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 10
  title: >-
    Intermediate-budget truncation sweep (0.6s/0.8s/1.0s): does the
    resolved-value distribution shift toward the true population mix as
    per-vertex budget grows from v9's too-severe 0.5s toward the observed
    1.14993s natural-completion floor, testing RT-BATCH-012's own
    falsifiable prediction? (BATCH-013)
  status: approved
  approved_by: coordinator
  amends: EXP-SSIQ-a85692 (version 9, specification_v9.yaml, frozen d729af05328f7e40fe466f4e4d473298e246db8f)
