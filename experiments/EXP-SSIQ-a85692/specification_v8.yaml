      compute_delta_e.X_LIST_BOUND; trapping_diagnostic_v5.
      build_graph_for_prime, trapping_diagnostic_v5.
      load_archived_prime_data; delta_e_permutation_null_control_v7.
      depth0_fraction, delta_e_permutation_null_control_v7.summary_stats.
      Does NOT import or call compute_delta_e.
      run_phase_minus1_on_confirmatory_set (the superseded orchestration
