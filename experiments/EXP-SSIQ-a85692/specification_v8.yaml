      UNCHANGED, NOT MODIFIED: descent_hitting_time.py, ols_hardened.py,
      trapping_diagnostic_v5.py, descent_walk_hardened.py,
      funnel_structure_diagnostic_v6.py, delta_e_permutation_null_control_v7.py,
      run_batch009.py, compute_delta_e.py (including its own
      run_phase_minus1_on_confirmatory_set, superseded by addition, never
      by edit), compute_delta_e_v2.py, reanalyze_v3.py,
      reanalyze_v4_selftest.py, build_isogeny_graph.py.
      NOT RE-RUN, READ ONLY: RUN-SSIQ-a85692-a through -g and every
      already-archived value stay exactly as committed; this amendment
      reads RUN-SSIQ-a85692-b's raw-result.json (delta_map for p=2437
      only, for the comparison in PART A) but does not modify it.
    New run id RUN-SSIQ-a85692-h. The Executor's own execution_report.yaml
    must confirm this diff list against the code it actually wrote/ran,
    and report any discrepancy rather than silently reconciling it.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1.0
    maximum_memory_gb: 2
    maximum_runs: 1
    note: >-
      NOT ZERO NEW SEARCH COST -- the first amendment since specification_v4.yaml
      to require new delta_E search. Sized against RUN-SSIQ-a85692-b's own
      measured wall_seconds_used=284.88 for a full 194-vertex search of
      the identical prime under the original (faster-terminating on
      average) procedure: this amendment's fixed 15s/vertex budget is
      ~10x the original's ~1.47s/vertex average, and its 3600s/1.0
      CPU-hour total budget is ~12.6x the original's own measured wall
      time, generous margin for RNG-design-driven variance while still
      bounded and pre-registered, not open-ended. Graph reconstruction
      (~1-2s per EXP-SSIQ-58b642's own measured figures for this
      prime's size) and the 1000-trial permutation control (PART B,
      ~1s per RT-BATCH-010's own measured 4-second/4000-trial baseline)
      are both negligible against the search budget.
  frozen_at: null
  freeze_note: null
