    - runs/RUN-SSIQ-a85692-h/probe_permutation_null_control.json
  required_artifacts_note: >-
    EXPLICIT, CODE-VERIFIED FUNCTION-LEVEL DIFF, per GD-9/GD-10's standing
    repair:
      NEW: experiments/EXP-SSIQ-a85692/implementation/delta_e_independent_rng_probe_v8.py
      -- defines derive_per_vertex_seed and
      run_probe_delta_e_search_v8 (PART A), and the PART B driver calling
