    discriminating power is therefore concentrated in the RNG-SHARING
    half of PF-6's confound, not the budget-shape half -- disclosed here
    explicitly rather than left for a reader to infer, and restated in
    the required PERSISTS/WEAKENS/AMBIGUOUS interpretation below.
    This amendment's FIXED per-vertex budget (15s, see
    inputs.probe_delta_e_search_v8 below) is ~10x the observed ~1.47s/
    vertex average, generous margin for RNG-design-driven variance in how
    quickly each vertex's smooth table finds a collision, while the total
    900s/0.3 CPU-hour PER-RUN budget this experiment has used since v5 is
    increased for THIS amendment specifically to wall_clock_seconds_per_run:
    3600, total_cpu_hours: 1.0 (worst-case 194 vertices * 15s =
    2910s if every single vertex needed its full budget, which the
    original run's own measured behaviour makes implausible but which
    this amendment budgets for explicitly rather than assuming away --
    2910s leaves ~690s margin under the 3600s cap for graph-rebuild and
    permutation-control overhead, so the vertex-search loop alone cannot
    exhaust this amendment's own cap by construction).
    OPERATIONAL RISK, PF-3 FIX APPLIED (round 1 pre-freeze review,
    strong advisory): RUN-SSIQ-a85692-b's own manifest.yaml discloses
    that TWO OF ITS THREE launch attempts (at a similar, ~284.88s-to-
