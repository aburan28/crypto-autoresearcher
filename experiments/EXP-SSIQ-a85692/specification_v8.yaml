# DRAFT PROTOCOL AMENDMENT, NOT YET FROZEN. Supersedes specification_v7.yaml
# (v7, frozen 6bdaecb8dc2851126744a6608e14b003e7dc4916, retained unedited)
# on the ranked resume action DEC-20260806-7839b5 recorded at BATCH-010's
# close: item (1), PF-6's own named falsification test -- a probe re-run
# of the delta_E search using per-vertex-independent, freshly-seeded RNG
# under a FIXED (never-shrinking) per-vertex time budget, checking
# whether the graph-edge spatial-autocorrelation signal (ANOM-1, real
# ~100% depth==0 vs. a label-permutation null's ~35-58%) persists when
# the delta_E-computation procedure's own shared, sequentially-advancing
# RNG and shrinking budget are removed.
#
# UNLIKE EVERY AMENDMENT SINCE v5 (specification_v5.yaml through v7),
# THIS ONE REQUIRES NEW delta_E SEARCH COMPUTATION -- it is NOT zero new
# search cost, and its budget is sized and justified explicitly below
# against the ORIGINAL search's own measured wall-clock figure for the
# identical prime and graph.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 8
  title: >-
    Probe delta_E search with independent per-vertex RNG: does the
    graph-edge spatial-autocorrelation signal (ANOM-1) survive removing
    the search procedure's own shared RNG and shrinking time budget?
    (BATCH-011)
  status: draft
  approved_by: null
  amends: EXP-SSIQ-a85692 (version 7, specification_v7.yaml, frozen 6bdaecb8dc2851126744a6608e14b003e7dc4916)
  amendment_scope: >-
    A SINGLE PART. Targets ONE prime only, p=2437 -- deliberately the SAME
    prime and the SAME rebuilt graph (via trapping_diagnostic_v5.
    build_graph_for_prime(2437, 20260805), the same pinned
    graph-construction seed every amendment since v5 has used) already
    searched under the ORIGINAL procedure in RUN-SSIQ-a85692-b. This is a
    deliberate experimental-design choice, not a scope-reduction
    shortcut: holding the prime AND the graph fixed and changing ONLY the
    delta_E search's own RNG design isolates the ONE variable PF-6 names
    as a confound (compute_delta_e.py's shared, sequentially-advancing
    rng_search instance and its shrinking per-vertex time budget) without
    introducing prime selection as a second, confounding variable.
    Widening to the other three primes (3889, 5737, 7333) is explicitly
    DEFERRED to a follow-up amendment, conditional on this probe's own
    result (per DEC-20260806-7839b5's own "probe" framing).
    PROCEDURE: (1) rebuild the graph (IMPORTED UNCHANGED,
    trapping_diagnostic_v5.build_graph_for_prime); (2) for every
    non-F_p-rational vertex, run compute_delta_e.two_sided_search
    (GENUINELY IMPORTED, UNCHANGED -- this function itself is neutral: it
    accepts an rng and a time_budget_seconds as PARAMETERS and does not
    itself construct or advance any RNG state; the flaw PF-6 names lives
    entirely in the ORCHESTRATION function that calls it,
    run_phase_minus1_on_confirmatory_set, which this amendment supersedes,
    never edits) with (a) a FRESH random.Random instance constructed
    PER-VERTEX from a disclosed, deterministic seed-derivation formula
    (never a shared, sequentially-advancing instance), and (b) a FIXED
    per-vertex time budget (never a shrinking remaining-budget
    computation); (3) compare the resulting NEW delta_map against
    RUN-SSIQ-a85692-b's own ARCHIVED delta_map for the identical prime and
    graph, vertex by vertex; (4) run the SAME structural-local-minimum,
    depth, and label-permutation-null-control procedure
    specification_v7.yaml already established (GENUINELY IMPORTED,
    depth0_fraction and summary_stats from
    delta_e_permutation_null_control_v7.py, UNCHANGED) on this NEW
    delta_map, at the SAME N_TRIALS=1000 and the SAME
    PERMUTATION_SEED=20260806 v7 already used, for direct comparability.
    BUDGET JUSTIFICATION (REQUIRED, since this is NOT zero new search
    cost): RUN-SSIQ-a85692-b's own archived phase_minus1_real_search
    result for p=2437 (raw-result.json) records
    wall_seconds_used=284.88 for a full search of all 194 non-F_p-
    rational vertices under the ORIGINAL (shrinking-budget, shared-RNG)
    procedure -- an average of ~1.47s/vertex, with 194/194 (100%)
    resolved. This amendment's FIXED per-vertex budget (15s, see
    inputs.probe_delta_e_search_v8 below) is ~10x that observed average,
    generous margin for RNG-design-driven variance in how quickly each
    vertex's smooth table finds a collision, while the total 900s/0.3
    CPU-hour PER-RUN budget this experiment has used since v5 is
    increased for THIS amendment specifically to wall_clock_seconds_per_run:
    3600, total_cpu_hours: 1.0 (worst-case 194 vertices * 15s =
    2910s if every single vertex needed its full budget, which the
    original run's own measured behaviour makes implausible but which
    this amendment budgets for explicitly rather than assuming away).
  pre_freeze_review:
    status: PENDING
    report: null
    verdict: null
    findings_applied: []
  inputs:
    probe_delta_e_search_v8: >-
      PART A. A new module, e.g.
      delta_e_independent_rng_probe_v8.py, defines:
      (1) derive_per_vertex_seed(base_seed, vertex): a disclosed,
      deterministic formula -- int.from_bytes(hashlib.sha256(("SSIQ-v8-
      probe:%d:%r" % (base_seed, tuple(int(c) for c in vertex))).encode(
      "utf-8")).digest()[:8], "big") -- producing a distinct,
      reproducible 64-bit seed per vertex, independent of iteration
      order, independent of any other vertex's search outcome or
      consumed time, and independent of the graph-construction seed
      (20260805) and the permutation-control seed (20260806): BASE_SEED =
      20260811 (a fourth, distinct, newly-pinned constant for this
      amendment, never reused from any prior seed role in this
      experiment). (2) run_probe_delta_e_search_v8(graph, base_seed,
      per_vertex_budget_seconds): for every vertex v in graph["vertices"]
      with field.is_in_fp(v) False (non-F_p-rational; F_p-rational
      vertices resolve for free via the delta_E=1 identity, IDENTICAL to
      the original procedure), construct rng_v =
      random.Random(derive_per_vertex_seed(base_seed, v)) -- a FRESH
      instance, never shared or advanced across vertices -- and call
      compute_delta_e.two_sided_search(field, v, field.frobenius(v),
      rng_v, q, L=compute_delta_e.L_PRIMES, X=compute_delta_e.
      X_LIST_BOUND, time_budget_seconds=PER_VERTEX_BUDGET_SECONDS), where
      PER_VERTEX_BUDGET_SECONDS = 15.0 is a FIXED CONSTANT -- NEVER a
      function of elapsed or remaining time, unlike the original
      procedure's per_vertex_cap = min(remaining, t_prime). Every vertex
      receives the identical, full 15.0s budget regardless of how much
      wall-clock time prior vertices in the loop consumed. Record, per
      vertex: resolved (bool), delta_e_upper_bound (int or None),
      wall_seconds (float), whether it agrees with the ARCHIVED value for
      that vertex (see comparison below).
      REQUIRED COVERAGE REPORTING (not an assertion that halts anything,
      since <100% coverage under a fixed, bounded per-vertex budget is a
      possible, informative outcome, not a failure -- unlike v6/v7's
      graph-identity coverage assertions, which check the REUSED graph
      matches archived metadata exactly): report n_resolved, n_attempted,
      n_vertices, coverage_fraction (== n_resolved / n_non_fp_rational)
      for this NEW search, honestly, whatever the actual value is. The
      EXPECTED result (stated explicitly, not required to hold): given
      the original search's own 100% coverage at ~1.47s/vertex average
      and this amendment's 15s fixed budget (~10x that average), NEW
      coverage is expected to also reach 100%, but this run's own actual
      figure is what is reported, not this expectation.
      REQUIRED COMPARISON AGAINST THE ARCHIVED delta_map (PF-6's own
      falsification design, the reason this amendment exists): load
      RUN-SSIQ-a85692-b's archived delta_map for p=2437 via
      trapping_diagnostic_v5.load_archived_prime_data (GENUINELY
      IMPORTED, UNCHANGED). For every vertex resolved in BOTH the new and
      the archived search, report whether delta_e_upper_bound MATCHES
      exactly. Report, in aggregate: n_both_resolved, n_value_matches,
      n_value_differs (with the full list of (vertex, archived_value,
      new_value) triples for every differing vertex -- never merely a
      count), n_new_resolved_archived_was_not (vertices this search
      resolved that the archived search did not, impossible here since
      the archived search reached 100% coverage, but reported as 0 rather
      than assumed), n_archived_resolved_new_was_not (the reverse, a
      genuinely possible outcome under a bounded, fixed per-vertex
      budget). THIS COMPARISON ITSELF IS INFORMATIVE INDEPENDENT OF PART
      B: if n_value_differs is large, the search's OWN two_sided_search
      procedure (a randomized smooth-table search, not exhaustive) finds
      DIFFERENT valid upper bounds under different RNG draws for the same
      vertex -- itself evidence about the search's own determinism
      properties, reported honestly regardless of what PART B finds.
    probe_permutation_null_control_v8: >-
      PART B, DEPENDENT ON PART A's new delta_map. Using the delta_map
      PART A computed (NOT the archived one), rebuild the SAME p=2437
      graph (already rebuilt in PART A; reused, not rebuilt twice) and
      run the IDENTICAL procedure specification_v7.yaml already
      established: is_structural_local_min(v)/depth(v) (GENUINELY
      IMPORTED, delta_e_permutation_null_control_v7.depth0_fraction,
      UNCHANGED -- this function takes delta_map/vertices/adjacency as
      parameters and is not hardwired to any specific data source,
      confirmed by direct read of its signature) computed over EVERY
      structural local minimum in the NEW delta_map (the same broadened
      domain v7 established, PF-4's fix, not restricted to basin-eligible
      vertices); REAL_DEPTH0_FRACTION on this NEW real (not permuted)
      delta_map; N_TRIALS=1000 permutation trials using a single,
      freshly-constructed random.Random(PERMUTATION_SEED) instance
      (PERMUTATION_SEED = 20260806, the SAME constant v7 used, for direct
      comparability against v7's own archived p=2437 null distribution --
      NOT a new seed, since the null distribution's own construction does
      not depend on which real delta_map is being compared against, only
      on the graph and the value multiset being permuted, and this
      amendment's real value multiset should be nearly identical to v7's
      if PART A's comparison finds few value differences); summary_stats
      (GENUINELY IMPORTED, delta_e_permutation_null_control_v7.
      summary_stats, UNCHANGED) over the resulting NULL_DEPTH0_FRACTIONS.
      REQUIRED HEADLINE COMPARISON (PF-6's own falsification test,
      answered here for the first time in this campaign): does this NEW
      REAL_DEPTH0_FRACTION, computed on data with NO shared/sequential
      search RNG and NO shrinking per-vertex budget, still equal (or
      closely approach) 1.0, and does it still clear the null
      distribution's own maximum by a comparable margin to v7's own
      archived result for p=2437 (23.1 percentage points, per
      EV-SSIQ-a64d92 O-2)? Report explicitly: PERSISTS (new
      REAL_DEPTH0_FRACTION >= 0.95 AND the new margin is within +/-10
      percentage points of v7's own 23.1-point archived margin -- PF-6's
      confound is RULED OUT for this prime, and DEC-20260806-498531 D-2's
      "genuine structural fact" language becomes supportable for the
      first time), WEAKENS (new REAL_DEPTH0_FRACTION or margin is
      materially lower than v7's archived figures -- the signal is AT
      LEAST PARTLY a search-procedure artifact, requiring the
      compound-claim framing EV-SSIQ-a64d92 O-4 established to be
      revised further, not strengthened), or AMBIGUOUS (neither threshold
      cleanly met -- report the actual numbers and defer interpretation
      to independent review, never force a PERSISTS/WEAKENS label onto a
      borderline result). These thresholds (0.95, +/-10 points) are
      PRE-REGISTERED here, before this amendment is executed, precisely
      to prevent post-hoc threshold selection after seeing the result.
      OBJECTIVE_BOUNDARY: this is a DIAGNOSTIC CONTROL, not a claim. It
      does not test H-SSIQ-36e970's real-arm prediction, does not gate
      any decision rule, and does not itself constitute evidence for or
      against a computable delta_E-gradient or a p^{1/4} algorithm,
      regardless of whether its result is PERSISTS, WEAKENS, or
      AMBIGUOUS. A PERSISTS result would license restoring
      DEC-20260806-498531 D-2's "genuine structural fact" language for
      THIS ONE PRIME ONLY, not extending it to the other three primes
      (which remain untested by this probe) or to any claim about
      H-SSIQ-36e970 or lever L4.
