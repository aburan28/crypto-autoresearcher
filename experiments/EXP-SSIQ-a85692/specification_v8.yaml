    round2_report: coordination/goals/GOAL-SSIQ-001/batches/BATCH-011/reviews/RT-PREFREEZE-EXP-SSIQ-a85692-v8-round2.md
    round2_verdict: >-
      DO-NOT-FREEZE. PF-1 and PF-2 (round 1's blocking findings) both
