  inputs:
    probe_delta_e_search_v8: >-
      PART A. A new module, e.g.
      delta_e_independent_rng_probe_v8.py, defines:
      (1) derive_per_vertex_seed(base_seed, vertex): a disclosed,
      deterministic formula -- int.from_bytes(hashlib.sha256(("SSIQ-v8-
      probe:%d:%r" % (base_seed, tuple(int(c) for c in vertex))).encode(
      "utf-8")).digest()[:8], "big") -- producing a distinct,
      reproducible 64-bit seed per vertex, independent of iteration
      order, independent of any other vertex's search outcome or
      consumed time, and independent of the graph-construction seed
      (20260805) and the permutation-control seed (20260806): BASE_SEED =
      20260811 (a fourth, distinct, newly-pinned constant for this
      amendment, never reused from any prior seed role in this
      experiment). (2) run_probe_delta_e_search_v8(graph, base_seed,
      per_vertex_budget_seconds): for every vertex v in graph["vertices"]
      with field.is_in_fp(v) False (non-F_p-rational; F_p-rational
      vertices resolve for free via the delta_E=1 identity, IDENTICAL to
      the original procedure), construct rng_v =
      random.Random(derive_per_vertex_seed(base_seed, v)) -- a FRESH
      instance, never shared or advanced across vertices -- and call
      compute_delta_e.two_sided_search(field, v, field.frobenius(v),
      rng_v, q, L=compute_delta_e.L_PRIMES, X=compute_delta_e.
      X_LIST_BOUND, time_budget_seconds=PER_VERTEX_BUDGET_SECONDS), where
      PER_VERTEX_BUDGET_SECONDS = 15.0 is a FIXED CONSTANT -- NEVER a
      function of elapsed or remaining time, unlike the original
      procedure's per_vertex_cap = min(remaining, t_prime). Every vertex
      receives the identical, full 15.0s budget regardless of how much
      wall-clock time prior vertices in the loop consumed. Record, per
      vertex: resolved (bool), delta_e_upper_bound (int or None),
      wall_seconds (float), whether it agrees with the ARCHIVED value for
      that vertex (see comparison below).
      REQUIRED CONSTRUCTION STEP, STATED AS AN EXPLICIT WIRED STEP, PF-9
      FIX APPLIED (round 2 pre-freeze review, BLOCKING: the original text
      mentioned F_p-rational vertices resolving "for free" only as a
      passing parenthetical, never as a required construction step for
      new_delta_map itself -- a literal implementation following only the
      non-F_p-rational search loop would produce a new_delta_map MISSING
      the 9 F_p-rational entries even at coverage_fraction==1.0, and
      PART B's depth0_fraction call, which iterates ALL 203 vertices, not
      only the 194 non-F_p-rational ones, would crash with an uncaught
      KeyError on the first missing F_p-rational vertex -- reproducing
      PF-1's exact catastrophic failure through a path PF-1's own gate
      cannot detect, since coverage_fraction as originally defined never
      accounts for these 9 vertices at all): BEFORE the per-vertex search
      loop begins, new_delta_map MUST be initialized with new_delta_map[v]
      = 1 for every v in graph["vertices"] with field.is_in_fp(v) True (9
      such vertices at p=2437, matching RUN-SSIQ-a85692-f's own archived
      F_p-rational locus count) -- IDENTICAL to compute_delta_e_v2.py's
      own construction step (real_execution_budget_v2, lines 259-261:
      `for v in g["vertices"]: if field.is_in_fp(v): delta_map[v] = 1`),
      reused as an explicit step here, not left implicit.
      REQUIRED COVERAGE REPORTING (not an assertion that halts anything,
      since <100% NON-F_P-RATIONAL coverage under a fixed, bounded
      per-vertex budget is a possible, informative outcome, not a
      failure -- unlike v6/v7's graph-identity coverage assertions, which
      check the REUSED graph matches archived metadata exactly): report
      n_resolved, n_attempted, n_non_fp_rational (== 194),
      coverage_fraction (== n_resolved / n_non_fp_rational, over the
      NON-F_P-RATIONAL vertices ONLY -- the 9 F_p-rational vertices are
      NEVER included in this fraction's denominator or numerator, since
      they are never "attempted": they are wired in directly, always,
      unconditionally, per the REQUIRED CONSTRUCTION STEP above) for this
      NEW search, honestly, whatever the actual value is. PF-9's OWN
      STRENGTHENED GATE (see PART B below): the actual gating condition
      PART B checks is len(new_delta_map) == len(graph["vertices"]) ==
      203 -- NOT coverage_fraction == 1.0 alone -- so that the gate is
      correct even if a future reader mis-implements the F_p-rational
      wiring step above; both conditions are equivalent ONLY IF the
      REQUIRED CONSTRUCTION STEP was actually performed, and the stronger
      len()-based check is what PART B actually verifies, not merely
      trusts. The EXPECTED result (stated explicitly, not required to
      hold): given the original search's own 100% coverage at ~1.47s/
      vertex average and this amendment's 15s fixed budget (~10x that
      average), NEW non-F_p-rational coverage is expected to also reach
      100% (194/194), but this run's own actual figure is what is
      reported, not this expectation.
      REQUIRED COMPARISON AGAINST THE ARCHIVED delta_map (PF-6's own
      falsification design, the reason this amendment exists): load
      RUN-SSIQ-a85692-b's archived delta_map for p=2437 via
      trapping_diagnostic_v5.load_archived_prime_data (GENUINELY
      IMPORTED, UNCHANGED). For every vertex resolved in BOTH the new and
      the archived search, report whether delta_e_upper_bound MATCHES
      exactly. Report, in aggregate: n_both_resolved, n_value_matches,
      n_value_differs (with the full list of (vertex, archived_value,
      new_value) triples for every differing vertex -- never merely a
      count), n_new_resolved_archived_was_not (vertices this search
      resolved that the archived search did not, impossible here since
      the archived search reached 100% coverage, but reported as 0 rather
      than assumed), n_archived_resolved_new_was_not (the reverse, a
      genuinely possible outcome under a bounded, fixed per-vertex
      budget). THIS COMPARISON ITSELF IS INFORMATIVE INDEPENDENT OF PART
      B: if n_value_differs is large, the search's OWN two_sided_search
      procedure (a randomized smooth-table search, not exhaustive) finds
      DIFFERENT valid upper bounds under different RNG draws for the same
      vertex -- itself evidence about the search's own determinism
      properties, reported honestly regardless of what PART B finds.
      PF-13 FIX APPLIED (round 3 pre-freeze review, advisory, defensive):
      each (vertex, archived_value, new_value) triple's vertex is a
      tuple, and JSON-safe ONLY as long as it appears NESTED INSIDE the
      triple as a list element (a value), never as a dict key -- Python's
      json module encodes a tuple exactly like a list wherever it appears
      as a value. This applies to EVERY vertex-keyed artifact output this
