# (v7, frozen 6bdaecb8dc2851126744a6608e14b003e7dc4916, retained unedited)
# on the ranked resume action DEC-20260806-7839b5 recorded at BATCH-010's
# close: item (1), PF-6's own named falsification test -- a probe re-run
# of the delta_E search using per-vertex-independent, freshly-seeded RNG
# under a FIXED (never-shrinking) per-vertex time budget, checking
# whether the graph-edge spatial-autocorrelation signal (ANOM-1, real
# ~100% depth==0 vs. a label-permutation null's ~35-58%) persists when
# the delta_E-computation procedure's own shared, sequentially-advancing
# RNG and shrinking budget are removed.
#
# UNLIKE EVERY AMENDMENT SINCE v5 (specification_v5.yaml through v7),
# THIS ONE REQUIRES NEW delta_E SEARCH COMPUTATION -- it is NOT zero new
# search cost, and its budget is sized and justified explicitly below
# against the ORIGINAL search's own measured wall-clock figure for the
# identical prime and graph.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 8
  title: >-
    Probe delta_E search with independent per-vertex RNG: does the
    graph-edge spatial-autocorrelation signal (ANOM-1) survive removing
    the search procedure's own shared RNG and shrinking time budget?
    (BATCH-011)
  status: approved
  approved_by: coordinator
  amends: EXP-SSIQ-a85692 (version 7, specification_v7.yaml, frozen 6bdaecb8dc2851126744a6608e14b003e7dc4916)
  amendment_scope: >-
    A SINGLE PART. Targets ONE prime only, p=2437 -- deliberately the SAME
    prime and the SAME rebuilt graph (via trapping_diagnostic_v5.
    build_graph_for_prime(2437, 20260805), the same pinned
    graph-construction seed every amendment since v5 has used) already
    searched under the ORIGINAL procedure in RUN-SSIQ-a85692-b. This is a
    deliberate experimental-design choice, not a scope-reduction
    shortcut: holding the prime AND the graph fixed and changing ONLY the
    delta_E search's own RNG design isolates the ONE variable PF-6 names
    as a confound. PF-2 FIX APPLIED (round 1 pre-freeze review: the
    original draft mis-cited "compute_delta_e.py's... run_phase_minus1_
    on_confirmatory_set" and its per_vertex_cap formula as the ORIGINAL
    procedure -- but RUN-SSIQ-a85692-b's own manifest.yaml/command.txt
    confirm the archived p=2437 data was actually produced by
    compute_delta_e_v2.py's run_phase_minus1_on_confirmatory_set
    (real_execution_budget_v2), a MATERIALLY DIFFERENT mechanism: a
    SINGLE AGGREGATE cross-prime wall-clock counter
    (remaining_now = remaining - elapsed_this_prime, threaded across all
    admitted primes in ascending order), not v1's independent per-prime
    T_PRIME cap). CORRECTED: the ORIGINAL procedure this amendment tests
    against is compute_delta_e_v2.py's real_execution_budget_v2, which
    v2's own module docstring confirms imports two_sided_search/
    build_smooth_table UNCHANGED from v1 and uses the IDENTICAL shared,
    sequentially-advancing rng_search = random.Random(seeds[0]*1000003+p)
    line -- so PF-6's RNG-sharing confound is genuinely present in the
    archived comparison data; only the budget-shape citation was wrong,
    corrected here. Widening to the other three primes (3889, 5737,
    7333) is explicitly DEFERRED to a follow-up amendment, conditional
    on this probe's own result (per DEC-20260806-7839b5's own "probe"
    framing).
    PROCEDURE: (1) rebuild the graph (IMPORTED UNCHANGED,
    trapping_diagnostic_v5.build_graph_for_prime). PF-8 FIX APPLIED
    (round 1, advisory): STATED EXPLICITLY, not left implicit -- this
    amendment RE-RUNS the same two-part graph-identity verification
    v6/v7 already established (degree_sequence_check, IMPORTED UNCHANGED
    from build_isogeny_graph, plus a rebuilt-vertex-count match against
    the archived n_vertices=203 for p=2437), before any delta_E search
    begins, confirming the rebuilt graph is identical to every prior
    amendment's own rebuild (relying on the pinned seed 20260805's own
    determinism is not treated as self-evidently sufficient without this
    check, consistent with this lineage's own explicit-verification
    discipline); (2) for every
    non-F_p-rational vertex, run compute_delta_e.two_sided_search
    (GENUINELY IMPORTED, UNCHANGED -- this function itself is neutral: it
    accepts an rng and a time_budget_seconds as PARAMETERS and does not
    itself construct or advance any RNG state; the flaw PF-6 names lives
    entirely in the ORCHESTRATION function that calls it,
    compute_delta_e_v2.run_phase_minus1_on_confirmatory_set, which this
    amendment supersedes, never edits, and never imports or calls) with
    (a) a FRESH random.Random instance constructed
    PER-VERTEX from a disclosed, deterministic seed-derivation formula
    (never a shared, sequentially-advancing instance), and (b) a FIXED
    per-vertex time budget (never a shrinking remaining-budget
    computation); (3) compare the resulting NEW delta_map against
    RUN-SSIQ-a85692-b's own ARCHIVED delta_map for the identical prime and
    graph, vertex by vertex; (4) run the SAME structural-local-minimum,
    depth, and label-permutation-null-control procedure
    specification_v7.yaml already established (GENUINELY IMPORTED,
    depth0_fraction and summary_stats from
    delta_e_permutation_null_control_v7.py, UNCHANGED) on this NEW
    delta_map, at the SAME N_TRIALS=1000 and the SAME
    PERMUTATION_SEED=20260806 v7 already used, for direct comparability.
    BUDGET JUSTIFICATION (REQUIRED, since this is NOT zero new search
    cost), PF-2 FIX APPLIED (round 1: the original text also mis-cited
    the source procedure here): RUN-SSIQ-a85692-b's own archived
    phase_minus1_real_search result for p=2437 (raw-result.json) records
    wall_seconds_used=284.88 for a full search of all 194 non-F_p-
    rational vertices under compute_delta_e_v2.py's real_execution_budget_v2
    (the ORIGINAL, shared-RNG procedure this amendment tests against, per
    the corrected citation above) -- an average of ~1.47s/vertex, with
    194/194 (100%) resolved. PF-4 FIX APPLIED (round 1, advisory): p=2437
    was the FIRST prime processed against a fresh 3600s aggregate pool
    (per RUN-SSIQ-a85692-b's own archived aggregate_seconds_available_at_
    prime_start=3600.0), so it used only ~7.9% of its available slice --
    the budget-SHRINKING half of PF-6's confound was almost certainly
    never actually binding for this specific archived data (no vertex was
    plausibly ever close to running out of time under an aggregate pool
