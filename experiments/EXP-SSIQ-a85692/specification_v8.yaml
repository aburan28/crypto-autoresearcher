    launched DETACHED via setsid/nohup/disown. This amendment's own
    3600s (exactly 60 minutes) budget sits at the low edge of that same
    empirically-documented kill window, on the same experiment lineage.
    REQUIRED: the Executor MUST launch this run's command detached via
    the identical setsid/nohup/disown pattern RUN-SSIQ-a85692-b's own
    command.txt documents, proactively, not only after a first attempt is
    killed -- given the expected wall-clock (~285-400s, per the
    budget-margin analysis above) is well under the kill window, this
    costs nothing in the common case and avoids repeating the two wasted
    attempts RUN-SSIQ-a85692-b's own history already shows this exact
    infrastructure risk produces at a similar scale.
