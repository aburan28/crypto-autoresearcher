    report: coordination/goals/GOAL-SSIQ-001/batches/BATCH-008/reviews/RT-PREFREEZE-EXP-SSIQ-a85692-v5.md
    round2_report: coordination/goals/GOAL-SSIQ-001/batches/BATCH-008/reviews/RT-PREFREEZE-EXP-SSIQ-a85692-v5-round2.md
    verdict: >-
      Round 1: DO-NOT-FREEZE (original draft, PF-1/PF-4/PF-5 blocking).
      Round 2 (after PF-1/PF-4/PF-5/PF-6/PF-7/PF-8 applied): FREEZE-WITH-FIXES
      (PF-9 blocking, PF-10/PF-11 advisory) -- round 1's three blocking
