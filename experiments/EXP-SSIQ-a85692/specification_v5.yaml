# DRAFT PROTOCOL AMENDMENT, NOT YET FROZEN. Supersedes specification_v4.yaml
# (v4, frozen 0b15e854, retained unedited) on TWO INDEPENDENT POINTS,
# bundled into one batch (BATCH-008, the last batch within this goal's
# current 8-batch campaign_budget) because DEC-20260805-6aa5c2's own
# next_action names both as parallel, zero-new-search, mutually
# non-blocking actions using disjoint data and code paths (confirmed by
# RT-BATCH-007.md Front 6): (A) GD-11's fix -- harden
# dht.ols_loglog_fit's degeneracy guard; (B) the trapping-mechanism
# diagnostic deferred since BATCH-006 -- investigate why all
# previously-searched primes show pervasive greedy-descent trapping,
# using already-collected graph/delta_map data. Each part is
# independently reviewable and independently gated; a finding in one
# does not depend on or block the other.
experiment:
  id: EXP-SSIQ-a85692
  hypothesis_id: H-SSIQ-36e970
  version: 5
  title: >-
    (A) Harden the shared OLS degeneracy guard (GD-11's fix) and (B)
    diagnose the mechanism behind pervasive greedy-descent trapping
    (BATCH-008, both zero new search)
  status: approved
  approved_by: coordinator
  amends: EXP-SSIQ-a85692 (version 4, specification_v4.yaml, frozen 0b15e854)
  amendment_scope: >-
    REVISED AFTER PRE-FREEZE REVIEW (RT-PREFREEZE-EXP-SSIQ-a85692-v5.md,
    DO-NOT-FREEZE on the original draft, PF-1/PF-4/PF-5 blocking, all
    applied below; PF-6/PF-7/PF-8 advisory, all applied). PART A touches
    shared library code by SUPERSESSION, never by in-place edit:
    descent_hitting_time.py stays frozen and byte-for-byte untouched (it
    is EXP-SSIQ-58b642's own artifact, immutable per AGENTS.md). A NEW
    module, experiments/EXP-SSIQ-a85692/implementation/ols_hardened.py,
    defines TWO functions, not one: ols_loglog_fit_v2 (identical to the
    original except the degeneracy guard: max(xs)==min(xs) replaces the
    exact-float sxx==0.0 check) AND, PF-1 FIX APPLIED, a GENUINELY NEW
    bootstrap_gap_ci_v2 -- NOT an alias to dht.bootstrap_gap_ci, a
    distinct function with its own resampling loop (necessarily
    duplicating dht.bootstrap_gap_ci's loop structure, since
    descent_hitting_time.py cannot be edited) that calls
    ols_loglog_fit_v2 for BOTH its per-resample fits (fg, fr), not the
    original ols_loglog_fit. This is the fix that actually matters: the
    pre-freeze review found dht.bootstrap_gap_ci calls ols_loglog_fit by
    its bare module-global name inside the resampling loop, with no
    parameter to inject an alternate fit function -- so a plain alias
    would have made PART A's hardening unreachable from any bootstrap
    resample, exactly the call path where GD-11's confirmed
    spurious-gamma failure occurs. Future amendments that need the
    null-arm or real-arm OLS fit with bootstrap CI import
    ols_hardened.bootstrap_gap_ci_v2 (which internally uses
    ols_loglog_fit_v2), not dht.bootstrap_gap_ci. This amendment does NOT
    retroactively re-run or re-derive any prior batch's already-archived
    gamma/CI values, which stay exactly as committed (GD-11 does not
    contaminate them, per EV-SSIQ-87d21a O-4).
    PART B is a pure re-analysis / graph-reconstruction task: rebuild the
    already-validated 2-isogeny graphs (build_isogeny_graph.build_graph_bfs,
    IMPORTED UNCHANGED, same pinned seeds) for the primes with real
    delta_map data already committed in RUN-SSIQ-a85692-b's raw-result.json
    (2437, 3889, 5737, 7333; 8893 excluded, partial delta_map coverage
    only), and compute a STRUCTURAL (not walk-simulation) diagnostic:
    for each vertex v, is v a graph-structural local minimum of delta_E
    (delta_map[v] <= delta_map[u] for all neighbours u of v)? This
    requires NO new delta_E search (delta_map is read directly from the
    already-committed raw-result.json) and NO re-implementation of
    greedy_descent_hitting_time (which stays imported unchanged, used
    for a required, EXHAUSTIVE cross-check per PF-6's fix, not a sample).
    Everything else in v1-v4 (B=23/X=23, the delta_E instrument, every
    budget-allocation formula, trapped_exclusion_filter_v3,
    c_null_label_comparison_v3, the decision rule, every control) is
    REUSED UNCHANGED and NOT reopened, restated, or re-run.
  pre_freeze_review:
