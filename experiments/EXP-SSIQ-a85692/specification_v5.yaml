    findings_applied: [PF-1, PF-4, PF-5, PF-6, PF-7, PF-8, PF-9, PF-10, PF-11]
    pf1_summary: >-
      BLOCKING (round 1), applied and CONFIRMED HOLDING (round 2,
      independently traced line-by-line against the actual frozen
      bootstrap_gap_ci and hand-executed against the N=324/n=3 case).
      dht.bootstrap_gap_ci calls ols_loglog_fit by its bare module-global
      name inside its resampling loop with no injection parameter -- the
      original draft's "alias" binding would have made PART A's
      hardening unreachable from any bootstrap resample, a hollow fix of
      the same shape as GD-9/GD-10. Fixed by writing a genuinely new
      bootstrap_gap_ci_v2 with its own resampling loop, threading
      ols_loglog_fit_v2 through both per-resample fits.
    pf4_summary: >-
      BLOCKING (round 1), applied and CONFIRMED HOLDING (round 2,
      independently executed the tuple(json.loads(key)) round-trip and
      confirmed exact int-typed recovery). delta_map's on-disk keys are
      str(list(v)) JSON-string-serialized vertex tuples; no prior code in
      this repository has ever reverse-parsed this format. The exact
      conversion procedure is now stated. See PF-9 below: the round-trip
      procedure itself was correct; the downstream coverage assertion's
      comparison target was not, until PF-9's fix.
    pf5_summary: >-
      BLOCKING (round 1), applied and CONFIRMED ADEQUATE (round 2: "the
      best available check given no adjacency was ever archived,"
      residual risk explicitly weighed and accepted). C-CONNECTIVITY's
      floor(p/12) anchor is a vertex-count check only and cannot verify
      edge structure, and no prior run persisted adjacency data to diff
