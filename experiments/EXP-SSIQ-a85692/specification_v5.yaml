      (via M-DEGSEQ, reused, plus the archived per-prime vertex count)
      rather than the unachievable "byte-identical to an unrecorded prior
      state." Strengthened further by PF-11 below.
    pf6_summary: >-
      ADVISORY (round 1), applied and CONFIRMED ADEQUATE (round 2:
      computationally negligible for graphs <=611 vertices). The
      walk-trapped/structural-local-minimum equivalence is exact and
      provable from greedy_descent_hitting_time's own documented
      invariant, not an open empirical question -- the cross-check now
      runs on every resolved vertex, not a sample, since any disagreement
      is conclusively a bug in this amendment's own code.
    pf7_summary: >-
      ADVISORY, applied. All four primes this amendment uses have full
      delta_map coverage, so the unresolved-neighbour branch cannot
      execute this batch -- stated explicitly, with the branch specified
      to raise loudly (not silently handle) if unexpectedly reached.
    pf8_summary: >-
      ADVISORY, applied. The structural-local-minimum fraction and the
      archived walk-based trapped_fraction are stated explicitly as
      related-but-generally-different statistics (many-to-one funneling
      inflates trapped_fraction relative to raw local-minimum density),
      not corroborating measurements of the same quantity.
    pf9_summary: >-
      BLOCKING, NEW (round 2). Round 1's own required-fix text (for PF-4)
      named "n_resolved/n_vertices" as an interchangeable comparison
      target for the coverage assertion -- but they are DIFFERENT
      archived quantities (n_resolved 194/306/460/594 excludes
      F_p-rational vertices; n_vertices 203/324/478/611, independently
      confirmed == len(delta_map) exactly, includes them). The
      Coordinator's revision faithfully implemented round 1's prose to
      the letter, propagating round 1's own unverified error forward --
      as specified before this fix, the assertion would have halted with
      an error on all four primes even on a fully correct rebuild. Fixed
      by naming ONLY n_vertices, never n_resolved, with an explicit note
      distinguishing the two fields.
    pf10_summary: >-
      ADVISORY, applied. The bootstrap_gap_ci_v2 regression test's
      construction mechanism (N_list = [N]*n, n identical copies of the
      anomalous value) is now stated explicitly rather than left
      implicit, independently confirmed correct by the round-2 reviewer.
    pf11_summary: >-
      ADVISORY, applied. The coverage assertion's delta_map key-set match
      (once corrected per PF-9) is now credited explicitly as a SECOND,
      independent vertex-set-fidelity check alongside M-DEGSEQ + count,
      catching a same-count/same-degree vertex substitution that
      M-DEGSEQ + count alone could not.
  inputs:
    gd11_fix_v5: >-
      PART A. ols_hardened.py defines TWO functions. (1)
      ols_loglog_fit_v2(N_list, y_list): BYTE-IDENTICAL to
      dht.ols_loglog_fit except the guard "if sxx == 0.0: raise
      ValueError(...)" is replaced by "if max(xs) == min(xs): raise
      ValueError(...)" -- checking the INPUT log-values directly for
      exact equality, independent of any summation/division rounding.
      (2) PF-1 FIX APPLIED, bootstrap_gap_ci_v2(N_list,
      median_greedy_list, median_random_list, rng, n_boot=2000): a
      GENUINELY NEW function, NOT an alias -- ports dht.bootstrap_gap_ci's
      resampling loop structure verbatim (same PRIMES-as-resampling-unit
      design, same n_boot default, same percentile-based CI extraction)
      but calls ols_loglog_fit_v2 (not the original ols_loglog_fit) for
      BOTH per-resample fits (fg, fr) inside the loop, and catches the
      SAME ValueError the hardened guard now raises more reliably,
      discarding that resample exactly as the original does for a
      caught ValueError. This is the actual fix: the call path where
      GD-11's confirmed spurious-gamma failure occurs is INSIDE
      bootstrap_gap_ci's resampling loop, not in a standalone
      ols_loglog_fit call, so hardening only ols_loglog_fit_v2 without a
      corresponding bootstrap_gap_ci_v2 that actually calls it would
      leave every future bootstrap CI computation unprotected.
      REQUIRED VALIDATION, TWO PARTS, both independent of any real run's
      data (same discipline as v4's own synthetic_self_test_v4): (i) a
      standalone-function regression test reproducing RT-BATCH-007.md's
      own two named anomaly cases (N=324/repeat=3, N=611/repeat=6, both
      confirmed anomalous under the ORIGINAL guard) and confirming
      ols_loglog_fit_v2 correctly raises ValueError on both; (ii) A
      SEPARATE, REQUIRED test that calls bootstrap_gap_ci_v2 (not only
      the standalone function) with resample data constructed so that at
      least one resample draw reproduces the N=324/n=3 or N=611/n=6
      anomaly pattern, and confirms that resample is correctly discarded
      from the returned CI (not silently contributing a spurious gap
      value) -- this is the direct, code-verified evidence that the fix
      actually reaches the call path it exists to protect, not merely
      that the standalone function works in isolation. PF-10 FIX APPLIED
      (round 2, advisory): the construction mechanism is N_list = [N]*n
      (n identical copies of the single anomalous N value, e.g.
      [324,324,324] for the n=3 case) -- this guarantees EVERY resample
      draw is degenerate regardless of the RNG's specific draw, the
      cheapest and most direct construction, independently confirmed
      correct against the actual guard by the pre-freeze reviewer.
    trapping_mechanism_diagnostic_v5: >-
      PART B. For each of the 4 primes with full delta_map coverage in
      RUN-SSIQ-a85692-b (2437: 203 vertices, 3889: 324, 5737: 478, 7333:
      611 -- all four already confirmed m_coverage_all_vertices_fraction
      == 1.0, PF-7's finding): rebuild the graph via
      build_isogeny_graph.build_graph_bfs (IMPORTED UNCHANGED, same
      pinned seed convention this campaign already uses). PF-4 FIX
      APPLIED, KEY-FORMAT BRIDGE STATED EXPLICITLY: RUN-SSIQ-a85692-b's
      raw-result.json stores delta_map with keys serialized as
      str(list(v)) (e.g. the vertex tuple (1031, 1095) is stored as the
      JSON string key "[1031, 1095]"); convert each archived key back to
      a vertex tuple via tuple(json.loads(key)) before matching against
      the rebuilt graph's own tuple-keyed vertex set -- this exact
      round-trip has never been implemented elsewhere in this
      repository and must not be improvised ad hoc. REQUIRED COVERAGE
      ASSERTION, PF-9 FIX APPLIED (round 2 pre-freeze finding: round 1's
      own required-fix text named "n_resolved/n_vertices" as
      interchangeable, but they are DIFFERENT archived quantities --
      n_resolved counts only non-F_p-rational vertices resolved via real
      search, EXCLUDING the F_p-rational vertices that resolve for free
      via the delta_E=1 identity; n_vertices (== len(delta_map) exactly,
      independently confirmed against raw-result.json) includes both).
      NAME ONLY n_vertices, NEVER n_resolved, AS THE COMPARISON TARGET:
      executed before any statistic is computed, the number of delta_map
      keys successfully matched against the rebuilt graph's vertex set
      MUST equal that prime's already-archived n_vertices count (2437:
      203, 3889: 324, 5737: 478, 7333: 611 -- already sitting in the same
      raw-result.json this diagnostic reads, at
      phase_minus1_real_search[prime].n_vertices) -- halt with an
      explicit error, not a silent partial result, if it does not match
      exactly. Reading n_resolved (194/306/460/594) for this comparison
      is a DISTINCT, INCORRECT quantity that would halt the assertion on
      all four primes even on a fully correct rebuild -- do not use it
      here.
      GRAPH-REBUILD VERIFICATION, PF-5 FIX APPLIED (reframed from the
      unachievable "byte-identical to an unrecorded prior state," since
      no prior run persisted adjacency data to diff against): re-run
      degree_sequence_check (M-DEGSEQ, IMPORTED UNCHANGED) on all four
      rebuilt graphs, and cross-check each prime's rebuilt vertex COUNT
      against that SAME prime's specific already-archived count above
      (not merely the generic floor(p/12) formula) -- report the rebuild
      as "independently verified correct" only if both checks pass, and
      halt with an explicit error otherwise. PF-11 FIX APPLIED (round 2,
      advisory): this is a SECOND, INDEPENDENT check alongside the
      coverage assertion's own vertex-set matching above -- the coverage
      assertion's delta_map key set functions as an implicit archived
      vertex-set snapshot (not merely a count), so a same-count,
      same-degree vertex substitution that M-DEGSEQ + count alone could
      not detect would still surface as a coverage-assertion mismatch;
      the two checks together, not either alone, are what "independently
      verified correct" refers to.
      For every vertex v with a resolved delta_E value (all vertices,
      per the coverage assertion above), compute is_structural_local_min(v)
      = delta_map[v] <= min(delta_map[u] for u in adjacency[v]) -- PF-7
      FIX APPLIED: the "unresolved neighbour" branch cannot execute on
      this batch's data (full coverage confirmed for all four primes);
      if it is EVER reached, RAISE LOUDLY (do not silently handle or
      drop) since an unresolved neighbour against this specific,
      already-verified-complete data would itself signal a stale read or
      wrong prime, not a legitimate data gap. Report, per prime: the
      fraction of vertices that are structural local minima, and the
      degree-3 neighbour delta_E distribution for local-minimum vs
      non-local-minimum vertices.
      REQUIRED CROSS-CHECK, PF-6 FIX APPLIED (run on EVERY resolved
      vertex, not a sample -- the walk-trapped/structural-local-minimum
      equivalence is EXACT and provable directly from
      greedy_descent_hitting_time's own documented invariant: a
      strict-descent walk's predecessor always has strictly greater
      delta than the current vertex, so it can never be excluded from a
      smaller-delta candidate set by the non-backtracking rule -- making
      "trapped at w" and "w is a structural local minimum" logically
      equivalent for every vertex, unconditionally; any observed
      disagreement is THEREFORE CONCLUSIVELY A BUG in this amendment's
      own is_structural_local_min or key-matching code, most likely
      PF-4's key-format issue if unresolved, never a mechanism finding):
      re-run greedy_descent_hitting_time (IMPORTED UNCHANGED) starting
      from every resolved vertex against the same delta_map, and confirm
      its own "trapped" flag agrees with is_structural_local_min(start)
      for every single vertex tested; halt with an explicit error, not a
      silently-reported disagreement count, if any vertex disagrees.
      PF-8 FIX APPLIED: state explicitly, in the reported output, that
      "fraction of structural local minima" and the already-archived
      "greedy_trapped_fraction" (descent_metrics.per_prime[p].greedy_trapped_fraction
      in RUN-SSIQ-a85692-b) are RELATED BUT GENERALLY DIFFERENT
      STATISTICS (per the cross-check's own exact equivalence, a walk's
      trapped ENDPOINT is always a structural local minimum, but
      many-to-one funneling of walk paths onto the same local minimum
      inflates the population-level trapped_fraction relative to the raw
      local-minimum density among all vertices) -- do not present the two
      numbers as corroborating measurements of the same quantity.
      OBJECTIVE_BOUNDARY: this is a DIAGNOSTIC, not a claim. It does not
      test H-SSIQ-36e970's real-arm prediction, does not gate any
      decision rule, and does not itself constitute evidence for or
      against a computable delta_E-gradient. Its purpose is narrowly to
      inform whether BATCH-009-or-later (if campaign budget is extended)
      should widen to larger N, investigate the greedy tie-break rule, or
      neither.
