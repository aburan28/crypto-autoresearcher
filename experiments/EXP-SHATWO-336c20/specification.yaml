experiment:
  id: EXP-SHATWO-336c20
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-c4e5e3; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-c4e5e3
  question_id: RQ-SHATWO-f196c7
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute the carry-fixed GF(2) rank ledger of the SHA-256 message expansion for every step
    count from 1 to 64 against declared condition-support families, with matched random-tap and random-support
    null arms in the same invocation
  objective: 'The single uncertainty a run reduces: whether the surviving-freedom and redundancy integers
    (F, R) of the SHA-256 expanded message schedule are properties of the SHA-256 design or merely
    of the shape of the matrix that any expansion of that arity would produce. Concretely: (i) it
    fixes the definitional question by emitting, for each s in 1..64 and each preregistered condition-support
    family and each sampled carry class, the exact integers rank_S, F(S) = 512 - rank_S and R(S) =
    |S| - rank_S, computed twice by independently written linearizers that must agree bit for bit,
    so that the quantity RQ-SHATWO-f196c7 target 2 names in prose acquires a definition an auditor
    can re-run; (ii) it reduces the artifact uncertainty by running the identical elimination against
    1000 random-tap expansions and 1000 random supports, so that any reported structure is reported
    as a departure from a measured band rather than as an unquantified impression; (iii) it forces
    the instrument-validity question to be settled first by requiring the forced value rank(A_16)
    = 512 and the exact recovery of a planted rank deficiency, either of which failing voids every
    other number in the run. A run does NOT reduce the uncertainty about whether these integers predict
    any reachable step count; that is a separate transfer measurement and this contract explicitly
    declines it.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal scope a run could support: for the SHA-256 message
      expansion as specified in FIPS 180-4, restricted to the sampled carry classes and the preregistered
      condition-support families, the integers rank_S, F(S) and R(S) take the emitted values for each
      s in 1..64, and those values do or do not lie outside the measured null band of 1000 random-tap
      draws at the declared percentile. WHAT DOES NOT FOLLOW: nothing about the reachable step count
      of any collision, semi-free-start collision or preimage search, published or internal; nothing
      about whether any redundancy found is exploitable by message modification or by anything else;
      nothing about the true schedule outside the sampled carry classes; nothing about the compression
      function, which this contract never touches; and nothing whatsoever about full 64-step SHA-256,
      HMAC-SHA-256, certificate chains, code signing, or Bitcoin. A rank is not an attack and a null-band
      departure is not a weakness.'
  inputs:
    procedure: 'STAGE 0 (minutes): pin Python 3.11, numpy, and the repository commit; write the preregistration
      file naming the condition-support families f1, f2, f3, the carry-class sample, the null draw
      counts and the percentile threshold; record its sha256 in the run manifest via harness/runner.py
      before any other stage executes. STAGE 1 (1 hour human, seconds machine): implement SHA-256
      twice from FIPS 180-4 and validate both against the NIST test vectors by hashlib comparison;
      abort on any mismatch. STAGE 2 (2-4 hours human, seconds machine): implement the carry-fixed
      linearizer twice, emit A_64 as a bit-packed GF(2) matrix from each, and assert bitwise equality;
      assert rank(A_16) = 512. STAGE 3 (minutes machine): recover a planted rank deficiency of known
      size from a synthetic matrix; abort on failure. STAGE 4 (minutes machine): compute rank_S, F,
      R for every s in 1..64, every preregistered family, every sampled carry class. STAGE 5 (10-30
      minutes machine): 1000 NULL-1 random-tap draws and 1000 NULL-2 random-support draws through
      the identical routine, emitting the full draw distributions and not only their percentiles.
      STAGE 6 (minutes): emit the integer tables, the null bands, the two-pivot-order rank agreement
      check, and the run manifest with seeds and the resolved inference block.'
    instrument: Python 3.11 with numpy for uint64 bit-packed GF(2) Gaussian elimination written in-repo;
      hashlib from the standard library as the independent FIPS 180-4 cross-check against both hand-written
      SHA-256 implementations; harness/runner.py for the run manifest, deterministic seeds and the
      inference block; no SAT solver, no computer-algebra system, and no Sage anywhere in this contract.
      All code is a single self-contained module plus its test file, with the preregistration hash
      checked at import time.
    parameters: 'Word size 32 bits, block 512 bits, step counts s = 1..64. Condition-support families:
      f1 = all 32 bits of each of the last k expanded words for k in 1..8; f2 = supports of Hamming
      weight w in {1, 2, 4, 8, 16, 32} placed at each declared step t in 16..63; f3 = uniform random
      supports at matched cardinalities. Carry classes: the all-zero pattern plus 32 uniformly sampled
      patterns. Null draws: 1000 for NULL-1 and 1000 for NULL-2, seeds 1..1000 fixed in the preregistration.
      Two pivot orders per elimination. Total configurations under 200000, each an elimination on
      a matrix of at most 2048 x 512 bits.'
  controls:
  - NULL-1 random-tap expansion, 1000 draws, identical code path, same invocation.
  - NULL-2 random-support of matched cardinality against SHA-256 taps, 1000 draws.
  - 'Positive control: a hand-built matrix with a planted rank deficiency of a known size, which the
    elimination must report exactly.'
  - 'Cross-implementation control: two independently written expansion linearizers whose A_s matrices
    must agree bit for bit.'
  - 'Full-hash correctness control: both implementations reproduce the NIST FIPS 180-4 test vectors
    through hashlib comparison before any rank is computed.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both executed in the same invocation as the signal arm and
    through the identical code path with only the tap definition swapped. NULL-1 random-tap: replace
    sigma0 and sigma1 by uniformly sampled GF(2) linear maps on 32 bits with the same number of nonzero
    terms, and resample the four tap offsets uniformly from 1..16 preserving arity; 1000 draws. NULL-2
    random-support: keep SHA-256 taps but sample S uniformly at random with matched cardinality; 1000
    draws. For the signal arm to mean anything, NULL-1 must produce a rank-increment profile that
    differs from SHA-256''s at the declared threshold - if the two are indistinguishable, F and R
    are properties of a 32s x 512 matrix of that shape and the SHA-256 arm is recorded as a controlled
    null. NULL-2 must show generic behaviour, rank_S = min(|S|, 512) with redundancy zero, at a rate
    near 1; if random supports show the same redundancy as structured ones, the redundancy signal
    is an artifact of the elimination convention.'
  independent_variables:
  - step count s in 1..64
  - condition-support family and its cardinality
  - carry pattern (all-zero plus 32 sampled)
  - arm (SHA-256 taps, NULL-1 random taps, NULL-2 random support)
  metrics:
    primary:
    - rank_S per configuration
    - F(S) = 512 - rank_S
    - R(S) = |S| - rank_S
    - per-step rank increment vector over s
    - least s with F(S) = 0 per family
    secondary:
    - null-band percentiles under NULL-1 and NULL-2
    - spread of F and R across sampled carry classes
    - bitwise agreement flag between the two linearizers
    - wall-clock seconds and peak bytes per elimination
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The per-step rank-increment vector of the SHA-256 carry-all-zero expansion under family
      f1, and the number of step indices s in 17..48 at which it falls outside the 2.5th-97.5th percentile
      band of 1000 NULL-1 random-tap draws.
    formula: 'increment(s) = rank(A_s restricted to S(s)) - rank(A_{s-1} restricted to S(s-1)), with
      A_s the 32s x 512 carry-fixed GF(2) expansion matrix and S(s) the family-f1 support at step
      count s. Predicted: at least 3 indices outside the band. Forced value elsewhere: rank(A_16)
      = 512, and R(S) = 0 for at least 99 percent of NULL-2 draws at cardinality 400.'
    source: Pre-registered in the parent proposal IDEA-20260816-c4e5e3 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'This runs at the FULL real parameter set of SHA-256 - 32-bit words, 512-bit block,
      64 steps - so there is no extrapolation in the parameter dimension at all; it is tiered toy
      because the measured object is a linear-algebraic shadow of the primitive, not the primitive.
      The transfer assumption that IS made and must be stated: results are exact within a carry class,
      and their relevance to the true schedule rests on a sampled distribution over 33 carry classes
      out of an astronomically larger set. No transfer to the compression function, to any search,
      or to any step-count frontier is assumed, because none is claimed.'
    correspondence: null
  tail_checks:
  - Report the full NULL-1 and NULL-2 draw distributions, not only percentile summaries, so a bimodal
    null is visible rather than averaged away.
  - Report the maximum and minimum of F and R across the 33 carry classes alongside the mean, since
    a class-dependent answer is the honest answer.
  - Check the extreme supports |S| = 1 and |S| = 32s, where rank must equal 1 and rank(A_s) respectively;
    deviation is an implementation bug.
  - Check the two-pivot-order rank agreement on every configuration and report any disagreement as
    a fatal instrument fault, not as data.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Abort the whole run if either SHA-256 implementation misses a NIST test vector, if the two linearizers
    disagree on any bit of A_64, or if rank(A_16) is not 512.
  - Stop the null sweep at 1000 draws per arm as preregistered; do not extend the draw count after
    seeing the band.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Both linearizers agree bitwise, rank(A_16) = 512, the planted-deficiency control
    is recovered exactly, and the full integer tables of rank_S, F and R are emitted for every preregistered
    configuration together with the complete NULL-1 and NULL-2 draw distributions - regardless of
    whether SHA-256 departs from the null band, since a measured non-departure is the usable obstruction
    this contract is built to be able to report.
  falsification_criterion:
  - SHA-256's per-step rank-increment vector lies inside the NULL-1 band at every s in 17..48, falsifying
    the premise that F and R are design properties rather than shape properties.
  - NULL-2 random supports show nonzero redundancy in more than 1 percent of draws, falsifying the
    elimination convention.
  - The planted rank deficiency is not recovered exactly, falsifying the instrument.
  - F and R vary across the 33 sampled carry classes by more than the SHA-256-versus-null separation,
    falsifying the usability of the carry-fixed model for any statement about the schedule.
  - The two independently written linearizers disagree, falsifying the reproducibility premise on
    which every emitted integer rests.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-c4e5e3
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The condition-support families f1, f2, f3 are chosen for computability, not because any argument
    here shows they are the supports a real characteristic would impose; a Coordinator must decide
    whether that gap is acceptable before approval or require a fourth family derived from a filed
    characteristic.
  - The carry-class sampling distribution is uniform by default, which is a modelling choice with
    no justification offered; a Coordinator must either accept it as declared or specify a different
    one.
  - No argument is supplied that R > 0 is exploitable, and the contract must not be approved with
    any wording that implies it is.
