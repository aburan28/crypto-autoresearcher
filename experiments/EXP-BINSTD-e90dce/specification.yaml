# EXP-BINSTD-e90dce
# Residue-schedule arithmetic. No system is encoded.
# Approved by DEC-20261003-f08bfb.
experiment:
  id: EXP-BINSTD-e90dce
  hypothesis_id: H-BINSTD-e152b6
  source_idea: IDEA-20261002-92aa34
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Span, cells, and the hour cap
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-f08bfb
  objective: >-
    Check the product 216, the product 120, and the excess 4.
  inputs:
    n_sum: 59
    n_product: 7429
    gap_product: 8
    span: 6
    ell_product: 12
    ell_excess: 4
    cells: 6
    hour_cap: 6
    triple_product: 216
    targets: 20
    target_product: 120
    under_lo: 108
    under_mid: 112
    under_hi: 114
    under_product: 1378944
  controls:
    - >-
      Six times six times six is 216. Reporting one dimension makes
      3 times 6 times 6 equal 108 and invalidates the run.
    - >-
      Six times 20 is 120. Twelve exceeds 8 by 4. The n sum is 59
      and the n product is 7429. The gap product is 8.
    - >-
      The product of 108, 112, and 114 is 1378944. The span, the
      cell count, and the hour cap are each 6.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {triple, targets, excess}
    - route in {product, difference}
  metrics:
    primary:
      - triple_product
      - target_product
      - ell_excess
      - implementations_agree
    secondary:
      - n_product
      - gap_product
      - under_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Six times six times six is 216. Six times 20 is 120. Twelve
      exceeds 8 by 4.
    formula: >-
      Multiply 6 by 6 by 6. Multiply 6 by 20. Subtract 8 from 12.
    source: >-
      IDEA-20261002-92aa34 states the n list 17, 19, and 23, the
      dimensions 3 and 4, the target floor 20, and the hour cap 6,
      read 2026-10-03. It does not name the density bound as an
      integer. The products were recomputed in this design session.
      That computation is not a run. No system was encoded.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written hour cap. No transfer to a clause density.
    correspondence: null
  tail_checks:
    - The product 120 and the excess 4 are required. A check that stops at the product 216 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 216 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 216.
    - Six times 20 is not 120.
    - Twelve minus 8 is not 4.
    - One dimension is reported, or a system is encoded.
  success_criterion: >-
    Both runs agree that 6 times 6 times 6 is 216, that 6 times 20
    is 120, that 12 exceeds 8 by 4, and that the n product is 7429.
  falsification_criterion: >-
    The runs agree that 6 times 6 times 6 is computed, and that
    product is not 216.
  required_artifacts:
    - experiments/EXP-BINSTD-e90dce/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-e90dce/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-e90dce/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-e90dce/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-e90dce/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-e90dce/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any encoding, symmetrisation, or clause count.
    - Any claim that a residual density stays under a bound.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
