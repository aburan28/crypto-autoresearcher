experiment:
  id: EXP-FRODOFO-f42257
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-72e5e5; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-72e5e5
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Instrument-validity certificate for an FO-bound evaluator: matched-descriptor forced-zero
    test with a contaminated positive control, an inert negative control, and an exponent-predicted
    sensitivity ladder.'
  objective: 'One uncertainty is reduced: whether a reduction-bound evaluator measures only its declared
    inputs, or silently consumes something else. (i) IS IT BLIND. Fed two scheme descriptors pinned
    equal on every coordinate the bound consumes and differing on everything else, including deliberately
    conflicting names, dimensions, moduli and ring degrees, does the evaluator return a bitwise identical
    figure under exact rational arithmetic? Any nonzero difference localizes an impurity and that
    localization is the result. (ii) IS IT SENSITIVE RATHER THAN INERT. Unpinning one consumed coordinate
    at a time by a factor of two, does the output move by exactly that coordinate''s exponent in bits,
    to within interval width? An evaluator that passes (i) by ignoring its inputs is the failure mode
    a matched-pair test alone cannot see, and the inert negative control makes that explicit. (iii)
    DOES THE TEST HAVE POWER. Does a deliberately contaminated evaluator, differing only by a one-bit
    scheme-label-keyed term, actually fail (i)? Without this the pass in (i) is uninterpretable. The
    run requires no primary source and produces no security figure; it produces a certificate that
    every later FRODO evaluation inherits.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for THIS evaluator version,
      THIS declared input contract, and the specific descriptor set and sensitivity ladder used, the
      matched-descriptor difference was exactly zero (or was the stated nonzero value at the stated
      location), the sensitivity ladder matched exponent predictions to the stated tolerance, and
      the positive control failed as required at one bit of contamination. WHAT DOES NOT FOLLOW: nothing
      about FrodoKEM''s security, nothing about any structured scheme''s security, and above all nothing
      about whether algebraic structure matters, since the consumed coordinates were pinned equal
      by construction. The certificate also does not validate the transcription the evaluator consumes:
      a faithfully evaluated wrong bound passes this test completely.'
  inputs:
    procedure: 'STAGE 0, declare the input contract as a machine-readable list and instrument the
      evaluator so any read outside it raises. Cost: implementation. STAGE 1, build four descriptors:
      unstructured pinned, structured pinned, structured pinned with conflicting metadata, structured
      with one coordinate unpinned. Cost: minutes. STAGE 2, matched-pair test through the real evaluator
      under instrumentation, requiring exact zero. Cost: seconds. STAGE 3, operand-order permutation
      control, three summation orders, requiring bitwise identity. Cost: seconds. STAGE 4, sensitivity
      ladder over every consumed coordinate at factors of one half and two, comparing measured movement
      against the pre-registered exponent prediction. Cost: seconds. STAGE 5, positive control: contaminated
      evaluator with a one-bit label-keyed term through the identical matrix, which must fail stage
      2. Cost: seconds. STAGE 6, negative control: inert constant evaluator through the identical
      matrix, which must pass stage 2 and fail stage 4. Cost: seconds. STAGE 7, immutable run records
      via harness/runner.py including the input contract, descriptors and resolved inference block.'
    instrument: 'Python 3 standard library: fractions.Fraction for exact rational evaluation so that
      a zero-tolerance criterion is meaningful, a small declarative descriptor dataclass, and a read-instrumentation
      wrapper implemented with __getattr__ interception rather than a tracing library, so the instrumentation
      itself has no external dependency. No Sage, no lattice estimator, no floating point anywhere
      on the evaluation path. The evaluator shares one term list across descriptors by construction,
      and that sharing is asserted in code rather than assumed. Run manifests and resolved inference
      block through harness/runner.py; ids via tools/allocate_id.py.'
    parameters: 'Input contract: the 6 consumed coordinates (hash queries, decapsulation queries,
      correctness error, users, ciphertexts per user, placeholder advantage). Descriptors: 4, as listed,
      with 8 unconsumed metadata fields each, all differing between the unstructured and structured
      descriptors and additionally scrambled in the conflicting-metadata arm. Sensitivity ladder:
      6 coordinates times 2 factors (one half, two) = 12 evaluations per evaluator. Evaluators: 3
      (real, contaminated at 1 bit, inert). Operand orders: 3. Term list: the same 4-to-8-term synthetic
      bound used as a stand-in, since no transcription is filed. Total evaluations under 200, all
      exact.'
  controls:
  - Contaminated evaluator with a one-bit scheme-label-keyed term, as the positive control that establishes
    the test's power.
  - Inert constant-returning evaluator, which must pass the matched-pair test and fail the sensitivity
    ladder.
  - Conflicting-metadata descriptor pair, which strengthens the matched-pair test against a label
    leak that a bland descriptor would miss.
  - Read instrumentation over every value outside the declared input contract.
  - Exponent-predicted movement as the reference for the sensitivity ladder, registered before the
    run.
  - 'Operand-order permutation control: evaluate the same input with terms summed in three different
    orders and require bitwise identical output under exact arithmetic.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A deliberately CONTAMINATED evaluator, identical in every respect except
    that it adds a term of one bit keyed on a hash of the scheme name, run through the IDENTICAL test
    matrix in the same invocation. This positive control must FAIL the matched-pair test, and must
    fail it at the smallest contamination the test is claimed to detect. If the contaminated evaluator
    passes, the test matrix has no power and a pass by the real evaluator means nothing. A second
    null is an INERT evaluator that ignores its inputs and returns a constant: it passes the matched-pair
    test trivially and must be caught by the sensitivity ladder, which is precisely why both halves
    are required and why either alone would be a fake control.'
  independent_variables:
  - 'evaluator: real, contaminated, inert'
  - 'descriptor: unstructured pinned, structured pinned, structured pinned with conflicting metadata,
    structured with one coordinate unpinned'
  - consumed coordinate varied, 6 levels
  - 'variation factor: one half or two'
  - summation order, 3 levels
  metrics:
    primary:
    - matched-descriptor output difference, exact rational
    - measured minus exponent-predicted output movement per coordinate, in bits
    - contaminated-control matched-pair difference
    - count of out-of-contract reads
    - inert-control behaviour on the sensitivity ladder
    secondary:
    - operand-order permutation difference
    - number of descriptor metadata fields verified to differ between arms
    - wall-clock for the full matrix
    - the declared input contract itself, emitted as an artifact
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The matched-descriptor output difference for the real evaluator, and the discrepancy
      between measured and exponent-predicted movement on the sensitivity ladder.
    formula: 'Registered before the run: matched-descriptor difference exactly 0 in exact rational
      arithmetic for the real evaluator; for a doubling of a coordinate carrying exponent e in the
      dominant term, the output moves by exactly e bits, so measured minus predicted movement is 0
      to within the interval width, with tolerance 0.001 bits; contaminated-control matched-pair difference
      exactly 1 bit; inert-control movement exactly 0 bits on every ladder rung; out-of-contract read
      count exactly 0.'
    source: Pre-registered in the parent proposal IDEA-20260816-72e5e5 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'The bound under evaluation is a 4-to-8-term synthetic stand-in, because no FrodoKEM
      transcription is filed and RQ-FRODO-a2dbe2 constraint 1 forbids designing against one. TRANSFER
      ASSUMPTION, stated plainly: the certificate transfers to a real transcription only in that the
      same evaluator code path is exercised; it does NOT certify anything about a real bound''s term
      structure, and if a real bound contains non-monomial terms the exponent-predicted movement half
      of the test must be re-derived. The forced-zero half transfers unchanged, since it depends only
      on purity and on the input contract.'
    correspondence: null
  tail_checks:
  - Report the number of descriptor metadata fields actually verified to differ, since a conflicting-metadata
    arm whose fields accidentally coincide is not a control.
  - Report the smallest contamination magnitude at which the positive control still fails, since test
    power below one bit is not established by the main design.
  - Report every out-of-contract read attempt individually rather than as a count, since one is fatal
    and the identity of the read is the finding.
  - Report the operand-order results per summation order rather than pooled.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report immediately on any out-of-contract read; the read location is the deliverable.
  - Halt and report if the contaminated positive control passes the matched-pair test, since no other
    result is interpretable.
  - No compute cap is needed; the entire matrix runs in seconds.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The real evaluator returns an exactly zero matched-descriptor difference on all
    three pinned arms with zero out-of-contract reads and bitwise-identical output across summation
    orders, matches exponent-predicted movement on every sensitivity rung within tolerance, while
    the contaminated control fails the matched-pair test and the inert control fails the sensitivity
    ladder.
  falsification_criterion:
  - Nonzero matched-descriptor difference for the real evaluator.
  - Any out-of-contract read.
  - The contaminated positive control passes the matched-pair test.
  - The inert control passes the sensitivity ladder.
  - Measured movement disagrees with the exponent prediction beyond tolerance on any rung.
  - Output differs across summation orders, showing the arithmetic path is not exact.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-72e5e5
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The declared input contract for a real FrodoKEM bound cannot be written until a transcription
    is filed; a Coordinator must decide whether the certificate is earned now against the synthetic
    stand-in and re-earned later, or deferred.
  - Test power below one bit of contamination is not established; a Coordinator should decide whether
    a finer positive-control ladder is required before the certificate is treated as gating.
  - The handling of non-monomial terms in the sensitivity ladder is unspecified and must be settled
    before the certificate can be extended to a real bound.
