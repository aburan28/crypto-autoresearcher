      t_star_equals_m_star_at_every_degree: true
      t_star_note: >
        The joint (m, t) optimum coincides with the t = m optimum at all ten
        degrees, which is the same boundary optimum RUN-SEMBIN-aa5161 found on
        n = 250..600, now confirmed to extend down to n = 97. The three
        conventions' stage-1 figures are identical at every degree for that
        reason.
      cells_at_m_grid_cap: 0
      vow_baseline_shifts_no_sign: true
      vow_baseline_note: >
        The vOW TOTAL-WORK column moves every margin by a constant 0.175 bits
        and changes no sign. It is NOT the coherent-baseline correction of
        H-SEMBIN-97ea23, which is a fixed-memory-budget metric worth +85 in n,
        and which is CITED rather than recomputed here.
    controls:
      C-REPRO: pass
      C-REPRO_detail: >
        Five cells of the frozen run's curve_charged (n = 250, 300, 302, 400,
        571) reproduce through this run's call path to within 1e-3 in log2 cost
        and exactly in m. Run aborts otherwise; it did not abort.
      C-FLOOR: diagnostic -- FINDING
      C-FLOOR_detail: >
        The absorbed model's returned crossover TRACKS THE SEARCH FLOOR exactly:
        n_lo = 20 -> 20, n_lo = 100 -> 100, n_lo = 250 -> 250, with first-cell
        margins of -0.63, -23.84 and -78.75 bits. The charged model returns 302
        at both n_lo = 20 and n_lo = 250. So the frozen run's
        crossover_cofactor_absorbed = 250 is its own search floor and the
        derived shift_upward_from_charging = 52 is a difference against a
        quantity that does not exist. Filed as CORR-20260917-02cfe6. The
        charged crossover of 302 is floor-independent and STANDS.
      C-CAP: pass
      C-CAP_detail: no degree's optimizing m sits at the grid cap of 30
      controls_reported: 3
    valid: true
    invalid_reason: null
    halted: null
    preregistered_prediction_refuted: false
    preregistered_prediction_note: >
      All three predictions CONFIRMED. P1: no Certicom binary degree is below
      rho; margins run +20.3 to +56.4 bits. P2: the FIPS sign pattern is exactly
      as predicted, 163/233/283 losing and 409/571 winning against naive rho,
      with 283 the closest loser at +6.1 bits. P3: the absorbed crossover tracks
      n_lo. Confirmation of a prediction derived from an already-computed
      crossover is weak evidence and is not presented as more: P1 and P2 follow
      arithmetically from the frozen crossover of 302 once the degrees are known,
      so the informative content is the per-degree margins and P3, not the signs.
    certificate:
      kind: none
      verified: true
      verifier: no-claim
      note: >
        Pure derivation. No discrete log is solved, no relation is claimed and
        no polynomial system is solved, so there is nothing to certify under
        docs/claims-and-verification.md.
  protocol_deviations: []
  scope:
    claim_tier: heuristic_estimate
    what_this_is: >
      Arithmetic on Semaev's own published cost model at ten chosen n. Not a
      measurement, not a new algorithm, not an attack, and not a statement about
      the security of any curve.
    inherited_assumptions:
      - >
        Assumption 1 (d_F4 <= 4), inherited wholesale. EV-ICPERF-a8080e reports
        it reproduces at every cell n <= 21 on the subspace family it actually
        names. NOTHING IS KNOWN ABOUT IT AT ANY n IN THIS TABLE -- the smallest
        row here is 97, more than four times the largest cell ever checked.
        Every row is conditional on an assumption verified nowhere near where it
        is used, and no row may be quoted without that condition.
      - eq. (11)'s yield taken as realized rather than as an upper bound
      - the block-structured n^{4 omega} solving cost of Section 4.5.2
      - HEUR-VOW-CURVE (unvalidated), for the vOW total-work column only
    what_it_does_not_touch:
      - >
        The security of any Certicom challenge curve or any FIPS curve, in
        either direction. A model putting a figure below 2^{n/2} is not an
        attack and not a break.
      - Semaev's asymptotic bound (17), which stands under Assumption 2.
