  approval_note: >
    UNAPPROVED. The contract is `specified`, not `approved`, and no Coordinator
    decision authorizes this execution. It is archived so its numbers are
    auditable and reproducible, not so they can be cited: no evidence record
    may rest on this run and no hypothesis moves on it until a Coordinator
    approves EXP-SEMBIN-992e73 and an independent reviewer reads it. Recording
    this plainly is the point; an unapproved run archived without saying so is
    the defect, not the run itself.
  purpose: >
    Evaluate the frozen, already-accepted joint (m, t) balance instrument of
    EXP-SEMBIN-81dc96 at the field extension degrees of every binary Certicom
    challenge curve and every FIPS binary curve, and report the optimized cost,
    the optimizing (m, t) and the margin against rho at each. Carry a
    search-floor probe on the frozen crossover routine.
  status: completed
  stage: derivation
  code:
    instrument:
      path: experiments/EXP-SEMBIN-81dc96/code/joint_balance.py
      sha256_recorded_in: raw-result.json -> instrument.sha256
      modified: false
      modified_note: >
        The instrument is LOADED, never edited and never re-implemented. That is
        load-bearing for the search-floor probe: a probe run against a
        re-implementation could not say anything about the frozen run's own
        figures, only about the copy.
    driver:
      path: experiments/EXP-SEMBIN-992e73/code/curve_table.py
      role: >
        selects which n to evaluate, reads the degrees from the frozen sources,
        runs the reproduction gate and the probes, and formats the table. It
        contains no cost model.
    commit: f1531fde6
    dirty: true
    dirty_paths:
      - '?? experiments/EXP-SEMBIN-992e73/'
    dirty_note: >
      HEAD at execution was f1531fde6 and the ONLY untracked path was this
      experiment directory itself -- the driver, this run directory and its
      artifacts, none of which can exist in the commit that produces them. They
      are committed at 43373cfad. The file that computes every cost number,
      experiments/EXP-SEMBIN-81dc96/code/joint_balance.py, was already committed
      and unmodified at f1531fde6, which is what reproducibility of this run
      actually requires: the driver selects n and formats, the instrument
      computes.
    command: python3 experiments/EXP-SEMBIN-992e73/code/curve_table.py
    command_exact_path: command.txt
    determinism: >
      Deterministic and seedless. Integer parameter sweeps over transcribed
      formulas; no random value is drawn anywhere.
  inference:
    requested_policy: executor-implementation
    canonical_policy: executor-implementation
    backend: null
    provider: null
    resolved_model_id: null
    resolved_model_id_note: >
      Left null rather than filled from session configuration. No model is in
      the measurement loop: every number is deterministic standard-library
      arithmetic, and a model identifier here would suggest otherwise.
    fallback_used: true
    fallback_reason: >
      this runtime cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the single
      model the session runs on. Recorded rather than silently substituted.
    independent_session: false
    independent_session_note: >
      NOT independent. The same session wrote the driver, ran it, and is
      reporting it. No independent review has read this run.
