  inputs:
    frozen_sources:
      - inputs/SEMAEV-2015-310/
      - inputs/BAILEY-2009-541-ECC2K130/talk-35minutes_text.md
      - inputs/SAFECURVES-20260825/specs/sp800-186.txt
      - inputs/SAFECURVES-20260825/specs/sec2-v2.txt
    seed: null
    seed_note: seedless derivation; no random value is drawn
    parameters:
      n_evaluated: [97, 109, 131, 163, 191, 233, 239, 283, 409, 571]
      n_provenance: >
        READ FROM FROZEN SOURCES, NOT RECALLED, and the check caught an error.
        A recalled list had 359 as a binary Certicom degree; the frozen level-2
        table shows the 359-bit entry is ECCp-359, a PRIME-field curve, so
        there is NO binary Certicom challenge at 359 and it is absent from this
        table. The Certicom "Bits" column is the field extension degree, which
        is checkable because ECC2K-130 appears at 131.
      m_range: [2, 30]
      t_range: [2, m]
      omega: 3.0
      omega_linear_algebra_stage2: 2.0
      macaulay_degree_bound_D: 4
      solving_cost_reading: block_n4w
      k_reading: unceiled
      cofactor: charged
      conventions_reported:
        - stage1_only, t = m  (Section 4.5.2's own)
        - stage1_only, joint over (m, t)
        - stage1 + stage2, joint over (m, t)
      rho_baselines:
        - 2^{n/2} (naive; the instrument's own)
        - 0.886 x 2^{n/2} (vOW total work, H-SEMBIN-97ea23, HEUR-VOW-CURVE unvalidated)
      field_bits: null
      field_bits_note: >
        No field is instantiated and no curve is touched. The n values are
