experiment:
  id: EXP-PFDR-2ffdfa
  hypothesis_id: H-PFDR-673eed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run of EXP-PFDR-2ffdfa exists. Thresholds, definitions
    and predictions are frozen before execution and may change only by a versioned
    protocol_amendment filed BEFORE the affected data is generated. NOTHING HERE
    IS A MEASUREMENT.

  title: >-
    Localising the failure of the representation technique for ECDLP - does the
    loss sit in the representation count or in the modular filter, measured by the
    gap between a free-residue and a charged-residue fitted cost exponent, against
    an identical-code integer subset-sum positive control.

  objective: >-
    Decide, by measurement rather than by argument, whether the
    Howgrave-Graham-Joux and Becker-Coron-Joux family fails for ECDLP because the
    representations are absent or because they are unaddressable. Measure the
    representation multiplicity R on a group arm and on an integer arm built from
    the SAME code, and measure the fitted cost exponent under a filter modulus
    swept as a power of the group order, once with the target residue supplied
    free by an oracle and once with it charged at its true cost. The gap between
    those two exponents is the price of the missing ingredient.

  inputs:
    group_arm:
      instances: >-
        Toy prime-order curve groups at N about 2^16, 2^20, 2^24 and 2^28, at
        least 20 instances per size, each generated with a KNOWN scalar k so that
        every returned answer is checkable against ground truth.
      encoding: >-
        k written in base B with m = log_B N digits and generator set the powers
        of B applied to P. B declared per size so that m lies in {8, 10, 12}.
      alphabet: >-
        Enlarged digit alphabet from -B to 2B exclusive, with digit carries
        handled by the declared exact identity and the carry handling unit-tested
        against brute-force enumeration at m at most 12 and B at most 2^4.
    integer_control_arm:
      construction: >-
        Integer subset-sum instances at the IDENTICAL (B, m, alphabet) with a
        KNOWN target, solved by the SAME implementation with only the pairing
        oracle swapped. THIS IS A CURVE-FREE ARM - no elliptic curve, no group law
        and no point arithmetic appears in it.
      purpose: >-
        POSITIVE CONTROL WITH KNOWN EXPECTED BEHAVIOUR. The family is supposed to
        help here. If it does not, the implementation does not reproduce the
        published family and no ECDLP conclusion is admissible from this run.
    dl_nearby_object_arm:
      construction: >-
        Discrete logarithm in the multiplicative group of a toy prime field at
        matched size, where index calculus supplies the missing filter through
        smoothness of the integer lift.
      purpose: >-
        PROVES-TOO-MUCH CONTROL. The closure argument must FAIL to close the
        family here. An argument that closes it in both settings has proved too
        much.
    residue_arms:
      free: >-
        An oracle supplies k mod M at zero charge. AN EXPERIMENTAL DEVICE WITH NO
        COUNTERPART IN ANY ATTACK, labelled as such in every artifact that carries
        its numbers.
      charged: >-
        No oracle; the residue is guessed and the work is multiplied by exactly M,
        charged in the same unit.
    filter_sweep:
      exponents: 'mu in {0, 0.1, 0.2, 0.3}'
      modulus: 'M = ceil(N^mu), so M reaches about 2^8 at N = 2^28'

  controls:
  - >-
    C-INTEGER-POSITIVE (BLOCKING, RUNS FIRST). The identical-code integer arm with
    a known target. It must beat its own meet-in-the-middle baseline at mu = 0.3
    by a margin whose confidence interval excludes zero. Failure stops the run;
    no ECDLP arm is interpreted.
  - >-
    C-BSGS-EMBEDDING (BLOCKING). At mu = 0 the group implementation must reproduce
    the harness BSGS charged operation count on the same instances, within the
    declared implementation-overhead ratio, which is recorded before the sweep.
  - >-
    C-CARRY. The enlarged-alphabet representation count is verified by brute-force
    enumeration at m at most 12 and B at most 2^4 against the closed form. An
    overcount here is the single most likely way to get a wrong R.
  - >-
    C-GROUND-TRUTH. Every instance carries a known k. Any run that returns a wrong
    scalar, or that returns a correct scalar without a verifiable certificate, is
    INVALID.
  - >-
    C-DL-NEARBY (PROVES-TOO-MUCH). The closure argument applied to prime-field
    multiplicative discrete logarithm must NOT close the family there.
  - >-
    C-RNG-AUDIT-SCOPE. The digit-distribution arm operates ONLY on scalars emitted
    locally by a NAMED PUBLIC RNG IMPLEMENTATION whose source is recorded. NO
    DEPLOYED PUBLIC KEY IS TOUCHED, no live key is targeted, and the arm is
    labelled an implementation audit in every artifact.
  - >-
    C-BASELINES-MATCHED. Pollard rho with negation and BSGS on the same group
    instances in the same charged unit, mandatory under RQ-ECDLP-002.

  independent_variables:
  - arm - group, integer_control, dl_nearby
  - group order N in {2^16, 2^20, 2^24, 2^28}
  - filter exponent mu in {0, 0.1, 0.2, 0.3}
  - residue arm - free or charged

  metrics:
    primary:
    - >-
      R, the representation multiplicity, a dimensionless count of ordered pairs
      of alphabet-valid digit vectors summing to the target, per instance, on the
      group arm and on the integer arm.
    - >-
      e_free(mu), the fitted cost exponent, dimensionless, equal to
      log2(charged group operations) divided by log2(N), fitted by least squares
      across the four sizes at fixed mu, with a confidence interval.
    - >-
      e_charged(mu), the same quantity with the residue guess charged at factor M.
    - >-
      exponent_gap(mu) = e_charged(mu) - e_free(mu), dimensionless, the measured
      price of the missing ingredient.
    secondary:
    - charged operations per instance, in group-operation equivalents
    - peak table size in entries and in bits, for the memory charge
    - integer-arm fitted exponent and its meet-in-the-middle baseline
    - BSGS and Pollard rho charged operations and BSGS memory in bits, per instance
    - certificate verification result per solved instance
    - digit-histogram chi-square statistic for the named-RNG audit arm, dimensionless
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The pair of fitted exponents (e_free(mu), e_charged(mu)) as mu is swept, and
      the multiplicity difference R_group minus R_integer.
    formula: >-
      R_group - R_integer = 0 exactly on every instance. e_free(0.3) at most 0.45
      with a strictly negative fitted slope in mu. e_charged(mu) at least 0.48 for
      every mu. exponent_gap(0.3) at least 0.05.
    source: >-
      The R identity is a consequence of the exact carry-counting identity and is
      derived, not fitted. The exponent thresholds are pre-registered decision
      thresholds chosen so that the two competing explanations - the loss is the
      filter, versus the loss is the count - predict opposite behaviour of the
      same curve within the swept range. They are NOT derived from any theorem and
      are recorded as thresholds.

  scale_relevance:
    tier: toy
    justification: >-
      Group orders from 2^16 to 2^28. The fitted exponents are fitted over four
      sizes spanning 12 bits, which bounds their precision; the confidence
      interval is reported with every exponent. No transfer to cryptographic sizes
      is claimed and the record states that the exponent gap measured here is a
      toy-scale quantity.
    correspondence: null

  tail_checks:
  - >-
    The minimum R over all sampled k on each arm must be strictly positive. An
    all-zero tail would break the family for a reason other than the filter and
    must be reported separately rather than absorbed into the headline.
  - >-
    The largest observed charged-operation count on the group arm is compared
    against the birthday prediction for its size; a value materially below it at
    the charged arm is escalated under the pre-registered handling rather than
    reported.

  replication:
    seeds: [20260904, 20260905, 20260906]
    independent_instances: 3
    seeds_policy: >-
      One master seed per run recorded in the manifest, from which instance
      generation, scalar generation, residue-guess ordering and alphabet sampling
      are derived by a declared deterministic stream. Every instance is
      reproducible from the master seed and its index. Seeds are fixed before
      execution; no seed is redrawn after an outcome is seen.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 12
    maximum_memory_gb: 16
    maximum_runs: 8
    maximum_workers: 1
    memory_note: >-
      The representation technique is memory-heavy by construction. The 16 GB cap
      is the reason N = 2^28 is the largest size in the sweep; a size that exceeds
      the cap is not attempted and its absence is recorded as a budget statement,
      never as a result.

  stopping_rules:
  - >-
    SR1 BLOCKING. C-INTEGER-POSITIVE runs first. If the integer arm does not beat
    its own meet-in-the-middle baseline at mu = 0.3 the run stops and reports an
    implementation failure. No group arm is interpreted.
  - >-
    SR2 BLOCKING. C-BSGS-EMBEDDING at mu = 0 must pass before the sweep runs.
  - >-
    SR3. C-CARRY must pass at the small enumerable sizes before R is reported at
    any larger size.
  - >-
    SR4. If e_charged(mu) falls below 0.45 at any mu, the run STOPS immediately,
    records the observation and the instance, and escalates. No further arm runs
    and no record states an excess before an independent review-adversarial
    session has examined it.
  - >-
    SR5. Budget exhaustion stops the run and the receipt reports the cells
    completed. A budget stop is an infrastructure receipt, never a negative result.

  invalidation_rules:
  - >-
    Any returned scalar disagrees with the known ground truth, or a claimed solve
    carries no independently re-verified certificate.
  - >-
    The group arm and the integer arm are charged in different units, or their
    conversion is not recorded.
  - >-
    The carry handling is found to overcount R against brute-force enumeration.
  - >-
    The free-residue oracle is used, even once, in an arm labelled charged.
  - >-
    Any deployed public key, live key or wallet is touched by any arm. This is a
    hard prohibition under RQ-ECDLP-002 and its violation voids the entire run.
  - >-
    A timeout, crash or memory exhaustion is recorded as failed_infrastructure and
    is NEVER counted as negative mathematical evidence.

  success_criterion: >-
    R_group equals R_integer exactly on every instance, e_free(0.3) at most 0.45
    with a strictly negative slope in mu, e_charged(mu) at least 0.48 throughout,
    and exponent_gap(0.3) at least 0.05, WITH C-INTEGER-POSITIVE, C-BSGS-EMBEDDING
    and C-CARRY all discharged. That combination localises the obstruction in the
    filter and prices it, which is the whole deliverable.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) R differs between arms - the
    localisation instrument is broken; nothing is concluded in either direction.
    (F2) e_free(0.3) exceeds 0.48 - supplying the residue free buys nothing, so
    the filter is NOT the obstruction and H-PFDR-673eed S2 is FALSIFIED; the loss
    lies elsewhere and the most likely place is the representation count, which
    the R measurement then localises. (F3) e_charged(mu) falls below 0.45 at any
    mu - S2 is falsified in the direction that would matter; the pre-registered
    escalation in SR4 applies and no record states the excess before independent
    review. (F4) The integer positive control fails - the run is INVALID in both
    arms. (F5) The closure argument also closes the family for prime-field
    multiplicative discrete logarithm - it has proved too much and is wrong
    somewhere unexamined.

  required_artifacts:
  - per-instance R on the group arm and on the matched integer arm, with the carry accounting
  - per-instance charged operations and peak table size, per mu, per residue arm
  - fitted e_free(mu) and e_charged(mu) with confidence intervals and the fit residuals
  - exponent_gap(mu) per mu
  - C-INTEGER-POSITIVE result against its meet-in-the-middle baseline
  - C-BSGS-EMBEDDING ratio at mu = 0
  - C-CARRY brute-force comparison table
  - certificate and ground-truth verification per solved instance
  - matched Pollard rho and BSGS charged operations and BSGS memory in bits
  - C-DL-NEARBY outcome, stated as whether the argument closes the family there
  - named-RNG digit-audit source identification, sample size and chi-square result
  - command, environment, seeds, pinned versions and resource measurements

  limitations:
  - >-
    SCOPE. Toy group orders from 2^16 to 2^28, one implementation, four filter
    exponents. A negative result closes exactly the HGJ and BCJ family at those
    parameters and nothing else. It is NOT a lower bound on ECDLP.
  - >-
    THE SOURCE IDEA''S BAND WAS BROKEN AND WAS WIDENED. Its minimal test - N about
    2^24 with M in {3, 5, 7} - has a predicted net movement of exactly 1.00,
    because the filter gain of at most log2(7) bits and the guess cost of exactly
    the same factor cancel by construction against a 12-bit BSGS budget. The
    replacement measures a fitted exponent across four sizes with mu swept to 0.3.
    The full argument is in H-PFDR-673eed band_non_degeneracy.
  - >-
    THE FREE-RESIDUE ARM IS NOT AN ATTACK AND ITS EXPONENT MAY NEVER BE QUOTED AS
    ONE. It exists only to price the missing ingredient by difference against the
    charged arm.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The source idea''s
    claim B(iii) - a digit-distribution bias in DEPLOYED ECDSA and ECDH scalars -
    cannot be tested at any scale by any experiment, because histogramming the
    digits of k requires k, which is the secret the public key hides and whose
    recovery is the ECDLP and is forbidden by RQ-ECDLP-002. This contract tests
    only the strictly narrower statement about scalars from a named local RNG
    implementation, which carries NO information about deployed keys. The original
    claim is recorded here as untestable rather than quietly replaced by the
    narrower one.
  - >-
    Fitted exponents over four sizes spanning 12 bits have limited precision and
    every reported exponent carries its confidence interval. A gap of 0.05 in
    exponent is 1.4 bits at N = 2^28 and is near the resolution of the design;
    that is why the run-to-run spread is measured first and reported.
  - >-
    NO CURVE-FREE-NULL AMBIGUITY ARISES HERE, and the reason is recorded. The
    integer arm is deliberately curve-free and is a POSITIVE control - the family
    is expected to work there. The claim under test is a DIFFERENCE between the
    curve arm and the curve-free arm, so a curve-free object reproducing the group
    arm''s behaviour would falsify the hypothesis rather than deflate it, which is
    the opposite configuration from the usual null.
  - >-
    Memory, not time, is the binding constraint. The largest reachable size is set
    by the 16 GB cap and its absence at larger sizes is a budget statement.

  assigned_to: executor
  approved_by: null
