experiment:
  id: EXP-JINV-5f8695
  hypothesis_id: H-JINV-db2776
  derived_from_idea: IDEA-20260807-51675e
  question_id: RQ-JINV-8fc13a
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Affected-versus-safe scope audit of deployed prime-field curves by the pair (D_0, |Aut|) -
    a nine-square-test discriminant decision validated against factoring on a toy fixture, a
    per-curve bit table against the negation-inclusive rho baseline, and a nearby-object control
    at small |D_0| with |Aut| = 2 that must report exactly zero
  objective: >-
    The one uncertainty a run reduces - which deployed prime-field curves are actually affected by
    the established special-j automorphism discount, and by how many bits. A run establishes (i)
    whether deciding D_0 by perfect-square tests reproduces a factoring-based computation exactly on
    a toy fixture, which is a hard gate on everything else; (ii) the per-curve classification
    (j, D_0 or a swept bound, |Aut|, extra discount as a ratio and in bits) for every prime-field
    curve in the corpus with published parameters, with every other cell marked OPEN and its reason
    named; (iii) whether the discount at small-but-not-minimal |D_0| is exactly zero, which is the
    structural separation the whole audit exists to establish; and (iv) whether the classification is
    constant on a toy isogeny class and across the sextic twists of a j = 0 curve, which is what makes
    it a permanent family property rather than a snapshot. No attack is mounted, no parameter
    recommendation changes, and the largest number the run can produce is below one bit.
  what_this_is_not:
  - >-
    Not an attack, a key recovery, a distinguisher, or a cryptanalytic result. It is a scope audit.
  - >-
    Not a security claim about any deployed system, and not a recommendation to change any parameter.
  - >-
    Not an upper bound on all possible special-j effects. It quantifies the ESTABLISHED one only, and
    any other effect found in this lane extends the table by a superseding record.
  - >-
    Not a pairing-security statement. Some audited curves are separately pairing-friendly; that is a
    different axis owned by a different lane and no claim about it is made here.
  - >-
    Not a claim about curves over extension fields or binary fields, which carry larger endomorphism
    structure and are outside every number produced.
  - >-
    Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: standardized
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - for each audited prime-field curve with published parameters, its
      j-invariant, its fundamental discriminant (or a certificate that |D_0| exceeds the swept bound),
      its rational automorphism group order, and therefore its extra rho discount over this program's
      negation-inclusive baseline convention, exactly. Plus the structural statement that the affected
      set is exactly {D_0 = -3, D_0 = -4} and that seven of the nine class-number-one discriminants
      confer nothing. WHAT DOES NOT FOLLOW - that any audited curve is secure; that no other structure
      exists; that the tabulated bits are realised in practice, since the fruitless-cycle escape
      overhead at |Aut| = 6 is NOT charged and the table is therefore an upper bound on the realised
      advantage; and nothing at all about non-prime fields.
  inputs:
    procedure: >-
      STAGE 0 (zero compute). Freeze the sweep bound, the fundamental-discriminant convention, the
      baseline convention (negation already included in 0.886 sqrt(N)), and the exact list of corpus
      curves to be audited with the source path of each curve's parameters.
      STAGE 1 (minutes, HARD GATE). Validate the audit on the toy fixture - at least 200 curves at 16
      to 24 bits where t^2 - 4p is factorable outright, including deliberately constructed D_0 = -3 and
      D_0 = -4 instances and deliberately constructed small-|D_0|-with-|Aut|=2 instances. The
      square-test route and the factoring route must agree on 100 percent. A single disagreement halts
      the line.
      STAGE 2 (minutes, HARD GATE). Run the isogeny-class invariance check on one complete toy class
      and the sextic-twist check on the six twists of one j = 0 curve. Both must pass before any
      deployed curve is audited.
      STAGE 3 (seconds). Run the audit over every corpus prime-field curve with published parameters -
      compute j, t, D, the nine square tests, and the sweep to the frozen bound; emit (j, D_0 or a
      greater-than-bound certificate, |Aut| from j together with p mod 3 and p mod 4, extra discount as
      a ratio and in bits). EVERY CELL IS EITHER A COMPUTED VALUE OR THE LITERAL STRING OPEN with its
      reason; never a recalled one.
      STAGE 4 (seconds). Transcription cross-check - for every curve reported j = 0, independently
      verify that the linear coefficient vanishes in the published equation; for every reported
      j = 1728, verify the constant coefficient vanishes. This is nearly circular by construction and
      is included precisely because it catches transcription errors in the stored parameters, which are
      the realistic failure mode.
      STAGE 5 (zero compute). Emit the bit table with, per curve, the subgroup bit size, the baseline
      cost, the discounted cost and the bit difference, with a caption stating plainly that no entry
      moves any parameter recommendation, that the maximum entry is log2(sqrt(3)), and that the
      fruitless-cycle overhead is not charged.
    instrument: >-
      Python 3.11 standard-library integer arithmetic only - exact perfect-square testing by integer
      square root with an exact squaring check, NO floating point anywhere in the discriminant path.
      One modular inversion per curve for j. A SEPARATE and INDEPENDENTLY WRITTEN factoring-based D_0
      routine, used only on the toy fixture and never on a deployed curve. Toy isogeny-class
      enumeration by a single vectorised quadratic-character table sweep. Curves supplied in Montgomery
      or Edwards form are converted to short Weierstrass first and the conversion is recorded in the
      output row. Recorded through harness/runner.py.
    parameters: >-
      Sweep bound B = 10^6, frozen in Stage 0 and reported alongside every negative cell. The nine
      class-number-one discriminants {-3, -4, -7, -8, -11, -19, -43, -67, -163} tested by nine square
      tests. Toy fixture at 16 to 24 bits with at least 200 curves. One complete toy isogeny class at a
      prime small enough for full enumeration. Six sextic twists of one j = 0 curve. Scope - prime
      fields with p > 3 only. Standardized parameter sets - every prime-field curve the corpus names
      with published parameters, with the pseudorandomly generated standardized families and the j = 0
      families both included, and every other cell OPEN.
  controls:
  - >-
    N1 KNOWN-POSITIVE SET. Toy curves constructed deliberately with D_0 = -3 (vanishing linear
    coefficient, p congruent to 1 mod 3) and D_0 = -4 (vanishing constant coefficient, p congruent to 1
    mod 4). The audit must classify 100 percent of them correctly.
  - >-
    N2 KNOWN-NEGATIVE SET. Toy curves with random coefficients whose D_0 is computed independently by
    factoring t^2 - 4p. The audit must not report a small |D_0| for any curve whose factored D_0 is
    large. FALSE POSITIVES ARE THE DANGEROUS ERROR, because a false positive puts a deployed curve in
    the affected column.
  - >-
    N3 ISOGENY-CLASS INVARIANCE. Enumerate a complete small toy isogeny class and confirm the audit
    returns the SAME D_0 for every curve in it. An audit whose answer varies within a class is wrong,
    and this control catches errors the other two cannot.
  - >-
    N4 SEXTIC-TWIST CHECK. The six sextic twists of a j = 0 curve all have j = 0 but lie in different
    isogeny classes with different traces. The audit must report j = 0 and D_0 = -3 for all six despite
    the differing traces. If it does not, it is confusing the class with the curve.
  - >-
    NEARBY-OBJECT CONTROL, AND IT IS THE ONE THAT CARRIES THE STRUCTURAL CLAIM. A deliberately
    constructed toy curve with D_0 = -163 (and a second with D_0 = -7). The hoped-for conclusion 'small
    discriminant means weaker' FAILS there and the audit must report a discount of EXACTLY 0.000. A tool
    that reports any discount for D_0 = -163 has not identified the load-bearing structure.
  - >-
    DECAY CONTROL. Sweep |D_0| upward from 3 and report the discount at each value. The reported discount
    must be log2(sqrt(3)) at 3, log2(sqrt(2)) at 4, and EXACTLY 0.000 at every larger |D_0|. A discount
    that decays gradually with |D_0| rather than dropping to zero immediately after 4 is wrong.
  - >-
    TRANSCRIPTION CROSS-CHECK. Reported j = 0 must coincide with a vanishing linear coefficient in the
    published equation, and reported j = 1728 with a vanishing constant coefficient.
  independent_variables:
  - curve (each audited prime-field curve, and each toy fixture curve)
  - '|D_0|, swept from 3 upward for the decay control'
  - 'D_0 decision route: nine square tests / bounded square-test sweep / independent factoring (toy only)'
  - curve model as published (short Weierstrass / Montgomery / Edwards, with the conversion recorded)
  - 'membership in a toy isogeny class, and twist index among the six sextic twists'
  metrics:
    primary:
    - >-
      toy_agreement_count - exact integer counts, the number of toy fixture curves on which the
      square-test D_0 equals the factoring-based D_0, out of the fixture size. Exact integer equality,
      no tolerance.
    - >-
      per_curve_classification - one row per audited curve giving p, the published coefficients, the
      group order, the prime subgroup order, the cofactor, j, D_0 or the literal certificate that
      |D_0| exceeds the swept bound, |Aut| (with p mod 3 and p mod 4 shown), the extra discount as a
      ratio, and the extra discount in bits. Cells not computed read OPEN with a reason.
    - >-
      decay_profile - the reported extra discount in bits at |D_0| = 3, 4, 7, 8, 11, 19, 43, 67, 163
      and at a sample of larger |D_0|. Required values are log2(sqrt(3)), log2(sqrt(2)), then exactly
      0.000 everywhere after 4.
    - >-
      max_extra_discount_bits - the largest extra discount over the whole audited corpus, in bits.
      Required to be exactly log2(sqrt(3)); anything larger is impossible over prime fields with
      p > 3 and indicates a bug.
    secondary:
    - >-
      the sweep bound used, and the number of square tests actually performed per curve.
    - >-
      pass/fail of N1, N2, N3, N4, the nearby-object control and the transcription cross-check, each
      reported BEFORE any classification row is emitted.
    - >-
      the enumerated list of every cell marked OPEN with its reason, and the count.
    - >-
      the model-conversion record for every curve not published in short Weierstrass form.
    - >-
      per-curve wall time and the total audit wall time, to substantiate the claim that the audit is
      cheap.
  heuristic_under_test: null
  heuristic_under_test_note: >-
    Explicitly null. There is no heuristic in this contract - every step is exact integer arithmetic or
    a textbook classification, and there is nothing to sample, seed or fit. The only non-derived input
    is the classical list of class-number-one discriminants, which the bounded sweep does not rely on.
  preregistered_prediction:
    quantity: >-
      Four quantities, fixed before any run exists. (1) toy_agreement_count. (2) The classification of
      the j = 0 family. (3) The classification of the pseudorandomly generated standardized families.
      (4) max_extra_discount_bits.
    formula: >-
      The extra discount over the negation-inclusive baseline is sqrt(|Aut|/2), i.e. log2(sqrt(3)) at
      j = 0 with p congruent to 1 mod 3, log2(sqrt(2)) at j = 1728 with p congruent to 1 mod 4, and
      exactly 0 otherwise. PREDICTED - toy_agreement_count equals the fixture size exactly; the j = 0
      family classifies as (D_0 = -3, |Aut| = 6, log2(sqrt(3)) bits); the pseudorandom standardized
      families classify as (|D_0| > B, |Aut| = 2, 0.000 bits); max_extra_discount_bits equals exactly
      log2(sqrt(3)). Under the null that small discriminant by itself confers a discount, the decay
      profile would be nonzero at |D_0| in {7, ..., 163}; it is predicted to be exactly zero there.
    source: >-
      Pre-registered in the parent proposal IDEA-20260807-51675e, predictions block, before any run
      under this contract exists. Quoting sqrt(6) rather than sqrt(3) here would double-count negation
      against this program's own baseline convention and overstate the discount by half a bit; the
      convention is fixed in Stage 0 and is not revisable after a run.
  scale_relevance:
    tier: standardized
    justification: >-
      The audit runs DIRECTLY on the deployed, standardized curve parameters - there is no scale gap in
      the audited quantity, because computing j and D_0 from published parameters costs the same at 256
      bits as at 16. The one place toy scale appears is the VALIDATION fixture, where D_0 must be
      computable a second, independent way (by factoring t^2 - 4p) so the square-test route can be
      checked against it. The transfer assumption is narrow and stated - that a routine which reproduces
      factoring-based D_0 exactly on 16-to-24-bit inputs also does so at 256 bits, which holds because
      the routine is exact integer arithmetic with no size-dependent approximation anywhere. That
      assumption is what makes the no-floating-point requirement a contract obligation rather than a
      style preference.
    correspondence: >-
      D_0 is a function of the trace and is therefore constant on an F_p-isogeny class, and j = 0
      requires D_0 = -3, so the affected set is FIXED AT CURVE GENERATION TIME and cannot be enlarged by
      any attacker action - not in polynomial time, not in exponential time, not at all, because the
      target does not exist in the class. This is what makes the audit a permanent classification.
  tail_checks:
  - >-
    Report the smallest |D_0| found among the pseudorandomly generated standardized families, and how far
    it sits below the swept bound. A near-miss is reported as a near-miss, not as a clean negative.
  - >-
    Report, for every negative cell, the bound actually swept. 'Not small' certifies only 'greater than B'
    and never anything stronger.
  - >-
    Report the number of audited curves whose parameters required a model conversion, since a conversion
    error changes j and is the most likely route to a wrong row.
  - >-
    Report the count and the fraction of OPEN cells. An audit with OPEN cells is a correct audit; one with
    guessed cells is fabrication, and the fraction is what tells a reader how much of the corpus the scope
    statement actually covers.
  replication:
    seeds:
    - 20260825
    - 20260826
    - 20260827
    independent_instances: 3
    note: >-
      The deployed-curve audit is fully deterministic and the three instances must agree bit-for-bit. The
      seeds control only the random-coefficient draw of the N2 known-negative toy set, which is regenerated
      independently per instance so that a lucky draw cannot hide a false-positive tendency.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
  - >-
    HALT if the toy fixture shows any disagreement between the square-test route and factoring. No
    deployed curve is audited until the tool is fixed, and the fix is a new contract, not a repair of this
    one.
  - >-
    HALT if N3 or N4 fails. The audit is reading the curve rather than the class and no classification is
    emitted.
  - >-
    HALT the emission of any row whose published parameters are not in the corpus; that cell stays OPEN and
    the executor does not fill it from memory.
  - >-
    Stop at the frozen sweep bound. Extending it after seeing a negative cell is a different experiment and
    needs an amendment.
  - >-
    Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a
    negative result (AGENTS.md rule 5).
  invalidation_rules:
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure and is
    NEVER negative mathematical evidence (AGENTS.md rule 5).
  - >-
    A run in which any table cell is filled from recall rather than computed or marked OPEN is
    invalid_measurement and, under AGENTS.md rule 5 on fabrication, is the most serious defect this contract
    can suffer.
  - >-
    A run in which the discriminant path uses floating-point arithmetic anywhere is invalid_measurement; the
    perfect-square test must be exact integer arithmetic at every size.
  - >-
    A run in which the control arms (N1 to N4, the nearby-object control, the decay control) were not
    executed in the same invocation as the audit is invalid_measurement.
  - >-
    A run that quotes the discount against the full group order rather than the prime-order subgroup is
    invalid_measurement - that is an accounting error of up to half the log of the cofactor.
  - >-
    A run whose parameters differ from this frozen contract is a DIFFERENT experiment and needs a new
    contract; it is never a repair of this one.
  success_criterion: >-
    ALL FIVE of the following, each decidable from the primary metrics. (1) toy_agreement_count equals the
    fixture size exactly. (2) N1, N2, N3, N4, the nearby-object control, the decay control and the
    transcription cross-check all PASS, and their verdicts are reported before any classification row.
    (3) per_curve_classification is emitted for every corpus prime-field curve with published parameters,
    with every other cell marked OPEN and its reason named. (4) decay_profile is emitted at every listed
    |D_0|. (5) max_extra_discount_bits is reported. NOTE that success means THE AUDIT WAS RUN AND VALIDATED;
    whether the hypothesis is supported is decided by the pre-registered prediction and the falsification
    criteria, and a completed run that refutes S2 is a successful run.
  falsification_criterion:
  - >-
    toy_agreement_count is less than the fixture size - S1 is FALSE as implemented. The tool misclassifies a
    discriminant, which would put a wrong entry in a scope table; the line halts and nothing is audited.
  - >-
    decay_profile is nonzero at any |D_0| in {7, 8, 11, 19, 43, 67, 163} - S2 is FALSE as implemented; the
    tool conflates CM with extra automorphism, which is exactly the scope error this contract exists to
    prevent.
  - >-
    max_extra_discount_bits exceeds log2(sqrt(3)) - S3 is violated. This is impossible over prime fields with
    p > 3 and therefore indicates a bug rather than a discovery.
  - >-
    Any audited curve reports |Aut| outside {2, 4, 6} - impossible; a bug.
  - >-
    D_0 varies within the toy isogeny class, or the six sextic twists do not all report D_0 = -3 - the
    isogeny-invariance premise fails for the tool and every number is void.
  - >-
    A pseudorandomly generated standardized curve classifies with |D_0| <= B - SURPRISING AND SIGNIFICANT.
    Not reported until independently replicated under AGENTS.md rule 12; the first hypothesis to test is a
    transcription error in the stored parameters.
  required_artifacts:
  - >-
    manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block and
    environment
  - >-
    raw-result.json carrying every per-curve row and every toy-fixture comparison, not summaries
  - >-
    the control arms' results (N1 to N4, nearby-object, decay, transcription cross-check) in the same file
    as the audit, with their verdicts timestamped before the audit rows
  - >-
    the frozen Stage-0 declaration of the sweep bound, the discriminant convention and the baseline
    convention, hashed
  - >-
    the enumerated OPEN-cell list with a reason per cell, and the source path of every curve's published
    parameters
  - >-
    the bit table with its caption, including the explicit statement that the fruitless-cycle overhead is
    not charged and the tabulated bits are an upper bound on the realised advantage
  assigned_to: executor
  approved_by: null
  approval_gate:
  - >-
    Coordinator approval is required before execution. This contract is NOT approved; approved_by is null,
    execution_authorized is false and frozen is false (AGENTS.md rule 1). Approval is the user's gate because
    it authorizes execution and spends compute.
  - >-
    The Coordinator must confirm the baseline convention before approval - this program's 0.886 sqrt(N)
    ALREADY INCLUDES the negation discount, so the extra discount is sqrt(|Aut|/2) and not sqrt(|Aut|). Getting
    this wrong overstates every affected row by half a bit.
  - >-
    The exact corpus curve list and the source path of each curve's published parameters should be pinned at
    approval, because a curve added after the freeze is a different audit.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260807-51675e
    authored_at: '2026-08-25'
    note: >-
      Design, controls, metrics and criteria are taken from the parent proposal's mechanism, controls,
      required_metrics, predictions and falsification_conditions and restated as a contract. Boilerplate
      identical across contracts by program rule comes from a fixed table. Budgets come from the parent's
      declared estimated_cost (implementation low, compute low; the parent states the whole audit completes in
      well under a second and the minimal test in under a minute). NO NUMBER IS INVENTED and no curve's
      classification is asserted here - the parent's family attributions are treated as CLAIMS TO BE CHECKED by
      the run, which is exactly the discipline the parent itself requires.
  derivation_gaps:
  - >-
    The exact corpus curve list is not enumerated here. It must be frozen in Stage 0 with a source path per
    curve, because a list assembled while the audit runs is a list assembled to produce a wanted table.
  - >-
    The fundamental-discriminant convention (whether a candidate d is admitted at 0 or 1 mod 4) is the single
    most likely implementation slip and is named as such by the parent. It must be fixed and stated in Stage 0.
  - >-
    The toy fixture's construction rule is described (at least 200 curves at 16 to 24 bits, with constructed
    positives and negatives) but its exact generation procedure is not specified. It must be frozen before
    Stage 1, since a fixture regenerated after a failure is not a validation.
  - >-
    The fruitless-cycle escape overhead at |Aut| = 6 is explicitly NOT charged and this program has not
    measured it. That makes the bit column an upper bound; a Coordinator wanting a realised-advantage number
    must commission that measurement separately, and this contract must not be cited as supplying it.
