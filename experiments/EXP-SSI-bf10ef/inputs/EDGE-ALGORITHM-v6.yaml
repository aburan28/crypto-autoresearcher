edge_algorithm:
  id: EDGE-ALGORITHM-v6
  format: EDGE-ALGORITHM-v6
  status: design_manifest_no_implementation
  version: 6
  typed_domain_frame:
    domain_code: 40
    body_schema: 1
    body_fields:
      - source_curve_id: curve_id bytestring
      - destination_curve_id: curve_id bytestring
      - degree: signed560
      - factor_count: u16
      - factors: factor_count signed560 values, sorted and duplicate-free
      - opcode_count: u16
      - opcodes: opcode_count records of opcode(u8)||operand_schema(bytestring)||foe_rule(u8)
      - witness_schema: bytestring naming exact witness fields and equations
      - transcript_schema_digest: 32-byte digest of the implementation transcript schema
    frame_rule: >-
      The complete DOMAIN-v6 frame is the sole algorithm input identity. Its
      domain digest is included in every EDGE-TRANSITION-v6 witness frame and
      every semantic replay receipt. No provider-supplied algorithm name or
      unframed source program is accepted.
  required_semantics:
    source_destination_check: exact source and destination curve ids are recomputed
    degree_check: degree is positive and equals the typed witness degree
    factor_check: factors are sorted, bounded, and reproduce the degree relation
    field_operation_check: every field opcode has fixed operand widths and charge rule
    hnf_check: v11 deterministic HNF rules are replayed from the serialized matrix
    witness_check: every changed matrix row has a typed witness equation
    transcript_check: every input, output, and intermediate digest is recomputed
  implementation:
    implementation_digest: null
    source_tree_commit: null
    independent_edge_replay_receipt: null
    missing_implementation_is: INVALID_CERTIFICATE
  admission:
    measured: false
    provider_work_is_transport_only: true
    missing_algorithm_or_replay_is: INVALID_CERTIFICATE
    freeze_allowed: false
