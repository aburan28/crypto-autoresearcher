control_reference:
  id: SYNTHETIC-REF-v6
  format: SYNTHETIC-REF-v6
  status: design_manifest_no_measurement
  experiment_id: EXP-SSI-bf10ef
  cells: 8
  targets_per_cell: 16
  cell_seed: >-
    SHA256 of DOMAIN-v6 domain_code=70 body_schema=1 containing cell_index(u64 LE).
  target_frame: >-
    SYN-TARGET-v6 is raw 237 bytes: cell_index(u64)||target_index(u64)||
    target_id(32)||state_num(signed560)||state_den(unsigned560)||attempts(u64)||
    successes(u64)||target_digest(32). Denominator is positive and gcd-reduced;
    target_id is SHA256 of DOMAIN-v6 domain_code=71 over cell_seed||cell_index||target_index.
  recurrence: >-
    For each ordered target, next_num=num+successes, next_den=den+attempts,
    and query_foe accumulates exact signed560 FOE. Censoring is explicit and a
    censored target invalidates its cell rather than becoming zero.
  cell_frame: >-
    Cell payload is cell_index(u64)||cell_seed(32)||target_count(u64=16)||
    target_frames(16*237)||cell_digest(32). cell_digest is SHA256 of the raw
    cell payload with only cell_digest omitted; the eight complete cell payloads
    are followed by table_digest=SHA256(concatenation of those payloads).
  admission:
    measured_cells_present: false
    independent_verification_receipt: null
    missing_reference_is: INVALID_CONTROL
    freeze_allowed: false
