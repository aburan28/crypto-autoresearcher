control_reference:
  id: C-PAIR-REF-v6
  format: C-PAIR-REF-v6
  status: design_manifest_no_measurement
  experiment_id: EXP-SSI-bf10ef
  seed_schedule:
    seed_frame: >-
      SHA256 of DOMAIN-v6 domain_code=60 body_schema=1 containing
      advice_digest(32)||replicate_index(u64 LE); replicate indices are 0..31.
    replicate_count: 32
    seed_list_encoding: (replicate_index(u64 LE)||seed(32)) in ascending index order
    seed_list_digest: SHA256(concatenation of the 32 complete seed derivation frames)
  generator: >-
    For each seed, select endpoint indices by the same canonical hash ranking as
    owner_selection but with domain_code=61 and replicate seed. Reject duplicate
    endpoints in ascending rank order; endpoint_count is fixed before rows.
    The complete generator rule is in the v11 frame table and carries no source
    file, provider, or asserted row input.
  row_frame: >-
    C-PAIR-ROW-v6 is raw 384 bytes: row_tag(u8=28)||replicate_index(u64)||seed(32)||
    owner_set_digest(32)||endpoint_set_digest(32)||helper_digest(32)||
    index_digest(32)||trace_digest(32)||terminal_code(u8)||attempt_count(u64)||
    success_bit(u8)||total_foe(signed560)||memory_peak(signed560)||row_digest(32).
    row_digest is SHA256 of the raw C-PAIR-ROW-v6 bytes with only row_digest
    omitted; it is not a digest of a containing row or table.
  finite_table: >-
    The table is exactly 32 ordered row frames followed by finite_table_digest.
    The digest and rows are absent until a bounded control run and independent
    replay receipt exist.
  admission:
    measured_rows_present: false
    independent_verification_receipt: null
    missing_reference_is: INVALID_CONTROL
    freeze_allowed: false
