experiment:
  id: EXP-SSI-bf10ef
  version: 11
  schema: SSI-CANONICAL-v11
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: null
  hypothesis_note: >-
    Deliberately null. This is a design-only successor that repairs the v10
    contract; it is not an executed cryptanalytic hypothesis or result.
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-b0c877
  source_proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
  direct_predecessor: EXP-SSI-7b1469
  predecessor_contract: experiments/EXP-SSI-7b1469/specification.yaml
  supersedes: EXP-SSI-7b1469
  title: >-
    SSI-CANONICAL-v11 complete frame tables, target-free advice, deterministic
    semantic gates, and finite replay/cost accounting
  objective: >-
    Define one byte-recomputable, design-only contract for the fixed-advice
    classical OneEnd boundary. V11 explicitly distinguishes top-level frames
    from non-object subrecords, gives every top-level field and digest preimage,
    makes target-bound index construction phase 1 rather than fixed advice,
    binds finite seeds and terminal counts, makes event and memory accounting
    trace-recomputable, and refuses provider/oracle or semantic-path admission
    until the required typed algorithms and controls are materialized.
  claim_ceiling: >-
    At most a statically reviewable contract for a named finite construction and
    its pending admission inputs. It cannot establish a OneEnd attack, a lower
    bound, an exponent change, a security result, an all-advice theorem, or a
    result for EndRing, Isogeny, SQIsign, CSIDH, SIDH, or deployed systems.
  metrics:
    required: [validity_status, terminal_code, total_foe, total_bytes, memory_bytes, success_bit, break_even_q]
    note: No metric is populated by this design record and no run is authorized.
  budget:
    wall_clock_seconds: 1200
    memory_gb: 2
    maximum_runs: 0
    note: Zero runs are permitted by this design-only successor.
  success_criterion: >-
    Not applicable until the semantic algorithm, provider trust, controls, and
    incumbent inputs are independently materialized and reviewed; this record
    is not evidence-eligible.
  falsification_criterion: >-
    The contract is falsified as byte-recomputable if two conforming serializers
    can produce different bytes for any top-level frame, declared subrecord,
    digest preimage, terminal dependency, event, buffer interval, replay arm,
    control row, or semantic admission predicate.

  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    predecessor_contract: experiments/EXP-SSI-7b1469/specification.yaml
    predecessor_validator: coordination/goals/GOAL-SSI-001/batches/BATCH-cdcf50/reviews/TASK-20260809-80c7d5/validation_report.yaml
    predecessor_red_team: coordination/goals/GOAL-SSI-001/batches/BATCH-cdcf50/reviews/TASK-20260809-68dca1/red_team_report.md
    predecessor_evidence: ledger/evidence/EV-SSI-770b21.yaml
    predecessor_decision: ledger/decisions/DEC-20260809-6c3274.yaml
    incumbent_gate: experiments/EXP-SSI-16649a/inputs/INCUMBENT-FOE-v1.yaml
    frame_registry: experiments/EXP-SSI-bf10ef/inputs/FRAME-REGISTRY-v6.yaml
    provider_trust: experiments/EXP-SSI-bf10ef/inputs/PROVIDER-TRUST-v6.yaml
    edge_algorithm: experiments/EXP-SSI-bf10ef/inputs/EDGE-ALGORITHM-v6.yaml
    c_pair_control: experiments/EXP-SSI-bf10ef/controls/C-PAIR-REF-v6.yaml
    synthetic_control: experiments/EXP-SSI-bf10ef/controls/SYNTHETIC-REF-v6.yaml
  lineage_rule: >-
    EXP-SSI-7b1469 and all earlier contracts are immutable provenance only. No
    width, default, formula, digest, terminal, cost, or semantic rule is
    inherited unless it is repeated in this v11 contract. This file and its
    named v11 inputs are the only active interpretation.

  scope:
    problem: >-
      The instance is a canonically encoded supersingular j-invariant E over
      F_{p^2}. The target is classical OneEnd/EndRing path finding without a
      published secret torsion image, SQIsign transcript, or CSIDH secret.
      SIDH/SIKE torsion-image recovery is excluded as a positive target.
    advice_quantifier: >-
      For every selected p, A_p consists only of the complete vertex manifest,
      target-free owner selection, order manifest, helper frame, and their
      source-bound inputs. The target index and every query frame are phase-1
      material generated after E is selected. The scoped formula is
      forall p exists fixed A_p forall E in V_p.
    prohibited_claims:
      - all-advice lower bound
      - uncharged provider, path, factor, or torsion-image oracle
      - hidden preprocessing or memory
      - quantum query or quantum memory claim
      - deployed-parameter security conclusion

  wire:
    outer_frame: >-
      Every top-level object is tag(u8)||version(u8=6)||payload_len(u32
      little-endian)||payload(payload_len exact bytes). A top-level digest is
      the final payload field and equals SHA256 of the complete outer frame with
      only that final digest field omitted. There are no raw top-level objects.
    bytestring: u32 little-endian body length followed by exactly body bytes; UTF-8 text is NFC-prohibited and binary fields are opaque.
    widths:
      u8: 1
      u16: 2
      u32: 4
      u64: 8
      digest: 32
      signed560: sign(u8=0 positive,1 negative)||magnitude(70 bytes little-endian); negative zero rejected; magnitude <2^560
      unsigned560: magnitude(70 bytes little-endian), strictly less than 2^560
      curve_id: version(u8=1)||j0(field_bytes)||j1(field_bytes), with p-row fixed field_bytes and canonical coefficients
    subrecord_rule: >-
      A subrecord is not an object and has no tag, version, payload_len, or
      independent digest. It occurs only at the byte range named by a containing
      top-level frame. Every subrecord has one exact schema, width, zero/empty
      rule, and containing-frame digest. The only v11 subrecords are SLOT,
      INDEX-RECORD, ENDPOINT, EVENT, BUFFER, OP, SATURATION-ROW, ARM-RESULT,
      C-PAIR-ROW, SYN-TARGET, and PAYLOAD. TRANSITION is a top-level frame and
      is never embedded as an unframed object. No subrecord may be passed to a
      verifier as a standalone frame.
    domain_frame: >-
      DOMAIN-v6 is top-level tag 2. Its payload is domain_code(u16)||body_schema
      (u8)||body bytestring||domain_digest(32). The digest is over the complete
      DOMAIN-v6 outer frame without domain_digest. Every derivation below uses
      a complete DOMAIN-v6 frame as its preimage; ASCII labels are schema names,
      never implicit raw bytes.
    registry_frame: >-
      FRAME-REGISTRY-v6 is tag 1. Its payload is entry_count(u16)||entry records
      in ascending tag order||registry_digest(32). Each entry is tag(u8)||
      name(bytestring)||schema_digest(32)||final_field_code(u8). The registry
      digest covers the complete tag-1 frame without registry_digest. Admission
      rejects a null digest, duplicate tag/name, unknown version, or a frame not
      listed byte-for-byte in the registry input.
    digest_catalog: >-
      The final digest rule applies to every top-level frame. Embedded digest
      fields are ordinary 32-byte fields whose exact containing-frame preimage
      is named in the table below. The exceptions are stream_digest and
      transition_root, whose dependency-breaking preimages are explicit below;
      neither exception is circular.

  registry_table:
    entries:
      - {tag: 1, name: FRAME-REGISTRY-v6, schema_digest: null, final_field_code: 1, digest: registry_digest}
      - {tag: 2, name: DOMAIN-v6, schema_digest: null, final_field_code: 2, digest: domain_digest}
      - {tag: 3, name: SSJ-MANIFEST-v6, schema_digest: null, final_field_code: 3, digest: manifest_digest}
      - {tag: 4, name: ADVICE-v6, schema_digest: null, final_field_code: 4, digest: advice_digest}
      - {tag: 5, name: TARGET-MANIFEST-v6, schema_digest: null, final_field_code: 5, digest: target_digest}
      - {tag: 6, name: ORDER-v6, schema_digest: null, final_field_code: 6, digest: order_digest}
      - {tag: 7, name: HELPER-v6, schema_digest: null, final_field_code: 7, digest: helper_digest}
      - {tag: 8, name: TARGET-INDEX-v6, schema_digest: null, final_field_code: 8, digest: index_digest}
      - {tag: 9, name: SEED-LIST-v6, schema_digest: null, final_field_code: 9, digest: seed_list_digest}
      - {tag: 10, name: BUILDER-REQUEST-v6, schema_digest: null, final_field_code: 10, digest: request_digest}
      - {tag: 11, name: OWNER-RECORD-v6, schema_digest: null, final_field_code: 11, digest: record_digest}
      - {tag: 12, name: NULL-RECORD-v6, schema_digest: null, final_field_code: 12, digest: null_digest}
      - {tag: 13, name: BUILDER-TERMINAL-v6, schema_digest: null, final_field_code: 13, digest: terminal_digest}
      - {tag: 14, name: EDGE-CERT-v6, schema_digest: null, final_field_code: 14, digest: certificate_digest}
      - {tag: 15, name: PROVIDER-TRUST-v6, schema_digest: null, final_field_code: 15, digest: trust_digest}
      - {tag: 16, name: PROVIDER-RECEIPT-v6, schema_digest: null, final_field_code: 16, digest: receipt_digest}
      - {tag: 17, name: EDGE-TRANSITION-v6, schema_digest: null, final_field_code: 17, digest: transition_digest}
      - {tag: 18, name: PROVIDER-SIGN-MESSAGE-v6, schema_digest: null, final_field_code: 18, digest: sign_digest}
      - {tag: 19, name: MATRIX-v6, schema_digest: null, final_field_code: 19, digest: matrix_digest}
      - {tag: 20, name: OP-LOG-v6, schema_digest: null, final_field_code: 20, digest: op_log_digest}
      - {tag: 21, name: SATURATION-v6, schema_digest: null, final_field_code: 21, digest: saturation_digest}
      - {tag: 22, name: OUTPUT-v6, schema_digest: null, final_field_code: 22, digest: output_digest}
      - {tag: 23, name: EVENT-TRACE-v6, schema_digest: null, final_field_code: 23, digest: trace_digest}
      - {tag: 24, name: PAIR-REQUEST-v6, schema_digest: null, final_field_code: 24, digest: pair_request_digest}
      - {tag: 25, name: ARM-TRACE-v6, schema_digest: null, final_field_code: 25, digest: arm_digest}
      - {tag: 26, name: SHARED-TRACE-v6, schema_digest: null, final_field_code: 26, digest: shared_digest}
      - {tag: 27, name: FINAL-IDENTITY-v6, schema_digest: null, final_field_code: 27, digest: identity_digest}
      - {tag: 28, name: C-PAIR-REF-v6, schema_digest: null, final_field_code: 28, digest: c_pair_digest}
      - {tag: 29, name: SYNTHETIC-REF-v6, schema_digest: null, final_field_code: 29, digest: synthetic_digest}
    subrecords: >-
      SLOT-v6=96 bytes; INDEX-RECORD-v6=192 bytes; ENDPOINT-v6=512 bytes;
      EVENT-v6=177 bytes; BUFFER-v6=32 bytes; OP-v6=196 bytes;
      SATURATION-ROW-v6=110 bytes; ARM-RESULT-v6=193 bytes;
      C-PAIR-ROW-v6=384 bytes; SYN-TARGET-v6=237 bytes; TRANSITION-v6 is a
      top-level frame at tag 17, so it is never embedded as an unframed object.

  bounds:
    p_rows:
      - {p_code: 1, label: SQISign-I, field_bytes: 32, security_bits: 256}
      - {p_code: 2, label: SQISign-V, field_bytes: 64, security_bits: 512}
    vertex_count_max: 4000000
    owner_count_min: 2
    owner_count_max: 8388607
    endpoint_count_min: 2
    endpoint_count_max: 7
    target_count_max: 2000000
    selection_count: 4
    helper_capacity_max: 524288
    requested_owner_count_max: 15000
    attempts_max: 32768
    graph_steps_max: 1048576
    max_reason_bytes: 1024
    max_pair_draws: 8388607
    max_events: 350000
    max_buffers: 65535
    max_edge_count: 80000
    max_transition_factors: 8
    max_hnf_operations: 200000
    max_matrix_rows: 512
    max_matrix_columns: 512
    source_blob_max: 67108864
    trace_bytes_max: 67108864
    output_bytes_max: 8388608

  frame_table:
    manifest: >-
      tag 3 payload is p_code(u8)||p_expression(bytestring)||vertex_count(u64)||
      curve_ids(bytestring)||manifest_digest(32). curve_ids is exactly
      vertex_count curve_id bodies in ascending index order; manifest_digest is
      the tag-3 frame without its final digest.
    advice: >-
      tag 4 payload is p_code(u8)||manifest_digest(32)||advice_seed(32)||
      owner_count(u64)||owner_indices(owner_count*u64)||owner_set_digest(32)||
      source_domain_frame(bytestring)||order_digest(32)||helper_digest(32)||
      advice_digest(32). owner_indices are the hash-ranked target-free set
      defined below; source_domain_frame is a complete DOMAIN-v6 frame and is
      not an executable opaque source blob. advice_digest is final.
    target_manifest: >-
      tag 5 payload is p_code(u8)||manifest_digest(32)||target_count(u64)||
      target_indices(target_count*u64)||target_digest(32), with ascending unique
      indices. It is selected after A_p is committed and is not part of A_p.
    order: >-
      tag 6 payload is p_code(u8)||owner_count(u64)||owner_indices(owner_count*u64)||
      owner_set_digest(32)||order_seed(32)||order_digest(32). The exact order
      equals the advice owner set; the digest is final.
      helper: >-
      tag 7 payload is p_code(u8)||owner_set_digest(32)||order_digest(32)||
      capacity(u64)||slot_count(u64)||slot_body(slot_count*96)||
      payload_blob(bytestring)||helper_digest(32). SLOT-v6 is raw metadata only:
      slot_tag(u8=193)||state(u8)||pair_key(32)||owner_index(u64)||endpoint_index(u64)||
      payload_offset(u64)||payload_length(u32)||payload_digest(32)||reserved(u16=0).
      Empty slots are 96 zero bytes. A nonempty slot must point into the one
      complete PAYLOAD-BLOB-v6 bytestring. That bytestring body is
      payload_count(u64)||ordered complete PAYLOAD-v6 raw records. PAYLOAD-v6
      is owner_index(u64)||endpoint_index(u64)||degree(signed560)||
      factor_count(u16)||factors(factor_count*signed560)||
      matrix_frame(bytestring)||payload_flags(u8)||payload_digest(32); its
      digest is SHA256 of the raw record with only payload_digest omitted.
      Ranges are disjoint, sorted by (owner_index,endpoint_index), and every
      slot pointer and payload length must identify exactly one record.
    target_index: >-
      tag 8 is phase 1. payload is p_code(u8)||target_digest(32)||advice_digest(32)||
      map_digest(32)||target_count(u64)||selection_count(u8=4)||record_width(u16=192)||
      records(target_count*4*192)||index_digest(32). INDEX-RECORD-v6 is raw and
      exactly 192 bytes: record_tag(u8=8)||target_index(u64)||selection_code(u8)||branch_code(u8)||
      owner_index(u64)||endpoint_index(u64)||pair_key(32)||helper_digest(32)||
      slot_index(u64)||payload_offset(u64)||payload_length(u32)||payload_digest(32)||
      query_key(32)||reserved(17). It is never described as fixed advice.
    seed_list: >-
      tag 9 payload is p_code(u8)||request_seed(32)||attempt_count(u64)||
      pairs(attempt_count*(attempt_index(u64)||attempt_seed(32)))||
      seed_list_digest(32). Indices are exactly 0..attempt_count-1, seeds are
      unique, and attempt_seed is SHA256 of a complete DOMAIN-v6 frame with
      domain_code=3 and body_schema=1 containing request_seed and index. No
      uniformity assertion is made for a finite list; seed_list_digest is final.
    request: >-
      tag 10 payload is p_code(u8)||advice_digest(32)||target_digest(32)||
      request_id(u64)||request_seed(32)||seed_list_digest(32)||attempt_count(u64)||
      request_digest(32), exactly 177 payload bytes and 183 complete bytes.
      request_digest binds the complete frame without itself and the seed-list
      frame must match request_seed and attempt_count.
    owner: >-
      tag 11 is exactly 4096 bytes: outer prefix||owner_index(u64)||
      endpoint_count(u32)||endpoint subrecords||zero padding||record_digest(32).
      The digest is immediately final in the payload; padding precedes it and
      its length is the exact remainder. ENDPOINT-v6 is 512 bytes with
      endpoint_index, curve_id bytestring, pair_key, slot pointer fields,
      payload_digest, zero padding, and endpoint_digest as its final field.
    null: >-
      tag 12 is exactly 4096 bytes: position(u64)||null_reason(u8)||
      request_digest(32)||owner_index(u64=0)||endpoint_count(u32=0)||
      zero endpoint digest(32)||zero padding||null_digest(32). The digest is
      final in the payload and its preimage excludes only that digest.
    terminal: >-
      tag 13 payload is request_digest(32)||terminal_code(u8)||
      terminal_position(u64)||requested_count(u64)||emitted_count(u64)||
      retained_count(u64)||candidate_count(u64)||reason(bytestring)||
      stream_digest(32)||terminal_digest(32). stream_digest is SHA256 of the
      request frame, every emitted fixed stride, and the terminal frame with
      both stream_digest and terminal_digest omitted. terminal_digest is the
      tag-13 frame with only terminal_digest omitted. This ordering breaks the
      former cycle. Counts equal recomputed stream counts; mismatch is invalid.
      Codes are ZERO_REQUEST=0, COMPLETE=1, OWNER_EXHAUSTED=2,
      CANDIDATE_CAP=3, INVALID_RECORD=4, OVERFLOW=5,
      INFRASTRUCTURE_UNAVAILABLE=6, REPLAY_IDENTITY_FAILURE=7,
      ADVICE_UNAVAILABLE=8.
    transition: >-
      tag 17 payload is p_code(u8)||source_index(u64)||destination_index(u64)||
      degree(signed560)||factor_count(u16)||sorted factors||witness_frame(bytestring)||
      transition_digest(32). transition_digest is final. The witness frame is
      a complete DOMAIN-v6 frame with domain_code=40 whose body contains the
      source/destination curve ids, degree, factors, and EDGE-ALGORITHM-v6
      program digest; a provider assertion cannot replace it.
    matrix: >-
      tag 19 payload is rows(u32)||columns(u32)||entry_count(u64)||
      row_major(entry_count*signed560)||matrix_digest(32), with entry_count=
      rows*columns and matrix_digest final. The matrix is accepted only when
      the committed EDGE-ALGORITHM-v6 transcript recomputes it from the pair
      key and factors; a self-consistent asserted matrix is invalid.
    op_log: >-
      tag 20 payload is matrix_digest(32)||operation_count(u64)||
      OP-v6 records(operation_count*196)||op_log_digest(32). OP-v6 is
      opcode(u8)||row(u64)||pivot_row(u64)||pivot_column(u64)||scalar(signed560)||
      factor_index(u32)||previous_matrix_digest(32)||next_matrix_digest(32)||
      op_digest(32), exactly 196 bytes; empty count has a digest over header only.
    saturation: >-
      tag 21 payload is matrix_digest(32)||factor_count(u16)||
      SATURATION-ROW-v6 records(factor_count*110)||saturation_digest(32).
      Each row contains factor_index(u32)||factor(signed560)||pre_digest(32)||
      post_digest(32)||bit(u8)||row_digest(32). The complete sequence and empty
      case are covered by the final digest.
    output: >-
      tag 22 payload is branch_code(u8)||scalar_class(u8)||witness_count(u16)||
      witnesses(witness_count*signed560)||matrix_digest(32)||op_log_digest(32)||
      saturation_digest(32)||output_digest(32). scalar_class 0 requires the
      exact non-scalar predicate and typed witness equations; 1 requires equal
      diagonal and zero off-diagonal; 2 is null; 3 is invalid.
    control_frames: >-
      tag 28 payload is manifest_id(bytestring)||seed_schema_digest(32)||
      row_schema_digest(32)||finite_table_digest(32)||c_pair_digest(32). tag 29
      payload is manifest_id(bytestring)||cell_schema_digest(32)||
      target_schema_digest(32)||cell_table_digest(32)||synthetic_digest(32).
      Null table digests are admission-blocking; both digests are final and
      cover their complete outer frames without the final field.
    provider_trust: >-
      tag 15 payload is provider_id(bytestring)||key_algorithm(u8=1 for Ed25519)||
      public_key(32)||key_digest(32)||anchor_source_digest(32)||trust_digest(32).
      key_digest is SHA256 of DOMAIN-v6 domain_code=50 over public_key and
      key_algorithm. Missing or null trust input is INVALID_CERTIFICATE and
      blocks freeze; no provider key is fabricated.
    provider_sign_message: >-
      tag 18 payload is p_code(u8)||target_digest(32)||target_index(u64)||
      advice_digest(32)||horizon(u64)||edge_count(u64)||path_bytes(u64)||
      artifact_digest(32)||mirror_digest(32)||mirror_path(bytestring)||
      transition_root(32)||sign_digest(32). It excludes receipt, signature,
      and transition stream bytes; sign_digest is the exact signed message.
    provider_receipt: >-
      tag 16 payload is provider_id(bytestring)||public_key(32)||
      sign_digest(32)||signature(64)||artifact_digest(32)||mirror_digest(32)||
      mirror_path(bytestring)||receipt_digest(32). The receipt verifies the
      sign-message frame under the typed trusted key. The certificate must
      byte-equal all receipt fields and path bytes.
    certificate: >-
      tag 14 payload is p_code(u8)||target_digest(32)||target_index(u64)||
      advice_digest(32)||horizon(u64)||edge_count(u64)||path_bytes(u64)||
      provider_receipt(bytestring)||mirror_path(bytestring)||artifact_digest(32)||
      mirror_digest(32)||transition_root(32)||transition_frames(bytestring)||
      certificate_digest(32). transition_frames are complete tag-17 frames,
      path_bytes is their exact concatenated length, edge_count is their count,
      sources chain to destinations, and first/last vertices are checked. The
      root is SHA256 of a complete DOMAIN-v6 domain_code=51 containing ordered
      transition digest frames. A trusted provider is transport only; the
      EDGE-ALGORITHM-v6 verifier must prove each edge.
    event_trace: >-
      tag 23 payload is phase(u8)||event_count(u64)||events(event_count*177)||
      buffer_count(u32)||buffers(buffer_count*32)||trace_digest(32). EVENT-v6 is
      phase(u8)||event_code(u16)||primitive_code(u8)||operation_count(u64)||
      input_bytes(u64)||hash_blocks(u64)||byte_units(u64)||event_foe(signed560)||
      operand_digest(32)||event_digest(32), exactly 177 bytes. BUFFER-v6 is
      buffer_id(u64)||allocation_step(u64)||release_step(u64)||bytes(u64),
      exactly 32 bytes. Release at step k excludes the
      buffer at k; allocation at k includes it at k. The trace verifier sums
      event_foe, serialized input/output bytes, and live buffers exactly.
    replay: >-
      tag 24 PAIR-REQUEST-v6 payload is p_code(u8)||advice_digest(32)||
      target_digest(32)||attempt_index(u64)||target_index(u64)||query_key(32)||
      branch_code(u8)||treatment_owner(u64)||null_owner(u64)||draw_count(u64)||
      null_mutation_digest(32)||pair_request_digest(32). tag 25 ARM-TRACE-v6
      payload is pair_request_digest(32)||arm_code(u8)||arm_input_digest(32)||
      event_trace_digest(32)||normalized_digest(32)||output_digest(32)||
      arm_digest(32), exactly 193 payload bytes. tag 26 SHARED-TRACE-v6 is
      shared_prefix_digest(32)||pair_request_digest(32)||event_count(u64)||
      normalized_digest(32)||shared_digest(32). tag 27 FINAL-IDENTITY-v6 is
      target_digest(32)||advice_digest(32)||attempt_index(u64)||
      shared_digest(32)||treatment_arm_digest(32)||null_arm_digest(32)||
      identity_bit(u8)||identity_digest(32). Shared bytes are exactly the
      canonical prefix through pair_request_digest; arm-specific bytes never
      enter shared_digest. Null draws are bounded by max_pair_draws and every
      rejected draw is serialized.

  deterministic_rules:
    owner_selection: >-
      For fixed p, manifest_digest, and advice_seed, compute rank_i as the
      little-endian integer SHA256 of DOMAIN-v6 domain_code=10 containing
      p_code, manifest_digest, advice_seed, and vertex index i. Sort by
      (rank_i,i) and select the first owner_count indices. This is the complete
      target-free owner generator; no source interpreter, provider, or hidden
      file is allowed.
    owner_and_order_digests: >-
      owner_set_digest is SHA256 of DOMAIN-v6 domain_code=11 body_schema=1
      containing p_code||manifest_digest||advice_seed||owner_count||the ordered
      owner indices. order_digest is SHA256 of DOMAIN-v6 domain_code=12
      body_schema=1 containing p_code||owner_set_digest||order_seed||the
      ordered owner indices. The order frame must reproduce this exact digest;
      no set or order is identified by an unframed list hash.
    source_domain_frame: >-
      The advice source_domain_frame is a complete DOMAIN-v6 frame with
      domain_code=9 and body_schema=1. Its body is
      p_code(u8)||vertex_count(u64)||p_expression(bytestring)||
      curve_id_table_digest(32)||source_algorithm_digest(32)||source_blob_digest(32).
      curve_id_table_digest must equal the manifest curve-id table digest;
      source_algorithm_digest identifies the finite vertex/edge enumerator and
      source_blob_digest identifies the exact source bytes. Both source reads
      are charged as input bytes and are bounded by source_blob_max. A missing
      or untyped source frame is INVALID_ADVICE, not an implicit oracle.
    pair_key_and_query_key: >-
      pair_key is the domain_digest of DOMAIN-v6 domain_code=1 containing p,
      owner curve_id, endpoint curve_id, owner index, endpoint index. query_key
      is the domain_digest of domain_code=2 containing p, target_digest,
      advice_digest, target_index, selection_code, map_digest, and pair_key.
      The domain frame is complete and includes its outer prefix.
    edge_algorithm_gate: >-
      EDGE-ALGORITHM-v6 is a required typed input, not a prose name. It is a
      complete DOMAIN-v6 frame whose body lists finite-field operation opcodes,
      operand widths, pivot/tie rules, overflow behavior, and the source,
      destination, factor, and witness transcript schema. Until a committed
      implementation and independent edge-replay receipt bind this frame,
      every certificate is INVALID_CERTIFICATE and provider work is excluded
      from any claim. This explicit refusal is the method ceiling, not evidence.
    hnf: >-
      For column j from 0 upward, choose the lowest-index nonzero pivot row;
      ties are broken by smallest absolute entry then row index. Swap into the
      pivot row, use Euclidean truncating quotient toward zero, reduce all
      other rows to the signed remainder interval [-abs(pivot)/2,abs(pivot)/2),
      make the pivot positive, and continue. Every operation is one OP-v6;
      any intermediate outside signed560 is OVERFLOW. The final matrix and
      operation log must be recomputed, not merely digest-checked.
    saturation_predicate: >-
      A factor is saturated only when the post matrix has strictly increasing
      pivot columns, positive gcd-normalized pivots, canonical signed
      remainders in the stated interval, trailing zero rows, and a typed
      EDGE-ALGORITHM-v6 witness relation for every changed row. Empty factor
      sequences are valid only with an unchanged matrix and zero saturation rows.
    event_schedule: >-
      Event codes are numeric and unique: setup 1=manifest_read, 2=owner_rank,
      3=order_build, 4=helper_build; phase-1 100=target_index, 101=index_read,
      102=helper_read, 103=edge_check, 104=provider_receipt_verify,
      105=mirror_read, 106=hnf_operation, 107=saturation_row,
      108=output_check, 109=replay_frame, 110=terminal_write. Every primitive
      is one event with a single primitive_code; multi-primitive work emits
      multiple events in source order. SHA256 input length, signature bytes,
      mirror bytes, serialization bytes, and every read/write are included.
      total_foe is the exact sum of event_foe and total_bytes is the exact sum
      of event input_bytes across read, write, hash, signature, mirror,
      serialization, and memory events; byte_units is only the primitive charge
      unit. A mismatch is invalid.
    primitive_charge_table: >-
      primitive_code 1=field operation with foe=operation_count; 2=read and
      3=write with foe=ceil(input_bytes/64); 4=compare with the same byte
      charge; 5=SHA256 with foe=ceil((input_bytes+9)/64); 6=Ed25519 verify
      with foe=1 and input_bytes=96; 7=matrix row operation with foe=1;
      8=edge relation operation with foe=1; 9=serialization byte write;
      10=buffer allocation/release. Unused counters are zero, event_foe is
      recomputed from this table, and a single event cannot represent multiple
      primitive kinds.
    terminal_equations: >-
      requested_count equals request.attempt_count; emitted_count equals the
      number of owner/null fixed strides present; retained_count equals parsed
      non-null owner records; candidate_count equals records passing the
      candidate predicate. ZERO_REQUEST requires requested_count=0 and no
      strides; COMPLETE requires all requested owners emitted; exhaustion and
      cap codes require their corresponding recomputed predicates. Any field
      mismatch is INVALID_RECORD before terminal precedence is applied.
    memory: >-
      The event trace must contain one BUFFER-v6 row for every input frame,
      nested stream, seed list, helper/index/owner/endpoint/null/terminal frame,
      source/mirror byte buffer, matrix, factor sort, HNF log, signature context,
      digest context, replay arm, and serialization staging buffer. Bytes are
      exact serialized length or exact scratch allocation. M_advice and M_work
      are max over all allocation_step<=k<release_step; missing rows are
      INVALID_MEMORY, not an omitted buffer.

  controls_and_admission:
    c_pair: >-
      C-PAIR-REF-v6 is a design manifest with 32 deterministic seeds, exact
      endpoint/order generators, row grammar, censor limit, and finite-table
      digest. It has no measured rows in this record; missing rows or receipt is
      INVALID_CONTROL, never a negative result.
    synthetic: >-
      SYNTHETIC-REF-v6 is a design manifest with eight cells and sixteen typed
      target rows per cell, exact rational initial state and recurrence, target
      frame grammar, and cell-table digest. It has no measured cells here;
      missing cells or receipt is INVALID_CONTROL.
    incumbent: >-
      INCUMBENT-FOE-v1 must provide independently verified per-prime source,
      FOE, bytes, memory, and common setup/Q convention before comparison,
      break_even_q, freeze, or any advantage statement. Null fields keep the
      contract admission-blocked.
    hard_gates:
      - registry_digest and every declared frame schema digest are materialized
      - EDGE-ALGORITHM-v6 and independent semantic edge replay exist
      - provider trust input is typed, populated, and independently verified
      - C-pair and synthetic rows/cells and receipts exist
      - matched incumbent is independently verified
      - parser, mutation, replay, cost, and memory audits pass
      - frozen remains false and execution_authorized remains false

  proof_search_map:
    exact_baseline_reproduction: >-
      Reproduce the hash-bound incumbent source and common setup/Q convention
      before any comparison; current null fields make this audit pending.
    observation_collision_search: >-
      Mutate every tag, length, nested offset, role code, digest placement,
      terminal dependency, domain body, buffer interval, branch, and identity
      field; require rejection. No mutation artifact exists in this design.
    quantifier_order: >-
      Verify that A_p contains no target, attempt, selection, target-index, or
      provider field and that target-index construction is phase 1.
    method_ceiling_nearby_control: >-
      Use typed paired replay, C-pair, and synthetic controls. Passing them
      establishes serialization/accounting consistency only, not an SSI result.

  stopping_and_artifacts:
    stopping_rules:
      - stop on unknown frame, width mismatch, digest mismatch, overflow, pointer mismatch, semantic-edge failure, invalid control, invalid incumbent, or replay identity mismatch
      - stop after attempts_max attempts or graph_steps_max steps per attempt
      - preserve every complete censored trace and every buffer interval
      - provider/mirror unavailability is failed_infrastructure, never research evidence
    required_artifacts:
      - exact command, commit, clean state, environment, dependencies, policy, model provenance, and seeds
      - registry bytes, schema digests, every top-level frame, and all declared preimages
      - finite seed list, complete builder stream, event trace, buffer table, and replay arm frames
      - provider trust, edge algorithm, certificate, HNF/output, controls, and incumbent receipts
      - independent Validator and Red Team reports
    completion_gate:
      - every top-level and nested schema is represented in the frame table
      - every digest dependency is acyclic and byte-recomputable
      - A_p is target-free and phase-1 target material is charged
      - event and memory totals are recomputable from trace bytes
      - provider/oracle and semantic-edge gates are explicit and closed before freeze
      - execution_authorized remains false and frozen remains false
