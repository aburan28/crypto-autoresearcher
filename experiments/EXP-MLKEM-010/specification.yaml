experiment:
  id: EXP-MLKEM-010
  hypothesis_id: H-MLKEM-010
  goal_id: GOAL-MLKEM-003
  version: 1
  title: >-
    Independent recomputation of Carrier Theorem 4.1 / Table 5.1 from HAL PDF
    and authors' CodedDualAttack pickle
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-31'
  claim_tier: medium
  objective: >-
    From the Carrier et al. primary text (HAL hal-05406481) and the authors'
    public CodedDualAttack artifacts, recompute Algorithm 3.1 costs via
    Theorem 4.1, check consistency of Tables 5.1 and C.2, and locate any
    arithmetic anomalies — without claiming a cryptanalytic break or
    validating polar-decoding heuristics beyond what the cost tables encode.

  source_refs:
    literature: [KN-LIT-7617]
    prior_experiment: EXP-MLKEM-015
    code: https://github.com/kevin-carrier/CodedDualAttack
    code_commit: 9c1367f85d26038244bc83c025d84c0b7006f2ee
    pdf: experiments/EXP-MLKEM-010/vendor-lock/Carrier-2022-1750-hal-05406481.pdf

  controls:
    - id: CTRL-THM41
      description: T = Tsample + R*(N*Tdec + TFFT) from Theorem 4.1
    - id: CTRL-PICKLE
      description: optimized_withExperimentalPolar.pkl as authors' numerical witness
    - id: CTRL-TABLE51
      description: Table 5.1 claimed Algorithm 3.1 columns C0/CC/CN

  metrics:
    primary:
      - delta_pickle_vs_table51
      - delta_pickle_Tsample_vs_c2
      - thm41_matches_pickle_complexity
    secondary:
      - nist_margin_pickle_CC

  scale_relevance:
    tier: medium
    justification: Full Kyber dimensions appear in cost tables; still estimate-only.
  replication:
    seeds: []
    independent_instances: 1
  budget:
    wall_clock_seconds_per_run: 600
    maximum_runs: 2
  success_criterion: >-
    Either Table 5.1 matches Thm 4.1+intermediates within 0.25 bits on all
    nine cells, or every mismatch is localized to a specific printed cell with
    an independent artifact (pickle) deciding the correction.
  falsification_criterion: >-
    Pickle complexities disagree with Table 5.1 by >0.5 bits on a CC cell
    used in the abstract shortfall claim, with no transcription explanation.
  required_artifacts:
    - experiments/EXP-MLKEM-010/runs/RUN-MLKEM-010-001/results.json
    - experiments/EXP-MLKEM-010/runs/RUN-MLKEM-010-001/theorem41_recompute.json
  assigned_to: executor
