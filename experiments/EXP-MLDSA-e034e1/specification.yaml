experiment:
  id: EXP-MLDSA-e034e1
  hypothesis_id: H-MLDSA-1ca204
  derived_from_idea: IDEA-20260821-4c0246
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Measure the multi-target amortisation exponent alpha of SelfTargetMSIS's
    hash arm to completion at reduced parameters where every forgery carries a
    re-verified certificate, against a forced-alpha = 1 generic multi-target
    preimage control and a tr-removed / shared-A pricing variant, with the
    derived shared-absorb-prefix byte count reported beside every fitted exponent
  objective: >-
    The one uncertainty a run reduces is whether the per-target cost accounting
    that FIPS 204's category claim makes - one public key at a time - multiplies
    when a deployment holds many keys. A run establishes (i) the fitted exponent
    alpha in W(N) proportional to N^{-alpha} for the ML-DSA-shaped hash arm over
    a declared N ladder, with an interval from a 30-repetition ensemble at every
    rung; (ii) whether the SAME harness recovers alpha = 1 on generic
    multi-target preimage search, where it is forced by construction, which is
    the gate deciding whether any alpha it reports means anything; (iii) whether
    the N = 1 baseline reproduces |B_tau| expected hash evaluations against a
    fixture-recomputed challenge-space size; (iv) whether a pricing variant with
    tr removed and A shared returns a MATERIALLY LARGER alpha, which is what
    licenses the shared-absorb-prefix framing rather than merely confirming a
    constant; and (v) whether the derived shared-prefix byte count and the
    measured exponent AGREE, since a disagreement falsifies the tracked object
    rather than the scheme. No forgery against FIPS 204 parameters is attempted,
    no attack is claimed, and no exponent improvement against any published
    algorithm follows from any outcome.
  what_this_is_not:
    - >-
      Not an attack on ML-DSA and not a forgery against FIPS 204 parameters. The
      design depends on choosing tau and n so the challenge space is EXHAUSTIBLE,
      which FIPS 204's is not by roughly 150 orders of magnitude.
    - >-
      Not a measurement of the lattice arm. Its amortisation exponent is
      explicitly left open, and no statement about which arm binds as N grows
      follows from this run.
    - >-
      Not a claim over all adversaries. The existential is over IMPLEMENTED
      strategies in a named class; alpha = 0 does not prove no batched attack
      exists.
    - >-
      Not a novelty claim against the external literature. The parent's screen
      is bounded by a recorded tool truncation and by two web searches, and
      alpha = 0 for this arm may well be folklore in the Dilithium documentation.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No
      run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope - within the declared strategy class, at the
      declared reduced parameter set, over N in the declared ladder, the measured
      amortisation exponent of the ML-DSA-shaped hash arm is alpha with interval
      [a, b], while the same harness recovers alpha = 1 where it is forced and a
      pricing variant returns alpha'. WHAT DOES NOT FOLLOW - nothing about
      FIPS 204 parameters (log2|B_tau| about 24 here versus 192.760 / 225.345 /
      257.015 there); nothing about strategies outside the declared class;
      nothing about the lattice arm; nothing about which arm binds at any N; and
      no security claim in either direction. A measured alpha = 0 is a scoped
      confirmation that the standard's implicit per-target accounting multiplies
      at toy scale - it adds a number and an instrument, not a security claim.
  inputs:
    procedure: >-
      STAGE 0, THE PREFIX AUDIT (zero compute) - write out, for FIPS 204's
      commitment hash AND for the reduced-parameter surrogate, the exact byte
      sequence absorbed before the first target-dependent byte, and report that
      integer. If it is non-zero for the surrogate but zero for FIPS 204 the
      surrogate is MIS-SPECIFIED and is fixed before any run. STAGE 1,
      INSTRUMENT - implement reduced-parameter ML-DSA with tau and n chosen so
      log2|B_tau| lies in [22, 26], plus the hash-arm forger: repeatedly draw
      (y, c), compute w1 = HighBits(A y - c t) for a chosen target, compute
      c-tilde' = H(mu || w1), accept when SampleInBall(c-tilde') equals c and the
      norm predicates hold. Every accepted output is emitted as a FORGERY
      CERTIFICATE and independently re-verified by a SEPARATE verifier
      implementation. STAGE 2, THE FORCED-ONE CONTROL, WRITTEN AND RUN FIRST -
      the identical harness, table machinery and timing instrumentation on
      generic multi-target preimage search over N random 2*lambda'-bit targets,
      whose exponent is 1 by construction. It must fit alpha in [0.9, 1.1] at
      every rung before any headline arm runs. STAGE 3, THE N-LADDER - for
      N in {1, 2, 4, 16, 64, 256, 1024}, run the best BATCHED forger the
      implementer can write, explicitly including shared y, shared c, shared
      sponge state and a sorted table of target-derived values, recording total
      hash evaluations and total wall time to the first accepted forgery over at
      least 30 independent repetitions per N; fit alpha by regression of log W on
      log N and report the fit with its interval. STAGE 4, THE PRICING VARIANT -
      repeat STAGE 3 on a MODIFIED surrogate in which mu is a global constant (tr
      binding removed) AND all N keys share one matrix A, maximising the absorbed
      prefix before the first target-dependent byte. STAGE 5, HEURISTIC
      VALIDATION - the HEUR-001 and HEUR-002 plans below. STAGE 6 (zero compute)
      - assemble three fitted alphas with intervals beside three derived prefix
      byte counts, and the refusal statement for FIPS parameters and for
      strategies outside the class.
    instrument: >-
      A compiled inner loop for the hash-arm forger and for the preimage control,
      sharing ONE harness so that the forced-one control genuinely pins the same
      instrument. A SEPARATE verifier implementation, not sharing code with the
      forger, re-verifies every emitted forgery certificate per
      docs/claims-and-verification.md. Hash evaluations are counted directly, not
      inferred from wall time. Recorded through harness/runner.py with a
      manifest and source blob hashes.
    parameters: >-
      Reduced parameter set - n = 64 with tau chosen so log2|B_tau| is about 24,
      (k, l) = (2, 2), an NTT-friendly q, retaining the four rejection gates, the
      beta = tau*eta relation, and the mu = H(tr || M) / c-tilde = H(mu || w1)
      input ordering. N ladder {1, 2, 4, 16, 64, 256, 1024}. At least 30
      independent repetitions per (arm, N), drawn as an ensemble and reported as
      an INTERVAL, never as a point (KN-TECH-1a5b7e mode 5). Forced-control
      acceptance band [0.9, 1.1], declared before the run. The N public keys are
      generated independently with independent rho, matching FIPS 204 key
      generation. |B_tau| is RECOMPUTED from (n, tau) in the fixture and never
      inherited from a prior record.
  controls:
    - >-
      FORCED-ONE CONTROL (null object, hard gate, WRITTEN AND RUN FIRST) -
      generic multi-target preimage search over N random targets, whose
      amortisation exponent is exactly 1 by construction (one squeeze, N-way
      sorted-table comparison). Numeric threshold [0.9, 1.1] declared before the
      run, against the spread of the same 30-repetition ensemble used for the
      headline. If the harness cannot recover alpha = 1 there, it reports NO
      alpha anywhere. This control is MANDATORY rather than decorative precisely
      because the headline arm's expected answer IS the null value.
    - >-
      PRICING VARIANT / NEARBY-OBJECT CONTROL - tr removed and A shared across
      all N keys, so the absorbed prefix before the first target-dependent byte
      is maximised. This is the second arm whose alpha is expected to MOVE;
      without it the experiment could only confirm a constant. If it too returns
      alpha = 0, the framing is wrong.
    - >-
      N = 1 BASELINE REPRODUCTION - mean hash evaluations to a certified forgery
      at N = 1 must equal 2^{log2|B_tau|} within the 30-repetition interval, with
      |B_tau| recomputed from (n, tau) in the fixture. A curve that merely looks
      flat is not a reproduction.
    - >-
      INDEPENDENT VERIFIER - every emitted forgery certificate is re-checked by a
      separate verifier implementation that shares no code with the forger.
    - >-
      ENSEMBLE REPORTING - 30-repetition ensembles at every N, reported as
      intervals, never as points.
    - >-
      COST-UNIT SEPARATION - hash-evaluation counts and wall time are reported
      SEPARATELY at every rung, so a table-lookup or memory-hierarchy cost at
      N = 1024 cannot be mistaken for an exponent.
    - >-
      PREFIX-AUDIT CROSS-CHECK - the derived shared-prefix byte count is reported
      beside every fitted alpha, for all three arms. Agreement between the
      derived integer and the measured exponent is itself a control on the
      tracked object.
  independent_variables:
    - number of simultaneous targets N, over the declared ladder
    - >-
      arm - ML-DSA-shaped hash arm, generic multi-target preimage control, or
      pricing variant with tr removed and A shared
    - repetition index within the 30-repetition ensemble at each (arm, N)
    - >-
      batching strategy within the declared class - shared y, shared c, shared
      sponge state, sorted table
  metrics:
    primary:
      - >-
        fitted_alpha - the exponent (unitless) in W(N) proportional to N^{-alpha}
        obtained by regression of log W on log N over the declared ladder,
        reported per arm WITH its interval
      - >-
        hash_evaluations_to_first_forgery - mean and interval (unitless count of
        hash evaluations) per (arm, N), counted directly in the inner loop
      - >-
        shared_absorb_prefix_bytes - the derived number of input bytes absorbed
        before the first target-dependent byte (bytes), per arm, computed from
        the algorithm's line ordering at zero compute
      - >-
        forgery_certificates_emitted_and_reverified - two counts (unitless);
        these must be equal or the run is void
    secondary:
      - >-
        wall_clock_seconds per (arm, N), reported alongside but never in place of
        hash-evaluation counts
      - >-
        recomputed_B_tau - |B_tau| recomputed from (n, tau) in the fixture
        (unitless), and the ratio of the N = 1 mean to 2^{log2|B_tau|}
      - >-
        regression_residuals and the two half-ladder refit slopes (unitless), for
        the HEUR-002 linearity check
      - >-
        sampleinball_fibre_histogram - the exhaustively enumerated fibre-size
        distribution of SampleInBall at the reduced parameters (counts), for the
        HEUR-001 check
      - >-
        empirical_acceptance_rate over 10^7 trials (unitless), against the
        predicted 1/|B_tau|
      - >-
        table_memory_entries - O(N) target-derived table entries held at each
        rung (unitless count), so any future alpha > 0 can be charged as a triple
      - source blob hashes for the forger, the verifier and the control
  heuristic_under_test:
    - id: HEUR-001
      formal_statement: >-
        At the reduced parameters, for uniformly random (y, c) and a fixed
        target, the event SampleInBall(H(mu || HighBits(A y - c t))) = c occurs
        with probability 1/|B_tau|, uniformly over targets and independently
        across trials.
      preregistered_prediction: >-
        The exhaustively enumerated fibre-size histogram of SampleInBall matches
        a Poisson distribution with mean 2^{2*lambda' - log2|B_tau|}, and the
        empirical acceptance rate over 10^7 trials matches 1/|B_tau| within its
        sampling interval.
      prediction_source: >-
        The balls-in-bins / Poissonisation law for a random map from
        2^{2*lambda} inputs onto 2^{log2|B_tau|} outputs, RECALLED as the
        classical statement being imitated, combined with the rigorous fibre-size
        arithmetic log2|B_tau| < 2*lambda at every FIPS 204 category
        (192.760 < 256, 225.345 < 384, 257.015 < 512) as derived in
        IDEA-20260821-4c0246. Not retrieved this session.
      scale_access_and_transfer: >-
        The reduced parameters make |B_tau| about 2^24 and the input space small
        enough to enumerate EXHAUSTIVELY - that is why the fibre histogram is
        computable at all. THE TRANSFER ASSUMPTION IS STATED AND NOT DISCHARGED:
        that fibre flatness at 2^24 predicts fibre flatness at 2^192.76. The
        Poisson argument supports it; NO run under this contract measures it.
      sample_size_justification: >-
        The fibre histogram is EXHAUSTIVE, so no sampling error enters it. The
        acceptance-rate check uses 10^7 trials against a predicted rate of about
        2^{-24} = 6e-8, giving an expected count of about 0.6 successes - too few
        to resolve the rate directly, which is why the acceptance rate is
        estimated instead from the ensemble of W values at N = 1 (30 repetitions
        each running to a forgery, hence about 30 * 2^24 trials in aggregate,
        expected 30 successes) and the 10^7-trial figure is reported only as a
        consistency check with its Poisson interval stated. This asymmetry is
        disclosed rather than hidden in a round number.
      comparison_metric: >-
        Chi-square goodness of fit of the observed fibre-size histogram against
        the Poisson prediction with the matching mean.
      tail_checks:
        - >-
          The largest observed fibre against the predicted maximum of
          2^{log2|B_tau|} Poisson draws.
        - >-
          The number of EMPTY fibres against the Poisson zero-class probability,
          since an unreachable challenge would break the uniformity claim from
          the other side.
      falsification_condition: >-
        The fibre histogram departs from the Poisson prediction beyond the
        declared chi-square threshold, or the aggregate acceptance rate differs
        from 1/|B_tau| beyond its interval.
    - id: HEUR-002
      formal_statement: >-
        The number of hash evaluations to the first certified forgery at N
        targets is geometric with success parameter N-dependent only through the
        incidence structure of the batched search, so that log E[W(N)] is linear
        in log N with slope -alpha over the declared ladder.
      preregistered_prediction: >-
        The log-log regression is linear - residuals show no structure, and
        refits on the two halves of the ladder give slopes agreeing within their
        intervals. The distribution of W at N = 1 passes a chi-squared
        goodness-of-fit test against a geometric law, and the forced-one
        control's residuals behave the same way.
      prediction_source: >-
        The standard geometric model for independent Bernoulli search trials,
        conditional on HEUR-001. Internal; no external citation claimed.
      scale_access_and_transfer: >-
        Measured over N in [1, 1024] at |B_tau| about 2^24. NO transfer to FIPS
        parameters is asserted: an exponent measured over this range need not
        persist at |B_tau| = 2^192.76, and nothing here forces it to.
      sample_size_justification: >-
        At least 30 repetitions per rung, the minimum KN-TECH-1a5b7e requires for
        a generated comparator to be reported as an interval. At
        log2|B_tau| about 24 the number of forgeries per repetition is small, so
        the variance of W is large - 30 is a DECLARED MINIMUM, and if the
        resulting interval on alpha is wider than 0.10 the run reports that the
        ladder cannot resolve the effect size the contract cares about rather
        than reporting a point.
      comparison_metric: >-
        Regression residual structure, half-ladder slope agreement, and a
        chi-squared goodness-of-fit of W at N = 1 against a geometric law.
      tail_checks:
        - >-
          The largest and smallest W in each 30-repetition ensemble against the
          geometric law's corresponding quantiles.
        - >-
          Whether any rung has fewer than 30 completed repetitions; such a rung
          is excluded from the fit and reported, never imputed.
      falsification_condition: >-
        The log-log slope differs between the two halves of the ladder beyond
        their intervals, or the residuals show structure. The power law is then
        wrong and NO single alpha may be reported.
  preregistered_prediction:
    quantity: >-
      fitted_alpha for each of the three arms, and shared_absorb_prefix_bytes for
      each of the three arms.
    formula: >-
      Predicted fitted_alpha = 0.00 for the ML-DSA-shaped hash arm, with a fitted
      interval whose exclusion of 0 by more than 0.10 constitutes the POSITIVE
      finding. Predicted fitted_alpha in [0.9, 1.1] for the generic multi-target
      preimage control, declared before the run as the instrument threshold.
      Predicted fitted_alpha for the pricing variant at least 0.10 ABOVE the
      headline arm. Predicted shared_absorb_prefix_bytes = 0 exactly for the
      ML-DSA-shaped arm and full-length for the control. Predicted N = 1 mean
      hash evaluations equal to 2^{log2|B_tau|} within the 30-repetition
      interval. Under the null that the shared-prefix object does not control the
      exponent, the headline and pricing arms return the same alpha.
    source: >-
      Pre-registered in IDEA-20260821-4c0246's `predictions` and
      `null_object_control` blocks and restated in H-MLDSA-1ca204 before any run
      under this contract exists. The [0.9, 1.1] threshold is the numeric
      threshold KN-TECH-1a5b7e requires a sensitivity demonstration to declare in
      advance. Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      The design REQUIRES an exhaustible challenge space, so log2|B_tau| is about
      24 against FIPS 204's 192.760 / 225.345 / 257.015 - roughly 150 orders of
      magnitude smaller. That is not a shortcut but the precondition for running
      the hash arm TO COMPLETION and emitting certificates a separate verifier
      can re-check, which is the only way a measured exponent means anything.
      THE TRANSFER ASSUMPTION IS STATED AND NOT USED: the surrogate preserves the
      mu = H(tr || M) / c-tilde = H(mu || w1) INPUT ORDERING by construction, so
      the zero-byte shared-prefix derivation is a structural fact of the ordering
      rather than of the size; the fitted exponent, by contrast, is a
      toy-parameter measurement and is not extrapolated. A batching structure that
      appears only at large tau cannot be seen here, and absence at toy scale is
      NOT concluded to be absence.
    correspondence: null
  tail_checks:
    - >-
      Report the number of completed repetitions at every (arm, N); a rung with
      fewer than 30 is excluded from the fit and reported, never imputed.
    - >-
      Report the widest and narrowest W in each ensemble against the geometric
      law's quantiles.
    - >-
      Report the alpha interval width; if it exceeds 0.10 the run states that the
      ladder cannot resolve the effect size the contract cares about, rather than
      reporting a point estimate.
    - >-
      Report wall time and hash-evaluation counts separately at N = 1024, where
      table-lookup and memory-hierarchy costs are largest.
    - >-
      Report the largest and the empty-class fibre counts of SampleInBall against
      their Poisson predictions.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4.0
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
    - >-
      HALT before any headline arm if the forced-one control does not fit alpha
      in [0.9, 1.1]. No alpha is reported for any arm.
    - >-
      HALT if the N = 1 baseline does not reproduce 2^{log2|B_tau|} within its
      interval; the forger is not implementing the hash arm.
    - >-
      HALT if STAGE 0 finds a non-zero shared prefix for the surrogate where
      FIPS 204 has zero; the surrogate is mis-specified and is fixed before any
      run rather than measured as-is.
    - >-
      Stop at the frozen ladder and the frozen 30-repetition minimum. The
      parameter set, the ladder, the strategy class and the [0.9, 1.1] threshold
      are frozen before any arm runs and are not revised after seeing a fit.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget
      exhaustion is a stop, never a negative result (AGENTS.md rule 5).
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      ANY emitted forgery that fails the independent verifier makes the run
      completed_invalid (docs/claims-and-verification.md). No exponent from any
      arm is reportable.
    - >-
      A run whose forger and verifier share code is invalid_measurement -
      certificate re-verification would be tautological.
    - >-
      A run in which the forced-one control was not written and executed BEFORE
      the headline arm, in the same harness, is invalid_measurement. An
      unbatched forger returns alpha = 0 trivially, and this ordering is the only
      protection against it.
    - >-
      A run reporting a point estimate for any ensemble instead of an interval is
      invalid_reporting (KN-TECH-1a5b7e mode 5).
    - >-
      A run that inherits |B_tau| from a prior record rather than recomputing it
      from (n, tau) is invalid_measurement; the baseline check would then be
      circular.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT
      experiment requiring a new contract; it is never a repair of this one.
  success_criterion: >-
    STAGE 0 reports a zero-byte shared prefix for both FIPS 204 and the
    surrogate; the forced-one control fits alpha inside [0.9, 1.1] at every rung;
    the N = 1 baseline mean equals 2^{log2|B_tau|} within its 30-repetition
    interval against a fixture-recomputed |B_tau|; every emitted forgery
    certificate re-verifies under the independent verifier; the ML-DSA-shaped arm
    reports a fitted alpha with an interval of width at most 0.10; the pricing
    variant's fitted alpha exceeds the headline arm's by at least 0.10; and both
    heuristic validation arms report their comparison statistics and tail checks.
    Meeting all of these means the exponent has been MEASURED with a validated
    instrument - whatever value it took.
  falsification_criterion:
    - >-
      The forced-one control does not fit alpha in [0.9, 1.1] - the harness
      cannot detect amortisation and NO alpha is reported for any arm. Instrument
      failure, not evidence.
    - >-
      The N = 1 baseline does not reproduce |B_tau| within its interval - the
      forger is not implementing the hash arm and nothing downstream is
      reportable.
    - >-
      The pricing variant returns the same alpha as the headline arm - the
      shared-prefix object does NOT control the exponent, the framing is
      falsified, and that is the recorded finding. The named likely cause is that
      removing tr still leaves w1 target-dependent through t, and the redesign
      (sharing t as well) is part of the deliverable.
    - >-
      shared_absorb_prefix_bytes and fitted_alpha disagree - zero bytes with
      alpha above 0.1, or a large shared prefix with alpha at 0 - the tracked
      object is wrong, not the scheme.
    - >-
      The ML-DSA-shaped arm returns fitted alpha above 0.1 with the control and
      baseline passing - the POSITIVE outcome. It must be attributed to a NAMED
      batching mechanism before any interpretation; an unattributed positive
      alpha is an implementation bug until shown otherwise, and it demands
      independent replication before any record states it.
    - >-
      Any emitted forgery fails the independent verifier - the run is void.
    - >-
      Either heuristic's falsification_condition fires - that heuristic is
      refuted and every conclusion resting on it is withdrawn. In particular, a
      half-ladder slope disagreement means NO single alpha may be reported at
      all.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state,
      resolved model/inference block and environment
    - >-
      raw-result.json carrying PER-REPETITION hash-evaluation counts and wall
      times for every (arm, N) - not summaries
    - >-
      every emitted forgery certificate, plus the independent verifier's
      re-verification record for each
    - >-
      the STAGE 0 prefix audit - the exact absorbed byte sequence before the
      first target-dependent byte, for FIPS 204 and for the surrogate
    - >-
      the forced-one control's measurements, in the same file as the headline
      arm, with its fitted alpha and interval
    - the pricing variant's measurements and fitted alpha, in the same file
    - >-
      the recomputed |B_tau| used in the baseline check, with the (n, tau) it was
      recomputed from
    - >-
      the regression fit, its residuals, and the two half-ladder refits for
      HEUR-002
    - >-
      the exhaustive SampleInBall fibre-size histogram and the acceptance-rate
      estimate for HEUR-001
    - source blob hashes for the forger, the verifier, the control and the harness
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution. This contract is
      review_required and is NOT approved; `approved_by` is null and
      `execution_authorized` is false (AGENTS.md rule 1).
    - >-
      The DECLARED STRATEGY CLASS must be written out and frozen before approval.
      The whole claim is quantified over it, and a class named after the fact is
      not a claim.
    - >-
      H-MLDSA-1ca204's `proof_search_map` must be audited against KN-TECH-080
      before implementation, in particular the disclosed identifiability failure
      that "no batching structure" and "implementer did not find it" are
      observationally identical.
    - >-
      A positive branch (alpha above 0.1) requires attribution to a named
      batching mechanism plus independent replication before any record states
      it.
  derivation_provenance:
    tool: coordinator subagent, design-experiment lifecycle steps 3-5
    source_record: IDEA-20260821-4c0246
    authored_at: '2026-08-25'
    note: >-
      Stages, controls, metrics, thresholds and both heuristics are transcribed
      from the parent proposal's `mechanism`, `minimal_test`, `predictions`,
      `null_object_control`, `heuristic_assumptions`, `confounders` and
      `falsification_conditions` blocks rather than re-invented. The FIPS 204
      parameter values and the log2|B_tau| figures are CITED to the parent's own
      citations block with its fidelity caveats carried forward, and are NOT
      measurements made here. Budget follows the parent's declared
      estimated_cost (implementation medium, compute low). No field is invented;
      gaps are listed below.
  derivation_gaps:
    - >-
      THE DECLARED STRATEGY CLASS IS NOT WRITTEN OUT. The parent names four
      batching devices (shared y, shared c, shared sponge state, sorted table)
      but the quantifier is over a CLASS, and a class specified only by examples
      cannot bound a claim. A Coordinator must fix the class before approval.
    - >-
      TAU IS NOT FIXED. The parent gives n = 64 and "tau such that log2|B_tau| is
      about 24"; the exact tau, q, eta and gamma values must be chosen and frozen
      before approval, and STAGE 0 must confirm the four rejection gates and the
      beta = tau*eta relation survive the reduction.
    - >-
      THE PRICING VARIANT MAY NOT MOVE. The parent's own honest prior puts this
      at about 0.6 and names the reason: removing tr still leaves w1
      target-dependent through t, so the shared prefix may stay short. The
      redesign (sharing t as well) is named as part of the deliverable but is NOT
      specified, and a Coordinator should decide before approval whether to
      specify it now or accept a possible dead arm.
    - >-
      THE ALPHA INTERVAL WIDTH IS NOT GUARANTEED. At log2|B_tau| about 24 the
      variance of W is large and 30 repetitions is a declared minimum, not a
      power calculation. Whether 30 rungs of 30 repetitions can resolve an
      interval of width 0.10 is UNMEASURED, and if it cannot the run reports that
      rather than a point - which would make the experiment inconclusive by
      design rather than negative.
    - >-
      THE HEUR-001 ACCEPTANCE-RATE CHECK AT 10^7 TRIALS RESOLVES ALMOST NOTHING
      at a predicted rate of about 2^{-24}. The contract discloses this and
      routes the real estimate through the N = 1 ensemble instead, but a
      Coordinator may prefer to raise the trial count or drop the check rather
      than carry a statistic that cannot fail.
