# =============================================================================
# EXP-BINSTD-7d37fc -- VERSION 1 (APPROVED by DEC-20261002-820b87) frozen
# contract for H-BINSTD-6feaa2: HOLD-X3 DX-09 Weil-polynomial census at
# g in {5,6} for 131 | #A(F_2), with LMFDB completeness control and
# consolidated 6f2601 / 80209d controls.
#
# Source: IDEA-20260926-5c26f9 under RQ-BINSTD-b6f698 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. Stages 0-3 authorized for executor
# TASK-20261002-5935ec. No AUXIN. Amazon Bedrock prohibited.
# NO break. NO attack. NO exponent. Structural certificate only.
# =============================================================================
experiment:
  id: EXP-BINSTD-7d37fc
  hypothesis_id: H-BINSTD-6feaa2
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260926-5c26f9
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Exact Rolle-pruned Weil-polynomial census at g=5,6 over F_2 for
    131 | h(3), with LMFDB completeness control (HOLD-X3)
  status: approved
  approved_by: DEC-20261002-820b87
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-820b87
    composing_decision: DEC-20261002-820b87
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-3 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3]
    scientific_execution_authorized_note: >-
      Stage 0 is pure arithmetic (ceilings, multiples). Stages 1-3 are
      deterministic pure-Python integer enumeration + sympy re-verification.
      No Magma/Sage. No AUXIN. No Bedrock. No curve/ECDLP run.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze Stage-0 arithmetic for the g=5/6 Weil census, reproduce the g<=4
    baseline and LMFDB unfiltered counts, then enumerate filtered hits at
    g in {5,6} under dual box-test and toy-modulus controls — delivering
    exactly one of O-EMPTY-TO-6 / O-HIT-LIST / named instrument-defect
    outcomes for the KN-OPEN-095df5 column of RQ-BINSTD.

  class: measurement
  class_note: >-
    Structural-certificate / measurement experiment. Carries
    HEUR-BINSTD-5c26f9-H1 (runtime only). Not an exponent-moving
    breakthrough experiment; no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond arithmetic). Write
        stage0/preregistered-predictions.json freezing: Weil ceilings
        6725 (g=5) and 39201 (g=6); multiples of 131 equal to 51 and 299;
        LMFDB target counts 1645/14325/164937; g<=4 baseline 0 hits with
        unfiltered 5,35,215,1645; HEUR-BINSTD-5c26f9-H1 runtime bands;
        6f2601 outcome-B ceiling note; 80209d toy-modulus control list.
      - >-
        Stage 1. Implement analysis/couveignes-lercier-131/exact_targets_g56.py
        (or under experiments/EXP-BINSTD-7d37fc/implementation/ with a
        documented path). Run --max-dim 4 filtered and unfiltered;
        require match to baseline / LMFDB g=4 count before Stage 2.
      - >-
        Stage 2. Run --dims 5 6 --modulus 131; write
        exact_targets_g56.json with hits (possibly empty), unfiltered
        counts, exact-test counts, wall-clock, ambiguous count.
      - >-
        Stage 3. Dual box-test agreement (integer Sturm vs sympy) on every
        hit and on a random 10^4 pruned-node sample; null-modulus checks;
        IDEA-20260926-80209d seven toy moduli at g<=3; state 6f2601
        non-linear-shape ceiling beside any hit list.
      - >-
        RESULTS.md with exactly one O-* label from the hypothesis
        distinguishable_outcomes.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - Editing IDEA-20260926-5c26f9 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / Jacobianhood / factor-base unlock /
        ECC2K-130 attack from this contract.
      - Treating infra failure or O-RUNTIME as mathematical emptiness evidence.
      - Running any curve-point ECDLP cell under this card.
      - Upgrading outcome B to a Couveignes-Lercier attack without a new
        approved protocol that respects IDEA-20260926-6f2601.

  inputs:
    proposal: ledger/proposals/IDEA-20260926-5c26f9.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-6feaa2.yaml
    question: ledger/questions/RQ-BINSTD-b6f698.yaml
    open_problem: knowledge/open-problems/KN-OPEN-095df5.md
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    consolidated_valuation: ledger/proposals/IDEA-20260926-6f2601.yaml
    consolidated_toy_ladder: ledger/proposals/IDEA-20260926-80209d.yaml
    baseline_script: analysis/couveignes-lercier-131/exact_targets.py
    baseline_json: analysis/couveignes-lercier-131/exact_targets.json
    numerical_census: analysis/couveignes-lercier-131/census.json
    numerical_script: analysis/couveignes-lercier-131/weil_census.py

  controls:
    - name: stage0_arithmetic_reproduction
      description: >-
        Stage 0 must recover ceilings 6725/39201 and multiples 51/299 from
        (3+2√2)^g arithmetic before any enumeration.
    - name: g4_baseline_reproduction
      description: >-
        Stage 1 filtered g<=4 must report 0 hits; unfiltered counts
        5,35,215,1645 (or documented exact match to committed JSON).
    - name: lmfdb_completeness
      description: >-
        Unfiltered counts at g=4,5,6 must match 1645,14325,164937 or the
        run is O-INCOMPLETE (outcome A forbidden).
    - name: dual_box_test
      description: >-
        Integer Sturm and sympy count_roots must agree on every hit and on
        the pruned-node sample; disagreement is O-BOX-DISAGREE.
    - name: null_modulus
      description: >-
        Modulus 5 at g=1 returns the 5-point class; modulus 1 returns every
        class (hits = unfiltered count).
    - name: toy_modulus_ladder
      description: >-
        IDEA-20260926-80209d seven toy moduli at g<=3 with hand-derived
        answers (nearby-object control).
    - name: outcome_b_ceiling
      description: >-
        Any hit list must restate IDEA-20260926-6f2601's non-linear-shape
        / valuation ceiling; never claim a linear Couveignes-Lercier base.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_baseline, 2_census_g56, 3_controls]
    - name: dimension_g
      levels: [4_baseline, 5, 6]
    - name: modulus
      levels: [131_primary, 5_null, 1_null, toy_80209d_set]

  metrics:
    primary:
      - name: filtered_hits_g5
        unit: count
        definition: Number of real Weil polynomials of degree 5 with 131 | h(3) in the Weil box.
      - name: filtered_hits_g6
        unit: count
        definition: Number of real Weil polynomials of degree 6 with 131 | h(3) in the Weil box.
      - name: unfiltered_class_count_g456
        unit: count
        definition: Unfiltered isogeny-class counts at g=4,5,6 vs LMFDB 1645/14325/164937.
    secondary:
      - name: exact_tests_performed
        unit: count
        definition: Number of exact real-rootedness tests executed.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: ambiguous_near_boundary_count
        unit: count
        definition: Roots falling between INSIDE/OUTSIDE rational brackets.
      - name: dual_box_disagreements
        unit: count
        definition: Disagreements between integer Sturm and sympy on hits/sample.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of the enumerator process (memory honesty).
      - name: survivors_at_level_g_minus_1
        unit: count
        definition: Rolle survivors at level g-1 (validates HEUR-BINSTD-5c26f9-H1).

  heuristic_under_test: HEUR-BINSTD-5c26f9-H1

  preregistered_prediction:
    quantity: >-
      Stage-0 ceilings/multiples; Stage-1 g<=4 + LMFDB counts; Stage-2
      filtered hit counts at g=5,6 (direction NOT pre-committed);
      Stage-3 dual-test and toy-modulus controls.
    formula: >-
      ceiling(g=5)=6725, multiples=51;
      ceiling(g=6)=39201, multiples=299;
      LMFDB unfiltered = {4:1645, 5:14325, 6:164937};
      g<=4 filtered hits = 0;
      filtered hits at g=5,6 ∈ {0} ∪ {1,2,...} with no direction claimed;
      ambiguous=0 expected; dual_box_disagreements=0 required for A/B.
    source: >-
      ledger/proposals/IDEA-20260926-5c26f9.yaml predictions + HOLD-X3
      (DEC-20260928-63addc); frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: structural_certificate
    justification: >-
      Instance is (g, 131) over F_2 abelian varieties — not a curve-point
      ECDLP cell. Extends KN-OPEN-095df5 from g<=4 to g<=6 or lists
      candidates. No crypto-scale solve.
    correspondence: >-
      Completeness is certified against LMFDB's declared complete tables
      for dim<=6 over GF(2). Transfer to Couveignes-Lercier factor bases
      is explicitly blocked without a separate protocol respecting
      IDEA-20260926-6f2601.

  tail_checks:
    - >-
      Unfiltered count off by >=1 voids outcome-A certificate reading.
    - >-
      Any hit failing sympy re-verification voids the hit.
    - >-
      Runtime >10× Stage-0 estimate without declared cheap filters →
      O-RUNTIME amendment before treating partial counts as certificate.
    - >-
      Hit count >~100 at g=6 triggers re-check of the box test before belief.

  replication:
    seeds: [2026100201]
    independent_instances: 1
    note: >-
      Enumeration is deterministic. Seed governs only the random pruned-node
      sample for dual-test agreement (Stage 3). Scientific sample is the
      full census at g=5 and g=6, not expandable by leftover wall clock into
      a curve attack.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 43200
    total_cpu_hours: 12.0
    maximum_memory_gb: 8
    maximum_runs: 4
    maximum_workers: 1
    note: >-
      Advisory only (docs/research-budget-policy.md). Scientific requirement
      is complete g=5 and g=6 censuses with controls — not expandable into
      dim>=7 or curve ECDLP work under this card.

  stopping_rules:
    - >-
      SR-1. Stage 0 freeze complete before any enumerator implementation run.
    - >-
      SR-2. If Stage 0 arithmetic fails → O-TRANSCRIPTION; do not run Stages 1-3
      until corrected via amendment.
    - >-
      SR-3. If Stage 1 g<=4 or LMFDB g=4 count fails → stop before Stage 2.
    - >-
      SR-4. If unfiltered g=5/6 counts mismatch LMFDB → O-INCOMPLETE;
      do not claim O-EMPTY-TO-6.
    - >-
      SR-5. If dual box-tests disagree → O-BOX-DISAGREE; do not promote hits.
    - >-
      SR-6. If runtime exceeds 10× estimate → O-RUNTIME; amend with cheap
      filters before continuing; do not invent partial certificates.
    - >-
      SR-7. Advisory budget exhausted → O-IMPEDIMENT; never negative evidence.
    - >-
      SR-8. Do not escalate any hit list into Jacobian / factor-base / ECDLP
      claims under this card.

  invalidation_rules:
    - Editing stage0/preregistered-predictions.json after Stage-0 freeze.
    - Claiming O-EMPTY-TO-6 despite LMFDB count mismatch.
    - Claiming Jacobianhood or a linear Couveignes-Lercier factor base from hits.
    - Provisioning Magma/Sage/cypari2/AUXIN as the success path.
    - Using Amazon Bedrock.
    - Editing IDEA-20260926-5c26f9 claim text or shared GOAL-ECDLP2M-001.yaml.
    - Overwriting a prior RUN-* directory.
    - Claiming break / exponent / ECC2K-130 attack from this contract.
    - Treating O-RUNTIME or infra failure as mathematical emptiness evidence.

  success_criterion: >-
    ALL of: (1) Stage-0 freeze present with passing ceiling/multiple
    arithmetic; (2) Stage-1 g<=4 reproduction passes; (3) Stage-2 delivers
    filtered hit counts at g=5 and g=6 with unfiltered LMFDB checks OR a
    named O-INCOMPLETE / O-RUNTIME / O-IMPEDIMENT stop; (4) Stage-3 dual-test
    and at least the null-modulus controls run whenever hits or emptiness
    are claimed; (5) RESULTS.md names exactly one O-* label; (6) no
    invalidation_rule fired. This delivers the KN-OPEN-095df5 column
    reading; it does NOT claim any curve is broken and does NOT itself
    promote a KN-FIND (that requires a later review/curation gate).

  falsification_criterion: >-
    ANY of: (F1) Stage-0 multiples/ceilings wrong (O-TRANSCRIPTION);
    (F2) g<=4 reproduction fails (O-TRANSCRIPTION); (F3) LMFDB unfiltered
    mismatch with a claimed O-EMPTY-TO-6 (O-INCOMPLETE); (F4) dual box-test
    disagreement on a reported hit (O-BOX-DISAGREE); (F5) Magma/Sage/AUXIN/
    Bedrock used as success path. Budget exhaustion is O-IMPEDIMENT, not
    falsification of HEUR-BINSTD-5c26f9-H1 or of the emptiness claim.

  required_artifacts:
    - experiments/EXP-BINSTD-7d37fc/implementation/
    - experiments/EXP-BINSTD-7d37fc/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-7d37fc/stage0/arithmetic-freeze.md
    - analysis/couveignes-lercier-131/exact_targets_g56.py
    - experiments/EXP-BINSTD-7d37fc/stage1/g4-reproduction.json
    - experiments/EXP-BINSTD-7d37fc/stage2/exact_targets_g56.json
    - experiments/EXP-BINSTD-7d37fc/stage3/controls.json
    - experiments/EXP-BINSTD-7d37fc/runs/
    - experiments/EXP-BINSTD-7d37fc/RESULTS.md

  procedure:
    stages:
      - id: S0-FREEZE
        text: >-
          Write preregistered-predictions.json and arithmetic-freeze.md;
          ZERO enumerator runs before freeze.
      - id: S1-BASELINE
        text: >-
          Implement exact_targets_g56.py; run --max-dim 4 filtered+unfiltered;
          write stage1/g4-reproduction.json; stop on mismatch.
      - id: S2-CENSUS
        text: >-
          Run --dims 5 6 --modulus 131; write stage2/exact_targets_g56.json
          with hits, unfiltered counts, exact-test counts, wall-clock,
          ambiguous count, survivors_at_level_g_minus_1.
      - id: S3-CONTROLS
        text: >-
          Dual box-test agreement; null moduli; 80209d toy ladder; restate
          6f2601 ceiling beside any hit list; write stage3/controls.json.
      - id: S-SUM
        text: >-
          Write RESULTS.md with exactly one O-* label; preserve raw
          manifests under runs/; cite RUN IDs; no ledger status edits;
          do not curate KN-OPEN-095df5 in this card.

  assigned_to: executor
  executor_handoff: TASK-20261002-5935ec
  snapshot_task: TASK-20261002-34619e

  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
