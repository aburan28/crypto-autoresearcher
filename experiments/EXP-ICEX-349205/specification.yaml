experiment:
  id: EXP-ICEX-349205
  hypothesis_id: H-ICEX-71bce3
  derived_from_idea: IDEA-20260803-fa9839
  question_id: RQ-ICEX-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    The arity threshold - symbolic and numeric verification of the two-term index-calculus charge, an
    internal conservation cross-check, a BLOCKING transcription of the known extension-field exponent,
    and a sign-robust threshold table with per-goal convertibility statements
  objective: >-
    The one uncertainty a run reduces is how cheap a decomposition oracle would have to be, at each arity,
    for point-decomposition index calculus to beat Pollard rho within a declared charge - and whether that
    charge survives being checked against an answer it did not choose. A run establishes five things, all by
    exact arithmetic and symbolic differentiation with zero algorithmic compute. First, symbolic and numeric
    verification of the two-term charge's optimizer and optimal value at every arity from 2 to 8. Second, the
    conservation identity's internal cross-check at the subfield-line instantiation, which requires no external
    source. Third, a transcribed primary-source exponent for the extension-field family with a quoted excerpt
    and a content hash, or a recorded failure to obtain one. Fourth, the signed discrepancy between the model
    and the transcribed exponent at every degree, evaluated against the model's own implied expression. Fifth,
    conditional on all of those, a machine-readable threshold table with pinned constants and an explicit sign
    robustness verdict per row, plus a statement for each deferred measurement goal of what value would change
    its verdict. No algorithm is run, no instance is solved, and no advantage is claimed or claimable.
  what_this_is_not:
    - >-
      Not an attack and not an algorithm. Nothing is executed, no decomposition is attempted, and no discrete
      logarithm is computed.
    - >-
      Not a demonstration that prime-field index calculus fails, and not a demonstration that it succeeds. The
      decisive parameter is left FREE and the model takes no position on its achievability.
    - >-
      Not a tight model. The recalled extension-field exponent beats the model at one of the arities in question,
      and that discrepancy is the deliverable's own headline rather than a caveat.
    - >-
      Not a security claim about any deployed curve or scheme.
    - >-
      Not approval, freezing, execution authorization, a run, or evidence. No run has been executed under this
      contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope. The two-term charge's optimizer and optimal value do or do not verify; the
      conservation identity does or does not return the reciprocal factorial exactly; the transcribed exponent takes
      a stated value or could not be obtained; the signed discrepancy does or does not match the model's implied
      expression; and the threshold rows take stated values whose signs are or are not robust to the declared constant
      sweep. WHAT DOES NOT FOLLOW. No claim that any arity is impossible - the model is known not to be tight and
      that phrasing is explicitly forbidden; no claim about whether any factor base achieving a given per-trial cost
      EXISTS, which the model is silent on by construction; no claim tier above toy for any threshold number until the
      pinned constants are validated against a measured implementation, which this contract does not do; and nothing
      about any deployed curve.
  inputs:
    procedure: >-
      STAGE 0, zero compute, ORDERING CONTROL. Freeze and hash the linear-algebra constant, the rho constant, the
      field-operation to group-operation conversion, the definition of the per-trial decomposition cost, and the
      constant sweep range, BEFORE any number is computed.
      STAGE 1, seconds. Derive the two-term charge's optimizer and optimal value symbolically from the stationarity
      condition and verify numerically at every arity from 2 to 8 to machine precision. A symbolic-numeric mismatch is
      an algebra error and blocks everything downstream.
      STAGE 2, seconds, INTERNAL GATE. Instantiate the conservation identity at the subfield-line factor base of the
      extension-field setting and require it to return the reciprocal of the degree factorial EXACTLY at degrees 2
      through 8. This requires no external source and is the only gate that survives a total failure to obtain one.
      STAGE 3, reading, BLOCKING SUBTASK. Obtain a primary source for the reported extension-field cost exponent and
      transcribe it with a quoted excerpt, a page reference and a content hash. If it is unobtainable, STOP the gate,
      report it UNRUN under AGENTS.md rule 5, and emit NO threshold table and NO prime-field corollary.
      STAGE 4, seconds. Evaluate the signed discrepancy between the model exponent and the TRANSCRIBED exponent at
      every degree in the transcribed range, against the model's own implied exact expression.
      STAGE 5, seconds, ONLY IF STAGE 4 PASSES. Emit the machine-readable arity threshold table with the pinned
      constants, at the standardized group orders, with the low-arity rows reading infeasible-within-model and never
      impossible, and with the optimizing factor-base size emitted beside every time row.
      STAGE 6, seconds. NULL CONTROL: re-derive the threshold with the exact conservation mean replaced by a naive
      independent-uniform yield estimate. The threshold EXPONENT must be unchanged; if it moves, the claimed role of
      exactness is overstated.
      STAGE 7, seconds. SIGN-ROBUSTNESS SWEEP over the declared constant ranges, marking every row whose sign is not
      robust as indeterminate.
      STAGE 8, zero compute. Name the missing relation-search ingredient implied by the observation collision, state
      explicitly whether it is portable to prime fields or why that is unknown, confirm in writing that omitting
      relation rank and descent can only lower the modelled cost, and mark every positive reading accordingly. For each
      deferred measurement goal, write what value of its own primary metric would place the per-trial cost inside each
      arity window, or state that its metric does not convert.
    instrument: >-
      Exact arithmetic and symbolic differentiation in pure Python under experiments/EXP-ICEX-349205/driver/. Binomial
      coefficients computed in exact integers; logarithms taken only at reporting time so no threshold is an artifact
      of floating point. No solver, no algebra library, no algorithmic execution. Nothing under harness/ is modified.
      Recorded through harness/runner.py.
    parameters: >-
      Arities 2 through 8. Extension degrees 2 through 8 for the conservation cross-check and for the discrepancy gate,
      restricted to the range actually transcribed. Standardized group orders of 160, 224, 256 and 384 bits for the
      absolute threshold budget table. Pinned constants and their sweep range frozen at Stage 0. Threshold rows emitted
      under a headline quadratic linear-algebra exponent and under a PARAMETERIZED deficit as explicitly conditional
      rows, so a future structured-solve result reads off its own consequence rather than invalidating the table. Both
      the harvest-all and one-relation-per-target conventions reported, with the requirement that the exponent be
      identical under both.
  controls:
    - >-
      BASELINE-REPRODUCTION GATE AS A HARD BLOCKER. Stage 5 may not execute if Stage 4 fails or Stage 3 is unrun. This
      is the control that distinguishes this contract from writing down a plausible formula: the model is checked
      against an answer it did not choose BEFORE it is applied where the answer is unknown.
    - >-
      INTERNAL CROSS-CHECK, source-independent. The conservation identity at the subfield-line instantiation must return
      the reciprocal factorial exactly. This is the only gate that survives a total retrieval failure and it must hold
      exactly rather than approximately.
    - >-
      NULL CONTROL ON THE CONSERVATION IDENTITY. Re-derive the threshold with the exact mean replaced by a naive
      independent-uniform yield estimate. The threshold EXPONENT must be unchanged; movement means the model is carried
      by the estimate rather than by the identity, and the record's mechanistic argument must be re-described.
    - >-
      SIGN-ROBUSTNESS SWEEP. Vary the pinned constants over the declared range and report whether any threshold row
      changes sign. Rows whose sign is not robust are marked indeterminate and may not be cited as no-gos.
    - >-
      CONVENTION-INVARIANCE CHECK. Report the threshold under both the harvest-all and the one-relation-per-target
      conventions and require the EXPONENT to be identical under both; only the constant may move. A convention under
      which the exponent moves indicates the charge is wrong.
    - >-
      RANK-DEFICIENCY DIRECTION CHECK, in writing. Confirm that omitting relation rank and descent can only lower the
      modelled cost, so that no-go readings are conservative and positive readings are not - and mark every positive
      reading accordingly.
    - >-
      ORDERING CONTROL. All constants and definitions hashed at Stage 0 before any number is computed.
  independent_variables:
    - arity, from 2 to 8
    - extension degree, from 2 to 8, restricted to the transcribed range
    - 'yield model: exact conservation mean / naive independent-uniform estimate (null arm)'
    - 'relation convention: harvest-all / one relation per target'
    - pinned constants, swept over the declared range
    - 'linear-algebra exponent: quadratic headline / parameterized conditional rows'
    - standardized group order, four levels
  metrics:
    primary:
      - >-
        Symbolic and numeric optimizer verification residual per arity, dimensionless. Computed as the difference
        between the derived optimizer and the numerically located minimizer of the charge, required to be at machine
        precision at every arity from 2 to 8.
      - >-
        Conservation cross-check value per extension degree, exact rational. Computed by instantiating the identity at
        the subfield-line factor base and compared for EXACT equality with the reciprocal of the degree factorial.
      - >-
        Transcribed extension-field exponent per degree, with its source hash and quoted excerpt, or a recorded
        failed-fetch receipt.
      - >-
        Signed discrepancy per degree, dimensionless. Computed as the model exponent minus the transcribed exponent, and
        compared against the model's own implied exact expression to machine precision.
      - >-
        Threshold table: the maximum admissible per-trial cost exponent per arity, and the absolute budget at each
        standardized group order, machine-readable, with the pinned constants recorded in the same file.
    secondary:
      - >-
        Optimizing factor-base size per arity, emitted beside every time row so no threshold is quoted without its memory.
      - >-
        Sign-robustness verdict per threshold row, with the constant values at which any sign changes.
      - >-
        Null-arm threshold exponent under the naive yield estimate, beside the exact-mean value.
      - >-
        Threshold exponent under each relation convention, which must agree.
      - >-
        Per-goal threshold-convertibility statements for each deferred measurement goal, or an explicit not-convertible
        verdict with its reason.
      - >-
        The named missing relation-search ingredient implied by the observation collision, with an explicit portability
        verdict or an explicit unknown.
  heuristic_under_test: HEUR-AT-3
  heuristic_under_test_note: >-
    HEUR-AT-1 and HEUR-AT-2 are validated by the SAME run - the first through the convention-invariance check, the second
    through the parameterized linear-algebra rows. The field names the heuristic that is an INFERENCE FROM ELIMINATION and
    is the weakest link, and whose validation depends entirely on the blocking transcription at Stage 3.
  preregistered_prediction:
    quantity: >-
      The optimizer verification residual; the conservation cross-check value; the signed discrepancy against the
      transcribed exponent; and the sign robustness of every threshold row.
    formula: >-
      Predicted optimizer residual at machine precision at every arity from 2 to 8, verified symbolically against the
      stationarity condition. Predicted conservation cross-check EXACTLY the reciprocal of the degree factorial at degrees
      2 through 8. Predicted signed discrepancy equal to the model's own implied exact expression in the degree, to within
      1e-12, at every transcribed degree - a POINT PREDICTION THAT CAN FAIL, and it fails if the transcribed exponent is
      not what was recalled. Predicted no threshold row changing sign under the declared constant sweep. Under the null
      that the model's exactness is doing no work, the naive-yield arm moves the threshold exponent.
    source: >-
      Pre-registered in the parent proposal IDEA-20260803-fa9839, whose claim and predictions blocks derive the optimizer,
      the threshold function and the exact discrepancy expression in the proposing session. Those are DERIVED PREDICTIONS
      of that record. The extension-field exponent they are checked against is an UNVERIFIED RECOLLECTION in that record
      and MAY NOT BE USED AS EVIDENCE; the gate is evaluated against the TRANSCRIBED value, not against the recollection.
  scale_relevance:
    tier: toy
    justification: >-
      The threshold is an analytic object and is evaluated at STANDARDIZED group orders of 160 to 384 bits, so the table
      itself reaches deployed scale as arithmetic. That is not a measurement and the contract says so: no claim tier above
      toy is available for any threshold number until the pinned constants are validated against a measured
      implementation, which this contract does not do. The scale-relevant CHECK is the baseline gate, which uses an
      externally known exponent this programme cannot revise. The largest interpretive gap, stated in every deliverable,
      is that the extension-field baseline is a DIFFERENT PROBLEM: reproducing its exponent validates the SHAPE of the
      charge, not the model's applicability to prime fields, where the factor base has no subfield description at all.
    correspondence: null
  tail_checks:
    - >-
      Report the discrepancy at EVERY transcribed degree rather than a summary, since the prediction is that it tracks a
      specific monotone curve and a single matching endpoint would not distinguish that from a constant offset.
    - >-
      Report the constant values at which any threshold row's sign flips, not merely whether it flipped, so a row that is
      marginally robust is distinguishable from one that is comfortably so.
    - >-
      Report the optimizing factor-base size at the largest standardized order, since a threshold that is satisfiable only
      with an infeasible stored element count is not a usable reading.
    - >-
      Report the per-trial cost's status as an EXPECTATION-level quantity explicitly, and state that a measured per-trial
      cost with an unbounded second moment does not satisfy the threshold even if its mean does.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 3
    replication_note: >-
      The computation is fully deterministic symbolic and exact arithmetic; the three instances are a determinism check
      rather than a variance estimate. Any disagreement across instances is an implementation defect and invalidates the run.
  budget:
    wall_clock_seconds_per_run: 300
    total_cpu_hours: 0.1
    maximum_memory_gb: 2
    maximum_runs: 6
  stopping_rules:
    - >-
      STOP everything downstream if the optimizer fails symbolic or numeric verification. Algebra error.
    - >-
      STOP and route to a CORRECTION record if the conservation cross-check does not return the reciprocal factorial
      exactly. Either the committed conservation finding or this instantiation is wrong and the discrepancy is not absorbed.
    - >-
      STOP the baseline gate and report it UNRUN if no primary source can be obtained. Emit no threshold table and no
      prime-field corollary; only the symbolic verification and the internal cross-check are reportable.
    - >-
      DO NOT emit the threshold table if the discrepancy gate fails. The table is the deliverable and the gate is what
      earns it.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion is a stop, never a negative result,
      under AGENTS.md rule 5.
  invalidation_rules:
    - >-
      A timeout, crash or dependency failure makes the run failed_infrastructure and is NEVER negative mathematical
      evidence. A failed source retrieval is likewise infrastructure and makes the gate UNRUN rather than failed.
    - >-
      A run in which the threshold table was emitted while the baseline gate was unrun or failed is invalid_measurement.
    - >-
      A run whose pinned constants differ from the Stage 0 hash, or whose constants were chosen after a threshold value was
      seen, is invalid_measurement.
    - >-
      A run whose null arm - the naive-yield re-derivation - was not executed in the same invocation is invalid_measurement.
    - >-
      A run whose three deterministic instances disagree is invalid_measurement.
    - >-
      A run whose parameters differ from this contract is a DIFFERENT experiment and requires a new contract; it is never a
      repair of this one.
  success_criterion: >-
    The run is successful when the optimizer verification residuals are reported at every arity, the conservation
    cross-check values are reported at every degree, the transcription is reported with its excerpt and hash or recorded as
    a failed fetch, the signed discrepancy is reported at every transcribed degree against the model's implied expression,
    the null arm and the convention-invariance check are reported, and - only if the gate passed - the threshold table is
    emitted with its pinned constants, its per-row sign-robustness verdict, its optimizing base sizes, its
    infeasible-within-model wording at the low arities, and the per-goal convertibility statements. Success means a
    DECIDABLE run. H-ICEX-71bce3 is confirmed only if, in addition, the optimizer verifies, the cross-check is exact, the
    discrepancy matches the implied expression at every degree, and no threshold row's sign is indeterminate.
  falsification_criterion:
    - >-
      The transcribed exponent is not what was recalled. The discrepancy identity is WITHDRAWN and the gate is re-evaluated
      against the transcribed value. This does not by itself void the model, and the record must state which parts survive.
    - >-
      The model cannot be reconciled with the transcribed exponent by ANY named ingredient of the relation-search term. THE
      TWO-TERM CHARGE IS WRONG; no threshold table is emitted, no prime-field corollary is available, and the failure is the
      reported result.
    - >-
      The optimizer or optimal value does not verify symbolically. Algebra error; everything downstream is void.
    - >-
      The conservation cross-check does not return the reciprocal factorial exactly. Routed to a CORRECTION record rather
      than absorbed; nothing downstream is reportable.
    - >-
      A threshold row's sign is not robust to the declared constant ranges at the decision-relevant arities. Those rows are
      unusable and are marked indeterminate rather than quoted.
    - >-
      No primary source can be obtained. The gate is UNRUN under AGENTS.md rule 5 - an infrastructure and retrieval outcome,
      not a mathematical one - and the parent proposal flags precisely this as the programme's systematic failure mode.
    - >-
      The naive-yield null arm moves the threshold EXPONENT. The claimed role of the conservation identity's exactness is
      overstated and the mechanistic argument must be re-described even if the table survives.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model and inference block, and environment.
    - >-
      The Stage 0 hash of the pinned constants, the per-trial cost definition and the sweep range, written before any number
      was computed.
    - >-
      The symbolic derivation of the optimizer and its numeric verification residuals at every arity.
    - >-
      The conservation cross-check values at every degree, as exact rationals.
    - >-
      The transcribed exponent with a quoted excerpt, page reference and content hash, or an explicit failed-fetch receipt.
    - >-
      The machine-readable threshold table with its pinned constants and per-row sign-robustness verdicts, emitted only if
      the gate passed.
    - >-
      The null-arm re-derivation, in the same file as the signal arm.
    - >-
      The per-goal convertibility statements and the named missing relation-search ingredient with its portability verdict
      or explicit unknown.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator approval is required before execution, and under this engagement approval is the USER's gate because it
      authorizes execution and spends compute. This contract is review_required and is NOT approved; approved_by is null and
      execution_authorized is false.
    - >-
      This hypothesis is proof-oriented and carries a proof_search_map. Its bottleneck, baseline embedding, observation
      collision, quantifier order, method ceiling and nearby-object control must be audited before approval, per KN-TECH-080.
      Stages 1, 2 and 4 are the executable part of that audit and are hard gates.
    - >-
      The pinned constants must be fixed at approval time. A constant left open until run time defeats the ordering control
      and makes every threshold sign unauditable.
    - >-
      No deliverable from this contract may use the phrasing that any arity is impossible. The model is known not to be tight
      and the low-arity rows must read infeasible-within-model. A reviewer who finds the stronger phrasing should reject the
      deliverable.
  derivation_provenance:
    tool: coordinator subagent, design-experiment step
    source_record: IDEA-20260803-fa9839
    authored_at: '2026-08-25'
    note: >-
      The two-term charge, its optimizer, the threshold function, the exact discrepancy expression, the blocking
      transcription subtask, the internal conservation cross-check, the null control on the identity, the sign-robustness
      sweep and the rank-deficiency direction check all come from the parent proposal's claim, proof_search_map, minimal_test
      and controls blocks. Every derived value is attributed to that record as a derived prediction of the proposing session,
      and the extension-field exponent it is checked against is carried as an UNVERIFIED RECOLLECTION that may not be used as
      evidence. Coordinator additions are the determinism framing of replication, the convention-invariance check promoted to
      a named control, and the prohibition on the impossible phrasing as an approval-gate item rather than a footnote. Budgets
      come from the parent's declared low implementation and no compute.
  derivation_gaps:
    - >-
      The extension-field exponent is an UNVERIFIED RECOLLECTION in the parent record and primary sources were unreachable
      from that environment. The entire baseline gate depends on obtaining one here. This is a retrieval problem rather than a
      compute problem and the parent record notes that this programme systematically defers it.
    - >-
      The pinned constants are not derived. They are modelling choices whose effect the sweep bounds but does not eliminate,
      and a threshold row whose sign depends on them is unusable rather than approximately usable.
    - >-
      The model omits DESCENT entirely. A full index calculus must express the target over the factor base after collecting
      relations, and that stage has its own cost. This makes the model a lower bound - safe for no-go readings and UNSAFE for
      any positive reading - and every positive reading must carry the caveat.
    - >-
      The per-trial decomposition cost is treated as an expectation. A real solver's cost varies enormously across instances
      and the tail matters more than the mean when trials are repeated many times; a measured cost with an unbounded second
      moment does not satisfy the threshold even if its mean does, and the contract requires that be stated rather than assumed
      away.
    - >-
      The attribution of the missing ingredient to partial-relation harvesting is an INFERENCE FROM ELIMINATION. It may never
      be asserted from elimination alone in a deliverable; if the transcribed source does not identify the ingredient, the
      attribution is recorded unverified and the portability question is deferred rather than answered.
