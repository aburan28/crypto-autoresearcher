experiment:
  id: EXP-ECDLP-7d929c
  hypothesis_id: H-ECDLP-96f973
  version: 1
  title: >-
    The literal large-class protocol stress test, run as TWO ARMS on
    identical census data with two declared structural upper bounds - one
    forcing DECIDED and one forcing UNDECIDED - so the verdict function has a
    reachable second outcome instead of a width-zero band
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  objective: >-
    Test whether the five-step base-change-ladder protocol's Step 5 verdict
    is the function of (L, R_stab, U) its committed text states, at a
    realized-class count an order of magnitude larger than the battery that
    validated it. The SAME census over 100 realized permutations is fed to
    the protocol twice, differing ONLY in the declared structural upper
    bound: U = 100 (Arm A, which the committed Step 5 requires to certify
    once the ceiling is reached) and U = 200 (Arm B, which it requires to
    refuse at every tier). The arms must disagree. This contract is DRAFT and
    confers no execution authority.

  degenerate_prediction_correction: >-
    THE SOURCE IDEA'S SINGLE-ARM PREDICTION IS NOT IMPLEMENTED, AND THE
    REASON IS ON THE RECORD. It predicts UNDECIDED at every k "REGARDLESS of
    how densely the observed histogram matches the group's own known law" and
    declares a DECIDED verdict at any k an outright falsification. Read
    verbatim this session, the protocol's Step 5 says: "Report DECIDED with
    the group when L = R_stab = U, OR when R_stab = U outright (realizing the
    full structural ceiling is self-certifying even without an independently
    derived L ...). Report UNDECIDED, with both bounds, otherwise." With the
    source's own recommended object - the regular representation of an
    order-100 group with U declared as 100 - a completed census gives
    R_stab = U outright, so the committed rule REQUIRES DECIDED. Run as
    specified, the experiment would score a `supported` record as
    overclaiming for obeying its own text. That is a manufactured
    falsification and, separately, a degenerate discriminator: a single arm
    admits one verdict and cannot tell correct refusal from unconditional
    refusal. The two-arm design fixes both.

  preregistered_prediction:
    quantity: >-
      The Step 5 VERDICT, categorical in {DECIDED, UNDECIDED}, reported per
      (arm, sample-size tier) together with both bounds; and the REALIZED
      CLASS COUNT, an integer in 0..100, per sample size.
    formula: >-
      ARM A (U = 100, L = 1): UNDECIDED while realized_count < 100; DECIDED
      at and after the tier where realized_count = 100, since R_stab = U
      outright.
      ARM B (U = 200, L = 1, identical census data): UNDECIDED at every tier,
      since R_stab <= 100 < 200 and L = 1, regardless of the histogram.
      JOINT: the arms DISAGREE at and after the completion tier. Agreement is
      the falsifier.
      COMPLETION TIER: with 100 classes at uniform density the expected
      number of draws to see every class is about 100 * H(100), roughly 519,
      so the completion tier is predicted to be the 1000-draw tier or
      earlier, and certainly by 5000.
    source: >-
      The verdict formulas are read directly off the committed Step 5 text
      quoted above. The completion-tier estimate is the standard
      coupon-collector expectation for 100 equiprobable classes.

  inputs:
    group: >-
      G = Z/100 in its regular representation on 100 points, so a census over
      G's elements IS a census over its 100 realized permutations at density
      exactly 1/100 each. The multiplication table is explicit and recorded.
    sampling_rule: >-
      A FIXED, DISCLOSED, DETERMINISTIC pseudo-Frobenius rule: the sampled
      element at index j is g^j for a declared generator g of Z/100, with j
      produced by a declared index sampler whose algorithm, seed and state
      are recorded. The rule is written into this contract before any draw.
    declared_bounds: >-
      Arm A: U = 100 (the regular representation's own order), L = 1 by
      design, no inertia bound derived. Arm B: U = 200 (the dihedral ambient
      acting on the same 100 points), L = 1 by design. THE CENSUS DATA IS
      IDENTICAL IN BOTH ARMS; only the declared U differs.
    baseline_cell: >-
      The already-tested order-120 battery member (a random monic quintic,
      fibre size 5, U = 120, L = 1), re-run under this implementation as a
      blocking reproduction gate.

  independent_variables:
    - "arm: A (U = 100) versus B (U = 200), on identical census data"
    - "sample size S in {200, 1000, 5000, 20000}, relabelled as ladder tiers k = 1..4"
    - "sample-size stability: S = 20000 versus 3 * 20000"

  null_object:
    name: >-
      ARM B, THE UNDECIDED-FORCED ARM, is the null object: the same object
      and the same data under a declared ambient bound that makes
      certification unavailable. ARM A is its treatment counterpart, forced
      to the opposite verdict on identical data.
    construction: >-
      Both arms consume the SAME sampled census - the same draws, the same
      realized-class counts, the same histogram at every tier - and differ in
      exactly one declared input, the structural upper bound U. In Arm A the
      realized group IS the declared ambient (U = 100), so the ceiling is
      reachable and, once reached, self-certifying by the committed Step 5
      second disjunct. In Arm B the realized order-100 rotation subgroup sits
      strictly inside a declared order-200 dihedral ambient, so R_stab < U at
      every tier and, with no derivable L, the protocol must refuse forever
      no matter how uniform the histogram looks.
    non_degeneracy_check: >-
      THIS IS THE CHECK THAT MOTIVATED THE WHOLE REDESIGN, AND IT IS
      PERFORMED EXPLICITLY. A pre-registered null whose band admits only one
      value teaches nothing, because the discriminator can never fire. THE
      SOURCE'S SINGLE ARM IS SUCH A NULL: with only Arm B present, UNDECIDED
      is the only reachable verdict, and a protocol that refuses correctly
      and a protocol that refuses unconditionally are indistinguishable. With
      only Arm A present, DECIDED becomes the only reachable verdict after
      completion and the symmetric problem appears. RUNNING BOTH ON IDENTICAL
      DATA MAKES BOTH VERDICTS REACHABLE AND FORCED, so the verdict function
      is required to return two different values on the same census and the
      band is provably not width zero. The check is recorded as a Stage 0
      obligation: before any sampling, the executing agent derives the forced
      verdict of each arm from the quoted Step 5 text and confirms they
      differ; if they do not, the two arms are not discriminating and the
      contract must be re-specified before anything runs.
    dynamic_range_demonstration: >-
      Three graded rungs, so the verdict function's response is measured
      across a range rather than at one point.
      RUNG 1, R_stab far below U: the 200-draw tier, where the census has
      seen only part of the group. Both arms forced UNDECIDED. This is the
      "cannot certify yet" rung and it must NOT produce DECIDED in either arm.
      RUNG 2, R_stab exactly equal to U: Arm A at and after the completion
      tier. Forced DECIDED in Arm A, forced UNDECIDED in Arm B. This is the
      discriminating rung.
      RUNG 3, R_stab equal to U with a DELIBERATELY WITHHELD class: a
      variant census in which one declared element is removed from the
      sampler's image, so the realized count saturates at 99 out of 100.
      Forced UNDECIDED in BOTH arms, because R_stab = 99 < U = 100. This rung
      plants a defect of KNOWN SIZE - exactly one missing class - and
      requires the protocol to notice it. A protocol that returns DECIDED in
      Arm A at 99 realized classes is certifying a ceiling it has not
      reached, and every other number in the run is void.
    curve_free_null: >-
      NOT A SEPARATE ARM, BECAUSE THE ENTIRE EXPERIMENT IS CURVE-FREE BY
      CONSTRUCTION, AND THAT IS RECORDED HERE RATHER THAN OMITTED. There is
      no elliptic curve, no summation polynomial, no cover, no Weil descent,
      no field extension and no relation rate anywhere in this design; the
      object is an abstract permutation group and the k ladder is a declared
      relabelling of sample-size tiers. The requirement to run a curve-free
      null exists to catch a signature that a non-curve object could
      reproduce; here the object IS the non-curve object, so the requirement
      is met in its strongest form and the pre-declared consequence below is
      unconditional rather than contingent on an outcome.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE, UNCONDITIONAL, AND BINDING. NOTHING measured by
      this experiment is a statement about elliptic curves, about the
      monodromy of any Semaev cover, about relation rates, or about the
      ECDLP, under ANY outcome. Every result is a statement about the verdict
      function of a protocol evaluated on synthetic abstract-group data. Any
      report, evidence record or downstream citation that quotes a number
      from this run as bearing on a curve, a cover or the ECDLP is
      mis-citing it, and the run's own report must carry this sentence.

  controls:
    - >-
      STAGE 0 NON-DEGENERACY DERIVATION (blocking, zero compute): derive the
      forced verdict of each arm from the quoted Step 5 text and confirm they
      DIFFER at the completion tier. If they do not, the arms are not
      discriminating and nothing runs.
    - >-
      BASELINE REPRODUCTION GATE (blocking, hard, must pass before Arm A or B
      is read): re-run the already-tested order-120 battery member and
      require EXACT reproduction of its committed UNDECIDED verdict.
    - >-
      RUNG 3, THE WITHHELD-CLASS ARM (blocking): a census whose sampler image
      omits exactly one declared element, so realized_count saturates at 99.
      FORCED UNDECIDED IN BOTH ARMS. A DECIDED verdict in Arm A here means
      the protocol certifies a ceiling it has not reached and every number in
      the run is void.
    - >-
      DECIDED-VERDICT TRIPWIRE ON ARM B: any DECIDED output from Arm B at any
      tier is overclaiming and immediately voids that arm regardless of other
      results.
    - >-
      UNDECIDED-VERDICT TRIPWIRE ON ARM A: an UNDECIDED output from Arm A at
      or after the completion tier means the protocol refuses where its own
      committed rule certifies, and is the symmetric falsifier.
    - >-
      SAMPLER-UNIFORMITY CONTROL (blocking): chi-square goodness-of-fit of
      the realized-class histogram against the uniform 1/100 law at each
      sample size, at the 1 percent level. A rejection at the largest sample
      size means the census is measuring the sampler and no verdict may be
      read.
    - >-
      SAMPLE-SIZE STABILITY CONTROL: the realized-class count at S = 20000
      must not change materially when S is tripled.
    - >-
      IDENTICAL-DATA CONTROL: the two arms must be shown, by hash of the
      recorded draw sequence, to have consumed the SAME census. If they did
      not, the comparison is between two censuses rather than between two
      declared bounds and the design is void.

  metrics:
    primary:
      - "Step 5 verdict per (arm, tier); CATEGORICAL in {DECIDED, UNDECIDED}, reported with both bounds L and U and with R_stab"
      - "arm disagreement at and after the completion tier; BOOLEAN; required TRUE"
      - "realized-class count per sample size; INTEGER in 0..100"
      - "completion tier = the smallest declared sample size at which realized_count reaches 100; INTEGER sample size, or NOT REACHED"
      - "withheld-class arm verdict per arm; CATEGORICAL; forced UNDECIDED in both"
      - "baseline order-120 member verdict; CATEGORICAL; forced UNDECIDED, exact reproduction required"
    secondary:
      - "realized-class density histogram per sample size; 100 dimensionless frequencies summing to 1"
      - "density spread = max class frequency minus min class frequency, per sample size; dimensionless"
      - "chi-square statistic against the uniform 1/100 law per sample size; dimensionless, with its p-value"
      - "coupon-collector curve: realized_count as a function of draws, reported at fine granularity so the completion tier is located rather than bracketed"
      - "comparison of the coupon-collector curve against each of the six already-tested battery members' convergence, to substantiate the claim that this object stresses sampling in a regime the battery does not reach"
      - "sha256 of the recorded draw sequence, identical across the two arms"
      - "wall-clock seconds and peak RSS in GiB"

  heuristic_under_test: HEUR-PROT-1

  scale_relevance:
    tier: toy
    justification: >-
      One abstract group of order 100 acting on 100 points, sample sizes up
      to 60000 draws. THE TESTED RANGE IS EXTENDED FROM ABOUT 120 TO 100-200
      WITH A MATERIALLY LARGER OBSERVABLE GRANULARITY, AND NO FURTHER. THE
      CRYPTOGRAPHIC-SCALE FORM OF THIS QUESTION - whether the protocol's
      refusal discipline holds at monodromy groups with thousands to millions
      of classes - CANNOT BE TESTED AT REACHABLE SCALE BY THIS OR ANY NEARBY
      DESIGN, because a coupon-collector census over C classes needs about
      C * H(C) draws and the sampling cost becomes the binding constraint
      long before cryptographic class counts. That is stated here rather than
      quietly narrowed, and no extrapolation from this run to larger orders
      is licensed.
    correspondence: null

  tail_checks:
    - "The single LEAST-realized class at the largest sample size, reported individually with its count, since a uniformity failure shows first in the tail."
    - "The tier immediately before and immediately after the completion tier, reported at fine granularity, since that is where Arm A's verdict transitions and where an off-by-one in the completion test would hide."
    - "The withheld-class arm at the largest sample size, where the temptation to certify is greatest and the missing class is a single count out of 100."
    - "The chi-square p-value at the SMALLEST sample size, where the census is sparsest and a uniformity test has least power; reported so a pass there is not over-read."

  replication:
    seeds: [2026, 9040, 31415]
    independent_instances: 3
  seeds_policy: >-
    Three declared seeds for the index sampler, fixed here before execution
    and never re-drawn after an outcome is seen. THE TWO ARMS SHARE A SEED
    AND A DRAW SEQUENCE BY CONSTRUCTION - this is not a convenience but the
    design's central requirement, since the arms must differ only in the
    declared U, and the identical-data control verifies it by hash. The
    sampling rule, the generator g, the index sampler's algorithm and its
    state are recorded per run. The whole battery is repeated at all three
    seeds; a verdict that differs across seeds at the same tier is itself a
    reportable instability and is not averaged. A re-run under a new seed is
    a NEW run, never a replacement.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 4
    maximum_workers: 1
  budget_note: >-
    At the schema floors. The computation is a few hundred thousand integer
    operations and a 100-entry counter table; memory is O(1) beyond that
    table and the 8 GB figure is the floor rather than a requirement. The 600
    second wall clock is one full tool window and is far more than the work
    needs; it is set at the floor rather than below it so no stopping rule is
    ever confused with a budget exhaustion. Peak RSS and wall clock are still
    reported so the envelope prediction can fail.

  stopping_rules:
    - "STAGE 0, zero compute, HARD GATE: fix the group, the generator, the sampling rule and both declared bounds; state the closed-form comparator law (uniform 1/100); and derive each arm's FORCED verdict from the quoted Step 5 text, confirming they differ at the completion tier. If they do not differ, the arms are not discriminating and NOTHING RUNS."
    - "STAGE 1, reproduction gate: re-run the order-120 member and require exact reproduction of its committed UNDECIDED verdict. A mismatch STOPS the run."
    - "STAGE 2: sample the census at S in {200, 1000, 5000, 20000}, recording the realized-class count and histogram at each, and hash the draw sequence."
    - "STAGE 3: apply Step 5 to the SAME data twice, once per arm, and record both verdicts with both bounds."
    - "STAGE 4: the withheld-class arm and the sample-size stability check at 3 * 20000."
    - "A DECIDED verdict from Arm B, or an UNDECIDED verdict from Arm A at or after the completion tier, is recorded and the run continues to completion so the full pattern is available; it is not treated as a reason to stop early and discard data."
    - "Any timeout or crash is failed_infrastructure under AGENTS.md rule 5."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Running the two arms on different census data. They must share a draw sequence, verified by hash."
    - "Declaring or changing either U after seeing any realized-class count."
    - "Reading the k ladder as genuine base change. It is a disclosed relabelling of sample-size tiers and no field-theoretic statement may be made from it."
    - "Quoting any number from this run as bearing on an elliptic curve, a cover, monodromy of a Semaev system, a relation rate, or the ECDLP."
    - "Reporting a verdict from a run whose sampler-uniformity chi-square was rejected at the largest sample size."
    - "Any post-hoc change to the sample-size tiers, the declared bounds, or the forced verdicts. A change requires a versioned protocol_amendment before the affected tiers are re-read."

  success_criterion: >-
    The run SUCCEEDS, whichever way the protocol behaves, when: the Stage 0
    non-degeneracy derivation confirms the two arms' forced verdicts differ;
    the order-120 baseline reproduces its committed UNDECIDED verdict
    exactly; the census is run at all four tiers at all three seeds with the
    draw sequence hashed and shown identical across arms; both arms' verdicts
    are reported per tier with both bounds and R_stab; the completion tier is
    located; the withheld-class arm is run and reported; the sampler
    uniformity chi-square and the 3x stability check are reported; and the
    coupon-collector curve is compared against the six already-tested battery
    members.

  falsification_criterion: >-
    THE PROTOCOL'S VERDICT IS NOT THE DECLARED FUNCTION OF ITS BOUNDS if the
    two arms return the SAME verdict at or after the completion tier. This is
    the single most consequential possible outcome and must be escalated to
    independent review rather than absorbed. THE PROTOCOL OVERCLAIMS if Arm B
    returns DECIDED at any tier, or if the withheld-class arm returns DECIDED
    in either arm at 99 realized classes. THE PROTOCOL UNDER-CLAIMS, refusing
    where its own committed rule certifies, if Arm A returns UNDECIDED at or
    after the completion tier. THE IMPLEMENTATION HAS DRIFTED, and nothing
    new is interpretable, if the order-120 baseline fails to reproduce. THE
    CENSUS IS MEASURING THE SAMPLER, and no verdict may be read, if the
    uniformity chi-square is rejected at the 1 percent level at the largest
    sample size or if the realized count moves materially when the sample is
    tripled.

  required_artifacts:
    - "Stage 0 receipt: the group, generator, sampling rule, both declared bounds, the closed-form comparator law, and the DERIVED forced verdict of each arm quoted against the Step 5 text with the source record's sha256."
    - "Stage 1 receipt: the order-120 baseline re-run and its verdict beside the committed one."
    - "The census record: draw sequence hash, realized-class count and full 100-bin histogram at each of the four tiers, at each of the three seeds."
    - "The verdict table: (arm, tier, seed) with verdict, L, R_stab and U on every row."
    - "The withheld-class arm's census and verdicts."
    - "The coupon-collector curve at fine granularity, and its comparison against the six already-tested battery members."
    - "Sampler-uniformity chi-square statistics and p-values per tier; the 3x stability check."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr, peak RSS, wall clock."
    - "A report carrying, verbatim, the unconditional scope sentence from null_object.pre_declared_consequence."

  assigned_to: executor

  limitations:
    - >-
      TOOLING/PROTOCOL CLAIM ONLY, on synthetic abstract-group data. NO ECDLP
      CLAIM OF ANY KIND, in either direction, under any outcome.
    - >-
      The ladder machinery is REPURPOSED, not genuine: no field extension
      exists behind this object and the k levels are a disclosed relabelling
      of sample-size tiers.
    - >-
      One concrete instantiation is tested, not a family. A non-abelian group
      of order 100 or 200 would also match the literal specification and
      might behave differently under sampling.
    - >-
      Passing does not certify the protocol at cryptographic-scale group
      orders, and that form of the question cannot be tested at reachable
      scale by any design in this family.
    - >-
      The source idea's single-arm prediction is superseded here because it
      would have manufactured a falsification of a `supported` record; the
      superseding reason is recorded in this contract and in the paired
      hypothesis rather than applied to the immutable source.
    - >-
      NO STATUS CHANGE to the protocol record or to any other record is
      proposed or implied.
