experiment:
  id: EXP-ECQ-89de3c
  hypothesis_id: H-ECQ-cec3c4
  version: 1
  title: >-
    Highest certifiable Mordell-Weil rank over Q from a rational elliptic
    surface, and the measured gap to the record
  status: executed
  contract_provenance: >-
    AUTHORED AFTER EXECUTION, AND THIS MUST NOT BE READ AS A PRE-REGISTERED
    CONTRACT. The producer TASK-20260822-81141a recorded as its first protocol
    deviation that no experiments/<EXP-ID>/specification.yaml existed, and that
    it executed against the handoff envelope plus H-ECQ-cec3c4 -- which between
    them carried objective, inputs, controls, metrics, budget, stopping rules,
    artifact list, completion gate and the frozen predictions P1-P3. It flagged
    this rather than refusing, which was the right call.
    This record exists for one narrow reason: tools/validate_ledger.py indexes
    run ids ONLY under experiments/*/runs/, so EV-ECQ-0d142e citing
    RUN-ECQ-81141a-001..007 failed CI with seven "references unknown run"
    errors. That failure was real and was introduced by this branch.
    NOTHING HERE WAS RECONSTRUCTED FROM MEMORY: every field below is copied from
    the committed handoff, hypothesis, and run records, and the frozen
    predictions are cited rather than restated.
  objective: >-
    Build the record-class pipeline for rank over Q -- pencil of plane cubics
    through 8 rational points giving a rational elliptic surface, Mestre-Nagao
    sieve of its specialisations, descent certification over Q -- certify the
    best rank it genuinely reaches, and measure the distance to 31 on two axes:
    base rank over Q(t) and sieve volume.
  inputs:
    contract: ledger/handoffs/TASK-20260822-81141a.yaml
    hypothesis: ledger/hypotheses/H-ECQ-cec3c4.yaml
    question: ledger/questions/RQ-ECQ-80f23c.yaml
  controls:
  - >-
    Random-sample control arm of equal size drawn from the same domain the
    Mestre-Nagao arm ranked. MANDATED IN THE HANDOFF BEFORE EXECUTION because
    the statistic had underperformed in GOAL-ECRANK-001; the red team then
    reproduced both arms independently and added a dose-response control the
    plan had not asked for.
  - >-
    Harness self-tests against known values before any family number: the
    re-verified rank-30 record curve must return exactly 30, and a conductor-37
    curve exactly 1. This control FIRED -- the producer's first independence
    criterion returned 24 on the rank-30 fixture and was replaced before any
    result existed.
  - >-
    Silverman specialisation may motivate a search but never certifies a
    specific curve; every rank is recertified on the specialised curve.
  independent_variables: [specialisation parameter t, arm (Mestre-Nagao ordered vs random control), descent alarm]
  metrics:
    primary: [best_certified_rank_over_Q, base_rank_over_Qt]
    secondary: [sieve_volume_scored, fibres_descended, descent_timeouts, per_arm_hit_rate, regulator_determinant]
  heuristic_under_test: >-
    The Mestre-Nagao statistic, used ONLY to order candidates. See
    H-ECQ-cec3c4.heuristic_assumptions HEUR-1.
  preregistered_prediction:
    quantity: predictions P1, P2, P3
    formula: null
    source: >-
      ledger/hypotheses/H-ECQ-cec3c4.yaml, frozen before execution and cited
      here rather than restated, so this post-hoc record cannot soften them.
  scale_relevance:
    tier: toy
    justification: >-
      The claim-tier table is indexed by ECDLP field bit-size and does not
      describe this result; `toy` is the least-asserting available label. The
      governing scope is in EV-ECQ-0d142e.boundaries: rank >= 31 over Q was NOT
      achieved and remains an open world record.
    correspondence: null
  tail_checks:
  - exceptional fibres recorded rather than filtered; the validator found a fifth at t = 4
  - regulators recomputed at two precisions
  replication:
    seeds: [20260822, 81141]
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 3000
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 60
    maximum_workers: 1
  stopping_rules:
  - per-fibre descent guarded by a PARI alarm; a timeout contributes ZERO and is counted separately
  invalidation_rules:
  - any exhibited point failing an exact on-curve check invalidates its curve's rank
  - a singular r x r regulator drops the rank claim to the independent subset
  success_criterion: >-
    A certified best rank over Q backed by exhibited points on that exact curve,
    plus the gap to 31 stated as numbers on both axes.
  falsification_criterion: >-
    The 8 sections are dependent (construction wrong), or no specialisation
    certifies above the generic 8 within budget.
  required_artifacts:
  - qt_family.json
  - certified_curves.json
  - gap_analysis.json
  - report.md
  assigned_to: executor
  approved_by: coordinator
