experiment:
  id: EXP-CLGP-bd0757
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-5d7606
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'FORWARD REDUCTION ATTEMPT, STATED AND THEN BROKEN AT A NAMED POINT: a free Cl(O)-vectorization
    oracle for the instance''s own isogeny class does not solve ECDLP, because the unique canonical
    point-to-curve bridge is the Deuring kernel-ideal correspondence, that correspondence is defined
    on SUBGROUPS, and a prime-order subgroup has exactly one nonzero subgroup, so the bridge is CONSTANT
    on the instance family'
  status: draft
  objective: "(A) THE REDUCTION BEING ATTEMPTED, WITH ITS QUANTIFIER ORDER WRITTEN OUT. The statement\
    \ a forward reduction would have to establish is\n\n  FORALL primes p > 3,\n  FORALL ordinary\
    \ E/F_p with End_{F_p}(E) = O an order in K = Q(sqrt(D)),\n  FORALL P in E(F_p) generating a subgroup\
    \ G of PRIME order N,\n  THERE EXISTS a probabilistic polynomial-time oracle machine R\n  such\
    \ that FORALL k in Z/N,\n    Pr[ R^{V_E}(p, E, P, [k]P) = k ] >= 2/3,\n\nwhere V_E is a vectorization\
    \ oracle for the isogeny class of E: on input a pair (E_1, E_2) of curves in that class with End\
    \ = O it returns the unique [a] in Cl(O) with [a] * E_1 = E_2, at unit cost.\nThe order is load-bearing\
    \ and is the exact place these arguments usually break. R is allowed to depend on the CURVE (a\
    \ per-curve, even nonuniform, reduction is granted, which is generous), but is required to work\
    \ for ALL k on that curve. Two weaker readings must never be substituted for it:\n  (W1) FORALL\
    \ k THERE EXISTS R_k -- letting the machine depend on the\n       answer. Satisfied trivially\
    \ by the machine that prints k. Proves\n       nothing. Any argument that slides into this order\
    \ is void.\n  (W2) FORALL (E, P, Q) THERE EXISTS a curve pair whose vectorization\n       determines\
    \ k -- an existential over queries with no requirement that\n       R can CONSTRUCT that pair.\
    \ This is the reading that makes a\n       nonexistent reduction look plausible: such a pair does\
    \ exist\n       (see (D)), and it is not constructible from the instance.\n\n(B) THE ONLY CANONICAL\
    \ BRIDGE, NAMED. For an ordinary curve with End_{F_p}(E) = O, the Deuring/Waterhouse ideal-subgroup\
    \ correspondence assigns to each finite O-stable subgroup H of E an O-ideal a_H, with H = E[a_H]\
    \ and E/H = [a_H]^{-1} * E. This is the point at which the point world and the curve world actually\
    \ touch, and it is the map any forward reduction is implicitly reaching for. Composing gives the\
    \ canonical point-to-curve bridge\n    beta : Q  |-->  <Q>  |-->  a_{<Q>}  |-->  [a_{<Q>}] in\
    \ Cl(O).\n\n(C) OBS-1, THE PRIME-ORDER COLLAPSE -- WHERE beta FAILS. N is prime, so for every\
    \ k in (Z/N)^*, <[k]P> = <P> = G. Therefore beta([k]P) = beta(P) for every nonzero k, and the\
    \ ideal it returns is the SAME ideal\n    n = (N, pi - 1)  (of norm N, dividing (pi - 1) since\
    \ G is contained in\n    ker(pi - 1) = E(F_p)),\na function of (E, N) alone. The bridge EXISTS,\
    \ is efficiently computable, and carries exactly ZERO bits about k. This is the sharpest available\
    \ form of the obstruction, and note its shape: the failure is not that no map exists -- the map\
    \ exists and is canonical -- but that it is constant on the instance family. That distinction\
    \ is the whole content of this record. Corollary (OBS-1'): ANY curve-valued function of (E, P,\
    \ Q) that factors through the subgroup lattice of E is k-constant on {(E,P,[k]P)}.\n(D) OBS-2,\
    \ THE DENSITY OBSTRUCTION -- WHERE THE OBVIOUS REPAIR FAILS. The natural repair is to build a\
    \ curve from Q by NON-subgroup means, e.g. feed x(Q) in F_p into a curve construction. Such a\
    \ curve does depend on k. But V_E is only defined on curves in the isogeny class of E, and the\
    \ class contains ~ h(O) = O(sqrt(p) log p) of the ~ 2p isomorphism classes over F_p, i.e. a subset\
    \ of DENSITY ~ p^{-1/2}. A k-dependent construction that is not designed to preserve the trace\
    \ lands in the class with probability ~ p^{-1/2}, so rejection sampling to get a usable query\
    \ costs ~ p^{1/2} trials -- exactly rho's exponent, with each trial additionally paying a point\
    \ count. So this repair cannot beat the baseline even in the best case, and this is a QUANTITATIVE\
    \ closure, not a hand-wave. (Membership in the class IS decidable in polynomial time by point\
    \ counting; the obstruction is the density, not the test.) Note the existential in (W2) is exactly\
    \ what (D) makes non-constructive: a pair whose vectorization encodes k does exist -- take any\
    \ bijection Z/N -> a size-N subset of instances -- but naming its second component requires knowing\
    \ k.\n(E) WHAT WOULD FALSIFY THIS RECORD, CONCRETELY. Exhibit a polynomial-time algorithm that,\
    \ from (E, P, Q) alone, outputs a curve E'' in the isogeny class of E such that the map k |->\
    \ E''(k) is non-constant on (Z/N)^*. That is a single, checkable object. Its existence would refute\
    \ OBS-1' and reopen the forward direction immediately. This record asserts no impossibility theorem\
    \ for arbitrary algorithms -- see interpretation_limits."
  resource_label: 'R3 (End(E) as a ring: the kernel-ideal correspondence and the ideal n = (N, pi
    - 1)) and R4 (the class-group action on curves, via the vectorization oracle). No step applies
    an endomorphism to a point of G.'
  admissibility: admissible
  admissibility_argument: 'The resource is not a group-operation output. A vectorization oracle answers
    a question about CURVES (which element of Cl(O) connects them); nothing in the mechanism applies
    phi to a point of G, so the H-ENDO-001 scalar-collapse filter does not apply, and KN-FIND-b7e091''s
    two closed oracle classes (incidence, endomorphism-image) are not the oracle used here. The proposal
    is therefore admissible on its face -- and it then fails for a DIFFERENT reason, which is exactly
    why it is worth filing: a lane can pass the admissibility filter and still be closed.'
  reachability_gate: 'T5 STATUS: this proposal PASSES the gate trivially and that is the point. It
    never needs to reach a specified curve. Its queries are either (a) E itself and its subgroup quotients,
    all reachable at zero cost, or (b) curves reached by walking, whose class-group coordinates are
    known BY CONSTRUCTION because the walker chose them. Reaching a SPECIFIED curve -- the hard direction,
    ~sqrt(h) = p^{1/4} -- is never required, because the argument''s conclusion is that no specified
    curve is worth reaching: the target-relevant curve E/<Q> is k-constant. So the gate is not the
    binding constraint in this lane; OBS-1 is, and it binds strictly earlier and more cheaply.'
  inputs:
    procedure: 'STAGE 0 (zero compute): freeze the quantifier order and run Step 2''s enumeration
      on paper. If a reviewer supplies a constructible k-dependent in-class curve, the record is refuted
      before any compute is spent. This stage alone is the cheapest valid discriminator in the lane.
      STAGE 1 (minutes): build the toy family -- ordinary curves at 12, 16, 20 bits with prime-order
      subgroup, End computed by Kohel-style volcano classification or by direct order determination
      from t and the conductor. Verify the primality and N^2-nondivisibility controls. STAGE 2 (minutes,
      HARD GATE): compute beta([k]P) for 200 k per curve. Predicted constant. Then run the composite-order
      null; predicted non-constant. Both gates must fire in the predicted directions. STAGE 3 (minutes):
      the density measurement of Step 4 across the p-ladder, with a random-trace null. STAGE 4 (zero
      compute): write the residual open class.'
    mechanism: "STEP 1 (zero compute, symbolic). Write the reduction statement in the quantifier order\
      \ of (A). Freeze it. All subsequent steps refer to it.\nSTEP 2 (zero compute, symbolic). Enumerate\
      \ the curve-valued functions of the instance that a polynomial-time R can actually construct:\n\
      \  (i) E itself and its twists;\n  (ii) E/H for H a finite subgroup of E that R can name --\
      \ and R can name\n       subgroups only as <S> for points S it holds, or as E[m] for integers\n\
      \       m, or as ker(phi_a) for ideals a it writes down;\n  (iii) [a] * E for ideals a written\
      \ down independently of Q;\n  (iv) curves built from field elements R possesses, principally\
      \ x(Q).\nClassify: (i)-(iii) are k-independent by inspection. (ii) with H = <Q> is k-independent\
      \ by OBS-1. (iv) is k-dependent but lands in the class with density p^{-1/2} (OBS-2). This enumeration\
      \ is the argument's load-bearing step and is the thing an adversarial reviewer should attack.\n\
      STEP 3 (toy compute, cheap, HARD GATE). Instrument the constancy claim rather than asserting\
      \ it. For each toy curve in the frozen family: compute G, compute n = (N, pi - 1) as a binary\
      \ quadratic form / ideal in O, and for 200 values of k compute a_{<[k]P>} and E/<[k]P>. Assert\
      \ equality across all k. A single k for which the ideal or the quotient curve differs falsifies\
      \ OBS-1 as implemented (almost certainly an implementation error, since OBS-1 is elementary\
      \ -- so a mismatch halts the line for debugging and is NOT reported as mathematics).\nSTEP 4\
      \ (toy compute). Measure OBS-2's density directly: enumerate all F_p-isomorphism classes for\
      \ small p, count those with trace t, and compare the measured density against h(O)/(2p) and\
      \ against the predicted p^{-1/2} scaling across a ladder of p. This turns the density obstruction\
      \ from a quoted asymptotic into a measured curve at toy scale, with its own null (the same count\
      \ for a random trace t' != t).\nSTEP 5 (zero compute). Record the residual open class explicitly:\
      \ constructions of type (iv) that are ENGINEERED to preserve the trace, i.e. curve-valued functions\
      \ of x(Q) as a FIELD ELEMENT (resource R1) composed with a trace-preserving construction. This\
      \ record does not close that class; it hands it to the R1 lanes and to IDEA-20260807-326442."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - composite-order curves N = ell^e -- the calibrated non-null; the instrument MUST see a non-constant
    bridge there
  - primality and N^2-nondivisibility check per instance, recorded, not assumed
  - random-trace null for the density measurement
  - rho baseline (harness/rho.py) reproduced at 0.886 sqrt(N) within 20 percent, so the cost comparison
    in OBS-2 is anchored
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. Matched null of the same shape: the
    SAME pipeline run on curves where G has COMPOSITE order, specifically N = ell^e (see IDEA-20260807-e9d57c).
    There the bridge beta is NOT constant -- a_{<[k]P>} has norm ell^{e - v_ell(k)} -- so the instrument
    must report a non-constant bridge. An instrument that reports "constant" on the composite-order
    null cannot see a bridge at all, every constancy verdict it produced is void, and the run set
    is INVALID rather than negative. DECAY PARAMETER: e, the exponent in N = ell^e. As e decreases
    to 1 the bridge''s measured information about k must decay to zero (log2(e+1) -> 0 bits); a signal
    that does NOT decay as e -> 1 is the canonical artifact tell and indicates the detector is reading
    something other than the bridge.'
  independent_variables: []
  metrics:
    primary:
    - distinct-value count of beta over sampled k, per curve, prime case
    - the same, composite-order null case, stratified by e
    - measured class density versus p, with fitted slope and CI
    - per-instance pass/fail of primality and N^2 controls
    secondary:
    - rho baseline operation counts on the same instances
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of distinct values of beta([k]P) over 200 sampled k in (Z/N)^*, per toy curve
      with N prime
    formula: Exactly 1, on 100 percent of tested curves. Any curve returning 2 or more distinct values
      with N prime and the primality control passing falsifies OBS-1 and halts everything.
    source: pre-registered in IDEA-20260807-5d7606 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - ENDOMORPHISM RING LEVEL. Curves at different levels of the ell-volcano have different orders O
    and different h(O). Every measurement must be stratified by O, or a level effect will be misread
    as a bridge effect.
  - TWISTS. E and its quadratic twist have traces t and -t and are NOT in the same class. A pipeline
    that silently accepts twists will report a spurious doubling of class size and corrupt the density
    measurement.
  - SMALL-p ARTIFACTS. At 12 bits, h(O) can be 1 or 2, so the class is a single curve and every curve-level
    quantity is trivially constant for reasons unrelated to OBS-1. The p-ladder must reach h(O) >=
    20 before any constancy claim is made, and h(O) must be reported per instance.
  - IMPLEMENTATION OF THE IDEAL. Representing O-ideals as binary quadratic forms requires a fixed
    reduction convention; two reduced forms that are equal as classes must not be counted as distinct
    values of beta. The reduction convention is frozen before Stage 2.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Exactly 1, on 100 percent of tested curves. Any curve returning 2 or more distinct
    values with N prime and the primality control passing falsifies OBS-1 and halts everything.
  falsification_criterion:
  - A polynomial-time construction is exhibited that maps (E, P, Q) to a curve in the isogeny class
    of E depending non-constantly on k. OBS-1' is false, the forward direction is live, and this record
    is superseded.
  - Any toy curve with N prime yields two distinct values of beta. OBS-1 is false as implemented;
    halt and debug -- OBS-1 is elementary, so this is an instrument failure until independently replicated.
  - The composite-order null returns a constant bridge. Instrument blind; run set INVALID, not negative
    (AGENTS.md rule 5 analogue for statistical rather than infrastructure failure).
  - Measured class density decays materially slower than p^{-1/2}. OBS-2's p^{1/2} rejection-sampling
    cost is wrong and must be recomputed; the qualitative conclusion may survive but its quantitative
    form does not.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-5d7606
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
