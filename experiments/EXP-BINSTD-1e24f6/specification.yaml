# EXP-BINSTD-1e24f6
# Tenths arithmetic for one written exchange rate. No solver.
# Approved by DEC-20261002-b568b5.
experiment:
  id: EXP-BINSTD-1e24f6
  hypothesis_id: H-BINSTD-af813d
  source_idea: IDEA-20260922-818b73
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Tenths arithmetic of one written exchange rate
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-b568b5
  objective: >-
    Subtract the written tenths 609, 606 and 1330. Place 2^{3/10}
    strictly between 123/100 and 124/100. Reject the claim that the
    power is at most 123/100, and reject a gap of at most 72 bits.
  inputs:
    baseline_tenths: 609
    idealized_floor_tenths: 606
    realistic_floor_tenths: 1330
    small_difference_tenths: 3
    large_difference_tenths: 721
    power_above_123_over_100: true
    power_below_124_over_100: true
    gap_above_72: true
    gap_below_73: true
    gap_above_50: true
  controls:
    - >-
      2^{3/10} <= 123/100 is false. Reporting it true invalidates the
      run.
    - >-
      The large gap is at most 72 bits is false. Reporting that
      invalidates the run.
    - Two integer routes. They must not import each other.
  independent_variables:
    - comparison
    - route in {tenth_powers, repeat_module}
  metrics:
    primary:
      - small_difference_tenths
      - large_difference_tenths
      - power_above_123_over_100
      - power_below_124_over_100
      - gap_above_72
      - at_most_123_rejected
      - at_most_72_rejected
      - implementations_agree
    secondary:
      - gap_above_50
      - gap_below_73
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Two tenth-differences and two power comparisons.
    formula: >-
      609 - 606 = 3 and 1330 - 609 = 721. 2^{3/10} > 123/100 exactly
      when 8 * 100^{10} > 123^{10}, and it is below 124/100 when
      8 * 100^{10} < 124^{10}.
    source: >-
      IDEA-20260922-818b73 worked example, read 2026-10-02. The
      comparisons were recomputed in this design session. That
      computation is not a run. The written factor about 1.23 is a
      lower hundredth the power exceeds. No solver was run.
  scale_relevance:
    tier: toy
    justification: Integer arithmetic on three written figures. No transfer to a measured solver.
    correspondence: null
  tail_checks:
    - The comparison with 124/100 is required. Stopping after 123/100 and still reporting the upper bound is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other integer route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the power is reported at most 123/100, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The power is reported at most 123/100.
    - The gap is reported as at most 72 bits.
    - A solver run or a cell closure is reported.
  success_criterion: >-
    Both runs agree. The differences are 3 and 721 tenths. The power
    is strictly above 123/100 and strictly below 124/100. The gap is
    strictly above 72, strictly below 73, and strictly above 50. Both
    rejected claims stay rejected.
  falsification_criterion: >-
    The runs agree, the power stays above 123/100, the gap stays above
    72, and any difference or comparison differs from the preregistered
    table.
  required_artifacts:
    - experiments/EXP-BINSTD-1e24f6/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-1e24f6/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-1e24f6/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-1e24f6/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-1e24f6/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-1e24f6/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any solver measurement or cell closure.
    - A new estimate of the rho baseline.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
