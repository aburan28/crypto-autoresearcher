# EXP-CERTBIN-5a55c4
# Uniform Z/4 label counts. No curve.
# Approved by DEC-20261002-df3abe.
experiment:
  id: EXP-CERTBIN-5a55c4
  hypothesis_id: H-CERTBIN-3d70ab
  source_idea: IDEA-20260926-ae8f0a
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Uniform Z/4 label counts
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-df3abe
  objective: >-
    Count uniform labels in Z/4 that sum to 0, separate the
    modulo-2 patterns from the modulo-4 patterns, and subtract
    two bits from the written floor gap.
  inputs:
    rows:
      - {m: 2, total: 16, survive_mod4: 4, unsat_mod4: 12, survive_mod2: 8, incremental: 4, prefixes: 4, completions_each: 1}
      - {m: 3, total: 64, survive_mod4: 16, unsat_mod4: 48, survive_mod2: 32, incremental: 16, prefixes: 16, completions_each: 1}
    z2_rows:
      - {m: 2, total: 4, survive: 2}
      - {m: 3, total: 8, survive: 4}
    factor_m2: 4
    kernel: [0, 2]
    kernel_size: 2
    image_size: 2
    product: 130412
    partner: 32603
    partner_prime: true
    partner_mod4: 3
    square_below: 32400
    square_above: 32761
    gap_hundredths: 777
    two_bit_hundredths: 200
    reduced_gap_hundredths: 577
    reduced_above_570: true
    reduced_below_580: true
    reduced_positive: true
  controls:
    - >-
      An unsatisfiable count of 8 at m = 2 for the modulo-4 test
      is the modulo-2 count. The modulo-4 count is 12. Reporting
      8 as the modulo-4 count invalidates the run.
    - >-
      A level-2 increment of 0 is false. The increment is 4 at
      m = 2 and 16 at m = 3. Reporting 0 invalidates the run.
    - >-
      A kernel other than {0, 2} is false. Reporting an empty
      kernel or the kernel {0} invalidates the run.
    - >-
      The reduced gap at most 5.7 bits is false. 577 is strictly
      above 570 and strictly below 580. Reporting otherwise
      invalidates the run.
    - >-
      A composite reading of 32603 is false. 180 squared is
      32400, which is strictly below 32603, and 181 squared is
      32761, which is strictly above 32603. Reporting a factor
      invalidates the run.
    - Two counting routes. They must not import each other.
  independent_variables:
    - arity
    - route in {enumerate, prefix_completion}
  metrics:
    primary:
      - unsat_mod4
      - incremental
      - kernel
      - implementations_agree
    secondary:
      - reduced_gap_hundredths
      - partner_prime
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The m = 2 unsatisfiable count 12 and the increment 4.
    formula: >-
      Labels are uniform in {0, 1, 2, 3}. The last label is the
      unique residue that makes the sum 0 modulo 4, so each
      prefix has one completion. Survivors are 4 to the power
      m-1. Pairs with even sum that are 2 modulo 4 are the
      increment. The kernel of reduction modulo 2 is {0, 2}.
      The reduced gap in hundredths is 777-200.
    source: >-
      IDEA-20260926-ae8f0a states the Z/4 sum constraint and a
      near-3/4 share, read 2026-10-02. The pattern counts were
      enumerated in this design session. That enumeration is not
      a run. The uniform share is exactly 12 of 16. No curve
      was built.
  scale_relevance:
    tier: toy
    justification: Two alphabet counts. No transfer to a curve.
    correspondence: null
  tail_checks:
    - The m = 3 row is required. Stopping after m = 2 and still reporting the m = 3 counts is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other counting route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the m = 2 modulo-4 unsatisfiable count is reported as 8, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The m = 2 modulo-4 unsatisfiable count is reported as 8.
    - The level-2 increment is reported as 0.
    - The kernel is reported as anything other than {0, 2}.
    - The reduced gap is reported at most 5.7 bits or at least 5.8 bits.
    - 32603 is reported composite, or the product is reported different from 130412.
    - A curve point count or a point halving is reported.
  success_criterion: >-
    Both runs agree on the m = 2 counts 16, 4, 12, 8, and 4, on
    the m = 3 counts 64, 16, 48, 32, and 16, on one completion
    per prefix, on the kernel {0, 2}, on the product 130412, on
    32603 being prime, and on the reduced gap 577. The increment
    stays positive. The gap 577 stays strictly above 570 and
    strictly below 580.
  falsification_criterion: >-
    The runs agree, the increment stays positive, the kernel
    stays {0, 2}, and any count differs from the preregistered
    table.
  required_artifacts:
    - experiments/EXP-CERTBIN-5a55c4/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-5a55c4/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-5a55c4/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-5a55c4/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-5a55c4/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-5a55c4/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any curve, point halving, cofactor check, or factor-base census.
    - A claim that a leg-label filter helps or does not help.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
