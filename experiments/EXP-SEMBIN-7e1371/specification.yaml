experiment:
  id: EXP-SEMBIN-7e1371
  hypothesis_id: H-SEMBIN-2d7708
  version: 1
  title: >-
    Locate the d_F4 = 4 versus d_F4 >= 5 boundary of Semaev's Assumption 1 in
    (n, m, t, k) using degree-4 Macaulay rank certificates instead of Groebner
    completions
  status: approved
  objective: >-
    Turn Assumption 1 from an asserted bound into a measured surface, at the largest
    parameters this machine can certify. Two regions are targeted for opposite reasons.
    Off the diagonal, the paper itself reports that the regularity degree "generally
    exceeds 4 when k > ceil(n/m) though the first fall degree is still 4" (end of
    Section 4.5.1) -- so the paper exhibits a d_F4 > d_ff regime by its own account and
    never measures where it starts. Measuring the threshold in k there is cheap, is the
    paper's own stated boundary rather than a hostile extrapolation, and prices the
    factor-base-enlargement lever in degree.
    On the diagonal, Semaev's Table 2 reports d_F4 = 4 at n = 40, m = t = 2, k = 20 and
    Kosters' unreproduced comment-thread pointer reports step degree 5 at n = 45,
    m = t = 2 at 126 GB. Those two cells are five apart in n on the same diagonal. The
    hypothesis predicts the diagonal survives across that window and that the
    discrepancy is definitional; this experiment measures each of n = 40..45 and finds
    out.
    The whole approach turns on replacing "run F4 and see what degree it reaches" --
    which cost 111-126 GB at exactly these cells -- with a fixed-degree rank certificate
    that answers the same yes/no question inside 8 GB. That substitution is itself a
    load-bearing claim and carries its own control below.
  inputs:
    curve: >-
      E/F_{2^n}: Y^2 + XY = X^3 + A X^2 + B, B = 1 and random B
    system: >-
      chained S_3 system of KN-LIT-fa346d eq. (5) Weil-descended over F_2, n(t-1)
      equations in N = n(t-2) + kt variables of algebraic degree 3
    certificate: >-
      degree-4 Macaulay block over F_2 -- all products of the n(t-1) cubic generators
      and the field equations by monomials up to total degree 4 -- with rank and rank
      deficiency against the count of degree-<=4 monomials,
      sum_{d<=4} C(N,d)
    frozen_source: inputs/SEMAEV-2015-310/
    diagonal_baseline_cells:
      - {n: 17, m: 3, t: 3, k: 6, paper_reported_d_F4: 4, paper_table: 1}
      - {n: 40, m: 2, t: 2, k: 20, paper_reported_d_F4: 4, paper_table: 2}
    m2_window:
      - {n: 40, m: 2, t: 2, k: 20}
      - {n: 41, m: 2, t: 2, k: 21}
      - {n: 42, m: 2, t: 2, k: 21}
      - {n: 43, m: 2, t: 2, k: 22}
      - {n: 44, m: 2, t: 2, k: 22}
      - {n: 45, m: 2, t: 2, k: 23}
    off_diagonal_sweeps:
      - {n: 17, m: 3, t: 3, k_range: [6, 7, 8, 9]}
      - {n: 19, m: 3, t: 3, k_range: [7, 8, 9, 10]}
      - {n: 21, m: 3, t: 3, k_range: [7, 8, 9, 10]}
      - {n: 13, m: 4, t: 4, k_range: [4, 5, 6]}
      - {n: 12, m: 6, t: 6, k_range: [2, 3, 4]}
    subspace_variants: [low_degree_polynomial, random_k_dimensional]
    draws_per_cell: 10
    seeds: [20260913101, 20260913102, 20260913103, 20260913104, 20260913105]
  controls:
    - kind: baseline
      design: >-
        The two published diagonal cells at n = 17 and n = 40 where the paper reports
        d_F4 = 4. The degree-4 certificate must return SUFFICIENT at both, and the
        commensurable F4 trace carried over from EXP-SEMBIN-c2c312 must return 4 at
        n = 17. Without this the certificate is not known to measure what F4 measured.
    - kind: nearby_object
      design: >-
        The SINGLE summation polynomial system of eq. (4) at matched (n, m, t, k),
        whose algebraic degree is 2^{t-1} rather than 3. Its degree-4 certificate must
        be INSUFFICIENT at every cell, including the diagonal cells where the chained
        system's is sufficient. A certificate reporting sufficiency for eq. (4) at
        t >= 3 is detecting the shape of the Macaulay construction and not the chained
        structure, and voids the instrument.
    - kind: matched_null
      design: >-
        A random dense Boolean system of matched shape (same variable count, equation
        count and degree profile). Its degree-4 certificate must be insufficient at
        every k, so a sufficiency verdict is known to carry information.
    - kind: certificate_soundness
      design: >-
        On every cell where a full Groebner completion is also affordable inside the
        cap, run both and compare verdicts. Agreement is required. A disagreement
        refutes the certificate's soundness claim and kills the whole route -- which is
        a result about the method, not about Semaev, and must be reported as such.
    - kind: known_false
      design: >-
        A system with a planted degree-2 solution, where the degree-2 Macaulay block
        must already be sufficient. A certificate that needs degree 4 on it is
        mis-measuring.
    - kind: invalid_input
      design: >-
        k = 0, and t > m. Both must be rejected by the generator.
    - kind: monotonicity_probe
      design: >-
        Within each off-diagonal sweep, k is advanced one unit at a time with the full
        deficiency recorded at every k, so a non-monotone profile is visible rather
        than skipped over. HEUR-002 predicts monotone non-increase; the probe is what
        makes it falsifiable.
  independent_variables:
    - k, swept one unit at a time above ceil(n/m)
    - n, over the m = 2 window 40..45
    - m
    - t
    - subspace variant
    - curve coefficient B
    - system family (chained eq. 5; single eq. 4; matched random null)
  metrics:
    primary:
      - degree4_sufficiency_verdict
      - degree4_rank_deficiency
      - threshold_k_star
      - threshold_delta_above_diagonal
      - deficiency_profile_in_k
    secondary:
      - macaulay_rows
      - macaulay_columns
      - peak_resident_gb
      - wall_clock_seconds
      - groebner_verdict_where_affordable
      - system_sha256
      - unreached_cell_column_count
  heuristic_under_test: HEUR-002
  preregistered_prediction:
    quantity: >-
      The sufficiency verdict of the degree-4 Macaulay block as a function of
      (n, m, t, k), and the threshold in k at fixed (n, m, t).
    formula: >-
      Sufficient for all k < k* and insufficient for all k in [k*, k_max], with
      k* = ceil(n/m) + delta and delta in {1, 2}; rank deficiency monotone
      non-increasing in k (HEUR-002); and sufficient at every measured diagonal cell
      k = ceil(n/m) including all of n = 40..45 at m = t = 2. Counting basis: the
      system has n(t-1) equations in n(t-2) + kt variables, so it is overdetermined iff
      n > kt, and the diagonal k = ceil(n/m) at t = m sits exactly at that boundary
      with the ceiling supplying the slack; each unit of k adds t variables and no
      equations.
    source: >-
      The paper's own Section 4.5.1 statement that regularity degree generally exceeds
      4 when k > ceil(n/m) while first fall degree stays 4
      (inputs/SEMAEV-2015-310/paper_fulltext.md); the equation and variable counts of
      eq. (5); the overdetermination boundary derived in H-SEMBIN-2d7708 mechanism.
  scale_relevance:
    tier: toy
    justification: >-
      Off-diagonal cells reach n <= 21; the diagonal m = 2 window reaches n = 45, which
      is beyond the largest cell the paper publishes (n = 40) and is where the
      unreproduced counter-data sits. The paper's conclusion needs n = 409, 571 at
      m = 11, 12, so a roughly 13-fold extrapolation in n and 6-fold in m remains
      untouched by this experiment. NO transfer to cryptographic n is claimed. Cells
      whose degree-4 column count exceeds the memory cap are declared unreached with
      that column count recorded, which is itself the reportable quantity.
    correspondence: null
  tail_checks:
    - >-
      Report the rank deficiency at every k in each sweep, not only the threshold. A
      threshold reported without its profile hides non-monotonicity, which is HEUR-002's
      falsification condition.
    - >-
      Report the largest n reached at m = 2 with its exact column count and peak
      memory, so the gap to Kosters' 126 GB cell is quantified rather than described.
    - >-
      Report every cell where the degree-4 certificate and an affordable Groebner
      completion disagree, individually. One disagreement is fatal to the route and
      must not be averaged away.
    - >-
      Report the deficiency at the diagonal cells separately from the off-diagonal
      sweep, since the hypothesis makes opposite predictions for the two and pooling
      them would obscure both.
  replication:
    seeds: [20260913101, 20260913102, 20260913103, 20260913104, 20260913105]
    independent_instances: 10
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: null
    maximum_memory_gb: 8
    maximum_runs: 700
    maximum_workers: 1
  stopping_rules:
    - >-
      Stop and report a procedure defect if the degree-4 certificate does not return
      sufficient at both published diagonal baseline cells.
    - >-
      Stop a cell at its cap and record it unreached WITH its computed Macaulay row and
      column counts and its peak memory. Under AGENTS.md rule 5 an exhausted cell is
      never negative mathematical evidence, and the column count is the datum that lets
      a later session with more memory price the same cell.
    - >-
      Stop the whole run if the nearby-object control reports sufficiency for eq. (4) at
      t >= 3, or if the matched-null control reports sufficiency. The instrument is then
      measuring shape.
    - >-
      Stop the whole route if the certificate and an affordable Groebner completion
      disagree anywhere, and report it as a refutation of the certificate method.
    - >-
      Do not extend the cell set to chase a threshold. Advancing k beyond k_max, or n
      beyond 45, is a successor experiment under a new contract.
  invalidation_rules:
    - >-
      A cell is invalid unless the generated system is verified structurally to have
      n(t-1) equations in n(t-2) + kt variables of degree 3 before the certificate runs.
    - >-
      A cell is invalid if the field equations were not included as explicit generators,
      since the certificate's soundness claim is stated for that construction.
    - >-
      The run is invalid if the known-false planted-degree-2 control needs degree 4.
    - >-
      The m = 2 window is invalid as a comparison against Semaev's n = 40 cell unless
      the same subspace convention is used, since Table 1's starred rows show the
      convention changes behaviour.
    - >-
      No verdict may be recorded for a cell whose certificate did not complete. An
      incomplete certificate is unreached, not insufficient -- conflating the two would
      manufacture a boundary out of a memory limit, which is the single most likely way
      this experiment produces a false positive.
  success_criterion: >-
    The degree-4 certificate returns sufficient at both published diagonal cells and
    insufficient for both control families; a threshold k* is located for at least
    three of the five off-diagonal sweeps with its full deficiency profile; and a
    sufficiency verdict or an explicit unreached declaration is recorded for each of
    n = 40..45 at m = t = 2. Reporting the boundary as unreached with its measured
    column counts satisfies the criterion; reporting it as absent when cells were
    merely unaffordable does not.
  falsification_criterion: >-
    A diagonal cell at n <= 40 where the certificate is insufficient refutes the
    hypothesis's second clause -- and is the stronger result against Semaev, to be
    reported as such rather than as a confirmation. Degree 4 sufficient at every k up to
    k_max in every sweep refutes the first clause and points at the instrument or the
    degree definition, since it would fail to reproduce the paper's own Section 4.5.1
    sentence. A non-monotone deficiency profile refutes HEUR-002. Certificate and
    Groebner disagreement refutes the method.
  required_artifacts:
    - the generated system per instance with its sha256, retained verbatim
    - Macaulay row and column counts, rank, and deficiency per cell per draw
    - the full deficiency profile in k per sweep
    - sufficiency verdict per cell, with unreached cells distinguished explicitly from insufficient ones
    - Groebner verdicts wherever a completion was affordable, and the comparison per cell
    - all six control outcomes
    - the exact command, git commit and dirty-tree state
    - engine name and version; field-equation convention; subspace convention
    - peak resident memory and wall clock per cell
    - stdout and stderr, retained for failed and unreached cells
    - a machine-readable results table keyed by (n, m, t, k, family, subspace, B, seed)
  assigned_to: executor
  approved_by: DEC-20260913-ebd639
  approval_basis: >-
    Standing user authorization of 2026-09-06. Approval asserts protocol completeness,
    not that H-SEMBIN-2d7708 is true.
  dependencies:
    - EXP-SEMBIN-c2c312
  dependency_rationale: >-
    Without the stated d_F4 map from EXP-SEMBIN-c2c312, a measured degree 5 here is
    equally explicable as a definitional difference from Semaev's convention, and no
    boundary claim would be interpretable. The dependency is scientific, not merely
    administrative.
  interpretation_limits:
    - >-
      Scoped to Assumption 1 alone. Assumption 2 (Section 4.6) is a different claim
      under which the asymptotic bound stands while the Table 3 estimates do not
      generally survive. A result here must never be reported as refuting "Semaev 2015".
    - >-
      Off-diagonal failure is not a defect of the paper: the paper asserts Assumption 1
      on the diagonal and reports the off-diagonal failure itself. What is new is the
      quantity -- where the boundary is and how sharp.
    - >-
      Kosters' n = 45 and n = 25 figures are blog-comment data with no published
      artifact (KN-LIT-e77232). They motivate the m = 2 window and support no
      conclusion.
    - >-
      No transfer to n = 409, 571, and no claim about the security of any deployed
      curve in either direction.
