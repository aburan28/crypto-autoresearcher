# =============================================================================
# EXP-SEMBIN-7e1371 -- protocol amendment v1 -> v2 (additive). Adopted by
# DEC-20261011-712e40 (NA-1 of DEC-20261005-859f40). specification.yaml (v1)
# is NOT edited; it stays the immutable v1 text. Where v1 and this file differ,
# this file governs every v2 measurement.
#
# POST-DATA. This amendment was written after the twelve m = t = 2 window
# systems of RUN-SEMBIN-5ed13e were measured, reviewed and read (EV-SEMBIN-702d1d).
# For those twelve, and for every record of RUN-SEMBIN-9bb990, it is
# EXPLORATORY ONLY. It is confirmatory only for draws generated from the v2 seed
# family below, none of which exists when this file is written.
#
# It authorizes no run. No hypothesis, experiment or goal status changes here.
# Not effective until TASK-20261011-2e0636 commits it and its receipt verifies.
# =============================================================================
protocol_amendment:
  id: PA-SEMBIN-7e1371-v1-to-v2
  id_note: >-
    Descriptive amendment label, not an allocated record id. The allocator has no
    amendment type; the label follows the precedent PA-DS-001-v1-to-v2
    (experiments/EXP-DS-001/amendments/v1_to_v2.yaml). The file path is the
    binding reference.
  experiment_id: EXP-SEMBIN-7e1371
  hypothesis_id: H-SEMBIN-2d7708
  question_id: RQ-SEMBIN-fa2e3f
  goal_id: GOAL-SEMBIN-5078bc
  version_from: 1
  version_to: 2
  recorded_at: '2026-10-11'
  authored_by: coordinator
  approved_by: coordinator
  adopted_by_decision: DEC-20261011-712e40
  archived_by: TASK-20261011-2e0636
  approval_scope: >-
    The Coordinator adopts this text as the protocol of record for any future
    EXP-SEMBIN-7e1371 measurement. Adoption is not a dispatch: no v2 run may start
    until a later Coordinator decision records the AGENTS.md "Approval is bounded by
    execution" checks (runnable: tools/newest_experiments.py --experiment
    EXP-SEMBIN-7e1371 reports execution_state ready; capacity) and a committed
    handoff names its archival task.
  v1_path: experiments/EXP-SEMBIN-7e1371/specification.yaml
  v1_edited: false
  precedence: >-
    specification.yaml (v1, unedited) plus this file. Where they differ, this file
    governs. Every v1 clause not named under `changes` stands as written, including
    the preregistered prediction, the success criterion and the falsification
    criterion, which this amendment does not reword. It changes the object those
    clauses refer to (C-1 to C-4), one precedence between two of them (C-5), one
    control (C-6), checks (C-7, C-8) and the draws on which any prospective
    prediction may be evaluated (C-9).

  data_status:
    label: post_data_exploratory_for_data_seen
    seen_before_writing:
      - >-
        All twelve RUN-SEMBIN-5ed13e window records as composed in EV-SEMBIN-702d1d:
        the iterated-closure W_4 verdicts (9 sufficient, 3 insufficient), the
        literal single-level block ranks (insufficient on 10 of 12, including both
        n = 40 draws), and the seven definition-dependent labels (F-3).
      - >-
        The stratum failure counts at (40, 2, 2, 20) recorded in the manifest of
        RUN-SEMBIN-814631 (EXP-SEMBIN-35bf67 Stage-1 smoke, unreviewed), read by this
        Coordinator for the NA-1 comparison.
      - >-
        The RESULTS.md summary of EXP-SEMBIN-79a02d (n = 12 and 15, m = t = 3,
        unreviewed), read for the same comparison.
    consequence: >-
      The choice of the iterated closure W_D as the certificate was made after it was
      known that the literal block fails v1's own baseline control on both n = 40
      window draws and that W_4 passes it there. That choice therefore cannot be
      validated by those draws. The baseline control under v2 is evaluated only on
      v2-seed draws (C-5, C-9), and the twelve window systems never count toward any
      v2 control, criterion or prediction.
    data_independent_grounds_for_the_choice: >-
      (1) W_D is the object the producer implemented and the review round validated
      (EV-SEMBIN-702d1d Q-A). (2) The same object, with the same multiplier rule and
      the same rank-deficiency-against-|V| verdict, was frozen as SOLV4 by
      EXP-SEMBIN-35bf67 (stage0 OP-R4, OP-SOLV4) before any of its outputs and blind
      to this experiment's runs (its stage0/sources-read.md; DEC-20261005-3d5aea
      N1 for the sibling lane). (3) The literal single-level block is the first level
      of XL, not a solving-degree certificate: it admits no reduction to lower degree
      followed by re-multiplication, which F4's degree statistic does. None of these
      grounds depends on a window verdict.
  confirmatory_status: reset
  confirmatory_status_detail:
    twelve_window_systems_of_RUN-SEMBIN-5ed13e: exploratory_only
    every_record_of_RUN-SEMBIN-9bb990: exploratory_only
    v2_seed_family_draws: confirmatory under v2

  reason: >-
    DEC-20261005-859f40 R3 found that v1 names one certificate (the degree-4
    Macaulay block, one level) while the instrument measured another (the iterated
    degree-capped closure W_4); that v1 names no closure type, no monomial order and
    no verdict rule; that the two objects give opposite labels on 7 of the 12 window
    systems including both n = 40 baseline draws; that v1's stopping rule 1 and
    falsification criterion 1 collide at the baseline; that 'degree 3' cannot hold
    at t = 2; and that the (m, t) = (2, 2) nearby-object control is not a different
    system. IMP-SEMBIN-7E1371-CERT blocks reading any EXP-SEMBIN-7e1371 record
    against v1 until the certificate is defined. DEC-20261011-712e40 found that
    neither EXP-SEMBIN-35bf67 nor EXP-SEMBIN-79a02d carries the m = 2 window
    baseline with a defined certificate, so the definition is written here.

  changes:
    - id: C-1
      field: inputs.certificate
      kind: definition
      from: >-
        "degree-4 Macaulay block over F_2 -- all products of the n(t-1) cubic
        generators and the field equations by monomials up to total degree 4 -- with
        rank and rank deficiency against the count of degree-<=4 monomials".
        Single level by the reading of DEC-20261005-859f40 R3.
      to:
        name: iterated degree-capped closure W_D
        ring: >-
          B = F_2[x_1..x_N]/(x_i^2 + x_i). Every polynomial is reduced to its
          square-free representative. B_{<=D} is the span of square-free monomials of
          degree <= D, of dimension c_D = sum_{d<=D} C(N, d).
        generators: >-
          F = the nonzero descended coordinate polynomials of the cell's system
          (chained eq. (5), the control families of v1, or the C-6 object), in the
          generator's recorded order.
        level_0: >-
          W^(0) = span{ m * f : f in F, m a square-free monomial with
          deg m + deg f <= D }, each product reduced in B. Products are kept even
          when the reduction lowers their degree. Products with deg m > D - deg f
          are not admitted at level 0 (C-2).
        iteration: >-
          For j >= 1: L^(j-1) = W^(j-1) intersected with B_{<=D-1};
          W^(j) = W^(j-1) + span{ x_i * g : g in L^(j-1), i = 1..N }, reduced in B.
          Only elements of degree <= D-1 are re-multiplied, by single variables.
          Higher-degree multiples are reached through iteration.
        fixed_point: >-
          W_D = W^(J) for the first J with W^(J) = W^(J-1). closure_rounds = the
          number of rounds j >= 1 that increased the dimension.
        degrees: >-
          D = 4 carries the verdict. W_2 and W_3 are recorded wherever they are
          computed; W_2 carries the known_false control (C-8).
        literal_block: >-
          The v1 literal single-level block L_D = W^(0) is retained as the secondary
          metric single_level_rank, where computed. It carries no verdict.
        equivalences_relied_on: >-
          W_D does not depend on the monomial order (it is a subspace). The
          multiplier rule above is the one RUN-SEMBIN-5ed13e used (EV-SEMBIN-702d1d
          claim_scope_statement: "multiplier budget D - deg f") and the one
          EXP-SEMBIN-35bf67 froze in OP-R4 (its implementation note D-13).
    - id: C-2
      field: reading of "products ... by monomials up to total degree 4"
      kind: interpretation
      adopted: >-
        The FORMAL product degree: a square-free multiplier m is admitted for
        generator f iff deg m + deg f <= D (the standard XL multiplier rule). This is
        the reading behind the red team's literal-block count (DEC-20261005-859f40
        limitations) and it matches v1's stated column count sum_{d<=4} C(N, d),
        which counts square-free monomials.
      not_adopted: >-
        The BOOLEAN product degree (admit m whenever the reduced product m * f has
        degree <= D, even if deg m + deg f > D), the level-0 rule frozen by
        EXP-SEMBIN-79a02d (stage0/definitions.md section 2.2). A v2 run that uses it
        records a protocol deviation and labels its verdicts with that rule; it is not
        pooled with C-2 verdicts.
      field_equations: >-
        Implicit, through the quotient B. DEC-20261005-859f40 composed W3 (a): the
        implicit Boolean ring is equivalent to explicit field equations multiplied
        like the other generators, and is NOT equivalent if only square-free
        multipliers are applied to explicit field equations (52 of 60 small systems).
        That equivalence is argued and checked on 60 systems with N 4..7, not at window
        scale; recorded as a limitation, not assumed beyond it.
    - id: C-3
      field: monomial order
      kind: definition
      to: >-
        Every leading-monomial or standard-monomial statement (leading counts by
        size, N_std, leading-set digests) is made under degrevlex with x_1 largest,
        where x_1, x_2, ... is the generator's recorded variable order. Such
        quantities are secondary, labelled order-relative (EV-SEMBIN-702d1d F-4), and
        never enter a verdict. The column order an implementation uses internally is
        free and is recorded.
    - id: C-4
      field: verdict rule
      kind: definition
      to:
        exact_count: >-
          |V| = the exact number of Boolean solutions of the cell's descended system,
          from two independent enumeration routes that must agree (v1 route plus a
          second route sharing no counting code). If they disagree the cell is
          invalid, not a verdict.
        codim: codim_D = c_D - dim W_D.
        sufficient: codim_D = |V|.
        insufficient: codim_D > |V|.
        invalid_measurement: >-
          codim_D < |V|; or any basis vector of W_D nonzero at an enumerated
          solution; or 1 in W_D while |V| > 0. 1 in W_D is always compared with |V|
          (repairs EV-SEMBIN-702d1d RD-6); it never sets a label on its own.
        unreached: >-
          The closure did not reach its fixed point inside the cap, or |V| is not
          available. Unreached is never insufficient (v1 invalidation rule 5,
          unchanged).
        early_stop: >-
          A closure may stop early only on a sound criterion, and the record then sets
          stopped_early true and stop_reason. (a) 1 in W_D: W_D = B_{<=D}, so
          codim_D = 0 by derivation and the recorded rank, leading counts and digest
          are flagged intermediate (EV-SEMBIN-702d1d F-1). (b) rank reaches c_D - r_V,
          where r_V is the rank of the evaluation map B_{<=D} -> F_2^V at the
          enumerated solutions: W_D is then at its fixed point and the label is
          sufficient iff r_V = |V|.
        label_tuple: >-
          Every verdict is recorded as (closure W_D, D, multiplier rule C-2, order C-3,
          rule C-4). A bare sufficient or insufficient is not a property of a system
          (DEC-20261005-859f40 R4).
        order_independence: >-
          The verdict depends only on dim W_D and |V| and is therefore
          order-independent. On the twelve window systems the codim rule and the N_std
          rule give the same label (EV-SEMBIN-702d1d
          rank_deficiency_reading_agrees_on_the_twelve, arithmetic on recorded numbers).
    - id: C-5
      field: controls[baseline], stopping_rules[1], falsification_criterion clause 1
      kind: restatement_and_precedence
      baseline_restated: >-
        Cells (17, 3, 3, 6) and (40, 2, 2, 20), low_degree_polynomial subspace, the
        v1 curve-coefficient modes (B = 1 and random B). W_4 must return SUFFICIENT
        under C-4 on every baseline draw from the v2 seed family. The commensurable
        F4 trace carried from EXP-SEMBIN-c2c312 must return 4 at n = 17 (v1,
        unchanged).
      n40_restatement: >-
        For (40, 2, 2, 20): N = 40, c_4 = 102091 square-free monomials of degree <= 4
        (the column count recorded for both n = 40 window draws in EV-SEMBIN-702d1d).
        The baseline holds on a draw iff c_4 - dim W_4 = |V| for that draw, with |V|
        from C-4. Neither n = 40 window draw of RUN-SEMBIN-5ed13e counts toward it.
      precedence: >-
        An insufficient W_4 verdict at a baseline cell fires stopping rule 1 first:
        a procedure defect for the run, recorded as an instrument-definition finding.
        It is read under falsification criterion clause 1 (refutation of the
        hypothesis's second clause) only through a separate adverse-claim path:
        replication on further v2-seed draws, the C-7 completeness cross-check, a
        refutation artifact under docs/claims-and-verification.md, and a
        review-breakthrough round at max in an independent session
        (DEC-20261005-859f40 R3 and status_not_changed_and_what_would_change_it).
        Disclosed as post-data: the collision was observed under the literal block.
    - id: C-6
      field: controls[nearby_object] at (m, t) = (2, 2)
      kind: repair
      defect: >-
        At t = 2 the chained system of eq. (5) is the single polynomial
        S_3(x_1, x_2, z), so v1's eq. (4) object is not a different system (relayed
        from the RUN-SEMBIN-9bb990 NOTES by the validator; not independently checked,
        DEC-20261005-859f40 limitations). v1's own stopping rule 3 names only t >= 3.
      identity_check: >-
        At every (2, 2) cell, build v1's eq. (4) object and the chained eq. (5)
        system from the same draw and compare the descended systems by sha256.
        Identical: v1's object is recorded degenerate_identical at that cell (neither
        pass nor fail) and the replacement below applies. Not identical: v1's design
        applies there unchanged and the relayed claim is recorded as contradicted.
      replacement: >-
        The support-matched sparse null of each primary draw: same N, same number of
        generators, each generator replaced by the same number of distinct uniformly
        random square-free monomials of each degree (the boolean_null rule of
        src/h012_peel_rank.py, as also used by EXP-SEMBIN-79a02d and
        EXP-SEMBIN-35bf67 OP-NULL), drawn from the v2 seed family with arm label
        nearby_sparse_null. It keeps shape and sparsity and destroys the summation
        polynomial structure. v1's dense matched_null stays a separate control,
        unchanged.
      its_verdict: >-
        Computed under C-1 to C-4. |V| by exhaustive Boolean evaluation where
        affordable inside the cap; where not, the verdict is unreached unless
        1 in W_4 and exhaustive evaluation confirms |V| = 0.
      reading: >-
        A primary SUFFICIENT verdict at a (2, 2) cell is informative only if the
        nearby object and the matched null are INSUFFICIENT on every one of their
        draws at that cell. If either is sufficient on any draw, the cell's primary
        sufficient verdicts are recorded control_collapse (the analogue of
        O-NULL-COLLAPSE), not as diagonal survival. If either is unreached, they are
        recorded control_unreached. These controls guard sufficient verdicts only;
        insufficient verdicts are guarded by C-7. No whole-run stop is attached at
        t = 2: v1 stopping rule 3 is unchanged for t >= 3.
      prospective_note: >-
        Whether a matched-shape random system is insufficient under W_4 at these sizes
        has not been measured on this instrument (DEC-20261005-859f40 R9). This rule
        is fixed before any such measurement.
    - id: C-7
      field: controls (addition)
      kind: addition
      to: >-
        closure_completeness: every INSUFFICIENT verdict at a diagonal cell, and every
        baseline verdict, is recomputed by a second closure implementation that
        shares no product-generation or elimination code with the first (EV-SEMBIN-702d1d
        F-5: the producer's own cross-checks cannot see a missing product). The two
        must agree on dim W_4 and on the label; a disagreement makes the cell invalid.
        closure_soundness: every basis vector of the final W_D is evaluated at every
        enumerated solution by code independent of the closure; any nonzero value is
        invalid_measurement (C-4). This check is necessary, not sufficient (F-6).
        Library: GF(2) elimination on M4RI 0.0.20200125 is not admissible
        (DEC-20261005-859f40 R6); M4RI release-20240729 or an M4RI-free routine, with
        name, version and build provenance recorded per cell.
    - id: C-8
      field: invalidation_rules 1 and 2; controls[known_false]
      kind: repair
      to: >-
        Rule 1 reads: the generated system is verified structurally to have n(t-1)
        equations in n(t-2) + kt variables, each of degree <= 3, with the observed
        maximum degree recorded (2 at t = 2; DEC-20261005-859f40 W3 (b)). Rule 2
        reads: the cell is computed in the quotient B of C-1 (field equations
        implicit), the construction C-2 relies on; a cell that adds explicit field
        equations and applies only square-free multipliers to them is invalid. The
        known_false control reads: W_2 is SUFFICIENT under C-4 on the planted
        degree-2 system.
    - id: C-9
      field: inputs.seeds, replication.seeds (prospective use)
      kind: restriction
      v2_seed_family: [20261011101, 20261011102, 20261011103, 20261011104, 20261011105]
      draws_per_cell: 10
      rule: >-
        A prospective prediction, control or criterion of v2 is evaluated only on
        draws generated from the v2 seed family by v1's generator, recorded with
        system_sha256. Draws from the v1 seeds (20260913101 to 20260913105) are not
        used for any prospective evaluation: their exact counts already exist in
        RUN-SEMBIN-9bb990 (counts lane, draws 0 to 9), and twelve of their window
        systems have been read.
      excluded_systems_named:
        - {n: 40, seed: 20260913101, draw: 0}
        - {n: 40, seed: 20260913102, draw: 1}
        - {n: 41, seed: 20260913101, draw: 0}
        - {n: 41, seed: 20260913105, draw: 4}
        - {n: 42, seed: 20260913101, draw: 0}
        - {n: 42, seed: 20260913102, draw: 1}
        - {n: 43, seed: 20260913101, draw: 0}
        - {n: 43, seed: 20260913101, draw: 5}
        - {n: 44, seed: 20260913101, draw: 0}
        - {n: 44, seed: 20260913101, draw: 5}
        - {n: 45, seed: 20260913101, draw: 0}
        - {n: 45, seed: 20260913105, draw: 4}
      excluded_systems_source: EV-SEMBIN-702d1d quantity_comparison.instances (ids carry n, seed and draw)
      collision_rule: >-
        If a v2-seed draw has the system_sha256 of any excluded system, it is
        recorded and skipped, and the next draw is taken.

  unchanged:
    - >-
      preregistered_prediction (quantity, formula, source), success_criterion and
      falsification_criterion: unchanged text, now read with the certificate of C-1
      to C-4 and the precedence of C-5.
    - >-
      The cell set: the m = 2 window n = 40..45 at k = ceil(n/2) and the five
      off-diagonal sweeps; v1 stopping rule 5 (no extension) binds.
    - Controls matched_null, certificate_soundness, invalid_input and monotonicity_probe; stopping rules 2 to 5; invalidation rules 3 to 5.
    - Budget (advisory), interpretation_limits, scale_relevance (toy), tail_checks and required_artifacts, plus the per-cell label tuple of C-4.

  decision_impact:
    on_positive: >-
      Baseline sufficient on every v2-seed draw at n = 17 and n = 40, the C-6 and
      matched-null controls informative, and the window and sweeps measured or
      declared unreached with column counts: the success criterion becomes
      evaluable. An evidence review may then grade the window profile under W_4.
      No status of H-SEMBIN-2d7708 moves without that review.
    on_negative: >-
      Baseline insufficient on a v2-seed draw: stopping rule 1, procedure defect, an
      instrument-definition finding (C-5). The hypothesis does not move; the adverse
      reading needs the separate path of C-5.
    on_window_insufficiency: >-
      Baseline passing and an insufficient W_4 verdict at some n in 41..45 confirmed
      by C-7: a candidate diagonal-boundary observation for the window, scoped to
      (W_4, C-2, C-4) and the drawn systems. Any weaken or reject_scoped transition
      needs replication, a refutation artifact and review-breakthrough at max.
    on_unreached: >-
      Cells unreached under the cap are recorded with row and column counts and peak
      memory (v1 stopping rule 2) and assert nothing.

  affected_runs:
    RUN-SEMBIN-5ed13e: >-
      Not edited and not re-labelled. Its twelve W_4 records were computed with the
      C-1 multiplier rule under degrevlex and a rule equivalent to C-4 on those
      records (EV-SEMBIN-702d1d). They are exploratory observations, never v2
      verdicts and never part of a v2 control.
    RUN-SEMBIN-9bb990: >-
      Not edited. Read per record class (DEC-20261005-859f40 R6; manifest_v2.yaml in
      its run directory). Its closure and single-level records are unverified and are
      not v2 evidence.

  what_this_amendment_does_not_do:
    - It authorizes no run and dispatches nothing.
    - It does not ratify EXP-SEMBIN-35bf67's OP-R4/OP-SOLV4 or EXP-SEMBIN-79a02d's stage0 definitions for those contracts; it adopts the C-1 to C-4 text for this experiment only.
    - It moves no status of H-SEMBIN-2d7708, EXP-SEMBIN-7e1371 or GOAL-SEMBIN-5078bc.
    - It asserts nothing about Semaev's Assumption 1, d_F4, n = 409 or 571, Kosters' figures, or any curve.

  refs:
    - ledger/decisions/DEC-20261011-712e40.yaml
    - ledger/decisions/DEC-20261005-859f40.yaml
    - ledger/evidence/EV-SEMBIN-702d1d.yaml
    - experiments/EXP-SEMBIN-7e1371/specification.yaml
    - experiments/EXP-SEMBIN-35bf67/stage0/preregistered-predictions.json
    - experiments/EXP-SEMBIN-35bf67/implementation/implementation.md
