experiment:
  id: EXP-GLVFF-3b7a1c
  hypothesis_id: null
  hypothesis_id_note: >-
    Integration experiment for the existing function-first decomposition lane.
    It does not introduce a new decomposition theorem. It asks whether the
    exact order-3 GLV symmetry of a complete-orbit factor base lowers the cost
    of the already-defined H | L_V support test and quotient-space rank updates.
  question_id: RQ-EQIC-8cb959
  related_question_ids:
    - RQ-EQLA-0d3f40
    - RQ-ICPERF-94c86e
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    GLV-aware function-first decomposition: character-quotient support testing
    and fixed-span elimination for H | L_V

  objective: >-
    Measure whether a GLV-closed factor base can push the function-first
    decomposition solver beyond its current scaling wall by reducing repeated
    support-constraint and rank work. The treatment keeps the exact existing
    function-first relation criterion, including H | L_V and post-solve point
    extraction, but represents all fixed factor-base constraints in C3
    character blocks and eliminates the fixed span once before target-specific
    rank tests.

  parent_solver_contract:
    support_constraint: >-
      Import the existing function-first definition of H, L_V, coefficient
      variables, validity checks, extraction, and relation verification without
      semantic changes. This experiment may change representation and linear
      algebra only; it may not weaken H | L_V or omit extraction failures.
    quotient_space_optimization: >-
      The baseline optimization under test is the proposed quotient-space rank
      method: eliminate the target-independent fixed span once and perform each
      candidate rank test in the remaining quotient rather than replaying the
      full row reduction.
    correctness_oracle: >-
      At sizes where exhaustive target decomposition is feasible, the accepted
      target set and extracted relations must match exhaustive ground truth.

  mathematical_setup:
    curve_family: >-
      j=0 prime-field curves with p=1 mod 3 and a prime-order GLV-stable
      subgroup.
    factor_base: >-
      Complete order-3 x-coordinate orbits under x -> beta*x. B is divisible
      by 3 and no orbit may be truncated.
    support_polynomial: >-
      For the monic support polynomial H(x) whose roots are the factor-base
      x-coordinates, complete orbit closure implies the root set is C3-stable.
      The implementation must verify H(beta*x)=H(x) exactly for the chosen B;
      when this holds, archive the induced representation in x^3 instead of
      assuming it from theory.
    coefficient_action: >-
      Derive the induced C3 action on the function-first coefficient space and
      split the target-independent constraint matrix into character components
      only after exact equivariance is verified.

  arms:
    - id: ARM_FF_BASE
      description: >-
        Current strongest function-first implementation with the same
        quotient-space rank optimization but no GLV character decomposition.
    - id: ARM_FF_GLV
      description: >-
        Same solver and support condition, with complete-orbit H, exact C3
        coefficient action, character-block fixed-span elimination, and
        quotient-space target tests performed in the reduced blocks.
    - id: ARM_SEMAEV
      description: >-
        Strongest matched Semaev/F4 baseline on identical curve, target stream,
        factor-base cardinality, arity/decomposition size, and verification
        policy.
    - id: NULL_SHUFFLED_ORBITS
      description: >-
        Preserve factor-base cardinality and coefficient dimensions but shuffle
        orbit labels so H is no longer C3-stable. The GLV block verifier must
        reject the treatment or lose its measured advantage.
    - id: CTRL_GENERIC_J
      description: >-
        Generic-j matched curve with no order-3 automorphism, run through the
        baseline function-first path only.

  inputs:
    procedure: >-
      Stage 0 freezes the parent function-first commit and reproduces its most
      recent passing fixtures. Stage 1 constructs complete GLV factor-base
      orbits and certifies H(beta*x)=H(x). Stage 2 constructs the coefficient
      action and verifies that every target-independent support row is mapped
      into the declared C3 representation. Stage 3 computes the fixed-span
      elimination once for both ARM_FF_BASE and ARM_FF_GLV, recording setup
      cost. Stage 4 sends the identical target stream to both arms, recording
      every candidate rank test, quotient dimension, extraction attempt, and
      verified relation. Stage 5 runs ARM_SEMAEV on the same targets and emits
      a full charged comparison.
    parameter_grid:
      bit_sizes: [9, 10, 11, 12, 13, 14]
      decomposition_sizes: [3, 4]
      factor_base_sizes: >-
        At least three B values per bit size, each divisible by 3 and including
        the largest size the baseline can finish under the frozen cap.
      seeds: [20260918, 20260919, 20260920]
      targets_per_cell: >-
        Fixed prospectively from the smallest count that gives at least 30
        baseline verified relations at the previous feasible size; never
        increased after viewing treatment results.

  controls:
    - >-
      Parent-fixture regression: before any GLV cell, reproduce the current
      function-first accepted/rejected target set and extracted tuples.
    - >-
      H-invariance gate: exact polynomial equality under x -> beta*x, not sampled
      evaluation.
    - >-
      Character-action gate: reconstruct the full fixed constraint matrix from
      the character blocks and require byte-for-byte equality after canonical
      ordering.
    - >-
      Quotient-rank equivalence: every target-specific rank verdict in ARM_FF_GLV
      must equal a direct full-space rank computation on audit samples.
    - >-
      NULL_SHUFFLED_ORBITS must fail the equivariance gate; if it passes, the
      block structure is an artifact.
    - >-
      Every extracted point tuple is independently added on the curve and checked
      against the submitted target.

  metrics:
    primary:
      - setup_seconds
      - fixed_span_rank
      - full_constraint_dimension
      - quotient_dimension
      - character_block_dimensions
      - rank_test_seconds_per_candidate
      - field_operations_per_rank_test_if_available
      - candidates_tested
      - extraction_attempts
      - extraction_failures
      - verified_relations
      - total_seconds_per_verified_relation
      - peak_rss_bytes
      - largest_completed_bit_size
    secondary:
      - H_degree
      - H_monomial_count_raw
      - H_monomial_count_in_x3_representation
      - fixed_span_elimination_seconds
      - target_specific_rows_added
      - quotient_rank_update_count
      - quotient_rank_update_width
      - relation_yield
      - setup_amortized_seconds_per_target
      - charged_ratio_GLV_over_FF_BASE
      - charged_ratio_GLV_over_SEMAEV

  benchmark_contract:
    primary_baseline: ARM_FF_BASE
    incumbent_attack_baseline: ARM_SEMAEV
    icperf_reference: RQ-ICPERF-94c86e
    decision_metric: >-
      Total charged seconds per verified relation including one-time setup
      amortized over the frozen target batch. Rank-test microbenchmarks are
      explanatory only.
    success_threshold: >-
      ARM_FF_GLV must reduce charged median cost per verified relation by at
      least 20% versus ARM_FF_BASE at two consecutive sizes, preserve exact
      accepted relations, and complete at least one bit-size rung that the
      baseline cannot finish under the identical cap. Beating only a rank-test
      microbenchmark does not count as solver scaling progress.
    strongest_result_gate: >-
      If ARM_FF_GLV also beats ARM_SEMAEV by at least 20% on the identical
      relation task, replicate on three independent curve instances before any
      broader interpretation.

  preregistered_predictions:
    - >-
      Complete GLV orbit closure makes the fixed support object more compressible,
      so the largest benefit should appear in fixed-span setup and repeated
      quotient rank updates rather than relation probability.
    - >-
      Mean relation yield should not materially increase merely from the GLV
      orbit shape; a claimed yield gain requires separate evidence.
    - >-
      If extraction and target-specific constraints dominate beyond 11 bits,
      the character decomposition will improve rank microbenchmarks without
      moving end-to-end scaling.

  scale_relevance:
    tier: toy
    correspondence: >-
      secp256k1 has the same order-3 GLV action, but all measured claims remain
      limited to the tested toy ladder. The experiment targets solver engineering
      and scaling evidence, not a cryptographic-size ECDLP solve.

  stopping_rules:
    - Stop before treatment timing if parent-fixture regression fails.
    - Stop before treatment timing if H-invariance or character reconstruction fails.
    - Preserve all timeout and extraction-failure rows.
    - Do not increase caps, target counts, or B after observing a favorable treatment cell.
    - If a cell apparently beats automorphism-adjusted rho, require independent adversarial review before interpretation.

  invalidation_rules:
    - Any mismatch between quotient-space and direct full-space rank verdicts invalidates the run.
    - Any omitted extraction failure invalidates cost per verified relation.
    - Any accepted relation failing independent curve verification invalidates the run.
    - Any arm using different targets, B, decomposition size, or timeout is not comparable.
    - Timeout, crash, or memory exhaustion is failed infrastructure, never negative evidence.

  success_criterion: >-
    Produce an exact, paired cost decomposition from fixed-span setup through
    quotient rank testing, extraction, and relation verification for the GLV
    and baseline function-first solvers, plus the matched Semaev comparison.
    Scientific success is a valid answer even if GLV does not extend scaling.

  falsification_criterion:
    - >-
      Character-block rank tests are faster but extraction or target-specific
      work dominates, leaving charged cost unchanged.
    - >-
      Quotient dimensions do not shrink materially beyond the ordinary
      fixed-span elimination.
    - >-
      ARM_FF_GLV does not complete any rung beyond the baseline under equal caps.
    - >-
      Any apparent gain disappears when setup is amortized over the frozen
      target count.

  required_artifacts:
    - specification.yaml
    - manifest.yaml
    - command.txt
    - environment.json
    - raw-result.json
    - parent-regression.json
    - H-invariance-certificate.json
    - character-action.json
    - fixed-span-metrics.json
    - quotient-rank-audit.jsonl
    - extraction-results.jsonl
    - verification-report.json

  source_refs:
    - EXP-GLVFB-5f287d
    - EXP-EQLA-164b34
    - RQ-EQIC-8cb959
    - RQ-ICPERF-94c86e
    - research/ideas/glv_index_calculus_experiment_matrix.md

  assigned_to: executor
  approved_by: null
