  source_proposal: IDEA-20260901-863e36
  class: measurement
  certificate:
    kind: none
  claim_tier: observational
  status_note: >
    Frozen at version 1 and approved 2026-09-08 by
    DEC-20260908-f6afa2 under the standing 2026-09-06
    user authorization. Stage 0 is the exact C1
    block-system iff calibrator at n=7. Aut census
    and orbit-cost measurement are later stages
    and are not run here.

  objective: >
    Evaluate the exact boolean identity
    invariant(partition, Gamma, n)
    equals propagates(v, Gamma, n)
    on one frozen family (REAL, KF,
    NULL) at n=7 and decide whether
    the C1 block-system calibrator
    works. Stage 0 does not enumerate
    Aut and does not authorize Stage 1+.

  preregistered_prediction:
    quantity: >
      Stage 0 instrument: REAL is
      invariant and propagating so iff
      is true; KF is not invariant and
      not propagating so iff is true;
      NULL empty domain rejected; n=0
      rejected. Certificate kind none.
    formula: >
      fibres(v) groups domain points
      by v-value. invariant(P, gamma, n)
      is true iff for every block B of
      P, (gamma * B mod n) equals some
      block of P. propagates(v, gamma, n)
      is true iff there exists a function
      F on the image of v with
      v(gamma * x mod n) = F(v(x)) for
      every x in the domain. The C1 iff
      is invariant == propagate. Frozen
      REAL: n=7, gamma=6, v maps
      {1,6}->0, {2,5}->1, {3,4}->2.
      Frozen KF: n=7, gamma=6, v maps
      {1}->0 and {2,3,4,5,6}->1.
      NULL is the empty domain.
      Invalid is n=0. FORCED Stage 0:
      fixture_pass, real_count_pass,
      known_false_nonblock_pass,
      reject_invalid_pass,
      null_empty_pass all true.
    source: >
      ledger/proposals/IDEA-20260901-863e36.yaml
      (C1) classification as Stage 0
      hard-gate identity.
      Provenance internal; read in this design session.

  design_tightening_stage0_is_instrument_not_audit: >
    IDEA-20260901-863e36 Stage 0 here is
    a disclosed tightening: the C1 iff
    at frozen n=7 and Gamma={1,-1} only,
    not the proposal's orbit-cost
    measurement, not an Aut census.
    Exact boolean identities are the
    only Stage 0 arm.

  inputs:
    fixture:
      n_frozen: 7
      gamma_frozen: [1, 6]
      domain_frozen: [1, 2, 3, 4, 5, 6]
      real_blocks:
        id: REAL
        v: {1: 0, 6: 0, 2: 1, 5: 1, 3: 2, 4: 2}
        must_invariant: true
        must_propagate: true
        must_iff: true
        role: real_negation_blocks
      known_false:
        id: KF
        v: {1: 0, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1}
        must_invariant: false
        must_propagate: false
        must_iff: true
        must_not_equal_real: true
        role: known_false_nonblock
      matched_null:
        id: NULL
        kind: empty_domain
        must_reject: true
        role: matched_null_empty_domain
      invalid:
        - id: n-zero
          n: 0
          must_reject: true
      working_model: >
        Exact C1 block-system iff at
        frozen n=7. Not an Aut census.
        Not an orbit cost. Not a
        Gaussian-integer box. Not a
        Weierstrass fibre count. Not a
        rho beat.
      do_not_enumerate_aut: true
      do_not_cost_orbit: true
      do_not_enumerate_gl2: true

  independent_variables:
    - object in the frozen family
    - whether the fibre partition is a block system
    - whether n is the frozen positive order

  null_object:
    name: empty-domain at frozen n
    construction: >
      Replace the domain by the empty
      set. The iff is not read. This
      is the nearby-object control with
      the structure term removed.
    non_degeneracy_check: >
      known_false_nonblock_pass must
      be true before any REAL identity
      is read as a measurement.
    dynamic_range_demonstration: >
      n=0 must be rejected before an
      identity is read as a census.

  controls:
    - KF non-block not-invariant and not-propagating (known-false / proves-too-much)
    - REAL invariant and propagating
    - NULL empty-domain rejection of collapse
    - n=0 rejection
    - exact integer arithmetic, no floats
    - n and Gamma frozen before any Aut is enumerated

  metrics:
    primary:
      - fixture_pass boolean
      - real_count_pass boolean
      - known_false_nonblock_pass boolean
      - reject_invalid_pass boolean
      - null_empty_pass boolean
    secondary:
      - REAL invariant
      - REAL propagate
      - KF invariant
      - KF propagate
      - wall-clock seconds and peak RSS

  heuristic_under_test: none

  scale_relevance:
    tier: toy
    justification: >
      Frozen boolean identities at
      n=7. No transfer to an Aut
      census, orbit cost, or
      cryptographic p.
    correspondence: null

  tail_checks:
    - REAL is invariant and propagating
    - KF is not invariant and not propagating
    - NULL empty domain is rejected
    - n=0 is rejected

  replication:
    seeds: []
    independent_instances: 1
  seeds_policy: >
    Stage 0 is exact. No RNG.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 120
    total_cpu_hours: 1
    maximum_memory_gb: 2
    maximum_runs: 1
    maximum_workers: 1

  stopping_rules:
    - >
      STAGE 0, HARD GATE: fixture_pass,
      real_count_pass,
      known_false_nonblock_pass,
      reject_invalid_pass, and
      null_empty_pass. A miss classifies
      the run failed_infrastructure if it is
      a size or encoding bug, otherwise it
      is a scoped falsification of P-S0-BLOCK.
    - Stages 1 and later are not authorized.
    - Do not enumerate Aut.
    - Do not cost an orbit.
    - Do not enumerate GL_2 partitions.
    - Do not identify a rho cost.
    - No attack is run. Certificate kind none.

  invalidation_rules:
    - Any execution while Stage 0 is not in execution_authorized_stages
    - Changing the frozen n or Gamma after this freeze
    - Enumerating Aut because a frozen identity fails
    - Reading Stage 0 as an Aut census, orbit cost, box membership, Weierstrass fibre count, or a decoder
    - Reading Stage 0 as an ECDLP advantage or a rho beat
    - Authorizing Stage 1 of EXP-ECDLP-6ffef4 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-11c247 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-114eb2 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-821bc5 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-735974 from this contract
    - Authorizing Stage 1 of EXP-ECDLP-fdae20 from this contract
