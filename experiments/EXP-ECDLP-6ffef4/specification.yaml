    - Authorizing Stage 2 of EXP-ECDLP-4be480 from this contract
    - Authorizing Stage 2 of EXP-ECDLP-6a97f4 from this contract
    - Authorizing Stage 17 of EXP-ECDLP-420e73 from this contract
    - Authorizing Stage 5 of EXP-ECDLP-a98ea9 from this contract
    - Editing EXP-ECDLP-a5f766 or H-ECDLP-a3598b
    - Changing H-ECDLP-7253e7, H-ECDLP-7df817, H-ECDLP-92e64c, H-ECDLP-881d63, H-ECDLP-9a1388, H-ECDLP-7f5b05, H-ECDLP-e54f8c, H-ECDLP-a69bea, H-ECDLP-38f4b4, H-ECDLP-a23318, H-ECDLP-536b21, H-ECDLP-3f68f6, H-ECDLP-b51c3d, H-ECDLP-4afa77, H-ECDLP-2ac931, H-ECDLP-e9d9bb, H-ECDLP-77caa5, H-ECDLP-07c7c6, or H-ECDLP-2ade73
    - Dispatching EXP-ECDLP-df601f from BATCH-5a5091
    - Designing IDEA-20260902-2327a5 as a Stage 0 duplicate of EXP-ECDLP-821bc5

  success_criterion: >
    Stage 0 succeeds as a measurement when
    fixture_pass, real_count_pass,
    known_false_nonblock_pass,
    reject_invalid_pass, and
    null_empty_pass are true, and the
    run manifest carries certificate.kind
    none. Success is instrument
    reproduction, not an Aut census
    and not an attack.

  falsification_criterion: >
    A certified KF miss of the
    not-invariant and not-propagating
    gap after fixture_pass is a scoped
    miss of P-S0-BLOCK. A certified REAL
    identity miss after fixture_pass is
    a scoped miss of P-S0-BLOCK.
    Infrastructure bugs are not
    mathematics. Stage 0 does not
    test P-S1-ORBIT.

  required_artifacts:
    - Stage 0 raw-result.json with the five gates
    - run manifest with command, git state,
      environment, certificate kind none
    - stdout, stderr, environment.json, command.txt

  assigned_to: executor

  limitations:
    - Frozen toy identity at n=7.
    - Not an Aut census. Not an orbit cost.
    - Not a box membership. Not a Weierstrass fibre count. Not a rho cost.
    - Not a rho beat. Not the O2-line W.
    - No decoder. No cryptographic transfer.
    - No Stage 1 of 6ffef4. No Stage 1 of 11c247.
