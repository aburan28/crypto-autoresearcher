experiment:
  id: EXP-QSP-82a906
  hypothesis_id: H-QSP-411d8f
  version: 1
  archived_by: TASK-20260917-5bb67b
  title: >-
    H1 AT m=2, RESULTANT ONLY: the engine-independent eliminant degree of the
    no-Weil-descent chain S = {S^{(0)}, phi(S^{(0)})} at n in {17, 23},
    d in {2, 3}, against M(E)_paper = 4d and M(E)_note = 4 d^2 -- two
    independent bit-packed Sylvester implementations over F_{2^n} required
    to agree, a random bivariate null of the same per-variable degrees, and
    a d=1 nearby-object split (lambda=X known-collapse; lambda=X+1
    well-defined) -- no Groebner, no m>=3, no curve, no n=131
  status: approved
  status_note: >-
    Frozen at version 1 and approved on 2026-09-17 by the Coordinator decision
    DEC-20260917-f37ca4. The approval basis is the STANDING USER AUTHORIZATION
    recorded in AGENTS.md, "Standing user authorization for ideas and
    experiments" (user instruction of 2026-09-06: ideas and experiments are
    always approved; the Coordinator does not ask the user to confirm a frozen
    protocol). User authorization being already satisfied, what the Coordinator
    verified before recording approval is PROTOCOL READINESS: every field of
    this contract is non-null, the controls, metrics, budget, stopping rules,
    invalidation rules, artifact paths and assignment are present, and the
    success and falsification criteria are both decidable from the metrics
    listed here. Approval authorizes the work; it asserts nothing about the
    truth of H-QSP-411d8f (or of H-QSP-645a07's H1, or of the closure reading
    (E')) and validates no result. No run of this contract was authorized
    before this mark; execution proceeds under TASK-20260917-66ec2b, which
    may not be dispatched until the snapshot archive TASK-20260917-5bb67b has
    committed and verified this file. Any change after this point requires a
    versioned protocol_amendment under
    experiments/EXP-QSP-82a906/amendments/; the pre-registered prediction
    below is NEVER edited after a run, and no run already executed is
    re-scored against a later prediction.
  source_proposal: IDEA-20260916-b84e2d
  objective: >-
    Measure, under the harness and with manifests, the engine-independent
    eliminant degree deg_elim = deg Res_{X_2}(S^{(0)}, S^{(1)}) of the m=2
    no-Weil-descent chain of KN-LIT-0a321c Section 3.1 at the frozen cells
    (n, d, lambda) with n in {17, 23}, d in {2, 3}, and the counted
    non-linearized F_2-coefficient lambda of exact degree d, and compare it
    to both M(E)_paper = 4d and M(E)_note = 4 d^2. The pre-registered
    d=2-versus-d=3 comparison of rho_paper decides, at these cells only,
    whether the observation is consistent with H1, refutes H1 in scope, or
    is infrastructure. NO ATTACK IS RUN. No curve is touched, no key is
    involved, no point arithmetic occurs anywhere in this contract. Success
    of this experiment means the measurement completed with agreeing
    instruments, NOT that H1 holds.
  class: >-
    heuristic-validation / cost-model hybrid. The nearest template patterns
    are both: H1 is a numbered heuristic whose pre-registered prediction is
    a degree ratio, and the deliverable includes a measured-versus-modeled
    table (deg_elim MEASURED; M(E)_paper and M(E)_note MODELED arithmetic
    from the two formulas; wall time and peak_rss MEASURED engine-dependent
    and NEVER used as evidence for or against H1). The prediction is written
    before any run and is never tuned afterward.
  out_of_scope_successor_note: >-
    IDEA-20260916-b84e2d asked for a Groebner ladder at n in {17, 23, 29, 41},
    m in {2, 3, 4}, d in {2, 3}, plus (4,3) under a memory pre-flight, and a
    Weil-descent Semaev Groebner control. THIS VERSION DOES NOT RUN THOSE
    CELLS. The container has no Groebner engine (sage, macaulay2, singular,
    msolve, magma all absent; measured this session). DEC-20260917-ea9dd2
    NA-2 and EV-QSP-a6aa4b obstruction.resource_check freeze the cheapest
    informative cell as the eliminant degree at (m, d) = (2, 2) or (2, 3),
    where a RESULTANT suffices. The m>=3 Groebner ladder, n in {29, 41},
    and the Weil-descent Semaev control remain the idea's later cells and
    are a SUCCESSOR experiment, not this contract. ECC unlimited is not a
    license to add them to v1.
  inputs:
    code_reuse: >-
      analysis/qsp-ecc2k130/explore/gf2rc.c MAY be copied into
      experiments/EXP-QSP-82a906/implementation/ for GF(2)[X] word-level
      helpers (degree, square, xor-shift), with provenance stated. gf2rc.c
      is a GF(2)[X] root counter, NOT a resultant-over-F_{2^n} engine, and
      is NEVER cited as a result of this experiment. The JSON files under
      analysis/qsp-ecc2k130/explore/ and the tables in that README are
      CONTEXT; they MAY NOT be copied into experiments/EXP-QSP-82a906/runs/
      and may not be cited as results. A reported value that was read out
      of explore JSON is fabrication under AGENTS.md core rule 5.
    engine_measured_this_session:
      present: >-
        gcc 13.3.0 (Ubuntu 13.3.0-6ubuntu2~24.04.1), g++ 13.3.0, python3
        3.12.3, numpy 2.4.4, analysis/qsp-ecc2k130/explore/gf2rc.c (GF(2)[X]
        root counter, not a resultant-over-F_{2^n} engine). The user prompt
        named gcc 13.2; this session measured 13.3.0 and records 13.3.0.
      absent: >-
        sage, sympy (python import ModuleNotFoundError), macaulay2/M2,
        singular, msolve, magma, galois (python import ModuleNotFoundError),
        FLINT/NTL headers (/usr/include/flint/flint.h and /usr/include/NTL/ZZ.h
        missing), libflint, libntl (not in ldconfig).
      implication: >-
        A Groebner ladder cannot run here. A bit-packed Sylvester resultant
        over F_{2^n} in C plus an independent Python bit-packed implementation
        can. That is the whole engine of v1.
    field_models:
      K_17: 'F_2[z]/(z^17 + z^3 + 1), re-checked irreducible over F_2 this session (Ben-Or gcd sweep, no F_2 root). Used by EXP-QSP-33b442 Stage 2.'
      K_23: 'F_2[z]/(z^23 + z^5 + 1), re-checked irreducible over F_2 this session (Ben-Or gcd sweep, no F_2 root). Used by EXP-QSP-33b442 Stage 2.'
      polynomial_arithmetic: >-
        Bit-packed F_{2^n} arithmetic (coefficients as elements of K) and
        bit-packed F_2[X] arithmetic (univariate eliminants). Primary cells
        have F_2 coefficients, so the Sylvester determinant lives in F_2[X_1]
        and embeds in K[X_1]; the engine is specified over F_{2^n} so the
        implementation is not silently F_2-only.
      no_curve: >-
        Finite-field polynomial arithmetic only. Do not construct a curve, a
        point, a group, or a key. Do not require re-verification by curve
        arithmetic.
    chain_builder:
      source: >-
        Frozen from KN-LIT-0a321c Section 3.1 (paper_fulltext.md lines 422-488)
        plus Semaev ePrint 2004/031 Remark 1 (retrieved this session, extract
        lines 171-178). NOT invented. The paper defines S^{(0)} :=
        S_{m+1}(X_1,...,X_m, x_R) and S^{(k)} := phi(S^{(k-1)}) with
        phi(f) = F^{n'}(f)(lambda(X_1),...,lambda(X_m)). It states S_r has
        degree 2^{r-2} in each variable and does not print S_3 coefficients.
        The idea names the model y^2 + xy = x^3 + 1. Remark 1 of Semaev
        2004/031 gives f3 for Y^2+XY=X^3+a X^2+1, a in {0,1}:
        (x1 x2 + x1 x3 + x2 x3)^2 + x1 x2 x3 + 1. ECC2K-130 is a=0.
      S3: '(x1*x2 + x1*x3 + x2*x3)^2 + x1*x2*x3 + 1'
      xi: '1 (the element of F_2 subset K; algebraic specialisation, not a constructed point)'
      S0_expanded_char2: 'X1^2 X2^2 + X1^2 + X2^2 + X1 X2 + 1'
      phi: >-
        F^{n'}(f)(lambda(X1), lambda(X2)), n' = ceil(n/2). Under this
        specialisation F^{n'} is the identity, so S^{(1)} =
        S^{(0)}(lambda(X1), lambda(X2)).
      n_prime_formula: 'n_prime = ceil(n/m) = ceil(n/2); n=17 -> 9; n=23 -> 12'
      degree_gate: >-
        S^{(0)} must have exact per-variable degree 2 = 2^{m-1}; S^{(1)}
        must have exact per-variable degree 2d. Paper Appendix A.1: each
        application of phi multiplies per-variable degree by d; 0-based
        S^{(k)} has degree d^k 2^{m-1}; the mixed-volume factors use
        1-based lambda_k = d^{k-1} 2^{m-1}. Mismatch of either degree STOPS.
      M_E_paper: '2^{m(m-1)} d^{m(m-1)/2} = 4d at m=2; (2,2)->8; (2,3)->12'
      M_E_note: '2^{m(m-1)} d^{m(m-1)} = 4 d^2 at m=2; (2,2)->16; (2,3)->36. Historical encoding named by IDEA-20260916-b84e2d / CORR-20260916-8d0b81 prior_value. H1 uses the paper formula. Both columns are reported. The experiment does not adjudicate.'
    lambda_lists:
      convention: >-
        Monic polynomials in F_2[X] as bit-packed integers, bit i = coefficient
        of X^i. Exact degree d means bit d is set. Non-linearized means NOT
        of the form sum a_i X^{2^i} (constants make a polynomial affine, which
        IS included, matching EXP-QSP-33b442). The executor MAY NOT silently
        narrow these lists.
      d2_all_exact_degree: [4, 5, 6, 7]
      d2_linearized_excluded: [4, 6]
      d2_non_linearized:
        - {bits: 5, poly: 'X^2 + 1'}
        - {bits: 7, poly: 'X^2 + X + 1'}
      d2_count: 2
      d3_non_linearized:
        - {bits: 8, poly: 'X^3'}
        - {bits: 9, poly: 'X^3 + 1'}
        - {bits: 10, poly: 'X^3 + X'}
        - {bits: 11, poly: 'X^3 + X + 1'}
        - {bits: 12, poly: 'X^3 + X^2'}
        - {bits: 13, poly: 'X^3 + X^2 + 1'}
        - {bits: 14, poly: 'X^3 + X^2 + X'}
        - {bits: 15, poly: 'X^3 + X^2 + X + 1'}
      d3_count: 8
      d3_linearized_of_exact_degree_3: 0
      chain_lambda_count: 10
      chain_cells: 20
      note: '2 n x (2+8) lambda = 20 chain cells, exhaustive, seed-free.'
    instruments:
      I1_C_sylvester: >-
        A Sylvester resultant over F_{2^n} for TWO bivariate polynomials,
        bit-packed, implemented in C under
        experiments/EXP-QSP-82a906/implementation/, compiled with the
        measured gcc 13.3.0. Treats the pair as polynomials in Y=X_2 with
        coefficients in K[X_1]; emits the eliminant in K[X_1] (up to scalar)
        and its degree. May copy GF(2)[X] helpers from gf2rc.c with
        provenance; may not copy explore JSON numbers.
      I2_python_sylvester: >-
        A SECOND, independent Python bit-packed Sylvester resultant over
        F_{2^n} under the same implementation/ directory. MUST NOT import
        sympy, sage, galois, flint, or ntl (all absent or forbidden as a
        hidden dependency). numpy 2.4.4 may be used for arrays; the
        arithmetic is bit-packed integers. Independent means a second
        authoring of the determinant/elimination, not a wrapper around I1.
      I3_bivariate_gcd: >-
        A bivariate gcd (or a recorded equivalent: whether S^{(0)} and
        S^{(1)} have a non-constant common factor in K[X_1,X_2]). Used only
        to supply an algebraic reason when the eliminant is identically
        zero. May share field arithmetic with I1 or I2; a zero resultant
        without this flag is an invalidation, not a H1 observation.
    stage_0:
      name: engine gate
      compute: minutes. STOP/censor if fail. Infrastructure, not evidence.
      content: >-
        Confirm gcc 13.3.0 builds a toy C program. Implement I1 (C) and I2
        (Python) under experiments/EXP-QSP-82a906/implementation/. They MUST
        agree on eliminant degree and, if both emit the polynomial, on the
        eliminant up to a nonzero scalar in K, on the NAMED FIXTURE below.
        If either implementation is missing or they disagree: infrastructure,
        not evidence; STOP. Do not proceed to Stage 1.
      named_fixture: >-
        n=17, K=F_2[z]/(z^17+z^3+1), m=2, d=2, lambda=X^2+X+1 (bits 7),
        xi=1, n'=9. S^{(0)} = X1^2 X2^2 + X1^2 + X2^2 + X1 X2 + 1.
        S^{(1)} = S^{(0)}(lambda(X1), lambda(X2)). Both I1 and I2 compute
        Res_{X_2}(S^{(0)}, S^{(1)}) and its degree.
      gate: >-
        If gcc is missing, if either implementation is missing, if they
        disagree on deg_elim or (when both emit it) on the eliminant up to
        scalar, STOP and report infrastructure. AGENTS.md rule 5.
    stage_1:
      name: chain builder and degree gate
      content: >-
        Build S^{(0)} from the frozen S_3 and xi=1; verify the expanded
        form X1^2 X2^2 + X1^2 + X2^2 + X1 X2 + 1 by expanding
        (X1 X2 + X1 + X2)^2 + X1 X2 + 1 in characteristic 2 (the two
        expressions MUST agree as polynomials; mismatch STOPS). Build
        S^{(1)} = phi(S^{(0)}) for every frozen (n, d, lambda). Verify
        per-variable degrees: deg_{X_i} S^{(0)} = 2 and deg_{X_i} S^{(1)} = 2d
        for i=1,2. A degree mismatch STOPS; it is a builder defect, not
        evidence about H1. Record n' = ceil(n/2) beside every cell even
        though F^{n'} is the identity on these coefficients.
      gate: 'Expanded-form identity holds AND every chain cell passes the degree check, or STOP.'
    stage_2:
      name: cells
      cells: >-
        Independent variables: n in {17, 23}, m=2 fixed, d in {2, 3},
        n' = ceil(n/2), xi=1, lambda the counted lists (2 at d=2, 8 at d=3).
        20 chain cells, exhaustive, seed-free. n in {29, 41} is OUT OF v1
        unless a protocol_amendment is filed after Stage 0 shows they are
        cheap; v1 does not include them.
      requirement: >-
        For EVERY chain cell, I1 and I2 both emit deg_elim (and the
        identically-zero flag). C3 agreement is required on every reported
        cell. Identically-zero eliminant: run I3, record whether a
        non-constant bivariate common factor exists, and do NOT treat
        deg_elim=0 as a cheap solver. Exclude identically-zero cells from
        the median rho; if every lambda at a (n,d) is identically zero with
        a recorded gcd, that (n,d) is a collapse observation under G2.
      recorded_per_cell: >-
        n, n', d, lambda (bits and printed), field polynomial, S^{(0)} and
        S^{(1)} per-variable degrees, I1 deg_elim, I2 deg_elim, I1/I2
        eliminant (if emitted) or a hash/byte-length, identically_zero flag,
        I3 common-factor flag, rho_paper = deg_elim/(4d), rho_note =
        deg_elim/(4 d^2), M(E)_paper, M(E)_note, wall_clock_seconds,
        peak_rss_bytes, which implementation produced each number.
    stage_3:
      name: controls
      content: >-
        C1, C2, C3 as in `controls` below. Weil-descent Semaev via Groebner
        is a successor control and is NOT run (no engine).
    stage_4:
      name: the report
      content: >-
        Ratios at d=2 versus d=3 at each n, both M(E) columns, every per-lambda
        value so a reviewer can recompute the median, censored cells, exact
        scope, C1/C2/C3 outcomes. If a growing deficit appears, fill the
        inventor-protocol obstruction block (statement, quantity, value with
        units, measured_by run IDs, scope, resource_check with examined /
        reading / spawned_ids). NO interpretation of H-QSP-645a07, of (E'),
        or of kappa. Unfinished work reported as unfinished, never estimated.
  controls:
    - name: 'C1 -- random bivariate null of the same per-variable degrees, not a phi-chain'
      role: blocking (null object before belief)
      detail: >-
        For each of the four (n, d) pairs, draw ONE pair of bivariate
        polynomials over F_2 with exact per-variable degrees matching the
        chain at that d (degree 2 and degree 2d in each variable),
        coefficients independent uniform in F_2, conditioned on those exact
        degrees (re-draw from the same named sub-stream until the degree
        condition holds). Reject and re-draw the second polynomial if it is
        a scalar multiple of phi of the first for the cell's lambda=X^2+X+1
        (so the null is NOT a Frobenius chain). Same resultant instrument
        (I1 and I2, required to agree). If the null also has deg_elim << 4d,
        the signal is artifactual. Seed 20260917, named sub-stream per (n,d).
        Count: 4 null cells.
    - name: 'C2a -- d=1, lambda=X, known collapse (duplicate equations)'
      role: blocking (proves-too-much / known-false object for a nonzero resultant)
      detail: >-
        At xi=1 with F_2 coefficients, phi is the identity on polynomials
        when lambda=X, so S^{(1)}=S^{(0)} and the Sylvester resultant is
        identically zero. This is WHY the idea's d=1, lambda=X slice is NOT
        a well-defined two-equation calibration here, and is recorded as
        such rather than guessed into a M(E)=4 test. FORCED outcome:
        identically_zero = true on both n in {17, 23}. Any other value
        invalidates the instrument (F5). Count: 2 cells.
    - name: 'C2b -- d=1, lambda=X+1, well-defined translation calibration'
      role: blocking (nearby-object d=1 calibration)
      detail: >-
        lambda=X+1 has degree 1, phi is a translation, S^{(1)} != S^{(0)}
        generically, M(E)_paper=4. Run at both n. Report deg_elim and
        rho_paper = deg_elim/4. This is the optional d=1 calibration the
        task card allowed "if well-defined". Count: 2 cells.
    - name: 'C3 -- two-implementation agreement matrix'
      role: blocking (instrument)
      detail: >-
        Over every reported cell (20 chain + 4 C1 + 2 C2a + 2 C2b = 28),
        the number of cells on which I1 and I2 do not return the same
        deg_elim (and the same identically_zero flag), reported as a
        pairwise disagreement count with every disagreeing cell listed in
        full. M2 of EXP-QSP-33b442 is the shape. Any disagreement STOPS
        and invalidates the run.
    - name: 'C4 -- successor control, NOT RUN in v1'
      role: out of scope
      detail: >-
        Weil-descent Semaev system at the same (n, m) through a Groebner
        engine over F_2: the nearby object of IDEA-20260916-b84e2d where
        M(E) of the chain is known not to govern. No Groebner engine is
        present. Named so a successor contract does not have to rediscover
        the control. v1 does not run it.
  independent_variables:
    - 'stage / arm (0, 1, 2, 3, 4, and the control id C1-C3)'
    - 'n in {17, 23}, hence n_prime = ceil(n/2) in {9, 12} and the named field polynomial'
    - 'd in {2, 3} on the chain and C1; d=1 on C2'
    - 'lambda (exhaustive within the counted non-linearized F_2 list, or the C2 pair {X, X+1}, or a C1 draw)'
    - 'resultant implementation: I1 C bit-packed / I2 Python bit-packed'
    - 'object class: chain / C1 null / C2a known-collapse / C2b translation'
  metrics:
    primary:
      - >-
        M1 -- deg_elim per (n, d, lambda) chain cell, as returned by I1 and
        by I2. MEASURED. The H1 quantity.
      - >-
        M2 -- rho_paper = deg_elim / (4d) per chain cell, and the median,
        min, max over lambda at each (n, d). Modeled denominator, measured
        numerator. H1 is evaluated on the MEDIAN at each (n, d), frozen
        before any run. Identically-zero cells are excluded from the median
        and listed separately.
      - >-
        M3 -- rho_note = deg_elim / (4 d^2) per chain cell, same aggregates.
        COMPARISON COLUMN. H1 is not scored against M3. The encoding
        discrepancy is not adjudicated.
      - >-
        M4 -- the I1-versus-I2 AGREEMENT MATRIX (C3) over all 28 algebraic
        cells: disagreement count, and every disagreeing cell listed.
    secondary:
      - >-
        M5 -- wall_clock_seconds per cell and per stage. MEASURED,
        engine-dependent, NEVER evidence for or against H1. Diagnoses the
        engine.
      - >-
        M6 -- peak_rss_bytes per cell and per stage. MEASURED,
        engine-dependent, NEVER evidence for or against H1.
      - >-
        M7 -- identically_zero flag and I3 common-factor flag per cell.
        MEASURED. Zero without a recorded algebraic reason invalidates.
      - >-
        M8 -- per-variable degrees of S^{(0)} and S^{(1)} per chain cell
        (Stage 1 gate). MEASURED.
      - >-
        M9 -- C1 null deg_elim and rho_paper per (n, d), with I1/I2
        agreement. MEASURED. Used only as the artefact control.
      - >-
        M10 -- C2a forced identically-zero (measured versus forced) and C2b
        deg_elim against M(E)_paper=4. MEASURED.
      - >-
        M11 -- MODELED / ARITHMETIC, NOT MEASURED: M(E)_paper=4d and
        M(E)_note=4 d^2 at each d, printed in a separate section so they
        cannot be mistaken for measurements.
  heuristic_under_test: H1
  heuristic_under_test_note: >-
    H1 of H-QSP-411d8f (the load-bearing heuristic of H-QSP-645a07, restated
    at m=2 executable cells). This contract tests ONLY the degree half of H1
    at m=2: whether rho_paper stays Theta(1) as d goes from 2 to 3. It does
    not test the cost-at-least-linear-in-degree half (M5/M6 are diagnostic).
    It does not test H1 at m>=3. It does not test (E'). Wall time MUST NOT
    be reported as evidence about H1.
  preregistered_prediction:
    quantity: >-
      deg_elim = deg Res_{X_2}(S^{(0)}, S^{(1)}) at every chain cell, and
      the median over lambda of rho_paper = deg_elim/(4d) at each (n, d) in
      {17, 23} x {2, 3}.
    formula: >-
      M(E)_paper = 4d at m=2 (KN-LIT-0a321c Appendix A.1:
      2^{m(m-1)} d^{m(m-1)/2}). H1 predicts rho_paper is >= 1/2 at both
      d=2 and d=3 at every tested n, and does not drop by a factor of 2 or
      more from d=2 to d=3: median_rho(n,3) >= median_rho(n,2)/2. Comparison
      column, not a H1 prediction: M(E)_note = 4 d^2. PRE-REGISTERED EXACT
      DENOMINATORS: at d=2, 4d=8 and 4 d^2=16; at d=3, 4d=12 and 4 d^2=36.
      A deviation of the MEASURED numerator from 4d is the observation, not
      a reason to edit this formula. NEVER TUNE AFTER A RUN.
    source: >-
      KN-LIT-0a321c Appendix A.1 (M(E) as an UPPER bound on Rojas' univariate
      degree) plus Lemma 3.1 (big-O), tested in the OPPOSITE direction H1
      needs (actual degree, not merely bounded by). The paper formula is
      H1's model; the note formula is the historical encoding named by
      IDEA-20260916-b84e2d and CORR-20260916-8d0b81 prior_value. H-QSP-411d8f
      is the hypothesis. FROZEN: never tuned to an observation; any
      adjustment requires a versioned protocol_amendment under
      experiments/EXP-QSP-82a906/amendments/, and runs already executed are
      never re-scored against a new prediction.
  scale_relevance:
    tier: toy
    justification: >-
      n in {17, 23}, m=2, d in {2, 3}, bit-packed resultants of bivariates
      of per-variable degree at most 6. NO TRANSFER TO n=131. No attack
      exponent. Claim tier of any later evidence will be toy. The two n
      values exist so a n-independent ratio (expected for F_2 coefficients)
      can be seen twice, not so that n=23 licenses n=131. Correspondence
      tricks to cryptographic scale are not used and are not claimed.
    correspondence: >-
      NONE. Direct computation of the Sylvester resultant over the stated
      F_{2^n}. Template-null in the sense of no sampling correspondence
      (no Deuring, no isometry, no surrogate object). The only sampling
      anywhere is C1's four seeded null draws, whose role is the artefact
      control, not scale access.
  tail_checks:
    - >-
      GROWING-DEFICIT TAIL: at each n, the ratio median_rho(d=3) /
      median_rho(d=2). A value < 1/2 is G1. Reported even when >= 1/2.
    - >-
      FAR-BELOW TAIL: the smallest rho_paper over all chain cells, and
      whether both d-medians at any n fall below 1/4 (G2).
    - >-
      ZERO TAIL: every identically-zero chain cell with its I3 flag. A
      zero without I3 is invalidation, not a tail of H1.
    - >-
      NULL TAIL: C1 rho_paper versus the chain median at the same (n, d).
      A chain collapse that the null shares is an artefact tell.
    - >-
      NOTE-COLUMN TAIL: the same aggregates under rho_note, reported, not
      scored against H1.
  replication:
    seeds:
      base_seed: 20260917
      c1_streams: >-
        one named sub-stream per (n, d) cell, derived deterministically from
        the base seed and the cell label and printed in the manifest; no
        null is ever silently re-drawn except as the frozen degree-condition
        and not-a-phi-pair rejection, which consume the same stream
      seed_free_arms: >-
        Stages 0 and 1, the 20 chain cells, and C2a/C2b are DETERMINISTIC
        and seed-free: they enumerate a fully specified finite set or a
        named polynomial identity and depend on no random choice. Re-running
        them on any machine must reproduce every deg_elim bit for bit. That
        is the replication guarantee for the load-bearing arms.
    independent_instances: >-
      1 seed-free exhaustive pass over the 20 chain cells and 4 C2 cells;
      2 independent resultant implementations (I1, I2) required to agree
      on every reported cell (C3); 4 independent C1 null draws (one per
      (n,d)) from seed 20260917. Like EXP-QSP-33b442 stages 0-3, the
      load-bearing arithmetic is seed-free, so independent_instances of
      the chain itself is 1 with seeds: [] on that arm.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 6
    maximum_workers: 1
    note: >-
      ADVISORY per docs/research-budget-policy.md and the CLAUDE.md research
      budget instruction of 2026-09-06: time and CPU estimates are advisory,
      may be exceeded with the overrun recorded, and require no further user
      approval. The memory cap (4 GB) and the worker count (1) are MACHINE
      PROTECTION and are real limits. A run is one stage invocation (Stages
      0, 1, 2, 3, 4 plus one re-invocation for infrastructure failure).
      maximum_runs 6 is a count of stage invocations, not of the 28 algebraic
      cells, which live inside those stages. Estimates: Stage 0 minutes
      (compile plus the named fixture); Stage 1 seconds (degree checks);
      Stage 2 the 20 chain cells, seconds to minutes per cell for bit-packed
      Sylvester of bivariates of degree <= 6 over 23-bit fields; Stage 3 the
      8 control cells; Stage 4 extraction. Budget exhaustion is
      infrastructure (F6), never evidence. ECC unlimited is NOT a license
      to add m=3 Groebner cells to this version.
  stopping_rules:
    - 'Stage 0 fail (missing gcc, missing implementation, fixture disagreement): STOP before Stage 1; archive the failing outputs; report infrastructure. No later number is produced or reported as a H1 observation.'
    - 'Stage 1 degree gate fail or expanded-form identity fail: STOP; builder defect; archive the polynomials; not evidence about H1.'
    - 'C3 disagreement at any reported cell: STOP; archive both implementations'' outputs; report F5; the run is invalid, not the hypothesis.'
    - 'C2a (lambda=X) returning a nonzero resultant: STOP; the instrument is not a resultant; report F5.'
    - 'A certified H1-refuting deficit (G1 or G2) at any n for the (2,3) cell versus (2,2): archive the certificates (per-cell JSON, both implementations, medians), STOP further n (enough for the scoped claim), and return WITHOUT interpreting (E''). Remaining cells already started may be finished; new n are not opened.'
    - 'Identically-zero eliminant on a chain cell: record I3; do not treat as cheap solving; continue the other lambda at that (n,d). If I3 is missing, invalidate that cell.'
    - 'Budget exhaustion, timeout, crash, or the memory cap before a stage completes: STOP and record F6 as an INFRASTRUCTURE outcome under AGENTS.md rule 3/5, with partial per-cell output archived as a checkpoint. Never evidence about H1, and a stage that did not finish is reported as unfinished, never estimated.'
  invalidation_rules:
    - 'INSTRUMENT DISAGREEMENT (I1 and I2 not equal on deg_elim or identically_zero at any reported cell) invalidates the run. The run returns to the Executor with the disagreeing cells listed; nothing about H1 is concluded from an invalid run.'
    - 'C2a returning other than identically-zero invalidates every count produced by that instrument in that run.'
    - 'An identically-zero eliminant without a recorded algebraic reason (I3 common-factor flag) invalidates that cell and, if it recurs, the stage.'
    - 'A candidate count or deg_elim read from analysis/qsp-ecc2k130/explore/ rather than produced by this run invalidates the record entirely and is a violation of AGENTS.md core rule 5.'
    - 'Curve construction, point arithmetic, group operations, or a "re-verified by curve arithmetic" obligation anywhere in the implementation invalidates the run as out of contract.'
    - 'A run whose manifest is missing any AGENTS.md artifact-policy field (exact command, git commit and dirty-tree state, environment and dependency versions including compiler and flags, inputs and seeds, requested policy and resolved model with probe status, reasoning effort, fallback and degraded flags, stdout/stderr, raw results, validity status and reason, timestamps and resource measurements) is schema-incomplete and is not evidence until re-run or amended. This experiment RUNS a program, unlike RUN-QSP-33b442-S0; full companions are required on every stage invocation.'
    - 'TIMEOUTS, CRASHES, MEMORY-CAP KILLS, MISSING COMPILER AND BUDGET EXHAUSTION ARE INFRASTRUCTURE OUTCOMES AND ARE NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md rule 3). They invalidate the affected stage''s completeness, not the hypothesis.'
    - 'Any gate failure archives its evidence (the failing value, the cell, the instrument outputs) BEFORE stopping.'
  success_criterion: >-
    DECIDABLE FROM THE METRICS ABOVE ALONE, with no post-hoc threshold.
    SUCCESS requires ALL of: (S0) Stage 0 gate pass (gcc builds; I1 and I2
    exist; they agree on the named fixture's deg_elim and, if emitted, the
    eliminant up to scalar); (S1) Stage 1 degree gate pass (expanded-form
    identity holds; every chain cell has per-variable degrees 2 and 2d);
    (S3) C3 agreement on every reported cell (M4 = 0 disagreements); (S4)
    every cell of the 20 chain + 8 control cells emits deg_elim with BOTH
    implementation values (or a recorded identically-zero flag with I3);
    AND (S5) the pre-registered comparison of rho_paper(d=2) versus
    rho_paper(d=3) is computed at every tested n (the two medians, their
    ratio, and whether G1/G2 fire). SUCCESS MEANS THE MEASUREMENT
    COMPLETED, NOT THAT H1 HOLDS. A completed measurement that fires G1
    or G2 is still a successful experiment and a scoped refutation of H1;
    that is the valuable outcome. Anything short of S0-S5 is NOT a success:
    it is an invalid run, or -- if the stages that did run passed but a
    stage did not complete for an infrastructure reason -- INCONCLUSIVE,
    reported as such with the unfinished stage named.
  falsification_criterion: >-
    DECIDABLE FROM THE METRICS ABOVE ALONE. THIS IS THE FALSIFICATION
    CRITERION OF H1 (the hypothesis), not of the experiment's "success".
    G1: at any tested n, with C3 agreement, median_lambda rho_paper(d=3)
    < median_lambda rho_paper(d=2)/2 -- the deficit GROWS with d. H1 is
    refuted at m=2, that n, the tested lambda class, xi=1, named engines.
    G2: at any tested n, both medians < 1/4, or every chain cell at that n
    has identically-zero eliminant with recorded I3 -- deg_elim is
    identically far below 4d at both d. Same scoped refutation. G3 / F5:
    instrument disagreement or C2a nonzero -- the RUN is INVALID; this is
    never evidence about H1. G4 / F6: timeout, crash, missing compiler,
    memory cap, budget -- INFRASTRUCTURE under AGENTS.md rule 5, never
    evidence. A certified growing deficit is the valuable outcome: archive
    it, stop further n, return without interpreting (E'). Scope of G1/G2:
    m=2, tested n, tested lambda class. Not m>=3, not n=131, not (E').
  required_artifacts:
    - 'A run manifest per stage invocation carrying every AGENTS.md artifact-policy field: exact command; git commit and dirty-tree state; environment and dependency versions (including the compiler and flags for the C helper, python3 version, numpy version); all input parameters, cell definitions and field polynomials; all seeds and named sub-streams; requested model policy, backend, resolved runtime model identifier and its probe-verification status; reasoning effort, fallback_used and any degraded requirements; stdout and stderr; raw machine-readable results; validity status and reason; timestamps, wall clock and peak_rss_bytes. Required companions on every stage: command.txt, environment.json, stdout.log, stderr.log, raw-result.json, manifest_v2.yaml -- this experiment RUNS a program, unlike RUN-QSP-33b442-S0.'
    - 'Per-cell machine-readable JSON for Stages 2 and 3: one row per chain cell and per control cell with every column named under inputs.stage_2.recorded_per_cell.'
    - 'The I1-versus-I2 AGREEMENT MATRIX (M4) in full, with every disagreeing cell listed if any.'
    - 'The GATE RECORD: pass/fail for Stage 0, Stage 1 degree/identity, C2a forced zero, C3, with the archived evidence of any failure.'
    - 'The Stage 4 REPORT, carrying the d=2 versus d=3 ratios, both M(E) columns, censored cells, exact scope, and -- IF a growing deficit appears -- the docs/inventor-protocol.md section 4 closure block AND the templates/research-records.md obstruction block with statement, quantity, value with units, measured_by run IDs, scope, and a completed resource_check (examined, reading, spawned_ids). No interpretation of H-QSP-645a07.'
    - 'The implementation itself under experiments/EXP-QSP-82a906/implementation/, with its provenance stated where code was adapted from analysis/qsp-ecc2k130/explore/gf2rc.c.'
    - 'An execution-report.yaml recording, per stage, what ran, what did not, and why -- with unfinished work reported as unfinished and never estimated.'
  measured_vs_modeled: >-
    MEASURED (produced by this experiment's runs, from Sylvester determinants
    over the stated fields, with no model between the number and the
    quantity): M1 deg_elim, M4 agreement, M5 wall time, M6 peak RSS, M7 zero
    flags, M8 degrees, M9 null deg_elim, M10 C2 outcomes. MODELED / ARITHMETIC
    (computed in closed form from the two frozen formulas, NOT measured, and
    printed in a separate section): M11 in its entirety -- M(E)_paper=4d and
    M(E)_note=4 d^2 -- and the denominators of M2 and M3. M2 and M3 are
    hybrid: measured numerator, modeled denominator, labelled as such.
    Wall time and peak_rss are MEASURED engine-dependent and NEVER used as
    evidence for or against H1; they diagnose the engine. NOT PRESENT: any
    cost formula standing in for a Groebner solve; any kappa estimate; any
    n=131 transfer.
  optimistic_assumption_disclosure: >-
    If a later reader interprets deg_elim ~ 4d as kappa >= 1, that
    interpretation is OPTIMISTIC in H1's favour on two counts, flagged
    here so it cannot be smuggled: (1) Appendix A.1's M(E) is an upper
    bound on Rojas' univariate degree, and treating a matching measurement
    as a lower bound on solving cost still needs "solving costs at least
    linearly in the degree", which this contract does not test (M5 is not
    evidence); (2) m=2 resultant degree is not m>=3 Groebner cost. Tables
    produced under those readings are bounds on a degree ratio, not
    predictions of an attack exponent. This contract offers no concrete-cost
    table at cryptographic parameters and no affected-versus-safe scope for
    deployed curves: both would be dishonest before m>=3 is measured and
    before kappa is bounded.
  claim_tier_note: >-
    Any later evidence record of this experiment has claim_tier toy. A
    consistency-with-H1 outcome does not promote H-QSP-645a07, does not
    validate (E'), and does not move an ECDLP exponent. A G1/G2 outcome is
    a scoped empirical refutation of H1 at m=2, tested n, tested lambda
    class, and still does not close RQ-QSP-f9bbdb. Promotion of any
    asymptotic claim remains gated by agents/coordinator.md (proof
    decomposition, validated heuristics at the claimed scale, concrete-cost
    table, independent review-xhigh plus red-team), none of which this
    contract satisfies. The review_plan for a later claim-changing round is
    written by the Coordinator on the REVIEW handoff, not here.
