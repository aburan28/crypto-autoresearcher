protocol_amendment:
  experiment_id: EXP-QSP-82a906
  version_from: 1
  version_to: 2
  recorded_at: '2026-09-17'
  predecessor_path: experiments/EXP-QSP-82a906/specification.yaml
  predecessor_sha256: f13af6730b8252ca3c3937ad3ff32e301bed676290d0f052f47e98cb02e66ebc
  predecessor_archive: TASK-20260917-5bb67b
  predecessor_archive_commit: 7bfe2afce0e037d8c56a9850e02ca5ec1cd792e6
  decision_id: DEC-20260917-9f82c1
  archived_by: TASK-20260917-294b29
  reason: >-
    Two internal-consistency defects in the version-1 contract, found by
    Cursor Bugbot on PR #1272 after merge and confirmed against the frozen
    bytes on origin/main (sha256 f13af6730b8252ca3c3937ad3ff32e301bed676290d0f052f47e98cb02e66ebc)
    BEFORE any run of EXP-QSP-82a906. (1) G2 SCOPE. inputs.stage_2.requirement
    says that if every lambda at a single (n,d) is identically zero with a
    recorded gcd, "that (n,d) is a collapse observation under G2". Official
    G2, in the same file's falsification_criterion and in H-QSP-411d8f
    L486-488, is n-scoped: both medians < 1/4, OR every chain cell at that n
    (d=2 AND d=3, all lambda) identically zero with recorded I3. Identically-
    zero cells are dropped from the median, so a wiped (n,d) leaves
    median_rho undefined and G1/S5 uncomputable from that pair. An executor
    following stage_2 could stop and refute H1 from one d slice. (2) S4
    VERSUS THE G1/G2 STOP. success_criterion S4 demands deg_elim from all
    20 chain plus 8 control cells, and TASK-20260917-66ec2b's completion_gate
    says the same unless the gap is infrastructure. The stopping rule aborts
    unopened n once G1 or G2 fires at one n, and the contract still calls
    that a successful scoped refutation. A G1 stop therefore fails S4 even
    though it is named the valuable outcome. specification.yaml, H-QSP-411d8f
    and TASK-20260917-66ec2b are IMMUTABLE and are bound by content in
    ledger/archives/TASK-20260917-5bb67b.yaml; they are not edited. A
    Bugbot Autofix commit d33ddeb0a on cursor/qsp-h-supersede-3d0a rewrote
    those three files in place after PR #1272 merged; that rewrite is
    CORR-20260917-eb2d68 and is not the official repair.
  changes:
    - >-
      inputs.stage_2.requirement, the sentence beginning "if every lambda at
      a (n,d) is identically zero" is REPLACED by: "Exclude identically-zero
      cells from the median rho. If every lambda at a single (n,d) is
      identically zero with a recorded gcd, that (n,d) median is undefined
      (empty aggregate); that pair is a collapse observation under ZERO TAIL
      / M7, NOT a G2 event. G2 fires only under falsification_criterion: at
      that n, both defined medians < 1/4, or every chain cell at that n
      (d=2 AND d=3) identically zero with recorded I3. G1 is not computed
      from an undefined median. S5 at that n records median_rho undefined
      for the wiped d, G1=inapplicable unless both medians are defined, and
      G2 true/false only under the official n-scope criterion."
    - >-
      success_criterion S4 is REPLACED by: "every OPENED chain cell and every
      OPENED control cell (those whose n was opened) emits deg_elim with BOTH
      implementation values (or a recorded identically-zero flag with I3). A
      certified G1/G2 stop that leaves later n unopened does not fail S4;
      those n are named unfinished-by-stop (not-opened), not missing and not
      infrastructure." S5 is REPLACED by: "the pre-registered comparison of
      rho_paper(d=2) versus rho_paper(d=3) is computed at every tested n that
      was opened (the two medians, their ratio, and whether G1/G2 fire; an
      undefined median from a wiped (n,d) is recorded as undefined, and G1/G2
      are decided only by the falsification_criterion)." The sentence
      "Anything short of S0-S5 is NOT a success" still holds, with the
      amended S4/S5. A completed measurement that fires G1 or G2 at one n
      and stops further n remains a successful experiment and a scoped
      refutation of H1; that is still the valuable outcome.
    - >-
      stopping_rules G1/G2 bullet is UNCHANGED in what it orders the executor
      to do (archive certificates, STOP further n, remaining cells already
      started may be finished, new n are not opened, no interpretation of
      (E')). It GAINS the scoring clause: "This remains a successful
      experiment under the amended S4/S5: those criteria are evaluated on
      opened n only; unopened n are unfinished-by-stop, not an S4 miss and
      not infrastructure."
    - >-
      falsification_criterion G2 itself is UNCHANGED (both medians < 1/4, or
      every chain cell at that n identically zero with I3). It GAINS the
      operational note already implied by H-QSP-411d8f: "A wipe of only one
      d at that n is not G2: that d's median is undefined, G1 does not fire
      from it, and G2's both-medians clause does not fire; G2's zero-cell
      clause requires d=2 AND d=3."
    - >-
      TASK-20260917-66ec2b completion_gate is NOT edited. Under this
      amendment the third bullet is interpreted as: all opened chain cells
      and all opened control cells emit deg_elim from BOTH I1 and I2 (or
      identically-zero with I3), OR a certified G1/G2 stop left later n
      unopened (named unfinished-by-stop, not unfinished infrastructure),
      OR the stage that did not complete is named as unfinished for an
      infrastructure reason. The C2a bullet is interpreted as: C2a returned
      identically-zero at every opened n, or the discrepancy is archived and
      the run is invalid, or C2a at an unopened n was not run because G1/G2
      stopped further n. The card's objective still names specification.yaml
      version 1; the executor of that card executes version 1 as modified by
      this amendment and records contract version 2 with this file's path
      in the run manifest.
  unchanged:
    - every cell, lambda list, instrument, seed, control, threshold and budget
    - n in {17, 23}, m=2, d in {2, 3}, xi=1, Semaev f3, I1/I2/I3
    - every pre-registered exact value in preregistered_prediction (4d vs 4 d^2; rho thresholds 1/2 and 1/4)
    - G1 as stated (median_rho(d=3) < median_rho(d=2)/2 at a tested n with both medians defined)
    - G3/F5 and G4/F6; every invalidation rule
    - H-QSP-411d8f (its G2 is already n-scoped; this amendment does not supersede it)
    - the G1/G2 stop's obligation to halt further n; only the success-scoring of that halt changes
  affected_runs: []
  confirmatory_status: preserved
  approved_by: coordinator
  approval_basis: >-
    Consistency correction to an approved contract before any run, under the
    AGENTS.md standing user authorization of 2026-09-06 and the original
    approval DEC-20260917-f37ca4. It authorizes no run that DEC-20260917-f37ca4
    did not, asserts nothing about H-QSP-411d8f or H-QSP-645a07, and re-scores
    nothing: no run of this contract has executed (experiments/EXP-QSP-82a906/runs/
    is empty except .gitkeep). specification.yaml is immutable and is bound
    by content in ledger/archives/TASK-20260917-5bb67b.yaml; it is not edited.
  binding: >-
    The Executor under TASK-20260917-66ec2b executes specification.yaml
    version 1 as modified by this amendment, and the run manifest records
    contract version 2 with this file's path. Do not dispatch until snapshot
    archive TASK-20260917-294b29 is committed and the post-commit verifier
    accepts it. Do not take commit d33ddeb0a as a repair of these files.
  does_not_rewrite:
    - experiments/EXP-QSP-82a906/specification.yaml
    - ledger/hypotheses/H-QSP-411d8f.yaml
    - ledger/handoffs/TASK-20260917-66ec2b.yaml
