# EXP-CERTBIN-cf1777
# Trace-spectrum class counts. No trace evaluation.
# Approved by DEC-20261002-ff01bd.
experiment:
  id: EXP-CERTBIN-cf1777
  hypothesis_id: H-CERTBIN-405f4d
  source_idea: IDEA-20260926-bbf2ed
  question_id: RQ-CERTBIN-836ce2
  version: 1
  title: Trace-spectrum class counts
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-ff01bd
  objective: >-
    Count the rotation classes of weight-2 and weight-3 strings at
    degrees 17, 19 and 131, and count the nonzero even-weight
    vectors in a 65-bit space.
  inputs:
    c131_2: 8515
    q131_2: 65
    r131_2: 0
    c131_3: 366145
    q131_3: 2795
    r131_3: 0
    short_periods_131: 0
    c17_2: 136
    q17_2: 8
    c17_3: 680
    q17_3: 40
    c19_2: 171
    q19_2: 9
    c19_3: 969
    q19_3: 51
    mixed: 98
    discarded_bits: 33
    cubic_excess: 2697
    even_summands_65: 18446744073709551615
    even_summands_8: 127
    even_summands_9: 255
    square_below_131: 121
    square_above_131: 144
  controls:
    - >-
      A cubic class count of 366145 is the undivided binomial.
      The class count is 2795. Reporting 366145 as the class
      count invalidates the run.
    - >-
      A quadratic class count of 66 at degree 131 is false. The
      count is 65. Reporting 66 invalidates the run.
    - >-
      A nonzero short-period count at degree 131 is false. Every
      weight-3 orbit has size 131. Reporting a short period
      invalidates the run.
    - >-
      An even-weight summand count of 2^64 is the count that
      includes the zero vector. The nonzero count is 2^64 - 1.
      Reporting 2^64 invalidates the run.
    - >-
      A mixed width other than 98 is false. 65 plus 33 is 98,
      and 131 minus 98 is 33. Reporting another pair invalidates
      the run.
    - Two counting routes. They must not import each other.
  independent_variables:
    - degree
    - route in {binomial, necklace}
  metrics:
    primary:
      - quadratic_classes
      - cubic_classes
      - short_periods
      - implementations_agree
    secondary:
      - even_summands_65
      - mixed
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The degree-131 cubic class count 2795.
    formula: >-
      For a prime length, every weight-2 or weight-3 string has
      rotation orbit equal to the length. The class count is the
      binomial divided by the length. The nonzero even-weight
      count in dimension k is 2^{k-1} - 1. The mixed width is
      65 + 33.
    source: >-
      IDEA-20260926-bbf2ed states 65 quadratic classes and 2795
      cubic classes, read 2026-10-02. The orbits were enumerated
      in this design session. That enumeration is not a run. The
      cubic class count is 2795, not the undivided binomial. No
      trace was evaluated.
  scale_relevance:
    tier: toy
    justification: Class counts only. No transfer to a fibre size.
    correspondence: null
  tail_checks:
    - The degree-131 cubic count is required. Stopping after degree 19 and still reporting 2795 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other counting route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the cubic class count is reported as 366145, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The cubic class count is reported as 366145.
    - The quadratic class count at degree 131 is reported as 66.
    - A short period is reported at degree 131.
    - The even-weight summand count is reported as 2^64.
    - The mixed width is reported as anything other than 98.
    - A trace value or a fibre size is reported.
  success_criterion: >-
    Both runs agree on the degree-131 quotients 65 and 2795, the
    degree-17 quotients 8 and 40, the degree-19 quotients 9 and
    51, a short-period count of 0, the mixed width 98, the
    discarded-bit count 33, and the even-weight summand count
    18446744073709551615. The cubic class count stays 2795.
  falsification_criterion: >-
    The runs agree, the short-period count stays 0, the cubic
    class count stays 2795, and any count differs from the
    preregistered table.
  required_artifacts:
    - experiments/EXP-CERTBIN-cf1777/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CERTBIN-cf1777/runs/<RUN-ID>/command.txt
    - experiments/EXP-CERTBIN-cf1777/runs/<RUN-ID>/stdout.log
    - experiments/EXP-CERTBIN-cf1777/runs/<RUN-ID>/stderr.log
    - experiments/EXP-CERTBIN-cf1777/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CERTBIN-cf1777/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any trace evaluation, Arf sign, radical, normal basis, or curve.
    - A claim that a trace spectrum helps or does not help as a factor base.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
