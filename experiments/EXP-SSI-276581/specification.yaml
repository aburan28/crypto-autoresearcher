# EXP-SSI-276581
# Integer slice of two written thresholds. No walk is run.
# Approved by DEC-20261009-561818.
experiment:
  id: EXP-SSI-276581
  hypothesis_id: H-SSI-1158f7
  source_idea: IDEA-20261007-20f660
  question_id: RQ-SSI-1946c9
  version: 1
  title: Agreement floor 85 hundredths versus chance baseline 50 hundredths
  status: approved
  frozen: true
  designed_at: '2026-10-09'
  approved_by: coordinator
  approval_decision_id: DEC-20261009-561818
  objective: >-
    Check the hundredths 85 and 50, the product 4250, and the nearby gap 0.
  inputs:
    agreement_hundredths: 85
    chance_hundredths: 50
    threshold_gap: 35
    threshold_product: 4250
    threshold_sum: 135
    nearby_a: 50
    nearby_b: 50
    nearby_gap: 0
    nearby_product: 2500
  controls:
    - >-
      The agreement floor is 85 hundredths. The chance baseline is 50
      hundredths. Reporting both as 50 drops the gap and invalidates
      the run.
    - >-
      Eighty-five exceeds fifty by 35. The product of 85 and 50 is
      4250. Their sum is 135.
    - >-
      Two readings of the chance baseline are both 50. Their gap is
      0 and their product is 2500.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {read, subtract}
  metrics:
    primary:
      - agreement_hundredths
      - chance_hundredths
      - threshold_gap
      - implementations_agree
    secondary:
      - threshold_product
      - threshold_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The agreement floor is 85 hundredths and the chance baseline is
      50 hundredths. The gap of two chance baselines is 0.
    formula: >-
      Read 85. Read 50. Subtract 50 from 85. Multiply 85 by 50.
      Subtract 50 from 50.
    source: >-
      IDEA-20261007-20f660 writes an agreement floor of 0.85 and a
      chance baseline of 0.50, read 2026-10-09. The gap, the product,
      and the sum were recomputed in this design session. That
      computation is not a run. No walk was run.
  scale_relevance:
    tier: toy
    justification: Two written thresholds. No transfer to a walk or a ciphertext.
    correspondence: null
  tail_checks:
    - The product 4250 and the nearby gap 0 are required. A check that stops at the hundredths 85 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the hundredths 85 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The agreement floor is not 85 hundredths.
    - The chance baseline is not 50 hundredths.
    - The product is not 4250.
    - Both hundredths are reported as 50, or a walk is run.
  success_criterion: >-
    Both runs agree that the agreement floor is 85 hundredths, that
    the chance baseline is 50 hundredths, and that 85 exceeds 50 by 35.
  falsification_criterion: >-
    The runs agree that the agreement floor is computed, and that
    floor is not 85 hundredths.
  decision_impact:
    on_positive: >-
      Agreement that 85 exceeds 50 by 35 records the written gap
      between the agreement floor and the chance baseline. It does
      not run an encryption.
    on_negative: >-
      Agreement that the agreement floor is not 85 hundredths records
      that the written thresholds were misread. The template test
      stays unrun.
  required_artifacts:
    - experiments/EXP-SSI-276581/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-SSI-276581/runs/<RUN-ID>/command.txt
    - experiments/EXP-SSI-276581/runs/<RUN-ID>/stdout.log
    - experiments/EXP-SSI-276581/runs/<RUN-ID>/stderr.log
    - experiments/EXP-SSI-276581/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-SSI-276581/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, encryption, or decryption trial.
    - Any claim that a threshold gap of 35 hundredths moves an exponent.
    - Any security statement about a public-evaluation template.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
