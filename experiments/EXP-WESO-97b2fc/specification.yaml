experiment:
  id: EXP-WESO-97b2fc
  hypothesis_id: H-WESO-ac6c87
  derived_from_idea: IDEA-20260805-07ff43
  question_id: RQ-WESO-8aff57
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: >-
    Measuring beta, the d-exponent of the incidence ratio N_d(p)/h(-4pd), by two
    disjoint code paths at a toy prime ladder - the one input that decides whether
    the conjugate-degree density exponent is 3/2 or 3/2 + beta
  objective: >-
    The one uncertainty a run reduces is whether the Eichler optimal-embedding
    count that the conjugate-degree density derivation rests on carries a
    d-DEPENDENT local factor. A run establishes (i) N_d(p), the exact number of
    supersingular curves over F_{p^2} admitting an isogeny of degree exactly d to
    their conjugate, by exhaustive enumeration, for every d on the declared grid at
    every prime in the declared ladder; (ii) h(-4pd) over the same grid, by a
    DISJOINT reduced-binary-form counting path; (iii) the fitted slope beta_hat of
    log(N_d/h(-4pd)) against log d, with a bootstrap interval and with the smallest
    beta the grid could have resolved reported beside it; and (iv) the multiplicity
    distribution, without which beta_hat is confounded. It also re-derives, at zero
    compute, the symbolic identity a = 3/2 + beta that gives beta its meaning. No
    attack is claimed, no algorithm exponent is moved, and nothing here is
    cryptographic-scale evidence.
  what_this_is_not:
    - >-
      Not an attack, a break, a speedup, or a cryptanalytic result of any kind. It is
      an integer-counting measurement contract at toy primes.
    - >-
      Not a re-run or a duplicate of H-WESO-9dc201's density-law test. It measures ONE
      input to that law - the input that record carries as an assumption - and its
      only connection to the law is the identity a = 3/2 + beta.
    - >-
      Not a status change to H-WESO-9dc201, H-WESO-001, any evidence or decision
      record, or any goal, and not a promotion of any knowledge entry.
    - >-
      Not a validation of any external theorem. Theorem 1.5 and Eichler's count are
      RELAYED, UNVERIFIED in this program; the contract checks their consequences at
      toy p and asserts nothing about their sources.
    - >-
      Not approval, freezing, execution authorization, a run, an observed output, or
      evidence. No run has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      Maximal supportable scope: at the executed toy primes and over the executed
      d-grid, the fitted slope of log(N_d/h(-4pd)) against log d was [value] with
      interval [interval], the enumeration degree ceiling did not bind, and the
      multiplicity slope was [value]. WHAT DOES NOT FOLLOW: no asymptotic statement
      about the local factors; no validation of the density law rho_p(Y) itself; no
      claim about the location of the p^{1/3} memory corner at cryptographic p; and
      specifically NOT that a beta_hat near 0 establishes beta = 0 - the grid's
      resolution is reported precisely so that reading is blocked.
  inputs:
    procedure: >-
      STAGE S0 (zero compute, hours): re-derive, symbolically and on one page, the
      identity sum_{d<=Y} N_d ~ sqrt(p) Y^{3/2+beta} from r_p(d) ~ d^beta, so that
      beta's meaning is fixed BEFORE any fit exists. A defect here ends the line at
      zero compute. Freeze the weighting convention for "counted with the natural
      weights", the d-grid, the prime ladder and the fit method.
      STAGE S1 (seconds): the class-number path alone - compute h(-4pd) for every
      (p, d) on the grid by counting reduced binary quadratic forms. Independently
      compute h(-p) or 2h(-p) per prime for the positive control.
      STAGE S2 (minutes): build S_p exhaustively at every prime and run the two exact
      instrument gates, read BEFORE anything else: n_fp must equal the class number
      integer for integer, and the delta = 1 locus must equal the F_p-rational locus
      exactly. A failure voids the run.
      STAGE S3 (minutes to an hour): the signal arm - for every curve in S_p and every
      d on the grid, decide whether an isogeny of degree exactly d to the conjugate
      exists, recording N_d, the per-curve multiplicity (how many admissible d), and
      max_delta. Record the degree ceiling actually reached and check it does not bind.
      STAGE S4 (minutes): the matched-random NULL - a uniformly random subset of S_p of
      the same cardinality as the degree-<=Y ball, counting accidental sigma-collisions
      against the forced expectation 12|ball|^2/p.
      STAGE S5 (zero compute): fit beta_hat per prime with bootstrap intervals, report
      the local slopes at every interior grid point rather than only the global fit,
      report the smallest resolvable beta, and write the scoped verdict plus the
      refusal statement for every regime outside the grid.
    instrument: >-
      Python 3.11 with numpy; NO SageMath, which is absent from this container. TWO
      DISJOINT CODE PATHS that share no helper: (1) supersingular j-invariant
      enumeration and l-isogeny-graph walking via modular polynomials, producing N_d,
      multiplicities and max_delta; (2) reduced binary quadratic form counting,
      producing h(-4pd) and h(-p). Exact integer arithmetic throughout; rho_p and
      r_p(d) are recorded as exact rationals (count/count), never as floats. Bootstrap
      by numpy resampling over curves with a frozen seed. Recorded through
      harness/runner.py.
    parameters: >-
      Prime ladder: at least four primes spanning at least one and a half decades, the
      largest chosen so STAGE S3 terminates inside wall_clock_seconds_per_run. d-grid:
      every integer 1 <= d <= floor((p/2)^{1/3}) at each prime, with the grid point
      count recorded, since a slope over fewer than 8 points cannot resolve a 0.15
      band. Degree ceiling: the largest l for which a modular polynomial is available,
      recorded per prime with an explicit non-binding check. Pre-registered admissible
      band for beta_hat: [-0.15, +0.15]. Bootstrap resamples: 1000 per prime.
  controls:
    - >-
      POSITIVE CONTROL 1, exact, forced value, read FIRST. n_fp - the number of
      supersingular j-invariants in F_p by curve enumeration - must equal h(-p) or
      2h(-p) (per p mod 4) computed by the disjoint form-counting path, INTEGER FOR
      INTEGER, at every prime. It is free, it cannot be passed by accident, and if it
      fails NO negative result about beta may be reported from that run.
    - >-
      POSITIVE CONTROL 2, exact, forced value. The delta = 1 locus must equal the
      F_p-rational locus exactly - every F_p-rational curve found, and no other curve
      reported at delta = 1. A miss in either direction is an instrument defect.
    - >-
      BOUND CHECK with a frozen disambiguation rule. max_delta <= (p/2)^{1/3} at every
      prime. A violation is triaged FIRST as an instrument bug and only second as
      mathematics; the rule is frozen here precisely so the triage order cannot be
      chosen after seeing the value.
    - >-
      NULL OBJECT, matched, forced value derived pre-run, CAN FAIL. A uniformly random
      subset of S_p of the same cardinality as the degree-<=Y ball, with
      sigma-collisions counted. Forced expectation 12|ball|^2/p, which decays in p at
      exponent -1/3. If the random control returns collisions at the structural rate,
      the enumeration is finding collisions by construction and the measurement is void.
    - >-
      CONFOUND CONTROL, blocking. The per-curve multiplicity distribution is measured
      and its slope against log d reported. A d-dependent multiplicity is
      indistinguishable from a d-dependent local factor in r_p(d); if the multiplicity
      slope is non-zero, beta_hat is reported as UNIDENTIFIABLE, not as a finding.
    - >-
      CEILING CONTROL. The maximum isogeny degree the instrument actually reached is
      recorded per prime and compared against the d-grid maximum. A binding ceiling
      depresses N_d increasingly with d and manufactures a negative slope; a prime whose
      ceiling binds is EXCLUDED from the fit with the exclusion recorded.
    - >-
      GRADED CONTROL, all interior grid points, monotonicity reported. Local slopes
      d log r_p / d log d are reported at every interior grid point, not only as a
      global fit. A global beta_hat of 0 assembled from wildly non-constant local slopes
      is a coincidence, not a constant, and this control is what distinguishes them.
    - >-
      SMALL-CM SEPARATION. j = 0 and j = 1728 carry anomalous automorphism weights and
      are reported SEPARATELY from the main ratio, since they are exactly where a
      weighting convention could manufacture a slope.
    - >-
      ORDERING CONTROL. Both positive controls, the null and the ceiling check are
      computed, recorded and hash-committed BEFORE beta_hat is looked at.
  independent_variables:
    - prime p on the declared ladder
    - degree d on the declared grid
    - 'code path: curve enumeration versus reduced-form counting'
    - 'population: full S_p / matched random subset / small-CM curves reported separately'
  metrics:
    primary:
      - name: beta_hat
        units: dimensionless exponent (slope of a log-log fit)
        computed_as: >-
          least-squares slope of log(N_d(p)/h(-4pd)) against log d, fitted per prime
          over all interior grid points, with a bootstrap interval from 1000 resamples
          over curves. Reported per prime and as a ladder trend.
      - name: resolvable_beta
        units: dimensionless exponent
        computed_as: >-
          the smallest |beta| the grid could have separated from 0 at the declared
          interval level, computed from the grid point count and the measured residual
          spread. Reported BESIDE beta_hat; a beta_hat without it is uninterpretable.
      - name: n_fp_agreement
        units: boolean per prime (exact integer equality)
        computed_as: >-
          curve-enumerated count of F_p-rational supersingular j-invariants equals the
          form-counted class number. POSITIVE CONTROL, forced true.
      - name: delta_one_locus_agreement
        units: boolean per prime (exact set equality)
        computed_as: >-
          the set of curves with delta = 1 equals the F_p-rational locus. POSITIVE
          CONTROL, forced true.
      - name: multiplicity_slope
        units: dimensionless exponent
        computed_as: >-
          least-squares slope of the mean number of admissible degrees per curve
          against log d, with a bootstrap interval. Forced value 0; a non-zero value
          makes beta_hat unidentifiable.
    secondary:
      - name: local_slopes
        units: dimensionless, one per interior grid point
        computed_as: d log r_p / d log d, by finite differences on the exact rationals.
      - name: max_delta
        units: integer degree
        computed_as: maximum over E in S_p of delta(E), per prime, against (p/2)^{1/3}.
      - name: rho_p_at_grid
        units: exact rational (count over count)
        computed_as: >-
          #{E : delta(E) <= Y} / #S_p at every grid Y, recorded as a rational and never
          as a float.
      - name: decoy_rate
        units: dimensionless ratio
        computed_as: >-
          accidental sigma-collisions in the matched random subset divided by structural
          collisions, against the forced expectation 12|ball|^2/p.
      - name: degree_ceiling_reached
        units: integer prime l
        computed_as: >-
          the largest isogeny degree prime the instrument used, per prime, with a
          binding/non-binding verdict against the d-grid maximum.
      - name: small_cm_counts
        units: integer
        computed_as: >-
          N_d contributions from j = 0 and j = 1728, reported separately under each
          weighting convention.
  heuristic_under_test:
    id: HEUR-WESO-ac6c87-1
    formal_statement: >-
      For all primes p in the declared ladder and all d in the declared grid with
      1 <= d <= (p/2)^{1/3}, N_d(p) = C_p * h(-4pd) * (1 + eps(p,d)) with C_p
      independent of d and |eps(p,d)| bounded independently of d; equivalently beta = 0
      in r_p(d) ~ d^beta.
    rigorous_ingredient: >-
      Siegel's theorem pins the class number's exponent at 1/2 + o(1) but is
      d-INDEPENDENT at fixed p and therefore cannot produce a slope; it fixes the
      intercept scale only. The d-dependence is entirely carried by the Eichler local
      factors, which are RECALLED and UNVERIFIED in this program.
    classical_distribution_theorem: >-
      None is used. This is an arithmetic incidence count, not a distributional claim,
      and no distribution theorem is interpolated.
    second_heuristic:
      id: HEUR-WESO-ac6c87-2
      formal_statement: >-
        The per-curve multiplicity - the number of admissible degrees d for a given
        curve - has no d-dependence over the declared grid.
      why_it_is_here: >-
        A d-dependent multiplicity is indistinguishable from a d-dependent local factor
        in r_p(d). It is measured, not assumed, and its failure makes the primary
        metric unidentifiable rather than negative.
  preregistered_prediction:
    quantity: >-
      beta_hat, the fitted slope of log(N_d(p)/h(-4pd)) against log d at the largest
      toy prime reached, and its consistency of sign across the ladder.
    formula: >-
      Under the hypothesis, beta = 0 exactly, so beta_hat lies in [-0.15, +0.15] with
      its bootstrap interval containing 0 at every prime. Under the alternative that
      the Eichler local factors carry a power of d, beta_hat is a non-zero constant
      with consistent sign, and the density exponent is a = 3/2 + beta rather than 3/2.
      The identity a = 3/2 + beta is derived symbolically at STAGE S0, before any fit.
    source: >-
      Derived in the parent proposal IDEA-20260805-07ff43, heuristic_assumptions HA-2
      ("If a local factor is d-DEPENDENT with a power of d in it, the exponent 3/2
      changes and the whole proposal changes with it. This is stated as a hazard, not
      as a caveat"), and pre-registered here before any run under this contract exists.
      Never tuned to data.
  scale_relevance:
    tier: toy
    justification: >-
      Executed at toy primes where S_p can be enumerated exhaustively and every
      quantity is an exact integer. THE SCALE LIMIT IS SEVERE AND IS STATED AS THE
      DOMINANT CONFOUNDER: at p ~ 10^4 the grid maximum (p/2)^{1/3} is about 17, so the
      d-grid spans barely one decade and only a coarse beta is resolvable. That is why
      resolvable_beta is a PRIMARY metric rather than a footnote. Access to larger scale
      is not available to this instrument, and no correspondence is claimed that would
      supply it.
    correspondence: null
    transfer_assumption: >-
      NONE IS OFFERED. No outcome here is extrapolated to cryptographic p. The identity
      a = 3/2 + beta is symbolic and holds at any scale; the MEASURED beta_hat is a toy
      quantity and is labelled as one everywhere it appears.
  tail_checks:
    - >-
      Report N_d in absolute integers at every grid point and refuse any grid point with
      fewer than 20 incident curves - a ratio formed from a near-empty count has an
      interval that swallows the whole admissible band.
    - >-
      Report the largest and smallest r_p(d) over the grid explicitly at every prime,
      since a single outlying d dominating a log-log fit is the ordinary way a spurious
      slope appears.
    - >-
      Report the local slope at every interior grid point and the spread of local
      slopes; require the spread to be smaller than the admissible band's width, or
      report "no single power law over this grid", which is itself an admissible
      pre-registered outcome.
    - >-
      Report the ratio computed under both weighting conventions side by side. A beta_hat
      that moves between conventions is a convention artifact and no arithmetic reading
      is licensed.
    - >-
      Report max_delta and the degree ceiling per prime explicitly, since a bound
      violation and a binding ceiling are the two failure modes most easily mistaken for
      findings.
  replication:
    seeds:
      - 20260825
      - 20260826
      - 20260827
    independent_instances: 4
    repeat_count: 3
    note: >-
      The enumeration itself is DETERMINISTIC - S_p and N_d are exact integers and do
      not vary with a seed. The seeds govern only the matched-random null arm and the
      bootstrap resampling. "independent_instances: 4" refers to the four primes of the
      ladder, which are the independent replicates available here; a fifth prime is
      worth more than a fourth seed, and the contract says so rather than pretending
      seed variation adds statistical power it does not add.
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4.0
    memory_gb: 8
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
    - >-
      Abort the run if either exact positive control fails at any prime.
    - >-
      Exclude and record any prime whose degree ceiling binds on the d-grid; do not
      report a fit that includes it.
    - >-
      Stop the ladder at the largest prime whose STAGE S3 terminates inside
      wall_clock_seconds_per_run on a pilot; a prime that times out is censored and its
      absence is recorded, never reported as a small N_d.
    - >-
      Stop at maximum_runs or total_cpu_hours, whichever binds first. Budget exhaustion
      is a stop, never a negative result (AGENTS.md rule 5).
    - >-
      The weighting convention, the d-grid, the ladder, the admissible band and the fit
      method are frozen at STAGE S0 and are not revised after any ratio is observed.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence (AGENTS.md
      rule 5).
    - >-
      A run in which N_d and h(-4pd) were produced by code paths sharing a helper is
      invalid_measurement: the disjointness is the whole reason the ratio means
      anything.
    - >-
      A run whose null arm or positive controls were not executed in the same invocation
      as the signal arm is invalid_measurement.
    - >-
      A run reporting rho_p or r_p as floats rather than exact rationals is
      invalid_measurement, since the primary quantity is an integer ratio and rounding
      at toy counts is not negligible.
    - >-
      A run whose parameters differ from the frozen contract is a DIFFERENT experiment
      and requires a new contract; it is never a repair of this one.
  success_criterion: >-
    Both exact positive controls pass at every included prime, the degree ceiling is
    recorded non-binding at every included prime, the matched-random null decays as
    forced, the multiplicity slope's interval contains 0, and the run reports beta_hat
    with a bootstrap interval and resolvable_beta at every included prime together with
    the full local-slope table. The hypothesis H-WESO-ac6c87 is SUPPORTED at toy scale
    if and only if resolvable_beta < 0.15 AND every beta_hat interval contains 0 AND
    the local-slope spread is below the admissible band's width.
  falsification_criterion:
    - >-
      beta_hat's bootstrap interval excludes 0 with a consistent sign across at least
      three included primes, controls passing, ceiling non-binding and multiplicity
      slope at 0. The local factors are d-dependent, the density exponent is 3/2 +
      beta_hat, and the measured beta is the recorded obstruction. Primary falsifier.
    - >-
      The multiplicity slope's interval excludes 0. beta_hat is confounded and reported
      as UNIDENTIFIABLE; no verdict on the local factors is licensed.
    - >-
      Either exact positive control fails. Nothing at all is reportable.
    - >-
      resolvable_beta exceeds 0.15 at every prime. The experiment cannot decide its own
      question at this ladder; report INCONCLUSIVE with the required grid size computed,
      not a verdict.
    - >-
      The local-slope spread exceeds the admissible band's width. There is no single
      power law over the grid; report that, which is a pre-registered admissible
      outcome, rather than a global fit that averages it away.
    - >-
      beta_hat moves outside the admissible band when the weighting convention is
      switched. The reading is a convention artifact and nothing arithmetic is licensed.
  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, resolved
      model/inference block and environment
    - >-
      raw-result.json carrying every per-prime, per-d integer count - N_d, h(-4pd),
      multiplicities, max_delta, degree ceiling reached - and not summaries
    - the null arm's and both positive controls' measurements, in the same file as the signal arm
    - the STAGE S0 symbolic derivation of a = 3/2 + beta, written before any run and hashed
    - the frozen weighting convention, d-grid, ladder and fit method, hashed before generation
    - the full local-slope table and the resolvable_beta computation
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      Coordinator drafting does not approve. This contract is review_required and is NOT
      approved; approved_by is null and execution_authorized is false. Approval is the
      user's gate because it authorizes execution and spends compute.
    - >-
      STAGE S0 is a zero-compute HARD GATE: the identity a = 3/2 + beta must be derived
      and hashed before any fit exists, because a beta whose meaning is fixed after the
      fit is not a measurement of anything.
    - >-
      The paired hypothesis is proof-oriented and carries a filled proof_search_map
      (KN-TECH-080); its observation-collision audit names three preimages of a non-zero
      slope, and the ceiling control and the multiplicity control are the separations it
      requires. Both are preconditions of approval, not optional arms.
  derivation_provenance:
    tool: coordinator-authored contract under /design-experiment
    source_record: IDEA-20260805-07ff43
    authored_at: '2026-08-25'
    note: >-
      Controls, forced values and the toy-scale confounder statement are taken from the
      parent proposal's minimal_test.controls, predictions and confounders. The isolation
      of HA-2 as the measured quantity, and the identity a = 3/2 + beta that makes it
      decidable, are derived from the parent's STEP 3 and its own hazard statement; they
      are not invented here. Budgets come from the parent's declared estimated_cost
      (implementation medium, compute low). A value the proposal did not supply is null
      or is assigned to STAGE S0.
  derivation_gaps:
    - >-
      The prime ladder is not numerically fixed here. It must be fixed at STAGE S0 by
      the termination criterion alone; choosing primes after seeing which ones make
      beta_hat look favourable is the single most likely way this contract would
      silently become a claim.
    - >-
      "Counted with the natural weights" is not resolved. Two reasonable conventions
      exist and both must be declared and run; the contract requires both because the
      choice cannot be made after seeing the ratio.
    - >-
      The method for deciding "an isogeny of degree EXACTLY d exists" is not fixed -
      walking l-isogeny graphs for composite d requires a convention about non-primitive
      degrees, and that convention interacts directly with the multiplicity count.
    - >-
      resolvable_beta's computation needs its statistical definition declared (which
      interval, at what level, from which residual model), since it is a PRIMARY metric
      and a self-serving definition of it would defeat the whole scale-honesty control.
