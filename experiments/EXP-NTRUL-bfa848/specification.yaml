experiment:
  id: EXP-NTRUL-bfa848
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-03a2f5; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-03a2f5
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute the per-key covolume-density advantage envelope for NTRU and two matched control
    lattices, locate its rank-jump abscissa in log q, and compare the three distributions without
    running any lattice reduction
  objective: 'The single uncertainty a run reduces is whether a zero-reduction comparator can locate
    anything about the overstretched transition, and whether what it locates is attributable to ring
    structure. Stated as parts: (i) does the upper envelope of the n affine advantage functions have
    the single-crossing form the proposal asserts, for what fraction of sampled keys, and how wide
    is the crossing abscissa''s distribution at fixed (n, ring, secret distribution); (ii) does the
    independent-plant control NULL-2, matched on dimension, determinant, modulus, planted rank and
    per-vector norm, produce the same crossing distribution, in which case the comparator measures
    planted rank rather than ring structure and the honest record is a controlled null; (iii) does
    the crossing abscissa carry any association with observed recovery frequency in the small toy
    window where recovery is affordable, measured as a rank correlation with a pre-registered sign,
    not as a fitted law. The run is designed so that (i) and (ii) complete regardless of what (iii)
    does, because (iii) is the part most likely to fail and the least informative when it does. A
    negative (iii) with a positive (i) and a separating (ii) is a complete and usable outcome: it
    would say the covolume envelope is a real, cheap, ring-sensitive object that nonetheless does
    not predict reduction behaviour, which is exactly the kind of measured obstruction docs/inventor-protocol.md
    section 4 asks a closure to carry.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: at n in the tested set, in
      the tested rings, under the tested secret distributions, the covolume-advantage envelope crosses
      once for X percent of keys, its crossing abscissa has median M and IQR W in log2 q, and the
      matched independent-plant control''s distribution is displaced by D with the stated confidence
      interval; and, if the toy recovery arm ran, that the rank correlation between recovery frequency
      and sign(q - q_jump) is r with its CI. What does NOT follow: nothing about any parameter set
      outside the tested (n, q, ring, distribution) grid, nothing about the cost of any attack, nothing
      about the safety or unsafety of sntrup761, ntruhps or any other deployed parameter set, and
      nothing about what any published fatigue law states or where it sits.'
  inputs:
    procedure: 'STAGE 0, cost minutes: implement exact integer Gram and Bareiss minors, plus an independent
      modular-CRT determinant checker; verify agreement on 50 random matrices. STAGE 1, cost minutes:
      implement the three instance generators (NTRU in Z[x]/(x^n - 1), NULL-1 unplanted q-ary, NULL-2
      independent-plant) behind one interface, and a matching assertion that fails the run if dimension,
      determinant, planted rank or per-vector Frobenius norm differ across arms beyond the declared
      tolerance. STAGE 2, cost tens of minutes: sample 200 keys per arm per n in {16, 24, 32, 48},
      compute the n intercepts per key, solve the envelope in closed form, record k*(q) and q_jump.
      STAGE 3, cost minutes: bootstrap medians and IQRs, compute the NTRU-versus-NULL-2 displacement
      with CI. STAGE 4, cost minutes: sub-orbit selection control, 1000 random k-subsets on 20 keys
      per n. STAGE 5, cost hours and bounded, optional and reported separately: at n = 16 only, run
      LLL-only and BKZ at small block size at five moduli straddling the median q_jump, 20 instances
      per cell, recording recovery with a certificate that re-verifies the recovered pair independently,
      and a non-recovery as non-recovery rather than as evidence of anything. STAGE 5 is budget-capped
      and its exhaustion is recorded as a budget outcome under AGENTS.md rule 3.'
    instrument: 'Pure Python 3 with integer arithmetic only for STAGES 0-4: no floating point in the
      primary quantity except the final log conversions, which are done in Decimal at 50 digits. Instance
      generation and the matching assertion live in a new module under harness/. Run wrapping, manifests
      and the certificate re-verification path use harness/runner.py as it stands. STAGE 5 needs a
      reduction implementation; the honest position is that fpylll is not known to be present in this
      environment, so the contract permits either fpylll if the Coordinator confirms availability
      or an exact-integer LLL in harness/ with its own known-answer control, and requires the choice
      to be recorded in the manifest. No Sage. tools/sage_free_estimator/ is available as the precedent
      for how a shim is held to a known-answer control before it is trusted.'
    parameters: 'n in {16, 24, 32, 48} for STAGES 2-4; n = 16 only for STAGE 5. Ring Z[x]/(x^n - 1)
      for the primary sweep. q on a log2 grid from 2^6 to 2^24 in steps of 0.25 in log2. Secret distribution:
      ternary fixed weight with weight 2n/3 rounded, and as a secondary arm ternary uniform. 200 keys
      per (arm, n) cell for STAGES 2-3, giving 2400 instances per arm; 20 keys per n for STAGE 4 with
      1000 subsets each; STAGE 5 uses 5 moduli x 20 instances x 3 arms = 300 bounded reduction runs
      at n = 16.'
  controls:
  - NULL-1 unplanted matched q-ary lattice, identical dimension, determinant and modulus.
  - NULL-2 independent-plant matched lattice, additionally matched on planted rank and per-vector
    Frobenius norm, isolating ring structure as the sole difference.
  - 'Sub-orbit selection control: consecutive-rotation choice versus 1000 random k-subsets, run on
    the same keys.'
  - 'Arithmetic control: recompute 20 randomly chosen covolumes with an independent determinant routine
    (fraction-free versus modular CRT) and require exact agreement, so the primary quantity is not
    a floating-point artifact.'
  - 'Degenerate-key control: keys with non-invertible f mod q are recorded and excluded by a rule
    fixed before the sweep, not after.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both computed by the identical A(k) code path in the same
    invocation. NULL-1, unplanted: a q-ary lattice Lambda_H from a uniform random n x n matrix H mod
    q, same dimension 2n, same determinant q^n, with L_k generated by k vectors drawn from the same
    distribution as the secret and force-embedded by construction of H. NULL-2, independent-plant:
    the same construction but with n planted vectors that are independent samples of the secret distribution
    rather than rotations of one, matching dimension, determinant, planted rank and per-vector norm
    exactly, so the sole difference is ring structure. For the signal arm to mean anything about NTRU
    rather than about planted rank, NULL-2 must produce either no envelope crossing in the swept range
    or a crossing displaced from the NTRU one by more than the per-key interquartile range. If NULL-2
    crosses at the same place, the correct record is a controlled null: the locator measures planted
    rank, not the ring.'
  independent_variables:
  - log2 q on the grid
  - arm in {NTRU, NULL-1, NULL-2}
  - n in {16, 24, 32, 48}
  - secret distribution in {ternary fixed weight, ternary uniform}
  metrics:
    primary:
    - fraction of keys with exactly one envelope crossing
    - median q_jump in log2 q per arm and n
    - interquartile range of q_jump per arm and n
    - NTRU minus NULL-2 median displacement with bootstrap CI
    - k* at the crossing (the rank the argmax jumps to)
    secondary:
    - median q_jump shift under random k-subset selection
    - count of excluded degenerate keys per cell
    - wall-clock per key for the envelope computation
    - STAGE 5 recovery frequency per cell with certificate status
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The crossing abscissa q_jump per key, and the displacement of its median between the
      NTRU arm and the independent-plant control NULL-2.
    formula: 'q_jump = exp( (2/(k2 - k1)) * (log covol(L_{k2}) - log covol(L_{k1})) ) where k1 = 1,
      k2 = argmax over k > 1 of the envelope immediately above the crossing, covol(L_k) = sqrt(det(B_k
      B_k^T)) with B_k the k x 2n integer matrix of the first k rotations of (f,g). Predicted: single
      crossing for at least 90 percent of keys, and |median log2 q_jump(NTRU) - median log2 q_jump(NULL-2)|
      >= 0.5.'
    source: Pre-registered in the parent proposal IDEA-20260816-03a2f5 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Tested at n in {16, 24, 32, 48}, dimensions 32 to 96, with moduli up to 2^24; STAGE
      5 reduction only at n = 16. No extrapolation to deployed n is performed and none is admissible
      from this contract. The only transfer assumption made anywhere is inside STAGE 5's association
      test, which is scoped to n = 16 and is reported as such; the STAGE 2-4 result is a statement
      about the tested grid with no extrapolation assumption at all.
    correspondence: null
  tail_checks:
  - Behaviour at the smallest and largest q on the grid, where the envelope may be flat and the crossing
    undefined; these cells must be reported, not dropped.
  - Keys with f non-invertible mod q, counted and excluded by the pre-registered rule with the count
    published.
  - Keys whose secret has unusually small norm in the tail of the fixed-weight distribution, checked
    separately for whether they dominate the q_jump spread.
  - n = 48 exact-arithmetic cost, checked for integer blow-up in the Bareiss pass before the full
    sweep is launched.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - STAGE 5 stops at its wall-clock cap per cell; exhaustion is recorded as a budget outcome and never
    as evidence about security.
  - The run aborts if the matching assertion between arms fails, because an unmatched control makes
    the whole comparison meaningless.
  - The run aborts if the independent determinant checker disagrees with Bareiss on any instance.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The envelope has exactly one crossing for at least 90 percent of keys in every
    (arm, n) cell, the matching assertion passes, and the NTRU-versus-NULL-2 median displacement is
    reported with a bootstrap CI that either excludes or includes zero, either of which is a complete
    result.
  falsification_criterion:
  - Fewer than 90 percent single crossings, falsifying the single-jump form.
  - NTRU and NULL-2 distributions overlapping within the pooled IQR, recording a controlled null against
    ring attribution.
  - Median q_jump moving by more than one grid step under sub-orbit reselection, falsifying the cheap
    canonical choice.
  - Any determinant disagreement, which makes the run an invalid measurement rather than a negative
    result.
  - In STAGE 5, a rank correlation between recovery frequency and sign(q - q_jump) whose CI contains
    zero, falsifying the predictive claim within the n = 16 scope only.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-03a2f5
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The balanced-covolume baseline det(Lambda)^{k/2n} needs an explicit derivation or an explicit
    demotion to a stated heuristic before approval; the whole q_jump scale depends on it.
  - 'The construction of NULL-2 must be pinned down: exactly how n independent short vectors are embedded
    in a q-ary lattice of determinant q^n without changing the determinant, and what tolerance counts
    as matched.'
  - Availability of a reduction implementation for STAGE 5 is unresolved in this environment and the
    Coordinator must fix the choice and its known-answer control before authorizing that stage.
  - The exclusion rule for non-invertible f must be written down before any sweep runs.
