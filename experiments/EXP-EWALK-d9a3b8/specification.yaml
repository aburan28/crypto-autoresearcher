experiment:
  id: EXP-EWALK-d9a3b8
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-15b468
  question_id: RQ-EWALK-8fa147
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE DISTINGUISHED-POINT PREDICATE IS NOT INVARIANT UNDER CANONICALISATION AND NOBODY HAS
    CHARGED IT: the canonical representative''s x-coordinate is a MINIMUM over an orbit of size |Aut|/2
    in x, so a top-d-bits predicate fires at about (|Aut|/2)*2^-d instead of 2^-d -- exactly 1x, 2x,
    3x at |Aut| = 2, 4, 6 -- which means a quotient walk and an unquotiented walk compared at the
    same nominal d are sitting at DIFFERENT points of the van Oorschot-Wiener memory/steps tradeoff
    and the comparison is confounded by a factor nobody in this program has written down; the fix
    is a predicate on an ORBIT INVARIANT (x^2 at j = 1728, x^3 at j = 0) costing 1-2 field multiplications,
    and the two designs make opposite, testable predictions'
  status: draft
  objective: "(A) THE SOUNDNESS CONSTRAINT, FIRST, BECAUSE IT IS THE ONE THAT CANNOT BE TRADED. Van\
    \ Oorschot-Wiener parallel collision search works because two walks that ever meet stay merged\
    \ and both subsequently report the SAME distinguished point, so a shared DP entry is a genuine\
    \ collision (KN-TECH-006). On a quotient walk the state is a CLASS, so the DP predicate must be\
    \ a FUNCTION OF THE CLASS: constant on Aut-orbits. A predicate evaluated on an arbitrary orbit\
    \ representative is not, and two processors holding different representatives of the same class\
    \ would disagree about distinguishedness -- silently losing collisions rather than producing wrong\
    \ ones, which is the worst failure mode because it looks like bad luck. There are exactly two\
    \ ways to satisfy the constraint and they have different costs and different statistics:\n  (D1)\
    \ EVALUATE ON THE CANONICAL REPRESENTATIVE. Invariant by construction,\n    because canon is constant\
    \ on orbits. Free, given that canon is computed\n    anyway.\n  (D2) EVALUATE ON AN ORBIT INVARIANT.\
    \ A function f with f(sigma A) = f(A)\n    for all sigma in Aut, evaluated directly. Costs a few\
    \ field\n    multiplications.\n\n(B) THE STATISTICAL DEFECT OF (D1), DERIVED EXACTLY. Aut acts\
    \ on the x-coordinate with orbits of size |Aut|/2, because the subgroup {+-1} acts trivially on\
    \ x:\n  |Aut| = 2 (generic):  x-orbit {x},               size 1;\n  |Aut| = 4 (j = 1728): x-orbit\
    \ {x, -x},           size 2;\n  |Aut| = 6 (j = 0):    x-orbit {x, zeta*x, zeta^2*x}, size 3, zeta\
    \ a\n    primitive cube root of unity in F_p (requires p = 1 mod 3).\ncanon selects the MINIMUM\
    \ of the orbit under the encoding's total order. Modelling the k = |Aut|/2 orbit elements as k\
    \ independent uniform draws from [0, p) -- which is the same random-encoding model the DP predicate\
    \ already relies on -- the minimum has\n  P(min < p/2^d) = 1 - (1 - 2^-d)^k = k*2^-d - O(k^2 *\
    \ 4^-d).\nSo THE DP RATE IS INFLATED BY EXACTLY k = |Aut|/2: a factor 1 at generic curves, 2 at\
    \ j = 1728, 3 at j = 0. Equivalently, the EFFECTIVE granularity is d - log2(k), and a designer\
    \ who sets d expecting a 2^-d rate gets k*2^-d.\n(C) WHY THAT MATTERS, AND IT IS NOT (ONLY) A\
    \ MEMORY COMPLAINT. In the van Oorschot-Wiener model d is the memory/steps knob: raising the DP\
    \ rate stores more points (more memory, more central traffic) and shortens the average trail (less\
    \ work discarded per trail, faster collision detection). Neither direction is automatically better\
    \ -- d has an optimum. THE DEFECT IS THEREFORE NOT THAT THE QUOTIENT WALK IS SLOWER; IT IS THAT\
    \ A COMPARISON AT FIXED NOMINAL d IS NOT A MATCHED COMPARISON. The quotient arm sits at effective\
    \ granularity d - log2(k) and the unquotiented arm at d, so any measured gain or loss at fixed\
    \ d contains an uncontrolled tradeoff-surface displacement of factor k. At j = 0 that displacement\
    \ is a factor 3 in DP rate, against a total prize for the entire lane of sqrt(3) = 1.732 (IDEA-20260807-ebcae6).\
    \ THE CONFOUND IS THE SAME ORDER AS THE EFFECT. Every L6 measurement that compares arms at fixed\
    \ d is affected, including IDEA-20260807-6355c6, -59f5b7, -59fed3 and the enumeration instrument\
    \ -cbbcfd, and this record exists to supply them a correction they can apply.\n(D) THE FIX, AND\
    \ ITS PRICE. (D2) evaluates the predicate on an orbit invariant. The natural choices are exactly\
    \ the elementary invariants of the cyclic x-action:\n  j = 1728: f(x) = x^2, invariant under x\
    \ -> -x. Cost 1 field\n    multiplication (one squaring).\n  j = 0:    f(x) = x^3, invariant under\
    \ x -> zeta*x since zeta^3 = 1. Cost\n    2 field multiplications.\n  generic:  f(x) = x, already\
    \ invariant. Cost 0.\nThe image of f is the set of squares (resp. cubes) in F_p, which is equidistributed\
    \ in [0, p) to within the standard character-sum bound, so a top-d-bits predicate on f(x) fires\
    \ at about 2^-d with NO inflation. So (D2) restores the intended granularity for 1-2 field multiplications\
    \ per step against a Jacobian step of about 11-16 -- roughly a 6-18 percent per-step charge. NOTE\
    \ THE STRUCTURE OF THE TRADE, WHICH IS THE INTERESTING PART: (D1) is free and mis-calibrated;\
    \ (D2) costs arithmetic and is calibrated. Neither dominates, and which wins depends on where\
    \ the optimum d sits, which is measurable.\n(E) THE THIRD DESIGN, INCLUDED BECAUSE IT MAKES THE\
    \ COMPARISON THREE-CORNERED RATHER THAN BINARY. (D3) EVALUATE ON THE CANONICAL REPRESENTATIVE\
    \ BUT CORRECT d. Use (D1) and set d' = d + log2(k), i.e. d' = d + 1 at j = 1728 and d' = d + log2(3)\
    \ = d + 1.585 (rounded, with the rounding disclosed) at j = 0. Free, calibrated, and coarser than\
    \ the nominal granularity by a non-integer amount at j = 0 -- which is precisely why it is worth\
    \ measuring rather than assuming: a predicate cannot be tuned to a fractional bit, so (D3) can\
    \ only bracket the intended rate, while (D2) hits it.\n(F) THE PREDICTIONS DISCRIMINATE, WHICH\
    \ IS WHAT MAKES THIS AN EXPERIMENT.\n  OUTCOME 1 -- the measured DP rate under (D1) is k*2^-d\
    \ within a few\n    percent at k = 2 and 3. The derivation holds, every fixed-d comparison\n \
    \   in the lane needs the stated correction, and the correction is\n    published as a number.\n\
    \  OUTCOME 2 -- the measured rate is NOT k*2^-d. Then the orbit elements'\n    encodings are not\
    \ behaving like independent uniform draws -- for\n    instance because zeta*x and x are strongly\
    \ correlated in the integer\n    encoding for the particular zeta -- and that correlation is itself\
    \ a\n    structural property of the encoding worth recording, since it bears on\n    every random-encoding\
    \ assumption the DP machinery makes.\n  OUTCOME 3 -- (D2) does not restore a 2^-d rate. Then the\
    \ cubes (or\n    squares) are not equidistributed enough at toy p for the character-sum\n    bound\
    \ to bite, which is a scale artifact and must be reported as one\n    rather than as a property\
    \ of the design."
  resource_label: R3 (End(E) as a ring -- its unit group Aut, whose action on the x-coordinate has
    orbits of size |Aut|/2) with R1 entering only as the ENCODING the distinguished-point predicate
    reads. R1 is not used to derive any relation and no field-arithmetic structure beyond "x is an
    integer that can be compared" is exploited.
  admissibility: inadmissible_generic_group
  admissibility_argument: 'INADMISSIBLE, AND THE R1 COMPONENT DOES NOT RESCUE IT. A distinguished-point
    predicate is a function of the group element''s ENCODING, and the generic group model gives the
    algorithm exactly that: Shoup''s model supplies random labels and permits any predicate on them,
    which is why van Oorschot-Wiener parallel collision search is itself a generic algorithm and is
    subject to the Omega(sqrt(N)) bound (KN-TECH-005). Reading x as a field element to compute x^2
    or x^3 does not change this, because the predicate''s output is used only to decide storage, never
    to derive a congruence -- so a generic simulator with the same random labelling reproduces it.
    Combined with Oracle D closure for the automorphism applications themselves (KN-FIND-b7e091, H-ENDO-001),
    the whole construction is generic-group simulable and closed at exponent 1/2. Filed as a recorded
    closure carrying a measurable calibration correction, which is the lane''s stated deliverable
    shape.'
  reachability_gate: DOES NOT MOVE BETWEEN CURVES. The effect exists only at |Aut| > 2, i.e. D_0 in
    {-3, -4}, which by T4 is fixed by the isogeny class and cannot be reached from a class that lacks
    it at any cost. The correction is therefore relevant only to measurements the campaign CONSTRUCTS
    on j = 0 and j = 1728 curves, and it is exactly those measurements (IDEA-20260807-6355c6, -cbbcfd)
    that it protects. For any target with generic D_0 the correction is identically 1 and this record
    is a no-op -- which is also its own zero-effect null control, an unusual and welcome coincidence
    between the reachability structure and the experimental design.
  inputs:
    procedure: 'STAGE 0 (zero compute): derivation, the four-design enumeration, the |Aut| = 2 zero-effect
      prediction. STAGE 1 (minutes, HARD GATE): invariance unit test over 10^4 points per design per
      family; unsound designs excluded. STAGE 2 (minutes): EXHAUSTIVE DP-rate measurement over the
      entire class set on one curve of each family at 14-18 bits, for d in {6, 8, 10, 12}, designs
      D1/D2/D3/D4 plus the random-predicate null. THIS IS THE WHOLE DECISIVE MEASUREMENT AND IT COSTS
      MINUTES -- no walks are run, only a Boolean function is evaluated on every class. STAGE 3 (hours,
      optional): the walk-level consequence, matched-nominal versus matched-effective d. STAGE 4 (hours,
      optional): the optimum-d sweep and the design ranking. THE CHEAPEST KILL IS STAGE 2 ON THE GENERIC
      CURVE: if an inflation appears where the derivation predicts exactly none, the measurement is
      wrong and nothing else is worth running.'
    mechanism: 'STAGE 0 (zero compute). Write the invariance requirement and the exact inflation derivation;
      enumerate the four designs (D1 free/mis-calibrated, D2 invariant/charged, D3 corrected-d/free/fractional-bit,
      and D4 hash-canon/no-inflation) and state which of them the experiment measures. Note explicitly
      that at |Aut| = 2 all designs coincide in x and the effect is exactly zero -- so the generic-curve
      case predicts NO effect, which is the cheapest available check that the derivation is not producing
      an effect out of nothing.

      STAGE 1 (minutes, HARD GATE). Unit-test invariance: for each design and each curve family, verify
      over at least 10^4 random points that all |Aut| orbit elements produce the same predicate value.
      A design failing this is not merely suboptimal, it is UNSOUND for parallel merging and is excluded
      before measurement.

      STAGE 2 (minutes). Measure the DP firing rate directly by exhaustive evaluation over the whole
      class set at toy size -- no sampling needed, since the class set is enumerable (this is the
      instrument of IDEA-20260807-cbbcfd applied to a Boolean function instead of a graph). Report
      the rate for each design at d in {4, 6, 8, 10, 12} on GEN, J1728 and J0, against the derived
      predictions k*2^-d for (D1) and 2^-d for (D2). PRE-REGISTERED: the (D1)/(D2) rate ratio equals
      |Aut|/2 = 1, 2, 3.

      STAGE 3 (hours). Measure the CONSEQUENCE: full quotient-walk runs at matched EFFECTIVE granularity
      rather than matched nominal d, and the same runs at matched nominal d, reporting how much the
      measured net gain moves between the two conventions. That difference is the size of the confound
      and is the number other L6 records need.

      STAGE 4 (hours). Locate the optimum d for each design by sweeping, and report whether (D2)''s
      1-2 extra field multiplications are repaid by operating at the intended granularity. This is
      the only part where the designs can genuinely be ranked, and the ranking is expected to be close.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - generic curve (|Aut| = 2), where the predicted effect is exactly zero (blocking)
  - random-predicate null on the canonical encoding, rate must be 2^-d (blocking)
  - invariance unit test over all orbit elements (blocking)
  - exhaustive rather than sampled rate measurement, so there is no sampling error to argue about
  - design D4 (hash-based canon), which the derivation predicts has no inflation, as a second zero-effect
    control
  - 'NULL OBJECT (from the proposal): MANDATORY, AND THIS PROPOSAL''S NULL IS UNUSUALLY CLEAN BECAUSE
    THE DERIVATION PREDICTS A ZERO. THE MATCHED NULL IS THE GENERIC CURVE: |Aut| = 2, x-orbit of size
    1, derived inflation factor EXACTLY 1. So the identical measurement on GEN must show NO difference
    between (D1) and (D2) -- an instrument that reports an inflation on a generic curve is manufacturing
    the effect. THE DECAY PARAMETER IS |Aut|/2: the measured (D1)/(D2) rate ratio must be 1, 2, 3
    as |Aut| goes 2, 4, 6, and a ratio that does not track it is the artifact tell. SECOND NULL: a
    RANDOM PREDICATE -- a keyed hash of the canonical encoding thresholded at rate 2^-d -- which is
    invariant by construction and has no minimum structure, so it must show rate exactly 2^-d on all
    three families. That null separates "the predicate reads a minimum" from "the predicate reads
    a canonicalised encoding", which are the two candidate explanations for any inflation observed.'
  independent_variables: []
  metrics:
    primary:
    - DP firing rate per (design, d, family), measured exhaustively over the class set, with the exact
      count reported alongside the rate
    - the derived prediction beside every measured rate, in a measured-versus-modeled table with the
      columns never mixed
    - per-step cost of each predicate in F_p multiplications
    - joint distribution of (predicate value, orbit position)
    secondary:
    - '|Aut| verified per curve, x-orbit size verified per curve'
    - class-set size M verified against (N-1)/|Aut| + 1
  heuristic_under_test: null
  preregistered_prediction:
    quantity: ratio of the (D1) DP firing rate to the (D2) rate, at matched nominal d
    formula: EXACTLY |Aut|/2 = 1.0 / 2.0 / 3.0 at |Aut| = 2 / 4 / 6, within 10 percent, at every tested
      d in {6, 8, 10, 12}. The |Aut| = 2 cell must show 1.0 within measurement precision; a deviation
      there falsifies the instrument rather than the derivation.
    source: pre-registered in IDEA-20260807-15b468 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - TOTAL-ORDER CHOICE. "Minimum of the orbit" depends on the encoding's order. A different order
    (e.g. comparing a hash rather than the integer) changes or removes the inflation; design D4 exists
    to measure exactly that, and any reported inflation must name the order it used.
  - SMALL-d SATURATION. At d = 4 and k = 3 the approximation k*2^-d has a correction of order k^2*4^-d
    that is not negligible; the exact formula 1-(1-2^-d)^k must be used and the approximation reported
    separately.
  - TOY-p EQUIDISTRIBUTION. The squares/cubes equidistribution argument is asymptotic; at 14-18 bits
    the error term may dominate. Multiple sizes and an explicit report of the deviation.
  - CLASS COUNTING IN x. If classes are identified by x rather than by points, |Aut| = 4 collapses
    to orbit size 2 and the j = 1728 arm measures the generic answer.
  - CONFLATING RATE WITH COST. A higher DP rate is not automatically worse; it is a different point
    on the tradeoff surface. The record must never report the inflation as a slowdown, only as a mis-calibration.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY |Aut|/2 = 1.0 / 2.0 / 3.0 at |Aut| = 2 / 4 / 6, within 10 percent, at
    every tested d in {6, 8, 10, 12}. The |Aut| = 2 cell must show 1.0 within measurement precision;
    a deviation there falsifies the instrument rather than the derivation.
  falsification_criterion:
  - An inflation is measured on the generic curve, where the derivation predicts exactly 1.0. Instrument
    failure; nothing else is reported.
  - The (D1)/(D2) ratio is not |Aut|/2 within 10 percent at |Aut| = 4 or 6. The independent-uniform-encoding
    model for orbit elements is wrong (Outcome 2); report the measured ratio and the empirical joint
    distribution as the finding, since a correlation between x and zeta*x in the integer encoding
    would bear on every random-encoding assumption in the DP machinery.
  - A design fails the invariance unit test. It is UNSOUND for parallel merging and is excluded; if
    that design is one currently used anywhere, that is a defect report and takes precedence over
    everything else here.
  - (D2) does not achieve a 2^-d rate. Outcome 3, a toy-scale equidistribution artifact, reported
    as such.
  - The walk-level confound (Stage 3) is zero at |Aut| = 6. The tradeoff surface is flat over a factor
    3 in DP rate; a real finding about the van Oorschot-Wiener optimum and a reason to stop worrying
    about the correction.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-15b468
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
