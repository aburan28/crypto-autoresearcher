experiment:
  id: EXP-FRODOFO-c7b77b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-583998; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-583998
  question_id: RQ-FRODO-a2dbe2
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: 'Exponent-vector extraction from term-list security bounds: validation of the linear-functional
    gap identity on known pairs, and measurement of exponent recovery versus numeric-figure recovery
    under a synthetic extraction-damage model.'
  objective: 'One uncertainty is reduced: whether a model gap between two written bounds is faithfully
    and robustly carried by an exponent difference vector. (i) IS THE IDENTITY EXACT. On hand-built
    pairs where one term dominates in both models, does the inner product of d with the log-inputs
    plus the leading-constant log-difference reproduce direct numeric evaluation of the bit difference,
    to within interval width, at every grid point where the dominating terms agree? And how large
    is the region where they do not agree, on which the identity has no domain? (ii) IS d ROBUST WHERE
    A FIGURE IS NOT. Under a synthetic corruption model applied to a rendered text of each bound at
    0, 5, 10 and 20 percent character corruption with fifty seeds each, how do the recovery-rate curves
    for d and for the printed figure compare? This is the claim that would make d worth extracting
    from a damaged specification, and RQ-FRODO-3260cc.provenance records that damaged extraction is
    the operative condition in this lane. (iii) IS d STRUCTURED. Against independently drawn random
    pairs, is the real difference vector distinguishable in sparsity and coordinate concentration,
    or does it look like noise? The run uses no primary source and asserts nothing about FrodoKEM
    or about any published analysis.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: for the four hand-built bound
      pairs used, the frozen evaluation grid, and the specific synthetic corruption model at the stated
      rates and seeds, the linear-functional identity reproduced direct evaluation to the stated tolerance
      on the stated fraction of the grid, and the measured recovery curves for exponent vectors and
      numeric figures were as reported. WHAT DOES NOT FOLLOW: nothing about FrodoKEM, nothing about
      any real ROM or QROM analysis, nothing about what any published document contains, no bit-security
      movement for any scheme, and no security consequence of any kind. Robustness measured against
      a synthetic corruption model does not establish robustness against real PDF extraction, and
      no claim to that effect may be made from this run.'
  inputs:
    procedure: 'STAGE 0, build the term-list representation, the exponent-vector extractor with explicit
      maximum and square-root detection, and the interval evaluator. Cost: implementation. STAGE 1,
      gate on known pairs: four hand-built pairs with d known by construction; the extractor must
      return them exactly. A failure halts the run. Cost: seconds. STAGE 2, identity check: evaluate
      the linear functional and direct numeric evaluation across the frozen grid, report agreement
      where dominating terms agree and report the disagreement region size. Cost: minutes. STAGE 3,
      identical-bound control, d must be exactly zero. Cost: seconds. STAGE 4, null: two hundred independently
      drawn random pairs over the same exponent lattice and constant span, disjoint seed stream, identical
      pipeline. Cost: minutes. STAGE 5, corruption ladder: render each bound to text, corrupt numeric
      characters at 0, 5, 10, 20 percent with fifty seeds per rate, attempt recovery of both d and
      the figure, record curves. Cost: under one CPU-hour. STAGE 6, immutable run records through
      harness/runner.py with seeds, grid, corruption model and resolved inference block.'
    instrument: 'Python 3 standard library: fractions.Fraction for exact rational exponents including
      half-integers, decimal.Decimal with explicit rounding contexts for two-sided interval evaluation,
      re for the deliberately simple recovery parser, random.Random with recorded disjoint seed streams
      for the corruption model and the null generator. No Sage, no external computer-algebra system,
      no lattice estimator, no PDF tooling, since the corruption model is applied to text this experiment
      renders itself. Run manifests and the resolved inference block via harness/runner.py; ids via
      tools/allocate_id.py.'
    parameters: 'Four hand-built bound pairs, each 3 to 6 terms over 6 variables, exponents drawn
      from the half-integer lattice between minus two and plus three, leading constants spanning 2^0
      to 2^60. Frozen evaluation grid: 6 axes, 33 log-spaced points per axis on the three most significant
      axes and 5 on the rest, spanning 60 binary orders of magnitude. Null: 200 independently drawn
      pairs, seeds 1001 through 1200. Corruption ladder: rates 0, 0.05, 0.10, 0.20, 50 seeds per rate
      per bound. Decimal precision 60 digits. Interval-width tolerance for the identity check frozen
      at 2^-20 bits.'
  controls:
  - Identical-bound pair control, for which d must be exactly the zero vector.
  - Independently drawn random bound pairs as the null, run in the same invocation with disjoint seeds.
  - Zero-corruption arm, establishing the ceiling recovery rate for both d and the figure.
  - Known-d matched pairs, which gate the extractor before any other arm is reported.
  - 'Dominating-term consistency check: report the fraction of grid points where the two models''
    dominating terms differ, since the linear-functional identity is only valid where they agree.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Pairs of INDEPENDENTLY drawn random bounds, with exponents from the
    same integer range and constants from the same log span, run through the identical extraction
    and identical functional evaluation in the same invocation. For such a pair d carries no information
    about any model gap, so the null establishes the distribution of d entries and of the resulting
    bit movement that arises from nothing at all. The signal arm means something only if the real
    d is separated from that distribution, for example by having small-magnitude entries concentrated
    on one or two coordinates, whereas the null d should have entries spread across all six with magnitude
    set by the sampling range. A second null uses two transcriptions of the SAME bound, for which
    d must be exactly the zero vector; a nonzero d there is a pipeline bug and halts everything.'
  independent_variables:
  - 'pair type: known-d matched, identical-bound control, independently drawn random null'
  - 'numeric-character corruption rate: 0, 0.05, 0.10, 0.20'
  - 'recovery target: exponent vector or printed numeric figure'
  - grid axis resolution
  - corruption seed index
  metrics:
    primary:
    - entrywise difference vector d per pair
    - number of nonzero coordinates of d
    - recovery rate of d as a function of corruption rate
    - recovery rate of the numeric figure as a function of corruption rate
    - maximum absolute discrepancy between the linear functional and direct evaluation over the agreeing
      region
    secondary:
    - fraction of grid points where the two models' dominating terms differ
    - interval width distribution over the grid
    - count of terms rejected as non-monomial (maxima, sums under roots)
    - wall-clock per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The separation between the exponent-vector recovery curve and the numeric-figure recovery
      curve under corruption, and the maximum discrepancy of the linear-functional identity on the
      agreeing region.
    formula: 'Predicted before the run: on the agreeing region, bit-difference equals the inner product
      of d with the vector of base-two logs of the inputs plus (log2 c_QROM minus log2 c_ROM), with
      maximum absolute discrepancy at most 2^-20 bits; at 10 percent numeric-character corruption,
      exponent-vector recovery rate at least 0.8 and numeric-figure recovery rate at most 0.3, where
      recovery means exact reconstruction of every coordinate or of every digit respectively; identical-bound
      control returns d exactly zero; median nonzero-coordinate count at least 5 on the random null.'
    source: Pre-registered in the parent proposal IDEA-20260816-583998 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested on four synthetic 3-to-6-term bounds over 6 variables with a self-authored
      corruption model. This is not FrodoKEM and is not any real analysis: no ROM or QROM transcription
      for this transform exists in the corpus, and RQ-FRODO-a2dbe2 constraint 1 forbids designing
      against one. TRANSFER ASSUMPTION, stated plainly and not assumed benign: results transfer to
      real transcriptions only insofar as real bounds are also small sums of monomials in the same
      six inputs, which they may not be, and only insofar as real extraction damage resembles uniform
      numeric-character corruption, which it almost certainly does not. The recovery-rate curves are
      therefore properties of the model and are quotable only with it.'
    correspondence: null
  tail_checks:
  - Report the count of terms rejected as non-monomial, since a high count means the object barely
    applies even to the synthetic bounds.
  - Report the largest interval width on the grid and confirm the identity tolerance exceeds it, otherwise
    the identity check is measuring precision.
  - Report the worst-case rather than mean recovery rate over corruption seeds, since a mean can hide
    a mode where recovery fails entirely.
  - Report the 5th and 95th percentile of the null nonzero-coordinate count, not only the median.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report if the known-pair extractor gate fails.
  - Halt and report if the identical-bound control returns a nonzero d.
  - Cap total wall clock at two CPU-hours; a cap hit is an infrastructure outcome and is never negative
    mathematical evidence.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The extractor reproduces all four known difference vectors exactly, the identical-bound
    control returns zero, the linear-functional identity holds within the frozen tolerance across
    the agreeing region, and the exponent-recovery curve is separated from the figure-recovery curve
    by at least the pre-registered margin at 10 percent corruption.
  falsification_criterion:
  - The linear-functional identity fails beyond tolerance on the agreeing region.
  - The identical-bound control returns a nonzero difference vector.
  - Exponent recovery is not separated from figure recovery at the pre-registered margin.
  - Random independent pairs are indistinguishable from matched pairs in nonzero-coordinate count.
  - More than a stated fraction of synthetic terms are rejected as non-monomial, so the object does
    not apply even at toy scale.
  - The dominating terms differ on essentially the whole grid, leaving the identity with no domain.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-583998
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The corruption model is invented for this experiment and is not validated against real PDF extraction;
    a Coordinator must decide whether a synthetic model is acceptable evidence for claim (C) or whether
    the claim must wait for a real damaged sample.
  - The frozen evaluation grid silently determines which term dominates and hence d; the grid must
    be chosen and justified by a Coordinator before approval and cannot be adjusted afterwards.
  - Handling of maxima and of square roots of sums is specified as detect-and-reject; whether a partial
    exponent vector should instead be defined piecewise is an open modelling decision.
