# EXPERIMENT CONTRACT -- EXP-MLDSA-4d3948 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-4d3948
  hypothesis_id: H-MLDSA-238cbc
  derived_from_idea: IDEA-20261018-7eb7e8
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: rho grinding for singular slots
  objective: the cost law for grinding a rank-deficient slot and its honest frequency
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C ExpandA + NTT from PQClean; Python orchestration
    parameters: q in {257, 7681, 8380417}; shapes (4,4),(6,5),(8,7); 2^20 honest keys at true
      q (44 shape)
    procedure: 1) KAT. 2) Grind. 3) Honest sampling. 4) Forger test at q = 257.
  controls:
  - 'null: honest keys'
  - 'positive: reduced q = 257 where singular slots are frequent'
  - 'A/A: grind at q = 7681 under two seeds'
  independent_variables:
  - modulus_q
  - shape_kl
  metrics:
    primary:
    - grind cost
    secondary:
    - honest frequency
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: grind cost
    formula: q^{k-l+1}/256
    source: rank-deficiency probability
  scale_relevance:
    tier: crypto
    justification: true q counting
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop at 2^30 ExpandA per cell
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    P1 in C2 and P2; C1 shows rectangular shapes cost more by factor q; AA1 noise floor within
    factor 1.5
  falsification_criterion: C2 off by factor 4
  decision_impact:
    on_positive: >-
      list singular-slot keys as a measurable but likely harmless pk class in the conformance
      census
    on_negative: re-derive the counting law
  variable_ledger:
    independent:
    - name: modulus_q
      levels:
      - '257'
      - '7681'
      - '8380417'
    - name: shape_kl
      levels:
      - 4x4
      - 6x5
      - 8x7
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    comparisons:
    - id: C1
      arms:
      - q 7681 4x4
      - q 7681 6x5
      differs_in:
      - shape_kl
      design: one_factor
    - id: C2
      arms:
      - cost vs q
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - q 7681 seed-block A
      - q 7681 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-7eb7e8.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-7eb7e8.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
