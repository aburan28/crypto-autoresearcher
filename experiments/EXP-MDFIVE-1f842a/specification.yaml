experiment:
  id: EXP-MDFIVE-1f842a
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-585c93; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-585c93
  question_id: RQ-MDFIVE-6870c1
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Compute step-indexed freedom and sufficient-condition curves for MD5 under collision and
    preimage boundary conditions, with a null arm over 1000 shape-matched random schedules and an
    MD4 cross-check.
  objective: 'The run reduces exactly one uncertainty: whether the collision-preimage gap on MD5 has
    a locatable step index in the freedom-versus-conditions accounting, or whether it does not. Stated
    as parts: (i) it produces the exact free-bit curve F_t for t = 0..63 from the RFC 1321 schedule,
    a quantity that requires no modelling choice and either matches an independent reimplementation
    or reveals a transcription error; (ii) it produces the sufficient-condition curve C_t under one
    declared skeleton per setting and reports the smallest step at which the two settings'' ratios
    separate beyond the null band, or reports that no such step exists; (iii) it places that index
    inside the distribution obtained by running the identical code on 1000 schedules with MD5''s multiplicity
    profile but random order, and repeats the whole pipeline on MD4 so the instrument is seen to move
    between primitives. What the run does not reduce is any uncertainty about attack cost. No message
    is hashed for an attack purpose, no path is driven to a colliding pair, and no preimage of anything
    is sought. If the outcome is that the curves do not separate, that is the informative result and
    it is recorded as a measured obstruction to the freedom-accounting reading of the asymmetry, with
    the skeleton generators and null family named so the next agent can re-scope rather than re-run.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: for the declared skeleton family,
      the declared null family and MD5 as specified in RFC 1321, the collision-setting and preimage-setting
      condition-per-freedom curves separate at step t*, with MD5''s t* at the stated percentile of
      the null distribution. What does NOT follow: nothing about MD5''s actual preimage resistance,
      nothing about any attack complexity, nothing about why any historical frontier moved or failed
      to move, and nothing about any other hash function beyond the MD4 arm actually executed.'
  inputs:
    procedure: STAGE 0 pin and validate an RFC 1321 implementation against the published test vectors,
      and encode the schedule and rotation tables twice from the specification by two separate transcriptions;
      cost minutes, and a mismatch halts the run. STAGE 1 compute F_t exactly for MD5 and for MD4;
      cost seconds. STAGE 2 declare, in writing and before any C_t is computed, the collision-side
      skeleton generator, the preimage-side chunk-assignment generator, and the definition of a sufficient
      condition; cost is human review time and it is the stage that decides whether the run is interpretable.
      STAGE 3 compute C_t for both settings by exhaustive enumeration over the declared skeleton space;
      cost minutes. STAGE 4 compute t* and freeze it. STAGE 5 run STAGES 1, 3 and 4 unchanged over
      1000 sampled null schedules and over the fresh-word idealisation, in the same invocation as
      the signal arm; cost under a minute. STAGE 6 run the rotation-shuffle ablation. STAGE 7 measure
      the dependence residual on the scaled-down analogue by exhaustive satisfiability count; cost
      minutes at the declared size. STAGE 8 emit the run manifest and both curves as data.
    instrument: 'Python 3.11 standard library plus numpy for the null distribution, run under harness/runner.py
      so the run manifest records the resolved inference block, seeds and wall-clock ceiling. A pure-Python
      RFC 1321 MD5 exposing per-step state, written for this run, cross-checked against hashlib.md5
      on the published test vectors and on 10^6 random inputs. No Sage, no computer-algebra system,
      no SAT solver: every quantity here is a count over a fixed table.'
    parameters: 'MD5: 64 steps, 16 words of 32 bits, 512-bit block, single block. MD4 arm: 48 steps,
      same word count. Null family: 1000 schedules sampled uniformly subject to each of the 16 words
      appearing exactly 4 times, seeds 1..1000 declared in the manifest. Fresh-word idealisation:
      64 independent words. Rotation-shuffle ablation: 20 permutations of the published rotation constants.
      Scaled-down analogue for the dependence residual: 4 state words of 8 bits, 16 steps, 8 message
      words of 8 bits, giving a 32-bit state exhaustible in 2^32 steps and a message space of 2^64
      sampled at 10^7.'
  controls:
  - Null schedules preserving the four-uses-per-word multiplicity profile, run through the identical
    code path in the same invocation.
  - A fresh-word idealisation in which no word is ever reused, giving the upper bound of the freedom
    curve.
  - The identical accounting applied to MD4's 48-step schedule, so the instrument is seen to produce
    different numbers on a different primitive rather than a constant.
  - A shuffled-rotation ablation in which the rotation constants are permuted but the schedule is
    held fixed, separating schedule effects from rotation effects.
  - A recomputation of F_t by two independent implementations written against the RFC text separately,
    so a transcription error in the schedule table cannot pass as a result.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The identical pipeline is run on 1000 random schedules drawn uniformly
    from permutations of the 64-slot sequence preserving the multiplicity profile of four uses per
    word, and additionally on a fresh-word idealisation where every step meets an independent 32-bit
    word. The null must show a distribution of divergence indices whose central 90 percent band is
    reported before MD5''s own index is looked at. For the signal arm to mean anything MD5''s t* must
    fall outside that band; if it falls inside, the record states a controlled null, namely that the
    divergence is a property of the multiplicity profile shared by all such schedules and not of MD5.'
  independent_variables:
  - 'boundary condition setting: collision versus preimage'
  - step index t in 0..63
  - 'schedule identity: MD5, MD4, null sample, fresh-word idealisation'
  - 'rotation constant assignment: published versus shuffled'
  metrics:
    primary:
    - F_t per step per setting
    - C_t per step per setting
    - divergence index t*
    - percentile of MD5's t* within the null distribution
    secondary:
    - count of distinct words consumed at or before each step
    - dependence residual on the scaled-down analogue
    - sensitivity of t* to the choice of skeleton generator
    - MD4 arm's t* and its own null percentile
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The divergence index t*, and MD5's percentile within the 1000-sample null distribution
      of divergence indices.
    formula: 't* is defined as the smallest t in 0..63 such that |C_t^{coll}/max(F_t^{coll},1) - C_t^{pre}/max(F_t^{pre},1)|
      exceeds the 95th percentile of that same absolute difference measured across the null schedules
      at the same t. Predicted value: t* <= 16, with MD5''s percentile <= 10, meaning at most 10 percent
      of null schedules diverge as early.'
    source: Pre-registered in the parent proposal IDEA-20260816-585c93 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Every count is computed on full MD5 as specified, so there is no extrapolation
      in the schedule half at all: F_t is exact for the real primitive. The extrapolation lives entirely
      in the dependence residual, which is measured on a 32-bit-state analogue because that is the
      largest size where satisfiability can be counted exhaustively, and the transfer assumption is
      stated explicitly: that condition dependence measured on a 4-word 8-bit ARX with the same step
      shape is indicative of, but not equal to, dependence on 32-bit words. No result is reported
      as if that assumption were verified.'
    correspondence: null
  tail_checks:
  - Recompute F_t from the second independent transcription of the schedule table and require exact
    agreement.
  - Check that the fresh-word idealisation produces the maximal freedom curve and that no null sample
    exceeds it, which would indicate a bug.
  - Check that MD4's curves differ from MD5's, since identical curves for two different schedules
    would indicate the instrument is reading the profile only.
  - Verify that t* is unchanged when the null sample size is halved, so the index is not a sampling
    artefact.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt if the two independent schedule transcriptions disagree.
  - Halt if the validated MD5 implementation fails any published test vector.
  - Halt the null arm at 1000 samples regardless of the observed percentile, fixed before the run.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A divergence index t* exists at or before step 16, is stable to within 8 steps
    under an alternative skeleton generator, and sits at or below the 10th percentile of the 1000-sample
    null distribution, with all curves reproduced exactly by an independent rerun from the manifest
    seeds.
  falsification_criterion:
  - No t* exists at any step under the declared definition.
  - MD5's t* sits inside the central 90 percent of the null distribution.
  - t* shifts by more than 8 steps under the alternative skeleton generator.
  - The MD4 arm returns a t* statistically indistinguishable from MD5's.
  - The dependence residual shows condition counts failing to predict satisfiability on the analogue
    by more than a factor of 4.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-585c93
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The definition of a sufficient condition on the preimage side has to be fixed by the Coordinator
    before approval; the collision-side definition is conventional but the preimage-side one is not,
    and leaving it to the run would make the result unfalsifiable.
  - The null family needs a Coordinator ruling on whether schedules preserving only the multiplicity
    profile are the right null, or whether the round-block structure should also be preserved; the
    two nulls give different bands.
  - The skeleton generators need a declared equivalence-of-strength argument, absent which any divergence
    is attributable to generator asymmetry.
