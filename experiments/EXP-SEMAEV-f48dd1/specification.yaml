experiment:
  id: EXP-SEMAEV-f48dd1
  hypothesis_id: H-XOR-YIELD
  version: 2
  title: >-
    X-oracle-alone Semaev yield discrimination (toy scale, full cell grid)
  status: approved
  frozen: true
  approved_by: coordinator
  claim_tier: toy
  source_design: >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-b3f591/tasks/TASK-20260806-a01d5a/experiment_design.md
  objective: >-
    Full cell grid execution (m=3, p∈{101,103,107,211}, b∈{0.4,0.5}, seeds=5 per
    config, all three arms) to measure x-oracle yield advantage over random predictor.
    Smoke test passed in BATCH-c3a501.
  scale_relevance:
    tier: toy
    justification: >-
      Full grid at toy-scale primes (7-8 bits). No result is presented as crypto-scale
      evidence (AGENTS.md rule 7). Purpose is to establish whether x-oracle provides
      statistically significant yield advantage at any scale.
  inputs:
    cells:
      m_values: [3]
      primes: [101, 103, 107, 211]
      b_values: [0.4, 0.5]
      seeds: [1, 2, 3, 4, 5]
    curve_selection_rule: >-
      Deterministic: use harness.toycurve.generate_instance(seed=1, field_bits=7)
      to obtain a curve over F_p with p near 128. If p != 101, fall back to
      deterministic search for the first nonsingular curve y^2 = x^3 + Ax + B
      over F_101 with A, B in [0, 100] (lexicographic) that has a point of
      order >= 2m-1 = 5.
    factor_base_rule: >-
      B = floor(p^b) = floor(101^0.4) = 6 x-coordinates. Deterministic
      selection: first 6 on-curve x-coordinates in [0, p) in increasing order.
  controls:
    - id: CTRL-SMOKE-QUERY-MATCH
      method: >-
        Arms B and C must execute the same number of oracle queries per run.
      pass_condition: oracle_queries_B == oracle_queries_C
    - id: CTRL-SMOKE-PRNG-COLLISION
      method: >-
        Arm C's PRNG must be collision-free within the run.
      pass_condition: all PRNG outputs are distinct
    - id: CTRL-SMOKE-BASELINE
      method: >-
        Arm A's yield should be roughly consistent with B^m / N (within factor 4).
      pass_condition: Y_A within factor 4 of B^3 / N, or cell flagged for review
  independent_variables:
    - arm: [A, B, C]
  metrics:
    primary:
      - yield: >-
          relations_found / tuples_attempted, where tuples_attempted is defined
          consistently across all arms as |F|^m (the full enumeration space).
          For Arm A (exhaustive), this equals the number of triples enumerated.
          For Arms B and C (MITM), this is the theoretical enumeration space
          |F|^m, treating MITM as a filtering strategy that reduces verification
          cost but not the enumeration space. This ensures yield comparisons
          (Δ = Y_B − Y_C) use a consistent denominator.
    secondary:
      - oracle_queries
      - hash_table_hits
      - false_positives
      - wall_clock_seconds
      - field_operations
      - candidates_verified: >-
          Number of candidate tuples actually verified after MITM filtering
          (Arms B/C only). Reported for transparency but not used in yield
          denominator to maintain cross-arm consistency.
  replication:
    seeds: [1, 2, 3, 4, 5]
    seed_policy: >-
      Five deterministic seeds per cell. Each seed produces an independent run.
      Total: 4 primes × 2 b-values × 5 seeds = 40 configurations × 3 arms = 120 arm-runs.
  budget:
    wall_clock_seconds_per_run: 300
    maximum_memory_gb: 4
    maximum_runs: 120
    total_wall_clock_budget_seconds: 36000
  stopping_rules:
    - stop at 300s wall clock per arm (record as timed_out)
    - stop at 10 hours total wall clock for the full grid
  invalidation_rules:
    - any run missing manifest, command, or raw-result is invalid
    - query count mismatch between arms B and C invalidates the cell
    - PRNG collision in arm C invalidates the cell
  success_criterion: >-
    All 120 arm-runs complete within budget, control checks pass for each cell,
    and results are deterministic (reproducible with same seed). Report per-cell
    yield statistics (mean, std) and overall Δ = Y_B − Y_C with confidence intervals.
  falsification_criterion: >-
    Infrastructure failure or control check failure does not falsify the
    hypothesis (AGENTS.md rule 5); it invalidates the run. If Δ is not statistically
    significant (p > 0.05) across all cells, the hypothesis is weakened but not
    falsified (toy-scale only).
  required_artifacts:
    - experiments/EXP-SEMAEV-f48dd1/specification.yaml
    - experiments/EXP-SEMAEV-f48dd1/implementation/full_grid.py
    - experiments/EXP-SEMAEV-f48dd1/runs/RUN-SEMAEV-f48dd1-grid/manifest.yaml
    - experiments/EXP-SEMAEV-f48dd1/runs/RUN-SEMAEV-f48dd1-grid/raw-results.json
    - experiments/EXP-SEMAEV-f48dd1/runs/RUN-SEMAEV-f48dd1-grid/analysis.yaml
  assigned_to: executor
  inference_receipt:
    requested_policy: executor-implementation
    resolved_model_id: null
    fallback_used: false
