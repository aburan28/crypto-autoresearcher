experiment:
  id: EXP-ICEX-607974
  hypothesis_id: H-ICEX-70ddd4
  derived_from_idea: IDEA-20260808-d830c6
  question_id: RQ-FIND-001
  batch_id: BATCH-d6838c
  version: 1
  title: >-
    REPLICATE THE r = 3 RATIO UNDER A FROZEN CONTRACT AND MEASURE ITS SLOPE IN B,
    WITH A DECAY CONTROL THAT MUST COLLAPSE IT TO 1 AND A CURVE-FREE
    MULTIPLICATIVE-ORBIT NULL OVER Z/N THAT IS PREDICTED TO REPRODUCE IT- both
    matching conventions reported side by side, the ratio reported per dedup policy
    and never pooled, and NO KNOWLEDGE PROMOTION AUTHORISED BY ANY OUTCOME
  status: draft
  objective: >-
    (A) THE UNCERTAINTY. DEC-20260727-009 records four committed
    searches-per-relation-row ratios - 2.62x, 3.17x, 2.97x and 3.20x - identified
    as the classical automorphism-quotient constant r = 3, and records in the same
    decision that the claimed super-constant linear-algebra saving is exactly the
    part that is NOT supported and that the instrument question is UNADJUDICATED
    in both directions. Whether the ratio reproduces under a contract frozen in
    advance, and whether it is FLAT in B, has never been measured.
    (B) WHAT IS BUILT. Four arms over one counter and one seed list- the phi-stable
    arm; the size-matched random arm; the E-prime phi-free closure arm that
    isolates closure convention from endomorphism content; and a CURVE-FREE arm on
    a subset of (Z/NZ, +) stable under multiplication by a cube root of unity.
    Plus a decay control on a curve with 3 NOT dividing N-1, and a stretch
    end-to-end solve arm with a blocking prerequisite.
    (C) THE TWO THINGS THIS CONTRACT ADDS THAT THE SOURCE DOES NOT CARRY. FIRST, A
    CURVE-FREE NULL. The r-fold saving follows from orbit counting under a finite
    group action and reads no curve structure, so a size-B subset of Z/N stable
    under multiplication by a primitive cube root of unity must reproduce it.
    PRE-STATED CONSEQUENCE, FROZEN HERE- if it does, the r-factor is orbit counting
    on Z/N and MAY NOT BE QUOTED AS AN ELLIPTIC-CURVE, ENDOMORPHISM OR ECDLP
    ADVANTAGE. SECOND, A SIZED SLOPE TEST. The flat-in-B prediction needs a
    replication count, and the contract derives one- with per-cell standard
    deviation about 0.27, four B values whose log2 spread has standard deviation
    about 1.06, and S seeds per cell, the slope standard error is
    0.27/(sqrt(4*S)*1.06), which at S = 3 is about 0.073, making a slope of 0.5 per
    log2 B detectable at nearly 7 sigma. THREE SEEDS PER CELL IS THEREFORE
    DECLARED, NOT DISCOVERED.
    (D) WHAT IS NOT DECIDED AND CANNOT BE. NO KNOWLEDGE PROMOTION IS AUTHORISED BY
    ANY OUTCOME OF THIS CONTRACT. RQ-FIND-001 constrains promotion VERBATIM to
    strength replicated or strong; the backing evidence is preliminary and the
    backing decision is a weaken. This contract produces a replication and a draft
    boundary; the promotion is a separate Coordinator decision. It also adjudicates
    nothing about phi_alpha, which DEC-20260727-009 records as open in both
    directions, and it creates no permission to re-assert H-STR-002.
  inputs:
    cost_unit: >-
      SEARCHES PER RELATION ROW IS A COUNT DIVIDED BY A COUNT and is
      dimensionless. Both sides of every arm-to-arm ratio carry that unit. NO
      WALL-CLOCK QUANTITY ENTERS ANY RATIO IN THIS CONTRACT; wall-clock is recorded
      for budget accounting only.
    unit_discipline: >-
      BINDING. Every value carries a tag in {searches, rows, orbits, points,
      dimensionless, seconds}. Cross-tag arithmetic requires a named recorded
      conversion. A ratio of searches-per-row to searches-per-row is dimensionless;
      a ratio of searches-per-row to searches-per-ORBIT is a DIFFERENT quantity and
      is reported under a different name.
    matching_convention: >-
      BLOCKING AND BOTH REPORTED. A phi-stable base of B points covers only B/r
      orbits, so the arms differ in effective size unless B is matched in ORBITS
      rather than in POINTS. THE CONTRACT COMPUTES BOTH AND REPORTS THEM SIDE BY
      SIDE, with the gap between them reported explicitly, because that gap is
      exactly where a factor of r can appear or disappear silently. A ratio quoted
      without naming its convention is INADMISSIBLE and the harness refuses to emit
      one.
    dedup_policy: >-
      BLOCKING. DEC-20260727-009 records that the committed harness mixes three
      dedup and zero-filter policies. The policy is declared per cell and the ratio
      is reported PER POLICY. A POOLED RATIO ACROSS POLICIES IS INADMISSIBLE.
    frozen_before_execution: >-
      The four B values, the seed lists, the base-row budgets, both matching
      conventions, the dedup policies, the bands [2.4, 3.6] on P1 and at most 1.3
      on the decay control, the slope test at three seeds per cell, and the
      smallest-instance exclusion rule for the slope fit. None may change after any
      cell runs.
    procedure: >-
      STAGE 0 (convention freeze, zero compute). Record both matching conventions,
      the dedup policies, the base-row budgets and the seed lists, and emit the
      sha256 of the factor base and the final row list for every planned cell
      layout. Nothing runs until this file exists.
      STAGE 1 (main arms). At four B values spanning at least 8x, on toy curves
      with j = 0 and 3 dividing N-1, run the phi-stable arm, the size-matched
      random arm and the E-prime phi-free closure arm at MATCHED base-row budgets,
      at least 3 seeds per cell, under BOTH matching conventions and each declared
      dedup policy. Record searches, relation rows, orbits covered and the ratio.
      STAGE 2 (decay control, blocking). Identical pipeline on a curve with 3 NOT
      dividing N-1, where no order-3 structure exists. THE RATIO MUST COLLAPSE TO
      AT MOST 1.3. Failure marks the run INVALID.
      STAGE 3 (curve-free null). The identical measurement on a size-B subset of
      (Z/NZ, +) stable under multiplication by a primitive cube root of unity mod
      N, with m-subsets summing to the target as relations, through the SAME
      counters and reporting path, with NO curve arithmetic in the code path.
      STAGE 4 (slope fit). Fit the ratio against log2 B per arm per convention per
      policy, report the slope with its interval, EXCLUDING the smallest instance
      by the rule declared in stage 0 because at that size a factor of 3 is a
      handful of searches.
      STAGE 5 (STRETCH, gated). If and only if a right-hand side can be assembled
      at the smallest instance within budget, run the end-to-end solve on the phi
      arm, on the folded (B/r) by (B/r) system, and on plain Wiedemann, and report
      the three costs. DEC-20260727-009 R3 records that no right-hand side has ever
      been assembled; IF IT CANNOT BE ASSEMBLED, THIS ARM IS REPORTED AS UNRUN AND
      NEVER AS NEGATIVE.
      STAGE 6 (draft, zero compute). Emit a DRAFT KN-FIND boundary statement whose
      first sentence is the supported constant and whose second sentence is the
      open linear-algebra question, prepared FOR THE COORDINATOR. IT IS A DRAFT
      ARTIFACT UNDER THE TASK WRITE SCOPE AND IS NOT A PROMOTION.
    mechanism: >-
      STEP 1. One relation-collection harness with the searches-per-relation-row
      counter it already computes, exposed per arm, per convention and per policy.
      One seed list shared across arms so the comparison is paired.
      STEP 2. The curve-free arm replaces the group and the relation predicate
      ONLY. Every counter, budget, dedup policy and reporting path is the shared
      object, and the run manifest lists the shared and disjoint modules so the
      claim that no curve arithmetic is present is checkable.
      STEP 3. Per-seed minimum and maximum ratio are reported per cell, not only
      the mean, and the spread is checked for narrowing as B grows, because a
      spread that does not narrow indicates the ratio is not a yield effect at all.
      STEP 4. Every row is reported as (arm, curve, B, convention, dedup policy,
      seed, searches, relation rows, orbits, ratio, base-row budget, factor-base
      sha256, final-row-list sha256, wall seconds), never as a scalar.
    instrument: >-
      The existing relation-collection harness plus a curve-free arm. Memory is
      trivial at B at most 397. NO GROEBNER BASIS AND NO MACAULAY MATRIX IS BUILT
      except in the gated stretch arm, whose solve is at the smallest instance
      only.
  controls:
    - >-
      CONTROL 1, DECAY CONTROL WITH DEMONSTRATED DYNAMIC RANGE (blocking). A curve
      with 3 NOT dividing N-1, where the order-3 structure is ABSENT. REQUIRED
      MAGNITUDE- the ratio must fall to AT MOST 1.3, a collapse by a factor of
      about 3 from the effect. This is the parameter meant to destroy the effect,
      increased to its extreme, and the quantity must decay. A ratio near 3 there
      means the harness is measuring something other than the automorphism quotient
      and EVERY POSITIVE IS VOID. This control appears in no prior arm of this lane
      and is cheap.
    - >-
      CONTROL 2, SIZE-MATCHED RANDOM FACTOR BASE (blocking). At identical B, the
      one-variable comparison DEC-20260727-009 R2 identifies as the ablation the
      original experiment declared and never implemented.
    - >-
      CONTROL 3, E-PRIME PHI-FREE CLOSURE ARM (blocking). Isolates closure
      convention from endomorphism content. If E-prime alone reproduces the ratio,
      the effect is the closure convention and not the endomorphism, and that is
      the finding.
    - >-
      CONTROL 4, CURVE-FREE MULTIPLICATIVE-ORBIT NULL (blocking for
      interpretation). A size-B subset of (Z/NZ, +) stable under multiplication by
      a primitive cube root of unity mod N. PRE-STATED CONSEQUENCE, FROZEN HERE-
      if it reproduces the ratio in [2.4, 3.6], the r-factor is orbit counting on
      Z/N and NO RESULT OF THIS EXPERIMENT MAY BE QUOTED AS AN ELLIPTIC-CURVE,
      ENDOMORPHISM OR ECDLP ADVANTAGE.
    - >-
      CONTROL 5, BOTH MATCHING CONVENTIONS. Point-matched and orbit-matched B
      reported side by side with their gap, at every cell.
    - >-
      CONTROL 6, PER-POLICY REPORTING. The ratio reported separately under each
      declared dedup and zero-filter policy; a pooled figure is inadmissible.
    - >-
      CONTROL 7, ARTIFACT PINNING. sha256 of the factor base and of the final row
      list per cell, as the DEC-20260727-009 next actions require, so a later
      reader can tell which object produced which number.
  independent_variables:
    - factor-base size B, four values spanning at least 8x
    - arm in {phi-stable, size-matched random, E-prime phi-free closure, curve-free Z/N orbit}
    - curve class in {3 divides N-1, 3 does not divide N-1}
    - matching convention in {point-matched, orbit-matched}
    - dedup and zero-filter policy, as declared per cell
  metrics:
    primary:
      - >-
        searches-per-relation-row ratio, random arm over phi arm, per instance per
        convention per policy (dimensionless)
      - >-
        slope of that ratio against log2 B, with interval (dimensionless per log2 B)
    secondary:
      - searches, relation rows and orbits covered per arm per cell
      - decay-control ratio on the curve with 3 not dividing N-1
      - curve-free null ratio at matched B
      - point-matched versus orbit-matched gap per cell
      - per-seed minimum and maximum ratio per cell and the spread trend in B
      - factor-base and final-row-list sha256 per cell
      - stretch arm- phi-arm, folded-system and plain-Wiedemann solve costs at the smallest instance
      - wall-clock seconds per run, for budget accounting only
  heuristic_under_test: HEUR-RFACTOR-1
  preregistered_prediction:
    quantity: >-
      The ratio of searches per relation row between a size-matched random factor
      base and a phi-stable one, and its slope against log2 B.
    formula: >-
      Ratio equal to r = |Aut(E)|/2 = 3, predicted band [2.4, 3.6]; slope in log2 B
      equal to zero, predicted interval containing zero at three seeds per cell;
      decay control at most 1.3; curve-free null in the same band as the elliptic
      arm.
    source: >-
      The exact orbit-counting fact that a phi-stable base of B points has B/r
      orbits and that a decomposition for one orbit representative yields r
      relations by equivariance, together with the four committed ratios
      2.62, 3.17, 2.97 and 3.20 from DEC-20260727-009 R5, read verbatim for this
      contract.
  scale_relevance:
    tier: toy
    justification: >-
      Four instances at at most 20 field bits with B at most 397 and arity 2,
      matching the committed instances so the replication is comparable. The
      dimensionless ratio and its slope are the transferable quantities; every
      absolute search count is a property of this harness. TRANSFER ASSUMPTION,
      STATED- that the orbit argument, which is exact, continues to govern the
      ratio at larger B. The slope measurement tests that over an 8x range and no
      further.
    correspondence: null
  tail_checks:
    - >-
      Per-seed minimum and maximum ratio per cell, with the requirement that the
      spread narrow approximately as one over the square root of the relation count
      as B grows. A spread that does not narrow means the ratio is not a yield
      effect.
    - >-
      The number of orbits actually covered against B/r at every cell, since a
      phi-stable base that does not cover B/r orbits is not phi-stable and the
      whole comparison is mislabelled.
  replication:
    seeds: >-
      At least 3 independent seeds per cell, DERIVED from the slope power
      computation in the objective rather than chosen, listed explicitly in the run
      manifest before stage 1 and shared across arms so the comparison is paired.
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 4.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
    - >-
      A cell that does not reach its declared base-row budget within its wall-clock
      budget is recorded as CENSORED with the rows achieved. Censoring is an
      infrastructure receipt under AGENTS.md rule 5 and is never evidence about the
      ratio.
    - >-
      Stage 2 decay-control failure marks the run INVALID and stops interpretation.
    - >-
      The stretch arm runs only if a right-hand side is assembled within its own
      declared sub-budget; otherwise it is reported UNRUN.
    - >-
      Total wall-clock at the declared cap; remaining cells recorded as NOT
      ATTEMPTED.
  invalidation_rules:
    - >-
      A ratio emitted without its matching convention invalidates the row.
    - >-
      A ratio pooled across dedup policies invalidates the row.
    - >-
      The decay control failing to collapse the ratio to at most 1.3 invalidates
      the whole run.
    - >-
      A phi-stable arm covering materially fewer than B/r orbits invalidates its
      cells, because the base is then not phi-stable.
    - >-
      The curve-free arm importing curve arithmetic invalidates its
      interpretation-bearing role.
    - >-
      Unequal base-row budgets between the phi and random arms invalidate the
      comparison.
  success_criterion: >-
    The ratio lies in [2.4, 3.6] at every instance with 3 dividing N-1 under both
    conventions and every declared policy; the slope interval in log2 B contains
    zero; the decay control collapses to at most 1.3; both conventions and their
    gap are reported at every cell; and the draft boundary statement is emitted.
    Success is a clean REPLICATION with its controls, and it authorises NO
    promotion.
  falsification_criterion: >-
    The ratio outside [2.4, 3.6] under the frozen contract falsifies the
    reproduction and blocks any promotion, and the non-reproduction is the
    finding. A slope interval excluding zero falsifies the constant-factor
    characterisation and is the most consequential outcome in the lane. A ratio at
    or near 1 on curves with 3 dividing N-1 means the mechanism is not operating in
    this harness. The curve-free null reproducing the ratio does not falsify the
    measurement but removes every elliptic-curve reading of it.
  required_artifacts:
    - exact command, git commit and dirty-tree state, environment and versions
    - the stage 0 convention-freeze file with both matchings, the policies, the budgets, the seeds and the bands
    - sha256 of the factor base and of the final row list per cell
    - per-cell raw records (arm, curve, B, convention, policy, seed, searches, rows, orbits, ratio, budget, wall seconds)
    - the ratio table with the band evaluated, per convention and per policy
    - the slope fit with its interval and the excluded smallest instance named
    - the decay-control table on the curve with 3 not dividing N-1
    - the curve-free null table at matched B
    - the point-matched versus orbit-matched gap table
    - per-seed minimum and maximum and the spread trend
    - the stretch-arm result or an explicit UNRUN record with the reason
    - the DRAFT KN-FIND boundary statement, clearly marked draft and unpromoted
    - stdout, stderr, timestamps, resource measurements
    - inference block- requested policy, backend, resolved model id, effort, fallback, degraded requirements
  assigned_to: executor
  approved_by: null
  limitations:
    - >-
      NO KNOWLEDGE PROMOTION IS AUTHORISED BY ANY OUTCOME OF THIS CONTRACT.
      RQ-FIND-001 constrains promotion VERBATIM to replicated or strong evidence;
      the backing evidence is preliminary. The draft is a draft. Only the
      Coordinator may promote, in a separate decision.
    - >-
      A CONSTANT FACTOR ALREADY IN THE PUBLISHED LITERATURE. This is a boundary
      record, not a discovery, and must never be cited as an endomorphism advantage
      over rho. Under KN-TECH-018 any factor at or below sqrt(6) is baseline
      calibration.
    - >-
      NOTHING HERE ADJUDICATES phi_alpha. DEC-20260727-009 records that question as
      open in both directions and forbids any downstream record from calling it an
      artifact or validated.
    - >-
      NO PERMISSION TO RE-ASSERT H-STR-002, which remains weakened with an open
      replication obligation.
    - >-
      IF THE CURVE-FREE NULL REPRODUCES THE RATIO, NOTHING HERE IS AN
      ELLIPTIC-CURVE OR ENDOMORPHISM STATEMENT. Pre-stated so it cannot be
      renegotiated after the data.
    - >-
      The r-fold saving presupposes phi is evaluable in a constant number of field
      operations, true for j = 0 and j = 1728 and FALSE IN GENERAL.
    - >-
      TOY SCOPE. WHETHER THE RATIO STAYS CONSTANT AT CRYPTOGRAPHIC B IS NOT
      TESTABLE AT ANY SCALE THIS PROGRAM CAN REACH; the slope is measured over an
      8x range in B and nothing beyond it is claimed.
    - >-
      The stretch arm has a BLOCKING PREREQUISITE - no right-hand side has ever
      been assembled in this lane. An unrun stretch arm is an infrastructure
      receipt and never evidence about residual structure.
    - >-
      claim_tier toy. sota_delta zero. No attack, no exponent moved.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter. Every prose value is
    a folded block scalar; no tabs; no duplicate keys to the author reading. THIS
    AGENT COULD NOT RUN A STRICT YAML PARSE OR tools/validate_ledger.py AND DID
    NOT DO SO; the orchestrating session must run both before this contract is
    reviewed.
