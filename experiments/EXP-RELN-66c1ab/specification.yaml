experiment:
  id: EXP-RELN-66c1ab
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  approved_by: null

  hypothesis_id: H-RELN-f697be
  question_id: RQ-RELN-001
  goal_id: GOAL-RELN-001
  idea_id: IDEA-20260805-96cb3d

  title: >-
    Charging the complete decider: solve-gap vacuity at m = 2, budget headroom
    against the frozen 120-second per-attempt allowance, and the B-invariance of
    end-to-end relation-collection cost

  objective: >-
    Establish, under a complete fix-(m-1)-and-root-find decider implemented in the
    standard library, that (1) the frozen protocol's solve_gap is identically zero
    when the decider finishes, so every nonzero value it could report is censoring;
    (2) the decider's cost at m = 2 is exactly B modular square roots per target,
    six or more orders of magnitude inside the declared per-attempt budget; and
    (3) the product (attempts per relation) x (cost per attempt) is flat in B, so
    the goal's single independent variable is inert for the quantity GOAL-ICEX-001
    consumes. Deliver, in place of p_solve, the solver speedup ratio against this
    baseline at matched success set -- a quantity with a defined denominator, for
    which NO VALUE IS PREDICTED HERE.

  what_this_is_not:
    - Not a discrete-logarithm computation, relation collection, or ECDLP attack. No relation is ever used to solve anything.
    - Not a claim that any Groebner solver is worthless; the speedup ratio is explicitly unmeasured and unpredicted.
    - Not a claim of an exponent improvement. The derived Theta(N) total is WORSE than rho by a square root and restates KN-TECH-003's existing position with a constant.
    - Not a decomposition-probability estimate for any cell, and not an evaluation of the ARM-PKM-PRIME construction.
    - Not a criticism of the BATCH-001 red-team review, whose PASS verdict is recorded as a fact about that review.
    - Not an authorisation, approval, freezing, run, observation, or evidence, and not a status change to any existing record.

  claim_ceiling:
    tier: toy
    exact_scope: >-
      A completed run could support only this: at field_bits in {8, 10, 12, 16} on
      the named deterministic curves with the frozen protocol's own B-ladder and
      m in {2, 3}, the fix-(m-1)-and-root-find decider does or does not return the
      same success set as exhaustive enumeration; its measured cost does or does not
      equal the derived count; and the measured cost product across the ladder is or
      is not flat. Nothing about crypto-scale relation collection, about the ECDLP's
      difficulty, or about the merit of any published construction follows. The
      frozen protocol's prohibited_claims list is inherited verbatim.

  inputs:
    field_bits: [8, 10, 12, 16]
    arity_m: [2, 3]
    factor_base_size_ladder:
      note: Taken unmodified from the frozen protocol's default ladder.
      bits_8: [4, 6, 8, 12]
      bits_10: [6, 10, 14, 20]
      bits_12: [8, 14, 20, 28]
      bits_16: [12, 20, 32, 48]
    curve_and_base_selection: >-
      Identical rules to EXP-RELN-475c87 (same prime rule, same candidate stream,
      same acceptance conditions) so that the three RELN contracts share fixtures and
      can be compared without re-deriving anything. Factor bases are uniformly drawn
      (ARM-UNIFORM of EXP-RELN-0a979f) so that this contract measures deciders, not
      geometry.
    deciders:
      - id: DEC-ENUM
        description: >-
          Exhaustive enumeration over size-m multisets of W, summing points and
          testing equality with the target. Ground truth. Cost C(2B+m-1, m) group
          additions.
      - id: DEC-BASELINE
        description: >-
          Fix any m-1 coordinates from V (C(B+m-2, m-1) multisets), specialise
          S_{m+1}, find the roots of the resulting univariate of degree at most
          2^{m-1} in F_p, and test membership in V. At m = 2 this is one discriminant
          and one modular square root per element of V. Root-finding at m = 3 uses
          gcd with X^p - X followed by equal-degree splitting, implemented in the
          standard library and unit-tested against brute force at bits = 8.
      - id: DEC-DECLARED
        description: >-
          The protocol's declared frozen grevlex Groebner arm on the ideal generated
          by S_{m+1} and the vanishing polynomials f_V(x_i). ATTEMPTED ONLY; sympy
          and Sage are absent from this container (verified), so this arm is expected
          to be blocked. Its outcome, success or exact import failure, is recorded
          either way and is infrastructure signal in the failure case.
    targets:
      - id: TGT-RANDOM
        description: "R = aP + bQ with (a, b) drawn from the seed stream; the probability cohort."
      - id: TGT-PLANTED
        description: "R = sum of m distinct factor-base points chosen from the seed stream. Positive control."
      - id: TGT-UNDECOMPOSABLE
        description: >-
          R chosen, by exhaustive check against DEC-ENUM ground truth, to admit NO
          decomposition over V. Null object: forced success 0 and forced FULL cost
          (no early exit).
    seed_derivation_rule: >-
      seed_bytes(label, bits, counter) = ASCII of
      "EXP-RELN-66c1ab/v1|" || label || "|" || decimal(bits) || "|" || decimal(counter),
      SHA-256, big-endian unsigned. Labels: "curve-a", "curve-b", "fb", "target",
      "plant". Every consumed seed is enumerated in the manifest before execution; no
      adaptive reseeding.

  arms_and_controls:
    treatment: >-
      DEC-BASELINE on TGT-RANDOM across the full ladder, charged in root-findings, in
      group operations, and in wall clock, reported separately and never summed.
    measured_null:
      id: NULL-UNDECOMPOSABLE
      description: >-
        DEC-BASELINE on TGT-UNDECOMPOSABLE. FORCED VALUES DERIVED PRE-RUN: success
        exactly 0, and charged cost exactly the full C(B+m-2, m-1) specialisations
        with no early exit. This null CAN FAIL: an early-exit implementation spends
        less than the full cost, which would reveal that charged cost is
        data-dependent and that cross-arm cost comparisons are not matched. That
        failure is the reason the null exists.
    positive_control:
      id: POS-PLANTED
      description: >-
        DEC-BASELINE on TGT-PLANTED. The decider MUST return success and a verifying
        certificate on every planted trial, and DEC-ENUM must agree. IF THE BASELINE
        MISSES A PLANTED DECOMPOSITION IT IS NOT COMPLETE, THE ENTIRE DERIVATION IS
        VOID, AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY ARM.
    graded_control:
      id: GRAD-SLOPES
      description: >-
        Three sequences across the four-point B-ladder at fixed (bits, m):
        attempts-per-relation, cost-per-attempt, and their product. Pre-registered
        log-log slopes: -m, +(m-1), and 0 respectively. THE CHECK IS NOT MERELY THAT
        THE PRODUCT IS FLAT: a flat product built from two flat components would mean
        the instrument is measuring nothing, so both component slopes must be
        non-zero and opposite. Four interior points per family, monotonicity and
        fitted slopes both reported.
    solver_substitution_control:
      id: CTRL-SET-EQUALITY
      description: >-
        DEC-ENUM, DEC-BASELINE and (if instantiable) DEC-DECLARED are run on the
        IDENTICAL trial set with identical seeds, and their success sets are compared
        AS SETS, not as rates. Equal rates with different sets would mean something
        other than completeness is producing the agreement.
    baseline_slice:
      id: CTRL-BEZOUT
      description: >-
        At bits = 8 the entire target space is enumerable, so DEC-ENUM ground truth is
        available for EVERY target, not a sample. The solve gap at bits = 8 is
        therefore exact rather than estimated, and it is the cell in which
        completeness is proven rather than sampled.
    ordering_control: >-
      The forced-value table (solve gap 0; attempt cost exactly B at m = 2; slopes
      -m, +(m-1), 0; null cost with no early exit) is written and SHA-256 hashed
      before any decider runs. NULL-UNDECOMPOSABLE and POS-PLANTED verdicts are
      recorded before the TGT-RANDOM cohort is read.
    comparability_policy: >-
      Deciders are compared only on identical trial sets within a cell, charged in
      identical units, with no scalarisation across units (the frozen protocol's
      OBL-NO-SCALARIZATION is inherited). Wall clock is reported but never used to
      form a headline comparison, because implementation quality would confound it.

  independent_variables: [field_bits, arity_m, factor_base_size_B, decider, target_class]

  metrics:
    primary:
      - metric_id: solve_gap
        type: rational
        definition: "hat_p_exist (DEC-ENUM) minus hat_p_solve (DEC-BASELINE) on the identical trial set"
        forced_value: "EXACTLY 0 whenever DEC-BASELINE finishes"
      - metric_id: success_set_identity
        type: boolean
        definition: "whether DEC-ENUM and DEC-BASELINE agree as SETS on every trial"
        forced_value: "true"
      - metric_id: attempt_cost_rootfindings
        type: integer
        definition: "root-findings per target; forced value B at m = 2, C(B,2)+B at m = 3"
      - metric_id: cost_product_slope
        type: rational
        definition: >-
          fitted log-log slope of (attempts per relation) x (cost per attempt) against
          B at fixed (bits, m), restricted to cells with mu < 0.3
        forced_value: "0"
      - metric_id: solver_speedup_ratio
        type: rational
        definition: "DEC-BASELINE charged cost divided by DEC-DECLARED charged cost at matched success set"
        forced_value: "NONE. Pre-registered as UNKNOWN; predicting it would be the error under audit."
    secondary:
      - metric_id: component_slopes
        type: pair
        definition: "fitted log-log slopes of attempts-per-relation and cost-per-attempt; forced -m and +(m-1)"
      - metric_id: budget_headroom
        type: rational
        definition: "declared 120 s per-attempt budget divided by measured DEC-BASELINE wall clock at bits = 16, B = 48"
      - metric_id: censored_fraction
        type: rational
        definition: "fraction of trials terminated by budget rather than by completion, per decider"
      - metric_id: end_to_end_total
        type: integer
        definition: "measured root-findings to obtain B successful decompositions, against the derived m*N/2^m"
      - metric_id: relation_rank
        type: integer
        definition: >-
          rank over Z/ord of the collected relation matrix, reported to test
          HEUR-RELN-C3. Descriptive only; this contract draws no conclusion about
          relation independence and says so.
      - metric_id: environment_report
        type: record
        definition: "import outcomes and versions for numpy, sympy, sage, src/ic_first_fall_fast, with exact exception text"
      - metric_id: censoring_path_quotation
        type: record
        definition: >-
          The verbatim three-step chain from the frozen protocol -- censored_trials,
          declared_p_lower_solve, p_L_source_for_ICEX -- with file line references,
          or a recorded finding that the chain does not exist as described.

  heuristic_under_test: HEUR-RELN-C1

  preregistered_prediction:
    quantity: "solve_gap, attempt cost, and the three log-log slopes"
    formula: >-
      solve_gap = 0 for any complete decider that finishes.
      attempt cost = C(B+m-2, m-1) root-findings (= B at m = 2).
      attempts per relation ~ m! N / (2^m B^m); cost per attempt ~ B^{m-1}/(m-1)!;
      product ~ m N / 2^m, independent of B; total over B relations ~ m N / 2^m.
    source: >-
      Completeness by specialisation (KN-TECH-002's degree bound 2^{n-2} in each
      variable) combined with KN-FIND-007's exact mean C(2B+m-1,m)/N and the small-mu
      Poissonisation HEUR-RELN-C2. Derived in H-RELN-f697be part 3 before this
      contract was written. Baseline reproduction: the resulting Theta(N) total must
      be WORSE than rho's Theta(sqrt(N)), reproducing KN-TECH-003's standing position;
      anything sub-sqrt(N) indicates an error and stops the run.

  stages:
    - id: STAGE-1-DERIVE
      cost: "zero compute"
      description: >-
        Write out the completeness argument and the cost product. Check the total
        against KN-TECH-003's standing position. IF THE DERIVED TOTAL IS BELOW
        Theta(N) OR BELOW rho, STOP -- the derivation is wrong and that is the
        cheapest decisive gate here.
      can_terminate_run: true
      terminates_what: "The whole contract, before any code."
    - id: STAGE-2-PROTOCOL-TRACE
      cost: "zero compute"
      description: >-
        Re-read the frozen protocol and quote, with line references, the exact path
        from a TIMEOUT to declared_p_lower_solve to the ICEX feed -- or record that
        the path does not exist as described, in which case the rule-3 half of
        H-RELN-f697be is withdrawn in those words.
      can_terminate_run: false
    - id: STAGE-3-COMMIT
      cost: "zero compute"
      description: "Write and hash the forced-value table."
      can_terminate_run: false
    - id: STAGE-4-GROUND-TRUTH
      cost: "seconds"
      description: >-
        At bits = 8, compute DEC-ENUM ground truth for every target and every cell.
        Run POS-PLANTED and NULL-UNDECOMPOSABLE. Require exact completeness and the
        forced null cost.
      can_terminate_run: true
      terminates_what: "All negative conclusions if POS-PLANTED fails; the contract if completeness fails."
    - id: STAGE-5-LADDER
      cost: "minutes"
      description: >-
        Run DEC-ENUM and DEC-BASELINE on the TGT-RANDOM cohort across the full ladder.
        Report solve_gap, success_set_identity, attempt costs, the three slopes, and
        the end-to-end total against m*N/2^m.
      can_terminate_run: false
    - id: STAGE-6-DECLARED-ARM
      cost: "attempt only"
      description: >-
        Attempt to instantiate DEC-DECLARED. Record success or the exact import
        failure. If instantiable, measure the speedup ratio at matched success set. If
        not, report INFRASTRUCTURE REQUEST and leave solver_speedup_ratio UNKNOWN.
      can_terminate_run: false
    - id: STAGE-7-RANK-CONTEXT
      cost: "minutes"
      description: >-
        Compute relation_rank on the collected relations as descriptive context for
        HEUR-RELN-C3, explicitly drawing no conclusion, and note that relation rank
        and independence are excluded from this contract's scope.
      can_terminate_run: false

  replication:
    seeds:
      - "EXP-RELN-66c1ab/v1|curve-a|<bits>|<t>"
      - "EXP-RELN-66c1ab/v1|curve-b|<bits>|<t>"
      - "EXP-RELN-66c1ab/v1|fb|<bits>|<index>"
      - "EXP-RELN-66c1ab/v1|target|<bits>|<index>"
      - "EXP-RELN-66c1ab/v1|plant|<bits>|<index>"
    independent_instances: 3
    trials_per_cell: 256
    replication_note: >-
      256 trials per cell matches the frozen protocol's per-stratum maximum so that
      cost comparisons are made at the design's own cohort size. At bits = 8 the
      ground truth is exhaustive rather than sampled, so that cell carries no sampling
      uncertainty at all and is reported separately.

  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 3
    maximum_memory_gb: 2
    maximum_runs: 24
    unit_note: >-
      Charged in three separate units -- root-findings, group operations, wall clock
      -- reported side by side and never summed. Root-findings is the primary unit
      precisely because it is implementation-independent and wall clock is not.

  stopping_rules:
    - id: STOP-DERIVATION-BELOW-RHO
      condition: "The derived end-to-end total is below Theta(sqrt(N))."
      action: "Stop; the derivation contradicts KN-TECH-003 and is wrong."
    - id: STOP-INCOMPLETE-BASELINE
      condition: "DEC-BASELINE misses any decomposition found by DEC-ENUM."
      action: "Stop; completeness is refuted, H-RELN-f697be falls, and no negative may be reported."
    - id: STOP-POSITIVE-CONTROL-FAILS
      condition: "POS-PLANTED not returning success on every planted trial."
      action: "Stop; NO negative result from any arm may be reported."
    - id: STOP-NULL-EARLY-EXIT
      condition: "NULL-UNDECOMPOSABLE costing less than the full C(B+m-2, m-1) specialisations."
      action: "Stop; charged cost is data-dependent and cross-arm cost comparison is invalid until fixed."
    - id: STOP-SET-INEQUALITY
      condition: "Equal success RATES with unequal success SETS between deciders."
      action: "Stop; investigate before any rate is reported."
    - id: STOP-BUDGET
      condition: "Budget exhausted."
      action: "Report as infrastructure outcome."

  invalidation_rules:
    - "Any trial in which the two deciders saw different targets, factor bases, curves, m or B."
    - "Any cost figure formed by summing across units."
    - "Any inclusion of a censored trial in a denominator without a per-trial censoring flag recorded."
    - "Any slope fitted over cells with mu >= 0.3, which are outside the small-mu regime by pre-registration."
    - "Any seed not present in the pre-execution manifest, or any adaptive reseeding."
    - "Any reported speedup ratio computed over trial sets that are not identical as sets."

  infrastructure_failure_disposition: >-
    Timeouts, crashes, memory exhaustion, missing dependencies and import failures are
    INFRASTRUCTURE SIGNAL, recorded with exact error text, and are NEVER negative
    mathematical evidence (AGENTS.md rule 3). This contract is the one place in the
    RELN lane where that rule is load-bearing rather than boilerplate, because the
    finding under test is precisely that the frozen protocol converts censoring into a
    probability. Concretely: every trial carries a per-trial flag in
    {COMPLETED, TIMEOUT_CENSORED, RESOURCE_EXHAUSTION, INFRASTRUCTURE_FAILURE,
    IMPLEMENTATION_FAILURE}; censored trials are reported in a SEPARATE denominator
    from completed ones; and no headline rate is computed over a mixed denominator.
    DEC-DECLARED failing to instantiate (expected: sympy and Sage absent) yields an
    INFRASTRUCTURE REQUEST and leaves solver_speedup_ratio UNKNOWN; it does not become
    a statement that the Groebner arm is slow, absent, or unnecessary.

  scale_relevance:
    tier: toy
    justification: >-
      Completeness and the cost product are exact statements independent of field
      size, so the toy measurement checks derivations. The B-invariance is derived in
      the small-mu regime at fixed arity and holds asymptotically as arithmetic, but
      every measured cost, rate and rank here is toy and transfers to nothing. The
      Theta(N) total is a restatement of KN-TECH-003's existing position and is
      explicitly not offered as a new negative result about the ECDLP. The derivation
      does NOT apply to extension fields, where success probability is a constant
      rather than a B-power and the two factors do not cancel; that boundary is stated
      in the report.
    correspondence: null

  tail_checks:
    - "Report the cells with mu >= 0.3 separately; the product must bend there for the honest reason that coverage saturates, and that bend must not be read as a falsification."
    - "Report the largest observed per-attempt cost against the derived worst case; an excess indicates an early-exit or caching artifact."
    - "Report the distribution of censoring flags per decider, not just their mean."

  success_criterion: >-
    All of: (a) the derived total is Theta(N), worse than rho, reproducing
    KN-TECH-003; (b) DEC-BASELINE and DEC-ENUM agree as SETS on every trial at every
    cell; (c) solve_gap is exactly 0 with zero censored trials under DEC-BASELINE;
    (d) attempt cost equals the forced count exactly; (e) NULL-UNDECOMPOSABLE costs
    the full amount with success 0; (f) POS-PLANTED succeeds on every planted trial;
    (g) the two component slopes are non-zero, opposite, and match -m and +(m-1)
    within fit error while the product slope is 0; and (h) budget_headroom is at least
    10^6. Meeting all eight supports H-RELN-f697be at toy tier and supports NO claim
    about DEC-DECLARED's merit.

  falsification_criterion: >-
    Any of: a nonzero solve_gap under DEC-BASELINE with no censoring; DEC-BASELINE
    missing a planted or ground-truth decomposition; a product slope significantly
    different from zero over the small-mu cells; the null arm exiting early; or the
    frozen protocol, on re-reading, excluding censored trials from the ICEX
    denominator after all (which withdraws the rule-3 half specifically, not the whole
    hypothesis). Each is reported as a refutation of the corresponding part.

  required_artifacts:
    - "The committed forced-value table and its SHA-256, written before execution."
    - "Per-trial records: target, decider, success bit, charged cost in each unit, censoring flag."
    - "Success-set comparisons as sets, per cell, for every available decider."
    - "The three fitted log-log slopes with their fit errors and the cells included."
    - "The measured end-to-end total against the derived m*N/2^m."
    - "The verbatim protocol quotations tracing TIMEOUT to the ICEX pin, with line references, or the finding that the path does not exist."
    - "The environment report and, if DEC-DECLARED is blocked, the infrastructure request."
    - "The relation-rank table, labelled descriptive-only."
    - "The full seed manifest, enumerated before execution."
    - "A statement of which stage terminated the run, if any."

  assigned_to: executor
