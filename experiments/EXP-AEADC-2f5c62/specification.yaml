experiment:
  id: EXP-AEADC-2f5c62
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-ee3447; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-ee3447
  question_id: RQ-AEADC-8db132
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Run a three-rung primitive-substitution ladder over four AEAD-mode measurements and issue
    an insensitivity-plus-sensitivity validity verdict per measurement against a pre-registered tolerance
  objective: 'The one uncertainty a run reduces is whether the measurements this bucket produces are
    measuring the composition at all. Concretely: (i) does each measurement return the same value,
    within a pre-registered tolerance in its own units, when the primitive slot holds a seeded ideal
    permutation and when it holds a pinned real block cipher, which is the insensitivity condition
    the bucket''s modelling assumption demands and which a primitive-contaminated measurement fails;
    (ii) does each measurement MOVE by more than that tolerance when the slot holds a permutation
    carrying a declared, separately verified structural property, which is the sensitivity condition
    a measurement that reads nothing at all fails; (iii) is the ladder itself sound, established by
    requiring the length-only straw measurement to show zero divergence at every rung and the deliberately
    primitive-level positive control to diverge between rungs one and two, so that neither a pass
    nor a fail can be produced by the driver rather than by the measurement. A run therefore returns
    a validity verdict per measurement together with the tolerance-to-error-bar ratio that says whether
    the verdict was resolvable at all, and an unresolvable verdict is reported as undecided rather
    than as a pass.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for the four measurements
      as run at the declared parameters, with the three declared primitive-slot occupants and the
      pre-registered tolerance, the observed divergences were as reported and the verdicts follow
      mechanically from them. What does NOT follow: that any measurement is correct, since the ladder
      tests responsiveness and not correctness; that any existing ledger record is valid or invalid,
      since no existing record is run here; anything about the program''s cost model, timing or machine
      variance, which this contract does not touch; any attack, break or security consequence; and
      any general statement about weakness, since a rung-three failure is attributable only to the
      one declared structural property of the constructed weak permutation.'
  inputs:
    procedure: 'STAGE 0, zero compute: define the three rungs, the weak permutation''s structural
      property and its checking predicate, the divergence statistic and the tolerance; hash the file.
      STAGE 1, minutes: implement the three primitive-slot occupants and validate the real block cipher
      against published test vectors. STAGE 2, minutes: verify the weak permutation''s structural
      predicate directly on the constructed object. STAGE 3, hours of human effort: refactor the four
      measurements to accept a primitive-slot object as an argument, so all rungs run in one invocation.
      STAGE 4, cost equal to three times the smallest run of each measurement, likely under two core-hours
      total: execute the twelve measurement-by-rung cells with matched seeds. STAGE 5, minutes: compute
      both divergences per measurement, compute the tolerance-to-interval ratio, and issue pass, fail
      or undecided verdicts. STAGE 6, zero compute: emit the ladder table, the straw and positive-control
      rows, and the predicate check into an immutable run record via harness/runner.py.'
    instrument: 'Python 3, standard library only. Three primitive-slot modules exposing one interface:
      a seeded lazily-sampled bijection, a pinned pure-Python block cipher validated against published
      test vectors, and a constructed weak permutation with a verifiable structural predicate. One
      ladder driver that takes a measurement callable and a slot object. The four measurements are
      the mode-level ones from this batch at their smallest parameters, plus a deliberately primitive-level
      statistic and a length-only straw statistic written for this contract. Manifest emission and
      seeding through harness/runner.py, following harness/ctrl_valueshuffle.py. No Sage, no timing
      measurement of any kind, no network.'
    parameters: Three rungs. Four measurements. Each mode-level measurement run at the smallest parameter
      set its own contract declares, so the ladder costs a fraction of the full measurement. Weak
      permutation constructed at the same width as the ideal permutation, with a declared fixed-point
      set of size 2^(w/2) at width w, or an equivalent named property fixed in stage 0. Tolerance
      declared per measurement in its own units in stage 0. Matched seed schedule across rungs for
      every source of randomness that does not feed the primitive slot. Twelve measurement-by-rung
      cells total, plus one predicate check.
  controls:
  - Straw length-only measurement as the negative control, which must show zero divergence at every
    rung.
  - A deliberately primitive-level measurement as the positive control for the insensitivity rung,
    which must diverge between rungs one and two.
  - Direct verification of the weak permutation's declared structural predicate on the constructed
    object.
  - Matched seeds across rungs wherever the seed does not feed the primitive slot.
  - Pre-registered tolerance and divergence statistic, hashed before any rung runs.
  - Test-vector validation of the pinned real block cipher before rung two.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The straw measurement, constructed in advance to be primitive-blind:
    a statistic computed from the mode''s input and output LENGTHS only, which cannot depend on the
    primitive by construction and which must therefore return an identical value at all three rungs.
    It is executed in the same invocation by the same ladder driver as the real measurements. For
    the ladder to mean anything, the straw must fail rung three -- it must show zero sensitivity to
    the weak permutation -- and if the ladder passes the straw, the ladder itself is broken and no
    verdict it issues can be believed. A second control is the weak permutation''s own property predicate,
    checked directly on the constructed object, because a weak object that does not carry its declared
    property makes rung three a null test dressed as a control.'
  independent_variables:
  - 'primitive-slot occupant: ideal permutation, real block cipher, declared weak permutation'
  - measurement under test
  - measurement parameter set, held at each measurement's declared smallest
  metrics:
    primary:
    - ideal-versus-real divergence per measurement in its own units
    - ideal-versus-weak divergence per measurement in its own units
    - 'validity verdict per measurement: pass, fail or undecided'
    - ratio of pre-registered tolerance to each measurement's confidence-interval half-width
    - straw measurement divergence at each rung
    secondary:
    - result of the weak permutation's structural predicate check
    - divergence of the primitive-level positive control between rungs one and two
    - seed-match verification across rungs
    - wall-clock per cell, recorded for reproducibility only and never used as a metric
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The straw measurement's divergence at every rung, and the weak permutation's structural
      predicate.
    formula: 'Straw: the length-only statistic is a function of input and output lengths alone, so
      its value is identical at all three rungs and both divergences are exactly zero, with no tolerance
      needed. Weak permutation predicate: for the declared property of a fixed-point set of size s
      at width w, the check counts inputs x with P(x) equal to x and requires the count to equal s
      exactly; for any alternative property fixed in stage 0, the predicate is stated in the same
      exact, countable form. Divergence statistic: for a measurement returning a scalar with a confidence
      interval, divergence is the absolute difference of the two rung values divided by the pre-registered
      tolerance for that measurement; for a measurement returning a surface, divergence is the maximum
      absolute cellwise difference over matched cells, divided by the same tolerance.'
    source: Pre-registered in the parent proposal IDEA-20260816-ee3447 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Every rung runs at the smallest parameter set each underlying measurement declares,
      which is deliberate: a validity ladder that costs as much as the measurement it validates will
      not be run. The transfer assumption is stated and bounded: a verdict is issued for a measurement
      AT the parameters run, and the contract explicitly declines to extend a verdict to the same
      measurement at larger parameters, because a measurement can become primitive-sensitive as its
      parameters grow. The tolerance-to-interval ratio is reported precisely so a reader can see whether
      a verdict at small parameters was even resolvable before deciding whether to rerun the ladder
      at larger ones.'
    correspondence: null
  tail_checks:
  - Measurements whose tolerance-to-interval ratio falls below two are reported as undecided rather
    than as passes, and the required sample size to resolve them is computed and stated.
  - Cells where the weak permutation's fixed points fall outside the measurement's input range are
    flagged, since rung three then cannot act.
  - The primitive-level positive control is checked for a divergence that exceeds tolerance by a large
    factor, which would suggest the tolerance is set far too tight.
  - Matched-seed verification is checked cell by cell rather than assumed from the driver's configuration.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt and report the ladder invalid if the straw measurement shows nonzero divergence at any rung.
  - Halt if the weak permutation fails its structural predicate.
  - Halt and report the insensitivity rung untested if the primitive-level positive control shows
    no divergence between rungs one and two.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A completed twelve-cell ladder in which the straw shows zero divergence everywhere,
    the weak permutation passes its predicate, the primitive-level positive control diverges between
    rungs one and two, and every measurement carries a stated verdict with its tolerance-to-interval
    ratio.
  falsification_criterion:
  - The straw measurement diverges at any rung.
  - The weak permutation fails its declared structural predicate.
  - The primitive-level positive control does not diverge between rungs one and two.
  - Every measurement returns undecided, meaning the ladder is unresolvable at these parameters.
  - Every mode-level measurement fails rung three, in which case the record must state whether the
    likelier explanation is orthogonality of the declared property or blindness of the measurements,
    and must not assert the second without a second declared property.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-ee3447
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The weak permutation's structural property is proposed as a fixed-point set but must be chosen
    by the Coordinator against the measurements it will grade, and choosing it after seeing results
    would void the whole ladder; a second, independently declared property would materially strengthen
    the sensitivity rung and is not budgeted here.
  - Per-measurement tolerances are required in stage 0 but no rule for setting them is given, and
    a tolerance set from the measurement's own error bars would make every verdict a pass by construction.
  - The reduction by which a real block cipher is restricted to the small widths used by the mode-level
    measurements is not specified, and a poor reduction blurs rungs two and three.
  - Whether a verdict at the smallest parameters extends to larger parameters is explicitly left open
    and would need its own contract.
