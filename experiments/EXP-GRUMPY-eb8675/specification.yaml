experiment:
  id: EXP-GRUMPY-eb8675
  hypothesis_id: H-GRUMPY-1ead49
  derived_from_idea: IDEA-20260906-7bd805
  source_idea_ids:
    - IDEA-20260906-7bd805
  question_id: RQ-GRUMPY-964876
  goal_id: null
  version: 1
  title: >-
    Target-independence census: two-instrument |C_n| agreement on a frozen
    prime ladder, with composite and random-walk nulls
  status: approved
  frozen: true
  approved_by: coordinator
  approval_decision: DEC-20260913-f79682
  approval_basis: >-
    AGENTS.md standing user authorization dated 2026-09-06 for ideas and
    complete experiment design. Coordinator checked protocol completeness
    (inputs, controls, metrics, seeds, budget, stopping/invalidation,
    success/falsification, required artifacts). Approval is not evidence.
  assigned_to: executor
  class: heuristic-validation
  scientific_execution_authorized: true
  scientific_execution_scope: >-
    Stage 0 pin and Stage 1 two-instrument census ONLY on the frozen
    fixtures. Do not run Stage 2 (ladder to 2^22, residuals, phase sweep,
    GWZ comparison). Do not run Stage 3 (elliptic consistency arm).
    Do not walk a cryptographic curve. Do not solve an ECDLP instance
    whose order is a deployed group order. Do not apply the negation map.
  execution_authorized: true
  evidence_eligible: false
  execution_admission:
    currently_admitted: false
    requirements:
      - Verified snapshot of H-GRUMPY-1ead49, EXP-GRUMPY-eb8675, DEC-20260913-f79682, TASK-20260913-cfe53f on a published branch/PR
      - Implementation under experiments/EXP-GRUMPY-eb8675/implementation/ with two independent instruments
      - Trial plan naming Stage 0 hash of closed-form tables before Stage 1
      - Fresh Executor claim via tools/goal_lanes.py before launch
  launch_gate:
    blocks_scientific_run_until:
      - Stage 0 theorem_a.json and closed_form_slices.json are hash-committed before any walk
      - Snapshot of this frozen contract is verified
      - Covered-set counter and per-target simulator do not share marking code
    does_not_block_protocol_approval: true

  objective: >-
    Decide M1 and M2 of IDEA-20260906-7bd805 on the frozen fixtures: whether
    the solved set of a declared grumpy-giants schedule is target-independent
    (two instruments agree on primes and disagree on composite l) and whether
    the one-giant / classical-BSGS slices hit their closed-form anchors.

  what_this_is_not:
    - Not an ECDLP attack or an exponent improvement.
    - Not a Bernstein-Lange instance claim unless the 23/32 pin succeeds.
    - Not Theorem B, phase READING 1/2, or a GWZ 1.25 adjudication.
    - Not the negation-map companion.
    - Not evidence until runs exist under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      On l in {1031, 4099, 16411} and the frozen S grid, with both
      instruments agreeing: the table of exact means as integer ratios,
      baseline-slice residuals, and whether any schedule point hits
      23/32 within 1/sqrt(l) at n = 1.5 sqrt(l).
    explicitly_not_supportable_under_any_outcome: >-
      A cryptographic DLP speedup; a constant at cryptographic l; novelty
      of Bernstein-Lange's unread analysis; anything about the negation map.

  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      M1 integer agreement; M2 (1,1,0) mean/sqrt(l) near 4/3 and classical
      BSGS coverage 0.5625 at n = 1.5 sqrt(l). Written before any Stage 1
      walk. Theorem B residuals are not scored in this experiment.
    formula: >-
      mean(l, S) = (1/l) * sum_{n>=0} (l - |C_n|);
      interleaved-BSGS (1,1,0) at mu=1 predicts 4/3;
      classical BSGS at 1.5 sqrt(l) predicts |C_n|/l = 0.5625;
      BL pin predicts existence of S-point with |C_n|/l = 23/32.
    source: >-
      IDEA-20260906-7bd805 Theorem A and in-record anchors; KN-LIT-7291
      abstract probabilities (retrieved); Pollard interleaved 4/3 (recalled,
      reproduced in-record from the one-giant slice).
  scale_relevance:
    tier: toy
    justification: >-
      Exhaustive all-target means are affordable only at these l. No
      transfer to cryptographic group orders is claimed.
    correspondence: null
  tail_checks:
    - NULL-B must disagree (proves-too-much if the two instruments still agree).
    - NULL-A must not be fed to the covered-set counter as if it were S.

  inputs:
    procedure: >-
      STAGE 0 (PIN, before any walk). Write theorem_a.json listing the three
      collision conditions (b=g, b=h, g=h) with the s=1 g-h-empty note and
      the in-range self-collision exclusion. Write closed_form_slices.json
      with the symbolic 4/3 and 0.5625 anchors and the 23/32 pin criterion.
      Hash both files. Do not edit them after the first Stage 1 number.
      STAGE 1. Implement a covered-set counter (bitmap / interval union on
      Z/l) and an exhaustive per-target simulator. They must not share the
      code that marks residues. Run controls first, then REAL rows.
    frozen_primes:
      - {name: L10, l: 1031, note: 'odd prime near 2^10, not 3'}
      - {name: L12, l: 4099, note: 'IDEA-20260906-7bd805 named fixture'}
      - {name: L14, l: 16411, note: 'odd prime near 2^14, not 3'}
    schedule_family_S:
      mu_grid: [1]
      s_grid: [2, 1]
      rate_vectors:
        - [1, 1, 1]
        - [1, 1, 0]
      m_rule: 'm = round(mu * sqrt(l)); record realised (m, l, phi=(l mod m)/m)'
      giant2: 'h_k = s*x - k*(m+1) with s in s_grid; s=1 empties g-h'
    charging:
      first_elements_charged: false
      precomputation_in_mean: false
      accumulate: per_addition
      detection: immediate_lookup
    independent_variables:
      - l
      - rate_vector
      - s
    seeds:
      null_a_walk: 2026091303

  controls:
    - name: NULL-B
      object: composite l = 2062 = 2*1031
      expected: two instruments disagree on |C_n| or on unique-x recovery
      blocking: true
    - name: POS-BSGS
      object: rate (1,1,0), s unused, mu=1, each frozen prime
      expected: mean/sqrt(l) within 2/sqrt(l) of 4/3
      blocking: true
    - name: POS-CLASSICAL
      object: full baby table then giant, n = 1.5 sqrt(l)
      expected: '|C_n|/l within 1/sqrt(l) of 0.5625'
      blocking: true
    - name: NULL-A
      object: truly random three-sequence walk at l=1031, seed 2026091303
      expected: covered-set counter is not applicable; simulated mean only; do not score M1 against the counter
      blocking: true
    - name: BL-PIN
      object: some point of S at n = 1.5 sqrt(l)
      expected: '|C_n|/l within 1/sqrt(l) of 23/32 at all three primes'
      blocking: false
      on_miss: 'F5 — make no Bernstein-Lange-instance claim; continue about S'

  metrics:
    primary:
      - m1_prime_agreement
      - m1_composite_disagreement
      - m2_interleaved_bsgs_4_thirds
      - m2_classical_bsgs_5625
    secondary:
      - bl_pin_23_32
      - exact_mean_numerator
      - exact_mean_denominator
      - peak_rss_bytes
      - lookup_count
  primary_metrics:
    - m1_prime_agreement
    - m1_composite_disagreement
    - m2_interleaved_bsgs_4_thirds
    - m2_classical_bsgs_5625
  secondary_metrics:
    - bl_pin_23_32
    - exact_mean_numerator
    - peak_rss_bytes
  replication:
    seeds: [2026091303]
    independent_instances: 1
  replication_plan: >-
    One Stage 0+1 package. Deterministic except NULL-A (seed 2026091303).
    Two instruments are the independent replications of each REAL integer.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    maximum_memory_gb: 4
    maximum_runs: 1
    maximum_workers: 1
  stopping_rules:
    - Stop after Stage 1 REAL rows and required controls are recorded.
    - If M1 fails on a prime, localise (n,x) and stop; do not read M2 as evidence.
    - Timeout or crash is failed_infrastructure, never a miss on Theorem A.
  invalidation_rules:
    - Using a field prime or a deployed curve order as l is invalid_measurement.
    - Editing Stage 0 hashes after the first Stage 1 number invalidates the run.
    - Shared marking code between the two instruments invalidates M1.
    - Scoring Stage 2/3 outcomes, a rho walk, or a DLP solve as Stage 1 evidence invalidates the procedure.
    - Overwriting an existing run record invalidates the procedure.
  success_criterion: >-
    M1 holds on all three frozen primes, NULL-B disagrees, and both
    blocking positive controls hold at all three primes. BL-pin miss is
    not a failure of this criterion.
  falsification_criterion: >-
    After Stage 0 hashes exist: M1 fails on a prime with a localised (n,x)
    that is not an encoding bug, OR a blocking positive control misses
    beyond tolerance at all three primes, OR NULL-B agrees on unique-x
    recovery. An encoding bug is failed_infrastructure.
  required_artifacts:
    - implementation/covered_set_counter.py
    - implementation/per_target_sim.py
    - implementation/driver.py
    - implementation/trial-plan.json
    - stage0/theorem_a.json
    - stage0/closed_form_slices.json
    - stage0/sha256.txt
    - runs/<RUN-ID>/raw-result.json
    - runs/<RUN-ID>/m1_m2_table.json
    - runs/<RUN-ID>/controls_receipt.json
    - runs/<RUN-ID>/execution-report.yaml

  scientific_boundary: >-
    Stage 0 pin and Stage 1 census on Z/l fixtures only. No Stage 2/3.
    No deployed-curve DLP. No negation map. No exponent claim.
