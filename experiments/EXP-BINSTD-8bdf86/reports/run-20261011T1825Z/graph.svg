<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">EXP-BINSTD-8bdf86 structural admissibility gate</title>
  <desc id="desc">Stage zero freezes the protocol, stage one factors x to the seventeenth minus one over F2, and both ell three and ell four are structurally inadmissible.</desc>
  <style>
    .title { font: 700 25px sans-serif; fill: #172033; }
    .label { font: 700 17px sans-serif; fill: #172033; }
    .body { font: 16px sans-serif; fill: #263449; }
    .small { font: 14px sans-serif; fill: #4b5b70; }
    .box { fill: #eef4fb; stroke: #41678f; stroke-width: 2; rx: 12; }
    .gate { fill: #fff4df; stroke: #b87518; stroke-width: 2; rx: 12; }
    .struct { fill: #f9e7e7; stroke: #a74444; stroke-width: 2; rx: 12; }
    .arrow { stroke: #41678f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#41678f"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="44" class="title">EXP-BINSTD-8bdf86 — structural gate observed in Stages 0–1</text>
  <rect x="45" y="90" width="250" height="170" class="box"/>
  <text x="70" y="125" class="label">Stage 0</text>
  <text x="70" y="155" class="body">Protocol freeze</text>
  <text x="70" y="184" class="body">n = 17; ell = 3, 4</text>
  <text x="70" y="213" class="body">band = 1.25</text>
  <text x="70" y="242" class="small">RUN-BINSTD-969bcc</text>
  <path d="M295 175 L350 175" class="arrow"/>
  <rect x="350" y="90" width="285" height="170" class="gate"/>
  <text x="375" y="125" class="label">Stage 1 gate</text>
  <text x="375" y="155" class="body">factor x^17 − 1 over F₂</text>
  <text x="375" y="186" class="body">degrees = [1, 8, 8]</text>
  <text x="375" y="217" class="body">subset-sum dimensions</text>
  <text x="375" y="246" class="small">RUN-BINSTD-6a482f</text>
  <path d="M635 175 L700 175" class="arrow"/>
  <rect x="700" y="90" width="450" height="170" class="box"/>
  <text x="725" y="125" class="label">Recorded admissible dimensions</text>
  <text x="725" y="165" class="body">[0, 1, 8, 9, 16, 17]</text>
  <text x="725" y="205" class="small">No yield ratio is evaluated unless ell is in this set.</text>
  <text x="725" y="232" class="small">Source: stage1/admissible-phi-dims.json</text>
  <path d="M925 260 L925 320 L475 320 L475 365" class="arrow"/>
  <path d="M925 320 L925 365" class="arrow"/>
  <rect x="155" y="365" width="505" height="180" class="struct"/>
  <text x="180" y="405" class="label">ell = 3</text>
  <text x="180" y="440" class="body">E-NO-TAU-CLOSED-AT-ELL</text>
  <text x="180" y="475" class="small">3 not in [0, 1, 8, 9, 16, 17]</text>
  <text x="180" y="510" class="small">structural cell; ratio = missing</text>
  <rect x="700" y="365" width="350" height="180" class="struct"/>
  <text x="725" y="405" class="label">ell = 4</text>
  <text x="725" y="440" class="body">E-NO-TAU-CLOSED-AT-ELL</text>
  <text x="725" y="475" class="small">4 not in [0, 1, 8, 9, 16, 17]</text>
  <text x="725" y="510" class="small">structural cell; ratio = missing</text>
  <text x="45" y="605" class="small">Diagram derived from sealed run artifacts; run IDs are shown in the two stage boxes.</text>
</svg>
