experiment:
  id: EXP-ECDLP-3930b1
  hypothesis_id: H-ECDLP-af453b
  version: 1
  title: >-
    Discrete-log-coordinate advantage of balanced Thue-Morse and
    Rudin-Shapiro digit statistics - measured against a keyed-random null,
    the inherited matched-marginal shuffle, an interval comparator, and a
    FOUR-RUNG planted ladder including an intermediate-scale positive, with
    the spectral-norm premise COMPUTED rather than recalled and a curve-free
    multiplicative arm carrying a pre-declared consequence
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_by: coordinator
  designed_under_task: TASK-20260904-ae82ce

  objective: >-
    Measure, on the observable that matters, whether cheap balanced digit
    statistics of a coordinate's integer lift - a family PROVABLY outside the
    reach of this program's probabilistic-regime pinning argument - behave
    like the statistics inside it. First COMPUTE the spectral norms that make
    the premise true; then measure the majority advantage and maximal Fourier
    coefficient along the discrete-log coordinate against two nulls, a
    comparator and a four-rung planted ladder; then check the decay. NO BOUND
    IS PROVED IN EITHER BRANCH. This contract is DRAFT and confers no
    execution authority.

  preregistered_prediction:
    quantity: >-
      A(v, n) = the maximal normalised Fourier coefficient of the
      plus-or-minus-one statistic v along the discrete-log coordinate, and
      ADV(v, n, s) = q_maj - 1/s, its majority advantage; BOTH DIMENSIONLESS,
      computed EXACTLY by complete enumeration of the prime-order subgroup
      plus one transform of length n. Secondary: beta, the fitted decay
      exponent in A proportional to n^{-beta}, dimensionless; and the exact
      F_p spectral norm of each statistic over [0, p), dimensionless.
    formula: >-
      PRE-REGISTERED TWO-BRANCH RULE on
      D = (digit arm) - (comparator) at matched n, before and after shuffle:
      |D| <= 0.01 at every tested n records CLOSURE; |D| >= 0.05 at three or
      more prime orders, not reproduced by the shuffle and not decaying in n,
      records LEAD; between is INCONCLUSIVE, declared in advance.
      DECAY: beta in [0.4, 0.6] for the digit arms records closure; beta at
      or below 0.25 surviving both nulls records the lead.
      FORCED SEPARATELY: the maximal-end planted positive returns beta near
      0; the INTERMEDIATE planted positive returns its own predicted
      intermediate exponent and NOT n^{-1/2}; the amplitude rung returns
      approximately half the intermediate coefficient at fixed n; the
      unbalanced diagnostic arm shows a pre-shuffle excess that the shuffle
      REMOVES; the digit spectral norms grow as powers of p while the
      comparator's grows at most polylogarithmically.
    source: >-
      The n^{-1/2} scale and the estimator come from a sibling record's
      sub-result, itself a PREDICTION rather than a validated finding. The
      intermediate planted exponent comes from the classical Thue-Morse
      exponential-sum exponent, which is RECALLED and was opened by no agent
      in this program - which is precisely why Stage 0 COMPUTES the spectral
      norms directly and why an arm whose computed norm contradicts the
      recalled fact is DROPPED rather than defended.

  inputs:
    curves: >-
      Curves screened for anomalous and smooth order before entering the run
      set; the baseline charged against the PRIME subgroup order.
    subgroup_orders: >-
      At least six PRIME orders spanning at least a 6x range in the 16 to 26
      bit band, each COMPLETELY ENUMERABLE so both statistics are exact.
    lift_convention: >-
      The canonical integer representative in [0, p), FIXED here and NAMED on
      every reported number. A balanced representative in the symmetric
      interval changes both statistics and would be a SEPARATE arm.
    arms: >-
      T1 Thue-Morse sign of x; T2 Thue-Morse sign of y; T3 Rudin-Shapiro sign
      of x; T4 the unbalanced popcount-mod-4 diagnostic, kept for cross-lane
      comparability and expected to show the marginal artifact before
      shuffle; COMPARATOR the top bit of x, an interval statistic inside the
      pinning.
    image_sizes: "s as required per arm, with the comparator matched on IMAGE SIZE and never on precision or alphabet"

  independent_variables:
    - "statistic arm T1..T4, the comparator, the nulls and the four planted rungs"
    - "prime subgroup order n across the declared band"
    - "shuffle applied versus not applied"
    - "ambient object: elliptic-curve arm versus curve-free multiplicative arm"

  null_object:
    name: >-
      NULL-2, THE MATCHED-MARGINAL SHUFFLE - inherited unchanged from the
      lane whose digit signals it killed - together with NULL-1, the keyed
      random sign. Blocking.
    construction: >-
      NULL-2. Permute the statistic's VALUES among the points of the subgroup,
      preserving the value multiset EXACTLY and destroying every dependence
      on the point. Each arm's advantage is reported BESIDE its shuffled
      advantage; an arm that matches its own shuffle is reporting MARGINAL
      IMBALANCE and nothing else. THIS IS THE CONTROL THAT KILLED AN EARLIER
      LANE'S DIGIT SIGNALS AND IT IS CARRIED FORWARD UNCHANGED, not
      re-derived and not weakened.
      NULL-1. A seeded pseudorandom function of the point encoding truncated
      to plus-or-minus one, run through the identical estimator over many
      seeds; its empirical distribution of A over seeds is the reference for
      "no structure", and its MAXIMUM over an equal number of replicates is
      the tail reference - because A is itself a maximum over n frequencies
      and its null distribution is an extreme-value law, not 1/sqrt(n).
    non_degeneracy_check: >-
      REQUIRED AND PERFORMED PER CONTROL.
      NULL-2 is non-degenerate: shuffling changes the point-to-value
      assignment while preserving the multiset, so the shuffled advantage is
      an independent draw from a distribution centred on the marginal
      contribution alone. It CAN differ from the unshuffled value - and the
      unbalanced diagnostic arm T4 demonstrates empirically that it does,
      since T4's whole excess is expected to vanish under it. If T4's excess
      did NOT vanish, the shuffle would be doing nothing and every digit
      number would be void.
      NULL-1 is non-degenerate for the ordinary reason: its A is a random
      variable with a known extreme-value spread, and the comparison is
      against that distribution rather than against a point.
      A DEGENERACY THAT IS DECLARED AND GUARDED: comparing a digit arm
      against the comparator at matched PRECISION or matched ALPHABET rather
      than matched IMAGE SIZE would confound alphabet growth with advantage.
      The comparator is matched on IMAGE SIZE only, and matching on anything
      else is an invalidation below.
    dynamic_range_demonstration: >-
      A FOUR-RUNG PLANTED LADDER, which is this design's answer to the
      objection that a control set with only a null at zero and a positive at
      the maximum shows an instrument can tell "nothing" from "everything"
      but not that it resolves the boundary where a closure is decided.
      RUNG 0, NULL-1 at advantage 0 with its extreme-value spread.
      RUNG 1, THE COMPARATOR, an interval statistic inside the pinning,
      predicted to decay like n^{-1/2}.
      RUNG 2, THE INTERMEDIATE PLANTED POSITIVE, and this is the important
      one: the Thue-Morse sign OF THE DISCRETE LOGARITHM itself - computable
      only because the scalar is known to the harness - whose Fourier
      coefficient along the scalar IS the Thue-Morse spectrum and therefore
      sits at a KNOWN INTERMEDIATE scale that does NOT decay like n^{-1/2}.
      The instrument must resolve it as strictly between the comparator and
      the maximal-end positive, and must return its own predicted exponent
      rather than 1/2.
      RUNG 3, THE AMPLITUDE RUNG, added by this contract: a declared convex
      mixture of RUNG 2 with NULL-1 at mixing weight one half, predicted to
      return approximately HALF the coefficient of RUNG 2 at fixed n. This
      tests AMPLITUDE resolution as distinct from EXPONENT resolution, which
      the three-rung ladder does not.
      RUNG 4, THE MAXIMAL-END POSITIVE, the discrete-log interval bucket at
      advantage near 0.5, flat in n.
      A pipeline that cannot separate all five levels has not demonstrated
      resolution at the boundary, and NO closure may be declared from it.
    curve_free_null: >-
      REQUIRED, AND HERE IT IS THE SHARPEST ARM IN THE CONTRACT. The measured
      signature is "a digit sign of the integer lift of a group element's
      coordinate, correlated against the character of its index". A
      NON-CURVE object reproduces that shape exactly: take a generator h of a
      subgroup of order n in the multiplicative group of a prime field of
      comparable size, apply the IDENTICAL statistics to the integer lift of
      h^k in [0, q), and run the IDENTICAL estimator at matched n and matched
      image size. A second, weaker curve-free rung is a fixed random
      permutation of [0, p) indexed by the scalar, which has no arithmetic
      structure at all.
    pre_declared_consequence: >-
      DECLARED IN ADVANCE, BEFORE ANY CELL RUNS, AND BINDING. If the
      MULTIPLICATIVE arm reproduces the CLOSURE branch - digit statistics at
      the comparator's level with decay exponent near 1/2 - then the closure
      branch is a statement about DIGIT SIGNS OF INTEGER LIFTS OF
      EXPONENTIALLY-INDEXED SEQUENCES IN FINITE GROUPS, and NOT about
      elliptic curves. It must be headlined as such, and no evidence record,
      decision or downstream citation may present it as an elliptic-curve or
      ECDLP result. Only a MEASURED DIFFERENCE between the elliptic arm and
      the multiplicative arm carries curve content, and any such difference
      is routed to independent review before interpretation rather than
      reported as a finding.
      STATED SO IT CANNOT BE PRESENTED AS A SURPRISE LATER: the closure
      branch is EXPECTED to reproduce in the multiplicative arm, because the
      closure prediction is the generic random-model prediction and the only
      curve-specific ingredient - the hybrid character-sum bound - is exactly
      the ingredient that does NOT reach this family. This experiment is
      therefore EXPECTED to produce a statement about finite groups, and that
      expectation is on the record before the run.

  controls:
    - >-
      NULL-1 KEYED RANDOM SIGN (blocking), with enough seeds that A's
      extreme-value reference distribution and its maximum are computed
      IN-RUN rather than approximated by 1/sqrt(n).
    - >-
      NULL-2 MATCHED-MARGINAL SHUFFLE (blocking), inherited unchanged. Every
      arm's advantage is reported BESIDE its shuffled advantage.
    - >-
      COMPARATOR, the top bit of x, matched on IMAGE SIZE (blocking), which
      must reproduce the sibling record's committed values where the primes
      overlap and must return a decay exponent consistent with 1/2.
    - >-
      PLANTED LADDER RUNGS 2, 3 and 4 (blocking). See null_object. RUNG 2 is
      the intermediate-scale positive whose absence was the specific
      objection a red team raised elsewhere in this program.
    - >-
      CONTROL C, the unbalanced popcount-mod-4 diagnostic: expected to show a
      pre-shuffle excess that the shuffle REMOVES, reproducing the earlier
      lane's artifact as a KNOWN-ANSWER CALIBRATION OF THE SHUFFLE ITSELF. If
      the shuffle does not remove it, every digit number is void.
    - >-
      STAGE 0 SPECTRAL-NORM COMPUTATION (blocking): the exact F_p spectral
      norms of both digit statistics and of the comparator, by one length-p
      transform per ladder prime, COMPUTED rather than recalled. If a digit
      norm is polylog, that arm's premise fails, the arm is DROPPED, and the
      computed norm is archived.
    - >-
      STATIC PROVENANCE CHECK (blocking): no statistic code path reads the
      scalar. A statistic that reads its own index is measuring its input.
    - >-
      MARGINAL MEASUREMENT: each arm's own marginal over the subgroup's
      x-coordinates, reported per n, since balance over the interval does not
      imply balance over the half of it that is a coordinate.
    - >-
      CURVE-FREE MULTIPLICATIVE ARM plus the random-permutation rung
      (blocking), with the pre-declared consequence above.
    - >-
      EXCLUSIONS applied before any curve enters the run set: anomalous and
      smooth-order curves; the baseline charged against the prime subgroup
      order.

  metrics:
    primary:
      - "A(v, n) = maximal normalised Fourier coefficient along the discrete-log coordinate; DIMENSIONLESS; exact, before and after shuffle, with the estimator named"
      - "ADV(v, n, s) = q_maj - 1/s; DIMENSIONLESS probability difference; exact, before and after shuffle"
      - "D = (digit arm) - (comparator) at matched n and matched IMAGE SIZE; dimensionless; the two-branch rule is applied to this"
      - "beta, the fitted decay exponent in A proportional to n^{-beta}, per arm; dimensionless, with bootstrap interval and fit residuals"
      - "the exact F_p spectral norm of each statistic per ladder prime; DIMENSIONLESS, with its fitted growth exponent in p"
      - "planted-ladder separation: the five levels (null, comparator, intermediate, amplitude rung, maximal) with their measured A and beta; all five required distinguishable"
    secondary:
      - "each arm's own marginal over the subgroup's x-coordinates, per n; dimensionless"
      - "NULL-1 empirical distribution of A and its MAXIMUM over replicates, per n; dimensionless; the tail reference"
      - "CONTROL C pre-shuffle excess and post-shuffle residual; dimensionless"
      - "curve-free multiplicative arm: A, ADV, D and beta at matched n and image size; plus the random-permutation rung"
      - "static provenance check result; boolean"
      - "wall-clock seconds and peak RSS in GiB per stage"
      - "pass or fail of every blocking gate, listed individually"

  heuristic_under_test: HEUR-DIGIT-1

  scale_relevance:
    tier: toy
    justification: >-
      Prime subgroup orders in the 16 to 26 bit band, COMPLETELY ENUMERATED
      so both statistics are exact and no estimator variance competes with
      the n^{-1/2} effect. THE BAND IS 16-26 BITS AND NOT THE SOURCE'S 16-30,
      AND THE REDUCTION IS STATED RATHER THAN MADE SILENTLY: exact
      enumeration at n near 2^30 with per-element statistic evaluation and a
      length-n transform does not fit the declared 16 GB, so the 27-30 bit
      cells are NOT TESTED and would need a separate budget. The declared
      band still spans a factor of 1024, far exceeding the 6x the decay fit
      needs. NO TRANSFER TO CRYPTOGRAPHIC n IS CLAIMED OR LICENSED, and the
      toy-scale image ratio biases TOWARD apparent structure, so a null
      result here is the harder result to obtain. THE FAMILY-LEVEL CLAIM -
      that every statistic of unbounded spectral norm is pinned - CANNOT BE
      TESTED AT ANY SCALE, because it quantifies over all statistics; three
      members are measured.
    correspondence: null

  tail_checks:
    - "The largest A observed over all digit arms and primes against the largest over an EQUAL number of NULL-1 replicates - a real effect shifts the distribution, not one cell."
    - "The single largest marginal over all arms and primes against the NULL-1 marginal maximum."
    - "The smallest ladder gap - between the intermediate positive and the amplitude rung - reported individually, since it sets the instrument's measured amplitude resolution."
    - "The smallest tested n, where the one-bit image is the largest fraction of the group and apparent structure is most likely; reported separately so a pass there is not over-read."
    - "The Rudin-Shapiro arm specifically, whose marginal bias over the interval is at the same scale as the effect being measured, reported with its own marginal beside every number."

  replication:
    seeds: [29, 31, 37, 41, 43, 47, 53, 59]
    independent_instances: 6
  seeds_policy: >-
    Eight declared seeds, fixed here before execution and never re-drawn
    after an outcome is seen. Seeds govern NULL-1's keyed function, NULL-2's
    shuffle permutations, the amplitude rung's mixing draws and the
    random-permutation curve-free rung; they do NOT affect A or ADV for the
    digit arms, which are computed by COMPLETE ENUMERATION and are therefore
    EXACT - no seed can change a reported digit number, and a "replication"
    here means a fresh curve at a fresh prime order rather than a re-seed.
    ENOUGH NULL-1 SEEDS ARE RUN THAT ITS EXTREME-VALUE REFERENCE DISTRIBUTION
    AND ITS MAXIMUM ARE COMPUTED IN-RUN, because A is a maximum over n
    frequencies and comparing it against 1/sqrt(n) rather than against an
    empirical extreme-value law would systematically over-read it. NULL-2 is
    run at multiple permutations per arm and per n so a shuffled advantage
    also carries a spread rather than a point. The scalar is known to the
    harness and STRUCTURALLY WITHHELD from every statistic path, with the
    static check blocking. Every cell record carries (curve, p, n, s, arm,
    lift convention, seed, RNG algorithm and state).

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 10
    maximum_memory_gb: 16
    maximum_runs: 10
    maximum_workers: 1
  budget_note: >-
    Sized to the work. Per (curve, arm) cell the cost is complete enumeration
    of the subgroup with an O(log p) statistic per element plus one transform
    of length n: O(n log n) operations and O(n) memory. At the top of the
    declared band, n near 2^26, that is on the order of 10^8 evaluations and
    a transform over 10^8 points, which fits 16 GB; at 2^30 it does not,
    which is exactly why the band stops at 26 bits and why the reduction is
    disclosed in scale_relevance rather than applied silently. Stage 0 adds
    one length-p transform per ladder prime. Peak RSS is a required metric so
    the envelope prediction can fail; budget exhaustion is an INFRASTRUCTURE
    outcome under AGENTS.md rule 5, never evidence about the statistics.

  stopping_rules:
    - "STAGE 0, HARD GATE: write the triangle-inequality form of the pinning and show it is VACUOUS for both digit statistics; then COMPUTE the exact F_p spectral norms of both and of the comparator at every ladder prime. If either digit norm is polylog rather than a power of p, the record's premise fails FOR THAT ARM, the arm is DROPPED, and the computed norm is archived."
    - "STAGE 1: build the exact estimator on the declared ladder, with the scalar structurally withheld and the static provenance check run."
    - "STAGE 2, HARD GATE: the comparator must reproduce the sibling record's committed values; the maximal-end positive must return advantage near 0.5 with beta near 0; the INTERMEDIATE positive must return its own predicted intermediate exponent and NOT n^{-1/2}; the amplitude rung must return approximately half the intermediate coefficient; CONTROL C must show the artifact and its removal. ANY failure STOPS the run before a digit number is recorded."
    - "STAGE 3: the digit arms with both nulls on the identical estimator, plus each arm's own marginal."
    - "STAGE 4: the curve-free multiplicative arm and the random-permutation rung."
    - "STAGE 5: ONLY if the LEAD branch fires - re-run at two further primes, then STOP and route to independent review before any interpretation."
    - "NO ATTACK IS RUN, every instance is toy and self-generated, and no key material is involved."

  invalidation_rules:
    - "Any execution while status is not approved, or while execution_authorized is false."
    - "Any statistic code path that reads the scalar, as determined by the static provenance check."
    - "Matching the comparator on precision or alphabet rather than on IMAGE SIZE. An apparent advantage growing with alphabet size is an alphabet effect, not a discrete-log effect."
    - "Comparing A against 1/sqrt(n) rather than against NULL-1's empirical extreme-value distribution. A is a maximum over n frequencies and its null is an extreme-value law."
    - "Reporting any digit number if CONTROL C's excess survived the shuffle."
    - "Reporting a digit number from an arm whose Stage 0 spectral norm turned out polylog; that arm is dropped."
    - "Mixing lift conventions within a comparison, or reporting a number without naming its convention."
    - "Presenting the closure branch as a statement about elliptic curves if the multiplicative arm reproduced it."
    - "Presenting either branch as a proof of a bound. NO BOUND IS PROVED IN EITHER BRANCH."
    - "Any post-hoc change to the 0.01 and 0.05 bands, the [0.4, 0.6] decay window, the arm set, the planted rungs or the declared field-size band. A change requires a versioned protocol_amendment before the affected cells are re-read."

  success_criterion: >-
    The run SUCCEEDS as a measurement, whichever branch it reaches, when:
    Stage 0 computes the spectral norms and either confirms the premise per
    arm or drops the arm with its norm archived; the static provenance check
    passes; the comparator reproduces the sibling record's committed values
    and returns beta consistent with 1/2; all four planted rungs separate at
    their predicted levels, including the intermediate one and the amplitude
    rung; CONTROL C shows the artifact and its removal under shuffle; A and
    ADV are reported exactly for every (arm, n) before and after shuffle with
    NULL-1's in-run extreme-value reference beside them; each arm's own
    marginal is reported; beta is fitted with residuals and intervals; the
    curve-free multiplicative arm is run and classified; and the outcome is
    declared as exactly one of CLOSURE, LEAD or INCONCLUSIVE by the
    pre-registered rule.

  falsification_criterion: >-
    THE PREMISE FAILS FOR AN ARM, and the arm is dropped with its computed
    norm archived, if Stage 0 finds that arm's spectral norm polylog in p.
    THE INSTRUMENT HAS FAILED, and nothing is reported, if the comparator
    misses its committed fixture, or if any planted rung fails to separate at
    its predicted level - in particular if the INTERMEDIATE positive is not
    resolved as strictly between the comparator and the maximal-end positive.
    EVERY DIGIT NUMBER IS VOID if CONTROL C's pre-shuffle excess survives the
    shuffle, since the shuffle is then not the control the earlier lane
    reported. THE LEAD BRANCH fires when a digit arm exceeds the comparator
    by 0.05 or more at three or more primes, surviving both nulls and not
    decaying in n - an efficiently computable statistic outside the bound's
    class with a non-decaying discrete-log correlation. STILL NO ATTACK. THE
    CLOSURE BRANCH fires when every digit arm matches the comparator within
    0.01 with beta in [0.4, 0.6]; it closes THREE ARMS, not the family, and
    PROVES NO BOUND. THE SCOPE COLLAPSES TO A NON-CURVE STATEMENT if the
    multiplicative arm reproduces the branch, and the pre-declared
    consequence then binds.

  required_artifacts:
    - "Stage 0 receipt: the vacuity derivation written out, and the COMPUTED F_p spectral norms of both digit statistics and the comparator at every ladder prime, with their fitted growth exponents, beside the recalled classical values they are meant to replace."
    - "The static provenance check receipt over every statistic code path."
    - "Per-cell records: curve, p, n, s, arm, lift convention, A, ADV, shuffled A, shuffled ADV, arm marginal, seed, estimator name, enumeration mode."
    - "The planted-ladder table: all five levels with their measured A, ADV and beta, and the pairwise separations, including the intermediate-to-amplitude gap."
    - "CONTROL C's pre-shuffle and post-shuffle values, as the known-answer calibration of the shuffle."
    - "NULL-1's empirical distribution of A per n, with its maximum over replicates as the tail reference; NULL-2's spread over permutations."
    - "The curve-free multiplicative arm's full table and its branch classification, plus the random-permutation rung."
    - "Fitted beta per arm with residuals and bootstrap intervals."
    - "Run manifest with exact command, git commit and dirty-tree state, environment and dependency versions, RNG algorithm and seeds, requested policy, resolved model identifier and probe status, stdout and stderr, peak RSS, wall clock."
    - "A report carrying, verbatim, both parts of null_object.pre_declared_consequence, including the recorded expectation that the closure branch reproduces in the multiplicative arm."

  assigned_to: executor

  limitations:
    - >-
      NO BOUND IS PROVED IN EITHER BRANCH. The closure branch is an empirical
      extension of a prediction beyond its proof, scoped to three statistics,
      six primes and one lift convention; the digit family remains without a
      theorem whatever the numbers say.
    - >-
      The lead branch is a distinguisher-scale statement and NOT an attack.
    - >-
      Nothing here bears on the earlier lane's own open items or on any join
      or tree configuration; a sum-compatibility gain and a discrete-log
      advantage are different quantities.
    - >-
      Toy-scale image ratio biases TOWARD apparent structure; the field-size
      ladder is the only defence.
    - >-
      The band is 16-26 bits, not 16-30, because exact enumeration at 2^30
      does not fit the declared memory. Stated, not narrowed silently.
    - >-
      The family-level claim cannot be tested at any scale, since it
      quantifies over all statistics.
    - >-
      The lift convention is load-bearing and a balanced representative would
      be a separate arm.
    - >-
      The two load-bearing external facts behind the premise were opened by
      no agent in this program, which is why the premise is COMPUTED at Stage
      0 and an arm whose computed norm contradicts the recalled fact is
      dropped rather than defended.
    - >-
      The closure branch is EXPECTED to reproduce in the curve-free
      multiplicative arm, so this experiment is expected to produce a
      statement about finite groups rather than about elliptic curves;
      recorded before the run so it cannot be presented afterwards as a curve
      result.
    - >-
      No status change to any record is proposed or implied.
