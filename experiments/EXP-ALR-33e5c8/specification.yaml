experiment:
  id: EXP-ALR-33e5c8
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-6fc66c; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-6fc66c
  question_id: RQ-ALR-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exact symbolic support, total degree and Newton-polytope vertex set of the ALR target-divisor
    resultant at N up to 8 over two toy primes, with a matched random-coefficient pair as the generic-support
    null
  objective: 'The run reduces one uncertainty: whether the target-divisor resultant on which H-ALR-001
    rests is a sparse object or a generic one at the degrees the lane actually uses. (i) It computes
    Res_v(W, K_P) exactly over toy prime fields for N from 2 to 8 and reports its monomial count,
    total degree, and Newton-polytope vertex count in the target interpolant coefficient variables,
    so that the object''s size is a measured number rather than an assumption. (ii) It computes the
    identical quantities for a random pair of matched bidegrees, thirty draws per cell, in the same
    invocation and by the same code path, giving a generic-support null distribution against which
    any sparsity must stand. (iii) It repeats the whole sweep at a second toy prime so that cancellation
    mod p can be separated from structure, and permutes the roots of W to confirm the support is a
    property of the object rather than of its presentation. The run measures no solve, produces no
    candidate factor, and takes no position on whether a sparse resultant can be constructed or evaluated
    cheaply.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'A run can support at most: at the tested degrees N <= 8, over
      the two tested toy primes, under the R181 chart conventions, the target-divisor resultant has
      the reported monomial count, total degree and vertex count, and these differ from a matched
      random pair by the reported ratio. What does NOT follow: that the sparsity persists at larger
      N, that it holds over other characteristics, that a sparse support implies a cheap construction
      or evaluation, that any downstream solver benefits, or that any attack, speedup or security
      consequence exists. In particular a favourable vertex ratio is a description of a polynomial
      and is not evidence for the SLP-direct constructor RQ-ALR-001 leaves open.'
  inputs:
    procedure: 'STAGE 0, setup, minutes: fix two toy primes and the R181 chart conventions read from
      H-ALR-001. STAGE 1, symbolic build, minutes: for each N in 2 to 8 construct W squarefree monic
      of degree N with independent symbolic coefficients and K_P = A_P + v*B_P with independent symbolic
      coefficients; assert independence programmatically. STAGE 2, exact resultant, the binding cost,
      expected seconds at N <= 5 and rising steeply toward N = 8: compute Res_v exactly with sympy
      under a per-cell wall-clock cap. STAGE 3, extraction, seconds: collect exponent vectors, count
      monomials, compute total degree, compute the convex hull vertex set in exact integer arithmetic.
      STAGE 4, null arm, same cost as stages 1 to 3 times thirty draws: matched random-coefficient
      pair, identical code path. STAGE 5, controls, minutes: second toy prime, root permutation, one-chart
      versus two-chart, degree-bound assertion. STAGE 6, reporting, minutes: emit both curves, their
      ratio, the meeting point, and any cell that hit the wall-clock cap, labelled an instrument limit
      rather than a result.'
    instrument: 'Python 3 with sympy for exact multivariate resultants and polynomial manipulation
      over GF(p), and a small exact integer convex-hull routine written in the experiment rather than
      pulled from a floating-point library, because vertex identity in low dimension is decided by
      exact arithmetic. Repository modules: harness/toycurve.py for the toy prime fields and curve
      conventions, harness/runner.py for deterministic seeding and run-record discipline. No Sage,
      no numerical hull, no external service.'
    parameters: 'N in {2,3,4,5,6,7,8}. Two toy primes drawn from the recorded curve families p98561,
      p100129, p99527 plus one small prime near 10^2 for the characteristic control. Chart count in
      {1, 2}. Thirty independent random draws per null cell. Per-cell wall-clock cap 1800 seconds.
      Total cells: 7 N-values times 2 primes times 2 chart counts times (1 signal + 30 null) = 868
      resultant computations, capped.'
  controls:
  - Random-coefficient pair of identical bidegrees, same invocation, thirty draws per cell.
  - Second toy prime at every cell, separating cancellation mod p from structural sparsity.
  - 'Degree-bound check: the measured total degree must match the standard resultant degree bound,
    or the implementation is wrong before anything is interpreted.'
  - 'Chart-count control: run at one chart and at two charts, since H-ALR-001 records that opposite
    points force a second x-injective chart.'
  - 'Permutation control: randomly permute the roots of W and confirm the support is invariant, since
    the object should not depend on root ordering.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): In the same invocation, compute the resultant of a pair of polynomials
    with independent uniformly random coefficients over the same F_p and identical bidegrees to the
    elliptic pair, extract the identical support, degree and vertex-set quantities, and compare. Here
    the null must DIFFER: it must exhibit the generic, essentially full vertex set predicted by the
    mixed-fiber construction. If the random arm is also sparse, the sparsity is an artifact of the
    small toy field, of the resultant routine, or of the bidegrees, not of the elliptic object, and
    no signal may be recorded. A second null at a larger toy prime separates small-field cancellation
    from structure.'
  independent_variables:
  - target_divisor_degree_N
  - characteristic_p
  - chart_count
  - arm_signal_or_null
  metrics:
    primary:
    - resultant_monomial_count
    - newton_polytope_vertex_count
    - resultant_total_degree
    - vertex_count_ratio_elliptic_over_random
    secondary:
    - null_arm_vertex_count_variance
    - second_prime_support_agreement_rate
    - root_permutation_invariance_flag
    - cells_hitting_wall_clock_cap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The vertex count of the Newton polytope of Res_v(W, K_P) in the target interpolant coefficients,
      for the elliptic pair and for the matched random pair, at each N.
    formula: 'Predicted null: vertex count equal to the vertex count of the mixed fiber polytope of
      the two input Newton polytopes, that is the generic prediction, attained by the random arm with
      probability approaching one as p grows. Predicted signal: elliptic vertex count at most 0.6
      times the null vertex count at N = 4 and above, with the ratio non-increasing in N if the sparsity
      is structural and non-monotone if it is cancellation. Total degree in both arms must equal the
      standard resultant degree bound computed per variable from the two bidegrees.'
    source: Pre-registered in the parent proposal IDEA-20260816-6fc66c before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: Degrees N <= 8 over primes near 10^5 and one near 10^2. These are far below any
      cryptographic parameter and are chosen because exact symbolic resultants stop being computable
      shortly above them. The only transfer assumption, stated and not tested, is that a support ratio
      measured over this range indicates the direction of the ratio at larger N; the entry declines
      to extrapolate the value, and a non-monotone ratio curve would withdraw even the direction.
    correspondence: null
  tail_checks:
  - Inspect the largest-N cell that completed, by hand, against the degree bound, since that cell
    carries the most weight and the most opportunity for silent truncation.
  - Report the full null distribution per cell, not its mean, because a heavy left tail in the random
    arm would explain an apparent gap.
  - Check the small-prime cell separately for support collapse, since that is where cancellation is
    most likely and its behaviour identifies the confounder.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop increasing N at the first cell that exceeds the wall-clock cap, and record that cell as an
    instrument limit rather than as a mathematical boundary.
  - Stop and report if the degree-bound assertion fails at any cell; no support number from a run
    with a failed degree check may be interpreted.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Exact resultants complete to at least N = 5 in both arms and at both primes,
    the degree-bound assertion passes everywhere, root permutation leaves the support invariant, and
    a vertex-count curve for each arm is emitted with its ratio and its meeting point.
  falsification_criterion:
  - Elliptic and random arms have statistically indistinguishable vertex counts at every completed
    N.
  - The degree-bound assertion fails at any completed cell.
  - Support differs under root permutation, so the measurement is presentation-dependent.
  - The two primes disagree on absent monomials beyond the reported tolerance.
  - No cell beyond N = 3 completes within budget, leaving nothing to interpret.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-6fc66c
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - 'The exact bidegree of the random null pair needs a Coordinator ruling: matching only total degree
    compares different constructions, while matching affineness in v may already import the structure
    under test.'
  - Whether the R181 signed chart conventions can be reconstructed from H-ALR-001 and the committed
    EXP-ALR-001 artifacts alone, or whether a source reference must be consulted, is unresolved.
  - The tolerance for declaring two vertex counts indistinguishable across thirty null draws is not
    fixed here and must be set before the run, not after.
