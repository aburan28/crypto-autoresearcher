experiment:
  id: EXP-FIND-bc1d6f
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-FIND-10256a
  question_id: RQ-FIND-001
  goal_id: GOAL-FIND-001
  source_idea_id: IDEA-20260805-6fedc7

  title: >-
    Citation-edge resolution audit of KN-FIND-017..027: a forced containment
    test for the "KN-FIND-017 Fact 2" misresolution, an offset-constancy check
    on the merge-time renumbering, and a matched control population for a
    selection gate that promoted eleven of eleven

  objective: >-
    Decide whether GOAL-FIND-001's promotion actually delivers its payload
    downstream, by classifying every citation edge into KN-FIND-017..027 into
    misresolution, reservation collision, self-reference, or valid delivery --
    using a string-containment test rather than an auditor's judgement on the
    decisive class -- and separately to decide whether the selection gate that
    produced those eleven entries had any discriminating power, by running the
    gate's own frozen rule against a matched population it could have refused.
    The contract is designed so that its CHEAPEST STAGE IS DECISIVE: stage 1 is
    a containment check between two committed files that either reproduces the
    forced result or ends the line.

  what_this_is_not:
  - It is NOT a mathematical experiment. No claim about the ECDLP, about AES,
    about any curve, field or algorithm is made or supported. Nothing here may
    be cited as cryptanalytic evidence.
  - It does NOT claim that any KN-FIND entry is wrong, unimportant, or of poor
    quality. It measures how citations to them resolve, which is a different
    question.
  - It does NOT propose renaming any record. CLAUDE.md states existing records
    are immutable and must not be renamed; a rename would invalidate every
    archive receipt binding those paths, which is precisely the failure
    KN-FIND-030 documents.
  - It does NOT assign fault to GOAL-FIND-001 or to the GOAL-AES campaigns.
    Both followed the allocation convention in force; the defect is in the
    namespace and the program already owns that mechanism as an internal
    finding.
  - It does NOT establish that any misresolution caused a downstream error.
    Whether a wrong resolution changed anyone's reasoning is not observable
    from the corpus, and the contract must not imply otherwise.
  - It does NOT edit any existing file. Its only write is a new disambiguation
    register plus the run's own artifacts.
  - It does NOT change any status, and does not generalise to the other 37
    entries in knowledge/findings/.

  claim_ceiling:
    tier: toy
    exact_scope: >-
      A run could support, at most: that named citation edges attribute
      material absent from the entry they name and present in exactly one
      other; per-entry counts of the four modes over an exhaustively enumerated
      edge population at one named commit; whether the offset over the
      misresolving set is constant; and that on the eleven-record section 1.1
      population the promotion outcome is a deterministic function of the
      strength field, together with a confusion matrix from a matched control
      population that could have falsified it. Nothing above that. The 'toy'
      label reflects a small enumerated population at one commit and carries no
      mathematical content.

  inputs:
    executing_commit: >-
      Recorded at stage 0 via `git rev-parse HEAD`; every count is bound to it.
      The repository is under concurrent write and edge counts will drift.
    audited_entries: [KN-FIND-017, KN-FIND-018, KN-FIND-019, KN-FIND-020,
      KN-FIND-021, KN-FIND-022, KN-FIND-023, KN-FIND-024, KN-FIND-025,
      KN-FIND-026, KN-FIND-027]
    candidate_resolution_targets: [KN-FIND-028, KN-FIND-029, KN-FIND-030]
    edge_population_definition: >-
      Every occurrence of the literal string KN-FIND-0XX for XX in 17..27,
      in any file under ledger/, experiments/, knowledge/, docs/ or
      coordination/, EXCLUDING the entry's own file
      knowledge/findings/KN-FIND-0XX.md. Enumerated exhaustively; nothing is
      sampled. The search paths are part of the result and are reported.
    attributed_material_extraction_rule: >-
      For each edge, the FULL PARAGRAPH containing the occurrence is read --
      not a fixed character window. The auditor records verbatim the
      substantive claim the sentence attributes to the cited id, or records
      NO_ATTRIBUTED_CLAIM when the occurrence is a bare mention, a reading
      receipt, a list item, or a reservation statement. Paragraph, not window,
      because an 80-character window cannot show whether a sentence is an
      assertion, a quotation, or a hypothetical -- and that distinction can
      invert the classification of any individual edge.
    containment_rule: >-
      An attributed claim is CONTAINED in an entry iff at least 3 of its
      distinctive technical tokens (nouns and symbols, stopwords and
      programme-generic terms excluded by a frozen stoplist) occur in that
      entry's text. The threshold 3 and the stoplist are frozen at stage 0 and
      hashed before any edge is classified.
    mode_definitions:
      A_misresolution: >-
        attributed claim is not CONTAINED in the cited entry AND is CONTAINED
        in exactly one other entry in knowledge/findings/.
      B_reservation_collision: >-
        the paragraph declares the cited id uncommitted, unallocated, or
        reserved, while the id is committed with unrelated content.
      C_self_reference: >-
        the citing file lies under coordination/goals/GOAL-FIND-001/.
      UNDECIDABLE: >-
        attributed claim is CONTAINED in the cited entry AND in at least one
        other, or in none, or the occurrence is NO_ATTRIBUTED_CLAIM outside
        modes B and C.
      VALID: everything else.
      note: >-
        The modes are evaluated in the order C, B, A, UNDECIDABLE, VALID, and
        the evaluation order is frozen so that an edge cannot be counted twice
        and so that self-reference is never reported as delivery.
    control_population_rule: >-
      For the selection-gate arm: all evidence records at ledger/ root of the
      same frozen legacy layout as the eleven, whose strength is present and is
      NOT replicated. Selected by record id ascending, exhaustively, with no
      cap unless the count exceeds 40, in which case the first 40 by id are
      taken and the truncation is reported.
    seeds:
      master_seed: 10256014
      seed_derivation_rule: >-
        No stochastic step exists -- every stage is an exhaustive enumeration
        or a deterministic containment test -- so the seed names the graded
        control's token-deletion selection only. For graded cell with deletion
        fraction f, the tokens deleted are those at indices
        {i : (master_seed * (i+1)) mod 100 < 100*f} in the attributed claim's
        distinctive-token list, indices ascending. A third party reproduces the
        graded cells bit-for-bit from this rule alone.
    frozen_artifacts:
      containment_threshold: 3
      stoplist_hash: recorded at stage 0
      mode_evaluation_order: [C, B, A, UNDECIDABLE, VALID]
      graded_deletion_fractions: [0.00, 0.25, 0.50, 0.75]
      promotion_rule_text: >-
        Extracted verbatim from DEC-20260725-024 at stage 0 and hashed BEFORE
        being applied to the control population. If the decision does not state
        a rule explicitly, that fact is recorded and the selection-gate arm is
        reported as UNRUNNABLE rather than run against a rule the auditor
        invented.

  arms_and_controls:
    treatment: >-
      Exhaustive classification of every edge into KN-FIND-017..027 under the
      frozen rules, plus the offset table over the mode-A set, plus the
      selection-gate rule applied to the eleven section 1.1 records.
    measured_null: >-
      NULL-1, the matched control population: legacy-layout evidence records
      with strength NOT replicated, of comparable age and lane. FORCED VALUE
      DERIVED BEFORE THE RUN under H-FIND-10256a S3: the frozen promotion rule
      refuses every one of them, and reproduces the eleven promotions from
      `strength` alone with zero errors. THIS NULL CAN GENUINELY FAIL -- if the
      rule promotes any non-replicated record, or refuses any replicated one,
      the gate reads something beyond strength and S3 is refuted on the spot.
      It is the null the section 1.1 population structurally cannot supply,
      because on that population the outcome is constant.
    positive_control: >-
      POS-1, the forced containment check and the contract's decisive cheap
      gate. The attributed claim "Fact 2 / the obstruction is the affine layer
      L inside SubBytes / byte-wise inversion preserves GF(2^8)-collinearity"
      is tested against knowledge/findings/KN-FIND-028.md and against
      knowledge/findings/KN-FIND-017.md. FORCED VALUES DERIVED BEFORE THE RUN
      from files read on 2026-08-05: CONTAINED in 028 (which carries the
      heading "## Fact 2 - Inv preserves GF(2^8)-collinearity; the affine layer
      L does not"), NOT CONTAINED in 017 (whose scoped claim is about Newton
      box-saturation of target-sectioned Semaev systems and shares no technical
      vocabulary). If this does not reproduce, the session reading was wrong
      and NO result from this contract may be reported.
    negative_control: >-
      NEG-1, required, and the specific defence against a classifier that flags
      everything. Run the identical classifier on at least 10 edges KNOWN to be
      correct: GOAL-AES records citing KN-FIND-028, -029 or -030 for material
      those entries do contain. FORCED: every one classifies as VALID. IF ANY
      KNOWN-CORRECT EDGE IS CLASSIFIED MODE A, the classifier has no
      specificity and no mode-A count may be reported from any run.
    nearby_object_control: >-
      NEG-1 doubles as the nearby-object control and this is deliberate: the
      edges into 028/029/030 come from the SAME authors, the SAME files and the
      SAME period as the mode-A candidates, differing only in whether the cited
      id matches the attributed content. A classifier that cannot separate that
      pair is keying on the family boundary -- "an AES file citing a Semaev
      finding must be wrong" -- rather than on content, and would have found
      the same result on a corpus with no defect at all. This arm is therefore
      the one that decides whether the method measures resolution or measures
      unfamiliarity, and it is mandatory.
    graded_control: >-
      GRAD-1, four cells with monotonicity reported. Delete 0, 25, 50 and 75
      percent of the attributed claim's distinctive tokens (by the frozen
      derivation rule) and re-classify. FORCED at the endpoints: VALID at 0
      percent for a known-correct edge; UNDECIDABLE -- not mode A -- at 75
      percent, where too few distinctive tokens remain for containment to mean
      anything. The two interior points localise how much attributed text the
      method needs. A mode-A verdict at 75 percent means the classifier
      fabricates resolutions from thin evidence and every mode-A count is void.
    ordering_control: >-
      POS-1, NEG-1, NULL-1 and GRAD-1 are executed and their verdicts written
      before the edge population is classified. The classifier script, the
      stoplist, the containment threshold and the promotion rule text are all
      hashed beforehand. The stage-3 control-population result is committed
      before the stage-2 edge counts are looked at.
    self_reference_policy: >-
      Mode-C edges are COUNTED AND REPORTED per entry, never silently removed.
      A reader must be able to see that a large share of KN-FIND-017's edges
      are the promotion citing itself and judge the remainder accordingly.
      Silently subtracting them would hide the reason the raw citation count is
      not a valid comparator.
    comparability_policy: >-
      Modes are compared only within the enumerated edge population at one
      commit. Counts are never converted to rates without their denominators,
      and per-entry counts are never pooled into a corpus statistic.

  stages:
    order: cheapest-first, each stage naming whether it can terminate the run
    stage_0:
      name: reading and freezing
      cost: about two hours, zero compute, zero network
      actions:
      - record `git rev-parse HEAD`
      - READ knowledge/findings/KN-FIND-030.md IN FULL and record whether it
        already enumerates the GOAL-FIND-001 / GOAL-AES instance. If it does,
        the collision half is a rediscovery, must cite it, and the novelty
        claim is withdrawn
      - read the GOAL-AES paragraphs containing every edge into 017/018/019 in
        full, and record each attributed claim verbatim
      - extract and hash the promotion rule from DEC-20260725-024; if no
        explicit rule exists, mark the selection-gate arm UNRUNNABLE
      - freeze and hash the stoplist, the containment threshold, the mode
        evaluation order and the classifier script
      can_terminate: >-
        YES. If KN-FIND-030 already enumerates this instance, the run may stop
        and report a rediscovery.
    stage_1:
      name: instrument characterisation
      cost: seconds
      actions: [POS-1 forced containment, NEG-1 known-correct edges, GRAD-1 token deletion]
      can_terminate: >-
        YES, decisively. POS-1 failing to reproduce ends the run. NEG-1 flagging
        a known-correct edge ends the run. A mode-A verdict in GRAD-1's 75
        percent cell ends the run.
    stage_2:
      name: exhaustive edge classification
      cost: minutes of compute, about two hours of reading
      actions:
      - enumerate and classify every edge; emit the full edge table
      - compute the offset table over the mode-A set and the constancy verdict
      - report distinct-sentence count beside edge count, so copy-paste
        multiplicity is visible
      can_terminate: NO
    stage_3:
      name: selection-gate control
      cost: about one hour
      actions:
      - build NULL-1, apply the frozen promotion rule, emit the confusion matrix
      - report the BATCH-001 to BATCH-002 draft diff as the review instrument's
        positive control, with the changed-line count and what changed
      can_terminate: NO

  metrics:
    primary:
    - name: forced_containment_result
      definition: >-
        Containment of the Fact-2 attributed claim in KN-FIND-028 and in
        KN-FIND-017.
      preregistered_value: {KN-FIND-028: CONTAINED, KN-FIND-017: NOT_CONTAINED}
    - name: mode_counts_per_entry
      definition: >-
        For each of KN-FIND-017..027, the count of edges in each of A, B, C,
        UNDECIDABLE, VALID, with the total.
      preregistered_value: >-
        n_mode_A summed over all entries is predicted >= 3. No per-entry value
        is preregistered, and no threshold for "enough" VALID edges is
        preregistered, because inventing one would be unfalsifiable; the
        reporting rule is preregistered instead.
    - name: offset_constancy
      definition: >-
        Over the mode-A set, the multiset of (resolving entry number minus
        cited entry number).
      preregistered_value: >-
        Constant and equal to 11 for every mode-A edge into 017/018/019. A
        single deviant offset refutes S2 while leaving S1 intact.
    - name: selection_gate_confusion_matrix
      definition: >-
        Applying the frozen promotion rule to the eleven replicated records and
        to NULL-1.
      preregistered_value: >-
        11 promoted of 11 replicated, 0 promoted of the non-replicated control,
        and the outcome reproducible from `strength` alone with zero errors.
    secondary:
    - distinct-sentence count beside the edge count, per mode
    - mode-C count per entry, reported not subtracted
    - NEG-1 pass rate over >=10 known-correct edges
    - GRAD-1 classification per deletion cell with the monotonicity verdict
    - stage-0 result on whether KN-FIND-030 already enumerates this instance
    - the BATCH-001 to BATCH-002 draft diff -- changed-line count, line and
      word counts of both drafts, and an enumeration of what changed
    - the search paths used for enumeration, reported as part of the result

  preregistered_prediction:
    quantity: forced_containment_result
    formula: >-
      CONTAINED(m, E) := |distinctive_tokens(m) intersect tokens(E)| >= 3,
      with m the attributed claim "Fact 2 / affine layer L inside SubBytes /
      byte-wise inversion preserves GF(2^8)-collinearity" and E the entry text.
    value: >-
      CONTAINED(m, KN-FIND-028) = TRUE and CONTAINED(m, KN-FIND-017) = FALSE.
    source: >-
      Direct reading on 2026-08-05 of knowledge/findings/KN-FIND-028.md, whose
      section heading is "## Fact 2 - Inv preserves GF(2^8)-collinearity; the
      affine layer L does not", and of knowledge/findings/KN-FIND-017.md, whose
      scoped claim is "Toy p<=1009, m in {3,4,5}: target-sectioned Semaev
      systems are Newton box-saturated (MV=multigraded Bezout); no
      support-aware BKK solve-cost advantage in tested scope". Recorded in
      H-FIND-10256a before any authorised execution.
    second_forced_value:
      quantity: selection_gate_conditional_entropy
      value: 0
      derivation: >-
        On the section 1.1 population the strength field is constant
        (replicated, 11 of 11) and the promotion outcome is constant (promoted,
        11 of 11), so H(P | S) = 0 and I(P ; X | S) = 0 for every feature X.
        The degeneracy is unavoidable on that population, which is exactly why
        NULL-1 exists.

  replication:
    planned_runs: 1
    seeds: [10256014]
    interpretation: >-
      Every stage is a deterministic function of committed files at a named
      commit; replication across seeds would measure nothing. Replication here
      means INDEPENDENT RE-EXECUTION AT THE SAME COMMIT BY A DIFFERENT AGENT,
      which the published search paths, frozen stoplist, hashed classifier and
      seed derivation rule exist to enable. One step is irreducibly human --
      recording each edge's attributed claim from its full paragraph -- and the
      verbatim record of every attributed claim is a required artifact so that
      a second auditor can re-classify from the same inputs rather than
      re-reading.

  budget:
    maximum_runs: 1
    maximum_wall_seconds: 10800
    maximum_cpu_seconds: 1800
    maximum_peak_rss_bytes: 1073741824
    maximum_total_disk_bytes: 134217728
    maximum_workers: 1
    no_network: true
    dependencies: >-
      Python 3 with PyYAML only, plus grep and diff. VERIFIED IN THIS SESSION
      on this container: `import yaml` succeeds; `import numpy` succeeds
      (2.4.6); `import sage` FAILS. None of the failing dependencies is needed.
      The dominant cost is human reading, not compute, which is why the wall
      budget exceeds the CPU budget by a factor of six.

  stopping_rules:
  - Stop at stage 0 if KN-FIND-030 already enumerates this instance; report the
    rediscovery.
  - Stop at stage 0 and mark the selection-gate arm UNRUNNABLE if
    DEC-20260725-024 states no explicit promotion rule. Do not invent one.
  - Stop at stage 1 if POS-1 does not reproduce its forced result.
  - Stop at stage 1 if NEG-1 classifies any known-correct edge as mode A.
  - Stop at stage 1 if GRAD-1 returns mode A in the 75 percent deletion cell.
  - Stop on reaching any budget ceiling; report partial results labelled
    partial, with the unclassified edges enumerated rather than omitted.

  invalidation_rules:
  - Any modification to an existing file invalidates the run. The only
    permitted write is the new disambiguation register plus run artifacts.
  - Any rename of any record invalidates the run absolutely.
  - Classifying any edge before the stoplist, threshold, evaluation order and
    classifier were hashed invalidates the classification.
  - Reporting a mode-A count without the NEG-1 pass rate beside it invalidates
    that count.
  - Pooling mode-C edges into a delivery statistic invalidates that statistic.
  - Applying an auditor-invented promotion rule invalidates the selection-gate
    arm.
  - Reporting an edge count without the search paths invalidates the count.

  success_criterion: >-
    The run SUCCEEDS if, and only if: (a) POS-1 reproduces its forced
    containment split; (b) NEG-1 passes on at least 10 of 10 known-correct
    edges; (c) GRAD-1 is monotone with its two endpoints as forced; (d) every
    edge in the enumerated population carries a mode, a verbatim attributed
    claim, and a citing-file path, or is explicitly marked unclassifiable with
    a reason; and (e) the selection-gate arm either produces its confusion
    matrix or is marked UNRUNNABLE with the reason recorded. Success is defined
    by INSTRUMENT SOUNDNESS AND TABLE COMPLETENESS, not by the counts coming
    out any particular way. A run in which n_mode_A turns out to be 0 -- every
    edge resolving correctly, refuting the headline -- still SUCCEEDS as an
    experiment, and that is the intended design.

  falsification_criterion: >-
    H-FIND-10256a is falsified if any of: the Fact-2 material is CONTAINED in
    KN-FIND-017, or NOT CONTAINED in KN-FIND-028 (S1 falsified, hypothesis
    withdrawn entirely); the offsets over the mode-A set are not constant at 11
    (S2 falsified, S1 unaffected); the frozen promotion rule promotes any
    member of NULL-1 or refuses any replicated record (S3 falsified); or
    KN-FIND-030 already enumerates this instance (the novelty claim falls,
    the mechanism does not). Additionally, if every mode-A edge turns out to
    lie in a reading receipt or task log rather than in a record another agent
    would resolve, the finding's blast radius is near zero and MUST be reported
    at that size -- this is the hypothesis's stated principal risk, not an
    outcome to be argued around.

  infrastructure_failure_disposition: >-
    A crash, timeout, unreadable file, encoding error or grep failure is
    INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE MATHEMATICAL EVIDENCE
    (AGENTS.md rule 3), and in this contract is never negative evidence of any
    kind. Specifically: a file that cannot be read is reported as UNREADABLE in
    its own column and is NOT counted as containing zero edges, because
    "no edges found" and "could not look" are different facts. An
    infra_failure_receipt names the failing component, the command, and what
    remains unmeasured.

  scale_relevance:
    tier: toy
    transfer_argument: >-
      There is no scale dimension: the edge population is enumerated
      exhaustively at one commit, so the result is exact for its population and
      involves no extrapolation. Nothing generalises to the other 37 entries in
      knowledge/findings/ without repeating the measurement, and the contract
      forbids the generalisation explicitly. What may generalise, and only as a
      hypothesis for other campaigns to test on their own records, is the
      MECHANISM: any two campaigns that allocated identifiers by scanning a
      local tree may have produced the same collision, and the containment test
      is reusable against any pair of candidate entries at negligible cost.

  required_artifacts:
  - run manifest with the executing commit sha and resolved environment
  - the frozen stoplist, containment threshold, mode evaluation order and
    classifier script, with hashes and freeze timestamps demonstrably before
    the first classification
  - the verbatim promotion rule extracted from DEC-20260725-024, with its hash,
    or an explicit record that none exists
  - POS-1 output showing both containment computations with the token sets
  - NEG-1 table over >=10 known-correct edges
  - GRAD-1 table over the four deletion cells with the monotonicity verdict
  - the full edge table -- citing file path, cited id, verbatim attributed
    claim or NO_ATTRIBUTED_CLAIM, containment results against every candidate
    entry, assigned mode, resolving id where mode A
  - per-entry mode counts with totals and distinct-sentence counts
  - the offset table and constancy verdict
  - the selection-gate confusion matrix, or the UNRUNNABLE record
  - the BATCH-001 to BATCH-002 draft diff artifact with its changed-line count
  - stage-0 finding on KN-FIND-030, quoted
  - the disambiguation register as a NEW file, mapping (citing record, cited
    id) to resolved id for every mode-A edge, with an explicit statement that it
    supersedes nothing and renames nothing
  - an infra_failure_receipt if any stage failed for infrastructure reasons

  approval_requirements:
  - Coordinator approval is required before execution. No approved_by field is
    present and none may be added except by Coordinator action.
  - The Coordinator should decide separately whether the disambiguation
    register is filed as a correction, a knowledge entry, or a coordination
    artifact. This contract produces the content and takes no position.
  - The Coordinator should note that a confirmed mode-A set concerns records
    owned by GOAL-AES-001/002/003, not by this goal, and that any corrective
    action in those trees belongs to their owners. This contract reads them and
    writes nothing to them.

  approval_status: >-
    NOT APPROVED. status is review_required, frozen is false,
    execution_authorized is false, evidence_eligible is false. No run has
    happened and nothing in this file is evidence.
