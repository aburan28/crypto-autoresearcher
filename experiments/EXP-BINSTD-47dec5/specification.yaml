# EXP-BINSTD-47dec5
# Solver-race count arithmetic. No matrix is solved.
# Approved by DEC-20261003-576c8f.
experiment:
  id: EXP-BINSTD-47dec5
  hypothesis_id: H-BINSTD-181d14
  source_idea: IDEA-20261002-79a077
  question_id: RQ-BINSTD-b6f698
  version: 1
  title: Hour cap versus the cell count
  status: approved
  frozen: true
  designed_at: '2026-10-03'
  approved_by: coordinator
  approval_decision_id: DEC-20261003-576c8f
  objective: >-
    Check the product 48, the cross 1, and the n product 12121.
  inputs:
    n_sum: 71
    n_product: 12121
    gap_lo: 6
    gap_hi: 8
    gap_product: 48
    span: 14
    cells: 6
    hour_cap: 8
    hour_cells: 48
    hour_excess: 2
    surplus_cross: 1
    surplus_product: 6
    under_lo: 100
    under_mid: 108
    under_hi: 114
    under_product: 1231200
  controls:
    - >-
      Eight times 6 is 48, and 6 times 8 is 48. Reporting one
      surplus makes 8 times 3 equal 24 and invalidates the run.
    - >-
      The surplus 2 against 3/2 has cross 1. The product of 3 and 2
      is 6, equal to the cell count. Eight exceeds 6 by 2.
    - >-
      The n sum is 71 and the n product is 12121. The span is 14.
      The product of 100, 108, and 114 is 1231200.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {hour, surplus, product}
    - route in {cells, gaps}
  metrics:
    primary:
      - hour_cells
      - surplus_cross
      - n_product
      - implementations_agree
    secondary:
      - gap_product
      - surplus_product
      - under_product
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      Eight times 6 is 48. The surplus 2 against 3/2 has cross 1.
      The product of 17, 23, and 31 is 12121.
    formula: >-
      Multiply 8 by 6. Multiply 6 by 8. Cross 2 with 3/2. Multiply
      17, 23, and 31.
    source: >-
      IDEA-20261002-79a077 states the n list 17, 23, and 31, the
      surplus multipliers 3/2 and 2, and the hour cap 8, read
      2026-10-03. It does not name the threshold as an integer. The
      products were recomputed in this design session. That
      computation is not a run. No matrix was solved.
  scale_relevance:
    tier: toy
    justification: Three listed n values and one written hour cap. No transfer to a solver race.
    correspondence: null
  tail_checks:
    - The cross 1 and the n product 12121 are required. A check that stops at the product 48 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the product 48 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The product is not 48.
    - The cross is not 1.
    - The n product is not 12121.
    - One surplus is reported, or a matrix is solved.
  success_criterion: >-
    Both runs agree that 8 times 6 is 48, that 6 times 8 is 48,
    that the surplus 2 against 3/2 has cross 1, and that the
    product of 17, 23, and 31 is 12121.
  falsification_criterion: >-
    The runs agree that 8 times 6 is computed, and that product is
    not 48.
  required_artifacts:
    - experiments/EXP-BINSTD-47dec5/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-BINSTD-47dec5/runs/<RUN-ID>/command.txt
    - experiments/EXP-BINSTD-47dec5/runs/<RUN-ID>/stdout.log
    - experiments/EXP-BINSTD-47dec5/runs/<RUN-ID>/stderr.log
    - experiments/EXP-BINSTD-47dec5/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-BINSTD-47dec5/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any matrix build, solver race, or wall-time measurement.
    - Any claim that one solver is cheaper than another.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
