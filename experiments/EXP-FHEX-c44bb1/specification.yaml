experiment:
  id: EXP-FHEX-c44bb1
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-63a0ea; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-63a0ea
  question_id: RQ-FHE-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Locate the modelled and the measured decryption-failure level for a fixed levelled circuit
    at toy parameters, report their integer gap at three declared failure fractions, and repeat on
    a synthetic model-variance null population.
  objective: 'The one uncertainty a run reduces is whether the slack between an FHE noise model and
    measurement is large enough to move the level index at which correctness fails, which is the unit
    in which bootstrapping placement is actually decided. (i) It fixes one correctness threshold and
    one transcribed recursion, and computes L_model from them without touching a ciphertext, so the
    modelled coordinate is auditable in isolation. (ii) It measures the empirical decryption-failure
    fraction at every level over a large input set and reads L_meas at three declared fractions, making
    the fraction-dependence of the answer an output rather than an analyst choice. (iii) It runs the
    identical level-reading on a synthetic population whose per-level noise is drawn independently
    at the model''s own predicted variance, which separates two very different explanations for a
    positive gap: accumulated evaluation structure, versus a pre-existing distance between the model''s
    variance prediction and its own tail bound. Without arm (iii) a positive gap is uninterpretable,
    and establishing that is the run''s most durable output whichever way the number falls.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable scope is: for this transcribed recursion,
      this correctness-threshold convention, this circuit shape, this toy parameter grid and these
      declared failure fractions, decryption first fails at the measured level, the model designates
      the modelled level, and their difference is the measured integer, with the synthetic null giving
      its own measured integer. What does NOT follow: nothing about whether any deployed parameter
      set carries removable slack, nothing about where bootstrapping should be placed in any real
      system, nothing about bootstrapping cost or throughput, and nothing about security. A positive
      gap is equally consistent with deliberate safety margin and with modelling looseness, and this
      run cannot separate them.'
  inputs:
    procedure: 'STAGE 0 (hours implementation): implement the correctness threshold once, used by
      both arms, and assert that a deliberately-too-small modulus chain yields L_model = 1 as a positive
      control. STAGE 1 (seconds): evaluate the transcribed recursion level by level across the parameter
      grid, recording L_model. STAGE 2 (several core-hours, the budget driver): run the levelled circuit
      over 2^20 input assignments per parameter point, recording decryption success or failure at
      every level. STAGE 3 (minutes): read L_meas at the any-failure, 2^-10 and 2^-20 fractions, with
      Clopper-Pearson intervals, marking 2^-20 unresolved where the input count cannot support it.
      STAGE 4 (core-hours): the synthetic model-variance null population through the identical L_meas
      code path in the same invocation. STAGE 5 (minutes): identity-circuit instrument check and three-seed
      reproducibility check, requiring identical G. STAGE 6 (core-hours): repeat across the parameter
      grid to turn the point into a surface. STAGE 7 (minutes): manifest and failure-curve emission.'
    instrument: Python 3 with arbitrary-precision integer ring arithmetic and schoolbook negacyclic
      convolution at N<=64; a vectorised numpy path over batched input assignments for the 2^20-scale
      failure counting, with the vectorised path validated against the exact integer path on a 10000-assignment
      subset and required to agree exactly. Deterministic seeding and run manifests through harness/runner.py
      conventions. Clopper-Pearson intervals computed directly. No Sage, no external FHE library,
      no timing metric anywhere in the contract.
    parameters: 'Ring degree N in {16, 32, 64}. Modulus chain: 3, 4 and 5 primes of 20 bits, giving
      nine parameter points. Plaintext modulus t = 2. Secret density: uniform ternary and sparse ternary
      with Hamming weight N/4, both arms at every point. Error sigma = 3.2. Circuit: chain of multiplications
      by fresh encryptions with one modulus switch after each multiplication, run to depth 8 or until
      failure is near certain. Input assignments: 2^20 per parameter point, drawn from a frozen seeded
      set. Declared failure fractions: any failure, 2^-10, 2^-20. Seeds: 3 per parameter point. Positive
      control: one deliberately-too-small chain of 2 primes.'
  controls:
  - Synthetic model-variance null arm, same invocation, same L_meas code path.
  - Three seeds per parameter point, with G required to be identical across them.
  - A deliberately-too-small modulus chain where L_model is 1, as a positive control that the L_meas
    machinery detects early failure correctly.
  - An identity-circuit arm where no multiplication happens, in which both levels should be undefined
    or equal, as an instrument check.
  - Both the any-failure and 2^-10 fractions reported, so fraction-dependence of G is visible rather
    than a hidden analyst choice.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Null arm: a synthetic ciphertext population in which the noise polynomial
    at each level is drawn independently from a distribution with exactly the variance the model predicts
    at that level, so accumulation through evaluation is destroyed while the level-indexed magnitude
    is preserved. The identical L_meas determination, at the identical failure fractions, runs on
    this population in the same invocation. For the signal arm to mean anything the null must produce
    G near zero, since a population built to match the model''s own predicted variance should fail
    where the model says. A null with a large G would mean G is measuring the gap between the model''s
    variance prediction and its own tail bound rather than anything about evaluation, and that is
    a distinct and reportable outcome.'
  independent_variables:
  - ring degree N
  - modulus chain length
  - secret density (uniform ternary versus sparse h=N/4)
  - declared failure fraction
  - arm (signal versus synthetic model-variance null)
  metrics:
    primary:
    - L_model, first level at which the transcribed bound crosses the correctness threshold
    - L_meas at each declared failure fraction
    - G = L_meas - L_model at each fraction
    - empirical decryption-failure fraction at every level with Clopper-Pearson interval
    secondary:
    - G in the synthetic null arm
    - exact infinity norm distribution of the noise at the level preceding failure
    - agreement between vectorised and exact integer paths on the validation subset
    - seed-to-seed variation of G
    - count of parameter points at which 2^-20 was unresolved
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The integer gap G between measured and modelled first-failure level, at each declared
      failure fraction, in both the signal and the synthetic null arm.
    formula: 'L_model = min{L : B_L > threshold}; L_meas(f) = min{L : Pr[decryption failure at level
      L] > f}; G(f) = L_meas(f) - L_model, with threshold the stated correctness condition for the
      modulus chain and plaintext modulus. Predicted G(any failure) >= 1 in the signal arm; predicted
      |G| <= 1 in the synthetic null arm; predicted G identical across all three seeds at fixed parameters.'
    source: Pre-registered in the parent proposal IDEA-20260816-63a0ea before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: N in {16,32,64} with 20-bit primes and chains of 3 to 5, against shipped ring degrees
      in the thousands and chains of many larger primes. The level index is a coarse coordinate and
      its granularity depends on how much noise one level adds relative to the chain, which is itself
      a parameter-set property, so a G measured on a 4-prime toy chain does not transfer numerically
      to a long chain and the contract claims no such transfer. What is examined across the nine-point
      grid is whether G is monotone or stable in chain length and in N; a G that moves erratically
      across the grid is reported as evidence that the statistic does not extrapolate, which is a
      usable outcome.
    correspondence: null
  tail_checks:
  - Report the full failure-probability curve, not only the crossing levels, since two parameter points
    with equal G can have very different curves.
  - Report the infinity-norm distribution at the level preceding first failure, including its maximum,
    since the crossing is a tail event.
  - Report the Clopper-Pearson interval on every fraction estimate, and mark any crossing whose interval
    spans a level boundary as unresolved rather than rounding it.
  - Report G computed at a fourth, analyst-blind fraction chosen after the curves are collected, to
    expose fraction-shopping.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Stop advancing a parameter point once the failure fraction exceeds 0.5 at some level; L_meas is
    not defined beyond that and further levels are recorded as saturated.
  - Report insufficient resolution rather than a result if the 2^-10 crossing interval spans a level
    boundary.
  - Abort as instrument failure if the vectorised and exact paths disagree on the validation subset.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: A signal-arm G of at least 1 at the any-failure fraction, identical across all
    three seeds, at a majority of the nine parameter points, with a synthetic-null G of magnitude
    at most 1.
  falsification_criterion:
  - G is 0 at every parameter point and every fraction.
  - G varies across seeds at fixed parameters.
  - The synthetic null arm produces a G as large as the signal arm, so G does not measure evaluation
    structure.
  - The positive control fails to yield L_model = 1, invalidating the modelled arm.
  - G moves erratically across the grid with no monotone dependence on chain length or N, so the statistic
    does not support even qualitative extrapolation.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-63a0ea
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must fix the correctness-threshold convention explicitly; several are in use and
    the modelled level shifts with the choice, which is the single largest lever on the reported number.
  - The Coordinator must name the transcribed worst-case recursion, as for the other contracts in
    this bucket, and ideally the same one so the bucket's results compose.
  - The RQ-FHE-001 primary-source constraint must be ruled on before approval.
  - How the synthetic null's per-level variance is derived from the model needs an explicit derivation;
    if the model states only a bound and not a variance, the null arm as designed cannot be built
    and an alternative null must be specified.
