# =============================================================================
# EXP-BINSTD-6f3434 -- VERSION 1 (APPROVED by DEC-20261003-bc5802)
# S_4 one-shot vs chained S_3×S_3 charged-cost band at n=17 toys.
# Source: IDEA-20261001-161102 / H-BINSTD-3b1f2d / RQ-BINSTD-b6f698 /
# GOAL-ECDLP2M-001. Stages 0-1 only. ZERO RUNS in this design packet.
# No AUXIN. Amazon Bedrock prohibited. Unlocks /run admission via
# trial-plan-v1.json + trial-plan.json twin + implementation/run.py.
# =============================================================================
experiment:
  id: EXP-BINSTD-6f3434
  hypothesis_id: H-BINSTD-3b1f2d
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-161102
  goal_id: GOAL-ECDLP2M-001
  parent_experiment_id: EXP-BINSTD-89d952
  version: 1
  title: >-
    S_4 vs chained S_3×S_3 charged-cost band (≤0.85) at n=17, ℓ∈{3,4}
    (Stages 0-1; admit-ready trial_plan.v1)
  status: analyzed
  approved_by: DEC-20261003-bc5802
  analyzed_by: DEC-20261003-933eae
  analyzed_at: '2026-10-03'
  evidence_id: EV-BINSTD-030b4e
  analysis_note: >-
    Stages 0-1 reviewed under EV-BINSTD-030b4e / DEC-20261003-933eae
    (refine): S0-FREEZE-OK; Stage 1 O-IMPEDIMENT (XOR-SAT pin absent).
    Lifecycle field only; scientific protocol bytes otherwise unchanged.
  approved_at: '2026-10-03'
  frozen: true
  execution_authorized: true
  approval:
    approved_by: DEC-20261003-bc5802
    composing_decision: DEC-20261003-bc5802
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete. Approval does not assert the hypothesis is true.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze V, seeds, XOR-SAT pin, chain reinjection rule, and the 0.85 band
    (Stage 0), then measure charged cost C = median_wall / max(success_rate, ε)
    for one S_4 attempt versus two chained S_3 attempts on ≥40 matched random
    targets at each (n,ℓ)∈{17}×{3,4} cell (Stage 1). Report E-S4-CHEAPER,
    E-S4-NOT-CHEAPER, E-INCONCLUSIVE, O-CONTROL-FAIL, or O-IMPEDIMENT.
    No break / exponent / n≥131 / rho claim.

  class: heuristic_validation
  class_note: >-
    Heuristic-validation of HEUR-BINSTD-161102-H1 at toy scale. Not an
    exponent-moving or cost-model-table experiment beyond the schedule meter.

  scope:
    included:
      - >-
        Stage 0: freeze V dims, seeds, XOR-SAT pin id, chain reinjection rule,
        band 0.85, ε=1/40, cell list BEFORE any Stage-1 timings. Zero scientific
        charged-cost ratios in Stage 0.
      - >-
        Stage 1: n=17, ℓ∈{3,4}, ≥40 matched targets per cell; shared XOR-SAT
        pin; report C(S_4), C(chained), ratio, bootstrap CI placeholders;
        controls ctl_matched_random_targets, ctl_shared_xorsat_pin,
        ctl_no_posthoc_band_edit, ctl_bootstrap_ci_reported.
    excluded:
      - Stage 2 n∈{19,23} + random-Boolean null expand (requires later decision)
      - Magma / Sage / AUXIN / Bedrock as success path
      - Break / exponent / n≥131 transfer / rho-competitiveness
      - Editing the 0.85 band after any Stage-1 timing
      - Claiming 'use S_4' as novelty

  inputs:
    proposal: ledger/proposals/IDEA-20261001-161102.yaml
    hypothesis: ledger/hypotheses/H-BINSTD-3b1f2d.yaml
    parent_contract: experiments/EXP-BINSTD-89d952/specification.yaml
    parent_s4: experiments/EXP-BINSTD-89d952/implementation/s4_descent.py
    trial_plan: experiments/EXP-BINSTD-6f3434/trial-plan-v1.json
    trial_plan_twin: experiments/EXP-BINSTD-6f3434/trial-plan.json
    implementation:
      - experiments/EXP-BINSTD-6f3434/implementation/run.py
      - experiments/EXP-BINSTD-6f3434/implementation/check.py

  controls:
    - id: ctl_matched_random_targets
      role: same target stream for both schedules (PCG64 / stdlib Random with frozen seed)
    - id: ctl_shared_xorsat_pin
      role: identical solver pin under both arms; pin id frozen in Stage 0
    - id: ctl_no_posthoc_band_edit
      role: band 0.85 frozen in stage0/preregistered-predictions.json before timings
    - id: ctl_bootstrap_ci_reported
      role: report bootstrap CI fields (may be null if sample incomplete; never invent)
    - id: ctl_encoder_presence_gate
      role: absent S_3/S_4 encoder or XOR-SAT pin → O-IMPEDIMENT, never falsification

  independent_variables:
    - schedule: [s4_oneshot, chained_s3x2]
    - n: [17]
    - ell: [3, 4]
    - target_count_min: [40]

  metrics:
    primary:
      - id: charged_cost_ratio_S4_over_chained
        definition: >-
          C(S_4) / C(chained) with C = median_wall_seconds /
          max(success_rate, ε), ε=1/40
        threshold: '≤ 0.85 for E-S4-CHEAPER'
      - id: target_count
        definition: Number of matched random targets per cell
        threshold: '≥ 40'
    secondary:
      - id: median_wall_s4
        definition: Median wall seconds of S_4 arm
      - id: median_wall_chained
        definition: Median wall seconds of chained-S_3 arm
      - id: success_rate_s4
        definition: Fraction of S_4 targets with a verified relation
      - id: success_rate_chained
        definition: Fraction of chained-S_3 targets with a verified relation

  heuristic_under_test: HEUR-BINSTD-161102-H1
  preregistered_prediction:
    quantity: charged_cost_ratio_S4_over_chained at (n,ℓ)∈{17}×{3,4}
    formula: 'C(S_4) ≤ 0.85 × C(chained-S_3×S_3)'
    source: IDEA-20261001-161102 / HEUR-BINSTD-161102-H1

  scale_relevance:
    tier: toy
    justification: >-
      n=17 only in Stages 0-1. No transfer to n≥131. Stage 2 cells are a
      disclosed future decision, not this contract.
    correspondence: null

  tail_checks:
    - id: TC-BOTH-ARMS
      check: ≥1 success on each arm before reading E-S4-CHEAPER / E-S4-NOT-CHEAPER
    - id: TC-BAND-FROZEN
      check: stage0 band hash matches live predictions before Stage-1 interpretation

  replication:
    seeds: [20261003161102]
    independent_instances: 40

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: 12
    maximum_memory_gb: 4
    maximum_runs: 3
    maximum_workers: 1

  stopping_rules:
    - id: SR-S0
      rule: Stage 1 does not start until Stage-0 freeze artifacts exist with hashes
    - id: SR-ENCODER
      rule: If S_3 or S_4 encoder or XOR-SAT pin is absent, stop with O-IMPEDIMENT
    - id: SR-BUDGET
      rule: Advisory 12 CPU-hours; overrun is O-IMPEDIMENT, not falsification

  invalidation_rules:
    - id: INV-1
      rule: Editing the 0.85 band after any Stage-1 timing invalidates interpretation
    - id: INV-2
      rule: Using Magma/Sage/AUXIN/Bedrock as the success path invalidates the run
    - id: INV-3
      rule: Claiming break / exponent / rho win from this EXP alone invalidates the report
    - id: INV-4
      rule: Mixing solver pins across arms without an amendment invalidates comparison

  success_criterion: >-
    Stage-0 freeze artifacts exist with recorded hashes before Stage 1, and
    Stage 1 returns exactly one of E-S4-CHEAPER, E-S4-NOT-CHEAPER,
    E-INCONCLUSIVE, O-CONTROL-FAIL, or O-IMPEDIMENT with per-cell C fields
    (or an explicit impediment reason) and passing artifact checks — a
    measurement success in either scientific direction or an honest stop.

  falsification_criterion: >-
    HEUR-BINSTD-161102-H1 is falsified iff Stage-1 controls pass, both arms
    have nonzero success, AND C(S_4) > 0.85 × C(chained) at a completed cell
    while the report still claims E-S4-CHEAPER (honest label E-S4-NOT-CHEAPER).
    O-IMPEDIMENT / budget abort is not falsification.

  required_artifacts:
    - experiments/EXP-BINSTD-6f3434/implementation/run.py
    - experiments/EXP-BINSTD-6f3434/implementation/check.py
    - experiments/EXP-BINSTD-6f3434/trial-plan-v1.json
    - experiments/EXP-BINSTD-6f3434/trial-plan.json
    - experiments/EXP-BINSTD-6f3434/stage0/schedule-api.json
    - experiments/EXP-BINSTD-6f3434/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-6f3434/stage1/charged-cost-n17.json
    - experiments/EXP-BINSTD-6f3434/runs/
    - experiments/EXP-BINSTD-6f3434/RESULTS.md

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.

  archive:
    snapshot: TASK-20261003-5c0c95
    binding_mode: content_at_commit
    commit_sha: null
