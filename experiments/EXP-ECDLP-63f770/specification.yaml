# EXP-ECDLP-63f770
# Window-table arithmetic. No curve point is added.
# Approved by DEC-20261004-130fa0.
experiment:
  id: EXP-ECDLP-63f770
  hypothesis_id: H-ECDLP-080612
  source_idea: IDEA-20261004-33fb95
  question_id: RQ-ECDLP-002
  version: 1
  title: Width-23 table versus width-22 table
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-130fa0
  objective: >-
    Check the table sizes 4194304 and 2097152, the product 8796093022208, and the nearby gap 0.
  inputs:
    width_hi: 23
    width_lo: 22
    table_hi: 4194304
    table_lo: 2097152
    table_gap: 2097152
    table_product: 8796093022208
    table_sum: 6291456
    nearby_a: 2097152
    nearby_b: 2097152
    nearby_gap: 0
    nearby_product: 4398046511104
  controls:
    - >-
      Two to the power 22 is 4194304. Two to the power 21 is 2097152.
      Reporting both tables as size 2097152 drops the gap and invalidates
      the run.
    - >-
      Four million one hundred ninety-four thousand three hundred four
      exceeds two million ninety-seven thousand one hundred fifty-two by
      2097152. The product of the two sizes is 8796093022208. Their sum
      is 6291456.
    - >-
      Two width-22 tables each store 2097152. Their gap is 0 and their
      product is 4398046511104.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {power, subtract}
  metrics:
    primary:
      - table_hi
      - table_lo
      - table_gap
      - implementations_agree
    secondary:
      - table_product
      - table_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The width-23 table stores 4194304 entries. The width-22 table stores
      2097152. The gap of two width-22 tables is 0.
    formula: >-
      Compute 2 to the power 22. Compute 2 to the power 21. Subtract
      2097152 from 4194304. Multiply 4194304 by 2097152. Subtract 2097152 from 2097152.
    source: >-
      IDEA-20261004-33fb95 states the widths 23 and 22 and the sizes
      4194304 and 2097152, read 2026-10-04. The powers, the product, and the
      sum were recomputed in this design session. That computation
      is not a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: Two written window widths. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 8796093022208 and the nearby gap 0 are required. A check that stops at the size 4194304 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the size 4194304 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - Two to the power 22 is not 4194304.
    - Two to the power 21 is not 2097152.
    - The gap is not 2097152.
    - The product is not 8796093022208.
    - Both tables are reported as size 2097152, or a curve point is added.
  success_criterion: >-
    Both runs agree that the width-23 table stores 4194304 entries, that
    the width-22 table stores 2097152, and that 4194304 exceeds 2097152 by 2097152.
  falsification_criterion: >-
    The runs agree that the width-23 table size is computed, and
    that size is not 4194304.
  required_artifacts:
    - experiments/EXP-ECDLP-63f770/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-63f770/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-63f770/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-63f770/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-63f770/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-63f770/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a table-size gap of 2097152 moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
