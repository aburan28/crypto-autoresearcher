run:
  id: RUN-ICPERF-a4a24b
  experiment_id: EXP-ICPERF-e21835
  hypothesis_id: null
  hypothesis_id_note: >-
    NULL, AND DELIBERATELY SO. This is an instrument-acceptance run: it tests whether the repaired
    benchmark tree measures what the frozen contract says it must, and bears on NO hypothesis about any
    curve or any index calculus cost. EXP-ICPERF-e21835's contract states `hypothesis_id: null` with a
    note warning against exactly this category error. Epoch 1's manifest set H-ICPERF-2c57cc here; that
    is a defect recorded as CORR-20260916-b35a05, and this composition carries the contract's value.
  task_id: TASK-20260915-4f4027
  composition:
    kind: schema_completion_over_two_immutable_manifests
    why: >-
      THE RUN SCHEMA MODELS ONE COMMAND PER RUN and this run is an acceptance harness that made many
      independent invocations across two epochs, each writing its own log. `tools/validate_ledger.py`
      (:741-771) therefore reported six errors against it — a missing `code.commit`, a missing
      `code.command`, and four missing companion artifacts — which the epoch-1 → epoch-2 supersession
      routed but did not clear, because the errors are real rather than a routing artifact. This record
      supplies the schema's fields for the run AS A WHOLE and nothing else.
    sources:
      - path: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest.yaml
        sha256: 8a4f1c0c30c374d490be6fd67727f83a66d8361ffafaa301d2d1175303677107
        epoch: 1
        authority: >-
          AUTHORITATIVE, UNCHANGED, AND NOT REPLACED for the phases epoch 1 ran: A4, A5, A6, C-NOWRITE,
          C-BYTE part 1, C-PROBE, C-SUMREG and C-LOAD. Committed at ecdd3bffd and byte-identical since.
      - path: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest-epoch2.yaml
        sha256: 6e6eb5659c5576bda12398203d9c6ecf0466550303f7dbbda5b5b28214c06928
        epoch: 2
        authority: >-
          AUTHORITATIVE for the epoch-2 phases (A1, A2, A3, A7, C-BYTE part 2, C-M2AGREE, C-SATREG) and
          for the run's terminal composition, including its protocol deviations and anomalies.
    what_this_record_adds: >-
      Exactly four things, none of them a measurement: a single `code.commit` and `code.command` for the
      run as a whole, a composed `result` pointing at where each verdict actually lives, and the four
      derived companion artifacts the schema requires. Every number in it is a copy of, or a pointer to,
      bytes the executor committed.
    what_this_record_does_not_do: >-
      It does not restate, re-derive, reinterpret or override a single measurement, verdict, deviation or
      anomaly. Where a reader wants a value, this record says which of the two immutable manifests holds
      it. It is not a third epoch and no process was run to produce it beyond
      `accept/compose_companions.py`, which only reads and concatenates committed bytes.
  status: completed
  status_note: >-
    Terminal, composed across two epochs, and this is the whole run's status rather than either epoch's.
    Epoch 1 alone is `incomplete_interrupted` and stays so in its own record. All seven acceptance
    criteria carry verdicts (A1, A2, A3, A7 from epoch 2; A4, A5, A6 from epoch 1, A4 with a declared
    deviation). "completed" asserts that the run's package is complete and its measurements are usable
    within their stated scope; it is NOT an acceptance verdict on the instrument, which is the
    independent review round's to compose, and it is NOT evidence about any curve.
  code:
    commit: 2bfdc65b13f70c74120a91e9b488a4c3ed531452
    commit_meaning: execution provenance
    commit_note: >-
      The commit at the load-bearing invocation — epoch 2's Macaulay2 F4 launch, on which A1, A2, A3 and
      C-M2AGREE all depend. It stands for the run as a whole because THE CODE BYTES WERE INVARIANT ACROSS
      EVERY LAUNCH IN BOTH EPOCHS: each file's sha256 was verified against TASK-20260913-f8bdec's frozen
      hashes, and `git diff --stat ca6946306 27e5022f1 -- experiments/EXP-ICPERF-e21835
      experiments/EXP-ICPERF-66fd51` is empty. A reader who checks out this commit has the code that ran
      in both epochs.
    commit_completeness:
      epoch_1_recorded_commit: 1fc65075ccb87ccba82c342a2f2af15e926acee9
      epoch_2_start: ca6946306
      epoch_2_per_launch:
        wdsat_rows_06:17:59Z: 6ad48e04c
        pure_cnf_rows_06:18:19Z: 6ad48e04c
        macaulay2_row_06:21:00Z: 2bfdc65b13f70c74120a91e9b488a4c3ed531452
        environment_probe_06:22Z: 2bfdc65b13f70c74120a91e9b488a4c3ed531452
      epoch_2_manifest_authoring: 27e5022f1
      why_there_are_several: >-
        HEAD advanced during epoch 2 because the Coordinator committed in this shared worktree while a
        producer was measuring — a bus publish, a merge of origin/main, a review-plan addendum, a
        correction, and a goal update. That is a real procedural hazard, recorded as an anomaly in
        epoch 2's manifest and in the snapshot receipt with forward guidance. It did not touch either
        scope directory, which is why one commit can stand for the run.
    dirty_tree: true
    dirty_tree_note: >-
      Carried forward from epoch 2's record: the worktree held uncommitted artifacts of this very run
      while it was being written. No file under either scope directory was dirty at any launch.
    command: python3 accept/engine_rows.py --m2
    command_note: >-
      The single load-bearing invocation, run from this run directory: the Macaulay2 F4 acceptance call
      that A1, A2, A3 and C-M2AGREE depend on. IT IS NOT THE ONLY COMMAND THE RUN EXECUTED and the schema
      field cannot express that; `command.txt` carries the full sequence, and `commands_full` below points
      at where each is recorded.
    commands_full: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/command.txt
    command_completeness:
      epoch_2: >-
        COMPLETE. manifest-epoch2.yaml's `commands` block records five invocations with their cwd, stdout,
        stderr and engine logs, and command.txt quotes them verbatim.
      epoch_1: >-
        NOT RECORDED IN PROSE, BUT DETERMINED BY COMMITTED BYTES. manifest.yaml carries no `commands`
        block and logs/PROGRESS.md records no invocation strings, so CITING PROGRESS.md AS THE SOURCE OF
        AN EPOCH-1 COMMAND IS FALSE. The commands are instead determined by the drivers themselves: each
        of accept/probe_check.py, accept/sumreg.py and accept/watchdog_null.py is committed, is declared
        in epoch 1's `artifacts`, is named to match the `invocation` label its own JSON output carries,
        and reads NEITHER argv NOR the environment. A script that consults nothing outside itself admits
        exactly one invocation, so `python3 accept/<name>.py` from this run directory is determined
        rather than reconstructed. accept/compose_companions.py re-verifies the argument-free property on
        every run and STOPS CLAIMING the command is determined if a driver ever gains an argument, so the
        check is the claim's warrant rather than a one-time assertion.
      epoch_1_correction_note: >-
        An earlier version of this record and of command.txt called epoch 1's commands UNRECOVERABLE and
        said only that WHAT each wrapper measured was known. That understated what the committed bytes
        fix, and it was corrected on 2026-09-16 after a concurrent session reconstructed the same three
        command lines. Both accounts were wrong in opposite directions and the reconciliation is recorded
        in CORR-20260916-5166fe.
      what_genuinely_was_never_captured: >-
        The WRAPPER-LEVEL stdout and stderr streams. The drivers write per-phase logs rather than being
        launched under a shell redirect, so no top-level stream was ever written to a file. That is why
        stdout.log and stderr.log are compositions of the per-phase logs, labelled as such, and do not
        purport to reconstruct a stream that never existed.
      consequence_for_reproduction: >-
        Every phase of both epochs reproduces from a command that committed bytes determine, at a commit
        that is recorded. What a re-runner does NOT get is a byte-comparable top-level stream for epoch 1,
        because none was captured; the per-phase logs and JSONs are the comparison surface instead.
    tree: experiments/EXP-ICPERF-e21835/code/
    tree_provenance: >-
      Copied byte-identically from the frozen EXP-ICPERF-66fd51 tree, verified equal before any edit, then
      repaired in place per the frozen contract's declared defect list D1-D5. Per-file hashes, frozen
      hashes and the changed/unchanged flag are in epoch 1's manifest; the diffs are in
      experiments/EXP-ICPERF-e21835/code/DIFFS.md and the hashes in CODE_SHA256.json.
  environment: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/environment.json
  environment_note: >-
    environment.json is epoch 1's probe output and is the schema's required companion.
    environment-epoch2.json is the same probe re-run in epoch 2 and is the environment the engine rows
    were measured in. Both are committed; they are separate files because they are separate observations
    of a host whose available memory changed between them (see the virtio balloon anomaly in epoch 2's
    manifest).
  inputs:
    instances:
      - n15l5-1-S
      - n15l5-11-U
    instance_note: >-
      The two acceptance instances of the frozen contract: one satisfiable and one unsatisfiable, at
      n = 15, l = 5. Full parameters, seeds and generation provenance are in epoch 1's `inputs` and in
      the contract; they are not restated here.
    detail: >-
      See manifest.yaml `inputs` (epoch 1) and manifest-epoch2.yaml `inputs` (epoch 2). This composition
      adds no input and changes none.
  timing:
    epoch_1: >-
      started 2026-09-15T22:26:00Z, last artifact 2026-09-15T22:44:32Z, 1112 s across completed phases.
      Interrupted at an unknown precise time; the interruption was discovered at 2026-09-16T05:55:00Z.
    epoch_2: >-
      started 2026-09-16T06:10:00Z, manifest authored 06:28:00Z. Macaulay2 launched 06:21:00Z and finished
      06:21:49Z.
    note: >-
      NEITHER FIGURE IS A PERFORMANCE MEASUREMENT. Both include agent reading and authoring time. The
      run's actual timings are per-invocation and live in results.jsonl and results_engine.jsonl; the
      Macaulay2 row is wall 49.2118 s, cpu 46.5472 s.
    detail: See manifest.yaml `timing` and manifest-epoch2.yaml `timing`.
  resources:
    detail: See manifest.yaml `resources` (epoch 1) and manifest-epoch2.yaml `resources` (epoch 2).
    note: >-
      The load-bearing figure is the Macaulay2 peak RSS: 6.620 GiB by the watchdog and 6.623 GiB by the
      kernel, with `rss_limit_breached: false`. Epoch 2 records that M2 was launched at MemAvailable
      6.69 GiB rather than the desired ~8 GiB, as declared deviation PD-E2-1.
  result:
    valid: true
    valid_reason: >-
      Composed from the two epochs. No invalidation rule of the frozen contract fired in either: nothing
      under EXP-ICPERF-66fd51 changed and the frozen hashes match, C-NOWRITE held, C-BYTE matched in both
      parts, C-SATREG was identical on both instances, C-SUMREG moved no value, and no stopping rule
      triggered. `valid: true` asserts THAT THE RUN'S MEASUREMENTS ARE USABLE WITHIN THEIR STATED SCOPE
      and nothing more.
    valid_is_not_acceptance: >-
      IT IS NOT AN ACCEPTANCE VERDICT ON THE INSTRUMENT, and it is not a claim that the repaired tree is
      correct. Epoch 1's own record set `valid: null` precisely to avoid asserting an acceptance the run
      had not performed; that caution applies to the composition too. Composing an acceptance verdict is
      the independent review round's task under REVIEW-ICPERF-20260915-a33cda and its addendum.
    invalid_reason: null
    certificate:
      kind: none
      why: >-
        No discrete log is solved and no factor-base relation is claimed. SAT answers were checked on the
        curve by binec as row-level verification — one WDSat SAT row and three pure-CNF SAT rows, all
        verified and matching the shipped certificate as a set — which is a correctness check on the
        instrument, not a claim under docs/claims-and-verification.md.
    acceptance_table: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/acceptance.json
    acceptance_report: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/acceptance-report.md
    raw_results:
      composed: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/raw-result.json
      engine_rows: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/results_engine.jsonl
      watchdog_control_rows: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/results.jsonl
    criteria:
      A1: PASS (epoch 2)
      A2: PASS (epoch 2)
      A3: PASS (epoch 2)
      A4: PASS (epoch 1, with a declared deviation)
      A5: PASS (epoch 1)
      A6: PASS (epoch 1)
      A7: PASS (epoch 2)
      controls: C-BYTE, C-M2AGREE, C-SATREG, C-LOAD, C-NOWRITE, C-PROBE, C-SUMREG — see acceptance.json
      note: >-
        Copied from acceptance.json, which is the executor's own table and the authority. Any
        disagreement between this summary and that file is a defect in this summary.
    headline_measurement: >-
      The Macaulay2 F4 invocation on n15l5-1-S exited 0 with gb_size 43, cpu_s 46.5472, maxdeg_gb 2,
      is_unit false, wall_s 49.2118, peak_rss_kb 6941312, rss_limit_breached false. Scope: ONE instance,
      ONE engine, ONE host. It says the instrument runs and reports; it says nothing about any curve.
  protocol_deviations: >-
    Three, all declared by the executor in epoch 2 (PD-E2-1 launching M2 at MemAvailable 6.69 GiB rather
    than ~8 GiB; PD-E2-2 an instrument timeout of 600 s within the contract's 900 s; PD-E2-3 a
    machine-protection headroom probe that is not a criterion), plus epoch 1's A4 deviation. Full text in
    the source manifests; not restated here.
  anomalies_and_unexpected_observations: >-
    Recorded in epoch 2's manifest and the snapshot receipt: a virtio balloon holding ~8.5 GB and
    deflating post-run, wall-time quantization for fast children, HEAD advancing five times mid-run
    because the Coordinator committed in the shared worktree, a poll-interval datum, and the epoch-1
    hypothesis_id defect now recorded as CORR-20260916-b35a05.
  inference:
    epoch_1:
      requested_policy: executor-implementation
      resolved_model_id: claude-opus-5-thinking
      model_verified: false
      stop_cause: monthly model-quota exhaustion, mid-measurement
    epoch_2:
      requested_policy: executor-implementation
      resolved_model_id: claude-fable-5.1
      model_verified: false
      fallback_used: true
      fallback_reason: >-
        The epoch-1 binding was unavailable on quota exhaustion. The task card was additively amended to
        set `fallback_allowed: true` with an `inference_amendment` before epoch 2 was dispatched, so the
        substitution is declared rather than silent.
    model_verified_note: >-
      Neither epoch ran `python3 -m orchestration.adapter doctor --probe`, so both identifiers are
      unverified configuration by AGENTS.md's own definition. Both were launching-session selections
      rather than `orchestration/adapter resolve` resolutions.
    composition_authored_by: >-
      The top-level Coordinator, 2026-09-16, not a producer session. No model measured anything to write
      this record.
  artifacts:
    composed_companions:
      - path: command.txt
        derived: true
        generator: accept/compose_companions.py
      - path: stdout.log
        derived: true
        generator: accept/compose_companions.py
        note: delimited concatenation of every logs/*.out, each section naming its source and sha256
      - path: stderr.log
        derived: true
        generator: accept/compose_companions.py
        note: delimited concatenation of every logs/*.err, same discipline
      - path: raw-result.json
        derived: true
        generator: accept/compose_companions.py
        note: >-
          embeds results.jsonl, results_engine.jsonl and acceptance.json; REFERENCES the epoch-1
          measurement JSONs by path and sha256 rather than copying them, so each measurement has exactly
          one authoritative copy
      - path: accept/compose_companions.py
        derived: false
        note: >-
          the generator itself, committed so the four derived files are reproducible. Re-running it on an
          unchanged tree reproduces all four byte-for-byte; that property is the only thing that makes a
          derived artifact worth committing.
    inherited: >-
      Every other artifact is listed in the two source manifests and is unchanged. Epoch 1's set is
      byte-identical to ecdd3bffd.
  discipline:
    nothing_overwritten: >-
      Both source manifests are byte-identical to their committed state and are hash-pinned above and in
      tools/run_supersession_registry.yaml. This record and the four companions are NEW FILES; the run
      directory is append-only and `tools/check_run_immutability.py` passes.
    what_a_reader_should_distrust: >-
      This record is a composition written by the Coordinator, not a producer, and its summaries are
      convenience copies. Where it summarises — the criteria table, the headline measurement, the
      timings — the source of truth is acceptance.json, results_engine.jsonl and the two immutable
      manifests. Read those for anything load-bearing.
