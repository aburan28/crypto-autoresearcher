experiment:
  id: EXP-ICPERF-e21835
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. This contract repairs and independently accepts an
    INSTRUMENT; it tests no prediction of any hypothesis and its outcome
    supports and refutes nothing. Every number it produces is a reference
    value re-measured against a value another agent already measured
    (EV-ICPERF-390707), so agreement is an instrument check and disagreement
    localises to one of two named implementations. The hypothesis this
    instrument will later serve is H-ICPERF-2c57cc, through
    EXP-ICPERF-13f001; reading any result of THIS contract as evidence for or
    against H-ICPERF-2c57cc or H-ICPERF-cc4847 would be a category error.
  goal_id: GOAL-ICPERF-e6b6a4
  version: 1
  title: >-
    Instrument repair and acceptance: a successor code tree for the ICPERF PDP
    harness that fixes the four measured defects of the EXP-ICPERF-66fd51 tree
    (the Macaulay2 report-line parse error, RLIMIT_AS as a memory limit, three
    summary reporting defects, and the hanging version probe), accepted against
    pre-registered reference values measured by an independent validator
  status: analyzed
  status_history:
    - {status: draft, at: '2026-09-15', by: coordinator}
    - status: review_required
      at: '2026-09-15'
      by: coordinator
      note: >-
        Protocol complete: controls, metrics, budgets, stopping rules,
        invalidation rules, artifact paths, dependencies and the acceptance
        reference table are all present before dispatch.
    - status: approved
      at: '2026-09-15'
      by: coordinator
      decision: DEC-20260915-428a17
      basis: >-
        Standing user authorization (AGENTS.md, 2026-09-06); protocol complete.
        Approval authorizes the work, not the conclusion, and asserts nothing
        about whether the repair will pass its own acceptance criteria.
    - status: analyzed
      at: '2026-09-16'
      by: coordinator
      decision: DEC-20260915-927eaa
      evidence: EV-ICPERF-433fa5
      basis: >-
        RUN-ICPERF-a4a24b executed across two epochs and was independently
        reviewed on six joints by two mutually blind validator sessions
        (TASK-20260915-3f4b52, TASK-20260915-abf147). The Groebner, CPU-second,
        peak-RSS and SAT-status channels are ACCEPTED at (n, l) = (15, 5) on
        this host at the bytes the run measured; the WALL-CLOCK channel is NOT
        accepted at those bytes, because the accepted Runner polls in 0.25 s
        sleeps and reports a poll boundary rather than a duration for any child
        faster than one poll.
      not_archived_because: >-
        Two of this contract's own statements are defective and are superseded
        by DEC-20260915-927eaa rather than edited: A6's reference cites
        artifacts/v3_reduce.json where the 156 figure comes from
        work/v3_reduce.json via work/v3_celldiff.py, and A5's account of
        RUN-ICPERF-c9590f asserts a four-minute hang and a timeout that did not
        fire, neither of which any artifact supports. C-BYTE's per-hunk
        attribution clause also FAILED as written and is deliberately not
        amended. A reader cannot take this contract at face value without also
        reading that decision, so `archived` would overstate its state.
      intermediate_states_never_recorded: >-
        This record moves from `approved` directly to `analyzed`. The `running`
        and `completed` transitions the run passed through were never written
        here; the gap is disclosed in DEC-20260915-927eaa rather than filled
        with backdated entries.
  successor_of: EXP-ICPERF-66fd51
  successor_rationale: >-
    THE ARCHITECTURAL DECISION AND ITS REASONS, recorded here and in
    DEC-20260915-428a17 rationale item R-ARCH. The repair lands as option (a),
    A SUCCESSOR CONTRACT WITH ITS OWN CODE TREE, and not as option (b), an
    additive amendment to EXP-ICPERF-66fd51 with a versioned code directory.
    Four reasons, in order of weight:

    (1) THE CHANGES ARE NOT ADDITIVE TO THE PROTOCOL. Replacing RLIMIT_AS with
    an RSS watchdog and raising the ceiling from 6 GB to 8 GiB changes
    `budget.enforcement` and `budget.maximum_memory_gb` -- two frozen
    scientific parameters of EXP-ICPERF-66fd51, not two absent ones. An
    "additive amendment" that changes the KIND and the VALUE of a declared
    resource limit is a protocol rewrite wearing an amendment's clothes, and
    the honest form of a changed protocol parameter is a new contract.

    (2) A CONTRACT WITH TWO CODE TREES CANNOT SAY WHICH RUN USED WHICH.
    EXP-ICPERF-66fd51 `inputs.code` names
    experiments/EXP-ICPERF-66fd51/code/{binec,convert,bench,summary}.py, and
    the manifests of RUN-ICPERF-305ca3 and RUN-ICPERF-4ec9b9 point at that
    path. A `code_v2/` under the same contract would leave the frozen
    `inputs.code` field naming only the first tree, permanently, because that
    field cannot be edited. Every later reader would have to compose the
    specification with an amendment to learn which bytes produced which row.

    (3) THE FROZEN TREE IS HASH-BOUND AND MUST STAY READABLE AS-IS.
    TASK-20260913-f8bdec binds convert.py, bench.py, summary.py and binec.py by
    sha256 (binding_mode content_at_commit). Those bytes are the instrument
    whose defects EV-ICPERF-390707 measured; they are the evidence for the
    defect claims. Editing them in place would destroy the object the review
    reported on, and adding a second tree beside them under the same contract
    invites exactly that confusion later.

    (4) THE PHASE STRUCTURE IS INHERITED BY REFERENCE, WHICH COSTS NOTHING.
    Phases A-E, the plan sizes, the certificate control and the null-object
    construction are cited from EXP-ICPERF-66fd51 and reused, so option (a)
    duplicates no design. What it duplicates is FILES, and that is the price:
    two copies of binec.py exist after this contract, and a future fix to the
    curve arithmetic must be applied twice or the trees must be reconciled by a
    later, deliberate act. That cost is stated plainly and accepted; a
    reconciliation into tools/ is already named in GOAL-ICPERF-e6b6a4
    objective (2) ("Code is promoted from experiments/ to tools/ only after a
    validator has run it") and this acceptance is the validator pass that would
    permit it.

    NOTHING IS REWRITTEN. EXP-ICPERF-66fd51 stays `analyzed`, its code stays
    byte-identical, its two run packages stay untouched, and its summary.json
    files are never regenerated -- the repaired reduction writes its
    side-by-side output under THIS contract's directory (control C-NOWRITE).
  objective: >-
    Produce a repaired ICPERF PDP harness whose four measured defects are
    fixed, and demonstrate -- against reference values pre-registered from an
    independent validator's measurements before this contract was approved --
    that the Groebner column is now recordable, that the memory limit is a
    resident-set limit that kills honestly, that the reduction reports what it
    cannot evaluate instead of dropping it, and that the environment probe
    returns. Observations only; the executor forms no conclusion and scores no
    prediction of any hypothesis.
  inputs:
    frozen_source_tree_read_only:
      - experiments/EXP-ICPERF-66fd51/code/binec.py
      - experiments/EXP-ICPERF-66fd51/code/convert.py
      - experiments/EXP-ICPERF-66fd51/code/bench.py
      - experiments/EXP-ICPERF-66fd51/code/summary.py
    frozen_source_tree_note: >-
      READ ONLY, NEVER EDITED. Hash-bound by TASK-20260913-f8bdec
      (binding_mode content_at_commit). The repaired tree is created by copying
      these four files to experiments/EXP-ICPERF-e21835/code/ and applying the
      declared defect fixes there.
    defect_evidence:
      - EV-ICPERF-390707 (joints V2 and V3)
      - coordination/review/icperf-20260913-66fd51/TASK-20260915-195b0c/report.md
      - coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/report.md
      - >-
        coordination/review/icperf-20260913-66fd51/TASK-20260915-195b0c/artifacts/m2_reportfix.diff
        (the validator's own two-line fix, for comparison and not to be copied
        blind)
      - >-
        coordination/review/icperf-20260913-66fd51/TASK-20260913-6c5729/artifacts/v3_reduce.py
        and v3_reduce.json (the independent reduction the repaired summary must
        agree with)
      - >-
        experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-c9590f/ABORTED.md and
        bench_stderr.log (the retained reproduction of the hanging probe)
    frozen_reduction_input:
      - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/results.jsonl
      - experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/summary.json
    frozen_reduction_input_note: >-
      READ ONLY. The repaired reduction is run OVER this frozen table and its
      output is written under this contract, never into the archived run
      directory. Regenerating a run's own summary.json would change what that
      run's composed evidence means (DEC-20260915-87360d PD-C4 recorded exactly
      this reasoning when it declined to repair summary.py between the two
      runs).
    instances:
      - >-
        inputs/TRIMOSKA-ECICB-2024/upstream/benchmarks/ -- the acceptance
        touches n15l5-1-S (Groebner) and n15l5-1-S plus n15l5-11-U (WDSat
        regression) only. All 60 instances are the ROW contract's business, not
        this one's.
    engines_used_in_acceptance:
      - Macaulay2 1.22, groebnerBasis Strategy=>"F4" over ZZ/2, GRevLex, field equations appended
      - WDSat @ 61c6ff3, rebuilt from SRC-ICPERF-TRIMOSKA-WDSAT-2024, default config
      - Singular 4.3.2 (version probe only; no Groebner invocation is required by this contract)
    engines_not_added_here:
      - >-
        Singular `slimgb`. EV-ICPERF-390707 joint V2 measured it computing the
        n15l5-1-S basis in 167.4 s where `std` exceeds 900 s, agreeing with
        Macaulay2 F4 on gb_size = 43 / maxdeg = 2 / non-unit. Adding an engine
        CONFIGURATION is a protocol change to the row, not a defect repair, and
        the goal head's next_action item (1) lists four defects and not five.
        It is therefore declared as an owed addition in EXP-ICPERF-13f001
        `dependencies` and ranked in DEC-20260915-428a17 next_actions, NOT
        smuggled into this repair.
      - Magma F4, PolyBoRi/BRiAl, msolve. Absent or unsupported; unchanged from EXP-ICPERF-66fd51.
    code: experiments/EXP-ICPERF-e21835/code/{binec.py, convert.py, bench.py, summary.py}
    inherits_phase_structure_from: >-
      EXP-ICPERF-66fd51 phases A-E, its plan sizes, its C-CERT / C-ANSWER /
      C-NULL / C-REGEN / C-UNSAT-CERT / C-LOAD controls and its null-object
      construction, all by reference. This contract changes none of them; it
      changes four defect sites and one reporting gap.
  defects_to_repair:
    - id: D1
      site: experiments/EXP-ICPERF-66fd51/code/convert.py, magma_to_m2, the `gens_` line
      measured_by: EV-ICPERF-390707 joint V2
      what: >-
        The emitted Macaulay2 script binds `gens_ = flatten entries G;` and
        reads `#gens_` in the RESULT line. Macaulay2 parses a trailing
        underscore as its subscript operator, so all 32 committed .m2 scripts
        carry a parse error at their line 49, raised AFTER F4 completes. The
        Macaulay2 column was therefore zero at ANY memory limit, and the
        std::bad_alloc failures of RUN-ICPERF-305ca3 concealed a second,
        independent defect that would have zeroed the column even with infinite
        memory.
      fix: >-
        Rename the identifier to one Macaulay2 accepts (the validator used
        `gensG`) at every occurrence in the emitted script. The emitted RESULT
        line must keep its exact byte format, because bench.py parses it with
        the regex `RESULT gb_size=(\d+) cpu_s=([\d.]+) maxdeg_gb=(\d+)
        is_unit=(true|false)` -- change the identifier, never the format.
      acceptance: A1
    - id: D2
      site: experiments/EXP-ICPERF-66fd51/code/bench.py, Runner.run, the `limits` closure
      measured_by: EV-ICPERF-390707 joint V2
      what: >-
        RLIMIT_AS caps VIRTUAL ADDRESS SPACE and is not a memory limit for a
        garbage-collected algebra system. Macaulay2 reserved 5.996 GiB of
        address space against 2.575 GiB resident under the 6 GB cap, and
        145.370 GiB against 6.823 GiB resident with no cap. The cap aborted
        every Groebner row in 0.9-15.7 s with std::bad_alloc while the process
        was using well under half the memory it was allowed.
      fix: >-
        Remove the RLIMIT_AS setting entirely and add a RESIDENT-SET watchdog:
        poll the child and its descendants' RSS at a declared interval,
        terminate the process group when the sum exceeds the declared limit,
        and record `peak_rss_kb`, `rss_limit_gb`, `rss_limit_breached` and
        `rss_poll_interval_s` on every row. The declared limit is 8 GiB per
        child. THIS IS AN HONEST LIMIT AND IS EXPECTED TO KILL ROWS: the
        validator measured that an equivalent 6 GiB RSS cap would also kill the
        n15l5 Groebner row, and 8 GiB is chosen against a measured 6.71-6.82
        GiB unconstrained peak, i.e. roughly 17% headroom on a 15 GB host. A
        row the watchdog kills is a budget stop with its limit recorded, never
        negative evidence (AGENTS.md core rule 5).
      acceptance: [A3, A4]
    - id: D3
      site: experiments/EXP-ICPERF-66fd51/code/summary.py, three sites
      measured_by: EV-ICPERF-390707 joint V3 (and joint V4 for the P6 case)
      what: >-
        (a) THE LOOP-VARIABLE LEAK. The `cms_pure_cnf_over_wdsat` block reads
        `L`, which is not bound in its own loop and leaks the last value bound
        by an earlier per-cell loop, so all four l = 6 cells received the
        identical ratio 83.50030889840438. One number cannot be four
        independent ratios. (b) THE UNEVALUATED GROEBNER CLAUSE. P5's Groebner
        term is guarded on `m2_f4_cpu_s`, which derives from a row key present
        on 0 of 504 rows (because of D1), so the clause was never evaluated and
        nothing recorded the skip -- and the top-level `holds` was computed over
        the surviving terms as if P5 had been evaluated in full. (c) THE
        SILENTLY DROPPED CELL. P6's top-level `holds` filters out cells whose
        own `holds` is None, so a prediction quantified over EVERY cell was
        reported true on the strength of two cells while n19l6 was unevaluable
        (all six nulls censored at 180 s, none reporting a conflict count). P4
        drops cells by the same rule.
      fix: >-
        (a) Bind the per-(cell,label) aggregate inside the loop that uses it,
        and compute the l = 6 pure-CNF ratio independently per (cell, label).
        (b) and (c) Adopt ONE uniform reporting rule for every prediction: each
        clause reports `evaluated: true|false` and, when false, a `reason`
        string naming what was missing; each prediction quantified over cells
        reports an explicit `unevaluable: [...]` list; and a prediction with a
        nonempty `unevaluable` list reports top-level `holds: null`, never true
        and never false. A clause that cannot be evaluated must be VISIBLE in
        summary.json.
      fix_boundary: >-
        The repaired reduction changes REPORTING ONLY. It must not change any
        median, any ratio, any threshold, any inclusion rule, or the definition
        of `finished`. Its correctness test is that it reproduces the
        independent reduction's 156 per-cell numeric values exactly (control
        C-SUMREG) and differs from the frozen summary.json only at the declared
        defect sites and in the new reporting fields.
      acceptance: A6
    - id: D4
      site: experiments/EXP-ICPERF-66fd51/code/bench.py, environment(), the `ver` helper
      measured_by: >-
        EV-ICPERF-390707 joint V2 (the validator could not confirm Singular's
        version because the probe timed out) and the retained aborted launch
        RUN-ICPERF-c9590f, whose bench_stderr.log shows the process dying
        inside `ver(["Singular", "--version"])`.
      what: >-
        `ver` calls subprocess.run without redirecting stdin, so the child
        inherits the parent's. `Singular --version` reads from it, waits for
        input that never arrives, and the probe hangs until something
        interrupts it. A run that cannot complete its own environment probe
        cannot name the engine versions it measured, which is an artifact-policy
        requirement (AGENTS.md "Artifact policy": environment and dependency
        versions).
      fix: >-
        THE REQUIREMENT IS BEHAVIOURAL: the probe returns, bounded, under an
        inherited-stdin launch, and records `unavailable: <reason>` rather than
        propagating. `stdin=subprocess.DEVNULL` plus a 10 s per-engine timeout is
        the expected minimum. It may not be sufficient, and the executor is
        explicitly permitted to go further: `subprocess.run(...,
        capture_output=True, timeout=...)` kills only the DIRECT child on
        timeout and then drains its pipes, so if `Singular` is a wrapper that
        execs the real binary, the surviving grandchild holds the write end and
        the drain blocks after the timeout has already fired. That would explain
        why the frozen code's 60 s timeout did not save RUN-ICPERF-c9590f, and
        the remedy is `start_new_session=True` with a process-group kill (or
        equivalent). Whatever is implemented is recorded, and the acceptance
        criterion A5 is measured behaviour, not a named call.
      acceptance: A5
    - id: D5
      site: experiments/EXP-ICPERF-66fd51/code/bench.py, the pure-CNF engine rows
      measured_by: EV-ICPERF-390707 joint V3, beyond_the_plan
      named_by: DEC-20260915-87360d next_actions
      what: >-
        `stats` is empty or absent for three engines of six, so conflict
        comparison exists for two. A prediction stated in conflicts cannot be
        evaluated for CaDiCaL, MiniSat or CryptoMiniSat-on-pure-CNF.
      fix: >-
        Parse and record each engine's own conflict/decision/propagation
        counters where the engine prints them (CryptoMiniSat `c conflicts`,
        CaDiCaL and MiniSat their solver-statistics blocks, which may require
        the engine's verbose or statistics flag), and where an engine emits no
        such counter, record `stats_unavailable_reason` naming the engine and
        why.
      gating: >-
        NON-GATING. D5 is included because DEC-20260915-87360d named it and
        because it is a reporting change in the same file as D2 and D4, so
        deferring it would mean touching bench.py twice. Acceptance requires
        either the counters or a recorded reason per engine -- NOT that every
        engine yields counters, which is not in the executor's power. A failed
        D5 does not fail the acceptance; it is reported.
      acceptance: A7
  defects_deliberately_not_repaired:
    - id: O-NULLCONST
      what: >-
        `convert.anf_null_object` draws each equation's constant term by fair
        coin, so 0 of 18 null objects matched their template's constant-term
        count and all 18 differed in the same direction (mean constant fraction
        0.510 against 0.823; EV-ICPERF-390707 joint V4).
      why_not: >-
        Changing how a NULL OBJECT is generated is a change to the CONTROL, not
        a repair to the instrument that measures it. It belongs to the row
        contract's control design, where it is declared as an additional
        constant-matched null (EXP-ICPERF-13f001 control C-NULL2), so that the
        two null constructions can be compared rather than one silently
        replacing the other. The producer's `shape_matches_template: true` was
        correct under its own declared sizing tuple, which does not include the
        constant; what was wrong was the plan's wording, not the code.
    - id: O-DEGEN
      what: >-
        n15l5-8-S is degenerate with 32 roots where every other instance has
        few (EV-ICPERF-390707 joint V1, beyond_the_plan). Nothing flags it.
      why_not: >-
        Flagging an instance is a change to how the row is REPORTED and belongs
        to EXP-ICPERF-13f001, which declares it. Adding it here would put a
        scientific reporting decision inside a defect repair.
    - id: O-SLIMGB
      what: A Singular `slimgb` configuration.
      why_not: See `inputs.engines_not_added_here`. Ranked separately.
  controls:
    - id: C-BYTE
      what: >-
        The repaired tree is auditable as a DIFF against the frozen tree. Every
        file in experiments/EXP-ICPERF-e21835/code/ is either byte-identical to
        its EXP-ICPERF-66fd51 counterpart or accompanied by a unified diff in
        the acceptance report; binec.py is expected byte-identical (no defect
        was found in it and the certificate arithmetic was independently
        re-derived at 30/30).
      pass: >-
        A recorded sha256 per file for both trees, a unified diff per changed
        file, and every diff hunk attributable to exactly one of D1-D5. A hunk
        attributable to none is a scope violation and is reported as one.
    - id: C-M2AGREE
      what: >-
        The repaired Macaulay2 path is checked against a SECOND independent
        engine's result on the same ideal rather than against itself: the
        parsed RESULT line must agree with the values Singular slimgb and
        Macaulay2 F4 independently produced under EV-ICPERF-390707 joint V2.
      pass: gb_size == 43, maxdeg_gb == 2, is_unit == false on n15l5-1-S.
    - id: C-WATCHDOG-NULL
      what: >-
        CONTROLS BEFORE BELIEF, applied to the watchdog itself. Two synthetic
        null objects of the same shape as a real child: (i) a process that
        touches 12 GiB of RESIDENT memory in increments, which the watchdog
        must kill; (ii) a process that RESERVES at least 64 GiB of address space
        (mmap PROT_NONE or equivalent) while touching under 512 MiB, which the
        watchdog must NOT kill. (ii) is the object that distinguishes the new
        limit from the old one: RLIMIT_AS kills it and an RSS watchdog must not.
      pass: >-
        (i) terminated with rss_limit_breached true and a recorded peak within
        the polling tolerance of the limit; (ii) exits 0 with
        rss_limit_breached false. Either outcome inverted invalidates D2.
    - id: C-SUMREG
      what: >-
        The repaired reduction is run over the FROZEN RUN-ICPERF-305ca3
        results.jsonl and diffed against BOTH the frozen summary.json and the
        validator's independent reduction v3_reduce.json.
      pass: >-
        All 156 per-cell numeric values agree with v3_reduce.json to the last
        printed digit; every difference from the frozen summary.json is
        attributable to a declared D3 site or to a new reporting field; no
        median, ratio or threshold moves.
    - id: C-SATREG
      what: >-
        The SAT column must be unchanged by the memory-limit change. WDSat
        default is re-run on n15l5-1-S and n15l5-11-U under the repaired
        harness and compared against the values EV-ICPERF-390707 joint V2
        reproduced exactly from rebuilt binaries.
      pass: >-
        Identical status and identical conflict count on both instances (WDSat
        is deterministic). Any difference invalidates the run and is reported
        as an instrument regression, not as a measurement.
    - id: C-NOWRITE
      what: >-
        Nothing under experiments/EXP-ICPERF-66fd51/ is modified, including the
        two archived run packages and the retained aborted launch.
      pass: >-
        `git status --porcelain experiments/EXP-ICPERF-66fd51` is empty at the
        end of the run, and the four frozen code files' sha256 values match
        TASK-20260913-f8bdec's recorded hashes.
    - id: C-PROBE
      what: >-
        The environment probe is exercised in the configuration that hung -- a
        child launched with stdin inherited from the launching process -- and
        not only in a terminal where stdin happens to be closed.
      pass: >-
        environment() returns within 60 s with a nonempty version string for
        every installed engine or a recorded `unavailable:` reason, and the
        Singular entry is a version string.
    - id: C-LOAD
      what: 1-minute load average recorded at every invocation.
      pass: reported; a Groebner invocation launched at loadavg > 1 is flagged.
  independent_variables:
    - defect site D1-D5 (which repair is being exercised)
    - >-
      for C-WATCHDOG-NULL: the (limit kind, limit value, allocation shape)
      triple -- resident growth versus address-space reservation
    - >-
      for C-SUMREG: reduction implementation (frozen summary.py, repaired
      summary.py, validator's v3_reduce.py) over one fixed input table
  metrics:
    primary:
      - >-
        per acceptance criterion A1-A7: PASS / FAIL / NOT_EVALUABLE with the
        measured value beside the pre-registered reference value
      - Macaulay2 F4 on n15l5-1-S: gb_size, maxdeg_gb, is_unit, engine cpu_s, exit status
      - per invocation: peak RSS (KB), rss_limit_breached, wall seconds, child CPU seconds
      - WDSat default on the two regression instances: status and conflict count
    secondary:
      - sha256 per file of both code trees; diff hunk count per defect id
      - number of per-cell numeric values agreeing with v3_reduce.json (out of 156)
      - environment probe wall seconds per engine
      - loadavg at each invocation; RSS polling interval actually achieved
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The seven acceptance criteria A1-A7. Every reference value below was
      measured by an INDEPENDENT VALIDATOR SESSION and composed into
      EV-ICPERF-390707 BEFORE this contract was written, which is what makes
      them pre-registered rather than fitted.
    formula:
      A1: >-
        Macaulay2 F4 on the repaired-script form of n15l5-1-S, launched through
        the repaired bench.py with no RLIMIT_AS and an 8 GiB RSS watchdog, exits
        0 and its stdout contains a line matching bench.py's own regex
        `RESULT gb_size=(\d+) cpu_s=([\d.]+) maxdeg_gb=(\d+) is_unit=(true|false)`,
        which bench.py parses into a row carrying non-null gb_size, engine_cpu_s
        and maxdeg_gb. Reference: the validator's repaired-script run C5 emitted
        `RESULT gb_size=43 cpu_s=47.7616 maxdeg_gb=2 is_unit=false` at exit 0.
      A2: >-
        The row A1 produces carries wall seconds in [30, 120] and child CPU
        seconds exceeding wall seconds (Macaulay2's F4 is multi-threaded on this
        host). Reference: 49.97 s wall, 170.56 s CPU, ratio 3.4. The band is
        wide on purpose -- it is a sanity envelope for one instance on one host,
        not a timing measurement, and a value outside it is reported rather than
        treated as a failure.
      A3: >-
        The same row's recorded peak RSS lies in [5.5, 7.5] GiB and
        rss_limit_breached is false under the 8 GiB watchdog. Reference:
        6.705 GiB (repaired script, 11 GiB watchdog) and 6.823 GiB
        (committed script, 10 GiB watchdog).
      A4: >-
        C-WATCHDOG-NULL passes both directions: the 12 GiB resident allocator is
        killed with rss_limit_breached true; the >= 64 GiB address-space
        reserver that touches < 512 MiB exits 0 with rss_limit_breached false.
        This is the criterion that separates the new limit from the old, and
        the old limit fails it by construction.
      A5: >-
        environment() returns within 60 s under an inherited-stdin launch, with
        a nonempty first line for Singular. Reference: the frozen probe did not
        return at all (RUN-ICPERF-c9590f died inside it after ~4 minutes; the
        60 s per-engine timeout in the frozen code did not fire, which the
        acceptance report must explain or record as unexplained).
      A6: >-
        The repaired reduction over RUN-ICPERF-305ca3/results.jsonl reproduces
        v3_reduce.json's 156 per-cell numeric values exactly; reports the four
        l = 6 pure-CNF ratios as four DISTINCT values whose all-10-median form
        is 10.396 / 34.472 / 67.460 / 83.500 (matched-subset form 26.071 /
        34.468 / 327.664 / 82.629) in place of the single repeated
        83.50030889840438; reports P5's Groebner clause as
        `evaluated: false` with a reason naming the absent engine_cpu_s key;
        and reports P6 with `unevaluable: ["n19l6"]` and top-level
        `holds: null` in place of true.
      A7: >-
        NON-GATING. Every pure-CNF engine row carries either a parsed conflict
        counter or a `stats_unavailable_reason` naming the engine.
    source: >-
      EV-ICPERF-390707, composed 2026-09-15 from REVIEW-ICPERF-20260913-66fd51
      joints V2, V3 and V4 over two independent validator sessions
      (TASK-20260913-6c5729, TASK-20260915-195b0c). Specific numbers:
      TASK-20260915-195b0c report.md rows C1/C2/C3/C5 for A1-A4, its section 3
      for slimgb, and TASK-20260913-6c5729 artifacts/v3_reduce.json for A6.
  scale_relevance:
    tier: toy
    justification: >-
      One instance (n15l5-1-S) for the Groebner path, two for the SAT
      regression, one fixed curve at n = 15, l = 5, on one host. This contract
      makes no scale claim of any kind: it establishes that an instrument
      records what it is supposed to record. Nothing here transfers to any
      cell, any n, or any curve.
    correspondence: null
  tail_checks: []
  tail_checks_note: >-
    None apply: no distribution is being compared against a prediction. The
    corresponding check for an instrument is the two-engine agreement of
    C-M2AGREE and the two-direction null of C-WATCHDOG-NULL.
  replication:
    seeds:
      - >-
        None required for the Groebner or SAT rows: Macaulay2 F4 over ZZ/2 with
        a fixed monomial order and WDSat default are both deterministic, which
        is exactly why C-SATREG can demand an EXACT conflict count.
      - >-
        C-WATCHDOG-NULL's synthetic allocators record their allocation schedule
        and any seed they use, so a later session can re-run them.
    independent_instances: 1
    independent_instances_note: >-
      One instance for the Groebner acceptance. This is a deliberate choice and
      its cost is stated: a repair accepted on one instance could still fail on
      an l = 6 instance that F4 cannot finish. The ROW contract
      (EXP-ICPERF-13f001) is where all 60 are run, and its budget expects l = 6
      Groebner rows to be censored. Accepting the instrument on the one
      instance two independent engines have already agreed on buys the check
      most likely to catch a broken repair for the least compute.
  budget:
    enforcement: >-
      Per-invocation subprocess wall-clock timeout plus a RESIDENT-SET watchdog
      at 8 GiB per child. RLIMIT_AS is NOT set -- removing it is the repair.
    wall_clock_seconds_per_run: 900
    wall_clock_seconds_per_run_note: >-
      900 is the largest single acceptance invocation (Macaulay2 F4 on
      n15l5-1-S, measured 49.97 s wall, budgeted with ~18x headroom because a
      repaired script that behaves differently must be allowed to show it
      rather than being censored into ambiguity).
    total_cpu_hours: null
    maximum_memory_gb: 10
    maximum_memory_gb_note: >-
      10 GB for the whole task: an 8 GiB child watchdog plus harness and
      polling overhead, on a 15 GB host. Machine protection, not a research
      budget.
    maximum_runs: 1
    maximum_workers: 1
    maximum_workers_note: >-
      Engines run SEQUENTIALLY; the acceptance is not a throughput test. This
      counts harness-created descendants, of which there is one at a time.
      Macaulay2's F4 spawns its OWN threads inside that one child (measured 3.4
      CPU-seconds per wall second) and those are not harness workers; the
      watchdog therefore sums RSS over the child's whole process group.
    executor_wall_clock_seconds: 14400
  stopping_rules:
    - >-
      C-NOWRITE fails at any point (anything under experiments/EXP-ICPERF-66fd51
      is modified): stop immediately, restore nothing by hand, and report. A
      repair that damaged the frozen instrument is an evidence-integrity
      failure, not a result.
    - >-
      C-BYTE finds a diff hunk attributable to no declared defect: stop before
      any acceptance invocation and report the hunk. Scope is checked before
      compute, not after.
    - >-
      The Macaulay2 acceptance invocation exceeds 900 s or the watchdog kills
      it: stop that criterion, record it as A1 NOT_EVALUABLE with the exit
      status, peak RSS and the limit, and CONTINUE with A4-A7. A censored
      Groebner invocation is an infrastructure outcome; it does not end the
      acceptance and it is never negative evidence about F4.
    - >-
      Executor wall clock reached: stop, keep every artifact produced so far,
      write the acceptance report with the criteria evaluated so far and the
      remainder marked NOT_EVALUABLE with the reason, and record which stopped
      where.
  invalidation_rules:
    - Any file under experiments/EXP-ICPERF-66fd51/ differs from its committed bytes.
    - >-
      C-SATREG fails: a WDSat regression row differs in status or conflict count
      from the independently reproduced value. The repaired harness is then not
      a repair and the whole acceptance run is invalid.
    - >-
      C-SUMREG shows any median, ratio or threshold moving. The repaired
      reduction is then not reporting-only and the run is invalid.
    - The acceptance report omits a per-file sha256 or a diff for a changed file.
    - >-
      The run's manifest is missing the code commit, the inference block, or the
      recorded rss_limit_gb and rss_poll_interval_s.
  success_criterion: >-
    A repaired code tree exists at experiments/EXP-ICPERF-e21835/code/ whose
    every diff from the frozen tree is attributable to a declared defect; A1,
    A3, A4, A5 and A6 are each PASS or NOT_EVALUABLE with the measured value and
    the reason recorded beside the pre-registered reference; C-BYTE, C-SATREG,
    C-SUMREG, C-NOWRITE and C-PROBE all pass; and the acceptance report states,
    criterion by criterion, what was measured rather than whether the repair
    "works". THE EXECUTOR DOES NOT DECLARE THE INSTRUMENT ACCEPTED. Acceptance
    is a Coordinator decision on independent review (TASK-20260915-3f4b52 and
    TASK-20260915-abf147, then DEC-20260915-927eaa).
  falsification_criterion: >-
    This contract has no hypothesis to falsify. What it can show is that a
    defect claim was wrong, and each such outcome is a real and reportable
    result: A1 failing with the identifier renamed would mean the parse error
    was not the only thing zeroing the Macaulay2 column; A4's second direction
    failing would mean the RSS watchdog is not distinguishable from RLIMIT_AS
    as implemented; A6's 156-value agreement failing would mean the frozen
    reduction's defects are not confined to the three declared sites; A5 failing
    would mean inherited stdin was not the cause of the hang. Each of those
    fails the ACCEPTANCE and is evidence about the INSTRUMENT, never about any
    prediction of H-ICPERF-cc4847 or H-ICPERF-2c57cc.
  required_artifacts:
    - experiments/EXP-ICPERF-e21835/code/binec.py
    - experiments/EXP-ICPERF-e21835/code/convert.py
    - experiments/EXP-ICPERF-e21835/code/bench.py
    - experiments/EXP-ICPERF-e21835/code/summary.py
    - experiments/EXP-ICPERF-e21835/code/CODE_SHA256.json
    - >-
      experiments/EXP-ICPERF-e21835/code/DIFFS.md -- ONE file holding a unified
      diff per changed file against its frozen counterpart, each hunk labelled
      with the defect id it implements. One file rather than a diffs/ directory
      so that an exact artifact path can be declared and hash-bound in advance.
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest.yaml
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/acceptance.json
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/acceptance-report.md
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/environment.json
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/results.jsonl
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/summary_regression.json
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/logs/ (stdout and stderr per invocation)
    - experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/watchdog_control/ (the two null objects, their schedules and outcomes)
  assigned_to: executor
  assigned_to_note: >-
    `executor`, not `executor-mechanical`. The frozen contract used
    executor-mechanical because the Coordinator supplied the code and execution
    was judgement-free. Here the executor WRITES the repair, which requires
    reading a defect report, choosing an implementation and confining itself to
    the declared sites -- that is implementation judgement and the
    executor-implementation policy is the honest match.
  approved_by: coordinator
  approval_basis: >-
    DEC-20260915-428a17 under standing user authorization (AGENTS.md,
    2026-09-06). Approval authorizes the work and asserts nothing about its
    outcome.
  dependencies:
    - EXP-ICPERF-66fd51 committed, `analyzed`, and its code hash-bound by TASK-20260913-f8bdec
    - EV-ICPERF-390707 and DEC-20260915-87360d committed
    - >-
      Both validator reports and their artifacts committed under
      coordination/review/icperf-20260913-66fd51/ (v3_reduce.py/json and
      m2_reportfix.diff in particular)
    - RUN-ICPERF-c9590f retained with its ABORTED.md and bench_stderr.log
    - >-
      TASK-20260915-6d72a0 snapshot of this contract, H-ICPERF-2c57cc,
      EXP-ICPERF-13f001, DEC-20260915-428a17 and the review plan BEFORE the
      executor is dispatched
  independence_note: >-
    The Coordinator wrote the frozen tree's four files and therefore wrote three
    of the four defects being repaired. It does not write the repair: the
    executor does, and two independent validator sessions check it, one of them
    blind to the repaired converter (TASK-20260915-abf147 re-derives the
    Groebner quantity from the ANF without reading convert.py). That
    concentration is disclosed in the review plan as a weakness of the round and
    is the reason the blind re-derivation exists.
  interpretation_limits:
    - >-
      A passing acceptance says the instrument records what it is supposed to
      record on one n15l5 instance. It says nothing about l = 6, where the
      Groebner engines may not finish at all, and nothing about any prediction.
    - >-
      A1's reference values come from the validator's own repaired script, not
      from this contract's converter. Agreement is evidence that two
      independent repairs of the same defect produce the same basis; it is not
      independent evidence about Macaulay2.
    - >-
      The 8 GiB watchdog is a limit, not a measurement of what F4 needs. The row
      contract must expect l = 6 rows to breach it and record them as budget
      stops with the limit, exactly as a timeout is recorded.
    - >-
      The repaired reduction's `holds: null` on an unevaluable prediction is
      strictly less assertive than the frozen reduction's `true`. Nothing in the
      already-composed EV-ICPERF-390707 changes because of it: the composition
      already scored those clauses as unmeasured, on the validators' reports and
      not on summary.json.
    - >-
      Two copies of binec.py now exist. Until a validator-run promotion into
      tools/ (GOAL-ICPERF-e6b6a4 objective 2), a fix to the curve arithmetic
      must be applied in both trees or the divergence must be recorded.
