  findings:
  - id: R-1
    severity: major (must fix)
    status: fixed
    files:
    - driver.py
    - celltask.py
    - tests/test_v4.py
    change: 'run_cell starts each cell with start_new_session=True (own process group) and tracks reaping explicitly
      (reaped flag set only when os.wait4 returns the child pid). If the loop is left unreaped (signal, exception),
      the finally clause SIGKILLs the process group and reaps the child with a blocking wait4 before the exception
      propagates, so the final manifest is written only after the child is gone. The memory watchdog kills the group.
      Added: every child gets RELN_C5A377_DRIVER_PID, refuses to start if it is not its parent, and a watch thread
      exits (code 9) once re-parented, which covers an uncatchable SIGKILL of the driver (beyond the requested fix;
      OQ-29).'
    tests:
    - 'test_r1_signal_kills_and_reaps_real_child (real celltask child, SIGTERM to the driver mid-cell: child pid
      and group gone; manifest failed_infrastructure/signal; run directory byte/size-identical 1.5 s later; no cell
      JSON)'
    - test_r1_exception_kills_and_reaps_real_child (real child, exception injected in the watchdog poll)
    - test_r1_real_child_completes_in_own_group
    - test_r1_watch_parent_exits_on_reparent
    - test_r1_child_exits_when_driver_is_sigkilled (stand-in driver SIGKILLs itself; real child exits, writes no
      cell JSON)
    regression_check: 'test_r1_signal_kills_and_reaps_real_child was run once with driver.run_cell replaced by the
      HEAD (3f7b98) version: it FAILED (child alive after the driver returned). The orphan it left was killed. With
      the fix it passes.'
  - id: R-2
    severity: minor
    status: fixed
    files:
    - driver.py
    - tests/test_v4.py
    change: 'execute writes a stub run: manifest (status running, stub: true) right after command.txt and before
      the environment/Sage probe; if the full RunRecord never exists, the except branch rewrites the stub as failed_infrastructure
      with failure_class and failure_reason.'
    tests:
    - test_r2_exception_before_full_record_leaves_manifest
  - id: R-3
    severity: minor
    status: fixed
    files:
    - driver.py
    - smoke.py
    - tests/test_v4.py
    change: 'driver.smoke_budget_violations refuses a smoke budget equal to any frozen A1/A2 of any fixture or within
      a factor 1.25 (inclusive: max/min <= 1.25) of the same fixture''s frozen A1 or A2; used by driver --smoke-dry-run
      and smoke.check_budgets. Existing smoke/v4 budgets pass (nearest ratios 1.286 and 1.435).'
    tests:
    - test_r3_margin_same_fixture
    - test_fx6_driver_refuses_frozen_budgets (adds 198/573, 160, 717 on b16-s13)
    - test_fx6_smoke_configs_avoid_frozen_budgets (160 refused, 159 accepted)
  - id: R-4
    severity: informational
    status: no code change (per task); to be noted in the admission decision
  - id: R-5
    severity: low
    status: fixed
