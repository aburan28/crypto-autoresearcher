    change: verify_snapshot refuses a receipt outside the repository, not kind snapshot, not under an archives/
      directory, untracked, dirty, or differing from its HEAD blob. The driver generates a random per-run token,
      gives it only to frozen-namespace children, and records run.inputs.driver_pid and run.inputs.run_token_sha256;
      celltask.admission_guard requires the token to match and the manifest driver_pid to be its live parent running
      driver.py.
    tests:
