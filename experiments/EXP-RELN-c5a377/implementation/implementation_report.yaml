  open_questions:
  - id: OQ-1
    topic: C-2/C-4 log base L
    ambiguity: L = number of liftable FB x-classes below B is 2..14 on the frozen fixtures (b16-s12 has
      L=2), so log_L readings are coarse and differ strongly between fixtures of one size.
    literal_reading_implemented: Implemented exactly as written; delta null when L < 2 or cycle_rank =
      0 (reason recorded).
  - id: OQ-2
    topic: C-5 'delta_proof lower 95% CI'
    ambiguity: The population over which the CI is taken is not stated.
    literal_reading_implemented: 'Per size x budget, Student-t over the three seed fixtures: mean - t_{0.975,2}
      sd/sqrt(3); any null delta_proof in the cell makes the CI undefined (clause fails).'
  - id: OQ-3
    topic: C-5 'flat or rising trend'
    ambiguity: No test for 'flat' is given.
    literal_reading_implemented: Per budget, OLS slope of delta_proof on bits over the nine fixtures;
      flat-or-rising iff the upper end of its two-sided 95% t-interval is >= 0.
  - id: OQ-4
    topic: C-5 'ER null with identical |V|, |E| does not also exceed 1/4'
    ambiguity: 'Aggregation unstated. Structural pre-data remark (from the definitions only): G(|V|,|E|)
      has the same |E|-|V| as the treatment graph, so its cycle rank differs only through its component
      count; whenever the treatment clears 1/4, ER typically does too unless the treatment graph has many
      more components. Under any aggregation the supercritical-enriched verdict is therefore reachable
      only if the observed graph is markedly more fragmented than ER.'
    literal_reading_implemented: ER 'exceeds' in a size x budget cell iff the mean ER delta_proof over
      its 3 x 32 replicates (null replicates excluded) is > 1/4; supercritical-enriched requires that
      this happens in NO cell. Reported in full so any other aggregation can be recomputed.
  - id: OQ-5
    topic: C-5 subcritical 'at all sizes'
    ambiguity: Per fixture or per size mean, and which budget(s), unstated.
    literal_reading_implemented: 'Both inequalities (giant fraction < 0.05; cycle_rank <= 2 x components-with-cycle)
      at every one of the nine fixtures at both budgets. If both rules fire: inconclusive (''both_rules_fired'').'
  - id: OQ-6
    topic: C-4 vertex set of the LP graph
    ambiguity: Whether V is all liftable LP classes in [B, B2) or only those on an edge.
    literal_reading_implemented: V = root + LP classes incident to at least one LP edge. Cycle rank is
      unaffected (an isolated vertex adds 1 to |V| and to c); |V|, |E|/|V|, giant fraction, ER and planted
      sizes are affected. The count of liftable LP classes is recorded in the header for recomputation.
  - id: OQ-7
    topic: C-3 multiple decompositions and degenerate hits
    ambiguity: '''Decide exactly whether R_j = e1 P1 + e2 P2'' does not say which relation is kept when
      several exist, nor how R_j = P1 (T = O) or R_j = O are handled.'
    literal_reading_implemented: Full scan always (all charged); the relation kept is the first distinct
      unordered pair in (x, y) scan order; extra decompositions are counted (extra_decompositions). R_j
      = P1 is a recorded single-point hit, not a two-point relation and not an edge; R_j = O is recorded
      as R_is_O (construction charged, no scan). Both count as failed attempts.
  - id: OQ-8
    topic: C-3 scan set
    ambiguity: '''All points with x < B2'' read literally includes both signs.'
    literal_reading_implemented: Both signs scanned (2x the minimal x-only scan); every point operation,
      trivial ones included, charged as one group op.
  - id: OQ-9
    topic: Seed labels not fixed by the protocol
    ambiguity: C-3 gives one label per attempt for two draws; C-6 gives '.../rewire|<i>' without per-fixture
      or per-draw parts; ER, planted, scramble, rho and audit labels are unspecified.
    literal_reading_implemented: a_j, b_j from '<attempt label>|a' and '|b'; rewire draws '<ns>|rewire|<i>|<bits>|<seed>|<budget>|<draw>';
      ER '<ns>|er|<i>|...'; planted, scramble, rho, rho_walk, audit as listed in labels.py. Rejection
      retries append '|rej<r>'.
  - id: OQ-10
    topic: C-6 '10% of attempts (SHA256-selected)'
    ambiguity: Exact 10% vs a hash predicate.
    literal_reading_implemented: Attempt j selected iff SHA256('<ns>|audit|<bits>|<seed>|<j>') mod 10
      == 0 (about 10%, consistent across the A1 prefix and A2). All relation certificates are checked
      regardless.
  - id: OQ-11
    topic: C-6 configuration-model rewire
    ambiguity: Pure (loops/multi-edges kept) vs erased vs edge-switching.
    literal_reading_implemented: Pure configuration model on the observed stub list (root included); the
      treatment graph is itself a multigraph.
  - id: OQ-12
    topic: C-6 Erdos-Renyi G(|V|,|E|)
    ambiguity: Simple vs multigraph.
    literal_reading_implemented: Uniform simple graph (no loops, no parallel edges); infeasible if |E|
      > C(|V|,2), recorded.
  - id: OQ-13
    topic: C-6 planted-dense construction
    ambiguity: '''cycle rank forced to |V|^{1.5}'' does not fix rounding or edge law.'
    literal_reading_implemented: Random spanning tree on the observed vertex count plus ceil(|V|^{1.5})
      uniform non-loop edges (multi-edges allowed); cycle rank exactly ceil(|V|^{1.5}); gate delta_proof(L
      of the fixture) > 1/4.
  - id: OQ-14
    topic: Known false 'not_exercised'
    ambiguity: With few relations, the scrambled system can be consistent with nothing beyond the anchor
      determined, so it can neither pass nor fail verification (seen in smoke at 256 attempts).
    literal_reading_implemented: Recorded per cell as not_exercised, not a defect and not a pass; only
      passes_verification is a procedure defect. Reviewer to decide how not_exercised cells count.
  - id: OQ-15
    topic: C-4 Horton at 24-bit
    ambiguity: '''at 16- and 20-bit only (24-bit ... if memory protection requires)''.'
    literal_reading_implemented: No minimum basis at 24-bit by default (GF(2) cycle rank reported); celltask
      --horton-24 exists but the driver never passes it.
  - id: OQ-16
    topic: v1 secondary 'blind_descent_success'
    ambiguity: Protocol v2 defines no descent step.
    literal_reading_implemented: Recorded as null with the reason; no descent implemented.
  - id: OQ-17
    topic: C-4 'charged work / sqrt(q)' unit
    ambiguity: Unit unstated; v1 charging_rule also lists sparse LA.
    literal_reading_implemented: Charged work = group operations of setup + attempts; LA is charged separately
      in mod-q mults and inversions (la_ops_charged) and is not converted; field ops (W_field) also reported.
      Instance construction Q = kG is uncharged. Rho is reported as walk (+escape) ops / sqrt(q).
  - id: OQ-18
    topic: LP log recovery fraction
    ambiguity: Anchor and denominator unstated.
    literal_reading_implemented: Anchor l(x(G)) = 1; fraction = verified determined LP classes / LP classes
      in the relation set.
  - id: OQ-19
    topic: C-6 rho 'if any cost comparison is made'
    ambiguity: charged work / sqrt(q) is a C-4 secondary, so a comparison is always made.
    literal_reading_implemented: Rho baseline (64 targets per fixture) always runs; walk multiplier labels
      are not in the protocol.
  - id: OQ-20
    topic: C-7 on a non-macOS host / success_criterion 'null controls passing'
    ambiguity: C-7 names macOS volumes; 'null controls passing' is not defined in v1 or v2.
    literal_reading_implemented: Same thresholds with '/' as the system volume. Null results are reported
      in full; the verdict follows C-5 only.
  inference:
    requested_policy: executor-implementation
    fallback_used: true
