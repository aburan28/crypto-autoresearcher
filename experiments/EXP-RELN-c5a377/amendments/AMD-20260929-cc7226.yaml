# AMD-20260929-cc7226 -- pre-data protocol amendment of EXP-RELN-c5a377,
# protocol version 3 -> 4. Additive. Approved by DEC-20260929-7a62cc.
# Responds to the implementation audit TASK-20260929-4626a5
# (validation_report.yaml, PASS_WITH_FINDINGS, F-1..F-10). Execution stays
# NOT admitted.
protocol_amendment:
  amendment_id: AMD-20260929-cc7226
  experiment_id: EXP-RELN-c5a377
  hypothesis_id: H-RELN-4d092c
  version_from: 3
  version_to: 4
  authored_by: coordinator
  authored_at: '2026-09-29'
  approved_by: coordinator
  approval_decision: DEC-20260929-7a62cc
  batch_id: BATCH-229ce4
  precedence: >-
    Protocol version 4 = specification.yaml + AMD-20260926-a7d25d +
    AMD-20260929-988139 + this file; this file governs where they differ.
  correction_of_v3_pre_data_status:
    finding: F-2
    corrects: AMD-20260929-988139 pre_data_status ("no delta or verdict was computed")
    correct_statement: >-
      Smoke run smoke/dry/DRYRUN-controls evaluated fixture b16-s11 at its
      frozen budgets (A1 = 249, A2 = 751) in the 'smoke|' seed namespace and
      its committed raw files (snapshot TASK-20260929-03d6bf) record
      treatment delta_proof / delta_ratio, ER-null inputs and subcritical-rule
      inputs. Under the protocol's random model this is an exchangeable
      replicate of scientific cells b16-s11-A1 and b16-s11-A2 with a different
      seed namespace. No frozen-label draw was evaluated.
    coordinator_attestation: >-
      The coordinator has not read any of those values: none appears in the
      coordinator session record, and the v3 rulings were made from
      implementation_report.yaml and the executor's summary, which state no
      delta value. The v3 rulings accept the implemented literal readings and
      the v4 rulings below are fail-closed, so neither could have been tuned
      toward an outcome.
    binding: >-
      The DRYRUN-controls delta readings are excluded from every analysis,
      evidence record and verdict of this experiment. No agent in this batch
      opens them before the scientific run's evidence record is committed.
      The existing artifacts stay immutable. Future smoke runs use budgets
      different from every frozen (A1, A2) or omit treatment delta fields
      (FX-6).
  rulings:
    - item: F-3 (ER null infeasible)
      ruling: >-
        Fail closed. In a size x budget cell with no feasible ER replicate the
        ER-exceeds clause is 'undetermined'. An undetermined cell cannot
        satisfy the supercritical-enriched requirement; if the verdict would
        otherwise be supercritical-enriched, it is inconclusive. The number of
        feasible ER replicates per cell is reported.
    - item: F-4 (planted known positive unreachable at small |V|)
      ruling: >-
        When |V| is below the minimum at which the planted positive (cycle
        rank ceil(|V|^1.5)) can reach delta_proof > 1/4 for the fixture's L,
        the known-positive control records known_positive = not_exercised:
        neither a pass nor a procedure defect, and the run continues. The
        C-5 verdict is unchanged. A negative or ER-matched reading in such a
        cell is reported as lacking known-positive power confirmation, and
        any evidence record scopes negative conclusions to cells where the
        known positive was exercised and passed. A FAIL where the control was
        reachable is still a procedure defect.
    - item: F-6 (OQ-14 recovery label)
      ruling: Required, as FX-4.
    - item: F-8 (cost-comparison exclusions)
      ruling: >-
        No code change. Any evidence record stating a cost ratio states the
        exclusions listed in F-8 beside it.
  required_fixes_before_admission:
    - id: FX-1
      finding: F-1
      what: >-
        Canonical run manifest with a top-level run: block (id,
        experiment_id, status, code, environment, inputs, timing, result);
        initial manifest written with status running before the first cell
        and updated per cell; run-level stdout.log / stderr.log in the run
        directory; exceptions and signals recorded as failed_infrastructure;
        environment.json lists yaml, scipy, networkx and sage versions.
    - id: FX-2
      finding: F-5
      what: >-
        The driver records protocol_version 4 and the sha256 of every
        governing amendment (a7d25d, 988139, cc7226) and of
        DEC-20260929-3d166b and DEC-20260929-7a62cc in the manifest. The
        trial plan may stay as is if its content is unchanged; if it changes
        its new sha256 is reported.
    - id: FX-3
      finding: F-3, F-4
      what: analysis.py and celltask.py implement the F-3 and F-4 rulings, with tests.
    - id: FX-4
      finding: F-6
      what: Cells with known_false = not_exercised report the recovery fraction as undetermined in analysis and report output.
    - id: FX-5
      finding: F-7, F-9
      what: >-
        check_decision refuses a decision with a status of superseded or
        withdrawn or a superseded_by field; the driver verifies the
        implementation file hashes against a snapshot receipt path given on
        the command line and refuses a mismatch or a dirty implementation
        tree; celltask.py refuses a non-smoke namespace unless launched by
        the admitted driver.
    - id: FX-6
      finding: F-2
      what: smoke.py refuses frozen (fixture, A1/A2) budget pairs, or omits treatment delta fields from smoke output.
    - id: FX-7
      finding: F-10
      what: command.txt records the driver argv; the memory watchdog fails closed if psutil is missing.
  affected_runs: []
  confirmatory_status: Confirmatory; frozen before any scientific data.
