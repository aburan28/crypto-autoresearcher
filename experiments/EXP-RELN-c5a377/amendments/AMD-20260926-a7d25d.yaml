  reason: >-
    Version 1 did not define delta, the relation generator, the large-prime
    bound or the attempt budget. The primary source is in-repo:
    inputs/idea_generation_20260718_batch2.md Candidate A2 (lines 215-318)
    and the RT-1472 theorem row inputs/autolab_research_ledger.md line 2243.
    The source defines delta TWO INCOMPATIBLE WAYS: the cost-model paragraph
    says "delta = log_L(#independent cycles / #edges advice)" and the proof
    track says "cycle-space dimension Omega(L^{1+delta})". Under the first,
    with edges counted as the advice actually generated, cycle rank <= |E|
    forces delta <= 0 and the 1/4 gate is unreachable by construction. The
    RT-1472 contract that fixed the definition (p1472 result JSON) is not in
    the repository.

  source_bindings:
    - path: inputs/idea_generation_20260718_batch2.md
      section: 'Candidate A2 -- Graphic-matroid cycle-basis large-prime enrichment (RT-1472 delta-meter)'
      provenance: internal
    - path: inputs/autolab_research_ledger.md
      section: 'row ECFG-RT-1472 (line 2243)'
      provenance: internal
      quoted_gate: >-
        Exact cost exponent max(2ell, 1-ell, 1+1/5-2ell), minimized at
        ell=1/3 with exponent 2/3. Explicit advice needs enrichment
        delta>1/4 to cross rho.

  changes:
    - id: C-1
      field: inputs.curve_rule
      new: >-
        Nine frozen fixtures, bits {16, 20, 24} x seeds {11, 12, 13}: the
        "EXP-RELN-c5a377" entries of
        experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.json
        (sha256 543f49ca5304f4e61085305ca2ea01ccc0085298db26368d7362f96b1b6a5a45),
        generated by ic_leads_fixtures_v2.py (sha256
        bde44afb3e14c34d97bf50c154456565d12f0b5a1d33d63b473f0f4124b1f3b2).
        Prime order q = N, generator G as listed. The executor regenerates and
        byte-compares before any run.
    - id: C-2
      field: inputs.factor_base_rule
      new: >-
        Factor base F: points with x(P) < B, B = ceil(p^{1/5}); vertex = one
        x-class (sign absorbed into the relation coefficient). Large primes:
        points with B <= x(P) < B2, B2 = ceil(p^{2/5}). L := number of
        liftable x-classes below B (recorded).
    - id: C-3
      field: relation generator (honest 2-LP)
      new: >-
        Target Q = k*G with k from SHA256 'EXP-RELN-c5a377/v2|target|<bits>|<seed>'.
        Attempt j: R_j = a_j*G + b_j*Q with (a_j, b_j) from
        '.../attempt|<bits>|<seed>|<j>'. Decide exactly whether
        R_j = e1*P1 + e2*P2 with x(P1), x(P2) < B2 by scanning P1 over all
        points with x < B2 and testing x(R_j - P1) < B2 (charged: every point
        operation). Classify: full (both < B), 1-LP, or 2-LP (edge between the
        two LP vertices). 1-LP relations are edges to a single root vertex
        (standard convention); full relations are counted separately.
        Attempt budgets: A1 = ceil(q^{1/2}) and A2 = ceil(q^{3/5}) attempts per
        fixture, both reported (the second is a superset prefix-continuation
        of the first).
    - id: C-4
      field: metrics.primary
      new: >-
        cycle_rank = |E| - |V| + c on the LP graph (root vertex included), and
        a Horton minimum cycle basis at 16- and 20-bit only (24-bit reports
        GF(2) cycle rank without the minimum basis if memory protection
        requires). Two delta readings, both reported, neither alone promoted:
        delta_proof := log_L(cycle_rank) - 1 (A2 proof track);
        delta_ratio := log_L(cycle_rank / |E|) (A2 cost-model paragraph;
        <= 0 by construction). Secondary: giant-component fraction, |E|/|V|,
        full-relation count, LP log recovery fraction after sparse solve over
        Z/q, charged work / sqrt(q).
    - id: C-5
      field: success / falsification mapping
      new:
        verdict_rule: >-
          Under delta_proof: supercritical-enriched iff delta_proof lower 95%
          CI > 1/4 at both budgets and all three sizes with a flat or rising
          trend, AND the Erdos-Renyi null with identical |V|, |E| does not also
          exceed 1/4 (the enrichment must exceed what edge count alone gives).
          Certified subcritical iff the giant component fraction < 0.05 and
          cycle_rank <= 2 * (number of components with a cycle) at all sizes.
          Otherwise inconclusive.
        definitional_impediment: >-
          Because the RT-1472 definition of delta is unavailable, a
          supercritical-enriched verdict under delta_proof may not be read as
          crossing RT-1472's gate until the RT-1472 source is acquired and a
          v3 amendment maps delta_proof onto it. A subcritical or ER-matched
          verdict is reportable as is.
    - id: C-6
      field: controls (made concrete)
      new:
        matched_null: >-
          Degree-preserving configuration-model rewire of the observed LP graph
          (32 replicates, seeds '.../rewire|<i>') and Erdos-Renyi G(|V|, |E|)
          (32 replicates).
        known_positive: >-
          Planted-dense graph on the observed vertex set with cycle rank
          forced to |V|^{1.5}: the pipeline must report delta_proof > 1/4 on it.
        known_false: >-
          Relations with coefficients scrambled (a_j, b_j permuted across
          attempts) must fail LP log recovery verification.
        baseline: >-
          Pollard rho with negation map, 64 targets per fixture, group
          operations / sqrt(q) against 0.886, if any cost comparison is made.
        accounting_audit: >-
          Independent checker replays 10% of attempts (SHA256-selected) and
          rejects receipts that omit failed attempts.
    - id: C-7
      field: budget / execution_admission
      new: >-
        maximum_memory_gb 8, maximum_workers 1, maximum_runs 1 unchanged.
        currently_admitted stays false. Machine-protection admission
        precondition (user instruction 2026-09-26): at claim time 15-minute
        load <= 14, system volume >= 5 GiB free, repository volume >= 20 GiB
        free; readings recorded in the manifest.

  affected_runs: []
  confirmatory_status: Confirmatory; frozen before any data.
  claim_ceiling_unchanged: Toy fixtures (q < 2^24); no cryptographic-size transfer.
