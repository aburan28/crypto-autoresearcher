experiment:
  id: EXP-AES-f9f4d9
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-AES-49d2c7
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  source_idea_id: IDEA-20260805-86e431
  title: >-
    The cipher-free r=5 collision surrogate as an exact cross-instrument anchor,
    and the exact-value reading of n_r at r=6 against a matched 10-round
    permutation control with its resolution stated in bits

  objective: >-
    Reduce two uncertainties, in this order. FIRST, whether the r=5
    coset-collision count n_5 is EXACTLY computable without the cipher as the
    collision count of H(A) = XOR_col G_col(a_col) -- which, if true, converts a
    3-bit-per-trial residue confirmation into an approximately 31-bit exact
    forced value, supplies by DERIVATION the cross-instrument anchor
    EV-AES-d8a13e lists as an unresolved confound, and opens an S-box-sensitive
    reading of an object DEC-20260802-9bda5c ruling 3 scoped as following from
    round geometry alone. SECOND, and only if the first succeeds, what the exact
    value of n_6 does relative to a matched 10-round-AES permutation control at
    identical 2^32 data complexity, measured over at least 24 independent arms
    per family with a round-count decay check across r in {4,5,6,7,10} and a
    forward-diagonal sibling null. THE PRE-REGISTERED PREDICTION FOR THE SECOND
    IS NO DIFFERENCE.

  what_this_is_not:
    - Not an attack and not a key recovery; the surrogate consumes the key and recovers nothing.
    - >-
      Not a claim that a distinguisher exists at r = 6. The pre-registered
      prediction is the null and the honest prior on the alternative is 0.10.
    - >-
      Not an extension of the r=5 derivation to r = 6. The campaign's own
      committed section 3.6 states why it does not extend, and this contract
      does not contradict it.
    - >-
      Not a retraction, re-scoping or upgrade of DEC-20260802-9bda5c ruling 3.
      The r=4 and r=5 RESIDUE properties follow from round geometry and were
      reproduced with random bijective S-boxes at 120/120; that stands whatever
      this contract measures about the exact value.
    - Not a status change to any hypothesis, evidence record, decision or goal record.
    - Not a cost, exponent, asymptotic, cryptographic-scale or deployed-scheme claim.
    - >-
      Not a statement about full-round or deployed AES, and not a comparison to
      published cryptanalysis in either direction (RQ-AES-003 R3, symmetric).
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      At most: for the AES-shaped SPN family under the pinned C1 convention,
      with the mixing matrices actually tested, on the full 2^32 coset of D_0
      with the ID_{j0} projection, on this machine, with the declared seeds:
      (a) an exact cipher-free predictor of n_5, validated on a declared number
      of instances; (b) a MEASURED bound in bits on any mean shift or dispersion
      excess of n_6 against a matched 10-round control at 2^32 data, at the
      declared K. NEITHER IS A STATEMENT ABOUT AES SECURITY. Even the strongest
      possible outcome -- a measured r=6 difference meeting completion criterion
      C3 -- would be `toy`-tier evidence about 6-round AES-128 on one machine
      and would be NO statement about full-round or deployed AES and NO
      comparison to the published frontier in either direction (R6, R3, R5).

  inputs:
    committed_fixture_paths:
      - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/count5/PREREGISTRATION.md
      - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/count5/raw.jsonl
      - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/count5/count5.c
      - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/count5/pin_result.json
      - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-142a4b/cnt.c
      - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-142a4b/raw.jsonl
      - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-142a4b/pin_result.json
    fixture_enumeration_rule: >-
      EVERY record in both raw.jsonl files is enumerated, including records with
      status no_result_terminated_or_failed and including the VOIDED r=3 arm
      whose uint8 occupancy counters saturated at a true occupancy of 2^24. A
      voided arm is reported as voided and is NEVER used as a fixture value;
      dropping it silently is invalid_measurement. Arm independence is
      established from the committed rk_sha256 and base fields, and any arms
      sharing a ciphertext set are grouped and counted once.
    fixed_object:
      coset: full 2^32 coset of the plaintext diagonal D_0, bytes {0,5,10,15} free
      projection: "pi_{j0}(c) = bytes at ID_{j0} = {4*((j0-t) mod 4)+t for t = 0..3}, byte t at bit 8t"
      convention: >-
        C1: s = P ^ RK[0]; rounds 1..r-1 full; round r = SB, SR, ARK with no
        MixColumns. Identical to the pinned aes_reduced.py lineage.
      counted_quantity: n_r = sum_v C(m_v, 2) over the 2^32 projection values
      cross_check: n_alt = (sum_v m_v^2 - N) / 2, required to agree exactly
    surrogate_definition:
      G: "G_col(a)[i] = M[i][t_i] * S(b_col[t_i] XOR a * v_col[t_i]), t_i = (col - j0 + i) mod 4"
      v: "v_col = M[:, (-col) mod 4]"
      b: "the 16-byte base of the round-2 image coset of M_0, obtained from two rounds on one text"
      H: "H(a_0,a_1,a_2,a_3) = XOR_col G_col(a_col) on (F_2^8)^4"
      claim: "n_5 = sum_v C(m_v,2) with m_v = |H^{-1}(v)|, exactly"
    stage_parameters:
      round_counts: [2, 3, 4, 5, 6, 7, 10]
      j0_values: [0, 1, 2, 3]
      mixing_matrices: ["AES", "00030101010203010101020303010102"]
      arms_per_family_minimum: 24
      sbox_swap_instances: 20
      occupancy_counter_width_bits: 8
      occupancy_saturation_guard: mandatory
    master_seed: 20260805
    seed_derivation_rule: >-
      Every instance is derived deterministically so a third party reproduces it
      bit for bit. Let
        digest(label, i) = SHA-256( "EXP-AES-f9f4d9/v1" || "|" || label || "|" ||
                                    decimal(master_seed) || "|" || decimal(i) ),
      big-endian unsigned.
      ARM i of family F:  key_i  = first 16 bytes of digest(F || "-key", i)
                          base_i = first 16 bytes of digest(F || "-base", i)
                          j0_i   = int(digest(F || "-j0", i)) mod 4
      SBOX SWAP instance u: a uniform random bijection on 256 points obtained by
                          Fisher-Yates over 0..255 driven by the byte stream
                          digest("sbox", u) || digest("sbox", u + 2^20) || ...,
                          consuming bytes in order with rejection sampling.
      Families are: AES_r4, AES_r5, AES_r6, AES_r7, PRP_r10, SIBLING_fwd_r5.
      The C and Python programs contain no RNG; every parameter arrives on the
      command line as hex, exactly as the committed count5.c does. The full
      derived list is written to params.json and hash-committed BEFORE any run.

  arms_and_controls:
    treatment: >-
      AES_r6: K >= 24 independent arms at r = 6 on the full coset with the
      ID_{j0} projection, exact n_6 recorded as an integer with its full
      occupancy histogram.
    measured_null: >-
      PRP_r10: K >= 24 independent arms with the identical coset, identical
      projection and identical 2^32 data complexity, cipher replaced by
      10-round AES-128 as a random-permutation surrogate. FORCED VALUES DERIVED
      BEFORE THE RUN: mean n = 2147483647.5, per-arm sd 46341 = 2^15.50,
      dispersion index 1.00 within relative error sqrt(2/(K-1)) = 0.29 at
      K = 24. THIS NULL CAN FAIL: a measured control mean shift beyond 3
      empirical standard errors or a dispersion index outside [0.6, 1.6] refutes
      HEUR-E2 and VOIDS every r=6 threshold built on it.
    positive_control: >-
      EXACT ARMS WHERE THE EFFECT MUST APPEAR, RUN FIRST AND BLOCKING
      EVERYTHING: r = 2 with j0 = 0 must give exactly 0; r = 2 with j0 != 0 must
      give exactly 9223372034707292160; r = 3 must give exactly
      36028794871480320; r = 4 must give exactly 0. These are 55- and 63-bit
      integers, committed and independently re-measured by the BATCH-001
      validator after the producer's own r=3 control was VOIDED by counter
      saturation. IF ANY FAILS, THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT
      FROM ANY OTHER ARM MAY BE REPORTED AT ALL. The surrogate must
      independently return 0 at r = 4 with no special-casing.
    graded_control: >-
      ROUND-COUNT DECAY across r = 4, 5, 6, 7 and the 10-round control -- five
      points, four of them interior -- with the mean-deviation and dispersion
      statistics reported at every point and MONOTONICITY STATED EXPLICITLY:
      D_5 >= D_6 >= D_7 >= D_10 and the mean shift decaying in magnitude. A
      statistic that fails to decay as rounds rise is the canonical artifact
      tell (docs/inventor-protocol.md section 3) and VOIDS the reading.
    sibling_null: >-
      SIBLING_fwd_r5: identical everything, but the projection reads the FORWARD
      diagonal D_{j0} instead of ID_{j0} -- wrong ShiftRows handedness, same
      shape, same 32 bits, same data complexity. It ISOLATES the output geometry
      rather than merely discriminating structured from unstructured, which is
      the V-804-1 obligation left undischarged for three batches and required by
      KN-FIND-029 practice rule 6. FORCED: at the uniform null in both mean and
      dispersion, while the AES arm at the same r is not.
    second_sibling_sbox: >-
      Twenty paired surrogate instances, AES S-box against a uniform random
      bijection, same key, base, j0 and mixing matrix. DEC-20260802-9bda5c
      ruling 3 forces the residue mod 8 to agree at both; the exact value is
      where any S-box content must appear if it exists. This isolates the S-box
      from the geometry, which the residue provably cannot do.
    ordering_control: >-
      THE PRP_r10 CONTROL ARMS ARE GENERATED, MEASURED AND HASH-COMMITTED BEFORE
      ANY AES_r6 ARM IS LOOKED AT, and the frozen decision rule is executed on
      them first. Absence of that commitment is invalid_measurement. This is not
      a formality: EV-AES-d8a13e records two null arms in BATCH-002 being added
      AFTER the main result was read, disclosed by the producer and assessed by
      the red team, and this contract removes the possibility.
    comparability_policy: >-
      Fixture values from the committed raw.jsonl files are used ONLY as a
      stage-1 exactness fixture for the surrogate and are NEVER pooled with
      newly generated arms into any population statistic. Arms differing only in
      j0 over the same ciphertext set are ONE arm for population purposes.
      Comparison across mixing matrices is reported separately per matrix, never
      merged.

  metrics:
    primary:
      - >-
        Exact surrogate value minus exact measured value, per fixture arm, as a
        signed integer. Required to be 0 on every arm.
      - >-
        Mean deviation of n_6 from 2147483647.5 over K >= 24 arms, MINUS the
        same statistic over K >= 24 PRP_r10 arms, divided by the combined
        EMPIRICAL standard error, with the resolution stated in bits in the same
        sentence.
    secondary:
      - Dispersion index Var(n_r)/E[n_r] at r = 4,5,6,7 and at PRP_r10, with monotonicity stated.
      - Exact n and n_alt per arm, required to agree, plus the full occupancy histogram.
      - Surrogate wall clock and measured peak RSS per configuration, against the committed 549.69 s soft-engine comparator.
      - Number of sbox-swap instances whose exact values differ while residues agree, out of 20.
      - Sibling-null mean deviation and dispersion, with its resolution.
      - Arm-independence report derived from rk_sha256 and base for every fixture arm.
      - The AES-NI pinning receipt, or an explicit record that it is absent.

  preregistered_prediction:
    quantity: >-
      The difference between the AES_r6 population mean deviation and the
      PRP_r10 population mean deviation, in units of the combined empirical
      standard error.
    formula: >-
      Z = ( mean(n_6) - mean(n_PRP) ) / sqrt( s6^2/K6 + sP^2/KP ), where s6 and
      sP are the EMPIRICAL per-arm sample standard deviations of each family.
      The Poisson standard error is NOT used: the committed r=5 arms give an
      empirical dispersion index of about 20 against a Poisson value of 1, and
      using the Poisson error would understate the spread by about a factor 4.5
      and manufacture significance (HEUR-E4).
    source: >-
      Derived in H-AES-49d2c7. The null value E[n] = (2^32 - 1)/2 = 2147483647.5
      and the per-arm sd 46341 = 2^15.50 are elementary occupancy computations
      derived in this repository; no external source was read.
    frozen_decision_value: >-
      |Z| > 4. NULL PREDICTED: |Z| <= 4, i.e. NO DIFFERENCE. At K = 24 with an
      empirical per-arm sd near 2.1e5 the resolution of the difference is about
      6.1e4, i.e. 2^-15.1 of the count, AND THAT FIGURE IS STATED IN THE SAME
      SENTENCE AS ANY CLAIM (RQ-AES-003 R4(1)).
    additional_frozen_values:
      uniform_null_mean: 2147483647.5
      uniform_null_per_arm_sd: 46341
      resolution_per_arm_bits: -15.50
      dispersion_index_at_control: 1.00
      dispersion_index_relative_error_at_K24: 0.29
      exact_positive_controls:
        r2_j0_eq_0: 0
        r2_j0_ne_0: 9223372034707292160
        r3: 36028794871480320
        r4: 0
      fixture_arms_to_be_reproduced_exactly:
        - 2147430696
        - 2147459328
        - 2147193296
        - 2147610584
        - 2147427792
        - 2147022152
        - 2147144880
        - 2147660512
        - 2147411968
    prediction_binding: >-
      This block is hash-committed as a PREREGISTRATION artifact whose sha256 is
      recorded in the results artifact and reproduced verbatim in the report,
      following the TASK-20260801-807 practice the red team confirmed is
      anchored in committed bytes. A falsified prediction is LEFT AS WRITTEN,
      labelled, and its downstream propagation traced. NO tolerance, threshold
      or family definition may be revised after any reading is observed;
      EV-IC-001 is this program's own precedent for the failure that rule
      prevents.

  replication:
    seeds: [20260805]
    derived_instance_count: >-
      >= 24 arms each for AES_r6 and PRP_r10; >= 24 surrogate arms at r = 5;
      >= 8 arms each at r = 4 and r = 7; >= 8 SIBLING_fwd_r5 arms; 20 sbox-swap
      surrogate pairs; 9 fixture reproductions.
    planned_runs: 96
    interpretation: >-
      Replication is over derived independent keys, bases and j0, not over
      repeats of one instance. TWO KEYS IS NOT A DISTRIBUTION and completion
      criterion C3 says so in its own words; the committed record currently has
      ONE PRP arm and TWO r=6 arms, which is exactly why K >= 24 is contracted.

  budget:
    wall_clock_seconds: 12000
    cpu_seconds: 48000
    memory_gb: 8
    maximum_runs: 96
    maximum_workers: 4
    no_network: true
    stage_budgets:
      stage_0_reading_and_derivation: 1800
      stage_1_surrogate_build_and_fixture: 3600
      stage_2_sbox_swap: 1800
      stage_3_surrogate_population_r5: 5400
      stage_4_cipher_arms_r6_and_control: 12000
    compute_component_reported_separately: >-
      Required by the adopted clock convention C4 and load-bearing here: this
      contract is compute-heavy and its compute seconds are NOT the charged
      clock (C1). Cipher compute, surrogate compute and authoring elapsed are
      reported in three separate fields.
    budget_basis: >-
      Surrogate: 2^32 iterations of three XORs, one table read and one increment
      into a 4 GiB uint8 array, predicted below 180 s per configuration against
      the committed soft-engine comparator of 549.69 s. Stage 4 is the binding
      constraint: at the committed soft-engine rate of about 550 s per arm,
      48 cipher arms need about 26400 s and DO NOT FIT inside this contract; at
      the reported AES-NI rate of about 53 s per 2^32 sweep they need about
      2500 s and do. STAGE 4 IS THEREFORE GATED ON THE AES-NI PINNING RECEIPT
      AND IS NOT COSTED AGAINST THE SOFT ENGINE.
    concurrency_note: >-
      max_concurrent 3 is a cap ACROSS all three active AES campaigns, not 3
      each. If honouring it would mean running degraded, this contract's task
      WAITS. BATCH-002 overran by roughly 5700 s because that instruction was
      treated as advisory and two producers had to be re-run alone.

  stopping_rules:
    - >-
      Do not execute unless this contract is separately reviewed, approved,
      frozen, archived and execution-authorized by the Coordinator (AGENTS.md
      rule 1).
    - >-
      STAGE 1 IS THE CHEAPEST DECISIVE GATE AND RUNS FIRST. If the surrogate
      fails to reproduce ANY committed r=5 fixture integer exactly, STOP. Stages
      2-4 are not run, and the disagreement -- localised by construction to the
      derivation, count5.c or cnt.c -- is the deliverable.
    - >-
      If any exact positive control (r = 2 j0=0, r = 2 j0!=0, r = 3, r = 4)
      fails, STOP. The instrument is broken and no negative result may be
      reported. THE CAMPAIGN'S OWN VOID CONDITION V1 REQUIRED EXACTLY THIS AND
      WAS NOT HONOURED ONCE; EV-AES-005 records the deviation as unrepaired.
      THIS CONTRACT MAKES THE STOP MANDATORY AND AUDITABLE: the control verdict
      is written and hash-committed before any further arm is launched.
    - >-
      If any occupancy counter saturates, HALT that arm, record
      invalid_measurement, and do not interpret the reading.
    - >-
      Stage 4 does not start unless a machine-readable AES-NI pinning receipt
      exists covering every round count used, across r = 3-7 and against
      FIPS-197 at full round. Without it, stage 4 is recorded as OUT OF SCOPE
      FOR EXECUTION and is NOT estimated (AGENTS.md rule 9).
    - >-
      Stage 4 does not start unless the PRP_r10 control arms are already
      measured and hash-committed.
    - >-
      HALT at the declared binding_stop_utc, recording halted_on_budget
      truthfully and NAMING the dropped work. A halt is infrastructure signal;
      dropped work is SCOPE, never an answer.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - Any missing params.json, missing preregistration digest, or any raw record not matching the declared schema.
    - Any n and n_alt disagreement, or any sum_v m_v != N.
    - Any occupancy counter reaching its maximum representable value.
    - Any pooling of committed fixture arms with newly generated arms into one population statistic.
    - Any pooling of arms that share a ciphertext set and differ only in j0.
    - Any use of the Poisson standard error where the empirical one is contracted, or any switch between them after a reading is observed.
    - Any measurement charged to the AES-NI path without its pinning receipt.
    - Any post-hoc revision of the frozen thresholds, families or tolerances.

  success_criterion: >-
    The contract SUCCEEDS -- meaning it produced a determinate reading, NOT that
    any distinguisher was found -- when all of the following hold:
    (1) the surrogate reproduces every committed r=5 fixture integer EXACTLY and
        returns 0 at r = 4 with no special-casing;
    (2) all four exact positive controls pass and their verdict is committed
        before any further arm;
    (3) the 20 sbox-swap pairs are reported with the count of exact-value
        differences and the count of residue agreements;
    (4) K >= 24 PRP_r10 control arms are measured and hash-committed BEFORE any
        AES_r6 arm is read, with their mean, empirical sd and dispersion index;
    (5) K >= 24 AES_r6 arms are measured and Z is reported against the frozen
        decision value 4, with the resolution in bits in the same sentence;
    (6) the round-count decay check is reported across r = 4,5,6,7,10 with an
        explicit monotonicity statement;
    (7) the forward-diagonal sibling null is reported at r = 5;
    (8) every cost figure is measured, with peak RSS measured, not modelled, and
        compute reported in its own field;
    (9) arm independence is established from rk_sha256 and base for every
        fixture arm, and any shared-ciphertext arms are grouped.
    A run meeting (1)-(9) is determinate whichever way Z falls.
    ONLY IF |Z| > 4 AND (6), (7) and the stated resolution all hold does the
    package become a candidate for completion criterion C3 -- and even then the
    conclusion is `toy`-tier, scoped to 6-round AES-128 on this machine, with
    novelty against the published frontier recorded SEPARATELY as inconclusive
    and NEVER merged into the verdict (RQ-AES-003 R3, R5; GOAL-AES-003 P5).

  falsification_criterion: >-
    H-AES-49d2c7 is FALSIFIED, in whole or in the named part, by any of:
    F1 any committed r=5 fixture integer the surrogate does not reproduce
       exactly -- part (A) falls, or the committed section 3.5 is wrong, or one
       of the three engines is;
    F2 the surrogate returning non-zero at r = 4 -- part (A) is internally
       inconsistent and the contradiction routes to a correction record;
    F3 the AES S-box and a uniform random bijection giving the SAME exact n_5 in
       a majority of the 20 pairs -- part (B) is dead;
    F4 the PRP_r10 control showing a mean shift beyond 3 empirical standard
       errors or a dispersion index outside [0.6, 1.6] -- HEUR-E2 fails and NO
       arm in this family, including the campaign's committed ones, may be read
       as a distinguisher;
    F5 a dispersion index or mean deviation that does NOT decay across
       r = 5, 6, 7 and the control -- artifact tell, whole reading void;
    F6 occupancy saturation at any arm -- invalid_measurement, never a negative
       observation;
    F7 arm independence not establishable for the fixture arms -- no pooled
       statistic over them may be quoted.
    THE PLANNED NEGATIVE: |Z| <= 4 is the PREDICTED outcome and is NOT a
    falsification of anything. Its deliverable is a MEASURED BOUND -- the
    largest mean shift and dispersion excess excluded at r = 6, stated in bits
    with K and the resolution named -- plus forward guidance naming which
    statistics remain unread on the same arms. A negative that does not produce
    that bound HAS NOT FINISHED.

  outcomes:
    no_execution_authorization: >-
      The only current disposition: a review_required draft. No run, no
      evidence, no mathematical inference.
    surrogate_confirmed_r6_null: >-
      THE EXPECTED OUTCOME, prior 0.90 x 0.90. An exact cipher-free predictor of
      n_5 validated on >= 9 committed integers; a derivation-based
      cross-instrument anchor closing one of EV-AES-d8a13e's unresolved
      confounds; and a measured bound in bits at r = 6. Scoped toy. NOT a
      completion criterion.
    surrogate_refuted: >-
      Stage 1 fails. A three-way localisation between the committed derivation,
      count5.c and cnt.c, which is a first-class finding and blocks the r=6
      arms until resolved.
    r6_difference_measured: >-
      |Z| > 4 with the decay check, sibling null and stated resolution all
      holding. A CANDIDATE for completion criterion C3, routed to
      review-breakthrough at max per AGENTS.md rule 12, with novelty recorded
      separately as inconclusive and never merged. Honest prior 0.10.
    infrastructure_or_integrity_failure: >-
      Inconclusive INFRASTRUCTURE SIGNAL, never evidence against H-AES-49d2c7
      and never a mathematical result.

  infrastructure_failure_disposition: >-
    A TIMEOUT, CRASH, MISSING DEPENDENCY, COMPILER FAILURE, OCCUPANCY-COUNTER
    SATURATION, OUT-OF-MEMORY CONDITION, MISSING AES-NI PINNING RECEIPT OR
    BUDGET HALT IS REPORTED AS INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE
    MATHEMATICAL EVIDENCE (AGENTS.md rule 5; GOAL-AES-003 P3). In particular:
    the absence of the AES-NI pinning receipt makes stage 4 OUT OF SCOPE FOR
    EXECUTION, which is a scheduling and instrumentation fact and says NOTHING
    about r = 6; a 4 GiB allocation failure for the occupancy array halts the
    surrogate and is reported with the measured available memory; and container
    drift -- the proposing session measured `import numpy` succeeding at 2.4.6
    against RQ-AES-003's constraint block stating no numpy, and `import Crypto`
    failing under five system interpreters against a committed BATCH-001
    pin_result.json recording a passing pycrypto column -- is REPORTED as drift
    and NEVER asserted to make any committed receipt false.

  scale_relevance:
    tier: toy
    why_conclusions_transfer_or_not: >-
      The r=5 identity is EXACT and scale-free within its family: it holds for
      every key, base, j0 and admissible mixing matrix of the AES-shaped SPN, so
      validating it at nine instances validates a theorem rather than
      extrapolating a trend. IT TRANSFERS TO NOTHING OUTSIDE THAT FAMILY, and in
      particular not to r = 6, not to other cosets, not to other projections and
      not to full-round AES. The r=6 measurement is a population statement at
      one round count, one coset shape and one data complexity, on one machine,
      at the declared K; its transfer to any other round count is zero and its
      transfer to full-round AES is zero and forbidden. DEC-20260802-9bda5c
      ruling 3 additionally binds every description: the RESIDUE properties are
      not AES-specific, and if the exact channel turns out to be, that is a
      narrower new statement and never a widening of the old one.

  required_artifacts:
    - The frozen approved specification and a freeze receipt binding its sha256.
    - params.json with every derived key, base, j0 and S-box permutation, hash-committed before any run.
    - The PREREGISTRATION artifact carrying every frozen value and threshold, sha256 reproduced verbatim in the report.
    - Surrogate source with a comment-block inference stanza in its own text, plus its build command and compiler version.
    - Per-arm raw records: exact n, n_alt, agreement flag, full occupancy histogram, max occupancy, saturation-guard status, r, j0, key digest, base, mixing matrix, family, seconds.
    - The exact positive-control verdict, hash-committed before any further arm is launched.
    - The PRP_r10 control population summary, hash-committed before any AES_r6 arm is read.
    - Surrogate-versus-measured table with signed differences, one row per fixture arm.
    - Arm-independence report derived from rk_sha256 and base, naming any grouped arms.
    - The AES-NI pinning receipt covering every round count used, or an explicit record of its absence with stage 4 marked out of scope.
