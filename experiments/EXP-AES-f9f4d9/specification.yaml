  cheapest_decisive_stage: >-
    STAGE 1, and it can terminate the whole line. Building H and evaluating it
    against nine committed integers costs a table build plus a handful of 2^32
    counting passes and NO cipher work; an exact match on a 31-bit integer, nine
    times, is decisive, and a single mismatch stops everything downstream. Stage
    0 -- re-deriving one line of algebra by hand -- is cheaper still and can
    also stop the line before any code is written.
