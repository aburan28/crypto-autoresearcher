experiment:
  id: EXP-ECDLP-83ac2d
  hypothesis_id: H-ECDLP-1288e1
  version: 1
  title: >-
    Verification protocol - cover-and-decidability test of the DECOMPOSITION.md
    section-2 R1-R8 resource taxonomy against the enumerable ECDLP method
    inventory, under a placement rule frozen before the inventory is read, with
    the fourteen committed lanes as a known-answer fixture, a generic-method null
    whose OUTSIDE placement the section-2 admissibility filter pre-declares, a
    hybrid null that must receive a multi-element set, a four-rung synthetic
    ladder at resource counts 0/1/2/3, and a mandatory T5 reachability field per
    row
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260815-17cead into a verification protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. The Stage-0 gate that an earlier draft of this contract left
    terminal is now RESOLVED against the committed record - see
    stage_0_gate_resolved below - and the design has been restated accordingly.
  objective: >-
    Test whether the R1-R8 resource taxonomy that GOAL-ENDO-001's section-2
    admissibility filter uses to close a lane "before it costs anything" is a
    decidable, reproducible COVER of the enumerable ECDLP method space: whether
    every method receives a nonempty resource set or the declared `none` audit
    class using only the table's own definitions, and whether two independent
    placers agree. What artifact is checked (each method's resource assignment),
    against what reference (the section-2 table quoted verbatim), and what result
    fails it (a method receiving no resource, an assignment achievable only by
    loosening a row, or a placer disagreement) are all fixed before the inventory
    is enumerated.
  stage_0_gate_resolved: >-
    RESOLVED 2026-09-04, FROM THE RECORD RATHER THAN FROM ITS ABSENCE AT A PATH.
    An earlier draft of this contract recorded the cell definitions as
    unlocatable because ledger/goals/GOAL-ENDO-001.yaml does not exist. THAT WAS
    A LOOKUP ERROR, not an absence: the goal is stored in the sharded layout at
    ledger/goals/GOAL-ENDO-001/goal.yaml with checkpoints/ alongside, which
    CLAUDE.md describes and which tools/shard_goal.py produces. The Coordinator
    subagent read that record and found status `active`, completion criteria
    C1-C4, pause conditions P1-P3, and an opening note stating that BATCH-cb71b5
    "fixes the decomposition
    (analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md)". It then
    opened that document and read the section-2 R1-R8 taxonomy table, the
    section-2 admissibility filter, the section-3 transport theorems T1-T5, the
    fourteen lane declarations in section 4, and sections 5 and 6. THE CELL
    DEFINITIONS EXIST, ARE PRECISE, AND ARE QUOTED. Stage 0 is therefore no
    longer a terminal gate; it is now a REPRODUCTION step that re-quotes the
    table and hashes it, and the experiment proceeds.
  inputs:
    taxonomy_reference: >-
      The section-2 table of
      analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md, re-quoted
      verbatim at Stage 0 into results/cell_definitions.md with the artefact path
      and content hash recorded. Its eight rows are R1 x-coordinates as field
      elements (index calculus, Semaev); R2 the curve equation (a,b) / model; R3
      End(E) as a ring (ideals, norms, class group); R4 the isogeny graph /
      class-group action; R5 ell-torsion for ell != N as a Galois module; R6
      lifts to Z_p / char 0; R7 pairings into F_{p^k}; R8 multi-instance /
      preprocessing structure. The declared `none` class - used by L12 "Resource
      none - this lane audits resources" and by L14 "Resource none" - is a
      LEGITIMATE outcome and is carried as a ninth admissible label, never as a
      no-fit verdict.
    admissibility_filter: >-
      Quoted verbatim at Stage 0: "A lane is inadmissible on its face if the only
      thing it does with `phi` is apply it to points of `G`. Any lane in this
      campaign must therefore name a resource that is not a group-operation
      output," and "A lane that cannot name its resource is closed before it
      costs anything." This is what pre-declares the generic-method null's
      outcome and what makes a cover failure consequential rather than cosmetic.
    method_inventory: >-
      Enumerated from this corpus and the literature it cites, with the
      enumeration rule stated and the inventory size REPORTED AS A MEASURED
      FLOOR. Every entry carries the record or reference it was enumerated from.
    placement_rule_frozen_before_inventory_is_read: >-
      Written and HASHED into results/placement_rule.md before the inventory is
      enumerated. It must state: that a resource is assigned only when the
      method's consumed object matches a row's "What it is" text, quoted; that
      assignment is a SET and a method may receive several resources, since the
      committed lanes already do; that the declared `none` class is assigned only
      to a method that audits resources rather than consuming one; that a method
      whose only use of an endomorphism is applying it to points of the
      prime-order subgroup is placed OUTSIDE by the admissibility filter; that a
      method matching no row and not qualifying for `none` or OUTSIDE is
      NO-RESOURCE; and that any assignment achievable only by loosening a row's
      text is STRETCHED and is recorded with the loosening named.
    t5_field: >-
      Every placement row additionally records the method's T5 reachability
      answer - whether the structure it needs is common enough to hit by random
      walking, locally detectable at each step, or identifiable only by a global
      address - or NOT STATED. Section 3 requires that "every lane in this
      campaign carries reachability as a mandatory second gate", so a row without
      this field is incomplete by the campaign's own rule.
    pre_declared_null_outcomes: >-
      Written into results/forced_values.yaml BEFORE any placement: (a) the
      generic method places OUTSIDE, by the section-2 admissibility filter,
      quoted - this is a FORCED VALUE read from the record, not an open question;
      (b) the hybrid method receives a set of size at least 2 with each element
      cited; (c) the four synthetic ladder rungs return set sizes exactly 0, 1, 2
      and 3; (d) each of the fourteen committed lanes returns its own declared
      resource set exactly.
  controls:
    - id: CTRL-FOURTEEN-LANE-FIXTURE
      description: >-
        KNOWN-ANSWER FIXTURE READ OFF THE COMMITTED RECORD, AND THE STRONGEST
        CONTROL AVAILABLE HERE. Section 4 declares a resource set for each of the
        fourteen lanes - for example L1 "Resource R1, R2, R4", L11 "Resource R1,
        R2", L12 "Resource none - this lane audits resources", L14 "Resource
        none". Apply the placement procedure to each lane's own decisive test,
        blind to the declared answer, and require it to return that lane's
        declared set EXACTLY, including both `none` lanes.
      failure_meaning: >-
        A procedure that cannot recover assignments the campaign has ALREADY
        COMMITTED cannot be trusted on assignments it has not. Any lane not
        reproduced localizes the defect by name, and every assignment outside the
        fixture is VOID. This is a fourteen-row control with known answers of
        varying set size (0, 1, 2 and 3 elements all occur), so it demonstrates
        dynamic range on real objects rather than only on synthetic ones.
    - id: NULL-GENERIC-METHOD
      description: >-
        NAMED NULL WITH A FORCED, PRE-DECLARED OUTCOME, AND IT CAN FAIL. Pollard
        rho, which consumes no non-generic resource. Section 2's admissibility
        filter pre-declares the answer: a method that only applies phi to points
        of G is "inadmissible on its face", so rho places OUTSIDE.
      failure_meaning: >-
        The earlier draft of this contract allowed UNDECLARED as an outcome here,
        on the source proposal's supposition that the partition might never have
        said where a generic method goes. IT HAS SAID. A return of UNDECLARED now
        means the procedure is not applying section 2, and every placement is
        suspect.
    - id: NULL-HYBRID-METHOD
      description: >-
        SECOND NAMED NULL. Index calculus with an endomorphism-invariant factor
        base, which consumes x-coordinates as field data (R1) and endomorphism or
        isogeny structure (R3 or R4). It must receive a set of size at least 2,
        each element citing its row.
      failure_meaning: >-
        A hybrid forced to a single resource means the procedure discards the
        multi-label structure the committed lanes already use, and it would
        manufacture an exclusivity defect that the record shows does not exist.
        Run INVALID.
    - id: CTRL-NONE-CLASS
      description: >-
        THIRD DECLARED-OUTCOME CONTROL. The two audit lanes declaring "Resource
        none" must receive the `none` class, NOT a NO-RESOURCE verdict and NOT
        OUTSIDE.
      failure_meaning: >-
        Scoring a declared `none` lane as a cover failure would inflate the
        no-resource count with the procedure's own misreading, which is the
        cheapest way this audit could manufacture the defect it is measuring.
    - id: CTRL-SYNTHETIC-RESOURCE-LADDER
      description: >-
        DEMONSTRATED DYNAMIC RANGE ON PLANTED COUNTS OF KNOWN SIZE. Four
        synthetic methods constructed by the driver, consuming exactly 0, 1, 2
        and 3 taxonomy resources respectively, each described in the vocabulary
        of the table's "What it is" column. The procedure must return set sizes
        exactly 0 (placing OUTSIDE by the filter), 1, 2 and 3, naming the correct
        resources at each rung.
      failure_meaning: >-
        A ladder that does not separate the four counts, or that names the wrong
        resources, means the procedure is not resolving resource count and EVERY
        assignment is VOID. This complements CTRL-FOURTEEN-LANE-FIXTURE: the
        fixture proves the procedure recovers real committed answers, the ladder
        proves it responds to a defect of known size in a controlled way.
    - id: CTRL-CITATION-REQUIRED
      description: >-
        Every assigned resource cites the table row it relied on, quoted, with
        the artefact path and content hash. An assignment without a quoted row is
        recorded UNSUPPORTED and counted separately.
      failure_meaning: >-
        Definition stretching is invisible without the citation; requiring the
        quote is what surfaces a row that is precise in the document and vague in
        practice.
    - id: CTRL-T5-COMPLETENESS
      description: >-
        Every placement row carries its T5 reachability answer or NOT STATED, per
        the section-3 requirement that reachability is a mandatory second gate.
        The count of NOT STATED rows is reported.
      failure_meaning: >-
        A resource label without a reachability answer is exactly the
        half-complete placement section 3 exists to prevent, and reporting the
        count keeps that visible rather than implied.
    - id: CTRL-ORDERING
      description: >-
        The quoted table, the placement rule and the pre-declared null outcomes
        are hashed BEFORE the inventory is enumerated, and the placement table is
        written and hashed before any narrative about the taxonomy's usability is
        composed.
      failure_meaning: >-
        A conclusion composed before the table is a back-fitted recommendation
        and the run is INVALID.
    - id: CTRL-SECOND-PLACER
      description: >-
        An independent session re-places a seed-selected sample of the inventory
        against the same hashed rule and the same quoted table, without reading
        the first placement. Disagreements are REPORTED, never reconciled
        silently, and the disagreement rate is a primary metric because
        DECIDABILITY is half of what this experiment measures.
      failure_meaning: >-
        Disagreement is not noise here: it is the direct observation that the
        table requires judgement, which is the finding.
  independent_variables:
    - 'method identity, over the enumerated inventory'
    - 'method class, in {inventory entry, committed lane fixture, generic null, hybrid null, none-class control, synthetic ladder rung}'
    - 'placer session identity'
  metrics:
    primary:
      - >-
        per-method resource assignment: a subset of {R1..R8}, or the declared
        `none` class, or OUTSIDE, or NO-RESOURCE, or STRETCHED with the loosening
        named - together with the quoted table row for each assigned resource and
        the artefact content hash.
      - >-
        count of inventory methods receiving NO-RESOURCE, an integer.
      - >-
        count of assignments achievable only by STRETCHING a row, an integer,
        with the loosening named per method.
      - >-
        inter-placer disagreement count and rate on the seed-selected sample, a
        dimensionless fraction, with every disagreement listed with both
        assignments and both cited rows.
      - >-
        CTRL-FOURTEEN-LANE-FIXTURE score: the number of committed lanes whose
        declared resource set is reproduced exactly, an integer out of 14, with
        any mismatch named.
      - >-
        the three declared-outcome null results: generic OUTSIDE, hybrid set size
        at least 2, both `none` lanes returning `none`.
      - >-
        inventory size, an integer, REPORTED AS A MEASURED FLOOR with the
        enumeration rule stated.
    secondary:
      - 'CTRL-SYNTHETIC-RESOURCE-LADDER returned set sizes against the four planted counts, with resources named.'
      - 'count of UNSUPPORTED assignments lacking a quoted row.'
      - 'count of rows lacking a T5 reachability answer.'
      - 'distribution of assigned set sizes across the inventory, to show the labelling is genuinely multi-valued rather than assumed so.'
      - 'the section-2 table and the admissibility filter quoted verbatim, with path and content hash.'
      - 'the placement-rule hash and its timestamp, preceding the inventory enumeration.'
  heuristic_under_test: HEUR-PART-1
  preregistered_prediction:
    quantity: >-
      The three counts (no-resource, stretched, placer-disagreement) and the four
      declared-outcome control results.
    formula: >-
      No formula. Pre-registered: the SUM of the three counts is strictly
      positive; the generic null returns OUTSIDE; the hybrid null returns a set
      of size at least 2; both `none` lanes return `none`; and the fourteen-lane
      fixture is reproduced 14 of 14. A sum of zero with every control behaving
      is a clean confirmation that the taxonomy is a decidable, reproducible
      cover, and it falsifies the prediction.
    source: >-
      IDEA-20260815-17cead's predictions and null_object_control blocks, RESTATED
      against the committed record: the proposal's exclusivity question is
      dropped because DECOMPOSITION.md section 4 already assigns multi-element
      resource sets, and its "the partition may never have declared where rho
      goes" branch is dropped because section 2's admissibility filter declares
      it.
  scale_relevance:
    tier: null
    justification: >-
      NO MEASUREMENT IS MADE AT ANY SCALE and no arithmetic is performed on any
      group. `tier` is null rather than `toy` because a scale label would falsely
      imply a measurement about a curve. DECOMPOSITION.md section 6 caps the
      whole campaign at toy scale with every evidence record at claim_tier toy;
      this contract sits below even that, since it measures nothing about a
      curve at all.
    correspondence: null
  tail_checks:
    - >-
      Every method receiving a set of size 3 or more is reported individually,
      since heavy multi-labelling is where the taxonomy's discriminating power is
      weakest even though it is not a defect.
    - >-
      Every STRETCHED assignment is reported individually with the exact
      loosening, since a stretched assignment is what makes a taxonomy look
      exhaustive while destroying the filter's meaning.
    - >-
      Every NO-RESOURCE method is reported individually with the rows checked
      against it, because section 2 would close such a method "before it costs
      anything" and a gap in the table is materially different from a method that
      genuinely consumes nothing.
    - >-
      Every method the two placers disagree on is listed with both assignments
      and both cited rows.
  replication:
    seeds:
      - 'RUN-ECDLP-83ac2d-1 (Stage 0 re-quote and hash the table and filter; write and hash the placement rule and pre-declared outcomes; run CTRL-FOURTEEN-LANE-FIXTURE, both nulls, CTRL-NONE-CLASS and the synthetic ladder): master seed 20260904151'
      - 'RUN-ECDLP-83ac2d-2 (enumerate the inventory and place it; independent second placement of a seed-selected sample): master seed 20260904152'
    independent_instances: 21
    replication_note: >-
      SEEDS POLICY. The only randomness is (a) the PLACEMENT ORDER, drawn from the
      declared master seed so a placer cannot infer control membership from
      position, and (b) the selection of the sample for the second placement,
      drawn from RUN-2's master seed AFTER the inventory is fixed, so the sample
      cannot be chosen to flatter the first placement. Both derivations are
      recorded in the manifests. `independent_instances: 21` is the count of
      control objects that must each return its pre-declared outcome: fourteen
      committed lanes, two nulls, one none-class control pair counted as its two
      lanes within the fourteen, and four synthetic ladder rungs, plus the
      generic and hybrid nulls - enumerated exactly in results/forced_values.yaml
      so the number is checkable rather than asserted. The placement-rule hash
      and the table content hash appear in both manifests. No seed, rule or
      quoted table may change after RUN-1; a changed rule is a NEW contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 2
    budget_feasibility_note: >-
      Zero compute; the cost is reading and symbolic placement. Wall clock and
      memory are at the template floors and are not the binding constraint. The
      binding constraint is the inventory size, which the run reports; if it
      cannot be placed within the cap, the run stops and names the unplaced
      methods, which are then stated in the denominator.
  stopping_rules:
    - >-
      ST-0 STAGE-0 REPRODUCTION. The run re-quotes the section-2 table and the
      admissibility filter from the committed document and records the artefact
      content hash. If the document's section 2 differs materially from the
      quotation carried in this contract, the run STOPS and reports the
      difference; the contract is then restated against the current text rather
      than run against a stale quotation.
    - >-
      ST-1 RULE GATE. No method may be placed until results/placement_rule.md,
      results/forced_values.yaml and results/cell_definitions.md exist with their
      hashes recorded.
    - >-
      ST-2 PER-RUN CAP. 600 seconds per run; on approaching the cap the run STOPS
      and names every method not placed, which is then stated in the denominator.
    - >-
      ST-3 STOP AND REPORT ON AMBIGUITY. A method whose consumed object cannot be
      matched to a row from the table's own text is placed JUDGEMENT-REQUIRING
      with the ambiguity quoted; it is never resolved silently, never assigned by
      preference, and never merged into NO-RESOURCE without the distinction being
      recorded.
    - >-
      ST-4 NO INTERPRETATION AND NO REPRIORITISATION. The run package emits the
      placement table and the counts only. It must NOT recommend an allocation,
      must not rank lanes, must not propose closing any method under the section-2
      filter, must not write an evidence or decision record, and must not touch
      any status.
  invalidation_rules:
    - >-
      INV-FIXTURE. CTRL-FOURTEEN-LANE-FIXTURE does not reproduce all fourteen
      declared resource sets exactly: every assignment outside the fixture is
      VOID and the failing lanes are named.
    - >-
      INV-GENERIC. NULL-GENERIC-METHOD does not place OUTSIDE: the procedure is
      not applying the section-2 admissibility filter; run INVALID.
    - >-
      INV-HYBRID. NULL-HYBRID-METHOD forced to a single resource: the procedure
      discards multi-labelling and every assignment is VOID.
    - >-
      INV-NONE-CLASS. A declared `none` lane scored as NO-RESOURCE or OUTSIDE:
      the no-resource count is contaminated by the procedure's own misreading and
      is INVALID.
    - >-
      INV-LADDER. CTRL-SYNTHETIC-RESOURCE-LADDER does not return the four planted
      set sizes with the correct resources named: every assignment is VOID.
    - >-
      INV-UNSUPPORTED. An assignment recorded without a quoted table row is
      INVALID for that method and is counted as UNSUPPORTED.
    - >-
      INV-RULE-DRIFT. The placement-rule hash or the table content hash differs
      between runs: the runs did not use the same instrument and are not
      comparable.
    - >-
      INV-BACKFIT. A narrative about the taxonomy's usability composed before the
      placement table is written and hashed: INVALID.
    - >-
      INV-INFRASTRUCTURE. An unreadable or missing artefact is recorded with its
      terminal status and IS INFRASTRUCTURE SIGNAL, never a placement failure of
      the method it concerns.
  success_criterion: >-
    S1. Stage 0 re-quotes and hashes the section-2 table and filter; the
    placement rule and pre-declared outcomes are hashed before the inventory is
    enumerated; CTRL-FOURTEEN-LANE-FIXTURE reproduces 14 of 14 declared resource
    sets; NULL-GENERIC-METHOD places OUTSIDE; NULL-HYBRID-METHOD returns a set of
    size at least 2; both `none` lanes return `none`;
    CTRL-SYNTHETIC-RESOURCE-LADDER returns set sizes 0, 1, 2, 3 with the correct
    resources named; and the placement table plus the three counts and the
    disagreement rate are emitted with a quoted row per assigned resource and a
    T5 field per row. S1 MET means the placement table is admissible as a set of
    facts about the taxonomy and the enumerated inventory. IT ESTABLISHES NOTHING
    MATHEMATICAL AND NOTHING ABOUT ANY ELLIPTIC CURVE, AND IT VALIDATES NO LANE'S
    RESEARCH VALUE.
  falsification_criterion: >-
    F1. All three counts are zero, the disagreement rate is zero, and every
    control behaves as pre-declared. The taxonomy is a decidable, reproducible
    cover of the enumerable inventory; H-ECDLP-1288e1's central prediction is
    falsified and the section-2 filter is confirmed usable - a cheap and welcome
    outcome obtained before the filter is applied again. F2. A nonzero
    NO-RESOURCE count: the taxonomy does not cover the method space, so section
    2's filter would close those methods "before it costs anything" on a gap in
    the table rather than on their merits. F3. A nonzero STRETCHED count or a
    nonzero placer-disagreement rate: assignment requires judgement, so the
    filter is a more expensive and less reproducible instrument than the record
    describes. F4, VOIDING RATHER THAN FALSIFYING: any invalidation rule fires,
    in particular a fixture miss or a null returning other than its pre-declared
    outcome. F5, DECLARED IN ADVANCE AND BINDING UNDER EVERY OUTCOME: no output
    of this experiment may be quoted as a statement about elliptic curves or the
    ECDLP; a clean cover may not be cited as evidence that any lane is worth
    funding; and no output may be used to close any method under the section-2
    filter, which is a Coordinator decision and not a placement result.
  required_artifacts:
    - experiments/EXP-ECDLP-83ac2d/results/cell_definitions.md
    - experiments/EXP-ECDLP-83ac2d/results/placement_rule.md
    - experiments/EXP-ECDLP-83ac2d/results/placement_rule_hash.txt
    - experiments/EXP-ECDLP-83ac2d/results/forced_values.yaml
    - experiments/EXP-ECDLP-83ac2d/results/lane_fixture.json
    - experiments/EXP-ECDLP-83ac2d/results/synthetic_methods/
    - experiments/EXP-ECDLP-83ac2d/results/inventory.json
    - experiments/EXP-ECDLP-83ac2d/results/placement_table.json
    - experiments/EXP-ECDLP-83ac2d/results/counts.json
    - experiments/EXP-ECDLP-83ac2d/results/artefact_hashes.yaml
    - experiments/EXP-ECDLP-83ac2d/results/summary.json
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-1/manifest.yaml
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-1/results.json
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-1/stdout.log
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-2/manifest.yaml
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-2/results.json
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-2/stdout.log
  required_artifacts_note: >-
    results/cell_definitions.md carries the section-2 table and the admissibility
    filter quoted verbatim with the artefact path and content hash.
    results/lane_fixture.json holds the fourteen committed lanes with their
    declared resource sets, extracted at Stage 0 and sealed before the procedure
    is applied to them blind. synthetic_methods/ holds the four ladder rungs with
    a sidecar declaring each planted resource count, written before placement.
    Every row of placement_table.json carries the quoted table row it relied on
    for each assigned resource, plus its T5 reachability field.
  run_plan:
    - id: RUN-ECDLP-83ac2d-1
      description: 'Stage 0 reproduction: re-quote and hash the section-2 table and admissibility filter; seal the fourteen-lane fixture; write and hash the placement rule and pre-declared outcomes; run CTRL-FOURTEEN-LANE-FIXTURE blind, NULL-GENERIC-METHOD, NULL-HYBRID-METHOD, CTRL-NONE-CLASS and CTRL-SYNTHETIC-RESOURCE-LADDER'
    - id: RUN-ECDLP-83ac2d-2
      description: 'enumerate the method inventory and place it with a cited row per assigned resource and a T5 field per row; independent second placement of a seed-selected sample; disagreements reported'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      CORRECTED READ, 2026-09-04. The Coordinator subagent that wrote this
      contract initially reported GOAL-ENDO-001 as absent because it globbed
      ledger/goals/* and saw only flat files; the record is in the SHARDED layout
      at ledger/goals/GOAL-ENDO-001/goal.yaml. On being corrected it read that
      record (status `active`, completion criteria C1-C4, pause conditions
      P1-P3, and the opening note naming
      analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md as fixing the
      decomposition) and then read that document's sections 2, 3, 4, 5 and 6.
      From that read it CONFIRMS: the R1-R8 taxonomy is in section 2 exactly as
      IDEA-20260808-8e13ff and IDEA-20260808-ea3b4f characterise it; the
      admissibility filter pre-declares a generic method OUTSIDE; the fourteen
      lanes carry multi-element resource SETS (L1 R1/R2/R4, L11 R1/R2) with two
      lanes declaring `none`; T1 is marked `[fact]` and T5 `[open]` and
      GRH-conditional; and section 6 caps the campaign at toy scale. It did NOT
      open the fourteen lane research-question records, the checkpoints/
      directory, or the literature DECOMPOSITION.md cites.
  source_refs:
    - ledger/hypotheses/H-ECDLP-1288e1.yaml
    - ledger/proposals/IDEA-20260815-17cead.yaml
    - ledger/goals/GOAL-ENDO-001/goal.yaml
    - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
    - ledger/questions/RQ-MODEL-e61cb2.yaml
    - docs/inventor-protocol.md
  assigned_to: executor
  approved_by: null
