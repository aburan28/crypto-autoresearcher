experiment:
  id: EXP-ECDLP-83ac2d
  hypothesis_id: H-ECDLP-1288e1
  version: 1
  title: >-
    Verification protocol - place the enumerable ECDLP method inventory into the
    ENDO campaign's resource partition under a placement rule frozen before the
    inventory is read, with a generic-method null whose placement the partition
    must have PRE-DECLARED, a hybrid-method null that must be flagged multi-cell,
    a four-rung synthetic ladder at resource counts 0/1/2/3, and a decisive
    Stage-0 gate on whether the cell definitions exist in any committed artefact
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260815-17cead into a verification protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed, NO
    RUN AUTHORIZED. STAGE-0 GATE UNRESOLVED - see below; this contract may fail
    at Stage 0 and that failure is itself the reportable result.
  objective: >-
    Test whether the ENDO campaign's resource-labelled decomposition is usable for
    allocating effort, by attempting to place every enumerable ECDLP method into
    exactly one cell with a cited definition, and reporting the methods that fit
    no cell, fit several, or fit only by stretching a definition. What artifact is
    checked (each method's placement), against what reference (the cell
    definitions as located and quoted at Stage 0), and what result fails it (a
    null behaving other than as pre-declared, or a nonzero no-cell / multi-cell /
    stretched count) are all fixed before the inventory is enumerated.
  stage_0_gate_unresolved: >-
    DECISIVE AND UNRESOLVED AT DESIGN TIME. The cell definitions and the
    transport theorem this test consumes are attributed by IDEA-20260815-17cead
    to GOAL-ENDO-001's objective. The design session searched the tree on
    2026-09-04 and found NO ledger/goals/GOAL-ENDO-001.yaml and NO
    ledger/questions/RQ-ENDO-001.yaml, though coordination/goals/GOAL-ENDO-001
    exists and holds batch review artefacts. STAGE 0 must locate a COMMITTED
    artefact that states the cell definitions and quote them verbatim into
    results/cell_definitions.md. IF NO SUCH ARTEFACT EXISTS, the placement cannot
    be performed, the run STOPS at Stage 0, and the absence is recorded as the
    result - it is NOT worked around by reconstructing the cells from the source
    proposal's summary, which is precisely the unverified characterisation this
    protocol exists to avoid inheriting.
  inputs:
    cell_definitions: >-
      Located and quoted verbatim at Stage 0 from a committed artefact, with the
      artefact path and content hash recorded. Never reconstructed, never
      paraphrased, never taken from the source proposal.
    method_inventory: >-
      Enumerated from this corpus and the literature it cites, with the
      enumeration rule stated and the inventory size REPORTED AS A MEASURED FLOOR.
      Every entry carries the record or reference it was enumerated from.
    placement_rule_frozen_before_inventory_is_read: >-
      Written and HASHED into results/placement_rule.md before the inventory is
      enumerated. It must state: how the non-generic resource a method consumes is
      identified; that a placement is valid only when it CITES the cell definition
      it relied on, quoted; that a method matching two or more cell definitions is
      MULTI-CELL and is never forced into one; that a method matching none is
      NONE; and that a placement achievable only by loosening a definition is
      STRETCHED and is recorded as such with the loosening named.
    pre_declared_null_outcomes: >-
      Written into results/forced_values.yaml BEFORE any placement: (a) where the
      partition says a purely generic method goes, quoted from the cell
      definitions if stated there, or recorded as UNDECLARED if the definitions do
      not say - and UNDECLARED is itself a finding, not a procedure failure;
      (b) that the hybrid method must be flagged MULTI-CELL with both resources
      named; (c) the four expected outcomes of the synthetic ladder.
  controls:
    - id: NULL-GENERIC-METHOD
      description: >-
        NAMED NULL, PRE-DECLARED OUTCOME, CAN FAIL. Pollard rho, which by
        construction consumes NO non-generic resource. The partition must have
        said IN ADVANCE where it goes - a designated generic cell, or outside the
        partition entirely. Either is informative, but the partition must say
        which, and the pre-declaration is written before placement.
      failure_meaning: >-
        If the cell definitions do not pre-declare this, that gap IS the first
        finding and is reported as UNDECLARED. If they do and the procedure
        returns something else, the procedure is not applying the definitions and
        every placement is suspect.
    - id: NULL-HYBRID-METHOD
      description: >-
        SECOND NAMED NULL. A deliberately hybrid method consuming two non-generic
        resources - index calculus with an endomorphism-invariant factor base,
        which consumes both algebraic structure and endomorphisms. It must be
        flagged MULTI-CELL with both resources named, never forced into one.
      failure_meaning: >-
        A hybrid forced into a single cell means the procedure stretches
        definitions to make the partition look exhaustive, which destroys the
        meaning of every other placement. Run INVALID.
    - id: CTRL-SYNTHETIC-RESOURCE-LADDER
      description: >-
        DEMONSTRATED DYNAMIC RANGE, PLANTED RESOURCE COUNTS OF KNOWN SIZE. Four
        synthetic methods constructed by the driver, consuming exactly 0, 1, 2 and
        3 of the declared non-generic resources respectively, each described in the
        vocabulary the cell definitions use. The procedure must return, in order:
        the generic outcome, exactly one cell, MULTI-CELL with 2 named, MULTI-CELL
        with 3 named.
      failure_meaning: >-
        A ladder that does not separate the four resource counts, or that names
        the wrong resources, means the procedure is not resolving resource count
        and EVERY placement is VOID. A procedure that merely returns a cell label
        for each method has not demonstrated it can detect a defect of known size;
        this ladder is what does.
    - id: CTRL-CITATION-REQUIRED
      description: >-
        Every placement cites the cell definition it relied on, quoted, with the
        artefact path. A placement without a quoted definition is recorded as
        UNSUPPORTED and counted separately.
      failure_meaning: >-
        Definition stretching is invisible without the citation; requiring the
        quote is what surfaces a cell that is precise in the record and vague in
        practice.
    - id: CTRL-ORDERING
      description: >-
        The pre-declared null outcomes and the placement rule are hashed BEFORE
        the inventory is enumerated, and the placement table is written and hashed
        before any narrative about the partition's usability is composed.
      failure_meaning: >-
        A conclusion composed before the table is a back-fitted recommendation and
        the run is INVALID.
    - id: CTRL-SECOND-PLACER
      description: >-
        An independent session re-places a declared sample of the inventory
        against the same hashed rule and the same quoted definitions, without
        reading the first placement. Disagreements are REPORTED, never reconciled
        silently.
      failure_meaning: >-
        Disagreement is a finding about the definitions' precision, which is
        exactly what the test measures, and it is first-class output.
  independent_variables:
    - 'method identity, over the enumerated inventory'
    - 'method class, in {real inventory entry, generic null, hybrid null, synthetic ladder rung}'
    - 'placer session identity'
  metrics:
    primary:
      - >-
        per-method placement: a cell label, or MULTI-CELL with the cells named, or
        NONE, or STRETCHED with the loosening named - together with the quoted
        cell definition relied on and its artefact path.
      - >-
        count of methods fitting no cell, an integer.
      - >-
        count of methods fitting several cells, an integer, with the cells named
        per method.
      - >-
        count of placements achievable only by stretching a definition, an
        integer, with the loosening named per method.
      - >-
        the two null outcomes: the generic method's placement against its
        pre-declared outcome, and the hybrid method's MULTI-CELL flag.
      - >-
        inventory size, an integer, REPORTED AS A MEASURED FLOOR with the
        enumeration rule stated.
    secondary:
      - 'CTRL-SYNTHETIC-RESOURCE-LADDER returned outcomes against the four planted resource counts.'
      - 'count of UNSUPPORTED placements lacking a quoted definition.'
      - 'inter-placer disagreement count and rate on the declared sample, each disagreement listed with both placements and both cited definitions.'
      - 'the cell definitions quoted verbatim with the artefact path and content hash.'
      - 'the placement-rule hash and its timestamp, preceding the inventory enumeration.'
  heuristic_under_test: HEUR-PART-1
  preregistered_prediction:
    quantity: >-
      The three counts (no-cell, multi-cell, stretched) and the two null outcomes.
    formula: >-
      No formula. Pre-registered: the SUM of the three counts is strictly
      positive, driven by hybrid methods that consume two non-generic resources
      essentially rather than incidentally; the generic null returns its
      pre-declared placement or exposes that the partition never declared one; and
      the hybrid null is flagged MULTI-CELL. A sum of zero with both nulls
      behaving is a clean confirmation and falsifies the prediction.
    source: >-
      IDEA-20260815-17cead's predictions and null_object_control blocks, adopted
      with the inventory count replaced by a measured floor and with the cell
      definitions required to be located rather than assumed.
  scale_relevance:
    tier: null
    justification: >-
      NO MEASUREMENT IS MADE AT ANY SCALE and no arithmetic is performed on any
      group. `tier` is null rather than `toy` because a scale label would falsely
      imply a measurement about a curve. The protocol consumes no elliptic curve
      and supports no statement about one.
    correspondence: null
  tail_checks:
    - >-
      Every hybrid method is reported INDIVIDUALLY rather than pooled into the
      multi-cell count, because the hybrids are where single-resource labelling is
      most likely to fail and a count would hide which ones broke it.
    - >-
      Every STRETCHED placement is reported individually with the exact loosening,
      since a stretched placement is the failure mode that makes a partition look
      exhaustive while destroying its meaning.
    - >-
      Every method the two placers disagree on is listed with both placements and
      both cited definitions.
  replication:
    seeds:
      - 'RUN-ECDLP-83ac2d-1 (Stage 0 gate: locate and quote the cell definitions; write and hash the placement rule and the pre-declared null outcomes; build and place the synthetic ladder and both nulls): master seed 20260904151'
      - 'RUN-ECDLP-83ac2d-2 (enumerate the inventory and place it; independent second placement of a seed-selected sample): master seed 20260904152'
    independent_instances: 6
    replication_note: >-
      SEEDS POLICY. The only randomness is (a) the PLACEMENT ORDER, drawn from the
      declared master seed so a placer cannot infer control membership from
      position, and (b) the selection of the sample for the second placement,
      drawn from RUN-2's master seed AFTER the inventory is fixed, so the sample
      cannot be chosen to flatter the first placement. Both derivations are
      recorded in the manifests. `independent_instances: 6` is the count of
      control objects (two nulls plus four ladder rungs) that must each return its
      pre-declared outcome. The placement-rule hash appears in both manifests. No
      seed or rule may change after RUN-1; a changed rule is a NEW contract.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 2
    budget_feasibility_note: >-
      Zero compute; the cost is reading and symbolic placement. Wall clock and
      memory are at the template floors and are not the binding constraint. The
      binding constraint is the inventory size, which the run reports; if it
      cannot be placed within the cap, the run stops and names the unplaced
      methods, which are then stated in the denominator.
  stopping_rules:
    - >-
      ST-0 STAGE-0 GATE, DECISIVE. If no committed artefact stating the cell
      definitions can be located, the run STOPS at Stage 0 and reports the
      absence, with every path searched listed. It does NOT reconstruct the cells
      from the source proposal's summary and does NOT proceed to place anything.
    - >-
      ST-1 RULE GATE. No method may be placed until results/placement_rule.md and
      results/forced_values.yaml exist with their hashes recorded, and
      results/cell_definitions.md quotes the definitions.
    - >-
      ST-2 PER-RUN CAP. 600 seconds per run; on approaching the cap the run STOPS
      and names every method not placed, which is then stated in the denominator.
    - >-
      ST-3 STOP AND REPORT ON AMBIGUITY. A method whose consumed resource cannot
      be determined from the cell definitions' own vocabulary is placed
      JUDGEMENT-REQUIRING with the ambiguity quoted; it is never resolved
      silently and never assigned by preference.
    - >-
      ST-4 NO INTERPRETATION AND NO REPRIORITISATION. The run package emits the
      placement table and the counts only. It must NOT recommend an allocation,
      must not rank cells, must not write an evidence or decision record, and must
      not touch any status.
  invalidation_rules:
    - >-
      INV-STAGE0. The run proceeded past Stage 0 without a located, quoted and
      hashed set of cell definitions: INVALID.
    - >-
      INV-HYBRID. NULL-HYBRID-METHOD forced into a single cell: the procedure
      stretches definitions and every placement is VOID.
    - >-
      INV-LADDER. CTRL-SYNTHETIC-RESOURCE-LADDER does not return the four planted
      outcomes with the correct resources named: every placement is VOID.
    - >-
      INV-UNSUPPORTED. A placement recorded without a quoted cell definition is
      INVALID for that method and is counted as UNSUPPORTED.
    - >-
      INV-RULE-DRIFT. The placement-rule hash differs between runs: the runs did
      not use the same instrument and are not comparable.
    - >-
      INV-BACKFIT. A narrative about the partition's usability composed before the
      placement table is written and hashed: INVALID.
    - >-
      INV-INFRASTRUCTURE. An unreadable or missing artefact is recorded with its
      terminal status and IS INFRASTRUCTURE SIGNAL, never a placement failure of
      the method it concerns.
  success_criterion: >-
    S1. Stage 0 locates and quotes the cell definitions from a committed artefact;
    the placement rule and the pre-declared null outcomes are hashed before the
    inventory is enumerated; CTRL-SYNTHETIC-RESOURCE-LADDER returns all four
    planted outcomes with the correct resources named; NULL-HYBRID-METHOD is
    flagged MULTI-CELL; NULL-GENERIC-METHOD returns its pre-declared placement or
    the absence of one is recorded as UNDECLARED; and the placement table plus
    the three counts are emitted with a quoted definition on every row. S1 MET
    means the placement table is admissible as a set of facts about the partition
    and the enumerated inventory. IT ESTABLISHES NOTHING MATHEMATICAL AND NOTHING
    ABOUT ANY ELLIPTIC CURVE, AND IT VALIDATES NO CELL'S RESEARCH VALUE.
  falsification_criterion: >-
    F1. All three counts are zero and both nulls behave as pre-declared. The
    partition places cleanly, is usable for allocation, and H-ECDLP-1288e1's
    central prediction is falsified - a cheap and welcome confirmation. F2. A null
    behaves unexpectedly: the partition's boundaries are not as declared and must
    be restated. F3. Many methods fit no cell (the partition does not cover the
    method space) or many fit several (it is not a partition and its cells
    overlap); either way it cannot allocate effort as currently written. F4,
    TERMINAL RATHER THAN FALSIFYING: Stage 0 finds no committed artefact stating
    the cell definitions. The placement cannot be performed, and that absence is
    the reported result. F5, VOIDING: any invalidation rule fires. F6, DECLARED IN
    ADVANCE AND BINDING UNDER EVERY OUTCOME: no output of this experiment may be
    quoted as a statement about elliptic curves or the ECDLP, and a clean
    placement may not be cited as evidence that any cell is worth funding.
  required_artifacts:
    - experiments/EXP-ECDLP-83ac2d/results/cell_definitions.md
    - experiments/EXP-ECDLP-83ac2d/results/placement_rule.md
    - experiments/EXP-ECDLP-83ac2d/results/placement_rule_hash.txt
    - experiments/EXP-ECDLP-83ac2d/results/forced_values.yaml
    - experiments/EXP-ECDLP-83ac2d/results/synthetic_methods/
    - experiments/EXP-ECDLP-83ac2d/results/inventory.json
    - experiments/EXP-ECDLP-83ac2d/results/placement_table.json
    - experiments/EXP-ECDLP-83ac2d/results/counts.json
    - experiments/EXP-ECDLP-83ac2d/results/stage0_search_log.txt
    - experiments/EXP-ECDLP-83ac2d/results/summary.json
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-1/manifest.yaml
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-1/results.json
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-1/stdout.log
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-2/manifest.yaml
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-2/results.json
    - experiments/EXP-ECDLP-83ac2d/runs/RUN-ECDLP-83ac2d-2/stdout.log
  required_artifacts_note: >-
    results/stage0_search_log.txt lists EVERY path searched for the cell
    definitions and what was found at each, so that a Stage-0 failure is a
    documented absence rather than an assertion. results/cell_definitions.md
    carries the definitions quoted verbatim with the artefact path and content
    hash, or an explicit statement that none was found. synthetic_methods/ holds
    the four ladder rungs with a sidecar declaring each planted resource count,
    written before placement. Every row of placement_table.json carries the quoted
    definition it relied on.
  run_plan:
    - id: RUN-ECDLP-83ac2d-1
      description: 'Stage 0 decisive gate: search for and quote the cell definitions; write and hash the placement rule and pre-declared null outcomes; place NULL-GENERIC-METHOD, NULL-HYBRID-METHOD and the four ladder rungs'
    - id: RUN-ECDLP-83ac2d-2
      description: 'enumerate the method inventory and place it with a cited definition per row; independent second placement of a seed-selected sample; disagreements reported'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: 'NOT YET REQUESTED. Contract is at `draft`.'
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract searched the tree on
      2026-09-04 and found NO ledger/goals/GOAL-ENDO-001.yaml and NO
      ledger/questions/RQ-ENDO-001.yaml; coordination/goals/GOAL-ENDO-001 exists
      and was not opened except for one red-team notes file read for a different
      contract in this batch. IT THEREFORE COULD NOT VERIFY the source proposal's
      characterisation of the partition or of transport theorem T1 against any
      committed record, and this contract does NOT adopt that characterisation:
      locating the definitions is Stage 0 and a failure there is a terminal,
      reportable outcome. It confirmed ledger/questions/RQ-MODEL-e61cb2.yaml
      exists, which is the question this hypothesis is filed against.
  source_refs:
    - ledger/hypotheses/H-ECDLP-1288e1.yaml
    - ledger/proposals/IDEA-20260815-17cead.yaml
    - ledger/questions/RQ-MODEL-e61cb2.yaml
    - docs/inventor-protocol.md
  assigned_to: executor
  approved_by: null
