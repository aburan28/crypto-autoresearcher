experiment:
  id: EXP-MULTIV-1f440b
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-10e308; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-10e308
  question_id: RQ-UOV-001
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Three-arm emission census of a frozen Kipnis-Shamir invariant-subspace routine at toy parameters,
    certifying every returned subspace to separate true from false positives and to publish the rate.
  objective: 'The uncertainty reduced is how often a standard multivariate detector hands back a subspace
    that is not an oil space, at toy parameters, when used as a measurement instrument. Stated as
    parts: (i) the run freezes one candidate-emission rule and one search budget, publishes them verbatim,
    and applies them identically to genuine keys, to random systems containing nothing, and to structure-shaped
    decoys containing nothing, so that the null arm is executed rather than described; (ii) it sends
    every emission from every arm to an independent verifier that checks annihilation of the public
    map, so that the true/false label comes from a certificate rather than from which arm produced
    the candidate, which is the only way a false-positive rate can be honest; (iii) it repeats across
    a grid in (q, n, m) and at two search budgets, so that the rate''s parameter dependence and its
    sensitivity to truncation are both visible, and so that budget exhaustion is never mistaken for
    an absence of candidates. The run recovers no key of any real scheme, computes no attack cost,
    and proposes no improvement to any attack. Its deliverable is a rate table with intervals that
    every later proposal using this detector can cite instead of assuming.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supported scope is: for the frozen emission rule
      and budget stated in the run log, at the named toy (q, n, m), the detector emits candidates
      at the measured rate on each arm, of which the measured fraction is certified true by an independent
      annihilation check, with exact binomial intervals. What does NOT follow: nothing about the Kipnis-Shamir
      family in general or about any other emission rule; nothing about the cost of any attack; nothing
      about deployed parameter sets; and no claim that a measured false-positive rate makes any published
      analysis wrong, since those analyses are not read here and their emission rules are unknown
      to this program.'
  inputs:
    procedure: 'STAGE 0, rule freeze (cost: human, hours): write the emission rule, the invariance
      test, the budget and the certificate rule into the run log; no change after this point. STAGE
      1, three generators (cost: medium): genuine keyed arm, uniform random arm, structure-shaped
      decoy arm, sharing field tables and shape code. STAGE 2, verifier build and controls (cost:
      low): independent annihilation checker plus its positive and negative controls, which gate the
      run. STAGE 3, pilot cell (cost: minutes): q=4, n=6, m=3, 2000 inputs per arm, interleaved, paired
      seeds. STAGE 4, grid (cost: hours): sweep q in {2,4,8,16}, n in {6,8,10}, m in {3,4,5}, 2000
      inputs per arm per cell. STAGE 5, budget sensitivity (cost: hours): repeat the grid at a second
      budget. STAGE 6, analysis (cost: minutes): per-arm rates with exact binomial intervals, exhaustion
      rates, and the signed discrepancy against the pre-registered expectation.'
    instrument: Python 3 with exact F_q arithmetic via precomputed tables for q in {2,4,8,16}; matrix
      pencils and invariant-subspace tests implemented directly over those tables; the verifier is
      a separate module receiving only a public map and a claimed subspace, with no access to the
      generator or to the arm label. Emission counting is done by the harness, not by the detector,
      so the detector cannot influence its own statistics. Driven by harness/runner.py for seeds and
      manifest. No computer algebra system and no Sage.
    parameters: q in {2, 4, 8, 16}; n in {6, 8, 10}; m in {3, 4, 5} with n > 2m excluded and included
      cells recorded separately; oil dimension equal to m in the genuine arm; 2000 inputs per arm
      per cell, three arms, so 6000 detector runs per cell; two budget settings differing by a factor
      of 8; total detector runs bounded at 6000 * 36 * 2 = 432000, each capped.
  controls:
  - Arm 2, uniformly random systems containing no oil space, executed in the same invocation as the
    signal arm.
  - Arm 3, structure-shaped decoys matching arm 1's sparsity and rank profile without an isotropic
    subspace, separating structure-sensitivity from oil-sensitivity.
  - 'Verifier negative control: hand the verifier a deliberately wrong subspace and confirm rejection,
    so that certified-true means something.'
  - 'Verifier positive control: hand the verifier the planted oil space directly and confirm acceptance
    on 100 percent of arm-1 keys.'
  - 'Budget control: run at two detector budgets and confirm the certified-true rate on arm 1 rises
    with budget while the certified-false rate on arm 2 does not, which distinguishes search truncation
    from detector behaviour.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Arm 2 is the null object: a uniformly random symmetric matrix tuple
    of identical shape over the same field, containing no planted oil space, fed to the identical
    detector in the same invocation. For the signal arm to mean anything the null arm must emit candidates
    at a rate consistent with the pre-registered random-pencil expectation AND must have a certified-true
    rate of exactly zero, since it contains nothing to find. A nonzero certified-true rate on arm
    2 would mean random systems of this shape contain oil spaces by accident, which is itself a forced-value
    check on the parameter regime and would invalidate the whole notion of a false positive at those
    parameters.'
  independent_variables:
  - arm (genuine, random null, structure-shaped decoy)
  - field size q
  - variable count n
  - equation count m
  - detector budget
  metrics:
    primary:
    - emissions per run per arm
    - certified-true fraction per arm with exact binomial interval
    - certified-false fraction per arm with exact binomial interval
    - budget exhaustion fraction per arm
    secondary:
    - pre-registered random-pencil expectation per cell
    - signed discrepancy between measured and expected emission rate
    - verifier control outcomes
    - distribution of emitted subspace dimensions
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The false-positive rate of the frozen detector, defined as certified-false emissions
      divided by total emissions, per arm and per cell.
    formula: 'Predicted certified-true rate on the random arm: exactly 0. Predicted emission rate
      on the random arm: proportional to the q-analogue expected number of common invariant subspaces
      of a random m-tuple of symmetric n by n matrices over F_q, which decreases monotonically in
      q at fixed (n, m); the pre-registered comparison is monotone decrease in q, and the measured
      rate is reported against it with a signed discrepancy rather than fitted. Predicted certified-true
      rate on the genuine arm: strictly increasing in detector budget.'
    source: Pre-registered in the parent proposal IDEA-20260816-10e308 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested at q <= 16 and n <= 10, chosen so that annihilation certification is exact
      and cheap and so that the random arm emits often enough for a rate to be measurable at all.
      The explicit transfer assumption, which is NOT relied on for any conclusion: none. The measured
      rate is claimed only at the tested cells, and its expected decay at larger parameters is stated
      as an unmeasured expectation rather than a result.'
    correspondence: null
  tail_checks:
  - q = 2, where accidental invariant subspaces are most common and the rate should be highest
  - q = 16 with n = 10, the sparsest corner, where zero emissions on the random arm is the expected
    and reportable outcome
  - cells with n close to 2m, where the genuine arm's structure is most marginal
  - the smaller budget, where exhaustion is most likely and must not be read as absence
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - abort if either verifier control fails
  - cap each detector run at the pre-fixed budget and record exhaustion; an exhausted run is a bounded
    search and never negative evidence
  - stop adding cells once the random-arm emission rate is zero at two consecutive q values
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: All three arms run through one frozen detector and one independent verifier in
    the same invocation at every cell, both verifier controls pass, and every cell yields per-arm
    emission and certification rates with exact binomial intervals.
  falsification_criterion:
  - A certified-true emission on the random arm.
  - Verifier negative control accepts a wrong subspace.
  - Random-arm emission rate is zero at every cell, falsifying the nonzero-rate claim at the tested
    scope.
  - Random-arm emission rate increases with q.
  - Genuine-arm certified-true rate does not increase with budget.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-10e308
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact candidate-emission rule faithful to Kipnis-Shamir is not specified in this proposal
    beyond a description and must be written and frozen by the Coordinator before approval; the measured
    number is meaningless without it.
  - The construction of arm-3 decoys with matched sparsity and rank profile but no isotropic subspace
    is asserted to be possible and is not derived; if it is not possible at some cell, that cell runs
    with two arms and the fact is recorded.
  - Whether the pre-registered random-pencil expectation should be a count of invariant subspaces
    or of invariant subspaces of the target dimension is left open and must be fixed before Stage
    3.
