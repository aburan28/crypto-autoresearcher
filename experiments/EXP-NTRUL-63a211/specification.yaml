experiment:
  id: EXP-NTRUL-63a211
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-0732fb; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-0732fb
  question_id: RQ-NTRU-9015ee
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Certified exhaustive enumeration of the successive-minima ladder and minimum multiplicity
    for toy NTRU lattices and matched single-plant controls, swept in the modulus
  objective: The uncertainty reduced is whether the unique-shortest-vector framing that any gap-based
    reasoning presupposes is even approximately right for an NTRU lattice, and by how much the orbit
    distorts it. (i) What is the exact multiplicity of the minimum in a toy NTRU lattice, sign-deduplicated,
    and are its members exactly the rotations of the secret or does the lattice contain coincidental
    extra minimal vectors, this being a forced-value test where the predicted answer is n pairs and
    any deviation is more informative than agreement; (ii) does the matched single-plant control,
    identical in dimension, determinant, modulus and planted norm but carrying one plant instead of
    an orbit, show multiplicity one pair and a genuine jump at index three, which is what makes the
    NTRU plateau attributable to ring structure rather than to the q-ary construction; (iii) how do
    the two competing gap definitions, lambda_2 / lambda_1 which should be pinned at exactly one,
    and lambda_{2n+1} / lambda_1 which is the first gap to a non-orbit vector, behave as q is swept,
    since it is the second that any gap-based heuristic would have to mean. The run certifies non-existence
    below a radius rather than merely reporting the shortest vector found, which is the expensive
    part and the part that makes the numbers measurements rather than search outcomes.
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'Maximal supportable claim: at n = 10 and 12, in the tested ring,
      for the tested ternary secret distribution and the tested moduli, the NTRU lattice''s minimum
      has multiplicity M with the members labelled as reported, the matched single-plant control has
      multiplicity M'', and the two gap definitions take the reported values as functions of q, all
      with certified enumeration. What does NOT follow: nothing about reduction behaviour, block sizes,
      or recovery; nothing about larger n, since the measurement is not extrapolable and no extrapolation
      is offered; nothing about deployed parameters; and no claim that any analysis anywhere uses
      the naive gap, since this program cannot read external work.'
  inputs:
    procedure: 'STAGE 0, cost hours of implementation: implement exact-integer enumeration below a
      radius with an explicit completeness certificate, plus an independent slower recount method;
      run the orthogonal-basis forced null and gate on the known multiplicity being returned exactly.
      STAGE 1, cost minutes: instance generation for the NTRU arm and the matched single-plant control,
      with an assertion that dimension, determinant, modulus and planted norm match exactly and an
      abort if they do not. STAGE 2, cost hours: for n = 10 and six moduli, enumerate 30 instances
      per arm per modulus to radius 3 times the secret norm, recording the full ladder to index 2n
      + 2 with multiplicities and rotation labels. STAGE 3, cost hours: radius-sensitivity control
      at 2x and 4x on a 20 percent subsample. STAGE 4, cost hours and optional: repeat STAGE 2 at
      n = 12 if the budget permits, which doubles the enumeration cost per instance at least. STAGE
      5, cost minutes: independent recount on a 10 percent subsample requiring exact agreement, then
      report multiplicity distributions and both gaps with CIs by q and arm.'
    instrument: Python 3 with exact integer arithmetic only; no floating point enters the norms, which
      are integer sums of squares, so the ladder is exact and the certificate is an integer statement.
      Enumeration implemented in a new harness/ module as a depth-first search over the Gram-Schmidt-free
      integer basis with an explicit bound, plus a second, deliberately naive method for the recount.
      harness/runner.py for run wrapping and manifest capture; the certificate is re-verified by the
      wrapper independently of the enumerator, following docs/claims-and-verification.md. No Sage,
      no external lattice library.
    parameters: 'n = 10 primary (lattice dimension 20), n = 12 optional (dimension 24). Ring Z[x]/(x^n
      - 1). Ternary secrets with weight round(2n/3), degenerate secrets excluded by a pre-registered
      rule. q in {2^5, 2^7, 2^9, 2^11, 2^13, 2^15}. 30 instances per arm per q. Enumeration radius
      3 times the secret''s norm, with 2x and 4x on a 20 percent subsample. Two arms: NTRU and matched
      single-plant q-ary control.'
  controls:
  - Matched single-plant random q-ary lattice, identical dimension, determinant, modulus and planted
    norm, one plant, no orbit.
  - Orthogonal-basis forced null with known multiplicity, gating the enumerator before any measurement.
  - Degenerate-secret exclusion by a pre-registered rule, with excluded counts published.
  - 'Radius-sensitivity control: re-run at 2x and 4x the secret norm radius to confirm the ladder
    up to index 2n + 2 does not depend on the enumeration radius.'
  - Independent recount of the minimal-vector set by a second, slower enumeration method on a subsample,
    requiring exact agreement.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The matched single-plant random q-ary lattice: same dimension 2n, same
    determinant q^n, same modulus, one planted vector of exactly the secret''s norm and no orbit.
    It runs through the identical enumerator in the same invocation. For the plateau claim to mean
    anything, the null must show multiplicity exactly 2 at its minimum, its signed planted pair, and
    a jump at index 3. If the null also shows a long plateau, then plateaus are a property of q-ary
    lattices at these parameters rather than of ring structure, and the correct record is a controlled
    null. A second forced null: a lattice with an orthogonal basis of equal-norm vectors must return
    multiplicity exactly 2 times its dimension, gating the enumerator.'
  independent_variables:
  - modulus q over the six-value grid
  - arm in {NTRU, matched single-plant control}
  - ring degree n in {10, 12}
  - enumeration radius multiple in {2, 3, 4} on the subsample
  metrics:
    primary:
    - sign-deduplicated multiplicity of the minimum per instance
    - lambda_1 through lambda_{2n+2} exactly
    - lambda_2 / lambda_1
    - lambda_{2n+1} / lambda_1
    - fraction of minimal vectors that are rotations of the secret
    secondary:
    - enumeration certificate status and node counts
    - excluded degenerate-secret count
    - radius-sensitivity disagreement rate
    - independent-recount agreement rate
    - wall-clock per instance by arm
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The multiplicity of the minimum in each arm, and the ratio lambda_{2n+1} / lambda_1
      as a function of q in the NTRU arm.
    formula: 'Predicted multiplicity: exactly n sign-deduplicated pairs in the NTRU arm for non-degenerate
      secrets, exactly 1 in the matched control. Predicted lambda_2 / lambda_1 = 1 exactly in the
      NTRU arm. Predicted lambda_{2n+1} / lambda_1 monotone non-decreasing in q across the six-value
      grid, with no slope pre-committed.'
    source: Pre-registered in the parent proposal IDEA-20260816-0732fb before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Lattice dimension 20, optionally 24, which is the ceiling for certified exhaustive
      enumeration within a bounded budget. This is orders of magnitude below any parameter of interest
      and the contract makes no transfer or extrapolation assumption whatsoever: the deliverable is
      a set of exact facts about small lattices, offered as a corrective to an assumed picture, not
      as an estimate of anything larger.'
    correspondence: null
  tail_checks:
  - The smallest modulus cell, where unrelated short vectors may swamp the plateau.
  - The largest modulus cell, where the enumeration radius may contain only the orbit and the ladder
    above index 2n may be empty within the radius, requiring a radius increase for that cell specifically.
  - Secrets in the low-norm tail, checked for coincidental extra minimal vectors.
  - Instances where enumeration exceeds its node cap, recorded as budget outcomes and excluded, never
    as findings.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Abort if the orthogonal-basis forced null returns the wrong multiplicity.
  - Abort if the matching assertion between arms fails.
  - Cap enumeration nodes per instance; exhaustion is recorded as a budget outcome under AGENTS.md
    rule 3 and the instance is excluded from the ladder statistics with its count published.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: Forced null passes, certificates verify on every included instance, and multiplicity
    distributions plus both gap definitions are reported by arm and q with the radius-sensitivity
    and recount controls agreeing.
  falsification_criterion:
  - NTRU-arm multiplicity not equal to n pairs for non-degenerate secrets, falsifying the plateau
    claim.
  - Matched control showing a comparable plateau, recording a controlled null.
  - lambda_{2n+1} / lambda_1 not increasing in q, falsifying the propagation prediction.
  - Radius sensitivity changing the ladder, invalidating the enumeration radius choice.
  - Certificate or recount failure, making affected instances invalid measurements.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-0732fb
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - 'The completeness certificate''s exact form needs specifying: what integer statement is checked,
    by what independent code, and what constitutes a pass.'
  - The degenerate-secret exclusion rule must be written down before sampling.
  - Whether the matched control's planted vector can always be given exactly the secret's norm needs
    to be settled; if not, the tolerated discrepancy must be fixed in advance.
  - The choice of enumeration radius as 3x the secret norm is not derived; a Coordinator should either
    derive a sufficient radius for indices up to 2n + 2 or accept the empirical radius-sensitivity
    control in its place.
