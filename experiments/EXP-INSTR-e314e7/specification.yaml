experiment:
  id: EXP-INSTR-e314e7
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-caf061
  question_id: RQ-INSTR-f8faa0
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE CAMPAIGN''S DETECTION FLOOR AND ITS ADJUDICATION CONTRACT: one committed run already
    reports 37 statistical verdicts with no multiplicity accounting, so about 1.9 false positives
    are expected under a global null; declare one primary metric per lane, set the permutation resolution
    floor 1/(B+1) FROM the multiplicity budget rather than after it, analyse class labels blind, and
    audit every disposition tree for unreachable branches -- the defect that made EXP-STR-003''s `mixed`
    branch impossible and left an instrument question permanently UNADJUDICATED'
  status: draft
  objective: "(A) THE MULTIPLICITY IS ALREADY LIVE, WITH NUMBERS. RUN-ICINV-p4001-a's metrics block\
    \ contains, for the target class and three control classes, seven statistical verdicts each (decomp_rate_m2,\
    \ decomp_rate_m3, liftable_density, window_fb_size, s3_support, order, two_torsion_x), i.e. 28;\
    \ plus three NULL-C permutation p-values; plus six window_decay permutation p-values. That is\
    \ 37 tests in ONE run of ONE lane, reported without any family declaration or multiplicity adjustment.\
    \ Under a global null at the conventional level, the expected number of spurious \"over-dispersed\"\
    \ or \"significant\" calls is 37 * 0.05 = 1.85. The run reports over-dispersion on five of seven\
    \ functionals in every class, so multiplicity is not the whole story there -- but a campaign that\
    \ runs fourteen lanes at this density will accumulate hundreds of tests, and at that point the\
    \ leading explanation for its most striking single result is that it ran many tests.\n(B) THE\
    \ RESOLUTION FLOOR MUST BE SET BEFORE THE BUDGET IS SPENT, AND IT IS AN ARITHMETIC CONSTRAINT,\
    \ NOT A PREFERENCE. A permutation p-value estimated from B draws cannot go below 1/(B+1) with\
    \ the standard estimator. Holm-Bonferroni over a family of m tests requires the smallest p-value\
    \ to fall below alpha/m. So the design must satisfy 1/(B+1) < alpha/m, i.e. B > m/alpha - 1. Concretely:\n\
    \  m = 14 (one primary metric per lane), alpha = 0.05: threshold 3.571e-3,\n    requiring B >\
    \ 279. Comfortable.\n  m = 37 (this one run's family), alpha = 0.05: threshold 1.351e-3, requiring\n\
    \    B > 739. The committed NULL-C used B = 2000 (floor 4.998e-4) and passes;\n    window_decay\
    \ used B = 1000 (floor 9.990e-4) and passes, barely.\n  m = 200 (a plausible campaign total),\
    \ alpha = 0.05: threshold 2.500e-4,\n    requiring B > 3999. NEITHER committed setting reaches\
    \ it.\nSo the campaign can already be shown, before running anything, to be one accounting decision\
    \ away from a floor it cannot reach. Declaring ONE primary metric per lane buys a factor of about\
    \ 14 in the required B and is the cheapest fix available. Secondary metrics remain reported, in\
    \ a separate exploratory family with its own declared error control, and are never the basis of\
    \ a lane's headline.\n(C) THE ADJUDICATION DEFECT THIS EXISTS TO PREVENT, NAMED FROM THE RECORD.\
    \ DEC-20260727-009 documents an instrument question that ended UNADJUDICATED and blocked a conclusion.\
    \ Two specific design defects are named there and both are checkable at contract-freeze time,\
    \ before any compute:\n  DEFECT 1 -- A CONTROL THAT IS EXISTENCE-VALID AND COMPARATIVE-INVALID.\
    \ The\n    decision records that arm E as frozen \"was a valid EXISTENCE control and a\n    MIS-SPECIFIED\
    \ COMPARATIVE one, diverging by closure convention on an\n    uncontrolled nuisance variable rather\
    \ than by endomorphism content.\" An arm\n    that shows a thing CAN happen is not an arm that\
    \ shows WHY it happened. The\n    preventive audit is a one-line declaration per control: is this\
    \ an existence\n    control or a comparative control, and if comparative, which nuisance\n   \
    \ variables are held fixed and by what mechanism? A comparative control with\n    an unnamed nuisance\
    \ variable is not approvable.\n  DEFECT 2 -- AN UNREACHABLE BRANCH IN THE DISPOSITION TREE. The\
    \ decision records\n    that \"the contract's own `mixed` branch, whose disposition is `inconclusive`,\n\
    \    is unreachable by construction (S_i = not F_i) even though the measured S1\n    pattern is\
    \ literally mixed\". A disposition tree whose criteria are defined as\n    exact complements cannot\
    \ reach an intermediate verdict, so the honest outcome\n    has no branch to land in. The preventive\
    \ audit is mechanical: enumerate the\n    tree's branches, and for each one exhibit an assignment\
    \ of the criteria that\n    reaches it. A branch with no witnessing assignment is deleted or the\
    \ criteria\n    are redefined -- before the contract is frozen. This costs minutes and would\n\
    \    have prevented the recorded failure.\n\n(D) BLINDING, BECAUSE THE FORKING PATHS ARE REAL\
    \ HERE. The campaign's analyst chooses which classes to pool, which functionals to feature, which\
    \ windows to show and which null to lead with. DEC-20260727-009 R2 records the concrete version\
    \ of this risk: \"the one-variable ablation EXP-STR-002's own specification declared at lines\
    \ 36-39 and never implemented.\" The preventive design is two-stage and cheap: STAGE ONE, the\
    \ executor computes every declared functional for every curve and emits a table with class labels\
    \ REPLACED BY OPAQUE TOKENS; STAGE TWO, the analysis script is frozen and committed; STAGE THREE,\
    \ the label map is joined and the script is run once. The commit order is the evidence, and it\
    \ is verifiable by git rather than by assertion.\n(E) THE DELIVERABLE. A four-part campaign contract\
    \ addendum: (i) the primary metric declaration, one per lane, with its null and its family; (ii)\
    \ the B-from-m rule with the arithmetic worked for the declared m; (iii) the two disposition-tree\
    \ audits, existence-versus-comparative and branch reachability, as approval gates; (iv) the blind-analysis\
    \ commit order. Each part is a gate a lane contract passes or fails, and each costs minutes.\n\
    (F) WHAT EACH OUTCOME MEANS. If the campaign's headline results survive Holm at the declared family\
    \ size, they are strengthened and the strengthening is quantified. If they do not, the honest\
    \ report is that the campaign's evidence is exploratory, which is a legitimate and common outcome\
    \ and is far better discovered by this record than by an external reviewer. If a disposition tree\
    \ is found unreachable during the audit, the audit paid for itself immediately."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: No oracle, no attack, no resource. This governs how the campaign's fourteen
    lanes report, not what they compute. It is admissible trivially and its interest is that it is
    the only proposal in the lane whose object is the CAMPAIGN rather than a single instrument.
  reachability_gate: 'NOT APPLICABLE, and stated rather than omitted: no movement between curves,
    no walk, no search, no curve of any kind is touched. T5 is untouched. The record''s object is
    the campaign''s reporting design.'
  inputs:
    procedure: 'STAGE 0 (zero compute, and it is the whole cheap core of this record): count the tests
      in RUN-ICINV-p4001-a''s committed metrics block and recompute the Holm survivors at m = 37.
      Arithmetic on numbers already in the repository. STAGE 1 (zero compute): compute B > m/alpha
      - 1 for m = 14, 37 and 200 and compare with the committed B = 2000 and B = 1000. STAGE 2 (minutes):
      the global-null simulation, with and without control, at m = 14 and m = 37, 1000 repetitions.
      STAGE 3 (zero compute): run Audit A and Audit B over every lane contract that exists; report
      the defect counts. STAGE 4 (zero compute): write the four-part contract addendum.'
    mechanism: "STEP 1 -- ENUMERATE THE FAMILY THAT ALREADY EXISTS. Count the tests in RUN-ICINV-p4001-a\
      \ exactly (predicted 37: 4 classes times 7 verdicts, plus 3 NULL-C, plus 6 window_decay) and\
      \ recompute each reported call under Holm-Bonferroni at m = 37. Report which of the run's calls\
      \ survive. This is arithmetic on committed numbers and needs no execution.\nSTEP 2 -- DECLARE\
      \ ONE PRIMARY METRIC PER LANE. Fourteen entries, each naming the functional, the null, the direction\
      \ and the pre-registered effect threshold. Everything else is exploratory and is reported in\
      \ a clearly separated family. This is the single decision that makes campaign-level control\
      \ affordable.\nSTEP 3 -- SET B FROM m. Compute B > m/alpha - 1 for the declared m and set every\
      \ permutation budget accordingly, printing the floor 1/(B+1) beside every reported p-value so\
      \ a floored value can never be read as strong. For m = 14, B = 500 is ample; for an exploratory\
      \ family of 200, B = 5000 is needed and the cost is linear in B and negligible beside the measurement.\n\
      STEP 4 -- THE TWO CONTRACT AUDITS, AS APPROVAL GATES.\n  AUDIT A, existence versus comparative:\
      \ for every control arm in every lane\n  contract, one declared line -- existence or comparative;\
      \ if comparative, the\n  nuisance variables held fixed and the mechanism holding them.\n  AUDIT\
      \ B, branch reachability: enumerate the disposition tree's branches and\n  exhibit, for each,\
      \ a criteria assignment that reaches it. Any branch with no\n  witness is deleted or the criteria\
      \ are redefined. Both audits are performed\n  before freezing and their results are part of\
      \ the contract.\n\nSTEP 5 -- BLIND ANALYSIS COMMIT ORDER. Executor emits the token-labelled\
      \ table; the analysis script is committed; the label map is joined; the script runs once. The\
      \ git order is the artifact and is checkable by a reviewer without re-running anything."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - global-null simulation with control, which must hold at alpha
  - the same with control disabled, which must show about alpha*m
  - the family-size sweep, whose survivor count must stay flat under control
  - the committed run's own numbers as the worked example
  - 'NULL OBJECT (from the proposal): MANDATORY, AND IT IS A SIMULATION UNDER A GLOBAL NULL. Generate
    synthetic data in which NO functional depends on the class -- values drawn i.i.d. within the real
    class-size profile -- and run the entire declared reporting pipeline, including the primary declaration
    and Holm. The number of surviving "significant" calls must be at or below alpha over many repetitions.
    If the pipeline produces more than alpha, the multiplicity control is not working and the campaign''s
    reports are not calibrated. SECOND NULL: the same simulation with the multiplicity control DISABLED,
    which must produce about alpha*m survivors -- 1.85 at m = 37 -- demonstrating that the control
    is doing measurable work rather than being ceremonial. DECAY PARAMETER: the family size m. As
    m grows the number of surviving calls must stay flat at alpha under the control, and must grow
    linearly without it. A corrected pipeline whose survivor count GROWS with m is not controlling
    the family-wise rate, which is the canonical artifact tell for this instrument.'
  independent_variables: []
  metrics:
    primary:
    - exact test count in the committed run, by category
    - Holm survivor list at m = 37, with each test's p-value and threshold
    - required B versus chosen B, per declared family
    - global-null survivor counts, controlled and uncontrolled, per m
    secondary:
    - Audit A and Audit B defect counts, per lane contract
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of RUN-ICINV-p4001-a's reported calls surviving Holm at m = 37
    formula: Fewer than the number currently reported. The liftable_density NULL-C call (p = 0.0005)
      survives 0.05/37 = 1.351e-3 and the decomp_rate_m3 call (p = 0.062) does not. Report the full
      survivor list; the exercise is arithmetic on committed numbers and cannot fail for technical
      reasons.
    source: pre-registered in IDEA-20260807-caf061 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - DEPENDENCE AMONG TESTS. The campaign's tests share curves, seeds, factor bases and twist-paired
    classes, so they are strongly dependent and Holm is conservative. The global-null simulation measures
    the actual dependence rather than assuming it, and a measured effective m below the nominal m
    is a legitimate and reportable refinement.
  - PRIMARY-METRIC GAMING. Declaring the primary metric after a pilot run is indistinguishable from
    declaring it before, unless the commit order shows otherwise. The blinding stage in (D) is the
    only defence and it must be enforced by artifact order, not by intention.
  - OVER-CORRECTION SUPPRESSING A REAL EFFECT. Holm at m = 200 raises the detection floor by about
    a factor of 4 in threshold, which by IDEA-20260807-efc8de's power curve raises delta* materially.
    That cost is real, is the price of the guarantee, and must be reported as the campaign's honest
    detection floor rather than hidden.
  - THE p-VALUE FLOOR MASQUERADING AS SIGNIFICANCE. A reported 0.0 is a floor, not a measurement.
    Printing 1/(B+1) beside every p-value is the fix and it is free.
  - SCOPE CREEP INTO POLICY. This record proposes contract gates, not ledger authority. Only the Coordinator
    approves contracts and changes status; nothing here alters that.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Fewer than the number currently reported. The liftable_density NULL-C call (p
    = 0.0005) survives 0.05/37 = 1.351e-3 and the decomp_rate_m3 call (p = 0.062) does not. Report
    the full survivor list; the exercise is arithmetic on committed numbers and cannot fail for technical
    reasons.
  falsification_criterion:
  - The test count is not 37. The worked example is recomputed at the true count; the record's arithmetic
    is corrected rather than defended.
  - Every reported call survives Holm at the true m. Multiplicity is not currently binding on this
    campaign, the record's urgency is overstated, and it says so.
  - The global-null simulation exceeds alpha WITH the control applied. The implementation is wrong
    and nothing may be reported from it.
  - The simulation does not show about alpha*m without the control. The dependence among tests is
    strong enough that the naive count overstates the risk, which would itself be a useful measurement
    and would change the recommended m.
  - Audit B finds no unreachable branch anywhere. Good news, and reported as such; the audit remains
    a gate because its cost is minutes.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-caf061
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
