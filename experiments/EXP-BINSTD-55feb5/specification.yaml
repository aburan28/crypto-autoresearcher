# =============================================================================
# EXP-BINSTD-55feb5 -- VERSION 1 (APPROVED by DEC-20261003-0a117b) successor
# of EXP-BINSTD-eb9e5e for H-BINSTD-ce918e after EV-BINSTD-cd47a8 /
# DEC-20261003-495a2e (decision: inconclusive) and EV-BINSTD-0fed43.
# One frozen contract admitting:
#   Stage 0  — re-freeze pin/(α,M₀) + new catalog_seed + allocator probes
#              + density-batch calibration that MUST clear instrument_clears_floor
#   Stage 1  — densified delta-RSS panels at
#              (n,ℓ)∈{(23,6),(23,8),(29,8),(29,10),(31,10),(31,12)}
#              with instrument_clears_floor gate before band/mechanism reading
# No parent re-run. No AUXIN. No Bedrock. No break / exponent / n≥131 transfer.
# No support / KN-FIND claim in this design packet.
# =============================================================================
experiment:
  id: EXP-BINSTD-55feb5
  hypothesis_id: H-BINSTD-ce918e
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20261001-20561e
  goal_id: GOAL-ECDLP2M-001
  successor_of: EXP-BINSTD-eb9e5e
  cites_evidence:
    - EV-BINSTD-cd47a8
    - EV-BINSTD-0fed43
  cites_decision: DEC-20261003-495a2e
  version: 1
  title: >-
    Densified Stage-1 cells with Stage-0 density-batch floor-clear gate for
    H-BINSTD-ce918e
  status: analyzed
  analyzed_by: DEC-20261003-cff91a
  analyzed_at: '2026-10-03'
  analyzed_note: >-
    EV-BINSTD-602614 / DEC-20261003-cff91a: Stages 0–1 package valid;
    Stage-1 O-INCONCLUSIVE (instrument_clears_floor=false, median ΔRSS=98304).
    Decision inconclusive. No support / KN-FIND.
  approved_by: DEC-20261003-0a117b
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0 and 1 authorized by DEC-20261003-0a117b under AGENTS.md standing
    user authorization (2026-09-06), discharging NA-1 of DEC-20261003-495a2e /
    EV-BINSTD-cd47a8. No Magma/Sage/AUXIN/Bedrock. No ECC2K-130 solve. No
    n>=131 attack. No re-run of EXP-BINSTD-eb9e5e, EXP-BINSTD-ff5050, or
    EXP-BINSTD-cb15a4.
  approval:
    approved_by: DEC-20261003-0a117b
    composing_decision: DEC-20261003-0a117b
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete. Approval does not assert the hypothesis is
      true. Stages 0–1 authorized. Cites EV-BINSTD-cd47a8 / EV-BINSTD-0fed43.
      Does not claim support or authorize KN-FIND.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes inherited (α,M₀)=(1.0,16777216), XOR-SAT pin, new
      catalog_seed=2026100377593, process-isolated baseline + allocator probe,
      and a density_batch_size that clears instrument_clears_floor on probe
      (31,12) — else O-IMPEDIMENT (no Stage-1 band reading). Stage 1 measures
      densified delta_rss at authorized cells with the frozen batch.
      No Magma/Sage/AUXIN/Bedrock. No ECDLP solve. No parent re-run.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Clear the instrument_clears_floor gate that blocked mechanism reading in
    EV-BINSTD-cd47a8 (median ΔRSS=0 at n=17 ℓ≤6) by densifying Stage-1 cells
    and freezing a Stage-0 density_batch_size that pushes encode+solve
    working-set growth above the clear-floor thresholds, then re-test the
    inherited peak band versus ℓ-channel — before any support / KN-FIND
    reading of H-BINSTD-ce918e.

  class: heuristic_validation
  class_note: >-
    Instrument-refine package for a memory heuristic. Not an exponent-moving
    breakthrough; no ECDLP attack table; no support claim this tick.

  scope:
    included:
      - >-
        Stage 0. Freeze V family for Stage-1 cells; inherit (α,M₀) and XOR-SAT
        pin; new catalog_seed; process-isolated baseline repeats →
        os_rss_floor_bytes; allocator probes at 2/8/16 MiB with
        recovery_frac≥0.5 on the largest; density-batch calibration on probe
        (31,12) doubling until instrument_clears_floor (median-equivalent
        single-trial delta ≥ 262144 or encode_peak − floor ≥ 524288), freezing
        density_batch_size (max 2048) or O-IMPEDIMENT; twin check.
      - >-
        Stage 1. For (n,ℓ)∈{(23,6),(23,8),(29,8),(29,10),(31,10),(31,12)}
        measure process-isolated baseline and densified encode+solve peaks
        with frozen density_batch_size; report delta_rss_bytes; write
        stage1/panels.json, stage1/control-table.json, RESULTS.md with
        exactly one O-*. Band/mechanism reading requires
        instrument_clears_floor.
    excluded:
      - Re-run of EXP-BINSTD-eb9e5e, EXP-BINSTD-ff5050, or EXP-BINSTD-cb15a4
      - Magma / Sage / AUXIN / Amazon Bedrock
      - Deployed-curve attack, break claim, exponent move, n≥131 transfer
      - support / KN-FIND promotion in this design or run package

  inputs:
    parent_experiments: [EXP-BINSTD-eb9e5e, EXP-BINSTD-ff5050, EXP-BINSTD-cb15a4]
    evidence: [EV-BINSTD-cd47a8, EV-BINSTD-0fed43]
    decisions: [DEC-20261003-495a2e, DEC-20261003-53838e, DEC-20261003-e86acd]
    idea: IDEA-20261001-20561e
    hypothesis: H-BINSTD-ce918e
    frozen_parameters:
      alpha: 1.0
      M0_bytes: 16777216
      catalog_seed: 2026100377593
      parent_catalog_seed: 2026100343342
      clear_floor_delta_bytes: 262144
      clear_floor_margin_bytes: 524288
      max_density_batch: 2048
      probe_cell: {n: 31, ell: 12}

  controls:
    - id: twin_N_var
      description: Twin encode paths A/B must agree on N_var for every measured V.
    - id: process_isolated_baseline
      description: >-
        Baseline worker (Field import only) and encode worker run in separate
        fresh subprocesses; delta_rss = max(0, encode_peak - baseline_peak).
    - id: allocator_probe
      description: >-
        Stage-0 known bytearray allocations must recover ≥50% of the largest
        probe size in delta-RSS, else O-IMPEDIMENT (instrument dead).
    - id: floor_clear_calibration
      description: >-
        Stage 0 must freeze a density_batch_size that clears
        instrument_clears_floor on probe (31,12) before Stage 1 may run;
        failure is O-IMPEDIMENT, not a band verdict.
    - id: inherited_band
      description: peak_rss ≤ M0·2^{α·ℓ} continuity with EV-BINSTD-cd47a8 / 0fed43.
    - id: no_parent_rerun
      description: Do not execute eb9e5e, ff5050, or cb15a4 trial plans.

  independent_variables:
    - name: ell
      levels: [6, 8, 10, 12]
    - name: n
      levels: [23, 29, 31]
    - name: density_batch
      levels: [frozen_at_stage0]
    - name: rss_instrument
      levels: [process_isolated_delta]

  metrics:
    primary:
      - name: delta_rss_bytes
        unit: bytes
        definition: >-
          max(0, process-isolated densified encode+solve peak_rss -
          process-isolated baseline peak_rss).
      - name: peak_rss_bytes
        unit: bytes
        definition: Child-process peak RSS of densified encode+solve (continuity).
      - name: band_holds
        unit: boolean
        definition: peak_rss_bytes ≤ M0_bytes · 2^(alpha · ell).
      - name: instrument_clears_floor
        unit: boolean
        definition: >-
          median(delta_rss) ≥ 262144 OR (max encode_peak - os_rss_floor) ≥ 524288.
      - name: floor_clear_calibration_ok
        unit: boolean
        definition: Stage-0 probe cleared instrument_clears_floor at some batch ≤ 2048.
      - name: twin_agreement
        unit: boolean
        definition: Twin N_var meters agree on every measured V.
    secondary:
      - name: os_rss_floor_bytes
        unit: bytes
      - name: density_batch_size
        unit: integer
      - name: floor_dominant_delta
        unit: boolean
      - name: delta_ell_spread
        unit: ratio
      - name: allocator_ok
        unit: boolean
      - name: N_var
        unit: integer
      - name: wall_clock_seconds
        unit: seconds

  heuristic_under_test: HEUR-BINSTD-20561e-H1

  preregistered_prediction:
    quantity: >-
      Process-isolated peak_rss(densified encode+solve) ≤ M₀·2^{α·ℓ} on Stage-1
      cells after twin agreement, with (α,M₀)=(1.0, 16777216) and catalog_seed
      2026100377593; Stage-0 density-batch calibration must clear
      instrument_clears_floor before any Stage-1 band/mechanism reading.
    formula: >-
      band_bytes(ell) = 16777216 * 2**(1.0 * ell);
      delta_rss = max(0, encode_peak - baseline_peak);
      peaks from child process resource.getrusage(RUSAGE_SELF).ru_maxrss * 1024;
      density_batch_size frozen at Stage 0 on probe (31,12).
    source: >-
      EV-BINSTD-cd47a8 / DEC-20261003-495a2e NA-1; EV-BINSTD-0fed43;
      IDEA-20261001-20561e; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Memory instrument on n∈{23,29,31}, ℓ≤12 only under this card. No transfer
      of a RSS band into an n≥131 attack is claimed.
    correspondence: null

  tail_checks:
    - Twin disagreement voids band claims (O-ARTIFACT).
    - RSS probe / allocator calibration failure → O-IMPEDIMENT (not O-SUPPORT).
    - Stage-0 floor_clear_calibration_ok=false → O-IMPEDIMENT; Stage 1 must not
      produce a band/mechanism verdict without a cleared instrument.
    - instrument_clears_floor=false OR floor_dominant_delta=true → O-INCONCLUSIVE
      for mechanism reading even if peak band holds (diagnostic, not O-FAIL-BAND).
    - EV-BINSTD-cd47a8 / EV-BINSTD-0fed43 floor confound blocks support/KN-FIND
      until this densified refine clears the instrument gate.

  seeds_and_replication:
    catalog_seed: 2026100377593
    parent_catalog_seed: 2026100343342
    ff5050_catalog_seed: 2026100375050
    v1_catalog_seed: 202610032056
    independent_instances: 6
    note: >-
      Stage-1 cells (23,6)/(23,8)/(29,8)/(29,10)/(31,10)/(31,12) under new seed
      and densified delta-RSS. Twin meters remain the per-V replication instrument.
      density_batch_size frozen at Stage 0.

  stopping_rules:
    - Stage 0 O-IMPEDIMENT / O-ARTIFACT stops Stage 1.
    - maximum_runs: 4
    - No Bedrock/AUXIN under any stop.

  invalidation_rules:
    - Editing (α,M₀) after Stage-0 freeze.
    - Non-isolated RSS measurement for Stage-1 panels.
    - Running Stage 1 without floor_clear_calibration_ok.
    - Re-running parent packages under this card.
    - Claiming break / exponent / n≥131 / support / KN-FIND from this package.

  success_criterion: >-
    Exactly one of O-SUPPORT / O-FAIL-BAND / O-INCONCLUSIVE / O-ARTIFACT /
    O-IMPEDIMENT on Stage 1, with Stage-0 freeze twin_ok + rss_probe_ok +
    allocator_ok + floor_clear_calibration_ok (or named impediment). O-SUPPORT
    requires peak band hold AND instrument_clears_floor AND not
    floor_dominant_delta. Does not assert hypothesis support or authorize
    KN-FIND.

  falsification_criterion: >-
    O-FAIL-BAND: instrument_clears_floor true and peak_rss > band on at least
    one Stage-1 cell. O-INCONCLUSIVE when the instrument still cannot clear
    the OS floor at Stage 1 (honest refine outcome, not band falsification).
    O-IMPEDIMENT when Stage-0 calibration cannot clear the floor gate up to
    density_batch=2048.

  required_artifacts:
    - experiments/EXP-BINSTD-55feb5/stage0/preregistered-predictions.json
    - experiments/EXP-BINSTD-55feb5/stage0/v-catalog.json
    - experiments/EXP-BINSTD-55feb5/stage1/panels.json
    - experiments/EXP-BINSTD-55feb5/stage1/control-table.json
    - experiments/EXP-BINSTD-55feb5/RESULTS.md
    - experiments/EXP-BINSTD-55feb5/runs/RUN-BINSTD-15c58d/
    - experiments/EXP-BINSTD-55feb5/runs/RUN-BINSTD-5b96e9/

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    maximum_memory_gb: 4
    maximum_runs: 4

  assigned_to: executor
  trial_plan: experiments/EXP-BINSTD-55feb5/trial-plan-v1.json
  amazon_bedrock: NOT SELECTED
