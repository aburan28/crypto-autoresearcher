experiment:
  id: EXP-CODESD-b9c717
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-f05ef2; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-f05ef2
  question_id: RQ-WFS-e776b6
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Occupancy measurement of grinding-derived challenge multisets under SHAKE-256 at challenge-space
    cardinalities 2^8 to 2^20 and counter budgets 2^6 to 2^22, against balls-in-bins references, a
    uniform null and a known-biased null.
  objective: 'The one uncertainty a run reduces is whether the accounting abstraction that credits
    a grinding forger with one fresh uniform challenge per attempt describes the finite image a real
    derivation actually produces, and where it stops doing so. Concretely: (i) whether the measured
    number of DISTINCT challenges under a counter budget G matches the balls-in-bins expectation for
    a real SHAKE-256 derivation, measured as a standardized deviation at every point of a G-over-C
    ladder spanning three orders of magnitude; (ii) at which G-over-C ratios the fresh-sample description
    falls short by one part in a hundred, by one part in ten, and by half, read off the measured curve
    rather than asserted from the closed form; (iii) whether the measuring pipeline has demonstrated
    detection power, established by requiring it to flag a derivation with a hand-computed known bias
    while returning clean results for a declared-seed uniform generator, both run through the identical
    code path in the same invocation. A run does not reduce uncertainty about any scheme''s grinding
    parameter, about any forgery cost, or about the security of anything. It reduces uncertainty about
    whether a term the whole family''s cost models treat as a free multiplier is one.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: medium
    exact_scope_a_run_could_support: 'The maximal scope a run could support is: for the declared challenge
      cardinalities, counter budgets, reduction rules and prefix sample counts, the measured occupancy
      statistics of a SHAKE-256 challenge derivation deviated from the balls-in-bins reference by
      at most the reported standardized amounts, and the fresh-sample description fell short at the
      reported G-over-C ratios, with detection sensitivity bounded by the known-biased null. What
      does NOT follow: nothing about SDitH, FAEST or MQOM grinding parameters, which have not been
      read; no claim that any grinding budget is mis-set; no claim that SHAKE-256 is uniform beyond
      the demonstrated sensitivity; and no security consequence of any kind, since no protocol is
      instantiated and no forgery is attempted.'
  inputs:
    procedure: 'STAGE 0 (cost: seconds) verify hashlib.shake_256 availability and halt if absent;
      freeze the C ladder, G ladder, reduction rules, prefix count and counter encoding in a fixture.
      STAGE 1 (cost: minutes) implement occupancy statistics and verify the balls-in-bins closed forms
      against brute-force enumeration at C equal to 16, G up to 32. STAGE 2 (cost: minutes) run NULL-UNIFORM
      through the full pipeline; HALT if it deviates beyond three standardized units anywhere. STAGE
      3 (cost: minutes) run NULL-BIASED with a declared bias magnitude; HALT if it is NOT flagged,
      and record the smallest bias that is flagged as the pipeline''s measured sensitivity. STAGE
      4 (cost: one to three core-hours) run the hash arm over the full C-by-G-by-reduction grid with
      the declared prefix count. STAGE 5 (cost: minutes) run the power-of-two-C control where modular
      bias vanishes by construction. STAGE 6 (cost: minutes) compute the three dissolution ratios
      from the measured distinct-count curve and emit the crossover figure with the ideal reference
      overlaid and the measured sensitivity annotated on the same axes.'
    instrument: Python 3.11 with hashlib.shake_256 from the standard library, fractions.Fraction for
      exact balls-in-bins references, collections.Counter for occupancy, random.Random with declared
      seeds for the uniform null and prefix generation, numpy 2.4.6 for histogram aggregation. No
      Sage, no external cryptographic library, no protocol implementation. Run through harness/runner.py
      so seeds and the resolved inference block land in the run manifest, with immutable run records
      under an experiments/EXP-* directory.
    parameters: 'Challenge cardinality C in {2^8, 2^10, 2^12, 65537, 2^16, 1048573, 2^20}, deliberately
      mixing powers of two and primes. Counter budget G in a geometric ladder {2^6, 2^8, 2^10, 2^12,
      2^14, 2^16, 2^18, 2^20, 2^22}, truncated so that G/C stays within [1/1000, 4]. Reduction rules:
      biased modular and rejection sampling. Prefixes: 2000 independent 32-byte prefixes per (C, G,
      reduction) from a declared seed. Counter encoding: fixed 8-byte big-endian across all G. NULL-BIASED:
      one residue overweighted by factors {1.01, 1.02, 1.05, 1.10, 1.25} to locate the sensitivity
      threshold rather than assume it.'
  controls:
  - 'NULL-UNIFORM: declared-seed uniform generator through the identical occupancy pipeline.'
  - 'NULL-BIASED: derivation with hand-computed known bias, which the pipeline must flag.'
  - Two reduction rules, biased-modular and rejection, run at identical (C, G) so the reduction is
    separated from the hash.
  - C a power of two versus C prime, where modular bias is exactly zero in the first case by construction.
  - 'Small-C brute force: at C equal to 16 and G up to 32, enumerate the exact occupancy distribution
    and check the closed forms against it.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): Two nulls, both executed in the same invocation. NULL-UNIFORM: the
    identical occupancy pipeline fed by a declared-seed pseudorandom uniform generator instead of
    the hash. It must reproduce the balls-in-bins expectations within sampling error; if not, the
    pipeline measures itself and the hash arm is void. NULL-BIASED: the identical pipeline fed by
    a derivation with a hand-computed known bias of a declared magnitude. It must be FLAGGED by the
    same statistics at the declared sensitivity; if it is not, the pipeline has no detection power
    and an agreement result from the hash arm carries no information. Both nulls are required for
    the signal arm to mean anything, and the second is the one usually omitted.'
  independent_variables:
  - challenge-space cardinality C
  - counter budget G
  - reduction rule (biased modular versus rejection)
  - arm identity (hash signal, uniform null, biased null)
  - bias magnitude on the biased null
  metrics:
    primary:
    - mean distinct-count per (C, G, reduction, arm)
    - standardized deviation from the balls-in-bins expectation
    - maximum bin occupancy distribution
    - smallest bias magnitude flagged on NULL-BIASED, as the pipeline sensitivity
    secondary:
    - multiplicity histogram
    - empty-bin fraction
    - the three dissolution G-over-C ratios
    - difference between reduction rules at matched (C, G)
    - wall-clock seconds and hash evaluations per grid point
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The relative shortfall S(G, C) = 1 minus (measured mean distinct-count) divided by G,
      as a function of G/C, for the hash arm and for the uniform null.
    formula: 'Ideal reference E[distinct] = C times (1 minus (1 minus 1/C)^G), so S_ideal(G, C) =
      1 minus (C/G) times (1 minus (1 minus 1/C)^G). Predicted: S measured on the hash arm agrees
      with S_ideal to within three standardized units at every grid point, and S_ideal exceeds 0.01
      for G/C at least 1/50. A hash-arm deviation beyond three standardized units at a point where
      the uniform null is clean is the informative outcome and is attributed to the reduction rule
      before anything else.'
    source: Pre-registered in the parent proposal IDEA-20260816-f05ef2 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: medium
    justification: 'Tested cardinalities reach 2^20 and budgets reach 2^22, which is far below any
      deployed grinding parameter but spans the entire G-over-C range from 1/1000 to 4 where the abstraction''s
      behaviour changes. The transfer assumption is explicit: the occupancy law depends on C and G
      only through their ratio in the regime tested, so the crossover ratios are the transferable
      quantity while the absolute cardinalities are not. Whether that ratio-only dependence continues
      to hold at cryptographic C is NOT tested here and is stated as an untested extrapolation, not
      relied upon in any conclusion.'
    correspondence: null
  tail_checks:
  - 'G much smaller than C: the shortfall must approach zero and the hash arm must be indistinguishable
    from the uniform null.'
  - 'G much larger than C: the distinct-count must saturate at C and the empty fraction must approach
    zero; a distinct-count exceeding C is an instrument failure.'
  - 'C a power of two with biased-modular reduction: the modular bias is exactly zero, so the two
    reduction rules must be statistically identical there; a difference indicates an implementation
    bug.'
  - 'C equal to 16 with brute-force enumeration: the closed forms must be reproduced exactly.'
  - 'Bias magnitude 1.00 on NULL-BIASED, i.e. no bias: must NOT be flagged, or the pipeline has a
    false-positive problem that voids every detection claim.'
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 3.0
    maximum_memory_gb: 8
    maximum_runs: 40
  stopping_rules:
  - Halt if hashlib.shake_256 is unavailable rather than substituting another hash.
  - Halt if NULL-UNIFORM deviates beyond three standardized units at any grid point.
  - Halt if NULL-BIASED at bias 1.00 is flagged, indicating false positives.
  - Stop and report partial coverage if wall-clock exceeds four core-hours; partial coverage is reported
    as such and never as a null result.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The uniform null reproduces the balls-in-bins reference within three standardized
    units everywhere, the biased null is flagged with a located sensitivity threshold and no false
    positive at zero bias, and the run emits the measured distinct-count curve with its three dissolution
    ratios across the full G-over-C range for both reduction rules.
  falsification_criterion:
  - NULL-UNIFORM deviates from the closed-form reference, voiding the pipeline.
  - NULL-BIASED is not flagged at any tested magnitude, showing no detection power.
  - NULL-BIASED at zero bias is flagged, showing false positives.
  - Brute-force enumeration at C equal to 16 disagrees with the closed forms.
  - The two reduction rules differ at C a power of two, where they must coincide by construction.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-f05ef2
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The Coordinator must approve the standardized-deviation threshold of three units, since it alone
    converts a measurement into a flag.
  - The counter encoding is fixed at 8 bytes big-endian by fiat; whether that matches any real construction
    cannot be checked here and the Coordinator must record it as an assumption of the contract.
  - Whether the medium scale tier is justified given no cryptographic quantity is computed, or whether
    the run should be relabelled toy.
