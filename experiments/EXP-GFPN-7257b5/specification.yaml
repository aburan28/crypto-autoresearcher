# EXP-GFPN-7257b5
# Adding-walk factor arithmetic. No walk.
# Approved by DEC-20261002-0c64c8.
experiment:
  id: EXP-GFPN-7257b5
  hypothesis_id: H-GFPN-a170eb
  source_idea: IDEA-20260920-5b1f84
  question_id: RQ-GFPN-c01af8
  version: 1
  title: Adding-walk factor arithmetic
  status: approved
  frozen: true
  designed_at: '2026-10-02'
  approved_by: coordinator
  approval_decision_id: DEC-20261002-0c64c8
  objective: >-
    Check the factor 65/64, the band gaps 292 and 92, and the standard
    error 13/500.
  inputs:
    branch_32: 32
    factor_num: 65
    factor_den: 64
    low_num: 97
    low_den: 100
    high_num: 103
    high_den: 100
    low_gap: 292
    high_gap: 92
    band_den: 6400
    branch_16: 16
    factor_16_num: 33
    factor_16_den: 32
    branch_20: 20
    factor_20_num: 41
    factor_20_den: 40
    ladder_gap: 8
    ladder_den: 1280
    solves: 400
    sd_num: 52
    sd_den: 100
    se_num: 13
    se_den: 500
    tenths_num: 11
    tenths_den: 10
    tenths_gap: 54
    tenths_den_product: 640
  controls:
    - >-
      The r = 32 factor is 65/64. Reporting it as exactly 1 invalidates
      the run.
    - >-
      The cross gap above 97/100 is 292 and the cross gap below 103/100
      is 92. Reporting the factor as at most 97/100 invalidates the run.
    - >-
      The r = 16 factor exceeds the r = 20 factor by 8 on the denominator
      1280. Reporting the two factors as equal invalidates the run.
    - >-
      The standard error is exactly 13/500. Reporting it as strictly
      below 13/500 invalidates the run.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {factor, standard_error}
    - route in {reduction, cross_product}
  metrics:
    primary:
      - high_gap
      - standard_error
      - implementations_agree
    secondary:
      - low_gap
      - ladder_gap
      - tenths_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The cross gap below 103/100 is 92, and the standard error is 13/500.
    formula: >-
      The factor is 1 plus 1 over twice the branch count. The band gaps
      compare 65 times 100 with 97 times 64 and with 103 times 64. The
      standard error is 52/100 divided by the square root of 400.
    source: >-
      IDEA-20260920-5b1f84 states the factor 1 + 1/(2r), the band of three
      hundredths, and the figure 0.52 at 400 solves, read 2026-10-02. The
      gaps were computed in this design session. That computation is not
      a run. No walk was run.
  scale_relevance:
    tier: toy
    justification: Three rational factors and one sample-size identity. No transfer to a walk.
    correspondence: null
  tail_checks:
    - The ladder gap 8 is required. A check that stops at r = 32 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the r = 32 factor disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The r = 32 factor is not 65/64.
    - The factor is reported as exactly 1.
    - The r = 16 and r = 20 factors are reported as equal.
    - The standard error is reported as strictly below 13/500.
    - A walk is run or a mixing verdict is stated.
  success_criterion: >-
    Both runs agree that the r = 32 factor is 65/64, that the cross gaps
    are 292 and 92, that the ladder gap is 8, and that the standard error
    is exactly 13/500.
  falsification_criterion: >-
    The runs agree, the r = 32 factor is 65/64, and 103 times 64 does not
    exceed 65 times 100 by 92.
  required_artifacts:
    - experiments/EXP-GFPN-7257b5/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-GFPN-7257b5/runs/<RUN-ID>/command.txt
    - experiments/EXP-GFPN-7257b5/runs/<RUN-ID>/stdout.log
    - experiments/EXP-GFPN-7257b5/runs/<RUN-ID>/stderr.log
    - experiments/EXP-GFPN-7257b5/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-GFPN-7257b5/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any walk, hash, or distinguished-point sample.
    - Any claim that H0 or H1 holds.
    - Any measured steps to solve.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
