experiment:
  id: EXP-PFDR-3d7c39
  hypothesis_id: H-PFDR-1f2945
  question_id: RQ-ECTD-001
  goal_id: GOAL-ECTD-001
  batch_id: BATCH-2c45e2
  version: 1
  status: draft
  claim_tier: toy
  retrospective: false
  retrospective_note: >-
    PRE-REGISTRATION. No run exists. Thresholds and predictions are frozen before
    execution and change only by a versioned protocol_amendment filed BEFORE the
    affected data is generated. NOTHING HERE IS A MEASUREMENT.

  title: >-
    Does the finite-field descent instrument have dynamic range - planted-defect
    detection at known size, a rational proves-too-much object where the conclusion
    is false, and a curve-free arm that decides whether the size identity is about
    elliptic curves at all.

  objective: >-
    Establish whether a descent instrument that reports no variation on a
    prime-order subgroup is saying anything. The two identities the source idea
    predicts - that the quotient by l has the same order as the l-torsion, and that
    the descent class of a scalar multiple is independent of the scalar for l
    different from N - are forced, the first by the structure theorem for finite
    abelian groups and the second because multiplication by l is a bijection on a
    group of coprime order. Neither can move. This experiment therefore measures
    the instrument instead - its detection rate against defects of KNOWN SIZE, its
    behaviour on an object where the finite-field conclusion is known false, and
    whether a curve-free finite abelian group reproduces the identity - and reports
    the forced identities as implementation checks under that name.

  inputs:
    main_arm:
      curves: >-
        At least 200 toy ordinary prime-field curves at 16 to 24 bits, with the
        full invariant-factor decomposition of the group of rational points and the
        prime factorisation of the group order recorded per curve.
      per_curve_work: >-
        For every prime l dividing the group order, compute the order of the
        quotient by l and the order of the l-torsion, by TWO independent routes -
        the invariant-factor decomposition, and direct enumeration of the quotient.
        Then fix a point P of prime order N, sample 100 scalars, and record the
        descent class of the scalar multiple for every l different from N.
    planted_arm:
      curves: >-
        At least 30 deliberately constructed curves whose l-part is NON-CYCLIC for
        some prime l, so the quotient by l has order exactly l squared and points
        outside the prime-order subgroup provably fall into at least two distinct
        classes.
      defect_size: >-
        KNOWN AND PREDICTED IN ADVANCE - quotient order exactly l squared rather
        than l, and at least two distinct descent classes among sampled points
        outside the prime-order subgroup.
      purpose: >-
        THE PRIMARY MEASUREMENT. This is the control with demonstrated dynamic
        range, promoted to primary because the forced identities have none.
    rational_nearby_arm:
      objects: >-
        A pinned fixture of curves over the rationals with KNOWN nonzero
        Tate-Shafarevich group or known positive rank, with the source of each
        known value recorded and its opened or not-opened status stated.
      purpose: >-
        PROVES-TOO-MUCH CONTROL. The finite-field conclusion is KNOWN FALSE here
        and a nonzero Selmer gap exists. The instrument must find it. An instrument
        that reports emptiness on this arm has proved too much, and its
        finite-field silence carries no information.
    curve_free_arm:
      objects: >-
        At least 200 random finite abelian groups whose l-primary structure is
        matched to the main arm's curves, generated from a recorded seed. NO
        ELLIPTIC CURVE, NO POINT ARITHMETIC AND NO GALOIS COHOMOLOGY appears in
        their construction - they are abstract groups given by invariant factors.
      quantity: >-
        The same size identity - order of the quotient by l against order of the
        l-torsion - and the same class-constancy test on a subgroup of prime order
        coprime to l.
      purpose: >-
        THE BINDING CURVE-FREE NULL. Predicted to reproduce both identities on 100
        percent of groups. If it does, the identities carry no elliptic-curve
        content and the pre-stated consequence in falsification_criterion applies.

  controls:
  - >-
    C-PLANTED-NONCYCLIC (BLOCKING, RUNS FIRST, AND IS ALSO THE PRIMARY
    MEASUREMENT). Detection rate must be exactly 1.00 on at least 30 planted
    curves - the instrument must report quotient order exactly l squared and at
    least two distinct classes. Below 1.00 the instrument is blind and the run
    stops; no absence of variation is reportable in any direction.
  - >-
    C-RATIONAL-NEARBY (BLOCKING, PROVES-TOO-MUCH). A nonzero Selmer gap must be
    reported on every fixture curve where one is known. A zero gap means the code
    returns emptiness rather than measuring it.
  - >-
    C-CURVEFREE (BINDING). Random finite abelian groups of matched l-primary
    structure. Predicted to reproduce both identities exactly. If they do, NO
    STATEMENT ABOUT ELLIPTIC CURVES, ABOUT LANG'S THEOREM, OR ABOUT DESCENT
    SPECIFICALLY may be quoted from those identities, and the record must say so in
    those words.
  - >-
    C-TWO-ROUTE. Quotient order and torsion order computed both from the
    invariant-factor decomposition and by direct enumeration. Disagreement is an
    implementation defect and voids the curve.
  - >-
    C-SCALAR-RESAMPLE. Resample the scalar with the curve fixed. Any statistic that
    moves under scalar resampling on a group of order coprime to l is an artifact
    by construction, since exactly one class is available.
  - >-
    C-FIELD-OF-DEFINITION. Every computation asserts its field of definition in the
    artifact. An implementation that computes descent by lifting to the integers has
    silently changed the question and its output is void.
  - >-
    C-VACUITY-ACCOUNTING. Curves with cofactor 1, on which the l different from N
    test is vacuous, are counted and reported separately and are NEVER counted as
    confirmations.

  independent_variables:
  - arm - main, planted, rational_nearby, curve_free
  - prime l dividing the group order
  - cofactor structure - cyclic l-part or non-cyclic l-part
  - bit size in {16, 20, 24}

  metrics:
    primary:
    - >-
      planted_detection_rate, dimensionless, the fraction of planted curves on
      which the instrument reports quotient order exactly l squared AND at least
      two distinct descent classes among sampled points outside the prime-order
      subgroup.
    - >-
      selmer_gap_detection, a per-curve binary outcome on the rational nearby arm,
      reported as a count of detected over total.
    - >-
      curve_free_identity_reproduction_rate, dimensionless, the fraction of random
      finite abelian groups reproducing the size identity and the class-constancy
      result.
    - >-
      the two-by-two contingency table of rational N-torsion basis existence
      against divisibility of p minus one by N, as four integer counts over at
      least 200 curves.
    secondary:
    - >-
      IMPLEMENTATION CHECK, NOT A FINDING - agreement count between the order of
      the quotient by l and the order of the l-torsion, over all curves and all l,
      as an exact integer pair.
    - >-
      IMPLEMENTATION CHECK, NOT A FINDING - number of distinct descent classes
      observed over 100 scalars per curve for each l different from N, predicted
      exactly 1 by elementary group theory.
    - cofactor of N per curve, and the fraction of curves with cofactor 1
    - largest observed cofactor, and the cofactor distribution per bit size
    - two-route disagreement count, predicted exactly zero
    - wall time and peak resident memory, INFRASTRUCTURE ONLY

  heuristic_under_test: HEUR-001

  preregistered_prediction:
    quantity: >-
      The instrument's detection rate against defects of known size, and the
      curve-free reproduction rate.
    formula: >-
      planted_detection_rate = 1.00 exactly. selmer_gap_detection nonzero on every
      fixture curve with a known nonzero gap. curve_free_identity_reproduction_rate
      = 1.00 exactly. Both off-diagonal cells of the N-torsion contingency table
      exactly 0.
    source: >-
      The planted defect size is derived - a non-cyclic l-part gives a quotient of
      order exactly l squared by the structure theorem. The curve-free prediction
      is derived from the same theorem, which is why it is predicted to reproduce.
      The contingency-table prediction follows from the RECALLED
      Balasubramanian-Koblitz condition and is measured rather than assumed.

  scale_relevance:
    tier: toy
    justification: >-
      Prime fields of 16 to 24 bits, chosen so that the group can be fully
      decomposed and the quotient directly enumerated. The tested scope is exactly
      that. No transfer to cryptographic sizes is claimed, and none is needed,
      because the statements under test are exact identities rather than
      distributional facts.
    correspondence: null

  tail_checks:
  - >-
    The largest observed cofactor of N is reported, together with the fraction of
    curves with cofactor 1 where the test is vacuous, rather than pooling them.
  - >-
    On the planted arm, the maximum number of distinct descent classes observed is
    reported and compared against the predicted l squared ceiling. Exceeding it
    indicates an implementation defect.

  replication:
    seeds: [20260904, 20260905]
    independent_instances: 2
    seeds_policy: >-
      One master seed per run, recorded in the manifest, from which curve
      selection, scalar sampling and the random finite abelian group construction
      are derived by a declared deterministic stream. Every sampled object is
      reproducible from the master seed and its index. Seeds are fixed before
      execution and are never redrawn after an outcome is seen. The rational
      fixture is pinned by content hash rather than seeded.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 6
    budget_note: >-
      Below the 8 GB memory floor of the template because the largest object is a
      group of at most 2^24 elements whose quotient is enumerated directly; the
      reason is stated here rather than left as an unexplained departure.

  stopping_rules:
  - >-
    SR1 BLOCKING. C-PLANTED-NONCYCLIC runs first. Detection rate below 1.00 stops
    the run with an instrument-failure receipt. No main-arm result is interpreted.
  - >-
    SR2 BLOCKING. C-RATIONAL-NEARBY runs second. A zero Selmer gap where a nonzero
    one is known stops the run with the same receipt.
  - >-
    SR3. C-TWO-ROUTE disagreement on any curve voids that curve, which is recorded
    and excluded; more than 1 percent of curves voided stops the run.
  - >-
    SR4. If any measured scalar dependence appears for l different from N on a
    prime-order subgroup, the run STOPS and the observation is re-run in a second
    independent engine before anything is recorded, because that outcome is forced
    false by elementary group theory and an implementation defect is overwhelmingly
    the likelier cause.
  - >-
    SR5. Budget exhaustion stops the run and reports curves completed. An
    infrastructure receipt, never a negative result.

  invalidation_rules:
  - >-
    The planted arm detection rate is below 1.00, or the rational nearby arm shows
    no gap where one is known - the instrument is blind and every main-arm number
    is void.
  - >-
    Any computation cannot assert its field of definition, or descent is computed
    by lifting to the integers anywhere.
  - >-
    The two-route check disagrees on more than 1 percent of curves.
  - >-
    Vacuous curves - cofactor 1 - are pooled with tested curves anywhere in the
    reporting.
  - >-
    A recalled external condition is reported as verified without an opened status
    for its source.
  - >-
    A timeout, crash or library failure is recorded as failed_infrastructure and is
    NEVER counted as negative mathematical evidence.

  success_criterion: >-
    planted_detection_rate exactly 1.00; a nonzero Selmer gap on every rational
    fixture curve where one is known; both off-diagonal contingency cells exactly
    0; the forced identities reproduced and reported as implementation checks under
    that name; and the curve-free arm reported with its consequence applied. That
    combination establishes that the instrument can see a difference of known size
    and still sees none on a prime-order subgroup, which is the only reading under
    which the finite-field silence means anything.

  falsification_criterion: >-
    THE DECISION RULE, FIXED BEFORE EXECUTION. (F1) planted_detection_rate below
    1.00 - the instrument is blind; the run is INVALID and no absence of variation
    is reportable. (F2) Zero Selmer gap on the rational nearby object where one is
    known - the argument or the code proves too much; same consequence. (F3) THE
    CURVE-FREE ARM REPRODUCES BOTH IDENTITIES - and it is predicted to - so the
    identities carry NO ELLIPTIC-CURVE CONTENT AND NO CONTENT SPECIFIC TO DESCENT;
    nothing derived from them may be quoted as a statement about elliptic curves,
    about Lang's theorem, or about the ECDLP, and the record must state this in
    those words. (F4) Any measured scalar dependence for l different from N that
    survives re-run in a second engine - H-PFDR-1f2945 S2 is falsified and the
    descent lane reopens with a concrete instance; this would be a major positive
    result and is handled under SR4 rather than reported directly. (F5) A single
    off-diagonal entry in the N-torsion contingency table - S3 is falsified.

  required_artifacts:
  - per-curve invariant factors, group order factorisation, cofactor of N, and bit size
  - per-curve and per-l quotient order and torsion order, by BOTH routes
  - per-curve and per-l number of distinct descent classes over 100 scalars
  - planted-arm per-curve quotient order, class count, and detection outcome
  - rational nearby arm per-curve known gap, measured gap, and the pinned fixture hash
  - curve-free arm per-group invariant factors, identity outcome and class-constancy outcome
  - the two-by-two N-torsion contingency table with its four integer counts
  - the vacuity accounting - count and fraction of curves with cofactor 1, per bit size
  - the field-of-definition assertion for every computation
  - the opened or not-opened status of every recalled external condition relied on
  - command, environment, seeds, pinned library versions, and resource measurements

  limitations:
  - >-
    THE SOURCE IDEA'S TWO PRIMARY BANDS HAVE WIDTH ZERO AND THE DESIGN WAS
    RESTRUCTURED. The size identity holds for EVERY finite abelian group by the
    structure theorem, without Lang's theorem and without elliptic curves. The
    class-constancy prediction is forced because multiplication by l is a bijection
    on a group of order coprime to l, leaving exactly one attainable class. Neither
    can discriminate any hypothesis. The planted arms were promoted to primary; the
    identities are reported as implementation checks. Recorded in H-PFDR-1f2945
    band_non_degeneracy.
  - >-
    THE SOURCE IDEA MISDESCRIBES GOAL-ECTD-001, AND NO OUTCOME HERE ADVANCES A
    GOAL-ECTD-001 COMPLETION CRITERION. TASK-20260904-5423ad read
    ledger/goals/GOAL-ECTD-001.yaml. The title concerns prime-field elliptic-curve
    trapdoors by a Teske analogue via secret isogenies to rare endpoint weaknesses
    and contains neither torsion nor descent; the objective's four priorities are
    secret isogeny-aligned factor bases with Semaev and Groebner heavy tails,
    large-conductor vertical barriers, hidden correspondences, and trapdoor DDH.
    Descent is not among them, and completion criterion 1's barrier branch is
    scoped to each PRIORITIZED endpoint family.
  - >-
    SCOPE. Descent over a prime field, at 16 to 24 bits, p greater than 3. Nothing
    here bears on descent over number fields, where it is a powerful tool, and
    nothing here closes the route through a lift.
  - >-
    UNTESTABLE AT REACHABLE SCALE, STATED RATHER THAN SHRUNK. The claim that every
    surviving descent trapdoor must live on a characteristic-zero or p-adic lift is
    NOT tested by this experiment at any scale and is not testable by it. Computing
    canonical lifts and canonical heights of lifted points at cryptographic size is
    outside any budget this program has, so the lift route is neither narrowed nor
    supported by any outcome here.
  - >-
    Lang's theorem and the Balasubramanian-Koblitz condition are RECALLED and not
    re-verified against primary sources by this program. No measurement below
    depends on the first; the second is what the contingency table measures.
  - >-
    Non-cyclic l-part curves genuinely have a larger quotient. Pooling them with
    cyclic instances would manufacture an appearance of variation and is forbidden.
  - >-
    Toy verification confirms a derivation and is not crypto-scale evidence.

  assigned_to: executor
  approved_by: null
