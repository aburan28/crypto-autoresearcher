experiment:
  id: EXP-ICEX-c32447
  hypothesis_id: H-ICEX-b2c8cf
  derived_from_idea: IDEA-20260808-f7e6e7
  question_id: RQ-ECDLP-002
  batch_id: BATCH-fced88
  version: 1
  title: >-
    SEPARATE THE SHARED COST FROM THE PER-TARGET COST AND MEASURE BOTH
    AGAINST A REAL MULTI-TARGET RHO ARM- a three-counter instrumentation of
    toy prime-field index calculus that reports relation cost, linear-algebra
    cost and per-target descent cost as distinct group-operation counters,
    swept in B at fixed N under an exhaustive solver, against a measured
    Kuhn-Struik multi-target rho baseline with its distinguished-point table
    charged, with a curve-free (Z/NZ, +) arm carrying the identical counters
  status: designed
  objective: >-
    (A) THE UNCERTAINTY. H-ICEX-b2c8cf asserts an exact cancellation- at
    sigma = 1 the SHARED cost of index calculus is m!*N charged group
    operations and does not depend on B or m, so amortised index calculus
    cannot reach the multi-target baseline sqrt(T*N) at any T <= N. That is
    an algebraic claim about a counting identity, and it has one cheap
    observable signature- the shared cost is FLAT IN B. Nothing in the ledger
    has measured it, and the prior empirical treatment of the multi-target
    crossover (reported as a decreasing T_desc/sqrt(N) trend, later weakened)
    compared against T*sqrt(N) rather than sqrt(T*N), which is the baseline
    error this contract exists to remove.
    (B) WHAT IS BUILT. Three separated counters where the lane currently has
    one total- C_rel (relation collection), C_LA (linear algebra) and
    C_descent (per target)- plus a genuine multi-target rho arm with a shared
    distinguished-point table whose memory is counted in stored group
    elements. Both sides are charged in ONE declared unit, by ONE code path,
    on ONE shared instance set.
    (C) WHAT IS DECIDED. Whether the shared cost is flat in B (P1), whether
    it sits at m!*N (P2), whether the amortised total ever falls below the
    MEASURED baseline at T in {1, 4, 16, 64} (P3), and whether the baseline
    arm itself is trustworthy (P4). A failure of P4 voids the run as an
    infrastructure outcome and decides nothing.
    (D) WHAT IS NOT DECIDED. Nothing about ECDLP hardness, nothing about
    extension fields, nothing at cryptographic N, and nothing about solvers
    whose cost is not a power of the candidate count.
  inputs:
    cost_unit: >-
      ONE CHARGED OPERATION IS ONE GROUP OPERATION on E(F_p)- one point
      addition or one point doubling, counted by an explicit program counter,
      never by wall clock. MEMORY IS COUNTED IN STORED GROUP ELEMENTS. Wall
      clock is recorded as a machine-tagged SECONDARY column and never enters
      a primary total.
    unit_discipline: >-
      BINDING AND CHECKED BY THE HARNESS. Every emitted number carries a unit
      tag in {group_ops, field_ops, stored_elements, seconds}. The harness
      REFUSES to add, subtract or compare two numbers whose tags differ, and
      a run that emits an untagged number is invalid. Quantities natively
      counted in F_p field operations (solver work) are reported in their own
      column AND converted into group operations at the frozen declared rate
      kappa in {1, 10, 100} field multiplications per group operation, with
      one row per kappa. A conclusion that flips across the kappa range is
      labelled convention-dependent and may not be quoted without kappa.
      TIME IS NEVER ADDED TO MEMORY- where a combined figure is wanted it is
      the PRODUCT, reported with both unit tags.
    feasibility_gate: >-
      THE HARNESS REFUSES TO PRICE AN EMPTY OBJECT. A cell is reported as
      INFEASIBLE, with its parameters and the reason, and is NEVER assigned a
      cost, when- the factor base is empty (B = 0); the relation system has
      zero equations or fewer relations than the factor-base size (an
      underdetermined system whose solve cost is not the modelled quantity);
      the linear-algebra matrix has zero rows or zero columns; or the number
      of accepted relations in the budget is zero (the per-relation estimator
      is undefined and is reported as censored, with the attempt count, never
      imputed). A cost script that cannot represent an empty matrix will
      manufacture cells- this gate exists because DEC-20260904-d47cd2
      rejected a table that priced a zero-row matrix at every cell.
    procedure: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Verify the symbolic
      identities- collapse C_total at T = 1; evaluate the shared cost at
      sigma = 1 and confirm the B and m dependence cancels to 1e-12; evaluate
      d(sigma_max)/d(tau) against 1/(2*beta*(m-1)) at every (beta, m) grid
      point. Any residual above 1e-12 is an algebra error and halts.
      STAGE 1 (HARD GATE, minutes). Instrument checks- (i) the counters
      respond, by injecting a solver whose declared cost is 10x and
      confirming C_rel rises by 10x +/- 15 percent; (ii) the T = 1 fixture,
      where the measured shared cost must equal the T = 64 shared cost within
      the seed spread, since it is T-independent by construction.
      STAGE 2 (HARD GATE, minutes to an hour). The BASELINE arm- multi-target
      rho with a shared distinguished-point table, measured at T in
      {1, 4, 16, 64} over the N ladder, fitting the exponent in (T*N). P4
      must hold before any comparison is admitted.
      STAGE 3 (the measurement, hours). The B sweep at fixed N under an
      exhaustive solver, all three counters, all seeds, at each m in
      {2, 3, 4}- P1 and P2.
      STAGE 4. The comparison- amortised total against the measured baseline
      at each T, at each kappa- P3.
      STAGE 5 (curve-free null). Repeat Stages 1, 3 and 4 on (Z/NZ, +) at
      matched N with the identical counters and the identical code path.
      STAGE 6 (zero compute). Emit the (tau, sigma, beta, m) admission
      inequality as a screening table, and the infeasible-cell table.
    mechanism: >-
      STEP 1. Split the existing single total into three counters at the call
      sites, and assert at every cell that the three sum to the previously
      reported total to the last unit- the decomposition must be exact, not
      approximate, or the split is wrong.
      STEP 2. Implement multi-target rho with a SHARED distinguished-point
      table- one walk set, T targets, table sized to the target count, with
      stored group elements counted at every insertion and the peak recorded.
      This is the correct comparator; a T-times-single-target-rho arm is NOT
      built, and if any downstream reader wants it, it is a different row.
      STEP 3. Implement the curve-free arm as (Z/NZ, +) with F an interval of
      residues of size B and decomposition realised as subset-sum
      membership- no curve arithmetic anywhere in the arm. Every counter,
      every stopping rule and every reporting path is shared with the curve
      arm; the ONLY difference is the group.
      STEP 4. Report every cell as (C_rel, C_LA, C_descent, peak stored
      elements, kappa, seed), never as a single scalar.
    instrument: >-
      Pure Python with explicit counters, no wall-clock proxies in any
      primary metric, no Sage. Every emitted record carries the sha256 of the
      factor base and of the instance list.
  controls:
    - >-
      MATCHED MULTI-TARGET RHO ARM (blocking, NULL 1). A genuine
      shared-distinguished-point-table implementation measured on the SAME
      instances under the SAME counter, with its table memory charged in
      stored group elements. Its fitted exponent in (T*N) must be
      0.5 +/- 0.03. A comparison whose baseline arm misses that is not
      measuring a ratio.
    - >-
      CURVE-FREE NULL (NULL 2, REQUIRED under the standing scope constraint
      of pfdr-battery-20260904). The identical three-counter accounting on
      (Z/NZ, +) with an interval factor base and subset-sum membership as the
      decomposition. The flat-in-B shared cost is a property of a COUNTING
      IDENTITY, and a non-curve object of the same shape should reproduce it
      exactly. PREDICTED- it does. Consequence, stated in advance- if it
      does, nothing measured here may be read as a statement about elliptic
      curves.
    - >-
      T = 1 DEGENERATE NULL (NULL 3). The amortisation term must vanish and
      the comparison must collapse to the single-target statement; the shared
      cost must be identical to its T = 64 value within the seed spread.
    - >-
      COUNTER-RESPONSE NULL (NULL 4). A deliberately 10x-inflated solver must
      raise C_rel by 10x +/- 15 percent. An unchanged C_rel means the counter
      is not wired through and VOIDS every number in the run.
    - >-
      MEMORY-CHARGED-ON-BOTH-SIDES CONTROL. The index-calculus arm is charged
      N^{beta} stored elements and the rho arm its distinguished-point table;
      a comparison reported without both memory columns is not admissible.
    - >-
      KAPPA SENSITIVITY CONTROL. Every comparison row is reported at
      kappa in {1, 10, 100}; a verdict that flips inside that range is
      labelled convention-dependent.
    - >-
      SEED-INDEPENDENCE CONTROL. The symbolic Stage 0 outputs are seed-free
      and must be bit-identical across seeds; only measured counts vary.
  independent_variables:
    - factor base size B, swept over a 16x range at fixed N
    - arity m in {2, 3, 4}
    - target count T in {1, 4, 16, 64}
    - group order N over a toy ladder from 2^20 to 2^30
    - field-to-group conversion rate kappa in {1, 10, 100}
    - group object- curve arm E(F_p) against curve-free arm (Z/NZ, +)
  metrics:
    primary:
      - >-
        C_rel, charged GROUP OPERATIONS, per (N, B, m, seed)- relation
        collection only
      - >-
        C_LA, charged GROUP OPERATIONS, per (N, B, m, seed)- linear algebra
        only
      - >-
        C_descent, charged GROUP OPERATIONS PER TARGET, per (N, B, m, seed)
      - >-
        multi-target rho total, charged GROUP OPERATIONS, per (N, T, seed),
        and its fitted exponent in (T*N), dimensionless
      - >-
        peak memory, STORED GROUP ELEMENTS, per arm per cell (factor base
        plus relation matrix on the IC side; distinguished-point table on the
        rho side)
      - >-
        ratio of amortised IC total to measured rho total, dimensionless,
        with both numerator and denominator in group operations and their
        unit tags recorded
    secondary:
      - solver work in F_p FIELD OPERATIONS, reported in its own column and converted at each kappa
      - wall clock in SECONDS, machine-tagged, never entering a primary total
      - infeasible-cell table with parameters and refusal reason
      - sha256 of the factor base and of the instance list per cell
      - the symbolic Stage 0 residuals, required below 1e-12
  heuristic_under_test: HEUR-MT-1
  preregistered_prediction:
    quantity: >-
      The shared cost C_rel + C_LA in charged group operations, as a function
      of factor base size B at fixed N under an exhaustive solver.
    formula: >-
      C_rel = m! * N * B^{(m-1)(sigma-1)}, which at sigma = 1 equals m!*N
      exactly and is INDEPENDENT OF B AND m; measured variation across a 16x
      range in B must therefore be under 15 percent, and the measured value
      must sit within a factor 2 of m!*N.
    source: >-
      H-ICEX-b2c8cf statement (C), derived from the cost frame of
      IDEA-20260808-f7e6e7; not from any external citation.
  scale_relevance:
    tier: toy
    justification: >-
      Toy prime orders N from 2^20 to 2^30 and T up to 64. These sizes are
      chosen so the multi-target rho baseline is measurable exactly
      (sqrt(64 * 2^30) is about 2^18 group operations) rather than estimated.
      TRANSFER ASSUMPTION- none is claimed. The 'for all T <= N' quantifier
      of Claim A is a derivation inside the cost model; neither T = Theta(N)
      nor cryptographic N is reachable here, and no measurement in this
      contract bears on either. Evidence from this contract is capped at
      claim_tier toy.
    correspondence: null
  tail_checks:
    - >-
      LARGEST B AT EACH N. The flatness prediction is weakest where B
      approaches sqrt(N) and the relation matrix starts to dominate; the
      largest-B cell is reported separately and is the one that anchors P1.
    - >-
      LARGEST T. The baseline exponent fit is anchored by T = 64; the fitted
      exponent restricted to the largest two T values is reported alongside
      the pooled fit, since a systematic departure there means the
      distinguished-point table is under-sized.
    - >-
      SMALL-B DEGENERACY. Cells with B < 16 have too few relations for the
      linear algebra to be the modelled object; they are reported and
      EXCLUDED from every fit, declared before the run.
    - >-
      CURVE-FREE / CURVE DIVERGENCE. Any cell where the two arms' shared
      costs differ by more than 15 percent at matched (N, B, m) is inspected
      individually and reported; that divergence, not the agreement, would be
      the curve-specific content.
  replication:
    seeds:
      - 20260904
      - 20260905
      - 20260906
      - 20260907
      - 20260908
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 2.0
    maximum_memory_gb: 8
    maximum_runs: 24
    maximum_workers: 1
  stopping_rules:
    - Stop at maximum_runs or total_cpu_hours, whichever binds first.
    - >-
      Stop immediately and report unrun if Stage 1's counter-response null
      fails- measurements from an unwired counter are attempted_and_inconclusive,
      never evidence.
    - >-
      Stop immediately if Stage 2's baseline exponent falls outside
      0.5 +/- 0.03; no comparison may be attempted against a mis-implemented
      baseline.
    - >-
      Stop a cell as soon as its declared per-run wall clock is reached and
      record it as censored with the counters reached, never as a completed
      measurement.
  invalidation_rules:
    - >-
      A timeout, crash, memory exhaustion or dependency failure makes the run
      failed_infrastructure and is NEVER negative mathematical evidence
      (AGENTS.md rule 5).
    - >-
      A run emitting any number without a unit tag, or any total combining
      two unit tags without a recorded conversion, is INVALID.
    - >-
      A run that assigns a cost to a cell the feasibility gate declared
      infeasible is INVALID.
    - >-
      A run whose three counters do not sum exactly to the harness's own
      reported total is INVALID- the decomposition is wrong.
    - >-
      Any claimed discrete-logarithm solve whose certificate fails
      independent re-verification makes the run completed_invalid.
  success_criterion: >-
    The contract SUCCEEDS as a measurement when Stage 1 and Stage 2 gates
    pass and P1, P2, P3 and P4 each return a value with its seed spread over
    the full declared grid at every kappa, with the curve-free arm reported
    beside the curve arm and the infeasible-cell table emitted. Success is
    the production of those numbers, in either direction- a measured
    refutation of P1 or P3 is a successful run.
  falsification_criterion:
    - >-
      F1 (falsifies the hypothesis). Any measured cell in which the amortised
      charged index-calculus total is BELOW the measured multi-target rho
      total at the same T, same instances, same unit and any kappa. Claim A
      fails at the tested scale.
    - >-
      F2 (falsifies the hypothesis). Measured shared cost varying with B by
      more than 15 percent across the 16x range at fixed N under an
      exhaustive solver, with a consistent sign, at a majority of (N, m)
      cells. The cancellation identity is wrong.
    - >-
      F3 (falsifies the hypothesis). Measured shared cost below m!*N / 2 at
      any cell.
    - >-
      F4 (voids the run, does not falsify). Baseline exponent outside
      0.5 +/- 0.03, or the counter-response null failing. Infrastructure
      outcome under AGENTS.md rule 5.
    - >-
      F5 (scope finding, not a falsification). The curve-free arm reproduces
      every signature. Then the result is a statement about the cost frame
      and about preprocessed counting, NOT about elliptic curves, and every
      citation must say so.
  required_artifacts:
    - manifest.yaml with exact command, git commit, dirty-tree state, environment and dependency versions
    - raw-result.json with every per-cell, per-seed, per-arm counter value and its unit tag
    - the curve-free arm's measurements in the same file as the curve arm
    - the infeasible-cell table with parameters and refusal reason per refused cell
    - the Stage 0 symbolic residual table, required below 1e-12
    - the baseline arm's fitted exponent with its confidence interval
    - certificates for every claimed solve or relation, re-verified independently of the solver
    - sha256 of the factor base and instance list per cell
  interpretation_limits:
    - >-
      A COMPARATOR MEASUREMENT INSIDE A DECLARED COST MODEL. No lower bound
      on ECDLP, no attack, no exponent moved, no claim about any solver
      outside the power-of-candidate-count family.
    - >-
      TOY SIZES ONLY, and the 'for all T <= N' half of Claim A is NOT
      testable at reachable scale- it is a derivation, and this contract
      tests only its observable signature over the tested grid.
    - >-
      IF THE CURVE-FREE NULL REPRODUCES THE SIGNATURE, as predicted, the
      finding is about counting and not about curves. This limit is stated
      before the run precisely so that a confirmation cannot later be
      upgraded into an ECDLP statement.
    - >-
      Extension fields are the nearby-object control and are OUT OF SCOPE as
      a conclusion- the same inequality predicts amortisation helps there,
      and nothing measured here contradicts that.
    - >-
      The multi-target baseline shape is measured here, not cited; the only
      external pointer (Kuhn-Struik) is recalled and backs nothing.
  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      NOT APPROVED. This contract is DESIGNED under TASK-20260904-e87737 and
      carries no approval. Execution requires a separate Coordinator approval
      decision and a frozen contract at this path; a message from any agent
      is not an approval.
    - >-
      The parent hypothesis is proof-oriented and carries a proof_search_map;
      its Stage 0 symbolic audits are HARD GATES and run before any compute.
  id_allocation_provenance: >-
    EXP-ICEX-c32447 was pre-allocated by the tasking Coordinator session and
    supplied in TASK-20260904-e87737's constraints, verified free across the
    identifier union before use. This agent has no shell and allocated no
    identifier.
  yaml_parse_disclosure: >-
    Written by a Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrating session must run the
    strict parse and tools/validate_ledger.py before this contract is relied
    on.
