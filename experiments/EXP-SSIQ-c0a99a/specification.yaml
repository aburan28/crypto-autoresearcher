# contract for H-SSIQ-dfee7e: Arm I degree-thinning by representation
# multiplicity (IDEA-20260930-0d7c7d). Integer-only Python dual-route.
# ZERO RUNS in this design packet. Stages 0-1 authorized for executor
# TASK-20261003-8f17a2. No AUXIN. Amazon Bedrock prohibited. NO exponent.
# NO Magma/Sage success path. Arm II/III not authorized.
# =============================================================================
experiment:
  id: EXP-SSIQ-c0a99a
  hypothesis_id: H-SSIQ-dfee7e
  question_id: RQ-SSIQ-9702af
  source_idea: IDEA-20260930-0d7c7d
  goal_id: GOAL-SSIQ-001
  version: 1
  title: >-
    Arm I: measure k(d) and cover formula 1-(1-ρ²)^{k/2} on B-smooth
    integers at SQIsign-I/V, B=2^20
  status: approved
  approved_by: DEC-20261003-f31aec
  approved_at: '2026-10-03'
  frozen: true
  frozen_at: '2026-10-03'
  execution_authorized: true
  execution_authorized_stages: [0, 1]
  execution_authorized_note: >-
    Stages 0-1 authorized by DEC-20261003-f31aec under AGENTS.md standing
    user authorization (2026-09-06). No Magma/Sage/AUXIN/Bedrock. No
    Deuring sampler. No isogeny walk. No p^{1/4} claim. Arm II/III off.
  approval:
    approved_by: DEC-20261003-f31aec
    composing_decision: DEC-20261003-f31aec
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-1 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1]
    scientific_execution_authorized_note: >-
      Stage 0 freezes cells, formula, thresholds, k=2/14-prime/character
      fixtures and twin probes. Stage 1 runs Arm I + regression with twin
      meters; writes RESULTS.md with exactly one O-* label.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Decide whether the Arm I null-law median k at frozen SQIsign cells is
    representation-scale (≥80, G*≥4) or negligible (<8), with the cover
    formula holding; deliver exactly one O-* label from H-SSIQ-dfee7e.

  class: heuristic_validation
  class_note: >-
    Pre-registered cover formula and median-k bands on an integer instrument.
    Not an exponent-moving breakthrough; no isogeny attack table.

  scope:
    included:
      - >-
        Stage 0. Freeze preregistered-predictions.json (cells as a list with
        integer p,B), fixtures.json (k=2, 14-prime, character mod 5), twin
        probe.
      - >-
        Stage 1. Arm I n_samples_k=20000 at two cells; cover n=10000 × 50
        seeds; regression p=2^40-87, B=2^12; twin k; dual-hash vs formula;
        RESULTS.md with exactly one O-* label.
    excluded:
      - Arm II Deuring sampling of shortest-isogeny degrees.
      - Arm III end-to-end Algorithm 2 / isogeny walks.
      - Magma / Sage / cypari2 / AUXIN / Bedrock as success path.
      - Any p^{1/4} or exponent-moving claim.
      - Editing IDEA claim text or GOAL-SSIQ-001/goal.yaml.
      - Editing the frozen formula or median bands after Stage-0 freeze.
      - Treating infra failure as mathematical evidence.

  execution_surface:
    trial_plan: experiments/EXP-SSIQ-c0a99a/trial-plan.json
    command_stage0: >-
      python3 experiments/EXP-SSIQ-c0a99a/implementation/run.py --stage 0
      --trial-plan experiments/EXP-SSIQ-c0a99a/trial-plan.json
      --run-dir {run_dir}
    command_stage1: >-
      python3 experiments/EXP-SSIQ-c0a99a/implementation/run.py --stage 1
      --trial-plan experiments/EXP-SSIQ-c0a99a/trial-plan.json
      --run-dir {run_dir}
    note: >-
      Declared runnable surface so /run can admit this EXP via
      tools/experiment_execution.py load_plan. Twin meters are the
      dual-implementation control. {run_dir} substituted by supervisor.

  inputs:
    source_idea: ledger/proposals/IDEA-20260930-0d7c7d.yaml
    hypothesis: ledger/hypotheses/H-SSIQ-dfee7e.yaml
    p_i: 2261564242916331941866620800950935700259179388000792266395655937654553313279
    p_v: 88381546413195830490356121814345177109849335243162749316048866938595612502926212981848292492799412243073940471444121917248865926738905612439870244913151
    p_reg: 1099511627689
    B20: 1048576
    B12: 4096
    n_samples_k: 20000
    n_cover: 10000
    n_hash_seeds: 50
    n_regression: 400
    arm_seed: 2026100301
    hash_seed: 2026100302
    median_representation: 80
    median_negligible: 8
    rho_grid: [0.02, 0.05, 0.1, 0.2, 0.4, 0.8]
    stage1_cells:
      - {id: sqisign_i_b20, log2_B: 20}
      - {id: sqisign_v_b20, log2_B: 20}

  controls:
    - name: twin_k
      definition: meters.k_both path A == path B on every measured d.
    - name: ctl_k2_nearby
      definition: Two-prime d with k=2 reads P=ρ² (within 0.05) and G<1.
    - name: ctl_character
      definition: jacobi(·,5) thinning is the correlated null; not scored as independent.
    - name: ctl_fourteen_prime
      definition: Product of first 14 primes; twin k and formula must hold.
    - name: ctl_lemma34_k_ge_1
      definition: k(d)≥1 on every sampled B-smooth d else O-ARTIFACT.
    - name: ctl_regression_cell
      definition: p=2^40-87, B=2^12 constructive sampler runs (null-instrument check).
    - name: ctl_no_posthoc_formula_edit
      definition: Formula frozen in preregistered-predictions.json before Stage 1.
    - name: ctl_dual_hash
      definition: blake2b and sha256 cover sims each compared to the formula.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_arm_i_measure]
    - name: cell
      levels: [sqisign_i_b20, sqisign_v_b20, regression_p40_b12]
    - name: rho
      levels: [0.02, 0.05, 0.1, 0.2, 0.4, 0.8]

  metrics:
    primary:
      - name: median_k
        unit: count
        definition: Median of k(d) over Arm I samples per cell.
      - name: gstar
        unit: dimensionless
        definition: 1 / min_ρ mean_d[ρ / P_formula(k(d),ρ)]
      - name: h1_maxdev
        unit: dimensionless
        definition: max |P_emp - formula| over ρ-grid and dual hashes.
      - name: twin_agreement
        unit: boolean
        definition: k_a = k_b on every measured d.
    secondary:
      - name: p10_k
        unit: count
      - name: p90_k
        unit: count
      - name: n_k
        unit: count
      - name: wall_clock_seconds
        unit: seconds
      - name: peak_rss_bytes
        unit: bytes

  heuristic_under_test: HEUR-SSIQ-0d7c7d-H1

  preregistered_prediction:
    quantity: >-
      P(cover|d,ρ)=1-(1-ρ²)^{k/2}; median-k bands 80 vs 8 on Arm I cells.
    formula: 'P_cover = 1 - (1 - rho^2)^{k/2}'
    source: >-
      IDEA-20260930-0d7c7d claim (B) and H1; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: crypto
    justification: >-
      Arm I samples integers of size (p/2)^{1/3} at SQIsign-I/V primes.
      This is the NULL law at cryptographic size, not Deuring-sampled
      shortest isogenies (Arm II, unauthorized). Transfer of median k to
      genuine degrees is H2 and is not claimed decided here.
    correspondence: >-
      Integer null at the same (p,B,X) as the source's section 4.2 cells.

  tail_checks:
    - Twin disagreement voids k claims (O-ARTIFACT).
    - k=2 control failure voids the table (O-ARTIFACT).
    - H1 maxdev ≥ 0.1 falsifies H1 (O-ARTIFACT).
    - k<1 on a sampled smooth d voids the table.

  seeds_and_replication:
    arm_seed: 2026100301
    hash_seed: 2026100302
    n_hash_seeds: 50
    independent_instances: 2
    note: >-
      Cells sqisign_i_b20 and sqisign_v_b20 are independent instances.
      Twin divisor paths plus dual hashes are the replication instrument.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 4.0
    maximum_memory_gb: 2
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and fixtures.json.
    - Stage 1 complete with panels/control-table/RESULTS.md, OR named O-ARTIFACT / O-IMPEDIMENT stop.
    - RESULTS.md names exactly one O-* label from H-SSIQ-dfee7e.
    - maximum_runs = 4.
    - Do not open Arm II/III under this card.

  invalidation_rules:
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Twin failure → O-ARTIFACT; do not read median k as support.
    - Claiming an exponent move / p^{1/4} → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence.
    - Running Deuring/isogeny-walk code as the success path → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen with twin_ok true on k=2 and 14-prime fixtures;
    Stage 1 produces per-cell median k, G*, H1 maxdev (or a named
    O-ARTIFACT/O-IMPEDIMENT/O-INCONCLUSIVE stop); RESULTS.md names exactly
    one O-* label from H-SSIQ-dfee7e with cited artifacts.

  falsification_criterion: >-
    Any of: twin disagreement; post-hoc formula edit; k=2 control fail;
    H1 maxdev>0.1; a claimed exponent under this card. (O-NEGLIGIBLE and
    O-MIXED are valid scientific negatives of O-REPRESENTATION, not
    protocol fails.)

  required_artifacts:
    - experiments/EXP-SSIQ-c0a99a/trial-plan.json
    - experiments/EXP-SSIQ-c0a99a/stage0/preregistered-predictions.json
    - experiments/EXP-SSIQ-c0a99a/stage0/fixtures.json
    - experiments/EXP-SSIQ-c0a99a/stage1/
    - experiments/EXP-SSIQ-c0a99a/RESULTS.md
    - experiments/EXP-SSIQ-c0a99a/runs/<RUN-SSIQ-*>/
    - experiments/EXP-SSIQ-c0a99a/implementation/run.py
    - experiments/EXP-SSIQ-c0a99a/implementation/check.py

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
