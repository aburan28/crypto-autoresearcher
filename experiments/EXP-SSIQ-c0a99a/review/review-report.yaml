    wall_clock_seconds: 590.9091436862946
    panels_summary_equals_archived_raw: true
    repo_stage_files_rewritten: false
  joints:
    - joint: J1 validity
      verdict: holds
      finding: >-
        Two runs, both manifest.yaml present, both receipts
        output_validated, both check.stdout.log OK with check return 0.
        Stage 0 raw and stdout are O-STAGE0-OK. Stage 1 raw, stdout, and
        RESULTS.md are O-ARTIFACT. RESULTS.md carries exactly one O-*
        label. Certificate kind is none on both runs. claims.break and
        claims.exponent_move are false on both runs.
    - joint: J2 flag order
      verdict: holds
      finding: >-
        Max |p-formula| on archived k=2 rows is 0.055 at rho 0.4 path A,
        above 0.05, and it is the only excess. Flag list equals
        ['k2_cover_not_rho_squared']. run_stage1 sets outcome O-ARTIFACT
        when artifact_flags is nonempty, before the median-band branch.
        That branch cannot emit O-REPRESENTATION while the flag is set.
        The formula column matches the blind rho^2 values.
    - joint: J3 band quarantine
      verdict: holds
      finding: >-
        Archived sqisign_v_b20 median_k 180 and gstar about 5.908 meet
        median>=80 and gstar>=4, and h1_maxdev about 0.310 is above 0.02.
        The artifact label discards the median figures, including 180.
        Replay outcome is O-ARTIFACT with artifact_flags exactly
        ['k2_cover_not_rho_squared']. The decision does not keep median
        180 as a representation result.
  proves_too_much:
    - >-
      The sentence that sqisign_v_b20 median_k 180 is O-REPRESENTATION
      does not go through: the flag is set before the median branch, and
      h1_maxdev about 0.310 is above 0.02.
    - >-
      The sentence that this Arm I package moves the Wesolowski memory
      exponent does not go through: no isogeny walk ran, and
      claims.exponent_move is false.
    - >-
      The k=2 formula column matches rho squared, so the control that
      flagged the simulation is the identity named in the plan.
  prior_relation: >-
    The pre-written prior expected O-ARTIFACT, this single flag, max
    deviation above 0.05 only at rho 0.4 path A, formula column equal to
    rho squared, and decision inconclusive. The review found that
    reading. The prior was not rewritten.
