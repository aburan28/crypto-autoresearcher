    location: /tmp/review-ssiq-c0a99a
    command: >-
      python3 /tmp/review-ssiq-c0a99a/implementation/run.py --stage 1
      --trial-plan /tmp/review-ssiq-c0a99a/trial-plan.json
      --run-dir /tmp/review-ssiq-c0a99a-rundir
    exit_code: 0
