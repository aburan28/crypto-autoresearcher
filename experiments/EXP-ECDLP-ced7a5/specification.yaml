# =============================================================================
# EXP-ECDLP-ced7a5 — version 1, not approved. Specified from
# IDEA-20261006-bc1250 / H-ECDLP-67fc66. Status is review_required.
# check_approval_capacity rejects an approving decision:
# GOAL-ECDLP-001 already holds 7 approved contracts with no run
# (cap 3): EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc, EXP-ECDLP-b2e5d1,
# EXP-ECDLP-c74a83, EXP-LHW-22aefa, EXP-SEMAEV-a097b5, EXP-SMTH-9d04ba.
# The contract is also not runnable: the missing driver is a program
# that enumerates y^2 = x^3 + x + 6 over F_73, histograms the tangent
# slope λ = (3x^2+1)/(2y), and compares that histogram with the
# degree-4 root counter. A search of origin/main for the phrases
# "maximum fiber" and "fiber cardinality" under *.py returned no path.
# experiments/EXP-ECDLP-895a0f/implementation/stage0_dblslp.py computes
# one doubling slope on a single F_19 point and says not to run a
# unary-closure census. A trial plan requires status approved.
# Success is the source idea's prediction: the maximum fiber equals 4.
# The concrete negative is that every fiber has size at most 3.
# This session did not count a fiber.
# Source idea bytes are blob
# 9203067c9a9fc4e1061af6161d6694382994f91e.
# =============================================================================
experiment:
  id: EXP-ECDLP-ced7a5
  hypothesis_id: H-ECDLP-67fc66
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  source_idea: IDEA-20261006-bc1250
  version: 1
  title: >-
    Maximum tangent-slope fiber on one pinned Weierstrass chart
  status: review_required
  approved_by: null
  designed_at: '2026-10-07'
  frozen: false
  execution_authorized: false
  packaging_only: false
  approval:
    approved_by: null
    composing_decision: DEC-20261007-e6a276
    withheld_reason: >-
      check_approval_capacity rejects an approval of this contract.
      python3 tools/portfolio_kpis.py --capacity GOAL-ECDLP-001
      reports approved_unrun=7 against cap 3, headroom 0. The seven
      contracts are EXP-ECDLP-08f99d, EXP-ECDLP-96c4dc,
      EXP-ECDLP-b2e5d1, EXP-ECDLP-c74a83, EXP-LHW-22aefa,
      EXP-SEMAEV-a097b5, and EXP-SMTH-9d04ba. This decision does not
      retire one of them. The launcher is also missing. There is no
      committed program that enumerates the affine points of
      y^2 = x^3 + x + 6 over F_73, computes
      λ = (3x^2 + 1)/(2y) for y ≠ 0, reports the maximum fiber
      cardinality, counts the F_73-roots of
      (3x^2 + 1)^2 - 4λ^2 (x^3 + x + 6) for each attained λ, checks
      λ(-P) = -λ(P) before the histogram, and reruns the count after
      the frozen Möbius map (x+1)/(x+2). A search of origin/main for
      the phrases "maximum fiber" and "fiber cardinality" under *.py
      returned no path. The doubling helper
      experiments/EXP-ECDLP-895a0f/implementation/stage0_dblslp.py
      evaluates one slope on one F_19 point. A trial plan requires
      status approved, which this capacity check refuses. This
      session did not count a fiber.
    implementation_authorized: false
    scientific_execution_authorized: false
    scientific_execution_scope: >-
      When a later approval both frees a capacity slot and adds the
      missing fiber-census driver, work only on
      y^2 = x^3 + x + 6 over F_73. Do not transfer a fiber count to
      another curve or to cryptographic size.
    frozen: false
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false
      applied: false

  objective: >-
    Decide whether the maximum fiber of λ on this pinned curve equals
    4. The concrete negative is that every attained slope has at most
    3 preimages. No faster discrete-logarithm algorithm is in scope.

  inputs:
    curve: >-
      E: y^2 = x^3 + x + 6 over F_73. Discriminant
      -16(4·1^3 + 27·6^2) = -16·976 ≠ 0.
    domain: >-
      Affine points with y ≠ 0. The point at infinity and the points
      with y = 0 are outside the domain and are not a fiber of a
      finite slope.
    slope: >-
      λ(P) = (3x(P)^2 + 1)/(2y(P)).
    root_counter: >-
      For each attained λ, the roots in F_73 of
      (3x^2 + 1)^2 - 4λ^2 (x^3 + x + 6).
    enumerations: >-
      Enumeration A scans x from 0 through 72 and takes both square
      roots of the cubic when it is a square. Enumeration B scans x
      from 72 down through 0 and takes square roots by Tonelli-Shanks
      with the fixed nonresidue 5, which has Legendre symbol -1
      modulo 73. The two point sets must agree.
    moebius: >-
      One frozen map μ(x) = (x+1)/(x+2). Points with x = 71 are
      excluded from this arm and counted. The reparametrised value
      is λ(P)·(x(P)+2)^2. This arm does not decide the pinned-chart
      row.
    random_polynomials: >-
      200 monic degree-4 polynomials over F_73, drawn from a fixed
      seed label. Their root counts are not slope fibers.

  controls:
    - id: sign-relation
      statement: >-
        λ(-P) = -λ(P) holds for every point in the domain, checked
        before the histogram is read. A single failure voids the run.
    - id: two-enumerations
      statement: >-
        Enumeration A and enumeration B produce the same set of
        domain points and the same maximum fiber. A disagreement
        voids the run.
    - id: root-agreement
      statement: >-
        For every attained λ, the number of domain points with that
        slope equals the number of distinct x-roots of the degree-4
        slope polynomial that lie on E with y ≠ 0. A disagreement
        voids the run and is not evidence against the degree.
    - id: random-polynomials
      statement: >-
        The 200 random monic degree-4 polynomials are not entered as
        slope fibers. Entering one voids the run.
    - id: vertical-tangents
      statement: >-
        Points with y = 0 are excluded. Folding one into a fiber
        voids the run.
    - id: moebius-arm
      statement: >-
        The frozen map μ is recorded as a side classification. It
        does not change the pinned-chart row.

  independent_variables:
    - whether the arm is the pinned chart or the frozen Möbius chart
    - which of the two enumerations
    - which attained slope

  metrics:
    primary:
      - id: maximum_fiber
        statement: >-
          The maximum number of affine points of E(F_73) with y ≠ 0
          and a common tangent slope. The idea's prediction is that
          this maximum equals 4. The concrete negative is that every
          fiber has size at most 3.
    secondary:
      - id: slopes_of_size_4
        statement: the number of slopes with fiber size 4
      - id: domain_points
        statement: the number of domain points
      - id: agreement_bit
        statement: >-
          1 when the point histogram and the univariate root count
          agree on every attained slope, otherwise 0
      - id: moebius_maximum_fiber
        statement: >-
          The maximum fiber of λ·(x+2)^2 on the points with x ≠ 71

  heuristic_under_test: HEUR-1
  heuristic_under_test_note: >-
    HEUR-1 says this slope family hits four distinct roots at least
    once. It is the same sentence as the primary metric on this one
    curve. A histogram that disagrees with the root counter fails
    the instrument and does not by itself replace the fiber test.

  preregistered_prediction:
    quantity: >-
      The maximum fiber cardinality of λ on the pinned curve.
    formula: >-
      maximum_fiber = 4. The concrete negative is maximum_fiber ≤ 3
      after the sign relation, the two enumerations, and the root
      agreement all hold. Source idea IDEA-20261006-bc1250,
      predictions minimum_effect: the maximum equals 4, at least 1
      above every fiber having size at most 3. No fiber was counted
      before this formula was written.
    source: >-
      IDEA-20261006-bc1250. KR-RHO-13bf67, KR-RHO-fb88e6,
      KR-RHO-fbd582, and KR-RHO-0528e7 were opened in this session.
      They do not state this fiber cardinality.

  scale_relevance:
    tier: toy
    justification: >-
      The field is F_73. No transfer to another prime or to
      cryptographic size is assumed. The minimum effect is the
      idea's own: a maximum of 4 against a miss at 3 or below.
    correspondence: >-
      Direct enumeration of the affine points. No Deuring
      correspondence is used.

  tail_checks:
    - >-
      A maximum of 4 meets the prediction. A maximum of at most 3,
      with the instrument checks passed, is the negative. A count of
      5 or more contradicts the degree and is not the negative.
    - >-
      The smoothest comparison available at this scale is a slope
      whose polynomial has four distinct roots. That event is the
      success row, not a separate tail threshold.

  replication:
    seeds:
      - EXP-ECDLP-ced7a5|enumeration-A|deterministic
      - EXP-ECDLP-ced7a5|enumeration-B|tonelli-nonresidue-5
      - EXP-ECDLP-ced7a5|moebius|(x+1)/(x+2)
      - EXP-ECDLP-ced7a5|random-polynomials|200
    independent_instances: 1
    note: >-
      One later manifest would cover both enumerations, the root
      comparison, the Möbius arm, and the 200 polynomials. No run id
      is minted in this session. The replication plan does not name
      a future run slot, because the trial plan is not frozen while
      status is review_required.

  budget:
    enforcement: advisory
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    budget_note: >-
      One later manifest would cover the frozen census. Wall-clock
      and CPU figures are not set. The 1 GB figure is machine
      protection for a field of 73 elements. A watchdog expiry is
      failed_infrastructure, not a fiber count.

  stopping_rules:
    - Stop after one reading row is named from the pinned-chart maximum.
    - Do not change the thresholds 4 and 3 after seeing a count.
    - Do not enumerate a second curve in this contract.
    - A timeout or crash voids the run. It does not fill the negative row.

  invalidation_rules:
    - A timeout, crash, or memory abort is failed_infrastructure, never a mathematical negative.
    - A failed sign relation, disagreeing enumerations, a histogram that disagrees with the root counter, a random polynomial entered as a slope fiber, or a y = 0 point folded into a fiber voids the run.
    - A maximum of 5 or more contradicts the degree-4 bound and voids the run. It is not the negative.
    - Transferring the count to another curve or to cryptographic size voids the run.

  success_criterion: >-
    The instrument checks pass and the maximum fiber cardinality of
    λ on the pinned curve equals 4. That equality is the prediction
    of IDEA-20261006-bc1250. The conjunction is reachable as a
    failure when the instrument checks pass and every fiber has size
    at most 3.

  falsification_criterion: >-
    The instrument checks pass and every tangent slope attained on
    E(F_73) has at most 3 preimages. That is the concrete negative.
    A maximum of 5 or more is a degree contradiction and is not this
    sentence. A failed sign relation, a disagreement of the two
    enumerations, or a disagreement with the root counter is not
    this sentence.

  decision_impact:
    on_positive: >-
      A later evidence review may record that the pinned chart
      attains fiber cardinality 4, with the instrument checks
      passed. The rho exponent stays 1/2. No knowledge entry is
      promoted from this design record.
    on_negative: >-
      A later evidence review may record that every attained slope
      has at most 3 preimages, with the instrument checks passed, so
      the claim is falsified on (A, B, p) = (1, 6, 73) only. The rho
      exponent stays 1/2. The two outcomes name different fiber
      cardinalities.

  required_artifacts:
    - experiments/EXP-ECDLP-ced7a5/runs/RUN-*/manifest.yaml
    - experiments/EXP-ECDLP-ced7a5/runs/RUN-*/raw-result.json
    - experiments/EXP-ECDLP-ced7a5/runs/RUN-*/reading.yaml

  assigned_to: executor

  reading_rows:
    - id: instrument_failure
      when: >-
        the sign relation fails, the two enumerations disagree, the
        histogram disagrees with the root counter, a random
        polynomial is entered as a slope fiber, or a point with y = 0
        is folded into a fiber
    - id: infrastructure
      when: the process aborts for memory or the process times out
    - id: degree_contradiction
      when: >-
        the other instrument checks pass and the maximum fiber is 5
        or more
    - id: fiber_at_most_3
      when: >-
        the instrument checks pass and every attained slope has at
        most 3 preimages
    - id: fiber_equals_4
      when: >-
        the instrument checks pass and the maximum fiber equals 4
  reading_rule: >-
    Name exactly one row. fiber_equals_4 is the only success row.
    fiber_at_most_3 is the concrete negative.
    degree_contradiction, instrument_failure, and infrastructure are
    not fiber cardinalities of the claim. Record the maximum, the
    number of slopes of size 4, the domain size, the agreement bit,
    and the Möbius maximum beside the row. The Möbius maximum does
    not change the row. attack_claimed is false.
