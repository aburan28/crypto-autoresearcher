experiment:
  id: EXP-ECDLP-661f07
  hypothesis_id: H-ECDLP-a80990
  question_id: RQ-SIG-001
  version: 1
  status: draft
  approved_by: null
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Is the SIG cascade statistic a curve fact or a presentation fact - three
    ideal-preserving presentations, a blocking degeneracy gate, a swept planted
    syzygy, and a curve-free matched-shape arm

  objective: >-
    If separately approved, authorized and executed, measure whether the SIG
    lane s syzygy cascade statistic moves under randomised invertible changes of
    generating set that PROVABLY preserve the ideal, by more than a matched
    curve-free random system moves under the identical operation. The upstream
    deliverable is a declaration of whether the statistic, as implemented, is
    even capable of moving - because if it is computed from a minimal free
    resolution it is an invariant, every null here has width zero, and the
    experiment can never fire.

  what_this_is_not:
    - Not an exploitability test. Survival is necessary and nowhere near sufficient.
    - Not a measurement at D at or above 6, which is where the lane's live question sits and which this contract cannot reach.
    - Not a discrete-logarithm computation, relation collection, or any ECDLP attack.
    - Not a status change to H-SIG-001, GOAL-SIG-001 or any other record.
    - Not approval, freezing, execution authorization, a run, an observed output, or evidence.

  claim_ceiling: >-
    Tier TOY, unraisable by any downstream citation. The exact scope a completed
    run could support is - at the tested curves and at D in {3, 4}, under one
    solver and one monomial-order convention, the lane s cascade statistic does
    or does not move under three specific ideal-preserving re-presentations by
    more than a matched curve-free system does. It cannot support a statement
    about exploitability, about higher degrees, or about other curve families.

  falsifiable_prediction: >-
    PRE-REGISTERED BEFORE EXECUTION AND NEVER TUNED TO THE DATA.
    (1) Stage 0 declares the statistic presentation-dependent; if it declares it
    a minimal-free-resolution invariant, the run STOPS and that is the result.
    (2) All three presentations generate one ideal, proved by reduced Groebner
    basis comparison.
    (3) The statistic is bit-identical under generator permutation, spread
    exactly 0.
    (4) A planted syzygy of multiplicity r raises the statistic monotonically in
    r and matches the predicted rise at every r in the sweep.
    (5) DISSOLUTION is declared if the movement under randomised basis change
    exceeds the maximum of the permutation spread and the curve-free arm s
    movement, on at least 3 of 5 curves; SURVIVAL if the movement is within the
    permutation spread on at least 4 of 5; otherwise INCONCLUSIVE.

  measured_quantities:
    - name: cascade_statistic
      definition: >-
        The lane s declared cascade statistic evaluated at degree D on a given
        presentation of the decomposition ideal - a count of syzygy generators at
        that degree under the presentation actually supplied.
      units: syzygy generators (dimensionless integer count)
    - name: reduced_gb_hash
      definition: >-
        A hash of the reduced Groebner basis of each presentation under a fixed
        model-independent monomial order, used only for ideal-equality proof.
      units: hex digest (categorical)
    - name: generator_degree_profile
      definition: >-
        The multiset of generator degrees of each presentation.
      units: degrees (integer multiset)
    - name: permutation_spread
      definition: >-
        max minus min of the cascade statistic over the declared permutations of
        the standard generating set, per curve.
      units: syzygy generators (integer)
    - name: presentation_movement
      definition: >-
        Absolute difference of the cascade statistic between the standard
        presentation and each other presentation, paired per curve.
      units: syzygy generators (integer)
    - name: planted_rise
      definition: >-
        Measured increase in the cascade statistic after planting a syzygy of
        known multiplicity r, against the pre-computed predicted increase.
      units: syzygy generators (integer)

  metrics:
    primary: [cascade_statistic, presentation_movement, permutation_spread, planted_rise]
    secondary: [reduced_gb_hash, generator_degree_profile]

  null_and_control_objects:
    - id: GATE-DEGENERACY
      name: Stage 0 statistic-provenance declaration
      construction: >-
        Read the implementation of the cascade statistic and declare, with the
        code path cited, whether it is computed from the SUPPLIED PRESENTATION S
        syzygy module or from the ideal s MINIMAL FREE RESOLUTION.
      forced_value: none - it is a declaration, and either answer is admissible
      non_vacuity: >-
        THIS GATE EXISTS BECAUSE A NULL THAT CANNOT DIFFER FROM THE TREATMENT
        TEACHES NOTHING. If the statistic is a resolution invariant, the
        permutation null, the basis-change treatment and the curve-free arm all
        return the same number by construction, the discriminator has width
        exactly zero, and no amount of compute can make the experiment fire. The
        run STOPS at that declaration and reports it as the finding.
    - id: NULL-IDEALEQ
      name: reduced Groebner basis ideal-equality check, blocking
      construction: >-
        For every pair of the three presentations, compute reduced Groebner bases
        under one fixed monomial order and compare them exactly.
      forced_value: identical reduced bases for every pair
      non_vacuity: >-
        Genuinely capable of failing - a randomised basis change implemented with
        a non-invertible transformation, or one that drops a generator, produces
        a different ideal, and that is the easiest way to manufacture a spurious
        dissolution.
    - id: NULL-PERM
      name: generator permutation
      construction: >-
        At least 5 permutations of the standard generating set per curve.
      forced_value: spread exactly 0
      non_vacuity: >-
        Forced-value calibration, and its failure is real - a statistic that
        depends on generator ORDER rather than on the generating SET is a defect
        that this null and only this null exposes. If Stage 0 declared the
        statistic a resolution invariant, this null is a tautology and the run
        has already stopped.
    - id: PLANT-SYZ
      name: swept planted syzygy in a curve-free random system
      construction: >-
        Into a matched-shape random system, inject a generator that is an
        explicit combination of r existing generators, r swept over {1, 2, 4, 8},
        with the predicted increase in the statistic computed before the run.
      forced_value: >-
        Measured rise matches the predicted rise at every r, within the
        permutation spread, and is monotone in r.
      non_vacuity: >-
        THIS IS THE DEMONSTRATED-DYNAMIC-RANGE CONTROL. An instrument that fires
        on one planted defect has shown only that it detects presence; sweeping r
        forces it to track SIZE. Without it, a report that the cascade did not
        move is a report from an instrument never shown able to see a move.
    - id: NULL-CURVEFREE
      name: matched-shape curve-free random system under the identical three re-presentations
      construction: >-
        A random system over the same field with the same variable count, degree
        sequence and sparsity as the Semaev decomposition system, with no
        elliptic curve anywhere, put through the identical presentation
        constructor, the identical equality checker and the identical statistic.
      forced_value: none - the arm is a scope gate and a movement bound
      non_vacuity: >-
        It produces its own movement distribution with nonzero spread and can
        agree with or differ from the Semaev arm; both outcomes are informative.
      consequence_pre_declared: >-
        IF THE CURVE-FREE ARM REPRODUCES THE SEMAEV ARM S MOVEMENT SIGNATURE
        WITHIN ITS SPREAD, THE FINDING IS ABOUT SYZYGIES OF SYSTEMS OF THAT SHAPE
        AND NOTHING FROM THIS EXPERIMENT MAY BE QUOTED AS A STATEMENT ABOUT
        ELLIPTIC CURVES OR THE ECDLP. Written before execution so it cannot be
        reframed afterwards.

  scope_gate: >-
    See NULL-CURVEFREE consequence_pre_declared. The gate is evaluated and
    reported BEFORE the Semaev arm is interpreted, and its verdict is printed on
    the face of every quoted number.

  independent_variables: [curve, presentation, degree, permutation_index, planted_multiplicity, arm]

  preregistered_prediction:
    quantity: >-
      Paired per-curve presentation_movement of the cascade statistic, against
      the maximum of permutation_spread and the curve-free arm s movement.
    formula: >-
      DISSOLUTION if movement exceeds max(permutation_spread, curve_free_movement)
      on at least 3 of 5 curves. SURVIVAL if movement is within
      permutation_spread on at least 4 of 5. Otherwise INCONCLUSIVE.
    source: ledger/hypotheses/H-ECDLP-a80990.yaml predictions P1 through P6
    values_frozen_here:
      permutation_spread_required: exactly 0
      ideal_equality_required: exact reduced basis match for every pair
      planted_sweep: [1, 2, 4, 8]
      dissolution_threshold_curves: 3 of 5
      survival_threshold_curves: 4 of 5
      degrees: [3, 4]

  decision_rule_that_falsifies: >-
    THE RECORD IS FALSIFIED, and its central claim rejected in scope, IF the
    cascade SURVIVES every re-presentation within the permutation spread on at
    least 4 of 5 curves, with every control passing. The statistic is then
    ideal-level structure at the tested degrees.
    THE RECORD IS SUPPORTED IN SCOPE IF the cascade dissolves on at least 3 of 5
    curves beyond the curve-free arm s movement, with every control passing.
    THE RUN IS INVALID, and no verdict of either kind may be reported, if Stage 0
    declares the statistic a resolution invariant, if any presentation pair fails
    ideal equality, if the permutation spread is nonzero, or if the planted sweep
    does not track r.

  stages:
    - id: S0
      name: statistic provenance declaration
      terminates_run: true
      description: >-
        Read the statistic s implementation and declare which object it computes,
        citing the code path. If it is the minimal free resolution, the run ENDS
        with that declaration as its reported result and no curve is drawn.
    - id: S1
      name: presentation construction and ideal equality
      terminates_run: true
      description: >-
        Build the three presentations per curve, record degree profiles, and
        prove pairwise ideal equality by reduced Groebner basis comparison. A
        failure voids every comparison on that curve.
    - id: S2
      name: permutation calibration
      terminates_run: true
      description: >-
        NULL-PERM at every declared permutation. Nonzero spread ENDS the run and
        the lane s existing cascade numbers are reported as suspect.
    - id: S3
      name: planted syzygy sweep
      terminates_run: true
      description: >-
        PLANT-SYZ at every r. Failure to track r ENDS the run; no negative may be
        reported from an instrument with no demonstrated dynamic range.
    - id: S4
      name: curve-free arm
      terminates_run: false
      description: >-
        The identical three re-presentations on matched-shape random systems. Its
        movement distribution is computed and the scope gate evaluated BEFORE the
        Semaev movements are read.
    - id: S5
      name: Semaev arm and verdict
      terminates_run: false
      description: >-
        Paired per-curve movement under each presentation, then the frozen
        decision rule, with the scope-gate verdict on the face of the result.

  replication:
    seeds: [0, 1, 2, 3, 4]
    independent_instances: 5
    seeds_per_cell: 5
    seeds_policy: >-
      Every object is addressed by (arm, curve_index, presentation_label,
      permutation_index, planted_multiplicity, replicate) and its seed is derived
      deterministically as a SHA-256 over the ASCII bytes of the domain string,
      those fields in that order, and the declared master seed, reduced to 64
      bits. The domain string is EXP-ECDLP-661f07/v1. The randomised basis change
      and the curve-free system generator both draw from that derived stream, so
      a third party reproduces every presentation bit-for-bit from the tuple. The
      master seed is fixed in the frozen contract before any execution and is
      never re-drawn.
    determinism_requirement: >-
      Re-running any tuple must reproduce the identical reduced Groebner basis
      hash and the identical cascade statistic. Any cell failing this is INVALID.

  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 80
    maximum_memory_gb: 8
    maximum_runs: 200
    maximum_workers: 1
    note: >-
      Sized to the work. The reduced-basis equality checks are expected to
      dominate and may cost more than the cascade measurement itself, which is
      the practical reason this test has not previously been run.

  stopping_rules:
    - S0 declares the statistic a minimal-free-resolution invariant -> STOP, report the degenerate-null finding, draw no curve.
    - Any presentation pair fails reduced-basis equality -> that curve is VOID; more than 2 void curves ends the run.
    - NULL-PERM spread is nonzero -> STOP, report the statistic as order-dependent, no other arm reported.
    - PLANT-SYZ does not track r -> STOP, no demonstrated dynamic range, no negative reportable.
    - Per-run wall clock or memory ceiling exhausted at a cell -> STOP that cell, report failed_infrastructure with coverage reached.

  invalidation_rules:
    - Any movement compared across presentations not proved to generate the same ideal is invalid.
    - Any movement reported without the permutation spread reported first is invalid.
    - Any movement reported without the paired curve-free movement alongside it is invalid.
    - Any comparison whose presentations differ in monomial-order convention is invalid.
    - Any statement about exploitability, about D at or above 6, or about cryptographic scale drawn from this contract is invalid on its face.

  success_criterion: >-
    ALL of - (a) S0 declares the statistic presentation-dependent; (b) every
    presentation pair proves ideal equality on at least 4 curves; (c) the
    permutation spread is exactly 0 on every curve; (d) the planted sweep tracks
    r at every r; (e) the curve-free arm completes and the scope gate is
    evaluated; (f) the frozen decision rule is applied and a verdict of
    DISSOLUTION, SURVIVAL or INCONCLUSIVE is assigned, with degree profiles
    reported per presentation. Reaching INCONCLUSIVE is a SUCCESSFUL run; only
    failing (a) through (e) is an unsuccessful one.

  falsification_criterion: >-
    SURVIVAL of the cascade within the permutation spread on at least 4 of 5
    curves, with every control passing. H-ECDLP-a80990 s central claim is then
    rejected in the tested scope and the statistic is ideal-level structure at
    D in {3, 4}. Secondary falsifiers of the DESIGN rather than the hypothesis -
    a resolution-invariant statistic, an ideal-equality failure, a nonzero
    permutation spread, a planted sweep that does not track r, or a curve-free
    arm that reproduces the signature. In every case the failing stage, curve and
    presentation are named, and forward guidance names the next object - the
    graded Betti numbers of the minimal free resolution where computable, or the
    higher-degree measurement this contract cannot reach.

  required_artifacts:
    - results.json with the cascade statistic per (arm, curve, presentation, permutation, replicate)
    - reduced Groebner basis hashes and the pairwise ideal-equality verdict per curve
    - generator degree profile per presentation
    - permutation spread per curve, reported before any movement
    - planted-sweep predicted and measured rises at every multiplicity
    - the curve-free arm's full movement distribution and the scope-gate verdict
    - identification of which operation dissolved the cascade, where it dissolved
    - exact commands, git commit, dirty-tree state, environment and dependency versions
    - peak resident memory, wall clock and CPU time per cell
    - stdout and stderr

  scale_relevance:
    tier: toy
    justification: >-
      D in {3, 4} on a small curve panel. The lane s live question is at D at or
      above 6 and is not reachable here; nothing transfers upward.
    correspondence: null

  limitations:
    - >-
      Scoped to the tested curves, D in {3, 4}, three specific presentations, one
      solver and one monomial-order convention.
    - >-
      Tests WELL-DEFINEDNESS, not exploitability. A survival result may not be
      described as evidence that the cascade is usable.
    - >-
      NOT TESTABLE AT REACHABLE SCALE, STATED PLAINLY RATHER THAN SILENTLY
      SHRUNK - the lane s live question is the cascade s behaviour at D at or
      above 6, and this contract cannot reach those degrees within any budget it
      can be given. A verdict at D in {3, 4} does not transfer upward and the
      higher-degree question stays open.
    - >-
      A dissolution closes exploitability for the tested presentations only,
      although a dissolution under a mere basis change is strong evidence about
      the statistic itself.
    - >-
      A randomised basis change raises generator degrees, so a movement may be a
      degree effect rather than a structural one; degree profiles are reported
      per presentation precisely so a reader can tell.
    - >-
      Changes no record's status.

  infrastructure_failure_disposition: >-
    A timeout, crash, out-of-memory or missing dependency is INFRASTRUCTURE
    SIGNAL, recorded as failed_infrastructure with its cause and coverage. It is
    NEVER negative mathematical evidence and never counts toward the
    falsification criterion (AGENTS.md core rule 5).

  assigned_to: executor

  authorization_note: >-
    This contract is status draft, is not frozen, and carries approved_by null.
    Only the Coordinator may approve, freeze or authorize execution (AGENTS.md
    rule 1). Written under TASK-20260904-c0edda, which is DESIGN ONLY. It
    supersedes no contract, edits no record and alters no goal.
