# FROZEN CONTRACT. Per GD-4 (ledger/goals/GOAL-SSIQ-001/goal.yaml), this draft
# went to a Red Team pre-freeze review BEFORE any data was touched
# (coordination/goals/GOAL-SSIQ-001/batches/BATCH-003/reviews/RT-PREFREEZE-EXP-SSIQ-58b642.md,
# verdict FREEZE-WITH-FIXES), returning seven BLOCKING findings, PF-1 through
# PF-7. Six were applied directly (PF-1,2,3,4,6,7). PF-5 (the degenerate-vertex
# convention) went to a bounded, zero-compute research task rather than a
# Coordinator-asserted numeric table, per AGENTS.md rule 9
# (coordination/goals/GOAL-SSIQ-001/batches/BATCH-003/tasks/PF5-research/pf5_degenerate_vertex_convention.md).
# That task found the foundational Pizer/CGL construction this contract's own
# convention descends from does NOT solve the general multiplicity case
# either -- it restricts to p = 1 (mod 12) specifically to avoid it. PF-5 is
# RESOLVED BY NARROWING THE CONFIRMATORY PRIME SET to that same regime (see
# inputs.primes.pf5_resolution for the full citation and reasoning), not by
# asserting a number the literature itself does not provide. Every prediction,
# tolerance, window, estimator and failure consequence below was fixed before
# any real graph was built.
experiment:
  id: EXP-SSIQ-58b642
  hypothesis_id: H-SSIQ-18dc91
  version: 1
  title: >-
    Greedy delta_E descent versus random-walk hitting time on directly-built
    supersingular 2-isogeny graphs (REC-3, the direct test of lever L4)
  status: approved
  approved_by: coordinator
  pre_freeze_review:
    report: coordination/goals/GOAL-SSIQ-001/batches/BATCH-003/reviews/RT-PREFREEZE-EXP-SSIQ-58b642.md
    verdict: FREEZE-WITH-FIXES
    findings_applied: [PF-1, PF-2, PF-3, PF-4, PF-6, PF-7]
    findings_resolved_by_scope_narrowing: [PF-5]
    pf5_research_task: coordination/goals/GOAL-SSIQ-001/batches/BATCH-003/tasks/PF5-research/pf5_degenerate_vertex_convention.md
    pf5_narrowing_note: >-
      The research task itself was NOT authorized to choose between its two
      named options (commission a Velu-formula run-time computation, vs.
      accept the STOP-fallback as intended behaviour for the forced p=11 mod
      12 case). The Coordinator chose neither literally: narrowing the
      confirmatory prime set to p = 1 (mod 12) removes the forcing rule that
      created the problem (the original PF-3 fix's balance-across-all-residues
      requirement), rather than accepting a contract whose own pre-registered
      requirement would likely trigger its own STOP on every run. Deferred,
      not abandoned: testing p = 5, 7, 11 (mod 12) is a named successor lever,
      gated on the run-time-computation option the research task identified.
    advisory_carried: [A1, A2, "pre-run edge-list correctness gate"]
  objective: >-
    Build supersingular 2-isogeny graphs independently of the WISDE counting
    data for a pre-registered set of small primes, and measure whether greedy
    descent on delta_E to the F_p-rational locus scales with a smaller exponent
    in graph size N than an undirected random walk on the same graphs.
  objective_boundary: >-
    This experiment tests for the EXISTENCE of a computable delta_E-gradient
    (L4's revisit condition). It does not implement, propose, or cost a descent
    algorithm, and a positive result does not itself constitute a complexity
    claim (H-SSIQ-18dc91 asymptotic_claim_note).
  inputs:
    graph_construction:
      method: >-
        For each prime p in PRIMES (below), where p = 1 (mod 12) per
        selection_rule_pf3_corrected_and_pf5_narrowed: enumerate the vertex set
        of the supersingular 2-isogeny graph over F_{p^2} by breadth-first
        search from a known supersingular seed j-invariant obtained by the
        standard construction from a supersingular curve over F_p -- state
        which route was used and why (at p = 1 mod 12, neither j=0 nor j=1728
        is supersingular, per the standard CM criteria restated in
        degenerate_j_handling below, so the seed is necessarily some other
        j-invariant; do not assume j=0/1728 are available shortcuts). At each
        vertex, find 2-isogenous neighbours as the roots in F_{p^2} of the
        classical modular polynomial Phi_2(X, j) (a published, fixed nine-term
        polynomial; DO NOT approximate or truncate it), excluding the edge back
        to the immediate predecessor for the NON-BACKTRACKING variant used for
        hitting-time measurement, and including it for the CONNECTIVITY check.
        PRE-RUN CORRECTNESS GATE (advisory A3, carried as a required step): for
        at least one small pre-registered prime, verify the FULL EDGE LIST (not
        just the vertex count) against an independent computation before
        trusting C-CONNECTIVITY's aggregate count for the rest of the batch --
        a compensating pair of local errors can pass an aggregate count check
        while corrupting the adjacency the whole experiment depends on.
      degenerate_j_handling: >-
        PF-5 RESOLVED BY SCOPE NARROWING (see
        inputs.primes.pf5_resolution for the full finding and citations).
        AT p = 1 (mod 12), j = 0 and j = 1728 ARE NOT SUPERSINGULAR AT ALL, so
        this section does not apply to the confirmatory prime set and no
        degenerate-vertex handling is required for THIS run: standard CM
        criterion, j = 1728 supersingular iff p = 3 (mod 4), j = 0
        supersingular iff p = 2 (mod 3), and p = 1 (mod 12) satisfies neither
        (p = 1 mod 4 and p = 1 mod 3). This is exactly why
        Charles-Goren-Lauter (J. Cryptology 22(1), 2009, Section 4, quoted in
        pf5_resolution) restrict their own Pizer-graph construction to
        p = 1 (mod 12): "the elliptic curves have no automorphisms other than
        +-1" at that residue, which is what makes the graph a genuine SIMPLE
        undirected 3-regular graph with no multiplicity bookkeeping at all.
        M-DEGSEQ's check for THIS run is therefore the plain statement
        "every vertex has degree exactly 3," not a per-(p mod 12)-class
        multiplicity table -- there is no degenerate case to check against in
        this prime set.
        RETAINED AS BACKGROUND, NOT LOAD-BEARING FOR THIS RUN: the general
        multigraph-with-root-multiplicity convention for p != 1 (mod 12) is
        established (Sutherland, "Isogeny volcanoes," ANTS X 2012,
        arXiv:1208.5370, Definition 3 and Section 2.5: root multiplicity of
        Phi_2(X,j) IS edge multiplicity; every vertex has out-degree exactly 3
        unconditionally; only in-degree/undirected-symmetrisation can fail at
        j=0/1728 and their neighbours). The EXACT numeric multiplicity pattern
        by p mod 12 class remains unresolved in the literature reached by the
        pre-freeze research task and is DEFERRED, not needed here -- see
        inputs.primes.pf5_resolution's successor-lever note.
      delta_E_cross_reference: >-
        For every enumerated j-invariant, cross-reference delta_E from the
        WISDE released data used in EXP-SSIQ-4de240 (same source, same
        acquisition route). This is a GROUND-TRUTH AND CORRECTNESS CHECK ONLY:
        it supplies the delta_E label used for descent and the identification
        of the delta_E = 1 locus, and it is NEVER used to construct or bias an
        edge of the graph, which is built purely from Phi_2 root-finding.
    primes:
      note: >-
        PRE-REGISTER THE EXACT PRIME SET before any graph is built, so it
        cannot be chosen after seeing which primes give a favourable result.
      selection_rule_pf3_corrected_and_pf5_narrowed: >-
        PF-3 FIX APPLIED, THEN NARROWED BY PF-5's RESEARCH FINDING (see
        pf5_resolution below). 12 primes with p <= 22000 AND p = 1 (mod 12),
        i.e. p/12 (graph size) spread across roughly a few hundred to ~1800
        vertices -- NOT clustered near the ceiling, so the power-law fit has
        an actual N-range to work over -- such that p is covered by the
        WISDE release's EXHAUSTIVE BLOCK (never the sieve-selected block
        above p = 22000: RT-BATCH-002 control #4 / O-28 established that
        pooling with the sieve-selected block introduces a p-range artifact,
        and EV-SSIQ-29fcbb O-1 records the released data spans p in
        [2, 265207], so this bound also keeps every selected prime well
        inside coverage). EXACT LIST TO BE PINNED BEFORE FREEZE from the
        WISDE prime index, not chosen after inspection of any fitted result.
        THE ORIGINAL PF-3 FIX'S BALANCE REQUIREMENT ACROSS {1, 5, 7, 11} mod
        12 IS WITHDRAWN, not retained alongside this rule -- see
        pf5_resolution for why forcing that balance was itself the defect.
      pf5_resolution: >-
        PF-5 RESOLVED BY SCOPE NARROWING, ON EVIDENCE FROM THE PRE-FREEZE
        RESEARCH TASK
        (coordination/goals/GOAL-SSIQ-001/batches/BATCH-003/tasks/PF5-research/pf5_degenerate_vertex_convention.md),
        NOT BY A COORDINATOR-ASSERTED NUMERIC TABLE. That task found, with
        primary-source citation and verbatim quotation: (1) Sutherland,
        "Isogeny volcanoes" (ANTS X 2012, arXiv:1208.5370), Definition 3 and
        Section 2.5, confirms the general multigraph-with-root-multiplicity
        convention and that every vertex has out-degree l+1 = 3 unconditionally,
        with only in-degree/undirected-symmetrisation able to fail at j=0/1728
        and their neighbours; but Remark 8's explicit multiplicity FORMULA is
        stated only for a different regime (ordinary volcanoes, general varying
        l), and the task explicitly declined to hand-extrapolate it to l=2
        supersingular after finding it did not self-consistently close, per
        AGENTS.md rule 9. (2) MORE IMPORTANTLY: Charles-Goren-Lauter,
        "Cryptographic Hash Functions from Expander Graphs" (J. Cryptology
        22(1), 2009), Section 4, quoted verbatim: the foundational Pizer-graph
        construction THIS CONTRACT'S OWN degenerate_j_handling TEXT CITES does
        NOT solve the general-p-mod-12 multiplicity case either -- it
        explicitly RESTRICTS to p = 1 (mod 12) "because... the elliptic curves
        have no automorphisms other than +-1" at that residue, which is
        precisely what makes the edge-identification canonical. The published
        literature this contract descends from treats the general case as one
        to AVOID, not one it has solved.
        CONSEQUENCE: the original PF-3 fix's balance requirement across all
        four residues {1,5,7,11} mod 12 was ITSELF A DEFECT introduced while
        fixing PF-3 -- it forced p = 11 mod 12 (both j=0 and j=1728
        simultaneously supersingular and degenerate) into a PRE-REGISTERED
        CONFIRMATORY prime set, on top of an unresolved mathematical question
        the foundational construction paper itself sidesteps. Freezing on
        degenerate_j_handling_fallback's STOP-and-report path as the "intended
        behaviour" for that forced case (the research task's option (b)) would
        very likely stall Phase 1 on its own structural requirement, since the
        one case the contract REQUIRES is the one case with no ready
        multiplicity table anywhere in the literature reached.
        THE FIX: narrow the CONFIRMATORY prime set to p = 1 (mod 12) only --
        CGL's own canonical operating regime, where Aut(E) = {±1} for every
        supersingular curve, the graph is a genuine SIMPLE undirected 3-regular
        graph with no multiplicity bookkeeping, and the vertex-count anchor is
        at its cleanest (CGL / De Feo "Mathematics of Isogeny Based
        Cryptography" Theorem 47: floor(p/12) + epsilon, with epsilon = 0
        exactly at p = 1 mod 12, versus +1 or +2 at the other residues --
        itself a stronger C-CONNECTIVITY anchor than the general case). This
        removes degenerate_j_handling as a load-bearing pre-freeze blocker for
        THIS run's confirmatory metric, without asserting any unverified
        number: j = 0 and j = 1728 are NOT supersingular at p = 1 mod 12 at
        all (standard CM criterion: j=1728 supersingular iff p = 3 mod 4;
        j=0 supersingular iff p = 2 mod 3; neither holds at p = 1 mod 12), so
        the degenerate case this contract cannot yet resolve simply does not
        arise in the narrowed prime set.
        DEFERRED, NOT ABANDONED (AGENTS.md rule 9): testing p = 5, 7, 11 mod 12
        -- where the multiplicity question is live -- is a named successor
        lever for a future batch, gated on either (a) an independent
        Velu-formula-based computation of the exact l=2 multiplicities as a
        run-time correctness gate rather than a literature lookup (the PF-5
        research task's option (a); CGL pp. 97-99 gives the Velu formulas such
        a computation would need), since the literature itself treats this as
        a computation to perform rather than a fact to cite, or (b) a source
        that states the table directly, if one is later found. Recorded in
        ledger/goals/GOAL-SSIQ-001/goal.yaml as a new open item, not silently
        dropped.
      superseded_size_bound_note: >-
        SUPERSEDED BY selection_rule_pf3_corrected ABOVE. The prior text here
        ("5000 <= p/12 <= 2000*12") was an internally inconsistent placeholder,
        flagged by the draft itself for the pre-freeze review to catch (PF-3):
        its lower end already exceeded the ~2000-vertex ceiling used elsewhere
        in this same document, and its upper end exceeded the WISDE dataset's
        own coverage. Retained here, struck through in substance rather than
        deleted, so the correction is visible rather than silent.
  independent_variables:
    - N (graph size, i.e. number of enumerated supersingular j-invariants for a prime)
    - descent method: greedy (steepest local descent on delta_E) versus undirected random walk
  metrics:
    primary:
      - id: M-GAMMA-GREEDY
        definition: >-
          fitted exponent gamma_greedy in median_hitting_time_greedy(N) ~
          N^{gamma_greedy}, fit over the pre-registered prime set by OLS on
          log(median hitting time) against log(N).
        pf2_censoring_rule: >-
          PF-2 FIX APPLIED. "Median hitting time" is a POPULATION-WIDE median
          over ALL N starting vertices (one trial per starting vertex per
          declared seed), NEVER restricted to starts that reach delta_E = 1 --
          a survivor-restricted median is exactly the N-correlated selection
          effect PF-2 identified. A greedy start that halts at a local minimum
          (no strictly-smaller neighbour, delta_E > 1) is assigned a SENTINEL
          hitting time equal to the graph's own BFS-computed diameter for that
          prime (itself reported, so the sentinel is auditable and not an
          arbitrary constant). trapped_fraction(N) -- the fraction of starts
          that halt at a local minimum -- is COMPUTED AND REPORTED alongside
          M-GAP for every prime, under BOTH real and shuffled labels. IF
          trapped_fraction(N) EXCEEDS 0.5 FOR ANY PRIME, gamma_greedy for that
          prime is degenerate (the sentinel dominates the median) and that
          prime's greedy data point is reported VOID, not silently fit anyway.
          A trapped_fraction that GROWS with N alongside an apparently
          DETECTED result is flagged explicitly in execution_report.yaml as the
          artifact signature PF-2 named, whether or not the void threshold
          fires.
      - id: M-GAMMA-RANDOM
        definition: >-
          fitted exponent gamma_random in median_hitting_time_random(N) ~
          N^{gamma_random}, SAME estimator, SAME primes, run on the SAME
          built graphs, SAME population-wide-median convention as
          M-GAMMA-GREEDY (a random walk cannot get permanently stuck on a
          non-bipartite connected graph, so no sentinel is expected to fire
          here in practice; if one does, report it as an anomaly, not as
          silently expected).
      - id: M-GAP
        definition: gamma_random - gamma_greedy, with a bootstrap confidence interval.
    secondary:
      - id: M-LOCALMIN
        definition: >-
          Superseded in its confirmatory role by trapped_fraction(N) under
          M-GAMMA-GREEDY.pf2_censoring_rule above, which is now load-bearing
          rather than purely exploratory. Retained here only for the
          delta_E VALUE at which a halt occurs (not just whether one occurs),
          which stays EXPLORATORY and outside the confirmatory decision rule:
          informs whether a repair (random restart, simulated annealing) is
          worth a later batch.
      - id: M-DEGSEQ
        definition: >-
          the realised degree sequence of each built graph, checked against
          "every vertex has degree exactly 3" -- the plain, unqualified check
          licensed by PF-5's scope-narrowing resolution (inputs.primes.pf5_resolution):
          at p = 1 (mod 12), neither j=0 nor j=1728 is supersingular, so there
          is no degenerate vertex and no multiplicity table to check against
          in this run's prime set. This is a graph-construction correctness
          check independent of the WISDE cross-reference.
      - id: M-TIEFREQ
        definition: >-
          PF-4 FIX APPLIED. Fraction of greedy-descent steps that land on an
          EXACT delta_E tie among a vertex's (up to 3) neighbours, reported for
          BOTH real-label and C-NULL-LABEL shuffled-label arms, alongside
          M-GAP. delta_E takes roughly (p/2)^{1/3} ~ 22 distinct integer values
          at the largest pre-registered prime across graphs of up to ~1800
          vertices with degree <= 3: exact ties among a vertex's neighbours are
          the GENERIC case for this object, not a corner case, under both
          labellings, so this diagnostic is not optional.
  tie_break_rule:
    pf4_fix_applied: >-
      PF-4 FIX APPLIED. Named explicitly rather than left as "a fixed
      deterministic rule": when greedy descent finds two or more neighbours
      tied at the strict minimum delta_E among a vertex's neighbours, break the
      tie by computing sha256 over the tuple (delta_E value, the tied
      neighbours' OWN j-invariant representations as field elements, sorted) --
      CONTENT-DERIVED, never BFS discovery order, never internal vertex ID,
      never anything derived from HOW the graph was built. This is verified
      structurally: the tie-break input depends only on (a) the current
      vertex's tied-neighbour set and (b) the delta_E labelling in force for
      that arm (real or shuffled) -- both of which are graph-construction-order
      -independent by construction, which is the property PF-4 required rather
      than merely asserted.
  preregistered_prediction:
    quantity: "M-GAP = gamma_random - gamma_greedy"
    formula: >-
      NO POINT PREDICTION IS PRE-REGISTERED for the magnitude of the gap,
      because no prior computation in this campaign establishes one -- doing so
      would be exactly the unjustified-precision error DEC-20260805-be2f87 D-1/
      D-2 records against the BATCH-002 tolerance. What IS pre-registered is the
      DECISION RULE below, stated in terms of statistical separability, not a
      numeric target.
    source: >-
      L4's revisit condition in ledger/goals/GOAL-SSIQ-001/goal.yaml
      (exponent_budget.levers L4) and RT-BATCH-002's REC-3 recommendation.
    decision_rule_frozen_before_data:
      - >-
        Phase 0 (C-CAL-GAP, below) must PASS before any real graph is built.
        See controls.C-CAL-GAP for its own gate.
      - >-
        M-GAP's bootstrap 95% CI excludes 0 in the POSITIVE direction
        (gamma_random > gamma_greedy): a computable delta_E-gradient is
        DETECTED. Lever L4 status moves to OPEN-WITH-SIGNAL and the next action
        becomes designing a cost model for the descent, NOT a claim that a
        p^{1/4} algorithm exists.
      - >-
        M-GAP's CI includes 0 or excludes 0 in the NEGATIVE direction: NO
        detectable gradient at this scale. Lever L4's obstruction (the
        hitting-time bound) stands "UNRESOLVED BY THIS TEST" -- that exact
        phrase, never "refuted" and never "falsified" (PF-7 fix: see
        falsification_criterion below) -- toy-scale absence of a detected
        gradient does not prove none exists at larger scale.
      - >-
        Either C-NULL-LABEL or C-CONNECTIVITY fails: the run is VOID for the
        primary metric, per the BATCH-002 precedent, and is reported as such
        rather than interpreted.
  controls:
    - id: C-CAL-GAP
      kind: calibration
      pf1_fix_applied: true
      order: "PHASE 0 -- runs BEFORE any real graph is built or real data is fetched."
      description: >-
        Run the EXACT M-GAP pipeline (same OLS-on-logs estimator, same
        population-wide-median-with-sentinel convention, same window shape as
        selection_rule_pf3_corrected: N spread from a few hundred to ~1800) on
        AT LEAST TWO synthetic hitting-time pairs with KNOWN, DIFFERENT true
        exponents and a STATED shared finite-size bias mechanism:
          (i) CONSTANT-OFFSET variant: h_random(N) = N^{0.5} + c,
              h_greedy(N) = N^{0.25} + c, for at least two values of the shared
              constant c spanning the offset-to-signal ratio the real graphs
              are expected to show (small c and a c comparable to the smallest
              pre-registered graph's diameter);
          (ii) SATURATING/CAPPED variant, because PF-2 identified that greedy
              specifically risks a CAP (the local-minimum sentinel), not just
              an additive offset: h_greedy_capped(N) = min(N^{0.25}, D(N)) for
              a stated cap function D(N) matching the sentinel rule in
              M-GAMMA-GREEDY.pf2_censoring_rule, against the same
              h_random(N) = N^{0.5}.
        Both variants are pure synthetic arithmetic -- no field theory, no
        graph construction, no fetch. Declare a pre-registered RECOVERY
        TOLERANCE: the pipeline's fitted M-GAP on each synthetic pair must
        recover the TRUE gap (0.25 in both illustrative cases above) to within
        +-0.10 for the run to proceed to Phase 1.
      pre_registered_expectation: >-
        REPLACES the deleted, uncalculated "cancels to first order" sentence
        (see scale_relevance below). No expectation of exact recovery is
        assumed -- the calibration EXISTS PRECISELY BECAUSE RT-PREFREEZE's
        toy counterexample showed a hand-constructed instance of this same
        mechanism does NOT cancel exactly (fitted M-GAP bias +0.0192 to
        -0.0377 against a true gap of 0.25, sign-changing across offset
        magnitudes). The tolerance of +-0.10 is chosen to be wider than that
        toy counterexample's observed bias range, so the calibration is a
        real gate and not a rubber stamp of the same magnitude the
        counterexample already found.
      failure_consequence: >-
        IF EITHER SYNTHETIC PAIR'S RECOVERED M-GAP FALLS OUTSIDE +-0.10 OF THE
        TRUE GAP, STOP BEFORE PHASE 1. Do not build any real graph. Report
        failed_infrastructure with the calibration failure as the exact
        obstruction (per stopping_rules), and route the finding back to the
        Coordinator as a contract defect requiring a new estimator or window
        before this hypothesis can be tested at all -- exactly the GD-4/GD-5
        escalation path, caught before data this time rather than after.
    - id: C-NULL-LABEL
      kind: null_object
      description: >-
        Run BOTH descent methods on the SAME built graphs but with delta_E
        REPLACED by a uniformly random permutation of the same value multiset
        (breaking any correlation between the label and graph structure while
        preserving the label distribution exactly). M-TIEFREQ is reported for
        this arm too (PF-4): if the tie-break rule were secretly
        structure-correlated, THIS is one of the two places (alongside the
        real-label arm) that would show it.
      pre_registered_expectation: >-
        gamma_greedy and gamma_random should be STATISTICALLY INDISTINGUISHABLE
        under the shuffled label, because greedy descent on an uncorrelated
        label is just another random walk. THIS EXPECTATION IS NOT RE-DERIVED
        HERE FROM FIRST PRINCIPLES (RT-PREFREEZE PF-4 notes the calculation
        that would fully justify it -- ruling out any structure-correlation
        via the tie-break rule -- is discharged by tie_break_rule's
        content-derived construction, not by this expectation alone); the
        control's own failure_consequence is what actually protects against
        the residual risk PF-4 raised, not the stated expectation.
      failure_consequence: >-
        IF THE SHUFFLED-LABEL GAP IS ALSO SIGNIFICANT, the apparent signal is an
        artifact of the graph's own structure (e.g. degree heterogeneity), the
        tie-break rule, or the estimator, NOT of delta_E specifically, and
        M-GAP ON THE REAL LABELS IS VOID. This is the single most important
        control on the REAL-DATA phase of this contract (C-CAL-GAP is the most
        important control overall, gating Phase 0) and it must be run BEFORE
        the real-label result is interpreted, exactly as C-NULL was in
        EXP-SSIQ-4de240.
    - id: C-CONNECTIVITY
      kind: correctness
      description: >-
        BFS-enumerated vertex count for each prime must match the WISDE
        record's supersingular curve count for that prime. At p = 1 (mod 12)
        this anchor is at its CLEANEST (CGL / De Feo "Mathematics of Isogeny
        Based Cryptography" Theorem 47: floor(p/12) + epsilon, epsilon = 0
        exactly at this residue, versus +1 or +2 elsewhere) -- no j=0/j=1728
        automorphism bookkeeping applies, per degenerate_j_handling.
      failure_consequence: >-
        A mismatch means the graph construction is wrong (missed a
        connected-component, or a Phi_2 root-finding bug -- NOT a degenerate
        -vertex handling error, since this prime set has none), and that
        prime's run is completed_invalid.
    - id: C-DEGSEQ
      kind: correctness
      description: M-DEGSEQ checked against "every vertex has degree exactly 3" for every prime (see degenerate_j_handling).
    - id: C-EDGELIST
      kind: correctness
      description: >-
        The pre-run edge-list correctness gate named under
        inputs.graph_construction.method (advisory A3, carried as required):
        for at least one small pre-registered prime, verify the full edge list
        against an independent computation before trusting C-CONNECTIVITY's
        aggregate count for the rest of the batch.
    - id: C-SEED
      kind: sampling_independence
      description: >-
        Random-walk hitting times and the label-shuffle control are each
        repeated under three declared seeds; report the spread.
    - id: C-REPRO
      kind: determinism
      description: Re-run from the same built graphs and recorded seeds; confirm bit-identical fitted exponents.
  fitting_window:
    W-MAIN: >-
      All pre-registered primes with a CONNECTIVITY-passing graph. No prime may
      be excluded post-hoc for giving an inconvenient hitting time.
  scale_relevance:
    tier: toy
    justification: >-
      Graph sizes bounded by real compute budget, roughly a few hundred to
      ~1800 vertices per selection_rule_pf3_corrected. This tests EXISTENCE of
      a signal, which is a qualitatively different question from
      EXP-SSIQ-4de240's asymptotic exponent match. The decision rule here is a
      SIGN test on a DIFFERENCE of two exponents measured through the
      identical instrument on the identical graphs, not a comparison of a
      fitted value against a numeric target -- a deliberate design choice to
      avoid BATCH-002's failure mode.
    cancellation_claim_pf1_fix: >-
      PF-1 FIX APPLIED. The prior sentence here ("a shared instrument bias...
      cancels in M-GAP to first order") is DELETED as an unqualified claim. It
      was asserted, not calculated, and RT-PREFREEZE constructed a toy
      counterexample (shared additive finite-size offset on two power laws of
      different true exponent, same OLS estimator, same window) where the
      fitted M-GAP bias is non-zero, unequal to either individual exponent's
      bias, and CHANGES SIGN across offset magnitudes (+0.0192 to -0.0377
      against a true gap of 0.25). Whether cancellation holds for the ACTUAL
      bias mechanism this experiment encounters is now a MEASURED, GATING
      question -- see controls.C-CAL-GAP, Phase 0, which must pass before any
      real graph is built.
    correspondence: null
  tail_checks:
    - >-
      Report the single largest and smallest per-prime hitting time for each
