  validity_reason: >-
    Phase 0 (C-CAL-GAP) ran to completion and PASSED on all three
    pre-registered synthetic pairs (recovered M-GAP within +-0.10 of the
    true gap 0.25 in every case). Phase 1 built all 12 pre-registered
    graphs independently via Phi_2 BFS; C-CONNECTIVITY, M-DEGSEQ,
    C-EDGELIST, and the delta_E=1 locus cross-check ALL PASSED for every
    prime (exact match against WISDE in every case). C-NULL-LABEL's own
    machinery ran successfully and C-REPRO reproduced it bit-identically.
    However, the REAL-label descent arm -- and therefore the confirmatory
    metric M-GAP -- could NOT be produced: inputs.graph_construction.
    delta_E_cross_reference requires WISDE to supply "the delta_E label
    used for descent... for every enumerated j-invariant," but the WISDE
    release (verified directly, see source_access_log.yaml
    format_investigation) contains only abstract per-ORDER-TYPE quaternion
    bases and (N1,N2,N3) tuples, with no numeric j-invariant and no
    identifier linking an order type to a specific computed j-invariant.
    Establishing that link requires solving the Deuring correspondence
    (endomorphism-ring computation), which EXP-SSIQ-4de240's M_GRAD arm
    already identified as out of budget ("reimplementing the authors'
    pipeline") and remains out of THIS run's budget for the identical
    reason. No delta_E value beyond delta_E=1 (a mathematical identity
    requiring no external data) was fabricated or arbitrarily assigned.
    The run is a valid, fully executed, fully honest run whose terminal
    finding is this discovered obstruction; per AGENTS.md rule 5 /
    docs/claims-and-verification.md, this is reported plainly, and the
    frozen decision rule's VOID branch is applied (see raw-result.json
    "decision") because the primary metric cannot be interpreted in either
    direction -- never DETECTED, never UNRESOLVED-BY-THIS-TEST, never
    "falsified" or "refuted."

