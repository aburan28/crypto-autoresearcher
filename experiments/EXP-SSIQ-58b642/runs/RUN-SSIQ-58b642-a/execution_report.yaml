execution_report:
  experiment_id: EXP-SSIQ-58b642
  run_id: RUN-SSIQ-58b642-a
  implementation_commit: f5244c18583255186fd0fc30dc7c73645d86607a
  implementation_commit_note: >-
    dirty tree at this commit (implementation/ and runs/ were untracked,
    created by this run); the Coordinator's snapshot task commits the
    exact artifact set, per AGENTS.md -- this Executor commits nothing.

  protocol_deviations:
    - id: PD-1
      title: >-
        Per-vertex delta_E cross-reference (inputs.graph_construction.
        delta_E_cross_reference) is NOT achievable within this run's
        budget for delta_E > 1; only the delta_E = 1 locus is resolved.
      detail: >-
        The frozen contract states WISDE "supplies the delta_E label used
        for descent... for every enumerated j-invariant." The WISDE
        release, fetched and inspected directly (source_access_log.yaml
        format_investigation, results37.sage full-content probe),
        contains only an abstract per-ORDER-TYPE quaternion-algebra Z-basis
        and the (N1,N2,N3) successive-minima tuple -- no numeric
        j-invariant, no curve identifier, and no field connecting an order
        type to a specific computed j-invariant. Establishing that
        connection for a curve found by this run's own Phi_2 BFS requires
        solving the Deuring correspondence ("curve -> ideal", i.e.
        computing the curve's endomorphism ring), a substantial isogeny-
        based-cryptography computation (KLPT-style connecting-ideal
        search plus ideal-to-isogeny translation) that EXP-SSIQ-4de240's
        M_GRAD arm already identified, for the identical reason, as
        "reimplementing the authors' pipeline" and out of budget. It
        remains out of THIS run's 7200s/4-CPU-hour budget.
      what_WAS_achieved_without_this: >-
        (a) delta_E = 1 identification for every vertex, which needs NO
        external data at all (j in F_p is a Galois-orbit-singleton
        mathematical identity), with its COUNT independently matching
        WISDE's N(1,p) exactly for all 12 primes (delta1_locus_cross_check,
        raw-result.json). (b) C-NULL-LABEL, which by its own definition
        needs only the AGGREGATE delta_E value multiset (fully known from
        WISDE), not a per-vertex correspondence -- run for real, under all
        3 declared seeds, with C-REPRO confirming bit-identical
        reproduction.
      what_was_NOT_done_to_route_around_it: >-
        WISDE's real per-prime delta multiset was NOT arbitrarily assigned
        to non-F_p vertices to manufacture a "real-label" arm. Doing so
        would have silently converted the "real" arm into a second,
        differently-seeded instance of the null arm (since an arbitrary
        assignment carries no correlation with the actual 2-isogeny
        adjacency this experiment built), guaranteeing a fabricated
        UNRESOLVED-BY-THIS-TEST or VOID result while presenting it as if
        it tested the real hypothesis. This is exactly the kind of
        fabricated-measurement failure mode
        docs/claims-and-verification.md and AGENTS.md rule 9 exist to
        prevent, so it was not done.
      classification: >-
        Closest to spec.invalidation_rules' "the contract is found
        underspecified on any point that changes M-GAP: STOP and report
        the underspecification rather than choosing unilaterally" --
        discovered empirically during Phase 1 rather than knowable from a
        pre-execution reading of the contract text alone (it required
        fetching and inspecting the actual released file format).
      escalation: >-
        This finding is reported to the Coordinator as a contract defect
        requiring either (a) an amendment narrowing the confirmatory test
        to the delta_E=1-vs-not-1 signal only (a strictly weaker,
        binary-label version of the same experiment, answerable with the
        data actually available), or (b) a dedicated, separately-budgeted
        successor task to implement the Deuring-correspondence
        computation, or (c) a different ground-truth source for per-vertex
        delta_E -- exactly the GD-4/GD-5/PF-5 escalation path this
        campaign has used before, caught here before the run was declared
        complete rather than after.

    - id: PD-2
      title: >-
        The 2-isogeny graph at p = 1 (mod 12) is NOT always a simple graph
        in the sense PF-5's scope-narrowing resolution states; a small
        number of vertices carry a genuine double edge (or, in principle,
        a self-loop) while total edge MULTIPLICITY per vertex remains
        exactly 3.
      detail: >-
        inputs.graph_construction.degenerate_j_handling states the graph
        is "a genuine SIMPLE undirected 3-regular graph with no
        multiplicity bookkeeping at all" at p = 1 (mod 12), citing CGL's
        Aut(E) = {+-1} result. Empirically (independently verified two
        ways -- gcd(Phi_2(X,v), X^{p^2}-X) squarefree-part degree, AND
        gcd(Phi_2(X,v), d/dX Phi_2(X,v)) -- on the actual pre-registered
        graphs, e.g. p = 2437), a small number of vertices per prime (0-3
        out of 203-1800; see raw-result.json is not itself carrying this
        count, but it was observed during development, reproducible via
        implementation/build_isogeny_graph.py degree_sequence_check
        applied to the DISTINCT-neighbour set) have Phi_2(X, v) with a
        REPEATED root, landing (in every instance checked) exactly at v's
        own Frobenius conjugate v^p -- consistent with v having delta_E =
        2 (a degree-2 isogeny to its own conjugate realised by more than
        one of its three 2-isogenies). Aut(E) = {+-1} rules out the
        j=0/1728-style vertex-automorphism degeneracy but does not, by
        itself, rule out this different phenomenon. M-DEGSEQ as
        implemented checks the MULTISET degree (always exactly 3, by
        Phi_2's cubic degree, verified for all 12 primes -- see
        raw-result.json correctness_gates.degree_sequence, all pass),
        which is the well-defined, always-true statement; the stronger
        "3 DISTINCT neighbours" reading is what fails for this small
        vertex set.
      impact: >-
        None on this run's controls or artifacts: the multigraph
        (multiset-adjacency) construction is used throughout (BFS,
        connectivity, diameter, and the descent/random-walk simulators all
        operate correctly on a 3-element neighbour multiset). Recorded per
        AGENTS.md rule 8 because it revises a load-bearing claim in the
        frozen contract's own PF-5 resolution text, which a future reader
        citing that text verbatim should not repeat unqualified.

  runs:
    completed: [RUN-SSIQ-58b642-a]
    invalid: []
    failed: []

  observations:
    frozen_prediction_reference: >-
      spec.preregistered_prediction.decision_rule_frozen_before_data,
      experiments/EXP-SSIQ-58b642/specification.yaml lines ~284-316.
      NO POINT PREDICTION for M-GAP's magnitude was pre-registered (by
      design, to avoid BATCH-002's unjustified-precision error); only the
      statistical-separability decision rule was frozen.
    phase0_c_cal_gap:
      overall_pass: true
      synthetic_pairs:
        - {variant: "constant_offset (c=1)", true_gap: 0.25, recovered_m_gap: 0.272119, abs_error: 0.022119, tolerance: 0.10, pass: true}
        - {variant: "constant_offset (c=10, comparable to smallest pre-registered graph's diameter, D(203)=10)", true_gap: 0.25, recovered_m_gap: 0.258219, abs_error: 0.008219, tolerance: 0.10, pass: true}
        - {variant: "saturating_capped (D(N)=ceil(log2 N)+2)", true_gap: 0.25, recovered_m_gap: 0.275418, abs_error: 0.025418, tolerance: 0.10, pass: true}
      note: >-
        The capped variant's trapped_fraction(N) genuinely exercised the
        sentinel/censoring code path (values ~0.16-0.25 across the N
        window, not trivially zero), yet did NOT grow monotonically with N
        in this window (pf2_artifact_signature_flag: false) and did not
        corrupt the recovered gap, because trapped_fraction stayed below
        0.5 throughout -- consistent with the median remaining unaffected
        by censoring below the 50th percentile.
    phase1_comparison_statistics:
      c_connectivity: {all_12_primes_pass: true, definition: "BFS vertex count == WISDE's reconstructed curve count == floor(p/12)+e, exact match every prime"}
      m_degseq: {all_12_primes_pass: true, definition: "every vertex has multiset-degree exactly 3 (Phi_2's cubic degree)"}
      c_edgelist: {prime: 2437, vertices_checked: 203, n_mismatches: 0, pass: true}
      delta1_locus_cross_check: {all_12_primes_pass: true, definition: "count of BFS vertices with j in F_p == WISDE's N(1,p), exact match every prime"}
      c_null_label:
        ran: true
        seeds: [20260805, 11, 977]
        gamma_greedy_null_by_seed: {20260805: 0.147630, 11: 0.147630, 977: 0.147630}
        gamma_random_null_by_seed: {20260805: 0.316030, 11: 0.342420, 977: 0.400231}
        m_gap_null_by_seed: {20260805: 0.168400, 11: 0.194790, 977: 0.252602}
        gamma_greedy_null_identical_across_seeds_note: >-
          NOT a bug: under shuffled (uncorrelated) labels, greedy descent's
          trapped_fraction exceeds 0.5 for EVERY one of the 12 primes under
          EVERY seed (range 0.70-0.90, see anomalies below), so the
          population median is sentinel-dominated and equals the graph's
          own BFS diameter exactly (median_greedy(N) == diameter(N) for
          all 12/12 primes, all 3/3 seeds) -- a seed-INDEPENDENT quantity,
          which is why gamma_greedy_null does not vary with seed even
          though the underlying shuffled label assignment does.
        c_repro: {pass: true, definition: "re-run of the null arm under seed[0] reproduces gamma_greedy_null and gamma_random_null bit-identically"}
      m_gap_real: {status: BLOCKED, value: null, reason: "see protocol_deviations PD-1"}

    trapped_fraction_range_reported:
      greedy_null_arm: {min: 0.701, max: 0.900, note: "every one of the 12 primes exceeds the 0.5 VOID threshold under the null label, for every seed; see anomalies"}
      random_arm: {any_cap_hit: false, note: "no random-walk trial hit the 50*N step cap under any seed/prime -- consistent with M-GAMMA-RANDOM's stated expectation that no sentinel fires in practice"}
    m_tiefreq_range_reported:
      greedy_null_arm: {min: 0.063, max: 0.277, note: "fraction of accepted greedy steps landing on an exact delta tie, real-label arm not measurable (PD-1); null-arm-only range reported here"}

  anomalies:
    - id: A-1
      title: "Null-arm greedy descent is sentinel-dominated for every prime, every seed"
      detail: >-
        trapped_fraction(N) for the shuffled-label greedy arm is 0.70-0.90
        for all 12 primes under all 3 seeds (raw-result.json
        null_arm.<seed>.per_prime.<p>.greedy_trapped_fraction), always
        above the spec's 0.5 VOID threshold. This is reported as an
        anomaly/observation, not smoothed into the fit: it means
        gamma_greedy_null, as reported, primarily reflects how the graphs'
        own BFS diameter scales with N (diameter range 10-14 across
        N=203..1800) rather than genuine random-label descent dynamics.
        This arm is exploratory only (PD-1 blocks the confirmatory real
        arm), so it enters no decision, but a future attempt at this
        experiment (after PD-1 is resolved) should expect the SAME
        trapped-fraction risk on the real-label arm unless a true
        delta_E-gradient substantially lowers it, and should treat any
        real-arm prime with trapped_fraction > 0.5 as VOID per
        M-GAMMA-GREEDY.pf2_censoring_rule, exactly as frozen.
    - id: A-2
      title: "PD-2 restated as an anomaly (see protocol_deviations for full detail)"
      detail: >-
        A small number of vertices per prime have a genuine double edge to
        their own Frobenius conjugate (multiset-degree 3 preserved, but
        distinct-neighbour count 2), contradicting the frozen contract's
        "genuine SIMPLE ... graph with no multiplicity bookkeeping at all"
        text. Handled correctly (multiset adjacency); recorded because it
        revises a load-bearing claim.
    - id: A-3
      title: "git tree was dirty throughout (untracked new files only)"
      detail: >-
        experiments/EXP-SSIQ-58b642/implementation/ and .../runs/ were
        untracked at execution time (this run created both); no
        pre-existing file was modified. Recorded per AGENTS.md rule "record
        the exact git commit and dirty-tree state before every run."

