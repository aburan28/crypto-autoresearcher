# EXP-ECDLP-2bd342
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-0c6cc3.
experiment:
  id: EXP-ECDLP-2bd342
  hypothesis_id: H-ECDLP-b4979f
  source_idea: IDEA-20261003-6d155a
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 47
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-0c6cc3
  objective: >-
    Check the counts 6, 5, and 4, the product 120, and the nearby gap 0.
  inputs:
    bit_length: 6
    doublings: 5
    additions: 4
    length_gap: 1
    doubling_gap: 1
    digit_product: 120
    digit_sum: 15
    nearby_a: 4
    nearby_b: 4
    nearby_gap: 0
    nearby_product: 16
  controls:
    - >-
      The bit length is 6. The doubling count is 5. The addition
      count is 4. Reporting the addition count as 5 drops the gap
      against the doubling count and invalidates the run.
    - >-
      Six exceeds five by 1. Five exceeds four by 1. Six exceeds
      four by 2. The product of 6, 5, and 4 is 120. Their sum is 15.
    - >-
      Two readings of the addition count are both 4. Their gap is
      0 and their product is 16.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 47 has bit length 6, 5 doublings, and 4
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 6. Count 5 doublings. Count 4 additions.
      Multiply 6, 5, and 4. Subtract 4 from 4.
    source: >-
      IDEA-20261003-6d155a states the counts 6, 5, and 4, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 120 and the nearby gap 0 are required. A check that stops at the bit length 6 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 4 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 6.
    - The doubling count is not 5.
    - The addition count is not 4.
    - The product is not 120.
    - The addition count is reported as 5, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 6, that the doubling
    count is 5, that the addition count is 4, and that the product
    of those three counts is 120.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 4.
  required_artifacts:
    - experiments/EXP-ECDLP-2bd342/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-2bd342/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-2bd342/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-2bd342/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-2bd342/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-2bd342/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
