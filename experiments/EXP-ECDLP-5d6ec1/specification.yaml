      - sample_size
  preregistered_prediction:
    id: P-envelope
    quantity: Native validity of a fresh metadata-compatible reproduction
    formula: The original driver and both unchanged checker calls exit 0; raw/legacy-manifest bytes and
      bindings match; the supervisor returns output_validated. Any original matrix reading is permitted.
    source: The prospective adapter contract; no full scientific successor trial has been run during design.
  historical_scientific_protocol:
    objective: "On E: y^2 = x^3 + 6x + 2, take the smallest prime p with 23 \u2264 p \u2264 120 such that\
      \ E is nonsingular and has at least 24 affine points of nonzero y. Freeze the lexicographic first\
      \ such point as Q. Let f be the fraction of the remaining eligible points whose element x(P+Q) x(P-Q)\
      \ - x(P) x(Q) is a nonzero square. The positive reading is that |f - 1/2| is strictly above order\
      \ statistic 285 of 300 x-shuffles. This is not a discrete logarithm."
    preregistered_prediction:
      quantity: '|2k - n| is strictly greater than the 285th of the 300 shuffle numerators, sorted nondecreasing.
        n is the size of the sample and k is the nonzero-square count.'
      formula: The positive reading is that strict inequality. The negative reading is a valid sample
        whose numerator is at most rank 285. Equality does not exceed.
      source: IDEA-20261006-30b5f6 fixes rank 285 of 300 and states that a finished value at most that
        percentile is the concrete negative. That pair was fixed before this driver was executed.
    success_criterion: The manifest is valid, planted_ok is true, and the absolute numerator is strictly
      greater than shuffle rank 285.
    falsification_criterion: The manifest is valid, planted_ok is true, the sample is nonempty, and the
      absolute numerator is at most shuffle rank 285.
    decision_impact:
      on_positive: Record that this one prime beat its own x-shuffle cutoff. Do not treat that as a faster
        discrete logarithm.
      on_negative: Record that this one prime did not beat the cutoff. Do not move the rank and do not
        run rho from this manifest.
    stopping_rules:
    - Stop after one valid manifest for RUN-ECDLP-08e0d9.
    - Do not score a later prime or a second curve.
    - A missed matrix is the recorded result. Do not change the rank.
    invalidation_rules:
    - No prime in the window has 24 affine points of nonzero y.
    - The sample is empty, a point leaves the curve, or the two Legendre evaluations disagree.
    - A timeout, crash, or a floating-point percentile.
    replication:
      seeds: &id001 []
      independent_instances: 1
      named_future_run_slot: RUN-ECDLP-08e0d9
      replication_note: One deterministic pass. The shuffle stream is named, not drawn from an unrecorded
        seed.
