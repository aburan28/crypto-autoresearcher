  controls:
  - Each scored point P, Q, P+Q, and P-Q lies on the curve. The discriminant 4*a^3 + 27*b^2 is nonzero
    at the selected prime.
  - The Legendre symbol is the field power, computed by built-in exponentiation and by repeated squaring.
    Disagreement voids the cell.
  - The 300 shuffles are a SHA-256 Fisher-Yates stream named by the idea id. The lex-second point is recorded
    and does not set the cutoff.
  - The unchanged original checker executes once before the new envelope is written and once in the native
    supervisor checker phase. Both are deterministic controls, not independent scientific review.
  - Compare preserved raw/legacy-manifest SHA256 values, old identities and metric mapping exactly; refuse
    source drift, output tampering, provenance mismatch or an existing successor output.
  - The native supervisor retains its current manifest-schema gate, live claim admission and immutable-output
    checks. No gate is removed or softened.
  independent_variables:
  - metadata representation only; all original scientific inputs and algorithms fixed
  metrics:
    primary:
