experiment:
  id: EXP-SIMSPK-9aa7e3
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-7e0030; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-7e0030
  question_id: RQ-SIMSPK-f6a6c0
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Exhaustive verification that unit-multiplier and swap conjugation is an exact symmetry of
    SIMON-like round functions and, separately, of the full keyed cipher, plus orbit enumeration of
    the rotation-constant space with multiplicities
  objective: 'A run reduces exactly one uncertainty: whether the rotation-constant space may legitimately
    be scored on its quotient rather than point by point. Concretely it determines (i) whether the
    round-function identity pi_u F_{a,b,c}(x) = F_{ua,ub,uc}(pi_u x) holds bitwise for every unit
    u, every triple, and every input at word sizes 4, 6, 8, 10 and 12, which is a zero-mismatch integer
    test with no statistics attached; (ii) whether that identity lifts to r rounds of the actual keyed
    Feistel with the pinned key schedule and round-constant sequence, measured as r_max, the round
    at which conjugated encryption first stops matching, so that either the class-function property
    holds at cipher level or the break is localized to the schedule; and (iii) the exact orbit count,
    the multiplicity histogram, and the stabilizer order of the standardized triple, computed twice
    by independent code paths that must agree. The run also delivers, as a single number, the difference
    between the standardized triple''s percentile rank on the raw grid and on the quotient under a
    fixed cheap surrogate measure, so the campaign learns whether the correction matters before any
    expensive trail search is commissioned. No hypothesis is minted and no status changes.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'At most, a run could support: for the pinned reference implementation
      of the named SIMON variants at word sizes 4, 6, 8, 10, 12 and, if reachable, 16, with the specific
      key schedule and round-constant sequence recorded in the run manifest, (a) an exact integer
      statement that the round-function conjugacy identity holds or fails, with the mismatch count;
      (b) a measured r_max per unit for the keyed cipher under the sampled keys and plaintexts; (c)
      an exact orbit count and multiplicity histogram for the constant space at those word sizes;
      and (d) the numeric difference between two percentile ranks under one named surrogate measure.
      What does NOT follow: any statement about the security, strength, weakness, or margin of any
      SIMON variant at any round count; any statement about whether the standardized constants are
      optimal, anomalous or unremarkable under any cryptanalytic measure, since no cryptanalytic measure
      is computed here; any statement about designer intent or provenance; any claim that G is the
      full symmetry group; and any extrapolation of r_max from a scaled-down key schedule to the standardized
      one.'
  inputs:
    procedure: 'STAGE 0, acquisition and pinning, human cost roughly 30 to 60 minutes and may fail:
      read the round-function form, rotation constants, key schedule and test vectors from a primary
      source, implement the reference, and confirm the published test vectors reproduce bit for bit.
      If acquisition fails, the run records a named missing baseline and proceeds only with the parameterized
      round function, with every constant-specific claim withheld. STAGE 1, symbolic derivation and
      Burnside orbit count, zero compute, minutes: derive the index identities and compute the predicted
      orbit count per n, freeze it in the preregistration file before STAGE 3. STAGE 2, exhaustive
      round-function check at n in {4,6,8,10,12}, under two minutes total single core: bitwise comparison
      over all units, triples and inputs, reporting an integer mismatch count. STAGE 3, union-find
      orbit enumeration at n in {8,12,16,24}, seconds: produce orbit representatives, sizes, and the
      stabilizer of the standardized triple; compare against the frozen Burnside prediction. STAGE
      4, keyed-cipher conjugacy at n = 8 and n = 16, minutes: 64 random key and plaintext pairs per
      unit, increment r until mismatch, record r_max. STAGE 5, null arm, minutes: 1000 random non-affine
      bit permutations through the identical STAGE 2 check. STAGE 6, surrogate-rank impact, minutes:
      one fixed differential weight per triple, two percentile ranks reported side by side.'
    instrument: 'CPython 3.11 standard library only. This environment was checked on 2026-08-16 and
      has no numpy, no z3, no python-sat and no pulp, and Sage is excluded by contract, so the implementation
      is deliberately dependency-free: integers as bit vectors, rotations by shift and mask, union-find
      as a plain list. Manifest, seed and determinism conventions follow harness/runner.py so the
      run record carries the resolved inference block, the seed, and per-stage wall-clock in the same
      shape as existing runs. Identifiers are minted with tools/allocate_id.py --next rather than
      by scanning state. Output is one JSON record per stage plus a frozen preregistration file written
      before STAGE 3 begins.'
    parameters: 'Word sizes n in {4, 6, 8, 10, 12} for the exhaustive round-function check, giving
      constant-space sizes 64, 216, 512, 1000 and 1728 and input spaces 16 to 4096. Orbit enumeration
      additionally at n in {16, 24}, sizes 4096 and 13824. Units: all u with gcd(u,n) = 1, so 2, 2,
      4, 4, 4, 8 and 8 units respectively. Keyed-cipher check at n = 8 and n = 16 with 64 random key
      and plaintext pairs per unit, drawn from a seeded generator with the seed recorded, and r swept
      from 1 to the full round count of the pinned variant. Null arm: 1000 bit permutations drawn
      uniformly from S_n at n = 16 with affine ones rejected, seed recorded. Surrogate measure: the
      exact one-round differential weight of a single fixed low-weight input difference, computed
      by brute force over all 2^n inputs at n <= 16.'
  controls:
  - 'Null arm: 1000 uniformly drawn non-affine bit permutations subjected to the identical equivariance
    search, which must all fail.'
  - 'Identity control: u = 1 and the identity swap must pass trivially at every round count; failure
    indicates an implementation fault and halts the run.'
  - 'Deliberately non-equivariant key schedule: replace the round-constant sequence with a fixed non-symmetric
    pattern known to break pi_u-equivariance and confirm the cipher-level check fails, so a pass in
    the signal arm is known not to be vacuous.'
  - 'Test-vector control: the pinned reference implementation must reproduce the specification''s
    published test vectors before any conjugacy result is recorded.'
  - 'Independent orbit count: Burnside computation in STAGE A versus union-find enumeration in STAGE
    D, computed by separate code paths, must agree exactly.'
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): The null object is a bit permutation sigma drawn uniformly from the
    symmetric group S_n on bit indices, rejecting those of the affine form i -> u i + v, paired with
    a rotation triple drawn uniformly from (Z/n)^3. The IDENTICAL equivariance test runs against it
    in the same invocation: for each random sigma, search all n^3 triples for one satisfying sigma
    F_{a,b,c}(x) = F_{a'',b'',c''}(sigma x) for all x. The null must show zero passing sigma out of
    at least 1000 draws at n = 16, and must show the orbit-size histogram over uniformly drawn triples
    agreeing with the Burnside orbit-counting prediction computed independently in STAGE A. If any
    non-affine random permutation passes, the equivariance check is detecting an implementation artifact
    or a degenerate test vector rather than a symmetry, and no orbit claim may be made from the signal
    arm.'
  independent_variables:
  - word size n
  - unit multiplier u
  - rotation triple (a,b,c)
  - round count r
  - arm (signal orbit-action versus null random-permutation)
  metrics:
    primary:
    - round_function_identity_mismatch_count
    - orbit_count per n from union-find
    - orbit_count per n from Burnside
    - r_max per unit per word size
    - stabilizer order of the standardized triple
    secondary:
    - orbit multiplicity histogram
    - null_arm_pass_count out of 1000
    - percentile rank of the standardized triple raw versus quotient under the surrogate measure
    - wall-clock seconds and peak resident memory per stage
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The orbit count of (Z/n)^3 under the group generated by unit multiplication and the
      AND-argument swap, at each tested n, together with the integer mismatch count of the round-function
      conjugacy check, which is predicted to be exactly zero.
    formula: Orbit count predicted by Burnside's lemma as the average over group elements g in G of
      the number of triples fixed by g, that is (1/|G|) times the sum over g of |Fix(g)|, where G
      is generated by t_u(a,b,c) = (ua, ub, uc) for u in (Z/n)* and s(a,b,c) = (b,a,c), so |G| divides
      2 phi(n). The value is computed symbolically in STAGE 1, written to the frozen preregistration
      file, and compared with the independent union-find count in STAGE 3; equality is required, and
      disagreement invalidates the enumeration rather than being reconciled after the fact. The mismatch-count
      prediction is the exact integer 0.
    source: Pre-registered in the parent proposal IDEA-20260816-7e0030 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: 'Tested parameters are word sizes 4 through 16 with orbit enumeration extended
      to 24, against a cipher family whose deployed word sizes are 16, 24, 32, 48 and 64. The exhaustive
      round-function check is complete, not sampled, at n <= 12 and is therefore a proof by exhaustion
      at those sizes. The transfer assumption made explicit: the round-function identity is an algebraic
      consequence of AND and XOR being coordinate-wise and of pi_u normalizing the rotation group,
      so it is expected to hold at every n, and the exhaustive checks at small n are a verification
      of the derivation rather than a sample from which the large-n case is extrapolated statistically.
      The cipher-level result, r_max, does NOT transfer: it depends on the actual key schedule, so
      a value measured at a scaled-down schedule is scoped to that schedule and may not be quoted
      for a standardized variant.'
    correspondence: null
  tail_checks:
  - Triples with a = b, which make the AND degenerate, are enumerated and reported separately rather
    than filtered, since they carry nontrivial stabilizers and would otherwise skew multiplicity.
  - Word sizes with n a power of two versus n with several prime factors are compared, because phi(n)
    and hence the group order differ sharply and a result that only appears at one shape is an artifact.
  - The all-zero key and all-zero plaintext cases are run explicitly and excluded from the r_max statistic,
    since they can pass the conjugacy check vacuously.
  - The unit u = n - 1, which is the reflection, is checked separately because it is the one unit
    present for every n and would carry the whole result if the others were inactive.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt the entire run and report an instrument fault if the identity control u = 1 fails at any
    stage.
  - Halt STAGE 4 for a given unit at the first mismatching round and record r_max; do not continue
    to larger r.
  - Cap total run wall-clock at 3600 seconds; any stage not completed within its share is reported
    as a budget outcome with the parameters actually reached, never as a bound or a negative result.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The run completes STAGE 2 with a mismatch count of exactly zero at every tested
    word size, STAGE 3's union-find orbit count agrees exactly with the frozen Burnside prediction
    at every tested word size, the null arm records zero passes out of 1000, and r_max is reported
    per unit with the pinned key schedule named.
  falsification_criterion:
  - A nonzero round-function mismatch count at any tested word size.
  - Disagreement between the Burnside prediction frozen before STAGE 3 and the union-find count produced
    by STAGE 3.
  - Any null-arm pass among the 1000 random non-affine permutations.
  - r_max strictly between 1 and the full round count for any unit, contradicting the predicted dichotomy.
  - Failure of the pinned reference implementation to reproduce the specification's test vectors,
    which invalidates every constant-specific output of the run.
  - An observed orbit count equal to n^3, which would make the multiplicity correction empty.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-7e0030
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The exact key schedule and round-constant sequence for each variant must be pinned by the Coordinator
    from a primary source before STAGE 4 can be interpreted; without it STAGE 4 measures a scaled-down
    schedule of the campaign's own construction and its r_max may not be attributed to any standardized
    variant.
  - Whether the swap generator s and the unit generators together generate a group of order exactly
    2 phi(n) or a proper subgroup, and whether they commute, must be settled symbolically before Burnside
    is applied; the proposal assumes only that the order divides 2 phi(n).
  - The surrogate measure used in STAGE 6 is a placeholder chosen for cheapness; the Coordinator must
    decide whether the impact number is computed against it or deferred until a real portfolio measure
    exists, since a low-resolution surrogate makes the percentile difference uninformative.
  - Whether the transported key pi_u k is a legal key for the target variant under the pinned schedule,
    or only a formal object, must be resolved; if it is not a legal key the cipher-level claim must
    be restated as a statement about the round-key sequence rather than about keys.
