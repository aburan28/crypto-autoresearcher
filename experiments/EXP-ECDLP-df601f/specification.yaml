experiment:
  id: EXP-ECDLP-df601f
  hypothesis_id: H-ECDLP-75b566
  question_id: RQ-ECDLP-002
  idea_id: IDEA-20260904-f7ee90
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-002 is bound to GOAL-ECDLP-001. This contract does not open a
    batch on that head and does not edit goal.yaml. Standalone heuristic-
    validation design under the question's own claim boundary.
  version: 1
  recorded_at: '2026-09-07'
  drafted_under_task: TASK-20260907-f2e745
  title: >-
    Auxiliary-order heuristic validation: HEUR-A (coset typicality),
    HEUR-B (norm smoothness), and HEUR-C (class equidistribution) on a
    frozen eight-rung four-curve ladder (17-27 bits, span >= 1000x)
    against NULL-R, NULL-S (sham modulus), NULL-I, and NULL-H, with the
    d = 1 closed-form fixture and a five-point planted-atypicality
    calibration including n^{-1/6}
  status: approved
  approved_by: coordinator
  assigned_to: executor
  frozen: true
  execution_authorized: true
  execution_authorized_note: >-
    Authorized for the heuristic-validation measurement only. No attack
    is run. No discrete logarithm is solved except inside POSITIVE
    CONTROL B, where k is known by construction. No live key, wallet, or
    deployed system.
  approval_note: >-
    Approved 2026-09-07 by Coordinator authority under the standing user
    authorization in AGENTS.md (2026-09-06: "all is approved.
    ideas/experiments should be always approved") and design-experiment
    skill step 4. Decision record DEC-20260907-88893e. The specification
    is frozen as of the snapshot commit; any change is a versioned
    protocol_amendment under experiments/EXP-ECDLP-df601f/amendments/,
    never an edit. The pre-registered prediction is part of the frozen
    contract and is never adjusted after a run.
  class: heuristic-validation
  heuristic_under_test: [HEUR-A, HEUR-B, HEUR-C]
  claim_ceiling: >-
    toy-scale heuristic validation only; no ECDLP solve, no exponent
    claim, no cost-formula certification, no transfer to cryptographic n
  claim_tier_basis: >-
    TOY tier per docs/claims-and-verification.md. No solve is claimed.
    Every number is a measured distributional statistic on self-generated
    toy instances. Any downstream evidence record must carry
    claim_tier: toy and proof_status: empirical_only unless a later
    derivation record upgrades a named clause.
  objective: >-
    Measure whether the three named heuristics that pin the
    auxiliary-order smoothness-splitting family at n^{1/2+o(1)} hold on
    a frozen toy ladder, without solving any discrete logarithm. Every
    outcome is a result: CLOSURE (heuristics inside bands, sham agrees,
    planted calibration recovers n^{-1/6}) puts the pin on measured
    ground in the tested scope; LEAD (atypical on-curve minima growing
    in n, or principal fractions above 4/h, or sham disagreement)
    routes to independent review; INCONCLUSIVE is the pre-registered
    band between, or a failed planted calibration. NO ATTACK is run.

    STAGE 0 (ZERO COMPUTE, HARD DOCUMENT GATE). Restate HEUR-A, HEUR-B,
    HEUR-C with uniformity ranges; confirm the pre-registered bands
    below; write the artifact schema; confirm the frozen ladder hashes.

    STAGE 1 (HARD GATE). Implement the samplers (Lagrange-Gauss coset
    reduction, integer factorisation of the norm, class-group ideal
    reduction). Run POSITIVE CONTROL A (d = 1 closed form, exact) and
    POSITIVE CONTROL B (planted sweep at the five frozen factors).
    Exact agreement on A and 20-percent recovery on B including
    n^{-1/6}, or stop. No Stage 2 number is reportable if Stage 1 fails.

    STAGE 2 (THE MEASUREMENT). For every (curve, n, d) cell: 10^4
    sampled k for P1 and P2; 10^5 fully factored norms for HEUR-B
    (the 10^4 P1 samples plus 9*10^4 additional draws); 10^3 smooth
    alpha for P3 on cells with h(-4d) > 1. NULL-R, NULL-S, NULL-I,
    NULL-H on the identical estimators with independent seeds.

    STAGE 3. The (n, M) decay surfaces of P6; the parallel-rho and
    BSGS comparator columns on the identical instances in identical
    charged units. Rho and BSGS are MATCHED CONTROLS, not attacks
    under test: they cost the same instances so later citations have
    a measured rho column.

    STAGE 4 (ONLY IF A LEAD FIRES). Stop. Do not interpret. Route to
    independent review-adversarial. Do not convert a measured median
    into an exponent.
  inputs:
