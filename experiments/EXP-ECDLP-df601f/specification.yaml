    auxiliary_orders:
      d_list: [1, 2, 5, 13, 23]
      ring: 'R_d = Z[sqrt(-d)], disc = -4d'
      homomorphism: 'phi_d(a + b sqrt(-d)) = a + b*delta mod n, delta^2 = -d (mod n)'
      skip_rule: >-
        If (-d / n) = -1 the cell is SKIPPED and recorded as skipped,
        never silently pooled. Stage 0 lists the admissible (n, d)
        pairs after Tonelli-Shanks. d = 1 is admissible for every odd n.
      class_number_rule: >-
        h(-4d) is computed exactly at run time and recorded with the
        software and version. A GRH-conditional value makes that cell's
        HEUR-C conclusion GRH-conditional. Expected values (RECALLED,
        re-computed at Stage 0): h(-4)=1, h(-8)=1, h(-20)=2, h(-52)=2,
        h(-92)=3.
    arms:
      ONCURVE: 'k uniform in Z/n; coset = phi_d^{-1}(k) on the curve order n'
      NULL-R: 'uniformly random coset of ker(phi_d) on the identical lattice'
      NULL-S: >-
        sham modulus: replace n by a random prime n_sham of matched bit
        length that is NOT the order of any curve in the run set; take
        delta_sham with delta_sham^2 = -d (mod n_sham). No curve enters
        the construction.
      NULL-I: 'uniformly random integers of size N(alpha_min), smoothness arm only'
      NULL-H: 'binomial(2^omega, 1/h) draws, class arm only'
      POS-A: 'd = 1 closed-form fixture (uniform least residue on [0, n/2]; principal fraction 1)'
      POS-B: >-
        planted atypicality: shift a random coset so its minimum is
        smaller than typical by f in {1, n^{-1/12}, n^{-1/8}, n^{-1/6},
        n^{-1/4}}
      COMPARATOR-RHO: 'parallel Pollard rho with distinguished points and negation, same instances, charged units'
      COMPARATOR-BSGS: 'BSGS on the same instances, memory reported'
    lift_convention: 'not applicable -- the tracked object is a lattice coset, not a curve coordinate'
    estimator: >-
      (i) construct the coset from k (ONCURVE) or from a uniform lattice
      translate (NULL-R / POS-B); (ii) reduce by Lagrange-Gauss in rank
      2 (every frozen d gives a rank-2 order); (iii) take N(alpha_min)
      = a^2 + d b^2; (iv) factor N completely; (v) for P3, factor the
      principal ideal (alpha) into prime ideals, form every balanced
      prefix, reduce, and count the principal ones; (vi) two-sample
      Kolmogorov-Smirnov on the named pairs. No code path outside the
      coset constructor reads k.
  controls:
    - name: NULL-R random coset
      role: blocking
      detail: >-
        Primary comparator for HEUR-A. Independent seed from the
        on-curve arm. Same lattice, same estimator.
    - name: NULL-S sham modulus
      role: blocking
      detail: >-
        The null that matters most. Agreement is predicted;
        disagreement suspends the family (F3). Independent seed.
        n_sham is drawn from primes of the same bit length excluding
        every N in ladder.json.
    - name: NULL-I matched random integer
      role: blocking
      detail: 'Smoothness-arm comparator. Isolates form-representability bias from any curve effect.'
    - name: NULL-H synthetic binomial
      role: blocking
      detail: 'Class-arm comparator. binomial(2^omega, 1/h) against the measured principal fraction.'
    - name: POSITIVE CONTROL A = d=1 closed form
      role: blocking
      detail: >-
        Empirical CDF of |k mod n|_min matches Uniform[0, n/2] at KS
        p > 0.01 at every rung; principal fraction identically 1.000.
        Failure is F1: implementation, nothing reported.
    - name: POSITIVE CONTROL B = planted atypicality
      role: blocking
      detail: >-
        Recover f within 20 percent at all five frozen values. Failure
        at n^{-1/6} is F2: P1 may return only INCONCLUSIVE.
    - name: COMPARATOR-RHO
      role: blocking matched control
      detail: >-
        Parallel Pollard rho with distinguished points and the negation
        map on the identical instances, identical charged units. Run
        even though this record mounts no attack, so every number later
        cited against rho has a measured rho column on the same
        instances. Not an attack under test.
    - name: COMPARATOR-BSGS
      role: blocking matched control
      detail: 'BSGS on the identical instances, peak memory reported. Same reason as rho.'
    - name: static provenance check
      role: blocking
      detail: >-
        No measurement code path reads k except the coset constructor.
        Source scan plus a manifest declaration, recorded before
        Stage 2. POS-B reads the planted shift BY DESIGN and is exempt
        for that shift only.
    - name: curve exclusions
      role: blocking
      detail: >-
        Anomalous and smooth-order excluded per KN-TECH-034 as stated
        in b4e6eb/a4be60; satisfied by construction of the frozen
        ladder (N prime, N != p, j not in {0, 1728}).
    - name: independent seeds
      role: blocking
      detail: >-
        ONCURVE, NULL-R, NULL-S, NULL-I, NULL-H use independent seeds
        derived from the base seed. Seed reuse across nulls voids the
        comparison.
  independent_variables:
    - 'prime-order cell T in {17, 18, 19, 21, 23, 24, 25, 27}'
    - 'curve_index in {0, 1, 2, 3} inside each T-cell'
    - 'auxiliary d in {1, 2, 5, 13, 23}'
    - 'sample size M (for P6 decay surfaces: at least M in {10^3, 10^4})'
    - 'arm id (ONCURVE, NULL-R, NULL-S, NULL-I, NULL-H, POS-A, POS-B)'
    - 'planted factor f for POS-B'
  metrics:
    primary:
      - >-
        P1 -- two-sample KS statistic and median-ratio of the
        normalised coset minimum, ONCURVE vs NULL-R, per (curve, n, d)
      - >-
        P2 -- empirical CDF of log(P_max(N(alpha_min)))/log N,
        ONCURVE vs NULL-I, with the 500-smoothest zoom, per cell
      - >-
        P3 -- principal fraction of balanced prefixes vs 1/h and vs
        NULL-H, per (d, n) cell with h > 1
      - >-
        P4 -- two-sample KS of ONCURVE vs NULL-S on all three
        statistics, per cell
      - >-
        P5 -- recovered planted factor at each of the five frozen
        values, per rung
    secondary:
      - >-
        P6 -- (n, M) decay surface of every reported deviation;
        deviations flat in n and ~ M^{-1/2} are CONTROLLED NULLS
      - 'minimum detectable KS effect per cell (stated, not claimed as absence)'
      - 'exactly computed h, Reg, disc per auxiliary order, software and version'
      - 'measured rho and BSGS costs on the identical instances, charged units'
      - 'wall clock and peak_rss_bytes per stage'
      - 'pass or fail of every blocking control'
      - 'skip list of (n, d) pairs where (-d/n) = -1'
  heuristic_under_test_note: >-
    HEUR-A, HEUR-B, HEUR-C of H-ECDLP-75b566 / IDEA-20260904-f7ee90,
    stated exactly there. This experiment validates those three
    heuristics and nothing else. It does not test the cost formula of
    IDEA-20260904-982159.
  preregistered_prediction:
    quantity: >-
      The three on-curve distributions (normalised coset minimum,
      largest-prime-factor statistic of the norm, principal fraction)
      relative to their matched nulls, plus sham-modulus agreement and
      planted-factor recovery
    formula: >-
      TWO-BRANCH RULES, FROZEN BEFORE ANY RUN.

      HEUR-A / P1. KS p > 0.01 in >= 95 percent of cells and no
      systematic median-shift sign => CLOSURE for HEUR-A. Median
      ONCURVE/NULL-R ratio < 0.5 in >= 3 cells, deficiency growing
      in n not in M => LEAD. Between => INCONCLUSIVE.

      HEUR-B / P2. ONCURVE vs NULL-I KS p > 0.01, and the smoothest
      sample of M draws has rho(u_s) within a factor 4 of 1/M =>
      CLOSURE for HEUR-B. Curve-specific smoothness excess not shared
      by NULL-I => LEAD.

      HEUR-C / P3. Principal fraction within a factor 2 of 1/h in
      >= 90 percent of h>1 cells => CLOSURE for HEUR-C. Fraction
      reproducibly > 4/h => LEAD.

      P4. KS p > 0.01 vs NULL-S in >= 95 percent of cells => sham
      agrees. Disagreement => FAMILY SUSPENDED (F3).

      P5. Recovered f within 20 percent at all five values including
      n^{-1/6} => instrument calibrated. Failure at n^{-1/6} => F2,
      P1 may return only INCONCLUSIVE.

      P6. Deviation flat in n and ~ M^{-1/2} => CONTROLLED NULL, not
      structure.

      OVERALL CLOSURE requires HEUR-A, HEUR-B, HEUR-C closure, P4
      agreement, P5 recovery, and all Stage 1 gates. OVERALL LEAD
      is any of P1-lead, P3-lead, or P4-fail. Otherwise INCONCLUSIVE.
    source: >-
      IDEA-20260904-f7ee90 predictions P1-P6 and heuristic_assumptions
      HEUR-A/B/C, copied into H-ECDLP-75b566. The KS threshold 0.01
      and the 95/90 percent cell rules are pre-registered from the
      sample size and the rank-2 Gaussian-heuristic spread; they are
      NOT measurements. Dickman-de Bruijn rho(u) and the Gaussian
      heuristic are RECALLED. FROZEN: any adjustment after any run
      requires a versioned protocol_amendment; runs already executed
      are never re-scored against a new prediction.
  scale_relevance:
    tier: toy
    justification: >-
      n in the 17-27 bit band, eight rungs, span >= 1000x (three
      decades). The sampler chooses k, so the coset is available
      without solving ECDLP; this is the analogue of the exemplar's
      Deuring correspondence and is why the heuristics can be
      validated at sizes far above where the sibling attack could
      run. TRANSFER TO CRYPTOGRAPHIC n IS AN EXPLICIT UNLICENSED
      EXTRAPOLATION. Below 2^30 the Dickman asymptotic has not set
      in, which is why the primary smoothness comparison is against
      NULL-I rather than against rho(u); rho(u) is a secondary
      reference only.
    correspondence: >-
      Sampler-chooses-k correspondence: the instance-defined coset
      phi_d^{-1}(k) is constructed from a known k. This is not the
      Deuring correspondence; it is an exact, curve-free construction
      that uses only n. NULL-S is the control that the curve is not
      leaking in through another channel.
  tail_checks:
    - >-
      Smallest on-curve minimum across all cells against the smallest
      over equally many NULL-R replicates (HEUR-A tail).
    - >-
      Smoothest observed N(alpha_min) of M draws against rho(u_s)
      within a factor 4 of 1/M, compared to the same tail of NULL-I
      (exemplar section 4.2 style; A7 of docs/target-result-profile.md).
    - >-
      Maximum observed principal fraction over all h>1 cells against
      the maximum over equally many NULL-H replicates (HEUR-C tail).
  replication:
    seeds:
      base_seed: 0xDF601F
      oncurve: 'SplitMix64(base_seed, "ONCURVE", T, curve_index, d, sample_index)'
      null_r: 'SplitMix64(base_seed, "NULL-R", T, curve_index, d, sample_index)'
      null_s: 'SplitMix64(base_seed, "NULL-S", T, curve_index, d, sample_index)'
      null_i: 'SplitMix64(base_seed, "NULL-I", T, curve_index, d, sample_index)'
      null_h: 'SplitMix64(base_seed, "NULL-H", T, curve_index, d, sample_index)'
      pos_b: 'SplitMix64(base_seed, "POS-B", T, curve_index, d, f_index, sample_index)'
      sham_prime: 'SplitMix64(base_seed, "SHAM", T, bitlength) -- first prime of that bit length not equal to any ladder N and with (-d/n_sham)=1'
      note: 'every (arm, T, curve_index, d, seed) cell is a row of the raw output; no cell is ever silently re-run with a different seed'
    independent_instances: 32
    independent_instances_note: >-
      8 T-cells times 4 curves. Each (curve, d) pair is an additional
      cell of the measurement, not a replicate of another curve.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 16
    maximum_runs: 8
    maximum_workers: 1
    note: >-
      Time and CPU estimates are advisory and may be null
      (docs/research-budget-policy.md; ECC unlimited). Memory 16 GB
      and one worker are machine protection: the T=27 QR-table
      (used only by the already-run selector) and the 10^5-sample
      factorisation buffers must fit. maximum_runs 8 allows one
      invocation per stage plus infrastructure re-invocations, each
      recorded. A timeout is never mathematical evidence
      (AGENTS.md rule 3).
  stopping_rules:
    - 'Stage 1 POSITIVE CONTROL A fails: STOP; F1; nothing reported.'
    - 'Stage 1 POSITIVE CONTROL B fails at n^{-1/6}: STOP Stage 2 interpretation as CLOSURE; F2; Stage 2 may still run but P1 may return only INCONCLUSIVE.'
    - 'Stage 2 P4 fails (sham disagrees): STOP further cost interpretation; F3; FAMILY SUSPENDED; record the disagreeing cells and route to review.'
    - 'Stage 2 P1 or P3 lead fires: complete the (n, M) surface for that statistic, then STOP and route to independent review (Stage 4). No exponent is computed.'
    - 'Budget / memory exhaustion before the ladder resolves: STOP; F7; infrastructure; scope shrinks to the completed cells.'
  invalidation_rules:
    - 'A measurement path reads k outside the coset constructor: every Stage 2 number is void.'
    - 'Seed reuse across ONCURVE and any null: that comparison is void.'
    - 'A cell with fewer than four curves is reported as such and is never pooled with a complete cell (IDEA-20260807-347a83 hole).'
    - 'A skipped (n, d) pair (non-residue) is recorded as skipped, never treated as a null result.'
    - 'Any gate failure archives its evidence BEFORE stopping.'
    - 'An infrastructure failure is never evidence against HEUR-A, HEUR-B, or HEUR-C.'
  success_criterion: >-
    DECIDABLE FROM THE PREDEFINED METRICS ALONE. OVERALL CLOSURE =
    HEUR-A closure AND HEUR-B closure AND HEUR-C closure AND P4
    agreement AND P5 recovery AND Stage 1 gates passed. Honest
    headline: 'three named heuristics measured over a 32-curve
    eight-rung ladder with four nulls and two planted positives, all
    consistent, in the tested toy scope'. It validates heuristics,
    not the cost formula, and proves no bound. OVERALL LEAD = P1
    lead OR P3 lead OR P4 fail. INCONCLUSIVE = the pre-registered
    band between, or F2 (instrument cannot see n^{-1/6}).
  falsification_criterion: >-
    F1-F7 of H-ECDLP-75b566, verbatim. F1 instrument/closed-form
    failure (nothing reported). F2 planted n^{-1/6} miss (no
    closure). F3 sham disagreement (family suspended). F4 HEUR-A
    lead. F5 HEUR-C lead. F6 predicted closure. F7 infrastructure.
  required_artifacts:
    - 'manifest per stage: exact command, git commit and dirty-tree state, environment and dependency versions, input parameters, all seeds, requested model policy and resolved runtime model identifier, reasoning effort, fallback and degraded flags, stdout and stderr, timestamps, wall-clock, peak_rss_bytes'
    - 'raw machine-readable results: per (arm, T, curve_index, d, sample) the triple (min_norm, P_max, principal_flag), with estimator and seed named on every row'
    - 'per-cell KS statistics, median ratios, and p-values for P1 and P4'
    - 'per-cell empirical CDFs and 500-smoothest zoom for P2, against NULL-I and rho(u)'
    - 'per-cell principal fractions, h, Reg, disc, software, GRH flag for P3'
    - 'recovered planted factors per (rung, f)'
    - 'the (n, M) decay surface for every reported deviation'
    - 'the skip list of (n, d) non-residues'
    - 'the gate pass/fail record for every gate, with archived evidence of any failure'
    - 'the static provenance check record (source-scan output + manifest declaration)'
    - 'measured rho and BSGS costs on the identical instances'
    - 'the ladder selector script and its output (already present under design/)'
  measured_vs_modeled: >-
    Every reported distributional number is MEASURED. rho(u) and the
    Gaussian-heuristic median are MODELED references, labelled as
    such, sourced as RECALLED Dickman-de Bruijn / Gaussian heuristic,
    and never mixed into a measured column. The sibling cost formula
    T = n^{1/2}(h/sqrt(d))^{1/2}n^{o(1)} is NOT evaluated as a
    prediction of this experiment.
  optimistic_assumptions: []
  hidden_overhead: >-
    None hidden in the measurement. The o(1) terms that the SUBJECT
    cost formula hides are exactly the three heuristics; measuring
    them is the point.
