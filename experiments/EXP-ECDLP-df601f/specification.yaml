      artifact: experiments/EXP-ECDLP-df601f/design/ladder.json
      selector: experiments/EXP-ECDLP-df601f/design/select_ladder.py
      model: 'y^2 = x^3 + x + b over F_p (a = 1, generic, non-CM: j not in {0, 1728})'
      note: >-
        Cofactor 1 at every curve (#E = N prime). KN-TECH-034 exclusions
