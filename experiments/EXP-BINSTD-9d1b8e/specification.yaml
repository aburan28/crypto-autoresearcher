experiment:
  id: EXP-BINSTD-9d1b8e
  hypothesis_id: H-BINSTD-128789
  question_id: RQ-BINSTD-b6f698
  source_idea: IDEA-20260922-c07598
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Stage 0 five-row rho-symmetry integer certificate + corrected
    sqrt(pi*r/(4k)) bits; Stage 1 Aut(E)=Z/2 source read; Stage 2 toy
    ord(pi_q)/pi_2/null/composite-search controls
  status: analyzed
  approved_by: DEC-20261001-54f76a
  approved_at: '2026-10-01'
  analyzed_by: DEC-20261001-e50929
  analyzed_at: '2026-10-01'
  evidence_id: EV-BINSTD-f541ea
  packaging_only: false
  approval:
    approved_by: DEC-20261001-54f76a
    composing_decision: DEC-20261001-54f76a
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Does NOT claim a break. HOLD-B
      defects absorbed.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stages 0-2. Stage 0 is arithmetic (zero scientific group walks on
      deployed curves). Stage 1 is literature retrieval/extraction (zero
      compute). Stage 2 is toy measurement at dk'<=41 only. Deployed-curve
      attacks and exponent claims are NOT authorized. A3 not treated as
      discharged until Stage 1 upgrades Aut classification to retrieved.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    (A) Commit the integer certificate that mu!=1 and |<pi_q,[-1]>|=2k at
    the five deployed rows, with corrected matched-rho bits under
    sqrt(pi*r/(4k)) and an inherited audit column. (B) Read the char-2
    Aut classification at source and discharge or reopen A3. (C) On toy
    cells verify ord(pi_q)=k' for prime k', that pi_2 is not an
    endomorphism when B notin F_2, and run null / degenerate / composite-
    search controls.

  class: control-certificate
  class_note: >-
    Control / group-order certificate with a literature arm for A3 and a
    toy mechanical verification arm. Not a smoothness CDF heuristic-
    validation and not an attack cost-model. HEUR ids are falsification
    hooks. Measured vs recomputed vs inherited vs extracted columns stay
    separate. No exponent-moving claim.

  corrections_absorbed:
    corrected_rho_convention: >-
      HOLD-B / CORR-20260922-81aeab: primary column is
      log2(sqrt(pi*r/(4*k))) with audited r:
      [78.10, 93.98, 125.78, 141.71, 173.57]. Inherited
      d11575/c07598 0.886/sqrt(2k) figures in a SEPARATE labeled column.
    a3_closure_path: >-
      HOLD-B: Aut(E)=Z/2 closes on j=1/b !=0 plus odd audited traces;
      a=0 on c2pnb208w1 is not a risk factor. Stage 1 must read the
      classification at source (recalled→retrieved) before A3 is
      discharged at claim strength.
    composite_search: >-
      HOLD-B: composite-k' proper-divisor observation is a CURVE SEARCH,
      not a forced prediction. Report found / not-found-within-budget.
    attack_ceiling_sentence: >-
      HOLD-B: (C) states that rho extracts sqrt(k) while a Frobenius-aware
      IC may extract up to k (relations) / k^2 (LA) from the same order-k
      group — do not cap the attack at sqrt(k).

  scope:
    included:
      - >-
        Stage 0 (arithmetic; zero scientific trials on deployed curves):
        (i) recompute h=q+1-t; (ii) Weil recursion to k; (iii) verify
        h*r vs audit dump; (iv) gcd(h,r)=1; (v) t mod 2 odd; (vi)
        corrected rho bits; (vii) inherited audit column; (viii) state
        ord(mu)=k by k-prime argument; (ix) ECC2K-130 methodological note.
      - >-
        Stage 1 (literature; zero compute): retrieve char-2 Aut
        classification (Silverman Appendix A or equivalent); extract the
        j!=0 => Aut={+-1} statement; record provenance retrieved with
        verified_by; or unrecovered=true with attempted sources.
      - >-
        Stage 2 (toy executable): (4,5) and (4,7) review cells — compute
        ord(pi_q) on prime-order points; pi_2 endomorphism check;
        null non-subfield; degenerate B in F_2; composite-k' SEARCH;
        certificate every order claim.
    excluded:
      - Any scientific group walk / attack run at deployed k in {11..23}
      - Filing a break claim or new attack cost
      - Editing AUXIN / QSP / SEMBIN
      - Amazon Bedrock
      - Treating A3 as discharged without Stage 1 retrieved provenance
      - Claiming Silverman (or equivalent) as verified without reading it

  inputs:
    proposal: ledger/proposals/IDEA-20260922-c07598.yaml
    review: analysis/binstd-idea-review-20260926/reviews/IDEA-20260922-c07598.yaml
    curve_audit: analysis/binstd-curve-audit/
    hypothesis: ledger/hypotheses/H-BINSTD-128789.yaml
    idea_6cf862: ledger/proposals/IDEA-20260922-6cf862.yaml
    corr_rho: CORR-20260922-81aeab
    optional_code_refs:
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    literature_targets:
      - id: silverman_aec_appendix_a_char2_aut
        refs:
          - 'Silverman, The Arithmetic of Elliptic Curves, Appendix A'
          - 'equivalent peer-reviewed char-2 Aut(E) classification'
        extract: >-
          For y^2+xy=x^3+a x^2+b over char 2, j=1/b; Aut(E)={+-1} when
          j!=0; larger Aut only at j=0 (supersingular locus).
        provenance_on_success: retrieved
    cells:
      Stage0-deployed-rows:
        q: 65536
        q_bits: 16
        k_list: [11, 13, 17, 19, 23]
        curve_ids: [c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1]
        frozen_expected_audited_r_bits: [161, 193, 257, 289, 353]
        frozen_corrected_rho_bits: [78.10, 93.98, 125.78, 141.71, 173.57]
        frozen_inherited_rho_bits: [77.9, 93.7, 125.5, 141.5, 173.3]
        tolerance_rho_bits: 0.01
        require_gcd_h_r_eq_1: true
        require_t_odd: true
      Stage2-prime-toys:
        - {d: 4, k_prime: 5, dk: 20, A: 0, B_hint: 't^3+1 over F_2[t]/(t^4+t+1)', expected_ord: 5}
        - {d: 4, k_prime: 7, dk: 28, A: 0, B_hint: 't^3+1 over F_2[t]/(t^4+t+1)', expected_ord: 7}
      Stage2-composite-search:
        d: 4
        k_prime: 6
        dk: 24
        note: >-
          Search ordinary E/F_16 with odd t until one exhibits a prime
          r>2^12 dividing #E(F_{q^{k'/p}}) for some prime p|6, then
          report ord(mu); or not-found-within-budget.
        max_curves_tried: 64
      NULL-no-subfield: >-
        Ordinary binary curve over F_{2^20} with B outside F_16; pi_16
        must not be an endomorphism.
      CTRL-degenerate-B-in-F2: >-
        Same shape with B in F_2; pi_2 IS an endomorphism and must be
        detected as one.

  controls:
    - name: k1_embedding
      object: >-
        k=1 (or k'=1) returns symmetry group order 2 (negation only).
    - name: null_no_subfield
      object: >-
        NULL-no-subfield: pi_q not an endomorphism. Failure invalidates
        instrument.
    - name: degenerate_B_in_F2
      object: >-
        CTRL-degenerate-B-in-F2: instrument must report pi_2 IS an
        endomorphism (positive control for the (B) test).
    - name: composite_curve_search
      object: >-
        Composite-k' SEARCH (not forced): report found proper divisor or
        budget exhausted.
    - name: certificate_oracle
      object: >-
        Every claimed ord(pi_q)=j is re-checked by applying pi_q^j and
        confirming return to P, and that no smaller positive exponent works.
    - name: dual_rho_column_check
      object: >-
        Stage 0 table has corrected_rho_bits and inherited_rho_bits
        columns; never mixed unlabeled.

  independent_variables:
    - stage  # 0 | 1 | 2
    - k  # deployed or k_prime
    - d  # toy base-field degree
    - control_kind  # prime | composite_search | null | degenerate | k1
    - seed
    - point_index

  metrics:
    primary:
      - gcd_h_r_pass_per_row
      - t_odd_pass_per_row
      - weil_recursion_pass_per_row
      - corrected_rho_bits_per_row
      - inherited_rho_bits_per_row
      - ord_mu_stated_per_row
      - ord_pi_q_on_G_per_toy_cell
      - pi_2_endomorphism_false_on_B_notin_F2
      - a3_discharge_status
      - composite_search_found
    secondary:
      - pi_2_endomorphism_failures_out_of_N
      - certificate_pass_rate
      - null_reports_no_endomorphism
      - degenerate_detects_pi2_endomorphism
      - peak_rss_bytes
      - wall_s
      - termination_reason
      - literature_unrecovered
      - curves_tried_composite_search

  heuristic_under_test:
    - HEUR-BINSTD-128789-H0
    - HEUR-BINSTD-128789-H1
    - HEUR-BINSTD-128789-H2

  preregistered_prediction:
    quantity: >-
      (A) gcd(h,r)=1 and t odd on all five rows;
      (B) corrected rho bits = [78.10, 93.98, 125.78, 141.71, 173.57]
      (±0.01);
      (C) ord(mu)=k stated per row by k-prime argument;
      (D) Stage 2: ord(pi_q)=5 and 7 on the named (4,5)/(4,7) cells;
      (E) pi_2 is NOT an endomorphism on B-notin-F_2 cells
      (failures = N/N on non-F_2 x);
      (F) Stage 1: A3 discharge via retrieved Aut classification OR
      unrecovered=true;
      (G) composite search: found OR not-found-within-budget (neither
      forced);
      (H) NO break / attack-cost claim under any outcome.
    formula: >-
      corrected_rho_bits = 0.5*log2(r) + 0.5*log2(pi/4) - 0.5*log2(k)
      = log2(sqrt(pi*r/(4*k))) with audited r;
      ord(mu)=k given k prime and mu!=1;
      |<pi_q,[-1]>|=2k given Aut(E)=Z/2.
    source: >-
      IDEA-20260922-c07598 (A)(B)(C)(D); HOLD-B review corrected rows;
      CORR-20260922-81aeab; H-BINSTD-128789
    claim_tier: observational
    measured_vs_modeled: >-
      Stage 0 gcd/Weil/rho bits are RECOMPUTED arithmetic (labeled
      recomputed); inherited d11575/c07598 column is INHERITED/MODELED
      comparator in a separate column. Stage 1 Aut classification extract
      is EXTRACTED (provenance retrieved) or unrecovered. Stage 2
      ord(pi_q), pi_2 checks, and control outcomes are MEASURED with
      certificates.

  scale_relevance:
    tier: toy_plus_deployed_arithmetic
    justification: >-
      Stage 0 uses deployed parameter identities as arithmetic only (no
      group walks). Stage 2 toys at dk'<=28 (and search at 24) access the
      same Frobenius-order mechanism at affordable size; transfer of the
      group-order ARGUMENT to deployed rows is exact group theory on
      audited inputs, not an extrapolation of a measured cost. Aut(E)
      discharge is a literature fact, not a toy transfer.
    correspondence: null

  sample_size_justification: >-
    Stage 0: five fixed rows (complete census). Stage 1: one classification
    source. Stage 2: review requires one certified point of order r plus
    N=100 random prime-subgroup points for the pi_2 check on each prime
    cell; composite search up to 64 curves. Tail: report any point that
    unexpectedly shows pi_2 on-curve or ord!=k'.

  tail_checks:
    - Any prime-k' point with ord(pi_q)!=k' is a hard fail (not averaged away).
    - Report the single smoothest / most anomalous pi_2 check outcome.
    - Composite search must not be scored as forced success/failure.
    - Dual rho columns mandatory.

  replication:
    seeds:
      - 20260926
      - 20261001
      - 20261002
      - 20261003
      - 20261004
    independent_instances: >-
      Stage 0 deterministic. Stage 1 single extraction with source hash /
      bibliographic record. Stage 2: primary seed 20260926 (review);
      additional seeds for point sampling on prime cells; composite search
      uses seeds to draw candidate (A,B) with odd t.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 4
    maximum_runs: 30
    maximum_workers: 1

  stopping_rules:
    - >-
      Stage 0 complete when five-row certificate table, dual rho columns,
      and ECC2K-130 note are written.
    - >-
      Stage 1 complete when Aut classification extraction OR
      unrecovered=true with attempted sources is written.
    - >-
      Stage 2 may start after Stage 0 artifact dir exists (Stage 1 may
      proceed in parallel; A3 discharge status recorded whenever Stage 1
      finishes). Stage 2 complete when prime-cell orders, pi_2 checks,
      null, degenerate, and composite-search report are written.
    - Advisory wall-clock: checkpoint and report; never fabricate completion.
    - Hard stop if any prime-k' cell returns ord!=k' with verified point.

  invalidation_rules:
    - Stage 0 corrected rho bits outside ±0.01 of frozen expected
    - Dual rho columns missing or mixed/unlabeled
    - Null control reports a finite pi_q endomorphism order
    - certificate_pass_rate < 1.0 on claimed orders
    - timeout/crash/OOM → failed_infrastructure, not negative math evidence
    - Amazon Bedrock invocation attempted → abort
    - Claiming retrieved provenance without verified_by / without reading
    - Treating A3 discharged while Stage 1 is unrecovered

  success_criterion: >-
    Stage 0: gcd=1 and t odd on all five; Weil recursion pass; corrected
    rho bits within tolerance; dual columns present; ord(mu)=k stated.
    Stage 1: extraction artifact or unrecovered record present.
    Stage 2: ord(pi_q)=k' on (4,5) and (4,7); pi_2 fails on B-notin-F_2;
    null and degenerate controls pass; composite search reports found or
    not-found-within-budget; certificates verify. Decidable from
    predefined metrics. Success does NOT include a break claim.

  falsification_criterion: >-
    Stage 0 arithmetic outside tolerance or gcd!=1; Stage 2 prime cell
    ord!=k'; Stage 2 pi_2 unexpectedly an endomorphism on B-notin-F_2;
    Stage 1 source shows Aut>Z/2 for j!=0 ordinary binary curves of this
    shape. Distinguish infrastructure via invalidation_rules.

  required_artifacts:
    - experiments/EXP-BINSTD-9d1b8e/stage0/five-row-symmetry-certificate.yaml
    - experiments/EXP-BINSTD-9d1b8e/stage0/dual-rho-bits.yaml
    - experiments/EXP-BINSTD-9d1b8e/stage0/ecc2k130-methodological-note.md
    - experiments/EXP-BINSTD-9d1b8e/stage1/aut-classification-extraction.yaml
    - experiments/EXP-BINSTD-9d1b8e/stage1/a3-discharge-status.yaml
    - experiments/EXP-BINSTD-9d1b8e/stage2/ord-pi-q-table.yaml
    - experiments/EXP-BINSTD-9d1b8e/stage2/pi2-endomorphism-checks.yaml
    - experiments/EXP-BINSTD-9d1b8e/stage2/controls-report.yaml
    - experiments/EXP-BINSTD-9d1b8e/stage2/composite-search-report.yaml
    - experiments/EXP-BINSTD-9d1b8e/stage2/certificates/
    - experiments/EXP-BINSTD-9d1b8e/runs/*/manifest.yaml
    - experiments/EXP-BINSTD-9d1b8e/runs/*/raw-result.json
    - experiments/EXP-BINSTD-9d1b8e/runs/*/stdout.log

  procedure:
    stage0:
      - For each c2pnb row: load audited t,h,r from analysis/binstd-curve-audit/.
      - Recompute h=q+1-t; Weil recursion; verify h*r vs dump; gcd(h,r); t mod 2.
      - Recompute corrected_rho_bits=log2(sqrt(pi*r/(4*k))); place beside inherited column.
      - State ord(mu)=k by k-prime + mu!=1; write five-row-symmetry-certificate.yaml.
      - Write dual-rho-bits.yaml and ecc2k130-methodological-note.md.
    stage1:
      - Attempt retrieval of Silverman Appendix A (or equivalent peer-reviewed char-2 Aut source).
      - Extract j=1/b and Aut={+-1} when j!=0; note supersingular j=0 exception.
      - Confirm audited odd t => ordinary => j!=0 for all five; drop a=0 red herring explicitly.
      - Write a3-discharge-status.yaml: discharged|unrecovered|reopened with provenance.
    stage2:
      - Confirm stage0/ exists.
      - On (4,5) and (4,7) review cells: pick P of order r (h*random); find least j with pi_q^j(P)=P; expect k'.
      - On N=100 prime-subgroup points: apply pi_2; count on-curve failures (expect N/N for x notin F_2).
      - Run NULL-no-subfield and CTRL-degenerate-B-in-F2.
      - Composite SEARCH up to 64 curves at (4,6); write found/not-found report.
      - Certificate-verify every order claim.

  optimistic_assumptions_disclosed:
    - >-
      Treating A3 as closable before Stage 1 source read would be
      optimistic for the "2" in 2k (bias: optimistic for the ledger).
      Protocol forbids silent discharge.
    - >-
      Toy Aut patterns at small fields may over-represent special j
      (proposal confounder); toy Aut!=Z/2 does NOT transfer to deployed
      rows — A3 remains literature-gated.
    - >-
      Composite search budget 64 may miss a rare proper-divisor curve
      (bias: may leave nearby-object control incomplete).

  memory_accounting: >-
    Stage 0/1 negligible. Stage 2: peak_rss_bytes measured per run;
    dominant structures are F_{2^{dk}} field elements and curve point
    arithmetic — analytic size O(dk) bits per element; reconcile measured
    RSS against that in controls-report.yaml.

  assigned_to: executor
  dominated_by: >-
    n/a for attack cost. Matched rho with the CERTIFIED 2k divisor is the
    baseline this experiment exists to pin; sota_delta is table correctness.
  sota_delta:
    time: Zero cryptanalytic movement; certifies 2k not 32k and corrected bits.
    memory: Unaffected.
    data_queries: N/A.
