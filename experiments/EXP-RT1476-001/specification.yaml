experiment:
  id: EXP-SUBRES-001
  hypothesis_id: H-SUBRES-001
  version: 1
  identifier_renumber_note: >-
    IDENTIFIER REPAIR ONLY, UNDER CORR-20260728-001. This experiment was issued as
    EXP-RT1476-001 and published at commit 8f408cdf. That identifier is MALFORMED: the area code
    RT1476 contains digits and tools/validate_ledger.py ID_PATTERNS requires ^EXP-[A-Z]+-\d{3}$,
    so the record failed its id check, was never registered, and every reference to it dangled.
    The record is renumbered to EXP-SUBRES-001. EXP-RT1476-001 is RETIRED AND NEVER REUSED: it
    denoted this contract in published history and may never denote anything else.
    EXACTLY TWO FIELDS CHANGED - id and hypothesis_id - plus this note. NO metric, control,
    success criterion, falsification condition, invalidation rule, stopping rule, budget,
    deviation or interpretation limit is altered, and the frozen protocol is otherwise
    byte-unchanged. S1 remains not met, S2 remains struck as unreachable, and the version-1
    contract remains frozen: this is not a version 2 and does not authorize execution.
    STORAGE PATH IS UNCHANGED AND IS NOT A DEFECT: this record lives at
    experiments/EXP-RT1476-001/specification.yaml and its run set at
    experiments/EXP-RT1476-001/runs/. The directory deliberately keeps the retired name because
    the validator never compares a directory name to an experiment id, while renaming it would
    move 189 hash-bound run files and invalidate the path lists in two committed archive
    receipts. Path and identifier are separate things here; see CORR-20260728-001.
    THE 27 RUN IDS ARE UNCHANGED AND CORRECT: RUN-[A-Za-z0-9._-]+ permits digits, so
    RUN-RT1476-* are valid ids and are immutable. They keep the retired area token; that is
    recorded, not repaired.
  title: >-
    Subresultant-PRS backward-state degree meter for the serial-S3 split of S5:
    measure the RT-1476-SUBRES-A1 exponents beta_deg and beta_ops on toy prime
    fields (Contract A1, sympy/GF(p) port)
  status: approved
  approved_by: coordinator
  approved_by_decision: DEC-20260728-002
  approved_at: '2026-07-28'
  assigned_to: executor
  batch_id: BATCH-010
  goal_id: GOAL-ECDLP-001
  question_id: RQ-ECDLP-002

  lifecycle:
    note: >-
      The three lifecycle steps draft -> review_required -> approved were all taken on
      2026-07-28 in a single Coordinator session. That compression is recorded here rather
      than hidden, because compressing it is a real weakness and a reader must be able to
      see it.
    transitions:
      - to: draft
        at: '2026-07-28'
        basis: >-
          This specification is a port of a pre-existing frozen third-party contract,
          "Contract A1 - Subresultant-PRS backward-state degree meter", at
          inputs/idea_generation_20260718_batch2.md lines 1286-1319 (identical content in
          the dispatcher-supplied external copy
          /Volumes/Volume/git/autolab/research/idea_generation_20260718_batch2.md at the
          same lines). The hypothesis, null, parameters, metrics, both controls, the
          success criterion and the falsification criterion are carried from that contract
          rather than invented here.
      - to: review_required
        at: '2026-07-28'
        basis: >-
          The contract has already absorbed one adversarial pass. The red-team note at
          inputs/idea_generation_20260718_batch2.md lines 1388-1397 materially amended it:
          it forced the fit onto the SUCCESSFUL-membership subset only, because early abort
          helps only the non-relation fraction, and it set the adverse prior beta -> 3/2
          from above. That amendment is carried into metrics.primary and into
          success_criterion below.
      - to: approved
        at: '2026-07-28'
        basis: >-
          Approved by DEC-20260728-002 on Coordinator authority, WITHOUT an independent
          pre-execution design review. That absence is a named weakness, not an oversight.
          Its compensating control is TASK-20260728-003, an independent non-originating
          Validator task that must check run integrity AND, before any evidence record is
          written, whether this frozen protocol could have produced its stated conclusions
          at all. See review_history.
  review_history:
    independent_pre_execution_design_review: none
    why_not: >-
      BATCH-006 spent an entire batch on two independent design reviews of EXP-GGM-001 and
      the experiment still never ran; BATCH-009 spent another entire batch on paper review
      and produced no measurement. The campaign's deficit is measurement, not review. The
      design risk here is bounded because this experiment is a METER: it reports two
      exponents and a support size, and it makes no claim about ECDLP whatever those
      numbers are. Approving a meter without a design review is a smaller risk than never
      measuring the only live sub-rho gate the program has. That trade is a judgement and
      is recorded as one.
    compensating_controls:
      - >-
        TASK-20260728-003 (independent Validator, non-originating session) must return a
        design-adequacy finding as well as an integrity finding, and must recompute both
        exponents itself from raw-result.json without reading the Executor's analysis.
      - >-
        The positive control is a bidirectional meter gate (see controls): if the meter
        cannot detect a PLANTED exponent drop, no primary conclusion may be drawn in either
        direction. A meter that cannot see a drop cannot certify the absence of one.
      - >-
        No evidence record from this experiment's first execution may exceed strength
        preliminary, and no hypothesis may move to supported from it. Recorded in
        interpretation_limits and binding on the reviewing Coordinator.
    known_defect_in_the_frozen_contract_ruled_before_execution: >-
      The frozen contract conflates two different exponents under one symbol beta. Its
      hypothesis line says "degree Theta(q^beta) ... with beta < 0.3"; its red-team line
      predicts "beta -> 3/2 from above" for beta fitted as d log(ops_success)/d log(q).
      Those cannot be the same quantity: a DEGREE exponent of 3/2 would exceed the trivial
      ceiling, and an OPS exponent below 0.3 would be faster than reading the forward
      state. The contract's own success and falsification lines inherit the conflation and
      overlap contradictorily: "beta < 3/2 (ideally < 0.3)" as success against "beta >= 0.3
      at any size" as falsification makes beta in [0.3, 1.5) both a success and a
      falsification. THIS IS RULED, NOT REPAIRED SILENTLY, AND IT IS RULED BEFORE ANY DATA
      EXISTS. The two exponents are separated and each is given its own pre-registered
      threshold in success_criterion and falsification_criterion below. Separating them
      makes the gate strictly HARDER (both thresholds must hold for the alpha < 3/2 claim),
      never easier. This is a pre-registration clarification of an internally inconsistent
      inherited contract, not a criterion change under AGENTS.md, and it is dated before
      execution so that it cannot become one.

  objective: >-
    Measure two exponents on toy prime-field curves and report them. Nothing else.
    (1) beta_deg, the growth exponent in log q of the size of the BACKWARD 3-SUM STATE of
    the serial-S3 split of S5 - equivalently the u-degree of the backward eliminant - over
    the shared Kummer coordinate u.
    (2) beta_ops, the growth exponent in log q of the counted GF(p) operations spent on
    membership queries RESTRICTED TO THE SUBSET THAT PRODUCED A VERIFIED RELATION.
    This experiment is NOT an attack, does not attempt to solve any ECDLP instance, and
    cannot become an attack within this batch. It solves no discrete logarithm, recovers no
    scalar, and produces no cost comparison against rho or BSGS. It measures the size and
    the cost of one intermediate algebraic object at three toy field sizes, the largest of
    which is 24 bits. A favourable measurement would open a question; it would not close
    one, and it would not be a sub-rho attack.
    The uncertainty it reduces is narrow and named: RT-1476-SUBRES-A1 has been the
    program's only live sub-rho gate for 29+ ideation runs and its exponent HAS NEVER BEEN
    MEASURED. Both outcomes are informative. An adverse measurement gives the gate its
    first real negative on a tested scope; a favourable one gives the program its first
    toy-scale reason to look further.

  adverse_prior_stated_before_execution: >-
    THE PRIOR IS AGAINST THE HYPOTHESIS AND IS RECORDED HERE SO THAT A NEGATIVE RESULT IS
    NOT A SURPRISE THAT INVITES REINTERPRETATION. The red-team note at
    inputs/idea_generation_20260718_batch2.md lines 1388-1397 states the objection in full:
    "subresultant PRS changes *how* you avoid storing the eliminant, not *what* it costs.
    The backward 3-sum eliminant has degree ~q in the surviving variable, and PRS on a
    degree-q object is Omega(q^{3/2}) field ops even with early abort - because early abort
    only helps the non-relation fraction, not the relation-producing fraction". Its
    prediction is explicit: "the exponent beta -> 3/2 from above", making the null the
    strong prior. Independently, the naive combinatorial ceiling for the backward 3-sum
    state at balanced m=5 sizing is |V|^3 = q^{3/5}, i.e. beta_deg = 0.6, which is twice
    the 0.3 gate: the hypothesis asks for a factor-q^{0.3} structural collapse that nothing
    in the corpus predicts. The one written argument that tried to formalise the closure,
    BAR-PATHDYN-CONDTAIL-D2, DID NOT SURVIVE adversarial review (RT-20260727-001,
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/redteam/TASK-20260727-003/barrier_verdict.yaml),
    and that red team recorded its own consequence in terms: "a broken barrier is not a
    positive result for RT-1476-SUBRES-A1 - the gate is merely still open ... THIS TASK
    DOES NOT CLOSE THE GATE, AND IT DOES NOT OPEN IT." So the gate is open, the prior is
    adverse, and neither of those facts is evidence. Recording the prior in advance is what
    makes the eventual number interpretable: if beta_deg comes back at or above 0.6, that
    is the predicted outcome and must be reported as such, not re-described as an
    unexpected artifact of the port.

  inputs:
    reference_contract:
      in_repo_path: inputs/idea_generation_20260718_batch2.md
      lines: 1286-1319
      redteam_amendment_lines: 1388-1397
      external_copy_supplied_by_dispatcher: >-
        /Volumes/Volume/git/autolab/research/idea_generation_20260718_batch2.md, same line
        numbers, content confirmed identical at lines 1286-1319 by direct read. The in-repo
        path is authoritative for reproduction because the external path is outside this
        repository and is not archived by any commit here.
    gate_of_record:
      id: RT-1476-SUBRES-A1
      as_recorded_in: inputs/main_research_ledger.md
      text: >-
        "does the serial-S3 backward-3-sum eliminant degree exponent beta (measured on the
        SUCCESSFUL-membership subset per red-team) stay below 3/10, giving membership-query
        alpha<3/2 and a sub-rho m=5 IC? Strong prior beta->3/2."
    field_sizes:
      p_values: [1009, 65521, 16769023]
      bit_lengths_of_those_moduli: [10, 16, 24]
      primality_not_assumed: >-
        The Executor must verify at run time that each p is prime and record the check in
        raw-result.json. 1009 and 65521 are well known primes; 16769023 is carried from the
        frozen contract and its primality is NOT asserted here. If any p fails the check
        the run STOPS and reports it. Substituting a different modulus is forbidden: it
        would silently change the frozen protocol.
    curve_predicate:
      short_weierstrass: 'y^2 = x^3 + a*x + b over F_p'
      required:
        - '#E(F_p) = n is PRIME (prime-order curve, so the group is its own prime-order subgroup)'
        - 'ordinary, i.e. trace t = p + 1 - n satisfies t mod p != 0 (equivalently n != p + 1)'
        - 'non-anomalous, i.e. n != p'
        - 'j(E) not in {0, 1728}'
        - 'non-singular, i.e. 4*a^3 + 27*b^2 != 0 mod p'
      sampling: >-
        Deterministic from (p, seed): draw (a, b) from a SHA-256 seed stream, test the
        predicate, and accept the first curve that passes. Record the number of rejected
        candidates per cell. Rejection is a property of the sampler and is not evidence.
      implementation_constraint_recorded_because_it_is_a_real_trap: >-
        Do NOT obtain these curves via harness.toycurve.generate_instance. That function
        chooses p ITSELF from the seed and cannot be told to use 16769023, and it calls the
        naive O(p) EllipticCurve.order() whenever field_bits <= 24, which at p = 16769023
        is 16.7 million modular exponentiations per candidate curve and will exhaust the
        budget on curve generation alone. Construct harness.toycurve.EllipticCurve(p, a, b)
        directly and use order_bsgs() (O(sqrt p) scalar multiplications) for the group
        order. This is an implementation constraint, not a scientific one.
    seeds: [20260728, 20260729, 20260730]
    group_order_symbol: >-
      q := n, the prime group order of the sampled curve, not p. Both are recorded per run.
      By Hasse |n - (p+1)| <= 2*sqrt(p), so log q and log p agree to within o(1) at these
      sizes, but every fit uses the measured q.
    factor_base:
      geometry: x-line (x-coordinates of points of E, the standard Semaev/Gaudry factor base)
      size_rule: 'L = round(q^(1/5))  (balanced m=5 sizing, per the frozen contract)'
      expected_values_are_arithmetic_not_measurement: >-
        For the three stated moduli the rule gives L approximately 4, 9 and 28. Those are
        arithmetic on the stated p, recorded to make the scale visible; the actual L is
        computed from the measured n of each sampled curve.
      construction: >-
        harness.semaev.build_factor_base(inst, L, seed) or an equivalent deterministic
        draw of L distinct on-curve x-coordinates. The exact V is written to
        raw-result.json so the whole run is reconstructible.
    decomposition_architecture:
      arity: 'm = 5'
      split: 'serial-S3, 2 | 3 (forward 2-sum meets backward 3-sum at the shared Kummer coordinate u)'
      forward_leg: >-
        S3(x1, x2, u) = 0 with x1, x2 in V. The forward state F is the set of u attainable
        this way; |F| <= L*(L+1)/2.
      backward_leg: >-
        S3(u, x3, w1) = 0, S3(w1, x4, w2) = 0, S3(w2, x5, x_R) = 0 with x3, x4, x5 in V.
        Eliminating w1, w2 and the three factor-base variables leaves the BACKWARD
        ELIMINANT B_R(u) in F_p[u]. The BACKWARD STATE is the set of its roots that are
        actually attainable, i.e. {u : exists x3,x4,x5 in V satisfying the chain}.
      relation_predicate: >-
        A candidate is a genuine relation only if an explicit choice of signs gives the
        group identity (+/-)P1 (+/-)P2 (+/-)P3 (+/-)P4 (+/-)P5 = R on E. S3 is an x-only
        (Kummer) relation and does NOT determine signs; a root of B_R(u) in the forward
        state is a CANDIDATE, never a relation, until the group law is checked. Treating a
        Kummer coincidence as a relation would inflate the success subset, which is the one
        subset this whole experiment turns on.
    software_environment:
      language: 'Python 3'
      available: [sympy, numpy, 'harness/ (in-repo)']
      unavailable: 'Sage (see deviations_from_frozen_contract)'
      harness_functions_available:
        - 'harness.semaev: s2, s3_expr, s3_eval, s4_expr, build_factor_base, measure_s3_decomposition, verify_decomposition_certificate'
        - 'harness.toycurve: EllipticCurve (add, mul, negate, lift_x, order, order_bsgs, is_on_curve), ECDLPInstance, generate_instance'

  independent_variables:
    - 'q (three toy sizes, via p in {1009, 65521, 16769023})'
    - 'seed (three per size)'
    - 'arm (main | positive_control | negative_control)'

  metrics:
    primary:
      - id: backward_state_support_size
        definition: >-
          |{u in F_p : exists (x3,x4,x5) in V^3 with S3(u,x3,w1)=0, S3(w1,x4,w2)=0,
          S3(w2,x5,x_R)=0 for some w1,w2}|, computed EXACTLY by exhaustive enumeration over
          V^3 (at most 28^3 = 21952 chain evaluations at the largest size) using
          harness.semaev.s3_eval and the group law, never by a CAS.
        why_primary: >-
          This is the size of the object the hypothesis is about, it is exact, it is cheap,
          and it depends on no computer-algebra implementation whatsoever. It is the single
          most robust number this experiment produces and it survives every substitution in
          deviations_from_frozen_contract.
        unit: count
      - id: deg_u_backward_eliminant
        definition: >-
          deg_u of the first nonzero subresultant in u of the backward chain, computed by
          subresultant PRS over GF(p) with the factor-base constraint polynomials
          f_V(x_i) = prod_{v in V}(x_i - v).
        relation_to_the_first_metric: >-
          deg_u B_R >= backward_state_support_size, with equality if and only if B_R is
          squarefree and carries no unattainable roots. The two are DIFFERENT quantities and
          are NOT to be merged. Both are reported wherever both exist, together with their
          ratio. A systematic gap between them is itself a finding and must be reported, not
          reconciled away.
        may_time_out: true
        timeout_consequence: >-
          A timeout here contributes no degree datum and is recorded as infrastructure
          signal under AGENTS.md rule 5. It does NOT invalidate the run, because
          backward_state_support_size is still measured, and it is never reported as a
          negative mathematical result.
        unit: degree
      - id: ops_success
        definition: >-
          Counted GF(p) operations (multiplications, additions/subtractions and inversions
          counted separately and combined by a declared weighting) spent on membership
          queries RESTRICTED TO TARGETS THAT PRODUCED AN INDEPENDENTLY VERIFIED RELATION
          CERTIFICATE. This is the red-team's restriction and it is binding: abort
          speedups on the non-relation fraction are excluded, because early abort helps only
          the non-relation fraction and the alpha < 3/2 claim must hold on the
          relation-producing fraction.
        instrumentation_requirement: >-
          The counter must be a real instrumented integer incremented inside a
          hand-written GF(p) arithmetic layer used by the PRS inner loop. It must NOT be
          derived from wall-clock, and it must NOT be estimated from a black-box CAS call.
          If a black-box sympy routine is used for any part of the query path, the
          operations inside it are UNCOUNTABLE and the run must record ops_success as null
          with the reason, rather than substituting a proxy.
        unit: field operations
      - id: beta_deg
        definition: 'fitted slope of log(backward_state_support_size) versus log(q), and separately of log(deg_u_backward_eliminant) versus log(q)'
        reported_as: 'three-point pooled slope AND all three pairwise slopes AND the per-seed slopes'
      - id: beta_ops
        definition: 'fitted slope of log(ops_success) versus log(q)'
        reported_as: 'three-point pooled slope AND all three pairwise slopes AND the per-seed slopes'
    secondary:
      - id: prs_step_count
        definition: 'total number of subresultant-PRS steps, i.e. the summed length of the remainder degree sequences over the eliminations'
        note: 'the PRS VARIANT actually used must be declared in the run record; the step count is intrinsic to the input pair only relative to a declared variant'
      - id: ops_all
        definition: 'the same instrumented counter over ALL membership queries, success and failure alike'
        note: 'reported for contrast with ops_success. It is NEVER the basis of beta_ops. The gap between them is exactly the abort speedup the red team said must be excluded, so publishing both makes the exclusion auditable.'
      - id: success_rate
        definition: 'certified relations divided by targets queried, per cell'
        heuristic_expectation: 'approximately L^5/(5! q), i.e. about 1/120 at balanced sizing. Recorded as an expectation to compare against, never as a substitute for the measurement.'
      - id: forward_state_size
        definition: '|F|, the number of distinct u reachable from V x V through the forward leg'
      - id: coefficient_profile
        definition: 'number of nonzero coefficients of B_R and its density, plus ceil(log2 p) as the per-coefficient bit ceiling'
        substitution_declared: >-
          The frozen contract asks for "coefficient bit-size (Collins/Brown bound check)".
          Over GF(p) with p fixed per cell that check is VACUOUS: every coefficient is
          bounded by ceil(log2 p) bits by construction, so the Collins/Brown growth bound
          has nothing to bound. It is recorded not_applicable_over_GF_p and the nonzero
          coefficient count is reported in its place as a sparsity diagnostic. This is a
          metric substitution, is declared as one, and the substituted quantity carries no
          part of any conclusion.
      - id: wall_clock_seconds
        definition: 'per-query, per-cell and total elapsed time'
        note: 'DIAGNOSTIC ONLY. It is not comparable to any Sage run and is never the basis of beta_ops. See deviations_from_frozen_contract.'
    metric_isolation_rule_anti_tautology: >-
      NO THRESHOLD, EXPECTED VALUE OR VERDICT MAY BE VISIBLE TO THE MEASURING CODE PATH.
      The numbers 0.3, 0.6, 0.2 and 1.5 appear in this specification and in the analysis
      step; the module that computes support sizes, degrees and operation counts must not
      read them, must not branch on them, and must not emit a pass/fail verdict. Comparison
      against thresholds happens afterwards, in analysis.md and again independently in the
      Validator's own recomputation from raw-result.json. This rule exists because
      EXP-GGM-001 reported a 4/4 control gate that compared two string literals held in the
      same source file, returned 4/4 on every possible execution, and appeared in no run
      artifact (REV-20260727-002, adopted by DEC-20260727-007). Every gate in this
      experiment compares a MEASURED quantity against a threshold held outside the
      measuring module, and every per-run gate value is written into raw-result.json.

  preregistered_prediction:
    quantity: backward_state_support_size as a function of q at balanced m=5 sizing
    formula: >-
      Generic/null expectation: |backward state| = Theta(min(L^3, q)) = Theta(q^{3/5}),
      i.e. beta_deg = 0.6, since the backward leg composes three independent factor-base
      choices with L = q^{1/5} and no structural collapse. Hypothesis expectation:
      beta_deg < 0.3, i.e. a factor-q^{0.3} collapse of that state.
    source: >-
      The q^{3/5} form is elementary counting on the frozen architecture (three free
      factor-base variables at L = q^{1/5}), stated here as the null so it is fixed before
      data exists. It is a counting expectation, NOT a theorem about the eliminant degree,
      and it is labelled as such. The beta_ops -> 3/2 prior is the red team's, cited above.

  scale_relevance:
    tier: toy
    justification: >-
      Mechanical, not negotiable. docs/claims-and-verification.md sets the toy tier at max
      field bit size <= 32. The three moduli are 10, 16 and 24 bits, so the largest field
      tested is 24 bits and the tier is toy by the stated rule. Nothing this experiment
      produces at any outcome can be medium-tier or crypto-tier evidence.
    correspondence: null
  claim_tier_basis: >-
    TOY, AND UNREACHABLE ABOVE BY THIS PROTOCOL AT ANY OUTCOME. p up to 16769023 is 24
    bits. A 24-bit field is roughly 2^232 times smaller than a 256-bit curve; the factor
    base has 28 elements; the entire backward state at the largest size is at most 21952
    points and is enumerated exhaustively. An exponent fitted over three points spanning
    log q from about 6.9 to about 16.6 - a factor of 2.4 in log q - has wide and largely
    unquantified uncertainty, and three points cannot distinguish a power law from a
    logarithmic correction or a slowly turning curve. THEREFORE: no result of this
    experiment, in either direction, is evidence about cryptographic-size curves, about
    prime-field ECDLP hardness, about index calculus at any relevant scale, or about
    KN-OPEN-001. A favourable beta_deg would be a toy-scale trend worth a scaling study and
    nothing more. An adverse beta_deg closes the gate ON THE TESTED SCOPE ONLY - these
    curves, these three sizes, this factor-base geometry, this solver, this budget - and is
    not a universal impossibility claim about any m, any sizing, or any other split.

  controls:
    - id: CTRL-POS
      kind: positive
      arm: positive_control
      contract_text: 'contrived curve with a known low-degree backward state (verify meter reports small beta)'
      concrete_construction: >-
        Same curve, same p, same seed, same L, same everything, EXCEPT that the factor base
        is planted: V_pos = {x([i]P) : i = 1..L} for the curve's base point P of prime
        order n. Because the group is cyclic of prime order, the 3-sum state reachable from
        V_pos has index set contained in {+/-i +/-j +/-k : 1 <= i,j,k <= L}, an interval of
        size at most 6L - 3. So the planted backward state has size Theta(L) = Theta(q^{1/5}),
        i.e. beta_deg approximately 0.2, against the generic 0.6. That is a planted
        threefold exponent drop, and it is well below the 0.3 gate.
      what_it_tests: >-
        Whether the meter can SEE an exponent drop that is known to be there. This is a
        bidirectional gate: if the meter reports beta_deg >= 0.3 on CTRL-POS, then the meter
        cannot detect a factor-q^{0.4} collapse, and therefore its report on the main arm
        cannot certify the ABSENCE of a collapse either. In that case no primary conclusion
        may be drawn in either direction and the run set goes back to the Executor.
      honesty_note: >-
        V_pos is contrived using the discrete logarithms of its own elements. That is
        precisely the information an attacker does not have. CTRL-POS is a calibration of
        the instrument and is NOT an attack, not a speedup, and not evidence that any
        realizable factor base has a small backward state.
    - id: CTRL-NEG
      kind: negative
      arm: negative_control
      contract_text: 'random dense trivariate system of equal total degree (expect beta ~ 3/2 on successes)'
      concrete_construction: >-
        Replace each S3 link in the chain by a random dense polynomial over GF(p) of the
        same total degree and the same per-variable degrees as S3 (degree 2 in each of its
        three variables), drawn deterministically from the seed, keeping the same
        factor-base constraint polynomials f_V of degree L, the same q, the same L, and the
        same number of targets.
      what_it_tests: >-
        Whether the meter reports GENERIC behaviour on a system with no elliptic structure.
        Expectation: backward_state_support_size = Theta(L^3) = q^{0.6} and no collapse.
      comparability_limit_declared: >-
        A random dense system HAS NO GROUP LAW, so there is no certificate and no genuine
        relation. CTRL-NEG's "success" predicate is therefore DIFFERENT from the main arm's:
        it is root-existence in the forward state, not a verified group identity. CTRL-NEG's
        beta_ops is consequently comparable to the main arm's IN TREND ONLY, never in level,
        and any comparison of levels between the arms is invalid. This limitation is
        declared here so it cannot be discovered afterwards.

  control_comparability_requirements:
    - 'identical p, n, L, seed stream, target count, PRS variant and operation counter across all three arms of a cell'
    - 'all three arms of a cell executed in the same session on the same machine, with the environment recorded once and referenced by all three'
    - 'arms differ in exactly one declared respect each (planted factor base for CTRL-POS; randomized chain links for CTRL-NEG) and in nothing else'
  control_comparability_requirements_placement_note: >-
    This key is a SIBLING of controls:, not a property of CTRL-NEG. It states requirements that
    bind across all three arms of a cell, so it cannot belong to one arm. It was written at the
    sequence-item indent level in the first draft, which terminated the controls: block sequence
    illegally and made this file unparseable; the dispatching session caught that before any
    commit. The repair is indentation only. No requirement was added, removed or reworded.

  sampling_design:
    why_two_sample_stages: >-
      A uniformly random target decomposes over a balanced factor base with probability
      approximately 1/5! = 1/120, so most targets produce NO relation and the SUCCESS
      subset is thin. Reaching a usable success subset needs on the order of a thousand
      targets per cell, and computing an eliminant for each of a thousand targets is not
      affordable. The design therefore separates a cheap screening stage from an expensive
      measurement stage, which also makes the success/non-success comparison the red team
      asked for actually available rather than assumed.
    stage_A_screening:
      targets_per_cell: 1200
      target_construction: 'R = [r]P with r drawn uniformly from [1, q-1] by the deterministic seed stream. UNIFORM RANDOM TARGETS ONLY.'
      method: >-
        Meet-in-the-middle certification over V: build the signed 2-sum table and the signed
        3-sum table once per cell, then for each target test whether R minus a 2-sum lies in
        the 3-sum table. Every hit is materialised as an explicit 5-tuple of signed
        factor-base points.
      output: 'the certified-success set S and the failure set for each cell, with counts'
      planted_targets_are_forbidden_in_the_fit: >-
        Constructing targets by summing five random factor-base points would guarantee
        success but would sample a DIFFERENT distribution - targets weighted by their number
        of decompositions. If the Executor also runs a planted-target diagnostic it must be
        recorded in a separate, clearly labelled block, must never be pooled into the
        beta_ops fit, and must not be presented as the success subset.
    stage_B_measurement:
      measured_targets_per_cell: 'ALL certified successes from stage A (expected order 10), PLUS an equal-sized random subsample of stage-A failures as a matched non-success arm'
      why_the_matched_failure_arm: >-
        The whole red-team objection is that the success subset behaves differently from the
        aggregate. Measuring both arms under identical instrumentation is the only way to
        SHOW that rather than assert it. The matched failure arm is a diagnostic; beta_ops
        is fitted on the success arm alone, exactly as the contract requires.
    certificate_requirement:
      every_claimed_success_carries: >-
        an explicit certificate {target R, five signed summand points, curve (p,a,b)} written
        to certificates.json, re-verified INDEPENDENTLY by the run wrapper via
        harness.semaev.verify_decomposition_certificate or an equivalent group-law check
        written for 5 summands, with the verification result recorded per certificate.
      unverified_success_is_not_a_success: >-
        A claimed relation whose certificate does not re-verify is not a relation. If any
        certificate fails, the whole cell is invalid and returns to the Executor.

  replication:
    seeds: [20260728, 20260729, 20260730]
    independent_instances: 9
    note: >-
      Three independently sampled curves per field size. Three seeds is the frozen
      contract's figure and is enough to expose gross seed sensitivity; it is NOT enough to
      put a confidence interval on an exponent, and no confidence interval may be reported
      as if it were. Whether nine cells constitute replication for evidence purposes is a
      question the reviewing Coordinator must answer explicitly rather than assume.

  runs:
    naming: 'RUN-RT1476-<arm>-p<p>-s<seed>, arm in {main, posctl, negctl}'
    count: 27
    enumeration: '3 arms x 3 field sizes x 3 seeds'

  budget:
    wall_clock_seconds_per_run: 900
    total_wall_clock_seconds: 7200
    total_cpu_hours: 2
    maximum_memory_gb: 4
    maximum_runs: 27

  stopping_rules:
    - id: STOP-1
      rule: 'Any single eliminant/PRS computation exceeding 900 seconds is aborted, recorded as timeout with its elapsed time, and contributes no degree datum.'
      consequence: 'Infrastructure signal under AGENTS.md rule 5. NEVER a negative mathematical result. backward_state_support_size is still measured for that target.'
    - id: STOP-2
      rule: 'Any single cell (arm x size x seed) exceeding 1800 seconds is closed where it stands and reported partial, with the exact subset of targets completed.'
      consequence: 'The cell contributes whatever it completed. Missing values stay missing and are reported as missing.'
    - id: STOP-3
      rule: 'Total experiment wall clock 7200 seconds. On exhaustion, stop and report the cells completed.'
      consequence: 'Do not extrapolate, estimate, or interpolate an uncompleted cell. A missing cell is reported as missing.'
    - id: STOP-4
      rule: 'If the frozen protocol cannot be implemented as specified, STOP and report the blocking defect with the exact obstruction.'
      consequence: 'Do not improvise a different measurement and report it under this experiment id. A substituted measurement is a different experiment and needs its own specification and its own approval.'

  invalidation_rules:
    - id: INVALID-1
      rule: 'Fewer than 5 certified successes in a primary cell.'
      consequence: 'beta_ops is NOT fitted for that cell; the cell is marked insufficient_success_subset. The degree gate may still be complete for that cell.'
    - id: INVALID-2
      rule: 'Any sampled curve failing the curve predicate is rejected and redrawn deterministically; the rejection count is recorded.'
      consequence: 'Sampler property, not evidence.'
    - id: INVALID-3
      rule: 'Any claimed success whose certificate fails independent re-verification.'
      consequence: 'The entire cell is INVALID and returns to the Executor with the failing certificate named.'
    - id: INVALID-4
      rule: 'CTRL-POS does not report beta_deg < 0.3 (the meter fails to see the planted threefold exponent drop).'
      consequence: >-
        THE METER IS NOT DEMONSTRATED SOUND AND NO PRIMARY CONCLUSION MAY BE DRAWN IN EITHER
        DIRECTION. In particular the main arm may not then be read as evidence against the
        hypothesis. This is the single most important gate in the experiment.
    - id: INVALID-5
      rule: 'CTRL-NEG reports beta_deg materially below the generic 0.6 without an explanation derived from the run data.'
      consequence: 'The meter under-reports on a structureless system; same consequence as INVALID-4.'
    - id: INVALID-6
      rule: 'Any disagreement between raw-result.json and the summary/analysis, any missing manifest field required by the AGENTS.md artifact policy, any run whose recorded seed does not reproduce its recorded inputs, or any two runs that are byte-identical when their inputs differ.'
      consequence: >-
        The run set is INVALID and returns to the Executor with the defects listed. The
        byte-identity check is included because EXP-GGM-001 shipped nine byte-identical
        raw-result.json files from one computation and called it nine runs.
    - id: INVALID-7
      rule: 'ops_success cannot be produced as a counted integer from instrumented GF(p) arithmetic.'
      consequence: >-
        beta_ops is recorded as NOT MEASURED with the reason. It must not be replaced by a
        wall-clock proxy, and any conclusion depending on beta_ops is unavailable.

  success_criterion: >-
    BOTH of the following, on the SUCCESS subset, across all three field sizes, with a flat
    or decreasing trend in the pairwise slopes:
    (S1) beta_deg < 0.3 - the RT-1476-SUBRES-A1 gate of record ("stay below 3/10"), measured
    on backward_state_support_size and, where available, corroborated by
    deg_u_backward_eliminant; AND
    (S2) beta_ops < 3/2 - the membership-query cost exponent, fitted on ops_success only.
    Both must hold, and CTRL-POS must have passed INVALID-4, before the measurement may be
    described as consistent with alpha < 3/2. Meeting S1 and S2 would NOT establish a
    sub-rho attack, would NOT close RQ-ECDLP-002, and would NOT be evidence above toy tier.
    It would establish exactly one thing: that at three toy sizes the backward state is
    smaller and cheaper than the generic count predicts, which is a reason to design a
    larger scaling study.

  falsification_criterion: >-
    ANY of the following, with CTRL-POS having passed INVALID-4 so that the meter is known
    to be able to see a drop:
    (F1) beta_deg >= 0.3 at any of the three sizes; or
    (F2) the pairwise slopes of beta_deg are increasing with q; or
    (F3) beta_ops >= 3/2 on the success subset at any size.
    Any of these falsifies the hypothesis ON THE TESTED SCOPE. Scope of the falsification,
    stated in advance: these sampled prime-order curves, these three moduli, this x-line
    factor base at L = round(q^(1/5)), the serial-S3 2|3 split at m = 5, this sympy/GF(p)
    implementation, and this budget. It closes nothing about other arities, other splits,
    other factor-base geometries, other field sizes, or ECDLP generally, and it is not a
    universal impossibility claim.
  intermediate_outcome_branch_preregistered: >-
    The three-way landing is fixed now, before data exists, because the inherited contract's
    overlapping criteria left it ambiguous. (a) beta_deg < 0.3: gate favourable, hypothesis
    supported at toy tier and preliminary strength at most, scaling study is the next
    decision. (b) 0.3 <= beta_deg < 0.6: gate FAILS - the hypothesis is falsified on the
    tested scope by F1 - but the generic null is ALSO not reproduced, and that intermediate
    band is itself an observation that must be reported as an observation and not rounded to
    either end. (c) beta_deg >= 0.6: gate fails and the generic count is reproduced; this is
    the predicted outcome under the adverse prior.

  required_artifacts:
    per_run:
      - 'manifest.yaml with the full AGENTS.md artifact policy block: exact command; git commit and dirty-tree state; environment and dependency versions; input parameters and seeds; requested model policy, backend and resolved runtime model identifier; model provenance and probe-verification status; reasoning effort, fallback_used, degraded_requirements; validity status and reason; timestamps and resource measurements'
      - 'raw-result.json: every measured quantity per target, the factor base V, p, a, b, n, L, the per-target support size, degree (or timeout), PRS step count and variant, op counters, and the per-run gate values'
      - 'certificates.json: every claimed relation with its five signed summands and its independent re-verification result'
      - 'command.txt'
      - 'environment.json'
      - 'stdout.log and stderr.log, actually captured and non-empty where output occurred'
    per_experiment:
      - 'experiments/EXP-RT1476-001/subresultant_meter.py - the measurement module'
      - 'experiments/EXP-RT1476-001/implementation_notes.md - the exact algebraic chain implemented, the PRS variant, the GF(p) arithmetic layer, and every place the implementation had to choose something the specification did not fix'
      - 'experiments/EXP-RT1476-001/analysis.md - the fits, all pairwise slopes, both control outcomes, and the threshold comparisons (which live here, never in the module)'
      - 'experiments/EXP-RT1476-001/results_summary.json - the per-cell and pooled exponents, machine readable, derived only from the raw files'
      - 'experiments/EXP-RT1476-001/runs/INDEX.json - the run index, described below'
  run_index_required:
    path: experiments/EXP-RT1476-001/runs/INDEX.json
    written_by: TASK-20260728-001
    content: >-
      A machine-readable index of the run set. For every run directory actually produced it
      records the RUN id, the arm, p, the seed, the per-run validity status, and the exact
      repository-relative path of every file that directory contains. It is written as the last
      act of the execution and is the authoritative enumeration of what the run set consists of.
      A run directory that exists but is absent from INDEX.json, or an INDEX.json entry with no
      directory behind it, is a defect the Validator must report.
    why_it_exists: >-
      PATH-SHAPE REPAIR, RECORDED RATHER THAN SLIPPED IN. The first draft of this batch declared
      the DIRECTORY experiments/EXP-RT1476-001/runs/ as a task artifact_path. The dispatcher
      rejected it before any commit: tools/research_dispatch.py requires every artifact_path to be
      an exact repository-relative FILE path, because a directory cannot be hash-bound and
      hash-binding is the entire point of the rule. INDEX.json is the fix. It is one exact file,
      it is hash-bindable, and it gives the snapshot archive a mechanical, non-discretionary
      source from which to expand the run-file list it must stage and bind individually. This
      changes no metric, no control, no criterion, no budget and no interpretation limit; it
      changes only how the run set is DECLARED and VERIFIED.

  reproduction_command: >-
    python3 experiments/EXP-RT1476-001/subresultant_meter.py --p 1009,65521,16769023
    --seeds 20260728,20260729,20260730 --targets 1200 --arms main,posctl,negctl
    --out experiments/EXP-RT1476-001/runs/
  first_executable_command: >-
    python3 experiments/EXP-RT1476-001/subresultant_meter.py --p 1009 --seeds 20260728
    --targets 60 --arms main --dry-run

  deviations_from_frozen_contract:
    - id: DEV-1
      severity: high
      what: 'Sage is not available in this environment. The contract''s reproduction command is a .sage script and cannot be run.'
      substitution: 'Python 3 with sympy and numpy over GF(p), on top of the in-repo harness/ elliptic-curve and Semaev code.'
      metrics_that_SURVIVE_the_substitution:
        - 'backward_state_support_size - exact, computed by enumeration over V^3, uses no computer-algebra system at all. Fully implementation-independent.'
        - 'deg_u_backward_eliminant - a property of the polynomial system over GF(p), not of the CAS that computes it. Any correct implementation returns the same integer.'
        - 'prs_step_count - the remainder degree sequence of a PRS over a field is determined by the input pair, so the step count is implementation-independent CONDITIONAL ON the declared PRS variant, which the run record must state.'
        - 'ops_success and beta_ops - IF AND ONLY IF the counter is a real instrumented integer over a hand-written GF(p) layer, as metrics.primary requires. A counted operation is implementation-independent up to the algorithm; a timed one is not. If the count cannot be produced, INVALID-7 applies and beta_ops is recorded as not measured.'
        - 'success_rate, forward_state_size, certificate verification - all combinatorial or group-law facts, independent of the CAS.'
      metrics_that_DO_NOT_SURVIVE_the_substitution:
        - 'WALL-CLOCK. sympy''s subresultant PRS over GF(p) has entirely different performance characteristics from Sage''s, which is compiled and uses different polynomial representations. Wall-clock from this port is NOT comparable to a Sage run and must never be used to fit beta_ops, to compare against any published timing, or to support any cost claim. It is retained as a diagnostic and as the basis for the timeout rules only.'
        - 'COEFFICIENT BIT-SIZE / Collins-Brown growth check. It is vacuous over GF(p): every coefficient is bounded by ceil(log2 p) bits by construction, so there is no growth to bound. Recorded not_applicable_over_GF_p, with nonzero-coefficient count reported in its place as a declared substitute that carries no conclusion. The contract''s expected failure mode "coefficient blow-up dominating even if degree small" is therefore NOT TESTABLE by this port and is recorded as untested rather than as absent.'
      risk: >-
        The load-bearing metrics are the degree/support metrics and the counted operations,
        and those survive. The two that do not survive are the two that would have supported
        a cost comparison, so this port can measure the EXPONENT but cannot support any
        statement about absolute cost, about competitiveness with rho, or about how the same
        computation would behave in Sage.
    - id: DEV-2
      severity: medium
      what: 'The frozen contract writes one symbol beta for two different exponents (degree and operations) and its success and falsification lines overlap contradictorily on the band [0.3, 1.5).'
      substitution: 'Separated into beta_deg and beta_ops with independent pre-registered thresholds; three-way landing pre-registered in intermediate_outcome_branch_preregistered.'
      timing: 'Ruled 2026-07-28, before any execution and before any data exists. It makes the gate harder, not easier.'
    - id: DEV-3
      severity: medium
      what: 'The contract does not say how targets are drawn or how many, and at balanced sizing only about 1 target in 120 decomposes at all.'
      substitution: 'Two-stage design in sampling_design: 1200 uniformly random targets screened by meet-in-the-middle per cell, then eliminant/PRS measurement on all certified successes plus a matched failure subsample.'
      why: 'Without this the SUCCESS subset would be empty or a handful of targets and the metric the red team required would not exist. The alternative - planting targets - samples a different distribution and is explicitly forbidden in the fit.'
    - id: DEV-4
      severity: low
      what: 'The contract says "random ordinary prime-order E/F_p" but the in-repo generator harness.toycurve.generate_instance chooses p itself and returns the largest prime-order SUBGROUP rather than a prime-order curve.'
      substitution: 'Direct construction of EllipticCurve(p, a, b) with rejection sampling on the full curve predicate and order_bsgs() for the group order.'
    - id: DEV-5
      severity: low
      what: 'Run-directory naming and artifact layout are not specified by the contract.'
      substitution: 'Fixed in runs.naming and required_artifacts above so the run set is checkable.'

  interpretation_limits:
    - >-
      THIS IS NOT AN ATTACK AND CANNOT BECOME ONE IN THIS BATCH. No discrete logarithm is
      solved, no scalar is recovered, no relation is collected into a linear algebra stage,
      no descent is performed, and no comparison against Pollard rho or BSGS is made. Two
      exponents are measured on 24-bit-and-smaller toy curves.
    - >-
      MAXIMUM CLAIM TIER IS toy AND IS UNREACHABLE ABOVE AT ANY OUTCOME. See
      claim_tier_basis.
    - >-
      MAXIMUM EVIDENCE STRENGTH FROM THE FIRST EXECUTION IS preliminary. A single
      unreplicated run set may not carry replicated or strong, no hypothesis may move to
      supported from it, and reject_scoped on a single unreplicated empirical-only run set
      is forbidden outright - an adverse result takes weaken plus replication.
    - >-
      THREE POINTS. beta is fitted over log q from about 6.9 to about 16.6, a factor of 2.4.
      Three points cannot distinguish a power law from a logarithmic correction or from a
      slowly turning curve, and the smallest cell has a factor base of about 4 elements
      where constants dominate everything. All raw counts must be reported alongside every
      fitted slope, and no fit may be reported without its pairwise slopes.
    - >-
      A NEGATIVE RESULT CLOSES ONLY THE TESTED SCOPE. Falsification here says nothing about
      other arities m, other splits, other factor-base geometries, other field sizes, larger
      fields, or ECDLP in general, and it is not a universal impossibility claim.
    - >-
      A POSITIVE RESULT OPENS A QUESTION, NOT A WINDOW. It would license one thing: designing
      a larger scaling study. It would not license a sub-rho claim, a cost model, or any
      statement about cryptographic curves.
    - >-
      TIMEOUTS, CRASHES AND MEMORY EXHAUSTION ARE INFRASTRUCTURE SIGNALS AND ARE NEVER
      EVIDENCE AGAINST THE HYPOTHESIS (AGENTS.md rule 5).
    - >-
      THE POSITIVE CONTROL USES THE DISCRETE LOGARITHMS OF ITS OWN FACTOR BASE. It calibrates
      the instrument and is not a realizable factor base, a speedup, or evidence that any
      attacker-constructible factor base has a small backward state.
    - >-
      NOTHING HERE BEARS ON KN-OPEN-001, on H-GGM-001, on generic-group simulability, or on
      any other live hypothesis in this ledger.

  authored_by: coordinator
  authored_at: '2026-07-28'
  authored_at_precision: >-
    Date only. The authoring Coordinator session has no clock and no shell. It ran no
    command, computed no SHA-256, made no commit, and asserts that no commit happened. Every
    hash binding, commit identity and parentage is computed and verified by the executing
    session, and until the post-commit verifier accepts the commit nothing here is durable.
