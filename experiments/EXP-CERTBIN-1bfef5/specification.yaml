# =============================================================================
# EXP-CERTBIN-1bfef5 -- VERSION 1 (APPROVED by DEC-20261002-711879) frozen
# contract for H-CERTBIN-4d3853: descent-basis change-of-coordinates control
# for Macaulay/mutant closures (Proposition B) + Frobenius-stable
# certificate transfer (Proposition F) + E-SET vs E-POLY measurement on
# structured 9-dimensional V at the RC-1 cell.
#
# Source: IDEA-20260926-917981 under RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001.
#
# ZERO RUNS in this design packet. Stages 0-2 authorized for executor
# TASK-20261002-81fd5b. No AUXIN. Amazon Bedrock prohibited. NO break.
# NO attack. NO exponent. Closure instrument only.
# =============================================================================
experiment:
  id: EXP-CERTBIN-1bfef5
  hypothesis_id: H-CERTBIN-4d3853
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-917981
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    Descent-basis invariance (Proposition B) instrument regression plus
    structured-V W_4/M_4 rates (E-SET vs E-POLY) and Frobenius-stable
    certificate transfer (Proposition F) at the RC-1 cell
  status: approved
  approved_by: DEC-20261002-711879
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-711879
    composing_decision: DEC-20261002-711879
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-2 authorized.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2]
    scientific_execution_authorized_note: >-
      Stage 0 freezes preregistered predictions and writes Propositions B/F
      proofs as verifiable notes. Stage 1 runs arm (a) identity control
      (exact label agreement) as blocking gate. Stage 2 runs arms (b)-(d)
      plus certificate transfer on stable V; writes RESULTS.md with exactly
      one O-* label. No Magma/Sage. No AUXIN. No Bedrock. No ECC2K-130 solve.
      No SAT engine as success path.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Instrument-regress Proposition B on the 144 archived RC-1 targets under
    a coordinate change; measure W_4 and M_4 rates on normal-coordinate,
    Frobenius-stable, and random 9-dimensional V; verify Proposition F
    certificate transfer on the stable set; deliver exactly one O-* label
    from H-CERTBIN-4d3853.

  class: control
  class_note: >-
    Instrument control + exact propositions + toy-tier measurement of
    whether W_4 is set-blind on structured V. Not a cost-model table and
    not an exponent-moving breakthrough; retires a confound for every
    subsequent closure-based CERTBIN cost law.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Write
        stage0/preregistered-predictions.json freezing arm-(a) agreement
        threshold (288/288), E-SET/E-POLY thresholds (0.90/0.50), H1
        saturation predictors (computed before any closure), Proposition
        B/F proof notes, and the seed stream. Write
        stage0/propositions-note.md with the automorphism arguments.
      - >-
        Stage 1 (blocking). Arm (a): re-descend 144 archived targets with
        random basis of polynomial V and normal field basis; run M_4 and
        W_4; require exact label/iteration/dimension agreement with
        archived RC-1 closures. Failure → O-ARTIFACT stop.
      - >-
        Stage 2. Arms (b) V_N, (c) V_S (both Phi_17 octics), (d) random V:
        rebuild unsatisfiability via oracle A over each set; run M_4, W_4;
        compute saturation counts (pre-data for H1); on (c) transfer each
        certificate to 16 conjugates and verify. Write RESULTS.md with
        exactly one O-* label; memory (peak RSS, Macaulay shape) beside
        every time figure.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - SAT/DPLL/WDSat/CaDiCaL as a required success path (out of scope;
        Proposition B does not apply to them).
      - Editing IDEA-20260926-917981 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / ECC2K-130 attack from this contract.
      - Treating infra failure as mathematical evidence against B/F/H1.
      - Running any ECC2K-130 / deployed-scale decomposition cell.
      - Overwriting experiments/EXP-CERTBIN-e94b27/impl/ in place without a
        documented copy/wrapper under this experiment's write_scope.
      - >-
        Opening n≠17 measurement arms under this card (n=19 is a
        documentation control only — no stable V exists).

  inputs:
    proposal: ledger/proposals/IDEA-20260926-917981.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-4d3853.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    archived_run: experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    curve_instrument: experiments/EXP-CERTBIN-e94b27/impl/curve.py
    macaulay_instrument: experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
    closure_instrument: experiments/EXP-CERTBIN-e94b27/impl/closure.py
    oracle_instrument: experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py
    elim_instrument: experiments/EXP-CERTBIN-e94b27/impl/elim.py
    analysis_brief: analysis/binstd-idea-review-20260926/BRIEF.md
    kn_find_7c1e94: knowledge/findings/KN-FIND-7c1e94.md
    kn_find_c3a917: knowledge/findings/KN-FIND-c3a917.md

  controls:
    - name: arm_a_identity_blocking
      description: >-
        Arm (a) must reproduce every archived M_4/W_4 label, iteration
        count and dimension exactly (288/288). Failure → O-ARTIFACT;
        do not read arms (b)-(d).
    - name: satisfiable_S62_per_set
      description: >-
        S62 satisfiable controls on every V-set; any refutation voids the
        run (O-ARTIFACT).
    - name: random_V_shape_null
      description: >-
        Arm (d) random 9-dimensional V as the shape-matched null of
        KN-FIND-7c1e94 section 3 / RC-4.
    - name: saturation_predata
      description: >-
        Saturation count per set computed and frozen before any closure
        runs (pre-data predictor of M_4 under H1).
    - name: separate_process_certificate_verification
      description: >-
        Every refutation certificate (including all transferred
        certificates on arm (c)) verified under the separate-process
        verifier.
    - name: n19_no_stable_V_documentation
      description: >-
        Record that ord_19(2)=18 so Proposition F has no stable V at
        n=19; amortisation arm is impossible there by construction.
    - name: memory_beside_time
      description: >-
        Peak RSS and Macaulay shape stated beside every time figure in
        RESULTS.md.

  independent_variables:
    - name: stage
      levels: [0_freeze, 1_arm_a, 2_structured_sets]
    - name: V_set
      levels: [polynomial_random_basis, normal_coordinate, frobenius_stable_octic1, frobenius_stable_octic2, random_9dim]
    - name: field_basis
      levels: [polynomial, normal]
    - name: closure_degree
      levels: [3, 4]
    - name: target_class
      levels: [U62_unsat, S62_sat, C20]

  metrics:
    primary:
      - name: label_agreement_arm_a
        unit: count
        definition: >-
          Number of (target, {M_4,W_4}) pairs whose label, first-iteration
          and dimension match the archived RC-1 closures; expected 288/288.
      - name: W4_rate
        unit: fraction_with_CP95
        definition: >-
          Fraction of unsatisfiable targets with 1 in W_4, per V-set,
          with Clopper-Pearson 95% interval.
      - name: M4_rate
        unit: fraction_with_CP95
        definition: Fraction of unsatisfiable targets with 1 in M_4, per V-set.
      - name: transferred_cert_verify_count
        unit: count
        definition: >-
          Per refuted target on stable V: number of conjugates whose
          transferred certificate verifies (expected 17/17).
    secondary:
      - name: first_iteration_containing_1
        unit: integer_per_instance
        definition: First W_D iteration containing the constant row.
      - name: saturation_count
        unit: integer_per_set
        definition: Dimension of the saturation of the multiplication tensor of V (pre-data).
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage 1-2 processes.
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: termination_reason
        unit: enum
        definition: completed | timeout | crash | O-ARTIFACT | O-IMPEDIMENT.

  heuristic_under_test: H1

  preregistered_prediction:
    quantity: >-
      Arm (a) agreement exactly 288/288; E-SET iff both structured W_4
      rates >= 0.90; E-POLY iff either <= 0.50; MIXED otherwise; M_4 rates
      match per-set saturation predictions under H1; transferred
      certificates verify 17/17 per refuted target on stable V.
    formula: >-
      Proposition B: automorphism invariance of M_D/W_D under GL(l,F_2)
      basis change and invertible recombination of equations.
      Proposition F: W_D(x_R^{2^i}) = phi^i(W_D(x_R)) for Frobenius-
      stable V. E-SET thresholds 0.90 / E-POLY 0.50 on CP95 W_4 rates.
    source: >-
      ledger/proposals/IDEA-20260926-917981.yaml predictions +
      proof_search_map; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Single RC-1 cell at n=17, m=2. No transfer of rates to n=131.
      Proposition B is forall-n exact; empirical E-SET/E-POLY is
      cell-scoped. Proposition F amortisation unavailable on ECC2K-130
      linear factor bases (IDEA-20260918-9abf42).
    correspondence: null

  replication:
    seeds: [2026092691]
    independent_instances: 1
    note: >-
      One RC-1 curve; 144 archived targets reused literally. Random basis
      of polynomial V, normal element search, and random V draw from the
      recorded seed stream. Both Phi_17 octic factors run as separate
      stable-V instances.

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 4.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json and propositions-note.md.
    - Stage 1 arm-(a) agreement exact (288/288), OR O-ARTIFACT stop.
    - Stage 2 complete on arms (b)-(d) with certificates, OR named O-ARTIFACT / O-IMPEDIMENT stop with measured quantity.
    - RESULTS.md names exactly one O-* label from H-CERTBIN-4d3853.
    - maximum_runs = 4.
    - Do not open n≠17 measurement cells under this card.

  invalidation_rules:
    - Stage 1 arm-(a) disagreement after instrument check → O-ARTIFACT; do not read structured sets.
    - Any S62 satisfiable control refuted → O-ARTIFACT.
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock/SAT-engine used as success path → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence against B/F/H1.
    - Claiming break/exponent under this card → protocol invalid.

  success_criterion: >-
    Stage 0 artifacts frozen; Stage 1 arm-(a) agreement recorded as
    exact or as O-ARTIFACT stop; Stage 2 produces W_4/M_4 rates with
    CP95 per V-set, saturation counts, and transferred-certificate
    verification counts (or a named O-ARTIFACT/O-IMPEDIMENT stop);
    RESULTS.md names exactly one O-* label from H-CERTBIN-4d3853 with
    cited artifacts.

  falsification_criterion: >-
    Any of: verified arm-(a) label disagreement after instrument check
    (Proposition B falsified / O-ARTIFACT); transferred certificate
    failure with verifying source (Proposition F falsified /
    O-ARTIFACT); S62 refutation (instrument void); E-SET threshold
    missed with gates otherwise passing when reading E-SET (that is
    O-E-POLY or O-MIXED, valid scientific negatives of E-SET); or a
    claim of break/exponent under this card.

  required_artifacts:
    - experiments/EXP-CERTBIN-1bfef5/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-1bfef5/stage0/propositions-note.md
    - experiments/EXP-CERTBIN-1bfef5/stage1/
    - experiments/EXP-CERTBIN-1bfef5/stage2/
    - experiments/EXP-CERTBIN-1bfef5/RESULTS.md
    - experiments/EXP-CERTBIN-1bfef5/runs/<RUN-CERTBIN-*>/

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
