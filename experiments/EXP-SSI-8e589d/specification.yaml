experiment:
  id: EXP-SSI-8e589d
  version: 4
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: null
  hypothesis_note: >-
    Deliberate null: this is an additive design refinement for
    IDEA-20260806-9c2f80, not an executed test of a hypothesis and not an
    attack construction.
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  batch_id: BATCH-0a1b85
  source_proposal: IDEA-20260806-9c2f80
  supersedes: EXP-SSI-fe3f76
  supersession_note: >-
    Additive successor incorporating the independent Validator and Red Team
    findings from BATCH-6554d6. The predecessor remains immutable and is not
    evidence. This record repairs the design contract only; it does not alter
    any prior observation or authorize execution.
  title: >-
    Refined design-only contract for a fixed-advice classical per-prime OneEnd
    frontier, with typed advice encodings, explicit fiber accounting, and
    reproducible matched nulls

  objective: >-
    Define a reviewable symbolic and arithmetic contract for the named closed
    list in IDEA-20260806-9c2f80. The contract must distinguish a fixed
    p-dependent advice witness from the distribution used in a diagnostic,
    separate build cost from per-instance query cost, charge typed advice bytes
    and working memory, and make every null/control reproducible. If later
    approved, frozen, and executed, the work may emit conditional accounting
    rows only; it may not implement isogeny walks, claim a lower bound over all
    advice, infer a security result, or move a hardness exponent.

  claim_ceiling: >-
    At most a derivation about the pre-registered named constructions under the
    exact accounting conventions below. It cannot validate H-ADV-1, H-ADV-2,
    H-ADV-3, or H-ADV-4 by symbolic arithmetic; it cannot certify an
    all-advice lower bound; and it cannot transfer to EndRing, Isogeny,
    SQIsign, CSIDH security, or any deployed parameter claim.

  inputs:
    proposal: ledger/proposals/IDEA-20260806-9c2f80.yaml
    predecessor_contract: experiments/EXP-SSI-fe3f76/specification.yaml
    predecessor_predecessor: experiments/EXP-SSI-a6132d/specification.yaml
    prior_validator: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-6554d6/reviews/TASK-20260809-4492f4/validation_report.yaml
    prior_red_team: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-6554d6/reviews/TASK-20260809-2ded5b/red_team_report.md
    frozen_source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    prior_evidence: ledger/evidence/EV-SSI-59f7a2.yaml
    prior_decision: ledger/decisions/DEC-20260805-596d71.yaml
    duplication_refresh: >-
      coordination/goals/GOAL-SSI-001/batches/BATCH-f68c05/tasks/TASK-20260809-b28c39/duplication_knowledge_audit.md
    catalogue_inputs:
      - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/S1.md
      - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/S2.md
      - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/Q3.md

  scope_and_instance_model:
    problem: >-
      A supersingular j-invariant E over F_{p^2} is the instance. The positive
      target is the classical OneEnd/EndRing setting with no published secret
      torsion images, SQIsign transcript, or CSIDH secret. SIDH/SIKE
      torsion-image recovery remains out of scope.
    vertex_set: >-
      V_p is the canonically encoded set of supersingular j-invariants in the
      declared representation. All set cardinalities below count distinct
      vertices after duplicate rejection; no estimate silently replaces a
      finite set by p when the distinction affects a control.
    advice_witness: >-
      For each prime p, A_p is fixed before the instance E is selected. A_p may
      depend on p but not on E, and it is not regenerated per query. The
      quantifier under review is therefore forall p exists fixed A_p forall
      E in V_p, with all query randomness conditioned on that fixed A_p.
    query_scope: >-
      T_q is evaluated in integer field-operation equivalents (FOE) after the
      fixed advice A_p, builder seed, vertex manifest, and branch index are
      committed. Let omega range only over query-side randomness. For target E,
      one attempt has L_steps=1048576 graph steps and a path-work trace W with
      exact integer counters for lookup, parsing, validation, walks, pullback,
      saturation, and output conversion. Let q(A_p,E) be the probability over
      omega that an admissible non-scalar OneEnd output is emitted before the
      budget. q=0 means T_q(A_p,E)=infinity; otherwise
      T_q(A_p,E)=E_omega[W(A_p,E;omega)]/q(A_p,E), and
      T_q(A_p)=max_{E in V_p} T_q(A_p,E). The builder seed and all query seed
      derivations are fixed inputs, never averaged away.
    amortization: >-
      For Q independent instances using the same fixed A_p, total cost is
      T_build(A_p) + Q*T_q(A_p), and the reported amortized cost is
      T_q(A_p) + T_build(A_p)/Q. Q is an explicit axis, not an implicit
      free-advice assumption. The derivation must report the break-even Q.

  exact_parameterization:
    security_level_labels_bits: [256, 512]
    prime_instances:
      - label: SQISign-I
        p_expression: "5*2^248-1"
        exact_bit_length: 251
        log2_expression: "log2(5)+248"
        security_level_label_bits: 256
        source: "inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:248"
      - label: SQISign-V
        p_expression: "27*2^500-1"
        exact_bit_length: 505
        log2_expression: "log2(27)+500"
        security_level_label_bits: 512
        source: "inputs/P13-WESOLOWSKI-2026/paper_fulltext.md:248"
    fp2_encoding:
      defining_relation: "u^2+1=0 over F_p; both declared p values are 3 mod 4"
      basis_order: [1, u]
      coefficient_order: [j_0, j_1]
      field_element: "j_0+j_1*u with canonical unsigned little-endian coefficients in [0,p-1]"
      encoding_version: "0x01"
      field_bytes: "b_p=ceil(exact_bit_length/8): 32 for SQISign-I, 64 for SQISign-V"
      reduction: "reduce each coefficient modulo p before serialization; reject noncanonical input"
    vertex_encoding:
      curve_id: "encoding_version(1)||j_0(b_p)||j_1(b_p)"
      curve_id_bytes: "b_curve=1+2*b_p: 65 for SQISign-I, 129 for SQISign-V"
      vertex_order: "lexicographic byte order on curve_id"
      supersingular_predicate: "SSJ-ENUM-v1: evaluate the exact Deuring supersingular polynomial S_p(X) over F_{p^2}"
      enumeration: "exhaustively enumerate all j_0,j_1 in [0,p-1], retain exactly SSJ-ENUM-v1 roots, sort by curve_id"
      manifest: "V_p.json records p_expression, S_p digest, |V_p|, ordered curve_id list, and generator version"
      membership: "binary search in the committed ordered V_p manifest; absent IDs are invalid"
      sampling: "index=SHAKE256(seed||p_label||counter) interpreted modulo |V_p|; the manifest is required"
    sigma_grid:
      - {label: "0", numerator: 0, denominator: 1, mode: no_advice_control}
      - {label: "1/6", numerator: 1, denominator: 6, mode: treatment}
      - {label: "1/3", numerator: 1, denominator: 3, mode: treatment}
      - {label: "1/2", numerator: 1, denominator: 2, mode: treatment}
      - {label: "2/3", numerator: 2, denominator: 3, mode: treatment}
      - {label: "4/5", numerator: 4, denominator: 5, mode: collision_audit}
      - {label: "1", numerator: 1, denominator: 1, mode: full_advice_control}
    advice_size: "S_req=floor(p^sigma) for treatment rows; S_eff is the retained distinct count in the manifest/index"
    incumbent: "T_inc_foe(p) is an explicit baseline counter in FOE, supplied before arithmetic; the asymptotic p^(1/3+o(1)) label is not a FOE value"
    arithmetic: "exact integer arithmetic for p, bit lengths, floors, counts, widths, and rational labels; decimal log2 values are presentation only"
    work_accounting:
      unit: FOE
      primitive_costs: {field_add: 1, field_mul: 1, field_square: 1, field_inv: 1, byte_compare: 1, table_probe: 1, graph_step: 1}
      L_steps: 1048576
      maximum_observed_restarts: 65536
      seed_derivation: "SHAKE256(domain||p_label||branch||curve_id||replicate||attempt)[:32]"
      replay_seed_derivation: "SHAKE256(domain||replay||p_label||branch||curve_id||replicate||attempt)[:32]"
      break_even: "Q_break_even=ceil(T_build_foe/(T_inc_foe-T_q_foe)) when the integer denominator is positive; otherwise undefined"
  advice_representation:
    logical_entry_definition: >-
      S_req is the requested logical count. The builder consumes deterministic
      candidate records, rejects malformed, overflowing, duplicate, or
      noncanonical records, and reports attempted_count, failed_count,
      duplicate_count, retained_count=S_eff, and padding_count. No count is
      silently replaced by p or |V_p|.
    fixed_quaternion_encoding:
      algebra: "B=( -1, -p ) with basis [1,i,j,i*j], i^2=-1, j^2=-p, j*i=-i*j"
      order_basis: "the 4x4 row-reduced Hermite-normal-form coefficient matrix in the fixed basis"
      scalar: "sign(1)||magnitude, unsigned little-endian, magnitude width b_scalar=2*b_p+5"
      order_tag: "order_version(1=0x01)||owner_curve_id(b_curve)||16 scalar values in row-major HNF order"
      order_tag_bytes: "b_order=1+b_curve+16*b_scalar"
      canonicalization: "positive HNF pivots, zero-above-pivot convention, lexicographically sorted rows; equivalent bases normalize to one byte string"
      overflow: "an HNF scalar outside the fixed envelope is a build failure, never truncation or a null"
    common_encoding:
      slot_index: "unsigned little-endian slot, b_slot=max(1,ceil(log2(max(2,S_eff+1))/8))"
      hash_key: "first 16 bytes of SHAKE256(0x49||branch||p_label||record_bytes)"
      table_capacity: "H=2*max(1,S_eff) open-addressed slots"
      occupancy: "one byte per slot: 0 empty, 1 retained, 2 tombstone"
      index_header: "index_version(1=0x01)||branch_id(1)||p_label(1)||H as uint64(8)"
      shared_header: "shared_version(1=0x01)||hash_domain(16)||attempted_count(uint64)||failed_count(uint64)||duplicate_count(uint64)||padding_count(uint64)"
      b_shared: "1+16+4*8=49 bytes, charged once per branch/index"
      b_index: "9+H*(1+b_curve+b_slot+16) bytes, including occupancy, key, curve ID, and collision metadata"
    branch_schemas:
      construction_a_order_tagged:
        fields: [lookup_curve_id(b_curve), order_tag(b_order)]
        entry_bytes: "b_A=b_curve+b_order"
        shared_bytes: "b_shared"
      construction_b_order_tagged:
        fields: [lookup_curve_id(b_curve), order_tag(b_order)]
        entry_bytes: "b_B_tagged=b_curve+b_order"
        shared_bytes: "b_shared"
      construction_b_membership_only:
        fields: [lookup_curve_id(b_curve), membership_owner_curve_id(b_curve)]
        entry_bytes: "b_B_membership=2*b_curve"
        treatment_invariant: "membership_owner_curve_id equals lookup_curve_id for treatment records"
        shared_bytes: "b_shared"
      construction_c_pair_entry:
        fields: [target_curve_id(b_curve), left_endpoint(b_curve), right_endpoint(b_curve), middle_descriptor(b_middle)]
        entry_bytes: "b_C=b_curve+2*b_curve+b_middle"
        shared_bytes: "b_shared"
    middle_descriptor:
      format: "middle_version(1=0x01)||orientation(1)||left_slot(b_slot)||right_slot(b_slot)||middle_factor_code(uint32)"
      bytes: "b_middle=1+1+2*b_slot+4"
      endpoint_order: "left_endpoint <= right_endpoint by curve_id bytes; orientation records the directed path"
    branch_size_mapping:
      construction_a: "S_A_req=floor(p^sigma), T_A uses density S_eff/|V_p|"
      construction_b: "S_B_req=floor(p^(1/2+3*theta/2)); sigma_B=1/2+3*theta/2"
      construction_c: "S_C_req=floor(p^sigma), A_C=ceil(p^(1-sigma/2)), T_C=p^(1-sigma/2+o(1)) under H-ADV-4"
      B_rows:
        - {sigma: "0", theta: null, status: not_applicable, reason: "S=0 control"}
        - {sigma: "1/6", theta: null, status: not_applicable, reason: "below p^(1/2); no padding"}
        - {sigma: "1/3", theta: null, status: not_applicable, reason: "below p^(1/2); no padding"}
        - {sigma: "1/2", theta: "0", status: applicable}
        - {sigma: "2/3", theta: "1/9", status: applicable}
        - {sigma: "4/5", theta: "1/5", status: applicable}
        - {sigma: "1", theta: "1/3", status: applicable}
      C_rows: "all sigma labels map through S_C_req and A_C; S=0 is the no-advice control, not a C table"
    builder:
      algorithm: "SHAKE256(build_seed||branch||p_label||counter) yields candidate bytes; decode, canonicalize, validate, reject, and retain until S_req or the declared attempt cap"
      attempt_cap: "max(1, 2^20*S_req) candidate attempts; cap exhaustion is failed_infrastructure/invalid"
      index_build: "construct the exact flat open-addressed table from retained records; all probes and collision metadata enter T_build and b_index"
      retained_vs_attempted: "S_eff=retained_count; physical table uses S_eff and H=2*max(1,S_eff); requested padding is zero unless explicitly declared by a branch"
    physical_memory: "M_adv_bytes=sum(retained entry bytes)+b_index+b_shared; M_work_bytes is the peak FOE trace workspace and is reported separately"
    build_query_axes: "T_build_foe counts builder/index FOE; T_q_foe counts one attempt and inverse q; T_amort=T_q+T_build/Q; no wall-clock conversion is implied"
  fiber_and_output_model:
    path_contract:
      direction: "all declared paths are directed E(target)->F(record owner/endpoint)"
      edge_encoding: "canonical edge tuple [source_curve_id,target_curve_id,degree_class(uint32),orientation(1)]"
      reconstruction: "rebuild the edge tuple stream from query seed and retained table slot; path bytes are zero in advice and all reconstruction FOE enter T_q"
      pullback: "transport the HNF order from F back along the reversed canonical edge stream, saturate by the declared degree product, and normalize to HNF"
      output: "emit the normalized HNF as an explicit non-scalar OneEnd witness for target E; reject scalar, noncanonical, failed-saturation, or target-mismatch outputs at the final gate"
      output_gate: "accept iff the final witness owner is target E and the normalized HNF is non-scalar; all preceding stages still execute on controls"
    charged_fiber: >-
      R_t(a;I_branch) is the set of distinct target vertices E for which branch
      query access to one retained record a plus its read-only branch index
      I_branch, at most t FOE, and the declared path/output contract emits an
      admissible explicit witness. Abstract membership is not counted.
    union_rule: >-
      R_t(A;I_branch)=union over retained a in A of R_t(a;I_branch), formed
      before counting. Shared index bytes b_index+b_shared are charged once;
      retained, attempted, duplicate, and failed records are not interchangeable.
    branch_access:
      A_and_B_tagged: "one selected slot per attempt; every probe, parse, owner validation, path, and output counter is charged"
      B_membership: "one membership slot followed by owner resolution and terminal procedure; no hidden order bytes"
      C_pair: "at most two selected pair slots per attempt; both endpoint paths, middle reconstruction, and adaptive second-slot choice are charged and recorded"
    ceiling: "fiber comparisons are restricted to these named branches and are not a lower bound for arbitrary advice or a theorem about all preprocessing"
  heuristic_inventory:
    - id: H-ADV-1-W
      statement: >-
        Conditional worst-case-over-E hitting model for a fixed A_p, including
        its stated mixing, restart, pullback, and success-probability charges.
      status: unverified_conditional
      scope: symbolic_named_branches_only
      not_validated_by: random_set_diagnostic
      falsification: >-
        Any declared finite test or proof that violates the exact worst-case
        bound, or any ambiguity between fixed-advice and regenerated-advice
        expectations, invalidates the corresponding row.
    - id: H-ADV-1-R
      statement: >-
        Synthetic regular-graph controls have the declared random-set hitting-time
        distribution. This is not an SSI-curve or prime-field result.
      status: unverified_diagnostic
      scope: random_sets_and_sampled_start_vertices_only
      cannot_establish: H-ADV-1-W
    - id: H-ADV-2
      statement: >-
        The declared order-to-curve construction and its validation cost are
        available under the specified classical model.
      status: unverified_conditional
      falsification: >-
        A missing construction, failed output-type conversion, or charged cost
        outside the declared build/query axes invalidates that branch.
    - id: H-ADV-3
      statement: >-
        The named resolution-fiber growth bound holds for the specified typed
        branch and not for arbitrary advice encodings.
      status: unverified_conditional
      falsification: >-
        A valid closed-list counterexample with the same representation and
        accounting invalidates only that branch and its dependent rows.
    - id: H-ADV-4
      statement: >-
        Construction C endpoint pairs satisfy the declared near-uniform pair
        model after accounting for orientation, middle factors, and endpoint
        correlations.
      status: unverified_conditional
      scope: construction_c_pair_branch_only
      diagnostic_null: >-
        Independently generated endpoint pairs matched to the treatment
        marginals and the same pair-table access path.
      falsification: >-
        A pre-registered pair-collision or binned-distribution statistic outside
        its finite-sample tolerance invalidates C; it does not invalidate A/B.

  proof_search_map_audit:
    status: refined_for_bounded_closed_list_only
    bottleneck: >-
      Growth of the unique, output-producing resolution fiber per typed advice
      byte and per charged query budget.
    baseline_reproduction: >-
      S=0 returns the incumbent; S=p^(1/2) returns the declared MITM balance
      control; both are known-answer controls and not measurements.
    observation_collision: >-
      The former A/B collision at (p^(4/5),p^(1/5)) is retained only as a
      representation-collision audit. Order-tagged B and membership-only B are
      separate branches; no redundancy conclusion is permitted until their
      bytes and build/query charges agree.
    quantifier_order: >-
      The formal symbolic quantifier is forall p exists fixed A_p forall E in
      V_p, with expectation only over query randomness. H-ADV-1-R is explicitly
      weaker and cannot validate H-ADV-1-W.
    method_ceiling: >-
      Certify only the named typed branches. The nearby oriented/CSIDH object is
      a non-gating diagnostic because its problem type and frontier are not
      sufficiently pinned to serve as a method-ceiling proof gate.
    proof_obligations:
      - "Construction A build/query charge and H-ADV-2 status"
      - "Explicit output-producing pullback and saturation cost"
      - "Unique union fiber R_t(A) with overlap and shared-byte accounting"
      - "Construction C pair law H-ADV-4 and matched pair null"
      - "Construction B typed branch mapping at every exact sigma label"
      - "Composite min-row and monotonicity arithmetic"
      - "Build cost, break-even Q, and physical byte conversion"

  controls:
    seed_commitment:
      seed_bytes: 32
      build_seed: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      query_seed: "202122232425262728292a2b2c2d2e2f303132333435363738393a3b3c3d3e3f"
      random_advice_seed: "404142434445464748494a4b4c4d4e4f505152535455565758595a5b5c5d5e5f"
      shuffled_fiber_seed: "606162636465666768696a6b6c6d6e6f707172737475767778797a7b7c7d7e7f"
      membership_null_seed: "707172737475767778797a7b7c7d7e7f808182838485868788898a8b8c8d8e8f"
      pair_null_seed: "808182838485868788898a8b8c8d8e8f909192939495969798999a9b9c9d9e9f"
      graph_null_seed: "a0a1a2a3a4a5a6a7a8a9aaabacadaeafb0b1b2b3b4b5b6b7b8b9babbbcbdbebf"
      seeds_are: "public pre-registered hex values; treatment and control domains are disjoint"
    path_work_trace_schema:
      fields: [replicate, instance, attempt, target_curve_id, branch, lookup_count, parse_count, validation_count, graph_steps, pullback_count, saturation_count, output_gate_count, total_foe]
      total_rule: "total_foe=sum of all declared integer counters; a missing counter invalidates the run"
      seed_rule: "per-instance seed is SHAKE256(query_seed||p_label||branch||target_curve_id||replicate||instance||attempt)[:32]"
      replay_rule: "final-gate-disabled replay uses the same pre-gate trace and SHAKE256(replay_domain||same tuple)[:32]; replay is instrumentation only"
    finite_control_plan:
      instances_per_replicate: 4096
      replicates: 8
      total_instances: 32768
      count_field: completed_attempt_count
      paired_query_stream: "one row per replicate/instance/attempt with both treatment-path and replay-path traces"
      acceptance_arithmetic: "exact integer counts and rational ratios; no post-hoc tolerance"
    entries:
    - id: CTRL-S0
      kind: known_answer
      order: before_all_treatment
      forced_result: "S_req=0; no advice lookup; use declared T_inc_foe baseline input"
      failure_action: terminate_without_treatment_rows
    - id: CTRL-S-P-HARDCODED
      kind: known_answer
      order: before_all_treatment
      forced_result: "full V_p order-tagged table has polynomial query in the symbolic corner only"
    - id: CTRL-RANDOM-ADVICE-A-TAGGED
      kind: semantic_path_matched_null
      applies_to: construction_a_order_tagged
      order: before_all_treatment
      null_generator: "retain a valid order_tag generated for owner_curve_id=sample_vertex(random_advice_seed,index+1), while lookup_curve_id is target index; both IDs are in V_p and owner!=target when |V_p|>1"
      path_rule: "validate against owner, reconstruct owner-to-target pullback, saturate, then final target identity/output gate; no malformed or validity-tag branch"
      gate: "witness_count=0, completed_attempt_count=32768, delta_path<=1/64 against paired replay"
      singleton_rule: "not_applicable when |V_p|<2; no forced-zero claim"
    - id: CTRL-RANDOM-ADVICE-B-TAGGED
      kind: semantic_path_matched_null
      applies_to: construction_b_order_tagged
      order: before_all_treatment
      null_generator: "same typed owner-mismatch construction as CTRL-RANDOM-ADVICE-A-TAGGED"
      gate: "witness_count=0, completed_attempt_count=32768, delta_path<=1/64"
    - id: CTRL-RANDOM-MEMBERSHIP-B
      kind: semantic_path_matched_null
      applies_to: construction_b_membership_only
      order: before_all_treatment
      null_generator: "lookup_curve_id is target; membership_owner_curve_id is the next distinct manifest vertex; owner membership is valid and final output gate requires owner=target"
      gate: "witness_count=0, completed_attempt_count=32768, delta_path<=1/64"
      singleton_rule: "not_applicable when |V_p|<2"
    - id: CTRL-SHUFFLED-FIBER
      kind: semantic_path_matched_negative_control
      applies_to: [construction_a_order_tagged, construction_b_order_tagged, construction_b_membership_only]
      order: before_all_treatment
      permutation: "pi(i)=(i+1) mod |V_p| for every retained record; |V_p|<2 is not_applicable"
      path_rule: "same parse, owner validation, path, pullback, saturation, and final identity gate as its branch-specific treatment"
      gate: "witness_count=0, completed_attempt_count=32768, delta_path<=1/64"
    - id: CTRL-C-PAIR-NULL
      kind: semantic_path_matched_null
      applies_to: construction_c_pair_entry
      order: before_all_treatment
      pair_key: "SHAKE256(0x43||p_label||target_curve_id||left||right||middle_descriptor)[:16]"
      null_generator: "valid endpoints with treatment-matched marginals; define permutation pi by sorting right-endpoint indices on SHAKE256(pair_null_seed||replicate||uint64(index)) with index tie-break; all fields remain valid"
      pair_order: "left<=right lexicographically; orientation bit is preserved"
      statistic: "N_b bins b=0..255 from low byte of pair_key; C_obs=sum_b N_b*(N_b-1)/2; C_iid=n*(n-1)/(2*256)"
      sample: "n=8192 pairs per replicate"
      tolerance: "z_max^2=max_b (N_b-n/256)^2/(n*(1/256)*(255/256))<=36 and (C_obs-C_iid)^2/n^2<=16/8192"
    - id: CTRL-GRAPH-RANDOM-SET
      kind: non_SSI_synthetic_diagnostic
      order: before_any_SSI_diagnostic
      graph_family: "G_N on Z/N with edges v->v+{-2,-1,+1,+2} mod N"
      exact_sizes: [64, 128, 256]
      target_sets: "sample uniformly without replacement at exact S in {1,2,4,8,16}"
      starts: "uniform vertex from Z/N"
      horizon: 1048576
      censoring: "no hit by horizon is time=horizon+1 and retained, not dropped"
      statistic: "empirical CDF of first-hit times; D_KS^2<=16/4096 per N,S,replicate"
      sample: "1024 independent target sets, 4096 starts per set, 8 replicates"
      boundary: "synthetic graph only; cannot validate H-ADV-1-W or any SSI curve claim"

  pair_and_distribution_diagnostics:
    H-ADV-4_statistic: >-
      Construction C is gated only after CTRL-C-PAIR-NULL uses the exact pair
      key, endpoint order, n=8192, 256 bins, C_iid, and rational tolerances
      above. A pass is a control result, not a theorem.
    H-ADV-1-R_statistic: >-
      Use CTRL-GRAPH-RANDOM-SET on the exact synthetic graph family and report
      each N,S cell, censoring count, CDF, and D_KS. It is a non-SSI diagnostic
      and cannot validate H-ADV-1-W.

  metrics:
    primary:
      - "T_q and T_amort for every typed branch at exact sigma labels"
      - "T_build, Q_break_even, M_adv_bytes, and M_work_bytes"
      - "CTRL-S0, full-advice, random-advice, shuffled-fiber, and C-pair-null verdicts"
      - "unique R_t(A;I_branch) fiber mass with exact shared-index bytes and branch access traces"
    secondary:
      - "log2 advice bytes and query-cost exponent at security-level labels 256,512, with exact p bit lengths 251,505 beside them"
      - "Construction C minus A exponent gap under H-ADV-4, explicitly conditional"
      - "finite-size attempted, retained, duplicate, overflow, padding, saturation, and vertex-manifest counts"
      - "semantic-null witness counts, completion counts, paired path-cost ratios, and exact tolerances"
      - "non-gating nearby diagnostic output, if run"

  preregistered_prediction:
    quantity: T_min(S)
    formula: "min(T_inc, T_branch(A_tagged), T_branch(B_tagged), T_branch(B_membership), T_C_pair)"
    prediction_status: conditional_symbolic_input_not_observation
    exact_sigma_labels: ["0", "1/6", "1/3", "1/2", "2/3", "4/5", "1"]
    exact_prime_labels: ["SQISign-I: 5*2^248-1 (bit_length 251)", "SQISign-V: 27*2^500-1 (bit_length 505)"]
    random_advice_null: "T_inc at every declared S"
    construction_c_gap: "reported only conditional on H-ADV-4 and the typed pair accounting"

  stages:
    - id: stage-0-contract-audit
      purpose: >-
        Validate exact labels, typed record widths, control encodings, quantifier
        annotations, proof-map obligations, and source hashes before arithmetic.
      method: python3_standard_library_only
      budget_seconds: 1800
      stop_rules:
        - "stop on any missing exact encoding or control seed field"
        - "stop if fixed-A_p and random-set diagnostic scopes are conflated"
        - "stop if a branch lacks build/query/memory charges"
    - id: stage-1-arithmetic
      purpose: >-
        If separately approved, emit conditional rows and controls from exact
        symbolic inputs; no cryptographic graph or isogeny computation.
      method: python3_standard_library_only
      budget_seconds: 1800
      budget_memory_gb: 1
      parameters: {security_level_labels_bits: [256, 512], exact_bit_lengths: [251, 505], sigma_labels: ["0", "1/6", "1/3", "1/2", "2/3", "4/5", "1"], L_steps: 1048576}
      stop_rules:
        - "no execution before freeze and Coordinator authorization"
        - "stop on random-null, S=0, or exact-arithmetic gate failure"
        - "stop if any row silently drops build, memory, or representation cost"
    - id: diagnostic-h-adv
      purpose: >-
        Optional toy diagnostic for H-ADV-1-R and H-ADV-4 only, with separately
        recorded seeds and no transfer to the universal symbolic claims.
      method: python3_standard_library_only
      budget_seconds: 600
      budget_memory_gb: 1
      status: not_authorized

  budget:
    wall_clock_seconds_per_run: 4200
    total_cpu_hours: 0.2
    maximum_memory_gb: 1
    maximum_runs: 1
    maximum_workers: 1
    note: >-
      These are prospective task limits only. This successor is not frozen and
      execution is unauthorized.

  stopping_rules:
    - "No stage executes while frozen=false or execution_authorized=false."
    - "Commit and verify every branch-specific semantic control, vertex manifest, path-work trace, sample count, statistic, tolerance, and seed before any treatment row."
    - "Stop at the first exact-prime, exact-bit-length, manifest, schema, semantic-null, output-type, or accounting failure and preserve the partial artifact."
    - "Any sub-1/3 closed-list row requires independent review-breakthrough at max before promotion."

  invalidation_rules:
    - "Change exact primes, exact bit lengths, vertex/order bytes, typed record layouts, path-work schema, control seeds, statistics, tolerances, or formula after any observation."
    - "Use numpy, Sage, network access, or isogeny implementation in Stage 0/1."
    - "Claim an all-advice lower bound, attack, security result, or exponent move."
    - "Treat H-ADV-1-R as validation of H-ADV-1-W."
    - "Treat the nearby oriented diagnostic as a method-ceiling proof."
    - "Omit build cost, duplicate rejection, physical bytes, pullback/saturation, path trace, vertex manifest, or break-even Q."

  success_criterion: >-
    If separately approved, frozen, and validly executed: every exact label and
    typed branch is emitted; all build/query/memory axes are complete; S=0 and
    the matched random-advice null precede treatment; shuffled and C-pair null
    controls pass their declared finite-size gates; and all conditional
    assumptions remain explicitly attached to their rows. This is only a
    bounded design/accounting result, not attack or security evidence.

  falsification_criterion: >-
    Terminate or invalidate if any exact encoding is missing, fixed-advice and
    random-set quantifiers are conflated, S=0 or the matched random null fails,
    a semantic-path-equivalent null skips parse/validation/path work, C's pair
    null fails, a closed-list row violates its declared arithmetic, or a required
    build/memory/output cost is omitted. Timeout, crash, unavailable backend, or
    dependency failure is infrastructure only.

  required_artifacts:
    - "Additive correction report with predecessor and review hashes"
    - "Corrected successor specification and freeze receipt if later frozen"
    - "Exact typed advice/control encoding table"
    - "Current-corpus catalogue path and duplication/proof/control audit"
    - "Pre-run control seed/hash commitment if later authorized"
    - "Machine-readable Stage 0/1 output only if separately authorized"
    - "Exact command, environment, stdout, stderr, and resource receipt if run"
    - "Coordinator snapshot before independent review and ledger archive after review"

  scale_relevance:
    tier: derivation
    justification: >-
      Stage 1 is symbolic standard-library arithmetic and optional diagnostics
      are explicitly toy/model checks. No cryptographic computation occurs and
      no crypto-scale evidence or security transfer is claimed.
    correspondence: null

  assigned_to: executor
  approved_by: null
