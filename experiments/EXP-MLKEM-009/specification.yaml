experiment:
  id: EXP-MLKEM-009
  hypothesis_id: H-MLKEM-009
  goal_id: GOAL-MLKEM-002
  version: 1
  title: >-
    GNU ld --wrap library-path interposition adequacy control for the ML-KEM
    comparison-conformance isolation gate
  status: approved
  frozen: true
  approved_by: coordinator
  approved_at: '2026-07-30'
  claim_tier: laboratory_implementation_conformance
  objective: >-
    Repair OBJ-RT006-001/002 from EXP-MLKEM-006 / EV-MLKEM-009 (and inherited OBJ-RT005-001): replace SO-local
    adequacy_probe/dlopen evidence with true interposition of a defective
    comparator onto the wolfSSL/PQClean compare symbols actually called by
    substantive probes; re-ask the fixed-bound second-peer question with honest
    unavailability if empty; decide isolation versus systemic under the repaired
    gate without paraphrasing EV-MLKEM-008 or any widened null as H-MLKEM-004
    support or as GOAL-MLKEM-002 completion criterion 2.

  repairs_from_EXP_MLKEM_006:
    true_library_path_interposition: >-
      CTRL-TRUE-LIBRARY-PATH-INTERPOSITION replaces SO-local
      CTRL-LIBRARY-FACING-ADEQUACY as the load-bearing instrument-adequacy
      control. Detection must be observed through conformance_probe,
      decap_boundary_probe, and/or pqclean_probe call paths after link-time
      wrap (--wrap=mlkem_cmp, --wrap=mlkem_cmp_avx2, --wrap=mlkem_cmp_neon,
      and PQClean verify entry if used) or an equivalent call-site wrapper.
      library_call_path_exercised must be derived from wrap/call attestation,
      not hard-coded true. Standalone adequacy_probe/dlopen is non-load-bearing
      diagnostic only.
    goal_criterion_2_honesty: >-
      Re-check the strict fixed-bound preference order at run start. If a
      fixed-bound peer is buildable with mechanism evidence, pin
      criterion_used=strict_fixed_bound and measure it. Otherwise record
      second_impl_unavailable as the load-bearing cross-impl outcome for GOAL
      completion criterion 2. A laboratory widened_optimized_compare measurement
      may still be taken for continuity with EXP-005 but MUST NOT be cited as
      H-MLKEM-004 support or as satisfying GOAL completion criterion 2
      (OBJ-RT005-002, OBJ-RT005-004).

  design_time_preflight:
    date: '2026-07-24'
    choice: option_1_gnu_ld_wrap_linux_amd64
    basis:
      - EV-MLKEM-008
      - DEC-20260724-017
      - coordination/goals/GOAL-MLKEM-002/batches/BATCH-002/tasks/TASK-20260724-929/red_team_report.yaml
      - experiments/EXP-MLKEM-005/implementation/conformance_probe.c
    interposition_feasibility:
      disposition: feasible_within_budget
      method: >-
        Link-time wrap or call-site wrapper of probe-declared library compare
        symbols mlkem_cmp / mlkem_cmp_avx2 / mlkem_cmp_neon; optional PQClean
        verify wrap when pqclean_probe is built.
      note: >-
        Coordinator chose option (1) over goal-criterion rewrite because wrap
        targets already exist on the substantive probe path (CTRL-RT005-TRUE-
        LIBRARY-PATH-INTERPOSITION).
    strict_fixed_bound_search:
      disposition: empty_at_last_committed_check_must_recheck
      prior_evidence: [EV-MLKEM-007, EV-MLKEM-008]
      exhausted_candidates_at_prior_check:
        - {name: BoringSSL, result: rejected_mechanism_mismatch}
        - {name: PQClean_avx2_verify, result: rejected_mechanism_mismatch}
        - {name: PQClean_aarch64_verify, result: rejected_mechanism_mismatch}
        - {name: mlkem-native, result: rejected_mechanism_mismatch}
        - {name: aws-lc, result: rejected_mechanism_mismatch}
      note: >-
        Executor must re-check the strict preference order once at run start.
        If still empty, second_impl_unavailable is the honest GOAL-criterion-2
        cross-impl outcome.

  inherited_objections_addressed:
    OBJ-RT005-001: True library-path interposition on probe-linked symbols.
    OBJ-RT005-002: Honest fixed-bound peer or second_impl_unavailable; no H-MLKEM-004 paraphrase.
    OBJ-RT005-004: Widened peer, if measured, explicitly scoped and non-load-bearing for criterion 2.
    OBJ-RT005-005: claim_tier capped at laboratory_implementation_conformance.
    OBJ-RT004-002: Superseded by true path requirement; SO-local alone insufficient.

  source_lock:
    wolfssl:
      repository: https://github.com/wolfSSL/wolfssl
      prefix_tag: v5.9.1-stable
      prefix_commit_peeled_expected: 1d363f3adceba9d1478230ede476a37b0dcdef24
      postfix_tag: v5.9.2-stable
      postfix_commit_peeled_expected: ac01707f552c611fbd135cc723b2682b3e7f80f2
      role: known_defective_detection_retention_control_and_patched_control
      established_by: EV-MLKEM-005
    second_implementation:
      selection_rule: >-
        At run start, re-evaluate the strict fixed-bound preference order:
        (1) BoringSSL ML-KEM assembly or fixed-bound compare if reachable;
        (2) PQClean ML-KEM with fixed-bound hand-written assembly comparison
        tails if reachable; (3) another pinned public fixed-bound target.
        If any strict candidate is buildable with mechanism evidence, pin it
        as criterion_used=strict_fixed_bound. Otherwise set the load-bearing
        GOAL-criterion-2 cross-impl outcome to second_impl_unavailable.
        Optionally measure PQClean ml-kem-1024 avx2 verify under
        criterion_used=widened_optimized_compare for laboratory continuity;
        that measurement MUST NOT license H-MLKEM-004 or GOAL criterion 2.
      requirement: >-
        Both comparison routine and public decapsulation entry must be
        reachable for any peer receiving an isolation-relevant verdict.
    fips_203:
      publication_date: '2024-08-13'
      doi: 10.6028/NIST.FIPS.203
      normative_algorithms: [17, 18]

  inputs:
    parameter_sets:
      ML-KEM-512: {ciphertext_bytes: 768}
      ML-KEM-768: {ciphertext_bytes: 1088}
      ML-KEM-1024: {ciphertext_bytes: 1568}
    keys_per_parameter_set: 4
    seed_policy: >-
      Four recorded seeds per parameter set. Seeds, ciphertext SHA-256, and
      shared-secret SHA-256 archived for every key; first key per parameter set
      archived as raw bytes under experiments/EXP-MLKEM-009/vectors/.
    true_library_path_adequacy_control:
      id: CTRL-TRUE-LIBRARY-PATH-INTERPOSITION
      construction: >-
        Externally interposed defective comparator on the library compare
        symbols used by substantive probes. For designated silent region R
        (default: final 32 bytes of ML-KEM-1024, indices 1536..1567), returns
        equal for every single-byte difference confined to R, and unequal for
        at least one seeded multi-byte coordinated pattern in R (G2) and at
        least one alignment/lane-boundary pattern in R (G3). Outside R, exact.
        Required mechanism: GNU ld -Wl,--wrap=mlkem_cmp,--wrap=mlkem_cmp_avx2,
        --wrap=mlkem_cmp_neon on linux/amd64 substantive probes so those
        library symbols are actually invoked. -DINTERPOSE_COMPARE /
        call-site bypass of mlkem_cmp* is FORBIDDEN as load-bearing
        adequacy evidence (OBJ-RT006-001). Library source, buffer lengths,
        and dispatch conditions are never modified.
      attestation: >-
        Record wrap link flags, wrapped symbol names, call counts or equivalent
        evidence that substantive probe invocations hit the wrapper.
        library_call_path_exercised may be true only when that evidence exists.
      scoring_rule: >-
        G2_minus_G1 / G3_minus_G1 from compare-return and/or decap-accept
        observations collected through substantive probes with wrap active.
        Must not special-case len(diffs)==1. Must not use sole SO-local
        adequacy_probe/dlopen as load-bearing pass evidence.
      pass_condition: >-
        G1 silent set on the control equals R (or documented subset/superset
        confined to R); G2_minus_G1 or G3_minus_G1 attributable to the control
        is non-empty via the wrapped library call path; known wolfSSL defect
        remains separately detected on unmodified library builds.
    generator_classes:
      G1_single_byte:
        description: xor 0x01 and xor 0xff at every ciphertext index.
      G2_multi_byte:
        description: >-
          Seeded coordinated flips of k contiguous and k scattered bytes for k
          in [2, 4, 8, 16], plus whole 16/32/64 byte block inversions, at seeded
          offsets covering the full length.
      G3_alignment:
        description: >-
          Mutations at every 16, 32, and 64 byte boundary index, at the last
          byte of each aligned block, and at the final partial block.
      G4_malformed_length:
        description: >-
          Truncated by 1/16/32 and extended by 1/16/32 bytes, submitted only to
          the public API. Never counted as a comparison omission.
      G5_key_dependence:
        description: Every class of G1 through G4 replayed across all four keys.
    probe_levels:
      primitive: Ciphertext comparison routine of each backend via wrapped/unwrapped symbols as required by stage.
      decapsulation: Public decapsulation API versus honest shared secret and implicit rejection.

  controls:
    - id: CTRL-TRUE-LIBRARY-PATH-INTERPOSITION
      method: >-
        GNU ld --wrap on linux/amd64; run G1/G2/G3 through substantive probes
        with wrap active before any isolation conclusion. INTERPOSE_COMPARE
        is not an admitted CTRL pass path.
      pass_condition: >-
        Undetected by G1 on R and detected by G2 or G3 with non-empty marginals
        via the wrapped library path; attestation present.
    - id: CTRL-POSITIVE-CONTROL-RETAINED
      method: Run every generator class against unmodified wolfSSL v5.9.1 AVX2 (no defective wrap).
      pass_condition: >-
        Every class reaching 1536..1567 detects that omission at the primitive
        level; decapsulation accepts at least one mutated ciphertext in that
        region.
    - id: CTRL-NEGATIVE-HARNESS
      method: Retain the deliberately truncated harness comparator from prior EXP-MLKEM packages.
      pass_condition: Each class flags exactly the omitted range it can reach.
    - id: CTRL-BACKEND-ATTESTATION
      method: >-
        Attest each backend by build configuration, symbol or disassembly
        evidence, and at least one decapsulation-boundary measurement for every
        backend receiving a conformance verdict. Attest interposition separately.
      pass_condition: No verdict on an unattested or primitive-only backend.
    - id: CTRL-STRONG-ANCHOR
      method: >-
        Validate against NIST ACVP ML-KEM encapDecap vectors if retrievable, or
        an in-tree KAT that is not shipped by the same implementation under
        test when grading that implementation strong.
      pass_condition: >-
        Anchor named and graded. Downloaded but unused NIST files must not
        upgrade the grade.
    - id: CTRL-MESSAGE-STABILITY
      method: Annotate each decapsulation accept with whether the mutated ciphertext still decrypts to the honest message.
      pass_condition: Accepts coincide with message-stable mutations, or every exception is enumerated.
    - id: CTRL-SECOND-PEER-SELECTION
      method: >-
        Record load-bearing GOAL-criterion-2 disposition (strict_fixed_bound
        peer measured, or second_impl_unavailable). Optionally record a separate
        widened laboratory peer with explicit non-criterion-2 binding.
      pass_condition: >-
        Selection rationale and mechanism evidence present, or
        second_impl_unavailable recorded after exhausting the frozen strict order.
    - id: CTRL-LENGTH-TABLE-SEPARATION
      method: Record every G4 result in a dedicated malformed-length table.
      pass_condition: No malformed-length result appears in any silent set.
    - id: CTRL-EXACT-COMMAND-AND-BUILD-ACCOUNTING
      method: >-
        Every run's command.txt is exact executable argv. Library clone/configure
        /build wall-clock is either inside a recorded run or in a separately
        archived pre-run stage with its own timing receipt referenced by the
        run manifests. Wrap link flags must appear in build/command evidence.
      pass_condition: No descriptive pipe-notation command strings; no silent build reuse without disclosure and timing.

  metrics:
    primary:
      - id: true_library_path_adequacy_marginal_detection
        definition: Whether G2_minus_G1 or G3_minus_G1 attributable to the interposed control is non-empty via the wrapped substantive-probe library call path.
        decision_use: Decide instrument adequacy under OBJ-RT005-001 repair.
      - id: known_defect_detection_by_class
        definition: Per class, whether the known v5.9.1 AVX2 omission is detected on unmodified library builds.
        decision_use: Detection retention.
      - id: new_silent_indices
        definition: Reproducible silent indices not already in EV-MLKEM-005, per target/backend/parameter set/class.
        decision_use: Isolation versus systemic.
      - id: decapsulation_accept_on_mutation
        definition: Count of mutated equal-length ciphertexts whose decapsulation returns the honest shared secret.
        decision_use: Bind primitive findings to the API boundary.
      - id: second_peer_criterion_and_match
        definition: Load-bearing GOAL-criterion-2 disposition plus any optional widened laboratory peer.
        decision_use: Whether criterion 2 honesty holds; whether isolation was asked under which criterion.
      - id: anchor_grade
        definition: strong, weak, or in_tree_self, with the file actually validated against named.
        decision_use: Qualify differential reference strength.
      - id: class_marginal_information
        definition: >-
          Findings attributable to G2, G3, or G4 that G1 did not produce.
          Rediscovery of the known wolfSSL defect MUST NOT be counted and MUST
          NOT set any added-discriminating-power flag to true.
        decision_use: Instrument adequacy and honesty.
    secondary:
      - mutations_executed_per_class
      - coverage_accounting_per_class
      - message_stability_annotations
      - second_peer_selection_rationale
      - interposition_attestation
      - wrap_link_flags
      - build_and_attestation_evidence
      - per_stage_wall_clock_seconds
      - peak_memory_gb

  replication:
    seeds: [1, 2, 3, 4]
    seed_policy: Deterministic; multi-byte offsets seeded and recorded.
    independent_instances: 4
    replication_rule: A finding is reportable only if it reproduces across at least two keys within its class.
    planned_runs:
      - id: RUN-MLKEM-033
        purpose: >-
          Clone/configure/build all targets, attest backends, construct and
          attest true library-path interposition, re-check strict fixed-bound
          then optional widened peer, establish and grade the conformance anchor.
      - id: RUN-MLKEM-034
        purpose: Run G1, G2, and G3 at the primitive level across all targets, interposed adequacy control, negative harness, and retained known defect.
      - id: RUN-MLKEM-035
        purpose: Decapsulation-boundary probe for every target and class, message-stability annotation, and G4 malformed-length table.
      - id: RUN-MLKEM-036
        purpose: Cross-implementation comparison, coverage accounting, vector archival, and outcome classification under frozen precedence.
    expected_run_count: 4
    agreement_gate: >-
      A silent index or accept is reportable only if primitive and decapsulation
      observations are consistent or their inconsistency is explicitly recorded.

  outcome_classification:
    precedence:
      - invalid_harness_or_dispatch
      - positive_control_undetected
      - synthetic_control_inadequate
      - systemic_incomplete_comparison
      - second_impl_unavailable
      - generator_hardening_insufficient
      - isolated_to_audited_commits
    invalid_harness_or_dispatch: >-
      A required build fails, a backend cannot be attested, interposition/wrap
      cannot be attested on the substantive probe path, no anchor can be
      established, exact-command or build-accounting control fails, or the
      decapsulation probe cannot be reached for a target that would otherwise
      receive a verdict.
    positive_control_undetected: >-
      A generator class reaching 1536..1567 fails to detect the known v5.9.1
      AVX2 omission on an unmodified library build, or the negative harness is
      not flagged.
    synthetic_control_inadequate: >-
      The interposed control is detected by G1, its designated G2/G3 patterns
      do not produce a non-empty marginal set through the wrapped library call
      path, scoring special-cases len(diffs)==1, or load-bearing adequacy
      evidence is only SO-local adequacy_probe/dlopen or INTERPOSE_COMPARE
      probe-local bypass (OBJ-RT006-001 recurrence).
    systemic_incomplete_comparison: >-
      A reproducible silent index or equal-length decapsulation accept appears
      in a wolfSSL post-fix backend or in a measured peer. Stop, record exact
      target/commit/backend/parameter set/class/index list, escalate. Construct
      no exploitation path.
    second_impl_unavailable: >-
      Strict fixed-bound preference order exhausted without a buildable pinned
      fixed-bound peer. This is the honest load-bearing GOAL-criterion-2
      cross-impl outcome when no fixed-bound peer is measured. Optional widened
      laboratory peer measurement does not displace this class for criterion 2.
    generator_hardening_insufficient: >-
      Interposition is attested but the control is not detected by G2 or G3
      through the wrapped library call path. Isolation is not licensed.
    isolated_to_audited_commits: >-
      True library-path adequacy control is G1-silent and G2-or-G3-detected via
      substantive probes; known defect and negative harness are detected; no new
      reproducible silent index or accept appears on any other measured target
      under any class. Record criterion_used for any peer measurement. Do not
      upgrade a widened_optimized_compare null to a strict_fixed_bound isolation
      claim or to H-MLKEM-004 / GOAL-criterion-2 satisfaction.

  budget:
    wall_clock_seconds_per_run: 1800
    total_wall_clock_seconds: 5400
    total_cpu_hours: 2.0
    maximum_memory_gb: 4
    maximum_runs: 4
    maximum_processes: 4
    network_operations: source_retrieval_and_package_install_only
    deployed_system_queries: 0
    mutation_cap_per_target_parameter_set: 20000
    stages:
      - id: build_select_anchor_interposition
        wall_clock_seconds: 1800
        stop_rule: >-
          If wrap/interposition cannot be attested, classify
          invalid_harness_or_dispatch or synthetic_control_inadequate as
          appropriate; do not claim isolation.
      - id: primitive_multiclass_grid
        wall_clock_seconds: 1500
        stop_rule: Stop at mutation cap; record coverage as partial for that class.
      - id: decapsulation_boundary_and_length
        wall_clock_seconds: 1200
        stop_rule: Stop at the cap; a partial API table is infrastructure signal, not a null.
      - id: comparison_and_packaging
        wall_clock_seconds: 900
        stop_rule: Stop without interpretation if any required artifact is incomplete.

  stopping_rules:
    - Stop and escalate immediately on any reproducible silent index or accept outside the known v5.9.1 defect; do not characterize further, do not build an exploitation path, contact no third party.
    - Stop the fixed-bound cross-implementation line and record second_impl_unavailable if no fixed-bound peer can be built within its stage budget after re-checking the frozen strict order.
    - Stop after the four planned runs; no exploratory fifth run.
    - Stop before any key recovery, oracle construction, query chaining, or attack-cost estimation.
    - Stop before touching any system, network endpoint, or key not created inside this experiment.
    - Stop at 5400 total wall-clock seconds, 2.0 CPU-hours, or 4 GB resident memory.

  invalidation_rules:
    - Any run lacks its exact command (exact argv), commit and dirty state, environment, dependency and compiler versions, timestamps, resource use, stdout, stderr, raw result, summary, or inference metadata.
    - Expected run count is not exactly four or a planned run has no terminal status.
    - A conformance verdict is issued for a backend without decapsulation-boundary evidence.
    - Library comparison logic, buffer lengths, or dispatch conditions were modified in-tree.
    - Malformed-length results are counted as comparison omissions.
    - A finding is reported without reproduction across at least two keys.
    - Load-bearing adequacy is only SO-local adequacy_probe/dlopen without wrap/call-site evidence on substantive probes.
    - library_call_path_exercised is hard-coded true without wrap/call attestation.
    - Adequacy scoring special-cases len(diffs)==1 or hard-codes single-byte-in-R acceptance.
    - Rediscovery of the known wolfSSL defect is counted as class_marginal_information or used to set an added-discriminating-power flag true.
    - A widened_optimized_compare null is described as answering the strict fixed-bound-tail isolation question, as H-MLKEM-004 support, or as GOAL completion criterion 2.
    - EV-MLKEM-008 is paraphrased as H-MLKEM-004 support.
    - An implementation is graded strong against vectors shipped inside itself.
    - Descriptive/stylized command.txt strings are used in place of exact argv.
    - Library builds are silently reused from a prior experiment without disclosure and timing attribution.
    - Any result is described as an exploit, an attack, or a disclosure-ready vulnerability claim.
    - A build, clone, toolchain, or emulator failure is interpreted as evidence about implementation correctness.

  success_criterion: >-
    The protocol succeeds as an audit if all four runs reach terminal status,
    true library-path interposition is attested and G1-silent/G2-or-G3-visible
    through substantive probes without len(diffs)==1 special-casing, the known
    defect and negative harness are detected, every conformance verdict rests on
    attested decapsulation-boundary evidence, the anchor is named and honestly
    graded, the strict fixed-bound peer is measured or second_impl_unavailable
    is the honest GOAL-criterion-2 disposition, coverage is accounted per class,
    exact commands and build accounting pass, and the outcome is uniquely
    classified under frozen precedence. H-MLKEM-009 is supported within this
    laboratory boundary only under isolated_to_audited_commits scoped to the
    criterion actually used for any peer claim, and never as H-MLKEM-004 support
    unless criterion_used=strict_fixed_bound with a measured fixed-bound peer.
  falsification_criterion: >-
    H-MLKEM-009 is falsified if a reproducible silent index or equal-length
    decapsulation accept appears in a wolfSSL post-fix backend or in a measured
    peer. The adequacy repair itself is falsified under
    synthetic_control_inadequate or generator_hardening_insufficient.
    Infrastructure failure falsifies nothing.

  required_artifacts:
    - experiments/EXP-MLKEM-009/source-lock.yaml
    - experiments/EXP-MLKEM-009/implementation.md
    - experiments/EXP-MLKEM-009/implementation/build_matrix.sh
    - experiments/EXP-MLKEM-009/implementation/multiclass_generator.py
    - experiments/EXP-MLKEM-009/implementation/library_path_interposition.py
    - experiments/EXP-MLKEM-009/implementation/compare_wrap.c
    - experiments/EXP-MLKEM-009/implementation/defective_compare.c
    - experiments/EXP-MLKEM-009/implementation/conformance_probe.c
    - experiments/EXP-MLKEM-009/implementation/decap_boundary_probe.c
    - experiments/EXP-MLKEM-009/implementation/run_experiment.py
    - experiments/EXP-MLKEM-009/analysis/second_implementation_selection.md
    - experiments/EXP-MLKEM-009/analysis/class_coverage_report.json
    - experiments/EXP-MLKEM-009/analysis/malformed_length_table.json
    - experiments/EXP-MLKEM-009/analysis/library_path_interposition_report.json
    - experiments/EXP-MLKEM-009/vectors/README.md
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-033/manifest.yaml
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-033/command.txt
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-033/environment.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-033/raw.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-033/summary.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-033/stdout.txt
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-033/stderr.txt
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-034/manifest.yaml
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-034/command.txt
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-034/environment.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-034/raw.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-034/summary.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-034/stdout.txt
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-034/stderr.txt
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-035/manifest.yaml
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-035/command.txt
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-035/environment.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-035/raw.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-035/summary.json
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-035/stdout.txt
    - experiments/EXP-MLKEM-009/runs/RUN-MLKEM-035/stderr.txt
