    - experiments/EXP-ECDLP-ff0559/runs/RUN-*/raw-result.json
    - experiments/EXP-ECDLP-ff0559/runs/RUN-*/manifest.yaml
    - experiments/EXP-ECDLP-ff0559/runs/RUN-*/stdout.txt
    - experiments/EXP-ECDLP-ff0559/stage0/derivation-note.md
    - experiments/EXP-ECDLP-ff0559/stage0/conventions-freeze.yaml
    - experiments/EXP-ECDLP-ff0559/stage0/library.yaml
    - experiments/EXP-ECDLP-ff0559/stage0/gate.yaml
    - experiments/EXP-ECDLP-ff0559/stage1/instrument-pins.yaml
    - experiments/EXP-ECDLP-ff0559/stage1/curve-manifest.yaml
    - experiments/EXP-ECDLP-ff0559/stage1/selfchecks.json
    - experiments/EXP-ECDLP-ff0559/stage1/gate-G1-C1.json
    - experiments/EXP-ECDLP-ff0559/stage1/gate-G2-homomorphism.json
    - experiments/EXP-ECDLP-ff0559/stage1/gate-G3-anomalous-panel.json
    - experiments/EXP-ECDLP-ff0559/stage1/gate-G4-C2.json
    - experiments/EXP-ECDLP-ff0559/stage1/stage1-summary.yaml
    - experiments/EXP-ECDLP-ff0559/implementation/ (dual-number arithmetic, delta and Sigma pipelines, gate drivers, curve generator; vendored copies of pinned instruments only with recorded blob ids)

  interpretation_limits:
    - >-
      No exponent moves and no attack. delta_KS is a measurement object; the
      anomalous arm reproduces a known attack (Belding 2007 abstract; Smart
      analogue) and is a calibration, never a result.
    - >-
      Stage 1 PASS certifies the instrument at the declared curves and panel only
      and says nothing about any DL-spectrum, any other direction, precision or
      reference convention, or any scale beyond field_bits 16.
    - >-
      A VOID or DEFERRED gate is infrastructure or instrument signal, never a
      negative result about delta_KS (AGENTS.md rule 3); (C2) failure is a
      derivation outcome about the identification only.
    - >-
      Any later E-LEAD outcome would be a candidate first computational handle in a
      local-torsion cell and requires independent review-breakthrough review at
      max effort (AGENTS.md rule 12) before any record states it.
    - Stage 2 and the 2^32 replication are designed after Stage 1 and are not approved here.

