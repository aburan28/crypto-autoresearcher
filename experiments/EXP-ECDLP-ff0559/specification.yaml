  heuristic_under_test: HEUR-ECDLP-4d92ee-H1
  heuristic_under_test_note: >-
    H1 is not tested at Stages 0-1; it is validated by the Stage 2 census
    (designed after Stage 1). Listed so the dependence is explicit.

  preregistered_prediction:
    quantity: >-
      Stage 0-1: exact failure counts (G1, G2, SC1-SC3 = 0; G2c > 0; G1s agreement
      = 0), 50 of 50 certified recoveries (G3), and zero (C2) mismatches or a
      recorded deferral (G4). The idea Stage 2 DL-spectrum prediction is frozen in
      frozen_outcome_table and not decidable here.
    formula: >-
      delta_triv(P) = lambda x_P / y_P exactly; s(P+Q) = s(P)+s(Q); delta(P) =
      alpha/(2 n y_P); Sigma(Q)/Sigma(P) = m; (x(t_2(P)) - x(t_1(P)))/p = 2 y_P
      delta_{(a',b')}(P) mod p.
    source: >-
      IDEA-20260930-8e3b75 claim (A)-(E), mechanism, predictions; the recipe and
      the (C2) sketch are labelled Coordinator hand derivations to be re-derived
      in Stage 0. Pre-registered, never tuned to data.
    claim_tier: toy
    measured_vs_modeled: >-
      All Stage 1 failure counts and recoveries are MEASURED (instrumented runs
      with manifests). Stage 0 derivations are DERIVED (reviewed later, not
      measured). The Stage 2 figures in frozen_outcome_table are MODELED
      predictions of the idea, labelled as such and never mixed with measured
      Stage 1 columns.

  frozen_outcome_table:
    status: >-
      FROZEN NOW (the idea says FIXED NOW) and NOT EXECUTION-AUTHORIZED. Carried
      verbatim from IDEA-20260930-8e3b75 so it cannot be re-read after any
      spectrum is seen. Operational Stage 2 design (cell manifests, library
      materialisation, null parity, FFT implementation pin) is designed after
      Stage 1.
    E_WHITE:
      rule: >-
        beta in [0.45, 0.60] for every library member AND the ratio of the member
        max spike to the null max spike lies in [0.5, 2] at every size (idea
        predictions[3]); also all members in band at all sizes with Gumbel Z in
        [0.5, 4], half-energy fraction 0.50 +- 0.05, slope in log p of (max spike /
        sqrt N) within +- 0.1 of zero (idea claim (E), predictions[4] and [6]).
      reading: >-
        The Kodaira-Spencer cell of the lifting taxonomy is closed at toy tier for
        this digit family with a measured obstruction, and KN-OPEN-3417fc
        equicharacteristic twin is answered negatively at toy scale (idea
        minimal_test OUTCOME TABLE). Scope: the declared curves, sizes, direction,
        reference, post-functions.
    E_LEAD:
      rule: >-
        some member has spike ratio to the null >= 4 at all three sizes with a
        non-decreasing trend and the null does not (idea predictions[3]).
      reading: >-
        Replicate at a fourth seed and one further size, then independent
        review-breakthrough at max effort (AGENTS.md rule 12) before any record
        states it; no exploit is modelled before that.
    INCONCLUSIVE: otherwise (idea predictions[3]).
    ARTIFACT: >-
      any (C1) failure, any anomalous-panel failure, any 2-torsion control miss:
      the run is void and says nothing (idea minimal_test OUTCOME TABLE).
    falsification_thresholds_fixed_now:
      - 'E-WHITE is falsified iff some member spike ratio to the null is >= 4 at every size (idea minimal_test)'
      - 'idea falsification_conditions[0] adds: with a non-decreasing trend (then E-LEAD, routed to replication and review)'
      - 'E-LEAD is falsified iff every member has ratio <= 2 at every size'
      - 'DISCLOSED WORDING DIFFERENCE: the trend clause appears in one idea statement and not the other; carried verbatim; reconcile by versioned amendment before Stage 2, never after any spectrum is seen'
    honest_prior_idea_label: '0.90 E-WHITE, 0.03 E-LEAD, 0.07 inconclusive (idea; never tuned)'
    meter_L_b_frozen: >-
      L within 0.1 bit and b within 5 percent of the random-label null with the
      same image size at N = 2^12 exhaustive; b below one quarter of the null at
      L >= 1 is a propagation signature, reported not interpreted (idea predictions[5]).

  sample_size_justification:
    C1_and_G2_and_G3: >-
      Exhaustive on the declared points, ordered pairs and the declared panel; no
      sampling, so no probability is resolved by sampling.
    G4_C2: >-
      10^3 points per curve (the idea figure, carried). Derived by the
      Coordinator from 1 - (1 - f)^1000, to be re-derived: a defect hitting a
      fraction f = 0.003 of points yields 3.0 expected failures per curve (the
      multiple) and detection probability about 1 - e^(-3) = 0.95 per curve; a
      systematic defect (a wrong factor or sign) affects about (p - 1)/p of all
      points and is detected with certainty.
    G3_panel: >-
      50 instances (the idea figure): a per-instance failure rate of at least
      0.06 is detected with probability at least 1 - 0.94^50, about 0.95 (derived,
      to be re-derived). The pass criterion is 50 of 50; the Clopper-Pearson
      one-sided 95 percent lower bound for the success rate at 50 of 50 (formula
      alpha^(1/50) with alpha = 0.05) is reported descriptively and is not a gate.

  scale_relevance:
    tier: toy
    justification: >-
      Stage 1 field sizes 10 to 16 bits. Evidence capped at claim_tier toy (the
      lane constraint of RQ-ECDLP-c1b7b1). The derivation note is scale-free but
      reviewed only later. No transfer to cryptographic p is asserted.
    correspondence: null

  tail_checks:
    - >-
      Any anomalous instance with Sigma(P) = 0 or a recovery mismatch is listed
      with its curve, p, a, b, Sigma values and transcript (not discarded,
      not replaced).
    - >-
      Any G4 mismatch is listed point by point with t_1, t_2 residues and the
      precision actually achieved by the a26bde instrument (margin used).
    - >-
      Descriptive: the number of distinct values of delta_KS(P) y_P / x_P across
      points on each curve (confirms direction (1, 0) is not proportional to x/y).

  optimistic_assumptions:
    - assumption: Hand-derived recipe delta = alpha/(2 n y_P) is correct as written
      bias_direction: >-
        If wrong, G1 fails at once (it tests the identical pipeline in the trivial
        direction) and nothing is reported; the risk is wasted effort, not a false pass.
    - assumption: The a26bde driver can be driven on toy-curve lifts with integer coefficient shifts by p without editing it
      bias_direction: >-
        If not, G4 is deferred, which weakens the bridge claim (C2) but not the instrument.

  memory_accounting: >-
    Dominant structures: the per-curve table of s(P_i) at 12 bits (about 4096 dual
    points) and the 16-bit point lists (about 65 thousand points); a few MB each.
    peak_rss_bytes is measured and reported per run; no large buffer.

  hidden_overhead_honesty: >-
    No asymptotic claim is made, so nothing hides in an o(1). The dual-number
    arithmetic costs about 3 field multiplications per F_p multiplication (idea,
    estimate); the all-ordered-pairs gate at 12 bits is of order 10^7 dual
    additions, pure Python, an advisory estimate of tens of minutes to a few hours.

  standardized_parameter_sets:
    - name: Stage1-C1-curves
      field_bits_and_seed: [[12, 20260905], [14, 20260905], [16, 20260905], [16, 20260906], [16, 20260907]]
      enumeration: all non-identity points
      lambda: [1, 2, p-1]
    - name: Stage1-G2-curve
      field_bits_and_seed: [[12, 20260905]]
      enumeration: all ordered pairs of non-identity points
    - name: Stage1-G3-anomalous-panel
      field_bits: [10, 12, 14, 16]
      instances: 50
      allocation: [13, 13, 12, 12]
    - name: Stage1-G4-C2
      field_bits_and_seed: [[16, 20260905], [16, 20260906], [16, 20260907]]
      points_per_curve: 1000
  curve_generation_rule: >-
    For each (field_bits, seed): draw p uniformly from [2^(bits-1), 2^bits) with
    the tag-1 stream and take the next prime below 2^bits (redraw if none); draw
    a, b uniform in [1, p-1]; reject if the discriminant vanishes; compute n =
    E.order() (naive, confirmed at all sizes here); accept the first candidate
    with n prime and n != p. Record trace, p+1-n, embedding degree (multiplicative
    order of p mod n), factorisation of the twist order p + 1 + t, the draw index.
    j not in {0, 1728} holds because a != 0 and b != 0.
  affected_vs_safe_scope: >-
    AFFECTED (instrument validity only): the declared toy curves and panel. SAFE
    and untouched: every deployed curve, every exponent, every other
    construction. No security statement and no break claim.

  stopping_rules:
    - Stop Stage 0 after the four stage0 artifacts exist; if any of S0.1-S0.3, S0.6, S0.7 is false, halt before Stage 1 and report the exact step.
    - Stop Stage 1 after G1, G1s, G2, G2c, G3, G4 and the summary exist, or on a blocking-gate failure after a verified-correct implementation (archive the transcript first).
    - A timeout, crash or missing dependency is failed_infrastructure, never a mathematical miss.
    - On any implementation defect, record BUG-EXP-ff0559-NNN with the diagnosis, fix, and re-run ALL gates against the final implementation hash as a new run; voided runs stay archived and are never rewritten or deleted.
    - Never run any Stage 2 computation, however cheap.

  invalidation_rules:
    - Missing required artifacts invalidate the run.
    - Overwriting an existing run record invalidates the procedure.
    - Changing success or falsification criteria, the library, the direction, the reference convention, the panel rule or the seeds after observing any outcome without a versioned protocol_amendment invalidates interpretation.
    - A pinned instrument whose bytes differ from the base commit invalidates the run (failed_infrastructure) until re-pinned by amendment.
    - Reporting any DL-spectrum statistic, spike, Z, beta or meter value from this contract invalidates the report (out of scope).
    - Replacing an anomalous panel instance after a failure invalidates the G3 reading.
    - Reading any conclusion about delta_KS from a voided or deferred gate invalidates the interpretation.
    - Any claim of an attack, an exponent move or a transfer beyond the declared curves invalidates the report.

  success_criterion: >-
    Stage 0: stage0/gate.yaml shows S0.1 to S0.7 true, with (C2) and (C3)
    resolved as derived or as an explicit obligation or failure point and (D)
    naming its two recalled inputs. Stage 1: SC1-SC3 zero failures; G1 zero
    failures at every curve and lambda and G1s agreement zero; G2 zero failures
    and G2c strictly positive failures; G3 50 of 50 certified recoveries; G4
    reported as PASS (zero mismatches), FAIL or DEFERRED with its reason. Stage 1
    PASS means the instrument is usable by a later, separately designed Stage 2;
    it supports no statement about the spectrum of delta_KS.

  falsification_criterion: >-
    Any Stage 0 derivation step of (A), (B), (C1) that cannot be derived as stated
    (halts Stage 1); any G1 mismatch; any G2 failure or G2c zero count; any G3
    instance failing its certificate (including Sigma(P) = 0); each of these voids
    the instrument after a verified-correct implementation and is never negative
    evidence about delta_KS. A G4 mismatch falsifies only (C2) as a derivation
    outcome. Infrastructure failures are never mathematical evidence.

