  conventions_frozen_now:
    curve_class: >-
      E: y^2 = x^3 + a x + b over F_p, p > 3, ordinary, #E(F_p) = n prime, n != p,
      a != 0, b != 0 (j not in {0, 1728}).
    ring: R = F_p[eps]/eps^2; elements (u, w) = u + eps w.
    deformation_direction: >-
      (a', b') = (1, 0); the deformed curve E_eps is y^2 = x^3 + (a + eps) x + b.
    trivial_direction: (a', b') = lambda (4a, 6b), lambda in {1, 2, p - 1} at Stage 1.
    reference_convention: >-
      ref(P) = (x_P, y_P + eps (a' x_P + b')/(2 y_P)); direction (1, 0) gives
      ref(P) = (x_P, y_P + eps x_P/(2 y_P)). Zero x-displacement at every order.
    kernel_identification: >-
      K_t acts on any point above P by (x, y) -> (x + eps 2 y_P t, y + eps (3 x_P^2
      + a) t); psi(K_t) = t.
    delta_definition: delta(P) = psi(s(P) - ref(P)) in F_p; s(P) the unique order-n point above P.
    computation_B: delta(P) = -(n^{-1} mod p) psi([n] ref(P)).
    recipe_to_be_rederived_in_stage_0: >-
      alpha = eps-coefficient of x([n-1] ref(P)) - x_P; delta(P) = alpha/(2 n y_P)
      mod p. Derived by the Coordinator by hand, UNREVIEWED; S0.7 requires the
      Executor to re-derive it or replace it by a proved alternative before any
      gate uses it.
    s_construction: >-
      s(P) = ref(P) + K_delta, that is (x_P + eps 2 y_P delta, y_P + eps((a' x_P +
      b')/(2 y_P) + (3 x_P^2 + a) delta)).
    anomalous_functional: >-
      Sigma(P) = psi([p] ref(P)) = -alpha/(2 y_P) with alpha from x([p-1] ref(P));
      m = Sigma(Q) / Sigma(P) mod p for Q = [m] P. Same re-derivation duty (S0.4).
    delta_2_KS_default_definition: >-
      DEFAULT, to be confirmed or replaced with a recorded reason BEFORE Stage 1
      begins and never after a spectrum is seen: over R_3 = F_p[t]/t^3 with
      E_t: y^2 = x^3 + (a + t) x + b, ref_3(P) = (x_P, y(t)) with y(t)^2 =
      x_P^3 + (a + t) x_P + b, y(t) = y_P mod t (unique by Hensel since 2 y_P is
      a unit) - the zero x-displacement convention at every order; s_3(P) the
      unique order-n point above P; delta_2_KS(P) := the t^2 coefficient of
      psi_3(s_3(P) - ref_3(P)), where psi_3 is the formal logarithm of the
      invariant differential dx/(2y) on the kernel (a group of order p^2); the
      t coefficient of psi_3 equals delta_KS. The choice of psi_3 as the formal
      logarithm, rather than a coordinate parameter, is part of the freeze.
    seeds: [20260905, 20260906, 20260907]
    stream_rule: >-
      One numpy PCG64 stream per (field_bits, seed): numpy.random.Generator(
      numpy.random.PCG64(numpy.random.SeedSequence([seed, field_bits, tag]))),
      with tag 1 for curve generation, tag 2 for generator point and scalar
      draws, tag 3 for the C2 point sample. Stream tags and numpy version are
      recorded in the manifest. Seeds are the lane-standard seeds of the sibling
      census contracts, an operational choice of the Coordinator.
    frozen_library_for_stage_2:
      note: >-
        Frozen now so that it cannot be altered after any value is seen
        (idea: library frozen before any log is tabulated). Not execution
        authorized. stage0/library.yaml records the exact enumeration and its
        sha256; no member may be added after Stage 1 begins.
      base_members:
        - delta_KS (precision 2, direction (1, 0), vertical reference)
        - delta_2_KS (precision 3, direction a + t, same reference convention; definition above)
        - delta_triv (direction (4a, 6b), lambda = 1) as the exact control
      post_functions: >-
        e(delta/p) (additive character); residue indicators 1[delta = j mod m] for
        m in {2, 4, 8} and every j; Legendre(delta) with 0 mapped to 0; the
        half-interval indicator 1[delta < p/2]; each applied to both delta_KS
        and delta_2_KS (idea claim (E) and minimal_test LIBRARY).

  controls:
    - name: S0_derivation_self_checks
      stage: 0
      blocking: true
      object: >-
        S0.1 numbered steps for (A), (B), (C1), each step number unique and
        sequential. S0.2 (C1) re-derived: s(P) - ref(P) = eps (lambda x/y) V_P
        using the identity 3 y^2 - 2 a x - 3 b = 3 x^3 + a x on the curve.
        S0.3 (C2) derived, or exactly one failure point recorded. S0.4 (C3) Sigma
        additivity derived (cocycle term killed by [p] on K); the criterion derived
        or marked an obligation with the Belding pointer kept; the
        trivial-direction qualifier (Sigma_triv = 0) resolved. S0.5 (D) states
        its TWO recalled inputs by name with provenance recalled. S0.6
        conventions-freeze.yaml and library.yaml written with the exact
        enumeration. S0.7 closed-form recipe delta = alpha/(2 n y_P) and the
        anomalous Sigma recipe re-derived (or replaced by a proved alternative)
        and shown consistent with (B).
      pass_criterion: all seven true in stage0/gate.yaml
      fail_consequence: Stage 1 does not start; exact failing step reported; not negative evidence.
    - name: SC1_on_curve_and_SC2_reduction_agreement_and_SC3_associativity
      stage: 1
      blocking: true
      object: >-
        Instrument self-checks (additive to the idea; they validate the dual-number
        arithmetic before any gate). SC1 every computed point of E_eps lies on
        E_eps over R. SC2 the eps = 0 part of every dual-number group operation
        equals harness/toycurve.py EllipticCurve.add on the reduced points, on a
        seeded sample of 10^4 operations. SC3 associativity (P+Q)+R = P+(Q+R) on
        10^4 seeded triples of points of E_eps (reduction x-coordinates pairwise
        distinct).
      pass_criterion: zero failures in SC1, SC2, SC3
      fail_consequence: dual-number arithmetic defective; fix, record BUG-EXP-ff0559-NNN, re-run all gates; never reported as a mathematical outcome.
    - name: G1_C1_trivial_direction_exact_identity
      stage: 1
      blocking: true
      source: IDEA predictions[0], controls[0] (zero tolerance)
      object: >-
        For each of the five curves (one 12-bit, one 14-bit at seed 20260905; one
        16-bit at each of seeds 20260905, 20260906, 20260907) and each lambda in
        {1, 2, p - 1}: run the full delta pipeline in direction lambda (4a, 6b) on
        EVERY non-identity point and compare the integer residue mod p with
        lambda x_P y_P^{-1} mod p.
      pass_criterion: 'zero mismatches, bit for bit, on every point of every curve at every lambda (failure count = 0)'
      fail_consequence: instrument void; nothing is reported about delta_KS (idea falsification_conditions).
    - name: G1s_comparator_sentinel
      stage: 1
      blocking: true
      object: >-
        Additive sentinel: the same comparison against lambda x_P/y_P + 1 mod p
        must agree on ZERO points (agreement count = 0), proving the comparator
        can fail.
      pass_criterion: agreement count exactly 0 on every curve and lambda
      fail_consequence: comparator vacuous; G1 result void.
    - name: G2_exhaustive_homomorphism
      stage: 1
      blocking: true
      source: IDEA minimal_test.procedure (1), controls[1]
      object: >-
        One 12-bit ordinary prime-order curve (seed 20260905, direction (1, 0)):
        compute s(P_i) for every non-identity P_i = i g, 1 <= i <= n-1; for every
        ordered pair (i, j), 1 <= i, j <= n-1, with i + j != 0 mod n test
        s(P_i) + s(P_j) == s(P_{i+j mod n}) in E_eps(R) (doubling formula when
        i = j); for i + j = 0 mod n test s(P_{n-i}) == -s(P_i) (x equal in R, y
        negated in R). All n^2-scale ordered pairs, no sampling.
      pass_criterion: zero failures
      fail_consequence: instrument void.
    - name: G2c_nonhomomorphic_reference_control
      stage: 1
      blocking: true
      object: >-
        The proves-too-much control: the same pair test applied to ref instead of
        s MUST report a strictly positive failure count (the cocycle c(P, Q) is
        not identically zero), and the fraction of failing pairs is reported.
      pass_criterion: failure count > 0
      fail_consequence: G2 is vacuous; G2 void.
    - name: G3_anomalous_panel_with_certificates
      stage: 1
      blocking: true
      source: IDEA predictions[2], claim (C3), controls[2]
      object: >-
        Panel rule (frozen now, no replacement after a failure): the FIRST 50
        admissible anomalous curves in generator order, allocated 13, 13, 12, 12
        to field_bits 10, 12, 14, 16 (Coordinator operational allocation, not an
        idea threshold; if fewer admissible curves exist at a size the shortfall
        moves to the next larger size and is recorded, never padded). Admissible:
        p prime in [2^(bits-1), 2^bits), a != 0, b != 0, #E(F_p) = p confirmed by
        naive E.order(), distinct (p, j) pairs. Search method: random (p, a, b) from
        the tag-1 stream with E.order_bsgs() as a screen, each admitted curve
        confirmed by E.order(); non-CM provenance recorded. For each: P =
        lift_x of a tag-2 draw, m uniform in [2, p-1] from tag 2, Q = [m] P by
        harness EllipticCurve.mul; compute Sigma(P), Sigma(Q) by the dual-number
        pipeline in direction (1, 0); recovered m' = Sigma(Q) Sigma(P)^{-1} mod p;
        certificate [m'] P = Q re-verified by harness/toycurve.py (independent of
        the dual-number code).
      pass_criterion: '50 of 50 instances with certificates that re-verify; a single failure (including Sigma(P) = 0) voids the positive control'
      fail_consequence: construction-level positive control void; no white reading may ever be reported on this instrument; the failing curve, p, a, b, Sigma values and transcript are archived; replacing the instance would need a versioned amendment.
    - name: G4_C2_lift_derivative_against_p_adic_instrument
      stage: 1
      blocking: false
      source: IDEA predictions[1], claim (C2), controls[5]
      object: >-
        On each of the three 16-bit curves, 10^3 points (a seeded sample without
        replacement from the non-identity points, tag 3; all points if n <= 10^3):
        with integer coefficients (A1, B1) = (a, b) and (A2, B2) = (a + p, b)
        (direction (a', b') = (1, 0)), compute t_1(P), t_2(P) mod p^2 with
        experiments/EXP-ECDLP-a26bde/driver instrument.torsion_section (K = 2,
        lift_fn = hensel_lift_point with the same branch y_P), and compare
        (x(t_2(P)) - x(t_1(P)))/p mod p with 2 y_P delta_KS(P) mod p computed by
        the dual-number pipeline.
      pass_criterion: 'zero mismatches on all 3 x 10^3 points; DEFERRED is a permitted recorded outcome'
      fail_consequence: >-
        A failure does NOT void the instrument or Stage 2 eligibility; it falsifies
        the identification of delta_KS with the lift-derivative of the p-adic
        torsion digit and is recorded as a derivation outcome (idea). Deferral
        (if the a26bde driver cannot be driven on these lifts without editing it,
        or a precision error is raised) records the exact reason in
        stage1/gate-G4-C2.json and is never negative evidence.
    - name: stage_2_inherited_controls_frozen_not_authorized
      stage: 2
      blocking: true
      object: >-
        Seeded random-function null with identical post-functions and code path,
        hash recorded; the 2-torsion descent symbol on a cyclic even-order curve
        at each size (a miss at any size voids the run); the decay test in p
        across the three sizes for every member; the idea null and a
        PARITY-MATCHED null (random odd function) per the hypothesis collision
        finding; invalidation rules inherited from the pinned 184fc4 effective
        contract. Pass/fail criteria are those of that contract and of the idea
        outcome table below; operational design is a Stage 2 task.
      pass_criterion: as defined at Stage 2 design; not decidable under this contract
      fail_consequence: not applicable at Stages 0-1

