experiment:
  id: EXP-ASCON-494e1d
  hypothesis_id: null
  hypothesis_id_note: Explicitly null, not omitted. This contract is a DRAFT derived from its parent
    proposal IDEA-20260816-1166e9; the /design-experiment step that mints a specified hypothesis from
    that proposal has not been run, and only the Coordinator may mint one (AGENTS.md rule 1). Naming
    an existing hypothesis here would bind the contract to a claim it was not designed to test, which
    is worse than naming none. The field is null rather than absent so a reader cannot mistake it
    for an overlooked one.
  derived_from_idea: IDEA-20260816-1166e9
  question_id: RQ-ASCON-2dfd8b
  version: 1
  status: draft
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  title: Enumerate and exactly classify every admissible round-constant schedule slice of the permutation
    into identical, translation-equivalent and structurally distinct classes, against random-constant
    and all-zero null schedules
  objective: 'The one uncertainty a run reduces is whether the expression the r-round permutation
    names a single function under the standardized specification. Concretely: (i) enumerating every
    admissible (r, offset) window within the declared schedule length, how do the resulting r-round
    functions partition into classes that are identical, related by a constant translation the nonlinear
    layer commutes with, or structurally distinct as witnessed by an exhibited distinguishing input;
    (ii) does the identical classification applied to a random-constant schedule of the same length
    place essentially every pair in the structurally distinct class, which is the only evidence the
    classifier is not collapsing functions, and does an all-zero schedule collapse entirely as forced;
    (iii) how many pairs require a distinguishing-input certificate because the exact checks do not
    settle them, which measures how much of the audit rests on search rather than on algebra. If the
    schedule is not longer than the largest call the question dissolves and that resolution is the
    run''s complete result.'
  what_this_is_not:
  - Not an attack, a key recovery, a forgery, a distinguisher, or a cryptanalytic result of any kind.
    It is a measurement contract.
  - Not a claim, in either direction, about the security of any deployed scheme or parameter set.
  - Not a status change to any hypothesis, evidence record, decision or goal record, and not a promotion
    of any knowledge entry.
  - Not approval, freezing, execution authorization, a run, an observed output, or evidence. No run
    has been executed under this contract.
  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: 'The maximal supportable claim is: under the pinned schedule
      of length L and the stated constant-addition geometry and indexing convention, the admissible
      slice family partitions as reported, the random-constant null partitioned as reported, the all-zero
      null collapsed as forced, and N pairs required certificates which are attached and independently
      re-verified. WHAT DOES NOT FOLLOW: that any published statement is ambiguous or wrong; that
      a structural difference between slices has any cryptanalytic consequence; that any property
      of Ascon, SP 800-232 or any deployed system is implicated. The audit''s product is an index
      requirement for future records, nothing more.'
  inputs:
    procedure: 'STAGE 0 (human time, blocking or partially waivable): pin the schedule, its length,
      the constant-addition geometry and the indexing convention, or declare the candidate sets for
      the sweep. STAGE 1 (half a day): implement the permutation parameterised by an explicit constant
      window, plus the GF(2) linear layer and a bit-slice enumeration of the nonlinear layer; run
      the test-vector gate at the standard slice. STAGE 2 (minutes): enumerate all admissible (r,
      offset) slices per candidate schedule length. STAGE 3 (minutes of CPU): for every same-r pair,
      run the exact coincidence check, then the translation-commutation check verified by exhaustive
      bit-slice enumeration. STAGE 4 (minutes): for unsettled pairs, search a few thousand random
      inputs for a distinguishing input; record and independently re-verify each certificate. STAGE
      5 (minutes, same invocation): repeat the whole classification for the random-constant and all-zero
      null schedules, and run the self-comparison control. STAGE 6 (minutes): emit the partitions,
      class sizes, certificates, control outcomes, candidate-length sweep results and seeds to the
      run record.'
    instrument: Python 3.11 with numpy for the permutation and the GF(2) linear layer; itertools for
      slice enumeration and exhaustive bit-slice enumeration of the nonlinear layer; pytest for the
      test-vector gate, the self-comparison control and the forced null behaviours; harness/runner.py
      for the manifest, seeds and inference block. No Sage, no computer algebra system, no SAT or
      MILP solver -- every check here is either a direct comparison or an enumeration over a small
      slice.
    parameters: 'Declared schedule length swept over the candidate values including the reported sixteen
      and the standard twelve. Round counts r covering the full call count, the reduced inter-block
      candidates, and every r from 1 to the schedule length for completeness. Offsets from 0 to schedule
      length minus r. Admissible slice count therefore at most a few hundred, enumerated exactly.
      Distinguishing-input search: 4096 random inputs per unsettled pair, with the count declared
      before the run. Nonlinear-layer commutation verified by exhaustive enumeration over the full
      bit slice. Three schedules: real, random-constant (seeded), all-zero.'
  controls:
  - Random-constant schedule null of matched length, identical classification, same invocation, seed
    recorded.
  - All-zero schedule null, where every slice must be identical, confirming the classifier can detect
    coincidence.
  - 'Self-comparison control: every slice compared with itself must classify as identical.'
  - 'Certificate re-verification: every exhibited distinguishing input re-evaluated independently
    of the search that found it.'
  - Schedule-length sweep across the candidate lengths, so a partition is never reported for an assumed
    length as though it were pinned.
  - Nonlinear-layer commutation check verified independently by exhaustive enumeration over one bit
    slice, since that check carries the affine-equivalence classification.
  - 'NULL OBJECT (from the parent proposal, mandatory under docs/inventor-protocol.md ''null-object
    controls before belief''): A RANDOM-CONSTANT SCHEDULE of the same length, drawn from a recorded
    seed and sliced identically, classified by the IDENTICAL procedure in the SAME invocation. Since
    random constants have no reason to be related by translation, the null must place essentially
    all slice pairs in the structurally distinct class. If the real schedule''s partition is indistinguishable
    from the null''s, the classification is detecting the act of slicing rather than any property
    of the schedule, and the record is a controlled null. A SECOND null uses an all-zero schedule,
    where every slice must coincide exactly -- the opposite extreme -- confirming the classifier can
    detect coincidence when it is present.'
  independent_variables:
  - round count r
  - schedule offset
  - schedule arm (real / random-constant null / all-zero null)
  - candidate schedule length
  metrics:
    primary:
    - partition of the slice family into identical / translation-equivalent / structurally distinct,
      with class sizes, per arm
    - count of pairs requiring a distinguishing-input certificate
    - random-constant null structurally-distinct fraction
    - all-zero null identical fraction
    secondary:
    - exhaustive commutation-check outcome per candidate translation
    - self-comparison control outcome
    - certificate re-verification outcomes
    - admissible slice counts per candidate schedule length, wall-clock
  heuristic_under_test: null
  preregistered_prediction:
    quantity: The partition sizes (n_identical, n_translation, n_distinct) of the admissible same-r
      slice pairs, per schedule arm.
    formula: 'For same-r slices S1 = (c_j..c_{j+r-1}) and S2 = (c_k..c_{k+r-1}): classify IDENTICAL
      iff the constant windows are equal elementwise; else classify TRANSLATION-EQUIVALENT iff there
      is a state translation t, supported on the constant-addition word, with P_{S2}(x) = P_{S1}(x
      + t) + t for all x, decided exactly by checking that t commutes with the nonlinear layer under
      exhaustive bit-slice enumeration and that the linear layer maps t to itself; else classify STRUCTURALLY
      DISTINCT, witnessed by an exhibited input x with P_{S1}(x) not equal to P_{S2}(x). Forced predictions:
      all-zero schedule gives n_distinct = 0 and n_translation = 0; random-constant schedule gives
      n_distinct/(total pairs) at least 0.99. The real schedule''s partition is not pre-committed.'
    source: Pre-registered in the parent proposal IDEA-20260816-1166e9 before any run under this contract
      exists. Never tuned to data; a run that reports a different quantity reports a different experiment.
  scale_relevance:
    tier: toy
    justification: The object is the full-size permutation at its own round counts, so nothing is
      scaled down; what is bounded is the SLICE FAMILY, which is finite and small by construction
      -- at most a few hundred slices for any plausible schedule length -- so the enumeration is literally
      exhaustive over the declared family. The only extrapolation is the classification of pairs settled
      by a distinguishing-input search rather than by exact algebra, and those are labelled individually
      with their certificates so a reader can see exactly which cells rest on search; no aggregate
      claim is made over unsettled pairs.
    correspondence: null
  tail_checks:
  - r equal to the full schedule length, where only one slice exists and the partition must be trivial.
  - r equal to 1, where the maximum number of slices exists and any coincidence is a direct statement
    about repeated constants.
  - Offset 0 versus the maximum offset at the standard call round count, the pair most likely to be
    used at different call sites.
  - The standard call's own slice, checked against test vectors so the classification is anchored
    to a validated function.
  - A schedule length equal to the largest call count, the degenerate case where the ambiguity does
    not arise and the run must report that cleanly rather than producing an empty partition.
  replication:
    seeds:
    - 20260816
    - 20260817
    - 20260818
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Halt before classification if the permutation fails the test-vector gate at the standard slice,
    or if the self-comparison control fails.
  - Halt and report an instrument defect if either null schedule does not behave as forced.
  - Stop the distinguishing-input search at the declared 4096 inputs per pair; an unsettled pair is
    reported as unsettled and never rounded to identical.
  - Stop at maximum_runs or total_cpu_hours, whichever binds first; a budget exhaustion is a stop,
    never a negative result (AGENTS.md rule 5).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'A run whose null-object arm is missing, or whose control arm was not executed in the same invocation
    as the signal arm, is invalid_measurement: the comparison the contract exists to make was not
    made.'
  - Any claimed solve, relation or distinguisher whose certificate fails independent re-verification
    by the run wrapper makes the run completed_invalid (docs/claims-and-verification.md).
  - A run whose parameters differ from the frozen contract is a DIFFERENT experiment and requires
    a new contract; it is never a repair of this one.
  success_criterion: The test-vector gate and self-comparison control pass, both null schedules behave
    as forced, and the real schedule's partition is reported with class sizes, per candidate schedule
    length, with every certificate attached and independently re-verified and every unsettled pair
    labelled unsettled.
  falsification_criterion:
  - The all-zero null produces any non-identical pair, or the random-constant null produces coincidences
    above a negligible rate.
  - Any self-comparison fails to classify as identical.
  - Any certificate fails independent re-verification.
  - The real schedule's partition is statistically indistinguishable from the random-constant null's,
    forcing a controlled-null record.
  - The test-vector gate fails at the standard slice.
  - The declared schedule length cannot be pinned and the candidate sweep does not include the true
    length, in which case the partition is reported per candidate and no candidate is asserted.
  required_artifacts:
  - manifest.yaml with the exact command, commit sha, dirty-tree state, resolved model/inference block
    and environment
  - raw-result.json carrying every per-instance measurement, not summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - the pre-registration text, written before the first run and hashed
  - certificates for any claimed solve, relation or distinguisher
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval is required before execution. This contract is DRAFT and is NOT approved;
    `approved_by` is null and `execution_authorized` is false (AGENTS.md rule 1).
  - If the parent proposal is proof-oriented, its `proof_search_map` must be audited before implementation
    or expensive experiments (KN-TECH-080).
  - A /design-experiment pass must mint the specified hypothesis this contract tests before it can
    leave draft; no hypothesis is invented here.
  derivation_provenance:
    tool: session-authored draft contract
    source_record: IDEA-20260816-1166e9
    authored_at: '2026-08-16'
    note: 'The design, controls, metrics and criteria were authored together with the parent proposal,
      so the contract states what the proposal''s minimal_test intends rather than re-rendering its
      prose. Boilerplate that is identical across contracts by program rule -- invalidation rules,
      required artifacts, approval gate, replication seeds -- comes from a fixed table. Budgets come
      from the parent''s declared estimated_cost.compute through the table in tools/derive_experiment_contracts.py.
      No field is invented: a value the proposal did not supply is null.'
  derivation_gaps:
  - The schedule, its length, the constant-addition geometry and the indexing direction are all unpinned
    here; a Coordinator must file the specification as a KN-LIT entry or ratify the candidate sweep,
    noting the RQ constraint against experiment design before both documents are filed.
  - The equivalence relation is fixed as constant translation; a Coordinator must decide whether a
    broader relation should be tested, since a pair distinct under translation could be equivalent
    under something wider.
  - Whether the slice index becomes a required field on round-indexed applicability cells is a schema
    decision for the Coordinator, not something this experiment can settle.
  - The ten endian-matched proposals were seen by filename only and must be read to confirm none already
    occupies this framing.
