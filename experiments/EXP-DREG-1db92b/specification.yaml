experiment:
  id: EXP-DREG-1db92b
  hypothesis_id: H-DREG-a53645
  derived_from_idea: IDEA-20260805-2dc8de
  question_id: RQ-DREG-001
  goal_id: GOAL-DREG-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false

  title: >-
    Zero-compute audit of RQ-DREG-001's decision variable: provenance resolution of
    the five committed D = 5 deficits, four scale-free normalisations of them, an
    all-zero null control, a constant-share positive control, and a graded
    beta-family that locates each candidate variable's detection threshold

  objective: >-
    The one uncertainty a run reduces is whether the scalar RQ-DREG-001 will use to
    decide support / weaken / reject_scoped can carry a decision at all. A run
    establishes (i) whether each of the five committed D = 5 deficits resolves to a
    rank, a seed, a degree, an instrument version and an artifact path - the check
    that can end the line and whose failure is itself the deliverable; (ii) whether
    the reference model reconstructed from this lane's frozen definitions reproduces
    every committed reference integer exactly, which is the precondition for any
    ratio meaning anything; (iii) the four scale-free columns for every resolved
    cell, beside the raw sequence; (iv) the verdict of every candidate decision
    variable on an all-zero null, on a constant-share positive control, and across
    a graded family that locates its flip point; and (v) the degree-shortfall table
    against phi_full(n), which says whether the goal's own clause "evaluated at D up
    to and including d_reg where reachable" has been met at any rung.
    THIS CONTRACT COMPUTES NO MACAULAY RANK AND BUILDS NO POLYNOMIAL SYSTEM. Its
    budget floors sit at the template minima (600 s, 8 GB) purely for form: the work
    is exact integer arithmetic on a few dozen committed integers plus synthetic
    control sequences, and the honest cost is reading artifacts, not computing.
    No attack, no exponent and no ECDLP hardness statement follows from a run, and
    no run under this contract may change any status.

  what_this_is_not:
    - >-
      NOT a measurement of d_reg, of any rank, or of anything about the boolean
      Semaev system. It divides committed integers by reproduced integers.
    - >-
      NOT an edit of RQ-DREG-001's completion criterion, of GOAL-DREG-001, or of any
      existing record. Changing a criterion is a Coordinator protocol_amendment and
      a separate committed act.
    - >-
      NOT a null verdict on RQ-DREG-001 and NOT grounds to close or deprioritise
      GOAL-DREG-001. A collapsing share is consistent with a real subleading
      structure that becomes leading near d_reg.
    - >-
      NOT approval, freezing, execution authorization, a run, or evidence. No run has
      been executed under this contract.

  claim_ceiling:
    tier: toy
    exact_scope_a_run_could_support: >-
      MAXIMAL SUPPORTABLE SCOPE. For the committed D = 5 deficit cells of
      GOAL-DREG-001 at n in {12, 15, 17, 18, 21} on the boolean chained Semaev
      system at m = 3, t = 3, ti = 0 over GF(2), for those cells that RESOLVE to a
      rank, a seed, a degree and an artifact path: the reported provenance status
      per cell, the reported raw and normalised sequences, the reported verdicts of
      each candidate decision variable on the three control families, the reported
      flip points, and the reported degree-shortfall table. WHAT DOES NOT FOLLOW -
      anything about the truth of RQ-DREG-001's decision target; anything at
      unresolved cells; anything at D other than 5; anything at n beyond 21;
      anything about prime fields, other m or t, or ECDLP hardness; and no growth
      rate, exponent or extrapolation of any kind.

  inputs:
    procedure: >-
      STAGE 0 (zero compute, DECLARED AND HASHED FIRST, BEFORE ANY NUMBER IS READ).
      Freeze, in one declaration file: (a) the reference definitions -
      H_n(z) = (1+z)^{nb}(1+z^2)^{-n}(1+z^3)^{-n}, nb = n + 3*ceil(n/3),
      sr_pred(n,D) = N(nb,D) - sum_{k<=D} h_k^+, ncols(n,D), sum_{k<=D} h_k(n),
      h_D(n); (b) THE EXPLICIT LIST OF COMMITTED REFERENCE INTEGERS the
      reconstruction must reproduce, each with its source path and sha256 - the
      regression fixture; (c) the CANDIDATE DECISION VARIABLE SET, which must
      include the raw integer criterion "a deficit that grows with n" exactly as
      RQ-DREG-001 states it, the four shares, and the departure rule frozen in
      EXP-DREG-620b15 Stage 0 if that contract exists at execution time; (d) the
      verdict rule each candidate applies to a sequence; (e) the beta grid; (f) the
      out-of-sample n. Hash the declaration. NOTHING BELOW MAY BE ALTERED AFTER
      THIS POINT except through a versioned protocol_amendment.
      STAGE 1 (reading, BLOCKING, AND IT CAN END THE CONTRACT). Resolve each of the
      five committed D = 5 deficits to a tuple (committed rank, seed, D, instrument
      version, artifact path, sha256 of that artifact, admitted-or-quarantined
      status). A cell that cannot be resolved is marked UNRESOLVED and DROPPED from
      every sequence; it is never estimated, reconstructed or inferred from a
      summary line. Emit the resolution table. If fewer than three cells resolve,
      STOP: the table is the deliverable.
      STAGE 2 (arithmetic, BLOCKING). Recompute the reference quantities from the
      Stage 0 definitions and check them against the Stage 0 regression fixture,
      integer by integer, reporting each committed value beside its reproduced
      value. A single mismatch STOPS the contract.
      STAGE 3 (CONTROLS, RUN AND THEIR VERDICTS COMMITTED BEFORE STAGE 4). Put every
      candidate decision variable through, in this order: the ALL-ZERO NULL sequence
      (deficit 0 at every rung); the CONSTANT-SHARE positive control
      (deficit = c * h_D(n)); and the GRADED family deficit = c * h_D(n)^beta for
      beta in {0, 0.25, 0.5, 0.75, 1.0}. Record each candidate's verdict on each,
      and its located flip point. Write and hash these verdicts BEFORE any real
      deficit is passed through the same code.
      STAGE 4 (arithmetic). Emit, for every RESOLVED cell, the raw deficit and the
      four ratio columns as exact rationals and as decimals to the declared
      precision, and the monotonicity verdict of each candidate variable on the real
      sequence - both over all resolved rungs and over the on-lattice-only
      subsequence, reported side by side without picking.
      STAGE 5 (arithmetic). Emit the degree-shortfall table phi_full(n) - D_measured
      for EVERY committed cell of GOAL-DREG-001 that Stage 1 could locate, and the
      FORCED out-of-sample values of the four shares at n = 24 and n = 27 for a
      hypothetical deficit, expressed as the threshold deficit at which each share
      would equal its n = 21 value. These are the pre-registered out-of-sample
      tests.
      STAGE 6 (zero compute, FORWARD GUIDANCE ONLY). State the candidate replacement
      decision variables that survived every control and what each would require.
      THIS IS GUIDANCE, NOT AN AMENDMENT: no existing record is edited and no
      criterion is changed by this contract.
    instrument: >-
      Python 3.11, exact integer and rational arithmetic (fractions.Fraction) in
      every decision path; floating point permitted only in a display column that no
      verdict reads. No polynomial system is constructed, no linear algebra is
      performed, no Macaulay matrix is materialized. Recorded through
      harness/runner.py with the standard manifest.
    parameters: >-
      m = 3, t = 3, ti = 0, D = 5. Cells n in {12, 15, 17, 18, 21}. Denominators
      sr_pred(n,5), ncols(n,5), sum_{k<=5} h_k(n), h_5(n). Graded control beta in
      {0, 0.25, 0.5, 0.75, 1.0} with at least 4 interior rungs. Out-of-sample n in
      {24, 27}. Number of new Macaulay ranks computed: ZERO.
    inherited_numbers_are_not_facts: >-
      The specific integers asserted by IDEA-20260805-2dc8de - the five deficits, the
      four reference columns, the four ratio columns and the phi_full sequence - are
      INPUTS TO BE CHECKED, not premises. Every one of them is reported beside its
      independently reproduced value, and a run that reports a ratio without
      reproducing its denominator is invalid under the rules below.

  controls:
    - >-
      NULL OBJECT OF THE SAME SHAPE, FORCED VALUE PRE-DERIVED, AND IT CAN FAIL. The
      all-zero null sequence - the full-support random null whose deficit is 0 at
      every rung - is passed through EVERY candidate decision variable. A sequence
      of exact zeros MUST be classified TRACKING by every candidate. Any candidate
      classifying it as DEPARTURE is disqualified and reported as disqualified. A
      badly formed ratio with the deficit in the denominator divides by zero and is
      eliminated on the spot; that is a real failure mode of this control, not a
      formality.
    - >-
      POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR. The constant-share sequence
      deficit_D(n) = c * h_D(n) is a genuine departure by construction. At least one
      candidate MUST return DEPARTURE on it. If NO candidate fires, the analysis is
      blind to the phenomenon RQ-DREG-001 exists to detect and NOTHING about the real
      deficits is reported.
    - >-
      GRADED CONTROL WITH FOUR INTERIOR POINTS. deficit_D(n) = c * h_D(n)^beta for
      beta in {0, 0.25, 0.5, 0.75, 1.0}, spanning constant-absolute-deficit to
      constant-share. The beta at which each candidate flips is reported as an
      interval between adjacent grid points. This converts "the criterion is wrong"
      into "this criterion's detection threshold sits at beta in [x, y]".
    - >-
      ORDERING CONTROL, BINDING. The null, positive and graded control verdicts are
      computed, written and hashed BEFORE the five real deficits are passed through
      the same code. A run in which the real sequence was scored first is invalid,
      because the candidate set could then have been shaped by the answer.
    - >-
      BASELINE REPRODUCTION FIXTURE. The reconstruction must reproduce every
      committed reference integer named in Stage 0, exactly, with each committed
      value printed beside its reproduced value and its source path and sha256. This
      is the check that the denominators are this lane's own convention rather than a
      plausible-looking substitute.
    - >-
      PROVENANCE CONTROL. A cell that does not resolve is DROPPED, not estimated. The
      resolution table records, per cell, exactly which of (rank, seed, D, instrument
      version, path) was recoverable, so a later reader can see the evidence base
      rather than the conclusion.
    - >-
      LATTICE-PARITY CONTROL. Every sequence verdict is reported twice - over all
      resolved rungs and over the on-lattice-only subsequence - because the raw
      non-monotonicity sits exactly at the on-lattice/off-lattice transition and
      restricting the sequence is a defensible reading that must be visible rather
      than silently excluded.

  independent_variables:
    - 'candidate decision variable: raw integer, or one of the four shares, or an imported departure rule'
    - 'sequence family: real resolved deficits, all-zero null, constant-share, graded beta'
    - beta within the graded family
    - 'rung set: all resolved rungs versus the on-lattice-only subsequence'
    - denominator choice among the four references

  metrics:
    primary:
      - >-
        Provenance resolution status per committed D = 5 cell: RESOLVED or
        UNRESOLVED, with the recovered (rank, seed, D, instrument version, artifact
        path, sha256, admitted-or-quarantined status) tuple, and the count resolved
        out of five.
      - >-
        Reproduction result per committed reference integer: committed value,
        reproduced value, MATCH or MISMATCH, with source path and sha256.
      - >-
        The four ratio columns - deficit/sr_pred(n,5), deficit/ncols(n,5),
        deficit/sum_{k<=5} h_k(n), deficit/h_5(n) - as exact rationals, for every
        RESOLVED cell.
      - >-
        Monotonicity verdict of every candidate decision variable on: the real
        resolved sequence, the on-lattice-only subsequence, the all-zero null, the
        constant-share positive control, and each beta rung of the graded family.
      - >-
        Located flip point per candidate, as an interval between adjacent beta grid
        values, or the explicit statement that the candidate never flips in [0,1].
      - >-
        Degree-shortfall table: phi_full(n) - D_measured at every committed cell
        located in Stage 1, with the count of cells at D >= phi_full(n).
      - >-
        Forced out-of-sample thresholds at n = 24 and n = 27: for each denominator,
        the deficit value at which that share would equal its n = 21 value.
    secondary:
      - sha256 of the Stage 0 declaration and of the Stage 3 control verdicts, timestamped in that order.
      - The seed structure actually available per cell, and how many cells share a seed.
      - Decimal renderings of the ratio columns to the declared precision, marked display-only.
      - Wall time and peak RSS (expected negligible; recorded so the zero-compute claim is checkable rather than asserted).
      - The list of candidate decision variables disqualified by the null control, with the reason.

  heuristic_under_test: HEUR-DREG-NORM-1
  heuristic_under_test_note: >-
    Stages 3 and 5 are the validation for HEUR-DREG-NORM-1 of H-DREG-a53645 - that a
    structural departure holds a non-vanishing share of its reference. The heuristic
    is interpretive rather than distributional, so its validation is the graded
    control that LOCATES its detection threshold rather than a distribution
    comparison; the threshold is the honest quantification of what the heuristic
    buys and where it would fail. HEUR-DREG-NORM-2 (that the reconstruction is this
    lane's convention) is validated by the Stage 2 regression fixture, which is
    blocking.

  preregistered_prediction:
    quantity: >-
      The monotonicity verdict of each candidate decision variable on the resolved
      D = 5 deficit sequence, and the reproduction result of the reference model
      against the committed regression fixture.
    formula: >-
      RAW: the sequence n -> deficit_5(n) over the resolved rungs is NOT
      non-decreasing; specifically deficit(15) > deficit(17).
      NORMALISED: each of deficit/sr_pred, deficit/ncols, deficit/sum_{k<=5} h_k and
      deficit/h_5 is STRICTLY DECREASING at every resolved rung, including the
      off-lattice rung n = 17.
      CONTROLS, FORCED: every candidate returns TRACKING on the all-zero null; at
      least one candidate returns DEPARTURE on the constant-share control.
      DEGREE: phi_full(n) - D_measured > 0 at every committed cell.
      This contract predicts the SHAPE of the answer, not the verdict on
      RQ-DREG-001, and it explicitly does not predict which way that question
      resolves.
    source: >-
      Pre-registered in the parent proposal IDEA-20260805-2dc8de, whose predictions
      block states the raw sequence is "NOT MONOTONE - specifically deficit(15) >
      deficit(17)" and that all four normalisations are "STRICTLY DECREASING in all
      four, at all five rungs". The GRADED beta family and the ORDERING control are
      also the parent proposal's. This contract's additions are: the blocking
      reproduction fixture in Stage 2, the requirement that flip points be reported
      as intervals rather than points, and the dual reporting of the on-lattice-only
      subsequence. All numeric values asserted by the proposal are inputs to be
      checked in Stage 2, never premises.

  scale_relevance:
    tier: toy
    justification: >-
      The tested parameters are exactly the committed cells: boolean chained Semaev,
      m = 3, t = 3, ti = 0, D = 5, n in {12, 15, 17, 18, 21} over GF(2), single-seed
      at most rungs. THE TRANSFER ASSUMPTIONS ARE STATED AND ARE NARROW. First, that
      a scale-free comparison across an n-indexed family is the right comparison -
      HEUR-DREG-NORM-1, which is interpretive and could fail for a threshold
      phenomenon that switches on near d_reg. Second, that the five cells are
      mutually comparable - which is TESTED in Stage 1, not assumed. NOTHING here
      transfers to prime-field systems, to other m or t, to n beyond 21, to D other
      than 5, or to any statement about ECDLP hardness, and the contract forbids
      such a statement being written from a run under it.
    correspondence: null

  tail_checks:
    - >-
      Report the extreme rungs explicitly: the largest and smallest value of each
      share, and the total fall from the first to the last resolved rung, so a
      reader can see the magnitude rather than only the direction.
    - >-
      Report each ratio as an exact rational as well as a decimal; a monotonicity
      verdict decided on rounded decimals at the fourth place is not a verdict.
    - >-
      Report the single closest adjacent pair in every share column - the step with
      the smallest decrease - since "strictly decreasing" is carried by its weakest
      step and that step is where the finding would break first.
    - >-
      Report the off-lattice rung n = 17 separately in every table, since it is
      where the raw non-monotonicity sits and where a lattice-parity artifact would
      show.
    - >-
      Report the outcome at the beta grid endpoints (beta = 0 and beta = 1) for every
      candidate, since a candidate that flips at neither endpoint is uninformative
      across the whole family and that must be visible.

  replication:
    seeds: []
    independent_instances: 0
    note: >-
      NO SEEDED COMPUTATION EXISTS IN THIS CONTRACT. The arithmetic is deterministic
      and exact, so replication is re-execution by an independent agent from the
      Stage 0 declaration alone, which is the review path rather than a seed list.
      The SEEDS THAT MATTER are the ones attached to the committed cells, and
      recovering them is Stage 1's primary metric rather than a parameter of this
      contract. The synthetic control sequences are constructed deterministically
      from h_D(n) and the declared c, with no randomness.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 6
    maximum_workers: 1
    note: >-
      Sized at the template floors for form, not because the work needs them. The
      computation is exact arithmetic on a few dozen integers and would complete in
      seconds; the real cost is Stage 1's artifact reading, which is bounded by
      maximum_runs rather than by CPU. A run that consumes a material fraction of
      this budget is doing something this contract did not ask for and should be
      inspected.

  stopping_rules:
    - >-
      STOP at the end of Stage 1 if fewer than three of the five committed deficits
      resolve. The resolution table is the deliverable and no sequence statement is
      emitted.
    - >-
      STOP at the end of Stage 2 on any single mismatch between a reproduced
      reference integer and its committed value. The mismatch, with both values and
      the source path, is the deliverable.
    - >-
      STOP at the end of Stage 3 if NO candidate decision variable returns DEPARTURE
      on the constant-share positive control. Nothing about the real deficits is
      reported.
    - >-
      STOP at maximum_runs or total_cpu_hours, whichever binds first.

  invalidation_rules:
    - >-
      A run that computes any new Macaulay rank, builds any polynomial system, or
      performs any linear algebra is OUT OF CONTRACT and invalid. This contract's
      whole value is that the existing data already decides.
    - >-
      A run that writes to, edits, or supersedes any existing ledger, experiment,
      goal or knowledge record is invalid. The write scope is this contract's own run
      directory.
    - >-
      A run that emits a ratio column for an UNRESOLVED cell, or that fills an
      unresolved cell from a summary line, a narrative, or another record's
      restatement, is invalid_measurement.
    - >-
      A run that scores the real deficit sequence before the Stage 3 control verdicts
      are written and hashed violates the ordering control and is invalid.
    - >-
      A run that decides a monotonicity verdict from a rounded decimal rather than an
      exact rational is invalid_measurement.
    - >-
      A run whose candidate set omits the raw criterion exactly as RQ-DREG-001 states
      it is invalid: the raw criterion is the incumbent and cannot be excluded from
      the comparison it is the subject of.
    - >-
      A run whose parameters differ from this frozen contract is a DIFFERENT
      experiment and requires a new contract.
    - >-
      A timeout, crash or read failure is failed_infrastructure and is NEVER negative
      evidence about the deficit sequence, the decision variable, or RQ-DREG-001
      (AGENTS.md rule 5).

  success_criterion: >-
    ALL of the following, each decidable from the primary metrics. (1) The Stage 0
    declaration exists and is hashed before any number is read, and its hash is in
    the manifest. (2) The provenance table is complete for all five cells - every
    cell marked RESOLVED with its full tuple, or UNRESOLVED with which components
    were missing - and at least three cells are RESOLVED. (3) Every committed
    reference integer in the Stage 0 fixture is reproduced exactly, each printed
    beside its committed value with source path and sha256. (4) The Stage 3 control
    verdicts were written and hashed BEFORE the real sequence was scored, with the
    two timestamps and hashes in the manifest, and the all-zero null returned
    TRACKING for every surviving candidate while at least one candidate returned
    DEPARTURE on the constant-share control. (5) The four ratio columns are emitted
    as exact rationals for every RESOLVED cell. (6) The flip point of every candidate
    is reported as an interval on the beta grid, or explicitly as "never flips".
    (7) The degree-shortfall table and the forced n = 24 / n = 27 thresholds are
    emitted. A run meeting (1) to (7) is VALID, and the verdicts on (V2), (V3) and
    (V5) are then whatever the arithmetic returns. THE CONTRACT PRIVILEGES NO
    OUTCOME: raw-monotone and raw-non-monotone, shares-agreeing and
    shares-disagreeing, are all reportable results.

  falsification_criterion:
    - >-
      Two or more of the five deficits fail provenance resolution, or resolve to
      different D, different instruments, or incomparable conventions. (V1) fails,
      the sequence is not a sequence, and NO monotonicity statement may be made -
      including this contract's own. This is the most likely single failure and it is
      a genuine deliverable about the lane's evidence base.
    - >-
      Any committed reference integer fails to reproduce. (V0) and HEUR-DREG-NORM-2
      fail; the denominators are not this lane's convention and no ratio is emitted.
    - >-
      Any one of the four normalisations fails to strictly decrease across the
      resolved rungs. (V3) fails as stated; all four are then reported without
      picking a denominator, and the corrected variable is declared
      under-determined.
    - >-
      The raw sequence turns out to be monotone across all resolved rungs under one
      comparable convention. (V2) fails and the raw criterion survives on the tested
      data.
    - >-
      A candidate replacement decision variable classifies the all-zero null as a
      DEPARTURE, or fails to classify the constant-share control as one. That
      candidate is dead and is reported as dead.
    - >-
      A committed cell is found at D >= phi_full(n). (V5) fails, and that cell
      becomes the most valuable point in the goal because it is the only one at which
      the normalised question can be asked AT the freeze degree.

  required_artifacts:
    - >-
      manifest.yaml with the exact command, commit sha, dirty-tree state, environment
      and dependency versions, and the resolved model / inference block including
      requested_policy, resolved model identifier, model_verified and reasoning
      effort.
    - >-
      stage0-declaration.yaml - reference definitions, the committed-integer
      regression fixture with paths and sha256, the candidate decision variable set
      including the raw criterion verbatim, the verdict rule, the beta grid and the
      out-of-sample n - with its own sha256 recorded in the manifest BEFORE any other
      stage output exists.
    - >-
      provenance-table.json - one row per committed D = 5 cell with RESOLVED or
      UNRESOLVED, the recovered tuple, the artifact path and its sha256, and the
      admitted-or-quarantined status of that cell.
    - >-
      reproduction-table.json - committed value, reproduced value, MATCH/MISMATCH,
      source path and sha256, one row per fixture integer.
    - >-
      control-verdicts.json, written and hashed BEFORE results.json, containing every
      candidate's verdict on the all-zero null, the constant-share control and each
      beta rung, with its located flip interval.
    - >-
      results.json - the raw sequence, the four exact-rational ratio columns per
      resolved cell, the candidate verdicts on the real sequence over all resolved
      rungs AND over the on-lattice-only subsequence, the degree-shortfall table, and
      the forced n = 24 / n = 27 thresholds.
    - >-
      forward-guidance.md - the surviving candidate decision variables and what each
      would require, stated as guidance only, explicitly not an amendment and
      explicitly editing no record.
    - stdout and stderr, measured wall time and peak RSS, and validity status with its reason.

  assigned_to: executor
  approved_by: null
  approval_gate:
    - >-
      COORDINATOR DRAFTING DOES NOT APPROVE. This contract is `review_required`,
      approved_by is null, frozen is false and execution_authorized is false.
      Approval is a separate committed Coordinator decision and is the maintainer's
      gate, because approval is what authorizes execution.
    - >-
      The ORDERING CONTROL must remain in the frozen protocol. Without control
      verdicts committed before the real sequence is scored, a reviewer cannot
      distinguish a candidate set chosen on principle from one chosen after seeing
      the answer, and the whole contract's evidential value rests on that
      distinction.
    - >-
      The Stage 2 reproduction fixture must remain BLOCKING. A normalisation against
      an unreproduced denominator is arithmetic about a different object.
    - >-
      NO OUTCOME OF THIS CONTRACT AUTHORIZES A STATUS CHANGE, a criterion edit, a
      lane closure, or a deprioritisation of GOAL-DREG-001. A finding that the
      decision variable cannot carry a decision is an input to a Coordinator
      protocol_amendment, and that amendment is a separate committed act.

  overlap_declaration:
    - >-
      WITH EXP-DREG-c208ae. Both contracts read committed GOAL-DREG-001 deficit-cell
      records and would otherwise duplicate the provenance work. DECLARED DIVISION:
      this contract's Stage 1 provenance table is the AUTHORITATIVE artifact for the
      D = 5 cells and EXP-DREG-c208ae consumes it rather than re-deriving it;
      EXP-DREG-c208ae's verbatim criterion extraction is authoritative for the D = 6
      CTRL-B cell's admitted status and this contract consumes THAT rather than
      re-adjudicating it. CROSS-CHECK THAT CAN FAIL: both must agree on the identity
      of the n = 12, seed 2026 cell; a disagreement means one of the two is wrong and
      neither result may be interpreted until it is resolved.
    - >-
      WITH EXP-DREG-620b15. That contract MEASURES d_reg and gap(n); this one
      measures nothing. They overlap only in what they DECIDE: if both are approved,
      EXP-DREG-620b15's frozen departure rule enters this contract's candidate set
      and is put through the same null, positive and graded controls, making this
      contract a CONTROL ON THAT CONTRACT'S DECISION RULE. It must be run so that it
      cannot re-score EXP-DREG-620b15's data after the fact: this contract touches no
      run record of another contract and emits verdicts only on synthetic control
      families and on already-committed integers.

  derivation_provenance:
    tool: coordinator subagent, /design-experiment lifecycle steps 3-4
    source_record: IDEA-20260805-2dc8de
    authored_at: '2026-09-04'
    numbers_not_verified: >-
      The Coordinator that drafted this contract re-derived NONE of the integers
      asserted by the parent proposal. They appear here only as the Stage 2 fixture's
      subject matter, and any decision resting on them before Stage 2 runs would be a
      decision resting on unverified arithmetic.
    note: >-
      Drafting is not approval. No handoff exists, no executor has been dispatched,
      and no compute has been spent under this contract.
