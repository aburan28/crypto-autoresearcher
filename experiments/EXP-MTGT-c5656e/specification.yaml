experiment:
  id: EXP-MTGT-c5656e
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-e0ddc6
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'THE TRANSPORT COMPATIBILITY DICHOTOMY: preprocessing survives an isogeny exactly when its
    VALUE is a function of the (point, scalar) pairing and dies exactly when its value is a function
    of the ENCODING, so a known-log table transports at 100% while a distinguished-point store, an
    x-coordinate index and an enumeration-testable factor base all revert to the chance baseline --
    and the sharp middle case is the ALGEBRAIC description degree of a factor base, which a resultant
    argument shows IS preserved while every shape invariant that non-algebraic decomposition exploits
    is not'
  status: draft
  objective: "(A) THE DICHOTOMY, STATED AS A CRITERION. Preprocessing for a discrete-log attack is\
    \ a set A together with a VALUE PREDICATE v that says what makes an element of A useful. Let phi:\
    \ E -> E' be an F_p-isogeny with gcd(deg phi, N) = 1. Then:\n  CLASS I -- GROUP-VALUED PREPROCESSING.\
    \ v depends only on the pair\n    (group element, its logarithm). Examples: a known-log table\n\
    \    {(R_i, r_i)}, a factor-base LOGARITHM table, a set of relations among\n    stored points,\
    \ a kangaroo trap set indexed by log. For these,\n    v(phi(R), r) = v(R, r) identically, because\
    \ phi|_G is an injective\n    homomorphism (T1). TRANSPORT IS EXACT AND LOSSLESS. Retention 1.000.\n\
    \  CLASS II -- ENCODING-VALUED PREPROCESSING. v depends on how the point is\n    WRITTEN. Examples:\
    \ the distinguished-point predicate \"the low d bits of\n    x(R) are zero\", a hash-bucket index\
    \ on x(R), a Gaudry/Semaev factor base\n    defined by \"x(R) lies in the interval [0, B)\", any\
    \ structure whose test\n    is an ENUMERATION or COMPARISON on field elements. For these,\n  \
    \  v(phi(R)) is a function of x(phi(R)) = f_phi(x(R)) where f_phi is a\n    rational function\
    \ of degree deg phi, and NO relation between v(phi(R))\n    and v(R) survives. TRANSPORT MOVES\
    \ THE SET AND DESTROYS THE VALUE.\n    Retention reverts to the chance baseline |A| / #E'(F_p).\n\
    \  CLASS III -- THE SHARP MIDDLE, WHICH IS THE PART WORTH MEASURING. A\n    Semaev-style factor\
    \ base is F = {R : g(x(R)) = 0} for a polynomial g of\n    degree B. Its image is phi(F) = {R'\
    \ : g'(x(R')) = 0} where\n    g'(X) = Res_x( g(x), X*den_phi(x) - num_phi(x) ), and deg g' <=\
    \ B\n    because g has only B roots and each contributes one value. SO THE\n    ALGEBRAIC DESCRIPTION\
    \ DEGREE IS A TRANSPORT INVARIANT. What is NOT\n    invariant is the SHAPE of the root set: an\
    \ interval maps to a set with\n    the same cardinality, the same description degree, and (predicted)\n\
    \    random additive structure. Hence: the GROBNER-side difficulty of\n    decomposition, which\
    \ is governed by deg g and by the summation\n    polynomial, transports; the ENUMERATION-side\
    \ and LATTICE-side methods,\n    which need interval-ness or subspace-ness, do not.\n\n(B) WHY\
    \ THE CRITERION IS THE RIGHT ONE AND NOT A RESTATEMENT. The criterion is exactly the lossy-projection\
    \ test of docs/inventor-protocol.md applied to the preprocessing object. Class I projections discard\
    \ the encoding, and the encoding is discarded COMPATIBLY with phi, because phi is a homomorphism\
    \ on the retained part. Class II projections also discard information -- but they discard the\
    \ group-theoretic part and RETAIN the encoding, and the encoding is precisely what phi does not\
    \ respect, so the retained part does not propagate deterministically. A projection whose retained\
    \ part fails to propagate is not a tracked object at all; it is a coincidence detector. That is\
    \ the general statement of why EXP-ISADV-001 measured nothing: its advice set was an x-coordinate\
    \ set, i.e. Class II, and it was moreover moved by NO map.\n(C) THE ONE-STEP PROPAGATION IS DEFINABLE\
    \ AND MEASURABLE FOR EVERY CLASS, WHICH IS WHAT MAKES THIS A PROPOSAL AND NOT A TAXONOMY.\n  Class\
    \ I: retention_I = (# transported entries passing [r]phi(P) == phi(R))\n    / S. Predicted 1.000\
    \ exactly.\n  Class II-DP: retention_DP = (# transported entries that are still\n    distinguished\
    \ under the SAME predicate) / S. Predicted 2^{-d}, the\n    chance rate, for every ell >= 2, and\
    \ 1.000 at ell = 1 ONLY IF the\n    isomorphism is the identity on x -- note an F_p-isomorphism\
    \ of short\n    Weierstrass curves acts by x -> u^2 x, so even at ell = 1 a low-bits\n    predicate\
    \ is destroyed while a DILATION-INVARIANT predicate is not.\n    This asymmetry is a prediction,\
    \ not a nuisance.\n  Class II-BOX: retention_BOX = |f_phi(B) intersect B| / |B| for B the\n  \
    \  factor-base interval. Predicted |B|/p, the chance rate, for ell >= 2.\n  Class III: deg g'\
    \ measured by actually forming the resultant, predicted\n    EXACTLY <= B and generically = B;\
    \ and, separately, the additive energy\n    E(f_phi(B)) compared against E(B) and against a random\
    \ set of the same\n    size. Predicted: E(u^2 B) = E(B) exactly at ell = 1 (dilation is an\n \
    \   additive automorphism -- a rigorous positive control), and\n    E(f_phi(B)) ~ random for ell\
    \ >= 2.\n\n(D) WHY THE ANSWER MATTERS TO THE CAMPAIGN AND NOT ONLY TO L13. If Class III had turned\
    \ out fully invariant -- if a low-degree factor base transported to a low-degree factor base WITH\
    \ its shape -- then a class-wide search for the curve on which the factor base is best-conditioned\
    \ would be a live lane (L1's target). The resultant argument says the DEGREE part transports,\
    \ so that particular hope is already partly dead by algebra, at zero compute. The measurement\
    \ decides the shape part, and a positive there (shape survives) would be a genuine surprise that\
    \ reopens L1/L4."
  resource_label: R8 primary (what makes preprocessing preprocessing), R4 (the isogeny supplies the
    map), R1 secondary (x-coordinates as field elements are the object of the Class II and Class III
    measurements).
  admissibility: admissible
  admissibility_argument: 'The Class I half is exactly the H-ENDO-001 / KN-FIND-b7e091 situation and
    yields nothing on its own -- and this record SAYS so rather than presenting a 100% retention rate
    as a discovery. The admissible content is Class II and Class III: they concern the behaviour of
    FIELD-LEVEL data (x-coordinates as elements of F_p, factor-base description polynomials) under
    an isogeny, which is resource R1 crossed with R4. A generic-group oracle cannot answer "is x(phi(R))
    in [0, B)" because it returns opaque labels, so the question is not GGM-simulable and the closure
    of KN-FIND-b7e091 does not reach it. The honest caveat: escaping the GGM is necessary, not sufficient,
    and the predicted answer on the admissible half is DESTRUCTION, i.e. an admissible resource that
    measurably provides nothing.'
  reachability_gate: 'LOW-DEMAND: this record does not need to reach a SPECIFIED curve. Every measurement
    is of the form "take any isogeny of degree ell out of E and look at what happens", so a SINGLE
    STEP of a random walk suffices and the reachability cost is one isogeny construction, O(ell^3)
    field operations in the conservative ordinary-curve model (research/JMV004_branch_a_scouting_20260726.md,
    SCOUTING). The vectorization hardness of T5 does not bind here at all. This is the cheapest possible
    position on the gate and is one reason this record is a good first test for the lane: it buys
    the lane''s central algebraic fact without paying path-finding.'
  inputs:
    procedure: 'STAGE 0 (zero compute, HARD GATE): the Step 1 symbolic resultant at ell = 2, 3. Kills
      the Class III claim outright if it fails. STAGE 1 (minutes, THE CHEAP DISCRIMINATOR): one toy
      class at p = 1009 or similar; one ell = 2 isogeny; measure Class I retention, Class II-DP retention
      and the ell = 1 positive control. Three numbers. This separates the dichotomy''s two halves
      and validates the instrument in one run. STAGE 2 (minutes): the ell sweep {1, 2, 3, 5, 7, 11}
      and the decay test. STAGE 3 (hours): additive energy, AP counts, deg g'', and the Groebner proxy
      on the larger toy ladder.'
    mechanism: 'STEP 1 -- ZERO-COMPUTE ALGEBRA, DONE BEFORE ANY RUN. Write out f_phi for ell = 2 and
      ell = 3 from Velu explicitly; form the resultant g''(X) = Res_x(g(x), X*den(x) - num(x)) symbolically
      for a small g; confirm deg g'' <= deg g. If this fails the Class III claim is wrong and the
      record is superseded before any compute is spent. STEP 2 -- CLASS I ARM. As in IDEA-20260807-a127ab
      Step 4: transport a known-log table and certify every entry. Predicted 1.000. STEP 3 -- CLASS
      II-DP ARM. Fix a distinguished-point predicate with rate 2^{-d} for d in {2, 3, 4}. Build a
      set of S distinguished points on E. Transport by phi. Measure the fraction still distinguished
      on E''. Predicted 2^{-d}, i.e. the chance rate, indistinguishable from a random size-matched
      subset of E''(F_p). STEP 4 -- CLASS II-BOX ARM. Fix an interval B = [0, b) in F_p. Compute f_phi(B)
      explicitly. Measure |f_phi(B) intersect B| / |B|, the number of 3-term arithmetic progressions
      in f_phi(B), and the additive energy E(f_phi(B)). Compare against B itself, against u^2 B for
      an F_p-isomorphism (the RIGOROUS positive control: dilation preserves additive energy exactly),
      and against a uniformly random subset of F_p of the same size. STEP 5 -- CLASS III ARM. Form
      g'' by resultant, record deg g'', and record the Groebner solving-degree proxy of the m = 3
      Semaev system over the transported factor base on E'' against the same proxy on E over the original
      factor base. Predicted: same description degree, same or statistically indistinguishable solving-degree
      proxy, DIFFERENT shape statistics. STEP 6 -- ell SWEEP, WHICH IS THE DECAY TEST. Repeat Steps
      3-5 at ell in {1 (isomorphism), 2, 3, 5, 7, 11} and at composite paths of length L in {1, 2,
      3}. Every Class II statistic must be a MONOTONE decay from the ell = 1 value to the random baseline.
      A Class II statistic that stays high at ell = 11 is an artifact.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - random size-matched subset of E'(F_p) (Class II null)
  - random degree-B polynomial (Class III null)
  - ell = 1 isomorphism arm (rigorous positive control, E(u^2 B) = E(B))
  - quadratic-residue predicate (nearby-object control)
  - random-relabelling null for Class I
  - "NULL OBJECT (from the proposal): MANDATORY AND BLOCKING, ONE NULL PER CLASS, ALL OF THE SAME\
    \ SHAPE AS THE TREATMENT. Class I null: a size-matched RANDOM RELABELLING {(sigma(R_i), r_i)}\
    \ for a\n  uniform bijection sigma: G -> G'. Certification must be 1/N.\nClass II null: a uniformly\
    \ random size-matched subset of E'(F_p) in place of\n  phi(A). The DP-retention and box-retention\
    \ statistics of the TREATMENT must\n  be statistically indistinguishable from this null -- and\
    \ here,\n  INDISTINGUISHABILITY IS THE PREDICTED RESULT, so the null doubles as the\n  prediction\
    \ and the test is whether the treatment DEVIATES from it.\nClass III null: a random degree-B polynomial\
    \ g_rand in place of g', measured\n  on the identical Groebner pipeline. If the transported factor\
    \ base's\n  solving-degree proxy matches g_rand's, the transported base is\n  structureless, which\
    \ is the predicted outcome.\nPOSITIVE CONTROL, RIGOROUS AND REQUIRED: the ell = 1 arm. An F_p-isomorphism\n\
    \  acts by x -> u^2 x, so the additive energy of the image equals that of B\n  EXACTLY (dilation\
    \ is an automorphism of (F_p, +)). An instrument that does\n  not reproduce E(u^2 B) = E(B) is\
    \ broken and no Class II or Class III number\n  from it may be reported.\nDECAY PARAMETER: ell\
    \ (and path length L). Every Class II statistic must decay monotonically from its ell = 1 value\
    \ to the random baseline as ell grows. A statistic that does not decay is the canonical artifact\
    \ tell."
  independent_variables: []
  metrics:
    primary:
    - retention per class per ell per path length
    - additive energy and 3-AP count for B, u^2 B, f_phi(B), and random
    - deg g' and the multiplicity profile of g'
    - Groebner solving-degree proxy and basis size, per arm
    secondary:
    - chance baselines computed exactly, not estimated
    - wall clock and peak memory per cell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Class I retention (certificate pass rate of a transported known-log table)
    formula: EXACTLY 1.000, at every ell and every path length. Anything else is an implementation
      error.
    source: pre-registered in IDEA-20260807-e0ddc6 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - SMALL-p COINCIDENCE. At p = 101 an interval of size 8 and its image can overlap by chance at rates
    that look like signal. Every retention figure needs its exact chance baseline computed and at
    least three primes.
  - NON-INJECTIVITY OF f_phi ON THE ROOT SET. phi is 1-to-1 on G but the x-map is ell-to-1 on the
    x-line, so distinct roots of g can collide, shrinking deg g' for a trivial reason. The multiplicity
    profile of g' must be reported alongside its degree.
  - TWIST AND SIGN. x-only measurements conflate R with -R. A DP predicate defined on x is automatically
    negation-invariant; one defined on (x, y) is not. The convention must be frozen before Stage 1
    and reported.
  - MODEL DEPENDENCE. u^2 dilation is specific to short Weierstrass. In Montgomery or Edwards form
    the isomorphism acts differently and the ell = 1 positive control changes. One model is frozen
    for the whole line.
  - The Groebner proxy is implementation-bound (harness/semaev.py sympy Buchberger). Class III solving-degree
    comparisons are valid only within-implementation.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY 1.000, at every ell and every path length. Anything else is an implementation
    error.
  falsification_criterion:
  - deg g' > deg g in any cell. The Class III claim is false as stated and the record is superseded
    rather than amended.
  - E(u^2 B) != E(B) exactly at ell = 1. Instrument broken; no Class II or III number may be reported.
  - Class II-DP retention stays above chance as ell grows (no decay). Either the isogeny x-map preserves
    the predicate -- a major and unexpected result requiring independent replication -- or the measurement
    is an artifact. The protocol cannot distinguish these without the decay sweep, which is why the
    sweep is mandatory.
  - Class I retention below 1.000 with gcd(deg phi, N) = 1. Implementation error, halts the line.
  - Additive energy of f_phi(B) exceeds twice the random baseline at ell >= 2. Falsifies the "shape
    is destroyed" half of the dichotomy and reopens the class-wide factor-base search.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
