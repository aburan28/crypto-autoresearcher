experiment:
  id: EXP-MODEL-3a7c66
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-4fc635
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE NULL OBJECT FOR "MODEL MATTERS" IS THE SAME MODEL UNDER A RANDOM CHANGE OF COORDINATES
    - build the PGL_2(F_p) null battery (random Moebius per variable, with the number of randomised
    variables as the decay parameter), plus the translation-conjugate shifted-Kummer null x_R(P) =
    x(P - R) which must reproduce every measurement EXACTLY after retargeting; without these two controls
    no number produced anywhere in L11 may be attributed to a model
  status: draft
  objective: "(A) THE CONTROL THIS LANE CANNOT DO WITHOUT, STATED AS AN OBJECT RATHER THAN AS A CAVEAT.\
    \ Every L11 measurement compares a named model (Montgomery, Edwards, Hessian, Jacobi quartic,\
    \ Kummer) against short Weierstrass on one fixed curve. Every one of those named models is, on\
    \ the coordinate that matters, a Moebius reparametrisation of the Weierstrass x-coordinate. So\
    \ the correct null is not \"a different curve\" and not \"a random polynomial system\" - it is\
    \ THE SAME MODEL UNDER A RANDOM ELEMENT OF PGL_2(F_p). If a random Moebius substitution reproduces\
    \ the effect a named model shows, the effect is a property of reparametrisation and carries no\
    \ information about the model.\n(B) THE NULL BATTERY, SPECIFIED COMPLETELY SO IT CAN BE IMPLEMENTED\
    \ WITHOUT FURTHER DESIGN.\n  NULL-1 RANDOM MOEBIUS, PER VARIABLE. Draw mu_1,...,mu_m independently\
    \ and\n  uniformly from PGL_2(F_p). Substitute t_i -> mu_i(t_i) into the summation\n  polynomial\
    \ and clear denominators; substitute the same into the membership\n  polynomial. DECAY PARAMETER\
    \ r = the number of variables actually randomised,\n  swept r = 0, 1, ..., m. At r = 0 every measurement\
    \ must equal the Weierstrass\n  baseline exactly. Predicted behaviour of the three key quantities\
    \ as r grows:\n    per-variable degree - EXACTLY CONSTANT at 2 (Moebius is degree-preserving);\n\
    \    monomial support - jumps from 13 to 27 at r >= 1 and stays there;\n    Groebner solving-degree\
    \ proxy and wall time - [open], and this is the\n    measurement that decides whether L11's other\
    \ arms mean anything.\n  NULL-2 RANDOM AFFINE, PER VARIABLE. The sub-battery mu_i(t) = alpha_i\
    \ t +\n  beta_i, which is exactly the Montgomery relation\n  (IDEA-20260807-e6d79e). DECAY PARAMETER\
    \ beta -> 0, at which the support must\n  return to 13. This is the sharpest artifact test in\
    \ the battery because it\n  has a known endpoint.\n  NULL-3 THE SHIFTED KUMMER COORDINATE, WHICH\
    \ IS A NULL WITH ZERO TOLERANCE.\n  For R in E(F_p) define x_R(P) := x(P - R). This is a degree-2\
    \ coordinate for\n  every R (the degree-2 maps E -> P^1 are exactly the quotients by the\n  involutions\
    \ P -> Q - P, and x_R is the one with Q = 2R). It is NOT a Moebius\n  transform of x - it is a\
    \ genuinely different coordinate - yet the whole setup\n  is translation-conjugate to the standard\
    \ one: writing P_i = R + P_i', the\n  condition sum P_i = target becomes sum P_i' = target - mR.\
    \ So EVERY\n  measurement must agree EXACTLY after retargeting: same degree, same support\n  SIZE,\
    \ same solving degree, same wall time up to noise. Any discrepancy is an\n  instrument fault,\
    \ not a model effect. NULL-3 is the battery's calibration\n  standard because its predicted answer\
    \ is exact equality rather than a\n  distribution.\n  NULL-4 THE SYMMETRY NULL. For any arm claiming\
    \ a symmetry-induced sparsity\n  (the Edwards parity grading of IDEA-20260807-78eafe, the Montgomery\n\
    \  palindrome of IDEA-20260807-e6d79e), the null is the SAME CURVE WITHOUT THE\n  RELEVANT RATIONAL\
    \ TORSION. On a curve with no rational 2-torsion the parity\n  grading cannot exist in any coordinate,\
    \ so the check must FAIL there. A\n  symmetry test that passes on a curve lacking the symmetry\
    \ is measuring an\n  implementation artifact.\n  NULL-5 THE PLANTED-SIGNAL POSITIVE CONTROL, because\
    \ a null battery that can\n  only fail to detect is not an instrument. Construct a coordinate\
    \ that\n  genuinely does have a larger rational deck group - the coordinate x^2 on a\n  j = 1728\
    \ curve with 4 | p - 1, whose deck group is mu_4 - and confirm the\n  pipeline DOES report the\
    \ predicted per-variable degree 4^(m-2) and Bezout\n  B^(m-1)/4. An instrument that reports \"\
    no effect\" for every arm including\n  this one is broken.\n\n(C) WHY THIS IS A SEPARATE RECORD\
    \ RATHER THAN A SECTION OF EACH ARM. Three reasons, each concrete. First, the battery is shared:\
    \ implementing it once serves all eight sibling proposals and makes their numbers comparable,\
    \ which is exactly the role DECOMPOSITION.md L14 assigns to instrumentation. Second, the battery\
    \ has its own falsification conditions that are independent of any model claim - NULL-3's exact-equality\
    \ prediction and NULL-5's planted-signal detection can both fail on their own, and either failure\
    \ invalidates every other L11 number. Third, and most importantly under docs/inventor-protocol.md,\
    \ \"controls before belief\" means the control must exist BEFORE the measurement, not be retrofitted\
    \ to explain an inconvenient result.\n(D) THE PRE-REGISTERED INTERPRETATION TABLE, WRITTEN NOW\
    \ SO IT CANNOT BE TUNED LATER. For any quantity Q measured on a named model M and on the Weierstrass\
    \ baseline W:\n  Q(M) = Q(W) and Q(NULL-1) = Q(W)  =>  Q is a model invariant. Report as such.\n\
    \  Q(M) != Q(W) and Q(NULL-1) = Q(M) =>  Q is a REPARAMETRISATION artifact.\n    No model claim\
    \ may be made. This is the expected verdict for support size.\n  Q(M) != Q(W) and Q(NULL-1) =\
    \ Q(W) =>  Q is a genuine model effect. This is\n    the only cell in the table that licenses\
    \ a model claim, and it is expected\n    to be occupied only by symmetry-derived quantities (parity\
    \ grading,\n    palindrome) on curves that actually have the relevant torsion.\n  Q(NULL-3) !=\
    \ Q(W) after retargeting => INSTRUMENT FAULT. Halt; report nothing.\n  Q(NULL-5) shows no effect\
    \ => INSTRUMENT BLIND. Halt; report nothing."
  resource_label: '"audit: consumes no resource" - this record mounts no attack, consumes no non-generic
    structure, and exists to make other records'' resource claims checkable. Under DECOMPOSITION.md
    section 2 it is the L14 role applied inside L11.'
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE VACUOUSLY AND DELIBERATELY SO. The admissibility filter asks
    whether a lane names a resource that escapes the generic-group closure (KN-FIND-b7e091, H-ENDO-001).
    A control record names no resource because it makes no claim about the ECDLP; it is an instrument.
    Filing it inside L11 rather than deferring it to L14 is a scoping decision, not a resource claim:
    the nulls here are specific to coordinate change and would be wasted effort in a generic instrumentation
    lane.'
  reachability_gate: TRIVIAL, AND FOR THIS RECORD IT IS TRIVIAL BY CONSTRUCTION IN BOTH DIRECTIONS.
    T5 (DECOMPOSITION.md section 3) charges a cost for reaching a SPECIFIED curve in an isogeny class.
    This record reaches no curve. NULL-1 and NULL-2 sample uniformly from a group of size p^3 - p
    that is reachable by drawing four field elements, so if anything the null is MORE reachable than
    any named model. NULL-3 requires a random R in E(F_p), which is one point sample. NULL-5 requires
    a j = 1728 or j = 0 curve, which is NOT reachable from an arbitrary isogeny class (DECOMPOSITION.md
    T4 - j = 1728 requires D_0 = -4 and j = 0 requires D_0 = -3, both class-determined), but this
    record CONSTRUCTS such a curve directly rather than walking to one, so no reachability cost is
    incurred and no attack is implied. The gate is passed and the record says so explicitly rather
    than leaving the field blank.
  inputs:
    procedure: 'STAGE 1 (minutes, GATE): substitution machinery, identity and composition tests. STAGE
      2 (minutes, GATE): NULL-3 exact reproduction under the shifted Kummer coordinate. STAGE 3 (minutes,
      GATE): NULL-5 planted-signal detection at g = 4 on a j = 1728 toy curve. STAGE 4 (an hour):
      the r-sweep with 30 draws per r, recording every lane metric''s distribution. STAGE 5 (minutes):
      the beta -> 0 affine endpoint test. STAGE 6 (an hour): the symmetry-null two-by-two (torsion
      present or absent) x (diagonalising coordinate or random). STAGE 7 (zero compute): publish the
      filled interpretation table.'
    mechanism: 'STEP 1 - IMPLEMENT THE SUBSTITUTION MACHINERY. A function that takes a polynomial
      in t_1,...,t_m, a tuple of PGL_2(F_p) matrices, and returns the reparametrised polynomial with
      denominators cleared and the result reduced to its squarefree part. Verified on the identity
      element (must return the input) and on a composition (mu then nu must equal mu-composed-with-nu
      applied once). STEP 2 - NULL-3 FIRST, BECAUSE IT HAS AN EXACT ANSWER. Implement x_R(P) = x(P
      - R), build the full decomposition system in that coordinate with the retargeted right-hand
      side, and confirm EXACT agreement with the baseline on every metric the lane reports. This is
      the calibration gate: if the pipeline cannot reproduce itself under a translation, no other
      null result is interpretable. GATE. STEP 3 - NULL-5 SECOND, BECAUSE AN INSTRUMENT MUST DETECT
      SOMETHING. Build a j = 1728 curve with 4 | p - 1, take the coordinate x^2 whose deck group is
      mu_4, and confirm the pipeline reports per-variable degree 4^(m-2) and Bezout B^(m-1)/4 rather
      than the generic 2^(m-2) and B^(m-1)/2. GATE. STEP 4 - THE DECAY SWEEP. For r = 0..m, apply
      r random Moebius maps, repeat over 30 independent draws, and record the distribution of every
      lane metric. Report per-metric: the value at r = 0, the distribution at r = m, and whether the
      two are distinguishable. STEP 5 - THE AFFINE SUB-BATTERY AND ITS ENDPOINT. Sweep beta from random
      to 0 with alpha fixed and confirm the support returns to exactly 13 at beta = 0. STEP 6 - THE
      SYMMETRY NULL. On a curve with no rational 2-torsion, confirm the parity and palindrome checks
      of the sibling records FAIL. On a curve with rational 2-torsion, confirm they PASS in the diagonalising
      coordinate and FAIL under a random Moebius map. That two-by-two is the strongest evidence the
      lane can produce that a symmetry effect is real. STEP 7 - PUBLISH THE TABLE. Emit the interpretation
      table of (C) filled in for every metric the lane measures, so that each sibling record''s headline
      number arrives with its verdict cell already assigned.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - identity element of PGL_2 (must be a no-op)
  - composition consistency of two substitutions
  - shifted Kummer coordinate with exact-equality prediction
  - planted deck-group signal at g = 4 and g = 6
  - a curve without rational 2-torsion for the symmetry null
  - a deliberately broken substitution (denominators not cleared), which the identity test must catch
  - 'NULL OBJECT (from the proposal): THIS RECORD IS THE NULL OBJECT, so its own control is the POSITIVE
    one: NULL-5, the planted signal. An instrument that reports "no effect" everywhere is indistinguishable
    from an instrument that is not connected, and the j = 1728 coordinate x^2 with deck group mu_4
    is the cheapest available object on which a real effect is predicted by theory (IDEA-20260807-dadcd2)
    and must be detected. DECAY PARAMETER for the positive control: the order of the deck group, swept
    over g = 2 (generic curve), 4 (j = 1728 with 4 | p - 1), 6 (j = 0 with 6 | p - 1). The measured
    Bezout must track B^(m-1)/g across all three; a measurement that does not respond to g is blind
    and the battery is unusable.'
  independent_variables: []
  metrics:
    primary:
    - per-variable and total degree, per draw, per r
    - support size distribution, per r, with min, median, max over 30 draws
    - Bezout number, per arm and per g
    - Groebner proxy and wall time distributions, per r
    secondary:
    - exact-equality pass/fail for NULL-3, per metric
    - detection pass/fail for NULL-5, per g
    - the filled interpretation table
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-variable degree of the reparametrised summation polynomial as the number of randomised
      variables r goes 0 -> m
    formula: EXACTLY CONSTANT at 2, for every r and every draw. Zero variance. Any variation falsifies
      the degree-preservation of Moebius substitution and invalidates every degree claim in the lane.
    source: pre-registered in IDEA-20260807-4fc635 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - DENOMINATOR CLEARING introduces a scalar and possibly a spurious factor; every substituted polynomial
    must be normalised and squarefree-reduced, and the normalisation convention frozen before Stage
    4.
  - A random Moebius map can accidentally be close to the identity or can move a branch point to infinity,
    both of which produce atypical support. Report the full distribution over 30 draws, never a single
    draw.
  - Wall time at toy scale is dominated by sympy overhead rather than by the mathematics; the wall-time
    arm of this battery is therefore weak evidence and must be labelled so. The algebraic metrics
    carry the weight.
  - j = 1728 and j = 0 toy curves are rare and their availability depends on p mod 4 and p mod 3;
    a failed NULL-5 due to no suitable curve is an INFRASTRUCTURE outcome (AGENTS.md rule 5), not
    a blindness finding.
  - NULL-3 requires x(P - R) to be computed with the SAME code path as x(P), or an apparent discrepancy
    will be a code-path artifact rather than a mathematical one.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY CONSTANT at 2, for every r and every draw. Zero variance. Any variation
    falsifies the degree-preservation of Moebius substitution and invalidates every degree claim in
    the lane.
  falsification_criterion:
  - NULL-3 fails exact reproduction on any algebraic metric. INSTRUMENT FAULT; the entire L11 measurement
    programme halts until it is fixed, and no sibling record's numbers may be reported.
  - NULL-5 fails to detect the g = 4 planted signal. The battery is blind; every negative it would
    produce is uninterpretable.
  - Per-variable degree varies under NULL-1. Moebius substitution is not degree-preserving as implemented,
    which means the substitution machinery is wrong.
  - Support does not return to 13 as beta -> 0. Canonical artifact tell.
  - The identity element of PGL_2 is not a no-op. Implementation error.
  - The symmetry checks pass on a curve without the relevant rational torsion. The symmetry claims
    of the sibling records are artifacts and must be withdrawn.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
  derivation_provenance:
    tool: tools/derive_experiment_contracts.py
    source_record: IDEA-20260807-4fc635
    note: Fields are rendered from the proposal, never invented. A null field means the proposal did
      not supply it.
  derivation_gaps: []
  hypothesis_id_note: 'No hypothesis exists for this contract and none is invented. GOAL-ENDO-001
    carries no active hypothesis: BATCH-cb71b5 generated a proposal corpus, and a proposal is not
    a hypothesis. This contract is DRAFT and NOT APPROVED; the /design-experiment step that mints
    a specified hypothesis from the parent IDEA has not been run. The field is explicitly null rather
    than absent so a reader cannot mistake it for an overlooked one.'
