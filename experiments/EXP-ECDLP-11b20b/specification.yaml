experiment:
  id: EXP-ECDLP-11b20b
  hypothesis_id: H-ECDLP-48491e
  version: 1
  title: >-
    Verification protocol - object-class, unit, scale and certificate-kind type
    check of every declared feed edge in the GOAL-PATH-001 dependency graph,
    with a same-type null that must report MATCH, a known-broken edge that must
    report MISMATCH, a four-level planted-mismatch ladder of known size, and an
    option-by-clause incidence matrix carrying a citation per entry
  status: draft
  status_note: >-
    DRAFT. Not review_required and not approved. Coordinator design freeze
    converting IDEA-20260805-6a14e3 into a verification protocol under
    TASK-20260904-43152a. Not snapshot-committed, not independently reviewed,
    NO RUN AUTHORIZED. This is an AUDIT designed as a verification protocol with
    the same rigor demanded of a measurement, per the handoff constraint on
    audit-shaped proposals.
  objective: >-
    Check, by reading committed artefacts only, whether every declared feed edge
    of the GOAL-PATH-001 tier series type-checks on four coordinates, and emit
    the resulting type table, the option-by-clause incidence matrix, and the
    list of edges that fail with the coordinate that fails. What artefact is
    checked, against what reference, and what result fails it are all fixed
    below before any file is opened for scoring.
  inputs:
    artefacts_under_check: >-
      The frozen consuming protocol artefact of GOAL-ICEX-001 at the exact
      version present in the tree, recorded by path and by content hash; the
      goal records of GOAL-PATH-001 and of every child goal it lists; and every
      experiment contract and evidence record owned by each producer lane named
      in the protocol feed pins.
    reference_against_which_checked: >-
      For each edge, the CONSUMER binding is the reference and the PRODUCER
      package is the artefact under check. A coordinate matches only when the
      producer's declared value and the consumer's required value are identical
      strings after a fixed, pre-declared normalization (case folding and
      whitespace collapse only - no semantic aliasing, because aliasing is
      exactly how a mismatch gets hidden).
    type_coordinates: >-
      object_class (e.g. boolean GF(2) chained system / prime-field short
      Weierstrass E(F_p) / extension field / number-theoretic census);
      unit (group operations under a named counter convention / F_p operations /
      GF(2) row operations / wall-clock nanoseconds / dimensionless
      probability); scale (the field_bits or n at which the package exists);
      certificate_kind (decomposition / discrete_log / none).
    scoring_rule_frozen_before_reading: >-
      Each edge receives an integer score in {0,1,2,3,4} equal to the number of
      matching coordinates. An edge scores 4 only when all four match under the
      declared normalization. Any coordinate that cannot be read from a
      committed field is recorded as UNREADABLE and scored as a non-match, with
      the file and field that was searched recorded. THE RULE IS FROZEN BY THIS
      CONTRACT AND MAY NOT BE ADJUSTED AFTER ANY EDGE IS SCORED.
  controls:
    - id: NULL-SAME-TYPE-PAIR
      description: >-
        NAMED NULL OBJECT, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. Run the
        identical extraction on a pair of records the consuming protocol itself
        requires to be in the same fixture subgroup and the same resource
        schema - the producer's C_decomp symbol against its own matched C_rho
        and C_bsgs baselines. FORCED VALUE: score 4 of 4 on both pairings.
      failure_meaning: >-
        A mismatch reported on this pair means the extractor invents mismatches,
        and every mismatch it reports anywhere else is VOID. This is the whole
        guard against an audit that finds problems because it is looking for
        them, and it can fail.
    - id: CTRL-KNOWN-BROKEN-EDGE
      description: >-
        POSITIVE CONTROL, THE INSTRUMENT MUST FIRE. The edge whose object-class
        mismatch is already established by a committed hypothesis interpretation
        limit stating that a boolean solving-degree model does not transfer to
        prime field. The extractor MUST score it below 4 and MUST name
        object_class as the failing coordinate.
      failure_meaning: >-
        If the extractor does not flag an edge the corpus has already
        documented as broken, it is insensitive and NO clean bill of health may
        be issued for any other edge.
    - id: CTRL-SECOND-KNOWN-BROKEN-EDGE
      description: >-
        SECOND POSITIVE CONTROL, ALREADY IN THE CORPUS. The feed supersession
        block on GOAL-ICEX-001 records a feed whose prescribed input was refuted
        by the same run that activated it. The extractor must independently flag
        that edge without being told which one it is.
      failure_meaning: >-
        A procedure that misses a defect the corpus has already found and
        documented has not demonstrated it can find an undocumented one.
    - id: CTRL-PLANTED-LADDER
      description: >-
        DEMONSTRATED DYNAMIC RANGE, PLANTED DEFECTS OF KNOWN SIZE. Take the
        NULL-SAME-TYPE-PAIR edge, which scores 4, and construct four synthetic
        copies in which exactly 1, exactly 2, exactly 3 and exactly 4 of the
        type coordinates are perturbed by a fixed declared rule (each perturbed
        coordinate replaced by a distinct sentinel string). The extractor must
        return scores of exactly 3, 2, 1 and 0 respectively AND must name
        exactly the perturbed coordinates in each case.
      failure_meaning: >-
        A ladder that does not return the planted scores exactly, or that names
        the wrong coordinates, means the extractor is not resolving the four
        coordinates independently. Every graded score it produced is VOID. This
        control is what converts the extractor from something that returns a
        number into an instrument with a demonstrated response to a defect of
        known size.
    - id: CTRL-ORDERING
      description: >-
        The incidence-matrix entries and the type table are written and hashed
        BEFORE any recommendation or narrative is composed, so a recommendation
        cannot be back-fitted to a preferred option.
      failure_meaning: >-
        A narrative written before the table is a post-hoc rationalisation and
        the run is reported as INVALID.
    - id: CTRL-CURRENT-FIELD-REREAD
      description: >-
        The CURRENT text of GOAL-PATH-001's next_action is read at run time,
        quoted verbatim into the run package, and compared against the
        2026-08-05 characterisation carried by IDEA-20260805-6a14e3. Both
        readings are reported side by side. The design session already found
        these differ as of 2026-09-04.
      failure_meaning: >-
        Adopting the stale characterisation without re-reading would build the
        entire incidence matrix against a field that no longer exists.
    - id: CTRL-ARCHIVE-CHECK
      description: >-
        ZERO COMPUTE. Search for any prior type or unit audit of this feed graph
        and record what was found. An audit that is not found is recorded as an
        ABSENCE, never as proof none exists.
      failure_meaning: >-
        A prior audit found makes this a replication and it must be reported as
        such.
  independent_variables:
    - 'feed edge identity, over every declared edge of the consuming protocol'
    - 'type coordinate, in {object_class, unit, scale, certificate_kind}'
    - 'artefact version, recorded per row'
  metrics:
    primary:
      - >-
        per-edge type score, an integer in {0,1,2,3,4}, with the failing
        coordinate named and, for every coordinate, the file path and field it
        was read from.
      - >-
        occurrence count of the string DREG in the frozen consuming protocol
        artefact, an integer, reported with the artefact path and content hash.
      - >-
        count of committed reviewed unit conversions found from the producer
        resource-vector coordinates to the consuming primary coordinate, an
        integer, with the path of each.
      - >-
        count of distinct named residuals gating the two remaining clause-1
        producers, an integer, with each residual quoted verbatim from its goal
        record.
      - >-
        the option-by-clause incidence matrix: for each next_action option
        (current text, re-read at run time) and each completion clause, an entry
        in {YES, NO, PARTIAL, INDIRECT, CONDITIONAL} with a file-and-field
        citation.
      - >-
        count of in-scope non-terminal Tier 0-2 child goals, an integer,
        REPORTED AS MEASURED with the resolution rule stated. Reported as a
        floor with the resolution rule, never as an assumed 8.
    secondary:
      - 'CTRL-PLANTED-LADDER returned scores against planted scores, four rows.'
      - 'distribution of the per-edge score across all edges, to show non-constancy.'
      - 'verbatim current next_action text beside the 2026-08-05 characterisation.'
      - 'list of UNREADABLE coordinates with the file and field searched.'
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The per-edge four-coordinate type score across the declared feed graph,
      and the four integer counts above.
    formula: >-
      No formula. This is a verification protocol, not a distributional
      prediction. The pre-registered values are: DREG occurrence count exactly 0;
      object-class matches 2 of 3 declared bindings; committed unit conversions
      0; distinct gating residuals 1. Each is falsifiable by opening the file it
      cites.
    source: >-
      IDEA-20260805-6a14e3's predictions block, adopted unchanged except that
      the next_action characterisation is re-read rather than assumed.
  scale_relevance:
    tier: null
    justification: >-
      NO MEASUREMENT IS MADE AT ANY SCALE. The audit reads committed records and
      produces facts about records. `tier` is null rather than `toy` because a
      scale label would falsely imply a measurement was taken. This experiment
      supports no statement about any curve.
    correspondence: null
  tail_checks:
    - >-
      The single edge with the lowest type score is reported individually with
      every coordinate's source, so a total mismatch is visibly different from a
      near miss.
    - >-
      Every edge scoring exactly 3 is reported individually: a near miss on one
      coordinate is the most likely place for a normalization artefact and the
      most likely place for a real, cheap-to-repair defect.
  replication:
    seeds:
      - 'RUN-ECDLP-11b20b-1 (type table, incidence matrix, all controls): deterministic, no randomness; recorded seed 20260904111 for reporting-order reproducibility only'
      - 'RUN-ECDLP-11b20b-2 (independent re-extraction by a second agent): deterministic; recorded seed 20260904112'
    independent_instances: 2
    replication_note: >-
      SEEDS POLICY. This protocol consumes NO randomness; the declared seeds fix
      only the reporting order so that two runs produce byte-comparable tables.
      Replication here is by INDEPENDENT RE-EXTRACTION: RUN-2 is performed by an
      agent that has not read RUN-1's output, and the two type tables are
      compared row by row. A disagreement on any row is REPORTED, never silently
      reconciled. Every artefact read is recorded with its path and content hash
      so that a later reader can confirm the two runs read the same bytes.
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 2
    budget_feasibility_note: >-
      Zero compute; the cost is reading. Wall clock and memory are set at the
      template floors and are not the binding constraint. The binding constraint
      is the number of committed records that must be opened, which is bounded
      by the declared feed edges plus the child goal list.
  stopping_rules:
    - >-
      ST-1 PER-RUN CAP. 600 seconds per run; on approaching the cap the run
      STOPS and names every edge or record not reached, with its reason. A
      partial type table with a named gap is a result; a silently truncated one
      is not.
    - >-
      ST-2 STOP AND REPORT ON AMBIGUITY. If a coordinate cannot be read from a
      committed field, it is recorded UNREADABLE with the file and field
      searched. The Executor does not infer it, does not resolve it from
      context, and does not guess.
    - >-
      ST-3 NO INTERPRETATION. Observations only. The run package emits the type
      table, the incidence matrix and the failing-edge list. It must NOT
      recommend a next action, must not write an evidence or decision record,
      and must not touch any goal's next_action or status.
    - >-
      ST-4 SCORING RULE FREEZE. The normalization and scoring rule are frozen by
      this contract. A run that finds them awkward reports the awkwardness and
      STOPS; it does not adjust them.
  invalidation_rules:
    - >-
      INV-NULL. NULL-SAME-TYPE-PAIR reports a mismatch: the extractor invents
      mismatches and the entire run set is INVALID.
    - >-
      INV-INSENSITIVE. Either known-broken-edge positive control is not flagged:
      the extractor is insensitive and no clean edge may be certified; run set
      INVALID.
    - >-
      INV-LADDER. CTRL-PLANTED-LADDER does not return exactly the planted scores
      with exactly the planted coordinates named: every graded score is VOID.
    - >-
      INV-CONSTANT. Every edge receives the same score: the extractor has zero
      comparator spread and the audit is vacuous; reported as INVALID rather
      than as a clean result.
    - >-
      INV-STALE. The run uses IDEA-20260805-6a14e3's 2026-08-05 next_action
      characterisation without re-reading the current field: INVALID.
    - >-
      INV-INFRASTRUCTURE. A crash or unreadable-file failure is recorded with
      its terminal status and IS INFRASTRUCTURE SIGNAL, never a finding about
      the graph.
  success_criterion: >-
    S1. All controls pass (NULL-SAME-TYPE-PAIR scores 4/4; both known-broken
    edges are flagged with the correct failing coordinate; CTRL-PLANTED-LADDER
    returns exactly the planted scores; the score distribution is non-constant);
    AND the complete type table, incidence matrix and failing-edge list are
    emitted with a file-and-field citation on every entry; AND the current
    next_action is quoted verbatim beside the source proposal's stale reading.
    S1 MET means the audit's outputs are admissible as facts about the artefact
    versions recorded. IT ESTABLISHES NOTHING MATHEMATICAL AND NOTHING ABOUT ANY
    ELLIPTIC CURVE.
  falsification_criterion: >-
    F1. Any of the following, each decided by opening the cited file: (a) the
    DREG occurrence count in the consuming protocol artefact is nonzero;
    (b) a committed, reviewed unit conversion is found; (c) the two remaining
    clause-1 producers are gated on two distinct residuals; (d) the
    object-class match count is other than 2 of 3. Each falsifies the
    corresponding pre-registered prediction of H-ECDLP-48491e and the
    corresponding matrix row is withdrawn by a superseding record. F2, VOIDING
    RATHER THAN FALSIFYING: any invalidation rule fires, in which case no verdict
    of any kind is admissible. F3, DECLARED IN ADVANCE: this experiment consumes
    no elliptic curve and no group arithmetic, so NO output of it may be quoted
    as a statement about elliptic curves or the ECDLP under any outcome.
  required_artifacts:
    - experiments/EXP-ECDLP-11b20b/driver/extract_types.py
    - experiments/EXP-ECDLP-11b20b/results/type_table.json
    - experiments/EXP-ECDLP-11b20b/results/incidence_matrix.json
    - experiments/EXP-ECDLP-11b20b/results/failing_edges.json
    - experiments/EXP-ECDLP-11b20b/results/artefact_hashes.yaml
    - experiments/EXP-ECDLP-11b20b/results/next_action_verbatim.md
    - experiments/EXP-ECDLP-11b20b/results/summary.json
    - experiments/EXP-ECDLP-11b20b/runs/RUN-ECDLP-11b20b-1/manifest.yaml
    - experiments/EXP-ECDLP-11b20b/runs/RUN-ECDLP-11b20b-1/results.json
    - experiments/EXP-ECDLP-11b20b/runs/RUN-ECDLP-11b20b-1/stdout.log
    - experiments/EXP-ECDLP-11b20b/runs/RUN-ECDLP-11b20b-2/manifest.yaml
    - experiments/EXP-ECDLP-11b20b/runs/RUN-ECDLP-11b20b-2/results.json
    - experiments/EXP-ECDLP-11b20b/runs/RUN-ECDLP-11b20b-2/stdout.log
  required_artifacts_note: >-
    artefact_hashes.yaml records the path, version marker and content hash of
    every committed file read, so that RUN-1 and RUN-2 can be shown to have read
    the same bytes and so that a later reader can tell whether a row has gone
    stale. next_action_verbatim.md carries the current field text beside the
    2026-08-05 characterisation, both quoted, neither paraphrased.
  run_plan:
    - id: RUN-ECDLP-11b20b-1
      description: 'full type extraction, incidence matrix, all six controls, artefact hashing'
    - id: RUN-ECDLP-11b20b-2
      description: 'independent re-extraction of the type table by an agent that has not read RUN-1 output; row-by-row comparison, disagreements reported not reconciled'
  provenance:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    independent_session: false
    independent_review_status: >-
      NOT YET REQUESTED. Contract is at `draft`.
    design_session_verification_note: >-
      The Coordinator subagent that wrote this contract read the
      completion_criteria and next_action fields of ledger/goals/
      GOAL-PATH-001.yaml by pattern search on 2026-09-04, confirmed the source
      proposal's two-clause completion-criteria quotation verbatim, and found
      the next_action field CHANGED from the proposal's three-option reading; it
      now records that DEC-20260810-2f92d8 selected option (a). It also
      confirmed GOAL-PATH-001, GOAL-ICEX-001, GOAL-SDEG-001, GOAL-RELN-001 and
      GOAL-DREG-001 all carry status `active`. It did NOT open the frozen ICEX
      protocol artefact, the SDEG scaling protocol, or any child experiment
      contract; every claim this contract makes about those files is taken from
      IDEA-20260805-6a14e3 and is scheduled for verification by RUN-1, not
      asserted here.
  source_refs:
    - ledger/hypotheses/H-ECDLP-48491e.yaml
    - ledger/proposals/IDEA-20260805-6a14e3.yaml
    - ledger/goals/GOAL-PATH-001.yaml
    - ledger/goals/GOAL-ICEX-001.yaml
    - ledger/questions/RQ-ECDLP-002.yaml
    - docs/inventor-protocol.md
  assigned_to: executor
  approved_by: null
