experiment:
  id: EXP-SDITH-162cc1
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  hypothesis_id: H-SDITH-d37289
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: >-
    The d-split admissibility ratio and the memory-charged ISD baseline: exact
    integer evaluation of the split advantage, a charging model validated against
    the program's own BSGS anchor, and the re-optimization error in the standard
    charging procedure

  objective: >-
    If later approved, frozen and authorized, produce the two derivations
    GOAL-SDITH-001's first completion criterion asks for: (a) an exact,
    unconditional bound on the advantage a block-factorizing information-set
    decoder gains from the d-split promise, evaluated at the deployed parameter
    sizes rather than extrapolated to them; and (b) a memory-charged ISD baseline
    whose charging model has first reproduced this program's own stated BSGS
    full-cost anchor, together with a quantified defect in the naive procedure
    for constructing such a baseline. The goal record's next_action is explicit
    that the first deliverable is the charged baseline and not an attack; this
    contract proposes no attack and cannot produce one.

  what_this_is_not:
    - >-
      NOT a decoding attempt. No parity-check matrix is generated, no syndrome is
      computed, no error vector is recovered, and no instance of syndrome
      decoding is solved at any size.
    - >-
      NOT an attack on SDitH, on HQC, on Classic McEliece, or on any code-based
      scheme. No forgery, no key recovery, no distinguisher.
    - >-
      NOT a security level for any deployed parameter set. A charged ISD cost is
      a baseline, not a security claim, and converting one to the other needs the
      best known variant and the scheme's own reduction, neither of which this
      contract supplies.
    - >-
      NOT a statement about MMT, BJMM or May-Ozerov. Those variants are not read,
      not modelled, and explicitly out of scope; they are precisely the ones
      whose advantage is most memory-bought, so their absence is the binding
      limit on every charged conclusion here.
    - >-
      NOT an accusation that any published cost table commits the re-optimization
      error. The claim is about a PROCEDURE a downstream analyst would follow.
    - >-
      NOT approval, freezing, execution authorization, a run, an observed output,
      or evidence. No run has happened. Every numeric value appearing in this
      contract is a PRE-REGISTERED PREDICTION derived on 2026-08-05 during
      ideation, not a measurement.

  claim_ceiling:
    tier: toy
    scope: >-
      TIER toy, and the reason is not scale but object. The arithmetic is exact
      at cryptographic sizes -- there is no toy-to-crypto extrapolation in the
      counting, and the illustrative shapes are evaluated at n up to 1024 with
      exact binomials -- but the OBJECT is a counting quantity and a cost-model
      derivation, not a solved instance, and docs/claims-and-verification.md
      admits nothing above toy without a certificate that a run wrapper
      re-verifies. No certificate is producible here because nothing is solved.
      The exact scope a completed run could support: "at the parameter shapes
      enumerated in inputs, for the algorithms Prange and block-aligned
      Dumer/Stern only, under the three declared charging models, the d-split
      advantage is the stated number of bits and the charged baseline is the
      stated table." Nothing broader. AGENTS.md rule 7 applies unchanged: no
      result here is presented as validation at the scheme's scale, and rule 4
      scopes every conclusion to the tested algorithms, parameters and models.

  inputs:
    illustrative_shapes:
      - {label: A, n: 256, k: 128, w: 80, q: 256}
      - {label: B, n: 320, k: 160, w: 80, q: 256}
      - {label: C, n: 512, k: 256, w: 120, q: 256}
      - {label: D, n: 1024, k: 512, w: 80, q: 2}
    shape_provenance: >-
      ALL FOUR ARE ILLUSTRATIVE AND NONE IS SDitH'S. They were chosen during
      ideation to span an F_q regime and a binary regime and, for shape B, so
      that many d divide gcd(n, k, w). SDitH's specification is NOT READ and its
      parameters are unknown to this contract.
    sdith_parameters: >-
      TO BE TRANSCRIBED IN STAGE 0 IF OBTAINABLE. Required fields: q, n (or the
      specification's code length), k, w, d, the exact form of the split
      constraint, and a page reference for each. If Stage 0 fails, this field
      remains empty in the run record and every downstream statement is scoped to
      the illustrative shapes only, per stopping rule SR-0.
    d_sweep: [1, 2, 4, 5, 8, 10, 16, 20, 40, 80]
    d_sweep_admissibility_rule: >-
      At each shape, evaluate only those d in the sweep with d | gcd(n, k, w).
      Where SDitH's own d does not divide, the balanced allocation is
      unavailable and the run MUST optimize over floor/ceiling per-block
      information-set allocations rather than assume balance; the chosen
      allocation is recorded per cell.
    extreme_control_w_sweep: [8, 16, 32, 64, 80]
    extreme_control_shape_rule: "n = 2w, k = w, d = w, block size 2"
    alpha_sweep: ["0", "1/6", "1/4", "1/3", "1/2", "2/3"]
    dumer_parameter_grid:
      p: "even integers 2 through 24 inclusive"
      l: "integers 0 through 49 inclusive"
      admissibility: "reject unless p <= w, k + l <= n, and w - p <= n - k - l"
    gaussian_cost_variants: ["(n-k)^2 * n", "(n-k)^2"]
    bsgs_gate_sizes: ["2^64", "2^128", "2^256"]
    bsgs_gate_search: "log2 m over integers 1 through e-1 at n = 2^e"
    brute_force_ceiling_n: 24
    seeds: []
    seed_derivation_rule: >-
      NO SEEDS ARE USED AND NONE MAY BE INTRODUCED. Every stage of this contract
      is DETERMINISTIC: exact binomial arithmetic and an exhaustive grid search
      over a declared finite index set. There is no sampling, no randomness, and
      therefore no seed. A third party reproduces every number bit-for-bit from
      the parameters above and the formulas in the hypothesis's mechanism field,
      using nothing but a bare Python interpreter. THE SOLE EXCEPTION is Stage 3's
      optional brute-force Prange simulation, which IS randomized; it uses seeds
      derived as int.from_bytes(sha256(b"EXP-SDITH-162cc1/v1|prange|" +
      str(n).encode() + b"|" + str(d).encode() + b"|" + str(trial).encode()),
      "big") with trial running 0..999, and this rule is frozen here.
    environment_measured_2026_08_05:
      python: "3.11.15"
      numpy: "2.4.6 importable"
      sympy: "NOT INSTALLED"
      note: >-
        Recorded because the session ANGLE-BRIEF reports two scouting sweeps
        disagreeing about this container's contents. Measured directly. NEITHER
        numpy NOR sympy is used by this contract; math.comb and
        fractions.Fraction from the standard library suffice, so the
        disagreement does not bear on this lane and no dependency request is
        made.

  arms_and_controls:
    treatment: >-
      ARM T1 (counting): for each admissible (shape, d), compute exactly
      R(n,w,d) = C(n/d,w/d)^d / C(n,w), its negative log2, the Vandermonde bound
      (d-1) log2(w+d-1), the Prange-level advantage
      A = log2 [ R(n-k,w,d) / R(n,w,d) ], the closed form
      ((d-1)/2) log2 [ ((n-w)/(n-1)) ((n-k-1)/(n-k-w)) ], their signed
      difference, the per-unit gain A/(d-1), and log2 (d C(n/d, w/d)).
      ARM T2 (charged baseline): for each shape and each alpha in the sweep and
      each Gaussian-cost variant, grid-search (p, l) to minimize the charged
      Dumer cost; report log2 T and log2 M at the minimizer, the charged Prange
      cost, the charged Dumer-Prange gap, and the RE-OPTIMIZATION ERROR defined
      as (charged cost evaluated at the alpha = 0 minimizer) minus (charged cost
      at the alpha minimizer).
    measured_null: >-
      NULL-1 (d = 1). The identical T1 code path with the split degenerate.
      FORCED VALUE DERIVED BEFORE ANY RUN: A = 0.000000 and -log2 R = 0.000000,
      EXACTLY, because T_plain and T_split are the same expression at d = 1. It
      can fail: a block-indexing error, or an off-by-one in the per-block
      allocation, returns a nonzero value here. This is a null of the same
      shape, not a decoration.
      NULL-2 (partition without constraint). Partition into d blocks and impose
      no per-block weight condition. FORCED VALUE: A = 0 bits for every d,
      separating "a partition exists" from "the partition constrains", which is
      the entire content of the research question and which a d-sweep alone
      would not isolate.
      NULL-3 (alpha = 0). The charging code with the charge switched off must
      reproduce the free-memory table EXACTLY, bit for bit, including the same
      minimizing (p, l). A charged pipeline that does not reduce to the
      uncharged one at zero charge is broken.
      NULL-4 (already-minimal free optimum). Construct a shape whose FREE
      optimizer is (p, l) = (2, 0); the re-optimization error there is forced to
      EXACTLY 0 because the two optima coincide. This can fail: an
      implementation that adds a memory penalty unconditionally returns a
      nonzero value.
    positive_control: >-
      POS-1 (the effect MUST appear; d = w, n = 2w, k = w). FORCED VALUE DERIVED
      BEFORE ANY RUN: A = 76.011 bits at w = 80, independently predicted by the
      closed form w - (1/2) log2(pi w) = 76.013, with the derived targets
      5.652 / 13.163 / 28.669 / 60.171 / 76.011 at w = 8 / 16 / 32 / 64 / 80
      against 5.674 / 13.174 / 28.674 / 60.174 / 76.013. A SECOND, ALGEBRAICALLY
      INDEPENDENT GATE AT THE SAME CELL: A = -log2 R exactly here (because
      C((n-k)/d, w/d) = C(1,1) = 1) and at NO other swept cell. IF POS-1 RETURNS
      UNDER 60 BITS AT w = 80, THE INSTRUMENT IS BROKEN AND NO NEGATIVE RESULT
      ABOUT SDitH'S d MAY BE REPORTED FROM THIS RUN AT ALL.
      POS-2 (charging; the effect MUST appear). BSGS under alpha = 1/2 must
      return optimal log2 m = 42 / 85 / 170 and log2 cost = 43.58 / 86.27 /
      171.58 at n = 2^64 / 2^128 / 2^256, each within 1.0 bit of 2e/3 =
      42.67 / 85.33 / 170.67. This is KN-TECH-035's independently stated anchor
      and the charging model was not tuned to hit it. IF POS-2 FAILS, NO CHARGED
      ISD NUMBER MAY BE REPORTED.
      POS-3 (charging arithmetic). A synthetic algorithm with memory 2^{cn} must
      show a charged-minus-free cost difference of exactly alpha*c*n bits. A
      closed-form check on the charging arithmetic independent of any ISD
      formula.
    graded_control: >-
      GRAD-1 (d-axis, 8 interior points). At shape B, report A, A/(d-1) and
      log2(d C(n/d,w/d)) at every admissible d, with an explicit monotonicity
      verdict. PRE-REGISTERED VALUES, derived 2026-08-05: A = 0.000, 0.291,
      0.868, 1.155, 2.008, 2.570, 4.228, 5.308, 10.421, 19.317 and A/(d-1) =
      --, 0.2906, 0.2894, 0.2887, 0.2868, 0.2856, 0.2819, 0.2794, 0.2672, 0.2445
      and log2(d C(n/d,w/d)) = 255.33, 127.02, 63.62, 51.12, 32.66, 26.65,
      17.92, 15.15, 10.13, 8.32 at d = 1, 2, 4, 5, 8, 10, 16, 20, 40, 80.
      A must be strictly increasing; A/(d-1) must be decreasing with total drift
      between 10 and 25 per cent and NO jump above a factor of two; the model
      size must be strictly decreasing. A non-monotone point LOCALIZES a fault to
      a specific d rather than leaving "it did not work".
      GRAD-2 (alpha-axis, 4 interior points). At each shape, report the charged
      minimizer's p, its log2 M, and the charged Dumer-Prange gap at each alpha.
      PRE-REGISTERED SHAPE: p non-increasing in alpha, log2 M non-increasing in
      alpha, gap non-increasing in alpha, and alpha = 0 reproducing the free
      table exactly. The alpha at which the gap crosses zero, IF it crosses
      within [0, 2/3], IS the answer to the reordering question in a form that
      does not depend on choosing a model, and reporting that crossing (or its
      absence) is a required output.
      GRAD-3 (w-axis at the extreme). POS-1 across w = 8, 16, 32, 64, 80, testing
      the instrument along a SECOND axis so that an error invisible along d is
      caught along w.
    ordering_control: >-
      MANDATORY AND ITS ABSENCE IS AN INVALIDATION. Execute, record and hash-commit
      NULL-1, NULL-2, NULL-3, NULL-4, POS-1, POS-2, POS-3 and the entire
      alpha = 0 free-memory table BEFORE any charged column is computed and
      BEFORE any SDitH parameter is read or evaluated. The frozen decision rule
      is applied to the nulls first; if it emits the same verdict on NULL-1 and
      POS-1 it discriminates nothing and must be rewritten before any treatment
      arm is looked at.
    comparability_policy: >-
      Cross-shape comparison of ABSOLUTE costs is forbidden: the four shapes are
      different problems and their costs are not commensurable. Only within-shape
      quantities (A, the re-optimization error, the Dumer-Prange gap, the
      charged-versus-free minimizer movement) may be compared across shapes, and
      only as a pattern, never as a pooled statistic. Comparison against any
      external ISD table requires that table to be transcribed with its own cost
      model stated; absent that, no external comparison may be made.

  metrics:
    primary:
      - >-
        A(shape, d) in bits, exact integer computation, with its signed deviation
        from the closed form.
      - >-
        Re-optimization error in bits per (shape, alpha, Gaussian-cost variant):
        charged cost at the free minimizer minus charged cost at the charged
        minimizer.
      - >-
        Charged Dumer-minus-Prange gap in bits per (shape, alpha), and the
        crossing alpha if the gap changes sign within the swept range.
    secondary:
      - -log2 R and its ratio to the Vandermonde bound, per cell.
      - Per-unit gain A/(d-1) and the end-to-end drift across the d-axis.
      - log2 (d C(n/d, w/d)) per cell and its span across the d-axis.
      - Minimizing (p, l) and log2 M per (shape, alpha, variant).
      - BSGS gate outputs: optimal log2 m and log2 cost at three sizes.
      - Brute-force agreement at n <= 24, if Stage 3 runs.
      - Source-provenance record: what was fetched, from where, with what status.

  heuristic_under_test: HEUR-SDITH-D37-3
  heuristic_under_test_note: >-
    HEUR-SDITH-D37-3 (the sqrt(M) access-latency exponent) is the heuristic this
    contract most directly validates, via POS-2. HEUR-SDITH-D37-2 (the local CLT)
    is validated by the exact-versus-closed-form deviation profile in GRAD-1.
    HEUR-SDITH-D37-1 (block factorization) is validated only for Prange, by
    Stage 3's brute-force simulation, and is NOT validated for the class the
    hypothesis quantifies over -- that gap is the hypothesis's declared weakest
    link and this contract does not close it. HEUR-SDITH-D37-4 (model-fidelity
    robustness) is tested by running both Gaussian-cost variants.

  preregistered_prediction:
    quantity: >-
      Nine gates G1 through G9, fixed before any execution and not tunable to
      the data.
    formula: >-
      G1: A(d=1) = -log2 R(d=1) = 0.000000 exactly, at every shape.
      G2: A = 0.433 +/- 0.001 at shape A, d = 2, with the closed form returning
          0.434 +/- 0.002.
      G3: A = 76.011 +/- 0.01 at POS-1 with w = 80, matching
          w - (1/2) log2(pi w) = 76.013; and A = -log2 R exactly at that cell
          and at no other.
      G4: BSGS at alpha = 1/2 returns log2 cost within 1.0 of 2e/3 and optimal
          log2 m within 1.0 of 2e/3 at all three sizes.
      G5: re-optimization error strictly positive and above 3 bits at every
          shape; derived targets 9.61 (A), 9.18 (C), 6.48 (D) at alpha = 1/2 and
          the (n-k)^2 n variant.
      G6: the charged minimizer's p is strictly below the free minimizer's p at
          every shape whose free minimizer has p > 2; derived movements
          (4,4)->(2,2), (4,4)->(2,2), (10,34)->(6,22).
      G7: the charged Dumer-Prange gap is strictly positive, between 8 and 20
          bits; derived 10.28 (A), 12.12 (C), 18.47 (D).
      G8: A/(d-1) lies in [0.24, 0.30] at every d >= 2 at shape B, decreasing,
          drift 10 to 25 per cent, with no jump above a factor of two.
      G9: A below 3.0 bits at SDitH's real parameters for small d, if Stage 0
          supplies them; above 10 bits falsifies the hypothesis's part D1.
    source: >-
      Derived on 2026-08-05 during ideation, in exact integer and exact rational
      arithmetic, from the formulas stated in H-SDITH-d37289's mechanism field,
      and recorded in IDEA-20260805-cbd93d, IDEA-20260805-43d6df and
      IDEA-20260805-7504c6 before this contract was written. The BSGS target
      2e/3 is KN-TECH-035's independently stated anchor (READ 2026-08-05, front
      matter and Method section); KN-LIT-094 (Wiener) is NOT READ and nothing is
      attributed to it.

  scale_relevance:
    tier: toy
    justification: >-
      The counting arm is EXACT AT DEPLOYED SIZES: C(1024, 80) is an exact
      integer and nothing is extrapolated, so the usual toy-to-crypto gap does
      not apply to the derived quantity. What DOES limit the tier is the object,
      not the scale: no instance is solved, no certificate exists, and the
      algorithm class excludes the variants that set the best-known exponent.
      Conclusions therefore transfer across scale FOR THE COUNTING QUANTITY and
      do not transfer at all into a security statement. The charged arm's
      transfer limit is sharper still and is stated rather than argued: its cost
      model is declared in this contract, validated at one external anchor
      (BSGS), and covers two ISD variants.
    correspondence: >-
      null. No sampling correspondence is used; nothing is sampled. The
      deterministic arms enumerate a declared finite index set exhaustively.

  tail_checks:
    - >-
      Vandermonde bound: -log2 R must satisfy 0 <= -log2 R <= (d-1) log2(w+d-1)
      at EVERY cell. This is a theorem, so a violation is an implementation
      failure and must be reported as one, never as a discovery. The ratio to the
      bound is reported and is predicted to lie in [0.4, 0.7].
    - >-
      Closed-form divergence profile: the exact-minus-closed-form deviation must
      be under 0.01 bits wherever w/d >= 16 and must grow monotonically as w/d
      falls below 16, reaching about 3.6 bits at w/d = 1. A closed form agreeing
      EVERYWHERE would mean the local-CLT step did no work and the two
      expressions are algebraically identical, which they are not.
    - >-
      Extreme-cell identity: A = -log2 R must hold at d = w, n = 2w, k = w and
      must FAIL at every other swept cell. An implementation returning equality
      everywhere has conflated the two quantities, which is the single most
      likely coding error in this instrument.
    - >-
      Charging arithmetic: POS-3's synthetic 2^{cn}-memory algorithm must show a
      charged-minus-free difference of exactly alpha*c*n bits at every alpha.
    - >-
      Exactness: every quantity compared against a threshold is computed as a
      Fraction or as an exact integer; a float recomputation is reported
      alongside and any disagreement above 1e-9 in the log2 is an integrity
      failure, not a rounding note.

  replication:
    seeds: []
    independent_instances: 0
    interpretation: >-
      REPLICATION IS NOT APPLICABLE TO STAGES 0 THROUGH 2 AND SAYING SO IS MORE
      HONEST THAN LISTING A SEED. Those stages are deterministic exhaustive
      evaluations; running them twice returns identical bits and a second run is
      a check on the machine, not on the result. What replaces replication here
      is INDEPENDENT RE-DERIVATION: every primary number must be reproduced by a
      second implementation written from the formulas alone, without reference to
      the first, and both must be archived. Stage 3's randomized brute-force arm
      DOES replicate, at 1000 trials per cell under the frozen seed rule above,
      and reports a standard error.

  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 1
    maximum_runs: 3
    stage_budgets:
      stage0_source_acquisition_seconds: 5400
      stage1_gates_seconds: 300
      stage2_tables_seconds: 300
      stage3_brute_force_seconds: 1800
    note: >-
      The wall clock is dominated by Stage 0's reading and by Stage 3's optional
      simulation. Stages 1 and 2 -- which carry every primary metric -- are
      seconds of standard-library integer arithmetic. THE CHEAPEST STAGE IS THE
      DECISIVE ONE and it runs first: see stage_order.

  stage_order:
    - >-
      STAGE 0 (reading; may fail; failure is infrastructure signal). Attempt to
      obtain an SDitH specification and transcribe (q, n, k, w, d) and the exact
      split form with page references. Declared source-preference order: the
      scheme's own project page, then a versioned public code repository, then
      an ePrint abstract page, then an arXiv record, then an author-hosted copy.
      Record every attempt and its HTTP status. A failure at every source is
      reported as such and STOPS nothing.
    - >-
      STAGE 1 (seconds; CAN TERMINATE THE RUN). Gates G1, G3, G4 and the nulls,
      in that order. G1 failing voids everything. G3 failing forbids any negative
      conclusion. G4 failing forbids any charged number and IS ITSELF A REPORTABLE
      FINDING -- a disagreement between this program's charging doctrine and its
      arithmetic realization is worth more than any SDitH number.
    - >-
      STAGE 2 (seconds). Gates G2, G5, G6, G7, G8, the full tables, the graded
      controls, and G9 if Stage 0 succeeded.
    - >-
      STAGE 3 (optional, minutes). Brute-force verification at n <= 24: enumerate
      weight-w vectors, count balanced ones against C(n/d,w/d)^d, and simulate
      Prange on both instance families comparing measured iteration ratios
      against the predicted A. This is the only validation of HEUR-SDITH-D37-1.

  stopping_rules:
    - >-
      SR-0. Do not execute unless this contract is separately approved, frozen,
      archived and authorized by the Coordinator. It carries no approved_by field
      because it is not approved.
    - >-
      SR-1. Stop and report if G1 fails. No further stage runs.
    - >-
      SR-2. Stop the charged arm and report if G4 fails. The counting arm may
      continue; the two are independent.
    - >-
      SR-3. If G3 fails, complete the run but report NO negative conclusion about
      the d-split structure from it. The instrument's sensitivity is
      undemonstrated and every neutral verdict it would emit is inadmissible.
    - >-
      SR-4. If Stage 0 obtains no specification, run all remaining stages on the
      illustrative shapes and scope every statement to them. This is
      pre-registered as a NON-failure: the goal record already carries a pause
      condition anticipating it, and the deliverable degrades from "SDitH's
      number" to "the family's closed form with its validated range".
    - >-
      SR-5. Stop and report if the Vandermonde bound is violated anywhere. That
      is a theorem violation, hence an implementation failure.
    - >-
      SR-6. Stop if the two independent implementations required by the
      replication clause disagree on any primary metric beyond the declared
      exactness tolerance, and report the disagreement rather than picking a
      side.

  invalidation_rules:
    - Any execution while frozen is false, execution_authorized is false, or evidence_eligible is false.
    - >-
      Any charged number computed or examined before the alpha = 0 free table and
      all nulls and positive controls are committed and hashed. The ordering
      control is not advisory.
    - >-
      Any SDitH parameter read or evaluated before the illustrative gates are
      committed.
    - >-
      Any threshold, tolerance or gate value adjusted after a number is observed.
      An amendment requires a versioned protocol_amendment record marked
      exploratory_only and is never an edit to this contract.
    - >-
      Any use of floating point in a comparison against a declared threshold
      where an exact integer or Fraction was specified.
    - >-
      Any reported number that a third party cannot reproduce from the inputs and
      the hypothesis's stated formulas alone.
    - >-
      Any citation of an external ISD figure that was not transcribed in Stage 0
      with its own cost model recorded. Relayed numbers may appear only under an
      explicit NOT READ label and never inside a comparison.

  success_criterion: >-
    THIS CONTRACT HAS NO CURRENT SUCCESS OUTCOME BECAUSE IT IS NOT AUTHORIZED FOR
    EXECUTION. If a later, separately approved and frozen successor is executed,
    its only positive disposition is: all four nulls at their forced values; POS-1
    at 76.011 +/- 0.01 bits with the extreme-cell identity holding there and
    nowhere else; POS-2 reproducing the BSGS anchor within 1 bit in both the
    exponent and the table size; both graded controls monotone within their
    pre-registered bands; the ordering control satisfied and hash-committed; and
    the complete tables emitted with every cell reproducible from the formulas.
    THAT DISPOSITION ESTABLISHES NO ATTACK, NO SECURITY LEVEL, AND NO
    CRYPTO-SCALE CLAIM. It establishes two derivations and one validated
    instrument.

  falsification_criterion: >-
    The hypothesis H-SDITH-d37289 is falsified in whole or in part by any of:
    G8 showing a per-unit-gain jump above a factor of two (part D3 refuted, a
    knee exists inside the block-factorizing family); G5 under 1 bit at all
    shapes (part D2 downgraded to a footnote); G6 showing no movement of the
    charged minimizer (D2's mechanistic account refuted even if the error
    persists); G7 negative (D2's companion result refuted and the ANGLE-BRIEF's
    reordering hypothesis CONFIRMED at Dumer level); G9 above 10 bits (part D1
    refuted at the deployed parameters, and any consequent claim of reduced
    security routes to independent review-breakthrough at max under AGENTS.md
    rule 12 before being written anywhere). Each of these is a RESULT and none is
    a failure of the run.

  infrastructure_failure_disposition: >-
    A network failure, a proxy rejection, a missing document, a timeout, a crash,
    or an absent dependency is INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE
    MATHEMATICAL EVIDENCE (AGENTS.md rule 5, restated here because Stage 0's
    likeliest outcome is a failed fetch). Specifically: an inability to obtain
    the SDitH specification is NOT evidence that the d-split structure is
    harmless, NOT evidence that it is harmful, and NOT a reason to substitute a
    remembered parameter set. Remembered parameters may not be used at all; the
    illustrative shapes are labelled illustrative precisely so that no reader can
    mistake them for SDitH's. If the run cannot complete a stage for
    infrastructure reasons, the run record states which stage, why, and what was
    attempted, and the disposition is failed_infrastructure -- not invalid, and
