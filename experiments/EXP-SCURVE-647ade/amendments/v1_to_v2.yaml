      In addition to 9,948,061 oriented vectors and 4,974,348 canonical vectors
      including zero, report the independently reproduced ramified-only fixed
      stratum count 635 and scalar principal-state count 104 including zero.
    - >-
      Recompute all four counts in the independent enumeration order. A mismatch
      invalidates the run; these stratum counts do not alter the L<=2^48 search
      boundary or weakness gate.
  affected_runs:
