# =============================================================================
# EXP-CERTBIN-3af5f4 -- VERSION 1 (APPROVED by DEC-20261002-ffd20b) frozen
# contract for H-CERTBIN-5a81ca: HOLD-X6 trace-spectrum factor base V_E
# (Stage 0 derivations + Stage 1 RC-1 reproduction + Stage 2 sizes +
# Stage 3 oracle + Stage 4 closure) on Cells A (n=17 RC-1) and B (n=19
# Koblitz + ordinary).
#
# Source: IDEA-20260926-bbf2ed under RQ-CERTBIN-836ce2 / GOAL-ECDLP2M-001.
# Consolidates IDEA-20260926-b6cc43 (Hamming-ball arm). Three-arm contract
# (subspace / trace / ball) plus random-quadric and random-set controls.
#
# ZERO RUNS in this design packet. Stages 0-4 authorized for executor
# TASK-20261002-a8399d. Cell C (m=3) NOT authorized. No AUXIN. Amazon
# Bedrock prohibited. NO break. NO attack. NO exponent.
# =============================================================================
experiment:
  id: EXP-CERTBIN-3af5f4
  hypothesis_id: H-CERTBIN-5a81ca
  question_id: RQ-CERTBIN-836ce2
  source_idea: IDEA-20260926-bbf2ed
  goal_id: GOAL-ECDLP2M-001
  version: 1
  title: >-
    HOLD-X6: Stage-0 class-count / Walsh-Arf freeze plus Stages 1-4
    five-arm (subspace, trace-spectrum, random-quadric, Hamming-ball,
    random-set) measurement of per-attempt closure cost at n in {17,19}
  status: approved
  approved_by: DEC-20261002-ffd20b
  approved_at: '2026-10-02'
  approval:
    approved_by: DEC-20261002-ffd20b
    composing_decision: DEC-20261002-ffd20b
    rule: >-
      Approved under AGENTS.md standing user authorization (2026-09-06) once
      the protocol was complete (all required fields non-null). Approval does
      not assert the hypothesis is true. Stages 0-4 authorized for Cells A+B.
    implementation_authorized: true
    scientific_execution_authorized: true
    execution_authorized_stages: [0, 1, 2, 3, 4]
    scientific_execution_authorized_note: >-
      Stage 0 is zero-compute authoring of class counts, radical argument,
      Walsh/Arf formula, and frozen bands. Stage 1 is RC-1 reproduction
      (blocking). Stage 2 is exhaustive size + Walsh/Arf identity. Stages
      3-4 are exhaustive oracle and D<=5 closure on five arms at Cells A+B.
      Cell C (m=3) is NOT authorized. No Magma/Sage. No AUXIN. No Bedrock.
      No ECC2K-130 solve. No WDSat/CaDiCaL as success path.
    frozen: true
    standing_user_authorization:
      source: AGENTS.md
      instruction_date: '2026-09-06'
      renewed_user_approval_required: false

  objective: >-
    Freeze the Stage-0 certificates (class counts, Walsh/Arf); reproduce
    RC-1; measure exact |V_E| and per-attempt closure work / refutation
    rate of the trace-spectrum arm against size-matched subspace,
    random-quadric, Hamming-ball, and random-set arms on Cells A and B;
    deliver exactly one O-* label from H-CERTBIN-5a81ca.

  class: measurement
  class_note: >-
    Heuristic-validation / cost-model measurement of a factor-base
    description (H_cheap / H_dear / H1 / H_INV). Certificate-first Stage 0
    plus toy-tier closure measurement. Not an exponent-moving breakthrough;
    no ECDLP attack table produced.

  scope:
    included:
      - >-
        Stage 0 (ZERO COMPUTE beyond tiny Python). Write
        stage0/preregistered-predictions.json and stage0/derivations-note.md
        freezing: class counts at n in {17,19,131}; radical argument;
        Walsh/Arf formula; H_cheap band [0.5,2]; H_INV band [0.67,1.5];
        arm-matching rules (factor 1.5); |G| targets 32603/130873;
        relations-per-hit = n for stable arms.
      - >-
        Stage 1. Unchanged RC-1 pipeline on RC-1 V={deg<9}; reproduce
        recorded closure statistics (blocking before any trace cell).
      - >-
        Stage 2. Exhaustive |V_E| and Walsh/Arf recount for quadratic E;
        sizes of all five arms; write stage2/*.json.
      - >-
        Stage 3. Exhaustive m=2 oracle, 200 targets/arm/cell, certificates;
        write stage3/*.json.
      - >-
        Stage 4. Closure at D<=5 per arm; rows eliminated, refutation rate,
        verifier acceptance; Koblitz relations-per-hit; write stage4/*.json.
      - >-
        RESULTS.md with exactly one O-* label from H-CERTBIN-5a81ca;
        memory (peak RSS, Macaulay shape) stated beside every time figure.
    excluded:
      - Magma/Sage/cypari2/AUXIN provisioning as the success path.
      - Amazon Bedrock.
      - WDSat/CaDiCaL as a required success path (declared missing).
      - Editing IDEA-20260926-bbf2ed / b6cc43 claim text.
      - Editing shared GOAL-ECDLP2M-001.yaml.
      - Claiming break / exponent / ECC2K-130 attack from this contract.
      - Cell C (m=3 cubic probe) — design_after; not authorized.
      - Treating infra failure as mathematical evidence against H_cheap/H1.
      - Running any ECC2K-130 / deployed-scale decomposition cell.
      - Overwriting experiments/EXP-CERTBIN-e94b27/impl/ in place without a
        documented copy/wrapper under this experiment's write_scope.

  inputs:
    proposal: ledger/proposals/IDEA-20260926-bbf2ed.yaml
    hypothesis: ledger/hypotheses/H-CERTBIN-5a81ca.yaml
    question: ledger/questions/RQ-CERTBIN-836ce2.yaml
    hold_decision: ledger/decisions/DEC-20260928-63addc.yaml
    ball_sibling: ledger/proposals/IDEA-20260926-b6cc43.yaml
    invariance_control: ledger/proposals/IDEA-20260926-917981.yaml
    abscissa_density: ledger/proposals/IDEA-20260926-cafcf1.yaml
    field_instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    curve_instrument: experiments/EXP-CERTBIN-e94b27/impl/curve.py
    macaulay_instrument: experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
    closure_instrument: experiments/EXP-CERTBIN-e94b27/impl/closure.py
    oracle_instrument: experiments/EXP-CERTBIN-e94b27/impl/oracles_rc1.py
    frobenius_orbit_readme: analysis/frobenius-orbit-ecc2k130/README.md
    analysis_readme: analysis/binstd-idea-review-20260926/README.md

  controls:
    - name: rc1_reproduction_blocking
      description: >-
        Stage 1 must reproduce RC-1 recorded closure statistics on
        V={deg<9} before any trace cell is read. Failure → O-ARTIFACT.
    - name: walsh_arf_identity
      description: >-
        For every quadratic E, Walsh/Arf |V_E| must equal exhaustive count
        exactly (zero tolerance). Mismatch → O-ARTIFACT.
    - name: size_matched_subspace
      description: >-
        Cell A: V={deg<9} (|V|=512). Cell B: random dim-10 subspace.
        Trace arm matched within factor 1.5.
    - name: random_quadric_invariance_null
      description: >-
        Same count/degree/free bits, no rotation invariance; isolates
        H_INV. Seed recorded.
    - name: hamming_ball_sibling
      description: >-
        B_3 from IDEA-20260926-b6cc43 Cell A (|B_3|=834) as the other
        end of the rotation-invariant family (three-arm contract).
    - name: random_set_enumeration_floor
      description: >-
        Uniform random abscissa set of exact |V_E| cardinality; table
        membership; enumeration floor every algebraic arm must beat.
    - name: ordinary_curve_null
      description: >-
        Same-n ordinary curve (RC-1 at 17; A=46693,B=306147 at 19): V_E
        exists, Frobenius endomorphism does not; per-attempt cost within
        1.5x of Koblitz; no relation multiplication.
    - name: koblitz_relations_per_hit
      description: >-
        On Koblitz Cell B, trace and ball arms must yield exactly n
        relations per certified hit; subspace and random-quadric exactly 1.
    - name: oracle_vs_closure_agreement
      description: >-
        Exhaustive oracle and closure verdict must agree on every counted
        instance; disagreement → O-ARTIFACT.
    - name: memory_beside_time
      description: >-
        Peak RSS and Macaulay shape stated beside every time figure in
        RESULTS.md.

  independent_variables:
    - name: stage
      levels: [0_derivations, 1_rc1_reproduction, 2_sizes, 3_oracle, 4_closure]
    - name: cell
      levels: [A_n17_RC1, B_n19_koblitz, B_n19_ordinary]
    - name: arm
      levels: [subspace, trace_spectrum, random_quadric, hamming_ball, random_set]
    - name: E_family
      levels: [all_quadratic_classes]
    - name: D
      levels: [3, 4, 5]

  metrics:
    primary:
      - name: size_exact
        unit: field_elements
        definition: Exhaustive |V_E| (and every arm) plus Walsh/Arf recount for quadratic E.
      - name: closure_work_ratio_trace_over_subspace
        unit: dimensionless
        definition: Rows-eliminated-to-certificate (unsat) for trace / subspace at D<=5.
      - name: refutation_rate
        unit: fraction
        definition: Fraction of oracle-unsat targets refuted at D<=5 with verifier-accepted certificate.
      - name: closure_work_ratio_trace_over_random_quadric
        unit: dimensionless
        definition: Trace / random-quadric closure-work ratio (H_INV).
      - name: relations_per_hit
        unit: integer
        definition: Distinct conjugate relations from one certified hit on Koblitz.
    secondary:
      - name: oracle_rate
        unit: fraction
        definition: Fraction of targets with >=1 certified m=2 decomposition.
      - name: walsh_arf_delta
        unit: field_elements
        definition: Walsh/Arf count minus exhaustive; must be 0.
      - name: peak_rss_bytes
        unit: bytes
        definition: Peak RSS of Stage 2-4 processes (memory honesty).
      - name: wall_clock_seconds
        unit: seconds
        definition: Measured wall clock (reported; not a pre-committed claim).
      - name: class_counts
        unit: integer
        definition: Re-derived quadratic/cubic class counts at n in {17,19,131}.

  heuristic_under_test: H1; H_cheap; H_INV

  preregistered_prediction:
    quantity: >-
      Stage-0 class counts and Walsh/Arf formula; Stage-1 RC-1 reproduction;
      Stage-2 |V_E| in [341,768] at n=17 E=8 with Walsh/Arf identity;
      Stage-4 H_cheap band [0.5,2] vs subspace with equal refutation;
      H_INV band [0.67,1.5] vs random-quadric; relations-per-hit = n on
      Koblitz stable arms.
    formula: >-
      |V_E|_quadratic = 2^{n-|E|} + 2^{(n+r)/2 - |E|} * signed Arf sum
      (r=1 radical; claim D); H_cheap iff ratio in [0.5,2] AND
      refutation_trace ≈ refutation_subspace; H_INV iff
      ratio_tq in [0.67,1.5]; |G|_K19 = 130873 (re-count);
      relations_per_hit_stable = n.
    source: >-
      ledger/proposals/IDEA-20260926-bbf2ed.yaml predictions +
      proof_search_map; frozen before Stage 1 in
      stage0/preregistered-predictions.json.

  scale_relevance:
    tier: toy
    justification: >-
      Closure measurement at n in {17,19}, m=2. Transfer of H_cheap/H_dear
      to n=131 |E|=98 is explicitly NOT claimed; only arithmetic + H1
      sizing is recorded for ECC2K-130.
    correspondence: null

  replication:
    seeds: [2026092681]
    independent_instances: 2
    note: >-
      Cells A and B are independent instances. 200 targets per arm per
      cell from the recorded seed stream. Random-quadric and random-set
      redraw seeds recorded. Walsh/Arf and exhaustive size are exact
      (no sampling over the field at n=17/19).

  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 28800
    total_cpu_hours: 8.0
    maximum_memory_gb: 4
    maximum_runs: 8
    maximum_workers: 1

  stopping_rules:
    - Stage 0 complete with frozen preregistered-predictions.json.
    - Stage 1 RC-1 reproduction pass, OR O-ARTIFACT stop.
    - Stages 2-4 complete on Cells A+B for all five arms, OR a named O-ARTIFACT / O-IMPEDIMENT stop with measured quantity.
    - maximum_runs = 8.
    - Do not open Cell C under this card.

  invalidation_rules:
    - Stage 1 RC-1 mismatch → O-ARTIFACT; do not read trace cells.
    - Walsh/Arf ≠ exhaustive → O-ARTIFACT.
    - Oracle/closure disagree → O-ARTIFACT.
    - Editing preregistered-predictions.json after Stage-0 freeze → protocol invalid.
    - Magma/Sage/AUXIN/Bedrock used as success path → protocol invalid.
    - Infra timeout/crash → O-IMPEDIMENT, never negative evidence against H_cheap/H1.

  success_criterion: >-
    Stage 0 artifacts frozen; Stages 1-4 produce size tables, oracle rates,
    closure-work ratios, and blocking-control results; RESULTS.md names
    exactly one O-* label from H-CERTBIN-5a81ca with cited artifacts.

  falsification_criterion: >-
    Any of: RC-1 reproduction fail; Walsh/Arf mismatch; oracle/closure
    disagree; H_cheap band missed on both n with gates otherwise passing
    (that is O-H-DEAR, a valid scientific negative); or a claim of
    break/exponent under this card.

  required_artifacts:
    - experiments/EXP-CERTBIN-3af5f4/stage0/preregistered-predictions.json
    - experiments/EXP-CERTBIN-3af5f4/stage0/derivations-note.md
    - experiments/EXP-CERTBIN-3af5f4/stage1/
    - experiments/EXP-CERTBIN-3af5f4/stage2/
    - experiments/EXP-CERTBIN-3af5f4/stage3/
    - experiments/EXP-CERTBIN-3af5f4/stage4/
    - experiments/EXP-CERTBIN-3af5f4/RESULTS.md
    - experiments/EXP-CERTBIN-3af5f4/runs/<RUN-CERTBIN-*>/

  assigned_to: executor
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
