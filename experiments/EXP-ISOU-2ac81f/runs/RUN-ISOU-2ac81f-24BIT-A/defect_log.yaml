policy: Failed edges, non-verifying certificates, censored solves, members outside the seed band, and
  every protocol deviation are recorded here. Timeouts, crashes and infrastructure failures are NEVER
  negative mathematical evidence (AGENTS.md rule 5).
defects:
- where: null_object_control
  issue: The different-order null object separates under the PRIMARY frozen band (median_band) but NOT
    under the raw per_seed_band. The raw per-seed band is wide because the rho step count is a heavy-tailed
    random variable and the minimum over 16 seeds dips far below the median; that band is a descriptor
    of single-draw dispersion, not the resolution of the median-over-16 statistic that every between-member
    comparison actually uses. Recorded here explicitly so that the choice of primary band is visible to
    review rather than buried.
  null_median: 941.0
  median_band:
  - 3537.0
  - 9128.0
  per_seed_band:
  - 667
  - 11344
  classification: recorded observation about instrument resolution; not a mathematical result
