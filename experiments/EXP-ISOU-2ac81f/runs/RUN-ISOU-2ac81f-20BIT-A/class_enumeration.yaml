deduplication_rule: 'Vertices are deduplicated by F_p-ISOMORPHISM class, not by j-invariant alone: (a,b)
  ~ (a'',b'') iff there exists u in F_p^* with a'' = u^4*a and b'' = u^6*b. j-invariant is used only as
  a bucketing key; within a bucket the isomorphism test above is applied pairwise, so twists sharing a
  j-invariant are never merged.'
