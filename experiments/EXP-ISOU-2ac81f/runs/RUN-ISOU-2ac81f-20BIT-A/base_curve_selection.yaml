run_id: RUN-ISOU-2ac81f-20BIT-A
selection_criteria:
  declared_before_any_solve: true
  criteria_in_order:
  - p is the largest prime below 2^bits (deterministic, no search over p)
  - a is FIXED to -3 mod p, so the base curve is literally in the a = -3 model (P-256 shape)
  - b is drawn from the declared master seed; candidates are examined in that deterministic order
  - 'nonsingular: 4a^3 + 27b^2 != 0'
  - 'N = #E(F_p) is PRIME (P-256 shape)'
  - t = p + 1 - N is nonzero mod p, i.e. E is ORDINARY
  - '|D| = |t^2 - 4p| <= DMAX (declared budget-feasibility bound: keeps the class enumerable and h(D)
    cheap to compute; structural, independent of any cost datum)'
  - D = t^2 - 4p is a FUNDAMENTAL discriminant, i.e. the CM conductor f = 1 (flat volcano)
  - H_MIN <= h(D) <= H_MAX, computed independently by counting reduced binary quadratic forms (declared
    budget-feasibility bound; structural, independent of any cost datum)
  - the BFS class walk over degrees {2,3,5,7,11,13} enumerates exactly h(D) F_p-isomorphism classes, i.e.
    the declared degrees generate cl(O)
  criteria_note: 'The last criterion is a DECLARED SELECTION FILTER. Its satisfaction at the accepted
    candidate is therefore true BY CONSTRUCTION, and the completeness comparison reported for the accepted
    base curve must be read with that in mind. It is recorded here, in the selection log, and in the run
    receipt rather than left implicit. Candidates rejected because their walk closed short of h(D) are
    listed in the rejection log with that exact reason, and the vertex-count-versus-h comparison is reported
    side by side for the accepted candidate in every case. No criterion in this list uses, or could use,
    a cost datum: every one is structural and all of them are evaluated before any DLP is solved.'
