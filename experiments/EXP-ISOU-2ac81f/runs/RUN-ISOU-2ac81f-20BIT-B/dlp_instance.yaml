walk_cost_basis:
  measured_component: Velu isogeny EVALUATION of the two instance points P and Q along the BFS-tree path
    from E_0 to the member, executed with the instrumented F_p arithmetic of this module. Fully measured.
  modelled_component: Velu isogeny CONSTRUCTION (division polynomial, Frobenius eigenvalue kernel polynomial,
    codomain coefficients). The polynomial arithmetic uses Kronecker substitution on Python big integers,
    whose individual F_p multiplications cannot be counted. Its cost is therefore MODELLED by the declared
    formula below and labelled `modelled` everywhere it appears.
  modelled_formula: polynomial multiplication of a degree-m by a degree-n polynomial costs (m+1)*(n+1)
    field multiplications; polynomial remainder of a degree-m polynomial by a degree-n monic-normalized
    polynomial costs (m-n+1)*(n+1) field multiplications plus one field inversion charged at 1*ceil(log2(p))
    squarings + 1*hamming-weight(p-2) multiplications; polynomial gcd charges the sum of its remainder
    steps. Squarings are charged at weight 1.0.
  reported_bases: 'Q3 is reported on two explicitly labelled bases: q3_measured_walk_only (walk = measured
    evaluation cost only) and q3_measured_plus_modelled_walk (walk = measured evaluation cost + modelled
    construction cost). Neither is presented as the other.'
