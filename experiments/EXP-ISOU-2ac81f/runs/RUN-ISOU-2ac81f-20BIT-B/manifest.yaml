  rho:
    walk_family: Teske mixed r-adding walk
    partition_count: 20
    adding_branches: 16
    doubling_branches: 4
    partition_rule: branch index = (affine x-coordinate of W) mod 20
    distinguished_point_rule: affine x-coordinate of W congruent to 0 mod 16
    distinguished_point_density: 0.0625
    negation_map_used: false
    negation_map_note: The primary-metric solver uses NO negation map and no other automorphism speedup,
      because the frozen reproduction fixture is 0.886*sqrt(N) for plain rho.
    max_steps_rule: 60 * isqrt(N)
    identical_across: class members, base curve, and null objects alike
    counted_quantity: group_operations_to_solve counts the rho WALK's group operations (adds + doublings)
      until the collision that yields k. The seed-dependent precomputation (16 scalar multiplications
      building the adding-branch table, an identical scalar schedule on every curve of the same order
      N) is recorded SEPARATELY as group_ops_precompute and is not folded into Q1.
  q1_common_coordinate_system:
    id: AFFINE_SHORT_WEIERSTRASS
    definition: 'Affine coordinates on y^2 = x^3 + a*x + b over F_p, one single Python implementation
      (ec_add / ec_dbl in this module) used for EVERY curve: base curve, every class member, and every
      null object. The group-operation counter therefore counts the same abstract events on every curve.'
  q2_candidate_model_set:
  - id: AFFINE_SHORT_WEIERSTRASS
    reachability: always
    note: inversion performed by instrumented Fermat exponentiation, so its field cost is measured, not
      modelled
  - id: JACOBIAN_GENERIC
    reachability: always
    note: standard Jacobian projective coordinates, generic a
  - id: JACOBIAN_A_MINUS_3
    reachability: a/(-3) is a fourth power in F_p
    note: IEEE P1363 a = -3 doubling
  - id: MONTGOMERY
    reachability: curve has a rational point of order 4
    note: predicted unreachable everywhere because N is prime and odd
  - id: TWISTED_EDWARDS
    reachability: curve has a rational point of order 4
    note: predicted unreachable everywhere because N is prime and odd
  q2_cost_rule: "For each REACHABLE candidate model, the member's own seed-index-0 rho walk is re-executed\
    \ in that model for the first Q2_REPLAY_OPS group operations, with fully instrumented F_p arithmetic.\
    \ Multiplications and squarings are accumulated SEPARATELY for the addition routine and for the doubling\
    \ routine, giving a per-ADD cost and a per-DBL cost in (M + MS_WEIGHT*S) for that model on that member.\
    \ \nQ2 IS THEN EVALUATED AT A SINGLE COMMON OPERATION MIX, declared before measurement: the (adds,\
    \ doublings) mix of the BASE CURVE's seed-index-0 walk over its first Q2_REPLAY_OPS group operations.\
    \ Every member's Q2 is (n_add*add_cost + n_dbl*dbl_cost)/(n_add+n_dbl) at that one common mix. This\
    \ is necessary because each member's own walk draws its own random adds/doublings proportion, and\
    \ a per-operation ratio evaluated at a member-specific mix would confound the model effect Q2 is defined\
    \ to measure with the seed noise in that proportion. The member's own-mix value is ALSO recorded,\
    \ as a secondary field, so both are visible. \nThe cheapest model by the common-mix number is the\
    \ member's 'cheapest reachable model'. The coordinate-normalization overhead needed to expose the\
    \ affine x-coordinate to the walk function is instrumented and recorded SEPARATELY and is NOT part\
    \ of the per-group-operation ratio, because Q2 is defined as the field cost of the GROUP OPERATION.\
    \ The replayed op sequence is asserted equal to the Q1 op sequence, which is a self-check on the replay."
  q2_replay_ops: 300
  ms_aggregation_rule: &id001
    squaring_weight_in_multiplications: 1.0
    note: Multiplications M and squarings S are instrumented and recorded SEPARATELY as raw counts everywhere.
      The reported per-operation ratio aggregates them as M + 1.0*S. Any other weighting is recomputable
      by a reviewer from the raw counts.
  q3_definition: charged_end_to_end_cost is measured ENTIRELY in FIELD MULTIPLICATIONS (M + 1.0*S). No
    group-operation count is ever added to a field-multiplication count. Q3(member) = walk_cost_to_member
    + median_over_seeds(Q1(member)) * Q2(member); compared against median_over_seeds(Q1(base)) * Q2(base).
  walk_cost_basis:
    measured_component: Velu isogeny EVALUATION of the two instance points P and Q along the BFS-tree
      path from E_0 to the member, executed with the instrumented F_p arithmetic of this module. Fully
      measured.
    modelled_component: Velu isogeny CONSTRUCTION (division polynomial, Frobenius eigenvalue kernel polynomial,
      codomain coefficients). The polynomial arithmetic uses Kronecker substitution on Python big integers,
      whose individual F_p multiplications cannot be counted. Its cost is therefore MODELLED by the declared
      formula below and labelled `modelled` everywhere it appears.
    modelled_formula: polynomial multiplication of a degree-m by a degree-n polynomial costs (m+1)*(n+1)
      field multiplications; polynomial remainder of a degree-m polynomial by a degree-n monic-normalized
      polynomial costs (m-n+1)*(n+1) field multiplications plus one field inversion charged at 1*ceil(log2(p))
      squarings + 1*hamming-weight(p-2) multiplications; polynomial gcd charges the sum of its remainder
      steps. Squarings are charged at weight 1.0.
    reported_bases: 'Q3 is reported on two explicitly labelled bases: q3_measured_walk_only (walk = measured
      evaluation cost only) and q3_measured_plus_modelled_walk (walk = measured evaluation cost + modelled
      construction cost). Neither is presented as the other.'
  seed_band_rule: 'The seed dispersion band is computed on the base curve ONLY, from its 16 per-seed group_operations_to_solve
    values, and is FROZEN before any between-member number is computed or read. It has TWO parts, both
    frozen together and both reported everywhere: (a) per_seed_band = [min, max] of the 16 raw per-seed
    counts, the raw within-curve dispersion; (b) median_band = the [2.5, 97.5] percentile interval of
    the median-of-16 statistic, obtained by a nonparametric bootstrap of the 16 base-curve counts with
    the declared bootstrap seed and resample count below. The PRIMARY band for every between-member comparison
    and for the null-object separation gate is median_band, because the between-member statistic actually
    compared is each curve''s median over the same 16 seeds, and a band on single draws is not the resolution
    of a band on medians. per_seed_band is reported alongside it in every case, and the null-object gate
    reports its verdict under BOTH bands. Neither band is widened, narrowed or recomputed after any member
    datum is seen.'
  seed_band_bootstrap:
    seed: 20260813
    resamples: 4000
    percentiles: &id002
    - 2.5
    - 97.5
  null_object_rule: 'At least 8 random curves over a DECLARED SMALLER prime p'' with prime order N'' <=
    N/16. Same-p different-trace curves are additionally enumerated as a STRUCTURAL null object (they
    must not appear in the class walk) but carry no cost-resolution role. Separation criterion, declared
    before measurement: the null objects'' median group_operations_to_solve must lie strictly OUTSIDE
    the frozen median_band of the base curve (the PRIMARY gate), and the verdict under the raw per_seed_band
    is reported alongside it. Failure to separate under the primary gate is a STOP: no Q1 and no Q3 result
    is reported from that run in any form, including as preliminary or partial.'
  dedup_rule: 'Vertices are deduplicated by F_p-ISOMORPHISM class, not by j-invariant alone: (a,b) ~ (a'',b'')
    iff there exists u in F_p^* with a'' = u^4*a and b'' = u^6*b. j-invariant is used only as a bucketing
    key; within a bucket the isomorphism test above is applied pairwise, so twists sharing a j-invariant
    are never merged.'
  special_j_rule: Any member with j = 0 or j = 1728 is reported SEPARATELY and excluded from the generic
    band.
  completeness_rule: The census is COMPLETE only when the enumerated vertex count equals h(disc(End(E_0))),
    computed INDEPENDENTLY of the walk by counting reduced primitive positive-definite binary quadratic
    forms of discriminant D. Both numbers are reported side by side in every case.
  edge_certificate_rule: 'Each edge carries: the degree ell, the Frobenius eigenvalue lambda, the kernel
    polynomial h(x) (the kernel subgroup is Galois-stable but has NO F_p-rational generator, because N
    is prime, so the kernel generator is specified by its minimal polynomial rather than by coordinates),
    the check deg h == (ell-1)/2, the check h | psi_ell, the codomain (a'',b'') with nonzero discriminant,
    and the order check [N]R = O for two independent random R on the codomain (which pins #E'' = N because
    N is prime and p+1+2*sqrt(p) < 2N).'
  bsgs_cross_check_rule: BSGS, sharing no walk logic with rho, is run on the SMALLEST instance (the null
    object of least order), on the base curve instance, and on one deterministically selected class member
    (the one of least j-invariant). It must return the same k as rho.
