protocol_deviations:
- id: DEV-1
  field: required_artifacts / kernel generator
  deviation: The contract asks for 'every Velu isogeny with its kernel generator'. Because N is prime,
    E(F_p) has no ell-torsion for any declared ell, so NO edge has an F_p-rational kernel generator. The
    kernel is recorded by its minimal (kernel) polynomial together with the Frobenius eigenvalue lambda,
    which specifies the same subgroup exactly. Recorded rather than silently substituted.
- id: DEV-2
  field: run package layout
  deviation: docs/evidence-and-reproducibility.md's command.txt, environment.json, stdout.log and stderr.log
    are carried as fields inside manifest.yaml, because the declared artifact set for this task fixes
    exactly eleven per-run filenames and the archive stages only declared paths.
- id: DEV-3
  field: base curve selection
  deviation: The declared selection procedure includes two budget-feasibility filters (|D| <= DMAX and
    H_MIN <= h(D) <= H_MAX) and one structural filter (the declared degrees generate cl(O), i.e. the walk
    closes on h). All three are structural, were declared and frozen before any DLP was solved, and none
    uses a cost datum. The third makes the completeness comparison true by construction at the accepted
    candidate; that is stated in class_enumeration.yaml.
- id: DEV-4
  field: metrics / Q2
  deviation: Q2 is measured on the first 300 group operations of each member's own seed-index-0 rho walk,
    replayed in each candidate model, rather than on the full walk. The replay length is uniform across
    every member and was declared before measurement. The coordinate-normalization overhead required to
    expose the affine x-coordinate to the walk function is instrumented and reported separately from the
    group-law cost.
