experiment:
  id: EXP-GGMB-1e9671
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-7270d1
  question_id: RQ-GGMB-6eaabc
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: 'GRADED SIMULABILITY BY EXISTENTIAL WIDTH: the formal-linear-form simulator for an oracle
    whose answer is an existential over a candidate set of size Z errs with probability Z/N per query,
    so a simulability verdict is a closure only while q*Z = o(N); the VERIFY-form incidence oracle
    has Z = 1 and is closed, its SEARCH-form twin has the same signature and Z = binomial(L, m), which
    at the useful factor-base size is about N -- hence index calculus is not closed by Shoup and never
    was, and every SIMULABLE verdict in this campaign must carry its Z'
  status: draft
  objective: "(A) THE DEFECT IN THE BINARY VERDICT, STATED WITH THE STANDARD SIMULATOR IN HAND. The\
    \ generic-group simulator maintains, for each handle, its formal linear form lambda = (alpha,\
    \ beta) in (Z/N)^2, and answers questions by FORMAL comparison of linear forms -- because it does\
    \ not know k. It is therefore WRONG whenever two formally distinct linear forms happen to coincide\
    \ at the true k. Shoup's bound is exactly the union bound over those coincidences: with q formed\
    \ linear forms the failure probability is at most binomial(q,2)/N. THE ENTIRE STRENGTH OF A SIMULABILITY\
    \ VERDICT IS THE SIZE OF THAT UNION.\n(B) THE GRADED CRITERION, WHICH IS THE PROPOSAL. Let O be\
    \ an augmenting oracle whose answer is determined by an EXISTENTIAL over a candidate set of size\
    \ Z: \"does there exist an object c in a candidate set C, |C| = Z, with property Pi(c, query)?\"\
    \ -- and, for a search oracle, \"return such a c\". Then:\n  the formal simulator answers by checking\
    \ Pi formally over C, i.e. it\n  answers NO / bottom unless a formal identity holds; and it is\
    \ WRONG on a\n  given query exactly when some c in C satisfies Pi at the true k without\n  satisfying\
    \ it formally. Each candidate contributes a coincidence event of\n  probability at most 1/N over\
    \ the choice of k, so the per-query error is at\n  most Z/N.\n  Total success probability of an\
    \ adversary making g group operations and q\n  oracle queries is therefore bounded by\n    O(\
    \ (g + q)^2 / N )  +  q * Z / N.\n  HENCE: a SIMULABLE verdict closes the augmented problem at\
    \ exponent 1/2\n  IF AND ONLY IF q * Z = o(N). A verdict reported without Z is incomplete,\n \
    \ and a verdict with q*Z >= N is CORRECT AS A SIMULATION AND VACUOUS AS A\n  CLOSURE.\n\n(C) THE\
    \ WITNESS, AND IT IS THE MOST CONSEQUENTIAL OBJECT IN THE CAMPAIGN. Two oracles with the SAME\
    \ subject matter and nearly the same signature:\n  VERIFY FORM. INC_verify(i_1, .., i_m, h): \"\
    is\n    h_{i_1} + ... + h_{i_m} = h?\" Candidate set is the single supplied\n    subset, so Z\
    \ = 1. Per-query error 1/N. Simulator cost O(m) formal\n    additions. CLOSED at exponent 1/2,\
    \ unconditionally and for every\n    parameter. This is the case KN-FIND-b7e091 adjudicates, and\
    \ its recorded\n    overhead \"at most m group ops per query\" is precisely the Z = 1 cost.\n\
    \  SEARCH FORM. INC_search(h): \"return m indices with\n    h_{i_1} + ... + h_{i_m} = h, or bottom.\"\
    \ Candidate set is every m-subset\n    of the L-element base, so Z = binomial(L, m). Per-query\
    \ error\n    binomial(L, m)/N.\n  Now put in the parameters index calculus actually uses. A random\
    \ target\n  decomposes with constant probability exactly when binomial(L, m) is about\n  N, i.e.\
    \ L about (m! N)^{1/m}. AT THAT PARAMETER Z/N IS ABOUT 1: THE\n  SIMULATOR IS WRONG ON ESSENTIALLY\
    \ EVERY QUERY, and the bound\n  O((g+q)^2/N) + q*Z/N exceeds 1 immediately. THE CLOSURE IS VACUOUS\
    \ EXACTLY\n  WHERE THE ORACLE IS USEFUL. That is not a coincidence and it is the general\n  shape\
    \ of the phenomenon: an oracle is useful precisely to the extent that\n  it resolves an existential\
    \ the simulator cannot resolve.\n\n(D) THE ARITHMETIC CONSISTENCY CHECK, BECAUSE A CLAIM THAT\
    \ SHOUP IS VACUOUS HERE HAD BETTER NOT BE A CLAIM THAT SHOUP IS WRONG. Suppose the adversary gets\
    \ INC_search free over a factor base of its own construction, P_i = [a_i]P with a_i known. Build\
    \ R = [a]P + [b]Q, query once. If the oracle returns indices, then a + b*k = sum of a_{i_j} (mod\
    \ N), and with b invertible k FALLS OUT OF ONE QUERY. The adversary spent about L = N^{1/m} group\
    \ operations building the base and O(log N) building R, so g is about N^{1/m}, which is BELOW\
    \ sqrt(N) for m >= 3. Shoup is not violated because the oracle is not simulable at these parameters\
    \ -- the q*Z/N term is about 1 -- and the graded criterion predicts precisely this. Under the\
    \ BINARY reading of \"simulable\", this adversary would be a counterexample to Shoup, which is\
    \ how one knows the binary reading is wrong.\n(E) THE SCOPE QUESTION THIS RAISES FOR KN-FIND-b7e091,\
    \ RAISED AS A SCOPE QUESTION AND NOT AS A CONTRADICTION. That finding is BINDING for this campaign\
    \ (GOAL-ENDO-001 goal record) and this record does not revisit it. Its Oracle C is described as\
    \ \"an oracle reporting which factor-base subsets sum to the target Q\" -- phrasing that could\
    \ be read either way -- while both its stated overhead (O(m) per query) and its stated argument\
    \ (\"the oracle output is determined by group operations and equality tests\") are the Z = 1 verify\
    \ form. Two readings, and the campaign needs to know which is in force:\n  READING 1 (verify form\
    \ intended): the finding is correct exactly as\n    written, and the SEARCH form is a NEW oracle\
    \ class that this lane must\n    adjudicate. That is the reading this record adopts and it requires\
    \ no\n    change to anything.\n  READING 2 (search form intended): the stated O(m) overhead would\
    \ then apply\n    to an oracle with Z = binomial(L, m), and the closure would need the\n    graded\
    \ criterion to be restated.\nThis record recommends READING 1 and files the search form as new.\
    \ WHICH READING IS IN FORCE IS A COORDINATOR ADJUDICATION, NOT AN IDEA-GENERATOR ONE, and nothing\
    \ here changes any status.\n(F) THE CAMPAIGN-WIDE CONSEQUENCE. Every SIMULABLE verdict this campaign\
    \ issues must carry Z, and the verdict template of IDEA-20260807-63056d must require it at Q2.\
    \ Applying it to what is already on the books:\n  curve-measurable oracles (IDEA-20260807-413fcc):\
    \ Z = 1, error 0 in fact\n    since the answer does not involve k at all. Strongest possible closure.\n\
    \  transport oracle (IDEA-20260807-d73e83): Z = 1. Closed.\n  endomorphism-image oracle: Z = 1.\
    \ Closed.\n  incidence VERIFY: Z = 1. Closed.\n  incidence SEARCH / decomposition: Z = binomial(L,\
    \ m). NOT CLOSED at the\n    useful parameter. Verdict COST, and its C is the open quantity of\n\
    \    IDEA-20260807-070d03.\nSo the graded criterion changes exactly one verdict in the campaign,\
    \ and it is the one that matters."
  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: 'Consumes no resource; it is an audit of how the admissibility filter is
    applied. Its effect on admissibility is to make the filter STRICTER in one direction and HONEST
    in the other: an oracle with Z = 1 is closed more firmly than before (the error term is exactly
    1/N per query, not a hand-waved O(1) overhead), while an oracle with large Z may no longer be
    waved through as "simulable, therefore closed". The filter as written in DECOMPOSITION.md section
    2 is unaffected; what changes is what may be concluded from passing it in one direction.'
  reachability_gate: 'NOT APPLICABLE: no curve motion is proposed. The analogous gate that binds is
    CANDIDATE-SET ENUMERABILITY -- Z is defined only when the oracle''s candidate set is well specified.
    An oracle quantifying over an unenumerable set has Z undefined, the criterion is silent, and the
    honest verdict is OPEN rather than a default closure. That default matters: the failure mode this
    record guards against is an unenumerable existential being waved through as "simulable".'
  inputs:
    procedure: 'STAGE 0 (zero compute, 2 hours, HARD GATE): prove the Z/N error bound; assemble the
      combined bound; verify the Z = 1 reduction to Shoup; run the (D) consistency check on paper.
      If (D) does not come out, stop. STAGE 1 (zero compute): recompute Z for every verdict on the
      books and check that exactly one changes. STAGE 2 (toy compute, <= 30 min): the occupancy measurement
      of Step 5 -- decomposition rate versus binomial(L,m)/N on the six-rung ladder, 200 targets per
      rung, at p in {2^16, 2^18, 2^20}, with N prime and the order factored (KN-TECH-030 hygiene).
      STAGE 3 (toy compute, <= 30 min): the k-independent null oracle at matched Z, and the Z = 1
      verify oracle, both measured on the identical pipeline. STAGE 4 (toy compute, <= 30 min): instantiate
      the (D) attack with an exhaustively-searched decomposition oracle at m = 3 and three sizes;
      fit the group-operation exponent; charge the exhaustive search separately and report both numbers
      side by side so nothing reads as sub-rho. STAGE 5 (zero compute): the verdict table with Z,
      the Q2 template change, and the scope question written to the Coordinator.'
    mechanism: 'STEP 1 (zero compute) -- STATE AND PROVE THE ERROR BOUND. For an oracle quantifying
      over a candidate set of size Z, the formal simulator''s per-query error is at most Z/N: each
      candidate c yields a formal linear identity that either holds identically (in which case the
      simulator is right) or holds at k with probability at most 1/N over uniform k, because a nonzero
      linear form over Z/N with N prime has at most one root. Union over Z candidates and over q queries.
      Three lines; it is the whole theorem.

      STEP 2 (zero compute) -- ASSEMBLE THE COMBINED BOUND O((g+q)^2/N) + q*Z/N and state the criterion
      q*Z = o(N). Note explicitly that the first term is Shoup''s and the second is new, so the criterion
      degenerates to Shoup exactly at Z = 1.

      STEP 3 (zero compute, THE WITNESS) -- COMPUTE Z FOR BOTH INCIDENCE FORMS and substitute the
      index-calculus parameter L = (m! N)^{1/m}, obtaining Z/N about 1 for the search form. Then run
      the consistency check of (D): the one-query attack, its group-operation count N^{1/m}, and the
      confirmation that it does not contradict Shoup precisely because the criterion fails. THIS STEP
      IS THE PROPOSAL. If the arithmetic of (D) does not come out -- if the one-query attack does
      not work, or if it works and the criterion still says "closed" -- the record is wrong and ends
      here.

      STEP 4 (zero compute) -- RECOMPUTE Z FOR EVERY VERDICT ALREADY ON THE BOOKS (paragraph (F))
      and publish the table with Z beside each. Feed the Z field into IDEA-20260807-63056d''s Q2 template.

      STEP 5 (toy compute, <= 60 minutes, INSTRUMENT CHECK ONLY) -- THE MEASURED ERROR RATE. At p
      <= 2^20 with N prime, build an L-element factor base of known logarithms, choose m, and MEASURE
      the fraction of random targets that admit an m-subset decomposition, as a function of binomial(L,
      m)/N over the ladder binomial(L,m)/N in {2^-8, 2^-4, 2^-1, 1, 2, 8}. The predicted curve is
      the standard occupancy form 1 - exp(-binomial(L,m)/N). This measures the quantity Z/N directly
      and checks that the theoretical error rate is the empirical decomposition rate -- which is the
      claim''s physical content, and it is checkable in minutes with no Groebner engine.

      STEP 6 (zero compute) -- WRITE THE SCOPE QUESTION OF (E) TO THE COORDINATOR as an explicit request
      for adjudication, with both readings and the recommendation, and change no status.'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - 'Z = 1 verify oracle: measured error rate must be 0 at these sizes'
  - 'k-independent large-Z oracle: measured error rate must be 0 (bound looseness control)'
  - occupancy ladder binomial(L,m)/N in {2^-8, 2^-4, 2^-1, 1, 2, 8} (decay test)
  - 'factored group order, largest prime factor, and #E != p per curve (KN-TECH-030, KN-TECH-033 hygiene)'
  - matched rho and BSGS on identical instances, in the same operation unit, so the (D) attack's cost
    is reported against a real baseline
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL OBJECT: an oracle whose existential
    is over a candidate set of size Z but whose property Pi is INDEPENDENT OF k -- for example "does
    there exist an m-subset of the base whose INDEX SUM is even?" Z is the same binomial(L, m), but
    the answer never involves k, so the true error rate is 0 and the criterion''s Z/N bound is loose
    but sound. Measuring the empirical error rate for this null must give 0 at every Z. AN INSTRUMENT
    THAT REPORTS Z/N ERROR FOR A k-INDEPENDENT ORACLE IS READING THE BOUND, NOT THE OBJECT, and the
    record must be explicit that Z/N is an UPPER bound whose tightness depends on the property being
    genuinely k-dependent. DECAY PARAMETER: binomial(L, m)/N over the ladder {2^-8, 2^-4, 2^-1, 1,
    2, 8}. The measured decomposition rate must follow 1 - exp(-binomial(L,m)/N) and must DECAY TO
    ZERO as binomial(L, m)/N goes to zero. A decomposition rate that stays constant as the ratio shrinks
    is the canonical artifact tell and indicates the factor base is not being drawn independently
    -- most likely the base and the target share structure. SECOND CONTROL, THE OTHER DIRECTION: an
    oracle with Z = 1 (verify form) must show a measured error rate indistinguishable from 1/N, i.e.
    zero at these sizes. An instrument that reports a detectable error rate for Z = 1 is miscounting.'
  independent_variables: []
  metrics:
    primary:
    - Z per oracle, with the candidate set named
    - q*Z/N per adjudicated oracle at its intended parameters
    - empirical decomposition rate per ladder rung, with target count
    - measured error rate for the Z = 1 and k-independent controls
    secondary:
    - group operations of the (D) attack, and separately the charged cost of the exhaustive decomposition
      search
    - count of existing verdicts changed by the refinement
  heuristic_under_test: null
  preregistered_prediction:
    quantity: number of existing campaign SIMULABLE verdicts changed by adding Z
    formula: EXACTLY ONE -- the incidence SEARCH / decomposition oracle. Pre-registered before the
      recomputation. If the refinement changes zero verdicts it is bookkeeping with no consequence
      and should be recorded as such rather than promoted; if it changes two or more, at least one
      already-closed oracle is being reopened, which is far more likely an error in this record than
      a discovery and halts the line pending review.
    source: pre-registered in IDEA-20260807-7270d1 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - Z AS A MEASUREMENT RATHER THAN A BOUND. Z/N bounds the simulator's error from above; the true
    error can be zero. A large Z is grounds for WITHHOLDING a closure, never for asserting an attack,
    and the k-independent null exists to keep this visible.
  - SPECIFICATION-DEPENDENT Z. Two equivalent descriptions of one map can have different apparent
    Z if one hides a search inside a "function". Q0's freeze is the defence and reviewers should re-derive
    Z from the frozen signature rather than accepting the proposer's number.
  - TOY-SCALE OCCUPANCY. At p <= 2^20 with m = 3 the useful L is small and binomial(L, 3) is coarse-grained;
    the ladder rungs may not be attainable exactly. Report the achieved ratio, not the target ratio.
  - READING THE (D) ATTACK AS AN ATTACK. It uses a free oracle whose implementation is exhaustive
    search. Its group-operation count is real; its TOTAL cost is not sub-rho and must never be reported
    as such. Both numbers appear side by side in the required metrics for exactly this reason.
  - COMPOSITE N. The 1/N per-candidate probability uses primality. Toy curves with composite subgroup
    order would silently change the accounting.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: EXACTLY ONE -- the incidence SEARCH / decomposition oracle. Pre-registered before
    the recomputation. If the refinement changes zero verdicts it is bookkeeping with no consequence
    and should be recorded as such rather than promoted; if it changes two or more, at least one already-closed
    oracle is being reopened, which is far more likely an error in this record than a discovery and
    halts the line pending review.
  falsification_criterion:
  - The Z = 1 reduction does not recover Shoup's bound, or the recomputation changes an existing Z
    = 1 verdict. The refinement is not conservative; it is far more likely wrong than revelatory and
    the line halts pending review.
  - 'The (D) consistency check fails: either the one-query attack does not recover k, or it does and
    the criterion still reports the oracle closed. Either way the criterion is unsound as stated and
    the record is superseded.'
  - The empirical decomposition rate does not follow the occupancy curve. The independence assumption
    behind the union bound does not hold for the construction used, and Z is not the right parameter
    for it.
  - The k-independent null oracle shows a nonzero measured error rate. The measurement is comparing
    the bound to itself; nothing is reported.
  - The refinement changes zero verdicts. It is correct and inconsequential; the honest disposition
    is a short note, not a promotion, and the record says so in advance so that a null outcome cannot
    be inflated.
  - An independent reviewer establishes that KN-FIND-b7e091's Oracle C was intended in the SEARCH
    form. Then reading 2 of (E) is in force, the scope question becomes a correction rather than an
    extension, and only the Coordinator may act on it. This record's mathematics is unaffected either
    way.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
