experiment:
  id: EXP-EQLA-4cb948
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-fafc04
  question_id: RQ-EQLA-0d3f40
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: IS THE SAVING FREE OR DOES IT COST A BASIS CHANGE? Equivariance forces the minimal polynomial
    of the relation operator to be the lcm of its g isotypic blocks, so Wiedemann's iteration count
    drops by g ONLY IF those blocks share factors - measure the degree of the minimal polynomial and
    the linear complexity of the Krylov sequence directly, with and without the isotypic fold, and
    settle whether a solver that knows nothing about phi gets anything for nothing
  status: draft
  objective: "(A) THE QUESTION, SHARPENED. Wiedemann's method solves M x = b using 2 * deg(minpoly(M))\
    \ matrix-vector products, recovered from the Krylov sequence u^T M^i v by Berlekamp-Massey. Every\
    \ cost statement about the linear-algebra stage of index calculus is therefore a statement about\
    \ deg(minpoly). If M commutes with the phi-permutation Sigma of order g, then M preserves each\
    \ of the g isotypic components and\n  minpoly(M) = lcm_{j=0..g-1} minpoly(M_j),  each deg(M_j)\
    \ <= B/g.\nSo there are exactly two possibilities and they have opposite operational consequences:\n\
    \  CASE COPRIME - the g block minimal polynomials are pairwise coprime, the\n    lcm has degree\
    \ about B, and a solver that does not perform the isotypic\n    change of basis gets NOTHING from\
    \ equivariance. The g-fold saving must\n    be bought by an explicit fold.\n  CASE SHARED - the\
    \ blocks share most of their factors, the lcm has degree\n    about B/g, and PLAIN WIEDEMANN ON\
    \ THE UNCHANGED MATRIX terminates g times\n    sooner with no knowledge of phi whatsoever. That\
    \ would be a free saving\n    and would be worth knowing.\nNo record in this repository has ever\
    \ computed deg(minpoly) of a relation matrix, equivariant or otherwise.\n(B) THE PREDICTION, WITH\
    \ ITS REASON. CASE COPRIME. Over F_N the g-th roots of unity are present (lambda has order g mod\
    \ N, so g | N - 1), so the isotypic projection is defined over F_N and there is NO Galois action\
    \ relating the blocks: M_j = sum_k zeta^{jk} A_k for the g circulant components A_k of M, and\
    \ distinct j give genuinely different matrices. Over Q the nontrivial blocks WOULD be conjugate\
    \ under zeta -> zeta^{-1}, so the rational characteristic polynomial is char(M_0) times a norm\
    \ - but that conjugacy is destroyed by reduction into F_N, where zeta lives. Expected measurement:\
    \ deg(minpoly(M)) / B close to 1 on the equivariant arm AND on a matched non-equivariant null,\
    \ i.e. equivariance buys nothing for free.\n(C) WHAT IS THEREFORE THE RIGHT ALGORITHM, AND ITS\
    \ EXACT COST. Fold first.\n  plain Wiedemann on the closed B x B system: 2B matvecs at nnz each\n\
    \    = 2 B nnz.\n  Wiedemann on the single informative block (IDEA-20260807-0e4d83):\n    2 (B/g)\
    \ matvecs at nnz_lambda <= nnz/g each = 2 B nnz / g^2.\n  The fold itself: nnz field multiplications,\
    \ i.e. negligible, and it is\n  done ONCE.\nSo the honest recommendation is a factor g^2 = 9 in\
    \ linear-algebra operations for a preprocessing step costing one pass over the matrix - and the\
    \ entire content of this record is that the g^2 is NOT free, it is bought by a basis change, and\
    \ a solver that does not perform it pays the full 2 B nnz. This is a CONSTANT FACTOR. This record\
    \ claims nothing more than a constant factor and identifies no source of anything more.\n(D) THE\
    \ SECOND, SEPARABLE QUESTION: BLOCK WIEDEMANN'S BERLEKAMP-MASSEY STAGE. Coppersmith's block Wiedemann\
    \ with blocking factor n uses n projection vectors, reduces the sequence length to about B/n,\
    \ and requires a MATRIX Berlekamp-Massey on n x n matrix coefficients. If the blocking vectors\
    \ are chosen to be the g isotypic projections, the Krylov sequence DECOUPLES EXACTLY: the cross\
    \ terms vanish because M preserves each component, so the matrix sequence is diagonal and matrix\
    \ BM degenerates into g independent SCALAR Berlekamp-Masseys. Predicted effect: the BM stage cost\
    \ falls from the matrix-BM cost at blocking factor g to g times the scalar-BM cost, a factor of\
    \ about g^{omega - 1} where omega is the matrix multiplication exponent used inside matrix BM\
    \ - again a constant, again on a stage that is not the dominant one, and stated here because it\
    \ is a genuine structural consequence of equivariance that is separable from the block split and\
    \ has never been measured in this program.\n(E) LANCZOS INHERITS THE STRUCTURE, WHICH IS WORTH\
    \ ONE LINE AND NO MORE. Sigma is a permutation matrix, hence orthogonal, so M Sigma = Sigma M\
    \ implies M^T Sigma = Sigma M^T and therefore M^T M commutes with Sigma. The symmetrised operator\
    \ that block Lanczos runs on is equivariant too, and splits into the same g blocks. Same constants,\
    \ same conclusion; recorded so that nobody re-derives it as a new result.\n(F) THE TWO OUTCOMES,\
    \ BOTH DELIVERABLES.\n  OUTCOME 1 (predicted) - CASE COPRIME confirmed: deg(minpoly)/B near 1\
    \ on\n    both arms. The g^2 saving is real but must be bought; the lane's cost\n    model is\
    \ fixed at 2 B nnz / g^2 with a one-pass preprocessing charge;\n    and any claim of a free saving\
    \ is excluded with a measured number.\n  OUTCOME 2 - CASE SHARED: deg(minpoly)/B near 1/g on the\
    \ equivariant arm\n    and near 1 on the null. Plain Wiedemann terminates g times sooner\n   \
    \ without knowing anything about the curve. That is a genuine free\n    constant, it would apply\
    \ to any solver anyone already runs, and it would\n    need independent review before interpretation."
  resource_label: R1 + R3. R3 supplies the Z[phi]-module structure that makes M commute with Sigma;
    R1 is what makes Sigma buildable at all, since the orbit is generated by multiplying x-coordinates
    by zeta in F_p.
  admissibility: admissible
  admissibility_argument: 'Admissible on the same narrow ground as the rest of the lane: the object
    measured is the minimal polynomial over F_N of a matrix of field data, and the equivariance is
    produced by a field operation on x-coordinates rather than by group-oracle outputs. The ceiling
    is stated with the admissibility: the informational content of the equivariance is generic-group
    simulable (KN-FIND-b7e091 Oracle D), so no exponent can come from here and none is claimed. What
    is genuinely non-generic and genuinely useful is only the ability to build the orbit for one field
    multiplication instead of about log N group operations - a log-factor on a preprocessing step.'
  reachability_gate: 'T5''s isogeny-walk form does not apply: one curve, no movement. T4 binds: equivariance
    of order 3 requires D_0 = -3 and of order 2 (on x-coordinates) requires D_0 = -4, both class-determined
    and unreachable from a generic curve at any cost, so on a generic prime-field curve g = 1 and
    this record''s entire content reduces to its own baseline slice. Within the D_0 = -3 family the
    object is free: the fold costs nnz field multiplications, once. SCOPE NOTE, not an attack claim:
    secp256k1 has a = 0 and lies in the family.'
  inputs:
    procedure: 'STAGE 0 (zero compute): literature check for equivariant / block-circulant Wiedemann
      treatments. A positive hit is an ingredient. STAGE 1 (minutes, HARD GATE): the g = 1 fixture
      - companion matrix of known minimal polynomial degree through the whole pipeline, exact integer
      agreement. STAGE 2 (minutes, HARD GATE): the planted-shared-factor positive control. If a planted
      overlap is not detected, halt. STAGE 3 (minutes): assemble the square equivariant system with
      right-hand sides; assert M Sigma = Sigma M entrywise. STAGE 4 (minutes at toy B): deg(minpoly)
      by Krylov/BM over 20 random (u, v), cross-checked against an independent characteristic-polynomial
      computation; block minimal polynomials; pairwise overlaps. STAGE 5 (minutes): the four solver
      variants of STEP 5, with matvecs, field operations, wall time and peak memory each. STAGE 6
      (minutes): NULL 1, NULL 2, and the c-sweep using the generator of IDEA-20260807-1e673d. STAGE
      7 (an hour): the preconditioner tension experiment of STEP 7. All of it is toy-scale numpy and
      sympy; the binding constraint is the independent characteristic-polynomial cross-check, which
      caps the cross-checked cells at a few hundred columns.'
    mechanism: "STEP 1. Build the equivariant square system honestly. Harvest R >= B base relations\
      \ WITH right-hand sides, close under sigma, and form the B x B system. EV-STR-003 O-9 records\
      \ that no arm of the lane's history ever assembled a linear system with a right-hand side; this\
      \ record cannot proceed without one and says so up front.\nSTEP 2. Verify equivariance exactly:\
      \ assert M Sigma = Sigma M entrywise over F_N. This is a hard gate. EV-STR-002's commutation\
      \ check was a single-row heuristic (\"take first relation, shift it, check the shifted row exists\"\
      ), which is not the same statement.\nSTEP 3. Compute deg(minpoly(M)) exactly at toy B by the\
      \ Krylov/Berlekamp- Massey route with several random (u, v), taking the maximum, and CONFIRM\
      \ it independently against the characteristic polynomial computed by a different method (e.g.\
      \ Hessenberg or the Frobenius normal form at small B). Two independent computations, because\
      \ a single implementation of a quantity nobody in the lane has computed before is not a measurement.\n\
      STEP 4. Compute deg(minpoly(M_j)) for each isotypic block, and the pairwise gcds of the block\
      \ minimal polynomials. Report\n  overlap_j,k := deg gcd(minpoly(M_j), minpoly(M_k)) / min(deg_j,\
      \ deg_k).\nCASE COPRIME predicts overlap near 0; CASE SHARED predicts overlap near 1. This single\
      \ number decides the record.\nSTEP 5. Measure the actual iteration counts: number of matvecs\
      \ to termination for (a) plain Wiedemann on M, (b) Wiedemann on the informative block after\
      \ folding, (c) block Wiedemann with g random blocking vectors, (d) block Wiedemann with the\
      \ g isotypic projections as blocking vectors. Report matvecs AND field operations AND wall time\
      \ AND peak memory for each. For (c) versus (d), report the Berlekamp-Massey stage cost separately,\
      \ since (D) is a claim about that stage specifically.\nSTEP 6. The null: repeat everything on\
      \ a matched non-equivariant matrix of identical shape, density and column-orbit partition, and\
      \ on a matched SYNTHETIC equivariant matrix with no curve behind it. deg(minpoly)/B is predicted\
      \ identical on all three, which is the controlled null and the expected result.\nSTEP 7. The\
      \ preconditioner tension. Re-run (a) with a standard random diagonal preconditioner and confirm\
      \ that equivariance is destroyed (M Sigma != Sigma M after preconditioning) and that the block\
      \ route is then unavailable. Then construct an EQUIVARIANT preconditioner - a diagonal that\
      \ is constant on orbits - and measure whether it fixes Wiedemann's failure modes as well as\
      \ a random one does. This is a small, genuinely constructive piece of the record: if equivariant\
      \ preconditioning works, the block route and the preconditioner can coexist; if it does not,\
      \ they cannot, and that is a real limitation of the whole lane that nobody has stated."
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - NULL 1 - matched non-equivariant matrix, identical shape, density and column-orbit partition
  - NULL 2 - matched synthetic equivariant matrix with no curve behind it
  - planted shared factor of declared degree - must be detected exactly
  - g = 1 companion-matrix fixture of known minimal polynomial degree
  - c-sweep as the decay test for every equivariance-derived quantity
  - non-free-action control (a column fixed by sigma), where the clean g^2 accounting must fail
  - matched Pollard rho with negation and BSGS in group operations for the Pareto row
  - 'NULL OBJECT (from the proposal): MANDATORY AND BLOCKING. NULL 1 - MATCHED NON-EQUIVARIANT MATRIX:
    identical shape, density, row-weight law and column-orbit partition, but rows NOT closed under
    sigma. PREDICTED: deg(minpoly)/B near 1, identical to the equivariant arm. If the equivariant
    arm matches the null, CASE COPRIME is confirmed and the saving is not free - the controlled null
    IS the result. NULL 2 - MATCHED SYNTHETIC EQUIVARIANT MATRIX with no curve behind it, from the
    generator of IDEA-20260807-1e673d. PREDICTED: identical block overlap and identical deg(minpoly)/B
    to the curve arm, establishing that whatever is measured is a property of equivariance and not
    of elliptic curves. DECAY PARAMETER: the orbit closure fraction c. Every quantity claimed to follow
    from equivariance - block overlap, the exactness of the isotypic decoupling in (D), the vanishing
    of cross terms in the block Krylov sequence - must degrade monotonically as c falls from 1 to
    0, and must be indistinguishable from NULL 1 at c = 0. A quantity that survives c = 0 is not measuring
    equivariance. PLANTED POSITIVE: a synthetic equivariant matrix built so that its g blocks SHARE
    a declared common factor of declared degree. deg(minpoly) must come out short by exactly that
    degree. If the instrument cannot detect a planted shared factor it cannot detect CASE SHARED and
    every CASE COPRIME verdict it returns is void.'
  independent_variables: []
  metrics:
    primary:
    - deg(minpoly(M)) per cell, per arm, with the full 20-trial distribution
    - deg(minpoly(M_j)) for each block and all pairwise gcd degrees
    - matvecs, field operations, wall time and peak memory for all four solver variants
    - Berlekamp-Massey stage cost separately for random and isotypic blocking
    secondary:
    - cross-term magnitudes in the block Krylov sequence
    - entrywise equivariance assertion result
    - rank and rank deficiency of every system solved
    - c-sweep curves for every equivariance-derived quantity
    - matched rho and BSGS group-operation counts and BSGS memory
  heuristic_under_test: null
  preregistered_prediction:
    quantity: deg(minpoly(M)) / B on the equivariant arm
    formula: 'PREDICTED at least 0.9 (CASE COPRIME). A measured value below 1/g + 0.1, i.e. below
      about 0.43 for g = 3, is CASE SHARED and is the interesting outcome: it would mean plain Wiedemann
      gets a g-fold saving for free. Values between are inconclusive and are declared so in advance
      so that neither branch is reachable by rounding.'
    source: pre-registered in IDEA-20260807-fafc04 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - RANK DEFICIENCY. EV-STR-003 O-9 measured deficiencies 4, 6, 30, 67 on the phi arm. On a singular
    matrix minpoly acquires a factor t^k and Wiedemann's termination criterion changes; conflating
    a deficiency-driven degree with a structure-driven one would produce a spurious CASE SHARED. Deficiency
    must be reported per cell and deficient cells analysed separately.
  - SMALL N. At N about 2^17 and B about 200, Wiedemann's failure probability B/N is about 1/650 per
    trial - small but not negligible over hundreds of cells. The 20-trial maximum and the independent
    cross-check exist for this.
  - PRECONDITIONING DESTROYS EQUIVARIANCE. Standard Wiedemann practice multiplies by a random diagonal;
    that breaks M Sigma = Sigma M. Any wall-clock comparison against a production solver is comparing
    a preconditioned solver with an unpreconditioned one unless the equivariant preconditioner of
    STEP 7 works.
  - NON-FREE ORBITS. The point with x = 0 is fixed by phi. If it enters the factor base the action
    is not free, block dimensions are unequal, and the g^2 accounting is wrong. It must be excluded
    and the exclusion recorded.
  - MODEL VERSUS MEASURED OPERATIONS. EV-STR-003 recorded RT-CM-6 (non-comparable units) as OPEN.
    Matvecs, field operations and wall time are three different things and all three are required
    here precisely so that no comparison silently mixes them.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: 'PREDICTED at least 0.9 (CASE COPRIME). A measured value below 1/g + 0.1, i.e.
    below about 0.43 for g = 3, is CASE SHARED and is the interesting outcome: it would mean plain
    Wiedemann gets a g-fold saving for free. Values between are inconclusive and are declared so in
    advance so that neither branch is reachable by rounding.'
  falsification_criterion:
  - The g = 1 fixture disagrees with its known minimal polynomial degree. Implementation failure;
    halt; report as infrastructure under AGENTS.md rule 5 and never as mathematical evidence.
  - The planted shared factor is not detected. The instrument cannot see CASE SHARED and every CASE
    COPRIME verdict is void.
  - M Sigma != Sigma M entrywise at c = 1. The system is not equivariant and nothing downstream means
    what it claims - the row closure or the column permutation is wrong.
  - deg(minpoly)/B lands below 0.43 on the equivariant arm and near 1 on the null. CASE SHARED; this
    record's prediction is wrong; plain Wiedemann gets a free g-fold saving; independent review before
    any interpretation. This is the outcome the record would most like to be wrong about.
  - Cross terms in the isotypic-blocked Krylov sequence are nonzero at c = 1. The decoupling claim
    (D) is false as stated and the Berlekamp-Massey prediction is withdrawn.
  - The equivariant preconditioner fails to fix Wiedemann's failure modes while a random one succeeds.
    Then equivariance and preconditioning are incompatible in practice, the whole block route is unavailable
    to any production solver, and that is a real limitation of the lane which must be recorded prominently
    rather than buried.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
  assigned_to: executor
  approved_by: null
  approval_gate:
  - Coordinator approval required before execution; this contract is machine-derived from the proposal
    and is NOT approved.
  - If the proposal is proof-oriented, a proof_search_map is required before implementation or expensive
    experiments (KN-TECH-080).
  - If admissibility is inadmissible_generic_group, this contract is a RECORDED CLOSURE and must not
    be executed as an attack; it may be executed only as a baseline calibration, and its evidence
    record must say so.
