# EXP-ECDLP-c17d61
# Digit-count arithmetic. No curve point is added.
# Approved by DEC-20261004-55f316.
experiment:
  id: EXP-ECDLP-c17d61
  hypothesis_id: H-ECDLP-baf944
  source_idea: IDEA-20261004-2cdb01
  question_id: RQ-ECDLP-002
  version: 1
  title: Doubling count and addition count of the integer 8191
  status: approved
  frozen: true
  designed_at: '2026-10-04'
  approved_by: coordinator
  approval_decision_id: DEC-20261004-55f316
  objective: >-
    Check the counts 13, 12, and 12, the product 1872, and the nearby gap 0.
  inputs:
    bit_length: 13
    doublings: 12
    additions: 12
    length_gap: 1
    doubling_gap: 0
    digit_product: 1872
    digit_sum: 37
    nearby_a: 12
    nearby_b: 12
    nearby_gap: 0
    nearby_product: 144
  controls:
    - >-
      The bit length is 13. The doubling count is 12. The addition
      count is 12. Reporting the addition count as 13 drops the gap
      against the bit length and invalidates the run.
    - >-
      Thirteen exceeds twelve by 1. Twelve equals twelve, so that gap
      is 0. The product of 13, 12, and 12 is 1872. Their sum is 37.
    - >-
      Two readings of the addition count are both 12. Their gap is
      0 and their product is 144.
    - Two arithmetic routes. They must not import each other.
  independent_variables:
    - statistic in {gap, product, nearby}
    - route in {bits, subtract}
  metrics:
    primary:
      - bit_length
      - doublings
      - additions
      - implementations_agree
    secondary:
      - digit_product
      - digit_sum
      - nearby_gap
  heuristic_under_test: null
  preregistered_prediction:
    quantity: >-
      The integer 8191 has bit length 13, 12 doublings, and 12
      additions. The gap of two addition counts is 0.
    formula: >-
      Read the bit length 13. Count 12 doublings. Count 12 additions.
      Multiply 13, 12, and 12. Subtract 12 from 12.
    source: >-
      IDEA-20261004-2cdb01 states the counts 13, 12, and 12, read
      2026-10-04. The gaps, the product, and the sum were
      recomputed in this design session. That computation is not
      a run. No curve point was added.
  scale_relevance:
    tier: toy
    justification: One written integer. No transfer to a scalar multiplication.
    correspondence: null
  tail_checks:
    - The product 1872 and the nearby gap 0 are required. A check that stops at the bit length 13 is invalid.
  replication:
    seeds: []
    independent_instances: 2
    replication_note: Deterministic. The second run is the other arithmetic route.
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: null
    total_cpu_hours: null
    maximum_memory_gb: 1
    maximum_runs: 2
    maximum_workers: 1
  stopping_rules:
    - Stop after two runs.
    - If the addition count 12 disagrees, mark the attempt invalid.
    - A crash is incomplete, not a negative result.
  invalidation_rules:
    - Either route imports the other.
    - The two routes disagree.
    - The bit length is not 13.
    - The doubling count is not 12.
    - The addition count is not 12.
    - The product is not 1872.
    - The addition count is reported as 13, or a curve point is added.
  success_criterion: >-
    Both runs agree that the bit length is 13, that the doubling
    count is 12, that the addition count is 12, and that the product
    of those three counts is 1872.
  falsification_criterion: >-
    The runs agree that the addition count is computed, and that
    count is not 12.
  required_artifacts:
    - experiments/EXP-ECDLP-c17d61/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-ECDLP-c17d61/runs/<RUN-ID>/command.txt
    - experiments/EXP-ECDLP-c17d61/runs/<RUN-ID>/stdout.log
    - experiments/EXP-ECDLP-c17d61/runs/<RUN-ID>/stderr.log
    - experiments/EXP-ECDLP-c17d61/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-ECDLP-c17d61/runs/<RUN-ID>/certificate.yaml
  assigned_to: executor
  out_of_scope:
    - Any addition of a curve point or scalar recovery.
    - Any claim that a digit-count gap moves an exponent.
    - Any comparison with rho at cryptographic size.
    - The CERTBIN pricing design withheld by DEC-20261001-92f749.
