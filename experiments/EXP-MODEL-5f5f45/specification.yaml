experiment:
  id: EXP-MODEL-5f5f45
  hypothesis_id: null
  derived_from_idea: IDEA-20260807-fed641
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-cb71b5
  version: 1
  title: THE FACTOR BASE IS DEFINED BY THE COORDINATE, SO ASK WHAT A COARSER COORDINATE BUYS - a degree-n
    coordinate names n geometric points per coordinate value, so a degree-d membership polynomial
    appears to describe n*d points instead of 2d; the RATIONAL count is what matters and it is g*d
    with g the rational deck order, so on a prime-order curve every coordinate gives exactly 2d and
    the membership degree can never drop below |V|; the residue is the isogeny-pullback coordinate,
    whose apparent ell^(m-1) prize is quantified here and shown to evaporate twice over
  status: draft
  objective: "(A) THE QUESTION, POSED SHARPLY. The factor base in point-decomposition index calculus\
    \ is not a set of points chosen freely - it is the preimage of a set V of COORDINATE VALUES, and\
    \ the algebraic system encodes membership by a polynomial that vanishes on V. Two costs are therefore\
    \ tied to the coordinate:\n  (i) the DEGREE of the membership polynomial, which enters the Bezout\
    \ number\n  as d^(m-1) and the Groebner cost through the degree multiset;\n  (ii) the NUMBER OF\
    \ POINTS the factor base actually contains, which sets the\n  relation yield B^m/N and the linear-algebra\
    \ size.\nA coordinate whose map E -> P^1 has larger degree names more points per coordinate value\
    \ and so appears to improve the ratio B/d. This record asks exactly how much, and answers it.\n\
    (B) THE MEMBERSHIP-DEGREE CLOSURE, WHICH IS ELEMENTARY AND ABSOLUTE. For any coordinate f and\
    \ any finite V contained in P^1(F_p), the minimal polynomial vanishing exactly on V has degree\
    \ |V|, in every coordinate. A Moebius change of coordinate maps a set of size |V| to a set of\
    \ size |V| and a polynomial of degree |V| to one of degree |V| after clearing denominators. Therefore:\n\
    \  NO CHOICE OF DEGREE-2 COORDINATE CAN REDUCE THE MEMBERSHIP-POLYNOMIAL DEGREE\n  BELOW |V|.\
    \ The membership block of the degree multiset is a model invariant.\nThe only way around this\
    \ is for V itself to be describable by a lower-degree condition - i.e. for V to be a fibre of\
    \ some other low-degree map - which is exactly (C).\n(C) THE COARSE-COORDINATE TRADE, COMPUTED.\
    \ Let f have degree n and let V have size d. The factor base is f^(-1)(V), of GEOMETRIC size n*d.\
    \ Two regimes:\n  (C1) f Galois with deck group inside Aut(E,O), |Gamma| = n. Then\n  deg_{t}\
    \ S_m^f = n^(m-2) (IDEA-20260807-dadcd2 L1) and the Bezout number at\n  geometric factor-base\
    \ size B = n*d is n^(m-2)(B/n)^(m-1) = B^(m-1)/n. Larger\n  n is better - but n is bounded by\
    \ |Aut(E,O)| <= 6.\n  (C2) f non-Galois of degree n. Then deg_{t} S_m^f = n^(m-1) and the Bezout\n\
    \  number is n^(m-1)(B/n)^(m-1) = B^(m-1). Strictly worse than (C1) with n = 2\n  by a factor\
    \ 2, for every n. The Hessian x is the worked instance\n  (IDEA-20260807-5f5ace).\nSo the coarse-coordinate\
    \ idea has exactly one non-losing form: quotient by genuine automorphisms, capped at 6.\n(D) THE\
    \ ONE ESCAPE THAT LOOKS LIKE IT WORKS, AND THE TWO PLACES IT DIES. Let pi : E -> E/<T> be an F_p-rational\
    \ cyclic ell-isogeny and take f = x' o pi, the Weierstrass coordinate of the codomain pulled back.\
    \ Then deg f = 2ell, f is invariant under negation AND under translation by T, and a direct fibre\
    \ count gives deg_{t} S_m^f = 2^(m-2) - NO DEGREE PENALTY AT ALL despite n = 2ell. Naively B =\
    \ 2ell*d, so the Bezout number is 2^(m-2) d^(m-1) = B^(m-1)/(2 ell^(m-1)) - a factor ell^(m-1)\
    \ better than Weierstrass, GROWING WITH m. This is the single most attractive-looking construction\
    \ in L11 and it is exactly the escape route C2 that the inherited PO-001 analysis (inputs/refs/research/\
    \ proofs_Dreg_conservation_weil_invariance.md, section 1.5) calls \"the strongest surviving candidate\
    \ to break conservation\". It dies twice:\n  (D1) THE RATIONALITY DEATH, WHICH IS DECISIVE. The\
    \ geometric fibre is\n  {+-P + jT}, of size 2ell. Its RATIONAL part is what the factor base contains.\n\
    \  If T is not F_p-rational - which is forced when #E(F_p) is prime, and is the\n  generic situation\
    \ for an Elkies-prime isogeny where only the SUBGROUP <T> is\n  Galois-stable - then P + jT is\
    \ irrational for j != 0 and the rational fibre\n  is just {+-P}, of size 2. So B = 2d, not 2ell*d,\
    \ and the Bezout number is\n  B^(m-1)/2 - EXACTLY TIED with short Weierstrass. The prize was an\
    \ artifact of\n  counting geometric points as though they were rational. THIS IS THE NAMED\n \
    \ OBSTRUCTION AND IT IS ARITHMETIC, NOT GEOMETRIC.\n  (D2) THE LIFTING DEATH, WHICH WOULD HAVE\
    \ KILLED IT ANYWAY. Suppose T were\n  rational (a curve with a rational ell-torsion point, hence\
    \ cofactor at least\n  ell, hence not a cryptographic curve). Then B = 2ell*d and the Bezout gain\n\
    \  ell^(m-1) is real - but every solved coordinate tuple must be LIFTED, and\n  identifying which\
    \ of the (2ell)^(m-1) preimage combinations actually sums to\n  the target costs ell^(m-1) times\
    \ more than the 2^(m-1) of the Weierstrass\n  case. The two factors are exactly equal and opposite.\
    \ The construction is a\n  wash even in the arithmetic regime where it is available, UNLESS the\n\
    \  Groebner stage strictly dominates the lifting stage - which it does in\n  practice, and which\
    \ is the one honest regime in which this construction could\n  still win a constant. That regime\
    \ is measurable and is the actual experiment.\n  (D3) THE COMPENSATION THAT DOES NOT SAVE IT.\
    \ One might hope the relaxation\n  \"sum P_i = R + jT\" is usable after multiplying by ell, since\
    \ ell*T = O and\n  gcd(ell, N) = 1. It is - but it is moot, because by (D1) there is no\n  relaxation\
    \ to exploit over F_p in the prime-order case: the ambiguity class\n  <T> meets E(F_p) trivially,\
    \ so any rational solution already has j = 0.\n  Recording this is important because it is the\
    \ step at which a careless\n  version of this idea would claim a false gain.\n\n(E) THE THREE\
    \ OUTCOMES.\n  OUTCOME 1 - measured rational fibres have size 2 for the pullback coordinate\n\
    \    on a prime-order curve. (D1) confirmed, the coarse-coordinate route is\n    CLOSED with a\
    \ named arithmetic obstruction, and L11's factor-base question\n    is answered: no model gives\
    \ a cheaper membership test.\n  OUTCOME 2 - measured rational fibres have size 2ell. (D1) is wrong,\
    \ the\n    ell^(m-1) Bezout gain is real, and the lane REOPENS with an explicit\n    quantitative\
    \ target and a clear next experiment (measure whether the\n    Groebner saving beats the lifting\
    \ cost). This would be the most valuable\n    outcome in the whole lane and it is why the record\
    \ is filed rather than\n    assumed.\n  OUTCOME 3 - on a curve WITH rational ell-torsion, the\
    \ measured Bezout gain\n    is ell^(m-1) and the measured lifting cost is ell^(m-1): a wash confirming\n\
    \    (D2), with the residual question of which stage dominates being answered by\n    the measured\
    \ wall times. That is a real, if constant-factor, engineering\n    result about where index-calculus\
    \ time actually goes."
  resource_label: R1 (coordinate values as field data defining the factor base) and R2 (model / coordinate
    choice). The isogeny-pullback variant additionally touches R4 (the isogeny), but only to BORROW
    A FUNCTION - no curve is moved and no walk is performed, so the R4 use is a coordinate construction
    rather than a transport.
  admissibility: admissible
  admissibility_argument: 'ADMISSIBLE, with a caveat that must be stated because it is the kind of
    thing the campaign''s filter exists to catch. R1 and R2 escape the generic-group closure (KN-FIND-b7e091)
    because factor-base membership and polynomial degree are field-level facts a group-label simulator
    cannot produce. The R4 touch is NOT the inadmissible kind: the proposal does not apply an isogeny
    to points of G and read the images (which would be scalar multiplication by H-ENDO-001, and closed);
    it uses the isogeny only to define a rational FUNCTION on E, and the entire content is the degree
    and rationality of that function''s fibres. If a reviewer judges that pulling a coordinate back
    along an isogeny is "applying phi to points of G in disguise", the correct response is (D1) itself:
    the construction demonstrably yields no advantage, so nothing turns on the classification.'
  reachability_gate: 'TRIVIAL FOR THE COORDINATE, AND EXPLICITLY NON-TRIVIAL FOR ONE INGREDIENT, SO
    THIS RECORD STATES BOTH RATHER THAN LEAVING THE FIELD BLANK. The model change itself is free:
    choosing a coordinate on a fixed curve is a substitution, cost O(1), probability 1, no walk, no
    mixing time - T5 (DECOMPOSITION.md section 3) is passed vacuously and the curve, the points and
    the group never move. The ONE ingredient with a cost is the ell-isogeny used to BUILD the pullback
    coordinate: constructing it requires an F_p-rational cyclic ell-isogeny, found by factoring the
    modular polynomial Phi_ell(j, Y) or the ell-division polynomial, at cost polynomial in ell and
    log p - cheap for small ell and NOT a vectorization problem, because ANY rational ell-isogeny
    will do and no specific target curve is required. That is the "goodness is common enough to hit"
    branch of T5, not the "specified curve" branch, so even this ingredient does not invoke the p^(1/4)
    barrier. The gate is therefore passed, and the construction''s failure in (D1) is arithmetic rather
    than a reachability cost.'
  inputs:
    procedure: 'STAGE 1 (minutes, THE DECISIVE STEP): construct the isogeny-pullback coordinate on
      a prime-order 16-bit curve and histogram its rational fibres by exhaustive enumeration of E(F_p).
      This alone settles (D1). STAGE 2 (minutes, POSITIVE CONTROL): the same on a cofactor-ell curve;
      histogram must concentrate at 2ell. STAGE 3 (minutes): membership-degree measurement across
      all coordinates at fixed rational B. STAGE 4 (an hour): Bezout numbers and measured lifting
      costs per arm at m = 3, 4. STAGE 5 (an hour): wall-time split between Groebner and lifting per
      arm. STAGE 6 (minutes): the two nulls and the ell-sweep decay test.'
    mechanism: 'STEP 1 - THE RATIONAL FIBRE HISTOGRAM, WHICH IS THE WHOLE EXPERIMENT IN ONE MEASUREMENT.
      Take a toy curve E/F_p of PRIME order with an F_p-rational cyclic ell-isogeny for a small Elkies
      prime ell (found by checking which small ell give a rational kernel polynomial factor). Construct
      f = x'' o pi explicitly as a rational function on E using Velu''s formulas. Enumerate E(F_p)
      exhaustively at 16 bits, evaluate f on every point, and histogram |f^(-1)(t) cap E(F_p)| over
      all attained t. PREDICTED: the histogram is concentrated at 2, with 1 at the branch points.
      If it shows 2ell anywhere, (D1) is false. STEP 2 - THE SAME ON A CURVE WITH RATIONAL ell-TORSION.
      Construct a toy curve with a rational point of order ell (cofactor at least ell), repeat the
      histogram. PREDICTED: concentrated at 2ell. This is the positive control that the instrument
      can see a large rational fibre at all - without it, a concentration at 2 in Step 1 proves nothing
      about the mechanism. STEP 3 - THE MEMBERSHIP-DEGREE CHECK. For each coordinate in the lane''s
      model set, build a factor base of a fixed RATIONAL size B, express V in that coordinate, and
      compute the degree of the minimal vanishing polynomial. PREDICTED: exactly B/2 in every degree-2
      coordinate, exactly B/(2ell) in the pullback coordinate on the cofactor curve of Step 2, and
      exactly B/2 in the pullback coordinate on the prime-order curve of Step 1. STEP 4 - THE BEZOUT
      AND LIFTING LEDGER. For each arm compute the Bezout number from the measured degrees, and MEASURE
      the lifting cost as the actual number of group operations spent identifying the correct preimage
      combination per solved tuple. Report both columns side by side. PREDICTED on the cofactor curve:
      Bezout down by ell^(m-1), lifting up by ell^(m-1), product unchanged. STEP 5 - WHICH STAGE DOMINATES.
      Measure the wall time split between the Groebner stage and the lifting stage in each arm. This
      is the only place where the construction of (D) could still deliver a constant, and the measurement
      is the honest way to find out. PREDICTED: Groebner dominates by orders of magnitude at these
      sizes, so the wash of (D2) is not actually a wash in wall time - and the record must then state
      clearly that this apparent gain exists only on curves with cofactor at least ell, i.e. never
      on a prime-order curve, so it is not transportable. STEP 6 - THE NULLS. Random-Moebius null
      (must leave every count unchanged) and a RANDOM degree-2ell rational function with no isogeny
      structure (its rational fibre histogram must be irregular, confirming that a concentrated histogram
      is a structural fact and not an artifact of evaluating any high-degree map).'
    instrument: harness/isogeny_class.py, harness/exp_icinv.py and the lane runners under harness/;
      pure Python with sympy and numpy, no Sage
  controls:
  - ell = 1 baseline reproducing the Weierstrass numbers exactly
  - cofactor-ell curve as the positive control for a large rational fibre
  - random degree-2ell rational function as the matched null
  - random-Moebius null per IDEA-20260807-4fc635
  - the same construction over F_{p^k} with the kernel rationalised, as the boundary control showing
    where the conclusion stops holding
  - 'NULL OBJECT (from the proposal): MANDATORY. Matched null - a RANDOM rational function on E of
    the same degree 2ell, constructed without isogeny structure (e.g. a random ratio of forms of matched
    degree), with the same rational-fibre histogram measured on the same curve. It has the same shape
    - same degree, same domain, same field - and it isolates "isogeny pullback" from "high-degree
    map". DECAY PARAMETER: ell. As ell grows, any genuine effect attributable to the isogeny structure
    must scale with ell in the predicted way (rational fibre 2 always, geometric fibre 2ell); a measured
    quantity that does NOT respond to ell is measuring the evaluation code, not the mathematics. SECOND
    NULL - the same construction over F_{p^k} where the kernel becomes rational, which must show the
    fibre size JUMP to 2ell. Both directions are required: the instrument must fail to see a large
    rational fibre where there is none and must see one where there is.'
  independent_variables: []
  metrics:
    primary:
    - rational fibre histogram per coordinate per curve
    - geometric fibre size, computed separately, so the two are never conflated
    - membership polynomial degree at fixed rational B
    - Bezout number per arm
    secondary:
    - measured lifting group operations per solved tuple
    - Groebner versus lifting wall-time split
    - the Elkies-primality check result for each candidate ell
  heuristic_under_test: null
  preregistered_prediction:
    quantity: rational fibre size histogram of the isogeny-pullback coordinate on a PRIME-ORDER toy
      curve
    formula: Concentrated at EXACTLY 2 (with 1 at branch points), never 2ell. A single rational fibre
      of size greater than 2 falsifies (D1) and reopens the lane.
    source: pre-registered in IDEA-20260807-fed641 before any run under this contract; never tuned
      to data
  scale_relevance:
    tier: toy
    justification: 'Toy scale only: p up to ~2^17 for full isogeny-class enumeration (which is O(p^2))
      and up to ~2^20 for single-curve work. Evidence from any run under this contract is capped at
      claim_tier: toy and may not be presented as crypto-scale validation (AGENTS.md rule 7).'
    correspondence: null
  tail_checks:
  - 'GEOMETRIC VERSUS RATIONAL COUNTING. This is THE confounder of the record and the reason it exists;
    both quantities must be measured and reported in separate columns, never merged. The corpus has
    an inherited near-miss here: PO-001''s C2 note reasons about a degree-2 rational map without asking
    about the rationality of its fibres.'
  - ELKIES VERSUS ATKIN PRIMES. Whether a rational cyclic ell-isogeny exists at all depends on ell
    being Elkies for the curve; a null result obtained because no isogeny existed is not evidence
    about fibres.
  - A curve with cofactor ell is not a cryptographic curve, so Stage 2 and every conclusion drawn
    from it are scoped to non-prime-order curves.
  - Exhaustive enumeration of E(F_p) is feasible only at toy scale; at 16 bits it is about 65000 points
    and trivial, at 32 bits it is 4 billion and is not. The histogram method does not scale and the
    record says so rather than promising it will.
  - Lifting cost measured in group operations is implementation-dependent; the RATIO between arms
    is the metric, not the absolute count.
  replication:
    seeds:
    - 20260807
    - 20260808
    - 20260809
    independent_instances: 3
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: 0.5
    maximum_memory_gb: 8
    maximum_runs: 20
  stopping_rules:
  - Stop at maximum_runs or total_cpu_hours, whichever binds first.
  - 'Stop immediately if the instrument fails its two-directional control (EXP-INSTR-2d32ba): measurements
    taken with a failed instrument are attempted_and_inconclusive, never evidence.'
  - Stop and escalate to an independent review-adversarial session if any arm appears to exceed the
    automorphism-discounted rho baseline (GOAL-ENDO-001 pause condition P3).
  invalidation_rules:
  - A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is NEVER negative mathematical evidence (AGENTS.md rule 5).
  - 'An isogeny-class enumeration whose Hurwitz-Kronecker census fails makes the run invalid: a variance
    measured over an incomplete class is meaningless.'
  - Any claimed solve or relation whose certificate fails independent re-verification makes the run
    completed_invalid.
  success_criterion: Concentrated at EXACTLY 2 (with 1 at branch points), never 2ell. A single rational
    fibre of size greater than 2 falsifies (D1) and reopens the lane.
  falsification_criterion:
  - A rational fibre of size greater than 2 appears for the pullback coordinate on a prime-order curve.
    (D1) is false; the lane REOPENS with an explicit ell^(m-1) target. This is the outcome to hope
    for and it is why the record exists.
  - The cofactor-ell positive control does NOT show fibre size 2ell. The instrument cannot see the
    effect and the prime-order negative is uninterpretable; nothing is reported.
  - A membership polynomial of degree below B/2 is found in any coordinate. (B) is false and that
    would be a real discovery.
  - The measured lifting ratio is materially below ell^(m-1) on the cofactor curve. (D2) is wrong
    and the construction wins a constant even where it is available.
  - Velu construction verification fails. Infrastructure; nothing reported.
  - The random degree-2ell null also shows a concentrated fibre histogram. The histogram is not measuring
    isogeny structure and the interpretation collapses.
  required_artifacts:
  - manifest.yaml with command, commit, dirty-tree state, environment
  - raw-result.json with every per-curve measurement, not just summaries
  - the null-object arm's measurements, in the same file as the signal arm
  - certificates for every claimed solve or relation
